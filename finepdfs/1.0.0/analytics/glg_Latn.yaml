  e Kevin G\u00f3mez foron os outros dous representantes do conxunto de Nigr\u00e1n
  que completaron esta proba \u00e1 que acudiron todos os equipos profesionais do
  pelot\u00f3n luso.\\n\\nClasificaci\u00f3n xeral da proba: preme aqu\u00ed\\n\\n1
  / 1\"", "\"ANEXO VII\\n\\nDECLARACI\u00d3N DE COMPROMISO EN RELACI\u00d3N COA EXECUCI\u00d3N
  DE ACTUACI\u00d3NS DO PLAN DE RECUPERACI\u00d3N, TRANSFORMACI\u00d3N E RESILIENCIA
  (PRTR).\\n\\nPROGRAMA B. SUBVENCI\u00d3NS PARA A MELLORA DAS COLECCI\u00d3NS BIBLIOGR\u00c1FICAS
  EN FORMATO F\u00cdSICO DO PLAN DE RECUPERACI\u00d3N, TRANSFORMACI\u00d3N E RESILIENCIA\\n\\nCT235A-
  SUBVENCI\u00d3NS A ENTIDADES LOCAIS DE GALICIA TITULARES DE BIBLIOTECAS E/OU AXENCIAS
  DE LECTURA P\u00daBLICAS INTEGRADAS NA REDE DE BIBLIOTECAS P\u00daBLICAS DE GALICIA.\\n\\nDATOS
  DA ENTIDADE SOLICITANTE\\n\\nENTIDADE LOCAL\\n\\nNIF\\n\\nE, NA S\u00daA REPRESENTACI\u00d3N(deber\u00e1
  acreditarse a representaci\u00f3n fidedigna por calquera medio v\u00e1lido en dereito)\\n\\nNIF\\n\\nNOME\\n\\nPRIMEIRO
