  Observatorio Galego de Dinamizaci\u00f3n Demogr\u00e1fica, creado polo Decreto 104/2016,
  do 28 de xullo.\"", "\"CINCO RATI\u00d1OS\\n\\nT\u00edtulos relacionados\\n\\nCATARINA
  E O OSO, SEN RUMBO POLO MUNDO PIEPER, CHRISTIANE\\n\\nMARIA GIR\u00d3N\\n\\nSINOPSE\\n\\nUn
  \u00e1lbum actual ideal para contar co sabor dos contos tradicionais.\\n\\nCinco
  rati\u00f1os \u00e9 un relato r\u00edtmico e divertido que remite aos temas e estruturas
  da tradici\u00f3n oral: protagonistas animais, triunfo da audacia e do pequeno fronte
  ao grande, uso de f\u00f3rmulas de repetici\u00f3n, personaxes que se eliminan ou
  se incorporan progresivamente \u00e1 acci\u00f3n (subtracci\u00f3n-adici\u00f3n),
  rima e ritmo\u2026...\\n\\n\u00c9 hora de merendar e cinco rati\u00f1os saen xuntos
  \u00e1 busca de algo que levar \u00e1 boca. Un a un van quedando polo cami\u00f1o,
  s\u00f3 F\u00e9lix contin\u00faa ata que, de s\u00fapeto, todo comeza a dar voltas\u2026\\n\\nPACO
  (GALEGO) PAULA CARBALLEIRA;BLANCA BARRIO\\n\\nDINOSAURIO BELISARIO ALVAREZ CACCAMO,
  XOSE MARIA\"", "\"AUTORIZACI\u00d3N PARA O TRATAMENTO DE IMAXES DO ALUMNADO PARA
  O CURSO ESCOLAR 2024-2025\\n\\nNome e apelidos\\n\\nNIF:\\n\\nAutorizo \u00e1 EASD
  Ram\u00f3n Falc\u00f3n dependente da Conseller\u00eda de Cultura, Educaci\u00f3n,
  Formaci\u00f3n Profesional e Universidades e de acordo coas condici\u00f3ns e termos
  indicados a continuaci\u00f3n a realizar a captaci\u00f3n e difusi\u00f3n de imaxes,
  fotograf\u00edas, v\u00eddeos, v\u00eddeos con voz, material gr\u00e1fico, etc.
  (en diante, as imaxes) do alumno/a coa finalidade de promover as actividades e eventos
  festivos, conmemorativos, deportivos ou culturais, organizados polo centro docente
  e realizados tanto dentro como f\u00f3ra deste.\\n\\nA publicaci\u00f3n das imaxes
  poderase realizar a trav\u00e9s das seguintes canles ou medios de difusi\u00f3n
  da actividade do centro e da Conseller\u00eda de Cultura, Educaci\u00f3n, Formaci\u00f3n
  Profesional e Universidades (sinale cun X se autoriza ou non):\\n\\n| P\u00e1xina
  web do centro: https://escoladeartelugo.com/ | SI |\\n|---|---|\\n| Instagram do
  centro: https://www.instagram.com/easd_lugo | SI |\\n| Redes sociais: https://www.facebook.com/easd.lugo
  e https://twitter.com/easd_lugo | SI |\\n| Documentos ou memorias de actividades,
  revista do centro, tr\u00edpticos ou carteis ou montaxes multimedia de promoci\u00f3n
  de actividades. | SI |\\n| Outros: https://www.youtube.com/user/ramonfalconlugo
  | SI |\\n\\nA presente autorizaci\u00f3n entenderase feita a t\u00edtulo gratu\u00edto
  e as imaxes ser\u00e1n conservadas durante o tempo necesario para a consecuci\u00f3n
  das finalidades indicadas ou no seu caso, en tanto as persoas interesadas non retiren
  o consentimento outorgado.\\n\\nEn Lugo, a de\\n\\nde 20\\n\\nAsdo.: O/A alumno/a\"",
  "\"En Santiago de Compostela, a m\u00e9rcores 17 de febreiro de 2021.\\n\\nPrezados/as,\\n\\nDende
  a Xunta Directiva de Escena Galega dirix\u00edmonos a v\u00f3s no comezo deste ano
  2021 que agardamos esperanzador para o noso sector e a nosa profesi\u00f3n, pero
  cheo tam\u00e9n de retos e incertezas que nos afectan a todos e todas. Temos o convencemento
  de que nos vindeiros meses comezaremos a ver a luz ao final do t\u00fanel da crise
  sanitaria, social e econ\u00f3mica da Covid-19, pero cremos tam\u00e9n que debemos
  sa\u00edr dela traballando en conxunto, dende a colaboraci\u00f3n necesaria cos
  distintos axentes implicados no sector esc\u00e9nico profesional galego.\\n\\nNun
  momento no que os espazos culturais acaban de reabrir en Galicia despois dunhas
  semanas de peche da nosa e a vosa actividade queremos por medio deste escrito trasladarvos
  aos e \u00e1s profesionais da programaci\u00f3n cultural d\u00faas cuesti\u00f3ns
  que consideramos moi importantes.\\n\\nEn primeiro lugar, queremos facervos chegar
  no noso nome e no de todas as compa\u00f1\u00edas produtoras que conformamos a asociaci\u00f3n
  o noso agradecemento polo voso compromiso coa programaci\u00f3n cultural, co tecido
  esc\u00e9nico profesional galego e co dereito das persoas a desfrutar dunha cultura
  segura, ao mesmo tempo apoiando a supervivencia dun sector que depende en enorme
  medida da contrataci\u00f3n nos vosos espazos.\\n\\nEn segundo lugar, queremos facervos
  part\u00edcipes tam\u00e9n da situaci\u00f3n interna do sector, relativa sobre todo
  \u00e1 relaci\u00f3n das compa\u00f1\u00edas produtoras co seu persoal contratado.
  As 44 empresas produtoras que neste momento conforman a nosa asociaci\u00f3n asinan
  e cumpren un Regulamento Interno que, entre outras moitas cuesti\u00f3ns, obriga
  \u00e1s nosas socias a operar dentro do marco que marcan os convenios colectivos
  vixentes en Galicia, no noso caso 2: o Convenio Colectivo Auton\u00f3mico de Eventos,
  Servizos e Produci\u00f3ns Culturais de Galicia e o Convenio de Actores e Actrices
  de Teatro de Galicia.\\n\\nA respecto deste segundo queremos facervos part\u00edcipes
  dunha actualizaci\u00f3n nas t\u00e1boas salariais dos actores e actrices de espect\u00e1culos
  dun 10% durante o ano 2021 (un 7% dende o 1 de xaneiro e un 3% dende o 1 de xullo)
  Esta porcentaxe d\u00e9bese a unha suba salarial do 5% pactada no 2012 que nunca
  se chegou a aplicar, sumada a outro 5% derivado da actualizaci\u00f3n do IPC nos
  \u00faltimos anos, e que nunca se chegara a aplicar tampouco.\\n\\nA AAAG (Asociaci\u00f3n
  de Actores e Actrices de Galicia) xunto con sindicatos UXT, CCOO e CIG convocaron
  a Mesa Paritaria no \u00faltimo trimestre do ano, reivindicando esta actualizaci\u00f3n
  nun momento tan fr\u00e1xil para as compa\u00f1\u00edas. Non \u00e9 necesario dicir
  o que na peor crise das \u00faltimas d\u00e9cadas sup\u00f3n para o sector unha
  suba de nada menos que o 10%. A\u00ednda as\u00ed, por responsabilidade e por considerar
  que se trataba dunha reivindicaci\u00f3n xusta do persoal art\u00edstico, que tam\u00e9n
  est\u00e1 sufrindo moi intensamente esta crise, dende Escena Galega aceptamos esta
  actualizaci\u00f3n.\\n\\nPodedes acceder \u00e1s t\u00e1boas salariais correspondentes
  ao ano 2021 na seguinte ligaz\u00f3n:\\n\\nhttp://aaag.gal/storage/resources/rates/attachment/e1d53dea-tarifas-teatro-2021.pdf\\n\\nTraslad\u00e1mosvos
  esta situaci\u00f3n pois polo de agora as compa\u00f1\u00edas est\u00e1n asumindo
  integramente esta suba salarial do persoal art\u00edstico nas funci\u00f3ns contratadas
  para os primeiros meses do ano (por exemplo na Rede Cultural da Deputaci\u00f3n
  da Coru\u00f1a ou na RGTA), pero \u00e9 moi posible que nas novas contrataci\u00f3ns
  de funci\u00f3ns vexades un pequeno incremento nos cach\u00e9s dos espect\u00e1culos,
  nomeadamente aqueles nos que haxa varios actores e actrices en contrato. A suba
  salarial por suposto abrangue non s\u00f3 as funci\u00f3ns sen\u00f3n tam\u00e9n
  os periodos de ensaio dos espect\u00e1culos.\\n\\nSen m\u00e1is, recibide un cordial
  sa\u00fado.\\n\\nAgardamos seguir v\u00e9ndonos nos teatros.\\n\\n#CulturaSegura
  #NonNosCanceles #Apoia\u00c1EscenaGalega\\n\\nA XUNTA DIRECTIVA DE ESCENA GALEGA\\n\\nJuan
  Rodr\u00edguez (Caramuxo Teatro) Presidente\\n\\nMar\u00eda Torres (Elefante Elegante)
  Vicepresidenta\\n\\nGuillermo Carbajo (Redrum Teatro) Secretario\\n\\nAnxo Manoel
  (Lucec\u00fas Teatro) Tesoureiro\\n\\nGustavo Del R\u00edo (Os N\u00e1ufragos Teatro)
  Vogal\\n\\nSantiago Cortegoso (Ibuprofeno Teatro) Vogal\\n\\nPaula Quintas (Traspediante)
  Vogal de danza e artes do movemento\\n\\nESCENA GALEGA (Asociaci\u00f3n Galega de
  Empresas de Artes Esc\u00e9nicas) \u00e9 o colectivo de referencia para o sector  das
  produtoras de artes  esc\u00e9nicas en Galicia, contando neste momento con 44 compa\u00f1\u00edas
  asociadas: produtoras de teatro, novo circo e danza e artes do movemento que conforman
  un gran escaparate da calidade e variedade da nosa escena actual, sendo ao mesmo
  tempo a asociaci\u00f3n empresarial m\u00e1is aglutinadora e extensa en n\u00famero
  de compa\u00f1\u00edas de todas as existentes da s\u00faa tipolox\u00eda nas diferentes
  CCAA.\"", "\"CURSO 2021/22\\n\\nClasificaci\u00f3n do noso alumnado na Olimp\u00edada
  galega de Matem\u00e1ticas: Jos\u00e9 Valle (2\u00ba Bach) medalla de bronce e Irene
  Armesto (1\u00ba Bach) e Yago S\u00e1nchez (2\u00ba Bach), menci\u00f3ns de honra.\\n\\nDe
  esquerda a dereita: Irene Armesto, Jos\u00e9 Valle e Yago S\u00e1nchez\\n\\nLa Voz
  de Galicia\"", "\"DESIR\u00c9E VILA\\nAtleta\\n\\nGa\u00f1adora de campionatos galegos
  e nacionais e participante en campionatos do mundo en categor\u00edas base de ximnasia
  deportiva.\\n\\nCampioa de Espa\u00f1a en 100 metros e salto de lonxitude en categor\u00eda
  paral\u00edmpica.\\n\\nCO\u00d1ECENDO AS NOSAS DEPORTISTAS\\n\\nDesir\u00e9e Vila\\nGondomar,
  15 de xu\u00f1o de 1998\\nCampioa de Espa\u00f1a en 100 m, 60 m e salto de lonxitude\\nD\u00e1
  conferencias motivacionais.\\nVai participar nos Xogos Paral\u00edmpicos de Toquio
  2021.\\nEscribiu o libro Lo \u00fanico incurable son las ganas de vivir.\\nEstudou
  turismo e actualmente cursa Relaci\u00f3ns Internacionais.\\n\\nAta os 16 anos Desir\u00e9e
  competiu en ximnasia acrob\u00e1tica como deportista de elite, pero logo dun accidente
  comeza a practicar atletismo adaptado.\\n\\nComo \u00e9 o deporte que realiza?\\n\\nDesir\u00e9e
  participa nas probas de velocidade de 100 metros, 60 metros e tam\u00e9n en salto
  de lonxitude.\\nPara poder realizar estas probas emprega unha pr\u00f3tese de competici\u00f3n
  distinta da que usa na s\u00faa vida diaria.\\nCompite na categor\u00eda para persoas
  que sofren amputaci\u00f3n ou deficiencia nunha ou en varias articulaci\u00f3ns
  debido a enfermidade, traumatismo ou deficiencia conx\u00e9nita da extremidade.\\n\\nOs
  deportes paral\u00edmpicos abranguen un amplo campo de actividades para persoas
  con discapacidade que participan en competici\u00f3ns deportivas a distintos niveis.\\nSab\u00edas
  que o Equipo Paral\u00edmpico Espa\u00f1ol participou en 22 edici\u00f3ns dos Xogos
  Paral\u00edmpicos (13 de ver\u00e1n e 9 de inverno), nas que conseguiu 694 medallas?\\n\\nA
  continuaci\u00f3n achegamos cinco cuesti\u00f3ns para saber m\u00e1is do deporte
  feminino, que ao longo do tempo non tivo o reco\u00f1ecemento que merec\u00eda.\\n\\n1.
  A regatista Ellen Patricia MacArthur obtivo en 2005 o r\u00e9cord mundial absoluto
  de circunnavegaci\u00f3n da terra en solitario. Procura informaci\u00f3n das seguintes
  mulleres relacionadas co mar:\\n   T\u00e1mara Echegoyen, Isabel Barreto, Gloria
  Lij\u00f3, \u00c1ngeles Alvari\u00f1o.\\n\\n   Sab\u00edas que as regatistas galegas
  son unha potencia mundial?\\n   Procura os nomes das medallistas ol\u00edmpicas
  galega nas probas de vela.\\n\\n2. Ata o ano 2012 Arabia Saudita, Qatar e Brunei
  non inscrib\u00edan mulleres nos Xogos Ol\u00edmpicos, porque facer deporte non
  era \u201cadequado\u201d para a muller.\\n   Que lle dir\u00edas \u00e1 xente que
  ten esta forma de pensar?\\n\\n3. A primeira deportista en acender a chama do caldeiro
  ol\u00edmpico foi Enriqueta Basilio en M\u00e9xico 1968.\\n   Podes investigar cantas
  deportistas tiveron esta honra?\\n\\n4. Nos Xogos Ol\u00edmpicos da Antig\u00fcidade
  en Grecia as mulleres ti\u00f1an prohibido participar... pero pod\u00edan observar.\\n   Cales
  foron os primeiros xogos nos que as mulleres participaron en igualdade de condici\u00f3ns?\\n\\n5.
  O primeiro 10 nunha proba dos Xogos Ol\u00edmpicos conseguiuno Nadia Comanenci en
  ximnasia.\\n   Pescuda quen foi Nadia Comanenci.\\n\\nCUESTIONARIO\\n\\nUnha deportista
  que admiras?\\n\\nAlmudena Cid, primeiro porque tivo que loitar nun deporte complicado,
  e superar moit\u00edsimos obst\u00e1culos para chegar tan alto. Segundo porque fixo
  historia participando en catro xogos ol\u00edmpicos, e terceiro porque soubo reinventarse
  cando rematou a s\u00faa carreira deportiva e seguir acadando logros de maneira
  profesional.\\n\\nQue fas logo de adestrar?\\n\\nNormalmente vou \u00e1 universidade
  antes de adestrar, e como o fago pola tarde, cando termino o adestramento s\u00f3
  me quedan forzas para cear, ducharme e deitarme. Antes de durmir g\u00fastame ler
  ou, se te\u00f1o alg\u00fan exame, estudar, pero normalmente son moito m\u00e1is
  produtiva para o traballo da universidade e o meu traballo como aut\u00f3noma polas
  ma\u00f1\u00e1s.\\n\\nUn consello?\\n\\nCando as cousas se po\u00f1en dif\u00edciles,
  \u00e9 importante que nos lembremos a n\u00f3s mesmas por que estamos a facer o
  que estamos a facer, \u00e9 dicir: por que estou a sacrificar tantas cousas? Cal
  \u00e9 o meu obxectivo? Como de preto estou de logralo? Que beneficios vou ter unha
  vez o alcance? Porque nos momentos malos e complicados, lembremos todo iso vai ser
  o que nos axude a ter a motivaci\u00f3n que precisamos para seguir loitando.\\n\\nCal
  \u00e9 o primeiro recordo do teu deporte?\\nDo atletismo o primeiro recordo que
  te\u00f1o \u00e9 da primeira vez que adestrei soa nunhas pistas de atletismo de
  Malta que estaban feitas un desastre, e recordo que cansaba moit\u00edsimo e tecnicamente
  corr\u00eda fatal, e pensaba que era moit\u00edsimo m\u00e1is dif\u00edcil do que
  parec\u00eda nos v\u00eddeos das competici\u00f3ns dos meus rivais nas que me fixaba,
  pero ti\u00f1a moitas ganas por aprender, adestrar e mellorar.\\n\\nUn so\u00f1o
  profesional?\\nSer un referente no mundo do deporte para persoas con discapacidade,
  para motivar outros mozos e mozas con discapacidade a non po\u00f1erse l\u00edmites
  e a buscar a s\u00faa mellor versi\u00f3n dentro do deporte. Creo que a competitividade,
  o compa\u00f1eirismo e, en xeral, todos os valores do deporte son esenciais para
  o noso crecemento persoal como persoas con discapacidade dentro dun mundo que a\u00ednda
  non est\u00e1 concienciado con este tema ao 100%. Gustar\u00edame axudar, co meu
  exemplo, a que estes prexu\u00edzos desaparezan e se conciba os deportistas con
  discapacidade como \\\"deportistas\\\", sen m\u00e1is.\\n\\nComo ves o papel da
  muller no deporte?\\nA presenza da muller no deporte \u00e9 cada vez m\u00e1is evidente
  e m\u00e1is importante. As mulleres demostramos ser grandes deportistas, e aumenta
  a nosa presenza en medios de comunicaci\u00f3n e marcas.\\n\\nDesir\u00e9e Vila
  escribiu a autobiograf\u00eda *Lo \u00fanico incurable son las ganas de vivir*.
  Unha autobiograf\u00eda \u00e9 a escritura da propia vida por parte da autora. Procura
  informaci\u00f3ns sobre estas mulleres que tam\u00e9n escribiron as s\u00faas autobiograf\u00edas.\\n\\nMichelle
  Obama, Isabel Allende, Wangari Maathai, Malala, Virginia Woolf\\n\\nEscribe un relato
  autobiogr\u00e1fico ou, se prefires, obt\u00e9n informaci\u00f3n dalgunha muller
  da t\u00faa familia e escribe unha biograf\u00eda dela.\\n\\nSab\u00edas que Desir\u00e9e
  Vila \u00e9 imaxe dunha boneca que est\u00e1 caracterizada cunha pr\u00f3tese?\\n\\nColorea
  esta deportista.\\n\\n\u201cNecesitamos ter obxectivos para ter unha raz\u00f3n
  para loitar\u201d\\nDesir\u00e9e Vila\\n\\nXUNTA DE GALICIA\\nVICEPRESIDENCIA E
  CONSELLER\u00cdA DE PRESIDENCIA,\\nADMINISTRACI\u00d3NS P\u00daBLICAS E XUSTIZA\\nSecretar\u00eda
  Xeral da Igualdade\""]'
