sample: '["\"O tempo en Tadotsu\\n\\ns\u00e1bado 16 de xaneiro, 2021\\n\\nDescarga\\n\\n18
  km/h\\n\\nHora por hora en Tadotsu Predicci\u00f3n para las pr\u00f3ximas horas\\n\\nHoxe:\\n\\n06\\n\\n5\u00b0\"",
  "\"SESI\u00d3N ORDINARIA DA XUNTA DE GOBERNO LOCAL DO D\u00cdA 3 DE SETEMBRO DE
  2019\\n\\nNo despacho de Alcald\u00eda do Concello de Cambre, \u00e1s nove horas
  do d\u00eda tres de setembro de dous mil dezanove, baixo a presidencia do se\u00f1or
  alcalde don \u00d3scar A. Garc\u00eda Pati\u00f1o, re\u00fanese a Xunta de Goberno
  Local, co fin de realizar a sesi\u00f3n ordinaria convocada para o efecto.\\n\\nAsisten  os  concelleiros  que  a  continuaci\u00f3n  se  relacionan,  segundo  nomeamento  efectuado
  mediante Resoluci\u00f3n da Alcald\u00eda n\u00famero 1315/2019, de data 1 de xullo
  do ano que andamos: Juan Gonz\u00e1lez Leir\u00f3s, dona L\u00faa Sangui\u00f1edo
  \u00c1lvarez, dona Elisa Pestonit Barreiros, don Miguel \u00c1ngel Guti\u00e9rrez
  Nieto, don Daniel Mallo Castro, dona Maria Dolores Pan Lesta e don Diego Alcantarilla
  Rei.\\n\\nFaise constar que asisten tam\u00e9n ao acto don Ram\u00f3n Boga Moscoso,
  concelleiro con delegaci\u00f3n especial dos servizos de Turismo e Patrimonio, inclu\u00eddos
  na \u00c1rea de Presidencia; dona Maria Carmen  Pan  Matos,  concelleira  con  delegaci\u00f3n  especial  do  servizo  de  Desenvolvemento
  Asociativo,  inclu\u00eddo  na  \u00e1rea  de  Presidencia;  dona  M\u00f3nica  Varela  Germade,  concelleira  con
  delegaci\u00f3n especial do servizo de Cultura, inclu\u00eddo na \u00e1rea de Cultura,
  Deportes e Xuventude; e dona Patricia Mar\u00eda Parcero Qui\u00f1oy, concelleira
  con delegaci\u00f3n especial dos servizos de Medio Ambiente e Mobilidade, inclu\u00eddos
  na \u00e1rea de Educaci\u00f3n, Medio Ambiente, Mobilidade e Sanidade; isto en aplicaci\u00f3n
  do disposto no artigo 133.3 do Regulamento org\u00e1nico municipal.\\n\\nInterv\u00e9n
  como secretaria accidental dona M\u00aa del Juncal Cap\u00edn Fonseca.\\n\\nAberto  o  acto  pola  presidencia,  examinaronse  os  asuntos  inclu\u00eddos  na  orde  do  d\u00eda  da
  convocatoria.\\n\\n1\u00ba. Aprobaci\u00f3n, se procede, dos borradores das actas
  das sesi\u00f3ns ordinaria de data 27 de agosto de 2019 e extraordinaria e urxente
  da Xunta de Goberno Local do d\u00eda 29 de agosto de 2019\\n\\nO se\u00f1or presidente
  pregunta aos asistentes se desexan formular algunha observaci\u00f3n ao borrador
  da acta correspondente \u00e1 sesi\u00f3n ordinaria da Xunta de Goberno Local de
  data 27 de agosto de 2019 e, ao non se formular, a Xunta de Goberno Local, por unanimidade
  dos oito membros que a compo\u00f1en, aprobou o citado borrador.\\n\\nO se\u00f1or
  presidente pregunta aos asistentes se desexan formular algunha observaci\u00f3n
  ao borrador da acta correspondente \u00e1 sesi\u00f3n extraordinaria e urxente da
  Xunta de Goberno Local de data 29 de agosto de 2019 e, ao non se formular, a Xunta
  de Goberno Local, por unanimidade dos oito membros que a compo\u00f1en, aprobou
  o citado borrador.\\n\\n2\u00ba. Bolet\u00edns e correspondencia\\n\\n- Escrito
  de  don  Ra\u00fal Varela  Fraguio,  en  representaci\u00f3n  de dona Sandra S\u00e1nchez  Vieites,
  concelleira do grupo municipal Alternativa dos Veci\u00f1os, rexistrado de entrada
  o d\u00eda 2 de setembro\\n\\nde 2019 co n\u00famero 999/1336, no que comunica que
  dona Sandra S\u00e1nchez Vieites estar\u00e1 ausente do termo municipal do d\u00eda
  6 ao 17 de setembro de 2019.\\n\\n3\u00ba Informe das resoluci\u00f3ns ditadas pola
  alcald\u00eda e polos concelleiros delegados da \u00e1rea dende a anterior Xunta
  de Goberno Local\\n\\nOs presentes danse por enterados das resoluci\u00f3ns da alcald\u00eda
  e conceller\u00edas delegadas de \u00e1rea ditadas dende o d\u00eda 23 ao 29 de
  agosto do ano que andamos, que comeza coa resoluci\u00f3n da Alcald\u00eda n\u00famero
  1707/2019 e remata coa resoluci\u00f3n da concelleira delegada da \u00e1rea de Servizos
  e Seguridade Cidad\u00e1 n\u00famero 1757/2019, segundo se relaciona a seguir:\\n\\n|
  N\u00ba decreto | Data sinatura | Asunto |\\n|---|---|---|\\n| 1707/2019 | 23-08-2019
