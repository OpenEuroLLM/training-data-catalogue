  e Historia |\\n|  | de Galicia |\\n|  | M\u00e9todos Estat\u00edsticos |\"", "\"Acoller,
  adoptar, apostar pola vida\\n\\nO trasno\\n\\nDaniel L\u00f3pez Mu\u00f1oz\\n\\nCatedralizar
  o litoral? Eremitizar o resto?\\n\\nNa carreira das ocorrencias a Xunta de Galicia
  propuxo estender a todas as praias do pa\u00eds o modelo da praia das catedrais.
  Os alcaldes con praia, a trav\u00e9s da FEGAMP, rexeitaron semellante idea. A Xunta
  recuou.\\n\\nA cousa consist\u00eda nunha aplicaci\u00f3n do m\u00f3bil para reservar
  d\u00eda e praia nunha plataforma chamada \u201cpraias seguras\u201d. Coma na ITV.
  Haber\u00eda que ter un m\u00f3bil intelixente e saberse manexar, planificar a cousa,
  usar un c\u00f3digo QR cando cheg\u00e1s \u00e1 praia, conquistar un recuncio de
  dous por dous, a dous metros m\u00ednimo dos recuncios veci\u00f1os, norte, sur,
  leste e oeste e, ve\u00f1a, a torrase legalmente.\\n\\nSe cadra, polo aquel da distancia
  social, a vantaxe destes sistemas \u00e9 que excl\u00faen de entrada a quen non
  te\u00f1a a intelixencia no seu m\u00f3bil, sen\u00f3n na s\u00faa cabeza e nas
  cousas que antes eran as importantes, parvadas como coidar da vida, da xente, da
  leira e dos netos. Ch\u00e1malle a fenda dixital e afecta m\u00e1is aos maiores,
  \u00e1s mulleres e \u00e1 xente de aldea. Vaia, vaia, aqu\u00ed non hai praia.\\n\\nA
  cousa era polo virus este e a desescalada. Pero arrep\u00eda s\u00f3 pensar no \u201cmoldelo
  Catedrais\u201d. Masivo, tecnol\u00f3xico, motorizado, gregario. Ringleiras de coches,
  ru\u00eddo a esgalla, reas de xente disfrazada de sendeirista, po, suor e ferro\u2026
  o turista cabalga. E un dubida se algunha cabeza dirixente non cavilar\u00e1 en
  catedralizar de Camposancos \u00e1 ponte dos Santos, unha costa de chiringos, atascos
  e presa por fotografalo todo, sen gastar un can nos negocios locais. A lume de carozo
  e bocata de choped de Mercadona no fardel. E co cat\u00e1logo de todas as praias
  de Galicia no m\u00f3bil! Mi ma!\\n\\nC\u00f3mpr\u00e9 facer do virus unha oportunidade
  e cambiar o rumbo. Porque, falando do territorio e do seu equilibrio, mira que non
  hai sitio na Galicia interior para promover alternativas ben seguras, nin xente
  al\u00ed vivindo con boas casas de comidas e de durmidas. Porque a Galicia interior
  non \u00e9 un kalahari con eremitas esparexidos, vaites.\\n\\nTampouco \u00e9 que
  os mil r\u00edos nazan a dous quil\u00f3metros do mar, era boa. Nin \u00e9, por
  suposto, que os Ancares, o Courel, o macizo central, a Enci\u00f1a da Lastra, a
  Ribeira Sacra, o Xur\u00e9s ou o Ribeiro, a Terra de Montes ou a Fonsagrada, Celanova
  ou o alto Mi\u00f1o etc, etc\u2026 non sexan sorprendentes. Nin que os mil r\u00edos,
  os cen mil sendeiros, fragas e fervenzas; os miradoiros, as aldeas, os petr\u00f3glifos
  e a nosa xente, non sexan unha regalia.\\n\\nPero hai quen ten o \u201cmodelo\u201d
  dentro.\\n\\nHai quien pregunta e demanda onde estivo, onde est\u00e1 Deus no medio
  desta pandemia. Ben para reivindicar a s\u00faa inutilidade, o seu anacronismo ou,
  en sentido contrario, a s\u00faa ira viva e presente, esa que c\u00f3mpre aplacar
  con diversos m\u00e9todos, alg\u00fans dos cales rompen, por certo, as normas de
  confinamento. Son o anverso e o reverso, a cara e a cruz da mesma idea infantil
  e infantilizante do divino: un \u201cdeus exmachina\u201d, disposto e capaz dunha
  acci\u00f3n portentosa e inesperada que rompa o gui\u00f3n da pel\u00edcula, da
  historia humana, do acontecer, das leis da natureza.\\n\\nDeus \u00e9 gratuito,
  pero non superfluo, dic\u00eda o t\u00edtulo do te\u00f3logo Gonz\u00e1lez Ruiz.
  Non \u00e9 \u201cnecesario\u201d, por suposto, no sentido de agardar ou implorar
  intervenci\u00f3ns portentosas. Tampouco \u00e9 necesario no sentido de que achegue
  soluci\u00f3ns m\u00e1xicas e receitas precisas de orde sanitaria, sociol\u00f3xica
  ou cient\u00edfica para solucionar os problemas que a humanidade provoca.\\n\\nNon
  hai presenza portentosa, directa, nin se espera, grazas a Deus. O cristianismo seculariza
  a historia e a natureza. S\u00f3 cabe, e cabe ben para quen te\u00f1a esa sensibilidade,
  a lectura simb\u00f3lica, a emoci\u00f3n po\u00e9tica fronte \u00e1 fermosura natural,
  o abraio fronte ao misterio da beleza.\\n\\nO lugar de Deus no cristianismo orixinal
  \u00e9 a fraternidade humana en acto. O baixar do cabalo do samaritano, a acollida
  radical, a ruptura dos prexu\u00edzos cando hai que identificarse co d\u00e9bil,
  o desapego mesmo da propia vida, ese desfacerse polos outros que \u00e9 a morte
  en cruz.\\n\\nA fe \u00e9 unha inspiraci\u00f3n para a vida das persoas e as comunidades
  que aceptan e a cultivan. Non hai m\u00e1is \u201cactuaci\u00f3n divina\u201d ca
  a fraternidade humana. E se est\u00e1 ben organizada en sistemas e instituci\u00f3ns
  de solidariedade, pois mellor a\u00ednda. E non \u00e9 pouco. A iso ch\u00e1manlle
  a teolox\u00eda das mediaci\u00f3ns. Se algunha \u201cactuaci\u00f3n\u201d se pode
  agardar de Deus, ser\u00e1 indirecta, mediada polo comportamento humano. Por iso
  Deus non \u00e9 superfluo, nin a fe persoal \u00e9 unha banalidade.\\n\\nNo medio
  da pandemia o lugar de Deus, a inspiraci\u00f3n de Deus, est\u00e1 na curaci\u00f3n
  das feridas, na recuperaci\u00f3n da cat\u00e1strofe, no esforzo colectivo, no cuidado
  persoal, nos que non fan negocio (tampouco \u201cnegocio pol\u00edtico\u201d) a
  costa do coronavirus, sen\u00f3n servizo na loita contra el.\\n\\n\u00c9 o mesmo
  lugar no que est\u00e1 Deus nas outras pandemias: na pandemia da fame (desas 30
  000 persoas que morren diariamente por falta de alimento); a pandemia da xenofobia
  contra inmigrantes e refuxiados; a pandemia da desigualdade econ\u00f3mica: e a
  pandemia da destruci\u00f3n dos nosos ecosistemas, destruci\u00f3n alentada polo
  ego\u00edsmo xeracional nuns tempos de abundancia material.\\n\\nNon hai m\u00e1is
  \u201cactuaci\u00f3n divina\u201d ca a fraternidade humana. E se est\u00e1 institucionalizada,
  mellor a\u00ednda.\\n\\nA concepci\u00f3n neoliberal do Estado como o conxunto de
  estruturas p\u00fablicas m\u00ednimas necesarias ao servizo da econom\u00eda privada,
  que \u00e9 a chamada a producir mellor e m\u00e1is eficazmente os bens e servizos
  necesarios, estase mostrando fallida na resoluci\u00f3n dos problemas que acosan
  a humanidade e a propia especie. O neoliberalismo fracasa porque, lonxe de reducir
  a fenda de desigualdade econ\u00f3mica, social e de x\u00e9nero, afonda nela e faina
  medrar ata extremos inasumibles desde o punto de vista \u00e9tico ou humano. Ese
  proceso crecente est\u00e1 resultando incompatible cunha m\u00ednima e imprescindible
  estabilidade social e incluso coa viabilidade econ\u00f3mica do propio modelo. Velaqui
  a crise profunda do sistema, que ve\u00f1en anunciando tantos prof\u00e9ticos analistas
  desde hai ben tempo. Fracasa tam\u00e9n o modelo neoliberal pola s\u00faa incapacidade
  pasada e presente de dar resposta adecuada \u00e1 maior ameaza que nos afecta como
  especie: o perigo, certo e pr\u00f3ximo, de extinci\u00f3n do x\u00e9nero humano
  no planeta. \u00c9 dicir, que estamos chegando ao punto no que a continuidade da
  vida na Terra ser\u00e1 incompatible coa nosa especie e, polo tanto, aparece no
  horizonte a s\u00faa inviabilidade. Este problema, lonxe de atallalo, o modelo neoliberal
  o que fai \u00e9 agravalo.\\n\\nDe feito, na crise do coronavirus ambos os fracasos
  do neoliberalismo aparecen intimamente ligados, pois esta pandemia ten a s\u00faa
  orixe, est\u00e1 claro, na sobreexplotaci\u00f3n econ\u00f3mica salvaxe dos recursos
  naturais, coa conseguinte ruptura do equilibrio e das fronteiras naturais entre
  as especies. E aqu\u00ed reaparece a utilidade dos Estados. Os \u00fanicos, con
  todos os erros, carencias e dificultades, que est\u00e1n sendo capaces de afrontar
  o problema global e transversal desta pandemia en todo o mundo. E fano a pesar da
  s\u00faa debilidade crecente, causada polas estratexias neoliberais desenvolvidas
  globalmente, con especial virulencia, desde os anos oitenta do pasado s\u00e9culo.\\n\\nAs
  grandes empresas, oligopolios e corporaci\u00f3ns, industriais ou financeiras, que
  se foron facendo con gran parte do poder f\u00e1ctico global a base de minguar a
  influencia e o poder dos Estados, fracasan na abordaxe e resoluci\u00f3n dos nosos
  problemas cardinais. Porque eles miran por eles, os problemas son nosos e o Estado
  somos n\u00f3s. Esta \u00e9 seguramente a fundamental lecci\u00f3n que esta crise
  nos deixa. Agora queda por ver se damos aprendido e somos capaces de recuperar a
  forza e o poder do Estado, que somos n\u00f3s, e a preeminencia do p\u00fablico
  que, con toda evidencia, \u00e9 o noso.\\n\\nCon todos os erros, os Estados son
  os \u00fanicos que est\u00e1n sendo capaces de afrontar esta pandemia.\\n\\nA vaqui\u00f1a
  polo que vale\\n\\nEisejuaz ou a esquizofrenia pol\u00edtica espa\u00f1ola\\n\\nPedro
  F. Pedrouzo Devesa\\n\\nEisejuaz \u00e9 un indio mataco no que se inspirou a escritora
  arxentina Sara Gallardo para escribir, en 1971, unha novela desconcertante na que
  se narra a chamada divina que recibe Eisejuaz a trav\u00e9s dunha lagarta, e que
  lle fai renunciar a todo. Sara Gallardo \u00e9 unha das grandes antecesoras da excelente
  xeraci\u00f3n actual de escritoras latinoamericanas que lentamente se vai consolidando
  nos cat\u00e1logos das nosas editoriais. Eisejuaz \u00e9 un punto de ruptura entre
  o mundo ind\u00edxena e o extractivismo occidental: \u201c(...) b\u00f3tanos de
  aqu\u00ed. Necesitan a terra para plantar ca\u00f1a. Pero \u00e9 mellor as\u00ed.\u201d\\n\\nUn
  choque entre dous mundos e d\u00faas formas de entender o vivir. E como a cabeza
  \u00e9 caprichosa e fai asociaci\u00f3ns curiosamente rid\u00edculas, non podo evitar
  pensar no momento econ\u00f3mico e pol\u00edtico que vivimos, tan absurdo como inexplicable,
  no que un Estado de alarma, que \u00e9 en esencia unha figura centralizadora de
  competencias auton\u00f3micas, \u00e9 case salvado por un partido independentista...,
  a cambio dunha reforma laboral, mentres outros grupos nacionalistas se abstenen
  porque \u201cnon poden avalar a teimos\u00eda da centralizaci\u00f3n\u201d. E non
  podo m\u00e1is que identificarme coa esquizofrenia eisejuaziana na que se converteu
  o escenario pol\u00edtico en Espa\u00f1a. Todos parecen actuar racionalmente, pero
  o resultado conxunto dista de ser racional, e en ning\u00fan caso \u00e9 \u00f3ptimo.\\n\\n\u201cTodos
  os homes temos a cegueira como triste heran\u00e7a\u201d, escribe Gallardo durante
  o decurso da s\u00faa novela. Lentamente, vaise abrindo o escenario para unhas novas
  elecci\u00f3ns xerais, por sermos incapaces de formar gobernos estables. O poleiro
  est\u00e1 cada vez m\u00e1is alterado e as decisi\u00f3ns t\u00f3manse en tempo
  de desconto, cunha \u00ednfima marxe de votos. Os espelidos son os que saen ga\u00f1ando.
  O dur\u00edsimo impacto que vai ter a pandemia na nosa econom\u00eda s\u00f3 se
  poder\u00e1 afrontar se mutuamente reco\u00f1ecemos os espazos de representaci\u00f3n
  de cada partido. O enorme rescate europeo necesitar\u00e1 acordos b\u00e1sicos com\u00fans
  e m\u00ednimos nos que PSOE, PP, Podemos e Ciudadanos obrigatoriamente ter\u00e1n
  que sentar na mesma mesa, porque necesitamos definir que imos rescatar, como e para
  que, e os partidos nacionalistas deber\u00e1n asegurar a eficacia e a coherencia
  do dese\u00f1o e execuci\u00f3n nos distintos territorios.\\n\\nO discurso frontista
  ten o encanto da coherencia cega... Un encanto ao que os nosos pol\u00edticos, de
  dereita e de esquerda, parecen abonados, ao non distinguir a ideolox\u00eda dos
  prexu\u00edzos.\\n\\nO peto do santo Ant\u00f3n\\n\\nManolo Regal Ledo\\n\\nV\u00f3s
  podedes so\u00f1ar\\n\\nBen o sabedes, pero por se hai alg\u00fan despistado, pres\u00e9ntome:
  son o santo Ant\u00f3n e vivo niso que v\u00f3s chamades o al\u00e9n. Desde hai
  un pouqu\u00edn tempo cart\u00e9ome convosco porque as\u00ed mo solicitou o voso
  Manolo Regal. F\u00e1goa con gusto.\\n\\nA \u00faltima carta que vos mandei foi
  de polos d\u00edas do Nadal. E va\u00eda a que armastes desde aqueles d\u00edas!
  Nos meus paseos matinais \u2013son moi ma\u00f1anceiro\u2013, ollando para Galicia,
  sorprendeume que todo estivese triste e parado, ag\u00e1s ao redor das vosas residencias
  sanitarias e mais das da terceira idade. Deseguida se espallou por aqu\u00ed a nova
  do COVID-19, das infecci\u00f3ns, das mortes, dos vell\u00ed\u00f1os e vell\u00ednas
  que morr\u00edan a centos, a miles. Puiden conversar aqu\u00ed, no al\u00e9n, con
  alg\u00fans deles, que pouco m\u00e1is sab\u00edan ca que morreran. G\u00fcstalles
  falar, sobre todo, dos familiares que non puideron despedir.\\n\\nAqu\u00ed andamos
  preocupados por v\u00f3s. Par\u00e9cenos que o voso estilo de vida, de traballo,
  de producir, de consumir, de pasar o tempo, de administrar os recursos ten moito
  que ver co que vos pasa: unha infecci\u00f3n tan r\u00e1pida e xeneralizada, tanta
  dor e morte, tanto problema econ\u00f3mico que afectar\u00e1 coma sempre, seguro,
  \u00e1 xente que ten menos recursos, tanta liorta entre a xente que deber\u00eda
  estar fortemente unida para amparar a sorte de todos. Oxal\u00e1 atopedes as maneiras
  de lle dar cara \u00e1 cousa. Desde aqu\u00ed entendemos que non hai outra sen\u00f3n
  querervos moito, sen exclusi\u00f3n ningunha, e desde a\u00ed estar dispostos a
  so\u00f1ar en compartir m\u00e1is canto m\u00e1is un te\u00f1a. \u00c9 so\u00f1ar,
  verdade? Pero tedes que so\u00f1ar, sen\u00f3n non hai Deus que vos salve!\\n\\nE
  so\u00f1ar con so\u00f1os amorosos, deses que levan a investir no com\u00fan tempos,
  esforzos, loitas e tam\u00e9n gozos e festexos. \u00c9 unha hora grande a que estad\u00e9s
  a vivir. Poder\u00eda ser tam\u00e9n unha hora de firmes cambios de ritmo. O voso
  sistema non os vai promover porque sempre \u00e9 avarento. Pero v\u00f3s podedes
  facelo. Non deixedes de ler a carti\u00f1a que o papa Francisco o d\u00eda da Pascua
  lles mandou aos irm\u00e1ns e irm\u00e1s das comunidades populares, entre as que
  eu vos conto.\\n\\nApertas. Todo o noso alento. Recordos de Carvalho Calero, sempre
  cos seus versos m\u00edsticos na man; agora entende. Non para de falar en galego;
  aqu\u00ed todos entendemos todo, pero cadaqu\u00e9n fala como lle prace.\\n\\nDe
  coraz\u00f3n. O voso santo Ant\u00f3n.\\n\\nO CARRABOUXO por Jos\u00e9 Lois\\n\\nPRAIA
  DE SAMHE 500\\n\\n\\\"AUTORIZASE O F\u00daTBOL, PERO A PORTA PECHADA\\\" ORDIA,
  E COMO ENTRAN OS GOLES?\\n\\nO peto com\u00fan\\n\\nRam\u00f3n e o seu acorde\u00f3n\\n\\nJosecho
  de la Torre\\n\\nSen a\u00ednda sa\u00edr do desconcerto e a incerteza que reina
  nesta pandemia, ser\u00eda unha verdadeira m\u00e1goa deixar no esquecemento a multitude
  de xestos e acci\u00f3ns espont\u00e1neas que xurdiron por parte da cidadan\u00eda
  -as m\u00e1is co\u00f1ecidas- e a nivel individual. Non sa\u00edron na televisi\u00f3n
  ou, de facelo, non tiveron gran repercusi\u00f3n, pero lograron algo que hoxe non
  resulta com\u00fan: facer veci\u00f1anza, po\u00f1erlle ao mal tempo m\u00fasica,
  humor e amosar que \u00e1inda \u00e9 posible desandar cami\u00f1os que nos foron
  deshumanizando.\\n\\nRam\u00f3n Soage \u00e9 un deses \u201crostros an\u00f3nimos
  e espont\u00e1neos.\u201d Naceu na parroquia de Ard\u00e1n, en Mar\u00edn, e actualmente
  vive no centro da vila. Ademais de sacar adiante a familia xunto \u00e1 s\u00faa
  compa\u00f1eira Sole, dedicouse \u00e1 m\u00fasica, tocando durante m\u00e1is de
  cententa anos na orquestra Tambo, da que foi un dos dous fundadores. Xubilado dende
  hai poucos anos, foi recuperando o tempo que a vida da orquestra quita xusto cando
  os demais m\u00e1is disponen del. E nesas chegou o virus. Certo que Ram\u00f3n nunca
  soltou as mans dos teclados definitivamente, pero o que nunca imaxinaria \u00e9
  que entre os centos de concertos que ofreceu en d\u00e9cadas, os m\u00e1is emotivos
  non chegar\u00edan subido a un escenario, sen\u00f3n desde a terraza da s\u00faa
  casa. O 23 de marzo, coincidindo cos aplausos \u00e1s 8.00 h da tarde e despois
  de varios d\u00edas sa\u00edndo a aplaudir, botou ao lombo un dos moitos acorde\u00f3ns
  que garda e sali\u00f3 \u00e1 terraza que se albisca desde os edificios contiguos
  e c\u00e9ntricos de Mar\u00edn pola parte interior da vivenda. Aquel \u00eda ser
  o primeiro de case dous meses diarios entretendo a xente e combatendo as novas do
  desalento; puntual\u00ed\u00f1o \u00e1s oito, era recibido con ovaci\u00f3ns e despedido
  entre \u201coutra, outra\u201d ata case esgotar o repertorio...\\n\\nM\u00e1is al\u00f3
  da festa diaria na terraza, foron compart\u00edndose v\u00eddeos das s\u00faas actuaci\u00f3ns,
  chegando a outra xente que non pod\u00eda velo; ademais atendeu a dedicatorias,
  lembranzas, onom\u00e1sticas, aniversarios e \u00e1nimos personalizados a enfermos
  por coronavirus. O 10 de maio, na v\u00e9spera do cambio de fase, Ram\u00f3n fixo
  o \u00faltimo concerto do confinamento pechando a porta da terraza para abrir a
  da r\u00faa e atoparse cuns veci\u00f1os agradecidos que debuxaban aquela frase
  de Einstein que dic\u00eda \u201cUnha vida dedicada aos demais merece ser vivida.\u201d
  \u00c9 por iso que entre o mal recordo que a moitos deixar\u00e1 esta situaci\u00f3n,
  estar\u00e1 o recordo, cando menos diferente, daqueles que acud\u00edan cada d\u00eda
  \u00e1 fiestra para escotitar a Ram\u00f3n e o seu acorde\u00f3n.\\n\\nRumores de
  esperanza\\n\\nXan Guill\u00e9n\\n\\nCando chegamos ao n\u00famero mil de Irimia,
  dix\u00e9ronnos que \u00edan darlle un pulo \u00e1 Irimia dixital. Era dif\u00edcil
  non caer na tentaci\u00f3n de quedar no mundo da internet e esquecer o papel, pero
  seguimos podendo rachar o pl\u00e1stico cando chega \u00e1 caixa de correo e acari\u00f1ando
  a nosa revista. De todos os xeitos, como dic\u00eda hai case quince anos un amigo
  meu, o que non est\u00e1 na rede non existe, e Irimia existe na rede.\\n\\nVe\u00f1o
  de dar unha volta pola nova p\u00e1xina web (Irimia.gal) e d\u00e1 gusto vela. Sinxeli\u00f1a,
  xeitosi\u00f1a, f\u00e1cil de usar... Algo que non \u00e9 frecuente en moitas webs
  que andan por a\u00ed e que son coma eseis fa\u00edados cheos de cousas que se van
  acumulando e que chega un momento no que non se sabe cando chegaron a\u00ed... D\u00e1
  a sensaci\u00f3n de familiaridade e de que o asunto est\u00e1 ben coidado.\\n\\n\u00c9
  que neste tempo que estamos por rematar tivemos que aprender moitas cousas, sobre
  todo da rede. Tivemos que botar man da fiestra virtual para ver o noso mundo e c\u00f3ido
  que aprendemos d\u00faas cousas. Esta fiestra tam\u00e9n hai que coidala. Se queremos
  que o mundo virtual sexa \u00fatil, temos que ter un pouco de sentido\u00edo e organizaci\u00f3n.
  Ademais aprendemos que o mundo \u00e9 m\u00e1is grande que unha pantalla e que \u00e9
  marabilloso sentir o aire na cara. Cando neste desconfinamento vaiadeis \u00e1 praia,
  pechade a pantalla e os ollos e sent\u00edodo. Un luxo de felicidade.\\n\\nREDES
  CRISTIANAS emitiu un comunicado ante as declaracions do Secretario Xeral da Conferencia
  Episcopal, contrario \u00e1 implantaci\u00f3n do salario universal. Cren que manifesta
  unha insensibilidade social inaceptable e vai en contra do traballo desenvolvido
  por C\u00e1ritas e outras entidades a prol dunha renda m\u00ednima garantizada e
  suficiente. A situaci\u00f3n de emerxencia social, a escaseza de traballo e os factores
  que defenden a medida chocan co argumento da CEE de que pode disuadir da busca de
  emprego.\\n\\nTam\u00e9n en apoio da RENDA B\u00c1SICA varios colectivos lanzaron
  a campa\u00f1a \u201cNin Risga, nin Ingreso M\u00ednimo Vital. Renda b\u00e1sica
  xa! para esixir ese dereito como resposta \u00e1 emerxencia sanitaria. A crise do
  coronavirus revelou a ineficacia das pol\u00edticas sociais, namentres a Risga,
  de cont\u00eda claramente insuficiente, non serve para erradicar a pobreza nin cubrir
  as necesidades b\u00e1sicas. A Renda b\u00e1sica prop\u00f3nse como garant\u00eda
  dunhas condici\u00f3ns de vida digna para conquistar colectivamente outros dereitos.\\n\\nEn
  2007 un grupo de franciscanos inicia en Toulouse os C\u00cdRCULOS DO SILENCIO como
  reacci\u00f3n fronte \u00e1 violencia contra as persoas migrantes. A s\u00faa \u00e9
  unha acci\u00f3n non violenta solidaria que denuncia as leis contrarias aos dereitos
  humanos e as pol\u00edticas migratorias. Pretenden concienciar sobre o sufrimento
  e inxustiza das persoas migrantes, promover a solidariedade e mobilizar a cidadan\u00eda
  para procurar unha resposta de xustiza e dignidade para elas. En Galicia re\u00fanense
  en Pontevedra, Vigo e Santiago.\\n\\nA Secretar\u00eda Xeral da Emigraci\u00f3n
  puxo en marcha a AULA GALICIA ABERTA, con catro seminarios en li\u00f1a (baile,
  gaita, percusi\u00f3n de man e canto e percusi\u00f3n tradicional). Tr\u00e1tase
  de obradoiros p\u00fablicos e de balde que non precisan inscrici\u00f3n nin co\u00f1ecementos
  previos e que se desenvolver\u00e1n ata xu\u00f1o (https://emigracion.xunta.gal/es/actividad/aula-galiciaaberta).
  Outras escolas de m\u00fasica tradicional do pa\u00eds comezaron tam\u00e9n aulas
  a trav\u00e9s de distintas canles en internet, como a E-trad de Vigo.\\n\\nPasear
  a p\u00e9 polo contorno exterior da MURALLA de Lugo, reservado case na s\u00faa
  totalidade ao tr\u00e1nsito rodado, comeza a ser unha realidade. Durante a crise
  do COVID-19, pechouse o carril m\u00e1is pr\u00f3ximo \u00e1 muralla, que foi inmediatamente
  ocupado por bicicletas, pat\u00edns, corredoras e paseantes en solitario ou en familia.
  Mais esta medida inicialmente provisional vaise converter en permanente. Esta decisi\u00f3n
  \u00fa\u00f1ese \u00e1 xa prevista peonalizaci\u00f3n completa doutros dous tramos
  da ronda que rodea a muralla.\\n\\nOs actos reivindicativos nas r\u00faas lev\u00e1ronse
  este ano 2020 \u00e1s fiestras, balc\u00f3ns e, sobre todo, \u00e1s redes sociais.
  O mesmo destino parece que ter\u00e1n os actos que, con ocasi\u00f3n do D\u00eda
  do orgullo LGTBI, ter\u00e1n lugar na fin de semana do 26 ao 28 de xu\u00f1o e o
  d\u00eda 28 d\u00eda conmem\u00f3ranse os disturbios de Stonewall (Nova York) de
  1969, que marcaron o inicio do movemento de liberaci\u00f3n homosexual. O Festival
  Agrocuir da Ulloa, que este ano chegar\u00eda \u00e1 s\u00faa 7\u00aa edici\u00f3n,
  tam\u00e9n fica neste intre en espera.\\n\\nAs nosas FESTAS POPULARES est\u00e1n
  este ver\u00e1n no aire. Algunhas foron directamente suspendidas (as de gran aforo)
  e a maior\u00eda quedan a expensas da evoluci\u00f3n do COVID-19. Non obstante,
  parece que as que se celebren optar\u00e1n por acomodarse a formatos reducidos,
  con aforo limitado de p\u00fablico, sentado e respectando a distancia de seguridade,
  combinado con contidos en streaming, compartidos en internet.\\n\\nNo mes de maio
  marchou Marcos Mundstock, orador de Les Luthiers. Era, ademais, actor e locutor.
  Mundstock alabou a capacidade do sentido do humor para ver as cousas dun xeito distinto,
  l\u00fadico e, sobre todo, l\u00facido onde non chegan outros mecanismos da raz\u00f3n.
  \u201cO sentido do humor apr\u00e9ndese e mellora co tempo. Ningu\u00e9n nace rindo\u201d.
  Non son un completo in\u00fatil. Cando menos sirvo de mal exemplo. Ter a conciencia
  limpa \u00e9 s\u00edntoma de mala memoria. Calquera tempo pasado foi anterior.\\n\\nManaia
  \u00e9 unha asociaci\u00f3n de adopci\u00f3n e acollemento de \u00e1mbito galego
  que iniciou a s\u00faa andadura en xu\u00f1o de 2006, por iniciativa dun grupo de
  familias adoptantes. Falamos co seu coordinador, Ant\u00f3n Mouriz Fern\u00e1ndez,
  contaxiadas co entusiasmo e a paix\u00f3n que pon ao falar do proxecto.\\n\\nComecemos
  polo principio, que \u00e9 adoptar e que \u00e9 acoller?\\n\\nA adopci\u00f3n e
  o acollemento son d\u00faas medidas de protecci\u00f3n da infancia e recollen o
  dereito de calquera nena ou neno en desamparo a vivir nunha familia suficientemente
  competente para garantir a s\u00faa crianza. \u00c9 dicir, non son medidas para
  que as familias poidan ter fillas ou fillos; \u00e9 ao rev\u00e9s, serven para que
  as crianzas poidan contar coa mellor familia posible no caso de que as de orixe
  non poidan exercer axeitadamente polo motivo que sexa. O ben superior de nenas,
  nenos e adolescentes ten que colocarse por riba de todo o demais. A gran diferenza
  entre a adopci\u00f3n e o acollemento \u00e9 que a primeira \u00e9 para sempre e
  a segunda \u00e9 temporal.\\n\\nUnha vez que unha familia adopta e xa ten a s\u00faa
  crianza na casa, para que necesita o apoio dunha asociaci\u00f3n?\\n\\nBasicamente
  para poder ter contacto con outras familias que estean en circunstancias parecidas.
  Tam\u00e9n para atopar eses apoios que dif\u00edcilmente hai noutros espazos. A
  crianza dunha nena, neno ou adolescente adoptado non \u00e9 exactamente igual que
  a de quen non pasou por esa experiencia e moitas das ferramentas habituais que ado\u00edtamos
  utilizar non serven. Non se pode atender e educar unha perso\u00f1a que v\u00e9n
  de experiencias diferentes do mesmo xeito que as que non pasaron por elas. E, por
  suposto, para acompa\u00f1arnos e aprender unhas familias das outras.\\n\\nC\u00f3ntanos
  algo das actividades e dos espazos que ofrecedes desde Manaia...\\n\\nManaia procura
  ser un lugar de encontro para as familias adoptivas e acolledoras, independentemente
  do momento do proceso no que se atopen, un lugar para compartir e aprender sen sentirse
  xulgadas. As nosas actividades est\u00e1n enfocadas a iso e tentan axudar a comprender
  e atender mellor a realidade da adopci\u00f3n e a das nosas fillas e fillos. Xa
  levamos catro anos co \u201cPrograma de Preparaci\u00f3n, Apoio e Acompa\u00f1amento
  \u00e1s Familias Adoptivas\u201d en colaboraci\u00f3n coa Xunta de Galicia. Dende
  a\u00ed facemos acompa\u00f1amento \u00e1s familias, programamos actividades formativas
  e organizamos xuntanzas, como m\u00ednimo unha vez ao mes nos sete grandes concellos
  de Galicia, coa intenci\u00f3n de acercarnos o m\u00e1ximo posible \u00e1s familias
  que o precisan e diminuir as\u00ed os efectos da dispersi\u00f3n xeogr\u00e1fica
  t\u00edpica da nosa naci\u00f3n.\\n\\nE s\u00e9guese pensando en beb\u00e9s ou cambiou
  a nosa ollada \u00e1 hora de querer adoptar?\\n\\nA primeira idea, xeralmente, \u00e9
  a de pensar nun beb\u00e9. \u00c9 l\u00f3xico e normal xa que \u00e9 o imaxinario
  da maternidade e a paternidade que temos. Pero en canto se vai tendo informaci\u00f3n
  sobre a adopci\u00f3n, o perfil dos ofrecementos vai mudando. Penso que esta \u00e9
  unha das grandes tarefas das asociaci\u00f3ns: amosarles \u00e1s persoas que se
  interesan cal \u00e9 a realidade e axudalas a aproximarse aos perfiles habituais
  das nenas, nenos e adolescentes adoptables.\\n\\nQue necesita unha familia que queira
  adoptar?\\n\\nPrimeiramente que saiban realmente que \u00e9 a adopci\u00f3n, que
  te\u00f1an claros cales son os retos aos que van enfrentarse. Que entendan que tam\u00e9n
  adoptan o pasado desa nena ou neno e a s\u00faa familia de orixe. Que acepten que
  sempre vivir\u00e1n na incerteza de non saberlo todo, de non ter todas as respostas...
  Pero, sobre todo, que sexan flexibles, con capacidade para mudar os seus patr\u00f3ns
  educativos, as s\u00faas certezas e, incluso, as s\u00faas creanzas m\u00e1is arraigadas.\\n\\nManaia
  \u00e9 unha asociaci\u00f3n galega con sentido de pa\u00eds... Como valorades o
  feito das adopci\u00f3ns internacionais?\\n\\nA verdade \u00e9 que non diferenciamos
  moito as adopci\u00f3ns nacionais das internacionais. Pensamos que todas as adopci\u00f3ns,
  sexan onde sexan, ademais de legais deben ser \u00e9ticas e isto \u00e9 o que tentamos
  trasladarlle \u00e1s familias. Non podemos aproveitarnos de situaci\u00f3ns sociais
  complicadas, nin aqu\u00ed nin f\u00f3ra das nosas fronteiras. Sempre recomendamos
  non facer nada que despois non sexamos quen de contarlle \u00e1 nosa filla ou fillo.\\n\\nTam\u00e9n
  est\u00e1n as chamadas \u201cadopci\u00f3ns especiais\u201d.\\n\\nSi, a\u00ednda
  que para n\u00f3s todas as adopci\u00f3ns son especiais, tecnicamente existe esta
  diferenciaci\u00f3n para as nenas, nenos e adolescentes maiores de 8 anos, para
  os grupos de 3 ou m\u00e1is irm\u00e1ns e para as que te\u00f1en algunha enfermidade
  ou diversidade funcional. Para n\u00f3s deber\u00edan denominarse \u201cadopci\u00f3ns
  prioritarias\u201d, xa que son o perfil m\u00e1is habitual e nas que m\u00e1is atenci\u00f3n
  deber\u00edamos po\u00f1er.\\n\\nRecentemente, Manaia est\u00e1 promovendo tam\u00e9n
  o acollemento familiar, c\u00f3ntanos algo diso.\\n\\nLevabamos moito tempo pensando
  que a adopci\u00f3n e o acollemento, a\u00ednda que son diferentes por definici\u00f3n,
  comparten moito m\u00e1is do que xeralmente se pensa e no 2018 aprobamos pasar a
  ser unha asociaci\u00f3n para cubrir as necesidades de familias en calquera das
  d\u00faas medidas. O acollemento familiar \u00e9 a medida m\u00e1is potente coa
  que se conta para atender as necesidades primordiais dun ser humano declarado \u201cen
  desamparo\u201d. \u00c9 r\u00e1pida, modificable e adaptable a cada situaci\u00f3n.\\n\\ne
  \u00e9, ou deber\u00eda ser, a antesala da volta coa familia de orixe ou da adopci\u00f3n.
  Xa est\u00e1 suficientemente demostrado que as nenas, nenos e adolescentes, na maior\u00eda
  dos casos, medran mellor en familia que en centros. Por iso pensamos que o grosor
  dos esforzos estruturais e econ\u00f3micos das administraci\u00f3ns deber\u00edan
  ir cara a promover e mellorar o acollemento familiar.\\n\\nHoxe falamos de diversidade
  familiar, de familias monoparentais, de familias con d\u00faas nais ou dous pais...
  O perfil das familias que pensan en adoptar ou en facer acollemento familiar cambiou
  nestes \u00faltimos anos?\\n\\nNeste caso a adopci\u00f3n e o acollemento son un
  claro reflexo da sociedade que habitamos e, por sorte, cada vez a diversidade est\u00e1
  m\u00e1is presente. Ag\u00e1s na adopci\u00f3n internacional, que se rex\u00e9 polas
  normas e leis do pa\u00eds de orixe das crianzas e adoitan ser m\u00e1is restritivos
  nestes aspectos, en Galicia poden adoptar ou acoller familias de calquera tipo e
  condici\u00f3n: monoparentais, homoparentais, parellas de feito...\\n\\nQue outros
  cambios se est\u00e1n a dar?\\n\\nO cambio m\u00e1is salientable \u00e9 o descenso
  do n\u00famero de nenas, nenos e adolescentes para adopci\u00f3n, a nivel mundial,
  e isto reflictece nun menor n\u00famero de familias con posibilidade de adoptar.
  N\u00f3s sempre dicimos que cantas menos adopci\u00f3ns, mellor; porque iso significa
  que hai no mundo menos crianzas desprotexidas. Pero tam\u00e9n \u00e9 certo que
  neste tempos presentanse outras realidades ao redor da adopci\u00f3n: a busca de
  orixes, cada vez m\u00e1is frecuente; a adopci\u00f3n aberta, que ten como peculiaridade
  a posibilidade de contacto da crianza coa s\u00faa familia de orixe. Ou a aplicaci\u00f3n
  da Lei Org\u00e1nica 8/2015 que solicita, entre\\n\\nMensaxes como \u201co pasado
  non importa\u201d fixeron moito mal: hai que formarse\\n\\nmoitas outras cousas,
  que ningunha nena ou neno menor de 3 anos se cr\u00ede nun centro, algo que, por
  certo, non estamos a cumprir...\\n\\n\u201cInd\u00f3mito y entra\u00f1able\u201d
  desvela unha realidad complexa, mesmo dura, da adopci\u00f3n. \u201cEl hurac\u00e1n
  y la mariposa\u201d, m\u00e1is recente, tam\u00e9n. E foron escritos respectivamente
  por un pai e unha nai que adoptaron...\\n\\nA realidade da adopci\u00f3n \u00e9
  diversa, igual que o son as persoas adoptadas e as familias que adoptan. Pero basicamente
  temos que pensar que cando unha persoa chega a ser declarada \u201cadoptable\u201d
  \u00e9 porque algo non foi ben coa s\u00faa familia de orixe, que seguramente non
  pudo ou non soubo coidar axeitadamente. Agora sabemos moito das secuelas que deixa
  nas persoas a adversidade temper\u00e1 e como marcan as s\u00faas vidas os diferentes
  acontecementos que viviron. Mensaxes coma \u201co amor todo o pode\u201d, \u201co
  pasado non importa\u201d ou \u201ccriade coma se non fose adoptado\u201d fixeron
  moito dano, xa que evitaron que as familias se formasen e atendesen as peculiaridades
  das s\u00faas fillas e fillos de xeito adecuado.\\n\\nEnt\u00f3n, paga a pena adoptar?
  Paga a pena ser familia de acollida?\\n\\nNo caso do acollemento est\u00e1 claro
  que se unha familia repite \u00e9 porque a experiencia ten moito m\u00e1is de bo
  que de malo. En xeral tanto as familias acoledoras coma as adoptivas, a pesar das
  adversidades, est\u00e1n moi satisfeitas. E na mi\u00f1a experiencia persoal te\u00f1o
  claro que paga a pena: pase o que pase, sempre recibes moito m\u00e1is do que d\u00e1is.\\n\\nO
  noso Deus \u00e9 un Deus compasivo que sofre onda os seus fillos e fillas, que se
  lle conmoven as entra\u00f1as e anda na procura de levantar os que se inclinan baixo
  o peso da aflicci\u00f3n e empurr\u00e1los \u00e1 esperanza e \u00e1 resistencia.
  A teolox\u00eda feminista recorda de coto que a resposta de Deus ao mal que acontece
  no mundo non se xoga na s\u00faa omnipotencia sen\u00f3n no seu amor. (Elizabeth
  A. Johnson, *La que es. El misterio de Dios en el discurso teol\u00f3gico feminista*,
  330-345).\\n\\nA matriarca Raquel aparece na Biblia como un s\u00edmbolo de gran
  forza cando se quere expresar dor, separaci\u00f3n ou desamparo. A s\u00faa experiencia
  de sufriemento e perda que vive na s\u00faa familia permite a Xerem\u00edas (Xer
  31, 15) e logo a Mateo (Mt 2, 17-18) presentala como a encarnaci\u00f3n do desconsolo
  e a impotencia. Pero esa imaxe queda resignificada coa presenza consoladora de Deus.
  O profeta anuncia un tempo novo, non nado nos esforzos humanos, sen\u00f3n do coraz\u00f3n
  compasivo dun Deus que invita a ver a realidade m\u00e1is al\u00f3 das b\u00e1goas
  e o cansazo, asegurando que o porvir est\u00e1 cheo de esperanza (Xer 31, 16-22).\\n\\nAo
  longo destes meses no que o coronavirus cambiou as nosas vidas e a encheu de preguntas
  e incertezas, evocar de novo a Raquel e o modo en que Deus escruta o seu pranto
  pode ser un referente para a nosa fe e un modo de ofrecerlle \u00e1s nosas irm\u00e1s
  e irm\u00e1ns unha palabra sobre Deus que non quede presa de ritos ou de f\u00f3rmulas
  milagreiras.\\n\\nA pregunta sobre Deus neste tempo ten na mirada feminina unha
  resposta que cami\u00f1a da man de pequenas historias de vida, coma a de Raquel,
  que saben o que implica coidar, solidarizarse, abaxiarse por amor e tam\u00e9n afrontar
  a perda, acompa\u00f1ar e resistir. As mulleres, polo lugar que as sociedades patriarcais
  sempre lles outorgaron, quiz\u00e1s poidamos entender mellor como Deus permanece
  a car\u00f3n dos que est\u00e1n a sufrir e sufrir\u00e1n as consciencias da crise
  que estamos a vivir no mundo. Esta afirmaci\u00f3n non quere ser unha discriminaci\u00f3n
  \u00e1 experiencia relixiosa dos var\u00f3ns, sen\u00f3n po\u00f1er o acento nun
  tema relevante para as mulleres e que estamos chamadas a elaborar teoloxicamente.\\n\\nDeixo
  aqu\u00ed as palabras de Ivone Gevara, por se axudan:\\n\\n\u201cA transcendencia
  e a inmanencia do mal convidanme a vivir a Deus doutro xeito e tal vez a falar doutro
  xeito da Boa Nova. Os discursos menos absolutos, os discursos da incerteza ou da
  diversidade parecen m\u00e1is doados nestes tempos dif\u00edciles. (...) \u00e1n\u00edmame
  a converterme \u00e1 realidade que percibo, esa realidade mesturada, confusa, na
  que ningunha palabra pode ser definitiva, na que ning\u00fan Deus pode ser todopoderoso,
  ning\u00fan ben totalmente soberano e ning\u00fan mal a \u00faltima palabra da vida.\u201d
  (*El rostro oculto del mal. Una teolog\u00eda desde la experiencia de las mujeres*,
  2002).\\n\\nDurante o coronavirus, evocar a Raquel e o modo en que Deus escuta o
  seu pranto pode ser un referente para a nosa fe.\\n\\nHorizonte Universal\\n\\nCarta
  do Papa Francisco aos irm\u00e1ns e irm\u00e1s dos movementos e organizaci\u00f3ns
  populares\\n\\nBenqueridos amigos:\\n\\nCon frecuencia l\u00e9mbrome dos nosos encontros:
  dous no Vaticano e un en Santa Cruz de la Sierra e conf\u00e9solles que esta \u201cmemoria\u201d
  me fai moito ben, ach\u00e9game a vostedes, fa\u00edme repensar en tantos di\u00e1logos
  durante eses encontros e en tantas ilusi\u00f3ns que naceron e medraron al\u00ed
  e moitas delas se fixeron realidade. Agora, no medio desta pandemia, v\u00f3lvoos
  recordar de modo especial e quero estar cerca de vostedes.\\n\\nNestes d\u00edas
  de tanta anguria e dificultade, moitos t\u00e9\u00f1ense referido \u00e1 pandemia
  que sufrimos con met\u00e1foras b\u00e9licas. Se a loita contra o COVID \u00e9 unha
  guerra, vostedes son un verdadeiro ex\u00e9rcito invisible que loita nas m\u00e1is
  perigosas trincheiras. Un ex\u00e9rcito sen m\u00e1is arma que a solidariedade,
  a esperanza e o sentido da comunidade que reverdece nestes d\u00edas nos que ningu\u00e9n
  se salva s\u00f3. Vostedes son para min, como lles dixen nos nosos encontros, verdadeiros
  poetas sociais que, desde as periferias esquecidas, crean soluci\u00f3ns dignas
  para os problemas m\u00e1is agudos da xente exclu\u00edda.\\n\\nSei que moitas veces
  non se lles reco\u00f1ece como \u00e9 debido porque para este sistema son verdadeiramente
  invisibles. \u00c1s perifer\u00edas non chegan as soluci\u00f3ns do mercado e escasea
  a presenza protectora do Estado. Tampouco vostedes te\u00f1en os recursos para realizar
  a s\u00faa funci\u00f3n. M\u00edraselles con desconfianza por superar a mera filantrop\u00eda
  a trav\u00e9s da organizaci\u00f3n comunitaria ou reclamar os seus dereitos no canto
  de quedaren resignados agardando a ver se cae alg\u00fana faragulla dos que pos\u00faen
  o poder econ\u00f3mico. Moitas veces mastigan liortas e impotencia ao ver as desigualdades
  que persisten mesmo en momentos onde se acaban todas as escusas para soste privilexios.
  Emporio, non se pechan na queixa: arrem\u00e1ganse e seguen a traballar polas s\u00faas
  familias, polos seus barrios, polo ben com\u00fan. Esta actitude de vostedes ax\u00fadame,
  cuesti\u00f3name e ens\u00edn\u00e1me moito. Penso nas persoas, sobre todo mulleres,
  que multiplican o pan nos comedores comunitarios coc\u00ed\u00f1ando con d\u00faas
  cebolas e un paquete de arroz un delicioso guiso para centos de nenos, penso nos
  enfermos, penso nos anci\u00e1ns. Nunca aparecen nos grandes medios. Tampouco os
  campesi\u00f1os e agricultores familiares que seguen labrando para produciren alimentos
  sans sen destru\u00edren a natureza, sen acaparalos nin especular coa necesidade
  do pobo. Quero que saiban que o noso Pai celestial m\u00edraos, val\u00f3raos, reco\u00f1\u00e9ceos
  e fortalec\u00e9os na s\u00faa opci\u00f3n.\\n\\nQue dif\u00edcil \u00e9 quedar
  na casa para quen vive nunha pequena vivenda precaria ou que directamente carece
  de teito! Que dif\u00edcil \u00e9 para os emigrantes, as persoas privadas de liberdade
  ou para aqueles que realizan un proceso de curaci\u00f3n por adicci\u00f3n. Vostedes
  est\u00e1n a\u00ed, po\u00f1endo o corpo onda eles, para faceren as cousas menos
  dif\u00edciles, menos dolorosas. Doullles os meus parab\u00e9ns e agradecemento
  de coraz\u00f3n. Espero que os gobernos comprendan que os paradigmas tecnocr\u00e1ticos
  (sexan estadoc\u00e9ntricos, sexan mercadoc\u00e9ntricos) non son abondo para abordar
  esta crise nin os outros grandes problemas da humanidade. Agora m\u00e1is ca nunca,
  son as persoas, as comunidades, os pobos os que deben estar no centro, unidos para
  curar, coidar, compartir.\\n\\nSei que vostedes foron exclu\u00eddos dos beneficios
  da globalizaci\u00f3n. Non gozan deses praceres superficiais que anestesian tantas
  conciencias. A pesar diso, sempre te\u00f1en que sufrir os seus danos. Os males
  que a todos feren, a vostedes golp\u00e9anos dobremente. Moitos de vostedes viven
  o d\u00eda a d\u00eda sen ning\u00fan tipo de garant\u00edas legais que os protexa.
  Os vendedores ambulantes, os recicladores, os feirantes, os pequenos agricultores,
  os construtores, os costureiros, os que realizan distintas tarefas de coidado. Vostedes,
  traballadores informais, independentes ou da econom\u00eda popular, non te\u00f1en
  un salario estable para resistir este momento... e as corentenas f\u00e1nselles
  insoporables. Quizais sexa tempo de pensar nun salario universal que reco\u00f1eza
  e dignifique as nobres e insustitut\u00edbeis tarefas que realizan; capaz de garantir
  e facer realidade esta consigna tan humana e tan cristi\u00e1: ning\u00fan traballador
  sen dereitos.\\n\\nTam\u00e9n quixera invitalos a pensar no \u201cdespois\u201d,
  porque esta tormenta vai terminar e as s\u00faas graves consecuencias xa se senten.
  Vostedes non son uns improvisados, te\u00f1en a cultura, a metodolox\u00eda, pero
  principalmente a sabedoria que se amasa co l\u00e9vedo de sentir a dor do outro
  como propio. Quero que pensemos no proxecto de desenvolvemento humano integral que
  anhelamos, centrado no protagonismo dos Pobos en toda a s\u00faa diversidade e o
  acceso universal a esas tres T que vostedes defenden: terra, teito e traballo. Espero
  que este momento de perigo nos saque do piloto autom\u00e1tico, sacuda as nosas
  conciencias durmidas e permita unha conversi\u00f3n humanista e ecol\u00f3xica que
  termine coa idolatr\u00eda do di\u00f1eiro e po\u00f1a a dignidade e a vida no centro.
  A nosa civilizaci\u00f3n, tan competitiva e individualista, cos seus ritmos fren\u00e9ticos
  de produci\u00f3n e consumo, os seus luxos excesivos e ganancias desmedidas para
  poucos necesita facer un cambio, repensarse, rexenerarse. Vostedes son construtores
  indispensables deste cambio inadiable; \u00e9 m\u00e1is, vostedes pos\u00faen unha
  voz autorizada para testemu\u00f1ar que isto \u00e9 posible. Vostedes saben de crises
  e privaci\u00f3ns... que con pudor, dignidade, compromiso, esforzo e solidariedade
  consegu\u00e9n transformar en promesa de vida para as s\u00faas familias e comunidades.\\n\\nSigan
  coa s\u00faa loita e c\u00f3idense coma irm\u00e1ns. Rezo por vostedes, rezo con
  vostedes e quero pedirlle ao noso Pai Deus que os bendiga, os colme do seu amor
  e os defenda no cami\u00f1o d\u00e1ndoles esa forza que nos mant\u00e9n en p\u00e9
  e non defrauda: a esperanza. Por favor, recen por min, que tam\u00e9n o necesito.\\n\\nFraternalmente,
  Cidade do Vaticano, 12 de abril do 2020, domingo de Pasqua.\\n\\nQuero que saiban
  que o noso Pai celestial m\u00edraos, val\u00f3raos, reco\u00f1\u00e9ceos e fortal\u00e9ceceos
  na s\u00faa opci\u00f3n\\n\\nFerrados de coraz\u00f3n\\n\\nMiguel Casalderrey\\n\u201c\u00c9
  precioso participar da comu\u00f1\u00f3n vocal\u201d\\n\\nQuen es, Miguel?\\n\\nSon
  o fillo dunha familia traballadora de clase media, unha familia tradicional no ideol\u00f3xico
  e no relixioso, e a\u00ednda que me atopo nas antipodas nesas cuesti\u00f3ns, reco\u00f1\u00e9zome
  e reivind\u00edcome como produto dos principios que mamei na casa, o radical respecto
  \u00e1s persoas e \u00e1 palabra dada.\\n\\nNac\u00edn, e contin\u00fao a vivir,
  no barrio do Burgo (Pontevedra), nos anos nos que cruzar a ponte para achegarse
  ao centro dic\u00edase \u201cir al pueblo\u201d ou cando volv\u00ed\u00e1s \u00e1
  casa, logo de ter feito os recados que a matriarca que encargara na tenda (de proximidade,
  como lle chaman agora) \u2013un cacho de queixo, un anaco de marmelo, d\u00faas
  botellas de auga (envase retornable) e unha bolsa de leite (\u201cXeve\u201d era
  a que hab\u00eda daquela)\u2013 e non foran abondos os cartos que levabas, mand\u00e1bante
  de volta coas pesetas que antes che faltaran. Sirva todo isto para a localizaci\u00f3n
  nun tempo e nun lugar que xa non son.\\n\\nNa actualidade son traballador do sector
  p\u00fablico sanitario, ese mesmo que agora, debilitado, quere po\u00f1er remedio
  a este pesadelo dist\u00f3pico (maldita pandemia) ao que alg\u00fans modelos de
  sociedade nos trouxeron.\\n\\nContanos un pouqu\u00edn que \u00e9 o que fas e que
  \u00e9 Maravallada...\\n\\nEu sumo unha voz m\u00e1is aos tres que formamos a secci\u00f3n
  de voces masculinas; a filosof\u00eda do noso grupo dentro de Cantos de Taberna
  \u00e9 darlle o maior protagonismo \u00e1s voces. No noso repertorio non hai un
  s\u00f3 tema que sexa unicamente instrumental; pola contra, hai temas que non contan
  con ningunha instrumentaci\u00f3n. Realmente \u00e9 precioso participar desa comu\u00f1\u00f3n
  vocal, un pracer cantar sen aditamentos.\\n\\nO grupo foi o xermolo da Asociaci\u00f3n
  Cultural Maravallada, que traballa pola recuperaci\u00f3n e difusi\u00f3n da cultura
  tradicional e do idioma do pa\u00eds. Para darlle contido a estes principios, organizamos
  actividades como Cantos de Taberna e cantos de panxoli\u00f1as (desde 2012), obradoiros
  de canto, o multitudinario Aqu\u00ed C\u00e1ntase, a publicaci\u00f3n da escolma
  Repertorio tabernario\u2026 E desde o ano 2015 vimos tam\u00e9n facendo un evento
  ao que lle chamamos \u201cCunca Maravallada\u201d, que quere darles reco\u00f1ecemento
  a entidades ou particulares que traballan a prol da cultura do pa\u00eds e da m\u00fasica
  tradicional.\\n\\nComo chegas aqu\u00ed?\\n\\nA Maravallada chego no ano 2015. Co\u00f1ec\u00eda
  de tempo antes a todos os seus integrantes e segu\u00eda as s\u00faas convocatorias
  de Cantos de Taberna. Polo tanto, antes de ser membro, fun \u201cusuario\u201d das
  s\u00faas propostas. Acud\u00edn despois a un par de obradoiros que organizara a
  asociaci\u00f3n (coa perversa intenci\u00f3n de espertar o becho este de cantar);
  daquela algunha das hoxe compa\u00f1eiras convidoume a acudir a un ensaio do grupo
  e desde ent\u00f3n... xa van cinco anos!\\n\\nDos 9 membros actuais (5 mulleres
  e 4 homes), eu fun a \u00faltima fichaxe.\\n\\nQue che aporta como persoa facer
  isto?\\n\\nAdemais do pracer meramente f\u00edsico de engadir a t\u00faa voz a un
  conxunto\\n\\nm\u00e1s amplio, de escotar os/as teus/t\u00faas compa\u00f1eiros/as,
  que esa suma produce algo m\u00e1is grande, un resultado enriquecido (probade e
  poderedes constatar o que estou a dicir), para os que cremos que o noso pequeno
  pa\u00eds ten unha cultura de seu que \u00e9 preciso manter e proxectar cara adiante,
  d\u00e1mos a oportunidade, desde este pequeno eido que son os cantos de taberna,
  de facer pa\u00eds, de sementar interese, de espertar conciencias...\\n\\nPara ilustrar
  o que estou a dicir, c\u00f3ntovos outro dos eventos que organizamos: Aqu\u00ed
  C\u00e1ntase, uns cantos de taberna pero cun formato m\u00e1is amplio (m\u00e1is
  de 1 000 persoas cantando). Pois ben, desde o estrado onde estamos situados Maravallada
  para dirixir este evento, observas unha ampl\u00edsima representaci\u00f3n social,
  de idades, de sexos, supono que de ideolox\u00edas e crenzas, de linguas (moitos
  deles espa\u00f1ol-falantes), xente local e for\u00e1neos, e todos eles con ilusi\u00f3n,
  participando e divert\u00edndose coa nosa cultura, cantando a nosa m\u00fasica no
  noso idioma. Iso todo me aporta formar parte desta asociaci\u00f3n cultural!\\n\\nComo
  \u00e9 o voso ritmo de traballo para organizar tanta actividade?\\n\\nAg\u00e1s
  no tempo que vai entre mediados de agosto e finais de setembro, que son de descanso,
  o resto do ano, sistematicamente os m\u00e9rcores, son o noso d\u00eda de ensaio:
  hora e media de quentar gorxas, repasar temas do repertorio habitual, ensaiar co
  acorde\u00f3n, gaita e percusi\u00f3ns, propo\u00f1er a incorporaci\u00f3n de novos
  temas, corrixir erros, valorar modificaci\u00f3ns... Traballo s\u00ed, pero de xeito
  moi ilusionante.\\n\\nAdemais, temos que planificar con antelaci\u00f3n suficiente
  as actividades.\\n\\n\u00c1 xente unicamente lle tes que dar un motivo para cantar
  e est\u00e1 todo feito!\\n\\nComezamos o ano cos Cantos de Taberna, que adoitan
  ser entre xaneiro e maio (sempr o \u00faltimo venres de cada mes): propo\u00f1er
  tabernas, propo\u00f1er grupos que se axusten \u00e1 nosa filosof\u00eda (a voz
  ten que ser o elemento principal)...\\n\\nA seguinte actividade do ano, en orde
  cronol\u00f3xica, desde hai tres, \u00e9 o Aqu\u00ed C\u00e1ntase; neste caso organizar
  este evento require comezar con ensaios abertos en distintos centros culturais do
  concello de Pontevedra (3 ou 4 meses antes da celebraci\u00f3n do acto central),
  establecer horarios, convocar os/as interesados/as, escoller as canci\u00f3ns, imprimir
  os libretos para os ensaios... E o d\u00eda do Aqu\u00ed C\u00e1ntase, como contaba
  antes, m\u00e1is dun milheiro de persoas cantando a un tempo contigo, cinco canci\u00f3ns
  en cada unha das catro prazas, pois, que dicir!, inconmensurable, indescritible;
  en fin, participade cando te\u00f1ades ocasi\u00f3n, non vos ides arrepentir.\\n\\nO
  seguinte acto do ano adoita ser a entrega da Cunca Maravallada no transcurso da
  Gala de Cantos de Taberna. Temos que propo\u00f1er e decidir a quen outorgalle o
  reco\u00f1ecemento, quen \u00e9 o artista pl\u00e1stico que vai plasmar o agasallo
  (pintor, escultor...), quen aportar\u00e1 a parte musical da gala (outra volta aplicamos
  o noso criterio de m\u00fasica eminentemente vocal).\\n\\nE chegamos ao \u00faltimo
  evento do ano, as Panxol\u00edas do Nadal; os primeiros anos con formato de concerto
  desde un pequeno estrado nunha das prazas da cidade; os \u00faltimos anos, aplicamos
  novamente a nosa f\u00f3rmula participativa. Se \u00e9 que \u00e1 xente unicamente
  lle tes que dar un motivo para cantar e est\u00e1 todo feito! Supo\u00f1o que\\n\\nFerrados
  de coraz\u00f3n\\nMiguel Casalderrey\\n\u201c\u00c9 precioso participar da comu\u00f1\u00f3n
  vocal\u201d\\n\\nA filosof\u00eda do noso grupo, dentro dos Cantos de Taberna, \u00e9
  darlle o maior protagonismo \u00e1s voces\\n\\nA pra\u00e7a de Curros Enr\u00edquez
  de Pontevedra no \u201cAqu\u00ed c\u00e1ntase\u201d 2019\\n\\nhaber\u00e1 alg\u00fan
  sisudo estudo cient\u00edfico que acredite que o canto, e especialmente cando \u00e9
  compartido, reporta beneficios de toda \u00edndole, cando miras as caras de quen
  participa, eu xurar\u00eda que afastan por un intre da s\u00faa cabeza outras cuesti\u00f3ns.\\n\\nComo
  ves o que facedes en relaci\u00f3n ao futuro?\\nA continuidade (Cantos de Taberna,
  Panxoli\u00f1as do Nadal, Aqu\u00ed C\u00e1ntase) teremos que adaptala \u00e1 nova
  situaci\u00f3n, a este novo concepto de normalidade. Recordemos que son actividades
  que adoitan concentrar grupos numerosos de persoas; o distanciamento f\u00edsico
  que require a nova situaci\u00f3n non \u00e9 o medio natural da nosa actividade.\\n\\nPolo
  de pronto, o pasado 25 de abril co gallo do aniversario da Revoluci\u00f3n dos Cravos
  colgamos no YouTube un v\u00eddeo interpretando o \u201cGr\u00e1ndola Vila Morena\u201d,
  ou o pasado d\u00eda 1 de maio tam\u00e9n no YouTube fixemos \u201cCantos na Varanda\u201d.\\n\\nNa
  medida do posible, sempre que a situaci\u00f3n sanitaria o permita, tentaremos retomar
  a f\u00f3rmula participativa (e presencial), volver a cantar xuntos nas tabernas
  e nas r\u00faas, estender os nosos pulm\u00f3ns e coraz\u00f3ns para utilizar a
  palabra, a voz, esa arma de construcci\u00f3n masiva.\\n\\nOnde vos podemos atopar?\\nPodedes
  seguirnos en: www.maravallada.gal no Facebook ou en YouTube. E se algu\u00e9m quere
  contactar con n\u00f3s, pode facelo en firstname.lastname@example.org\\n\\n[Entrevista
  completa en www.irimia.gal]\\n\\nBoa nova\\n\\nDEFENDER A TERRA \u00c9 DEFENDER
  A VIDA. 5 ANOS DA LAUDATO, SI.\\n\\nLembro unha misa, un 15 de agosto, onde un vello
  misioneiro se dispuxa a dar a homil\u00eda sobre a Asunci\u00f3n de Mar\u00eda.
  Foi ben curta: \u201cMoito se discut\u00eda sobre a conveniencia ou non de declarar
  a Asunci\u00f3n de Mar\u00eda coma dogma. Ese 1 de novembro de 1950, cando P\u00edo
  XII o proclamou, sa\u00ed\u00f1 \u00e1 r\u00faa e chov\u00eda en Londres\u201d.
  O 24 de maio de 2015 o papa Francisco publicaba a enc\u00edclica \u201cLaudato,
  Si\u201d. 5 anos despois, en medio dunha semana de celebraci\u00f3ns sobre o documento,
  podemos dicir algo m\u00e1is que o marabilloso tempo primaveral dese domingo.\\n\\nOuvir
  o clamor dos pobres e o clamor da Terra\\n\\nSe por algo destacou esta Enc\u00edclica,
  o considerado documento m\u00e1is importante de Francisco, \u00e9 por fin a Igrexa
  cat\u00f3lica pronunci\u00e1base por algo que realmente importa: a urxencia da crise
  ecol\u00f3xica e a busca dun futuro m\u00e1is sostible para toda a humanidade. Moito
  se insiste nestes d\u00edas de pandemia o car\u00e1cter prof\u00e9tico da Laudato,
  Si. Todo est\u00e1 interligado, e isto incl\u00fae a ecolox\u00eda, a sanidade,
  a econom\u00eda e o desenvolvemento sostible. A COVID-19 parece que lle d\u00e1
  raz\u00f3n a Francisco e as s\u00faas preocupaci\u00f3n. Dise mesmo que as s\u00faas
  palabras son unha profec\u00eda e un cami\u00f1o que nos desaf\u00eda profundamente,
  buscando un cambio profundo, cultural e econ\u00f3mico. Pode ser, mais profec\u00eda
  \u00e9 tam\u00e9n falar do que realmente importa a nosa humanidade.\\n\\nLouvar
  e dar as grazas\\n\\nA Enc\u00edclica non \u00e9 unicamente unha chamada \u00e1
  conversi\u00f3n ecol\u00f3xica, \u201cao coidado da casa com\u00fan\u201d. \u00c9
  unha louvanza, como o seu propio t\u00edtulo indica. E non debemos ficar unicamente
  no agradecemento de que a Igrexa se ocupe do que realmente importa, sen\u00f3n agradecer,
  ainda que desde o noso pa\u00eds nos pareza afastado, dos grandes pasos que se deron
  neste lustro: - A creaci\u00f3n do Dicasterio para o Servizo do Desenvolvemento
  Huamano Integral (2016), onde se agrupou os temas relativos a migrantes, v\u00edtimas
  desastres naturais e conflitos armados, doentes e exclu\u00eddos, prisioneiros,
  desempregados e v\u00edtimas da violencia e da tortura, boa proba desa aposta porque
  todo est\u00e1 interligado (LS 91). - O impulso dos movementos xuven\u00eds polo
  coidado da casa com\u00fan (2018), desde onde se propuxeron campa\u00f1as contra
  a industria f\u00f3sil e a favor das enerx\u00edas renovables. - O S\u00ednodo da
  Amazonia (2019), onde entre outros moitos \u201cespi\u00f1entos\u201d aspectos,
  incorporou o concepto de pecado ecol\u00f3xico, presentou un novo modelo para a
  Igrexa e para a sociedade, pondo como exemplo para a mundo aos pobos ind\u00edxenas.
  - O impulso da Celebraci\u00f3n Ecum\u00e9nica do Tempo da Creaci\u00f3n, unha aposta
  polo di\u00e1logo interrelixioso, co tema da ecolox\u00eda e da fe de fondo.\\n\\nUnha
  chamada a todos n\u00f3s\\n\\nA enc\u00edclica, por moi boa que for, \u00e9 un simple
  documento. Mais \u00e9 unha chamada a cada un de n\u00f3s, a unha conversi\u00f3n
  ecol\u00f3xica. Est\u00e1 a realidade macroestrutural, comunitaria, mais todo parte
  dunha experiencia individual. A relaci\u00f3n que n\u00f3s, cada un, coma ser humano,
  temos coa casa com\u00fan. Somos n\u00f3s mesmos a Terra, somos parte da Creaci\u00f3n.
  Aproveitemos esta semana de celebraci\u00f3n, 5 anos despois, para nos lembrar que
  estamos chamados a coidala, non porque o te\u00f1amos que facer, sen\u00f3n porque
  somos parte dela.\\n\\nFalando da lingua\\n\\nE chegou unha \u201cinstrucci\u00f3n\u201d\\n\\nEra
  para rir se o conto non fora tan triste. Na situaci\u00f3n complexa que estamos
  a vivir, na que quedamos coa impresi\u00f3n de que o ensino non \u00e9 \u201cesencial\u201d,
  batemos coa dura realidade de que -nesta Gali-Espa\u00f1a, de moitas bandeiras vermellas
  e amarelas e moi poucas azuis e brancas- o galego \u00e9 desprezado ata o l\u00edmite.
  Acaba de pasar o D\u00eda das Letras e vennos \u00e1 cabeza aquela m\u00e1xima que
  proclamou Carvalho Calero \u201cO galego, ou \u00e9 galego-portugu\u00e9s ou \u00e9
  galego-espa\u00f1ol\u201d. El empregou esta sentenza para reivindicar a s\u00faa
  postura lus\u00edsta e, sen meternos agora en cuesti\u00f3n normativas, aproveit\u00e1mola
  para deixar de manifesto d\u00faas evidencias ao respecto do governo \u201cgalego\u201d:\\n\\na-Ten
  nulo interese na recuperaci\u00f3n da lingua que lle d\u00e1 nome \u00e1 autonom\u00eda
  (a galega), \u00e1 que desprestixia e, cada vez, con menos disimulo.\\n\\nb-Sabe
  que, ao irmos mesturando o galego co castel\u00e1n, a lingua de Rosal\u00eda acabar\u00e1
  morrendo se cada vez se parece m\u00e1s a un dialecto da lingua cervantina: pasar\u00e1
  a ser castel\u00e1n con trazos do noroeste da pen\u00ednsula.\\n\\nE para mostra...
  o documento que ve\u00f1en de publicar desde a Conseller\u00eda de Educaci\u00f3n
  (non de Medio Rural ou de Econom\u00eda, que tam\u00e9n estar\u00eda mal, pero de
  Educaci\u00f3n!), coas \u201cInstrucci\u00f3ns\u201d (que xa hai 17 anos que se
  escribe con un \u201cC\u201d!!!) para a reapertura parcial dos centros de ensino.
  Que pasar\u00eda se o goberno central nos dese \u201cInstruci\u00f3ns\u201d?\\n\\nNon
  \u00e9 motivo deste artigo que publiquen o documento \u00e1 media tarde dun venres
  para que o luns estea todo a funcionar!!, pero si a s\u00faa calidade ling\u00fc\u00edstica.
  As presas poder\u00e1n xustificar grallas varias, pero non que o texto estea con
  erros por desco\u00f1ecemento da lingua, ao que se lle xunta o desleixo m\u00e1is
  absoluto. Para que vos fagades unha idea, campan no texto desde letras que non hai
  no galego (\u201cy\u201d), palabras en castel\u00e1n (presencia), esdr\u00faxulas
  sen acentuar (\u201creturnarse\u201d ou \u201c\u00faltimo\u201d) ou contracci\u00f3ns
  da preposici\u00f3n \u201ca\u201d co artigo \u201ca\u201d ou \u201cas\u201d, \u00e1s
  que nunca lles puxeron o til. Logo p\u00f3\u00f1enlle til a \u201cd\u00e1\u201d
  e \u201cd\u00e1s\u201d cando son contracci\u00f3ns de de+a; mentres que o que se
  acent\u00faa \u00e9 o verbo. Se todo est\u00e1 ao rev\u00e9s dificulta enormemente
  a lectura. Que buscan? Que se pida que escriban xa directamente en castel\u00e1n?
  Non, non, en galego e de calidade.\\n\\nO fachineiro do odio\\n\\nAlcanfor e anilina\\n\\nHai
  que partir da premisa de que co 33% da poboaci\u00f3n, polo menos, este fachineiro
  nunca considerar\u00eda compartir unha mesa para tomar un caf\u00e9 e levar unha
  conversa m\u00e1is al\u00e1 dunha resposta f\u00e1tica, desas de ascensor. Pero
  ao mellor hai que revisar a porcentaxe porque me ferve o sangue cando vexo quen
  reclama liberdade desde o descapotable coa bandeira de Col\u00f3n atada ao pao de
  golf. Cando o fachineiro ve de quen v\u00e9n sendo esa xenti\u00f1a sempre lembra
  a descripci\u00f3n de Vicente Risco n''O porco de p\u00e9: don Celidonio \u00e9
  igual por dentro que por f\u00f3ra: carne e esp\u00edrito son a mesma zorra, mesturada
  e revolta, co mesmo adubo de ourego e pemento. O malo \u00e9 que os celidonios de
  hoxe, adem\u00e1s de ricos, te\u00f1en o apoio ou dominio das redes sociais e a
  capacidade de manipulaci\u00f3n dos que non son ricos pero si manipulables. E o
  adubo non \u00e9 ourego e pemento, sen\u00f3n o racismo, machismo, desprezo pola
  cultura, homofobia, odio ao diferente e varios ismos m\u00e1is. Sempre estiveron
  a\u00ed: son os que antes levaban as bandeiras pingando anilina coma no poema de
  Lu\u00eds Pimentel. Disque dixo Rajoy hai xa anos \u201chay que ver cuantos fachas
  votan a mi partido\u201d. Deixando \u00e1 parte o cinismo da frase, esa seita -m\u00e1is
  que sector- da poboaci\u00f3n, \u00e9 unha pandemia para a que non hai doada vacina.\\n\\nA.Q.\"",
  "\"TERRA DE OUTES 47\\n\\nXullo - Setembro 2019\\n\\nneste n\u00b0\\n\\nA xurisdicion
