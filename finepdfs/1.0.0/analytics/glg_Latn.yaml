  de Redacci\u00f3n: Domingo Campos, Xo\u00e1n X. Mari\u00f1o, Manuel do R\u00edo,
  Lidia Vicente, Ram\u00f3n Blanco\\nEdita: A.C.C. Terra de Outes\\nMaqueta e imprime:
  Grafinoxa, S.L.\\nE-mail: firstname.lastname@example.org\\nVisita a nosa p\u00e1xina
  web:\\nwww.terradeoutes.com\\n\\nRevista subvencionada por:\\n\\ncocina caseira,
  natureza e silencio\\n\\nCASA PERFECTOMARIA\\ncabanamoura\\n\\nX Mui\u00f1ada\\n\\nNo
  pasado mes de maio tivo lugar a X Mui\u00f1ada, nome con que design\u00e1moloas
  xornadas de exaltaci\u00f3n do patrimonio cultural que a nosa asociaci\u00f3n v\u00e9n
  organizando dende 2007.\\n\\nNesta ocasi\u00f3n dedic\u00e1molas \u00e1 emigraci\u00f3n
  galega e deron comezo no m\u00e9rcoreo 8 de maio de 2019, no IES Poeta A\u00f1\u00f3n,
  coa inauguraci\u00f3n da exposici\u00f3n *Luces de al\u00e9n mar. As escolas de
  americanos en Galicia*, a cargo do director do dito centro, Daniel Losada; Xo\u00e1n
  Mari\u00f1o, presidente da nosa asociaci\u00f3n; e Pilar Cagiao, coautora da compilaci\u00f3n
  de textos e imaxes colocados nos paneis informativos, quen foi explicando \u00e1s
  persoas asistentes o motivo da selecci\u00f3n dos ditos contidos. Seguiulle a conferencia
  \u201cA\u00f1\u00f3n, paradigma da emigraci\u00f3n galega\u201d, por Ram\u00f3n
  Blanco, profesor de Lingua e Literatura Galega no IES Virxe do Mar, de Noia, e pechou
  esta primeira xornada a profesora da USC Pilar Cagiao Vila, coa conferencia \u201cA
  emigraci\u00f3n galega \u00e1 Am\u00e9rica: destinos, inserci\u00f3n laboral e social,
  caracter\u00edsticas dos emigrantes e participaci\u00f3n feminina\u201d.\\n\\nInauguraci\u00f3n
  da exposici\u00f3n \u201cLuces de al\u00e9n mar\u201d.\\n\\nNo xoves, d\u00eda 9
  de maio de 2019, na casa da cultura da Serra, tiveron lugar as seguintes conferencias:
  \u201cLuces de al\u00e9n mar: a creaci\u00f3n dunha rede escolar de calidade polos
  americanos\u201d, a cargo de Ra\u00fal Soutelo V\u00e1zquez, profesor de Xeograf\u00eda
  e Historia no IES Campo de S. Alberto, de Noia, e despois o relatorio de Roc\u00edo
  Botana, doutora en Historia pola USC, \u201cA investigaci\u00f3n a microescala das
  migraci\u00f3ns galegas no s\u00e9culo pasado na contorna de Santiago\u201d.\\n\\nO
  Venres, 10 de maio, de novo no IES Poeta A\u00f1\u00f3n, realiz\u00e1ronse as seguintes
  conferencias: \u201cVivencias na di\u00e1spora e retorno na Galicia interior: o
  caso de Antas de Ulla\u201d, a cargo de Francisco Armas Quint\u00e1, profesor na
  Facultade de Ciencias da Educaci\u00f3n da USC, e \u201cEsa vais\u00e9, aquela vais\u00e9
  \u2026 as novas migraci\u00f3ns galegas na era da globalizaci\u00f3n\u201d, a cargo
  de\\n\\nRa\u00fal Soutelo presentando a charla de Ant\u00eda P\u00e9rez.\\n\\nAnt\u00eda
  P\u00e9rez Caram\u00e9s, profesora da Facultade de Sociolox\u00eda e Ciencia Pol\u00edtica
  da Universidade da Coru\u00f1a.\\n\\nPech\u00e1ronse as xornadas no s\u00e1bado,
  11 de maio, na casa da cultura da Serra, con tres novas conferencias: a primeira,
  de Isidro Dubert, catedr\u00e1tico de H.\u00aa Moderna na USC, quen disertou sobre
  \u201cMitos e realidades sobre as consecuencias da emigraci\u00f3n nun pa\u00eds
  de vellos\u201d. A segunda, de Jes\u00fas Montero S\u00e1nchez, profesor no IES
  Campo de S. Alberto, de Noia, quen falou sobre \u201cO estudo das migraci\u00f3ns
  como recurso did\u00e1ctico na educaci\u00f3n de adultos\u201d, a que seguiu a presentaci\u00f3n
  do documental *Cruzar a fronteira*, elaborado no seu propio instituto por alumnado
  e profesorado no marco dun programa colaborativo europeo con outros centros educativos
  da Croacia, Eslovenia, Grecia e Portugal durante os anos 2014-16. E a terceira,
  a cargo de Ram\u00f3n Blanco: \u201cDomingo Send\u00f3n: Poeta emigrante na Arxentina\u201d,
  seguido da presentaci\u00f3n do libro de Domingo Send\u00f3n, *De Outes a San Telmo*,
