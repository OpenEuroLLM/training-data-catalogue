  e a s\u00faa aplicaci\u00f3n pr\u00e1ctica no piano, como b\u00fasqueda de novos
  efectos sonoros.\\n- Exploraci\u00f3n  e  exteriorizaci\u00f3n  da  propia  persoalidade  creadora  mediante  a
  improvisaci\u00f3n  (no  sentido  m\u00e1is  amplo  posible:  mel\u00f3dica,  arm\u00f3nica,
  r\u00edtmica,t\u00edmbrica , libre,... )\\n- Improvisar textos musicais e formais
  de dificultade crecente.\\n- Comprender e aplicar con maior soltura os sustentos
  necesarios dende os que realizar unha improvisaci\u00f3n arm\u00f3nica de dificultade
  crecente.\\n\\nContidos\\n\\n- Creaci\u00f3n de ostinatos e c\u00e9lulas r\u00edtmicas
  m\u00e1is complexos.\\n- Realizaci\u00f3n de exercicios de construcci\u00f3n formal  de
  dificultade crecente, segundo os seguintes par\u00e1metros orientativos:\\n- Escalas
  de ata unha alteraci\u00f3n.\\n- Experimentaci\u00f3n con escalas non tonais (blues,
  oriental- Eva Mal\u00eda 3)\\n- Figuras b\u00e1sicas redonda, branca, negra e corchea
  e os seus respectivos silencios.\\n- Ampliaci\u00f3n dos compases empregados   :
  3/8, 6/8\\n- Inclusi\u00f3n do crescendo e o diminuendo.\\n- Ampliaci\u00f3n das
  articulaci\u00f3ns empregadas: sforzando, acentos.\\n- Improvisaci\u00f3ns arm\u00f3nicas:
  acompa\u00f1amento de melod\u00edas dadas ou improvisadas polos alumnos , empregando
  os acordes de I e  IV, V e VI.\\n- Familiarizaci\u00f3n crecente coas graf\u00edas
  non tradicion\u00e1is.\\n- Resoluci\u00f3n e inventiva  na b\u00fasqueda das posibilidades
  t\u00edmbricas do instrumento,\\n\\ntanto dentro como fora do teclado.\\n\\n- Creaci\u00f3n
  da imaxe est\u00e9tica da m\u00fasica: asociaci\u00f3n da m\u00fasica que se toca
  ou se escoita coas propias emoci\u00f3ns e pensamentos a trav\u00e9s de exercicios
  como:\\n- Improvisaci\u00f3n medio-libre de elementos dados  nas que s\u00f3 se
  poden empregar ditos elementos pero tratados dentro dunha gran liberdade (amplitude
  de rexistro, matices, articulaci\u00f3ns,...)\\n- Libre improvisaci\u00f3n con un
  car\u00e1cter prefixado ou suxerido por un relato,  a visi\u00f3n dun debuxo ou
  pintura.\\n- Interpretaci\u00f3n  de  diversos  caracteres  prefixados  sobre  un  material  proposto,
  asociando xestos e movementos \u00e1 interpretaci\u00f3n.\\n- Creaci\u00f3n de contos
  musicais  sinxelos nos que se asociar\u00e1 todo movemento no piano a unha idea,
  personaxe, sensaci\u00f3n.\\n\\nMaterial orientativo:\\n\\n- \\\"Piano colectivo
  G.E. 1\u00ba curso\\\" de Emilio Molina\\n- \\\"Clase colectiva de piano vol. 3\\\"
  de Eva Mal\u00eda\\n\\n5. Conciencia corporal: Respiraci\u00f3n y relaxaci\u00f3n\\n\\n1\u00ba
  G.E.\\n\\nObxectivos\\n\\n- Tomar conciencia de los aspectos b\u00e1sicos de la
  respiraci\u00f3n. Inicio en el h\u00e1bito de la respiraci\u00f3n consciente y controlada.\\n-
  Adoptar unha posici\u00f3n correcta \u00f3 piano.\\n- Trabajar la percepci\u00f3n
  da propia conciencia corporal.\\n\\nContidos\\n\\n- Pr\u00e1ctica de exercicios
  respiratorios de inspiraci\u00f3n, retenci\u00f3n y espiraci\u00f3n.\\n- Iniciaci\u00f3n
  a la pr\u00e1ctica da respiraci\u00f3n diafragm\u00e1tica.\\n- Interiorizaci\u00f3n
  de las sensacions tensi\u00f3n y relaxaci\u00f3n.\\n- Toma de conciencia do propio
  cuerpo.\\n\\n2\u00ba G.E.\\n\\nObxectivos\\n\\n- Tomar conciencia da importancia
  da respiraci\u00f3n: inspiraci\u00f3n, retenci\u00f3n y espiraci\u00f3n.\\n- Adoptar
  unha posici\u00f3n corporal en perfecto equilibrio.\\n- Experimentar la relaxaci\u00f3n
  muscular: peso do brazo.\\n\\n- Adquirir un dominio progresivo do xesto corporal
  como medio de transmisi\u00f3n da expresi\u00f3n musical.\\n\\nContidos\\n\\n- Pr\u00e1ctica
  da respiraci\u00f3n r\u00edtmica.\\n- Habito de manter unha posici\u00f3n corporal
  en perfecto equilibrio.\\n- Concienciaci\u00f3n da relaxaci\u00f3n dos m\u00fasculos
  de todo o corpo: interrelaci\u00f3n entre gravedad y acci\u00f3n muscular.\\n- Concepci\u00f3n
  do brazo na sua totalidade.\\n\\n3\u00ba G.E.\\n\\nObxectivos\\n\\n- Controlar conscientemente
  a respiraci\u00f3n.\\n- Adoptar unha posici\u00f3n corporal en perfecto equilibrio.\\n-
  Experimentar a relaxaci\u00f3n da toda a musculatura.\\n- Establecer un exe s\u00f3lido
  dende a cabeza a os pes.\\n- Adquirir un dominio progresivo do xesto corporal como
  medio de transmisi\u00f3n da expresi\u00f3n musical.\\n- Cultivar  h\u00e1bitos
  f\u00edsicos saludables en prevenci\u00f3n de posibles problemas musculares.\\n\\nContidos\\n\\n-
  Control consciente da respiraci\u00f3n\\n- Concienciaci\u00f3n da relaxaci\u00f3n
  dos m\u00fasculos de hombros, cuello y cara.\\n- Asentamento da posici\u00f3n corporal
  equilibrada, establecendo un exe s\u00f3lido desde a cabeza a os pes.\\n- Prevenci\u00f3n
  de posibles problemas musculares mediante h\u00e1bitos  f\u00edsicos saudables.\\n\\n4\u00ba
  G.E.\\n\\nObxectivos\\n\\n- Controlar conscientemente a respiraci\u00f3n en cuatro
  tiempos: inspiraci\u00f3n, retenci\u00f3n, espiraci\u00f3n y descanso..\\n- Adoptar
  unha posici\u00f3n corporal en perfecto equilibrio.\\n- Adquirir un dominio progresivo
  do xesto corporal como medio de transmisi\u00f3n da expresi\u00f3n musical.\\n-
  Experimentar la relaxaci\u00f3n muscular do corpo considerado en su conxunto.\\n\\n-
  Fomentar a concentraci\u00f3n  e atenci\u00f3n como elemento b\u00e1sico de traballo.\\n\\nContidos\\n\\n-
  Control consciente de la respiraci\u00f3n adaptada  a las necesidades musicais.\\n-
  Experimentaci\u00f3n de la relaxaci\u00f3n muscular de todo o corpo.\\n- Logro da
  concentraci\u00f3n y atenci\u00f3n como ferramenta fundamental na consecuci\u00f3n
