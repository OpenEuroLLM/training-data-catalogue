  ANA DOMINGUEZ ALMAO\\n\\n1- PARTICIPACION Y REGLAMENTACION\\n\\n- Poder\u00e1n participar
  soamente atletas federados\\n\\n2- INSCRIPCIONES\\n\\nInscripciones  pecharasen
  as 24:00 dO DOMINGO 5 DE XUNIO,PARA O MARTES E O LUNS 6 PARA O VENRES on line en
