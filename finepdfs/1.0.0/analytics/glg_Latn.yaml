  os efectos oportunos.\\\"\\n\\nA Xunta de Goberno Local, por unanimidade dos oito
  concelleiros que a compo\u00f1en, aprobou a proposta tal e como foi transcrita.\\n\\nE
  non habendo m\u00e1is asuntos que tratar, remata a sesi\u00f3n sendo as nove horas
  e dez minutos, do que eu, secretaria accidental, certifico.\\n\\nO presidente\\n\\nA
  secretaria accidental\\n\\n\u00d3scar A. Garc\u00eda Pati\u00f1o\\n\\nM\u00aa del
  Juncal Cap\u00edn Fonseca\"", "\"Cr\u00f3nica da Igrexa\\n\\nCarta desde a banda
  da esperanza\\n\\nManuel Regal Ledo\\n\\nNo \u00faltimo d\u00eda do ano pasado soubemos
  da renuncia do norteamericano Greg Burke e da espa\u00f1ola Paloma Garc\u00eda Ovejero,
  director e vicedirectora da Sala de Prensa da Santa S\u00e9. Seica o fac\u00edan
  moi ben. Seica non chegaba, con todo, coa s\u00faa humanidade, coa s\u00faa dispo\u00f1ibilidade.
  Seica o novo prefecto do Dicasterio para a Comunicaci\u00f3n, Paolo Rufini, quer\u00eda
  formar o seu propio equipo. Quen sabe? En Encrucillada polo de agora non hai dimisi\u00f3ns,
  e aqu\u00ed estamos unha vez m\u00e1is ao comezo deste ano, dispostos a compartir
  feitos acontecidos e reflexi\u00f3ns sobre dos mesmos que consideremos de interese
  para quen lea esta revista. Oxal\u00e1 poidamos cumprir ben co noso cativi\u00f1o
  oficio de intercomunicaci\u00f3n! Oxal\u00e1! Desexando, logo, que esta Cr\u00f3nica
  vos atope empezando o presente ano con paz, con ben e con moitos alentos, vamos
  al\u00f3!\\n\\n1.- Unha esperanzadora noticia\\n\\nFoi noticia no pasado outono.
  O bispo norteamericano de Bridgeport, Frank Caggiano nomeaba a unha muller, Eleanor
  W. Sauers, coordinadora da vida parroquial da parroquia de San Antonio do Padua
  en Fairfiel, cun poder decisorio coma o de calquera cura. Iso si, queda integrada
  nun equipo de curas do contorno para \u00abproporcionar os ministerios sacramentais\u00bb.
  Pres\u00e9ntasenos a noticia como algo moi singular, como se fose a primeira muller
  no mundo que recibe tal \u00abpoder\u00bb pastoral; sen embargo, sen ir m\u00e1is
  lonxe, co\u00f1ecemos, por exemplo, no mesmo Pa\u00eds Vasco a mulleres relixiosas
  que practicamente est\u00e1n coordinando a vida parroquial en zonas do rural, e
  seguro que tam\u00e9n coordinadas con alg\u00fan cura que lles garante certos servizos
  sacramentais. M\u00e1is al\u00e1 de que se estea a falar ou non dunha experiencia
  que\\n\\nse estrea, a nova \u00e9 significativa; pod\u00e9mola ver como algo do
  m\u00e1is normal do mundo: por que non pode unha muller, por ser muller, asumir
  e cumprir con esa responsabilidade eclesial (supo\u00f1\u00e9moslle a capacitaci\u00f3n,
  claro)? Pero tam\u00e9n a podemos ver como algo sen sentido: por que ten que depender
  dun cura para certos ministerios sacramentais? Por que sinxelamente non pode ser
  ordenada cura?\\n\\nNon sabemos se, dentro dos exquisitos distingos teol\u00f3xicos
  que se manexan nestes temas, se pode afirmar que a funci\u00f3n de coordinar a vida
  parroquial dunha comunidade, con poder decisorio coma o de calquera cura, leva consigo
  participar do \u00abpoder ou servizo\u00bb sacerdotal que confire a ordenaci\u00f3n.
  Pensamos que os responsables de tal decisi\u00f3n entenden que non, pois sen\u00f3n
  non o far\u00edan. Pero non deixa de ser algo con certa anormalidade cando menos:
  pode crear, coidar, rexer, formar, potenciar a comunidade \u2013cos equipos correspondentes,
  ent\u00e9ndese\u2013, pero non pode celebrar coa mesma comunidade os sacramentos
  que expresan e potencian a vida que d\u00eda a d\u00eda van vivindo? Pode predicar,
  servir a mesa da Palabra \u2013que xuntamente co rito eucar\u00edstico forma parte
  en igualdade de condici\u00f3ns do conxunto da celebraci\u00f3n da Eucarist\u00eda\u2013,
  pero non pode servir a mesa do Pan e do Vi\u00f1o santos de Xes\u00fas? Non nos
  estamos contradicindo? Non estamos entrando nunha l\u00f3xica absurda, moi dif\u00edcil
  de entender para calquera persoa que te\u00f1a sentido com\u00fan, que te\u00f1a
  sentido cristi\u00e1n?\\n\\nCon todo e iso, pensamos que a noticia \u00e9 positiva.
  Na medida en que estes casos se multipliquen, e oxal\u00e1 que as\u00ed suceda coa
  simple normalidade da vida, \u00e9 moi posible que en todo o pobo de Deus e na mesma
  xerarqu\u00eda relativicemos certas construci\u00f3ns teol\u00f3xicas, que hoxe
  se defenden con teimos\u00eda coma cousa do mesmo Deus (!).\\n\\n2.- Isto si que
  \u00e9 evanxelizar!\\n\\nCuriosamente foi isto o primeiro que se nos veu \u00e1
  cabeza ao recibir e ler a informaci\u00f3n da beatificaci\u00f3n en Or\u00e1n \u2013primeira
  vez que se fai unha beatificaci\u00f3n nun pa\u00eds musulm\u00e1n\u2014 das 19
  persoas cristi\u00e1s, m\u00e1rtires en Alxeria durante a sanguinolenta guerra civil
  que conmocionou o\\n\\npa\u00eds durante m\u00e1is de 10 anos e na que morreron
  200.000 persoas. Entre esta xente, no bienio 1994-1996, foron asasinados o bispo
  Pierre Claverie, os sete monxes cistercienses que na pel\u00edcula \u00abDe dioses
  y hombres\u00bb se amosaron ao mundo na s\u00faa inocencia evanxelizadora, d\u00faas
  relixiosas espa\u00f1olas, agosti\u00f1as misioneiras, Esther e Caridade, e sete
  persoas m\u00e1is. Un conxunto de francesas, espa\u00f1olas, belgas, maltesas de
  orixe, pertencentes a 8 congregaci\u00f3ns relixiosas diferentes, pero unidas na
  s\u00faa vontade de compartir fe e vida coa poboaci\u00f3n musulm\u00e1 e na s\u00faa
  decisi\u00f3n meditada, discernida, orada, de seguir vivindo en Alxeria a\u00ednda
  sabendo que, dadas as circunstancias, tal decisi\u00f3n implicaba o risco grave
  de acabar sendo asasinadas por musulm\u00e1ns radicais, como as\u00ed foi. Conforme
  escribiu algunha desas persoas, \u00abningu\u00e9n nos poder quitar a vida, porque
  nosoutras xa a temos entregado\u00bb. C\u00f3mpre dicir que desa onda de violencia
  foi v\u00edtima tam\u00e9n un considerable n\u00famero de im\u00e1ns que igualmente
  optaran por unha convencida convivencia fraterna coa xente de f\u00f3ra que a eles
  se achegara con aires de irm\u00e1s e de irm\u00e1ns. Pod\u00e9molos considerar
  im\u00e1ns beatificados, dignos do noso agradecemento e devoci\u00f3n.\\n\\nIsto
  si que \u00e9 evanxelizar! E \u00e9o loxicamente por testemu\u00f1ar co seu sangue,
  coa s\u00faa vida, a autenticidade e decisi\u00f3n da s\u00faa aposta misioneira.
  Pero \u00e9o tam\u00e9n, e de que maneira, polo estilo de presenza evanxelizadora
  que sempre nos conmociona, e que nos desvela as formas da verdadeira evanxelizaci\u00f3n,
  a \u00fanica forma, case ousariamos dicir, que ser\u00e1 efectiva nos tempos de
  desleixe relixioso que todo o envolve, polo menos neste mundo occidental noso, esc\u00e9ptico
  e abondo queimado cara \u00e1 fe e cara a quen a practica. Homes e mulleres de moito
  silencio, de paz fonda, de simple e recia fraternidade, de servizo absolutamente
  gratu\u00edto, pobres de corpo e de esp\u00edrito, reco\u00f1ecendo e agradecendo
  os dons de Deus en xente de fe distinta, persoas dispostas a dar e recibir, a enriquecerse
  coas vidas de quen as rodea, nunha confluencia indescritible de corpos e almas,
  e todo dentro dunha vida humilde nunhas fraternidades acolledoras\u2026, quen pode
  burlarse de semellante testemu\u00f1o e non cuestionarse ante el? Quen non queda
  pampo ante tal humild\u00edsima provocaci\u00f3n? Os homes e mulleres beatificadas
  en Or\u00e1n, rubricaron co seu sangue as li\u00f1as de presenza eclesial que marcar\u00e1n
  tendencia. A xente cristi\u00e1 do s\u00e9culo XXI \u2013o noso\u2013 ou ser\u00e1
  m\u00edstica, ou non ser\u00e1; ou ser\u00e1 sinxelisimamente radical, ou non ser\u00e1;
  ou ser\u00e1 humildisimamente fraterna, ou non ser\u00e1. Unha imprescindible orientaci\u00f3n
  para quen nos xuntamos unha e mil veces debullando plans evanxelizadores, que nunca
  acaban de ser efectivos. As cousas como son, ho!, as cousas como son!\\n\\n3.- E
  isto tam\u00e9n o \u00e9!\\n\\nQuen isto escribe tivo a sorte de co\u00f1ecer Taiz\u00e9
  al\u00e1 polo ano setenta e poucos. Fun al\u00e1 m\u00e1is ca nada de curioso ante
  un fen\u00f3meno do que todo o mundo falaba, e falaba moi ben. Grazas a unha carti\u00f1a
  de recomendaci\u00f3n, fun admitido non na comunidade, pero si nun espazo algo particular,
  relativamente c\u00f3modo, e non entre o rebumbio da mocidade que se ama\u00f1aba
  como pod\u00eda para convivir, acougar e festexar. Fun aos encontros de oraci\u00f3n.
  Quedei desbordado por aquela maneira de facer oraci\u00f3n, intensa, contemplativa,
  regulada e libre a un tempo, na que moita mocidade participaba con gusto e a fondo.
  Pero penso que daquela non dei entrado na graza de Taiz\u00e9. Era moito para min,
  afeito a regulaci\u00f3ns lit\u00farxicas e doutrinais. Souben tam\u00e9n das s\u00faas
  movidas coa mocidade, o atractivo que nela produc\u00eda, o seguimento que provocaba,
  que se concretaba nunha busca espiritual firme e libre, e nun compromiso coas causas
  da paz e da xustiza no mundo en diferentes variantes. Daquela era prior da comunidade
  o fundador carism\u00e1tico Roger Schutz, que no 1940 iniciara nese lugar da Borgo\u00f1a,
  en Francia, a experiencia dunha comunidade mon\u00e1stica ecum\u00e9nica aberta
  a Deus, claro, e aberta ao mundo. Como complemento \u00e1 vida e acci\u00f3n propia
  desde o mesmo mosteiro, acordaron entre outras cousas a organizaci\u00f3n dos Encontros
  Europeos da mocidade que chegou hai poucos d\u00edas \u00e1 s\u00faa 41\u00aa edici\u00f3n;
  celebrouse en Madrid do 28 de decembro ao 1 de xaneiro. Noutros anos xa se celebrara
  este evento en Barcelona, Sevilla e Valencia. \u00abPeregrinaci\u00f3n da Confianza\u00bb,
  as\u00ed se titulaba este ano o encontro; trat\u00e1base de vivir e provocar a experiencia
  de confiar acollendo: acoller a esa mocidade era xa un sinal de confianza, e o esp\u00edrito
  de confianza quer\u00edano promover cara a calquera que de dentro ou de f\u00f3ra
  pete \u00e1s nosas portas. Un asunto ben crucial no noso momento europeo, con tanto
  af\u00e1n proteccionista do propio ante o que se entende como invasi\u00f3n dos
  alleos. Quince mil mozos e mozas en encontros de oraci\u00f3n, en obradoiros diversos,
  en horas de festa e celebraci\u00f3n, ben apoiados pola Igrexa madrile\u00f1a coa
  implicaci\u00f3n directa do mesmo cardeal Osoro. Actualmente lidera todo o movemento
  de Taiz\u00e9 o irm\u00e1n e prior Alois L\u00f6ser.\\n\\nChama a atenci\u00f3n
  en todo o de Taiz\u00e9 a s\u00faa vontade ecum\u00e9nica: desde a composici\u00f3n
  da mesma comunidade, onde est\u00e1n integrados monxes de diferentes confesi\u00f3ns
  cristi\u00e1s; ata o movemento xerado ao seu redor, no que colaboran comunidades
  relixiosas, cregos e laicado cat\u00f3lico; ata o desenvolvemento de calquera actividade
  lit\u00farxica ou non lit\u00farxica: a ningu\u00e9n se lle pregunta se cre ou non
  cre, que cre ou que deixa de crer (a\u00ednda que todo iso co tempo cada quen o
  ir\u00e1 aclarando); as celebraci\u00f3ns son abertas e aberto \u00e9 o Pan eucar\u00edstico
  que se comunga; ir\u00e1 sabendo o propio asistente desde onde comunga ou deixa
  de comungar. Pot\u00e9nciase en Taiz\u00e9 un ecumenismo da pregaria e un ecumenismo
  da implicaci\u00f3n solidaria. O ecumenismo doutrinal non se menospreza, pero queda
  para un tempo segundo, porque realmente iso non \u00e9 o que m\u00e1is abre cami\u00f1os
  de fraternidade. En Taiz\u00e9 non \u00e9 prioritario indicarlle \u00e1 xente nova,
  e non nova, o que ten que crer, o que ten que facer; fundamentalmente esc\u00f3itase,
  ac\u00f3llese, ofr\u00e9cese unha sensibilidade evanx\u00e9lica, e prom\u00f3vese
  un cami\u00f1o polo que andar en comunidade. E todo ir\u00e1 vindo ao ritmo do que
  o esp\u00edrito vaia provocando en cada quen. Non \u00e9, nin buscan que o sexa,
  un movemento de masas, como as nosas XMX, pero indubidablemente t\u00e9\u00f1ense
  convertido nun lugar de esperanza e nun referente importante cara \u00e1 entrada
  do Evanxeo na poboaci\u00f3n xuvenil, que a outras estratexias parece bastante impermeable.\\n\\nAs
  nosas XMX d\u00e9benlle a idea, e posiblemente moito m\u00e1is, a estas iniciativas
  de Taiz\u00e9. Pero te\u00f1en un talante distinto, interno e externo. Oxal\u00e1
  sigan sumando creatividade e froitos coma os grupos de Taiz\u00e9. Oxal\u00e1 nolo
  confirme a pr\u00f3xima XMX de Panam\u00e1, a celebrar naquel pa\u00eds centroamericano
  entre o 23 e o 27 do presente mes, cando xa esta Cr\u00f3nica andar\u00e1 cami\u00f1o
  do prelo.\\n\\n4.- A voltas coa xente defunta\\n\\nSe na Cr\u00f3nica anterior falabamos
  do caso dun crego que dic\u00eda non entender a falla de atenci\u00f3n a ese colectivo
  rural de velli\u00f1os e velli\u00f1as soas e desoladas, agora \u00e9 outro crego
  o que nos comenta a s\u00faa inquedanza interior despois de enterrar na \u00faltima
  semana ata a 10 persoas, e de preguntarse que facer e que non facer como guieiro
  da comunidade cristi\u00e1 ante o caso repetido de tantas mortes que lle pasan polas
  mans. Ti\u00f1a o tal crego a sensaci\u00f3n de que seguir os rituais lit\u00farxicos
  non estaba valendo para moito, que sobraban moitos textos, moitas palabras, moitos
  ritos, que \u00edan acumulando rutinas, e que faltaba a ousad\u00eda de romper moldes,
  lembrar a Xes\u00fas e a s\u00faa maneira de ser coa xente, e desde a\u00ed po\u00f1er
  calor humano e confianza e esperanza cristi\u00e1 na familia da persoa defunta e
  no contorno veci\u00f1al que a acompa\u00f1a.\\n\\nA impresi\u00f3n deste crego
  v\u00e9mola reforzada polas palabras e polos silencios doutros moitos, que viven
  os enterros como un ritual rutineiro e \u00e1s veces esgotador, que empeza xa no
  momento en que se comunica polos medios a defunci\u00f3n da persoa \u00abdespois
  de ter recibido os santos sacramentos e a bendici\u00f3n da s\u00faa Santidade\u00bb,
  cousa que \u00e9 mentira no 99,9% dos casos.\\n\\nEmporiso, o certo \u00e9 que nos
  diferentes rituais funerarios (velorio, Misa, enterro) \u00e9 onde hoxe por hoxe
  m\u00e1is p\u00fablico asiste \u00e1s nosas celebraci\u00f3ns; m\u00e1is p\u00fablico
  e m\u00e1is variado en idade e incluso en vinculaci\u00f3n relixiosa. Podemos ver
  nos velorios e nos funerais de enterro a xente nova que normalmente non aparece
  pola igrexa, e podemos ver xente que ten roto coa Igrexa ou que vive na pr\u00e1ctica
  desvinculaci\u00f3n coa mesma. Pero ese d\u00eda est\u00e1n a\u00ed, por raz\u00f3ns
  de calquera \u00edndole, en xeral sempre positivo,\\n\\npero est\u00e1n a\u00ed.
  O cal quere dicir que, respectando cada singular circunstancia \u2013da que non
  \u00e9 ben aproveitarse para botar a cana\u2013, o normal ser\u00eda desenvolver
  o acto lit\u00farxico tendo moi en conta esa situaci\u00f3n e facelo todo coa conciencia
  de que o ben ou o mal que fagamos as cousas, a rutina ou a viveza coa que celebremos,
  vai deixar pouso no p\u00fablico que nos acompa\u00f1a, e espertar\u00e1 ou afogar\u00e1
  preguntas en quen circunstancialmente nos acompa\u00f1a.\\n\\nPero tam\u00e9n a
  comunidade cristi\u00e1 m\u00e1is fiel ten dereito a ser fortalecida nunha vivencia
  humana e cristi\u00e1 destes acontecementos m\u00e1is ou menos dolorosos. Desde
  unha sa vivencia relixiosa podemos axudar a retirar formulismos in\u00fatiles, mesmo
  vaidosos, a asumir a condici\u00f3n fr\u00e1xil da nosa existencia, a encher de
  afecto, tenrura, fe e esperanza todo o espazo da celebraci\u00f3n, a crear v\u00ednculos
  corporais e espirituais que poden ser, quen sabe, o comezo de algo humildemente
  novo na vida das persoas m\u00e1is directamente afectadas.\\n\\nOs velorios poden
  ser humildes escolas de aprendizaxe de oraci\u00f3n. Os funerais poden ser humildes
  escolas de aprendizaxe de celebraci\u00f3n cristi\u00e1. Aplicando o principio de
  que somos igrexa en misi\u00f3n. Algo que, coma no caso do amor, \u00e9 un arte,
  e, polo tanto, precisa carisma e graza, pero tam\u00e9n atenci\u00f3n e dedicaci\u00f3n,
  tempo e imaxinaci\u00f3n. O crego antedito, por sorte, anda nesas. E ben se lle
  nota.\\n\\n5.- Desde Ourense, paso a paso\\n\\nG\u00fastanos seguirlle os pasos,
  no que podemos, ao que nas dioceses galegas se est\u00e1 a facer por abrir cami\u00f1os
  de evanxelizaci\u00f3n na situaci\u00f3n actual, por diferentes raz\u00f3ns tan
  complexa. Xa sabemos que por Ourense andan en S\u00ednodo. Poderiamos dicir que
  \u00e9 a moda agora iso dos S\u00ednodos: cando non sabemos que facer, facemos un
  S\u00ednodo. Pero \u00e9 que, quizais, xustamente debe ser as\u00ed: cando nos atopamos
  nunha situaci\u00f3n de afogo evanxelizador, cando os problemas se nos botan enriba
  e non sabemos por onde coller, o mellor \u00e9 parar, sentar, falar abertamente,
  dar ideas e dispo\u00f1erse a facer cami\u00f1os. Outra cousa \u00e9 que agardemos
  dos S\u00ednodos\\n\\nremedios doados, soluci\u00f3ns inmediatas, e non soamente
  pistas, criterios polos que apostar e sobre os que organizar unha actividade evanxelizadora
  que en calquera caso se presenta dif\u00edcil e arriscada, necesitada de imaxinaci\u00f3n
  e de fortaleza.\\n\\nO Secretariado do S\u00ednodo diocesano de Ourense v\u00e9n
  de facer p\u00fablicas as conclusi\u00f3ns dun estudo socio-relixioso do Ourense
  rural, no que intenta achegarse \u00e1 situaci\u00f3n demogr\u00e1fica das parroquias
  rurais e a diferentes aspectos da s\u00faa relixiosidade. Tr\u00e1tase, xaora, de
  co\u00f1ecer a evoluci\u00f3n das \u00faltimas d\u00e9cadas ao respecto, de decatarse
  da situaci\u00f3n actual e de prever por onde poder\u00edan ir as cousas nos pr\u00f3ximos
  anos. Para iso base\u00e1ronse en datos do Instituto Galego de Estat\u00edstica,
  e m\u00e1is en informaci\u00f3ns directas dos curas de cada lugar. Tr\u00e1tase
  de dar informaci\u00f3n aos grupos ou comunidades sinodais, para que te\u00f1an
  elementos a partir dos cales ofrecer alg\u00fan tipo de proposta evanxelizadora
  que responda as necesidades e demandas.\\n\\nTemos que reco\u00f1ecer que os datos
  ofrecidos non defiren case dos que se van recollendo nos territorios rurais do interior
  das dioceses galegas: acent\u00faase o despoboamento dos n\u00facleos menores (case
  todas as parroquias rurais), o envellecemento e a soidade da poboaci\u00f3n como
  gran problema; moi pouca actividade asociativa, ag\u00e1s ao redor das comunidades
  de montes veci\u00f1ais; moita festa e romar\u00eda; a poboaci\u00f3n adulta \u2013non
  as\u00ed a nova\u2013 v\u00e9n sendo bastante receptiva \u00e1 Igrexa; todo se fai
  polo cura e sen o cura non se fai nada de canto se fai, pero os curas van indo a
  menos e van entrando tam\u00e9n en anos, a\u00ednda que a carga parroquial \u00e9
  moito maior noutras zonas de Galicia; poucos bautizos, primeiras comu\u00f1\u00f3ns,
  e confirmaci\u00f3ns e, curiosamente, bastante pr\u00e1ctica dominical en poboaci\u00f3ns
  de 50 habitantes para abaixo (40%). Tres de cada catro casamentos fanse pola Igrexa,
  cousa que nos sorprende e a Unci\u00f3n da xente enferma ten pouca demanda. Da Confesi\u00f3n
  non se di nada.\\n\\nComo ben apuntan no informe, a realidade presenta un problema
  de tipo eclesial, pero tam\u00e9n de tipo social, pol\u00edtico, que polo mesmo
  deber\u00eda acentuar a intensidade do problema eclesial. Veremos en que d\u00e1
  a Igrexa ourens\u00e1. Por seren da terra da chispa, ben nos vir\u00eda a todos
  os galegos e galegas que prendese nela a chispa da imaxinaci\u00f3n, da creatividade,
  da ousad\u00eda, da aventura evanxelizadora, da intensidade, das fidelidades fundamentais.
  Estamos en tempos diferentes. Por unha banda o asentamento poboacional, que levaba
  sobre 10-12 s\u00e9culos m\u00e1is ou menos estabilizado entre n\u00f3s, vai sufrir
  unha modificaci\u00f3n substancial, que nos fai pensar claramente nunha configuraci\u00f3n
  nova dos asentamentos humanos. Haber\u00e1 que adaptarse a iso, v\u00e9ndoo como
  un deber urxente, a\u00ednda que non carente de dificultades? Por outra banda a
  escaseza de clero e o clericalismo que acompa\u00f1a \u00e1s nosas comunidades fainos
  pensar que por fin \u2013 cousas, se cadra, do mesmo Esp\u00edrito\u2013 nos temos
  que enfrontar coa necesidade perentoria de constru\u00edr comunidades cristi\u00e1s
  desclericalizadas, cousa nada doada, para a que nin o clero nin o laicado estamos
  nin afeitos, nin, se cadra, formados. E, como corrente de fondo, este ollar de esguello
  a todo o que cheire a fe, e a toda a xente que ula a crente, cousa t\u00edpica dos
  nosos tempos, que engade un aquel de suspense ao que desde a Igrexa poidamos facer.
  Tempos recios, si, se\u00f1ora santa Tareixa, tempos recios tam\u00e9n os nosos.
  E non vale facer sempre o mesmo, se os tempos son outros e queremos responder a
  realidades diferentes. Deus nos colla ao axexo, sabendo mesturar paciencia e urxencia,
  esforzo e confianza!\\n\\n6.- Algunhas realidades que poden mudarnos o coraz\u00f3n\\n\\nPresentamos
  a continuaci\u00f3n unha presa de feitos de forte significado humano e eclesial,
  cristi\u00e1n, que chegaron \u00e1s nosas portas baixo o formato dalgunha carta
  ou escrito co que os seus autores gustaron de compartir connosco as s\u00faas ansias
  e preocupaci\u00f3ns. Poder\u00e9delos atopar facilmente en Internet con escribir
  as palabras clave.\\n\\nO primeiro \u00e9 a carta que o Papa Francisco firmou o
  d\u00eda 1 de xaneiro, dirixida ao episcopado norteamericano. Unha carta \u00e1
  que precedera un encontro cos representantes oficiais da Conferencia Episcopal estadounidense,
  no que o mesmo\\n\\nPapa lles propuxera xuntarse en retiro espiritual durante uns
  d\u00edas, dirixidos polo predicador da Casa Pontificia Raniero Cantalamessa, coa
  promesa \u2013que logo non poder\u00eda cumprir\u2013 de acompa\u00f1alos el mesmo.
  O retiro empezar\u00eda o 2 de xaneiro e entendemos que o Papa supliu a s\u00faa
  asistencia imposible por este escrito. Estamos ante un escrito in\u00e9dito pola
  s\u00faa mesma publicidade e, desde logo, polo seu contido espido, forte, contundente,
  situando a todo o episcopado norteamericano ante as cordas de Deus e da s\u00faa
  propia consciencia, encarec\u00e9ndolles vivisimamente a pr\u00e1ctica dun discernimento
  humilde, pero a cara de can, dada a situaci\u00f3n dram\u00e1tica na que se atopa
  a Igrexa deste pa\u00eds: os rastros da pederastia, practicada e/ou ocultada, colocando
  a credibilidade eclesial a niveis \u00ednfimos cara a dentro e cara a f\u00f3ra
  do catolicismo naquel pa\u00eds, e un distanciamento dentro do mesmo episcopado,
  que, no canto de afrontar de maneira adulta e responsable os conflitos e tensi\u00f3ns
  existentes, des\u00e1tase en palabras e xestos de mutuo desprestixio, deslexitimaci\u00f3n,
  reproches, vitimizaci\u00f3ns. \u00abAs ideas disc\u00fatense; as situaci\u00f3ns
  vitais disc\u00edrnense\u00bb; esta \u00e9 a proposta do Papa. E o seu escrito \u2013en
  ampla esexese das palabras de Mt 20,26: \u00abPero entre v\u00f3s non pode ser as\u00ed\u00bb\u2013
  abunda en motivaci\u00f3ns para que os interesados se comprometan con algo tan necesario
  como cristi\u00e1ns e como l\u00edderes de comunidades diocesanas.\\n\\nEsperemos,
  polo ben de toda a Igrexa, que as\u00ed o fagan. Dos 480 bispos pertencentes a esa
  Conferencia, 185 non acudiron ao encontro de oraci\u00f3n proposto. Por raz\u00f3ns
  de axenda laboral, mental ou sentimental? Algo forte, desde logo, ao que ben podemos
  sumar tam\u00e9n a nosa pregaria. Polo demais, o escrito, a\u00ednda que dirixido
  a quen vai dirixido, pode ser de moito proveito para calquera outra persoa ou grupo
  que nos encontremos ante a necesidade de ter que resolver calquera clase de conflito
  ou tensi\u00f3n que te\u00f1an que ver coa nosa tarefa de servir ao Evanxeo e das
  maneiras como facelo.\\n\\nO segundo feito a comentar \u00e9 a carta que o te\u00f3logo
  Gonz\u00e1lez Faus dirixiu a Bernardo Montoya, presunto asasino da Laura Luelmo.
  Como case todo o que escribe este velli\u00f1o sabio \u2013 que Deus nolo conserve
  moitos anos\u2013, as s\u00faas palabras rompen cos moldes presumibles, dan que
  pensar e fan que todo o mundo nos sintamos persoas que temos que ver co sucedido,
  para acabar implic\u00e1ndonos a todos, causante e n\u00f3s mesmos, en retos humanitarios
  como \u00fanica sa\u00edda digna, cristi\u00e1.\\n\\nSospeita o autor que \u00e9
  frecuente que a maldade dunha persoa, que destr\u00fae e que se autodestr\u00fae,
  desborde a s\u00faa propia causa e responsabilidade e funda as s\u00faas ra\u00edces
  en factores colectivos, familiares e/ ou sociais. Vidas estragadas que reciben a
  condena contundente da sociedade, pero que seguen abertas a unha posibilidade de
  recuperar unha humanidade perdida a forza dun perd\u00f3n, que os humanos nos negamos
  a conceder, pero que Deus nunca nega, se a persoa sente necesidade del e o demanda.
  Estas situaci\u00f3ns col\u00f3cannos ante un reto de humanidade que non se resolve
  trivializando nada (nin a barbaridade feita, nin as responsabilidades m\u00faltiples,
  nin as escasas posibilidades de rehabilitaci\u00f3n, nin a forza renovadora dun
  perd\u00f3n firme), pero tampouco apelando \u00e1 acentuaci\u00f3n da condena sen
  m\u00e1is.\\n\\nUn escrito cheo de humanidade, aberto \u00e1s inimaxinables posibilidades
  do ser humano no mal e no ben, aberto \u00e1 fe, aberto ao Deus que pode ofrecer
  sentido \u00faltimo para males que en si parecen absolutamente herm\u00e9ticos.
  Agradec\u00e9mosllo, a\u00ednda sabendo que haber\u00e1 moita xente que disentir\u00e1
  e que o acusar\u00e1 de inxenuidade relixiosa. Agradec\u00e9mosllo especialmente
  ante a ausencia dunha voz m\u00e1is ou menos oficial da Igrexa espa\u00f1ola d\u00e1ndonos
  criterios para valorar e discernir cristianamente casos coma o presente, que por
  desgraza se repiten para desespero do conxunto da sociedade, sen que se suscite
  un debate humanitario denso e construtivo.\\n\\nO terceiro feito ten que ver co
  labor \u2013feitos e palabra dita e escrita\u2013 do arcebispo de T\u00e1nxer, o
  galego Santiago Agrelo, a quen m\u00e1is dunha vez temos nomeado nestas Cr\u00f3nicas.
  Por sorte non \u00e9 a \u00fanica voz eclesi\u00e1stica que se levanta para denunciar
  a barbaridade que estamos cometendo coa poboaci\u00f3n africana que, farta de medos,
  guerras, violencias, vida arrastrada, decide emprender unha aventura que saben infernal,
  con tal de poder chegar quiz\u00e1s, se a boa sorte os acompa\u00f1a, a un lugar
  que so\u00f1an cheo de posibilidades, de dignidade. Se soubesen!\\n\\nAlgo do que
  acontece \u00edmolo sabendo polos relatos oficiais, atentos sobre todo a aqueles
  grupos que, por audacia propia ou por imprescindible axuda de Salvamento Mar\u00edtimo
  ou ONGs, dan pisado terreo europeo. Moitas son as s\u00faas penalidades pasadas
  e presentes que ignoramos. Santiago Agrelo, ao p\u00e9 do drama diariamente, por
  convencemento e conversi\u00f3n, ten asumido o papel de denunciar a inhumanidade
  existente en tanto comportamento europeo sa\u00eddo de mentes e pol\u00edticas que
  non acaban de ver este problema como un problema humanitario que a todo o mundo
  nos afecta e nos incumbe. Boa proba diso foi a recente Conferencia Mundial sobre
  as Migraci\u00f3ns que a ONU organizou en Marrakech (Marruecos) os d\u00edas 10
  e 11 de decembro pasado. Aparentemente o resultado foi positivo, pois firmouse o
  primeiro \u00abPacto Global para unha Migraci\u00f3n Segura, Ordenada e\\n\\nRegular\u00bb,
  pero a sensaci\u00f3n xeral era de que nada \u00eda cambiar o estado de cousas,
  porque, a\u00ednda que participaron 164 pa\u00edses, houbo ausencias importantes
  como a de Estados Unidos, Brasil, Australia, Israel; outros pa\u00edses presentes
  non o firmaron, como Italia, Eslovaquia, Hungr\u00eda, Polonia, Rep\u00fablica Checa,
  e desentend\u00e9ronse de calquera compromiso cun escrito que, incluso para quen
  si o firmou, non \u00e9 vinculante. Unha conferencia e un Pacto Global polo que
  a Igrexa si apostou decididamente.\\n\\nAs\u00ed que Santiago Agrelo ter\u00e1 que
  seguir sendo a campa\u00ed\u00f1a diaria que nos invite ao encontro con Deus no
  encontro humano con toda esa xenti\u00f1a sufridora. Grazas! Se Encrucillada tivese
  un premio \u00e1 solidariedade ou ao humanismo crente \u2013e poder\u00edao ter\u2013
  o arcebispo de T\u00e1nxer, o noso querido irm\u00e1n Santiago Agrelo, ser\u00eda
  sen d\u00fabida o primeiro candidato para recibilo. O noso voto teno xa por adiantado.\\n\\nE
  o cuarto feito, por \u00faltimo, ten que ver coa Carta de curas e di\u00e1conos
  catal\u00e1ns, publicada xa o 15 de novembro do pasado\\n\\nano, compartindo con
  quen os queira o\u00edr a preocupaci\u00f3n coa que est\u00e1n vivindo o problema
  existente en Catalu\u00f1a polas raz\u00f3ns que ben co\u00f1ecemos, invit\u00e1ndonos
  a que, como comunidade cristi\u00e1, tam\u00e9n nos concedamos un tempo sereno para
  pensar, discernir, orar en clima de solidariedade con eles, para lles devolver logo
  aquilo que saia da nosa mente e do noso coraz\u00f3n fraterno. Cremos que \u00e9
  cousa digna de ser tida en conta; non implica que te\u00f1amos que chegar a unha
  coincidencia coa maneira que eles parecen ter de ver a s\u00faa situaci\u00f3n;
  pero si que rompamos con posibles prexu\u00edzos, con posici\u00f3ns moi emocionais
  adoptadas de antem\u00e1n, e que discirnamos as cousas como homes e mulleres crentes,
  que conformamos un pa\u00eds chamado Espa\u00f1a con pobos e identidades diferentes,
  a\u00ednda que tam\u00e9n coincidentes en moitas cousas ben importantes. Se f\u00f3semos
  unha Igrexa con personalidade e con s\u00f3lido sentido comunitario, o normal ser\u00eda
  que, a maiores de falar sobre esta cuesti\u00f3n de maneira solta e f\u00e1cil \u2013mesmo
  esbardallando por veces\u2013, lles contest\u00e1semos ofrec\u00e9ndolles o noso
  sentir con sosego, coma irm\u00e1ns e irm\u00e1s que desexan acompa\u00f1ar a quen
  m\u00e1is directamente ten que afrontar a situaci\u00f3n pola que est\u00e1n pasando.
  Pensamos que por sermos unha Igrexa dunha Comunidade Aut\u00f3noma con trazos en
  parte moi similares aos de Catalu\u00f1a, a nosa reflexi\u00f3n, oraci\u00f3n e
  palabra, poder\u00eda ter un significado especial para quen tal cousa nos solicita.\\n\\nE
  pechamos aqu\u00ed esta carta, que, entre luces e sombras, pretende axudar a manter
  o \u00e1nimo esperto, aberto \u00e1 conversi\u00f3n coresmal e disposto a reeditar
  a Pascua entre cantares, levando nas mans os monllos do trigo sementado con suor
  e b\u00e1goas. Compartimos desde aqu\u00ed, con pesar e gozo, a Pascua do franciscano
  Xos\u00e9 Garc\u00eda Oro, natura de Lal\u00edn, 87 anos, ilustre historiador, profesor
  na USC, mestre de historiadores, que nos seus abundantes escritos nos desvelou moito
  da nosa historia galega; morreu o 11 de xaneiro; a s\u00faa vida foi unha bendici\u00f3n.
  Est\u00e1 sendo tam\u00e9n unha bendici\u00f3n a vida e tarefa do noso compa\u00f1eiro
  da Mesa de Redacci\u00f3n nesta revista, Xos\u00e9 Manuel Caama\u00f1o L\u00f3pez,
  que presidir\u00e1\\n\\na hai pouco creada Asociaci\u00f3n Teol\u00f3xica Ib\u00e9rica
  para o Estudo da Moral (ATIEM); parab\u00e9ns a el por este cargo e servizo, e parab\u00e9ns
  tam\u00e9n, e moi firmes, pola asociaci\u00f3n en si, vinculando Espa\u00f1a e Portugal
  en algo com\u00fan, cousa que, no que n\u00f3s sabemos, neste campo est\u00e1 abondo
  nos seus comezos. Polo demais, o tema da pederastia segue no tinteiro, como o expresou
  ardentemente o Papa Francisco no discurso de Nadal aos curiais do Vaticano. En febreiro
  ser\u00e1 a gran cita ao respecto.\\n\\nDiso falaremos. Pero permit\u00eddeme rematar
  con esta copla crente, pequena mostra de teolox\u00eda popular, que hai pouco recoll\u00edn
  xa non sei onde:\\n\\n\u00abTraballa, Pepa, traballa! \u2013Eu traballar xa traballo,
  pero moito non me apuro, que pau que Deus non engorda non che sae de garabullo.\u00bb\\n\\nPero
  o ser de Deus non \u00e9 engordar todos os paus, se os paus para tal cousa se deixan?
  \u2013Pois si. \u2013Pois iso. Ata a pr\u00f3xima.\\n\\nManuel Regal Ledo\"", "\"Informaci\u00f3n
  chegada do SERGAS:\\n\\nEst\u00e1 previsto quema\u00f1\u00e1, 29 de xu\u00f1ose
  publique no Diario Oficial de Galicia a Resoluci\u00f3n da Direcci\u00f3n Xeral
  de Recursos Humanos pola que se d\u00e1 publicidade \u00e1s puntuaci\u00f3ns provisionais
  da fasede concurso da OPE de enfermer\u00eda e m\u00e9dico/a de familia.\\n\\nInf\u00f3rmase
  que est\u00e1 previsto que oxoves, 30 de xu\u00f1ose publique no Diario Oficial
  de Galicia o novo Pacto sobre selecci\u00f3n de persoal estatutario temporal do
  Sistema P\u00fablico de Sa\u00fade de Galicia.\\n\\nNo mes dexullopublicarase aplantilla
  definitiva de respostas e as puntuaci\u00f3ns provisionais da fase de oposici\u00f3n
  do proceso selectivo das categor\u00edas de enfermeiro/a especialista en obstetricia
  e xinecolox\u00eda, fisioterapeuta, logopeda, terapeuta ocupacional, t\u00e9cnico/a
  superior en anatom\u00eda patol\u00f3xica e citolox\u00eda, t\u00e9cnico/a superior
  en hixiene bucodental, t\u00e9cnico/a superior en imaxe para o diagn\u00f3stico,
  t\u00e9cnico/a superior en laboratorio de diagn\u00f3stico cl\u00ednico, t\u00e9cnico/a
  superior en radioterapia, t\u00e9cnico/a en coidados auxiliares de enfermer\u00eda
  e t\u00e9cnico/a en farmacia. Nos pr\u00f3ximos d\u00edas concretarase a data desta\\n\\n1
  / 2\\n\\npublicaci\u00f3n\\n\\n2 / 2\"", "\"Os d\u00edas 26 e 27 de abril de 2001
  vanse celebrar no Paraninfo da Universidade da Coru\u00f1a, as \\\"II Jornadas sobre
  los Aspectos Jur\u00eddicos del Comercio Electr\u00f3nico\\\", acerca de \\\"La
  nueva regulaci\u00f3n Nacional y Europea sobre el Comercio Electr\u00f3nico\\\".
  Este encontro, que conta coa participaci\u00f3n de destacados expertos no tema,
  a nivel nacional, est\u00e1 organizado pola Universidade da Coru\u00f1a, co patrocinio
  da Fundaci\u00f3n R e a colaboraci\u00f3n do Polo Europeo Jean Monnet, do Ilustre
  Colegio Provincial de Abogados da Coru\u00f1a, da C\u00e1mara de Comercio da Coru\u00f1a
  e do Cap\u00edtulo Galego da Internet Society (ISOC-GAL).\\n\\nA actualidade do
  tema fai que estas Xornadas sexan de especial interese para os profesionais de Internet,
  para os empresarios e para o p\u00fablico en xeral. A pesar de ser una tem\u00e1tica
  predominantemente xur\u00eddica, as exposici\u00f3ns faranse de xeito comprensible
  para os non xuristas.\\n\\nM\u00e1is informaci\u00f3n: http://www.pintos-salgado.com/jornadas/triptico.pdf\"",
  "\"dom\u00e9\ufb06ica Compo\ufb06axe\\n\\nA compostaxe dom\u00e9stica \u00e9 a que
  se realiza nunha unidade familiar empregando pequenos composteiros, que se alimentan
  cos residuos org\u00e1nicos xerados na propia vivenda a fin de convertelos en compost,
  un abono natural de alta calidade que se usar\u00e1 posteriormente na horta, xard\u00edn
  familiar e/ou terras de cultivo.\\n\\nQuero compo\ufb06ar\\n\\nPara iniciarte no
  proceso da compo\ufb06axe dom\u00e9\ufb06ica precisas:\\n\\n1. Un composteiro.\\n\\n\u00c9
  un recipiente que facilita a circulaci\u00f3n do aire no seu interior, onde se introducen
  os restos org\u00e1nicos, permitindo unha \u00f3ptima accesibilidade, tanto para
  depositar residuos como para extraer o abono resultante.\\n\\n2. Espazo na t\u00faa
  horta.\\n\\nUnha correcta localizaci\u00f3n do composteiro propiciar\u00e1 que o
  compost que produza sexa de boa calidade, optimizando recursos como as horas de
  luz, a ventilaci\u00f3n e a humidade do solo.\\n\\n3.Residuos de coci\u00f1a e xard\u00edn.\\n\\nOs
  restos de verduras e froitas, restos de poda, herba cortada e c\u00e9spede, as follas
  secas e demais elementos org\u00e1nicos do teu fogar, servir\u00e1n para producir
  un abono natural \u00f3ptimo.\\n\\n4. Un aireador e unha pa.\\n\\nCo aireador conseguiremos
  ventilar o compost sen que perda propiedades e coa pa ordenaremos correctamente
  as capas para a s\u00faa descomposici\u00f3n eficiente.\\n\\n5. Auga.\\n\\nA auga
  \u00e9 imprescindible para humedecer os materiais e conseguir que non sequen. Deste
  xeito, garantiremos a transformaci\u00f3n da materia org\u00e1nica en compost.\\n\\nMateriais
  compo\ufb06ables\\n\\nPodes depositar no compo\ufb06eiro, intentando sempre que
  sexan anacos de pequeno tama\u00f1o:\\n\\n* Restos de comida: froitas e verduras,
  arroz e pasta cocida, pan, as\u00ed como peixe e carne de forma moderada\\n* Cascas
  de ovo e de froitos secos\\n* Pousos de caf\u00e9, t\u00e9 e infusi\u00f3ns\\n*
  Cinzas e serraduras\\n* Papel, cart\u00f3n e xornais\\n* Restos de poda, herba e
  material do xard\u00edn previamente cortados\\n* Restos de colleita sen pesticidas
  ou fitosanitarios\\n* Esterco de animais herb\u00edvoros\\n* Po, plumas, fibras
  e pelos\\n\\nMateriais non compo\ufb06ables\\n\\nPara producir un compo\ufb06 de
  boa calidade debes evitar depositar os seguintes materiais:\\n\\n* Restos de aceite\\n*
  L\u00e1cteos\\n* Restos de plantas con pesticidas, insecticidas ou que estean enfermas\\n*
  Madeira tratada con pinturas, vernices, etc.\\n* Follas de pi\u00f1eiro ou eucalipto\\n*
  Excrementos humanos ou de animais carn\u00edvoros\\n* Medicamentos\\n* Cueiros\\n*
  Papeis impresos ou plastificados\\n* Obxectos duros como pedra, metal, pl\u00e1stico
  ou vidro\\n\\nProceso\\n\\nPara comezar, precisas colocar o composteiro no exterior
  da vivenda, nunha zona de sombra, protexido contra o vento e os cambios de temperatura
  bruscos (por exemplo, baixo unha \u00e1rbore de folla caduca) e en contacto directo
  coa terra, para que os microorganismos, insectos e mi\u00f1ocas accedan ao seu interior.
  \u00c9 recomendable que no fondo do composteiro coloques unha reixa ou rede para
  evitar que accedan a el pequenos animais.\\n\\nO proceso de elaboraci\u00f3n dun
  bo compo\ufb06 dura entre 5 e 6 meses, nos que di\ufb06inguiremos tres fases.\\n\\nFase
  1 - Descomposici\u00f3n\\n\\nFase 2 - Term\u00f3fila\\n\\nNos seguintes d\u00edas,
  debido \u00e1 subida de temperatura, multipl\u00edcanse as bacterias e fungos, co\u00f1ecidos
  coma organismos term\u00f3filos, que degradan rapidamente a materia e aumentan a
  temperatura ata os 70\u00baC. Nesta fase, que pode alongarse ata os dous meses,
  desaparecen as larvas, sementes e elementos pat\u00f3xenos.\\n\\nFase 3 - Maduraci\u00f3n\\n\\nEsta
  fase final dura ata tres meses. Nela prod\u00facese unha fermentaci\u00f3n lenta,
  na que a parte m\u00e1is resistente da materia org\u00e1nica se degrada finalmente,
  baixando a temperatura do compost.\\n\\nPara comezar a elaborar o compost, debemos
  colocar no fondo do composteiro unha capa de restos de poda de pequeno tama\u00f1o
  de entre 10 e 15 cm de altura, para favorecer a aireaci\u00f3n e drenaxe do resto
  de residuos que depositemos a continuaci\u00f3n. Logo colocaremos os restos da coci\u00f1a
  en anacos mi\u00fados para facilitar a s\u00faa descomposici\u00f3n. Sobre estes,
  novamente elementos de poda, e as\u00ed sucesivamente. A proporci\u00f3n de elementos
  h\u00famidos con respecto aos secos ten que ser o dobre, sendo preciso alternar
  capas de cada material para que a mestura sexa uniforme.\\n\\nDurante os primeiros
  d\u00edas, entre 2 e 4, os microorganismos do composteiro aclim\u00e1tanse e multipl\u00edcanse,
  comezando a degradar os residuos. A temperatura da pila aumenta, nesta fase, ata
  os 50\u00baC.\\n\\nPar\u00e1metros\\n\\nPara obter un bo compo\ufb06 debes ter en
  conta uns sinxelos par\u00e1metros:\\n\\nTAMA\u00d1O: o tama\u00f1o dos fragmentos
  a compostar non debe superar os 5 cent\u00edmetros. Canto m\u00e1is grande sexa
  o tama\u00f1o dos residuos depositados, m\u00e1is lenta ser\u00e1 a descomposici\u00f3n.
  Por\u00e9n, se os elementos son demasiado finos, a pila pode compactarse e non permitir
  a s\u00faa correcta osixenaci\u00f3n.\\n\\nAIREACI\u00d3N: para favorecer a entrada
  de aire na pila sen secala \u00e9 preciso mesturar ben os materiais grosos e finos
  e voltear o compost cando se atope moi compacto ou moi h\u00famido.\\n\\nMATERIAIS:
  o compost debe ser rico en humus. O humus \u00e9 a capa da terra con maior volume
  de nutrientes que xorde da descomposici\u00f3n de restos org\u00e1nicos animais
  e vexetais.\\n\\n* Os residuos coma o esterco de aves, o caf\u00e9 ou a herba conte\u00f1en
  moito nitr\u00f3xeno e aceleran este proceso, mais aportan pouco humus.\\n* Os elementos
  coma as p\u00f3las grosas, a serradura, palla, papel ou madeira retardan a descomposici\u00f3n,
  mais aportan abondoso humus.\\n\\nCARBONO \u2013 NITR\u00d3XENO: os restos con mellor
  proporci\u00f3n de carbono e nitr\u00f3xeno son as follas de \u00e1rbores froiteiras,
  arbustos, ortigas e o esterco do gando.\\n\\nHUMIDADE: a mestura ten que estar h\u00famida,
  pero non mollada, xa que levar\u00eda \u00e1 s\u00faa putrefacci\u00f3n. Para evitalo
  \u00e9 preciso xogar cos materiais secos e h\u00famidos que vaiamos introducindo
  no composteiro. Unha forma sinxela de medir a humidade da mestura \u00e9 coller
  unha presa e apertar coa man. Se queda compacta, ten a humidade xusta; se se esfarela,
  est\u00e1 seca e, se pinga, est\u00e1 moi h\u00famida.\\n\\nEn funci\u00f3n dos
  resultados, poderemos secar ou humedecer facilmente, engadindo materiais secos ou
  h\u00famidos, segundo o caso.\\n\\nTEMPERATURA: o compost debe atoparse arredor
  dos 50\u00ba - 60\u00ba C.\\n\\nOS\u00cdXENO: o compost s\u00f3 se lograr\u00e1
  se hai presenza de os\u00edxeno (\u00e9 un proceso aerobio) polo que, en ocasi\u00f3ns,
  ser\u00e1 necesario remexer a mestura para aireala.\\n\\nProblemas m\u00e1is com\u00fans
  e soluci\u00f3ns\\n\\nMaterial moi compacto e con mal cheiro.\\n\\nSignificado:
  posible exceso de humidade e/ou falta de ventilaci\u00f3n. Soluci\u00f3n: mesturar
  material seco (palla, follas secas...) e remexer para permitir a entrada de aire
  e as\u00ed evitar a putrefacci\u00f3n.\\n\\nMaterial fr\u00edo e seco.\\n\\nSignificado:
  falta de auga.\\n\\nSoluci\u00f3n: regar.\\n\\nCheiro a amon\u00edaco.\\n\\nSignificado:
  demasiados materiais ricos en nitr\u00f3xeno.\\n\\nSoluci\u00f3n: engadir compo\u00f1entes
  secos ricos en carbono coma\\n\\nserraduras ou restos de poda e remexer.\\n\\nBaixa
  temperatura.\\n\\nSignificado: pouco material ou falta de humidade.\\n\\nSoluci\u00f3n:
  engadir m\u00e1is material ou regar.\\n\\nTemperatura moi alta.\\n\\nSignificado:
  insuficiente ventilaci\u00f3n.\\n\\nSoluci\u00f3n: remexer.\\n\\nMaterial fr\u00edo
  e h\u00famido.\\n\\nSignificado: exceso de auga.\\n\\nSoluci\u00f3n: remexer e engadir
  materiais secos (serraduras, p\u00f3las...).\\n\\nPresenza de moscas.\\n\\nSoluci\u00f3n:
  engadir material estruturante\\n\\n(pequenas p\u00f3las, palla...) e remexer.\\n\\nSignificado:
  exceso de humidade.\\n\\nPresenza de roedores.\\n\\nSignificado: atra\u00eddos por
  alg\u00fan residuo.\\n\\nSoluci\u00f3n: mesturar os materiais e tapar.\\n\\nPresenza
  dunha capa branca de fungos.\\n\\nSoluci\u00f3n: non supo\u00f1en problema ning\u00fan.\\n\\nPresenza
  de insectos.\\n\\nSignificado: condici\u00f3ns ambientais.\\n\\nSoluci\u00f3n: non
  presentan inconveniente. Son descompo\u00f1edores.\"", "\"Xo\u00e1n Carlos Lagares
  / Marcos Bagno (orgs.), Pol\u00edticas da norma e conflitos lingu\u00edsticos, S\u00e3o
  Paulo, Par\u00e1bola Editorial, 2011, 391 p\u00e1xinas.\\n\\nBrasil, tan lonxe e
  tan perto. Lonxe da Galiza xeograficamente, mais tan perto dela do punto de vista
  ling\u00fc\u00edstico. E, por\u00e9n, os libros que se publican nos dous pa\u00edses,
  mesmo os que tratan de temas estritamente ling\u00fc\u00edsticos, te\u00f1en escasa
  ou nula circulaci\u00f3n nun e noutro lado respectivamente, o cal se converte nun
  sintoma de indiferenza ou ignorancia mutua, de que constit\u00faen a excepci\u00f3n
  os catro volumes de Estudos Galego-Brasileiros elaborados colaborativamente por
  profesorado da Universidade Estadual de Rio de Janeiro e da Universidade da Coru\u00f1a,
  o \u00faltimo dos cales leva significativamente por subt\u00edtulo Lingua, Literatura,
  Identidade (Maleval & Tato Fonta\u00ed\u00f1a 2010). Nin no Brasil existe xeral
  consciencia de a s\u00faa lingua oficial ter as orixes nun pequeno pa\u00eds do
  extremo occidental da Europa chamado a Galiza, nin nesta se valoriza e rendibiliza
  tal identidade ling\u00fc\u00edstica com\u00fan na procura de prestixio e proxecci\u00f3n
  de futuro para a lingua propia. No entanto, algo parece estar mudando nesta Galiza
  de 2013 en que o Parlamento galego admite a tr\u00e1mite por primeira vez e por
  unanimidade unha Iniciativa Lexislativa Popular en prol da abertura do galego ao
  \u00e1mbito de expresi\u00f3n en lingua portuguesa que leva o nome de Valent\u00edn
  Paz Andrade, defensor da reintegraci\u00f3n ling\u00fc\u00edstica coas variantes
  do primitivo sistema formado na Gallaecia.\\n\\nNeste contexto, adquire especial
  actualidade e oportunidade un libro publicado no Brasil en 2011 sobre as pol\u00edticas
  da norma e os conflitos delas derivados, que est\u00e1 coorganizado por un profesor
  galego que exerce a docencia universitaria na Universidade Federal Fluminense (UFF)
  de Niter\u00f3i, Xo\u00e1n Carlos Lagares. Entre as quince colaboraci\u00f3ns que
  re\u00fane, d\u00faas son de autores galegos que fan referencia directa \u00e1 lingua
  galega, sendo tam\u00e9n desde a \u00f3ptica galega que se realiza a presentaci\u00f3n
  do volume e a inclu\u00edr o traballo que encerra o libro, da autor\u00eda de Marcos
  Bagno, o outro coorganizador do volume, referencias directas \u00e1 Galiza e a s\u00faa
  lingua. \u00c9\u00a0precisamente en situaci\u00f3ns de conflito ling\u00fc\u00edstico
  como as que se dan aqu\u00ed cando a cuesti\u00f3n normativa provoca exaltadas disputas
  p\u00fablicas, embora entre n\u00f3s tivesen o seu punto m\u00e1is \u00e1lxido nos
  anos oitenta e hoxe estean un tanto amortecidas polas mudanzas de 2003. De todas
  as formas, o conflito da norma do galego permaneceu en foco, polo menos, durante
  as tres \u00faltimas d\u00e9cadas e a\u00ednda hoxe est\u00e1 vigorante, de modo
  que unhas reflexi\u00f3ns sobre o tema que nos chegan desde o outro lado do Atl\u00e1ntico,
  coa distancia por veces tan necesaria e tam\u00e9n coa perspectiva doutras situaci\u00f3ns
  semellantes en diferentes pa\u00edses e continentes, se tornan especialmente oportunas
  neste momento en que na Galiza necesitamos reorientar e redimensionar o debate normativo.
  Ao mesmo tempo,\\n\\n\u00e9 digno de se salientar que no mesmo ano en que se publica
  no Brasil este libro, na Galiza sae do prelo outro extenso e ben documentado volume
  de car\u00e1cter te\u00f3rico sobre a variaci\u00f3n dialectal do galego, da autor\u00eda
  do profesor S\u00e1nchez Rei (2011). Ambos merecer\u00edan unha maior divulgaci\u00f3n
  e co\u00f1ecemento al\u00e9n e aqu\u00e9n mar, pois se sempre se torna positiva
  a comunicaci\u00f3n entre as sociedades cient\u00edficas, m\u00e1is o \u00e9 cando
  se trata de comunidades que partillan un mesmo sistema ling\u00fc\u00edstico; unha
  mostra da importancia que desde a Galiza algunhas persoas vimos concedendo \u00e1s
  publicaci\u00f3ns ling\u00fc\u00edstico-filol\u00f3xicas brasileiras d\u00e1nola
  a primeira estil\u00edstica sobre a lingua galega, recentemente publicada (Freixeiro
  2013).\\n\\nNon \u00e9 por azar que a x\u00e9nese deste libro se producise nunhas
  palestras sobre normativizaci\u00f3n ling\u00fc\u00edstica que ao longo de 2008
  organizaron o profesor Lagares e o N\u00facleo de Estudos Galegos \u2013que funciona
  desde 1994 na UFF por convenio coa Xunta da Galiza\u2013 no Instituto de Letras
  desta universidade. Nese foro intervi\u00f1eron diversos membros da comunidade acad\u00e9mica
  brasileira que se debruzaron sobre aspectos relativos \u00e1 estandarizaci\u00f3n
  en diversas linguas, co consecuente debate e reflexi\u00f3n sobre os procesos de
  elaboraci\u00f3n do padr\u00f3n ling\u00fc\u00edstico por que pasaron nalg\u00fan
  momento todas as linguas, embora sexan especialmente agudos en contextos digl\u00f3sicos,
  como \u00e9 o caso do galego. \u00c1s persoas que participaron neste ciclo un\u00edronse
  outros pesquisadores e pesquisadoras que contribu\u00edron para unha visi\u00f3n
  m\u00e1is abranxente do tema desde diferentes posici\u00f3ns te\u00f3ricas. Deste
  modo, nos quince cap\u00edtulos da obra anal\u00edzanse situaci\u00f3ns diversas
  onde se te\u00f1en xerado conflitos, tanto no interior dos estados como nas relaci\u00f3ns
  internacionais, no proceso de construci\u00f3n das normas ling\u00fc\u00edsticas.
  O caso galego \u00e9 un dos sometidos a an\u00e1lise, como se dixo, mais todos os
  demais son tam\u00e9n de grande interese para o comprendermos mellor.\\n\\nEn xeral,
  o libro formula no seu conxunto a necesidade de mudarmos a perspectiva a respecto
  da abordaxe da cuesti\u00f3n da norma, nin sempre explic\u00e1bel do punto de vista
  estritamente ling\u00fc\u00edstico e si m\u00e1is propiamente como unha cuesti\u00f3n
  social e pol\u00edtica, aspecto en que coinciden moitos dos autores e autoras participantes,
  inclusive desde posici\u00f3ns te\u00f3ricas diferentes. Basicamente, as linguas
  sonnos presentadas neste volume como instituci\u00f3ns sociais sometidas a debates
  e pol\u00e9micas pol\u00edticas, unhas veces como instrumentos de control social
  e outras de revolta, mais sempre a faceren parte dunha realidade que as enforma.
  O conflito normativo existente na Galiza v\u00e9n a demostrar con clareza ese car\u00e1cter
  social e pol\u00edtico do proceso de elaboraci\u00f3n normativa, como tam\u00e9n
  aconteceu e acontece no Brasil, e noutros estados da Europa como Franza, Alema\u00f1a
  ou Italia, ao se escoller a variante ling\u00fc\u00edstica de certas elites como
  modelo de norma culta. Ora ben, tam\u00e9n existen moitas diferenzas entre os procesos
  de construci\u00f3n da norma nunha situaci\u00f3n de minorizaci\u00f3n ling\u00fc\u00edstica,
  como \u00e9 o caso do galego, e nos casos das grandes linguas dos estados. En canto
  nestas a norma discrimina as variantes faladas polas clases socialmente m\u00e1is
  desfa-\\n\\nData de recepci\u00f3n: 02/07/2013 | Data de aceptaci\u00f3n: 29/07/2013\\n\\nvorecidas
  e desprotexidas, como m\u00e1is unha forma de exclusi\u00f3n social das persoas
  que as utilizan (v\u00e9xase, por exemplo, para o caso brasileiro Bagno 2001 e 2005),
  nunha situaci\u00f3n de conflito digl\u00f3sico como o que se vive na Galiza na
  realidade a que act\u00faa socialmente como norma culta \u00e9 a lingua A ou lingua
  dominante, neste caso o espa\u00f1ol, funcionando a lingua galega no seu conxunto,
  inclu\u00edda a modalidade est\u00e1ndar, como unha variante vulgar, sen prestixio
  social, co problema acrecentado de a norma en proceso de construci\u00f3n ter de
  rexeitar moitos trazos da fala popular que son produto da interferencia do castel\u00e1n
  como \u00fanico remedio para evitar a desaparici\u00f3n do galego por disoluci\u00f3n
  na lingua estatal, como m\u00e1is unha variante desta. Tal diferenza \u00e9 a que
  non fica suficientemente referenciada nin esclarecida no libro que estamos a comentar.\\n\\nAp\u00f3s
  estas consideraci\u00f3ns iniciais, repasarase a seguir o contido das diferentes
  partes de que consta o volume, comezando por indicar que o corpo central est\u00e1
  constitu\u00eddo por dez cap\u00edtulos \u2013do cinco ao catorce\u2013 que analizan
  aspectos relativos a linguas concretas, en canto os catro primeiros tratan cuesti\u00f3ns
  te\u00f3ricas xerais e o \u00faltimo constit\u00fae unha especie de avaliaci\u00f3n
  resumatoria dos principais problemas postos en evidencia ao longo da obra. O primeiro
  cap\u00edtulo intit\u00falase \\\"Varia\u00e7\u00e3o e norma lingu\u00edstica: subs\u00eddios
  para uma (re)vis\u00e3o\\\" e ten por autor o galego Henrique Monteagudo; nel, ap\u00f3s
  repasar a bibliograf\u00eda relativa aos conceptos de norma e variaci\u00f3n dun
  punto de vista cr\u00edtico, diferencia entre a representaci\u00f3n unitaria das
  linguas a partir dos padr\u00f3ns e a heteroxeneidade do uso, a se inclinar definitivamente
  pola defensa dun prescritivismo \\\"funcional e ilustrado\\\" que se caracterizar\u00eda
  polo relativismo, a gradaci\u00f3n e a elasticidade, isto \u00e9, \\\"um prescritivismo
  atento ao uso comum, e preocupado com que os padr\u00f5es lingu\u00edsticos n\u00e3o
  se afastem desnecessariamente dele\\\" (p. 46).\\n\\nO segundo cap\u00edtulo, publicado
  orixinariamente en ingl\u00e9s no Journal of Sociolinguistics e traducido para portugu\u00e9s
  por Marcos Bagno, \u00e9 da autor\u00eda de James Milroy e leva por t\u00edtulo
  \\\"Ideologias lingu\u00edsticas e as consequ\u00eancias da padroniza\u00e7\u00e3o\\\",
  a constitu\u00edr unha reflexi\u00f3n a respecto da ideolox\u00eda subxacente na
  norma padr\u00f3n como elemento modelar e forma lex\u00edtima que priva de tal condici\u00f3n
  as outras variedades (\\\"outras formas se tornam, na mente do povo, ileg\u00edtimas\\\",
  p. 76); no estebelecemento de tal lexitimidade desempe\u00f1an un papel primordial
  os historiadores da lingua, segundo o autor, ao converteren a variedade padr\u00f3n
  en parceira da gloria atinxida por un estado-naci\u00f3n ou mesmo por un grande
  imperio. O cap\u00edtulo que segue este, da autor\u00eda de Thomas Daniel Finbow,
  volta a ollada para a antig\u00fcidade e a Alta Idade Media, como xa suxire o t\u00edtulo
  \u2013\\\"A forma\u00e7\u00e3o dos conceitos de ''latim'' e de ''romance''\\\"\u2013
  e, con base nas teor\u00edas de Roger Wright, pon en relevo os desenfoques das an\u00e1lises
  aplicadas aos procesos resultantes do feito de o lat\u00edn e as linguas neolatinas
  seren consideradas linguas diferentes, explorando a noci\u00f3n b\u00e1sica de elaboraci\u00f3n\\n\\nling\u00fc\u00edstica
  e o papel dos elementos gr\u00e1ficos na diferenciaci\u00f3n das linguas; ali\u00e1s,
  cuesti\u00f3n moito relevante para a an\u00e1lise da sempre pol\u00e9mica relaci\u00f3n
  entre galego e portugu\u00e9s. D\u00e1se fin aos cap\u00edtulos introdutorios, de
  car\u00e1cter te\u00f3rico, con \\\"A norma ling\u00fc\u00edstica do ponto de vista
  da pol\u00edtica ling\u00fc\u00edstica\\\", da autor\u00eda de Kanavillil Rajagopalan,
  que enfronta xa de forma m\u00e1is directa o aspecto sociopol\u00edtico da norma
  por riba mesmo das consideraci\u00f3ns puramente ling\u00fc\u00edsticas, idea que
  impregna, dunha ou doutra forma, o resto dos traballos do volume.\\n\\nSon dez os
  cap\u00edtulos centrais da obra que analizan procesos concretos de elaboraci\u00f3n
  ling\u00fc\u00edstica. Dous deles po\u00f1en o foco de atenci\u00f3n no franc\u00e9s,
  o da autor\u00eda de Pierre Guisan (\\\"A cria\u00e7\u00e3o de uma norma-padr\u00e3o
  em franc\u00eas: entre planejamento pol\u00edtico e mito\\\"), centrado nas circunstancias
  hist\u00f3ricas que propiciaron a conversi\u00f3n da variante escollida como \\\"coin\u00e9
  escrita\\\" pola corte parisina en \\\"bon fran\u00e7ais\\\" primeiro e definitivamente
  en \\\"franc\u00eas padr\u00e3o\\\" (p. 141); e o de Eur\u00eddice Figueiredo (\\\"O\u00a0estatuto
  do franc\u00eas no Quebec\\\"), coa ollada posta na situci\u00f3n singular desta
  lingua no Canad\u00e1, a funcionar simultaneamente como factor identitario e como
  elemento de relaci\u00f3n co mundo franc\u00f3fono. Outros dous traballos estudan
  o caso do espa\u00f1ol: por un lado, Consuelo Alfaro Lagorio trata en \\\"Norma
  e biling\u00fcismo no espanhol americano: o caso andino\\\" sobre o contacto ling\u00fc\u00edstico
  entre o quichua e o castel\u00e1n, coa situaci\u00f3n de biling\u00fcismo del derivada,
  e do proceso de institucionalizaci\u00f3n da lingua dos colonizadores; por outro
  lado, Adri\u00e1n Pablo Fanjul analiza en \\\"''Polic\u00eantrico'' e ''pan-hisp\u00e2nico'':
  deslocamentos na vida pol\u00edtica da l\u00edngua espanhola\\\" a nova pol\u00edtica
  internacional seguida polo espa\u00f1ol que, da man da Real Academia Espa\u00f1ola
  e de intereses econ\u00f3micos de empresas espa\u00f1olas transnacionalizadas, muda
  a s\u00faa defensa do tradicional policentrismo por unha especie de unicentrismo
  de car\u00e1cter panhisp\u00e1nico, como xa se puxo en relevo nalg\u00fans traballos
  inclu\u00eddos en Valle (2007) que dedican especial atenci\u00f3n \u00e1 penetraci\u00f3n
  do espa\u00f1ol no Brasil, igual que acontece no artigo de Fanjul. Precisamente
  sobre o portugu\u00e9s do Brasil tratan tam\u00e9n outros dous cap\u00edtulos deste
  libro que estamos a recensionar: o que se intitula \\\"A reda\u00e7\u00e3o do c\u00f3digo
  civil: uma pol\u00eamica lingu\u00edstica, jur\u00eddica ou pol\u00edtica?\\\",
  de Bethania Mariani, pon ao descuberto a tenue fronteira existente entre ling\u00fc\u00edstica
  e pol\u00edtica \u2013e entre gram\u00e1tica e lei\u2013 a partir das pol\u00e9micas
  xeradas nos finais do s\u00e9culo XIX, nomeadamente entre Rui Barbosa e Ernesto
  Carneiro, con motivo da elaboraci\u00f3n da primeira versi\u00f3n do C\u00f3digo
  Civil brasileiro; o traballo que leva por t\u00edtulo \\\"O Brasil entre a norma
  culta e a norma curta\\\", de Carlos Alberto Faraco, reflexiona sobre o papel pol\u00edtico
  que ten desempe\u00f1ado a ling\u00fc\u00edstica na construci\u00f3n do imaxinario
  social sobre a norma no Brasil, onde a norma culta se transforma en norma curta,
  \\\"um discurso categ\u00f3rico, uma cont\u00ednua desqualifica\u00e7\u00e3o do
  falante brasileiro\\\", que tivo \\\"seu momento de gl\u00f3ria com as diatribes
  de Rui Barbosa contra o texto do projeto do nosso primeiro C\u00f3digo Civil\\\"
  (p. 274).\\n\\nData de recepci\u00f3n: 02/07/2013 | Data de aceptaci\u00f3n: 29/07/2013\\n\\nHai
  neste volume outras catro linguas \u2013galego, italiano, alem\u00e1n e ingl\u00e9s\u2013
  que son obxecto de an\u00e1lise do punto de vista da estandarizaci\u00f3n, con un
  \u00fanico traballo para cada unha. Deixando de momento o galego \u00e1 parte, Patr\u00edcia
  Alexandra Gon\u00e7alves \u00e9 a autora de \\\"De Babel a Pandora: crise, cultura
  e identidade no multilinguismo italiano\\\", que trata sobre un dos procesos m\u00e1is
  curiosos de construci\u00f3n dunha norma ling\u00fc\u00edstica, pois tendo aparecido
  xa na \u00e9poca medieval a \\\"questione della lingua\\\", o italiano vai ser un
  dos \u00faltimos idiomas europeos en se conformar como lingua nacional. O traballo
  intitulado \\\"O desenvolvimento da l\u00edngua alem\u00e3\\\" \u00e9 da autor\u00eda
  de M\u00f4nica Maria Guimar\u00e3es Saavedra e ten por obxecto o proceso de padronizaci\u00f3n
  \u2013tam\u00e9n modelar en moitos sentidos\u2013 do alem\u00e1n, tanto no \u00e1mbito
  da s\u00faa pol\u00edtica interna (Sprachpolitik) canto na pol\u00edtica de relaci\u00f3n
  coas demas linguas (Sprachenpolitik), con especial atenci\u00f3n ao contexto brasileiro.
  Non pod\u00eda faltar nun volume deste tipo a cuesti\u00f3n da norma do ingl\u00e9s
  como lingua internacional, que \u00e9 tratada por S\u00e1vio Siqueira en \\\"World
  Englishes, World English. Ingl\u00eas como l\u00edngua internacional, ingl\u00eas
  como l\u00edngua franca\\\", onde tam\u00e9n se presta atenci\u00f3n ao caso brasileiro
  e se concl\u00fae que son \\\"muitos os ingleses\\\" e que o ingl\u00e9s \u00e9
  \\\"[l]\u00edngua de todos, l\u00edngua de ningu\u00e9m\\\" (p. 351).\\n\\nO cap\u00edtulo
  sobre o galego merece un tratamento singular porque nos afecta m\u00e1is directamente.
  O seu autor \u00e9 un dos dous organizadores do libro e respons\u00e1bel pola \\\"Apresenta\u00e7\u00e3o\\\"
  que o encabeza, o profesor Xo\u00e1n Carlos Lagares. Leva por t\u00edtulo \\\"Minorias
  lingu\u00edsticas, normas e mercados. Uma reflex\u00e3o a partir do galego\\\" (pp.
  169-192) e no esencial constit\u00fae unha oportuna e l\u00facida reflexi\u00f3n
  a respecto da problem\u00e1tica delimitaci\u00f3n dun espazo ling\u00fc\u00edstico
  propio para o galego, atrapado \u2013case que fatalmente\u2013 entre o portugu\u00e9s
  e o espa\u00f1ol. Segundo o autor, que xa ten reflectido sobre este tema noutros
  foros, se o espa\u00f1ol \u00e9 unha lingua supercentral sobre a cal gravita o galego,
  por s\u00faa parte o portugu\u00e9s poder\u00eda constitu\u00edr unha forza centr\u00edfuga
  con capacidade para o tirar f\u00f3ra da constelaci\u00f3n espa\u00f1ola, feito
  que v\u00e9n a explicar a constante presenza da lingua portuguesa nos debates e
  proxectos normativizadores desenvolvidos na Galiza nos \u00faltimos s\u00e9culos.
  Considera Lagares que a reivindicaci\u00f3n pol\u00edtica do galego, lex\u00edtima
  e necesaria, debe ir acompa\u00f1ada dunha maior abertura cultural ao mundo de expresi\u00f3n
  en portugu\u00e9s, \\\"numa estrat\u00e9gia que fomente a comunica\u00e7\u00e3o
  para al\u00e9m das fronteiras pol\u00edticas e que ofere\u00e7a aos falantes a inser\u00e7\u00e3o
  num contexto pluril\u00edngue mais amplo, a partir de sua pr\u00f3pria variedade
  lingu\u00edstica\\\" (p. 189). Prop\u00f3n a exploraci\u00f3n de alternativas creativas
  que rompan o bloqueo das linguas de Estado que aprisionan o galego, para o cal a
  relaci\u00f3n directa co portugu\u00e9s pode ser moito \u00fatil, sen que supo\u00f1a
  ning\u00fan perigo para el, antes ben unha oportunidade. Impl\u00edcase o autor
  en primeira persoa e di que este \\\"pode ser o nosso atual desafio\\\". Nisto concordamos
  moitas persoas, mais o problema \u00e9 encontrarmos os cami\u00f1os e as estratexias,
  pois el mesmo advertiu previamente de que os\\n\\nRevista Galega de Filolox\u00eda,
  ISSN 1576-2661, 2013, 14: 229-235\\n\\nData de recepci\u00f3n: 02/07/2013 | Data
  de aceptaci\u00f3n: 29/07/2013\\n\\nide\u00f3logos da expansi\u00f3n do espa\u00f1ol
  como lingua internacional \u2013e con eles os poderes pol\u00edtico-econ\u00f3micos
  que gobernan o Estado, acrecento eu\u2013 queren todo o mercado ling\u00fc\u00edstico
  para si, sen se mostraren dispostos a partill\u00e1reno con outras linguas nacionais
  que eles senten como unha ameaza para o seu proxecto pol\u00edtico e econ\u00f3mico.
  Neste sentido, dificilmente van permitir que o galego dea pasos significativos para
  unha m\u00e1is profunda relaci\u00f3n co mundo de expresi\u00f3n portuguesa, a pesar
  da aprobaci\u00f3n desa iniciativa lexislativa citada ao inicio destas letras. A
  non ser, claro est\u00e1, que mude substancialmente a correlaci\u00f3n de forzas
  pol\u00edticas na Galiza, feito pouco prob\u00e1bel no curto e medio prazo cando
  menos.\\n\\nPor \u00faltimo, o volume fecha cun traballo resumatorio, ou ep\u00edlogo,
  de Marcos Bagno, coorganizador do volume e figura de prestixio consolidado no campo
  da (socio) ling\u00fc\u00edstica brasileira, con importantes contributos bibliogr\u00e1ficos
  que van tendo cada vez m\u00e1is eco tam\u00e9n entre n\u00f3s. O t\u00edtulo, como
  costuma ser habitual no autor, \u00e9 ilustrativo e revelador: \\\"O que \u00e9
  uma l\u00edngua? Imagin\u00e1rio, ci\u00eancia & hip\u00f3stase\\\". Nel vai repasando
  e sometendo a xu\u00edzo cr\u00edtico os principais problemas levantados ao longo
  e largo dos diferentes cap\u00edtulos do volume, baixo o prisma unificador do concepto
  de lingua padr\u00f3n como hip\u00f3stase: \\\"Essa l\u00edngua constru\u00edda,
  l\u00edngua-sujeito, l\u00edngua com alma, desejo e poder de decis\u00e3o, seria
  aquilo que na filosofia se chama de hip\u00f3stase\\\" (p. 358). Deixa ben en claro
  o autor que a concretizaci\u00f3n material dun modelo ling\u00fc\u00edstico normativo
  que ten apenas existencia mental se torna un instrumento de poder con importantes
  consecuencias pol\u00edtico-sociais e culturais.\\n\\nEis un brillante final para
  unha obra plural e poli\u00e9drica sobre pol\u00edticas normativas e conflitos ling\u00fc\u00edsticos
  que tanto interese presenta para a lingua galega e o seu sempre pol\u00e9mico proceso
  de estandarizaci\u00f3n. Por iso \u00e9 merecente de divulgaci\u00f3n e xeral co\u00f1ecemento
  na Galiza.\\n\\nXos\u00e9 Ram\u00f3n Freixeiro Mato\\n\\nReferencias bibliogr\u00e1ficas\\n\\nBagno,
  Marcos (2001): Dram\u00e1tica da l\u00edngua portuguesa. Tradi\u00e7\u00e3o gramatical,
  m\u00eddia & exclus\u00e3o social (S\u00e3o Paulo: Edi\u00e7\u00f5es Loyola).\\n\\nBagno,
  Marcos (2005): A norma oculta. L\u00edngua & poder na sociedade brasileira (S\u00e3o
  Paulo: Par\u00e1bola).\\n\\nFreixeiro Mato, Xos\u00e9 Ram\u00f3n (2013): Estil\u00edstica
  da lingua galega (Vigo: Xerais).\\n\\nRevista Galega de Filolox\u00eda, ISSN 1576-2661,
  2013, 14: 229-235\\n\\nData de recepci\u00f3n: 02/07/2013 | Data de aceptaci\u00f3n:
  29/07/2013\\n\\nMaleval, M\u00aa Amparo Tavares & Tato Fonta\u00ed\u00f1a, Laura
