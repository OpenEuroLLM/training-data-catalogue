  e devezas\\n\\nRosendo Sazido. Mordomo\\n\\nRelaci\u00f3n que como mordomo da fregues\u00eda
  dou dos emolumentos, cargas e devezas que a S.M. ten. \u00c9 a seguinte:\\n\\nEmolumentos:
  Ten esta fregues\u00eda un monte chamado Tremuzo. Cabida, mil cincocentos ferrados,
  in\u00fatil. Levante, fregues\u00eda de San Cosme de Outeiro; po\u00f1ente, fregues\u00eda
  de Santa Mari\u00f1a de Esteiro; norte, San Pedro de Outes; mediod\u00eda, mar.\\n\\nPensi\u00f3s:
  Contrib\u00fae esta fregues\u00eda \u00e1 S\u00faa Maxestade, por raz\u00f3n de
  servizo ordinario com trescentos cincuenta reais \u201cde vell\u00f3n\u201d, e polos
