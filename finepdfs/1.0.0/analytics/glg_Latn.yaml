  Ten esta fregues\u00eda un monte chamado Pedregal. In\u00fatil. Cabida, tres mil
  ferrados. Levante, fregues\u00eda de San Xo\u00e1n de Sabardes; po\u00f1ente, a
  de Santiago de Tal; norte, a de San Pedro de Outes; e mediod\u00eda, mar.\\n\\nPensi\u00f3ns:
