  do teclado.\\n- Traballo comprensivo a trav\u00e9s da execuci\u00f3n de estruturas
  musicais m\u00e1is complexas.\\n\\n4. DESENVOLVEMENTO DA CREATIVIDADE\\n\\n1\u00ba
  G.E.\\n\\nObxectivos\\n\\n- Achegarse \u00f3 piano dun xeito experimental, l\u00fadico
  e desinhibido.\\n- Aprender a sentir o piano como un medio a trav\u00e9s do cal
  expresarse, desenvolvendo a propia fantas\u00eda (imaxinaci\u00f3n creativa)\\n-
  Despertar a curiosidade e o gusto pola innovaci\u00f3n.\\n- Comezar a reco\u00f1ecer
  as graf\u00edas non tradicionais e a s\u00faa aplicaci\u00f3n pr\u00e1ctica no piano,
  como b\u00fasqueda de novos efectos sonoros.\\n- Exploraci\u00f3n e exteriorizaci\u00f3n
  da propia personalidade creadora mediante a improvisaci\u00f3n (no sentido m\u00e1is
  amplo posible: mel\u00f3dica, arm\u00f3nica, r\u00edtmica,t\u00edmbrica , libre,...
  )\\n- Comezar a improvisar pequenos textos mel\u00f3dicos.\\n- Comprender os sustentos
  necesarios dende os que realizar unha improvisaci\u00f3n arm\u00f3nica.\\n\\nContidos\\n\\n-
  Creaci\u00f3n de ostinatos e c\u00e9lulas r\u00edtmicas.\\n- Improvisaci\u00f3n
  mel\u00f3dica:  motivos musicais, semifrases e frases de ata 8 compases en posici\u00f3n
  fixa, empregando teclas negras ou escalas de ata unha alteraci\u00f3n segundo os
  seguintes par\u00e1metros orientativos:\\n- Figuras b\u00e1sicas redonda, branca,
  negra e corchea e os seus respectivos silencios.\\n- Utilizaci\u00f3n dos compases
  de subdivisi\u00f3n binaria mais frecuentes: 2/4, 3/4 e 4/4.\\n- Inclusi\u00f3n
  das indicaci\u00f3ns din\u00e1micas: F e P\\n- Pr\u00e1ctica de diferentes articulaci\u00f3ns:
  legato e non legato.\\n- Improvisaci\u00f3ns arm\u00f3nicas: acompa\u00f1amento
  de melod\u00edas dadas ou improvisadas polos alumnos , empregando os acordes de
  I e V.\\n- Experimentaci\u00f3n con algunhas das graf\u00edas non tradicion\u00e1is:
  clusters, tonlos, notaci\u00f3n espacial.\\n- B\u00fasqueda das posibilidades t\u00edmbricas
  do instrumento, tanto dentro como fora do teclado: accionamiento directo dentro
  do arpa, golpes na madeira, preparaci\u00f3n do arpa con diversos materiais...\\n-
  Creaci\u00f3n da imaxe est\u00e9tica da m\u00fasica. Asociaci\u00f3n da m\u00fasica
  que se toca ou se escoita coas propias emoci\u00f3ns e pensamentos a trav\u00e9s
  de exercicios como:\\n- Invencion de letras de pequenas obras para piano.\\n\\n-
  Caminar, bailar, debuxar a m\u00fasica .\\n- Improvisaci\u00f3n medio-libre de elementos
  dados  nas que s\u00f3 se poden empregar ditos elementos pero tratados dentro dunha
  gran liberdade (amplitude de rexistro, matices, articulaci\u00f3ns,...).\\n- Libre
  improvisaci\u00f3n con un car\u00e1cter prefixado ou suxerido por un relato,  a
  visi\u00f3n dun debuxo ou pintura.\\n- Interpretaci\u00f3n de diversos caracteres
  prefixados sobre un material proposto.\\n- Creaci\u00f3n de contos musicais  sinxelos
  nos que se asociar\u00e1 todo movemento no piano a unha idea, personaxe, sensaci\u00f3n.\\n\\nMaterial
  orientativo:\\n\\n- \\\"Piano colectivo G.E. 1\u00ba curso\\\" de Emilio Molina\\n-
  \\\"Clase colectiva de piano vol. 1\\\" de Eva Mal\u00eda\\n\\n2\u00ba G.E.\\n\\nObxectivos\\n\\n-
  Achegarse \u00f3 piano dun xeito experimental, l\u00fadico e desinhibido.\\n- Sentir
  o piano como un medio a trav\u00e9s do cal expresarse, desenvolvendo a propia fantas\u00eda
  (imaxinaci\u00f3n creativa)\\n- Despertar a curiosidade e o gusto pola innovaci\u00f3n.\\n-
  Experimentar coas graf\u00edas non tradicion\u00e1is e a s\u00faa aplicaci\u00f3n
  pr\u00e1ctica no piano, como b\u00fasqueda de novos efectos sonoros.\\n- Exploraci\u00f3n  e  exteriorizaci\u00f3n  da  propia  personalidade  creadora  mediante  a
  improvisaci\u00f3n  (no  sentido  m\u00e1is  amplo  posible:  mel\u00f3dica,  arm\u00f3nica,
  r\u00edtmica,t\u00edmbrica , libre,... )\\n- Improvisar pequenos textos musicais
