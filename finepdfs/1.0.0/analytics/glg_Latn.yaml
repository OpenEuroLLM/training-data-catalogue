  e adecuaci\u00f3n \u00e1s esixencias t\u00e9cnicas do repertorio executado e axeitado
  para iniciar estudos superiores.\\n\\n115\\n\\n-Demostrar unha sensibilidade auditiva
  refinada no uso das posibilidades sonoras do piano no relativo a tipos de ataques,
  utilizaci\u00f3n dos pedais e control din\u00e1mico, fraseo,  con especial \u00e9nfase
  na calidade do son.\\n-Interpretar o repertorio con fluidez, seguridade e autocontrol
  en relaci\u00f3n co uso da memoria.\\n-Resolver con autonom\u00eda e alto grao de
  virtuosismo os problemas t\u00e9cnicos que se presenten nas obras: independencia
  dos dedos, notas dobres, t\u00e9cnicas de mu\u00f1eca, brazo e antebrazo, xogo polif\u00f3nico,
  t\u00e9cnicas do paso do pulgar, etc\\n-Demostrar criterios interpretativos persoais
  e orixinais, cun alto grao de madurez art\u00edstica, en coherencia cos diferentes
  estilos interpretados, e con fidelidade ao texto e \u00e1s convenci\u00f3ns interpretativas
  da \u00e9poca.\\n-Demostrar un notable grao de madurez para interpretar un repertorio
  pian\u00edstico como solista.\\n-Demostrar a capacidade real de realizar estudos
  de grao superior, e o talento para unha posible carreira musical como pianista profesional.\\n\\n116\"",
  "\"1492: O encubrimiento do Outro\\n\\n1492\\nO encubrimento do Outro\\n\\nA celebraci\u00f3n
  do Quinto Centenario do Descubrimento de Am\u00e9rica trouxo consigo todo o barullo
  co que se contaba. Xa se sabe que as opini\u00f3ns sobre a valoraci\u00f3n da obra
  espa\u00f1ola e tam\u00e9n europea en Am\u00e9rica son moi encontradas. Tam\u00e9n
  sabemos que a escola nos educou a unha visi\u00f3n moi triunfalista do acontecemento.\\n\\nSe
  a iso lle engadimos que nosoutros, cristi\u00e1ns, somos estimulados a que apreciemos
  \u2013como un motivo que xustificar\u00eda desm\u00e1ns e abusos\u2013 o feito da
  evanxelizaci\u00f3n cristi\u00e1 dese inmenso continente, o tema destes cincocentos
  anos p\u00f3nsenos moi dif\u00edcil de abordar con sentido verdadeiro e cr\u00edtico.\\n\\nOs
  lectores desta revista tiv\u00e9mo-la fortuna de que o noso colaborador, Xavier
  R. Madri\u00f1\u00e1n, profesor de Historia, nos fose dando as claves de interpretaci\u00f3n
  con esa ducia de artigos que levaban coma cabeceira o sintom\u00e1tico t\u00edtulo
  de *Da conquista \u00f3 encontro*. Hoxe, neste n\u00famero da revista, queremos
  celebra-lo centenario quinto agradec\u00e9ndolle a Xavier, e a t\u00f3dolos que
  nos serviron de espertadores, que a nosa conciencia estea m\u00e1is avisada.\\n\\nPrecisamente
  o 12 de outubro, data m\u00e1xica da chegada de Col\u00f3n a Santo Domingo, reun\u00edronse
  nesa illa do Caribe, baixo a presidencia do Papa, os bispos latinoamericanos en
  IV Conferencia que, gobernada desde Roma con autoritarismo, deixaba poucas f\u00edrgoas
  para a esperanza. A\u00ednda que cando o Esp\u00edrito anda polo medio, todo pode
  suceder. Habemos informar.\\n\\nAs\u00ed, por exemplo, ning\u00fan agardaba que
  o episcopado de Guatemala entrase no di\u00e1logo cunha carta pastoral que chamou
  a atenci\u00f3n pola s\u00faa valent\u00eda, a pesar das consignas vaticanas, denunciando
  o xeito en que foi realizada a conquista e pedindo perd\u00f3n \u00f3s pobos de
  Am\u00e9rica, nun esforzo de conversi\u00f3n que faga mellores os tempos futuros.\\n\\nQueremos
  dar noticia, as\u00ed mesmo, da edici\u00f3n, por parte da nosa revista irm\u00e1
  *Encrucillada*, dun libro que leva por t\u00edtulo *1492: O encubrimento do Outro*,
  e que son o texto ampliado das extraordinarias conferencias que Enrique Dussel,
  historiador arxentino, dera, hai un ano, na VI Asemblea de Encrucillada. O autor
  agasallounos co libro para que o traducisemos \u00f3 galego antes de que aparecese
  en ning\u00fan outro idioma.\\n\\nAs nosas p\u00e1xinas centrais sobre o conflicto
  entre Inca e Xes\u00fas, dan que pensar.\\n\\n---\\n\\nDaniel L\u00f3pez Mu\u00f1oz\\n\\nObras
  falen, palabras calen\\n\\nSon as bromas da actualidade e do cruce de informacions
  que se d\u00e1 nos xornais. Son casuaidades que non poden controlalos gabinetes
  de prensa e imaxe, que resultan se-los m\u00e1is importantes para o cumprimento
  dos obxectivos das Conseller\u00edas.\\n\\nE as\u00ed, o mesmo d\u00eda que don
  Xos\u00e9 de Lal\u00edn, o conselleiro Cu\u00f1a, o enxebre se\u00f1or do Deza e
  Altas Terras, safa na prensa asinando un protocolo que bota a anda-la incineradora
  de residuos de Meirama, ese mesmo d\u00eda sabemos tam\u00e9n que o burato de ozono
  acodou unha extensi\u00f3n alarmante, moi por riba das previsi\u00f3ns dos cient\u00edficos,
  e que xa \u00e9 equivalente \u00e1 extensi\u00f3n dos Estados Unidos.\\n\\nPero
  todos esos asuntos do queceemento da atmosfera, do efecto invernadeiro, da suba
  do nivel do mar, da chuva \u00e1cida, do burato na capa de ozono,... todas esas
  tremendas ameazas para este planeta ferido de morte, todo iso c\u00e1dralle moi
  lonxe \u00f3s pol\u00edticos de corredoir e asfaltado electoral, a unha clase pol\u00edtica
  clarivamente centrada no seu obxectivo principal de prolongarse no tempo, de sucederse
  a si mesmo, de perpetuarse no cargo, iso s\u00ed, claro, para ben do pa\u00eds.
  Mesmo se te\u00f1en competencias en medio ambiente, coma o caso que nos ocupa, aquelas
  lier\u00edas ecoloxistas non lles quitan un chisco de sono: no mercado electoral
  o que contan son os metros asfaltados e a impresi\u00f3n causada.\\n\\nPara eliminar
  toda d\u00fabida sobre a sensibilidade coa que se fan estas cousas, non hai m\u00e1is
  ca mirar para as xenerosas obras coas que pensa agasallar \u00f3 concello \\\"afectado\\\".
  Cerceda, para compensa-los custos \\\"sociais e econ\u00f3micos\\\": nada menos
  ca un circuito de automobilismo (!Uah, t\u00edo, que pasada!) e un auditorio de
  140 mill\u00f3ns de pesetas.\\n\\nM\u00e1goa que non se percatase o Sr. Conselleiro
  de que as dioxinas venenosas que saen nos fumes das incineradoras, as chuvias \u00e1cidas
  e as perigosas, imprevisibles e incontrolables reacci\u00f3ns qu\u00edmicas secundarias
  que se producen nunha queimada des envergadura, provocar\u00e1n prexu\u00edzos a
  t\u00f3dolos concellos da arredadea.\\n\\nAinda que, ben mirado, m\u00e1is vale
  que non repare en nada, nin repare nada. Deix\u00e1do estar, porque acabar\u00eda
  por tirar de talonario p\u00fablico e facer un estadio de \\\"beisball\\\" no Mes\u00f3n
  do Vento, unha monumental praza de touros en Carral, un palacio etrusco para dar
  clases de harpa en Tordoia, un aer\u00f3dromo sobre o areal de Baldaio, unha Disney-Berganti\u00f1os-landia
  na prolongaci\u00f3n do pol\u00edgono de Sab\u00f3n e unha fant\u00e1stica r\u00e9plica
  do Gran Ca\u00f1\u00f3n do Colorado no que quede das Encrobas cando se esgote o
  lignito.\\n\\nE, oes, o mellor de todo, os alcaldes felices. Porque as obras, obras
  son. E o demais, paparruchas.\\n\\nDOMUND, POLA SOLIDARIEDADE UNIVERSAL\\n\\n\u00c9
  posible que cando o lector lea estas li\u00f1as xa ter\u00e1 pasado o domingo d\u00eda
  18 de outubro, que \u00e9 cando este ano se celebra a xornada mundial das misi\u00f3ns.
  Seguro que todos recordamos ben este nome \u201cDOMUND\u201d, e seguro que todos
  temos algo na cabeza qu\u00e9 \u00e9 iso das \u201cmisi\u00f3ns\u201d. Anque pasase
  o d\u00eda das misi\u00f3ns par\u00e9cenos que nunca \u00e9 tarde para solidarizarnos
  cunha causa ben interesante como \u00e9 a presente.\\n\\nAlgunhas cousas pouco claras\\n\\nNon
  todo o que se ten feito desde as misi\u00f3ns foi cousa limpa. O 500 centenario
  da conquista de Am\u00e9rica tr\u00f3uxonos \u00e1 memoria unha chea de comportamentos
  negativos cos que os as\u00ed chamados misioneiros affixiron \u00e1s poboa\u00e7\u00f5es
  \u00e1s que en teor\u00eda lles fan leva-lo Evanxeo de Xes\u00fas.\\n\\n\u00c9 curioso
  que os pa\u00edses de misi\u00f3ns coincidan cos pa\u00edses do Terceiro Mundo.
  E as\u00ed d\u00e1se o caso curioso de que moitas veces os pa\u00edses do Primeiro
  Mundo expoliamos \u00f3s pa\u00edses do Terceiro quit\u00e1ndollelos bens que lles
  poder\u00edan traer paz, prosperidade, felicidade, e logo envi\u00e1molos nosos
  misioneiros anunciando unha liberaci\u00f3n no nome de Deus.\\n\\nA solidariedade
  por riba de todo\\n\\nDe t\u00f3dolos xeitos as cousas non son tan simples. Hoxe
  podemos dicir que onde hai un misioneiro, onde hai unha misi\u00f3n, al\u00ed hai
  un foco de solidariedade verdadeiro, que est\u00e1 iluminando as situaci\u00f3ns
  de opresi\u00f3n e de marxinaci\u00f3n que padecen os pobos do Terceiro Mundo. Por
  iso, no seu conxunto, merecen o noso apoio e solidariedade co coraz\u00f3n, coa
  palabra e cos cartos.\\n\\nA misi\u00f3n relixiosa transmite a solidariedade que
  produce o Evanxeo de Xes\u00fas, pero \u00f3 mesmo tempo transmite tam\u00e9n o
  co\u00f1ecemento dese mesmo Xes\u00fas que promove \u00e1 solidariedade.\\n\\nA
  proba da autenticidade\\n\\nXa o temos escrito m\u00e1is veces nesta p\u00e1xina.
  O trato que lle deamos \u00e1 xente do Terceiro Mundo \u00e9 un test que debemos
  superar se queremos aproba-la nosa asignatura de boa relixiosidade. Non hai fe verdadeira,
  por moito que se rece, se non hai solidariedade co marxinado. E non hai solidariedade
  co marxinado se non chega a remex\u00e9no-la carteira, a comodidade, o consumismo.\\n\\nNon
  lle ser\u00e1 dif\u00edcil \u00f3 lector bater con alg\u00fans dos grupos que traballan
  para o Terceiro Mundo: DOMUND, C\u00e1ritas, Interm\u00f3n, Mans Unidas, M\u00e9dicos
  sen fronteiras. Poder\u00e1 colaborar con cartos, poder\u00e1 colaborar traballando
  neses grupos no seu mesmo pobo... todo \u00e9 cuesti\u00f3n de ter vontade e interese.\\n\\nREMOENDO
  O EVANXEO\\n\\nDomingo XXX do Tempo Ordinario (25 de Outubro)\\n\\n\u201cA oraci\u00f3n
  dos humildes atravesa as nubes para chegar de contado onda o trono de Deus\u201d
  (Ecl. 35, 20-22).\\n\\n\u201cUn fariseo e un publicano subiron \u00f3 templo a rezar:
  ... D\u00edgovo de certo que foi este quen baixou perdoado, \u00f3 contrario do
  outro; porque todo aquel que se enaltece ser\u00e1 humillado, pero aquel que se
  humilla ha de ser enaltecido\u201d. (Lc 18, 9-14)\\n\\nSempre en garda contra o
  fariseo que todos levamos dentro, pois sempre nos habemos sentir mellores ca algun\u00e9n,
  ou c\u00f3 borrazcho que anda a pedir, ou que se eu dou m\u00e1is esmola c\u00f3
  veci\u00f1o, ou que se son mellor ca aquel que non cumpre coma n\u00f3s,... As\u00ed
  sent\u00e9monos co dereito de esixirlle a Deus o que cremos que \u201cnos debe por
  bos\u201d.\\n\\nD\u00eda de t\u00f3dolos Santos (1 de Novembro)\\n\\nSantos e defuntos,
  os d\u00edas nos que as igrexas e os cemiterios est\u00e1n m\u00e1is concorridos
  coma expresi\u00f3n do amor \u00f3s nosos defuntos. O amor en calquera circunstancia
  \u00e9 sempre un valor. Pero c\u00f3mpre facerse tam\u00e9n alg\u00fansas preguntas
  ese d\u00eda \u00bf\u00c9 expresi\u00f3n de amor o noso derroche en flores, ou m\u00e1is
  ben de ostentaci\u00f3n? \u00bfAmor \u00f3s mortos mais ca \u00f3s vivos? \u00bfA
  vista \u00f3 cemiterio \u00e9 expresi\u00f3n da confianza no amor salvador de Deus,
  \u00e9 verdadeiro expresi\u00f3n de esperanza ou... todo o contrario?\\n\\nOS NOSOS
  CASTI\u00d1EIROS E CARBALLOS EST\u00c1N ENFERMOS, e neste tempo de magostos hai
  que proclamalo, porque parece que ningu\u00e9n se decata. A praga \u201chaltica
  quercetorum\u201d fai estragos tanto en Lugo coma en Ourense, coma se se convertese
  nun aliado invencible daqueles que queren facer de Galicia un eucaliptal..., ser\u00eda
  un atentado \u00e1 mesma identidade da nosa terra.\\n\\nADIANTE acadou o n\u00famero
  cincuenta, e unha tirada de seis mil exemplares. Este voceiro da Confederaci\u00f3n
  Xeral de Traballadores Galegos chega t\u00f3dolos meses \u00f3s centros de traballo,
  con novas, an\u00e1lises e colaboraci\u00f3ns que est\u00e1n a facer del unha canle
  moi axeitada \u00f3 servizo da cultura e das reivindicaci\u00f3ns de t\u00f3dolos
  sectores do mundo laboral.\\n\\nOS INMIGRANTES TE\u00d1EN DISTINTA SORTE, e as\u00ed
  uns dous mil traballadores estranxeiros que viven en Galicia, a meirande parte portugueses,
  non tiveron problemas co permiso de residencia, mentres que outros oitocentos (marroqu\u00eds,
  senegaleses, sudamericanos...) non dan ama\u00f1ado a s\u00faa situaci\u00f3n, e
  mesmo cento vinte\u00fan te\u00f1en neste intre denunciada no Tribunal Superior
  de Xustiza a orde de expulsi\u00f3n.\\n\\nOUTRO MURO se est\u00e1 a erguer cando
  o 9 de novembro hai tres anos que caeu o de Berl\u00edn. O Estreito \u00e9 a foixa
  para m\u00e1is de douscentos afogados que, despois de moitos meses de viaxe, escapaban
  da fame de Somalia, da represi\u00f3n das dictaduras, da guerra de Liberia... Entre
  doce e quince mil inmigrantes ilegais xogan a vida na busca dun anaco de pan. Antes
  alg\u00fans deles, si tiveron forzas e sorte: atravesaron medio continente e \u00a1en
  que condici\u00f3ns!\\n\\n1993: GALICIA NA PROCURA DO CAMI\u00d1O\\n\\n(VII Asemblea
  de Encrucillada, 6-7 novembro)\\n\\nD\u00eda 6:\\n\u2014 \u00e1s 7,30 Presentaci\u00f3n\\n\u2014
  \u00e1s 8,00: Manuel D\u00edaz y D\u00edaz: \\\"Estado actual da cuesti\u00f3n xacobea
  (Aspectos cient\u00edfico-hist\u00f3ricos).\\n\\nD\u00eda 7:\\n\u2014 \u00e1s 10:
  Xos\u00e9 Lu\u00eds Barreiro Rivas: \\\"Galicia en Europa: novo cami\u00f1o\\\"
  (Aspectos socio-pol\u00edticos).\\n\u2014 \u00e1s 12: Mesa redonda: A peregrinaci\u00f3n.\\n  Xos\u00e9
  Chao Rego: \\\"Teolox\u00eda do Ano Santo\\\".\\n  Miguel Carneiro: \\\"A experiencia
  do cami\u00f1o\\\".\\n  Ux\u00edo Romero Pose: \\\"O cami\u00f1o antes do cami\u00f1o\\\".\\n\u2014
  \u00e1s 4,30: Andr\u00e9s Torres Queiruga: \\\"Ano Santo: desaf\u00edo \u00e1 Igrexa
  galega (aspectos teol\u00f3xicos-pastorais)\\\".\\n\u00c0 Asemblea, aberta a todos,
  celebrarase en Santiago, no Colexio de La Salle.\\n\\nARXENIO IGLESIAS E O \\\"SUPERDEPOR\\\"
  fixeron alucina-lo pa\u00eds; o adestrador, sen perde-lo seu sentido da realidade,
  aspira a poder xogar nas competici\u00f3ns europeas, co\u00f1ece moi ben o campo,
  pois \u00e9 un home da casa desde que escomenzou a xogar xa hai anos. Este equipo
  nado en 1906, xa fora subcampi\u00f3n da liga no cincuenta, mais endexamais tivo
  un presuposto tan grande que ata agora deu os seus froitos; tam\u00e9n est\u00e1
  atraendo moitos \\\"forofos\\\" do Real da capital de Espa\u00f1a para as s\u00faas
  filas, m\u00e1is e o intelixente \\\"Arxenio\\\" o que non perde os estribos.\\n\\nO
  PRIMEIRO CONGRESO GALEGO DA SA\u00daDE LABORAL ter\u00e1 lugar en Vigo os d\u00edas
  cinco, seis e sete de novembro, nun momento importante no que en Galicia se producen
  moitos accidentes laborais. Os homes de mar, a muller, os riscos e a s\u00faa prevenci\u00f3n,
  a sanidade..., son alg\u00fans dos temas a tratar. Neses d\u00edas haber\u00e1 unha
  Exposici\u00f3n de material de Seguridade e Hixiene no Auditorio do Concello.\\n\\nPOR
  FIN, MARICA CAMPO, agasallounos cun libro moi fermo: \\\"Tras as portas do rostro\\\".
  Xa co\u00f1ec\u00edamo-los seus versos: nas Romaxes, na m\u00fasica de Fuxan os
  Ventos, \u2014lembremos aquela \\\"Muller\\\"\u2014, en moitas colaboraci\u00f3ns
  e celebraci\u00f3ns... Agora, ofr\u00e9cenos este libro cunha das mellorres poes\u00edas
  galegas dos \u00faltimos tempos. Cun pr\u00f3logo de Manuel Mar\u00eda e ilustraci\u00f3ns
  do pintor Xan Guerreiro que, coma ela, est\u00e1 a crear no Xove da Mari\u00f1a
  de Lugo. \u00a1Noraboa!\\n\\nMONDO\u00d1EDO celebra \\\"As San Lucas\\\" nun intre
  no que est\u00e1 empe\u00f1ada en recupera-la s\u00faa historia, os seus xornais
  antigos, as s\u00faas edificaci\u00f3ns e festas..., e as\u00ed nestes anos foron
  rehabilitadas vellas casas en Bibliotecas, Centro Social e Casa da Cultura, tam\u00e9n
  volveron as Feiras e Festas das Quendas no comezo de maio, e os antigos semanarios
  son substitu\u00eddos por publicaci\u00f3ns coma \\\"Mondo\u00f1edo\\\", que nestes
  d\u00edas publica o n\u00famero vintenove.\\n\\nPONTEAREAS, a pesar da s\u00faa
  historia cargada de tradici\u00f3ns e de cultura, est\u00e1 a sufrir a irracionalidade
  dun alcalde que est\u00e1 molesto con toda clase de reivindicaci\u00f3n, e sobre
  todo coa s\u00faa difusi\u00f3n. As\u00ed, os ecoloxistas de ADENCO estanse manifestando
  \\\"Pola liberdade de expresi\u00f3n\\\", xa que o alcalde, coma nos tempos da dictadura
  na que xa exerc\u00eda, non deixa colocar informaci\u00f3n cr\u00edtica en lugares
  axeitados.\\n\\n\u00bfQue \u00e9 a nova evanxelizaci\u00f3n?\\n\\nO te\u00f3logo
  xesu\u00edtica valenciano Gonz\u00e1lez Faus, profesor en Barcelona, \u00e9 co\u00f1ecido
  non soamente pola s\u00faa sabedor\u00eda teol\u00f3xica, sen\u00f3n tam\u00e9n
  polo compromiso ideol\u00f3xico e vital co Terceiro Mundo, especialmente na \u00e1rea
  de Centroam\u00e9rica.\\n\\n\u00bfQue entendas por nova evanxelizaci\u00f3n?\\n\\n\u2014Pois,
  en primeiro lugar eu dir\u00eda que evanxelizaci\u00f3n non \u00e9 nin proselitismo,
  nin imposici\u00f3n, nin propaganda e se se fai iso, non \u00e9 evanxelizaci\u00f3n.\\n\\nEn
  segundo lugar, a evanxelizaci\u00f3n necesita duns valores que son valores humanos,
  eses valores, que nos faltaban en Occidente, e anuncialos e fomentalos, e despois
  v\u00e9n o anuncio da fe, precisamente coma fundamento e soporte deses valores.\\n\\nEn
  terceiro lugar, no momento hist\u00f3rico que vivimos de competici\u00f3ns de relixi\u00f3ns,
  a evanxelizaci\u00f3n ter\u00e1 que ter un elemento fundamental de di\u00e1logo
  que significa fundamentalmente escoltar \u00f3 outro, e quizais hai que dar por
  suposto que historicamente a cristianizaci\u00f3n do mundo xa pasou. Penso que hai
  un momento hist\u00f3rico no s\u00e9culo XVII con todo o problema dos ritos malabares,
  dunha grande aurora para o cristianismo na China e na India por unha inculcaci\u00f3n
  moi profunda con Mateo Ricci e con Norberto De Nobili, que \u00e9 cortado por Roma
  por medo a que supo\u00f1a idolatr\u00edas, superstici\u00f3n etc... e probablemente
  a\u00ed remata a posibilidade de cristianizaci\u00f3n neses pa\u00edses, polo menos
  por moito tempo. Ent\u00f3n hoxe temos que aceptar que Deus reacciona (por dicilo
  alg\u00fam xeito) segundo os homes actuemos na historia, e se nun momento quer\u00eda
  cristianizar a todo o mundo, pois hoxe, quizais non queira, e por iso, o elemento
  do di\u00e1logo \u00e9 tan importante.\\n\\nBen, estes tres puntos, non proselitismo,
  anuncio de valores, e consideralo momento hist\u00f3rico que vivimos, poden definir
  algo da nova evanxelizaci\u00f3n.\\n\\n\u00bfNon ten ent\u00f3n isto moito que ver
  con esa acusaci\u00f3n que \u00e1s veces se lle fai \u00f3 Papa de intento de polonizaci\u00f3n
  da Igrexa?\\n\\n\u2014Non \u00e9, a\u00ednda que esta acusaci\u00f3n pode ter algo
  de verdade, nin sequera \u00e9 unha acusaci\u00f3n \u00f3 Papa; outros papas non
  foron polacos e intentaron occidentaliza-la Igrexa, \u00e9 dicir, cada un proxecta
  o que ten, e cre que \u00e9 a verdade. O que reflicte isto, \u00e9 que a Igrexa
  non ten que ser tan centralizada. Ten que ser unha, e en comuni\u00f3n, pero en
  comuni\u00f3n do diverso, unha Igrexa de igrexas, d\u00e1ndolle moita importancia
  \u00e1s igrexas locais.\\n\\n\u00bfCal pode se-lo papel da igrexia popular, das
  comunidades cristi\u00e1s nesta nova evanxelizaci\u00f3n?\\n\\n\u2014Ben, sempre
  que falamos da Igrexa non deber\u00edamos entende-la xerarqu\u00eda, a instituci\u00f3n.
  A Igrexa \u00e9 a comunidade dos crentes e nesa comunidade aqueles que son m\u00e1is
  pobres, aqueles que est\u00e1n m\u00e1is \u00f3 lado dos pobres deben ter un papel
  importante, eu non dir\u00eda protagonismo porque esta palabra ten un sentido negativo,
  pero si, unha responsabilidade maior e de feito moitas cousas evanxeliz\u00e1ronse
  gracias \u00f3s pobres e \u00f3s que traballan con eles.\\n\\n\u00bfEst\u00e1 claro
  que non \u00e9 unha responsabilidade exclusiva da xerarqu\u00eda a evanxelizaci\u00f3n,
  non?\\n\\n\u2014Non, non, nin moit\u00edsimo menos \u00e9 unha responsabilidade
  da Xerarqu\u00eda, pero \u00e9 unha tarefa de todo cristi\u00e1n. Hai historiadores
  que soste\u00f1en que os que propagaron a Igrexa foron os laicos, \u00a1\u00e9 que
  os laicos son a Igrexa!\\n\\nPaz Nereira\\n\\nAportaci\u00f3ns doutras culturas\\n\\nUnha
  lenda\\n\\nOs Maias, antigos habitantes de Am\u00e9rica Central, contaban de pais
  a fillos, que o primeiro home cre\u00e1rono os deuses a partir do millo. Os deuses
  intentaran face-lo home con lama e mais madeira, pero fracasaron. Tan s\u00f3 o
  home feito de millo sobreviviu. Este home e t\u00f3dolos que naceron despois puideron
  e poden aseguralo seu alimento coti\u00e1n co cultivo do millo.\\n\\nUnha receita:
  Pombi\u00f1as de millo\\n\\nIngredientes:\\n1. Graos de millo (hainos a vender nas
  tendas),\\n2. Sal\\n3. Aceite\\n\\nElaboraci\u00f3n:\\n1. Po\u00f1emo-la tixela
  cun pouco de aceite \u00f3 lume.\\n2. Cando estea quente, bota-lo millo e tapar.\\n3.
  Esperar a que estoupen os grans.\\n4. Po\u00f1elos nun recipiente e botarlle sal.\\n\\nUn
  anaco de historia\\n\\nNa Europa do tempo de Cristovo Col\u00f3n (s\u00e9culo XV),
  moitos alimentos orixinarios de Am\u00e9rica eran desco\u00f1ecidos.\\n\\nActualmente
  son habituais na nosa coci\u00f1a, ata tal punto que resulta dif\u00edcil pensar
  c\u00f3mo comer\u00edamo-los europeos sen o tomate, pementos, cacao, millo, pataca...\\n\\n\u00bfSerfan
  os su\u00edzos e os holandeses tan famosos polos seus chocolates sen a axuda do
  cacao mexicano?, \u00bfe a pataca galega?, \u00bfe o tomate levantino?, \u00bfe
  o pemento da Rioxoa?...\\n\\nA aportaci\u00f3n que en materia de alimentos e condimentos
  fixeron as culturas do chamado \u201cNovo Mundo\u201d \u00e1 vella Europa, resultou
  abertamente revolucionaria.\\n\\nUnha reflexi\u00f3n\\n\\nUnha alimentaci\u00f3n
  rica en carne, precisa de moitas terras para produc\u00ed-lo alimento que os animais
  necesitan consumir.\\n\\nTemos sen embargo, que o consumo de cereais combinado con
  legumes proporciona prote\u00ednas en cantidades \u00f3ptimas para o ser humano.\\n\\nNo
  Terceiro Mundo os cereais utilizanse masivamente para a alimentaci\u00f3n humana,
  e a porcentaxe destinada \u00e1 alimentaci\u00f3n animal \u00e9 pequena.\\n\\nD\u00faas
  hect\u00e1reas de terra nas que se cultive solla, producen prote\u00ednas para 30
  persoas; se estas d\u00faas hect\u00e1reas se dedican a pastos para o gando, as
  prote\u00ednas da s\u00faa carne soamente chegan para unha persoa.\\n\\nDiminu\u00ed-lo
  consumo de carne \u00e9 unha das pequenas cousas que podemos facer, non s\u00f3
  por cuesti\u00f3ns diet\u00e9ticas, sen\u00f3n \u00e9ticas, xa que permite un aforro
  no ciclo alimentario e unha actitude solidaria coas 3/4 partes do planeta.\\n\\nMarta
  Sope\u00f1a (Elaborado con materiais de INTERMON).\\n\\nCincocentos anos despois
  do \\\"encontro entre doux mundos\\\", como a mi\u00fado se prefire chamar \u00e1
  conquista levada a cabo en 1492, o choque da cultura europea coas culturas aut\u00f3ctonas
  americanas non diminu\u00edu a pesar as numerosas mestizaxes que se produciron.
  Disto dan conta mellor certas expresi\u00f3ns literais dos \\\"Indios\\\" de hoxe
  en d\u00eda ca outras consideraci\u00f3ns xerais sobre o asunto. Sirva coma exemplo
  este relato recollido no Per\u00fa dos beizos dun paisano quechua da rexi\u00f3n
  andina de Aiacucho e publicada en 1971 en Lima pola revista Educaci\u00f3n.\\n\\nComentario\\n\\nEste
  relato constit\u00fae, a primeira vista, unha explicaci\u00f3n do noxo que os nenos
  das comunidades campesi\u00f1as andinas sacada dun esquema m\u00edtico moi antigo,
  revelador dos sentimentos dos Indios dos Andes con relaci\u00f3n \u00f3 mundo e
  \u00e1 historia que a cultura dominante lles imp\u00f3n.\\n\\nReparemos na oposici\u00f3n
  central entre os dous irm\u00e1ns. Inca e Xes\u00fas, \u00e1mbolos dous fillos do
  mesmo Deus, pero convertidos en inimigos por culpa da decisi\u00f3n de Xes\u00fas
  de acabar con Inca. O deus dos cristi\u00e1ns est\u00e1 considerado sempre coma
  o m\u00e1is forte, posto que \u00e9 o deus dos vencedores.\\n\\nNos tempos antigos,
  Deus todopoderoso, o noso pai, percorreu o mundo enteiro. Tivo dous fillos: Inca
  e Xes\u00fas. Inca dixo: \u00a1Falade! E n\u00f3s aprendemos todos a falar, e dende
  ese d\u00eda ensin\u00e1moslle-la palabra tam\u00e9n \u00f3s nosos fillos. Inca
  dixolle \u00e1 Terra-Nai: \u00a1Dalles de comer! Foi o tempo da abundancia.\\n\\nInca
  casou coa Terra-Nai e tiveron dous fillos moi feiti\u00f1os. Nada m\u00e1is velos,
  Xes\u00fas sentiu carraxe.\\n\\nCONTO\\n\\nComo el medrara e xa era forte, quixo
  acabar co seu irm\u00e1n maior Inca. Cavilaba: \u00bfComo hei poder vencelo? A L\u00faa
  viu a m\u00e1goa de Xes\u00fas e acudiu na s\u00faa axuda: \u00a1Heite valer!, dixolle.
  E deixou caer diante del un papel escrito. Baixo o escuro luar, Xes\u00fas amosoulle
  o papel a Inca, e este tivo medo, porque nada comprend\u00eda da escritura: \u00bfQue
  son estes borranchos? E escapou lonxe, moi lonxe.\\n\\nEntre Inca e Xes\u00fas\\n\\nCon
  todo, os tempos de Inca son considerados como tempos de abundancia, gracias \u00e1
  alianza entre Inca e Terra. O verdadeiro civilizador \u00e9 Inca, xa que el ensinou
  a linguaxe e mailas t\u00e9cnicas de agricultura e pastoreo: el \u00e9 o que est\u00e1
  na orixe dunha sociedade certamente humana.\\n\\nPola contra, a \u00e9poca actual,
  dominada por Xes\u00fas, \u00e9 a dos inimigos da terra que acabaron para sempre
  coa posibilidade de vivir e reemprazaron a linguaxe que permit\u00eda comunicarse
  e a produci\u00f3n que favorec\u00eda o crecemento, por unha escola que mata. \u00bfNon
  \u00e9 isto afirmar con toda claridade que o aporte da cultura do conquistador resulta
  mortal para os fillos de Inca?\\n\\nO escrito \u00e9 escuro, coma a noite da que
  deitou: deforma a historia humana e pretende establecer unha falsa reconciliaci\u00f3n.
  A escola \u201coccidental e cristi\u00e1\u201d que lles transmite a escritura \u00e9
  devoradora e culturalmente liquidadora. Non hai reconciliaci\u00f3n posible entre
  a tradici\u00f3n andina e maila ciencia de Occidente, porque a relaci\u00f3n da
  unha coa outra acouga sobre a violencia e maila explotaci\u00f3n.\\n\\nOs programas
  escolares que pretend\u00edan demostra-lo contrario aportando soamente os exemplos
  de mestizaxes culturais que tiveron \u00e9xito, non son m\u00e1is ca unha mentira.
  A lecci\u00f3n que hai que tirar da escola \u00e9 esta: \u00a1non permitades que
  vos trabuquen!\\n\\n(Traducido do escrito de Jean-Max Hugues na revista francesa
  Lumi\u00e8re et vie, n. 208, xullo 1992).\\n\\nINDIO\\n\\nXes\u00fas cavilaba: \u00bfComo
  poderei prender a Inca? E como non o daba conseguido, rompeu a chorar. O puma viuno
  e compadeceuse: \u00a1Heiche botar unha man!, dixolle. E convocou t\u00f3dolos outros
  pumas, grandes e pequenos. Todos se puxeron a perseguir a Inca, que fuxiu ata o
  deserto de Lima. Cada vez que Inca quer\u00eda comer dos froitos dos xard\u00edns,
  os pumas bot\u00e1banlo f\u00f3ra, anque morrese coa fame.\\n\\nComo xa non pod\u00eda
  m\u00e1is nada contra Inca, Xes\u00fas bateulle \u00e1 Terra-Nai e cortoulle a cabeza.
  Despois fixo constru\u00edr igrexas.\\n\\nO Esp\u00edrito Vello tivera que ficar
  agachado mentres Inca percorr\u00eda o mundo. Aledouse da morte de Inca. O Esp\u00edrito
  Vello viv\u00eda nunha monta\u00f1a chamada Escola. E tam\u00e9n se puxo contento
  dos golpes que recibiu a Terra-Nai.\\n\\nA Igrexa vai co\u00f1ecer unha oportunidade
  hist\u00f3rica irrepetible con ocasi\u00f3n do S\u00ednodo africano, a celebrar
  seguramente en 1993. Est\u00e1 chamado a ser importante, pero est\u00e1 moi ameazado.
  Que se celebre, por suposto, en territorio africano, pero que sexa realmente africano
  no sentido de que os verdadeiros protagonistas sexan africanos e de mentalidade
  africana. C\u00f3mpre que a igrexa de \u00c1frica se encontre consigo mesma e co
  continente africano, cos seus problemas propios, pero dende a identidade africana
  e \u00f3 seu xeito.\\n\\nHoxe en \u00c1frica hai 600 mill\u00f3ns de habitantes
  e no ano 2025 (dentro de 30 anos) ter\u00e1 tantos habitantes coma Europa e as d\u00faas
  Am\u00e9ricas xuntas: m\u00e1is de 1.500 mill\u00f3ns. E o 11 por cento son cat\u00f3licos,
  quizais o 30 por cento cristi\u00e1ns. Hoxe hai 80 mill\u00f3ns de cat\u00f3licos
  cando en 1900 non chegaban \u00f3 mill\u00f3n. O crecemento \u00e9 froito dun longo
  proceso de conversi\u00f3n dende as relixi\u00f3ns nativas primitivas \u00f3 encontro
  con Cristo. Pero a Igrexa \u00e9 debedora de \u00c1frica, traballou moito al\u00ed,
  en comparanza con outros sitios; \u00e9 unha Igrexa moi recente, est\u00e1n cumprindo
  cen anos as igrexas m\u00e1is veteranas. Pero a Igrexa medra moito e logo ter\u00e1
  tantos bautizados coma as igrexas de Europa.\\n\\nA Igrexa necesita afianza-la s\u00faa
  africanidade e maila s\u00faa identidade dentro da grande Igrexa. Hai uns 500 bispos
  africanos e necesitan encontrarse entre si coa s\u00faa misi\u00f3n espec\u00edfica.
  Dependen de d\u00faas tradici\u00f3ns europeas moi diversas: a angl\u00f3fona e
  a franc\u00f3fona, de acordo cos lugares de dominio colonial ingl\u00e9s ou franc\u00e9s.
  Necesitan identificarse coma Igrexa africana e encontra-la s\u00faa personalidade
  dentro da Igrexa universal. Que os bispos tomen conciencia da s\u00faa personalidade
  africana, mantendo a comuni\u00f3n con Roma. A Secretar\u00eda do S\u00ednodo debe
  po\u00f1er a salvo esa africanidade.\\n\\nO noso amigo e colaborador Antonio Fdez.
  Oca foi un dos tres expertos espa\u00f1oles que participaron como instructores dos
  Seminarios de formaci\u00f3n e Capacitaci\u00f3n do Servicio Obrigatorio do Ano
  T\u00e9cnico Rural Agropecuario (S.O.A.T.R.A.) no Ecuador. Mantivemos con el unha
  charla sobre a s\u00faa experiencia nese pa\u00eds onde permaneceu por espacio de
  40 d\u00edas e tivo oportunidade de visitar multitude de comunidades e falar con
  elas.\\n\\n\u00bfP\u00f3denos aclarar que \u00e9 iso do SOATRA?\\n\\n\u2014No Ecuador
  os \u201cegresados\u201d (ch\u00e1malle as\u00ed \u00f3s licenciados) est\u00e1n
  obrigados a facer un ano do SOATRA. S\u00e9rvelle de pr\u00e1ctica \u00f3 t\u00e9cnico
  (\u00e9 compatible ademais coa preparaci\u00f3n da tese de grao) e por outra banda
  este Servicio Obrigado serve para que o t\u00e9cnico devolva \u00e1 sociedade unha
  parte do esforzo que esta empregou en formalo.\\n\\nParece unha idea interesante.
  \u00bfComo se realiza o traballo do SOATRA dos egresados?\\n\\n\u2014Nunha comunidade
  rural concreta cun instructor (do SOATRA) e un gu\u00eda, que \u00e9 o que vai axudar
  nas dificultades coas que se vai topando. Pero tam\u00e9n o poden facer na investigaci\u00f3n
  ou noutro tipo de traballos coma campa\u00f1as de saneamento ou repoboaci\u00f3ns
  forestais.\\n\\nTe\u00f1o entendido que o compo\u00f1ente indio \u00e9 moi abundante
  no Ecuador.\\n\\n\u2014Efectivamente, sobre todo no altiplano e na conca amaz\u00f3nica,
  e menos na costa, que \u00e9 a zona m\u00e1is desenvolvida onde ten asento a poboaci\u00f3n
  de ascendencia europea. Na provincia do Chimborazo (capital: Riobamba), onde estivemos
  m\u00e1is tempo, a 70% da poboaci\u00f3n \u00e9 quechua e fala quechua.\\n\\n\u00bfTe\u00f1en
  alg\u00fan tipo de demanda espec\u00edfica coma pobo, coma naci\u00f3n diferenciada
  que son?\\n\\n\u2014Realmente \u00e9 un Estado doutro Estado, pero iso non o po\u00f1as
  que igual lles parece mal \u00f3s de orixe europea (que o lector disimule coma se
  non estivese escrito). Eles non demandan s\u00f3 terra. Queren que os fillos poidan
  ser educados na s\u00faa lingua, poder aplic\u00e1-la s\u00faa xustiza, ser unha
  naci\u00f3n sen cuestiona-lo Estado Ecuatoriano.\\n\\n\u00bfC\u00f3mo loitan para
  conseguirlo?\\n\\n\u2014Fan resistencia pasiva. Non participan na vida pol\u00edtica
  (pasan das elecci\u00f3ns). Ata hai pouco non eran propietarios de nada.\\n\\nVolvamos
  \u00e1 cuesti\u00f3n do traballo coas comunidades...\\n\\n\u2014Ab\u00f3rdase un
  problema concreta coma p.e. plano de\\n\\nColaboraci\u00f3n galega no Ecuador\\nEntrevista
  a Antonio Fern\u00e1ndez Oca\\n\\nEliseo Xabier Migu\u00e9lez D\u00edaz\\n\\nalimentaci\u00f3n
  e garder\u00eda para os nenos. A universidade descubriu que a alimentaci\u00f3n
  era moi deficiente e desequilibrada, o que tra\u00eda problemas no desenvolvemento
  dos rapaces.\\n\\nOutro exemplo \u00e9 o uso do comp\u00e1s en A para buscar as
  curvas de nivel con obxecto de facer un laboreo seguindo as mesmas, evitando desta
  forma a erosi\u00f3n, que \u00e9 moi acusadas nalgunhas \u00e1reas.\\n\\n\u00bfTe\u00f1en
  excedentes? \u00bfComo os comercializan?\\n\\n\u2014Te\u00f1en acordo para moitas
  cousas: para levar os telef\u00f3nos, a auga, o regadio, pero non te\u00f1en a\u00ednda
  acordo para venderen en com\u00fam. Os excedentes v\u00e9nndenos nas feiras, estilo
  feiras tradicionais galegas. Sabes, os galegos entendemos moi ben aquelo, e sent\u00e9monos
  pr\u00f3ximos xa que son melanc\u00f3licos e saudosos. A s\u00faa m\u00fasica \u00e9
  melanc\u00f3lica, como a nosa, e mira isto (o Ant\u00f3n am\u00f3same unha foto
  onde se le o cartel de entrada dunha poboaci\u00f3n: QUIROGA. S\u00f3 o tipo de
  vexetaci\u00f3n nos permite asegurar que non se trata do Quiroga lugu\u00e9s).\\n\\nTi
  que tiveches oportunidade de contempla-la realizaci\u00f3n pr\u00e1ctica de moitos
  planos de colaboraci\u00f3n, froito de acordos bilaterais con pa\u00edses coma Su\u00edza,
  Italia, USA, Alema\u00f1a, Canad\u00e1, Espa\u00f1a, etc que colaboran con organismos
  diversos (Organizaci\u00f3ns Non Gubernamentais, Universidade Goberno). Na t\u00faa
  opini\u00f3n \u00bfcal \u00e9 o tipo m\u00e1is eficaz?\\n\\n\u2014Cando realmente
  os ves \u00fatiles \u00e9 cando destinan o seu apoio a programas que te\u00f1en
  as s\u00faas ra\u00edces en comunidades concretas e van destinadas a resolver problemas
  concretos que queren resolve-las comunidades. Polo contrario cando se \u201csolta\u201d
  unha soluci\u00f3n en paraca\u00eddas sen que a poboaci\u00f3n va\u00eda aprendendo
  e demanda esa soluci\u00f3n, remata en fracaso. Non se poden facer trasplantes.
  O home ten que evolucionar el resolvendo problemas concretos. E ten que solucionar
  o problema cos seus recursos.\\n\\nA\u00ednda que falamos dou-tros cousas, como
  o espazo non d\u00e1 para m\u00e1is, preg\u00fantolle a Ant\u00f3n se quere engadir
  m\u00e1is algo.\\n\\nSi, tres cousas. A primeira que quero dicir \u00e9 que aprend\u00edn
  moito m\u00e1is do que ensinei. A segunda \u00e9 agradece-lo gran trato recibido
  no pa\u00eds, sen distinci\u00f3n de xente. A terceira indica-la identificaci\u00f3n
  do car\u00e1cter, sobre todo o do altiplano, co noso.\\n\\nELISEO XABIER MIGU\u00c9LEZ
  D\u00cdAZ\\n\\nAntonio Fern\u00e1ndez Oca (o 1\u00ba pola esquerda da fila 3) co
  grupo de participantes no curso no que colaborou\\n\\nA atenci\u00f3n \u00f3 mundo
  infantil entra, por suposto, dentro do campo de preocupacions do S.O.A.T.R.A.\\n\\nMantense
  a vixencia da Orde de 21-3-91 que regula un sistema de axudas \u00e1s explotaci\u00f3ns
  agrarias para axiliza-la percepci\u00f3n das subvenci\u00f3ns derivadas do Real
  Decreto 808/1987.\\n\\nPrazo: As solicitudes poden presentarse ata o 30-11-92\\n\\nDiario
  Oficial de Galicia, 19-2-92\\n\\nCONSELLER\u00cdA DE AGRICULTURA,\\nGANDER\u00cdA
  E MONTES\\n\\nComa un irm\u00e1n che falo (X\u00e9n 33)\\n\\nO cap\u00edtulo 32
  inf\u00f3rmanos do medo que Xacob, de retorno a Can\u00e1n, lle pillou a se encontrar
  co seu irm\u00e1n Esa\u00fa, a quen traizoa, engan\u00e1ndoo. O cazarro Xacob prepara
  o encontro con enormes agasallos que lle vai enviando, \u00f3s poucos e sucesivamente
  a Esa\u00fa, por mor de amolecelo. \u00bfQue vai pasar? Xacob artella toda unha
  estratexia en orde \u00f3 encontro:\\n\\n1. Xacob ergueu os ollos e viu vir a Esa\u00fa
  con catrocientos homes. El repartiu os nenos entre Lea, Raquel e as d\u00faas servas.
  2. Puxo diante as d\u00faas servas cos seus fillos, logo a Lea cos seus e detr\u00e1s
  de todos a Raquel con Xos\u00e9 (1). 3. El pasou diante de todos, e foise postrando
  por terra sete veces (2).\\n\\nXacob coloca diante de Esa\u00fa a s\u00faa familia
  coma valo protector, de acordo coa orde de menor a maior estima, Raquel e Xos\u00e9
  no lugar m\u00e1is seguro, na retagarda. O relato \u00e9 narrado imediatamente despois
  do encontro-loita de Xacob con Deus (c.32). O autor intenta subli\u00f1ar que a
  protecci\u00f3n divina non abandona a Xacob. \u00bfResultado?\\n\\n1. Esa\u00fa
  correu \u00f3 seu encontro, apretouno, abraz\u00f3uselle \u00f3 pescozo e bic\u00e1ronse
  chorando. 2. Logo Esa\u00fa ergueu os ollos e vendo as mulleres e os nenos, preguntou:
  \u201c\u00bfQuen son eses?\u201d. Xacob respondeulle: \u201cSon os fillos que Deus
  lle concedeu \u00f3 teu servo\u201d (3). 4. Adiant\u00e1ronse cara a eles as servas
  cos seus fillos, e postr\u00e1ronse no chan (...)\\n\\nXacob segue enchendo de agasallos
  a Esa\u00fa, que se resiste \u2013imperativos da cortes\u00eda oriental\u2013 a
  aceptalos. Xacob porf\u00eda con insistencia servil, cham\u00e1ndolle a Esa\u00fa
  \u201cmeu se\u00f1or\u201d mentres que este lle chama \u201cirm\u00e1n\u201d e,
  dende logo, p\u00f3rtase coma tal. Xacob p\u00e1sase: compara este encontro co que
  tivo con Deus:\\n\\n10. Xacob insistiu: \u201cNon, meu se\u00f1or. Se merezo o teu
  favor acepta o meu regalo, pois o verte foi para min coma se vise o rostro de Deus
  (...).\\n\\nEsa\u00fa faloulle coma un irm\u00e1n, pero Xacob segue coa s\u00faa
  desconfiada astucia e inventa unha excusa diplom\u00e1tica para se desfacer da compa\u00f1\u00eda
  do \u201cseu se\u00f1or\u201d. E resulta o elixido de Deus. \u00a1Non che somos
  nada!\\n\\n12. Logo dixo Esa\u00fa: \u201cAgora emprend\u00e1molo viaxe. Eu irei
  \u00f3 teu lado\u201d. Respondeulle Xacob: 13. \u201cO meu se\u00f1or d\u00e1se
  de conta de que os nenos son febles e que comigo van ovellas e vacas de cria. Se
  os obrigo de m\u00e1is, morrerame nun s\u00f3 d\u00eda o gando todo. 14. Que o meu
  se\u00f1or pase diante do seu servo. Eu seguireino pouco a pouco. (...)\u201d Esa\u00fa
  dixo: 15. \u201cPolo menos deixarei contigo uns poucos dos meus homes\u201d. Respondeulle:
  \u00bfPara que? Ch\u00e9game con saber que conto co favor do meu se\u00f1or\u201d.\\n\\nMellor
  non fiarse, cavilou Xacob, e mentres Esa\u00fa pillou cami\u00f1o da monta\u00f1a
  de Seir, onde estaba o seu pobo de Edom, Xacob cruzou o Xord\u00e1n \u2013estaba
  na Transxordania\u2013 e foi a Xequem, santuario do patriarca Israel; polo tanto,
  centro relixioso da \u201cCasa de Xos\u00e9\u201d (5):\\n\\n18. Desde Padam-Aram,
  Xacob chegou san e salvo a Xequem, no pa\u00eds do Cana\u00e1n. Acampou fronte \u00e1
  cidade (...). 20. Ali constru\u00edu un altar e invocou \u00f3 Deus de Israel (6).\\n\\n1.
  Aqu\u00ed aparece o fillo preferido, sobre o que axi\u00f1a se vai concentrar (c.37)
  a narraci\u00f3n. A Casa de Xos\u00e9 ha ter suma importancia.\\n\\n2. Prosternarse
  unha vez era un sinal de m\u00e1ximo respecto. Face-lo 7 veces soamente o realizaban
  os pequenos reis vasalos perante o Fara\u00f3n, como sabemos polas cartas de El-Amarna.\\n\\n3.
  Non presenta \u00e1s mulleres, sen\u00f3n \u00f3s fillos, que era o que contaba
  na sociedade patriarcal. Resulta urxente unha relectura cr\u00edtica da Biblia desde
  outras claves: as femininas.\\n\\n4. O noso relato procede do documento iavista
  ou fonte J, dos tempos da monarqu\u00eda de Salom\u00f3n. Daquela Israel dominaba
  sobre o seu inimigo Edom, reino m\u00e1is vello, \u201cirm\u00e1n\u201d maior de
  Israel, e do que era \u201cpai\u201d Esa\u00fa. Como sabemos, a inimizade entre
  os israelitas e edomitas (logo chamados idumeos) est\u00e1 na base da lenda do conflicto
  entre os doux \u201cfillos\u201d de Isaac.\\n\\n5. No cap.35 regresaremos, o pr\u00f3ximo
  d\u00eda, a Betel, santuario orixinario de Xacob. Xequem (ou Siqu\u00e9n) era de
  Israel. E no sur, Mambr\u00e9 era de Abraham e Beerxeba de Isaac.\\n\\n6. Para os
  cananeos e outros pobos antigos, un santuario ou un altar significaba o centro do
  universo, simbolizando o embigo do cosmos. O que chaman un \u201ccentro onf\u00e1lico\u201d,
  pois en grego \u201c\u00f3nfalos\u201d significa embigo. Segundo o \u201cmito do
  Centro\u201d, nese punto central (altar ou santuario) xunt\u00e1banse o ceo, a terra
  e mailo inferno ou abismo, e as\u00ed se pasaba do caos desorganizado \u00f3 cosmos
  harm\u00f3nico. Por iso vemos \u00f3s nosos patriarcas erixindo altares e pedras
  a onde chegan. Castelao fixonos saber que tal funci\u00f3n tam\u00e9n a cumplen
  os nosos crucceiros e tam\u00e9n os milladoiros ou moreas de pedras apiladas.\\n\\nCrimes,
  criminais e violencia social\\n\\n\u00c9 cada vez m\u00e1is frecuente ter noticia,
  a trav\u00e9s dos medios de comunicaci\u00f3n, de feitos violentos, noticias que
  nos preocupan, nos asustan e crean en todos n\u00f3s sentimentos de inseguridade.
  Tam\u00e9n \u00e9 habitual que, \u00f3 lado destas informaci\u00f3ns, co\u00f1\u00e9zamos-las
  diferentes receitas que se propo\u00f1en para evita-los feitos violentos; moitas
  veces estas respostas encerran, tam\u00e9n unha boa dose de violencia. Certamente,
  cando un se sit\u00faa dentro da pel da v\u00edtima e dos seus achegados, \u00e9
  dif\u00edcil conter unha resposta agresiva dirixida \\\"\u00f3s violentos\\\".\\n\\nUn
  asunto delicado\\n\\nNon \u00e9 un tema f\u00e1cil o da violencia. F\u00e1lase dunha
  agresividade benigna, que \u00e9 aquela que compartimos cos animais: v\u00e1lenos
  para atacar ou fuxir cando est\u00e1 ameazada a vida, e desaparece \u00f3 mesmo
  tempo c\u00e1 ameaza. F\u00e1lase tam\u00e9n da agresividade maligna, \u00e9 dicir,
  a crueldade e a destructividade, propia da especie humana; non a presentan os animais,
  non a atopamos na natureza, non responde a ameazas e, a\u00ednda que pareza mentira,
  pode causar pracer a quen a executa: \u00e9 a violencia, o atentado directo corporal
  contra as persoas, brutal e doroso.\\n\\n\u00bfQue violencia nos preocupa? Seguramente
  todas, pero a nosa reacci\u00f3n \u00e9 m\u00e1is forte cando se trata de violencia
  individual e non tanto cando se trata da violencia colectiva, a pesar de que \u00e9
  a responsable do maior n\u00famero de v\u00edtimas; pensemos se non na cantidade
  de persoas que sofren a violencia das guerras, da fame, da opresi\u00f3n, etc.,
  abondan os exemplos actuais: Somalia, o conflito iugoslavo, os nenos da Am\u00e9rica
  Latina, os emigrantes clandestinos que ve\u00f1en desde \u00c1frica. Ante esta violencia
  reaccionamos de modo m\u00e1is controlado, m\u00e1is tranquilos, menos agresivos,
  tam\u00e9n m\u00e1is sabedores de que non a podemos controlar.\\n\\nBuscando as
  causas\\n\\nEntre as explicaci\u00f3ns m\u00e1is frecuentes que damos \u00e1 violencia
  individual coido que a m\u00e1is frecuente \u00e9 a de pensar que se trata dun tolo,
  porque soamente os tolos poden levar a cabo actos tan irracionales. Unha pregunta
  indignada aparece a mi\u00fado nos medios de comunicaci\u00f3n: \u00bfComo \u00e9
  posible que estes tolos perigosos anden soltos? Hai que dicir que persoas que traballan
  no mundo da loucura e que estudiaron esa violencia alg\u00fans enfermos mentais,
  fanse estoutra pregunta: \u00bfQue est\u00e1 ocorrendo na sociedade para que os
  comportamentos deses enfermos tendan hoxe en d\u00eda a ser (cando menos en aparenxia)
  m\u00e1is violentos que antes? Con isto non se quere diminu\u00edr nin a gravidade
  da violencia individual, nin sequera o grao de responsabilidade que o individuo,
  enfermo ou san, ten no feito violento. Tr\u00e1tase de dar conta de que a violencia
  social vai aumentando progresivamente nas sociedades occidentais e que, do mesmo
  xeito, aumenta a violencia entre os enfermos mentais.\\n\\nDito isto, coido que
  debemos reflexionar sobre os aspectos com\u00fans entre a violencia social e a individual
  para tratar de entender mellor este fen\u00f3meno e albisca-las posibilidades de
  soluci\u00f3n.\\n\\nDetr\u00e1s de cada crime, un ambiente violento\\n\\nS\u00e1base
  que a criminalidade \u00e9 un problema de grupo, e que todo crime est\u00e1 asociado
  a unha serie de circunstancias.\\n\\nFago menci\u00f3n dos m\u00e1is importantes:
  familias con conflictos, rupturas, con frecuencia familias marxinais, familias violentas
  nas que o modelo de relaci\u00f3n est\u00e1 baseado na agresividade; medios culturais
  nos que se priman os valores da violencia e nos que \u00e9 normal e esperado que
  o individuo se manifieste violentamente; medios sociais nos que se producen cambios
  bruscos, por mor da modernizaci\u00f3n, cambios pol\u00edticos; caracter\u00edsticas
  do ambiente coma o lugar de residencia, a desorganizaci\u00f3n urbana, os barrios
  pobres, a falta de espacio na vivenda, e moi especialmente a carencia de vida de
  relaci\u00f3n vecinal, de comunidade, de ausencia de asociacionismo, a tendencia
  cada d\u00eda maior \u00f3 illamento..., a emigraci\u00f3n que tanto contrib\u00fae
  \u00e1 soledade das persoas que a sofren; factores econ\u00f3micos: a pobreza, que
  \u00e9 un dos aspectos m\u00e1is fortemente vinculados coa violencia, a tal punto,
  que se ten prognosticado o aumento da violencia en correspondencia co aumento previsible
  do \u00edndice de paro para un pa\u00eds determinado.\\n\\nCando analizamos as causas
  dos feitos violentos volven aparecer todos estes factores \u00f3s que se suma, cada
  vez m\u00e1s, a influencia dos medios de comunicaci\u00f3n, que a trav\u00e9s non
  s\u00f3 das noticias sen\u00f3n tam\u00e9n da programaci\u00f3n e mesmo da publicidade,
  transmiten mensaxes e contidos de violencia.\\n\\nTodo este relatorio de factores
  que infl\u00faen nos actos antisociais po\u00f1en de manifesto un fondo de violencia
  colectiva; podemos entrev\u00e9-la relaci\u00f3n entre as d\u00faas formas de violencia,
  a individual e a colectiva, e podemos darnos conta do incomprensibles que son as
  d\u00faas. \u00c9 l\u00f3xico que a sociedade trate de defendese da violencia individual,
  pero seguramente a soluci\u00f3n ter\u00e1 que ver con que nos defendemos tam\u00e9n
  da violencia social, porque todo indica que existe un terreo abonado, especialmente
  abonado, no que a violencia medra.\\n\\nMad\u00f3 Dom\u00ednguez\\n\\n\\\"Os cegos
  ven\\\"\\n\\nCompa\u00f1eira Carmen:\\n\\nEntre as persoas que no autocar de Laba\u00f1ou,
  (A Coru\u00f1a), asistimos \u00e1 XV Romaxe nas Ermitas, (A Lama), atopase a Sra.
  Celsa \\\"A Cega\\\", cega fisicamente, mais dotada dunha marabillosa luz espiritual
  e unha garimosa sensibilidade, humana e relixiosa. Falsose no autocar dos contidos
  da Romaxe. A Sra. Celsa pediu, se era doado, que fixese chega-lo seu personal agradecemento
  a cantos traballaron por facer realidade esta celebraci\u00f3n, (realmente atop\u00e1base
  emocionada).\\n\\nManifestou vir fortalecida de esp\u00edrito gratificante.\\n\\nCarmen,
  se vos parece ben a publicaci\u00f3n desta carta en Irimia, ser\u00eda a mellor
  forma, penso eu, de chegase o agradecemento da Sra. Celsa a cantos traballaron a
  prol da Romaxe. Por suposto, sum\u00e1monos t\u00f3dolos de Laba\u00f1ou, e engadir
  que os p\u00edcaros que asistiron, m\u00e1is dunha ducia, corearon no autocar parrafadas
  en favor da Romaxe. Tam\u00e9n se produciu un forte aplauso de t\u00f3dolos excursionistas
  para os organizadores.\\n\\nUnha apreta\\n\\nAnuncio Moro\u00f1o\\n\\nEzkarrikazko,
  gracias en vasco\\n\\nHola amigos: Os envio ya mi subscripci\u00f3n a \\\"IRIMIA\\\"
  para el 92-93. Lo hago as\u00ed de r\u00e1pido, por si la peseta SE DEVAL\u00daA
  m\u00e1s y lo hago con subscrpci\u00f3n de APOYO porque me gusta la REVISTA... y
  adem\u00e1s por otra cosa: QUIERO QUE ME ENVIEIS \u2014a reembolso claro est\u00e1\u2014
  el nuevo libro de MANUEL REGAL: \\\"CO EVANXEO POLA MAN\\\"\u2014 CICLO \\\"A\\\"
  y el \\\"B\\\" y el \\\"C\\\" \u00bftambi\u00e9n? Recurro a vosotros, porque no
  s\u00e9 las se\u00f1as de la editorial \\\"SEPT\\\".\\n\\nY \u00bfqu\u00e9 pasa
  con el \u00faltimo n\u00famero de: \\\"HISTORIA DO POBO DE XES\u00daS\\\" DE XOS\u00c9
  CHAO: el VII: \u00bfQUEN DICIDES QUE SON EU?\u2014 \u00bfHa salido ya?. Pues tengo
  todos sus anteriores.\\n\\nSi ha salido, me lo mandais tambi\u00e9n.\\n\\nY nada
  m\u00e1s. Ezkarrikazko y que el Coru\u00f1a gane a nuestra Real y siga primero.
  Aqu\u00ed no esperamos eso. AGUR,\\n\\nJuantxo Arrizabalaga\\n\\nSobre a lei do
  aborto\\n\\nHola \u00bfComo vos vai por eses lares? Agardo que ben. Hoxe decidime
  a escribir unha opini\u00f3n dun tema que te\u00f1o como importante, e da que agardo
  tam\u00e9n eco na vosa revista.\\n\\nOs que nos caracterizamos polo noso absoluto
  desprezo \u00f3 poder sobre a xente, preferimos non entrar en cuesti\u00f3ns de
  conciencia, e que cadaqu\u00e9n coide os seus eidos, traballo dabondo. Se quere
  axudar \u00f3 veci\u00f1o, sexa benvido; se o que quere \u00e9 mandar sobre o \u00a1ollo
  \u00f3 piollo!\\n\\nNon son muller, se o fose coido que non abortar\u00eda; de t\u00f3dolos
  xeitos non me considero con dereito a prohibilo; e moito menos de usar un poder
  que non \u00e9 meu, sen\u00f3n da xente, para prima-la mi\u00f1a opini\u00f3n sobre
  a dos demais. Sobran brillantes ide\u00f3logos e faltan mans para axudar e convivir,
  non convencer.\\n\\nRexeito a idea daqueles que coa imposici\u00f3n das s\u00faas
  brillantes iniciativas queren decir \u00f3s demais o que deben facer.\\n\\nSe as\u00ed
  pode ser gracias. Recordos, e agardo vertos alg\u00fan d\u00eda, pois te\u00f1o
  a idea de tentar axudarvos no que po\u00edda. A outra vez que vos escrib\u00edn
  fiquei abraiado de ver publicada a carta de agradecemento, non o agardaba. Gracias.\\n\\nPedro
  Pedrouzo\\n\\n\u00a1Apareceu o av\u00f3!\\n\\nEstimados amigos:\\n\\nAcabo de recibir
  a IRIMIA n\u00ba 393 coa que recib\u00edn a agradable sorpresa de que na p\u00e1xina
  15 a foto de \\\"Esta criaturi\u00f1a non anda perdida\\\" resultou ser da mi\u00f1a
  neta.\\n\\nComo os av\u00f3s andamos tolos e ademais a foto saiu preciosa, gustar\u00edame
  ter unha copia da mesma, raz\u00f3n pola que me po\u00f1o en contacto con v\u00f3s
  para ver se iso \u00e9 posible.\\n\\nTam\u00e9n estou interesado en que me mandes
  dous exemplares do citado n\u00ba 393.\\n\\nPor supuesto que os gastos de todo isto
  e mailo custo, correr\u00e1n pola mi\u00f1a conta e fareivos un xiro postal.\\n\\nEn
  canto a subscrpci\u00f3n, eu penso que actualmente estou pagando a de 3.000 pts.;
  non encontrei o recibo para confirmalo; caso de que non sexa as\u00ed, cando me
  fagades a renovaci\u00f3n, fac\u00e9deo por ese importe.\\n\\nSen m\u00e1is, moitas
  graci\u00f1as polo interesante labor que estades facendo, moitos \u00e1nimos para
  seguir loitando e unha forte apreita,\\n\\nXos\u00e9 Lu\u00eds Serantes\\n\\nLingua
  e tradici\u00f3ns (1)\\n\\nVaiche na misa en Conxo\\n\\nHai tradici\u00f3ns tan
  arraizadas na memoria colectiva que tam\u00e9n deron orixe a expresi\u00f3ns proverbiais.\\n\\nContan
  os picheleiros de Santiago que o arcebispo, hai disto centos de anos, prendouse
  dunha moza e que dela conseguiu o que un sacerdote non debe conseguir. E que os
  irm\u00e1ns decidiron vingarse e que llas gardaron, para cando o atopasen descoidado.
  E en plena procesi\u00f3n do Corpus bot\u00e1ronse enriba del e al\u00ed o deixaron
  morto. Chegou a noticia \u00f3 papa de Roma e decretou o interdicto, que consiste
  en que se pechan t\u00f3dalas igrexas e a xente ten que ir a lonxe en busca de misa
  e sacramentos. Algo as\u00ed como un peche patronal eclesi\u00e1stico. Daquela era
  unha pena severa, porque por non ir \u00e1 misa pod\u00edan po\u00f1er multa.\\n\\nConxo
  daquela a\u00ednda non era Santiago e as\u00ed era a igrexa aberta que ca\u00eda
  m\u00e1is preto. As\u00ed que a Conxo ti\u00f1an que ir os santiagueses \u00e1 misa.
  Entre ir, o\u00ed-la misa, parolar no adro e volver, bot\u00e1base a ma\u00f1\u00e1
  enteira. E naceu o dito de Vaiche na misa en Conxo coma resposta para cando preguntan
  por algu\u00e9m que non est\u00e1 e inda vai tardar.\\n\\nOs santiagueses incluso
  din que a tal morte aconteceu nunha r\u00faa que o papa mandou pechar para sempre,
  a r\u00faa da Balconada, unha r\u00faa que deb\u00eda correr entre a r\u00faa do
  Vilar e a r\u00faa Nova. E mesmo cantan unha cantiga que di\\n\\nPreti\u00f1o da
  r\u00faa Nova,\\nna r\u00faa da Balconada,\\nmataron o arcebispo\\npor celos dunha
  madama.\\n\\nOs documentos falan de que un arcebispo morreu asasinado. Mat\u00e1rono
  os Churruchaos o 29.7.1336. Pero parece certo que nin era por mal de amores nin
  o Corpus cadra tan tarde.\\n\\nPero o dito que quedou para sempre. Por moitos lugares
  de Galicia dise Vaiche na misa para dicir que algu\u00e9m non est\u00e1 e vai tardar.
  Pero en Caz\u00e1s (Vilalba) significa \u201cxa fai moito tempo que foi iso\u201d.
  E en Salceda e Tui, segundo me contou Manuel Coto Rodr\u00edguez, din Vaiche na
  misa e logo v\u00e9n co valor de \u201cnon che creo nada do que me dis\u201d.\\n\\nO
  CANTAR DO IRIMEGO\\n\\n1. Do boneco Pelegr\u00edn seica moitos est\u00e1n fartos.
  \u00bfPor que aqu\u00ed o po\u00f1emos? \u00a1Que queredes, dannos cartos!\\n\\n2.
  Porque a revista o hospede ningu\u00e9n por iso se empe\u00f1e en que fac\u00e9mo-lo
  xogo a don V\u00e1zquez Portome\u00f1e.\\n\\n3. Nin queremos aqu\u00ed entrar no
  asunto das lideiras que se traen entre si don Portome\u00f1e e o Beiras.\\n\\n4.
  Por iso tampouco \u00e9 certo e ningu\u00e9n o ten pedido que anosemos \u00f3 poder
  est\u00f3mago agradecido.\\n\\n5. O que pasa \u00e9 que pensamos que resulta menos
  mal inclu\u00ed-la propaganda que \u00e9 institucional. (Mellor c\u00e1 do Capital).\\n\\n6.
  Non \u00e9 di\u00f1eiro da Xunta e menos do Conselleiro; son cartos que pr\u00e1
  cultura desembolsa o pobo enteiro.\\n\\n7. Por outra parte, a cr\u00edtica ha ser
  xusta, e eu creo que non todo ha ser malo no asunto do Xacobeo.\\n\\n8. Certo \u00e9
  que o tal don V\u00edctor victorioso, \u00e9 acusado de estar deixando o Cami\u00f1o
  de Santiago escarallado.\\n\\n9. Pero en conxunto, parece que o Xacobeo a Galicia
  \u00a1mediante un gran despilfarro! conv\u00e9rtea en noticia.\\n\\nPoucos anos
  despois da conquista de M\u00e9xico co\u00f1\u00e9cese o relato da aparici\u00f3n
  da Virxe \u00f3 \u00edndio Juan Diego. T\u00f3dalas caracter\u00edsticas da narraci\u00f3n
  presentan unha Virxe india, algo impensable daquela no ambiente do colonialismo
  espa\u00f1ol e contra as resistencias da xerarqu\u00eda eclesi\u00e1stica, tam\u00e9n
  hispana. Desde aquela, Guadalupe pasa a ser un s\u00edmbolo de liberaci\u00f3n ind\u00edxena.
  Hoxe os cristi\u00e1ns de Latinoam\u00e9rica \u2013tam\u00e9n a Teolox\u00eda da
  Liberaci\u00f3n\u2013 te\u00f1en \u00e1 Virxe de Guadalupe coma o m\u00e1ximo expo\u00f1ente
  hist\u00f3rico do que pudo ser, e acaso non foi de todo, a evanxelizaci\u00f3n de
  Am\u00e9rica desde as claves da cultura amerindia. Un gran desaf\u00edo, este de
  Guadalupe, para os bispos e o Papa que se acaban de reunir, en Santo Domingo, en
  IV Conferencia Latinoamericana e nun momento de crise.\\n\\nTel\u00e9fono Oficina
  Informaci\u00f3n Xacobea: 902-1993-00\"", "\"Os dous xefes de filas do Club Ciclista
