  DE AER RELATIVO A VAROS ASUNTOS. (Rex. Entrada 24.10.2017, 2017-E-RPLN-6).\\n\\nPLENO
  26 OUTUBRO  DE 2017. ACTA 012/2017\\n\\n3) Sobre tubos campo de San Pedro (Cesantes)\\n\\nO
  pasado 19 de xu\u00f1o un grupo de veci\u00f1os de Cesantes presentaron rexistro
  (2017-E-RC-9050) no que solicitaban informaci\u00f3n sobre uns tubos grandes de
  poli\u00e9ster que se deixaran no antigo campo de San Pedro en Cesantes. Nese rexistro
  preguntaban polos permisos dese dep\u00f3sito e solicitaban a s\u00faa retirada.
  Como non se lles contestou, a nosa Agrupaci\u00f3n presentou un rexisto o 2 de outubro
  no que pregunt\u00e1bamos polos tr\u00e1mites feitos polo Concello para quitar esas
  tubaxes e que trasladaran esa resposta \u00e1 veci\u00f1anza que presentara a instancia.
  Ao pouco tempo recibimos chamada do Concelleiro Jes\u00fas Crespo onde se nos dixo
  de palabra que a asociaci\u00f3n responsable dese vertido \u00eda ter unha asemblea
  inminente onde aprobar\u00edan retirar eses tubos. Pasou o tempo e vendo que estamos
  a finais de outubro e o vertido a\u00ednda est\u00e1 no mesmo sitio, vendo dende
  o goberno local seguen sen contestar \u00e1 veci\u00f1anza e vendo que seguen sen
  darnos unha resposta oficial,\\n\\nPreguntamos no pleno: Que tr\u00e1mites e xesti\u00f3ns
  ten levado a cabo ou vai realizar para a retirada deses tubos dese emprazamento?\\n\\nsr.
  Crespo: o 2 de outubro presentastes un escrito e fixen unha chamada este mesmo d\u00eda
  ao Conselleiro para darvos unha resposta. Son flotadores de batea, non son un verquido.
  Naquel terreo moitos veci\u00f1os deixan pedras para facer muros, non sabedes como
  funcionan as comisi\u00f3ns de festas. Isto o fixeron con boa intenci\u00f3n de
  depositar eses flotadores de batea para retiralos. Ti\u00f1an un problema gordo
  e ti\u00f1an que tomar unha decisi\u00f3n. \u00bfVos dirixistes nalg\u00fan momento
  \u00e1 Comisi\u00f3n de Festas?\\n\\nTiven varias reuni\u00f3ns coa Comisi\u00f3n
  de Festas, os t\u00e9cnicos de medio ambiente f\u00f3rono visitar e non dixeron
  que fora t\u00f3xico. O retirar\u00e1n estes d\u00edas tan pronto poidan.\"", "\"Artes
