  dorsais entregaranse \u00f3 delegado de cada club. Os atletas das carreiras deber\u00e1n
  confirmar en secretaria a sua participaci\u00f3n ata 45 min antes da sua proba,\\n\\n4-
  PREMIOS\\n\\nMEDALLAS PARA OS TRES PRIMEIROS CALSIFICADOS DE CADA PROBA\"", "\"GALEGO
  SEN FRONTEIRAS\\n\\nXXXII Edici\u00f3n dos Cursos de lingua e cultura galegas 2-24
  de xullo de 2019\\n\\nCursos de ver\u00e1n de lingua e cultura galegas destinados
  a persoas de f\u00f3ra de Galicia\\n\\nINTRODUCI\u00d3N \u00c1 HISTORIA E \u00c1
  GRAM\u00c1TICA HIST\u00d3RICA DA LINGUA GALEGA (Nivel superior)\\n\\nRam\u00f3n
  Mari\u00f1o Paz Universidade de Santiago de Compostela email@example.com.\\n\\nOBXECTIVOS\\n\\n-
  Pret\u00e9ndese que os alumnos reciban unha informaci\u00f3n elemental sobre as
  diferentes etapas da historia da lingua galega e que saiban inserir nelas algunhas
  das s\u00faas mudanzas ling\u00fc\u00edsticas m\u00e1is significativas.\\n\\nCONTIDOS\\n\\n-
  1. Procesos de ling\u00fcificaci\u00f3n e de dialectalizaci\u00f3n das variedades
  ling\u00fc\u00edsticas. Aplicaci\u00f3n \u00e1 periodizaci\u00f3n da historia da
  lingua galega.\\n- 2. Formaci\u00f3n da lingua galega: latinizaci\u00f3n, substratos
  e superestratos (s\u00e9cs. II a. C. \u2013 VIII d. C.)\\n- 3. Emerxencia e declive
  do idioma galego durante a Idade Media (s\u00e9cs. IX-XV)\\n- 4. A dialectalizaci\u00f3n
  da lingua galega (s\u00e9cs. XVI-XVIII)\\n- 5. A reemerxencia contempor\u00e1nea
  (s\u00e9cs. XIX-XXI)\\n\\nBIBLIOGRAF\u00cdA B\u00c1SICA\\n\\nCastro, Ivo (2006):
  Introdu\u00e7\u00e3o \u00e0 Hist\u00f3ria do Portugu\u00eas. Segunda edi\u00e7\u00e3o
  revista e muito ampliada. Lisboa: Edi\u00e7\u00f5es Colibri.\\n\\nMari\u00f1o Paz,
  Ram\u00f3n (1998): Historia da lingua galega. Santiago de Compostela: Sotelo Blanco.\\n\\nMari\u00f1o
  Paz, Ram\u00f3n (2008): Historia de la lengua gallega. M\u00fcnchen: Lincom.\\n\\nM[ari\u00f1o]
  P[az], Ram\u00f3n / Xavier V[arela] B[arreiro] (2000): \\\"Historia da lingua galega\\\",
  in Ap\u00e9ndice da Gran Enciclopedia Gallega, tomo XXXIV, pp. 213-238.\\n\\nMonteagudo,
  Henrique (1999): Historia social da lingua galega. Vigo: Galaxia.\\n\\nAVALIACI\u00d3N\\n\\nNeste
  seminario combinaranse as exposici\u00f3ns te\u00f3ricas coa lectura e o comentario
  (socio)ling\u00fc\u00edstico de textos de distintas \u00e9pocas.\\n\\nGALEGO SEN
  FRONTEIRAS\\n\\nXXXII Edici\u00f3n dos Cursos de lingua e cultura galegas 2-24 de
  xullo de 2019\\n\\nO d\u00eda 15 de xullo os alumnos enviar\u00e1n ao enderezo electr\u00f3nico
  do profesor unha breve composici\u00f3n en que fagan unha presentaci\u00f3n sumaria
  da historia da lingua galega. O exercicio deber\u00e1 ter entre 6.000 e 7.000 caracteres
  (espazos en branco inclu\u00eddos). Valorarase especialmente a correcci\u00f3n da
  presentaci\u00f3n formal e da expresi\u00f3n escrita, as\u00ed como o esforzo por
  completar os co\u00f1ecementos transmitidos na aula coa lectura das obras da bibliograf\u00eda
  recomendada.\\n\\nPara a avaliaci\u00f3n final teranse en conta a cualificaci\u00f3n
  da composici\u00f3n entregada e o grao de participaci\u00f3n activa nas clases.\"",
  "\"CARRERA BLANCO, PABLO\\n\\nData de nacemento: 18/06/1981\\n\\nCategor\u00eda:\\n\\nVETER\u00c1NS
  35\\n\\nClube:\\n\\nC.A.CARNICAS SERRANO\\n\\nAdestrador:\\n\\nRUTA - Mellores marcas
  da tempada\\n\\n34.31\\n\\nInterunning 10 Km. de Porri\u00f1o\\n\\n12/03/2017\\n\\n10
  Km. Ruta\\n\\nCURRICULUM DO ATLETA\\n\\nFederaci\u00f3n Galega Atletismo\\n\\nwww.atletismo.gal\"",
  "\"a) Solicitude segundo o modelo normalizado do anexo III desta resoluci\u00f3n.\\n\\nb)
  Fotocopia do pasaporte espa\u00f1ol ou documento nacional de identidade en vigor
  do solicitante. Certificaci\u00f3n consular do solicitante, para acreditar a nacionalidade
  espa\u00f1ola e a inscrici\u00f3n no Rexistro de Matr\u00edcula como residente,
  se estes extremos non quedan debidamente acreditados polo pasaporte ou documento
  nacional de identidade.\\n\\nc) Documentaci\u00f3n acreditativa da \u00faltima veci\u00f1anza
  administrativa en Galicia ou de ser natural de Galicia, no caso de residir en Espa\u00f1a.\\n\\nd)
  Documentaci\u00f3n acreditativa da residencia noutra comunidade aut\u00f3noma ou
  nun pa\u00eds europeo.\\n\\ne) Fotocopias da declaraci\u00f3n da renda correspondente
  ao ano 2005. Se o solicitante reside noutro pa\u00eds presentar\u00e1 documentaci\u00f3n
  equivalente.\\n\\nf) Certificado m\u00e9dico, segundo o modelo inclu\u00eddo no
  anexo III desta resoluci\u00f3n, conforme as condici\u00f3ns imprescindibles establecidas
  no punto 1.5 da base primeira.\\n\\ng) Fotograf\u00eda actual tama\u00f1o carn\u00e9.\\n\\nh)
  Libro de familia, se procede. No seu defecto, achegarase documentaci\u00f3n xustificativa
  do matrimonio, da uni\u00f3n de feito ou relaci\u00f3n an\u00e1loga e do nacemento
  do resto de membros da unidade econ\u00f3mica familiar.\\n\\ni) Declaraci\u00f3n
  de axudas solicitadas ou concedidas por outras administraci\u00f3ns para a mesma
  actividade.\\n\\n2. O c\u00f3nxuxe ou persoa unida ao solicitante por uni\u00f3n
  de feito ou relaci\u00f3n an\u00e1loga, de ser o caso, deber\u00e1 presentar a seguinte
  documentaci\u00f3n:\\n\\na) Fotocopia do pasaporte ou documento nacional de identidade
  en vigor.\\n\\nb) Documentaci\u00f3n acreditativa da residencia noutra comunidade
  aut\u00f3noma ou nun pa\u00eds europeo.\\n\\nc) Fotocopia da declaraci\u00f3n da
  renda correspondente ao ano 2005 ou documentaci\u00f3n equivalente.\\n\\nd) Certificado
  m\u00e9dico, segundo o modelo inclu\u00eddo no anexo III desta resoluci\u00f3n.\\n\\ne)
  Fotograf\u00eda actual tama\u00f1o carn\u00e9.\\n\\nf) Declaraci\u00f3n de axudas
  solicitadas ou concedidas por outras administraci\u00f3ns para a mesma actividade.\\n\\nBase
  quinta: criterios de selecci\u00f3n.\\n\\nOs criterios de selecci\u00f3n para ser
  beneficiario ser\u00e1n os que se sinalan a continuaci\u00f3n:\\n\\n1. Estimarase
  como criterio preferente de selecci\u00f3n non ter participado en anteriores edici\u00f3ns
  deste programa.\\n\\n2. Estimarase como segundo criterio de selecci\u00f3n a maior
  idade do solicitante.\\n\\n3. A selecci\u00f3n dunha persoa levar\u00e1 aparellada
  a da persoa unida a el por matrimonio, uni\u00f3n de feito ou relaci\u00f3n an\u00e1loga,
  sempre que re\u00fana os requisitos establecidos no punto 2 da base primeira.\\n\\nSantiago
  de Compostela, 29 de maio de 2007.\\n\\nManuel Lu\u00eds Rodr\u00edguez Gonz\u00e1lez\\nSecretario
  xeral de Emigraci\u00f3n\\n\\nCONSELLER\u00cdA DE INNOVACI\u00d3N E INDUSTRIA\\n\\nInstruci\u00f3n
  4/2007, do 7 de maio, de interpretaci\u00f3n e aplicaci\u00f3n de determinados preceptos
  do Real decreto 842/2002, do 2 de agosto, polo que se aproba o Regulamento electrot\u00e9cnico
  para baixa tensi\u00f3n.\\n\\nO Real decreto 842/2002, do 2 de agosto, polo que
  se aproba o Regulamento electrot\u00e9cnico para baixa tensi\u00f3n (REBT) e as
  s\u00faas instruci\u00f3ns t\u00e9cnicas complementarias (ITC) pr\u00e9stanse en
  ocasi\u00f3ns a diferenzas de interpretaci\u00f3n no momento da s\u00faa aplicaci\u00f3n.\\n\\nA
  Direcci\u00f3n Xeral de Industria v\u00e9n mantendo diversas reuni\u00f3ns cos representantes
  das asociaci\u00f3ns profesionais de empresas instaladoras e cos t\u00e9cnicos que
  tramitan estas instalaci\u00f3ns nas delegaci\u00f3n provinciais coa finalidade
  de aplicar as anteditas normas de maneira uniforme en toda a comunidade aut\u00f3noma.\\n\\nPor
  todo iso, e co obxecto de recoller os acordos acadados nas referidas reuni\u00f3ns,
  dif\u00edase esta instruci\u00f3n, que \u00e9 de aplicaci\u00f3n na tramitaci\u00f3n
  dos procedementos relacionados co REBT, e que complementa e clarifica as ditadas
  con anterioridade nesta materia.\\n\\n1. C\u00f3mputo da \u00e1rea en locais de
  concorrencia p\u00fablica.\\n\\nPara determinar a \u00e1rea dun local de concorrencia
  p\u00fablica para efectos do establecido na ITC-BT-28 do R.B.T. deben descontarse,
  ademais das superficies indicadas expresamente no punto 1 da ITC-BT-28 do R.B.T.,
  as \u00e1reas destinadas a almac\u00e9n e escaparates, pero polo contrario non se
  deben restar as \u00e1reas ocupadas polos mobles.\\n\\n2. Documentaci\u00f3n para
  rexistrar as instalaci\u00f3ns.\\n\\nNa tramitaci\u00f3n das instalaci\u00f3ns de
  baixa tensi\u00f3n, tanto no caso en que esta precise memoria t\u00e9cnica de dese\u00f1o
  (MTD) deber\u00e1n presentarse os documentos que se indican no impreso oficial publicado
  no anexo I-a da Orde do 2 de febreiro de 2005 pola que se modifican os modelos de
  impresos relativos ao rexistro e posta en servizo das instalaci\u00f3ns el\u00e9ctricas
  de baixa tensi\u00f3n, no \u00e1mbito da Comunidade Aut\u00f3noma de Galicia (DOG
  n\u00ba 43, do 3 de marzo).\\n\\n3. Esbozo de trazado.\\n\\nO esbozo de trazado
  a que se refire o artigo 19 do R.B.T. e o n\u00famero 2 da ITC-BT-04 consistir\u00e1
  en, polo\\n\\nmenos, un debuxo en planta das conduci\u00f3ns el\u00e9ctricas complementado
  con indicaci\u00f3ns sobre a altura pola que pasan. En todo caso deber\u00e1 terse
  en conta que:\\n\\na) No caso de instalaci\u00f3ns con proxecto, os planos correspondentes
  ao esbozo de trazado deber\u00e1 estar rotulado especificamente como esbozo de trazado.
  Ademais, formar\u00e1n parte do anexo de informaci\u00f3n ao usuario a que fai referencia
  o artigo 19 do R.B.T.\\n\\nb) No caso de instalaci\u00f3ns con MTD, esta deber\u00e1
  presentar o formato establecido no anexo Ib da antedita Orde do 2 de febreiro de
  2005\\n\\n4. Comunicaci\u00f3n de inicio de actividade noutra provincia da Comunidade
  Aut\u00f3noma galega.\\n\\nO artigo 12 da Orde do 27 de decembro de 2000, pola que
  se establece o procedemento unificado para a obtenci\u00f3n de carn\u00e9s profesionais
  e exixencias a empresas autorizadas para instalaci\u00f3n, mantemento, e outras
  actividades en materia de seguranza industrial establece no seu segundo par\u00e1grafo
  que para exercer a actividade noutra provincia distinta \u00e1 de inscrici\u00f3n,
  as empresas autorizadas na Comunidade Aut\u00f3noma de Galicia deber\u00e1n comunicarlo
  \u00e1 delegaci\u00f3n provincial correspondente onde se te\u00f1a previsto realizar
  a actividade.\\n\\nA documentaci\u00f3n que debe presentar a empresa para o cumprimento
  deste tr\u00e1mite limitarase exclusivamente \u00e1 referida comunicaci\u00f3n,
  podendo ter tal efecto a presentaci\u00f3n de copia do certificado de instalador
  autorizado en baixa tensi\u00f3n (DCE). En ning\u00fan caso se cobrar\u00e1 ningunha
  taxa por recibir esta comunicaci\u00f3n.\\n\\n5. Validez dos cadros de obra sen
  marcaci\u00f3n CE.\\n\\nOs cadros el\u00e9ctricos de baixa tensi\u00f3n de obras
  deben cumprir cos requirimentos establecidos no regulamento para baixa tensi\u00f3n
  e, en especial, co establecido na ITC-33, instalaci\u00f3ns con fins especiais.
  Instalaci\u00f3ns provisionais e temporais de obra.\\n\\nConforme o establecido
  no n\u00famero 5.1 da ITC-BT-33, o responsable da conformidade dun cadro de obras,
  entre os cales pode figurar un instalador autorizado, deber\u00e1 acreditar, mediante
  a presentaci\u00f3n do certificado do laboratorio homologado, a realizaci\u00f3n
  das probas precisas para o cumprimento das prescrici\u00f3ns da norma UNE 60.439-4.\\n\\n6.
  Garaxes. Uso de tubos met\u00e1licos.\\n\\nSegundo o establecido no n\u00famero
  4 da ITC-BT29, a clasificaci\u00f3n dos garaxes ser\u00e1 levada a cabo por un t\u00e9cnico
  competente, que xustificar\u00e1 os criterios e procedementos aplicados. A responsabilidade
  de establecer se o risco de explosi\u00f3n do garaxe \u00e9 suficientemente baixo
  como para non ter que ser considerado como perigoso de clase I recae, por tanto,
  no proxectista.\\n\\nCando este xustifique que non existe o correspondente risco,
  debe ser considerado como axeitado \u00e1s ditas instalaci\u00f3ns, ademais do tubo
  met\u00e1lico, o tubo blindado conforme o establecido na t\u00e1boa 3 do n\u00famero
  9.3 da referida ITC.\\n\\n7. Taxas.\\n\\na) A ITC-BT-01, na s\u00faa definici\u00f3n
  109 indica que se entender\u00e1 por potencia prevista ou instalada a potencia m\u00e1xima
  capaz de subministrar unha instalaci\u00f3n aos equipamentos e aparellos conectados
  a ela. Para o rexistro de instalaci\u00f3ns el\u00e9ctricas receptoras debe aplicarse
  a taxa 32.19.00, cuxo importe ser\u00e1 o resultado de efectuar o seguinte c\u00e1lculo:\\n\\nImporte
  en euros= 20+0,6* (potencia en kW).\\n\\nEntendendo por potencia en kW a m\u00e1xima,
  isto \u00e9 aquela a que se refire a antedita definici\u00f3n 109 da ITC-BT-01.
  Non \u00e9 correcto, por tanto, calcular o importe da taxa usando o dato da potencia
  contratada que non \u00e9 unha caracter\u00edstica intr\u00ednseca da instalaci\u00f3n.
  No entanto, isto non impide que no caso de instalaci\u00f3ns el\u00e9ctricas de
  edificios, o c\u00e1lculo da taxa deba facerse tendo en conta o coeficiente de simultaneidade
  das distintas vivendas, polo que se aplicar\u00e1 sobre un valor inferior ao da
  suma das potencias de cada vivenda.\\n\\nb) Por outra banda, tendo en conta que
  a potencia da instalaci\u00f3n v\u00e9n determinada polo t\u00e9rmico principal,
  x\u00fantase como anexo I a t\u00e1boa dos importes resultantes para as distintas
  instalaci\u00f3ns individuais.\\n\\n8. Seguro de responsabilidade civil.\\n\\nO
  n\u00famero 5 da ITC-BT-03 establece, entre outros, como requisito para obter a
  autorizaci\u00f3n de instalador en baixa tensi\u00f3n, a acreditaci\u00f3n ante
  a comunidade aut\u00f3noma de ter subscrito seguro de responsabilidade civil que
  cubra todos os riscos que poidan derivar das s\u00faas actuaci\u00f3ns, mediante
  p\u00f3liza por unha cont\u00eda m\u00ednima de 600.000 euros para a categor\u00eda
  b\u00e1sica e de 900.000 euros para a categor\u00eda especialista, cantidade que
  se actualizar\u00e1 anualmente segundo a variaci\u00f3n do \u00edndice de prezos
  de consumo, certificada polo Instituto Nacional de Estat\u00edstica.\\n\\nAs ditas
  cont\u00edas deben entenderse como que cobren en todo momento os danos ocasionados
  independentemente dos sinistros que se produciren. O importe actualizado das ditas
  coberturas son os que figuran na t\u00e1boa do anexo II.\\n\\n9. Canles protectoras
  en derivaci\u00f3ns individuais.\\n\\nEn relaci\u00f3n co uso de canles protectoras
  nas execuci\u00f3n de derivaci\u00f3ns individuais c\u00f3mproe sinalar que o uso
  das ditas canles se encontra regulado na ITC-BT-15, que, no seu punto primeiro,
  establece que as derivaci\u00f3ns individuais poder\u00e1n estar constitu\u00eddas,
  entre outras, por conductores illados no interior de canles protectoras cuxa tapa
  s\u00f3 po\u00edda ser aberta coa axuda dun \u00fatil. No punto segundo faise, as\u00ed
  mesmo, referencia \u00e1 secci\u00f3n das canles e ao caso en que se realicen agrupaci\u00f3ns
  de derivaci\u00f3ns nunha mesma canle. O regulamento acepta como v\u00e1lidas as
  derivaci\u00f3ns individuais realizadas con canles protectoras a\u00ednda que no
  momento da entrada en vigor das\"", "\"enerx\u00eda, industria e construci\u00f3n\\n\\n1.
  Consumo de gasolinas, gas\u00f3leos e fuel\u00f3leos. Ano 2009\\n2. Produci\u00f3n
  de enerx\u00eda el\u00e9ctrica. Ano 2008\\n3. Distribuci\u00f3n de enerx\u00eda
  el\u00e9ctrica por sectores de uso. Ano 2008\\n4. Enerx\u00eda el\u00e9ctrica distribu\u00edda
  nas actividades industriais. Ano 2008\\n5. Enerx\u00edas renovables. N\u00famero
  de instalaci\u00f3ns e potencia el\u00e9ctrica instalada. Ano 2008\\n6. Industrias
  mineiras: resumo global. Ano 2007\\n7. Industrias mineiras: produtos enerx\u00e9ticos.
  Ano 2007\\n8. Industrias mineiras: minerais industriais. Ano 2007\\n9. Industrias
  mineiras: produtos de canteira. Ano 2007\\n10. Industrias mineiras: produtos de
  canteira (rocas ornamentais). Ano 2007\\n11. Industrias mineiras: n\u00famero de
  explotaci\u00f3ns e persoal ocupado por intervalos de emprego. Ano 2007\\n12. Produtos
  enerx\u00e9ticos: n\u00famero de explotaci\u00f3ns e persoal ocupado por intervalos
  de emprego. Ano 2007\\n13. Minerais industriais: n\u00famero de explotaci\u00f3ns
  e persoal ocupado por intervalos de emprego. Ano 2007\\n14. Produtos de canteira:
  n\u00famero de explotaci\u00f3ns e persoal ocupado por intervalos de emprego. Ano
  2007\\n15. Produtos de canteira (rocas ornamentais): n\u00famero de explotaci\u00f3ns
  e persoal ocupado por intervalos de emprego. Ano 2007\\n16. Industria da construci\u00f3n
  naval: demanda de barcos\\n17. Construci\u00f3n de vivendas libres e protexidas.
  Ano 2009\\n18. Prezo da vivenda libre e protexida. Base 2005. Ano 2009\\n19. Licitaci\u00f3n
  oficial. Ano 2009\\n20. Enquisa industrial de empresas. Variables por agrupaci\u00f3ns
  de actividade I. CNAE-09. Ano 2008\\n21. Enquisa industrial de empresas. Variables
  por agrupaci\u00f3ns de actividade II. CNAE-09. Ano 2008\\n22. Enquisa industrial
  de produtos. Produci\u00f3n industrial que se pode comercializar por agrupaci\u00f3ns
  de actividade. CNAE-09\\n\\nVivendas\\n\\nVivendas protexidas\\n\\nIncl\u00faense
  as vivendas protexidas suxeitas a distintos r\u00e9ximes de protecci\u00f3n e vivendas
  de promoci\u00f3n p\u00fablica.\\n\\nVivendas libres\\n\\nEst\u00e1n controladas
  pola Administraci\u00f3n local e corresp\u00f3ndelle \u00e1 comunidade aut\u00f3noma
  dar as c\u00e9dulas de habitabilidade. Hai unha supervisi\u00f3n t\u00e9cnica por
  parte dos profesionais.\\n\\nEmpresas e produtos industriais\\n\\nEmpresa industrial\\n\\nEnt\u00e9ndese
  por empresa toda unidade xur\u00eddica que constit\u00fae unha unidade organizativa
  de produci\u00f3n de bens e servizos e que goza dunha certa autonom\u00eda de decisi\u00f3n,
  principalmente \u00e1 hora de empregar os recursos correntes de que disp\u00f3n.
  A empresa pode exercer unha ou m\u00e1is actividades nun ou varios lugares. Consid\u00e9rase
  que unha empresa \u00e9 industrial se a s\u00faa actividade principal est\u00e1
  inclu\u00edda dentro das secci\u00f3ns B a E da CNAE-09.\\n\\nEstablecemento\\n\\nToda
  empresa ou parte dunha empresa, situada nun lugar xeograficamente delimitado (taller,
  f\u00e1brica, etc.), na que se realizan actividades econ\u00f3micas \u00e1s que
  dedican o seu traballo unha ou varias persoas por conta dunha mesma empresa. Un
  establecemento consid\u00e9rase industrial se a s\u00faa actividade principal \u00e9
  industrial.\\n\\nPersoas ocupadas\\n\\nEnt\u00e9ndese por persoas ocupadas o conxunto
  de persoas fixas e eventuais que no ano de referencia dos datos, estaban exercendo
  un labor, remunerado ou non, para a empresa e pertencen e son pagadas por esta.\\n\\nImporte
  neto da cifra de negocios\\n\\n\u00c9 o resultado que se obt\u00e9n de deducir do
  importe das vendas de produtos, mercador\u00edas e similares, e das prestaci\u00f3ns
  de servizos correspondentes \u00e1s actividades ordinarias da empresa, o importe
  dos descontos e demais bonificaci\u00f3ns sobre as vendas, as\u00ed como o IVE e
  outros impostos directamente relacionados.\\n\\nTotal de ingresos de explotaci\u00f3n\\n\\n\u00c9
  o importe total obtido como resultado de agregar os diferentes ingresos ligados
  \u00e1 explotaci\u00f3n obtidos pola empresa durante o ano de referencia.\\n\\nConsumo
  de materias primas, mercador\u00edas etc.\\n\\nRecolle as compras netas (\u00e9
  dicir, unha vez descontados os r\u00e1peles e devoluci\u00f3ns de compras) de materias
  primas efectuadas pola empresa durante o ano de referencia, diminu\u00eddas ou aumentadas
  polo importe da correspondente variaci\u00f3n de existencias.\\n\\nTraballos realizados
  por outras empresas\\n\\n\u00c9 o gasto correspondente ao traballo que, formando
  parte do proceso de produci\u00f3n propia, se encarga e \u00e9 realizado por outras
  empresas.\\n\\nGastos de persoal\\n\\nEste concepto recolle o importe total agregado
  dos pagamentos efectuados pola empresa durante o ano de referencia en concepto de
  soldos e salarios, indemnizaci\u00f3ns, seguridade social e outros gastos de persoal.\\n\\nenerx\u00eda,
  industria e construci\u00f3n 8\\n\\nTotal de gastos de explotaci\u00f3n\\n\\n\u00c9
  o importe total obtido como resultado de agregar os diferentes gastos ligados \u00e1
  explotaci\u00f3n realizados pola empresa durante o ano de referencia.\\n\\nEnerx\u00eda
  el\u00e9ctrica\\n\\nProduci\u00f3n bruta\\n\\nEste termo fai referencia \u00e1 enerx\u00eda
  producida media en bornes dos xeradores. Incl\u00fae a enerx\u00eda producida polas
  centrais de bombeo sen deduci\u00f3n da enerx\u00eda el\u00e9ctrica consumida no
  bombeo.\\n\\nProduci\u00f3n neta\\n\\n\u00c9 o resultado de deducir a produci\u00f3n
  bruta de consumos en servizos auxiliares das centrais e as perdas en transformaci\u00f3n
  principal. Incl\u00fae a enerx\u00eda producida polas centrais de bombeo sen deduci\u00f3n  da
  enerx\u00eda el\u00e9ctrica consumida no bombeo.\\n\\nProduci\u00f3n dispo\u00f1ible\\n\\n\u00c9
  a diferenza entre a produci\u00f3n neta e o consumo de enerx\u00eda para o bombeo;
  na pr\u00e1ctica, ent\u00e9ndese como a enerx\u00eda producida en cada provincia
  media nas barras de sa\u00edda dos transformadores principais das centrais da provincia,
  utilizable no mercado toda ela salvo as perdas de transporte e distribuci\u00f3n
  ata os centros de consumo.\\n\\nDistribuci\u00f3n\\n\\nComprende a enerx\u00eda
  el\u00e9ctrica subministrada a abonados consumidores mediante contrato, as subministraci\u00f3ns
  a persoal empregado, a servizos administrativos e iluminaci\u00f3n de instalaci\u00f3ns
  das empresas el\u00e9ctricas, a\u00ednda cando non se facturen.\\n\\nEnerx\u00edas
  renovables\\n\\nEnerx\u00edas renovables\\n\\nSon enerx\u00edas que se renovan ou
  recuperan de maneira c\u00edclica nunha escala temporal de curto prazo. Existen
  diferentes fontes de enerx\u00edas renovables dependendo dos recursos naturais utilizados
  para a xeraci\u00f3n da enerx\u00eda, tales como a hidr\u00e1ulica, a e\u00f3lica,
  biomasa...\\n\\nBiomasa\\n\\n\u00c9 a materia org\u00e1nica orixinada nun proceso
  biol\u00f3xico que se pode utilizar como fonte de enerx\u00eda.\\n\\nHidr\u00e1ulica\\n\\nA
  enerx\u00eda hidr\u00e1ulica utiliza como recurso a auga. Cando a enerx\u00eda hidr\u00e1ulica
  se utiliza como fonte primaria para a produci\u00f3n de electricidade co\u00f1\u00e9cese
  como enerx\u00eda hidroel\u00e9ctrica. Neste caso dist\u00ednguese a gran hidr\u00e1ulica,
  producida en centrais con potencia superior a 10 MW, da minihidr\u00e1ulica, producida
  en centrais con potencia inferior a 10 MW.\\n\\nE\u00f3lica\\n\\nA enerx\u00eda
  e\u00f3lica utiliza o vento como recurso para a xeraci\u00f3n de enerx\u00eda.\\n\\nGALICIA
  EN CIFRAS - anuario 09\\n\\n131\\n\\nIndustria mineira\\n\\nProdutos da miner\u00eda\\n\\nTradicionalmente
  os produtos da miner\u00eda clasific\u00e1banse en produtos enerx\u00e9ticos, minerais
  met\u00e1licos, minerais non met\u00e1licos e produtos de canteira. A partir do
  ano 2005 introd\u00facense certos cambios na clasificaci\u00f3n. Cons\u00e9rvanse
  os produtos enerx\u00e9ticos (carb\u00f3ns e hidrocarburos) e minerais met\u00e1licos;
  dos minerais non met\u00e1licos dest\u00e1canse os minerais industriais e dentro
  dos chamados produtos de canteira sep\u00e1ranse as rocas ornamentais nun subgrupo
  aparte.\\n\\n1\\n\\nconsumo de gasolinas, gas\u00f3leos e fuel\u00f3leos. ano 2009\\n\\nToneladas\\n\\n|  |  |
