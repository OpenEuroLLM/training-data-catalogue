  Coru\u00f1a Corre. Dita xornada dividirase en dous dias .\\n\\nD\u00eda 10 de Xu\u00f1o
  en Elvi\u00f1a HORARIO DEFINITIVO\\n\\nE NECESARIO CONFIRMAR 45 MIN ANTES DE CADA
