  4 Dotaci\u00f3n de bibliotecas.\\n\\nMANIFESTA:\\n\\no compromiso da persoa/entidade
  que representa cos est\u00e1ndares m\u00e1is esixentes en relaci\u00f3n co cumprimento
  das normas xur\u00eddicas, \u00e9ticas e morais, adoptando as medidas necesarias
