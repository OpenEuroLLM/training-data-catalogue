  http://www.ine.es.\\n\\nNota: datos 2009 provisionais.\"", "\"OBSERVAR\\n\\nIkea
  quere abrir a contrataci\u00f3n no departamento de dese\u00f1o.\\n\\nA primeira
  proba do proceso de selecci\u00f3n consiste en realizar unha nova proposta para
  a estanter\u00eda Billy.\\n\\nCada grupo debe presentar o seu propio dese\u00f1o,
  planificar o traballo de construci\u00f3n e constru\u00edlo.\\n\\nDESE\u00d1AR\\n\\nO
  prototipo debe cumprir as seguintes condici\u00f3ns:\\n\\n1. As dimensi\u00f3ns
  da estanter\u00eda non poden superar as da caixa do proxecto (aproximadamente 21
  x 30 x 25 cm).\\n2. A estrutura da estanter\u00eda debe realizarse con madeira de
  contraplacado de 3 ou 5 mm de espesor.\\n3. Cada grupo deber\u00e1 tomar unha serie
  de decisi\u00f3ns en relaci\u00f3n ao dese\u00f1o do frontal da estanter\u00eda.
  Requisitos:\\n3.1. Os elementos do frontal (portas e caix\u00f3ns) deben ser m\u00f3biles.\\n3.2.
  Os elementos do frontal poden realizarse con madeira de contraplacado (3/5 mm de
  espesor) ou cart\u00f3n.\\n3.3. Os tiradores dos elementos m\u00f3biles poden realizarse
  de diversos materiais, previa consulta.\\n3.4. A colocaci\u00f3n do estante central
  \u00e9 fixa, pero podedes decidir a posici\u00f3n dos outros catro andeis.\\n4.
  Os erros de construci\u00f3n respecto do plano non est\u00e1n penalizados se son
  inferiores a 1 cm.\\n5. O dese\u00f1o de cada grupo ser\u00e1 avaliado atendendo
  \u00e1 s\u00faa dificultade e innovaci\u00f3n.\\n\\nBuscamos informaci\u00f3n para
  realizar o noso dese\u00f1o e finalmente constru\u00edmos un prototipo en cart\u00f3n.\\n\\nPROXECTO
  2\u00ba ESO: ESTANTER\u00cdA BILLY\\n\\nCURSO 2018-19\\n\\nRealizamos o plano do
  noso dese\u00f1o nunha escala 1:8, o cal quere dicir que calquera das medidas do
  plano debe multiplicarse por 8 para co\u00f1ecer as dimensi\u00f3ns reais dunha
  peza da estanter\u00eda comercial.\\n\\nEntr\u00e9govos o plano en papel para que
  poidades medir sobre el e debuxar as vosas propostas de dese\u00f1o para o frontal.\\n\\nMedide
  sobre o plano e cubride a seguinte t\u00e1boa:\\n\\nRealizade o dese\u00f1o das
  pezas do frontal debux\u00e1ndoas no plano que vos din e indicando as medidas.\\n\\nPROXECTO
  2\u00ba ESO: ESTANTER\u00cdA BILLY\\n\\nCURSO 2018-19\\n\\nCONSTRU\u00cdR\\n\\nTedes
  que completar a folla de proceso:\\n\\nAVIS\u00c1DEME CANDO TE\u00d1ADES REMATADO\\n\\nEmpregade
  papel cuadriculado para realizar plantillas e us\u00e1deas para marcar as diferentes
  pezas sobre a madeira.\\n\\nAVALIAR\\n\\nUnha vez rematado o proxecto, teredes que
  responder individualmente un cuestionario que colgarei no grupo de Classroom. Tam\u00e9n
  podedes responder as preguntas en papel.\\n\\nNa seguinte p\u00e1xina tedes a planilla
  que utilizarei para corrixir o voso proxecto.\\n\\nPROXECTO 2\u00ba ESO: ESTANTER\u00cdA
  BILLY\\n\\nCURSO 2018-19\"", "\"\\n\\nImpresi\u00f3n: Imprenta Amador P\u00e9rez.\\n\\nDese\u00f1o
  e maquetaci\u00f3n: David Rodr\u00edguez.\\n\\nEdita: Concello de Redondela.\\n\\nDep.
  Legal: PO119-2022\\n\\nO material topon\u00edmico da parroquia de Cabeiro recolleuno
  a cooperativa redondel\u00e1 Tres P\u00e9s.\\n\\nEste libro publ\u00edcase grazas
  \u00e1 subvenci\u00f3n dirixida aos concellos para as actividades de dinamizaci\u00f3n
  da lingua galega do ano 2021, convocada pola Deputaci\u00f3n de Pontevedra.\\n\\nToponimia
  de Cabeiro\\n\\n*\\n\\nCora Represas\\n\\nPr\u00f3logo\\n\\nGalicia \u00e9 un dos
  territorios con maior densidade topon\u00edmica de Europa. Este dato expl\u00edcase
  pola orograf\u00eda do terreo, o minifundismo e a s\u00faa dispersa ocupaci\u00f3n
  humana.\\n\\nPor esta causa, o Concello de Redondela dese\u00f1ou un ambicioso proxecto
  para cumprir con este fin. Unha das li\u00f1as de actuaci\u00f3n foi a recollida
  e publicaci\u00f3n en formato libro da microtoponimia parro\u00ad quia a parroquia.
  Este \u00e9 o resultado.\\n\\nA documentaci\u00f3n da microtoponimia, como paso
  previo para a protecci\u00f3n e conservaci\u00f3n deste patrimonio inmaterial, \u00e9
  unha ur\u00ad xencia. Hai top\u00f3nimos antiqu\u00edsimos, con moitos s\u00e9culos
  de existen\u00ad cia, que a\u00ednda viven na fala e toman forma na lingua galega.\\n\\nO
  Concello de Redondela agradece o traballo dos axentes que par\u00ad ticiparon. Desexamos
  ter contribu\u00eddo a salvagardar un anaco da nosa cultura e da nosa memoria popular.\\n\\nRedondela,
  2022\\n\\nOrogr\u00e1ficos\\n\\nBalada, A\\n\\nNo Catastro de Ensenada (1756) aparece
  recollido coa forma \\\"A Valada\\\". O uso do [v] fainos crer que, efectivamente,
  procede de valo malia que na actualidade se grafe con [b].\\n\\nNa s\u00faa orixe
  este top\u00f3nimo procede, con toda seguridade, de valo ou valado (do lat\u00edn
  VALLATU, \\\"parede que delimita unha propieda\u00ad de\\\"). En Redondela tam\u00e9n
  deu no co\u00f1ecido top\u00f3nimo de Os Valos, xa situado preto da vila.\\n\\nEste
  top\u00f3nimo debera ser corrixido.\\n\\nBragas, As\\n\\nNo caso do top\u00f3nimo
  redondel\u00e1, situado no barrio da Igrexa, posi\u00ad blemente procede de bragado,-a;
  \u00e9 dicir, unha terra bragada \u00e9 aquela de distinta cor que as outras que
  a rodean.\\n\\nEste top\u00f3nimo, malia a s\u00faa apariencia, non garda relaci\u00f3n
  coa ci\u00ad dade portuguesa, antiga capital da Gallaecia.\\n\\nCachadas, As\\n\\nO
  nome de As Cachadas prov\u00e9n do verbo cachar (*CASCULARE, \\\"romper\\\"). A
  s\u00faa orixe est\u00e1 relacionada coa necesidade orixinada dende a Alta Idade
  Media de aumentar as terras que eran destinadas ao cultivo. Deste xeito era necesario
  rozar ou cachar a vexetaci\u00f3n dos montes e matorrais dando lugar ao top\u00f3nimo
  As Cachadas.\\n\\nEst\u00e1 situada a seguir do Lugar da Igrexa fronte aos Cochi\u00f1os.
  Nun\u00ad ha das s\u00faas parcelas local\u00edzase a Fonte da Igrexa.\\n\\nCami\u00f1os\\n\\nEste
  \u00faltimo \u00e9 interesante dada a repetici\u00f3n do concepto cami\u00f1o. Segundo
  Gonzalo Navaza quirincosta (ou quiringosta) \u00e9 unha varian\u00ad te de congostra,
  que est\u00e1 presente no galego suroccidental. Deriva do lat\u00edn CO-ANGUSTAM
  (\\\"estreito\\\"). Xa que logo, as quirincostas son cami\u00f1os de carro angostos
  que discorren entre valados, ou ben afun\u00ad didos no terreo, por efecto do paso
  dos carros durante moitos anos.\\n\\nNo que atinxe \u00e1 toponimia viaria, o substantivo
  cami\u00f1o \u00e9 o m\u00e1is empregado. A meirande parte deles f\u00f3rmanse polos
  lugares que circundan os cami\u00f1os. No barrio da Igrexa distinguimos: Cami\u00f1o
  das Gra\u00f1as, Cami\u00f1o das Covi\u00f1as, Cami\u00f1o das Pereiras, Cami\u00f1o
  da Lousa, Cami\u00f1o do Soldado, Cami\u00f1o do Monte, Cami\u00f1o da Igrexa, Cami\u00f1o
  das Cerdeiras, Cami\u00f1o da Melixosa, Cami\u00f1o da Poza da Agra, Cami\u00f1o
  dos Covelos, Cami\u00f1o do Souti\u00f1o, Cami\u00f1o dos Canos, Cami\u00f1o das
  Fenteiras, Cami\u00f1o dos Lagos, Cami\u00f1o do P\u00edo, Cami\u00f1o do Tombo
  de Miguel (seg\u00fan Amante) e Cami\u00f1o da Quiringosta.\\n\\nNo barrio de Porto
  Cabeiro atopamos: Cami\u00f1o da Carrasqueira, Cami\u00f1o do Costal, Cami\u00f1o
  dos Mu\u00ed\u00f1os, Cami\u00f1o da Cova, Cami\u00ad \u00f1o do Embalse, Cami\u00f1o
  das Coutadi\u00f1as e Cami\u00f1o do Campi\u00f1o.\\n\\nCampos, Os\\n\\nNa parroquia
  de Cabeiro distinguimos no Barrio  da Igrexa Os Campos, fronte ao inicio do Cami\u00f1o
  dos Lagos pasando Os Barr\u00e1s, Os Campos de Arriba e Os Campos de Abaixo as\u00ed
  nomeados pola diferenza de altitude dos mesmos, situados \u00e1 dereita do inicio
  do ca\u00ad mi\u00f1o dos Lagos.\\n\\nO substantivo campo (do lat\u00edn CAMPU)
  a mi\u00fado designa na topo\u00ad nimia un espazo amplo de terreo m\u00e1is ou
  menos plana, onde non hai vivendas e que en xeral se pode dedicar ao cultivo.\\n\\nOs
  Campos Grandes, referenciado no Catastro de Ensenada de 1756 como \\\"O Campo Grande\\\",
  tam\u00e9n cualifica o tama\u00f1o das terras, as\u00ed como o derivado con sufixo
  diminutivo O Campi\u00f1o que aludir\u00eda a un terreo pequeno a\u00ednda que neste
  caso a extensi\u00f3n do lugar \u00e9 moi ampla.\\n\\nO Campo de Gaias, Campo de
  Alves e o Mu\u00ed\u00f1o do Campo do R\u00edo ve\u00f1en catalogados polos lugares
  nos que se atopan, do mesmo xeito, O Campo Santo, pr\u00f3ximo ao cemiterio.\\n\\nCanexa,
  A\\n\\nEn todo caso ref\u00edrese a un cami\u00f1o moi estreito entre muros altos.\\n\\nEste
  top\u00f3nimo \u00e9 un castelanismo adaptado ao galego que ten forte arraigo na
  actualidade na zona da R\u00eda de Vigo (por exemplo, en S\u00e1r\u00ad doma-Vigo
  temos outro caso).\\n\\nCangras, As\\n\\nO top\u00f3nimo Cangas procede da forma
  c\u00e9ltica *CAMBICAS, \\\"cur\u00ad va ou cousa curva\\\". Polo tanto, seguindo
  o exemplo anterior, engadi\u00ad r\u00edaselle o sufixo para dar *c\u00e1ngaras
  e por s\u00edncope da vogal post\u00f3nica dar\u00eda As Cangras.\\n\\n\u00c9 posible
  que este top\u00f3nimo sexa unha variante de Cangas, top\u00f3ni\u00ad mo que d\u00e1
  nome ao concello da R\u00eda de Vigo, ao que se lle engadiu o sufixo \u2013ara.
  Unha forma an\u00e1loga \u00e9, por exemplo, de longa-l\u00f3ngara. Despois, a vogal
  post\u00f3nica desaparece para dar a forma longra.\\n\\nCarreira, A\\n\\nNa parroquia
  de Cabeiro atopamos As Carreiras, e cualificados por un adxectivo que indica tama\u00f1o:
  As Carreiras Pequenas e A Carreira Grande. No Catastro de Ensenada de 1756 podemos
  atopar d\u00faas referencias en singular tanto Carreira como A Carreira.\\n\\nA
  carreira \u00e9 un substantivo com\u00fan que determina un cami\u00f1o, a mi\u00fado
  estreito. Deriva do substantivo carro (CARRU, un celtismo introducido no lat\u00edn)
  que dar\u00eda CARRARIA ou VIA CARRARIA. Mant\u00e9n a relaci\u00f3n con este significado
  ao se usar inicialmente para referirse a un \\\"cami\u00f1o apto para carros\\\".\\n\\nCastro\\n\\nEn
  Cabeiro atopamos, por un lado como segundo formante do top\u00f3nimo: Mu\u00ed\u00f1os
  de Castro no Penedo e Cierre de Castro. Este \u00faltimo cont\u00e9n o castelanismo
  cierre que no galego normativo actual corresponder\u00eda \\\"peche\\\". E, por
  outro, Castro Ferreiro cualificado polo adxectivo ferreiro (do lat\u00edn FERRARIUS,
  \\\"de ferro\\\").\\n\\nO substantivo castro, m\u00e1is os seus derivados e compostos,
  \u00e9 unha forma moi empregada na toponimia galega. Procede do lat\u00edn CAS\u00ad
  TRUM \\\"fortificaci\u00f3n, campamento militar\\\". Nun inicio designaba os campamentos
  do ex\u00e9rcito romano, a\u00ednda que despois aludiuse con el aos poboados celtas.
  Polo que a mi\u00fado os top\u00f3nimos ve\u00f1en determi\u00ad nados polo asentamento
  pasado destes pobos. Malia todo, debemos de ter en conta que se trata dun termo
  moi empregado tam\u00e9n nos apelidos polo que \u00e1s veces resulta complexo discernir
  a s\u00faa orixe.\\n\\nCocho, O\\n\\nNa parroquia de Cabeiro atopamos dous lugares
  nomeados O Co\u00ad cho. Un  fronte ao Eido Vello e outro entre Os Mangoeiros de
  Arriba e A Balada.\\n\\nO substantivo cocho m\u00e1is os seus derivados te\u00f1en
  moita presenza na toponimia galega sur-occidental. Ademais do comunmente co\u00ad
  \u00f1ecido  \\\"cocho\\\" como sin\u00f3nimo de \\\"porco\\\", tam\u00e9n garda
  relaci\u00f3n co verbo acochar co significado de \\\"abrigo\\\". Emporiso, neste
  caso \u00e9 pro\u00ad bable que designe un anaco de terra con linde a un paso com\u00fan
  tal e como na fala oral fan emprego do termo \\\"cocho\\\".\\n\\nO plural Os Cochos
  at\u00f3pase enriba da Fonte, \u00e1 dereita do Aceitei\u00ad ro. O diminutivo plural
  Os Cochi\u00f1os, fronte As Cachadas. E, final\u00ad mente, cualificados por un
  adxectivo que denota como \u00e9 o terreo do cocho: O Cocho Grande \u00e1 dereita
  dos Cochos e Os Cochos Longos situado tras O Lugar da Igrexa no Cami\u00f1o dos
  Covelos.\\n\\nNo Catastro de Ensenada de 1756 al\u00fadese tanto ao Cocho (singu\u00ad
  lar) coma aos Cochos (plural) ademais de O Cocho da Fonte actual\u00ad mente en
  desuso.\\n\\nCostal, O\\n\\nO top\u00f3nimo O Costal aparece recollido en Cabeiro,
  no barrio de A Igrexa, e en dous lugares en Porto Cabeiro.\\n\\nA costa  (do lat\u00edn
  C\u014eSTA) ref\u00edrese a un terreo en pendente ascen\u00ad dente, a mi\u00fado
  referidos a cami\u00f1os e v\u00edas.\\n\\nCosteira, A\\n\\nA Costeira, situada
  na parroquia de Cabeiro no barrio da Igrexa \u00e1 esquerda do Cami\u00f1o da Melixosa
  e en linde con Os Covelos.\\n\\nA Costeira (derivada do substantivo costa, \\\"terreo
  en pendente\\\") rec\u00f3llese en d\u00faas formas na parroquia de Cabeiro.\\n\\nE
  tam\u00e9n se recolle en plural, As Costeiras, no barrio de Porto Ca\u00ad beiro.
  \u00c9 un adxectivo que indica relaci\u00f3n ou pertenza \u00e1 costa. Neste caso,
  como se sit\u00faa preto dunha lagoa pode referirse \u00e1 costa desta.\\n\\nPor
  \u00faltimo, cabe destacar As Costi\u00f1as, un diminutivo de costa, que se localiza
  xunto ao R\u00edo Domingos.\\n\\nCoto Rapado\\n\\nEste top\u00f3nimo componse de
  d\u00faas partes. Por un lado, temos Coto (deriva da ra\u00edz prerromana cott-)
  designa tanto \\\"unha elevaci\u00f3n ro\u00ad chosa do terreo\\\" como a \\\"parte
  m\u00e1is alta dun monte que ten forma c\u00f3nica\\\". \u00c9 un microtop\u00f3nimo
  moi frecuente en toda Galiza. Pola ou\u00ad tra parte temos Rapado que, como \u00e9
  obvio, v\u00e9n informanos de que est\u00e1 pelado de vexetaci\u00f3n.\\n\\nCoutada,
  A\\n\\nA respecto da formaci\u00f3n topon\u00edmica atopamos derivados de couto
  con probable alusi\u00f3n \u00f3s donos das terras: As Coutadas da Vella (en\u00ad
  riba do Souti\u00f1o polo Cami\u00f1o do Soldado), As Coutadas de Land\u00edn (\u00e1
  dereita do Carrascal, formado co apelido Land\u00edn moi popular na\\n\\nO substantivo
  coutada v\u00e9n do verbo coutar, a partir de couto (en lat\u00edn CAUTU, \u00abprotexer,
  defender, coidar\u00bb). Un couto \u00e9 un territorio afectado por determinados
  dereitos de propiedade ou xurisdici\u00f3n. Por tanto, A Coutada ref\u00edrese a
  parcelas do monte que foron privati\u00ad zadas e adoitan lindar co monte comunal.\\n\\nprovincia
  de Pontevedra), Coutada de Vilar (situada ao final do lugar da Cova lindando coa
  parroquia de Vilar de Infesta) e As Coutadas do Crego (fronte A Gra\u00f1a separados
  polo Cami\u00f1o do Costal).\\n\\nE, por outra banda, pola localizaci\u00f3n dos
  terreos: Coutadas de Afo\u00ad ra, (inseridas no Carrascal fronte As Coutadas de
  Land\u00edn) As Cou\u00ad tadas do R\u00edo, (baixo o R\u00edo Daviela), Coutada
  da Carreira \u00e1 esquerda da fin do Cami\u00f1o da Carrasqueira que linda coa
  estrada PO-321 en direcci\u00f3n Negros pasando o lugar da Cova).\\n\\nCova, A\\n\\nNa
  parroquia de Cabeiro temos, por unha banda, A Cova no Ba\u00ad rrio  de Porto Cabeiro
  localizada entre As Coutadas de Vilar e A Coutadas da Carreira. Al\u00ed, ademais,
  sit\u00faanse os microtop\u00f3nimos de A Lagoa e Castro Ferreiro.\\n\\nO top\u00f3nimo
  Cova, m\u00e1is os seus derivados, proceden do lat\u00edn CAVA que evolucionou ao
  lat\u00edn hispano C\u014eVA e remiten a unha concavidade orogr\u00e1fica do terreo.\\n\\nPor
  outra, destacamos os seus derivados. As Covi\u00f1as onde tam\u00e9n se destacan
  os microtop\u00f3nimos de A Lagoa, Lavadoiro e a Casa de Maruja do Canteiro.\\n\\nComo
  segundo formante dos top\u00f3nimos \u00e1chanse Cami\u00f1o das Covi\u00f1as, que
  inicia en O Costal e remata en As Covi\u00f1as, e, final\u00ad mente, Cami\u00f1o
  da Cova, A Chan da Cova en Porto Cabeiro.\\n\\nCovelos, Os\\n\\nNa parroquia de
  Cabeiro dist\u00ednguese o top\u00f3nimo cun morfema flexivo plural, Os Covelos,
  xa asentado dende 1756 conforme indica\u00ad da o Catastro de Ensenada, e como segundo
  formante do top\u00f3nimo Cami\u00f1o dos Covelos, localizado dende o Lugar da Igrexa
  cara As Laxes onde xusto en fronte se sit\u00faan Os Covelos.\\n\\nO substantivo
  covelo designa un \\\"pequeno lugar c\u00f3ncavo ou fon\u00ad do; pequena depresi\u00f3n
  do terreo\\\", derivado do adxectivo covo (ldo lat\u00edn CAVA, \\\"c\u00f3ncavo,
  profundo\\\"). Segundo o Nomencl\u00e1tor de Gali\u00ad za son 50 os lugares que
  conte\u00f1en no n\u00facleo do seu top\u00f3nimo covelo.\\n\\nCuartos, Os\\n\\nEsta
  divisi\u00f3n parece ser frecuente no reparto das herdanzas du\u00ad rante a Idade
  Media a\u00ednda que alg\u00fan autores tam\u00e9n referencian un costume musulm\u00e1n
  de repartir as terras conquistadas.\\n\\nOs Cuartos, situado entre Os Eidos e as
  Cerdeiras a seguir do Ca\u00ad mi\u00f1o do Campi\u00f1o, \u00e9 un top\u00f3nimo
  numeral partitivo que na toponi\u00ad mia (as\u00ed como tam\u00e9n Terzo, -a e
  Quinto, -a) alude \u00e1 terra arrendada pola que se deb\u00eda pagar un cuarto
  do que produc\u00eda.\\n\\nChan, A\\n\\nNa toponimia galega atop\u00e1molo como
  un xen\u00e9rico de uso com\u00fan que ven denotar un terreo ou superficie sen desniveis.\\n\\nO
  substantivo chan masculino ou feminino prov\u00e9n do lat\u00edn PLA\u00ad NUM,
  PLANAM que no galego occidental deu nun mesmo resulta\u00ad do (chan) pero que no
  galego oriental se distingue (chan, ch\u00e1).\\n\\nEn Cabeiro achamos: A Chan,
  A Chan do Gorgull\u00f3n que \u00e9 un top\u00f3nimo relacionado co termo gurgullar
  (lugar onde nace a auga facendo gurgullas), A Chan da Cova , A Chan do R\u00edo,
  A Chan dos Loureiros e, finalmente, A Chan de Umberto. Estes \u00faltimos por ex\u00ad
  tensi\u00f3n do significado do nome, fan referencia ao lugar de; e no caso de A
  Chan de Umberto, en alusi\u00f3n ao terreo e lugar dun propietario.\\n\\nEidos,
  Os\\n\\nSegundo o Nomencl\u00e1tor da Xunta de Galicia son 50 os lugares que te\u00f1en
  no seu top\u00f3nimo este nome ou derivados do mesmo, a mei\u00ad rande parte deles
  rexistrados nas Comarcas do Condado, Paradanta e Vigo.\\n\\nO substantivo com\u00fan
  eido est\u00e1 recollido pola  Dicionario da Real Academia Galega como \\\"conxunto
  de terras que circundan unha casa\\\" ou \\\"terreo cultivado que pode estar entre
  as terras que rodean unha casa ou non\\\".\\n\\nNa parroquia de Cabeiro xa aparece
  mencionado no Catastro de Ensenada de 1756 \\\"Os Eidos\\\" cos morfemas correspondentes
  de plu\u00ad ral e que se localiza entre Os Cuartos e Os Forni\u00f1os dividido
  polo Cami\u00f1o do Campi\u00f1o.\\n\\nTam\u00e9n, cualificado por un adxectivo,
  encontramos O Eido Vello que se atopa no Cami\u00f1o dos Quinteiros debaixo da Coutada.
  Este top\u00f3nimo no Catastro de Ensenada aparece como \\\"A Eiravella\\\". E,
  finalmente, o Eido do Rei que linda co Cami\u00f1o da Igrexa.\\n\\nEixido, O\\n\\nO
  substantitvo com\u00fan galego eixido (de orixe latina, EXITUM, de\u00ad rivado
  do verbo EXIRE, \\\"sa\u00edr\\\") \u00e9 definitivo polo dicionario da Real Academia
  Galega coma un \\\"terreo de pouca extensi\u00f3n contiguo \u00e1 casa, onde polo
  xeral se cultivan hortalizas\\\".\\n\\nEstrada\\n\\nO substantivo com\u00fan estrada
  (do lat\u00edn STRATAM, \\\"cami\u00f1o pavi\u00ad mentado\\\"), fai referencia
  actualmente \u00e1 v\u00eda destinada \u00e1 circulaci\u00f3n de veh\u00edculos.
  En Cabeiro refer\u00e9nciase Estrada a Trasma\u00f1\u00f3 que neste caso \u00e9
  unha v\u00eda con enlace \u00e1 parroquia de Trasma\u00f1\u00f3.\\n\\nForni\u00f1os,
  Os\\n\\nO diminutivo Os Forni\u00f1os, xa referenciado dende 1756 no Catas\u00ad
  tro de Ensenada, est\u00e1 situado entre os Campos Grandes e Os Eidos deslindados
  polo Cami\u00f1o da Quiringosta.\\n\\nO forno \u00e9 o establecemento ou lugar onde
  se coce e vende o pan. Antigamente era un lugar de encontro social da xente do pobo.\\n\\nForo,
  O\\n\\nNa parroquia de Cabeiro O Foro local\u00edzase no barrio  da Igrexa fronte
  a Fonte da Agra, preto da Igrexa de San Xo\u00e1n de Cabeiro. Xa que logo, \u00e9
  probable que o seu nome ve\u00f1a orixinado pola pertenza do terreo \u00e1 diocese.\\n\\nForo(do
  lat\u00edn FORUM; praza, mercado, espazo p\u00fablico) \u00e9 un tipo de contrato,
  eventualmente, perpetuo, polo que unha persoa ou instituci\u00f3n (fidalgu\u00eda
  e/ ou Igrexa) lle cede a outra o uso ou proveito dunha cousa ou ben (xeralmente
  unha terra), a cambio do cumprimento de diversas condici\u00f3ns previamente estipuladas.\\n\\nGra\u00f1a,
  A\\n\\nPor outra parte, a forma gra\u00f1a, igual ca de granxa, son resultados galegos
  da forma latina GRANIA, que procede de GRANU (\\\"gran, cereal\\\"). Tanto Granxa
  como Gra\u00f1a son top\u00f3nimos moi numerosos en Galiza e case sempre relacionados
  coa actividade monacal.\\n\\nGra\u00f1a \u00e9 un substantivo feminino que, segundo
  o dicionario da Real Academia Galega, fai referencia \u00e1 unha extensi\u00f3n
  de monte baixo, sen cultivar.\\n\\nNa parroquia de Cabeiro, no barrio da Igrexa
  enriba das Covi\u00f1as separado polo Cami\u00f1o da Gra\u00f1a encontramos A Gra\u00f1a.
  Pola do\u00ad cumentaci\u00f3n medieval sabemos que o mosteiro de Santa Mar\u00eda
  de Armenteira (Meis) ti\u00f1a propiedades aforadas tanto en Cabeiro coma en Trasma\u00f1\u00f3.\\n\\nO
  top\u00f3nimo aparece rexistrado no Catastro de Ensenada (1756) como \\\"A Gra\u00f1a\\\".\\n\\nHerbeiral,
  O\\n\\nSon dous os top\u00f3nimos que se achan na parroquia de Cabeiro: O Herbeiral
  localizado fronte o terreo do Aceiteiro. E, cualificado por un nome, os Herbeiros
  de San Domingos enriba das Costi\u00f1as.\\n\\nOs substantivos herbeiro ou herbeiral  aluden
  \u00e1 unha cantidade elevada de produci\u00f3n de herba dun, ou varios, terreos.\\n\\nHorta,
  A\\n\\nEn Cabeiro, por unha banda, enc\u00f3ntrase A Horta fronte ao Lugar de Romero
  polo Cami\u00f1o do Campi\u00f1o. E, por outra, cun morfema de plural: As Hortas
  situado enriba do lugar da Melixosa polo Cami\u00f1o da Melixosa fronte A de Fix\u00f3n.\\n\\nO
  substantivo com\u00fan horta prov\u00e9n do lat\u00edn HORTUM. Referencia unha terra
  pr\u00f3xima \u00e1 casa onde se cultivan diversos legumes, verdu\u00ad ras e hortalizas\\n\\nLaxes,
  As\\n\\nDe orixe probablemente c\u00e9ltica, incorporouse ao lat\u00edn como LA\u00ad
  GENA. O  dicionario da Real Academia Galega recolle laxe como \\\"peza de pedra
  de cara superior alisada e de pouco grosor con relaci\u00f3n \u00e1 s\u00faa superficie\\\".
  \u00c9 un top\u00f3nimo de uso frecuente na toponimia de Galiza.\\n\\nEn Redondela,
  ademais, derivou nun apelido con forte presenza onom\u00e1stica na comarca.\\n\\nNo
  Barrio  da Igrexa atopamos o derivado plural: As Laxes que se localiza \u00e1 esquerda
  do Cami\u00f1o dos Covelos fronte As Leiras.\\n\\nLeiras, As\\n\\nNa parroquia de
  Cabeiro rec\u00f3llese Leira Longa como microtop\u00f3\u00ad nimo dentro do lugar
  chamado como Os Mangoeiros de Abaixo. Est\u00e1 formado por un adxectivo cualificativo
  que referencia a forma alon\u00ad gada do terreo.\\n\\nO substantivo leira \u00e9
  de orixe prerromana, documentada en textos medievais como LAREA e designa \\\"un
  lugar estreito de regad\u00edo\\\".\u00a0Se\u00ad gundo o Nomencl\u00e1tor de Galicia
  son 25 os lugares, cos seus deriva\u00ad dos, denominados como leira.\\n\\nNo Catastro
  de Ensenada de 1756 aparece referenciado o lexema plural \\\"As Leiras\\\" sen modificadores.\\n\\nMamoa
  do Rei, A\\n\\nPor outra, do rei usouse para denominar lugares de reguengo (no Antigo
  R\u00e9xime depend\u00edan do rei, isto \u00e9, que non estaban sometidos a se\u00f1or\u00edo
  laico ou eclesi\u00e1stico). Emporiso, tam\u00e9n poder\u00eda facer refe\u00ad
  rencia ao apelido dun propietario posto que antigamente Rei era em\u00ad pregado
  para aqueles bautizados dos que se desco\u00f1ec\u00eda o pai como Dos Santos ou
  De Deus.\\n\\nA Mamoa do Rei, podemos atender ao top\u00f3nimo divid\u00edndoo no
  n\u00facleo (mamoa) e no complemento do nome (do Rei). Por unha banda, m\u00e1moa
  \u00e9 un substantivo que segundo o dicionario da Real Academia Galega designa un
  sepulcro prehist\u00f3rico da \u00e9poca mega\u00ad l\u00edtica, formado por un
  dolmen cuberto por un mont\u00edculo de terra de planta circular e de arredor de
  cinco metros de altura.\\n\\nO mesmo acontece co Pinal do Rei, ou co Eido do Rei
  ao que xa se aludiu na entrada Eido.\\n\\nMangoeiros, Os\\n\\nNo Catastro de Ensenada
  (1756) atopamos a referencia Mangoeiro sen complementos do nome. Actualmente se
  reco\u00f1ece Os Mangoei\u00ad ros de Arriba e Os Mangoeiros de Abaixo.\\n\\nA orixe
  deste top\u00f3nimo est\u00e1 no derivado de manga. Este palabra procede do lat\u00edn
  MANICA, derivado de MANUM (\\\"man\\\"), e que era aplicado a realidades alongadas.
  Polo tanto, Os Mangoeiros ref\u00edrese a un conxunto de terras alongadas.\\n\\nEn
  Galiza este top\u00f3nimo aparece rexistrado en concellos coma Avi\u00f3n (Ourense),
  Outeiro de Rei (Lugo) ou Toques (A Coru\u00f1a).\\n\\nMatosa, A\\n\\nO top\u00f3nimo
  de A Matosa at\u00f3pase no barrio de Porto Cabeiro.\\n\\nEste top\u00f3nimo procede
  do lat\u00edn MATTA (\\\"arbusto, planta espesa\\\") canda o sufixo \u2013osa. Referir\u00edase
  a un lugar cheo de matas. No Catas\u00ad tro de Ensenada (1756) xa aparece recollido
  como \\\"A Matoeira\\\" e \\\"A Mattosa\\\".\\n\\nMelixosa, A\\n\\nNo Catastro de
  1756 ref\u00edrese como \\\"A Melijosa\\\". Obs\u00e9rvase o uso da graf\u00eda
  medieval <j> empregada para a representaci\u00f3n tanto do fo\u00ad nema xordo [\u222b]
  coma do sonoro [\u0437] que conflu\u00edron  ambos os dous no xordo [\u222b] e na
  actual graf\u00eda <x>.\\n\\nEste top\u00f3nimo procede do substantivo com\u00fan
  meluxe, que signifi\u00ad ca \\\"persoa flaca ou de mal aspecto\\\". \u00c9 posible
  que neste caso se refira a un terreo pouco f\u00e9rtil.\\n\\nMinada, A\\n\\nNo barrio
  da Igrexa local\u00edzase A Minada como microtop\u00f3nimo das Coutadas do Crego.
  E, cun morfema de n\u00famero plural, As Mi\u00ad nadas.\\n\\nMinada \u00e9 un derivado
  do xen\u00e9rico mina (palabra de orixe celta MEIN incorporada dende o franc\u00e9s
  mine) que designa un tipo de escavaci\u00f3n subterr\u00e1nea pola que se busca
  alg\u00fan manancial.\\n\\nMillarada, A\\n\\nO top\u00f3nimo de A Millarada xa se
  rexistra no Catastro de Ensena\u00ad da de 1756 como \\\"A Millarada\\\" e actualmente
  sit\u00faase no Cami\u00f1o da Millarada enriba da Costeira.\\n\\nMillarada \u00e9
  probable que funcionase como substantivo colecti\u00ad vo de millo das terras destinadas
  ao cultivo do mesmo. Emporiso, tam\u00e9n poder\u00eda facer alusi\u00f3n ao millo
  que se botaba como forraxe para lle dar ao gando. Esta palabra ser\u00eda ent\u00f3n
  derivada da m\u00edllara, que antigamente significou \\\"terra sementada de millo
  mi\u00fado\\\".\\n\\nMu\u00ed\u00f1o\\n\\nO \u00fanico que podemos saber polo Arquivo
  Hist\u00f3rico Nacional so\u00ad bre os mu\u00ed\u00f1os e a existencia indeterminada
  xa dende o s\u00e9culo XII duns mu\u00ed\u00f1os: \\\"Sentencias relativas al pleito
  seguido por el monaste\u00ad rio de Santa Mar\u00eda de Mel\u00f3n y el monasterio
  de Santa Mar\u00eda de\u00a0Ar\u00ad menteira\u00a0sobre la posesi\u00f3n de unos
  molinos en\u00a0Redondela\\\".\\n\\nDe por parte, o substantivo mu\u00ed\u00f1o
  prov\u00e9n do lat\u00edn MOLINUM. Os mu\u00ed\u00f1os son uns aparellos que se
  empregan (ou empregaban) para moer ou triturar certos produtos coma o millo. Son
  parte elemental da arquitectura tradicional galega e, polo mesmo motivo, tiveron
  gran relevancia na vida social da xente porque era un lugar de encontros. Grazas
  \u00e1 pegada topon\u00edmica, en moitas ocasi\u00f3ns onde xa non perma\u00ad necen
  os restos da construci\u00f3n, sabemos da existencia dos mesmos.\\n\\nNa parroquia
  de Cabeiro atopamos Mu\u00ed\u00f1o do Caseiro, Mu\u00ed\u00f1o do Campo do R\u00edo,
  Mu\u00ed\u00f1o do Costal e Mu\u00ed\u00f1os de Castro. O primeiro fai referencia
  a un propietario alcumado ou co\u00f1ecido no pobo como \\\"O Caseiro\\\"; os demais,
  \u00e1 proximidade cos lugares dos que parte o xenitivo.\\n\\nPanascas, As\\n\\nAs
  Panascas \u00e9 un derivado plural feminino de panasco que pode facer referencia
  \u00e1 herba seca, \u00e1spera e dura que pode servir de pasto para o gando. Emporiso,
  dado que se atopa a car\u00f3n do monte no Ba\u00ad rrio  da Igrexa baixo O Carrascal,
  poder\u00eda gardar m\u00e1is rela   ci\u00f3n co lugar do monte onde nace a herba
  de xeito natural.\\n\\nPatelo, O\\n\\nO m\u00e1is probable \u00e9 que O Patelo ve\u00f1a
  derivado do adxectivo patelo que denota unha cousa plana, neste caso en referencia
  ao terreo. Est\u00e1 situado nos terreos que lindan co Cami\u00f1o do Patelo.\\n\\nPedra,
  A / Penedo, O\\n\\nNo segundo caso ser\u00eda empregado para o chamamento dunha
  pe\u00ad dra individualizada como sin\u00f3nimo de pena ou penedo. En Cabeiro at\u00f3panse
  pola ampla extensi\u00f3n do terreo que abarca \u00e1 esquerda das Coutadas da Vella,
  Souti\u00f1o e O Costal: Pedra do Couto, As Pedras da Barrela, A Pedra Negra, As
  pedras dos Picos, Pedras das Verru\u00ad gas e Pedra das Pe\u00f1ice.\\n\\nO substantivo
  pedra \u00e9 un xen\u00e9rico de uso com\u00fan na toponimia e microtoponimia galega.
  No primeiro caso cun significado m\u00e1is xen\u00e9rico facendo alusi\u00f3n a
  un lugar no que hai ou houbo pedras identificamos: O Penedo situado fronte As Coutadi\u00f1as
  polo cami\u00f1o de Cabeiro e A Pedra fronte O Foro.\\n\\nQueimado\\n\\nA forma
  queimado \u00e9 o participio do verbo queimar. \u00c9 moi posible que se trate dun
  top\u00f3nimo recente, pois non aparece na documenta\u00ad ci\u00f3n do Catastro
  de Ensenada (1756) nin adoita ser un top\u00f3nimo ha\u00ad bitual en Galiza. A
  informaci\u00f3n \u00e9 transparente: un terreo que ardeu ou que lle plantaron lume.\\n\\nRabelo,
  O\\n\\nCon este top\u00f3nimo, formado polo substantivo rabo e o sufixo \u2013elo
  (por tanto, \\\"un rabo pequeno\\\"), des\u00edgnase un terreo ou propiedade que
  ten esta forma.\\n\\nNa parroquia de Cabeiro atopamos O Rabelo xa rexistrado dende
  1756 no Catastro de Ensenada.\\n\\nVeiga, A\\n\\nVeiga \u00e9 un substantivo de
  orixe prerromana compartida tam\u00e9n polo portugu\u00e9s e espa\u00f1ol (vega)
  de significado orixinariamente hi\u00ad dron\u00edmico, que designaban aquelas terras
  cultivadas situadas a car\u00f3n dun curso de auga. Segundo o Nomencl\u00e1tor de
  Galiza son 180 os lugares que te\u00f1en no seu n\u00facleo veiga ou os seus derivados.\\n\\nO
  top\u00f3nimo As Longas, situado fronte As Carreiras, fai alusi\u00f3n \u00e1 forma
  alongada do terreo que presenta elidido un substantivo como \\\"veiga\\\", \\\"leira\\\",
  \\\"terra\\\" e que forman un conxunto de terras alonga\u00ad das. Dado que no Catastro
  de Ensenada de 1756 xa aparece unha referencia a \\\"Veiga Longa\\\" \u00e9 probable
  que o lexema elidido sexa este substantivo e non outro.\\n\\nEn Cabeiro dist\u00ednguese
  A Veiga de Abaixo, entre A Coutada e O Campo de Abaixo dende o Cami\u00f1o dos Quinteiros,
  e A Veiga de Arriba.\\n\\nViragaia, A\\n\\nPor unha parte temos vira- que seguramente
  se trate dunha alte\u00ad raci\u00f3n fon\u00e9tica com\u00fan de mira-, do verbo
  mirar. A outra parte, gaia, significa \\\"alegre\\\".  Polo tanto, este top\u00f3nimo
  v\u00e9n dicirnos que esta\u00ad mos ante unha Vista Alegre.\\n\\nTr\u00e1tase dun
  top\u00f3nimo composto situado no barrio de Porto Ca\u00ad beiro.\\n\\nXeral, A\\n\\n\u00c9
  un top\u00f3nimo de creaci\u00f3n recente. Ref\u00edrese ao paso da estrada nacional
  555 que atravesa a parroquia de Cabeiro.\\n\\nHidr\u00f3nimos\\n\\nCanos, Os\\n\\nO
  substantivo cano do lat\u00edn CANNU designa unha conduci\u00f3n da auga. Neste
  caso o top\u00f3nimo ind\u00edcanos que se trata dun conxunto deles.\\n\\nFonte,
  A\\n\\nNo Catastro de Ensenada de 1756 aparece a s\u00faa referencia sen complementos
  do nome A Fonte.\\n\\nO substantivo com\u00fan fonte (do lat\u00edn, FONTEM) \u00e9
  moi frecuente na toponimia galega. Na parroquia de Cabeiro temos as seguintes todos
  modificados polo lugar no que se sit\u00faan: A Fonte da Agra, A Fonte da Melixosa
  e Fonte do Galo.\\n\\nLagoa, A\\n\\nA lagoa \u00e9 o resultado do lat\u00edn LACUNA
  con moita presencia na toponimia galega. En Cabeiro atopamos: como microtop\u00f3nimo
  das Covi\u00f1as, ademais do Campi\u00f1o: A Lagoa. Cualificado por un adxec\u00ad
  tivo A Lagoa Pequena, A Lagoa Grande e cualificado por un com\u00ad plemento do
  nome As Lagoas do Pereiro todas localizadas derredor do Rego Fond\u00f3n.\\n\\nOs
  Lagos, tam\u00e9n co\u00f1ecido como A Devesa dos Lagos, est\u00e1 situa\u00ad do
  \u00e1 fin do r\u00edo Lagares e o seu top\u00f3nimo rec\u00f3llese no Catastro
  de Ensenada (1756).\\n\\nPoza\\n\\nPozo (do lat\u00edn PUTEUM) ou en feminino poza,
  designa un lugar c\u00f3ncavo cheo de auga. Son moitos os lugares na parroquia de
  Cabei\u00ad ro que te\u00f1en o substantivo pozo, poza como lexema principal e/ou
  parte do top\u00f3nimo: Mina da Poza da Agra, Poza de San Domingos, Poza da Carreira
  Grande, A Poza da Melixiosa, Poza dos Cambei\u00ad ros, A Poza do Logui\u00f1o,
  Pozo de Arriba, Poza do Ollomol e Os Poci\u00f1os\\n\\nR\u00edos\\n\\nNo barrio
  da Igrexa podemos distinguir o substantivo cualificado por un nome ou por un complemento
  do nome: R\u00edo San Domin\u00ad gos (na fala oral tam\u00e9n con gheada: Domincos),
  R\u00edo de Negros, R\u00edo G\u00fcelas e R\u00edo de Viela.\\n\\nOs top\u00f3nimos
  que fan referencia \u00e1s augas denom\u00ednanse hidr\u00f3ni\u00ad mos e entre
  eles destaca a abundante presenza do substantivo r\u00edo (do lat\u00edn RIVU) que
  asemade adoita constitu\u00edr compostos.\\n\\nAs\u00ed mesmo, pode aparecer r\u00edo
  como segundo elemento. No ba\u00ad rrio de Porto Cabeiro: Fondo do R\u00edo tam\u00e9n
  chamado Tesouro, As Coutadas do R\u00edo e A Chan do R\u00edo. No barrio da Igrexa:
  Mu\u00ed\u00f1o do Campo do R\u00edo.\\n\\nNo caso de Cabeiro parece que o desv\u00edo
  se dirix\u00eda a un mu\u00ed\u00f1o ao cal se alude no antigo Catastro do R\u00edo
  Fix\u00f3n.\\n\\nA levada \u00e9 un sistema de conduci\u00f3n da auga moi t\u00edpico
  en Galiza. Tr\u00e1tase dunha canle que desviar\u00eda o curso do r\u00edo ou do
  regueiro para conducilo cara a un mu\u00ed\u00f1o ou a unha finca.\\n\\nBot\u00e1nicos
  e zool\u00f3xicos\\n\\nAcacias, As\\n\\nRex\u00edstrase en Cabeiro As Acacias un
  microtop\u00f3nimo do lugar das Gra\u00f1as.\\n\\nA acacia \u00e9 unha \u00e1rbore
  ou arbusto pertencente \u00e1 extensa familia das mimos\u00e1ceas. O substantivo
  prov\u00e9n do grego \u03ac\u03ba\u03b1\u03ba\u03af\u03b1 e debe o seu nome \u00e1s
  espinas que ten algunhas das s\u00faas 1.200 especies, akis, aki\u00ad dos que significa
  punta, aguill\u00f3n.\\n\\nCanuche, A\\n\\n\u00c9 posible que este top\u00f3nimo
  sexa un derivado do substantivo cana, do lat\u00edn CANNAM.\\n\\nCarrasqueira, A\\n\\nA
  Carrasqueira est\u00e1 situado no barrio de Porto Cabeiro fron\u00ad te ao Fond\u00f3n
  do Eido,  O substantivo carrasqueiro \u00e9 unha forma derivada de carrasco que
  referencia un nome xen\u00e9rico de diferentes especies da familia das eric\u00e1ceas
  coma son, por exemplo, as aran\u00ad deiras.\\n\\n\u00c9 posible que a orixe da
  palabra carrasco se remonte a unha ra\u00edz preindoeuropea KARR-, conformando unha
  das palabras m\u00e1is anti\u00ad gas en lingua galega.\\n\\nCasta\u00f1al, O\\n\\nNa
  parroquia de Cabeiro temos O Casta\u00f1al fronte ao R\u00edo Negros e o correspondente
  diminutivo Casta\u00f1alci\u00f1o como microtop\u00f3nimo de Fonte.\\n\\nCasta\u00f1al
  \u00e9 un substantivo derivado do nome casta\u00f1a que ten orixe no lat\u00edn
  CASTANEAM e que, mediante o sufixo colectivo -al (do lat\u00edn -ALE), forma casta\u00f1al
  para designar un lugar poboado de casti\u00ad \u00f1eiros, tam\u00e9n co\u00f1ecido
  como souto.\\n\\nCerdeiras, As\\n\\nNo barrio da Igrexa dispo\u00f1emos do lexema
  con morfema plural As Cerdeiras que aluden ao conxunto de parcelas situadas fronte
  As Longas separadas polo Cami\u00f1o do Campi\u00f1o.\\n\\nO substantivo cereixa
  ref\u00edrese ao froito da cerdeira, de forma arredon\u00ad dada, con carabu\u00f1a,
  aproximadamente de dous cent\u00edmetros de di\u00e1metro e de cor vermella, que
  est\u00e1 unido \u00e1 \u00e1rbore por un rabo delgado e longo.\\n\\nEste top\u00f3nimo
  aparecede referenciado xa no Catastro de Ensenada de 1756 en plural \\\"As Cerdeiras\\\".\\n\\nCernadas,
  As\\n\\nNo caso da parroquia de Cabeiro at\u00f3pase situado no barrio de Por\u00ad
  to Cabeiro.\\n\\nA forma cernadas procede do lat\u00edn CINERATAS, \u00e1 s\u00faa
  vez deri\u00ad vada de CINIS (\\\"cinsa\\\"). Como top\u00f3nimo ten bastante presenza
  e distribuci\u00f3n en todo o territorio galego. En todos os casos ref\u00edrese
  aos terreos que foron incinerados ou nos cales se queimou restos tras cavar un monte
  para ga\u00f1ar unha terra.\\n\\nFenteiras, As\\n\\nAs Fenteiras tr\u00e1tase dun
  colectivo regularizado (non est\u00e1ndar) so\u00ad bre o nome fento do lat\u00edn
  FILICTU \\\"mata de fentos\\\", de onde xorden as variantes galegas fento, fieito
  e feito. O colectivo m\u00e1is estendido v\u00e9n do lat\u00edn FILICARIA que orixina
  Filgueira, tam\u00e9n moi emprega\u00ad do na toponimia galega que adoito remiten
  \u00e1 vexetaci\u00f3n orixinaria destes lugares.\\n\\nNa parroquia de Cabeiro,
  no Barrio da Igrexa atopamos unica\u00ad mente o colectivo plural As Fenteiras e
  Cami\u00f1o das Fenteiras.\\n\\nNaranxeiro, O\\n\\nA forma habitual en galego deu
  laranxeira pero tam\u00e9n se recolle o uso en masculino laranxeiro e coa variante
  en [n], como no caso do top\u00f3nimo de Cabeiro. Non cremos que a variante se deba
  un caste\u00ad lanismo\\n\\nO laranxeiro \u00e9 a \u00e1rbore da froita Citrus aurantium.
  O nome de laranxa (no galego normativo) procede do \u00e1rabe naranga.\\n\\nO Naranxeiro
  denom\u00ednase a unha parcela na parroquia de Cabei\u00ad ro entre As Pombas e
  A Melixosa.\\n\\nPegas, As\\n\\nO m\u00e1is seguro \u00e9 que este top\u00f3nimo
  faga referencia ao paxaro de igual nome, pega (do lat\u00edn PICAM). A partir deste
  nome tam\u00e9n se usou como alcume e que, nalg\u00fans casos, derivou nun top\u00f3nimo
  (O Pego, A Pega).\\n\\nPereiras, As\\n\\nCabe destacar que na fala oral tam\u00e9n
  se desenvolve a pronuncia preira. Este fen\u00f3meno tr\u00e1tase dunha crase formada
  pola s\u00edncope da vogal pret\u00f3nica \\\"e\\\" (fen\u00f3meno como A Cru\u00f1a
  fronte A Coru\u00f1a).\\n\\nEn Cabeiro atopamos o top\u00f3nimo A Pereira e o seu
  plural As Pereiras, este \u00faltimo rexistrado no Catastro de Ensenada de 1756
  como \\\"As Pereiras\\\". O primeiro sit\u00faase entre A Chan e o Campi\u00f1o.
  O segundo, sobre os Campos de Arriba separado polo Cami\u00f1o das Pereiras.\\n\\nEn
  todo caso conv\u00e9n ter en conta que estamos ante unha palabra hom\u00f3nima:
  palabras que se escriben iguais pero te\u00f1en distinto sig\u00ad nificado e etimolox\u00eda.
  Neste caso, tanto pode aludir \u00e1 \u00e1rbore froiteira pera (do lat\u00edn PIRA),
  como tam\u00e9n un lugar cuberto de pedras (do lat\u00edn PETRA). Ambos os dous
  lexemas pera e pedra nas palabras de\u00ad rivadas evolucionaron ao galego como
  pereira,o a\u00ednda que tam\u00e9n se emprega e se recolle para pedra o derivado
  pedreira, pedreiro.\\n\\nPumar, O\\n\\nOs top\u00f3nimos que incl\u00faen este nome
  adoito serv\u00edan para designar lugares nos que hab\u00eda maceiras ou de xeito
  xen\u00e9rico, \u00e1rbores froitei\u00ad ras. Neste caso O Pumar xa se rexistra
  no Catastro de Ensenada de 1756 co mesmo nome.\\n\\nO substantivo pumar (resultado
  da pechaz\u00f3n de pomar, que \u00e9 o termo aceptado pola Real Academia Galega)
  v\u00e9n do lat\u00edn tard\u00edo PO\u00ad MAR, variante de POMALE (\\\"verxel\\\").\\n\\nSouto,
  O\\n\\nNa parroquia de Cabeiro achamos O Souto, enriba do Pumar fronte A Melixosa
  separados polo Cami\u00f1o da Melixosa, e O Souti\u00f1o (un diminutivo do termo
  souto) sobre O Costal deslindados polo Cami\u00f1o do Souti\u00f1o.\\n\\nO souto
  \u00e9 o substantivo co que comunmente se co\u00f1ece ao bosque dos casti\u00f1eiros.
  As\u00ed e todo, a s\u00faa orixe est\u00e1 no lat\u00edn SALTU referido a un bosque
  mixto. Este top\u00f3nimo xa se rexistra dende o Catastro de Ensenada de 1756.\\n\\nXestal,
  O\\n\\nNa parroquia de Cabeiro no barrio da Igrexa, atopamos o top\u00f3ni\u00ad
  mo O Xestal, \u00e1 fin do Cami\u00f1o da Melixosa en chegando \u00e1 parroquia
  de Negros. Na parroquia de Cabeiro forma parte do territorio da Mi\u00ad llarada
  e conforma d\u00faas parcelas estreitas e alongadas ao car\u00f3n do Cami\u00f1o
  da Millarada.\\n\\nXestal \u00e9 un substantivo colectivo derivado de xesta (do
  lat\u00edn GE\u00ad NISTA) ao que se lle engade o sufixo de abundancia -ALE. Designa
  un conxunto de arbustos leguminosos do x\u00e9nero Sarothamnus moi com\u00fans en
  Galicia.\\n\\nDe propietarios (antrop\u00f3nimos)\\n\\nA de, do\\n\\nNa parroquia
  de Cabeiro atopamos A do Cabirta fronte os Cam\u00ad beiros. Cunha probable met\u00e1tese
  de -r- (cambio do fonema vibrante /r/ no posto da palabra) a referencia inicial
  ser\u00eda o alcume \\\"Cabrita\\\". A de G\u00fcelas, A de Fix\u00f3n, A de Nieves
  do Gaio, A de Fermina ou A de Marcos.\\n\\nOs top\u00f3nimos que se compo\u00f1en
  de a de (artigo + prep), a do (ar\u00ad tigo + contracci\u00f3n de preposici\u00f3n
  + artigo) fan menci\u00f3n \u00f3s propie\u00ad tarios das parcelas.\\n\\nAceiteiro,
  O\\n\\nPor outra parte non podemos descartar que se trata dunha altera\u00ad ci\u00f3n
  de asenteiro, referido ao conxunto de plantas chamadas asentes. En Valadares (Vigo)
  tam\u00e9n se rexistra esta forma Os Aceiteiros.\\n\\nO substantivo aceiteiro fai
  referencia ao aceite ou \u00e1 persoa que se dedica \u00e1 fabricaci\u00f3n ou venda
  do mesmo. \u00c9 posible que este top\u00f3ni\u00ad mo faga referencia ao alcume
  dun propietario que fac\u00eda ou vend\u00eda aceite.\\n\\nBarr\u00e1s, Os / Barreiros,
  Os\\n\\nEstes nomes mediante os sufixos -al e -eiro, formaron os top\u00f3\u00ad
  nimos Os Barr\u00e1s e Os Barreiros que debido a que non se rexistra terreo arxiloso,
  o m\u00e1is probable \u00e9 que foran antrop\u00f3nimos (alcu\u00ad mes da profesi\u00f3n
  ou apelidos) que deron en nomear as actuais lo\u00ad calizaci\u00f3ns.\\n\\nNo barrio
  da Igrexa na parroquia de Cabeiro atopamos d\u00faas lo\u00ad calizaci\u00f3ns nomeadas
  como Os Barr\u00e1s e Os Barreiros ambas as d\u00faas mencionadas no Catastro de
  Ensenada de 1756 como \\\"As Ba\u00ad rras\\\" en feminino e sen til de acentuaci\u00f3n
  e \\\"O Barreiro\\\". Son nomes derivados do lexema de orixe celta barro. Este substantivo
  designa aquel material arxiloso que se pode moldear e utilizar, mesturado con auga,
  para facer unha masa que serve para fabricar obxectos ou como cemento.\\n\\nCambeiros,
  Os\\n\\nCambeiro, -a  \u00e9 un adxectivo que fai referencia \u00e1s pernas tortas
  e/ou arqueadas dunha persoa. Dado que na parroquia de Cabeiro achamos Os Cambeiros
  en relaci\u00f3n a unhas vivendas, \u00e9 probable que se tratase do alcume co que
  se refer\u00edan aos propietarios das mesmas.\\n\\nCasa de\\n\\nO substantivo casa
  \u00e9 un lugar destinado \u00e1 vivenda moi habitual na microtoponimia como referencia
  ao domicilio de propietarios co\u00f1e\u00ad cidos. En Cabeiro destacamos a Casa
  da Mestra, Casa dos Pobres, Casa Emilio, Casa Maruja do Canteiro ou mesmo tam\u00e9n
  a Casa Flecha todas formadas despois do s\u00e9culo XVIII.\\n\\nChavina, A\\n\\nTodo
  nos fai pensar que se trata dun top\u00f3nimo formado a partir do apelido Chav\u00edn.
  Este, \u00e1 s\u00faa vez, tam\u00e9n se conformou como top\u00f3\u00ad nimo (en
  Viveiro, por exemplo) e que derivar\u00eda do xenitivo do nome persoal latino Flavinus.\\n\\nLugar
  de Romero\\n\\nO substantivo lugar remite entre outras acepci\u00f3ns a unha porci\u00f3n
  de espazo determinado ou referido a un n\u00facleo de poboaci\u00f3n. Neste caso
  ten o significado semellante a A de ou Casa de como referen\u00ad cia ao espazo
  en propiedade dun dono, malia que a diferencia das anteriores popularmente adoita
  ter a especificiaci\u00f3n de ser ou unha ampla extensi\u00f3n ou conter un anaco
  rural.\\n\\nPeitieiros, Os\\n\\nNo Catastro de Ensenada de 1756 atopamos a referencia
  \\\"de Pei\u00ad teados\\\", actualmente inexistente como tal pero que sen d\u00fabida
  fai re\u00ad ferencia ao lugar de Os Peitieiros.\\n\\nA orixe deste top\u00f3nimo
  est\u00e1 relacionado co oficio dos habitantes deste lugar: elaborar peites para
  tear. Outro exemplo deste top\u00f3nimo atop\u00e1molo como nome dunha parroquia
  de Gondomar.\\n\\nOutros\\n\\nCasarella, A\\n\\nTr\u00e1tase dun substantivo con
  morfema plural formado por un le\u00ad xema (casa) e un sufixo derivativo pexorativo
  (-ello, -ella) que ven designar unha casa pequena, vella ou moi deteriorada. A s\u00faa
  orixe poder\u00eda estar relacionada co diminutivo latino CASARICULA.\\n\\nEn Cabeiro
  nom\u00e9ase o lugar situado entre As Cachadas e As Cos\u00ad ti\u00f1as como A
  Casarella\\n\\nCemiterio, O\\n\\nO substantivo cemiterio prov\u00e9n do lat\u00edn
  tard\u00edo COEMETERIUM que asemade parte dun pr\u00e9stamo grego bizantino ''koimeterion''
  -\u03ba\u03bf\u03b9\u03bc\u03b7\u03c4\u1f75\u03c1\u03b9\u03bf\u03bd- (vinculado
  a unha ra\u00edz indoeuropea *KEI- emparen\u00ad tada con acostarse, cama, botar
  ra\u00edces). No lat\u00edn vulgar simplificou a CEMETERIU que orixinou no medieval
  CIMETERIUM e que ori\u00ad xina na actualidade \\\"cemiterio\\\". No espa\u00f1ol,
  foi a trav\u00e9s dos s\u00e9culos como se colou unha graf\u00eda <n> antes do fonema  dental
  [t] que orixi\u00ad nou a crenza dunha orixe etimol\u00f3xica latina do termo CAEMENTA
  (pedra quebrada) do que actualmente temos o termo cemento pola suposta utilizaci\u00f3n
  deste material para pechar as tumbas.\\n\\nMalia que na actualidade se empregue
  esta argamasa, non era as\u00ed nos orixes gregos posto que se enterraban os seres
  queridos nas casas.\\n\\nFinalmente, cabe destacar que non se rexistra no Catastro
  de En\u00ad senada o top\u00f3nimo Cemiterio na parroquia de Cabeiro porque at\u00e9
  a chegada de Napole\u00f3n non se constru\u00edron estes espazos dedicados ao fin
  do descanso eterno.\\n\\nCorte, A\\n\\nXa que logo, este top\u00f3nimo poder\u00eda
  referenciar un lugar no que se gardaban os animais. Ou mesmo tam\u00e9n, un lugar
  destinado \u00e1 rapa dos animais salvaxes m\u00e1is co\u00f1ecido como \\\"Rapa
  das Bestas\\\" actual\u00ad mente convertidas en festas populares.\\n\\nNa parroquia
  de Cabeiro atopamos A Corte das Bestas. Segundo define o dicionario da Real Academia
  Galega, por unha banda dis\u00ad tinguimos a corte, un lugar onde se garda o gando,
  cuberto e cerrado que forma unha construci\u00f3n \u00e1 parte ou est\u00e1 no interior
  doutra. Em\u00ad poriso, tam\u00e9n pode aludir a acci\u00f3n e efecto de cortar
  ou cortarse. Por outra banda, a besta pode ser calquera animal distinto ao home
  ou mesmo tam\u00e9n un animal salvaxe.\\n\\nCruceiro, O\\n\\nOs substantivos cruz
  e cruceiro est\u00e1n moi presentes na toponimia galega, segundo o nomencl\u00e1tor
  de Galicia son derredor de 140 en\u00ad tidades de poboaci\u00f3ns referidas como
  cruz, cruces e outras tantas como o seu derivado cruceiro. En moitos casos non \u00e9
  sinxelo discer\u00ad nir se no lugar houbo unha cruz de pedra, ou outro material,
  ou se se refer\u00eda a unha encrucillada viaria, hoxe ameazado polo castelanismo
  cruce. Na parroquia de Cabeiro atopamos O Cruceiro.\\n\\nIgrexa, A\\n\\nO significado
  do substantivo \u00e9 transparente e moi concorrido na toponimia galega. Deriva
  da palabra latina ECCLESIA e son derre\u00ad dor de 500 segundo o Nomencl\u00e1tor
  de Galicia os lugares que pos\u00faen este top\u00f3nimo. Na parroquia de Cabeiro
  atopamos a Igrexa de Ca\u00ad beiro, e relacionados con el tanto o Lugar da Igrexa
  como o Barrio da Igrexa. No Catastro de Ensenada refer\u00e9nciase como A Iglesia
  con graf\u00eda <s>.\\n\\nEste termo designou nun principio as asembleas de cidad\u00e1ns
  gre\u00ad gos reunidos para lexislar e tomar acordos, pero posteriormente pa\u00ad
  sou a se referir \u00e1s xuntanzas dos primeiros cristi\u00e1ns que celebraban o
  culto en comunidade. Finalmente deulle o nome ao edificio que acoll\u00eda as celebraci\u00f3ns
  lit\u00farxicas.\\n\\n\u00cdndice\\n\\nBalada, A: p. 7.\\n\\nCachadas, As: p. 7.\\n\\nBragas,
