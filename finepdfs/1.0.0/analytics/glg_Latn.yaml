  e as matriarcas do mar\\nRoteiros: Santiago - Forcarei\\nO ADN no Centro Social
  de Outes\\n... e as nosas secci\u00f3ns habituais\\n\\nEntrevista a...\\nSantiago
  Nieto\\n\\nEditorial\\n\\nRESULTADOS ELECTORAIS\\nOUTES. 26 DE MAIO\\n\\nNo 26-M
  produciuse un cambio hist\u00f3rico no Concello, e non tan s\u00f3 porque Compromiso
  superou o PP en votos, que tam\u00e9n, mais porque as tres forzas da esquerda superaron
  en 1185 votos os recibidos pola dereita. Unha derrota, pois, sen paliativos, do
  PP, que o conduce r\u00eddiculamente \u00e1 oposici\u00f3n. Por\u00e9n, inda hai
  m\u00e1is datos: mentres \u00f3 PP lle custa cada concelleiro/a 275,4 votos, \u00f3
  PSDeG 1 concelleiro sup\u00f3nlle 409, \u00f3 BNG, 332; e a Compromiso, 297,8. Non
  se pode afirmar, xa que logo, que a lei electoral vixente sexa proporcional, sen\u00f3n
  todo o contrario. Se consideramos que o censo electoral de Outes nesta ocasi\u00f3n
  concreta era de 5620 persoas e que a abstenci\u00f3n acadou a porcentaxe de 29,5%,
  sen contabiliza-los votos nulos e outras opci\u00f3ns, o resultado destas elecci\u00f3ns
  foi contundentemente favorable \u00e1 esquerda, salientando, dentro das ditas opci\u00f3ns,
  o BNG, que pasou de non ter representaci\u00f3n a contar con 2 concelleiros/as,
  cun total de 664 votos v\u00e1lidos. Compromiso ga\u00f1oulle \u00f3 PP en 7 circunscrici\u00f3ns
  electorais, namentres que o PP tan s\u00f3 ga\u00f1eu en 5.\\n\\nA forza m\u00e1is
  vetada est\u00e1 chamada a gobernar. Dic\u00eda moi ben Manolo Gonz\u00e1lez: \u201cQuedou
  claro que ten que haber un cambio. A xente votou polo cambio e n\u00f3s temos que
  lideralo\u201d. Namentres, Beatriz Molinos reco\u00f1ec\u00eda deste xeito: \u201cO
  resultado t\u00e9melo asumido, est\u00e1 claro que algo far\u00edamos mal n\u00f3s
  e algo far\u00eda ben o resto\u201d. Moitas persoas outenses limpaban as laga\u00f1as
  dos ollos perante as novas que se transmit\u00edan e non dando creto \u00f3 acontecido
  despois de tantos anos de goberno da dereita. Resulta moi dado de explicar xeraci\u00f3ns
  de outenses nunca co\u00f1eceran un goberno de esquerdas, e iso descontando os anos
  da ditadura represiva. Agora v\u00e9n o tempo de administrar ben a confianza depositada
  nos/nas actuais concelleiros/as da esquerda, m\u00e1is fundamentalmente no rexedor
  electo. Parab\u00e9ns a toda a xente, parab\u00e9ns \u00e1s persoas ga\u00f1adoras
  e moita sorte a todo o mundo!\\n\\nDicionario xeogr\u00e1fico Xo\u00e1n Mari\u00f1o\\n\\nCapadocia.
  Territorio da actual Turqu\u00eda de onde veu a \u2018Capadora\u2019, muller que
  capaos homes a ducias e agora vive no Campo de Noia.\\n\\nLanzarote. Illa canaria
  de onde proceden as lanzarotas, armas arreboladizas crebadas.\\n\\nLiverpool. Piscina
  libre, en ingl\u00e9s.\\n\\nMadeira. Arquip\u00e9lago portugu\u00e9s que serve para
  le\u00f1a ou facer moblaxe.\\n\\nManchester. \u00c9 como se di en ingl\u00e9s manchas
  de t\u00e9.\\n\\nMato Grosso. Irm\u00e1n m\u00e1is gordo de Xulio Mato, \u2018Matito\u2019,
  m\u00edtico xogador de f\u00fatbol noi\u00e9s.\\n\\nMel\u00f3n. Concello ourens\u00e1n
  habitado por mel\u00f3manos, xente que adora a m\u00fasica.\\n\\nSalamanca. Cidade
