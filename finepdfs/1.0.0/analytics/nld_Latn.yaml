sample: '["\"De Crisis in de Kerk, Oorzaken, Remedies p. 3\\n\\nPaulus is nooit op
  Malta geweest p.10\\n\\nZiet, de Heer zal komen,\\nOp die dag zal er een groot licht
  schijnen.\\n\\nGevraagde Lezers,\\n\\nMet ingang van deze maand november zullen
  er wat betreft de opmaak van het Informatieblad enkele dingen veranderen. Op bladzijde
  twee vindt u voortaan het colofon met alle gegevens omtrent de uitgevers. Dat is
  in de kolom hiernaast.\\n\\nDe inhoudsopgave blijft bestaan op de achterkant, maar
  verschijnt weergegeven in \u00e9\u00e9n kolom. Daardoor blijven er op bladzijde
  twee en op de laatste pagina twee kolommen vrij.\\n\\nHier op deze bladzijde zult
  u voortaan steeds een klein woordje aantreffen, dat u zal begeleiden door het nieuw
  verschenen Informatieblad. Het wil rekenschap afleggen van de teksten, u aanmoedigen
  verschillende bijdragen te lezen, de aansluiting op een vroegere aflevering van
  een artikel geven...\\n\\nVerder zijn deze twee kolommen gewijd aan uitgangspunten
  voor een gedachtengang of gewoon bedoeld om u te wijzen op de tekenen des tijds.\\n\\nDe
  twee kolommen die vrij blijven op de achterkant bieden ruimte aan een grotere foto,
  gedichten, mededelingen enz.\\n\\nWij willen verder in de toekomst er naar streven
  het Informatieblad nog meer lezenswaardig te maken. Een duidelijker grafische indeling
  van de teksten zal het u vergemakkelijken met meer plezier en vrucht van deze bladzijden
  te genieten.\\n\\nIn deze maand november starten wij met de publikatie van de conferentie,
  gegeven door mgr. Bernard Fellay in Montreal, Canada. Deze is al eerder gepubliceerd
  in het Franse tijdschrift \\\"Fideliter\\\" en nu door ons vertaald in het Nederlands.
  Ook aan u zal daardoor de mogelijkheid worden gegeven deze schitterende toelichting
  te leren kennen. U zult er beslist van genieten en veel verstand krijgen van wat
  er momenteel gaande is in Kerk en wereld. Het onderwerp is de crisis van de H. Kerk
  in onze dagen. Op heldere wijze analyseert mgr. Fellay de verschijnselen van neergang.
  Hij toont de waarheid van zijn constateringen aan, door ze te bewijzen met de uitspraken
  van vele kerkelijke waardigheidsbekleders. Descherpzinnige uiteenzettingen, zonder
  enig spoor van polemiek, vinden hun hoogtepunt in de aanwijzing van middelen die
  geschikt zouden zijn om de crisis te overwinnen.\\n\\nHier en daar, waar dat van
  toepassing is, vindt u, in kadertjes, een andere tekst in dit artikel ingewerkt.
  Deze is uitgegeven door het \\\"Interdiocesche Pastoraal Beraad\\\" van Vlaanderen
  in zijn toelichting bij de \\\"Oproep tot een re\u00eble en evangelische dialoog
  in de kerk\\\". In hele passages stemt deze analyse, wat inhoud betreft, overeen
  met die van mgr. Fellay. De conclusies echter die er worden getrokken zijn vaak
  precies tegenovergesteld aan die van mgr. Fellay. Er wordt geen rekening gehouden
  met de bovennatuur en vaak zijn de conclusies niet meer dan ongegronde veronderstellingen.
  Dat neemt niet weg dat het feit van de crisis overduidelijk wordt gezien.\\n\\nMet
  de beste wensen voor een beschouwelijke tijd van de advent, uw\\n\\nP. J\u00fcrgen
  Wegner\\n\\nDe Crisis in de Kerk -\\n\\nOorzaken -\\n\\nRemedies\\n\\nOfschoon ontkend,
  is de crisis in de Kerk re\u00ebel.\\n\\nDe oorzaken\\n\\nZe zijn talrijk tegenwoordig
  in de kerk, zij die doodeenvoudig de crisis in de Kerk ontkennen. En daar wij over
  de crisis in de Kerk willen spreken moeten we wel antwoorden aan hen die zeggen
  dat er geen is. Misschien zelfs aan hen die zeggen dat er geen kan zijn. Er bestaan
  veel tegenwerpingen; men kan ze herleiden tot twee typen argumenten:\\n\\nAllereerst
  een principe-argument. Het luidt ongeveer zo: \\\"De Heer heeft Zijn steun beloofd
  aan Zijn heilige, onbevlekte bruid: Hij heeft de bijstand van de H. Geest beloofd,
  Hij heeft Zijn goddelijke tegenoordigheid beloofd tot aan het einde der tijden;
  dus steunend op deze beloften, kan de Katholieke Kerk niet wankelen, de poorten
  der Hel kunnen haar niet overweldigen. Conclusie: er kan geen crisis in de Kerk
  bestaan.\\n\\nTweede soort van argument, concreter deze keer: men stelt de huidige
  veranderingen in de Kerk voor, als een noodzakelijk iets, als een gevolg van de
  vitaliteit van de Kerk: \\\"De Kerk is een levend wezen, het moet veranderen en
  zijn veranderingen zijn iets goeds, iets heel goeds, juist het tegenovergestelde
  van een crisis.\\\" Bij voorbeeld, in de Osservatore Romano van 23 juli 1972, stelt
  men ons het huidige zuchten en steunen van de Kerk voor, niet als dat van een doodsstrijd,
  maar als dat van een geboorte.\\n\\nLaat ons op beide tegenwerpingen antwoorden.\\n\\nEn
  wel eerst op de tweede opwering, die beweert dat alles wat heden in de Kerk gebeurt,
  dat werkelijk verbijsterende ondersteboven zetten van alles, een goede zaak zou
  zijn.\\n\\nDe filosofen zeggen dat het niets uithaalt tegen feiten te argumenteren.
  De crisis is een erkend feit, erkend zelfs door de hoogste autoriteiten van de Kerk,
  te beginnen met Paulus VI. Herhaaldelijk heeft Paulus VI getoond dat hij zich bewust
  was van een crisis in de Kerk. Bij voorbeeld:\\n\\n- 7 december 1968\u00b9, in het
  Lombard College: \\\"De Kerk verkeert in een verontrustende tijd van zelfvertoevoering.
  Het is als een volledige en ingewikkelde ommekeer, die niemand verwacht zou hebben
  na dit concilie. De Kerk is er toe gekomen, om zo te zeggen, zichzelf slagen toe
  te brengen\\\".\\n\\n- Een beetje later, 30 juni 1972: \\\"Er gens is de rook van
  Satan in Gods tempel binnengedrongen\\\". In 1975, de 18de juli: \\\"Het is genoeg
  met de verdeeldheid binnen de Kerk. Genoeg met een interpretatie van het pluralisme
  dat tot splitting aanzet. Genoeg met de letsel die de katholieken zelf hun noodzakelijke
  eenheid toebrengen. Genoeg met de ongehoorzaamheid onder het mom van vrijheid\\\".\\n\\nJohannes
  Paulus II, 6 februari 1981\u00b2: \\\"Met werkelijkheidszin en een gevoelige aandacht
  voor die dingen moet men toegeven dat talrijke katholieken zich verloren voelen,
  verwurd, perplex en zelfs teleurgesteld. Idee\u00ebn die ingaan tegen de geopenbaarde
  en vanaf het begin verkondigde Waarheid zijn met kwistige hand rondgestrooid. Werkelijke
  ketterijen zijn gepropageerd op het gebied van dogma en zedenleer waardoor twijfels,
  verwarring en rebellie ontstonden. Zelfs de liturgie is gemani-puleerd, ondergedompeld
  in het intellectuele en morele relativisme, tot in het permissivisme waarin alles
  toegelaten is. De katholieken worden verleid door het athe\u00efsme, het agnosticisme,
  door het min of meer moralistische illuminisme, door het sociologisch christendom
  zonder gedefinieerde dogma''s en zonder objectieve moraal\\\".\\n\\nHet ongenoegen
  in de kerk is veelzijdig\\n\\nWie de problemen in de kerk objectief bekijkt, ziet
  vandaag een veelzijdig ongenoegen : over de kerkelijke leiding v\u00f3\u00f3r het
  concilie, over het concilie zelf, over het beleid van Rome na het concilie ; over
  liturgie en sacramenten, over ambt en bedieningen, over katechese en geloofstaal,
  over de kerkelijke moraal, over de vrouw in de kerk, ...\\n\\nHet ongenoegen situeert
  zich in alle richtingen en kringen :\\nde paus en de curie zijn ontvreden over lokale
  kerken, lokale kerken hebben kritiek op Rome,\\ngelovigen en kerkkritische groepen
  hebben bedenkingen bij het beleid van hun bisschoppen, bisschoppen uiten op hun
  beurt kritiek op deze groepen, priesters zijn ontvreden over bisschoppen en leken
  ;\\nleken drukken hun ongenoegen uit over priesters en bisschoppen, ...\\n\\nDe
  laatste jaren richtte het ongenoegen in de kerk - zowel in behoudsgezinde als vooruitstrevende
  kringen - zich vooral op de paus en de bisschoppen. Een volledige benadering dient
  het ongenoegen in de kerk dan ook te situeren tussen de groepen, bewegingen en gelovigen
  onderling. Achter deze kerkelijke spanningen schuilt de fundamentele vraag hoe we
  als gelovigen en kerkgemeenschap dienen om te gaan met de moderniteit en de secularisatie.
  De spanningen in de kerk hebben te maken met het verschil in antwoord op deze vraag.\\n\\nDit
  zijn zwaarwiegende woorden. Men moet ze goed overwegen. Als het hoofd van de Kerk
  zelf erkent dat \\\"ketterijen met kwistige hand zijn rondgestrooid\\\" in de Kerk,
  op dogmatisch gebied en op ''t gebied van de moraal, als hij erkent dat \\\"de liturgie
  gemanipuleerd wordt\\\", dat \\\"de katholieken ondergedompeld zijn in het intellectuele
  en morele relativisme\\\", dat wat hen bekoort het athe\u00efsme is en het agnosticisme
  (het agnosticisme is een filosofie, die beweert dat men niets kan kennen van het
  re\u00eble), dan is er duidelijk een crisis in de Kerk.\\n\\nAls men de prefecten
  van de Congregatie voor de Geloofsleer neemt, dat is de hoogste congregatie van
  Rome, die zich met het geloof bezighoudt, kardinaal Seper en vervolgens kardinaal
  Ratzinger: ook zij drukken zich uit in pakkende, dramatische bewoordingen. Kardinaal
  Seper zegt: \\\"De crisis van de kerk is een crisis van de bisschoppen\\\". Voor
  hem zijn het de bisschoppen, die de oorzaak van de crisis in de Kerk zijn.\\n\\nDe
  spanning tussen het christendom en de secularisatiebeweging was desto groter daar
  de kwestie van de godsdienst zelf in het debat kwam. De bevrijding die tal van geesten
  met militante hardnekkigheid nastreefden, betrof niet enkel de domeinen die in het
  verloop van de beschaving met de religie verbonden waren geweest, of die door de
  religieuze instellingen bezet waren; men had zich voorgenomen de mens vrij te maken
  in zijn persoonlijk bewustzijn door hem te bevrijden van de Godsidee. De grote nationalistische
  mythe, die de verklaring van de wereld zonder God beloofde, wekte geestdrift door
  het gevoel van niemand afhankelijk te zijn dan van zichzelf. De wens om aan de mens
  terug te geven wat de godsdienst aan God had geschonken, is niet nieuw. Volgens
  de bijbel is die wens zo oud als de mensheid zelf (Gen. 3, 5).\\n\\nKardinaal Ratzinger
  verklaart in het blad \\\"Gesu\\\", in november 1984, blz. 70: \\\"Men verwachtte
  een nieuwe katholieke eenheid en is, in tegenstelling, afgestevend op een oneenheid
  die, om de woorden van paus Montini te gebruiken, van zelfkritiek overgegaan is
  in zelfvernietiging. Men verwachtte een nieuwe geestdrift en zoveelen eindigden
  in ontmoediging en verveling. Men verwachtte een sprong voorwaarts en in feite kwamen
  we terecht in een voortschrijdend proces van decadentie. Het valt niet te betwisten
  dat deze periode op beslissende wijze ongunstig is geweest voor de katholieke Kerk.
  Ik heb de indruk dat de schade die de Kerk in deze twintig jaren na het concilie
  opgelopen heeft te wijten is (goed dat is dan zijn mening) meer dan aan het concilie
  zelf, aan de ontketening, binnen de Kerk, van latente, agressieve, polemische, centrifugerende,
  onverantwoordelijke krachten; en buiten de Kerk door de botsing met een culturele
  verandering, het zich doen gelden, in het Westen, van het hogere - medische milieu,
  van de nieuwe tertiaire bourgeoisie met zijn liberale, radicale, individualistische,
  rationalistische, hedonistische ideologie\\\".\\n\\nKardinaal Ratzinger gaat zo
  ver, dat hij eenvoudigweg toegeeft, dat hij er geen controle meer op heeft. \\\"Vandaag,
  meer dan ooit, moeten we ons er van bewust zijn dat, alleen, de Heer Zijn Kerk kan
  redden.\\n\\nDat is erkennen dat men in Rome niet meer in staat is de Kerk te besturen.\\n\\nHij
  gaat verder: \\\"Zij is van Christus. Hij moet er in voorzien\\\". (Dat is een totale
  capitulatie).\\n\\n\\\"Van ons wordt gevraagd te werken met al onze krachten, zonder
  angst, met de sereniteit van hem, die er zich van bewust is een nutteloze knecht
  te zijn, onbekwaam, de situatie die ontstaan is alleen te trotseren en in orde te
  brengen\\\".\\n\\nDat schreef kardinaal Ratzinger in 1984. Wat zou hij nu moeten
  zeggen?\\n\\nLaten we nu kort antwoorden op de tweede kernopwerping: \\\"God, Onze
  Heer, heeft Zijn bijstand aan de Kerk beloofd, dus zij kan niet wanke len\\\".\\n\\nHet
  is voldoende te kijken wat de Kerk is, om uit te leggen dat een crisis mogelijk
  is. De Kerk is, zeer zeker, een bovennatuurlijke vereniging, een goddelijke vereniging.
  Er is een goddelijke component, een component die absoluut niet kan falen, in de
  Kerk, Onze Heer Zelf, het Hoofd van het Mystiek Lichaam. Maar er is ook een menselijke
  component, en deze menselijke component kan in gebreke blijven. En dus, om te antwoorden
  op de tegenwerping die ons zegt: \\\"Wanwege de belofte van Onze Heer kan de Kerk
  niet in gebreke blijven\\\", volstaat het om te zeggen:\\n\\n\\\"Zij kan niet totaal
  falen, in zijn geheel, dat is waar, maar het is niet juist voor de delen, de gehele
  geschiedenis van de Kerk toont het ons. Kijk bijvoorbeeld naar het Arianisme. Kijk
  naar het Oosters Schisma: al de Griekse kerken, die zich van de Kerk scheiden, dat
  is ''n zeer groot deel van de Kerk dat valt, dat faalt. Kijk naar het protestantisme:
  meer dan de helft van Europa gaat, maakt zich los van de Kerk, valt, faalt. Kijk
  naar de situatie van Noord-Afrika: deze keer zijn het de vijanden van buiten af,
  de Vandalen en vervolgens de Islam, die een katholieke samenleving wegvagen, een
  diep ingeworteld deel van de Kerk, goed ontwikkeld. In de IVe eeuw zijn daar regionale
  concilies geweest, waaraan meer dan driehonderd bisschoppen deelnamen, dat veronderstelt
  een van de bloeiendste christengemeenschappen. Welnu, dat alles is weggevaagd!\\n\\nDat
  wil wel zeggen, de feiten tonen het aan, dat delen van de Kerk kunnen wankelen.
  En dat is eigen, zoals we het al gezegd hebben, aan de menselijke component in de
  Kerk. De mensen kunnen falen. Maar, vanwege de goddelijke belofte is er een limiet
  aan deze zwakheid van de mensen. Het grote probleem, of juister gezegd het mysterie
  zit in deze vraag: \\\"Waar ligt die limiet?\\\" Wij weten dat er altijd voldoende
  van de Kerk moet overblijven om te kunnen zeggen: \\\"De poorten van de Hel zullen
  haar niet overweldigen\\\". Maar, voldoende van de Kerk, wat wil dat zeggen?\\n\\nMen
  krijgt de indruk dat er nooit een tijd was waarin een samenleving zo negatief was
  in haar oordeel over zichzelf als de onze. De doorbraak van de moderniteit en de
  daarmee gepaard gaande, gestegen welvaart hebben geen stijging van het gevoel van
  welzijn en geluk meegebracht. Alle sectoren van onze samenleving en cultuur maken
  deze crisis door: er is een slepende economische crisis en de nog steeds toenemende
  kloof tussen Noord en Zuid; er is de val van het communisme maar ook de crisis van
  de westerse democratie\u00ebn; de wetenschap en kunst zijn in crisis; er is crisis
  op het gebied van seksualiteitsbeleving, huwelijk en gezin; het onderwijs is in
  crisis. Kortom niemand schijnt vandaag nog aan dit crisisgevoel te ontsnappen.\\n\\nWel,
  nu laten we een paus aan het woord. Ik kies opzettelijk personen die voor ons omstreden
  zijn, maar waarvan het getuigenis erkend zou moeten worden door hen, die niet noodzakelijkerwijze
  onze stellingen aannemen. Paulus VI, minder dan een jaar voor zijn overlijden, 8
  september 1977, in een intiem onderhoud met zijn vriend Jean Guitton.\\n\\nJean
  Guitton heeft van dit onderhoud verslag gedaan in een boek \\\"Paul VI secret\\\",
  gepubliceerd bij uitgeverij Descl\u00e9e de Brouwer in 1979. Op bladzijde 168, vinden
  wij dit - (het is Paulus VI die spreekt): \\\"Er is een grote verwarring op het
  ogenblik in de wereld en in de Kerk. En waar het om gaat dat is het geloof. Het
  komt voor dat ik voor mezelf de duistere uitspraak van Jezus herhaal uit het Evangelie
  van de H. Lucas: ''ALS DEMENSENZOON ZAL WEDERKEREN, ZAL HIJ DAN NOG GELOOF VINDEN
  OP AARDE?''\\\" Het gebeurt dat er boeken verschijnen, waarin het geloof te kort
  wordt gedaan op belangrijke punten. Dat het Episcopaat zwijgt en dat men deze boeken
  niet vreemd vindt. En dat is het wat, in mijn ogen, vreemd is. Soms lees ik weer
  het Evangelie van het einde der tijden en dan constateer ik dat er op het ogenblik
  zekere tekenen zijn van dat einde. Zijn we dichtbij het einde? Dat zullen we nooit
  weten. We moeten zorgen dat we altijd klaar zijn voor dat einde. Alles kan heel
  lang duren. Wat me treft, als ik de katholieke wereld beschouw, is dat binnen in
  het katholicisme een gedachte van niet-katholieke aard soms de overhand schijnt
  te krijgen, en het kan dat deze niet-katholieke gedachte binnen het katholicisme
  morgen de sterkste wordt, maar zij zal nooit de katholieke gedachte vertegenwoordigen\\\".\\n\\nOverweeg
  deze woorden! Wat wil dat zeggen \\\"niet-katholieke gedachte in het katholicisme
  die de sterkste wordt\\\"; \\\"zij zal nooit de katholieke gedachte vertegenwoordigen\\\"?\\n\\nEn
  hij vervolgt: \\\"Er moet een kleine kudde blijven bestaan, zelfs al is het maar
  een heel kleine kudde\\\".\\n\\n\\\"Een heel kleine kudde\\\"; dat is het wat een
  paus denkt dat er moet blijven bestaan opdat men kan zeggen: \\\"De poorten der
  Hel zullen haar niet overweldigen\\\". Er moet tenminste nog een heel kleine kudde
  overblijven.\\n\\nPaulus VI is niet de enige die gedacht heeft dat op een zeker
  moment, in een verschrikkelijke crisis in de Kerk, de Kerk gereduceerd zou worden
  tot iets heel kleins. Reeds in de 5de eeuw, in 434, heeft een Kerkvader, de heilige
  Vincentius van L\u00e9rins, zijn befaamde waarschuwing tegen de ketters geschreven\\\\(^3\\\\);
  een vermaarde tekst, die de klassieke definitie van de Traditie gegeven heeft. **Wat
  is de Traditie?** \\\"DATGENE WAT MEN ALT\u0132D GELOOFT HEeft, OVERAL, EN WAT DOOR
  IEDEREEN GELOOFD IS.\\\" En deze zelfde heilige Vincentius van L\u00e9rins stelt
  zich deze vraag: (nog eens het is mij niet) \\\"Wat moet de christen doen, als plotseling
  een deel van de Kerk zich losmaakt van het gemeenschappelijk geloof?\\\"\\n\\nHet
  antwoord is tamelijk eenvoudig: \\\"WAT ANDERS DOEN DAN BOVEN DAT VERPESTE EN VERROTTE
  DEEL TE VERKIEZEN, DE GEZONDHEID VAN HET HELE LICHAAM, OF VAN WAT ER VAN OVER BLIJFT\\\".\\n\\nSt.
  Vincentius van L\u00e9rins zegt verder: \\\"En wat te doen als plotseling een soort
  epidemie probeert niet een klein deel, maar heel de Kerk te bezoedelen?\\\"\\n\\nZijn
  antwoord is heel eenvoudig. \\\"WELNU, HIJ ZAL ER OP BEDACHT ZIJN ZICH AAN HET VERLEDEN
  TE HECHTEN, HIJ ZAL ZICH AAN HET VERLEDEN VAN DE KERK HECHTEN, WANT DAT KAN NIET
  VERRADEN WORDEN DOOR EEN OF ANDERE BEDRIEGLIJKE NIEUWIGHEID\\\".\\n\\nDat is een
  eerste, zeer kort antwoord op de inleiding: \\\"Kan er een crisis zijn in de Kerk?\\\"\\n\\n---\\n\\n1
  De Osservatore Romano\\n2 De Osservatore Romano van 8 februari 1981\\n3 Commonitorium
  adversus Haereticos\\n\\n**mgr. Bernard Fellay**\\n\\nuit: Fideliter; nr. 93, mei/juni
  1993.\\nn.v.d.r.: Om het eigen karakter van deze conferentie, uitgesproken op 21
  oktober 1992 te Montr\u00e9al (Canada) te bewaren is de gesproken taal aangehouden.\\n\\nTekst
  in kaders uit: Kerkelijke documentatie 121; nr. 3, april 1993.\\n\\nwordt vervolgd\\n\\n6.
  Is godsdienst zuiver individueel?\\n\\nHeeft u ooit mensen horen verklaren: \\\"Ik
  wil niet, dat enige Kerk staat tussen mij en God\\\"?\\n\\nOordeel niet te scherp
  over hen, want deze verklaring wordt veroorzaakt door een misverstand.\\n\\nZe zouden
  nooit zeggen: \\\"Ik wil niet, dat het gouvernement van de Verenigde Staten staat
  tussen mij en Amerika\\\".\\n\\nHet is anti-christelijk te zeggen, ik wil niemand
  tussen God en mij, omdat dit insluit, dat uw broeder een slagboom is voor Gods genade
  en niet een middel ervoor.\\n\\nZei Onze Lieve Heer niet, dat, v\u00f3\u00f3r uw
  gift op het altaar te offeren, u zich eerst met uw broeder moest verzoenen en dan
  terugkomen en uw gave offeren?\\n\\nMaakte Hij de liefde voor God niet absoluut
  onafscheidelijk aan de liefde voor de naaste?\\n\\nLeerde Hij ons niet te bidden
  van \\\"Onze Vader\\\", niet van \\\"Mijn Vader\\\", \\\"ons dagelijks brood\\\",
  niet van \\\"mijn dagelijks brood\\\", \\\"onze zonden\\\" en niet \\\"mijn zonden\\\"?\\n\\nEn
  wanneer God een Vader is, dan zijn de anderen, die verenigd zijn met Hem, onze broeders
  en daarom moet godsdienst sociaal, maatschappelijk zijn.\\n\\nAan u wordt geen individuele
  uitleg toegestaan van de grondwet van de Verenigde Staten. Een hoog gerechtshof
  doet dat voor u.\\n\\nWaarmee zou u vasthouden aan een individuele uitleg van de
  godsdienst en alle godsdienstige discussies beginnen met: \\\"Nu, dit is, wat ik
  geloof van godsdienst\\\" of \\\"Ik voel dit betreffende God\\\".\\n\\nNooit werden
  de verheven en schone werkelijkheden z\u00f3 zeer aan de genade van de maag overgeleverd.\\n\\nHebt
  u uw eigen individuele sterrenkunde en individuele wiskunde? Is niet het persoonlijk
  voornaamwoord \\\"ik\\\" het meest indecente van alle voornaamwoorden en hebt u
  geen afkeer van de mensen, die altijd van \\\"Ik\\\" spreken? Waarom denkt u dan,
  dat het \\\"Ik\\\" gebruikt met uitsluiting van uw medemensen, aangenaam is voor
  God?\\n\\nZeg niet \\\"Godsdienst is privaataak\\\", evenmin als uw geboorte een
  privaataak is.\\n\\nU kunt niet all\u00e9\u00e9n geboren worden; u kunt niet all\u00e9\u00e9n
  leven; u kunt zelfs niet all\u00e9\u00e9n sterven, want uw dood is verbonden met
  eigendom of tenminste met begrafenis.\\n\\nU kunt niet all\u00e9\u00e9n godsdienst
  beoefenen, evenmin als u all\u00e9\u00e9n kunt liefhebben.\\n\\nWat zou er gebeuren
  met uw vaderlandsliefde, als u zou zeggen: \\\"Patriottisme is privaataak\\\"?\\n\\nWanneer
  u de enige bewoner van Amerika was, zou u dan vaderlandsliedvend zijn?\\n\\nWanneer
  u de enige persoon in een stad was, zou u dan weldadig kunnen zijn?\\n\\nWanneer
  u dan niet all\u00e9\u00e9n vriendelijk of all\u00e9\u00e9n opofferend of all\u00e9\u00e9n
  edelmoedig kunt zijn, hoe kunt u dan in Godsnaam verwachten all\u00e9\u00e9n godsdienstig
  te zijn? Daar edelmoedigheid een naaste insluit, daar vaderlandsliefde medeburgers
  insluit, sluit godsdienst medemensen in met betrekking tot uw en hun verhouding
  tot God.\\n\\nDe beste dingen van het leven ontstaan door solidariteit en gemeenschap.\\n\\nGod
  zei tot Hydrogenium en Oxygenium: Zeg \\\"wij\\\" en we hebben oceanen en schuimende
  watervallen.\\n\\nDe musicus zegt tegen de verspreide noten, zeg \\\"wij\\\" en
  we hebben een symfonie.\\n\\nDe zon zegt tot de planeten, zeg \\\"wij\\\" en we
  hebben een zonnestelsel.\\n\\nUw geest zegt tegen idee\u00ebn en woorden, zeg \\\"wij\\\"
  en we hebben talen.\\n\\nAmerika zegt tegen de Amerikanen, zeg \\\"wij\\\" en we
  hebben een democratie.\\n\\nZelfs de dieren, die \\\"wij\\\" zeggen, overleven in
  de strijd om het bestaan: de bijen en de mieren en de vogels. Maar de dinosaurus
  en de ichthyosaurus, die in afzondering rondzwierven en het leven tot een privaataak
  maken, verdwenen van de aarde.\\n\\nStel u nu de belangrijke vraag: Hoe krijg ik
  contact met Christus de Verlosser?\\n\\nHoe redt Hij mij? Hoe kom ik Zijn waarheid
  en Zijn wil te weten? Hoe ontvang ik Zijn leven? Krijg ik contact met Hem als een
  enkeling door over Hem te lezen en liederen tot Hem te zingen, of krijg ik contact
  met Hem in vereniging en in gemeenschap?\\n\\nEen manier om die vraag te beantwoorden
  is te vragen hoe de mensheid in contact met God kwam v\u00f3\u00f3r de komst van
  Christus.\\n\\nWas godsdienst een privaataak of was ze corporatief? Trad God in
  verbinding met de mens direct of indirect, door een ras of een gemeenschap?\\n\\nDoorzoek
  de H. Schrift. U zult dan vinden, dat God altijd in verbinding trad met de mens
  door menselijke gemeenschappen of rassen of zedelijke lichamen, geleid door een
  goddelijk gekozen hoofd.\\n\\nHet boek Genesis verhaalt, dat de geschiedenis van
  de mensheid zou zijn een oorlog niet tussen individuen, maar tussen twee zaden,
  twee rassen, twee hele gemeenschappen: de macht van de duisternis en de macht van
  het licht.\\n\\n\\\"Ik zal vijandschap wekken tussen u en de vrouw, tussen uw kroost
  en haar kroost; dit zal u de kop verpletteren, maar gij zult loeren naar zijn hiel\\\"
  (Genesis 3, 15).\\n\\nHet hoofd van de gemeenschap van het kwaad was Satan; het
  onzichtbare hoofd van de gemeenschap van het goede was God, maar God koos altijd
  een zichtbaar hoofd van die gemeenschap om in Zijn naam te handelen.\\n\\nEerst
  was het No\u00eb, later kwamen de nieuwe hoofden van zijn nieuwe geestelijke gemeenschap:
  Abraham, Isaak en Jacob. Aan deze gemeenschap belooft God zegening en redding.\\n\\nLater
  was het Mozes, die God koos als hoofd van Zijn uitverkoren volk en door wie Hij
  aan Zijn natie beloofde: \\\"Ik zal uw God zijn en gij zult weten dat Ik Jahweh,
  uw God ben, die u redt uit de slavernij van Egypte\\\" (Exodus 6, 7).\\n\\nEen overeenkomst
  of contract was gesloten tussen deze gemeenschap en God, waarin God beloofde hen
  te zegegen, indien zij aan Zijn wet wilden gehoorzamen en wilden worden Zijn betrouwbare
  getuigen en de brengers aan de wereld van de Messias, de \\\"Verwachte van de Naties\\\",
  de Redder van de wereld.\\n\\nNa Mozes kwamen Jozue en David en de profeten.\\n\\nGod
  volgde altijd dezelfde methoden.\\n\\nHij deelde Zijn beloften nooit mee aan bepaalde
  personen in de wereld in het algemeen, maar aan Zijn uitverkoren volk door een gekozen
  patriarch of leider of koning of profeet.\\n\\nWanneer God een nieuw of speciaal
  voorrecht aan de gemeenschap wilde geven, veranderde Hij de naam van het hoofd,
  bijvoorbeeld Abram in Abraham, Jacob in Isra\u00ebl.\\n\\nDeze gemeenschap was niet
  altijd betrouwbaar; ze verviel soms tot afgediendienst, maar in weervul van haar
  afwalingen, was God met haar als Zijn instrument, leidende, controlerende, zodat
  wat ook gedaan werd, Zijn doel nooit faalde.\\n\\nHet was altijd de gekozen gemeenschap
  of het zedelijk lichaam en nooit een afzonderlijke persoon, die Gods openbaring
  ontving.\\n\\nTen tijde van de Zondvloed zal ieder individu wel gaarne zijn eigen
  boot gehad willen hebben, maar God redde hen in een ark onder Zijn eigen Goddelijk
  aangestelde Kapitein.\\n\\nDoor de hele Joodse geschiedenis heeft de gemeenschap
  altijd de eerste plaats en de grootste straf, die op een individuele Jood kon worden
  toegepast, was uitgesloten te worden uit deze gemeenschap. Zelfs heden is de zwaarste
  straf, die aan een orthodoxe Jood kan worden opgelegd, uit de synagoge gebannen
  te worden, wat gedaan is met Spinoza.\\n\\nZo kwam het, dat het belangrijkste woord
  in het Oude Testament het woord was, dat deze gemeenschap of congregatie of soci\u00ebt\u00e9it
  uitdrukte. Dat woord was K\u00e1h\u00e1l.\\n\\nOmstreeks 200 jaar voor Christus
  vertaalden de Joden hun geschriften in het Grieks, omdat zoveel Joden ver van Isra\u00ebl
  in een Griekse beschaving leefden. Toen de vertalers aan het Joodse woord K\u00e1h\u00e1l
  kwamen, vertaalden zij dit door het Griekse woord \\\"ecclesia\\\", dat betekent,
  dat zijn leden werden opgeroepen uit de wereldlijke naties.\\n\\nToen uiteindelijk
  de Messias kwam in de persoon van Jezus Christus, waarschijnlijk Goden waarlijk
  mens, was het slechts natuurlijk te verwachten, dat God op dezelfde wijze met de
  mensheid zou handelen, als Hij dit tevoren deed, namelijk door een Gemeenschap met
  een Hoofd, dat Hij zelf zou kiezen.\\n\\nEen \\\"ecclesia\\\" bestond al, toen God
  Zijn Zoon zond, geboren uit een vrouw, geboren onder de wet (Galaten 4, 4).\\n\\nOnze
  Heer werd geboren in het centrum van een goddelijk gekozen gemeenschap of ecclesia.\\n\\nGod,
  die in vroeger tijden sprak door de profeten, zou nu spreken door Zijn Zoon om de
  volheid der openbaring te schenken.\\n\\nToen de volheid der tijden gekomen was,
  wilde God Zijn ecclesia verheffen tot de volheid van waarde en macht en genade.\\n\\nEvenals
  Hij eens tevoren Abraham, Mozes en David benoemd had tot hoofden, zo wilde Hij nu
  iemand als het Hoofd aanwijzen.\\n\\nDaar nieuwe macht en privileges te vergeven
  waren, veranderde Hij de naam van deze persoon.\\n\\nZoals Hij Abrams naam veranderde
  in Abraham, Jacobs naam in Isra\u00ebl, zo ook veranderde Hij de naam van de persoon
  die het nieuwe hoofd zou worden van Simon tot Rots (Simon Petrus).\\n\\nIn het Nederlands
  is zijn naam Petrus. Bij ons gaat de woordspeling daardoor verloren, daar Petrus
  en Rots verschillende woorden zijn, maar ze zijn dat niet in de taal die Onze Lieve
  Heer sprak, noch in het Frans, het Grieks, het Latijn en verschillende andere talen.\\n\\nIn
  het Frans bijvoorbeeld betekent \\\"pierre\\\" rots en is eveneens de naam van een
  man.\\n\\nIn het originele Grieks zei Onze Lieve Heer \\\"Uw naam is Simon; voortaan
  zult ge Rots genoemd worden\\\".\\n\\nOp die dag, toen de Rots bekende, dat Christus
  was de Zoon van de Leven-de God, antwoordde de Goddelijke Meester: \\\"Gij zijt
  Petrus en op die steenrots zal Ik Mijn Kerk bouwen en de poorten van de hel zullen
  haar niet overweldigen\\\".\\n\\nVan nu af zou Gods ecclesia gebouwd worden op de
  Rots en het zou voor de hele wereld worden Gods uitverkoren volk voor de uitdeling
  van Zijn Goddelijk Leven, zoals Isra\u00ebl tevoren de gemeenschap was geweest voor
  de uitdeling van Zijn belofte.\\n\\nGeen wonder dat de Rots in zijn eerste toespraak
  op Pinksteren sprak van de voortzetting van Gods plan, dat God heeft vervuld, wat
  Hij door de mond van alle profeten voorzegd had: dat zijn Christus zou lijden (Handelingen
  3, 18).\\n\\n\\\"Hem hebt gij overgeleverd naar het vaste raadsbesluit en de voorkennis
  Gods en door de hand van heidenen aan het kruis geslagen en gedood\\\" (Handelingen
  2, 23).\\n\\nOnze Lieve Heer zei, dat deze nieuwe ecclesia klein zou beginnen, als
  een mosterdzaadje, maar ze zou groeien tot een grote boom \\\"zo dat de vogels in
  de lucht kunnen nestelen onder zijn lommer\\\" (Markus 4, 32).\\n\\nZe zou een nieuwe
  gemeenschap worden met andere idealen en doelstellingen dan de wereld en vandaar
  zou ze door de wereld worden gehaat, zoals Hij gehaat was.\\n\\nZijn ledenaten zouden
  z\u00f3 eng vereind zijn met elkaar en in Hem, dat indien iemand een vriendelijkheid
  bewees aan een medelijmdaat, hem voedsel gaf, of een dronk koud water, het was alsof
  ze het Hem deden.\\n\\nDe samenhang tussen Hem en die gemeenschap, zei Hij, zou
  zijn als de samenhang tussen de wijnstok en zijn takken.\\n\\nDeze nieuwe ecclesia
  of dit lichaam kon daarom niet vergeleken worden met een club, die gevormd wordt
  door mensen, samengekomen voor een gemeen doel.\\n\\nHet was eerder als een levend
  lichaam van welks binneste het leven uitslaat tot het organisme volmaakt is.\\n\\nHet
  zouden niet de mensen zijn, die een bijdrage zouden geven tot Zijn organismie; Hij
  zou het zijn, die hen zou vervullen met leven.\\n\\nWanneer er een menselijke analogie
  voor deze ecclesia zou bestaan, was ze het menselijk lichaam. Zoals het menselijk
  lichaam is samengesteld uit miljoenen kleine cellen, elk zijn eigen individueel
  leven leidend en toch niet in staat afgescheiden van het lichaam te leven, zo zou
  deze nieuwe ecclesia of dit Lichaam samengesteld zijn uit miljoenen kleine cellen,
  elk zijn eigen individueel leven leidend en toch niet in staat afgescheiden van
  het lichaam te leven, zo zou deze nieuwe ecclesia of dit Lichaam samengesteld zijn
  uit miljoenen individuen, die verenigd zijn in Christus.\\n\\nJuist zoals de \u00e9ne
  cel niet gelijk is aan de andere, zoals een arm geen oor is, zoals een oog tegen
  de voet niet kan zeggen: \\\"Ik kan het stellen buiten uw diensten\\\", zo is de
  leraar niet de priester, de missionaris is niet de familie en toch door al hun verschillende
  functies dragen zij bij tot de orde en de schoonheid van het gehele lichaam, omdat
  het \u00e9\u00e9n Onzichtbaar Hoofd, Christus heeft en \u00e9\u00e9n zichtbaar hoofd,
  de Rots, en \u00e9\u00e9n ziel, die de Geest van God is.\\n\\nDe kern van deze ecclesia
  of van dit Lichaam waren de apostelen, die voorbeschikt waren de leer over de wereld
  te verspreiden, alle naties lerende, zelfs tot de voleinding der wereld. Aan deze
  nieuwe ecclesia of gemeenschap beloofde Hij mede te delen Zijn waarheid, Zijn macht
  en Zijn verlossing, die Hij had verkregen door zijn vleeslijk lichaam.\\n\\nMoest
  de waarheid, die Hij leerde, beperkt blijven tot Zijn tijd en Zijn generatie?\\n\\nMoest
  Zijn macht beperkt worden tot hen, die Zijn handen zagen? Moest Zijn heiliging alleen
  gelden voor hen, die opgingen naar de Calvarieberg?\\n\\nOpdat de mensen van Zijn
  tijd niet bevorrecht werden boven ons, gaf Hij aan deze nieuwe ecclesia, aan dit
  nieuwe Lichaam, Zijn waarheid, Zijn macht en Zijn heiliging.\\n\\n\\\"Ik ben de
  Waarheid,\\\" zei Hij (Johannes 14, 5).\\n\\nMaar die waarheid deelde Hij mee aan
  Zijn ecclesia. Hij, die u hoort, hoort Mij; en hij, die u versmaadt, versmaadt Mij
  en hij die Mij versmaadt, versmaadt Hem, die Mij heeft gezonden (Lukas 10, 16).\\n\\nToen
  daarom deze nieuwe ecclesia begon te leren was Hij het, die leerde door hen, net
  als Hij eens leerde door Zijn menselijke natuur.\\n\\nDaar het Gods waarheid was,
  was ze noodzakelijkerwijs onfeilbaar en vrij van dwaling.\\n\\nWanneer de Geest
  de waarheid zelf is, dan is de tong, die spreekt waar en onfeilbaar.\\n\\nHetzelfde
  was waar van Zijn macht.\\n\\nEn Jezus trad op hen toe en sprak: \\\"Mij is alle
  macht gegeven in de hemel en op de aarde. Gaat dus heen; onderwijst alle volken
  en doopt ze in de naam van de Vader en van de Zoon en van de Heilige Geest, en leer
  ze onderhouden al wat Ik u heb geboden\\\".\\n\\n\\\"Zie, Ik blijf altijd bij u
  tot aan het einde der wereld\\\" (Matteus 28, 18-20).\\n\\nDeze goddelijke macht
  deelde Hij aan het hoofd van Zijn nieuwe ecclesia of lichaam mee: \\\"En al wat
  ge op aarde zult binden, zal ook in de hemel gebonden zijn; en wat gij op aarde
  zult ontbinden zal ook in de hemel ontbonden zijn\\\" (Matteus 16, 19).\\n\\nIndien
  u Christus zou zien, terwijl Hij Zijn handen ophief, dan zou u weten, dat Zijn wil
  het beval.\\n\\nHij zei nu dat Zijn wil, Zijn macht en Zijn gezag zouden uitgeoefend
  worden door een ander lichaam, namelijk door Zijn ecclesia. Ongehoorzaamheid aan
  haar zou daarom ongehoorzaamheid betekenen tegenover Hem, evenals een belediging
  van uw lichaam een belediging tegen uw persoon is.\\n\\nUiteindelijk gaf Hij Zijn
  heiliging en Zijn priesterschap aan Zijn nieuwe ecclesia of Zijn nieuw lichaam.\\n\\nZou
  het niet vreselijk zijn, indien Hij het niet deed? Hoe zouden onze zonden vergeven
  worden? Zou Magdalena vergiffenis krijgen en wij niet? Op enigerlei wijze is deze
  macht om zonden te vergeven in de wereld van heden en indien Hij haar zonden vergaf
  door een menselijke natuur, dan zal Hij normaal onze zonden vergeven door andere
  menselijke naturen (personen) in die ecclesia, waaraan Hij de macht gaf toen Hij
  zei: \\\"Wier zonden gij vergeeft, hun zijn ze vergeven en wier zonden gij behoudt,
  hun zijn ze behouden\\\" (Johannes 20, 23).\\n\\nDeze menselijke personen, aan wie
  de macht was gegeven zonden te vergeven zouden niet heilig zijn als Zijn Persoon
  was, maar dat zou de absolutie (vergiffenis) niet in gevaar brengen, want de menselijke
  persoon (natuur) is slechts instrument, niet de oorzaak van de vergiffenis. De zonneschijn
  wordt niet bezoedeld, omdat ze door een vuile ruit schijnt.\\n\\nDe apostelen, zeiden
  wij, waren de kern van deze nieuwe ecclesia, van dit nieuwe lichaam. Door hen en
  hun volgers zou Hij nog altijd voortgaan te leven, te leiden en te heiligen.\\n\\nTot
  de pinksterdag waren zij als chemicali\u00ebn in een laboratorium. We nemen voor
  100% de chemicali\u00ebn, waaruit het menselijk lichaam bestaat, maar we kunnen
  geen menselijk lichaam maken, omdat we het levendmakend, samenbindend element, de
  ziel, niet kunnen scheppen.\\n\\nEvenzo moesten de apostelen wachten tot Christus
  de Heilige Geest van God zond, in hun samenbindende ziel, voor zij het Lichaam van
  Christus of Zijn ecclesia konden worden. De verlossing kon sindsdien doorgaan. Evenals
  Hij een menselijke natuur had aangenomen uit de schoot van Zijn Heilige Moeder,
  overschaduwd door de H. Geest, door wie Hij het ambt van Leraar, Koning en Priester
  uitoefende, zo neemt Hij nu uit de schoot van de mensheid, overschaduwd door de
  Pinkster Geest, een nieuw lichaam aan, een nieuwe ecclesia, waardoor hij nog altijd
  voortgaat te leren, te leiden en te heiligen. In de dagen van Zijn aardse leven,
  werden Christus'' leven en liefde en macht geopenbaard onder de begrensde en gelocaliseerde
  vorm van lippen, handen en voeten; nu na Zijn verrijzenis en hemelvaart worden ze
  geopenbaard door andere menselijke personen, die hij heeft samengebonden en verenigd
  met Zichzelf als Zijn nieuw Lichaam of ecclesia.\\n\\nHet Lichaam van Christus is
  niet alleen een organisatie; het is meer een organisme. Het staat niet meer tussen
  u en Christus als Zijn vleeslijk lichaam zou hebben gestaan tussen u en Zijn vergiffenis.
  Het was door Zijn menselijk lichaam, dat Hij tot u op aarde kwam; het is door Zijn
  mystiek Lichaam of ecclesia, dat Hij nu tot u komt.\\n\\nWanneer u uw zonden belijdt
  aan een priester en de woorden hoort: \\\"Ik ontsla u van uw zonden\\\", dan zou
  u kunnen vragen: \\\"Hoe kan een mens zonden vergeven?\\\" Het antwoord is: \\\"De
  mens kan geen zonden vergeven door middel van de mens\\\". De priester is niet alleen
  de vertegenwoordiger van God, maar hij is ook de vertegenwoordiger van de ecclesia,
  de gemeenschap, waardoor Gods vergiffenis wordt meegedeeld aan de mens.\\n\\nGod
  kan dus onfeilbaar spreken door de menselijke natuur. Hij kan met goddelijk gezag
  door middel van de mens spreken, zoals Hij een kind ergenaam van de hemel kan maken
  door middel van de mens. Dat is het waarom God mens werd.\\n\\nEvenzeer als elk
  contact, dat u met Onze Heer Jezus Christus tijdens Zijn aardse leven zou gehad
  hebben, alleen door Zijn menselijke natuur kon worden verkregen, zo mag u niet verwachten
  nu een ander contact met Hem te krijgen dan door andere menselijke naturen, die
  Zijn ecclesia vertegenwoordigen.\\n\\nBent u verwonderd te horen, dat Christus,
  die met Zijn verheerlijkte menselijke natuur zetelt aan de rechterhand van de Vader,
  nu het Hoofd is van het nieuwe lichaam van de verloste mensheid, dat sinds de dag
  van het eerste pinksterfeest groeit en waardoor Zijn waarheid nog wordt gepreekt,
  Zijn gezag nog wordt uitgeoefend en Zijn vergiffenis nog wordt toegepast?\\n\\nHerinner
  u dan de geschiedenis van de bekering van Paulus, die een paar jaar\\n\\nna de hemelvaart
  van Onze Heer plaats vond.\\n\\nDeze vurige Hebree\u00ebr onder de Hebree\u00ebn
  groeide op met een onheilige haat tegen Christus en christelijke gebruiken en als
  een jonge man bewaarde hij de kleren van hen, die Stefanus, de eerste christen martelaar,
  stenigden. Paulus was niet bepaald een kwetszaar. Hij was een geleerd mens, geoefend
  onder Gamali\u00ebl en zo''n machtig dispu tant, dat de eerste christenen zich dikwijls
  moesten hebben afgevraagd, wie zij na de dood van Stefanus moesten kiezen om met
  hem te redetwisten. In Gods Voorziendheid was het voorbeschikt, dat Paulus een Paulus
  zou weerleggen. Op een dag ging hij op reis naar Damascus, gemachtigd om de christenen
  van die stad te grijpen, te binden en terug te brengen naar Jeruzalem. Brandend
  van haat tegen Onze Heer vertrok hij om de pas ontloken ecclesia te vervolgen.\\n\\nPlotseling
  viel een fel licht op hem en werd hij ter aarde geworpen terwijl een stem als een
  loeiende zee weerklonk die zei: \\\"Saulus, Saulus, waarom vervolgt ge Mij?\\\"
  Het waardeloze vermeette zich de naam van de Almachtige te vragen: \\\"Wie zijt
  Gij, Heer?\\\" En Hij antwoordde: \\\"Ik ben Jezus, die gij vervolgt\\\" (Handelingen
  9, 4-5).\\n\\nSaulus zou juist het lichaam van de gelovigen in de stad Damascus
  neerslaan, precies op dezelfde wijze als Christus'' volgingen vervolgd worden in
  zekere steden van de wereld van he den - en de Stem uit de hemel zegt: \\\"Saulus,
  Saulus, waarom vervolgt ge Mij?\\\"\\n\\nChristus en Zijn ecclesia zijn \u00e9\u00e9n.
  De verrezen Christus brak, slechts vier of vijf jaar nadat Hij de aarde had verlaten,
  de hemelen open om aan Paulus en de wereld te verklaren, dat door Zijn Lichaam te
  bestrijden, u Zijn Hoofd bestrijdt, dat de takken en de wijnstok \u00e9\u00e9n zijn,
  dat wanneer het Lichaam van de Kerk wordt vervolgd het Christus is, die opstaat
  om te spreken.\\n\\nGeen wonder dat de veranderde en bekeerde Paulus Christus even
  goed begreep als de andere apostelen, want hij ook had Zijn Lichaam aangeraakt.\\n\\nNu
  komen wij aan de vraag: Hoe redt Jezus mij?\\n\\nHij redt mij door Zijn Lichaam
  of ecclesia, met dit verschil: Zijn Lichaam is niet fysiek, maar mystiek! Het wordt
  opgebouwd uit menselijke personen, doordrongen van de Heilige Geest.\\n\\nDe enige
  wijze waarop wij verbonden kunnen worden met een andere eeuw, is door een lichaam
  van mensen, een lichaam, dat enigszins op de manier van een natuurlijk lichaam zichzelf
  door de loop der tijden vernieuwt.\\n\\nHet Amerika van heden is verbonden met het
  Amerika van Washington en Lincoln, door het lichaam of gouvernement. Sociale clubs,
  baseball clubs en staalcorporaties hebben nu niet dezelfde leden als tien decennia
  geleden, maar zij hebben hun continuit\u00e9 gehandhaafd door generaties, door nieuwe
  leden.\\n\\nWanneer u ouder dan 30 jaar bent, herinnert u zich twee wereldoorlogen.
  Veronderstel dat u 500 jaar oud was. Dan zou u gekend hebben Shakespeare en Thomas
  More, Vincentius a Paolo en de heilige Theresia.\\n\\nVeronderstel nu dat u meer
  dan 1900 jaar oud was. Dan zou u kunnen zeggen: Ik kende Christus.\\n\\nMaar u zou
  dat niet kunnen zeggen, wanneer u slechts 200 jaar oud was, is het niet?\\n\\nNu
  is het Lichaam van Christus of de ecclesia heden nog bestaan, onafgebroken met Hem
  verbonden. Het kan zeggen: \\\"Ik was bij Christus toen Hij leerde; ik hoorde Hem;
  ik was op de Calvarieberg; ik zag Hem uit de dood opstaan; ik was in de zaal op
  Pinksteren. Ik was bij Petrus en Paulus, toen zij in Rome gemarteld werden. Ik bestond
  v\u00f3\u00f3r het Nieuwe Testament. Ik was al verspreid over het gehele Romeinse
  Keizerrijk v\u00f3\u00f3r \u00e9\u00e9n enkel Evangelie geschreven was en was het
  niet door mij, dan zou de Heilige Schrift heden niet bestaan.\\n\\nHet kan zeggen:
  \\\"Ik kende Augustinus en Cyprianus en Ambrosius. Thomas en Bonaventura. Ik zag
  vijanden komen van buiten en van binnen, maar ik heb een lijkzang boven hun graven
  gezongen en ik zal leven door alle tijden, niet, omdat ik een sterke organisatie
  ben, want mijn leden zijn zwak, maar omdat mijn ziel, die de Geest van God is, onsterfelijk
  is en omdat Mijn onzichtbaar Hoofd beloofd heeft, dat de poorten van de hel mij
  nooit zullen overheersen tot het einde der tijden.\\\"\\n\\nHoe krijgt u contact
  met Christus?\\n\\nZoals de vele kinderen deden, die in Zijn armen genomen werden,
  doordat u ingelijfd wordt in Zijn Lichaam. Geen wonder dat de godsdienst verbijsterend
  is, wanneer u aan uzelf denkt in het hedendaagse New-York en Christus heel ver terug
  in Galilea meer dan 19 eeuwen geleden.\\n\\nWaardoor leert u de geest en de wijsheid
  en de moed van Lincoln het beste kennen?\\n\\nDoor het bezoeken van zijn blokhut
  in Kentucky of door in Amerika te leven, dat zijn gedachtenis vereeuwigd en in ere
  houdt.\\n\\nBehoort u tot hen, die denken over de persoon van Christus als over
  Caesar of Shakespeare; als over Washington of Lincoln?\\n\\nStelt uw godsdienst
  zich Christus voor als iemand, die hier op aarde leefde en nu is weggegaan en met
  wie u alleen gemeenschap kunt hebben door Zijn voorbeeld te volgen of door Zijn
  leerstellingen te lezen? Hebt u ooit gelet op het feit, dat, indien we niet dichter
  tot onze goddelijke Meester konden naderen, dan door Zijn voorbeeld of Zijn leerstellingen,
  Hij nauwelijks zou verschillen van enige grote figuur uit het verleden.\\n\\nWe
  kennen Lincoln en Washington eveneens door hun leerstellingen en hun voorbeeld.
  Toegegeven dat het voorbeeld en de leer van Onze Lieve Heer onvergelijkelijk superieur
  zijn, dan blijft het niettegenstaande hiervan waar, dat indien Christus Zichzelf
  niet kan voortzetten door ruimte en tijd, Hij dan weinig verschilt van iemand, die
  ooit leefde. Indien de christenheid slechts de herinnering aan een groot personage
  is, dat leerde, leefde en leed voor een ideaal in het verleden en tot wie we niet
  dichter kunnen naderen, dan door ons voorstellingsvermogen, dat terugvliegt naar
  Galilea, dan zou het christendom nauwelijks waar zijn, bewaard te blijven.\\n\\nDaar
  Christus waarlijk God en waarlijk mens is, zou Hij in staat zijn te doen, waartoe
  geen mens ooit in staat was, namelijk Zijn leven, Zijn waarheid en Zijn liefde te
  projecteren op de deuren van heiden en op de drempels van onze harten. Dan zouden
  zij, die leefden in Zijn tijd niet bevoordeeld worden in liefde en vergeving boven
  hen, die leven in onze tijd. Wanneer Hij niet de eeuwige tijdgenoot is, is Hij niet
  God.\\n\\nGeen druppel bloed kan bestaan buiten uw lichaam, maar uw lichaam kan
  bestaan zonder die ene druppel bloed, zo kan het Lichaam van Christus leven zonder
  u, maar u kunt niet leven zonder het Lichaam van Christus. Dit betekent \\\"buiten
  de ecclesia geen redding\\\"; alle gedoopte zielen, tenzij zij schuldig weigeren,
  behoren \u00f3f in werkelijkheid \u00f3f in opvatting tot deze \u00e9ne ecclesia,
  gegrondvest door Christus. Zelfs ongedoopte zielen behoren in opvatting ertoe, als
  zij leven volgens Gods wil in overeenstemming met het licht van hun geweten en zij
  als zij de openbaring zouden aannemen, indien zij haar kenden.\\n\\nU wachtte niet
  tot uw eenentwintigste jaar, eer u \u00e9n de Staatsregeling \u00e9n de\\n\\nAmerikaanse
  Geschiedenis ging lezen. U werd geboren uit de schoot van Amerika. Zoals u werd
  geboren uit de schoot van een politieke gemeenschap, zo werd u als een christen
  geboren uit de schoot van Christus\u2019 gemeenschap. U leeft erdoor, voor u het
  weet.\\n\\nZe schept u geestelijk door de geboorte van de geest, zoals uw vaderland
  u schept door de geboorte van het vlees.\\n\\nEen feit is het, dat de ecclesia voorrang
  heeft, zowel logisch als chronologisch, boven zijn individuele leden. Deze ecclesia
  was over het gehele Romeinse Keizerrijk verspreid vo\u00f3r een enkel boek van het
  Nieuwe Testament was geschreven.\\n\\nHet was de Bijbel, die uit de ecclesia groeide,
  niet de ecclesia uit de Bijbel.\\n\\nWanneer u ooit het geluk hebt de hoofdkerk
  van het gehele christendom in Rome te bezoeken, verzoek ik u de ogen boven de graftombe
  van de visser, die Petrus genoemd werd, op te heffen naar de grootste koepel, die
  ooit tegen het gewelf van \u2018s hemels blauw werd geworpen en de woorden te lezen
  die daarin geschreven staan: *Tu es Petrus et supra hanc petram, aedificabo ecclesiam
  meam* - \u201cGij zijt de Rots - dat is de betekenis van Petrus - en op deze Steenrots
  zal ik Mijn Kerk bouwen en de poorten der hel zullen haar niet overweldigen\u201d
  (*Matteus* 16, 18).\\n\\n\u201cEn u zal Ik de sleutels geven van het Rijk der hemelen.
  En al wat gij op de aarde zult binden, zal ook in de hemel gebonden zijn en al wat
  gij op aarde zult onbinden, zal ook in de hemel ontbonden zijn\u201d (*Matteus*
  16, 19).\\n\\nEcclesia! - Het woord, dat de Joden gebruikten om Isra\u00ebl te beschrijven
  als Gods gemeenschap; het eigen woord, dat de Zoon van God zelf gebruikte te Caesarea-Philippi.\\n\\nEn
  die ecclesia was gebouwd op Petrus, Petrus de Rots, die leefde door deze 1900 jaren
  in en door 262 verschillende personen en wiens naam heden (1948) is Pius XII.\\n\\nHet
  woord \u201cecclesia\u201d betekent \u201ckerk\u201d. De katholieke Kerk is het
  mystieke Lichaam van Christus.\\n\\nwordt vervolgd\\n\\nSinds het opkomen van de
  historisch kritische onderzoeksmethode gold de beschrijving van de reis van St.
  Paulus van Cesarea naar Rome als een voorbeeld voor de historische onbetrouwbaarheid
  van de Handelingen der Apostelen en van de Pastoraalbrieven. Er kon immers geen
  route worden gevonden die strookte met de gegevens van Hand. 27 en 28. Het eiland
  Melite bleek onvindbaar te zijn, en Malta was slechts een zeer ontoereikend alternatief.
  Thans heeft Heinz Warnecke de juistheid en de precieze beschrijving daarvan bewezen
  door zijn uitstekende kennis van de zeevaart in de oudheid.\\n\\n**Land in zicht**\\n\\nIn
  de Handelingen der Apostelen schrijft de Evangelist Lukas in de hoofdstukken 27
  en 28 over de reis van de H. Paulus en zijn gevangenschap in Rome. Tijdens deze
  reis heeft Sint Paulus samen met Lukas schipbreuk geleden. Het schip was vertrokken
  uit Cesarea in Palestina. Nadat het eerste deel van de reis langzaam was verlopen,
  vonden zij geen verblijfplaats om te kunnen overwinteren. Hoewel de scheepvaart
  al onveilig was geworden vanwege het ongunstige weer, besloten de schipper en de
  stuurman tot Fenix (Phoinikos), een haven van Kreta, door te varen en daar te blijven
  overwinteren. Tijdens de verdere reis sloeg echter een stormwind neer die Eur\u00e1kulon
  werd genoemd. Het vaartuig werd meegesleurd en kon geen koers meer houden. Meerdere
  dagen was er zon noch maan te zien. Na twee weken dreef het schip in de Adriatische
  Zee, waar land in zicht kwam. Zij herkenden het land niet, maar bespeurden toch
  een bocht met een strand, en besloten het schip daar, zo mogelijk, aan land te zetten.
  Ze stieten op een landtong, en leden schipbreuk. Toen ze gered waren vernamen zij
  dat het eiland Malta (Melite) heette.\\n\\n**Een probleem**\\n\\nZeer terecht hebben
  de vertegenwoordigers van de moderne bijbelexe-gese opgemerkt, dat er moeilijkheden
  zullen rijzen als men de mening dat St. Paulus werkelijk op Malta strandde staande
  wil houden. De beschrijving van de haven van Fenix, die zij wilden bereiken om daar
  te overwinteren, strookt niet met de werkelijkheid. Fenix heeft geen haven die naar
  het zuid- en noordwesten uitziet (Hand. 27. 12) en bovendien heeft er op heel Kreta
  nooit een haven bestaan die op de beschreven haven lijkt. In de Handelingen echter
  schrijft Lukas \u201cze vonden het beter om van daar (Lasea) weg te varen, om zo
  mogelijk Fenix te bereiken, een haven van Kreta, die naar het zuid- en noordwesten
  uitziet, en daar te overwinteren\u201d (Hand. 27. 12). Verder maken alle gegevens
  omtrent wind, weer, klimaat, commando\u2019s... het onmogelijk dat het schip naar
  Malta werd gesleurd.\\n\\nDaarmee staat de bijbelgeleerde voor een probleem. Blijkbaar
  staat er in de Handelingen de Apostelen iets geschreven dat historisch gezien onjuist
  is, want het is duidelijk dat St. Paulus niet op Malta kan zijn gestrand. Malta
  ligt niet in de Adriatische Zee en heeft nooit adders gekend. Toentertijd al leefden
  er christenen en geen barbaren... (Hand. 28) Een andere reisroute was echter nergens
  te vinden. Lukas moet zich hebben vergist!\\n\\nDat zou de gemakkelijkste oplossing
  zijn. In dat geval echter is de Bijbel een onbetrouwbare boek. Men kan niet\\n\\ngelovig
  aannemen wat daarin staat geschreven. Degene die er schrijft kan zich vergissen.
  De lezer van de Heilige Schrift zou dus eerst zelf moeten uitzoeken wat waar en
  wat onwaar is.\\n\\n**Aantrekkelijke oplossing**\\n\\nEen andere, moeilijkere, maar
  wel heel aantrekkelijke oplossing, die gebaseerd is op een ongegronde veronderstelling,
  doet zich voor: Lukas zou nooit de bedoeling gehad hebben te berichten wat er werkelijk
  gebeurd is. Zijn streven zou slechts geweest zijn een geestelijke waarheid mee te
  delen. Dan is Hand. 27 en 28 geen reisverhaal zoals wij het zouden schrijven van
  onze vacantiereis, met precieze opgave van vertrekpunt, -tijd, route, pauzes...
  Er zou dan veeleer Homerus. Hij kent de Griekse vaktermen, kent klimaat en stromingen
  van de Middellandse Zee en de vele wenken van de zeevaarders uit verleden tijden.
  Heinz Warnecke is dus een man die men al lang had kunnen benaderen. Hij was terloops
  ge\u00efnteresseerd in de zeereis van St. Paulus totdat hij haar tot uitdrukkelijk
  object van zijn navorsing maakte. In \\\"Die tats\u00e4chliche Romfahrt des Paulus
  (Stuttgarter Bibelstudien, 2. Auflage, Verlag Katholisches Bibelwerk, Stuttgart
  1989) schrijft hij over het resultaat van zijn werkzaamheden. De Handelingen der
  Apostelen blijkt een bijzonder betrouwbare bron. De zeereis van St. Paulus kan tot
  in de details worden gevolgd. Volgens Hand. 27. 12 was het eerste doel van de reis
  na Kreta de haven Fenix, een haven van Kreta. Een dergelijke haven, die strookt
  met de gegevens uit de Handelingen en die tevens geschikt is waarop St. Paulus reisde.
  Het was bovendien een haven van Kreta ook al ligt hij niet op dit eiland.\\n\\nDe
  door St. Lukas gebruikte vaktermen van de zeevaart zijn Heinz Warnecke allemaal
  bekend. Ze zijn precies en geheel juist. Door middel van zeevaartkundige en klimatologische
  berekeningen is verder voor Heinz Warnecke zeker geworden dat het schip, zoals andere
  beschadigde schepen, afdroef in de Ionische Zee en tenslotte terecht kwam in de
  Adriatische Zee.\\n\\nEr ontbreekt alleen nog het eiland Melite. (Hand. 28. 1) Dit
  eiland lag in de Adriatische Zee (Hand. 27. 27), had een bocht (Hand. 27. 39) een
  landtong (Hand. 27. 41), een geheel vlakke zee (Hand. 27. 28+29), een bepaald klimaat
  met belemmerd zicht, regenbogen en kou (Hand. 28. 2). Er kwamen adders voor (Hand.
  28. 3+4), en haar inwoners werden \u00ab barbaren \u00bb genoemd (Hand. 28. 2),
  die na de missie door St. Paulus christelijk werden. In de nabijheid van de kust
  was een landgoed gelegen dat aan de bevelhebber behoorde, die Publius heette (Hand.
  28. 7). Geen van deze elementen is van toepassing op Malta. Veeleer passen zij tot
  in de puntjes precies op een klein Grieks schiereiland in het zuidwesten van het
  eiland Kefalonia. Daar treft men aan de bocht, de vlakke zee. Van alle West-Griekse
  eilanden vindt men slechts hier de vlakke zee zoals die beschreven wordt in de Handelingen
  der Apostelen. De klimatologische gegevens zijn hier van toepassing, en ook leefden
  er in de tijd van de reis van St. Paulus \u00ab barbaren \u00bb, die door een Romeinse
  ambtenaar werden geregerd. Zijn naam was waarschijnlijk \u00ab Publius Primus \u00bb.
  Bovendien had deze ambtenaar zijn paleis in de nabijheid van de landingsplaats,
  die groot genoeg was om er meer dan 200 mensen te kunnen verzorgen. Het eiland is
  bekend om de moeraskoorts en herbergt de dodelijke zandslang.\\n\\nProfessoren noemen
  het een bijzondere gebeurtenis: een buitenbeentje maakt de \\\"kritische wetenschappers\\\"
  beschamend. En weer doorstaat de Bijbel de toets van de wetenschap.\\n\\n**Kortzichtig**\\n\\nHeinz
  Warnecke, wiens wetenschappelijk onderzoek zich vooral richt op de geografische
  opgaven in de geschriften van Homerus, is een vakman op het gebied van de oude zeevaart.
  Hij is thuis in de zeevaartsbevelen, winden en aardrijkskundige gegevens van de
  tijd van\\n\\n**Tot in de puntjes precies**\\n\\nWarnecke bewijst nu dat Fenix uit
  de Handelingen der Apostelen deze haven Phoinikos is. Phoinikos is een haven die
  naar het zuid- en noordwesten uitziet en geschikt is voor het overwinteren van grote
  Alexandrijnse schepen zoals dat\\n\\nDe grote basiliek van Milaan was tot de laatste
  hoek gevuld met een opgewonden volksmenigte. Het hoog gelegen koor fonkelde van
  gouden herdersstaven en mijters. De bisschoppen van de Noord-Italiaanse kerkprovincie
  overlegden hier samen met de geestelijkheid van de stad over de keuze van de nieuwe
  opperherder van Milaan. Uur na uur duurden de onderhandelingen reeds, steeds dichter
  werd het gedrang van het wachtende volk in de Dom, steeds groter werd het ongeduld,
  en nog altijd kon men niet tot een eenstemmige uitslag komen. Van de juiste bezetting
  van de vacante bisschopszetel hing wel veel af voor het welzijn van het rijk en
  het heil van de kerk; want de tijd was donkerder en onheilspekkender dan ooit te
  voren. Hunnen en Goten stonden voor de poort van het reeds in zijn kracht gebroken
  Romeinse Rijk. Tweespalt verscheurde de Kerk. De dwaalleer van Arius, die de godheid
  van Christus ontkende, stak brutaler dan ooit de kop op. Zelfs de overleden bisschop
  was aanhanger van deze secte geweest. Ook in Milaan waren de geesten verdeeld. Verbitterd
  stonden de katholieken en Arianen tegenover elkaar. Beide gezindten streedden er
  naar, de bisschopszetel met een van hun geestverwanten te bezetten.\\n\\nReeds lang
  was de eerbiedige stilte, die de heilige plaats betaamde, geweken voor een lawaaierige
  onrust. In het priesterkoor maakten de bisschoppen evenveel ruzie met elkaar als
  in het schip van de kerk de bakkers, schoenmakers en zeepzijdere. Hettumult nam
  steeds meer toe en dreigde tenslotte tot handtastelijkheden te leiden. Plotseling
  besteeg een man in witte, met purper afgezette tuniek de marmeren preekstoel. Hij
  was aan zijn rijkversierde schoudersjerp herkenbaar als de hoogste keizerlijke beambte
  van de Noord-Italiaanse provincie. Hij was van hoge gestalte, zijn lichte ogen fonkelden
  van een vurige geest, een sterke wilskracht, maar ook van edele, welwillende goedheid.
  Het was Ambrosius, de consul van Insubri\u00eb, Aemili\u00eb en Liguri\u00eb. Nauwelijks
  had hij de kansel betreden of een eerbiedig zwijgen, vol verwachting, maakte een
  einde aan het razen en tieren. De keizerlijke beambte sprak slechts een paar woorden,
  herinnerend aan de heiligheid van de plaats en de hoge verantwoording van het ogenblik.
  Hij wilde de preekstoel al weer verlaten toen plotseling een kinderstem ergens uit
  de duizendkoppijge menigte opklonk: \\\"Ambrosius bisschop!\\\"\\n\\nEen glimlach
  gleed over het gezicht van de consul bij deze kinderlijke roep. Maar wat nu gebeurde
  bracht hem in grote verwarring en verlegenheid. De roep van het kind werd overgenomen,
  vond een honderdvoudige weerklink: \\\"Ambrosius bisschop! Ambrosius moet bisschop
  worden!\\\" De bisschoppen en priesters in het koor hielden op, keken elkaar verwonderd
  aan. Maar toen was het alsof ook bij hen een plotseling licht opging. Dat was de
  oplossing van alle raadsels en moeilijkheden. Een edeler man dan de consul was er
  niet in Milaan. Sinds hij uit zijn geboortestad Trier in de noordelijke Italiaanse
  provincies was gekomen, had hij alleen maar goed gedaan.\\n\\nRechtvaardig en onkreukbaar
  had hij iedere beslissing genomen en allen die om bescherming smeekten met mildheid
  tot zich genomen. Ambrosius was de enige man in Milaan, wie iedereen in eerbiedig
  vertrouwen was toegedaan. Zo gebeurde het, dat door de roep van een onmondig kind
  aan alle onderhandelingen een eind gemaakt werd. Ambrosius moest bisschop worden,
  en niemand anders.\\n\\nTevergeefs verweerde de consul zich tegen de hem toegedachte
  waardigheid. Tevergeefs verklaarde hij zo''n onderscheiding geheel onwaardig te
  zijn. Hoe meer hij tegenstribbelde, des te vastbeslotener volhardten geestelijkheid
  en volk in de gemaakte keus. ''s Nachts probeerde hij Milaan heimelijk te verlaten,
  maar in het donker verdwaalde hij en toen ''s morgens de zon opging was hij weer
  uitgekomen bij de Romeinse Poort, waardoor hij vier uur tevoren Milaan had verlaten.
  Men herkende hem,\\n\\nbracht hem naar het praetorium terug en nu hield het volk
  van Milaan dagen en nachten achtereen de wacht voor het huis van de gekozenen, om
  een tweede vlucht te voorkomen. Toen ook keizer Valentinianus I verheugd zijn instemming
  met de keus gaf, was Ambrosius niet langer in staat weerstand te bieden; hij liet
  zich tot opperherder van de grote Noord-Italiaanse kerkprovincie wijden.\\n\\nZijn
  eerste ambtshandeling bestond er in dat hij zijn bezittingen verkocht en de opbrengst
  aan de armen schonk, daar hij als bisschop van de kerk geheel vrij en in geen enkel
  opzicht aan aards goed gebonden, zijn ambt wilde uitoefenen. Aan God en de hem toevertrouwde
  kudde behoorde voortaan geheel zijn dagtaak, al zijn kracht, iedere beweging van
  zijn sterk, edel hart. Hij woonde in gemeenschap met zijn geestelijken en vormde
  met hen een echte godsdamfamilie, die ieder huis in zijn diocees tot voorbeeld diende.
  Iedere zondag stond hij op de kansel van zijn basiliek en predikte Gods Woord, en
  zeker was de grote Augustinus niet de enige, wie de preek van de bisschop ontroerde
  en tot bekeering bracht. Heerlijk klonken de Latijnse hymnen en liederen in de kerken.
  Eeuwenlang schreef men het plechtige gezang Te Deum toe aan Ambrosius en het niet
  toe, dat ook maar \u00e9\u00e9n katholieke kerk in de handen van de Arianen gerakken.
  Juist deze onbuigzame standvastigheid bracht hem in botsing met het Ariana''s gezinde
  keizerlijke hof.\\n\\nOp een dag, in het begin van de vastentijd in 385, verscheen
  een bode in het huis van de bisschop en ontbood hem naar het keizerlijk paleis.
  Omringd door zijn ministers en officieren ontving hem de pas 13 jaar oude keizer
  Valentinianus II, wiens troon en leven Ambrosius eens gered had, en eiste van hem
  de uitlevering van de Portiaanse kerk aan de Arianen. Een glimlach trok om de mond
  van de Milanese opperhonder. Dacht men werkelijk hem te intimideren door de glans
  van de keizerlijke hoofstaatsie, die zich hier voor hem ontvouwde? Wel, men zou
  spoedig genoeg inzien dat men zich vergist had.\\n\\n\\\"Neen, Heer\\\", antwoordde
  Ambrosius vol rustige ernst, \\\"ik kan aan uw verlangen geen gevolg geven. Voor
  mij zou het een verraad zijn, voor u een ongeluk. Ofschoon u keizer bent, hebt u
  geen recht met geweld in het huis van de meesteenvoudige priv\u00e9-persoon binnen
  te dringen, en toch wilt u zich aanmatigen, het huis van God roofzuchtig te overvallen?\\n\\n''n
  Diepe blos vloog over het gelaat van de keizerlijke knaap. Zenuwachtig friemelde
  hij aan de gouden franjes van zijn purperen mantel. Even dacht hij na welke redenen
  zijn moeder Justina, die achter zijn eis stond, hem had ingeprent, maar erkwam er
  hem geen in gedachten.\\n\\n\\\"Maar ik wil toch ook een basiliek hebben\\\", stamelde
  hij tenslotte met kinderlijke trots. Maar Ambrosius antwoordde hem met de gealtausuitdrukking
  van een vader, die een dwaze wens van een jongen afslaat.\\n\\n\\\"Nee, je mag er
  geen hebben. De keizer heeft zijn paleizen, hij moet de bisschop zijn kerken laten.\\\"\\n\\nKeizerin
  Justina mengde zich erin, bracht redenen naar voren die haar zoon vergeten had,
  maar ook tegenover haar bewaarde Ambrosius zijn onverbiddelijke standvastigheid.\\n\\nIntussen
  schoolde een geweldige volksmenigte samen voor het paleis. Laawaai drong door tot
  de troonzaal en verstoorde de onderhandelingen. Een hoveling kwam met ''n wit gezicht
  binnen en meldde, dat de Milanese hun bisschop wensten te zien, daar zij vreesden
  voor zijn welzijn. Justina verbleekte tot in haar lippen. De keizerlijke jongen
  sprong verstoord van zijn troonzetel op en wierp zijn officieren radeeloze blikken
  toe.\\n\\nSteeds dreigender werd de houding van het volk. Reeds klonken bijslagen
  tegen de poort van het paleis. Stenen vlogen tegen de ramen.\\n\\n\\\"Spreek hen
  toe, Ambrosius!\\\", gebood de keizerin sidderend van angst en wrok.\\n\\n\\\"Wat
  moet ik hun zeggen?\\\", vroeg de bisschop.\\n\\n\\\"Zeg hun, dat de basiliek katholiek
  blijft\\\", antwoordde Justina tandenkaarsend van schaamte. De orde was spoedig
  weer hersteld, en in een ware triomftocht brachten de Milanese hun bisschop naar
  zijn woning terug.\\n\\nAls men echter gedacht had, dat de storm nu voor goed was
  afgeslagen, dan moest men weldra zijn vergissing inzien.\\n\\nOp vrijdag in de passieweek
  verschenen een paar hovelingen voor Ambrosius en eisten opnieuw de uitlevering van
  een godshuis aan de Arianen, en deze keer verlangden zij niet de Portiaanse kerk,
  maar de nieuwe grote basiliek. Weer wees de bisschop de eis vastbesloten af. Op
  Palmzondag droeg hij in de basiliek het Heilig Offer op. Tijdens de Mis echter verspreidde
  zich het nieuws, dat de Arianen nu de Portiaanse kerk bezetten. Dadelijk ging een
  geweldige volksmenigte op weg daarheen. Het kwam tot een ernstig botsen, en het
  was slechts aan de bedachtzaamheid van Ambrosius te danken, dat eigenlijke gewelddaden
  uitbleven. De Arianen werden weer teleurgesteld. De Portiaanse kerk bleef in het
  bezit van de katholieken.\\n\\nKeizerin Justina kookte van woede. Maar de bisschop
  bleef onwrikbaar.\\n\\n\\\"De keizer mag van mij verlangen wat hij wil\\\", zei
  hij tot een nieuwe afvaardiging van het hof, \\\"mijn goed of geld, ik zal hem niets
  weigeren, ofschoon dit alles minder aan mij toebehoort dan aan de armen. Maar de
  heilige voorwerpen behoren de keizer niet toe. Als hij mijn vaderlijk erfdeel nodig
  heeft, kan hij het nemen. Als hij mijn leven nodig heeft, hier is het. Moet ik de
  gevangenis of de dood in? Met vreugde ga ik er heen. Ik zal mij niet achter de bescherming
  van het volk verschansen, niet bij het altaar vluchten, niet om mijn\\n\\nleven
  bedelen. Maar ik geef mijn leven om het altaar te verdedigen.\u201d\\n\\nOp Woensdag
  in de Goede Week trok krijgsvolk naar de nieuwe basiliek, Ambrosius liet zonder
  aarzelen aan de soldaten zeggen dat ieder die deelnam aan de geplande tempelroof
  buiten de kerkgemeenschap gesloten zou worden. Met het oog daarop weigerden de soldaten
  het bevel van de keizer te gehoorza- men. Valentinianus, die een opstand vreesde,
  zag zich gedwongen uiteinde- lijk van zijn verlangen af te zien. De kerk bleef behouden
  voor de katholieken.\\n\\nAmbrosius verleende de jonge kei- zer later nog de trouwste
  diensten en toen Valentinianus op 15 mei 392 door de beulskechten van de troonrover
  Maximus vermoord was, hield hij onder tranen een aangrijpende lijkrede voor hem.\\n\\nNog
  eens toonde Ambrosius zijn onwrikbare trouw jegens God en Zijn wet. In Tessalonika,
  de hoofdstad van Macedoni\u00eb, had de stadhouder een be- roemde wagenmennner wegens
  een schanddaad in de gevangenis laten wer- pen. Toen echter de dag van het circu-
  spel aanbrak, eiste het volk de vrijlating van de geliefde sportheld. Daar de stad-
  houder weerstand bood aan dit verlan- gen, kwam het tot een opstand. De ra- zende
  menigte bestormde het paleis van de stadhouder, vermoorde hem, wierp zijn beambten
  op straat en sleepte hen voort tot zij dood waren.\\n\\nTerecht was keizer Theodosius,
  die zijn residentie in Milaan had, vertoornd over de buitensporigheden. Hij besloot
  Tessalonika vreselijk te straffen. Teve- geefs probeerde Ambrosius hem tot clem-
  entie en mildheid te bewegen. Toen in de Macedonische hoofdstad weer cir- cusspelen
  plaatsvonden, drongen op bevel van de keizer Romeinse soldaten de arena binnen en
  sloegen en staken allen neer, schuldigen zowel als onschul- digen, mannen, vrouwen,
  kinderen en grijsaards.\\n\\nToen Ambrosius van het monster- achtige bloedbad hoorde,
  schreef hij een brief aan de keizer, waarin hij hem op- riep, voor zijn zware schuld
  kerkelijke boete te doen, omdat hij anders zou moeten weigeren in de toekomst het
  Heilig Offer op te dragen in zijn aanwezigheid. Toch begaf Theodosius zich op een
  dag met zijn gevolg naar de basiliek, alsof er niets was voorgevallen. Maar toen
  hij het voorplein overschreed en zijn voet op de drempel van het heiligdom wilde
  zetten, trad Ambrosius hem in vol ornaat met opgeheven herdersstaf tegemoet en zei:\\n\\n\u201cIk
  zie, keizer, dat u zich de zwaarte van uw misdaad niet bewust bent. Pas op dat u
  over het purper niet de zwakheid morst, die het bedekt! Hoe kon u het wagen, Gods
  heiligdom te betreden en uw nog van onschuldig bloed druipende handen op te heffen?\u201d\\n\\n\u201cOok
  David heeft gezondigd, maar God heeft hem vergeven\u201d, bracht de grote Theodosius
  met gebogen hoofd hier tegen in. \u201cWel nu\u201d, antwoordde de bisschop, \u201cvolg
  dan ook David na in de boete, nadat u zoals hij in de schuld geraakt bent!\u201d
  Toen keerde Theodosius ontstaan om en schreed naar zijn paleis terug. Hij was groot
  en edel genoeg om, zoals ieder andere zondaar de verlangde kerkelijke boete te doen,
  om zo de ver- zoening van de Kerk te verkrijgen.\\n\\nOp Goede Vrijdag van het jaar
  397 stierf de grote bisschop, in wie alle deug- den van een edele Romein, verbonden
  met christelijke heldengrootheid nog eenmaal opgeschitterd waren. Voor alle eeuwen
  bleef hij het voorbeeld van een mannoedige en onverschrokken bis- schop. Eens sprak
  hij voor de Romeinse schijnkeizer Eugeni\u00fcs het woord, dat voor alle tijden
  een opperherder waardig is: \u201cIk wens alleen God en ik ben niet gewend, de gunst
  van welke mens ook hoger aan te slaan dan de genade van Christus.\u201d Voor zijn
  sterven echter mocht hij getroost zeggen: \u201cIk heb zo geleefd, dat ik zonder
  schande verder zou kun- nen leven. Maar ik ben niet bang voor de dood, want wij
  hebben een goede Heer!\u201d\\n\\nuit: \u201cDer endlose Chor\u201d van Wilhelm
