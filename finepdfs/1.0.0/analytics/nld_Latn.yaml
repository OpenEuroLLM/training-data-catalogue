  doelstelling van de\u00a0instelling. Wat\u202fwil de instelling bereiken?\\n\\nHoe
  krijgt de instelling inkomsten?\\n\\n1. het verminderen van de productie en consumptie
  van veehouderij, producten zoals vlees en zuivel vanwege de gevolgen voor gezondheid,
  milieu, natuur en dierenwelzijn.\\n3. het verrichten van alle verdere handelingen,
