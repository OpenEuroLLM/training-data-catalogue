  op de tijdlijn.\\n\\nStap 3\\n\\nHoeveel dagen van de maand is dat op de tijdlijn?\\n\\n31:  10
  (dit is een vast aantal) (x) 4 (dit is het getal na de decimale punt uit Stap 2)
  =\\n\\n12.4 dagen\\n\\nOp de tijdlijn wordt 12 biljoen jaar weergegeven door 2 maanden
  en 12,4 dagen vanaf het ontstaan van het universum. The datum op de tijdlijn is
  13 maart.\\n\\nOMCIRKEL\\nhet juiste\\nantwoord\\n\\ne Schrijf het antwoord voor
  jouw gebeurtenis op.\\n\\n15 biljoen -\\n\\nbiljoen =\\n\\nbiljoen jaar na het ontstaan
  van het\\n\\nuniversum.\\n\\nf\\n\\nE\u00e9n maand op de tijdlijn vertegenwoordigd
  1.25 biljoen jaar.\\n\\nbeantwoord vraagen\\n\\nHoeveel jaar na het ontstaan van
  het universum vond jouw gebeurtenis plaats op de\\n\\ntijdlijn?\\n\\nbiljoen jaar
  :          1,25 biljoen jaar\\n\\nna het begin van de tijdlijn.\\n\\ng In welke
