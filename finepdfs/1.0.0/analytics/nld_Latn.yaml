  "\"KWINTESSENS (28.01) \u2013 Brahman als het Zelf\\n\\nBrahman kan vertaald worden
  als '' groei zonder beperking ''( in ruimte of tijd), dus de absoluut grootste.\\n\\nVolgens
  de meesters van de  Advaita kan met name door de Upanishaden als een geldig middel
  van kennis een directe perceptie van Brahman verkregen worden.\\n\\nBrahman is de
  enige Werkelijkheid; het overstijgt denken, verwoorden en zintuiglijk ervaren. Het
  wordt beschouwd als ongebonden Wezen, eeuwig bestaande, grenzeloos in ruimte en
  tijd, onveranderlijk, ongerept, verstoken van kwaliteiten, hoedanigheden, naam of
  vorm. Het is niet aan geboorte onderworpen, afname, toename, volgroeidheid, verval
  en oplossing; niets is eraan gelijk of verschillend ervan. Het wordt ook wel beschreven
  als zuiver Weten.\\n\\nHet wordt ook beschouwd als de doelmatige en stoffelijke
  oorzaak van het zichtbare universum, de aldoordringende geest van het universum,
  de essentie waarvan alle wezens zijn voortgekomen en waarin zij terug in opgaan.
  De volledige fenomenale wereld van wezens, kwaliteiten, handelingen, alle gebeurtenissen,
  etcetera, wordt bezien als een illusoire transpositie van het onvergankelijke substraat,
  dat het Brahman is.\\n\\nDe Upanishaden vereenzelvigen ook het Brahman met het Universele
  Zelf. Wat Brahman, de enige Werkelijkheid, is en, nog belangrijker, wat Brahman,
  de enige Werkelijkheid, niet is, wordt doorheen de gehele tekst van de Ribhu Gita
  uiteen gezet.\\n\\nHet begrip Brahman is zeer goed vergelijkbaar met het Chinees
  begrip Tao. De ''Tao Te Tjing'' opent dan ook als volgt:\\n\\n```\\n\\\"Het tao
  dat verwoord kan worden, is niet het eeuwig Tao. De naam die genoemd kan worden,
  is niet de eeuwige Naam. Zonder naam is het de oorsprong van hemel en aarde, met
  naam is het de moeder van alle dingen (1) ......\\\"\\n```\\n\\n(1) Het benoembare
  Tao (lees : Brahma) als schepper heeft als substraat het onnoembare Tao ( lees :
  Brahman)\\n\\nWill van den Berg/www.advaita-avadhuta.eu\"", "\"Geschiedenis van
  het universum\\n\\nJe gaat de volgende vragen beantwoorden: Hoe oud is het universum?
  En wanneer vond een\\n\\naantal belangrijke gebeurtenissen in het universum plaats?\\n\\n1
  Wat is een jaar?\\n\\na\\n\\nHoeveel maanden zijn er in een jaar?\\n\\nmaanden\\n\\nb\\n\\nIn
