  van de verordening individuele voorzieningen maatschappelijke ondersteuning\\n\\nDit
  punt wordt bij de volgende vergadering als hamerstuk geagendeerd.\\n\\n13. Vragenuur\\n\\nEr
  stonden nog twee vragen van Ons Belang open van de vorige vergadering: Op de vraag
