  bijkomende vaart te 15.20 uur (x).\\n- Op 28-6-1975 bijkomende afvaarten te 06.20
  uur (x) en te 15.20 uur (x).\\n\\n**Afvaarten uit Folkestone:**\\n- Alle dagen te
  19.30 uur (x) en te 23.45 uur (x).\\n\\n(x) Nemen ook voertuigen.\"", "\"Begane
  grond, De Koog 7 te Amersfoort\\n\\nDe plattegronden zijn ter indicatie en geproduceerd
  voor promotionele doeleinden.\\n\\nAan de plattegronden kunnen geen rechten worden
  ontleend. \u00a9 topr.nl\\n\\n1e Verdieping, De Koog 7 te Amersfoort\\n\\nDe plattegronden
  zijn ter indicatie en geproduceerd voor promotionele doeleinden.\\nAan de plattegronden
  kunnen geen rechten worden ontleend. \u00a9 topr.nl\\n\\nBegane grond, De Koog 7
  te Amersfoort\\n\\nDe plattegronden zijn ter indicatie en geproduceerd voor promotionele
  doeleinden.\\n\\nAan de plattegronden kunnen geen rechten worden ontleend. \u00a9
  topr.nl\"", "\"Pioniers voor Generatie Rookvrij\\n\\nPersconferentie 28/5/18\\n\\nVolgende
  settings spelen een voortrekkersrol voor Generatie Rookvrij. Zij maken locaties
  waar vaak kinderen komen rookvrij, eventueel met een beperkt aantal rookzones uit
  het zicht van de kinderen. Generatie Rookvrij hoopt dat andere settings het voorbeeld
  van deze pioniers zullen volgen.\\n\\n1. Gemeenten (speeltuinen en sportterreinen)\\n\\n**
  Boechout\\n\\nVolgende zes gemeenten komen op voor het recht van kinderen om op
  te groeien in een rookvrije, gezonde en veilige omgeving. De gemeenteraden of schepencolleges
  van deze gemeenten namen in het kader van Generatie Rookvrij al de principi\u00eble
  beslissing om de speeltuinen en sportterreinen die eigendom zijn van de gemeente
  rookvrij te maken en om de eigenaars van andere speel- en sportterreinen in de gemeente
  op te roepen dit voorbeeld te volgen.\\n\\n** Leopoldsburg\\n** Harelbeke\\n** Mechelen\\n**
  Waregem\\n** Zottegem\\n\\n2. Ziekenhuizen\\n\\n** Brussel: Universitair Kinderziekenhuis
  Koningin Fabiola\\n\\nVolgende ziekenhuizen hebben hun ziekenhuisdomein rookvrij
  gemaakt met rookzones uit het zicht of hebben de principi\u00eble beslissing genomen
  om dat te doen.\\n\\n** Namen: Clinique CHU UCL Site Mont-Godinne\\n** Luik: CHU
  de Li\u00e8ge Site Notre-Dame des Bruy\u00e8res\\n\\n3. Kinderboerderijen\\n\\n**
  Neerhof in Dilbeek\\n\\nVolgende vier kinderboerderijen beslisten in het kader van
  Generatie Rookvrij om hun domein rookvrij te maken.\\n\\n** Bokkeslot in Deerlijk\\n**
  La Prairie in Moeskroen\\n** Diggie in Brakel\\n\\n4. Winkelketen Kruidvat\\n\\nKruidvat
  besliste als eerste grote winkelketen begin 2018 om de verkoop van tabaksproducten
  te stoppen. Hiermee wil Kruidvat het gebruik van tabak onder jongeren ontmoedigen.
  Kruidvat heeft meer dan 250 winkels in Belgi\u00eb. Voor eind 2018 stopt Kruidvat
  de verkoop van tabaksproducten in ruim twee derde van haar winkels, de overige winkels
  volgen voor eind 2019.\\n\\n5. Rookvrije voetbalstadions (pioniers avant la lettre)\\n\\n**
  Club Brugge, RSC Anderlecht, KRC Genk\\n\\nZijn al een tijdje rookvrij:\\n\\n**
  Koning Boudewijnstadion, trainingscentrum Tubeke en alle thuiswedstrijden van de
  Rode Duivels\\n\\nLijst met contactpersonen\\n\\nGemeentes\\n\\nMechelen\\n\\nChristophe
  Cools\\n\\nfirstname.lastname@example.org\\n\\n015 29 25 97\"", "\"STENOGRAFISCHE
  NOTULEN VAN DE PROVINCIERAAD VAN ANTWERPEN\\n\\nVERGADERING VAN\\n\\n6 DECEMBER
  2022\\n\\nPROVINCIERAAD VAN ANTWERPEN\\n\\n__________\\n\\nVERGADERING VAN 6 DECEMBER
  2022\\n\\n__________\\n\\nDe vergadering wordt geopend te 14.00 uur.\\n\\nDe heer
  Provinciegriffier is aanwezig.\\n\\nTekenden de aanwezigheidslijst:\\n\\nANCIAUX
  Koen\\n\\nBAKELANTS Ann\\n\\nCALUW\u00c9 Ludwig\\n\\nCLAESSEN Jan\\n\\nCOLSON Mireille\\n\\nCOTTENIE
  Christ''l\\n\\nCUYLAERTS Nathalie\\n\\nDANEELS Tobias\\n\\nDE HAES Jan\\n\\nDE QUICK
  Erik\\n\\nDE WINTER Stefan\\n\\nDILLEN Koen\\n\\nFRAN\u00c7OIS Catherine\\n\\nGEYSEN
  Kris\\n\\nGYS Seppe\\n\\nHELSEN Katleen\\n\\nJACQUES Ilse\\n\\nLAUWERS Linda\\n\\nLEMMENS
  Luk\\n\\nPALINCKX Koen\\n\\nSCHOOFS Louis\\n\\nSOHIER Rudy\\n\\nSTEVENS Lili\\n\\nTALHAOUI
  Fauzaya\\n\\nVALKENIERS Bruno\\n\\nVAN DIENDEREN Ilse\\n\\nVAN HAUTEGHEM Marleen\\n\\nVAN
  OLMEN Mien\\n\\nVAN RANSBEECK Brend\\n\\nVANDENDRIESSCHE Diederik\\n\\nVERHAERT
  Inga\\n\\nVERHAEVEN Eddy\\n\\nVRANCKEN Isabelle\\n\\nWECKHUYSEN Wendy\\n\\nVerontschuldigd:\\n\\nMevrouw
  de Gouverneur BOONEN Nicole VAN GORP Valery\\n\\nDe raad is bijeen in openbare vergadering.\\n\\nOPENBARE
  VERGADERING\\n\\nVOORZITTER.- Goedemiddag allemaal, allemaal van harte welkom op
  de voortzetting van onze provincieraad van vandaag 6 december. Dan starten we de
  provincieraad, maar ik heb nog eerst gisteren een brief gekregen en ze hebben gevraagd
  om die eventjes kort voor te lezen.\\n\\n\\\"Lieve vriendjes uit de provincieraad,
  gisteren ben ik uw voorzitter tegengekomen en heb hem gevraagd mijn brief voor te
  lezen. Zwarte Piet en ik hebben gezien dat de meesten onder jullie brave kindjes
  zijn, alhoewel er ook wat deugnietjes bij zijn. Ik heb gehoord dat jullie vandaag
  starten met de bespreking van de budgetten, daarom heb ik aan de voorzitter een
  chronometer gegeven om te bekijken hoe lang jullie over bepaalde onderwerpen kunnen
  za... spreken. Ik heb hem wel gezegd dat hij de deputatie in het oog moet houden
  dat ze niet over hun tijd gaan met de bespreking, alsook geldt dat voor de andere
  leden. Geniet van jullie versnapering en ik wens jullie alvast aangename debatten
  en steeds op het juiste knopje drukken om te stemmen. Groetjes, Sint en Piet.\\\"
  Zo, dat is dan ondertussen ook gebeurd.\\n\\nVOORZITTER.- En nu gaan we bijna echt
  van start. Gedeputeerde Lemmens, aan u het woord. Gedeputeerde, nu u hier even van
  voor staat is er nog een klein ding, de fractievoorzitter van N-VA heeft nog een
  woordje te zeggen. Gedeputeerde u mag blijven staan.\\n\\nMevrouw CUYLAERTS.- Beste
  gedeputeerde, dag Luk. We staan hier niet om een Sintcadeautje aan u te geven, nee
  we willen u even in de bloemetjes zetten want u mag morgen een mijlpaal in uw loopbaan
  vieren. Morgen is het immers tien jaar geleden dat u de eed aflegde als eerste gedeputeerde
  van de provincie Antwerpen. En in die tien jaren heeft u vele mijlpalen in de provincie
  Antwerpen meegemaakt, waaronder de afbraak van het oude provinciehuis, het tijdelijk
  onderkomen van de organisatie en dan de start van een nieuw tijdperk in dit huis.\\n\\nU
  heeft de hervorming aan provinciale bevoegdheden en werking, naar aanleiding van
  de interne staatshervorming, mee in goede banen geleid. En hoewel u daarbij onder
  andere van uw geliefde bevoegdheid cultuur moest afscheid nemen, heeft u met overtuiging
  de boodschap uitgedragen dat de hervorming een meer gefocuste taakstelling met zich
  meebracht die de provincie enkel kon versterken.\\n\\nEn zo kennen wij u, als een
  gedeputeerde die gelooft in de provincie als een overheid die een verschil maakt,
  voor lokale overheden en dus ook de inwoners van de provincie Antwerpen, met \u00e9\u00e9n
  voet in Vlaanderen en de andere bij de lokale besturen, een brug als het ware.\\n\\nWij
  kennen u ook als een bruggenbouwer. Letterlijk, want onder uw bewind hebben de fietsostrades
  vleugels, tunnels en bruggen gekregen. Maar ook figuurlijk en dat doet u vanuit
  uw mandaat, dus met en tussen Vlaanderen en de lokale overheden. Maar u bent ook
  over de partijgrenzen heen een bruggenbouwer. Ja, u draagt uw politieke kleur uit,
  ook als dat wil zeggen dat er partijdonaties geschrapt worden. En ook al is de provincie
  niet de troetel van uw partij, u maakt de provincie net sterker door beslissingen
  te nemen die op lange termijn de provincie toelaten om sterker te worden. Niettemin
  doet u dat steevast in overleg met uw coalitie en andere gesprekspartners. U zal
  geen bruggen opblazen maar liever bouwen, daarvoor willen wij u feliciteren dat
  u zich voor de provincie al tien jaren zo gezwind inzet, blijft u vooral altijd
  zo vooruitgaan. Dank u wel.\\n\\napplaus\\n\\n0. Provinciale overheid\\n\\nNr. 0/1
  van de agenda\\n\\nToelichting gedeputeerde Luk Lemmens bij de strategische nota
  van het meerjarenplan en bij de beleidsnota 2023.\\n\\nVOORZITTER.- Zo en nu gaan
  we echt van start met de budgetbesprekingen. Gedeputeerde Lemmens heeft het woord.\\n\\nDe
  heer LEMMENS, gedeputeerde.- Wacht nog even met uw chronometer. Bedankt, het is
  een beetje onverwacht, maar het is inderdaad tien jaar en dat is lang, tien jaar.
  Ik heb verschillende collega''s gehad waar we afscheid van hebben moeten nemen,
  ook collega''s waar we op een tragische manier afscheid hebben moeten van nemen.
  In tien jaar gebeurt veel, gebeurt enorm veel, maar ik ben enorm fier dat ik die
  tien jaar toch altijd met een visie heb kunnen doorstaan, en die visie ook naar
  mensen binnen mijn partij maar ook buiten mijn partij heb kunnen uitdragen, dat
  die provincie toch wel een niveau is waar dat je dingen kan doen. En ik geloof echt
  wel dat wij in dit niveau allemaal binnen onze beleidsdomeinen toch echt wel bepaalde
  zaken op een goede manier hebben kunnen realiseren, waardat de mensen en de gemeenten
  enorm veel aan hebben. De provincie, dit niveau werkt, ik zie dat dagdagelijks en
  we werken hier ook samen met ongelooflijke ambtenaren, met ongelooflijke medewerkers.
  In feite is ambtenaren een totaal fout woord bij ons in de provincie, het zijn echt
  medewerkers die gaan voor dit niveau, die gaan voor hun beleid, die gaan waar zij
  voor staan. En dat kunnen wij elke dag, collega''s, ondervinden en daarom vind ik
  het fijn dat ik na die tien jaar toch nog enkele jaren kan afmaken en we zien daarna
  wel. In elk geval bedankt voor deze mooie attentie. Dank u.\\n\\nTijdens de tussenkomst
  van gedeputeerde Lemmens worden begeleidende slides getoond.\\n\\nGeachte voorzitter,
  geachte gouverneur is er niet, geachte collega-gedeputeerden, geachte griffier,
  geachte financieel beheerder, geachte provincieraadsleden.\\n\\nTraditioneel zijn
  de begrotingsbesprekingen het organisatorische hoogtepunt van het voorbereidend
  werk van maanden. De overhandiging van de boeken op de verenigde raadscommissie
  van 9 november is daarbij al een belangrijke mijlpaal. De grote lijnen die dan meegegeven
  zijn worden nu verder verfijnd, maar sta mij toe eerst het grote kader nog eens
  mee te geven.\\n\\nEn ook nu start ik eerst en vooral met de belangrijkste boodschap,
  het worden ook voor de provincie Antwerpen financieel uitdagende jaren. De gevolgen
  van de coronacrisis zijn amper verteerd of we moeten het hoofd bieden aan een volgende
  crisis: de oorlog in Oekra\u00efne en de erg hoge inflatie. Concreet hebben we voor
  de periode 23-25, de resterende tijd van de meerjarenplanning, te maken met een
  stijging van de energiekost met 6,8 miljoen, een extra bouwkost van 11,5 miljoen,
  een stijgende personeelskost van 33,7 miljoen. Kortom collega''s, een onvoorziene
  meerkost van 52 miljoen EUR. Gelukkig hebben we in de COVID-periode een buffer aangelegd.
  Daarnaast zal een deel opgevangen worden door de indexaanpassing van de belastingen.\\n\\nOp
  9 november heb ik ook meegegeven dat we daarnaast de meerjarenplanning in evenwicht
  wilden houden door het voeren van een aangepast uitgavenbeleid. We schuiven het
  tekort dus niet door naar de toekomst. Anderzijds willen we ook geen louter boekhoudkundige
  besparing op touw zetten. We willen dus niet, enkel ingegeven door de omstandigheden,
  ad hoc beslissingen nemen met een aangepast uitgavenbeleid in de resterende legislatuur.
  We willen beslissingen nemen die kaderen in een duurzaam beleid die de organisatie
  op lange termijn versterken. We stellen ons daarbij op als een wendbare overheid.
  Anno 2023 is organisatorische wendbaarheid trouwens een basisvoorwaarde voor een
  performante overheid. Alleen zo kunnen\\n\\nwe een antwoord bieden aan de toenemende
  snelheid waarbij maatschappelijke, economische en politieke veranderingen zich aandienen.\\n\\nIedereen
  kent Winston Churchills gevleugelde woorden: never waste a good crisis. Vanuit een
  positieve kansenbenadering hebben we deze uitdaging opgevat als een streven naar
  een nog meer effici\u00ebnte of geoptimaliseerde werking en tegelijk gekozen om
  meer te investeren in acties die op termijn meer renderen dan de investering op
  zich. En met renderen bedoelen we niet enkel financieel. Er is daartoe een gedifferentieerd
  en gefaseerd plan opgesteld dat vertrekt vanuit vier globale uitgangspunten. Ten
  eerste, onszelf scherp houden en inzetten op onze basisopdrachten. Ten tweede, zorgen
  voor een aangepaste wendbare en effici\u00ebntere organisatie. Ten derde, kostenbewust
  met personeelskader en organisatie omgaan in budgettair uitdagende tijden. Ten vierde,
  inzetten op functies met een duidelijke return en een meerwaarde om sterker te staan
  naar de toekomst. Vanuit deze uitgangspunten zijn er veertien opdrachten geformuleerd
  aan het managementteam. Zoals aangegeven gaat het over een gefaseerd plan, gespreid
  over meerdere jaren, vandaar ook dat er in de cijfers voor 2023 nog niet meteen
  iets van te merken is. Bij sommige acties zal de uitvoering en impact op de cijfers
  ook legislatuur overschrijdend zijn.\\n\\nZoals aangehaald is het eerste uitgangspunt
  inzet op de basisopdrachten. We hebben hier, collega''s, gekeken met welke taken
  we als provincie fundamenteel invulling geven aan onze opdracht. Taken waarbij we
  zowel als sub-Vlaams als ook bovenlokaal overheidsniveau re\u00eble ondersteuning
  bieden aan lokale besturen, zowel op het vlak van beleid alsook operationele ondersteuning
  in de uitvoering van het beleid. Dit was het referentiekader waarbinnen de aftoetsing
  van tal van taken gebeurd is. Concreet heeft de deputatie de volgende beslissingen
  genomen: de provincie stopt met de uitbating van het Suske en Wiske Museum op 1
  januari 2025. We gaan in gesprek met de gemeente, de familie en de uitgeverij. We
  doen vanaf begin 2023 een nieuwe marktbevraging. In het beste geval vinden we een
  overnemer en blijft het museum open, maar als echt niemand interesse toont sluit
  het museum in 2025. Op 1 januari 2025 wordt de provinciale werking stopgezet van
  de bibliotheekwerking en uitleendienst van DocAtlas. Naar voorbeeld van de stad
  Turnhout wordt een integratie in de bibliotheekwerking van andere steden gezocht.
  De werking rond digitalisering, levenslang leren en taal, wordt verdergezet binnen
  de dienst Werk van de provincie. Ook hier zoeken we voor het personeel oplossingen
  via het kader personeelsbewegingen. Het Hof van Leysen is meer een buurtpark dan
  een provinciaal domein en dragen we daarom over aan het district. De gesprekken
  hierover zijn opgestart en die waren toch al enige tijd bezig, dat wil ik toch nog
  benadrukken. En tot slot worden gesprekken opgestart met Vlaanderen en Turnhout
  en de omliggende gemeenten over de overdracht van de Warande tegen 1 januari 2025.\\n\\nEen
  tweede uitgangspunt is streven naar een effici\u00ebnte, meer geoptimaliseerde werking
  van onze organisatie. Daaruit zijn volgende opdrachten geformuleerd naar de betrokken
  entiteiten en diensten. De komende jaren gaat een generatie educatiewerkers in onze
  domeinen met pensioen, dit wordt aangewend om de huidige traditionele educatiewerking
  te evalueren en stelselmatig te actualiseren. Er wordt gekeken naar een meer interactief
  aanbod en meer samenwerking met de lokale partners. Het Gouverneur Kinsbergencentrum
  is gevraagd een masterplan uit te werken. Waar liggen de noden in de sector en dus
  de focuspunten voor de werking van het centrum in de toekomst? Dit wordt gecombineerd
  met een ruimere infrastructuuroefening. We gaan immers verder met optimalisering
  van ons patrimonium, want minder gebouwen betekent minder kosten. Daartoe clusteren
  en centraliseren we dus dienstverlening en verkopen we wat leegkomt. Vanaf 2023
  fuseren de diensten flankerend onderwijsbeleid en flankerend arbeidsmarktbeleid
  tot \u00e9\u00e9n dienst binnen het Departement Economie, Streekbeleid en Europa.
  Ten vierde wordt de werking van ons congrescentrum in het provinciehuis geoptimaliseerd
  zodat het meer en beter benut kan worden en voor meer financi\u00eble return kan
  zorgen. Tot slot zullen al onze verzelfstandigde entiteiten samen met het Departement
  Financi\u00ebn een traject doorlopen om hun financi\u00eble maturiteit en zelfredzaamheid
  te verhogen en optimaliseren we onze inkomsten door onder andere de modernisering
  van onze financi\u00eble processen, denk aan de invoering van een QR-code op de
  aanslagbiljetten en een vereenvoudigde digitale aangifte door bedrijven.\\n\\nSommige
  van bovenstaande acties hebben natuurlijk een impact op het personeel. De budgettair
  uitdagende tijden vereisen een kostenbewust beleid binnen het personeelskader, ons
  derde uitgangspunt. Eerst en vooral plannen we begin 2023 de uitwerking van een
  collectieve aanpak voor de pensioneringsgolf die er aankomt. Het gaat over grosso
  modo 250 voltijds equivalenten tegen eind 2025. Concreet zullen we functies die
  vacant komen bij pensionering enkel vervangen indien onontbeerlijk voor de werking.
  Daarnaast werken we een goed en duidelijk kader uit voor de personeelsbewegingen
  die bovenstaande acties met zich meebrengen. Er zullen onvermijdelijk medewerkers
  in overtal komen door het stopzetten van de dienstverlening waarop ze vandaag zijn
  tewerkgesteld. We zetten op basis van ons kader voor interne bewegingen een aanpak
  op die gestoeld is op volgende principes: we starten een begeleidingstraject op
  maat en op vraag op, beperkt in de tijd met als doel de verwerving van een nieuwe
  job, hetzij intern, hetzij extern.\\n\\nDan komen we tot het vierde en laatste uitgangspunt.
  Zoals eerder aangegeven willen we ook investeren in projecten en functies met een
  duidelijke return en die er op termijn voor zorgen dat we sterker staan. We denken
  daarbij aan energie, klimaat en het verwerven van Europese middelen. Daarom investeren
  we verder in het energiezuinig en het klimaatneutraal maken van ons patrimonium,
  hiervoor zullen we extra personeel aanwerven. Er worden twee extra ingenieurs aangeworven
  om tegen 2025 voor elke provinciale site een masterplan gebouwen op te maken met
  de scope op energie en water. Daarnaast zullen we vanaf 2023 bij het Departement
  Vrije Tijd en het Departement Onderwijs en Educatie, de departementen met het grootste
  patrimonium en dus het grootste energiebesparingspotentieel, elk een deskundige
  energiebesparing aangeworven worden. Om dit te ondersteunen wordt bij DLOG een projectingenieur
  gebouwautomatisatie en smartbuildings aangeworven. In feite, collega''s, moeten
  deze functies zich minstens terugverdienen.\\n\\nHierbij heb ik u een globaal overzicht
  geboden van de optimalisatie die we binnen onze provinciale werking nastreven. Vanuit
  vier uitgangspunten hebben we dus veertien opdrachten geformuleerd die nu uitgewerkt
  worden. Een eerste voorzichtige inschatting leert dat de uitvoering van deze opdrachten
  kan leiden tot een effici\u00ebntiewinst in het meerjarenplan uiteraard. Geachte
  provincieraadsleden, in 2018 bracht de interne staatshervorming een vergrote focus
  op bevoegdheden met zich mee, waarmee de provincie als bovenlokaal overheidsniveau
  re\u00eble ondersteuning biedt aan lokale besturen. In feite hebben we nu ons werkingskader
  nog beter omlijnd en de taakstelling verder verfijnd. Door onze taken en werking
  als overheid te onderzoeken en ook op de bevindingen te handelen, in tijden dat
  overheden focussen op louter besparingen en de factuur naar de toekomst door te
  schuiven, geven we blijk van durf en verantwoordelijkheidszin. Uiteraard zullen
  we tijdens deze budgetbespreking ook nog bekijken welke exploitatie-uitgaven en
  investeringen in 2023 zullen gebeuren. Ik werp hier nog geen vooruitblik op, ze
  zullen toegelicht worden door de deputatie.\\n\\nIk wil ook nog tot slot de griffier
  en zijn diensten en ook onze financieel beheerder met zijn diensten bedanken voor
  de enorme ondersteuning die ze hebben bijgebracht bij het tot stand komen van deze
  begroting, waarvoor enorm veel dank. Ik stel voor dat we nu de bespreking aanvatten,
  maar ik neem aan, collega De Haes, dat u nog kort een toelichting zal geven. Ik
  dank u.\\n\\nNr. 0/2 van de agenda\\n\\nToelichting gedeputeerde Jan De Haes bij
  de financi\u00eble nota van het meerjarenplan en bij de financi\u00eble nota 2023.\\n\\nTijdens
  de tussenkomst van gedeputeerde De Haes worden begeleidende slides getoond.\\n\\nDe
  heer DE HAES, gedeputeerde.- Dank u wel collega, dank u wel allemaal. Heel veel
  nieuws ten opzichte van de verenigde raadscommissies kan ik natuurlijk niet zo meteen
  vertellen. Het is eigenlijk de bedoeling om u een beetje financieel op te warmen
  voor de debatten over de begroting en om een beetje toch die logica en de uitdagingen
  in de verf te zetten. Om te beginnen bij het einde, ik weet dat dat misschien wat
  abnormaal is, maar daar moet het uiteindelijk op eindigen, dan zien wij dat onze
  meerjarenplanning 2025, dat is rechts in de tabellen, dan zie je dat onze autofinancieringsmarge
  positief is en dat ons beschikbaar budgettair resultaat ook goed boven nul zit.
  Zover geen probleem.\\n\\nEigenlijk moet ik wel zeggen, we hebben als provincie
  een beetje chance dat we een redelijk sterke organisatie zijn. Sterk, daar bedoel
  ik mee: we hebben heel voorzichtig begroot, we zijn heel flink geweest in de afgelopen
  tijden en we kunnen tegen een stootje. Het probleem echter is natuurlijk dat wij
  als organisatie niet vreemd aan de wereld zijn, dat wij dingen niet helemaal zelf
  kunnen bepalen laat staan betalen, dat we daarvoor afhankelijk zijn van wat er rondom
  ons gebeurt. En als je dat dan naast elkaar legt dan moet je keuzes maken en dan
  zeggen we, kijk, wat we wel gaan doen is blijven investeren. Dat is een beleid dat
  we willen doen en ik hoop dat alle bedrijven dat ook doen, want wanneer in crisissituaties
  iedereen aan de handrem trekt, dan vergroot je eigenlijk die crisis en dat is een
  recessie, niet een klein beetje recessie, maar wordt dat een mega recessie.\\n\\nWij
  blijven die opportuniteiten doen, we zullen blijven investeren als overheid en ik
  denk dat dat ook onze verantwoordelijkheid is, het goede voorbeeld qua investeringen.
  Dat neemt niet weg dat er ook voor ons een aantal problemen in de lucht hangen die
  van buitenaf op ons afkomen en dan denk ik zeker aan de inflatie waar wij zelf heel
  weinig vat op hebben, aan de energiekost waar we nog minder vat op hebben of ook
  aan de stijgende kosten die onrechtstreeks ook ons be\u00efnvloeden. Denk maar bijvoorbeeld
  aan de aannemers die de beken ruimen, die werkingskosten die we daar hebben die
  stijgen ook enorm. Om een beetje een grootteorde te geven, en ik heb ten opzichte
  van de verenigde raadscommissies deze tabel even uit elkaar getrokken, wat betekent
  bij wijze van grootteorde de indexering van onze wedde? Voor de komende drie jaren
  is dat voor ons een meerkost van 33,7 miljoen. Gelukkig hebben we ooit een potje
  opzijgelegd voor de financiering van de tweede pijler, herinnert u het nog, het
  is hier al een paar keer ter sprake gekomen met de overgang van Provant naar Prolocus,
  waar we de afspraak hebben gemaakt dat we daar een twintigtal miljoen uit die Prolocus-pot
  terug kunnen laten vloeien naar onze provincie. Dat betekent voor de komende drie
  jaar dat wij onze stijging van de personeelskost met een 13 miljoen kunnen helpen
  financieren. Let wel, dit is natuurlijk een tijdelijke situatie, ik kom daar subiet
  nog op terug. Energie, we hebben geluk met dit gebouw, maar buitendiensten, provinciale
  scholen en dergelijke, zijn nog niet allemaal, maar dat komt ook straks nog terug
  in ons beleid, maar zijn nog niet allemaal energieneutraal. We hebben nog redelijk
  wat energiekosten, die meerkost begroten we op 3 jaar tijd op 6,7 miljoen, ook geen
  klein bier.\\n\\nEven een tijdslijn, we houden onze exploitatie in evenwicht de
  komende jaren, maar als je de taartdiagram van 2023 bekijkt dan zie je dat onze
  ontvangsten altijd komen vanuit belastingen. We hebben \u00e9\u00e9n voordeel, 60
  procent is de onroerende voorheffing, de opcentiemen op de onroerende voorheffing,
  waar wij natuurlijk automatische indexatie hebben. We moeten onze opcentiemen niet
  verhogen, alles blijft gelijk. Dat is natuurlijk verschillend wat betreft de provinciebelasting
  op bedrijven en gezinnen. Op bedrijven is ge\u00efndexeerd, op gezinnen hadden wij
  een indexsprong gedaan, in 2022 hadden wij geen aanpassing gedaan aan de levensduurte.
  We gaan dit voor 2023 wel doen en dat betekent, zoals ik al vorige keer gezegd heb,
  dat wij op drie jaar tijd 6 miljoen meer belasting op gezinnen zullen innen en 3
  miljoen op bedrijven en een 15 miljoen op de onroerende voorheffing. Samen is dat
  24 miljoen waarmee wij het belangrijkste deel van de te verwachten uitdagingen,
  meerkosten voor de komende 3 jaar kunnen financieren. Er is dus, ik herhaal, geen
  verhoging van de belasting, er is wat de gezinnen betreft een matige indexatie en
  de anderen volgen gewoon de indexaties.\\n\\nWat de uitgaven betreft, de taart leert
  ons ook dat personeel voor ons een kost van 40 procent is. Je moet dat een beetje
  nuanceren, want je ziet daar ook 21 procent dotatie, dat zijn eigenlijk de centen
  die van de provincie naar de APB''s gaan. Natuurlijk binnen de APB''s is dat ook
  voor\\n\\nenergie en personeel te betalen, dus ook daar zit die personeelstijgingskost
  in, dus ook onze dotaties moeten wij mee verhogen voor de personeelskost. Dus je
  voelt meteen als je die verdeling hier ziet hoe belangrijk het is of in welke mate
  dat die kostenstructuur be\u00efnvloed wordt door de stijging van de levensduurte.\\n\\nEventjes
  op een schema gezet voor de komende jaren, volledigheidshalve moet ik zeggen dat
  2020 en 2021 de rekeningen zijn en dus niet de budgetten, maar je ziet waar de onderlinge
  verhoudingen grotendeels hetzelfde blijven maar dat alles stijgt in gezamenlijk.
  Zoals ik zei we blijven investeren, dat is deze slide. Misschien even toelichten,
  een investering is ten eerste altijd heel cyclisch. Aan het begin van de legislatuur
  denken wij hard na en dan beginnen wij te investeren en dan komt dat op ritme. Wanneer
  je rekening 2020 en rekening 2021 ziet, dan zie je in 2022 een hele hoge investeringspiek
  staan. Dat heeft ten eerste te maken met de cyclische beweging van de investeringen,
  maar natuurlijk ook, en dat komt op de volgende slide nog, met de fietsostrades
  waar er heel veel van in gang gezet zijn en waarvan de rekeningen nu beginnen binnen
  te vallen. Deze slide vertaalt dan natuurlijk meteen de fietspaden inclusief de
  fietsostrades waar onze gedeputeerde zo heel fier op is en veel bruggen bouwt, maar
  waar ik altijd bij zeg: dat is niet de enige focus van onze provincie. O nee, maar
  u ziet toch wel dat wij blijven investeren, totaal deze legislatuur 360 miljoen
  waarvan wij 120 miljoen in grootteorde terughalen uit investeringsontvangsten.\\n\\nTot
  slot over de investeringen toch nog \u00e9\u00e9n weetje, we hebben hier het nieuwe
  provinciehuis en als we eens berekend hadden, bij wijze van simulatie wat het oude
  provinciehuis nog zou kosten aan stookolie en elektriciteit en we berekenen dat
  aan de prijzen van vandaag natuurlijk en we vergelijken dat met de prijzen van het
  provinciehuis nu, dan zie je dat we een netto besparing zouden maken van een goed
  miljoen 150. Kortom zoals collega Luk zei, we gaan ook natuurlijk investeren in
  een organisatie en ook in het Departement Financi\u00ebn moeten we dat doen. We
  gaan eigenlijk echt zorgen dat we al die financi\u00eble processen en over wat gaat
  dat onder andere, door heel fijn in te schrijven wanneer centen zullen nodig zijn
  in de begroting kunnen wij ook onze op te nemen leningen beperken en we kunnen ervoor
  zorgen dat we echt daar besparingen nog doen. De netto besparingen zijn natuurlijk
  de interesten die je moet betalen, de budgettaire besparing is dat je minder geld
  moet inbrengen en dat je ruimte kan cre\u00ebren voor andere dingen. Ook heel eenvoudige
  processen lijkt dat allemaal, QR-codes op aanslagbiljetten, maar we zijn daar heel
  hard mee bezig en ik denk dat dat in 2023 ook verder uitgerold kan worden. Maar
  belangrijk, en er is al naar verwezen, het traject dat we met de verschillende entiteiten
  gaan lopen. Ik denk dat elke organisatie dat aan zichzelf en aan zijn financierders,
  in deze zijn dat de burgers en de bedrijven, verschuldigd is om regelmatig quasi
  permanent voor de spiegel te gaan staan, te zeggen, doen wij de juiste dingen en
  doen wij de dingen juist. Ik denk dat dat heel belangrijk is, middelen zijn niet
  oneindig en we moeten de mensen die hier alle dagen het beste van zich geven ook
  de nodige tools geven. Dat betekent dat je naast de middelen, naast de mensen ook
  de methodes moet durven bekijken en daar gaan we werk van maken. Een van de belangrijkste
  redenen is, u heeft het daarstraks gezien, binnen x-aantal jaren is die reserve
  die we hebben op de tweede pijler, loopt dat af. Tegen dan moet onze organisatie
  alweer een stapje effici\u00ebnter zijn en alweer een stapje doelmatiger kunnen
  werken. Ik denk dat wij dan zo dadelijk aan de tussenkomsten van de fractievoorzitters
  kunnen beginnen voorzitter en dan rond ik hierbij af. Dank u wel.\\n\\nNr. 0/3 van
  de agenda\\n\\nTussenkomst fractievoorzitter N-VA bij het meerjarenplan en het budget
  2023.\\n\\nVOORZITTER.- Dank u wel, gedeputeerde Lemmens en gedeputeerde De Haes.
  Mevrouw Cuylaerts heeft het woord.\\n\\nMevrouw CUYLAERTS.- Geachte voorzitter,
  geachte leden van de deputatie, collega''s, spannend, de eerste maal dat ik als
  fractievoorzitter de budgetbesprekingen opvolg. Naar voorbeeld van mijn voorgangster
  Mireille Colson wil ik graag gedeputeerde Lemmens en gedeputeerde De Haes bedanken
  voor hun inleiding van de budgetbespreking, alsook de diensten en dan in het bijzonder
  de financieel beheerder mijnheer Verbruggen en het Departement Financi\u00ebn die
  jaar na jaar het budget op een duidelijke manier voor ons allen opmaken.\\n\\nNa
  enkele budgetbesprekingen die hybride en met mondmasker plaatsvonden kunnen deze
  eindelijk terug volledig fysiek plaatsvinden, dat komt het debat alleen maar ten
  goede. Het moet wel gezegd, de coronacrisis zit nog vers in het geheugen en alweer
  kreeg onze samenleving en bijgevolg ons bestuur nieuwe uitdagingen op het bord.
  Eind februari viel Rusland Oekra\u00efne binnen, het begin van een oorlog die reeds
  vele maanden langer duurt dan verwacht en die ook impact heeft op ons leven. Denken
  we aan de opvang van Oekra\u00efense vluchtelingen, de energiecrisis en de inflatie
  met zelfs recessievrees. Zoals eerste gedeputeerde Luk Lemmens ons al eerder meedeelde
  wordt ons bestuur geconfronteerd met maar liefst 52 miljoen EUR aan extra onvoorziene
  kosten. Het is dan ook onze taak als bestuurders om als een goede huisvader te waken
  over de financi\u00ebn van ons bestuur, zodat we het tekort van nu niet moeten doorschuiven
  naar de toekomst. Dat kunnen we, zoals reeds gezegd, enkel doen door de meerjarenplanning
  in evenwicht te houden, wat enkel mogelijk is door een aangepast uitgavenbeleid.
  Om de stijgende energiekosten te drukken zijn de diensten en de deputatie volop
  aan de slag gegaan om ons patrimonium te optimaliseren en in te zetten op het energiezuinig
  en klimaatneutraal maken van onze gebouwen. Ik herinner me nog goed alle kritiek
  op dit nieuwe provinciehuis, maar vandaag is dit gebouw klimaatneutraal en heeft
  het amper energiekosten in vergelijking met het vorige provinciehuis. Voor nieuwbouw
  zal de standaard ook BEN-plus worden. En ik herhaal even, er wordt dus verder gewerkt
  aan de optimalisering van het patrimonium door diensten te centraliseren, waardoor
  er gebouwen leegkomen die we dan kunnen verkopen. En op het vlak van financi\u00ebn
  wordt er gekeken naar onze EVAP''s, zoals eerder gezegd, om hun zelfredzaamheid
  te verhogen zodat zij op termijn misschien volledig autonoom kunnen gaan werken.\\n\\nMaar
  ondanks alle stijgende kosten deinst het provinciebestuur er niet van terug om te
  investeren, integendeel. Bij het Departement Leefmilieu zet men in op het vergroenen
  en ontharden van speelplaatsen met de campagne groene oases en zal men in 2023 de
  boskansenkaarten afronden, om zo te kijken waar er nog meer bos kan voorzien worden
  in onze provincie. Om jonge mensen te motiveren een studierichting te volgen of
  te werken in het havengebied bouwt het Havencentrum aan een nieuw Havenbelevingscentrum.
  Kamp C gaat een tijdelijk paviljoen oprichten dat volledig bestaat uit lokale biobased
  materialen. Dit moet ervoor zorgen dat de landbouw met de natuur kan werken, ze
  zijn namelijk geen tegengestelden, door een evenwicht te zoeken zodat de natuur
  kan blijven geven aan land. Het PIH zal in 2023 ook extra inzetten op bodemonderzoek
  van eventuele risicogronden. Ook het provinciaal waterbeleid, waar mevrouw de gouverneur
  ons al een interessante uitgebreide toelichting over gaf, is zeer belangrijk voor
  de landbouw. In 2023 zal de uitbouw van het provinciale meetnet op de provinciale
  waterlopen worden afgerond, wat zeer belangrijk is voor deze sector. Ook zal er
  door de vernieuwing van de afstandscontrole en de aansturing van alle waterstations,
  een mogelijkheid zijn om de pompen makkelijker te kunnen inzetten voor zowel extreme
  droogte als wateroverlast. De afgelopen jaren is er al heel hard gewerkt om ervoor
  te zorgen dat iedereen binnen de provincie droge voeten heeft, denk maar aan de
  herinrichting van de Zwarte Nete in Retie. Er werd een hoge stuw verwijderd wat
  de vissen ten goede komt en aanvullend werd er ook een nieuwe meanderende loop aangelegd
  die er dan weer voor zorgt dat de beek beter overweg kan met extreme weersomstandigheden.
  Dit om maar \u00e9\u00e9n voorbeeld te geven van de zovele. We blijven op zoek naar
  ruimte voor water om te zorgen dat water niet komt daar waar het niet mag. Om enkele
  voorbeelden te noemen denk ik aan het herwaarderen van de Kaartse Beek, het openleggen
  van een deel van de Dorpbeek in Emblem-Ranst en het verleggen van de Laakbeek in
  Beerse ter hoogte van de Tempelstraat, het verleggen van de Zuteweybeek en zo kan
  ik nog een tijdje bezig blijven. Het gebiedsprogramma Grote Nete zal volgend jaar
  ook weer verder werken om de vallei te ontwikkelen tot een klimaatrobuuste plaats
  vol beleving. Daarnaast wil men het toerisme in de valleien van de Kleine Nete en
  de Aa een duwtje in de rug\\n\\ngeven door de ontwikkeling van een toeristisch onthaalplan
  dat de naam ''Kleine Netemomentjes'' kreeg. In 2023 zal ook het ruimtelijk beleidsplan
  een definitieve vorm aannemen. Een beleidsplan waar jaren voorbereiding en onderzoek
  aan te pas is gekomen en dat als visie heeft, zuinig ruimtegebruik, veerkracht,
  eigenheid, nabijheid en bereikbaarheid. Deze visie wordt toegepast op sterke netwerken
  binnen ruimte en mobiliteit, levendige kernen en verdichten en ontdichten van de
  ruimte. Momenteel ligt er een zeer mooi ontwerp op tafel dat in de loop van het
  jaar, na het openbaar onderzoek en de verwerking hiervan, zijn definitieve vorm
  zal aannemen in het najaar.\\n\\nEn laat ons de fietsinfrastructuur in onze provincie
  niet vergeten, hoewel minister Peeters dat wel doet. Het uitbreiden van de fietsostrades,
  de troetels van gedeputeerde Lemmens, en het ondersteunen van gemeentes bij de aanleg
  van bovenlokale functionele fietsroutenetwerken, daar blijven we volop op inzetten.
  Zo zal de F12 havenverbinding uitgevoerd worden en zullen er niet-vergunningsplichtige
  werken voor de autoluwe fietsroutes op de planning staan. En dat fietsen een prioriteit
  is werd ook duidelijk voor de provinciale medewerkers. Ze kregen namelijk het aanbod
  om een fiets te leasen via de provincie want welzijn op en naar het werk is van
  belang.\\n\\nOntspannen kunnen we ook nog steeds in onze verschillende recreatie-
  en groendomeinen die onze provincie rijk is. Er wordt ook feestgevierd want we vieren
  de honderdjarige verjaardag van het Rivierenhof als provinciaal groendomein. Er
  komen nieuwe speeltuinen bij en binnenkort kunnen we het spookhotel in het Vrijbroekpark
  gaan bezoeken. Het komende jaar zal er ook opnieuw gewerkt worden aan laagdrempelig
  karakter van de domeinen, zodat deze toegankelijk en aangenaam blijven voor iedereen.
  Een mooi voorbeeld hiervan is het pas opgestarte project ''Op rolletjes'', waarin
  er ook op een aantal domeinen rolstoelwandelingen zullen uitgewerkt worden. Voor
  een veilige toegankelijkheid zal aan het domein het Zilvermeer een veilige oversteekplaats
  gerealiseerd worden. In het Rivierenhof zal er werk gemaakt worden van de bouw van
  een nieuwe technische ruimte die ervoor zorgt dat alle diensten geclusterd zullen
  zijn in \u00e9\u00e9n gebouw, in plaats van verspreid over het hele domein. Men
  zal hier ook gedeeld onthaal voorzien zodat de directeurswoning integraal toegankelijk
  zal zijn. Kortom, we kunnen zeggen dat er het afgelopen jaar heel hard is gewerkt
  en dat er voor het komende jaar opnieuw veel uitdaging op ons pad komen. Uitdagingen
  die dit bestuur en deze deputatie zeker niet uit de weg zal gaan. Bij dit alles
  mogen we als bestuur niet vergeten telkens te evalueren wat er nog binnen het provinciale
  kerntakenpakket past. Onze organisatie moet daadkrachtig en wendbaar zijn opdat
  we verder tegen een stootje kunnen, ook in budgettair uitdagende tijden.\\n\\nNr.
  0/4 van de agenda\\n\\nTussenkomst fractievoorzitter cd&v bij het meerjarenplan
  en het budget 2023.\\n\\nVOORZITTER.- Dank u wel mevrouw Cuylaerts. Mevrouw Weckhuysen
  heeft het woord.\\n\\nMevrouw WECKHUYSEN.- Goedemiddag leden van de deputatie, zeer
  gewaardeerde collega''s van de provincieraad. Besturen is constant vooruitkijken,
  maar ook standvastig werken met een duidelijke visie op de lange- en de korte termijn.
  Het vergt constant ook de nodige flexibiliteit om bij te sturen wanneer de omstandigheden
  dit vereisen. Dit bestuur slaagt er duidelijk in om deze zaken te combineren. Na
  corona hadden we met zijn allen gehoopt om de draad weer normaal te kunnen oppikken,
  maar helaas staken nieuwe crisissen de kop op, waar we, ook helaas, allemaal het
  effect van voelen en die ons ertoe noodzaken om budgetten en prioriteiten te herzien.
  Dat geldt voor onze bedrijven, voor onze lokale besturen, voor onze verenigingen,
  thuis in ons gezin evenzeer en ja, dus ook voor ons provinciebestuur. Het is voor
  ons essentieel dat de provincie in deze zeer turbulente tijden waakt over haar financi\u00eble
  gezondheid. We stellen vast dat onze bestuursploeg daarbij verstandige keuzes maakt
  en een evenwichtig voorstel aan de provincieraad voorlegt. En wat ook belangrijk
  is, in de plannen die voorliggen herkennen we\\n\\nnog steeds de krijtlijnen, de
  krijtlijnen van ons bestuursakkoord. De grote lijnen van het afgesproken beleid
  worden nog steeds verder uitgerold. Op essenti\u00eble punten blijven we op een
  goed doordachte manier en met een duidelijke visie investeren.\\n\\nDe lessen die
  we uit de coronacrisis trokken zijn meegenomen in het beleid voor de komende jaren,
  net als de ingrepen waar de huidige toestand ons toe noodzaakt, de energiecrisis,
  de krapte op de arbeidsmarkt, de oorlog in Oekra\u00efne, de klimaatverandering,
  u kent de opsomming elke dag uit het nieuws. Ongetwijfeld zullen die een minstens
  even groot effect hebben op onze samenleving, maar een crisis, we weten het, kan
  ook een kans inhouden. Het kan een stimulans zijn om versneld of met meer daadkracht
  actie te ondernemen. Dat zagen we gebeuren door corona en dat zien we nu ook nog
  steeds gebeuren. Herinner u hoe we in volle coronatijd onze lokale besturen met
  een extra ondersteuning zijn gaan stimuleren om zomerscholen te organiseren, om
  zo te proberen de leerachterstand bij kwetsbare kinderen te vermijden. Vandaag zien
  we het effect van die ingreep, want meer dan de helft van onze lokale besturen organiseert
  ondertussen zo''n zomerschool. Onze provincie is daarmee wel degelijk koploper in
  Vlaanderen geworden.\\n\\nVandaag zien we ook hoe we extra inzetten en inspanningen
  leveren op het vlak van klimaatadaptatie, energiebesparing en nieuwe vormen van
  energie, betaalbaar en duurzaam wonen, duurzame landbouw, om meer mensen aan het
  werk te krijgen, om de digitale kloof nog steeds weg te werken, noem maar op. De
  uitdagingen waar onze samenleving vandaag voor staat worden wel degelijk aangepakt.
  Elk van onze gedeputeerde doet dat binnen zijn of haar bevoegdheden, elk departement
  in ons provinciebestuur, elke dienst en elke APB draagt zijn of haar steentje bij.
  Door financi\u00eble keuzes te maken, maar ook door de juiste inhoudelijke accenten
  te leggen. In de eerste plaats door zelf binnen al onze entiteiten het goede voorbeeld
  te geven op het vlak van water- en energieverbruik, maar ook door op creatieve manieren
  meer mensen aan een baan te helpen en daarbij ook aandacht te hebben voor de meer
  kwetsbare profielen. En door ervoor te zorgen dat mensen ook aan het werk kunnen
  blijven en niet vroegtijdig uitstromen. Door in te zetten op de zorgberoepen van
  morgen, met voldoende en juist gekwalificeerde medewerkers die effici\u00ebnt worden
  ingezet, door duurzaam wonen, bouwen en verbouwen te stimuleren, door onze land-
  en tuinbouwers te ondersteunen in de transitie waar ze voor staan, door andere vormen
  van woon-werkverkeer te stimuleren en meer mensen op de fiets te krijgen, door onze
  lokale besturen en ook ondernemers goed te adviseren en te begeleiden om met Europese
  middelen onze gezamenlijke doelstellingen te bereiken, enzovoort. Omwille van die
  positieve balans kan onze cd&v-fractie zich vinden in de plannen die aan ons worden
  voorgelegd. De provincie Antwerpen toont zich hiermee een wendbare organisatie die
  in meerdere betekenissen van het woord wel een degelijk, een duurzaam beleid voert.
  Dank u wel.\\n\\nNr. 0/5 van de agenda\\n\\nTussenkomst fractievoorzitter Vlaams
  Belang bij het meerjarenplan en het budget 2023.\\n\\nVOORZITTER.- Dank u wel mevrouw
  Weckhuysen. Mijnheer Valkeniers heeft het woord.\\n\\nDe heer VALKENIERS.- Dames
  en heren, voorzitter, ondervoorzitter, gedeputeerden, collegaraadsleden, mijnheer
  de griffier, mijnheer de financieel beheerder en medewerkers, beste Sinterklaas
  en zwarte Piet. Wat hebben Gerbrand Adriaenszoon Bredero - die aanvang 17de eeuw
  stadsdichter, rederijker van de noordelijke Nederlanden was - en de provincie Antwerpen
  met elkaar gemeen? Op het eerste gezicht niets \u2026 bij nader inzien \u2026 misschien
  toch wel meer. En neen, ik verwijs niet naar de blij- en kluchtspelen zoals ''De
  Spaanse Brabander'' of ''De klucht van de koe''. De gelijkenis is dat de provincie
  en deze deputatie zich sinds het begin van deze legislatuur willens nillens \u2013
  nolens volens, de lijfspreuk van Bredero moet eigen maken: ''t kan\\n\\nVERGADERING
  VAN 6 DECEMBER 2022\\n\\nverkeren, of het kan veranderen, of het leven is \u00e9\u00e9n
  en al wisselvalligheid. Bredero schreef dit citaat trouwens onder al zijn werk als
  een soort handtekening. Misschien een tip ...\\n\\nVandaag eind 2022 ligt de provinciale
  legislatuur reeds voor 2/3de achter onze rug, nog 1/3de of twee jaar te gaan en
  we moeten ons tot de kiezer wenden. Ik kan me inbeelden dat niet iedereen, niet
  elke partij hier met dezelfde gevoelens naar uitkijkt, wetende dat ''t kan verkeren
  en de kiezer eerder naar het geknoei in de nationale en de Vlaamse regering zal
  kijken dan naar eventuele provinciale realisaties.\\n\\nVandaag eind 2022 zitten
  we ook in de helft van het provinciaal meerjarenplan. Nog drie jaar te gaan. En
  laat ons eerlijk zijn, dit meerjarenplan is sinds den beginne, eerder nillens dan
  willens, getekend geweest door verandering en onderhavig aan wisselvalligheden buiten
  uw of onze wil. Een schoolvoorbeeld van: ''t kan verkeren.\\n\\nTot de lente 2022
  was ons leven twee jaar in de greep van het ''Chinees'' virus COVID-19. In onze
  contreien en in de grootste delen van de wereld is intussen, gelukkig maar, het
  rijk der vrijheid teruggekeerd. Behalve in \u2026 jawel China. China is natuurlijk
  nooit een rijk van vrijheid geweest en daar is het coronavirus dan ook een zeer
  welgekomen alibi om de eigen bevolking op een degoutante manier onder de knoet te
  houden. Maar gedurende die twee jaar bepaalde COVID-19 ook ons familiaal, ons politiek
  en vooral economisch bestel en - dus ook in de provincie Antwerpen - onze inkomsten
  en uitgaven, ons budgettair huishouden. En nu, net nu dat achter de rug lijkt te
  zijn, krijgen we in 2022 in Europees buurland Oekra\u00efne af te rekenen met een
  Russische invasieoorlog met alle gevolgen van dien, vooral voor de plaatselijke
  bevolking.\\n\\nMaar ook met als gevolg voor ons waarschijnlijk wel de grootste
  energiecrisis uit onze geschiedenis. Een energiecrisis die mede het gevolg is trouwens
  van een uit de hand gelopen globalisering, waar vele landen veel te afhankelijk
  zijn geworden van andere, dikwijls niet betrouwbare partners. En dat laatste is
  een eufemisme. ''t Kan verkeren!\\n\\nDe energiecrisis met daaraan gekoppeld een
  torenhoge inflatie en mogelijk een economische crisis hangen als donkere wolken
  boven onze wereld, volgens sommige voor de eerstvolgende vijf zware winters. En
  dus wordt ook onze provincie en het meerjarenplan geconfronteerd met, voor het derde
  jaar op rij en mogelijk voor de resterende jaren van het meerjarenplan, met zware
  uitdagingen. ''It''s a dirty job, but someone''s got to do it''. En in de politiek
  is die ''iemand'' de meerderheid onder controle van de oppositie.\\n\\nDie donkere
  wolken, collega''s, zijn wel degelijk terug te vinden in dit meerjarenplan en de
  aanpassing van de kredieten. In vergelijking met het initi\u00eble meerjarenplan
  is dit plan het resultaat van de wisselvalligheden die noopten tot ernstige aanpassingen
  de voorbije jaren en nu. Ik ben benieuwd hoe dit meerjarenplan er tegen het einde
  van de legislatuur zal uitzien. ''t kan verkeren.\\n\\nMaar toch zijn er ook nog
  zekerheden in de wereld. Ook nu geeft het Rekenhof in al zijn mildheid zijn zegen.
  Nog \u2026 ik herhaal: nog blijven het voorziene gecumuleerde beschikbaar budgettair
  resultaat en de, gecorrigeerde weliswaar, autofinancieringsmarge, vooral dankzij
  de APB''s, de EVAP''s en de decretalen, jaarlijks gelijk aan of groter dan nul.\\n\\nMaar
  wel in het oog te houden, volgens ons, zijn de jaarlijkse budgettaire resultaten.
  In het boekjaar 2022 min 59,9 miljoen als ik het goed gelezen heb, in het boekjaar
  2023 min 18,7 miljoen zoals het er nu naar uitziet. Zelfs als het negatief resultaat
  van het boekjaar 2023 tot die min 18,7 miljoen beperkt wordt, dan is het te hopen
  dat 2024 en 25 inderdaad het voorziene positieve beschikbaar resultaat geven, zo
  niet zitten onze opvolgers in de volgende legislatuur met een probleem. En die ''t
  kan verkeren zal voor hen, wie ze ook zijn, dan eerder een tandengeknars dan een
  vaststelling zijn.\\n\\nEen ander zwak punt is dat de provincie voor 60% van zijn
  inkomsten afhankelijk is van de goede wil van vooral de Vlaamse overheid en voor
  34% van de buidel van de gezinnen en de bedrijven. En laat dat nu juist het probleem
  zijn. Noch de Vlaamse regering, noch de bedrijfs- en gezinsbuidel zijn, uitzonderingen
  niet te na gesproken, bodemloos. En de energiecrisis, de torenhoge inflatie en de
  mogelijke economische crisis hakken hier diep op in en dreigen wel degelijk een
  gat in de bodem te slaan.\\n\\nMeevallers zijn dan weer:\\n\\nHet is gezegd dat
  corona ons toegelaten heeft een mooie buffer aan te leggen. Opnieuw, ik heb het
  twee jaar geleden gezegd, blijkt elk nadeel zijn voordeel te hebben.\\n\\nDe minderuitgaven
  omdat de bijdragen voor de tweede pensioenpijler verschoven zijn naar de reservebuffer
  van Prolocus, waaruit blijkt dat samenwerking in grotere entiteiten ook zijn voordeel
  heeft. ''t Kan verkeren en mag ook al eens meevallen.\\n\\nEn natuurlijk hebt u
  gelijk dat in deze onzekere, wisselvallige dagen, tijden, niet alle risico''s vooraf
  kunnen ingeschat worden. De grote meerkosten in de komende jaren zijn ontegensprekelijk
  naast oplopende infrastructuurdossiers, de personeelskosten waar als gevolg van
  de hoge inflatie dit jaar de lonen al vier keer aangepast werden door overschrijding
  van de spilindex. Een vijfde keer volgt waarschijnlijk nog deze maand en voor volgend
  jaar \u2026 uw gok is zo goed als de mijne.\\n\\nTwee, de evolutie van de energiekost
  gas en elektriciteit is nog een groter vraagteken \u2026 uw gok is zo goed als de
  mijne.\\n\\nDrie, de financi\u00eble ontvangsten. Volgens uw gegevens zou de gezinsbelasting
  met ongeveer 2 miljoen per jaar, bedrijfsbelasting met 1 miljoen per jaar en onroerende
  voorheffing met 5 miljoen per jaar toenemen als gevolg van de indexering. Of dat
  echter zal volstaan om de extra uitgaven van de energiecrisis en de indexering van
  de personeelskosten op te vangen \u2026 uw gok is zo goed als de mijne. Maar weet
  wel dat zeker onder de wisselvalligheden waarmee we moeten rekening houden, ''t
  niet kan verkeren dat er tijdens deze legislatuur hogere of nieuwe belastingen zouden
  komen. Maar gelukkig, gelukkig kunnen er in juni 2023 aanpassingen aan dat meerjarenplan
  doorgevoerd worden, maar dat zal inderdaad continu monitoren zijn om aanof bij te
  passen. Of zoals u het zelf zo subtiel zegt, daar juist nog, ''samen met het Departement
  Financi\u00ebn een traject lopen om de financi\u00eble maturiteit en zelfredzaamheid
  te verhogen''. Het is bijna dichterlijk gezegd op zijn Bredero''s. Het Vlaams Belang
  zal het in de komende jaren alleszins kritisch opvolgen en waar opportuun meewerken
  om die tering naar de nering te zetten.\\n\\nCollega''s, laat mij ook nog op een
  aantal geselecteerde concrete punten ingaan, die u, mijnheer de gedeputeerde, bij
  de ''overhandiging van de boeken'' voor de verenigde commissie van 8 november hebt
  vermeld.\\n\\nZo zou het Departement Logistiek tegen 2025 op elke provinciale site
  een masterplan gebouwen maken. Daartoe worden een aantal mensen, een aantal specialisten
  aangeworven en het geheel zal ondersteund worden door een projectingenieur gebouwautomatisatie
  en slimme gebouwen. Een strak plan, zeker als je naar de resultaten kijkt van dit
  nieuwe provinciehuis, daar ben ik het mee eens. Alleen ga ik er natuurlijk van uit,
  of mag ik hopen dat het plan iets ambitieuzer is dan dat de functie zichzelf terugverdient.\\n\\nOndanks
  alle donkere wolken en wisselvalligheden die op ons afkomen gaat het leven verder
  en de provincie ook, ook met nodige investeringen. Vergroening, beleving, samenwerking,
  ruimtelijk beleid, plannen zijn ordewoorden. En de ''troetels'' of de ''dada''s''
  zijn fietsinfrastructuur, parken, domeinen, gebouwen en scholen. En water \u2026
  het belang daarvan hebben we vorige week nog gehoord in de rede van de gouverneur.\\n\\n''Natuur
  en landbouw zijn geen tegengestelden van elkaar'' lees ik. Ik hoor het graag zeggen.
  Dan mag ik er dus van uitgaan dat de provincie net iets meer in dialoog zal blijven
  met de landbouwers dan dat het geval is bij de Vlaamse regering waar natuur en landbouw
  eerder diametraal tegenover elkaar lijken te staan. Wij hebben met onze Hooibeekhoeve
  en Pluimveebedrijf twee mooie proefbedrijven en zelfs onderzoekscentra in onze provincie.
  Straks bij de vragen van collega De Quick horen we wel graag iets meer over de betaalbaarheid
  voor de landbouwers van de innovaties die daar uitgewerkt worden.\\n\\nMogen wij
  naast de verdere investeringen en verbetering van de fietsostrades en andere infrastructuur
  ook nog eens een boompje opzetten, een lans breken over de uitwerking van een campagne
  rond fietsveiligheid. En dan heb ik het over het wangedrag van sommige gebruikers
  van die fietsinfrastructuur die gebod en verbod aan hun laars lappen en daarom,
  daarvoor, daardoor ook dikwijls oorzaak zijn van toenemende ongevallen. Misschien
  kan ook hiervoor eens gebruikt gemaakt worden van ATV en andere regionale media.\\n\\nEn
  tot slot ons personeel: de belangrijkste motor van de provincies. Na twee coronajaren,
  die aan hun resultaatgericht presteren niets gewijzigd hebben, moeten ze zich nu,
  net als iedereen, leren omgaan met een leven dat op korte tijd stukken duurder wordt,
  met een energiecrisis die daar nog eens bovenop komt en met het werken in een killige
  19 graden. Onze dank gaat uit naar hen, naar u en uw troepen mijnheer de griffier
  en de financi\u00eble beheerder, voor alle info die we gekregen hebben over dit
  meerjarenplan en voor in het algemeen hun inzet voor de provincie en de inwoners
  van de provincie. En dit ondanks het durende zwaard van Damocles waar ik het seffens
  in mijn andere tussenkomsten zal over hebben. Een vooruitziend maar humaan personeelsbeleid,
  een verdere professionalisering, levenslang leren, collegialiteit en leidinggevenden
  met een voorbeeldfunctie zijn voor ons sleutelbegrippen opdat het personeel ondanks
  alle wisselvalligheden gewapend zou zijn voor de toekomst.\\n\\nDames en heren,
  in een tijdsbestek van vijftien minuten kan natuurlijk niet alles gefileerd worden
  en besproken, maar dit zijn de voornaamste bedenkingen van het Vlaams Belang bij
  de bespreking van dit meerjarenplan iets over halfweg. Zoals de vorige jaren zullen
  wij dit meerjarenplan niet goedkeuren, maar met alle mildheid, die ook wij soms
  hebben, ons onthouden, wetende dat we in veranderende wisselvallige tijden leven
  waar alles kan verkeren. Of \u2026 om te besluiten met enkele voor deze tijden toepasbare
  citaten van Bredero, de stadsdichter van de noordelijke Nederlanden, ons echte vaderland:
  ''t Gaat met de mensen als met een brug. Ontzettend zware lasten krijgt hij somwijlen
  te dragen, maar er is bij de bouw op gerekend. Of, training in ontbering blijft
  ons op dit ondermaanse ten dringendste aanbevolen. ''t Kan inderdaad verkeren.\\n\\nNr.
  0/6 van de agenda\\n\\nTussenkomst fractievoorzitter Groen bij het meerjarenplan
  en het budget 2023.\\n\\nVOORZITTER.- Dank u wel mijnheer Valkeniers. Mijnheer Vandendriessche
  heeft het woord.\\n\\nDe heer VANDENDRIESSCHE.- Voorzitter, collega''s, er zitten
  in deze zaal geen stoute kinderen, oei \u2026 verkeerde speech sorry.\\n\\nCollega''s,
  voorzitter, gouverneur,\\n\\n''2022: het jaar waarin alles weer in de plooi valt?''
  Zo luidde de intro van de nieuwsbrief van mijn lokale fietsersbond-afdeling bij
  het begin van het afgelopen jaar. We zaten nog volop in de laatste fase van de zoveelste
  lockdown en de vraag was duidelijk zodanig gesteld dat er stilletjes gehoopt werd
  dat ze geen antwoord behoefde omdat het antwoord zonder meer positief zou zijn.
  Maar als we aan het einde van dit jaar de balans opmaken, kunnen we de vraag jammer
  genoeg alleen maar negatief beantwoorden. Want na twee jaar pandemie kunnen we enkel
  vaststellen dat onze samenleving aan een reusachtige snelheid van de ene crisis
  in de andere tuimelt: klimaatcrisis, coronacrisis, oorlog in Oekra\u00efne, energiecrisis
  enzovoort. Begin jaren ''70 wees de Club van Rome al op het acute gevaar van de
  klimaatopwarming en daarvan zien we nu steeds vaker en steeds ernstiger de gevolgen.
  De coronacrisis drukte ons bovendien voor de allereerste keer zeer pijnlijk met
  de neus op de feiten, waartoe een nietsontziende neoliberale globalisering kan leiden:
  een vleermuis op een markt in China kan vandaag de dag zonder problemen de hele
  wereld op zijn kop zetten, laat staan wat het gevolg kan zijn van Russische bommen
  op een kerncentrale in Oekra\u00efne...\\n\\nEn dan hebben we het te midden van
  die wereldwijde explosieve ontwikkelingen nog niet gehad over de mogelijke institutionele
  crisissen, in de Verenigde Staten, in de Europese Unie en natuurlijk ook in ons
  land, waar telkens opnieuw de discussie wordt aangewakkerd over zin en onzin van
  bepaalde instellingen op federaal, regionaal, provinciaal en ook gemeentelijk niveau.
  Denk wat dit laatste betreft maar aan de discussie over de fusies. De schaalvergroting
  op gemeentelijk niveau brengt ons rechtstreeks bij de rol en de invulling van het
  provinciale niveau, waarover bij het begin van deze legislatuur werd gesteld dat
  er sprake zou zijn van een\\n\\ninstitutionele rust. Ironisch dat juist de Vlaamse
  minister bevoegd voor binnenlands bestuur die rust weer kwam verstoren, enkele jaren
  geleden, met zijn voorstel over de regiovorming en nog maar enkele maanden geleden
  met het voorstel om een fusie door te voeren over de grenzen van de provincies heen.
  Boortmeerbeek-Mechelen, weet u nog wel, waarbij de eigen richtlijnen om niet langer
  buiten de eigen regio allianties aan te gaan compleet genegeerd werd.\\n\\nOndertussen
  wordt er ook aan de andere kant van de provincie getracht om buiten de lijntjes
  van de regiovorming te kleuren. Minister Somers had vorig jaar nog nadrukkelijk
  geweigerd dat de gemeente Zwijndrecht deel zou uitmaken van de regio Waasland, onder
  meer omdat Zwijndrecht tot de Vervoerregio Antwerpen behoort, maar ondertussen maakt
  niemand vanuit dat perspectief een bezwaar als er plotseling sprake is van een mogelijke
  ''interprovinciale'' fusie tussen de Oost-Vlaamse gemeenten Beveren en Kruibeke
  en de Antwerpse gemeente Zwijndrecht. Een gemeente extra, Boortmeerbeek, een gemeente
  minder, Zwijndrecht \u2026 De provincie staat erbij en kijkt ernaar. De bevoegdheid
  van de regio''s en de toekomst van de provincies ligt natuurlijk op Vlaams niveau,
  maar ik zou er toch voor willen pleiten dat het provinciale niveau sterker de kaart
  trekt van het belang van het tussenniveau, hoe dat er in de toekomst zal uitzien.
  Provincies, regio''s, intergemeentelijke samenwerkingsverbanden, \u2026 what''s
  in a name? Wie op een lokaal niveau aan politiek doet, en daar reken ik ook het
  provinciale niveau bij, beseft op dit moment in Vlaanderen het belang en de impact
  van \u00e9\u00e9n essentieel gegeven: vele gemeenten, ook de middelgrote, zijn niet
  opgewassen tegen de immense opdracht waar ze nu al voor staan en in de toekomst
  nog eens in het kwadraat op hen afkomt, onder meer omdat de Vlaamse overheid steeds
  meer taken naar het lokale niveau doorschuift. Vele gemeenten vinden gewoon het
  juiste personeel niet meer om al die taken uit te voeren en kunnen ook niet op dezelfde
  schaal als bijvoorbeeld de provincie aan outsourcing doen. Op de provincieraad van
  oktober keurden we een agendapunt goed om in te stappen in een raamcontract met
  de Vlaamse overheid voor de inhuring van ICT-medewerkers ter waarde van 6 miljoen
  EUR, bovenop het lopende raamcontract DICT van 8 miljoen EUR. Voor externe ITconsultancy
  komt dat dus neer op een kostprijs van 14 miljoen EUR. Vele kleine en middelgrote
  gemeenten vinden net als de provincie ook niet de geschikte IT-profielen, maar beschikken
  niet over dergelijke budgetten om zulke opdrachten uit te besteden. Dan lijkt het
  mij evident dat we geleidelijk aan moeten evolueren naar een systeem waarin de provincie
  die pool van ICT''ers ook ter beschikking stelt aan de lokale besturen.\\n\\nEn
  dan komen we tot de kern van de zaak: het zal er in 2024 niet om gaan of we de provincies
  moeten afschaffen en of de provincies overbodig zijn, zoals minister Somers zich
  nochtans nog eens liet ontvallen naar aanleiding van de erkenning van de geloofsgemeenschap,
  het zal er om gaan welke invulling van het intermediaire niveau relevant genoeg
  is om de gemeenten te ondersteunen, om daadwerkelijk een B2B-rol te vervullen, van
  bestuur tot bestuur, op een manier die de gemeenten niet met meer lasten opzadelt.\\n\\nDan
  wordt er natuurlijk ook vaak naar de fusies van gemeenten als oplossing gekeken,
  maar de moeizame zoektocht naar personeel en de complexiteit van ettelijke bevoegdheidsdomeinen,
  van ruimtelijke ordening over mobiliteit tot en met energie, zal er daarom niet
  minder om zijn. Gaat een fusie van twee, drie gemeenten ervoor zorgen dat het overheidsniveau
  meteen aantrekkelijker wordt als werkgever? Trekt dat sowieso sterkere profielen
  aan? Dat is nog maar de vraag. En ondertussen vergroot de afstand tussen de burger
  en het lokale bestuur. Daarom zou ik de deputatie en bij uitbreiding een organisatie
  als de VVP willen vragen om luider op de tafel te kloppen om dat belang van de ondersteuning
  van onze gemeente te benadrukken, vooral op de lange termijn. Al die fusieverhalen
  gaan natuurlijk gepaard met de partijpolitieke waan van de dag, die gretig wordt
  opgepikt door de pers, maar wat heeft de burger daaraan? Eigenlijk zou de provincie
  daar een heldere en objectieve visie aan kunnen koppelen vanuit de prioriteit van
  die B2B, zeker als onze provinciale grenzen worden aangetast bij mogelijke fusies.\\n\\nDit
  is dus op dit moment het kader waarin onze provincie haar taken moet vervullen.
  Het is een kader dat op alle mogelijke manieren gekenmerkt wordt door \u00e9\u00e9n
  woord, het woord ''transitie'' of ''overgang''. ''Verschuivingen'', noemt de schrijver
  Stefan Hertmans het in een recent gepubliceerd essay. Verschuivingen die uiteraard
  ook de provincies niet onberoerd laten. Daarom was het een goede zaak dat we na
  de aanpassing van ons huishoudelijk reglement, een rechtstreeks gevolg\\n\\nnog
  van de vorige budgetbesprekingen eind 2021, meteen een actualiteitsdebat hielden
  over de energiecrisis. Het was nog wat zoeken en tasten, want ''debat'' is misschien
  een te sterk woord voor de manier waarop we het in september hebben aangepakt: alle
  fracties die netjes een aantal energiethema''s aankaartten en vervolgens het antwoord
  van de deputatie, zorgvuldig voorbereid door de kabinetten van dienst. Op \u00e9\u00e9n
  specifiek moment was er toch wat meer animositeit in de discussie en dat was toen
  mijn fractie, tezamen met Vooruit en Open vld, verwees naar de mogelijk positieve
  impact van de groepsaankopen, die in onze provincie zoals bekend werden afgeschaft,
  maar in de provincies Oost- en West-Vlaanderen nog steeds met groot succes worden
  georganiseerd. Daarop was het antwoord van gedeputeerde Lemmens dat de leveranciers
  niet zouden kunnen volgen, maar het omgekeerde is waar: de oproep van de groepsaankoop
  in OostVlaanderen werd stopgezet omdat anders het aantal ingeschrevenen te hoog
  zou zijn en d\u00e1n de sector eventueel niet meer zou kunnen volgen natuurlijk.
  De groepsaankopen blijven, met andere woorden, immens populair. Een gemiste kans
  toch wel voor onze provincie, want zowel in Oost- als West-Vlaanderen wordt bijvoorbeeld
  ook de volgende stap gezet: samen met de zonnepanelen kunnen de mensen ook voor
  een thuisbatterij inschrijven, een provinciaal aanbod dat zeer tastbaar is voor
  elk gezin dat erop ingaat.\\n\\nVoor de rest van de tussenkomst, voorzitter, focus
  ik graag op twee thema''s die onze fractie ook tijdens de komende budgetzittingen
  aan bod zal laten komen. Daarover kunnen we dus relatief kort zijn, maar ik doe
  toch al graag de belangrijkste idee\u00ebn uit de doeken. Enerzijds zou ik een vergelijking
  willen maken tussen twee instellingen die in principe een gelijkaardige doelstelling
  hebben, maar die duidelijk een andere budgettaire klemtoon krijgen, wat misschien
  niet altijd terecht is, met name het Havencentrum en het PIME, Provinciaal Instituut
  voor Milieueducatie. Anderzijds wil ik ook nog even stilstaan bij de niet altijd
  evidente situatie van Cultuurhuis de Warande in Turnhout.\\n\\nWat het Havencentrum
  betreft denk ik dat we niet voldoende kunnen benadrukken dat er de afgelopen jaren
  een indrukwekkend parcours is afgelegd, met als orgelpunt normaal gezien het jaar
  2025 waarin het nieuwe Havenbelevingscentrum aan de Droogdokkensite geopend wordt,
  alle pluimen daarvoor naar de directeur. Maar koken kost geld en dat hebben we de
  afgelopen jaren ook mogen vaststellen in het Havencentrum. De dotatie, die in 2017
  nog 716.000 EUR bedroeg is sinds het begin van deze legislatuur gestegen naar een
  jaarlijkse dotatie van meer dan 1 miljoen EUR en die systematiek van de verhoogde
  dotatie per jaar zal minstens tot 2024 worden aangehouden. Uiteraard heeft dat te
  maken met het project van het nieuwe Havenbelevingscentrum: dat wordt de spil van
  de ''maritieme belevingssite'' die de stad aan de voormalige Droogdokken wil uitbouwen
  en daarvoor draagt de provincie alvast 8,5 miljoen EUR aan. Met alle ontwikkelingen
  van de laatste jaren dienen we ons vanuit een provinciaal oogpunt toch wel de vraag
  te stellen welke finaliteit er aan die extra middelen zal verbonden zijn en waar
  we als provincie uiteindelijk zullen staan zodra het Havenbelevingscentrum zijn
  deuren opent. ''Was sich liebt neckt sich'', hoorde ik de eerste gedeputeerde verklaren
  tijdens zijn uitleg over het budget 2023 begin november. Hopelijk mondt de vrijage
  tussen de provincie en het Havenbedrijf niet uit in plagerijen waarbij de provincie
  uiteindelijk met lege handen achterblijft. Of zoals de griffier het treffend verwoordde
  tijdens een vorig vast bureau naar aanleiding van de evaluaties die worden opgestart
  voor de APB''s: de vraag bij een APB is hoe sterk de A van autonomie moet zijn en
  hoe sterk de P van provincie. Maar bij het Havencentrum lijkt de A voor de A van
  de stad te staan, of moet het dan een H van het Havenbedrijf worden? Met andere
  woorden HPB, een ''Haven-Provincie-Bedrijf''?\\n\\nDe constructie van de samenwerkingsovereenkomst
  met het Havenbedrijf en de stad, waarbij het Havencentrum vanaf juni 2025 inkantelt
  in de vzw Havenbelevingscentrum, roept budgettair alvast de nodige vragen op. Nu
  is het Havenbelevingscentrum juridisch nog een filiaal van het APB, maar als het
  Havencentrum inkantelt in de vzw, kunnen we toch wel stellen dat de weg openligt
  om het Havencentrum over te dragen aan het Havenbedrijf AntwerpenBrugge en dat het
  Havenbedrijf dan wel een heel mooi cadeautje krijgt. Daarbij mogen we bovendien
  niet vergeten dat we nog 2,2 miljoen EUR aansnijden uit de reserves van het Havencentrum.
  Wordt er achter de schermen misschien nagedacht over een gelijkaardige werking zoals
  die van ons Havencentrum in Zeebrugge? Op zich nog geen gekke gedachte vanuit\\n\\neen
  overkoepelend perspectief, maar dat lijkt dan eerder een taak voor de Vlaamse overheid.
  Het lijkt er in ieder geval alle schijn van te hebben dat heel deze operatie een
  voorbode is voor het afsnijden van het Havencentrum op provinciaal niveau. Daar
  bestaan zeker inhoudelijke argumenten voor: zo is de werking van het Havencentrum
  zeer sterk op de stedelijke scholen en het ommeland van de stad gericht. Voor scholen
  uit de Kempen is een uitstap naar het Havencentrum geen evidentie, maar dat hoeft
  nog niet te betekenen dat we deze provinciale instelling op een financieel presenteerblaadje
  aan de stad en/of het Havenbedrijf moeten aanbieden.\\n\\nEn dan duikt toch weer
  het doembeeld van de afslanking van de provincies op. Bij de overheveling van de
  provinciale musea naar de stad in 2016-17 werd er in deze raad plechtig gezworen
  dat die doorschuifoperatie geen impact zou hebben op de werking en het personeel.
  Maar wat hoorden we enkele weken geleden bij de budgetbesprekingen in de stad? DIVA,
  de opvolger van het provinciale Diamantmuseum, zal het met een pak minder medewerkers
  en middelen moeten stellen. De museale werking van DIVA komt daardoor op losse schroeven
  te staan. Ik hoop dat de middelen die we nu vrijmaken voor het Havenbelevingscentrum
  terechtkomen in een duurzame structuur, ook als in een niet zo verre toekomst zou
  blijken dat een belevingscentrum uiteindelijk geen prioriteit blijkt te zijn voor
  het Havenbedrijf, want dan is de burger \u2013 alweer - de klos. Eigenlijk zou de
  provincie het credo moeten hanteren ''Wat we zelf doen, doen we beter''. Maar ondertussen
  gaat het helemaal de andere kant uit. Eind vorige week mochten we via de pers vernemen
  dat ook het Suske en Wiske Kindermuseum in Kalmthout in de etalage wordt gezet,
  nadat het nog maar pas gerenoveerd is, meer bepaald in 2019 voor 275.000 EUR. Als
  Vlaanderen of de lokale overheden, zoals in dit geval de gemeente Kalmthout, onze
  instellingen niet willen overnemen, zetten we ze gewoon te koop, luidt blijkbaar
  het devies. De uitbating zou niet langer een taak van de provincie zijn, daarvoor
  kijkt men naar de priv\u00e9sector. Geen evidentie, want wat is hier nu de bedoeling
  van? Een soort Plopsa-omgeving? Wordt Jerommeke een slappe versie van kabouter Plop?
  En als er geen overnemer gevonden wordt, zou de werking zelfs stopgezet worden.\\n\\nEn
  dan kijk ik toch wel even naar uw partij, mevrouw Helsen, gaat u zomaar toestaan
  dat al het harde werk van uw voorgangers uit uw partij zomaar met de grond gelijkgemaakt
  wordt? Zij die deze provincie mee het aanzien hebben gegeven dat ze ooit gehad heeft?
  Verleden tijd natuurlijk, de gloriejaren zijn voorbij: dit indrukwekkende gebouw
  met de ramen in het diamanten logo vervelt eigenlijk tot een kaas met gaten, met
  steeds meer lege plekken in de organisatie, een fata morgana van wat ooit was. Laat
  de cd&v dit werkelijk allemaal zomaar gebeuren? Mevrouw Helsen, we zien het met
  lede ogen gebeuren alleszins.\\n\\nSoit, de ontwikkelingen in het Havencentrum brengen
  mij naadloos bij het PIME. Het PIME heeft net als het Havencentrum eveneens een
  werking die gericht is op jongeren en scholen. Ook het PIME heeft misschien een
  ligging die, net als het Havencentrum in Lillo, misschien niet de meest optimale
  is, namelijk op een steenweg tussen Lier en Duffel waarbij je de vraag kan stellen
  of de bereikbaarheid op die plek tegemoet komt aan de noden van alle bezoekers uit
  de provincie. Aan de achterzijde is PIME weliswaar prachtig gelegen aan de rechteroever
  van de Nete, wat een schooluitstap met de fiets zeker de moeite waard maakt, maar
  natuurlijk niet voor leerlingen die uit pakweg Rijkevorsel of Kalmthout komen. Het
  PIME heeft met andere woorden op sommige vlakken dezelfde noden als het Havencentrum,
  maar niet hetzelfde budget, laat staan dezelfde machtige lobby als de havenlobby,
  die nu duidelijk ruggensteun geeft aan het Havencentrum, wat in het verleden wel
  eens anders was. Het PIME verdient anderzijds wel dezelfde maatschappelijke steun,
  want waar ze bij het ontstaan in de jaren ''90 nog relatief in de marge van de provincie
  opereerde, groeide ze stilaan uit tot een educatiecentrum dat in het hart van de
  maatschappelijke discussies komt te staan en op steeds meer interesse van scholen
  en leerkrachten kan rekenen. Dat bewijst de recente actie waarbij de Universiteit
  Antwerpen via het PIME leer- en documentatiemateriaal ter beschikking stelt voor
  leerkrachten die in hun klas geconfronteerd worden met klimaatontkenners en nu via
  het lesmateriaal van de UA de correcte wetenschappelijke analyse meteen bij de hand
  zullen hebben om concrete antwoorden te geven. Kortom, het PIME wordt als provinciale
  speler steeds belangrijker, verdient meer aandacht en\\n\\nsteun. Tijdens de budgetbesprekingen
  voor de bevoegdheid Leefmilieu ga ik graag het gesprek aan om mee na te denken hoe
  we het PIME een grotere zichtbaarheid kunnen geven.\\n\\nDat brengt ons tot slot
  bij de Warande. Daar is sinds het begin van de zomer plots een driekoppig team aan
  de slag als directie. Dat de Warande te hoog gegrepen was voor de Vlaamse overheid
  en de stad Turnhout, dat mochten we tijdens de vorige legislatuur al vernemen, toen
  de provincie cultuur als bevoegdheid moest afstaan, maar toch nog de Warande moest
  blijven besturen. Maar dat we daarvoor nu ondertussen al drie directeurs nodig hebben,
  dat is toch wel een opvallend gegeven. We zijn dan ook benieuwd naar de beleidsintenties
  van de nieuwe directie voor de laatste twee jaar van deze legislatuur, die hopelijk
  toch ook de lange termijn voor ogen houden. Of krijgen we dan toch ook weer een
  scenario waarbij de Warande vriendelijk naar de uitgang wordt gedirigeerd? Maar
  om op welk niveau te belanden? Dat is dan de vraag van \u00e9\u00e9n miljoen. Ook
  de Warande doet een beetje denken aan het Havencentrum: de cultuurtempel in Turnhout
  heeft immers ook nog een mooie renovatie en uitbreiding vanwege de provincie gekregen
  in 2018, net voor de exit? En ontvangt natuurlijk een jaarlijkse provinciale dotatie
  van 3,7 miljoen EUR. In de jarenlange geschiedenis van de Warande zijn prachtige
  initiatieven gegroeid, denk maar aan het filmfestival Mooov, of Theater Stap. We
  hopen dan ook dat mogelijke bewegingen achter de schermen niet het kind met het
  badwater gaan weggooien als de Warande ooit een andere bestemming krijgt, of - nu
  al - door onze drie directeurs op een lager pitje wordt gezet in afwachting van
  de uitverkoop. Mijn collega Louis Schoofs gaat er graag dieper op in tijdens de
  daarvoor voorziene budgetbespreking.\\n\\nOm te eindigen dank ik uiteraard de griffier
  en zijn financi\u00eble diensten voor al het voorbereidend werk bij deze budgetbesprekingen.
  De Warande brengt ons in ieder geval terug bij ons uitgangspunt: de rol van de provincie
  als steun en toeverlaat voor de lokale besturen. Op de homepage van de website van
  de provincie Antwerpen zagen we enige tijd geleden alvast de knop ''aanbod voor
  lokale besturen'' verschijnen, met daaronder in de vorm een zogenaamde pillar pages
  verschillende links naar relevante beleidsdocumenten en cijfermateriaal voor de
  gemeente en hun ambtenaren. Ik hoop dat die ambtenaren ook voldoende ge\u00efnformeerd
  zijn en dat al die informatie nu gebundeld staat op de site van de provincie. Het
  is in ieder geval een belangrijke stap in de richting van de provincie als een intermediairniveau
  dat de gemeente rechtstreeks bijstaat in moeilijke tijden. Ik dank u.\\n\\nNr. 0/7
  van de agenda\\n\\nTussenkomst fractievoorzitter Open vld bij het meerjarenplan
  en het budget 2023.\\n\\nVOORZITTER.- Dank u wel mijnheer Vandendriessche. Mijnheer
  Anciaux heeft het woord.\\n\\nDe heer ANCIAUX. - Geachte voorzitter en ondervoorzitter,
  geachte leden van de deputatie, mijnheer de griffier, beste collega''s, vooreerst
  wil ik namens de Open vld fractie alle diensten en alle medewerkers danken voor
  de opmaak van alle documenten en ook voor hun toelichtingen die ze gegeven hebben
  in de diverse APB''s en vzw''s in de raden van bestuur en ook op de commissies.\\n\\nHet
  is al gezegd, maar iedereen weet het, twee derde van de bestuursperiode zit erop.
  We bespreken vandaag en de volgende dagen de aanpassing van het meerjarenplan en
  de kredieten voor 2023. Twee\u00ebntwintig was inderdaad aangekondigd, na al die
  moeilijke corona jaren ''20 en ''21, als een iets normaler jaar ware het niet dat
  president Poetin en zijn regering ervoor kozen om Oekra\u00efne binnen te vallen
  en een oorlog te ontketenen. Een grote vluchtelingenstroom, oorlogsvluchtelingen,
  een energiecrisis en een torenhoge inflatie die we al vele decennia niet\\n\\nmeer
  gezien hadden, was ons deel. Hopelijk komt er in ''23 wat rust in het economisch
  marktmechanisme en krijgen we geen 5 spilindexoverschrijdingen.\\n\\nBij de voorstelling
  van het bestuursakkoord begin deze legislatuur beloofde het provinciebestuur, de
  meerderheid, een ambitieus, duurzaam, effici\u00ebnt - ik zie het nog allemaal mooi
  staan - dienstbaar en verbindend beleid. En eigenlijk was de Open vld in grote mate
  bereid toe te geven dat deze ambitie, niet volledig volgens onze grote tevredenheid,
  maar toch vrij goed ingevuld is. We dachten eigenlijk zelfs een voldoende te geven,
  maar toen onze gedeputeerde Luk Lemmens op de commissie van 8 november ons eigenlijk
  triggerde en zei ''de oppositie hoeft helemaal niet positief te zijn'', dan hebben
  we eigenlijk onze ingebakken liberale positieve ingesteldheid wat opzijgezet. We
  hebben daar echt inspanningen voor gedaan, maar ook dat lukte. En bij nader inzien
  is het beloofde ambitieus, duurzaam, effici\u00ebnt, dienstbaar en verbindend beleid
  tot op heden nog helemaal niet goed gerealiseerd.\\n\\nDe vraag die we ons moeten
  stellen is of er met een exploitatiebudget van 205,7 miljoen EUR en een investeringsbudget
  van bijna 58 miljoen EUR voldoende rekening wordt gehouden met de actuele noden
  en de verzuchtingen eigenlijk van onze burgers en onze bedrijven. Dat er een positief
  advies is van het Rekenhof dat is maar logisch. Je voldoet aan de voorgestelde eisen
  anders moesten we de bespreking niet doen. Als je geen positieve AFM hebt op het
  einde van de planperiode dan mochten we de boeken toedoen.\\n\\nEn natuurlijk pleit
  Open vld ook voor een gezonde provinciale toestand, voor gezonde provinciale belastingen.
  Maar ook al moet de autofinancieringsmarge inderdaad pas op het einde van de planperiode,
  dus in ''25 positief zijn, zien we toch dat in ''23 het weliswaar positief is maar
  met de hakken over de sloot, maar 15.920 EUR. Een kleine tegenslag brengt onze AFM
  in ''23 in het negatief. Geen drama maar toch niet goed. Geeft nog hogere stijgingen,
  bijvoorbeeld van de interesten, we weten het niet het is daarstraks ook al gezegd,
  uw planning kan juist zijn maar kan ook verkeerd zijn, maar als we nieuw op te nemen
  leningen gaan moeten financieren eventueel met hogere interesten, geeft dat geen
  gevaar voor onze financi\u00eble toekomst? En wij vrezen eigenlijk een beetje van
  wel, want de heer Jan De Haes heeft zelf gezegd dat de vorige jaren dat men eigenlijk
  voorzichtig gebudgetteerd heeft. De vraag is, is dat nu ook wel zo? We verwachten
  bij de eerstvolgende aanpassing in juni gelukkig een positief rekeningresultaat,
  omdat u de vorige jaren zelf zegt dat u zo voorzichtig geweest bent en dat zal misschien
  wel nodig zijn om de onder ramingen van de uitgaven, maar zeker de over ramingen
  van de inkomsten in het voorliggende budget te kunnen compenseren en Prolocus zal
  u niet blijven helpen.\\n\\nCollega Bakelants en ikzelf hebben de werking van de
  provincie de voorbije jaren natuurlijk veel beter leren kennen dan als je buitenstaander
  bent, dan weet je dat eigenlijk niet zo goed. En we hebben een enorme grote waardering
  voor al het geleverde werk, zeker van onze medewerkers. En ook al staat de afschaffing
  van de provincie in ons partijprogramma, en we zijn natuurlijk niet alleen, ik zie
  dat bij Groen, ik zie dat bij Vlaams Belang, ik zie dat natuurlijk ook bij N-VA,
  toch weten we dat onze provinciale organisatie een goed draaiend geheel is waarvan
  we de werking waarderen. Bij SPA weet ik het eigenlijk niet of het erin staat, bij
  cd&v weet ik zeker dat ze de provincies willen behouden en PVDA, ik wist niet dat
  u een programma had.\\n\\nOm deze organisatie en het dienstenaanbod van de burgers
  te financieren gebruikt de provincie diverse belastingen. Zoals eenieder weet zijn
  we allerminst tevreden met de twee algemene provinciebelastingen, die op de bedrijfsoppervlakte
  en die op de gezinnen. We zullen daarom ook zeker de reglementen die voor liggen
  in punt 3.3 en 3.5 niet goedkeuren, we gaan die afkeuren en ook het punt 3.4 wat
  betreft de opcentiemen op de onroerende voorheffing. We klaagden al eerder aan dat
  in de algemene belastingreglement voor gezinnen geen rekening gehouden wordt met
  de singles. Vorig jaar is daar een amendement voor ingediend door An, we hebben
  dat dit jaar niet gedaan, we hebben nu een ander ingediend. In het verleden zijn
  er ook nog andere partijen die eigenlijk amendementen indienden omdat onze reglementen
  echt niet meer van deze tijd zijn. Dat alleenstaanden en eenoudergezinnen evenveel
  belastingen moeten betalen als een koppel of een tweeoudergezin vinden we eigenlijk
  onaanvaardbaar. Ook het reglement van de algemene provinciebelasting op bedrijfsvestingen
  is gewoon niet meer van deze tijd. En ik kom daar straks nog wel over op tussen.
  Het wordt echt tijd dat het provinciebestuur eigenlijk opdracht geeft om de twee
  geciteerde reglementen tegen volgend jaar\\n\\nalleszins volledig te hervormen.
  Misschien met wat meer ambitie te tonen door het herdenken van deze belastingreglementen
  en duurzaamheid en een modern, effici\u00ebnt en dienstbare economische bedrijfsactiviteit
  te stimuleren, in plaats van gewoon op oppervlakte te belasten, of iedere burger
  of ieder gezin op dezelfde manier te belasten. Je moet daar veel creatiever in zijn.
  Ook duurzaamheid en de sociale gelijkheid moet meegenomen worden in die belasting
  voor de gezinnen. Het zou de beoogde effici\u00ebntie van het beleid ondersteunen
  en de burgers en bedrijven meer binden aan de provincie en haar beleid. Herdenk
  alstublieft die oude manier van belasten die we nu kennen.\\n\\nOok de behandeling
  van het Suske en Wiske Museum, en het is al een paar keer gezegd, stoot ons tegen
  de borst. Ook al heeft u dat bij het begin van de legislatuur wel aangekondigd,
  ik vind het eigenaardig dat u nu zegt, we gaan eerst vieren, de 25e verjaardag,
  en als we niemand vinden dan gaan we ermee stoppen. Een minimum dat je zou kunnen
  doen indien je geen overnemer vindt, want u bent niet a priori tegen een overnemer
  als een goed draaiend museum kan blijven, maar indien je geen overnemer zou vinden
  zou het u sieren om niet op 1 januari ''25, maar met een beetje respect naar het
  volgende bestuur nog een jaar extra te werken. Ik weet dat moet u nu niet in het
  meerjarenplan zetten, want dat loopt op dit moment maar tot ''25, maar het zou u
  sieren dat u een nieuw bestuur dan die keuze laat maken en niet een nieuw bestuur
  in december ''24 laat opstarten met een sluiting een maand later. Ik vind dat weinig
  respectvol. En natuurlijk is het beleid niet allemaal kommer en kwel, denk maar
  aan de werking van de provinciale recreatieparken, de groendomeinen. Jan deed dat
  vroeger goed, nu doet mevrouw Colson dat schitterend dus wat dat betreft heel goed.
  Ook de goede werking van het provinciaal onderwijs, de innovaties bij Kamp C, de
  Hooibeekhoeve, Pluimveebedrijf en zoveel meer zijn natuurlijk heel belangrijk in
  onze werking en ondersteunen wij. En het speerpunt, de fietsostrades die investeringen
  en wat daar allemaal gedaan wordt, fantastisch werk. Maar het is eigenlijk niet
  aan de oppositie om hier verder opsomming te geven van alles wat dat goed gaat.
  De provincieraad zal wel bij de behandeling van de diverse punten zien hoe wij stemmen,
  indien men daarin ge\u00efnteresseerd is, en dan weet men wat wij vinden dat goed
  loopt en niet goed loopt. Wij gaan natuurlijk op het einde van de zitting, donderdagavond
  zeker, punt 3.2 zijnde de aanpassing van het meerjarenplan kredieten ''23, niet
  goedkeuren.\\n\\nCollega''s ik wil ook de gouverneur, ze is hier wel niet, en al
  de andere sprekers bedanken die afgelopen vrijdag aanwezig waren op de openingsrede
  van onze gouverneur.\\n\\nIn een andere hoedanigheid word ik quasi dagelijks met
  water en zeker met waterbeheersing in al zijn facetten en aspecten geconfronteerd.
  De Open vld-fractie zal alle initiatieven die het provinciebestuur opzet om waterbuffering,
  ontharding en dergelijke meer te faciliteren, zeker ondersteunen. Collega Nathalie
  Cuylaerts heeft daarstraks al verschillende punten aangehaald, projecten aangehaald.
  Schitterend, wij ondersteunen dat allemaal. Ik ben er wel van overtuigd dat er in
  Vlaanderen nog veel werk op stapel staat om iedereen met de neus in dezelfde richting
  te krijgen zodat de door de gouverneur gestelde problematiek en die van de professoren
  en van het Vlaams expertenpanel klimaatadaptatie, dat dat onverwijld uitgevoerd
  kan worden. Want iedereen in deze raad, en ik vond dat schitterend dat de gouverneur
  dat zei, heeft nood aan het blauwe goud. Dank u.\\n\\nNr. 0/8 van de agenda\\n\\nTussenkomst
  fractievoorzitter Vooruit bij het meerjarenplan en het budget 2023.\\n\\nVOORZITTER.-
  Dank u wel mijnheer Anciaux. Mevrouw Talhaoui heeft het woord.\\n\\nMevrouw TALHAOUI.-
  Geachte voorzitter, geachte mevrouw de ondervoorzitter, beste deputatie, zeer achtbare
  collega''s, mijnheer de griffier, goedemiddag. We hebben het hier over de budgetbesprekingen
  en de budgetopmaak en dan hebben we het over onze kostbare provinciale centen. De
  budgetopmaak dit jaar had niet enkel af te rekenen met de nawee\u00ebn van de coronacrisis,
  maar ook met de oorlog tussen Rusland en Oekra\u00efne die de wereld in een nog
  grotere energiecrisis heeft geduwd. De inflatie heeft proporties aangenomen die
  in decennia en door uiteenlopende regeringen niet voor mogelijk werden gehouden.
  Onze provincie heeft zoals alle bestuursniveaus die dit land rijk is ook in de klappen
  gedeeld, jammer genoeg. We begrijpen dat de exploitatie-uitgaven fors de hoogte
  zijn ingeschoten door de hoge energiekosten en de inflatie. De personeelsleden van
  de provincie, van de APB''s en van de EVA''s hebben ook recht op de indexering van
  hun lonen om hun hoge energiekosten en levensduurte het hoofd te kunnen bieden.
  Dat de provincie opnieuw een tandje heeft moeten bijsteken en haar financi\u00eble
  verantwoordelijkheid opneemt voor de APB''s en de EVA''s voor de verwarming van
  gebouwen en andere infrastructuur in deze omstandigheden, ligt in de lijn van de
  verwachting en kunnen we dan ook volmondig bijtreden.\\n\\nOnze provinciale ruimte,
  wat het voorontwerp provinciaal beleidsplan ruimte betreft en de strategische visie
  die daarin wordt ontwikkeld, herhalen we hier toch nog terug onze bedenkingen. Het
  voorontwerp bulkt van algemene principes, wie kan tegen algemene principes zijn,
  maar de vertaalslag naar beleid om onze schaarse open ruimte te organiseren roept
  nog veel vraagtekens op. Zo is het bijvoorbeeld nog onduidelijk welke hanteerbare
  ruimtelijke bouwstenen dit plan aanreikt en hoe men dit gaat laten doorwerken. Ik
  herhaal nog eens onze opmerkingen: voor welke vervoer genererende activiteiten gaat
  men bijvoorbeeld MOBER''s verplichten, welke overstromingsgebieden gaat men voorzien?
  Ik verwijs naar de overstromingen, naar de tsunami van regen en water in Walloni\u00eb.
  Ik verwijs ook naar de speech van de gouverneur vorige week waar dat ook werd aangehaald.
  Is er een programma om signaalgebieden, harde bestemmingen in overstromingsgevoelig
  gebied via groene PRUP''s en groene bestemmingen te geven? Welke woonuitbreidingsgebieden
  in open ruimte gaat men behouden en vooral, welke gaat men schrappen? Het aangekondigd
  participatieparcours in het najaar verwelkomen we, omdat het mee bepalend zal zijn
  voor de ruimtelijke toekomst van onze provincie. We zijn benieuwd hoe de verschillende
  gemeentebesturen zullen reageren, vooral zij die al vergevorderde plannen hebben
  getekend over hun eigen ruimte.\\n\\nIk wijd dit jaar graag ook bijzondere aandacht
  aan de zogenaamde dochters van de provincie. Die APB''s en EVA''s zorgen namelijk
  mee voor de uitstraling van onze provincie en hebben in deze moeilijke tijden het
  beste van zichzelf gegeven, zowel intern als naar het publiek toe. In tegenstelling
  tot vele andere publieke instellingen bleef bijvoorbeeld het Arboretum van Kalmthout
  open tijdens COVID, dat werd gewaardeerd, zo blijkt vandaag uit de bezoekerscijfers.
  Het nieuwe Haven- en Havenbelevingscentrum, laten we het maar Havencentrum 2.0 noemen,
  waar jong en oud kennis zal kunnen maken met een wereldhaven door middel van de
  nieuwste multimediatechnieken, zal tegelijkertijd als een soort van permanente jobbeurs
  kunnen fungeren. Werken in de tweede grootste haven en diverse talenten hiervoor
  aantrekken samen met andere hiervoor gemandateerde instellingen, zal de aantrekkingskracht
  en bekendheid van het Havencentrum 2.0 nog doen toenemen. Echter, vraagtekens en
  bezorgdheid blijven hangen bij de budgettaire implicaties van de uitbouw en de verbouwing
  van de Droogdokkensite waar het nieuwe APB zal komen. Zal de dotatie van de provincie
  volstaan om het concept, de uitbouw en de renovatie tot een goed einde te brengen?
  Zal de provincie en cours de route toch nog met extra geld moeten over de brug komen?
  De ervaring leert immers dat partijen uit de private- en of andere overheidssectoren
  wel gul zijn in beloftes aan de provincie, maar dat veel minder zijn in hun betalingen.
  Ik heb ook verschillende keren gevraagd wat de rechtsvorm, wat de vennootschapsvorm
  zal zijn tussen die drie partners, want de rechtsvorm zal ook bepalen wat de verantwoordelijkheden
  zijn en ook de daar tegenover gestelde middelen.\\n\\nDezelfde ongerustheid hebben
  we wanneer we naar het nieuwe management van de Warande kijken. De Warande kon in
  het verleden bogen op de wervende leiding van \u00e9\u00e9n directeur, omringd door
  een team van knappe cultuurkoppen. Sinds het begin van deze legislatuur zien we
  een opeenvolging van leidinggevenden, die na korte tijd de fakkel hebben doorgegeven.
  De\\n\\nkeuze om nu met een triumviraat uit de priv\u00e9sector in zee te gaan is
  een veeg teken aan de wand. Als we het dagelijks bestuur van een publieke cultuurtempel
  als de Warande al uitbesteden aan de private sector, ja, wat zegt het dan over het
  vertrouwen in zichzelf? We hebben onze bedenkingen ook geuit tijdens een van de
  raden van bestuur over deze toch ongebruikelijke constructie en blijkbaar staan
  we niet alleen met dit scepticisme. Ook vanuit Vlaanderen wordt er kritisch gekeken
  naar deze constructie, maar nog veel zorgwekkender is de feedback die we uit het
  ruime middenveld hebben mogen ontvangen. Het triumviraat bestaat uit drie consultants
  die als trio de Warande moeten begeleiden in zijn taken en in zijn aantrekkingskracht
  naar het publiek. We vragen ons af, gaat dat een fulltime-job zijn voor deze drie
  managers? We vragen ons ook af, wat zal de toekomst van de Warande en het Warandemodel
  zijn als dit team er niet in slaagt om deze Kempische cultuurtempel in ere te herstellen
  en dynamisch te houden? Daarnet heeft mijnheer de gedeputeerde, Luk Lemmens, fresh
  from the press, gezegd dat blijkbaar ook de Warande, naast het Suske en Wiske Museum
  en DocAtlas, zal overgedragen worden na deze legislatuur. Het triumviraat heeft
  twee jaar de tijd gekregen om de Warande terug op de rails te zetten. En dan? We
  weten dat de Warande niet veel minnaars heeft in Vlaanderen. Wil dat zeggen dat
  het Warande-model en de Warande dan ten grave zullen gedragen worden? De toekomst
  zal het uitwijzen, want het huidige provinciebestuur heeft ook geen knip meer over
  voor instellingen die geen winsten genereren, zoals het Suske en Wiske Museum dat
  vandaag in De Morgen uitgebreid is aan bod gekomen, niet alleen in De Morgen maar
  ook in andere media. We weten sinds vrijdag wat het lot is van dochters van de provincie
  die geen private zaak dienen kunnen. Spijtig dat we geen twee speeches kunnen voorbrengen
  vandaag, want Inga zal daar zeker later ook op terugkomen, had een hele speech klaar
  over het Suske en Wiske Kindermuseum.\\n\\nOnze medewerkers, onze provinciale ambassadeurs.
  Wanneer we naar onze medewerkers kijken denken we dat we noch qua competentie, noch
  qua loyaliteit te klagen hebben. Ze zijn stuk voor stuk ambassadeurs voor een bestuur
  dat intussen niet zo graag een diplomatieke vertegenwoordiging heeft. Hoe stiller,
  hoe beter, zo lijkt het wel. Net als zovele publieke instellingen en priv\u00e9bedrijven
  proberen we het hoofd te bieden aan de concurrentiestrijd om de beste en hoog gekwalificeerde
  informatici naar onze provincie te lokken. Een grote inhaalbeweging is al gemaakt
  door dure externe consultants te vervangen door interne. De strategie komt het ICT-budget
  en de dienstverlening zeker ten goede. Een pluim voor het hoofd van dit departement
  en zijn medewerkers die een vitale functie vervullen in de werking van onze provinciale
  structuren. Dit doet geen afbreuk aan de leidinggevenden in andere departementen,
  maar zonder ICT, wat hadden we dan de vorige COVID-jaren moeten doen? Een effici\u00ebnt
  duurzaam en verbindend personeelsbeleid impliceert ook gelijke kansen en een ambitieus
  gendergelijkheidsplan dat diversiteit als een troef ziet, zeker in een provincie
  met meer dan 170 nationaliteiten en dito talenten. Een evenwichtige genderverhouding
  in leiderschapsfuncties en besluitvormingsstructuren kan niet meer op de lange baan
  geschoven worden. Daadkracht en durf tonen in een vooruitstrevend en inclusief HR-beleid
  zal de provincie zeker sieren. Het bestuur zal qua schaalgrootte goed geplaatst
  zijn om andere besturen en bedrijven te inspireren alsook de SDG rond gender aanklampend
  ter harte werd genomen. Dit laatste geldt bij uitstek voor onze grootste instelling,
  waar leerlingen met een zeer diverse afkomst en achtergrond zichzelf moeten kunnen
  spiegelen in hun leerkrachten en docenten.\\n\\nCollega''s, deputatie, deze budgetopmaak
  is niet de onze, wij zouden andere keuzes hebben gemaakt. Natuurlijk dat niet alles
  fout loopt in deze provincie, maar zoals collega Anciaux daarnet terecht heeft opgemerkt,
  het is ''the duty of the opposition to oppose'' en ook kritisch te kijken naar wat
  deze deputatie naar voren heeft gebracht. En we zullen ook u de volgende dagen ondervragen,
  interpelleren over andere thema''s die hier vandaag niet in mijn hoofde aan bod
  zijn gekomen. Maar ik wil deze tribune niet verlaten voordat ik iedereen heb bedankt
  die aan deze budgetopmaak heeft bijgedragen. Ik denk aan de griffier en zijn diensten,
  ik denk aan de dienst financi\u00ebn en zijn leidinggevende en de verschillende
  departementen voor het tot stand brengen van deze begroting. Ik dank u.\\n\\nNr.
  0/9 van de agenda\\n\\nTussenkomst fractievoorzitter PVDA bij het meerjarenplan
  en het budget 2023.\\n\\nVOORZITTER.- Dank u wel mevrouw Talhaoui. Mijnheer Sohier
  heeft het woord.\\n\\nDe heer SOHIER.- Collega''s, mijnheer de voorzitter, mevrouw
  de ondervoorzitter, geachte deputatie, mijnheer de griffier, waarde collega''s.
  Natuurlijk het is al een paar keer gezegd van onze kant ook, de waardering voor
  het harde werk van de administratie en het personeel, ze maken dit immers mogelijk
  voor ons om onze controletaken uit te voeren. Ook dank aan de mensen die hier in
  en rond de provinciezaal hun werk verrichten om deze vergaderingen te laten plaatsvinden
  in de beste omstandigheden.\\n\\nHet is een stresserende periode, cijfers controleren,
  zoveel mogelijk de commissies en de raden van bestuur bijwonen. Het was zeer intens,
  je kunt immers niet alles doen en onze fractie is niet zo groot dus er komt nogal
  wat op deze schouders terecht. Maar het is noodzakelijk om dat te doen, om nu het
  politieke beleid te kunnen evalueren en een standpunt in te nemen en enkele tussenkomsten
  voor te bereiden, maar dat hoort erbij.\\n\\nNa de crisisjaren, en men heeft er
  al naar verwezen, met COVID de voorbije twee jaar, de huidige energiecrisis die
  toeslaat geeft terug opnieuw nieuwe uitdagingen voor iedereen. Bovendien, het is
  ook al gezegd, als je als laatste komt zijn er een aantal dingen al verteld, maar
  bovendien hebben we in Europa met een oorlogssituatie een grote uitdaging waarin
  dat we zien dat onze hoogste beleidsmakers zich laten opsluiten in een oorlogsretoriek,
  in plaats van volop te kiezen voor vredesonderhandelingen. Ondertussen betaalt de
  gewone man en vrouw de prijs, zowel in Oekra\u00efne, in Rusland, als in de rest
  van de wereld. En de grote aandeelhouders van de energiebedrijven en van de multinationals
  zitten op rozen. Maar goed, dat is niet onmiddellijk een bevoegdheid of een verantwoordelijkheid
  van deze provincie, maar het heeft wel een zware impact op de financi\u00eble mogelijkheden
  van de lokale besturen en daar hoort dit provinciebestuur ook bij. Daar kunnen we
  stellen dat er heel wat beweegt. Gedeputeerde Lemmens zei het op de verenigde raadscommissie
  van 8 november, u zei 9 november maar het was een dag daarvoor 8 november, 2023
  wordt ook voor de provincie Antwerpen een financieel uitdagend jaar, want de voornoemde
  coronacrisis, de oorlog, de energiecrisis en de galopperende inflatie zorgen ervoor
  dat er stijgende kosten voor energie zijn met 6,8 miljoen, wat betreft de bouwkosten
  gaat het om 11,5 miljoen en voor de lonen van personeel gaat het, volgens de cijfers
  dan, om 33,7 miljoen EUR. Dus in totaal gaat het om een grote meerkost die moeilijk
  te voorzien was.\\n\\nEnkele dingen wil ik toch vernoemen hier. In verband met personeel,
  even duidelijk stellen: de meerkost van het personeel, de indexering van de salarissen
  heeft te maken met de stijgende inflatie, met andere woorden het duurder wordende
  leven. Gelukkig hebben wij hier bij ons de index die zorgt ervoor dat de gezinnen
  van de werknemers niet armer worden wanneer de inflatie de pan uit swingt. De koopkracht
  beschermen is immers het doel van dit mechanisme. Mensen hebben vandaag heel wat
  onzekerheid in hun leven, inkomensonzekerheid, jobonzekerheid, loopbaanonzekerheid,
  de druk en de stress op heel wat gezinnen is enorm en daar wordt al heel lang voor
  gewaarschuwd door experts. De cijfers voor langdurige afwezigheid tonen dat ook
  aan, meer en meer mensen bezwijken onder de stress. En daar bovenop, en dat is daarstraks
  ook al vermeld, komen de plannen van minister Somers. Volgens ons is het afbouwen
  van het ambtenarenstatuut een nefaste zaak, niet enkel voor de werknemer in kwestie
  maar ook wat betreft de dienstverlening en de administratie. Zoals jullie allemaal
  weten hebben wij een goed contact met de vakbonden en een gunstige wind liet een
  schrijven van het ACV van de openbare diensten op ons bureau terechtkomen. De mevrouw
  verwoordt de bezorgdheid van vele werknemers in de lokale besturen, dus ook die
  van de provincie. Zij schrijft dat ze begrijpt dat de druk voor de besturen maar
  ook voor de medewerkers toeneemt, zij gaat verder en ik\\n\\nciteer: ''als verantwoordelijke
  vakbond begrijpen we dat er moeilijke keuzes moeten gemaakt worden''. Maar, schrijft
  ze verder, ''uitzonderlijke noodsituaties beantwoorden met oplossingen die structureel
  ingrijpen in de dienstverlening is niet wijs. Wij, de vakbond dus, vragen nu om
  koelbloedig te blijven en ook aan de langere termijn te denken. Afstotingen, privatiseringen
  zijn voor ons, de vakbond dus, foute beslissingen en schijnoplossingen''. Want,
  zegt zij, die factuur is dikwijls hoger dan wanneer we het zelf zouden doen en de
  kwaliteit van de dienstverlening lijdt daar ook vaak onder. Ze vervolgt met te stellen
  dat ''het wegnemen van bevoegdheden de afbouw van het personeelsbestand als gevolg
  heeft gehad'' en dat dit en ik citeer terug, ''elke dag gevoeld wordt op de werkvloer
  en dat de medewerkers vrezen voor verdere stappen richting uitkleding van de provinciale
  dienstverlening. Daarnaast hebben die werknemers zoals iedereen ook te maken met
  hogere kosten en daar bovenop hun job op de helling zetten zou getuigen van onmenselijkheid'',
  einde citaat. Zij rekent tot slot op jullie wijsheid en koelbloedigheid. Zij staat
  niet alleen want ondertussen heeft ook de VVP zich uitgesproken tegen het voorstel
  van minister Somers. De werknemers en de vakbonden die voerden samen actie op 22
  november laatstleden tegen het voorstel van de rechtspositieregeling en de verdere
  afbouw van de ontslagbescherming van personeelsleden, zowel statutaire als contractuele
  medewerkers. De provincie staat bekend als een goede werkgever, dus mijn vraag hier
  is wat het standpunt van de deputatie van de provincie Antwerpen daarover is en
  hoe u dat gaat communiceren aan de werknemers, de medewerkers.\\n\\nVerder worden
  heel wat ingrepen voorzien betreft het optimaliseren van financi\u00eble processen
  en in het provinciale patrimonium, want en ik citeer: ''minder gebouwen betekent
  minder kosten'' zegt gedeputeerde Lemmens daarnet nog. De uitverkoop van openbaar
  bezit gaat dan verder, concludeer ik dan. De vraag die dan terug opnieuw opborrelt
  en dat is een vraag die ik niet alleen stel: is dit dan een voorbereiding op de
  afschaffing in de toekomst van de provincies, of wat moet ik daaruit concluderen?\\n\\nNiet
  alleen negatieve zaken zitten in de plannen, ook positieve dingen waren te horen,
  bijvoorbeeld het investeren om te komen tot klimaatzuinige en klimaatneutrale gebouwen.
  Dat is een goede zaak, denken wij. Ook verder investeren in de fietsostrades is
  toe te juichen, daar wordt heel gretig gebruik van gemaakt, zeker met goed weer.
  Toch duiken daar, en dat is ook al vermeldt, toch duiken daar ook nieuwe knelpunten
  op. Immers met het toegenomen gebruik en het grotere aandeel aan speedpedelecs in
  het verkeer zijn daar specifieke oplossingen nodig om ongevallen te voorkomen. Ook
  zijn sommige kruisingen nog gevaarlijk voor de weggebruikers.\\n\\nGedeputeerde
  Lemmens zei dat de verzelfstandigde entiteiten, lees de APB''s en de EVAP''s een
  traject zullen doorlopen om hun financi\u00eble maturiteit en zelfredzaamheid te
  verhogen, dus ook daar, en dat werd net een stuk bevestigd, wordt toch de volgende
  stap gezet naar de privatisering. Al die investeringen die men deed om de diensten
  aan de bevolking en de besturen op te zetten en te verfijnen, worden zo voorbereid
  om af te stoten, of begrijp ik het verkeerd?\\n\\nOm de kosten onder controle te
  krijgen zei hij ook dat men voor 2023 de provinciebelastingen zal indexeren tot
  43 EUR voor ''23, volgens mij gaat het dan om een indexering van 7 procent. Men
  stelt in het verslag dat een, en ik citeer, ''een algemene evenwichtige spreiding
  van de belastingdruk moet nagestreefd worden''. Dus in principe is men akkoord met
  onze stelling dat een belasting moet gebaseerd zijn op het inkomen en dus proportioneel
  moet zijn, zodat de sterkste schouders de zwaarste bijdrage leveren aan de maatschappij,
  dus ook aan de provincie. Maar in de praktijk is volgens ons de provinciebelasting
  een vlaktaks voor de gezinnen en blijven wij ons daartegen verzetten. We zullen
  dus de meerjarenplanning opnieuw niet goedkeuren.\\n\\nGenoeg over de financi\u00ebn,
  daar is al dikwijls genoeg naar verwezen, nu naar \u00e9\u00e9n van de projecten
  die de provincie op stapel heeft staan en dat is het herbebossen, waar u over sprak
  een maand geleden. Er zijn heel wat projecten in onze provincie om te herbebossen.
  In mijn buurt bijvoorbeeld, in Heist-op-den-Berg, maar ook in de gemeente Putte,
  worden een paar honderden en misschien duizenden bomen aangeplant. Dat is een goede
  zaak natuurlijk, want niet enkel in het zuiden moeten we initiatief nemen om de
  natuur te beschermen en her aan te planten, ook hier bij ons is dat nodig in de
  strijd tegen de klimaatverandering. Maar waar er\\n\\nvolwassen bossen zijn die
  natuurlijk en wild gegroeid zijn, wil men die kappen. Gezond, volwassen bos in de
  Kleiputten van Boom-Terhagen bijvoorbeeld wil men kappen, dat kunnen we moeilijk
  begrijpen en blijkbaar wij niet alleen, maar daar kom ik in tussenkomst later op
  terug. Ik ga het hierbij houden, misschien binnen mijn tijd. Zoals ik eerder aangaf
  gaan we het meerjarenplan niet goedkeuren, alleszins de vaststelling van het meerjarenplan
  omdat dat zoiets is als het vaststellen dat de zon schijnt, nu is ze niet aan het
  schijnen maar u begrijpt wat ik bedoel. Stemmen over het feit dat we een vaststelling
  doen dat er een plan is, is fundamenteel anders dan het stemmen over de inhoud,
  wij gaan dus niet goedkeuren. Ik dank jullie voor jullie aandacht.\\n\\nVOORZITTER.-
  Dank u wel mijnheer Sohier, dan zijn we aan het einde van de tussenkomsten en dan
  zou ik voorstellen om een korte pauze van tien minuten te organiseren en wij komen
  terug rond tien na vier. Dank u wel.\\n\\nDe vergadering wordt geschorst te 15.56
  uur en hernomen te 16.10 uur.\\n\\nNr. 0/10 van de agenda\\n\\nKorte repliek van
  gedeputeerden Luk Lemmens en Jan De Haes.\\n\\nVOORZITTER.- We gaan verder met onze
  provincieraad van vandaag. Gedeputeerde Lemmens heeft het woord.\\n\\nDe heer LEMMENS,
  gedeputeerde- Dank u wel collega''s. Zoals steeds is het altijd een tweedeling in
  de debatten. Ik heb het in november ook gezegd, wanneer je de eerste tussenkomsten
  hoort vanuit de meerderheid, dan denk je: goed, we zijn goed bezig, als deputatie
  geloven wij ook dat we goed bezig zijn, uiteraard. En dan komt natuurlijk de oppositie
  aan het woord en dan wordt het wel een ander verhaal. Maar in elk geval, ik kan
  toch maar vaststellen bij het applaus dat de meerderheid meer eensgezind is dan
  de oppositie, want die klapten alleen voor hun eigen partij en wij klapten tenminste
  samen voor ons, dus dat gaf toch wel een eendracht. En de andere partijen zaten
  allemaal voor zichzelf te applaudisseren, maar goed, dat gewoon \u2026 er waren
  er zelfs die niet applaudisseerden. We moeten zeggen, applaudisseer nou voor Koen,
  die heeft dat goed gedaan. In elk geval \u2026\\n\\nInderdaad, mevrouw Cuylaerts,
  u benadrukt het terecht dat we volop blijven investeren in een aantal zaken, in
  de groene oases, boskansenkaart, Havenbelevingscentrum, Kamp C, PIH, enzovoort enzovoort
  en de fietsostrades. Ook mevrouw Weckhuysen zegt terecht, besturen is vooruitkijken
  en nood aan flexibiliteit om bij te sturen indien nodig en dit bestuur kan dat,
  veel dank voor die woorden. Ik denk dat er inderdaad bijgestuurd is en dat moet
  je ook doen als je bestuurt. U benadrukte terecht het belang van de zomerscholen,
  het extra inzetten op klimaatadaptatie, op betaalbaar duurzaam wonen, op duurzame
  landbouw en ja, u hebt ook terecht gezegd dat daar de Europese middelen natuurlijk
  onontbeerlijk zijn en dat klopt ook natuurlijk. We hebben onze middelen maar wij
  moeten ook proberen om via Europa ook nog middelen te krijgen om hier een beleid
  te voeren.\\n\\nDan komt meneer Valkeniers aan het woord en dan komen we natuurlijk
  in de Groot Nederlandse gedachte met Bredero en dat het kan verkeren. Iedereen,
  en ook in alle tussenkomsten, waren we het, meerderheid, oppositie, wel over eens
  en dat is dat je uit een COVID-crisis komt, de crisis nu in Oekra\u00efne en dat
  we nu inderdaad in een serieuze crisis zitten, daar is iedereen het over akkoord.
  En dan moeten wij als meerderheid, mijnheer Valkeniers, inderdaad veranderingen
  aanbrengen aan onze budgetten en dat doen we dan ook. Maar natuurlijk sommige sprekers
  hebben ook vergeten natuurlijk dat wij niet alleen gekeken hebben naar 2023, maar
  dat wij ook verder hebben gekeken. We hadden het ons gemakkelijk kunnen\\n\\nmaken
  en zeggen van kijk, onze meerjarenplanning loopt tot 2025 en daarna zien we wel.
  Maar wij hebben via vier globale uitgangspunten, ik wil ze toch nog eens herhalen
  ook voor de laatkomers, dan weet u nog goed wat ik daar gezegd heb. Vier globale
  uitgangspunten: inzetten op onze basisopdrachten, aangepaste wendbare en effici\u00ebntere
  organisatie, kostenbewust met personeelskader en organisatie omgaan, inzetten op
  functies met een duidelijke return op het vlak van energie, klimaat, verwerving
  van Europese middelen. En dat zijn de vier basisprincipes die wij gehanteerd hebben
  bij het opzetten van dit meerjarenplan. En we hebben dan ook veertien opdrachten
  gegeven aan het managementteam om die gefaseerd uit te voeren.\\n\\nDan is er nog
  iets waar dat dan het verschil tussen meerderheid en oppositie, dat is dat de oppositie
  altijd onze medewerkers bedanken, en dat is ook goed, dat mag, maar de deputatie
  heeft precies niks met deze begroting te maken. Maar goed, dat hoeft niet, gelukkig
  is er dan nog de meerderheid om ons toch eens te bedanken en te zeggen, het is goed
  gedaan. Maar wij zijn ook heel fier op onze medewerkers, ik heb dat daarstraks heel
  duidelijk gezegd.\\n\\nMijnheer Vandendriessche sprak over de fusies net als mijnheer
  Valkeniers die daar straks toch ook nog een vraag over heeft denk ik, over de fusies
  en over de regiovorming. Het is inderdaad zo dat de minister van binnenlands bestuur,
  die ik nu met respect de minister van binnenlands bestuur zal noemen en niet zoals
  ik hem gewoonlijk noem, maar in elk geval dat deze man er regelmatig in slaagt om
  toch nog zaken bij de provincie moeilijk te maken. Dat die minister van binnenlands
  bestuur de rust zelf verstoord, ja, dat klopt, mijnheer Vandendriessche. Ik heb
  dat hier al een paar keer gezegd. Ik kan daar maar mee akkoord zijn, met uw stelling.
  Dat Vlaanderen ook steeds meer taken afschuift op de gemeenten, dat klopt ook. En
  wij stellen ook met u vast dat de gemeenten dat ook niet altijd aankunnen, die opdrachten
  die zij krijgen. Wij proberen zoveel als mogelijk die gemeenten te ondersteunen
  op tal van vlakken. En ook verwijzen naar onze website, waar dat er inderdaad een
  link is waar de gemeenten enorm veel informatie kunnen betrekken. En wat zij ook
  doen.\\n\\nMijnheer Valkeniers had het ook nog over de natuur en landbouw, dat dat
  geen tegengestelden zijn. Daar zijn we het mee akkoord. Gaan wij voldoende in dialoog
  met de landbouwsector? Ik denk inderdaad dat we dat ook doen. We hebben hier mensen
  uit de landbouwsector ontvangen. Ik denk dat collega Helsen ook goede contacten
  heeft met de landbouwsector. En dat we ook via de Hooibeekhoeve en via onze andere
  bedrijven op een goede manier naar die sector kijken.\\n\\nU hebt nog gezegd, mijnheer
  Valkeniers: een lans breken voor campagne rond fietsveiligheid, het wangedrag van
  sommige gebruikers. Mijn persoonlijke visie op dit verhaal is dat je niet \u00e9\u00e9n
  doelgroep moet viseren, maar dat we verkeersveiligheid in zijn algemeenheid moeten
  bekijken. Ik ken evenveel autobestuurders die wangedrag hebben op de baan, als fietsers
  of voetgangers. We moeten naar een algemeen veiligheidsmodel gaan, en ik denk dat
  we daar met verkeersveilige gemeenten, waar we samen met de diensten van de gouverneur
  actie nemen in tal van gemeenten in onze provincie, dat we daar heel veel aan doen.
  Dus op dat gebied gaan we toch wel mee in een sensibilisering van iedereen in het
  verkeer. En dat is belangrijk.\\n\\nMijnheer Vandendriessche, u hebt gewezen op
  het tussenniveau en het belang van het tussenniveau. U kent mijn mening daarover.
  Ik geloof daarin. Ik denk dat wij onze rol spelen, naar de gemeenten toe. En dat
  wij een transitie doen, dat is de essentie. Vandaar dat we dus ook ons aanpassen,
  en ons er ook begrotingstechnisch aan aanpassen.\\n\\nEen beetje raar vond ik uw
  tussenkomst in verband met het Havencentrum. U zit zelf in de Raad van Bestuur van
  het Havencentrum. Heel veel zaken kan u daar ook bespreekbaar maken natuurlijk.
  Maar dat gebeurt weinig. Dus het zou fijn zijn als u dat daar ook deed. Maar nu
  hoor ik u een aantal dingen zeggen, alsof dat wij nu alles aan het klaarmaken zijn
  om dat Havencentrum, om dat in handen te geven van de haven, van de Port of Antwerp-Bruges.
  Ik moet u eerlijk zeggen, wij zijn gewoon aan het zorgen dat wij op een goede manier
  dat Havencentrum binnen de Droogdokkensite kunnen gebouwd krijgen. En dat we daar
  een structuur voor aan het zoeken zijn hoe dat het beste kan, en dat we daar investeringen
  doen. Ik denk dat dat de logica zelf is. De toekomst kan niemand voorspellen, maar
  u blijkbaar wel. Want\\n\\nu hebt daar van alle insinuaties rond gedaan, die volgens
  mij toch niet echt kloppen. Maar ik ben zeker bereid, want u gaat er nog een vraag
  over stellen en dan zal ik u proberen daar nog een antwoord op te geven. U vermeldt
  de besparingen op DIVA. Dat is natuurlijk een stedelijk verhaal. Wij hebben in 2018
  daar afscheid van moeten nemen. Ik heb daar ook mijn vraagtekens bij gehad. Ik heb
  geprobeerd om dat zo goed als mogelijk over te dragen. Dat is ons ook gelukt. Maar
