  De voorbespreking is verplicht voor alle NIEUWE deelnemers. Mocht uw kind reeds
  eerder hebben deelgenomen aan een Kinderendurance rit in Nederland dan is afwezigheid
  bij de voorbespreking toegestaan.\\n\\nBeschrijving dagverloop - stap voor stap\\n\\n1.
  Aankomst & aanmelden bij het secretariaat\\n\\nVoor de eigen rust en dat van de
  paarden is het altijd fijn om op tijd aanwezig te zijn op de startlocatie. Wanneer
  u bent aangekomen kunt u zich het best gelijk aanmelden bij het secretariaat. Daar
  zullen jullie worden voorzien van alle nodige spullen voor de rit en weten wij dat
  jullie goed aangekomen zijn. Daarnaast kunt u daar altijd te-recht mocht u nog vragen
  hebben.\\n\\n2. Voorbespreking\\n\\nTijdens de voorbespreking leggen we aan de kinderen
  uit wat er allemaal staat te gebeuren en waar ze op moeten letten. Bijvoorbeeld
  hoe ze de route kunnen volgen maar ook over de veterinaire keuring en nog veel meer.
  De voorbespreking is verplicht voor alle kinderen die nog niet eerder een kinderendurance
  in Nederland hebben meegereden.\\n\\nSponsor\\n\\nGreen Distance\\n\\nzadelpas service\\n\\nGreen
  Distance komt zadels passen en checken!\\n\\nGreen Distance staat voor comfort en
  kwaliteit tijdens plezierige uren te paard, voor zowel paard als ruiter.\\n\\n\u2022
  Advisering van voer tot zadel.\\n\u2022 Zadel passervice,\\nmet oog voor het hele
  paard en de ruiter.\\n\u2022 Inclusief thermografisch onderzoek van de rug en eventueel
  verder.\\n\\nwww.greendistance.nl\\n\\n3. De (veterinaire) voorkeuring\\n\\nBij
  de Kinderrit hoeven enkel de paarden van de deelnemende kinderen gekeurd te worden,
  dus niet de paarden van de begeleiders. I.v.m. het grote aantal deelnemers is het
  ook niet mogelijk om de begeleidende paarden te laten keuren. Deze mogen, voor de
  rust van de paarden, wel mee naar het terrein van de voorkeuring. Het meenemen van
  het paardenpaspoort van het deelnemende paard of pony is wel verplicht.\\n\\nVooraf
  aan de keuring is er de mogelijkheid om, indien het kind dit wil, langs te komen
  bij de veterinaire assistent. Deze is er om uit te leggen waar de dierenarts allemaal
  naar kijkt en waarom. Zo krijgen de kinderen bijvoorbeeld de mogelijkheid om zelf
  naar hartslag en darmgeluiden van hun pony te luisteren. Daarvoor nemen wij rustig
  de tijd, hou daar rekening mee mocht je hier gebruik van willen maken.\\n\\nMocht
  u vragen hebben voor onze dierenarts of dierenartsassistenten, stel deze dan gerust!\\n\\nLet
  op: het kan best druk zijn bij de keuring waardoor je even op je beurt moet wachten.
  Houd hier rekening mee en kom op tijd.\\n\\nVergeet niet om de veterinaire kaart
  en het paspoort van de pony mee te nemen naar de keuring!\\n\\n4. De start\\n\\nZorg
  ervoor dat je zo\u2019n 5 minuten voor de start je meldt bij de vrijwilliger die
  bij de start zit. Deze zal controleren of de starttijd correct op de veterinaire
  kaart staat. Heb je nog een laatste vraag? Stel deze aan onze vrijwilliger. Wanneer
  het tijd is (je starttijd vindt je op de startlijst), dan wordt je de goede kant
  op gewezen en mag je op pad!\\n\\n5. De route\\n\\nDe route van de kinderendurance
  gaat in alle afstanden uitsluitend over ruiterpaden. De 18 km (men- en fiets)route
  volgt ook een stukje de verharde weg. Let op de markeringen en bij twijfel houd
  altijd het ruiterpad aan. En vooral: Geniet!\\n\\n6. De groompunten\\n\\nGedurende
  de rit kom je 1 (4,5 en 8 km route) of 2 (17 & 18 km route) groompunten tegen. Op
  deze groompunten staan vrijwilligers met drinken \u00e9n wat lekkers voor zowel
  deelnemers alsook de begeleiders en paarden en pony\u2019s. Ook zullen we hier koelflessen
  aanbieden om de pony\u2019s te koelen zoals bij een echte endurancewedstrijd. Dit
  is echter niet verplicht en als de pony het spannend vindt, laat je vooral helpen
  door de vrijwilliger.\\n\\nBij groompunten 1 & 2 mogen ook eigen grooms of supporters
  komen. De routebeschrijving naar de groompunten vindt u iets verder in dit boekje.
  LET OP: Parkeren direct op het groompunt is niet toegestaan. Parkeren mag enkel
  bij de nabijgelegen parkeerplaatsen. Bij het groompunt van de 4,5 km kunnen eigen
  grooms niet komen helaas.\\n\\n7. De finish\\n\\nNa de finish wordt bij binnenkomst
  de hartslag van de pony\u2019s geteld en de finishtijd op de veterinaire kaart genoteerd.
  Daarna hebben de deelnemers 30 minuten de tijd om hun paard of pony te verzorgen
  voordat deze moet worden aangeboden voor de nakeuring bij de dierenarts. De hartslag
  op de finish telt niet mee maar wordt wel gemeten zodat de kinderen het verschil
  kunnen opmerken tussen de hartslagen gemeten op verschillende momenten van de dag.
  Na de finish kunnen de paarden verzorgd worden tot de nakeuring: denk bijvoorbeeld
  aan afsponzen, eten en drinken geven en laten plassen.\\n\\n8. De nakeuring\\n\\nBij
  de nakeuring bekijkt de dierenarts weer alle punten die bij de voorkeuring ook bekeken
  zijn. De nakeuring vindt plaats 30 minuten na de finish. Vergeet niet om de veterinaire
  kaart weer mee te nemen.\\n\\n9. De prijsuitreiking\\n\\nDe prijsuitreiking proberen
  wij zo snel mogelijk plaats te laten vinden. Dit zal ongeveer 45 minuten na de laatste
  finish zijn. Wij verwachten dat dit rond 13:15 uur voor de 4,5 km zal zijn, en rond
  16:30 uur voor de 8, 17 & 18 km. Zorg ervoor dat je erbij bent want IEDEREEEN krijgt
  een prijs!! De prijsuitreiking, net als de voorbespreking, vindt plaats bij het
  secretariaat. In afwachting kan iedereen bij de Reizende Koekenpan een lekke hapje
  eten.\\n\\nNa de prijsuitreiking willen we graag nog een groepsfoto maken waarna
  iedereen weer richting huis kan!\\n\\nRoutes & Groompunten\\n\\nRoutemarkeringen\\n\\nDe
  routes worden gemarkeerd d.m.v. pijlen. Iedere afstand heeft een eigen kleur:\\n\\n\u21d2
  4,5 km in Blauw\\n\u21d2 8 km in Geel\\n\u21d2 17 km in Rood\\n\u21d2 18 km wordt
  NIET uitgezet\\n\\nWanneer er even geen markering hangt: blijf het ruiterpad volgen!\\n\\nRoutes\\n\\nDe
  4,5 km route - BLAUW\\nWerkelijke afstand: 4,7 km\\nTotale stijging/daling: 87 m\\nAantal
  groompunten: 1\\nAfstand van start tot groompunt: 2,8 km\\n\\nDe 9 km route - GEEL\\nWerkelijke
  afstand: 8,2 km\\nTotale stijging/daling: 102 m\\nAantal groompunten: 1\\nAfstand
  van start tot groompunt: 5,3 km\\n\\nDe 17 km route - ROOD\\nWerkelijke afstand:
  17 km\\nTotale stijging/daling: 350 m\\nAantal groompunten: 2\\nAfstand van start
  tot groompunten: 5,3 & 11,7 km\\n\\nDe 18 km route - geen markering\\nWerkelijke
  afstand: 18 km\\nTotale stijging/daling: 330 m\\nAantal groompunten: 2\\nAfstand
  van start tot groompunten: 8 & 14,7 km\\n\\nSponsor\\n\\nEvelien Bruijne\\nwww.EBFotografie.com\\n\\nEenhoorn
  Kinderrit\\n\\nNoodnummer: 06 386 963 68\\n\\nLegenda:\\n- 4,5 km route\\n- 8 km
  route\\n- 17 km route\\n- 18 km (meestal) route\\n- groeproute\\n- parkeren grooms
  (vanaf hier lopen)\\n- grooms punt\\n\\nStart & Finish\\n\\nEenhoorn Kinderrit -
  8 km\\n\\nNoodnummer: 06 386 963 68\\n\\nParkeren grooms\\n\\nStart & Finish\\n\\nGP
  2\\n\\nGemeente Rheden\\n\\nNationaal Park Veluwezoom\\n\\nEenhoorn Kinderrit -
  17 km\\n\\nNoodnummer: 06 386 963 68\\n\\nEenhoorn Kinderrit - 18 km\\n\\nGPS fiets-
  & menrout\\nNoodnummer: 06 386 963 68\\n\\nLegenda:\\n- 18 km (meefiets)route\\n--
  groenroute\\n--- parkeren grooms (vanaf hier lopen)\\no groempunt\\n\\nRoutebeschrijvingen
  groompunten\\n\\nOm groompunt 1 te bereiken dient u de auto te parkeren op parkeerplaats
  de Lange Juffer, de auto MAG NIET bij het groompunt geparkeerd worden. Vanaf de
  parkeerplaats is het nog 200 meter lopen naar het groompunt. Mocht u geen zin hebben
  om te lopen: de route komt ook langs de parkeerplaats.\\n\\nBij groompunt 2 moet
  u uw auto parkeren op parkeerplaats de Plagak op de Schaapsallee. Vanaf daar is
  het een klein stukje lopen naar het groompunt. Zo houden we de weg veilig voor andere
  gebruikers en krijgen wij geen problemen met Natuurmonumenten.\\n\\nGroompunt 3
  is niet bereikbaar met de auto.\\n\\nDe parkeerplaatsen staan ook aangegeven op
  de routekaarten van de wedstrijd met een rode stip. Ook de groomroutes staan met
  een rode stippellijn aangegeven.\\n\\nStart \u2192 GP1\\n\\n1. Bij het verlaten
  van Camping Boszicht, sla rechtsaf op de Priesnitzlaan;\\n2. Op het eerste kruispunt,
  sla rechtsaf de Professor Pellaan op;\\n3. Aan het einde van de weg, sla linksaf
  op de Harderwijkerweg;\\n4. Neem de eerste afslag linksaf, de Badhuislaan op;\\n5.
  Blijf de Badhuislaan volgen, deze veranderd in de Schaapsallee;\\n6. Als u rechtdoor
  blijft rijden rijdt u zo tegen parkeerplaats de Lange Juffer op, op de kruising
  van de Schaapsallee met de Lange Juffer;\\n7. Parkeer de auto op de parkeerplaats.
  Als u de Lange Juffer omhoog loopt, vindt u het groompunt na 200 meter aan de linkerkant.\\n\\nGP1
  \u2192 GP2\\n\\n1. Rij terug op de Schaapsallee, in de richting waar u vandaan kwam;\\n2.
  Na 3 km vindt u aan uw rechterkant het groompunt. Als u verder doorrijdt, vindt
  u aan uw rechterkant parkeerplaats de Plagak. Daar kunt u de auto parkeren. Loop
  vervolgens terug naar het groompunt.\\n\\nStart \u2192 GP2\\n\\n1. Bij het verlaten
  van Camping Boszicht, sla rechtsaf op de Priesnitzlaan;\\n2. Op het eerste kruispunt,
  sla rechtsaf de Professor Pellaan op;\\n3. Aan het einde van de weg, sla linksaf
  op de Harderwijkerweg;\\n4. Neem de eerste afslag linksaf, de Badhuislaan op;\\n5.
  Blijf de Badhuislaan volgen, over het wildrooster heen;\\n6. 1,2 km na het wildrooster
  vindt u aan uw linkerkant parkeerplaats de Plagak. U kunt hier uw auto parkeren;\\n7.
  Loop verder op de Schaapsallee, het groompunt bevindt zich links na ongeveer 300
  meter.\\n\\nGP2 \u2192 Finish\\n\\n1. Rij terug over de Schaapsallee richting de
  Badhuislaan;\\n2. Sla rechtsaf op de Hardewijkerweg;\\n3. Neem de eerste afslag
  rechtsaf, de Professor Pellaan op;\\n4. Sla op het kruispunt linksaf de Priesnitzlaan
  op;\\n5. Na 500 meter kunt u links Camping Boszicht oprijden.\\n\\nLAVOR\\n\u2018n
  gezonde basis\\n\\n\u2018Het begint met een gezonde voeding\u2019\\n\\nHazenhutweg
  2 | Hengelo | T (0)575 46 75 55 | www.lavor.nl\\n\\nSponsor\\n\\nHorse Beads\\nwww.horsebeads.eu\\n\\nBIJ
  ONS VIND JE HET KLEURRIJKSTE ASSORTIMENT TOUW & BIOTHANE PRODUCTEN!\\n\\nVAN TOUWHALSTER
  TOT LEADROPE, VAN NECKROPE TOT TEUGEL. STARTEND MET GRONDWERK OF AL GEVORDERD, VOOR
  IEDEREEN WAT WILS!\\n\\nRegels\\n\\nRegels\\n\\nEr is geen spel zonder regels. Voor
  de veiligheid van alle aanwezigen maar ook om de dag in goede banen te leiden. De
  regels zijn als volgt:\\n\\n- Veiligheid is ten alle tijden de prioriteit;\\n- Het
  is G\u00c9\u00c9N wedstrijd;\\n- Er wordt geen klassement opgesteld, iedereen krijgt
  een prijs!;\\n- Rit is op eigen risico, de organisatie kan nergens aansprakelijk
  voor worden gesteld;\\n- Leeftijd deelnemers: 4 t/m 16 jaar. Bij 4-jarigen is voldoende
  ervaring met paardrijden wel een must;\\n- Leeftijd begeleiders: 18+;\\n- Maximaal
  2 kinderen per begeleider;\\n- Begeleiders mogen te paard, te voet of op de fiets
  mee (bij fietsen wordt een mountainbike ten zeerste aangeraden);\\n- Alle kinderen
  en begeleiders te paard dienen een cap te dragen;\\n- Harnachement dient veilig
  en in orde te zijn;\\n- Min. snelheid: 3 km/u;\\n- Max. snelheid: 9 km/u;\\n- Starten
  mag pas na goedkeuring van de pony/het paard van de deelnemer door de dierenarts;\\n-
  Een combinatie heeft de rit pas goed volbracht wanneer de dierenarts de pony/het
  paard heeft goedgekeurd. Deze nakeuring vindt plaats 30 minuten na de finish;\\n-
  Bij het inschrijfgeld behoren de kosten voor de vergunningen, het gebruikmaken van
  de materialen, het gebruikmaken van het (parkeer)terrein, de verzorging van de aanwezige
  vrijwilligers, het gebruikmaken van de uitgezette route en de prijzen. Verdere kosten
  zijn voor eigen rekening.\\n\\nEn vergeet vooral niet:\\n\\n1. **To Finish is to
  Win**, oftewel: iedereen die met een fitte pony of paard aan de finish komt is een
  winnaar;\\n2. Plezier maken en genieten is het belangrijkste;\\n3. Er zijn geen
  domme vragen, dus wil je wat weten of begrijp je iets niet: laat het ons of onze
  vrijwilligers weten!\\n\\nSponsoren\\n\\nMet dank aan onze sponsors:\\n\\nEpplejeck\\nHORSE
  & RIDER SUPERSTORES\\n\\nLAVOR\u00ae\\nVoer voor professionals\\n\\nCamping Boszicht\\n\\nDe
  Spelerij  De Uitvinderij\\n\\nHorse Beads\\nwww.horsebeads.eu\\n\\nGREEN DISTANCE\\n\\nKNHS
  Endurancevereniging\"", "\"Witte vlekken in de natuurkunde\\n\\nDoor Hans van Leunen\\n\\n19-11-2018\\n\\nSamenvatting\\n\\nDe
  natuurkunde blijkt nog een flink aantal witte plekken te omvatten. Kennelijk is
  dat niet erg essentieel voor de goede werking van de toegepaste natuurkunde. Via
  wat slimme stappen kunnen een aantal van de witte vlekken worden aangepakt. Dat
  levert frappante en niet gedachte resultaten op.\\n\\nInleiding\\n\\nIn mijn jonge
  jaren zag je op sommige kaarten van de wereld nog witte vlekken. Dat duidde op plaatsen
  waar nog nooit mensen uit de westerse wereld waren geweest en die daardoor nog niet
  in kaart gebracht waren. Satellieten die alles van boven kunnen analyseren, bestonden
  toen nog niet. Nu die satellieten wel bestaan en alles in kaart kunnen brengen zijn
  de witte vlekken op de kaarten verdwenen. Er zijn nog wel terreinen die wij mensen
  nog niet volledig kennen. Een goed voorbeeld biedt de natuurkunde. Sommigen denken
  dat we ook op het gebied van de natuurkunde uiteindelijk alles kunnen oplossen.\\n\\nAanpak\\n\\nDe
  echte natuurkundigen weten inmiddels dat er gebieden in de natuurkunde bestaan waar
  we nooit alles van zullen weten. Dat komt voornamelijk omdat deze gebieden zich
  aan onze waarneming onttrekken. De menselijke geest is dan nog vaak in staat om
  zich via redenering een beeld te vormen van hoe de situatie gevormd zou kunnen zijn.
  Ook dat lukt niet altijd. De reden daarvoor is dat er nog geen goede basis bestaat
  waarop die redenering zich zou kunnen baseren. Het gevolg is dat er allerlei fantasietheorie\u00ebn
  ontwikkeld worden. Daar is niemand bij gebaad. De wetenschap en met name de natuurkunde
  heeft zich daartegen verdedigd door te eisen dat elke belangrijke natuurkundige
  uitspraak door ge\u00ebigende experimenten geverifieerd moet worden. Deze aanpak
  wordt de wetenschappelijke methode genoemd. De aanpak voorkomt de fantasietheorie\u00ebn,
  maar heeft ook nare gevolgen. Als het niet mogelijk is om voor een uitspraak een
  passend experiment te vinden, dan mag die uitspraak niet gebruikt worden in een
  wetenschappelijke theorie. In de wiskunde gaat dat anders. Daar gaat men uit van
  postulaten en axioma''s. Die behoeven zelf niet meer bewezen te worden. Alles dat
  ervan afgeleid wordt moet met degelijke en algemeen geaccepteerde methoden vanuit
  de beginselen worden gededuceerd.\\n\\nDe uitweg\\n\\nNu begint het er steeds meer
  op te lijken dat de natuurkundige realiteit in verregaande mate op haar eigen wiskunde
  gebaseerd is. Dat zou betekenen dat de wiskundige methodiek ook in de natuurkunde
  bruikbaar zou moeten zijn. Er zijn nog veel natuurkundigen die zich daartegen verzetten,
  maar om de witte vlekken op te lossen lijkt er geen andere uitweg mogelijk. Om deze
  weg te bewandelen is er \u00e9\u00e9n ding onontbeerlijk. Er moet een fundament
  bestaan waarop de theorie gevestigd kan worden en dit fundament moet met behulp
  van wiskundige methodieken uitgebreid kunnen worden naar meer gecompliceerde lagen
  van de structuur van de fysieke werkelijkheid. Daarbij bestaat nog steeds het gevaar
  dat de uitbreiding in een verkeerde richting geschiedt. Het blijkt echter dat het
  fundament zich gedraagt als een zaadje dat zich alleen tot een bepaald type\\n\\nplant
  kan ontwikkelen. Dit uit zich in het feit dat de wiskunde zelf de nodige beperkingen
  aan de uitbreiding van het fundament oplegt. Dit betekent, dat als de wetenschappers
  voldoende oog hebben voor de door de wiskunde opgelegde beperkingen er weinig gevaar
  bestaat dat de ontwikkeling van fantasietheorie\u00ebn uit het fundament kansen
  krijgt. De wetenschappelijke methode zou deze ontwikkeling dan ook moeten toelaten.\\n\\nUitwerking\\n\\nEr
  blijft nog \u00e9\u00e9n probleem over. Dat is de ontdekking van het fundament van
  de fysieke realiteit. We hebben het geluk dat twee wetenschappers tachtig jaar geleden
  een bruikbaar fundament voor de fysieke realiteit ontdekt hebben. Zij hebben de
  door hen ontdekte relatiestructuur niet als fundament van de fysieke realiteit uitgebracht.
  In plaats daarvan noemden zij hun ontdekking kwantumlogica omdat de structuur erg
  veel lijkt op de toen al bekende klassieke logica. Tegelijk toonden zij aan dat
  een door David Hilbert en anderen kort daarvoor ontdekte topologische structuur
  een deelstructuur bevat die precies gelijk is aan de door Garrett Birkhoff en John
  von Neumann ontdekte kwantumlogica. In feite verschijnt de door David Hilbert ontdekte
  Hilbertruimte direct uit de door het duo ontdekte relatiestructuur. De Hilbertruimte
  gedraagt zich als een gestructureerd opslagmedium. De natuurkundige realiteit slaat
  alle dynamische geometrische gegevens van alle afzonderlijke objecten die in het
  universum voorkomen op in dergelijke opslagmedia. Daardoor vertellen deze opslagmedia
  als een boek over de geschiedenis van het universum. Elk elementair deeltje beschikt
  over een dergelijk boek. Elementaire deeltjes zijn feitelijk elementaire modules
  en gezamenlijk vormen zij alle modules en modulaire systemen die in het universum
  voorkomen. Dit model vertelt het verhaal van een schepper die aan het begin alle
  gegevens vastlegt in de opslagmedia en zijn schepsels vervolgens met rust laat.
  Dit is een frappant resultaat dat regelrecht voortkomt uit het ontdekte fundament
  met de toevoeging dat er elementaire deeltjes bestaan die vrijwel alle andere objecten
  samenstellen. Die toevoeging is sinds de ontdekking van het fundament duidelijk
  geworden. De betekenis hiervan is dat de schepper een modulair ontwerper en modulair
  constructeur is.\\n\\nRealisatie\\n\\nEen ander aspect dat uit die beginjaren van
  de kwantumfysica naar voren komt is dat de schepper gebruikmaakt van stochastische
  processen om de opslagmedia te vullen. Die processen bezitten een karakteristieke
  functie die als een sturingsmechanisme zorgdraagt dat de invulling een samenhangend
  resultaat oplevert. Dit wordt geregeld doordat de karakteristieke functie het ruimtelijk
  spectrum is van de landingsdichtheidsverdeling van de landingspunten die door het
  proces geproduceerd worden. Het ruimtelijk spectrum en de landingsdichtheidsverdeling
  zijn door een soort Heisenbergs onzekerheidsprincipe gekoppeld. Enerzijds gedraagt
  het elementaire deeltje zich als een rondhuppelend deeltje en anderzijds zorgt het
  spectrum ervoor dat de zwerm van landingspunten zich als een interferentiepatroon
  kan gedragen. Dit verklaart het gelijktijdige golf en deeltjesgedrag van de elementaire
  deeltjes. Het spectrum bepaalt welke golven het interferentiepatroon kan imiteren.
  Het feit dat we op de goede weg zijn blijkt uit het feit dat de locatie dichtheidsverdeling
  van de gegenereerde zwerm gelijk is aan het kwadraat van de modulus van de golffunctie
  van het deeltje.\\n\\nLadingen\\n\\nHet fundament leidt ook al snel tot een verklaring
  van het bestaan van elektrische ladingen. De Hilbertruimte gebruikt getallen als
  superpositieco\u00ebffici\u00ebnten van Hilbert vectoren. Op die wijze wordt de
  effectieve hoek tussen de vectoren met getallen vastgelegd en kan de lengte van
  de vectoren bepaald worden. Via diezelfde procedure kan een afbeeldingsoperator
  regelen hoe getalwaarden\\n\\naan een vector gehangen kunnen worden. De getalwaarde
  wordt de eigenwaarde en de vector wordt de bijbehorende eigenvector. Samen vormen
  de eigenwaarden de eigenruimte van de operator.  Op deze wijze worden de opslagwaarden
  vastgelegd. Het blijkt nu dat voor deze procedure de Hilbertruimte slechts tussen
  een klein aantal getalsystemen kan kiezen. Het zijn getal systemen waarin elk getal
  dat niet gelijk aan nul is een unieke inverse heeft. Slechts drie getalsystemen
  voldoen aan deze voorwaarde. Het zijn de re\u00eble getallen, de complexe getallen
  en de quaternionen. Deze laatsten zijn echt interessant. Zij bestaan uit een re\u00ebel
  getal en een drie dimensionale vector en zijn daarmee ideaal geschikt om er een
  tijdstempel en een driedimensionale locatie mee vast te leggen. Het quaternionische
  getalsysteem bestaat in veel versies die onderling verschillen in de co\u00f6rdinatensystemen
  die de elementen ordenen. Elke quaternionische Hilbertruimte kiest zijn eigen versie
  van het getalsysteem. Er bestaat een afbeeldingsoperator die deze versie onderhoudt.
  De opslagruimte van deze referentie operator vormt de priv\u00e9 parameterruimte
  van het elementaire deeltje.  De gekozen versie bepaalt de symmetrie van de Hilbertruimte
  en van het erin opgeslagen elementaire deeltje.\\n\\nEr bestaat een achtergrond
  Hilbertruimte die een achtergrond parameterruimte onderhoudt. Met hun priv\u00e9
  parameterruimte zweven de elementaire deeltjes over de achtergrond parameterruimte.\\n\\nDe
  achtergrond Hilbertruimte is net zoals de priv\u00e9 Hilbertruimte van een elementair
  deeltje separabel. Het betekent dat alle deelruimten een aftelbare dimensie hebben
  en ook de eigenruimten van de afbeeldingsoperatoren aftelbaar zijn. We gebruiken
  nu de afbeeldingsoperator die de parameterruimte beheert om er een serie nieuwe
  afbeeldingsoperatoren mee te defini\u00ebren. Elk van deze nieuwe afbeeldingsoperatoren
  gebruikt de eigenvectoren van de referentieoperator. Daarnaast gebruikt de nieuwe
  operator een quaternionische functie. De eigenwaarden van de referentieoperator
  worden gebruikt als parameter van de quaternionische functie. De doelwaarde van
  de functie gaat nu als nieuwe eigenwaarde van de nieuw gedefinieerde operator fungeren.
  De eigenvector die bij de parameter hoort wordt opnieuw als eigenvector gebruikt,
  maar nu voor de nieuwe operator.\\n\\nAlle eigenwaarden van de operatoren in de
  separabele Hilbertruimte zijn rationele quaternionen. Bij elke oneindigdimensionale
  separabele Hilbertruimte laat zich nu op de geschetste wijze een unieke metgezel
  niet-separabele Hilbertruimte defini\u00ebren waarin de gedefinieerde operatoren
  alle elementen van de priv\u00e9 parameterruimte gebruiken. In deze Hilbertruimte
  bestaan gedefinieerde operatoren die een continu\u00fcm als eigenruimte onderhouden.
  Dat continu\u00fcm wordt door een quaternionische functie beschreven en definieert
  het equivalent van een fysisch veld.\\n\\nModelleringsplatform\\n\\nOp deze wijze
  hebben we uit het fundament een krachtig modelleringsplatform afgeleid waarin elementaire
  deeltjes in een quaternionische separabele Hilbertruimte rondzweven ten opzichte
  van een achtergrond platform dat uit een oneindigdimensionale separabele Hilbertruimte
  en zijn nietseparabele metgezel-Hilbertruimte bestaat.\\n\\nGravitatie\\n\\nBehalve
  de rondzwevende elementaire deeltjes bevat dit model de stochastische voetafdrukken
  van deze deeltjes. Middels het breken van de symmetrie, veroorzaken de afzonderlijke
  landingspunten puls-reacties in het onderliggende veld. Dit veld wordt gevormd door
  de eigenruimte van een gespecialiseerde operator die in de niet-separabele Hilbertruimte
  thuishoort. Het veld vertegenwoordigt het universum waarin wij leven.\\n\\nDe puls-reacties
  vormen bolvormige schokfronten. Over tijd ge\u00efntegreerd, vormen deze schokfronten
  de Greense functie van het veld. Het stochastische proces zorgt ervoor dat de puls-reacties
  elkaar in tijd en in ruimte overlappen. Het gevolg is dat een flinke en tamelijk
  bestendige vervorming van het onderlinge veld optreedt. De Greense functie bevat
  wat volume en de puls injecteert dit volume in het onderliggende veld, waar het
  zich vervolgens over het hele veld uitspreidt. Het bolvormige schokfront beschrijft
  deze verspreiding. Het gevolg is dat de lokale vervorming snel wegebt. Het ingebrachte
  volume blijft echter in het veld en zorgt ervoor dat het veld expandeert. Dit verhaal
  vormt de verklaring van de oorsprong van wat gravitatie genoemd wordt. Het verschijnsel
  verklaart eveneens de expansie van het veld. Omdat het stochastisch proces steeds
  nieuwe landingspunten moet genereren, neemt de expansie steeds toe terwijl de vervorming
  nagenoeg constant blijft. De vervorming reist met het deeltje mee.\\n\\nConclusie\\n\\nHet
  voorgaande schetst een beeld van wat met een frisse onorthodoxe benadering van de
  natuurkunde bereikt kan worden. We zijn al twee belangrijke veldsoorten tegengekomen.
  De elektrische velden worden door ladingen veroorzaakt die zich in het geometrische
  midden van het platform van een elementair deeltje bevinden. Het andere veld is
  altijd en alom tegenwoordig en vertegenwoordigt het universum waarin wij leven en
  dat door de aanwezigheid van elk elementair deeltje voortdurend vervormd en ge\u00ebxpandeerd
  wordt.\\n\\nOok ontmoeten we de schepper die een modulair ontwerper en constructeur
  blijkt te zijn en zijn schepselen onmiddellijk na zijn scheppingsactie in de steek
  blijkt te laten. Hij overziet en voorziet wel het hele levensverhaal van al zijn
  schepselen. Merkwaardig genoeg gebruikt hij stochastische processen om alle dynamiek
  vorm te geven.\\n\\nDit verhaal verschilt behoorlijk van de verhalen die we tot
  nu over de schepping te horen kregen. Uit verder graven blijkt dit alleen maar verder
  te gaan. Dit levert een interessante ontdekkingstocht.\\n\\nOm dit alles goed te
  begrijpen is een gedegen kennis van de wiskunde noodzakelijk. Wie over voldoende
  wiskundige kennis beschikt kan een heel eind komen. Dan blijkt steeds meer dat de
  natuurkunde die we vanuit de schoolbanken meegekregen hebben niet helemaal met de
  werkelijkheid klopt. Het klopt echter wel een heel eind. Vooral de toegepaste natuurkunde
  blijkt heel bruikbaar te zijn. De theoretische natuurkunde blijkt veel minder betrouwbaar
  te zijn. De natuurkundigen blijken uitstekend in staat om met deze tekortkomingen
  te leven. De witte vlekken zijn niet essentieel voor het betrouwbare gebruik van
  de natuurkunde.\\n\\nBereikte resultaten\\n\\nDe fysieke realiteit gebruikt een
  geheugen waarin in het begin alle dynamisch geometrische gegevens van discrete objecten
  al opgeslagen zijn. De opgeslagen gegevens veranderen niet meer.\\n\\nHet model
  gedraagt zich als een schepper.\\n\\nNa de scheppingsdaad laat de schepper zijn
  schepsels met rust.\\n\\nWaarnemers hebben alleen toegang tot historische gegevens.\\n\\nDe
  fysieke realiteit gebruikt quaternionen als zijn voorkeursgetal systeem.\\n\\nVelden
  kunnen worden beschreven door quaternionische functies.\\n\\nHet gedrag van velden
  wordt bepaald door quaternionische differentiaal en integraalvergelijkingen.\\n\\nDe
  opslagmedia zijn quaternionische Hilbertruimten.\\n\\nEr bestaat een veld dat het
  universum vertegenwoordigt.\\n\\nWaarnemers krijgen hun informatie via het veld
  dat het universum vertegenwoordigt.\\n\\nKleine excitaties van dit veld vormen tezamen
  alle afzonderlijke objecten die in het universum voorkomen.\\n\\nAfzonderlijk zijn
  deze excitaties niet waarneembaar.\\n\\nDe bolvormige excitaties worden door stochastische
  processen veroorzaakt.\\n\\nElementaire deeltjes beschikken over een opslag van
  hun eigen levensgeschiedenis.\\n\\nDeze opslag vertoont een symmetrie die de symmetrie
  gerelateerde eigenschappen van het deeltje bepalen. Hierdoor bezitten elementaire
  deeltjes een elektrische lading.\\n\\nDe symmetrie gerelateerde ladingen veroorzaken
  symmetrie gerelateerde velden.\\n\\nElementaire deeltjes zijn elementaire modules.
  Tezamen vormen zij alle andere modules en de modulaire systemen.\\n\\nStochastische
  processen regelen de samenhang en de bindingen in het model.\\n\\nEr bestaan twee
  typen van deze stochastische processen. Het tweede type verzorgt de bindingen.\\n\\nAlle
  massieve objecten worden voortdurend opnieuw gegenereerd.\\n\\nAlle velden worden
  in een passend achtergrondopslagmedium bijgehouden.\\n\\nDe inhoud van de opslagmedia
  van de elementaire deeltjes wordt in het achtergrondopslagmedium ingebed. Stochastische
  processen beschrijven deze inbedding.\\n\\nHet HBM beschrijft de structuur van elementaire
  deeltjes, van atomen en van moleculen.\\n\\nHet HBM beschrijft de structuur van
  fotonen.\\n\\nHet HBM geeft een unieke beschrijving van het beginstadium van het
  universum.\\n\\nHet HBM verklaart color confinement.\\n\\nHet HBM geeft een eigen
  standpunt over verstrengeling.\\n\\nHet HBM geeft suggesties voor donkere materie
  en donkere energie.\\n\\nHet HBM geeft gedragsadviezen voor intelligente wezens
  op basis van de modulaire structuur van de schepping.\\n\\nIn de visie van de schepper
  verdwijnen elementaire deeltjes nooit. In plaats daarvan kunnen elementaire deeltjes
  in de tijd zigzaggen. Waarnemers zien op de reflectiemomenten paarproductie of paarvernietigingsgebeurtenissen.\\n\\nReferentie\\n\\nhttps://www.opastonline.com/wp-content/uploads/2018/11/tracing-the-structure-of-physicalreality-by-starting-from-its-fundamentals-atcp-18.pdf\"",
  "\"STICHTING   CONCERTOVALIANTE   BAROK\\n\\nVerslag van de vergadering op vrijdag
  19 januari 2021\\n\\nAanwezig: Leonardo Valiante (voorzitter), Nelly Straatjes (secretaris/notulist)
  en Rob Straatjes (penningmeester)\\n\\nAfwezig:  James Hewitt (met kennisgeving)\\n\\n1
  De vergadering wordt geopend om 13:30 uur ten huize van Rob en Nelly Straatjes en
  zij heten allen hartelijk welkom.\\n2 Vaststelling van de agenda.\\n\\nDe agenda
  wordt opgemaakt aan het begin van de vergadering omdat dit niet vooraf is gebeurd.\\n\\n3.
  Vaststelling en goedkeuring van het verslag van 23 april 2020 (ter plaatse uitgereikt)
  3A.\\n4. Vaststelling van het financieel verslag 2020\\n5. Data planning 2021\\n6.
  Data planning 2022\\n7. Aanvraag fondsen\\n8. Rondvraag en sluiting\\n3 De datum
  voor het volgend overleg wordt voorlopig vastgesteld op donderdag 20 mei 2021 om
  10uur. Na bevestiging door James wordt de datum definitief.\\n4 Financieel: Rob
  overhandigd de financi\u00eble situatie in het jaarverslag en licht het toe. De
  vergadering is zeer tevreden over de opstelling van het rapport. Men is blij met
  het positieve saldo. Dit is mede ontstaan door de projecten met Coen Honig en Peter
  Janka. We zien uit naar de resultaten van de komende concerten.\\n\\nInvulling concerten:\\n\\nDe
  planning voor de komende concerten heeft nog steeds een onzekere toekomst door het
  coronavirus. De geplande concerten voor het komende jaar wordt per keer bekeken.\\n\\n5.
  Data planning 2021\\n\\nconcerten in het vooruitzicht.\\n\\n6. Data planning 2022\\n\\nMet
  Dody Soetanto wordt contact gelegd over concert Nelsonmis en Le Figaro met het Leids
  Kamerkoor voor 5/6 of 14/15  maart 2022. Koor \u2013 solisten \u2013 ensemble. Vergelijkbaar
  met Weihnachtsoratorium 2019. Plaats Bergkerk en Leiden.\\n\\nOok zal met Dody Soetanto
  contact worden gelegd over het concert Semele met 5 solisten, 8 musici en een koor
