  gebeurtenis uit de geschiedenis van het universum\\n\\ngeven om samen met jouw groep
  te onderzoeken:\\n\\nHoe lang na het ontstaan van het universum vond jouw gebeurtenis
  plaats?\\n\\nLees het voorbeeld hieronder voordat je deze vraag beantwoord.\\n\\nHet
  ontstaan van het melkwegstelsel: 12 biljoen jaar geleden\\n\\nStap 1\\n\\nHoeveel
