  van de fabrikant. Wij regelen het graag voor je en je kunt bij ons altijd terecht
  voor vragen en opmerkingen over het reparatietraject. Je hebt altijd 3 maanden garantie
  op de reparatie.\\n\\nIk wil een product terugsturen, hoe doe ik dat?\\n\\nBen je
  toch niet tevreden met je aankoop? Binnen 14 dagen na aankoop kun je je product
  aan ons retour sturen. Je kunt er voor kiezen te herroepen middels een schriftelijke
  uitdrukkelijke mededeling. Na deze herroeping heb je vervolgens nog 14 dagen om
  het product terug te sturen. Om je pakket terug te sturen kun je deze eenvoudig
  aanmelden via het contactformulier\\n\\nEr zijn enkele producten uitgezonderd van
  het herroepingsrecht:\\n\\n- Software waarvan de verzegeling verbroken is;\"", "\"say
  Welzijnswerkers als koopwaar Goeie straathoekwerkers! Weg ermee!\\n\\nSinds eind
  jaren negentig zetten gemeenten om de zoveel jaar het werk in onder meer de daklozenopvang,
  het straathoekwerk, club- en buurthuiswerk en wijkteams in de etalage. Wat heeft
  deze vorm van aanbesteden, behalve een hoop ellende, opgeleverd?\\n\\nJos van der
  Lans beeld Femke van Heerikhuizen\\n\\n7 december 2020 \u2013 verschenen in nr.
  50\\n\\nHet was een merkwaardig schouwspel, op de laatste dag van juni in buurthuis
  Vogelvlucht aan de Rijnsburgersingel in het zuidwesten van Leiden. Het buurthuis,
  een jaar daarvoor door gebruikers nog gekozen tot beste wijkvoorziening van het
  land, was het decor van twee ploegen in- en uitlopende verhuizers. De ene ploeg
  tilde de meubels en computers naar buiten, ontkoppelde het netwerk, sleepte de vaatwasmachine
  uit het buurthuis en pakte alles in wat los zat. De andere ploeg deed precies het
  omgekeerde, ze installeerde nieuwe computers en richtte de keuken weer in.\\n\\nDit
  merkwaardige tafereel was te wijten aan het feit dat Libertas, sinds jaar en dag
  beheerder van club- en buurthuizen in de sleutelstad, een jaar eerder als verliezer
  uit de bus was gekomen bij een aanbesteding van het Leidse welzijnswerk. De gemeentelijke
  beslissers waren er gemakshalve van uitgegaan dat de inboedel van de club- en buurthuizen
  wel voor een zacht prijsje door de winnaar overgenomen zou worden. Niet dus. Na
  stekelige onderhandelingen was er tussen de oudgediende en de nieuwkomer in de verste
  verte geen overeenstemming bereikt over de overname van inboedel en installaties.
  Met de komst van twee verhuisploegen als gevolg.\\n\\nEen jaar eerder had het Leidse
  gemeentebestuur aangekondigd het welzijnswerk te reorganiseren. De wethouder vond
  het aanbod te versnipperd en wilde nieuw elan. Achttien in Leiden werkzame organisaties
  reageerden daarop met een manifest waarin zij het stadsbestuur opriepen hun een
  jaar de tijd te gunnen om zelf een plan te maken en met samenwerkingsvoorstellen
  te komen. Zij vreesden dat bij een aanbesteding partijen van buiten met mooie gelikte
  verhalen binnen zouden komen. De wethouder wuifde die angst weg: ''Bekende partijen
  staan met 10-0 voor op organisaties van buitenaf.''\\n\\nOntvang dagelijks onze
  nieuwsbrief\\n\\nOnafhankelijk en onbevreesd. Sinds 1877.\\n\\nE-mailadres\\n\\nIn
  februari 2020 werd de procedure afgerond en gebeurde precies wat de Leidse welzijnsorganisaties
  hadden voorspeld. De aanbesteding werd gewonnen door twee organisaties buiten Leiden:
  het Rotterdamse SOL en het landelijk opererende Incluzio. Een bescheiden deel werd
  gegund aan de nieuwe organisatie Buzz, waarin zich een aantal Leidse aanbieders
  had verenigd.\\n\\n\u2014\u2014\u2014\u2014\u2014\\n\\nHet is een van de voorbeelden
  van het ontwrichtende spoor dat het aanbesteden achterlaat in wat in beleidskringen
  tegenwoordig het sociaal domein wordt genoemd en wat ooit als (gesubsidieerd) welzijnswerk
  door het leven ging. Sociale professionals worden daarin als koopwaar in de gemeentelijke
  etalage gezet, soms mogen ze dan nog vier of vijf jaar blijven, vaak krijgen ze
  een nieuwe werkgever en regelmatig moeten ze naar ander werk omzien. Het spoor gaat
  terug tot de jaren negentig van de vorige eeuw toen de nieuwe zakelijkheid de publieke
  sector, ministeries en lokale overheden in haar greep nam. Dat leidde als vanzelf
  tot het gebruik van steeds meer bedrijfsmatige begrippen: outputfinanciering, inkooprelaties,
  producten. Er moest waar voor het geld geleverd worden en organisaties moesten daarop
  met elkaar kunnen concurreren. Het bestuurlijke instrument daarvoor werd het om
  de zoveel jaar aanbesteden.\\n\\nNiet toevallig was het welzijnswerk een van de
  eerste publieke sectoren waarin gemeenten met aanbesteden proefdraaiden. Het welzijnswerk
  had een reputatie van onduidelijke resultaten en kon wel een nieuwe impuls gebruiken.
  In 1997 had het Amsterdamse stadsdeel Oud-West daarvan de primeur. Het schreef de
  eerste nieuwerwetse aanbesteding van breed welzijnswerk in Nederland uit met een
  voor 020 verrassende winnaar: de Rotterdamse welzijnsorganisatie DOCK.\\n\\nInmiddels
  zijn we een kwart eeuw verder en is in het publieke domein aanbesteden schering
  en inslag geworden. Er is een aanbestedingswet, een website tendernet.nl, een heus
  expertisecentrum PIANOo, gesubsidieerd door het ministerie van Economische Zaken
  en met een specialist ''aanbesteden sociaal domein'', en er zijn \u2013 het kon
  niet uitblijven \u2013 vele tientallen bureaus die organisaties kunnen helpen om
  zo goed mogelijk door de procedure te komen. Zo vergroeide een instrument uit de
  materi\u00eble economie met de wereld van het immateri\u00eble welzijn.\\n\\nIn
  die verandering spelen juristen een belangrijke rol. Zij waken over de aanbestedingsregels,
  waarvan er vele in Brussel hun geboortegrond kennen. Ze zijn niet van de inhoud,
  al helemaal niet van het verleden en tradities, nee, ze waken over de juiste procedure.
  Het juridische ''het mag niet'' overrulet elke inhoudelijke overweging. Daardoor
  komt het dat aanbieders die jarenlang naar volle tevredenheid hun werk doen in een
  aanbestedingsprocedure ineens de competitie moeten aangaan met onbekende concurrenten.
  Dat brengt in nogal wat professionele organisaties niet alleen een om de zoveel
  jaar terugkerende periode van onzekerheid met zich mee, het levert, zo weten we
  inmiddels, nogal eens onverwachte uitkomsten op.\\n\\nWant het Leidse voorbeeld
  staat niet op zich. Deze zomer gunde de gemeente Utrecht de basiszorg voor dak-
  en thuislozen zeer verrassend aan \u2013 alweer! \u2013 Incluzio. Sinds decennia
  werd deze zorg in de Domstad uitgevoerd door BackUp die zwerfjongeren en dakloze
  jongvolwassenen begeleidt om hun leven weer op de rit te krijgen, en Stadsteam Herstel
  dat vergelijkbare begeleiding en opvang realiseert voor volwassen daklozen. Beide
  teams hebben dat naar volle tevredenheid gedaan, zoals de gemeente ook ruiterlijk
  erkent. Jaarlijks gaan professionals met zo''n 750 daklozen aan de slag om hun levens
  weer op de rails te krijgen. Dat is bepaald geen eenvoudig werk, het vereist kennis
  van de leefwereld van lastige mensen. Je moet er stevig voor in de schoenen staan.
  En dat er zo nu en dan een ruit sneuvelt, moet je vooral geen slapeloze nachten
  bezorgen.\\n\\nIn 2018 bedacht de gemeente dat het wenselijk zou zijn dat deze twee
  teams zouden worden samengevoegd. Daar viel zeker het nodige voor te zeggen, vonden
  ook de professionals van BackUp en Stadsteam Herstel. Maar daardoor ontstond er
  wel iets nieuws en voelde de gemeente zich verplicht om een nieuwe ''uitvraag''
  uit te schrijven. Niet getreurd, de twee bestaande teams staken de koppen bij elkaar
  en maakten een ambitieus plan, waarin ze vasthielden aan wat goed ging en wilden
  vernieuwen waar dat nodig was. Een gelopen race, zo leek het, want nagenoeg iedereen
  wilde dat deze jarenlang opgebouwde expertise voor de regio Utrecht behouden bleef.\\n\\nHet
  liep anders. De gemeente zette een onafhankelijke commissie met experts van buiten,
  een van de straat geplukte ervaringsdeskundige en een cli\u00ebntenvertegenwoordiger
  aan het werk om tot een objectief oordeel te komen. De commissieleden ontleedden
  de ingediende plannen op basis van criteria waar zij vervolgens punten aan toekenden.
  Daarbij troffen de professionals van BackUp en Stadsteam Herstel in Incluzio een
  ijzersterke, geslepen mededinger, die als geen ander bedreven is in de newspeak
  van het hedendaagse sociaal werk. Grootse vergezichten over ''normaliseren en herstel''
  en ''zorg dichtbij met als uitgangspunt de leefwereld van daklozen'' wisten de specialisten
  van Incluzio zo pakkend op te schrijven dat je bijna zou vergeten dat het bedrijf
  nul komma nul expertise heeft met dit lastige werk.\\n\\nUiteindelijk delfde zo
  bijna veertig jaar ervaring met Utrechts straathoekwerk het onderspit tegen de blufpokercharme
  van een nieuwkomer. Het verschil was een soort fotofinish \u2013 de optelsom liet
  uiteindelijk een marge van 0,2 punt zien.\\n\\n''Bekende partijen staan met 10-0
  voor op organisaties van buitenaf'', zei de wethouder\\n\\nDe gevolgen zijn er niet
  minder om. Utrechtse daklozen begrijpen niet waarom hun vertrouwde organisaties
  ineens niet goed genoeg blijken. Er heerst verbijstering over het feit dat de gemeente
  het winnend bod van Incluzio niet aan de openbaarheid wil prijsgeven. De professionals
  zelf hebben grote moeite om over te gaan naar een nieuwe organisatie met leidinggevenden
  die over dit specifieke werk van toeten noch blazen weten. Er heerst complete onduidelijkheid
  over de vraag of er nu sprake is van ''overname van onderneming''. Er volgt eindeloos
  gesteggel over arbeids- en huurcontracten. Dat levert een vloed van frictiekosten
  op die ten koste gaan van andere vormen van zorg in Utrecht. Onrust die nu al weer
  bijna een half jaar het opvangwerk van daklozen in zijn greep heeft.\\n\\nMaar in
  de Utrechtse beauty contest speelden al deze financi\u00eble en professionele gevolgen
  geen rol van betekenis, een fenomeen dat zich ook na verrassende aanbestedingsuitkomsten
  in andere gemeenten voordoet. Met het voorkomen van langdurige onrust en onnodige
  kosten zijn geen punten te verdienen. Helemaal zuur wordt het als BackUp in oktober
  door verantwoordelijk wethouder Maarten van Ooijen in de bloemetjes wordt gezet
  als een van de drie Utrechtse instellingen die het best toegankelijk zijn voor de
  doelgroep. Geslaagd voor het verleden, gezakt voor de toekomst \u2013 leg dat maar
  eens uit.\\n\\n\u2014\u2014\u2014\u2014\u2014\\n\\nHet gaat hier niet om makkelijk
  inwisselbare vormen van professionaliteit, nee, het gaat bij dit soort aanbestedingen
  om gevoelige zaken als leefbaarheid, preventie, opvoedingsondersteuning, schuldhulpverlening,
  activering, achterstandsbestrijding, jongerenoverlast, allemaal kwesties die de
  laatste jaren aan lokaal politiek belang hebben gewonnen en waar nogal wat bestuurlijk
  ongeduld op de loer ligt. Sinds de decentralisatie van delen van de zorg, de jeugdzorg
  en de arbeidsparticipatie staat het sociaal domein in het teken van woorden als
  ''transitie'' en ''transformatie'', wat zo''n beetje wil zeggen dat alles anders,
  goedkoper en effectiever moet.\\n\\nIncluzio heeft die behoefte heel goed begrepen.
  Sterker, het heeft er een opmerkelijke opmars in het sociaal domein aan te danken.
  Het bedrijf is een telg uit de Facilicom-familie, oorspronkelijk een schoonmaakfamiliebedrijf
  dat enorm is ge\u00ebxpandeerd in de facilitaire dienstverlening (schoonmaak, beveiliging,
  onderhoud, personeelsdienstverlening, bouw, catering, huishoudelijke hulp). In 2012
  was de omzet ruim \u00e9\u00e9n miljard euro en telde de onderneming 32.000 werknemers.
  Je kunt rustig zeggen: een gigant met een kapitaalkracht die in het land van zorg
  en welzijn niet eerder vertoond is.\\n\\nIn 2012 \u2013 met een enorme leegstand
  op de kantorenmarkt en een stevige dip in het schoonmaakwerk \u2013 besloot Facilicom
  te gaan investeren in de sector zorg en welzijn. Niet schrikken, liet president-directeur
  Hans Gennissen weten, zinspelend op de aversie in welzijnsland tegen op winst gerichte
  ondernemingen: ''De rendementseis die Facilicom intern hanteert (3-4%) past goed
  bij de zorg- en welzijnssector. Wij gaan onze competenties in de bedrijfsvoering
  inbrengen zonder de autonomie van de professionals in het veld aan te tasten.\\n\\nOns
  model is gericht op het boeken van duurzaam maatschappelijk resultaat in gezamenlijkheid
  met gemeenten en bestaande dienstverleners.''\\n\\nToen in 2015 de decentralisatie
  van het sociaal domein een feit was en gemeenten overal nieuwe contractrelaties
  moesten aangaan, greep de Facilicom-dochter haar kans. Zelfverzekerd presenteerde
  zij zich in een dynamische combinatie van ondernemerschap en het inspelen op de
  behoefte aan integrale buurtgerichte aanpak. Incluzio-directeur Peter de Visser:
  ''Incluzio heeft de ambitie om preventie, zorg, ondersteuning en dienstverlening
  te integreren in \u00e9\u00e9n lokale organisatie. Door de integrale benadering
  worden niet alleen individuele (zorg)vragen opgelost, maar kunnen meteen andere
  collectieve problemen in de wijk worden aangepakt en voorkomen. Door zorg, dienstverlening
  en het sociale domein te integreren willen we de stap zetten van de huidige, productiegerichte
  werkwijze naar resultaatgericht werken. In dat systeem worden partijen, anders dan
  nu, juist beloond voor preventie en effectief werken en staat het behaalde maatschappelijke
  rendement voorop.''\\n\\nDat was koren op de molen van veel ambitieuze lokale bestuurders
  die met de decentralisaties een forse opgave op hun bord kregen. Incluzio begon
  in Rotterdam, maar haalde in Utrecht met de Buurtteams Sociaal vanaf 2015 een grote
  buit binnen. De Utrechtse Buurtteamaanpak, waarbij de leidinggevenden van de wijkteams
  worden aangeduid als buurtondernemers, veegde zo ongeveer het hele welzijnswerk
  in de Domstad van de kaart, maar zorgde samen met een strakke aansturing door de
  gemeente Utrecht voor een werkwijze die langzaam maar zeker indruk begon te maken.
  Dat maakte andere gemeenten nieuwsgierig en Incluzio een kansrijke partij in nieuwe
  aanbestedingsrondes. Inmiddels is Incluzio neergestreken in Zaanstad, Leiderdorp,
  Leiden, Hollandse Kroon en Venlo en wint het in Noord-Holland terrein in de jeugdzorg
  door een alliantie met Horizon, de grootste jeugdzorgaanbieder van het land.\\n\\nToch
  is het juist die alliantie in Noord-Holland geweest die het dogma aanbesteden ook
  politiek aan het wankelen heeft gebracht. In deze provincie besloten achttien samenwerkende
  gemeenten in 2018 om na een aanbesteding de gesloten jeugdzorg weg te\\n\\nhalen
  bij Transferium/Parlan en te gunnen aan het Zuid-Hollandse Horizon. Door de aanbesteding
  dreigden zo''n zeventig kinderen die in de gesloten instelling in Heerhugowaard
  verbleven uit hun omgeving gehaald te worden. Velen van hen waren vaak jarenlang
  blootgesteld aan trauma''s, zoals mishandeling, verslaving, loverboyproblematiek
  en seksueel misbruik. De woede die daarover bij ouders en begeleiders ontstak was
  groot.\\n\\nVrank Post, directeur van Transferium, reageerde furieus: ''Het kan
  niet zo zijn dat een papieren aanbesteding de in tien jaar opgebouwde kennis en
  expertise in \u00e9\u00e9n klap vernietigt. De rust, het veiligheidsgevoel en het
  vertrouwen dat jongeren in de gesloten jeugdzorg zo hard nodig hebben, wordt hiermee
  weggehaald. Daarnaast dreigt sluiting van onze locatie Transferium, de enige gesloten
  jeugdzorginstelling in Noord-Holland. Het kost een ander van buiten de regio jaren
  voordat deze een hecht en goed functionerende samenwerking rond de jongeren in de
  gesloten jeugdzorg heeft opgebouwd. Die tijd hebben de jongeren niet. De consequenties
  zijn enorm en onomkeerbaar.''\\n\\nTransferium/Parlan probeerde verhaal te halen
  bij de rechtbank, maar dat mocht niet baten \u2013 op de procedure was niks aan
  te merken. Vrijwel alle aangevochten aanbestedingsuitkomsten die voor de rechter
  werden gebracht (en dat zijn er nogal wat) trof dit lot. Rechters willen hun vingers
  niet branden aan inhoudelijke afwegingen en oordelen alleen of de procedure zorgvuldig
  is geweest. En daar zorgen de juristen wel voor.\\n\\nAlles moet anders, goedkoper
  en effectiever. Incluzio heeft die behoefte heel goed begrepen\\n\\nDoor de afwijzing
  kwam Parlan in de financi\u00eble problemen, maar dat mocht allemaal geen rol spelen.
  Zo schrijft B en W van de gemeente Koggenland op 6 november 2019 aan de gemeenteraad:
  ''Bij een aanbesteding dienen wij ons te houden aan de stringente regelgeving. De
  partij die het best voldoet aan het programma van eisen wint de aanbesteding. Pas
  nadat bleek dat Parlan de aanbesteding niet had gewonnen kwam nadere informatie
  (over de financi\u00eble gevolgen voor Parlan \u2013 jvdl) naar buiten. Op grond
  van de aanbestedingsregels zou het overigens niet mogelijk zijn geweest daar vooraf
  rekening mee te houden.'' Zo geformuleerd lijkt het aanbestedingsrecht zelfs een
  argument te leveren om publiek kapitaal te vernietigen.\\n\\nIn het onlangs verschenen
  boek Kinderen van de staat: Jeugdzorg in ademnood ontrafelt onderzoeksjournalist
  H\u00e9l\u00e8ne van Beek welke bijzondere machinaties er in dit proces achter de
  schermen hebben plaatsgevonden. Dat is tamelijk onthullend. Zij moest een beroep
  doen op de Wet openbaarheid van bestuur, kreeg met veel moeite met een zwarte stift
  bewerkte stukken, werd op het matje geroepen, zo niet bedreigd, door bestuurders
  en toezichthouders van Horizon en stuitte op bestuurlijke connecties tussen wethouders,
  Incluzio en Horizon die toch op z''n minst de uitkomst in een wel heel bijzonder
  daglicht stellen. Haar conclusie: marktwerking haalt het slechtste gedrag boven
  bij verantwoordelijke beslissers, terwijl de kinderen die van de jeugdzorg afhankelijk
  zijn naar adem happen en professionals hun werk niet goed kunnen doen.\\n\\n\u2014\u2014\u2014\u2014\u2014\\n\\nMaar
  van dat alles had de Tweede Kamer in de herfst van 2018 nog geen weet toen zij zich
  tijdens de begrotingsbehandelingen van het ministerie van Volksgezondheid, Welzijn
  en Sport over deze kwestie boog. Waar zijn we in godsnaam mee bezig? vroegen vrijwel
  alle Kamerleden zich af. Aanbestedingswaanzin noemde het PVDA-Tweede-Kamerlid Attje\\n\\nKuiken
  het. Ze was furieus: ''De minister wil het niet, wij willen het niet, zo ongeveer
  alle lokale raadsleden zijn daarmee ongelukkig, de ouders willen het niet, de kinderen
  willen het niet en de jeugdmedewerkers willen het niet. Ik vergeet vast nog een
  aantal mensen, maar bijna niemand wil het. Ergens heeft iemand bedacht: het is verstandig
  om het in een concurrentiemodel te douwen.''\\n\\nDie iemand was, zo wees minister
  Hugo de Jonge er in zijn repliek fijntjes op, overigens de Kamer zelf: ''Ik vind
  het hard om het zo te zeggen, maar met uitzondering van de fractie van mevrouw Agema
  (woordvoerder namens de PVV \u2013 jvdl) hebben alle Kamerfracties \u2013 alle Kamerfracties!
  \u2013 destijds voor de implementatie van de Europese richtlijn gestemd die leidde
  tot een aanbestedingsplicht, ook in het sociale domein.'' Kortom, nagenoeg iedereen
  is ervoor verantwoordelijk dat, aldus De Jonge, ''onder de streep het aanbestedingsrecht
  as such zich moeilijk laat matchen met dingen die je juist vanuit de zorg belangrijk
  moet vinden. Denk daarbij aan de continu\u00efteit van ondersteuning en partnerschap
  in het doorontwikkelen van nieuw aanbod.''\\n\\nDe minister hield de Kamer voor
  dat hij er wat aan ging doen. Hij beloofde in Brussel te gaan pleiten om jeugdzorg
  niet langer als een markt en al zeker niet als een Europese markt te zien, en beloofde
  alles in het werk te stellen om meer ruimte voor het sociaal domein te cre\u00ebren
  voor wat betreft de aanbestedingsregels.\\n\\n\u2014\u2014\u2014\u2014\u2014\\n\\nHeel
  succesvol is De Jonge''s gang naar Brussel nog niet geweest. De Europese Commissie
  heeft al bij zijn eerste bezoek laten weten vooralsnog niet aan de aanbestedingsregels
  te willen tornen. Maar sinds De Jonge''s openlijke bekomst van de marktwerking in
  de zorg lijkt het tij toch te keren, hoewel ze daar dus in Utrecht en Leiden nog
  maar weinig van hebben gemerkt.\\n\\nIn steeds meer gemeentehuizen, en al zeker
  onder gemeenteraadsleden die in het aanbestedingscircus vrijwel altijd vanaf de
  kant moeten toekijken, groeit de behoefte om op een meer duurzame wijze het sociaal
  domein aan te sturen. Want wat het aanbesteden heeft bewerkstelligd is wat de Utrechtse
  hoogleraar sociaal werk Hans van Ewijk tien jaar geleden al typeerde als ''georganiseerde
  discontinu\u00efteit''. Bij elke wisseling van de professionele wacht gaat er kennis
  verloren. Kennis die vaak persoonlijk is, in de vorm van telefoonnummers, van ontmoetingsplekken,
  van vertrouwde gezichten. Dat is kleine, maar cruciale kennis, waar in de aanbestedingsprocedures
  doorgaans geen rubriek voor bestaat, maar die dus uiterst relevant is en die dus
  opnieuw moet worden opgebouwd. Daar gaat geruime tijd overheen.\\n\\nHet gevolg
  is wel dat op de werkvloer van de samenleving, in buurten en wijken, in club- en
  buurthuizen, in de locaties waar sociale wijkteams hun werk moeten doen en in grote
  delen van de jeugdzorg een cultuur is gegroeid waarin het steeds lastiger is om
  op eigen kracht een herkenbare vorm van professioneel vakmanschap te ontwikkelen.
  Professionals worden heen en weer geslingerd tussen de wensen van het stadhuis,
  de productie-targets van hun moederorganisatie, de verantwoordingsverplichtingen
  van de gemeente, de tijdelijkheid van hun banen en de noden van burgers. Ze zijn
  nauwelijks ge\u00ebquipeerd om daar een vaste koers in te ontwikkelen, om zich duurzaam
  te settelen in hun werkgebied.\\n\\nDat is ook te merken. Als het over gezondheid
  gaat, dan erkennen we het gezag van artsen, de coronacrisis heeft dat nog eens nadrukkelijk
  laten zien. Als het over het geestelijk welbevinden gaat, dan is er altijd wel een
  psychiater die bereid gevonden is om er zijn licht over te laten schijnen. Maar
  als het over probleembuurten gaat, over samenlevingsperikelen, dan wordt het hoogste
  woord gevoerd door bestuurders, ambtenaren en wethouders. Sociale professionals
  zijn in het publieke debat geen partij die van zich doet spreken, althans niet in
  beleidsmatige en opini\u00ebrende vorm. Ze krijgen niet de kans zich die status
  te verwerven.\\n\\nEen kwart eeuw aanbesteden heeft daar zeker het nodige aan bijgedragen.
  Deze grillige vorm van aansturen heeft het vak ontdaan van de rust en de infrastructuur
  die nodig is om professionaliteit te ontwikkelen. Zo zijn we in een situatie beland
  dat we steeds hogere eisen stellen aan wat er op de werkvloeren van de samenleving,
  in problematische buurten en wijken moet worden gedaan, terwijl de omstandigheden
  om dat voor elkaar te krijgen steeds onzekerder zijn geworden.\\n\\nDaar moeten
  we dus niet mee doorgaan. De aanbestedingsregelgeving hoeft daarvoor geen blokkade
  te vormen, aldus jurist en bestuurskundige Tim Robbe. Hij ziet zichzelf, in tegenstelling
  tot nogal wat van zijn beroepsgenoten, als een ''kan wel''-jurist en merkt dat zijn
  visie op de rekkelijkheid van de regelgeving en de ruimte die daarin zit steeds
  meer gehoor vindt. In een informatiebijeenkomst van de Utrechtse gemeenteraad hield
  hij de lokale politici eind september nog voor dat de aanbestedingswet maar liefst
  52 uitzonderingen bevat. Waarom zou je die niet gebruiken? En waarom zou je subsidierelaties
  afschrijven? Er is geen wet die dat voorschrijft. Toon lef en laat je niet ringeloren
  door de ''kan niet''-juristen, er kan veel meer.\\n\\nDat is een sympathieke hartenkreet
  waarvan je mag hopen dat deze in de gemeentehuizen in het land gehoor zal vinden.
  De gemeente Utrecht heeft mede naar aanleiding van het BackUpdebacle in november
  besloten om te onderzoeken hoe het anders zou kunnen. Wat we hier aan de oppervlakte
  zien treden gaat veel verder dan het herinterpreteren of oprekken van de regelgeving.
  Want de kritiek op het aanbesteden is niet een kritiek omdat het een wat onhandig,
  tijdrovend, kosten slurpend, juridisch dichtgespijkerd instrument is, het ongenoegen
  is veel fundamenteler. De vraagtekens over de zich herhalende cycli van het aanbesteden
  staan symbool voor een groeiende onvrede over de marktwerking in het publieke domein,
  over het aanjagen van concurrentie van overheidswege tussen publiek gefinancierde
  instellingen. Of nauwkeuriger: het heeft alles te maken met de groeiende overtuiging
  dat wat het neoliberale denken in een kwart eeuw in de taal van het sturen en ordenen
  van onze samenleving heeft geleverd aan het einde van zijn Latijn is.\\n\\nTot die
  overtuiging is inmiddels dus ook CDA-minister De Jonge gekomen, hij besteedde er
  in september nog een belangrijk deel van zijn Abel Herzberglezing aan. Zelfs bij
  de VVD is, blijkens haar verkiezingsprogramma, het geloof in de marktwerking in
  de publieke sector gaan wankelen. Alleen: over wat daarvoor in de plaats treedt,
  welke taal we dan wel gaan spreken, hoe we wel met professionele organisaties en
  sociale professionals in buurten en wijken omgaan, daar wordt nog maar weinig debat
  over gevoerd. En zolang daar geen helderheid in komt, moeten we niet verbaasd opkijken
  als Incluzio de komende jaren nog menige lokale beauty contest winnend afsluit.
  Met alle verhuisploegen die daarvoor nodig zijn.\\n\\nJos van der Lans is cultuurpsycholoog
