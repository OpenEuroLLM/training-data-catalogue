  06/12\\n\\nOE-codes\"", "\"PRIVACY STATEMENT\\n\\nInleiding\\n\\nMaarschalk|Ligthart
  Accountants & Belastingadviseurs B.V. verwerkt persoonsgegevens over u doordat u
  gebruik maakt van onze diensten en / of omdat u of uw werkgever deze gegevens aan
  ons verstrekt.\\n\\nHieronder een overzicht van de persoonsgegevens die wij verwerken:\\n\\n-
  Voor- en achternaam\\n- Geslacht\\n- Geboortedatum\\n- Geboorteplaats\\n- Adresgegevens\\n-
  Telefoonnummer\\n- E-mailadres\\n- IBAN\\n- Overige persoonsgegevens die u actief
  verstrekt bijvoorbeeld door een profiel op onze website aan te maken, in correspondentie
  en telefonisch\\n- Locatiegegevens\\n- Gegevens over uw activiteiten op onze website\\n-
  IP-adres\\n- Internetbrowser en apparaat type\\n\\nBijzondere en/of gevoelige persoonsgegevens
  die wij verwerken\\n\\nMaarschalk|Ligthart Accountants & Belastingadviseurs B.V.
  verwerkt de volgende bijzondere en/of gevoelige persoonsgegevens van u:\\n\\n- Gegevens
  van personen jonger dan 16 jaar. Onze website en/of dienst heeft niet de intentie
  gegevens te verzamelen over websitebezoekers die jonger zijn dan 16 jaar. Tenzij
  ze toestemming hebben van ouders of voogd. We kunnen echter niet controleren of
  een bezoeker ouder dan 16 is. Wij raden ouders dan ook aan betrokken te zijn bij
  de online activiteiten van hun kinderen, om zo te voorkomen dat er gegevens over
  kinderen verzameld worden zonder ouderlijke toestemming. Als u er van overtuigd
  bent dat wij zonder die toestemming persoonlijke gegevens hebben verzameld over
  een minderjarige, neem dan contact met ons op via firstname.lastname@example.org,
  dan zullen wij deze informatie verwijderen.\\n- Burgerservicenummer (BSN)\\n\\nWaarom
  we gegevens nodig hebben\\n\\nMaarschalk-Ligthart Accountants & Belastingadviseurs
  B.V. verwerkt persoonsgegevens, voor de volgende doelen:\\n\\n Verzenden van onze
  nieuwsbrief;\\n U te bellen indien dit nodig is om onze dienstverlening uit te kunnen
  voeren;\\n U te informeren over wijzigingen van onze diensten en producten;\\n Om
  administratie, financi\u00eble en fiscale diensten aan u te kunnen leveren;\\n Maarschalk|Ligthart
  Accountants & Belastingadviseurs B.V. verwerkt ook persoonsgegevens als wij hier
  wettelijk toe verplicht zijn, zoals bijvoorbeeld gegevens die wij nodig hebben voor
  onze fiscale verplichtingen.\\n\\nHoe lang we gegevens bewaren\\n\\nMaarschalk|Ligthart
  Accountants & Belastingadviseurs B.V. zal uw persoonsgegevens niet langer bewaren
  dan strikt nodig is om de doelen te realiseren waarvoor uw gegevens worden verzameld.\\n\\nDelen
  met anderen\\n\\nMaarschalk|Ligthart Accountants & Belastingadviseurs B.V. deelt
  uw persoonsgegevens met derden als dit noodzakelijk is voor het uitvoeren van de
  overeenkomst en om te voldoen aan een wettelijke verplichting. Met bedrijven die
  uw gegevens verwerken in onze opdracht, sluiten wij een verwerkersovereenkomst om
  te zorgen voor eenzelfde niveau van beveiliging en vertrouwelijkheid van uw gegevens.
  Maarschalk|Ligthart Accountants & Belastingadviseurs B.V. blijft verantwoordelijk
  voor deze verwerkingen. Daarnaast verstrekt Maarschalk|Ligthart Accountants & Belastingadviseurs
  B.V. uw persoonsgegevens aan andere derden, maar alleen met uw nadrukkelijke toestemming.\\n\\nIn
  kaart brengen websitebezoek\\n\\nMaarschalk|Ligthart Accountants & Belastingadviseurs
  B.V Nederland gebruikt functionele, analytische, tracking cookies en social media
  plug-in cookies Een cookie is een klein tekstbestand dat bij het eerste bezoek aan
  een website wordt opgeslagen in de browser van uw computer, tablet of smartphone.
  Wij gebruiken cookies met een technische functionaliteit. Deze zorgen ervoor dat
  de website naar behoren werkt en dat bijvoorbeeld uw voorkeursinstellingen onthouden
  worden. Deze cookies worden ook gebruikt om de website goed te laten werken en deze
  te kunnen optimaliseren.\\n\\nDaarnaast plaatsen we cookies die uw surfgedrag bijhouden
  zodat we op maat gemaakte content en advertenties kunnen aanbieden. Bij uw eerste
  bezoek aan onze website hebben wij u al ge\u00efnformeerd over deze cookies en hebben
  we uw toestemming gevraagd voor het plaatsen ervan.\\n\\nU kunt u afmelden voor
  cookies door uw internetbrowser zo in te stellen dat deze geen cookies meer opslaat.
  Daarnaast kunt u ook alle informatie die eerder is opgeslagen via de instellingen
  van uw browser verwijderen\\n\\nGegevens inzien, aanpassen of verwijderen\\n\\nU
  hebt het recht om uw persoonsgegevens in te zien, te corrigeren of te verwijderen.
  U kunt een verzoek tot inzage, correctie of verwijdering sturen naar email@example.com.
  Om er zeker van te zijn dat het verzoek tot inzage door u is gedaan, vragen wij
  u een kopie van uw identiteitsbewijs bij het verzoek mee te sturen. Hierbij vragen
  we u om in deze kopie uw pasfoto, MRZ (machine readable zone, de strook met nummers
  onderaan het paspoort), paspoortnummer en burgerservicenummer (BSN) zwart te maken.
  Dit ter bescherming van uw privacy. Maarschalk-Ligthart Accountants & Belastingadviseurs
  B.V. zal zo snel mogelijk, maar binnen vier weken, op uw verzoek reageren.\\n\\nBeveiliging\\n\\nMaarschalk-Ligthart
  Accountants & Belastingadviseurs B.V. neemt de bescherming van uw gegevens serieus
  en neemt passende maatregelen om misbruik, verlies, onbevoegde toegang, ongewenste
  openbaarmaking en ongeoorloofde wijziging tegen te gaan. Als u het idee heeft dat
  uw gegevens toch niet goed beveiligd zijn of er aanwijzingen zijn van misbruik,
  neem dan contact met ons op via  firstname.lastname@example.org.\\n\\nDatalekken\\n\\nWat
  is een datalek? Een datalek is een inbreuk op de beveiliging die per ongeluk of
  op onrechtmatige wijze (mogelijkerwijs) leidt tot de vernietiging, het verlies,
  de wijziging of de ongeoorloofde verstrekking van- of de ongeoorloofde toegang tot
  doorgezonden, opgeslagen of anderszins verwerkte persoonsgegevens.\\n\\nIndien u
  kennis heeft van een datalek of een mogelijk datalek vragen we u hier zo snel mogelijk
  melding van te maken. Wij pakken meldingen zo spoedig mogelijk op voor nader onderzoek
  en nemen die maatregelen die nodig zijn om verdere schade voor betrokkenen en ons
  te voorkomen.\\n\\nZoals de wet vereist wordt een datalek dat ernstige gevolgen
  kan hebben, gemeld bij de Autoriteit persoonsgegevens en bij de perso(o)n(en) wiens
  persoonsgegevens in het datalek zijn betrokken.\\n\\nKlachten\\n\\nMocht u een klacht
  hebben over de verwerking van uw persoonsgegevens vragen we u hierover met ons contact
  op te nemen. Komt u hier niet met ons uit, dan vinden wij dit natuurlijk erg vervelend.
  u heeft het recht een klacht in te dienen bij de Autoriteit Persoonsgegevens, dit
  is de toezichthoudende autoriteit op het gebied van privacy.\\n\\nWijziging van
  dit Privacy Statement\\n\\nMaarschalk|Ligthart Accountants & Belastingadviseurs
  B.V kan dit Privacy Statement aanpassen. De meest actuele versie van het Privacy
  Statement is altijd via onze website te raadplegen.\\n\\nBedankt dat u het Privacy
  Statement helemaal hebt gelezen!\\n\\nAls u naar aanleiding van onze privacy policy
  nog vragen of opmerkingen heeft, neem dan contact met ons op via email@example.com.\"",
  "\"Programmaboekje\\n\\n11 september 2022 - Camping Boszicht, Laag-Soeren\\n\\nVoorwoord\\n\\nVorig
  jaar vierden we de 10e verjaardag van de Eenhoorn Kinderrit. Het jaarlijkse feestje
  voor alle kinderen die graag met hun pony of paard in het bos vertoeven, en waar
  we als organisatie, vrijwilligers en ouders ook elk jaar weer volop van genieten.
  10 Jaar was een mooie mijlpaal, maar zeker niet het einde. Vol enthousiasme gaan
  we namelijk graag met jullie door, richting de volgende mijlpaal!\\n\\nElk jaar
  zeggen we weer tegen onszelf: \u201cwe houden het makkelijk, we verzinnen er niets
  meer bij\u201d. Maar blijkbaar is dat voor ons toch enigszins lastig! Dit jaar voegen
  we graag een nieuwe route toe speciaal voor deelnemers wiens begeleider te fiets
  wil. Wie de omgeving een beetje kent weet namelijk dat fietsen op onze routes echt
  geen pretje is. Toch kregen we iedere keer weer de vraag van ouder: \u201ckan ik
  ook meefietsen?\u201d. We gaan dit dus proberen, maar nu wel echt als proef! Daarmee
  hebben we overigens nog een andere primeur dit jaar: deze afstand wordt namelijk
  op GPS gereden in plaats van uitgezet. We horen heel graag van de deelnemers op
  deze afstand hoe dit bevalt, en dus voor herhaling vatbaar is.\\n\\nIn dit boekje
  hebben we alle informatie omtrent de Eenhoorn Kinderrit 2022 verzameld. Jullie vinden
  hier bijvoorbeeld de routekaarten, de groomroutes, het programma, enz. Zorg ervoor
  dat je dit boekje goed doorleest zodat je goed voorbereid bent. Mocht er voor de
  Kinderrit nog iets wijzigen, dan zullen wij dit melden tijdens de voorbespreking.
  Heb je nog vragen, neem dan gerust contact met ons op.\\n\\nVeel leesplezier en
  tot snel!\\n\\nGroeten van team Arnhemse Unicorn Meisjes,\\nRenata en Rachel\\n\\nWeds
  trijdge geven s\\n\\nOrganisatie: Rachel Marty, Renata van Meurs\\nPostadres: Kamphuizenlaan
  61, 6825 EB Arnhem\\nTelefoonnummer: 06-38696368\\nEmail: email@example.com\\nWebsite:
  www.kinderendurance.nl\\n\\nVrijwilligers: Jac Meulenberg (dierenarts), Wendy, Sandra,
  Marlies, Jaap, Herma, Sonja, Lambert, Amanda, Patricia, Marly, Justine, Ad\\nFotograaf:
  Evelien Bruijne - EB Fotografie\\n\\nWedstrijdlocatie: Camping Boszicht, Priesnitzlaan
  4, 6957 DE LAAG-SOEREN\\nTelefoonnummer: 0313-420435\\nEmail: firstname.lastname@example.org\\nWebsite:
  www.campingboszicht.nl\\n\\nSponsor\\n\\nDe Spelerij De Uitvinderij\\n\\nWedstrijdlocatie\\n\\nStartlocatie
  & parkeren\\n\\nDe startlocatie van de kinderrit is\\nCamping Boszicht,\\nPriesnitzlaan
  4,\\n6957 DE, Laag Soeren.\\n\\nDeze camping biedt ons de gelegenheid om deze rit
  te organiseren, en wij zijn hem dan ook zeer dankbaar hiervoor. Wij krijgen een
  eigen stukje terrein ter beschikking om het evenement plaats te laten vinden en
  er zijn toiletten aanwezig.\\n\\nWij zijn hier te gast, zorg er dus a.u.b. voor
  dat het terrein netjes wordt achtergelaten! Dat betekent dat er ook uitgemest dient
  te worden in de paddocks en bij de trailers (OOK HOOI EN VOERRESTEN OPRUIMEN!).
  Doe dit alstublieft, omdat anders de vrijwilligers met deze taak opgezadeld zullen
  worden, en die werken de hele dag al hard genoeg voor ons.\\n\\nAls u aankomt bij
  Camping Boszicht met de trailer rijdt u na het receptiegebouw direct naar rechts
  om dit gebouw heen. U rijdt vervolgens door de opening van de heg het parkeerweiland
  op. In verband met de beschikbare ruimte vragen wij u niet teveel ruimte in te nemen.
  Extra auto\u2019s kunnen op ditzelfde parkeerweiland parkeren. Ook hierbij geldt:
  parkeer zuinig.\\n\\nPaddocks\\n\\nPaddocks maken bij de trailers is in verband
  met de ruimte helaas niet mogelijk. De camping beschikt wel over paddocks waar tegen
  een kleine vergoeding gebruik van kan worden gemaakt. Om een paddock te reserveren:
  bel Camping Boszicht (0313-420435).\\n\\nOvernachten\\n\\nHet is mogelijk om te
  overnachten op Camping Boszicht. In een tent, blokhut of in de Boerderij is het
  goed vertoeven en zo maak je er een leuk weekend van in plaats van een leuke dag!
  De mogelijkheden zijn te vinden op www.campingboszicht.nl. Om te reserveren kunt
  u ofwel via de website een reservering plaatsen ofwel bellen met Boszicht.\\n\\nEten
  en drinken\\n\\nReceptie Camping Boszicht\\nBij de receptie van Camping Boszicht
  maken ze voor u een heerlijke kop verse koffie en/of Cappuccino klaar. Daar zijn
  tevens ijsjes te koop.\\n\\nDe Reizende Koekenpan\\nDe reizende koekenpan staat
  (helaas voor het laatste jaar) vooraan op het terrein en serveert pannenkoeken,
  friet en snacks. Met mooi weer kun je daar heerlijk op het terras zitten (in het
  zonnetje!) om bij te komen van de rit.\\n\\n1 Aanrijroute trailers & bezoekers\\n2
  Parkeren trailers & bezoekers\\n3 Toiletten\\n4 Mesthoop & mestgereedschap\\n5 Secretariaat\\n6
  Voor- en nakeuring paarden\\n7 Start & Finish\\n8 De Reizende Koekenpan\\n9 Receptie
  Camping Boszicht\\n10 Vuilnisbakken\\n\\nProgramma & Dagverloop\\n\\nProgramma\\n\\nHet
  tijdschema voor de dag vindt u in hieronder. Zorg er a.u.b. voor dat u op tijd aanwezig
  bent, zodat we ook bijtijds kunnen beginnen.\\n\\n| Tijd          | Activiteit                                      |\\n|---------------|-------------------------------------------------|\\n|
  Va. 9:00 uur  | Terrein open / aankomst deelnemers              |\\n| 9:30          |
  Secretariaat open                               |\\n| 10:00 uur     | Voorbespreking*                                 |\\n|
  10:30 uur     | Start voorkeuring 4,5 km                        |\\n| 10:45 uur     |
  Start voorkeuring 18 km                         |\\n| 11:00 uur     | Start voorkeuring
  17 km                         |\\n| 11:15 uur     | Start voorkeuring 8 km                          |\\n|
