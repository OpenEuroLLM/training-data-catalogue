  van september 2020 Planning is in voorbereidende fase, er hangt veel af van de ontwikkeling
  en bestrijding van het coronavirus.\\n\\nDe planning met het koor Sarabande staat
  op dit moment in de ijskast. Er wordt geen actie ondernomen vanuit dit koor en ook
  niet door Sarah Mareels.\\n\\nWij zullen in goed overleg moeten bepalen of het haalbaar
  is om dit project uit te voeren. Voorlopig wachten wij op een reactie van de kant
  van Sarah.\\n\\n7. Aanvraag fondsen\\n\\nNa aanmelding en betaling van \u20ac 300,00
  is toegang verkregen tot vele fondsen. Fondsonline werkt niet voor zijn klanten
  maar geeft alleen maar informatie. Dit lost het probleem van de aanvraag niet op.
  De uren werk die erin zit om een donatie aan te vragen is daarmee niet veranderd.
  Zeker nu in deze coronacrisis levert de aanvraag ook meestal niets op. Men wacht
  met de donaties op betere tijden. Ons voorstel om de samenwerking te be\u00ebindigen
  wordt door ons drie\u00ebn met ja beantwoord. Zelf fondsen zoeken levert vaak een
  beter resultaat.\\n\\n8. Rondvraag en sluiting\\n\\nVoor allen blijft het coronavirus
  een onzekere situatie, zeker voor de cultuursector.\\n\\nWat doen we als 21 februari
  niet door kan gaan ivm de lockdown?\\n\\nDan verplaatsen we naar 1 maart 2021\\n\\nOver
  2 weken kunnen we beslissen of de concerten van februari en maart kunnen doorgaan.
  Dan zal er door de demissionaire regering besloten zijn of de lockdown, waarin we
  nu zitten, zal worden verscherpt of worden afgezwakt. Wij blijven hopen.\\n\\nWij
  gaan Peter The beantwoorden dat hij 2 microfoons en kabels aan kan schaffen voor
  de livestream uitzendingen. Stichting ConcertoValiante Barok zal de helft van de
  kosten voor haar rekening nemen. Dit is in goed overleg afgesproken met de penningmeester.
  Wij zijn heel blij met Peter, zijn werk wordt door menig luisteraar enorm gewaardeerd.\\n\\nDe
  vergadering wordt om 15:00 uur afgesloten.\\n\\nDank voor jullie aanwezigheid.\\n\\n.\"",
  "\"Besluitenlijst van de vergadering van de gemeenteraad van Schiermonnikoog van
  17 november 2009\\n\\nDe heer Bakker (CGS) en de heer AB (OB) zijn niet aanwezig.
