  ook de VVP is net als de vakbond tegen de RPR. Ja, maar ik denk dat daar \u2026
  Ik kijk dan eens naar collega Colson, ik denk dat de reden\\n\\nPROVINCIERAAD VAN
  ANTWERPEN\\n\\nwaarom de VVP opmerkingen had bij de RPR, dat die argumenten vrij
  anders waren dan de redenen waarom de vakbonden tegen de RPR-ontwerpen waren. Het
  waren niet dezelfde argumenten. En u vraagt zich altijd af of het verkoop van openbaar
  bezit leidt tot afschaffing, wij gaan niet tot uitverkoop, zoals u het noemt, maar
  als er iets op de verkooplijst staat, is dat omdat wij dat niet langer nodig hebben.
  Het zou heel zot zijn om dat dan te houden. Hetzelfde, zelfredzaamheid bevorderen
  is niet per definitie de voorbode van privatiseren. Ik denk zelfs integendeel. Het
  is niet alleen aan aandeelhouders dat iemand effici\u00ebntie verschuldigd is. Onze
  aandeelhouders, dat heb ik daarstraks gezegd: dat is de burger, dat zijn degenen
  die ons financieren. Ook die hebben recht op goede, weloverwogen organisaties, zowel
  van alle diensten, als van de APB''s en de EVAP''s.\\n\\nVOORZITTER.- Mijnheer Sohier
  heeft het woord.\\n\\nDe heer SOHIER.- Ik wil heel kort reageren. Dank u wel voor
  het antwoord. De VVP heeft inderdaad een aantal andere argumenten, maar een aantal
  lopen ook wel gelijk. Dat is de concurrentie tussen de niveaus. Dat hebben we daarstraks
  ook gehoord, in de tussenkomt van mijnheer Vandendriessche. Hetgeen ik wil zeggen,
  is: ja, neoliberalisme, dat is inderdaad een woord dat ik ook niet veel gebruik.
  Maar in mijn tussenkomsten hoort u dat wel heel vaak. Een ander stuk dat ik wilde
  zeggen, is: u spreekt over de verkoop van gebouwen. Dat is niet altijd een negatieve
  zaak, dat kan ik beamen. Dat is waar. Soms moet je dingen van de hand doen. Maar
  we zien een tendens, en ik wil \u00e9\u00e9n ding toevoegen. Als we het hebben over
  het APB, of een EVAP, die worden begeleid om maturiteit en zelfredzaamheid te bekomen.
  Dan is dat een stap naar privatisering. Ik verwijs naar bijvoorbeeld het Suske en
  Wiske-Museum dat nu ook terug opnieuw in de verkoop staat. Tot zelfs de afschaffing
  toe. Ik heb een woord geleerd, ik heb ooit Latijnse gevolgd. Niet zo heel lang,
  om jullie gerust te stellen. Maar privatiseren komt van het werkwoord uit het Latijn,
  privare. En privare wil zeggen: beroven. Als je dingen die openbaar bezit waren,
  verkoopt en privatiseert, beroof je eigenlijk de samenleving. Dat is alles wat ik
  wilde zeggen.\\n\\nVOORZITTER.- Ik kijk nog eens eventjes rond voordat ik mijnheer
  Daneels nog eens aan het woord laat. Maar ik zie geen handen meer, of mensen die
  het woord vragen. Mijnheer Daneels heeft het woord.\\n\\n3. Leefmilieu, financi\u00ebn
  en logistiek\\n\\nNr. 3/6 van de agenda\\n\\nTussenkomst van de heer Tobias Daneels
  over digitaal belastingen innen.\\n\\nDe heer DANEELS.- Dank u. Mijn stappenteller
  dankt de extra tussenkomt van mijnheer De Haes. Geachte voorzitter, collega''s.
  In onze commissie kregen wij onlangs een paar interessante feiten over het innen
  van de belastingen in onze provincie. En vooral dan over het digitaal innen en ook
  uitzenden van de belastingsbrieven. En het digitaal op de hoogte stellen van de
  burgers van de provincie Antwerpen over hun jaarlijkse provinciale belasting.\\n\\nEn
  ik onthoud eigenlijk twee belangrijke dingen die we daar geleerd hebben. E\u00e9n
  het versturen van de vele brieven. Meer dan een miljoen als ik me niet vergis, in
  totaal, ook met de extra brieven als er geen reactie is de eerste keer. Die kosten
  de provincie echt wel enorm veel geld. En daar tellen we dan nog niet de milieukosten
  bij. En je weet dat dit systeem toch wel redelijk belastend is.\\n\\nEn het tweede,
  het aantal mensen dat op dit moment werkt met de eBox, waarin je je belastingbrief
  digitaal kan aankrijgen is wel redelijk laag. Het stijgt gestaag, hebben we ook
  gezien, maar het is nog redelijk laag. En elke burger die overtuigd wordt om met
  die eBox te werken, is een brief minder die we moeten uitsturen. Dus hebben we er,
  denk ik, ook wel baat bij om zoveel mogelijk mensen te overtuigen en ook te helpen
  om dit systeem te leren kennen, en eventuele hordes voor hen weg te nemen. Zodat
  ze kunnen ondervinden dat als je hiermee aan de slag gaat, dat dat toch wel een
  meerwaarde kan zijn. Uiteraard, degenen die er niet echt vaardig in zijn gaan we
  nog altijd helpen bij hun belastingen. En ik hoorde ook in de commissie dat het
  systeem niet echt provinciaal geco\u00f6rdineerd is. Dat het dus bij een ander beleidsniveau
  zit. Dus het is ook misschien niet echt aan ons om er promotie voor te voeren. Maar
  ik geloof wel dat de mogelijke winsten voor de provincie ook, zowel economisch als
  qua milieu, te groot zijn om gewoon aan de kant te wachten tot een ander beleidsniveau
  wel al die mensen kan overtuigen om misschien een versnelling te hebben in het gebruik
  van die eBoxen.\\n\\nEn daarom had ik eigenlijk enkele vragen. Vraag \u00e9\u00e9n:
  is het mogelijk om eventueel zelf ook een beetje budget vrij te maken om de mensen
  hiervoor meer en sneller warm te maken? Ik denk dat dat een investering kan zijn
  die zich terug zou kunnen betalen, als meer mensen hier in meegaan. Eventueel via
  een eigen pagina op de website. Mensen kunnen we misschien via de papieren belastingbrief
  aanzetten naar de website te gaan en de eBox te ontdekken.\\n\\nEn twee, in hoeverre
  wordt er in overleg gegaan met dat andere beleidsniveau of de niveaus die verantwoordelijk
  zijn om dit, desnoods gezamenlijk, versneld aan te pakken en uit te rollen? Want
  ik denk dat we er allemaal baat bij hebben. Dank u.\\n\\nNr. 3/7 van de agenda\\n\\nTussenkomst
  van mevrouw Ann Bakelants over de hoge kostprijs van de verzending van de aanslagbiljetten
  voor de algemene provinciebelasting en de inzet op verdere digitalisering via eBox.\\n\\nVOORZITTER.-
  Dank u wel, mijnheer Daneels. Mevrouw Bakelants heeft het woord.\\n\\nMevrouw BAKELANTS.-
  Geachte voorzitter, beste collega''s. Mijn vraag is eigenlijk gelijkaardig als die
  van mijn voorganger, Tobias Daneels. Nochtans hebben we het niet afgesproken. Ik
  wou dus nog even in herinnering brengen dat de portkosten voor de verzending van
  de post van de aanslagbiljetten voor de provinciebelastingen, in 2020 bedroegen
  die 636.225 EUR. Dat is een enorm groot bedrag, wat verminderd zou kunnen worden
  indien we beter zouden inzetten op de\\n\\nverdere digitalisering via de eBox. Dat
  was een expliciete vraag die ik vorig jaar, in december, hier stelde bij de begrotingsbesprekingen.
  Maar wat is ermee gebeurd? Helaas heb ik vastgesteld dat er met het besluit van
  de provincieraad van 24 november, waarin de plaatsing van de opdracht, de procedure
  voor de verzending van de belastingdocumenten, werd goedgekeurd. Dat de verzending
  voor de belastingdocumenten voor 2023 nu wordt geschat op 700.000 EUR. Dat is opnieuw
  een heel groot bedrag, wat best zou verminderd kunnen worden. Ik besef ook wel dat
  de prijzen bij de post blijven stijgen. Maar toch denk ik dat er minimaal meer moet
  ingezet worden om meer mensen te laten gebruik maken van de eBox. De dienst fiscaliteit
  tracht wel sinds 2021 om belastingdocumenten via de digitale weg, via de eBox te
  verzenden, maar er is nog een lange weg te gaan. In 2021 heeft de provincie via
  de eBox 142.000 aanslagbiljetten kunnen verzenden. Dat was toen slechts zo''n 22
  procent van het totale aantal belastingplichtigen. Dit jaar werden er 240.000 aanslagbiljetten
  verzonden via eBox, ofwel zo''n 36 procent. Alsook 91.000 herinneringsbrieven. Dus
  eigenlijk is dat maar een stijging van veertien procent op een jaar tijd. Dat is
  dus nog een hele lange weg te gaan.\\n\\nGraag had ik ook nog wat cijfermateriaal
  ontvangen over de effectieve aantallen van verzendingen voor dit jaar. Hoeveel aanslagbiljetten
  zijn er nu effectief verzonden? En hoeveel herinneringsbrieven zijn er verstuurd?
  En waarom was in 2023 de plaatsing bij de Vlaamse overgangsopdracht vertraagd? Hoe
  komt het dat de gunning, normaal voorzien in het voorjaar van 2022, maar eerst in
  december of het voorjaar van 2023 verwacht wordt? En zou het niet goedkoper zijn
  om de verzending via een private firma of maatwerkbedrijf te laten verlopen? Het
  is natuurlijk een heel grote taak, maar we zouden erover kunnen nadenken.\\n\\nDus
  graag pleit ik er opnieuw voor dat er vanaf maart/april, weer een informatiecampagne
  zou kunnen komen vanuit de provincie of de federale overheid zodat er meer belastingplichtigen
  hun eBox zouden kunnen activeren. Indien er dus meer belastingplichtigen hun eBox
  activeren, zal de enorm hoge kost van de verzending van zo''n 700.000 EUR verminderen.
  In het kader van duurzaamheid is dat toch ook zeker een win-win. Ik heb dat trouwens
  al gezegd bij de vorige provincieraad, maar ik blijf er toch op hameren dat ik daar
  ontgoocheld over ben dat dat zo''n groot bedrag is, dat toch zeker verminderd zou
  kunnen worden.\\n\\nEn dan herhaal ik ook nog eens eventjes wat mijn collega Koen
  al zei bij zijn tussenkomst over de singletoets. Ik vind dat ook bijzonder jammer.
  Ik heb er nu, dit jaar, geen aparte vraag over gesteld. Maar ik wil het toch nog
  eens even aanhalen, dat die belastingreglementen echt zouden gemoderniseerd moeten
  worden. Temeer omdat er meer en meer singles zijn.\\n\\nNr. 3/8 van de agenda\\n\\nTussenkomst
  van de heer Koen Anciaux over de provinciebelastingen op bedrijven.\\n\\nVOORZITTER.-
  Dank u wel, mevrouw Bakelants. Mijnheer Anciaux heeft het woord.\\n\\nDe heer ANCIAUX.-
  Mijnheer de voorzitter, mevrouw de ondervoorzitter, collega''s. Ik had een tussenkomst
  in verband met de algemene provinciebelasting bedrijven. We hebben daar ook een
  amendementje voor ingediend. Niet maar omdat we nog maar een keer creatief willen
  zijn. De oproep creativiteit was naar het provinciebestuur, met de vraag: kunt ge
  naar volgend jaar bij de belastingreglementen, op een creatieve manier aanpassen
  waar je duidelijk rekening houdt met duurzaamheid, en zo verder. Dit is maar \u00e9\u00e9n
  overgang, omdat ik nu echt een oproep wil doen naar Vlaamse bedrijven, vrije beroepen
  en zelfstandigen, maar eigenlijk die hele kleintjes. Alle bedrijven hadden het dit
  jaar moeilijk, de vorige jaren moeilijk, maar de kleine die getroffen worden, ook
  door deze algemene provinciebelasting op bedrijfsvestigingen, dat valt ons toch
  wel heel moeilijk. We beseffen dan natuurlijk dat al die middelen nodig zijn om
  het beleid te voeren. Het beleid waar dat wij eigenlijk zeer kritisch over zijn.
  Maar toch. Ik zie gewoon aan mijnheer\\n\\nLemmens dat ik onthoud wat hij daarstraks
  gezegd heeft. Nee, wij vinden niet alles goed, voor alle duidelijkheid. Er is wel
  heel wat bij te sturen, bijvoorbeeld dit belastingreglement. Want voor ons ligt
  dat toch wel heel moeilijk. En zeker voor die hardwerkende Vlamingen. Jullie zeggen
  dat zelf, hardwerkende Vlamingen. En die gaan we nog een keer \u2026 Zeker zij die
  een bijberoep werken of die gewoon, een kleine zelfstandige met heel weinig oppervlakte,
  want dat is in dit voorstel \u2026 Ik ga nog even mee in de oude manier van belastingvoeren,
  belasting opleggen, op basis van oppervlaktes en voor de rest eigenlijk niks. Ik
  ga daar nog eventjes in mee, voor \u00e9\u00e9n jaar. Maar mijn voorstel is om die
  mensen vrij te stellen, tot vijftig vierkante meter, dat is quasi niks. En als je
  dan ziet, die mensen doen dat soms om gewoon de eindjes aan elkaar te knopen aan
  het einde van de maand. Dat zijn kleine zelfstandigen in veel gevallen. Sommigen
  hebben helemaal geen oppervlakte, maar moeten toch betalen. 109 EUR, volgens het
  nieuwe reglement. Als je dan ziet dat in Belgi\u00eb geen voldoende kloof is met
  de niet-werkenden die van een vervangingsinkomen kunnen genieten, en al goed dat
  die mensen dat hebben, we gaan niemand in armoede storten. Maar iemand die werkt,
  de kloof moet voldoende groot zijn, en dan gaan we hen nog eens extra belasten.
  Want iemand met een vervangingsinkomen, die gaat die 109 EUR nooit betalen. En daarom
  doen we een oproep om dit amendement, dat we straks in 3/5, all\u00e9e, het heeft
  een andere nummering gekregen, het amendement, ik denk dat het 3/7 is, dat iedereen
  dat eigenlijk zou goedkeuren. Eventjes niet kijken naar de partijtucht, maar gewoon
  in eer en geweten denken aan die mensen.\\n\\nDank u. Ann, applaus.\\n\\nNr. 3/9
  van de agenda\\n\\nTussenkomst van mevrouw Fauzaya Talhaoui over vergroening belasting
  voor bedrijven.\\n\\nVOORZITTER.- Dank u wel. Mevrouw Talhaoui heeft het woord.\\n\\nMevrouw
  TALHAOUI.- Voorzitter, mevrouw de voorzitter, griffier, beste deputatie, beste collega''s.
  We moeten hier aan creativiteit doen en ik denk dat ik een creatief voorstel voor
  u heb, gedeputeerde De Haes. Collega''s, de klimaatverandering en energiecrisis
  vraagt van elke stakeholder in onze samenleving een steentje bij te dragen aan het
  gezond houden van onze planeet. Dus ook onze bedrijven. Misschien kan de provinciale
  belasting op bedrijven een middel, een aanmoediging zijn, om meer duurzaamheid en
  klimaatvriendelijkheid in ons belastingsysteem in te bouwen. Volgens de zonnekaart
  Vlaanderen, ik weet niet of iedereen de zonnekaart Vlaanderen kent, en al dan niet
  geprobeerd heeft om zijn eigen dak op zijn eigen huis, haar huis daarin te zoeken,
  en kijken hoe dat de zon op het dak schijnt. Maar volgens de zonnekaart Vlaanderen
  komen heel wat daken van middelgrote tot grote bedrijven in aanmerking voor zonnepanelen.
  Veel van deze gebouwen beschikken over een voldoende geschikte dakconstructie en
  oppervlakte en zijn dus sterk genoeg om voldoende PV zonnepanelen te dragen.\\n\\nMijn
  voorstel is dan ook het volgende: zou de provincie niet kunnen overwegen om een
  korting te geven op de provinciale bedrijfsbelasting per vierkante meter dakoppervlak
  waarop panelen worden gelegd? Dat is mijn voorstel. Het zou een incentive kunnen
  betekenen voor bedrijven met grote dakoppervlaktes, die gunstig liggen voor zonnepanelen
  met een hoog rendement. Sommige bedrijven in onze provincie hebben die al en besparen
  heel wat op hun energiekosten, en helpen zo onze provincie mee de klimaatdoelstellingen
  te halen.\\n\\nTweede voorstel. Misschien kunnen we een studie bestellen, gedeputeerde
  Lemmens had het daar net nog over, de ingenieurs die we gingen aanwerven om te kijken
  hoe energiezuinig of klimaatvriendelijk we nog kunnen worden. Misschien kan er een
  studie besteld worden om in de verschillende domeinen zo de impact te meten, in
  het kader van de vergroening van deze bedrijfsbelasting. Bijvoorbeeld over hoeveel
  onbenutte daken gaat het, wat is de ecologische\\n\\nwinst die we daar kunnen uit
  halen? Ik heb het nu hier over zonnepanelen gehad, maar dat kan over andere energiebronnen
  ook gaan. Groendaken, waterpompen, en wie weet wat er nog allemaal bestaat en wetenschappelijk
  misschien nog uitgevonden zal worden om inderdaad te zorgen dat daken, bedrijven,
  milieuvriendelijker worden. Dat waren mijn voorstellen.\\n\\nVOORZITTER.- Dank u
  wel. Mevrouw Verhaert mag zich al klaarmaken, maar mijnheer Anciaux wil eventjes
  \u2026\\n\\nDe heer ANCIAUX.- Ja, ik wil daar even op inpikken. Dat is een fantastisch
  goed voorstel, dat Fauzaya hier doet. En dat is de creativiteit die ik verwacht
  naar volgend jaar toe. Je mag dat nu ook, vlug, vlug. Maar ik denk niet dat u een
  concreet amendement indient, maar echt duidelijk zegt waar het schoentje wringt:
  dat wij op een te oude, traditionele manier bedrijven belasten.\\n\\nNr. 3/10 van
  de agenda\\n\\nTussenkomst van mevrouw Inga Verhaert over de inning van de algemene
  personenbelasting bij internationale gasten van hoger onderwijsinstellingen. De
  regeling hierrond is relatief recent gewijzigd. In hoeverre zal de provincie de
  inning opvolgen wanneer de belastingsplichtige niet langer in het land is op het
  moment dat de belastingsbrieven worden bedeeld?\\n\\nVOORZITTER.- Dank u wel. Mevrouw
  Verhaert heeft het woord.\\n\\nMevrouw VERHAERT.- Collega''s, een vraag uit de praktijk.
  Na de recente aanpassing van het belastingreglement is het zo dat de internationale
  gasten van hoger onderwijsinstellingen in de provincie Antwerpen een belastingbrief
  krijgen wanneer zij nog geregistreerd zijn, een verblijfsvergunning hebben, op 1
  januari van het jaar waarin de belastingbrief in de bus valt. Vroeger liep dat een
  beetje anders en konden hogere onderwijsinstellingen aan de provincie meedelen:
  kijk, deze mensen zitten hier nog wel op 1 januari, maar die gaan niet lang meer
  blijven. Die gaan bijvoorbeeld eind januari of begin februari al vertrekken, omdat
  dat bijvoorbeeld uitwisselingsstudenten zijn. Die zijn hier voor \u00e9\u00e9n semester,
  of zelfs minder. Of dat zijn onderzoekers die voor een kortere periode hier zijn.
  Nu leren we dat dat niet langer zal kunnen. Dus iedereen die hier geregistreerd
  staat op 1 januari, krijgt zo''n belastingbrief. Ongeacht of die hier nog zijn.\\n\\nEn
  mijn vraag is: hoe gaat de provincie daarmee om bij het innen? Gaat men dat heel
  erg aanklampend doen, door rappels te sturen? In het geval men echt over een thuisadres
  beschikt, komt dat dan misschien met vertraging ergens ver weg aan? Of gaat men
  dat laten voor wat het is? Ik stel de vraag eigenlijk om twee redenen. Ik ben een
  beetje bezorgd dat de oefening om het te innen, dat die misschien wel eens wat meer
  zou kunnen gaan kosten dan het opbrengt. Tweede bekommernis is: de hogere onderwijsinstellingen
  in de provincie zijn degene die dan de vragen gaan krijgen van internationale gasten
  die intussen ergens anders zitten, misschien thuis, misschien op een andere plek,
  en die niet goed gaan begrijpen wat hen eventueel nog wordt nagestuurd. Dat is een
  beetje vervelend. Dat is vervelend voor de hogere onderwijsinstellingen, maar dat
  is ook vervelend voor de provincie en voor de betrokkenen. Bovendien is het zo dat
  het nasturen, nabetalen van belastingen vanuit sommige partnerlanden waarmee hogere
  onderwijsinstellingen aan de slag zijn, niet altijd evident is. We hebben bijvoorbeeld
  nogal wat gastdocenten en onderzoekers, studenten ook, uit een land als Cuba. Ja,
  daar is bancair verkeer gewoon niet mee mogelijk. Dus dat zijn een paar bezorgdheden
  vanuit de praktijk.\\n\\nVOORZITTER.- Dank u wel, mevrouw Verhaert. Gedeputeerde
  De Haes heeft het woord.\\n\\nDe heer DE HAES, gedeputeerde.- Dank u wel, allemaal,
  voor de vragen over belastingen.\\n\\nEerst de vraag van Tobias. Natuurlijk, ik
  ben ook heel bezorgd. Ik denk dat je daar niet aan moet twijfelen. Niet alleen bezorgd
  over kosten, maar ook over de milieueffecten van heel die operatie. En we zetten
  al een aantal jaren echt vanuit de Dienst Fiscaliteit volop in op die digitalisering.
  En dan kijken we natuurlijk naar het digitaal verzenden via de eBox, wat de algemene
  provinciebelasting betreft. Elke burger die een eBox activeert, krijgt nu al zijn
  belastingdocument digitaal. En inderdaad, het is genoemd, in 2021 was dat 142.000
  aanslagbiljetten. In 2022 was dat 240. Misschien enige correctie, die eerste was
  22 procent en die tweede was 36 procent. Maar dat is niet een stijging met veertien
  procent, dat is een stijging met veertien procent punt. Ook de eerste herinnering
  werd verzonden via eBox. In 2023 zullen het er een 302.000 zijn. Dus 45 procent
  van de aanslagbiljetten. En als je dat dan goed uitkijkt, dan weten we dat we nu
  45 procent en twee jaar geleden 22 procent hadden. Dan is dat eigenlijk een verdubbeling.
  En dan denk ik dat dat toch niet zo slecht vooruit gaat. Belangrijk is de eBox,
  dat gaat uit van FOD BOSA en dat is eigenlijk puur een federale materie. En het
  is aan BOSA, Sociale Zaken dus, in eerste instantie om reclame te voeren voor die
  eBox. Zelf, als provincie, zetten wij op alle kanalen in waar we zelf controle over
  hebben. Ook op papier, op het papieren aanslagbiljet, staat de uitnodiging om de
  eBox te activeren. We zullen dat ook blijven doen. We zijn ons wel bewust van de
  knelpunten. Het concept eBox is nog altijd onvoldoende gekend. We hebben meegemaakt,
  in corona, dat mensen eigenlijk, hoe zal ik het zeggen, per vergissing hun eBox
  hadden geactiveerd, om dan vast te stellen dat ze die nadien niet consulteerden
  en een aantal documenten missen. De verzending van zo''n belastingdocument zou ook
  kunnen gemist worden.\\n\\nWat is een tweede knelpunt? Het inningspercentage van
  de eBox-verzendingen ligt, welteverstaan na de eerste zending, twintig procent lager,
  maar dat haalt zich dan nadien weer in. Van die knelpunten zijn alle betrokken overheden
  voldoende op de hoogte en zij werken eraan om die acties, om dat euvel aan te pakken.
  Bijvoorbeeld inactieve eBoxen worden door de overheden zelf gedeactiveerd, zodanig
  dat die terug op nul gezet werden zodat de mensen terug hun papieren uitnodiging
  krijgen. Er is ook nu een verplichting voorzien om een e-mailadres op te geven bij
  de activatie van de eBox, zodanig dat er inderdaad communicatie ontstaat. Ik ben
  me er ook van bewust dat er ook waarschijnlijk nog wel wat wantrouwen ten opzichte
  van die overheidscommunicatie per mail bestaat. En ik denk dan vooral aan phishing.
  Dat mensen zich afvragen: kunnen we die mail wel echt vertrouwen? Wat wij vanaf
  ''23 doen, en dat is ook heel belangrijk, ik heb er daarstraks naar verwezen, dat
  is op de aanslagbiljetten direct ook een QRcode gaan zetten, zodanig dat de betaling
  gemakkelijk kan en dat die ook heel correct verloopt. Dat heeft ook in ons financieel
  proces alweer een voordeel, als dat in \u00e9\u00e9n keer goed is zijn er veel minder
  fouten achteraf. Dat bespaart ons veel moeite en last. Ook voor bedrijven staat
  die QRcode op de roadmap, maar dat zal in 2024 zijn. Net zoals het verzenden van
  de aanslagbiljetten van de bedrijfsvestiging, wat ook via eBox-enterprise zal gebeuren.\\n\\nZoals
  ik zei, we volgen die evolutie van die actieve concens heel hard op, ook bij de
  zelfstandigen en de bedrijven. Dat was nog heel laag, in 2021. Zeven procent. In
  2022 dertien procent. Ook een verdubbeling, maar een verdubbeling van weinig is
  nog altijd niet veel. Maar vooral bij zelfstandigen en kmo''s is het gebruik van
  eBox-enterprise nog beperkt. We worden daar waarschijnlijk wel geholpen vanuit een
  andere hoek. Inderdaad, een RSZ als eigenaar van de eBox-enterprise, zet nu heel
  veel op in communicatie via de sociale media. En normaal zouden vanaf 2023 de eerste
  betaalverzoeken door de RSZ en de Vlaamse Belastingdienst via de eBoxenterprise
  verzonden worden. Dus daar verwachten we ook een sterke versnelling.\\n\\nDaarnaast
  werken we sinds 2021 ook met de digitale aangiften voor bedrijven. Het aangifteformulier,
  daar staan twee codes in. En op een heel eenvoudige manier kunnen ze aangiften digitaal
  wijzigen en indienen. Ook dat werkt beter en beter jaar na jaar. En de wijzigende
  aangiften zijn nu zo''n 13.500, die gebeuren dan onmiddellijk digitaal, en dat is
  al zo''n vijftig procent van die wijzigingsaangiften. Ik denk dat we daar op een
  goede weg zijn.\\n\\nMaar daar sluit de vraag van mevrouw Bakelants zeker bij aan,
  want dat gaat dan over de andere kant van de eBox-medaille, de niet-eBox, de papieren
  medaille. En inderdaad, er werden nog 1.042.000 belastingdocumenten verstuurd voor
  een totaalbedrag in 2022 van 632.000. En dat\\n\\nis het effect dat ik vorige keer
  ook heb uitgelegd. Dat is: wij verminderen ons volume wel, maar de prijs per stuk
  blijft sterk stijgen, waardoor we blijven zitten met hoge kosten. Stel dat wij evenveel
  zouden versturen, dan zouden we nu 70.000 extra hebben. Dus we besparen op het aantal,
  maar we besparen nog niet meteen op de kost. Dankzij het maximaal versturen via
  de eBox is het werkelijke postbudget dus niet gestegen. We blijven dan ook onder
  het budget van vorig jaar. We hopen dat we dat in ''23 ook nog kunnen doen, maar
  ja, ook daar zijn de stijgingen van de prijzen. Dat moeten we eigenlijk compenseren
  door het verminderen van de aantallen die we op papier zullen versturen. We zetten
  dan ook heel veel in op die communicatie over de eBox, zoals ik zei, op alle papieren
  verzendingen, ook op de provinciale website. En ik denk dat ik daar ongeveer de
  cijfers net gegeven heb.\\n\\nWat de algemene provinciebelasting betreft, dat is
  de gezinsbelasting, dat is dat 750.000 documenten, 670 aanslagbiljetten. Dus er
  wordt wel wat verstuurd.\\n\\nDe overheidsopdracht, dat was ook uw vraag mevrouw
  Bakelants, in Vlaanderen, dat is een hele grote opdracht. Eind oktober was het Agentschap
  Facilitair Bedrijf dus bezig met het opvragen van aangepaste offertes en met de
  goedkeuringscyclus van de Vlaamse regering. Wij hebben zelf helaas geen invloed
  op dat proces. Voor ''23 zal de provincie Antwerpen, de Dienst Fiscaliteit, zullen
  we nog rechtstreeks een contract met Bpost afsluiten. Vermits die Dienst Fiscaliteit
  voor wat betreft het drukken en verzendklaar maken nog altijd samenwerkt met het
  huidige contract met Cipal Schaubroeck. Wanneer uiteindelijk die overheidsopdracht
  van Vlaanderen wordt gegund, kan de provincie nog altijd aansluiten. Dus het \u00e9\u00e9n
  sluit het ander niet uit. Omdat die overheidsopdrachten, en dat is puur technisch,
  gaat ook over het drukken, verzendklaar maken, en verzenden, dat is een continu\u00fcm
  die daar inzit. Dus naast de uitdaging om zoveel mogelijk te digitaliseren zoeken
  we natuurlijk ook in het algemeen naar oplossingen om de kost van papieren verzendingen
  te drukken. En we kijken daar zeker ook naar nieuwe spelers, andere spelers. Bijvoorbeeld
  Provinciaal Onderwijs, zal vanaf januari samenwerken met Click & Post van Ricoh
  voor de verzending van hun leerlingenfacturen. Dus we zijn daar in alle mogelijke
  richtingen aan het kijken om zowel de kost als het papier en de bomen te verminderen.\\n\\nDe
  derde vraag. De vraag van creativiteit. De eerste vraag van creativiteit. Ik deel
  uw bezorgdheid omwille van de moeilijkheden die kleine bedrijven hebben, versta
  me niet verkeerd, maar er zit ook een belastingtechnische logica achter. En dan
  bedoel ik juridische logica. Wij hebben een belastingreglement op bedrijfsvestingen
  en dat dient om de belastingdruk op een algemene en evenwichtige wijze te spreiden
  over de meer dan 175.000 belastingplichtigen. Het is dus eigenlijk de bedoeling
  om die belasting zo min mogelijk selectief te heffen. En, daar bijkomend, een eenvoudige
  en makkelijk controleerbare belasting te heffen, waarbij het minimumtarief zo laag
  als mogelijk wordt gehouden en waarbij de administratieve kost en werkdruk voor
  die diensten ook beperkt wordt gehouden.\\n\\nEr is daarstraks ook de vraag van
  de sterkste schouders gesteld. Je hebt die taart gezien. Ruim zestig procent is
  opcentiemen op de onroerende voorheffing, dat is een vermogensbelasting. We moeten
  daar niet flauw over doen. Dus eigenlijk is de extra belasting op bedrijven en gezinnen
  34 procent, of \u00e9\u00e9n derde van onze inkomsten. Als je dat niet selectief
  mag doen, dan is op dat moment het vrijstellen van vestigingen, met een oppervlakte
  onder de vijftig vierkante meter, komt dat daar ook niet aan tegemoet.\\n\\nToen
  ik dit jaar daaraan begonnen ben, aan Financi\u00ebn, was dat ook \u00e9\u00e9n
  van mijn eerste bezorgdheden om te kijken wat mogelijk is in belastingdifferentiatie.
  We hebben dat laten onderzoeken, financieel, juridisch en organisatorisch. Het grootste
  probleem van uw voorstel is eigenlijk op dit moment de budgettaire impact. Op dit
  moment weten we niet van de bedrijven onder de duizend vierkante meter, hoeveel
  daarvan onder de vijftig vierkante meter zitten. Die cijfers hebben wij niet. Maar
  we kunnen natuurlijk kijken naar diegenen die die cijfers wel hebben, bijvoorbeeld
  de grote stad Antwerpen. En daar hebben ze een oefening gemaakt, en daar weten ze
  dat ongeveer vijftig procent van de belastingplichtigen onder de vijftig vierkante
  meter zou zitten. Als je dan weet dat onze bedrijfsvestingbelasting voor ''23 gebudgetteerd
  is op zo''n 42 miljoen, dan zou dat vrijstellen van die min vijftig vierkante meter,
  ons in ons inkomen 21 miljoen per jaar kosten. Dit is een raming, ik kan er wat
  meer of wat onder zitten, maar het is wel heel substantieel. En het zal een enorme
  budgettaire impact hebben. En die minder opbrengst, die zal dan moeten gecompenseerd
  worden door optrekken van andere tarieven, op\\n\\ngrotere bedrijfsvestingen bijvoorbeeld.
  Bovendien moeten we ook rekening houden met de vrijstelling van min vijftig, dat
  dat administratieve kosten met zich mee zou brengen. Dus mijn oproep, straks, en
  ik zal het nu al lanceren, met betrekking tot uw amendement, ik zal natuurlijk vragen
  om dat amendement niet goed te keuren. Dat verwondert u niks. Maar als je het toch
  wenst te steunen, dat is een vraag aan iedereen in deze raad, dan verneem ik meteen
  ook graag welke provinciale dienstverlening we dan met ingang van volgend jaar moeten
  stoppen om die 21 miljoen te compenseren. U hebt er een aantal genoemd die u heel
  schitterend vond. Ik neem aan dat je die niet wil stoppen. Maar misschien vindt
  u er wel eentje van twintig miljoen die u wel wilt stoppen en die we dan kunnen
  schrappen uit onze dienstverlening. Laat het op tijd weten, voordat we het amendement
  stemmen. Misschien een amendement op het amendement.\\n\\nIk ga verder met de vraag
  van mevrouw Talhaoui, het vergroenen van de belasting. Ook daar hebben we naar gekeken.
  We hebben dat onderzoek gedaan, om een belastingvrijstelling in te schrijven in
  het belastingreglement, een lager belastingtarief te hanteren voor oppervlakten
  met zonnepanelen. We hebben daar heel veel onderzoek naar gedaan. We hebben er ook
  extern advies rond gevraagd. We hebben daar experten opgezet. Maar dat advies was
  negatief. En ik vat de redenen samen. Er waren verschillende redenen. Het hoofddoel
  van provinciebelasting is budgettair. Dat kan raar klinken, maar dat is echt een
  belasting omwille van het verzamelen van geld voor beleid mee te voeren. Het gaat
  dus om een algemene provinciebelasting, die voor iedereen geldt, die zo breed mogelijk
  moet worden ingevuld en waarbij men een evenwichtige spreiding van de belastingdruk
  tracht te bewerkstelligen. In die zin is volgens de adviezen die we hebben een vrijstelling
  of een lager tarief voor groene energie moeilijk te verantwoorden. Een dergelijke
  vrijstelling zou ook betwistingen kunnen doen rijzen in het kader van vermeende
  schendingen van het gelijkheidsbeginsel, bijvoorbeeld een gewone warmtepomp versus
  een warmtepomp met captatienet en dergelijke. Daar gaat heel veel debat ontstaan.
  En bovendien, en dat is dan voor onze rechtszekerheid, is er helemaal of bijna geen
  rechtspraak hieromtrent. En is het heel onzeker of het belastingreglement de toets
  van het gelijkheidsbeginsel dus zou kunnen doorstaan. Het gaat ook in tegen het
  doel van de belasting, om een eenvoudige en gemakkelijk controleerbare belasting
  te heffen. Dergelijke dossiers zouden immers \u00e9\u00e9n voor \u00e9\u00e9n moeten
  bekeken worden door onze administratie. Dat is dus niet eenvoudig.\\n\\nIk heb daar
  nog twee bedenkingen bij. Ik vraag me soms ook af of het politiek nu, na alles wat
  we hier strikt juridisch oplijsten, vraag ik me soms af of het politiek gezien ook
  raadzaam is om een lager tarief voor groene energie te hanteren. Gelet op, en ik
  zeg misschien iets gevaarlijks, gelet op de oversubsidi\u00ebring die men hier en
  daar al wel eens via studiebureau Oxera heeft gepubliceerd op vraag van het Vlaams
  Energie-en Klimaatagentschap. 73 procent van de uitgekeerde groene stroomcertificaten
  waren eigenlijk overgesubsidieerd. Dus ik denk dat we daar \u2026 Ja, die staan
  er nog wel h\u00e8. Ik wil daar nog \u00e9\u00e9n ding bij vermelden. En ik denk
  niet dat we een debat over de oversubsidi\u00ebring moeten beginnen, maar juridisch-technisch
  hebben we een probleem. Maar dat wil niet zeggen dat we met die centjes niks doen
  voor het klimaat. Integendeel. Ik denk dat wij vanuit onze provinciale middelen
  heel hard werken aan de klimaatrobuustheid. Niet alleen van onze organisatie, maar
  ook van onze provincie. Dus daar we het niet kunnen als korting geven, trekken we
  de centen binnen en doen we er wel iets mee dat goed is voor het klimaat.\\n\\nIk
  heb nog de vraag van mevrouw Verhaert over de inning van de algemene personenbelasting
  bij internationale gasten. Inderdaad, studenten die om studieredenen langer dan
  drie maand in Belgi\u00eb verblijven, die worden ingeschreven in het Belgische rijksregister,
  als referentiepersoon, met hoofdverblijf \u00e9\u00e9n op \u00e9\u00e9n binnen de
  provincie. Bijgevolg zijn zij belastingplichtig en wordt in principe een aanslagbiljet
  verzonden. Het zou, voor zover we dus weten, om een duizendtal buitenlandse studenten
  per jaar gaan. Misschien \u00e9\u00e9n nuance, in het belastingreglement zelf heeft
  nooit een belastingvrijstelling gestaan. Stond daar niet in. Het werd wel toegepast,
  op vraag van de scholen. In het belastingreglement staat wel dat iemand van zodra
  hij in het rijksregister ingeschreven is, een hoofdverblijfplaats heeft binnen de
  provincie, op 1/1, in januari dus, dan wordt die belast. Er staat in het rijksregister
  helaas nooit in of het om een buitenlandse student gaat. Bovendien, en dan wordt
  het nog moeilijker, volgens de DPO, de Data Protection Officer van de provincie,
  is het bovendien niet conform de GDPR-regelgeving om de persoonsgegevens van buitenlandse
  studenten op te vragen, of te krijgen, bij de hogescholen en\\n\\nde universiteit.
  Belangrijke nuance, buitenlandse studenten met recht op verhoogde tegemoetkoming
  of equivalent leefloon, die worden wel vrijgesteld van de belasting. Dat gebeurt
  automatisch, net zoals voor al onze andere belastingplichtigen waar ik daarstraks
  vergeten ben op terug te komen. Ook daar hebben ze een vrijstelling. Wat heel belangrijk
  is \u2026 De tijd gaat snel. Ik heb begrepen dat al die fiscale antwoorden op muziek
  mochten gezet worden. Wat niet onbelangrijk is, is dat die buitenlandse student,
  als die vertrekt, dat die zich ook zeker correct laat uitschrijven. Het zou kunnen,
  als dat niet gebeurt, dat een dossier bij een gerechtsdeurwaarder raakt. Maar ook
  die zal dan oordelen, en dan komt uw vraag, terecht, of de opbrengst niet kleiner
  is dan de meerkost. We zijn ook niet helemaal gek om daar veel geld in te steken,
  om die centjes te gaan halen. Maar het is eigenlijk aan de gerechtsdeurwaarder die
  die rekening maakt. Wij zelf niet. Uw vraag was of wij dat aanklampend doen. Wij
  weten natuurlijk niet, in omgekeerde volgorde, of het allemaal studenten zijn die
  inderdaad maar drie maand en \u00e9\u00e9n dag verblijven, dan wel nog langer. Dat
  is altijd dat dat op 1/1 geteld wordt. Daar hebben wij geen zicht op. Ik zou dus
  moeten antwoorden: helaas. Of wij kunnen dat technisch niet meer of niet langer
  opvragen en uitfilteren. Wij mogen dat niet. En ik denk dat daar op een bepaald
  moment het gezond verstand zal spelen op momenten dat er inderdaad een student terug
  naar het buitenland is. Dan gaan we daar geen kosten op het sterfhuis maken.\\n\\nVOORZITTER.-
  Dank u wel, gedeputeerde De Haes. Ik kijk eventjes. Mevrouw Verhaert heeft het woord.\\n\\nMevrouw
  VERHAERT.- Ja, voor alle duidelijkheid, mijn punt was niet zozeer het feit dat er
  wordt belast, dat snap ik. Het is alleen een beetje te betreuren dat wat vroeger
  gangbare praktijk was, dat dat nu niet langer kan. Ik denk dat we dat pas na de
  inning van deze ronde gaan weten vanuit hogere onderwijsinstellingen of zij heel
  veel bevraagd gaan worden of niet. En dan zullen zij dat moeten laten weten of dat
  echt een grote administratieve overlast wordt of niet. En als dat het geval is,
  dan denk ik dat er toch eens moet nagedacht worden om dat op \u00e9\u00e9n of andere
  pragmatische wijze op te lossen. Want dat is een beetje te gek h\u00e8, dat daar
  heel veel tijd en geld in gestoken wordt.\\n\\nDe heer DE HAES, gedeputeerde.- Ik
  volg u, maar wat de praktijk vroeger was is dat er inderdaad vanuit de universiteit
  lijsten werden doorgegeven, en dat die dan werden afgevinkt. Maar op dit moment
  zitten we op heel glad GDPR-ijs als we lijsten zouden doorkrijgen van de universiteit.\\n\\nIk
  stel ook voor dat we dat inderdaad aan de universiteit eens zullen vragen, in welke
  mate zij daar veel problemen \u2026 of feedback krijgen van veel problemen.\\n\\nMevrouw
  TALHAOUI.- Ik wou gewoon aan gedeputeerde De Haes vragen, die verschillende studies
  waar hij naar heeft verwezen, zijn dat studies die door de provincie zijn uitgevoerd?
  En kunnen wij die op \u00e9\u00e9n of andere manier krijgen om eens te kijken wat
  daar allemaal in werd verteld?\\n\\nDe heer DE HAES, gedeputeerde.- Er zijn vragen
  gesteld omdat er vanuit, als ik me niet vergis, maar dan moet ik eerst naar Stefan
  kijken, er in Oost-Vlaanderen ook een debat liep tussen ondernemingen en de provinciebelastingen.
  Het is in het kader daarvan dat wij vragen gesteld hebben. Dat zijn dus geen feitelijke
  datastudies, dat zijn juridische adviezen, die we daar \u2026 waar men ons dat afraadt.
  Ik heb de neiging om dat te geloven, als de gerenommeerde juridische bureaus dat
  ons adviseren. Ik had het liever anders gedaan.\\n\\nMevrouw TALHAOUI.- Zijn die
  openbaar of \u2026?\\n\\nDe heer DE HAES, gedeputeerde.- Dat weet ik niet.\\n\\nVOORZITTER.-
  Mijnheer Anciaux heeft het woord.\\n\\nDe heer ANCIAUX.- Collega''s. Mijnheer De
  Haes, uw rekening klopt niet. U zegt 175.000 aan belastingplichtigen. En u schat
  ze op vijftig procent die maar tot vijftigduizend vierkante meter\\n\\nhebben. Dat
  wil zeggen, 78.500 belastingplichtigen. Maar dat zijn er natuurlijk die aan het
  laagste tarief. Want u pakt het gemiddelde, vijftig procent van uw opbrengst. Nee,
  u moet dan aan het laagste tarief, dus maal honderd zou acht miljoen 750 duizend
  zijn. Maar, het zijn er helemaal geen 87.500. Voka schat het in rond de 20 \u00e0
  25 duizend. Dat zou zeggen, creatief omspringen met 2,5 miljoen. En niet met 21
  miljoen. Die creativiteit, die hebt u wel. Op een budget van 205 miljoen, dat denk
  ik wel.\\n\\nVOORZITTER.- Gedeputeerde De Haes heeft het woord.\\n\\nDe heer DE
  HAES, gedeputeerde.- \u2026 narekenen.\\n\\nNr. 3/3 van de agenda\\n\\nAlgemene
  provinciebelasting. Reglement 2023. Goedkeuring.\\n\\nVerslag van de deputatie\\n\\n1.
  Bevoegdheid\\n\\nDe artikelen 41, 162 en 170 van de geco\u00f6rdineerde grondwet
  van 17 februari 1994 en de artikelen 42, 43 \u00a72, 15\u00b0, 144, 180 en 180bis
  van het provinciedecreet van 9 december 2005.\\n\\nArtikel 16 van de gewone wet
  van 9 augustus 1980, houdende de hervorming van de instellingen, gewijzigd bij de
  wet van 9 juli 1982.\\n\\n2. Juridische context\\n\\nDe wet van 19 juli 1991 betreffende
  de bevolkingsregisters, de identiteitskaarten, de vreemdelingenkaarten en de verblijfdocumenten.\\n\\nHet
  koninklijk besluit van 16 juli 1992 betreffende de bevolkingsregisters en het vreemdelingenregister.\\n\\nHet
  decreet van 30 mei 2008 betreffende de vestiging, de invordering en de geschillenprocedure
  van provincie- en gemeentebelastingen.\\n\\n3. Feitelijke context en verantwoording\\n\\nVoor
  het behoud van het evenwicht van het provinciaal budget wordt voor 2023 een algemene
  provinciebelasting ingevoerd.\\n\\nEen belasting is budgettair noodzakelijk met
  als doel de uitgaven van de provincie in het algemeen te dekken, zowel de verplichte
  als de facultatieve.\\n\\nDe belasting is eenvoudig te controleren en de heffing
  van de belasting kan op een effici\u00ebnte wijze geschieden met een hoge rentabiliteit
  gelet op de geringe administratieve kosten verbonden aan de vestiging en de invordering.\\n\\nDe
  belasting beoogt een bijdrage van burgers in de algemene bestuurlijke uitgaven van
  de provincie gelet op het feit dat burgers op democratische wijze kunnen gebruik
  maken van de provinciale dienstverlening en infrastructuur.\\n\\nHet weerhouden
  van diverse categorie\u00ebn zou de effici\u00ebntie en effectiviteit van de vestiging
  van de belasting nadelig be\u00efnvloeden, gelet op de noodzaak van controle en
  opvolging.\\n\\nDe belasting is van die aard dat zij binnen de draagkracht ligt
  van elke belastingplichtige.\\n\\nHet belastingtarief wordt jaarlijks aangepast
  aan de indexevolutie. Het tarief voor 2023 bedraagt 43 EUR, de voorgaande jaren
  bedroeg het tarief 40 EUR (2022), 40 EUR (2021), 39 EUR (2020), 38 EUR (2019), 38
  EUR (2018), 37 EUR (2017), 36 EUR (2016), 36 EUR (2015), etc.\\n\\nEen algemene
  en evenwichtige spreiding van de belastingdruk wordt nagestreefd waarbij extra aandacht
  wordt geschonken aan de zwakste categorie\u00ebn in de maatschappij.\\n\\nEen belastingvrijstelling
  voor de gezinnen die genieten van verhoogde verzekeringstegemoetkoming in de gezondheidszorg
  alsook voor de gezinnen die genieten van het recht op maatschappelijke integratie,
  wordt verantwoord door het feit dat deze reeds een tegemoetkoming genieten op basis
  van een onderzoek dat werd uitgevoerd door de daartoe wettelijk bevoegde instanties.
  Hetzelfde geldt voor gezinnen die recht op maatschappelijke dienstverlening of recht
  op materi\u00eble hulp genieten.\\n\\nHet is eveneens verantwoord om een belastingvrijstelling
  in te voeren voor de gezinnen die, als gevolg van het koninklijk besluit van 16
  juli 1992 betreffende de bevolkingsregisters, op 1 januari van het aanslagjaar,
  enkel een verplicht referentieadres zonder feitelijke vestiging op het provinciaal
  grondgebied hebben en daardoor praktisch geen gebruik kunnen maken van de provinciale
  dienstverlening.\\n\\nXXX\\n\\nBijdragen aan de Duurzame Ontwikkelingsdoelstellingen
  (SDG''s)\\n\\nSDG 16 Vrede, veiligheid en sterke publieke diensten\\n\\nSDG-subdoelstelling
  16.3 De rechtsregels bevorderen op nationaal en internationaal niveau en gelijke
  toegang tot het rechtssysteem voor iedereen garanderen.\\n\\nSDG 10 Ongelijkheid
  verminderen\\n\\nSDG-subdoelstelling 10.4 Beleid voeren dat geleidelijk tot een
  grotere gelijkheid leidt, in het bijzonder inzake fiscaliteit, lonen en sociale
  bescherming.\\n\\nSDG 13 Klimaatactie\\n\\nSDG-subdoelstelling 13.2 Maatregelen
  inzake klimaatverandering integreren in nationale beleidslijnen, strategie\u00ebn
  en planning.\\n\\n4. Procedurele vormvereisten\\n\\nDe deputatie keurde dit verslag
  goed in zitting van 10 november 2022.\\n\\nBESLUIT:\\n\\nArtikel 1:\\n\\nVoor het
  aanslagjaar 2023 wordt door de provincie Antwerpen een algemene provinciebelasting
  geheven. De belasting wordt gevorderd van elk gezin dat op het grondgebied van de
  provincie Antwerpen een hoofdverblijf ter beschikking heeft op 1 januari 2023.\\n\\nArtikel
  2:\\n\\nAls \\\"gezin\\\" wordt beschouwd voor de toepassing van onderhavige belasting:
  hetzij een persoon die alleen leeft, hetzij twee of meer personen die, al dan niet
  verwant, gewoonlijk in \u00e9\u00e9n en dezelfde woning of woongelegenheid verblijven
  en er samenwonen.\\n\\nDe belasting wordt gevestigd op naam van de referentiepersoon
  van het gezin.\\n\\nArtikel 3:\\n\\nHet bedrag wordt bepaald op 43 EUR. De belasting
  is ondeelbaar verschuldigd voor het aanslagjaar. De toestand op 1 januari van het
  aanslagjaar is bepalend voor de belastingplicht.\\n\\nDe inschrijving in het bevolkingsbestand
  van de gemeente waar het gezin staat ingeschreven, bepaalt de toestand op 1 januari
  van het aanslagjaar van de hoofdverblijfplaats, de referentiepersoon en de samenstelling
  van het gezin.\\n\\nEen wijziging van de hoofdverblijfplaats, de referentiepersoon
  en/of de samenstelling van het gezin in de loop van het aanslagjaar, heeft geen
  invloed op de belastingplicht en geeft geen aanleiding tot enige belastingvermindering
  of teruggave.\\n\\nArtikel 4:\\n\\nHet gezin geniet een belastingvrijstelling als
  het gezin het bewijs levert dat de referentiepersoon van het gezin op 1 januari
  van het aanslagjaar:\\n\\n1\u00b0 hetzij geniet van het recht op verhoogde verzekeringstegemoetkoming
  op basis van de geco\u00f6rdineerde wet van 14 juli 1994 betreffende de verplichte
  verzekering voor geneeskundige verzorging en uitkeringen;\\n2\u00b0 hetzij enkel
  een referentieadres op het provinciegrondgebied heeft op basis van het koninklijk
  besluit van 16 juli 1992 betreffende de bevolkingsregisters en het vreemdelingenregister;\\n3\u00b0
  hetzij geniet van het recht op maatschappelijke integratie op basis van de wet van
  26 mei 2002 betreffende het recht op maatschappelijke integratie;\\n4\u00b0 hetzij
  geniet van het recht op maatschappelijke dienstverlening op basis van de wet van
  8 juli 1976 betreffende de openbare centra voor maatschappelijk welzijn;\\n5\u00b0
  hetzij geniet van het recht op materi\u00eble hulp op basis van de wet van 12 januari
  2007 betreffende de opvang van asielzoekers en van bepaalde andere categorie\u00ebn
  van vreemdelingen.\\n\\nVoor zover de belastingvrijstelling niet automatisch werd
  toegekend, wordt de belastingvrijstelling slechts verleend, voor zover daartoe een
  schriftelijke aanvraag toekomt bij de dienst fiscaliteit van de provincie Antwerpen,
  op het adres Koningin Elisabethlei 22, B-2018 Antwerpen of per e-mail op het e-mailadres
  email@example.com en dit, op straffe van verval, binnen de drie maanden, te rekenen
  vanaf de derde werkdag volgend op de datum van verzending van het aanslagbiljet
  of vanaf de kennisgeving van de aanslag.\\n\\nOp het moment dat een aanvraag tot
  vrijstelling wordt ingediend, moet bij deze aanvraag een attest vanwege het ziekenfonds,
  een attest vanwege de stad/ gemeente, een attest vanwege het OCMW of een attest
  vanwege het Federaal Agentschap voor de Opvang van Asielzoekers of vanwege diens
  partner binnen een opvangstructuur, op naam van de referentiepersoon worden gevoegd.\\n\\nDit
  attest moet bewijzen dat het recht op verhoogde verzekeringstegemoetkoming respectievelijk
  het hebben van enkel een referentieadres binnen de provincie dan wel het recht op
  maatschappelijke integratie, het recht op maatschappelijke dienstverlening of het
  recht op materi\u00eble hulp gold op 1 januari van het aanslagjaar. Een aanvraag
  tot vrijstelling mag gebeuren door (een kopie van) het ontvangen aanslagbiljet samen
  met een dergelijk attest terug in te dienen bij de dienst fiscaliteit van de provincie
  Antwerpen.\\n\\nArtikel 5:\\n\\nDe aanslagbiljetten worden onder gesloten omslag
  aan de belastingschuldigen verzonden. Wanneer de persoon op wiens naam de aanslag
  inzake algemene provinciebelasting wordt gevestigd, echter instemde met de elektronische
  uitwisseling door het activeren van de eBox van de Federale Overheid (ingesteld
  door de wet van 27 februari 2019 inzake de elektronische uitwisseling van berichten
  via de eBox), wordt elk aanslagbiljet inzake de algemene provinciebelasting elektronisch
  aan deze persoon aangeboden. Een aanslagbiljet\\n\\ninzake de algemene provinciebelasting
  wordt op geen enkele andere wijze elektronisch aangeboden dan via de eBox. De aanbieding
  van een aanslagbiljet via de eBox geldt als rechtsgeldige kennisgeving van dit aanslagbiljet
  en brengt dezelfde rechtsgevolgen tot stand als de verzending ervan in gesloten
  omslag.\\n\\nDe elektronische aanbieding van elk aanslagbiljet inzake de algemene
  provinciebelasting wordt be\u00ebindigd wanneer de in het tweede lid vermelde persoon
  (i) overlijdt, of (ii) de instemming met de elektronische uitwisseling via de eBox
  intrekt door het deactiveren van de eBox. Vanaf de be\u00ebindiging wordt een eerstvolgend
  aanslagbiljet in gesloten omslag toegezonden.\\n\\nArtikel 6:\\n\\nEen bezwaar moet
  schriftelijk worden ingediend bij de deputatie van de provincie Antwerpen, Belastingbezwaren,
  Koningin Elisabethlei 22, B-2018 Antwerpen, ondertekend en gemotiveerd zijn.\\n\\nDe
  termijn om op straffe van verval een bezwaarschrift in te dienen, bedraagt drie
  maanden te rekenen vanaf de derde werkdag volgend op de datum van verzending van
  het aanslagbiljet of vanaf de kennisgeving van de aanslag.\\n\\nEen bezwaar mag
  ook worden ingediend per e-mail. Het bezwaarschrift dient op het e-mailadres firstname.lastname@example.org
  toe te komen, binnen de termijn in het tweede lid bepaald.\\n\\nAls de belastingschuldige
  of zijn vertegenwoordiger het vraagt in het bezwaarschrift, wordt de belastingschuldige
  of zijn vertegenwoordiger uitgenodigd op een hoorzitting.\\n\\nDe gegevens van elk
  bezwaar die door het provinciebestuur fotografisch, optisch, elektronisch of volgens
  elke andere informatica- of telegeleidingstechniek worden geregistreerd, bewaard
  of weergegeven, evenals hun weergave op een leesbare drager, hebben bewijskracht
  voor de toepassing van de belasting.\\n\\nVOORZITTER.- Geen vragen meer?\\n\\nDe
  stemming kan starten.\\n\\nHeeft iedereen zijn stem uitgebracht? Einde van de stemming.\\n\\n34
  leden hebben deelgenomen aan de stemming;\\n\\n19 leden hebben ja gestemd;\\n\\n3
  leden hebben nee gestemd;\\n\\n12 leden hebben zich onthouden.\\n\\nGoedgekeurd
  met 19 stemmen ja, bij 3 stemmen nee en bij 12 onthoudingen.\\n\\nNr. 3/4 van de
  agenda\\n\\nProvinciale opcentiemen op de onroerende voorheffing. Reglement 2023.
  Goedkeuring.\\n\\nVerslag van de deputatie\\n\\n1. Bevoegdheid\\n\\nDe artikelen
  41, 162 en 170 van de geco\u00f6rdineerde grondwet van 17 februari 1994 en de artikelen
  42, 43 \u00a72, 15\u00b0, 144 en 180 en 180bis van het provinciedecreet van 9 december
  2005.\\n\\nArtikel 16 van de gewone wet van 9 augustus 1980, houdende de hervorming
  van de instellingen, gewijzigd bij de wet van 9 juli 1982.\\n\\nArtikel 464/1,1\u00b0
  van het wetboek van de inkomstenbelastingen 1992.\\n\\nHet decreet van 18 november
  2016 houdende de vernieuwde taakstelling en gewijzigde financiering van de provincies.\\n\\nArtikel
  220.127.116.11.2 van het decreet van 13 december 2003 houdende de Vlaamse Codex
  Fiscaliteit.\\n\\n2. Feitelijke context en verantwoording\\n\\nOm het evenwicht
  van het provinciaal budget te handhaven is het noodzakelijk om provinciale opcentiemen
  op de onroerende voorheffing te heffen voor het aanslagjaar 2023.\\n\\nHet aantal
  opcentiemen op de onroerende voorheffing blijft ongewijzigd.\\n\\nXXX\\n\\nBijdragen
  aan de Duurzame Ontwikkelingsdoelstellingen (SDG''s)\\n\\nSDG 16 Vrede, veiligheid
  en sterke publieke diensten\\n\\nSDG-subdoelstelling 16.3 De rechtsregels bevorderen
  op nationaal en internationaal niveau en gelijke toegang tot het rechtssysteem voor
  iedereen garanderen\\n\\nSDG 10 Ongelijkheid verminderen\\n\\nSDG-subdoelstelling
  10.4 Beleid voeren dat geleidelijk tot een grotere gelijkheid leidt, in het bijzonder
  inzake fiscaliteit, lonen en sociale bescherming.\\n\\n3. Procedurele vormvereisten\\n\\nDe
  deputatie keurde dit verslag goed in zitting van 10 november 2022.\\n\\nBESLUIT:\\n\\nEnig
  artikel:\\n\\nVoor het aanslagjaar 2023 worden ten behoeve van de provincie Antwerpen
  honderd vijfenveertig komma drie\u00ebndertig (145,33) opcentiemen op de onroerende
  voorheffing geheven.\\n\\nVOORZITTER.- Geen vragen?\\n\\nDe stemming kan starten.\\n\\nHeeft
  iedereen zijn stem uitgebracht? Einde van de stemming.\\n\\n34 leden hebben deelgenomen
  aan de stemming;\\n\\n19 leden hebben ja gestemd;\\n3 leden hebben nee gestemd;\\n12
  leden hebben zich onthouden.\\n\\nGoedgekeurd met 19 stemmen ja, bij 3 stemmen nee
  en bij 12 onthoudingen.\\n\\nNr. 3/7 van de agenda\\n\\nAmendement op agendapunt
  3.5 algemene provinciebelasting op bedrijfsvestigingen, reglement 2023, ingediend
  door de heer Koen Anciaux.\\n\\nVerslag\\n\\nAgenda nr. 3/5 Algemene provinciebelasting
  op bedrijfsvestigingen. Reglement 2023.\\n\\nAmendement Open vld \u2013 Koenraad
  Anciaux\\n\\nAan de provincieraad wordt voorgesteld om het ontwerpreglement aan
  te passen bij art. 5 en een vrijstelling van belasting te geven voor bedrijven met
  een oppervlakte tussen 0 en 50m\u00b2.\\n\\nNieuw artikel 5:\\n\\nHet bedrag van
  de verschuldigde belasting wordt als volgt bepaald:\\n\\n0 EUR per vestiging met
  een oppervlakte van 0 m\u00b2 tot 50 m\u00b2; 109 EUR per vestiging met een oppervlakte
  meer dan 50 m\u00b2 tot 1.000 m\u00b2 (10 are);\\n\\n466 EUR per vestiging met een
  oppervlakte van meer dan 1.000 m\u00b2 (10 are) tot 5.000 m\u00b2 (50 are);\\n1.164
  EUR per vestiging met een oppervlakte van meer dan 5.000 m\u00b2 (50 are) tot 10.000
  m\u00b2 (1 ha);\\n3.488 EUR per vestiging met een oppervlakte van meer dan 10.000
  m\u00b2 (1 ha) tot 50.000 m\u00b2 (5 ha);\\n11.626 EUR per vestiging met een oppervlakte
  van meer dan 50.000 m\u00b2 (5 ha) tot 100.000 m\u00b2 (10 ha);\\n23.254 EUR per
  vestiging met een oppervlakte van meer dan 100.000 m\u00b2 (10 ha) tot 200.000 m\u00b2
  (20 ha).\\n\\nDe fractie van 1 m\u00b2 wordt als 1 m\u00b2 beschouwd.\\n\\nVestigingen
  met een oppervlakte van meer dan 200.000 m\u00b2 (20 ha) worden belast op basis
  van 23.254 EUR voor de eerste 200.000 m\u00b2 (20 ha), verhoogd met 10 EUR per 100
  m\u00b2 (1 are) of gedeelte van 100 m\u00b2 (1 are) voor de schijf van de oppervlakte
  boven de 200.000 m\u00b2 (20 ha).\\n\\nVOORZITTER.- Geen vragen?\\n\\nDe stemming
  kan starten.\\n\\nHeeft iedereen zijn stem uitgebracht? Einde van de stemming.\\n\\n34
  leden hebben deelgenomen aan de stemming;\\n\\n7 leden hebben ja gestemd;\\n\\n19
  leden hebben nee gestemd;\\n\\n8 leden hebben zich onthouden.\\n\\nAfgekeurd met
  7 stemmen ja, bij 19 stemmen nee en bij 8 onthoudingen.\\n\\nNr. 3/5 van de agenda\\n\\nAlgemene
  provinciebelasting op bedrijfsvestigingen. Reglement 2023. Goedkeuring.\\n\\nVerslag
  van de deputatie\\n\\n1. Bevoegdheid\\n\\nArtikelen 41, 162 en 170 van de geco\u00f6rdineerde
  grondwet van 17 februari 1994 en de artikelen 42, 43 \u00a72, 15\u00b0, 144 en 180
  en 180bis van het provinciedecreet van 9 december 2005;\\n\\nArtikel 16 van de gewone
  wet van 9 augustus 1980, houdende de hervorming van de instellingen, gewijzigd bij
  de wet van 9 juli 1982.\\n\\n2. Juridische context\\n\\nHet decreet van 30 mei 2008
  betreffende de vestiging, de invordering en de geschillenprocedure van provincie-
  en gemeentebelastingen.\\n\\n3. Feitelijke context en verantwoording\\n\\nVoor het
  behoud van het evenwicht van het provinciaal budget wordt voor 2023 een algemene
  provinciebelasting op bedrijfsvestigingen ingevoerd.\\n\\nEen belasting is budgettair
  noodzakelijk met als doel de uitgaven van de provincie te dekken, zowel de verplichte
  als de facultatieve.\\n\\nDe provincie streeft, naast het fiscale doel, met dit
  reglement een belasting na met de volgende kenmerken:\\n\\nI. een eenvoudige belasting
  waarvan de heffing effici\u00ebnt en rendabel is;\\nII. een algemene en evenwichtige
  spreiding van de belastingdruk over de meer dan honderdzeventigduizend belastingplichtigen;\\nIII.
  een belasting die eenvoudig te controleren is;\\nIV. een belasting waarbij de administratieve
  verplichtingen tot het absolute minimum worden beperkt met vanzelfsprekend de inachtneming
  van de vigerende regelgeving, en waarbij de klantgerichte dossierbehandeling, gekoppeld
  aan de gelijke behandeling van alle belastingplichtigen, als speciaal aandachtspunt
  geldt.\\n\\nHet belastbaar feit bestaat uit elke vestiging die op het grondgebied
  van de provincie Antwerpen is gelegen en die door het bedrijf wordt gebruikt of
  tot gebruik wordt voorbehouden.\\n\\nDe belasting is gebaseerd op een eenvoudig
  meetbare belastbare grondslag, namelijk de oppervlakte die bedrijven (natuurlijke
  personen met een zelfstandige beroepswerkzaamheid en rechtspersonen met winstoogmerk)
  gebruiken of ter beschikking hebben.\\n\\nHet oppervlaktecriterium wordt als redelijk
  en objectief beschouwd teneinde de algemene provinciebelasting op bedrijfsvestigingen
  te berekenen.\\n\\nDe belasting beoogt een diversiteit aan belastingplichtigen waarvan
  de verscheidenheid redelijkerwijze dient te worden opgevangen in vereenvoudigde
  categorie\u00ebn. De normen van een belasting kunnen niet worden aangepast naargelang
  de eigenheid van elk individueel geval. Er kan niet voor elk soort bedrijf met de
  eigen en meest uiteenlopende kenmerken worden voorzien in een specifieke belastingregeling.\\n\\nHet
  heffen van minimumbelastingen is gerechtvaardigd doordat mag aangenomen worden dat
  de voorziene minimumbedragen van die aard zijn dat ze binnen ieders draagkracht
  liggen.\\n\\nDe belastingtarieven worden jaarlijks aangepast aan de indexevolutie.
  Zo bedraagt de minimumbelasting voor 2023 109 EUR, de voorgaande jaren bedroeg dit
  tarief 102 EUR (2022), 101 EUR (2021), 100 EUR (2020), 98 EUR (2019), 96 EUR (2018),
  94 EUR (2017), 92 EUR (2016), 93 EUR (2015), 92 EUR (2014), etc.\\n\\nOp deze manier
  wordt aldus op een evenwichtige manier bijgedragen tot de financiering van het provinciaal
  beleid.\\n\\nCategorie\u00ebn van bedrijven die door hun aard de grond (bodem) als
  natuurlijk productiemiddel of voor specifieke openlucht recreatieve beroeps- of
  bedrijfsdoeleinden aanwenden en die in vergelijking met andere categorie\u00ebn
  een lager rendement genereren per m\u00b2 oppervlakte, hebben een uitzonderlijke
  nood aan grotere oppervlakten om een economisch leefbare (rendabele) exploitatie
  te kunnen realiseren. Een aangepaste tariefstructuur komt dan ook tegemoet aan de
  doelstelling van een evenwichtige spreiding van de belastingdruk.\\n\\nXXX\\n\\nBijdragen
  aan de Duurzame Ontwikkelingsdoelstellingen (SDG''s)\\n\\nSDG 16 Vrede, veiligheid
  en sterke publieke diensten\\n\\nSDG-subdoelstelling 16.3 De rechtsregels bevorderen
  op nationaal en internationaal niveau en gelijke toegang tot het rechtssysteem voor
  iedereen garanderen\\n\\nSDG 10 Ongelijkheid verminderen\\n\\nSDG-subdoelstelling
  10.4 Beleid voeren dat geleidelijk tot een grotere gelijkheid leidt, in het bijzonder
  inzake fiscaliteit, lonen en sociale bescherming\\n\\nSDG 13 Klimaatactie\\n\\nSDG-subdoelstelling
  13.2 Maatregelen inzake klimaatverandering integreren in nationale beleidslijnen,
  strategie\u00ebn en planning.\\n\\nBESLUIT:\\n\\nArtikel 1:\\n\\nVoor het aanslagjaar
  2023 wordt door de provincie Antwerpen een algemene provinciebelasting op bedrijfsvestigingen
  geheven.\\n\\nDe belasting wordt gevorderd van:\\n\\nA. elke natuurlijke persoon
  die in hoofd- of bijberoep een zelfstandige beroepswerkzaamheid uitoefent of die
  een of meerdere daden heeft gesteld die de uitoefening van een zelfstandige beroepswerkzaamheid
  toelaten, kunnen toelaten of doen vermoeden  en die op 1 januari 2023, op het grondgebied
  van de provincie Antwerpen, een of meerdere vestigingen heeft, gebruikt voor de
  uitoefening van de zelfstandige beroepswerkzaamheid of voorbehouden tot het gebruik
  voor de (mogelijke) uitoefening van de (een) zelfstandige beroepswerkzaamheid;\\n\\nDe
  natuurlijke persoon die uit hoofde van zijn zelfstandige beroepswerkzaamheid uitsluitend
  optreedt als werkend vennoot of als bestuurder in een overeenkomstig de algemene
  provinciebelasting op bedrijfsvestigingen belastbare vennootschap wordt niet als
  belastingplichtig beschouwd in de zin van art. 1, A, eerste lid van dit reglement.\\n\\nB.
  elke rechtspersoon naar Belgisch of buitenlands recht onderworpen aan de vennootschapsbelasting,
  inclusief de rechtspersoon die in vereffening is gesteld, en die op 1 januari 2023
  op het grondgebied van de provincie Antwerpen een of meerdere vestigingen heeft,
  door voornoemde rechtspersoon gebruikt of tot zijn gebruik voorbehouden;\\n\\nDe
  rechtspersonen vermeld in de artikelen 180 tot en met 182 van het wetboek van de
  inkomstenbelastingen 1992 zijn niet belastingplichtig in de zin van art. 1, B, eerste
  lid van dit reglement.\\n\\nC. elke rechtspersoon naar Belgisch of buitenlands recht
  die een winstoogmerk heeft, maar niet onderworpen is aan de vennootschapsbelasting,
  inclusief de rechtspersoon die in vereffening is gesteld, en die op 1 januari 2023
  op het grondgebied van de provincie Antwerpen een of meerdere vestigingen heeft,
  door voornoemde rechtspersoon gebruikt of tot zijn gebruik voorbehouden;\\n\\nDe
  rechtspersonen vermeld in de artikelen 180 tot en met 182 van het wetboek van de
  inkomstenbelastingen 1992 zijn niet belastingplichtig in de zin van art. 1, C, eerste
  lid van dit reglement.\\n\\nArtikel 2:\\n\\nElke belastingplichtige is de belasting
  verschuldigd per afzonderlijke vestiging hoe ook genoemd, die door hem/haar wordt
  gebruikt of tot gebruik wordt voorbehouden en op het grondgebied van de provincie
  Antwerpen is gelegen.\\n\\nElke belastingplichtige, vermeld in artikel 1, wordt
  geacht over een belastbare vestiging te beschikken, waarvoor minstens de minimumbelasting
  verschuldigd is.\\n\\nEen belastbare vestiging is elke oppervlakte die voor beroeps-
  of bedrijfsdoeleinden is bestemd of in het kader van beroeps- of bedrijfsdoeleinden
  wordt gebruikt, tot gebruik is voorbehouden of bijdraagt tot de realisatie/uitvoering
  van de beroeps- of bedrijfsdoeleinden.\\n\\nOnder een oppervlakte wordt het volgende
  verstaan: elk (gedeelte van een) onroerend goed, elke lokaliteit of ruimte onder
  gelijk welke vorm en die individueel of collectief wordt gebruikt of kan gebruikt
  worden, met inbegrip van de plaats of het adres waarop een maatschappelijke of administratieve
  zetel gevestigd is.\\n\\nOnder \\\"gebruik\\\" moet elke vorm van gebruik worden
  verstaan, met inbegrip van onder meer het gebruik als (toegangs)weg, parking, plantsoen,
  grasstrook, groenzone, vijver, sportterrein, laad-, los- of stortplaats, opslag-
  of overslagruimte, bufferzone, weiland, conci\u00ebrgewoning.\\n\\nOm belastbaar
  te zijn, volstaat het dat een oppervlakte eventueel (nog) kan gebruikt worden, ook
  al wordt deze oppervlakte op 1 januari van het aanslagjaar niet effectief gebruikt
  (vb. braakliggende of woeste gronden, improductieve oppervlakte, oppervlakte zonder
  economisch rendabel nut of gebruik).\\n\\nAan elkaar grenzende oppervlakten worden
  als \u00e9\u00e9n vestiging beschouwd, op voorwaarde dat deze oppervlakten niet
  van elkaar gescheiden zijn door een openbare weg of een openbare waterloop. Twee
  of meer oppervlakten met elkaar verbonden door het bestaan van een wettelijk toegekende
  wegvergunning, worden beschouwd als \u00e9\u00e9n enkele vestiging.\\n\\nMet wegvergunning
  wordt bedoeld: een vaste en duurzame constructie onder, op of boven de openbare
  weg en/of openbare waterloop (bv. tunnel, overbrugging).\\n\\nEen belastingplichtige
  van wie de beroeps- of bedrijfsdoeleinden uitsluitend een ambulant karakter hebben,
  heeft een belastbare vestiging op het adres van zijn/haar in de provincie Antwerpen
  gelegen verblijfplaats (waar in het kader van de beroeps- of bedrijfsdoeleinden
  de opslag van goederen of materiaal, de voorbereiding, de planning, de organisatie,
  de administratieve ondersteuning of het beheer in de ruimste zin gebeuren of kunnen
  gebeuren).\\n\\nArtikel 3:\\n\\nDe belasting wordt vastgesteld rekening houdend
  met de totale belastbare gebouwde en/of ongebouwde oppervlakte van het goed waarop
  de vestiging zich bevindt.\\n\\nVoor de vaststelling van de belastbare gebouwde
  oppervlakte van het goed waarop de vestiging zich bevindt, wordt in voorkomend geval
  de oppervlakte gemeten van\\n\\nelke ondergrondse en bovengrondse bouwlaag met inbegrip
  van de buitenmuren, evenals van het gebruikte of tot gebruik aan te wenden dak,
  doch met uitsluiting van het gedeelte dat uitsluitend als woongelegenheid van de
  belastingplichtige \u2013 natuurlijke persoon \u2013 wordt gebruikt.\\n\\nDe dakoppervlakte
  is niet belastbaar onder de volgende voorwaarden die gelijktijdig dienen  vervuld
  te zijn: het dak is niet bereikbaar voor externen \u00e9n de belastingplichtige
  heeft op dezelfde vestiging een oppervlakte ter beschikking voor minstens de dakoppervlakte.\\n\\nDe
  oppervlakte die gemeenschappelijk door meerdere belastingplichtigen gebruikt wordt
  of ter beschikking is, wordt in hoofde van iedere belastingplichtige belast pro
  rata van de door hem/haar exclusief gebruikte of ter beschikking zijnde gebouwde
  en ongebouwde oppervlakten.\\n\\nIndien de gemeenschappelijke oppervlakte eveneens
  gebruikt wordt door, of ter beschikking is van niet-belastingplichtigen, dan wordt
  bij de vaststelling van de belastbare oppervlakte het gedeelte van de gemeenschappelijke
  oppervlakte dat pro rata kan worden toegewezen aan niet-belastingplichtigen in mindering
  gebracht.\\n\\nArtikel 4:\\n\\n4.1. Elke belastingplichtige, vermeld in artikel
  1, moet per afzonderlijke vestiging aangifte doen. Het provinciebestuur van Antwerpen
  stelt aangifteformulieren ter beschikking.\\n\\nDe correct ingevulde, gedag- en
  gehandtekende aangiften moeten uiterlijk op 20 april 2023 toekomen bij het Provinciebestuur
  van Antwerpen, dienst fiscaliteit, Koningin Elisabethlei 22, B-2018 Antwerpen.\\n\\n4.2.
  Wanneer alle aangiftegegevens van een vestiging gekend zijn door de dienst fiscaliteit
  van de provincie Antwerpen, kan aan de belastingplichtige daarvoor een voorstel
  van aangifte worden bezorgd, waarop de aangiftegegevens reeds staan ingevuld.\\n4.3.
  Een belastingplichtige is vrijgesteld van de in 4.1. voorgeschreven aangifteplicht
  op voorwaarde dat hij/zij een voorstel van aangifte ontving.\\n4.4. De vrijstelling,
  vermeld onder 4.3., geldt slechts indien de voorgedrukte gegevens op het voorstel
  van aangifte overeenstemmen met de werkelijkheid. Indien de belastingplichtige vaststelt
  dat de voorgedrukte gegevens onjuist en/of onvolledig zijn, moet hij/zij het voorstel
  van aangifte verbeterd terugzenden. De terugzending moet tijdig gebeuren zoals beschreven
  in 4.1.\\n\\nHet teruggezonden voorstel van aangifte moet duidelijk en volledig
  alle correcte gegevens vermelden en de nodige verbeteringen moeten worden aangebracht.\\n\\n4.5.
  Het is de belastingplichtige die moet bewijzen dat hij/zij het verbeterde voorstel
  van aangifte of de aangifte tijdig en correct indiende.\\n4.6. Voor elke vestiging
  waarvoor een belastingplichtige geen aangifteformulier of voorstel van aangifte
  heeft ontvangen is hij/zij verplicht, uiterlijk op 20 april 2023, aan de in 4.1.
  vermelde dienst de voor aanslag noodzakelijke gegevens ter beschikking te stellen,
  eventueel op het formulier dat daartoe op verzoek zal worden toegezonden.\\n4.7.
  Tevens moet de belastingplichtige, vermeld onder artikel 1, binnen de maand uit
  eigen beweging aangifte doen, vergezeld van de nodige bewijsstukken, bij de in 4.1.
  vermelde dienst van:\\n1. elke nieuwe of bijkomende vestiging in de provincie Antwerpen;\\n2.
  elke wijziging van de beschikbare oppervlakte, in principe dus elke verwerving of
  vervreemding van onroerend goed, elk begin of einde van huur, pacht, en elke andere
  wijze waardoor de beschikbare oppervlakte op het grondgebied van de provincie Antwerpen
  wijzigt;\\n3. elke verandering in de uitbating;\\n4. de definitieve stopzetting
  van de vennootschap of zelfstandige beroepsactiviteit in de provincie Antwerpen.\\n\\nArtikel
  5:\\n\\nHet bedrag van de verschuldigde belasting wordt als volgt bepaald:\\n\\n109
  EUR per vestiging met een oppervlakte tot 1.000 m\u00b2 (10 are);\\n\\n466 EUR per
  vestiging met een oppervlakte van meer dan 1.000 m\u00b2 (10 are) tot 5.000 m\u00b2
  (50 are);\\n1.164 EUR per vestiging met een oppervlakte van meer dan 5.000 m\u00b2
  (50 are) tot 10.000 m\u00b2 (1 ha);\\n3.488 EUR per vestiging met een oppervlakte
  van meer dan 10.000 m\u00b2 (1 ha) tot 50.000 m\u00b2 (5 ha);\\n11.626 EUR per vestiging
  met een oppervlakte van meer dan 50.000 m\u00b2 (5 ha) tot 100.000 m\u00b2 (10 ha);\\n23.254
  EUR per vestiging met een oppervlakte van meer dan 100.000 m\u00b2 (10 ha) tot 200.000
  m\u00b2 (20 ha).\\n\\nDe fractie van 1 m\u00b2 wordt als 1 m\u00b2 beschouwd.\\n\\nVestigingen
  met een oppervlakte van meer dan 200.000 m\u00b2 (20 ha) worden belast op basis
  van 23.254 EUR voor de eerste 200.000 m\u00b2 (20 ha), verhoogd met\\n\\n10 EUR
  per 100 m\u00b2 (1 are) of gedeelte van 100 m\u00b2 (1 are) voor de schijf van de
  oppervlakte boven de 200.000 m\u00b2 (20 ha).\\n\\nArtikel 6:\\n\\nIn afwijking
  van het bepaalde in artikel 5 gelden voor de agrarische bedrijven volgende heffingen:\\n\\nBasisbedrag:
  197 EUR, vermeerderd met:\\n\\n10 EUR per 10.000 m\u00b2 (1 ha) of gedeelte ervan
  boven 200.000 m\u00b2 (20 ha) landbouwoppervlakte;\\n38 EUR per 10.000 m\u00b2 (1
  ha) of gedeelte ervan boven 50.000 m\u00b2 (5 ha) tuinbouwoppervlakte in open lucht;\\n5
  EUR per 100 m\u00b2 (1 are) of gedeelte ervan boven 5.000 m\u00b2 (50 are) tuinbouwoppervlakte
  in serres.\\n\\nArtikel 7:\\n\\nVoor de toepassing van artikel 6 wordt het volgende
  verstaan onder:\\n\\n- agrarisch bedrijf: een bedrijf waarvan de hoofdwerkzaamheden
  bestaan uit landbouw en/of tuinbouw;\\n- landbouw- en/of tuinbouwoppervlakte: elke
  oppervlakte voor landbouw en/of tuinbouw;\\n- serre: elke duurzame constructie die
  gebruikt wordt of bestemd is voor de tuinbouwteelt.\\n\\nArtikel 8:\\n\\nVoor de
  begrippen van artikel 7 gelden volgende bepalingen:\\n\\n- landbouw: een zelfstandige
  beroeps- of bedrijfsactiviteit gericht op akkerbouw en/of weidebouw en/of bosbouw
  en/of veeteelt;\\n\\nVoor de hierboven vermelde begrippen gelden volgende bepalingen:\\n\\n-
  akkerbouw: een zelfstandige beroeps- of bedrijfsactiviteit gericht op het telen
  van granen, nijverheidsgewassen, voedergewassen, aardappelen, peulvruchten, pootgoed,
  landbouwzaden en/of aanverwante gewassen;\\n- weidebouw: een zelfstandige beroeps-
  of bedrijfsactiviteit gericht op het exploiteren van blijvend grasland;\\n- bosbouw:
  een zelfstandige beroeps- of bedrijfsactiviteit gericht op het aanleggen en exploiteren
  van bossen, met inbegrip van de bosboomkwekerij;\\n- veeteelt: een zelfstandige
  beroeps- of bedrijfsactiviteit gericht op:\\n* het houden van dieren voor de vlees-,
  melk- of eierproductie;\\n\\n* en/of het kweken/fokken van dieren voor:\\n* de vacht;\\n*
  het bekomen van jongen;\\n* het africhten en opleiden van jongen.\\n- tuinbouw:
  een zelfstandige beroeps- of bedrijfsactiviteit gericht op groenteteelt, fruitteelt,
  boomkwekerij andere dan bosboomkwekerij, sierteelt, kweek van tuinbouwzaden, plantgoed
  en/of aanverwante teelten.\\n\\nArtikel 9:\\n\\nIn afwijking van het bepaalde in
  artikel 5 gelden voor de openluchtrecreatieve bedrijven volgende heffingen:\\n\\n469
  EUR per vestiging met een oppervlakte tot 50.000 m\u00b2 (5 ha);\\n\\n1.173 EUR
  per vestiging met een oppervlakte van meer dan 50.000 m\u00b2 (5 ha) tot 100.000
  m\u00b2 (10 ha);\\n3.002 EUR per vestiging met een oppervlakte van meer dan 100.000
  m\u00b2 (10 ha) tot 200.000 m\u00b2 (20 ha).\\n\\nVestigingen met een oppervlakte
  van meer dan 200.000 m\u00b2 (20 ha) worden belast op basis van 3.002 EUR voor de
  eerste 200.000 m\u00b2 (20 ha), verhoogd met 47 EUR per 10.000 m\u00b2 (1 ha) of
  gedeelte van 10.000 m\u00b2 (1 ha) voor de schijf van de oppervlakte boven de 200.000
  m\u00b2 (20 ha).\\n\\nArtikel 10:\\n\\nVoor de toepassing van artikel 9 wordt het
  volgende verstaan onder:\\n\\n- openluchtrecreatief bedrijf: een bedrijf waarvan
  de hoofdwerkzaamheden bestaan uit het exploiteren van een terrein voor openluchtrecreatieve
  verblijven en/of het exploiteren van infrastructuur en/of installaties voor sportbeoefening
  in open lucht bestemd voor het gebruik door recreatieve en niet-recreatieve sportbeoefenaars.\\n\\nArtikel
  11:\\n\\nVoor de begrippen van artikel 10 gelden volgende bepalingen:\\n\\n- een
  terrein voor openluchtrecreatieve verblijven: een uitgerust en afgebakend terrein
  in centraal beheer waar op gekampeerd en/of verbleven wordt in openluchtrecreatieve
  verblijven \u2013 al dan niet verplaatsbaar - of dat daarvoor bestemd of ingericht
  is en niet ontworpen is om als vaste woonplaats te dienen; op het terrein is minstens
  \u00e9\u00e9n kampeerplaats voorbehouden voor toeristen op doorreis met een verplaatsbaar
  verblijf.\\n\\nArtikel 12:\\n\\nBelastingplichtigen die door de aard en voor de
  uitvoering van hun bedrijvigheid ook gronden gebruiken voor landbouw en/of tuinbouw
  en/of openluchtrecreatie zoals bedoeld in artikelen 7, 8, 10 en 11 worden - naast
  de reglementaire taxatie voor de andere belastbare oppervlakten - voor bedoelde
  gronden belast tegen het tarief voor agrarische bedrijven en/of openluchtrecreatieve
  bedrijven.\\n\\nArtikel 13:\\n\\nDe toestand op 1 januari van het aanslagjaar is
  bepalend voor de belastingplicht en de belasting is ondeelbaar verschuldigd voor
  het gehele jaar. Het feit dat in de loop van het aanslagjaar een natuurlijke persoon
  zijn/haar hoedanigheid van zelfstandige be\u00ebindigt, een vennootschap ophoudt
  te bestaan, de belastbare oppervlakte vermindert en/of een belastbare vestiging
  wordt gesloten of verlaten, geeft geen aanleiding tot enige belastingvermindering
  of teruggave.\\n\\nIndien bewezen wordt dat een natuurlijke persoon zijn/haar mogelijkheid
  tot uitoefening van een zelfstandige beroepswerkzaamheid uiterlijk op 1 januari
  van het aanslagjaar volledig en definitief be\u00ebindigde of indien bewezen wordt
  dat een vennootschap uiterlijk op 1 januari van het aanslagjaar volledig en definitief
  ophield te bestaan, gaat de hoedanigheid van belastingplichtige verloren. Bij een
  tijdelijke onderbreking van de werkzaamheden of bij een inactiviteit of zolang de
  vereffening van een vennootschap niet is afgesloten, blijft de hoedanigheid van
  belastingplichtige verder bestaan.\\n\\nArtikel 14:\\n\\nDe in artikel 4 bedoelde
  aangiften mogen worden ingediend door middel van procedures waarbij informatica-
  en telegeleidingstechnieken worden aangewend en die het behoud van de integriteit
  van de elektronische documenten waarborgen evenals de toerekening ervan aan de belastingplichtige.\\n\\nDe
  gegevens van elke aangifte die door het provinciebestuur fotografisch, optisch,
  elektronisch of volgens elke andere informatica- of telegeleidingstechniek worden
  geregistreerd, bewaard of weergegeven, evenals hun weergave op een leesbare drager,
  hebben bewijskracht voor de toepassing van de belasting.\\n\\nArtikel 15:\\n\\nBij
  gebrek aan aangifte binnen de in artikel 4 gestelde termijn, of in geval van onjuiste,
  onvolledige of onnauwkeurige aangifte, kan de belasting ambtshalve worden ingekohierd.\\n\\nDe
  ambtshalve inkohiering gebeurt met een verhoging, waarbij per vestiging het aangiftegedrag
  van de belastingplichtige voor dit en vorige belastingjaren in aanmerking wordt
  genomen:\\n\\n- 1e overtreding: 10 % verhoging;\\n\\n- 2e overtreding: 40 % verhoging;\\n\\n-
  3e overtreding: 70 % verhoging;\\n\\n- 4e overtreding: 100 % verhoging;\\n\\n- 5e
  en volgende overtredingen: 200 % verhoging.\\n\\nDeze verhogingen worden per vestiging
  toegepast, ongeacht of het om \u00e9\u00e9n of meer overtredingen per aanslagjaar
  gaat, en met dien verstande dat tijdige en correcte aangifte gedurende twee opeenvolgende
  jaren de goede trouw in hoofde van de belastingplichtige volledig herstelt, waardoor
  de aanslag bij de eerstvolgende overtreding met slechts 10 % wordt verhoogd.\\n\\nElke
  belastingverhoging bedraagt minimum 12 EUR. De belastingverhoging blijft echter
  beperkt tot 200 % van de verschuldigde belasting.\\n\\nDe gegevens van elk document
  dat verband houdt met een ambtshalve inkohiering die door het provinciebestuur fotografisch,
  optisch, elektronisch of volgens elke andere informatica- of telegeleidingstechniek
  worden geregistreerd, bewaard of weergegeven, evenals hun weergave op een leesbare
  drager, hebben bewijskracht voor de toepassing van de belasting.\\n\\nArtikel 16:\\n\\nDe
  aanslagbiljetten worden onverwijld verzonden.\\n\\nDe persoon op wiens naam de aanslag
  wordt gevestigd, kan, mits hij een uitdrukkelijke verklaring in die zin aflegt,
  er evenwel voor opteren om de aanslagbiljetten door middel van een procedure waarbij
  informaticatechnieken worden gebruikt, te ontvangen. In dit geval geldt de aanbieding
  via dergelijke procedure als rechtsgeldige kennisgeving van het aanslagbiljet.\\n\\nDe
  bezwaartermijn zoals uiteengezet in artikel 17, 2e lid vangt aan vanaf de datum
  waarop het aanslagbiljet door middel van een procedure waarbij informatietechnieken
  worden gebruikt, aan de belastingplichtige is aangeboden.\\n\\nArtikel 17:\\n\\nEen
  bezwaar moet schriftelijk worden ingediend bij de deputatie van de provincie Antwerpen,
  Belastingbezwaren, Koningin Elisabethlei 22, B-2018 Antwerpen, ondertekend en gemotiveerd
  zijn.\\n\\nDe termijn om op straffe van verval een bezwaarschrift in te dienen,
  bedraagt drie maanden te rekenen vanaf de derde werkdag volgend op de datum van
  verzending van het aanslagbiljet of vanaf de kennisgeving van de aanslag.\\n\\nEen
  bezwaar mag ook worden ingediend per e-mail. Het bezwaarschrift dient op het e-mailadres
  email@example.com toe te komen, binnen de termijn in het tweede lid bepaald.\\n\\nAls
  de belastingschuldige of zijn vertegenwoordiger het vraagt in het bezwaarschrift,
  wordt de belastingschuldige of zijn vertegenwoordiger uitgenodigd op een hoorzitting.\\n\\nDe
  gegevens van elk bezwaar die door het provinciebestuur fotografisch, optisch, elektronisch
  of volgens elke andere informatica- of telegeleidingstechniek worden geregistreerd,
  bewaard of weergegeven, evenals hun weergave op een leesbare drager, hebben bewijskracht
  voor de toepassing van de belasting.\\n\\nVOORZITTER.- Geen vragen?\\n\\nDe stemming
  kan starten.\\n\\nHeeft iedereen zijn stem uitgebracht? Einde van de stemming.\\n\\n34
  leden hebben deelgenomen aan de stemming;\\n\\n19 leden hebben ja gestemd;\\n\\n3
  leden hebben nee gestemd;\\n\\n12 leden hebben zich onthouden.\\n\\nGoedgekeurd
  met 19 stemmen ja, bij 3 stemmen nee en bij 12 onthoudingen.\\n\\n1. Ruimte, Onderwijs
  en Mobiliteit\\n\\nNr. 1/1 van de agenda\\n\\nUiteenzetting gedeputeerde Luk Lemmens.\\n\\nVOORZITTER.-
  Gedeputeerde Lemmens heeft het woord.\\n\\nTijdens de tussenkomst van gedeputeerde
  Lemmens worden begeleidende slides getoond.\\n\\nDe heer LEMMENS, gedeputeerde.-
  Mijnheer de voorzitter, mevrouw de ondervoorzitter, collega''s, mijnheer de griffier,
  mijnheer de financieel beheerder. Ik ga kort in op mijn bevoegdheden. Ik ga dat
  niet in detail doen. Ik zal een aantal zaken sneller gaan omdat we daar daarstraks
  ook al hebben over gesproken. In elk geval jullie spreken over het Departement Ruimte,
  Erfgoed en Mobiliteit, waar er een aantal speerpunten zijn, ge\u00efntegreerd en
  realisatiegericht ruimtelijk beleid, erfgoed, erediensten, heritage, duurzaam vervoer
  en bovenlokale mobiliteit.\\n\\nRuimtelijk beleid, dat is natuurlijk een belangrijk
  iets. Maar daar hebben we het in feite daarjuist toch al wat over gehad. We hebben
  dus de ontwerpvisie van het provinciaal beleidsplan Ruimte Antwerpen goedgekeurd.
  En we zullen in 2023 met het openbaar onderzoek naar buiten komen, om dan in 2023
  dus het te kunnen vaststellen hier in deze raad. Het is natuurlijk een belangrijke
  fase waar we ons in bevinden. En het beleidsplan aan het brede publiek voorleggen,
  met informatiesessies en inspraakvergaderingen, zal natuurlijk wel enorm veel tijd
  vergen van onze mensen. De Dienst Ruimtelijke Planning zal veel werk voor de boeg
  hebben, met niet alleen het ruimtelijk beleidsplan, maar ook het plan Mer en de
  screenings van de gemeentelijke, ruimtelijke structuurplannen. Dan komt natuurlijk
  het grote werk en dan kunnen we uiteindelijk kijken naar de vaststelling.\\n\\nEen
  effici\u00ebnt en kwaliteitsvol vergunningenbeleid, ons ruimtelijk beleid uitvoeren,
  is de omgevingsvergunning, dat is natuurlijk een belangrijk instrument daar in.
  We moeten blijven inzetten op een effici\u00ebnte en kwaliteitsvolle beoordeling
  van de omgevingsvergunning. Zo proberen we als provincie onze afstand tot de bedrijven
  en burgers zo klein mogelijk te houden. Terecht verwachten bedrijven en burgers
  dat we beschikken over de nodige expertise om een omgevingsvergunning te beoordelen.
  We blijven dan ook investeren in kwaliteitsvolle dossierbehandeling en in onze in
  huis-kennis en expertise zodat we steeds op de hoogte zijn van de laatste technische
  ontwikkelingen. Want de focus, dames en heren, dat weet u, van de provincie als
  vergunningverlenende overheid in eerste aanleg richt zich op de inrichtingen van
  klasse I. Dit gaat vaak over grote aanvragen, vragen over bedrijven in de haven
  naar grote landbouwbedrijven. En die hebben meestal een grote impact op onze economie,
  maar ook op hun omgeving. We hebben dan ook een dubbele taak. Zo is het onze taak
  als ondernemende provincie om maximaal in te zetten op de ondersteuning van onze
  lokale en bovenlokale economie. Tegelijk moeten we instaan voor een gezonde leefomgeving
  voor de inwoners van onze provincie, en natuurlijk telkens moeten we op zoek gaan
  naar een evenwicht tussen economie en ecologie om tot een kwaliteitsvol besluit
  te komen. Daarnaast zorgt natuurlijk de toename in complexiteit, in combinatie met
  waarschijnlijk een lichte stijging ervoor dat er meer aandacht moet besteed worden
  aan de behandeling van een individueel dossier. Tot op heden zijn er 476 omgevingsdossiers
  geregistreerd. Waarschijnlijk klokken we af, als alles nu verder gaat, op 520 dossiers
  ten opzichte van 509 omgevingsvergunningsdossiers vorig jaar.\\n\\nErfgoed - erediensten.
  Eerst en vooral, wat erfgoed en archeologie betreft, daar zetten we natuurlijk in
  op de Monumentenwacht. De Monumentenwacht van de provincie Antwerpen bestaat dertig
  jaar, en kreeg recent met het domein De Paey in Turnhout zijn drieduizendste object
  in portefeuille. Onze wachters zijn en blijven natuurlijk een belangrijke schakel
  in het buitenbeheer van het historisch patrimonium in onze provincie. Maar ook natuurlijk
  het\\n\\nProvinciaal Archeologisch Depot, en de Provinciale Archeologiedagen blijven
  ook in 2023 de uithangborden van onze archeologiewerking.\\n\\nDe erediensten en
  de vrijzinnigheid. Collega''s. Vandaag is de provincie bevoegd voor vier islamitische
  geloofsgemeenschappen en drie orthodoxe. Volgend jaar komen daar waarschijnlijk
  27 islamitische en vijf orthodoxe bij, als minister Somers hun aanvraag tot erkenning
  goedkeurt. We gaan dus mogelijk van zeven naar 39 erediensten, waarvan wij als provincie
  de tekorten zullen moeten bijpassen. Ik zeg mogelijk, omdat we als provincie naar
  het Grondwettelijk Hof zijn gestapt. Niet tegen het nieuwe eredienstendecreet an
  sich, want laat me duidelijk zijn, wij zijn niet tegen de erkenning van nieuwe geloofsgemeenschappen
  als zij de wettelijk voorziene procedure doorlopen hebben. Waar wij ons als provincie
  wel tegen verzetten, is de uitzonderingsmaatregel, waarmee men iedereen die in het
  verleden, voor 1 juli 2019, al eens een erkenningsaanvraag aandiende, nu binnen
  het jaar er door wil sluizen. Hiermee haalt Vlaanderen zijn eigen argument, dat
  er vier jaar nodig is voor een grondige screening, onderuit. En dan zwijg ik nog
  over de enorme financi\u00eble impact dat dit gaat hebben op onze begroting. In
  afwachting van het verdict houden we de meerjarenplanning aan en verhogen we dus
  niet. Anderzijds hopen we dat minister Van Quickenborne in 2023 meer duidelijkheid
  zal verschaffen over onze financi\u00eble verplichtingen jegens de vrijzinnigheid.
  De tijd dat wij blindelings X EUR belastinggeld storten zonder verantwoording, zonder
  transparantie, is wat ons betreft voorbij.\\n\\nHeritage. In de Onze-Lieve-Vrouwekathedraal
  in Antwerpen is de brandcentrale volledig vernieuwd en wordt in 2023 aan de restauratie
  van de klokken en de klokstoel gewerkt. In de Sint Romboutskathedraal in Mechelen
  werken we verder aan de interieurrestauratie en in het Aartsbisschoppelijk Paleis
  in Mechelen worden de gevels verder gerestaureerd. Sinds de inval van Rusland in
  Oekra\u00efne, is de restauratie van de Christus Geboortekerk hier in Antwerpen
  on hold gezet. We wachten op de beslissing van, weeral, minister Somers, over het
  al dan niet intrekken van de erkenning van de Russisch orthodoxe kerk in Antwerpen.
  We wachten nog altijd op antwoord, sinds ons schrijven van maart. Voila, in totaal
  investeert de provincie deze legislatuur 11,6 miljoen EUR in de heritage.\\n\\nTot
  slotte, landen we binnen het Departement DREM bij Mobiliteit. Voil\u00e0. De aanleg
  van fietsostrades blijft het speerpunt van het provinciale Mobiliteitsbeleid. Voor
  2023 staat een bedrag van 11,5 miljoen EUR aan uitgaves voor eigen investering in
  fietsostrades ingeschreven. Voor gemeenten die zelf infrastructuur aanleggen op
  het BFF, voorzien we een subsidiebedrag van 1,7 miljoen EUR. We herhalen hier collega''s
  met aandrang onze oproep aan minister Peeters van Mobiliteit, Lydia Peeters, om
  het Vlaamse aandeel in het fietsfonds mee te laten stijgen met de stijging van de
  provinciale middelen voor fietsinfrastructuur. Zo zorgen wij hand in hand voor een
  versnelling in de aanleg van onze fietsostrades, de ruggengraat van een bovenlokaal
  fietspadennetwerk. En zorgen we voor een broodnodige, verdere verduurzaming van
  onze mobiliteit. Projecten in 2023, ik overloop ze kort. De F12, de havenverbinding,
  de start van de werken die de verbinding maken tussen de Noorderlaan en het centrum
  van Ekeren. Een zeer belangrijke schakel, mijnheer de districtsburgemeester, om
  het woon-werkverkeer van en naar de Antwerpse haven te kunnen verduurzamen. De F4,
  Antwerpen \u2013 Gent \u2013 Zwijndrecht, start van de werken voor aanleg van een
  deel van de fietsostrade, parallel aan de Burchtse Scheibeek. Dus we werken ook
  in het Waasland. De F11, Antwerpen \u2013 Lier, in Boechout, het opstartdossier
  voor de verbetering van de Spoorweglei tussen de Heuvelstraat en de Alexander Franckstraat.
  De F105 Herentals - Balen. De laatste werken zijn bezig aan de F105, Mol \u2013
  Balen, van Rozenberg tot Langvennen. Balen van Langvennen tot Vaartstraat, en Balen
  van Vaartstraat tot Schoordorp. En de F103, Lier \u2013 Herentals, hier werken we
  aan de definitieve ontwerpen. En financieren we nu de voorbereidende werken voor
  onze fietsostrades die worden meegenomen tijdens de werken die door de Vlaamse Waterweg,
  mijnheer de voorzitter van de Waterweg, op dit moment worden uitgevoerd voor de
  verhoging van de spoorwegbrug in Herentals. De optimalisatie van de F1 Antwerpen
  \u2013 Mechelen, het studiewerk is zo goed als achter de rug. En daar willen we
  in 2023 in samenwerking met de lokale besturen overgaan tot de opmaak van lokale
  aanbestedingsdossiers om delen van het traject te kunnen verbreden en verbeteren.
  De gemeenten kunnen voor de financiering beroep doen op het fietsfonds. Ik hoop
  dat dat in Hove ook goed komt, mijnheer Vandendriessche. Dat zullen we nog zien.\\n\\nHet
  ondersteunen van overheden en bedrijven. Het Provinciaal Mobiliteitspunt van de
  provincie Antwerpen wil het eerste aanspreekpunt zijn van werkgevers die informatie,
  advies of begeleiding zoeken in het kader van duurzaam woon-werkverkeer. De provincie
  Antwerpen neemt als overheid op dit vlak ook zeer bewust een voorbeeldfunctie op.
  Dit houdt in dat de provincie als werkgever ook zelf de nodige maatregelen moet
  nemen voor een duurzamer woonwerkverkeer. Ik verwijs hiervoor naar onze succesvolle
  actie betreffende fietslease voor onze medewerkers. In 2023 hebben we de volgende
  doelen. E\u00e9n, minimaal honderd werkgevers in de provincie Antwerpen begeleiden
  en het co\u00f6rdineren van VLOT, het Mobiliteitsco\u00f6rdinatiecentrum in de regio
  Mechelen. Provincie Antwerpen co\u00f6rdineert de samenwerking en de opdracht van
  VLOT op vraag van de Vlaamse overheid, Mechelen en SintKatelijne-Waver. VLOT ondersteunt
  bedrijven en scholen actief in acties rond het verduurzamen van het woon-werkverkeer
  dat ze genereren.\\n\\nHet onderwijs. Onze eerste ambitie legt de focus op de Nederlandse
  taal. We willen immers de kennis van het Nederlands bij onze leerlingen en cursisten
  versterken. Goede kennis van de Nederlandse taal is immers onontbeerlijk om gekwalificeerd
  uit te stromen en zijn/haar plaats in de maatschappij in te nemen. Daarom nemen
  we vanuit het Provinciaal Onderwijs Antwerpen een aantal initiatieven. Zo zijn we
  dit jaar gestart met OKAN-onderwijs, een taalklas voor anderstalige nieuwkomers
  binnen het secundair onderwijs. OKAN-leerlingen kunnen hiervoor terecht bij PTS-Mechelen,
  PTS-Boom, en PITO-Stabroek. In 2023 zullen we deze klassen uitbreiden en de mogelijkheid
  onderzoeken om ook in de stad Antwerpen OKAN-onderwijs aan te bieden. Ook voor onze
  volwassen cursisten willen we de focus op de kennis van het Nederlands blijven leggen.
  De NT2-opleiding Nederlands voor anderstaligen, wordt al langer in CVO Vitant aangeboden.
  Het is onze bedoeling om deze afdeling te laten groeien, om meer mensen de Nederlandse
  taal te laten leren. Ook zal het vervolgtraject voor OKAN-leerlingen binnen het
  tweede kans-onderwijs worden gepromoot. Op deze manier komen we tegemoet aan onze
  maatschappelijke verantwoordelijkheid om als provinciaal onderwijs de kwalificatiemogelijkheden
  te verhogen.\\n\\nInvesteren, in zowel innovatief didactisch materiaal als in moderne
  duurzame huisvesting. Dat gaan we doen, om in staat te zijn de snel evoluerende
  technologie in de bedrijfswereld te volgen. Dan zijn die investeringen van cruciaal
  belang. We focussen dan ook in onze nieuwe infrastructuurprojecten op duurzaamheid
  en zo blijven we ook investeren op energiebesparende maatregelen. Een aantal voorbeelden
  van werken die in 2023 zullen starten. Campus PIVA, de renovatie van de keukens,
  avAnt Rivierenhof, nieuwe fietsstallingen zowel voor leerlingen als leerkrachten,
  PITO Stabroek, de gevels en de raampartijen worden onder handen genomen. En PTS,
  de speelplaats van de eerstegraads zal overkapt worden. De focus op duurzaamheid
  en energiebesparende maatregelen manifesteert zich niet alleen in renovaties en
  bouwprojecten. Op de stafdienst, zoals al gezegd, zal in 2023 een deskundige energie
  worden aangeworven, die de scholen zal bijstaan om nog energiezuiniger om te gaan.
  We zullen zetten, zoals eerder gezegd, ook in op innovatief didactisch materiaal
  om onze leerlingen en cursisten optimaal voor te bereiden op de arbeidsmarkt. Zo
  zal in PTS Boom een watersnijder worden aangekocht, in avAnt industri\u00eble strijktafels
  en nieuwe naaimachines, enzovoorts. Wij investeren dus voor 12,6 miljoen EUR.\\n\\nMondiaal
  beleid. Daar hebben we in de commissie nog een zeer uitgebreide toelichting van
  de mensen van Unicef over gekregen. Het gaat hier over bijna 1,2 miljoen EUR in
  2021. Over de ganse legislatuur investeren we meer dan zeven miljoen EUR, en we
  gaan volgend jaar ongeveer 1,2 miljoen EUR investeren. We hebben vier pijlers, waar
  we op inzetten. En die zijn, zoals u ziet, de bescherming en herstel van het tropisch
  woud, dat doen we in samenwerking met Bos Plus in het Peruaanse Amazonewoud en in
  samenwerking met de Antwerp Zoo Foundation en het KMDA, in het natuurreservaat Lomako
  Yokokala in Congo, telkens en met een actieve rol voor de inheemse bevolking. Pijler
  twee, in Unicef, waar we recyclage van plastic afval doen en die hervormen tot bouwstenen
  om scholen te bouwen in Ivoorkust. Ons langlopend arrangement in het regioproject
  in Guatemala. En natuurlijk ook 350 duizend EUR voor de projecten van de vierde
  pijlers. Totaal budget van 1 miljoen 175 duizend, vervolledigd met\\n\\nelfduizend
  EUR, voor de prijs van het mondiaal onderzoek in samenwerking met de Universiteit
  Antwerpen, Tropisch Instituut, de KDG en de AP Hogeschool.\\n\\nIk eindig met het
  Havenbelevingscentrum, waar ook al veel over gezegd is geworden. U weet, sinds 2017
  ontstond binnen deputatie het idee de werking van het Havencentrum in Lillo te vernieuwen.
  Ludwig Caluw\u00e9 stond daarmee aan de wieg van dit verhaal. En sinds 2020 is de
  samenwerking met Port of Antwerp-Bruges in een stroomversnelling. Beslist is om
  te vestigen op de Droogdokkensite, net ten noorden van het eilandje, om daar samen
  het Havenbelevingscentrum uit te bouwen. En om ons volop te kunnen richten op het
  Havenbelevingscentrum, hebben we besloten om vanaf juni 2023 het Havencentrum in
  Lillo te sluiten en achter de schermen verder te werken. Er blijft een educatieve
  werking, maar beperkter dan nu. De medewerkers worden tijdelijk verhuisd hier naar
  het provinciehuis en zo leggen we de focus op de toekomst van het Havenbelevingscentrum.
  Het Havenbelevingscentrum verbindt mensen en de haven. Dat doen we om de haven te
  positioneren als een plek van mogelijkheden en kansen, zowel op individueel, als
  maatschappelijk vlak. We investeren daar maar liefs 8,5 miljoen EUR in. En wat mevrouw
  Talhaoui heeft gezegd daarstraks: ja, het is belangrijk dat we daar ook voor tewerkstelling
  gaan zorgen, en dat we mensen gaan toe leiden naar tewerkstelling in de haven. Heel
  belangrijk. Na de ontwerpwedstrijd werd er gekozen om samen te werken met Atelier
  Kempe-Thill. En de gesprekken met het ontwerpteam zijn volop aan de gang om zo tot
  het finaleontwerp te kunnen komen.\\n\\nDames en heren, mijnheer de voorzitter,
  ik hoop dat ik binnen de tijd ben gebleven. Dit waren kort een aantal accenten uit
  mijn beleid.\\n\\nNr. 1/2 van de agenda\\n\\nTussenkomst van de heer Bruno Valkeniers
  over gedwongen fusies van gemeenten - Vlaamse regiovorming - de toekomst van de
  provincies.\\n\\nVOORZITTER.- Dank u wel, gedeputeerde Lemmens. En dan geef ik graag
  het woord voor twee tussenkomsten, aan mijnheer Valkeniers.\\n\\nDe heer VALKENIERS.-
  E\u00e9n na het ander?\\n\\nVOORZITTER.- Ja, best.\\n\\nDe heer VALKENIERS.- Goed.
  Dank u, voorzitter. Mijnheer de gedeputeerde. Een aantal collega''s hebben er tijdens
  hun fractietussenkomsten al naar verwezen. Er zijn nog zekerheden in deze wereld.
  Net zoals elke vogel in mei een ei legt, mag men er bijna vanuit gaan dat Mechels
  grootste, de Vlaamse vice minister-president Bart Somers rond deze tijd van het
  jaar bevalt van een nieuw ideetje rond de fusie van gemeenten, de Vlaamse regiovorming
  en dus de provincies. Slechte karakters zouden ons er bijna van verdenken om een
  afgesproken \u00e9\u00e9n-tweetje te organiseren zodanig dat ik de gelegenheid krijg
  om hier tijdens de meerjarenbespreking over te beginnen tijdens de raadszitting.
  Maar niets is minder waar. Zo groot is de affiniteit nu ook weer niet.\\n\\nE\u00e9n,
  een nieuw financieringssysteem. Daar kan ik hem eerlijk gezegd nog in volgen ook.\\n\\nMaar
  inderdaad, zo''n dikke twee weken geleden, op 19 november als ik het juist heb,
  beviel hij in het belang van Limburg van een nieuw idee. Het gemeentefonds en haar
  ''koterijen'', zoals hij dat noemt, zijn volgens hem dringend toe aan een grondige
  hervorming, en daartoe zijn er drie dingen tegelijkertijd nodig.\\n\\nTwee, gedwongen
  fusies van gemeenten. Van de driehonderd Vlaamse gemeenten ongeveer, ziet hij er
  nog maar een honderdtal overschieten.\\n\\nEn drie, een overheveling van de bevoegdheden
  van het Vlaamse naar het lokale bestuur, zeg maar gemeenten. En de wortel die de
  ezel, dus de gemeente, wordt voorgehouden, is een overheveling van vier miljard
  EUR.\\n\\nGedwongen fusies dus. De minister heeft duidelijk geleerd uit zijn debacle
  met Boortmeerbeek eerder dit jaar. Nu geen vrijwillige meer, geen referenda, maar
  gedwongen fusies. En dan komt de aap uit de mouw. Quote de vice minister-president
  in het Belang: ''Dat geeft ons ook de kans om de provincies af te schaffen. De regio''s
  (uiteraard zijn eigen dada) kunnen gerust blijven bestaan en een belangrijke ambtenaar
  als de gouverneur blijft nodig. Maar die provinciale bestuurslaag kan weg, zeker
  als je grotere gemeenten hebt.'' Unquote. Pak vast, telkens opnieuw, net voor de
  kerst en voor het oudejaar, als een cadeau en als een koekoeksei onder de kerstboom,
  dat kan tellen.\\n\\nMijnheer de gedeputeerde, ik heb dan ook bijna dezelfde vragen
  als vorig jaar daarover. Bent u op de hoogte van de plannen van de minister? Buiten
  hetgeen in de krant stond, natuurlijk. Kan u ons hierover meer vertellen? Wordt
  de deputatie betrokken of gaat ze betrokken worden of gehoord worden bij die plannen?
  Gaat dat ge\u00ebist worden? Gaat de deputatie reageren op de plannen van de minister?
  Hebt u enig idee wat de provincies misdaan hebben aan de minister? Het doet stilaan
  pathetisch aan.\\n\\nNr. 1/3 van de agenda\\n\\nTussenkomst van de heer Bruno Valkeniers
  over de overstap van Zwijndrecht naar de Regio Waasland.\\n\\nDe heer VALKENIERS.-
  En mijn volgende vraag bevestigt nogmaals dat het woelige tijden zijn. Een aantal
  dagen na het koekoeksei van Het Belang van Limburg, komt er een nieuw verslag, deze
  keer in de Frut, u weet wel, de Gazet van Antwerpen, op 23 november. En dat ging
  over dat alle partijen in de gemeente Zwijndrecht, vooralsnog gelegen in de provincie
  Antwerpen, de overheveling gevraagd hebben van de regio Antwerpen naar de regio
  Waasland, en dat in het kader van de toekomstige al of niet al bestaande regiovormingen.\\n\\nIn
  de Vlaamse commissie Binnenlands Bestuur, en daar heb je de vice minister-president
  weer, is dit unaniem goedgekeurd. Natuurlijk moet het Vlaams parlement nog volgen.
  We zullen zien. Maar op die manier is een monsterfusie met Antwerpen blijkbaar van
  de baan, iets waar men in Zwijndrecht voor vreesde naar de toekomst toe. Maar voor
  de rest blazen heel wat lokale politici warm en koud over de relatie met de provincie
  Antwerpen.\\n\\nEn hierover heb ik dan de volgende vragen: is de deputatie betrokken
  geweest bij deze gesprekken? Weten jullie meer over de goedkeuring hiervan en de
  mogelijke gevolgen voor de provincie? Steunt de deputatie zo''n overheveling? Blijft
  Zwijndrecht, indien het Vlaams parlement deze plannen ook goedkeurt, deel uitmaken
  van de provincie Antwerpen? Of liggen ze dan helemaal aan de verkeerde kant van
  het water? Dank u.\\n\\nVOORZITTER.- Dank u wel, mijnheer Valkeniers. Gedeputeerde
  Lemmens heeft het woord.\\n\\nDe heer LEMMENS, gedeputeerde.- Mijnheer de voorzitter,
  mevrouw de ondervoorzitter, collega''s. Mijnheer Valkeniers, u hebt het zelf gezegd,
  net zoals dat uw vraag een bis-nummer is van vorig jaar, vrees ik natuurlijk dat
  mijn antwoord een bis-antwoord zal zijn. Behoudens het artikel in de pers ben ik
  niet op de hoogte van de plannen van de minister en kan ik u ook niet meer vertellen
  dan dat u uit het artikel hebt kunnen vernemen. Wel stel ik vast dat de minister
  nog steeds dient te werken binnen het kader van het Vlaams regeerakkoord, en daarin
  worden in deze legislatuur geen verdere bestuurlijke hervormingen gepland. Het huidige
  beleid van de\\n\\nVlaamse regering is een vrijwillige fusie, met financi\u00eble
  stimulans. Wat er in een volgend regeerakkoord zal staan, dat is voor mij koffiedik
  kijken. Maar ik merk samen met u, dat de minister van Binnenlands bestuur een koele
  minnaar is van het provinciaal bestuursniveau. En blijkbaar ook van lokale autonomie
  richting gemeentebesturen. Wat de verklaring daarvoor is, dat zal u hem zelf moeten
  vragen. Ik weet ook nog altijd niet wat de provincies die man hebben aangedaan,
  maar dat moet u hem zelf maar eens persoonlijk vragen.\\n\\nIk zal de komende jaren
  alvast verder werken aan het ambitieus, duurzaam, effici\u00ebnt, dienstbaar en
  verbindend project dat we hebben opgemaakt met dit provinciebestuur.\\n\\nOp uw
  volgende vraag, over de overheveling van regio en de fusie wellicht, ik zal u zeggen
  dat de deputatie niet betrokken is geworden bij deze gesprekken. Wij weten dat het
  Vlaams parlement in de commissie Binnenlands bestuur het amendement goedkeurde over
  de overheveling van Zwijndrecht naar de regio Waasland, bij de bespreking van het
  ontwerp van decreet over de regiovorming, op 23 november. Dit ontwerp van decreet
  zal de komende weken ook nog in de plenaire vergadering van het Vlaams parlement
  besproken worden, zoals u hebt gezegd. Ook wij hebben via de pers vernomen, dat
  er op 24, 25 en 27 oktober door de gemeenten Beveren, Kruibeke en Zwijndrecht het
  startschot werd gegeven voor een fusie. In het draaiboek van het Agentschap Binnenlands
  Bestuur, over fusies, staat dat wanneer gemeenten niet tot dezelfde provincie behoren,
  dat de provinciekeuze onderdeel moet zijn van de definitieve beslissing tot samenvoeging.
  Dat moet vervolgens ook onderdeel zijn van het samenvoegingsdecreet dat wordt voorgelegd
  aan het Vlaams parlement. Ik citeer, artikel 3.48 van het decreet Lokaal bestuur,
  ik citeer: ''Het ontwerp van het samenvoegingsdecreet bevat de naam van de samen
  te voegen gemeenten, de samenvoegingsdatum, de naam en de aanduiding van de grenzen
  van de nieuwe gemeente, en als de samen te voegen gemeenten niet tot dezelfde provincie
  behoren, de provincie waartoe de nieuwe gemeente behoort.'' Einde citaat. Ik stel
  samen met u vast dat het provinciebestuur enkel akte kan nemen van deze eventuele
  wijziging aan de provinciegrenzen, en er niet over bevraagd wordt. Wij namen hierover
  contact op met Agentschap Binnenlands Bestuur en ook voor hen is een provincieoverschrijdende
  fusie volledig nieuw. Zij maken nu ook intern een traject op dat gelopen dient te
  worden en bekijken daarbij in hoeverre er een adviesvraag gericht zal worden aan
  de provinciale deputatie. Maar zoals u zelf ook al hebt gezegd, we moeten misschien
  niet op de zaken vooruit lopen. De gemeente Beveren, Kruibeke en Zwijndrecht zijn
  nog maar enkel de intentie tot samenwerking aangegaan. En daarbij was het opmerkelijk
  dat dit in Zwijndrecht gebeurde via een wisselmeerderheid. Het volledige traject
  tot fusie moet nog gelopen worden en zal pas tegen het einde van deze legislatuur
  een uitkomst kennen. En ik ben samen met u benieuwd wat die uitkomst zal zijn. Dank
  u wel.\\n\\nVOORZITTER.- Mijnheer Valkeniers heeft het woord.\\n\\nDe heer VALKENIERS.-
  Dank u, mijnheer de gedeputeerde. U hebt natuurlijk gelijk als u verwijst naar het
  Vlaams regeerakkoord, waar klaar en duidelijk de positie van die regering ingenomen
  is. En wat een volgende legislatuur, wat een volgende regering zal beslissen, dat
  is voor het ogenblik koffiedik kijken, vermits we totaal geen idee hebben hoe die
  eruit zal zien. Tenzij natuurlijk een aantal ministers vandaag er al vanuit gaan
  dat ze er volgende keer opnieuw bij zijn. Maar daar zou de kiezer natuurlijk weleens
  een stokje kunnen voor steken. Ik zou het bijna hopen zelfs. Of met zekerheid hopen.
  In elk geval, voor het personeel is dat natuurlijk ook geen goede zaak. Telkens
  opnieuw andere vliegers in de loop van de legislatuur oplaten. En in plaats van
  te wachten tot de volgende legislatuur, en dan met een definitief, uiteindelijk
  plan, wat het ook is, op langere termijn af te komen. Maar blijkbaar, inderdaad,
  moet dat aan de persoon in kwestie eens gezegd worden. En ik zal met de collega''s
  in het Vlaams parlement daarover praten. Dank u.\\n\\nVOORZITTER.- Dank u wel. Mijnheer
  Vandendriessche heeft het woord.\\n\\nDe heer VANDENDRIESSCHE.- Dank u wel voor
  het antwoorden, gedeputeerde. Want ik leid daaruit af dat u vanuit uw administratie
  ook zelf nu wel actief de vraag stelt aan de Vlaamse\\n\\noverheid: wat gebeurt
  er nu daar allemaal? Kan u daar meer toelichting over geven, of hoe moeten we dat
  opvatten?\\n\\nDe heer LEMMENS, gedeputeerde.- Het is zelfs niet vanuit de administratie
  gebeurd, mijnheer Vandendriessche. Ook de deputatie doet af en toe iets. En wij
  hebben die vragen gesteld aan het Agentschap Binnenlands bestuur. En we zullen verder
  opvolgen hoe de situatie verder loopt.\\n\\nNr. 1/4 van de agenda\\n\\nTussenkomst
  van de heer Koen Palinckx over het Provinciaal Beleidsplan Ruimte Antwerpen\\n\\nVOORZITTER.-
  Mijnheer Palinckx heeft het woord.\\n\\nDe heer PALINCKX.- Voorzitter, ondervoorzitter,
  leden van de deputatie en beste collega''s. Misschien het slotakkoord voor vandaag,
  maar dat hangt dan van de voorzitter af uiteraard. Mijn vraag gaat over het Provinciaal
  Beleidsplan Ruimte. En die is dus ook gericht aan onze eerste gedeputeerde, alhoewel
  dat ik misschien naar aanleiding van zijn tienjarig jubileum als gedeputeerde misschien
  het beter had gehad over de fietsostrades. Want waar het hart vol van is, loopt
  de mond van over. Maar dat hebben we daarnet al kunnen merken, dat hij altijd met
  wat meer passie begint te spreken als het over die fietsostrades gaat. En dat is
  ook soms mooi, passie in de politiek.\\n\\nMaar toch, het Provinciaal Beleidsplan
  Ruimte, collega''s, toch ook \u00e9\u00e9n van de belangrijkste bevoegdheden. En
  zoals we allen weten, moeten we met die bestaande en schaarse ruimte in onze provincie
  naar de toekomst voorzichtig omgaan. Want die moet intensiever gebruikt worden,
  maar ook zeker en vast kwalitatiever. En deze uitgangspositie heeft zich binnen
  onze provincie vertolkt in een aanzet van lange termijnvisie, met een aantal strategie\u00ebn,
  grote ruimtelijke principes en doelstellingen die dan gebundeld zijn in die nota
  ruimte. En de ambitie om deze dan uit te werken in de volgende fase tot een gloednieuw
  Provinciaal Beleidsplan Ruimte Antwerpen.\\n\\nZeven uitgezette strategie\u00ebn
  resulteerden in vier belangrijke principes, waarop we ons provinciaal beleid baseren.
  We zetten in op zuinig ruimtegebruik, we zoeken veerkracht binnen de ruimte om met
  nieuwe uitdagingen en trends te kunnen omgaan. We zetten in op nabijheid en bereikbaarheid
  in het kader van de mobiliteitsvraagstukken en zetten in op eigenheid waarbij de
  specifieke context van een omgeving of de gemeente dient meegenomen te worden. En
  die visie is het resultaat van doorgedreven en intensieve samenwerking en participatie.
  De provincie zocht verbinding met onze gemeentebesturen, uiteraard ook met de Vlaamse
  administraties, tal van middenveldorganisaties en een publieke raadpleging werd
  georganiseerd. En uiteraard kijken we ook uit naar de verdere resultaten van het
  onderzoek dat momenteel loopt. Maar met de goedkeuring van het ontwerp beleidsplan
  op de provincieraad van 27 oktober jongstleden, hebben we de stap gezet naar die
  nieuwe fase, dus de aanloop, hopelijk de definitieve aanloop, naar het definitief
  beleidsplan. En het proces, dat is uiteraard nog lang. Er moet nog een weg worden
  afgelegd. Mijn vragen zijn dan ook gelinkt aan de verdere stappen richting het definitieve
  document. Ik zou graag vernemen van de gedeputeerde hoe hij het verdere verloop
  ziet in de komende fase. En daarnaast ook: vertrekt het Provinciaal Beleidsplan
  Ruimte van een aantal provinciale beleidskaders? Zijnde levendige kernen, sterke
  netwerken, ruimte en mobiliteit, en verdichten en ontdichten van ruimte? En ik had
  dan ook de vraag: waarom werd gekozen voor deze voorliggende drie ontwerpbeleidskaders?
  Ik dank u.\\n\\nVOORZITTER.- Dank u wel, mijnheer Palinckx. Gedeputeerde Lemmens
  heeft het woord.\\n\\nDe heer LEMMENS, gedeputeerde.- Ja, collega''s, voorzitter,
  ondervoorzitter. Mijnheer Palinckx, bedankt, beste Koen, voor deze vragen. U vraagt:
  hoe zit het met het verdere verloop? Ik zal wat meer in detail gaan. Dus op 27 oktober
  hebben we inderdaad het ontwerp beleidsplan goedgekeurd. Het vervolg is dus het
  openbaar onderzoek dat van 16 december tot en met 15 maart 2023 zal plaatsvinden.
  In dat openbaar onderzoek leggen we het ontwerp en de bijhorende documenten voor
  aan een brede groep instanties die hierop advies verlenen. Voor het brede publiek
  worden in januari drie informatie- en inspraakvergaderingen georganiseerd. In Antwerpen
  op 20 januari, in Boom 23 januari en in Turnhout 26 januari. Na het openbaar onderzoek
  verwerkt de Procoro de adviezen. Het decreet voorziet hier negentig dagen, negentig
  dagen na het einde van het openbaar onderzoek. Deze termijn kan wel nog verlengd
  worden, bijvoorbeeld wanneer er teveel adviezen te behandelen zijn. Na de Procoro
  is het de beurt aan de provincieraad om het beleidsplan definitief vast te stellen.
  Dit moet ten laatste honderdvijftig dagen na het einde van het openbaar onderzoek,
  of 210 dagen als de termijn van de Procoro zou verlengd worden. We verwachten dus
  in het najaar van 2023 een definitieve vaststelling te kunnen maken hier in de provincieraad.\\n\\nU
  vraagt dan ook nog: waarom werd er gekozen voor die drie kaders, die beleidskaders?
  Wel, de eerste set van beleidskaders hebben we geselecteerd op basis van volgende
  brede overwegingen. Zo dienen ze rekening te houden met de vier ruimtelijke principes
  en de zeven strategie\u00ebn. Ook moeten ze de focus leggen op elementen waar we
  als provincie op willen inzetten of verder een rol in kunnen spelen. Ze zijn thema-overschrijdend
  en volstaan om het Ruimtelijke Structuurplan Provincie Antwerpen te vervangen. De
  huidige set van drie beleidskaders, en het eerste is het beleidskader sterke netwerken,
  ruimte, en mobiliteit. Hier is de link tussen ruimtegebruik en mobiliteit natuurlijk
  uiterst belangrijk. De mobiliteitsimpact van activiteiten verminderd immers, als
  we de verplaatsingen beperken, als we multimediale knooppunten knopen uitbouwen
  en duurzame mobiliteit faciliteren. Dat is ook \u00e9\u00e9n van de redenen, natuurlijk,
  dat we dat Ruimtelijk Structuurplan Provincie Antwerpen, dat we gestart zijn aan
  het beleidsplan. Omdat er in dat structuurplan dus ook heel weinig aandacht was
  aan mobiliteit. En daar geven we nu enorm veel aandacht aan.\\n\\nDank u wel.\\n\\nLevendige
  kernen is het tweede beleidskader. We vinden het belangrijk dat elke kern levendig,
  kwalitatief en multifunctioneel is. Maar niet elke kern is hetzelfde, dus werken
  we hier beleid op maat uit. Zo willen we als provincie onze leefomgevingen duurzamer
  helpen maken. Trouwens, met onze beleidskaders willen we twee doelen bereiken. Enerzijds
  werken we als provincie projecten uit in dorps- en stadskernen. Anderzijds willen
  we vanuit onze bovenlokale bril en ruimtelijke visie ook gemeenten blijven ondersteunen
  en mee richting geven. Tot slot is er het beleidskader verdichten en ontdichten
  van de ruimte. E\u00e9n van de basisinsteken van ons vernieuwd ruimtelijk beleid,
  om de bebouwde ruimte effici\u00ebnter in te vullen, de open ruimte te versterken
  en versnippering tegen te gaan. Door effici\u00ebnt en zuinig ruimtegebruik, zowel
  in de bebouwde als in de open ruimte, zal de druk op onze ruimte verminderen. En
  zo blijft onze ruimte weerbaar voor de huidige en toekomstige klimaatveranderingen.
  We hebben de mogelijkheid om later het beleidsplan Ruimte aan te vullen met bijkomende
  beleidskaders. De bestaande beleidskaders kunnen we ook aanvullen, aanpassen of
  opheffen. Dit is dus allemaal, dames en heren, collega''s, geen statisch geheel.
  Een beleidsplan is nu eenmaal een levend document. En het zal dus aan ons zijn,
  en aan onze administratie, om daar constant mee te werken.\\n\\nVOORZITTER.- Dank
  u wel. Dan kijk ik nog even rond of hier nog vragen rond zijn. Als er geen vragen
  meer zijn, dan zou ik voorstellen om de vraag van mevrouw Van Dienderen morgen te
  starten. Want we hadden gezegd rond zes uur te stoppen, en het is drie voor zes.
  Dan schorsen wij nu de zitting, en dan zien wij u morgen terug om twee uur, hier
  in de raadszaal. Dank u wel.\\n\\nDe vergadering wordt gesloten om 17.56 uur.\"",
  "\"Samenstelling raad van toezicht\\n\\nDe raad van toezicht is heden als volgt
