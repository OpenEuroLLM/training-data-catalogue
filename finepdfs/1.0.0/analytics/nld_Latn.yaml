  Muhammed\\n\\n11 Teun\\n\\nStaf\\n\\nJeroen\\n\\nAntwan\\n\\nRob\\n\\nSill\"", "\"Vanaf
  vandaag financi\u00eble tegemoetkoming voor dorps- en buurthuizen\\n\\nVanmiddag
  kregen we een verlossend telefoontje. Vanmorgen heeft het kabinet besloten om buurten
  dorpshuizen en gemeenschapsaccommodaties definitief toe te laten tot de TOGS-regeling.
  De TOGS-\\n\\nAanvragen via https://www.rvo.nl/subsidie-en-financieringswijzer/togs
  regeling is een eenmalige gift die speciaal bedoeld is voor ondernemers die direct
  getroffen zijn door de coronamaatregelen. Het gaat om 4000 euro en is naar eigen
  inzicht te besteden. De gift is gekoppeld aan een SBI-code, de code waarmee je ingeschreven
  staat bij de Kamer van Koophandel en die aangeeft welke bedrijfsactiviteit je uitvoert.\\n\\nSBI-codes\\n\\nVanaf
  vandaag zijn de SBI-codes 88.999, 88.993 en 88.102 toegelaten tot de TOGS. De meeste
  buurten dorpshuizen vallen onder deze codes (in hun hoofd- of nevenactiviteit),
  zo blijkt uit een inventarisatie van LVKK en LSA. Bij de aanvraag voor deze tegemoetkoming
  wordt een aanvullende verklaring gevraagd, waarin wordt onderbouwd dat het gaat
  om een organisatie die fungeert als dorps- of buurthuis. Je vindt je SBI-code via
  de tool op de website van de KVK.\\n\\nEnkele voorwaarden\\n\\nIn de periode 16
  maart \u2013 16 juni moet sprake zijn van omzetverlies waar vaste lasten tegenover
  staan van minimaal \u20ac4.000,-. Of je in aanmerking komt, wat alle voorwaarden
  zijn en hoe je kunt aanvragen lees op je op de site van het RVO. Let op! Ben op
  tijd met aanvragen. De TOGS-regeling sluit op 26 juni a.s.\\n\\nTVL\\n\\nDe TOGS-regeling
  wordt opgevolgd door de TVL-regeling. De regeling is specifiek gericht op mkb ondernemers
  die door de coronacrisis veel omzet verliezen en daardoor in de problemen komen
  met het betalen van hun vaste lasten. Ondernemers die voor de Tegemoetkoming Ondernemers
  Getroffen Sectoren COVID-19 (TOGS) in aanmerking kwamen, kunnen ook gebruikmaken
  van de Tegemoetkoming Vaste Lasten (TVL). We gaan er vanuit dat ook buurt- en dorpshuizen
  als ze in de TOGS-regeling zijn opgenomen hier gebruik van kunnen maken. Deze regeling
  duurt vier maanden en heeft eigen voorwaarden. Zodra meer bekend is zullen we jullie
  hierover informeren.\\n\\nEen andere SBI-code\\n\\nFungeer je als buurt- of dorpshuis
  of gemeenschapsaccommodatie en sta je ingeschreven onder een andere SBI-code? Dan
  is het raadzaam om dit formulier in te vullen om aan te geven dat je meent een andere
  SBI-code te moeten hebben.\\n\\nOpgelucht en dankbaar\\n\\nLVKK en LSA hebben gestreden
  voor deze regeling en zijn opgelucht dat de hoognodige financi\u00eble steun voor
  buurt- en dorpshuizen nu beschikbaar komt. We realiseren ons dat hiermee niet alle
  verliezen kunnen worden opgevangen, maar wel bijdraagt aan een stabielere financi\u00eble
  toekomst. We zien hierin erkenning voor de enorm belangrijke rol die buurt- en dorpshuizen
  innemen in het sociale leven en een erkenning van de inzet en het ondernemerschap
  van zoveel gemeenschappen in dorpen en wijken. Wij zijn dankbaar voor dit besluit
  van de staatssecretaris van Economische Zaken.\\n\\nLandelijke Vereniging voor Kleine
  Kernen, Dr. Nassaulaan 3 A, 9401 HJ Assen Landelijk Samenwerkingsverband Actieve
  bewoners, Korte Elisabethstraat 15-17, 3511 JG Utrecht\\n\\nGezamenlijk vertegenwoordigen
  de LVKK en LSA ongeveer 3000 dorps- buurt- en wijkcentra.\\n\\nNamens de LVKK: Groninger
  Dorpen, Doarpswurk Friesland, BOKD Drenthe, OVKK Overijssel; DKKGelderland; Dorpswerk
  Noord-Holland; ZHVKK Zuid-Holland; ZVKK Zeeland; VKKNB NoordBrabant; ''t Heft Noord-Brabant;
  VKKL Limburg.\"", "\"### IJSLANDSE AANVOER TE OOSTENDE\\n\\n| Schelvis | 16-6-1975
