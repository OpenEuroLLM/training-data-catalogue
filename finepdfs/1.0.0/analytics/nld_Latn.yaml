  Zero G 400 slaapsysteem neemt de voor u ultieme positie aan, wat u het gevoel van
  complete gewichtloosheid bezorgt. Door uw benen licht omhoog te brengen, stimuleert
  de unieke TEMPUR\u00ae Zero G instelling uw bloedcirculatie, waardoor u compleet
  ontspant. Na het slapen voelt u zich weer fris en energiek.\\n\\nHet TEMPUR\u00ae
  Zero G 400 slaapsysteem is verkrijgbaar met en zonder hoofdbord, in 3 verschillende
  kleuren en met verschillende poten voor een andere look!\\n\\n- Verstelbare bedbodem
  voor het gevoel van gewichtloosheid\\n- Ingebouwde massagefunctie voor extra ontspanning\\n-
  Eenvoudige draadloze afstandsbediening voor optimaal gemak\\n\\nBekijk onze uitgebreide
  beddencollectie, prijzen en alle specificaties op tempur.nl.\\n\\nZero G \u2022
  Kleur: grijs \u2022 Uitvoering: met hoofdbord\\n\\nTEMPUR\u00ae Bedden\\n\\nA mattress
  like no other\\n\\nRelax Bed: stof \u2022 Kleur: Grey \u2022 Hoofdbord: Shape\\n\\nTEMPUR\u00ae
  Relax Bed\\n\\nHet TEMPUR\u00ae Relax Bed tovert uw slaapkamer om tot een elegante
  comfort-zone. Dankzij het hoge en strakke hoofdbord heeft het slaapsysteem het stijlvolle,
  minimalistische design waar Scandinavi\u00eb zo bekend om staat. Het Relax bedkader
  kan worden aangepast en is verkrijgbaar in diverse stoffen en kleuren.\\n\\nRelax
  Bed: stof \u00b7 Kleur: Khaki\\nHoofdbord: Frame \u00b7 Poten: optisch zwevend\\n\\nRelax
  Bed: lederlook \u00b7 Kleur: Marine\\nHoofdbord: Texture \u00b7 Poten: optisch zwevend\\n\\nOpties
  TEMPUR\u00ae Relax Bed\\n\\nDe bedkaders en hoofdborden zijn verkrijgbaar in diverse
  maten en kleuren. Combineer het bedkader van uw keuze met een van de potensets.\\n\\n-
  Diverse maten, kleuren en stoffen bedkaders\\n- Diverse stijlen hoofdborden\\n-
  Diverse potensets om uw keuze compleet te maken\\n\\nBekijk onze uitgebreide beddencollectie,
  prijzen en alle specificaties op tempur.nl.\\n\\nKleuren\\n\\nStof, lederlook of
  een combinatie*\\n\\n* De combinatie is alleen mogelijk bij de hoofdborden Texture
  en Frame.\\n\\nRelax Bed: stof \u2022 Kleur: Grey \u2022 Hoofdbord: Check \u2022
  Poten: optisch zwevend\\n\\nTEMPUR\u00ae Bedden\\n\\nA mattress like no other\\n\\nONE\u2122
  by TEMPUR\u00ae is ontworpen door de beste Deense ontwerpers om u het comfort en
  de kwaliteit te bieden die u van TEMPUR\u00ae verwacht. Cre\u00eber uw eigen stijl
  door uw boxspring te combineren met een van de trendy hoofdborden naar keuze. Ook
  kunt u kiezen uit een vlakke en een elektrisch verstelbare boxspring en de ONE\u2122
  by TEMPUR\u00ae matrassen.\\n\\nBekijk onze uitgebreide ONE\u2122 by Tempur\u00ae
  collectie, prijzen en alle specificaties op tempur.nl.\\n\\nONE\u2122 by TEMPUR\u00ae
  boxspring \u2022 Kleur: Stone Grey \u2022 Hoofdbord: Plain \u2022 Poten: Wooden
  Angle\\n\\nONE\u2122 by TEMPUR\u00ae Bedden\\n\\nTEMPUR\u00ae\\nA mattress like
  no other\\n\\nStel uw eigen boxspring samen in vier stappen!\\n\\nCre\u00eber uw
  eigen stijl! Kies uit een vlakke of een elektrisch verstelbare boxspring, verschillende
  matrassen, hoofdborden in diverse stijlen en \u2013 last but not least \u2013 vele
  stoffen en kleuren.\\n\\n1. Kies je boxspring\\n   Kies voor een vlakke of een verstelbare
  boxspring.\\n\\n2. Kies je matras\\n   Kies de matras die het beste bij jouw lichaam
  past: Soft, Medium of Firm.\\n\\n3. Kies je hoofdbord\\n   Kies uit het ruime aanbod
  het hoofdbord van jouw smaak.\\n\\n4. Kies je kleur*\\n   Kies je favoriete kleurstof.\\n\\n*
  De boxspring kan ook in een van deze kleuren worden gekozen.\\n** Kleur Stone Grey
  is alleen verkrijgbaar voor het hoofdbord Plain.\\n\\nONE\u2122 by TEMPUR\u00ae
  boxspring \u2022 Kleur: Stone Grey \u2022 Hoofdbord: Plain \u2022 Poten: Wooden
  Angle\\n\\nTEMPUR\u00ae\\nA mattress like no other\\n\\nTEMPUR\u00ae Bedbodems\\n\\nOntdek
  onze fascinerende slaaptechnologie\\n\\nDe TEMPUR\u00ae schotelbodems zijn speciaal
  ontwikkeld voor alle soorten TEMPUR\u00ae matrassen. Met de elektrisch verstelbare
  bedbodems kunt u de hoogte van uw matras aanpassen voor uw hoofd, lichaam en benen.
  Zo wordt uw lichaam optimaal ondersteund als u bijvoorbeeld leest, tv kijkt of uw
  voeten wat extra ontspanning wilt geven.\\n\\nDe bedbodems zijn verkrijgbaar in
  zowel vlakke als diverse elektrisch verstelbare uitvoeringen. Ze kunnen in iedere
  TEMPUR\u00ae bedombouw geplaatst worden, en vaak zelfs in een bestaande bedombouw.
  Daarnaast kunnen ze zelfs worden voorzien van diverse poten om ze zonder ombouw
  of hoofdbord te gebruiken.\\n\\nBekijk onze uitgebreide bedbodemcollectie, prijzen
  en alle specificaties op tempur.nl.\\n\\nTEMPUR\u00ae\\nA mattress like no other\\n\\nFlexibele
  schotels\\n\\nU kunt iedere individuele schotel eenvoudig draaien om de stevigheid
  naar uw persoonlijke wensen in te stellen.\\n\\nVoetzone\\n\\nVoor deze zone adviseren
  we een stevige afstelling.\\n\\nHoofdzone\\n\\nDe extra verstevigingslatten bij
  het hoofd- en voeteneind zorgen voor een stevige bedbodem.\\n\\nRugzone\\n\\nVoor
  de rugzone adviseren we een gemiddeld niveau van stevigheid.\\n\\nSchouderzone\\n\\nDe
  schouderzone bevat een extra veerelement dat voor extra comfort zorgt.\\n\\nBekijk
  onze uitgebreide bedbodemcollectie, prijzen en alle specificaties op tempur.nl.\\n\\nAccessoires\\n\\nDraadloze
  afstandsbediening\\nDe Premium Flex 2000 en 4000 bedbodems zijn uitgerust met een
  afstandsbediening. Als u een massageset en led-strips gebruikt, heeft u een vervangende
  afstandsbediening met control box nodig.\\n\\nMassageset\\nU kunt de bedbodem uitbreiden
  met een massageset. De zachte trillingen helpen om schouder- en rugspieren te ontspannen
  en geven u een relaxed gevoel.\\n\\nPoten\\nU heeft keuze uit verschillende soorten
  poten voor uw bedbodem.\\n\\nLedverlichting\\nMet een lichtstrip onder het bed cre\u00ebert
  u een stijlvol en sfeervol nachtlichteffect. Gemakkelijk te monteren en op afstand
  te bedienen.\\n\\nMatrashouders\\nMatrashouders voorkomen dat de matras verschuift.
  Een set bevat zes stuks, die u aan het voeteneind en aan de zijkanten van de bedbodem
  bevestigt. Alleen verkrijgbaar in chroomkleur.\\n\\nTEMPUR\u00ae Comfort hoofdkussens\\n\\nDe
  Comfort hoofdkussens bieden u comfort en ondersteuning in de typische kussenvorm.\\n\\n\u2022
  Klassieke kussenvorm die zich makkelijk aan uw slaapbehoefte aanpast\\n\u2022 Verkrijgbaar
  met zacht of stevig gevoel\\n\u2022 Met afritsbare en wasbare kussenhoes\\n\u2022
  Drie jaar garantie\\n\\nTEMPUR\u00ae Ergonomische hoofdkussens\\n\\nDe Ergonomische
  hoofdkussens zijn speciaal ontworpen voor mensen met een favoriete slaaphouding.
  Ook slapers die de best mogelijke ondersteuning nodig hebben, kiezen voor deze kussens.\\n\\n\u2022
  Ergonomisch gevormd voor optimale ondersteuning van nek, hoofd en schouders\\n\u2022
  Verkrijgbaar in verschillende vormen en maten\\n\u2022 Met afritsbare en wasbare
  kussenhoes\\n\u2022 Drie jaar garantie\\n\\nTEMPUR\u00ae Comfort hoofdkussens\\n\\nTEMPUR\u00ae
  Comfort Original hoofdkussen\\nDit hoofdkussen is de perfecte aanvulling voor de
  TEMPUR\u00ae Original matrassen. Het originele TEMPUR\u00ae materiaal zorgt voor
  uitstekende ondersteuning. Doordat het kussen zich precies aanpast aan uw hoofd,
  nek en schouders, kunt u zich volledig ontspannen.\\n\\nTEMPUR\u00ae Comfort Cloud
  hoofdkussen\\nDit hoofdkussen sluit perfect aan bij de TEMPUR\u00ae Cloud\u2122
  matrassen. Dankzij het TEMPUR\u00ae Extra Soft materiaal geniet u van een zachte
  eerste aanraking. Het kussen sluit vervolgens goed aan om uw hoofd en nek.\\n\\nTEMPUR\u00ae
  Ergonomische hoofdkussens\\n\\nTEMPUR\u00ae Original hoofdkussen\\nDit hoofdkussen
  zorgt ervoor dat uw hoofd, nek en schouders \u00e9\u00e9n lijn vormen met uw ruggengraat,
  zodat u altijd in de juiste slaaphouding ligt. Ook helpt dit kussen uw spieren volledig
  ontspannen. Ideaal voor rug- en zijslapers.\\n\\nTEMPUR\u00ae Millennium hoofdkussen\\nDit
  hoofdkussen is perfect voor rugslapers. Het kantelt licht naar achter, zodat het
  goed aansluit op uw nek en schouders.\\n\\nTEMPUR\u00ae Symphony hoofdkussen\\nTwee
  hoofdkussens ineen! De ene zijde maakt het mogelijk om uw schouder tegen het kussen
  te zetten, waardoor slapen op de zij extra comfortabel wordt. De andere zijde heeft
  licht gebogen zijkanten die extra ondersteuning bieden als u op uw rug slaapt.\\n\\nTEMPUR\u00ae
  Ombracio hoofdkussen\\n\\nHet unieke, gepatenteerde ontwerp van dit hoofdkussen
  met inkepingen is speciaal ontworpen voor buikslapers. Dankzij de TEMPUR\u00ae microkussens
  binnenin kunt u het kussen tegen u aandrukken, zodat u makkelijk de meest comfortabele
  slaaphouding vindt.\\n\\nSonata hoofdkussen\\n\\nDe gebogen vorm van dit hoofdkussen
  zorgt ervoor dat uw hoofd ondersteund wordt wanneer u met uw kin dicht bij uw borst
  slaapt. Ook wanneer u van de ene zijde naar de andere rolt, wordt uw hoofd continu
  ondersteund.\\n\\nTestkussen uitleenprogramma\\n\\nNiets is zo persoonlijk als een
  hoofdkussen...\\n\\nVraag bij uw TEMPUR\u00ae adviseur naar ons Testkussen Uitleenprogramma
  en probeer een kussen vrijblijvend thuis uit.* Pas als u helemaal tevreden bent,
  gaat u tot aanschaf over. Zo maakt u nooit een verkeerde keuze.\\n\\n* Uw TEMPUR\u00ae
  adviseur kan u om een borg vragen.\\n\\nProfiteer de hele dag van ondersteuning
  met TEMPUR\u00ae\\n\\nReis, werk, rust uit en profiteer de hele dag van de ondersteuning
  van TEMPUR\u00ae. U kunt kiezen uit een ruim aanbod van kwaliteitsproducten die
  geschikt zijn voor een verscheidenheid aan behoeften en activiteiten. Zo geniet
  u van een comfortabele levensstijl.\\n\\nDe meeste producten uit deze collectie
  zijn voorzien van hoezen die eenvoudig te verwijderen en te wassen zijn.\\n\\nTEMPUR\u00ae
  Oplegmatras 7 cm\\n\\nWilt u op uw eigen matras het unieke TEMPUR\u00ae gevoel ervaren?
  Gebruik dan deze hoes met gladde, dubbele jersey zijde en behaaglijke velours zijde.\\n\\nTEMPUR\u00ae-FIT\u2122
  Dekbedcollectie\\n\\nOnze dekbedden zijn gevuld met TEMPRAKON\u00ae en eendendons:
  een revolutionaire combinatie die licht en heerlijk zacht aanvoelt. Bovendien wordt
  uw lichaam in alle seizoenen op de optimale temperatuur gehouden: \u00e9\u00e9n
  dekbed voor het hele jaar.\\n\\nTEMPUR\u00ae Kussenslopen en hoelslakens\\n\\nWe
  hebben kussenslopen en hoelslakens ontwikkeld die de contouren van het kussen of
  de matras optimaal volgen. Daardoor blijven de drukverlagende eigenschappen van
  het TEMPUR\u00ae materiaal gewaarborgd.\\n\\nBekijk onze uitgebreide collectie comfortproducten,
  prijzen en alle specificaties op tempur.nl.\\n\\nTEMPUR\u00ae Slaapmasker\\nDit
  slaapmasker is gemaakt van het drukverlagende TEMPUR\u00ae materiaal. Het laat uw
  ogen optimaal rusten, zodat u nog beter kunt ontspannen tijdens uw slaap.\\n\\nTEMPUR\u00ae
  Transit reiskussen\\nDit reiskussen ondersteunt uw nek en hoofd, zodat u comfortabeler
  slaapt tijdens het reizen.\\n\\nTEMPUR\u00ae Reiskussen\\nDit reiskussen heeft dezelfde
  vorm als het TEMPUR\u00ae Original kussen, maar is half zo breed. In een reistas
  vermindert het volume met 70%.\\n\\nTEMPUR\u00ae Reisset\\nDeze lichte reisset is
  perfect voor iedereen die niet van huis weg kan zonder een TEMPUR\u00ae matras en
  kussen. Verpakt in een handige draagtas op wielen.\\n\\nTEMPUR\u00ae Fietszadeldekje\\nDit
  fietszadeldekje vormt zich naar uw contouren, biedt comfort en vermindert zadelpijn.
  Ook ideaal voor de hometrainer.\\n\\nwww.tempur.nl\\n\\nTEMPUR Sealy Benelux BV
  \u2022 Postbus 2 \u2022 3900 AA Veenendaal\\nTel. +31 (0)318 699 200 \u2022 Fax.
  +31 (0)318 699 205 \u2022 E-mail: firstname.lastname@example.org\\n\\nALLE RECHTEN
  VOORBEHOUDEN AAN DAN-FOAM APS EN TEMPUR-SEALY INTERNATIONAL. Op alle leveringen
  zijn de algemene leveringsvoorwaarden van TEMPUR Sealy Benelux BV van toepassing.
