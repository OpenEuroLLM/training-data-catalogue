  worden gehouden.\\n\\n(Foto: ANP)\"", "\">Retouradres Postbus 16375 2500 BJ Den
  Haag\\n\\nDe voorzitter van de Tweede Kamer der Staten-Generaal Postbus 20018 2500
  EA.DEN HAAG\\n\\nDatum 14 juni 2019\\n\\nBetreft Visie toekomst publiek omroepbestel:
  waarde voor het publiek\\n\\n1. Introductie\\n\\n1.1 Een toekomstbestendige publieke
  omroep\\n\\nHet kabinet staat voor een stevige publieke omroep. Een open publieke
  omroep die geworteld is in de samenleving en vanuit zijn verankering in verschillende
  maatschappelijke stromingen een pluriform, onafhankelijk en kwalitatief hoogwaardig
  media-aanbod verzorgd. Een brede omroep, die in dienst staat van gedeelde publieke
  waarden en ons daarom iedere dag vernieuwende gezichtspunten biedt op onze hele
  samenleving, niet alleen op onze eigen omgeving. Een verbindend platform voor verschillende
  overtuigingen en tegelijk een baken van kritische, betrouwbare en onafhankelijke
  informatievoorziening. Een venster op elkaar, op ons land en op de wereld.\\n\\nDe
  wereld waarin onze publieke omroep functioneert, verandert snel. Dat zet publieke
  waarden onder druk en vraagt om een omroepvoorziening die wendbaar en toekomstbestendig
  is ingericht. Maatschappelijke en technologische ontwikkelingen veranderen de manier
  waarop we toegang hebben tot informatie. Media-aanbod is al lang niet meer beperkt
  tot de lineaire kanalen alleen en dat heeft grote impact op de waarden waar de publieke
  omroep dienstbaar aan is. Er zijn nieuwe, grote spelers die de informatievoorziening
  meer en meer beheersen. Het onderstreept de relevantie van een sterke publieke omroep,
  maar stelt hem ook voor uitdagingen: kan die meekomen en zijn rol in onze samenleving
  en in de informatievoorziening op toekomstbestendige wijze vervullen? Het kabinet
  meent dat hiervoor nieuwe maatregelen nodig zijn. In deze visiebrief zet het kabinet
  uiteen vanuit welke visie dat moet gebeuren.\\n\\n1.2. Betekenis van media in het
  licht van ontwikkelingen Het is voor het functioneren van onze pluriforme samenleving
  van belang dat mensen kennis kunnen nemen en leren van elkaar, van wat ons vanuit
  onze gezamenlijke historische en culturele tradities bindt en typeert als Nederlandse
  samenleving en van de wereld om ons heen, dichtbij en ver weg. Onafhankelijke, betrouwbare
  en kwalitatief hoogwaardige media zijn daarvoor onmisbaar. Zij informeren ons over
  wat er gaande is in ons land en in de rest van de wereld en zijn de kritische volgers
  van degenen aan wie we beslissingsmacht hebben\\n\\nMedia en Creatieve Industrie
  Rijnstraat 50 Den Haag Postbus 16375 2500 BJ Den Haag www.rijksoverheid.nl\\n\\ntoevertrouwd.
  Media stellen ons in staat een mening te vormen, deel te nemen aan maatschappelijke
  discussies en te bepalen welk vakje we rood kleuren in het stemhokje. Naast opinie
  en debat zijn media een podium voor cultuuruitingen en bieden educatie en ontspanning.\\n\\nMaar
  onafhankelijke, pluriforme informatievoorziening in Nederland staat onder druk.
  Media en de toegang tot informatie worden meer en meer gedomineerd door grote en
  veelal buitenlandse commerci\u00eble ondernemingen. Informatie is niet meer alleen
  afkomstig van gevestigde en herkenbare media en journalistieke partijen, maar ook
  uit individuele en vaak anonieme bron. Mensen wachten tegenwoordig niet meer af
  wat traditionele media hen voorschotelen, maar volgen hun eigen informatiebehoefte
  en gaan actief op zoek naar hun eigen informatiemix in het enorme binnen- en buitenlandse
  aanbod. Zij doen dat op steeds grotere schaal online en steeds minder via traditionele
  lineaire kanalen. De informatievoorziening fragmenteert en individualiseert. Dat
  biedt kansen, maar stemt ook tot nadenken. Genoemde ontwikkelingen bieden kwaadwillenden
  ook mogelijkheden voor manipulatie, desinformatie en nepnieuws die tot destabilisatie
  en verdeeldheid kunnen leiden. Daar komt bij dat de Nederlandse mediasector, en
  dan met name de (onderzoeks)journalistiek, het zwaar heeft en grote moeite heeft
  tegenwicht te bieden. Dat geldt in versterkte mate voor de regio. Mediaaanbod over
  onze eigen Nederlandse sociaal-culturele diversiteit dreigt steeds minder zichtbaar
  te worden. En de wijze waarop het media-aanbod voor mensen zichtbaar wordt gemaakt,
  wordt steeds gevarieerder, complexer en daardoor minder transparant. Zo lijken niet
  de maatschappelijke en inhoudelijke relevantie, maar ondoorgrondelijke algoritmen
  en gepersonaliseerde profielen steeds vaker te bepalen wie wat en wanneer te horen
  en te zien krijgt. Risico hiervan is dat media hun verbindende kracht verliezen
  waardoor de samenhang in de samenleving en informatie daarover afnemen.\\n\\n2.
  Belang van een publieke omroepvoorziening\\n\\nZoals ik in mijn mediabegrotingsbrief
  2019 van 16 november 2018 heb geschreven, is het de taak van de overheid om actief
  de aanwezigheid van een pluriform, onafhankelijk en kwalitatief hoogwaardig media-aanbod
  dat toegankelijk is voor iedereen te waarborgen. Het bevorderen van de werking van
  onze democratische rechtstaat is daarbij niet het enige doel. Stimulering van een
  sterke Nederlandse mediasector is eveneens een belangrijk doel. Dat doet de overheid
  al sinds jaar en dag door te voorzien in een publiek omroepbestel met een brede
  programmering als basis. Soms wordt de vraag opgeworpen of dat gezien het grote
  en diverse marktaanbod nog nodig is. Het kabinet vindt van wel. In het licht van
  de hiervoor beschreven ontwikkelingen is het extra belangrijk dat er een publiek
  domein is, een herkenbare, onafhankelijke en betrouwbare bron van informatie. Een
  plek met een pluriform en onderscheidend aanbod, waar iedereen gemakkelijk terecht
  kan en iets van zijn gading vindt en die een veilige omgeving is voor het jonge
  publiek. Een plek waar programma''s gemaakt worden vanuit inhoudelijke en journalistieke
  kwaliteitsprincipes. Programma''s die verbindend zijn, niet alleen omdat ze de veelkleurigheid
  van onze samenleving tonen en ons iets leren over onszelf en over wat de ander bezighoudt,
  maar ook doordat ze daarin soms ongemakkelijk zijn. Verbindend ook omdat ze onze\\n\\ngemeenschappelijke
  Nederlandse waarden weerspiegelen of gewoon omdat we met z''n allen kijken naar
  de dodenherdenking, een troonswisseling of de prestaties van onze nationale sporters.
  En tenslotte een plek waar innovatie een kans krijgt, waar media-aanbod te vinden
  is dat anders niet vanzelfsprekend gemaakt wordt, zoals informatieve en culturele
  programmering, hoogwaardig drama en educatieve (kinder)programmering.\\n\\nDit is
  wat de publieke omroep voortbrengt: publieke waarden met een publiek belang, verbindend
  en onderscheidend, bedoeld voor alle Nederlandse burgers. In de uitvoering van deze
  functie vormt de publieke omroep een eigenstandige maatschappelijke waarde in zichzelf.
  Daar betalen mensen voor en dat geeft hen recht op een publieke omroep die onafhankelijk
  en in alle opzichten kwalitatief sterk en onderscheidend is en die niemand buitensluit.\\n\\n3.
  Maatregelen voor de toekomst: algemene uitgangspunten en doelstellingen\\n\\nDit
  kabinet staat voor een stevige en brede publieke omroep op alle schaalniveaus. 1
  Om een stevige publieke omroep ook in de toekomst te behouden zijn naar de mening
  van het kabinet nieuwe maatregelen nodig. In mijn mediabegrotingsbrief 2019 zijn
  de algemene uitgangspunten daarvoor gegeven: de publieke omroep moet geworteld zijn
  in de maatschappelijke pluriformiteit, iedereen kunnen bereiken, een stabiele financiering
  hebben, vernieuwend zijn en kunnen samenwerken. Vanuit deze uitgangspunten stelt
  het kabinet maatregelen voor die zich laten clusteren onder de volgende doelstellingen:
  versterking van een pluriforme programmering, versterking van de financieringsbasis
  en versterking van de organisatie.\\n\\nDe maatregelen uit deze visiebrief zullen
  worden vertaald in een nieuw wetsvoorstel tot wijziging van de Mediawet 2008. Vanwege
  een aantal wettelijke termijnen rond de komende concessie- en erkenningsperiode
  (zoals voor de indiening van het concessiebeleidsplan door de NPO, de teldatum voor
  ledenaantallen voor de omroepverenigingen en de indiening van erkenningsaanvragen)
  zullen parallel aan de uitwerking van deze visiebrief via een spoedwetsvoorstel
  de huidige concessie- en erkenningsduur verlengd worden met \u00e9\u00e9n jaar tot
  1 januari 2022. Het streven is om het grootste deel van de maatregelen uit deze
  visiebrief vanaf 1 januari 2021 in te laten gaan, zodat deze maatregelen, met het
  uitstel van de nieuwe concessie-/erkenningsperiode, voor de nieuwe periode hun effect
  kunnen hebben.\\n\\n4. Versterking van een pluriforme programmering\\n\\nHet kabinet
  stelt zich ten eerste ten doel de pluriformiteit van de programmering te versterken.
  Onder deze doelstelling rangschikt het kabinet diverse maatregelen\\n\\n1 Regeerakkoord\\n\\nOnze
  referentie\\n\\n8240000\\n\\ndie te maken hebben met maatschappelijke worteling
  en openheid en de wijze van programmeren en distribueren.\\n\\n4.1. Maatschappelijke
  worteling\\n\\nDe Nederlandse samenleving wordt gevormd door 17 miljoen unieke mensen,
  ieder met zijn persoonlijke achtergrond, talenten, interesses, opvattingen en dromen.
  Mensen zoeken hun weg in die maatschappij, veelal in verbanden van gelijkgestemden.
  Die verbanden kunnen voor het leven zijn en bijvoorbeeld op levensbeschouwing of
  maatschappijvisie gebaseerd. Gedurende een lange periode in de vorige eeuw werden
  veel maatschappelijke functies en activiteiten georganiseerd vanuit duidelijk te
  onderscheiden maatschappelijke, godsdienstige en levensbeschouwelijke stromingen.
  Zo zijn ook de omroepverenigingen ontstaan en op die basis is de pluriformiteit
  van ons publieke omroepbestel vormgegeven. Het totaal aan televisie- en radioprogramma''s
  vormde als vanzelf een weerspiegeling van de toen bestaande diversiteit in de samenleving.
  Het kabinet vindt dat maatschappelijke worteling van cruciaal belang is voor het
  waarborgen van een pluriform publiek media-aanbod en vindt deze zogenaamde externe
  pluriformiteit daarom nog steeds van grote waarde.\\n\\nDe maatschappij verandert
  echter voortdurend en wordt meer divers. Sommige bestaande maatschappelijke verbanden
  vallen uit elkaar, vele nieuwe vormen van saamhorigheid en betrokkenheid ontstaan.
  Mensen organiseren zich vaker op tijdelijke basis of rond bepaalde thema''s en meer
  en meer virtueel, bijvoorbeeld in communities op sociale media. Het huidige samenstel
  van omroepverenigingen en bijgevolg hun programmering is niet langer vanzelfsprekend
  de volledige weerspiegeling van de maatschappelijke pluriformiteit. Om de maatschappelijke
  worteling een steviger basis te geven en daarmee de pluriformiteit van het mediaaanbod
  te versterken, stelt het kabinet de hierna volgende maatregelen voor.\\n\\na. Andere
  legitimatiecriteria naast lidmaatschappen Lidmaatschap is tegenwoordig niet meer
  de enige manier waarop mensen hun betrokkenheid bij en sympathie voor maatschappelijke
  zaken tonen. Ook omroepverenigingen zien dat mensen op andere manieren hun waardering
  voor en betrokkenheid bij de doelen en activiteiten van de verenging tonen en daarmee
  de maatschappelijke worteling versterken. In aanvulling op de ledeneis wil het kabinet
  omroeporganisaties \u2013 ook aspiranten - vanaf de erkenningperiode die in 2027
  aanvangt hun worteling in de samenleving ook op andere manieren aan laten tonen.
  Dit kan bijvoorbeeld door andere aantoonbare vormen van interactie en binding aan
  te gaan met de achterban, door passende duurzame samenwerkingsrelaties aan te gaan
  met maatschappelijke groeperingen die op hun beurt een duidelijke worteling hebben
  in de samenleving en door aantoonbare waardering van het publiek voor het media-aanbod.
  Het kabinet zal met het College van Omroepen (hierna: CvO) en het Commissariaat
  voor de Media (hierna: Commissariaat) spreken om tot een werkbaar en objectiveerbaar
  voorstel te komen.\\nb. Een betekenisvolle ledenbijdrage Lidmaatschappen zijn nog
  steeds een waardevolle en betrouwbare uitdrukking van maatschappelijke betrokkenheid
  en draagvlak. In de praktijk wordt die\\n\\nfunctie echter op sommige punten uitgehold.
  Er was een tijd dat omroepverenigingen met grote campagnes leden wierven, met allerlei
  cadeaus en voordelen. Voor een paar euro per jaar werd je lid en je kreeg er ook
  nog de omroepgids bij. Die tijd is weliswaar voorbij, maar de vraag is of een lidmaatschap
  voor slechts EUR 5,72 per jaar nog voldoende betekenis heeft. Wil lidmaatschap als
  uiting van maatschappelijk worteling ook voor de toekomst betekenis houden, dan
  mag een substanti\u00eblere bijdrage gevraagd worden. Het kabinet wil daarom het
  minimumbedrag verhogen. De hogere drempel die dat betekent kan zich vertalen in
  lagere ledeneisen. Daarnaast zal het kabinet bekijken of het onderscheid tussen
  bijdragen voor lidmaatschap van een omroep en betalen voor een omroepgids in de
  wet verder kan worden aangescherpt. Zo is ieder lidmaatschap ook een daadwerkelijke
  uiting van draagvlak en maatschappelijke representatie. De extra inkomsten uit de
  ledenbijdrage zouden bijvoorbeeld gebruikt kunnen worden door omroepen om hun vereniging
  en profiel verder te versterken.\\n\\nc. Een open en dynamisch bestel Het is van
  groot belang dat onze publieke omroep draagvlak houdt en geworteld blijft in de
  samenleving. De openheid van het omroepbestel is daarom principieel. Wanneer een
  pluriform media-aanbod voortkomt uit de maatschappelijke worteling van omroeporganisaties,
  dan betekent dat allereerst dat het bestel open moet blijven staan voor nieuwe aspirant-omroepen.
  Nieuwkomers moeten wel kunnen aantonen dat zij voortkomen uit ontwikkelingen in
  de samenleving en een significante nieuwe bijdrage kunnen leveren aan de pluriformiteit
  van het publieke media-aanbod. Het toelaten van nieuwe omroepen moet bovendien niet
  ten koste gaan van de bestuurbaarheid van het bestel. Daarom blijft het aantal erkenningen
  voor omroeporganisaties beperkt tot 6. Inherent aan principi\u00eble openheid is
  dat organisaties na afloop van een concessieperiode het bestel dienen te verlaten
  wanneer zij niet voldoende bijdragen aan de pluriformiteit.\\n\\nExterne pluriformiteit
  brengt logischerwijs met zich mee dat omroepen vanuit hun identiteit en missie een
  scherp profiel hebben, aantoonbaar binding hebben met de samenleving, daar voortdurend
  aan werken en zich daarin blijven onderscheiden. Als bij omroepen na eenmaal toegelaten
  te zijn hun identiteit en missie verwatert, dan heeft externe pluriformiteit weinig
  betekenis. Omroepen zullen daarom ook tussentijds moeten verantwoorden hoe zij vanuit
  hun identiteit en met hun media-aanbod bijdragen aan de pluriformiteit van het bestel.
  De omroeporganisaties zijn hierop afrekenbaar met mogelijke consequenties voor de
  erkenning. Het kabinet zal met de NPO, het CvO en het Commissariaat overleggen hoe
  dit op een uitvoerbare manier vormgegeven kan worden. Vanwege de spanning tussen
  de noodzaak tot samenwerken tussen omroepen enerzijds en de noodzaak tot een scherpe
  profilering anderzijds, bekijkt het kabinet hoe samenwerkingsvormen mogelijk gemaakt
  kunnen worden waarbinnen meer ruimte is voor behoud van eigen identiteit.\\n\\nRe\u00eble
  openheid en vernieuwing veronderstelt dat de ledeneisen voor omroepen niet een onmogelijke
  opgave zijn. Op dit moment geldt voor aspirant omroepen de eis dat zij minimaal
  150.000 moeten hebben om een volwaardige erkenning te krijgen voor een volgende
  periode. Gelet op de verminderde bereidheid bij sommige groepen in de samenleving
  om zich via een lidmaatschap aan een\\n\\nomroep te binden zal dit voor de drie
  bestaande aspirant-omroepen \u2013 WNL, PowNed en HUMAN \u2013 mogelijk een moeilijk
  neembare horde zijn. Tegelijkertijd is het wel van belang dat vernieuwende initiatieven
  de kans krijgen om bij te dragen aan de publieke omroep. Daarom wil het kabinet
  voor deze groep de ledeneis voor een volwaardige erkenning voor de eerstkomende
  erkenningperiode bijstellen naar 50.000. Daarbij zullen WNL, PowNed en HUMAN wel
  aan de overige wettelijke eisen moeten voldoen, waaronder de eis dat zij hun toegevoegde
  waarde in de afgelopen periode hebben waargemaakt. Consequentie van de verlaagde
  eis is dat de toetreders met 50.000 leden een daarop afgestemd budget krijgen. Ook
  bestaande omroepen krijgen te maken met dalende ledenaantallen. De ledeneis voor
  de bestaande omroeporganisaties wordt daarom verlaagd naar 100.000 leden. De omroepen
  worden daarnaast dan wel op andere manieren afgerekend op hun maatschappelijke worteling
  en specifieke profiel. Voor nieuwe aspiranten blijft de bestaande situatie gehandhaafd.\\n\\nEen
  en ander leidt er in de ogen van het kabinet toe dat de onderlinge verhouding tussen
  de garantiebudgetten van de verschillende groepen omroeporganisaties herzien moet
  worden. Het kabinet komt hierbij uit op de volgende verhoudingsgewijze verdeling:
  aspiranten WNL, PowNed en HUMAN 0,5, stand alone omroepen 1 en samenwerkingsomroepen
  1,5.\\n\\nd. Betere benutting buitenproducenten\\n\\nExterne producenten leveren
  een belangrijke bijdrage aan de pluriformiteit. Zij maken in opdracht van de omroepen
  programma''s die aansluiten op behoeften in de maatschappij. De Nederlandse productiesector
  heeft een enorm creatief potentieel dat kan bijdragen aan programmatische innovatie.
  Dat moet beter benut worden. Om dat te stimuleren stelt het kabinet voor het minimumaandeel
  externe producties in het totale programmabudget in algemene zin te verhogen van
  16,5% naar 25%. Dit percentage wordt berekend over het totaal programmabudget, dus
  inclusief radio en online. Bij de berekening daarvan wordt nu een aantal budgetten
  volgens de Mediawet 2008 buiten beschouwing gelaten. 2 Uit deze opsomming worden
  sport en spel geschrapt, zodat het percentage over een groter budget wordt berekend.
  Dat betekent niet dat sport en spel ook door buitenproducenten geproduceerd moeten
  worden, maar werkt wel door in het aandeel dat buitenproducenten minimaal in het
  totale programmabudget moeten hebben. Voor een aantal specifieke genres, zoals drama
  en film, zal dit percentage worden verhoogd. Voor die specifieke genres wil het
  kabinet de buitenproducenten bovendien, bijvoorbeeld via een gezamenlijke co\u00f6peratie
  of via de NTR, direct toegang tot de NPO geven. Daarbij zullen specifieke eisen
  worden gesteld aan de maatschappelijke worteling van deze producties en aan de onderscheidende
  publieke waarde ervan. Maatschappelijke organisaties kunnen bijvoorbeeld in samenwerking
  met buitenproducenten programma''s ontwikkelen voor de publieke omroep. Ook omroepen
  kunnen binnen de genoemde genres programma''s blijven maken, al dan niet in samenwerking
  met buitenproducenten. De komende periode werkt het kabinet dit voorstel in overleg
  met buitenproducenten en de andere betrokken partijen verder uit.\\n\\n2 Zie artikel
  2.121 Mw: nieuws, sport, spel, reclame, kerkelijk, politiek en teletekst.\\n\\nDe
  samenwerking tussen de NPO, de omroepen en de buitenproducenten verloopt in sommige
  gevallen stroef en moet transparanter en slagvaardiger. Daarom zal het kabinet deze
  partijen verzoeken om een samenwerkingscode op te stellen, waarin uniforme afspraken
  over de onderlinge samenwerking worden gemaakt.\\n\\nGelet op de kwetsbare positie
  van makers, en tegelijk hun belangrijke bijdrage aan producties, vindt het kabinet
  het van groot belang dat zij binnen de publieke omroep een stem hebben. Het kabinet
  bekijkt of het mogelijk is om makers meer inspraak te geven.\\n\\ne. Scherper positioneren
  NTR\\n\\nDe NTR heeft een bijzondere taak in het bestel, om programma''s te maken
  vanuit een onafhankelijk en niet identiteitsgebonden perspectief. Programma''s die
  ook door omroepverenigingen verzorgd kunnen worden, zouden niet gemaakt moeten worden
  door de NTR. Daarom wordt kritisch gekeken naar de taken van de NTR om te bezien
  welke taken aan omroepen over te dragen zijn. Te denken valt aan de programmering
  voor etnische en culturele minderheden, programmering van culturele aard en consumentenvoorlichting.
  Daarnaast wordt bekeken hoe de twee taakomroepen (NTR en NOS) bestuurlijk kunnen
  samenwerken en/of samengaan, om bestuurlijke kosten en drukte te verminderen. Redactioneel
  en voor de kijker blijft een onderscheid tussen de programmering van de NTR en de
  onafhankelijke nieuwsuitzendingen van de NOS van groot belang.\\n\\n4.2 Toekomstbestendige
  programmering en distributie\\n\\na. Flexibeler programmeren: ruimte voor verschuiving
  van lineair naar online Een optimale inzet van verschillende platforms en kanalen
  kan niet zonder co\u00f6rdinatie. Deze taak ligt bij de NPO. Op dit moment zijn
  de beschikbare distributiekanalen en gegarandeerde posities van omroepen in hoge
  mate bepalend voor de manier waarop het media-aanbod geproduceerd en geprogrammeerd
  wordt. Met andere woorden: er moeten \u2013 via de zogenaamde geld-op-schema systematiek
  \u2013 verplicht netten en zenders gevuld worden. Daarbij moet de NPO er rekening
  mee houden dat aan het eind van de dag elke omroep zijn vaste aanspraken op geld
  en plaatsing op de netten en zenders gehonoreerd ziet. Dat leidt lang niet altijd
  tot een optimale programmering en distributie die effectief aansluit bij wat het
  publiek tegenwoordig belangrijk vindt. De inhoud zou leidend moeten zijn, niet de
  distributie. De centrale vraag zou moeten zijn: welk aanbod beantwoordt aan de publieke
  taken en de behoefte van het publiek. En vervolgens is de vraag hoe je dat aanbod
  het beste bij kijkers en luisteraars krijgt en om welke vormen en platforms dat
  vraagt. Er wordt bijvoorbeeld steeds meer online en non-lineair (on demand) gekeken.
  Het is dan niet logisch om eenzijdig te blijven focussen op lineaire programmering
  op netten en zenders. Media-aanbod kan ook heel goed specifiek voor online bereik
  en on demand ontwikkeld worden. Er moet slimmer geprogrammeerd kunnen worden. Dat
  vergt flexibiliteit in programmafinanciering en distributie, een andere manier van
  programmeren en investeringen in goede distributie-infrastructuur. De publieke omroep
  moet mee kunnen bewegen met het mediagebruik van zijn kijkers. Die flexibiliteit
  kan er komen door de verplichting om drie lineaire televisienetten en vijf radiozenders
  te verzorgen te schrappen. Op die manier kan\\n\\nbudget vrijkomen voor gerichtere
  programmering voor bepaalde doelgroepen die vooral via non-lineaire kanalen bereikt
  kunnen worden.\\n\\nb. Kritische bezinning op kanalen\\n\\nEen gebalanceerde distributiestrategie
  houdt rekening met het specifieke mediagedrag van doelgroepen. Jongeren zijn bijvoorbeeld
  steeds meer online te vinden. Maar er wordt ook nog altijd veel lineair gekeken.
  Maatwerk en speelruimte is nodig om actief te zijn op verschillende kanalen en platforms
  om de verschillende doelgroepen te kunnen bereiken. Dat kunnen eigen kanalen en
  platforms zijn, maar ook kanalen en platforms van derden. Vanuit het oogpunt van
  doelmatigheid moeten eigen platforms en kanalen aantoonbaar toegevoegde waarde hebben
  bij het bereiken van doelgroepen. Een groot aantal kanalen is immers geen doel op
  zichzelf. Het aantal themakanalen op radio en tv zou teruggebracht kunnen worden.
  De NPO zal in het nieuwe Concessiebeleidsplan voor de komende periode het totale
  pakket aan aanbodkanalen kritisch door moeten lichten en scherpere keuzes moeten
  maken welke kanalen voor de uitvoering van de publieke opdracht echt nodig zijn
  om iedereen, zowel een breed publiek als kleinere specifieke doelgroepen, te bereiken.\\n\\nc.
  Regulering distributievergoeding\\n\\nDe landelijke publieke omroep ontvangt een
  vergoeding van distributeurs voor doorgifte van zijn aanbodkanalen. In de huidige
  situatie komt de vergoeding tot stand op basis van onderhandelingen. Het kabinet
  onderzoekt of de totstandkoming van de vergoeding gereguleerd kan worden, zodat
  die transparanter wordt en bijdraagt aan een eerlijke vergoeding voor de programmering
  die grotendeels met overheidsbijdrage wordt gefinancierd. Hierbij wordt onder meer
  onderzocht of de vergoeding gebaseerd kan worden op basis van externe waardebepaling,
  vergelijkbaar met de waardebepaling van programmagegevens van omroepen die aan de
  markt beschikbaar worden gesteld. In 2017 heeft Ernst & Young de waarde ingeschat
  van de content van de landelijke publieke omroep. Op basis van deze externe waardebepaling
  is de verwachting gerechtvaardigd dat hierdoor de vergoeding voor de NPO in hoogte
  zal toenemen.\\n\\nGelet op het publieke belang van onze omroep wordt bezien of
  in de wet geborgd kan worden dat de apps van de NPO een duidelijk zichtbare positie
  hebben, de zogenoemde due prominence.\\n\\nd. Ruimte voor omroepen\\n\\nHet succes
  van de programmering staat of valt met de mate waarin de publieke omroep niet alleen
  een breed publiek, maar ook verschillende doelgroepen effectief weet te bereiken.
  Bovenal natuurlijk door prachtige programma''s te maken die aansluiten bij wat er
  leeft onder het publiek. Daarvoor is het nodig te weten wat de behoeften bij het
  publiek zijn. Omroepen weten dat als geen ander op basis van hun binding en interactie
  met het publiek. Ook de herkenbaarheid speelt bij het bereiken van het publiek een
  rol. Publiek zoekt herkenbaarheid vaak in de naam van de omroep en programmatitels.
  De NPO moet in het kader van de co\u00f6rdinatie van de aanbodkanalen voldoende
  ruimte geven voor beide zaken. Dat betekent dat er mogelijkheden voor omroepen moeten
  zijn om die interactie met\\n\\nhet publiek te kunnen hebben en om te kunnen kiezen
  om naast het merk \\\"NPO\\\" ook hun eigen merk of die van programmatitels te gebruiken.\\n\\ne.
  NPOStart ook voor de regio\\n\\nEen steeds belangrijker distributieplatform is de
  terugkijkdienst van de publieke omroep, NPOStart. Voor sommige groepen is dat nu
  al de primaire toegangspoort tot programma''s van de publieke omroep. De NPO krijgt
  de ruimte dat platform verder uit te bouwen. Bovendien zal het kabinet wettelijk
  verankeren dat, in samenwerking met de RPO, ook de programmering van de regionale
  omroepen beschikbaar komt voor terugkijken via NPOStart. Daar wordt door de genoemde
  partijen al aan gewerkt in nauwe samenwerking met de regionale publieke omroepen.
  Het kabinet vindt het van groot belang dat op die manier de toegankelijkheid van
  de regionale publieke mediavoorzieningen wordt versterkt.\\n\\nf. Meer publiek-private
  samenwerking\\n\\nNaast de gratis on demand service is een betaalde on demand dienst
  op hetzelfde platform beschikbaar: NPOStart Plus. Een dergelijke betaalde on demand
  dienst schuurt met het publieke karakter van de publieke omroep. Het komt soms voor
  dat programma''s die zijn gemaakt met publiek geld eerder te zien zijn voor betalende
  gebruikers. Daar wil het kabinet een einde aan maken. Tegelijk kost het geld om
  bepaalde programmarechten langer dan de wettelijk verplichte zeven dagen af te kopen.
  Het kabinet wil NPOStart Plus daarom aan striktere voorwaarden onderwerpen, zodat
  de dienst zich enkel toelegt op het langer beschikbaar houden van programma''s tegen
  een kostendekkend tarief. Bovendien zou het kabinet het wenselijk vinden dat meer
  wordt samengewerkt door Nederlandse mediapartijen om Nederlandse content gezamenlijk
  aan te bieden. Dat kan een separate betaalde dienst overbodig maken. De NPO heeft
  al ruimte om voor betaalde diensten van derden content aan te leveren, zoals nu
  het geval is met het gezamenlijke platform NLZiet. Over het vergemakkelijken en
  stimuleren van deze en andere publiek-private samenwerkingen worden nadere afspraken
  gemaakt aan de tafels van het door mij ge\u00efnitieerde overleg met publieke en
  private mediapartijen over de toekomst van het Nederlandse medialandschap. Als de
  partijen er daar niet uitkomen, zal het kabinet zelf een knoop doorhakken.\\n\\ng.
  Sterke en onafhankelijke (onderzoeks)journalistiek Een van de specifieke taken van
  de publiek omroep is de nieuwsvoorziening, via de NOS en (onderzoeks)journalistieke
  programmering. Deze journalistieke taak van de publieke omroep is van extra belang
  nu de grenzen tussen betrouwbare en onbetrouwbare informatie door verspreiding van
  desinformatie meer lijken te vervagen. De publieke omroep heeft toegevoegde waarde
  als platform voor kwaliteitsjournalistiek en betrouwbare onafhankelijke nieuwsvoorziening.
  Niet alleen voor de kijker, maar ook ter versterking van de journalistieke infrastructuur.
  Over de beschikbaarheid van gratis longreads en journalistieke tekstproducties via
  de NOS-website bestaan zorgen bij betaalde journalistieke aanbieders. Dit is ook
  aan de orde gekomen bij het door mij ge\u00efnitieerde overleg met publieke en private
  mediapartijen over de toekomst van het Nederlandse medialandschap. Het gesprek tussen
  de NOS en journalistieke aanbieders verloopt positief. In het verlengde daarvan
  zal het kabinet onderzoeken of het mogelijk is om de NOS tegen marktconforme tarieven
  een publieke en\\n\\nonafhankelijke basisnieuwsvoorziening voor audiovisueel materiaal
  te laten verzorgen, waar de journalistieke infrastructuur als geheel van kan profiteren.\\n\\nHet
  kabinet is voornemens in de wet nadrukkelijker te verhelderen dat de publieke omroep
  een specifieke taak heeft om (onderzoeks)journalistieke producties en programmering
  te verzorgen. Diepgravende journalistiek is als tegenmacht in onze democratische
  rechtsstaat onmisbaar, maar tegelijkertijd kwetsbaar in een tijd van fragiele journalistieke
  verdienmodellen. Daar ligt bij uitstek een publieke taak. De huidige opdracht daartoe
  in de wet wordt daarom aangescherpt.\\n\\nh. Wettelijke taak regionieuws\\n\\nGelet
  op de kwetsbaarheid van regionale journalistiek wordt, naast de kabinetsinspanningen
  voor een stevige publieke regionale en lokale journalistieke infrastructuur, ook
  binnen de publieke omroep de aandacht voor regionaal nieuws beter verankerd. Hiertoe
  wordt de wettelijke taak van de NOS aangevuld met aandacht voor regionaal nieuws.
  Dit sluit aan bij reeds bestaande initiatieven van de NOS. Via de pilot met regionale
  vensters wordt daarnaast ge\u00ebxperimenteerd met regionale vensters op een landelijk
  televisiekanaal. De bezinning op de inrichting van kanalen en zenders zou bovendien
  extra ruimte kunnen opleveren voor het belang van regionaal nieuws en regionale
  programmering.\\n\\ni. Beschermen van kinderen\\n\\nHet veranderd media-gebruik
  is een uitdaging voor de bescherming van jongeren en kinderen. Zij kijken steeds
  vaker online of via NPOStart naar kinderprogrammering. Een hoogwaardig aanbod van
  verantwoorde en educatieve programma''s ligt dicht bij het hart van de publieke
  taak van de omroep. Dat geldt ook voor de bescherming van kinderen tegen schadelijke
  content. Doordat de distributie van programma''s voor kinderen via online kanalen
  verloopt, is het nodig de bescherming van jonge kinderen ook op die plaatsen op
  te voeren. Het kabinet is voornemens de aanknopingspunten die nieuwe Europese regelgeving
  daarvoor biedt voortvarend ter hand te nemen. De mate van bescherming via de zelfregulering
  door Kijkwijzer mag niet worden verminderd. Daarnaast is het extra van belang kinderen
  en jongeren te beschermen tegen gepersonaliseerde advertentietechnieken.\\n\\n5.
  Versterking van de financieringsbasis\\n\\nDe reclame-inkomsten zijn vele jaren
  een stabiele bron van financiering geweest voor de publieke omroep. Aan die stabiliteit
  lijkt een einde gekomen met alle veranderingen in de mediamarkt en de teruglopende
  reclame-inkomsten. De teruglopende reclame-inkomsten hebben mij ertoe gedwongen
  om met ingang van 2019 het budget voor de landelijke publieke omroep te verlagen.
  Dit stelt de landelijke publieke omroep voor de uitdaging om zijn kostenniveau te
  verlagen. Daarnaast heb ik in mijn mediabegrotingsbrief 2019 aangekondigd dat ik
  een aantal scenario''s zal uitwerken voor een stabiele financiering van de publieke
  omroep die minder afhankelijk is van onzekere reclame-inkomsten.\\n\\na. Vergroten
  doelmatigheid\\n\\nOp basis van de raming van de Ster die ik bij mijn mediabegrotingsbrief
  2019 aan uw Kamer heb gestuurd, is bij ongewijzigde omstandigheden het scenario
  dat het beschikbare budget voor de landelijke publieke omroep de komende jaren lager
  zal zijn dan de afgelopen jaren. Deze verwachte ontwikkeling maakt het noodzakelijk
  dat de landelijke publieke omroep zijn kostenniveau verlaagt om budgettaire tekorten
  te vermijden. De navolgende tabel maakt dit inzichtelijk.\\n\\n* In deze berekening
  is geen rekening gehouden met de keuze voor een reclamescenario (d.w.z. afbouw van
  Ster-reclame).\\n\\nDe tabel laat de meerjarige ontwikkeling zien van het wettelijk
  minimumbudget ten behoeve van de landelijke publieke omroep, voor zover die wordt
  bekostigd op basis van de rijksmediabijdrage (rij 1). Het uitgangspunt hierbij is
  dat de Ster met ingang van de volgende erkenningsperiode de reclame-inkomsten direct
  afdraagt aan de landelijke publieke omroep. Deze inkomsten vormen dus geen onderdeel
  meer van het wettelijk minimumbudget. Dit wordt nader toegelicht in het volgende
  hoofdstuk van deze brief.\\n\\nDaarnaast is de verwachting dat gedurende 2022 tot
  en met 2025 middelen beschikbaar zijn in de Algemene Mediareserve die in aanvulling
  op het wettelijk minimumbudget kunnen worden aangewend ten behoeve van de landelijke
  publiek omroep (rij 2). Het totaal hiervan vormt het beschikbare budget van OCW
  ten behoeve van de landelijke publieke omroep (rij 3).\\n\\nIn aanvulling op het
  beschikbare budget van OCW (rij 3) zijn de inkomsten van de Ster beschikbaar voor
  de landelijke publieke omroep (rij 4). De raming hiervan is gebaseerd op de basisraming
  van de Ster, die is toegelicht in de mediabegrotingsbrief 2019 van 16 november.
  Het totaal van het beschikbare budget van OCW en de geraamde Ster-inkomsten (rij
  5) zijn afgezet tegen de verwachte kostenontwikkeling van de landelijke publieke
  omroep voor zover die samenhangt met het budget van OCW en de Ster-inkomsten (rij
  6). Deze raming is gebaseerd op het budget \u2013 EUR 804 mln. \u2013 dat de NPO
  in 2018 heeft aangevraagd. Het bedrag van EUR 804 mln. is jaarlijks ge\u00efndexeerd
  met kosteninflatie. De tabel laat zien dat de verwachte autonome kostenontwikkeling
  van de landelijke publieke omroep de komende jaren hoger ligt dan het beschikbare
  budget (rij 7). Dit noodzaakt de landelijke publieke omroep om zijn kosten te verlagen.\\n\\nHet
  kabinet vindt het belangrijk dat de landelijke publieke omroep de programmering
  zoveel mogelijk ontziet bij de verlaging van zijn kosten, zodat het publiek er zo
  weinig mogelijk van merkt. De landelijke publieke omroep moet zoeken naar manieren
  om de kostenverlaging van gemiddeld EUR 42 mln. (zie tabel) zoveel mogelijk te realiseren
  door verlaging van de overhead. Ik denk hierbij concreet aan bundeling van ondersteunende
  activiteiten van de NPO en de omroepen, zoals techniek, ICT en financi\u00eble administratie.
  Deze bundeling wil ik, indien noodzakelijk, faciliteren met nadere regelgeving.
  Bij bundeling van ondersteunende activiteiten laat ik HR-advies, marketing en verenigingsactiviteiten
  buiten beschouwing, omdat die nauw verwant zijn aan de identiteit van de omroep.
  Dit geldt ook voor de activiteiten die direct verband houden met de verzorging van
  het programma-aanbod omdat die tot de programmatische autonomie van de omroep behoren.
  Ik erken echter dat ook de voorgestelde invulling van de kostenbesparing voor de
  NPO en de omroepen een grote opgave betekent, die niet van de een op de andere dag
  zal zijn gerealiseerd en voor de publieke omroep significante materiele en personele
  consequenties zal hebben. Het is echter onvermijdelijk om tot een duurzame dekking
  te komen van het verschil tussen het kostenniveau en het beschikbare budget, nu
  de reclameinkomsten teruglopen.\\n\\nb. Verkleinen afhankelijkheid van reclame\\n\\nZoals
  hierboven al blijkt, zijn de Ster-inkomsten de afgelopen jaren onverwacht fors afgenomen.
  Dit leidt tot minder budget voor de landelijke publieke omroep. Maar er zijn ook
  inhoudelijke zorgen met betrekking tot de toekomst van reclame.\\n\\nDe eerste zorg
  is dat de exploitatie van reclame in de toekomst steeds meer afhankelijk wordt van
  de toepassing van data van het publiek. Dit is al het geval bij de exploitatie van
  online reclame en zal naar verwachting op termijn ook bij lineaire televisie gebeuren.
  In de Verenigde Staten wordt deze ontwikkeling aangeduid als ''programmatic TV''.
  Het kabinet vindt het niet wenselijk dat de publieke omroep meegaat in deze trend.
  De onafhankelijkheid en noncommercialiteit van de publieke omroep brengt met zich
  mee dat data van het publiek nooit gebruikt mogen worden om reclame te exploiteren
  of voor doeleinden die niets met de publieke taak te maken hebben. De publieke omroep
  dient een veilige plaats te zijn waar ook de persoonlijke gegevens of gegevens over
  kijkgedrag in veilige handen zijn. De prikkel die uitgaat van nieuwe vormen van
  (televisie)reclame verhoudt zich slecht met de publieke taak van de landelijke publieke
  omroep.\\n\\nDe tweede zorg is dat de ervaring van de afgelopen jaren leert dat
  de ontwikkeling van Ster-inkomsten niet meer goed ingeschat kan worden. Met soms
  forse budgettaire tegenvallers als gevolg. Zeer conservatief ramen kan hiertegen
  helpen, maar kan er ook toe leiden dat er onnodig hard wordt ingegrepen in het beschikbare
  budget voor de landelijke publieke omroep. De volatiliteit van de ontwikkeling van
  de reclame-inkomsten vormt zodoende een serieuze bedreiging voor een stabiele en
  voorspelbare financiering.\\n\\nHet kabinet vindt het daarom noodzakelijk om de
  afhankelijkheid van reclame af te bouwen en op termijn toe te werken naar een reclamevrije
  publieke omroep.\\n\\nMet het oog daarop heeft het kabinet voor de komende erkenningsperiode
  (20212025) een aantal scenario''s in kaart gebracht. De financi\u00eble impact van
  dit nieuwe lange termijn perspectief is groot. In het bijzonder in combinatie met
  de noodzakelijke besparingen die onder 5.a zijn beschreven, plaatst het de landelijke
  publieke omroep voor grote opgaven. Daarom is zorgvuldig gekeken naar de financi\u00eble
  impact op het beschikbare budget van de landelijke publieke omroep van verschillende
  stappen richting een minder grote afhankelijkheid van reclameinkomsten.\\n\\nDe
  volgende scenario''s zijn in kaart gebracht:\\n\\nScenario 1: kinderprogrammering
  en online\\n\\nIn het eerste scenario wordt g\u00e9\u00e9n reclame vertoond rondom
  kinderprogrammering op televisie en niet online. Dat eerste vanuit de achterliggende
  gedachte om toe te werken naar een publieke omroep met minder commerci\u00eble prikkels
  voor minderjarige kijkers. Daarnaast is, zoals in alle scenario''s, gekozen voor
  be\u00ebindiging van online reclame. Dit in verband met het uitgangspunt dat het
  gebruik van persoonlijke data om reclame te exploiteren niet past bij de waarden
  van een publiek gefinancierde omroep.\\n\\nDe totale inkomstenderving in dit scenario
  is geschat op EUR 13 mln. Hierbij wordt uitgegaan van de huidige inkomsten uit online
  reclame die nog zeer laag zijn. Extra inkomstenderving vanwege de verwachte groei
  van online reclame is hierbij niet meegenomen.\\n\\nScenario 2: voor 20:00 uur en
  online\\n\\nIn het tweede scenario wordt de bescherming van minderjarigen uitgebreid
  door uitsluitend televisiereclame toe te staan na 20:00 uur. Een uitzondering hierop
  is reclame rondom grote sportevenementen, zoals Olympische Spelen. De inkomstenderving
  in dit scenario wordt met EUR 60 mln. een stuk hoger geschat ten opzichte van scenario
  1.\\n\\nScenario 3: tv en online\\n\\nHet derde scenario is een volgende stap richting
  het volledig be\u00ebindigen van televisiereclame. Dit zal naar schatting leiden
  tot een inkomstenderving van EUR 127 mln. Dit is daarmee een aanzienlijk duurder
  scenario dan scenario''s 1 en 2.\\n\\nScenario 4: volledig reclamevrij\\n\\nDe laatste
  stap naar een volledige reclamevrije publieke omroep betekent dat ook radioreclame
  wordt afgeschaft. Dit zal voor een nog grotere derving van reclameinkomsten leiden
  ten opzichte van het voorgaande scenario, te weten EUR 161 mln.\\n\\nDe scenario''s
  maken duidelijk dat bij een reclamevrije omroep de inkomstenderving zeer fors zal
  zijn. Deze stap in \u00e9\u00e9n keer zetten, lijkt het kabinet onverstandig en
  onhaalbaar. Tegelijk wil het kabinet dit probleem niet doorschuiven, maar bezien
  hoe nu al betekenisvolle eerste stappen gezet kunnen worden om toekomstige ontwikkelingen
  het hoofd te bieden. Daarom gaat de voorkeur van het kabinet uit naar scenario 2.\\n\\nVanaf
  2020 zal de verlaagde bijdrage uit de mediabegroting met EUR 40 mln. rijksmediabijdrage
  worden verhoogd. De benodigde dekking wordt deze zomer binnen de bestaande budgettaire
  kaders ingepast en verwerkt in de Miljoenennota. Van dit bedrag zal EUR 25 mln.
  gebruikt worden voor het verder reclameluw maken van de publieke omroep (scenario
  2). De overige daarvoor benodigde financi\u00eble middelen zullen in overleg met
  de NPO en het CvO uit in deze brief genoemde mogelijkheden voor extra inkomsten
  en/of besparingen gegenereerd moeten worden, waarbij programmering nadrukkelijk
  is uitgesloten. Daarnaast zal EUR 15 mln. van de extra beschikbare rijksmediabijdrage
  worden aangewend voor (regionale) programmering.\\n\\nDe realisatie van inkomsten-
  en besparingsopties, alsmede de samenvoeging van ondersteunende activiteiten van
  de NPO en omroepen (zie paragraaf a) kunnen gepaard gaan met frictiekosten. Als
  onderdeel van nadere uitwerking zal het kabinet hierover in gesprek treden met de
  NPO en het CvO.\\n\\n6. Versterking van de organisatie\\n\\nHet publiek is gebaat
  bij een goed functionerend bestel waarbinnen effectief en effici\u00ebnt geprogrammeerd
  en geproduceerd wordt op basis van goede samenwerking. Daarnaast vragen de ontwikkelingen
  in het medialandschap om een slagvaardige publieke omroep. Daarvoor is een goed
  samenspel nodig tussen de NPO in zijn rol als co\u00f6rdinerend orgaan en de omroepen
  als leveranciers van de programma''s. Geen cultuur van wij en zij, maar een sfeer
  waarin alle partijen doordrongen zijn van het gezamenlijke belang van een sterke
  publieke omroep en de noodzaak en bereidheid om daarvoor samen te werken. Dat komt
  alleen goed tot stand als alle partijen zich senang voelen bij de gezamenlijke ambities
  en strategische doelstellingen en zich daarvoor verantwoordelijk voelen. De huidige
  rolverdeling biedt daarvoor een basis, maar de invulling ervan kan worden verbeterd.
  Het kabinet ziet in dit verband een aantal mogelijkheden voor verbetering van de
  checks and balances in het bestel.\\n\\na. Rol van het College van Omroepen (CvO)\\n\\nAls
  bestuurlijk instrument is nu geregeld dat het CvO bij belangrijke documenten zijn
  mening kan geven voordat die besluiten definitief worden vastgesteld. 3 Gebleken
  is dat omroepen in de huidige constellatie te weinig betrokkenheid en verantwoordelijkheid
  voelen bij het uitzetten van de strategische en programmatische koers. De sturende
  verantwoordelijkheid van de raad van bestuur voor de totale programmering heeft
  dat gevoel versterkt. Mede vanwege het vooruitzicht dat omroepen straks nadrukkelijker
  afgerekend kunnen gaan worden op hun bijdrage aan de pluriformiteit is een nieuwe
  balans nodig. Het kabinet treft daarvoor de volgende maatregelen:\\n\\n1. Het CvO
  krijgt een versterkt adviesrecht bij de vaststelling van het concessiebeleidsplan
  en de prestatieovereenkomst. De raad van bestuur kan alleen gemotiveerd en gehoord
  het CvO van een advies afwijken. De\\n\\n3 Het gaat dan om de vaststelling van het
  concessiebeleidsplan, de prestatieovereenkomst, de begroting, de netprofielen en
  overeenkomsten met derden.\\n\\nraad van bestuur is transparant in zijn afwegingen
  en legt die samen met het advies ter instemming voor aan de raad van toezicht. De
  raad van toezicht hoort daartoe het CvO.\\n2. De strategische en programmatische
  doelstellingen van het concessiebeleidsplan en de prestatieovereenkomst worden vertaald
  naar een jaarlijkse begroting en programmaplannen. 4 Het CvO krijgt hier een adviesrol.
  Ook hier kan de raad van bestuur alleen gemotiveerd afwijken. Omdat zich dit dieper
  in het programmeerproces afspeelt is het aan de raad van bestuur om te beoordelen
  of hierover het CvO nader gehoord wordt. Vervolgens legt de raad van bestuur de
  zaak ter instemming voor aan de raad van toezicht. Dezelfde procedure kan ook gelden
  voor de bindende regelingen van de raad van bestuur.\\n\\nDe besluitvorming moet
  wel slagvaardig kunnen plaatsvinden, obstructiemacht moet vermeden worden. Daarom
  zullen er nadere spelregels komen. Daarbij kan gedacht worden aan adviestermijnen
  en regels omtrent besluitvorming en informatieverstrekking.\\n\\nb. Rol van de raad
  van toezicht\\n\\nBij een vorige wetswijziging is de rol van de raad van toezicht
  van de NPO verbreed. De raad van toezicht ziet nadrukkelijk toe op de uitvoering
  van de gehele mediaopdracht, op alle werkzaamheden van de raad van bestuur en op
  de algehele gang van zaken binnen de publieke omroep. Bij de uitvoering van zijn
  taak dient de raad van toezicht het gemeenschappelijke belang van de landelijke
  publieke mediadienst in acht te nemen. Vanuit die positie heeft de raad van toezicht
  een verbindende rol en kan hij erop toezien dat er binnen de publieke omroep goed
  wordt samengewerkt. Het kabinet wil deze rol van de raad van toezicht verder ondersteunen.
  Dat kan door in de wet vast te leggen dat de raad van toezicht werkt met gevoel
  voor het krachtenveld waarin de publieke omroep opereert en daarbij rekening houdt
  met de belangen van de omroeporganisaties. In het verlengde hiervan stelt het kabinet
  voor in de wet te regelen dat de raad van toezicht frequent spreekt met het CvO.\\n\\nc.
  Betere en integrale sturing op inkomsten\\n\\nDe reclame-exploitatie binnen de landelijke
  publieke omroep is een gedeelde verantwoordelijkheid. De NPO is verantwoordelijk
  voor het reclamebeleid. De exploitatie is \u2013 overigens niet zonder reden - ondergebracht
  bij de Ster. De reclame-inkomsten volgen een bijzondere weg: van Ster naar mediabegroting
  en van daaruit via het Commissariaat naar de publieke omroep. Daarnaast hebben de
  NPO en de omroepen elk hun eigen inkomstenbronnen, zoals sponsoring, licentieverlening/rechtenexploitatie,
  merchandising en distributievergoedingen. Het is een wirwar aan geldstromen waar
  op dit moment geen integrale sturing en beheersing op zit. 5 Gelet op de ambitie
  van dit kabinet om op termijn naar een reclamevrije publieke omroep toe te werken,
  is het van belang deze situatie te verbeteren. Zo kan gecontroleerd worden toegewerkt
  naar een toekomstbestendige situatie. Om hierin verbetering te brengen treft het
  kabinet de volgende maatregelen:\\n\\n4 Dat zijn op dit moment de jaarplannen voor
  audio- en video.\\n\\n5 Dit blijkt uit onderzoek van Twynstra Gudde (2016) en Ernst
  & Young (2017).\\n\\n1. Met ingang van de volgende erkenningsperiode draagt de Ster
  de reclame-inkomsten direct af aan de landelijke publieke omroep. 6 Daardoor hebben
  NPO en Ster een rechtstreeks en gezamenlijk belang en kunnen knelpunten in de uitvoering
  (Ster) van reclamebeleid (NPO) sneller kunnen worden opgelost.\\n2. De activiteiten
  van de Ster worden ge\u00efntegreerd met andere inkomstengenererende activiteiten
  van de landelijke publieke omroep. Dit bevordert de doelmatigheid en vereenvoudigt
  en passant ook het toezicht voor het Commissariaat.\\nd. Transparantie: integrale
  verantwoording over doelmatigheid en doeltreffendheid\\n\\nDe werking van het bestel
  kan worden afgemeten aan de doelmatigheid en doeltreffendheid ervan. Het is daarom
  belangrijk dat de landelijke publieke omroep daarover jaarlijks transparant verantwoording
  aflegt. De publieke omroep legt nu nog op verschillende manieren en momenten verantwoording
  af. Het kabinet wil dat de NPO voortaan in \u00e9\u00e9n integrale rapportage inzicht
  geeft in de doelmatigheid en doeltreffendheid van de besteding van publieke middelen.
  Dat vergroot de transparantie en verantwoording richting de politiek en de kijker.
  Van omroepen wordt gevraagd om richting het Commissariaat vertrouwelijk inzage te
  geven in de kosten op programmaniveau.\\n\\ne.\\n\\nBundeling van toezicht\\n\\nOp
  dit moment hebben zowel de NPO als het Commissariaat toezichthoudende taken. De
  NPO ziet toe op de naleving van zijn besluiten en bindende regelingen. Het Commissariaat
  ziet toe op de naleving van de Mediawet. De toezichthoudende rol van de NPO zet
  de samenwerking binnen het bestel geregeld onder druk. Zaken worden al snel juridisch
  op de spits gedreven. Dat komt de verhoudingen niet ten goede en kost tijd, geld
  en energie die beter in het maken van programma''s gestopt kan worden. Verder rijzen
  er geregeld vragen rond de afbakening van het toezicht: wie is wanneer bevoegd.
  Het kabinet stelt daarom voor het toezicht eenduidig te beleggen bij het Commissariaat.
  Bij de uitwerking van dit voornemen zal worden gekeken naar de consequenties ervan
  voor het Commissariaat.\\n\\nf.\\n\\nIntegratie CoBO met Filmfonds\\n\\nHet Co-productiefonds
  Binnenlandse Omroep (hierna: CoBO) heeft als doel film en televisie dichter bij
  elkaar te brengen, net als podiumkunsten en televisie. Coproducties van publieke
  omroepen worden gestimuleerd door te participeren in de vorm van een financi\u00eble
  bijdrage. De coproducties waar CoBO een bijdrage aan levert, vinden plaats tussen
  een publieke omroep en een onafhankelijke filmproducent en de coproducties tussen
  een publieke omroep en een instelling op het gebied van de podiumkunsten. Om toegang
  te krijgen tot de middelen van CoBO is deelname van een publieke omroep als coproducent
  een voorwaarde. De ervaring leert dat filmproducenten zowel bij het Filmfonds als
  bij CoBO aankloppen voor een financi\u00eble bijdrage. Om de financiering voor producenten
  te vergemakkelijken en de coproductiestatus van de publieke\\n\\n6 Vergelijkbaar
  met de situatie bij de regionale publieke omroepen, die reclame-inkomsten direct
  op hun begroting bijschrijven.\\n\\nomroep niet langer verplicht te stellen \u2013
  waardoor de filmproducent meer ruimte krijgt om zijn product optimaal te exploiteren
  \u2013, wil het kabinet de filmactiviteiten van CoBO overdragen aan het Filmfonds.
  In het verlengde daarvan wordt de jaarlijkse OCW-bijdrage aan CoBO overgeheveld
  naar het Filmfonds. Het overige gedeelte blijft bij de NPO. Dat betreft met name
  de buitenlandse distributieinkomsten van de landelijke publieke omroep die worden
  ge\u00efncasseerd via CoBO.\\n\\ng. Matiging bezoldiging\\n\\nDe afgelopen jaren
  zijn stappen gezet om de salarissen van topfunctionarissen en presentatoren bij
  de publieke omroep binnen maatschappelijk verantwoorde grenzen te brengen. Onder
  andere door de aanscherpingen vanuit de Wet Normering Topinkomens (hierna: WNT)
  en het Beloningskader Presentatoren in de Publieke Omroep (BPPO). Desondanks blijft
  dit een voortdurende bron van discussie en toenemende irritatie. Het kabinet wil
  dat hier een einde aan komt en zal met de NPO spreken over verdere afbouw van het
  aantal medewerkers boven de gestelde maxima en over hoe om te gaan met constructies
  waarbij presentatoren zich \u2013 via een bedrijf - laten inhuren. Het kabinet zal
  nagaan of daarvoor via het BPPO en eventueel de Mediawet 2008 verdere maatregelen
  mogelijk zijn. Verder zal het kabinet kijken naar de bezoldigingsnormen van de WNT
  voor de mediasector. Er wordt gewerkt aan een met de sector afgestemd voorstel voor
  lagere maxima voor het media-domein. Een lager maximum zal over de hele linie van
  bezoldiging binnen de publieke omroep consequenties hebben. Het is onwenselijk dat
  publieke organisaties, zoals omroepen, topzwaar worden ingericht, met veel bestuurlijke
  grootverdieners, als de personele en budgettaire omvang daar niet bij past. Daarom
  zal het kabinet concessieverlening mede afhankelijk maken van een sobere, doelmatige
  en evenwichtige inrichting van de bestuurlijke organisatie; ook een beloningsgebouw
  dat past bij de omvang van de organisatie wordt daar in meegenomen. In het kielzog
  hiervan wil het kabinet ook kijken naar de omvang van raden van toezicht binnen
  de publieke omroep.\\n\\n7. Regionale en lokale omroep\\n\\na. NPO Regio\\n\\nOnafhankelijke
  journalistiek en een kwalitatief goed media-aanbod is van cruciaal belang op zowel
  landelijk als regionaal niveau. Juist op dat regionale niveau staat de journalistiek
  door een afname van bijvoorbeeld kranten in bepaalde gebieden onder druk. Om de
  kwaliteit op het regionale niveau te versterken zal de komende jaren verdere ontwikkeling
  van relevant, kwalitatief en onderscheidend media-aanbod met een regionaal karakter
  nodig zijn. Zowel regionale en landelijke programmamakers worden hiertoe uitgedaagd.\\n\\nDe
  regionale omroepen wordt wettelijk toegestaan om hun regionaal aanbod mede te ontwikkelen
  voor of beschikbaar te stellen aan de landelijke publieke omroep. Aan de andere
  kant kunnen de bestaande landelijke publieke omroepen een bijdrage leveren aan de
  kwaliteit van de regionale programmering. Er wordt meer ruimte gecre\u00eberd voor
  de regionale omroepen binnen de programmering van de NPO. Daarom wordt op termijn
  het derde net omgevormd tot een kanaal waarvan het zenderprofiel overwegend gericht
  is op aanbod met een regionaal\\n\\nkarakter. Naar analogie van NPO Zapp kan zo
  gebouwd worden aan een kwalitatief, sterk en herkenbaar merk: NPO Regio. Het verzorgen
  en co\u00f6rdineren van aanbod met een regionaal karakter ten behoeve van het kanaal,
  is de taak van de landelijke publieke omroep met draagvlak van de regionale publieke
  omroep. De aandacht die er is op het huidige derde net voor kinderprogrammering
  en experimenteerprogrammering gaat niet verloren en krijgt een passende plek, zowel
  lineair of non-lineair, binnen ons bestel.\\n\\nOm dit alles tot een succes te maken
  is een nauwe bestuurlijke samenwerking nodig tussen regionale en landelijke publieke
  media-instellingen. Tijdens de komende erkenningsperiode worden de eerste belangrijke
  stappen gezet, maar het vergt ook een groeipad richting de periodes daarna. We zullen
  daarom met de stakeholders in gesprek gaan hoe dit het beste vormgegeven zal worden.\\n\\nOok
  is verdere ontwikkeling noodzakelijk van relevant en onderscheidend mediaaanbod
  met een regionaal karakter door verschillende partijen. Bovendien behoeven de technische
  en financi\u00eble aspecten nadere uitwerking. Naast het voorzien in eventuele noodzakelijke
  wettelijke waarborgen, kunnen hierover in de prestatieovereenkomst met de NPO nadere
  afspraken worden vastgelegd. Op dit moment loopt tevens een pilot met regionale
  vensterprogrammering. De techniek rond regionale vensterprogrammering is veelbelovend,
  maar ook technisch en financieel gezien relatief onontgonnen gebied. Afhankelijk
  van de technische en financi\u00eble risico''s kan de techniek rond regionale vensterprogrammering
  in de toekomst mogelijk ingezet worden om het aanbod met een regionaal karakter
  deels op de regio toegesneden door te geven. Tevens moedigen we nauwere samenwerking
  tussen NOS en RPO bijvoorbeeld met initiatieven zoals \\\"Bureau Regio\\\" of het
  bieden van een platform aan de regionale omroepen in de NOS-app van harte aan. Indien
  wettelijke obstakels nauwere samenwerking belemmeren, zijn wij bereid deze te slechten.\\n\\nb.
  Versterking samenwerking regionale en lokale publieke omroepen In het regeerakkoord
  staat dat het kabinet zich beraadt op de wijze van organisatie en financiering van
  de lokale omroepen. Ter uitwerking hiervan heeft het kabinet op 12 februari 2019
  een adviesaanvraag aan de Raad voor cultuur en de Raad voor het Openbaar Bestuur
  gestuurd. 7 Het advies wordt in september 2019 verwacht. Het kabinet hecht eraan
  niet vooruit te lopen op de resultaten.\\n\\nTegelijkertijd gelooft het kabinet
  in de kansen die verdere samenwerking tussen regionale en lokale publieke omroepen
  biedt voor het vergroten van de kwaliteit en professionaliteit van lokale journalistiek.
  Het kabinet stelt daarom incidenteel EUR 15 mln. in totaal voor de jaren 2019 \u2013
  2021 beschikbaar voor verdere versterking van deze samenwerking tussen regionale
  en lokale publieke omroepen. De benodigde dekking wordt deze zomer binnen de bestaande
  budgettaire kaders ingepast en verwerkt in de Miljoenennota. Een deel van dit bedrag
  wordt aangewend voor de pilot rond streekomroepen, conform de motie Sneller c.s.
  8\\n\\n7 Zie voor deze adviesaanvraag: https://www.cultuur.nl/actueel/nieuws/adviesaanvraagorganisatie-en-financiering-lokale-omroepen/\\n\\n8
  Kamerstukken II, 2018/19, 35000 VIII, nr. 132.\\n\\nTot slot\\n\\nIn deze brief
  heeft het kabinet geschetst in welke richting zij de publieke omroep wil voorbereiden
  op de toekomst. Dat vraagt om ingrijpende keuzes, met impact op veel mensen, die
  met hart en ziel werken voor de publieke omroep. Direct en indirect. Ik vind het
  daarom van belang bij de concrete uitwerking van deze visie in de komende periode
  te blijven overleggen met de NPO, het College van Omroepen, de Ster en alle andere
  betrokken partijen. Om in verbondenheid aan een gedeelde missie te werken: een publieke
  omroep die ook op de lange termijn van publieke waarde blijft.\\n\\nDe minister
  voor Basis- en Voortgezet Onderwijs en Media,\\n\\nArie Slob\"", "\"Wehe den Hoorn,
