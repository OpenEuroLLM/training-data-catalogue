  bij: Stichting St. Jozef,\\nHewel 23, 5674 RR Nuenen (Nederland).\\nDe prijzen zijn
  excl. verzendingskosten.\\n\\nFEEST VAN DE H. CLEMENS\\n\\nTijdens een plechtige
  H. Mis op\\nZONDAG 21 NOVEMBER\\nom 11.30 uur\\nwillen wij het\\nPATROONFEEST VIERN\\n\\nNa
  de H. Mis zijn de gelovigen uitgenodigd voor een aperitief\\ntijdens een gezellig
  samenzijn in de priorij.\\nIn de namiddag willen wij een videofilm draaien over\\nhet
  werk van\\nde Priesterbroederschap St. Pius X.\\nMet het plechtige lof willen wij\\nonze
  feestdag besluiten.\\n\\nKomt talrijk!\\n\\nMijn lieve dochter,\\n\\nIk ben een
  oude man, die al aan de rand van de wereld staat en een beetje om haar gewichtigdoenijt
  en dwaasheid glimlacht. Ik bemoedig me niet graag meer met het leven van de jonge
  mensen, omdat ik weet dat jullie, jongelui, dat niet zo op prijs stellen. Maar jij
  bent mijn kind! Jou moet ik nog een brief schrijven.\\n\\nLieve Marion, je moet
  leren Advent te vieren! We zijn er niet klaar mee, dat we snel een kaars aansteken
  om haar dan weer uit te blazen. We moeten leren, stil te zijn, want dan kunnen we
  de weg tot onszelf en vooral tot God vinden. Als we daartoe in de adventstijd niet
  komen, leren we nooit goed Kerstmis te vieren. Zoals het bij jullie vorig jaar was
  mag het in ieder geval niet meer worden.\\n\\nWeet je nog hoe het was? Je hebt wekenlang
  voor het feest opgewonden gewerkt. De kinderen werden in de cr\u00e8che gebracht;
  voor je man had je geen tijd, als hij ''s avonds thuis kwam. Hij maakte zijn eten
  warm en ging dan weer weg, om in zijn vereniging te oefenen voor de kerstviering.
  Dan bracht jij de kinderen naar bed, alles gehaast en zonder echte liefde. Je hebt
  schoongemaakt, gewassen en gestreken; voortdurend schreeuwde de radio. Dan ging
  je naar bed. Dat was jullie adventstijd.\\n\\n''s Zondags hebben jullie thuis gewerkt.
  Jullie pakten ontelbare kerstcadeautjes in; dan zijn jullie uitgegaan. De kinderen
  waren meestal alleen. Ik denk dat jullie je vrienden en familieleden veel cadeaus
  hebben gegeven. Maar is dat waar het om gaat? Hebben jullie nooit bedacht, wie dat
  allemaal betaalt? - Je kinderen en - vergeef een oude man het woord - je ziel.\\n\\nToen
  ik op kerstavond bij je kwam, toonden jullie me trots wat je elkaar - geschonken
  - had: de stereo-installatie, de kostuums en japonnen. Goed, dat hoort er ook bij,
  maar is dat alles wat Kerstmis voor jullie betekent? Je hebt geen enkele keer in
  de Bijbel gelezen, je niet eenmaal in gedachten in de stemming van het grote feest
  laten brengen, geen enkel liedje hebben jullie gezongen. In de plaats daarvan zongen
  platen voor jullie, en gebeden heeft de pastoor op de televisie. Ik heb toen over
  dat alles niets gezegd. Ik dacht alleen steeds: Verbeeld ik mij dat, of is het waar?
  Aan de buitenkant hebben zij alles, maar van binnen hebben zij niets.\\n\\nKijk,
  mijn dochter, ik moest eerst stukje voor stukje loskomen van het gelingtangel dat
  de mensen van de adventstijd maken, voor ik leerde te vieren en gelukkig te zijn.
  Ik schrijf je vandaag, omdat ik graag zou willen dat je ook gelukkig werd. Maar
  daartoe moet je een paar beslissingen nemen en enkele dingen weer in het middelpunt
  van het leven plaatsen.\\n\\nLuister alsjeblieft naar een oude man: werk niet zoveel!
  Jullie hebben genoeg om van te leven. Geef de kinderen niet meer zo vaak buiten
  de deur, anders raak je ze helemaal kwijt! De hoofdzak is dat je tijd wint voor
  je kinderen, voor je man en - voor God! Ik geloof erin, dat Jezus eens zal wederkomen.
  Wat heb jij dan, als je al die dingen bezit, maar je hebt Christus niet?\\n\\nMisschien
  begrijp je me. Maar misschien denk je ook dat ik nu eenmaal een oude man ben. Dat
  ben ik ook graag. Maar neem tenminste dat eene van mij aan, dat men onderscheid
  moet maken tussen geluk en schijn. Dat wens ik jullie voor de Advent en voor Kerstmis.\\n\\nJe
  vader.\"", "\"Alpro zoekt 120 nieuwe werknemers met grote rekruteringscampagne\\n\\nOPENSTAANDE
  VACATURES 2018 (HR data 09/10/2018)\\n\\nHOE ALPRO ZORG DRAAGT VOOR HAAR MEDEWERKERS\\n\\n*
  Interessante werkvoorwaarden\\n* Ontwikkelings- en doorgroeimogelijkheden\\n* Werkzekerheid
  dicht bij huis\\n* On-the-job opleiding\\n* Doorgedreven veiligheidsprogramma\\n*
  Benefit Plan & Wellbeing Program\\n* Investeringen in een veilige, propere en moderne
  high tech werkomgeving\\n* Aanbieden van een bedrijfsfiets die geleend kan worden
  tijdens de pauzes\\n* Werken in kleine interdisciplinaire teams die dicht bij het
  management staan\\n* Boeiende jobinhoud\\n* Een positieve werksfeer\\n\\nTewerkstelling
  Alpro in Europa (FTE)\\n\\nTewerkstelling Alpro in Belgi\u00eb (FTE)\"", "\"Vernieuwingen
  in de landbouw\\n\\nIn de 18e eeuw veranderde de landbouw in Engeland volledig.
  Vooruitstrevende landeigenaren experimenteerden met nieuwe werktuigen, nieuwe gewassen
  en nieuwe methodes voor grondbereiding en veevlokken. Ze konden deze vernieuwingen
  makkelijker invoeren als ze hun boeren een flink stuk land gaven in plaats van smalle
  stroken op verschillende akkers, zoals de gewoonte was. Ook in de rest van Europa
  werden op den duur deze vernieuwingen doorgevoerd.\\n\\nNieuwe gewassen zoals knollen
  en klaver worden in schuren geborgen, omdat ze voortaan ''s winters het vee kan
  voederen in plaats van het te slachten.\\n\\nDe meeste dorpselingen kunnen niet
  genoeg voedsel voor zichzelf verbouwen en het gemeenschappelijke land verdeeld is.
  Zij hebben hun land verkocht en werken in loondienst bij een boer.\\n\\nHuis van
  de belangrijkste landeigenaar van het dorp, de landjonker. Ook hebben sommige dorpselingen
  eigen grond, maar hij bezit verreweg het meest.\\n\\nStoot om land af te wateren
  dat anders voor bouwland te nat zou zijn.\\n\\nDe landjonker heeft het grote huis.\\n\\nDeze
  boer heeft eigen land in bezit.\\n\\nDeze familie verhuist naar de stad om daar
  werk te zoeken.\\n\\nOnkruid wieden om de oogst te vergroten.\\n\\nOp deze akker
  verbouwt de boer het ene jaar tarwe, het volgende zijn knollen; in het derde jaar
  gerst en in het vierde klaver. Door deze wisselbouw blijft het land vruchtbaar.
  De boer hoeft niet langer elk derde jaar braak te liggen.\"", "\"Aan de Voorzitter
  van de Tweede Kamer der Staten-Generaal Binnenhof 4 Den Haag\\n\\nDatum 19 oktober
  2020\\n\\nBetreft Indonesi\u00eb-claims\\n\\nGeachte voorzitter,\\n\\nMet deze brief
  informeren wij u over de uitkomst van enkele gerechtelijke procedures van kinderen
  van standrechtelijk ge\u00ebxecuteerde Indonesi\u00ebrs in de periode 1945-1950
  en de gevolgen die het kabinet daaraan heeft verbonden.\\n\\nIn oktober 2019 oordeelde
  het gerechtshof Den Haag dat de Staat in voornoemde procedures geen succesvol beroep
  op verjaring ten opzichte van de kinderen kon doen. De rechtbank Den Haag kwam vervolgens
  in maart 2020 tot een inhoudelijk oordeel. 1 Daarbij zijn enkele claims afgewezen
  en enkele claims toegekend met vaststelling van schadebedragen.\\n\\nHet kabinet
  heeft zich op deze vonnissen beraden en besloten in deze zaken niet door te procederen.
  Tevens heeft het kabinet aanleiding gezien voor de kinderen een zelfde schikkingsregeling
  open te stellen als voor de weduwen. Deze regeling treft u als bijlage aan.\\n\\nKinderen
  die aannemelijk kunnen maken dat hun vader slachtoffer is van standrechtelijke executie
  zoals omschreven in de regeling komen in aanmerking voor een vergoeding. De schikkingsregeling
  voor de weduwen is eveneens verlengd, zodat deze gelijk loopt met de regeling voor
  kinderen. In die gevallen waar de eerder door de rechter toegekende bedragen lager
  liggen dan de vergoeding uit de regeling, zal de Staat de hogere vergoeding uit
  de regeling uitkeren.\\n\\n1 Vonnis gerechtshof Den Haag 1/10/2019 ECLI:NL:GHDHA:2019:2525
  en Vonnis rechtbank Den Haag 29/3/2020 ECLI:NL:RBDHA:2020:2584.\\n\\nDir. Juridische
  Zaken Rijnstraat 8 2515 AC Den Haag Postbus 20061 Nederland www.rijksoverheid.nl\\n\\nOnze
  Referentie Min.BuZa.2020.825 Bijlage(n) 1\\n\\nMet het openstellen van deze regeling
  wordt een laagdrempelig instrument aangeboden aan de nabestaanden en hopen we voor
  alle betrokkenen meer rust en duidelijkheid te bieden in de verwerking van deze
  bewogen periode.\\n\\nDe Minister van Buitenlandse Zaken,\\n\\nDe Minister van Defensie,\\n\\nStef
  Blok\\n\\nAnk Bijleveld-Schouten\\n\\nDir. Juridische Zaken\\n\\nOnze Referentie\\n\\nMin.BuZa.2020.825\"",
  "\"Sociaal en Cultureel Planbureau\\n\\nWerkprogramma 2008\\n\\n(versie 2 januari
  2008)\\n\\n1. Strategische uitgangspunten\\n3. Werkprogramma 2008 in relatie tot
  de pijlers van het Beleidsprogramma van het kabinet Balkenende IV\\n2. Thema''s\\n4.
  Sociaal en Cultureel rapport 2008\\n5. Onderzoeksprojecten naar thema\\n\\n1. Strategische
  uitgangspunten\\n\\nVan het Armoedebericht tot de Zorgvraagramingen staat het Werkprogramma
  van het Sociaal en Cultureel Planbureau in het teken van het ondersteunen van het
  beleid van de overheid, waar dat gericht is op het behoud en de verhoging van het
  welzijn en het welbevinden van de Nederlandse burger en samenleving. Met een duidelijk
  accent op de pijlers ''Sociale samenhang'' , ''Veiligheid, stabiliteit en respect''
  en ''Overheid en dienstbare publieke sector'' wil het SCP in het Werkprogramma 2008
  een bijdrage leveren aan ieder van de zes pijlers van het beleidsprogramma ''Samenwerken,
  samen leven'' van het kabinet Balkenende IV. In overleg met bijna alle departementen
  is het Werkprogramma tot stand gekomen, dat hier in hoofdlijnen aan het kabinet
  wordt aangeboden.\\n\\nHet andere aspect van het profiel, het empirische karakter
  van het werk, heeft in de ruim dertigjarige geschiedenis van het SCP steeds meer
  ook een longitudinaal karakter (ontwikkeling in de tijd) gekregen, terwijl vooral
  in de laatste tien jaar ook de internationale vergelijking , vooral met de lidstaten
  van de Europese Unie en de Verenigde Staten, steeds beter mogelijk is geworden.\\n\\nTe
  beginnen met het eerste Sociaal en Cultureel Rapport (1974) heeft het SCP als sociaalwetenschappelijk
  instituut voor onderzoek, evaluatie en advies gekozen voor een empirisch, kwantitatief
  zowel als kwalitatief , profiel met een ori\u00ebntatie op beleid waarin steeds
  de burger centraal staat. Dit betekent dat het SCP in het onderzoek niet uitgaat
  van een maatschappelijke sector, een voorziening of een regeling, maar van de individuele
  burger die er de gebruiker van is en er soms zeer van afhankelijk is. De vraag is
  dan steeds of hij in voldoende mate en ook kwalitatief goed bediend wordt.\\n\\nHet
  SCP acht een goede afstemming en samenwerking met de academische wereld van groot
  belang voor de kwaliteit van het werk. Met diverse universiteiten zijn nauwe banden.Vijf
  medewerkers van het SCP zijn als hoogleraar verbonden aan Nederlandse universiteiten:
  Prof.dr. Paul Dekker, hoogleraar Civil society, globalisering en duurzame ontwikkeling
  aan de Universiteit Tilburg; prof.dr. J. de Haan, bijzonder hoogleraar ICT, cultuur
  en kennissamenleving aan Erasmus Universiteit Rotterdam; prof.dr. F. Huysmans, bijzonder
  hoogleraar Bibliotheekwetenschap aan de Universiteit van Amsterdam; prof.dr. S.
  Keuzenkamp, bijzonder hoogleraar Emancipatie in internationaal en vergelijkend perspectief
  aan de Vrije Universiteit van Amsterdam; prof.dr. P. Schnabel, Universiteitshoogleraar
  Universiteit Utrecht.\\n\\nHet SCP is een relatief klein planbureau dat vallend
  onder de minister van VWS in de afgelopen jaren in de reeks van VWS-bezuinigingen
  en \u2013taakstellingen ruim twintig procent van zijn reguliere budget heeft moeten
  inleveren. Voor de komende jaren dreigt opnieuw een taakstelling van vergelijkbare
  omvang. Door steeds meer gebruik te maken van de mogelijkheid van projectfinanciering
  (nu al ruim een derde van de totale omzet)  konden de gevolgen van de taakstelling
  voor de werkzaamheden van het instituut tot nu toe beperkt blijven. Bij vele projecten
  is sprake van\\n\\neen combinatie van financiering door externe opdrachtgevers (departementen)
  en de inzet van eigen middelen van het SCP. Een hoog en waarschijnlijk nog verder
  toenemend aandeel projectfinanciering verandert de wijze van werken en zet onvermijdelijk
  ook de voor een planbureau zo belangrijke onafhankelijkheid onder druk.\\n\\n2.
  Thema''s\\n\\nDe werkzaamheden van het SCP zijn onder te verdelen in 16 inhoudelijke
  thema''s. Het SCP kent negen afdelingen die ieder onderzoek verrichten op meerdere
  van deze thema''s. In paragraaf 5 beschrijven we per thema de voor 2008 geplande
  onderzoeksprojecten.\\n\\n- Onderwijs en educatie\\n- Arbeid, inkomen en sociale
  zekerheid\\n- Minderheden en integratie\\n- Jeugd en gezin\\n- Emancipatie\\n- Civil
  society en sociale participatie\\n- Gebruik en productie quartaire sector\\n- Publieke
  opinie en culturele veranderingen\\n- Tijdsbesteding\\n- Sport\\n- Cultuur en media\\n-
  Wonen en mobiliteit\\n- Veiligheid\\n- Leefsituatie en leefbaarheid\\n- Zorg voor
  mensen met beperkingen en ouderen\\n- Methodologie en datakwaliteit\\n\\n3. Werkprogramma
  2008 in relatie tot de pijlers van het Beleidsprogramma van het kabinet Balkende
  IV\\n\\nVoor het Werkprogramma 2008 is in het bijzonder gekeken naar de mogelijkheden
  van aansluiting van het programma bij de in de zes pijlers van het Beleidsprogramma
  van het kabinet tot uitdrukking komende prioriteiten en aan een inpassing van al
  lopende projecten en geaccepteerde voorstellen in het pijlersysteem. Nog niet alle
  plannen hebben al een definitieve vorm, in een aantal gevallen is er nog overleg
  gaande met de departementen over de toekenning en financiering van het project.\\n\\nVeel
  van het SCP-onderzoek is gebaseerd op door het CBS verzamelde en ter beschikking
  gestelde gegevens, daarnaast zijn er nog enkele grote en met een tussenpoos van
  enkele jaren uitgevoerde surveys die het SCP zelf opstelt: het Aanvullend Voorzieningengebruik
  Onderzoek (gebruik van voorzieningen in de publieke sector), het Tijdsbestedingsonderzoek
  (een keer per vijf jaar) en het onderzoek Culturele Veranderingen (opvattingen en
  houdingen). In 2008 zal het SCP ook\\n\\nVeel van de door het SCP in 2008 uit te
  voeren projecten vloeien voort uit eerder gemaakte afspraken of verkregen opdrachten.
  Het Sociaal en Cultureel Rapport verschijnt iedere twee jaar als verplichting direct
  voortvloeiend uit het KB van 1973, dat tot de instelling van het SCP leidde. In
  oneven jaren brengt het SCP ''De sociale staat van Nederland'' uit ( een brede inventarisatie),
  in even jaren \u2013 dus ook in 2008 \u2013 een meer thematisch Sociaal en Cultureel
  Rapport. Er zijn langjarige afspraken over de opstelling van bijvoorbeeld het Jaarrapport
  Integratie, de Armoedemonitor, de Emancipatiemonitor. ''De Sociale staat van het
  platteland'' en ''Het cultureel draagvlak'' zijn meerjarige onderzoeksprogramma''s,
  die in overleg met het betreffende departement ( resp. LNV en OCW) worden uitgevoerd
  en ook in 2008 nog doorlopen.\\n\\nten behoeve van het kabinet rapporteren over
  de uitkomsten van een nieuw op te zetten (ten dele) onderzoek met behulp van enqu\u00eates
  en focusgroepen naar zorgen en maatschappelijke kwesties die leven in de bevolking
  en van belang zijn voor de politiek. Het SCP is verder direct betrokken bij het
  European Social Survey . Incidenteel worden ook andere surveys opgezet, zoals bijvoorbeeld
  het Survey Integratie Minderheden, en uiteraard wordt intensief gebruik gemaakt
  van door anderen verzamelde gegevens (OESO, Eurobarometer, Eurostat). Van de uitkomsten
  van al deze onderzoeken wordt in veel thematisch heel verschillende rapporten intensief
  gebruik gemaakt. Dat wordt hier niet specifiek vermeld voor de verschillende aan
  de pijlers van het Beleidsprogramma van het kabinet gekoppelde voorstellen en projecten.\\n\\nPijler
  1. Een actieve internationale en Europese rol\\n\\nIn 2008 zal in opdracht van het
  ministerie van Buitenlandse Zaken op de Dag van Europa (9 mei) de vijfde Europese
  Verkenning van CPB en SCP verschijnen. Het thema wordt nog nader vastgesteld in
  overleg met BZ.\\n\\nHet SCP participeert in een onderzoek naar de percepties en
  gevoelens van veiligheid van burgers in Europa. Het consortium dat dit onderzoek
  gaat uitvoeren staat onder leiding van TNO en wordt gefinancierd door de Europese
  Commissie.\\n\\nHet SCP maakt deel uit van het Central Coordinating team van het
  European Social Survey, waarin meer dan dertig landen participeren. Het ESS maakt
  op veel terreinen een vergelijking tussen landen mogelijk op het gebied van attitudes
  en opvattingen, zoals bijvoorbeeld veiligheid, vertrouwen, sociale cohesie en sociale
  zekerheid. Het SCP zal in 2008 participeren in een door de Europese Commissie gefinancierd
  vergelijkend onderzoek naar sociale integratie en discriminatie van minderheden
  op de woningmarkt. De Europese Commissie financierde ook een onderzoek naar de adequaatheid
  van de oudedagsvoorzieningen in de EU. Als co\u00f6rdinator is het SCP betrokken
  bij een EC-project naar de inkomenspositie van ouderen in de nieuwe lidstaten.\\n\\nHet
  SCP is partner in een door de Europese Commissie gefinancierd project op het gebied
  van sociale inclusie en sociale bescherming van kwetsbare groepen als immigranten
  en vluchtelingen. Het doel van het project is uitwisseling van ervaringen en resultaten
  (''best practices'') van initiatieven, met name in stedelijke gebieden, die verschillende
  EU-lidstaten op dit terrein hebben ontwikkeld.\\n\\nPijler 2. Een innovatieve, concurrerende
  en ondernemende economie\\n\\nDe bijdrage van het SCP ligt hier vooral op het gebied
  van het onderzoek naar het onderwijs. Meer dan in het beleidsprogramma van het kabinet
  gaat de aandacht daarbij vooral uit naar de tekorten in participatie aan het onderwijs:
  voortijdig schoolverlaten, de deelname (en niet-deelname) van nietwesters allochtonen
  aan het onderwijs. Daarnaast wordt, met name ook in de Emancipatiemonitor 2008 ook
  gerapporteerd over de deelname van vrouwen aan de arbeidsmarkt, de positie van de
  hoger opgeleide vrouw op de arbeidsmarkt (''het glazen plafond''), de bijzondere
  Nederlandse voorkeur voor deeltijdwerk en de mogelijkheden om de arbeidsparticipatie
  te verhogen. In samenhang daarmee is er uiteraard ook aandacht voor de voorzieningen
  ( kinderopvang) om arbeid en zorg te combineren, een onderwerp waar we de laatste
  jaren ook al veel over hebben gepubliceerd (''Hoe het werkt met kinderen?''; ''Liefst
  zoals thuis'').\\n\\nHet SCP onderkent in deze pijler ook een belangrijke sociaal-economische
  component: de positie van de lager opgeleiden op de arbeidsmarkt, het vraagstuk
  van de non-participatie, het probleem van de armoedeval en de kans om door arbeid
  te ontsnappen aan de armoede. Op deze gebieden zijn rapportages in 2008 voorzien,
  evenals op het gebied van de discriminatie op grond van etnische herkomst.\\n\\nPijler
  3. Een duurzame leefomgeving\\n\\nOp verzoek van het ministerie van LNV doet het
  SCP onderzoek naar de sociale en culturele ontwikkelingen op het platteland. De
  bedoeling is tot een monitorinstrument te komen dat op een\\n\\nbetrouwbare manier
  belangrijke veranderingen op het platteland kan signaleren. In 2008 verschijnen
  rapporten over de opvattingen over en waardering voor het platteland, waarbij zowel
  de visie van de plattelander als van de stedeling belicht zal worden. Uiteraard
  komt duurzaamheid in dit kader vooral als maatschappelijk verschijnsel aan de orde,
  als een vorm van al dan niet groeiend bewustzijn van een verantwoordelijkheid voor
  het behoud van een waardevolle en kwetsbare fysieke omgeving. In het AVO wordt ook
  gevraagd naar de kwaliteit van de woonomgeving van de burgers.\\n\\nvan het kabinet
  - dat doel heeft een duurzaamheidsmonitor te ontwikkelen.\\n\\nIn 2008 participeert
  het SCP samen met de andere planbureaus en het CBS in een project \u2013 op verzoek\\n\\nPijler
  4. Sociale samenhang\\n\\nDit is bij uitstek de pijler waar een groot deel van het
  werkgebied van het SCP bij aansluit. In  het Sociaal en Cultureel Rapport 2008 zal
  het thema sociale cohesie alle aandacht krijgen in vervolg op eerdere studies op
  dat gebied. Waar het gaat om de jeugd, is er in het bijzonder aandacht voor de socialisatie
  in het gezin, waarbij op basis van onderzoek een antwoord gezocht zal worden op
  de vraag in hoeverre de socialiserende rol van de ouders in de afgelopen jaren is
  afgenomen en hoe daar eventueel weer verandering in kan worden gebracht.\\n\\n''Een
  hoge participatie in de samenleving'' is een belangrijk beleidsdoel in de vierde
  pijler. Zowel waar het de verhoging van de arbeidsparticipatie als de maatschappelijke
  participatie betreft, bevat het SCP-werkprogramma traditioneel veel projecten die
  daar speciaal op gericht zijn. Dan gaat het zowel om de toeleiding naar de arbeidsmarkt
  (mensen in de WAO of de bijstand, vrouwen, allochtonen, gehandicapten, ouderen)
  als om de vrije en actieve deelname aan het maatschappelijk leven, het meedoen met
  sport, het verrichten van vrijwilligerswerk, enz. Sociale uitsluiting en armoede
  zijn blijvende thema''s in het SCP-werkprogramma, beide ook steeds geplaatst in
  het perspectief van (gebrek aan) sociale samenhang.\\n\\nEen belangrijk deelonderwerp
  in het kader van ''Sociale samenhang'' wordt gevormd door het vraagstuk van de integratie
  van de etnische minderheden in de Nederlandse samenleving. Op de agenda staan onderzoeken
  naar de mate van sociaal-culturele integratie en de notie van burgerschap, de interetnische
  beeldvorming ( hoe denken allochtonen over autochtonen en omgekeerd), de rol van
  de islam in het leven van vooral Turken en Marokkanen in Nederland (bijna 5% van
  de Nederlandse bevolking en ongeveer 25% van de bevolking van de vier grootste steden).
  De integratieproblematiek manifesteert zich ook in de 40 aandachtswijken die het
  kabinet heeft aangewezen en die al in 2007 onderwerp van rapportage en studie zijn
  geweest (''Aandacht voor de wijk'', ''Interventie en integratie''). Die lijn zal
  in 2008 voortgezet worden, in het bredere perspectief van enerzijds de relatie tussen
  leefpatroon, woonmilieu en sociale cohesie en anderzijds sociale veiligheid.\\n\\nHet
  expliciet genoemde thema van de beschikbaarheid van voldoende gekwalificeerd onderwijspersoneel
  komt aan de orde in projecten die meer zicht willen krijgen op de beroepsopvattingen
  van leraren en op de gevolgen van nieuwe bestuurlijke verhoudingen in het onderwijs.\\n\\nOp
  het gebied van de zorg en maatschappelijke participatie is een prominent thema in
  2008 de evaluatie van de Wet Maatschappelijke Ondersteuning. Het SCP zal het beleidsproces
  van de gemeentelijke invoering in kaart brengen en mensen met beperkingen vragen
  naar de eerste ervaringen met de WMO. Daarnaast is er een rapportage voorzien over
  de positie van ouderen (Monitor Ouderenbeleid). Over de informele zorg (mantelzorg)
  zal in vervolg op de studies van 1991 en 2003 een nieuwe ''state of the art'' worden
  uitgebracht.\\n\\nPijler 5. Veiligheid, stabiliteit en respect\\n\\nIn veel van
  het SCP-survey-onderzoek wordt een beeld gekregen van de wijze waarop de Nederlandse
  bevolking naar zichzelf, naar de samenleving en de overheid kijkt en hoe men zich
  ten opzichte van allerlei vraagstukken verhoudt. Dat komt tot uitdrukking in onderzoek
  naar discriminatie, maar ook in onderzoek naar het gebruik van geweld en naar slachtofferschap.
  In meer positieve zin gaat het om onderzoek naar de kenmerken van modern burgerschap
  , de ontwikkelingen in het maatschappelijk middenveld (draagvlak maatschappelijke
  organisaties) en de civil society in de ruime zin van het woord. Tot pijler 5 rekent
  het SCP ook zijn onderzoek naar de betekenis van informele groepen, de opvattingen
  over morele kwesties en de rol van religie en spiritualiteit.\\n\\nVeiligheid kost
  ook en naarmate het (sociale) veiligheidsbeleid steeds meer vorm aanneemt, dringt
  zich ook de vraag naar de verhouding tussen kosten en baten op. Dat geldt voor de
  bescherming tegen terroristische acties, maar ook tegen de veel algemenere beveiliging
  tegen vermogenscriminaliteit of bedreiging in de publieke ruimte. De reeks onderzoeken
  op dit gebied \u2013 zie ook ''Angstige burgers'' \u2013 zal in 2008 worden voortgezet.
  Daarin past ook het eerder genoemde Europese project naar determinanten van (on)veiligheidsgevoelens
  van burgers. Het SCP participeert in de Nationale Risico Beoordeling die plaatsvindt
  in het kader van het kabinetsprogramma Nationale Veiligheid.\\n\\nPijler 6. Overheid
  en dienstbare publieke sector\\n\\n''Het verbeteren van de bestuurlijke verhoudingen''
  en de ''verbetering van de publieke dienstverlening'' zijn de thema''s uit deze
  pijler, die ook een pendant vinden in het werk van het SCP. Het onderzoek naar de
  bestuurlijke verhoudingen in het onderwijs is al genoemd en in de verschillende
  survey-onderzoeken naar de opinie van de Nederlandse bevolking zijn de bestuurlijke
  verhoudingen en de mogelijkheid daar verbetering in aan te brengen vaste onderwerpen.
  ''Maten voor gemeenten'' biedt aanknopingspunten voor verbetering van de publieke
  dienstverlening. Dat geldt op een ander niveau zeker ook voor de zorgvraagmodellen
  die in 2008 in opdracht van het ministerie van VWS gemaakt zullen worden voor de
  verpleging en verzorging, de verstandelijk gehandicaptenzorg en de jeugdzorg. Ook
  zal het SCP als onafhankelijke derde aan VNG en het Rijk adviseren over de toereikendheid
  van het macrobudget voor de WMO.\\n\\n''Kunst en cultuur geven glans aan het bestaan''
  Voor het SCP komt dat thema vooral tot uitdrukking in het onderzoek naar het culturele
  draagvlak , de belangstelling voor en deelname van de Nederlandse bevolking aan
  culturele activiteiten, van museumbezoek tot lezen, zelf muziek maken of naar de
  bioscoop gaan. Over de trends op dit gebeid zal in 2008 gerapporteerd worden. Daarnaast
  zal er in het bijzonder ook aandacht zijn voor de digitalisering van het cultuuraanbod
  en het publiek daarvoor. In het gebruik van gedrukte, audiovisuele en digitale media
  doen zich over een korte tijdsperiode al veel verandering voor. In 2008 zal daarom
  een opvolger verschijnen van ''Achter de schermen'' (2005).\\n\\n4. Sociaal en Cultureel
  Rapport  2008\\n\\nTraditioneel biedt het Sociaal en Cultureel Rapport zowel een
  breed overzicht van de verschillende aspecten van het sociaal en cultureel welzijn
  van de Nederlandse bevolking als een diepgaande analyse van het beleid van de overheid
  op dit gebied en de reacties daarop in samenleving en maatschappij.\\n\\nHet Sociaal
  en Cultureel Rapport kent een centraal thema. In de afgelopen jaren is dat onder
  meer geweest: 25 jaar sociale verandering in Nederland, Nederland in vergelijking
  met andere Europese landen, de kwaliteit van de quartaire sector en de visie van
  de Nederlanders op de toekomst. In het SCR2008 wil het SCP in het bijzonder aandacht
  besteden aan sociale cohesie in Nederland. Projectleiding P. Schnabel.\\n\\n5 Onderzoeksprojecten
  naar thema\\n\\n5.1 Arbeid , inkomen en sociale zekerheid\\n\\nArmoedebericht 2008\\n\\nSCP
  en CBS zijn een meerjarige samenwerkingsovereenkomst aangegaan voor het uitbrengen
  van de Armoedemonitor (oneven jaren) en het beknopte Armoedebericht (even jaren).
  Eind 2008 wordt gerapporteerd in het Armoedebericht. Het CBS verzorgt deze publicatie,
  het SCP is zoals gebruikelijk verantwoordelijk voor de ramingen en enkele capita
  selecta. Projectleiding J.C. Vrooman.\\n\\nLeefsituatie van werkenden, werklozen
  en arbeidsongeschikten (1984-2007)\\n\\nIn dit project worden verschillende aspecten
  van de leefsituatie van werkenden, werklozen en arbeidsongeschikten in kaart gebracht.
  De veranderingen in de samenstelling van de beroepsbevolking en de herzieningen
  in de sociale zekerheid die de afgelopen jaren plaatsvonden maken het wenselijk
  de SCP-tijdreeks uit het onderzoek Een bestaan zonder baan (1998; gegevens uit 1984
  en 1995) te actualiseren. Op die manier wordt een unieke tijdreeks verkregen, die
  het mogelijk maakt leefsituatieaspecten over de langere termijn in kaart te brengen
  en te relateren aan sociaal-economische veranderingen. De nieuwe LWW-data worden
  door het CBS verzameld en komen in de tweede helft van 2007 beschikbaar. Rapportage
  van de trendanalyse is voorzien in 2008. Projectleiding S. Hoff.\\n\\nPositie en
  toekomst lager opgeleiden op de arbeidsmarkt\\n\\nDit betreft een doorlopend project,
  in samenwerking met de onderzoeksgroep Educatie & Minderheden. Centraal staat de
  toets van de beleidsassumptie dat de positie van lager opgeleiden in de kennissamenleving
  gedurende de komende jaren verder zal verslechteren, waardoor zij uitgesloten zouden
  kunnen raken op de arbeidsmarkt. Redenen daarvoor zouden o.a. gelegen zijn in opleidingskwalificaties
  en sociale competenties die minder goed passen bij de veranderende arbeidsvraag
  in de diensteneconomie, en in de groei van het aantal probleemleerlingen in het
  onderwijs. In 2008 wordt de voorstudie afgerond en zal een groot deel van het hoofdonderzoek
  ter hand worden genomen. Projectleiding E.J.C. Josten.\\n\\nNon-participatie op
  de arbeidsmarkt\\n\\nIn samenwerking met de Raad voor Werk en Inkomen wordt in het
  kader van het LWW-project een deelstudie uitgevoerd naar de redenen voor non-participatie
  op de arbeidsmarkt. Hierbij wordt onder meer gekeken naar opvattingen over de combinatie
  van arbeid en zorg. Over dit deelproject zal eind 2007, begin 2008 in een afzonderlijk
  publicatie worden gerapporteerd. Projectleiding P.E. van Echtelt.\\n\\nOorzaken
  be\u00ebindigen en bestendigen armoede\\n\\nOp verzoek van het ministerie van Economische
  Zaken wordt in het kader van het LWW-project een deelstudie uitgevoerd die zich
  richt op het vaststellen van de oorzaken van het be\u00ebindigen en bestendigen
  van armoede, afgemeten aan de lage-inkomensgrens. Het OBBA-deelproject zal uitmonden
  in een afzonderlijke publicatie die naar verwachting medio 2008 verschijnt. Projectleiding
  S.J.M. Hoff.\\n\\nSociale uitsluiting\\n\\nOp basis van het nieuwe LWW-bestand zal
  de sociale-uitsluitingsmaatstaf die in een SCP-studie uit 2004 is ontwikkeld worden
  geactualiseerd voor bevolking jonger dan 65 jaar. Dit maakt het naar verwachting
  mogelijk de veranderingen van de laatste jaren in kaart te brengen. Rapportage is
  voorzien in 2008. Projectleiding G.J.M. Jehoel-Gijsbers.\\n\\nArmoede en sociale
  uitsluiting bij kinderen\\n\\nIn september 2007 bracht het SCP op verzoek van de
  PvdA-fractie in de Tweede Kamer een notitie uit over armoede en sociale uitsluiting
  bij kinderen. Aan dit thema wordt ook een hoofdstuk gewijd in de Armoedemonitor
  2007. Mogelijk leidt dit in 2008 tot vervolgonderzoek. Projectleiding: C. Vrooman.\\n\\nMethodische
  verkenningen armoede en sociale uitsluiting\\n\\nTen behoeve van het project Armoedemonitor/Armoedebericht
  zullen \u2013deels afhankelijk van financieringsmogelijkheden\u2013 ook enkele methodische
  verkenningen met betrekking tot armoede worden uitgevoerd. Dit behelst onder andere
  een verdere uitwerking en onderbouwing van de methodiek van de onlangs gepresenteerde
  nieuwe armoedegrens, en de informatievoorziening ten aanzien van chronisch zieken,
  arme kinderen, en schulden. Projectleider J.C. Vrooman. In samenwerking met het
  CBS zullen de methodische aspecten van de sociale uitsluitingsmaatstaf van het SCP
  worden verkend, dit ten behoeve van de discussie over indicatoren op EU-niveau.
  Projectleiding G.J.M. Jehoel-Gijsbers.\\n\\nTevreden met pensioen?\\n\\nDe in de
  toekomst te verwachten groei van het aantal gepensioneerden maakt het belangrijk
  te weten hoe hun inkomenspositie is, in hoeverre zij tevreden zijn met hun pensioen,
  en welke verklarende factoren hierbij van belang zijn. Dit is een doorlopend project;
  het streven is het project in de tweede helft van 2009 te doen uitmonden in een
  proefschrift. Projectleiding A.J. Soede.\\n\\nAdequacy of old-age income maintenance
  in the EU\\n\\nSinds 2005 neemt de onderzoeksgroep deel aan een landenvergelijkend
  project naar de adequaatheid van de toekomstige inkomensbescherming van gepensioneerden.
  Het project duurt drie jaar, en wordt uitgevoerd door een consortium van 14 deelnemers,
  dat grotendeels bestaat uit leden van het ''European Network of Economic Policy
  Research Institutes'' (ENEPRI). Het project wordt gefinancierd door de Europese
  Commissie vanuit het zesde kaderprogramma en naar verwachting in 2008 afgerond.
  Projectleiding J.C. Vrooman.\\n\\n5.2 Onderwijs en educatie\\n\\nSchool- en wijkeffecten
  bij voortijdig schoolverlaten\\n\\nOver de invloed van kenmerken van scholen en
  van kenmerken van wijken op voortijding schoolverlaten is weinig bekend. Gegevens
  afkomstig uit het integrale leerlingnummerbestand van OCW/CFI en informatie over
  de scholen die de Inspectie verzamelt, moeten hierover meer duidelijkheid geven.
  Lopen leerlingen in grote scholen een hoger risico van schooluitval? Is er sprake
  van concentratie-effecten (een nadelige invloed van een hoge concentratie van leerlingen
  uit risicogroepen)? Wat zijn de kenmerken van scholen die er in slagen zo veel mogelijk
  leerlingen binnen boord te houden? Lopen leerlingen in bepaalde wijken extra risico''s
  in het onderwijs? Project is gestart in 2007 en wordt in de eerste helft van 2008
  afgerond. Projectleiding L. Herweijer.\\n\\nNieuwe bestuurlijke verhoudingen in
  het onderwijs\\n\\nDit onderzoek belicht hoe de verschillende bij de school betrokken
  partijen in de praktijk concreet invulling geven aan de nieuwe bestuurlijke verhoudingen
  in het onderwijs. Welke veranderingen zijn er opgetreden in de onderlinge samenwerking
  en rolverdeling tussen bijvoorbeeld de gemeente, het schoolbestuur, de schoolleiders,
  ouders, leerlingen (als stakeholders) en welke externe partijen heeft de school
  erbij betrokken. Wat is volgens de betrokkenen de winst (of eventueel het verlies)
  van de nieuwe situatie? Start begin 2008. Projectleiding M. Turkenburg.\\n\\nOnderzoek
  leraren voortgezet onderwijs\\n\\nOp grond van een grootschalig kwantitatief onderzoek
  wordt begin 2008 gerapporteerd over beroepsopvattingen van leraren. Deze studie
  krijgt een vervolg via twee kwalitatieve studies: (1) onderzoek naar de opvattingen
  van leraren over onderwijsvernieuwingen zoals ''het nieuwe leren''; (2) studie naar
  de leraar als professional, en meer in het bijzonder op de visie van leraren op
  lesgeven, hun plezier en frustratie in het werk, de samenwerking met collega''s
  en leidinggevenden binnen de school, en hun activiteiten rond de eigen scholing
  en ontwikkeling. Medio 2008 aanvang van kwalitatieve studies. Projectleiding R.
  Vogels.\\n\\n5.3 Minderheden en integratie\\n\\nIntegratie-interventies 2008 en
  bijdragen Jaarrapport Integratie 2008\\n\\nVoor dezelfde directie (DI&I) zal in
  de vorm van enkele hoofdstukken een bijdrage worden geleverd aan het Jaarrapport
  Integratie 2008, dat in dit jaar onder regie van het CBS wordt uitgevoerd. Aanvang:
  eerste kwartaal 2008. Projectleiding M. Gijsberts.\\n\\nIntegratie-interventies
  verwijzen naar beleidsmaatregelen die beogen de integratie van allochtone bevolkingsgroepen
  te verbeteren. Op verzoek van de Directie Integratie en Inburgering (DI&I) wordt
  in 2008 een studie uitgevoerd waarin voor een nader te bepalen onderwerp interventies
  worden ge\u00efnventariseerd. Twee vragen moeten worden beantwoord: wat is er en
  wat werkt? Het gaat om een inventarisatie van beleidsmaatregelen in Nederland en
  daarbuiten.\\n\\nDiscriminatiemonitor allochtonen op de arbeidsmarkt\\n\\nOp verzoek
  van het ministerie van Sociale Zaken en Werkgelegenheid voert het SCP onderzoek
  uit naar arbeidsmarktdiscriminatie van allochtonen. Dit project is in 2007 gestart
  en loopt door tot en met 2009. In 2008 zal een verdiepende studie worden uitgevoerd.
  De gekozen thematiek is mede afhankelijk van de uitkomsten van de discriminatiemonitor
  van 2007 en zal nog nader worden bepaald. Uitvoering start na verwachting in het
  eerste kwartaal van 2008. Projectleiding J. Dagevos.\\n\\nInternationaal vergelijkend
  onderzoek arbeidsmarktdiscriminatie, etniciteit en gender In samenwerking met de
  Vrije Universiteit zal in de komende vier jaar een promotie-onderzoek worden uitgevoerd
  naar de betekenis van arbeidsmarktdiscriminatie voor de positie van allochtone vrouwen
  in Nederland en Duitsland. Projectleiding S. Keuzenkamp (SCP/VU) en J. Dagevos.\\n\\nSociale
  inclusie en sociale bescherming\\n\\nSCP is partner in een door de Europese Commissie
  gefinancierd project op het gebied van sociale inclusie en sociale bescherming van
  kwetsbare groepen als immigranten en vluchtelingen. Het doel van het project is
  uitwisseling van ervaringen en resultaten (''best practices'') van initiatieven,
  met name in stedelijke gebieden, die verschillende EU-lidstaten op dit terrein hebben
  ontwikkeld, nationaal, regionaal of lokaal. Start januari 2008, afronding 2009.
  Projectleiding: R.V. Bijl.\\n\\n5.4 Emancipatie\\n\\nEmancipatiemonitor 2008\\n\\nOp
  verzoek van de co\u00f6rdinerend minister voor het emancipatiebeleid brengt het
  SCP samen met het CBS tweejaarlijks de Emancipatiemonitor uit. In 2008 zal wederom
  een nieuwe editie worden uitgebracht. Thema''s die in elk geval aan bod komen zijn:
  onderwijs, arbeidsdeelname en de combinatie van arbeid en zorg, inkomen, het aandeel
  van vrouwen op besluitvormende posities en geweld tegen meisjes en vrouwen. Verschijnt
  eind 2008. Projectleiding A. Merens.\\n\\nVerklaringsmodel onbetaalde arbeid\\n\\nParticipatie
  is \u00e9\u00e9n van de sleutelbegrippen in het Coalitieakkoord. Daarbij gaat het
  niet alleen om betaalde arbeid maar ook om onbetaalde arbeid middels vrijwilligerswerk,
  kinderopvang, huishoudelijke verzorging en mantelzorg. In dit project worden allerlei
  aspecten bestudeerd die de keuze voor betaald en onbetaald werk be\u00efnvloeden.
  Dit project is een uitvloeisel van een verzoek van het ministerie van SZW om de
  relatie tussen betaalde en onbetaalde arbeid verder te onderzoeken. Projectleiding:
  I. Ooms.\\n\\nDeeltijdwerk\\n\\nOp verzoek van het ministerie van Sociale Zaken
  en Werkgelegenheid zal er al eerder (in januari 2008) een deelpublicatie uitkomen,
  die bestemd is voor de Taskforce Deeltijd Plus. Hierin wordt vooral ingegaan op
  de rol van culturele factoren die een rol spelen bij de keuze voor deeltijdwerk.\\n\\nHoewel
  de arbeidsparticipatie van vrouwen in de afgelopen decennia sterk is toegenomen,
  gaat het vooral om deeltijdbanen. Via het vergroten van de omvang van de arbeidsduur
  van met name vrouwen kan het draagvlak voor de financiering van de verzorgingsstaat
  worden vergroot. In 2007 is een project gestart dat antwoord zal geven op de vraag
  wat de oorzaken zijn van het veelvuldig in deeltijd werken van Nederlandse vrouwen
  en welke mogelijkheden er zijn om de gemiddelde arbeidsduur te verhogen. Geplande
  verschijning: mei/juni 2008. Projectleiding W. Portegijs.\\n\\nArbeidsdeelname van
  laagopgeleide vrouwen\\n\\nLaag opgeleide vrouwen nemen relatief weinig deel aan
  de arbeidsmarkt en maken relatief weinig gebruik van formele voorzieningen voor
  het combineren van arbeid en zorg. In een onderzoek dat in samenwerking met de Universiteit
  van Utrecht wordt uitgevoerd, wordt gezocht naar een verklaring hiervan. De aandacht
  gaat uit naar sociaal-economische en sociaal-culturele factoren. Het project zal
  in 2009 uitmonden in een proefschrift (M. Clo\u00efn).\\n\\n5.5 Jeugd en gezin\\n\\nSocialisatie
  in het gezin\\n\\nVeel van het gedrag wordt aangeleerd in de jeugdfase. Wat ouders
  doen en laten, wat zij ''voorleven'' en welke waarden en normen zij overdragen,
  zijn belangrijke socialiserende factoren. Men kan zich afvragen in hoeverre de invloed
  van ouders op hun kinderen in de afgelopen decennia is afgenomen, ten gunste van
  andere socialiserende agenten. Met behulp van onderzoek waarin zowel over ouders
  als kinderen gegevens zijn verzameld, wordt bezien in hoeverre do socialiserende
  rol van de ouders in de afgelopen jaren is afgenomen. Doorlooptijd: november 2007
  \u2013 december 2008. Projectleiding E. Zeijl.\\n\\nVraagmodel jeugdzorg\\n\\nDe
  positie van jeugd en gezin vormt \u00e9\u00e9n van de belangrijke aandachtsgebieden
  van het huidige kabinetsbeleid. Vooral problemen rond de opgroeiende jeugd wil het
  kabinet met kracht ter hand nemen middels een brede aanpak van zorg en bescherming.
  Daarvoor is een adequaat inzicht nodig in de achterliggende problematiek en de mate
  waarin de overheid, met name de jeugdzorg, kan voorzien in de vraag naar ondersteuning.
  Hiervoor ontwikkelt het SCP in opdracht van het ministerie van VWS een vraagmodel
  voor (ge\u00efndiceerde) jeugdzorg.  De ontwikkeling van het vraagmodel vindt gefaseerd
  plaats in een periode van vier jaar. Het onderzoek wordt in samenwerking met de
  afdeling QS uitgevoerd. Projectleiding R. Gilsing.\\n\\n5.6 Civil society en sociale
  participatie\\n\\nEuropese civil society.\\n\\nDe onderzoeksgroep zal in 2008 tijd
  besteden aan twee projecten van het Cinefogo (civil society and new forms of governance)
  Network of Excellence: in de vorm van een landenvergelijkend project over sociale
  en politieke participatie en als mede-organisator het boekproject ''The civicness
  of the third sector'' (P. Dekker). Daarnaast zal in Cinefogoverband door het SCP
  het voortouw worden genomen om in 2008 een werkconferentie te organiseren over ''Religion
  and civil society'' (in 2009 af te ronden met een publicatie) (J. de Hart en P.
  Dekker). Verder werkt de onderzoeksgroep i.s.m. UvA als Nederlandse partner mee
  aan een voorstel de ontwikkeling van de Europese civil society, ge\u00efnitieerd
  door het Noorse Institute for Social Research. Pas in 2008 zal duidelijk worden
  of dit voorstel wordt gehonoreerd. Projectleiding P. Dekker.\\n\\nOntwikkelingen
  in het maatschappelijk middenveld.\\n\\nAls vervolg op eerder SCP-onderzoek is in
  2007 begonnen met de actualisering van gegevens over grote maatschappelijke organisaties
  (inclusief verbanden met lokale organisaties) inclusief nieuwe data over hun Europese
  dimensie en de positie van minderheden en een verkenning van actuele problemen.
  Deze onderzoeksfase wordt begin 2008 met een korte rapportage afgesloten. Het daarop
  volgende verdiepende onderzoek is afhankelijk van de thematiek van het Sociaal en
  Cultureel Rapport 2008). Geen externe financiering. Projectleiding J. de Hart.\\n\\n5.7
  Publieke opinie en culturele veranderingen\\n\\nNieuwe spiritualiteit.\\n\\nDit
  in 2008 te starten onderzoek is gericht op het ontstaan van nieuwe, buitenkerkelijke
  vormen van spiritualiteit en de vraag hoe deze zich verhouden tot deelname aan de
  civil society, hetzij via kerkelijke gemeenschappen, hetzij via nieuwe vormen van
  saamhorigheid. Daarmee kan een belangrijke aanvulling gegeven worden op eerdere
  SCP-analyses, die vrijwel uitsluitend gericht waren op de maatschappelijke betekenis
  van kerkelijkheid. Gebruik zal o.a. worden gemaakt van gegevens uit de onderzoeken
  God in Nederland 1966-2006 en Culturele veranderingen 1997-2006. Het onderzoek vindt
  plaats in samenwerking met het ministerie van Binnenlandse Zaken ten behoeve van
  zijn strategische beleidsagenda. In de loop van 2009 is een publicatie gepland.
  Projectleiding J. de Hart.\\n\\nEuropese verkenning 6.\\n\\nUit te brengen op Europadag
  (9 mei). Evenals voorgaande versies wordt deze verkenning samen met het CPB gemaakt
  op verzoek van het ministerie van Buitenlandse Zaken (convenant 2007-2010). Het
  thema in 2008 is ''Nieuwe buren'' (buurlanden van de EU). Los van onze bijdrage
  daaraan, zal de publieke opinie over de EU opnieuw een belangrijk onderwerp zijn.
  Daarbij zal dit jaar ook aandacht worden besteed aan de rol van maatschappelijke
  organisaties in de meningsvorming. Na de Europese verkenning zal aan het onderwerp
  ''middenveld en meningsvorming over Europa'' meer aandacht worden besteed ten behoeve
  van een afzonderlijke publicatie. Gefinancierd door BZ, projectleiding P. Dekker.\\n\\nTuinen
  en tuinieren als factor in de kwaliteit van de sociale leefomgeving\\n\\nIn het
  kader van het overkoepelende thema ''De ongekende burger'' van het ministerie van
  BZK is een essay gepland over de sociale functies van het tuinieren, waaronder het
  bij de aandacht vooral zal uitgaan naar volkstuinieren. Er zal ingegaan worden op
  veranderingen in de tuinbeleving tegen de achtergrond van maatschappelijke verschuivingen,
  op de tuin als pendant van ontwikkelingen op woon- en bouwgebied, en op tuinbeleving
  als bron van sociaal kapitaal en leefstijlkenmerk. Het materiaal zal o.a. ontleend
  worden aan omzetcijfers en klantenonderzoeken van tuin(meubel)zaken, observaties,
  interviews en fotografische vastlegging in enkele wijken, TBO gegevens, andere enqu\u00eates
  en eerdere onderzoeken. Publicatie: eerste helft van 2009. Auteurs: J. de Hart en
  J. Kullberg.\\n\\nPublieke opinie en de Europese integratie\\n\\nDit aan de ''Europese
  verkenning'' (zie 5. periodieke rapportages) gerelateerde promotieonderzoek zal
  in 2008 worden voortgezet, onder andere met een experiment om de veranderlijkheid
  van opvattingen in enqu\u00eates na te gaan. Afronding van de dissertatie is gepland
  voor 2009.\\n\\nPublieke opinie en politiek\\n\\nIn 2008 zal worden gewerkt aan
  het ontwikkelen van attitude-indicatoren waarmee landen vergeleken kunnen worden
  en ontwikkelingen in de tijd kunnen worden gevolgd. Deze indicatoren liggen op uiteenlopende
  terreinen als gepercipieerde onveiligheid, vertrouwen in de politiek en instellingen
  en sociale cohesie. De ontwikkeling van attitude-indicatoren maakt deel uit van
  het project European Social Survey Infrastructure - Improving Social Measurement
  in Europe 2006-2010 (zie hieronder). Het SCP werkt in dit project samen met het
  Centre for Comparative Social Surveys, City University in Londen en een groot aantal
  internationale experts. Projectleiding: I. Stoop.\\n\\nContinu onderzoek Burgerperspectieven.\\n\\nDit
  onderzoek vindt plaats in opdracht van AZ/VoRa en kan worden gezien als opvolger
  van de Belevingsmonitor Rijksoverheid (2003-2006). In de laatste maanden van 2007
  wordt het verder ontwikkeld en vindt een pilot plaats. Vanaf 2008 zullen met kwartaalpeilingen
  (kleine bevolkingsenqu\u00eates en enkele focusgroepen) ontwikkelingen in persoonlijke
  en maatschappelijke aspiraties en zorgen en verwachtingen van de politiek worden
  gevolgd en geanalyseerd. Dit zal resulteren in korte kwartaalberichten en in een
  jaarlijkse studie, waarin onderwerpen worden uitgediept (bevolkingssegmenten, onderstromen,
  landenvergelijking) en waarvoor ook ander onderzoeksmateriaal zal worden gebruikt.
  Gefinancierd door AZ. Projectleiding P. Dekker.\\n\\nPolitieke veranderlijkheid:
  De ongekende burger 2.\\n\\nEen korte beschouwing over veranderingen in politieke
  houdingen op basis van herhaalde enqu\u00eates, focusgroepen en individuele interviews
  2002-2007. Dit project wordt begin 2008 afgerond. Cofinanciering door het ministerie
  van BZK. Projectleiding P. Dekker.\\n\\n5.8 Gebruik en productie quartaire sector\\n\\nMaten
  voor gemeenten 2008\\n\\nGemeenten leveren een breed scala aan diensten op uiteenlopende
  gebieden. De rapportage  die het SCP sedert 2001 elk jaar in november op verzoek
  van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties (BZK) opstelt,
  geeft op landelijk niveau een overzicht van de prestaties van gemeenten, en van
  de kosten die daarmee gemoeid zijn. Het rapport biedt een ondersteuning voor het
  jaarlijkse bestuurlijk overleg. Projectleiding: B. Kuhry.\\n\\nProfijt van de overheid
  in 2007\\n\\nElke 4 jaar rapporteert het SCP over het profijt dat burgers hebben
  van de overheid door gebruik van publieke voorzieningen. Daarbij gaat het om voorzieningen
  op het gebied van  onderwijs, zorg, volkshuisvesting, cultuur, openbaar vervoer
  en dienstverlening. In 2008 zal het profijt voor het jaar 2007 in beeld worden gebracht.
  Daarbij zullen ook de inkomsten van de overheid als negatief profijt worden betrokken.
  Het gaat hierbij om verbruiksbelastingen, milieubelastingen,  woningbelastingen
  en autobelastingen.  Dit project zal medio 2009 worden opgeleverd. Projectleiding:
  E. Pommer.\\n\\nPublieke middelen goed besteed?\\n\\nIn de periode 1995-2005 is
  het volume van de publieke dienstverlening gemiddeld veel langzamer gestegen dan
  dat van de marktsector geproduceerde goederen en diensten. Daarentegen stegen de
  kosten sterker dan die van de marktsector. Dit impliceert dat de relatieve kostprijs
  van publieke diensten aanzienlijk is toegenomen. Tegelijkertijd blijft in de publieke
  opinie, in de pers en in de politiek de indruk bestaan dat het niveau van de zorg
  en de kwaliteit van de dienstverlening niet toereikend is. In deze publicatie wordt
  getracht om meer zicht te krijgen op de besteding van publieke middelen en een verklaring
  te vinden voor de genoemde tegenstrijdigheden. Maar eerst wordt een beeld geschets
  van de historische ontwikkeling van de kosten van publieke dienstverlening. Projectleiding:
  B. Kuhry.\\n\\nPublic sector performance revised\\n\\nDe publicatie Public sector
  performance, an international comparison (2004), heeft nationaal en internationaal
  veel belangstelling getrokken en trekt nog steeds belangstelling. Er is behoefte
  aan actualisering van de gegevens en verbetering van het analysemodel. Een verhoging
  van de wetenschappelijke kwaliteit en de diepgang van de analyse is mogelijk. Ook
  kan gebruik worden gemaakt van de verbeterde cijfers die op een aantal terreinen
  beschikbaar zijn gekomen (o.a. nieuwe gegevens over onderwijsvaardigheden, nieuwe
  Crime Victim Survey, nieuwe cijfers over uitgaven Law en Order). Dit zou in een
  samenwerkingsverband kunnen plaatsvinden tussen instellingen als de OECD, het Deutsches
  Institut f\u00fcr Wirtschaftsforschung en de Universiteit van Leuven. Projectleiding:
  B. Kuhry.\\n\\n5.9 Tijdsbesteding\\n\\nSociale context van tijdsbesteding\\n\\nIn
  het kader van het tijdsbestedingsonderzoek (zie Periodieke rapportages) richten
  we in 2008 de aandacht op de sociale context van de tijdsbesteding. Door het toevoegen
  van een nieuwe codering in de vragenlijst van het Tijdsbestedingsonderzoek TBO kan
  voor het eerst in de Nederlandse gegevens over tijdsbesteding nagegaan worden met
  wie men de tijd doorbrengt. Doorlooptijd: oktober 2008 \u2013 september 2009. Projectleiding
  A. van den Broek.\\n\\nTijdsbestedingsonderzoek\\n\\nIn 2005-2006 is nieuw veldwerk
  van het Tijdsbestedingonderzoek (TBO) verricht. De dataverzameling die al sinds
  1975 om de vijf jaar werd gehouden. Naast deze TBO oude stijl zijn over geheel 2006
  gegevens verzameld volgens een voor het SCP nieuwe methode die aansluit bij een
  Europese standaard. Deze gegevens zijn medio 2007 beschikbaar gekomen voor inhoudelijke
  analyse. In 2007 is gestart met een beschrijvend project: Hoe hebben Nederlanders
  in 2006 hun tijd besteed? Ingegaan wordt onder meer op de omvang van de verplichte
  en de vrije tijd en op de tijd die met verschillende vrijetijdsactiviteiten gemoeid
  is. Doorlooptijd oktober 2007 \u2013 september 2008. Projectleiding A. van den Broek.\\n\\n5.10
  Cultuur en media\\n\\nHet culturele draagvlak 2008: media\\n\\nDe bestudering van
  mediagebruik is een onderdeel van een meerjarige opdracht van het ministerie van
  Onderwijs, Cultuur en Wetenschappen om afwisselend op het publiek van media, kunsten
  en erfgoed in te gaan. Hierover wordt periodiek gerapporteerd in een serie met de
  titel Het Culturele Draagvlak. Gezien de beschikbaarheid van de TBO-gegevens, de
  belangrijkste bron van de mediastudie, is met OCW afgestemd om in 2007 te starten
  met een nieuwe mediastudie, een opvolger van Achter de schermen. In de nieuwe studie
  wordt ingegaan op hoe het gebruik van gedrukte, audiovisuele en digitale media zich
  tussen 2000 en 2005/6 ontwikkeld heeft. Welke veranderingen zijn er opgetreden in
  de omvang en samenstelling van de verschillende publieksgroepen? Doorlooptijd: januari
  2008 \u2013 december 2009. Projectleiding F. Huysmans.\\n\\nToekomst openbare bibliotheek\\n\\nIn
  2007 is een project gestart over de toekomst van de openbare bibliotheek dat in
  2008 zal worden afgerond. Welke ontwikkelingen in bibliotheek- en mediagebruik doen
  zich voor, hoe zullen die zich naar verwachting doorzetten, en wat betekent dat
  voor opdracht en functioneren van de openbare bibliotheek? In opdracht van Stuurgroep
  Bibliotheken met steun van OCW. Doorlooptijd: mei 2007 \u2013 april 2008. Projectleiding
  F. Huysmans.\\n\\nHet culturele draagvlak 2008:overzicht en  amateurkunst\\n\\nVervolgens
  wordt in 2008 gestart met een nieuwe kunstenstudie, waarbij de nadruk in eerste
  instantie ligt op de beoefening van amateurkunst. Hiervoor zal ook samengewerkt
  worden met Kunstfactor, Sectorinstituut voor de amateurkunst. Bestudering van de
  receptieve belangstelling voor kunst volgt in een aansluitend project. Op verzoek
  van en met steun van OCW. Doorlooptijd:  november 2008 \u2013 oktober 2009. Projectleiding
  A. van den Broek.\\n\\nOok de bestudering van de publieke belangstelling voor kunsten
  en cultureel erfgoed maakt deel uit van Het Culturele Draagvlak. De belangrijkste
  informatiebron hiervoor is het vierjaarlijkse Aanvullend VoorzieningengebruiksOnderzoek
  (AVO). De AVO-cultuurvragen zijn in 2007 herzien en in die enqu\u00eate hebben vragen
  over belangstelling voor kunsten een wat zwaarder accent gekregen. Met OCW en Kunstfactor
  zijn bovendien afspraken gemaakt om een deel van de AVO-respondenten te herbenaderen
  en een aanvullende vragenlijst voor te leggen over amateurkunst en kunstzinnige
  belangstelling. Gegevens komen in de loop van 2008 beschikbaar. Over de basistrends
  in de culturele belangstelling (erfgoed, kunsten, amateurkunst, kunsten via de media)
  zulen we in 2008 een opvolger schrijven van Cultuurminnaars en \u2013mijders waarin
  een breed, maar beknopt overzicht wordt gegeven. Op verzoek van en met steun van
  OCW. Doorlooptijd:  januari 2008 \u2013 oktober 2008. Projectleiding A. van den
  Broek.\\n\\nICT & Cultuur\\n\\nOCW ondersteunt een meerjarig onderzoeksprogramma
  naar de digitalisering van cultuur en het publiek van die digitale cultuur. Het
  onderzoek wordt uitgevoerd in samenwerking met de Erasmus Universiteit Rotterdam.
  In  vervolg op een in 2007 ontwikkelde vragenlijst vindt in 2008 veldwerk plaats
  en wordt gewerkt aan een rapportage over het gebruik van internet voor culturele
  doeleinden. Doorlooptijd: januari 2008 \u2013 december 2008. Projectleiding J. de
  Haan.\\n\\n5.11 Sport\\n\\nRapportage Sport 2008\\n\\nIn opdracht van het ministerie
  van VWS staat in 2008 een nieuwe Rapportage Sport (RS08) gepland. Net als de edities
  van 2003 en 2006 komt deze in samenwerking met andere relevante spelers in het veld
  tot stand. Meerdere beschrijvende hoofdstukken over de sportdeelname en sportbeleid
  worden aangevuld met verdiepende hoofdstukken, waarvan de thema''s in de loop van
  2007 worden vastgesteld. Voor editie 2008 wordt nauwer samengewerkt met het Mulier
  Instituut in Den Bosch. Doorlooptijd: december 2006 \u2013 december 2008. Projectleiding
  SCP: J. de Haan.\\n\\nMisstanden in de sport 2\\n\\nIn 2007 is in opdracht van het
  ministerie van VWS gestart met een vervolgproject naar misstanden in de sport dat
  in 2008 wordt afgerond. Aanvullend op de eerste inventarisatie in het rapport Een
  gele kaart voor de sport (2007) wordt dan op basis van nieuw veldwerk de prevalentie
  van verbale en fysieke agressie, discriminatie van specifieke groepen, drankgebruik
  en roken opnieuw onderzocht. Dit keer wordt het meer in onderlinge samenhang en
  in context geplaatst. Bovendien wordt bij sportverenigingen nagegaan welke maatregelen
  getroffen worden tegen deze onwenselijke praktijken. Doorlooptijd oktober 2007 \u2013
  juli 2008. Projectleiding J.de Haan.\\n\\n5.12  Wonen en mobiliteit\\n\\nDynamiek
  in de wijk\\n\\nIn vervolg op het onderzoek Aandacht voor de wijk zal op verzoek
  van het ministerie van VROM een onderzoek worden gestart naar de leefbaarheid in
  de 40 probleemwijken. Het onderzoek richt zich op de relatie tussen de wijkaanpak
  c.q. de investeringen die in die wijken worden gedaan om de leefbaarheid te verbeteren
  en de maatschappelijke positie van de bewoners van die wijk. Speciale aandacht gaat
  in dit verband uit naar het verhuisgedrag: welke mensen vertrekken uit die wijken
  en welke komen er wonen. Tevens zal worden bezien in hoeverre de mensen die er (blijven)
  wonen wooncarri\u00e8re hebben gemaakt. Het onderzoek zal januari 2008 starten en
  heeft een looptijd van 4 jaar. Voor de uitvoering van dit onderzoek zal de medewerking
  van het CBS worden gevraagd. Projectleiding K. Wittebrood.\\n\\nPositie van allochtonen  op
  de woningmarkt\\n\\nOp verzoek van het ministerie van VROM zal onderzoek worden
  verricht naar de positie van allochtonen op de woningmarkt; welke trends en ontwikkelingen
  te signaleren zijn in het woongedrag van Marokkanen, Turken, Surinamers en Antillianen?
  Het onderzoek wordt in samenwerking met de onderzoeksgroep E&M uitgevoerd. Start
  januari 2008, afronding najaar 2008. Projectleiding J. Kullberg en J. Dagevos.\\n\\nVerhuisbewegingen
  en mobiliteit\\n\\nIn het licht van de groeiende mobiliteit van mensen en van de
  grotere afstanden die men in vergelijking met vroeger aflegt, wordt in dit onderzoek
  gekeken naar de verhuismotieven van diverse groepen van de bevolking, naar de afstand
  waarover wordt verhuisd en naar eventuele verschillen tussen groepen. In hoeverre
  wint het woonmotief het van het werkmotief? Wat is de omvang van de pensioenmigratie,
  inclusief die naar het buitenland? Het onderzoek vindt plaats op eigen initiatief.
  Afronding najaar 2008. Projectleiding F. Knol.\\n\\nStatusscores\\n\\nHet SCP heeft
  sinds zijn oprichting op diverse momenten overzichten gemaakt van de sociale status
  van wijken. Vanaf 1994 zijn die gebaseerd op subjectieve gegevens, verzameld door
  Geomarktprofiel. Deze werden gebruikt vanwege het ontbreken van adequate objectieve
  gegevens. Inmiddels zijn die laatste er nu wel en is er voldoende aanleiding de
  sociale status van wijken te baseren op objectieve gegevens. In dit project zal
  de omzetting van subjectieve naar objectieve gegevens worden gerealiseerd. Projectleiiding
  F. Knol.\\n\\nMobiliteit\\n\\nHet Kennisinstituut Mobiliteit (KiM) en het ministerie
  van Verkeer&Waterstaat hebben het SCP gevraagd in zijn werkprogramma aandacht te
  besteden aan mobiliteitsvraagstukken vanuit sociale en culturele invalshoek. Gestreefd
  wordt naar de opstelling van een meerjarig onderzoeksprogramma naar de sociale en
  culturele determinanten van mobiliteitsgedrag. Onderzoeksthema''s zijn in ieder
  geval het mobiliteitspatroon van de Nederlandse bevolking in het algemeen en specifieke
  groepen daarbinnen zoals ouderen, tweeverdieners, allochtonen e.d. Daarnaast is
  behoefte aan inzicht in de effectiviteit van beleidsinstrumenten die aangrijpen
  op het gedrag van burgers. Doorlooptijd: 2008 \u2013 2011. Projectleiding: V. Veldheer.\\n\\nMobiliteit
  in de vrije tijd\\n\\nVoor de zomer zal een studie verschijnen in de vorm van een
  proefschrift (L. Harms) over mobiliteitsgedrag in de vrije tijd. In deze studie
  wordt een beeld geschetst van de ontwikkelingen in het denken over mobiliteit, van
  de mobiliteit zelf en van het mobiliteitsgedrag van de bevolking als geheel en van
  diverse bevolkingsgroepen. De studie heeft het karakter van een ''state of the art''
  en geeft een scherp inzicht in de mobiliteit van de afgelopen 25 jaar en de opkomst
  van de mobiliteit in de vrije tijd. Publicatie is voorzien in het voorjaar van 2008.
  Projectleiding: L. Harms.\\n\\n5.13 Leefsituatie en leefbaarheid\\n\\nLeefstijl,
  leefpatroon en keuze woonmilieu\\n\\nMomenteel wordt een onderzoeksvoorstel ontwikkeld
  naar de vraag welke factoren ten grondslag liggen aan de keuze van mensen voor een
  bepaald woonmilieu. Leefstijl is een concept dat hier een rol speelt. Bedoeling
  is om een verband te leggen tussen voorkeur voor een bepaald woonmilieu aan de ene
  kant en maatschappelijke en culturele ori\u00ebntaties aan de andere kant. Bij die
  ori\u00ebntaties zal bijzondere aandacht worden besteed aan de positie van de auto
  in het dagelijks leven van mensen (woon-werk verkeer, vrije tijdsverkeer, parkeren
  en bereikbaarheid, ov-alternatief) en aan het gebruik openbaar groen (perken en
  parken, bossen en van de eigen tuin. In de beleving van mensen speelt het groen
  in de woonomgeving een grote rol. Het idee is een kwantitatief onderzoek op basis
  van het WooN2006 en het AVO 2007 uit te voeren en twee kleinschalige kwalitatieve
  modules uit te werken. Het onderzoek bevindt zich in de fase van de ontwikkeling
  van de probleemstelling en vindt op eigen initiatief  plaats. Projectleiding J.
  Kullberg.\\n\\nSociale staat van het platteland\\n\\nuitvoering naar de sociale
  en culturele ontwikkelingen op het platteland. Het doel is een\\n\\nOp verzoek van
  de minister van LNV heeft het SCP momenteel een vierjarig onderzoeksprogramma in
  monitorinstrument te ontwerpen dat belangrijke veranderingen voor het platteland
  signaleert.\\n\\nbevolking die in 2007 is afgenomen. De eerste publicatie zal inzoomen
  op de opvattingen en\\n\\nIn 2008 zullen drie publicaties het licht zien, die gebaseerd
  zullen zijn op de enqu\u00eate onder de NL waardering van het platteland in het
  licht van de veranderingen die zich daar hebben voorgedaan.\\n\\nDe tweede publicatie
  zal vooral ingaan op wonen en recre\u00ebren op het platteland waarbij de nadruk
  ligt op het gebruik van het platteland door stedelingen.\\n\\nDaarbij zal een onderscheid
  worden gehanteerd tussen stedelingen en plattelanders.\\n\\nDe derde publicatie
  richt zich op het sociale leven, het functioneren van de lokale gemeenschap e.d..
  Daarnaast zal een advies worden opgesteld voor LNV waarin een voorstel wordt gedaan
  om de sociale en culturele ontwikkelingen op het platteland te monitoren.  Projectleiding
  A.Steenbekkers.\\n\\nDuurzaamheidsmonitor\\n\\nHet kabinet heeft duurzaamheid tot
  een van de pijlers van het regeeraccoord gemaakt. De drie planbureaus en het CBS
  is gevraagd een voorstel te doen voor een duurzaamheidsmonitor waarin de ''staat
  van de natie'' op het gebied van duurzame ontwikkeling in kaart wordt gebracht.
  Historische ontwikkelingen, toekomstverwachtingen (kwalitatief en kwantitatief)
  en thematische artikelen worden gebruikt om agenda-zettende publicaties te produceren.
  De monitor zal gedurende 2008 worden ontwikkeld. Projectleiding R.V. Bijl.\\n\\nSCP-leefsituatie-index\\n\\nBegin
  2008 verschijnt een achtergrondrapport over de ontwikkeling van de SCP-leefsituatie-index.
  Deze speelt niet alleen een belangrijke rol in de Sociale Staat van Nederland, maar
  is ook overgenomen door een aantal gemeenten en trekt internationaal steeds meer
  de aandacht. In 2008 zal worden getracht de SCP-leefsituatie-index in breder perspectief
  te plaatsen door aandacht te besteden aan de internationale component, de leefsituatie
  van specifieke groepen en de relatie met satisfactie, geluk, waarden en attituden.
  Projectleiding J. Boelhouwer.\\n\\n5.14 Veiligheid\\n\\nGevolgen van ernstige misdrijven\\n\\nOp
  verzoek van het WODC van het ministerie van Justitie zal het Planbureau een onderzoek
  uitvoeren onder slachtoffers naar de gevolgen van ernstige geweldsmisdrijven en
  levensdelicten. Bedoeling is\\n\\nom inzicht te verwerven in de lichamelijke, financi\u00eble,
  emotionele en sociale gevolgen van ernstige misdrijven. Gepoogd zal worden de omvang
  van deze groep te schatten alsmede kennis te vergaren van de invloed die een ernstig
  misdrijf op het slachtoffer heeft. Het onderzoek is september 2007 gestart en zal
  juni 2008 worden afgerond. Projectleiding K. Wittebrood.\\n\\nChanging Perceptions
  of Security and Interventions (CPSI)\\n\\nHet SCP neemt deel aan een Europees consortium
  o.l.v. TNO dat een onderzoeksvoorstel heeft ingediend bij de Europese Commissie
  onder de noemer van het EU 7th Framework research program \\\"Understanding factors
  that cause citizens'' feelings of security and insecurity\\\". Andere deelnemers
  aan het consortium zijn University of Kent (UK), Swedish Defense Research Agency
  FO, Sogeti Europe (FR), TEMIS (FR), Endowed Centre for European Security Studies
  (AT). Er is een Advisory Board gevormd waarin de overheden van de participerende
  Europese landen zijn vertegenwoordigd. Voor NL is dat het ministerie van BZK. Doel
  van het onderzoek is inzicht te vergroten in de determinanten van gepercipieerde
  veiligheid in relatie tot de feitelijke veiligheid. Ook zal worden nagegaan welke
  interventies geschikt zijn om de feitelijke veiligheid en veiligheidgevoelens van
  burgers te vergroten. Het onderzoek heeft een looptijd  van 2 jaar. Projectleiding
  V. Veldheer.\\n\\nNationale Risico Beoordeling\\n\\nOp verzoek van het ministerie
  van BZK levert het Planbureau ook in  2008 een bijdrage aan het Nationale Programma
  Veiligheid. Het gaat onder meer om het beoordelen en valideren van maatschappelijke
  trends die gebruikt worden bij het opstellen van incidentscenario''s alsmede het
  beschikbaar stellen van data. Ook het beoordelen van mogelijke externe risico''s
  voor burgers wordt in dit verband meegenomen. Daarnaast wordt in projectgroepverband
  de opgestelde criteria ten behoeve van het opstellen van een Nationale Risicobeoordeling
  gevalideerd. Het project heeft een looptijd van een jaar. Projectleiding V. Veldheer.\\n\\n5.15
  Zorg voor mensen met beperkingen en ouderen\\n\\nInformele zorg\\n\\nAl enkele keren
  bracht het SCP ''state of the art rapporten'' over informele zorg uit (1991 en 2003).
  In het najaar van 2007 wordt opnieuw de stand van de informele zorg opgemaakt met
  behulp van een bevolkingsonderzoek. De gegevens zijn begin 2008 beschikbaar; in
  de loop van dat jaar worden de resultaten gepubliceerd. Onderwerpen zijn onder andere:
  aard en omvang van de zorg, de balans tussen helpen en werken en tussen draaglast
  en draagkracht en het gebruik van ondersteunende voorzieningen. Het onderzoek is
  in opdracht van het Ministerie van VWS. Projectleiding: A. de Boer.\\n\\nMonitor
  ouderenbeleid\\n\\nConform een toezegging aan het parlement verschijnt in 2008 de
  (in de Nota Ouderenbeleid) beloofde Monitor ouderenbeleid. Hierin wordt ondermeer
  een beeld geschetst van de deelname aan de arbeidsparicipatie, de financi\u00eble
  positie, de deelname aan vrijwilligerswerk, de woonsituatie, de gezondheid en de
  kwaliteit van de zorg. Met de opdrachtgever, het Ministerie van VWS, is afgesproken
  dat dit proefnummer van de Monitor ouderenbeleid de invulling is van de thematische
  Rapportage ouderen 2008. Aan de hand daarvan kan over de toekomstige vorm en inhoud
  van de monitor worden gesproken. De uitvoering is in de zomer van 2007 gestart;
  een rapport verschijnt medio 2008. Projectleiding: C. van Campen.\\n\\nEvaluatie
  WMO\\n\\nHet SCP is door het Ministerie van Volksgezondheid, Welzijn en Sport verzocht
  evaluatieonderzoek naar de Wet Maatschappelijke Ondersteuning (Wmo) te doen . Hierbij
  ligt de nadruk op de vormgeving van het gemeentelijk Wmo-beleid en op de effecten
  van de Wmo voor mensen met beperkingen. Begin 2008 zal de eerste  informatie over
  de invoering van de Wmo bij gemeenten\\n\\nworden verzameld. Daarnaast worden de
  gevolgen van de Wmo onder mensen met beperkingen in beeld gebracht. Van deze beide
  onderzoeken wordt in 2008 verslag gedaan.\\n\\nde Wmo betrokken actoren in een steekproef
  van Nederlandse gemeenten. Daarbij wordt onder meer door mantelzorgers. Hiervan
  wordt in 2009 verslag gedaan. Projectleiding: J. Timmermans en M. de Klerk.\\n\\nHet
  SCP zal voorts dieper ingaan op het gemeentelijk Wmo-beleid door onderzoek te doen
  onder bij de beleidsuitvoering in kaart gebracht. Ook wordt onderzoek gedaan naar
  ervaringen met de Wmo\\n\\nAdvies overheveling WMO middelen\\n\\nOp 1 januari 2007
  is de Wet maatschappelijke ondersteuning (WMO) in werking getreden. Daarbij is een
  bedrag van ruim 1 miljard euro aan functionele voorzieningen voor mensen met beperkingen
  overgeheveld van landelijk naar gemeentelijk niveau. De overheveling van deze middelen
  vindt buiten het gemeentefonds plaats en het budget wordt jaarlijks aangepast op
  basis van een rekenregel. Een belangrijke financi\u00eble randvoorwaarde voor de
  uitvoering van de WMO is een blijvend toereikend macrobudget. Over de toereikendheid
  van het macrobudget wordt op verzoek van het bestuurlijk overleg tussen Rijk en
  VNG door het SCP als onafhankelijke derde geoordeeld. Daarbij wordt een onderscheid
  gemaakt tussen een bindend advies (de toepassing van de rekenregel) en een niet-bindend
  advies (de toereikendheid van het budget). Projectleiding: E. Pommer\\n\\nVraagmodel
  verpleging en verzorging\\n\\nIn het Coalitieakkoord worden geen grote veranderingen
  voorzien in de verpleging en verzorging van mensen met beperkingen. Dit betekent
  dat de huidige vraagmodellen voor  de vraag naar verpleging en verzorging van mensen
  met beperkingen de komende twee jaar verder kunnen worden ontwikkeld en geactualiseerd.  Een
  deel van de vraag wordt door de publieke sector geleverd (AWBZ, WMO), een ander
  deel door de private sector (huishoudelijke hulp) en een deel door de naaste omgeving
  (mantelzorg). Dit onderzoek wordt uitgevoerd in opdracht van het ministerie van
  VWS. In de eerste helft van 2008 komt een vernieuwde versie uit van het vraagmodel.
  Projectleider: E. Eggink.\\n\\nVraagmodel verstandelijke gehandicaptenzorg\\n\\nDe
  ramingen voor de verstandelijke gehandicaptenzorg zijn gebaseerd op een uit 2005
  daterend model. In dit model wordt uitgegaan van zorgvraagproducten, die inmiddels
  zijn vervangen door awbz-functies en in de toekomst door zorgzwaarte pakketten.
  Er zullen nieuwe modellen worden ontwikkeld voor jeugdigen en voor volwassenen.
  Dit onderzoek wordt uitgevoerd in opdracht van het ministerie van VWS. Projectleiding:
  I. Woittiez.\\n\\nOuderen in instellingen\\n\\nOver bewoners van verpleeg- en verzorgingshuizen
  is uit algemeen bevolkingsonderzoek weinig bekend. Het SCP voorziet periodiek in
  deze leemte in de informatie door onderzoek naar deze tehuisbewoners te laten uitvoeren.
  De gegevens staan doorgaans gepubliceerd in de Rapportage ouderen, maar ze zijn
  ook onmisbaar voor het Verklaringsmodel verpleging en verzorging dat het SCP in
  opdracht van het Ministerie van VWS ontwikkelt en onderhoudt. In 2008 wordt opnieuw
  een onderzoek naar oudere tehuisbewoners ingesteld, dit keer in samenwerking met
  het Centraak Bureau voor de Statistiek. Het veldwerk zal volgens planning eind 2008
  zijn afgerond. De uitvoering van het project en de planning zijn afhankelijk van
  medefinanciering van dit onderzoek. Projectleiding: J.Timmermans.\\n\\nOpvattingen
  van gezondheid\\n\\nVoorjaar 2007 bracht het SCP de notitie''Een nuchtere kijk op
  gezond gedrag'' uit, een advies over kansen voor gezondheidspreventie dat in de
  nota ''Langer gezond leven''. Ook een kwestie van gezond gedrag'' stond aangekondigd.
  In vervolg daarop start het SCP begin 2008 een onderzoek naar opvattingen over gezondheid
  zoals die leven onder de bevolking. De gedachte erachter is dat deze opvattingen
  in hoge mate bepalen of mensen bereikt worden door preventieprogramma''s die op
  gedragsverandering zijn gericht. Het onderzoek zal in het najaar van 2008 zijn afgerond.
  Projectleiding: S. Kooiker.\\n\\nVraagverkenning langdurige GGZ\\n\\nIn het kader
  van het Vraagmodel langdurige zorg voert het SCP een verkenning uit naar de mogelijkheden
  om de vraag naar langdurige GGZ te modelleren en te ramen. Aan het Trimbosinstituut
  is gevraagd een beschrijving van het GGZ gedeelte in de AWBZ te maken en te onderzoeken
  welke micro-gegevens hierover beschikbaar zijn of komen om in de toekomst de vraag
  te kunnen ramen. Het SCP is zelf begonnen met een analyse van de bruikbaarheid van
  de CIZ-gegevens over AWBZ-ge\u00efndiceerden met een psychiatrische aandoening.
  Beide projecten beginnen eind 2007 en de rapportages zullen in de loop van 2008
  opgeleverd worden. Projectleiding: C. van Campen.\\n\\n5.16 Methodologie en datakwaliteit\\n\\nEuropean
  Social Survey\\n\\nIn 2007 is de vierde ronde van het European Social Survey (ESS)
  gestart. Het veldwerk zal in 2008 plaatsvinden. Speciale modules in deze ronde zijn
  \\\"ageism\\\" en houdingen ten opzichte van de verzorgingsstaat. Het SCP maakt
  deel uit van het Central Coordinating Team (CCT) van het ESS en is daar vooral betrokken
  bij het contracteren van veldwerkbureaus in de circa 30 participerende landen, onderzoek
  naar nonrespons en het ontwikkelen en onderhouden van een event database (www.scp.nl/ess/eventnet).
  Inmiddels heeft de Europese Commissie ook de financiering van de CCTactiviteiten
  van een aanvullend infrastructuurproject toegekend, het project European Social
  Survey Infrastructure - Improving SocialMeasurement in Europe 2006-2010. Het SCP
  is hierbij actief op het terrein van nonresponsonderzoek, event reporting en het
  ontwikkelen van attitude-indicatoren (zie Publieke opinie en politiek). In 2008
  gaat een review- en uitbreidingsproject van de ESS van start binnen het 7 e Kader
  programma van de EC. SCP-Projectleiding I. Stoop.\\n\\nKwaliteit van de data\\n\\nGezien
  het belang van empirische data voor het onderzoek van het SCP, het spanningsveld
  tussen actualiteit van vraagstelling en de continu\u00efteit van reeksen, en de
  afweging tussen kwaliteit en kosten, is er in toenemende behoefte aan methodologisch
  onderzoek naar surveys en databestanden. Onderwerpen die de aandacht behoeven zijn
  bijvoorbeeld trendbreuken (als gevolg van een gewijzigd onderzoeksdesign), nonrespons,
  cluster-effecten, weging en de mogelijkheden van het gebruik van registerdata. Hierbij
  is het van belang te vermelden dat er in toenemende mate wordt samengewerkt met
  het CBS. Continu project. Projectleiding: I. Stoop.\"", "\"Toonkunst Zutphen en
