  klimaat, natuur en dierenwelzijn voor ''true price'' beleidsen prijsmaatregelen
  voor met name voedselproducten uit de veehouderij.\\nc. Het bevorderen van bewustzijn
  en draagvlak voor prijsmaatregelen en belastingen voor vlees-, zuivel- en overige
  voedselproducten, onder andere met het oog op het Parijs Klimaat Akkoord, het verlagen
  van zorgkosten en het betalen van de ''true price''. Hieronder valt ook het uitbrengen
  van wetenschappelijke publicaties.\\nb. Het ontwikkelen van effectieve beleidsinstrumenten
  voor de beoogde verschuiving naar een meer plantaardige eiwitconsumptie, met een
