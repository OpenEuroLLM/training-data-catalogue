  van een minuut\\n\\n30.000:\\n\\n=\\n\\nMaak\\n\\nkolom 2\\n\\nHIER af\\n\\nc Maak
  kolom 3 op de vorige pagina af.\\n\\nDenk erom: 1 jaar op de tijdlijn is in werkelijkheid
  15 biljoen jaar. Bereken de tijd in werkelijkheid door de afbeelding in kolom 3
  te delen door het getal dat je in kolom 2 hebt opgeschreven. De sommen in kolom
