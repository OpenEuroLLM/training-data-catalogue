sample: '["\"TEMPLATES VOOR\\n\\nCAKE, KOEKJES EN GRANOLA\\n\\nMet deze templates
  kun je eindeloos vari\u00ebren in de samenstelling van je eigen cake, granola en
  koekjes. Wissel de ingredi\u00ebnten en geniet elk seizoen van ecozoete tussendoortjes!
  Zelf een topcombinatie be\u00ad dacht? Deel het recept in onze Facebookgroep Keukenpraatjes.\\n\\n1.
  Cake\\n\\nvoor 1 cake:\\n\\n* 200 ml (plantaardige) melk\\n* 400 g meel (maak gerust
  een mix van verschillende soorten: tarwe, spelt, boekweit, rogge, ...)\\n* 50 ml
  appelazijn\\n* 200 ml gesmolten kokosolie of olijfolie\\n* 150 g ruwe rietsuiker\\n*
  14 g bakpoeder\\n* snuifje zout\\n\\nOptioneel:\\n\\n* Smaakmakers zoals vanillepoeder,
  -merg of -essence, cacaopoeder, gemalen koffie, koekkruiden, ka\u00ad neel en nootmuskaat.\\n*
  Werk af met fruit van het seizoen zoals bessen of perzik in de zomer, en vijgen,
  appel of peer in de herfst. Meng het fruit met wat rietsuiker zodat het een mooie
  coating krijgt. Je kunt ook diepvriesfruit gebrui\u00ad ken. Dat hoef je niet te
  ontdooien. Gewoon mengen met de suiker\\n* Vervang de 200 ml melk door 100 ml melk
  en 100 g groente- of fruitpuree zoals pompoen, rode biet, wortel, pastinaak, knolselderij,
  bloemkool, appel of banaan, of door 100 g geraspte groenten zoals wor\u00ad tel,
  pastinaak, pompoen of rode biet.\\n\\nVerwarm de oven voor op 160\u00b0 Celsius.\\n\\nMeng
  alle natte ingredi\u00ebnten.\\n\\nMeng het droge mengsel door het natte.\\n\\nMeng
  alle droge ingredi\u00ebnten.\\n\\nVet de bakvorm in met kokos- of olijfolie. Stort
  het beslag erin en strijk het glad. Verdeel er het fruit over. Plaats gedurende
  40 minuten in de oven. Prik met een vork. Als het beslag niet meer blijft plakken,
  is de cake klaar.\\n\\nDe cake bewaart minstens een week in een goed afgesloten
  doos in een koele ruimte.\\n\\nIk maakte tijdens de aflevering van Keukenpraatjes
  een variant met geraspte rode biet en wortel (50 g geraspte rode biet, 50 g geraspte
  wortel, 100 ml havermelk).\\n\\nIk voegde ook smaakmakers toe aan het deeg zoals
  kaneel, nootmuskaat en  kardemom.\\n\\npote (80 g).\\n\\nDe topping bestond uit
  stukjes appel en pruim (150 g)  gemengd met wat rietsuiker en veenbessencom\u00ad\\n\\n2.
  Koekjes\\n\\nvoor 20 koekjes:\\n\\n* 200 g meel (dat mag een mix zijn, graag zelfs,
  van bijv. spelt, kokos, amandel, rogge, \u2026)\\n* 200 g haver- of andere vlokken\\n*
  100 g vetstof (zoals olie, boter, notenpasta, tahin)\\n* 30 tot 50 g zoet afhankelijk
  van jouw smaak (rietsuiker, ahornsiroop, honing, rijststroop, etc.)\\n* 100 g groenten
  of fruit (geraspt of gepureerd, zoals pompoen, wortel, appel, banaan, peer, rode
  biet, pasti\u00ad naak)\\n* 1 tl bakpoeder (of baking soda)\\n* snuifje zout\\n\\nOptioneel:\\n\\n*
  Extra''s zoals gehakte chocolade, noten, pitten, zaden, stukjes gedroogd fruit.\\n*
  Smaakmakers zoals koekkruiden, kaneel, kurkuma, gemberpoeder, cacaopoeder, gemalen
  koffie, geraspte citroen- of sinaasappelschil.\\n* Je kunt de koekjes na het bakken
  even onderdompelen in of besprenkelen met wat gesmolten chocolade.\\nLaat ze dan
  eerst even afkoelen en laat de gesmolten chocolade ook een beetje afkoelen zodat
  hij niet te lopend is.\\n\\nVerwarm de oven voor op 180\u00b0 Celsius. Bekleed een
  bakplaat met bakpapier. Meng alle ingredi\u00ebnten door elkaar. Maak met je handen
  platte schijfjes van het deeg.\\n\\nBak de koekjes gedurende 10 minuten in de oven
  en draai ze dan om. Bak nog 10 minuten.\\n\\nIk maakte tijdens de aflevering van
  Keukenpraatjes een variant met geraspte kweepeer, zonnebloemolie, een geplette banaan,
  hennepzaad, sesamzaad, havervlokken, pindakaas, zonnebloempitten en rozijntjes.
  Ik voegde ook wat smaakmakers toe zoals kaneel, gember en nootmuskaat. Na het bakken
  en afkoelen doopte ik de koekjes in gesmolten donkere chocolade.\\n\\n3. Granola\\n\\nvoor
  1 kg:\\n\\n* 200 g noten, zaden en pitten\\n* 600 g haver- of andere vlokken\\n*
  70 ml olie (kokos, olijf, zonnebloem)\\n* 30 tot 50 g zoetstof afhankelijk van jouw
  smaak (rietsuiker, ahornsiroop, honing, rijststroop, etc.)\\n* 50 g noten- of zadenpasta
  (pindakaas, tahin, cashewpasta, \u2026)\\n* een paar eetlepels meel of bloem (spelt,
  boekweit, haver, \u2026)\\n* snuifje zout\\n\\nOptioneel:\\n\\n* 100 g fruitpuree
  zoals geprakte banaan, appelmoes, pompoenpuree (zo krijg je extra grote clusters
  en kun je andere zoetstoffen vaak weglaten)\\n* Smaakmakers zoals koekkruiden, kaneel,
  kurkuma, gemberpoeder, cacaopoeder, gemalen koffie \u2026\\n* Extra''s zoals gehakte
  chocolade, noten, pitten, zaden, stukjes gedroogd fruit. Voeg de chocolade en het
  gedroogd fruit toe na het bakken. De chocolade smelt anders en het fruit kan aanbranden.\\n\\nVerwarm
  de oven voor op 180\u00b0 Celsius. Bekleed een bakvorm met bakpapier. Meng alle
  ingredi\u00ebnten in een kom en spreid het mengsel uit op het papier. Bak gedurende
  20 minuten in de oven. Hussel alles na 10 minu\u00ad ten even door elkaar. Als de
  granola een gouden kleurtje krijgt (dus niet bruin!), mag hij eruit.\\n\\nIk maakte
  tijdens de aflevering van Keukenpraatjes een versie met banaan, tahin, hennepzaad,
  havervlok\u00ad ken, zonnebloempitten, lijnzaad, sesamzaad, cashewnoten, zonnebloemolie
  en speltmeel.\"", "\"1 Bjorn\\n\\n2 Mats\\n\\n3Sebas\\n\\n4\\n\\n5\\n\\n6\\n\\n7\\n\\n8\\n\\n9\\n\\nRick\\n\\nJan\\n\\nStijn\\n\\nRaf\\n\\nSiem\\n\\nFloris\\n\\n10Stijn\\n\\nStaf\\n\\nJan\\n\\nRobin\\n\\nNooit
