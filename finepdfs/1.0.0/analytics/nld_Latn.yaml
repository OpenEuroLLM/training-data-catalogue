  Green Deal\\n\\nDank voor uw aandacht!\\n\\nVragen?\\n\\nMail naar firstname.lastname@example.org\"",
  "\"Garantie & retourneren\\n\\n100% activatie garantie\\n\\nZodra u betaald heeft
  ontvangt u een licentie(altijd per mail toegestuurd). U ontvangt een 100% legale
  licentie en wij staan garant dat al onze codes werken. Mocht u hulp nodig hebben
  met installatie dan kunt u ons contacteren via het contactformulier.\\n\\nHoe lang
  heb ik garantie op mijn product?\\n\\nJe hebt altijd recht op de wettelijke garantie
  van je product. Bij een defect aan je product, kun je natuurlijk bij ons terecht
  voor een reparatie. Wij zorgen er voor dat je product kosteloos gerepareerd zal
