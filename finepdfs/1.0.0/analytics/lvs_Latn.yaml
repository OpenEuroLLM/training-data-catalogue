  \u016bdeni vis\u0101 \u0161\u0137\u0113rsgriezum\u0101.\\n6.2. Skait\u012bt\u0101ju
  nav ieteicams lietot \u016bdens daudzuma m\u0113r\u012b\u0161anai, kas liel\u0101ks
