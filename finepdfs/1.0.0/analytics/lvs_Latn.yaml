  Error! Bookmark not defined. |\\n\\n1. Inform\u0101cija par koled\u017eu\\n\\nR\u012bgas
  Stradi\u0146a universit\u0101tes Sarkan\u0101 Krusta medic\u012bnas koled\u017ea
  (turpm\u0101k \u2013 Koled\u017ea) ir R\u012bgas Stradi\u0146a universit\u0101tes
  (turpm\u0101k \u2013 RSU) p\u0101rraudz\u012bb\u0101 un LR Vesel\u012bbas ministrijas
  p\u0101rzin\u0101t eso\u0161a profesion\u0101l\u0101s augst\u0101k\u0101s izgl\u012bt\u012bbas
  instit\u016bcija.\\n\\nKoled\u017ea tiek \u012bstenota \u0161\u012b cikla profesion\u0101l\u0101s
  augst\u0101k\u0101s izgl\u012bt\u012bbas programmas, t\u0101 radot iesp\u0113ju
  kvalitat\u012bvas, Bolo\u0146as procesa principiem, Eiropas Savien\u012bbas Direkt\u012bv\u0101m
  un darba tirgus vajadz\u012bb\u0101m atbilsto\u0161as izgl\u012bt\u012bbas ieg\u016b\u0161anai
  iedz\u012bvot\u0101jiem. L\u012bdztekus pirm\u0101 lim\u0113na profesion\u0101l\u0101s
  augst\u0101k\u0101s izgl\u012bt\u012bbas (5 LKI) programm\u0101m, Koled\u017ea \u012bsteno
  darba tirg\u016b piepras\u012btas arodizgl\u012bt\u012bbas (3LKI), profesion\u0101l\u0101s
  vid\u0113jas izgl\u012bt\u012bbas programmas (4 LKI) un, m\u016b\u017eizgl\u012bt\u012bbas
  kontekst\u0101, profesion\u0101l\u0101s pilnveides un t\u0101lakizgl\u012bt\u012bbas
  programmas. Koled\u017eas darb\u012bba ir loti noz\u012bm\u012bga vesel\u012bbas
  apr\u016bpes sist\u0113mai, jo nozar\u0113 ir krasi izj\u016btams darba sp\u0113ka
  tr\u016bkums.\\n\\nKoled\u017eas misija ir sagatavot augstas kvalit\u0101tes speci\u0101listus,
  lai studiju laik\u0101 ieg\u016bt\u0101s zin\u0101\u0161anas, attieksme un prasmes
  b\u016btu atbilsto\u0161as vesel\u012bbas apr\u016bpes jomas vajadz\u012bb\u0101m
  un ilgtsp\u0113j\u012bgai att\u012bst\u012bbai, b\u016btu iek\u013caujo\u0161as
  un balst\u012btos humanism\u0101 k\u0101 vien\u0101 no Sarkan\u0101 Krusta pamatprincipiem,
  t\u0101 kop\u0101 veidojot stab\u012blu pamatu m\u016b\u017eizgl\u012bt\u012bbai
  un p\u0113tniec\u012bbai.\\n\\nKoled\u017eas v\u012bzija ir m\u016bsdien\u012bga,
  presti\u017ea un atpaz\u012bstama izgl\u012bt\u012bbas instit\u016bcija vesel\u012bbas
  apr\u016bpes un soci\u0101l\u0101s labkl\u0101j\u012bbas jom\u0101 Latvij\u0101
  un Eirop\u0101.\\n\\nKoled\u017eas v\u0113rt\u012bbas ir m\u016bsu att\u012bst\u012bbas
  pamatelementi. T\u0101s ir: god\u012bgums un atbild\u012bba, cilv\u0113ki, kvalit\u0101te,
  ilgtsp\u0113ja.\\n\\nKoled\u017ea nodro\u0161ina augstas kvalit\u0101tes studijas
  un zin\u0101tnisko darb\u012bbu vesel\u012bbas apr\u016bpes jom\u0101. To apliecina
  Koled\u017eas kvalit\u0101tes p\u0101rvald\u012bbas sist\u0113mai pie\u0161\u0137irtais
  starptautiskais sertifik\u0101ts, par atbilst\u012bbu EFQM (the European Foundation
  for Quality Management) kvalit\u0101tes modela pras\u012bb\u0101m iek\u0161\u0113j\u0101s
  kvalit\u0101tes nodro\u0161in\u0101\u0161an\u0101 (skat\u012bt sadal\u0101 pie \\\"citi
  pielikumi\\\" 1. pielikumu) vai elektroniski pieejams \u0161eit: Certificate of
  EFQM (the European Foundation for Quality Management)\\n\\nKoled\u017eas ilgtermi\u0146a
  att\u012bst\u012bbas virsm\u0113r\u0137is ir nodro\u0161in\u0101t Koled\u017e\u0101
  kvalitat\u012bvu, starptautiski atz\u012btu studiju procesu, att\u012bst\u012bt
  p\u0113tniecisko darb\u012bbu, k\u0101 ar\u012b sekm\u0113t doc\u0113t\u0101ju nep\u0101rtrauktu
  profesion\u0101lo att\u012bst\u012bbu un cielu\u0161 sadarb\u012bbu ar darba dev\u0113jiem,
  lai sagatavotu augsti kvalific\u0113tus un konkur\u0113tsp\u0113j\u012bgus speci\u0101listus
  vesel\u012bbas apr\u016bpes nozarei main\u012bgajos darba tirgus apst\u0101k\u013cos,
  tai skait\u0101 m\u016b\u017eizgl\u012bt\u012bbas ietvaros.\\n\\nKoled\u017eas vid\u0113j\u0101
  termi\u0146a strat\u0113\u0123isk\u0101s att\u012bst\u012bbas m\u0113r\u0137i ir
  att\u0113loti 1. tabul\u0101.\\n\\n1.tabula Koled\u017eas vid\u0113j\u0101 termi\u0146a
  strat\u0113\u0123isk\u0101s att\u012bst\u012bbas m\u0113r\u0137i 2021-2027 gadam\\n\\n|
  1.M\u0113r\u0137is | Koled\u017eas un studijuvides iek\u0161\u0113j\u0101s kvalit\u0101tes
  nodro\u0161in\u0101\u0161ana atbilsto\u0161i izcil\u012bbas kult\u016bras pieejas.
  |\\n|----------|------------------------------------------------------------------------------------------------------------------|\\n|
  2.M\u0113r\u0137is | P\u0113tniec\u012bbas att\u012bst\u012bbas veicin\u0101\u0161ana
  studiju proces\u0101, sabiedr\u012bbas vesel\u012bbas veicin\u0101\u0161anai priorit\u0101rajos
  virzienos, sadarbojoties ar vesel\u012bbas apr\u016bpes nozari un iesaistoties sadarb\u012bbas
  projektos ar starptautiskiem partneriem. |\\n| 3.M\u0113r\u0137is | Pedago\u0123iska
  un akad\u0113misk\u0101 person\u0101la, taj\u0101 skait\u0101, prak\u0161u un DVB
  m\u0101c\u012bbu vad\u012bt\u0101ju profesion\u0101lo kompeten\u010du pilnveide
  m\u0101c\u012bbu organiz\u0101cijas un p\u0113tniec\u012bbas att\u012bst\u012bbas
  jaut\u0101jumu kontekst\u0101 un visu iesaist\u012bto pedago\u0123isko un digit\u0101lo
  prasmju pilnveide un integr\u0113\u0161ana nozares studiju kursos. |\\n\\n| M\u0113r\u0137is
  | Labas p\u0101rvald\u012bbas principu \u012bsteno\u0161ana, Koled\u017eas ien\u0101kumu
  pl\u016bsmas da\u017e\u0101do\u0161ana un resursu p\u0101rvald\u012bba, ilgtsp\u0113j\u012bgas
  finan\u0161u b\u0101zes nodro\u0161in\u0101\u0161anai un administrat\u012bv\u0101
  person\u0101la profesion\u0101lo kompeten\u010du pilnveide. |\\n|--------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\\n|
  5. M\u0113r\u0137is | M\u016b\u017eizgl\u012bt\u012bbas programmu att\u012bst\u012b\u0161ana,
  iek\u013caujot vesel\u012bbas nozares profesion\u0101lu t\u0101lakizgl\u012bt\u012bb\u0101
  un sabiedr\u012bbai nepiecie\u0161amo n\u0101kotnes kompeten\u010du att\u012bst\u012bbu,
  iek\u013caujot pieaugu\u0161o izgl\u012bt\u012bb\u0101 indiv\u012bdu digit\u0101las
  transformat\u012bv\u0101s kompetences veicina\u0161anu, profesion\u0101lo un person\u012bgo
  (soft skills) prasmju pilnveidosanu. |\\n| 6. M\u0113r\u0137is | Koled\u017eas ilgtsp\u0113j\u012bga
  att\u012bst\u012bba, dro\u0161as, soci\u0101li iek\u013caujo\u0161as un za\u013cas
  vides veicina\u0161ana, taj\u0101 skait\u0101, starptautisk\u0101 sadarb\u012bba
  klimata p\u0101rmain\u012bgu mazin\u0101\u0161anu. |\\n\\nStudiju virziena \u201cVesel\u012bbas
  apr\u016bpe\u201d m\u0113r\u0137is ir nodro\u0161in\u0101t augstas kvalit\u0101tes
  studijas \u0161\u0101d\u0101 cikla profesion\u0101las augst\u0101kas izgl\u012bt\u012bbas
  studiju programm\u0101s. Koled\u017eas \u012bstenotaj\u0101 studiju virzien\u0101
  \u201cVesel\u012bbas apr\u016bpe\u201d l\u012bdz 2014.gadam tika \u012bstenotas
  divas studiju programmas, no 2015.gada tr\u012bs, no 2016.gada \u010detras un s\u0101kot
  ar 2017./2018. studiju gadu \u2013 5 pirm\u0101 l\u012bme\u0146a profesion\u0101l\u0101s
  augst\u0101kas izgl\u012bt\u012bbas studiju programmas. \u012astenot\u0101s studiju
  programmas ir:\\n\\n- \u201c\u0100rstniec\u012bba\u201d (ar kvalifik\u0101ciju \u0101rsta
  pal\u012bgs)\u201d (41 721)\\n- \u201c\u0100rstniec\u012bba\u201d (ar kvalifik\u0101ciju
  neatliekam\u0101s medic\u012bnas \u0101rsta pal\u012bgs)\u201d (41 721) (kop\u0161
  2017./2018. gada)\\n- \u201c\u0100rstniecisk\u0101 mas\u0101\u017ea\u201d (ar kvalifik\u0101ciju
  maseris)\u201d (41 722) (kop\u0161 2015./2016. gada)\\n- \u201cM\u0101szin\u012bbas\u201d
  (ar kvalifik\u0101ciju m\u0101sa)\u201d (41 723)\\n- \u201cFarm\u0101cija\u201d
  (ar kvalifik\u0101ciju farmaceita asistents)\u201d (41 725) (kop\u0161 2016./2017.
  gada)\\n\\n2022. gada 21.janv\u0101r\u012b koled\u017ea uzs\u0101ka studiju virziena
  \u201cVesel\u012bbas apr\u016bpe\u201d nov\u0113rt\u0113\u0161anas proced\u016bru
  par p\u0101rskata periodu no 2013.gada \u2013 2021.gadam.\\n\\n2. Koled\u017eas
  p\u0101rvald\u012bbas strukt\u016bra\\n\\nKoled\u017eas darb\u012bbu regul\u0113
  RSU apstiprin\u0101ts Koled\u017eas nolikums, Koled\u017eas p\u0101rst\u0101v\u012bbas,
  vad\u012bbas instit\u016bcijas un l\u0113m\u0113jinstit\u016bcija ir Koled\u017eas
  padome, Koled\u017eas vad\u012bt\u0101js (direktors) un rev\u012bzijas komisija.
  Koled\u017eas direktors ir Koled\u017eas augst\u0101k\u0101 amatpersona. Saska\u0146\u0101
  ar Nolikumu, Koled\u017eas augst\u0101k\u0101 vad\u012bbas instit\u016bcija un l\u0113m\u0113jinstit\u016bcija
  strat\u0113\u0123iskajos, finan\u0161u un saimnieciskajos jaut\u0101jumos ir RSU.\\n\\nKoled\u017eas
  Padome ir kolegi\u0101la vad\u012bbas instit\u016bcija un l\u0113m\u0113jinstit\u016bcija.
  Koled\u017eas Padomes s\u0113des notiek 5 reizes studiju gad\u0101. Koled\u017eas
  padomes sast\u0101v\u0101 kop\u0101 ir 10 Koled\u017eas Padomes locek\u013ci: direktors
  (saska\u0146\u0101 ar ienemamo amatu); direktora vietnieks studiju darb\u0101 (saska\u0146\u0101
  ar ienemamo amatu); 2 Koled\u017ea akad\u0113miskajos amatos iev\u0113l\u0113tas
  personas; viens Koled\u017eas visp\u0101r\u0113j\u0101 person\u0101la p\u0101rst\u0101vis;
  2 Koled\u017eas stud\u0113jo\u0161o pa\u0161p\u0101rvaldes p\u0101rst\u0101vji;
  1 pilnvarots RSU Sabiedr\u012bbas vesel\u012bbas un soci\u0101l\u0101s labkl\u0101j\u012bbas
  fakult\u0101tes domes p\u0101rst\u0101vis; 2 pilnvaroti darba dev\u0113ju vai profesion\u0101lo
  organiz\u0101ciju p\u0101rst\u0101vji.\\n\\nKoled\u017eas padome nosaka akad\u0113misk\u0101s
  darb\u012bbas galvenos virzienus, apsprie\u017e un iesniedz apstiprin\u0101\u0161anai
  RSU Sen\u0101tam vid\u0113j\u0101 termina darb\u012bbas un att\u012bst\u012bbas
  strat\u0113\u0123iju; apstiprina studiju programmas, virza t\u0101s licenc\u0113\u0161anai
  un akredit\u0101cijai, apstiprina studiju programmu pa\u0161v\u0113rt\u0113juma
  zinojumus; apstiprina studiju programmu padomju nolikumus un sast\u0101vu, apstiprina
  un saskano ar un saskano ar RSU studiju prorektoru studiju programmu \u012bsteno\u0161anas
  pl\u0101nu, apstiprina Koled\u017eas Uz\u0146\u0113m\u0161anas noteikumus, saskano
  ar RSU studiju prorektoru Nolikumu par studiju k\u0101rt\u012bbu un Nolikumu par
  p\u0101rbaud\u012bjumu k\u0101rt\u012bbu, apstiprina Koled\u017eas uz\u0146\u0113m\u0161anas
  noteikumus, ar studiju procesu un strukt\u016brvien\u012bbu darb\u012bbu saist\u012btus
  nolikumus, apstiprina Koled\u017eas Iek\u0161\u0113j\u0101s k\u0101rt\u012bbas noteikumus,
  gada p\u0101rskatus un Direktora izstr\u0101d\u0101to Koled\u017eas strukt\u016bru
  un iev\u0113l personas akad\u0113miskajos un administrat\u012bvajos amatos, atbilsto\u0161i
  Koled\u017eas izstr\u0101d\u0101tajai un iepriek\u0161 apstiprin\u0101tajai k\u0101rt\u012bbai.\\n\\nStudiju
  programmu padome ir kolegi\u0101la instit\u016bcija, kas darbojas ar m\u0113r\u0137i,
  sekm\u0113t, uztur\u0113t un pilnveidot attiec\u012bg\u0101s studiju programmas
  kvalit\u0101ti un efektivit\u0101ti. Katrai Koled\u017eai \u012bstenotajai studiju
  programmai ir sava Padome. Studiju programmas Padome sast\u0101v no 7 - 8 dal\u012bbniekiem:
  attiec\u012bg\u0101s Studiju programmas direktors; 4 v\u0113l\u0113t\u0101 akad\u0113misk\u0101
  person\u0101la p\u0101rst\u0101vji, kuri darbojas attiec\u012bgaj\u0101 zin\u0101tnes
  nozar\u0113 vai t\u0101s apak\u0161nozar\u0113; 2 - 3 studiju programmas studenti
  (pa vienam studentam no katra studiju gada; studentu p\u0101rst\u0101vju nosaka
  Studentu pa\u0161p\u0101rvalde). Sast\u0101vu skat\u012bt 4. tabul\u0101. Studiju
  programmas Padomes s\u0113des notiek ne ret\u0101k k\u0101 divas reizes semestr\u012b.
  Studiju programmu Padomes sast\u0101vu katru gadu apstiprina Koled\u017eas padome
  p\u0113c studiju programmas direktora ieteikuma un saskanojuma ar direktora vietnieci
  akad\u0113miskaj\u0101 un p\u0113tniec\u012bbas darb\u0101.\\n\\nStudiju virzien\u0101
  ietilpsto\u0161o studiju programmu satura aktualiz\u0113\u0161ana\\n\\nStudiju virziena
  \u201cVesel\u012bbas apr\u016bpe\u201d studiju programmas ir izstr\u0101d\u0101ta
  atbilsto\u0161i Ministru kabineta noteikumiem par pirm\u0101 l\u012bme\u0146a profesion\u0101l\u0101s
  augst\u0101k\u0101s izgl\u012bt\u012bbas valsts standartu. Studiju kursu izv\u0113le,
  satus un prakses uzdevumi tika noteikti atbilsto\u0161i valst\u012b sp\u0113k\u0101
  eso\u0161ajiem noteikumiem par \u201c\u0100rstu pal\u012bga\u201d, masiera un farmaceita
  asistenta profesijas standartiem un neatliekam\u0101s medic\u012bnas \u0101rsta
  pal\u012bga kvalifik\u0101cijas pras\u012bb\u0101m. Lai uzlabotu \u0161o procesu,
  ir izstr\u0101d\u0101ts Koled\u017eas normat\u012bvais dokuments \u201cStudiju programmu
  un studiju kursu aprakstu izstr\u0101des un uztur\u0113\u0161anas noteikumi. Normat\u012bvais
  dokuments pieejams \u0161eit: Studiju programmu un studiju kursu aprakstu izstr\u0101des
  un uztur\u0113\u0161anas noteikumi\\n\\nStudiju procesa \u012bsteno\u0161ana regul\u0101ri
  tiek izv\u0113rt\u0113ta studiju virzienu un programmu ikgad\u0113jos pa\u0161nov\u0113rt\u0113juma
  zinojumos. Katra strukt\u016brvien\u012bbas sagatavo savas strukt\u016brvien\u012bbas
  darb\u012bbas p\u0101rskatu, izv\u0113rt\u0113 ar\u012b tos procesus, kas b\u016btu
  j\u0101uzlabo, tiek apkopots doc\u0113t\u0101ju viedoklis par nepiecie\u0161amaj\u0101m
  izmai\u0146\u0101m un veikta studentu elektroniska anket\u0113\u0161ana katru semestri.
  Pa\u0161nov\u0113rt\u0113juma zinojumi tiek izskat\u012bti un apstiprin\u0101ti
  studiju virziena \u201cVesel\u012bbas apr\u016bpe\u201d iek\u0161\u0113j\u0101s
  kvalit\u0101tes vad\u012bbas padom\u0113, kam seko apstiprin\u0101\u0161ana Koled\u017eas
  padomes s\u0113d\u0113 un saskano\u0161ana ar RSU studiju prorektoru. \u0160aj\u0101
  sait\u0113 pieejams studiju virziena \u201cVesel\u012bbas apr\u016bpe\u201d iek\u0161\u0113j\u0101s
  kvalit\u0101tes vad\u012bbas padomes nolikums.\\n\\n\u013boti b\u016btisks process
  studiju programmas \u012bsteno\u0161an\u0101 un kvalit\u0101tes nodro\u0161in\u0101\u0161an\u0101
  ir kvalifik\u0101cijas eks\u0101mena rezult\u0101tu anal\u012bze. Tiek analiz\u0113ti
  eks\u0101mena rezult\u0101ti, studentu demonstr\u0113t\u0101s zin\u0101\u0161anas
  un prasmes, un uzskait\u012bts eks\u0101men\u0101 pieaicin\u0101to nozares profesion\u0101lu
  viedoklis. Balstoties uz \u0161o inform\u0101cijas anal\u012bzi, tiek pilnveidots
  studiju kursu satus, p\u0101rbaud\u012bjumu formas un veikti citi uzlabojumi.\\n\\n**Stud\u0113jo\u0161o
  pa\u0161p\u0101rvalde** p\u0101rst\u0101v stud\u0113jo\u0161o intereses vis\u0101s
  koled\u017eas kole\u0123i\u0101laj\u0101s instit\u016bcij\u0101s: Koled\u017eas
  Padom\u0113, Studiju virziena \u201cVesel\u012bbas apr\u016bpe\u201d Iek\u0161\u0113j\u0101s
  kvalit\u0101tes padom\u0113, Studiju programmu Padom\u0113s, un Zin\u0101tniskaj\u0101
  padom\u0113. Koled\u017eas Stud\u0113jo\u0161o pa\u0161p\u0101rvalde darbojas saska\u0146\u0101
  ar Stud\u0113jo\u0161o pa\u0161p\u0101rvaldes nolikumu (pieejams \u0161eit Studentu
  pa\u0161p\u0101rvaldes nolikums) un pamatojoties uz katra patst\u0101v\u012bga pa\u0161p\u0101rvaldes
  locek\u013ca ties\u012bb\u0101m un iesp\u0113j\u0101m piedal\u012bties Koled\u017eas
  un atbilsto\u0161o strukt\u016brvien\u012bbu lietu vadi\u0161an\u0101 un p\u0101rvald\u0113.\\n\\nKoled\u017eas
  darbs tiek organiz\u0113ts 4 administrat\u012bvaj\u0101s noda\u013c\u0101s, saska\u0146\u0101
  ar Koled\u017eas strukt\u016bras sh\u0113mu Studiju noda\u013ca, T\u0101l\u0101kizgl\u012bt\u012bbas
  un profesion\u0101las izgl\u012bt\u012bbas noda\u013ca, Metodisk\u0101 noda\u013ca
  un Administrat\u012bv\u0101 noda\u013ca. Nodalas darbojas saska\u0146\u0101 ar noda\u013cu
  nolikumiem.\\n\\n### 3. Kvalit\u0101tes politikas \u012bsteno\u0161anas meh\u0101nisma
  raksturojums un proced\u016bras augst\u0101k\u0101s izgl\u012bt\u012bbas kvalit\u0101tes
  nodro\u0161in\u0101\u0161anai\\n\\nKoled\u017eas Kvalit\u0101tes politika tika izstr\u0101d\u0101ta
  un apstiprin\u0101ta Koled\u017eas Padom\u0113 2016.gad\u0101. Normat\u012bvais
  dokuments pieejams \u0161eit: [Kvalit\u0101tes politika](#). Kvalit\u0101tes politikas
  izstr\u0101des proces\u0101 tika ietverti \u0101r\u0113jie normat\u012bvie regul\u0113jumi.
  Kvalit\u0101tes politika ir izdota saska\u0146\u0101 ar \u201cAugstskolu likumu\u201d,
  \u201cProfesion\u0101l\u0101s izgl\u012bt\u012bbas likumu\u201d, MK noteikumiem
  Nr.141 \u201cNoteikumi par pirm\u0101 l\u012bme\u0146a profesion\u0101l\u0101s augst\u0101kas
  izgl\u012bt\u012bbas valsts standartu\u201d, MK noteikumiem Nr.211 \u201cNoteikumi
  par valsts profesion\u0101l\u0101s vid\u0113j\u0101s izgl\u012bt\u012bbas standartu
  un valsts arodizgl\u012bt\u012bbas standartu\u201d k\u0101 ar\u012b Koled\u017eas
  iek\u0161\u0113jiem nolikumiem. Kvalit\u0101tes politika tika izveidota, lai nodro\u0161in\u0101tu
  Koled\u017eas virz\u012bbu uz izcil\u012bbu, un visu ieinteres\u0113to pus\u0113
  vajadz\u012bb\u0101m atbilsto\u0161u l\u012bdzsvarotu un ilgtsp\u0113j\u012bgu rezult\u0101tu
  sasnieg\u0161anu. Koled\u017eas kvalit\u0101tes politika veidota ar nol\u016bku
  uzlabot Koled\u017eas sniegtos pakalpojumus kvalit\u0101ti, palielin\u0101t izpratni
  par katru darbinieka ieguld\u012bjuma noz\u012bm\u012bgumu kvalit\u0101tes nodro\u0161in\u0101\u0161an\u0101,
  paaugstin\u0101t Koled\u017eas darb\u012bbas efektivit\u0101ti, pan\u0101kt stud\u0113jo\u0161o
  un sadarb\u012bbas partneru apmierin\u0101t\u012bbas un lojalit\u0101tes pieaugumu,
  veikt regul\u0101ru Koled\u017eas darb\u012bbas pa\u0161nov\u0113rt\u0113jumu un
  apzin\u0101t iesp\u0113jam\u0101s pilnveides virzienus.\\n\\nKvalit\u0101tes politika
  ir veidota saska\u0146\u0101 ar **EFQM Izcil\u012bbas mode\u013ca** metodolo\u0123iju.
  **EFQM Izcil\u012bbas modelis** sast\u0101v no devi\u0146iem krit\u0113rijiem: pieci
  no tiem aptver veicin\u0101t\u0101jus, \u010detri - rezult\u0101tus. Veicin\u0101t\u0101ju
  krit\u0113riju atspogu\u013co, kas un k\u0101 tiek dar\u012bts, savuk\u0101rt rezult\u0101tu
  krit\u0113riju atspogu\u013co sasniegums. Rezult\u0101tus sasniedz, pateicoties
  veicin\u0101t\u0101jiem, savuk\u0101rt veicin\u0101t\u0101jus pilnveido, pamatojoties
  uz sasniegtaiem rezult\u0101tiem. Tieks\u0113j\u0101s uz izaic\u012bmiem darb\u012bbas
  rezult\u0101tiem atbilst Koled\u017eas v\u012bzijai, k\u0101 ar\u012b klientu, darbinieku
  un sabiedr\u012bbas interes\u0113m. Vad\u012bba izstr\u0101d\u0101 misiju, v\u012bziju,
  v\u0113rt\u012bbas un \u0113tikas standartus, un ar savu darb\u012bbu ir piem\u0113rs
  p\u0101r\u0113jiem Koled\u017eas darbiniekam. Vad\u012bba veicina efekt\u012bvas
  p\u0101rvald\u012bbas sist\u0113mas veido\u0161anu, ievie\u0161anu un past\u0101v\u012bgu
  pilnveidi. T\u0101 veido sadarb\u012bbu ar\\n\\nar\u0113j\u0101m ieinteres\u0113taj\u0101m
  pus\u0113m, veido kvalit\u0101tes kult\u016bru Koled\u017eas darbinieku vid\u016b,
  nodro\u0161ina, ka Koled\u017eas darb\u012bba ir elast\u012bga un p\u0101rmai\u0146as
  tiek vad\u012btas efekt\u012bvi. Strat\u0113\u0123ija ir balst\u012bta uz eso\u0161\u0101s
  situ\u0101cijas un potenci\u0101lo iesp\u0113ju nov\u0113rt\u0113\u0161anu. Strat\u0113\u0123ija
  un tai pak\u0101rtotie Koled\u017eas iek\u0161\u0113jie normat\u012bvie dokumenti
  ir izstr\u0101d\u0101ti, tiek regul\u0101ri p\u0101rskat\u012bti, aktualiz\u0113ti,
  tiek izskaidroti un \u012bstenoti. Koled\u017eas strat\u0113\u0123ija nosaka Person\u0101la
  att\u012bst\u012bbas pl\u0101nu, taj\u0101 tiek paredz\u0113ts, k\u0101 koled\u017ea
  pilnveido un atbalsta darbinieku zin\u0101\u0161anas, prasmes un sp\u0113jas. Darbinieki
  Koled\u017e\u0101 r\u012bkojas saska\u0146oti, vi\u0146us iesaista un pilnvaro,
  ir nodro\u0161in\u0101ta efekt\u012bva iek\u0161\u0113j\u0101s komunik\u0101cijas
  sist\u0113ma, darbinieki tiek nov\u0113rt\u0113ti un apbalvoti un, tiek nodro\u0161in\u0101ta
  atbalsto\u0161a darba vide. Koled\u017ea ir elektronisk\u0101 lietved\u012bbas sist\u0113ma
  (LIS), sist\u0113ma HORIZON (person\u0101la un gr\u0101matved\u012bbas moduli),
  studiju sist\u0113mas Moodle un LAIS. Saska\u0146\u0101 ar Visp\u0101r\u012bg\u0101s
  datu aizsardz\u012bbas regulas pras\u012bb\u0101m, ir ieviesta datu aizsardz\u012bbas
  politika, un tiek iev\u0113roti datu aizsardz\u012bbas principi. Koled\u017eas att\u012bsta,
  efekt\u012bvi virza un \u012bsteno izgl\u012bt\u012bbu k\u0101 piepras\u012btu un
  kvalitat\u012bvu produktu, un, pakalpojumus t\u0101s ietvaros, lai rad\u012btu tiem
  arvien pieaugo\u0161u v\u0113rt\u012bbu atbilsto\u0161i klientu (\u0161aj\u0101
  izpratn\u0113 - sabiedr\u012bba un stud\u0113jo\u0161ie) vajadz\u012bb\u0101m. Koled\u017eas
  2017.gad\u0101 ir izstr\u0101d\u0101jusi un 2020. gad\u0101 aktualiz\u0113jusi studiju
  programmu kvalit\u0101tes indikatorus, darb\u012bbas rezultat\u012bvos r\u0101d\u012bt\u0101jus,
  p\u0113c kuriem var nov\u0113rt\u0113t, cik veiksm\u012bgi ir \u012bstenota kvalit\u0101tes
  politika, prognoz\u0113t n\u0101kotnes izpild\u012bjumu un rezult\u0101tus.\\n\\nNoz\u012bm\u012bgs
  Koled\u017eas studiju kvalit\u0101tes nov\u0113rt\u0113jums ir darba dev\u0113ju
  veidotais \u201cTOP 10 ieteikt\u0101k\u0101s koled\u017eas\u201d, kur\u0101 Koled\u017ea
  ir iek\u013cuvusi vair\u0101kus gadus p\u0113c k\u0101rtas, sa\u0146emot goda apsveikumu
  par iekl\u016b\u0161anu taj\u0101 (2018., 2019., 2020., 2021. un 2022. gad\u0101).\\n\\n4.
  Studiju virziena raksturojums\\n\\nKoled\u017ea 2021/2022. studiju gad\u0101 realiz\u0113ja
  \u010detras studiju programmas studiju virzien\u0101 \u201cVesel\u012bbas apr\u016bpe\u201d
  (skat. 2. tabulu):\\n\\n| Nr. p.k. | Nosaukums   | Apjoms KP | Ieg\u016bstam\u0101
  kvalifik\u0101cija | Studiju veids | L\u012bmenis |\\n|---------|-------------|-----------|------------------------|---------------|---------|\\n|
  1.      | \u0100rstniec\u012bba | 120       | \u0100rsta pal\u012bgs           |               |         |\\n\\n|
  Nr. | Studiju virziena | Ertums | Iest\u0101de | Pilna laika | 5.LKI: \u012bs\u0101
  cikla profesion\u0101l\u0101 augst\u0101k\u0101 izgl\u012bt\u012bba |\\n|-----|-----------------|--------|---------|-------------|-----------------------------------------------|\\n|
  2.  | \u0100rstniecisk\u0101 mas\u0101\u017ea | 80     | Masieris |             |                                               |\\n|
  3.  | Farm\u0101cija        | 100    | Farmaceita asistents |             |                                               |\\n|
  4.  | \u0100rstniec\u012bba      | 80     | neatliekam\u0101s medic\u012bnas \u0101rsta
  pal\u012bgs |             |                                               |\\n\\nStudiju
  virziena aktualit\u0101ti nosaka darba tirgus pras\u012bbas un iesp\u0113jas \u2013
  darba tirgus garant\u0113 izgl\u012bt\u012bbas sist\u0113mas att\u012bst\u012bbu
  t\u0101 pras\u012bb\u0101m. Latvij\u0101 tiek piev\u0113rsta v\u0113r\u012bba jaut\u0101jumiem
  par darba resursu profesion\u0101lo sagatavo\u0161anu atbilsto\u0161i darba tirgus
  izvirz\u012btaj\u0101m pras\u012bb\u0101m, ipp\u0101\u0161i respekt\u0113jot darba
  tirgu re\u0123ionos.\\n\\n**Studiju virziena \u201cVesel\u012bbas apr\u016bpe\u201d
  m\u0113r\u0137is** ir nodro\u0161in\u0101t augstas kvalit\u0101tes studijas pirm\u0101
  l\u012bme\u0146a profesion\u0101l\u0101s augst\u0101k\u0101s izgl\u012bt\u012bbas
  studiju programm\u0101s. Studiju virziena **m\u0113r\u0137is** ir balst\u012bts
  uz \u0161\u0101diem uz \u0161\u0101diem valsts att\u012bst\u012bbas pl\u0101no\u0161anas
  dokumentiem:\\n\\n- Nacion\u0101lais att\u012bst\u012bbas pl\u0101ns 2020-2027,
  kas ietver izgl\u012bt\u012bbu k\u0101 vienu no se\u0161\u0101m priorit\u0101t\u0113m,
  defin\u0113jot to k\u0101 Zin\u0101\u0161anas un prasmes person\u012bbas un valsts
  izaugsmei;\\n- Izgl\u012bt\u012bbas un zin\u0101tnes ministrijas sagatavot\u0101s
  Izgl\u012bt\u012bbas att\u012bst\u012bbas pamatnost\u0101dnes 2021-2027 \u201cN\u0101kotnes
  prasmes n\u0101kotnes sabiedr\u012bbai\u201d, kas ietver jauna akad\u0113misk\u0101
  person\u0101la karjeras modela ievie\u0161ana, kas paredz\u0113s, akad\u0113misk\u0101
  person\u0101la profesion\u0101lo kompeten\u010du pilnveidi, priorit\u0101ri - stiprinot
  digit\u0101l\u0101s kompetences un kompetences studentcentr\u0113ta, iek\u013caujo\u0161a
  studiju procesa nodro\u0161in\u0101\u0161anai, k\u0101 ar\u012b akad\u0113misk\u0101
  person\u0101la un industrijas sadarb\u012bbas stiprin\u0101\u0161anu inov\u0101cijsp\u0113jas
  att\u012bst\u012b\u0161anai un jauna augst\u0101k\u0101s izgl\u012bt\u012bbas p\u0101rvald\u012bbas
  modela ievie\u0161ana Latvij\u0101 un koled\u017eu vieta izgl\u012bt\u012bbas sist\u0113m\u0101;\\n-
  Digit\u0101l\u0101s transform\u0101cijas pamatnost\u0101dnes 2021.-2027. gadam.
  Digit\u0101l\u0101 kompetence ir atz\u012bta par 21. gadsimta pamatkompetenci. Ieguld\u012bjumi
  digit\u0101laj\u0101s kompetenc\u0113s vis\u0101 Latvijas izgl\u012bt\u012bbas sist\u0113m\u0101
  ir viens pamatnost\u0101du pamatvirzieniem.\\n- Koled\u017ea ir m\u016bsdienu profesion\u0101lo
  augst\u0101ko izgl\u012bt\u012bbas studiju programmu vesel\u012bbas apr\u016bpes
  un soci\u0101l\u0101s labkl\u0101j\u012bbas jom\u0101. Koled\u017eas studiju virziena
  \u201cVesel\u012bbas apr\u016bpe\u201d att\u012bst\u012bba balst\u0101s uz R\u012bgas
  Stradi\u0146a universit\u0101tes [Sarkan\u0101 Krusta medic\u012bnas koled\u017eas
  att\u012bst\u012bbas strat\u0113\u0123iju 2021. \u2013 2027.gadam](#).\\n\\nKoled\u017ea
  nodro\u0161ina augstas kvalit\u0101tes studijas un zin\u0101tnisko darb\u012bbu
  vesel\u012bbas apr\u016bpes jom\u0101. To apliecina Koled\u017eai pie\u0161\u0137irtais
  sertifik\u0101ts par atbilst\u012bbu EFQM (the European Foundation for Quality Management)
  kvalit\u0101tes modela pras\u012bb\u0101m iek\u0161\u0113jas kvalit\u0101tes nodro\u0161in\u0101\u0161an\u0101.\\n\\nKoled\u017eas
