  izmantota lat\u012b\u0146u valod\u0101.\\n\\nStudentu pa\u0161v\u0113rt\u0113juma
  veicina\u0161anai studiju kursu aptaujas studentiem j\u0101nov\u0113rt\u0113 ne
  tikai doc\u0113t\u0101ju kompetences vad\u012bt kursu, bet ar\u012b savas, piem\u0113ram,
  k\u0101 ir uzlabojies digit\u0101lo caurviju prasmju l\u012bmenis un k\u0101 stud\u0113jo\u0161ie
  nov\u0113rt\u0113 savu iniciat\u012bvu/iesaist\u012btu zin\u0101\u0161anu, prasmju
  apguv\u0113.\\n\\nStud\u0113jo\u0161o sasniegumu format\u012bvai v\u0113rt\u0113\u0161anai
  tiek pielietoti ar\u012b galda sp\u0113lu elementi. Lai gan \u0161im br\u012bdim
