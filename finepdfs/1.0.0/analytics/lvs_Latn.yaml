  lab\u0101ko pasaules prak\u0161u apg\u016b\u0161an\u0101 un p\u0101rnes\u0113.\\n\\nnjaun\u0101
  konseRvat\u012bv\u0101 PaRtija\\n\\ngus var\u0113tu atdzimt, k\u013c\u016bstot par
  vienu no C\u0113su viz\u012btkart\u0113m un pulc\u0113\u0161an\u0101s vietu novada
