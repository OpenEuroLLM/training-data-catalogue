  katra izgl\u012btojam\u0101  att\u012bst\u012bbas vajadz\u012bbu noteik\u0161anai
  izmanto izaugsmes dinamikas apkopo\u0161anu un izv\u0113rt\u0113jumu (skol\u0113nu
  portfolio). Darb\u0101  ar vec\u0101kiem tiek pied\u0101v\u0101tas da\u017e\u0101das
  sadarb\u012bbas formas \u2013 vec\u0101ku vad\u012bt\u0101s karjeras stundas, rado\u0161\u0101s
  nodarb\u012bbas /darbn\u012bcas, l\u012bdzdal\u012bba \u0101rpusstundu un \u0101rpusskolas
  pas\u0101kumos, piem\u0113ram, tirdzi\u0146i, SMU, ekskursijas, p\u0101rg\u0101jieni,
  \\\"Dziesmu diena\\\". Semestru nosl\u0113gumos tiek izteikta pateic\u012bba akt\u012bv\u0101kaj\u0101m
  \u0123imen\u0113m.\\n\\nIzgl\u012btojamiem tiek akcent\u0113tas v\u0113rt\u012bbas
  un tikumi (drosme, atbild\u012bba, tolerance), veidota pozit\u012bva attieksme pret
  valsts simboliem, patriotismu un lojalit\u0101ti Latvijai. Izgl\u012btojamie m\u0113r\u0137tiec\u012bgi
  un apzin\u012bgi ir piedal\u012bju\u0161ies skolas, novada, valsts konkursos, ieguvu\u0161i
  godalgotas vietas un guvu\u0161i atzin\u012bbu. Novad\u0101  piedal\u012bju\u0161ies
  21 da\u017e\u0101da veida konkurs\u0101, sacens\u012bb\u0101s, olimpi\u0101d\u0113s  un
  ieg\u016bstot 14 godalgot\u0101s vietas  vai atzin\u012bbas, tas ir 66, 6%\u2013
  Madonas novada skolu orient\u0113\u0161an\u0101s sacens\u012bb\u0101s, \\\"Uzziedi
  Latvijai\\\", \\\"Mans Ziemassv\u0113tku sapnis\\\", \\\"O. Kalpaka kauss -2023\\\"
  rado\u0161o darbu konkurs\u0101  un kl\u0101tienes komandu sacens\u012bb\u0101s;
  Valst\u012b piedal\u012b\u0161an\u0101s 17 da\u017e\u0101dos konkursos, sporta sacens\u012bb\u0101s
  un projektos.   Tajos izgl\u012btojamie ieguvu\u0161i 12 godalgotas vietas vai atzin\u012bbas,
  tas ir 70,5 %  \u2013 R\u012bgas Motormuzeja konkurss \\\"Dro\u0161s ce\u013c\u0161
  uz m\u0101j\u0101m\\\" 1.vieta, Latvijas Dzelzce\u013ca rado\u0161o darbu konkurss
  \\\"Uzz\u012bm\u0113 n\u0101v\u0113jo\u0161o ier\u012bci\\\" 1.vieta,  LOK z\u012bm\u0113jumu
  konkurss \\\" Es soli pa soli sporti\u0146\u0101\\\"\\n\\nSecin\u0101jumi.\\n\\nTiek
  atbalst\u012bta skol\u0113nu l\u012bder\u012bbas veicin\u0101\u0161ana  un sekm\u0113ts
  efekt\u012bvs l\u012bdzp\u0101rvaldes darbs. K\u0101 pozit\u012bv\u0101 pa\u0161izpausme
  ir skol\u0113nu darbo\u0161an\u0101s, sevis apliecin\u0101\u0161anai un pa\u0161realiz\u0101cijai
  da\u017e\u0101da m\u0113roga konkursos, projektos, sacens\u012bb\u0101s.\\n\\nTiek
  realiz\u0113ta individu\u0101l\u0101 sadarb\u012bba starp izgl\u012btojam\u0101
  \u0123imeni un skolu, kas v\u0113rsta uz pozit\u012bvu un konstrukt\u012bvu pas\u0101kumu
  kopumu, lai veicin\u0101tu izgl\u012btojam\u0101 vispus\u012bgu att\u012bst\u012bbu.\\n\\n7.
  Citi sasniegumi\\n\\n7.1. Jebk\u0101di citi sasniegumi, par kuriem v\u0113las inform\u0113t
  izgl\u012bt\u012bbas iest\u0101de (galvenie secin\u0101jumi par izgl\u012bt\u012bbas
