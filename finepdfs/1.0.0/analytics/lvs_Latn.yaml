  |\\n\\nAnal\u012bze un nov\u0113rt\u0113jums par stud\u0113jo\u0161o nosl\u0113guma
  darbu t\u0113m\u0101m\\n\\nStudiju programm\u0101 \u201c\u0100rstniec\u012bba\u201d
  ar kvalifik\u0101ciju neatliekam\u0101s medic\u012bnas \u0101rsta pal\u012bgs katru
  gadu sadarb\u012bb\u0101 ar ekspertiem nozar\u0113 tiek izstr\u0101d\u0101ti lieti\u0161\u0137o
  p\u0113t\u012bjumu virzieni, kas tiek saskanoti studiju programmas padomes s\u0113d\u0113
  un apstiprin\u0101ti RSU SKMK Zin\u0101tnisk\u0101 padom\u0113. Stud\u0113jo\u0161o
  nosl\u0113guma darbu t\u0113mas ir aktu\u0101las nozar\u0113 un darba tirg\u016b,
