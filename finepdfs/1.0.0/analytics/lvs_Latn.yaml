  k\u0101rt\u012bm, uz kur\u0101m ir doti medic\u012bnas termini un tie ir j\u0101m\u0101k
  paskaidrot un atmin\u0113t.\\n\\nKl\u012bnisko proced\u016bru eks\u0101meni un studiju
  kurss \\\"Soci\u0101l\u0101 farm\u0101cija un farameitisk\u0101 apr\u016bpe\\\"
  tiek \u012bstenota, izmantojot objekt\u012bvi struktur\u0113t\u0101s kl\u012bniskais
