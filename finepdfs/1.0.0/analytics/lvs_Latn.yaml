  p\u0101rcelts Covid-19 pulce\u0161an\u0101s ierobe\u017eojumu d\u0113\u013c.\\n\\nDarbadev\u0113ju
  Karjeras dienas koled\u017e\u0101\\n\\n2021.gada 19.oktobr\u012b pirmo kursu izgl\u012btojamajiem
  tika r\u012bkotas Karjeras dienas - darba dev\u0113ju informat\u012bvs pas\u0101kums
