  apmekl\u0113jumu noteikt\u0101s darba dien\u0101s. Atbilsto\u0161i\\nm\u0101c\u012bbsp\u0113ku
  pras\u012bb\u0101m tiks rezerv\u0113tas telpas, kur\u0101s m\u0101c\u012bbsp\u0113ks
  kl\u0101tien\u0113 vad\u012bja nodarb\u012bbas\\nun stud\u0113jo\u0161ie kl\u0101tien\u0113
  piedal\u012bj\u0101s praktisko iema\u0146u apguv\u0113. Studiju programmas praktiskaj\u0101\\n\u012bsteno\u0161an\u0101
  kl\u0101tienes studiju form\u0101 tika izmantotas t\u0101das studiju metodes k\u0101
  semin\u0101ri,\\nlaboratorijas darbi, simul\u0113t\u0101s vides lomu sp\u0113les,
  situ\u0101ciju anal\u012bzes, patst\u0101v\u012bg\u0101s studijas,\\nesejas, refer\u0101ti,
