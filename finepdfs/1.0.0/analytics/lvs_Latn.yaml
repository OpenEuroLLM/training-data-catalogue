  un izveidotot taj\u0101 Dabas draugu rado\u0161\u0101 p\u0113tniec\u012bbas centru
  \u201cDadzis\u201d. \u012astenojot projektu, p\u0113tniec\u012bbas centr\u0101 b\u0113rniem
  un jaunie\u0161iem b\u016bs nodro\u0161in\u0101tas jaunas un daudzveid\u012bgas
  sabiedrisko aktivit\u0101\u0161u pakalpojumu iesp\u0113jas, nodro\u0161inot akt\u012bvas
  un inform\u0113tas sabiedr\u012bbas att\u012bst\u012bbas potenci\u0101lu.\\n\\nProjekta
  kop\u0113jais bud\u017eets ir 77324,71 EUR tai skait\u0101 ELFLA finans\u0113jums
  ir 44087,79 EUR.\\n\\nL\u012bga Strode\\nProjektu vad\u012bt\u0101ja\\n\\nEnergoefektivit\u0101tes
  paaugstin\u0101\u0161ana\\n\\nVil\u0101nu pils\u0113tas izgl\u012bt\u012bbas iest\u0101d\u0113
  ir uzs\u0101kta projekta \u201cSekm\u0113t energoefektivit\u0101tes paaugstin\u0101\u0161anu
  Vil\u0101nu pils\u0113tas pirmsskolas izgl\u012bt\u012bbas iest\u0101d\u0113\u201d
  \u012bsteno\u0161ana.\\n\\nProjekta m\u0113r\u0137is ir samazin\u0101t prim\u0101r\u0101s
  energijas pat\u0113ri\u0146u par 254751 kWh/gada, veicot ieguld\u012bjumus Vil\u0101nu
  pils\u0113tas PII \u0113k\u0101 (Raina iel\u0101 33B) atbilsto\u0161i Vil\u0101nu
  novada Att\u012bst\u012bbas programmas priorit\u0101t\u0113m, pan\u0101kt energoefektivit\u0101tes
  paaugstin\u0101\u0161anu un samazin\u0101t Vil\u0101nu novada pa\u0161vald\u012bbas
  siltumapgades izdevumus.\\n\\nIepirkumu proced\u016bras rezult\u0101t\u0101 l\u012bgums
  par b\u016bvdarb\u012bbu veik\u0161anu tika nosl\u0113gts ar b\u016bvuz\u0146\u0113m\u0113ju
  SIA \u201cLatgalija\u201d (EUR 516 681,86 bez PVN), par b\u016bvuzraudz\u012bbas
  veik\u0161anu ar SIA \u201cRS Property\u201d, par autoruzraudz\u012bbas veik\u0161anu
  ar SIA \u201cProenergo\u201d. Pl\u0101notie darbi: fas\u0101des sieenu un cokola
  sieenu siltin\u0101\u0161ana, jumta p\u0101rs\u0113guma siltin\u0101\u0161ana, logu
  un \u0101rdurvu nomai\u0146a un siltumapgades sist\u0113mas iek\u0161\u0113jo t\u012bklu
  caurulvadu siltumizol\u0101cijas uzlabo\u0161ana. B\u016bvdarb\u012bba ir paredz\u0113ts
  veikt l\u012bdz septembrim.\\n\\nProjekta kop\u0113j\u0101s izmaksas ir 631 855,47
  EUR, no t\u0101m Eiropas Re\u0123ion\u0101l\u0101 att\u012bst\u012bbas fonda (ERAF)
  finans\u0113jums projekta \u012bsteno\u0161anai ir 322 300,00 EUR.\\n\\nL\u012bga
  Strode, Projektu vad\u012bt\u0101ja\\n\\nIesp\u0113ja ieg\u016bt profesiju Vil\u0101nos\\n\\nR\u0113zeknes
  Tehnikuma Vil\u0101nu fili\u0101le jaunie\u0161i vecum\u0101 no 17 l\u012bdz 29
  gadiem tiek aicin\u0101ti apg\u016bt divas m\u0101c\u012bbu programm\u0101s un ieg\u016bt
  attiec\u012bgu profesiju: Autotransports (profesija - autoatsl\u0113dznieks) un
  administrat\u012bvie un sekret\u0101ra pakalpojumi (profesija - lietvedis).\\n\\nM\u0101c\u012bbu
  ilgums ab\u0101s programm\u0101s \u2013 viens gads, stipendija no 70 l\u012bdz 115
  EUR m\u0113nes\u012b.\\n\\nTu vari pieeikties, ja:\\n- esi vecum\u0101 no 17 l\u012bdz
  29 gadiem (ieskaitot);\\n- ir ieg\u016bta vismaz pamata, vid\u0113j\u0101 vai profesion\u0101l\u0101
  videj\u0101 izgl\u012bt\u012bba.\\n\\nDokumentus pie\u0146em Vil\u0101nu fili\u0101l\u0113,
  Kult\u016bras laukums 1. T\u0101lr\u016bnis uz\u0146\u0113m\u0101m: 64662150; 29338430.\\n\\nSoci\u0101l\u0101
  atbalsta centr\u0101 \u201cCer\u012bba\u201d tiks izveidota sadz\u012bves prasmju
  istaba\\n\\nLauku atbalsta dienest\u0113 tika atbalst\u012bts projekta iesniegums
  sadz\u012bves prasmju istabas ier\u012bko\u0161anai Soci\u0101l\u0101 atbalsta centr\u0101
  \u201cCer\u012bba\u201d.\\n\\n\u012astenojot \u0161o projektu, SAC \u201cCer\u012bba\u201d
  pied\u0101v\u0101ja jaunu pakalpojumu \u2013 \u201cSadz\u012bves prasmju istabu\u201d.
  Pakalpojumu var\u0113s izmantot jaunie\u0161i, jaun\u0101s m\u0101mi\u0146as un
  citi cilv\u0113ki no soci\u0101li riska grup\u0101m, lai pilnveidotu savas sadz\u012bves
  un saskarsmes prasmes. Izmantojot Eiropas Lauksaimniec\u012bbas fonda lauku att\u012bst\u012bbas
  finans\u0113jumu un Vil\u0101nu novada pa\u0161vald\u012bbas l\u012bdzfinans\u0113jumu,
  tiks ieg\u0101d\u0101ta sadz\u012bves technika (multiv\u0101rm\u0101s katlis, mikrovilpju
  kr\u0101sns, vafe\u013cu panna, cepeskr\u0101sns un elektrisk\u0101 virsma, \u016bdens
  filtrs, t\u0113jkanna, kafijas autom\u0101ts, tosteris, mikseris, blenderis, ga\u013cas
  mal\u0101ma ma\u0161\u012bna, virtuves kombains, aug\u013cu \u017e\u0101v\u0113t\u0101js
  un sulu spiede) un m\u0113beles (gludin\u0101m\u0101s d\u0113lis, \u0161ujma\u0161\u012bna,
  gluddeklis, virtuves kr\u0113slis un galds).\\n\\nPublik\u0101s finans\u0113jums
  projekta \u012bsteno\u0161anai \u2013 EUR 2 334,20 EUR.\\n\\nMargarita Isajeva,
  sabiedrisko attiec\u012bbu specialiste\\n\\nXVII Tautas muzikantu sv\u0113tki folkloristes
  Stef\u0101nijas U\u013canovskas z\u012bm\u0113\\n\\nJau daudzus gadus augusta pirmaj\u0101
  sestdien\u0101 Vi\u013c\u0101nos norisin\u0101s tautas muzikantu sv\u0113tki. Sogad
  tie norisin\u0101sies 5. augusta polu folkloristes Stef\u0101nijas U\u013canovskas
  z\u012bm\u0113, kas 19. gs. otraj\u0101 pus\u0113 p\u0113t\u012bja Vi\u013c\u0101nu
  apkaimes folkloru un trad\u012bcijas.\\n\\nXVII Tautas muzikantu sv\u0113tki folkloristes
  Stef\u0101nijas U\u013canovskas z\u012bm\u0113 ir Tautas muzikantu biedr\u012bbas,
  Vi\u013c\u0101nu novada pa\u0161vald\u012bbas un R\u0113zeknes Tehnolo\u0123iju
  akad\u0113mijas sadarb\u012bbas projekts, kur\u0101 ir apvienoti gan zin\u0101tniekie
  p\u0113t\u012bjumi, gan \u0161o p\u0113t\u012bjumu praktiska pielieto\u0161ana kult\u016bras
  noris\u0113s, kas nodro\u0161ina zin\u0101tnes integr\u0101ciju nemateri\u0101l\u0101s
  kult\u016bras mantojuma p\u0101rmanto\u0161anas un saglab\u0101\u0161anas proces\u0101.
  Tautas muzikantu sv\u0113tku norise polu folkloristes Stef\u0101nijas U\u013canovskas
  z\u012bm\u0113 nodro\u0161ina tie\u0161i Vi\u013c\u0101nos pierakst\u012bto muzikas
  materi\u0101la (dejas, rot\u0101lu u.c.) aktu\u0101liz\u0113\u0161anu un nodo\u0161anu
  n\u0101kamajam pauz\u0113m.\\n\\nSv\u0113tku programma\\n\\n- 10:00 \u2013 13:00
  Zin\u0101tniekie las\u012bjumi br\u012bv\u0101 dab\u0101 (\u0101r lauk\u0101) pie
  Vi\u013c\u0101nu kult\u016bras nama)\\n- Piedal\u0101s zin\u0101tnieki no Latvijas,
  Polijas, V\u0101cijas, Krievijas. Muzic\u0113 Latvijas individu\u0101lie tautas
  muzikanti (repertu\u0101r\u0101 19.gs.beigu \u2013 20.gs.s\u0101kuma m\u016bzika)\\n-
  13:00 \u2013 14:00 2016.gada eksped\u012bcijas fotogr\u0101fiju izst\u0101des \u201cPa
  Stef\u0101nijas U\u013canovskas p\u0113d\u0101m\u201d atkl\u0101\u0161ana Vi\u013c\u0101nu
  novadp\u0113tniec\u012bbas muzej\u0101\\n- 13:00-22:00 Amatnieku darbu tirgus un
  rado\u0161\u0101s darbn\u012bcas. Muzic\u0113 Latvijas indiv\u012bdu\u0101lie tautas
  muzikanti (Laukum\u0101 pie kult\u016bras nama un Vi\u013c\u0101nu novada domes)\\n-
  16:30 -17:00 Amatnieku prezent\u0101cijas, godin\u0101\u0161ana\\n- 17:00 \u2013
  17:30 S.U\u013canovskas pierakst\u012bto m\u012bklu konkurss (vada Ilm\u0101rs Drels)\\n-
  17:30 \u2013 18:30 S.U\u013canovskas pierakst\u012bto rot\u0101lu meistarklase (vada
  Ilm\u0101rs Drels)\\n- 19:00 \u2013 22:30 XVII Tautas muzikantu sv\u0113tku di\u017eais
  koncerts/za\u013cumballe. Piedal\u0101s viesi no Lietuvas, Igaunijas, Baltkrievijas,
  Latvijas muzikant grupas un muzikanti-vecmeistari.\\n\\nJauna koncertprogramma \u201cKur
  bitis, t\u012b mads\u201d un etnogr\u0101fiskie Vi\u013c\u0101nu apkaimes tautast\u0113rpi\\n\\nLauku
  atbalsta dienests apstiprin\u0101ja Vi\u013c\u0101nu kult\u016bras nama kolekt\u012bvu
  un Vi\u013c\u0101nu novada pa\u0161vald\u012bbas izstr\u0101d\u0101t\u0101 projektu
  \u201cKur bitis, t\u012b mads\u201d\\n\\nValsts iest\u0101\u017eu pakalpojumi klientu
  apkalpo\u0161anas centr\u0101 Vi\u013c\u0101nos\\n\\nLai sa\u0146emtu vair\u0101ku
  valsts iest\u0101\u017eu pakalpojumus, Vi\u013c\u0101nu novada iedz\u012bvot\u0101jiem
  vairs nav j\u0101dodas uz atsevi\u0161\u0137\u0101m valsts iest\u0101d\u0113m, jo
  daudzus pakalpojumus var sa\u0146emt vienuviet \u2014 Valsts un pa\u0161vald\u012bbas
  vienot\u0101j klientu apkalpo\u0161anas centr\u0101 (VPVKAC), kas atrodas Vi\u013c\u0101nu
  novada pa\u0161vald\u012bbas telp\u0101s 2.st\u0101v\u0101 (Kult\u016bras laukum\u0101
  1a, Vi\u013c\u0101ni).\\n\\nL\u012bdz \u0161im br\u012bd\u012bm VPVKAC pakalpojumus
  ir izmantoju\u0161i vair\u0101k nek\u0101 3600 Vi\u013c\u0101nu pilso\u0146u un
  novada iedz\u012bvot\u0101ju. V\u0113rt\u0113jot VPVKAC darbu \u0161\u012b gada
  pirmajos \u010detros m\u0113ne\u0161os, Vi\u013c\u0101nu novada VPVKAC ie\u0146em
  augsto 5.vietu ar 157,1 sniegtojamiem pakalpojumiem videj\u0101 m\u0113nes\u012b.
  Visvair\u0101k piepras\u012btie pakalpojumi Vi\u013c\u0101nu novada VPVKAC ir Valsts
  soci\u0101l\u0101s apdro\u0161in\u0101\u0161anas pakalpojumi (pie\u0161m\u0113ram,
  darbnesp\u0113jas situ\u0101cijas pabalties, dzim\u0161anas situ\u0101cijas pabalties,
  mir\u0161anas situ\u0101cijas pabalties) un Valsts ien\u0113mumu dienesta pakalpojumi
  (gada ien\u0101kumu deklar\u0101cijas pie\u0146em\u0161ana, elektronisk\u0101s algas
  nodok\u013ca grafmat\u012bna, pieteik\u0161an\u0101s EDS lieto\u0161anai. VID konstat\u0113j\u0101s).
  V\u0113rt\u0113jot Vi\u013c\u0101nu novada VPVKAC darbu 2017.gad\u0101, m\u016bsu
  klientu apkalpo\u0161anas centrs tiek atz\u012bts par regiona l\u012bderi sniegto
  pakalpojumu ska\u012bta zi\u0146\u0101.\\n\\nApmekl\u0113t\u0101ji augstu nov\u0113rt\u0113
  \u0161\u012b centra darb\u012bbas priek\u0161roc\u012bbas, \u0101trumu un \u0113rt\u012bbu.
  Aicin\u0101m visus Vi\u013c\u0101nu novada iedz\u012bvot\u0101jus izmantot \u0161o
  iesp\u0113ju ar\u012b turpm\u0101k. Pl\u0101nojot savu viz\u012bti, j\u0101\u0146em
  v\u0113r\u0101 ka visliel\u0101kais klientu piepl\u016bdums ir v\u0113rojams m\u0113ne\u0161a
  s\u0101kum\u0101 un beig\u0101s, k\u0101 ar\u012b ned\u0113\u013cas s\u0101kum\u0101
  un beig\u0101s. L\u012bdz ar to l\u016bdzam apmekl\u0113t\u0101jus b\u016bt paciet\u012bgiem.
  L\u016bdzam piev\u0113rst uzman\u012bbu tam, ka VPVKAC nodro\u0161ina eksperta konsult\u0101cijas.
  Ipa\u0161i sare\u017e\u0123\u012bto jaut\u0101jumu risin\u0101\u0161anai b\u016bs
  iesp\u0113jams pieteikt kli\u0113tienes konsult\u0101cijas laiku noteiktaj\u0101
  valsts iest\u0101des fili\u0101l\u0113 vai sazin\u0101ties ar valsts iest\u0101des
  p\u0101rst\u0101vi telefoniski.\\n\\nLai izmantotu valsts iest\u0101\u017eu e-pakalpojumus
  port\u0101l\u0101 www.latvia.lv, b\u016bs nepiecie\u0161ama autoriz\u0101cija, izmantojot
  klienta internetbanku. Veiksm\u012bgu autoriz\u0101ciju nodro\u0161ina ar\u012b
  dro\u0161s elektroniskais paraksts vai e-ID. Pieteicoties kli\u0113tienes pakalpojumam,
  l\u016bdzi ir j\u0101\u0146em personu apliecino\u0161s dokuments.\\n\\nMargarita
  Isajeva\\nsabiedrisko attiec\u012bbu speci\u0101liste\\n\\nJ\u016blija Krilkova\\nklientu
  apkalpo\u0161anas speci\u0101liste\\n\\nB\u016bs pieejams atbalsts ar lauksaimniec\u012bbu
  saimnieciskaj\u0101m aktivit\u0101t\u0113m\\n\\nLauku atbalsta dienests (LAD) izsludina
  projektu iesniegumu pie\u0146em\u0161anu \\\"Lauku saimniec\u012bbu un uz\u0146\u0113m\u0113jdarb\u012bbas
  att\u012bst\u012bbas\\\" apak\u0161pas\u0101kuma \\\"Atbalsts ies\u016bdz\u012bgumam
  ar lauksaimniec\u012bbu nesaist\u012btu darb\u012bbu rad\u012b\u0161anu un att\u012bst\u012b\u0161anu\\\"
  otras k\u0101rtas tr\u012bs aktivit\u0101t\u0113m:\\n\\n- \\\"Ar lauksaimniec\u012bbu
  nesaist\u012btu darb\u012bbu att\u012bst\u012bba\\\",\\n- \\\"Ar lauksaimniec\u012bbu
  nesaist\u012btu darb\u012bbu da\u017e\u0101do\u0161ana\\\",\\n- \\\"T\u016brisma
  aktivit\u0101\u0161u veicina\u0161ana\\\".\\n\\nProjektu iesniegumu pie\u0146em\u0161ana
  aktivit\u0101t\u0113s notiks no 2017. gada 1. augusta l\u012bdz 31.augustam.\\n\\nPas\u0101kuma
  m\u0113r\u0137is ir veicin\u0101t ar lauksaimniec\u012bbu nesaist\u012btu saimniecisko
  darb\u012bbu un nodarbin\u0101t\u012bbu lauku teritorij\u0101s, dodot iesp\u0113ju
  iesitenot\u0101s da\u017e\u0101das ar lauksaimniec\u012bbu nesaist\u012btas, k\u0101
  ar\u012b t\u016brisma aktivit\u0101tes, t\u0101d\u0113j\u0101di palielinot ien\u0101kumu
  l\u012bmeni lauku re\u0123ionos.\\n\\nPieejamas publiskas finans\u0113jums aktivit\u0101t\u0113m
  \u201cAr lauksaimniec\u012bbu nesaist\u012btu darb\u012bbu att\u012bst\u012bba\u201d
  un \u201cAr lauksaimniec\u012bbu nesaist\u012btu saimniecisko darb\u012bbu da\u017e\u0101do\u0161ana\u201d
  ir desmit miljoni eiro; aktivit\u0101te \u201cTur\u016bna aktivit\u0101\u0161u veicin\u0101\u0161ana\u201d
  \u2013 ar\u012b desmit miljoni eiro. Pieejamas finans\u0113jums vis\u0101s aktivit\u0101t\u0113s
  ir sadal\u012bts p\u0113c re\u0123ionaliz\u0101cijas principa.\\n\\nPla\u0161\u0101ka
  inform\u0101cija par abalta\u0161a pas\u0101kumiem ir las\u0101ma LAD m\u0101jaslap\u0101
  www.lad.gov.lv izv\u0113ln\u0113 \u201cAbalta\u0161a pas\u0101kumi\u201d. Pas\u0101kumi
  tiek \u012bstenoti Eiropas Savien\u012bbas Eiropas Lauksaimniec\u012bbas fonda lauku
  att\u012bst\u012bbai un Lauku att\u012bst\u012bbas programmas ietvaros.\\n\\n**Swarg\u0101kie
  datumi lauksaimniekiem**\\n\\nPavasaris, vasara un rudens ir laiks, kad lauksaimniekiem
  j\u0101iev\u0113ro vair\u0101ki noz\u012bm\u012bgi datumi, lai sa\u0146emtu atbalsta
  maks\u0101jumus.\\n\\nL\u012bdz 25. j\u016bnijam laukiem j\u0101b\u016bt aps\u0113tiem
  vai apst\u0101d\u012btiem ar vienotaj\u0101 plat\u012bb\u0101 maks\u0101juma pieeikum\u0101
  nor\u0101d\u012bto kult\u016bru, nodro\u0161inot kult\u016brag\u016bra biez\u012bbu
  vismaz 60% apm\u0113r\u0101 no lauk\u0101 augo\u0161ajiem augiem. L\u012bdz 31.
  augustam LAD j\u0101sp\u0113j konstat\u0113t audz\u0113t\u0101s kult\u016braugs
  vai t\u0101 atliekas uz lauka.\\n\\n- L\u012bdz 15. augustam ir j\u0101b\u016bt
  nogani\u0161iem vai noplautiem un nov\u0101ktiem z\u0101\u013c\u0101jiem, kas nav
  ES noz\u012bmes z\u0101\u013c\u0101ju biotopi un kas nav z\u0101l\u0101ji, ko izmanto
  b\u012bskop\u012bb\u0101 nekt\u0101ra v\u0101ksnai vai \u0101rstniec\u012bbas augu
  v\u0101ksnai.\\n- L\u012bdz 15. septembrim ir j\u0101b\u016bt nogani\u0161iem vai
  noplautiem un nov\u0101ktiem z\u0101\u013c\u0101jiem, kas ir ES noz\u012bmes z\u0101\u013c\u0101ju
  biotopi vai tie z\u0101l\u0101ji, ko izmanto b\u012bskop\u012bb\u0101 nekt\u0101ra
  v\u0101ksnai vai \u0101rstniec\u012bbas augu v\u0101ksnai.\\n- L\u012bdz 15. septembrim
  ir j\u0101b\u016bt meh\u0101niski apstr\u0101d\u0101t\u0101m; rindstarp\u0101m,
  kuru platums p\u0101rsniedz vienu metru, j\u0101b\u016bt izplaut\u0101m vai meh\u0101niski
  apstr\u0101d\u0101t\u0101m, nokaltu\u0161ie ilggad\u012bgo st\u0101diju moki vai
  kr\u016bmi j\u0101aizv\u0101c.\\n- L\u012bdz 15. septembrim j\u0101saglab\u0101
  plat\u012bbas ar stiebrz\u0101lu pas\u0113ju, kas bija s\u0113ta zem var\u0101riem.\\n-
  L\u012bdz 1. oktobrim j\u0101b\u016bt nokultiem z\u0101\u013c\u0101jiem, kas izmantojami
  s\u0113klaudz\u0113\u0161anai.\\n- Saja gad\u0101 k\u0101 ekolo\u0123iski noz\u012bm\u012bgas
  plat\u012bbas zain\u0101\u0161anas pras\u012bbu iev\u0113ro\u0161anai tiek uzskat\u012btas
  ar\u012b starpkult\u016bras, bet t\u0101m j\u0101b\u016bt ies\u0113t\u0101m l\u012bdz
  1. septembrim un uz lauka j\u0101b\u016bt vismaz l\u012bdz 31. oktobrim.\\n\\nPla\u0161\u0101k
  par sv\u0101r\u012bgiem datumiem lauksaimniec\u012bb\u0101 var las\u012bt LAD m\u0101jaslap\u0101
  materi\u0101la \u201cSwarg\u0101kie datumi un izmai\u0146as plat\u012bbu maks\u0101jumu
  san\u0113m\u0161anai 2017. gad\u0101\u201d.\\n\\nZoja Golovlova\\nLauku att\u012bst\u012bbas
  speci\u0101liste\\n\\n---\\n\\n**Vil\u0101nu novada pa\u0161vald\u012bbas**\\nSaisto\u0161ie
  noteikumi Nr.93\\n\u201eNodevas par izklaid\u0113jo\u0161\u0101 rakstura pas\u0101kumiro\u0161anu
  publisk\u0101s viet\u0101s Vil\u0101nu novad\u0101\u201d\\n\\nEdzi\u0146i saskars
  ar Likuma \u201ePar nodokliem un nodev\u0101m\u201d 12.panta pirmais d\u0101jas
  2.punktu, Ministru kabineta 2005.gada 28.j\u016bnija noteikumi Nr.480 \u201cNoteikumi
  par k\u0101rt\u012bbu, k\u0101d\u0101 aizv\u0101ld\u012bbas var uzlikt pa\u0161vald\u012bbu
  nodevas\u201d 3.punktu\\n\\n**I. Visp\u0101r\u012bgie jaut\u0101jumi**\\n\\n1. Saisto\u0161ie
  noteikumi nosaka Vil\u0101nu novada pa\u0161vald\u012bbas (turpm\u0101k tekst\u0101
  \u2014 pa\u0161vald\u012bba) nodevas par izklaid\u0113jo\u0161\u0101 rakstura pas\u0101kumu
  r\u012bko\u0161anu publisk\u0101s viet\u0101s Vil\u0101nu novada samaksas k\u0101rt\u012bbu
  un apm\u0113ru.\\n\\n2. Nodevas maks\u0101t\u0101ji ir fiziskas un juridiskas personas,
