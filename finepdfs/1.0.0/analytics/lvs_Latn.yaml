  resursu pieejam\u012bba \u2013 nodro\u0161ina interneta resursu pieejam\u012bba
  da\u017e\u0101da vecuma soci\u0101lo grupu person\u0101m.\\n\\n3. Jaunatnes iniciat\u012bvu
  centra uzdevumi\\n\\n3.1. Centra uzdevumi ir:\\n\\n3.1.1. Organiz\u0113t neform\u0101l\u0101s
  izgl\u012bt\u012bbas semin\u0101rus un apm\u0101c\u012bbas;\\n3.1.2. Veidot sadarb\u012bbu
  ar cit\u0101m jaunie\u0161u organiz\u0101cij\u0101m, nevalstiskaj\u0101m organiz\u0101cij\u0101m
  un \u0101rvalstu nevalstiskaj\u0101m jaunie\u0161u organiz\u0101cij\u0101m;\\n3.1.3.
  Iesp\u0113ju nodro\u0161in\u0101\u0161ana jaunie\u0161u intelektu\u0101lajai att\u012bst\u012bbai,
  intere\u0161u, sp\u0113ju un talantu izkop\u0161anai, pa\u0161izgl\u012bt\u012bbai
  un rado\u0161am darbam, lietder\u012bgai br\u012bv\u0101 laika un atp\u016btas organiz\u0113\u0161anai;\\n3.1.4.
  Izveidot br\u012bv\u0101 laika satur\u012bgas pavad\u012b\u0161anas vietu jaunie\u0161iem
  att\u012bst\u012bbu sekm\u0113jo\u0161u pas\u0101kumu \u012bsteno\u0161anai;\\n3.1.5.
  Nodro\u0161in\u0101t jaunie\u0161us ar pa\u0161iniciat\u012bvas att\u012bst\u012b\u0161anai
  un \u012bsteno\u0161anai nepiecie\u0161amajiem materi\u0101ltehniskajiem l\u012bdzek\u013ciem;\\n3.1.6.
  Rad\u012bt maksim\u0101li labv\u0113l\u012bgus apst\u0101k\u013cus katra soci\u0101l\u0101s
  grupas att\u012bst\u012bbai, iev\u0113rojot vi\u0146u individu\u0101l\u0101s sp\u0113jas,
  intereses, k\u0101 ar\u012b vecuma \u012bpatn\u012bbas;\\n3.1.7. Rad\u012bt apst\u0101k\u013cus
  nacion\u0101l\u0101s pa\u0161apzi\u0146as att\u012bst\u012bbai, att\u012bst\u012bt
  jaunie\u0161u rado\u0161\u0101s un fizisk\u0101s sp\u0113jas, nodro\u0161in\u0101t
  sp\u0113ju izpau\u0161anu akt\u012bv\u0101 darb\u012bb\u0101;\\n3.1.8. Sekm\u0113t
  soci\u0101l\u0101s atstumt\u012bbas riskam pak\u013cauto jaunie\u0161u iek\u013cau\u0161anu
  vienaud\u017eu vid\u016b;\\n3.1.9. Piesaist\u012bt papildus finans\u0113jumu jaunie\u0161u
  projekta \u012bsteno\u0161anai;\\n3.1.10. Nodro\u0161in\u0101t demokr\u0101tisku,
  hum\u0101nu jaunie\u0161u, pedagogu, audzin\u0101t\u0101ju, B\u0101rbeles Soci\u0101l\u0101
  dienesta un vec\u0101ku sadarb\u012bbu.\\n\\n4. Centra tiesiskais statuss\\n\\n4.1.
  Centru izveido, organiz\u0113 un likvid\u0113 Vecumnieku novada Dome.\\n4.2. Centrs
  organiz\u0113 darbu, pamatojoties uz:\\n4.2.1. ANO Konvenciju par b\u0113rnu ties\u012bb\u0101m;\\n4.2.2.
  Latvijas Republikas b\u0113rnu ties\u012bbu aizsardz\u012bbas likumu;\\n4.2.3. Latvijas
  Republikas jaunatnes likumu;\\n4.2.4. Jaunie\u0161u centra \u201eActive\\\" nolikumu;\\n4.2.5.
  Citiem Latvijas Republikas likumdo\u0161anas aktiem;\\n4.2.6. Izgl\u012bt\u012bbas
  un Zin\u0101tnes Ministrijas r\u012bkojumiem un Vecumnieku novada Domes l\u0113mumiem.\\n\\n5.
  Jaunatnes iniciat\u012bvu centra darbinieki\\n\\n5.1. Centra vad\u012bt\u0101ju
  iece\u013c un atbr\u012bvo no amata Vecumnieku novada Domes izpilddirektors, saska\u0146ojot
  ar Vecumnieku novada Domes priek\u0161s\u0113d\u0113t\u0101ju.\\n5.2. Centra darbu
  vada Centra vad\u012bt\u0101js.\\n5.3. Centra vad\u012bt\u0101js atbild par Centra
  darb\u012bbu un t\u0101s rezult\u0101tiem, par Izgl\u012bt\u012bbas likuma, Visp\u0101r\u0113j\u0101s
  izgl\u012bt\u012bbas likuma un citu izgl\u012bt\u012bbas iest\u0101des darb\u012bbu
  reglament\u0113jo\u0161o normat\u012bvo aktu iev\u0113ro\u0161anu, k\u0101 ar\u012b
  par intelektu\u0101lo, finan\u0161u un materi\u0101lo l\u012bdzek\u013cu racion\u0101lu
  izmanto\u0161anu.\\n5.4. Centra vad\u012bt\u0101ju sadarbojas ar Soci\u0101lo dienestu,
  b\u0101ri\u0146tiesu, skolu, sabiedriskaj\u0101m organiz\u0101cij\u0101m, iest\u0101d\u0113m,
  uz\u0146\u0113m\u0113jiem, vec\u0101kiem un cit\u0101m soci\u0101las darb\u012bbas
  instit\u016bcij\u0101m.\\n5.5. Centra vad\u012bt\u0101js zi\u0146o pa\u0161vald\u012bbas
  instit\u016bcij\u0101m, kuru funkcij\u0101s ietilpst b\u0113rnu ties\u012bbu aizsardz\u012bbas
  jaut\u0101jumu risin\u0101\u0161ana, gad\u012bjumos, ja b\u0113rnam tiek konstat\u0113tas
  vardarb\u012bbas pielieto\u0161anas paz\u012bmes centr\u0101 vai \u0101rpus t\u0101s.\\n5.6.
  Centra vad\u012bt\u0101ja pien\u0101kumi:\\n5.6.1. rado\u0161i un atbild\u012bgi
  piedal\u012bties Centra darb\u012bbas \u012bsteno\u0161an\u0101;\\n5.6.2. veidot
  pozit\u012bvu sadarb\u012bbas vidi, iev\u0113rojot jaunie\u0161u vajadz\u012bbas,
  pieredzi, dom\u0101\u0161anas veidu un sp\u0113jas;\\n5.6.3. audzin\u0101t krietnus
  un godpr\u0101t\u012bgus cilv\u0113kus;\\n5.6.4. pilnveidot savu izgl\u012bt\u012bbu
  un profesion\u0101lo meistar\u012bbu;\\n5.6.5. iev\u0113rot profesion\u0101l\u0101s
  \u0113tikas normas;\\n5.6.6. nodro\u0161in\u0101t jaunie\u0161u iesp\u0113jas \u012bstenot
  savas ties\u012bbas Centr\u0101, iev\u0113rojot b\u0113rnu ties\u012bbas;\\n5.6.7.
  stimul\u0113t, vad\u012bt un sniegt atbalstu jaunie\u0161iem, kuriem ir gr\u016bt\u012bbas;\\n5.6.8.
  \u012bstenot Centra darb\u012bbu sadarb\u012bb\u0101 ar jaunie\u0161u \u0123imeni.\\n\\n6.
  Jaunatnes iniciat\u012bvu centra darb\u012bbas organiz\u0101cija\\n\\n6.1. Centrs,
  pamatojoties uz jaunie\u0161u interes\u0113m, sabiedr\u012bbas soci\u0101lo piepras\u012bjumu,
  patst\u0101v\u012bgi izstr\u0101d\u0101 iest\u0101des darb\u012bbas strukt\u016bru
  un darba pl\u0101nu saska\u0146ojot to ar Vecumnieku novada Domi.\\n6.2. Jaunatnes
  iniciat\u012bvu centrs k\u0101rto iek\u0161\u0113jo lietved\u012bbu (dokument\u0101cija)
  atbilsto\u0161i sp\u0113k\u0101 eso\u0161ajiem LR normat\u012bvajiem aktiem.\\n6.3.
  Jaunatnes iniciat\u012bvu centrs sav\u0101 darb\u012bb\u0101 iev\u0113ro visp\u0101r\u012bg\u0101s
  izgl\u012bt\u012bbas iest\u0101\u017eu higi\u0113nas normas un noteikumus, ko apstiprin\u0101jusi
  Labkl\u0101j\u012bbas ministrija.\\n6.4. Ugunsdro\u0161\u012bbas iev\u0113ro\u0161ana
  jaunie\u0161u dienas centr\u0101 tiek nodro\u0161in\u0101ta atbilsto\u0161i likumam
  \\\"Par ugunsdro\u0161\u012bbu\\\" un Ministra kabineta noteikumiem \\\"Ugunsdro\u0161\u012bbas
  noteikumi\\\".\\n6.5. Centra vad\u012bt\u0101js sniedz izv\u0113rstas mutiskas un
  rakstiskas atskaites par savu un Centra darb\u012bbu vienu reizi gad\u0101 Vecumnieku
  novada Domei.\\n6.6. Centra darba laiku apstiprina Vecumnieku novada Dome, saska\u0146ojot
  to ar Centra vad\u012bt\u0101ju.\\n6.7. Centra telpas dr\u012bkst izmantot tikai
  ar centra vad\u012bt\u0101ja piekri\u0161anu.\\n6.8. Centrs ir ties\u012bgs sadarboties
  ar iest\u0101d\u0113m, kapit\u0101lsabiedr\u012bb\u0101m, cit\u0101m juridisk\u0101m
  person\u0101m, k\u0101 ar\u012b ar l\u012bdz\u012bg\u0101m iest\u0101d\u0113m \u0101rvalst\u012bs
  un nevalstiskaj\u0101m organiz\u0101cij\u0101m.\\n6.9. Centrs var organiz\u0113t
  izgl\u012btojo\u0161i informat\u012bvus neform\u0101l\u0101s izgl\u012bt\u012bbas
  pas\u0101kumus atbilsto\u0161i sabiedr\u012bbas piepras\u012bjumam.\\n6.10. Darbu
  ar jaunatni novad\u0101 var dele\u0123\u0113t biedr\u012bbai \u201eJaunatne smaidam\\\"
  un cit\u0101m nevalstiskaj\u0101m organiz\u0101cij\u0101m aktivit\u0101\u0161u centr\u0101
  \u201eActive\\\", saska\u0146ojot ar Centra vad\u012bt\u0101ju.\\n\\n7. Finanses,
  materi\u0101li \u2013 tehnisk\u0101 b\u0101ze\\n\\n7.1. Centra uztur\u0113\u0161anu
  un materi\u0101li tehnisk\u0101s b\u0101zes pilnveidi un att\u012bst\u012bbu saska\u0146\u0101
  ar sp\u0113k\u0101 eso\u0161o Latvijas Republikas likumdo\u0161anu nodro\u0161ina
  Vecumnieku novada Dome;\\n7.2. Centrs nevar nodarboties ar uz\u0146\u0113m\u0113jdarb\u012bbu.\\n\\n7.3.
  Jaunatnes iniciat\u012bvu centra dibin\u0101t\u0101js nodro\u0161ina t\u0101 uztur\u0113\u0161anu
  un materi\u0101li tehnisk\u0101s\\nb\u0101zes pilnveidi un att\u012bst\u012bbu saska\u0146\u0101
  ar sp\u0113k\u0101 eso\u0161ajiem LR normat\u012bvajiem aktiem.\\n7.4. Centra finanses
  veido:\\n7.4.1 Vecumnieku novada Dome;\\n7.4.2 Ziedojumi un sponsoru l\u012bdzek\u013ci;\\n7.4.3
  Projektu piesaist\u012btie da\u017e\u0101du fondu l\u012bdzek\u013ci un invest\u012bcijas.\\n7.5.
  Centra da\u017e\u0101du pas\u0101kumu organiz\u0113\u0161anai papildus finans\u0113jumu
  var pie\u0161\u0137irt Vecumnieku novada Domei.\\n7.6. Centra materi\u0101li tehnisk\u0101
  b\u0101zi veido pamatl\u012bdzek\u013ci, materi\u0101l\u0101s v\u0113rt\u012bbas
  un invent\u0101rs.\\n7.7. Centra vad\u012bt\u0101ja darba samaksa tiek nodro\u0161in\u0101ta
  no Vecumnieku novada bud\u017eeta l\u012bdzek\u013ciem.\\n7.8. Centrs par ziedojumiem,
  kas sa\u0146emti mantas vai pakalpojumu veid\u0101 sast\u0101da pie\u0146em\u0161anas
  aktu, kur\u0101 nor\u0101da ziedoto mantu vai pakalpojumu daudzumu un kvalitat\u012bvos
  r\u0101d\u012bt\u0101jus, k\u0101 ar\u012b ziedojumu v\u0113rt\u012bbu naudas izteiksm\u0113,
  un iegr\u0101mato \u0161\u012bs v\u0113rt\u012bbas atbilsto\u0161i Vecumnieku novada
  Domes normat\u012bvo aktu pras\u012bb\u0101m.\\n7.9. Centra telpas izmantot Nolikum\u0101
  neparedz\u0113tajiem m\u0113r\u0137iem dr\u012bkst tikai ar Centra vad\u012bt\u0101ju
  un Vecumnieku novada Domes rakstisku at\u013cauju.\\n\\nJaunatnes iniciat\u012bvu
