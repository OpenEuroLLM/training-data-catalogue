  lasiet:\\n\u2022 Intervija ar biedr\u012bbas \u201cV\u0113rt\u012bbu skola\u201d
  l\u012bdzdibin\u0101t\u0101ju levu Johansson, 1. \u2013 3. lpp.\\n\u2022 Semin\u0101ri,
  pas\u0101kumi NVO nam\u0101, 4. \u2013 7. lpp.\\n\u2022 NVO aktualit\u0101tes, projektu
  konkursi, 8. \u2013 11. lpp.\\n\u2022 NVO namam jaunas telpas, NVO nama 2024. gada
  atskats, 12. lpp.\\n\\nINTERVIIJA\\n\\n2025. gada \u201cNVO nama zi\u0146as\u201d
  pirmaj\u0101 numur\u0101 uz sarunu esam aicin\u0101ju\u0161i levu Johansson \u2013
  biedr\u012bbas \u201cV\u0113rt\u012bbu skola\u201d l\u012bdzdibin\u0101t\u0101ju,
  l\u012bdzdal\u012bbas un rado\u0161\u0101s dom\u0101\u0161anas eksperti, pilsonisk\u0101s
  l\u012bdzdal\u012bbas un sadarb\u012bbas strat\u0113\u0123iju izstr\u0101d\u0101t\u0101ju
  organiz\u0101cij\u0101m un pa\u0161vald\u012bb\u0101m \u2013, lai pla\u0161\u0101k
  iepaz\u012btos ar 2024. gad\u0101 dibin\u0101t\u0101s biedr\u012bbas l\u012bdz\u0161in\u0113jo
  darb\u012bbu un n\u0101kotnes m\u0113r\u0137iem. Ar levu tiksimies ar\u012b 30.
  janv\u0101r\u012b \u2013 NVO nama tematisko pas\u0101kumu cikla \u201cPieredzes
  apmai\u0146as pas\u0101kumi NVO izaugsmei\u201d pirmaj\u0101 notikum\u0101 \u201cM\u0113r\u0137i
  un v\u012bzija: cel\u0161 uz NVO sasniegumiem\u201d.\\n\\nBiedr\u012bba \u201cV\u0113rt\u012bbu
  skola\u201d dibin\u0101ta 2024. gad\u0101. L\u016bduzu, \u012bsum\u0101 past\u0101stiet,
  k\u0101da ir biedr\u012bbas priek\u0161v\u0113sture \u2013 k\u0101 un k\u0101p\u0113c
  t\u0101 tika dibin\u0101ta?\\nJau vair\u0101k nek\u0101 20 gadus darbojos izaugsmes
  un sabiedriskaj\u0101 sektor\u0101, kas uzkr\u0101to pieredzi p\u0101rv\u0113rta
  profesion\u0101l\u0101 konsult\u0101ciju sniegu\u0161an\u0101 un m\u0101c\u012bbu
  programmu vad\u012b\u0161an\u0101. Esmu viena no uz\u0146\u0113muma MeYou.One l\u012bdzdibin\u0101t\u0101j\u0101m
  un 4 gadu ietvaros kop\u0101 ar savu partneri esam sadarboju\u0161ies ar \u0161oti
  daudziem uz\u0146\u0113mumiem, pa\u0161vald\u012bb\u0101m un biedr\u012bb\u0101m
  gan Latvij\u0101, gan \u0101rupus. Viens no m\u016bsu uz\u0146\u0113muma pamatprincipiem
  \u2013 virz\u012bt izaugsmi un att\u012bst\u012bbu caur v\u0113rt\u012bbu pieeju.
  P\u0113c idejas \u2013 \u201cJa ir ielikt sp\u0113c\u012bgi pamati, m\u0101ju celt
  daudz viegl\u0101k.\u201d V\u0113rt\u012bbas ir k\u0101 pamati ikviena cilv\u0113ka
  dz\u012bv\u0113. T\u0101pat ar\u012b organiz\u0101cijas \u2013 ir k\u0101 dz\u012bvi
  organismi, ar sav\u0101m v\u0113rt\u012bb\u0101m, pieej\u0101m un raksturu.\\n\\nDaudz\u0101m
  organiz\u0101cij\u0101m un biedr\u012bb\u0101m esam sniegu\u0161i vair\u0101kk\u0101rt\u0113ju
  atbalstu tie\u0161i p\u0101rstruktur\u0113\u0161an\u0101s posm\u0101, kad p\u0101rmainas
  rada \u0161aubas vai nav skaids pl\u0101ns, strat\u0113\u0123ija. Pateicoties m\u016bsu
  izaugsmes platformas MeYou.One programm\u0101m, iepaz\u012bn\u0101m ar\u012b daudzas
  person\u012bbas \u2013 vad\u012bt\u0101jus, skolot\u0101jus, vec\u0101kus, jaunie\u0161us,
  kam v\u0113l\u0113j\u0101mies sniegt person\u012bgu atbalstu, dot impulsu p\u0101rmain\u0101m.\\n\\nBiedr\u012bbas
  \u201cV\u0113rt\u012bbu skola\u201d l\u012bdzdibin\u0101t\u0101ja leva Johansson\\n\\nKop\u0101
  ar citiem domubiedriem \u2013 v\u0113rt\u012bgiem Latvijas cilv\u0113kiem, speci\u0123iem
  ekspertiem sav\u0101s jom\u0101s \u2013 apzin\u0101j\u0101mies, ka bie\u017ei sabiedr\u012bbai
  pietr\u016bkst sarunas, v\u0113rt\u012bgas komunik\u0101cijas, savstarp\u0113j\u0101s
  sazin\u0101\u0161an\u0101s un atbalsta. Ja pietr\u016bkst \u0161o ak\u016bti nepiecie\u0161amo
  cilv\u0113c\u012bbas principu ikdien\u0101, cilv\u0113ki nesaskata iesp\u0113jas,
  nav p\u0101rliecin\u0101ti par savu v\u0113rt\u012bbu un neizv\u0113las sev svar\u012bgo,
  bet seko citu nor\u0101d\u0113m, izv\u0113l\u0113m. Tas apst\u0101dina izaugsmi
  un rado\u0161umu.\\n\\nT\u0101p\u0113c tika dibin\u0101ta biedr\u012bba, lai sniegtu
  sabiedr\u012bbai, \u012bpa\u0161i tiem, kas v\u0113las, p\u0101rmai\u0146as.\\n\\n**Biedr\u012bbas
  darb\u012bbas m\u0113r\u0137is ir veicin\u0101t v\u0113rt\u012bb\u0101s balst\u012btas
  sabiedr\u012bbas att\u012bst\u012bbu. Sakiet, l\u016bdzu, k\u0101das ir j\u016bsu
  organiz\u0101cijas centr\u0101l\u0101s v\u0113rt\u012bbas?**\\n\\nM\u0113s, biedr\u012bbas
  dibin\u0101t\u0101ji, esam nel\u012bela kopiena, kam svar\u012bga izv\u0113les br\u012bv\u012bba,
  izaugsm\u0113 un rado\u0161ums. M\u0113s pa\u0161i esam izzin\u0101ju\u0161i sevi,
  regul\u0101ri r\u016bp\u0113jamies par savu v\u0113rt\u012bbu \u012bsteno\u0161anos,
  t\u0101p\u0113c ar\u012b varam sniegt atbalstu cit\u0101m organiz\u0101cij\u0101m.\\n\\n**K\u0101das
  ir biedr\u012bbas galven\u0101s darb\u012bbas jomas? K\u0101di ir tie darbi, ar
  ko ikdien\u0101 nodarbojaties?**\\n\\nBiedr\u012bbas biedri katrs esam cie\u0161i
  saist\u012bti ar izaugsmi un profesion\u0101lo pilnveido\u0161anos. Katrs esam savos
  pamatdarbos citos uz\u0146\u0113mumos un ar\u012b regul\u0101ri sniedzam pakalpojumus
  k\u0101 eksperti pa\u0161vald\u012bb\u0101m, pa\u0161vald\u012bbas iest\u0101d\u0113m
  un ar\u012b da\u017eadiem priv\u0101tajiem uz\u0146\u0113m\u0113jiem.\\n\\n**K\u0101di
  ir aktu\u0101lie biedr\u012bbas projekti?**\\n\\nBiedr\u012bba ir jauna strukt\u016bra,
  neesam v\u0113l izstr\u0101d\u0101ju\u0161i projektus finans\u0113juma san\u0113m\u0113\u0161anai.
  Ta\u010du jau ar 2024. gada septembr\u012b \u012bstenojam projektu \u201cK\u0101da
  j\u0113ga\u2026?\u201d. Projekt\u0101 v\u0113lamies apmekl\u0113t vismaz 100 skolas
  Latvij\u0101 un tikties ar jaunie\u0161iem un vi\u0146u pedagogiem, izzin\u0101t
  v\u0113rt\u012bbas un \u013caut vienam otr\u0101 saredz\u0113t resursus izaugsmei
  un n\u0101kotnes izgl\u012bt\u012bbas uzlabo\u0161anai.\\n\\n**K\u0101da un cik
  liela ir biedr\u012bbas komanda \u2013 darbinieki, br\u012bvpr\u0101t\u012bgie,
  atbalst\u012bt\u0101ji?**\\n\\nOfici\u0101li esam 2 dibin\u0101t\u0101ji un apm\u0113ram
  10 domubiedri, pagaid\u0101m m\u016bsu atbalst\u012bt\u0101ju loku gr\u016bti izm\u0113r\u012bt,
  jo to vair\u0101k defin\u0113jam k\u0101 l\u012bdzdom\u0101t\u0101jus, nevis finans\u0113t\u0101jus.
  Ikreiz, kad apmekl\u0113jam k\u0101du biedr\u012bbu vai skolu, san\u0113mam atgriezenisko
  saiti par to, cik svar\u012bgi par v\u0113rt\u012bb\u0101m run\u0101t, turpin\u0101t
  \u0161\u0101di str\u0101d\u0101t ar cilv\u0113kiem. Tas dod p\u0101rliec\u012bbu,
  ka katra m\u016bsu tik\u0161an\u0101s, saruna, rada impulsu pa\u0161izzin\u0101jai
  un savstarp\u0113j\u0101m lab\u0101m attiec\u012bb\u0101m, izaugsmei.\\n\\n**K\u0101
  biedr\u012bba \u201cV\u0113rt\u012bbu skola\u201d sadarbojas ar cit\u0101m organiz\u0101cij\u0101m,
  pa\u0161vald\u012bb\u0101m vai uz\u0146\u0113mumiem? Vai J\u016bs redzat potenci\u0101lu
  papla\u0161in\u0101t \u0161o sadarb\u012bbu, un k\u0101das iesp\u0113jas tas var\u0113tu
  atv\u0113rt?**\\n\\nPateicoties katra biedra profesion\u0101lajai pieredzei, ir
  sp\u0113c\u012bgs kontaktu un sadarb\u012bbas partneru loks, kas \u0161obr\u012bd
  ir vair\u0101k potenci\u0101ls lauks, kur \u201cs\u0113t zelta graudus\u201d, lai
  rad\u012btu p\u0101rmainas sabiedr\u012bb\u0101. Un interesanti, ka bie\u017ei cilv\u0113ki
  v\u0113las pavisam vienk\u0101r\u0161as un \u013coti cilv\u0113c\u012bgas p\u0101rmainas
  \u2013 labas attiec\u012bbas, vair\u0101k sadarb\u012bbas, pla\u0161\u0101ku resursu
  koplieto\u0161anu un savstarp\u0113ju atbalstu ideju \u012bsteno\u0161an\u0101.\\n\\nPrie\u010d\u0101jamies,
  ka akt\u012bvi iesaist\u0101ties NVO nama r\u012bkotajos semin\u0101ros un t\u012bklo\u0161an\u0101s
  pas\u0101kumos. Dom\u0101jot par 30. janv\u0101ra tik\u0161anos, vai varat ieskic\u0113t,
  k\u0101da ir biedr\u012bbu strat\u0113\u0123iju izstr\u0101des noz\u012bme un k\u0101p\u0113c
  t\u0101 ir b\u016btiska?\\n\\nJa cilv\u0113ks (un biedr\u012bba) nezina, kas vi\u0146am
  ir svar\u012bgi, gr\u016bti izv\u0113l\u0113ties un doties uz k\u0101du virzienu.
  Biedr\u012bbu strat\u0113\u0123ija paties\u012bb\u0101 ir \u2013 p\u0101rliec\u012bba
  par to, kas m\u0113s esam, k\u0101p\u0113c dar\u0101m to, ko dar\u0101m un kur v\u0113lamies
  kop\u0101 doties. Kad zin\u0101ms, kur ar sav\u0101m v\u0113rt\u012bb\u0101m, iek\u0161\u0113jiem
  resursiem v\u0113lamies doties, tad ar\u012b viegli n\u0101k risin\u0101jumi, idejas,
  jeb soli strat\u0113\u0123ijas v\u012bzijas sasnieg\u0161anai.\\n\\nNosl\u0113gum\u0101
  \u2013 s\u0101cot 2025. gadu, k\u0101ds b\u016btu j\u016bsu v\u0113l\u0113jums citiem
  NVO p\u0101rst\u0101vjiem? Aicinu katram cilv\u0113kam izzin\u0101t 3 lietas un
  dar\u012bt 3 lietas. Izzini sevi k\u0101 person\u012bbu, izzini savus tuv\u0101kos,
  kas vi\u0146iem svar\u012bgi un aktu\u0101li, izzini, k\u0101 vislab\u0101k sazin\u0101ties
  un sadarboties. Tas pal\u012bdz\u0113s dar\u012bt! Dari vismaz da\u017eus solus
  savu v\u0113rt\u012bbu lab\u0101 un mekl\u0113 taj\u0101 rad\u012b\u0161anas prieku,
  sniedz atbalstu citiem, vi\u0146u b\u016btiskaj\u0101m liet\u0101m, un tre\u0161\u0101
  darb\u012bba \u2013 esi jaiks!\\n\\nPaldies par sarunu! Uz tik\u0161anos 30. janv\u0101r\u012b!\\n\\nNodarb\u012bba
  sabiedrisko organiz\u0101ciju p\u0101rst\u0101vjiem par pilsonisko l\u012bdzdal\u012bbu,
  2022\\n\\nGAID\u0100MIE SEMIN\u0100RI\\n\\n22. JANV\u0100R\u012a\\nplkst. 14.00
