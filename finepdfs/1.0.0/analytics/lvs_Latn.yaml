  nor\u0101d\u012btaj\u0101m sait\u0113m:\\n\\n1. Manas ties\u012bbas k\u0101 noziedz\u012bg\u0101
  nodar\u012bjum\u0101 cietu\u0161ai personai\\n2. Zi\u0146o\u0161ana par noziegumu
