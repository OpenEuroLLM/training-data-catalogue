  \u2013 jaunatne vienotai Eiropai, Latvijas Pilsonisk\u0101 alianse u.c.\\n\\nVair\u0101k
  inform\u0101cijas un pieteik\u0161an\u0101s: https://ej.uz/sawm\\n\\nDecembri NVO
