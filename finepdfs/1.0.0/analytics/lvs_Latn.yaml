  |\\n\\n**Anal\u012bze un nov\u0113rt\u0113jums par stud\u0113jo\u0161o nosl\u0113guma
  darbu t\u0113m\u0101m**\\n\\nSadarb\u012bb\u0101 ar ekspertiem nozar\u0113 tiek
  izstr\u0101d\u0101ti liet\u012b\u0161\u0137o p\u0113t\u012bjumu virzieni, kas saskanoti
  studiju peogarmmas \u201c\u0100rstniec\u012bba\u201d padomes s\u0113d\u0113 un apstiprin\u0101ti
  RSU SKMK Zin\u0101tnisk\u0101 padom\u0113. Stud\u0113jo\u0161o nosl\u0113guma darbu
  t\u0113mas ir aktu\u0101las nozar\u0113 un darba tirg\u016b, jo tiek izv\u0113l\u0113tas
  balstoties uz jaun\u0101kajiem zin\u0101tniskajiem p\u0113t\u012bjumiem un aktualit\u0101t\u0113m
  ar ko student saskaras ikdien\u0101 prakses laik\u0101. Izv\u0113l\u0113to t\u0113mu
  kl\u0101sts bija \u013coti pla\u0161s un da\u017e\u0101ds. Tika nov\u0113rotas tendences
  p\u0113t\u012bt ar Covid 19 saist\u012bt\u0101s t\u0113mas, kas, protams, ir saist\u0101mas
  ar glob\u0101lo pand\u0113miju un ikdienas mai\u0146u medic\u012bnas person\u0101lam.
  Kopum\u0101 2021/2022 programm\u0101 tika izstr\u0101d\u0101tas 40 kvalifik\u0101cijas
  darbu t\u0113mas, kas tika veiksm\u012bgi noprezent\u0113tas komisijai. Kop\u0113jais
  vid\u0113jais v\u0113rt\u0113jums bija 8 balles, kas kopum\u0101 v\u0113rt\u0113jams
  k\u0101 labs rezult\u0101ts. Visvair\u0101k komisija nov\u0113rt\u0113ja darbu t\u0113mas
  ar sekojo\u0161iem nosaukumiem:\\n\\n- Pacientu ar hipotermiju \u0101rst\u0113\u0161anas
  rezult\u0101tu ietekm\u0113jo\u0161o faktoru anal\u012bze;\\n\\n\u2022 Pl\u0101notu
  \u0101rpus stacion\u0101ra dzemd\u012bbu sal\u012bdzin\u0101jums ar pl\u0101not\u0101m
  dzemd\u012bb\u0101m stacion\u0101r\u0101 \u2014ieguvumi, riski un prakse Latvij\u0101;\\n\u2022
  Latvijas iedz\u012bvot\u0101ju inform\u0113t\u012bba par balto spieki un t\u0101
  noz\u012bmi.\\n\\n\u0160ie darbi izpeln\u012bju\u0161ies augst\u0101ko kop\u0113jo
  nov\u0113rt\u0113jumu 10 balles.\\n\\nPopul\u0101r\u0101kie virzieni, kuros studenti
  izv\u0113l\u0113j\u0101s rakt\u016bt kvalifik\u0101cijas darbus bija: Pediatrija,
  ginekolo\u0123ija, traumatolo\u0123ija, neatliekama medic\u012bnisk\u0101 pal\u012bdz\u012bba,
  ar Covid 19 saist\u012bt\u0101s t\u0113mas, iedz\u012bvot\u0101ju inform\u0113t\u012bba
  un paradumi da\u017e\u0101du vesel\u012bbas trauc\u0113jumu aspekt\u0101, k\u0101
  ar\u012b kol\u0113gu r\u012bc\u012bbas algoritmi.\\n\\nPar aktu\u0101l\u0101m studenti
  atzina ar\u012b t\u0113mas, kas bija saist\u012btas ar att\u0101linato m\u0101c\u012bbu
  ietekmi uz b\u0113rnu vesel\u012bbu.\\n\\nKopum\u0101 v\u0113rt\u0113jot kvalifik\u0101cijas
  darbu izstr\u0101des procesu \u2014 tika sasniegti augsti rezult\u0101ti, jo vid\u0113jais
  v\u0113rt\u0113jums ir 8 balles. Gad\u012bjumos, kad v\u0113rt\u0113jums bija zem\u0101ks
  \u2014 galven\u0101s kl\u016bdas bija student komunik\u0101cij\u0101 ar darba vad\u012bt\u0101ju,
  k\u0101 ar\u012b metodisko nor\u0101d\u012bjumu kvalifik\u0101cijas darbu izstr\u0101de
  neiev\u0113ro\u0161ana. Lielu da\u013cu darbu var izmantot ar\u012b praktiskaj\u0101
  darb\u0101 medic\u012bn\u0101, k\u0101 ar\u012b t\u0101l\u0101k turpin\u0101t p\u0113t\u012bt
  paaugstinot savu kvalifik\u0101ciju.\\n\\n**Studentu aptaujas rezult\u0101ti**\\n\\nStudiju
  programmas \u201c\u0100rstniec\u012bba\u201d ar kvalifik\u0101ciju \u0101rsta pal\u012bgs
  1. kursa stud\u0113jo\u0161ie kopum\u0101 studiju kvalit\u0101ti v\u0113rt\u0113
  pozit\u012bvi. Gandr\u012bz 60 % ir nor\u0101d\u012bju\u0161i v\u0113rt\u0113jumu
  *labi* un nedaudz vair\u0101k k\u0101 35% nor\u0101d\u012bju\u0161i v\u0113rt\u0113jumu
  *teicami*.\\n\\n| Teicami | 11 | 35.5% |\\n|---------|----|-------|\\n| Labi    |
  18 | 58.1% |\\n| Gandr\u012bz labi | 1 | 3.2% |\\n| Viduv\u0113ji | 1 | 3.2% |\\n|
  V\u0101ji    | 0  | 0%    |\\n| Iesniegto atbil\u017eu summa | 31 |\\n\\nSavuk\u0101rt
  2. studiju un 3. studiju gada stud\u0113jo\u0161ie nav biju\u0161i tik atsauc\u012bgi
  aptaujas aizpild\u012b\u0161an\u0101, ta\u010du nesaktoties uz to v\u0113rojama
  pozit\u012bva tendence un stud\u0113jo\u0161ie kopum\u0101 ir apmierin\u0101ti ar
  studiju procesa kvalit\u0101ti.\\n\\n11.att\u0113ls 2.studiju gada stud\u0113jo\u0161ie
  (n=10, 25% no kop\u0113j\u0101 stud\u0113jo\u0161o skaita)\\n\\n2021./2022. Studiju
  gad\u0101 tika veikta ar\u012b absolventu aptauja, kuras ietvaros absolventiem tika
  uzdots jaut\u0101jums \u201cVai studiju process pietiekami sagatavojis profesion\u0101lai
  darb\u012bbai?\u201d un liel\u0101k\u0101 da\u013ca no respondietiem (63%) nov\u0113rt\u0113ja
  ar labi (skat\u012bt 13. att\u0113lu).\\n\\n13. att\u0113ls 2021./2022. Absolventu
  v\u0113rt\u0113jums par izredz\u0113m darba tirg\u016b (n=35)\\n\\nAbsolventiem
  tika uzdoti vair\u0101ki studiju procesu raksturojo\u0161ie faktori, lai identific\u0113tu
  galvenos studiju procesu ietekm\u0113jo\u0161os fakturus. Reult\u0101ti rezamdi
  14. att\u0113l\u0101.\\n\\n14.att\u0113ls \u201cAbsolventu v\u0113rt\u0113jums par
  studiju procesa kvalit\u0101ti ietekm\u0113jos\u0113ji fakoriem\u201d\\n\\n15. Studiju
  programma \u201c\u0100rstniec\u012bba\u201d, kvalifik\u0101cija neatliekam\u0101s
  medic\u012bnas \u0101rsta pal\u012bgs\\n\\n**Studiju programmas raksturojo\u0161ie
  parametri**\\n\\n| Studiju programmas nosaukums | \u0100rstniec\u012bba ar kvalifik\u0101ciju
  neatliekam\u0101s medic\u012bnas \u0101rsta pal\u012bgs |\\n|-----------------------------|---------------------------------------------------------------|\\n|
  Studiju programmas kods saska\u0146\u0101 ar Latvijas izgl\u012bt\u012bbas klasifik\u0101ciju
  | 41 721                                                        |\\n| Studiju programmas
  veids un l\u012bmenis | 1. l\u012bme\u0146a profesion\u0101l\u0101 augst\u0101ka
  izgl\u012bt\u012bba                     |\\n| Ieg\u016bstamais kvalifik\u0101cijas
  l\u012bmenis (EKI) | 4                                                             |\\n|
  Profesijas kods profesiju klasifikator\u0101 | Neatliekam\u0101s medic\u012bnas
  \u0101rsta pal\u012bga (feld\u0161era) Profesijas kods \u2013 2240 01 (ceturta l\u012bme\u0146a
  kvalifik\u0101cija). |\\n| Studiju programmas apjoms (KP) | Studiju programmas apjoms
  80 KP/ 120 ECTS;                     |\\n| \u012asteno\u0161anas forma, veids, ilgums
  | pilna laika kl\u0101tien\u0113, 2 gadi                                   |\\n|
  \u012asteno\u0161anas vieta | R\u012bga, J. Asara iela 5                                         |\\n|
  Studiju programmas direktors/-e | Viktors Gorovenko                                              |\\n|
  Uz\u0146em\u0161anas pras\u012bbas | Nepiecie\u0161am\u0101 iepriek\u0161\u0113j\u0101
  izgl\u012bt\u012bba: \u0100rstniec\u012bbas persona ar profesion\u0101lo vid\u0113jo
  vai pirm\u0101 l\u012bme\u0146a profesion\u0101lo augst\u0101ko \u0101rsta pal\u012bga
  (feld\u0161era) izgl\u012bt\u012bbu |\\n\\n**Veikt\u0101s izmai\u0146as studiju
  programmas satur\u0101**\\n\\nStudiju programmas \u201e\u0100rstniec\u012bba\u201d
  ar kvalifik\u0101ciju Neatliekam\u0101s medic\u012bnas \u0101rsta pal\u012bgs m\u0113r\u0137is
  izriet no Latvijas kvalifik\u0101ciju ietvarstrukt\u016bra (LKI) (EKI) 5.l\u012bme\u0146a,
  kur ir formul\u0113tas zin\u0101\u0161anas prasmes un kompetences atbilsto\u0161i
  5. l\u012bmenim LKI, kas atbilst 1. profesion\u0101lajam augst\u0101kajam izgl\u012bt\u012bbas
  l\u012bmenim. \u0160\u012bs kompetences tiek\u0146emtas v\u0113r\u0101 izveidojot
  profesiju standartu, kuru kompeteces tiek sasaist\u012btas ar LKI kompetenc\u0113m.
  Pamatojoties uz profesiju standartu, tiek izstr\u0101d\u0101ta studiju programma,
  nosakot programmas m\u0113r\u0137i, uzdevumus un sasniedzamos rezult\u0101tus.\\n\\nStudiju
  programmas pamatsast\u0101vdalas 2021./2022. akad\u0113miskaj\u0101 gad\u0101\\n\\n|
  Visp\u0101rizgl\u012btojo\u0161ie studiju kursi 20 KP |\\n|--------------------------------------|\\n|
  Nozares studiju kursi 32 KP         |\\n\\n2021./2022. studiju gad\u0101, sal\u012bdzinot
  ar iepriek\u0161\u0113jo studiju gadu tika veiktas nelielas izmai\u0146as studiju
  \u012bsteno\u0161anas pl\u0101n\u0101. Studiju kurss \u201cVad\u012bbas pamati un
  komandas darbs\u201d no 0,5 KP tika palielin\u0101t l\u012bdz 1 KP. Izmai\u0146as
  tika veiktas, nemot v\u0113r\u0101 darba d\u0113v\u0113j\u016b ieteikumus.\\n\\n**Studiju
  programmas m\u0101c\u012bbsp\u0113ki**\\n\\nStudiju programmas \u012bsteno\u0161an\u0101
  iesaist\u012bti 31 doc\u0113t\u0101js, no kuriem 5 ir zin\u0101tnisk\u0101 doktora
  gr\u0101ds un 2 doc\u0113t\u0101ji ir zin\u0101tnisk\u0101 gr\u0101da pretendenti,
  15 doc\u0113t\u0101jiem ir \u0101rsta gr\u0101ds. Visi doc\u0113t\u0101ji, kas ir
  iesaist\u012bti studiju programm\u0101s \u012bsteno\u0161an\u0101 k\u0101 lektori
  vai vieslektori ir ar vismaz ma\u0123istra gr\u0101du vai ma\u0123istra gr\u0101dam
  piel\u012bdzin\u0101ma izgl\u012bt\u012bba saist\u012bta zin\u0101tnu nozar\u0113.\\n\\nStudiju
  programmas \u012bsteno\u0161an\u0101 iesaist\u012bto m\u0101c\u012bbsp\u0113ku kvalifik\u0101cija
  atbilst studiju programmas \u012bsteno\u0161anas nosac\u012bjumiem un normat\u012bvo
  aktu pras\u012bb\u0101m. Visiem doc\u0113t\u0101jiem, kuri pasniedz nozares kursus
  studiju virzien\u0101 \\\"Vesel\u012bbas apr\u016bpe\\\", ir atbilsto\u0161a izgl\u012bt\u012bba
  un ar\u012b atbilsto\u0161a profesion\u0101l\u0101 pieredze. Piem\u0113ram 18 doc\u0113t\u0101jiem
  ir \u0101rsta gr\u0101ds un liel\u0101k\u0101 da\u013ca no vi\u0146iem str\u0101d\u0101
  universit\u0101tes slimn\u012bc\u0101s vai Neatliekam\u0101s medic\u012bnisk\u0101s
  pal\u012bdz\u012bbas dienest\u0101.\\n\\nVisiem doc\u0113t\u0101jiem, kuri \u012bsteno
  visp\u0101rizgl\u012btojosos studiju kursus ar\u012b ir atbilsto\u0161a izgl\u012bt\u012bba
  katram sav\u0101 specialit\u0101t\u0113 - visiem doc\u0113t\u0101jiem ir ma\u0123istra
  gr\u0101ds, trim doc\u0113t\u0101jiem ir doktora gr\u0101ds, doc\u0113t\u0101jiem
  ir liela praktisk\u0101 pieredze sav\u0101 nozar\u0113.\\n\\nNemot v\u0113r\u0101,
  ka \u0101rsta pal\u012bga profesija ir reglement\u0113ta profesija un tiek realiz\u0113ta
  atbilsto\u0161i profesion\u0101l\u0101s kvalifik\u0101cijas pras\u012bb\u0101m,
  nozares studiju kursa \u012bsteno\u0161an\u0101 tiek piesaist\u012bti sertific\u0113ti
  vesel\u012bbas apr\u016bpes jomas speci\u0101listi, veicinot v\u0113l cie\u0161\u0101ku
  studiju rezult\u0101tu sasaist\u012bt ar reglement\u0113t\u0101s profesijas jomu.\\n\\nDoc\u0113t\u0101ji
  kuri p\u0101rst\u0101v vesel\u012bbas apr\u016bpes jomu iesaist\u0101s ar studiju
  prakses vad\u012b\u0161an\u0101, k\u0101 ar\u012b iesaist\u0101s Kvalifik\u0101cijas
  darbu izstr\u0101des proces\u0101 k\u0101 vad\u012bt\u0101ji.\\n\\nRSU SKMK regul\u0101ri
  izv\u0113rt\u0113 doc\u0113t\u0101ju kompetenci un atbilst\u012bbu darbam, un nepiecie\u0161am\u012bbas
  gad\u012bjum\u0101 studiju procesa nodro\u0161in\u0101\u0161anai tiek piesaist\u012bti
  jauni doc\u0113t\u0101ji. Liel\u0101kajai da\u013cai doc\u0113t\u0101ju, taj\u0101
  skait\u0101 specializ\u0113to kursu doc\u0113t\u0101jiem, ir iev\u0113rojama praktisk\u0101
  pieredze atbilsto\u0161aj\u0101 darb\u012bbas jom\u0101, t\u0101d\u0113j\u0101di
  nodro\u0161inot studiju programm\u0101 ieg\u016bstamo specializ\u0113to zin\u0101\u0161anu,
  prasmju un kompeten\u010du atbilst\u012bbu ieg\u016bstamajai kvalifik\u0101cijai
  un izmanto\u0161anai t\u0101l\u0101kaj\u0101 profesion\u0101laj\u0101 darb\u012bb\u0101.\\n\\nDoc\u0113t\u0101jiem
  tiek nodro\u0161in\u0101ta iesp\u0113ja ar\u012b piedal\u012bties ERASMUS + pieredzes
  apmainas pas\u0101kumos, dodoties uz ERASMUS+ dal\u012bbvalst\u012bm, iepaz\u012bties
  ar citu augstskolu pieredzi, k\u0101 ar\u012b piedaloties m\u0101c\u012bbu proces\u0101,
  piem\u0113ram, lekciju las\u012b\u0161an\u0101. (Doc\u0113t\u0101ju mobilit\u0101tes
  p\u0101rskats pieejams oblig\u0101to pielikumu s\u0101d\u0101l\u0101 17.pielikum\u0101)\\n\\nStudiju
  programmas direktors ir \u0101rsts reanimatologs ar 10 gadu pieredzi. Neatliekam\u0101s
