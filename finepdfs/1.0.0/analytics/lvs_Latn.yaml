  | R\u012bgas Stradi\u0146a universit\u0101tes Farm\u0101cijas fakult\u0101t\u0113
  Latvijas Universit\u0101tes Medic\u012bnas fakult\u0101tes Farm\u0101cijas studiju
  programm\u0101 |\\n\\nStudiju programmas pamatsast\u0101vda\u013cas 2021./2022.
  akad\u0113miskaj\u0101 gad\u0101\\n\\n|                                                                 |\\n|---------------------------------------------------------------|\\n|
  Visp\u0101rizgl\u012btojo\u0161ie studiju kursi 20 KP                         |\\n|
