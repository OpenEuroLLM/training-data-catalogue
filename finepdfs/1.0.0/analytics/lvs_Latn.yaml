  studiju pl\u0101ns attiec\u012bgajam studiju gadam un studiju kursu izk\u0101rtojums\\nattiec\u012bgaj\u0101
  akad\u0113miskaj\u0101 gad\u0101. Studiju pl\u0101ns tika izveidots pirms katra
  akad\u0113misk\u0101 gada\\ns\u0101kuma, izskat\u012bts studiju programmas kvalit\u0101tes
  s\u0113d\u0113 un saska\u0146ots koled\u017eas padom\u0113.\\n\\nStudentu vajadz\u012bb\u0101m
  papildus ir nodro\u0161in\u0101ts Klinisko prasmju pa\u0161apguves kabinets\\nstudentiem.
  Tur ir pieejama ku\u0161ete, pilna \u0137ermena manekens (ERAf), injekciju roka\\n(ERAf),
