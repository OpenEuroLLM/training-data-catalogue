  Es finans\u0113jumu, uzs\u0101ksim tirgus moderniz\u0101ciju.\\\"  K\u0101p\u0113c
  esat tik p\u0101rliecin\u0101ti, ka sp\u0113siet p\u0101rtraukt C\u0113su tirgus
