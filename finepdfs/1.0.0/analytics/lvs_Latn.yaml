  kopv\u0113rt\u0113jum\u0101\\n\\nClerk of the course/ Sacens\u012bbu vad\u012bt\u0101js\\n\\nRally
  Liepaja 2015\\nJanis Krastins\"", "\"Uz s\u0101kumlapu>J\u016bsu ties\u012bbas>Noziedz\u012bgos
  nodar\u012bjumos cietu\u0161ie>Cietu\u0161o ties\u012bbas (katr\u0101 valst\u012b)\\n\\nCietu\u0161o
  ties\u012bbas (katr\u0101 valst\u012b)\\n\\nHorv\u0101tija\\n\\nHorv\u0101tija\\n\\nNoziedz\u012bgos
  nodar\u012bjumos cietu\u0161ajiem pirmstiesas proces\u0101 un krimin\u0101lproces\u0101
  ir vair\u0101kas ties\u012bbas, turkl\u0101t \u012bpa\u0161a aizsardz\u012bba tiek
  piem\u0113rota b\u0113rniem un cietu\u0161ajiem noziedz\u012bgos nodar\u012bjumos,
  kas v\u0113rsti pret seksu\u0101lo br\u012bv\u012bbu, un cilv\u0113ku tirdzniec\u012bbas
  upuriem\\n\\nNoziedz\u012bg\u0101 nodar\u012bjum\u0101 cietu\u0161ai personai ir:\\n\\nties\u012bbas
  piek\u013c\u016bt noziedz\u012bgos nodar\u012bjumos cietu\u0161o atbalsta pakalpojumiem;\\n\\nties\u012bbas
  uz efekt\u012bvu psiholo\u0123isku un cita veida profesion\u0101lu pal\u012bdz\u012bbu
  un atbalstu, ko saska\u0146\u0101 ar ties\u012bbu aktiem sniedz strukt\u016bras,
  organiz\u0101cijas un iest\u0101des, kas nodro\u0161ina atbalstu noziedz\u012bgos
  nodar\u012bjumos cietu\u0161ajiem;\\n\\nties\u012bbas uz aizsardz\u012bbu pret iebied\u0113\u0161anu
  un atrieb\u012bbu;\\n\\nties\u012bbas uz savas cie\u0146as aizsardz\u012bbu, sniedzot
  pier\u0101d\u012bjumus cietu\u0161\u0101s personas status\u0101;\\n\\nties\u012bbas
  tikt uzklaus\u012btam bez nepamatotas kav\u0113\u0161an\u0101s p\u0113c zi\u0146ojuma
  snieg\u0161anas par noziedz\u012bgu nodar\u012bjumu un p\u0113c tam vairs netikt
  nopratin\u0101tam krimin\u0101lproces\u0101 vair\u0101k nek\u0101 absol\u016bti
  nepiecie\u0161ams;\\n\\nties\u012bbas jebk\u0101d\u0101s darb\u012bb\u0101s b\u016bt
  uztic\u012bbas personas pavad\u012bb\u0101;\\n\\nties\u012bbas tikt pak\u013cautam
  minim\u0101l\u0101m medic\u012bnisk\u0101m proced\u016br\u0101m un tikai gad\u012bjumos,
  kad t\u0101s ir absol\u016bti nepiecie\u0161amas krimin\u0101lprocesam;\\n\\nties\u012bbas
  iesniegt pras\u012bbu par sauk\u0161anu pie krimin\u0101latbild\u012bbas vai priv\u0101tas
  aps\u016bdz\u012bbas cel\u0161anu saska\u0146\u0101 ar Krimin\u0101lkodeksu ( ),
  ties\u012bbas Kazneni zakon piedal\u012bties krimin\u0101lproces\u0101 k\u0101 cietu\u0161ajai
  pusei, ties\u012bbas sa\u0146emt inform\u0101ciju par krimin\u0101laps\u016bdz\u012bbas
  atcel\u0161anu (Krimin\u0101lkodeksa 206. panta 3. punkts) un par prokurora ( )
  l\u0113mumu ner\u012bkoties, k\u0101 ar\u012b ties\u012bbas virz\u012bt krimin\u0101lvaj\u0101\u0161anu
  individu\u0101li bez prokurora; dr\u017eavni odvjetnik ties\u012bbas no prokurora
  sa\u0146emt inform\u0101ciju par pas\u0101kumiem, kas veikti saska\u0146\u0101 ar
  cietu\u0161\u0101s personas izvirz\u012bto aps\u016bdz\u012bbu (Krimin\u0101lkodeksa
  206a. pants) un iesniegt s\u016bdz\u012bbu vec\u0101kajam prokuroram ( ) (Krimin\u0101lkodeksa
  206b. pants); vi\u0161i dr\u017eavni odvjetnik\\n\\nties\u012bbas piepras\u012bt
  un bez nepamatotas kav\u0113\u0161an\u0101s sa\u0146emt inform\u0101ciju par noziedz\u012bg\u0101
  nodar\u012bjuma izdar\u012bt\u0101ja aiztur\u0113\u0161anas vai apcietin\u0101\u0161anas
  izbeig\u0161anu, nodar\u012bjuma izdar\u012bt\u0101ja izb\u0113g\u0161anu vai atbr\u012bvo\u0161anu
  no ieslodz\u012bjuma vietas, k\u0101 ar\u012b par pas\u0101kumiem kas veikti, lai
  nodro\u0161in\u0101tu cietu\u0161\u0101 aizsardz\u012bbu;\\n\\nties\u012bbas piepras\u012bt
  un sa\u0146emt inform\u0101ciju par jebk\u0101diem gal\u012bgiem l\u0113mumiem,
  ar ko izbeidz krimin\u0101lprocesu;\\n\\ncitas ties\u012bbu aktos noteiktas ties\u012bbas.\\n\\nTurkl\u0101t
  cietu\u0161\u0101m person\u0101m un upuriem ir ties\u012bbas: seksu\u0101la rakstura
  noziedz\u012bgos nodar\u012bjumos cilv\u0113ku tirdzniec\u012bbas\\n\\npirms nopratin\u0101\u0161anas
  sa\u0146emt no valsts bud\u017eeta finans\u0113tas speci\u0101lista konsult\u0101cijas;\\n\\nizmantot
  no valsts bud\u017eeta finans\u0113tus p\u0101rst\u0101vja pakalpojumus;\\n\\npiepras\u012bt,
  lai nopratin\u0101\u0161anu policijas iecirkn\u012b vai prokurat\u016br\u0101 (
  ) veic t\u0101da pa\u0161a dzimuma persona, un, ja nopratin\u0101\u0161anu veic
  atk\u0101rtoti, lai dr\u017eavno odvjetni\u0161tvo nopratin\u0101t\u0101js b\u016btu
  t\u0101 pati persona;\\n\\natteikties atbild\u0113t uz jaut\u0101jumiem, kas ir
  tie\u0161i saist\u012bti ar personas person\u012bgo dz\u012bvi un nav saist\u012bti
  ar noziedz\u012bgo nodar\u012bjumu;\\n\\npiepras\u012bt, lai nopratin\u0101\u0161ana
  tiktu veikta, izmantojot audiovizu\u0101lus pal\u012bgl\u012bdzek\u013cus (Krimin\u0101lkodeksa
  292. panta 4. punkts);\\n\\nuz personas datu aizsardz\u012bbu;\\n\\npiepras\u012bt
  lietas izskat\u012b\u0161anu bez sabiedr\u012bbas l\u012bdzdal\u012bbas.\\n\\nJa
  ir b\u0113rns, papildus iepriek\u0161 min\u0113taj\u0101m ties\u012bb\u0101m vi\u0146am
  ir ties\u012bbas: noziedz\u012bg\u0101 nodar\u012bjum\u0101 cietu\u0161ais\\n\\nizmantot
  no valsts bud\u017eeta finans\u0113tus p\u0101rst\u0101vja pakalpojumus;\\n\\nuz
  personas datu aizsardz\u012bbu;\\n\\nuz lietas izskat\u012b\u0161anu bez sabiedr\u012bbas
  l\u012bdzdal\u012bbas.\\n\\nB\u0113rns ir jebkura persona, kura ir jaun\u0101ka
  par 18 gadiem.\\n\\nJa liecinieks vai cietu\u0161ais ir b\u0113rns, izmekl\u0113\u0161anas
  tiesnesis to iztauj\u0101 liecinieku uzklaus\u012b\u0161anas s\u0113d\u0113 un pav\u0113sti
  nos\u016bta b\u0113rna vec\u0101kiem vai aizbild\u0146iem.\\n\\nPriv\u0101ta aps\u016bdz\u012bba\\n\\nKad
  tiek zi\u0146ots par noziedz\u012bgu nodar\u012bjumu, vair\u0101kum\u0101 gad\u012bjumu
  prokurors ierosina lietu p\u0113c savas ierosmes.\\n\\nPriv\u0101tu aps\u016bdz\u012bbu
  var celt par noziedz\u012bgiem nodar\u012bjumiem, uz kuriem attiecas krimin\u0101lprocesa
  uzs\u0101k\u0161ana priv\u0101tas aps\u016bdz\u012bbas ce\u013c\u0101. Priv\u0101ta
  aps\u016bdz\u012bba j\u0101ce\u013c tr\u012bs m\u0113ne\u0161u laik\u0101 no dienas,
  kad pilnvarot\u0101 fizisk\u0101 vai juridisk\u0101 persona uzzin\u0101jusi par
  noziedz\u012bgu nodar\u012bjumu un t\u0101 izdar\u012bt\u0101ju.\\n\\nBlakuspras\u012bba
  par zaud\u0113jumu atl\u012bdz\u012bbu\\n\\nCietus\u012b puse var iesniegt pieteikumu
  par civilpras\u012bbas pievieno\u0161anu krimin\u0101lprocesam.\\n\\nNoziedz\u012bg\u0101
  nodar\u012bjum\u0101 cietu\u0161ais ir ar\u012b cietus\u012b puse, un tai ir ties\u012bbas
  ties\u0101 iesniegt blakuspras\u012bbu par zaud\u0113jumu atl\u012bdz\u012bbu.\\n\\nBlakuspras\u012bba
  var ietvert \u0161\u0101dus pras\u012bjumus:\\n\\npie\u0161\u0137irt kompens\u0101ciju
  par zaud\u0113jumiem, kas var b\u016bt gan materi\u0101li, gan nemateri\u0101li
  (p\u0101rciest\u0101s s\u0101pes, bailes);\\n\\natdot person\u012bg\u0101s mantas,
  ja cietus\u012b puse var pier\u0101d\u012bt, ka vi\u0146a ir bijusi to \u012bpa\u0161nieks
  vai likum\u012bgais tur\u0113t\u0101js;\\n\\nanul\u0113t konkr\u0113tu dar\u012bjumu,
  ja noziedz\u012bga nodar\u012bjuma rezult\u0101t\u0101 noticis dar\u012bjums ar
  \u012bpa\u0161umu (ja atbild\u0113t\u0101js piespiedis cietu\u0161o nosl\u0113gt
  l\u012bgumu).\\n\\nBlakuspras\u012bbu par zaud\u0113jumu atl\u012bdz\u012bbu var
  iesniegt krimin\u0101lprocesa laik\u0101 vai k\u0101 atsevi\u0161\u0137u civilpras\u012bbu
  pret atbild\u0113t\u0101ju. Ja \u0161\u0101da pras\u012bba tiek iesniegta krimin\u0101lprocesa
  laik\u0101, lai to pie\u0146emtu, tiesai aps\u016bdz\u0113tais vispirms j\u0101atz\u012bst
  par vain\u012bgu.\\n\\nTas nav priek\u0161noteikums, lai pras\u012bbu sekm\u012bgi
  izskat\u012btu civilproces\u0101.\\n\\nCietu\u0161o personu ties\u012bbas izmekl\u0113\u0161anas
  laik\u0101 un krimin\u0101lproces\u0101\\n\\nCietu\u0161ajam, kur\u0161 piedal\u0101s
  krimin\u0101lproces\u0101 k\u0101 cietus\u012b puse, ir \u0161\u0101das ties\u012bbas:\\n\\nsazin\u0101ties
  sav\u0101 valod\u0101, ar\u012b nedzird\u012bgo un nedzird\u012bgu neredz\u012bgo
  z\u012bmju valod\u0101, un sa\u0146emt tulka pal\u012bdz\u012bbu, ja cietu\u0161ais
  nesaprot horv\u0101tu valodu vai nerun\u0101 taj\u0101, vai tulkot\u0101ja vai surdotulka
  pal\u012bdz\u012bbu, ja cietu\u0161ais ir nedzird\u012bgs vai nedzird\u012bgs neredz\u012bgais;\\n\\niesniegt
  blakuspras\u012bbu par zaud\u0113jumu atl\u012bdz\u012bbu un priek\u0161likumus
  par pagaidu noregul\u0113jumu;\\n\\ntikt p\u0101rst\u0101v\u0113tam;\\n\\nsniegt
  faktus un pier\u0101d\u012bjumus;\\n\\napmekl\u0113t liecinieku uzklaus\u012b\u0161anu;\\n\\nLV\\n\\nLV\\n\\napmekl\u0113t
  tiesas s\u0113di, piedal\u012bties liecinieku uzklaus\u012b\u0161an\u0101 un sniegt
  nosl\u0113guma pazi\u0146ojumu;\\n\\npiek\u013c\u016bt lietas materi\u0101liem;\\n\\npiepras\u012bt
  inform\u0101ciju no prokurora par darb\u012bb\u0101m, kas veiktas, pamatojoties
  uz vi\u0146a zi\u0146ojumu, un iesniegt s\u016bdz\u012bbu vec\u0101kajam prokuroram;\\n\\niesniegt
  apel\u0101cijas pras\u012bbu;\\n\\npiepras\u012bt iepriek\u0161\u0113jas situ\u0101cijas
  atjauno\u0161anu;\\n\\nsa\u0146emt pazi\u0146ojumu par krimin\u0101lprocesa rezult\u0101tu.\\n\\nProkurat\u016brai
  un tiesai ir pien\u0101kums gan pirms krimin\u0101lprocesa, gan katr\u0101 t\u0101
  posm\u0101 izv\u0113rt\u0113t, vai ir jebk\u0101da iesp\u0113ja aps\u016bdz\u0113tajam
  atl\u012bdzin\u0101t cietu\u0161ajai pusei noziedz\u012bg\u0101 nodar\u012bjuma
  rad\u012btos zaud\u0113jumus. Prokurat\u016brai un tiesai ir ar\u012b pien\u0101kums
  inform\u0113t cietu\u0161o pusi par ties\u012bb\u0101m sazin\u0101ties sav\u0101
  valod\u0101, ar\u012b nedzird\u012bgo un nedzird\u012bgu neredz\u012bgo z\u012bmju
  valod\u0101, un sa\u0146emt tulka pal\u012bdz\u012bbu, ja cietu\u0161ais nerun\u0101
  horv\u0101tu valod\u0101 vai to nesaprot, vai tulkot\u0101ja vai surdotulka pal\u012bdz\u012bbu,
  ja cietu\u0161ais ir nedzird\u012bgs vai nedzird\u012bgs neredz\u012bgais, par ties\u012bb\u0101m
  iesniegt blakuspras\u012bbu par zaud\u0113jumu atl\u012bdz\u012bbu un priek\u0161likumus
  par pagaidu noregul\u0113jumu, par ties\u012bb\u0101m v\u0113rst uzman\u012bbu uz
  faktiem un iesniegt pier\u0101d\u012bjumus, par ties\u012bb\u0101m apmekl\u0113t
  tiesas s\u0113di, piedal\u012bties liecinieku uzklaus\u012b\u0161an\u0101 un sniegt
  nosl\u0113guma pazi\u0146ojumu, par ties\u012bb\u0101m piek\u013c\u016bt lietas
  materi\u0101liem un par ties\u012bb\u0101m no prokurora sa\u0146emt inform\u0101ciju
  par pas\u0101kumiem, kas veikti saska\u0146\u0101 ar cietu\u0161\u0101s puses izvirz\u012bto
  aps\u016bdz\u012bbu, un iesniegt s\u016bdz\u012bbu vec\u0101kajam prokuroram.\\n\\nTies\u012bbas
  sa\u0146emt finansi\u0101lu kompens\u0101ciju\\n\\nLikums par finansi\u0101lu kompens\u0101ciju
  noziedz\u012bgos nodar\u012bjumos cietu\u0161ajiem ( ) (Horv\u0101tijas Republikas
  Zakon o nov\u010danoj naknadi \u017ertvama kaznenih djela Ofici\u0101lais V\u0113stnesis
  ( ( ) Nr. 80/08 un Nr. 27/11) nosaka ties\u012bbas uz finansi\u0101lu kompens\u0101ciju
  person\u0101m, kuras cietu\u0161as t\u012b\u0161\u0101 vardarb\u012bg\u0101 Narodne
  Novine NN) noziedz\u012bg\u0101 nodar\u012bjum\u0101, kas izdar\u012bts Horv\u0101tij\u0101,
  vai \u0161\u0101du personu radiniekiem atbilsto\u0161i likum\u0101 paredz\u0113tajiem
  nosac\u012bjumiem.\\n\\nAr to nosaka ties\u012bbas uz finansi\u0101lu kompens\u0101ciju
  t\u012b\u0161\u0101 vardarb\u012bg\u0101 noziedz\u012bg\u0101 nodar\u012bjum\u0101
  cietu\u0161ajiem un paredz priek\u0161nosac\u012bjumus un proced\u016bru kompens\u0101cijas
  ties\u012bbu \u012bsteno\u0161anai, strukt\u016bras, kas pie\u0146em l\u0113mumus
  un piedal\u0101s l\u0113mumu pie\u0146em\u0161anas proces\u0101 par ties\u012bb\u0101m
  uz kompens\u0101ciju, un strukt\u016bras un proced\u016bru p\u0101rrobe\u017eu liet\u0101s.\\n\\nT\u012b\u0161\u0101
  vardarb\u012bg\u0101 noziedz\u012bg\u0101 nodar\u012bjum\u0101 cietu\u0161ajiem
  ir ties\u012bbas uz finansi\u0101lu kompens\u0101ciju no valsts bud\u017eeta.\\n\\nPolicijai,
  prokurat\u016brai un ties\u0101m ir pien\u0101kums sniegt inform\u0101ciju par ties\u012bb\u0101m
  uz kompens\u0101ciju, izsniegt vajadz\u012bg\u0101s pieteikuma veidlapas un p\u0113c
  cietu\u0161\u0101 piepras\u012bjuma sniegt visp\u0101r\u012bgus nor\u0101d\u012bjumus
  un inform\u0101ciju par to, k\u0101 aizpild\u012bt pieteikumu, un par vajadz\u012bgajiem
  apliecino\u0161ajiem dokumentiem. Finansi\u0101l\u0101s kompens\u0101cijas pieteikumi
  j\u0101iesniedz Tieslietu ministrij\u0101, izmantojot veidlapu, ko var lejupiel\u0101d\u0113t
  ministrijas t\u012bmek\u013ca vietn\u0113.\\n\\nFinansi\u0101l\u0101s kompens\u0101cijas
  pieteikuma veidlapa noziegumos cietu\u0161ajiem_hr\\n\\n(223 Kb)\\n\\nPieteikumi
  j\u0101iesniedz se\u0161u m\u0113ne\u0161u laik\u0101 no noziedz\u012bga nodar\u012bjuma
  izdar\u012b\u0161anas dienas. Ja ir likum\u012bgi iemesli, kuru d\u0113\u013c cietu\u0161ais
  nav var\u0113jis iesniegt \u0161\u0101du pieteikumu noteiktaj\u0101 termi\u0146\u0101,
  vi\u0146am tas j\u0101izdara tr\u012bs m\u0113ne\u0161u laik\u0101 no dienas, kad
  \u0161\u0101di iemesli beigu\u0161i past\u0101v\u0113t, un katr\u0101 zi\u0146\u0101
  tr\u012bs gadu laik\u0101 no noziedz\u012bga nodar\u012bjuma izdar\u012b\u0161anas
  dienas.\\n\\nJa cietu\u0161ais ir nepilngad\u012bga persona vai persona, kurai nav
  r\u012bc\u012bbsp\u0113jas, un vi\u0146a juridiskais p\u0101rst\u0101vis se\u0161u
  m\u0113ne\u0161u laik\u0101 no noziedz\u012bg\u0101 nodar\u012bjuma dienas nav iesniedzis
  pras\u012bbu, se\u0161u m\u0113ne\u0161u termi\u0146u s\u0101k skait\u012bt no dienas,
  kad attiec\u012bg\u0101 persona sasniedz 18 gadu vecumu, vai no dienas, kad p\u0113c
  tam, kad cietus\u012b persona k\u013cuva pilngad\u012bga, tika s\u0101kts krimin\u0101lprocess,
  vai ar\u012b no dienas, kad persona atguvusi r\u012bc\u012bbsp\u0113ju.\\n\\nPersonas,
  kuras ir ties\u012bgas sa\u0146emt finansi\u0101lu kompens\u0101ciju:\\n\\nvardarb\u012bg\u0101
  noziedz\u012bg\u0101 nodar\u012bjum\u0101 cietu\u0161ais, kur\u0161 ir Horv\u0101tijas
  Republikas pilsonis, Eiropas Savien\u012bbas dal\u012bbvalsts pilsonis vai Eiropas
  Savien\u012bbas past\u0101v\u012bgais iedz\u012bvot\u0101js, un ja noziedz\u012bgs
  nodar\u012bjums izdar\u012bts Horv\u0101tij\u0101;\\n\\ncietu\u0161ais, kur\u0161
  guvis smagus miesas boj\u0101jumus vai kura vesel\u012bba noziedz\u012bg\u0101 nodar\u012bjuma
  rezult\u0101t\u0101 ir pasliktin\u0101jusies (\u0161\u0101da persona ir ties\u012bga
  sa\u0146emt kompens\u0101ciju par \u0101rst\u0113\u0161an\u0101s izmaks\u0101m,
  ja t\u0101s nesedz oblig\u0101t\u0101 vesel\u012bbas apdro\u0161in\u0101\u0161ana,
  par summu, kas nep\u0101rsniedz Horv\u0101tijas Republik\u0101 veikt\u0101s vesel\u012bbas
  apdro\u0161in\u0101\u0161anas summu, un kompens\u0101ciju par ien\u0101kumu zaud\u0113\u0161anu
  \u2014 ne vair\u0101k k\u0101 35 000 HRK);\\n\\npersona, kura ir miru\u0161\u0101
  cietu\u0161\u0101 tuvs radinieks (laul\u0101tais vai partneris, b\u0113rns, viens
  no vec\u0101kiem, viens no adopt\u0113t\u0101jiem, adopt\u0113ts b\u0113rns, pat\u0113vs
  vai pam\u0101te, pab\u0113rns, viendzimuma partneris, k\u0101ds no vecvec\u0101kiem
  un mazb\u0113rns, ja vi\u0146iem bijusi viena m\u0101jsaimniec\u012bba ar cietu\u0161o)
  (\u0161\u0101da persona ir ties\u012bga sa\u0146emt kompens\u0101ciju par likumisk\u0101
  apg\u0101dnieka zaud\u0113\u0161anu \u2014 ne vair\u0101k k\u0101 70 000 HRK);\\n\\ncietu\u0161\u0101
  n\u0101ves gad\u012bjum\u0101 \u2014 persona, kura sedz apbed\u012b\u0161anas izdevumus,
  ir ties\u012bga sa\u0146emt kompens\u0101ciju ne vair\u0101k k\u0101 5000HRK;\\n\\nja
  par noziedz\u012bgu nodar\u012bjumu ir zi\u0146ots policijai vai prokurat\u016brai
  vai ja policija vai prokurat\u016bra to ir re\u0123istr\u0113jusi se\u0161u m\u0113ne\u0161u
  laik\u0101 no t\u0101 izdar\u012b\u0161anas dienas, neatkar\u012bgi no t\u0101,
  vai ir zin\u0101ms noziedz\u012bg\u0101 nodar\u012bjuma izdar\u012bt\u0101js.\\n\\nNosakot
  kompens\u0101cijas summu, \u0146em v\u0113r\u0101 cietu\u0161\u0101 r\u012bc\u012bbu
  noziedz\u012bga nodar\u012bjuma laik\u0101 un p\u0113c noziedz\u012bga nodar\u012bjuma,
  to, vai un cikt\u0101l vi\u0146\u0161 ir veicin\u0101jis noziedz\u012bga nodar\u012bjuma
  izdar\u012b\u0161anu vai zaud\u0113jumu rad\u012b\u0161anu, to, vai persona ir tie\u0161ais
  cietu\u0161ais un vai un kad t\u0101 ir zi\u0146ojusi par noziedz\u012bgu nodar\u012bjumu
  kompetentaj\u0101m iest\u0101d\u0113m. Papildus nov\u0113rt\u0113 cietu\u0161\u0101
  sadarbo\u0161anos ar policiju un kompetentaj\u0101m iest\u0101d\u0113m, lai noziedz\u012bg\u0101
  nodar\u012bjuma izdar\u012bt\u0101ju sauktu pie atbild\u012bbas, \u0146emot v\u0113r\u0101,
  vai tie\u0161ais cietu\u0161ais ir veicin\u0101jis zaud\u0113jumu rad\u012b\u0161anu
  vai palielin\u0101jis zaud\u0113jumus; katr\u0101 no \u0161iem gad\u012bjumiem kompens\u0101ciju,
  ko cietu\u0161ais ir ties\u012bgs sa\u0146emt, attiec\u012bgi samazina. Kompens\u0101cijas
  pieteikumu noraida vai summu samazina, ja tiek konstat\u0113ts, ka cietu\u0161ais
  bijis iesaist\u012bts organiz\u0113t\u0101 noziedz\u012bb\u0101 vai noziedz\u012bg\u0101
  organiz\u0101cij\u0101. Kompens\u0101ciju var atteikt vai summu var samazin\u0101t
  ar\u012b tad, ja pilnas kompens\u0101cija summas pie\u0161\u0137ir\u0161ana b\u016btu
  pretrun\u0101 taisn\u012bguma, mor\u0101les un sabiedrisk\u0101s k\u0101rt\u012bbas
  principam.\\n\\nPazi\u0146ojums par noziedz\u012bg\u0101 nodar\u012bjuma izdar\u012bt\u0101ja
  atbr\u012bvo\u0161anu\\n\\nJa atbild\u0113t\u0101jam ir piespriests br\u012bv\u012bbas
  at\u0146em\u0161anas sods, Tieslietu ministrijas Cietu\u0161o un liecinieku atbalsta
  dienests (Slu\u017eba za podr\u0161ku \u017ertvama i svjedocima ) inform\u0113 cietu\u0161o
  par ieslodz\u012bt\u0101 atbr\u012bvo\u0161anas datumu (beznosac\u012bjuma atbr\u012bvo\u0161ana
  un nosac\u012bta atbr\u012bvo\u0161ana).\\n\\nLikum\u0101 noteiktais pien\u0101kums
  inform\u0113t cietu\u0161os par ieslodz\u012bto atbr\u012bvo\u0161anu\\n\\nSaska\u0146\u0101
  ar Likuma par izmai\u0146\u0101m un papildin\u0101jumiem Br\u012bv\u012bbas at\u0146em\u0161anas
  soda izpildes likum\u0101 (Zakon o izmjenama i dopunama Zakona o izvr\u0161enju
  kazne ) noteikumiem Tieslietu ministrijas Cietu\u0161o un liecinieku atbalsta dienestam
  ir j\u0101inform\u0113 cietu\u0161ais, cietus\u012b puse vai to \u0123imene par
  ieslodz\u012bt\u0101 zatvora atbr\u012bvo\u0161anu.\\n\\nCietu\u0161ajiem pazi\u0146o
  par ieslodz\u012bt\u0101 atbr\u012bvo\u0161anu gad\u012bjumos, kad noziedz\u012bgs
  nodar\u012bjums ir v\u0113rsts pret seksu\u0101lo br\u012bv\u012bbu un seksu\u0101lo
  mor\u0101li, dz\u012bv\u012bbu un vesel\u012bbu, vai vardarb\u012bgu noziedz\u012bgu
  nodar\u012bjumu gad\u012bjumos.\\n\\nMin\u0113to inform\u0101ciju cietu\u0161ajam,
  cietu\u0161ajai pusei vai to \u0123imenei sniedz neatkar\u012bgi no t\u0101, vai
  ieslodz\u012btais tiek atbr\u012bvots bez nosac\u012bjumiem vai nosac\u012bti.\\n\\nTurkl\u0101t,
  ja tiek pie\u0146emts l\u0113mums par to, vai ir ieteicams at\u013caut ieslodz\u012btajam
  pamest ieslodz\u012bjuma vietu, lai dotos uz t\u0101 past\u0101v\u012bgo vai pagaidu
  dz\u012bvesvietu, br\u012bv\u012bbas at\u0146em\u0161anas iest\u0101des / ieslodz\u012bjuma
  vietas var piepras\u012bt, lai Cietu\u0161o un liecinieku atbalsta dienests sniedz
  inform\u0101ciju par cietu\u0161\u0101 vai vi\u0146a \u0123imenes attieksmi pret
  \u0161\u0101du iesp\u0113ju. Cietu\u0161o un liecinieku atbalsta dienests sagatavo
  zi\u0146ojumus br\u012bv\u012bbas at\u0146em\u0161anas iest\u0101dei / ieslodz\u012bjuma
  vietai, pamatojoties uz t\u0101 sarun\u0101m ar cietu\u0161o.\\n\\nAtbalsts lieciniekiem
  un cietu\u0161ajiem\\n\\nAtbalstu lieciniekiem un cietu\u0161ajiem Horv\u0101tijas
  Republik\u0101 koordin\u0113 Tieslietu ministrijas Cietu\u0161o un liecinieku atbalsta
  dienests.\\n\\nCietu\u0161ie un liecinieki var sa\u0146emt atbalstu un inform\u0101ciju
  par vi\u0146u ties\u012bb\u0101m un par proced\u016br\u0101m no tiesu Cietu\u0161o
  un liecinieku atbalsta noda\u013c\u0101m.\\n\\n\u0160\u0101das noda\u013cas ir izveidotas
  septi\u0146\u0101s apgabalties\u0101s ( ), proti, Zagreb\u0101, Zadar\u0101, Osijek\u0101,
  Vukovaros, Split\u0101, Sisak\u0101 un Rijek\u0101. Min\u0113t\u0101s \u017eupanijski
  sudovi noda\u013cas sniedz emocion\u0101lu atbalstu, praktisku inform\u0101ciju
  un inform\u0101ciju par ties\u012bb\u0101m cietu\u0161ajiem, k\u0101 ar\u012b atbalstu
  un inform\u0101ciju lieciniekiem un tos pavado\u0161aj\u0101m person\u0101m. Atbalstu
  sniedz ar\u012b kompetento viet\u0113jo un likump\u0101rk\u0101pumu tiesu noda\u013cas
  ( un ). op\u0107inski sudovi prekr\u0161ajni sudovi\\n\\nInform\u0101ciju par sav\u0101m
  ties\u012bb\u0101m un tiem pieejam\u0101s pal\u012bdz\u012bbas veidu cietu\u0161ie
  var ar\u012b sa\u0146emt, zvanot uz Nacion\u0101l\u0101 zvanu centra noziegumos
  un (sk. Nacion\u0101l\u0101 zvanu centra t\u012bmek\u013ca vietni). likump\u0101rk\u0101pumos
  cietu\u0161ajiem bezmaksas t\u0101lru\u0146a numuru 116 006\\n\\nTieslietu ministrija
  ar\u012b sniedz cietu\u0161ajiem un lieciniekiem atbalstu un inform\u0101ciju par
  vi\u0146u ties\u012bb\u0101m, un inform\u0101cijas piepras\u012bjumus var nos\u016bt\u012bt
  pa e-pastu uz \u0161\u0101du adresi: vai uz Horv\u0101tijas Tieslietu ministrijas
  t\u012bmek\u013ca vietni: https://pravosudje.gov.hr/ email@example.com https://pravosudje.gov.hr/\\n\\nAtbalsts
  cietu\u0161ajiem un lieciniekiem p\u0101rrobe\u017eu liet\u0101s\\n\\nTieslietu
  ministrij\u0101 izveidotais Cietu\u0161o un liecinieku atbalsta dienests sniedz
  atbalstu un inform\u0101ciju gan lieciniekiem, gan cietu\u0161ajiem, kuri uzaicin\u0101ti
  uz tiesu ar starptautisk\u0101s juridisk\u0101s pal\u012bdz\u012bbas proced\u016bras
  starpniec\u012bbu (ieskaitot kara noziegumos cietu\u0161os). Inform\u0101cijas v\u0113stules
  nos\u016bta lieciniekiem, kuri uzaicin\u0101ti sniegt liec\u012bbas ties\u0101s
  Horv\u0101tijas Republik\u0101, vai lieciniekiem no Horv\u0101tijas, kuri uzaicin\u0101ti
  ierasties \u0101rvalstu ties\u0101s.\\n\\nKara noziegumu lieciniekiem vajadz\u012bbas
  gad\u012bjum\u0101 nodro\u0161ina fizisku aizsardz\u012bbu un pal\u012bdz\u012bbu
  saist\u012bb\u0101 ar vi\u0146u gatavo\u0161anos ce\u013cam un iera\u0161anos kompetentaj\u0101
  tiesu iest\u0101d\u0113 (tas attiecas uz lieciniekiem un cit\u0101m procesa pus\u0113m,
  ko uzaicina uz nopratin\u0101\u0161anu krimin\u0101lproces\u0101 saist\u012bb\u0101
  ar kara noziegumiem, kura notiek kompetentaj\u0101s tiesu iest\u0101d\u0113s Horv\u0101tijas
  Republik\u0101 vai \u0101rpus Horv\u0101tijas, ja \u0161\u0101ds atbalsts ir saist\u012bts
  ar starptautisk\u0101s juridisk\u0101s pal\u012bdz\u012bbas piepras\u012bjumu).\\n\\nLai
