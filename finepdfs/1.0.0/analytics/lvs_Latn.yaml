  nr. 1 \u2013 pieteikuma forma\\n\\nAIZPILDA UN ELEKTRONISKI IES\u016aTA TIKAI TIE
  SPORTISTI VAI ORGANIZ\u0100CIJAS, KURIEM/-\u0100M NAV PIEK\u013bUVES DATI LVS STATISTIKAS
  SIST\u0112MAI!\\n\\n(sporta skolas vai kluba nosaukums)\\n\\nPIETEIKUMS LATVIJAS
  \u010cEMPION\u0100TAM TELP\u0100S U20 un U18 vecuma grup\u0101m\\n\\nIesnieg\u0161anas
  datums:\\n\\nKontaktt\u0101lrunis:\"", "\"Papildus nodarb\u012bbu saraksts ar izgl\u012btojamajiem,
  kuri atgriezu\u0161ies no \u0101rzem\u0113m 2021./2022. m.g.\\n\\n| M\u0101c\u012bbu
  priek\u0161mets | Skolot\u0101js | Pirmdiena | Otrdiena | Tre\u0161diena | Ceturtdiena
  |\\n|---|---|---|---|---|---|\\n| Latvie\u0161u valoda | Z.Egl\u012bte |  |  |  |
  8.stunda |\"", "\"European Medicines Agency\\n\\nImprida HCT amlodip\u012bns, valsart\u0101ns
  un hidrohlorotiaz\u012bds\\n\\nEPAR kopsavilkums pla\u0161\u0101kai sabiedr\u012bbai\\n\\n\u0160is
  dokuments ir Eiropas Publisk\u0101 nov\u0113rt\u0113juma zi\u0146ojuma (EPAR) kopsavilkums.
  Taj\u0101 ir paskaidrots, k\u0101 Cilv\u0113kiem paredz\u0113to z\u0101\u013cu komiteja
  (CHMP) nov\u0113rt\u0113ja veiktos p\u0113t\u012bjumus, pirms sniegt ieteikumus
  par \u0161o z\u0101\u013cu lieto\u0161anu.\\n\\nJa Jums ir vajadz\u012bgas s\u012bk\u0101kas
  zi\u0146as par savu vesel\u012bbas st\u0101vokli vai \u0101rst\u0113\u0161anu, izlasiet
  z\u0101\u013cu lieto\u0161anas pam\u0101c\u012bbu (kas ar\u012b da\u013ca no EPAR)
  vai sazinieties ar savu \u0101rstu vai farmaceitu. Ja Jums ir vajadz\u012bgas s\u012bk\u0101kas
  zi\u0146as, kas pamato CHMP ieteikumus, izlasiet zin\u0101tnisko iztirz\u0101jumu
  (kas ar\u012b ir da\u013ca no EPAR).\\n\\nKas ir Imprida HCT?\\n\\nImprida HCT ir
  z\u0101les, kas satur tr\u012bs akt\u012bv\u0101s vielas \u2013 amlodip\u012bnu,
  valsart\u0101nu un hidrohlorotiaz\u012bdu. T\u0101s ir pieejamas k\u0101 tabletes,
  kas satur amlodip\u012bnu, valsart\u0101nu un hidrohlorotiaz\u012bdu \u0161\u0101d\u0101s
  proporcij\u0101s: 5/160/12,5 mg, 10/160/12,5 mg, 5/160/25 mg; 10/160/25 mg un 10/320/25
  mg.\\n\\nK\u0101p\u0113c lieto Imprida HCT?\\n\\nImprida HCT lieto esenci\u0101las
  hipertensijas (paaugstin\u0101ta asinsspiediena) \u0101rst\u0113\u0161anai pieaugu\u0161iem
  pacientiem, kam asinsspiediens jau tiek pietiekami kontrol\u0113ts ar amlodip\u012bna,
  valsart\u0101na un hidrohlorotiaz\u012bda kombin\u0101ciju. \u201eEsenci\u0101la\\\"
  noz\u012bm\u0113, ka hipertensijas c\u0113lonis nav zin\u0101ms. \u0160\u012bs z\u0101les
  var ieg\u0101d\u0101ties tikai pret recepti.\\n\\nK\u0101 lieto Imprida HCT?\\n\\nImprida
  HCT lieto iek\u0161\u0137\u012bgi pa vienai tabletei vienreiz dien\u0101, vien\u0101
  un tai pa\u0161\u0101 dienas laik\u0101, v\u0113lams, no r\u012bta. Imprida HCT
  lietojam\u0101 deva ir t\u0101da pati k\u0101 triju atsevi\u0161\u0137u akt\u012bvo
  vielu devas, ko pacients lietoja pirms tam. Imprida HCT dienas deva nedr\u012bkst
  p\u0101rsniegt 10 mg amlodip\u012bna, 320 mg valsart\u0101na un 25 mg hidrohlorotiaz\u012bda.\\n\\nK\u0101
  Imprida HCT darbojas?\\n\\nZ\u0101les vairs nav re\u011fistr\u0113tas\\n\\nImprida
  HCT tr\u012bs akt\u012bv\u0101s vielas ir prethipertensijas z\u0101les, ko jau lieto
  Eiropas Savien\u012bb\u0101 (ES). Amlodip\u012bns ir kalcija kan\u0101lu blo\u0137\u0113t\u0101js.
  Tas blo\u0137\u0113 speci\u0101lus kan\u0101lus uz \u0161\u016bnu virsmas (kalcija
  kan\u0101lus), pa kuriem kalcija joni parasti iek\u013c\u016bst \u0161\u016bn\u0101s.
  Kad kalcija joni iek\u013c\u016bst asinsvadu sieni\u0146u musku\u013cu \u0161\u016bn\u0101s,
  tie izraisa asinsvadu sarau\u0161anos. Samazinot kalcija jonu iepl\u016bdi \u0161\u016bn\u0101s,
  amlodip\u012bns nov\u0113r\u0161 \u0161o \u0161\u016bnu sarau\u0161anos un pal\u012bdz
  atsl\u0101bin\u0101t un papla\u0161in\u0101t asinsvadu sienas, \u0161\u0101d\u0101
  veid\u0101 samazinot asinsspiedienu. Valsart\u0101ns ir \u201eangiotenz\u012bna
  II receptora antagonists\\\", kas noz\u012bm\u0113, ka tas organism\u0101 blo\u0137\u0113
  hormona angiotenz\u012bna II darb\u012bbu. Angiotenz\u012bns II ir iedarb\u012bgs
  vazokonstriktors (viela, kas sa\u0161aurina asinsvadus). Blo\u0137\u0113jot receptorus,
  pie kuriem angiotenz\u012bns II parasti piesaist\u0101s, valsart\u0101ns nov\u0113r\u0161
  hormona iedarb\u012bbu, \u013caujot asinsvadiem papla\u0161in\u0101ties un asinsspiedienam
  pazemin\u0101ties.\\n\\nHidrohlorotiaz\u012bds ir diur\u0113ti\u0137is.  Tas palielina
  izdal\u012bt\u0101 ur\u012bna daudzumu, samazinot \u0161\u0137idruma daudzumu asin\u012bs,
  t\u0101d\u0113j\u0101di pazeminot asinsspiedienu.\\n\\nAbu akt\u012bvo vielu kombin\u0101cijai
  piem\u012bt papildino\u0161a iedarb\u012bba, kop\u0101 t\u0101s samazina asinsspiedienu
  vair\u0101k nek\u0101 katras z\u0101les atsevi\u0161\u0137i. Pazeminot asinsspiedienu,
  samazin\u0101s augsta asinsspiediena izrais\u012bto boj\u0101jumu risks, piem\u0113ram,
  insulta risks.\\n\\n7 Westferry Circus, Canary Wharf,  London  E14 4HB, UK\\n\\nTel.
  (44-20) 74 18 84 00  Fax (44-20) 74 18 84 16\\n\\nE-mail: email@example.com     http://www.emea.europa.eu\\n\\nEMEA/H/C/1161\\n\\nK\u0101
  norit\u0113ja Imprida HCT izp\u0113te?\\n\\nT\u0101 k\u0101 triju akt\u012bvo vielu
  kombin\u0101ciju lieto jau vair\u0101kus gadus, uz\u0146\u0113mums zi\u0146oja par
  p\u0113t\u012bjumiem, kas par\u0101da, ka tr\u012bs akt\u012bv\u0101s vielas saturo\u0161a
  tablete uzs\u016bcas organism\u0101 t\u0101 pat k\u0101 tabletes, kas satur katru
  akt\u012bvo vielu atsevi\u0161\u0137i.\\n\\nTurkl\u0101t vienu pamatp\u0113t\u012bjumu
  veica, iesaistot 2271 pacientu ar m\u0113reni l\u012bdz smagi izteiktu hipertensiju,
  lietojot visstipr\u0101k\u0101s Imprida HCT (320 mg valsart\u0101na, 10 mg amlodip\u012bna
  un 25 mg hidrohlorotiaz\u012bda). Pacienti asto\u0146u ned\u0113\u013cu laik\u0101
  sa\u0146\u0113ma Imprida HCT vai vienu no trij\u0101m kombin\u0101cij\u0101m, kuru
  sast\u0101v\u0101 bija tikai divas akt\u012bv\u0101s vielas. Galvenais iedarb\u012bguma
  r\u0101d\u012bt\u0101js bija asinsspiediena pazemin\u0101\u0161an\u0101s diastol\u0113.\\n\\nK\u0101ds
  ir Imprida HCT iedarb\u012bgums \u0161ajos p\u0113t\u012bjumos?\\n\\nHipertensijas
  \u0101rst\u0113\u0161ana, lietojot  visstipr\u0101k\u0101s Imprida HCT, bija efekt\u012bv\u0101ka
  nek\u0101 du\u0101las  kombin\u0101cijas, kuru sast\u0101v\u0101 bija jebk\u0101das
  divas akt\u012bv\u0101s vielas. Vid\u0113jais asinsspiediena samazin\u0101jums bija
  apm\u0113ram 39,7/24,7 mmHg pacientiem, kas lietoja Imprida HCT, sal\u012bdzin\u0101jum\u0101
  ar 32/19,7 mmHg, 33,5/21,5 mmHg un 31,5/19,5 mmHg pacientiem, kas lietoja attiec\u012bgi
  valsart\u0101na/hidrohlorotiaz\u012bda kombin\u0101ciju, valsart\u0101na/amlodip\u012bna
  kombin\u0101ciju un hidrohlorotiaz\u012bda/amlodip\u012bna kombin\u0101ciju.\\n\\nK\u0101ds
  past\u0101v risks, lietojot Imprida HCT?\\n\\nVisbie\u017e\u0101k nov\u0113rot\u0101s
  nev\u0113lam\u0101s Imprida HCT blakuspar\u0101d\u012bbas (vienam l\u012bdz desmit
  pacientiem no simt) ir hipokal\u0113mija (pazemin\u0101ts k\u0101lija l\u012bmenis
  asin\u012bs), reibonis, galvass\u0101pes, hipotensija (pazemin\u0101ts asinsspiediens),
  dispepsija (gr\u0113mas), pollaki\u016brija (neparasti bie\u017ea urin\u0113\u0161ana),
  nesp\u0113ks (nogurums) un t\u016bska (\u0161\u0137idruma aizture). Pilns visu Imprida
  HCT izrais\u012bto nev\u0113lamo blakuspar\u0101d\u012bbu apraksts ir atrodams \u0161o
  z\u0101\u013cu lieto\u0161anas pam\u0101c\u012bb\u0101.\\n\\nCilv\u0113kiem paredz\u0113to
  z\u0101\u013cu komiteja (CHMP) atz\u012bm\u0113ja, ka pacientiem, kas jau lieto
  tr\u012bs akt\u012bv\u0101s vielas, \u0101rst\u0113\u0161anas laik\u0101 \u0113rt\u0101k
  parakst\u012bt Imprida HCT, kas satur tr\u012bs akt\u012bv\u0101s vielas vien\u0101
  tablet\u0113. Pamatp\u0113t\u012bjum\u0101 tika par\u0101d\u012bts pacienta ieguvums
  asinsspiediena pazemin\u0101\u0161an\u0101, lietojot visstipr\u0101k\u0101s Imprida
  HCT. Attiec\u012bb\u0101 uz vis\u0101m dev\u0101m Imprida HCT izpild\u012bja pras\u012bbas,
  kas pier\u0101da, ka t\u0101s ir sal\u012bdzin\u0101mas ar da\u017eu akt\u012bvo
  vielu kombin\u0101cij\u0101m, lietojot t\u0101s atsevi\u0161\u0137i. T\u0101d\u0113\u013c
  CHMP nol\u0113ma, ka pacienta ieguvums, lietojot Imprida HCT esenci\u0101las hipertensijas
  \u0101rst\u0113\u0161an\u0101 pieaugu\u0161iem pacientiem, kuru asinsspiediens tiek
  jau pietiekami kontrol\u0113ts ar amlodip\u012bna, valsart\u0101na un hidrohlorotiaz\u012bda
  kombin\u0101ciju, p\u0101rsniedz \u0161o z\u0101\u013cu rad\u012bto risku. Komiteja
  ieteica izsniegt Imprida HCT re\u0123istr\u0101cijas apliec\u012bbu.\\n\\nImprida
  HCT nedr\u012bkst lietot cilv\u0113ki ar paaugstin\u0101tu jut\u012bbu (aler\u0123iju)
  pret akt\u012bvaj\u0101m viel\u0101m, citiem sulfonam\u012bdiem, dihidropirid\u012bna
  atvasin\u0101jumiem vai k\u0101d\u0101m cit\u0101m Imprida HCT sast\u0101vda\u013c\u0101m.
  T\u0101s nedr\u012bkst lietot sievietes p\u0113c tre\u0161\u0101 gr\u016btniec\u012bbas
  m\u0113ne\u0161a. T\u0101s nedr\u012bkst lietot pacienti ar aknu vai \u017eultsp\u016b\u0161\u013ca
  darb\u012bbas trauc\u0113jumiem (piem\u0113ram, dzelten\u0101 kaite), smagi izteiktiem
  nieru darb\u012bbas trauc\u0113jumiem, an\u016briju (slim\u012bba, kad pacients
  nesp\u0113j urin\u0113t) vai pacienti, kam veic dial\u012bzi (asins att\u012br\u012b\u0161anas
  metode). Visbeidzot, Imprida HCT nedr\u012bkst lietot pacienti ar hipokal\u0113miju
  (pazemin\u0101tu k\u0101lija l\u012bmeni asin\u012bs), hiponatr\u0113miju (pazemin\u0101tu
  n\u0101trija l\u012bmeni asin\u012bs) un hiperkalc\u0113miju (pazemin\u0101tu kalcija
  l\u012bmeni asin\u012bs), kuriem nenov\u0113roja atbildes reakciju \u0101rst\u0113\u0161anas
  laik\u0101 un pacienti ar hiperurik\u0113miju (paaugstin\u0101tu ur\u012bnsk\u0101bes
  l\u012bmeni asin\u012bs), kas izraisa simptomus. K\u0101p\u0113c Imprida HCT tika
  apstiprin\u0101tas? Z\u0101les vairs nav re\u011fistr\u0113tas\\n\\nCita inform\u0101cija
  par Imprida HCT.\\n\\nEiropas Komisija 2009. gada 15. oktobr\u012b izsniedza Imprida
  HCT re\u0123istr\u0101cijas apliec\u012bbu, kas der\u012bga vis\u0101 Eiropas Savien\u012bb\u0101,
  uz\u0146\u0113mumam Novartis Europharm Limited.\\n\\nPilns Imprida HCT EPAR teksts
  ir atrodams \u0161eit..\\n\\n\u0160o kopsavilkumu p\u0113d\u0113jo reizi atjaunin\u0101ja
