  apstiprin\u0101\u0161u dokumentu\u2014 kv\u012bti vai maks\u0101juma uzdevumu;\\n   -
  4.3. Ar bankas p\u0101rsak\u0101t\u012bjumu, veicot priek\u0161apmaksas maks\u0101jumu,
