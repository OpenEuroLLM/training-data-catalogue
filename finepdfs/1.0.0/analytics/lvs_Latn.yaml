  un redi\u0123\u0113t, ja atbilde ir nekonkr\u0113ta.\\n\\nnLatvijas Re\u0123ionu
  aPvien\u012bba\\n\\nEgIls KurPnIEKs:- C\u0113su novada uz\u0146\u0113m\u0113jdarb\u012bbas
