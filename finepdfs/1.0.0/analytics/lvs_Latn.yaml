  principi. Jaunais studiju kurss var\u0113tu b\u016bt 1 KP apjom\u0101, nepiecie\u0161amo
  KP var\u0113tu ieg\u016bt, optimiz\u0113jot studiju kursu \u201cAugu un dz\u012bvnieku
  biolo\u0123ija\u201d, kur\u0161 s\u014dbr\u012bd ir 1 KP apjom\u0101, tom\u0113r
