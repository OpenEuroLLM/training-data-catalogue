  jaut\u0101, partijas atbild\\n\\nK\u0101 veiksm\u012bgu piem\u0113ru varam min\u0113t
  Straupes Zirgu pasta stacijas Lauku labumu tirdzi\u0146u, k\u0101 ar\u012b Zaubes
