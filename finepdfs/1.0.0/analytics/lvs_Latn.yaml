  Studiju programm\u0101 profesion\u0101lo nozares kursu \u012bsteno\u0161an\u0101
  k\u0101 piem\u0113ram Soci\u0101l\u0101 farm\u0101cija un farmaceitisk\u0101 apr\u016bpe,
