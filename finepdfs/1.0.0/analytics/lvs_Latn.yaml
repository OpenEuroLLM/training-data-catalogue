  atzina, ka vi\u0146iem vis\u0113rt\u0101k lietojamais ir Kahoot.com un Mentimeter.com,
  kur. Savuk\u0101rt Plicker.com tika atz\u012bts k\u0101 pats nepraktisk\u0101kais
  no sagatavo\u0161an\u0101s viedok\u013ca. Testmoz.com funkcijas ir \u013coti l\u012bdz\u012bgas
  Koledzas e-studiju vides Moodle elektronisko testu funkcij\u0101m. Lai nodro\u0161in\u0101tu
  liel\u0101ku doc\u0113t\u0101ju iesaist\u012b\u0161anu, tika izstr\u0101d\u0101ta
  elektroniska pam\u0101c\u012bba ar veicamajiem sagatavo\u0161an\u0101s soliem. Visas
  pam\u0101c\u012bbas ir pieejamas e-studiju vid\u0113 Moodle. Doc\u0113t\u0101ji
  praktiz\u0113 ar\u012b lietotnes, kuri apguvu\u0161i pa\u0161i, piem\u0113ram, Quizlet,
