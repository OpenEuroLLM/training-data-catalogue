  sagatavots atsevi\u0161\u0137s MS Words vai l\u012bdz\u012bga form\u0101ta p\u0101rskats
  studentiem, kas ir viegl\u0101k uztverams, koncentr\u0113t\u0101ks. 67% respondentu
  nor\u0101da, ka iepaz\u012bstin\u0101\u0161anai ar kursa aprakstu velta 10 min\u016btes
  laika, 19% nor\u0101da, ka velta 10-20 min\u016btes laika un 5% velta apm\u0113ram
  20-30 min\u016btes laika.\\n\\n9. Zin\u0101tnisk\u0101 p\u0113tniec\u012bba un m\u0101ksliniecisk\u0101
  jaunrade\\n\\nKoled\u017eas Strat\u0113\u0123ijas 2021. - 2027. otras m\u0113r\u0137is
  nosaka p\u0113tniec\u012bbas att\u012bst\u012bbas veicina\u0161ana studiju proces\u0101,
  sabiedr\u012bbas vesel\u012bbas veicina\u0161anai priorit\u0101rajos virzienos,
  sadarbojoties ar vesel\u012bbas apr\u016bpes nozari un iesaistoties sadarb\u012bbas
  projektos ar starptautiskiem partneriem. Koled\u017e\u0101 ir noteikti sekojo\u0161i
  lietisk\u0101s p\u0113tniec\u012bbas virzieni 2021.-2027. gadam, kuri atbilst sabiedr\u012bbas
  vesel\u012bbas un soci\u0101l\u0101s apr\u016bpes aktualit\u0101t\u0113m:\\n\\n-
  prakses efektivit\u0101tes paaugstin\u0101\u0161ana studiju virzien\u0101 Vesel\u012bbas
  apr\u016bpe, tai skait\u0101 stud\u0113jo\u0161o prasmju pilnveide prekl\u012bniski,
  simul\u0113t\u0101 kliniskaj\u0101 vid\u0113;\\n- digit\u0101l\u0101 transform\u0101cija
  vesel\u012bbas apr\u016bp\u0113 un nozares speci\u0101listu digit\u0101l\u0101s
  kompetences;\\n- digit\u0101lo vesel\u012bbas apr\u016bpes risin\u0101jumu pla\u0161\u0101ka
  izmanto\u0161ana vesel\u012bbas apr\u016bp\u0113, E-vesel\u012bba: iesp\u0113jas
  un sadarb\u012bba pacienta lab\u0101;\\n- jaun\u0101s tehnolo\u0123ijas un virtu\u0101l\u0101
  vide pacientu apr\u016bp\u0113, tai skait\u0101 m\u0101ksl\u012bg\u0101 intelekta
  izmanto\u0161ana;\\n- biolo\u0123isk\u0101 noveco\u0161an\u0101s, ar to saist\u012bt\u0101s
  senioru vesel\u012bbas apr\u016bpes probl\u0113mas un dz\u012bves kvalit\u0101te;\\n-
  indiv\u012bdu ar \u012bpa\u0161\u0101m vajadz\u012bb\u0101m vesel\u012bbas apr\u016bpes
  probl\u0113mas;\\n- vides ietekme un mijiedarb\u012bba vesel\u012bbas saglab\u0101\u0161anai
  da\u017e\u0101d\u0101s vecuma grup\u0101s;\\n- sabiedr\u012bbas vesel\u012bbas veicina\u0161ana;\\n-
  masiera darb\u012bba indiv\u012bda vesel\u012bbas un funkcion\u0101l\u0101 st\u0101vok\u013ca,
  k\u0101 ar\u012b ar vesel\u012bbu saist\u012bt\u0101s dz\u012bves kvalit\u0101tes
  un labsaj\u016btas uzlabo\u0161an\u0101;\\n- \u0101rstu pal\u012bga darb\u012bbas
  izp\u0113te prim\u0101raj\u0101 vesel\u012bbas apr\u016bp\u0113;\\n\\no \u0101rsta
  pal\u012bga darb\u012bbas izp\u0113te sekund\u0101raj\u0101 vesel\u012bbas apr\u016bp\u0113;\\no
  \u0101rsta pal\u012bga darb\u012bbas izp\u0113te terci\u0101raj\u0101 vesel\u012bbas
  apr\u016bp\u0113\\no \u0101rsta pal\u012bga darb\u012bbas izp\u0113te neatliekam\u0101s
  medic\u012bnisk\u0101s pal\u012bdz\u012bbas snieg\u0161an\u0101 pirmsstacion\u0101ra
  posm\u0101;\\no farmaceitisk\u0101 apr\u016bpe un farmaceita asistenta loma;\\no
  starpdisciplin\u0101ra sadarb\u012bba un komunik\u0101cija;\\no kait\u0113jumu riska
  nov\u0113r\u0161ana pacientam, dro\u0161\u012bba pacienta apr\u016bp\u0113 un \u0101rst\u0113\u0161an\u0101.\\n\\n**Stud\u0113jo\u0161o
  un doc\u0113t\u0101ju iesaiste zin\u0101tniskaj\u0101 p\u0113tniec\u012bb\u0101**\\n\\nKatru
