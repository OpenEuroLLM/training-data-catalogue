  operat\u012bvi vismaz p\u0113c 30 min\u016b\u0161u gara laika posma p\u0113c zi\u0146u
  un raid\u012bjumu p\u0101rraid\u012b\u0161anas beig\u0101m sabiedrisko mediju programm\u0101s
  un atdalot tos no cita elektronisk\u0101 pla\u0161sazi\u0146as l\u012bdzek\u013ca
  p\u0101rraid\u012btaj\u0101m zi\u0146\u0101m un raid\u012bjumiem, bet ne v\u0113l\u0101k
  k\u0101 3 stundu laik\u0101 no to p\u0101rraid\u012b\u0161anas Latvijas Telev\u012bzij\u0101
  vai l\u012bdz n\u0101kamajam zi\u0146u izlaidumam (zi\u0146u atk\u0101rtojumi netiek
  pie\u013cauti);\\n14.2. informat\u012bvi anal\u012btiskais raid\u012bjums cit\u0101
  elektroniskaj\u0101 pla\u0161sazi\u0146as l\u012bdzekl\u012b tiek p\u0101rraid\u012bts
  24 stundu laik\u0101 no t\u0101 p\u0101rraid\u012b\u0161anas LTV programm\u0101
  (raid\u012bjuma atk\u0101rtojumi netiek pie\u013cauti);\\n14.3. elektroniskajiem
  pla\u0161sazi\u0146as l\u012bdzek\u013ciem LTV programmu \\\"LTV1\\\" un \\\"LTV7\\\"
  programmu sign\u0101ls tiek nodro\u0161in\u0101ts br\u012bvi pieejam\u0101 bezmaksas
  zemes apraid\u0113.\\n15. Latvijas Radio nodro\u0161ina audiofailu pieteikumam un
  atteikumam \u0113ter\u0101. Elektroniskajam pla\u0161sazi\u0146as l\u012bdzeklim,
  kam tiek nodots saturs, j\u0101nodro\u0161ina audiofaila p\u0101rraid\u012b\u0161ana
  pirms un p\u0113c p\u0101rraides;\\n16. Latvijas Radio veidotos zi\u0146u un informat\u012bvi
  anal\u012btiskos raid\u012bjumus dr\u012bkst izmantot vien\u012bgi piln\u0101 apjom\u0101
  k\u0101 vienotu veselumu, ja vien ar Padomi un Latvijas Radio nav saska\u0146ota
  cita raid\u012bjumu izmanto\u0161anas k\u0101rt\u012bba. Latvijas Radio saturu ir
  aizliegts p\u0101rveidot, t.sk. redi\u0123\u0113t, izmantot da\u013c\u0113ji vai
  pa da\u013c\u0101m, papildin\u0101t, iek\u013caut cit\u0101 satur\u0101, veidot
  koment\u0101rus par saturu u.tml..\\n\\n17. Latvijas Radio saturs ir j\u0101p\u0101rraida
  \u0161\u0101d\u0101 k\u0101rt\u012bb\u0101:\\n\\n17.1. zi\u0146as cit\u0101 elektroniskaj\u0101
  pla\u0161sazi\u0146as l\u012bdzek\u013ci tiek p\u0101rraid\u012btas operat\u012bvi
  un ne v\u0113l\u0101k k\u0101 1 stundas laik\u0101 no to p\u0101rraid\u012b\u0161anas
  Latvijas Radio vai l\u012bdz n\u0101kamajam zi\u0146u izlaidumam;\\n\\n17.2. informat\u012bvi
  anal\u012btiskais raid\u012bjums cit\u0101 elektroniskaj\u0101 pla\u0161sazi\u0146as
  l\u012bdzekl\u012b tiek p\u0101rraid\u012bts 24 stundu laik\u0101 no t\u0101 p\u0101rraid\u012b\u0161anas
  Latvijas Radio;\\n17.3. Latvijas Radio veidoto un p\u0101rraid\u012bto zi\u0146u
  un informat\u012bvi anal\u012btisko raid\u012bjumu multimedi\u0101la satura nodo\u0161ana
  ir pie\u013caujama atbilsto\u0161i 8.-9.punkt\u0101 noteiktajiem krit\u0113rijiem,
  k\u0101 ar\u012b citam elektroniskajam pla\u0161sazi\u0146as l\u012bdzeklim nodro\u0161inot
  satura nodo\u0161anas un p\u0101rraid\u012b\u0161anas tehnisk\u0101s iesp\u0113jas
  un p\u0101rraid\u012b\u0161anas kvalit\u0101ti. Satura sa\u0146\u0113m\u0113js par
  saviem l\u012bdzek\u013ciem un ar saviem resursiem gatavo un ar Latvijas Radio saska\u0146o
  pirms un p\u0113c raid\u012bjuma atdalo\u0161os video aizlikt\u0146us, k\u0101 ar\u012b
  sedz jebk\u0101das ar satura nodo\u0161anu saist\u012btas izmaksas;\\n17.4. zi\u0146as
  un raid\u012bjumi tiek p\u0101rraid\u012bti cita elektronisk\u0101 pla\u0161sazi\u0146as
  l\u012bdzek\u013ca programm\u0101, iev\u0113rojot vismaz p\u0113c 30 min\u016b\u0161u
  garu laika posma p\u0113c zi\u0146u un raid\u012bjumu p\u0101rraid\u012b\u0161anas
  beig\u0101m sabiedrisko mediju programm\u0101s un atdalot tos no cita elektronisk\u0101
  pla\u0161sazi\u0146as l\u012bdzek\u013ca p\u0101rraid\u012btaj\u0101m zi\u0146\u0101m
  un raid\u012bjumiem.\\n18. Elektroniskie pla\u0161sazi\u0146as l\u012bdzek\u013ci,
  kuriem ir pie\u0161\u0137irtas ties\u012bbas sa\u0146emt bezatl\u012bdz\u012bbas
  lieto\u0161an\u0101 sabiedrisko mediju veidotus un p\u0101rraid\u012btus zi\u0146u
  un informat\u012bvi anal\u012btiskajos raid\u012bjumus, nedr\u012bkst tos nodot
  cit\u0101m l\u0113mum\u0101 nenor\u0101d\u012btaj\u0101m tre\u0161aj\u0101m person\u0101m,
  k\u0101 ar\u012b nedr\u012bkst tajos ievietot nek\u0101dus audi\u0101lus un audiovizu\u0101lus
  pazi\u0146ojumus.\\n19. Ja sabiedriskie mediji vai Padome konstat\u0113, ka iepriek\u0161
  min\u0113tie krit\u0113riji netiek iev\u0113roti, Padome p\u0113c savas iniciat\u012bvas
  vai p\u0113c inform\u0101cijas sa\u0146em\u0161anas no sabiedriskajiem medijiem
  un izv\u0113rt\u0113jot p\u0101rk\u0101pumu b\u016btiskumu, ir ties\u012bga lemt
  par bezatl\u012bdz\u012bbas lieto\u0161an\u0101 nodoto zi\u0146u un informat\u012bvi
  anal\u012btisko raid\u012bjumu lieto\u0161anas p\u0101rtrauk\u0161anu.\\n20. Sabiedriskajiem
  medijiem nav ties\u012bbu piem\u0113rot l\u012bgumsodus vai citas sankcijas elektroniskajiem
  pla\u0161sazi\u0146as l\u012bdzek\u013ciem saist\u012bb\u0101 ar Padomes l\u0113mumiem
  par zi\u0146u un raid\u012bjumu nodo\u0161anu bezatl\u012bdz\u012bbas lieto\u0161an\u0101
  citiem elektroniskajam pla\u0161sazi\u0146as l\u012bdzeklim izpildi.\\n21. Padome
  ir ties\u012bga lemt par bezatl\u012bdz\u012bbas lieto\u0161an\u0101 nodoto zi\u0146u
  un raid\u012bjumu lieto\u0161anas izbeig\u0161anu, ja elektroniskais pla\u0161sazi\u0146as
  l\u012bdzeklis, kam nodoti bezatl\u012bdz\u012bbas lieto\u0161an\u0101 sabiedrisko
  mediju zi\u0146as un raid\u012bjumi, neiev\u0113ro \u0161aj\u0101 l\u0113mum\u0101
  nor\u0101d\u012btos krit\u0113rijus vai ir zudusi lieto\u0161anas nepiecie\u0161am\u012bba,
