  daudzstr\u016bklu un t\u0101 meh\u0101nisms ir herm\u0113tiski norobe\u017eots no
  m\u0113r\u012bjam\u0101 \u016bdens pl\u016bsmas, un dod iesp\u0113ju nolas\u012bt
  pat\u0113r\u0113t\u0101 \u016bdens daudzumu m 3 .\\n\\n2\\n\\n5. SKAIT\u012aT\u0100JA
  SAGATAVO\u0160ANA DARBAM\\n\\n5.1. Pirms uzst\u0101d\u012b\u0161anas j\u0101p\u0101rbauda
