  "\"**ROTLALIETA**\\n\\n**Skrejritenis**\\n\\nKRISJ\u0100NIS KR\u016aMIN\u0160, beidzis
  R\u012bgas Tehnisko universit\u0101ti, b\u016bvzin\u0113tiers.\\n\\n\u00abSkrejritenis
  dom\u0101ts b\u0113rniem, l\u012bdzsvara saj\u016btas tren\u0113\u0161anai. Tas
  lieliski pal\u012bdz iem\u0101c\u012bties braukt ar ped\u0101\u013cu riteni.\u00bb\\n\\n**INTERJERA
  AKSESU\u0100RS**\\n\\n**Pusbumbas galds**\\n\\nALDIS LEMBERGS, stud\u0113jis rekl\u0101mu,
  nav m\u0101c\u012bjies neko, kas saist\u012bts ar m\u0101kslu vai amatniec\u012bbu,
  vien\u012bgi apmekl\u0113jis metin\u0101\u0161anas kursus.\\n\\n\u00abKad gaid\u012bj\u0101m
  m\u016bsu meiti\u0146as, abi ar ligavu nol\u0113m\u0101m, ka mebeles un interjera
  aksesu\u0101rus tais\u012bsim pa\u0161i. Lai b\u016btu dro\u0161\u0101k mazaj\u0101m,
  mebeles izl\u0113m\u0101m veidot apak\u0161as formas. T\u0101 ar\u012b tapa pushumbas
  plaukts un puku pods, bumbu lustra un st\u0101vlampa, un visbeidzot \u2013 ar\u012b
  \u0161is galdi\u0146\u0161. Izveidoju pushumbas veidni, uz kuras liku k\u0101rt\u0101s
  stikla \u0161\u0137iedras audumu ar epoks\u012bda liemi. P\u0113c tam lidzin\u0101ju
  virsmu ar auto \u0161pakteli. Tr\u012bjas viet\u0101s pamata korpus\u0101 izgriezu
  garenus caurumus, lai var izveidot gal\u0101 plaukti\u0146u. Apak\u0161\u0113j\u0101
  da\u013ca galda korpus\u0101 iemont\u0113ju koka gredzenu, kur\u0101 iestr\u0101d\u0101ju
  mat\u0113tu org\u0101nisko stiklu. Aug\u0161\u0113j\u0101 da\u013c\u0101 izveidoju
  koka gredzenu, kur\u0101 iestr\u0101d\u0101ju apalu stiklu.\u00bb\\n\\n**M\u0112BELE**\\n\\n**\u0112damgalds
  ar kr\u0113sliem**\\n\\nLAIMONIS HINCENBERGS, amatnieka pieredzes un izgl\u012bt\u012bbas
  nav, m\u0113belu komplektu uzmeistaroj\u012b\u0161 br\u012bvaj\u0101 laik\u0101.\\n\\nKonkursam
  Laimonis pieteiku\u0161as darba kol\u0113\u0123es: \u00ab\u0160\u012bs mebeles izveidotas
  mums \u2013 kol\u0113\u0123iem \u2013 par prieku un atrodas ALSO Latvia ofisa m\u0101jas
  teras\u0113 pa\u0161\u0101 M\u0101rupes centr\u0101. Par izejamaterialiem Laimonis
  izmantojis visparast\u0101kos eirope\u0161u d\u0113\u013cisus, tos nolakoju.\u00bb\\n\\n**ZA\u013bKN\u0100BIS
  2012**\\n\\n**Galda sp\u0113les**\\n\\nD\u0100VIS RA\u0122ELS, skolnieks, 14 gadi,
  koka darbus m\u0101c\u012bjies m\u0101jtur\u012bbas stund\u0101s 5. klase\\n\\nKonkursam
  D\u0101vis bija ies\u016bt\u012bjis vair\u0101kus darbus un \u016b\u017eirjas ipa\u0161as
  simpatijas izpeln\u012bjas ar savu \u010daklumu un attieksmi pret dz\u012bvi: gribu
  sev k\u0101du jaunu sp\u0113li, uztaisu pati! \u00abGalda futbols \u2013 viss gatavots
  no koka, iz\u0146emot met\u0101la stie\u0146us un v\u0101rtu tiklus. Uz v\u0101rtiem
  st\u0101v rezult\u0101tu r\u0101d\u012bt\u0101js, stie\u0146u galos ir rokturi.
  Cilv\u0113cinji ir no finiera un pie\u0161im\u0113ti pie met\u0101la stie\u0146iem,
  bet v\u0101rti tais\u012bti no koka list\u0113m. Koka sp\u0113li Labirints, kur\u0101
  bumb\u012bja no viena gala j\u0101izpirina l\u012bdz otram, neieripinot to caurumos,
  tais\u012bju no o\u0161a list\u0113m un finiera pl\u0101ksnes.\u00bb\\n\\n**MEISTARSTIKIS
  2012**\\n\\n**Sulu spiedne**\\n\\nAIGARS ROZE, speci\u0101las izgatav\u012bbas nav,
  bet kaut ko vienm\u0113r meistarojis, kop\u0161 s\u0113vi atceras \u2013 s\u0101kum\u0101
  lidmodelus un automodelus, tad vienk\u0101r\u0161us m\u0101jas priek\u0161metus:
  d\u0101rza mebeles, skapi, b\u0113rna gul\u0161\u0146u u. c.\\n\\n\u00abSulu spiednes
  ideju mekl\u0113ju intern\u0113t\u0101, un rezult\u0101t\u0101, sarakstoties ar
  k\u0101du kan\u0101dieti, rad\u0101s \u0161is projekts. Sulu spiednes r\u0101mis,
  spiedv\u012brsma aug\u0161\u0113j\u0101 da\u013ca un grozs ir tais\u012bti no ozolkoka,
  spiedv\u012brsma un sulas sav\u0101c\u0113jtraukis un sapl\u0101ksn\u0113. Visas
  koka detaljas ir apstr\u0101d\u0101tas ar lins\u0113klu \u0113\u013cu. Sula tiek
  spiesta, izmantojot hidraulisko domkratu. T\u0101 k\u0101 sulu spiedne ir no ozolkoka,
  t\u0101s svars ir ap 100 kg. Spiedne ir izm\u0113\u0123in\u0101ta ar\u012b darb\u012bb\u0101
  pag\u0101ju\u0161aj\u0101 rudeni, spiezot abolu un v\u012bnogu sulas.\u00bb\\n\\n**M\u0100JAS
  TEKSTILS**\\n\\n**Pakl\u0101js Cinnamon**\\n\\nEGIJA GRIBUSTE, hob\u012bjs \u2013
  strukt\u016bras tekstila izstr\u0101d\u0101jumu dizains un darin\u0101\u0161ana.\\n\\n\u00abPakl\u0101ju
  Cinnamon (tulkojum\u0101 \u2013 kan\u0113lis) audu, iedvesmojoties no kan\u0113la
  stand\u017e\u016br\u0101m un izmantot praktiskus materi\u0101lus \u2013 100% linu
  un 100% kokvilnas trikot\u0101\u017eu. Pakl\u0101js (160 x 220 cm) ir m\u012bksts
  un patikams. Viem\u0113r aktu\u0101los, br\u016bnos ton\u016bs izv\u0113l\u0113jos,
  iai pakl\u0101js labi iek\u013cauto tarn parredz\u0113taj\u0101 vid\u0113 un kalpotu
  ilgi. Attiek vien piebilst, ka Cinnamon ir viegli kopjams.\u00bb\"", "\"Latvijas
