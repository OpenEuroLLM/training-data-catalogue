  studiju form\u0101 tika izmantotas t\u0101das studiju metodes k\u0101 semin\u0101ri,
  laboratorijas\\ndarbi, simul\u0113t\u0101s vides lomu sp\u0113les, situ\u0101ciju
  anal\u012bzes, patst\u0101v\u012bg\u0101s studijas, esejas, refer\u0101ti,\\nstudentu
