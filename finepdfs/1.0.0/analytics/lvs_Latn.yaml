  organiz\u0113jot d\u0101\u017e\u0101du tipa un l\u012bme\u0146a zin\u0101\u0161anu
  un prasmju p\u0101rbaudes stacijas.\\n\\nGalvenie komponenti OSKI eks\u0101mena
  komponenti ir sekojo\u0161i:\\n\\n1. skaidri defin\u0113ts uzdevums;\\n2. skaidri
  aprakst\u012bta v\u0113rt\u0113\u0161ana sist\u0113ma, kas ietver vair\u0101kus
  l\u012bme\u0146us un staciju organiz\u0113\u0161anas principus (piem\u0113ram, uz
  uzdevumiem balst\u012bta pieeja, nov\u0113rojums u.c.) var tiek pielietotas \u00abChecklist\u00bb
  kontrolsaraksts;\\n3. instrukcija studentam (skaidras nor\u0101des, kas ir j\u0101paveic
  konkr\u0113t\u0101 stacij\u0101).\\n\\n**Studiju procesa praktisk\u0101 \u012bsteno\u0161ana**\\n\\n2021/2022.
  studiju gad\u0101 studiju process vis\u0101s studiju programm\u0101s tika organiz\u0113ts
  k\u0101 pilna laika studijas kl\u0101tienes un att\u0101lin\u0101taj\u0101 form\u0101.
  Kl\u0101tienes un att\u0101lin\u0101to studiju formu apvieno\u0161ana deva iesp\u0113ju
  turpin\u0101t studiju procesu COVID 19 pand\u0113mijs ierobe\u017eojumu\\n\\nlaik\u0101,
