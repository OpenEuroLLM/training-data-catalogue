  atbalsta projektu un grantu projektu izstr\u0101di un uzraudz\u012bbu, pal\u012bdz\u012bbu
  uz\u0146\u0113m\u0113jiem da\u017e\u0101du ES un valsts projektu realiz\u0101cij\u0101.
  L\u012bdz\u012bgi centrs nodro\u0161in\u0101s pa\u0161vald\u012bbas un uz\u0146\u0113m\u0113ju
  kop\u012bgu projektu realiz\u0101ciju ES fondu apguvei.\\n\\nProgramm\u0101 teikts:
  \\\"Izveido sim C\u0113su novada uz\u0146\u0113m\u0113jdarb\u012bbas att\u012bst\u012bbas
  un inov\u0101ciju centru.\\\" Ko \u0161is centrs dar\u012bs, k\u0101ds tam pl\u0101nots
  finans\u0113jums, ko tas dos uz\u0146\u0113m\u0113jiem?\\n\\nTikpat svar\u012bgi
