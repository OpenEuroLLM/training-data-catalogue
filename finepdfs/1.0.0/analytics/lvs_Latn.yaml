  "\"Uzs\u0101kti b\u016bvdarbi dabas draugu rado\u0161\u0101s p\u0113tniec\u012bbas
  centr\u0101 \u201cDadzis\u201d\\n\\nVil\u0101nu novada Teven\u0101nu ciem\u0101
  (biju\u0161\u0101s me\u017eniec\u012bbas \u0113k\u0101) ir uzs\u0101kti b\u016bvdarbi
