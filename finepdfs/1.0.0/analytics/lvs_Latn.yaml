  p\u0113t\u012bjumiem. \u0100rstniec\u012bbas iest\u0101d\u0113s visvair\u0101k tiek
  praktiz\u0113ta klasisk\u0101 mas\u0101\u017ea, mas\u0101\u017ea pie da\u017e\u0101d\u0101m
  saslim\u0161an\u0101m. Studiju programmas \u201c\u0100rstniec\u012bba\u201d ar kvalifik\u0101ciju
  Neatliekam\u0101s medic\u012bnas \u0101rsta pal\u012bgs kvalifik\u0101cijas darbu
  t\u0113mu izv\u0113li 2021./2022. studiju gad\u0101 noteica ar\u012b realiz\u0113t\u0101s
  RSU Sarkana Krusta medic\u012bnas koled\u017eas zin\u0101tnisk\u0101s darb\u012bbas
  att\u012bst\u012bb\u0101. Vair\u0101ki kvalifik\u0101cijas darbi tapa izmantojot
  p\u0113t\u012bjum\u0101 ieg\u016btos datus no NMPD un stacion\u0101ru k\u0101 ar\u012b
  internetvietn\u0113s.\\n\\n- Individu\u0101lo aizsardz\u012bbas l\u012bdzek\u013cu
  izmanto\u0161ana un to ietekme darb\u0101 ar pacientiem \u0101rsta pal\u012bga profesij\u0101.\\n-
  Hospitaliz\u0101cijas laika anal\u012bze pirmsslimn\u012bcas etap\u0101 pacientiem
  ar penetr\u0113jo\u0161u abdomin\u0101lu traumu.\\n- Muguras s\u0101pju izplat\u012bba
  un to mietekm\u0113jo\u0161ie faktori Neatliekam\u0101s medic\u012bnisk\u0101s pal\u012bdz\u012bbas
  dienesta \u0101rsta pal\u012bgiem.\\n- Inf\u016bzijas terapijas strat\u0113\u0123ija
  pacientiem ar Covid \u2013 19 pneimoniju neatliekam\u0101s medic\u012bnisk\u0101s
  pal\u012bdz\u012bbas etap\u0101.\\n- Ak\u016bta koron\u0101ra sindroma izplat\u012bba
  un ietekm\u0113jo\u0161ie faktori pirmsslimn\u012bcas etap\u0101 laika period\u0101
  no 2018 \u2013 2021.gadam.\\n- Ak\u016bta koron\u0101ra sindroma ar ST un bez ST
  segmenta elev\u0101cij\u0101m iesp\u0113jam\u0101s komplik\u0101cijas pirmsslimn\u012bcas
  etap\u0101.\\n- Preeklampsijas un eklampsijas prevalence un pielietot\u0101 taktika
  pirmsslimn\u012bcas etap\u0101.\\n- Covid-19 pand\u0113mijas ietekme uz Neatliekam\u0101s
