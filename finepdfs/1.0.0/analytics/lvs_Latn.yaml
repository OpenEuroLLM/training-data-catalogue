  \u010certgonova\\nDzimtsarakstu nodalas vad\u012bt\u0101ja\"", "\"APSAIMNIEKO\u0160ANAS
  MAKSA =\\n\\nDZ\u012aVOK\u013bA \u012aPA\u0160NIEKU IKM\u0112NE\u0160A MAKS\u0100JUMS
  PAR DZ\u012aVOJAM\u0100S M\u0100JAS P\u0100RVALD\u012a\u0160ANU UN APSAIMNIEKO\u0160ANU\\n\\nK\u0100
  TO APR\u0112\u0136INA?\\n\\nP\u0101rvaldnieks izv\u0113rt\u0113 dz\u012bvojam\u0101s
  m\u0101jas UZTUR\u0112\u0160ANAI nepiecie\u0161amos izdevumus.\\n\\nApsaimnieko\u0161anas
  maksa tiek apr\u0113\u0137in\u0101ta, \u0146emot v\u0113r\u0101 PAKALPOJUMU POZ\u012aCIJAS
  un SNIEG\u0160ANAS REGULARIT\u0100TI.  Maksa tiek noteikta par vienu dz\u012bvok\u013ca
  kop\u0113j\u0101s plat\u012bbas kvadr\u0101tmetru. Dz\u012bvok\u013ca kop\u0113j\u0101
  plat\u012bba tiek noteikta saska\u0146\u0101 ar tehnisk\u0101s inventariz\u0101cijas
  lietas datiem.\\n\\nAPM\u0112RU un MAKS\u0100\u0160ANAS K\u0100RT\u012aBU nosaka
  dz\u012bvok\u013cu \u012bpa\u0161nieki\\n\\nun to main\u012bt var tikai ar dz\u012bvok\u013cu
  \u012bpa\u0161nieku kop\u012bbas l\u0113mumu.\\n\\nKO T\u0100 IETVER?\\n\\nDARBU
  un t\u0101 veik\u0161anai nepiecie\u0161am\u0101 APR\u012aKOJUMA ieg\u0101di\\n\\nkoplieto\u0161anas
  telpu kop\u0161anu\\n\\nteritorijas kop\u0161anu\\n\\nin\u017eeniertehnisko iek\u0101rtu
  apkalpo\u0161anu\\n\\nadministr\u0101ciju\\n\\np\u0101rvaldnieka pakalpojumus\\n\\nUzdodot
  p\u0101rvaldniekam p\u0101rvald\u012b\u0161anas uzdevumu, dz\u012bvojam\u0101s m\u0101jas
  \u012bpa\u0161nieka pien\u0101kums ir nodro\u0161in\u0101t \u0161\u0101 uzdevuma
  izpildei nepiecie\u0161amo \ufb01nans\u0113jumu.\\n\\nDz\u012bvojamo m\u0101ju p\u0101rvald\u012b\u0161anas
  likuma 10. panta 3. da\u013ca.\\n\\nK\u0100P\u0112C VAJAG UZKR\u0100JUMA FONDU?\\n\\nnokalpoju\u0161a
  jumta remontam vai nomai\u0146ai\\n\\nPIEM\u0112RAM...\\n\\nk\u0101p\u0146u telpas
  un fas\u0101des remontam\\n\\nnokalpoju\u0161a vai pl\u012bsu\u0161a st\u0101vvada
  nomai\u0146ai\\n\\nIesp\u0113ja VISIEM KOP\u0100 SAVLAIC\u012aGI UZKR\u0100T savas
  m\u0101jas nepiecie\u0161amajiem / neparedz\u0113tajiem remontdarbiem.\\n\\nFONDA
  LIELUMS UN T\u0100 IZMANTO\u0160ANA\\n\\nun to main\u012bt var tikai ar dz\u012bvok\u013cu
  \u012bpa\u0161nieku kop\u012bbas l\u0113mumu.\\n\\nDz\u012bvok\u013cu \u012bpa\u0161nieki
  nosaka uzkr\u0101juma fonda APM\u0112RU un savas naudas IZLIETOJUMU\\n\\nDz\u012bvok\u013cu
  \u012bpa\u0161nieki KOP\u0100 ar P\u0101rvaldnieku izv\u0113rt\u0113 m\u0101jai
  nepiecie\u0161amos uzlabojumus un izdevumus,\\n\\n\u0146emot v\u0113r\u0101 dz\u012bvok\u013cu
  \u012bpa\u0161nieku v\u0113lmes un maks\u0101tsp\u0113ju.\\n\\nUZKR\u0100JUMA FONDS
  =\\n\\nDZ\u012aVOK\u013bA \u012aPA\u0160NIEKU VEIDOTI UZKR\u0100JUMI DZ\u012aVOJAM\u0100S
  M\u0100JAS TEHNISK\u0100 ST\u0100VOK\u013bA UN TERITORIJAS UZLABO\u0160ANAI UN LABIEK\u0100RTO\u0160ANAI,
  VEICOT IKM\u0112NE\u0160A MAKS\u0100JUMUS\"", "\"Par sabiedr\u012bbas ar ierobe\u017eotu
  atbild\u012bbu \u201eValmieras \u016bdens\u201d noteiktajiem (pied\u0101v\u0101tajiem)
  siltumener\u0123ijas apg\u0101des pakalpojumu tarifiem\\n\\nSabiedrisko pakalpojumu
  regul\u0113\u0161anas komisija (turpm\u0101k \u2013 Regulators) 2018.gada 24.j\u016blij\u0101
  sa\u0146\u0113ma sabiedr\u012bbas ar ierobe\u017eotu atbild\u012bbu \u201eValmieras
  \u016bdens\u201d, vienotais re\u0123istr\u0101cijas numurs: 44103033608, juridisk\u0101
  adrese: R\u016bpniec\u012bbas iela 50, Valmiera, LV-4201 (turpm\u0101k \u2013 SIA
  \u201eValmieras \u016bdens\u201d), 2018.gada 24.j\u016blij\u0101 iesniegumu Nr.1-10/311
  ar tam pievienoto noteikto (pied\u0101v\u0101to) siltumener\u0123ijas apg\u0101des
  pakalpojumu tarifu apr\u0113\u0137inu un pamatojuma dokumentus.\\n\\nRegulators
  konstat\u0113 un secina\\n\\n1. Ener\u0123\u0113tikas likuma 6.panta 3.\u00b9da\u013ca
  noteic, ka energoapg\u0101des komersants, kas pieg\u0101d\u0101 siltumener\u0123iju
  ener\u0123ijas lietot\u0101jiem, p\u0101rdod siltumener\u0123iju tiem nepiecie\u0161amaj\u0101
  vai noteiktaj\u0101 kvalit\u0101t\u0113 un piepras\u012btaj\u0101 daudzum\u0101
  par Regulatora noteiktajiem tarifiem vai par tarifiem, ko noteicis attiec\u012bgais
  pakalpojumu sniedz\u0113js saska\u0146\u0101 ar Regulatora noteikto tarifu apr\u0113\u0137in\u0101\u0161anas
  metodiku, ja ir sa\u0146emta Regulatora atlauja, iz\u0146emot Ener\u0123\u0113tikas
  likuma 49.panta pirmaj\u0101 da\u013c\u0101 min\u0113tos gad\u012bjumus.\\n\\n2.
  Regulatora 2010.gada 14.apr\u012bla l\u0113muma Nr.1/7 \u201eSiltumener\u0123ijas
  apg\u0101des pakalpojumu tarifu apr\u0113\u0137in\u0101\u0161anas metodika\u201d
  (turpm\u0101k \u2013 Metodika) 43.\u00b3punkts noteic, ka Regulators p\u0113c savas
  iniciat\u012bvas vai komersanta piepras\u012bjuma atbilsto\u0161i Ener\u0123\u0113tikas
  likuma 6.panta 3.\u00b9dalai var dot uz noteiktu termi\u0146u atlauju komersantam
  pa\u0161am noteikt tar\u012bfus saska\u0146\u0101 ar \u0161o metodiku, ja ir main\u012bjusies
  kurin\u0101m\u0101 cena vai iepirktais siltumener\u0123ijas cena.\\n\\n3. Metodikas
  43.\u2079punkts noteic, ja komersants ir sa\u0146\u0113mis 43.\u2078punkt\u0101
  min\u0113to atlauju un komersants pie\u0146em l\u0113mumu par jauniem tarifiem,
  tad ne v\u0113l\u0101k k\u0101 30 dienas pirms jauno tarifu sp\u0113k\u0101 st\u0101\u0161an\u0101s
  br\u012b\u017ea komersants public\u0113 tar\u012bfus ofici\u0101laj\u0101 izdevum\u0101
  \u201eLatvijas V\u0113stnesis\u201d, nos\u016bta attiec\u012bgajai pa\u0161vald\u012bbai
  iedz\u012bvot\u0101ju inform\u0113\u0161anai un ievieto\u0161anai t\u0101s m\u0101jaslap\u0101
  internet\u0101 un public\u0113 sav\u0101 m\u0101jaslap\u0101 internet\u0101, ja
  t\u0101da ir, un vienlaikus iesniedz Regulatoram pamatojumu jaunajiem tarifiem,
  iesniedzot Metodikas 43.\u20791. l\u012bdz 43.\u20794.apak\u0161punkt\u0101 noteikto
  inform\u0101ciju.\\n\\n4. Saska\u0146\u0101 ar Metodikas 43.\u00b9\u2070 punktu
  Regulators 21 dienas laik\u0101 p\u0113c jauno tarifu un pamatojuma sa\u0146em\u0161anas
  izv\u0113rt\u0113 iesniegto tarifu atbilst\u012bbu \u0161ai metodikai un iesniegto
  tarifu pamatojumu, un saska\u0146\u0101 ar Metodikas 43.\u00b9\u00b9 punktu, ja
  Regulators 21 dienas laik\u0101 p\u0113c jauno tarifu un pamatojuma sa\u0146em\u0161anas
  nav pie\u0146\u0113mis l\u0113mumu par iesniegto tarifu neatbilst\u012bbu \u0161ai
  metodikai vai nav noraid\u012bjis iesniegto tarifu pamatojumu, tad tarifi st\u0101jas
  sp\u0113k\u0101 komersanta noteiktaj\u0101 laik\u0101.\\n\\n5. SIA \u201eValmieras
  \u016bdens\u201d siltumener\u0123ijas apg\u0101des pakalpojumu tarifi ir apstiprin\u0101ti
  ar Regulatora 2017.gada 26.oktobra l\u0113mumu Nr.121 \u201ePar sabiedr\u012bbas
  ar ierobe\u017eotu atbild\u012bbu \u201eValmieras \u016bdens\u201d siltumener\u0123ijas
  apg\u0101des pakalpojumu tarifiem\u201d (Latvijas V\u0113stnesis, 2017, 215.nr.)
  (turpm\u0101k \u2013 L\u0113mums Nr.121). Ar L\u0113mumu Nr.121 apstiprin\u0101to
  siltumener\u0123ijas apg\u0101des pakalpojumu tarifu veidojo\u0161aj\u0101s izmaks\u0101s
  ir iek\u013cautas iepirktais siltumener\u0123ijas izmaksas.\\n\\n6. Regulators 2017.gada
  23.novembr\u012b pie\u0146\u0113ma l\u0113mumu Nr.138 \u201ePar ties\u012bb\u0101m
  sabiedr\u012bbai ar ierobe\u017eotu atbild\u012bbu \u201eValmieras \u016bdens\u201d
  noteikt siltumener\u0123ijas apg\u0101des pakalpojumu tarifus\u201d (Latvijas V\u0113stnesis,
  2017, 236.nr.) (turpm\u0101k \u2013 Regulatora at\u013cauja), pie\u0161\u0137irot
  SIA \u201eValmieras \u016bdens\u201d ties\u012bbas pa\u0161ai noteikt siltumener\u0123ijas
  apg\u0101des pakalpojumu tarifus iepirktais siltumener\u0123ijas cenas izmai\u0146u
  gad\u012bjum\u0101.\\n\\n7. Regulators 2018.gada 21.j\u016bnij\u0101 pie\u0146\u0113ma
  l\u0113mumu Nr. 72 \u201ePar sabiedr\u012bbas ar ierobe\u017eotu atbild\u012bbu
  \u201eValmieras \u016bdens\u201d noteiktajiem (pied\u0101v\u0101tajiem) siltumener\u0123ijas
  apg\u0101des pakalpojumu tarifiem\u201d (Latvijas V\u0113stnesis, 2018, 126.nr.)
  (turpm\u0101k \u2013 L\u0113mums Nr.72).\\n\\n8. Saska\u0146\u0101 ar Metodikas
  43.\u00b2\u2079 punktu, n\u0113mot v\u0113r\u0101 Regulatora at\u013cauj\u0101 pie\u0161\u0137irt\u0101s
  ties\u012bbas noteikt tarifus, SIA \u201eValmieras \u016bdens\u201d 2018.gada 24.j\u016blij\u0101
  (2018.gada 24.j\u016blijs Nr.1-10/311) iesniedza Regulatora noteikto (pied\u0101v\u0101to)
  siltumener\u0123ijas apg\u0101des pakalpojumu tarifu pamatojumu un apr\u0113\u0137inu
  \u0161\u0101diem jaunajiem tarifiem:\\n\\n   8.1. siltumener\u0123ijas ra\u017eo\u0161anas
  tarifs 43,86 EUR/MWh;\\n   8.2. siltumener\u0123ijas p\u0101rvades un sadales tarifs
  16,95 EUR/MWh;\\n   8.3. siltumener\u0123ijas tirdzniec\u012bbas tarifs 1,27 EUR/MWh;\\n   8.4.
  siltumener\u0123ijas gala tarifs 62,08 EUR/MWh.\\n\\n9. Pazinojums par SIA \u201eValmieras
  \u016bdens\u201d noteiktajiem (pied\u0101v\u0101tajiem) siltumener\u0123ijas apg\u0101des
  pakalpojumu tarifiem ir public\u0113ts 2018.gada 24.j\u016blija ofici\u0101laj\u0101
  izdevum\u0101 \u201eLatvijas V\u0113stnesis\u201d, 145.nr. Pazinojum\u0101 SIA \u201eValmieras
  \u016bdens\u201d noteicto (pied\u0101v\u0101to) siltumener\u0123ijas apg\u0101des
