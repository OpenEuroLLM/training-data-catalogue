  e-studiju vide Moodle, savuk\u0101r k\u0101 maz\u0101k noz\u012bm\u012bgi faktori
  tika nor\u0101d\u012bti dz\u012bvesvietas att\u0101lums l\u012bdz Koled\u017eai
  un \u0113din\u0101\u0161ana.\\n\\n8. att\u0113ls \u201cAbsolventu v\u0113rt\u0113jums
