  administrat\u012bvaj\u0101 teritorij\u0101.\\n\\n**II. Nodevas maks\u0101\u0161anas
  k\u0101rt\u012bba**\\n\\n3. Nodeva tiek ieskat\u012bta pa\u0161vald\u012bbas bud\u017eeta
