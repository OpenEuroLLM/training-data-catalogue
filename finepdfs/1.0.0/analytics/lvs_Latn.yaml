  liet\u012b\u0161\u0137o p\u0113t\u012bjumu t\u0113mu sagatavo\u0161an\u0101 un ar\u012b
  turpm\u0101ka koled\u017eas zin\u0101tnisk\u0101 granta pie\u0161\u0137ir\u0161ana
  doc\u0113t\u0101ju kop\u012bgi ar studentiem \u012bstenoto p\u0113tniec\u012bbas
  darbu atbalstam.\\n\\n9. Sadarb\u012bba ar nozari un balstoties t\u0101s izteiktaj\u0101s
  vajadz\u012bb\u0101s, studiju virziena att\u012bst\u012bba ir cie\u0161i saist\u012bta
  ar t\u0101l\u0101kizgl\u012bt\u012bbas un p\u0113cdiploma profesion\u0101l\u0101s
  pilnveides kursu nodro\u0161in\u0101\u0161anu vesel\u012bbas apr\u016bpes profesion\u0101\u013ciem
  m\u016b\u017eizgl\u012bt\u012bbas ietvaros.\\n\\n8. Stud\u0113jo\u0161o sasniegumu
  v\u0113rt\u0113\u0161an\u0101 izmantoto meto\u017eu un proced\u016bru nov\u0113rt\u0113jums
  un principi\\n\\nStudiju kursu \u012bsteno\u0161an\u0101, tai skait\u0101, studiju
  p\u0101rbaud\u012bjumu veido\u0161an\u0101 un \u012bsteno\u0161an\u0101 tiek iev\u0113rota
  katra doc\u0113t\u0101ja akad\u0113misk\u0101 br\u012bv\u012bba, vienlaikus paredzot,
  ka m\u0101c\u012bbu un p\u0101rbaud\u012bjumu metod\u0113m j\u0101b\u016bt izv\u0113l\u0113t\u0101m
  atbilsto\u0161i studiju kurs\u0101 sasniedzamajiem studiju rezult\u0101tiem. Studiju
  rezult\u0101tu kontekst\u0101 b\u016btiskas ir gan caurviju zin\u0101\u0161anas,
  prasmes un kompetences k\u0101 ar\u012b attieksmes, t\u0101p\u0113c doc\u0113t\u0101ji
  papildus v\u0113rt\u0113 ar\u012b stud\u0113jo\u0161o akt\u012bvu l\u012bdzsiesaist\u012b,
  l\u012bdzdal\u012bbu un iniciat\u012bvu. It sevi\u0161\u0137i tam ir liela noz\u012bme
  digit\u0101laj\u0101 tie\u0161saistes platform\u0101s, kad doc\u0113t\u0101js var
  nov\u0113rt\u0113t akt\u012bvu l\u012bdzdal\u012bbu, nevis tikai pas\u012bvu piesl\u0113g\u0161anos,
  piem\u0113ram, kameras izsl\u0113gsanu un atie\u0161anu no lekcijas.\\n\\nStud\u0113jo\u0161o
  studiju rezult\u0101tu nov\u0113rt\u0113\u0161anas metodes un studiju kursa apguves
  nov\u0113rt\u0113\u0161anas krit\u0113riji ir noteikti studiju kursu aprakstos,
  kuri pirms katra semestra tiek ievietoti e-studiju vid\u0113 Moodle.\\n\\nP\u0101rbaud\u012bjumu
  v\u0113rt\u0113\u0161anai izmanto 10 (desmit) bal\u013cu sist\u0113mu, kur pozit\u012bvs
  v\u0113rt\u0113jums \u201c4\u201d balles gandr\u012bz viduv\u0113ji ieg\u016bstams
  pie 55% \u2013 59% apguves. Studiju kursu k\u0101rt\u0113jo p\u0101rbaud\u012bjumu
  v\u0113rt\u0113jumi, gan nosl\u0113gumu p\u0101rbaud\u012bjumu v\u0113rt\u0113jumi
  ir pieejami katram stud\u0113jo\u0161ajam tikai savi v\u0101r\u0101 Moodle studenta
  profi\u013c\u0101. Valsts p\u0101rbaud\u012bjuma v\u0113rt\u0113\u0161anas krit\u0113rijus
  nosaka Valsts p\u0101rbaud\u012bjuma nolikums.\\n\\nSitu\u0101ciju izsp\u0113le
  simul\u0113t\u0101 vid\u0113. Koled\u017eas doc\u0113t\u0101ji tiek aicin\u0101ti
  akt\u012bvi izmantot Koled\u017eas resursus - simul\u0113t\u0101svides telpu, lai
  veidotu da\u017eadas situ\u0101ciju izsp\u0113les. Koled\u017eas doc\u0113t\u0101jiem
  ir biju\u0161as vair\u0101kas teor\u0113tiskas un praktiskas m\u0101c\u012bbas,
  kuru laik\u0101 ar\u012b doc\u0113t\u0101ji rakst\u012bja scen\u0101riju. Scen\u0101rijiem
  ir izveidota vienota glab\u0101\u0161anas vieta e-studiju vid\u0113 Moodle sada\u013c\u0101,
  ar nol\u016bku, lai doc\u0113t\u0101ji tiem \u0113rti piek\u013c\u016btu un nepiecie\u0161am\u012bbas
  gad\u012bjum\u0101 var\u0113tu ar \u0161iem scen\u0101rijiem apmain\u012bties un
  izmantot viens otra, protams, ja studiju kursa saturu to pielauj. Scen\u0101rijiem
  Koled\u017e\u0101 ir ieviesta vienota forma.\\n\\nKoled\u017eas metodisk\u0101 noda\u013ca
  sadarb\u012bb\u0101 ar doc\u0113t\u0101jiem ir uzs\u0101kusi darbu, lai iedro\u0161in\u0101tu
  doc\u0113t\u0101jus izmantot jaunu p\u0101rbaudes metodi studentu starp\u0101, proti,
  studentu savstarpejais v\u0113rt\u0113jums.\\n\\nLai rosin\u0101tu studentu liel\u0101ku
  iesaisti pa\u0161v\u0113rt\u0113jum\u0101 un kritiski izv\u0113rt\u0113tu pa\u0161u
  zin\u0101\u0161anu un prasmju limeni, Koled\u017e\u0101 jau kop\u0161 2018. gada
  akt\u012bvi notiek ar\u012b form\u0101t\u012bvas v\u0113rt\u0113\u0161anas ize\u017e\u012bmes,
  paral\u0113li summat\u012bvajai. Tie\u0161saistes digit\u0101lie r\u012bki Koled\u017e\u0101
  kalpo k\u0101 lielisks veids, k\u0101 atbilsto\u0161i Studiju rezult\u0101tu v\u0113rt\u0113\u0161anas
  nolikumam v\u0113rt\u0113t stud\u0113jo\u0161os ne\\n\\ntikai summat\u012bvi, bet
  ar\u012b format\u012bvi. 2019. gad\u0101 rudens semestr\u012b Metodisk\u0101 noda\u013ca
  aizs\u0101ka organiz\u0113t regul\u0101r\u0101s m\u0101c\u012bb\u0101s doc\u0113tajiem
  par digit\u0101liem r\u012bkiem, kas veicin\u0101tu interkat\u012bv\u0101ku studiju
  procesu, tika skaidrotas digit\u0101lo r\u012bku priek\u0161roc\u012bbas. M\u0101c\u012bbu
  procesa laik\u0101 tika apl\u016bkoti sekojo\u0161i r\u012bki: Testmoz.com; Mentimeter.com;
  Kahoot.com; Plickers.com. Doc\u0113t\u0101ji \u013coti nov\u0113rt\u0113ja tie\u0161i
  iesp\u0113ju pa\u0161iem me\u0123in\u0101t praktiz\u0113t un izsp\u0113l\u0113t
  da\u017e\u0101dus jaut\u0101juma variantus gan no doc\u0113t\u0101ja, gan stud\u0113jo\u0161\u0101
  puses. Kop\u0101 \u0161aj\u0101s m\u0101c\u012bb\u0101s kop\u0161 2019. gada ir
