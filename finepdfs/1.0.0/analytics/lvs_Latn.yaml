sample: '["\"4\\n\\nieVAds\\n\\nl\\nP\u0101rgaujas\\nnovads\\nl\\nL\u012bgatnes\\nnovads\\nl\\nAmatas\\nnovads\\nl\\nVecpiebalgas\\nnovads\\nl\\nJaunpiebalgas\\nnovads\\nl\\nC\u0113su\\nnovads\\nl\\nPrieku\u013cu\\nnovads\\n\\nun
  lielais partiju skaits liedz sar\u012bkot pilnv\u0113rt\u012bgas debates kl\u0101tien\u0113,
  t\u0101p\u0113c pav\u0113rt\u0113sim programm\u0101s teikto, k\u0101 ar\u012b katrai
  partijai rakstiski uzdosim pa vienam jaut\u0101jumam, dodot iesp\u0113ju atbild\u0113t
  rakstiski, nosakot konkr\u0113tu atbildes apjomu, k\u0101 ar\u012b termi\u0146u,
  l\u012bdz kuram atbildes iesniedzamas.\\n\\nJau p\u0113c trim ned\u0113\u013c\u0101m
  balssties\u012bgie vis\u0101 valst\u012b, iz\u0146emot galvaspils\u0113tu, dosies
  uz v\u0113l\u0113\u0161anu iecirk\u0146iem, lai iev\u0113l\u0113tu pa\u0161vald\u012bbu
  deput\u0101tus, kuri lems novadu likteni n\u0101kamajos \u010detros gados. \u0160\u012bs
  v\u0113l\u0113\u0161anas \u012bpa\u0161as ar to, ka daudzviet t\u0101s notiek jauno
  novadu teritorij\u0101s, ar\u012b C\u0113su novad\u0101, ko veidos septi\u0146i
  eso\u0161ie novadi: Amatas, C\u0113su, Jaunpiebalgas, L\u012bgatnes, P\u0101rgaujas,
  Prieku\u013cu un Vecpiebalgas. Jau rakst\u012bts, ka uz 19 deput\u0101tu viet\u0101m
  pretend\u0113 191 deput\u0101ts no desmit sarakstiem. \\\"Druva\\\" turpm\u0101kaj\u0101s
  trij\u0101s ned\u0113\u013c\u0101s ieskat\u012bsies partiju programm\u0101s, deput\u0101tu
  kandid\u0101tu sol\u012bjumos, analiz\u0113jot sol\u012bjumus atsevi\u0161\u0137\u0101s
  nozar\u0113s: uz\u0146\u0113m\u0113jdarb\u012bb\u0101, izgl\u012bt\u012bb\u0101,
  kult\u016br\u0101, soci\u0101laj\u0101 un vesel\u012bbas jom\u0101, p\u0101rvald\u012bb\u0101.
  Pand\u0113mijas ierobe\u017eojumi\\n\\nUz\u0146\u0113m\u0113jdarb\u012bbai programm\u0101s
  at\u0161\u0137ir\u012bga vieta\\n\\nzin\u0101ma atzi\u0146a, ka uz\u0146\u0113m\u0113jdarb\u012bba
  ir t\u0101, kas nodro\u0161ina pa\u0161vald\u012bbas asinsriti, jo pa\u0161vald\u012bbas
  bud\u017eeta ien\u0101kumu b\u016btisku da\u013cu veido teritorij\u0101 deklar\u0113to
  iedz\u012bvot\u0101ju maks\u0101tais iedz\u012bvot\u0101ju ien\u0101kuma nodoklis.\\n\\njam
  pla\u0161\u0101k, visi punkti tom\u0113r sais t\u012bti ar uz\u0146\u0113m\u0113jdarb\u012bbu
  un jau min\u0113to Iedz\u012bvot\u0101ju ien\u0101kumu nodokli, jo t\u0101 bud\u017eet\u0101
  b\u016bs vair\u0101k, jo lab\u0101k\u0101 kvalit\u0101t\u0113 var\u0113s nodro\u0161in\u0101t
  ar\u012b citas autonom\u0101s funkcijas. Darbavietu esam\u012bba ar\u012b neveicin\u0101s
  iedz\u012bvot\u0101ju aizbrauk\u0161anu, bet tie\u0161i pret\u0113jo procesu \u2013
  cilv\u0113ku p\u0101rcel\u0161anos uz \u0161o pa\u0161vald\u012bbu.\\n\\nT\u0101tad,
  jo vair\u0101k novad\u0101 deklar\u0113t\u0101jiem iedz\u012bvot\u0101jiem b\u016bs
  darbavietu, jo lab\u0101k apmaks\u0101tas, jo vair\u0101k naudas ien\u0101ks pa\u0161vald\u012bbu
  bud\u017eet\u0101. L\u012bdz ar to pa\u0161vald\u012bb\u0101m j\u0101b\u016bt maksim\u0101li
  ieinteres\u0113t\u0101m uz\u0146\u0113m\u0113jdarb\u012bbas veicin\u0101\u0161an\u0101,
  cik nu tas vi\u0146u sp\u0113kos un iesp\u0113j\u0101s, ko at\u013cauj likumdev\u0113js.
  Likum\u0101 par pa\u0161vald\u012bb\u0101m m\u0101s, kas rodamas Centr\u0101l\u0101s
  v\u0113l\u0113\u0161anu komisijas m\u0101jaslap\u0101, redzam, ka ar\u012b taj\u0101s
  redz\u0113jums par uz\u0146\u0113m\u0113jdarb\u012bbu radis at\u0161\u0137ir\u012bgu
  vietu un apjomu. Nacion\u0101l\u0101 apvien\u012bba \\\"Visu\\n\\nJa p\u0101rl\u016bkojam
  visu septi\u0146u novadu \u0161\u012b gada bud\u017eetus, kop\u0113j\u0101 prognoze
  Iedz\u012bvot\u0101ju ien\u0101kuma nodoklim, ko pa\u0161vald\u012bbas sa\u0146ems
  \u0161ogad, ir gandr\u012bz 23 miljoni eiro. Iel\u016bkojoties partiju program-
  pant\u0101, kur min\u0113tas vietvaru autonom\u0101s funkcijas, desmitaj\u0101 viet\u0101
  ir - sekm\u0113t saimniecisko darb\u012bbu attiec\u012bgaj\u0101 administrat\u012bvaj\u0101
  teritorij\u0101, r\u016bp\u0113ties par bezdarba samazin\u0101\u0161anu. Ja apak\u0161punktu
  sec\u012bbu v\u0113rt\u0113jam k\u0101 priorit\u0101\u0161u sec\u012bbu, tad uz\u0146\u0113m\u0113jdarb\u012bba
  nav s\u0101kum\u0101, svar\u012bg\u0101k ir g\u0101d\u0101t par komun\u0101lajiem  pakalpojumiem,
  teritorijas labiek\u0101rto\u0161anu un sanit\u0101ro t\u012br\u012bbu, izgl\u012bt\u012bbu,
  kult\u016bru, vesel\u012bbas apr\u016bpes pieejam\u012bbu, soci\u0101lo pal\u012bdz\u012bbu.
  Tom\u0113r, ja dom\u0101-\\n\\nLatvijai!\\\"- \\\"T\u0113vzemei un Br\u012bv\u012bbai/LNNK\\\",
  \\\"Latvijas Zemnieku savien\u012bba\\\" un Latvijas Za\u013c\u0101 partija sav\u0101s
  programm\u0101s uz\u0146\u0113m\u0113jdarb\u012bbu min\u0113ju\u0161as s\u0101kum\u0101,
  Vidzemes partija to likusi otraj\u0101 viet\u0101, Jaun\u0101 Vienot\u012bba un
  Jaun\u0101 Konservat\u012bv\u0101 partija uz\u0146\u0113m\u0113jdarb\u012bbas sol\u012bjumiem
  atv\u0113l\u0113ju\u0161as tre\u0161o vietu, politisk\u0101 partija \\\"Latvijas
  Re\u0123ionu Apvien\u012bba\\\" un \\\"Kust\u012bba \\\"PAR!\\\"\\\", \\\"Progre
  s\u012bvie\\\" uzreiz aiz trijnieka, bet \\\"Latvijas att\u012bst\u012bbai\\\" programmas
  beig\u0101s tam atv\u0113l\u0113ju\u0161as vair\u0101kas sa da\u013cas. q\\n\\nKas
  sol\u012bjumu maisi\u0146\u0101\\n\\nkalpojumus. Nepiecie\u0161am\u012bbu nodro\u0161in\u0101t
  lauku konsultantu pieejam\u012bbu, veicinot iedz\u012bvot\u0101ju inform\u0113t\u012bbu
  un izgl\u012bto\u0161anu, min ar\u012b LA sav\u0101 programm\u0101. Te j\u0101piebilst,
  ka v\u0113l nesen pa\u0161vald\u012bb\u0101s bija lauku att\u012bst\u012bbas konsultanti,
  kuru darbu finans\u0113ja valsts. \u0160obr\u012bd finans\u0113jums beidzies,  cik
  zin\u0101ms, tikai p\u0101ris pa\u0161vald\u012bbas atv\u0113l\u0113ju\u0161as nelielus
  l\u012bdzek\u013cus, lai kaut nedaudz \u0161is pakalpojums b\u016btu pieejams. Ta\u010du
  vienk\u0101r\u0161as konsult\u0101cijas bez maksas pieejamas Latvijas Lauku konsult\u0101ciju
  un izgl\u012bt\u012bbas centra C\u0113su biroj\u0101.\\n\\nbas lauci\u0146\u0101
  sola Nacion\u0101l\u0101 apvien\u012bba \\\"Visu Latvijai!\\\"- \\\"T\u0113vze mei
  un Br\u012bv\u012bbai/ LNNK\\\" (NA), Jaun\u0101 Vienot\u012bba (JV), Vidzemes partija
  (VP), Jaun\u0101 konservat\u012bv\u0101 partija (JKP), \\\"Latvijas att\u012bst\u012bbai\\\"
  (LA), Latvijas Zemnieku savien\u012bba (LZS), Latvijas Re\u0123ionu Apvien\u012bba
  (LRA), Latvijas Za\u013c\u0101 partija (LZP), \\\"Kust\u012bba \\\"PAR!\\\"\\\",
  \\\"Progres\u012bvie\\\" (PAR).\\n\\nKopum\u0101 j\u0101teic, partiju programm\u0101s
  ir \u013coti maz konkr\u0113t\u012bbas, nav min\u0113ti konkr\u0113ti projekti,
  konkr\u0113ti darbi, ko ap\u0146emtos veikt noteikt\u0101 ciem\u0101, pagast\u0101,
  p\u0101rsvar\u0101 ir v\u0101rdi:  atbalst\u012bsim, turpin\u0101sim, veicin\u0101sim.
  Te j\u0101piemin, ka ar\u012b programmas rakst\u012btas at\u0161\u0137ir\u012bgi.
  Vairums partiju t\u0101s struktur\u0113ju\u0161as p\u0101rskat\u0101mi pa jom\u0101m,
  nozar\u0113m, da\u017e\u0101m, lai saprastu, kas tiek sol\u012bts, piem\u0113ram,
  uz\u0146\u0113m\u0113jdarb\u012bb\u0101,  j\u0101mekl\u0113 pa teikumam vis\u0101
  tekst\u0101. Savuk\u0101rt Jaun\u0101s Saska\u0146as  programma ir tikai viena teikuma
  garum\u0101, t\u0101p\u0113c vi\u0146u sol\u012bjumus gr\u016bti izv\u0113rt\u0113t.
  Paraudz\u012bsim, ko uz\u0146\u0113m\u0113jdarb\u012b-\\n\\nJKP  sola atbalst\u012bt
  maz\u0101s un vid\u0113j\u0101s zemnieku saimniec\u012bbas un uz\u0146\u0113m\u0113jdarb\u012bbu
  laukos. Atbalst\u012bt novada un re\u0123iona lauksaimniekus, amatniekus, m\u0101jra\u017eot\u0101jus
  savas produkcijas realiz\u0101cijai novada lauku labuma tirdzi\u0146os.\\n\\nLauksaimniec\u012bba\\n\\nLRA
  programm\u0101 \u0161\u012b joma visp\u0101r nav min\u0113ta. Nedaudz p\u0101rsteidza,
  ka LZS programm\u0101 nozare piemin\u0113ta it k\u0101 gar\u0101mejot, lai gan partijas
  nosaukums vedina dom\u0101t par lielu uzsvaru tie\u0161i lauksaimniekiem.  LZS vien
  nor\u0101da, ka pa\u0161vald\u012bbai j\u0101veicina, lai uz\u0146\u0113m\u0113jiem
  - m\u0101jra\u017eot\u0101jiem, amatniekiem, lauksaimniekiem, ra\u017eo\u0161anas
  uz\u0146\u0113mumiem - b\u016btu interese jaunaj\u0101 C\u0113su novad\u0101 str\u0101d\u0101t
  un pilnveidoties. Ar\u012b  NA programm\u0101 las\u0101ma l\u012bdz\u012bga fr\u0101ze
  \\\"turpin\u0101sim novada infrastrukt\u016bras att\u012bst\u012bbu, radot labv\u0113l\u012bgu
  vidi uz\u0146\u0113m\u0113jdarb\u012bbai un lauksaimniec\u012bbai\\\" , un ar to
  \u0161\u012b joma ir izsmelta. Vienk\u0101r\u0161u ce\u013cu g\u0101jusi ar\u012b
  JV, rakstot: \\\"Turpin\u0101sim iznom\u0101t novada lauksaimniec\u012bbas zemes
  lauksaimniecisk\u0101s darb\u012bbas veic\u0113jiem.\\\"\\n\\nProtams, ar programm\u0101s
  sol\u012bto atbalstu uz\u0146\u0113m\u0113jiem var saprast ar\u012b k\u0101 atbalstu
  lauksaimniekiem, kas ir viena no uz\u0146\u0113m\u0113jdarb\u012bbas nozar\u0113m.
  Bet, \u0146emot v\u0113r\u0101, ka C\u0113su novads b\u016bs liels, kur\u0101 daudz
  lauksaimniec\u012bbas zemes, tad \u0161\u012b joma ekonomik\u0101 ie\u0146ems b\u016btisku
  vietu. K\u0101 jau nesen rakst\u012bj\u0101m, kop\u0101 septi\u0146os novados re\u0123istr\u0113tas
  1368 zemnieku saimniec\u012bbas, iesp\u0113jams, \u0161aj\u0101 nozar\u0113 darbojas
  ar\u012b k\u0101ds no daudzajiem SIA, vai k\u0101da cita statusa juridisk\u0101s
  personas. T\u0101p\u0113c iel\u016bkoj\u0101mies, ko partijas sola tie\u0161i lauksaimniekiem.
  Paties\u012bb\u0101 sol\u012bjumu nav daudz.\\n\\nTr\u012bs partijas akcent\u0113
  biolo\u0123isko lauksaimniec\u012bbu. LA sola sekm\u0113t videi draudz\u012bgas
  un biolo\u0123isk\u0101s lauksaimniec\u012bbas att\u012bst\u012bbu. LZP k\u0101
  priorit\u0101ti izvirza lauksaimniekus, kuri audz\u0113, ra\u017eo un p\u0101rstr\u0101d\u0101
  biolo\u0123iski t\u012bru produkciju, uz\u0146\u0113mumus, kuru uz\u0146\u0113m\u0113jdarb\u012bba
  saist\u012bta ar vides daudzveid\u012bbas saglab\u0101\u0161anu. Ar\u012b PAR sola
  \u012bpa\u0161u atbalstu dabai draudz\u012bgiem lauksaimniekiem, biolo\u0123iskajiem
  ra\u017eot\u0101jiem, viet\u0113jiem uz\u0146\u0113m\u0113jiem un m\u0101jra\u017eot\u0101jiem.
  VP programm\u0101 min bezmaksas lauku att\u012bst\u012bbas konsultanta pa-\\n\\nAtbalsts
  jaunajiem\\n\\nAr\u012b LA sola atbalst\u012bt lauksaimniekus, viet\u0113jos ra\u017eot\u0101jus
  un p\u0101rtikas \u012bs\u0101s pieg\u0101des \u0137\u0113des izveidi. Lai b\u016btu,
  ko atbalst\u012bt, j\u0101dom\u0101 ar\u012b par to, kas lauksaimniec\u012bb\u0101
  str\u0101d\u0101s, un te tikai LA min, ka sniegs atbalstu ar laukiem saist\u012btu
  profesiju apguvei, sadarbojoties ar Vidzemes Tehnolo\u0123iju un dizaina tehnikumu.\\n\\nK\u0101du
  iedro\u0161in\u0101jumu partiju programm\u0101s var atrast tie, kuri dom\u0101 par
  biznesa s\u0101k\u0161anu jaunaj\u0101 C\u0113su novad\u0101 vai tikko to s\u0101ku\u0161i?\\n\\nJV
  sola atbalst\u012bt eso\u0161os un jaunos novada uz\u0146\u0113m\u0113jus, moderniz\u0113jot
  infrastrukt\u016bru, nodro\u0161inot nodok\u013cu/nodevu atlaides, sniedzot konsultat\u012bvu
  atbalstu. Vi\u0146i ar\u012b gatavi nodro\u0161in\u0101t finansi\u0101lu un konsultat\u012bvu
  atbalstu eso\u0161ajiem un jaunajiem uz\u0146\u0113m\u0113jiem.\\n\\nTie\u0161i
  par atbalstu jaunajiem uz\u0146\u0113m\u0113jiem run\u0101 vien da\u017ei politiskie
  sp\u0113ki. LRA sola nodro\u0161in\u0101t pa\u0161vald\u012bbas grantu konkursus
  jaunu uz\u0146\u0113m\u0113ju atbalstam, k\u0101 ar\u012b atbalst\u012bt  biznesa
  inkubatora aktivit\u0101tes. V\u0113lme veicin\u0101t eso\u0161o biznesa inkubatoru
  piesaisti saskat\u0101ma ar\u012b NA programm\u0101. JKP sola rast atbalsta meh\u0101nismus
  jaunajiem uz\u0146\u0113m\u0113jiem.\\n\\nPAR sav\u0101 programm\u0101 raksta par
  pieejamiem uz\u0146\u0113m\u0113jdarb\u012bbas konsultantiem un grantu programm\u0101m
  uz\u0146\u0113m\u0113jdarb\u012bbas uzs\u0101k\u0161anai un inov\u0101cij\u0101m.\\n\\nkonkursus
  uz\u0146\u0113m\u0113ju atbalstam. Visnopietn\u0101kais pieteikums ir LZP, kas raksta,
  ka nepiecie\u0161ams izveidot pa\u0161vald\u012bbas grantu finans\u0113juma programmu
  mazo un vid\u0113jo uz\u0146\u0113m\u0113ju atbalstam \\\"DARI C\u0112SU NOVAD\u0100\\\",
  novirzot \u0161ai programmai vismaz 100 000 eiro gad\u0101.\\n\\nLai s\u0101ktu
  biznesu, vajadz\u012bga ne tikai v\u0113lme, starta kapit\u0101ls, bet ar\u012b
  vieta, kur to dar\u012bt. VP  sola teritoriju revitaliz\u0101ciju, piel\u0101gojot
  t\u0101s uz\u0146\u0113m\u0113jdarb\u012bbas veik\u0161anai. JV ap\u0146emas turpin\u0101t
  eso\u0161o r\u016bpniecisko teritoriju sak\u0101rto\u0161anu un jaunu att\u012bst\u012bbu.
  Partijas sola ar\u012b da\u017e\u0101dus grantu\\n\\nVP sola grantu programmu \\\"Rad\u012bts
  C\u0113su novad\u0101\\\"  atbalstam dal\u012bbai starptautisk\u0101s izst\u0101d\u0113s,
  k\u0101 ar\u012b atbalstu novada produkcijas m\u0101rketinga pas\u0101kumiem. LA
  ap\u0146emas organiz\u0113t konkursus uz\u0146\u0113m\u0113ju atbalstam un iedz\u012bvot\u0101ju
  iniciat\u012bv\u0101m.\\n\\nNodok\u013ci\\n\\nVien\u012bg\u0101 partija, kas skaidri
  nor\u0101da uz Eiropas Savien\u012bbas (ES) fondu piesaisti \u0161ai jomai, ir LRA,
  kas sola iesaist\u012bties ES fondu l\u012bdzek\u013cu apguv\u0113 un invest\u012bciju
  piesaist\u0113 uz\u0146\u0113m\u0113jdarb\u012bbas att\u012bst\u012bbai un za\u013co
  inov\u0101ciju ievie\u0161an\u0101. PAR v\u0113las izveidot C\u0113su novada invest\u012bciju
  a\u0123ent\u016bru, neko s\u012bk\u0101k gan nepaskaidrojot.\\n\\nPa\u0161vald\u012bbas
  zi\u0146\u0101 ir iekas\u0113t Nekustam\u0101 \u012bpa\u0161uma nodokli, un t\u0101
  var ar\u012b main\u012bt likmi, cik procentu no \u0161\u012b nodok\u013ca  uz\u0146\u0113m\u0113jam
  maks\u0101t. Par atlaid\u0113m un likmes samazin\u0101jumu raksta piecas partijas.  NA
  sola samazin\u0101t nekustam\u0101 \u012bpa\u0161uma nodokli iedz\u012bvot\u0101jiem
  un uz\u0146\u0113m\u0113jiem, kas rada jaunas darbavietas, labiek\u0101rto sabiedriski
  izmantojamas teritorijas, atjauno \u012bpa\u0161umus ar kult\u016brv\u0113sturisku
  noz\u012bmi. JV pied\u0101v\u0101s nekustam\u0101 \u012bpa\u0161uma nodok\u013ca
  un nodevu atlaides uz\u0146\u0113m\u0113jiem. VP sola \u012bpa\u0161u programmu
  pa\u0161vald\u012bbas  nodok\u013cu atlaid\u0113m, \u012bpa\u0161i \u2013 jaunu
  darbavietu rad\u012b\u0161anai, lauku teritorij\u0101m, uz\u0146\u0113m\u0113jdarb\u012bbas
  uzs\u0101c\u0113jiem. LA gatavi sniegt uz\u0146\u0113m\u0113jdarb\u012bbas atbalstu
  nekustam\u0101 \u012bpa\u0161uma nodok\u013ca atvieglojumiem un industri\u0101lo
  teritoriju att\u012bst\u012b\u0161anai. LZP sola pie\u0161\u0137irt nekustam\u0101
  \u012bpa\u0161uma nodok\u013ca atvieglojumus uz\u0146\u0113m\u0113jiem proporcion\u0101li
  nomaks\u0101t\u0101 Iedz\u012bvo t\u0101ju ien\u0101kuma nodok\u013ca palielin\u0101jumam.\\n\\nJaunais
  C\u0113su novads b\u016bs teritorija, kur liela noz\u012bme t\u016brismam, kas ar\u012b
  ir viena no uz\u0146\u0113m\u0113jdarb\u012bbas sada\u013c\u0101m, t\u0101p\u0113c
  v\u0113l par to, kas tiek sol\u012bts t\u016brism\u0101 str\u0101d\u0101jo\u0161o
  uz\u0146\u0113m\u0113ju  atbalstam.  JKP sola r\u016bp\u0113ties par biju\u0161o
  dzelzce\u013ca l\u012bniju Ieri\u0137i-Gulbene k\u0101 za\u013c\u0101s dom\u0101\u0161anas
  piem\u0113ru, atbalstot Ieri\u0137u dzelzce\u013ca stacijas atjauno\u0161anu k\u0101
  izgl\u012bt\u012bbas, izzi\u0146as un mobilit\u0101tes centru, vienlaikus veicinot
  uz\u0146\u0113m\u0113jdarb\u012bbu vis\u0101 za\u013c\u0101 dzelzce\u013ca posm\u0101.\\n\\nT\u016brisms\\n\\nLZS
  ap\u0146\u0113m\u012bbas pilna att\u012bst\u012bt kult\u016bras un t\u016brisma
  nozari gudri un inovat\u012bvi, lai novads b\u016btu gan atpaz\u012bstams kult\u016bras
  nori\u0161u centrs, gan iecien\u012bts t\u016brisma galam\u0113r\u0137is un ieguv\u0113ji
  no t\u0101 b\u016btu visi. LRA gatavi veicin\u0101t C\u0113su novada k\u0101 t\u016brisma
  galam\u0113r\u0137a att\u012bst\u012bbu, atbalstot jaunas iniciat\u012bvas, tradicion\u0101l\u0101s
  amatniec\u012bbas un \u0113din\u0101\u0161anas uz\u0146\u0113mumu kl\u0101steru
  darb\u012bbu, tradicion\u0101lo pas\u0101kumu norisi. LZP uzskata, ka  nepiecie\u0161ams
  papla\u0161in\u0101t t\u016brisma pied\u0101v\u0101jumu, ietverot visu novada teritoriju
  un dodot iesp\u0113ju viet\u0113jiem iedz\u012bvot\u0101jiem nodarboties ar t\u016brisma
  uz\u0146\u0113m\u0113jdarb\u012bbu un g\u016bt labumu no t\u0101s. Pie t\u016brisma
  uz\u0146\u0113m\u0113jdarb\u012bbas, iesp\u0113jams, minams ar\u012b VP sol\u012btais
  atbalsts kult\u016brv\u0113sturisk\u0101 mantojuma iek\u013cau\u0161anai saimnieciskaj\u0101
  darb\u012bb\u0101. Divi politiskie sp\u0113ki t\u016brismu min tikai ar vienu teikumu.
  LA sola turpin\u0101t att\u012bst\u012bt t\u016brisma nozari, bet JV - att\u012bst\u012bt
  eso\u0161os un jaunus t\u016brisma galam\u0113r\u0137us. q\\n\\nLappusi sagatavojis
  J\u0101nis GAbr\u0101ns\\n\\nProjektu finans\u0113 Mediju atbalsta fonds no Latvijas
  valsts bud\u017eeta l\u012bdzek\u013ciem\\n\\nTika noteikts laiks, l\u012bdz kuram
  atbildes j\u0101iesniedz. T\u0101s public\u0113tas iesnieg\u0161anas sec\u012bb\u0101.
  Las\u012bt\u0101jiem j\u0101v\u0113rt\u0113, cik prec\u012bzi politi\u0137i atbild\u0113ju\u0161i.\\n\\nKatrai
  partijai nos\u016bt\u012bj\u0101m vienu jaut\u0101jumu par uz\u0146\u0113m\u0113jdarb\u012bbu,  par
