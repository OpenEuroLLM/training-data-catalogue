  ekip\u0101\u017eai \u0101trumposmu Neste Oil SS1 / SS5 kopv\u0113rt\u0113jum\u0101\\n\\n**OPTIBET**\\n\\nFastest
  Latvian crew in the total of Sporta b\u0101rs Optibet SS6 / SS9\\n\\n\u0100tr\u0101kajai
  Latvijas ekip\u0101\u017eai \u0101trumposmu Sporta b\u0101rs Optibet SS6 / SS9 kopv\u0113rt\u0113jum\u0101\\n\\n**BTA**\\n\\nFastest
