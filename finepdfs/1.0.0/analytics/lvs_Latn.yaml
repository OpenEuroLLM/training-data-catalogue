  J\u016bsupr\u0101t, ir Koled\u017eas absolventu izredzes konkur\u0113t darba tirg\u016b?\\n\\n|
  Atbilde     | Skaitlis | %    |\\n|-------------|----------|------|\\n| \u013boti
  labi   | 5        | 29.4%|\\n| Labi        | 11       | 64.7%|\\n| Apmierino\u0161i
  | 1        | 5.9% |\\n| Slikti      | 0        | 0%   |\\n| \u013boti slikti | 0        |
  0%   |\\n\\n13. Studiju programma \u201c\u0100rstniecisk\u0101 mas\u0101\u017ea\u201d\\n\\nStudiju
  programmas raksturojo\u0161ie parametri\\n\\n| Studiju programmas nosaukums | \u0100rstniecisk\u0101
  mas\u0101\u017ea |\\n|------------------------------|---------------------|\\n|
  Studiju programmas kods saska\u0146\u0101 ar Latvijas izgl\u012bt\u012bbas klasifik\u0101ciju
  | 41 722 |\\n| Studiju programmas veids un l\u012bmenis | \u012as\u0101 cikla profesion\u0101l\u0101
  augst\u0101k\u0101 izgl\u012bt\u012bba |\\n| Ieg\u016bstamais kvalifik\u0101cijas
  l\u012bmenis (EKI) | 5 |\\n| Profesijas kods profesiju klasifikator\u0101 | 3255
  08 |\\n| Studiju programmas apjoms (KP) | 80 KP/ 120 ECTS |\\n| \u012asteno\u0161anas
  forma, veids, ilgums | 2 gadi. pilna laika kl\u0101tien\u0113 |\\n| \u012asteno\u0161anas
  vieta | 1. R\u012bgas Stradi\u0146a Universit\u0101tes Liep\u0101jas fili\u0101le
  R\u012bnku iela 24/26, Liep\u0101ja, LV-3405 2. R\u012bgas Stradi\u0146a Universit\u0101tes
  a\u0123ent\u016bra \u201eRSU Sarkan\u0101 Krusta medic\u012bnas koled\u017ea\u201d
  J\u0101\u0146a Asara 5, R\u012bga, LV-1009 |\\n| Studiju programmas direktore |
  Dr.paed., Una Veseta (RSU SKMK) doc. Dina Berloviene (RSU Liep\u0101jas fili\u0101le)
  |\\n\\nStudiju programmas \\\"\u0100rstniecisk\u0101 mas\u0101\u017ea\\\" m\u0113r\u0137is
  izriet no Latvijas kvalifik\u0101ciju ietvarstrukt\u016bra (LKI) 5. l\u012bmena,
  kur ir formul\u0113tas zin\u0101\u0161anas prasmes un kompetences atbilsto\u0161i
  5. l\u012bmenim LKI, kas atbilst \u0161ai cikla profesion\u0101lajam augst\u0101kajam
  izgl\u012bt\u012bbas l\u012bmenim. \u0160\u012bs kompetences tiek\u0146emtas v\u0113r\u0101
  izveidojot profesiju standartu, kuru kompeteces tiek sasaist\u012btas ar LKI kompetenc\u0113m.
  Pamatojoties uz profesiju standartu, tiek izstr\u0101d\u0101ta studiju programma,
  nosakot programmas m\u0113r\u0137i, uzdevumus un sasniedzamos rezult\u0101tus.\\n\\nStudiju
  programmas pamatsast\u0101vda\u013cas 2021./2022. akad\u0113miskaj\u0101 gad\u0101\\n\\n|
  Visp\u0101rizgl\u012btojo\u0161ie studiju kursi | 20 KP |\\n|---------------------------------|-------|\\n|
  Nozares studiju kursi           | 32 KP |\\n| Prakse                           |
  16 KP |\\n| Kvalifik\u0101cijas darbs             | 8 KP  |\\n| Profesion\u0101l\u0101s
  pilnveides kurss   | 4 KP  |\\n\\nApstiprinot jaunu profesijas standartu tiek izv\u0113rt\u0113ts
  studiju programmas satus. Profesion\u0101las izgl\u012bt\u012bbas un nodarbin\u0101t\u012bbas
  tr\u012bspus\u0113j\u0101s sadarb\u012bbas apak\u0161padomes 2021. gada 10. febru\u0101ra
  s\u0113d\u0113, protokols Nr. tika apstiprin\u0101ts jauns Masiera profesijas standarts.\\n\\nStudiju
  programm\u0101 \\\"\u0100rstniecisk\u0101 mas\u0101\u017ea\\\" 2021/2022. studiju
  gad\u0101 tika pl\u0101notas izmai\u0146as studiju programmas satur\u0101 n\u0101ko\u0161ajam
  studiju gadam balstoties uz jauno profesijas standartu. Jaunaj\u0101 profesijas
  standart\u0101 ir piev\u0113rsta daudz liel\u0101ka uzman\u012bba inform\u0101cijas
  un komunik\u0101cijas sist\u0113mu dro\u0161\u012bbai, k\u0101 ar\u012b liel\u0101ks
  uzsvars likts uz pier\u0101d\u012bjumiem bals\u012btiem sasniegumiem profesion\u0101laj\u0101
  nozar\u0113.\\n\\nJaunaj\u0101 profesijas standart\u0101 ir liel\u0101ks uzsvars
  uz zin\u0101\u0161an\u0101m izpratnes un lieto\u0161anas l\u012bmen\u012b Inform\u0101cijapr\u0101t\u012bbas
  virzien\u0101. Ir paredz\u0113ts apg\u016bt antiv\u012brusa programmas, datora un
  biroja tehnikas darb\u012bbas principus un inform\u0101cijas sist\u0113mas dro\u0161\u012bbu,
  kas tik \u013coti uzsv\u0113rts nebija l\u012bdzin\u0113j\u0101 profesijas standart\u0101.\\n\\nSavuk\u0101rt
  moduli \\\"Medic\u012bnas rehabilit\u0101cija\\\" tika p\u0101rskat\u012bta studiju
  kursa \\\"\u016adensdziedniec\u012bba\\\" lieder\u012bgums. L\u012bdzin\u0113ji
  kursam ir sam\u0113r\u0101 maz atv\u0113l\u0113to stundu skaits, kas nenodro\u0161ina
  kursa piln\u012bgu apgu\u0161anu. Iepriek\u0161\u0113j\u0101 profesijas standart\u0101
  tika defin\u0113tas \u0161\u0101das zin\u0101\u0161anas izpratnes l\u012bmeni: \u016bdensdziedniec\u012bbas
  un klasisk\u0101s dabas dziedniec\u012bbas pamatprincipi un zin\u0101\u0161anas
  lieto\u0161anas l\u012bmeni: zem\u016bdens mas\u0101\u017ea, \u0160arko du\u0161a.
  Jaunaj\u0101 profesijas standart\u0101 nav \u0161\u0101das zin\u0101\u0161anas paredz\u0113tas
  apg\u016bt. Savuk\u0101rt moduli eso\u0161ais studiju kursu \\\"Rehabilit\u0101cijas
  pamati\\\" tika papildin\u0101ts ar vienu kred\u012btpunktu, kas nodro\u0161in\u0101s
  eso\u0161o studijas kursu t\u0113mu dz\u012bl\u0101ku apguvi.\\n\\nSavuk\u0101rt
  moduli \\\"Speci\u0101l\u0101s mas\u0101\u017eas\\\" studiju kursa \\\"Punktu un
  p\u0113du mas\u0101\u017ea\\\" tika p\u0101rskat\u012btas sadalas par \\\"punktiem\\\"
  lieder\u012bba, jo \u0161\u0101das zin\u0101\u0161anas nav pras\u012btas profesijas
  standart\u0101. P\u0113c \u0161\u0101da pa\u0161a principa tika p\u0101rskat\u012bts
  studiju kursa \\\"Sporta un saistaudu mas\u0101\u017ea\\\"\\n\\nsaturu, kur jaunaj\u0101
  profesijas standart\u0101 par saistaudiem nav pras\u012btas zin\u0101\u0161anu apguve.
  Zin\u0101\u0161anu lieto\u0161anas l\u012bmeni: Segment\u0101r\u0101s mas\u0101\u017eas
  tehnika, indik\u0101cijas kontrindik\u0101cijas; manu\u0101l\u0101 limfodrena\u017ea;
  sporta mas\u0101\u017ea; punktu mas\u0101\u017ea; saistaudu mas\u0101\u017ea; p\u0113du
  mas\u0101\u017ea; banku mas\u0101\u017ea; gr\u016btnie\u010du mas\u0101\u017ea;
  mas\u0101\u017ea ar da\u017e\u0101d\u0101m mas\u0101\u017eas ier\u012bc\u0113m.
  Jaunaj\u0101 standart\u0101 vairs nav defin\u0113tas nepiecie\u0161am\u0101s zin\u0101\u0161anas
  lieto\u0161anas l\u012bmeni par punktu mas\u0101\u017eu un saistaudu mas\u0101\u017eu.\\n\\nIepriek\u0161\u0113j\u0101
  profesijas standart\u0101 bija uzsvars uz masiera prasm\u0113m est\u0113tik\u0101
  un da\u017e\u0101du apar\u0101tu izmanto\u0161anu est\u0113tik\u0101, kas veidoja
  studiju kursu \u201cEst\u0113tisk\u0101 apar\u0101tmas\u0101\u017ea\u201d. Jaunaj\u0101
  profesijas standart\u0101 nav defin\u0113tas zin\u0101\u0161anas izpratnes l\u012bmeni
  par nekirur\u0123isku \u0137ermena formas korekciju un mas\u0101\u017ea est\u0113tiskaj\u0101
  medic\u012bn\u0101. Sakar\u0101 ar izmai\u0146\u0101m jaunaj\u0101 profesijas standart\u0101,
  kur\u0101 uzsvars likts uz jaun\u0101kaj\u0101m nozares tendenc\u0113m par pla\u0161i
  izmantot\u0101m medic\u012bnisk\u0101m ier\u012bc\u0113m, t\u0101p\u0113c tika veidots
  studiju kursu \u201cMas\u0101\u017ea ar medic\u012bniskaj\u0101m ier\u012bc\u0113m\u201d.\\n\\nAnal\u012bze
  un nov\u0113rt\u0113jums par stud\u0113jo\u0161o nosl\u0113guma darbu t\u0113m\u0101m;\\n\\nSadarb\u012bb\u0101
  ar ekspertiem nozar\u0113 tiek izstr\u0101d\u0101ti lieti\u0161\u0137o p\u0113t\u012bjumu
  virzieni, kas saskanoti studiju peogarmmas \u201c\u0100rstniecisk\u0101 mas\u0101\u017ea\u201d
  padomes s\u0113d\u0113 un apstiprin\u0101ti RSU SKMK Zin\u0101tnisk\u0101 padom\u0113.
  Stud\u0113jo\u0161o nosl\u0113guma darbu t\u0113mas ir aktu\u0101las nozar\u0113
  un darba tirg\u016b, jo tiek izv\u0113l\u0113tas prakses laik\u0101, un balstoties
  jaun\u0101kajiem zin\u0101tniskajiem p\u0113t\u012bjumiem. \u0100rstniec\u012bbas
  iest\u0101d\u0113s visvair\u0101k tiek praktiz\u0113ta klasisk\u0101 mas\u0101\u017ea,
  mas\u0101\u017ea pie da\u017e\u0101d\u0101m saslim\u0161an\u0101m. Studiju programmas
  \u201c\u0100rstniecisk\u0101 mas\u0101\u017ea\u201d kvalifik\u0101cijas darbu t\u0113mu
  izv\u0113li 2021./2022. studiju gad\u0101 noteica ar\u012b realiz\u0113tais RSU
  Sarkana Krusta medic\u012bnas koled\u017eas zin\u0101tnisk\u0101s darb\u012bbas
  att\u012bst\u012bbas projekts \u201cKlasisk\u0101s mas\u0101\u017eas \u012bstermi\u0146a
  un ilgtermi\u0146a ietekme uz glikozes l\u012bmeni asin\u012bs, k\u0101 ar\u012b
  citiem ar diagnozi saist\u012btiem fiziolo\u0123iskiem un psiholo\u0123iskiem r\u0101d\u012bt\u0101jiem
  pusaud\u017eiem ar 1.tipa cukura diab\u0113tu\u201d. Vair\u0101ki kvalifik\u0101cijas
  darbi tapa izmantojot p\u0113t\u012bjum\u0101 ieg\u016btos datus:\\n\\n- Klasisk\u0101s
  mas\u0101\u017eas ietekme uz emocion\u0101lo st\u0101vokli pusaud\u017eiem ar 1.tipa
  cukura diab\u0113tu\\n- Regul\u0101ras klasisk\u0101s muguras mas\u0101\u017eas
  ietekme uz fruktozam\u012bna l\u012bmeni asin\u012bs un pa\u0161saj\u016btu pusaud\u017eiem
  ar diagnozi 1.tipa cukura diab\u0113ts\\n- Klasisk\u0101s mas\u0101\u017eas ietekme
  uz glikozes l\u012bmeni asin\u012bs pusaud\u017eiem ar 1. tipa cukura diab\u0113tu\\n-
  Klasisk\u0101s mas\u0101\u017eas ietekme uz miega kvalit\u0101ti pusaud\u017eiem
  ar 1.tipa cukura diab\u0113tu\\n\\nJ\u0101uzsv\u0113r \u013coti noz\u012bm\u012bgas
  un specifisk\u0101s kvalifik\u0101cijas darbu t\u0113mas, kuru izstr\u0101d\u0113
  tika izmantoti ar\u012b aprob\u0113ti p\u0113tniec\u012bbas instrumenti:\\n\\n-
  \u0100rstniecisk\u0101s mas\u0101\u017eas ietekme temporomandibul\u0101r\u0101s
  loc\u012btavas disfunkcijas rad\u012btu s\u0101pju mazin\u0101\u0161an\u0101\\n-
  Psori\u0101zes pacientu v\u0113rt\u0113jums par klasisk\u0101s mas\u0101\u017eas
  ietekmi uz vi\u0146u dz\u012bves kvalit\u0101ti\\n- Sievie\u0161u viedoklis par
  kr\u016b\u0161u mas\u0101\u017eu k\u0101 z\u012bdi\u0161anas veicin\u0101\u0161anas
  metodi\\n- Klientu pieredze par m\u016bzikas ietekmi uz pa\u0161saj\u016btu mas\u0101\u017eas
  laik\u0101\\n- Masieru pieredze darb\u0101 ar priek\u0161\u0161laikus dzimu\u0161iem
  b\u0113rniem\\n- Sazin\u0101s kakla sindroma pacientu pa\u0161saj\u016btas nov\u0113rt\u0113jums
  pirms un p\u0113c mas\u0101\u017eas kursa\\n\\n\u2022 Sievie\u0161u v\u0113rt\u0113jums
  par \u0101rstniecisk\u0101s mas\u0101\u017eas kursa ietekmi funkcional\u0101 aizciet\u0113juma
  \u0101rst\u0113\u0161an\u0101\\n\u2022 Covid-19 p\u0101rslimoju\u0161u pacientu
  pa\u0161saj\u016bta p\u0113c mas\u0101\u017eas\\n\\nRet\u0101k ir student p\u0113tnieciskie
  darbi par masiera darbu un to organiz\u0101cijas jaut\u0101jumiem, bet \u0161aj\u0101
  studiju gad\u0101 jauzsver tr\u012bs darbi, kuri r\u0101s\u012bja v\u0113rt\u012bgas
  diskusijas aktualiz\u0113jot \u0161\u012bs t\u0113mas:\\n\u2022 Masieru inform\u0113t\u012bba
  par uz\u0146\u0113m\u0113jdarb\u012bbas form\u0101m Latvij\u0101\\n\u2022 Masieru
  viedoklis par Eiropas Soci\u0101lo partneru pamatnol\u012bguma par uzm\u0101k\u0161anos
  un vardarb\u012bbu darba viet\u0101 \u012bsteno\u0161anu Latvij\u0101\\n\u2022 Masieru
  motiv\u0101cija profesion\u0101l\u0101s kompetences pilnveidei\\n\\nKvalifik\u0101cijas
  darbu autori izteikts v\u0113lmes n\u0101cotn\u0113 redz\u0113t ar\u012b tie\u0161as
  t\u0101l\u0101kizgl\u012bt\u012bbas iesp\u0113jas masieriem, piem\u0113ram bakalaura
  gr\u0101da ieg\u016b\u0161anai.\\n\\n**Studentu aptaujas rezult\u0101ti**\\n\\nStudiju
  programmas \u201c\u0100rstniecisk\u0101 mas\u0101\u017ea\u201d 1. kursa stud\u0113jo\u0161ie
  kopum\u0101 studiju kvalit\u0101ti v\u0113rt\u0113 pozit\u012bvi. Vair\u0101k k\u0101
  50% ir nor\u0101d\u012bju\u0161i v\u0113rt\u0113jumu *teicami* vai *labi*.\\n\\n|
  Atbilde   | Skaitlis | %     |\\n|-----------|----------|-------|\\n| Teicami   |
