  un uz\u0146\u0113m\u0113ju savstarp\u0113jo komunik\u0101ciju, nodro\u0161in\u0101s
  kop\u012bgas informat\u012bvas IT platformas uztur\u0113\u0161anu un past\u0101v\u012bgu
  inform\u0101cijas atjauno\u0161anu, inform\u0101cijas nodo\u0161anu un inform\u0101cijas
