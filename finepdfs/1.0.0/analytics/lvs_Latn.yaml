  slimn\u012bca, R\u012bgas Austrumu klinisk\u0101s universit\u0101tes slimn\u012bca,
  \u201cMFD\u201d, \u201cVesel\u012bbas centrs 4\u201d, Zieme\u013ckurzemes re\u0123ion\u0101l\u0101s
  slimn\u012bca).\\n\\n11. Studiju virziena resursu raksturojums\\n\\nAr 2021/2022.
  akad\u0113miskaj\u0101 gada Koled\u017ea ieviesa papildu (217) Kl\u012bnisko prasmju
  pa\u0161m\u0101c\u012bbas kabinetu studentiem, kur\u0101 ietilpst 2 injekcijas rokas
  (ERAF), Vital m\u0113raparat\u016bra - tonometrs un fonendoskops, Negatoskops, Injekciju
  trena\u017eieri - audu gabalinji (ERAF), 2 da\u017e\u0101du dzimumu ur\u012bna kateteriz\u0101cijai
  (ERAF), mobilie proced\u016bru rati\u0146i, Kl\u012bnisko manipul\u0101ciju apr\u012bkojuma
  vien\u012bbas visa veida kl\u012bnisko manipul\u0101ciju apguvei - gr\u0113mo\u0161ana,
  injekcijas, urince\u013cu katriz\u0101cija u.c.\\n\\nMateri\u0101ltehnisk\u0101
  nodro\u0161in\u0101juma iepirkuma process un m\u0101c\u012bbu laboratoriju apg\u0101de\\n\\nIk
  m\u0113nesi tiek p\u0101rskat\u012bts noliktavas satus un kl\u012bnisko priek\u0161metu
  apr\u012bkojuma pat\u0113ri\u0146\u0161. Vienu reizi semestr\u012b jeb divas reizes
  kalend\u0101raj\u0101 gad\u0101 tiek veikta materi\u0101lu inventariz\u0101cija,
  p\u0113c kuras var pl\u0101not n\u0101kam\u0101 semestra nepiecie\u0161amo apr\u012bkojuma
  vien\u012bbu papildin\u0101jumu. Atbild\u012bgais darbinieks divas reizes gad\u0101
  (ja nepiecie\u0161ams ar\u012b bie\u017e\u0101k) sast\u0101da sarakstu ar papildin\u0101mo
  pre\u010du vien\u012bbu tehniko specifik\u0101ciju, daudzumu un prognoz\u0113jamo
  vien\u012bbas cenu, tad kop\u0101 ar iesniegumu iesniedz galvenajai gr\u0101matvedei
  uz apstiprin\u0101jumu. P\u0113c gr\u0101matve\u017ea apstiprin\u0101juma, iesniegumu
  apstiprina Koled\u017eas direktors un t\u0101l\u0101k nodod iepirkuma specialistam.
  Iepirkumu specialists pirms pas\u016bt\u012bjuma noform\u0113\u0161anas sazin\u0101s
  ar atbild\u012bgo darbinieku par apr\u012bkojuma specializ\u0101cijas atbilst\u012bbu
  pied\u0101v\u0101jumam. P\u0113c pieg\u0101des darbinieks uz pavad\u012bmes pamata
  apr\u012bkojuma vien\u012bbas re\u0123istr\u0113 dokumentu \u201cSaimniec\u012bbas
  pre\u010du- m\u0101c\u012bbu materi\u0101lu noliktavas atlikuma atskaite\u201d.
  Dokuments tie\u0161saist\u0113 pieejams galvenajam gr\u0101matvedim un iepirkumu
  specialistam. Materi\u0101lu vien\u012bbas, kuras no noliktavas nog\u0101d\u0101tas
  m\u0101c\u012bbu laboratorij\u0101s uzskaita dokument\u0101 \u201cSaimniec\u012bbas
  pre\u010du- m\u0101c\u012bbu materi\u0101lu kust\u012bba no noliktavas\u201d.\\n\\nResursu
  otreiz\u0113ja izmanto\u0161ana\\n\\nKoled\u017ea r\u016bp\u0113jas par apr\u012bkojuma
  otreiz\u0113jo iepako\u0161anu resursiem, kuriem tas ir iesp\u0113jams. 319. kabinets
  ir apr\u012bkots ar Vakuumiepako\u0161anas ier\u012bci un ir dom\u0101ts invent\u0101ra
  un apr\u012bkojuma atk\u0101rtotai lieto\u0161anai, simul\u0113jot sterilit\u0101tes
  izpratni, t\u0101d\u0113j\u0101di \u013caujot stud\u0113jo\u0161ajam praktiz\u0113ties
  atk\u0101rtota apr\u012bkojuma iz\u0146em\u0161an\u0101 aseptisk\u0101 veid\u0101.
  \u0160\u012b strat\u0113\u0123ija taupa resursus - re\u0101las medic\u012bnisk\u0101s
  ier\u012bces un komplektus, kas ieg\u0101d\u0101ti un izmantoti, ta\u010du m\u0101c\u012bbu
  nol\u016bkos ir iesp\u0113jama to atk\u0101rtota lieto\u0161ana, atjaunojot iepakojumu.
  Pa\u0161m\u0101c\u012bbu kabinetu lietot\u0101jiem - studentiem - ir iesp\u0113ja
  lietot iepako\u0161anas ier\u012bci ar\u012b p\u0113c individu\u0101l\u0101m nodarb\u012bb\u0101m.
  Vakuumiepako\u0161anas telpas pieejam\u012bba dod iesp\u0113ju taup\u012bt laboratoriju
  tehniku laiku, jo materi\u0101li tiek sak\u0101rtoti nodarb\u012bbas laik\u0101
  - k\u0101 da\u013ca no m\u0101c\u012bbu procesa.\\n\\n2019.gad\u0101 saska\u0146\u0101
  ar Koled\u017eas anatomijas doc\u0113t\u0101ju nor\u0101d\u0113m, tika pas\u016bt\u012bta
  datoriz\u0113ta interakt\u012bva programma anatomijas apguvei - Anatomy next. Anatomy
  Labs 3D anatomijas apm\u0101c\u012bbu programma iek\u013cauj t\u0101das sadalas
  k\u0101 galvas un kakla muskulat\u016bru, kr\u016b\u0161kurvja skeletu un muskulat\u016bru,
  v\u0113dera dobuma, roku un k\u0101ju muskulat\u016bru.\\n\\nStudentiem tiek nodro\u0161in\u0101ts
  WI FI vis\u0101 Koled\u017e\u0101. Bezvadu t\u012bkla moderniz\u0113\u0161anai 2019.
  gad\u0101 tika veikta lok\u0101l\u0101 t\u012bkla papla\u0161in\u0101\u0161ana.
  Koled\u017e\u0101 kopum\u0101 ir pieejami 26 wi-fi piek\u013cuves punkti, t.sk.
  studentu studentu apt\u016btas zon\u0101s pie Bibliot\u0113kas un pie praktisko
  nodarb\u012bbu laboratorij\u0101m. Tika veikti ar\u012b v\u0113rien\u012bgi citi
  ar interneta p\u0101rk\u0101jumu nepiecie\u0161ami\\n\\nuzlabojumi k\u0101: komunik\u0101ciju/servera
  telpas remonts un moderniz\u0113\u0161ana - kosm\u0113tiskais remonts, kondicioniera
  ier\u012bko\u0161ana, servera statnes uzst\u0101d\u012b\u0161ana, t\u012bkla topogr\u0101fijas
  sak\u0101rto\u0161ana. **2021. gada nogal\u0113 tika uzst\u0101d\u012bti v\u0113l
  papildus 8 wi-fi t\u012bkla piek\u013cuves punkti.**\\n\\nDoc\u0113t\u0101jiem praktisko
  nodarb\u012bbu p\u0101rraid\u012b\u0161anai tie\u0161saistes Zoom platform\u0101
  Koled\u017ea var pied\u0101v\u0101t 2 speci\u0101li **kust\u012bg\u0101s kameras**.
  Viena kamera kust\u0101s l\u012bdz\u012b doc\u0113t\u0101ja kust\u012bb\u0101m,
  doc\u0113tajam raidot speci\u0101las roku kust\u012bbas var main\u012bt kameras
  tuvuma un t\u0101luma fokusu. Otra kamera ir vad\u0101ma ar pulvi, bet ar\u012b
  iek\u013cauj kameras tuvuma un t\u0101luma fokusu, k\u0101 ar\u012b novirzi\u0161anu
  pa labi un pa kreisi. \u0160\u012b kamera ir \u012bpa\u0161i \u0113rti lietojama
  situ\u0101cij\u0101s, kad doc\u0113t\u0101ji v\u0113las nofilm\u0113t video fragmentus
  par praktisk\u0101m manipul\u0101cij\u0101m savos kursos. Parasti pie video film\u0113\u0161anas
  asist\u0113 Metodisk\u0101s noda\u013cas darbinieks, lai ievad\u012btu doc\u0113t\u0101ju
  un p\u0101rliecin\u0101tos par kvalit\u0101ti.\\n\\n**Audio-video lekciju ierakst\u012b\u0161anai**
  (bez studentu kl\u0101tb\u016btnes) tiek izmantota programma Loom, kas ir Google
  produkts. \u0160\u012b programma jau doc\u0113t\u0101ju vid\u016b ir iecien\u012bta,
  jo pirm\u0101s m\u0101c\u012bbas jau norit\u0113ja 2018. gada nogal\u0113, v\u0113l
  pirms Covid-19 pand\u0113mijas. Sadarb\u012bb\u0101 ar RSU audiovizu\u0101lo m\u0101c\u012bbu
  materi\u0101lu sagatavo\u0161anai tiek izmantota ar\u012b **Panopto** video ierakstu
  sist\u0113ma. \u0160o sist\u0113mu vair\u0101k iecien\u012bju\u0161i studiju programmas
  \u0100rstniec\u012bba ar kvalifik\u0101ciju Neatliekamas medic\u012bnas \u0101rsta
  pal\u012bgs doc\u0113t\u0101ji.\\n\\n**Tie\u0161saistes lekciju un nodarb\u012bbu**
  vad\u012b\u0161anai Koled\u017ea izmantoit **Zoom Education** licences k\u0101 ar\u012b
  racion\u0101lu resursu nol\u016bkos papildus kontus Zoom Pro. doc\u0113t\u0101jiem,
  kuriem ir maz kontaktstundu.\\n\\n**Bibliot\u0113ka un datub\u0101zes**\\n\\nKoled\u017eas
  bibliot\u0113ka ar 2011.gada 19. apr\u012bla RSU Sen\u0101ta l\u0113mumu 2011.gada
  1.j\u016bnij\u0101 tika pievienota RSU bibliot\u0113kai (Dzirciema iel\u0101 16,
  R\u012bg\u0101). Resursu koplieto\u0161anas ietvaros, Koled\u017eas bibliot\u0113kas
  funkcijas pilda un ar literat\u016bru, inform\u0101cijas resursiem un pakalpojumiem
  koled\u017eas akad\u0113misko person\u0101lu un stud\u0113jo\u0161os nodro\u0161ina
  RSU bibliot\u0113kas Inform\u0101cijas centrs Latvijas vesel\u012bbas apr\u016bpes
  speciali\u0161iem (ICLVAS). ICLVAS kr\u0101jumu veido vair\u0101k nek\u0101 **122
  000 iespieddarbi** \u2013 gr\u0101matas, \u017eurn\u0101li, autorefer\u0101ti galvenok\u0101rt
  medic\u012bn\u0101 un vesel\u012bbas zin\u0101tnu nozar\u0113s. Koled\u017eas Direktore
  ir RSU Bibliot\u0113kas padomes locekle.\\n\\nStudentiem ir pieejamas RSU 28 **tie\u0161saistes
  datub\u0101zes**: AMBOSS (medic\u012bnas m\u0101c\u012b\u0161an\u0101s sist\u0113mas
  platforma), ClinicalKey, AccessMedicine, Ebook Central (ProQuest), BMJ Journals,SAGE
  Premier 2018 \u017eurn\u0101lu kolekcija, Wiley Online Journals, PsycARTICLES, EBSCO
  (vair\u0101kas akad\u0113misk\u0101s datub\u0101zes), The Cochrane Library, DynaMed
  Plus, ProQuest \u017eurn\u0101lu kolekcija Health Research Premium Collection, Science
  Direct \u017eurn\u0101lu kolekcija, SCOPUS, Web of Science, ProQuest Dissertations
  & Theses Global: The Sciences and Engineering Collection, Letonika, LETA zi\u0146u
  arh\u012bvs, Nozare.lv u. c. (skat. [https://www.rsu.lv/biblioteka/resursi](https://www.rsu.lv/biblioteka/resursi)).
  Medic\u012bnas nozares abon\u0113t\u0101s datub\u0101zes Elsevier ClinicalKey un
  McGraw-Hill AccessMedicine nodro\u0161ina nelimit\u0113tu RSU lietot\u0101ju skaitu
  ar galveno m\u0101c\u012bbu literat\u016bru un rokasgr\u0101mat\u0101m gan medic\u012bnas
  b\u0101zes zin\u0101tn\u0113s, gan da\u017e\u0101das Specialit\u0101t\u0113s.\\n\\nDatub\u0101z\u0113m
  var piek\u013c\u016bt, izmantojot RSU bibliot\u0113kas sniegto lietot\u0101jv\u0101rdus
  un paroles. Tie tiek sniegti studentiem ievadlekcij\u0101 par bibliot\u0113kas resursiem,
  public\u0113ti Moodle sist\u0113m\u0101 un k\u0101 ar\u012b studiju kurs\u0101 \\\"Kvalifik\u0101cijas
  darbs\\\" ir prezent\u0101cija par avotu mekl\u0113\u0161anu, filtr\u0113\u0161anu
  un taj\u0101 ir lietot\u0101jv\u0101rdi un paroles.\\n\\nSavuk\u0101rt abon\u0113t\u0101s
  daudznozaru datub\u0101zes Ebook Central (ProQuest) un EBSCO eBook Academic Collection
  pied\u0101v\u0101 da\u017e\u0101du izdev\u0113ju da\u017e\u0101du nozaru e-gr\u0101matas,
  kas nodro\u0161ina atlas\u012bt\u0101s inform\u0101cijas rezult\u0101tus, mekl\u0113jot
  p\u0113c visda\u017e\u0101d\u0101kaj\u0101m t\u0113m\u0101m/atl\u0113gv\u0101rdiem.
  Nemot v\u0113r\u0101 ka bibliot\u0113kas resursi tiek izmantoti kop\u0101 ar RSU
  studentiem, atsevi\u0161\u0137a uzskait\u0113 par datub\u0101\u017eu izmanto\u0161anas
  statistiku koled\u017eas studentiem netiek veikta.\\n\\nRSU abon\u0113t\u0101s e-gr\u0101matu
  datub\u0101zes: Access Medicine, ClinicalKey, Ebrary eBooks, EBSCO, Letonika. Starpbibliot\u0113ku
  abonements un Starptautiskais starpbibliot\u0113ku abonements sniedz iesp\u0113ju
  RSU bibliot\u0113kas lietot\u0101jiem pas\u016bt\u012bt inform\u0101cijas resursos,
  kuri nav pieejami bibliot\u0113kas kr\u0101jum\u0101, no cit\u0101m Latvijas un
  \u0101rvalstu bibliot\u0113k\u0101m, un dokumentu pieg\u0101des centriem.\\n\\nNo
  2017.gada septembra studentiem Koled\u017eas telp\u0101s ir pieejamas divas atp\u016btas/darba
  zonas patst\u0101v\u012bgajam darbam, kas ir apr\u012bkotas ar galda lampu, elektr\u012bbas
  rozet\u0113m.\\n\\nM\u0101c\u012bbu procesa nep\u0101rtraukti nodro\u0161in\u0101\u0161anai,
  izsludin\u0101tajos \u0101rk\u0101rtas laikos, studentiem ir iesp\u0113ja att\u0101lin\u0101ti
  rezerv\u0113t un, neapmekl\u0113jot bibliot\u0113kas telpas, sa\u0146emt gr\u0101matas
  l\u012bdz\u012b uz m\u0101j\u0101m (preciz\u0113jums Ministru kabineta 2021. gada
  9. oktobra r\u012bkojuma Nr. 720 \u201cPar \u0101rk\u0101rt\u0113jas situ\u0101cijas
  izsludin\u0101\u0161anu\u201d punkt\u0101 5.49.12.). Ierodoties RSU \u0113k\u0101s
  par gr\u0101matu sanem\u0161anu jaut\u0101jot apsargiem.\\n\\nKatru gadu Koled\u017ea
  ir ties\u012bga iesniegt gr\u0101matu piepras\u012bjumu RSU Bibliot\u0113kas kr\u0101jumu
  papildin\u0101\u0161anai tie\u0161i Koled\u017eas stud\u0113jo\u0161o vajadz\u012bb\u0101m
  l\u012bdz 5000 EUR.\\n\\nStudiju kursa \\\"P\u0113tniec\u012bba\\\" ietvaros RSU
  bibliot\u0113kas specialisti regul\u0101ri studentiem sniedz informat\u012bvu lekciju,
  k\u0101 darboties ar datu b\u0101z\u0113m, ka taj\u0101s orient\u0113ties un k\u0101
  lab\u0101k atrast inform\u0101ciju pielietojot filtru funkcijas.\\n\\n**Inform\u0101cijas
  un komunik\u0101cijas sist\u0113mu raksturojums**\\n\\nKoled\u017eai ir ofici\u0101l\u0101
  m\u0101jas lapa [www.rcmc.lv](http://www.rcmc.lv), kur pieejama vispla\u0161\u0101k\u0101
  rakstura inform\u0101cija visiem interesentiem, sabiedr\u012bbai, studentiem, kas
  stud\u0113 un potenci\u0101lajiem studentiem, lai iepaz\u012btos ar studiju programm\u0101m.\\n\\nInform\u0101cija
  par studiju virzienu tiek public\u0113ta Valsts izgl\u012bt\u012bbas inform\u0101cijas
  sist\u0113m\u0101 (turpm\u0101k - VIIS). Sist\u0113m\u0101 iek\u013cauj inform\u0101ciju
  par vis\u0101m izgl\u012bt\u012bbas iest\u0101d\u0113m, kuras re\u0123istr\u0113tas
  Izgl\u012bt\u012bbas iest\u0101\u017eu registr\u0101 (turpm\u0101k \u2013 izgl\u012bt\u012bbas
  iest\u0101de), un cit\u0101m [Izgl\u012bt\u012bbas likuma 36. panta pirmaj\u0101
  dal\u0101 min\u0113taj\u0101m instit\u016bcij\u0101m, kuras \u012bsteno pieaugu\u0161o
  izgl\u012bt\u012bbas programmas un ir re\u0123istr\u0113tas Izgl\u012bt\u012bbas
  likuma noteikto instit\u016bciju re\u0123istr\u0101 (turpm\u0101k \u2013 instit\u016bcija).
  VIIS tiek iek\u013cauta inform\u0101cija par akredit\u0101ciju, par izgl\u012bt\u012bbas
  programm\u0101m, t.sk. licenc\u0113\u0161anas datumiem un akredit\u0101cijas terminiem.
  Studentu dati, k\u0101 piem\u0113ra, studiju l\u012bgums, r\u012bkojumi, sekmes
  tiek apstr\u0101d\u0101ti un uztur\u0113ti Latvijas Augstskolu Informat\u012bv\u0101
  Sist\u0113ma (LAIS), kas ietver da\u013cu no Latvijas Universit\u0101tes Informat\u012bv\u0101s
  Sist\u0113mas (LUIS) funkcionalit\u0101tes, kas piel\u0101gota Koled\u017eas vajadz\u012bb\u0101m.
  Studentiem un darbiniekiem tiek\\n\\nnodro\u0161in\u0101ta iesp\u0113ja sanemt piek\u013cuvi
  LAIS. Savuk\u0101rt ar studiju procesu saist\u012btie procesi tiek uztur\u0113ti
  un koordin\u0113ti e-studiju vide Moodle, kas tika ieviesta 2018.gad\u0101.\\n\\n3.att\u0113ls
  \u201cStudentu datu inform\u0101cijas sist\u0113mas\u201d\\n\\nDoc\u0113t\u0101ji
  Moodle s\u0101ka izmantot aktivit\u0101\u0161u un resursu, m\u0101c\u012bbu metodisko
  materi\u0101lu ievieto\u0161anai un v\u0113rt\u0113jumu re\u0123istr\u0113\u0161anai.
  E-studiju vide Moodle tiek nep\u0101rtraukti pilnveidota un \u0161obr\u012bd ir
  piel\u0101gota t\u0101, lai taj\u0101 \u0113rti var\u0113tu ievietot lekciju un
  nodarb\u012bbu sarakstus, eks\u0101menu un pirms eks\u0101mena konsult\u0101ciju
  sarakstus un Valsts p\u0101rbaud\u012bjumu sarakstus studentiem. P\u0113c t\u0101da
  pa\u0161a principa e-studiju vide Moodle tika piel\u0101gota, lai taj\u0101 sniegtu
  atgriezenisko saiti studentiem par aptauju rezult\u0101tu kopsavilkumiem. \u0160is
  p\u0101rmain\u012bjas b\u016btiski padar\u012bja e-studiju vidi praktisk\u0101ku
  lieto\u0161an\u0101.\\n\\nLai e-studiju vide Moodle b\u016btu pat\u012bkam\u0101ka
  lieto\u0161anai, tika uzlabots ar\u012b t\u0101s dizains, katrai studiju programmai
  piel\u0101gojot da\u017e\u0101das kursu embl\u0113mas. Tas padara vi\u0146u ne tikai
  pat\u012bkam\u0101ku vizu\u0101li, bet doc\u0113t\u0101jiem, it sevi\u0161\u0137i,
  kuri doc\u0113 vis\u0101s programm\u0101s, p\u0101rskat\u0101m\u0101k savu s\u0101kuma
  kursu vietni. Ar\u012b vietnes s\u0101kuma lapa tiek praktiski izmantota, lai inform\u0113tu
  studentus un ar\u012b doc\u0113t\u0101jus par jaunumiem Koledz\u0101.\\n\\nPatsv\u0101rigo
  darbu iesnieg\u0161ana e-studiju vid\u0113 Moodle no doc\u0113tajiem tiek atzin\u012bgi
  nov\u0113rt\u0113ta, jo darbi uzkr\u0101jas vienuviet, tos var \u0113rti labot tie\u0161saist\u0113,
  var izsekot aug\u0161upiel\u0101des datumam, noteikt iesnieg\u0161anas limitus un
  da\u017e\u0101das citas opcijas, ko e-pasta vid\u0113 nevar izdar\u012bt. Ar\u012b
  nov\u0113rt\u0113\u0161ana uzreiz savienojas ar Moodle v\u0113rt\u0113\u0161anas
  gr\u0101matu, ko doc\u0113t\u0101ji atzin\u012bgi nov\u0113rt\u0113ja.\\n\\nElektroniskie
  testi Koledz\u0101 tiek veidoti p\u0113c principa prim\u0101ri veidot jaut\u0101jumus
  jaut\u0101jumu bank\u0101, kuru piesaista konkr\u0113tam testam. Elektroniskie testi
  \u013coti lielu popularit\u0101ti ieguva tie\u0161i s\u0101coties Covid-19 pand\u0113mijai,
  kad studenti kl\u0101tien\u0113 vairs darbus nevar\u0113ja rakst\u012bt auditorij\u0101.
  Moodle testu iestat\u012bjumu pied\u0101v\u0101 \u013coti da\u017e\u0101das jaut\u0101jumu
  kategorijas. Moodle testu atv\u0113rtos jaut\u0101jumus ir iesp\u0113jams papildus
  pievienot opcijai \\\"p\u0101rbaud\u012bt akad\u0113misk\u0101 godiguma sist\u0113mai
  Turnitin\\\". Atbildei ir j\u0101b\u016bt vismaz 20 v\u0101rdu garai, lai Turnitin
  sist\u0113ma, to p\u0101rbaud\u012btu pret cit\u0101m l\u012bdz\u012bb\u0101m. Elektronisko
  testu izveid\u0113 doc\u0113t\u0101jiem visvair\u0101k ir nepiecie\u0161ams regul\u0101rs
  atbalsts no e-studiju vides lietvedes, jo testu opcijas ir \u013coti pla\u0161as
  un ir j\u0101veic papildus iestat\u012bjumi Moodle V\u0113rt\u0113jumu gr\u0101matas\\n\\nkalkul\u0101cij\u0101,
  ievadot speci\u0101lu formulu (formulas pieejamas pam\u0101c\u012bb\u0101 par e-testu
  kalkul\u0101ciju), lai Moodle elektroniskie testi tiktu v\u0113rt\u0113ti p\u0113c
  Koled\u017eas Studiju rezult\u0101tu v\u0113rt\u0113\u0161anas nolikum\u0101 noteikt\u0101s
  v\u0113rt\u0113\u0161anas skalas. Piem\u0113rs, k\u0101 v\u0113rt\u0113jumu p\u0101rskats
  (elektroniskajos testos) izskat\u0101s no studenta puses. Elektroniskie testi maksim\u0101li
  tika izmantoti Valsts p\u0101rbaud\u012bjumos, kad tie Covid-19 pand\u0113mijas
  d\u0113\u013c tika organiz\u0113ti ties\u012bsaist\u0113, piem\u0113ram, kad studentiem
  praktisk\u0101s da\u013cas eks\u0101men\u0101 Moodle elektronisk\u0101 testa sadal\u0101
  bija j\u0101izloz\u0113 konkr\u0113ta situ\u0101cija no vair\u0101k\u0101m situ\u0101cij\u0101m,
  lai izskaustu, ka Valsts p\u0101rbaud\u012bjuma komisijai person\u012bgi studentiem
  b\u016btu j\u0101pie\u0161\u0137ir konkr\u0113ta situ\u0101cija. Ar\u012b \u0161\u0101dai
  vajadz\u012bbai Moodle testi tika praktiski izmantoti \u013coti veiksm\u012bgi un
  gan studenti, gan komisija to atzin\u012bgi nov\u0113rt\u0113ja.\\n\\n12. Darbadev\u0113ju
  viedoklis par absolventiem\\n\\nKoled\u017ea katru studiju gadu veic darba dev\u0113ju
