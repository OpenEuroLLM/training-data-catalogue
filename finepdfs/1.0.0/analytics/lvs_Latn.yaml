  vai grozot t\u0101 nolikumu.\\n\\n2. Darb\u012bbas m\u0113r\u0137i un pamatvirzieni\\n\\n2.1.
  Centra darb\u012bbas pamatvirziens ir darbs ar jaunie\u0161iem, organiz\u0113jot
