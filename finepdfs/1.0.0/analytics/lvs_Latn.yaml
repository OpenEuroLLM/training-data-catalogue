  |\\n| Slikti     | 0        | 0%    |\\n| \u013boti slikti| 0        | 0%    |\\n\\nCik
  liel\u0101 m\u0113r\u0101 atbilst Koled\u017eas absolventu praktisk\u0101s iema\u0146as,
