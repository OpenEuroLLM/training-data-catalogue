  pilnveides kurss 4 KP                             |\\n\\n2021./2022. akad\u0113misk\u0101
  gada studiju programmas \u201cFarm\u0101cija\u201d studiju \u012bsteno\u0161anas
  pl\u0101na netika veiktas b\u016btiskas izmai\u0146as, jo izstr\u0101des proces\u0101
  bija jaunais farmaceita asistenta profesijas standarts. T\u0101 k\u0101 profesijas
  standarts v\u0113l bija izstr\u0101des proces\u0101, tad tika apzin\u0101ti studiju
  kursi, kuri b\u016btu j\u0101papildina ar t\u0113m\u0101m, kas jau uzr\u0101d\u012bj\u0101s
  jaunaj\u0101 standart\u0101, k\u0101 ar\u012b studiju kursu, kuru vajadz\u0113tu
  izveidot, lai studiju programma piln\u012bb\u0101 sp\u0113tu sagatavot jaunos farmaceita
  asistentus p\u0113c jaun\u0101kaj\u0101m zin\u0101\u0161an\u0101m un kompetenc\u0113m,
  ko paredz\u0113s jaunais standarts. Ir pl\u0101nots, ka n\u0101kamaj\u0101 akad\u0113miskaj\u0101
  gad\u0101 1. studiju gada pl\u0101n\u0101 b\u016bs izmai\u0146as studiju kursu sec\u012bb\u0101,
  nemot v\u0113r\u0101 mikrobiolo\u0123ijas un norm\u0101l\u0101s fiziolo\u0123ijas
  doc\u0113t\u0101jas M\u0101ras Pakalni\u0161\u0137es ieteikumu. 2 KP studiju kursu
  \u201cmikrobiolo\u0123ija\u201d tiks p\u0101rcelts no 1. semestra uz 2. semestri,
  savuk\u0101rt, 2 KP \u201cnorm\u0101l\u0101 fiziolo\u0123ija\u201d no 2. semestra
  uz 1. semestri, t\u0101d\u0113j\u0101di nodro\u0161inot, ka studenti vispirms ir
  apguvu\u0161i, k\u0101 funkcion\u0113 cilv\u0113ka organismu, tad viegl\u0101k b\u016bs
  uztvert mikrobiolo\u0123ij\u0101 apg\u016bstam\u0101s zin\u0101\u0161anas par mikroorganismiem
  un to ietekmi uz cilv\u0113ka organismu. Izmainot studiju kursu realiz\u0101cijas
  sec\u012bbu, nemain\u0101s apg\u016bstamo KP apjoms starp semestriem, jo abi kursi
  vien\u0101da apjoma.\\n\\nT\u0101 k\u0101 studiju programmas \u201cFarm\u0101cija\u201d
  doc\u0113t\u0101ji ir iesaist\u012bti jaun\u0101 farmaceita asistenta profesijas
  standarta izstr\u0101d\u0113, esam inform\u0113ti, k\u0101das izmai\u0146as tas
  paredz\u0113s, pl\u0101nojam n\u0101kamaj\u0101 akad\u0113miskaj\u0101 gad\u0101
  studiju kursu \u201cProfesion\u0101lo ties\u012bbu pamati\u201d papildin\u0101t
  ar t\u0113m\u0101m par datu aizsardz\u012bbu, \u012bpa\u0161umu aizsardz\u012bbu,
  Latvijas un starptautiskie normat\u012bvie akti par pacientu datu aizsardz\u012bbu,
  personas datu aizsardz\u012bbas svar\u012bg\u0101kie termini un pamatprincipi, t\u0101pat,
  studiju kursa \u201cSoci\u0101l\u0101 farm\u0101cija un farmaceutisk\u0101 apr\u016bpe\u201d
  pl\u0101nots integr\u0113t t\u0113mu par etnisko \u012bpatn\u012bbu un reli\u0123isko
  trad\u012bciju ietekmi uz cilv\u0113ka uzved\u012bbu. Lai nodro\u0161in\u0101tu
  caurviju prasmes ir pl\u0101nots izveidot jaunu studiju kursu \u201cStarpkult\u016bru\\n\\nsaskarsme\u201d,
  kas iek\u013cautu t\u0113mas par ANO ilgtsp\u0113jas att\u012bst\u012bbas m\u0113r\u0137iem,
