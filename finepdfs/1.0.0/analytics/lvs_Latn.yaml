  programmu ietvaros,  padzi\u013cin\u0101ti apg\u016bstot kravas auto, motociklu
  vai automobi\u013cu meh\u0101niku.\\n7 Nepiecie\u0161ams p\u0101rskat\u012bt kvalifik\u0101cijas
  \\\"Autoservisa speci\u0101lists\\\" izstr\u0101d\u0101t\u0101 profesijas standarta
  saturu. Izgl\u012bt\u012bbas programmas tiek \u012bstenotas, paredzot uz\u0146em\u0161anas
  pras\u012bbu par ieg\u016btu \\\"Automeh\u0101ni\u0137is\\\" kvalifik\u0101ciju.\\n8
  Vair\u0101kas kvalifik\u0101cijas iesp\u0113jams ieg\u016bt vienas izgl\u012bt\u012bbas
  programmas ietvaros, k\u0101 ar\u012b to ieg\u016b\u0161ana var tikt \u012bstenota
  t\u0101l\u0101kizgl\u012bt\u012bbas ietvaros.\\n9 Atjaunojot NKS ir j\u0101p\u0101rskata
