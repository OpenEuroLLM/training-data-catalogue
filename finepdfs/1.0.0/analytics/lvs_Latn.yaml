  Cen tr\u0101ltirgus), Tartu tirgus (Igaunija) un v\u0113l vismaz 10 potenci\u0101lie
  partneri, esam gatavi piesaist\u012bt partnerus ar\u012b no cit\u0101m valst\u012bm.
  No 2017. gada VTA guvusi pieredzi, str\u0101d\u0101jot ar \u010detriem Igaunijas
