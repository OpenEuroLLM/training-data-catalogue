  un stud\u0113jo\u0161o prasmes e-\\nvid\u0113 un laujot studentiem stud\u0113t neatkar\u012bgi
  no savas dz\u012bvesvietas.\\n\\n**Kl\u0101tienes studiju forma:** studiju darbs
