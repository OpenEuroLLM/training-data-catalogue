  brig\u0101des vad\u012bt\u0101ju. 2019.gad\u0101 piedal\u012bj\u0101s RSU Jauno
  doc\u0113t\u0101ju skol\u0101.\\n\\n14.tabula \u201cStudiju programmas \u012bsteno\u0161an\u0101
