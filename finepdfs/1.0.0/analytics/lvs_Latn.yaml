  jaunus latvie\u0161u draugus.\\n\\nDa\u013c\u012bba projekt\u0101 \\\"Laterna Magica\\\"
  \u013caus katram jaunietim atkl\u0101t savus talantus k\u0101d\u0101 no kino profesij\u0101m
  \u2013 s\u0101kot no gaismu m\u0101kslinieka un aktiera, beidzot ar re\u017eisoru
  vai producentu.\\n\\nPieteik\u0161an\u0101s, aizpildot anketu: https://ej.uz/ukmp\\n\\nLatvijas
  Pilsonisk\u0101 alianse un N\u012bderlandes v\u0113stniec\u012bba Latvij\u0101 aicina
