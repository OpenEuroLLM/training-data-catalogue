  notiktu dinamiska att\u012bst\u012bba. T\u0101d\u0101 veid\u0101 C\u0113su novads
  k\u013c\u016btu interesants ar\u012b tiem, kas v\u0113las no lielpils\u0113t\u0101m
  p\u0101rcelties uz laukiem, kas p\u0113d\u0113j\u0101 laik\u0101 k\u013c\u016bst
  arvien izplat\u012bt\u0101ka tendence. Un \u0161aj\u0101 c\u012b\u0146\u0101 uzvar\u0113s
  tie\u0161i t\u0101 pa\u0161vald\u012bba, kura pied\u0101v\u0101s labv\u0113l\u012bg\u0101kos
  nosac\u012bjumus: darbavietas, soci\u0101l\u0101s garantijas, infrastrukt\u016bru,
  izaugsmes perspekt\u012bvas.\\n\\nProgramm\u0101 teikts: \\\"Pie \u0161\u0137irsim
