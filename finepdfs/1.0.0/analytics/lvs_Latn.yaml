  Eiropas Savien\u012bbas Eiropas Lauksaimniec\u012bbas fonda lauku att\u012bst\u012bbas
  (ELFLA) finans\u0113jumu atbalstu.\\n\\nProjekta m\u0113r\u0137is ir uzlabot Teven\u0101nu
