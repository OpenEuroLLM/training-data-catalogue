  da\u017e\u0101du dzimumu mul\u0101\u017eas ur\u012bncelu\\nkatetriz\u0101cijai u.c.
  Studenti br\u012bvi pie de\u017euranta parakstoties par atsl\u0113gu var izmantot
  \u0161o\\nkabinetu.\\n\\nStudiju procesa ietvaros studenti studiju proces\u0101
  ieg\u016btas prasmes var demonstr\u0113t\\ndemonstr\u0113t ar\u012b starptautisko
  konkursos. Piem\u0113ram, 2022. gada, 19. un 20. maij\u0101 RSU\\nSarkan\u0101 Krusta
  medic\u012bnas koled\u017eas studiju programmas \u201c\u0100rstniecisk\u0101 mas\u0101\u017ea\u201d
  studenti -\\nJe\u013cena Ivanova un Emanuels Fadejevs piedal\u0101s 6. starptautiskaj\u0101
  studentu olimpi\u0101d\u0113\\n\u201cMas\u0101\u017eas prasmes. Emanuelu Fadejevu
  ar ieg\u016bto 2. vietu teorijas test\u0101 (The Best in\\nTheory) un diplomu kategorij\u0101
  - Inovat\u012bv\u0101kais masieris (Most Innovative Massage\\n\\n2021./2022. studiju
  gada rudens semestr\u012b Koled\u017e\u0101 tika izv\u0113rst\u012bs v\u0113rien\u012bgs
  p\u0113t\u012bjums,\\nlai izv\u0113rt\u0113tu 1) vai studenti lasa studiju kursu
  aprakstus un sasniedzamos studiju rezult\u0101tus;\\n2) apkopots studentu pa\u0161v\u0113rt\u0113jums
  par to, k\u0101 vi\u0146i uzskata, vai doc\u0113t\u0101ji iepaz\u012bstina ar kursa\\npras\u012bb\u0101m
  semestra s\u0101kum\u0101 un vai kursa nosl\u0113gum\u0101 studenti piekr\u012bt,
  ka sasniedzamos\\nstudiju rezult\u0101tus ir apguvu\u0161i; 3) tika l\u016bgts ar\u012b
  doc\u0113t\u0101ju viedoklis izteikties par to, ar k\u0101d\u0101m\\nmetod\u0113m
  un pan\u0113mieniem vislab\u0101k iepaz\u012bstina stud\u0113jo\u0161os ar studiju
  kursu apraksta saturu\\nun sasniedzamajiem studiju rezult\u0101tiem.\\n\\n1., 2.
  un 3. kurs\u0101 kop\u0101 tika izv\u0113rt\u0113ti 36 studiju kursi - to apraksti.
  9 studiju kursu\\napraksti las\u012bti 8.1% - 20% no visiem grup\u0101s eso\u0161ajiem
  studentiem. 9 studiju kursu apraksti\\nlas\u012bti 34% - 45.9% no visiem grupas
  studentiem. 7 studiju kursu apraksti las\u012bti 46.8% -\\n\\n82,5% no visiem grup\u0101
  eso\u0161ajiem studentiem. Kopum\u0101 rezult\u0101ti v\u0113rt\u0113jami k\u0101
  loti augsti. \u0160\u0101da statistika ir ieg\u016bstama pateicoties e-studiju vides
  Moodle anal\u012btiskajiem r\u012bkiem. Ja las\u012bjuma kategorijas sadala ik pa
  10 vien\u012bb\u0101m no 0%-100%, tad visvair\u0101k studenti lasa 20%-30% las\u012bjuma
  kategorija (11 kursu apraksti).\\n\\n2) 59% studenti piln\u012bb\u0101 piekr\u012bt
  un 26% dr\u012bz\u0101k piekr\u012bt apgalvojumam, ka doc\u0113t\u0101js kursa s\u0101kum\u0101
  iepaz\u012bstin\u0101ja ar kurs\u0101 paredz\u0113to zin\u0101\u0161anu, prasmju,
  kompeten\u010du nepiecie\u0161amo apguvi (skaidri sasniedzamie rezult\u0101ti).
  51% studenti piln\u012bb\u0101 piekr\u012bt un 22% dr\u012bz\u0101k, piekr\u012btu
  apgalvojumam, ka studiju kursa laik\u0101 tika sasniegti studiju kursa aprakst\u0101
  noteiktie studiju rezult\u0101ti (zin\u0101\u0161anas, prasmes, kompetences).\\n\\n3)
  Anket\u0113jot doc\u0113t\u0101jus 90.5% respondentu ir p\u0101rliec\u012bni, ka
  tikai da\u017ei studenti lasa studiju kursu aprakstus. Jaut\u0101jot ar k\u0101d\u0101m
