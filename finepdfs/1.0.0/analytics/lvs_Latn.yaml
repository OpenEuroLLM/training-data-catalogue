  \\\"Anatomija\\\" studiju kurs\u0101 un virtu\u0101l\u0101s laboratorijas \\\"Fiziologija\\\"
  studiju kurs\u0101). Koled\u017ea ir ieg\u0101d\u0101jusies doc\u0113t\u0101jiem
  apmaks\u0101tu Kahoot Pro kontu bezierobe\u017eojumu lieto\u0161anai.\\n\\nStudentu
  pa\u0161v\u0113rt\u0113juma veicina\u0161anai Koled\u017e\u0101 ir izplat\u012bti
  pa\u0161p\u0101rbaudes testi e-studiju vid\u0113 Moodle. Testi netiek iek\u013cauti
  kop\u0113j\u0101 v\u0113rt\u0113juma sist\u0113m\u0101, bet students pats var p\u0101rbaud\u012bt
