  uz\u0146\u0113m\u0113jdarb\u012bbas att\u012bst\u012bbai. Tie b\u016btu gan ekonomiskie,
  gan teritori\u0101lie apst\u0101k\u013ci, transporta un komunik\u0101ciju infrastrukt\u016bras
  t\u012bkls.\\n\\nProgramm\u0101 teikts: \\\"uzla bosim uz\u0146\u0113m\u0113jdarb\u012bbas
  vidi un veidosim atv\u0113rtu komunik\u0101ciju, sniedzot abpus\u0113ju atbalstu
  un veidojot dialogu ar nozares p\u0101rst\u0101vjiem.\\\" Ko noz\u012bm\u0113 \u2013
  sniedzot abpus\u0113ju atbalstu?\\n\\nPa\u0161vald\u012bbai, iev\u0113rojot savas
  administrat\u012bv\u0101s teritorijas iedz\u012bvot\u0101ju intereses, j\u0101b\u016bt
  maksim\u0101li atv\u0113rtai sev v\u0113lam\u0101s uz\u0146\u0113m\u0113jdarb\u012bbas
  piesaistei. Te vieta sekojo\u0161iem instrumentiem \u2013 Biznesa inkubatoram, Uz\u0146\u0113m\u0113ju
  padomei, strukt\u016brvien\u012bbai pa\u0161vald\u012bb\u0101, kas sekm\u0113 uz\u0146\u0113m\u0113ju
  un pa\u0161vald\u012bbas sadarb\u012bbu, veic priorit\u0101ri atbalst\u0101mo tautsaimniec\u012bbas
  nozaru izp\u0113ti un att\u012bst\u012bbas virzienu noteik\u0161anu, apkopo inform\u0101ciju
  par atbalsta instrumentiem uz\u0146\u0113m\u0113jdarb\u012bbai. Ar\u012b viet\u0113ja
  l\u012bme\u0146a Grantu programm\u0101m uz\u0146\u0113m\u0113jdarb\u012bbas uzs\u0101k\u0161anai,
  pa\u0161vald\u012bbai vajadz\u012bgo speci\u0101listu piesaistes meh\u0101nismam,
  uz\u0146\u0113m\u0113ju deleg\u0101ciju viz\u012bt\u0113m, skol\u0113nu un studentu
  apmai\u0146ai vai izgl\u012bt\u012bbas un prakses vietu piesaistei.\\n\\nSvar\u012bgi
  att\u012bst\u012bt pas\u0101kumus, kas orient\u0113ti uz past\u0101vo\u0161o administrat\u012bvo
  proced\u016bru vienk\u0101r\u0161o\u0161anu un tiesisk\u0101 regul\u0113juma pilnveido\u0161anu,
  pakalpojumu digitaliz\u0101ciju, pa\u0161vald\u012bbas r\u012bc\u012bb\u0101 eso\u0161o
  nodok\u013cu sist\u0113mas konkur\u0113tsp\u0113ju, atv\u0113rtu vidi uz\u0146\u0113m\u0113jdarb\u012bbai
  un br\u012bvpr\u0101t\u012bgo iniciat\u012bvu \u012bsteno\u0161anu.\\n\\nar decentraliz\u0113to
  iepirkumu veik\u0161anu.\\\" K\u0101 ar zem\u0101ko cenu, ko paredz iepirkumi? Vai
  tas nerad\u012bs pamatu korupcijai?\\n\\nM\u016bsu m\u0113r\u0137is ir atbalst\u012bt
  un stiprin\u0101t novad\u0101 str\u0101d\u0101jo\u0161os mazos un vid\u0113jos uz\u0146\u0113mumus,
  radot tiem l\u012bdzv\u0113rt\u012bgas iesp\u0113jas piedal\u012bties iepirkumos,
  jo \u0161ie uz\u0146\u0113mumi ne vienm\u0113r var realiz\u0113t liela apjoma pieg\u0101des/
  pakalpojumus /b\u016bvdarbus. To var pan\u0101kt, ar\u012b pl\u0101nojot iepirkuma
  da\u013cu noteik\u0161anu vienas iepirkuma proced\u016bras ietvaros, ieg\u016bstot
  saimnieciski izdev\u012bg\u0101ko pied\u0101v\u0101jumu katr\u0101 iepirkuma da\u013c\u0101.
  Vien laikus nepiecie\u0161ams noteikt pamatotas un objekt\u012bvas pras\u012bbas
  attiec\u012bb\u0101 uz iepirkuma priek\u0161metu, nodro\u0161inot, ka tas nerada
  nepamatotus konkurences ierobe\u017eojumus. Da\u017e\u0101dos p\u0113t\u012bjumos
  atz\u012bts, ka korupcijas un intere\u0161u konfliktu risks pieaug, tie\u0161i palielinoties
  iepirkumu apjomam, jo pretendenta v\u0113lme ieg\u016bt pas\u016bt\u012bjumu ir
  liel\u0101ka. Mums ir nulles tolerance pret jebk\u0101da veida korupt\u012bv\u0101m
  darb\u012bb\u0101m. Cen traliz\u0113tie iepirkumi ne vienm\u0113r noz\u012bm\u0113
  zem\u0101ko cenu. T\u0101, piem\u0113ram, pa\u0161vald\u012bbas iest\u0101\u017eu
  teritorijas un apst\u0101d\u012bjumu kop\u0161anas centraliz\u0113ta iepirkuma rezult\u0101t\u0101
  2018.gad\u0101 cena pieauga 1,5 l\u012bdz  divas reizes.\\n\\nnnacion\u0101L\u0101
  aPvien\u012bba\\n\\nguntIs grosbErgs: - M\u016bsu skat\u012bjum\u0101 cilv\u0113ks,
  kas veicina novada izaugsmi un atpaz\u012bstam\u012bbu, ir t\u0101ds, kur\u0161
  ar saviem darbiem un zin\u0101\u0161an\u0101m sp\u0113j veicin\u0101t novada soci\u0101lo
  un ekonomisko labkl\u0101j\u012bbu ilgtermi\u0146\u0101.\\n\\nProgramm\u0101 teikts:
  \\\"atbal st\u012bsim iedz\u012bvot\u0101jus, kas veicina novada izaugsmi un atpaz\u012bstam\u012bbu.\\\"
  K\u0101 pl\u0101nots atbalst\u012bt, un k\u0101 tiks noteikts, kur\u0161 cilv\u0113ks
  veicina novada izaugsmi un atpaz\u012bstam\u012bbu?\\n\\nNovadam atbalstot konkr\u0113tu
  cilv\u0113ku vai cilv\u0113ku grupu, b\u016btisks ir atgriezenisk\u0101s saites
  faktors, jo l\u012bdzek\u013ci ir ierobe\u017eoti, bet atbalstu v\u0113las visi.
  Ir jaunie\u0161i, kuri v\u0113las nest Latvijas un novada v\u0101rdu pasaul\u0113,
  bet m\u0113r\u0137a realiz\u0113\u0161anai nereti punktu pieliek mor\u0101la un
  finansi\u0101la atbalsta tr\u016bkums no novada puses. B\u016btiski apzin\u0101ties,
  ka tie\u0161i jaunie cilv\u0113ki novadu dar\u012bs stipr\u0101ku ar\u012b p\u0113c
  10 un 20 gadiem.\\n\\nV\u0113l var min\u0113t novada uz\u0146\u0113m\u0113jus, kuri
  izce\u013cas ar darba kvalit\u0101ti un unik\u0101liem produktiem. Lai veicin\u0101tu
  cilv\u0113ku v\u0113lmi rad\u012bt, svar\u012bgu lomu sp\u0113l\u0113 novada sp\u0113ja
  vi\u0146us atbalst\u012bt. Bie\u017ei vien cilv\u0113kiem ir amb\u012bcijas un idejas,
  bet realiz\u0101cijas iesp\u0113jas ierobe\u017eotas. Lai veicin\u0101tu novada
  izaugsmi ilgtermi\u0146\u0101, nepiecie\u0161ams veicin\u0101t jauno uz\u0146\u0113mumu
  izveidi, organiz\u0113jot pa\u0161vald\u012bbas atbalstu. Tiktu sekm\u0113ta saimniecisk\u0101
  darb\u012bba, samazin\u0101ts kop\u0113jais bezdarba l\u012bmenis  novad\u0101.
  \u0160\u012b m\u0113r\u0137a \u012bsteno\u0161anai j\u0101paredz atbalst\u012bt
  mikrouz\u0146\u0113mumus un pa\u0161nodarbin\u0101tas personas, kuras uzs\u0101k
  un att\u012bsta uz\u0146\u0113m\u0113jdarb\u012bbu C\u0113su novada teritorij\u0101.\\n\\nnLatvijas
  att\u012bst\u012bbai\\n\\nProgramm\u0101 teikts: \\\"att\u012bst\u012bsim modernas
  lauku teritorijas ar sp\u0113c\u012bgiem uz\u0146\u0113mumiem un inovat\u012bv\u0101m
  idej\u0101m. Veidosim viedu p\u0101r-\\n\\n5\\n\\nvald\u012bbu, att\u012bst\u012bsim
  viedos ciemus, ievies\u012bsim m\u016bsdien\u012bgu, videi draudz\u012bgu un inovat\u012bvu
  infrastrukt\u016bru.\\\" Kur  redzat \u0161\u0101du teritoriju att\u012bst\u012b\u0161anu,
  kur \u2013 viedos ciemus, k\u0101 pa\u0161vald\u012bba to gatavojas pan\u0101kt?\\n\\nViedie
  ciemi k\u0101 termins \u0161obr\u012bd k\u013c\u016bst arvien popul\u0101r\u0101ks.
  J\u0101saprot, ka viedo ciemu pamat\u0101 ir cilv\u0113ki \u2013 lauku apvidu kopienas,
  kas uz\u0146emas iniciat\u012bvu gan praktisku risin\u0101jumu mekl\u0113\u0161anai,
  gan eso\u0161o probl\u0113mu nov\u0113r\u0161anai. J\u0113dziens \\\"vieds\\\" ietver
  digit\u0101lo tehnolo\u0123iju izmanto\u0161anu br\u012b\u017eos, kad tas piem\u0113rojams,
  nevis t\u0101d\u0113\u013c, ka tas ir m\u016bsdien\u012bgi vai moderni. Piem\u0113ri
  Latvij\u0101 liecina, ka da\u017eas no viedo ciemu praks\u0113m apst\u0101jas pie
  darbo\u0161an\u0101s ciema teritorij\u0101, tom\u0113r ir ar\u012b t\u0101das, kas
  ietver apk\u0101rt\u0113jo lauku teritoriju, ciematu grupas, maz\u0101s pils\u0113tas
  un sadarb\u012bbu ar lielaj\u0101m pils\u0113t\u0101m. \\\"Vieds\\\" noz\u012bm\u0113
  jaunu sadarb\u012bbas formu att\u012bst\u012bbu starp lauksaimniekiem un citiem
  lauku teritoriju uz\u0146\u0113m\u0113jiem, starp pa\u0161 vald\u012bb\u0101m, priv\u0101to
  un publisko sektoru.\\n\\nEl\u012bna staPulonE: - Ciemi un pagasti jaunveidojamaj\u0101
  C\u0113su novad\u0101 ir \u013coti da\u017e\u0101di, t\u0101d\u0113\u013c j\u0101mekl\u0113
  individu\u0101li risin\u0101jumi katrai vietai, lauku ciemam, \u0146emot v\u0113r\u0101
  v\u0113sturisko att\u012bst\u012bbu, eso\u0161o problem\u0101tiku, soci\u0101lekonomisko
  st\u0101vokli,  \u0123eogr\u0101fisko novietojumu.\\n\\nVieda un videi draudz\u012bga
  infrastrukt\u016bra izmantoto materi\u0101lu un iesp\u0113ju zi\u0146\u0101 tiek
  ieviesta arvien vair\u0101k un kontekst\u0101 ar Eiropas kop\u0113jo virz\u012bbu
  uz klimatneitralit\u0101ti un za\u013c\u0101ku Eiropu jau tuv\u0101kaj\u0101 n\u0101kotn\u0113
  b\u016bs neizb\u0113gama nepiecie\u0161am\u012bba.\\n\\nn\\\"kust\u012bba \\\"PaR!\\\"\\\",
  \\\"PRogRes\u012bvie\\\"\\n\\nKrIstaPs KraftE: - \u0160is uzst\u0101d\u012bjums
  saskan ar resursu taup\u012b\u0161anu un aprites ekonomikas idej\u0101m. Sabiedrisku
  b\u016bvju tr\u016bkums nav priorit\u0101r\u0101 probl\u0113ma \u2013 probl\u0113ma
  ir to kvalit\u0101te, vides pieejam\u012bba, piem\u0113rot\u012bba vajadz\u012bb\u0101m.
  \u0112ku piln\u012bga atjauno\u0161ana izmaks\u0101  tr\u012bs \u010detras reizes
  l\u0113t\u0101k nek\u0101 jaunb\u016bves, bet kvalitat\u012bvi atjaunotas \u0113kas
  ilgm\u016b\u017e\u012bba ir l\u012bdzv\u0113rt\u012bga jaunb\u016bvei.\\n\\nProgramm\u0101
  teikts: \\\"Pirms jaunu \u0113ku b\u016bvniec\u012bbas tiek atjaunotas eso\u0161\u0101s.\\\"
  Par k\u0101d\u0101m \u0113k\u0101m tiek run\u0101ts? Pa\u0161vald\u012bbas?  ja
  tas neatteicas uz pa\u0161vald\u012bbas \u0113k\u0101m, k\u0101 pl\u0101nojat pan\u0101kt,
  lai \u012bpa\u0161nieki veic atjauno\u0161anu?\\n\\nOtrs aspekts ir m\u0101jok\u013cu
  pieejam\u012bba, \u012bpa\u0161i \u012bres m\u0101jok\u013cu tr\u016bkums. Par probl\u0113m\u0101m
  \u0161aj\u0101 sektor\u0101, kas kav\u0113 valsts att\u012bst\u012bbu, sa\u0146emti
  aizr\u0101d\u012bjumi ar\u012b no \u0101rvalstu ekspertiem, bet nav j\u0101b\u016bt
  ekspertam, lai to iev\u0113rotu. Cilv\u0113ki grib dz\u012bvot C\u0113s\u012bs,
  citviet novad\u0101, bet ilgsto\u0161i mekl\u0113 piem\u0113rotus m\u0101jok\u013cus.
  Priorit\u0101tei j\u0101b\u016bt iesaistei ekonomisku \u012bres m\u0101jok\u013cu
  b\u016bvniec\u012bb\u0101 un atjauno\u0161an\u0101, nodro\u0161inot ilgtermi\u0146a
  iesp\u0113ju \u012br\u0113t m\u0101jokli visiem, ne tikai tur\u012bgajiem.\\n\\nJ\u0101paredz
  ar\u012b atbalsts \u0113ku apsaimnieko\u0161an\u0101 un energoefektivit\u0101tes
  uzlabo\u0161an\u0101. J\u0101pal\u012bdz iedz\u012bvot\u0101jiem saprast juridisk\u0101s
  lietas un nianses. \u0112ku apsaimnieko\u0161ana notiek da\u017e\u0101dos l\u012bme\u0146os,
  un bie\u017ei izr\u0101d\u0101s, ka par to pa\u0161u naudu var izdar\u012bt daudz
  lab\u0101k. L\u012bdz\u012bgi ar valsts energoefektivit\u0101tes programm\u0101m
  - piedal\u012b\u0161an\u0101s ir juridiski sare\u017e\u0123\u012bta. M\u0113s pied\u0101v\u0101tu
  dar\u012bt efekt\u012bv\u0101k ar pa\u0161vald\u012bbas algota, pieredz\u0113ju\u0161a
  speci\u0101lista atbalstu. q\\n\\nLappusi sagatavojis J\u0101nis Gabr\u0101ns\"",
  "\"Amata savieno\u0161ana\\n\\nPublic\u0113ts: 07.04.2022.\\n\\nVai pa\u0161vald\u012bbas
  deput\u0101ts dr\u012bkst sa\u0146emt atalgojumu par darbu biedr\u012bb\u0101?\\n\\nLikums
  \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\"
  nosaka ien\u0101kumu g\u016b\u0161anas ierobe\u017eojumus pa\u0161vald\u012bbu domju
  deput\u0101tiem.\\n\\nPa\u0161vald\u012bbas domes deput\u0101ts var sa\u0146emt
  atalgojumu par darbu biedr\u012bb\u0101, ta\u010du ir aizliegts sa\u0146emt atalgojumu
  no tiem finan\u0161u l\u012bdzek\u013ciem, kurus \u0161\u012b organiz\u0101cija
  ir sa\u0146\u0113musi no attiec\u012bg\u0101s pa\u0161vald\u012bbas, pa\u0161vald\u012bbas
  iest\u0101des un kapit\u0101lsabiedr\u012bbas. \u0160is ierobe\u017eojums neattiecas
  uz gad\u012bjumiem, kad finan\u0161u l\u012bdzek\u013ci pie\u0161\u0137irti atkl\u0101ta
  konkursa rezult\u0101t\u0101 vai dele\u0123\u0113ta p\u0101rvaldes uzdevuma izpildei.\\n\\nT\u0101pat
  likums \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\"
  nosaka, ka pa\u0161vald\u012bbas domes deput\u0101tam divus gadus p\u0113c l\u0113muma
  vai dal\u012bbas l\u0113muma pie\u0146em\u0161an\u0101 par publiskas personas finan\u0161u
  l\u012bdzek\u013cu pie\u0161\u0137ir\u0161anu biedr\u012bbai ir aizliegts sa\u0146emt
  jebk\u0101du atalgojumu attiec\u012bgaj\u0101 biedr\u012bb\u0101. Ierobe\u017eojumi
  neattiecas uz t\u0101m biedr\u012bb\u0101m un nodibin\u0101jumiem, kurus pa\u0161vald\u012bbas
  saska\u0146\u0101 ar Pa\u0161vald\u012bbu likumu dibin\u0101ju\u0161as kop\u012bgu
  intere\u0161u \u012bsteno\u0161anai.\\n\\nVisi min\u0113tie ierobe\u017eojumi attiecas
  ne tikai uz biedr\u012bb\u0101m, bet ar\u012b nodibin\u0101jumiem, reli\u0123iskaj\u0101m
  organiz\u0101cij\u0101m un komercsabiedr\u012bb\u0101m.\\n\\nIev\u0113rojot iepriek\u0161min\u0113to,
  pa\u0161vald\u012bbas domes deput\u0101ts dr\u012bkst sa\u0146emt atalgojumu biedr\u012bb\u0101,
  nodibin\u0101jum\u0101, reli\u0123iskaj\u0101 organiz\u0101cij\u0101 un komercsabiedr\u012bb\u0101,
  ja vien vi\u0146\u0161 nav piedal\u012bjies l\u0113muma pie\u0146em\u0161an\u0101
  par pa\u0161vald\u012bbas finan\u0161u l\u012bdzek\u013cu pie\u0161\u0137ir\u0161anu
  t\u0101m. Ja pa\u0161vald\u012bbas domes deput\u0101ts nav l\u0113mis vai piedal\u012bjies
  l\u0113muma pie\u0146em\u0161an\u0101 attiec\u012bb\u0101 uz konkr\u0113to biedr\u012bbu,
  vi\u0146\u0161 var sa\u0146emt atalgojumu tikai no tiem l\u012bdzek\u013ciem, kurus
  nav pie\u0161\u0137\u012brusi pa\u0161vald\u012bba vai t\u0101s iest\u0101des un
  kapit\u0101lsabiedr\u012bbas.\\n\\nLikums \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu
  valsts amatpersonu darb\u012bb\u0101\\\" at\u013cauj valsts amatpersonai, kurai
  noteikti speci\u0101lie amata savieno\u0161anas ierobe\u017eojumi, bez rakstveida
  at\u013caujas sa\u0146em\u0161anas savienot valsts amatpersonas amatu ar dienestu
  Zemessardz\u0113, ja likum\u0101 nav noteikts cit\u0101di.\\n\\nLatvijas Republikas
  Zemessardzes likums paredz, ka Zemessardz\u0113 neuz\u0146em pilso\u0146us, kuri
  pilda profesion\u0101lo dienestu vai dienestu Iek\u0161lietu ministrijas sist\u0113mas
  iest\u0101d\u0113s, Ieslodz\u012bjuma vietu p\u0101rvald\u0113, valsts dro\u0161\u012bbas
  iest\u0101d\u0113, pa\u0161vald\u012bbas policij\u0101, ostas policij\u0101, prokurat\u016br\u0101,
  Korupcijas nov\u0113r\u0161anas un apkaro\u0161anas biroj\u0101, Valsts ie\u0146\u0113mumu
  dienesta nodok\u013cu un muitas policij\u0101, Valsts ie\u0146\u0113muma dienesta
  Iek\u0161\u0113j\u0101s dro\u0161\u012bbas p\u0101rvald\u0113 vai Latvijas Bankas
  Aizsardz\u012bbas p\u0101rvald\u0113.\\n\\nValsts amatperson\u0101m, kuras v\u0113las
  iest\u0101ties Zemessardz\u0113, pirms tam j\u0101p\u0101rliecin\u0101s, vai:\\n\\ndarb\u012bbas
  jomas regul\u0113jo\u0161\u0101 \u0101r\u0113j\u0101 normat\u012bvaj\u0101 akt\u0101
  nav noteikts ierobe\u017eojums amata savieno\u0161anai ar dienestu Zemessardz\u0113;\\n\\niek\u0161\u0113j\u0101
  normat\u012bvaj\u0101 akt\u0101 nav noteikts pien\u0101kums saska\u0146ot/inform\u0113t
  iest\u0101des vad\u012bt\u0101ju par amata savieno\u0161anu visos gad\u012bjumos,
  kad to neparedz \u0101r\u0113jie normat\u012bvie akti.\\n\\nVai pa\u0161vald\u012bbas
  deput\u0101tam ir at\u013cauts savienot amatpersonas amatu ar amatu pa\u0161a uz\u0146\u0113mum\u0101?
  \\n\\nKorupcijas nov\u0113r\u0161anas un apkaro\u0161anas birojs skaidro, ka likum\u0101
  \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\"
  (turpm\u0101k - IKNL) pa\u0161vald\u012bbu deput\u0101tiem nav noteikti speci\u0101lie
  valsts amatpersonas amata savieno\u0161anas ierobe\u017eojumi.\\n\\nIKNL pa\u0161vald\u012bbu
  deput\u0101tiem neierobe\u017eo deput\u0101ta amata savieno\u0161anu ar amatu priv\u0101t\u0101
  komercsabiedr\u012bb\u0101, ta\u010du deput\u0101tiem j\u0101iev\u0113ro visp\u0101r\u0113jie
  valsts amatpersonas amata savieno\u0161anas ierobe\u017eojumi, kuri noteikti IKNL
  6. pant\u0101 un likuma \\\"Par pa\u0161vald\u012bb\u0101m\\\" 38. panta otraj\u0101
  da\u013c\u0101. Tas noz\u012bm\u0113, ka saska\u0146\u0101 ar iepriek\u0161min\u0113to
  pa\u0161vald\u012bbas deput\u0101ts dr\u012bkst ie\u0146emt amatus pa\u0161a dibin\u0101t\u0101
  uz\u0146\u0113mum\u0101.\\n\\nVai pa\u0161vald\u012bbas policists dr\u012bkst savienot
  amatu ar dienestu Zemessardz\u0113? \\n\\nIev\u0113rojot pa\u0161vald\u012bbas policijas
  kompetenci, t\u0101s amatpersonas atbilsto\u0161i likumam \\\"Par intere\u0161u
  konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\" (turpm\u0101k
  - IKNL) ir uzskat\u0101mas par valsts amatperson\u0101m, un t\u0101m ir saisto\u0161i
  IKNL noteiktie pien\u0101kumi, aizliegumi un ierobe\u017eojumi, tostarp amata savieno\u0161anas
  ierobe\u017eojumi.\\n\\nAmats ir darbs vai dienests noteiktu pilnvaru ietvaros publiskas
  personas iest\u0101d\u0113, sabiedriskaj\u0101, politiskaj\u0101 vai reli\u0123iskaj\u0101
  organiz\u0101cij\u0101, k\u0101 ar\u012b komercsabiedr\u012bb\u0101.\\n\\nIKNL pa\u0161vald\u012bbas
  policijas amatperson\u0101m neaizliedz savienot valsts amatpersonas amatu ar dienestu
  Zemessardz\u0113, ta\u010du no Latvijas Republikas Zemessardzes likuma norm\u0101m
  izriet, ka Latvijas pilso\u0146i vecum\u0101 no 18 l\u012bdz 55 gadiem, kas pilda
  dienestu pa\u0161vald\u012bbas policij\u0101, Zemessardz\u0113 netiek uz\u0146emti.\\n\\nSavuk\u0101rt
  person\u0101m, kas jau ie\u0146em amatu Zemessardz\u0113, st\u0101joties valsts
  amatpersonas amat\u0101 pa\u0161vald\u012bbas policij\u0101, nekav\u0113joties rakstveid\u0101
  j\u0101pazi\u0146o Zemessardzei, ka iest\u0101ju\u0161ies apst\u0101k\u013ci, kas
  turpm\u0101k liedz ie\u0146emt amatu Zemessardz\u0113.\\n\\nMaks\u0101tnesp\u0113jas
  administrators atbilsto\u0161i likumam \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu
  valsts amatpersonu darb\u012bb\u0101\\\" (turpm\u0101k \u2013 IKNL) ir uzskat\u0101ms
  par valsts amatpersonu, un tam ir saisto\u0161i IKNL noteiktie pien\u0101kumi, aizliegumi
  un ierobe\u017eojumi, tostarp amata savieno\u0161anas ierobe\u017eojumi.\\n\\nValsts
  amatpersonai ir at\u013cauts savienot valsts amatpersonas amatu ar citu amatu, uz\u0146\u0113muma
  l\u012bguma vai pilnvarojuma izpildi, vai saimniecisko darb\u012bbu individu\u0101l\u0101
  komersanta status\u0101, vai re\u0123istr\u0113joties Valsts ie\u0146\u0113muma
  dienest\u0101 k\u0101 saimniecisk\u0101s darb\u012bbas veic\u0113jam, ja IKNL vai
  cit\u0101 normat\u012bvaj\u0101 akt\u0101 nav paredz\u0113ti valsts amatpersonas
  amata savieno\u0161anas ierobe\u017eojumi. \u0160\u0101dai amata savieno\u0161anai
  nav nepiecie\u0161ams sa\u0146emt rakstveida at\u013cauju.\\n\\nJa nerada intere\u0161u
  konfliktu, nav pretrun\u0101 ar valsts amatpersonai saisto\u0161aj\u0101m \u0113tikas
  norm\u0101m un nekait\u0113 tie\u0161o pien\u0101kumu pild\u012b\u0161anai, at\u013cauts
  savienot valsts amatpersonas amatu ne vair\u0101k k\u0101 ar diviem citiem algotiem
  vai cit\u0101di atl\u012bdzin\u0101miem valsts amatpersonas amatiem vai amatiem
  citas publiskas personas instit\u016bcij\u0101s. Par min\u0113tajiem amatiem nav
  uzskat\u0101ms pedagoga, zin\u0101tnieka, \u0101rsta, veterin\u0101r\u0101rsta,
  profesion\u0101la sportista un rado\u0161ais darbs.\\n\\nMaks\u0101tnesp\u0113jas
  administratoram IKNL nav noteikti speci\u0101lie valsts amatpersonas amata savieno\u0161anas
  ierobe\u017eojumi, tom\u0113r tam ir pien\u0101kums iev\u0113rot citus IKNL noteiktos
  ierobe\u017eojumus un aizliegumus.\\n\\nVai kapit\u0101lsabiedr\u012bbas valdes
  loceklis dr\u012bkst savienot valsts amatpersonas amatu ar pagasta p\u0101rvaldes
  vad\u012bt\u0101ja amatu, ja min\u0113t\u0101 kapit\u0101lsabiedr\u012bba darbojas
  t\u0101 pa\u0161a pagasta p\u0101rvaldes administrat\u012bvaj\u0101 teritorij\u0101,
  nodro\u0161inot to ar komun\u0101lajiem pakalpojumiem? \\n\\nPubliskas personas
  kapit\u0101lsabiedr\u012bbas valdes loceklis atbilsto\u0161i likumam \\\"Par intere\u0161u
  konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\" (IKNL) ir
  uzskat\u0101ms par valsts amatpersonu, un tam ir saisto\u0161i IKNL noteiktie pien\u0101kumi,
  aizliegumi un ierobe\u017eojumi, tostarp amata savieno\u0161anas ierobe\u017eojumi.\\n\\nAmats
  ir darbs vai dienests noteiktu pilnvaru ietvaros publiskas personas iest\u0101d\u0113,
  sabiedriskaj\u0101, politiskaj\u0101 vai reli\u0123iskaj\u0101 organiz\u0101cij\u0101,
  k\u0101 ar\u012b komercsabiedr\u012bb\u0101.\\n\\nValsts amatpersonai ir at\u013cauts
  savienot valsts amatpersonas amatu ar citu amatu, uz\u0146\u0113muma l\u012bguma
  vai pilnvarojuma izpildi, vai saimniecisko darb\u012bbu individu\u0101l\u0101 komersanta
  status\u0101, vai re\u0123istr\u0113joties Valsts ie\u0146\u0113muma dienest\u0101
  k\u0101 saimniecisk\u0101s darb\u012bbas veic\u0113jam, ja IKNL vai cit\u0101 normat\u012bvaj\u0101
  akt\u0101 nav paredz\u0113ti valsts amatpersonas amata savieno\u0161anas ierobe\u017eojumi.\\n\\nIKNL
  noteikti publiskas personas kapit\u0101lsabiedr\u012bbas valdes locek\u013ca speci\u0101lie
  amata savieno\u0161anas ierobe\u017eojumi, tostarp noteikts, ka min\u0113t\u0101s
  valsts amatpersonas var savienot valsts amatpersonas amatu ar citu amatu publiskas
  personas instit\u016bcij\u0101, ja tas nerada intere\u0161u konfliktu un ir sa\u0146emta
  valsts amatpersonas vai kole\u0123i\u0101l\u0101s instit\u016bcijas rakstveida at\u013cauja,
  kura attiec\u012bgo personu iec\u0113lusi, iev\u0113l\u0113jusi vai apstiprin\u0101jusi
  amat\u0101.\\n\\nSitu\u0101cij\u0101, kad kapit\u0101lsabiedr\u012bba darbojas taj\u0101
  pa\u0161\u0101 pagasta p\u0101rvaldes administrat\u012bvaj\u0101 teritorij\u0101,
  nodro\u0161inot komun\u0101los pakalpojumus, var rasties intere\u0161u konflikts,
  jo pagasta p\u0101rvaldes vad\u012bt\u0101jam, kas ir ar\u012b attiec\u012bg\u0101s
  kapit\u0101lsabiedr\u012bbas valdes loceklis, var b\u016bt j\u0101pie\u0146em l\u0113mums
  vai j\u0101veic citas ar valsts amatpersonas amatu saist\u012btas darb\u012bbas,
  kas ietekm\u0113 vai var ietekm\u0113t t\u0101 personisk\u0101s vai mantisk\u0101s
  intereses. Izsniedzot at\u013cauju, vad\u012bt\u0101jam ir pien\u0101kums izv\u0113rt\u0113t,
  vai amata savieno\u0161ana \u0161\u0101d\u0101 situ\u0101cij\u0101 nevar rad\u012bt
  intere\u0161u konfliktu.\\n\\nTurkl\u0101t IKNL valsts amatpersonai divus gadus
  p\u0113c tam, kad t\u0101 pie\u0146\u0113musi l\u0113mumu vai piedal\u012bjusies
  l\u0113muma pie\u0146em\u0161an\u0101 par sabiedrisko pakalpojumu sniedz\u0113ju
  iepirkumu vai veikusi uzraudz\u012bbas, kontroles funkcijas, ir aizliegts ie\u0146emt
  amatus \u0161aj\u0101 kapit\u0101lsabiedr\u012bb\u0101 un ieg\u016bt \u0161\u012bs
  kapit\u0101lsabiedr\u012bbas mantu (t.sk. g\u016bt ien\u0101kumus \u0161aj\u0101
  kapit\u0101lsabiedr\u012bb\u0101).\\n\\nVai pa\u0161vald\u012bbas izgl\u012bt\u012bbas
  iest\u0101des vad\u012bt\u0101ja vietnieks dr\u012bkst savienot valsts amatpersonas
  amatu ar darbu priv\u0101taj\u0101 sektor\u0101, str\u0101d\u0101jot profesion\u0101l\u0101
  vidusskol\u0101 k\u0101 lietvedis vienu dienu ned\u0113\u013c\u0101? \\n\\nPubliskas
  personas iest\u0101des vad\u012bt\u0101ja vietnieks atbilsto\u0161i likumam \\\"Par
  intere\u0161u konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\"
  (IKNL) ir uzskat\u0101ms par valsts amatpersonu, un tam ir saisto\u0161i IKNL noteiktie
  pien\u0101kumi, aizliegumi un ierobe\u017eojumi, tostarp amata savieno\u0161anas
  ierobe\u017eojumi.\\n\\nAmats ir darbs vai dienests noteiktu pilnvaru ietvaros publiskas
  personas iest\u0101d\u0113, sabiedriskaj\u0101, politiskaj\u0101 vai reli\u0123iskaj\u0101
  organiz\u0101cij\u0101, k\u0101 ar\u012b komercsabiedr\u012bb\u0101.\\n\\nValsts
  amatpersonai ir at\u013cauts savienot valsts amatpersonas amatu ar citu amatu, uz\u0146\u0113muma
  l\u012bguma vai pilnvarojuma izpildi, vai saimniecisko darb\u012bbu individu\u0101l\u0101
  komersanta status\u0101, vai re\u0123istr\u0113joties Valsts ie\u0146\u0113muma
  dienest\u0101 k\u0101 saimniecisk\u0101s darb\u012bbas veic\u0113jam, ja IKNL vai
  cit\u0101 normat\u012bvaj\u0101 akt\u0101 nav paredz\u0113ti valsts amatpersonas
  amata savieno\u0161anas ierobe\u017eojumi.\\n\\nIKNL noteikti publiskas personas
  iest\u0101des vad\u012bt\u0101ja speci\u0101lie amata savieno\u0161anas ierobe\u017eojumi,
  un tie paredz aizliegumu ie\u0146emt jebkuru amatu priv\u0101taj\u0101 sektor\u0101.
  Izgl\u012bt\u012bbas iest\u0101des vad\u012bt\u0101ja vietniekam at\u013cauts savienot
  valsts amatpersonas amatu tikai ar amatiem, kuri noteikti IKNL 6. panta ceturtaj\u0101
  da\u013c\u0101 un 7. panta ceturtaj\u0101 da\u013c\u0101.\\n\\nVai publiskas personas
  iest\u0101des vad\u012bt\u0101js ir ties\u012bgs darbiniekam uzdot pild\u012bt valsts
  amatpersonas pien\u0101kumus, un, vai t\u0101d\u0113j\u0101di darbinieks k\u013c\u016bst
  par valsts amatpersonu ar vis\u0101m no t\u0101 izrieto\u0161aj\u0101m sek\u0101m?
  \\n\\nPersona, kurai nav noteikts valsts amatpersonas statuss, dr\u012bkst uz laiku
  pild\u012bt valsts amatpersonas amata pien\u0101kumus.\\n\\nJa publiskas personas
  instit\u016bcij\u0101 nodarbin\u0101tajam uzdod pild\u012bt valsts amatpersonas
  amata pien\u0101kumus, tad min\u0113t\u0101s instit\u016bcijas vad\u012bt\u0101js
  15 dienu laik\u0101 iesniedz attiec\u012bgus groz\u012bjumus valsts amatpersonu
  sarakst\u0101, un uz attiec\u012bg\u0101s valsts amatpersonas amata izpildes laiku,
  bet ne ilg\u0101k k\u0101 uz 18 m\u0113ne\u0161iem, var at\u013caut attiec\u012bg\u0101
  valsts amatpersonas amata savieno\u0161anu ar citu amatu, ja tas nerada intere\u0161u
  konfliktu un nekait\u0113 valsts amatpersonas tie\u0161o pien\u0101kumu pild\u012b\u0161anai.\\n\\nVai
  valsts amatpersonai j\u0101l\u016bdz amata savieno\u0161anas at\u013cauja, ja t\u0101
  darbam iepirkuma komisij\u0101 iecelta ar iest\u0101des vad\u012bt\u0101ja r\u012bkojumu?
  \\n\\nLai noskaidrotu, vai uz valsts amatpersonu, pildot publiska iepirkuma komisijas
  locek\u013ca amata pien\u0101kumus, ir attiecin\u0101mi likuma \\\"Par intere\u0161u
  konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\" (IKNL) noteiktie
  valsts amatpersonas amata savieno\u0161anas ierobe\u017eojumi, ir j\u0101izv\u0113rt\u0113,
  vai publisko iepirkumu komisijas locek\u013ca amats ir cits amats vai papildu pien\u0101kumi.\\n\\nJa
  iest\u0101des vad\u012bt\u0101js iest\u0101des amatpersonai papildus tie\u0161ajiem
  valsts amatpersonas amata pien\u0101kumiem uzdod pild\u012bt publisk\u0101 iepirkuma
  komisijas locek\u013ca amata pien\u0101kumus iest\u0101d\u0113, tad publisk\u0101
  iepirkuma komisijas locek\u013ca amata pien\u0101kumu pild\u012b\u0161ana nav uzskat\u0101ma
  par citu amatu un nav nepiecie\u0161ams sa\u0146emt rakstveida at\u013cauju.\\n\\nT\u0101pat
  IKNL noteikts, ja amatpersona (instit\u016bcija), kas iece\u013c, iev\u0113l\u0113
  vai apstiprina personu valsts amatpersonas amat\u0101, ir t\u0101 pati, kura saska\u0146\u0101
  ar IKNL 7. panta attiec\u012bg\u0101s da\u013cas noteikumiem lemj par at\u013cauju
  savienot valsts amatpersonas amatu ar citiem amatiem, pamatojoties uz personas sniegto
  inform\u0101ciju, jaut\u0101jumu par at\u013cauju savienot amatus izlemj, ar\u012b
  iece\u013cot, iev\u0113lot vai apstiprinot personu attiec\u012bgaj\u0101 amat\u0101.
  \u0160\u0101d\u0101 gad\u012bjum\u0101 nav nepiecie\u0161amas citas at\u013caujas
  attiec\u012bgo amatu savstarp\u0113jai savieno\u0161anai. \u0160\u0101 panta piektaj\u0101
  da\u013c\u0101 min\u0113tos jaut\u0101jumus izv\u0113rt\u0113 un atspogu\u013co
  l\u0113mum\u0101 par iecel\u0161anu, iev\u0113l\u0113\u0161anu vai apstiprin\u0101\u0161anu
  amat\u0101. Amata savieno\u0161anas at\u013cauju var atcelt saska\u0146\u0101 ar
  \u0161\u0101 panta sesto da\u013cu.\\n\\nSavuk\u0101rt publiskas personas instit\u016bcijas
  vad\u012bt\u0101jam ir pien\u0101kums atbilsto\u0161i savai kompetencei nepie\u013caut,
  lai \u0161aj\u0101 instit\u016bcij\u0101 str\u0101d\u0101jo\u0161\u0101s valsts
  amatpersonas non\u0101ktu intere\u0161u konflikta situ\u0101cij\u0101 un \u0161\u0101d\u0101
  situ\u0101cij\u0101 \u012bstenotu valsts amatpersonas amata pilnvaras.\\n\\nInstit\u016bcijas
  vad\u012bt\u0101jam, valsts amatpersonu papildus iece\u013cot cit\u0101 amat\u0101,
  vienlaikus var izlemt jaut\u0101jumu par at\u013caujas izsnieg\u0161anu, atspogu\u013cojot
  to l\u0113mum\u0101 par iecel\u0161anu amat\u0101, un nav nepiecie\u0161ams pie\u0146emt
  atsevi\u0161\u0137u l\u0113mumu par at\u013caujas izsnieg\u0161anu.\\n\\nB\u016bvinspektors,
  ja cit\u0101 likum\u0101 nav noteikti \u012bpa\u0161i amata savieno\u0161anas nosac\u012bjumi,
  papildus likuma \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu valsts amatpersonu
  darb\u012bb\u0101\\\" (IKNL) 6. panta ceturtajai da\u013c\u0101 noteiktajam var
  savienot valsts amatpersonas amatu tikai ar:\\n\\n1) amatu arodbiedr\u012bb\u0101;\\n\\n2)
  citu amatu, uz\u0146\u0113muma l\u012bguma, pilnvarojuma izpildi vai saimniecisko
  darb\u012bbu individu\u0101l\u0101 komersanta status\u0101, vai re\u0123istr\u0113joties
  Valsts ie\u0146\u0113mumu dienest\u0101 k\u0101 saimniecisk\u0101s darb\u012bbas
  veic\u0113jam saska\u0146\u0101 ar likumu \\\"Par iedz\u012bvot\u0101ju ien\u0101kumu
  nodokli\\\", ja \u0161\u012b savieno\u0161ana nerada intere\u0161u konfliktu un
  ir sa\u0146emta iest\u0101des vad\u012bt\u0101ja vai vi\u0146a pilnvarotas personas
  rakstveida at\u013cauja.\\n\\nValdes loceklis vai b\u016bvdarbu vad\u012bt\u0101js
  ir amats IKNL izpratn\u0113, un b\u016bvinspektoram t\u0101 savieno\u0161anai ar
  valsts amatpersonas amatu nepiecie\u0161ams sa\u0146emt rakstveida at\u013cauju.\\n\\nB\u016bvinspektoriem
  ir aizliegts st\u0101ties darba tiesiskaj\u0101s attiec\u012bb\u0101s ar b\u016bvkomersantu
  un sniegt b\u016bvniec\u012bbas pakalpojumus b\u016bvdarbu vad\u012b\u0161anas,
  b\u016bvuzraudz\u012bbas un b\u016bvekspert\u012bzes specialit\u0101t\u0113s, iz\u0146emot
  gad\u012bjumu, ja b\u016bvinspektors IKNL noteiktaj\u0101 k\u0101rt\u012bb\u0101
  ir sa\u0146\u0113mis rakstveida at\u013cauju saimniecisk\u0101s darb\u012bbas veik\u0161anai
  b\u016bvniec\u012bbas pakalpojumu snieg\u0161anai par pirm\u0101s grupas b\u016bvju
  b\u016bvniec\u012bbu \u0101rpus savas kontrol\u0113jam\u0101s administrat\u012bv\u0101s
  teritorijas un ja \u0161o b\u016bvniec\u012bbas pakalpojumu snieg\u0161ana nerada
  intere\u0161u konfliktu, nav pretrun\u0101 ar b\u016bvinspektoram saisto\u0161\u0101m
  \u0113tikas norm\u0101m vai nekait\u0113 b\u016bvinspektora tie\u0161o pien\u0101kumu
  pild\u012b\u0161anai (Ministru kabineta 2014. gada 19. augusta noteikumu Nr. 500
  \\\"Visp\u0101r\u012bgie b\u016bvnoteikumi\\\" 133. punkts).\\n\\nAttiec\u012bgi
  tikai min\u0113taj\u0101 iz\u0146\u0113muma gad\u012bjum\u0101 b\u016bvinspektoram
  ir pie\u013caujams sniegt b\u016bvniec\u012bbas pakalpojumus b\u016bvdarbu vad\u012b\u0161an\u0101.\\n\\nLikum\u0101
  \\\"Par intere\u0161u konflikta nov\u0113r\u0161anu valsts amatpersonu darb\u012bb\u0101\\\"
  nav noteiktas pras\u012bbas, kuras valsts amatpersonai j\u0101nor\u0101da iesniegum\u0101,
  l\u016bdzot amata savieno\u0161anas at\u013cauju. Min\u0113tais likums paredz, kas
  iest\u0101des vad\u012bt\u0101jam j\u0101v\u0113rt\u0113, lemjot par amatu savieno\u0161anu,
  proti, vai min\u0113tais nerad\u012bs intere\u0161u konfliktu, neb\u016bs pretrun\u0101
  ar amatpersonai saisto\u0161aj\u0101m \u0113tikas norm\u0101m un nekait\u0113s t\u0101s
  tie\u0161o pien\u0101kumu veik\u0161anai.\\n\\nIest\u0101des iek\u0161\u0113jos
  normat\u012bvajos aktos var b\u016bt iek\u013cauti nosac\u012bjumi, kas valsts amatpersonai
  nor\u0101d\u0101mi iesniegum\u0101, l\u016bdzot amata savieno\u0161anas at\u013cauju.
  Ar\u012b \u0161iem nosac\u012bjumiem j\u0101b\u016bt t\u0101diem, lai iest\u0101des
  vad\u012bt\u0101js var\u0113tu izv\u0113rt\u0113t, vai amata savieno\u0161ana nerad\u012bs
  intere\u0161u konfliktu, neb\u016bs pretrun\u0101 ar amatpersonai saisto\u0161aj\u0101m
  \u0113tikas norm\u0101m un nekait\u0113s t\u0101s tie\u0161o pien\u0101kumu veik\u0161anai.\\n\\nJa
  iek\u0161\u0113j\u0101 normat\u012bvaj\u0101 regul\u0113jum\u0101 nosac\u012bjumi
  nav noteikti, amatpersonai iesniegum\u0101 j\u0101nor\u0101da, k\u0101du amatu t\u0101
  v\u0113las savienot ar valsts amatpersonas amatu, konkr\u0113t\u0101 amata pien\u0101kumus,
  kur\u0101 laik\u0101 pl\u0101nots tos veikt u.c. inform\u0101ciju, lai iest\u0101des
  vad\u012bt\u0101js var\u0113tu lemt, vai min\u0113tais nerad\u012bs intere\u0161u
  konfliktu, neb\u016bs pretrun\u0101 ar saisto\u0161aj\u0101m \u0113tikas norm\u0101m
  un nekait\u0113s tie\u0161o pien\u0101kumu veik\u0161anai.\\n\\nSaska\u0146\u0101
  ar min\u0113to likumu valsts amatpersona p\u0113c publiskas personas instit\u016bcijas
  vad\u012bt\u0101ja vai vi\u0146a pilnvarotas personas piepras\u012bjuma rakstveid\u0101
  sniedz tai inform\u0101ciju, kas nepiecie\u0161ama, veicot iek\u0161\u0113j\u0101s
  kontroles pas\u0101kumus korupcijas un intere\u0161u konflikta riska nov\u0113r\u0161anai.\\n\\nhttps://www.knab.gov.lv/lv/amata-savienosana\"",
