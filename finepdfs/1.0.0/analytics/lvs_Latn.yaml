  Skaitlis | %     |\\n|-----------|----------|-------|\\n| Teicami   | 0        |
  0%    |\\n| Labi      | 5        | 71.4% |\\n| Gandr\u012bz labi | 2       | 28.6%
  |\\n| Viduv\u0113ji  | 0        | 0%    |\\n| V\u0101ji      | 0        | 0%    |\\n|
  **Iesniegto atbil\u017eu summa** | **7** |       |\\n\\nSavuk\u0101rt jaut\u0101jum\u0101,
  k\u0101 ir izdevies sasniegt studiju kursos noteitos studiju rezult\u0101tus tika
  sa\u0146emtas sekojo\u0161as atbildes. Liel\u0101k\u0101 da\u013ca no 1. kursa studentiem
  nor\u0101d\u012bja, ka ir piln\u012bb\u0101 izdevies sasniegt (56%), k\u0101 n\u0101kam\u0101
  biez\u0101k\u0101 atbilde (20%) tika nor\u0101d\u012bta, ka dr\u012bz\u0101k ir
  izdevies sasniegt. Savuk\u0101rt no 2.kursa stud\u0113jo\u0161iem k\u0101 biez\u0101ka
  atbilde tika nor\u0101d\u012bta dr\u012bz\u0101k ir izdevies sasniegt (43%) un piln\u012bb\u0101
  ir izdevies sasniegt (41%) (Skat\u012bt 6. un 7. att\u0113lu)\\n\\nKoled\u017ea
  katru gadu veic ar\u012b absolventu aptauju. 2021./2022. Gad\u0101 aptauj\u0101tu
  absolventu v\u0113rt\u0113jumu par studiju procesa kvalit\u0101ti ietekm\u0113jo\u0161oem
  faktoriem (skat\u012bt 8. att\u0113l\u0101). Aptauj\u0101 piedal\u012bj\u0101 26
  absolventi un k\u0101 noz\u012bm\u012bg\u0101 studiju ietekm\u0113jo\u0161ie faktori
