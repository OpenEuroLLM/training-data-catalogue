  C\u0113su novad\u0101!\\n\\nnLatvijas Za\u013c\u0101 PaRtija\\n\\nl\u0101m to, ko
  nevar\u0113sim p\u0113c tam \u012bstenot. Nekustam\u0101 \u012bpa\u0161uma nodoklis
