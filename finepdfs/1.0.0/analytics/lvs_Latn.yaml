  kvalifik\u0101cijas l\u012bme\u0146iem.\\n3 Iesp\u0113jama specializ\u0113\u0161an\u0101s
  (atsevi\u0161\u0137u specializ\u0113tu modu\u013cu \u012bsteno\u0161ana) izgl\u012bt\u012bbas
  programmu ietvaros, apg\u016bstot konkr\u0113tas nozares iek\u0101rtu specifiku.
  Nepiecie\u0161ams nodro\u0161in\u0101t, lai profesiju standarti un izgl\u012bt\u012bbas
  programmas iek\u013cauj dz\u0113st\u0101s kvalifik\u0101cijas \\\"Remontatsl\u0113dznieks\\\"
  kompetences.\\n4 Iesp\u0113jama specializ\u0113\u0161an\u0101s (atsevi\u0161\u0137u
  specializ\u0113tu modu\u013cu \u012bsteno\u0161ana) izgl\u012bt\u012bbas programmu
  ietvaros, apg\u016bstot konkr\u0113tas nozares  sp\u0113kratu specifiku. Kvalifik\u0101cijai
  tiek izstr\u0101d\u0101tas profesion\u0101l\u0101s kvalifik\u0101cijas pras\u012bbas
  (PKP).\\n5 Iesp\u0113jama specializ\u0113\u0161an\u0101s (atsevi\u0161\u0137u specializ\u0113tu
  modu\u013cu \u012bsteno\u0161ana) izgl\u012bt\u012bbas programmu ietvaros, apg\u016bstot
  konkr\u0113tas nozares  sp\u0113kratu specifiku.\\n6 Iesp\u0113jama specializ\u0113\u0161an\u0101s
