  valdes iz\u0161\u0137ir\u0161an\u0101s. 2021. gada 21. janv\u0101ra C\u0113su novada
  domes l\u0113mums Nr. 13 piln\u012bb\u0101 atbilst  SIA \\\"C\u0113su tirgus\\\"
  att\u012bst\u012bbas strat\u0113\u0123iskajiem m\u0113r \u0137iem. Jau \u0161obr\u012bd
  biedr\u012bb\u0101 \\\"Vidzemes T\u016brisma asoci\u0101cija\\\" (VTA) ir sagatavots
