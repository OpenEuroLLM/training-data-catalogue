  darbu\\natsl\u0113dznieks\\n9\"", "\"R\u012aGAS STARPTAUTISK\u0100 EKONOMIKAS UN
  BIZNESA ADMINISTR\u0100CIJAS AUGSTSKOLA\\n\\nAPSTIPRIN\u0100TS\\n\\nSen\u0101ta
  s\u0113d\u0113\\n\\n13.05.2015., Prot. nr. 15/1.1-07/05\\n\\nKURSU VEC\u0100KO DARB\u012aBAS
  NOLIKUMS\\n\\n1. Visp\u0101r\u012bgie noteikumi\\n\\n1.1. Kursu vec\u0101ko darb\u012bbas
  galvenais uzdevums ir komunik\u0101cijas un inform\u0101cijas aprites nodro\u0161in\u0101\u0161ana
  studiju proces\u0101 sadarb\u012bb\u0101 ar R\u012bgas Starptautisk\u0101 ekonomikas
  un biznesa administr\u0101cijas augstskolu (turpm\u0101k tekst\u0101 Augstskola)
  un Augstskolas Stud\u0113jo\u0161o pa\u0161p\u0101rvaldi (SP).\\n1.2. Katrs kurs\u0101
  stud\u0113jo\u0161ais var pretend\u0113t jeb tiks izvirz\u012bts par kursa vec\u0101ko.\\n1.3.
  Kursa vec\u0101k\u0101 un vi\u0146a vietnieka v\u0113l\u0113\u0161anas organiz\u0113
  kurss, savstarp\u0113ji vienojoties par balso\u0161anas k\u0101rt\u012bbu. Balso\u0161ana
  var b\u016bt atkl\u0101ta vai aizkl\u0101ta.\\n1.4. Nepiecie\u0161am\u012bbas gad\u012bjum\u0101
  kurss ir ties\u012bgs pieaicin\u0101t SP p\u0101rst\u0101vi balso\u0161anas organiz\u0113\u0161an\u0101.\\n1.5.
  Kandid\u0101ts ir iev\u0113l\u0113ts, ja par vi\u0146u nobalsoju\u0161i vair\u0101k
  nek\u0101 puse no kurs\u0101 stud\u0113jo\u0161ajiem.\\n1.6. Kursa vec\u0101kais
  un vi\u0146a vietnieks tiek izvirz\u012bts un iev\u0113l\u0113ts no kursa stud\u0113jo\u0161o
  vidus m\u0113ne\u0161a laik\u0101 p\u0113c studiju gada s\u0101kuma vai p\u0113c
  iepriek\u0161\u0113j\u0101 kursa vec\u0101k\u0101 pien\u0101kumu pild\u012b\u0161anas
  beig\u0101m.\\n1.7. Kursa vec\u0101kais tiek iev\u0113l\u0113ts kursam vienojoties
  uz noteiktu laika periodu, par to inform\u0113jot programmas direktoru.\\n1.8. Kursa
  vec\u0101kais var tikt atcelts, ja kurss nav apmierin\u0101ts ar kursa vec\u0101k\u0101
  pien\u0101kumu izpildi. \u0160\u0101d\u0101 gad\u012bjum\u0101 kurss organiz\u0113
  atk\u0101rtotu kursa vec\u0101k\u0101 iev\u0113l\u0113\u0161anu, nepiecie\u0161am\u012bbas
  gad\u012bjum\u0101 pieaicinot SP p\u0101rst\u0101vi. Attiec\u012bgi jauniev\u0113l\u0113tais
  kursa vec\u0101kais inform\u0113 kuratoru un SP.\\n1.9. Kursa vec\u0101kais un vietnieks
  savstarp\u0113ji vienojas par pien\u0101kumu sadal\u012b\u0161anu.\\n1.10. Kursu
  vec\u0101ko darb\u012bbu koordin\u0113 SP sadarb\u012bb\u0101 ar programmas direktoru
  vai kuratoru.\\n\\n2. Kursa vec\u0101k\u0101 un vietnieka pien\u0101kumi\\n\\n2.1.
  Nodro\u0161in\u0101t inform\u0101cijas pl\u016bsmas apriti no Augstskolas un SP
  katram kursa biedram, inform\u0113jot gan par studiju aktualit\u0101t\u0113m, gan
  Augstskolas un SP pas\u0101kumiem.\\n2.2. Sadarboties ar SP.\\n\\nR\u012aGAS STARPTAUTISK\u0100
  EKONOMIKAS UN BIZNESA ADMINISTR\u0100CIJAS AUGSTSKOLA\\n\\n2.3. Apzin\u0101t sava
  kursa kop\u0113jo viedokli nepiecie\u0161am\u012bbas gad\u012bjum\u0101 par konkr\u0113tiem
  jaut\u0101jumiem, attiec\u012bgi sniegt inform\u0101ciju studiju programmas direktoram
  , kuratoram vai SP.\\n2.4. Sniegt nepiecie\u0161amo inform\u0101ciju p\u0113c Augstskolas
  vai SP piepras\u012bjuma 7 darba dienu laik\u0101 (pilna laika noda\u013c\u0101
  stud\u0113jo\u0161ajiem) vai 14 dienu laik\u0101 (nepilna laika noda\u013c\u0101
  stud\u0113jo\u0161ajiem) kop\u0161 inform\u0101cijas piepras\u012bjuma sa\u0146em\u0161anas.\\n2.5.
  P\u0101rzin\u0101t savas studiju programmas strukt\u016bru un pras\u012bbas.\\n2.6.
  Studiju programmas \u012bsteno\u0161anas nepiln\u012bbu nov\u0113r\u0161anai vai
  stud\u0113jo\u0161o ties\u012bbu aizst\u0101v\u012bbai kursa v\u0101rd\u0101 iesniegt
  ierosin\u0101jumus studiju programmas vad\u012bt\u0101jam, ja tos ir parakst\u012bju\u0161i
  ne maz\u0101k k\u0101 puse no studiju gad\u0101 stud\u0113jo\u0161ajiem.\\n2.7.
  Apmekl\u0113t kursu vec\u0101ko sapulces un semin\u0101rus, ko organiz\u0113 SP.
  Neiera\u0161an\u0101s gad\u012bjum\u0101 dele\u0123\u0113t k\u0101du no saviem kursa
  biedriem.\\n2.8. Regul\u0101ri sekot l\u012bdzi Augstskolas un SP inform\u0101cijai.\\n2.9.
  Regul\u0101ri komunic\u0113t ar sava kursa kuratoru un p\u0101rrun\u0101t eso\u0161\u0101s
  aktualit\u0101tes.\\n2.10. Veicin\u0101t kursa salied\u0113t\u012bbu, t.sk., kursabiedru
  iesaisti \u0101rpusstudiju aktivit\u0101t\u0113s.\\n\\n3. Kursa vec\u0101k\u0101
  un vietnieka ties\u012bbas\\n\\n3.1. Kursa v\u0101rd\u0101 v\u0113rsties ar ierosin\u0101jumiem
  pie studiju programmas direktora vai kuratora par studiju procesa pilnveido\u0161anai
  un stud\u0113jo\u0161o ties\u012bbu aizst\u0101v\u012bbai.\\n3.2. Sa\u0146emt inform\u0101ciju
  par kursu interes\u0113jo\u0161iem jaut\u0101jumiem no studiju programmas direktora,
  kuratora un SP.\\n3.3. P\u0101rst\u0101v\u0113t kursa intereses un b\u016bt starpniekam
  starp kursu un studiju programmas direktoru, kuratoru vai SP.\\n3.4. Atteikties
  no kursa vec\u0101k\u0101 pien\u0101kumiem. Atteik\u0161an\u0101s gad\u012bjum\u0101
  kursa vec\u0101kais turpina pild\u012bt savus pien\u0101kumus l\u012bdz cita kursa
  vec\u0101k\u0101 iev\u0113l\u0113\u0161anai.\\n3.5. Piedal\u012bties SP r\u012bkotajos
  iek\u0161\u0113jos semin\u0101ros/ apm\u0101c\u012bb\u0101s.\\n\\nSagatavoja:\\n\\nAugstskolas
  RISEBA Stud\u0113jo\u0161o pa\u0161p\u0101rvaldes\\n\\nAkad\u0113misk\u0101 virziena
  vad\u012bt\u0101ja\\n\\nL.I.Kraup\u0161a\\n\\nSaska\u0146ots:\\n\\nProrektors studiju
