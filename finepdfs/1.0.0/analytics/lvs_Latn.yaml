  kalpo k\u0101 papildu inform\u0101cijas kan\u0101ls organiz\u0101cij\u0101m br\u012bvpr\u0101t\u012bgo
  piesaistei.\\n\\nNVO, kas organiz\u0113 br\u012bvpr\u0101t\u012bgo darbu, aicina
