  kabineta sadarb\u012bbas memoranda \u012bsteno\u0161anas padomes locek\u013ciem
  ir sagatavoju\u0161i informat\u012bv\u0101 materi\u0101la projektu par interese
  konflikta riskiem Eiropas Savien\u012bbas fondu projektu \u012bsteno\u0161an\u0101
  un to nov\u0113r\u0161anu.\\n\\nPla\u0161\u0101ka inform\u0101cija: CFLA \u0163imek\u013cvietn\u0113\\n\\nAnketa
  par br\u012bvpr\u0101t\u012bg\u0101 darba iesp\u0113j\u0101m J\u016bsu organiz\u0101cij\u0101.\\n\\nLai
  veicin\u0101tu un populariz\u0113tu br\u012bvpr\u0101t\u012bgo darbu, R\u012bgas
  valstspils\u0113tas pa\u0161vald\u012bbas t\u012bmek\u013ca vietn\u0113 izveidota
  sadalda \\\"Br\u012bvpr\u0101t\u012bgais darbs\\\". T\u0101j\u0101 tiek apkopota
  inform\u0101cija par organiz\u0101cij\u0101m R\u012bg\u0101, kur\u0101s iesp\u0113jams
  veikt br\u012bvpr\u0101t\u012bgo darbu. \u0160\u012b inform\u0101cija ir noder\u012bga
  gan br\u012bvpr\u0101t\u012bg\u0101 darba veic\u0113jiem, kuri var\u0113s uzzin\u0101t
