  5            |\\n\\nLegend:\\n- Nebija b\u016btiski\\n- Driz\u0101k neb\u016btiski\\n-
  Neitr\u0101li\\n- Driz\u0101k b\u016btiski\\n- Loti b\u016btiski\\n\\nStudiju programmas
  m\u0101c\u012bbsp\u0113ki\\n\\nStudiju programmas \u012bsteno\u0161an\u0101 RSU
  SKMK ir iesaist\u012bti 25 doc\u0113t\u0101ji, no kuriem 3 ir zin\u0101tnisk\u0101
  doktora gr\u0101ds un 1 doc\u0113t\u0101js ir zin\u0101tnisk\u0101 gr\u0101da pretendentu,
  5 doc\u0113t\u0101jiem ir \u0101rsta gr\u0101ds. Visi doc\u0113t\u0101ji, kas ir
  iesaist\u012bti studiju programmas \u012bsteno\u0161an\u0101 k\u0101 lektori vai
  vieslektori ir ar vismaz ma\u0123istra gr\u0101du vai ma\u0123istra gr\u0101dam
  piel\u012bdzin\u0101ma izgl\u012bt\u012bba saist\u012bt\u0101 zin\u0101tn\u0113
  nozar\u0113. Studiju programm\u0101 profesion\u0101lo nozares kursu \u012bsteno\u0161an\u0101
  k\u0101 piem\u0113ram Klasisk\u0101 mas\u0101\u017ea un Specialie mas\u0101\u017eas
  veidi ir piesaist\u012bti sertific\u0113ti masieri.\\n\\nDoc\u0113t\u0101ji, kuri
  \u012bsteno studiju procesu RSU Liep\u0101jas fili\u0101l\u0113 \u0161aj\u0101 nodal\u0101
  nav ietverti. Partneraugstskolas doc\u0113t\u0101ji iesaist\u0101s kop\u012bgaj\u0101
  studiju programmas padom\u0113s darb\u0101, Valsts p\u0101rbaud\u012bjumu komisijas
  darb\u0101, un Kvalifik\u0101cijas darbu recenz\u0113\u0161an\u0101.\\n\\nStudiju
  programmas \u012bsteno\u0161an\u0101 iesaist\u012bti augsti kvalific\u0113ti doc\u0113t\u0101ji,
  kas ir nozares eksperti un specializ\u0113ju\u0161ies attiec\u012bg\u0101 studiju
  kursa t\u0113m\u0101. Atsevi\u0161\u0137u kursu satura specifikas d\u0113\u013c
  ir piesaist\u012bti vair\u0101ki vieslektori.\\n\\nStudiju programmas \u012bsteno\u0161an\u0101
  iesaist\u012bto m\u0101c\u012bbsp\u0113ku kvalifik\u0101cija atbilst studiju programmas
  \u012bsteno\u0161anas nosac\u012bjumiem un normat\u012bvo aktu pras\u012bb\u0101m,
  k\u0101 ar\u012b nodro\u0161ina studiju programmas studiju rezult\u0101tu sasnieg\u0161anu.\\n\\nStudiju
  programmas direktore Una Veseta ir ar gandr\u012bz 10 gadu pieredzi rehabilit\u0101cijas
  jom\u0101 un darbojas k\u0101 praktiz\u0113jo\u0161a fizioterapeite un masiere.
  Akt\u012bvi iesaist\u0101s studiju programmas \\\"\u0100rstniecisk\u0101 mas\u0101\u017ea\\\"
  pilnveido\u0161an\u0101 atbilsto\u0161i m\u016bsdienu pras\u012bb\u0101m, kop\u0101
  ar studentiem ir realiz\u0113ti vair\u0101ki zin\u0101tniskie projekti, k\u0101
  piem\u0113ram \\\"Klasisk\u0101s mas\u0101\u017eas kursa intensit\u0101tes noz\u012bme
  vesel\u012bbas st\u0101vok\u013ca uzlabo\u0161an\u0101\\\".\\n\\nJ\u0101uzsver,
  ka studiju programmas realiz\u0101cij\u0101 piedal\u0101s, galvenok\u0101rt, vesel\u012bbas
  apr\u016bpes jomas specialisti. T\u0101d\u0113j\u0101di tiek nodro\u0161in\u0101ts,
  ka studijas sp\u0113s sniegt padzi\u013cin\u0101tas un papla\u0161in\u0101tas zin\u0101\u0161anas
  un izpratni par nozar\u0113 aktu\u0101lo.\\n\\nVair\u0101k inform\u0101cijas skat\u012bt
