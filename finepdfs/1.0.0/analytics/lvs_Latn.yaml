  politikas pl\u0101no\u0161anas dokumenta izstr\u0101d\u0113 p\u0113c eso\u0161\u0101
  R\u012bgas pils\u0113tas sabiedr\u012bbas integr\u0101cijas pamatnost\u0101d\u0146u
  darb\u012bbas perioda (2019.-2024. gads) nosl\u0113guma, t\u0101pat ar\u012b aktualiz\u0113t
  sabiedr\u012bbas integr\u0101cijas jaut\u0101jumus pa\u0161vald\u012bbas l\u012bmen\u012b
  atbilsto\u0161i J\u016bsu kompetencei un ekspert\u012bzei.\\n\\nPla\u0161\u0101ka
  inform\u0101cija \u0161eit\\n\\nS\u0101kusies pieteik\u0161an\u0101s 2025. gada
  sarunu festiv\u0101lam LAMPA.\\n\\nFestiv\u0101ls norisin\u0101sies 20. un 21. j\u016bnij\u0101
  C\u0113s\u012bs. Ikviens interesentam ir iesp\u0113ja pieteikt savu pas\u0101kumu,
  pied\u0101v\u0101jot piln\u012bgi br\u012bvu t\u0113mu un form\u0101tu \u2013 no
  diskusij\u0101m un darbn\u012bc\u0101m l\u012bdz te\u0101tra sp\u0113l\u0113m un
  interakt\u012bv\u0101m aktivit\u0101t\u0113m. Pas\u0101kumu pieteikumus dal\u012bbai
  festiv\u0101l\u0101 var iesniegt l\u012bdz 14. febru\u0101rim.\\n\\nPla\u0161\u0101ka
  inform\u0101cija par pas\u0101kumu pieteik\u0161anas k\u0101rt\u012bbu un festiv\u0101la
  norisi pieejama \u0161eit.\\n\\nAicina iesaist\u012bties materi\u0101la pilnveid\u0113!\\n\\nCentr\u0101l\u0101
