  izmanto bezatl\u012bdz\u012bbas lieto\u0161an\u0101 nodotus zi\u0146u un informat\u012bvi
  anal\u012btiskos raid\u012bjumus tam neparedz\u0113tiem m\u0113r\u0137iem, vai elektroniskajam
