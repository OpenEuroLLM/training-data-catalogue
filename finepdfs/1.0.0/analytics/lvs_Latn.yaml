  politikas pl\u0101no\u0161an\u0101, \u012bsteno\u0161an\u0101 un nov\u0113rt\u0113\u0161an\u0101.\\n\\nPiedaloties
  Konsultat\u012bv\u0101s padomes darb\u012bb\u0101 Jums b\u016bs iesp\u0113ja sadarboties
  ar R\u012bgas domes deput\u0101tiem un pa\u0161vald\u012bbas atbild\u012bgo nozaru
