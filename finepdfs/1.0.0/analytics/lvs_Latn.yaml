  no\u0146emt Service F \u2013 Liep\u0101ja.\\n\\n8. Special prizes of the Organizers:\\n\\nR\u012bko\u0161\u0101ja
  specbalvas:\\n\\nEurosport money prizes for 7 fastest non-manufacturer team crews
  will be given during after-rally press conference.\\n\\nEurosport naudas balvas
  7 \u0101tr\u0101kaj\u0101m ne r\u016bpn\u012bcu komandu ekip\u0101\u017e\u0101m
  tiks pasniegtas p\u0113c-rallija preses konferences laik\u0101.\\n\\n**LIEP\u0100JA**\\n\\nFastest
  crew in the total of SS8 / SS11 \\\"Liep\u0101ja iedvesmo\\\"\\n\\n\u0100tr\u0101kajai
