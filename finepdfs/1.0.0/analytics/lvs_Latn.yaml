  un emocion\u0101lo baud\u012bjumu.\\n\\nGard\u0113\u017eu vakari\u0146as norisin\u0101sies
  \u0161.g. 22. febru\u0101r\u012b - plkst. 19:00. Vakari\u0146u laik\u0101 restor\u0101na
