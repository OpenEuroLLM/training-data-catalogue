  Afriso Ema AB, Kilv\u00e4gen 2, SE-232 37 Arl\u00f6v\\n\\nProdukt: VA-ALERT W, fulltankalarm
  f\u00f6r slutna avloppstankar.\\n\\nTekniska detaljer: DC 4,5 V, IP42\\nOvanst\u00e5ende
  n\u00e4mnda produkt \u00f6verensst\u00e4mmer med f\u00f6ljande europeiska direktiv
  och standarder.\\n\\nDirektiv f\u00f6r elektromagnetisk kompabilitet:\\n- EN 61000-6-4
  (2007)\\n- EN 61000-6-1 (2007)\\n\\nL\u00e5gsp\u00e4nningsdirektivet:\\n- EN 61010-1
  (2010)\\n\\nSign.\\n\\nUrban Nilsson\\nTeknisk chef\\nDatum: 2015-03-11\"", "\"UBit-m\u00f6te
  2018-12-12, L\u00e4nsstyrelsen, lokal Havet\\n\\nDeltagare:\\n\\n* Eric \u00c5kerlund,
  VGR\\n* Tore Jonsson, VGR\\n* Johannes Adolfsson, Bor\u00e5sregionen\\n* Claes Bergqvist,  Hela
  Sverige Ska Leva\\n* Monica Ek Remmerth, L\u00e4nsstyrelsen\\n* Thomas Bj\u00f6rkst\u00e5hl,
  Skaraborgsregionen\\n* Burim Berisha, Coompanion\\n\\nAnteckningar:\\n\\n* Allm\u00e4n
  information\\n\\no Skaraborgs kommunalf\u00f6rbund\\n* Thomas Bj\u00f6rkst\u00e5hl
  \u00e4r ny medlem i UBit-gruppen. Han \u00e4r Lidk\u00f6pings kommuns bredbandssamordnare
  och kontaktperson f\u00f6r stadsn\u00e4tet samt fiberf\u00f6reningarna. Han har
  blivit ombedd av kommunalf\u00f6rbundet i Skaraborg att representera dem i UBit-gruppen.\\n*
  Lidk\u00f6pings kommun har som m\u00e5l att n\u00e5 ut till alla fastighets\u00e4gare
  i kommunen. Stadsn\u00e4tet jobbar tillsammans med fiberf\u00f6reningarna f\u00f6r
  att alla ska f\u00e5 ett erbjudande och inget hush\u00e5ll hamnar utanf\u00f6r.
  Enligt planen kommer de att vara helt klara h\u00f6sten 2019.\\n* IP-Only finns
  inte som aktiv bredbandsbyggare i kommunen, men Telia bygger en del.\\n* Annat som
  han jobbar med nu n\u00e4r bredbandsutbyggnaden \u00e4r helt planerad, \u00e4r att
  jobba mer med drifts\u00e4kerhet och n\u00e4tets roll i totalf\u00f6rsvaret. \u00c4ven
  NIS-direktivet \u00e4r viktigt att ta h\u00f6jd f\u00f6r. Redundans i n\u00e4tet
  h\u00e5ller p\u00e5 att planeras. Det kr\u00e4vs inte s\u00e5 m\u00e5nga mil f\u00f6r
  att f\u00e5 redundans fr\u00e5n tre h\u00e5ll till alla huvudnoder i kommunen.\\n*
  Det finns ingen paraplyf\u00f6rening i Lidk\u00f6ping, utan kommunen och kommunens
  bredbandssamordnare fungerar som paraply. Det \u00e4r ca 40 till 50% anslutningsgrad
  i fiberf\u00f6reningarna och ungef\u00e4r lika mycket i kommunens n\u00e4t\\no Fyrbodals
  kommunalf\u00f6rbund\\n* De har fortfarande ingen representant utsedd att vara med
  i arbetsgruppen, men kommunalf\u00f6rbundet kommer att be IT-chefernas samr\u00e5dsgrupp
  att utse en representant inom kort.\\no Information om mobiln\u00e4ten.\\n* Eric,
  med komplement fr\u00e5n Johannes, presenterade resultatet fr\u00e5n 700 MHzauktionen
  som avslutades i dagarna. Den operat\u00f6r som \u00e5tog sig frekvensbandet med
  ut\u00f6kat t\u00e4ckningskrav blev Telia.\\n* N\u00e4r det g\u00e4ller informationsm\u00f6ten
  s\u00e5 finns \u00e4nnu inga datum eller platser best\u00e4mda i kommunalf\u00f6rbunden.
  Eric p\u00e5minde kommunalf\u00f6rbundsrepresentanterna att jobba vidare med fr\u00e5gan.\\n*
  F\u00f6rslag till riktlinjer om ans\u00f6kan om det nya bredbandsst\u00f6det\\no
  Inga synpunkter har kommit in. Ny tidsgr\u00e4ns \u00e4r mitten av januari 2019.
  Det \u00e4r viktigt att vi best\u00e4mmer oss snart om detta s\u00e5 att vi kan
  g\u00e5 vidare med pilotprojekt.\\no En diskussion uppstod om gr\u00e4nsen p\u00e5
  att projekt under 25 000 kr i eng\u00e5ngsbetalning fr\u00e5n hush\u00e5llen inte
  skall f\u00e5 st\u00f6d. Flera i gruppen tyckte att gr\u00e4nsen \u00e4r f\u00f6r
  h\u00f6gt satt och borde vara 20 000 ist\u00e4llet. Gr\u00e4nsen p\u00e5 25 000
  \u00e4r diskuterad och beslutat sedan tidigare.\\n\\nM\u00f6jligen kan vi \u00e4ndra
  beslutet, men d\u00e5 ska det finnas goda sk\u00e4l och argument f\u00f6r den saken.
  Hur ser den framtida utbyggnaden ut? Eric skickar ut materialet en g\u00e5ng till
  f\u00f6r kommunalf\u00f6rbundsrepresentanterna att l\u00e4sa p\u00e5.\\n\\no Komplettera
  agendan f\u00f6r informationsm\u00f6ten med \\\"nyttan med bredband\\\"\\n\\n* Ny
  id\u00e9 fr\u00e5n Coompanion\\n\\no Burim presenterade en id\u00e9 fr\u00e5n Coompanion
  om vad fiberf\u00f6reningarna ska g\u00f6ra med sina\\nkassor n\u00e4r avskrivningen
  av n\u00e4ten ger upphov till en \u00f6kande m\u00e4ngd pengar i fiberf\u00f6reningarna.
  Det \u00e4r en id\u00e9 om att satsa p\u00e5 f\u00f6rnybar energi. Den nya verksamheten
  kan g\u00f6ra att fiberf\u00f6reningen f\u00e5r st\u00f6rre intresse av att forts\u00e4tta
  driva sin f\u00f6rening lokalt\\no En reaktion fr\u00e5n gruppen var att det \u00e4r
  viktigt att fiberf\u00f6reningen ocks\u00e5 har pengar kvar i ladorna f\u00f6r framtidens
  krav p\u00e5 drift och underh\u00e5ll samt f\u00f6r att bygga robusthet och redundans
  i n\u00e4ten.\\no Detta \u00e4r inte en UBit-fr\u00e5ga, men om fiberf\u00f6reningarna
  ska informeras om m\u00f6jligheten till ny verksamhet s\u00e5 m\u00e5ste man ta
  h\u00e4nsyn till synpunkterna ovan.\\n* Johannes ber\u00e4ttade om kontakter med
  MSB och PTS ang\u00e5ende information om lokalisering av samh\u00e4llsviktig it-infrastruktur
  i kommunerna i h\u00e4ndelse av kris.\\no MSB g\u00f6r idag ingen uppf\u00f6ljning.
  Det \u00e4r inte deras uppdrag. PTS var inte heller insatta i fr\u00e5gan.\\no Det
  vore bra om L\u00e4nsstyrelsen kunde informera om sin del av krisberedskapen.\\no
  Bor\u00e5s inventerar enligt inl\u00e4mnade bygglov. R\u00e4ddningstj\u00e4nsten
  d\u00e4r kan sedan se var ledningsn\u00e4ten ligger.\\no Valter Lindstr\u00f6m skulle
  kunna hj\u00e4lpa kommunerna att f\u00e5 koll. Tore tar kontakt med Valter. Eric
  skickar ut Johannes mail med dagens anteckningar.\\n* Synpunkter fr\u00e5n IP-Only
  p\u00e5 den regionala bredbandsstrategin\\no IP-Only har via mail meddelat att de
  har synpunkter p\u00e5 VGRs bredbandsstrategi och hur den \u00e4r framtagen. Eric
  har skrivit ett svarsbrev till dem. Ett m\u00f6te \u00e4r planerat till den 11 januari
  f\u00f6r att diskutera fr\u00e5gan.\\no Vilka ska vara med p\u00e5 m\u00f6tet den
  11 januari? Fr\u00e5n kommunalf\u00f6rbunden endast Johannes och Pelle. L\u00e4nsstyrelsen
  skulle kunna vara med f\u00f6r att bevaka fr\u00e5gor om\\n\\nbidragsans\u00f6kningar.
  Eventuellt kommer \u00e4ven LRF med.\\n\\n* Fr\u00e5ga fr\u00e5n Camilla Olsson\\n\\no
  Camilla hade fr\u00e5gat vilka krav som kan st\u00e4llas p\u00e5 fiberf\u00f6reningarna
  efter fem respektive sju \u00e5r.\\no Svaret \u00e4r att fiberf\u00f6reningar kan
  s\u00e4lja sina n\u00e4t n\u00e4r som helst, bara k\u00f6paren f\u00f6rbinder sig
  att uppfylla st\u00f6dvillkoren och att f\u00f6rs\u00e4ljningen konkurrensuts\u00e4tts
  p\u00e5 r\u00e4tt s\u00e4tt. Om man g\u00f6r fel s\u00e5 att n\u00e5gon har f\u00e5tt
  en ekonomisk f\u00f6rm\u00e5n, s\u00e5 kan de bli \u00e5terbetalningsskyldiga. N\u00e4ringsdepartementet
  och Jordbruksverket sitter med fr\u00e5gan om hur l\u00f6nsamhetsbed\u00f6mning
  ska g\u00f6ras.\\no Camilla kan ringa till Monica f\u00f6r mer detaljerad information.\\n*
  Redovisning av m\u00f6te med storstadsl\u00e4nen; Stockholm, V\u00e4stra G\u00f6taland
  och Sk\u00e5ne\\no Vi utgick fr\u00e5n diverse statistik som Tore hade samlat ihop.\\no
  Stockholm presenterade en enkel geografisk redovisning: Finns det fiber i n\u00e4rheten
  av hush\u00e5llen, ja eller nej. Har de fiber indraget i huset, ja eller nej. Man
  kan sedan g\u00f6ra GISanalyser av dessa olika alternativ. Ett intressant och enkelt
  f\u00f6rfarande.\\no Arbetet forts\u00e4tter, vi f\u00e5r se om vi kan hitta n\u00e5got
  nyttigt som kan komma ut av detta.\\n\\n* Nya m\u00f6jligheter till VGR-st\u00f6d\\n\\no
  Omr\u00e5den f\u00f6r st\u00f6d till bortbyggande av vita fl\u00e4ckar\\n* Eric
  har f\u00e5tt f\u00f6rslag p\u00e5 tre omr\u00e5den som pilotprojekt. Men kanske
  ska vi inte g\u00f6ra n\u00e5got alls just nu. Monica skickar \u00f6ver kartor fr\u00e5n
  alla nya ans\u00f6kningar till VGR. Kommunalf\u00f6rbundsrepresentanterna g\u00f6r
  en sammanst\u00e4llning \u00f6ver vilka kommuner som redan har byggt ut eller har
  konkreta planer p\u00e5 att bygga ut till alla hush\u00e5ll inom en n\u00e4ra framtid.\\n*
  Monika har f\u00e5tt kontakt med entrepren\u00f6rer som har som aff\u00e4rsid\u00e9
  att bygga i vita fl\u00e4ck-omr\u00e5den och s\u00e4lja n\u00e4ten till befintliga
  n\u00e4t\u00e4gare. Hon tr\u00e4ffar dem och \u00e5terrapporterar till UBit vid
  n\u00e4sta m\u00f6te.\\no Samh\u00e4llsmaster\\n* Johannes har tittat p\u00e5 n\u00e5gra
  norska exempel p\u00e5 samh\u00e4llsmaster. Det finns dock lite olika utg\u00e5ngspunkter
  i Norge och Sverige. Vad b\u00f6r vara v\u00e5r trigger f\u00f6r att st\u00f6dja
  ett projekt?\\n* Eric och Tore ska f\u00f6rst kolla med PTS eller Telia vilka bristomr\u00e5den
  de har valt att bygga till i 700 MHz-auktionen d\u00e4r det finns krav p\u00e5 \u00f6kad
  t\u00e4ckningsgrad.\\n* Vi m\u00e5ste ocks\u00e5 ha koll p\u00e5 \u00f6vriga avtalsvillkor,
  till exempel hur l\u00e4nge tar de p\u00e5 sig att ha utrustningen p\u00e5 plats
  och vad det finns f\u00f6r krav p\u00e5 reservkraft.\\n* Eric kollar med Maria S\u00f6rman
  p\u00e5 PTS om Rakel-utbyggnad och krav p\u00e5 placering av Rakelutrustning i nya
  master.\\n* Kontaktlista\\no Eric och kommunalf\u00f6rbundsrepresentanterna hj\u00e4lps
  \u00e5t att komplettera och korrigera listan med kontaktuppgifter till kommunerna
  i bredbandsfr\u00e5gor.\\n\\n*\\n\\nEU''s Telecom codex\\n\\no Den s\u00e4ger inte
  oss s\u00e5 mycket och p\u00e5verkar inte v\u00e5rt dagliga arbete\\n* GIS-personal\\no
  Eric informerade om att GIS-experten Pernilla har slutat p\u00e5 V\u00e4stra G\u00f6talandsregionen.
  En ers\u00e4ttare kommer i mitten av februari. D\u00e4rut\u00f6ver kommer en praktikant
  i april som kan ta vissa begr\u00e4nsade uppdrag.\\n* Johannes ber\u00e4ttade om
  sin resa till Storbritannien och visade de Powerpointbilder som han drog p\u00e5
  sin presentation av bredbandsl\u00e4get i Bor\u00e5s och Sverige.\\n* N\u00e4sta
  \u00e5rs m\u00f6ten\\no Vi justerade m\u00f6tet den 12 juni till att det ist\u00e4llet
  blir den 13 juni, fortfarande p\u00e5 L\u00e4nsstyrelsen, lokal L\u00e5ngesk\u00e4r.\\no
  Eventuellt kommer h\u00f6stens m\u00f6ten p\u00e5 VGR att flyttas fr\u00e5n Gullbergsvass
  till nya Regionens Hus.  Eric kollar om det \u00e4r m\u00f6jligt att g\u00f6ra.\\n\\nVid
  anteckningarna\\n\\n/Eric \u00c5kerlund\"", "\"M\u00f6te med utrikesministeriets
  h\u00f6gre tj\u00e4nstem\u00e4n\\n\\nVladimir Putin h\u00f6ll ett m\u00f6te med
  h\u00f6gre tj\u00e4nstem\u00e4n vid det ryska utrikesministeriet.\\n\\n(OBS! Mina
  markeringar i texten med fet och kursiv, \u00f6.a.)\\n\\n14 juni 202413:35 Moskva\\n\\nM\u00f6te
  med utrikesministeriets h\u00f6gre tj\u00e4nstem\u00e4n. Foto: Aleksey Maishev,
  RIA Novosti\\n\\nUtrikesminister Sergej Lavrov: Herr president, kolleger,\\n\\nVi
  \u00e4r alltid glada \u00f6ver att se er p\u00e5 utrikesministeriet. L\u00e5t mig
  v\u00e4lkomna er till detta m\u00f6te \u00e5 hela personalens v\u00e4gnar.\\n\\nF\u00f6rst
  och fr\u00e4mst vill jag uttrycka v\u00e5r uppriktiga tacksamhet f\u00f6r er st\u00e4ndiga
  uppm\u00e4rksamhet p\u00e5 utrikesf\u00f6rvaltningen: b\u00e5de f\u00f6r v\u00e5r
  yrkesverksamhet och f\u00f6r att ni f\u00f6rser ministeriet, v\u00e5ra ambassader
  och\\n\\ngeneralkonsulat med allt som kr\u00e4vs f\u00f6r att de tilldelade uppgifterna
  ska kunna fullg\u00f6ras p\u00e5 ett framg\u00e5ngsrikt s\u00e4tt.\\n\\nJag vill
  ocks\u00e5 tacka de kolleger som \u00e4r n\u00e4rvarande h\u00e4r fr\u00e5n presidentens
  kansli, regeringen, den federala f\u00f6rsamlingen och de verkst\u00e4llande myndigheterna.\\n\\nVi
  \u00e4r alltid engagerade i det n\u00e4rmaste samarbetet och samordningen n\u00e4r
  vi fullf\u00f6ljer den enhetliga utrikespolitiska kurs som fastst\u00e4llts av presidenten
  och som beskrivs i det utrikespolitiska konceptet.\\n\\nNi undertecknade den senaste
  versionen av konceptet i mars 2023. Vi arbetar aktivt f\u00f6r att st\u00e4rka v\u00e5ra
  positioner p\u00e5 den internationella arenan och s\u00e4kerst\u00e4lla s\u00e4kerhet
  och de mest gynnsamma externa f\u00f6ruts\u00e4ttningarna f\u00f6r utveckling, med
  v\u00e4gledning av de strategiska m\u00e5l som anges d\u00e4r.\\n\\nSom en prioriterad
  fr\u00e5ga bygger vi upp band med l\u00e4nderna i den globala majoriteten, den globala
  s\u00f6dern och den globala \u00f6stern, omf\u00f6rdelar v\u00e5ra materiella och
  m\u00e4nskliga resurser i enlighet med detta och \u00f6verf\u00f6r dem till de omr\u00e5den
  d\u00e4r de \u00e4r mest efterfr\u00e5gade under de nya geopolitiska f\u00f6rh\u00e5llandena.\\n\\nJag
  vill ocks\u00e5 n\u00e4mna att vi aktivt hj\u00e4lper till att uppr\u00e4tta internationella
  band mellan Krim, folkrepublikerna Donetsk och Lugansk samt regionerna Zaporozhye
  och Kherson. F\u00f6r detta \u00e4ndam\u00e5l har utrikesministeriet redan etablerat
  sina representationskontor i Donetsk och Lugansk och st\u00e4rkt kapaciteten hos
  representationskontoret i Simferopol.\\n\\nJag \u00e4r \u00f6vertygad om att dagens
  m\u00f6te kommer att g\u00f6ra det m\u00f6jligt f\u00f6r oss att specificera alla
  omr\u00e5den av v\u00e5rt praktiska arbete p\u00e5 den internationella arenan.\\n\\nHerr
  president, ni har ordet\\n\\nRysslands president Vladimir Putin: Tack s\u00e5 mycket.\\n\\nKolleger,
  god eftermiddag.\\n\\nDet gl\u00e4der mig att f\u00e5 v\u00e4lkomna er alla och
  uttrycka min tacksamhet f\u00f6r ert aktiva arbete f\u00f6r Rysslands och v\u00e5rt
  folks intressen.\\n\\nVi tr\u00e4ffades senast i detta ut\u00f6kade format i november
  2021, och sedan dess har det intr\u00e4ffat m\u00e5nga avg\u00f6rande och till och
  med \u00f6desdigra h\u00e4ndelser, utan \u00f6verdrift, b\u00e5de i Ryssland och
  runt om i v\u00e4rlden. D\u00e4rf\u00f6r anser jag att det \u00e4r viktigt att bed\u00f6ma
  den aktuella situationen i globala och regionala fr\u00e5gor samt att fastst\u00e4lla
  l\u00e4mpliga uppgifter f\u00f6r utrikesministeriet. Alla dessa uppgifter syftar
  till att uppn\u00e5 v\u00e5rt huvudm\u00e5l: att skapa f\u00f6ruts\u00e4ttningar
  f\u00f6r Rysslands h\u00e5llbara utveckling, s\u00e4kerst\u00e4lla dess s\u00e4kerhet
  och f\u00f6rb\u00e4ttra de ryska familjernas v\u00e4lbefinnande.\\n\\nUnder dagens
  utmanande och of\u00f6ruts\u00e4gbara f\u00f6rh\u00e5llanden kr\u00e4ver v\u00e5rt
  arbete inom detta omr\u00e5de att vi koncentrerar v\u00e5ra anstr\u00e4ngningar,
  initiativ, uth\u00e5llighet och f\u00f6rm\u00e5gor inte bara f\u00f6r att svara
  p\u00e5 aktuella utmaningar utan ocks\u00e5 f\u00f6r att fastst\u00e4lla v\u00e5r
  egen l\u00e5ngsiktiga agenda. Vi b\u00f6r f\u00f6resl\u00e5 m\u00f6jliga l\u00f6sningar
  p\u00e5 grundl\u00e4ggande fr\u00e5gor som inte bara ber\u00f6r oss utan hela det
  internationella samfundet. Det \u00e4r av avg\u00f6rande betydelse att vi diskuterar
  dem med v\u00e5ra partner p\u00e5 ett \u00f6ppet och konstruktivt s\u00e4tt.\\n\\nL\u00e5t
  mig upprepa: v\u00e4rlden f\u00f6r\u00e4ndras snabbt. Den globala politiken, ekonomin
  och den tekniska konkurrensen kommer aldrig att vara densamma som tidigare. Fler
  l\u00e4nder str\u00e4var efter att st\u00e4rka sin suver\u00e4nitet, sin sj\u00e4lvf\u00f6rs\u00f6rjning
  och sin nationella och kulturella identitet. L\u00e4nderna i syd och \u00f6st f\u00e5r
  en allt mer framtr\u00e4dande roll, och Afrika och Latinamerika f\u00e5r en allt
  viktigare roll. Sedan sovjettiden har vi alltid erk\u00e4nt betydelsen av dessa
  regioner, men idag har dynamiken helt f\u00f6r\u00e4ndrats, och detta blir alltmer
  uppenbart. Omvandlingstakten i Eurasien, d\u00e4r m\u00e5nga betydande integrationsprojekt
  p\u00e5g\u00e5r, har ocks\u00e5 accelererat avsev\u00e4rt.\\n\\nDenna nya politiska
  och ekonomiska verklighet ligger nu till grund f\u00f6r den framv\u00e4xande multipol\u00e4ra
  och multilaterala v\u00e4rldsordningen, och detta \u00e4r en oundviklig process.
  Den \u00e5terspeglar den kulturella och civilisatoriska m\u00e5ngfald som \u00e4r
  en naturlig del av m\u00e4nskligheten, trots alla f\u00f6rs\u00f6k till artificiell
  f\u00f6rening.\\n\\nDessa djupg\u00e5ende, systemomfattande f\u00f6r\u00e4ndringar
  inspirerar verkligen till optimism och hopp, eftersom inr\u00e4ttandet av multipolaritet
  och multilateralism i internationella fr\u00e5gor, inklusive respekt f\u00f6r internationell\\n\\nr\u00e4tt
  och bred representation, g\u00f6r det m\u00f6jligt att l\u00f6sa de mest komplexa
  problemen tillsammans f\u00f6r den gemensamma nyttan och att bygga upp \u00f6msesidigt
  f\u00f6rdelaktiga f\u00f6rbindelser och samarbete mellan suver\u00e4na stater f\u00f6r
  folkens v\u00e4lbefinnande och s\u00e4kerhet.\\n\\nEn s\u00e5dan framtidsvision
  st\u00e4mmer \u00f6verens med de allra flesta l\u00e4nders str\u00e4vanden. Detta
  visar sig bland annat i det v\u00e4xande intresset f\u00f6r arbetet i en universell
  sammanslutning som BRICS, som bygger p\u00e5 en kultur av f\u00f6rtroendebaserad
  dialog, suver\u00e4n j\u00e4mlikhet mellan medlemmarna och respekt f\u00f6r varandra.
  Under det ryska ordf\u00f6randeskapet i \u00e5r kommer vi att underl\u00e4tta ett
  smidigt inf\u00f6rlivande av nya BRICS-medlemmar i f\u00f6reningens arbetsorgan.\\n\\nJag
  ber regeringen och utrikesministeriet att forts\u00e4tta det konkreta arbetet och
  dialogen med v\u00e5ra partner f\u00f6r att se till att BRICStoppm\u00f6tet i Kazan
  i oktober kommer att inneh\u00e5lla en betydande upps\u00e4ttning \u00f6verenskomna
  beslut som kommer att best\u00e4mma inriktningen p\u00e5 v\u00e5rt samarbete inom
  politik och s\u00e4kerhet, ekonomi och finans, vetenskap, kultur, idrott och humanit\u00e4ra
  band.\\n\\nI allm\u00e4nhet anser jag att BRICS potential kommer att g\u00f6ra det
  m\u00f6jligt f\u00f6r organisationen att bli en av de viktigaste reglerande institutionerna
  i den multipol\u00e4ra v\u00e4rldsordningen.\\n\\nJag vill i detta sammanhang p\u00e5peka
  att det redan p\u00e5g\u00e5r internationella diskussioner om parametrarna f\u00f6r
  samspelet mellan stater i en multipol\u00e4r v\u00e4rld och om demokratiseringen
  av hela systemet f\u00f6r internationella f\u00f6rbindelser. I detta avseende har
  vi tillsammans med v\u00e5ra kolleger i Oberoende staters samv\u00e4lde kommit \u00f6verens
  om och antagit ett gemensamt dokument om internationella f\u00f6rbindelser i en
  multipol\u00e4r v\u00e4rld. Vi har ocks\u00e5 bjudit in v\u00e5ra partner att diskutera
  detta \u00e4mne p\u00e5 andra internationella plattformar, fr\u00e4mst inom SCO
  (se h\u00e4r, \u00f6.a.) och BRICS.\\n\\nVi \u00e4r intresserade av att fr\u00e4mja
  denna dialog inom FN, bland annat om ett \u00e4mne som \u00e4r s\u00e5 viktigt f\u00f6r
  alla som skapandet av ett odelbart s\u00e4kerhetssystem. Med andra ord m\u00e5ste
  globala fr\u00e5gor baseras p\u00e5 principen att s\u00e4kerheten f\u00f6r vissa
  inte kan garanteras p\u00e5 bekostnad av s\u00e4kerheten f\u00f6r andra.\\n\\nL\u00e5t
  mig p\u00e5minna er om att det internationella samfundet i slutet av 1900-talet,
  efter den intensiva milit\u00e4ra och ideologiska konfrontationen,\\n\\nhade ett
  unikt tillf\u00e4lle att bygga upp en p\u00e5litlig och r\u00e4ttvis s\u00e4kerhetsordning.
  Detta kr\u00e4vde inte mycket - helt enkelt f\u00f6rm\u00e5gan att lyssna till alla
  ber\u00f6rda parters \u00e5sikter och en \u00f6msesidig vilja att ta h\u00e4nsyn
  till dessa \u00e5sikter. V\u00e5rt land var fast beslutet att engagera sig i ett
  konstruktivt arbete av detta slag.\\n\\nEtt annat syns\u00e4tt var dock f\u00f6rh\u00e4rskande.
  V\u00e4stmakterna, med USA i spetsen, ans\u00e5g att de hade vunnit det kalla kriget
  och hade r\u00e4tt att best\u00e4mma hur v\u00e4rlden skulle organiseras. Den praktiska
  manifestationen av detta syns\u00e4tt var projektet med en obegr\u00e4nsad expansion
  av det nordatlantiska blocket i tid och rum, trots att det fanns alternativa id\u00e9er
  f\u00f6r att garantera s\u00e4kerheten i Europa.\\n\\nDe besvarade v\u00e5ra ber\u00e4ttigade
  fr\u00e5gor med urs\u00e4kter och h\u00e4vdade att det inte fanns n\u00e5gra planer
  p\u00e5 att angripa Ryssland och att Natos utvidgning inte var riktad mot Ryssland.
  De gl\u00f6mde effektivt bort de l\u00f6ften som gavs till Sovjetunionen och senare
  Ryssland i slutet av 1980talet och b\u00f6rjan av 1990-talet om att blocket inte
  skulle acceptera nya medlemmar. \u00c4ven om de erk\u00e4nde dessa l\u00f6ften skulle
  de skratta och avf\u00e4rda dem som enbart muntliga f\u00f6rs\u00e4kringar som inte
  var juridiskt bindande.\\n\\nUnder 1990-talet och senare p\u00e5pekade vi konsekvent
  den v\u00e4sterl\u00e4ndska elitens bristf\u00e4lliga strategi. I st\u00e4llet f\u00f6r
  att bara kritisera och varna dem f\u00f6reslog vi alternativ och konstruktiva l\u00f6sningar
  och betonade behovet av att utveckla en europeisk och global s\u00e4kerhetsmekanism
  som skulle vara godtagbar f\u00f6r alla inblandade parter (jag vill understryka
  detta). Det skulle ta f\u00f6r l\u00e5ng tid att r\u00e4kna upp alla de initiativ
  som Ryssland har lagt fram genom \u00e5ren.\\n\\nL\u00e5t oss p\u00e5minna om id\u00e9n
  om ett europeiskt s\u00e4kerhetsf\u00f6rdrag, som vi f\u00f6reslog 2008. I december
  2021 \u00f6verl\u00e4mnades ett memorandum fr\u00e5n det ryska utrikesministeriet
  till USA och Nato, d\u00e4r samma fr\u00e5gor behandlades.\\n\\nAlla v\u00e5ra upprepade
  f\u00f6rs\u00f6k (det \u00e4r om\u00f6jligt att r\u00e4kna upp dem alla) att \u00f6vertyga
  v\u00e5ra partner, liksom v\u00e5ra f\u00f6rklaringar, v\u00e4djanden, varningar
  och f\u00f6rfr\u00e5gningar, m\u00f6ttes dock inte av n\u00e5got svar. V\u00e4stl\u00e4nderna,
  som inte s\u00e5 mycket \u00e4r \u00f6vertygade om att deras sak \u00e4r r\u00e4ttf\u00e4rdig
  som om sin makt och f\u00f6rm\u00e5ga att p\u00e5tvinga resten av v\u00e4rlden vad
  de vill, borts\u00e5g helt enkelt fr\u00e5n andra perspektiv. I b\u00e4sta fall
  f\u00f6reslog de diskussioner\\n\\nom mindre viktiga fr\u00e5gor (som inte bidrog
  till att l\u00f6sa de faktiska problemen) eller fr\u00e5gor som bara gynnade v\u00e4stv\u00e4rlden.\\n\\nDet
  stod snart klart att det v\u00e4sterl\u00e4ndska konceptet, som s\u00e5gs som det
  enda h\u00e5llbara alternativet f\u00f6r s\u00e4kerhet och v\u00e4lst\u00e5nd i
  Europa och v\u00e4rlden, i sj\u00e4lva verket var ineffektivt. L\u00e5t oss p\u00e5minna
  oss om tragedin p\u00e5 Balkan. Inrikespolitiska fr\u00e5gor hade f\u00f6rvisso
  bidragit till problemen i f.d. Jugoslavien, men de f\u00f6rv\u00e4rrades i h\u00f6g
  grad av p\u00e5tr\u00e4ngande yttre inblandning. Vid den tidpunkten framtr\u00e4dde
  huvudprincipen i Natos diplomati som allra tydligast - en djupt bristf\u00e4llig
  princip som inte \u00e4r till n\u00e5gon nytta n\u00e4r det g\u00e4ller att hantera
  komplexa interna konflikter. I grund och botten syftar denna princip till att l\u00e4gga
  skulden p\u00e5 en part (som ofta ogillas av v\u00e4st av olika sk\u00e4l) och sl\u00e4ppa
  l\u00f6s v\u00e4sts hela politiska, informationsm\u00e4ssiga och milit\u00e4ra makt,
  inklusive ekonomiska sanktioner och restriktioner mot den.\\n\\nSenare till\u00e4mpades
  samma metoder i olika l\u00e4nder, som vi k\u00e4nner till alltf\u00f6r v\u00e4l:
  Irak, Syrien, Libyen och Afghanistan. Dessa ingripanden har inte gjort n\u00e5got
  annat \u00e4n att f\u00f6rv\u00e4rra befintliga problem, f\u00f6rst\u00f6ra livet
  f\u00f6r miljontals m\u00e4nniskor, f\u00f6rst\u00f6ra hela stater och skapa nav
  f\u00f6r humanit\u00e4ra och sociala katastrofer samt terroristenklaver. Faktum
  \u00e4r att inget land i v\u00e4rlden \u00e4r immunt mot att ansluta sig till denna
  tragiska lista.\\n\\nTill exempel f\u00f6rs\u00f6ker v\u00e4stv\u00e4rlden just
  nu att p\u00e5 ett fr\u00e4ckt s\u00e4tt blanda sig i Mellan\u00f6sterns angel\u00e4genheter.
  De hade tidigare monopol p\u00e5 denna region, och konsekvenserna av deras agerande
  \u00e4r nu uppenbara f\u00f6r alla. Sydkaukasien och Centralasien \u00e4r ocks\u00e5
  bra exempel. F\u00f6r tv\u00e5 \u00e5r sedan, vid Natos toppm\u00f6te i Madrid,
  f\u00f6rklarades att alliansen nu skulle hantera s\u00e4kerhetsfr\u00e5gor inte
  bara i Euroatlanten utan ocks\u00e5 i Asien och Stillahavsomr\u00e5det. De h\u00e4vdar
  att dessa omr\u00e5den inte kan klara sig utan dem. (se P\u00e5l Jonssons uttalande
  om detta, \u00f6.a.) Detta var uppenbarligen ett f\u00f6rs\u00f6k att \u00f6ka trycket
  p\u00e5 de l\u00e4nder i regionen vars utveckling de har beslutat att begr\u00e4nsa.
  Som ni vet st\u00e5r Ryssland h\u00f6gt upp p\u00e5 denna lista.\\n\\nL\u00e5t mig
  ocks\u00e5 p\u00e5minna er om att det var Washington som undergr\u00e4vde den strategiska
  stabiliteten genom att ensidigt dra sig ur avtalen om antimissilf\u00f6rsvar, om
  avskaffande av missiler med medell\u00e5ng och kort r\u00e4ckvidd och om \u00f6ppet
  luftrum, och genom att tillsammans med sina Natosatelliter avveckla det decenniel\u00e5nga
  systemet med f\u00f6rtroendeskapande \u00e5tg\u00e4rder och vapenkontroll i Europa.\\n\\nSlutligen
  har v\u00e4stl\u00e4ndernas sj\u00e4lvcentrering och arrogans lett oss till en mycket
  farlig situation i dag. Vi r\u00f6r oss farligt n\u00e4ra en punkt d\u00e4r det
  inte finns n\u00e5gon \u00e5terv\u00e4ndo. Kraven p\u00e5 ett strategiskt nederlag
  f\u00f6r Ryssland, som har de st\u00f6rsta k\u00e4rnvapenarsenalerna, visar p\u00e5
  den extrema h\u00e4nsynsl\u00f6shet som v\u00e4stv\u00e4rldens politiker uppvisar.
  Antingen f\u00f6rst\u00e5r de inte omfattningen av det hot de skapar eller s\u00e5
  \u00e4r de helt enkelt uppslukade av sin f\u00f6rest\u00e4llning om o\u00f6vervinnelighet
  och exceptionalism. B\u00e5da scenarierna kan resultera i tragedi.\\n\\nDet \u00e4r
  uppenbart att hela det euroatlantiska s\u00e4kerhetssystemet h\u00e5ller p\u00e5
  att falla s\u00f6nder framf\u00f6r v\u00e5ra \u00f6gon. F\u00f6r n\u00e4rvarande
  \u00e4r det praktiskt taget obefintligt och m\u00e5ste byggas upp p\u00e5 nytt.
  F\u00f6r att uppn\u00e5 detta m\u00e5ste vi samarbeta med intresserade l\u00e4nder,
  och de \u00e4r m\u00e5nga, f\u00f6r att utveckla v\u00e5ra egna strategier f\u00f6r
  att garantera s\u00e4kerheten i Eurasien och sedan l\u00e4gga fram dem f\u00f6r
  bredare internationella \u00f6verl\u00e4ggningar.\\n\\nDetta \u00e4r den uppgift
  som st\u00e4lldes i talet till den federala f\u00f6rsamlingen: att skissera en vision
  f\u00f6r j\u00e4mlik och odelbar s\u00e4kerhet, \u00f6msesidigt f\u00f6rdelaktigt
  och r\u00e4ttvist samarbete och utveckling p\u00e5 den eurasiska kontinenten under
  \u00f6versk\u00e5dlig framtid.\\n\\nVad beh\u00f6ver g\u00f6ras f\u00f6r att uppn\u00e5
  detta och enligt vilka principer?\\n\\nF\u00f6r det f\u00f6rsta\\n\\n\u00e4r det
  viktigt att uppr\u00e4tta en dialog med alla potentiella deltagare i detta framtida
  s\u00e4kerhetssystem. Jag skulle vilja be er att ta upp de n\u00f6dv\u00e4ndiga
  fr\u00e5gorna med l\u00e4nder som \u00e4r \u00f6ppna f\u00f6r ett konstruktivt samspel
  med Ryssland.\\n\\nUnder mitt bes\u00f6k i Kina nyligen diskuterade president Xi
  Jinping och jag denna fr\u00e5ga. Det noterades att det ryska f\u00f6rslaget inte
  \u00e4r mots\u00e4gelsefullt, utan snarare kompletterar och \u00f6verensst\u00e4mmer
  med de grundl\u00e4ggande principerna i det kinesiska globala s\u00e4kerhetsinitiativet.\\n\\nF\u00f6r
  det andra\\n\\n\u00e4r det viktigt att erk\u00e4nna att den framtida s\u00e4kerhetsarkitekturen
  b\u00f6r vara \u00f6ppen f\u00f6r alla eurasiska l\u00e4nder som vill delta i skapandet
  av den. \\\"F\u00f6r alla\\\" inkluderar \u00e4ven europeiska l\u00e4nder och Natol\u00e4nder.
  Vi delar samma kontinent, och vi m\u00e5ste leva och arbeta tillsammans oavsett
  omst\u00e4ndigheterna. Geografin kan inte \u00e4ndras.\\n\\nJa, Rysslands f\u00f6rbindelser
  med EU och m\u00e5nga europeiska l\u00e4nder har f\u00f6rs\u00e4mrats, och det \u00e4r
  viktigt att betona att vi inte b\u00e4r skulden f\u00f6r det. Den antiryska propagandakampanjen,
  som involverar ledande europeiska politiker, \u00e5tf\u00f6ljs av spekulationer
  om att Ryssland har f\u00f6r avsikt att attackera Europa. Jag har tagit upp denna
  fr\u00e5ga tidigare, och det finns ingen anledning att upprepa den h\u00e4r igen.
  Vi f\u00f6rst\u00e5r alla att dessa p\u00e5st\u00e5enden \u00e4r grundl\u00f6sa
  och endast tj\u00e4nar till att r\u00e4ttf\u00e4rdiga en kapprustning.\\n\\nI detta
  sammanhang skulle jag vilja g\u00f6ra en kort utvikning. Hotet mot Europa kommer
  inte fr\u00e5n Ryssland. Det st\u00f6rsta hotet mot europ\u00e9erna \u00e4r deras
  kritiska och \u00f6kande beroende av F\u00f6renta staterna i milit\u00e4ra, politiska,
  tekniska, ideologiska och informationsm\u00e4ssiga avseenden. Europa marginaliseras
  i den globala ekonomiska utvecklingen, kastas in i det kaos som utmaningar som migration
  inneb\u00e4r och f\u00f6rlorar sin internationella st\u00e4llning och kulturella
  identitet.\\n\\nIbland f\u00e5r jag intrycket att europeiska politiker och f\u00f6retr\u00e4dare
  f\u00f6r den europeiska byr\u00e5kratin \u00e4r mer r\u00e4dda f\u00f6r att hamna
  i on\u00e5d hos Washington \u00e4n f\u00f6r att f\u00f6rlora sitt eget folks f\u00f6rtroende.
  Det nyligen genomf\u00f6rda valet till Europaparlamentet har ocks\u00e5 visat detta.
  Europeiska politiker tolererar f\u00f6r\u00f6dmjukelser, of\u00f6rsk\u00e4mdheter
  och skandaler, s\u00e5som \u00f6vervakning av europeiska ledare (.ex. Angela Merkel,
  se h\u00e4r, \u00f6.a.), medan F\u00f6renta staterna helt enkelt utnyttjar dem f\u00f6r
  egen vinning. De tvingas t.ex. k\u00f6pa dyr gas, som kostar tre till fyra g\u00e5nger
  mer i Europa \u00e4n i USA. Dessutom pressas europeiska l\u00e4nder att \u00f6ka
  vapenleveranserna till Ukraina. Kraven \u00e4r konstanta, och sanktioner mot europeiska
  ekonomiska akt\u00f6rer inf\u00f6rs utan tvekan.\\n\\nDe pressar nu sina partner
  att f\u00f6rse Ukraina med fler vapen och \u00f6ka sin kapacitet att tillverka artilleripj\u00e4ser.
  Vem kommer att beh\u00f6va dessa granater n\u00e4r konflikten i Ukraina \u00e4r
  \u00f6ver? Hur garanterar detta den europeiska milit\u00e4ra s\u00e4kerheten? Det
  \u00e4r sv\u00e5rt att f\u00f6rst\u00e5. USA investerar i milit\u00e4r teknik, s\u00e4rskilt
  avancerad framtida teknik som utforskning av rymden, moderna dr\u00f6nare och anfallssystem
  som bygger p\u00e5 nya fysikaliska principer. F\u00f6renta staterna finansierar
  omr\u00e5den som kommer att forma karakt\u00e4ren p\u00e5 framtida v\u00e4pnade
  konflikter, liksom nationers milit\u00e4ra och politiska makt och deras st\u00e4llning
  i v\u00e4rlden. Dessa l\u00e4nder f\u00f6rv\u00e4ntas investera i omr\u00e5den som
  \u00e4r av intresse f\u00f6r USA. Detta inneb\u00e4r dock inte att den europeiska
  potentialen ut\u00f6kas. L\u00e5t dem g\u00f6ra som de vill. Vi kommer f\u00f6rmodligen
  att dra nytta av det, men i sj\u00e4lva verket \u00e4r det s\u00e5 situationen ser
  ut.\\n\\nOm Europa vill forts\u00e4tta att vara ett oberoende centrum f\u00f6r global
  utveckling och en kulturell och civilisatorisk pol p\u00e5 v\u00e5r planet, b\u00f6r
  det definitivt uppr\u00e4tth\u00e5lla goda och v\u00e4nskapliga f\u00f6rbindelser
  med Ryssland. Viktigast av allt \u00e4r att vi \u00e4r redo f\u00f6r detta.\\n\\nPolitiker
  som verkligen \u00e4r europeiska och globala, som \u00e4r patrioter f\u00f6r sina
  l\u00e4nder och nationer, f\u00f6rst\u00e5r faktiskt detta enkla och uppenbara faktum.
  De t\u00e4nker i termer av historiska kategorier och \u00e4r inte bara f\u00f6ljare
  av n\u00e5gon annans vilja och inflytande. Charles de Gaulle talade om detta under
  efterkrigstiden. Jag minns mycket v\u00e4l att jag deltog i ett samtal 1991 d\u00e4r
  Tysklands f\u00f6rbundskansler Helmut Kohl betonade vikten av partnerskap mellan
  Europa och Ryssland. Jag hoppas att nya generationer av europeiska politiker s\u00e5
  sm\u00e5ningom kommer att \u00e5teruppr\u00e4tta detta arv.\\n\\nN\u00e4r det g\u00e4ller
  F\u00f6renta staterna leder de nuvarande globalistiska liberala eliternas oavbrutna
  f\u00f6rs\u00f6k att sprida sin ideologi \u00f6ver hela v\u00e4rlden, att p\u00e5
  ett eller annat s\u00e4tt uppr\u00e4tth\u00e5lla sin imperialistiska status och
  dominans, bara till att landet blir \u00e4nnu mer utmattat, att det f\u00f6rvandlas
  till ett f\u00f6rfall och att det klart strider mot det amerikanska folkets verkliga
  intressen. Om det inte vore f\u00f6r denna \u00e5terv\u00e4ndsgr\u00e4ndspolitik,
  som drivs av en aggressiv messianism som bygger p\u00e5 tron p\u00e5 den egna \u00f6verl\u00e4gsenheten
  och exceptionalismen, skulle de internationella f\u00f6rbindelserna ha stabiliserats
  f\u00f6r l\u00e4nge sedan.\\n\\nF\u00f6r det tredje\\n\\n\u00e4r det n\u00f6dv\u00e4ndigt
  att avsev\u00e4rt intensifiera dialogprocessen mellan multilaterala organisationer
  som redan \u00e4r verksamma i Eurasien f\u00f6r att fr\u00e4mja id\u00e9n om ett
  eurasiskt s\u00e4kerhetssystem, framf\u00f6r allt s\u00e5dana organisationer som
  Unionsstaten (se h\u00e4r, \u00f6.a.), Organisationen f\u00f6r det kollektiva s\u00e4kerhetsf\u00f6rdraget
  (CSTO, se h\u00e4r, \u00f6.a.), Eurasiska ekonomiska unionen (EaEU, se h\u00e4r,
  \u00f6.a.), Oberoende staters samv\u00e4lde (OSS eller CIS, se h\u00e4r, \u00f6.a.)
  och Shanghai Cooperation Organisation (SCO, se h\u00e4r, \u00f6.a.).\\n\\nVi anser
  att det \u00e4r m\u00f6jligt att andra inflytelserika eurasiska sammanslutningar
  fr\u00e5n Sydostasien till Mellan\u00f6stern kommer att ansluta sig till dessa processer
  i framtiden.\\n\\nF\u00f6r det fj\u00e4rde\\n\\nanser vi att tiden \u00e4r mogen
  f\u00f6r att inleda en bred diskussion om ett nytt system med bilaterala och multilaterala
  garantier f\u00f6r kollektiv s\u00e4kerhet i Eurasien. Samtidigt \u00e4r det n\u00f6dv\u00e4ndigt
  att p\u00e5 l\u00e5ng sikt gradvis fasa ut den milit\u00e4ra n\u00e4rvaron av externa
  makter i den eurasiska regionen.\\n\\nVi \u00e4r naturligtvis medvetna om att denna
  punkt kan verka orealistisk i den nuvarande situationen, men det kommer att f\u00f6r\u00e4ndras.
  Men om vi bygger upp ett tillf\u00f6rlitligt s\u00e4kerhetssystem i framtiden kommer
  det helt enkelt inte att finnas n\u00e5got behov av en s\u00e5dan n\u00e4rvaro av
  milit\u00e4ra kontingenter utanf\u00f6r regionen. \u00c4rligt talat finns det inget
  behov i dag heller - bara ockupation och det \u00e4r allt (man kan t.ex. betrakta
  Tyskland som de facto ockuperat eftersom det finns omkring 50 000 amerikanska soldater
  d\u00e4r, stationerade p\u00e5 ett stort antal baser. Snart f\u00f6rfogar man ocks\u00e5
  \u00f6ver 17 i Sverige enl. DCA-avtalet, se ocks\u00e5 h\u00e4r, \u00f6.a.).\\n\\nI
  den slutliga analysen anser vi att l\u00e4nder och regionala strukturer i Eurasien
  sj\u00e4lva b\u00f6r identifiera specifika samarbetsomr\u00e5den f\u00f6r gemensam
  s\u00e4kerhet. Med detta som ledstj\u00e4rna m\u00e5ste de ocks\u00e5 bygga upp
  ett system av fungerande institutioner, mekanismer och avtal som verkligen skulle
  tj\u00e4na till att uppn\u00e5 gemensamma m\u00e5l f\u00f6r stabilitet och utveckling.\\n\\nI
  det avseendet st\u00f6der vi v\u00e5ra vitryska v\u00e4nners initiativ att utveckla
  ett programdokument - en stadga f\u00f6r multipolaritet och m\u00e5ngfald under
  2000-talet. Det kan formulera inte bara ramprinciperna f\u00f6r den eurasiska arkitekturen
  som bygger p\u00e5 de grundl\u00e4ggande normerna i internationell r\u00e4tt, utan
  ocks\u00e5 en strategisk vision av multipolaritetens natur i en bredare bem\u00e4rkelse
  och multilateralism som ett nytt system f\u00f6r internationella f\u00f6rbindelser
  som skulle ers\u00e4tta den v\u00e4stcentrerade v\u00e4rlden. Jag anser att det
  \u00e4r viktigt och vill be er att grundligt arbeta med detta dokument tillsammans
  med v\u00e5ra partner och med alla intresserade stater. Jag vill till\u00e4gga att
  n\u00e4r vi diskuterar s\u00e5 komplicerade och omfattande fr\u00e5gor beh\u00f6ver
  vi en s\u00e5 bred representation som m\u00f6jligt och ett beaktande av olika syns\u00e4tt
  och st\u00e5ndpunkter.\\n\\nF\u00f6r det femte\\n\\nb\u00f6r en avg\u00f6rande del
  av det eurasiska s\u00e4kerhets- och utvecklingssystemet definitivt vara fr\u00e5gor
  som r\u00f6r ekonomi, social v\u00e4lf\u00e4rd, integration och \u00f6msesidigt
  f\u00f6rdelaktigt samarbete, liksom att ta\\n\\nitu med s\u00e5dana gemensamma problem
  som att \u00f6vervinna fattigdom, oj\u00e4mlikhet, klimatet, milj\u00f6n och utveckla
  mekanismer f\u00f6r att bem\u00f6ta hoten fr\u00e5n pandemier och kriser i den globala
  ekonomin. Allt detta \u00e4r viktigt.\\n\\nGenom sitt agerande har v\u00e4stv\u00e4rlden
  inte bara undergr\u00e4vt den milit\u00e4rpolitiska stabiliteten i v\u00e4rlden.
  Genom sina sanktioner och handelskrig har man \u00e4ventyrat och f\u00f6rsvagat
  de viktigaste marknadsinstitutionerna. Genom att anv\u00e4nda IMF och V\u00e4rldsbanken
  och vrida p\u00e5 klimatagendan har man h\u00e4mmat utvecklingen i det globala syd.
  Genom att ge efter i konkurrensen, till och med enligt de regler som v\u00e4stv\u00e4rlden
  har skrivit f\u00f6r sig sj\u00e4lv, till\u00e4mpar man prohibitiva hinder och all
  slags protektionism. F\u00f6renta staterna har s\u00e5ledes \u00f6vergett V\u00e4rldshandelsorganisationen
  som en internationell handelsregulator. Allt \u00e4r blockerat. Under tiden ut\u00f6vas
  trycket inte bara p\u00e5 konkurrenterna utan \u00e4ven p\u00e5 deras egna satelliter.
  Det r\u00e4cker med att se hur de nu \\\"suger musten ur\\\" de europeiska ekonomierna
  som balanserar p\u00e5 randen till recession.\\n\\nV\u00e4stl\u00e4nderna har fryst
  en del av Rysslands tillg\u00e5ngar och valutareserver. Nu f\u00f6rs\u00f6ker de
  uppfinna n\u00e5gon r\u00e4ttslig motivering f\u00f6r sitt o\u00e5terkalleliga till\u00e4gnande.
  Men \u00e5 andra sidan, trots alla ohederliga jurister, kommer st\u00f6ld sj\u00e4lvklart
  att f\u00f6rbli st\u00f6ld och inte passera ostraffat.\\n\\nFr\u00e5gan \u00e4r
  \u00e4nnu djupare. Genom att stj\u00e4la ryska tillg\u00e5ngar kommer de att ta
  ytterligare ett steg mot att f\u00f6rst\u00f6ra det system som de sj\u00e4lva skapade
  och som under m\u00e5nga decennier garanterade deras v\u00e4lst\u00e5nd, gjorde
  det m\u00f6jligt f\u00f6r dem att konsumera mer \u00e4n de tj\u00e4nade och lockade
  till sig pengar fr\u00e5n hela v\u00e4rlden genom skulder och \u00e5taganden. Nu
  b\u00f6rjar det st\u00e5 klart f\u00f6r alla l\u00e4nder, f\u00f6retag och statliga
  investeringsfonder att deras tillg\u00e5ngar och reserver \u00e4r l\u00e5ngt ifr\u00e5n
  s\u00e4kra, b\u00e5de juridiskt och ekonomiskt. Och vem som helst kan st\u00e5 n\u00e4st
  p\u00e5 tur att exproprieras av USA och v\u00e4stv\u00e4rlden, det kan ocks\u00e5
  vara de utl\u00e4ndska statliga investeringsfonderna.\\n\\nDet finns redan en v\u00e4xande
  misstro mot det finansiella system som bygger p\u00e5 v\u00e4stv\u00e4rldens reservvalutor.
  Det har f\u00f6rekommit ett visst utfl\u00f6de av medel fr\u00e5n v\u00e4rdepapper
  och obligationer i v\u00e4stl\u00e4nderna, liksom fr\u00e5n vissa europeiska banker,
  som fram till ganska nyligen ans\u00e5gs vara helt tillf\u00f6rlitliga att placera
  kapital i. Nu tas det ocks\u00e5 ut guld fr\u00e5n dessa banker. Och detta \u00e4r
  r\u00e4tt sak att g\u00f6ra.\\n\\nJag anser att vi p\u00e5 allvar m\u00e5ste intensifiera
  skapandet av effektiva och s\u00e4kra bilaterala och multilaterala utl\u00e4ndska
  ekonomiska mekanismer som alternativ till dem som kontrolleras av v\u00e4stv\u00e4rlden.
  Detta inbegriper en ut\u00f6kning av avr\u00e4kningarna i nationella valutor, skapandet
  av oberoende betalningssystem och uppbyggnaden av v\u00e4rdekedjor som kringg\u00e5r
  de kanaler som blockeras eller \u00e4ventyras av v\u00e4stv\u00e4rlden.\\n\\nNaturligtvis
  \u00e4r det n\u00f6dv\u00e4ndigt att forts\u00e4tta anstr\u00e4ngningarna att utveckla
  internationella transportkorridorer i Eurasien, kontinenten med Ryssland som sin
  naturliga geografiska k\u00e4rna. (n\u00e5got som Kinas Belt and Road-projekt handlar
  om, se h\u00e4r, \u00f6.a.)\\n\\nGenom utrikesministeriet instruerar jag er att
  s\u00e5 mycket som m\u00f6jligt hj\u00e4lpa till med att utveckla internationella
  avtal inom alla dessa omr\u00e5den. De \u00e4r oerh\u00f6rt viktiga f\u00f6r att
  st\u00e4rka det ekonomiska samarbetet mellan v\u00e5rt land och v\u00e5ra partner.
  Detta b\u00f6r ocks\u00e5 ge en ny impuls till att bygga ett stort eurasiskt partnerskap,
  som i grund och botten kan bli en socioekonomisk grund f\u00f6r ett nytt odelbart
  s\u00e4kerhetssystem i Europa.\\n\\nKollegor,\\n\\nV\u00e5ra f\u00f6rslag syftar
  till att skapa ett system d\u00e4r alla nationer kan k\u00e4nna sig trygga. Med
  ett s\u00e5dant ramverk skulle vi kunna n\u00e4rma oss dagens m\u00e5nga konflikter
  p\u00e5 ett annat och mer konstruktivt s\u00e4tt. Fr\u00e5gorna om os\u00e4kerhet
  och \u00f6msesidig misstro \u00e4r inte begr\u00e4nsade till den eurasiska kontinenten;
  \u00f6kande sp\u00e4nningar \u00e4r uppenbara \u00f6ver hela v\u00e4rlden. V\u00e5r
  v\u00e4rlds sammankoppling och \u00f6msesidiga beroende \u00e4r st\u00e4ndigt uppenbart,
  med Ukrainakrisen som ett tragiskt exempel med \u00e5terverkningar som sprider sig
  \u00f6ver hela v\u00e4rlden.\\n\\nJag vill genast klarg\u00f6ra f\u00f6ljande: krisen
  i Ukraina \u00e4r inte en konflikt mellan tv\u00e5 stater eller folk som beror p\u00e5
  problem dem emellan. Om s\u00e5 vore fallet r\u00e5der det ingen tvekan om att ryssar
  och ukrainare, som f\u00f6renas av en gemensam historia och kultur, andliga v\u00e4rderingar
  och miljontals familjeband och m\u00e4nskliga kontakter, skulle ha hittat en r\u00e4ttvis
  l\u00f6sning p\u00e5 alla tvister och meningsskiljaktigheter.\\n\\nSamtidigt \u00e4r
  situationen annorlunda eftersom konfliktens r\u00f6tter inte finns i de bilaterala
  relationerna. H\u00e4ndelserna i Ukraina \u00e4r ett direkt resultat av den globala
  och europeiska utvecklingen under slutet av 1900-talet och b\u00f6rjan av 2000-talet.
  De h\u00e4rr\u00f6r fr\u00e5n den aggressiva,\\n\\noh\u00e4mmade och fullst\u00e4ndigt
  h\u00e4nsynsl\u00f6sa politik som v\u00e4stv\u00e4rlden har f\u00f6rt under m\u00e5nga
  \u00e5r, l\u00e5ngt innan den s\u00e4rskilda milit\u00e4ra operationen inleddes
  (se t.ex. h\u00e4r, \u00f6.a.).\\n\\nEliten i v\u00e4stl\u00e4nderna satte, som
  jag n\u00e4mnde tidigare idag, kursen f\u00f6r en fortsatt geopolitisk omstrukturering
  av v\u00e4rlden efter det kalla krigets slut. De str\u00e4vade efter att uppr\u00e4tta
  och genomdriva den s\u00e5 kallade regelbaserade ordningen (se h\u00e4r, \u00f6.a.),
  d\u00e4r starka, suver\u00e4na och sj\u00e4lvf\u00f6rs\u00f6rjande stater helt enkelt
  inte h\u00f6r hemma.\\n\\nDetta f\u00f6rklarar den uppd\u00e4mningspolitik (containment;
  inneslutning, kontroll, uppd\u00e4mning, \u00f6.a.) som riktas mot v\u00e5rt land.
  Vissa personer i F\u00f6renta staterna och Europa f\u00f6rklarar \u00f6ppet m\u00e5len
  f\u00f6r denna politik och talar i dag om den s\u00e5 kallade avkoloniseringen av
  Ryssland. I grund och botten \u00e4r detta ett f\u00f6rs\u00f6k att ideologiskt
  r\u00e4ttf\u00e4rdiga uppdelningen av v\u00e5rt fosterland efter etniska linjer.
  Uppdelningen av Sovjetunionen och Ryssland har varit ett diskussions\u00e4mne under
  l\u00e5ng tid, vilket alla i detta rum \u00e4r v\u00e4l medvetna om. (se h\u00e4r,
  och h\u00e4r, \u00f6.a.)\\n\\nGenom att f\u00f6lja denna strategi str\u00e4vade
  v\u00e4stl\u00e4nderna efter att absorbera och milit\u00e4rt och politiskt utveckla
  territorier n\u00e4ra oss. Det har varit fem, nu sex, v\u00e5gor av NATO-utvidgning.
  De f\u00f6rs\u00f6kte omvandla Ukraina till sitt f\u00e4ste, ett \\\"anti-Ryssland\\\".
  F\u00f6r att uppn\u00e5 dessa m\u00e5l investerade de pengar och resurser, k\u00f6pte
  politiker och hela partier, skrev om historien och utbildningsprogrammen och gav
  n\u00e4ring \u00e5t grupper av nynazister och radikaler. De gjorde allt f\u00f6r
  att underminera v\u00e5ra mellanstatliga band, splittra oss och v\u00e4nda v\u00e5ra
  folk mot varandra.\\n\\nDe skulle ha bedrivit denna politik \u00e4nnu mer fr\u00e4ckt
  och ogenerat om det inte hade varit f\u00f6r syd\u00f6stra Ukraina, den region som
  i \u00e5rhundraden hade varit en del av det historiska Storryssland, som stod i
  v\u00e4gen f\u00f6r dem. De m\u00e4nniskor som bodde d\u00e4r, och som fortfarande
  bor d\u00e4r, fortsatte att f\u00f6respr\u00e5ka b\u00e4ttre och n\u00e4rmare band
  med v\u00e5rt land, \u00e4ven n\u00e4r Ukraina f\u00f6rklarade sig sj\u00e4lvst\u00e4ndigt
  1991. Etniska ryssar och ukrainare, liksom representanter f\u00f6r andra etniska
  grupper, f\u00f6renades av det ryska spr\u00e5ket, kulturen, traditionerna och det
  historiska minnet. (se spr\u00e5kkarta, politisk karta, \u00f6.a.)\\n\\nUkrainska
  presidenter och presidentaspiranter var helt enkelt tvungna att ta h\u00e4nsyn till
  dessa m\u00e4nniskors \u00e5sikter, st\u00e4mningar och intressen de miljontals
  m\u00e4nniskor som bodde i sydost. De ukrainska politikerna beh\u00f6vde deras r\u00f6ster.
  Men efter att ha anv\u00e4nt sig av deras st\u00f6d n\u00e4r de\\n\\nkandiderade
  till h\u00f6ga poster man\u00f6vrerade de sig senare ur att g\u00f6ra vad de lovat
  (Zelensky gick till val p\u00e5 att skapa fred, se h\u00e4r, \u00f6.a.), tog sig
  ur det, lj\u00f6g och h\u00e4nvisade till det s\u00e5 kallade europeiska valet.
  De v\u00e5gade dock inte klippa alla band med Ryssland, eftersom syd\u00f6stra Ukraina
  hade en annan syn, och en syn som man m\u00e5ste r\u00e4kna med. Denna dubbelhet
  har alltid varit n\u00e4rvarande i den ukrainska regeringens politik, \u00e4nda
  sedan sj\u00e4lvst\u00e4ndigheten erk\u00e4ndes.\\n\\nV\u00e4st s\u00e5g det naturligtvis.
  V\u00e4stpolitikerna har l\u00e4nge varit medvetna om de problem i Ukraina som skulle
  kunna uppst\u00e5; de ins\u00e5g ocks\u00e5 syd\u00f6stra delens betydelse som en
  \u00e5terh\u00e5llande faktor och visste att inte ens \u00e5ratal av propaganda
  skulle kunna f\u00f6r\u00e4ndra detta radikalt. Inte f\u00f6r att de inte f\u00f6rs\u00f6kte,
  men det var verkligen sv\u00e5rt att v\u00e4nda p\u00e5 situationen.\\n\\nHur de
  \u00e4n f\u00f6rs\u00f6kte fanns det inte en chans att de skulle kunna f\u00f6rvr\u00e4nga
  den historiska identiteten och medvetenheten hos majoriteten av m\u00e4nniskorna
  i syd\u00f6stra Ukraina, att utrota de goda k\u00e4nslorna f\u00f6r Ryssland och
  k\u00e4nslan av v\u00e5r historiska gemenskap, inte ens hos de yngre generationerna.
  Och de best\u00e4mde sig f\u00f6r att anv\u00e4nda v\u00e5ld igen, att g\u00e5 och
  bryta ner m\u00e4nniskorna i syd\u00f6st, som om de inte spelade n\u00e5gon roll.
  F\u00f6r att g\u00f6ra detta t\u00e4nkte de ut, organiserade och finansierade en
  v\u00e4pnad kupp, och utnyttjade tydligt sv\u00e5righeterna och de politiska stridigheterna
  i Ukraina. De f\u00f6rberedde den m\u00e5lmedvetet och konsekvent.\\n\\nEn massiv
  v\u00e5g av upplopp, v\u00e5ld och mord svepte genom ukrainska st\u00e4der. Slutligen
  tog radikala nationalister \u00f6ver makten i Kiev. Deras aggressiva nationalistiska
  slagord, inklusive rehabilitering av nazistiska hantlangare (bl.a. Stepan Bandera,
  se h\u00e4r, och h\u00e4r, och h\u00e4r, \u00f6.a.), proklamerades p\u00e5 en niv\u00e5
  av statlig ideologi. De inledde en politik f\u00f6r att avskaffa det ryska spr\u00e5ket
  i alla aspekter av regering och samh\u00e4lle, och intensifierade trycket p\u00e5
  ortodoxa troende och inblandning i kyrkliga angel\u00e4genheter, vilket s\u00e5
  sm\u00e5ningom ledde till en schism. Ingen verkade l\u00e4gga m\u00e4rke till den
  inblandningen, som om det inte var n\u00e5gon stor sak. F\u00f6rs\u00f6k n\u00e5got
  liknande n\u00e5gon annanstans, alla kommer att g\u00e5 s\u00e5 i taket att du kommer
  att \u00e5ngra det. Men d\u00e4r borta \u00e4r detta till\u00e5tet, eftersom det
  \u00e4r emot Ryssland.\\n\\nSom bekant gjorde miljontals m\u00e4nniskor bosatta
  i Ukraina, fr\u00e4mst i landets \u00f6stra regioner, motst\u00e5nd mot kuppen.
  De b\u00f6rjade hotas med v\u00e5ld och terror. F\u00f6rst och fr\u00e4mst b\u00f6rjade
  de nya myndigheterna i Kiev\\n\\nf\u00f6rbereda en attack mot det rysktalande Krim,
  som, som ni kanske vet, \u00f6verf\u00f6rdes fr\u00e5n RSFSR till Ukraina 1954 med
  brott mot alla r\u00e4ttsliga normer och f\u00f6rfaranden, \u00e4ven de som g\u00e4llde
  i Sovjetunionen vid den tidpunkten (av Nikita Chrustjov, sj\u00e4lv fr\u00e5n Ukraina,
  \u00f6.a.). I denna situation kunde vi verkligen inte \u00f6verge och l\u00e4mna
  m\u00e4nniskorna p\u00e5 Krim och i Sevastopol utan skydd. De gjorde sitt val, och
  som alla vet \u00e4gde den historiska f\u00f6reningen av Krim och Sevastopol med
  Ryssland rum i mars 2014. (om det histiriska Ukraina, se h\u00e4r, \u00f6.a.)\\n\\nDe
  fredliga protesterna mot kuppen i Kharkov, Kherson, Odessa, Zaporozhye, Donetsk,
  Lugansk och Mariupol undertrycktes, och Kievregimen och nationalistiska grupper
  sl\u00e4ppte l\u00f6s terrorv\u00e4ldet. Det finns ingen anledning att p\u00e5minna
  om allt detta, f\u00f6r alla \u00e4r v\u00e4l medvetna om vad som h\u00e4nde i dessa
  regioner.\\n\\nI maj 2014 h\u00f6lls folkomr\u00f6stningar om folkrepublikerna Donetsks
  och Lugansks status, d\u00e4r en \u00f6verv\u00e4ldigande majoritet av lokalbefolkningen
  r\u00f6stade f\u00f6r sj\u00e4lvst\u00e4ndighet och suver\u00e4nitet. Detta v\u00e4cker
  f\u00f6ljande fr\u00e5ga: Skulle m\u00e4nniskor i allm\u00e4nhet uttrycka sin vilja
  p\u00e5 detta s\u00e4tt och f\u00f6rklara sig sj\u00e4lvst\u00e4ndiga? De som \u00e4r
  n\u00e4rvarande i detta rum vet att de verkligen skulle kunna g\u00f6ra det och
  att de hade full r\u00e4tt och anledning att g\u00f6ra det enligt internationell
  r\u00e4tt, inklusive m\u00e4nniskors r\u00e4tt till sj\u00e4lvbest\u00e4mmande.
  Det finns naturligtvis ingen anledning att p\u00e5minna er om detta, men eftersom
  medierna \u00e4r i arbete vill jag s\u00e4ga att artikel 1.2 i FN-stadgan utvidgar
  denna r\u00e4tt (FN-stadgan, se h\u00e4r, \u00f6.a.).\\n\\nL\u00e5t mig i detta
  sammanhang p\u00e5minna om det \u00f6k\u00e4nda Kosovoprejudikatet. Vi har talat
  om detta m\u00e5nga g\u00e5nger tidigare, men jag s\u00e4ger det igen nu. Det prejudikat
  som v\u00e4stl\u00e4nderna sj\u00e4lva skapade i en helt identisk situation: de
  erk\u00e4nde Kosovos utbrytning ur Serbien 2008 som legitim. Senare utf\u00e4rdade
  Internationella domstolen sitt v\u00e4lk\u00e4nda r\u00e5dgivande yttrande. Med
  st\u00f6d av artikel 1.2 i FN-stadgan fastslog domstolen den 22 juli 2010 att, jag
  citerar: \\\"Inget allm\u00e4nt f\u00f6rbud mot ensidiga sj\u00e4lvst\u00e4ndighetsf\u00f6rklaringar
  kan utl\u00e4sas av s\u00e4kerhetsr\u00e5dets praxis.\\\" N\u00e4sta citat: \\\"Allm\u00e4n
  internationell r\u00e4tt inneh\u00e5ller inget till\u00e4mpligt f\u00f6rbud mot
  sj\u00e4lvst\u00e4ndighetsf\u00f6rklaringar.\\\" Mer \u00e4n s\u00e5, det stod att
  de delar av ett land, som beslutade att f\u00f6rklara sin sj\u00e4lvst\u00e4ndighet,
  inte var skyldiga att v\u00e4nda sig till de centrala organen i sin tidigare stat.
  De skrev allt detta med sin egen hand i svart p\u00e5 vitt.\\n\\nHade d\u00e5 republikerna
  Donetsk och Lugansk r\u00e4tt att utropa sin sj\u00e4lvst\u00e4ndighet? Naturligtvis
  hade de det! Denna fr\u00e5ga kan inte ens betraktas p\u00e5 ett annat s\u00e4tt.\\n\\nMen
  vad gjorde Kievregimen i den h\u00e4r situationen? Den borts\u00e5g helt fr\u00e5n
  folkets val och inledde ett fullskaligt krig mot de nya sj\u00e4lvst\u00e4ndiga
  staterna, folkrepublikerna i Donbass, med hj\u00e4lp av flygplan, artilleri och
  stridsvagnar. De inledde bomb- och artilleriattacker mot fredliga st\u00e4der och
  tillgrep hotelser. S\u00e5 vad h\u00e4nde sedan? Folket i Donbass tog till vapen
  f\u00f6r att skydda sina liv, sina hem, sina r\u00e4ttigheter och legitima intressen.\\n\\nI
  v\u00e4st \u00e4r det r\u00e5dande narrativet att Ryssland inledde kriget med sin
  s\u00e4rskilda milit\u00e4ra operation och d\u00e4rf\u00f6r \u00e4r angriparen,
  och att det d\u00e4rf\u00f6r \u00e4r till\u00e5tet att angripa det ryska territoriet
  med v\u00e4sterl\u00e4ndska vapen. Det h\u00e4vdas att Ukraina bara f\u00f6rsvarar
  sig och har r\u00e4tt att g\u00f6ra det.\\n\\nJag vill upprepa detta: Det var inte
  Ryssland som startade kriget. Det var Kievregimen som inledde fientligheterna, efter
  det att inv\u00e5narna i vissa delar av Ukraina hade f\u00f6rklarat sig sj\u00e4lvst\u00e4ndiga
  i enlighet med internationell r\u00e4tt, och forts\u00e4tter att g\u00f6ra det.
  Om vi inte erk\u00e4nner dessa folks r\u00e4tt att utropa sin sj\u00e4lvst\u00e4ndighet
  \u00e4r detta verkligen aggression. De som har st\u00f6tt Kievregimens krigsmaskin
  genom \u00e5ren \u00e4r d\u00e4rf\u00f6r medbrottslingar till denna aggression.\\n\\nRedan
  2014 v\u00e4grade inv\u00e5narna i Donbass att ge upp. Milisenheter h\u00f6ll st\u00e5nd,
  slog tillbaka straffstyrkorna och drev dem s\u00e5 sm\u00e5ningom tillbaka fr\u00e5n
  Donetsk och Lugansk. Vi hoppades att detta skulle f\u00e5 dem som initierat v\u00e5ldet
  att ta sitt f\u00f6rnuft till f\u00e5nga. F\u00f6r att f\u00e5 stopp p\u00e5 blodsutgjutelsen
  v\u00e4djade Ryssland som vanligt om f\u00f6rhandlingar. Samtal inleddes mellan
  Kiev och f\u00f6retr\u00e4dare f\u00f6r Donbassrepublikerna, med st\u00f6d av Ryssland,
  Tyskland och Frankrike.\\n\\nSamtalen var inte l\u00e4tta, men ledde till slut fram
  till Minskavtalen 2015 (se h\u00e4r, \u00f6.a.). Vi tog genomf\u00f6randet av dem
  p\u00e5 stort allvar och hoppades kunna l\u00f6sa situationen inom ramen f\u00f6r
  fredsprocessen och internationell r\u00e4tt. Det fanns hopp om att detta skulle
  leda till ett erk\u00e4nnande av Donbass legitima intressen och krav, inklusive
  att dessa regioners s\u00e4rskilda status skulle fastst\u00e4llas och att de grundl\u00e4ggande
  r\u00e4ttigheterna f\u00f6r de m\u00e4nniskor som bor d\u00e4r skulle garanteras,
  samtidigt som Ukrainas territoriella integritet skulle uppr\u00e4tth\u00e5llas.
  Vi var beredda p\u00e5 detta och f\u00f6rs\u00f6kte \u00f6vertyga inv\u00e5narna
  i dessa territorier att l\u00f6sa\\n\\nproblemen p\u00e5 detta s\u00e4tt. Vi f\u00f6reslog
  olika kompromisser och l\u00f6sningar flera g\u00e5nger.\\n\\nKiev f\u00f6rkastade
  dock till slut allt och f\u00f6rkastade helt enkelt Minskavtalen. Som f\u00f6retr\u00e4dare
  f\u00f6r den ukrainska eliten senare erk\u00e4nde tillfredsst\u00e4llde ingen av
  artiklarna i dessa dokument dem; de lj\u00f6g helt enkelt och undvek s\u00e5 mycket
  som m\u00f6jligt.\\n\\nTysklands f\u00f6rre f\u00f6rbundskansler och Frankrikes
  f\u00f6rre president, som i huvudsak var medf\u00f6rfattare till och p\u00e5st\u00e5dda
  garanter f\u00f6r Minskavtalen, erk\u00e4nde senare \u00f6ppet (se h\u00e4r, \u00f6.a.)
  att de aldrig hade haft f\u00f6r avsikt att genomf\u00f6ra dem. Ist\u00e4llet h\u00e4vdade
  de att det var en taktik f\u00f6r att f\u00f6rhala medan de st\u00f6dde ukrainska
  v\u00e4pnade grupper och levererade vapen och utrustning. Det var ytterligare ett
  exempel p\u00e5 att de spelade oss ett spratt och lurade oss \u00e4nnu en g\u00e5ng.\\n\\nI
  st\u00e4llet f\u00f6r att fr\u00e4mja en verklig fredsprocess och bedriva en politik
  f\u00f6r \u00e5terintegrering och nationell f\u00f6rsoning, som Kiev ofta h\u00e4vdade,
  fick Donbass utst\u00e5 \u00e5tta \u00e5r av obeveklig beskjutning, terroristattacker,
  mord och en sv\u00e5r blockad. Under alla dessa \u00e5r avhumaniserades inv\u00e5narna
  i Donbass - kvinnor, barn och \u00e4ldre - och st\u00e4mplades som \\\"andra klassens\\\"
  eller \\\"underm\u00e4nniskor\\\" och hotades med vederg\u00e4llning, med l\u00f6ften
  om att g\u00f6ra upp r\u00e4kningen med alla (se under ''Political Views h\u00e4r,
  \u00f6.a.). Vad kan detta vara om inte ett folkmord i hj\u00e4rtat av Europa p\u00e5
  2000-talet? Under tiden l\u00e5tsades man i Europa och USA som om ingenting h\u00e4nde
  och ingen lade m\u00e4rke till n\u00e5got.\\n\\nI slutet av 2021 och b\u00f6rjan
  av 2022 begravdes Minskprocessen slutligen av Kiev och dess v\u00e4stliga handl\u00e4ggare.
  Ytterligare en storskalig attack planerades mot Donbass. En stor grupp av de ukrainska
  v\u00e4pnade styrkorna f\u00f6rberedde sig f\u00f6r att inleda en ny offensiv mot
  Lugansk och Donetsk, vilket uppenbarligen innebar etniska rensningskampanjer, m\u00e5nga
  d\u00f6dsoffer och hundratusentals flyktingar. Vi var skyldiga att f\u00f6rhindra
  denna katastrof och att skydda folket. Vi s\u00e5g ingen annan l\u00f6sning.\\n\\nRyssland
  erk\u00e4nde folkrepublikerna Donetsk och Lugansk. Vi gjorde inte det under de f\u00f6reg\u00e5ende
  \u00e5tta \u00e5ren, i hopp om att n\u00e5 en \u00f6verenskommelse [med Kiev]. Ni
  k\u00e4nner till resultatet. Den 21 februari 2022 undertecknade vi f\u00f6rdrag
  om v\u00e4nskap, samarbete och \u00f6msesidigt bist\u00e5nd med de republiker som
  vi erk\u00e4nde. Hade dessa folkrepubliker r\u00e4tt att be oss om hj\u00e4lp om
  vi erk\u00e4nde deras sj\u00e4lvst\u00e4ndighet? Hade vi\\n\\nr\u00e4tt att erk\u00e4nna
  deras sj\u00e4lvst\u00e4ndighet, och hade de r\u00e4tt att proklamera sin suver\u00e4nitet
  i enlighet med de artiklar och beslut fr\u00e5n FN:s internationella domstol som
  jag har n\u00e4mnt? Hade de r\u00e4tt till sj\u00e4lvst\u00e4ndighet? Ja, det hade
  de. Om de hade denna r\u00e4tt och ut\u00f6vade den, d\u00e5 hade vi r\u00e4tt att
  underteckna ett f\u00f6rdrag med dem, vilket vi gjorde, som jag har sagt, i full
  \u00f6verensst\u00e4mmelse med internationell r\u00e4tt och artikel 51 i FN-stadgan.\\n\\nSamtidigt
  uppmanade vi myndigheterna i Kiev att dra tillbaka sina trupper fr\u00e5n Donbass.
  Jag kan ber\u00e4tta f\u00f6r er att vi kontaktade dem och sa att de skulle dra
  tillbaka sina trupper och att det skulle bli slutet p\u00e5 det hela. De avvisade
  v\u00e5rt f\u00f6rslag n\u00e4stan omedelbart; de ignorerade det helt enkelt, trots
  att det var en m\u00f6jlighet att l\u00f6sa problemet p\u00e5 fredlig v\u00e4g.\\n\\nDen
  24 februari 2022 var Ryssland tvunget att tillk\u00e4nnage att den s\u00e4rskilda
  milit\u00e4ra operationen skulle inledas. Jag v\u00e4nde mig till Rysslands medborgare,
  till m\u00e4nniskorna i republikerna Donetsk och Lugansk och till det ukrainska
  samh\u00e4llet och redogjorde f\u00f6r m\u00e5len med operationen - att skydda m\u00e4nniskorna
  i Donbass, att \u00e5terst\u00e4lla freden och att demilitarisera och avnazifiera
  Ukraina. Vi gjorde detta f\u00f6r att avv\u00e4rja hotet mot v\u00e5r stat och f\u00f6r
  att \u00e5terst\u00e4lla balansen p\u00e5 s\u00e4kerhetsomr\u00e5det i Europa.\\n\\nSamtidigt
  fortsatte vi att tro att v\u00e5r prioritet var att uppn\u00e5 ovanst\u00e5ende
  m\u00e5l med politiska och diplomatiska medel. Jag vill p\u00e5minna er om att vi
  i det f\u00f6rsta skedet av den s\u00e4rskilda milit\u00e4ra operationen gick med
  p\u00e5 att h\u00e5lla f\u00f6rhandlingar med f\u00f6retr\u00e4dare f\u00f6r Kievregimen.
  De h\u00f6lls f\u00f6rst i Vitryssland och flyttades sedan till Turkiet. Det budskap
  vi f\u00f6rs\u00f6kte f\u00e5 fram var att de skulle respektera Donbass val, dra
  tillbaka sina trupper och sluta bombardera fredliga st\u00e4der och samh\u00e4llen.
  Detta var allt vi bad om, och vi sa att allt annat kunde beslutas senare. Men deras
  svar var: \\\"Nej, vi kommer att sl\u00e5ss. Det var helt klart den order som kom
  fr\u00e5n deras v\u00e4sterl\u00e4ndska herrar. Jag kommer att tala om detta nu.\\n\\nSom
  ni vet n\u00e4rmade sig v\u00e5ra trupper Kiev i februari och mars 2022. Det finns
  m\u00e5nga spekulationer b\u00e5de i Ukraina och i v\u00e4st om detta. Vad kan jag
  s\u00e4ga om det? Det \u00e4r sant att v\u00e5ra enheter var utplacerade n\u00e4ra
  Kiev, och att de milit\u00e4ra avdelningarna och s\u00e4kerhetsblocket hade olika
  f\u00f6rslag p\u00e5 hur man skulle g\u00e5 till v\u00e4ga, men det fanns inget
  politiskt\\n\\nbeslut om att storma staden med tre miljoner inv\u00e5nare, oavsett
  vad n\u00e5gon sa eller spekulerade om.\\n\\nI sj\u00e4lva verket var det inget
  annat \u00e4n en operation f\u00f6r att tvinga den ukrainska regimen att sluta fred.
  Trupperna var d\u00e4r f\u00f6r att tvinga den ukrainska sidan att f\u00f6rhandla,
  f\u00f6r att f\u00f6rs\u00f6ka hitta acceptabla l\u00f6sningar och d\u00e4rmed f\u00e5
  slut p\u00e5 det krig som Kiev startade mot Donbass 2014, och f\u00f6r att l\u00f6sa
  fr\u00e5gor som utg\u00f6r ett hot mot Rysslands s\u00e4kerhet.\\n\\n\u00d6verraskande
  nog n\u00e5ddes faktiskt \u00f6verenskommelser som tillfredsst\u00e4llde b\u00e5de
  Moskva och Kiev. Dessa avtal sattes p\u00e5 pr\u00e4nt och paraferades i Istanbul
  av chefen f\u00f6r den ukrainska f\u00f6rhandlingsdelegationen. Detta inneb\u00e4r
  att l\u00f6sningen var godtagbar f\u00f6r myndigheterna i Kiev.\\n\\nDokumentet
  hade titeln \\\"Avtal om permanent neutralitet och s\u00e4kerhetsgarantier f\u00f6r
  Ukraina\\\". Det var en kompromiss, men dess huvudpunkter l\u00e5g i linje med v\u00e5ra
  grundl\u00e4ggande krav och l\u00f6ste de problem som redan vid inledningen av den
  s\u00e4rskilda milit\u00e4ra operationen angavs som stora. L\u00e5t mig ocks\u00e5
  notera att detta inkluderade demilitarisering och avnazifiering av Ukraina. Och
  vi lyckades ocks\u00e5 hitta utmanande resultat. De var komplicerade, men de hade
  hittats. Det var meningen att en lag skulle antas i Ukraina som f\u00f6rbjuder nazistisk
  ideologi och alla dess yttringar. Allt detta stod skrivet d\u00e4r.\\n\\nI utbyte
  mot internationella s\u00e4kerhetsgarantier skulle Ukraina dessutom ha begr\u00e4nsat
  storleken p\u00e5 sina v\u00e4pnade styrkor, \u00e5tagit sig skyldigheter att inte
  g\u00e5 med i milit\u00e4rallianser, inte vara v\u00e4rd f\u00f6r utl\u00e4ndska
  milit\u00e4rbaser, inte stationera dem och kontingenter och inte genomf\u00f6ra
  milit\u00e4r\u00f6vningar p\u00e5 sitt territorium. Allt var nedskrivet p\u00e5
  papper.\\n\\nRyssland, som ocks\u00e5 f\u00f6rstod Ukrainas s\u00e4kerhetspolitiska
  oro, gick med p\u00e5 att Ukraina skulle f\u00e5 garantier liknande dem som Nato-medlemmar
  \u00e5tnjuter utan att formellt g\u00e5 med i alliansen. Det var ett sv\u00e5rt
  beslut f\u00f6r oss, men vi erk\u00e4nde legitimiteten i Ukrainas krav p\u00e5 att
  trygga sin s\u00e4kerhet och hade inga inv\u00e4ndningar mot den formulering som
  Kiev f\u00f6reslog. Detta var den formulering som Kiev f\u00f6reslog, och vi hade
  i allm\u00e4nhet inga inv\u00e4ndningar, eftersom vi f\u00f6rstod att det viktigaste
  var att f\u00e5 slut p\u00e5 blodspillan och kriget i Donbass.\\n\\nDen 29 mars
  2022 drog vi tillbaka v\u00e5ra trupper fr\u00e5n Kiev eftersom vi f\u00f6rs\u00e4krades
  om att det m\u00e5ste skapas f\u00f6ruts\u00e4ttningar f\u00f6r att slutf\u00f6ra
  den politiska f\u00f6rhandlingsprocessen, och att en av parterna inte kan underteckna
  s\u00e5dana avtal, som v\u00e5ra kolleger i v\u00e4st sa, med en pistol mot huvudet.
  Okej, vi gick med p\u00e5 det ocks\u00e5.\\n\\nMen redan n\u00e4sta dag, efter att
  de ryska trupperna hade dragits tillbaka fr\u00e5n Kiev, avbr\u00f6t det ukrainska
  ledarskapet sitt deltagande i f\u00f6rhandlingarna genom att iscens\u00e4tta den
  \u00f6k\u00e4nda provokationen i Bucha (se h\u00e4r, \u00f6.a.) och f\u00f6rkastade
  den f\u00f6rberedda versionen av avtalen. Jag tror att det i dag st\u00e5r klart
  varf\u00f6r denna fula provokation var n\u00f6dv\u00e4ndig: f\u00f6r att f\u00f6rklara
  varf\u00f6r de resultat som hade uppn\u00e5tts under f\u00f6rhandlingarna f\u00f6rkastades.
  V\u00e4gen till fred f\u00f6rkastades igen.\\n\\nSom vi nu vet skedde det p\u00e5
  order av v\u00e4stliga r\u00e5dgivare, d\u00e4ribland Storbritanniens tidigare premi\u00e4rminister
  som under sitt bes\u00f6k i Kiev direkt sa - inga avtal; Ryssland m\u00e5ste besegras
  p\u00e5 slagf\u00e4ltet f\u00f6r att uppn\u00e5 sitt strategiska nederlag. De b\u00f6rjade
  allts\u00e5 intensivt pumpa in vapen i Ukraina och b\u00f6rjade tala om behovet
  av att tillfoga Ryssland ett strategiskt nederlag, som jag just har n\u00e4mnt.
  En tid senare utf\u00e4rdade Ukrainas president, som alla vet, en verkst\u00e4llande
  order som f\u00f6rbj\u00f6d hans f\u00f6retr\u00e4dare och honom sj\u00e4lv att
  f\u00f6ra n\u00e5gra f\u00f6rhandlingar med Moskva. Denna episod med v\u00e5rt f\u00f6rs\u00f6k
  att l\u00f6sa problemet med fredliga medel ledde inte till n\u00e5gonting igen.\\n\\nN\u00e4r
  det g\u00e4ller f\u00f6rhandlingarna skulle jag nu vilja offentligg\u00f6ra en annan
  episod. Jag har inte heller talat om detta offentligt, men n\u00e5gra av dem som
  \u00e4r n\u00e4rvarande h\u00e4r k\u00e4nner till det. Efter att den ryska arm\u00e9n
  intagit delar av regionerna Kherson och Zaporozhye erbj\u00f6d m\u00e5nga v\u00e4sterl\u00e4ndska
  politiker sin medling f\u00f6r en fredlig l\u00f6sning av konflikten. En av dem
  var p\u00e5 arbetsbes\u00f6k i Moskva den 5 mars 2022. Vi accepterade hans medlingsanstr\u00e4ngningar,
  s\u00e4rskilt eftersom han under samtalet sa att han hade s\u00e4krat st\u00f6d
  fr\u00e5n ledarna f\u00f6r Tyskland och Frankrike, liksom fr\u00e5n h\u00f6gt uppsatta
  amerikanska f\u00f6retr\u00e4dare.\\n\\nUnder v\u00e5rt samtal undrade v\u00e5r
  utl\u00e4ndska g\u00e4st - ett intressant \u00f6gonblick - att om ni hj\u00e4lper
  Donbass, varf\u00f6r finns det d\u00e5 ryska trupper i s\u00f6dra Ukraina, bland
  annat i regionerna Kherson och Zaporozhye? Vi svarade att det var v\u00e5r generalstabs
  beslut om att planera operationen. Och jag vill i dag till\u00e4gga att tanken var
  att kringg\u00e5 vissa bef\u00e4sta omr\u00e5den som byggts i Donbass under \u00e5tta
  \u00e5r av ukrainska myndigheter, fr\u00e4mst f\u00f6r att befria Mariupol.\\n\\nSedan
  preciserade v\u00e5r utl\u00e4ndska kollega - en professionell man, f\u00f6r att
  vara r\u00e4ttvis mot honom: kommer de ryska trupperna att stanna i Kherson- och
  Zaporozhye-regionerna? Och vad kommer att h\u00e4nda med dessa regioner efter det
  att den s\u00e4rskilda milit\u00e4ra operationen har uppn\u00e5tt sina m\u00e5l?
  Jag svarade att jag i allm\u00e4nhet inte utesluter att den ukrainska suver\u00e4niteten
  \u00f6ver dessa territorier bevaras, f\u00f6rutsatt att Ryssland har en stabil landbro
  till Krim.\\n\\nDet inneb\u00e4r att Kiev b\u00f6r garantera servitut, som de kallar
  det, en juridiskt formaliserad r\u00e4tt f\u00f6r Ryssland att f\u00e5 tilltr\u00e4de
  till Krimhalv\u00f6n via regionerna Kherson och Zaporozhye. Detta \u00e4r ett avg\u00f6rande
  politiskt beslut. Och i sin slutliga version kommer det naturligtvis inte att antas
  ensidigt utan f\u00f6rst efter samr\u00e5d med s\u00e4kerhetsr\u00e5det, med andra
  institutioner, naturligtvis efter diskussion med medborgarna, allm\u00e4nheten i
  v\u00e5rt land och framf\u00f6r allt med inv\u00e5narna i regionerna Kherson och
  Zaporozhye.\\n\\nI slut\u00e4ndan var det vad vi gjorde: vi fr\u00e5gade folket
  sj\u00e4lva om deras \u00e5sikt och h\u00f6ll folkomr\u00f6stningar. Och vi gjorde
  vad folket beslutade, \u00e4ven i regionerna Kherson och Zaporozhye, i folkrepublikerna
  Donetsk och Lugansk.\\n\\nVid den tidpunkten, i mars 2022, sade v\u00e5r f\u00f6rhandlingspartner
  att han skulle bege sig till Kiev f\u00f6r att forts\u00e4tta samtalet med sina
  kollegor i den ukrainska huvudstaden. Vi v\u00e4lkomnade detta i allm\u00e4nhet
  som f\u00f6rs\u00f6k att finna en fredlig l\u00f6sning p\u00e5 konflikten, eftersom
  varje dag av strider innebar nya offer och f\u00f6rluster. Den v\u00e4sterl\u00e4ndske
  medlarens tj\u00e4nster accepterades dock inte i Ukraina, vilket vi senare fick
  veta, och tv\u00e4rtom, vilket vi blev medvetna om, anklagade de honom f\u00f6r
  att inta pro-ryska st\u00e5ndpunkter i en ganska h\u00e5rd form, det m\u00e5ste
  n\u00e4mnas, men det \u00e4r en liten sak.\\n\\nNu har situationen, som jag redan
  har sagt, f\u00f6r\u00e4ndrats i grunden. Inv\u00e5narna i Kherson och Zaporozhye
  har uttryckt sin st\u00e5ndpunkt i folkomr\u00f6stningar, och regionerna Kherson
  och Zaporozhye, liksom folkrepublikerna Donetsk och Lugansk, har blivit en del av
  Ryska federationen. Och det kan inte vara tal om att st\u00f6ra v\u00e5r statliga
  enhet. Folkets vilja att vara med Ryssland ska vara okr\u00e4nkbar. Denna fr\u00e5ga
  \u00e4r avslutad f\u00f6r alltid och \u00e4r inte l\u00e4ngre en fr\u00e5ga f\u00f6r
  diskussion.\\n\\n\u00c4n en g\u00e5ng var det v\u00e4st som f\u00f6rberedde och
  provocerade fram krisen i Ukraina; det \u00e4r v\u00e4st som nu g\u00f6r sitt b\u00e4sta
  f\u00f6r att f\u00f6rl\u00e4nga denna kris p\u00e5 obest\u00e4md tid, f\u00f6r att
  f\u00f6rsvaga och \u00f6msesidigt f\u00f6rbittra folken i Ryssland och Ukraina.\\n\\nDe
  forts\u00e4tter att skicka in fler partier med vapen och ammunition. Vissa europeiska
  politiker har nyligen lekt med tanken p\u00e5 att placera ut sina regulj\u00e4ra
  trupper i Ukraina. Samtidigt f\u00f6rs\u00f6ker nu, som jag redan har p\u00e5pekat,
  dessa marionettspelare, Ukrainas verkliga h\u00e4rskare - tyv\u00e4rr \u00e4r det
  inte Ukrainas folk, utan den globalistiska eliten fr\u00e5n utlandet - att l\u00e4gga
  \u00f6ver b\u00f6rdan av impopul\u00e4ra beslut p\u00e5 de ukrainska verkst\u00e4llande
  myndigheterna, d\u00e4ribland beslutet att ytterligare s\u00e4nka \u00e5ldern f\u00f6r
  v\u00e4rnplikt.\\n\\nSom ni vet s\u00e4nktes nyligen den \u00e5lder d\u00e5 ukrainska
  m\u00e4n kan m\u00f6nstras till 25. De kan mycket v\u00e4l s\u00e4nka den till 23
  n\u00e4sta g\u00e5ng, och sedan till 20, eller g\u00e5 \u00e4nda ned till 18. N\u00e4sta
  sak man vet \u00e4r att de kommer att g\u00f6ra sig av med de tj\u00e4nstem\u00e4n
  som fattade dessa impopul\u00e4ra beslut under p\u00e5tryckningar fr\u00e5n v\u00e4st,
  bara kasta bort dem som om de vore utbytbara, skylla det helt och h\u00e5llet p\u00e5
  dem, och ers\u00e4tta dem med andra tj\u00e4nstem\u00e4n, som ocks\u00e5 \u00e4r
  beroende av v\u00e4st, men med ett renare rykte - \u00e4n s\u00e5 l\u00e4nge.\\n\\nD\u00e4rav
  kanske id\u00e9n om att st\u00e4lla in n\u00e4sta presidentval i Ukraina. De kommer
  att l\u00e5ta det sittande laget g\u00f6ra det innan de kastar det laget i papperskorgen,
  och de kommer att forts\u00e4tta att g\u00f6ra vad de anser vara r\u00e4tt.\\n\\nI
  detta sammanhang vill jag p\u00e5minna er om n\u00e5got som Kiev f\u00f6redrar att
  gl\u00f6mma, och som v\u00e4stv\u00e4rlden ocks\u00e5 tiger om. Vad \u00e4r det
  f\u00f6r n\u00e5got? I maj 2014 slog Ukrainas f\u00f6rfattningsdomstol fast att,
  citat: \\\"Presidenten v\u00e4ljs f\u00f6r en mandatperiod p\u00e5 fem \u00e5r,
  oavsett om valet \u00e4r ordinarie eller f\u00f6rtida.\\\" Vidare konstaterade f\u00f6rfattningsdomstolen
  att \\\"presidentens konstitutionella status inte inneb\u00e4r n\u00e5gra normer
  som fastst\u00e4ller n\u00e5gon annan mandatperiod \u00e4n fem \u00e5r\\\" - citat
  slut, punkt. Domstolens beslut var slutgiltigt och kunde inte \u00f6verklagas. Det
  var allt.\\n\\nVad inneb\u00e4r detta i f\u00f6rh\u00e5llande till dagens situation?
  Presidentperioden f\u00f6r den tidigare valde ledaren f\u00f6r Ukraina har l\u00f6pt
  ut tillsammans med hans legitimitet, som inte kan \u00e5terst\u00e4llas genom n\u00e5gra
  knep. Jag t\u00e4nker inte g\u00e5 in i detalj p\u00e5 bakgrunden till den ukrainska\\n\\nf\u00f6rfattningsdomstolens
  beslut om presidentens mandatperiod. Det st\u00e5r klart att det gjordes i samband
  med f\u00f6rs\u00f6k att legitimera kuppen 2014. Men domen f\u00f6ll \u00e4nd\u00e5,
  och detta \u00e4r ett r\u00e4ttsligt faktum som g\u00f6r alla f\u00f6rs\u00f6k att
  r\u00e4ttf\u00e4rdiga dagens pantomim om att st\u00e4lla in valet oh\u00e5llbara.\\n\\nSom
  jag sa tidigare b\u00f6rjade det nuvarande tragiska kapitlet i Ukrainas historia
  med ett makt\u00f6vertagande, en kupp som stred mot konstitutionen 2014. F\u00f6r
  att upprepa, en v\u00e4pnad kupp ligger till grund f\u00f6r den nuvarande Kievregimen.
  Nu har cirkeln slutits. Precis som 2014 har den verkst\u00e4llande makten i Ukraina
  tillskansats sig och innehas olagligt. I sj\u00e4lva verket har vi att g\u00f6ra
  med en illegitim regering.\\n\\nJag ska s\u00e4ga mer: att st\u00e4lla in val \u00e5terspeglar
  sj\u00e4lva naturen, det inre av den nuvarande Kievregimen, som v\u00e4xte fram
  ur den v\u00e4pnade kuppen 2014, \u00e4r knuten till den och har sina r\u00f6tter
  d\u00e4r. Det faktum att de, efter att ha st\u00e4llt in valet, forts\u00e4tter
  att klamra sig fast vid makten \u00e4r n\u00e5got som uttryckligen f\u00f6rbjuds
  i artikel 5 i Ukrainas konstitution. Jag citerar: \\\"R\u00e4tten att best\u00e4mma
  och \u00e4ndra den konstitutionella ordningen i Ukraina tillh\u00f6r uteslutande
  folket och f\u00e5r inte tillskansas av staten, dess organ eller tj\u00e4nstem\u00e4n.\\\"
  Dessutom faller s\u00e5dana handlingar under artikel 109 i Ukrainas strafflag, som
  just h\u00e4nvisar till v\u00e5ldsam f\u00f6r\u00e4ndring eller st\u00f6rtande av
  den konstitutionella ordningen eller \u00f6vertagande av statsmakten, samt konspiration
  f\u00f6r att beg\u00e5 s\u00e5dana handlingar.\\n\\n\u00c5r 2014 r\u00e4ttf\u00e4rdigades
  ett s\u00e5dant makt\u00f6vertagande av revolutionen, och nu av fientligheter, men
  det f\u00f6r\u00e4ndrar inte det faktiska l\u00e4get. I sj\u00e4lva verket talar
  vi om en hemlig \u00f6verenskommelse mellan den ukrainska regeringens verkst\u00e4llande
  gren, Verkhovnaja Radas ledning och den parlamentsmajoritet som den kontrollerar.
  Denna samverkan syftar till att tillskansa sig statsmakten (det \u00e4r det enda
  s\u00e4ttet att beskriva det p\u00e5), vilket \u00e4r ett brott enligt ukrainsk
  lag.\\n\\nUkrainas konstitution ger inte heller n\u00e5gon m\u00f6jlighet att upph\u00e4va
  eller skjuta upp valet av landets president eller att l\u00e5ta honom beh\u00e5lla
  sina befogenheter i samband med undantagstillst\u00e5ndet, som de nu h\u00e4nvisar
  till. Vad st\u00e5r det i den ukrainska grundlagen? Den s\u00e4ger att valet till
  Verkhovnaya Rada kan skjutas upp under undantagstillst\u00e5ndet. Det st\u00e5r
  i artikel 83 i den ukrainska konstitutionen.\\n\\nDen ukrainska lagstiftningen har
  allts\u00e5 f\u00f6reskrivit det enda undantaget n\u00e4r en offentlig myndighets
  befogenheter utvidgas under krigslagarna\\n\\noch val inte h\u00e5lls. Detta g\u00e4ller
  uteslutande Verkhovnaya Rada. Detta inneb\u00e4r att Ukrainas parlament har status
  som ett permanent organ under krigslagar.\\n\\nMed andra ord, till skillnad fr\u00e5n
  den verkst\u00e4llande makten \u00e4r Verkhovnaya Rada nu ett legitimt organ (vilket
  enl. Putn inneb\u00e4r att bara Rada kan utg\u00f6ra en f\u00f6rhandlingspart, \u00f6.a.).\\n\\nUkraina
  \u00e4r inte en presidentrepublik, utan en parlamentarisk republik och en presidentrepublik.
  Det \u00e4r detta som \u00e4r po\u00e4ngen.\\n\\nI kraft av artiklarna 106 och 112
  har dessutom ordf\u00f6randen f\u00f6r Verkhovnaja Rada, i egenskap av president,
  s\u00e4rskilda befogenheter, bland annat n\u00e4r det g\u00e4ller f\u00f6rsvar,
  s\u00e4kerhet och h\u00f6gsta bef\u00e4let \u00f6ver de v\u00e4pnade styrkorna.
  Allt st\u00e5r svart p\u00e5 vitt d\u00e4r.\\n\\nF\u00f6rresten, under f\u00f6rsta
  halv\u00e5ret i \u00e5r undertecknade Ukraina en rad bilaterala avtal med flera
  europeiska stater om samarbete inom s\u00e4kerhet och l\u00e5ngsiktigt st\u00f6d.
  Ett liknande dokument har ocks\u00e5 undertecknats med F\u00f6renta staterna. (och
  med Sverige, \u00f6.a.)\\n\\nSedan den 21 maj 2024 uppst\u00e5r naturligtvis fr\u00e5gor
  om auktoriteten och legitimiteten hos de ukrainska f\u00f6retr\u00e4dare som undertecknar
  s\u00e5dana dokument. Det spelar ingen roll f\u00f6r oss; l\u00e5t dem skriva under
  vad de vill. Det \u00e4r uppenbart att det finns en politisk och propagandistisk
  vinkel i detta. F\u00f6renta staterna och dess satelliter verkar angel\u00e4gna
  om att st\u00f6dja sina allierade och st\u00e4rka deras trov\u00e4rdighet och st\u00e4llning.\\n\\nMen
  om en seri\u00f6s juridisk granskning av ett s\u00e5dant avtal senare genomf\u00f6rs
  i USA (inte vad g\u00e4ller inneh\u00e5llet, utan det juridiska ramverket) kommer
  det utan tvekan att uppst\u00e5 fr\u00e5gor om vem som undertecknat dessa dokument
  och med vilken auktoritet. Det kan visa sig att det bara \u00e4r skryt, vilket g\u00f6r
  avtalet ogiltigt, och hela strukturen kan kollapsa, f\u00f6rutsatt att det finns
  en vilja att analysera situationen. Man kan l\u00e5tsas att allt \u00e4r normalt,
  men verkligheten \u00e4r l\u00e5ngt ifr\u00e5n det, jag har l\u00e4st det. Allt
  \u00e4r dokumenterat, det st\u00e5r i konstitutionen.\\n\\nL\u00e5t mig ocks\u00e5
  p\u00e5minna er om att v\u00e4st efter inledandet av den s\u00e4rskilda milit\u00e4ra
  operationen inledde en kraftfull och ganska odiplomatisk kampanj som syftade till
  att isolera Ryssland p\u00e5 den globala arenan. Det \u00e4r nu uppenbart f\u00f6r
  alla att detta f\u00f6rs\u00f6k har misslyckats. V\u00e4stv\u00e4rlden har dock
  inte \u00f6vergett sitt m\u00e5l att bilda en slags internationell koalition mot
  Ryssland och uppr\u00e4tth\u00e5lla en fasad av\\n\\np\u00e5tryckningar p\u00e5
  v\u00e5rt land. Vi \u00e4r ocks\u00e5 fullt medvetna om denna strategi.\\n\\nSom
  ni kanske k\u00e4nner till har man aktivt fr\u00e4mjat initiativet att sammankalla
  den s\u00e5 kallade internationella h\u00f6gniv\u00e5konferensen i Schweiz om fred
  i Ukraina. Dessutom har de f\u00f6r avsikt att h\u00e5lla den kort efter G7-toppm\u00f6tet,
  det vill s\u00e4ga de som i huvudsak underbl\u00e5ste konflikten i Ukraina genom
  sin politik.\\n\\nOrganisat\u00f6rerna av m\u00f6tet i Schweiz f\u00f6resl\u00e5r
  \u00e4nnu en man\u00f6ver f\u00f6r att avleda uppm\u00e4rksamheten, f\u00f6rvr\u00e4nga
  de grundl\u00e4ggande orsakerna till krisen i Ukraina, vilseleda diskussionen och
  i viss m\u00e5n bekr\u00e4fta legitimiteten hos den nuvarande verkst\u00e4llande
  makten i Ukraina.\\n\\nDet f\u00f6rv\u00e4ntas d\u00e4rf\u00f6r att konferensen
  i Schweiz kommer att undvika att ta upp de grundl\u00e4ggande fr\u00e5gor som ligger
  bakom den nuvarande krisen i internationell s\u00e4kerhet och stabilitet, inklusive
  de verkliga r\u00f6tterna till den ukrainska konflikten. Trots anstr\u00e4ngningarna
  att presentera en till synes respektabel agenda kommer dessa kritiska fr\u00e5gor
  sannolikt inte att diskuteras.\\n\\nVi kan f\u00f6rv\u00e4nta oss att allt kommer
  att koka ned till allm\u00e4nna demagogiska tal och en ny upps\u00e4ttning anklagelser
  mot Ryssland. Tanken \u00e4r l\u00e4tt att l\u00e4sa: f\u00e5 med s\u00e5 m\u00e5nga
  stater som m\u00f6jligt p\u00e5 alla m\u00f6jliga s\u00e4tt och presentera fr\u00e5gan
  som om v\u00e4sterl\u00e4ndska recept och regler delas av hela det internationella
  samfundet som ett resultat, vilket inneb\u00e4r att Ryssland ovillkorligen m\u00e5ste
  acceptera dem.\\n\\nSom ni vet var vi naturligtvis inte inbjudna till m\u00f6tet
  i Schweiz. N\u00e4r allt kommer omkring \u00e4r detta inte f\u00f6rhandlingar, utan
  en \u00f6nskan hos en grupp l\u00e4nder att forts\u00e4tta driva sin politik och
  l\u00f6sa fr\u00e5gor som direkt p\u00e5verkar v\u00e5ra intressen och v\u00e5r
  s\u00e4kerhet p\u00e5 det s\u00e4tt som de finner l\u00e4mpligt.\\n\\nI detta avseende
  vill jag betona att det \u00e4r om\u00f6jligt att n\u00e5 en fredlig l\u00f6sning
  p\u00e5 Ukrainakrisen och p\u00e5 den \u00f6vergripande europeiska s\u00e4kerheten
  utan Rysslands deltagande, utan en \u00e4rlig och ansvarsfull dialog med oss.\\n\\nJust
  nu ignorerar v\u00e4st v\u00e5ra intressen, samtidigt som man f\u00f6rbjuder Kiev
  att f\u00f6rhandla och hycklande forts\u00e4tter att uppmana oss att f\u00f6rhandla.
  Det ser helt enkelt idiotiskt ut: \u00e5 ena sidan f\u00f6rbjuds de att f\u00f6rhandla\\n\\nmed
  oss, men \u00e5 andra sidan uppmanas vi att f\u00f6rhandla, vilket inneb\u00e4r
  att vi v\u00e4grar att g\u00f6ra det. Det \u00e4r nonsens. Det ser ut som om vi
  lever i n\u00e5got slags fantasiv\u00e4rld.\\n\\nUnder tiden b\u00f6r de f\u00f6r
  det f\u00f6rsta beordra Kiev att h\u00e4va f\u00f6rbudet mot att f\u00f6rhandla
  med Ryssland, och f\u00f6r det andra \u00e4r vi redo att inleda f\u00f6rhandlingar
  s\u00e5 snart som i morgon. Vi f\u00f6rst\u00e5r att den r\u00e4ttsliga situationen
  \u00e4r speciell, men det finns legitima myndigheter d\u00e4r, till och med i enlighet
  med konstitutionen, som jag har sagt. Det finns n\u00e5gon att f\u00f6rhandla med.
  H\u00e4r \u00e4r ni, vi \u00e4r redo. V\u00e5ra villkor f\u00f6r att inleda s\u00e5dana
  samtal \u00e4r enkla, och de g\u00e5r ut p\u00e5 f\u00f6ljande.\\n\\nNi vet, jag
  kommer att ta lite tid p\u00e5 mig att \u00e4n en g\u00e5ng erinra om hela h\u00e4ndelsekedjan
  f\u00f6r att klarg\u00f6ra att det jag nu ska s\u00e4ga inte bara handlar om i dag
  f\u00f6r oss, utan att vi alltid har h\u00e5llit fast vid en viss st\u00e5ndpunkt
  och alltid str\u00e4vat efter fred.\\n\\nS\u00e5, dessa villkor \u00e4r enkla. De
  ukrainska trupperna m\u00e5ste helt och h\u00e5llet dras tillbaka fr\u00e5n folkrepublikerna
  Donetsk och Lugansk samt regionerna Kherson och Zaporozhye. L\u00e5t mig notera
  att de m\u00e5ste dras tillbaka fr\u00e5n hela dessa regioners territorium inom
  deras administrativa gr\u00e4nser vid den tidpunkt d\u00e5 de var en del av Ukraina.\\n\\nS\u00e5
  snart Kiev f\u00f6rklarar att man \u00e4r redo att fatta detta beslut och p\u00e5b\u00f6rja
  ett verkligt tillbakadragande av trupper fr\u00e5n dessa regioner, och \u00e4ven
  officiellt meddelar att man \u00f6verger sina planer p\u00e5 att g\u00e5 med i Nato,
  kommer v\u00e5r sida att f\u00f6lja en order om eld upph\u00f6r och inledande av
  f\u00f6rhandlingar som kommer att utf\u00e4rdas av oss i samma \u00f6gonblick. Jag
  upprepar - vi kommer att g\u00f6ra detta skyndsamt. Naturligtvis garanterar vi ocks\u00e5
  ett obehindrat och s\u00e4kert tillbakadragande av ukrainska enheter och formationer.\\n\\nVi
  skulle verkligen vilja f\u00f6rv\u00e4nta oss att ett s\u00e5dant beslut om trupptillbakadragande,
  om en block\u00f6verskridande status och om att inleda en dialog med Ryssland, som
  Ukrainas existens i framtiden \u00e4r beroende av, kommer att antas i Kiev p\u00e5
  ett oberoende s\u00e4tt, med utg\u00e5ngspunkt i de etablerade realiteterna och
  v\u00e4glett av det ukrainska folkets genuina nationella intressen, och inte p\u00e5
  uppmaning av v\u00e4st, \u00e4ven om det naturligtvis finns stora tvivel om det.\\n\\nMen
  vad \u00e4r det jag vill s\u00e4ga igen i det h\u00e4r sammanhanget och vad vill
  jag p\u00e5minna er om? Jag sade att jag skulle vilja g\u00e5 igenom tidslinjen
  f\u00f6r h\u00e4ndelserna igen. L\u00e5t oss \u00e4gna lite tid \u00e5t detta.\\n\\nUnder
  h\u00e4ndelserna p\u00e5 Maidan i Kiev 2013-2014 erbj\u00f6d Ryssland allts\u00e5
  upprepade g\u00e5nger sin hj\u00e4lp med en konstitutionell l\u00f6sning p\u00e5
  krisen, som faktiskt hade planerats utifr\u00e5n. L\u00e5t oss \u00e5terg\u00e5
  till h\u00e4ndelsef\u00f6rloppet i slutet av februari 2014.\\n\\nDen 18 februari
  provocerade oppositionen fram v\u00e4pnade sammanst\u00f6tningar i Kiev. Ett antal
  byggnader, bland annat borgm\u00e4starens kontor och fackf\u00f6reningarnas hus,
  sattes i brand (se h\u00e4r, \u00f6.a.). Den 20 februari \u00f6ppnade oidentifierade
  krypskyttar eld mot demonstranter och brottsbek\u00e4mpande personal, det vill s\u00e4ga
  hj\u00e4rnorna bakom den v\u00e4pnade kuppen gjorde allt f\u00f6r att driva situationen
  till v\u00e5ld, till radikalisering. Och de som befann sig p\u00e5 Kievs gator och
  uttryckte sitt missn\u00f6je med de d\u00e5varande myndigheterna anv\u00e4ndes avsiktligt
  som kanonmat f\u00f6r deras egna sj\u00e4lviska syften. De g\u00f6r exakt samma
  sak i dag, mobiliserar och skickar m\u00e4nniskor till slakt. P\u00e5 den tiden
  fanns det dock en m\u00f6jlighet att ta sig ur situationen p\u00e5 ett civiliserat
  s\u00e4tt.\\n\\nDet finns dokumenterat att Ukrainas d\u00e5varande president och
  oppositionen den 21 februari undertecknade ett avtal om en l\u00f6sning p\u00e5
  den politiska krisen. Garanter f\u00f6r detta var som bekant de officiella f\u00f6retr\u00e4darna
  f\u00f6r Tyskland, Polen och Frankrike. Avtalet innebar en \u00e5terg\u00e5ng till
  en parlamentarisk-presidentiell regeringsform, ett tidigt presidentval, bildandet
  av en nationell samlingsregering, tillbakadragandet av de brottsbek\u00e4mpande
  styrkorna fr\u00e5n centrala Kiev och oppositionens \u00f6verl\u00e4mnande av vapen.\\n\\nJag
  b\u00f6r till\u00e4gga att Verkhovna Rada antog en lag som utesluter straffr\u00e4ttsligt
  \u00e5tal mot demonstranterna. En s\u00e5dan \u00f6verenskommelse, som skulle ha
  stoppat v\u00e5ldet och \u00e5terf\u00f6rt situationen till det konstitutionella
  ramverket, var ett faktum. Detta avtal har undertecknats, \u00e4ven om b\u00e5de
  Kiev och v\u00e4stv\u00e4rlden f\u00f6redrar att inte ta upp det heller.\\n\\nI
  dag ska jag ber\u00e4tta ett annat viktigt faktum som inte har offentliggjorts tidigare:
  vid exakt samma tid den 21 februari hade jag ett samtal med min amerikanska kollega
  p\u00e5 initiativ av den amerikanska sidan. I huvudsak gav den amerikanske ledaren
  ett otvetydigt st\u00f6d till Kiev\u00f6verenskommelsen mellan myndigheterna och
  oppositionen.\\n\\nVidare beskrev han det som ett verkligt genombrott och en m\u00f6jlighet
  f\u00f6r det ukrainska folket att f\u00f6rhindra att det eskalerande v\u00e5ldet
  \u00f6verskrider alla t\u00e4nkbara gr\u00e4nser.\\n\\nUnder v\u00e5ra diskussioner
  formulerade vi dessutom gemensamt f\u00f6ljande strategi: Ryssland \u00e5tog sig
  att \u00f6vertala Ukrainas d\u00e5varande president att visa st\u00f6rsta m\u00f6jliga
  \u00e5terh\u00e5llsamhet och avst\u00e5 fr\u00e5n att s\u00e4tta in arm\u00e9n och
  polisen mot demonstranterna. Omv\u00e4nt lovade USA att uppmana oppositionen att
  fredligt utrymma administrativa byggnader och arbeta f\u00f6r att lugna ner gatorna.\\n\\nAlla
  dessa anstr\u00e4ngningar syftade till att \u00e5teruppr\u00e4tta normalitet i landet
  och s\u00e4kerst\u00e4lla att konstitutionella och r\u00e4ttsliga principer efterlevs.
  Sammantaget enades vi om att samarbeta f\u00f6r att fr\u00e4mja ett stabilt, fredligt
  och v\u00e4lutvecklat Ukraina. Vi fullf\u00f6ljde v\u00e5ra \u00e5taganden fullt
  ut. Vid den tidpunkten avstod president Janukovytj, som inte hade f\u00f6r avsikt
  att s\u00e4tta in arm\u00e9n, fr\u00e5n att g\u00f6ra det och drog till och med
  tillbaka ytterligare polisenheter fr\u00e5n Kiev.\\n\\nHur \u00e4r det med v\u00e5ra
  kolleger i v\u00e4st? Under natten till den 22 februari och hela den f\u00f6ljande
  dagen, trots avtal och garantier fr\u00e5n v\u00e4st (b\u00e5de Europa och F\u00f6renta
  staterna, som jag just n\u00e4mnde), tog radikaler med v\u00e5ld kontroll \u00f6ver
  Rada-byggnaden, presidentadministrationen, och tog \u00f6ver regeringen medan president
  Janukovytj \u00e5kte till Charkov, d\u00e4r kongressen f\u00f6r deputerade fr\u00e5n
  de syd\u00f6stra regionerna i Ukraina och Krim skulle \u00e4ga rum. Och ingen av
  garanterna f\u00f6r dessa avtal om politisk uppg\u00f6relse - varken USA eller europ\u00e9erna
  - gjorde n\u00e5gonting f\u00f6r att uppfylla sina skyldigheter genom att uppmana
  oppositionen att sl\u00e4ppa de beslagtagna administrativa byggnaderna och avst\u00e5
  fr\u00e5n v\u00e5ld. Det \u00e4r uppenbart att detta h\u00e4ndelsef\u00f6rlopp inte
  bara passade dem utan ocks\u00e5 tyder p\u00e5 att de kan ha iscensatt h\u00e4ndelseutvecklingen.\\n\\nDen
  22 februari 2014 antog Verkhovna Rada, i strid med Ukrainas konstitution, en resolution
  som f\u00f6rklarade att president Janukovytj sj\u00e4lvmant skulle avs\u00e4ttas
  fr\u00e5n sin post och att tidiga val skulle h\u00e5llas den 25 maj. Detta var en
  v\u00e4pnad kupp som anstiftades av externa krafter. Ukrainska radikaler, med underf\u00f6rst\u00e5tt
  samtycke och direkt st\u00f6d fr\u00e5n v\u00e4st, hindrade alla anstr\u00e4ngningar
  f\u00f6r en fredlig l\u00f6sning p\u00e5 krisen.\\n\\nSedan uppmanade vi Kiev och
  de v\u00e4stliga huvudst\u00e4derna att inleda en dialog med folket i syd\u00f6stra
  Ukraina och respektera deras intressen,\\n\\nr\u00e4ttigheter och friheter. Den
  regim som tog makten genom statskuppen valde dock krig och inledde straff\u00e5tg\u00e4rder
  mot Donbass under v\u00e5ren och sommaren 2014. \u00c5terigen v\u00e4djade Ryssland
  om fred.\\n\\nVi gjorde allt vi kunde f\u00f6r att ta itu med de br\u00e5dskande
  fr\u00e5gor som uppstod inom ramen f\u00f6r Minsk\u00f6verenskommelserna. Men som
  tidigare betonats visade v\u00e4st och myndigheterna i Kiev ingen avsikt att genomf\u00f6ra
  dem trots muntliga f\u00f6rs\u00e4kringar fr\u00e5n v\u00e5ra kolleger i v\u00e4st,
  d\u00e4ribland chefen f\u00f6r Vita huset, om att de betraktade Minskavtalen som
  avg\u00f6rande och var fast beslutna att genomf\u00f6ra dem. De h\u00e4vdade att
  dessa avtal skulle bidra till att l\u00f6sa situationen i Ukraina, stabilisera landet
  och ta h\u00e4nsyn till intressena hos inv\u00e5narna i \u00f6stra Ukraina. I st\u00e4llet
  inledde de i praktiken en blockad, som jag n\u00e4mnde tidigare, mot Donbass. De
  ukrainska v\u00e4pnade styrkorna f\u00f6rberedde sig systematiskt f\u00f6r en omfattande
  operation som syftade till att f\u00f6rst\u00f6ra folkrepublikerna Donetsk och Lugansk.\\n\\nMinskavtalen
  ignorerades i slut\u00e4ndan genom Kievregimens och v\u00e4stv\u00e4rldens agerande.
  Jag kommer att \u00e5terkomma till detta \u00e4mne inom kort. D\u00e4rf\u00f6r tvingades
  Ryssland 2022 att inleda den s\u00e4rskilda milit\u00e4ra operationen f\u00f6r att
  f\u00e5 slut p\u00e5 kriget i Donbass och skydda civilbefolkningen fr\u00e5n folkmord.\\n\\nRedan
  fr\u00e5n b\u00f6rjan f\u00f6reslog vi konsekvent diplomatiska l\u00f6sningar p\u00e5
  krisen, som jag n\u00e4mnde tidigare i dag. Dessa omfattade f\u00f6rhandlingar i
  Vitryssland och Turkiet, liksom tillbakadragandet av trupper fr\u00e5n Kiev f\u00f6r
  att underl\u00e4tta undertecknandet av Istanbulavtalen, som hade f\u00e5tt ett brett
  st\u00f6d. Men \u00e4ven dessa anstr\u00e4ngningar avvisades. V\u00e4st och Kiev
  framh\u00e4rdade i sin str\u00e4van att besegra oss. Men som ni vet misslyckades
  dessa anstr\u00e4ngningar i slut\u00e4ndan.\\n\\nI dag presenterar vi ett nytt konkret
  och genuint fredsf\u00f6rslag. Om Kiev och de v\u00e4stliga huvudst\u00e4derna avvisar
  det igen, som de har gjort tidigare, blir det i slut\u00e4ndan deras ansvar, b\u00e5de
  politiskt och moraliskt, f\u00f6r den p\u00e5g\u00e5ende blodsutgjutelsen. Det \u00e4r
  uppenbart att situationen vid frontlinjerna kommer att forts\u00e4tta att utvecklas
  till nackdel f\u00f6r Kievregimen, vilket f\u00f6r\u00e4ndrar de f\u00f6ruts\u00e4ttningar
  som kr\u00e4vs f\u00f6r att inleda f\u00f6rhandlingar.\\n\\nL\u00e5t mig understryka
  den viktigaste punkten: k\u00e4rnan i v\u00e5rt f\u00f6rslag \u00e4r inte en tillf\u00e4llig
  vapenvila eller ett eldupph\u00f6r, som v\u00e4st kanske f\u00f6redrar, f\u00f6r
  att ge Kievregimen m\u00f6jlighet att \u00e5terh\u00e4mta sig, \u00e5terupprusta
  och\\n\\nf\u00f6rbereda sig f\u00f6r en ny offensiv. Jag upprepar: vi diskuterar
  inte att frysa konflikten, utan dess definitiva l\u00f6sning.\\n\\nOch jag upprepar:
  s\u00e5 snart Kiev g\u00e5r med p\u00e5 det tillv\u00e4gag\u00e5ngss\u00e4tt som
  f\u00f6resl\u00e5s i dag, inklusive ett fullst\u00e4ndigt tillbakadragande av sina
  trupper fr\u00e5n DPR, LPR, Zaporozhye- och Khersonregionerna, och p\u00e5 allvar
  inleder denna process, \u00e4r vi beredda att omedelbart inleda f\u00f6rhandlingar
  utan dr\u00f6jsm\u00e5l.\\n\\nJag upprepar v\u00e5r fasta h\u00e5llning: Ukraina
  b\u00f6r anta en neutral, alliansfri status, vara k\u00e4rnvapenfritt och genomg\u00e5
  demilitarisering och avnazifiering. Dessa parametrar var man i stort sett \u00f6verens
  om under Istanbulf\u00f6rhandlingarna 2022, inklusive specifika detaljer om demilitarisering,
  s\u00e5som det \u00f6verenskomna antalet stridsvagnar och annan milit\u00e4r utrustning.
  Vi n\u00e5dde samf\u00f6rst\u00e5nd p\u00e5 alla punkter.\\n\\nSj\u00e4lvklart m\u00e5ste
  de rysktalande medborgarnas r\u00e4ttigheter, friheter och intressen i Ukraina skyddas
  fullt ut. De nya territoriella realiteterna, inklusive statusen f\u00f6r Krim, Sevastopol,
  Donetsk och Lugansk folkrepubliker, Kherson och Zaporozhye-regionerna som delar
  av Ryska federationen, b\u00f6r erk\u00e4nnas. Dessa grundl\u00e4ggande principer
  m\u00e5ste formaliseras genom grundl\u00e4ggande internationella avtal i framtiden.
  Naturligtvis inneb\u00e4r detta ocks\u00e5 att alla v\u00e4stliga sanktioner mot
  Ryssland m\u00e5ste upph\u00e4vas.\\n\\nJag anser att Ryssland f\u00f6resl\u00e5r
  ett alternativ som kommer att g\u00f6ra det m\u00f6jligt att verkligen f\u00e5 ett
  slut p\u00e5 kriget i Ukraina, det vill s\u00e4ga vi uppmanar till att v\u00e4nda
  historiens tragiska blad och, \u00e4ven om det \u00e4r sv\u00e5rt, gradvis, steg
  f\u00f6r steg, \u00e5teruppr\u00e4tta f\u00f6rtroende- och grannf\u00f6rbindelserna
  mellan Ryssland och Ukraina och i Europa som helhet.\\n\\nEfter att ha l\u00f6st
  krisen i Ukraina skulle vi, och v\u00e5ra partner i CSTO och SCO, som \u00e4n i
  dag ger ett betydande och konstruktivt bidrag till s\u00f6kandet efter en fredlig
  l\u00f6sning p\u00e5 krisen i Ukraina, samt partner i v\u00e4st, inklusive europeiska
  l\u00e4nder som \u00e4r redo f\u00f6r dialog, kunna inleda den grundl\u00e4ggande
  uppgift som jag talade om i b\u00f6rjan av mitt uttalande, n\u00e4mligen att skapa
  ett odelbart eurasiskt s\u00e4kerhetssystem som tar h\u00e4nsyn till intressena
  hos alla stater p\u00e5 kontinenten utan undantag.\\n\\nNaturligtvis \u00e4r det
  om\u00f6jligt att ordagrant \u00e5terg\u00e5 till de s\u00e4kerhetsf\u00f6rslag
  som vi lade fram f\u00f6r 25, 15 eller till och med tv\u00e5 \u00e5r sedan, eftersom
  alltf\u00f6r mycket har h\u00e4nt och villkoren har f\u00f6r\u00e4ndrats. De grundl\u00e4ggande
  principerna och, viktigast av allt, sj\u00e4lva \u00e4mnet f\u00f6r dialogen f\u00f6rblir
  dock of\u00f6r\u00e4ndrade. Ryssland \u00e4r medvetet om sitt ansvar f\u00f6r den
  globala stabiliteten och bekr\u00e4ftar sin beredvillighet att tala med alla l\u00e4nder.
  Men detta b\u00f6r inte vara en imitation av en fredsprocess f\u00f6r att tj\u00e4na
  n\u00e5gons sj\u00e4lviska vilja eller n\u00e5gons egenintressen, utan ett seri\u00f6st
  och grundligt samtal om alla fr\u00e5gor, om hela spektrumet av fr\u00e5gor som
  r\u00f6r v\u00e4rldens s\u00e4kerhet.\\n\\nK\u00e4ra kolleger!\\n\\nJag tror att
  ni alla \u00e4r v\u00e4l medvetna om de omfattande uppgifter som Ryssland st\u00e5r
  inf\u00f6r och hur mycket vi beh\u00f6ver g\u00f6ra, \u00e4ven p\u00e5 det utrikespolitiska
  omr\u00e5det.\\n\\nJag \u00f6nskar er uppriktigt framg\u00e5ng i detta sv\u00e5ra
  arbete med att garantera Rysslands s\u00e4kerhet, v\u00e5ra nationella intressen,
  st\u00e4rka landets st\u00e4llning i v\u00e4rlden, fr\u00e4mja integration och bilaterala
  f\u00f6rbindelser med v\u00e5ra partner.\\n\\nDet nationella ledarskapet kommer
  f\u00f6r sin del att forts\u00e4tta att ge utrikesministeriet och alla dem som \u00e4r
  involverade i genomf\u00f6randet av Rysslands utrikespolitik det st\u00f6d som kr\u00e4vs.\\n\\nTack
  \u00e4n en g\u00e5ng f\u00f6r ert arbete, tack f\u00f6r ert t\u00e5lamod och er
  uppm\u00e4rksamhet p\u00e5 vad som har sagts. Jag \u00e4r \u00f6vertygad om att
  vi kommer att lyckas.\\n\\nTack s\u00e5 mycket, herr talman.\\n\\n*\\n\\n:\\n\\nSergey
  Lavrov\\n\\nHerr president! F\u00f6rst och fr\u00e4mst vill jag tacka er s\u00e5
  mycket f\u00f6r er bed\u00f6mning av v\u00e5rt arbete.\\n\\nVi f\u00f6rs\u00f6ker,
  och livet f\u00e5r oss att f\u00f6rs\u00f6ka \u00e4nnu h\u00e5rdare, och vi kommer
  att forts\u00e4tta att g\u00f6ra det, eftersom alla f\u00f6rst\u00e5r att detta
  \u00e4r n\u00f6dv\u00e4ndigt f\u00f6r v\u00e5rt lands \u00f6de, f\u00f6r v\u00e5rt
  folks \u00f6de och i viss m\u00e5n f\u00f6r v\u00e4rldens \u00f6de. Vi\\n\\nkommer
  att uppfylla de instruktioner som ni just har skisserat n\u00e4r ni redogjorde f\u00f6r
  begreppet eurasisk s\u00e4kerhet. Vi kommer att f\u00f6lja era instruktioner tillsammans
  med v\u00e5ra kolleger fr\u00e5n andra byr\u00e5er,\\n\\nI samband med uppbyggnaden
  av ett nytt, r\u00e4ttvist och, som ni sa, odelbart s\u00e4kerhetssystem som bygger
  p\u00e5 samma principer kommer vi att forts\u00e4tta att hj\u00e4lpa till att l\u00f6sa
  enskilda krissituationer, av vilka krisen i Ukraina naturligtvis har h\u00f6gsta
  prioritet f\u00f6r oss.\\n\\nVi kommer s\u00e4kert att anv\u00e4nda ert nya initiativ
  i en rad olika situationer, bland annat i v\u00e5rt arbete inom BRICS, Shanghai
  Cooperation Organisation, med Folkrepubliken Kina, med l\u00e4nderna i Latinamerika
  och Afrika, som ocks\u00e5 har lagt fram sina initiativ, men som hittills har ignorerats
  fullst\u00e4ndigt av dem som styr Ukraina.\\n\\nJag tackar er \u00e4n en g\u00e5ng.
  Vi kommer att forts\u00e4tta att g\u00f6ra v\u00e5rt b\u00e4sta.\\n\\nVladimir Putin:\\n\\nTack
  s\u00e5 mycket.\"", "\"Individens behov i centrum \u2013 l\u00e4gesbeskrivning f\u00f6r
  inf\u00f6randet december 2021\\n\\nResultatredovisning av enk\u00e4tunders\u00f6kning
  i Sveriges kommuner\\n\\nDenna publikation skyddas av upphovsr\u00e4ttslagen. Vid
  citat ska k\u00e4llan uppges. F\u00f6r att \u00e5terge bilder, fotografier och illustrationer
  kr\u00e4vs upphovsmannens tillst\u00e5nd.\\n\\nPublikationen finns som pdf p\u00e5
  Socialstyrelsens webbplats. Publikationen kan ocks\u00e5 tas fram i alternativt
  format p\u00e5 beg\u00e4ran. Fr\u00e5gor om alternativa format skickas till firstname.lastname@example.org\\n\\nArtikelnummer
  2022-7-8068\\n\\nPublicerad\\n\\nwww.socialstyrelsen.se, juli 2022\\n\\nF\u00f6rord\\n\\nSyftet
  med unders\u00f6kningen \u00e4r att Socialstyrelsen vill f\u00e5 en uppfattning
  om hur l\u00e5ngt arbetet med Individens behov i centrum, IBIC har kommit i kommunerna.
  Svaren skapar ett v\u00e4rdefullt underlag i arbetet med att uppdatera och anpassa
  det nationella st\u00f6det. F\u00f6r att redovisa utvecklingen i kommunerna \u00f6ver
  tid genomf\u00f6rs \u00e5rligen en enk\u00e4tunders\u00f6kning. Enk\u00e4tunders\u00f6kningen
  har genomf\u00f6rts p\u00e5 olika s\u00e4tt genom \u00e5ren, men de senaste fyra
  g\u00e5ngerna har samtliga kommuner erbjudits att svara p\u00e5 enk\u00e4ten.\\n\\nI
  denna skrift redovisas \u00e5rets resultat. Redovisningen riktar sig till processledare
  f\u00f6r IBIC, beslutsfattare och andra intresserade av att f\u00f6lja utvecklingen
  av inf\u00f6randet av IBIC i landets kommuner.\\n\\nAnsvarig f\u00f6r datainsamlingen
  var Erik Wessman, KST/VSO3. Kontaktpersoner fr\u00e5n Enk\u00e4tst\u00f6d, A/SPEC2
  var Claes Falck, fr\u00e5gekonstrukt\u00f6r, och Lars Holm, statistiker.\\n\\nMagnus
  Wallinder Enhetschef, V\u00e4gledning f\u00f6r socialtj\u00e4nsten 3 Avdelningen
  f\u00f6r Kunskapsstyrning f\u00f6r socialtj\u00e4nsten\\n\\nInneh\u00e5ll\\n\\nSammanfattning\\n\\nI
  \u00e5r \u00e4r det tio \u00e5r sedan \u00c4ldres behov i centrum, \u00c4BIC, lanserades.
  Modellen har sedan dess vidareutvecklats och m\u00e5lgruppen vidgats. 2016 lanserades
  Individens behov i centrum, IBIC, som d\u00e5 omfattade alla vuxna i behov av st\u00f6d
  i den dagliga livsf\u00f6ringen enligt SoL och LSS. 2020 kompletterades modellen
  s\u00e5 att den nu omfattar alla \u00e5ldrar. 1 Sedan 2013 har Socialstyrelsen p\u00e5
  olika s\u00e4tt f\u00f6ljt utvecklingen och inf\u00f6randet f\u00f6r att dels f\u00e5
  en nationell bild av hur l\u00e5ngt inf\u00f6randet har kommit, dels f\u00f6r att
  kunna f\u00f6rb\u00e4ttra och anpassa v\u00e5rt st\u00f6d f\u00f6r inf\u00f6rande.\\n\\nSammantaget
  visar \u00e5rets enk\u00e4tresultat p\u00e5 ett \u00f6kat anv\u00e4ndande av IBIC
  och att allt fler kommuner inf\u00f6rt eller kommit l\u00e4ngre i sitt inf\u00f6rande.
  D\u00e4remot anv\u00e4nds fortfarande inte den strukturerade dokumentationen utifr\u00e5n
  IBIC i n\u00e5got st\u00f6rre utstr\u00e4ckning f\u00f6r verksamhetsutveckling och
  kvalitetsarbete, och h\u00e4r ser vi inte att det sker en utveckling. J\u00e4mf\u00f6relser
  med tidigare \u00e5r visar \u00e4ven att inf\u00f6randet tar tid och att det finns
  hinder som p\u00e5verkar takten i en del kommuner.\\n\\nI december 2021 uppgav 76%
  av de 226 svarande kommunerna att de hade inf\u00f6rt eller p\u00e5b\u00f6rjat ett
  inf\u00f6rande av IBIC inom \u00e4ldreomr\u00e5det, 75% inom funktionshinderomr\u00e5det
  SoL, 68% inom LSS och 64% av kommunerna inom omr\u00e5det barn med funktionsneds\u00e4ttning
  2 . Om man sl\u00e5r ihop de kommuner som har inf\u00f6rt eller p\u00e5b\u00f6rjat
  inf\u00f6rande av IBIC, med de som planerar ett inf\u00f6rande uppger n\u00e4stan
  nio av tio svarande kommuner att de inf\u00f6r eller avser inf\u00f6ra IBIC p\u00e5
  samtliga omr\u00e5den.\\n\\nI kommentarer till enk\u00e4tsvaren \u00e5terkommer
  att de som avvaktar eller pausat inf\u00f6rande antingen inv\u00e4ntar dokumentationssystem
  som st\u00f6der den strukturerade dokumentationen utifr\u00e5n IBIC eller att de
  saknar f\u00f6ruts\u00e4ttningar lokalt. Det kan handla om att det saknas st\u00f6d
  fr\u00e5n ledning, att det inte avs\u00e4tts resurser f\u00f6r f\u00f6r\u00e4ndringsarbetet
  eller att IBIC inte prioriteras.\\n\\n1 Individens behov i centrum, IBIC - Socialstyrelsen,
  Individens behov i centrum, IBIC - Kunskapsguiden\\n\\n2 Avser verksamhet f\u00f6r
  barn med funktionsneds\u00e4ttning som beh\u00f6ver st\u00f6d i den dagliga livsf\u00f6ringen,
  enligt SoL eller\\n\\nLSS.\\n\\nInledning\\n\\nEnk\u00e4tunders\u00f6kningen\\n\\nDenna
  enk\u00e4tunders\u00f6kning har v\u00e4nt sig till alla kommuner i Sverige. Enk\u00e4ten
  bestod av \u00e5tta fr\u00e5gor. Fr\u00e5gorna bestod av en blandning av fr\u00e5gor
  med fasta svarsalternativ och \u00f6ppna fr\u00e5gor. Unders\u00f6kningens referensperiod
  \u00e4r nul\u00e4ge. Datainsamlingen har genomf\u00f6rts via en webbenk\u00e4t under
  november-december 2021. F\u00f6rutom de variabler som samlades in via enk\u00e4ten
  h\u00e4mtades uppgift om kommunernas inv\u00e5narantal per 2020-12-31 fr\u00e5n
  register. Det var 226 kommuner som besvarade enk\u00e4ten. Det ger en svarsfrekvens
  p\u00e5 78 procent, vilket \u00e4r n\u00e5got l\u00e4gre \u00e4n f\u00f6reg\u00e5ende
  \u00e5r. F\u00f6r mer information om unders\u00f6kningen och dess genomf\u00f6rande,
  se Bilaga 6.\\n\\nEnk\u00e4tens fr\u00e5gor handlar om inf\u00f6randet av IBIC inom
  \u00e4ldreomr\u00e5det och funktionshinderomr\u00e5det, uppdelat p\u00e5 LSS och
  personer under 65 \u00e5r som f\u00e5r st\u00f6d enligt SoL. \u00c5rets enk\u00e4t
  inneh\u00f6ll \u00e4ven fr\u00e5gor om anv\u00e4ndningen av IBIC f\u00f6r utredning
  och st\u00f6d till barn med funktionsneds\u00e4ttning enligt SoL eller LSS. F\u00f6r
  enk\u00e4tfr\u00e5gorna, se Bilaga 7.\\n\\nTabell 1. Antal svarande kommuner - J\u00e4mf\u00f6relse
  med tidigare \u00e5r 3\\n\\n|  |  | 2017 |  | 2018 |  | 2019 | 2021 |\\n|---|---|---|---|---|---|---|---|\\n|
  Antal svarande | 235 |  | 223 |  | 243 |  |  |\\n| Svarsfrekvens | 81% |  | 77%
  |  | 84% |  |  |\\n| Antal utskickade enk\u00e4ter | 290 |  | 290 |  | 290 |  |  |\\n\\n3
  Enk\u00e4tunders\u00f6kningen har genomf\u00f6rts runt \u00e5rsskiftet varje \u00e5r.
  Sedan 2017 har enk\u00e4ten g\u00e5tt till samtliga kommuner. Enk\u00e4ten skickades
  f\u00f6r 2017 till registrerade kontaktpersoner i 230 kommuner och till registrator
  i \u00f6vriga kommuner, f\u00f6r 2018 och senare skickades samtliga enk\u00e4ter
  till registrator. Detta kan p\u00e5verka j\u00e4mf\u00f6relser mellan 2017 och senare
  \u00e5r.\\n\\nResultatredovisning \u2013 \u00c4ldreomr\u00e5det\\n\\nHar ni inf\u00f6rt
  IBIC eller har ni en planering f\u00f6r inf\u00f6randet av IBIC i din kommun?\\n\\nTabell
