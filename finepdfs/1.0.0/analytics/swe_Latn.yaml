  Z19DTR\\n\\n55213955\\n\\n-\\n\\n-\\n\\nAnm\u00e4rkning:\\n\\n1.9 TTID4 SPORTSEDAN
  (130HK) 1.9TTID Z19DTR 6VX MAN\"", "\"Ekonomisk rapport\\n\\n\u00d6versikt\\n\\nDen
  ekonomiska och monet\u00e4ra utvecklingen\\n\\n\u00d6versikt\\n\\nVid sitt penningpolitiska
  sammantr\u00e4de den 13 december 2018 beslutade ECB-r\u00e5det att avsluta nettotillg\u00e5ngsk\u00f6pen
  i december 2018 samt att h\u00e5lla styrr\u00e4ntorna of\u00f6r\u00e4ndrade och
  att precisera framtidsindikationerna om \u00e5terinvesteringar. Inkommande information
  har visserligen varit svagare \u00e4n f\u00f6rv\u00e4ntat, beroende p\u00e5 d\u00e4mpad
  utl\u00e4ndsk efterfr\u00e5gan men \u00e4ven p\u00e5 vissa landsoch sektorsspecifika
  faktorer. Dock forts\u00e4tter den underliggande styrkan i den inhemska efterfr\u00e5gan
  att ge st\u00f6d \u00e5t expansionen i euroomr\u00e5det och gradvis stigande inflationstryck.
  Detta st\u00e4rker ECB-r\u00e5dets uppfattning om att konvergensen mot inflationsm\u00e5let
  kommer att forts\u00e4tta och bibeh\u00e5llas \u00e4ven sedan nettotillg\u00e5ngsk\u00f6pen
  har upph\u00f6rt. Samtidigt r\u00e5der tydlig os\u00e4kerhet avseende geopolitiska
  faktorer, hot om protektionism, svagheter i tillv\u00e4xtekonomier och volatilitet
  p\u00e5 finansmarknaderna. F\u00f6ljaktligen finns det fortsatt behov av betydande
  penningpolitisk stimulans f\u00f6r att st\u00f6dja den fortsatta uppbyggnaden av
  inhemskt pristryck och inflationsutvecklingen p\u00e5 medell\u00e5ng sikt. ECB-r\u00e5dets
  framtidsindikationer om styrr\u00e4ntorna, som f\u00f6rst\u00e4rkts genom \u00e5terinvesteringar
  av den betydande stocken av f\u00f6rv\u00e4rvade tillg\u00e5ngar, forts\u00e4tter
  att ge den n\u00f6dv\u00e4ndiga graden av penningpolitisk stimulans f\u00f6r bibeh\u00e5llen
  konvergens mot inflationsm\u00e5let. ECB-r\u00e5det \u00e4r under alla omst\u00e4ndigheter
  redo att p\u00e5 l\u00e4mpligt s\u00e4tt justera samtliga instrument f\u00f6r att
  s\u00e4kerst\u00e4lla att inflationen \u00e4ven forts\u00e4ttningsvis varaktigt
  r\u00f6r sig mot inflationsm\u00e5let.\\n\\nEkonomisk och monet\u00e4r bed\u00f6mning
  vid tidpunkten f\u00f6r ECB-r\u00e5dets sammantr\u00e4de den 13 december 2018\\n\\nDen
  globala aktiviteten har varit fortsatt motst\u00e5ndskraftig men blivit mer oj\u00e4mn
  och det kommer nu tecken p\u00e5 en inbromsning. Den globala aktiviteten tyngs av
  den mognande globala konjunkturcykeln, det avtagande politiska st\u00f6det i utvecklade
  ekonomier samt effekterna av tullar mellan USA och Kina. Tillv\u00e4xten i den globala
  handeln har avtagit n\u00e5got och os\u00e4kerheten om framtida handelsrelationer
  har \u00f6kat. De finansiella f\u00f6rh\u00e5llandena \u00e4r fortsatt ackommoderande
  i utvecklade ekonomier samtidigt som de har blivit n\u00e5got stramare i vissa tillv\u00e4xtekonomier.
  Den globala ekonomiska aktiviteten v\u00e4ntas tappa fart 2019 och d\u00e4refter
  bli fortsatt stabil. Det globala inflationstrycket v\u00e4ntas stiga l\u00e5ngsamt
  n\u00e4r reservkapaciteten minskar.\\n\\nL\u00e5nga riskfria r\u00e4ntor har g\u00e5tt
  ned mot bakgrund av \u00f6kande geopolitisk oro och den uppfattade f\u00f6rs\u00e4mringen
  av makroekonomiska utsikter sedan ECB-r\u00e5dets sammantr\u00e4de i september 2018.
  Statsobligationsspreadar i euroomr\u00e5det har varit i stort sett stabila med undantag
  f\u00f6r Italien d\u00e4r de uppvisat en v\u00e4sentlig volatilitet.\\n\\nECB Ekonomisk
  rapport Utg\u00e5va 4 / 2018 \u2013 Den ekonomiska och monet\u00e4ra utvecklingen\\n\\n2\\n\\n\u00c4ven
  om f\u00f6retagsvinster f\u00f6rv\u00e4ntas f\u00f6rbli fortsatt robusta har vissa
  nedrevideringar, ut\u00f6ver omv\u00e4rdering av risk, lett till l\u00e4gre priser
  p\u00e5 aktier och obligationer i f\u00f6retag i euroomr\u00e5det. P\u00e5 valutamarknaderna
  har euron p\u00e5 det stora hela f\u00f6rsvagats i handelsv\u00e4gda termer.\\n\\nReal
  BNP i euroomr\u00e5det \u00f6kade med 0,2 procent p\u00e5 kvartalsbasis under det
  tredje kvartalet 2018, efter att ha stigit 0,4 procent under de f\u00f6reg\u00e5ende\\n\\nkvartalen.
  De senaste uppgifterna och enk\u00e4tresultaten har utfallit svagare \u00e4n v\u00e4ntat.
  Detta \u00e5terspeglar ett minskande bidrag fr\u00e5n utl\u00e4ndsk efterfr\u00e5gan
  samt vissa landsoch sektorsspecifika faktorer. \u00c4ven om effekten av vissa av
  dessa faktorer sannolikt avtar kan detta tyda p\u00e5 att tillv\u00e4xttakten blir
  n\u00e5got l\u00e5ngsammare fram\u00f6ver. Samtidigt forts\u00e4tter inhemsk efterfr\u00e5gan,
  \u00e4ven st\u00e4rkt av ECB-r\u00e5dets ackommoderande penningpolitik, att ge st\u00f6d
  \u00e5t den ekonomiska expansionen i euroomr\u00e5det. Privat konsumtion st\u00f6ds
  alltj\u00e4mt av den starka arbetsmarknaden, som \u00e5terspeglas i fortsatt \u00f6kad
  syssels\u00e4ttning och stigande l\u00f6ner. F\u00f6retagsinvesteringarna fr\u00e4mjas
  dessutom av inhemsk efterfr\u00e5gan, gynnsamma finansieringsf\u00f6rh\u00e5llanden
  och allt b\u00e4ttre balansr\u00e4kningar. Tillv\u00e4xten i bostadsinvesteringar
  \u00e4r fortsatt robust. Vidare f\u00f6rv\u00e4ntas en fortsatt expansion i den
  globala ekonomin. Detta ger st\u00f6d \u00e5t euroomr\u00e5dets export, om \u00e4n
  i l\u00e5ngsammare takt.\\n\\nDenna bed\u00f6mning \u00e5terspeglas ocks\u00e5 i
  stort sett i de makroekonomiska framtidsbed\u00f6mningarna av Eurosystemets experter
  f\u00f6r euroomr\u00e5det i december 2018. D\u00e4ri prognostiseras en \u00e5rlig
  real BNP-\u00f6kning med 1,9 procent 2018, 1,7 procent 2019, 1,7 procent 2020 och
  1,5 procent 2021. J\u00e4mf\u00f6rt med de makroekonomiska framtidsbed\u00f6mningar
  som ECB:s experter presenterade i september 2018 har utsikterna f\u00f6r den reala
  BNP-tillv\u00e4xten reviderats ned n\u00e5got f\u00f6r 2018 och 2019. Riskerna f\u00f6r
  euroomr\u00e5dets tillv\u00e4xtutsikter bed\u00f6ms fortsatt vara i stort sett balanserade.
  Riskbalansen r\u00f6r sig emellertid mot ned\u00e5tsidan till f\u00f6ljd av fortsatt
  os\u00e4kerhet vad g\u00e4ller geopolitiska faktorer, \u00f6kad protektionism, svagheter
  i tillv\u00e4xtekonomierna och finansmarknadsvolatilitet.\\n\\nEnligt Eurostats
  prelimin\u00e4ra uppskattning sj\u00f6nk den \u00e5rliga HIKP-inflationen i euroomr\u00e5det
  till 2,0% i november 2018, fr\u00e5n 2,2% i oktober. Baserat p\u00e5 aktuella terminspriser
  p\u00e5 olja torde den totala inflationen minska under de kommande m\u00e5naderna.
  M\u00e5tten p\u00e5 underliggande inflation \u00e4r \u00f6verlag alltj\u00e4mt d\u00e4mpade,
  men inhemskt kostnadstryck forts\u00e4tter att st\u00e4rkas och breddas mot bakgrund
  av h\u00f6gt kapacitetsutnyttjande och stramare arbetsmarknader, vilket driver upp
  l\u00f6neutvecklingen. Fram\u00f6ver v\u00e4ntas den underliggande inflationen stiga
  p\u00e5 medell\u00e5ng sikt med st\u00f6d av ECB:s penningpolitiska \u00e5tg\u00e4rder,
  fortsatt ekonomisk expansion och stigande l\u00f6ne\u00f6kningstakt.\\n\\nDenna
  bed\u00f6mning \u00e5terspeglas ocks\u00e5 i stort sett i de makroekonomiska framtidsbed\u00f6mningarna
  av Eurosystemets experter f\u00f6r euroomr\u00e5det i december 2018. D\u00e4ri f\u00f6rutses
  en \u00e5rlig HIKP-inflation p\u00e5 1,8 procent 2018, 1,6 procent 2019, 1,7 procent
  2020 och 1,8 procent 2021. J\u00e4mf\u00f6rt med de makroekonomiska framtidsbed\u00f6mningarna
  fr\u00e5n september 2018 har utsikterna f\u00f6r HIKP-inflationen reviderats upp
  n\u00e5got f\u00f6r 2018 och ned n\u00e5got f\u00f6r 2019. HIKPinflationen, exklusive
  energi och livsmedel, v\u00e4ntas \u00f6ka gradvis fr\u00e5n 1,0\u00a0procent 2018
  till 1,4\u00a0procent 2019, 1,6\u00a0procent 2020 och 1,8\u00a0procent 2021.\\n\\nECB
  Ekonomisk rapport Utg\u00e5va 4 / 2018 \u2013 Den ekonomiska och monet\u00e4ra utvecklingen\\n\\n3\\n\\nM3-tillv\u00e4xten
  tog fart i oktober 2018 mot bakgrund av en p\u00e5g\u00e5ende v\u00e4ndning mot
  mer sj\u00e4lvunderh\u00e5llande k\u00e4llor till penningm\u00e4ngds\u00f6kning
  allteftersom de m\u00e5natliga nettok\u00f6pen av v\u00e4rdepapper inom tillg\u00e5ngsk\u00f6psprogrammet
  minskades. Utl\u00e5ning till den privata sektorn fortsatte att v\u00e4xa och var
  fortsatt st\u00f6rsta drivande kraft i \u00f6kningstakten i den breda penningm\u00e4ngden,
  om \u00e4n med vissa tecken p\u00e5 avmattning, fr\u00e4mst avseende l\u00e5n till
  icke-finansiella f\u00f6retag. Samtidigt har bankfinansiering och l\u00e5nevillkor
  varit fortsatt mycket gynnsamma. Genomslaget av de penningpolitiska \u00e5tg\u00e4rder
  som vidtagits sedan juni 2014 forts\u00e4tter att p\u00e5 ett betydande s\u00e4tt
  ge st\u00f6d \u00e5t l\u00e5nevillkoren f\u00f6r f\u00f6retag och hush\u00e5ll,
  tillg\u00e5ngen till finansiering \u2013 fr\u00e4mst f\u00f6r sm\u00e5 och medelstora
  f\u00f6retag \u2013 och kreditfl\u00f6dena i hela euroomr\u00e5det.\\n\\nEuroomr\u00e5dets
  underskott i de offentliga finanserna bed\u00f6ms ha minskat betydligt under 2018
  men \u00f6ka n\u00e5got n\u00e4sta \u00e5r. Minskningen 2018 var fr\u00e4mst resultatet
  av gynnsamma konjunkturf\u00f6rh\u00e5llanden och minskande r\u00e4ntebetalningar.
  Den aggregerade finanspolitiska inriktningen f\u00f6r euroomr\u00e5det ber\u00e4knas
  vara i stort sett neutral 2018, l\u00e4tta 2019 och 2020 f\u00f6r att d\u00e4refter
  \u00e5ter bli neutral 2021.\\n\\nPenningpolitiska beslut\\n\\nBaserat p\u00e5 de
  ordinarie ekonomiska och penningpolitiska analyserna fattade ECB-r\u00e5det f\u00f6ljande
  beslut. ECB-r\u00e5det beslutade att h\u00e5lla styrr\u00e4ntorna of\u00f6r\u00e4ndrade
  och utg\u00e5r fr\u00e5n att de \u00e4ven forts\u00e4ttningsvis ligger kvar p\u00e5
  nuvarande niv\u00e5er \u00e5tminstone \u00f6ver sommaren 2019 och i vilket fall
  som helst s\u00e5 l\u00e4nge det \u00e4r n\u00f6dv\u00e4ndigt f\u00f6r att s\u00e4kerst\u00e4lla
  en fortsatt varaktig inflationskonvergens mot niv\u00e5er under, men n\u00e4ra,
  2\u00a0procent p\u00e5 medell\u00e5ng sikt. Vad g\u00e4ller extraordin\u00e4ra penningpolitiska
  \u00e5tg\u00e4rder beslutade ECB-r\u00e5det att nettok\u00f6pen inom ramen f\u00f6r
  programmet f\u00f6r k\u00f6p av tillg\u00e5ngar (APP) ska upph\u00f6ra i december
  2018. Samtidigt preciserade ECB-r\u00e5det sina framtidsindikationer om \u00e5terinvesteringar.
  I enlighet d\u00e4rmed \u00e4mnar ECB-r\u00e5det forts\u00e4tta att fullt ut \u00e5terinvestera
  f\u00f6rfall av v\u00e4rdepapper som f\u00f6rv\u00e4rvats inom ramen f\u00f6r APP
  under en f\u00f6rl\u00e4ngd tidsperiod efter det datum d\u00e5 ECB-r\u00e5det b\u00f6rjar
  h\u00f6ja styrr\u00e4ntorna, och i varje fall s\u00e5 l\u00e4nge det \u00e4r n\u00f6dv\u00e4ndigt
  f\u00f6r att bibeh\u00e5lla gynnsamma likviditetsvillkor och en v\u00e4sentlig grad
  av ackommoderande penningpolitik.\\n\\nECB Ekonomisk rapport Utg\u00e5va 4 / 2018
  \u2013 Den ekonomiska och monet\u00e4ra utvecklingen\\n\\n4\\n\\n\u00a9 European
  Central Bank\\n\\nPostadress\\n\\n60640 Frankfurt am Main, Tyskland\\n\\nTelefon\\n\\n+49
  69 1344 0\\n\\nInternet\\n\\nwww.ecb.europa.eu / www.esrb.europa.eu\\n\\nDenna rapport
