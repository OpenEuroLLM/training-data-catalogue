  skolor\\n* Analysera resultat i grundskolan\\n* Bed\u00f6ma olika kvalitetsaspekter
  i verksamheten\\n* Skriftlig och muntlig rapport till uppdragsgivaren\\n\\nUnderlag
  i form av ekonomiuppgifter och verksamhetsuppgifter har inh\u00e4mtats fr\u00e5n
  ber\u00f6rda tj\u00e4nstem\u00e4n via s\u00e4rskilda blanketter.\\n\\nF\u00f6rvaltningschef
