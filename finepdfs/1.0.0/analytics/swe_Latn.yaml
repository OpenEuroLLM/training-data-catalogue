  med uppgifter att sammanst\u00e4lla och att detta kommer prioriteras fram\u00e5t.
  F\u00f6r f\u00f6rteckning \u00f6ver svarande kommuner, se bilaga 5.\\n\\nJ\u00e4mf\u00f6relser\\n\\nI
  detta kapitel redovisas j\u00e4mf\u00f6relser mellan verksamhetsomr\u00e5den och
  \u00f6ver tid. F\u00f6r omr\u00e5det verksamhet f\u00f6r barn med funktionsneds\u00e4ttning
  finns inga j\u00e4mf\u00f6rbara uppgifter d\u00e5 fr\u00e5gorna f\u00f6r omr\u00e5det
  \u00e4r nya i \u00e5rets enk\u00e4t.\\n\\nP\u00e5b\u00f6rjat inf\u00f6rande - j\u00e4mf\u00f6relse
  mellan omr\u00e5den\\n\\nSom figur 5 nedan visar \u00e4r det flest kommuner som
  inf\u00f6rt eller p\u00e5b\u00f6rjat inf\u00f6rande inom \u00e4ldreomr\u00e5det,
  f\u00f6ljt av funktionshinderomr\u00e5det SoL, LSS och barn, som lanserades januari
  2020.\\n\\nP\u00e5b\u00f6rjat inf\u00f6rande per omr\u00e5de j\u00e4mf\u00f6relse
  \u00f6ver tid\\n\\nVid en j\u00e4mf\u00f6relse med tidigare \u00e5r kan man se att
  antalet som inf\u00f6rt eller p\u00e5b\u00f6rjat inf\u00f6rande \u00f6kat det senaste
  \u00e5ret inom alla omr\u00e5den, f\u00f6rutom barnomr\u00e5det d\u00e4r inga j\u00e4mf\u00f6relser
  med tidigare \u00e5r kan g\u00f6ras d\u00e5 omr\u00e5det \u00e4r nytt i enk\u00e4ten.
  Socialstyrelsen har sedan 2014 \u00e5rligen genomf\u00f6rt en enk\u00e4tunders\u00f6kning
  f\u00f6r att f\u00f6lja inf\u00f6randet av IBIC i landet.\\n\\nOmfattningen av enk\u00e4tunders\u00f6kningen
  har sett olika ut \u00f6ver tid. 2014\u20132016 skickades enk\u00e4ten till utbildade
  processledare. 2017 skickades enk\u00e4ten till kontaktpersoner f\u00f6r IBIC i
  de kommuner som hade kontaktpersoner, och till registrator i \u00f6vriga kommuner.
  Fr\u00e5n och med 2018 skickas enk\u00e4ten till registrator i kommunerna. Det g\u00f6r
  att j\u00e4mf\u00f6relsen \u00f6ver tid inte \u00e4r helt j\u00e4mf\u00f6rbara,
  men\\n\\nunders\u00f6kningen har fr\u00e5n och med 2018 genomf\u00f6rts p\u00e5
  samma s\u00e4tt vilket medf\u00f6r att siffrorna f\u00f6r de tre senaste unders\u00f6kningarna
  \u00e4r helt j\u00e4mf\u00f6rbara.\\n\\n\u00c4ldreomr\u00e5det\\n\\nTabell 22 nedan
