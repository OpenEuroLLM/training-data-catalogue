  Vi har inf\u00f6rt | 47% |  | 106 |  |\\n| Vi har p\u00e5b\u00f6rjat inf\u00f6randet
  | 29% |  | 66 |  |\\n| Vi ska p\u00e5b\u00f6rja inf\u00f6randet under 2022 | 8%
