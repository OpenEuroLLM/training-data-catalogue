sample: '["\"NOSA f\u00e5r sin f\u00f6rsta best\u00e4llning fr\u00e5n tjeckisk distribut\u00f6r\\n\\nNOSA
  har mottagit sin f\u00f6rsta order fr\u00e5n en distribut\u00f6r i Tjeckien. Det
  var efter att flertalet poliser i landet b\u00f6rjat efterfr\u00e5ga NOSA plugs
  som LT Sezam valde att ta in och b\u00f6rja s\u00e4lja produkten. LT Sezam har ett
  skr\u00e4ddarsytt sortiment, anpassat f\u00f6r kunder inom law enforcement och kriminalv\u00e5rd.
  Polis och r\u00e4ddningstj\u00e4nst \u00e4r en av Nosas prioriterade kundsegment;
  de \u00e4r ofta utsatta f\u00f6r p\u00e5frestande arbetssituationer d\u00e4r d\u00e5lig
  lukt kan f\u00f6rekomma vilket g\u00f6r dem till potentiella stor-anv\u00e4ndare
  och de \u00e4r \u00e4ven ofta \\\"Early adopters\\\".\\n\\n\u00c4ven om Tjeckien
  inte \u00e4r en prioriterad marknad \u00e4r det en intressant marknad med relativt
  stor potential, givet sina 10,5 miljoner inv\u00e5nare, \u00f6ver 50 tusen poliser,
  370 tusen v\u00e5rdanst\u00e4llda, samt det faktum att det finns synergier och spill-over
  fr\u00e5n n\u00e5gra av NOSAs mest prioriterade intilliggande geografiska marknader.\\n\\n\\\"Vi
  \u00e4r givetvis v\u00e4ldigt glada \u00f6ver att f\u00e5 f\u00f6rtroende fr\u00e5n
  och f\u00e5 samarbeta med en av de fr\u00e4msta distribut\u00f6rerna inom en av
  v\u00e5ra prioriterade samh\u00e4llskritiska funktioner, \\\"Law enforcement\\\",
  i Tjeckien. Vi ser fram emot att f\u00e5 \u00e4ntra denna nya marknad tillsammans
  och \u00e4r \u00f6vertygade om att samarbetet kommer att \u00f6ppna upp \u00e4ven
  f\u00f6r v\u00e5ra andra l\u00f6sningar, s\u00e4ger Adrian Liljefors, VD p\u00e5
  Nosa Plugs.\\n\\nLt Sezam \u00e4r en f\u00f6rh\u00e5llandevis liten distribut\u00f6r
  och ber\u00e4knas inte p\u00e5verka \u00e5rets resultat n\u00e4mnv\u00e4rt.\\n\\nF\u00f6r
  ytterligare information:\\n\\nAdrian Liljefors, VD Nosa Plugs AB E-mail:\u00a0email@example.com\\n\\nKort
  om NOSA:\\n\\nNOSA Plugs AB (publ) \u00e4r ett svenskt medicintekniskt bolag som
  sedan 2023/03/16 \u00e4r noterat p\u00e5 Nasdaq First North Growth Market under
  ticker \\\"NOSA\\\". FNCA Sweden AB \u00e4r Certified Adviser. Tel +46 (0) 8 528
  00 399, . firstname.lastname@example.org\\n\\nNOSAs pressmeddelanden finns tillg\u00e4ngliga
  p\u00e5investor.nosamed.com\\n\\nBifogade filer\\n\\nNOSA f\u00e5r sin f\u00f6rsta
  best\u00e4llning fr\u00e5n tjeckisk distribut\u00f6r\"", "\"Digitalisering och sjukv\u00e5rd\\n\\nM\u00e5rten
  Blix\\nInstitutet f\u00f6r N\u00e4ringslivsforskning\\n\\nCharlotta Levay\\nLunds
  Universitet\\n\\nMinns ni?\\n\\nSjukv\u00e5rdens digitala transformation\\n\\n\u2022
  Medicinsk forskning och behandling har redan revolutionerats\\n\u2022 Sjukv\u00e5rdens
  organisering har f\u00f6r\u00e4ndrats mindre\\n\u2022 Snabb utveckling av appar,
  program och h\u00e5rdvara\\n\u2022 V\u00e4gval f\u00f6r svensk sjukv\u00e5rd\\n\\nHur
