  till \u00e4ven omfatta barn med funktionsneds\u00e4ttning som beh\u00f6ver st\u00f6d
  i den dagliga livsf\u00f6ringen omfattade enk\u00e4tunders\u00f6kningen 2019 en
  fr\u00e5ga kring kommunens anv\u00e4ndning av IBIC f\u00f6r barn med funktionsneds\u00e4ttning.
  Resultatet visade d\u00e5 att en tredjedel av kommunerna som inf\u00f6rt eller p\u00e5b\u00f6rjat
  inf\u00f6rande av IBIC anv\u00e4nder IBIC f\u00f6r utredning enligt SoL och knappt
  tv\u00e5 tredjedelar f\u00f6r LSS.\\n\\nF\u00f6ljande fr\u00e5gor \u00e4r nya i
  enk\u00e4ten f\u00f6r detta \u00e5r och har st\u00e4llts p\u00e5 samma s\u00e4tt
  som \u00f6vriga omr\u00e5den, vilket inte var fallet 2019 7 . Det finns d\u00e4rf\u00f6r
  inte n\u00e5gra j\u00e4mf\u00f6relser med tidigare \u00e5r.\\n\\nHar ni inf\u00f6rt
  IBIC eller har ni en planering f\u00f6r inf\u00f6randet av IBIC i din kommun?\\n\\nTabell
  17. Antal och andel kommuner som inf\u00f6rt, p\u00e5b\u00f6rjat inf\u00f6rande
  eller planerar f\u00f6r inf\u00f6rande av IBIC inom f\u00f6r verksamhet f\u00f6r
  barn med funktionsneds\u00e4ttning med st\u00f6d enligt SoL ellerLSS.\\n\\n| Har
  inf\u00f6rt | 38% |\\n|---|---|\\n| Har p\u00e5b\u00f6rjat inf\u00f6randet | 26%
  |\\n| Ska p\u00e5b\u00f6rja inf\u00f6randet under 2022 | 11% |\\n| Ska p\u00e5b\u00f6rja
  inf\u00f6randet, ej tidsatt | 11% |\\n| Har ingen planering/Vet inte | 15% |\\n|
  Total | 100% |\\n\\n144 svarande kommuner har inf\u00f6rt eller p\u00e5b\u00f6rjat
  inf\u00f6rande. Av de kommuner som inte p\u00e5b\u00f6rjat inf\u00f6rande anger
  52% att man har beslut p\u00e5 politisk eller ledningsniv\u00e5 om inf\u00f6rande
  av IBIC. F\u00f6r f\u00f6rteckning \u00f6ver svarande kommuner, se bilaga 3.\\n\\n7
  2019 hade enk\u00e4ten endast en fr\u00e5ga som avs\u00e5g anv\u00e4ndning av IBIC
  inom verksamhet f\u00f6r barn med funktionsneds\u00e4ttning som beh\u00f6ver st\u00f6d
  i den dagliga livsf\u00f6ringen.\\n\\nL\u00e4get f\u00f6r inf\u00f6rande utifr\u00e5n
  kommunstorlek\\n\\nI kommentarerna till fr\u00e5gan \u00e5terkommer, som f\u00f6rklaring
  till att det inte finns planering f\u00f6r inf\u00f6rande, att systemet inte st\u00f6der
  IBIC, man avvaktar upphandling av nytt system, resursbrister eller att det saknas
  beslut om inf\u00f6rande inom omr\u00e5det.\\n\\nHur l\u00e5ngt har er kommun kommit
  i inf\u00f6randet av IBIC n\u00e4r det g\u00e4ller barn med funktionsneds\u00e4ttning?\\n\\nDelfr\u00e5gorna
  handlar om handl\u00e4ggare, kommunala och privata utf\u00f6rare utreder, planerar,
  dokumenterar och f\u00f6ljer upp utifr\u00e5n IBIC. Eftersom IBIC vidareutvecklades
  f\u00f6r barn med funktionsneds\u00e4ttning 2020 har inf\u00f6randet i kommuner
  inte kommit lika l\u00e5ngt som \u00f6vriga redovisade omr\u00e5den.\\n\\nFlera
  uppger \u00e4ven att man anv\u00e4nder IBIC som tankes\u00e4tt och st\u00f6d f\u00f6r
  dokumentation, men p\u00e5 ett mer \u00f6vergripande s\u00e4tt \u00e4n det som beskrivs
  i Socialstyrelsens v\u00e4gledning. Personlig assistans uppges som ett omr\u00e5de
  d\u00e4r avsteg fr\u00e5n modellen g\u00f6rs. Flera uppger \u00e4ven att IBIC anv\u00e4nds
  f\u00f6r utredning om insatser enligt LSS, medan st\u00f6d enligt SoL till barn
  utreds enligt BBIC.\\n\\nI kommentarerna \u00e5terkommer att man kommit olika l\u00e5ngt
  i olika enheter/verksamheter och att viss dokumentation sker enligt IBIC medan andra
  delar \u00e4nnu inte. Av kommentarerna framg\u00e5r att det varierar hur v\u00e4l
  kommunen har koll p\u00e5 hur privata utf\u00f6rare anv\u00e4nder och dokumenterar
  enligt IBIC och att man inte har krav p\u00e5 detta i avtal med privata utf\u00f6rare.\\n\\nHandl\u00e4ggare
