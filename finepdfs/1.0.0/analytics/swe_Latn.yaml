sample: '["\"Umida: VD-brev mars 2018\\n\\nI mitt f\u00f6rra VD-brev n\u00e4mnde jag
  kort att det h\u00e4nder mycket i det nyf\u00f6rv\u00e4rvade bolaget Brand For Fans,
  som \u00e4r en del av Umida Group sedan 31 december 2017. Jag t\u00e4nker denna
  g\u00e5ng ber\u00e4tta mer om Brands For Fans som bolag och om de mest aktuella
  lanseringarna och marknadsaktiviteterna i deras produkt- och varum\u00e4rkesportf\u00f6lj.
  Dessutom ge en kort uppdatering om en viktig aff\u00e4r och nytt samarbete med Menigo,
  vilket kommunicerades tidigare i veckan.\\n\\nBrands For Fans \u00e4r ett sp\u00e4nnande
  f\u00f6retag med ett unikt erbjudande. Det \u00e4r ett ledande svenskt bolag p\u00e5
  en global arena med aff\u00e4rsid\u00e9n att via livsstilsprodukter st\u00e4rka
  relationen mellan band och artister och deras fans. Brands For Fans utvecklar, marknadsf\u00f6r
  och s\u00e4ljer alkoholdrycker i samarbete med artister. En musikgenre med extra
  h\u00e4ngivna och engagerade fans \u00f6ver hela v\u00e4rlden \u00e4r rock och exempel
  p\u00e5 samarbeten inkluderar band som t.ex. Ghost, Hammerfall, In Flames, Mot\u00f6rhead,
  Mustasch, Rammstein, Slayer och Status Quo. Exempel p\u00e5 andra samarbeten \u00e4r
  Plura och Sweden Rock Festival, en av de st\u00f6rsta och mest framg\u00e5ngsrika
  festivalerna p\u00e5 den nordiska marknaden. Tillsammans med artisterna utvecklar
  Brands For Fans koncept och produkter som f\u00f6ljer varum\u00e4rke och identitet,
  samt tillf\u00f6r n\u00e5got i relationen med fansen. Ibland \u00e4r det produkter
  i begr\u00e4nsad upplaga och av mycket exklusiv karakt\u00e4r, men oftast produkter
  d\u00e4r ambitionen \u00e4r att skapa l\u00e5ngsiktiga framg\u00e5ngar. K\u00e4nnetecknande
  f\u00f6r samtliga samarbeten \u00e4r att produktkvaliteten \u00e4r helt central,
  utan den finns inte trov\u00e4rdigheten och existensber\u00e4ttigandet.\\n\\nJag
  \u00e4r mycket n\u00f6jd \u00f6ver att f\u00e5tt in Brands For Fans i Umida Group
  d\u00e5 bolaget kompletterar Umidas verksamhet p\u00e5 ett perfekt s\u00e4tt. Umida
  kan erbjuda Brands For Fans support med produktutveckling, ink\u00f6p och produktion
  f\u00f6r att underl\u00e4tta utveckling och produktion av nya produkter. Det finns
  \u00e4ven synergieffekter p\u00e5 s\u00e4lj- och marknadssidan samt i internationella
  kund- och partnerrelationer. Efter det f\u00f6rsta kvartalet i den nya konstellationen
  \u00e4r det nya Umida Group inklusive Brands For Fans ig\u00e5ng och utarbetar planer
  och aktiviteter f\u00f6r att expandera ytterligare. Vi ser att det finns goda tillv\u00e4xtm\u00f6jligheter
  f\u00f6r Brands For Fans p\u00e5 s\u00e5v\u00e4l p\u00e5 hemmamarknad som p\u00e5
  export, och att potentialen i aff\u00e4rsid\u00e9n \u00e4r stor.\\n\\nBrands For
  Fans har en bred portf\u00f6lj av produkter och jag vill h\u00e4r ber\u00e4tta mer
  om n\u00e5gra av de senaste lanseringarna. Brands For Fans har sedan flera \u00e5r
  ett samarbete med Sweden Rock Festival som \u00e4r Skandinaviens st\u00f6rsta h\u00e5rdrocksfestival.
  Varje \u00e5r lockas bes\u00f6kare fr\u00e5n fler \u00e4n 50 l\u00e4nder till S\u00f6lvesborg,
  d\u00e4r de bjuds p\u00e5 \u00f6ver 80 konserter med n\u00e5gra av de ledande h\u00e5rdrocksbanden
  fr\u00e5n hela v\u00e4rlden. I december lanserades The Holy Spirit of Sweden Rock
  Solera 15 XO Premium Rhum p\u00e5 marknaden och fick ett mycket positivt mottagande.
  Tack vare den omedelbart h\u00f6ga efterfr\u00e5gan kommer den fr\u00e5n 1 juni
  att bli del av det ordinarie sortimentet p\u00e5 Systembolaget. F\u00f6r fj\u00e4rde
  \u00e5ret i rad presenterar Sweden Rock Festival, i samarbete med Mackmyra Svensk
  Whiskey AB och Brands For Fans, dessutom en \u00e5rsspecifik limiterad utg\u00e5va
  skr\u00e4ddarsydd f\u00f6r b\u00e5de h\u00e5rdrocks\u00e4lskare och whiskykonn\u00e4ss\u00f6rer
  - Sweden Rock 18 Single Malt R\u00f6k. De tidigare lanseringarna i denna konstellation
  har blivit mycket uppskattade s\u00e5 f\u00f6rhoppningarna \u00e4r h\u00f6ga \u00e4ven
  p\u00e5 \u00e5rets lansering.\\n\\nEtt annat viktigt samarbete \u00e4r det med Mot\u00f6rhead,
  ett ikoniskt band och oerh\u00f6rt starkt varum\u00e4rke. Tillsammans med Mot\u00f6rhead
  har Brands For Fans utvecklat en bred portf\u00f6lj av produkter med bl.a. whisky,
  vodka och \u00f6l i sortimentet. Mot\u00f6rhead \u00e4r ett varum\u00e4rke med en
  mycket stor bas av fans \u00f6ver hela v\u00e4rlden och vi ser stor potential att
  v\u00e4xa i nya kanaler och p\u00e5 nya marknader. Nyligen har vi gjort en inbrytning
  p\u00e5 den kanadensiska marknaden och f\u00e5tt Mot\u00f6rhead Bastards lager,
  Mot\u00f6rhead Vodka och Mot\u00f6rhead whisky listade p\u00e5 de\\n\\nkanadensiska
  monopolen SAQ (Quebec) och NSLC (Nova Cotia). Ut\u00f6ver det ser vi stora m\u00f6jligheter
  att v\u00e4xa i bl.a. Finland och Tyskland d\u00e4r vi har ett flertal planerade
  aktiviteter.\\n\\nJag skulle ocks\u00e5 vilja lyfta fram Hammerfall och deras Champagne,
  ett innovativt och nyskapande produktkoncept. Hammerfall \u00e4r det f\u00f6rsta
  h\u00e5rdrocksbandet som gjort sin egen Champagne. Den \u00e4r framtagen och producerad
  i samarbete med det svensk-franska champagnehuset Hatt et S\u00f6ner. Champagnen
  \u00e4r en premier cru \u00e5rg\u00e5ng 2008, vilket enligt experterna \u00e4r en
  fantastisk \u00e5rg\u00e5ng, och av absolut h\u00f6gsta kvalitet. Till priset 529
  kr \u00e4r detta liksom m\u00e5nga andra av produkterna i Brands For Fans portf\u00f6lj
  en nischprodukt, men det var under den senaste f\u00f6rs\u00e4ljningsperioden den
  n\u00e4st mest s\u00e5lda Champagnen i sitt pris- och butikssegment!\\n\\nJust nu
  arbetar teamet med att bygga vidare p\u00e5 en viktig lansering fr\u00e5n i h\u00f6stas,
  d\u00e5 Brand For Fans etablerade ett samarbete med artisten och matprofilen Plura
  Jonsson. F\u00f6re jul lanserades s\u00e5v\u00e4l en gl\u00f6gg som en akvavit,
  d\u00e4r b\u00e5da produkterna produceras i v\u00e5r anl\u00e4ggning i G\u00f6tene.
  Nu inf\u00f6r p\u00e5sk genomf\u00f6rs en aktivering f\u00f6r Plura Torpets Akvavit
  i Pluras egna kanaler, till exempel Instagram och Facebook. Dessutom har vi g\u00e5tt
  ut med ett pressmeddelande till journalister, vinskribenter och bloggare, med ambitionen
  att Pluras akvavit skall vara det sj\u00e4lvklara valet inf\u00f6r p\u00e5sk samt
  kommande midsommar.\\n\\nJag vill avslutningsvis passa p\u00e5 att ber\u00e4tta
  om n\u00e5gra nya aff\u00e4rer inom Umida Group. Vi har som tidigare kommunicerats
  slutit ett avtal med Menigo om f\u00f6rs\u00e4ljning av v\u00e5rt varum\u00e4rke
  Monte Flor vin i 10 liters bag-in-box, till ett v\u00e4rde p\u00e5 2,4 MSEK f\u00f6r
  perioden 1 april 2018 till 31 mars 2019. Detta g\u00f6r att vi st\u00e4rker v\u00e5r
  st\u00e4llning hos en av v\u00e5ra viktigare kunder och att vi st\u00e4rker positionen
  f\u00f6r Monte Flor som vinvarum\u00e4rke. F\u00f6r v\u00e5r nya produkt Casana
  Tonic ready-to-drink med 4,5% alkoholhalt har vi f\u00e5tt en listning p\u00e5 S-group
  i Finland. Sedan avregleringen vid \u00e5rsskiftet av produkter med l\u00e4gre alkoholhalt
  har en mycket h\u00f6g andel av f\u00f6rs\u00e4ljningen skiftat fr\u00e5n Alko till
  dagligvaruhandeln, n\u00e5got som g\u00f6r den h\u00e4r f\u00f6rsta aff\u00e4ren
  sp\u00e4nnande. Vi kommer g\u00f6ra en test-lansering och se hur vi kan utveckla
  Casana p\u00e5 den finska marknaden. Dessutom levererar i veckan v\u00e5r f\u00f6rsta
  leverans av f\u00e4rdigfyllda vinglas till en ny kund p\u00e5 den tyska marknaden.\\n\\nI
  f\u00f6rra veckan hade jag f\u00f6rm\u00e5nen att tr\u00e4ffa ett antal befintliga
  och nya potentiella aktie\u00e4gare under en investerartr\u00e4ff i G\u00f6teborg
  som arrangerades av Case Fonder. Jag presenterade Umida Group och bolagets strategier,
  planer och produktportf\u00f6lj. Det var mycket inspirerande att f\u00e5 ber\u00e4tta
  om Umida, besvara intressanta fr\u00e5gor och prata om f\u00f6retagets verksamhet
  och v\u00e4g fram\u00e5t.\\n\\nJag vill avsluta med att \u00f6nska en glad p\u00e5sk
  och tacka f\u00f6r visat f\u00f6rtroende f\u00f6r mig, \u00f6vriga ledningen och
  styrelse, samt tacka f\u00f6r uppm\u00e4rksamheten och intresset f\u00f6r detta
  VD-brev.\\n\\nStockholm, 28 mars 2018\\n\\nKatarina Nielsen Verkst\u00e4llande direkt\u00f6r\"",
