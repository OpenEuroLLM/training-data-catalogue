  blandstad. YimbyGBG har f\u00f6r n\u00e4rvarande \u00f6ver 900 medlemmar.  F\u00f6r
  mer information bes\u00f6k YimbyGBG:s hemsida: http://www.yimby.se/gbg\\n\\nYttrande\\n\\nYimbyGBG
  st\u00e4ller sig mycket positiva till planerna att \u00e5ter bebygga platsen f\u00f6r
  TV- och Radiohuset, den s\u00e5 kallade Synvillan. Med n\u00e4rhet till stadens
  centrum, god kollektivtrafik och det popul\u00e4ra gr\u00f6nomr\u00e5det har detta
  omr\u00e5de goda m\u00f6jligheter att bli en popul\u00e4r plats att bo p\u00e5.
  Vi st\u00e4ller oss dock tveksamma till vissa aspekter av planeringen, hur l\u00f6sningarna
  presenteras och kanske framf\u00f6rallt hur planen inte f\u00f6rh\u00e5ller sig
  till den r\u00e5dande \u00f6versiktsplanen.\\n\\n\u00d6versiktsplanens riktlinjer\\n\\nDet
  ber\u00f6rda omr\u00e5det kategoriseras i den nya \u00f6versiktsplanen som \\\"Mellanstad\\\".
  Nedan \u00e4r \u00d6P:s egen sammanfattning om framtida planering i dessa delar
  av G\u00f6teborg:\\n\\n1) En t\u00e4t bebyggelse kring knutpunkter, bytespunkter
  och n\u00e4rmast kollektivtrafikens str\u00e5k ska efterstr\u00e4vas.\\n2) Mellanstaden
  ska kompletteras med bost\u00e4der, arbetsplatser, service, rekreation och kultur.\\n3)
  Ej st\u00f6rande arbetsplatser och bost\u00e4der ska blandas d\u00e4r det \u00e4r
  l\u00e4mpligt.\\n4) Fungerande sm\u00e5skaliga verksamhetsomr\u00e5den liksom goda
  boendemilj\u00f6er ska v\u00e4rnas.\\n5) V\u00e4rdefulla gr\u00f6nomr\u00e5den,
  n\u00e4rlek och gr\u00f6na str\u00e5k ska bibeh\u00e5llas och utvecklas och borttagna
  naturv\u00e4rden i t\u00e4t bebyggelse ska ers\u00e4ttas s\u00e5 att f\u00f6rlusten
  kompenseras.\\n6) Kommunala verksamheter b\u00f6r i f\u00f6rsta hand lokaliseras
  till de lokala torgen.\\n7) Nya m\u00f6tesplatser ska utvecklas.\\n8) F\u00f6r att
  \u00f6verbrygga barri\u00e4rer och \u00f6ka tryggheten b\u00f6r befintliga bebyggelseomr\u00e5den
  l\u00e4nkas samman genom ny bebyggelse eller nya str\u00e5k.\\n\\n9) M\u00f6jligheterna
  att g\u00e5 och cykla inom mellanstaden och till centrala G\u00f6teborg b\u00f6r
  f\u00f6rb\u00e4ttras.\\n10) Kulturhistoriska v\u00e4rden som tidstypiska hus eller
  stadsplaner ska v\u00e4rnas.\\n\\nHandlingarna och den faktiska planen f\u00f6rh\u00e5ller
  sig n\u00e4stan inte till n\u00e5gra av de ovan refererade punkterna. P\u00e5 n\u00e5gra
  punkter tycks detaljplanen till och med g\u00e5 stick i st\u00e4v med \u00f6versiktsplanen
  utan att detta f\u00f6rklaras eller problematiseras.\\n\\nIst\u00e4llet f\u00f6rh\u00e5ller
  sig planer och gestaltningsprogram till befintlig bebyggelse och gamla regler och
  normer. Genom att endast f\u00f6rh\u00e5lla sig till och i s\u00e5 h\u00f6g grad
  anpassa sig till det befintliga utan att relatera detta till det nya inneb\u00e4r
  det i praktiken till att \u00e4ldre planer och ideal realiseras. Planen f\u00f6resl\u00e5r
  i praktiken en bostadsenklav av funktionalistisk typ som inte g\u00e5r i linje med
  den r\u00e5dande ambitionen att skapa blandstad i G\u00f6teborg.\\n\\n\u00d6verhuvudtaget
  finner vi flera brister i hur det subjektiva blandas med det objektiva p\u00e5 ett
  s\u00e5dant s\u00e4tt att planen ges illusion av objektivitet. Att stadsplanering
  inbegriper v\u00e4rderingar \u00e4r i sig inget problem men n\u00e4r dessa  inte  tydligg\u00f6rs  och  problematiseras  samt  i  realiteten  leder  till  planering  som  g\u00e5r  emot
  \u00f6versiktsplanens  uttalade  v\u00e4rderingar  \u00e4r  detta  beklagligt.  Man  fr\u00e5gar  sig  vad  funktionen  med  en
  \u00f6versiktsplan \u00e4r n\u00e4r denna inte har n\u00e5gra synbara \u00e5terverkningar
  p\u00e5 detaljplanerna.\\n\\nEn central aspekt av detta i detaljplanen f\u00f6r
  Stora Torp \u00e4r relationen till Delsj\u00f6v\u00e4gen, d\u00e4r p\u00e5st\u00e5endet
  att den \\\"upplevs som gr\u00f6n och vidstr\u00e4ckt\\\" anv\u00e4nds f\u00f6r
  att legitimera fasth\u00e5llande vid f\u00f6rlegade SCAFT-principer i n\u00e4romr\u00e5dets
  trafikplanering utan att p\u00e5 n\u00e5got s\u00e4tt f\u00f6rs\u00f6ka komma tillr\u00e4tta
  med de problem f\u00f6r stadsmilj\u00f6n som denna slags funktions- och trafikseparerande
  planering inneb\u00e4r.\\n\\nDessutom, med tanke p\u00e5 den direkta n\u00e4rheten
  till popul\u00e4ra Delsj\u00f6n, \u00e4r det t\u00e4mligen tveksamt om ytterligare
  gr\u00f6nytor \u00e4r vad omr\u00e5det beh\u00f6ver. Speciellt d\u00e5 gr\u00e4smattor
  kring Delsj\u00f6v\u00e4gen inte kan f\u00f6rv\u00e4ntas anv\u00e4ndas f\u00f6r
  rekreation utan endast ger fri sikt till bilister med h\u00f6gre hastigheter, buller,
  f\u00f6rs\u00e4mrad markexploatering och tomma ytor som f\u00f6ljd.\\n\\nYimbyGBG:s
  f\u00f6rslag till \u00e4ndringar\\n\\nVi f\u00f6resl\u00e5r ist\u00e4llet att planen
  \u00e4ndras s\u00e5 att Delsj\u00f6v\u00e4gen blir en resurs ist\u00e4llet f\u00f6r
  ett problem. Trafikm\u00e4ngden p\u00e5 v\u00e4gen leder till buller i omr\u00e5det
  men med tanke p\u00e5 att denna minskat under flera \u00e5r och med tanke p\u00e5
  avst\u00e5ndet till  Brunnsparken finns  det m\u00f6jligheter  att  g\u00f6ra  undantag
  fr\u00e5n  bullernormerna  genom att s\u00e4kerst\u00e4lla en tyst sida, vilket
  ocks\u00e5 p\u00e5pekas i handlingarna.\\n\\nI liggande f\u00f6rslag byggs lamellhusen
  l\u00e4ngst in mot skogen och radhusen mot Delsj\u00f6v\u00e4gen. Mellan radhusen
  och Delsj\u00f6v\u00e4gen anl\u00e4ggs gr\u00e4sbarri\u00e4rer och en mur. Ett enkelt
  s\u00e4tt att f\u00f6rb\u00e4tta planen vore att byta plats p\u00e5 lamellhusen
  och radhusen. Lamellhusen kan sedan byggas samman utmed Delsj\u00f6v\u00e4gen.\\n\\nDet  skulle  fylla  en  bullerd\u00e4mpande  funktion  b\u00e4ttre  \u00e4n  muren,  exploateringen  skulle  \u00f6ka  och
  funktionsblandning skulle kunna skapas. Det slutna kvarteret b\u00f6r flyttas n\u00e4rmare
  b\u00e5de Delsj\u00f6v\u00e4gen och lokalgatan.\\n\\nOm man placerar ut byggnader
  i direkt anslutning till Delsj\u00f6v\u00e4gen skapas ett smalare gaturum, vilket
  s\u00e4nker tempot och d\u00e4rmed bullerniv\u00e5n. Byggnaderna tj\u00e4nstg\u00f6r
  d\u00e5 som bullerskydd f\u00f6r omr\u00e5det innanf\u00f6r och \u00e4r samtidigt  ett  mycket  mer  effektivt  s\u00e4tt  \u00e4n  att  med  hj\u00e4lp  av  gr\u00e4svallar,  placerade  l\u00e5ngt  fr\u00e5n  den
  bulleralstrande k\u00e4llan, endast \u00f6ka avst\u00e5ndet mellan bostadsenklaven
  och kollektivtrafikh\u00e5llplatsen.\\n\\nBebyggelsen n\u00e4rmast v\u00e4gen b\u00f6r
  i f\u00f6rsta hand inneh\u00e5lla andra funktioner \u00e4n bost\u00e4der i gatuplanet.
  Detta av flera sk\u00e4l: F\u00f6r det f\u00f6rsta inneb\u00e4r n\u00e4rheten till
  v\u00e4gen att \u00e5tminstone de nedre v\u00e5ningarna troligen \u00e4r mer l\u00e4mpade
  f\u00f6r andra funktioner \u00e4n bost\u00e4der.\\n\\nF\u00f6r det andra \u00e4r
  trafiken p\u00e5 Delsj\u00f6v\u00e4gen inte n\u00e5got problem f\u00f6r andra verksamheter
  utan en tillg\u00e5ng. Att synas fr\u00e5n bil-, cykel- och sp\u00e5rv\u00e4g inneb\u00e4r
  att andra \u00e4n de som bor i lokalernas direkta n\u00e4rheten kan se och f\u00e5
  tillg\u00e5ng till dessa verksamheter. Detta skapar definitivt b\u00e4ttre f\u00f6ruts\u00e4ttningar
  f\u00f6r olika verksamheter \u00e4n att, vilket planen lite l\u00f6st antyder, placera
  verksamheter inne i bostadsenklaven. Verksamheter som med st\u00f6rsta sannolikhet
  skulle f\u00e5 mycket sv\u00e5rt att n\u00e5 utanf\u00f6r enklaven.\\n\\nF\u00f6r
  det tredje kommer en s\u00e5dan l\u00f6sning n\u00e4rmare blandstadsidealet. Oavsett
  om byggnaderna n\u00e4rmast v\u00e4gen inneh\u00e5ller b\u00e5de bost\u00e4der och
  verksamheter eller endast verksamheter leder en s\u00e5dan planering till en en
  rumsligt integrering av flera funktioner.\\n\\nF\u00f6r det fj\u00e4rde inneb\u00e4r
  en s\u00e5dan l\u00f6sning b\u00e4ttre f\u00f6ruts\u00e4ttningar f\u00f6r en effektiv
  kollektivtrafik genom att boende och anst\u00e4llda anv\u00e4nder samma h\u00e5llplats
  men i olika riktningar.\\n\\nF\u00f6r det femte ger detta ett stadsrum n\u00e4ra
  h\u00e5llplatsen som kan hj\u00e4lpa till att ge \u00f6kad trygghet. Att som i handlingarna
  skriva att det planerade omr\u00e5det f\u00e5r \\\"befolkning dygnet runt\\\" genom
  att m\u00e4nniskor bor d\u00e4r och detta leder till trygghet \u00e4r att allt f\u00f6r
  l\u00e4ttvindigt negligera den rumsliga planeringens betydelse f\u00f6r m\u00e4nniskors  upplevda  trygghet  och  m\u00e5ng\u00e5riga  erfarenheter  fr\u00e5n  liknande  bostadsenklaver  d\u00e4r  ensligt
  placerade h\u00e5llplatser knappast upplevts som en f\u00f6rdel.\\n\\nF\u00f6r det
  sj\u00e4tte \u00f6ppnar en s\u00e5dan princip upp f\u00f6r framtida exploatering
  norrut l\u00e4ngs Delsj\u00f6v\u00e4gen, vilket skulle binda  ihop  omr\u00e5dena  Sk\u00e5r,  B\u00f6,  Munkeb\u00e4ck  och  K\u00e5lltorp  samt  \u00e4ven  skapa  fler  st\u00f6rre  och  mindre,
  l\u00e4ttillg\u00e4ngliga, trygga och icke bullerst\u00f6rda, stadsparker mellan
  husen.\\n\\nF\u00f6r det sjunde \u00f6ppnar en exploatering n\u00e4ra Delsj\u00f6v\u00e4gen
  upp f\u00f6r att detta nya omr\u00e5det integreras naturligt med befintlig bebyggelse
  och B\u00f6 aff\u00e4rscentrum p\u00e5 andra sidan sp\u00e5rv\u00e4gen vilket \u00e4r
  attraktivt b\u00e5de f\u00f6r de boende och gamla och nya aff\u00e4rsidkare d\u00e4r.\\n\\nId\u00e9skiss
  till alternativ gruppering av bebyggelsen f\u00f6r att \u00f6ka blandstadskvaliteter\\n\\nVi
  \u00e4r medvetna om att r\u00e5dande efterfr\u00e5gan p\u00e5 marknaden och dess
  struktur kan g\u00f6ra det problematiskt att planera in bost\u00e4der och andra
  verksamheter i samma detaljplan. Som en alternativ l\u00f6sning om ett simultant
  genomf\u00f6rande inte \u00e4r m\u00f6jligt \u00e4r att planera f\u00f6r framtiden.
  Genom att i f\u00f6rv\u00e4g planera in tomter n\u00e4rmast v\u00e4gen men tills
  vidare l\u00e4mna dem tomma skulle i en s\u00e5dan situation ha ett antal f\u00f6rdelar.\\n\\nDels
  skulle det inneb\u00e4ra att detaljplanen framst\u00e5r mindre som ett best\u00e4llningsjobb
  och mer som planering utifr\u00e5n samh\u00e4llets behov samt inneb\u00e4ra en mer
  dynamisk planering som relaterar den aktuella detaljplanen med \u00f6versiktsplanens
  vision. Dels skulle en s\u00e5dan tydlig markering om framtida planer f\u00f6r markanv\u00e4ndning
  underl\u00e4tta  framtida  exploatering  och  dra  ner  p\u00e5  antalet  \u00f6verklaganden  och  f\u00f6rseningar  i
  planeringsprocessen.\\n\\nStora Torp marknadsf\u00f6rs som ett \\\"milj\u00f6medvetet\\\"
  och \\\"klimatsn\u00e4llt\\\" boende med g\u00e5ng- och cykelavst\u00e5nd till centrum.
  Det \u00e4r d\u00e4rf\u00f6r m\u00e4rkligt att man v\u00e4ljer att bygga ett stort
  parkeringsgarage under hela omr\u00e5det. I\\n\\nprogramhandlingen fr\u00e5n 2007
  s\u00e4gs att: \\\"Det \u00e4r i dagens G\u00f6teborg, med \u00f6kande biltrafik
  och \u00f6kande utsl\u00e4pp av avgaser till f\u00f6ljd, viktigt att inte planera
  in f\u00f6r m\u00e5nga parkeringsplatser.\\\"\\n\\nI de aktuella planhandlingarna
  kan man dock se att parkeringsnormen har \u00f6kats fr\u00e5n 0,52 \u00e5r 2007
  till 0,77 idag. 77% av hush\u00e5llen f\u00f6rv\u00e4ntas allts\u00e5 \u00e4ga bil,
  trots att endast 36% befintliga hush\u00e5ll i \u00d6rgryte \u00e4ger bil. Det\\n\\n\u00e4r  anm\u00e4rkningsv\u00e4rt  att  man  valt  denna  \u00f6verkapacitet.  Varje  p-plats  i  k\u00e4llargarage  \u00f6kar  dessutom
  byggkostnaderna med flera hundratusentals kronor. Det \u00e4r kostnader som hamnar
  hos slutkunden vilket i\\n\\nsin tur sannolikt leder till minskad social blandning
  i omr\u00e5det.\\n\\nKontaktperson f\u00f6r detta yttrande:\\n\\nJohannes \u00c5sberg
  Nordhemsgatan 70 413 09 G\u00f6teborg\"", "\"Fondguide\\n\\nR\u00e4tt fonder. R\u00e4tt
  enkelt.\\n\\nKonsten att v\u00e4lja r\u00e4tt fonder \u00e4r ingen konst.\\n\\nH\u00f6g
  eller l\u00e5g risk? Indien eller Sverige? Flera eller bara en? Vi f\u00f6rst\u00e5r
  om det ibland k\u00e4nns lite sv\u00e5rt att v\u00e4lja fonder. Men ta det bara
  lugnt. I den h\u00e4r guiden f\u00e5r du hj\u00e4lp att g\u00f6ra r\u00e4tt fondval.
  Oavsett vilka m\u00e5l du har med ditt sparande. Prata g\u00e4rna med oss om du
  undrar \u00f6ver n\u00e5got.\\n\\nR\u00e4tt fonder. R\u00e4tt enkelt.\\n\\n1. Vad
  ska du spara till?\\n\\n2. Hur stor risk vill du ta?\\n\\n3. Vilka fonder passar
