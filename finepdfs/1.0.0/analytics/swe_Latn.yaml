  \u00d6versyn av barn- och utbildningsn\u00e4mndens ansvarsomr\u00e5de\\n\\n\u00c4rendebeskrivning\\n\\nKommunstyrelsen
  har gett Komrev inom \u00d6hrlings PricewaterhouseCoopers i uppdrag att analysera
  organisation och verksamhet inom omr\u00e5dena f\u00f6rskola, familjedaghem och
  grundskola. F\u00f6rskoleklassen och fritidshemmen ing\u00e5r ej i \u00f6versynen.\\n\\nSyftet
  med analysen \u00e4r att belysa kostnader, resursutnyttjande och effektivitet samt
  att bed\u00f6ma resultat och kvalitet i relation till kostnadsniv\u00e5n.\\n\\nI
  uppdraget ing\u00e5r:\\n\\n* Analys av behovs och volymutvecklingen inom ber\u00f6rda
