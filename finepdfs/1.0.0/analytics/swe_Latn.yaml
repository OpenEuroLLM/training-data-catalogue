  Kommunens f\u00f6rskole- och skolplan f\u00f6r \u00e5ren 2004 \u2013 2006 (enligt
  beslut i Kommunfullm\u00e4ktige fortfarande g\u00e4ller), barn- och utbildningsn\u00e4mndens
  kvalitetsredovisning f\u00f6r \u00e5r 2006 samt lokala kollektivavtal enligt \u00d6LA
  00 har beaktats.\\n\\nH\u00e5kan Algotsson, c f\u00f6resl\u00e5r att Britt-Mari
  Idensj\u00f6 redovisar uppdraget f\u00f6r ledam\u00f6terna i kommunstyrelsen.\\n\\nBritt-Mari
  Idensj\u00f6, \u00d6hrlings PricewaterhouseCoopers, l\u00e4mnar en redovisning p\u00e5
  den \u00f6versyn som utf\u00f6rts inom barn- och utbildningsn\u00e4mndens ansvarsomr\u00e5de.\\n\\nArbetsutskottet
