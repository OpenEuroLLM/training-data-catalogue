  16 |  |\\n| Vi har ingen planering/ Vet inte | 9% |  | 20 |  |\\n| Total | 100%
  |  | 226 |  |\\n\\n172 svarande kommuner har uppgett att de inf\u00f6rt eller p\u00e5b\u00f6rjat
  inf\u00f6rande. Av de kommuner som inte p\u00e5b\u00f6rjat inf\u00f6rande anger
  65% att man har beslut p\u00e5 politisk eller ledningsniv\u00e5 om inf\u00f6rande
  av IBIC. F\u00f6r f\u00f6rteckning \u00f6ver svarande kommuner, se bilaga 1.\\n\\nL\u00e4get
  f\u00f6r inf\u00f6rande utifr\u00e5n kommunstorlek\\n\\nI kommentarerna till fr\u00e5gan
  \u00e5terkommer, som f\u00f6rklaring till att det inte finns planering f\u00f6r
  inf\u00f6rande, att systemet inte st\u00f6der IBIC, man avvaktar upphandling av
  nytt system, resursbrister eller att det saknas beslut om inf\u00f6rande.\\n\\nHur
  l\u00e5ngt har kommunerna kommit i inf\u00f6randet av IBIC n\u00e4r det g\u00e4ller
  \u00e4ldreomr\u00e5det?\\n\\nDelfr\u00e5gorna handlar om handl\u00e4ggare, kommunala
  och privata utf\u00f6rare utreder, planerar, dokumenterar och f\u00f6ljer upp utifr\u00e5n
  IBIC.\\n\\nI kommentarerna \u00e5terkommer att man kommit olika l\u00e5ngt i olika
  enheter/verksamheter, att man planerar f\u00f6r hur uppf\u00f6ljning ska ske, att
  viss dokumentation sker enligt IBIC medan andra delar \u00e4nnu inte. Vanligt \u00e4r
  att genomf\u00f6randeplanering sker med st\u00f6d av IBIC, men att man inte kommit
  ig\u00e5ng fullt ut med l\u00f6pande dokumentation i genomf\u00f6randet samt uppf\u00f6ljning,
  b\u00e5de bland handl\u00e4ggare och utf\u00f6rare.\\n\\nFlera uppger \u00e4ven
  att man anv\u00e4nder IBIC som tankes\u00e4tt och st\u00f6d f\u00f6r dokumentation,
  men p\u00e5 ett mer \u00f6vergripande s\u00e4tt \u00e4n det som beskrivs i Socialstyrelsens
  v\u00e4gledning. Av kommentarerna framg\u00e5r att det varierar hur v\u00e4l kommunen
  har koll p\u00e5 hur privata utf\u00f6rare anv\u00e4nder och dokumenterar enligt
  IBIC.\\n\\nHandl\u00e4ggare dokumenterar och f\u00f6ljer upp\\n\\nTabell 3. Kommuner
