  "\"INNEH\u00c5LL:\\n\\nFunktionsbeskrivning .................. 2\\nIng\u00e5ende
  komponenter ............... 2\\nS\u00e4kerhetsf\u00f6reskrifter ..................
  2\\nFunktionsprovning ..................... 3\\nKontroll av enhet ......................
  4\\nInstallation .............................. 5\\nHandhavande ............................
  6\\nFels\u00f6kning ............................... 7\\nTekniska data ...........................
  8\\nTillverkardeklaration .................. 8\\n\\nSpara denna anvisning f\u00f6r
  framtida bruk!\\n\\nAfriso Ema AB\\nKilv\u00e4gen 2 \u2022 232 37 Arl\u00f6v\\nT
  040-92 20 50\\nF 040-19 33 58\\nwww.afriso.se\\n\\nFunktionsbeskrivning\\n\\nVA-Alert
  W f\u00f6r avloppscisterner \u00e4r ett tr\u00e5dl\u00f6st larm f\u00f6r (slutna)
  avloppscisterner. Systemet best\u00e5r av en mottagarenhet f\u00f6r placering inomhus
  samt en batteridriven s\u00e4ndarmodul (VA-Alert W/T) med givare f\u00f6r placering
  under lock till cistern. Denna enhet har en ber\u00e4knad drifttid om ca 12 m\u00e5nader.
  Centralenheten har inbyggt rel\u00e4 vilket m\u00f6jligg\u00f6r anslutning till
  t.ex. larmlampa eller SMS-larm.\\n\\nVA-Alert W \u00e4r avsedd f\u00f6r cisterner/tankar
  inneh\u00e5llande elektriskt ledande v\u00e4tskor. Fulltankalarm ges n\u00e4r tankinneh\u00e5llet
  har n\u00e5tt till de b\u00e5da elektroderna vid VA-givarens nedre del. S\u00e4ndarenheten
  \u00e4r batteridriven och drivs av 2 st AA-batterier. Enheten har inbyggd varning
  f\u00f6r l\u00e5g batterisp\u00e4nning vilken varnar i god tid innan batteriet \u00e4r
  f\u00f6rbrukat (ca 2-3 m\u00e5nader innan).\\n\\nIng\u00e5ende komponenter\\n\\nVA-ALERT
  W\\n\\nVA-givare med s\u00e4ndarmodul\\n\\nS\u00e4kerhetsf\u00f6reskrifter/viktigt
  att beakta\\n\\n\u2022 L\u00e4s noga igenom installationsmanualen f\u00f6re montering\\n\u2022
  Alarmapparat f\u00e5r endast monteras inomhus i torra utrymmen.\\n\u2022 Utrustningen
  f\u00e5r endast anv\u00e4ndas f\u00f6r indikering av h\u00f6gniv\u00e5larm i avloppstankar
  eller vattentankar.\\n\u2022 F\u00e5r ej anv\u00e4ndas i samband med olja eller
  bensin!\\n\u2022 Om tanken ska gr\u00e4vas ner, se till att givaren kan kommas \u00e5t
  p\u00e5 enkelt s\u00e4tt genom montering av en manlucka etc.\\n\u2022 Givaren har
  som standard 2 m kabel. Beh\u00f6vs l\u00e4ngre ska givarkabeln f\u00f6rl\u00e4ngas
  med kabel: RKK 2 x 0,75 mm\u00b2. Anv\u00e4nd inte flerledarkabel (f\u00f6r pumpstyrsignaler
  e.d.).\\n\\nAlarmapparat f\u00e5r ej sl\u00e4ngas i hush\u00e5llsopor, utan ska
  hanteras som elektronikskrot.\\n\\nFunktionsprovning:\\n\\nKontroll av enhet\\n\\n-
  Larmet best\u00e5r av en s\u00e4ndarenhet VA-Alert W/T med en konduktiv givare f\u00f6r
  placering i avloppstank/cistern. Denna enhet drivs av 2 st AA-batterier.\\n\\n-
  Mottagarenhet VA-Alert W/R f\u00f6r placering p\u00e5 v\u00e4gg inomhus i torrt
  utrymme. Enheten drivs med en medf\u00f6ljande batterieliminator (12VDC).\\n\\nAnslut
  n\u00e4tdaptern till mottagningsenheten. Enheten skall blinka till gr\u00f6nt och
  r\u00f6tt samt ett pip avges. D\u00e4refter blinkar enheten till snabbt ca var 3:e
  sekund.\\n\\nF\u00f6r att para enheterna\\n\\nH\u00e5ll knapp intryckt tills r\u00f6d
  blinkar kort och gr\u00f6n blinkar samtidigt varannan g\u00e5ng. Nu \u00e4r det
  m\u00f6jligt att para ihop s\u00e4ndare och mottagare. H\u00e5ll tryckknappen p\u00e5
  mottagarenheten intryckt tills gr\u00f6n lysdiod lyser med fast sken, forts\u00e4tt
  att h\u00e5lla intryckt tills gr\u00f6n sl\u00e4cks och summern ljuder ca 1 sekund.
  Sl\u00e4pp knapparna, parningen \u00e4r nu klar.\\n\\nParning av s\u00e4ndare och
  mottagare:\\n\\nF\u00f6r anv\u00e4ndning m\u00e5ste s\u00e4ndardel och mottagare
  paras med varandra.\\n\\n\u00d6ppna s\u00e4ndardelen genom att dra i det ena locket.
  Locket \u00e4r t\u00e4tat med o-ring (se bild ovan). Ta ut kretskortet och s\u00e4tt
  i 2 st AA-batterier i batterih\u00e5llaren.\\n\\nKontroll av enhet\\n\\nKontroll
  av larmfunktion\\n\\nKortslut givaring\u00e5ngen med ett gem eller motsvarande alternativt
  anslut givaren och doppa elektroden i vatten. Inom ca 30 sekunder ljuder summen
  i mottagaren och den r\u00f6da ljusdioden skall blinka till.\\n\\nTryck p\u00e5
  knappen p\u00e5 mottagaren -> ljudet skall tystna. Ta bort kortslutningen alternativt
  ta upp givaren ur vatten. Den r\u00f6da ljusdioden skall sl\u00f6ckna inom 30 sekunder.
  Test av larmfunktion \u00e4r OK.\\n\\nH\u00e5ll knappen intryckt och s\u00e4tt i
  batteri. N\u00e4r b\u00e5da lysdioderna lyser ca 1 sekund samtidigt, sl\u00e4pp
  nu knappen. B\u00e5da lysdioder visar s\u00e4ndning, ca 10 sekunder emellan. Efter
  ca 10 minuter sker en \u00e5terg\u00e5ng till normal drift.\\n\\nVid behov flytta
  p\u00e5 mottagarenheten till en plats var s\u00e4ndarens signal kan tas emot s\u00e4kert.\\n\\nR\u00e4ckviddstest\\n\\nF\u00f6re
  montering m\u00e5ste det testas om placeringen av mottagaren kan ta emot radiosignalen
  fr\u00e5n s\u00e4ndaren. Placera mottagaren p\u00e5 \u00f6nskad plats och anslut
  n\u00e4tdaptern. Placera s\u00e4ndarmodulen p\u00e5 plats i brunnen under \\\"locket\\\".
  Tag ur batteri ur batterih\u00e5llaren.\\n\\nInstallation\\n\\nMontering b\u00f6r
  g\u00f6ras av beh\u00f6rig och kompetent installat\u00f6r.\\n\\n**Montering av givare:**\\nF\u00f6r
  givaren genom cisternens anslutning och skruva givarens anslutningsdel i cisternens
  muff.\\n\\nF\u00f6r in kabeln genom f\u00f6rskruvningen och anslut givarkabeln enligt
  nedan. S\u00e4tt i batterierna och skjut in kretskortet i kapslingen. Tryck in locket
  och drag \u00e5t kabelf\u00f6rskruvningen.\\n\\nPlacera s\u00e4ndarelektroniken
  i h\u00e5llaren och st\u00e4ng h\u00e5llaren. Placera elektroniken med kabeln pekande
  ner\u00e5t och med en placering s\u00e5 h\u00f6gt upp som m\u00f6jligt i brunnen
  f\u00f6r att s\u00e4kerst\u00e4lla s\u00e5 bra r\u00e4ckvidd som m\u00f6jligt. Se
  bild nedan.\\n\\nMontera montagebygel p\u00e5 l\u00e4mplig plats i tankhalsen under
  brunnslocket. Se bild nedan. Anv\u00e4nd medf\u00f6ljande plugg och skruv.\\n\\nPlacering
  av givare i tank g\u00f6rs l\u00e4mpligen i muff p\u00e5 tank. Givaren har en 1\u201d-anslutning.
  H\u00f6jd i tank justeras genom att skjuta givare till \u00f6nskad position och
  fixeras genom att dra \u00e5t justerskruven i 1\u201d-anslutningen. Beroende p\u00e5
  tanktyp/tankhals kan givaren beh\u00f6va monteras p\u00e5 annat s\u00e4tt. F\u00f6r
  instruktioner kontakta tanktillverkare. Se exempel nedan.\\n\\n## Handhavande:\\n\\n|
