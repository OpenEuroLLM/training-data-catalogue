  6. Om unders\u00f6kningen\\n\\nOmfattning\\n\\nObjekt och population\\n\\nDenna
  unders\u00f6kning har v\u00e4nt sig till alla kommuner i Sverige. Populationen omfattar
  290 unders\u00f6kningsobjekt (kommuner).\\n\\nTotalunders\u00f6kning\\n\\nUnders\u00f6kningen
  \u00e4r en totalunders\u00f6kning, urvalsos\u00e4kerhet f\u00f6rekommer d\u00e4rmed
  inte men d\u00e4remot \u00e4r svarsbortfallet en os\u00e4kerhetsfaktor.\\n\\nFr\u00e5gor
  och variabler\\n\\nFr\u00e5gekonstrukt\u00f6ren utformade fr\u00e5gorna i samarbete
  med projektledaren. Andra sakkunniga inom Socialstyrelsen har l\u00e4mnat synpunkter
  p\u00e5 enk\u00e4ten.\\n\\nEnk\u00e4ten best\u00e5r av \u00e5tta fr\u00e5gor. Fr\u00e5gorna
  best\u00e5r av en blandning av fr\u00e5gor med fasta svarsalternativ och \u00f6ppna
  fr\u00e5gor. Unders\u00f6kningens referensperiod \u00e4r nul\u00e4ge. Med referensperiod
  menas vilken tidpunkt svaren avser, t.ex. idag, f\u00f6rra veckan, senaste tre m\u00e5naderna.
  F\u00f6rutom de variabler som samlades in via enk\u00e4ten anv\u00e4ndes uppgift
  om inv\u00e5narantal i kommunerna per 2020-12-31 fr\u00e5n register. Enk\u00e4ten
  har samr\u00e5tts med Sveriges kommuner och regioner, SKR.\\n\\nDatainsamling\\n\\nDatainsamlingen
  har genomf\u00f6rts via en webbenk\u00e4t. Ett informationsbrev skickades till kommunernas
  registratorer. Enk\u00e4ten st\u00e4lldes till \\\"Socialchef eller motsvarande\\\"
  i f\u00f6ljebrevet till registrator. Datainsamlingen p\u00e5gick under tiden 16
  november till 16 december. Under insamlingsperioden skickades tv\u00e5 ordinarie
  p\u00e5minnelser samt en extra p\u00e5minnelse om f\u00f6rl\u00e4ngd insamlingsperiod
  ut.\\n\\nSvarsfrekvens\\n\\nDet var 226 kommuner som besvarade enk\u00e4ten. Det
  ger en svarsfrekvens p\u00e5 78 procent. Svarsfrekvensen f\u00f6r kommungrupperna
  ligger mellan 75 och 82 procent.\\n\\nTabell 1. Svarsfrekvens kommungrupper efter
  inv\u00e5narantal (2020-12-31)\\n\\n| Kommungrupp | Antal | Antal svar | Andel svar,
  |\\n|---|---|---|---|\\n|  | kommuner |  | procent |\\n\\nTabell 2. J\u00e4mf\u00f6relse
  med tidigare \u00e5r\\n\\n|  |  | 2014 |  | 2015 |  | 2016 |  | 2017 |  | 2018 |  |
  2019 |  | 2021 |\\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\\n|
  Antal svarande | 197 |  | 211 |  | 183 |  | 235 |  | 223 |  | 244 |  | 226 |  |\\n|
  Svarsfrekvens | 74% |  | 78% |  | 81% |  | 81% |  | 77% |  | 84% |  | 78% |  |\\n\\nKommentar
  till tabell 2: Enk\u00e4tunders\u00f6kningen genomf\u00f6rs runt \u00e5rsskiftet
  varje \u00e5r. Enk\u00e4t om \u00c4BIC eller IBIC gick under \u00e5ren 2014\u20132015
  till utbildade processledare, 2016 till angivna kontaktpersoner (processledare)
  i kommuner, vilket varit kommuner som visat intresse f\u00f6r \u00c4BIC/IBIC. F\u00f6r
  2017 och 2018 har enk\u00e4ten g\u00e5tt till samtliga kommuner, vilket p\u00e5verkar
  j\u00e4mf\u00f6relser mellan \u00e5ren. Enk\u00e4ten skickades f\u00f6r 2017 till
  registrerade kontaktpersoner i 230 kommuner och till registrator i \u00f6vriga kommuner,
  fr\u00e5n och med 2018 skickades samtliga enk\u00e4ter till registrator.\\n\\nBortfall\\n\\nBortfallet
  best\u00e5r av de kommuner som inte besvarat enk\u00e4ten. Om bortfallet skiljer
  sig fr\u00e5n de svarande, med avseende p\u00e5 unders\u00f6kningsvariablerna, s\u00e5
  kan skattningarna som grundar sig p\u00e5 enbart de svarande vara missvisande. Bortfallet
  \u00e4r relativt j\u00e4mt f\u00f6rdelat mellan kommungrupperna. I denna unders\u00f6kning
  finns inget partiellt bortfall d\u00e5 fr\u00e5gorna var obligatoriska.\\n\\nEn
  bortfallsanalys har genomf\u00f6rts. I den unders\u00f6ktes hur dels bortfallet
  i 2021 \u00e5rs unders\u00f6kning svarade p\u00e5 om de inf\u00f6rt IBIC eller inte
  i 2020 \u00e5rs unders\u00f6kning och dels hur de sammanlagda svarande kommunerna
  fr\u00e5n b\u00e5de 2020 och 2021 \u00e5rs unders\u00f6kning svarade. Slutsatsen
  av bortfallsanalysen \u00e4r att bortfallet inte skiljer sig fr\u00e5n de svarande
  med avseende p\u00e5 om de inf\u00f6rt IBIC eller inte och att resultaten \u00e4r
  generaliserbara till hela populationen.\\n\\nTillf\u00f6rlitlighet\\n\\nRamt\u00e4ckning\\n\\nT\u00e4ckningsfel
  kan best\u00e5 av under- och \u00f6vert\u00e4ckning. Undert\u00e4ckning inneb\u00e4r
  att det finns kommuner som ing\u00e5r i populationen men saknas i urvalsramen. Vid
  \u00f6vert\u00e4ckning finns kommuner som inte ing\u00e5r i populationen i urvalsramen.
  Ramt\u00e4ckningen \u00e4r fullst\u00e4ndig.\\n\\nM\u00e4tfel\\n\\nI samband med
  datainsamlingen kan slumpm\u00e4ssiga och systematiska fel uppst\u00e5, dessa kallas
  m\u00e4tfel. De svar som ges kan vara os\u00e4kra eller felaktiga. Svaren kan \u00e4ven
  bli fel p\u00e5 grund av att de som svarar har missuppfattat fr\u00e5gan. Det finns
  en rad olika k\u00e4llor till dessa fel, bl.a. m\u00e4tinstrumentet, informationssystemet
  och insamlingss\u00e4ttet.\\n\\nF\u00f6r att minska risk f\u00f6r m\u00e4tfel har
  enk\u00e4ten konstruerats med \u00e4mneskunnig, enk\u00e4tfr\u00e5gekonstrukt\u00f6r,
  en statistiker samt i samr\u00e5d med SKR. Enk\u00e4ten \u00e4r till stora delar
  anv\u00e4nd i tidigare unders\u00f6kningar om IBIC.\\n\\nBearbetning\\n\\nVid den
  manuella och maskinella bearbetningen av datamaterialet kan bearbetningsfel uppst\u00e5.
  Exempel p\u00e5 bearbetningsfel \u00e4r registreringsfel och kodningsfel. D\u00e5
  insamlingen skett via en webbenk\u00e4t med fasta alternativ b\u00f6r registreringsfelet
  vara litet. Resultaten har \u00e4ven kontrollerats med avseende p\u00e5 rimlighet.\\n\\nBeskrivning
  av data\\n\\nStatistiska m\u00e5tt och redovisningsgrupper\\n\\nFr\u00e5n unders\u00f6kningen
  redovisas andel och antal f\u00f6r hela riket och f\u00f6r redovisningsgrupper.
  Redovisningsgrupperna, f\u00f6r vissa fr\u00e5gor, i denna unders\u00f6kning \u00e4r
  kommungruppsindelning efter inv\u00e5narantal. Grupperna redovisas i tabell 1 ovan.
  Avrundningsregler kan g\u00f6ra att totalsumman kan bli 99 till 101%.\\n\\nJ\u00e4mf\u00f6rbarhet\\n\\nJ\u00e4mf\u00f6rbarhet
  \u00f6ver tid\\n\\nDetta \u00e4r den \u00e5ttonde g\u00e5ngen Socialstyrelsen genomf\u00f6r
  denna unders\u00f6kning om inf\u00f6randet av IBIC i kommunerna. De f\u00f6rsta
  tre \u00e5ren skickades enk\u00e4ten till utbildade processledare i kommuner, fj\u00e4rde
  \u00e5ret till anm\u00e4lda kontaktpersoner i kommuner vilket g\u00f6r att det inte
  finns j\u00e4mf\u00f6rbarhet mellan dessa \u00e5r och de senaste \u00e5ren. Flertalet
  av fr\u00e5gorna har ocks\u00e5 \u00e4ndrats \u00f6ver tid.\\n\\n\u00c5rets unders\u00f6kning
  genomf\u00f6rdes i huvudsak p\u00e5 liknande s\u00e4tt som \u00e5r 2018, 2019 och
  2020 med avseende p\u00e5 insamlingsmetod och fr\u00e5gor. En skillnad som p\u00e5verkar
  j\u00e4mf\u00f6rbarheten \u00e4r att \u00e5r 2018 skickades enk\u00e4ten till anm\u00e4lda
  kontaktpersoner i cirka 230 kommuner och till registrator i \u00f6vriga kommuner.
  \u00c5r 2019, 2020 och 2021 skickades samtliga enk\u00e4ter till registrator i kommunerna.
  \u00c5rets (2021) unders\u00f6kning genomf\u00f6rdes i november och december. Tidigare
  \u00e5r har unders\u00f6kningen genomf\u00f6rts i januari-februari.\\n\\nI \u00e5rets
  unders\u00f6kning har kategorin barn med funktionsneds\u00e4ttning som beh\u00f6ver
  st\u00f6d i den dagliga livsf\u00f6ringen enligt SoL eller LSS tillkommit. Vidare
  har en fr\u00e5ga om kommunen upphandlat privata utf\u00f6rare enligt LOV och LOU
  tillkommit. Fr\u00e5gan om kommunen ing\u00e5r i regionalt n\u00e4tverk som erbjuder
  erfarenhetsutbyte i arbetet med IBIC har utg\u00e5tt.\\n\\nBilaga 7. Enk\u00e4tformul\u00e4r\\n\\nEnk\u00e4t
  fr\u00e5n Socialstyrelsen om kommunernas arbete med IBIC Syfte och bakgrund\\n\\nSyftet
  med den h\u00e4r enk\u00e4ten \u00e4r att Socialstyrelsen vill f\u00e5 en uppfattning
  om hur l\u00e5ngt arbetet med inf\u00f6randet av Individens behov i centrum, IBIC,
  har kommit i kommunerna. Svaren skapar ett v\u00e4rdefullt underlag i arbetet med
  att utforma och p\u00e5verka det nationella och regionala st\u00f6det.\\n\\nVi beh\u00f6ver
  f\u00e5 in ett gemensamt svar per kommun. Ni beh\u00f6ver d\u00e4rf\u00f6r enas
  kring vem som svarar p\u00e5 enk\u00e4ten i er kommun.\\n\\nObservera att flera
  fr\u00e5gor \u00e4r uppdelade f\u00f6r olika verksamheter, personer \u00f6ver 65
  \u00e5r med st\u00f6d enligt SoL, vuxna personer under 65 \u00e5r med st\u00f6d
  enligt SoL, vuxna personer med st\u00f6d enligt LSS samt barn med funktionsneds\u00e4ttning.
  Vi \u00f6nskar svar p\u00e5 samtliga fr\u00e5gor.\\n\\nErt svar \u00e4r mycket v\u00e4rdefullt
  f\u00f6r oss - stort tack p\u00e5 f\u00f6rhand!\\n\\nVi \u00f6nskar svar senast
  onsdagen den 8 december.\\n\\nVid fr\u00e5gor om unders\u00f6kningen kontakta:\\n\\nemail@example.com\\n\\nVid
