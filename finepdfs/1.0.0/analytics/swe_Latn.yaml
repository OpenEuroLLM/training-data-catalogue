  kan v\u00e4lja olika l\u00f6sningar, allt beroende p\u00e5 dina m\u00e5l.\\n\\nVissa
  l\u00f6sningar passar om du sparar p\u00e5 l\u00e5ng sikt. Vissa om du sparar p\u00e5
  lite kortare sikt. M\u00e5nga m\u00f6jligheter, allts\u00e5.\\n\\nSPARA TILL BARNEN\\n\\nK\u00f6rlort,
  utbildning eller kanske en grundpl\u00e5t till den f\u00f6rsta l\u00e4gerhetten?
  Med ett fondsparande kan du ge dina barn en tryggare framtid. Spara direkt i fonder
  eller via en kapitalf\u00f6rs\u00e4kring d\u00e4r pengarna \u00e4r skattade och
  klara n\u00e4r barnen beh\u00f6ver dem.\\n\\nSPARA TILL PENSIONEN\\n\\nAtt spara
  en slant till pensionen \u00e4r b\u00e5de enkelt och klickt. Sparandet \u00e4r avdragsgiltigt
  upp till en viss niv\u00e5 och du kan byta fonder n\u00e4r du vill utan kapitalvinstskatt.
  V\u00e4lj mellan fondf\u00f6rs\u00e4kring och individuell pensionssparande.\\n\\nSPARA
  TILL EN BUFFERT\\n\\nVisst \u00e4r det sk\u00f6nt att ha en buffert att ta av om
  v\u00e4xell\u00e5dan g\u00e5r s\u00f6nder eller om taket b\u00f6rjar l\u00e4cka
  en regnig morgon? D\u00e4rf\u00f6r \u00e4r det bra att spara i fonder. Du v\u00e4ljer
  ett valfritt belopp och kan ta ut dina pengar n\u00e4r du vill.\\n\\nSPARA TILL
  FRIHET\\n\\nKanske vill du ta med sl\u00e4kten p\u00e5 en l\u00e5ngresa eller en
  dag kunna k\u00f6pa det d\u00e4r charmiga sommarhuset? Med ett fondsparande blir
  det l\u00e4ttare att n\u00e5 m\u00e5len. Spara direkt i fonder eller via en kapitalf\u00f6rs\u00e4kring
  d\u00e4r du inte betalar kapitalvinstskatt.\\n\\nEn present som blir b\u00e4ttre
  med \u00e5ren.\\n\\nEn grundpl\u00e5t till den f\u00f6rsta l\u00e4genheten, ett
