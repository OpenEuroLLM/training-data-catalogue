  (webb)\\n\\nEU catalogue no\\n\\nQB-BQ-18-008-SV-N\\n\\nECB Ekonomisk rapport Utg\u00e5va
  4 / 2018 \u2013 Den ekonomiska och monet\u00e4ra utvecklingen\\n\\n5\"", "\"SV\\n\\nKOMMISSIONENS
  GENOMF\u00d6RANDEBESLUT (EU) 2016/2093\\n\\nav den 29 november 2016\\n\\nom ett
  undantag vad g\u00e4ller dagen f\u00f6r till\u00e4mpning av systemet med registrerade
  export\u00f6rer p\u00e5 export fr\u00e5n de utomeuropeiska l\u00e4nderna och territorierna\\n\\nEUROPEISKA
  KOMMISSIONEN HAR ANTAGIT DETTA BESLUT\\n\\nmed beaktande av f\u00f6rdraget om Europeiska
  unionens funktionss\u00e4tt, med beaktande av r\u00e5dets beslut 2013/755/EU av
  den 25 november 2013 om associering av de utomeuropeiska l\u00e4nderna och territorierna
  med Europeiska unionen (ULT-beslutet) ( 1 ), s\u00e4rskilt artikel 63 i bilaga VI,
  och\\n\\nav f\u00f6ljande sk\u00e4l:\\n\\n(1) I enlighet med bilaga VI till beslut
  2013/755/EU kommer det nya f\u00f6rfarandet f\u00f6r intygande av ursprung och metoderna
  f\u00f6r administrativt samarbete, systemet med registrerade export\u00f6rer (REX-systemet),
  att till\u00e4mpas fr\u00e5n och med den 1 januari 2017. Det nuvarande systemet
  f\u00f6r intygande och administrativt samarbete g\u00e4ller till och med den 31
  december 2016.\\n(2) De utomeuropeiska l\u00e4nderna och territorierna (ULT) som
  anges i bilaga II till f\u00f6rdraget har var och en s\u00e4nt en skrivelse till
  kommissionen d\u00e4r de uppger att de inte \u00e4r redo att b\u00f6rja till\u00e4mpa
  REX-systemet fr\u00e5n och med den 1 januari 2017 och beg\u00e4r att systemet ska
  b\u00f6rja till\u00e4mpas fr\u00e5n och med ett senare datum. I alla skrivelser
  anges att ULT kommer att kunna till\u00e4mpa REX-systemet fr\u00e5n och med den
  1 januari 2020.\\n(3) Med h\u00e4nsyn till dessa \u00f6nskem\u00e5l och f\u00f6r
  att g\u00f6ra det m\u00f6jligt f\u00f6r ULT att f\u00f6rbereda sig f\u00f6r att
  kunna till\u00e4mpa REXsystemet \u00e4r det l\u00e4mpligt att bevilja ett undantag
  fr\u00e5n systemet med registrerade export\u00f6rer f\u00f6r dessa ULT och att g\u00f6ra
  det m\u00f6jligt f\u00f6r dem att till\u00e4mpa artiklarna 21\u201335 samt artiklarna
  54, 55 och 56 i bilaga VI till beslut 2013/755/EU efter den 1 januari 2017.\\n(4)
  De \u00e5tg\u00e4rder som f\u00f6reskrivs i detta beslut \u00e4r f\u00f6renliga
  med yttrandet fr\u00e5n tullkodexkommitt\u00e9n.\\n\\nH\u00c4RIGENOM F\u00d6RESKRIVS
  F\u00d6LJANDE.\\n\\nArtikel 1\\n\\nGenom undantag fr\u00e5n systemet med registrerade
  export\u00f6rer f\u00e5r de utomeuropeiska l\u00e4nder och territorier som f\u00f6rtecknas
  i bilaga II till f\u00f6rdraget forts\u00e4tta att till\u00e4mpa artiklarna 21\u201335
  samt artiklarna 54, 55 och 56 i bilaga VI till beslut 2013/755/EU till och med den
  31 december 2019.\\n\\nArtikel 2\\n\\nDetta beslut tr\u00e4der i kraft den tjugonde
  dagen efter det att det har offentliggjorts i Europeiska unionens officiella tidning.\\n\\nUtf\u00e4rdat
  i Bryssel den 29 november 2016.\\n\\nP\u00e5 kommissionens v\u00e4gnar Jean-Claude
  JUNCKER Ordf\u00f6rande\"", "\"Budget 2021\\n\\nNoter\\n\\n1\\n\\n1. Uthyrning av
  lokal till LO\\n2. Budget\u00f6kning till Zoomlicens, podd, sms tj\u00e4nster.\\n3.
  M\u00f6teskostnader samma som 2020 med f\u00f6rhoppning att efter sommaren ha fler
  m\u00f6ten.\"", "\"Informationsblad om anm\u00e4lan av milj\u00f6farlig verksamhet\\n\\nANM\u00c4LAN
  ENLIGT MILJ\u00d6BALKEN\\n\\nI detta informationsblad informerar milj\u00f6enheten
  och ger n\u00e5gra praktiska r\u00e5d inf\u00f6r en anm\u00e4lan enligt milj\u00f6balken
  9 kap 6\u00a7 samt milj\u00f6pr\u00f6vningsf\u00f6rordningen (2013:251), 1 kap 10
  \u00a7.\\n\\nMilj\u00f6balken\\n\\nDen 1 januari 1999 tr\u00e4dde milj\u00f6balken
  i kraft. Milj\u00f6balkens m\u00e5l formuleras i 1 kap 1 \u00a7 (se bilaga 1). M\u00e5let
  inneb\u00e4r att vi ska bete oss p\u00e5 ett s\u00e4tt som inte skadar milj\u00f6n
  och utarmar naturresurserna. Naturen \u00e4r inte bara en livsmilj\u00f6 f\u00f6r
  m\u00e4nniskor utan har dessutom ett eget skyddsv\u00e4rde. M\u00e5let ska vara
  styrande f\u00f6r till\u00e4mpningen av alla best\u00e4mmelser i milj\u00f6balken
  t.ex. vid pr\u00f6vning och tillsyn.\\n\\nMilj\u00f6balken inneb\u00e4r att kraven
  p\u00e5 verksamhetsut\u00f6vare har sk\u00e4rpts. Bevisb\u00f6rdan f\u00f6r att
  de s\u00e5 kallade allm\u00e4nna h\u00e4nsynsreglerna f\u00f6ljs ligger p\u00e5
  verksamhetsut\u00f6varen (se bilaga 2). Det kr\u00e4vs numera tillst\u00e5nd eller
  anm\u00e4lan \u00e4ven f\u00f6r att driva milj\u00f6farlig verksamhet, inte bara
  f\u00f6r att anl\u00e4gga eller \u00e4ndra.\\n\\nVerksamhetsut\u00f6varen \u00e4r
  skyldig att f\u00f6lja upp verksamhetens inverkan p\u00e5 milj\u00f6n genom egen
  kontroll av verksamheten. Detta regleras i F\u00f6rordning om verksamhetsut\u00f6vares
  egenkontroll (SFS 1998:901).\\n\\nPr\u00f6vning enligt milj\u00f6balken\\n\\nSyftet
  med tillst\u00e5nds- och anm\u00e4lningsplikt \u00e4r att ge tillsynsmyndigheten
  tillf\u00e4lle att bed\u00f6ma om verksamheten uppfyller de krav som st\u00e4lls
  enligt milj\u00f6balken. En anm\u00e4lan om \u00e4ndring har dessutom till syfte
  att ge tillsynsmyndigheten tillf\u00e4lle att bed\u00f6ma om \u00e4ndringen beh\u00f6ver
  tillst\u00e5ndspr\u00f6vas.\\n\\nMilj\u00f6farliga verksamheter delas in i tre olika
  grupper i Milj\u00f6pr\u00f6vningsf\u00f6rordningen (2013:251):\\n\\n- Tillst\u00e5ndspliktiga
  verksamheter (A - och B -anl\u00e4ggningar)\\n- Anm\u00e4lningspliktiga verksamheter
  (C -anl\u00e4ggningar)\\n- \u00d6vriga (U-verksamheter)\\n\\nIndelningen bygger
  dels p\u00e5 verksamhetens storlek, dels p\u00e5 vilka milj\u00f6- och h\u00e4lsorisker
  som verksamheten bed\u00f6ms medf\u00f6ra.\\n\\nAnm\u00e4lan om milj\u00f6farlig
  verksamhet\\n\\nAnm\u00e4lan ska g\u00f6ras till Samh\u00e4llsbyggnadsutskottet
  i Leksands kommun:\\n\\n- n\u00e4r du vill anl\u00e4gga, driva eller \u00e4ndra
  en C -anl\u00e4ggning.\\n- om du vill \u00e4ndra en A- eller B - anl\u00e4ggning
  och \u00e4ndringen inte kr\u00e4ver tillst\u00e5nd. Anm\u00e4lan ska d\u00e5 g\u00f6ras
  till tillsynsmyndigheten. Leksands kommun har d\u00e4remot \u00f6vertagit tillsynen
  p\u00e5 tillst\u00e5ndspliktiga verksamhet fr\u00e5n L\u00e4nsstyrelsen.\\n\\nMilj\u00f6sanktionsavgift\\n\\nOrg.nr\\n\\n212000-2163\\n\\nI
  samband med att milj\u00f6balken tr\u00e4dde i kraft den 1 januari 1999 inf\u00f6rdes
  \u00e4ven milj\u00f6sanktionsavgifter f\u00f6r vissa \u00f6vertr\u00e4delser av
  lagstiftningen (30 kap. samt f\u00f6rordningen 2012:259 om milj\u00f6sanktionsavgifter).
  Om man anl\u00e4gger eller driver en anm\u00e4lningspliktig industri, annan inr\u00e4ttning
  eller annan milj\u00f6farlig verksamhet utan att ha gjort en anm\u00e4lan tas en
  milj\u00f6sanktionsavgift ut p\u00e5 25 000 kronor efter beslut av tillsynsmyndigheten.
  Milj\u00f6sanktionsavgifter tillfaller inte kommunen utan staten.\\n\\nS\u00e5 h\u00e4r
  behandlas ett anm\u00e4lnings\u00e4rende hos samh\u00e4llsbyggnadsutskottet\\n\\n1.
  En skriftlig anm\u00e4lan ska g\u00f6ras i god tid innan en verksamhet startar och
  l\u00e4mnas till milj\u00f6avdelningen i tv\u00e5 exemplar. I det fall verksamheten
  eller inr\u00e4ttningen har beteckningen A i bilagan till F\u00f6rordningen om milj\u00f6farlig
  verksamhet och h\u00e4lsoskydd (SFS 1998:899) ska anm\u00e4lan inl\u00e4mnas i tre
  exemplar. (25 \u00a7 Fo).\\n2. Milj\u00f6enheten beg\u00e4r in kompletteringar av
  anm\u00e4lan om den bed\u00f6ms som ofullst\u00e4ndig.\\n3. Milj\u00f6enheten skickar
  ett exemplar av anm\u00e4lan med eventuella kompletteringar till L\u00e4nsstyrelsen
  som ges tillf\u00e4lle att yttra sig i \u00e4rendet (25 d \u00a7 Fo).\\n4. Andra
  statliga och kommunala myndigheter, organisationer och enskilda t.ex. de n\u00e4rmaste
  grannarna ges p\u00e5 l\u00e4mpligt s\u00e4tt och i sk\u00e4lig omfattning m\u00f6jlighet
  att yttra sig \u00f6ver anm\u00e4lan. (26 \u00a7 Fo).\\n5. I kontroversiella \u00e4renden
  och \u00e4renden i st\u00f6rre omfattning kan det vara l\u00e4mpligt med en kung\u00f6relse
  i ortspressen.\\n6. Verksamhetsut\u00f6varen f\u00e5r del av s\u00e5dant som tillf\u00f6rts
  \u00e4rendet av annan \u00e4n s\u00f6kande sj\u00e4lv och ges tillf\u00e4lle att
  yttra sig \u00f6ver detta (17 \u00a7 SFS 1986:223 F\u00f6rvaltningslagen).\\n7.
  N\u00e4r faktaunderlaget i \u00e4rendet \u00e4r tillr\u00e4ckligt beslutar samh\u00e4llsbyggnadsutskottet
  om f\u00f6rel\u00e4ggande eller f\u00f6rbud enligt milj\u00f6balken. Utskottet kan
  ocks\u00e5 f\u00f6rel\u00e4gga verksamhetsut\u00f6varen att ans\u00f6ka om tillst\u00e5nd
  enligt 9 kap 6 \u00a7 Milj\u00f6balken eller l\u00e4mna besked om att \u00e4rendet
  inte f\u00f6ranleder n\u00e5gon \u00e5tg\u00e4rd fr\u00e5n n\u00e4mndens sida (Fo
  27\u00a7).\\n8. Utskottets beslut/besked expedieras tillsammans med uppgifter om
  hur ett eventuellt \u00f6verklagande av beslutet kan g\u00f6ras. Beslut av samh\u00e4llsbyggnadsutskottet
  \u00f6verklagas till L\u00e4nsstyrelsen.\\n9. Debitering sker f\u00f6r handl\u00e4ggning
  av \u00e4rendet i enlighet med taxa fastst\u00e4lld av kommunfullm\u00e4ktige.\\n\\n\u00c4ven
  om den som gjort en anm\u00e4lan inte formellt m\u00e5ste avvakta n\u00e5got beslut
  b\u00f6r f\u00f6retaget ta kontakt med Milj\u00f6enheten innan \u00e5tg\u00e4rder
  vidtas. Om en anl\u00e4ggning uppf\u00f6rs eller en verksamhet p\u00e5b\u00f6rjas
  innan samh\u00e4llsbyggnadsutskottets beslut i \u00e4rendet vunnit laga kraft finns
  risk att f\u00f6retaget m\u00e5ste \u00e4ndra det som redan gjorts.\\n\\nOrg.nr\\n\\nVad
  en anm\u00e4lan b\u00f6r inneh\u00e5lla\\n\\nF\u00f6ljande b\u00f6r ing\u00e5 i
  anm\u00e4lan:\\n\\n- administrativa uppgifter om s\u00f6kanden,\\n- uppgifter om
  g\u00e4llande beslut,\\n- uppgifter om lokalisering,\\n- beskrivning av verksamheten,\\n-
  uppgifter om f\u00f6rbrukning och hantering av r\u00e5varor, br\u00e4nslen och kemikalier,\\n-
  uppgifter om det avfall och farliga avfall som uppkommer, hur det hanteras, transporteras
  och omh\u00e4ndertas,\\n- uppgifter om vatten- och avloppsf\u00f6rh\u00e5llanden,
  utsl\u00e4pp till avlopp, eventuell vattenreningsanl\u00e4ggning etc.,\\n- uppgifter
  om luftutsl\u00e4pp, utsl\u00e4ppspunkter, eventuell luftreningsanl\u00e4ggning
  etc.,\\n- uppgifter om energif\u00f6rs\u00f6rjning och eventuell br\u00e4nslelagring,\\n-
  beskrivning av eventuella bullerst\u00f6rningar och bullerd\u00e4mpande \u00e5tg\u00e4rder,\\n-
  uppgifter om drivmedelsf\u00f6rvaring och transporter med anknytning till verksamheten,\\n-
  beskrivning av den kontroll av anl\u00e4ggningen som \u00e4r t\u00e4nkt att utf\u00f6ras,\\n-
  uppgifter om beredskap och rutiner vid eventuella haverier eller spill, samt\\n-
  milj\u00f6konsekvensbeskrivning i den omfattning som beh\u00f6vs i det enskilda
  fallet, enligt 6 kap milj\u00f6balken.\\n\\nAnv\u00e4nd blanketten ANM\u00c4LAN
  ENLIGT MILJ\u00d6BALKEN som finns att h\u00e4mta hos Milj\u00f6enheten, eller p\u00e5
  Leksands kommuns hemsida www.leksand.se.\\n\\nGl\u00f6m inte att bifoga de bilagor
  som kr\u00e4vs. T\u00e4nk p\u00e5 att l\u00e4mna in en s\u00e5 komplett anm\u00e4lan
  som m\u00f6jligt f\u00f6r att f\u00f6rkorta handl\u00e4ggningstiden. Om anm\u00e4lan
  utformas p\u00e5 annat s\u00e4tt \u00e4r det viktigt att de ovanst\u00e5ende punkterna
  tas med.\\n\\nYTTERLIGARE INFORMATION\\n\\nFr\u00e5gor besvaras av Milj\u00f6enheten.\\n\\nPostadress:\\n\\nLeksands
  kommun Samh\u00e4llsutveckling Milj\u00f6enheten 793 80 Leksand\\n\\nBes\u00f6ksadress:
  Kommunhuset, Torget 5\\n\\nTelefon: 0247-800 00 (kundtj\u00e4nst)\\n\\nFax:\\n\\n0247-144
  65\\n\\nE-post: email@example.com\\n\\nOrg.nr\\n\\nMilj\u00f6balkens m\u00e5l (1
  kap 1\u00a7)\\n\\nMilj\u00f6balkens 1 kap 1 \u00a7:\\n\\n\\\"Best\u00e4mmelserna
  i denna balk syftar till att fr\u00e4mja en h\u00e5llbar utveckling som inneb\u00e4r
  att nuvarande och kommande generationer tillf\u00f6rs\u00e4kras en h\u00e4lsosam
  och god milj\u00f6. En s\u00e5dan utveckling bygger p\u00e5 insikten att naturen
  har ett skyddsv\u00e4rde och att m\u00e4nniskans r\u00e4tt att f\u00f6r\u00e4ndra
  och bruka naturen \u00e4r f\u00f6renad med ett ansvar f\u00f6r att f\u00f6rvalta
  naturen v\u00e4l.\\\"\\n\\nMilj\u00f6balken ska till\u00e4mpas s\u00e5 att:\\n\\n1.
  M\u00e4nniskors h\u00e4lsa och milj\u00f6n skyddas mot skador och ol\u00e4genheter
  oavsett om dessa orsakas av f\u00f6roreningar eller annan p\u00e5verkan.\\n2. V\u00e4rdefull
  natur- och kulturmilj\u00f6er skyddas och v\u00e5rdas.\\n3. Den biologiska m\u00e5ngfalden
  bevaras\\n4. Mark, vatten och fysisk milj\u00f6 i \u00f6vrigt anv\u00e4nds s\u00e5
  att en fr\u00e5n ekologisk, social, kulturell och samh\u00e4llsekonomisk synpunkt
  l\u00e5ngsiktigt god hush\u00e5llning tryggas.\\n5. \u00c5teranv\u00e4ndning och
  \u00e5tervinning liksom annan hush\u00e5llning med material, r\u00e5varor och energi
  fr\u00e4mjas s\u00e5 att ett kretslopp uppn\u00e5s.\\n\\nAllm\u00e4nna h\u00e4nsynsreglerna
  i 2 kap Milj\u00f6balken\\n\\nBevisb\u00f6rdan\\n\\nDen som bedriver en verksamhet
  har bevisb\u00f6rdan.\\n\\nKunskapskravet\\n\\nDen som bedriver en verksamhet ska
  skaffa sig den kunskap som beh\u00f6vs f\u00f6r att skydda m\u00e4nniskors h\u00e4lsa
  och milj\u00f6n mot skada eller ol\u00e4genhet. Om erforderlig kunskap inte finns
  dokumenterad kan det inneb\u00e4ra att egna utredningar och unders\u00f6kningar
  m\u00e5ste genomf\u00f6ras.\\n\\nF\u00f6rsiktighetsprincipen\\n\\nDet st\u00e4lls
  krav p\u00e5 att alla som bedriver en verksamhet ska vidta de f\u00f6rsiktighetsm\u00e5tt
  som beh\u00f6vs f\u00f6r att undvika ol\u00e4genhet eller skada f\u00f6r m\u00e4nniskors
  h\u00e4lsa eller milj\u00f6n. Det \u00e4r risken f\u00f6r negativ p\u00e5verkan
  som medf\u00f6r skyldighet att vidta \u00e5tg\u00e4rder. Denna grundl\u00e4ggande
  h\u00e4nsynsregel avser inte bara milj\u00f6st\u00f6rningar som exempelvis utsl\u00e4pp
  och buller utan \u00e4ven utarmande av v\u00e4rdefulla naturoch kulturmilj\u00f6er
  eller misshush\u00e5llning med naturresurser, energi eller material.\\n\\nF\u00f6rorenaren
  betalar Det \u00e4r alltid den som orsakar eller riskerar att orsaka milj\u00f6st\u00f6rning
  som ska bekosta \u00e5tg\u00e4rder f\u00f6r att f\u00f6rebygga eller avhj\u00e4lpa
  st\u00f6rningen.\\n\\nB\u00e4sta m\u00f6jliga teknik\\n\\nF\u00f6r yrkesm\u00e4ssig
  verksamhet ska b\u00e4sta m\u00f6jliga teknik anv\u00e4ndas f\u00f6r att f\u00f6rebygga
  skador p\u00e5 milj\u00f6n. Med detta avses b\u00e5de den anv\u00e4nda teknologin
  och det s\u00e4tt p\u00e5 vilket en anl\u00e4ggning konstrueras, underh\u00e5lls,
  drivs samt hur den avvecklas. Tekniken m\u00e5ste fr\u00e5n teknisk och ekonomisk
  synpunkt vara industriellt m\u00f6jlig att anv\u00e4nda inom branschen. Den ska
  finnas tillg\u00e4nglig och inte bara f\u00f6rekomma p\u00e5 experimentstadiet,
  men beh\u00f6ver inte finnas i Sverige. Kostnaden f\u00e5r dock inte vara osk\u00e4lig
  i f\u00f6rh\u00e5llande till milj\u00f6vinsten.\\n\\nLokalisering\\n\\nPlatsen f\u00f6r
  en verksamhet ska vara l\u00e4mplig med h\u00e4nsyn till milj\u00f6balkens m\u00e5l
  (1 kap 1 \u00a7) och dess hush\u00e5llningsbest\u00e4mmelser (3 och 4 kap). Platsen
  ska ocks\u00e5 v\u00e4ljas s\u00e5 att verksamheten kan bedrivas med minsta intr\u00e5ng
  f\u00f6r m\u00e4nniskors h\u00e4lsa och milj\u00f6. Lokaliseringsprincipen g\u00e4ller
  givetvis vid ny verksamhet men \u00e4ven vid utvidgningar och ompr\u00f6vning av
  befintliga tillst\u00e5nd.\\n\\nHush\u00e5llning och kretslopp\\n\\nDen som bedriver
  en verksamhet ska anv\u00e4nda r\u00e5varor och energi s\u00e5 effektivt som m\u00f6jligt
  och utnyttja m\u00f6jligheterna till \u00e5teranv\u00e4ndning och \u00e5tervinning.
  Vid bed\u00f6mning ska nyproducerat respektive \u00e5tervunnet materials totala
  milj\u00f6p\u00e5verkan v\u00e4gas mot varandra i ett vaggan- till- graven- perspektiv.
  I f\u00f6rsta hand ska f\u00f6rnyelsebara energik\u00e4llor anv\u00e4ndas.\\n\\nProduktvalsprincipen\\n\\nMan
  ska v\u00e4lja s\u00e5dana kemiska produkter som \u00e4r minst skadliga f\u00f6r
  milj\u00f6n.\\n\\nAnsvar f\u00f6r att avhj\u00e4lpa skador\\n\\nDen som orsakat
  skada ansvarar f\u00f6r att avhj\u00e4lpa den.\\n\\nRev 2019-01-15\\n\\nTorget 5\\n\\nLeksand\"",
  "\"ROND 1\\n\\nM\u00e4starklassen lockade ett flertal goda schackspelare till start
  i Jubileumsturneringen. 32 deltagare kommer under 9 ronder, varav 2 dubbelronder,
  att spela om en prispott p\u00e5 drygt 20 000 kronor. Bland de 10 titelinnehavarna
  kan n\u00e4mnas; IM Erik Blomqvist ELO2454, GM Ralf \u00c5kesson ELO2433, GM Lars
  Karlsson ELO 2431, IM Axel Ornstein ELO2392, FM Rauan Sagit ELO 2367, IM Johan Furhoff
  ELO2358 och IM Dan Cramling ELO2356. Kanske kan n\u00e5gra av Sveriges starkaste
  juniorer skr\u00e4lla som Linus Johansson ELO2291, Martin Lokander ELO2285 och Philip
  Lindgren ELO2230. Eriksdalshallen som \u00e4r spellokal bjuder p\u00e5 bra belysning,
  fantastisk ventilation och gott om plats, s\u00e5 f\u00f6ruts\u00e4ttningar f\u00f6r
  bra schackpartier finns.\\n\\nVeteranklassen har 17 \u00e4rrade k\u00e4mpar, varav
  n\u00e5gra deltog i snabbschacks-SM. Favorit \u00e4r Berndt S\u00f6derborg fr\u00e5n
  S\u00e4llskapet.\\n\\nKlass 1 har 15 deltagare som ska f\u00f6rs\u00f6ka spela upp
  sig en klass till SM i Falun. H\u00f6gst rating har Gabriel Bostr\u00f6m med 2087.\\n\\nKlass
  2 har 17 deltagare och d\u00e4r \u00e4r v\u00e4l Bj\u00f6rn Andersson med 1918 lite
  f\u00f6rhandstippad som segrare?!\\n\\nKlass 3 fick ta emot n\u00e5gra juniorer
  och kadetter, d\u00e5 deras klasser utgick. Totalt 31 deltagare med unge och mycket
  lovande Felix Tuomainen 1783 \u00e4r favorit.\\n\\nStockholms Schackf\u00f6rbund
  deltar tillsammans med Stockholms Idrottsf\u00f6rvaltning i firandet av Stockholms
  Olympiastadion 100 \u00e5r. Schack var ingen olympisk gren 1912 men Idrottsf\u00f6rvaltningen
  som tidigare hette kulturf\u00f6rvaltningen tycker att vi mer \u00e4n v\u00e4l fyller
  en plats tillsammans med alla \u00f6vriga sporter som deltar.\\n\\nRobert Sp\u00e5ngberg
  som ordf\u00f6rande i T\u00e4vlingsutskottet, Jan Wikander som huvuddomare och inte
  minst Jonas Sandbom som \u00f6verledare borgar f\u00f6r att jubileums\u00e5ret blir
  en succe!\\n\\nResultat redovisas fortl\u00f6pande p\u00e5 www.chess-results.com
  och dagliga LIVE-s\u00e4ndningar fr\u00e5n \u00e5tta toppbord ger alla schackintresserade
  chansen till god underh\u00e5llning.\\n\\nJan Wikander\\n\\nE-post: firstname.lastname@example.org\\n\\nHemsida:
  www.stockholmschack.nu\"", "\"L\u00e4nsstyrelsen river upp Boxholmsbeslut\\n\\n\u00c4garen
  tvingas flytta omstridd timmerbod\\n\\nBOXHOLM\\nDen omstridde timmerboden p\u00e5
  B\u00e5ln\u00e4s S\u00e4teri, Malexander, m\u00e5ste flyttas.\\n\\nDet s\u00e4ger
  l\u00e4nsstyrelsen, som i sitt beslut konstaterar att byggnadsn\u00e4mnden i Boxholm
  inte har n\u00e5gra som helst befogenheter att bevilja dispens i strandskydds\u00e4renden
  som detta.\\n\\nEnligt strandskyddsbest\u00e4mmelserna i naturv\u00e5rdslagen \u00e4r
  det f\u00f6rbjudet att bebygga land- och vattenomr\u00e5de intill 100 meter fr\u00e5n
  strandlinjen.\\n\\nN\u00e4r byggm\u00e4stare Mats Lindstrand p\u00e5 B\u00e5ln\u00e4s
  S\u00e4teri ville flytta en timmerbod, beviljades han dock dispens av byggnadsn\u00e4mnden
  i Boxholm.\\n\\nDetta skedde i b\u00f6rjan p\u00e5 februari 1989 och boden, som
  skulle ers\u00e4tta en avflyttad badbod samt ett b\u00e5thus p\u00e5 avstyckad tomt,
  placerades fem meter fr\u00e5n Sommens strandkant.\\n\\nProtest\\n\\nOrtarna reagerade
  och protesterade h\u00f6gljutt mot att den bl.a placeras tv\u00e4rs \u00f6ver en
  g\u00e5ng- och cykelv\u00e4g. Och att den st\u00f6rde landskapet.\\n\\nI augusti
  besl\u00f6t byggnadsn\u00e4mnden att Lindstrand var tvungen att anl\u00e4gga en
  ny g\u00e5ngbana f\u00f6r att underl\u00e4tta framkomligheten p\u00e5 stranden.\\n\\nL\u00e4nsstyrelsen
  konstaterar nu att byggnadsn\u00e4mnden inte har n\u00e5gra befogenheter att bevilja
  dispens som man gjort i fallet med timmerhuset. Det gamla \\\"beslutet\\\" rivas
  upp och en ny pr\u00f6vning har gjorts.\\n\\nAv det framkommer att Lindstrand inte
  kan beviljas dispens fr\u00e5n best\u00e4mmelserna. Eftersom fisken som bedrivs
  p\u00e5 fastigheten inte anses n\u00e4ringsutvande, beh\u00f6ver heller inte boden
  ligga s\u00e5 n\u00e4ra strandkanten. Dock har man f\u00f6rst\u00e5else f\u00f6r
  att boden \u00e4nd\u00e5 beh\u00f6vs f\u00f6r f\u00f6rvaring av fiskeredskap, motorer
  och liknande.\\n\\nOenligt beslut\\n\\nL\u00e4nsstyrelsen pekar ut en plats fem
  meter norr om stranden, strax intill ett k\u00e4rromr\u00e5de. Om boden flyttas
  dit kommer den p\u00e5 en mer undanskymd plats och underl\u00e4ttar f\u00f6r allm\u00e4nheten
  att nyttja stranden. Allt enligt beslutet som dock inte var enligt.\\n\\nBitr\u00e4dande
  l\u00e4nsarkitekt Leif Jonsson och byr\u00e5direkt\u00f6r Gunnar Axelsson \u00e4r
  av den uppfattningen att boden b\u00f6r flyttas till en plats p\u00e5 B\u00e5ln\u00e4shalv\u00f6n
  \u00f6stra sida. Den placeringen skulle inte p\u00e5 n\u00e5got vis inkr\u00e4kta
  p\u00e5 de attraktiva strandavsnitten.\\n\\n\u00d6verklagar\\n\\nL\u00e4nsstyrelsen
  p\u00e5pekar i sitt beslut att Lindstrand har tv\u00e5 m\u00e5nader p\u00e5 sig
  att flytta boden.\\n\\nMan konstaterar ocks\u00e5 i beslutsunderlaget att Mats Lindstrand
  handlat i god tro n\u00e4r det g\u00e4ller flyttningen av boden och att han gjort
  lovv\u00e4rda anstr\u00e4ngningar f\u00f6r att underl\u00e4tta allm\u00e4nhetens
  friluftsliv.\\n\\nMats Lindstrand sj\u00e4lv befinner sig p\u00e5 utlandsresa och
  har inte kunnat n\u00e5s f\u00f6r en kommentar. Sonen l\u00e5ter meddela att han
  med st\u00f6rsta sannolikhet kommer att \u00f6verlaga beslutet till milj\u00f6departementet.\\n\\nFlick
  klartecken\\n\\nByggnadsn\u00e4mndens ordf\u00f6rande Svene Larsson konstaterar
  att man nu ska uppmanna Lindstrand att flytta den omtalade boden enligt l\u00e4nsstyrelsens
  intentioner.\\n\\n\u2014 Det finns inte mycket att till\u00e4gga om det h\u00e4r,
  s\u00e4ger han. Vi kontaktade l\u00e4nsstyrelsen n\u00e4r dispensfr\u00e5gan var
  aktuell f\u00f6rsta g\u00e5ngen och fick d\u00e5 ett muntligt besked om att det
  inte beh\u00f6vdes n\u00e5gon f\u00f6rfarande via l\u00e4nsstyrelsen.\\n\\n\u2014
  Vi bes\u00f6kte B\u00e5ln\u00e4s tillsammans med l\u00e4nsstyrelsens representanter
  och diskuterade d\u00e5 den plats som nu f\u00f6resl\u00e5s. Vi har inget att erinra
  mot den placeringen.\\n\\nAGNETA HAGELIN\"", "\"Svensk f\u00f6rfattningssamling\\n\\nLag
  om \u00e4ndring i lagen (2001:558) om v\u00e4gtrafikregister;\\n\\nutf\u00e4rdad
  den 27 maj 2004.\\n\\nEnligt riksdagens beslut 1 f\u00f6reskrivs att 13 \u00a7 lagen
  (2001:558) om v\u00e4gtrafikregister skall ha f\u00f6ljande lydelse.\\n\\n13 \u00a7
  2 Best\u00e4mmelserna i 12 \u00a7 g\u00e4ller inte i fr\u00e5ga om\\n1. fordon som
  anv\u00e4nds uteslutande inom inh\u00e4gnade j\u00e4rnv\u00e4gs- eller industriomr\u00e5den
  eller inom inh\u00e4gnade t\u00e4vlingsomr\u00e5den eller andra liknande inh\u00e4gnade
  omr\u00e5den,\\n2. sl\u00e4pvagnar som dras av traktorer, motorredskap klass II
  eller s\u00e5dana tunga terr\u00e4ngvagnar som \u00e4r konstruerade f\u00f6r en
  hastighet av h\u00f6gst 30 kilometer i timmen, om fordonen i det enskilda fallet
  anv\u00e4nds endast p\u00e5 motsvarande s\u00e4tt som en jordbrukstraktor enligt
  fordonsskattelagen (1988:327),\\n3. fordon som brukas kortaste l\u00e4mpliga v\u00e4g
  till eller fr\u00e5n ett besiktningsorgan enligt 4 kap. 2 \u00a7 fordonslagen (2002:574)
  f\u00f6r registreringsbesiktning eller, i fr\u00e5ga om fordon som har f\u00f6rts
  in i Sverige f\u00f6r testk\u00f6rning enligt 23 \u00a7 f\u00f6rsta stycket 4, f\u00f6r
  kontrollbesiktning,\\n4. fordon som provk\u00f6rs vid besiktning eller inspektion
  av polisman eller s\u00e5dan besiktningstekniker, bilinspekt\u00f6r eller tekniker
  som avses i fordonslagen i den utstr\u00e4ckning som beh\u00f6vs f\u00f6r att f\u00f6rr\u00e4ttningen
  skall kunna genomf\u00f6ras,\\n5. fordon som provk\u00f6rs av den som V\u00e4gverket
  s\u00e4rskilt f\u00f6rordnat att utf\u00f6ra haveriunders\u00f6kning, att ut\u00f6va
  tillsyn enligt produkts\u00e4kerhetslagen (2004:451) eller att handl\u00e4gga ett
  \u00e4rende,\\n6. ombyggda eller amat\u00f6rbyggda fordon som provk\u00f6rs inf\u00f6r
  en registreringsbesiktning av den som V\u00e4gverket s\u00e4rskilt f\u00f6rordnat
  att utf\u00f6ra s\u00e5dan provk\u00f6rning, eller\\n7. fordon som brukas med st\u00f6d
  av saluvagnslicens enligt 18 \u00a7.\\nI fall som avses i f\u00f6rsta stycket 3
  skall handlingar som visar avtalad tid hos besiktningsorganet medf\u00f6ras och
  p\u00e5 tills\u00e4gelse visas upp f\u00f6r en polisman eller en bilinspekt\u00f6r.\\n\\nFinner
  polisman anledning att anta att fordon som han antr\u00e4ffar i trafik inte \u00e4r
  i f\u00f6reskrivet skick till\u00e4mpas f\u00f6rsta stycket 4 p\u00e5 motsvarande
  s\u00e4tt.\\n\\n1 Prop. 2003/04:121, bet. 2003/04:LU29, rskr. 2003/04:241.\\n\\n2
  Senaste lydelse 2002:806.\\n\\nSFS 2004:466\\n\\nUtkom fr\u00e5n trycket den 8 juni
  2004\\n\\n1\\n\\nSFS 2004:466\\n\\nDenna lag tr\u00e4der i kraft den 1 juli 2004.\\n\\nP\u00e5
  regeringens v\u00e4gnar\\n\\nULRICA MESSING\\n\\nLennart Renbjer (N\u00e4ringsdepartementet)\"",
  "\"\\\"Jag m\u00e5ste bliva sj\u00f6man vid marinen ...\\\"\\n\\nBohusl\u00e4ndska
  m\u00e4ns handskrivna visb\u00f6cker fr\u00e5n flottan 1915 - 1945\\n\\nAnnika Nordstr\u00f6m\\n\\nN\u00e4r
  bohusl\u00e4ningarna gjorde sin milit\u00e4rtj\u00e4nst under 1900-talets f\u00f6rsta
  h\u00e4lft, s\u00e5 hamnade de oftast i flottan i Karlskrona. D\u00e4r, p\u00e5
  \\\"Pinan\\\" och ute p\u00e5 de olika b\u00e5tarna, var kv\u00e4llarna l\u00e5nga,
  hemmet l\u00e5ngt borta och kvinnor n\u00e5got man dr\u00f6mde om i sin ensamhet.
  En del av sin tid \u00e4gnade somliga \u00e5t att skriva ner visor i svarta vaxduksb\u00f6cker,
  visor som man kanske hade med sig hemifr\u00e5n eller som man l\u00e4rde sig av
  kamraterna p\u00e5 \\\"luckan\\\". I anteckningsb\u00f6ckerna finns texter om \\\"kommisslivet\\\",
  om bef\u00e4len och kamraterna, om livet till sj\u00f6ss, om k\u00e4rlek och kvinnor.
  D\u00e4r finns ocks\u00e5 blyertsteckningar som liknar tatueringar. De f\u00f6rest\u00e4ller
  ankare, kors och hj\u00e4rtan \u2013 tro, hopp och k\u00e4rlek \u2013 b\u00e5tar
  och kompassrosor, men ocks\u00e5 flickor av olika modell.\\n\\nJag har samlat in
  ett 30-tal s\u00e5dana visb\u00f6cker under mitt arbete p\u00e5 Musik i V\u00e4st
  med dokumentation av folklig s\u00e5ng och musik i Bo-\\n\\nVisbok tillh\u00f6rig
  Gunnar Andr\u00e9asson, f. 1913, Kl\u00e4desholmen.\\n\\nhusl\u00e4n, oftast i samband
  med olika visinsamlingsveckor, d\u00e4r vi i samarbete med lokala krafter har f\u00f6rs\u00f6kt
  att dokumentera vistraditionen i en hel kommun. S\u00e5dana projekt har vi t. ex.
  gjort i Soten\u00e4s, Lysekil, p\u00e5 Orust, \u00d6cker\u00f6 och Tj\u00f6rn. Vid
  dessa tillf\u00e4llen har jag har ocks\u00e5 gjort intervjuer med visb\u00f6ckernas
  \u00e4gare.\\n\\nVisb\u00f6ckerna rymmer mycket av vardagligt skapande. De flesta
  som jag intervjuat har varit mycket stolta \u00f6ver sin bok och betraktat den som
  ett minne fr\u00e5n milit\u00e4rtj\u00e4nsten, fr\u00e5n \u201dkommissionen\u201d,
  medan andra kanske har undrat \u00f6ver varf\u00f6r vi har varit intresserade av
  s\u00e5dant \u201dgammalt skr\u00e4p\u201d. Jag har vid n\u00e5got tillf\u00e4lle
  uppt\u00e4ckt en del urrivna sidor i b\u00f6ckerna och n\u00e5gon har varit lite
  generad \u00f6ver en del av visornas \u201dskabr\u00f6sa\u201d inneh\u00e5ll.\\n\\nVilka
  var m\u00e4nnen som skrev visb\u00f6ckerna? Hur och varf\u00f6r kom de till? Vad
  ryms egentligen innanf\u00f6r de svarta p\u00e4rmarna? Vad ber\u00e4ttar b\u00f6ckerna
  om de unga m\u00e4n som en g\u00e5ng satt och skrev? I den h\u00e4r artikeln vill
  jag f\u00f6rs\u00f6ka ge en bild av en vistradition i en manlig milj\u00f6.\\n\\n**Handskrivna
  visb\u00f6cker**\\n\\nDen handskrivna visbokens historia har \u00e4nnu inte skrivits,
  men bruket att pr\u00e4nta ner visor ur sin egen och andras repertoar i svarta vaxduksb\u00f6cker
  eller gula anteckningsb\u00f6cker f\u00f6rekommer \u00f6ver hela landet. Man kan
  anta att de handskrivna visb\u00f6ckerna blir allt vanligare mot slutet av 1800-talet
  med \u00f6kad l\u00e4s- och skrivkunnighet, men de tidigaste b\u00f6ckerna samlades
  aldrig in i n\u00e5gon st\u00f6rre utstr\u00e4ckning. I Svenskt visarkiv och \u00f6vriga
  arkiv runt om i landet finns samlingar av handskrivna visb\u00f6cker. P\u00e5 Musik
  i V\u00e4st och Bohusl\u00e4ns museum finns nu ca 200 visb\u00f6cker fr\u00e5n v\u00e5r
  egen insamling; flertalet kommer fr\u00e5n en period som str\u00e4cker sig fr\u00e5n
  slutet av 1800-talet fram till 1940-talet. Visb\u00f6ckerna skrevs framf\u00f6rallt
  under ungdomstiden, d\u00e5 man ocks\u00e5 till\u00e4gnade sig den st\u00f6rsta
  repertoaren. F\u00f6r m\u00e5nga har de sedan blivit ett k\u00e4rt minne, en \u00e4godel
  som man har haft med sig hela livet, liksom ett foto- eller poesialbum. Kvinnor
  skrev oftast i sina b\u00f6cker innan de gifte sig, ibland n\u00e4r de var ute och
  arbetade. M\u00e5nga g\u00e5nger har v\u00e4ninnor skrivit ner visor och poesi i
  varandras b\u00f6cker. M\u00e4nnens visb\u00f6cker kan vara skrivna i olika arbetsmilj\u00f6er
  \u2013 ombord p\u00e5 b\u00e5tar eller under anl\u00e4ggningsarbeten \u2013 men
  framf\u00f6rallt i det milit\u00e4ra. I v\u00e5rt material finns handskrivna b\u00f6cker
  fr\u00e5n olika milit\u00e4ra f\u00f6rband, men eftersom min\\n\\ndokumentation
  huvudsakligen har skett i Bohusl\u00e4n, s\u00e5 \u00e4r st\u00f6rsta delen av \u201dmilit\u00e4rb\u00f6ckerna\u201d
  fr\u00e5n flottan. En del av dessa visb\u00f6cker har ocks\u00e5 varit med ut p\u00e5
  andra b\u00e5tar \u2013 p\u00e5 fiske eller fraktfart \u2013 d\u00e4r kv\u00e4llarna
  ocks\u00e5 var l\u00e5nga och m\u00e5nga att f\u00f6rdriva.\\n\\nMats Rehnberg har
  i sin bok *Vad skall vi g\u00f6ra med de blanka gev\u00e4r* skrivit om milit\u00e4rlivets
  vistraditioner (1967:207-221). Ett av kapitlen behandlar sju handskrivna visb\u00f6cker
  fr\u00e5n ett sm\u00e5l\u00e4ndskt kompani under beredskapstiden och han noterar
  att det fortfarande vid denna tid var mycket vanligt med handskrivna visb\u00f6cker
  ute p\u00e5 logementen. I vaxduksb\u00f6ckerna fr\u00e5n Sm\u00e5land kunde han
  se hur en repertoar av visor blivit mer eller mindre gemensam egendom under den
  l\u00e5nga beredskapstj\u00e4nsten. I visb\u00f6ckerna f\u00f6rekom flera texter
  med anknytning till milit\u00e4rlivet, m\u00e5nga av dem var tolkningar av gemensamma
  upplevelser, men h\u00e4r fanns \u00e4ven pornografiska visor och samtida, popul\u00e4ra
  vis- och schlagertexter. Rehnberg anser att visb\u00f6ckerna fr\u00e5n beredskapstiden
  inneh\u00f6ll f\u00e4rre visor \u00e4n motsvarande material fr\u00e5n seklets b\u00f6rjan,
  bl.a. d\u00e4rf\u00f6r att det vid den senare tidpunkten fanns tillg\u00e5ng till
  radio, grammofon, billiga vish\u00e4ften osv. D\u00e5 skrev man i f\u00f6rsta hand
  ner s\u00e5dant som inte fanns p\u00e5 andra st\u00e4llen. B\u00f6ckerna kom att
  bli ett slags minne fr\u00e5n beredskapstiden.\\n\\nMen visb\u00f6ckerna fr\u00e5n
  flottan har kanske framf\u00f6rallt ett starkt sl\u00e4ktskap med sj\u00f6m\u00e4nnens
  handskrivna visb\u00f6cker. En del visor ur denna repertoar finns presenterade i
  boken *Visor & Verser fr\u00e5n haven* av Anders Bj\u00f6rklund och Gunnar Nordlinder
  (1980). F\u00f6rfattarna menar att de handskrivna visb\u00f6ckerna har varit vanliga
  alltifr\u00e5n segelfartygens dagar, men tyv\u00e4rr har m\u00e5nga \u00e4ldre b\u00f6cker
  aldrig tagits tillvara. Deras material str\u00e4cker sig \u00e4nda fram till 1940-talet.
  H\u00e4r har man dock uteslutit den stora kategori som flottisternas visb\u00f6cker
  utg\u00f6r.\\n\\n**Flottan och flottisten fr\u00e5n Bohusl\u00e4n**\\n\\nDe flesta
  \u201dkommissvisb\u00f6ckerna\u201d fr\u00e5n v\u00e5r insamling \u00e4r fr\u00e5n
  \u00e5ren 1915 - 1945, fr\u00e5n ett v\u00e4rldskrig till slutet av ett annat. Under
  f\u00f6rsta v\u00e4rldskriget ut\u00f6kades v\u00e4rnplikten fr\u00e5n 240 till
  minst 340 dagar. Efter kriget sj\u00f6nk utbildningstiden f\u00f6r att med 30-talets
  krigshot \u00e5terigen \u00f6ka. 1942 f\u00f6rl\u00e4ngdes v\u00e4rnplikten till
  450 dagar (Rehnberg 1967:29). S\u00e4kerligen har ocks\u00e5 m\u00e5nga andra f\u00f6rh\u00e5llanden
  i flottan\\n\\n\u00e4ndrats under dessa trettio \u00e5r, men mycket har ocks\u00e5
  varit sig likt - \u00e5tminstone om man f\u00e5r lov att tro vistexterna. Till det
  som har f\u00f6r\u00e4ndrats h\u00f6r yttre f\u00f6rh\u00e5llanden som fartygstyper
  och omst\u00e4ndigheterna ombord p\u00e5 b\u00e5tarna, kvalit\u00e9n p\u00e5 maten,
  m\u00f6jligheter att \u00e4gna sig \u00e5t fritidsaktiviteter som att lyssna p\u00e5
  radio och grammofon osv. Till det som har varit sig likt h\u00f6r den milit\u00e4ra,
  hierarkiska uppbyggnaden, att man m\u00e5ste underordna sig och lyda, och det yttersta
  m\u00e5let f\u00f6r utbildning och \u00f6vningar ombord i flottans fartyg eller
  landanl\u00e4ggningar: \\\"att f\u00f6rvandla enskilda individer till kuggar i ett
  maskineri\\\" (Flottans m\u00e4n ber\u00e4ttar 1979:51). Mats Rehnberg har ocks\u00e5
  beskrivit kamratgruppen och kamratskapets stora betydelse som n\u00e5got best\u00e5ende
  inom de milit\u00e4ra enheterna genom tiderna. Den milit\u00e4ra gruppen f\u00e5r
  snabbt vad som kunde kallas en grupptradition, man blir k\u00e4nslig f\u00f6r varandras
  gillande och ogillande. Ofta har man ocks\u00e5 umg\u00e5tts med kamrater fr\u00e5n
  hemorten, och \\\"de v\u00e5rnpliktigas beroendest\u00e4llning har \u00f6kat deras
  inb\u00f6rdes sammanh\u00e5llning. Dessutom befinner sig rekryterna i den \u00e5lder
  d\u00e5 de nyligen genomg\u00e5tt frig\u00f6relsen fr\u00e5n f\u00f6r\u00e4ldraberoendet
  och funnit en ny social f\u00f6rankring i g\u00e5ng och andra kamratkretsar\\\"
  (Rehnberg 1967:51).\\n\\nVisb\u00f6ckernas nedtecknare \u00e4r f\u00f6dda i Bohusl\u00e4n
  mellan 1893 och 1925. Flertalet \u00e4r fiskare och skutskeppare eller har haft
  andra n\u00e4ringar f\u00f6rbundna med havet. En del av de \u00e4ldre b\u00f6ckerna
  har l\u00e4mnats in av anh\u00f6riga till \u00e4garen, och de har inte kunnat ber\u00e4tta
  s\u00e5 mycket mer \u00e4n n\u00e4r, var och av vem boken skrevs. N\u00e5gra av
  de yngre visb\u00f6ckernas \u00e4gare har jag sj\u00e4lv tr\u00e4ffat och med dem
  har jag ocks\u00e5 haft m\u00f6jlighet att g\u00f6ra en del intervjuer; oftast har
  de gjort sin v\u00e5rnplikt under andra v\u00e4rldskriget, och \u00e4r f\u00f6dda
  i b\u00f6rjan av 1920-talet. I n\u00e5got fall har jag f\u00e5tt ta del av visb\u00f6cker
  fr\u00e5n b\u00e5de far och son. Gemensamt f\u00f6r de bohusl\u00e5nska flottisterna
  \u00e4r allts\u00e5 att de n\u00e4stan alla kom fr\u00e5n milj\u00f6er med n\u00e4ringar
  som har med havet att g\u00f6ra. De hade redan, sin ringa \u00e5lder till trots,
  ett f\u00f6rflutet med havet, b\u00e5tar och livet ombord \u2013 antingen genom
  att de tidigare m\u00f6nstrat som sj\u00f6m\u00e4n eller g\u00e5tt p\u00e5 fisket.
  Efter milit\u00e4rtj\u00e4nsten fortsatte de oftast inom samma yrken.\\n\\nOlof
  \u2013 en flottist som skrev visbok\\n\\n*Olof Berndtsson* var en av dessa bohusl\u00e5nska
  flottister som \u00e4gnade en del av sina kv\u00e4llar i det milit\u00e4ra \u00e5t
  att skriva visor. Jag intervjuade honom hemma vid k\u00f6ksbordet en tidig h\u00f6stdag
  i september 1994. Olof f\u00f6ddes i Halsb\u00e4ck p\u00e5 nordv\u00e4stra Tj\u00f6rn
  1923, i en bygd d\u00e4r man mestadels levde av fraktfart, jordbruk och hemmafiske.
  Han m\u00f6nstrade p\u00e5 en b\u00e5t fr\u00e5n Sk\u00e4rhamn redan innan han fyllt
  femton \u00e5r, p\u00e5 v\u00e5ren 1938, och fick g\u00f6ra sitt f\u00f6rsta \u201dhund\u00e5r\u201d
  som kock ombord. F\u00f6rsta resan varade i \u00e5tta m\u00e5nader. Under kriget
  gick Olof med b\u00e5tar i fraktfart p\u00e5 olika hamnar i \u00d6stersj\u00f6n.
  Innan inryckningen hade han ocks\u00e5 g\u00e5tt p\u00e5 navigationskurs p\u00e5
  Billstr\u00f6mska folkh\u00f6gskolan, p\u00e5 Tyft. I oktober m\u00e5nad 1943 ryckte
  Olof in i det milit\u00e4ra. Han var beredd p\u00e5 att f\u00e5 g\u00f6ra femton
  m\u00e5naders \u201drekryt\u201d och sex m\u00e5naders beredskap \u2013 och att
  tiden i det milit\u00e4ra kanske kunde bli \u00e4nnu l\u00e4ngre. Olof reste iv\u00e4g
  tillsammans med barndomskamraten Valter. Med den bakgrunden var det ingen tvekan
  om att de unga m\u00e4nnen skulle \u00e5ka till Karlskrona och flottan. Alla sl\u00e4ktingar
  f\u00f6ljde med till bussen, m\u00e5nga var oroliga, f\u00f6r det var ju krig ute
  i v\u00e4rlden:\\n\\nMen man var ju ung, 20 \u00e5r, och allting, livet lekte, s\u00e5
  vi tyckte att det var lite genant att de stod d\u00e4r nere p\u00e5 L\u00e5ngek\u00e4rrs
  torg och halvt gr\u00e4t d\u00e5 bussen kom och vi gick p\u00e5 d\u00e4r. Ja, vi
  kom ju d\u00e5 p\u00e5 bussen och s\u00e5 kom vi till t\u00e5get i Stenungsund,
  och d\u00e4r str\u00f6mmade till alla fr\u00e5n Sk\u00e4rhamn och R\u00f6nn\u00e4ng
  och Kl\u00e4desholmen... vi hade ju seglat tillsammans och tr\u00e4ffats ute i hamnar
  och s\u00e5... Och sen s\u00e5 kom vi till G\u00f6teborg och d\u00e4r blev vi uppst\u00e4llda
  igen. Och d\u00e5 kom d\u00e4r en kapten ombord och en l\u00f6jtnant och tog emot
  oss d\u00e4r och sa att \u2013 \u201dFr\u00e5n och med nu st\u00e5r ni under Sveriges
  rikes krigslagar och allt vad ni g\u00f6r nu s\u00e5 blir ni d\u00f6mda efter det\u201d.\\n\\nN\u00e4r
  Olof, Valter och de andra bohusl\u00e4ningarna s\u00e5 sm\u00e5ningom kom fram till
  Karlskrona var det redan mitt i natten. F\u00f6rsta natten sov alla p\u00e5 golvet
  i gymnastiksalen. En vakt patrullerade mellan madrasserna och bevakade ordningen.
  N\u00e4sta morgon blev alla f\u00f6rdelade i olika luckor, de flesta hemifr\u00e5n
  kom p\u00e5 samma st\u00e4lle, d\u00e4refter fick man sin d\u00f6dsbricka och sitt
  nummer. Fr\u00e5n och med nu hette Olof 3314-17-43 Berndtsson. De f\u00f6rsta siffrorna
  var n\u00e5got slags l\u00f6pnummer, sedan kom beteckningen p\u00e5 det milit\u00e4ra
  omr\u00e5de man tillh\u00f6rde, i detta fall I17, och sist kom inrycknings\u00e5ret.
  S\u00e5 fick man l\u00e4mna ifr\u00e5n sig sina egna kl\u00e4der. Olof och Valter
  hade h\u00f6rt av \u00e4ldre kamrater att man inte skulle ta med sig n\u00e5gra
  fina kl\u00e4der \u2013 de kunde ju bli liggande i n\u00e5n fuktig s\u00e4ck i flera
  \u00e5r. Uniformerna som man fick ist\u00e4llet passade inte alltid \u2013 \u201ddet
  var ju inga direkta modesalonger\u201d som man kom till. Sen bar det av till luckan,
  till logementet, som mestadels bestod av en massa s\u00e4ngar:\\n\\nDet var v\u00e4ldigt
  naken, kan vi s\u00e4ga, f\u00f6r det var dubbels\u00e4ngar, riktiga j\u00e4rns\u00e4ngar,
  de stod upp\u00e5 varandra, stadigt p\u00e5 varandra \u2013 tv\u00e5 och tv\u00e5.
  Och s\u00e5 var d\u00e4r tv\u00e5 sk\u00e5p emellan, och s\u00e5 var det tv\u00e5
  igen och s\u00e5 var det tv\u00e5 sk\u00e5p. S\u00e5 stod de hela v\u00e4gen runt...
  Jag hade en \u00f6verslaf och Valter han l\u00e5g under mig.\\n\\nI tre m\u00e5nader
  fick Olof och Valter sitta i skolb\u00e4nken, d\u00e4r de bl. a. undervisades i
  navigation, n\u00e5got som de inte var fr\u00e4mmande f\u00f6r. Dessutom drillades
  de p\u00e5 kaserng\u00e5rden. N\u00e4r de blev lite mer \u201dvarma i kl\u00e4derna\u201d
  fick de ut ett gev\u00e4r och marscherade till ett f\u00e4lt, d\u00e4r det h\u00f6lls
  skjut\u00f6vningar. Den hierarkiska ordningen var viktig, och fast de flesta bef\u00e4len
  var bra, s\u00e5 hade Olof sv\u00e5rt med h\u00e4lsningsplikten p\u00e5 alla officerare:\\n\\nOm
  du s\u00e5 tr\u00e4ffade dom tio g\u00e5nger om dan s\u00e5 fick du h\u00e4lsa p\u00e5
  dom och g\u00f6ra honn\u00f6r. Och ute p\u00e5 stan var det hemskt, f\u00f6r hele
  stan vimlade ut\u00e5 de d\u00e4r milit\u00e4rerna, och det var ju fr\u00e5gan om
  vem skall du h\u00e4lsa p\u00e5 och vem skall du inte h\u00e4lsa p\u00e5. S\u00e5
  man h\u00e4lsade ju p\u00e5 biografvaktm\u00e4stare och j\u00e4rnv\u00e4gstj\u00e4nstem\u00e4n
  och poliser och allting... Och man kunde bli rapporterad om man inte h\u00e4lsa
  p\u00e5 dom.\\n\\nDet var bara p\u00e5 julen som man kunde resa hem, f\u00f6r endast
  d\u00e5 bekostade flottan resan. Fritiden i Karlskrona tillbringades mest p\u00e5
  logementet eller i dagrummet med kortspel. Man hade bara 50 \u00f6re om dan och
  det r\u00e4ckte inte till s\u00e5 mycket mer \u00e4n tobak och n\u00e5gon fika p\u00e5
  \u201dmarkan\u201d d\u00e5 och d\u00e5. Dessutom tyckte Olof att det var kr\u00e5ngligt
  att g\u00e5 ut p\u00e5 stan f\u00f6r det d\u00e4r med h\u00e4lsningsplikten. Hela
  Karlskrona var ju ocks\u00e5 fullt av milit\u00e4rer och det var t. ex. d\u00e5ligt\\n\\nmed
  plats p\u00e5 biograferna. \u00c4ven om tiden ibland blev lite l\u00e5ng, s\u00e5
  minns Olof att man ocks\u00e5 hade roligt tillsammans p\u00e5 luckan, det var ju
  m\u00e5nga hemifr\u00e5n som k\u00e4nde varandra sen tidigare. P\u00e5 logementet
  kunde man sova eller syssels\u00e4tta sig med olika fritidsaktiviteter, att skriva
  visb\u00f6cker var bara ett av dessa tidsf\u00f6rdriv. Olof\\n\\nAtt skriva visb\u00f6cker
  var ett av tidsf\u00f6rdriven p\u00e5 luckan, att brodera kuddar ett annat.\\n\\nFoto:
  Statens Sj\u00f6historiska museum\\n\\nkunde sitta i \u00f6verslafen och skriva
  i sin visbok, medan Valter satt i underslafen och broderade kuddar.\\n\\nDet var
  f\u00f6r att tiden skulle g\u00e5, det var s\u00e5 l\u00e5ngsamt d\u00e4rnere...
  Men det var m\u00e5nga som hade terapiarbeten d\u00e4r, dom gjorde kuddar och t\u00e4ndstickstavlor
  och s\u00e5 d\u00e4r... Det var det man hade att g\u00f6ra p\u00e5 kv\u00e4llarna.
  Och s\u00e5 var det n\u00e5n som k\u00f6pte en veckotidning eller s\u00e5, men den
  gick ju runt s\u00e5 den blev n\u00e4stan utsliten.\\n\\nEfter tre m\u00e5naders
  v\u00e4rnpliktsutbildning blev gruppen sj\u00f6kommenderad. 3314-17-43 Berndtsson
  blev uttagen till en grupp med\\n\\nsignal- och minmatroser, och fick d\u00e4rf\u00f6r
  stanna ytterligare tre m\u00e5nader i Karlskrona, vilket inte var s\u00e5 roligt,
  eftersom flera av hans kamrater hamnade p\u00e5 andra kustartillerier och olika
  b\u00e5tar runt om i landet. Efter denna tid hamnade Olof p\u00e5 en minsvepare,
  som l\u00e5g stationerad vid Nya Varvet i G\u00f6teborg. Den nya stationeringen
  innebar fler hemresor \u00f6ver helgerna \u2013 med uniform naturligtvis. \\\"Man
  k\u00e4nde sig som en milit\u00e4r hela tiden och stod under milit\u00e4ra lagar\\\".
  Livet blev \u00e4nd\u00e5 lite b\u00e4ttre p\u00e5 Nya Varvet och Valter kom ocks\u00e5
  dit s\u00e5 sm\u00e5ningom. \u00c4ven om Olof inte klagar p\u00e5 tiden i Karlskrona
  s\u00e5 ber\u00e4ttar han g\u00e4rna om hur det blev mera familj\u00e4rt n\u00e4r
  man slapp det stora logementet och kom ut p\u00e5 mindre b\u00e5tar. Ombord p\u00e5
  b\u00e5tarna fick man l\u00e4ra sig att anpassa sig efter varandra, och det gick
  nog b\u00e4st utan kvinnor.\\n\\nEn sak som i handelsflottan \u2013 ombord i en
  b\u00e5t allts\u00e5 \u2013 det var ju en del som hade kvinnliga kockar. Men d\u00e5
  fick det inte vara unga vackra flickor, det passa inte, f\u00f6r d\u00e5 blev det
  g\u00e4rna lite avund, b\u00e5de j\u00e4mte bef\u00e4l och manskap. Nej, skulle
  det vara n\u00e5gra s\u00e5 skulle det vara lite \u00e4ldre garvade tanter, som
  hade skinn p\u00e5 n\u00e4san och kunde s\u00e4ga ifr\u00e5n och s\u00e5 d\u00e4r.
  D\u00e5 gick det bra. Men annars s\u00e5 gick det inte. Unga flickor och s\u00e5,
  det var v\u00e4ldigt sv\u00e5rt att ha dom...\\n\\n\u2013 Saknade ni inte t\u00f6serna
  d\u00e5, n\u00e4r ni var i flottan?\\n\u2013 Nej det gjorde man aldrig. Det blev
  v\u00e4l mycket prat om det, men det stannade alltid med det. Och du vet i Karlskrona
  d\u00e4r var ju inga m\u00f6jligheter. F\u00f6r du kan v\u00e4l t\u00e4nka dig under
  kriget \u2013 d\u00e4r l\u00e5g ju b\u00e5de \u00e4ldre landsstorm, och d\u00e4r
  l\u00e5g v\u00e4rnpliktiga, och d\u00e4r l\u00e5g flyget, och d\u00e4r l\u00e5g
  flottan, och d\u00e4r l\u00e5g officerare, det var ju s\u00e5 mycket blandat. Det
  var ju bara milit\u00e4rer d\u00e4r.\\n\\nI stort sett l\u00e5g Olof stationerad
  vid Nya Varvet fram tills dess att han muckade den 21 juli 1945. D\u00e5 hade han
  tillbringat 611 dagar i det milit\u00e4ra; han hade hela den tiden levit i en \\\"manlig\\\"
  v\u00e4rld under namnet 4314-17-43 Berndtsson, han hade \\\"st\u00e5tt under\\\"
  milit\u00e4ra lagar och aldrig f\u00e5tt ta av sig sin d\u00f6dsbricka eller upptr\u00e4da
  civilkl\u00e4dd i offentliga sammanhang. F\u00f6rst nu fick Olof tillbaka sina egna
  kl\u00e4der som l\u00e4mnades in i Karlskrona h\u00f6sten 1943. L\u00e4ngst bak
  i visboken st\u00e5r att l\u00e4sa \\\"Tiden har vi vunnit, Pinan har f\u00f6rsvunnit\\\".\\n\\nGenast
  efter muck m\u00f6nstrade Olof p\u00e5 en fraktskuta. Efter n\u00e5got \u00e5r tog
  han \\\"skepparexamen\\\" p\u00e5 Sj\u00f6bef\u00e4lsskolan i G\u00f6teborg och
  arbetade ocks\u00e5 p\u00e5 \\\"Islandsfisket\\\". Han gifte sig i slutet av 40-talet,
  fick tv\u00e5 barn, blev s\u00e5 sm\u00e5ningom del\u00e4gare och \u00e4gare till
  olika b\u00e5tar, som mest gick i fraktfart runt Sverige och i olika \u00d6stersj\u00f6hamnar.
  Senare arbetade Olof med lossning av bilar i Tj\u00f6rns livaktiga hamn, Vallhamn.
  Han har \u00e4ven bedrivit s. k. \\\"hemmafiske\\\". Han pensionerades 1988, men
  forts\u00e4tter med sm\u00e5fisket. \\\"Du vet att den dan ja\\n\\ninte f\u00e5r
  se \u2018strana\u2019\u00b2, den e de inget riktigt med\u201d, brukar han s\u00e4ga.
  Visb\u00f6ckerna har han sparat genom hela livet.\\n\\n\\\"Denna bok \u00e4r att
  f\u00f6rkorta timmarna i Pinan...\\\"\\n\\nOm man fr\u00e5gar visb\u00f6ckernas
  \u00e4gare idag om varf\u00f6r de skrev ner visor p\u00e5 det h\u00e4r s\u00e4ttet,
  s\u00e5 blir svaren oftast lite dr\u00f6jande, och som intervjuare k\u00e4nner man
  sig rent av n\u00e5got generad \u00f6ver att ha st\u00e4llt en s\u00e5 dum fr\u00e5ga.
  M\u00e4nnen blir f\u00f6rdiga, det finns ingenting att s\u00e4ga ... varf\u00f6r
  och varf\u00f6r ..... nej, det g\u00e5r inte att s\u00e4ga - man bara gjorde det.
  Det fanns v\u00e4l inget s\u00e4rskilt att g\u00f6ra om kv\u00e4llarna; en del f\u00f6rdrev
  tiden med att skriva visor, andra broderade, gjorde t\u00e4ndstickstavlor eller
  spelade kort. En av visb\u00f6ckerna b\u00f6rjar ocks\u00e5 med orden \u201dDenna
  bok \u00e4r att f\u00f6rkorta timmarna i Pinan. Jag b\u00f6rjade kv\u00e4llen den
  18/12 1927. Kl 5.20 e.m.\u201d (GOBIV TB 96b).\\n\\nAtt skriva ner visor var ett
  tidsf\u00f6rdriv, att sjunga dem kunde vara ett annat.\\n\\nJaa... jag vet n\u00e4r
  vi l\u00e5g p\u00e5 luckan d\u00e4r s\u00e5 var det en nordifr\u00e5, vi kalla honom
  f\u00f6r Mandel, det var en riktigt k\u00e4ck typ. Han sj\u00f6ng s\u00e5na d\u00e4re
  sm\u00e5fr\u00e4cka bitar eller s\u00e5 d\u00e4r \u2013 idag tycker du inte att
  dom \u00e4r fr\u00e4cka, men d\u00e5 tyckte vi att dom var sm\u00e5fr\u00e4cke \u2013
  \u00e5 vi hade inga instrument, men han spela \u00e5 sj\u00f6ng, \u00e5 de var p\u00e5
  luckan, s\u00e5 d\u00e4r var liv p\u00e5 luckan, det kan en gott s\u00e4ga. \u00c5
  han h\u00f6ll ig\u00e5ng den d\u00e4r, \u00e5 vi kanske bidrog vi andre ocks\u00e5
  n\u00e4r vi hade haft en glad kv\u00e4ll \u00e5 hj\u00e4lpte till s\u00e5 gott vi
  kunde. S\u00e5 det var en v\u00e4ldigt god st\u00e4mning... Men n\u00e4r vi kom
  p\u00e5 b\u00e5tarna s\u00e5 var det mer ordning, f\u00f6r att det var sammanh\u00e5llning
  p\u00e5 b\u00e5tarne. \u00c5 jag vet jag l\u00e5g p\u00e5 en jagare som hette Kalmar
  och en som hette Helsingborg, \u00e5 de var nye, som de kallades f\u00f6r statsjagare
  d\u00e5, \u00e5 det var i b\u00f6rjan p\u00e5 1944 , \u00e5 d\u00e4r skrevs det
  en del \u00e5 de sj\u00f6ngs ju \u00e4ven nere p\u00e5 trossbottnarna, sj\u00f6ngs
  visor \u00e5 s\u00e5nt d\u00e4r. \u00c5 d\u00e4r hade vi radioanl\u00e4ggningar
  med grammofon s\u00e5 att vi kunde spele bitar runt d\u00e4r p\u00e5 de olika trossbottnarne.
  Men d\u00e4r var m\u00e5nga som sj\u00f6ng \u00e5 till och med hade instrument d\u00e4r
  p\u00e5 de st\u00f6rre b\u00e5tarna. Det var mest sj\u00f6mansvisor, \u00e5 det
  var mycket dom d\u00e4r skillingtrycken, Alpens ros \u00e5 dom d\u00e4r tragiske
  k\u00e4rlekvisorna om Elvira Madigan \u00e5 s\u00e5na d\u00e4r enkla som var l\u00e4tt\u00e5
  komma \u00f6ver. (Rune Svensson f. 1922, Kungshamn)\\n\\nVilka av de v\u00e4rnpliktiga
  som till sitt tidsf\u00f6rdriv valde att skriva ner visor \u00e4r v\u00e4l sv\u00e5rt
  att s\u00e4ga n\u00e5got om, men flera av de intervjuade har haft ett stort intresse
  f\u00f6r just s\u00e5ng och musik. Dessutom hade en del kommit i kontakt med handskrivna
  visb\u00f6cker ute p\u00e5 andra b\u00e5tar. Rune Svensson fr\u00e5n Kungshamn,
  som senare i livet bl.a. har \u00e4gnat sig \u00e5t att skriva och spela lokalrevyer,
  hade n\u00e5gra kompisar med samma intresse:\\n\\nVi var ett par stycken, vi skrev
  ner s\u00e5ne d\u00e4r genom h\u00f6rs\u00e4gen eller l\u00e5na varandras b\u00f6cker,
  skrev ner bitar... det blev ju mest med marin anknytning d\u00e5, \u00e5 sen skrev
  vi s\u00e5ne d\u00e4r korte inslag som fanns, ja som vi h\u00f6rde.\\n\\n\u00c4ven
  om flera av visb\u00f6ckernas \u00e4gare ber\u00e4ttar om hur man kunde sjunga visorna
  till dragspel eller gitarr om kv\u00e4llarna, s\u00e5 \u00e4r det l\u00e5ngt ifr\u00e5n
  alla som har sjungit de visor som skrevs ner. En del har varken f\u00f6rr eller
  senare \u00e4gnat sig \u00e5t att sjunga. M\u00e5nga g\u00e5nger var kommissb\u00f6ckernas
  visor \u201dskriftlig tradition\u201d. Man l\u00e5nade b\u00f6cker av varandra och
  skrev av visorna. Samtidigt som de unga m\u00e4nnen f\u00f6rdrev tiden skapade de
  ocks\u00e5 ett minne f\u00f6r framtiden. Flera av visb\u00f6ckerna b\u00f6rjar med
  orden \u201dVisbok till minne av min exercistid\u201d.\\n\\nFr\u00e5n man till man...\\n\\nN\u00e5gon
  g\u00e5ng kunde man naturligtvis teckna ner en visa ur minnet eller fr\u00e5n schlagerh\u00e4ften,
  radio och grammofon, men mestadels skrev man av varandras b\u00f6cker. Olof ber\u00e4ttar:\\n\\nDet
  var en pojk ifr\u00e5n Grundsund. Vi var kompisar, och han i sin tur hade f\u00e5tt
  l\u00e5na b\u00f6cker, och han var ivrig d\u00e4r, s\u00e5 l\u00e5nade vi dom och
  l\u00e4ste dom och s\u00e5 k\u00f6pte man sig en s\u00e5n d\u00e4ringa med svarta
  p\u00e4rmar, och s\u00e5 skrev man d\u00e5 lite grann p\u00e5 s\u00f6ndagar och
  p\u00e5 kv\u00e4llarna n\u00e4r man hade tid...\\n\\nN\u00e4r Olof kom ut p\u00e5
  olika b\u00e5tar fick han ocks\u00e5 l\u00e5na visb\u00f6cker av olika kompisar:\\n\\nSen
  s\u00e5 samlades man ju alltid p\u00e5 kv\u00e4llarna, och s\u00e5 h\u00f6rde man
  ju vad de sa. S\u00e5 var det alltid n\u00e5n som sa att det har jag i en bok h\u00e4r.
  Och d\u00e5 fr\u00e5ga man om man kunde f\u00e5 l\u00e5na den. \u2013 \u201dJa,
  du f\u00e5r l\u00e5na den, men du f\u00e5r vara r\u00e4dd om den.\u201d F\u00f6r
  den var de v\u00e4ldigt r\u00e4dda om se, ja mycket r\u00e4dda om. S\u00e5 dagen
  efter fr\u00e5ga de \u2013 \u201dHar du skrivit f\u00e4rdigt nu s\u00e5 jag f\u00e5r
  min bok eller?\u201d Ja de var de r\u00e4dda om, sina b\u00f6cker.\\n\\nMen man
  skrev inte av alla visor.\\n\\nTill en b\u00f6rjan s\u00e5 valde man ju det b\u00e4sta,
  men hade man tid s\u00e5 tog man ju \u00e4ven skummj\u00f6lken. Men annars s\u00e5
  var det ju gr\u00e4dden till att b\u00f6rja med. Sen s\u00e5 f\u00f6rs\u00f6kte
  man ju inte f\u00e5 s\u00e5 l\u00e5nga. Men om tiden till\u00e4t s\u00e5 tog man
  de l\u00e5nga ocks\u00e5.\\n\\n\u2013 Ritade man av teckningarna ocks\u00e5?\\n\u2013
  Ja det gjorde man. Det var ju mest ankare och livbojar och b\u00e5tar och ett och
  annat kvinnohuvud och s\u00e5 d\u00e4r. Det var ju efterapningar, och f\u00f6r att
  f\u00e5 det riktigt\\n\\nbra s\u00e5 la man ju g\u00e4rna ett kopieringspapper emellan,
  fast det tyckte inte den om som hade l\u00e5nat ut boken, f\u00f6r d\u00e5 gjorde
  du ju m\u00e4rken i hans bok.\\n\\nRune hade en n\u00e5got annan inst\u00e4llning
  till det d\u00e4r kopierandet:\\n\\nVi hade hamnat nere p\u00e5 radioskola d\u00e5...
  d\u00e5 kom jag i kontakt med en som ocks\u00e5 var radiotelegrafist, \u00e5 han
  visa mig en bok \u00e5 den fick jag l\u00e5na, men han sa, kopiera inte teckningarna,
  sa han, teckna sj\u00e4lv... \u00c5 det \u00e4r v\u00e4ldigt v\u00e4rdefullt att
  man inte kopierar dom, m\u00f6jligtvis sitter \u00e5 tittar p\u00e5 dom \u00e5 ritar
  men hittar p\u00e5 egna alster.\\n\\nVisor och teckningar \u00f6verf\u00f6rdes allts\u00e5
  fr\u00e5n man till man, fr\u00e5n en bok till en annan, m\u00e5nga g\u00e5nger ocks\u00e5
  fr\u00e5n en \u00e4ldre \u00e5rskull till en yngre. Men den som skrev av en annans
  visbok valde ocks\u00e5 ut den eller de visor som passade honom, d\u00e4rf\u00f6r
  blir \u00e4nd\u00e5 inte den ena boken den andra lik. Visb\u00f6ckerna \u00e4r b\u00e5de
  lika och olika.\\n\\nInnanf\u00f6r de svarta p\u00e4rmarna...\\n\\nOm man sl\u00e5r
  upp en av dessa mjuka, svarta p\u00e4rmar, s\u00e5 hittar man p\u00e5 insidan av
  omslaget oftast namnet, hemorten, stationeringen och det milit\u00e4ra numret p\u00e5
  den yngling som en g\u00e5ng skrev boken. M\u00e5nga g\u00e5nger finns h\u00e4r
  ocks\u00e5 en teckning, som t ex kan f\u00f6rest\u00e4lla ett skepp innanf\u00f6r
  en fr\u00e4lsarkrans, kanske namnet p\u00e5 en flicka och s\u00e5 n\u00e5gra ord
  om att boken \u00e4r till minne av exercistiden. Sedan f\u00f6ljer visorna utan
  n\u00e5gon speciell ordning. De v\u00e4rnpliktiga verkar ha bem\u00f6dat sig om
  att skriva s\u00e5 vackert som m\u00f6jligt. Efter varje visa finns vanligtvis en
  anteckning om n\u00e4r, var och av vem den har skrivits ner, och sen kanske en avr\u00e4kning
  p\u00e5 tiden fram till \u201dmuck\u201d \u2013 \u201d128 bullar kvar, och sen fr\u00e5n
  \u2018Pinan\u2019 far\u201d. De d\u00e4r \u201dbullarna\u201d f\u00f6rekommer i
  n\u00e4stan alla b\u00f6cker, och att man r\u00e4knade dagarna i bullar berodde
  p\u00e5 att flottans bullar en g\u00e5ng i tiden var h\u00e5rdare och inte s\u00e4rskilt
  goda, och att man fick en s\u00e5dan\\n\\nvarje morgon. I flera av visb\u00f6ckerna
  finns ocks\u00e5 teckningar, som kan inramma texten p\u00e5 olika s\u00e4tt, ibland
  \u00e4r de placerade p\u00e5 egna sidor eller tillsammans med kortare poesistrofer.
  Teckningarnas ursprungliga f\u00f6rlagor tycks mestadels ha varit olika tatueringar.
  B\u00e5tarna, kompassrosorna och kvinnorna kan ocks\u00e5 vara f\u00e4rglagda p\u00e5
  samma s\u00e4tt som tatueringar. Popul\u00e4ra f\u00f6rlagor \u00e4r t.ex. \\\"Sailors
  grave\\\", \\\"Tro, hopp och k\u00e4rlek\\\" och \\\"Hands across the sea\\\". N\u00e5gra
  flottister har l\u00e5tit sina kamrater rita och skriva i b\u00f6ckerna; ibland
  hittar man ocks\u00e5 namnen p\u00e5 alla kamraterna p\u00e5 luckan n\u00e5gonstans
  i slutet av visboken. En del har gjort ett inneh\u00e5llsregister, och s\u00e5 allra
  sist: \\\"Vi har k\u00e4mpat vi har vunnit, sista bullen har f\u00f6rsvunnit\\\".\\n\\nRepertoaren\\n\\nH\u00e4r
  skall jag ge en kort inblick i repertoarens sammans\u00e4ttning och se vilka visor
  som har varit vanligast f\u00f6rekommande, d\u00e4refter f\u00f6ljer en n\u00e4rmare
  presentation av \\\"Taubevisorna\\\", de rena \\\"Kommissvisorna\\\" och ett avsnitt
  om alla texter som handlar om kvinnor av olika slag.\\n\\nVisb\u00f6ckernas repertoarsammans\u00e4ttning
  \u00e4r sig ganska lik genom de 30 \u00e5r som jag har f\u00f6ljt. H\u00e4r finns
  m\u00e5nga sj\u00f6mansvisor, visor med anknytning till hembygden, visor som blev
  popul\u00e4ra genom skillingtryck under 1800-talet, specialskrivna texter om milit\u00e4rlivet
  p\u00e5 b\u00e5tar, i kaserner och olika hamnar, parodier, lite poesi, revyvisor,
  bondkomikervisor, fula visor, popul\u00e4ra slagd\u00e4ngor, sj\u00f6mansvalser
  och schlagers. Flertalet texter har en eller annan anknytning till sj\u00f6manslivet
  eller livet i det milit\u00e4ra.\\n\\nEn del f\u00f6redrar att skriva bara schlagers
  och \\\"skillingtrycksvisor\\\", andra har \u00e4gnat n\u00e4stan hela sin bok \u00e5t
  att skriva visor och poesi som har med milit\u00e4rlivet att g\u00f6ra, n\u00e5gra
  har flera fula visor och pornografiska ber\u00e4ttelser \u00e4n andra, en del har
  inga \\\"fula\\\" visor alls \u2013 men i m\u00e5nga visb\u00f6cker finns det en
  blandning av alltsamman.\\n\\nVissa texter f\u00f6rsvinner med tiden, nya kommer
  till, men mycket \u00e4r best\u00e5ende. M\u00e5nga av de visor som spreds genom
  skillingtryck under senare h\u00e4lften av 1800-talet och 1900-talets b\u00f6rjan
  verkar ha varit lika omtyckta under hela perioden. Flera flottister av \u00e5rsmodell
  1915 satt t.ex. och skrev ner texten till \\\"Alpens ros\\\", och s\u00e5 var ocks\u00e5
  f\u00f6rh\u00e5llandet n\u00e4r det var dags f\u00f6r 1943 \u00e5rs flottister att
  skriva i sina visb\u00f6cker. Enligt Rune Svensson s\u00e5 sj\u00f6ngs den visan
  ocks\u00e5 ute\\n\\np\u00e5 b\u00e5tarna s\u00e5 sent som 1944. De visor som har
  varit popul\u00e4ra under hela perioden, det mest best\u00e5ende i kommissb\u00f6ckerna,
  visar sig ocks\u00e5 vara skillingtryckens typiska repertoar. D\u00e4ribland finns
  n\u00e5gra favoriter; de har alla anknytning till havet. P\u00e5 f\u00f6rsta plats
  hamnar den k\u00e4nslosamma visan om \u201dEn sj\u00f6mans begravning\u201d. Den
  finns med i n\u00e4stan varje visbok \u00e4nda fram till 1945.\\n\\nSakta \u00f6ver
  m\u00f6rkbl\u00e5 v\u00e5gor\\nr\u00f6r sig skeppets stolta stam\\noch i \u00f6sterns
  purpurv\u00e5gor\\nbryter dagens gryning fram\\n\\nKistan den iordning g\u00f6res\\nupp\u00e5
  gammalt sj\u00f6mansbruk\\noch till relingen den f\u00f6res\\nendast gjord av segelduk\\n\\nIngen
  ros och ingen blomma\\npryda skall en sj\u00f6mans grav\\nendast v\u00e5gor g\u00e5
  och komma\\nskeppet gungar an och av (GOBIV TB 99)\\n\\nN\u00e4stan lika ofta hittar
  man visan om \u201dSkeppet Skulda\u201d, \u00e4ven den en f\u00f6rlisningsvisa.
  Den tredje favoriten \u00e4r \u201d\u00c4lvsborgsvisan\u201d, som ocks\u00e5 finns
  med \u00e4nda fram till 1945.\u00b3\\n\\nDen blomsterprydda gondolen gled\\nut\u00f6ver
  \u00c4lvsborgs bl\u00e5a boljor ned\\ndet var s\u00e5 hemskt i den m\u00f6rka natt\\nen
  flicka sk\u00f6n vid rodret satt\\n\\nVisan har tragiskt inneh\u00e5ll. Den lagerkransade
  Sigrid styr fram gondolen utanf\u00f6r \u00c4lvsborg och sjunger f\u00f6r sin Herman
  som sitter f\u00e4ngslad d\u00e4rinne, men hon drunknar n\u00e4r \u201dhavet ryter
  och \u00e5skan g\u00e5r\u201d. Herman rymmer, kastar sig i havet och drunknar han
  ocks\u00e5; \u201dman sen som v\u00e4lnader sett dem g\u00e5, ibland de h\u00f6ga
  bergen gr\u00e5\u201d. Andra, omtyckta visor ur denna mycket spridda genre \u00e4r
  t.ex. \u201dKors p\u00e5 Idas grav\u201d, \u201dB\u00f6ljans dotter\u201d och \u201dGraven
  p\u00e5 stranden\u201d. Kommissb\u00f6ckernas vanligaste, mest best\u00e5ende, visor
  inneh\u00e5ller mycken sorg och tragik.\\n\\nDe \u00e4ldre visb\u00f6ckerna rymmer
  m\u00e5nga ber\u00e4ttande sj\u00f6mansvisor, varav flera ocks\u00e5 har utkommit
  i skillingtryck. De handlar om sj\u00f6mannens liv, om resor och olyckor p\u00e5
  haven. Rena arbetsvisor eller shanties f\u00f6rekommer s\u00e4llan. En del av sj\u00f6mansvisorna
  har\\n\\nanknytning till Bohusl\u00e4n, och kan handla om olika fisketurer eller
  b\u00e5tar med hemmahamn l\u00e4ngs bohuskusten. H\u00e4r finns t.ex. i flera visb\u00f6cker
  n\u00e5gra texter av fiskaren och sj\u00f6mannen Christian Dahlin (f. 1883) fr\u00e5n
  Hunnebostrand. Dahlin tryckte och spred sina visor i enkla h\u00e4ften, fr\u00e4mst
  under 1910- och 20-talen (GOBIV TB 21). \\\"Ett sj\u00f6mans\u00f6de\\\" handlar
  om en sj\u00f6mans liv (hans eget) under f\u00f6rsta v\u00e4rldskriget. Den h\u00f6r
  till hans mest omtyckta texter och har en n\u00e5got mer realistisk ton \u00e4n
  vad som \u00e4r brukligt i kommissb\u00f6ckerna:\\n\\nVad som sj\u00f6man jag f\u00e5tt
  lida, h\u00e4rom nu jag tala vill\\nSj\u00f6manslivet dock jag \u00e4lskar, sj\u00f6manslivet
  h\u00f6r mig till\\nArbetsl\u00f6s en tid jag varit och d\u00e5 tiden bliver l\u00e5ng\\nD\u00e4rf\u00f6r
  fattar jag nu pennan formar orden till en s\u00e5ng\\n\\nKrigets fasor sig utbreder
  \u00f6ver b\u00e5de land och hav\\nM\u00e5nga av de svenska sj\u00f6m\u00e4n fick
  i havet d\u00e5 sin grav\\nN\u00e4r som fartygen de spr\u00e4ngdes utav minor och
  torped\\nFingo dessa sj\u00f6m\u00e4n ocks\u00e5 f\u00f6lja med i djupet ned\\n(GOBIV
  TB 59d)\\n\\nTemat skeppsbrrott och olyckor \u00e4r \u00f6verhuvudtaget mycket vanligt
  med titlar som \\\"\u00c5ngaren Norges underg\u00e5ng\\\", \\\"Det brunna skeppet\\\",
  \\\"H\u00f6n\u00f6fiskarens f\u00f6rlisning\\\", \\\"Sydkustens f\u00f6rlisning\\\"
  och \\\"Titanics underg\u00e5ng\\\". Men h\u00e4r finns ocks\u00e5 sj\u00f6mansvisor
  som handlar om den trogna sj\u00f6manshustrun som blir \u00e4nka n\u00e4r mannen
  blir borta p\u00e5 sj\u00f6n. Och m\u00e5nga texter som handlar om sj\u00f6m\u00e4nnens
  s\u00e5v\u00e4l trogna som otrogna flickor, vilka vi skall \u00e5terkomma till.
  En speciell kategori utg\u00f6r de visor som handlar om gl\u00e4djeflickor eller
  flickor som har \\\"r\u00e5kat i olycka\\\". En del av dessa finns med under hela
  perioden, men m\u00e5nga f\u00f6rsvinner f\u00f6r att ist\u00e4llet ers\u00e4ttas
  av sj\u00f6mansvalser och Taubevisor.\\n\\nRevyvisor, valser och slagd\u00e4ngor
  eller schlagers verkar ha varit mer kortlivade \u00e4n skillingtrycksvisor och sj\u00f6mansvisor,
  men \u00e4ven en del av dessa beh\u00f6ll sin popularitet genom l\u00e4ngre tid.
  \\\"Arholma-valsen\\\", som kom ut p\u00e5 grammofonskiva 1914 (Ericson 1989:170-\\n\\n171)
  finns avskriven i var och varannan visbok 1915-1918, men f\u00f6rekommer \u00e4ven
  under 20-, 30- och 40-talen. \\\"P\u00e5 Roine strand\\\", som \u00e4r mer av en
  \\\"s\u00e5ngp\u00e4rla\\\" ur pianorepertoaren, var ocks\u00e5 mycket vanlig under
  f\u00f6rsta v\u00e4rldskriget, men verkar inte ha beh\u00e5llit sin popularitet
  under 30- och 40-talen, inte heller \\\"Hesselbysteppen\\\" eller en del andra titlar,
  som har fallit i gl\u00f6mska. Men det kommer nya schlagertexter ist\u00e4llet,
  t.ex. \\\"Lyssnar du kv\u00e4ll till mig lilla mor\\\", \\\"En natt p\u00e5 Ancora
  bar\\\", \\\"Bel Ami\\\", \\\"Aloha-oe\\\" och m\u00e5nga flera. Schlagertexterna
  anknyter mestadels till sj\u00f6manslivet och det g\u00f6r naturligtvis ocks\u00e5
  alla \\\"sj\u00f6mansvalser\\\" ur Ernst Rolfs repertoar. Men det \u00e4r inte en
  av Rolfs valser som har f\u00e5ngat det st\u00f6rsta intresset hos flottisterna,
  utan ist\u00e4llet den mer sk\u00e4mtsamt, ber\u00e4ttande visan \\\"Bland br\u00e4nning
  och sk\u00e4r\\\", som enligt musikforskaren Olle Edstr\u00f6m s\u00e5v\u00e4l i
  text som melodi mer anknyter till en \u00e4ldre, ber\u00e4ttande kategori av sj\u00f6mansvisor
  (1989:85).\\n\\nJag f\u00f6ddes ut p\u00e5 Nordsj\u00f6n en stormig vinternatt\\nn\u00e4r
  stormen tj\u00f6t i spanterna och far min stod vid ratt\\nJag kom i br\u00e4nning
  \u00e5 sk\u00e4r\\n\u00e5 d\u00e4r fick jag min karakt\u00e4r\\nsom liknar havets
  vilda makter p\u00e5 ett ungef\u00e4r\\n\\nJag v\u00e4xte upp blev vackrare \u00e4n
  sj\u00e4lva don Juan\\njag m\u00e5ste ha polisens hj\u00e4lp mot flickorna i hamn\\nDom
  var som br\u00e4nning \u00e5 sk\u00e4r\\ndom l\u00e5g p\u00e5 kn\u00e4na h\u00e4r
  \u00e5 d\u00e4r\\n\u00e5 gr\u00e5t f\u00f6r att dom alla ville bli min hj\u00e4rtans
  k\u00e4r (GOBIV TB 90b)\\n\\nTaubevisorna\\nFr\u00e5n och med 1924 b\u00f6rjar Evert
  Taubes visor bli popul\u00e4ra i visb\u00f6ckerna. Spridningen underl\u00e4ttades
  s\u00e4kert av en rad grammonfoninspelningar. Taubevisorna skiljer sig inte s\u00e5
  mycket n\u00e4r det g\u00e4ller form och inneh\u00e5ll fr\u00e5n de \u00e4ldre sj\u00f6mansvisororna.
  Det \u00e4r fr\u00e4mst visorna ur Evert Taubes f\u00f6rsta vissamling, \\\"Sju
  sj\u00f6mansvisor och Byssan lull\\\" (1919) som finns representerade i kommissb\u00f6ckerna.
  Popul\u00e4rast \u00e4r visan om \\\"Fritiof Andersson\\\", som handlar om hur Fritiof
  r\u00e5kar illa ut i Buenos Aires p\u00e5 grund av en sk\u00f6n senorita:\\n\\nHan
  s\u00e5g p\u00e5 hennes \u00f6gon och hennes svarta h\u00e5r\\noch hennes lilla
  rosenr\u00f6da mun\\noch hennes vita t\u00e4nder och hennes bruna arm\\n\\noch hennes
  smala h\u00e4nder och hennes h\u00f6ga barm\\noch sen tog Fritiof Anderson den flickan
  i famn\\nS\u00e5 g\u00f6r en sj\u00f6man n\u00e4r han g\u00e5r iland\\n\\nGl\u00e4djeflickan
  i fr\u00e4mmande hamnar f\u00f6rekommer ocks\u00e5 i \u201dFlickan i Havanna\u201d,
  som hamnar p\u00e5 andra plats bland \u201dTaubefavoriterna\u201d. Men h\u00e4r
  finns ocks\u00e5 visorna om \u201dKarl-Alfred och Ellinor\u201d, \u201dDen sk\u00f6na
  Hel\u00e9n\u201d, \u201dTuralleri\u201d och \u201dResan till Spanien\u201d. Dessa
  h\u00e4nger med \u00e4nda fram till dess att kommissb\u00f6ckerna blir allt s\u00e4llsyntare
  i slutet av 1940-talet. Deras popularitet kan bara m\u00e4tas med \u201dBalladen
  om briggen \u2018Blue Bird\u2019 av Hull\u201d, vars \u201dunderg\u00e5ngstema\u201d
  kan j\u00e4mf\u00f6ras med \u00e4ldre texter, och som publicerades i \u201dFritiof
  Anderssons visbok\u201d (1929). I denna samling ing\u00e5r ocks\u00e5 en del andra
  favoriter, s\u00e5som forts\u00e4ttningen p\u00e5 visan om Fritiof Andersson \u2013
  \u201dJag \u00e4r fri jag har sonat...\u201d, \u201dKarl Alfred, Fritiof Andersson
  och jag\u201d samt \u201dTatuerar-valsen\u201d.\\n\\nDe Taubevisor som skrevs ner
  av de unga flottisterna st\u00e4mde v\u00e4l in i stilen och med de \u00e4mnen som
  tidigare var besungna i visb\u00f6ckerna; \u201dJag har skrivit till min flicka\u201d
  var ytterligare en s\u00e5dan visa, d\u00e4r temat \u00e4r l\u00e4ngtan efter den
  trogna, v\u00e4ntande flickan. D\u00e4remot skrev de bohusl\u00e4nsva flottisterna
  aldrig av Taubevisor som inte st\u00e4mde in i milj\u00f6n eller med vistraditionen.
  De visor som skrevs ner i kommissb\u00f6ckerna l\u00e5g d\u00e4remot mycket n\u00e4ra
  en redan befintlig tradition med ber\u00e4ttande sj\u00f6mansvisor. En del av visorna
  i \u201dSju sj\u00f6mansvisor och Byssan lull\u201d \u00e4r ocks\u00e5 upptecknade
  ur muntlig tradition och har inte skrivits av Evert Taube, t.ex. \u201dTuralleri\u201d
  eller \u201dFlickan i Hamburg\u201d. Likas\u00e5 uppger Evert Taube att melodin
  till \u201dResan till Spanien\u201d \u00e4r \u201dupptecknad efter ett handklaver
  vid Kungliga Flottan\u201d (Taube 1978:20). Troligen \u00e4r det melodin till \u201dV\u00e4rvningsvisan\u201d
  eller \u201dMarinvisan\u201d, vars text ofta f\u00f6rekommer i de \u00e4ldre visb\u00f6ckerna,
  som Taube har h\u00f6rt, och som vi skall \u00e5terkomma till l\u00e4ngre fram.
  Visforskaren Bengt Jonsson menar ocks\u00e5 att Evert Taube var \u201den framst\u00e5ende
  k\u00e4nnare av den folkliga svenska sj\u00f6mansvisan\u201d, och att han i flera
  av de ovan n\u00e4mnda visorna \u201dskriver helt i den folkliga sj\u00f6mansvisans
  stil och anda\u201d (Lantz & Jonsson 1980:17-18).\\n\\nEn av visb\u00f6ckernas \u00e4gare,
  Sigurd Andersson fr\u00e5n R\u00e5g\u00e5rdsvik, har ocks\u00e5 ber\u00e4ttat om
  hur Taubevisorona kunde leva sitt eget liv. Han l\u00e4rde sig den popul\u00e4ra
  visan om \u201dBlue Bird av Hull\u201d i Karlskrona 1940 av en exerciskamrat fr\u00e5n
  K\u00e4ring\u00f6n. Det var f\u00f6rsta g\u00e5ngen han h\u00f6rde den, och han
  har allt sedan dess sjungit visan p\u00e5 den durmelodi som kamraten sj\u00f6ng,
  inte p\u00e5 den mollmelodi som Evert Taube sj\u00e4lv skrev. Sigurd Anderssons
  melodi till \\\"Blue Bird\\\" p\u00e5minner stilm\u00e4ssigt om sekelskiftets durmelodier
  och samtida schlagers. Evert Taubes egen melodi hade Sigurd vid ett senare tillf\u00e4lle
  h\u00f6rt i radio, \\\"men den var inte s\u00e5 bra, den andra passade b\u00e4ttre\\\".
  Denna durmelodi sjungs av flera s\u00e5ngare p\u00e5 v\u00e4stkusten, och alla \u00e4r
  lika \u00f6vertygade om att det \u00e4r den r\u00e4tta och ursprungliga (Nordstr\u00f6m
  1993:5).\\n\\n\\\"Vi kommo till Karlskrona och uniform vi fick ...\\\"\\n\\nVisorna
  med anknytning till livet i Karlskrona eller ombord p\u00e5 marinens fartyg f\u00f6rekommer
  under hela tidsperioden. Melodier och ordval kan skifta, men inneh\u00e5llet \u00e4r
  i stort sett sig likt. Av versm\u00e5ttet att d\u00f6ma s\u00e5 \u00e4r m\u00e5nga
  skrivna till gamla, k\u00e4nda melodier, och kan t.ex. ber\u00e4tta om resan till
  Karlskrona, som i denna visa ur en bok fr\u00e5n 1916, m\u00f6jligen sjungen till
  melodin \\\"I Gellivare trakter\\\":\\n\\nVi nu v\u00e5r visa sjunger om ni vill
  lyssna till\\nDet \u00e4r om v\u00e5r exercistid vi nu omtala vill\\nSj\u00f6tj\u00e4nstare
  vi \u00e4ro fr\u00e5n Bohus klippor gr\u00e5\\nVi fingo l\u00e4mna hemmet och kronans
  lump ta p\u00e5\\n\\nV\u00e5r j\u00e4rnv\u00e4gsf\u00e4rd den b\u00f6rjade en stad
  vid bohus kust\\noch d\u00e4rifr\u00e5n vi foro med mycken liv och lust\\nMen gl\u00e4djen
  snart sig \u00e4ndrade till b\u00e5de kropp och sj\u00e4l\\ntill deras stora n\u00f6je
  som voro v\u00e5rt bef\u00e4l (GOBIV TB 125)\\n\\nVisorna ber\u00e4ttar ofta detaljerat
  om sj\u00e4lva inryckningen, om t\u00e5gresan, framkomsten, den f\u00f6rsta \u00f6vernattningen,
  de nya kl\u00e4derna och s\u00e5 maten f\u00f6rst\u00e5s, som ocks\u00e5 kan vara
  ett tema f\u00f6r sig.\\n\\nVar morgon f\u00e5r vi bulle\\ns\u00e5 stor och rund
  och sk\u00f6n\\nsom \u00e4r bakad utav vetekli\\noch vattnet ifr\u00e5n sj\u00f6n\\n\\nTill
  middag f\u00e5r vi soppa\\nmed fyra \u00e4rter i\\nman kan av ilska hoppa\\nmen
  man m\u00e5ste l\u00e5ta bli (GOBIV TB 180)\\n\\nH\u00e4r finns ocks\u00e5 klagom\u00e5l
  mot m\u00e5nga andra f\u00f6rh\u00e5llanden i det milit\u00e4ra, ofta gentemot bef\u00e4l
  och stamanst\u00e4llda soldater, och visorna skulle v\u00e4l kunna rubriceras som
  ett slags protest- eller missn\u00f6jess\u00e5nger. En del texter har ocks\u00e5
  anv\u00e4nts som \u201dmallar\u201d; nya \u00e5rskullar har bara bytt ut namn p\u00e5
  personer, b\u00e5tar och platser, som t.ex. i \u201dFlottisten\u201d och \u201dBev\u00e4ringssvisa\u201d:\\n\\nDen
  14:e juli den gl\u00f6mmer jag ej\\nn\u00e4r kronan behagade inkalla mej\\natt g\u00f6ra
  min v\u00e4rnplikt i 200 dar\\nni kan ju ej t\u00e4nka hur tr\u00e5kigt det var\\n\\nNu
  m\u00e5ste man skiljas fr\u00e5n den man har k\u00e4r\\ndu ot\u00e4cka kommis som
  var mig s\u00e5 n\u00e4r\\nadj\u00f6ss lilla rara \u00e4lskade s\u00f6ta\\nsnart
  \u00e4r jag hemma f\u00f6r att \u00e5ter dig m\u00f6ta (GOBIV TB 177)\\n\\nI min
  s\u00e5ng denna g\u00e5ng\\nvill jag skriva om ett tv\u00e5ng\\nsom vi haft under
  \u00e5rets exercis\\nAllt ont som vi f\u00e5tt\\nunder dagar som g\u00e5tt\\nsakta
  fram \u00f6ver Fylgias d\u00e4ck\\n\\nN\u00e4r ja reste \u00e5stad\\nvar jag unger
  och glad\\nJag blott dr\u00f6mde om flickor och vin\\nSen den lyckan tog slut\\nn\u00e4r
  jag skickades ut\\nf\u00f6r att l\u00e4ra mig svensk disciplin... (GOBIV TB 125)\\n\\nDen
  senare texten \u00e4r h\u00e4mtad ur Anders Simonssons visbok, skriven ombord p\u00e5
  H.M. Fylgia 1916. Anders sj\u00e4lv kom fr\u00e5n R\u00e5g\u00e5rdsvik. Samma visa,
  fast med lite variationer, skrev den unge v\u00e4rnpliktige Kurt Nilsson fr\u00e5n
  Skillingholmen ner i sin bok n\u00e4r han tj\u00e4nstgjorde p\u00e5 Drottning Victoria
  \u201dinfrusen \u00e5 H\u00e5rsfj\u00e4rden 19/1 1941\u201d. Flera av \u201dkommissvisorna\u201d
  f\u00f6rekommer under hela den unders\u00f6kta perioden, men anpassade till nya
  \u00e5rskullar och b\u00e5tar.\\n\\nMycket vanliga \u00e4r ocks\u00e5 den typ av
  parodier som Mats Rehnberg har hittat i soldatvisb\u00f6cker fr\u00e5n andra regementen
  (Rehnberg 1967:222-231). Parodierna \u00e4r oftast inga visor, utan kan anspela
  p\u00e5 religi\u00f6sa texter, b\u00f6ner, psalmer och fosterl\u00e4ndska s\u00e5nger,
  som\\n\\nt.ex. i \u201dV\u00e5r mat, v\u00e5r mat, v\u00e5r backlagsmat, ljud h\u00f6gt,
  O dyra ord\u201d (GOBIV TB 134). Men det oftast parodierade stycket \u00e4r nog
  \u201dKrigsmans erinran\u201d, som de v\u00e4rnpliktiga tvingades att l\u00e4ra
  sig utantill och l\u00e4sa i korus, och som kunde f\u00e5 ett helt annat inneh\u00e5ll
  i deras egen version:\\n\\nKrigsman skall ingen frukta, men vara fj\u00e4llan huld
  och trogen, han skall med aptit och energi upp\u00e4ta alla de kuseskivor honom
  vid skaffningen \u00e5l\u00e4gges ... (GOBIV TB 96b).\\n\\nEtt annat popul\u00e4rt
  prosastycke inneh\u00e5ller en beskrivning av flottistens utseende och beteende:\\n\\nBetraktar
  man noga en flottist s\u00f6nderfaller han i tre stora delar: bl\u00e4kragen, tj\u00e4fsen
  och f\u00f6rh\u00e5llningsboken. Dessutom \u00e4r att m\u00e4rka lederna, huvudet
  och armarna. Han vistas huvudsakligen vid kusterna och upptr\u00e4der i stora flockar
  som kallas g\u00e5ng eller parvis i enkla fall ... Han \u00e4r ej farlig och angriper
  ej m\u00e4nniskor utom d\u00e5 han blir retad eller p\u00e5 kommando. Dock finns
  det en och annan som angriper \u201ddet t\u00e4cka k\u00f6net\u201d, s\u00e4rskilt
  efter m\u00f6rkrets inbrott... (GOBIV TB 31)\\n\\nDen v\u00e4rnpliktige flottistens
  m\u00f6ten med flickor i Karlskrona eller olika hamnar \u00e4r ocks\u00e5 ett mycket
  popul\u00e4rt \u00e4mne. I hamnarna kan flottisten ha framg\u00e5ng, men i Karlskrona
  \u00e4r det v\u00e4rre, och visor och poesiverser blir ett slags klago skrifter
  \u00f6ver de flickor, som v\u00e4ljer en stamanst\u00e4lld, en \u201dkanin\u201d,
  ist\u00e4llet f\u00f6r den stackars \u201dbassen\u201d.\\n\\nPinans flickor s\u00e5
  rara\\nde tar sina kaniner bara\\nunder armen och l\u00e5ter\\noss bev\u00e4rings
  vara\\nVi bassar nu h\u00e4r f\u00e5r g\u00e5\\noch vara sura i varje vr\u00e5\\nbara
  f\u00f6r att vi i Pinan ingen tjej kan f\u00e5 (GOBIV TB 134)\\n\\nTrots bev\u00e4ringarnas
  avoga inst\u00e4llning gentemot de stamanst\u00e4llda, s\u00e5 handlar \u00e4nd\u00e5
  en av de popul\u00e4raste visorna om en sj\u00f6man som har l\u00e5tit lura sig
  av flottisternas granna kl\u00e4der och tagit v\u00e4rvning i marinen; det \u00e4r
  den tidigare n\u00e4mnda \u201dV\u00e4rvningsvisan\u201d eller \u201dMarinvisan\u201d.
  Denna variant \u00e4r h\u00e4mtad ur en visbok fr\u00e5n 1934, tillh\u00f6rig Vilhelm
  Gustafsson, f. 1914 p\u00e5 Gullholmen.\\n\\nJag var en livad yngling, knappt fyllda
  sjutton \u00e5r\\ns\u00e5 l\u00e4tt och glatt slog hj\u00e4rtat i livets sk\u00f6na
  v\u00e5r\\nS\u00e5 l\u00e4tt och fort gick tiden och jag var n\u00f6jd och glad\\ntills
  jag fick se en sj\u00f6man vid marinen\\n\\nMed milit\u00e4risk h\u00e5llning han
  gick p\u00e5 gatan fram\\noch v\u00e4nde sig och kikade det gjorde var madam\\noch
  flickorna dom rodna \u00e5 ligapojkar skrek\\nnej, se d\u00e4r g\u00e5r en sj\u00f6man
  vid marinen\\n\\nJa herre Gud i himmelen s\u00e5 h\u00e4rlig han s\u00e5g ut\\nden
  lugna forna tiden jag trodde den tog slut\\nEj hj\u00e4lpte h\u00e4r f\u00f6rmaningar
  ej hj\u00e4lpte gr\u00e5t och b\u00f6n\\njag m\u00e5ste bliwa sj\u00f6man vid marinen\\n\\nBeslut
  och handling f\u00f6ljde, jag gick till lotskapten\\nbland alla som sig v\u00e4rvade
  s\u00e5 var jag en bland dem\\nKontraktet skrevs nu under, storkovan d\u00e5 vi
  fick\\noch kropp och sj\u00e4l f\u00f6rs\u00e5ldes till marinen\\n\\nVi kommo till
  Karlskrona och uniform vi fick\\nmen aldrig uti livet gl\u00f6mmes detta \u00f6gonblick\\nvi
  kallades matroser, men slavar blevo vi\\nty slav \u00e4r den som tj\u00e4nar vid
  marinen\\n\\nEj mycket f\u00e5r man l\u00e4ra som till sj\u00f6mansyrket h\u00f6r\\nmen
  hur kanoner laddas och skarpa knallar g\u00f6r\\nsamt s\u00e5ga ved och kola, p\u00e5
  varvet knacka rost\\nja s\u00e5dant f\u00f6r man l\u00e4ra vid marinen\\n\\nDen
  granna uniformen och s\u00e5 Karlskrona \u00f6l\\nhar lockat m\u00e5ngen yngling
  att bli en v\u00e4rvad kn\u00f6l\\nJa dressen den \u00e4r stilig, men magen den
  \u00e4r tom\\noch sj\u00e4len \u00e4r f\u00f6rkrympt av disciplinen\\n\\nSkrivet
  s\u00f6ndagen den 23 september 1934 till ankars vid Waxholm.\\n1.202.34. Gustavsson.
  H.M.S. Psilander. (GOBIV TB 134)\\n\\nMotivet med flottistens kl\u00e4der \u00e5terkommer
  ocks\u00e5 i andra visor. Oftast handlar det om att de stamanst\u00e4llda har grannare
  uniformer\\n\\nmed flera streck och d\u00e4rmed g\u00f6r st\u00f6rre intryck p\u00e5
  flickorna. Men den v\u00e4rnpliktige \u00e4r ocks\u00e5 stolt \u00f6ver sina kl\u00e4der,
  och i en del senare texter ber\u00e4ttas om hur flottisten g\u00e4rna vill unna
  sig lyxen att ha \\\"tjafs\\\" p\u00e5 sina byxor. M\u00e5nga l\u00e4t ocks\u00e5
  sy in extra kilar i byxorna f\u00f6r att de skulle bli vidare nedtill, men detta
  var str\u00e4ngeligen f\u00f6rbjudet (Flottans m\u00e4n ber\u00e4ttar 1979:24).
  Visan om \\\"Byxkilarna\\\" fr\u00e5n \u00e5r 1935 \u00e4r uppenbarligen skriven
  till melodin \\\"Vem kan f\u00f6rsaka en enda liten stilla flirt\\\":\\n\\nVarf\u00f6r
  f\u00f6rsaka ett enda litet svajigt tjafs\\ntjafset kommer kanske aldrig tillbaka\\nTag
  vad som bjuds n\u00e4r du f\u00e5r n\u00e5gonting\\nRapporter och lasse\u2075 det
  kostar dej ingenting\\nVarf\u00f6r f\u00f6rsaka ett enda litet svajigt tjafs\\ntjafset
  kommer kanske aldrig tillbaka (GOBIV TB 31)\\n\\nFlera visor \u00e4r skrivna till
  k\u00e4nda melodier, ibland med anspelningar p\u00e5 den ursprungliga texten, som
  i \\\"Byxkilarna\\\". Melodin till \\\"Barndomshemmet\\\" tycks ocks\u00e5 ha varit
  tacksam att anv\u00e4nda sig av:\\n\\nKommisslivet.\\n\\nN\u00e4r som pansarpl\u00e5ten\u2077
  fram p\u00e5 bordet glider\\noch det feta fl\u00e4sket lyser bakom den\\ns\u00e5
  en tallrik \u00e4rter dukas fram p\u00e5 bordet\\ndetta \u00e5ts i forna dar med
  fart och kl\u00e4m\\n\\nDet var exercis och \u00f6vning hela dagen\\nn\u00e4r som
  tjugo\u00e5ring jag vid flottan var\\nOch de minnen som jag har fr\u00e5n dessa
  dagar\\n\u00e4r de v\u00e4rsta och de hemskaste jag har\\n\\nIfr\u00e5n havet intill
  kusten skrovet glider\\nintill mobiliseringskajen d\u00e5 och d\u00e5\\nfast jag
  ej f\u00f6rt\u00f6jt p\u00e5 l\u00e5nga, l\u00e5nga tider\\nkusten har jag aldrig,
  aldrig gl\u00f6mt \u00e4nd\u00e5 (GOBIV TB 178)\\n\\nKommissvisornas popul\u00e4raste
  motiv - den h\u00e5rdas disciplinen, slaveriet, flickornas k\u00e4rlek och svek,
  den usla maten och kamratskapet - f\u00f6rekommer ocks\u00e5 i muckvisorna. \\\"Utm\u00f6nstringen\\\"
  \u00e4r skriven till melodin \\\"H\u00e4lsa dem d\u00e4rhemma\\\":\\n\\nFr\u00e5n
  Karlskrona far jag\\nreser \u00e5ter hem\\noch en l\u00e4ttnad \u00e4r det\\n\\nJag
  har nu min frihet\\noch kan kl\u00e4mma i\\nfarv\u00e4l med kommislivet\\noch dess
  slaveri (GOBIV TB 68)\\n\\nFlickorna \u2013 s\u00e5 n\u00e4ra, men \u00e4nd\u00e5
  s\u00e5 fj\u00e4rran \u2026\\n\\nDet bor en flicka intill mitt rum\\nVi ser varandra
  s\u00e5 s\u00e4llan\\nen v\u00e4gg oss skiljer med n\u00e5gra tum\\nT\u00e4nk, bara
  v\u00e4ggen emellan\\n\\nJag h\u00f6r n\u00e4r hon uti t\u00e4cket drar\\noch kryper
  lakanen emellan\\nstrax tanken genom mitt huvud far\\nT\u00e4nk: bara v\u00e4ggen
  emellan\\n\\nIbland jag dr\u00f6mmar hon \u00e4r hos mig\\njag lockat henne i f\u00e4llan\\nMen
  n\u00e4r jag vaknar inne hos mig\\ns\u00e5, nog fan \u00e4r v\u00e4ggen emellan
  (GOBIV TB 179)\u2078\\n\\nN\u00e4r man sitter och bl\u00e4ddrar i visb\u00f6ckerna,
  s\u00e5 sl\u00e5s man av att v\u00e4ldigt m\u00e5nga texter handlar om det \u201davsaknade\u201d
  k\u00f6net. I denna \u201dmanliga\u201d milj\u00f6 var kvinnorna l\u00e5ngt borta,
  men \u00e4nd\u00e5 oerh\u00f6rt n\u00e4ra. Dr\u00f6mmen om det motsatta k\u00f6net
  kunde se ut p\u00e5 m\u00e5nga olika s\u00e4tt; kvinnobilderna i visb\u00f6ckerna
  \u00e4r inte entydiga. Flera korta poesiverser handlar om k\u00e4rlek och kyssar.
  H\u00e4r finns mycken l\u00e4ngtan efter flickor, som kan vara ack s\u00e5 ljufva,
  men ocks\u00e5 sv\u00e5r\u00e5tkomliga och op\u00e5litliga:\\n\\nTeckning av Rune
  \u201dRadio\u201d 3268-17-42 Svensson, f. 1922. Kungshamn.\\n\\nAtt kyssa f\u00e5
  en vacker flicka\\n\u00e4r livets h\u00f6gsta poesi\\nett rus fr\u00e5n ljuva l\u00e4ppar
  dricka\\nAll v\u00e4rldens lycka bor d\u00e4ri\\n\\n\u2014\\nFr\u00e5ga ej varf\u00f6r
  hj\u00e4rtat gr\u00e5ter\\noch mitt \u00f6ga brista vill\\ningen gl\u00e4dje jag
  f\u00e5r \u00e5ter\\nom du ej mig tillh\u00f6ra vill (GOBIV TB 96b)\\n\\n\u2014\\nAtt
  en vacker flicka se och icke kyssa v\u00e5ga\\ndet \u00e4r som vid k\u00e4llan st\u00e5
  och k\u00e4nna t\u00f6rsten pl\u00e5ga (GOBIV TB 59d)\\n\\n\u2014\\nTag \u00e5len
  vid stj\u00e4rten\\noch kvinnan p\u00e5 orden\\ns\u00e5 har du det s\u00e4kraste
  handtag p\u00e5 jorden (GOBIV TB 111a)\\n\\nKvinnor verkar vara ett sv\u00e5rt kapitel,
  som man beh\u00f6ver l\u00e4ra sig mycket om. Det \u00e4r minst lika sv\u00e5rt
  som att f\u00f6ra fram en b\u00e5t med s\u00e4ker hand.\\n\\nVarf\u00f6r kallas
  ett fartyg hon?\\nD\u00e4rf\u00f6r att hon liksom kvinnan \u00e4r sv\u00e5r att
  styra\\nD\u00e4rf\u00f6r att hon liksom kvinnan \u00e4r dyr att rigga\\nD\u00e4rf\u00f6r
  att hon liksom kvinnan m\u00e5ste riggas f\u00f6r att se n\u00e5gonting ut\\nD\u00e4rf\u00f6r
  att hon liksom kvinnan m\u00e5ste f\u00f6ras i hamn och bindas vid ringar\\nVilket
  h\u00e4rmad intygas (GOBIV TB 96b)\\n\\nFlottisternas kvinnoideal kan man l\u00e4sa
  sig till i den popul\u00e4ra versen om \\\"Hur en sj\u00f6mans flicka b\u00f6r vara\\\",
  som \u00e5terkommer i m\u00e5nga visb\u00f6cker under hela den unders\u00f6kta perioden.\\n\\nAlla
  glada sj\u00f6m\u00e4n bl\u00e5\\n\u00f6nska sig en flicka f\u00e5\\nEj f\u00f6r
  mager, ej f\u00f6r fet\\nej f\u00f6r kall, men ej f\u00f6r het\\nEj f\u00f6r rank
  och ej f\u00f6r krokig\\nej f\u00f6r klok, men ej f\u00f6r tokig\\nEj f\u00f6r gammal,
  ej f\u00f6r ung\\nej f\u00f6r sn\u00e5l ej med f\u00f6r \u00f6ppen pung\\nEj f\u00f6r
  s\u00f6mnig, ej f\u00f6r vaken,\\nenkelt kl\u00e4dd, men inte naken (GOBIV TB 179)\\n\\nKapitlet
  flickor \u00e5terkommer ocks\u00e5, om \u00e4n p\u00e5 lite annat vis, i de \\\"fula
  visorna\\\". Bengt af Klintberg och Christina Mattsson skriver i *Fula visbokens*
  f\u00f6rord: \\\"Otaliga sj\u00f6m\u00e4n och soldater har gjort sig av med sina
  handskrivna visb\u00f6cker n\u00e4r de skulle g\u00e5 i land eller l\u00e4mna kasernlivet.
  B\u00f6ckerna inneh\u00f6ll vistexter som de inte ville bli f\u00f6rknippade med.
  En tj\u00e4nsteman vid ett av v\u00e5ra stora folkminnesarkiv har ber\u00e4ttat
  f\u00f6r oss att han under 1940-talet returnerade samlingar med obscena visor till
  upptecknarna\\\" (1980:27). M\u00e5nga forskare har ocks\u00e5 p\u00e5pekat att
  de erotiska visorna \\\"ingenstans har varit s\u00e5 vanliga som i slutna manliga
  kollektiv: soldatkaserner, fartyg, dr\u00e4ngstugor, skogshuggarbaracker\\\" (aa:31).
  S\u00e4kerligen f\u00f6rh\u00e5ller det sig s\u00e5 att inte heller jag har f\u00e5tt
  ta del av alla visb\u00f6cker med \\\"fula visor\\\" i. Under ett dokumentationsprojekt
  i V\u00e4stsverige talade en \u00e4ldre man om att han hade en visbok fr\u00e5n
  \\\"kommisstiden\\\" hemma, som han dock inte ville visa, f\u00f6r d\u00e5 skulle
  jag \\\"rodna l\u00e5ngt upp \u00f6ver strumpeskaffen\\\". Jag vet inte hur m\u00e5nga
  som har beh\u00e5llit sina fula visor f\u00f6r sig sj\u00e4lv, eller om n\u00e5gra,
  som Christina Mattsson och Bengt af Klintberg s\u00e4ger, har gjort sig av med sina
  b\u00f6cker. Men de b\u00f6cker som jag har f\u00e5tt in har f\u00f6r \u00e4garna
  varit ett k\u00e4rt minne, s\u00e5 det verkar inte helt konsekvent att man skulle
  sl\u00e4nga bort en s\u00e5dan bok. I alla fall finns h\u00e4r flera fula visor
  - och en del erotiska noveller. Graden av \\\"fulhet\\\" varierar. Ofta handlar
  det om parodier, omskrivningar p\u00e5 redan k\u00e4nda texter, som \\\"Vid femton
  \u00e5rs \u00e5lder en hora jag blev\\\" och \\\"Anders han var en hurtiger dr\u00e4ng,
  pl\u00f6jde s\u00e5 m\u00e5ngen f\u00e5ra\\\". Flera visor som ursprungligen blev
  popul\u00e4ra genom skillningstryck i slutet av 1800-talet har ocks\u00e5 anv\u00e4nts
  som f\u00f6rlagor, som den tragiska, men nu mycket fr\u00e4cka, visan om \\\"Balsalens\\n\\ndrottning\\\",
  liksom \\\"Sandahls kanon\\\" som ist\u00e4llet har blivit \\\"Myrdals kanon\\\":\\n\\nDet
  vankar en flicka s\u00e5 ensam i skogen\\nhon skall till en sj\u00f6man som v\u00e4ntar
  vid logen\\nmen n\u00e4r hon kom dit stod en hel bataljon\\nd\u00e4r redo att avfyra
  Myrdals kanon (GOBIV TB 111 a)\\n\\nP\u00e5fallande ofta \u00e4r det genom en kvinna
  som de erotiska upplevelserna beskrivs:\\n\\nJag gick mig ut en aftonstund, att
  ta mig en promenad\\nMin f\u00e4stman vid min sida gick, som alltid var s\u00e5
  glad\\nTralla la ....\\nMin f\u00e4stman vid min sida gick som alltid var s\u00e5
  glad\\n\\nHan handen f\u00f6rde l\u00e4ngre ned till mina ben och l\u00e5r\\nTill
  st\u00e4llet som bekransat \u00e4r med svart och krulligt h\u00e5r\\n\\nD\u00e5
  minnes jag min mammas ord, var r\u00e4dd f\u00f6r varje man\\nTy gossar upp\u00e5
  dej sm\u00e5 gossar g\u00f6ra kan\\n\\nMen Villiam han viskade ligg still min dyra
  skatt\\nSen b\u00f6jde han sig sakta ned och grep den styve fatt\\n\\nD\u00e5 kom
  d\u00e4r fram en stor filur s\u00e5 jag blev n\u00e4stan r\u00e4dd\\nN\u00e4r jag
  fick se hur l\u00e5ng han var, och nertill h\u00e5rbekl\u00e4dd\\n\\nMin kropp den
  sk\u00e4lvde och som utav salighet bes\u00e4nkt\\natt himlar upp\u00e5 jorden finns,
  det aldrig f\u00f6rr jag t\u00e4nkt\\nTralla la ..... (GOBIV TB 90 b)\\n\\nI flera
  av dessa erotiska visor och noveller \u00e4r flickan s\u00e5 mycket oskuld att hon
  knappast vet vad det hela handlar om, men hon blir genast mycket f\u00f6rtjust i
  det som gossarna g\u00e4rna vill g\u00f6ra med henne. Kvinnorna i dessa visor \u00e4r
  klart intresserade av erotik, vare sig de \u00e4r oskulder eller \\\"horor\\\".
  Det finns ocks\u00e5 tv\u00e5 slags visor som handlar om horan eller gl\u00e4djeflickan.
  I det f\u00f6rsta fallet \u2013 n\u00e4r man kallar henne f\u00f6r hora \u2013 s\u00e5
  har texten ocks\u00e5 ett erotiskt inneh\u00e5ll, och attityden gentemot flickorna
  kan vara ganska kall:\\n\\nI Kungstr\u00e4dg\u00e5rden det satt en hora och pissa\\noch
  mittemot satt tvenne sj\u00f6m\u00e4n och fnissa\\nKom hit du hora skall vi dig
  knulla f\u00f6r pengar\\nf\u00f6r vi \u00e4r sj\u00f6m\u00e4n och inga vanliga dr\u00e4ngar
  (GOBIV TB 111 a)\\n\\nN\u00e4r man d\u00e4remot sjunger om \\\"gl\u00e4djeflickan\\\",
  s\u00e5 kan det r\u00f6ra sig om en helt annan, tidigare n\u00e4mnd, kategori av
  visor, f\u00f6r i kommissb\u00f6ckerna finns ocks\u00e5 texter som ber\u00e4ttar
  om den sorgliga bakgrunden till varf\u00f6r n\u00e5gon blir gl\u00e4djeflicka. I
  visb\u00f6ckerna fr\u00e5n 1916 fram till 1935 hittar man ofta visan om \\\"Blondinen\\\",
  \\\"Gl\u00e4djeflickan\\\" eller \\\"Schweizerflickan\\\". H\u00e4r f\u00f6ljer
  en variant ur en bok fr\u00e5n 1933, tillh\u00f6rig Gunnar Andr\u00e9asson, f. 1913
  p\u00e5 Kl\u00e4desholmen. Han har ocks\u00e5 sjungit in visan p\u00e5 band.\\n\\nUti
  staden i ett \u00f6dsligt n\u00e4ste\\nsatt en g\u00e5ng en vacker ung blondin\\nHennes
  kinder voro liksom rosen\\nhennes \u00f6gon voro himmelsbl\u00e5\\n\\nVacker var
  hon, skapad till behagen\\nhon tog plats upp\u00e5 ett Schweizeri\\nM\u00e5ngen
  blev i flickan djupt betagen\\nhon l\u00e5t sig tjusas, men gick \u00e4nd\u00e5
  fri\\n\\nMen s\u00e5 kom d\u00e4r en ibland de m\u00e5nga\\nhan som r\u00f6vat flickans
  heder bort\\nF\u00f6rst med guld, och sen med l\u00f6ften fagra\\nstal han hennes
  heder inom kort\\n\\nOfta s\u00e5g man henne sent om kv\u00e4llen\\ntitta fram vid
  lyktans dunkla ljus\\nf\u00f6r att av de djuriska beg\u00e4ren\\nskaffa sig en herrre
  och ett rus\\n\\nHennes plats blev sedan bakom muren\\nhennes d\u00f6d blev en f\u00f6r
  tidig grav\\nf\u00f6r att hon har l\u00e5tit s\u00e5 sig narras\\nO ve, o ve, den
  hennes heder stal (GOBIV TB 31)\\n\\nI andra b\u00f6cker inneh\u00e5ller visan ibland
  ytterligare en strof som ber\u00e4ttar att den stackars gl\u00e4djeflickans fader
  var en sj\u00f6man som f\u00f6r l\u00e4ngesedan har f\u00f6rsvunnit och att hennes
  mor \\\"gick p\u00e5 gatan\\\". Att d\u00f6ma av de sex uppteckningar som sedan
  tidigare finns p\u00e5 Svenskt visarkiv har \\\"Gl\u00e4djeflickan\\\" mestadels
  har sjungits av m\u00e4n.\\n\\nDet finns ytterligare en \\\"favoritvisa\\\" i kommissb\u00f6ckerna
  som behandlar ett liknande \u00e4mne, och det \u00e4r den s.k. \\\"Eiravisan\\\"
  eller \\\"P\u00e5 Kungsholms strand\\\". Den var popul\u00e4r under ungef\u00e4r
  samma period som \\\"Gl\u00e4djeflickan\\\", och handlar om de flickor som hamnade
  inom l\u00e5s och bom p\u00e5 \\\"Eira\\\", kurhuset f\u00f6r veneriska sjukdomar
  p\u00e5 Kungsholmen i Stockholm.\\n\\nInneh\u00e5llsm\u00e4ssigt skulle man v\u00e4l
  kunna j\u00e4mf\u00f6ra denna kategori med en del av Evert Taubes visor, t.ex. \u201dFlickan
  i Havanna\u201d, men d\u00e4r Taubes text bejakar flickans s\u00e4tt att f\u00f6rs\u00f6rja
  sig. Samma \u00e4mne dyker ocks\u00e5 upp i visorna \u201dI den fattiga stugan vid
  N\u00e4set\u201d och \u201dG\u00f6teborgs-flickorna\u201d.\\n\\nMan kan, som sagt,
  hitta flera olika kvinnobilder i visb\u00f6ckerna. H\u00e4r finns den \u201dfallna
  kvinnan\u201d, som ibland inte m\u00f6ter n\u00e5gon sympati, men som man ocks\u00e5
  kan tycka synd om. H\u00e4r finns ocks\u00e5 den trogna, v\u00e4ntande kvinnan,
  f\u00e4stm\u00f6n, som ofta finns d\u00e4rhemma, hon som en g\u00e5ng skall bli
  sj\u00f6manshusfrau, en troget v\u00e4ntande. Ofta sammanfaller bilden av gl\u00e4djeflickan
  med erotiska bilder, med l\u00e4ngtan efter sex. Bilden av den trogna flickan sammanfaller
  med l\u00e4ngtan efter den \u201drena\u201d k\u00e4rleken. Den blivande frun skall
  vara varken \u201dkall eller het\u201d, inte vara \u00f6verdrivet kort eller l\u00e5ng,
  inte f\u00f6r klok och inte f\u00f6r tokig; hon skall helt enkelt bara vara vanlig.
  Men i vissa av visorna finns b\u00e5da dessa kvinnobilder i en och samma kvinna,
  som n\u00e4r oskulden f\u00f6rvandlas under sitt f\u00f6rsta m\u00f6te med erotiken.\\n\\nBilden
  av den trogna kvinnan \u00e5terkommer ocks\u00e5 i m\u00e5nga av de texter som handlar
  om l\u00e4ngtan efter mor d\u00e4rhemma, f\u00f6r finns det n\u00e5gon kvinna som
  man kan lita p\u00e5 i alla v\u00e4der, s\u00e5 \u00e4r det hon, som i den popul\u00e4ra
  \u201dMor lilla mor\u201d:\\n\\nMor lilla mor, vem \u00e4r v\u00e4l som du\\nIngen
  p\u00e5 hela jorden\\nIngen kan \u00e4lska mig s\u00e5som mor\\ningen kan s\u00e5
  f\u00f6rsaka\\nKunde jag, kunde jag blott en g\u00e5ng\\nsk\u00e4nka dig det tillbaka
  (GOBIV TB 96b)\u00b9\u00b9\\n\\nTro, hopp och k\u00e4rlek \u2013 n\u00e5gra sammanfattande
  tankar\\n\\nLiksom tiden i det milit\u00e4ra utgjorde en tydligt avgr\u00e4nsad
  period i livet, s\u00e5 kunde kommissboken vara n\u00e5got speciellt. Olof Berndtsson
  ber\u00e4ttade att han ibland hade haft med sig sin bok ut p\u00e5 andra b\u00e5tar
  i handelsflottan \u2013 \u201dmen det var ju ett minne, man var ju lite r\u00e4dd\\n\\nom
  dom, det har n\u00e4stan varit lite mera hemlighetsmakeri\\\". Men bruket att skriva
  visb\u00f6cker hade en del av de v\u00e4rnpliktiga med sig hemifr\u00e5n eller fr\u00e5n
  andra b\u00e5tar. N\u00e5gra fortsatte ocks\u00e5 att skriva visor i det civila,
  ute p\u00e5 fraktskutor och fiskeb\u00e5tar, medan andra endast \u00e4gnade sig
  \u00e5t detta under tiden i flottan. Intresset f\u00f6r att forts\u00e4tta med visb\u00f6ckerna
  h\u00e4nger ofta samman med lusten att sjunga.\\n\\nMats Rehnberg menade att visb\u00f6ckerna
  fr\u00e5n beredskapstiden inneh\u00f6ll f\u00e4rre visor \u00e4n tidigare visb\u00f6cker
  (1967:207-221). De bohusl\u00e5nska flottisternas b\u00f6cker blir m\u00f6jligen
  n\u00e5got tunnare med tiden, speciellt de vars \u00e4gare inte sj\u00f6ng visorna
  sj\u00e4lva, men det handlar inte om n\u00e5gon st\u00f6rre f\u00f6r\u00e4ndring.
  Rehnberg ans\u00e5g ocks\u00e5 att beredskapstidens bev\u00e4ringsar framf\u00f6rallt
  skrev ner s\u00e5dant som inte fanns p\u00e5 andra st\u00e4llen, t.ex. i billiga
  vis- och schlagerh\u00e4ften, i radio och p\u00e5 grammofon (1967:220). Det g\u00e4ller
  inte bohusl\u00e4ningarnas urval; h\u00e4r finns m\u00e5nga texter som fanns att
  tillg\u00e5 p\u00e5 andra st\u00e4llen. Det verkar ist\u00e4llet som om man fr\u00e4mst
  har skrivit ner sina favoritvisor \u2013 \\\"gr\u00e4dden\\\" \u2013 och att de
  flesta verkligen valde ut vad man skulle skriva i sin bok. Den skulle ju ocks\u00e5
  bli ett minne fr\u00e5n beredskaps-tiden, ett dokument att sj\u00e4lv l\u00e4sa
  n\u00e5gon g\u00e5ng i framtiden och kanske visa andra.\\n\\nN\u00e4r du vid cirka
  50 \u00e5r\\ntill byr\u00e5l\u00e5dan g\u00e5r\\nT\u00e4nk d\u00e5 p\u00e5 kommisstoken\\nsom
  skrev i denna boken (GOBIV TB 179)\\n\\nD\u00e4remot \u00e4r det v\u00e4l mycket
  troligt att man ocks\u00e5 sj\u00f6ng andra visor under tiden i flottan, visor som
  aldrig skrevs ner i b\u00f6ckerna, visor som kanske ans\u00e5gs f\u00f6r fula eller
  f\u00f6r vanliga. Musiketnologen M\u00e4rta Ramsten har i \\\"Folkmusikboken\\\"
  skrivit om folklig viss\u00e5ng. Hon ber\u00f6r ocks\u00e5 de handskrivna visb\u00f6ckerna,
  och menar att deras urval inte alltid inneh\u00e5ller de visor som man sj\u00f6ng
  ofta (1980:128).\\n\\nKommissb\u00f6ckernas repertoar visar ocks\u00e5 hur flottisterna
  verkligen medvetet valde bland ett allt st\u00f6rre utbud av schlager och visor
  som fanns att tillg\u00e5 under den aktuella tiden. De gamla visorna, en g\u00e5ng
  publicerade i skillningtryck, och kanske sjungna ombord p\u00e5 segelfartyg, h\u00e4ngde
  med under hela perioden. Det hindrade ingen fr\u00e5n att ta till sig nya sj\u00f6mansvalser
  eller schlagers. Kapten Sigurd Sternvall som p\u00e5 1920-talet samlade in traditionella
  sj\u00f6mansvisor var synnerligen f\u00f6rargad p\u00e5 de nya sj\u00f6mansvalserna
  och andra \u201dkommersiella\u201d visor. Han menade att de inte hade n\u00e5got
  med sj\u00f6mansdiktning att g\u00f6ra (Lantz & Jonsson 1980:16). \u00c4ven om det
  inte var sj\u00f6m\u00e4nnen sj\u00e4lva som hade diktat dessa visor, s\u00e5 verkar
  det ju inte som om de ratade dem f\u00f6r den saken. Tv\u00e4rtom f\u00f6rekommer
  t.ex. \u201dSl\u00e4ckta fyrar\u201d och \u201dAxel \u00d6man\u201d i flera visb\u00f6cker
  tillsammans med mer traditionella sj\u00f6mansvisor. Visb\u00f6ckerna rymmer s\u00e5v\u00e4l
  kontinuitet som f\u00f6r\u00e4ndring. Men de texter som skrevs ner st\u00e4mde oftast
  v\u00e4l in i den \u00e4ldre traditionen, b\u00e5de till form och inneh\u00e5ll.
  Detta kan\\n\\nman ocks\u00e5 se p\u00e5 s\u00e4ttet att skriva kommissvisor till
  k\u00e4nda melodier och p\u00e5 urvalet av schlagers och Taubevisor. Underg\u00e5ngstemat
  i \\\"Blue Bird av Hull\\\" st\u00e4mde t.ex. v\u00e4l \u00f6verens med de gamla
  ber\u00e4ttande sj\u00f6mansvisorna, men Taubes mollmelodi k\u00e4ndes m\u00f6jligen
  n\u00e5got fr\u00e4mmande \u2013 kanske var det d\u00e4rf\u00f6r som visan sj\u00f6ngs
  till en durmelodi ist\u00e4llet. Vad h\u00e4nde efter 1940-talet? I materialet finns
  n\u00e5gon enstaka visbok fr\u00e5n 50-talets b\u00f6rjan, men d\u00e4refter verkar
  det inte ha f\u00f6rekommit n\u00e5gra kommissb\u00f6cker.\\n\\nJag har h\u00e4r
  inte gjort n\u00e5gon skillnad p\u00e5 de visb\u00f6cker som har anv\u00e4nts f\u00f6r
  s\u00e5ng och de som har varit en ren \\\"skriftlig\\\" tradition, utan vill ist\u00e4llet
  betrakta kommissb\u00f6ckerna som ett individuellt, men \u00e4nd\u00e5 kollektivt,
  minne fr\u00e5n en speciell tid och milj\u00f6, d\u00e4r den enskilde flottisten
  skrev ner s\u00e5dant som han tyckte om. Visserligen var skrivandet ett tidsf\u00f6rdriv,
  men gjorde man sig besv\u00e4ret att skriva av en text, s\u00e5 betydde den antagligen
  n\u00e5gonting f\u00f6r den som h\u00f6ll i pennan, \u00e4ven om orden var l\u00e5nade.
  M\u00e5nga av visorna som sj\u00f6ngs och skrevs ner av Olof, Rune, Gunnar, Vilhelm,
  och alla de andra unga m\u00e4nnen fr\u00e5n Bohusl\u00e4n, fanns naturligtvis ocks\u00e5
  p\u00e5 andra st\u00e4llen. En del av repertoaren f\u00f6rekom s\u00e4kert ocks\u00e5
  bland b\u00e5de m\u00e4n och kvinnor, men annat \u00e4r mer typiskt f\u00f6r manliga
  milj\u00f6er, t.ex. kommissvisor, en hel del av sj\u00f6mansvisor, de \\\"fula\\\"
  visorna och texter liknande den om \\\"Gl\u00e4djeflickan\\\".\\n\\nDet \u00e4r
  inte visorna i sig som \u00e4r utm\u00e4rkande f\u00f6r de bohusl\u00e4nska flottisternas
  b\u00f6cker. Det \u00e4r ist\u00e4llet urvalet, sammans\u00e4ttningen av repertoaren,
  som \u00e4r speciell f\u00f6r m\u00e4nniskorna, tiden och milj\u00f6n. D\u00e4ri
  kan man se att b\u00e5ten, flickan och hemmet verkar ha varit av st\u00f6rsta vikt
  f\u00f6r de unga bohusl\u00e4nningarna. M\u00f6jligen skulle man\\n\\nkunna s\u00e4ga
  att det \u00e4r samma tema som \u00e5terkommer i \u201dtro, hopp och k\u00e4rlek\u201d,
  n\u00e4r man ser bilden av ankaret, korset och hj\u00e4rtat.\\n\\nSj\u00f6mansanknytningen
  \u00e4r ocks\u00e5 det mest sl\u00e5ende intrycket n\u00e4r man bl\u00e4ddrar i
  b\u00f6ckerna, b\u00e5de i texter och teckningar. De v\u00e4rnpliktigas bakgrund
  och identitet betonas hela tiden. Man vet varifr\u00e5n man kommer och vad man skall
  bli. Redan som ung \u00e4r man ocks\u00e5 medveten om alla de faror som lurar l\u00e4ngs
  v\u00e4gen \u2013 b\u00e5de till sj\u00f6ss och p\u00e5 landbacken, i m\u00f6tet
  med havet respektive kvinnan. Tankarna g\u00e5r till Evert Taubes f\u00f6rord och
  koncentrat av visan om \u201dFritiof Andersson\u201d: \u201dHavet, om \u00e4n aldrig
  s\u00e5 sk\u00f6nt att sk\u00e5da, d\u00f6ljer under en ofta leende yta m\u00e5ngen
  risk f\u00f6r en sj\u00f6man. Kvinnan \u00e4r \u2013 s\u00e5 l\u00e4nge hon befinner
  sig p\u00e5 land \u2013 i det stycket likt b\u00f6ljan bl\u00e5\u201d (Taube 1978:14).
  Att leva ihop med andra m\u00e4n, med kvinnorna p\u00e5 avst\u00e5nd, tillh\u00f6rde
  ocks\u00e5 sj\u00f6manslivet. Men kvinnan tycks av visorna att d\u00f6ma ha haft
  ett stort utrymme i mannens tankar.\\n\\nI Karlskrona fanns ocks\u00e5 en ny v\u00e4rld
  att m\u00f6ta f\u00f6r unga pojkar fr\u00e5n Bohusl\u00e4n, den milit\u00e4ra. I
  visorna betonas kamratskapet, de gemensamma upplevelserna och den nya identiteten
  som en av \u201dpassarna\u201d. Samtidigt f\u00f6rst\u00e4rks gr\u00e4nsen gentemot
  de stamanst\u00e4llda, \u201dkaninerna\u201d och bef\u00e4len. Det man har sv\u00e5rast
  f\u00f6r \u00e4r disciplinen: att n\u00e5gon spr\u00e4tt med fler r\u00e4nder p\u00e5
  uniformen skall komma och s\u00e4tta sig p\u00e5 en. Det var man inte van vid sen
  tidigare, trots att man hade m\u00f6nstrat som \u201dkockjungman\u201d. Olof som
  genast m\u00f6nstrade p\u00e5 en fraktskuta efter v\u00e4rnplikten menade att det
  visserligen var ett slags\\n\\n---\\n\\nUr Rune\u201dRadio\u201d\\nSvenssons visbok.\\n\\ndisciplin
  d\u00e4r ocks\u00e5, men n\u00e4r arbetet var avslutat s\u00e5 var du fri. \\\"Det
  var som flickan sa till direkt\u00f6ren, vet du \u2013 \\\"Dagen den \u00e4r din,
  men natten den \u00e4r min egen\\\". En viss sorts frihet h\u00f6rde till det \\\"civila\\\"
  livet ombord p\u00e5 fraktskutor och fiskeb\u00e5tar, och den skattades h\u00f6gt.
  D\u00e4r slapp sj\u00e4len att \\\"f\u00f6rkrympas av disciplinen\\\", som den gjorde
  n\u00e4r man \\\"m\u00e5ste bliva sj\u00f6man vid marinen\\\".\\n\\nN\u00e4r jag
  bl\u00e4ddrar i visb\u00f6ckerna sl\u00e5s jag av att det ocks\u00e5 \u00e4r s\u00e5
  m\u00e5nga olika sorters texter som finns d\u00e4r. Mannen i visorna, ofta en sj\u00f6man,
  kan ha en oerh\u00f6rd sj\u00e4lvs\u00e4kerhet och stor framg\u00e5ng hos flickorna,
  men han kan lika g\u00e4rna bli bedragen och lurad, eller ratad f\u00f6r n\u00e5gon
  som har finare kl\u00e4der och h\u00f6gre gradbeteckningar. De bohusl\u00e5nska
  m\u00e4nnens visb\u00f6cker fr\u00e5n tiden i flottan inneh\u00e5ller en salig blandning
  av l\u00e4ngtan efter k\u00e4rlek och \u00f6mhet, erotik och \\\"snusk\\\", nostalgi,
  sorg, tragik, empati, vrede, missn\u00f6je, kyla och v\u00e4rme, os\u00e4kerhet
  och st\u00f6ddighet, humor och gl\u00e4dje... Det m\u00e5 h\u00e4nda att de fula
  visorna \\\"ingenstans har varit s\u00e5 popul\u00e4ra som i slutna, manliga kollektiv\\\"
  (Klintberg & Mattsson 1980:31), men de utg\u00f6r bara en del av repertoaren fr\u00e5n
  kommisstiden, \u00e4ven om de inte har skrivits ner i samma utstr\u00e4ckning som
  de har sjungits.\\n\\nDet \u00e4r uppenbart att visb\u00f6ckerna inte inneh\u00e5ller
  de soldats\u00e5nger, som officiellt sj\u00f6ngs inom flottan, inte heller finns
  h\u00e4r n\u00e5gra egentliga verklighetsskildringar av krigen.\\\\(^{12}\\\\) Visb\u00f6ckerna
  \u00e4r d\u00e4remot fyllda med s\u00e5dant som det inte fanns plats f\u00f6r inom
  det officiella milit\u00e4ra livet - dr\u00f6mmar om kvinnor, k\u00e4rlek och erotik,
  klagom\u00e5l \u00f6ver maten, drift med bef\u00e4l och disciplin. Visboken blev
  en egen tillflykt \u2013 en tillflykt, som visserligen kunde delas med andra, men
  som aldrig s\u00e5g riktigt likadan ut fr\u00e5n man till man.\\n\\nBlue Bird av
  Hull\\n\\nDet var Blue Bird av Hull, det var Blue Bird en brigg, som med\\nsvikta
  de strumpar stod p\u00e5 \u00f6ver Solten i\\nsn\u00f6storm med nerisad rigg sj\u00e4lva
  julafoton,\\nsjuttiotv\u00e5 Surra svensken till rors! ropar\\nskutanskapten. Han
  \u00e4r karl, han kan draja en\\nspak.* Och Karl Stranne fr\u00e5n Sm\u00f6gen blev
  surrad till\\nrors p\u00e5 Blue Bird som var d\u00f6md att bli vrak.\\n\\nMelodin
  upptecknad efter Sigurd Andersson f. 1919, R\u00e5g\u00e5rdsvik, Skaft\u00f6. Text:
  Evert Taube. Copyright Nordiska Musikf\u00f6rlaget. Tryckt med tillst\u00e5nd av
  Ehrlingf\u00f6rlagen AB.\\n\\nNoter\\n\\n1 Ordet \\\"kommissen\\\" anv\u00e4nds
  av m\u00e5nga f.d. flottister som ben\u00e4mning p\u00e5 tiden i det milit\u00e4ra.
  Det kommer ursprungligen fr\u00e5n tyskans Kommiss, vilket kan betyda enkel kostym,
  \u00e5t soldater utdelade varor eller det milit\u00e4ra (Nationalencyklopedin, 11,
  1993:197)\\n\\n2 \\\"Strana\\\" \u00e4r ett dialektalt uttryck f\u00f6r den lilla
  hamnen i Halsb\u00e4ck, eg. stranden.\\n\\n3 \\\"\u00c5lvsborgsvisan\\\" skrevs
  ursprungligen i b\u00f6rjan av 1880-talet av August Wilhelm Thorsson, bleckerif\u00f6rm\u00e4n
  p\u00e5 G\u00e5rda fabriker i G\u00f6teborg. Han hade som 15-\u00e5ring l\u00e4st
  en roman fr\u00e5n Venedig och tyckte att ordet gondol klingade vackert, d\u00e4rf\u00f6r
  placerade han en s\u00e5dan i \u00c5lvsborgsfjorden (L\u00e5t och visa 1, 1972:15).
  Melodin anv\u00e4nds ocks\u00e5 tillsammans med anspelningar p\u00e5 den ursprungliga
  texten i n\u00e5gra andra specialskrivna visor med motiv fr\u00e5n \\\"kommisslivet\\\".\\n\\n4
  I kommissb\u00f6ckerna finns t.ex. n\u00e4stan inga texter ur \\\"Den gyllene fredens
  ballader\\\" (1924), \\\"Br\u00f6llopsballader och rosenrim\\\" (1925) eller \\\"K\u00e4rlekvisor
  och Sj\u00f6ballader\\\" (1927), vars visor kanske \u00e4r n\u00e5got mer lyriska
  och h\u00f6gtidliga till sin karakt\u00e4r, och d\u00e4r flera har anknytning till
  ostkusten.\\n\\n5 \\\"Lasse\\\" = finkan.\\n\\n6 Melodin till \\\"Barndomshemmet\\\"
  anv\u00e4ndes \u00e4ven till flera av visorna i de beredskapsb\u00f6cker som Mats
  Rehnberg har skrivit om (Rehnberg 1967:210-213). Ursprungstexten f\u00f6rekommer
  ocks\u00e5 i visb\u00f6ckerna fr\u00e5n flottan s\u00e5 tidigt som 1916. Den skrevs
  av \\\"Karl-Evert\\\" till en amerikansk melodi och lancerades av Ernst Rolf p\u00e5
  Berns under f\u00f6rsta v\u00e4rldskriget (Ericson 1968:9).\\n\\n7 Pansarpl\u00e5ten
  = namn p\u00e5 de stora pl\u00e5tar varp\u00e5 maten serverades i flottan. I andra
  b\u00f6cker b\u00f6rjar visan ist\u00e4llet \\\"D\u00e4r som pansarb\u00e5ten glider
  fram f\u00f6r vinden / och d\u00e4r m\u00f6rkgr\u00e5tt vatten lyser bakom den ...\\\"
  (GOBIV TB 111a).\\n\\n8 Denna dikt finns i flertalet visb\u00f6cker fr\u00e5n 1940-talet.\\n\\n9
  Visan finns ocks\u00e5 insjungen av Gunnar Andr\u00e9asson p\u00e5 grammofonskivan
  \\\"Visor fr\u00e5n Tj\u00f6rn och Kl\u00e4desholmen\\\". Folklig s\u00e5ng och
  musik i V\u00e4stsverige 1. Tonart. Musik i V\u00e4st.\\n\\n10 Enligt en uppgift
  i P.A. Fogelstr\u00f6ms \\\"Ok\u00e4nt Stockholm\\\", skulle Eiravisan ha skrivits
  av Stockholmsbohemen och folkdiktaren Kalle Broling. \\\"Kurhuset\\\" Eira l\u00e5g
  vid Hantverkargatan. Det \u00f6ppnades 1816 och revs 1955 (Fogelstr\u00f6m 1967:167).
  Visan sj\u00f6ngs dessutom av traditionsb\u00e4raren och sj\u00f6mannen Axel K\u00e4ck
  fr\u00e5n Limhamn i Sk\u00e5ne i dokument\u00e4rfilmen \\\"Visor fr\u00e5n de sju
  haven\\\", som spelades in av TV 1967.\\n\\n11 Text av Astrid Gullstrand. Visan
  f\u00f6rekommer i flera b\u00f6cker.\\n\\nDen unders\u00f6kta perioden str\u00e4cker
  sig \u00f6ver tv\u00e5 v\u00e4rldskrig, men h\u00e4r finns bara undantagsvis n\u00e5gra
  texter med anknytning till dagsaktuella h\u00e4ndelser, t.ex. en dikt om Ulvens
  f\u00f6rl\u00e4sning (GOBIV TB 179) och den citerade sj\u00f6mansvisan av Christian
  Dahlin. Det n\u00e4rmaste man kommer kriget \u00e4r annars en ganska sentimental
  visa som handlar om \\\"Mor Annas ende son\\\", som blir borta p\u00e5 havet efter
  ett tyskt granatanfall (bl.a. i GOBIV TB 130).\\n\\nOtryckta k\u00e4llor\\n\\nMusik
  i V\u00e4st - GOBIV. G\u00f6teborg och Bohusl\u00e4n i visans uppteckningar 1978-1994.
  Textb\u00f6cker (TB) och bandinspelningar (BA). Svenskt visarkiv, Stockholm.\\n\\nLitteratur\\n\\nBj\u00f6rklund,
  Anders & Nordlinder, Gunnar 1980: Visor & verser fr\u00e5n haven. Stockholm.\\nEdstr\u00f6m,
  Olle 1989: Schlager i Sverige 1910-1940. G\u00f6teborg. (Skrifter fr\u00e5n Musikvetenskap,
  G\u00f6teborgs Universitet 21.)\\nEricson, Uno Myggan 1989: Myggans n\u00f6jeslexikon
  1. H\u00f6gan\u00e4s \u2014 1968: Ernst Rolf. Stockholm.\\nFlottans m\u00e4n ber\u00e4ttar
  1979: Sj\u00f6historisk \u00e5rsbok 1977-1978. F\u00f6reningen Sveriges Sj\u00f6fartsmuseum
  i Stockholm.\\nFogelstr\u00f6m, Per Anders 1967: Ok\u00e4nt Stockholm. En antologi.
  Stockholm.\\nKlintberg, Bengt af & Mattsson, Christina 1980: Fula visboken. (FIBs
  Lyrikklubbs bibliotek nr 196.)\\nLantz, Monica & Jonsson, Bengt 1980: Sj\u00f6mansvisor
  i urval av Svenskt visarkiv. (Folkliga visor utgivna och kommenterade av Svenskt
  visarkiv.) Stockholm.\\nL\u00e5t och visa 1 1972. Information fr\u00e5n Samfundet
  f\u00f6r visforskning. Stockholm.\\nNationalencyklopedien 11 1993: H\u00f6gan\u00e4s.\\nNordstr\u00f6m,
  Annika 1993: Visor fr\u00e5n Lysekilstrakten. Folklig s\u00e5ng och musik i V\u00e4stsverige.
  G\u00f6teborg och Lysekil. (Musik i V\u00e4st. Skriftserien 6.)\\n\\nRamsten, M\u00e4rta
  1980: \\\"Jag vet s\u00e5 dejlig en ros\\\". Om folklig viss\u00e5ng. I *Folkmusikboken*.
  Red. Ling, Ramsten & Ternhag. Stockholm.\\n\\nRehnberg, Mats 1967: *Vad skall vi
  g\u00f6ra med de blanka gev\u00e4r*. Femton kapitel ur soldaternas liv. Stockholm.\\n\\nTaube,
  Evert 1973 (f\u00f6rsta utg. 1929): *Fritiof Anderssons visbok*. Stockholm.\\n\\n\u2014
  1967: *Sol och v\u00e5r*. Stockholm.\\n\\n\u2014 1978: *S\u00e5 l\u00e4nge skutan
  kan g\u00e5*. Stockholm.\\n\\nArtikeln har ocks\u00e5 tryckts i Ljusg\u00e5rden;
  Meddelanden fr\u00e5n Etnologiska institutionen G\u00f6teborgs universitet, 1994
  nr 14.\""]'
