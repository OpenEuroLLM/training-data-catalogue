  inom LSS-omr\u00e5det 9 kommuner.\\n\\nResultatdiskussion\\n\\nResultatet av \u00e5rets
  enk\u00e4t om inf\u00f6randet av IBIC, och j\u00e4mf\u00f6relser med tidigare \u00e5rs
  resultat \u2013 vad s\u00e4ger det om l\u00e4get f\u00f6r inf\u00f6randet av IBIC
  i kommunerna?\\n\\nFortsatt fler som inf\u00f6r IBIC\\n\\nUtifr\u00e5n enk\u00e4tresultatet
  och j\u00e4mf\u00f6relser med tidigare \u00e5r \u00e4r det allt fler som valt att
  inf\u00f6ra IBIC inom samtliga omr\u00e5den. Vid \u00e5rsskiftet 2021 - 2022 har
  n\u00e4stan tv\u00e5 av tre kommuner inf\u00f6rt eller p\u00e5b\u00f6rjat inf\u00f6rande
  inom samtliga omr\u00e5den. N\u00e4stan nio av tio kommuner uppger att de avser
  att inf\u00f6ra IBIC. Detta v\u00e4rde har varit relativt stabilt de senaste tre
  \u00e5ren.\\n\\n\u00c4ven om \u00e4ldreomr\u00e5det \u00e4r det omr\u00e5de d\u00e4r
  flest p\u00e5b\u00f6rjat inf\u00f6rande, och d\u00e4r man kommit l\u00e4ngst i inf\u00f6randet,
  har skillnaderna mot funktionshinderomr\u00e5det sedan IBIC lanserades 2016 minskat
  f\u00f6r varje \u00e5r.\\n\\nMed undantag f\u00f6r de st\u00f6rsta kommunerna 23
  , d\u00e4r andelen kommuner som inf\u00f6rt \u00e4r n\u00e5got h\u00f6gre \u00e4n
  \u00f6vriga kommunstorlekar finns det inga statistiskt s\u00e4kerst\u00e4llda skillnader
  mellan olika grupper av kommuner 24 .\\n\\nPandemieffekt?\\n\\nUtifr\u00e5n j\u00e4mf\u00f6relser
  \u00f6ver tid kan vi se att takten f\u00f6r inf\u00f6rande i de flesta delprocesser
  vi j\u00e4mf\u00f6rt var h\u00f6gre mellan 2018 och 2019 \u00e4n perioden 2019 till
  2021. Enk\u00e4ten kan d\u00e4remot inte ge svar p\u00e5 vad det beror p\u00e5.
  En orsak till avmattning kan vara pandemin vilket har inburit att kommunerna beh\u00f6vt
  g\u00f6ra omprioriteringar, haft anstr\u00e4ngda personalsituationer etc. Om detta
  \u00e4r ett trendbrott eller en tillf\u00e4llig nedg\u00e5ng kommer framtida enk\u00e4tunders\u00f6kningar
  ge svaret p\u00e5.\\n\\nAnv\u00e4nda IBIC-data f\u00f6r utveckling\\n\\nDet omr\u00e5de
  d\u00e4r vi inte ser n\u00e5gon utveckling \u00e4r f\u00f6r fr\u00e5gan om man sammanst\u00e4llt
  uppgifter (aggregerat individuppgifter p\u00e5 gruppniv\u00e5) fr\u00e5n IBIC och
  anv\u00e4nt f\u00f6r exempelvis verksamhetens systematiska kvalitetsarbete. H\u00e4r
  anges i kommentarer i enk\u00e4ten bland annat att orsaken \u00e4r att man inte
  har m\u00f6jlighet att f\u00e5 ut uppgifter fr\u00e5n systemen, att man inte har
  tillr\u00e4ckligt med dokumenterade uppgifter f\u00f6r att f\u00e5 ett underlag
  f\u00f6r sammanst\u00e4llningar eller att man inte har kompetens eller resurser
  f\u00f6r det.\\n\\nUnder 2020\u20132021 genomf\u00f6rdes tillsammans med fyra kommuner
  ett projekt d\u00e4r Sveriges kommuner och regioner (SKR), regionala st\u00f6d-
  och samverkansstrukturer (RSS) och Socialstyrelsen 25 st\u00f6ttade verksamheterna
  att arbeta med individbaserad systematisk uppf\u00f6ljning med dokumentation utifr\u00e5n\\n\\n23
  Avser kommuner med mer \u00e4n 70 000 inv\u00e5nare.\\n\\n24 Se bilaga 6 f\u00f6r
  indelning av kommuner i storleksgrupper.\\n\\n25 SKR, RSS och Socialstyrelsen utg\u00f6r
  tillsammans med andra myndigheter partnerskapet f\u00f6r kunskapsstyrning inom socialtj\u00e4nsten:
  Partnerskap f\u00f6r kunskapsstyrning - Socialstyrelsen\\n\\nIBIC. Erfarenheterna
  fr\u00e5n detta projekt har lett till att SKR och Socialstyrelsen h\u00f6sten 2022
  erbjuder en utbildning i individbaserad systematisk uppf\u00f6ljning f\u00f6r en
  bredare grupp. 26\\n\\nVerksamhetssystem - b\u00e5de hinder och framg\u00e5ngsfaktor\\n\\nEtt
  vanligt hinder som \u00e5terkommer i kommentarerna f\u00f6r att p\u00e5b\u00f6rja
  inf\u00f6rande eller att komma vidare med implementering eller sammanst\u00e4llningar
  \u00e4r verksamhetssystemen. Antingen saknar man ett verksamhetssystem som \u00e4r
  anpassat efter IBIC, man avvaktar ny upphandling eller att verksamhetssystemet inte
  har funktioner f\u00f6r sammanst\u00e4llning av dokumentation.\\n\\nSamtidigt anges
  att inf\u00f6randet av nytt verksamhetssystem bidrar till inf\u00f6randet av IBIC,
  och att det kan bidra till strukturen och f\u00f6rst\u00e5elsen f\u00f6r arbetss\u00e4ttet.\\n\\nHur
  l\u00e5ngt inf\u00f6randet kommit p\u00e5verkar effekten av IBIC?\\n\\nEnligt Myndigheten
  f\u00f6r v\u00e5rd- och omsorgsanalys (MYVA) utv\u00e4rdering av IBIC verkar de
  t\u00e4nkta f\u00f6rdelarna med arbetss\u00e4ttet \u00e4n s\u00e5 l\u00e4nge bara
  realiserats i begr\u00e4nsad omfattning. Utv\u00e4rderingen anger som en m\u00f6jlig
  f\u00f6rklaring att IBIC i m\u00e5nga fall inte \u00e4r ett etablerat arbetss\u00e4tt
  \u00e4nnu, att IBIC inte alltid inf\u00f6rs fullt ut och att arbetss\u00e4ttet anv\u00e4nds
  p\u00e5 olika s\u00e4tt i olika delar av landet Andra faktorer som skulle kunna
  f\u00f6rklara att man i kommuner inte upplever sig f\u00e5 stora effekter av inf\u00f6randet
  \u00e4r att IBIC ofta saknar tillr\u00e4ckligt st\u00f6d fr\u00e5n kommunernas verksamhetssystem
  samt att arbetss\u00e4ttet kr\u00e4ver mycket arbete och engagemang under inf\u00f6randet
  och tar l\u00e5ng tid att f\u00e5 p\u00e5 plats. 27\\n\\nResultatet p\u00e5 de fr\u00e5gor
  i v\u00e5r enk\u00e4t som handlar om vad man g\u00f6r utifr\u00e5n IBIC i olika
  delar av processen visar att inf\u00f6randet kommit olika l\u00e5ngt i olika delar,
  och att anv\u00e4ndning av och dokumentation utifr\u00e5n IBIC i genomf\u00f6rande
  och uppf\u00f6ljning p\u00e5 m\u00e5nga h\u00e5ll inte kommit lika l\u00e5ngt som
  myndighetsut\u00f6vning. J\u00e4mf\u00f6relser med tidigare \u00e5r visar \u00e4ven
  att gapet f\u00f6r hur l\u00e5ngt man kommit i inf\u00f6randet har \u00f6kat mellan
  handl\u00e4ggare och utf\u00f6rare.\\n\\nSammantaget inneb\u00e4r det att det i
  m\u00e5nga kommuner saknas uppgifter 28 om genomf\u00f6randet och resultatet f\u00f6r
  individen. Utan uppgifter fr\u00e5n t.ex. genomf\u00f6rande och uppf\u00f6ljning
  kan det vara sv\u00e5rt att avg\u00f6ra hur st\u00f6det motsvarar individens behov
  och m\u00e5l. Saknas dessa uppgifter minskar f\u00f6ruts\u00e4ttningarna f\u00f6r
  individbaserad systematisk uppf\u00f6ljning, som i sin tur utg\u00f6r underlag f\u00f6r
  kvalitets- och utvecklingsarbete. Att man \u00e4nnu inte anv\u00e4nt individbaserade
  uppgifter utifr\u00e5n IBIC f\u00f6r sammanst\u00e4llningar kan vara en del av f\u00f6rklaringen
  till att MYVA anger att kommuner inte \u00e4nnu f\u00e5tt ut de potentiella positiva
  effekterna av IBIC.\\n\\n26 Utbildning individbaserad systematisk uppf\u00f6ljning
  kopplat till IBIC | SKR\\n\\n27 Effekten av IBIC | V\u00e5rd- och omsorgsanalys
