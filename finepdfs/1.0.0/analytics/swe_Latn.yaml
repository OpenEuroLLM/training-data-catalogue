  p\u00e5 enk\u00e4ten!\"", "\"PRODUKTDATABLAD\\n\\nJordarmeringsn\u00e4t & fiberduk\\n\\nF\u00f6r
  att g\u00f6ra ett bra anl\u00e4ggningsarbete som h\u00e5ller i m\u00e5nga \u00e5r
  beh\u00f6vs grundl\u00e4ggande tillbeh\u00f6r till markplattor och murar. Armeringsn\u00e4t
  hj\u00e4lper till att h\u00e5lla jordmassor p\u00e5 plats vid murbyggen och fiberduk
  separerar jord- och grusmaterial men hj\u00e4lper ocks\u00e5 till att f\u00f6rst\u00e4rka
  terassen/ underbyggnaden. Dessa produkter \u00e4r n\u00f6dv\u00e4ndiga om man vill
  ha ett perfekt och h\u00e5llbart resultat.\\n\\nJordarmeringsn\u00e4t\\n\\nBarkduk\\n\\nFiberduk\\n\\nArmerad
  v\u00e4vd markstensduk\"", "\"KUNGSLEDEN\\n\\nVi \u00e4r n\u00e5gra stycken i flygklubben
  som skulle fylla 60 \u00e5r under sommaren, bl. a. min Vasaloppspolare \u00c5ke
  Karlsson, och detta borde ju firas p\u00e5 ett speciellt s\u00e4tt. \u00c5ke \u00e4r
  ju alltid upplagt f\u00f6r kraftprov och \u00e4ventyr, s\u00e5 jag kontaktade honom
  p\u00e5 f\u00f6rsommaren och fr\u00e5gade om han hade lust att vandra Kungsleden
  fr\u00e5n Abisko till Nikkaluokta i b\u00f6rjan av augusti. Det var en gammal dr\u00f6m,
  som jag n\u00e4rt efter tre tidigare bes\u00f6k i Abisko med familjen, och nu skulle
  vandringen kanske \u00e4ntligen bli av. Inte \u00f6verraskande accepterade  \u00c5ke  p\u00e5
  st\u00e5ende fot, och eftersom han fyllde \u00e5r den 29 juli skulle tiden passa
  honom perfekt.\\n\\n\u00c5ke \u00e4r en erfaren vandrare, men han hade inte pr\u00f6vat
  p\u00e5 fj\u00e4llen tidigare, utan det hade mest blivit l\u00e5nga utflykter efter
  Sk\u00e5neleden. Sj\u00e4lv hade jag mest gjort dagsutflykter i fj\u00e4llen, men
  aldrig veckol\u00e5nga vandringar d\u00e4r all utrustning m\u00e5ste b\u00e4ras
  med. Det mesta i utrustningsv\u00e4g hade jag dock fr\u00e5n bl. a. en kanotutflykt
  med min son Anders f\u00f6r mer \u00e4n 20 \u00e5r sedan. F\u00f6r s\u00e4kerhets
  skull bokade jag i god tid in oss p\u00e5 Svenska Turistf\u00f6reningens anl\u00e4ggning
  i Abisko mellan den 31 juli och 2 augusti. Av erfarenhet visste jag att det var
  mycket sv\u00e5rt att f\u00e5 logi vid denna tid. Abisko har ju blivit allt popul\u00e4rare
  under \u00e5rens lopp och detta \u00e5r firade turistf\u00f6reningen stationens
  50-\u00e5rsjubileum. Det var dock inte sv\u00e5rt att f\u00e5 plats, och tanken
  var att vi under n\u00e5gra dagar skulle bekanta oss med terr\u00e4ngen innan vi
  gav oss iv\u00e4g p\u00e5 vandringen mellan Abisko och Nikkaluokta.\\n\\nF\u00f6rberedelser\\n\\nEftersom
  \u00c5ke alltid g\u00e5r vetenskapligt till v\u00e4ga n\u00e4r det g\u00e4ller projekt
  fick han till uppgift att ta reda p\u00e5 vilken utrustning som vi skulle beh\u00f6va.
  I februari hade vi ju \u00e5kt Vasaloppet tillsammans och \u00c5ke\\n\\nhade inf\u00f6r
  loppet gjort planeringen och skaffat den absolut b\u00e4sta utrustning som gick
  att f\u00e5 p\u00e5 marknaden. Under loppet hade vi haft stor nytta av planeringen
  och kunde utan st\u00f6rre sv\u00e5righeter avverka de nio milen fr\u00e5n S\u00e4len
  till Mora. Att vandra 11 mil p\u00e5 sommaren skulle d\u00e4rf\u00f6r inte vara
  n\u00e5gon om\u00f6jlig uppgift, men vi hade som sagt ingen st\u00f6rre erfarenhet
  av fj\u00e4llvandringar tidigare. Det f\u00f6rsta som beh\u00f6vdes var ju ryggs\u00e4ck
  och \u00c5ke rekommenderade definitivt en ny och modern s\u00e5dan i st\u00e4llet
  f\u00f6r min 22 \u00e5r gamla. Jag bes\u00f6kte b\u00e5de Intersport  och Stadium
  och provade de mest moderna och avancerade ryggs\u00e4ckarna. De l\u00e5g alla i
  en prisklass mellan tv\u00e5 till tre tusen kronor men ingen k\u00e4ndes s\u00e5
  bra som min gamla Hagl\u00f6fss\u00e4ck. \u00c5ke hade under mellantiden g\u00e5tt
  in p\u00e5 Internet och f\u00e5tt packningslistor f\u00f6r vandring efter Kungsleden
  och dessa listor inneh\u00f6ll det mesta f\u00f6r \u00f6verlevnad.\\n\\nTungt blev
  det\\n\\nN\u00e5gra dagar f\u00f6re avresan b\u00f6rjade jag l\u00e4gga upp den
  utrustning som skulle beh\u00f6vas och det visade sig att det blev ett mindre berg
  att packa. Den tyngsta attiraljen var t\u00e4ltet, ett gammalt Fj\u00e4llr\u00e4vent\u00e4lt
  fr\u00e5n b\u00f6rjan av 80-talet, och sedan var det Trangiak\u00f6k med tillh\u00f6rande
  br\u00e4nsleflaskor, k\u00e4ngor f\u00f6r vandring, vanliga skor och kl\u00e4der
  f\u00f6r alla v\u00e4derf\u00f6rh\u00e5llanden fr\u00e5n sn\u00f6storm till h\u00f6gsommarv\u00e4rme,
  myggmedel avsett f\u00f6r tropikerna och myggn\u00e4t och all annan rekvisita som
  ans\u00e5gs vara absolut n\u00f6dv\u00e4ndig. Vidare skulle ju mat och framf\u00f6r
  allt dryck medtagas f\u00f6r hela perioden. N\u00e4r jag f\u00f6rs\u00f6kte packa
  det berg av prylar som tornat upp sig i f\u00f6rr\u00e5det uppstod  genast sv\u00e5righeter.
  Visserligen hade ryggs\u00e4cken kapacitet f\u00f6r 70 liter men den blev snart
  spr\u00e4ngfylld och v\u00e4gde \u00f6ver 35 kg. Det skulle bli en om\u00f6jlig
  uppgift att sl\u00e4pa med sig allt detta i terr\u00e4ngen, s\u00e5 nu g\u00e4llde
  det att prioritera p\u00e5 l\u00e4mpligt s\u00e4tt. T\u00e4ltet spolades och det
  mesta av kl\u00e4derna samt s\u00e5dana udda saker som specialverktyg f\u00f6r att
  suga ut ormgift, knivslip mm. Efter flera ompackningar kom jag slutligen ned till
  n\u00e5gonstans \u00f6ver 25 kg. Ryggs\u00e4cken gick nu att b\u00e4ra, men det
  fanns ingen back-up vad det g\u00e4llde kl\u00e4der. Ett par l\u00e5nga byxor att
  resa i, ett par korta plus en T-shirt och n\u00e5gra kort\u00e4rmade skjortor, ett
  minimum av underkl\u00e4der, Fj\u00e4llr\u00e4venjacka, tre par vandringsstrumpor
  var det hela i kl\u00e4dv\u00e4g. Efter \u00f6verv\u00e4gande \u00e5kte ocks\u00e5  ett
  par joggningsskor ner som alternativ till mina 30 \u00e5r gamla vandringsk\u00e4ngor
  fr\u00e5n USA.\\n\\nTrots alla f\u00f6rberedelser k\u00e4ndes det stort att ge sig
  av upp till Abisko och tankarna kretsade ofta kring fr\u00e5gan om man \u00f6ver
  huvud taget kunde klara av en s\u00e5dan h\u00e4r strapats.  Hur kan man bli s\u00e5
  tokig att man frivilligt ger sig in p\u00e5 ett stolleprov n\u00e4r man i st\u00e4llet
  kunde ligga p\u00e5 badstranden eller g\u00f6ra sm\u00e5 utflykter till Danmark.
  Att st\u00e4lla in det hela var dock om\u00f6jligt eftersom det vid det h\u00e4r
  laget hade skr\u00e4vlats en hel del om vandringen och g\u00e5tt prestige i hela
  projektet.\\n\\nDet kritiska datumet n\u00e4rmade sig snabbt, i mitt tycke kanske
  alltf\u00f6r snabbt.  Eftersom \u00c5ke skulle fira sitt jubileum den 29 juli best\u00e4mde
  vi oss f\u00f6r att f\u00f6rs\u00f6ka komma iv\u00e4g redan dagen efter och flyga
  s\u00e5 l\u00e5ngt det gick. V\u00e5r Cessna 182 RG med registrering SE-IBC skulle
  anv\u00e4ndas och jag b\u00f6rjade g\u00f6ra f\u00e4rdplanering och l\u00e4gga in
  hela routen i min Garmin 195. En mellanlandning skulle beh\u00f6vas och \u00d6rnsk\u00f6ldsvik
  bed\u00f6mdes ligga strategiskt till f\u00f6r tankning. Det \u00e4r ju ocks\u00e5
  en mindre flygplats utan allt det securityel\u00e4nde som man idag uts\u00e4tts
  f\u00f6r p\u00e5 st\u00f6rre flygplatser.\\n\\nDag1,  VFR ESMH \u2013 ESNQ\\n\\nVid
  lunchtid den trettionde tr\u00e4ffades vi p\u00e5 H\u00f6gan\u00e4s flygplats och
  b\u00f6rjade packa in ryggs\u00e4ckarna som ju var v\u00e5rt enda bagage f\u00f6rutom
  alla flygkartor som v\u00e4gde n\u00e4stan lika mycket. Det var dock stor skillnad
  fr\u00e5n tidigare resor med familjen, d\u00e4r bagaget mer antyder att det r\u00f6r
  sig om en emigration \u00e4n en semesterresa.\\n\\nEfter tankning och noggrann daglig
  tillsyn av planet var det dags att aktivera de b\u00e5da GPS-erna och ge sig iv\u00e4g.
  En Garmin 195 \u00e4r placerad \u00f6ver instrumentbr\u00e4dan och p\u00e5 den l\u00e5g
  nu routen inlagd med aktivt leg \u00e5tergivet som ett gr\u00f6vre streck p\u00e5
  en f\u00e4rgkarta som t\u00e4ckte hela displayen. Den andra andra GPS-en, en Garmin
  155XL, som \u00e4r panelinstallerad och IFR-godk\u00e4nd , anv\u00e4ndes mer f\u00f6r
  fri navige- ring. Den \u00e4r kopplad till autopiloten och inst\u00e4lld f\u00f6r
  att l\u00e4mna information om groundspeed, tider och s\u00e5 vidare till varje v\u00e4gpunkt.
  Det har ju blivit s\u00e5 att man numera i praktiken flyger med GPS som navigationsinstrument
  och allt annat, med undantag av inflygningshj\u00e4lpmedlen, anv\u00e4nds enbart
  som back-up.\\n\\nB\u00e5da familjerna vinkades av och IBC lyfte 11.38 utan sv\u00e5righeter
  fr\u00e5n bana 14. V\u00e4dret var mer eller mindre CAVOK hela str\u00e4ckan upp
  till Kiruna men n\u00e5got disigt. F\u00e4rdplanen aktiverades med Malm\u00f6 Control
  och vi fick stiga till 2.500 fot i Malm\u00f6 TMA \u00f6ver \u00c4ngelholms kontrollzon.
  Autopiloten kopplades in och \u00c5ke packade upp de goda sandwichar han hade f\u00f6rberett
  och de intogs med litet vatten. Genom att vi hade aktivt bullerd\u00e4mpande headsets
  av m\u00e4rket Boose installerade, kunde vi l\u00e4tt konversera utan att st\u00f6ras
  n\u00e4mnv\u00e4rt av motorbullret. Det var mycket varmt ombord s\u00e5 vi hade
  f\u00f6rsett oss med ett rikligt vattenf\u00f6rr\u00e5d och tv\u00e5 st. \\\"ready
  one\\\" f\u00f6r att inte n\u00e5gon olycka skulle intr\u00e4ffa p\u00e5 v\u00e4gen.
  F\u00f6rsta v\u00e4gpunkt var NDB-fyren KBG utanf\u00f6r Karlborg. Den ligger p\u00e5
  ett avst\u00e5nd av 152 NM fr\u00e5n H\u00f6gan\u00e4s och passerades  12.45. Diset
  blev nu n\u00e5got v\u00e4rre och vi hade en molnbas p\u00e5 ungef\u00e4r 3.000
  fot men den gav inga sv\u00e5righeter. Vi passerade NDB-fyren EN vid \u00d6rebro
  och VORfyren BOR vid Borl\u00e4nge. Dis och moln var nu borta och sikten var o\u00e4ndlig.
  Terr\u00e4ngen mellan\\n\\nDen nya H\u00f6gakustenbron \u00e4r ett osvikligt landm\u00e4rke\\n\\nBorl\u00e4nge
  och Sundsvall \u00e4r n\u00e5got h\u00f6gre och vi steg till 3.500 fot som k\u00e4ndes
  mer bekv\u00e4mt. Halvv\u00e4gs till Sundsvall kunde vi se \u00d6stersj\u00f6n och
  Sundsvall Control gav oss f\u00e4rdtillst\u00e5nd genom TMA via VOR-fyren SUN och
  snart fl\u00f6g vi \u00f6ver flygplatsen. Sista legen till OSK i \u00d6rnsk\u00f6ldsvik
  \u00e4r 68 NM och kl 15.23 landade vi p\u00e5 bana 12. Str\u00e4ckan fr\u00e5n H\u00f6gan\u00e4s
  till \u00d6vik \u00e4r 478 NM och den avverkades allts\u00e5 p\u00e5 3 tim 45 min
  vilket \u00e4r acceptabelt.\\n\\nVi tyckte att det hade k\u00e4nts som vibrationer
  fr\u00e5n motorn under den sista timmens flygning och klubbens skicklige tekniker
  Lennart M\u00e5nsson kontaktades f\u00f6r konsultation efter landning. Han var t\u00e4mligen
  s\u00e4ker p\u00e5 att det inte kunde vara n\u00e5got allvarligt och gav oss r\u00e5det
  att magra n\u00e5got h\u00e5rdare upp till Kiruna och vi lugnade oss med detta besked.
  Statoil sk\u00f6ter om tankningen i \u00d6vik men det visade sig att de endast tar
  Statoil carneter och inget annat. Inga vanliga Statoil bensinkort g\u00e4ller och
  inte heller andra carneter eller vanliga kreditkort. Som tur var hade jag tillr\u00e4ckligt
  med kontanter f\u00f6r\\n\\ntankningen men det \u00e4r ju litet f\u00e5nigt att
  beh\u00f6va dr\u00e4nera reskassan f\u00f6r att tanka. En litet b\u00e4ttre flexibilitet
  fr\u00e5n Statoil skulle rekommenderas. \u00d6viks flygplats har en trevlig liten
  kafeteria/restaurang och vi \u00e5t en sen men v\u00e4lkommen lunch innan det var
  dags att forts\u00e4tta  mot Kiruna.\\n\\nUpp i fj\u00e4llv\u00e4rlden\\n\\nStart
  bana 12 kl. 16.40 och v\u00e4nstersv\u00e4ng mot Skellefte\u00e5 med f\u00f6rsta
  v\u00e4gpunkt VOR-fyren SKA som ligger 92 NM fr\u00e5n \u00d6vik. Vi hade nu passerat
  den s.k. H\u00f6ga kusten och valde att flyga p\u00e5 2.500 fot. Sikten var minst
  50 km och n\u00e5got v\u00e4der fanns \u00f6verhuvud taget inte. Magringen gjordes
  nu till peak\\n\\nminus 25 grader och motorn gick faktiskt renare men svaga vibrationer
  fanns kvar. Ibland kan ju detta vara ren inbillning men om man flyger samma plan
  hela tiden \u00e4r det l\u00e4tt att notera alla avvikelser fr\u00e5n det normala.
  (L\u00e5ngt senare uppt\u00e4cktes ett stenskott i propellern, och n\u00e4r detta  slipats
  bort f\u00f6rsvann ocks\u00e5 vibrationerna.)\\n\\nSkellefte\u00e5 passerades och
  nu var det dags f\u00f6r att flyga in i fj\u00e4llomr\u00e5det. Vi hade lagt in
  en v\u00e4gpunkt vid \u00c4lvsbyns flygplats som ligger 62 NM fr\u00e5n Skellefte\u00e5.
  Successivt steg vi upp till 4.500 for eftersom nu terr\u00e4ngen b\u00f6rjade krypa
  n\u00e4rmare. Efter \u00c4lvsbyn f\u00f6ljde vi Lule \u00e4lv ett tag men sedan
  var det Norrl\u00e4nds \u00f6demark till fyren TG i G\u00e4llivare 90 NM bort. En
  n\u00f6dlandning h\u00e4r i myrmarkerna skulle inte vara att rekommendera. Blir
  man inte upp\u00e4ten av myggen har man sannolikt \u00e5tskilliga dagsetapper innan
  man n\u00e5r bebyggda trakter. Vackert \u00e4r det dock och en sikt som vi aldrig
  upplever i s\u00f6dra Sverige. TG ligger n\u00e4ra Dundret och nu hade vi bara 42
  NM kvar till Kiruna. Trots att det \u00e4r \u00f6demark fungerar radiokommunikationerna
  utm\u00e4rkt och hela tiden stod vi i f\u00f6rbindelse med Sundsvall Control. S\u00e5
  snart vi n\u00e4rmade oss Kiruna TMA tog Kirunatornet \u00f6ver och vi fick inflygningstillst\u00e5nd
  till bana 03 via VFR-inflygningspunkten Siska. Det bl\u00e5ste nordv\u00e4stlig
  vind ca 12 knop och vi satte hjulen i marken kl. 18.59. Str\u00e4ckan fr\u00e5n
  \u00d6vik till Kiruna \u00e4r 286 NM och avverkades p\u00e5 2 tim 19 min vilket
  inte \u00e4r d\u00e5ligt med tanke p\u00e5 att vi hade ca 10 knops motvind.\\n\\nIBC
  f\u00f6rankrades nu noggrant och vi satte upp solskydd f\u00f6r att undvika direktstr\u00e5lning
  p\u00e5 avioniken. Vi skulle ju vara borta i kanske en vecka och det kunde ju bli
  hur varmt som helst \u00e4ven uppe i Kiruna. Nu var det dock kyligt eller 12 grader
  vilket var r\u00e4tt stor omv\u00e4xling fr\u00e5n de 30 grader vi vant oss vid
  i Sk\u00e5ne. Det k\u00e4ndes faktiskt riktigt kallt i shorts i bl\u00e5sten och
  vi m\u00e4rkte verkligen att vi var l\u00e5ngt norr om polcirkeln.\\n\\nPackningen
  bestod ju enbart av varsitt kolli som bars p\u00e5 ryggen, s\u00e5 det var ju inte
  s\u00e4rskilt betungande att packa ur planet. V\u00e4l ute ur terminalen hittade
  vi en buss och det visade sig att den skulle g\u00e5 till Abisko och Riksgr\u00e4nsen,
  s\u00e5 snart SAS landat vid halv \u00e5ttatiden. Hur stor tur kan man egentligen
  ha! Vi hade r\u00e4knat med \u00f6vernattning i Kiruna och tidig busstransport till
  Abisko, men nu skulle vi n\u00e5 fram redan f\u00f6rsta kv\u00e4llen. T\u00f6rsten
  hade inte sl\u00e4ckts efter flygningen men en stor stark i restaurangen avhj\u00e4lpte
  det mesta. Vi hade ocks\u00e5 tid f\u00f6r varsin schnitzel innan det var dags att
  kliva in i bussen.\\n\\nN\u00e5gra rum fanns inte p\u00e5 Abisko Turiststation eftersom
  vi hade bokat f\u00f6r efterf\u00f6ljande dag, men b\u00e4ddar i flerb\u00e4ddsrum
  kunde ordnas. Vid tiotiden p\u00e5 kv\u00e4llen var vi framme och kv\u00e4llen avslutades
  i baren \u2013 ett vanligt flygarfenomen.\\n\\nKarl-Erik \u00d6berg\\n\\nVandringen\\n\\nSom
  sagt, f\u00f6rsta dagen slutade i baren. Det kunde nog beh\u00f6vas en pilsner och
  lite peptalk inf\u00f6r strapatserna.\\n\\n\u00c4ven om vi visste att vi var hyggligt
  grundtr\u00e4nade s\u00e5 var ju det h\u00e4r en r\u00e4tt l\u00e5ng tur. N\u00e4stan
  11 mil p\u00e5 5 dagar. Vi visste inte mycket om tillg\u00e4nglig plats i raststugorna
  och befarade att vi i v\u00e4rsta fall skulle f\u00e5 sova p\u00e5 verandan eftersom
  vi valt bort t\u00e4ltet. Det kunde kanske bli f\u00f6r tufft! F\u00f6r s\u00e4kerhets
  skull valde vi en kort f\u00f6rsta dagsetapp: 15 km.\\n\\nTest av utrustning, kontroll
  av skav och bl\u00e5sor, justering av ryggs\u00e4ck, hitta i ryggs\u00e4ck, prova
  myggmedel, anpassa kl\u00e4dsel, det var mycket som skulle g\u00f6ras p\u00e5 den
  f\u00f6rsta etappen.\\n\\nDag 2,  Abisko Turiststation \u2013 Abiskojaurestugorna,
  15 km\\n\\nVi startade mjukt med en l\u00e5ng frukost. Kalle beh\u00f6vde l\u00e5ngsamt
  uppvaknande, f\u00f6r en av v\u00e5ra rumskamrater hade dragit s\u00e5 mycket timmer
  genom rummet att Kalle fick g\u00e5 upp och h\u00e4mta \u00f6ronproppar mitt i natten.
  Sj\u00e4lv hade jag slocknat direkt och sluppit el\u00e4ndet. Redan p\u00e5 kv\u00e4llen
  anade vi f-n, n\u00e4r timmermannens kvinnliga ress\u00e4llskap varnade honom f\u00f6r
  repressalier om han sa ett pip. Vi drog innan det dramat fick sin uppl\u00f6sning.\\n\\nUt
  till den ber\u00f6mda porten mot Kungsleden, fotografering, och sedan iv\u00e4g!\\n\\nV\u00e4dret
  var h\u00e4rligt. Redan vid 10-tiden var det 15\u00ba och soligt. Det k\u00e4ndes
  bra b\u00e5de i rygg och f\u00f6tter och den f\u00f6rsta pausen tog vi vid Andreas
  Groggveranda. (Andrea \u00e4r Kalles hustru och de hade varit h\u00e4r f\u00f6rut).\\n\\nMarschen
  gick vidare l\u00e4ngs jokken som hela tiden underh\u00f6ll med sitt bakgrundsbrus.
  Senare under veckan uppt\u00e4ckte jag att samma brus h\u00f6rdes \u00e4ven utan
  jokk. Det sprang vatten ur varje bergssida, tittade man ner mellan tuvorna kunde
  man se en liten strimma klart, fint vatten. \\\"Instant Raml\u00f6sa\\\" fast godare
  och helt r\u00e4tt tempererat.\\n\\nVi h\u00f6ll r\u00e4tt h\u00f6gt tempo, tyckte
  vi, f\u00f6r vi ville dels vara framme hyggligt tidigt, om det skulle bli tr\u00e4ngsel
  i stugorna inf\u00f6r natten, dels k\u00e4nna p\u00e5 hur vi orkade. Vi startade
  vid 10.00 och 15.00 var vi framme. R\u00e4tt mesigt blev det, men vi hade tagit
  l\u00e5nga pauser och sparat p\u00e5 fotsulor och axlar. Det skulle nog g\u00e5
  att skruva upp effekten en aning.\\n\\nD\u00e4r var gott om plats i Abiskojaurel\u00e4gret
  och efter incheckning tog vi en paus i baren med ett par pilsner. God vana!\\n\\nVi
  slog oss i slang med en tuff vandrerska som hade kokta potatis som standardskaffning
  och hade planer p\u00e5 att g\u00e5 barfota in i Norge \\\"en sv\u00e4ng\\\". Hon
  uppskattade dock lite av v\u00e5r k\u00f6ttgryta med ett glas r\u00f6tt och en whiskeyslurk
  till kaffet.\\n\\nDagen hade varit ganska varm, och vi med, s\u00e5 vi tog ett snabbt
  dopp i sj\u00f6n innan kv\u00e4llen.\\n\\nBerget Kieron som dominerar utsikten \u00e5t
  \u00f6ster vid Abiskojaure\\n\\nSvenska Turistf\u00f6reningens raststugor var det
  perfekta m\u00e5let f\u00f6r varje etapp. Hj\u00e4lpsamma stugv\u00e4rdar, proviant,
  bastu och ett k\u00f6k d\u00e4r man kunde st\u00f6ka omkring p\u00e5 kv\u00e4llen.
  Och en god s\u00e4ng som stod inomhus!\\n\\nAbiskojaure ligger under tr\u00e4dgr\u00e4nsen
  och hela l\u00e4gret omringades av bj\u00f6rksly. Idealiskt f\u00f6r mygg och knott!
  Kalle som har vandrat i Australiens sumpmarker hade garderat med en milt radioaktiv
  myggolja, inhandlad d\u00e4rst\u00e4des och verksam \u00e4ven mot krokodiler, men
  den beh\u00f6vdes inte. Den torra v\u00e5ren hade hindrat kl\u00e4ckningen av mygglarver,
  s\u00e5 vi gick myggfritt hela veckan!\\n\\nDag 3,   Abiskojaure \u2013 Alesjaure,
  20 km\\n\\nDetta var den soligaste dagen. 15 \u2013 20\u00ba redan p\u00e5 morgonen.
  Vi kom iv\u00e4g vid 8-tiden efter en rej\u00e4l gr\u00f6tfrukost. Vandringen b\u00f6rjade
  vackert, ingen stigning att tala om, men snart b\u00f6rjade det. I passet mellan
  Kieron och Gardevarri  gick leden upp fr\u00e5n ca 500 till ca 800 meter och sedan
  l\u00e5g den p\u00e5 den niv\u00e5n fram till Alesjauri.\\n\\nVid 13-tiden testade
  vi Trangian f\u00f6r f\u00f6rsta g\u00e5ngen. L\u00e4ngs leden l\u00e5g ett perfekt
  k\u00f6k med rinnande kallt och kallt vatten, stora slipade granith\u00e4llar som
  k\u00f6ksb\u00e4nk och rundare stenar att sitta p\u00e5. En n\u00e4rande fisksoppa
  med danskt r\u00e5gbr\u00f6d blev v\u00e5r lunch. V\u00e5ra vandrarv\u00e4nner fr\u00e5n
  Varberg, som vi tr\u00e4ffat kv\u00e4llen innan, gick f\u00f6rbi och fick en kopp
  kaffe.\\n\\nTrots l\u00e4tt kl\u00e4dsel var det varmt och motsol dessutom, s\u00e5
  n\u00e4r vi kom fram till Alesjaure var jag alldeles grusig av saltkristaller i
  ansiktet. Men f\u00f6tter och axlar k\u00e4ndes bra. Vi var framme klockan 15. Fr\u00e5ndraget
  rasterna blev marschhastigheten ca 4 km/tim. B\u00e4ttre \u00e4n dag 2.\\n\\nAlesjaure
  hade fina, nybyggda stugor och helikopterplatta bakom knuten. Vi checkade in, handlade
  lite sm\u00e5grejer och Kalle fr\u00e5gade om han fick bjuda p\u00e5 en pilsner
  i baren efter en lyckad dagsmarsch\u2026 Jod\u00e5.\\n\\nS\u00e5 sm\u00e5ningom
  anl\u00e4nde samma g\u00e4ng som bott i Abiskojaure kv\u00e4llen innan: en stor
  skara Italienare som hade sovit i t\u00e4lt f\u00f6rsta natten. Tv\u00e5 tjejer,
  m\u00f6jligen tvillingar, fr\u00e5n G\u00f6teborg. Knappt 20 \u00e5r gamla, med
  j\u00e4ttestora ryggs\u00e4ckar. De var mycket v\u00e4lutrustade. (H\u00e4rmed avses
  nya ryggs\u00e4ckar, jackor, k\u00e4ngor och m\u00f6ssor). Vi tr\u00e4ffade ocks\u00e5
  killen fr\u00e5n \u00c4lmhult som gick leden med sin familj. Efter dagens vandring
  hade han tagit sig en v\u00e4lf\u00f6rtj\u00e4nt bastu, men n\u00e4r han gick tillbaka
  upp mot stu-\\n\\ngorna brast vadmuskeln och nu linkade han fram och v\u00e4ntade
  p\u00e5 helikoptertransport till Kebnekaise. Den stora muskeln som jag sitter p\u00e5
  h\u00f6rde av sig lite till kv\u00e4llen liksom den som lyfter upp benet varje steg
  jag tar. Kalle hade lite ont under en h\u00e4l.\\n\\nMen v\u00e4rre var att vi drack
  ur det sista av r\u00f6dvinet. Detta kommer att f\u00f6ranleda omprioriteringar
  i packlistan till n\u00e4sta tur!\\n\\nDag 4,  Alesjaure \u2013 Tj\u00e4tka \u2013
  S\u00e4lka,   25 km\\n\\nJag var uppe tidigt och tv\u00e4ttade h\u00e5ret i varmvatten
  och tog ett dopp i jokken bredvid b\u00e5tbryggan. Kallt men sk\u00f6nt. Vi kom
  iv\u00e4g vid 8.30. Idag t\u00e4nkte vi ta en dubbeletapp f\u00f6r att k\u00e4nna
  p\u00e5 motst\u00e5ndet. Vi hade blivit f\u00f6rvarnade att det skulle stiga bra
  upp mot Tj\u00e4tka och det st\u00e4mde nog. Tj\u00e4tkastugan l\u00e5g p\u00e5
  ca 1.000 meter och sedan steg det ytterligare till Kungsledens h\u00f6gsta punkt
  i Tj\u00e4tka-passet, ca 1.150 meter. Uppe i passet finns en n\u00f6dbivack f\u00f6r
  vilsna vandrare. Ett utedass var v\u00e4l f\u00f6rankrat i klippan med fyra vajrar.
  Det bl\u00e5ser f\u00f6rmodligen h\u00e4ruppe ibland.\\n\\nVi lagade v\u00e5r lunch
  i Tj\u00e4tkastugan. Den l\u00e5g mycket vackert l\u00e4ngs en ravin, och h\u00e4r
  kom vi f\u00f6r f\u00f6rsta g\u00e5ngen i direktkontakt med sn\u00f6n. H\u00e4r
  l\u00e5g n\u00e5gra svettiga drivor och det var r\u00e4tt kul att g\u00f6ra en sn\u00f6boll
  den 2 augusti.\\n\\nEfter Tj\u00e4tkapasset var det branta nedg\u00e5ngar. Det k\u00e4ndes
  mer i benen \u00e4n allt kl\u00e4ttrandet upp till passet. Men utsikten var magnifik.
  Det \u00e4r klart b\u00e4ttre att ha fj\u00e4llet i ryggen och dalen framf\u00f6r!
  Vi m\u00f6tte ett \u00e4ldre par som hade hela stigningen framf\u00f6r sig. De verkade
  tr\u00f6tta och inte s\u00e5 fj\u00e4llvana, s\u00e5 vi hade v\u00e5ra dubier om
  de skulle hinna  till Tj\u00e4tkastugan innan skymningen.\\n\\nVi travade vidare
  och vid 16.30 var vi framme vid S\u00e4lkastugorna. \u00c4ldre stugor med inr\u00f6kt
  atmosf\u00e4r och d\u00e4r en trevlig diskussionsklubb hade b\u00e4nkat sig i v\u00e5r
  stuga. Jag tror att damerna h\u00f6ll p\u00e5 med sjukv\u00e5rdskrisen och de l\u00f6ste
  minsann alltihop innan kv\u00e4ller.\\n\\nKalle bytte om till spenderbyxorna, gick
  till baren och k\u00f6pte n\u00e5gra pilsner. Vi l\u00f6ste resten.\\n\\nI S\u00e4lka
  hade man ett organiserat bastubad. 18.00-19.00 -damernas. 19.00-20.00 -herrarnas.
  Efter 20.00 -blandat.\\n\\nF\u00f6rstod inte riktigt.  N\u00e5ja, vi bastade pliktskyldigast
  vid 19.00 men tidsgr\u00e4nserna var lite flytande uppt\u00e4ckte vi.\\n\\nS\u00e5
  sm\u00e5ningom var det bara herrar i bastun. Man fick tre liter varmvatten att tv\u00e4tta
  sig i och sk\u00f6lja av sig med efter\u00e5t, resten var kallvatten.  B\u00e4st
  vi satt d\u00e4r, stack en kille in huvudet och fr\u00e5gade om hans tjej fick basta
  med oss. Inga allvarliga protester. T\u00f6sen som kom in var v\u00e4l 25. Temperaturen
  i bastun steg raskt 5\u00ba, och kallvattnet efter\u00e5t var nog precis vad som
  beh\u00f6vdes.\\n\\nWhiskeyn tog slut senare p\u00e5 kv\u00e4llen. Ny kris.\\n\\nG\u00f6teborgstjejerna
  anl\u00e4nde r\u00e4tt sent, tr\u00f6tta men tuffa. Varbergskillarna och italienarna
  hade halkat efter, vi s\u00e5g dem inte mer.\\n\\nDag 5,  S\u00e4lka \u2013 Singi
  \u2013 Kebnekaise Fj\u00e4llstation,  27 km\\n\\nH\u00e4r var det kallt och bl\u00e5sigt
  p\u00e5 morgonen.  5\u00ba och utedasset slet i sina f\u00f6rt\u00f6jningar. Idag
  blir det vindjacka!\\n\\nVi s\u00e4tter fart redan vid 8-tiden, dubbelpass i dag
  igen. Inga stigningar att tala om. Enorm utsikt, vi ser genom n\u00e4stan hela dalen
  ner mot Singistugorna. Vi g\u00e5r p\u00e5 ca 700 meters h\u00f6jd och p\u00e5 b\u00e5da
  sidor reser sig bergen upp mot 1.700. Mjuka rasvinklar p\u00e5 sluttningarna g\u00f6r
  att dalen k\u00e4nns som v\u00e4rldens st\u00f6rsta half-pipe. Kebnekaisemassivet
  b\u00f6rjar dominera p\u00e5 v\u00e5r v\u00e4nstra sida, stort och svart, sn\u00f6fl\u00e4ckar
  p\u00e5 topparna. M\u00e4ktigt! Vi stannar ofta f\u00f6r att filma och fotografera.
  H\u00e4r beh\u00f6ver minnet st\u00f6d n\u00e4r vi ska f\u00f6rs\u00f6ka \u00e5terge
  vad vi upplever.\\n\\nEfter lunchen i Singi g\u00e5r vi \u00f6sterut. Det b\u00f6rjar
  bli varmare nu, solen h\u00e5ller p\u00e5 att bryta igenom. S\u00e4kert 15-20\u00ba.\\n\\nDags
  att ta av jackan och ta p\u00e5 en torr T-shirt. Nu b\u00f6rjar det bli mycket folk
  i sp\u00e5ret. Utflyktsgrupper fr\u00e5n Kebnekaise, hela klasser. Vi n\u00e4rmar
  oss civilisationen. Vi har f\u00e5tt sista delen av leden fram mot fj\u00e4llstationen
  beskriven f\u00f6r oss: F\u00f6rst stiger det lite och sedan stiger det lite mer
  och n\u00e4r man tror att man \u00e4r framme s\u00e5 stiger det lite brantare. Det
  var precis s\u00e5 det k\u00e4ndes.  Men vi kom \u00f6ver kr\u00f6net, s\u00e5g
  berget som dolde fj\u00e4llstationen och visste att inom timman skulle vi vara d\u00e4r!
  Vi gick vidare och snart s\u00e5g vi p\u00e5 n\u00e4ra h\u00e5ll det vi v\u00e4ntat
  p\u00e5 hela dagen. Mobilmasten!\\n\\nAv med ryggan, fram med telefonen. Det funkar!
  \u00c4ntligen kontakt med ytterv\u00e4rlden efter fyra dagar i teleskugga.\\n\\nEfter
  en halvtimma \u00e4r vi p\u00e5 fj\u00e4llstationen. Klockan \u00e4r 15.15 och fr\u00e5ndraget
  raster s\u00e5 blir snittfarten idag 4.5 km. Det tar sig. Inga kr\u00e4mpor.\\n\\nVi
  f\u00e5r sovplats p\u00e5 golvet i en stor sovsal och eftersom vi \u00e4r tidigt
  ute p\u00e5 dagen har vi en 6-mannadusch f\u00f6r oss sj\u00e4lva. Men f\u00f6rst
  ett par pilsner i baren.\\n\\nP\u00e5 kv\u00e4llen g\u00e5r vi p\u00e5 lokal. H\u00e4r
  p\u00e5 Fj\u00e4llstationen finns det resurser, helikoptrarna flyger in f\u00f6rr\u00e5d
  hela dagen och restaurangen har allt man kan \u00f6nska sig. Vi \u00f6nskar oss
  Pocherad Lax med sallad och kokt potatis, Sm\u00f6rDillCitron-s\u00e5s och lite
  vitt. Och se, det har dom! Och n\u00e4r vi \u00f6nskar Jordgubbspanacotta och portvin
  till dessert s\u00e5 har de det ocks\u00e5!\\n\\nG\u00f6teborgstjejerna tycks inte
  ha inkommit. D\u00e4remot h\u00f6r vi att \u00c4lmhultsbon med sin vadmuskel har
  varit h\u00e4r n\u00e5gra dagar och tillfrisknat s\u00e5 bra att han g\u00e5tt f\u00f6r
  att m\u00f6ta familjen ute p\u00e5 leden.\\n\\nI kv\u00e4ll \u00e4r vi l\u00e4ttvaggade.
  Det tycks bli bra flygv\u00e4der i morgon s\u00e5 vi t\u00e4nker starta tidigt och
  k\u00f6ra h\u00e5rt mot Nikkaluokta och Kiruna.\\n\\nDag 6,  Kebnekaise Fj\u00e4llstation
  \u2013 Nikkaluokta,  14 km\\n\\nUpp klockan 06.00. Rimfrost, men str\u00e5lande
  solsken, vindstilla. Bra flygv\u00e4der!\\n\\nVi \u00e5t s\u00e5 bra i g\u00e5r
  kv\u00e4ll s\u00e5 vi hoppar frukosten. Vi \u00e4r ute i sp\u00e5ret klockan 07.00.
  Vi har nu 8 km till b\u00e5tplatsen vid Ladjujauri d\u00e4r vi ska ta b\u00e5ten
  \u00f6ver sj\u00f6n. Nu \u00e4r vi under tr\u00e4dgr\u00e4nsen igen, sm\u00e5bj\u00f6rkar
  och n\u00e5gon sorts l\u00e5ga buskar kantar stigen. Vi h\u00e5ller h\u00f6gt tempo
  f\u00f6r att\\n\\ninte missa f\u00f6rsta b\u00e5ten. \u00d6ver oss k\u00f6r helikoptrarna
  skytteltrafik till fj\u00e4llstationen med dagens f\u00f6rn\u00f6denheter. 08.45
  \u00e4r vi framme och d\u00e4r ligger redan b\u00e5ten. Vi trodde at vi h\u00f6ll
  p\u00e5 att missa den, men detta \u00e4r en extra tur som ska g\u00e5 en halvtimma
  tidigare. En sparad halvtimma som kanske kan beh\u00f6vas i kv\u00e4ll n\u00e4r
  vi h\u00e4nger i luften. Sj\u00f6n \u00e4r s\u00e5 grund, ibland bara n\u00e5gon
  decimeter, s\u00e5 den h\u00e4r b\u00e5ten \u00e4r jetdriven. Bra fart och sv\u00e4ngradie
  hade den. F\u00f6rare var v\u00e4dersp\u00e5mannen Enok Sarris son som rapporterade
  att det varit \u20131,5\u00ba i Nikkaluokta i natt. Var annars! S\u00e4kert rekord
  f\u00f6r s\u00e4songen.\\n\\nSj\u00f6turen tog s\u00e5 d\u00e4r 20 minuter. Vi gick
  iland vid Ladtjoluspek\u00e5tan, det k\u00e4ndes som lunchdags nu och vi inhandlade
  raskt tv\u00e5 renburgare p\u00e5 And Danalds Walk-In. Smakade h\u00e4rligt. Kalle,
  som nu mentalt var l\u00e5ngt inne i planeringen av hemflygningen, fick fatt i en
  flygtaxi per mobil och best\u00e4llde den till Nikkaluokta klockan 11.00. Det var
  om en timme och en kvart! Och vi hade n\u00e4stan 6 km att g\u00e5\\n\\n(=sm\u00e5springa)!
  Men O.K., planen b\u00f6rjade g\u00e4lla h\u00e4r och nu s\u00e5 vi satte fart.
  Det var r\u00e4tt varmt och soligt nu p\u00e5 f\u00f6rmiddagen, 15\u201320\u00ba,
  men fartvinden svalkade.\\n\\n10.59.58 marscherade vi in p\u00e5 parkeringen och
  sl\u00e4ngde upp veckans vederm\u00f6dor p\u00e5 Flygtaxins flak! Kalles planeringar
  h\u00e5ller alltid. Medelfart 7.3 km/tim. Var vi slut nu? Var det tv\u00e5 utsjasade
  sk\u00e5ningar i \u00f6vre medel\u00e5ldern som gick i m\u00e5l? Icke. Den h\u00e4r
  veckan hade\\n\\nbara st\u00e4rkt oss, dels i kroppen, dels i v\u00e5r \u00f6vertygelse
  att man ska g\u00f6ra det man vill. Vi fick i alla fall en timmas paus i taxin och
  anl\u00e4nde till Kiruna Flygplats 12.00.\\n\\nEn  timma gick \u00e5t till f\u00e4rdplanering
  och ink\u00f6p av souvenirer. Efter tankning var vi i luften 13.17. CAVOK och svag
  medvind. Jag kollade Kalle om han var tr\u00f6tt, men icke. Men han klagade p\u00e5
  bolagets catering (=undertecknad). Kravet p\u00e5 flygk\u00e4ket var att vi skulle
  kunna \u00e4ta medan vi  fl\u00f6g. Men det enda godk\u00e4nda f\u00f6do\u00e4mne
  jag kunde f\u00e5 fatt i p\u00e5 flygplatsen var ett g\u00e4ng mazariner och lite
  godis. Efter en 12 minuters tankning i Sundsvall var vi p\u00e5 tracken igen och
  landade p\u00e5 ESMH 19.15. 12 timmar fr\u00e5n Kebnekaise Fj\u00e4llstation till
  H\u00f6gan\u00e4s!\\n\\nN\u00e4r jag kom hem hade baren precis \u00f6ppnat. Jag
  tog en pilsner.\\n\\nV\u00e4rdel\u00f6st vetande om Kungsleden\\n\\nP\u00e5 sitt
  stillsamma s\u00e4tt kallar samerna Kungsleden f\u00f6r Kungsgatan.\\n\\nOm Kungsgatan
  hade sett ut som Kungsleden hade den varit avst\u00e4ngd f\u00f6r l\u00e4nge sen.
  Det \u00e4r m\u00f6jligt att leden \u00e4r sl\u00e4t som en gata n\u00e5gonstans
  men inte i sin nordligaste str\u00e4ckning. En empirisk unders\u00f6kning fr\u00e5n
  sommaren 2002 ger vid handen att Kungsleden ser ut s\u00e5 h\u00e4r:\\n\\nDe 11
  mil som vi gick innebar ca 300.000 steg d\u00e4r det i genomsnitt var 75% chans
  att: vricka, stuka, sl\u00e5 eller bryta n\u00e5got. Detta kr\u00e4ver 100% koncentration.
  I \u00e5r var det ganska torrt i markerna s\u00e5 d\u00e4rf\u00f6r bortfaller chansen
  att plurra och bli genombl\u00f6t.\\n\\nVad gav d\u00e5 alla de h\u00e4r besv\u00e4ren?
  Jo, styrka i benen, friskluft i m\u00e4ngd, rent h\u00e4rligt vatten p\u00e5 arml\u00e4ngds
  avst\u00e5nd och en f\u00f6runderlig ro i sj\u00e4len efter att ha upplevt fj\u00e4llv\u00e4rldens
  storhet och stramhet. Och inte minst kamratskapet, pauserna med en k\u00e5sa vatten
  framf\u00f6r en makal\u00f6s utsikt eller sammanfattningen av dagen med en f\u00f6rst\u00e4rkt
  kopp kaffe i stugv\u00e4rmen.\\n\\nDetta var en h\u00f6jdar-semester.\\n\\nTa en
  tur sj\u00e4lv!\\n\\n\u00c5ke Karlsson\\n\\nDenna artikel utg\u00f6r en dramatiserad\\nframst\u00e4llning
  och \u00e5terspeglar inte n\u00f6d-\\nv\u00e4ndigtvis exakt ett intr\u00e4ffat skeende.\\nF\u00f6rfattaren
  friskriver sig d\u00e4rf\u00f6r fr\u00e5n all\\nskyldighet mot de lagar och best\u00e4m-\\nmelser
  varemot\\novansagda framst\u00e4ll-\\nning kan anses bryta.\"", "\"Kanalplatslista
  f\u00f6r digital-tv\\n\\nTV044-1306\\n\\nOBS! Tomma kanalplatser hoppar boxen \u00f6ver
  direkt.\\n\\nSkapa din egen lista\\n\\nDin digitalbox har en funktion d\u00e4r du
  kan l\u00e4gga upp dina favoritkanaler i den ordning du sj\u00e4lv \u00f6nskar.
  Titta i manualen f\u00f6r din box om hur du g\u00f6r egna kanallistor/favoritlistor.
  Grundlistan \u00e4r dock alltid den ovanst\u00e5ende.\\n\\nTV044-1306\"", "\"FOG
  & DISTANS\\n\\n100 % SNABBARE\\n\\nEN HANDLEDNING F\u00d6R H\u00c5LLBAR L\u00c4GGNING
  AV MARKSTEN OCH PLATTOR\\n\\nV\u00e5rt framg\u00e5ngsrecept\\nEtt noggrant underarbete,
  plattor/marksten av h\u00f6g kvalitet och ett korrekt l\u00e4ggningsarbete ger en
  h\u00e5llbar bel\u00e4ggning som h\u00e5ller sig lika fin i m\u00e5nga \u00e5r.
  Slarva inte med den sista detaljen, fogsanden.\\nAntracitf\u00e4rgade plattan Cirkus
  har fogats med vit dekorfog f\u00f6r att framh\u00e4va plattornas oregelbundna m\u00f6nster.\\n\\nFog
  och distans i samverkan\\n\\nFogen \u00e4r en viktig del f\u00f6r bel\u00e4ggningens
  h\u00e5llfasthet och j\u00e4mnhet. Plattor och marksten ska enligt AMA anl\u00e4ggning
  07 l\u00e4ggas med 3 mm fog. S:t Eriks markstenar och plattor tillverkas med distanser
  i sidorna f\u00f6r att s\u00e4kerst\u00e4lla en j\u00e4mn fogbredd. Kolla upp s\u00e5
  dina plattor har ingjutna distanser. D\u00e5 beh\u00f6ver du inte bekymra dig om
  r\u00e4tt fogbredd. Den blir precis lagom bred n\u00e4r du l\u00e4gger ihop stenarna
  och hela l\u00e4ggningsarbetet g\u00e5r dubbelt s\u00e5 fort.\\n\\nDen viktiga distansen\\n\\nDistanserna
  har en viktig uppgift \u2013 de skapar automatiskt en ca 3 mm bred spalt mellan
  plattorna. Distanserna sparar tid vid utl\u00e4ggningen och medverkar till en livsl\u00e5ng
  h\u00e5llbarhet. Fogutrymmet hindrar plattorna fr\u00e5n att skava mot varandra
  s\u00e5 att de k\u00e4nsliga kanterna kn\u00e4cks.\\n\\nFogen skall noga fyllas
  med fogsand innan stenl\u00e4ggningen tas i bruk. Annars finns det stor risk f\u00f6r
  s\u00e4ttningar och f\u00f6rskjutningar. Fogen skall alltid vara fylld f\u00f6r
  att l\u00e5sa markbel\u00e4ggningen och motverka ogr\u00e4s. Det g\u00e4ller under
  hela bel\u00e4ggningens livsl\u00e4ngd. Enligt AMA anl\u00e4ggning 07 skall fogsand
  anv\u00e4ndas. Fogsanden ska vara v\u00e4lgraderad med kornstorlekar mellan 0 till
  3 mm.\\n\\nS\u00e5 fogar du din mark/platt yta\\n\\nN\u00e4r stenen eller plattorna
  \u00e4r utlagda h\u00e4lls fogsanden ut \u00f6ver ytan. Sopa ner sanden mellan plattorna
  eller markstenen med en h\u00e5rd kvast. Sopa diagonalt \u00f6ver ytan. Torr v\u00e4derlek
  och torr, s\u00e4ckad sand \u00e4r att f\u00f6redra eftersom den rinner l\u00e4ttare
  ner i fogen. Sopa fram och tillbaka tills fogarna inte tar emot mer fogsand. \u00d6verskottet
  tas bort, men gl\u00f6m inte att efterfoga n\u00e4r sanden har sjunkit undan efter
  n\u00e5gra veckor.\\n\\nVid traditionell fogsand kan man \u00f6ka packningen genom
  att vattna ytan s\u00e5 att sanden rinner ner i fogarna. K\u00f6r \u00f6ver markstensbel\u00e4ggningen
  med en vibratorplatta. V\u00e4lj en \\\"padda\\\" av l\u00e4tt variant kl\u00e4dd
  med gummiduk. St\u00f6rre plattor b\u00f6r inte vibreras eftersom de l\u00e4tt kan
  spricka. Efter vibrering efterfogas ytan rikligt.\\n\\nVid h\u00e4rdande fogmaterial,
  t ex S:t Eriks Fastfog, \u00e4r det viktigt att du borstar bort \u00f6verfl\u00f6dig
  fog n\u00e4r du \u00e4r klar, eftersom den annars l\u00e4tt kan f\u00e4sta i betongplattorna.\\n\\nDistanserna
  p\u00e5 v\u00e5ra markstenar Rustik och Antiksten \u00e4r utformade s\u00e5 att
  de m\u00f6ts oberoende om stenarna l\u00e4ggs i halvf\u00f6rband eller h\u00f6rn
  i h\u00f6rn. V\u00e5ra \u00f6vriga stenar och plattor har enkla distanser med en
  rund profil.\\n\\nUtan fogsand\\nMed fogsand\\n\\nEn markbetongbel\u00e4ggning kan
  beskrivas som en halvelastisk bel\u00e4ggning, eftersom den best\u00e5r av styva
  enheter som \u00e4r f\u00f6rbundna med varandra av elastiska fogar av sand. Fogsandens
  uppgift \u00e4r att se till att stenarna samverkar och f\u00f6rdelar lasten av t
  ex fordon.\\n\\n\u00c4ven plattor fogas noggrant med stabilt fogmaterial f\u00f6r
  att undvika myror och skador p\u00e5 plattornas kanter. D\u00e4remot b\u00f6r inte
  st\u00f6rre plattor vibreras eftersandning. P\u00e5 bilden Structura 400x400 mm
  i f\u00e4rg Lava.\\n\\nDistansen sparar tid\\n\\nMarkstenar och plattor med inbyggda
  distanser i sidorna s\u00e4kerst\u00e4ller en tillr\u00e4cklig fogbredd. Luftspalten
  som skapas vid l\u00e4ggningen ska fyllas med fogsand innan bel\u00e4ggningen \u00e4r
  klar.\\n\\nF\u00f6rdelar:\\n\\n* Tester visar att l\u00e4ggning av betongsten med
  distanser g\u00e5r 100% snabbare \u00e4n sten som saknar distanser.\\n* Du f\u00e5r
  automatiskt ett korrekt mellanrum utan linor, fogkryss eller andra mellanl\u00e4gg.\\n*
  M\u00f6nstret blir j\u00e4mnt eftersom alla stenar och fogar \u00e4r lika stora.\\n\\nV\u00e5ra
  fogmaterial\\n\\nPlattor och markstenar utan distanser \u00e4r ofta billigare i
  ink\u00f6p. Men t\u00e4nk p\u00e5 att skapa utrymme f\u00f6r fogsanden vid l\u00e4ggningen
  s\u00e5 att inte stenarna gnager p\u00e5 varandra. Plattorna f\u00e5r inte l\u00e4ggas
  kloss intill varandra. Speciellt viktigt \u00e4r det om plattytan uts\u00e4tts f\u00f6r
  biltrafik.\\n\\nNackdelar:\\n\\n* V\u00e5ra tester visar att l\u00e4ggningsarbetet
  tar dubbelt s\u00e5 l\u00e5ng tid.\\n* Du beh\u00f6ver extra utrustning i form av
  mellanl\u00e4gg, sn\u00f6re eller fogkryss.\\n* Om inte fogen \u00e4r lika bred
  \u00f6verallt kommer m\u00f6nstret att bli snett.\\n\\nVilken fog v\u00e4ljer du?\\n\\nS:t
  Eriks rekommenderar olika fogmaterial f\u00f6r olika typer av markprodukter.\\n\\nTorkad
  Fogsand\\n\\nS:t Eriks torkade Fogsand h\u00e5ller en kornstorlek p\u00e5 0,1-1,5
  mm. Den \u00e4r l\u00e4tt att hantera och f\u00f6rdelar sig snabbt i fogen. Fogsand
  finns i stors\u00e4ck om 1100 kg eller mer l\u00e4tthanterliga sm\u00e5s\u00e4ckar
  p\u00e5 25 kg. Passar vid fogning av alla v\u00e5ra markstenar och plattor.\\n\\nDekorfog,
  ogr\u00e4sh\u00e4mmande\\n\\nDekorfog, ogr\u00e4sh\u00e4mmande 0-3 mm finns i f\u00e4rg
  antracit och \u00e4r ett milj\u00f6v\u00e4nligt och ekologiskt fogmaterial med l\u00e5ng
  livsl\u00e4ngd. Genom h\u00f6gt pH-v\u00e4rde (9,6) f\u00e5r fogen starkt ogr\u00e4sh\u00e4mmande
  egenskaper och ett naturligt skydd mot myror. Dekorfogen \u00e4r ocks\u00e5 enkel
  att arbeta med, den sl\u00e4pper l\u00e4tt igenom vatten och \u00e4r d\u00e4rf\u00f6r
  \u00e4ven snabbtorkande. Finns i 25 eller 1000 kg s\u00e4ckar.\\n\\nFastfog f\u00f6r
  fogbredd 1-10 mm\\n\\nS:t Eriks fastfog \u00e4r ett milj\u00f6riktigt, h\u00e4rdande
  fogmaterial som kr\u00e4ver minimalt underh\u00e5ll. Fastfogen \u00e4r l\u00e4ttarbetad,
  minimerar underh\u00e5llet, f\u00f6rsv\u00e5rar f\u00f6r myrorna och hindrar ogr\u00e4set
  att f\u00e5 f\u00e4ste. Fastfogen klarar ocks\u00e5 b\u00e5de sug- och borstmaskiner
  och passar f\u00f6r markbel\u00e4ggningar i b\u00e5de privata och offentliga milj\u00f6er.\\n\\nFastfogen
  best\u00e5r av kvarts blandat med ett polymeriskt bindemedel som ger stabila fogar
  och d\u00e4rmed en stark bel\u00e4ggning. Genom att fukta fogen med vatten aktiveras
  bindemedlet och det bildas en gel\u00e9 som klibbar ihop sandkornen. Beroende p\u00e5
  temperatur h\u00e4rdar gel\u00e9n p\u00e5 1-3 dygn till en h\u00e5rd men flexibel
  fog. I och med att fogen f\u00f6rblir flexibel st\u00e5r den emot mindre s\u00e4ttningar
  i markbel\u00e4ggningen och passar utm\u00e4rkt i v\u00e5rt nordliga klimat. S:t
  Eriks Fastfog kan anv\u00e4ndas p\u00e5 befintlig eller nylagd markbel\u00e4ggning.
  S\u00e4ljs i f\u00f6rpackningar om 20 kg.\\n\\n\u00c5tg\u00e5ngstabell Fogsand och
  Dekorfog\\n\\n\u00c5tg\u00e5ngstabell Fastfog\\n\\nDekorfog\\n\\nDekorfog \u00e4r
  ett graderat material 0-2 mm i tv\u00e5 f\u00e4rgst\u00e4llningar, Vit och Ljusgr\u00e5.
  Genom att anv\u00e4nda en fog i avvikande f\u00e4rg markeras utrymmet mellan plattorna
  mer. Detta kan vara \u00f6nskv\u00e4rt t ex vid bel\u00e4ggningar med Cirkus, som
  har en oj\u00e4mn och mer framtr\u00e4dande fog.\\n\\nT\u00e4ck plattytan med fogsand
  och sopa ner den diagonalt mot fogutrymmet tills att fogen \u00e4r helt fylld. Efter
  fogning vattnas ytan och mer sand fylls p\u00e5 efter att det torkat. Var noga med
  att borsta rent ytan direkt efter fogning, annars kan materialet f\u00e4sta p\u00e5
  stenarna. Dekorfogen h\u00e5ller en kornstorlek p\u00e5 0-2 mm och levereras i f\u00f6rpackningar
  om 25 kg.\\n\\nEn v\u00e4lfylld fog hindrar ogr\u00e4s och ger en stabil bel\u00e4ggning
  som t\u00e5l p\u00e5frestningar.\\n\\nDekorfog vit\\n\\nOtillr\u00e4cklig fogfyllning
  leder till en instabil bel\u00e4ggning. Vid trafikbelastning glider stenarna runt
  och m\u00f6nstret f\u00f6rskjuts.\\n\\nHalvfyllda fogar eller f\u00f6r grovt fogmaterial
  i kombination med l\u00e5gt slitage ger ogr\u00e4set en chans att etablera sig.\\n\\nS\u00e5
  h\u00e4r l\u00e4gger du plattor och marksten\\n\\nTa ut den r\u00e4ta vinkeln med
  hj\u00e4lp av Pythagoras sats a 2 +b 2 =c 2\\n\\n1. Gr\u00e4v ur 15\u2009\u2013\u200925
  cm f\u00f6r tr\u00e4dg\u00e5rdsg\u00e5ng eller uteplats och 30\u2009\u2013\u200935
  cm f\u00f6r garageuppfart (eller djupare beroende p\u00e5 underlaget). Den urgr\u00e4vda
  ytan ska ha samma fall som den f\u00e4rdiga ytan, 1\u20132 cm per meter. Se till
  att ytan lutar ifr\u00e5n huset.\\n2. N\u00e4r du gr\u00e4vt ur underlaget, v\u00e4ger
  du av ytan f\u00f6r att den ska bli j\u00e4mn och fin med \u00f6nskad lutning.\\n3.
  Botten p\u00e5 den utgr\u00e4vda ytan ska vara j\u00e4mn. \u00c4r jorden lerig,
  kan du t\u00e4cka botten med en fiberduk som f\u00f6rhindrar att jordmassorna blandar
  sig med b\u00e4rlagret ovanp\u00e5.\\n5. L\u00e4gg ca 1-3 cm s\u00e4ttsand \u00f6ver
  ytan och komprimera lagret l\u00e4tt. Placera ut avdragsbanor (till exempel 2\u2009\u2013\u20093
  meter l\u00e5nga j\u00e4rnr\u00f6r eller st\u00e5lprofiler), s\u00e5 att banornas
  \u00f6versidor ligger i niv\u00e5 med markstenens/plattornas undersida. Ytan ska
  ha ett visst fall fr\u00e5n huset, normalt 1\u2013\u20092 cm per meter. Drag av
  \u00f6verfl\u00f6dig sand genom att trycka avdragsskivan mot banorna samtidigt som
  du drar den mot dig. P\u00e5 s\u00e5 s\u00e4tt f\u00e5r du en f\u00e4rdig b\u00e4dd
  att l\u00e4gga plattorna p\u00e5. Ta bort banorna och \u00e5terfyll f\u00f6rsiktigt
  i sp\u00e5ren.\\n6. L\u00e4gg ut markstenen/plattorna med en fog p\u00e5 ca 3 mm.
  B\u00f6rja med att prov\u00adl\u00e4gga ett helt skift s\u00e5 att du kan justera
  fogarna och slipper on\u00f6diga kap\u00adningar. Beh\u00f6ver du kapa ska minst
  en tredjedel av stenen/plattan vara kvar. De flesta av v\u00e5ra produkter har f\u00e4rdiga
  distanser. Distanserna garanterar en fog p\u00e5 ca 3mm.\\n4. Fyll upp med ett 10\u2009\u201315
  cm tjockt b\u00e4rlager av 0/18 mm samkross eller motsvarande som packas v\u00e4l
  med vibroplatta. J\u00e4mna till ytan och se till att den f\u00e5r samma lutning
  som den f\u00e4rdiga ytan ska ha. Kvar upp till den f\u00e4rdiga ytan ska det vara
  plats f\u00f6r 1-3 cm s\u00e4ttsand plus markstenens/plattans tjocklek. Beh\u00f6ver
  du anv\u00e4nda kantst\u00f6d s\u00e4tts de i samband med att b\u00e4rlagret l\u00e4ggs
  ut och packas. Prova med ett skift av markstenar/plattor, s\u00e5 att kantst\u00f6den
  kommer p\u00e5 r\u00e4tt avst\u00e5nd f\u00f6r att undvika on\u00f6diga kapningar.\\n7.
  Se till att fogen blir fylld! Anv\u00e4nd S:t Eriks fogsand som borstas eller vattnas
  ner i omg\u00e5ngar. Det \u00e4r s\u00e4rskilt viktigt att du fyller noggrant n\u00e4r
  det g\u00e4ller garageuppfarter. Spara fogsand s\u00e5 att du kan underh\u00e5lla
  fogarna den f\u00f6rsta tiden. N\u00e4r fogningen \u00e4r klar ska \u00f6verbliven
  fogsand sopas bort. Ifall plattorna eller markstenen \u00e4r 60 mm eller tjockare,
  \u00e4r det l\u00e4mpligt att j\u00e4mna ut l\u00e4ggningen med en vibratorplatta
  kl\u00e4dd med gummi p\u00e5 undersidan.\\n\\nS:t Eriks / EO Grafiska / 2204 steriks
  55.01\"", "\"R\u00e5dgivning inom livsmedelskontrollen\\n\\nF\u00d6R KONTROLLMYNDIGHETER\\n\\n2\\n\\n2\\n\\nInledning\\n\\nI
  v\u00e5ra m\u00f6ten med livsmedelsf\u00f6retagare ser vi att det finns en efterfr\u00e5gan
  p\u00e5 mer r\u00e5dgivning och information fr\u00e5n kontrollmyndigheterna. Samtidigt
  upplever en del kontrollmyndigheter att det finns en konflikt mellan r\u00e5dgivningsrollen
  och den myndighetsut\u00f6vande rollen. Det \u00e4r mot bakgrund av detta som vi
  har tagit fram den h\u00e4r broschyren.\\n\\nH\u00e4r kan du som representant fr\u00e5n
  en kontrollmyndighet l\u00e4sa om din r\u00e5dgivande roll i samband med opartisk
  kontroll. Informationen v\u00e4nder sig b\u00e5de till dig som arbetar med kontroll
  av prim\u00e4rproduktion och av ledet efter.\\n\\nVi har ocks\u00e5 tagit fram en
  broschyr som v\u00e4nder sig till livsmedelsf\u00f6retagare. Med den vill vi f\u00f6rtydliga
  vilken r\u00e5dgivning de har m\u00f6jlighet att f\u00e5.\\n\\nBroschyrerna \u00e4r
  ett resultat av ett samarbete mellan Livsmedelsverket och Tillv\u00e4xtverket. I
  arbetet har vi samr\u00e5tt med representanter f\u00f6r Sveriges Kommuner och Landsting,
  Visita, Lantbrukarnas Riksf\u00f6rbund, Link\u00f6pings Universitet samt milj\u00f6kontoret
  i G\u00f6teborgs stad, och milj\u00f6- och h\u00e4lsoskyddskontoret i Sigtuna kommun.\\n\\nArbetet
  \u00e4r en del av Tillv\u00e4xtverkets uppdrag att f\u00f6renkla f\u00f6r f\u00f6retag
  p\u00e5 kommunal niv\u00e5. Vi hoppas att den h\u00e4r broschyren ska ge kunskap
  och st\u00f6d kring r\u00e5dgivningens roll f\u00f6r att underl\u00e4tta f\u00f6r
  f\u00f6retagare.\\n\\nTillv\u00e4xtverket och Livsmedelsverket\\n\\nAnsvaret f\u00f6r
  r\u00e5dgivning till livsmedelsf\u00f6retagare\\n\\nKontrollmyndighetens uppdrag
  handlar om att g\u00f6ra en oberoende granskning av livsmedelsf\u00f6retagarens
  verksamhet. Som en del i uppdraget ing\u00e5r \u00e4ven att ge r\u00e5d och information
  som underl\u00e4ttar f\u00f6r f\u00f6retagen att g\u00f6ra r\u00e4tt. H\u00e4r kan
  du som inspekt\u00f6r och representant f\u00f6r en kontrollmyndighet f\u00e5 v\u00e4gledning
  till hur du kan ge r\u00e5d till livsmedelsf\u00f6retagare.\\n\\nDu kan ge information
  om vad lagstiftningen kr\u00e4ver och exempel p\u00e5 hur man kan g\u00f6ra f\u00f6r
  att f\u00f6lja reglerna. R\u00e5dgivningen b\u00f6r anpassas till f\u00f6retagets
  kunskap och behov. Dina r\u00e5d f\u00e5r dock inte minska deras m\u00f6jlighet
  till handlingsutrymme och kreativitet, och det ska vara fortsatt tydligt att de
  sj\u00e4lva har ansvaret.\\n\\nGenom att du underl\u00e4ttar f\u00f6r f\u00f6retagaren
  att g\u00f6ra r\u00e4tt fr\u00e5n b\u00f6rjan, bidrar ni tillsammans till att l\u00e4ttare
  och snabbare uppn\u00e5 m\u00e5let: s\u00e4kra livsmedel till konsumenterna.\\n\\nF\u00f6rklara
  hur det h\u00e4nger ihop: Regel \u2013 m\u00e5l \u2013 krav \u2013 fara \u2013 l\u00f6sning\\n\\nDet
  finns en stor efterfr\u00e5gan p\u00e5 r\u00e5dgivning och information, fr\u00e5n
  livsmedelsf\u00f6retagare, om hur de kan uppfylla m\u00e5len i lagstiftningen 1
  . Kontrollmyndigheten och inspekt\u00f6ren blir d\u00e5 en viktig kontakt f\u00f6r
  f\u00f6retagaren f\u00f6r att f\u00e5 diskutera sina fr\u00e5gor och planer.\\n\\n1
  Livsmedelsverkets rapport 29 \u2013 2011. Kontrollens roll skiljer sig mellan livsmedelsbranscherna
  \u2013 F\u00f6retagens syn p\u00e5 kontrollen\\n\\nM\u00e5nga vill ha specifika
  besked om vilka l\u00f6sningar som lagen kr\u00e4ver. De kan beh\u00f6va f\u00e5
  f\u00f6rklarat f\u00f6r sig att reglerna bygger p\u00e5 att l\u00f6sningarna ska
  anpassas till den aktuella verksamhetens behov, att delar av livsmedelslagstiftningen
  \u00e4r m\u00e5lstyrd, och att kraven i lagstiftningen d\u00e4rf\u00f6r ofta kan
  uppfyllas p\u00e5 flera olika s\u00e4tt.\\n\\nDin r\u00e5dgivning ska hj\u00e4lpa
  f\u00f6retagaren att hitta s\u00e4tt att uppfylla kraven i lagstiftningen. Utg\u00e5
  g\u00e4rna fr\u00e5n farorna i den aktuella verksamheten n\u00e4r du diskuterar
  med f\u00f6retagaren. Hj\u00e4lp f\u00f6retagaren att f\u00f6rst\u00e5 vilka faror
  som finns i verksamheten, och diskutera hur de kan hanteras. N\u00e4r de f\u00f6rst\u00e5r
  varf\u00f6r n\u00e5got \u00e4r en fara, kan de l\u00e4ttare ta fram en l\u00f6sning
  till hur de kan minimera risken med faran.\\n\\nGe exempel och j\u00e4mf\u00f6r
  med lagstiftningen\\n\\nSom representant f\u00f6r kontrollmyndigheten ska du kunna
  f\u00f6rklara vad lagstiftningen kr\u00e4ver och dessutom, om det \u00e4r m\u00f6jligt,
  beskriva olika s\u00e4tt att uppn\u00e5 kraven. Utg\u00e5 alltid fr\u00e5n det aktuella
  f\u00f6retaget n\u00e4r du svarar p\u00e5 f\u00f6retagarens fr\u00e5gor.\\n\\nOm
  du har erfarenhet av hur man kan hantera en viss situation kan du ber\u00e4tta om
  det. Var tydlig med att det \u00e4r exempel, och inte krav p\u00e5 hur det aktuella
  f\u00f6retaget ska g\u00f6ra. Beskriv det \u00f6nskade resultatet. Resonera kring
  farorna i verksamheten. Ha en dialog om vilka l\u00f6sningar f\u00f6retagaren kan
  t\u00e4nka sig och om de \u00e4r l\u00e4mpliga. Om f\u00f6retagaren fr\u00e5gar
  \\\"Kan jag g\u00f6ra s\u00e5?\\\" eller \\\"Hur ska jag g\u00f6ra?\\\" kan du st\u00e4lla
  \u00f6ppna fr\u00e5gor som tydligg\u00f6r vad det \u00e4r verksamheten ska uppfylla.
  Exempel: Vilka faror finns? Vad h\u00e4nder n\u00e4r du inte g\u00f6r s\u00e5? Hur
  t\u00e4nker du kring det h\u00e4r? Om du bed\u00f6mer att f\u00f6retagaren kommer
  fram till ett f\u00f6rslag p\u00e5 \u00e5tg\u00e4rd som uppfyller lagstiftningens
  krav kan du s\u00e4ga det.\\n\\nOm du f\u00e5r en fr\u00e5ga om en konkret l\u00f6sning,
  av typen \\\"om verksamheten ser ut s\u00e5 h\u00e4r och jag g\u00f6r s\u00e5 h\u00e4r,
  uppfyller jag d\u00e5 lagstiftningens krav?\\\" kan du f\u00f6rklara hur f\u00f6rslaget
  f\u00f6rh\u00e5ller sig till lagstiftningen. Du kan svara \\\"ditt f\u00f6rslag
  \u00e4r ett s\u00e4tt att uppfylla lagstiftningens krav\\\", f\u00f6r att vara tydlig
  med att det kan finnas fler s\u00e4tt.\\n\\nDet viktiga \u00e4r att m\u00e5let med
  lagstiftningen \u2013 s\u00e4kra livsmedel \u2013 kan uppn\u00e5s med den l\u00f6sning
  f\u00f6retagaren beslutar sig f\u00f6r. Om det finns v\u00e4gledningar eller branschriktlinjer
  kan du h\u00e4nvisa till dem. Om du inte vet svaret direkt kan du f\u00f6rst\u00e5s
  be att f\u00e5 \u00e5terkomma med svaret senare.\\n\\nLivsmedelsverket har samlat
  branschriktlinjer och annan information som v\u00e4nder sig till livsmedelsf\u00f6retagare
  p\u00e5 deras webbplats www.livsmedelsverket.se\\n\\nDu finner dem h\u00e4r: L\u00e4nk
  till branschriktlinjer\\n\\nF\u00f6rtydliga ocks\u00e5 ansvarsf\u00f6rdelningen.
  Det \u00e4r alltid f\u00f6retagarens ansvar att deras livsmedel \u00e4r s\u00e4kra
  och att konsumenten inte blir vilseledd. Livsmedelsf\u00f6retagaren ska kunna visa
  f\u00f6r kontrollmyndigheten att en viss l\u00f6sning inneb\u00e4r att m\u00e5len
  med lagstiftningen uppfylls. Myndighetens uppgift \u00e4r att bed\u00f6ma om den
  l\u00f6sning f\u00f6retagaren v\u00e4ljer g\u00f6r att m\u00e5let med lagstiftningen
  uppfylls.\\n\\nEXEMPEL\\n\\nEn f\u00f6retagare fr\u00e5gar:\\n\\nHur ofta beh\u00f6ver
  jag byta spengummin p\u00e5 min mj\u00f6lkningsutrustning?\\n\\nDet finns inte ett
  enkelt svar p\u00e5 fr\u00e5gan, eftersom det m\u00e5ste bed\u00f6mas fr\u00e5n
  fall till fall, utifr\u00e5n till exempel hur ofta utrustningen anv\u00e4nds och
  hur den diskas. F\u00f6r en dialog om vilka risker som finns och vilka resultat
  som f\u00f6retagaren ska uppn\u00e5. Med hj\u00e4lp av \u00f6ppna fr\u00e5gor kan
  du hj\u00e4lpa f\u00f6retagaren att sj\u00e4lv komma fram till en l\u00f6sning som
  fungerar. Du kan f\u00f6rklara vad som h\u00e4nder med gummit n\u00e4r det \u00e5ldras,
  det vill s\u00e4ga att det blir mer spr\u00f6tt och att det finns risk f\u00f6r
  att det bildas sprickor d\u00e4r bakterier kan f\u00e5 f\u00e4ste. L\u00e5t f\u00f6retagaren
  beskriva vilka faror som finns, n\u00e4r \u00e5tg\u00e4rder kr\u00e4vs och hur de
  ska g\u00f6ras p\u00e5 b\u00e4sta s\u00e4tt f\u00f6r verksamhetens f\u00f6ruts\u00e4ttningar.
  H\u00e4nvisa ocks\u00e5 f\u00f6retagaren till att l\u00e4sa branschriktlinjer.\\n\\nEXEMPEL\\n\\nEn
  f\u00f6retagare fr\u00e5gar:\\n\\nHur ska jag kyla ner \u00f6verbliven mat som jag
  t\u00e4nker anv\u00e4nda senare?\\n\\nH\u00e4r kan du beskriva det \u00f6nskade
  resultatet och resonera med f\u00f6retagaren om farorna. Fr\u00e5ga vilka l\u00f6sningar
  f\u00f6retagaren kan t\u00e4nka sig och diskutera om de \u00e4r l\u00e4mpliga.\\n\\nSt\u00e4ll
  \u00f6ppna fr\u00e5gor f\u00f6r att f\u00f6rst\u00e5 hur f\u00f6retagaren t\u00e4nker
  l\u00f6sa problemet. Till exempel: Vilken mat handlar det om? Hur mycket mat ska
  kylas ner? Du kan ocks\u00e5 ge n\u00e5gra exempel p\u00e5 l\u00f6sningar och r\u00e5d
  om temperaturer och avsvalningstider utifr\u00e5n de livsmedel det g\u00e4ller.
  Du kan absolut rekommendera f\u00f6retagaren att k\u00f6pa in ett avsvalningssk\u00e5p.
  D\u00e4remot b\u00f6r du inte rekommendera f\u00f6retagaren att k\u00f6pa in ett
  avsvalningssk\u00e5p av s\u00e4rskilt m\u00e4rke eller effekt, eftersom det \u00e4r
  resultatet som \u00e4r det viktiga.\\n\\nVar mycket tydlig med vad som \u00e4r ett
  r\u00e5d och vad som \u00e4r ett krav. Om ni diskuterar ett detaljerat f\u00f6rslag
  under r\u00e5dgivningen b\u00f6r du g\u00f6ra det riktigt tydligt att det handlar
  om ett exempel, och att det kan finnas flera andra l\u00f6sningar som ocks\u00e5
  fungerar.\\n\\nPassa p\u00e5 att ge r\u00e5dgivning vid kontrollbes\u00f6ket\\n\\nF\u00f6r
  m\u00e5nga livsmedelsf\u00f6retagare \u00e4r m\u00f6tena med kontrollmyndigheten
  mycket viktiga. R\u00e5dgivning vid kontrollbes\u00f6ket \u00e4r ofta det mest uppskattade
  s\u00e4ttet att f\u00e5 r\u00e5d och information. Genom att du passar p\u00e5 att
  besvara fr\u00e5gor kan kontrollbes\u00f6ket ocks\u00e5 ge ett direkt och stort
  v\u00e4rde f\u00f6r f\u00f6retagen.\\n\\nOm du ser brister vid kontrollen b\u00f6r
  du hj\u00e4lpa f\u00f6retagaren att komma fram till l\u00f6sningar f\u00f6r att
  \u00e5tg\u00e4rda bristerna. F\u00f6r en diskussion om varje brist, f\u00f6rklara
  konkret vad som \u00e4r faran, varf\u00f6r du bed\u00f6mer att faran inte \u00e4r
  tillr\u00e4ckligt hanterad och vilket resultat f\u00f6retagaren ska uppn\u00e5 med
  sin l\u00f6sning.\\n\\nGe r\u00e5dgivning \u00e4ven vid andra tillf\u00e4llen\\n\\nIbland
  vill f\u00f6retagaren ringa och st\u00e4lla fr\u00e5gor utanf\u00f6r kontrolltillf\u00e4llet.
  Det kan till exempel handla om planerade f\u00f6r\u00e4ndringar av verksamheten.
  Precis som vid kontrollbes\u00f6ket har f\u00f6retagaren enligt lag 2 r\u00e4tt
  till r\u00e5dgivning fr\u00e5n sin kontrollmyndighet. Det r\u00e5dgivande samtalet
  b\u00f6r ske p\u00e5 samma niv\u00e5 som vid kontrolltillf\u00e4llet.\\n\\nVad \u00e4r
  r\u00e5d och vad \u00e4r information?\\n\\nEnligt livsmedelslagen \u00e4r kontrollmyndigheten
  skyldig att ge b\u00e5de r\u00e5dgivning och information. Men vad \u00e4r skillnaden?
  R\u00e5d \u00e4r svar p\u00e5 fr\u00e5gor, eller upplysningar, om hur lagstiftningen
  kan till\u00e4mpas i det aktuella fallet, eller en diskussion om den aktuella verksamheten.
  Information \u00e4r allm\u00e4nna upplysningar, till exempel att du ber\u00e4ttar
  vad som st\u00e5r i lagstiftningen. Men sj\u00e4lvklart kan r\u00e5dgivning och
  information ibland \u00f6verlappa.\\n\\n2 Enligt 12 \u00a7 i Livsmedelslagen och
  4 \u00a7 i F\u00f6rvaltningslagen.\\n\\nMyndigheternas skyldighet att ge r\u00e5d\\n\\nKontrollmyndigheten
  \u00e4r skyldig att svara p\u00e5 fr\u00e5gor och underl\u00e4tta f\u00f6r livsmedelsf\u00f6retagaren
  att g\u00f6ra r\u00e4tt, s\u00e5 l\u00e5ngt det \u00e4r m\u00f6jligt. Det framg\u00e5r
  av 12 \u00a7 livsmedelslagen:\\n\\n\\\"Den myndighet som ut\u00f6var offentlig kontroll
  skall genom r\u00e5dgivning, information och p\u00e5 annat s\u00e4tt underl\u00e4tta
  f\u00f6r den enskilde att fullg\u00f6ra sina skyldigheter enligt lagen...\\\" .\\n\\nOch
  4 \u00a7 f\u00f6rvaltningslagen:\\n\\n\\\"varje myndighet skall l\u00e4mna upplysningar,
  v\u00e4gledning, r\u00e5d och annan s\u00e5dan hj\u00e4lp till enskilda i fr\u00e5gor
  som r\u00f6r myndighetens verksamhetsomr\u00e5de. Hj\u00e4lpen skall l\u00e4mnas
  i den utstr\u00e4ckning som \u00e4r l\u00e4mplig med h\u00e4nsyn till fr\u00e5gans
  art, den enskildes behov av hj\u00e4lp och myndighetens verksamhet. Fr\u00e5gor
  fr\u00e5n enskilda skall besvaras s\u00e5 snart som m\u00f6jligt. Om n\u00e5gon
  enskild av misstag v\u00e4nder sig till fel myndighet, b\u00f6r myndigheten hj\u00e4lpa
  honom till r\u00e4tta.\\\"\\n\\n11\\n\\nDet ska vara enkelt att starta och driva
  f\u00f6retag. Det \u00e4r viktigt att de regler som finns \u00e4r enkla, \u00e4ndam\u00e5lsenliga
  och att f\u00f6retagare f\u00f6rst\u00e5r dem. Att f\u00f6renkla f\u00f6r f\u00f6retagare
  handlar bland annat om att minska deras kostnader till f\u00f6ljd av regler och
  f\u00f6rb\u00e4ttra deras myndighetskontakter, f\u00f6r att p\u00e5 s\u00e5 s\u00e4tt
  underl\u00e4tta deras vardag. D\u00e5 kan de i st\u00e4llet \u00e4gna mer tid och
  resurser till att driva din verksamhet.\\n\\nUtifr\u00e5n f\u00f6retagens perspektiv
  m\u00e5ste det finnas en balans mellan den service, information och r\u00e5dgivning
  som kommunen tillhandah\u00e5ller och den myndighetsut\u00f6vning som ut\u00f6vas
  gentemot f\u00f6retagen. N\u00e4r f\u00f6retag upplever att de inte f\u00e5r bra
  f\u00f6ruts\u00e4ttningar att f\u00f6lja regelverken upplever de till\u00e4mpningen
  som byr\u00e5kratisk.\\n\\nMer information som kan vara till nytta f\u00f6r dig
  finner du p\u00e5 Livsmedelsverkets webbplats www.livsmedelsverket.se\\n\\nMer information
  om Tillv\u00e4xtverkets arbete med att f\u00f6renkla f\u00f6r dig som \u00e4r f\u00f6retagare
  finner du p\u00e5 www.enklareregler.se\\n\\nKlicka p\u00e5 l\u00e4nken eller scanna
  in QR-koden med din smartphone och \u00f6ppna den i webbl\u00e4saren. QR-l\u00e4sare
  finns att ladda ner b\u00e5de till iPhone och Android.\\n\\nBox 622 751 26  UPPSALA
  Telefon 018-17 55 00 E-post firstname.lastname@example.org www.livsmedelsverket.se\\n\\nBox
  4044 102 61 Stockholm Telefon 08-681 91 00 E-post email@example.com www.tillvaxtverket.se\"",
  "\"NU \u00c4R DET \u00c4NTLIGEN DAGS ATT S\u00d6KA UTSKOTT I AJF 17/18!\\n\\nAtt
  vara med i ett utskott \u00e4r b\u00e5de meriterande och givande, du l\u00e4r dig
  massor och f\u00e5r vara med och f\u00f6r\u00e4ndra delar av v\u00e5r tid h\u00e4r
  p\u00e5 universitet. F\u00f6rutom detta erh\u00e5ller du ocks\u00e5 meriterande
  engagemangspo\u00e4ng som kan anv\u00e4ndas vid exempelvis utlandsstudier. Eftersom
  vi \u00e4r en sektion under StuFF ska alla v\u00e5ra utskottsmedlemmar vara medlemmar
  i b\u00e5de StuFF och AJF.\\n\\nAtt engagera sig i ett utskott inneb\u00e4r extra
  jobb ut\u00f6ver studierna i form av exempelvis m\u00f6ten och anordnande av utskottens
  olika aktiviteter. I \u00e5r erbjuds platser i nio olika utskott; Evenemangsutskottet,
  Utbildningsutskottet, N\u00e4ringslivsutskottet, Alumniutskottet, Jurodaygruppen,
  IT/Tryck-utskottet, Arbetsmilj\u00f6utskott, Marknadsf\u00f6ringsprojektgruppen,
  Redaktionen f\u00f6r programmets sektionstidning, Bihanget samt en projektgrupp
  inf\u00f6r diplomeringen. Mer information om utskotten finns nedan.\\n\\nHar du
  n\u00e5gra generella fr\u00e5gor kan du maila email@example.com\\n\\nSista ans\u00f6kningsdag
  \u00e4r den 10 september kl 23:59!\\n\\nN\u00e4ringslivsutskottet\\n\\nVill du bidra
  till en \u00f6kad kontakt mellan programmens studenter och n\u00e4ringslivet? D\u00e5
  \u00e4r n\u00e4ringslivsutskottet n\u00e5got f\u00f6r dig! Utskottets huvudsakliga
  uppgift \u00e4r att vara f\u00f6reningens samarbetspartners samt att vi siktar p\u00e5
  att anordna s\u00e5 givande aktiviteter som m\u00f6jligt f\u00f6r programmens studenter
  tillsammans med representanter fr\u00e5n n\u00e4ringslivet.\\n\\nkontakt med n\u00e4ringslivet.
  Det inneb\u00e4r att vi st\u00e4ndigt kommer vara p\u00e5 jakt efter nya intressanta
  Slutligen \u00e4r jag ute efter en person som vill ansvara, och utveckla, sektionens
  podcast. Personen beh\u00f6ver vara kreativ och ha v\u00e4ldigt l\u00e4tt att f\u00f6ra
  samtal med olika typer av m\u00e4nniskor. F\u00f6rra \u00e5ret blev podcasten en
  succ\u00e9, och nu \u00e4r det dags att utveckla v\u00e5r k\u00e4ra podcast \u00e4nnu
  mer.\\n\\nOm du vill ta chansen att vidga ditt kontaktn\u00e4t samtidigt som du
  bidrar till programmens utveckling, skicka d\u00e5 ett mail till Markus Folemark,
  firstname.lastname@example.org med:\\n\\n1. Namn och telefonnummer\\n2. \u00c5rskurs\\n3.
  En kortare beskrivning om hur just du kommer passa in i utskottet\\n\\nJurodaygruppen\\n\\nJuroday
  \u00e4r de Aff\u00e4rsjuridiska programmens \u00e5rliga arbetsmarknadsdag. F\u00f6r
  att kunna planera och genomf\u00f6ra Juroday beh\u00f6vs hj\u00e4lp av ett g\u00e4ng
  h\u00e4rliga m\u00e4nniskor och det \u00e4r nu d\u00e4rf\u00f6r dags att tills\u00e4tta
  utskottet Jurodaygruppen!\\n\\n\u00c4r du en fram\u00e5t person som gillar att ha
  mycket ansvar? D\u00e5 har du hittat helt r\u00e4tt! Att vara med i Jurodaygruppen
  \u00e4r en j\u00e4ttebra m\u00f6jlighet f\u00f6r dig som vill engagera dig utanf\u00f6r
  skolan och samtidigt f\u00e5 v\u00e4rdefull kontakt med framtida arbetsgivare.\\n\\nArbetet
  inf\u00f6r Juroday kommer att delas upp bland oss i gruppen, d\u00e5 vi alla kommer
  ha varsitt ansvarsomr\u00e5de. Vi kommer ha m\u00f6te ett par g\u00e5nger i m\u00e5naden,
  men mycket av arbetet sker p\u00e5 egen tid. N\u00e5gra av uppgifterna \u00e4r:\\n\\n*
  Planera, organisera och genomf\u00f6ra Juroday.\\n* Kontakta relevanta och intressanta
  f\u00f6retag, myndigheter, organisationer och f\u00f6reningar i syfte att erbjuda
  plats som utst\u00e4llare under Juroday.\\n* Anordna kringaktiviteter s\u00e5som
  t\u00e4vlingar, CV-granskning, g\u00e4stf\u00f6rel\u00e4sare samt workshops under
  Juroday.\\n* Anordna en bankett som avslut p\u00e5 \u00e5rets Juroday.\\n* Marknadsf\u00f6ring
  p\u00e5 sociala medier, via e-post och genom reklamprodukter.\\n\\nDu som medlem
  i Jurodaygruppen kommer att f\u00e5 engagemangspo\u00e4ng, en gratisbiljett till
  banketten och s\u00e5klart v\u00e4rdefulla kontakter.\\n\\nF\u00f6r att vara med
  i utskottet beh\u00f6ver du inga speciella erfarenheter. Till utskottet s\u00f6kes
  personer som fungerar bra i grupp, som kan ta eget ansvar och som \u00e4r peppade
  p\u00e5 att g\u00f6ra Juroday 2018 s\u00e5 bra som m\u00f6jligt!\\n\\nAns\u00f6kan
  skickas till Ida Mattsson, via email@example.com. I mailet skriver du:\\n\\n1. Namn\\n2.
  \u00c5rskurs och inriktning\\n3. Lite allm\u00e4nt om dig sj\u00e4lv\\n4. Varf\u00f6r
  du vill vara med i Jurodaygruppen\\n\\nHar du n\u00e5gon fr\u00e5ga \u00e4r du v\u00e4ldigt
  v\u00e4lkommen att kontakta mig!\\n\\nUtbildningsutskottet\\n\\nVill du vara med
  och p\u00e5verka din utbildning? Nu s\u00f6ker utbildningsutskottet studenter som
  vill jobba med utbildningsrelaterade fr\u00e5gor, s\u00e5 som: Hur ser de aff\u00e4rsjuridiska
  programmen ut idag? Finns det n\u00e5got som beh\u00f6ver f\u00f6r\u00e4ndras/f\u00f6rb\u00e4ttras?
  Hur ska vi bli \u00e4nnu mer attraktiva p\u00e5 arbetsmarknaden? Hur m\u00e5r studenterna
  p\u00e5 programmet? Att engagera sig i utbildningsutskottet ger goda m\u00f6jligheter
  att vara med och p\u00e5verka dels genom att lyfta studierelaterade fr\u00e5gor
  till programr\u00e5det, dels genom egna id\u00e9er.\\n\\nUtbildningsutskottet kommer
  i \u00e5r att best\u00e5 av studenter fr\u00e5n \u00e5rskurs 1, 2 och 3, som ut\u00f6ver
  att vara utskottsmedlemmar, \u00e4ven kommer vara \u00e5rskursrepresentanter. Att
  vara \u00e5rskursrepresentant inneb\u00e4r bland annat att du efter varje avslutad
  kurs samlar in klassens \u00e5sikter om kursen (du anv\u00e4nder dig fr\u00e4mst
  av utv\u00e4rderingen som g\u00f6rs p\u00e5 studentportalen) och har ett m\u00f6te
  med kursansvarig f\u00f6r respektive kurs och framf\u00f6r klassens \u00e5sikter.
  Du kommer att arbeta tillsammans med dina kollegor i utskottet och s\u00e5ledes
  g\u00e5 p\u00e5 m\u00f6ten tillsammans med minst en till.\\n\\nAtt engagera sig
  i utbildningsutskottet \u00e4r b\u00e5de roligt och givande, det \u00e4r en merit
  f\u00f6r framtiden samtidigt som det ger v\u00e4rdefulla engagemangspo\u00e4ng.
  Det kr\u00e4vs inga f\u00f6rkunskaper utan du beh\u00f6ver bara vara positiv och
  villig att engagera dig! L\u00e5ter detta som n\u00e5got f\u00f6r dig?\\n\\nSkicka
  ett mejl till Madelen Laituri, firstname.lastname@example.org med:\\n\\n1. Namn\\n2.
  \u00c5rskurs och inriktning\\n3. Varf\u00f6r du vill engagera dig\\n\\nGivetvis
  \u00e4r du v\u00e4lkommen att skicka in eventuella fr\u00e5gor!\\n\\nMarknadsf\u00f6ringsprojektgrupp\\n\\nH\u00e4r
  finns en helt unik chans att vara med och utforma det nya marknadsf\u00f6ringsprojektgruppen.
  Projektet \u00e4r i uppstartsfas och vi s\u00f6ker dig som \u00e4r kreativ, har
  m\u00e5nga id\u00e9er och inte \u00e4r r\u00e4dd f\u00f6r att ta egna initiativ.\\n\\nTanken
  \u00e4r att vi som grupp ska utforma id\u00e9er om hur de aff\u00e4rsjuridiska programmen
  ska kunna synas ut\u00e5t, dels mot nya aff\u00e4rsjuriststudenter, dels mot f\u00f6retag
  och n\u00e4ringsliv.\\n\\nUtskottets syfte \u00e4r att str\u00e4va efter att skapa
  kreativa och roliga id\u00e9er f\u00f6r att uppm\u00e4rksamma f\u00f6reningen och
  programmet ytterligare. Marknadsf\u00f6ringsprojektgruppen ansvarar, som tidigare
  n\u00e4mnt, f\u00f6r att marknadsf\u00f6ra AJF och dess olika program.\\n\\nDet
  roligaste med marknadsf\u00f6ringsprojektgruppen \u00e4r att det startas upp fr\u00e5n
  grunden det h\u00e4r \u00e5ret, vilket inneb\u00e4r stor frihet d\u00e4r man har
  m\u00f6jlighet att arbeta efter sina egna villkor tillsammans med projektledaren
  och programmets styrelse.\\n\\nHar du n\u00e5gra fr\u00e5gor eller funderingar?
  Hugg tag i n\u00e5gon av styrelsens ledam\u00f6ter i skolan eller h\u00f6r av dig
  via telefon/ mail.\\n\\nL\u00e5ter detta som n\u00e5got f\u00f6r dig?\\n\\nSkicka
  ett mejl till email@example.com eller ring 073-076 25 72 med:\\n\\n1. Namn\\n2.
  \u00c5rskurs och inriktning\\n3. Varf\u00f6r du vill engagera dig\\n\\nAlumniutskottet\\n\\nHar
  du n\u00e5gon g\u00e5ng funderat \u00f6ver vad som egentligen h\u00e4nder n\u00e4r
  man l\u00e4gger ovven p\u00e5 hyllan och sista tentan \u00e4r skriven? Svaren h\u00e4mtas
  genom att driva sp\u00e4nnande projekt och events med alumniutskottet, d\u00e4r
  f\u00f6re detta affjurare inkluderas.\\n\\nAlumniutskottets uppgift \u00e4r att
  bevara och st\u00e4rka kontakten med utexaminerade studenter. Utskottet \u00e4r
  relativt ungt och d\u00e4rmed har du m\u00f6jlighet att komma med nya id\u00e9er
  som med stor sannolikhet kan f\u00f6rverkligas. Tidigare projekt har bl.a. varit
  att anordna alumnipubar, g\u00e4stf\u00f6rel\u00e4sningar, \\\"skugga en alumn\\\",
  skriva en alumnitidning och annat roligt. Nytt f\u00f6r f\u00f6reg\u00e5ende verksamhets\u00e5r
  var \\\"m\u00e5nadens alumn\\\", vilket blev ett extremt uppskattat projekt. S\u00e5
  l\u00e4nge alumner inkluderas har du, tillsammans med utskottet, relativt fria tyglar
  att anordna nya roliga och sp\u00e4nnande projekt.\\n\\nTill alumniutskottet s\u00f6ker
  jag dig som \u00e4r kreativ, driven och engagerad. Du ska kunna samarbeta bra med
  \u00f6vriga utskottsmedlemmar, v\u00e5ga anta nya utmaningar och inte vara r\u00e4dd
  f\u00f6r att komma med nya id\u00e9er.\\n\\nVill du vara med och ha ett roligt och
  l\u00e4rorikt \u00e5r genom att utveckla alumniutskottet och st\u00e4rka samarbeten
  mellan studenter och alumner, \u00e4r det alumniutskottet du ska s\u00f6ka. Skicka
  d\u00e5 ett mail till Elin Karlsson, firstname.lastname@example.org med:\\n\\n1.
  Namn\\n2. \u00c5rskurs\\n3. En kort beskrivning om dig sj\u00e4lv\\n4. Varf\u00f6r
  du vill engagera dig i alumniutskottet\\n\\nArbetsmilj\u00f6utskott\\n\\nVill du
  vara med och p\u00e5verka dina studier och bidra till att v\u00e5rt program och
  universitet blir b\u00e4ttre? AJF:s Arbetsmilj\u00f6ombud s\u00f6ker nu utskottsmedlem
  som vill g\u00f6ra just detta. Som utskottsmedlem och vice arbetsmilj\u00f6ombud
  \u00e4r du tillsammans med AMO ansvarig f\u00f6r den fysiska och psykiska arbetsmilj\u00f6n
  p\u00e5 programmet. Det kan t ex vara problem med f\u00f6rel\u00e4sningssalar, studieplatser
  eller likabehandling och stress.\\n\\nVarf\u00f6r ska du s\u00f6ka? Du f\u00e5r
  en chans att tr\u00e4ffa studenter fr\u00e5n b\u00e5de v\u00e5rt och andra program.
  En m\u00f6jlighet att p\u00e5verka genom att komma med egna id\u00e9er om hur du
  vill att AMO ska arbeta och fungera. En bra merit till framtiden samt v\u00e4rdefulla
  engagemangspo\u00e4ng inf\u00f6r utlandsstudier. Men framf\u00f6rallt ett roligt
  och utvecklande \u00e5r!\\n\\nTycker du att det h\u00e4r l\u00e5ter som n\u00e5got
  f\u00f6r dig? Skicka ett mejl till Elin Arestr\u00f6m email@example.com med:\\n\\n1.
  Namn\\n2. \u00c5rskurs\\n3. Varf\u00f6r du vill engagera dig\\n\\nBihangetredaktionen\\n\\nHar
  du funderat p\u00e5 att engagera dig vid sidan av dina studier, samtidigt som du
  l\u00e4ngtat efter att f\u00e5 s\u00e4tta dina kreativa kunskaper i fokus? Ligger
  det dig varmt om hj\u00e4rtat att skriva, fotografera, redigera bilder eller arbeta
  med layout och illustrationer? D\u00e5 ska du s\u00f6ka till Bihangets redaktion!
  Bihanget \u00e4r aff\u00e4rsjuristernas egna tidning, som ges ut till programmets
  alla studenter en g\u00e5ng per termin. Tillsammans med utskottet kommer du f\u00e5
  m\u00f6jlighet att intervjua sp\u00e4nnande och framg\u00e5ngsrika personer, skriva
  artiklar f\u00f6rknippat till v\u00e5rt fantastiska studentliv samt vara med och
  ta fram de nya upplagorna till Bihanget 17/18. Ut\u00f6ver dessa l\u00e4rorika erfarenheter
  kommer du \u00e4ven f\u00e5 med dig v\u00e4rdefulla engagemangspo\u00e4ng och en
  god merit att pryda ditt CV med.\\n\\nUtskottet kommer att tr\u00e4ffas p\u00e5
  ett antal lunchm\u00f6ten f\u00f6r att diskutera nya id\u00e9er och hj\u00e4lpa
  varandra under l\u00e4s\u00e5rets g\u00e5ng. Ut\u00f6ver det blir arbetet relativt
  individuellt s\u00e5 att du sj\u00e4lv kan strukturera upp just din uppgift, utefter
  din egen tid och vilja. Har du tidigare erfarenheter inom dessa omr\u00e5den \u00e4r
  det alltid v\u00e4lkomnat, men det finns absolut inget krav p\u00e5 f\u00f6rkunskap
  d\u00e5 det som v\u00e4ger absolut tyngst \u00e4r ett genuint intresse! Missa d\u00e4rf\u00f6r
  inte chansen att s\u00f6ka till Bihangets redaktion, kom igen det blir kul!\\n\\nF\u00f6r
  att bli en del av Bihangetredaktionen 17/18, skicka din ans\u00f6kan till Amelia
  Botshinda, firstname.lastname@example.org, med:\\n\\n1. Namn\\n2. \u00c5rskurs\\n3.
  Beskrivning varf\u00f6r du vill vara med, vad du \u00e4r mest intresserad av att
  g\u00f6ra\\n\\n(skriva/fotografera/layouta) och presentera g\u00e4rna nya id\u00e9er
  och f\u00f6rslag p\u00e5 vad just du skulle vilja f\u00f6r\u00e4ndra/se i Bihanget
  det kommande \u00e5ret.\\n\\nIT/Tryck-utskottet\\n\\nTycker du att det \u00e4r kul
  att skapa eller att vara kreativ? \u00c4r du teknisk eller tycker att sociala medier
  \u00e4r kul? D\u00e5 \u00e4r mitt utskott n\u00e5got f\u00f6r just dig. I IT/Tryck-utskottet
  kommer du att fungera som min h\u00f6gra hand. Jag s\u00f6ker n\u00e5gon som \u00e4r
  kreativ och har ett intresse f\u00f6r antingen sociala medier, hemsidor, design,
  kl\u00e4dtryck eller dylikt. Du kommer att bolla id\u00e9er med mig samt f\u00e5
  hj\u00e4lpa till med att g\u00f6ra diverse uppgifter inom utskottet. Det kan till
  exempel vara att g\u00f6ra en eventbild, uppdatera hemsidan etc. Vi kommer tillsammans
  att forma en plan \u00f6ver ditt arbete, beroende p\u00e5 vad du \u00e4r intresserad
  av att g\u00f6ra.\\n\\nJag kr\u00e4ver inga tidigare erfarenheter men sj\u00e4lvklart
  \u00e4r det ett plus om man kan program s\u00e5som Photoshop, Illustrator eller
  InDesign. Det viktigaste f\u00f6r mig \u00e4r att du k\u00e4nner att du har ett
  intresse och att du vill l\u00e4ra dig! Det kommer vara ett fritt arbete som inte
  kommer att kr\u00e4va flera timmar i veckan, men \u00e4r meriterande om du i framtiden
  har ett intresse av att t.ex. s\u00f6ka AJF-styrelsen.\\n\\nK\u00e4nner du dig intresserad
  av att arbeta sida vid sida med mig f\u00f6r att f\u00e5 AJF att synas, mejla mig,
  Gustav Spetz, p\u00e5 email@example.com med f\u00f6ljande information:\\n\\n1. Namn\\n2.
  \u00c5rskurs\\n3. Varf\u00f6r du vill vara med i utskottet\\n4. Vad tror du att
  du kommer att kunna tillf\u00f6ra i utskottet? Tidigare erfarenheter inom IT eller
  Tryck?\\n\\nEvenemangsutskottet\\n\\n\u00c4r du kreativ och id\u00e9rik? Tycker
  du om att anordna och genomf\u00f6ra olika aktiviteter och evenemang? D\u00e5 tycker
  jag verkligen att du ska s\u00f6ka till Evenemangsutskottet! Att vara en del av
  Evenemangsutskottet inneb\u00e4r att vi tillsammans under \u00e5ret planerar och
  genomf\u00f6r diverse typer av roliga aktiviteter och evenemang. V\u00e5rt arbetes
  slutm\u00e5l \u00e4r att skapa en god sammanh\u00e5llning inom den aff\u00e4rsjuridiska
  familjen. Tillsammans kommer vi bland annat att anordna och arrangera Europaresan,
  AFFJUR-pubar, aktivitetskv\u00e4llar, AFFJURturnering med sittning samt en fulsittning
  m.m. Det \u00e4r egentligen bara fantasin som s\u00e4tter gr\u00e4nserna.\\n\\nL\u00e5ter
  detta som n\u00e5got f\u00f6r dig? Skicka iv\u00e4g ett mail till Agnes Andersson,
  firstname.lastname@example.org med:\\n\\n1. Namn\\n2. \u00c5rskurs\\n3. Varf\u00f6r
  vill du engagera dig\""]'
