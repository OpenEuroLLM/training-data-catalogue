  planerar, dokumenterar och f\u00f6ljer upp utifr\u00e5n IBIC.\\n\\nHar ni sammanst\u00e4llt
  uppgifter fr\u00e5n IBIC f\u00f6r verksamhetens systematiska kvalitetsarbete?\\n\\nEtt
  syfte med IBIC \u00e4r att kunna \u00e5teranv\u00e4nda den strukturerade dokumentationen
  f\u00f6r olika syften som exempelvis verksamhetsutveckling och kvalitetsarbete.\\n\\nTabell
  21. Andel kommuner som sammanst\u00e4llt uppgifter f\u00f6r kvalitetsarbete inom
  verksamhet f\u00f6r barn med funktionsneds\u00e4ttning.\\n\\n|  |  | Antal |  |
  Procent |\\n|---|---|---|---|---|\\n| Ja | 6 |  | 4% |  |\\n| Nej | 131 |  | 91%
  |  |\\n| Vet inte | 7 |  | 5% |  |\\n| Total | 144 |  | 100% |  |\\n\\nI kommentarerna
