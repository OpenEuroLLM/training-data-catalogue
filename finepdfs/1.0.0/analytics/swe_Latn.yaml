  "\"V\u00e4gen till EU \u2013 eller fr\u00e5n ? 1\\n\\n1 Tabl\u00e5n avser att fr\u00e4mja
  EU-debatten.  Vi har utformat den med tanke p\u00e5 diskussionen p\u00e5 Klockriketeatern
  i Helsingfors 27.4.2009 kl 19-,  som leds av regiss\u00f6r Kristin Olsoni, inleds
  av filosoferna  B\u00f6\u00f6k och Wallgren och forts\u00e4tts av kandidaterna i
  eurovalet Almqvist, Hautala och M\u00e5nsson samt deltagarna i publiken.  (MB, TW,
  KO)\\n\\n2 Jfr F\u00f6rslag till avtal om grundadet av Europeiska Unionen,  utarbetat
  av Altiero Spinelli och godk\u00e4nt av Europaparlamentet i februari 1984. (http://www.spinellisfootsteps.info)\\n\\n3   EU:s
  sk Lissabonstrategi har som m\u00e5l att g\u00f6ra Europa till v\u00e4rldens mest
  konkurrenskraftiga,  dynamiska och kunskapsbaserade ekonomi 2010.\"", "\"\u2758\u2759\u275a\\n\\nm\u00e5nadens
  epiztel\\n\\nTrak\u00e9kvalster hos bin, paratuberkulos hos bison och polyomavirus
  hos hamster avhandlas denna g\u00e5ng.\\n\\nEpizteln \u00e4r ett samarbete mellan
  Statens veterin\u00e4rmedicinska anstalt (SVA) och Jordbruksverket och \u00e4r i
  det h\u00e4r numret sammanst\u00e4lld av Helena Ohlsson, SVA och Charlotta Lindqvist,
  Jordbruksverket.\\n\\nTRAK\u00c9KVALSTER\\n\\nI en f\u00f6rs\u00e4ndelse av importerade
  bin fr\u00e5n Chile diagnostiserades parasiten trak\u00e9kvalster. Detta i samband
  med den rutinanalys som Jordbruksverket l\u00e5tit utf\u00f6ra d\u00e5 det kan finnas
  en risk f\u00f6r nyintroduktion av djursjukdom i landet.\\n\\nDe importerade bina
  avlivades och destruerades den 24 april. De aktuella bina hade dessf\u00f6rinnan
  h\u00e5llits \u00e5tskilda fr\u00e5n svenska bin i karant\u00e4nsliknande milj\u00f6.\\n\\nSvenska
  biodlare har anm\u00e4lningsplikt f\u00f6r n\u00e5gra sjukdomar och skadeg\u00f6rare
  som drabbar bin. Parasiten trak\u00e9kvalster, Acarapis woodi, \u00e4r en av dessa
  som kontrolleras vid import. Trak\u00e9kvalstret finns i binas andningsv\u00e4gar,
  trak\u00e9erna, och lever av binas hemolymfa (blod).\\n\\nTrak\u00e9kvalster har
  hittills inte p\u00e5visats hos det svenska honungsbiet. Parasiten finns dock i
  n\u00e4stan hela Europa samt i m\u00e5nga andra l\u00e4nder utanf\u00f6r EU. Risken
  \u00e4r stor att parasiten f\u00f6rs in till Sverige vid ink\u00f6p av levande bin
  fr\u00e5n l\u00e4nder d\u00e4r parasiten finns. Av den anledningen uppmanar Jordbruksverket
  de biodlare som importerar bin att l\u00e5ta provta bin fr\u00e5n big\u00e5rdar
  i andra l\u00e4nder som man vill importera fr\u00e5n, innan bin skickas till Sverige.
  Jordbruksverket kommer kontinuerligt att f\u00f6lja upp med provtagning p\u00e5
  de bin som f\u00f6rs in till Sverige.\\n\\nJordbruksverket betraktar inte fynden
  av trak\u00e9kvalster som att Sverige har ett utbrott av parasiten. Tv\u00e4rtom
  \u00e4r sannolikheten l\u00e5g att den finns etablerad bland svenska honungsbin.
  Jordbruksverket har nyligen l\u00e5tit utf\u00f6ra en inventering efter trak\u00e9kvalster.
  Inventeringen slutf\u00f6rs nu under v\u00e5ren och en absolut majoritet av alla
  prov \u00e4r analyserade. Inga trak\u00e9kvalster \u00e4r hittills p\u00e5visade.\\n\\nMISSTANKE
  OM RABIES\\n\\nUnder april skickades en r\u00e4v skjuten i V\u00e4rmland till SVA.
  Anamnesen inneh\u00f6ll uppgifter om att den hade hittats av en grupp hundar och
  sedan s\u00f6kt kontakt med och f\u00f6ljt efter hund \u00e4garna. R\u00e4ven, en
  vuxen hane, hade dessutom varit halt och sl\u00e4pat ena bakbenet. Hullet var medelgott
  och muskulaturen var v\u00e4l utvecklad och symmetrisk. Inga sjukliga f\u00f6r\u00e4ndringar
  s\u00e5gs p\u00e5 kroppen och de inre organen vid obduk tionen. I \u00f6vervakningssyfte
  togs p\u00e5 grund av beteendef\u00f6r\u00e4ndringen prov f\u00f6r rabies, vilket
  utf\u00f6ll negativt. Vidare mikroskopisk unders\u00f6kning p\u00e5g\u00e5r.\\n\\nMISSTANKE
  OM PARATUBERKULOS\\n\\nEn djur\u00e4gare i \u00d6sterg\u00f6tland kontaktade Svenska
  Djurh\u00e4lsov\u00e5rden ang\u00e5ende en tre \u00e5r gammal bison som var importerad
  fr\u00e5n Danmark. Kon hade d\u00e5ligt hull sedan en tid tillbaka. De senaste m\u00e5naderna
  hade hon magrat av \u00e4nnu mer, dragit sig undan flocken och hade diarr\u00e9.\\n\\n\u25a0
  \u25a0 Telefonnumret till SVAs epizootolog jour \u00e4r 018-67 40 01.\\n\\n\u25a0
  \u25a0 Detta nummer kan enbart anv\u00e4ndas d\u00e5 SVAs v\u00e4xel \u00e4r st\u00e4ngd,
  dvs utanf\u00f6r ordinarie arbetstid. Epizootijouren ger r\u00e5d och hj\u00e4lp
  till veteri n\u00e4rer vid misstanke om epizootisjukdom. Provsvar eller allm\u00e4nna
  r\u00e5d kan inte ges p\u00e5 detta nummer.\\n\\nEn djur\u00e4gare i \u00d6sterg\u00f6tland
  kontaktade Svenska Djurh\u00e4lsov\u00e5rden ang\u00e5ende en mager bisonko som
  var importerad fr\u00e5n Danmark. Bilden visar en frisk bisontjur.\\n\\n\u00d6vriga
  djur i flocken var i gott skick och de hade parasitkontroll i bes\u00e4ttningen.
  Kon skicka des in f\u00f6r unders\u00f6kning f\u00f6r paratuberkulos. Vid misstanke
  om paratuberkulos g\u00f6rs unders\u00f6kning b\u00e5de med PCR och odling. Hitintills
  \u00e4r resultatet fr\u00e5n PCR-unders\u00f6kningen klart och det var negativt,
  odling p\u00e5g\u00e5r.\\n\\nkommer en s\u00e4rskild \u00f6vervakningsaktivitet
  att genomf\u00f6ras i Svenska Djurh\u00e4lsov\u00e5rdens regi d\u00e4r riktade provtagningar
  av magra kor kommer att genomf\u00f6ras i hela landet.\\n\\nSTARK MISSTANKE OM POLYOMAVIRUS
  HOS HAMSTER\\n\\nEn hamster som obducerades p\u00e5 SVA konstaterades ha 1\u20133
  millimeter stora nodul\u00e4ra nybildningar som varierade i f\u00e4rg fr\u00e5n
  vita till m\u00f6rkare bruna. Vid mikroskopisk unders\u00f6kning av f\u00f6r\u00e4ndrade
  omr\u00e5den s\u00e5gs tum\u00f6rer utg\u00e5ende fr\u00e5n h\u00e5rs\u00e4ckarnas
  epitelceller (trikoepiteliom). Dessa tum\u00f6rer upptr\u00e4der s\u00e4llan spontant
  hos hamster utan \u00e4r oftast orsakad av hamsterpolyomavirus (HPyV), \u00e4ven
  kallat hamsterpapovavirus, ett virus som orsakar tum\u00f6rer hos s\u00e5v\u00e4l
  guldhamster (Mesocricetus auratus) som euro peisk hamster (Cricetus cricetus).\\n\\nHPyV
  anses vara ovanligt hos svenska hamstrar och i det aktuella fallet r\u00f6rde det
  sig om importerade djur. Misst\u00e4nkt virusorsakade tum\u00f6rer har dock p\u00e5visats
  i landet vid tidigare tillf\u00e4llen, och infektion med HPyV b\u00f6r alltid misst\u00e4nkas
  d\u00e5 fler \u00e4n en hamster (g\u00e4ller i synnerhet unga djur) i en koloni
  drabbas av tum\u00f6rer. \u00c4ven om inte sjukdom orsakad av HPyV \u00e4r anm\u00e4lningspliktig
  enligt K4, b\u00f6r konfirmerade fall anm\u00e4las p\u00e5 grund av att HPyV inte
  normalt f\u00f6rekommer i landet.\\n\\nParatuberkulos \u00e4r vanligt f\u00f6rekommande
  i m\u00e5nga l\u00e4nder utanf\u00f6r Sverige. Inkubationstiden \u00e4r l\u00e5ng
  och diagnostiken har l\u00e5g k\u00e4nslighet p\u00e5 djur som inte har utvecklat
  kliniska symtom. \u00c4ven om import\u00f6rer provtar djuren finns det risk att
  infekterade individer inte uppt\u00e4cks. Paratuberkulos b\u00f6r misst\u00e4nkas
  vid kronisk avmagring och diarr\u00e9 och importbakgrund \u00e4r en viktig anamnestisk
  uppgift. Under \u00e5ret\\n\\n\u2758\u2759\u275a noterat\\n\\nBeslutet om karenstider
  dras tillbaka\\n\\n\u2758\u2759\u275a Svensk Travsport drog den 2 maj med omedelbar
  verkan tillbaka beslutet om karenstid p\u00e5 96 timmar f\u00f6r 32 produkter innan
  travh\u00e4star till\u00e5ts t\u00e4vla.\\n\\nSubklinisk infektion med HPyV f\u00f6rekommer
  och det finns inget botemedel eller vaccin. Eftersom det i dagsl\u00e4get inte g\u00e5r
  att identifiera subkliniskt infekterade hamstrar som poten tiellt \u00e4r smittf\u00f6rande,
  \u00e4r det enda effektiva s\u00e4ttet att eliminera HPyV fr\u00e5n en koloni d\u00e4rf\u00f6r
  att avliva sjuka individer och isolera eller avliva kontaktdjur. Eftersom HPyV kan
  \u00f6verleva i milj\u00f6n under l\u00e4ngre tid m\u00e5ste samtliga hamster utrymmen
  och inredningar reng\u00f6ras noggrant och desinficeras. \u25a0\\n\\nbeslutet och
  det beklagar jag. Nu ska vi lyssna av travsportens intressenter och p\u00e5 nytt
  lyfta fr\u00e5gan i den nordiska samarbetsorganisationen f\u00f6r medicinerings-
  och dopningsfr\u00e5gor innan vi best\u00e4mmer oss f\u00f6r hur karenstidsreglerna
  vidare skall hanteras, s\u00e4ger Svensk Travsports generalsekreterare Ulf H\u00f6rnberg.\\n\\n\u2013
  Vi underskattade spr\u00e4ngkraften i ling, verkligen \u00e4r motiverad. Det \u00e4r
  produkter som i flera fall funnits p\u00e5 marknaden i decennier och som m\u00e5nga
  anv\u00e4nder i den dagliga omv\u00e5rdnaden av sina h\u00e4star.\\n\\nKritiken
  handlar om karenstiden f\u00f6r de produkter med sm\u00e4rtstillande effekt som
  tidigare fritt kunnat anv\u00e4ndas, men som nu \u00e5lagts 96 timmars karenstid
  f\u00f6re t\u00e4v-\\n\\nBeslutet om de nya karenstidsreglerna togs p\u00e5 nordisk
  niv\u00e5 genom NEMAC, en samarbetsorganisation f\u00f6r att harmonisera Nordens
  medicinerings- och dopningsregler inom travsporten.\\n\\nK\u00e4lla: pressmeddelande
  fr\u00e5n Svensk Travsport den 2 maj. \u25a0\"", "\"Svenska Australian Cattledog
  Klubben (SACK)\\n\\nRasklubb inom SBK-organisationen\\n\\nKALLELSE TILL EXTRA MEDLEMSM\u00d6TE
  MED SVENSKA CATTLEDOG KLUBBEN\\n\\nDatum: 29 april 2017, kl. 15.00\\n\\nPlats: Fagersta
  BK\\n\\nHej alla medlemmar!\\n\\nH\u00e4rmed meddelar SACK kallelse till extra medlemsm\u00f6te.\\n\\nAnledningen
  till detta \u00e4r att det under \u00e5rsm\u00f6tet den 4 mars 2017 blev fel vid
  valet av ledamot och suppleanter. Detta resulterade i att det blev en person f\u00f6r
  mycket i styrelsen (8 personer) vilket inte \u00e4r till\u00e5tet enligt SBKs stadgar
  f\u00f6r rasklubbar. Enligt tidigare beslut och stadgar ska styrelseantalet vara
  sju (7) personer.\\n\\nSACK har varit i kontakt med SBK centralt, via kansli- och
  f\u00f6rbundsstyrelsepersonal, som fastst\u00e4llt hur \u00e4rendet ska sk\u00f6tas
  och fortskrida. De val som ska g\u00f6ras om i samband med det extra medlemsm\u00f6tet
  \u00e4r en ledamot och tv\u00e5 suppleanter. Valberedningens f\u00f6rslag ligger
  enligt \u00e5rsm\u00f6tet fortfarande kvar.\\n\\nV\u00e4l m\u00f6tt p\u00e5 m\u00f6tet!\\n\\nVerkst\u00e4llande
  utskott SACK\\n\\nPlusgiro: 22 79 46-1\\n\\nOrg.nr: 802433-4446\"", "\"LIBER\\n\\nPROGRAMMERING\\nOCH
  DIGITAL\\nKOMPETENS\\n\\nExtramaterial till Matematik Gamma\\n\\nNIV\u00c5\\nUTVECKLA\\nNIV\u00c5\\nTR\u00c4NA\\n\\nSymmetri\\n\\nL\u00c4RARE\\n\\nDu
  och dina elever kommer nu att f\u00e5 bekanta er med de digitala verktygen Desmos
  Geometry och Pattern Shapes fr\u00e5n the Math Learning Center. Med hj\u00e4lp av
  verktyget Geometry kan eleverna rita och rotera olika geometriska figurer. P\u00e5
  s\u00e5 s\u00e4tt kan de skapa vackra m\u00f6nster. Pattern Shapes anv\u00e4nder
  eleverna sedan f\u00f6r att forts\u00e4tta skapa m\u00f6nster genom att t\u00e4cka
  en yta med geometriska figurer. Ett s\u00e4tt att arbeta med m\u00f6nster \u00e4r
  genom tesselering som de f\u00e5r bekanta sig med h\u00e4r.\\n\\nElevuppgifterna
  g\u00e5r att l\u00f6sa p\u00e5 flera niv\u00e5er. D\u00e4rf\u00f6r ing\u00e5r b\u00e5de
  Tr\u00e4na och Utveckla.\\n\\nF\u00f6rutom elevuppgifterna finns \u00e4ven tv\u00e5
  \\\"lathundar\\\" d\u00e4r de viktigaste funktionerna i Desmos Geometry och Pattern
  Shapes finns beskrivna.\\n\\nSYFTE\\n\\nSyftet med \u00f6vningen \u00e4r att eleven
  ska\\n\\n\u25a0 \u25a0 bekanta sig med digitala hj\u00e4lpmedel.\\n\u25a0 \u25a0
  kunna anv\u00e4nda ett digitalt hj\u00e4lpmedel f\u00f6r att konstruera geometriska
  figurer.\\n\u25a0 \u25a0 tr\u00e4na p\u00e5 att f\u00f6rutsp\u00e5 hur en figur
  ser ut n\u00e4r den roterats ett visst antal grader.\\n\u25a0 \u25a0 f\u00e5 se
  skillnaden mellan om en figur roteras kring sin mittpunkt eller ett h\u00f6rn.\\n\u25a0
  \u25a0 f\u00e5 erfarenhet av att rotera geometriska figurer med hj\u00e4lp av ett
  digitalt hj\u00e4lpmedel.\\n\u25a0 \u25a0 anv\u00e4nda digitala hj\u00e4lpmedel
  f\u00f6r att skapa m\u00f6nster av geometriska figurer.\\n\u25a0 \u25a0 f\u00e5
  erfarenhet av att skapa m\u00f6nster med tesselering.\\n\\nTIDS\u00c5TG\u00c5NG\\n\\nEn
  till tv\u00e5 lektioner beroende p\u00e5 hur m\u00e5nga och/eller komplicerade m\u00f6nster
  eleverna skapar.\\n\\nKOSTNAD\\n\\nGratis\\n\\nUTRUSTNING\\n\\nDatorer eller l\u00e4rplattor
  samt webbsidorna https://www.desmos.com/geometry?lang=sv-SE\\n\\noch https://apps.mathlearningcenter.org/pattern-shapes/\\n\\nPattern
  shapes g\u00e5r \u00e4ven att ladda ned som app h\u00e4r: https://www.mathlearningcenter.org/apps/pattern-shapes\\n\\nREDOVISNING\\n\\nUnder
  lektionens g\u00e5ng kan du g\u00e5 runt och f\u00f6lja elevernas arbete. Uppmuntra
  dem till att anv\u00e4nda sig av matematiska begrepp. Be dem ber\u00e4tta f\u00f6r
  dig hur de t\u00e4nkt. Skapa en utst\u00e4llning av elevernas verk.\\n\\nDet g\u00e5r
  inte att spara eller dela n\u00e5got fr\u00e5n Desmos Geometry om man inte har ett
  konto. Kontrollera vilken policy skolan har kring detta med tanke p\u00e5 GDPR.
  Eleverna kan ta sk\u00e4rmdumpar och p\u00e5 s\u00e5 vis dela sitt arbete med dig.\\n\\nEn
  elev som vill dela sitt arbete i Pattern Shapes med dig klickar p\u00e5 \\\"Share\\\".\\n\\nD\u00e4refter
  v\u00e4ljer eleven hur det ska delas.\\n\\nBilden kan sparas eller kopieras f\u00f6r
  att sedan klistras in ett annat dokument/mail.\\n\\nMan kan kopiera en l\u00e4nk,
  som man sedan delar via mail till exempel.\\n\\nEller generera en kod som man delar
  med sin l\u00e4rare.\\n\\nOm du som l\u00e4rare f\u00e5tt en kod av en elev, klickar
  du p\u00e5 symbolen med nyckeln och skriver in koden f\u00f6r att komma \u00e5t
  elevens arbete.\\n\\nEleverna kan ocks\u00e5 ta sk\u00e4rmdumpar och klistra in
  bilden i ett annat dokument eller ett mail.\\n\\nFALLGROPAR\\n\\nN\u00e4r man ritat
  en figur i Desmos Geometry, m\u00e5ste man \\\"st\u00e4nga den\\\" genom att klicka
  p\u00e5 den f\u00f6rsta punkten igen.\\n\\nF\u00f6r att \u00e4ndra f\u00e4rg eller
  markera en figur, beh\u00f6ver man byta till verktyget \\\"Select\\\" f\u00f6rst.\\n\\nSj\u00e4lva
  proceduren f\u00f6r att rotera figur kan upplevas som sv\u00e5r av vissa elever,
  d\u00e5 instruktionerna i Geometry \u00e4r p\u00e5 engelska. I elevuppgiften och
  lathunden finns proceduren beskriven p\u00e5 svenska.\\n\\nArbetet med att skapa
  m\u00f6nster i Pattern Shapes kan vara ganska tids\u00f6dande om man l\u00e4gger
  till en geometrisk form i taget. Uppmuntra eleverna till att kopiera delar som anv\u00e4nds
  ofta, dels f\u00f6r att spara tid, dels f\u00f6r att uppt\u00e4cka vilka mindre
  delar m\u00f6nstret \u00e4r uppbyggt av och vilka delar som \u00e5terkommer.\\n\\nPEDAGOGISKA
  TIPS\\n\\nTesta g\u00e4rna verktyget sj\u00e4lv f\u00f6rst. D\u00e5 f\u00e5r du
  en f\u00f6raning om vilka eventuella problem eleverna kommer att st\u00f6ta p\u00e5.\\n\\nVisa
  g\u00e4rna de viktigaste funktionerna f\u00f6r eleverna i helklass innan ni s\u00e4tter
  ig\u00e5ng. I lathundarna finns en beskrivning av verktygen som kan anv\u00e4ndas
  som underlag f\u00f6r genomg\u00e5ng.\\n\\nPassa p\u00e5 att samarbeta med \u00e4mnena
  bild och/eller sl\u00f6jd f\u00f6r att ytterligare tydligg\u00f6ra geometrins estetiska
  v\u00e4rden. Symmetriska m\u00f6nster anv\u00e4nds till exempel i tapeter, tyger,
  mattor, kakel och lappt\u00e4cken.\\n\\nF\u00d6RM\u00c5GOR\\n\\n\u25a0 \u25a0 anv\u00e4nda
  och beskriva matematiska begrepp och samband mellan begrepp,\\n\u25a0 \u25a0 formulera
  och l\u00f6sa problem med hj\u00e4lp av matematik och v\u00e4rdera valda strategier,\\n\u25a0
  \u25a0 f\u00f6ra och f\u00f6lja matematiska resonemang,\\n\u25a0 \u25a0 anv\u00e4nda
  matematikens uttrycksformer f\u00f6r att samtala om och redog\u00f6ra f\u00f6r fr\u00e5gest\u00e4llningar,
  ber\u00e4kningar och slutsatser.\\n\\nCENTRALT INNEH\u00c5LL\\n\\n\u25a0 \u25a0
  Grundl\u00e4ggande geometriska tv\u00e5- och tredimensionella objekt samt deras
  egenskaper och inb\u00f6rdes relationer. Konstruktion av geometriska objekt, s\u00e5v\u00e4l
  med som utan digitala verktyg.\\n\u25a0 \u25a0 Symmetri i planet och hur symmetri
  kan konstrueras.\\n\\nELEVUPPGIFTER MED KOMMENTARER OCH FACIT\\n\\nSymmetri\\n\\nDEL
  1: Rotation kring mittpunkt\\n\\n1. Eleven \u00f6ppnar Desmos Geometry och l\u00e4gger
  till rutn\u00e4tet p\u00e5 arbetsytan.\\n2. Eleven skapar en kvadrat.\\n3. Med hj\u00e4lp
  av Desmos ska vi rotera kvadraten. Hur m\u00e5nga grader beh\u00f6ver den ursprungliga
  kvadraten rotera f\u00f6r att bilden ska se ut s\u00e5 h\u00e4r?:\\n4. Det finns
  flera r\u00e4tta svar. Kom du p\u00e5 fler \u00e4n ett svar? Vilka?\\n\\nSvar: 90\u00b0
  (eller 180\u00b0, 270\u00b0, 360\u00b0\u2026. osv)\\n\\nSvar: Se ovan. S\u00e5 l\u00e4nge
  det \u00e4r en multipel av 90\u00b0 kommer den roterade kvadraten likna den ursprungliga.\\n\\n5.
  Eleven roterar kvadraten med hj\u00e4lp av Desmos och testar sitt svar fr\u00e5n
  uppgift 3 och 4:\\n6. Eleven testar att rotera olika geometriska figurer runt mittpunkten
  och experimenterar med olika vinklar, former och storlekar p\u00e5 figurerna.\\n\\nKommentar:
  F\u00f6r att \u00e5stadkomma m\u00f6nstret med den orangea kvadraten ovanp\u00e5
  den bl\u00e5, beh\u00f6ver man skapa tv\u00e5 separata rotationer.\\n\\nDEL 2: Rotation
  kring ett h\u00f6rn\\n\\n1. Eleven f\u00f6r ett resonemang kring hur hen tror att
  bilden ser ut efter att kvadraten roterat 90\u00b0 \u00e5t v\u00e4nster, runt det
  nedre v\u00e4nstra h\u00f6rnet.\\n2. Eleven ritar en kvadrat och roterar den 90\u00b0
  \u00e5t v\u00e4nster, runt det nedre v\u00e4nstra h\u00f6rnet, med hj\u00e4lp av
  Desmos Geometry.\\n\\nS\u00e5 h\u00e4r ser det ut:\\n\\n3. Eleven kommenterar resultatet
  och j\u00e4mf\u00f6r med sitt svar p\u00e5 uppgift 1.\\n4. Eleven f\u00f6r ett resonemang
  kring hur kvadraten ser ut efter att eleven genomf\u00f6rt tv\u00e5 ytterligare
  rotationer.\\n\\n5. Eleven testar sin hypotes med hj\u00e4lp av Desmos Geometry.\\n\\nS\u00e5
  h\u00e4r ser det ut:\\n\\n6. Eleven rensar arbetsytan s\u00e5 bara den ursprungliga
  kvadraten finns kvar alternativt laddar om sidan och ritar en ny kvadrat.\\n7. Eleven
  diskuterar vad som h\u00e4nder om man roterar kvadraten 45\u00b0 ist\u00e4llet f\u00f6r
  90\u00b0.\\n8. Eleven testar med hj\u00e4lp av Desmos Geometry.\\n\\nS\u00e5 h\u00e4r
  ser det ut:\\n\\n9. Eleven unders\u00f6ker, med hj\u00e4lp av Desmos Geometry, hur
  m\u00e5nga g\u00e5nger kvadraten beh\u00f6ver roteras totalt f\u00f6r att den ska
  ha roterat ett helt varv, om den roterar 45\u00b0 \u00e5t g\u00e5ngen.\\n\\nSvar:
  8 g\u00e5nger beh\u00f6ver rotationen p\u00e5 45\u00b0 genomf\u00f6ras. S\u00e5
  h\u00e4r ser det ut:\\n\\n10. Eleven resonerar kring ett eventuellt samband mellan
  antalet rotationer och vinkelns storlek.\\n\\nR\u00e4tt svar: Sambandet \u00e4r
  att produkten av antalet rotationer och antalet grader \u00e4r 360\u00b0.\\n\\n4
  \u2219 90\u00b0 = 360\u00b0\\n\\n8 \u2219 45\u00b0 = 360\u00b0\\n\\n11. Eleven f\u00f6r
  ett resonemang kring hur m\u00e5nga rotationer som beh\u00f6vs om vinkeln \u00e4r
  36\u00b0 ist\u00e4llet f\u00f6r 45\u00b0.\\n\\nAntalet rotationer som beh\u00f6vs
  \u00e4r 10 eftersom 10 \u2219 36\u00b0 = 360\u00b0\\n\\n12. Eleven experimenterar
  vidare med rotationer p\u00e5 egen hand eller i par. Hen unders\u00f6ker olika figurer
  och vinklar och f\u00f6rs\u00f6ker skapa olika m\u00f6nster.\\n\\nDEL 3: Tesselering
  med kvadrater, trianglar och sexh\u00f6rningar\\n\\n1. Eleven \u00f6ppnar \\\"Pattern
  Shapes\\\" och l\u00e4gger till det kvadratiska rutn\u00e4tet i bakgrunden.\\n2.
  Eleven l\u00e4gger till en kvadrat och testar olika funktioner, som att \u00e4ndra
  storlek och/ eller f\u00e4rg, rotationer och kopiering.\\n3. Eleven skapar ett m\u00f6nster
  med kvadrater.\\n4. Eleverna visar sina m\u00f6nster varandra f\u00f6r att f\u00e5
  inspiration f\u00f6r att skapa nya m\u00f6nster.\\n5. Eleven tillverkar fler m\u00f6nster
  med hj\u00e4lp av den liksidiga triangeln respektive sexh\u00f6rningen.\\n\\nDEL
  4: Estetisk symmetri med olika geometriska figurer\\n\\n1. Eleven forts\u00e4tter
  att med m\u00f6nster i \\\"Pattern Shapes\\\" genom att v\u00e4lja andra geometriska
  figurer och kombinera dessa p\u00e5 olika s\u00e4tt.\\n2. Eleven sparar och/eller
  delar sina m\u00f6nster.\"", "\"Mat.se, Uber och Helpling i unikt samarbete\\n\\nTre
  ledande ondemandplattformar \u2013 Uber, Helpling och Mat.se \u2013 samarbetar i
  Stockholm och G\u00f6teborg l\u00f6rdagen den 5 september f\u00f6r att frig\u00f6ra
  v\u00e4rdefull tid f\u00f6r storstadsborna. Uberanv\u00e4ndare kommer via Uberappen
  enkelt kunna best\u00e4lla st\u00e4dhj\u00e4lp fr\u00e5n Helpling och matvaror fr\u00e5n
  Mat.se hem till d\u00f6rren. Det b\u00e4sta av allt; tj\u00e4nsten \u00e4r helt
  gratis!\\n\\nUber, en appbaserad plattform f\u00f6r transporttj\u00e4nster, Helpling,
  en ledande st\u00e4dtj\u00e4nstplattform och Mat.se, Sveriges f\u00e4rskaste matbutik
  p\u00e5 n\u00e4tet med hemleverans, samarbetar i Stockholm och G\u00f6teborg l\u00f6rdagen
  den 5 september. Samarbetet mellan de tre varum\u00e4rkena syftar till att frig\u00f6ra
  tid f\u00f6r anv\u00e4ndare samt visa p\u00e5 enkelheten i nya digitala l\u00f6sningar.
  Tj\u00e4nsten uberHOME, som kommer att finnas tillg\u00e4nglig i Uberappen, levererar
  st\u00e4dhj\u00e4lp fr\u00e5n Helpling och matvaror fr\u00e5n Mat.se hem till d\u00f6rren
  utan kostnad f\u00f6r anv\u00e4ndaren.\\n\\n\\\"Under helgen vill man hinna med
  annat \u00e4n att st\u00e4da och handla mat. Genom detta samarbete frig\u00f6r vi
  tid f\u00f6r v\u00e5ra anv\u00e4ndare som de kan anv\u00e4nda till roligare saker.
  Vi vill visa hur l\u00e4tt man kan f\u00f6renkla sin tillvaro med bara ett knapptryck\\\",
  s\u00e4ger Lina Areblad, marknadsansvarig p\u00e5 Uber.\\n\\nGustaf H\u00e4llgren,
  marknadschef p\u00e5 Helpling till\u00e4gger: \\\"Genom att samarbeta kan vi erbjuda
  en unik produkt. Den som gillar att testa nya produkter och tj\u00e4nster l\u00e4r
  \u00e4lska det h\u00e4r samarbetet\\\".\\n\\nSyftet med samarbetet \u00e4r att visa
  anv\u00e4ndarna hur den nya tidens ondemandtj\u00e4nster kan nyttjas i realtid genom
  bara ett par klick.\\n\\n\\\"Det k\u00e4nns j\u00e4ttekul att sy ihop v\u00e5ra
  tre tj\u00e4nster f\u00f6r att underl\u00e4tta f\u00f6r personer boende i Stockholm
  och G\u00f6teborg. Varf\u00f6r l\u00e4gga tid p\u00e5 att \u00e5ka till aff\u00e4ren
  n\u00e4r man kan f\u00e5 f\u00e4rskare r\u00e5varor direkt till d\u00f6rren?\\\",
  s\u00e4ger Karolina R\u00e4ntfors, marknadsansvarig Stockholm p\u00e5 Mat.se.\\n\\nS\u00e5
  funkar samarbetet\\n\\nAnv\u00e4ndare i Stockholm och G\u00f6teborg kan mellan klockan
  11:00 och 16:00 l\u00f6rdagen den 5 september via Ubers app enkelt v\u00e4lja att
  best\u00e4lla tj\u00e4nsten uberHOME. Det \u00e4r ett paket d\u00e4r Helpling st\u00e4dar
  k\u00f6ket och Mat.se fyller kundens k\u00f6k med f\u00e4rska matvaror. Kort efter
  best\u00e4llningen kommer en st\u00e4dpartner fr\u00e5n Helpling hem till anv\u00e4ndaren
  som ocks\u00e5 har med sig matvaror fr\u00e5n Mat.se. Anv\u00e4ndaren m\u00e5ste
  se till att vara hemma och sl\u00e4ppa in Helplings representant, f\u00f6r att sedan
  kunna njuta av annat \u00e4n st\u00e4dning och storhandling. F\u00f6r att l\u00e5sa
  upp uberHOME anger anv\u00e4ndaren koden uberhome15 under ''erbjudanden'' i Uberappen.\\n\\nTj\u00e4nsten
  \u00e4r helt gratis f\u00f6r anv\u00e4ndaren: Uber st\u00e5r f\u00f6r transporten
  och plattformen, Helpling f\u00f6r st\u00e4dningen och Mat.se f\u00f6r matvarorna.\\n\\nF\u00f6r
  mer information om samarbetet:\\n\\nKarolina R\u00e4ntfors, Marknadsansvarig Mat.se,
  0725 22 23 10, email@example.com Lina Areblad, Marknadsansvarig Uber, firstname.lastname@example.org
  Gustaf H\u00e4llgren, Marknadschef Helpling, email@example.com\\n\\nOm Mat.se\\n\\nMat.se
  \u00e4r en matbutik p\u00e5 n\u00e4tet och har Sveriges f\u00e4rskaste matvaror,
  bra priser och ett stort ekologiskt sortiment. F\u00f6rutom m\u00f6jligheten att
  v\u00e4lja fritt ur ett brett sortiment av varor erbjuds inspirerande recept, f\u00e4rdiga
  veckomenyer samt m\u00f6jlighet att skapa egna menyer. Best\u00e4llningar kan g\u00f6ras
  fram till midnatt f\u00f6r levereras n\u00e4sta vardag. Varorna levereras i obruten
  kylkedja med kylbil till din d\u00f6rr.\\n\\nOm Uber\\n\\nUber \u00e4r ett teknikf\u00f6retag
  som kopplar samman anv\u00e4ndare med f\u00f6rare i realtid. Ubers plattform erbjuder
  transportalternativ i fler \u00e4n 330 st\u00e4der i 60 l\u00e4nder och utvecklar
  d\u00e4rmed s\u00e4ttet som m\u00e4nniskor tar sig runt i st\u00e4der v\u00e4rlden
  \u00f6ver.\\n\\nL\u00e4s mer om Uber p\u00e5 www.uber.com\\n\\nOm Helpling\\n\\nHelpling
  \u00e4r en ny smart marknadsplats online som noggrant matchar kunder med st\u00e4dare
  och m\u00f6jligg\u00f6r en direkt bokning p\u00e5 mindre \u00e4n minut, antingen
  via hemsida eller app. Med Helpling s\u00e5 slipper du allt extra krux som offertbes\u00f6k,
  bindningstider och komplicerade prislistor. S\u00e5 \u00e4ven ifall du redan har
  en st\u00e4dare s\u00e5 kan Helpling anv\u00e4ndas f\u00f6r att spontanboka en st\u00e4dning
  n\u00e4r det beh\u00f6vs, dag som kv\u00e4ll, helg som vardag.\\n\\nF\u00f6r ytterligare
  information kontakta:\\n\\nKarolina R\u00e4ntfors, marknadsansvarig Stockholm, tel
  0725-22 23 10, e-post: firstname.lastname@example.org\\n\\nMatse Holding AB best\u00e5r
  av Matse AB, Cold Cargo Sweden AB, Kokaihop Media AB.\\n\\nMatse AB driver en fullsortimentsbutik
  p\u00e5 n\u00e4tet, Mat.se, med hemleverans av varor av h\u00f6g kvalitet.\\n\\nKokaihop
  Media AB skapar gl\u00e4dje i k\u00f6ket med inspiration och recept fr\u00e5n matsajterna
  Kokaihop.se och Spisa.nu.\\n\\nCold Cargo Sweden ABerbjuder kostnadseffektiva hemleveranser
