  "\"Menighedsm\u00f8de s\u00f8ndag den 27. juni 2021 BERETNING 2020 FOR HAURVIG MENIGHEDSR\u00c5D\\n\\n(I
  henhold til bekendtg\u00f8relse af lov om menighedsr\u00e5d kap 7, st\u00e5r der
  i \u00a7 41 bl.a. f\u00f8lgende: \\\"Menighedsr\u00e5det indkalder en gang om \u00e5ret
  til et menighedsm\u00f8de, hvor r\u00e5det redeg\u00f8r for sidste \u00e5rs regnskab
  og det kommende \u00e5rs budget. Menighedsr\u00e5det afl\u00e6gger beretning om
  r\u00e5dets virksomhed i det forl\u00f8bne \u00e5r og orienterer om den planlagte
  virksomhed i det kommende \u00e5r\\\".)\\n\\nI 2020 havde vi et driftsbudget p\u00e5
  kr. 535.000,00 \u2013 vi sluttede med et driftsoverskud p\u00e5 kr. 22.026,00, hvilket
  is\u00e6r skyldes de kirkelige aktiviteter, vi i 2020 m\u00e5tte aflyse p\u00e5
  grund af coronarestriktioner. (foredrag, grundlovsgudstjenester mv.)\\n\\nPr.1.
  januar 2021 udgjorde menighedsr\u00e5dets frie midler p\u00e5 ca. kr. 127.000,00.\\n\\nBudgettet
  for 2021 p\u00e5 kr. 495.000,00 overholder vi indtil videre fint. Vi har fra provstiudvalget
  for 2022 modtaget et forel\u00f8bigt ligningstilsagn p\u00e5 kr. 495.000, men har
  indsendt et driftsbudget p\u00e5 kr. 539.700, hvilket giver et underskud p\u00e5
  kr. 44.700. At budgettet giver underskud, fremkommer is\u00e6r pga. de hjemfaldne
  gravstedslegater, som i 2022 er betydelig mindre end sidste \u00e5r, hvilket provstiet
  ikke fuldt ud tager hensyn i forbindelse med deres budgetudmelding.\\n\\nFor at
  f\u00e5 budgettet til at h\u00e6nge sammen \u2013 (det har ikke v\u00e6ret muligt
  at finde yderligere besparelser \u2013 og Haurvig er i forvejen det sogn i provstiet
  med den mindste ligning) - har vi derfor anmodet provstiet om enten tildeling af
  flere ligningsmidler eller om lov til at d\u00e6kke underskuddet af de frie midler.  Umiddelbart
  har man fra provstiets side meldt ud, at man - groft sagt - vil bruge de overskud,
  der har v\u00e6ret i 2020 til afvikling af provstiets g\u00e6ld. \u2013 Men tiden
  m\u00e5 vise, hvad det ender ud med. Vi har v\u00e6ret til m\u00f8de med provstiudvalget
  og f\u00f8lte en vis velvillighed, nu m\u00e5 vi se.\\n\\n2020 var i Haurvig Menighedsr\u00e5d,
  som alle andre steder is\u00e6r pr\u00e6get af Covid-19. \u00c5ret startede ellers
  ud, som normalt. Der var kyndelmissekoncert med Pernille Tommerup og Henrik Gantzel
  den 2. februar, og inden landet lukkede, n\u00e5ede vi at afvikle yderligere 2 kirkeh\u00f8jskoleaftner
  med henholdsvis Sune Auken omkring NFS Grundtvig og Peter Balslev-Clausen om BS
  Ingeman. Det sidste foredrag med Annesofie Overgaard Aastrup Munch om Karl Laurids
  Aastrup, der skulle have fundet sted den 17. marts, m\u00e5tte vi aflyse. Den 10.
  december lykkedes det at afvikle den efterh\u00e5nden traditionsrige julekoncert
  med Skjern Messing Kvintet. Endnu engang en fantastisk koncert, men dog noget amputeret,
  - ganske f\u00e5 havde vovet sig til koncerten, vi ikke m\u00e5tte synge, og vi
  m\u00e5tte undv\u00e6re den traditionelle kaffe i Haurvig Missionshus.\\n\\nSom
  bekendt var der menighedsr\u00e5dsvalg i 2020. For det f\u00f8rste var der tale
  om en ny valgform med nyt regels\u00e6t og nye procedurer, med orienteringsm\u00f8de
  og valgforsamling, som det hedder nu. En del nye formaliteter, som vi m\u00e5tte
  s\u00e6tte os ind i, og for det andet blev det hele lidt mere kompliceret, fordi
  frister og datoer hele tiden blev \u00e6ndret p\u00e5 grund af coronarestriktionerne.
  Men det korte af det lange er, at valget blev afviklet den 15. september med en
  rigtig fin tilslutning, og Karen blev valgt ind i menighedsr\u00e5det.\\n\\nOg da
  vi troede, at covid 19 ville v\u00e6re et overst\u00e5et f\u00e6nomen i efter\u00e5ret
  2020, planlagde vi en ny kirkeh\u00f8jskoles\u00e6son \\\"Om fletningen mellem j\u00f8dedom
  og kristendom\\\". Her n\u00e5ede vi kun at afvikle et enkelt foredrag den 20. oktober
  med generalsekret\u00e6r i Israelmissionen Arne Pedersen. Da vi i efter\u00e5ret
  kunne se, at coronarestriktionerne trak i langdrag, besluttede vi at aflyse resten
  af foredragsr\u00e6kken og i stedet genoptage den i s\u00e6sonen 2021/2022.\\n\\nSom
  bekendt har det i \u00f8vrigt det meste af 2020 b\u00f8lget op og ned om, hvad der
  var tilladt, og is\u00e6r hvad der ikke var tilladt i kirken. Restriktioner, som
  is\u00e6r vores sognepr\u00e6ster og bestemt ogs\u00e5 du Sonja hele tiden skulle
  forholde Jer til, og som I har v\u00e6ret fantastisk fleksible omkring med streaming,
  udend\u00f8rs h\u00f8jtalere og elastikker p\u00e5 b\u00e6nkene og aflysning af
  gudstjenester, is\u00e6r aflysning af p\u00e5ske- og julegudstjenesterne gjorde
  ondt.\\n\\nOgs\u00e5 andre at de aktiviteter, vi i Haurvig Menighedsr\u00e5d er
  med til at arrangere, var p\u00e5virket af Covid-19, s\u00e5ledes m\u00e5tte vi
  aflyse sogneaftener, sogneudflugt, og spissammen-arrangementer, ligesom den nystartede
  menighedspleje har st\u00e5et p\u00e5 lavt blus.\\n\\nDer har v\u00e6ret afholdt
  6 \\\"almindelige\\\" menighedsr\u00e5dsm\u00f8der, herunder 1 digitalt, der var
  kirkesyn den 10. juni med deltagelse af provst og bygningskonsulent, og der har
  v\u00e6ret 3 f\u00e6lles menighedsr\u00e5dsm\u00f8der. I \u00f8vrigt blev kirken
  i for\u00e5ret forsynet med nye l\u00e5se, der blev installeret alarmsystem, og
  der er opsat projektor.\\n\\nVi har udarbejdet og f\u00e5et godkendt nye kirkeg\u00e5rdsvedt\u00e6gter.
  Med udgangen af 2020 har vi sagt farvel til vores mange\u00e5rige regnskabsf\u00f8rer
  Kristen Lauridsen, og regnskabet varetages fra og med 2021 af provstiets f\u00e6lles
  regnskabskontor ved Alex Wejse.\\n\\nUltimo 2020 fik vi jo s\u00e5 meldingen om,
  at Daniel havde s\u00f8gt nye udfordringer, hvilket iv\u00e6rksatte den for menighedsr\u00e5det
  sp\u00e6ndende opgave, det er at ans\u00e6tte en ny pr\u00e6st. En proces, der is\u00e6r
  primo 2021 har kr\u00e6vet rigtig mange m\u00f8der, men som det har v\u00e6ret utrolig
  sp\u00e6ndende at v\u00e6re en del af.\\n\\nOg hvad har vi s\u00e5 af planer for
  det kommende \u00e5r.\\n\\nA jourf\u00f8ring og digitalisering af kirkeg\u00e5rdskort
  forventer vi bliver afsluttet i \u00e5r. En drone har taget billeder af kirkeg\u00e5rden,
  og Ella og Sonja er lige nu i gang med at s\u00e6tte numre p\u00e5. De skal s\u00e5
  i l\u00f8bet af efter\u00e5ret p\u00e5 kursus i at betjene det nye system. Det kr\u00e6ver
  selvf\u00f8lgelig lige lidt tilv\u00e6nning med s\u00e5dan et nyt system, men det
  skal nok blive godt.\\n\\nLige nu st\u00e5r kirken s\u00e5 fin, og vi har en rigtig
  smuk kirkeg\u00e5rd, men hvor vi jo alle kan se, at der bliver mere og mere plads.
  Vi kan ikke blot lade st\u00e5 til. Der er kommet nye begravelsesformer. Hvad kan
  vi g\u00f8re for at opretholde/\u00f8ge aktiviteten p\u00e5 kirkeg\u00e5rden og
  eventuel lette vedligeholdelsen? Vi har derfor s\u00f8gt provstiudvalget om midler
  til at hyre en landskabsarkitekt for at f\u00e5 udarbejdet en landskabsplan for
  kirkeg\u00e5rden. Vi vil i den forbindelse i menighedsr\u00e5det i l\u00f8bet af
  \u00e5ret lave en brainstorming og tage en grundig snak om de forslag, der kommer,
  s\u00e5 vi har et gennemarbejdet projekt, inden vi f\u00e5r bes\u00f8g af arkitekten.\\n\\nHver
  gang vi har provsten med p\u00e5 kirkesyn, kommer der en bem\u00e6rkning om, at
  der ikke er adgang til k\u00f8restolsbrugere til toilet. \u2013 S\u00e5 selv om
  toilet og Sonjas frokoststue, p\u00e5 grund af en sodskade her i vinter er blevet
  renoveret indvendig, er nye velf\u00e6rdsbygninger ogs\u00e5 p\u00e5 sigt noget
  vi vil arbejde med. Vi har bedt provstiudvalget om et bel\u00f8b til forunders\u00f8gelse
  heraf. Helt sikkert et projekt, hvor vi ogs\u00e5 kan s\u00f8ge midler hos \\\"Tilg\u00e6ngelighedspuljen\\\".\\n\\nOg
  s\u00e5 har vi s\u00f8gt midler til en eventuel udskiftning af s\u00f8jlerne ved
  indgangen. Som vi kan se, bliver s\u00f8jlerne hele tiden ved med at skalle af,
  s\u00e5 det er noget, vi p\u00e5 sigt skal have gjort noget ved. Nu har vi s\u00f8gt,
  s\u00e5 ved man i provstiudvalget, at det er noget, der engang skal afs\u00e6ttes
  midler til.\\n\\nI \u00f8vrigt h\u00e5ber vi nu, at der igen kommer gang i de forskellige
  kirkelige aktiviteter. Vi h\u00e5ber p\u00e5 almindelige gudstjenester uden deltagerbegr\u00e6nsninger,
  afstandskrav, og hvor vi igen m\u00e5 synge.\\n\\nVi h\u00e5ber, at vi kan afvikle
  en ny s\u00e6son med sogneaftener og kirkeh\u00f8jskole, hvor emnet er: Om fletningen
  mellem j\u00f8dedom og kristendom. Brochure f\u00f8lger.\\n\\nVi h\u00e5ber, menighedsplejen,
  som vi i Haurvig ogs\u00e5 er en del af, kommer til at k\u00f8re. Det samme g\u00e6lder
  turistgudstjenesterne, sogneudflugten, der i \u00e5r er planlagt til den 22. september,
  og som g\u00e5r til Nationalpark Mols Bjerge, og spis-sammen arrangementet torsdag
  den 11. november.\\n\\nTil sidst vil jeg sige mange tak til mine kolleger i menighedsr\u00e5det
  for et godt og konstruktivt samarbejde.\\n\\nEsther Blichfeldt\"", "\"Hadsund Museumsforening
  & Lokalhistorisk Arkiv\\n\\nReferat fra m\u00f8de i Arkivgruppen onsdag 9. juni
  kl. 19.00 p\u00e5 Museet\\n\\nDeltagere:\\n\\nKetty Overgaard, Henrik Rasmussen,
  Birthe S\u00f8ndergaard, Ulla Knudsen, Ulla Olesen, Lene Gr\u00f8nbech, Birthe N\u00f8rdam
  Andersen, Christian Hagelskj\u00e6r, Dennis Lybech og Pia Karstens.\\n\\nDagsorden:\\n\\n1.Velkomst:\\n\\nDennis
  b\u00f8d velkommen\\n\\n2. Siden sidst:\\n\\nVi har f\u00e5et Visborg Arkiv til
  Hadsund. Materialer fra Visborg st\u00e5r p.t i Skolestuen p\u00e5 Museet. Dennis
  orienterede at Museumsinspekt\u00f8r Lykke Olesen er sygemeldt. En familie p\u00e5
  Havn\u00f8vej Har kontaktet Dennis om billeder af Svend skov. Vi skal finde ud af
  hvor vi kan have malerier. Da det er \\\"genstande\\\" har Dennis talt med Lykke
  om det.\\n\\nVi havde h\u00e5bet p\u00e5 at kunne f\u00e5 et lokale p\u00e5 Kulturcenteret,
  men det er forel\u00f8bigt p\u00e5 standby. Lykke skulle have lavet byvandring,
  men p\u00e5 grund af sygemelding vil Birthe N.A. og Dennis lave en p\u00e5 et tidspunkt.\\n\\nVi
  har f\u00e5et ny b\u00e6rbar computer og projektor til medlemshvervningen.\\n\\n3.
  Opstart i August:\\n\\nVi blev p\u00e5 m\u00f8det enige om af vi frivillige starter
  op tirsdag 3. juni kl. 13.30 For det offentlige \u00e5bner Lokalarkivet tirsdag
  10.august kl. 14.00 til 16.00\\n\\n4. Oprydning:\\n\\nDer tr\u00e6nger gevaldigt
  til at blive ryddet op. Den 3. august tager vi fat.\\n\\nIndtastning i Arkibas.
  Birthe N.A, og Ulla, Christian g\u00e5r igen i gang med at indtaste i Arkibas De
  tre og Pia vil hj\u00e6lpe resten af de frivillige i gang med Arkibas, n\u00e5r
  der kommet styr p\u00e5 det igen.\\n\\nHvordan f\u00e5r vi gang i noget produktivt
  arbejde: Pia melder ud om henvendelser og vi taler om, hvem, der g\u00f8r hvad p\u00e5
  arkivet.\\n\\nVi skiftes til de forskellige opgaver, s\u00e5 vidt muligt.\\n\\nBrug
  af IT og styr derp\u00e5: Christian har f\u00e5et ansvar for IT og er den som i
  samarbejde med kassereren indk\u00f8ber det som skal bruger til IT. Det der nu vil
  blive indk\u00f8bt er: En makulator. Og en printer med toner.\\n\\n6. Orientering
  om henvendelser til arkivet om diverse opgaver.\\n\\nDer er i Corona-tiden kommet
  flere henvendelser. Pia har svaret p\u00e5 dem, og lovet vi ser p\u00e5 det, n\u00e5r
  Arkivet      igen \u00e5bner op.\\n\\n7.Efter\u00e5rets program.\\n\\nVi har jo
  p\u00e5 grund af Corona ikke kunnet holde fort\u00e6llerv\u00e6rksted. Vi starter
  med Hitlers fotograf. Det bliver i Kulturcenteret.\\n\\nPia kontakter J\u00f8rgen
  Toubro om han vil holde foredrag i september.\\n\\n8.N\u00e6ste m\u00f8de:\\n\\nVi
  blev enige om at n\u00e6ste f\u00e6lles Arkivm\u00f8de bliver tirsdag 31. august
  kl. 19.00 p\u00e5 Museet.\\n\\n9. Eventuelt:\\n\\nEt godt m\u00f8de, hvor vi igen
  alle var samlet efter mange m\u00e5neder.\\n\\nReferent: Pia Karstens, 17.06.2021\"",
  "\"Kunstg\u00e5rden \u2013 Danmarks st\u00f8rste landgalleri\\n\\nVed grupper p\u00e5
  min. 20: gratis entr\u00e9  ved k\u00f8b af kaffe og kage\\n\\nBusparkering: Ja\\n\\nKunst
  gennem 50 \u00e5r fra 1968 - 2018\\n\\nSkiftende udstillinger og brugskunst med
  unikke gaveideer\\n\\nI landsbyen Skovby n\u00e6r Bogense finder du Danmarks st\u00f8rste
  landgalleri. Udstillingerne skifter l\u00f8bende, og der er over 50 forskellige
  kunstnere tilknyttet. Her finder du kunst indenfor alle genrer.\\n\\nKunstg\u00e5rden
  er et meget charmerende sted med skiftende udstillinger inden for forskellige genrer.
  Gennem 50 \u00e5r har Kunstg\u00e5rden dannet rammen om udstillinger med dansk og
  international kunst. I den smukke g\u00e5rd er rammerne sat for en dejlig oplevelse;
  der er noget for enhver smag i den store udstilling.\\n\\nKunstg\u00e5rden har altid
  et stort udvalg indenfor unikke gaveideer og brugskunst.\\n\\nI orangeriet byder
  den hyggelige caf\u00e9 p\u00e5 kaffe og kage. Boller, horn og lagkage er altid
  hjemmebagt. Som gruppe kan der ogs\u00e5 bestilles en let frokost efter aftale.\\n\\nGalleriets
  ejer fort\u00e6ller gerne Kunstg\u00e5rdens historie til grupper, mens de nyder
  kaffe og kage. Den traditionsrige og hyggelige julestue \u00e5bner sidst i oktober
  og lukker igen den 23. december. Til julestuen serveres der altid gl\u00f8gg og
  \u00e6bleskiver i cafeen.\\n\\nSe mere p\u00e5: www.kunst-gaarden.dk\"", "\"Bolderslev
  vandv\u00e6rk afholder ekstraordin\u00e6r generalforsamling , den 25. april 2018
  kl. 19.30 i Bolderslev forsamlingshus.\\n\\nDer var m\u00f8dt ca. 80 personer, hvoraf
  70 var stemmeberettigede.\\n\\nI h.t. g\u00e6ldende vedt\u00e6gter \u00a7 8 kunne
  der afgives 132 stemmer (stemmeberettigede som har flere ejendomme + fuldmagt).\\n\\nFormanden
  b\u00f8d velkommen.\\n\\n1. valg af dirigent\\n\\nPeter Thor Christesen blev valgt.\\n\\nReferent.
  Egon Greve\\n\\nStemmet\u00e6llere. Annemarie Bonnichsen og Mette Sk\u00f8tt\\n\\n2.
  forslag til vedt\u00e6gts\u00e6ndringer.\\n\\n\u00a78 \u00e6ndres: intet medlem
  har mere end 1 stemme uanset hvor mange ejendomme man ejer. Ingen fuldmagt. De \u00f8vrige
  ting i \u00a7 8 fastholdes.\\n\\nForinden afstemning var der debat om fdor og imod
  fdorslag til \u00e6ndringen.\\n\\nAfstemning.\\n\\nDer var 106 stemmer for \u00e6ndring
  af \u00a7 8 og 26 stemmer imod.\\n\\n\u00c6ndring af \u00a7  blev vedtaget.\\n\\n3.
  Valg til bestyrelsen.\\n\\nP\u00e5 valg.\\n\\nChristian Bonnichsen modtager ikke
  genvalg\\n\\nJohn Sk\u00f8dt modtager genvalg.\\n\\nForslag til  bestyyrelsen:\\n\\nJohn
  Sk\u00f8dt\\n\\nAndreas Bonde\\n\\nPreben S\u00f8rensen.\\n\\nAfstemning:\\n\\nJohn
  Sk\u00f8dt\\n\\nAndreas Bonde\\n\\n61 stemmer\\n\\n38 stemmer\\n\\nPreben S\u00f8rensen
  41 stemmer\\n\\nValgt til bestyrelsen: John Sk\u00f8dt og Preben S\u00f8rensen\\n\\nSuppleanter:\\n\\n1.
  suppleant. Andreas Bonde\\n2. suppleant Thomas Thomsen\\n\\nEvt.\\n\\nFormanden
  takkede Chrisitan Bonnichsen for sin tid i bestyrelsen.\\n\\nReferent.\\n\\ndirigent\\n\\nEgon
  Greve\\n\\nPeter Thor Christiensen\"", "\"Det Gr\u00f8nne Museum - Spor 2, Auning\\n\\nPROJEKTBESKRIVELSE:\\n\\nFakta
  om projekt\\n\\nBASE Erhverv as har opf\u00f8rt nyt museumsmagasin - Det Gr\u00f8nne
  Museum \u2013 Spor 2, som\u00a0omhandler 4 mindre ombygninger i eksisterende lokaler\u00a0med
  nye v\u00e6rksteder og velf\u00e6rdsfaciliteter, samt v\u00e5benmagasin.\\n\\nOver
  efter\u00e5ret 2017 og frem til sommeren 2018 opf\u00f8rtes det nye museumsmagasin
  som\u00a0et traditionelt byggeri i betonelementer, med indskudt d\u00e6k for teknik.\\n\\nHuset
  indeholder konservatorv\u00e6rksted, velf\u00e6rdsfaciliteter og magasiner til opbevaring
  af museumsgenstande.\\n\\nMagasinerne udf\u00f8res med affugteranl\u00e6g og som
  passiv hus uden opvarmning.\\n\\nKonstruktionernes robusthed g\u00f8r, at der lagres
  varme og kulde, og dermed er temperaturudsvinget over et d\u00f8gn minimal.\\n\\nOpgaven
  er et led i Jagt- og Skovbrugsmuseets udflytning til Dansk Landbrugsmuseum ved Gl.
  Estrup i Auning.\\n\\nProjektleder\\n\\nBase Erhverv a/s \u2022 Erhvervsbyvej 11,
  2 \u2022 8700 Horsens \u2022 Tlf: 7628 6000\\n\\nwww.baseerhverv.dk\u2022firstname.lastname@example.org\\n\\nBygherre:\\n\\nSlots-
