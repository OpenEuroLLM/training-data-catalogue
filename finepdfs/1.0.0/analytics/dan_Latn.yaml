sample: '["\"Ledhejseport ASSA ABLOY OH1042FG\\n\\nASSA ABLOY Entrance Systems\\n\\nStandardfarver\\n\\nStandardfarven
  p\u00e5 indersiden og ydersiden af ASSA ABLOY OH1042FG sektionsopdelt ledhejseport
  er anodiseret aluminium. Desuden f\u00e5s den speciallakeret i alle RAL- farver.\\n\\nassaabloyentrance.dk\\n\\nThe
  global leader in door opening solutions\\n\\nSektionsopdelt ledhejseport med vinduer
  i fuld bredde for maksimalt udsyn\\n\\nASSA ABLOY OH1042FG sektionsopdelt ledhejseport
  er en port med vinduer i fuld bredde, som er designet til at blive anvendt steder,
  hvor der er behov for lys og for at se eller blive set.\\n\\nAluminiumsrammer p\u00e5
  op til 3300 mm er forsynet med kun \u00e9n enkelt rude af h\u00e6rdet enkelt- eller
  dobbeltglas. I st\u00f8rre porte p\u00e5 op til 5500 mm anvendes kun to ruder i
  h\u00e6rdet glas. Det sikrer maksimalt lysindfald samt indkig og udsyn.\\n\\nShowrooms,
  hvor maksimal synlighed er vigtig, har is\u00e6r gavn af denne designfunktion. ASSA
  ABLOY OH1042FG har elegante paneler, som sammen med det store lysindfald giver en
  flot pr\u00e6sentation. Alt i alt et avanceret design, der passer perfekt til moderne
  bygninger og showrooms.\\n\\nSpecifikation af dimensioner\\n\\nPaneloptioner\\n\\nValgmuligheder
  aktivering og automatisering\\n\\nVL\\nHL\\nHHL\\nSL\\nLL\\nKorrosionsbestandig\\naluminiumsramme.\\n\\nVinduer\\n\\nI
  h\u00e6rdet enkelt- eller dobbeltglas.\\n\\nK\u00e6detr\u00e6k manuel drift\\nDer
  f\u00e5s to forskellige slags k\u00e6detr\u00e6k,\\nafh\u00e6ngigt af portens v\u00e6gt.\\nAlle
  manuelle\\nASSA ABLOY-porte\\nkan opgraderes\\nmed maskinerier\\nog automatisering.\\nCylinderl\u00e5se\\nKomplet
  l\u00e5s med h\u00e5ndtag og\\ncylinder til begge sider eller kun den ene side.\\nRadar\\nFotoceller\\nSlyngedetektor\\nFjernbetjening\\nTr\u00e6ktov\\nTrykknap\\nIndend\u00f8rs\\nUdend\u00f8rs\\n\\nStandardfarver
  udvendigt\\n\\nAluminium\\nAndre\\nfarver\\nP\u00e5\\nforesp\u00f8rg-\\nsel\\n\\nASSA
  ABLOY som ord og logo er varem\u00e6rker der tilh\u00f8rer ASSA ABLOY koncernen.\\n\\nassaabloyentrance.dk\\n\\nTekniske
  data er med forbehold for \u00e6ndringer uden varsel.\\n\\n\u00a9 ASSA ABLOY Entrance
  Systems AB\\n\\nQ4.0-2017\"", "\"95643_den_klassiske_.indd   1\\n\\nDEN KLASSISKE
  DOKUMENTARFILM\\n\\n95643_den_klassiske_.indd   2\\n\\nHvert brev i posts\u00e6kken
  er en hel verden for den, der sendte det, og for den, det blev sendt til. Alligevel
  kunne man have lyst til at bytte rundt p\u00e5 dem, omadressere hist og her, s\u00e5
  modtagerne opdagede, hvor meget deres enest\u00e5ende historier ligner hinanden.
  Jens Christian Gr\u00f8ndahl i essayet Night Mail (2006)\\n\\nTil Ida og Simon\\n\\n95643_den_klassiske_.indd   3\\n\\nS\u00f8ren
  Birkvad\\n\\nDEN KLASSISKE DOKUMENTARFILM\\n\\nFra offervilje til offermentalitet
  i genrens\u00a0hovedv\u00e6rker 1930\u20111960\\n\\nUniversity of Southern Denmark
  Studies in History and Social Sciences vol. 466\\n\\n\u00a9 Forfatteren og Syddansk
  Universitetsforlag 2014 Sats og tryk: Narayana Press Omslag: Donald Jensen, Unisats
  ApS ISBN 978\u201187\u20117674\u2011618\u20116\\n\\nUdgivet med st\u00f8tte fra:
  Avdeling for Samfunnsvitenskap ved H\u00f8gskolen i Lillehammer Forskningsutvalget,
  H\u00f8gskolen i Lillehammer Konsul George Jorck og Hustru Emma Jorck''s Fond Lillian
  og Dan Finks Fond \\\"Prosjekt Innlandsuniversitetet\\\", H\u00f8gskolen i Lillehammer\\n\\nBilledleverand\u00f8rer:\\n\\nDet
  Danske Filminstitut: 14, 163, 207 (begge), 209, 300, 341, 385 (begge), 394, 446,
  450, smudsomslagets bagside.\\n\\nBritish Film Institute:\\n\\n71, 94, 97, 101,
  112, 115, 122, 128 (begge), 142, 156, 173, 201 (begge), 213 (begge), 258, 266, 269
  (begge), 334, 349, 368 (nederst), 381, 402, 404 (begge), 419, smudsomslagets for-
  og bagside.\\n\\nForsidebillede fra The Plough That Broke the Plains (Pare Lorentz,
  1936) Bagsidebilleder fra Triumph des Willens (Leni Riefenstahl, 1935) og O Dreamland
  (Lindsay Anderson, 1953)\\n\\nMekanisk, fotografisk, elektronisk eller anden mangfoldigg\u00f8relse
  af denne bog er kun tilladt med forlagets tilladelse eller if\u00f8lge overenskomst
  med Copy-Dan.\\n\\nSyddansk Universitetsforlag Campusvej 55 5230 Odense M\\n\\nwww.universitypress.dk\\n\\n95643_den_klassiske_.indd   4\\n\\nForord\\n\\nDokumentarfilmen
  handler om det, som samfundet til enhver tid tager al\u2011 vorligt. Det virkelige
  liv, emner af offentlig interesse, de rene fakta. Selvom denne forventning til dokumentarismen
  igen og igen er blevet anf\u00e6gtet af blandt andre filmvidenskabsfolk, s\u00e5
  har den st\u00e5et st\u00e6rkt i den offentlige be\u2011 vidsthed i over 100 \u00e5r,
  fra stumfilmtidens hverdagstableauer til nutidens aktualitetsprogrammer i tv. Dokumentargenrens
  autoritet st\u00e5r og falder med denne tiltro til virkelighedsgehalten i den.\\n\\nDet
  er ogs\u00e5 p\u00e5 denne baggrund, at dokumentarfilmen fremst\u00e5r som en s\u00e5
  rig kilde til kultur- og mentalitetshistorisk indsigt. Dokumentarfilmens hi\u2011
  storie giver os direkte adgang til den normative tankegang og de ideologiske idealer
  bag vore skiftende forestillinger om \\\"det autentiske\\\" og \\\"oplysninger til
  borgerne om samfundet\\\". I over halvdelen af det forrrige \u00e5rhundrede var
  en rigtig dokumentarfilm noget, som konsoliderede publikums tillid til samfun\u2011
  dets indretning og de offentlige myndigheder. I den klassiske dokumentarfilm var
  samfundet grundl\u00e6ggende godt eller i f\u00e6rd med at blive det. I den mo\u2011
  derne dokumentarfilm fra og med 1960''erne blev dokumentarfilmen derimod stadig
  mere \\\"progressiv\\\", \\\"samfundskritisk\\\", \\\"afsl\u00f8rende\\\" og p\u00e5
  andre m\u00e5der antiautorit\u00e6r og trodsig. For mange i dag er en rigtig dokumentarfilm
  noget, som undergraver publikums tillid til samfundets indretning og de offentlige
  myndigheder.\\n\\nDen klassiske dokumentarfilm tilbyder en film- og kulturhistorisk
  forklaring p\u00e5, hvorfor og hvordan denne virkelighedsgenre i s\u00e5 h\u00f8j
  grad har skiftet virke\u2011 lighedssyn. Dette g\u00f8r bogen ved is\u00e6r at pege
  p\u00e5 offermentalitetens afl\u00f8sning af offerviljen i genrens ideologiske udvikling
  i den vestlige verden. Fordi dokumentarfilmen i s\u00e5 enest\u00e5ende grad spejler
  sin tids toneangivende id\u00e9er om det f\u00e6lles vel, m\u00e5 man i en dokumentarfilmhistorie
  i h\u00f8j grad indramme den lille historie i den store. Lad mig derfor i disse
  forord fremh\u00e6ve to af den store histories fikspunkter, som virker s\u00e6rlig
  relevant i denne sammenh\u00e6ng: Den f\u00f8rste verdenskrig og 68-ungdomsopr\u00f8ret.\\n\\nDen
  f\u00f8rste verdenskrig fremst\u00e5r i en almen forst\u00e5else som den epokale
  katastrofe, som ryster de gamle begreber om \u00e6re og offervilje, men som\\n\\n95643_den_klassiske_.indd   5\\n\\nogs\u00e5
  i mellemkrigstiden fremtvinger en umiddelbar genopfindelse af disse begreber. \\\"68\\\"
  fremst\u00e5r i den offentlige bevidsthed som offerviljens negation. I ungdomsopr\u00f8rets
  ideologi synes man at v\u00e6re et offer for samfundet, hvis man ofrer sig for Gud,
  konge og f\u00e6dreland.\\n\\nAf disse begivenheder spiller 68-opr\u00f8ret den
  mindste rolle i denne sammen\u2011 h\u00e6ng. Det er s\u00e5ledes en hovedpointe
  i historiefort\u00e6llingen bag filmhistorien, at 60''er-opr\u00f8ret p\u00e5 mange
  m\u00e5der blot fuldbyrder, hvad lange udviklingstr\u00e6k forinden havde lagt op
  til. Ungdomsopr\u00f8ret blev s\u00e5 hurtigt og overv\u00e6ldende en sejr, fordi
  de unge opr\u00f8rere l\u00f8b \u00e5bne d\u00f8re ind. De forhadte autoriteter
  var allerede faldet. Opr\u00f8ret skyldtes i h\u00f8jere grad tolerance end undertrykkelse.
  P\u00e5 vore n\u00e6rmeste breddegrader havde fremsynede politikere allerede forst\u00e5et,
  at det gammeldags hierarki og bureaukrati i universitetsverdenen tr\u00e6ngte til
  udskiftning. Den antiautorit\u00e6re kulturradikalisme i, og uden for, Skandina\u2011
  vien havde l\u00e6nge v\u00e6ret dominerende i den intellektuelle offentlighed,
  og allerede i 1950''erne blev en selvst\u00e6ndig ungdomskultur etableret under
  det folkek\u00e6re slogan \\\"Rebel Witout a Cause\\\".\\n\\nDenne relativisme inddrages
  sj\u00e6ldent i den dagsaktuelle debat. Selvom denne filmhistorie i en vis forstand
  fors\u00f8ger sig med en revisionistisk re\u2011 habilitering af det \\\"for\u00e6ldede\\\"\u00a0\u2013
  idet den direkte og indirekte minder om visse passiver i vor tid (offermentaliteten
  som den kommer til udtryk i visse symptomatiske dokumentarfilm) ved at pege p\u00e5
  visse aktiver i fortiden (of\u2011 ferviljen som den kommer til udtryk i andre dokumentarfilm)\u00a0\u2013
  er det mit h\u00e5b, at jeg til syvende og sidst undg\u00e5r den ahistoriske f\u00e6lde,
  som ligger i nutidens enten positive eller negative mytologisering af \\\"68\\\"
  som et af vor tids store vendepunkter.\\n\\nTiden indtil ungdomsopr\u00f8ret var
  jo ikke alene pr\u00e6get af stabile v\u00e6rdier, idylliske kernefamilier og naturlig
  autoritetstro, ligesom den ikke alene var pr\u00e6get af h\u00f8jreorienteret nationalisme,
  mandschauvinistisk tyranni og una\u2011 turlig autoritetstro. Tv\u00e6rtimod synes
  vor tids id\u00e9er om det progressive at v\u00e6re resultatet af en zigzag-bev\u00e6gelse
  af uro og orden og ofte indbyrdes re\u2011 verserende forestillinger om fremskridtet,
  som i 1930''erne, 40''erne og 50''erne fulgte efter den f\u00f8rste verdenskrigs
  periodedefinerende ragnarok. Af samme grund samler fremstillingen sig om netop disse
  ti\u00e5r, det vil sige den afg\u00f8rende latensperiode f\u00f8r 1968.\\n\\nIkke
  desto mindre vil man af disse introducerende bem\u00e6rkninger forst\u00e5, at \\\"68\\\"
  er min historie. Som en rigtig \\\"78''er\\\" (f\u00f8dt i 1955) har jeg levet min
  ungdom i opr\u00f8rets umiddelbare og p\u00e5 mange m\u00e5der mest problematiske
  efter\u2011\\n\\n95643_den_klassiske_.indd   6\\n\\nvirkninger som dansk- og filmvidenskabsstuderende
  p\u00e5 K\u00f8benhavns Universi\u2011 tet. Det er s\u00e5ledes p\u00e5 denne personlige
  baggrund, man m\u00e5 forst\u00e5 min interesse for det progressives r\u00f8dder
  i Vestens samtidshistorie og i dokumentarfilmen som \\\"den progressive mediegenre\\\".
  Sk\u00f8nt bogen best\u00e5r af 90\u2006% filmhistorie, vil den ikke bare v\u00e6re
  filmhistorie. Som filmhistoriker af min egen tid mener jeg blandt andet, udfordringen
  ligger i den kulturkritiske refleksion, som jeg synes, vi skylder vor universitetshumanistiske
  arv med mere end 10\u2006%.\\n\\nFor mig st\u00e5r og falder det hele s\u00e5ledes
  med denne vekselvirkning: At tale som b\u00e5de fagmand og borger. At tale om det
  almene gennem den h\u00f8jst mulige grad af faglig specifikation, heri ligger det
  humanistiske ideal. I denne prin\u2011 cipielle forst\u00e5else udtaler jeg mig
  ikke om tidens offervilje og offermentalitet i almindelighed, for det har samfundsdebatt\u00f8rer
  og forfattere, faghistorikere og fagfilosoffer allerede gjort, og p\u00e5 en bedre
  m\u00e5de end jeg vil kunne g\u00f8re. Jeg taler om disse begreber i s\u00e6rdeleshed:
  Som film. P\u00e5 denne konceptuelle baggrund beh\u00f8ver fremstillingen efter
  mit sk\u00f8n b\u00e5de fagsprogets specifikation og essayismens almeng\u00f8relse.
  P\u00e5 denne m\u00e5de kan man i bedste fald frig\u00f8re sig fra b\u00e5de det
  filatelistiske aspekt ved humaniora og debatkv\u00e6rnen.\\n\\nDesuden kan man m\u00e5ske
  p\u00e5 denne m\u00e5de tiln\u00e6rmelsesvist frig\u00f8re sig fra det, som vi alle
  mere eller mindre er afh\u00e6ngige af, nemlig tidens mode. Be\u2011 greber som
  \\\"offermentalitet\\\", \\\"modernitet\\\", \\\"postmodernisme\\\" og \\\"politisk
  korrekthed\\\" kommer p\u00e5 mode og g\u00e5r af mode igen, men det befriende i
  hi\u2011 storisk t\u00e6nkning er muligheden for at fastholde f\u00e6nomenet i tid,
  selvom det som modef\u00e6nomen h\u00f8rer op. Fordi alle og enhver i dag taler
  om offermenta\u2011 litet i et beklagende toneleje, mister begrebet ikke af den
  grund relevans. Til geng\u00e6ld best\u00e5r kunsten i det ubanale: At undg\u00e5
  den mekaniske gentagelse. At v\u00e6re uforsagt midt i alt det allerede sagte.\\n\\nDenne
  kunst opn\u00e5r man efter min mening bedst gennem en identifikation af f\u00e6nomenet
  som det konkrete, det vil sige som noget, der som tekst er bun\u2011 det af tid
  og sted. Ikke Ofret for Samfundet som et mekanisk omkv\u00e6d eller som et h\u00e5nligt
  vr\u00e6ngeudtryk, men som en pr\u00e6cis iagttagelse med og uden ironiens g\u00e5se\u00f8jne:
  Der er han, ofret for samfundet, og her er hun, \\\"ofret for samfundet\\\". At
  skille skidt og kanel ad\u00a0\u2013 at finde figuren som udtryk for det banale
  eller det ubanale\u00a0\u2013 er ikke en ontologisk \u00f8velse, men en hermeneutiskempirisk
  \u00f8velse for den filmvidenskabelige tekstanalytiker. Den g\u00e5r ud p\u00e5
  at fange f\u00e6nomenet i filmens tid og rum.\\n\\nMin fremstilling bygger p\u00e5
  en dr.phil.-afhandling (Birkvad 2009). Der er foretaget \u00e6ndringer og tilf\u00f8jelser
  i forhold til denne, men bogen vedkender sig\\n\\n95643_den_klassiske_.indd   7\\n\\nsit
  akademiske udspring. N\u00e5r jeg alligevel mener, den vil have almen interesse
  for kultur- og filmhistorisk interesserede l\u00e6sere i Skandinavien, skyldes det
  for det f\u00f8rste, at den er monografisk anlagt. Jeg tilbyder en samlet fort\u00e6lling,
  selvom kapitlerne i h\u00f8j grad lader sig l\u00e6se hver for sig. Vil man for
  eksempel undg\u00e5 det akademiske skoleridt, kan man springe bogens indledningskapitel
  over, og vil man g\u00e5 direkte til hjertet i fremstillingen, er kapitel 8, \\\"1945:
  Et barn er f\u00f8dt\u00a0\u2013 og et offer\\\", et godt bud. For det andet har
  min filmhisto\u2011 rie almen relevans p\u00e5 grund af den bem\u00e6rkelsesv\u00e6rdige
  opblomstring for dokumentarinteressen, som vi er vidner til i disse \u00e5r, og
  som blandt andet underbygges af den revolution i tilgangen til film, som den digitale
  onlinedistribution indeb\u00e6rer. De ber\u00f8mte film, som analyseres i denne
  bog, har ofte i praksis baseret sit ry p\u00e5 vonh\u00f6rensagen, men med de nye
  medieplatforme er ogs\u00e5 dokumentarfilmens klassiske periode blevet tilg\u00e6ngelig
  for alle.\\n\\nBogens brugbarhed indskriver sig desuden i en mere specifik, dansk
  og skandinavisk sammenh\u00e6ng. Den lader sig l\u00e6se i forl\u00e6ngelse af den
  l\u00e6rebog i den internationale dokumentarfilms samlede historie, \u00c5 fange
  virkeligheten. Dokumentarfilmens \u00e5rhundre (2007), som den norske filmhistoriker
  Bj\u00f8rn S\u00f8renssen har udgivet. Min bog tilbyder ogs\u00e5 et internationalt
  anlagt per\u2011 spektiv i forhold til den danske mediehistoriker Ib Bondebjergs
  to autoritative v\u00e6rker om den danske film- og tv-dokumentarismes historie,
  Virkelighedens fort\u00e6llinger. Den danske tv-dokumentarismes historie (2008)
  og Virkelighedsbilleder. Den moderne danske dokumentarfilm (2012). Endelig bidrager
  bogen til en dagsaktuel debat om offervilje og offermentalitet, som involverer b\u00e5de
  internationale specialister som den venstreorienterede, britiske filmhistoriker
  Brian Winston og en kulturkonservativ, dansk almenhistoriker som Henrik Jensen.\\n\\nI
  forbindelse med denne bogudgivelse vil jeg gerne udtrykke min taknem\u2011 melighed
  over for b\u00e5de officielle instanser og mennesker i min personlige omkreds, som
  har st\u00f8ttet projektet. Lilian og Dan Finks Fond, Konsul George Jorck og Hustru
  Emma Jorck''s Fond samt Prosjekt Innlandsuniversitet, Forsk\u2011 ningsutvalget
  og Avdelig for samfunnsvitenskap ved min daglige arbejdsplads, H\u00f8gskolen i
  Lillehammer, har st\u00f8ttet udgivelsen \u00f8konomisk. Min k\u00e6reste og partner
  Sys Svinding har v\u00e6ret en vigtig st\u00f8ttespiller undervejs. Det har mine
  b\u00f8rn, Simon og Ida, ogs\u00e5 v\u00e6ret, foruden min mor Inge Birkvad. Tak
  skal I have.\\n\\nLillehammer, december 2013 S\u00f8ren Birkvad\\n\\n95643_den_klassiske_.indd   8\\n\\n95643_den_klassiske_.indd   9\\n\\nIndhold\\n\\nForord
