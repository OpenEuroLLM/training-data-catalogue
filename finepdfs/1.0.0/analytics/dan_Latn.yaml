  udskiftning af vinduer samt udvendige d\u00f8re, herunder d\u00f8re fra trappe og
  ind til lejligheden.\\n\\nAndelshaverens vedligeholdelsespligt omfatter ogs\u00e5
  eventuelle n\u00f8dvendige udskiftninger af bygningsdele og tilbeh\u00f8r til boligen,
  s\u00e5 som f.eks. udskiftning af gulve og k\u00f8kkenborde. Andelshaverens vedligeholdelsespligt
  omfatter ogs\u00e5 forringelse, som skyldes slid og \u00e6ldelse.\\n\\nad dagsordenens
  pkt. 3: Vedt\u00e6gts\u00e6ndring vedr. overdragelse af andele:\\n\u00a7 14, stk.
  2 \u00e6ndres fra:\\nAndre andelshavere har dern\u00e6st fortrinsret. R\u00e6kkef\u00f8lge
  g\u00e5r efter anciennitet i foreningen. Dog har andelshavere, som \u00f8nsker at
  overtage en ledig nabolejlighed i samme opgang med henblik p\u00e5 sammenl\u00e6gning
  fortrinsret, uanset anciennitet. Sammenl\u00e6gningen skal foreg\u00e5 efter anvisningerne
  i \u00a7 11. Overholdes betingelserne ikke, vil tilladelse blive trukket tilbage,
  og nabolejligheden vil blive tilbudt til de \u00f8vrige berettigede.\\n\\nTILL\u00c6G\\nTIL
  VEDT\u00c6GTERNE FOR\\nANDELSBOLIGFORENINGEN ISTEDEGADE 87/SAXOGADE 86-90\\n\\n2006\\n\\ntil:\\nAndre
  andelshavere har dern\u00e6st fortrinsret. R\u00e6kkef\u00f8lge g\u00e5r efter anciennitet
  i foreningen. Dog har andelshavere, som \u00f8nsker at overtage en ledig nabolejlighed,
  underbo, overbo eller nabolejlighed i naboopgang, med henblik p\u00e5 sammenl\u00e6gning
  fortrinsret, uanset anciennitet dog s\u00e5ledes, at \\\"enkeltlejligheder har fortrinsret.
  Skulle flere berettigede v\u00e6re interesserede i lejligheden, overdrages lejligheden
  dog efter anciennitet i foreningen. Sammenl\u00e6gningen skal foreg\u00e5 efter
  anvisningerne i \u00a711. Overholdes betingelserne ikke, vil tilladelse blive trukket
  tilbage, og nabolejligheden vil blive tilbudt til de \u00f8vrige berettigede.\\n\\nS\u00e5ledes
  vedtaget p\u00e5 foreningens ekstraordin\u00e6re generalforsamling 15. juni 2006.\\n\\nUnderskrevet
  af bestyrelsen august 2008\\n\\n____________________________________\\n____________________________________\\n____________________________________\\n____________________________________\\n____________________________________\"",
  "\"REFERAT\\n\\nE/F Udsigten Margretheholm \u2013 ordin\u00e6r generalforsamling\\n\\nM\u00f8dested:
  Dirch Passers Alle 76, 2000 Frederiksberg\\nM\u00f8dedato: 18. maj 2017, kl. 18.00\\nFremm\u00f8dte:
  Der var repr\u00e6senteret 376 af foreningens lejligheder, repr\u00e6senterende
  33.081 af ejendommens i alt 40.547 stemmeberettigede fordelingstal, heraf repr\u00e6senterede
  Margretheholmen P/S de 29.096 fordelingstal.\\n\\nDagsorden\\n\\n1. Valg af dirigent.\\n2.
  Formandens afl\u00e6ggelse af \u00e5rsberetning og forel\u00e6ggelse af \u00e5rsregnskab
  til godkendelse.\\n3. Godkendelse af det kommende regnskabs\u00e5rs driftsbudget.\\n4.
  Dr\u00f8ftelse af st\u00f8rre vedligeholdelsesarbejder mv.\\n5. Forslag fra medlemmer
  eller bestyrelse.\\n6. Valg af suppleanter til bestyrelsen.\\n7. Valg af revisor.\\n8.
  Valg af administrator.\\n9. Eventuelt.\\n\\n1. Valg af dirigent.\\nBestyrelsen foreslog
  Per Holm fra DEAS A/S som dirigent. Forslaget blev enstemmigt vedtaget.\\n\\nDirigenten
  konstaterede at generalforsamlingen var lovligt indv\u00e6ret og afholdt i henhold
  til vedt\u00e6gternes bestemmelse samt at generalforsamlingen var beslutningsdygtig
  i dagsordenens punkter.\\n\\n2. Formandens afl\u00e6ggelse af \u00e5rsberetning
  og forel\u00e6ggelse af \u00e5rsregnskab til godkendelse.\\n\\nBestyrelsesformanden
  Bendix forelagde beretningen for det forgangne \u00e5r. Beretning er vedlagt referatet.\\n\\nFormanden
  fremh\u00e6vede kort i overskrifter beretningens indhold.\\n\\nDer fremkom enkelte
  afklarende sp\u00f8rgsm\u00e5l fra forsamlingen. Herefter blev beretningen taget
  til efterretning.\\n\\nForel\u00e6ggelse af \u00e5rsregnskab med revisors p\u00e5tegning
  til godkendelse.\\n\\nBestyrelsesformanden fremlagde \u00e5rsregnskabet for 2016.
  Regnskabet viste et driftsoverskud p\u00e5 kr. 947.944, som var overf\u00f8rt til
  foreningens egenkapital, der herefter pr. 31/12 2016 udgjorde kr. 867.228.\\n\\nDer
  fremkom ingen sp\u00f8rgsm\u00e5l til \u00e5rsregnskabet, der herefter blev enstemmigt
  godkendt.\\n\\n3. Godkendelse af det kommende regnskabs\u00e5rs driftsbudget.\\n\\nBestyrelsesformanden
  gennemgik bestyrelsens budgetforslag for 2017, som beror p\u00e5 et u\u00e6ndret
  f\u00e6llesbidrag. Der er s\u00e5ledes budgetteret med et driftsoverskud i foreningen
  p\u00e5 kr. 662.000, hvilket skyldes et behov i foreningen for, at generere likviditet
  svarende til behovet i en forening af dennes st\u00f8rrelse.\\n\\nDer fremkom enkelte
  afklarende sp\u00f8rgsm\u00e5l fra forsamlingen.\\n\\nDet fremlagte budget for 2017
  blev enstemmigt godkendt med u\u00e6ndrede f\u00e6llesudgifter\\n\\n4. Dr\u00f8ftelse
  af st\u00f8rre vedligeholdelsesarbejder mv.\\n\\nDer forekom ingen dr\u00f8ftelser
  af vedligeholdelsesarbejder.\\n\\n5. Forslag fra medlemmer eller bestyrelse.\\n\\nForslagenes
  indhold var udsendt sammen med indkaldelsen.\\n\\nDirigenten gjorde opm\u00e6rksom
  p\u00e5 at forslaget kan vedtages s\u00e5fremt det opn\u00e5r almindeligt flertal
  efter antal.\\n\\n**Forslag om h\u00f8jbede**\\nForslagsstilleren Frank Holdt motiverede
  sit forslag.\\n\\nDer blev spurgt hvilke farver, der er indeholdt i naturfarver.
  Det blev aftalt, at bestyrelsen skulle udv\u00e6lge nogle farver, som man kan anvende.\\n\\nForslaget
  blev herefter enstemmigt vedtaget.\\n\\n**Forslag om hegn**\\nForslagsstilleren
  Frank Holdt motiverede sit forslag. Der blev lagt v\u00e6gt p\u00e5, at et hegn
  kunne have en pr\u00e6ventiv effekt p\u00e5 indbrud.\\n\\nBestyrelsesformand Bendix
  Kristiansen, oplyste at dette kunne v\u00e6re i strid med lokalplanen, hvorfor forslagsstilleren
  arbejder videre p\u00e5, at unders\u00f8ge om hvorvidt ops\u00e6tning af hegn, strider
  imod lokalplanen.\\n\\n**Forslag om skoskab**\\nForslagsstilleren Frank Holdt, motiverede
  sit forslag om ops\u00e6tning af skoskabe i opgangene.\\n\\nDer blev spurgt ind
  til baggrunden for valg af skoskab. Forslagsstilleren oplyste, at skabet levede
  op til krav om udseende, holdbarhed, pris og brandsikkerhed.\\n\\nDa der var tvivl
  om hvorledes brandmyndighederne vil tillade skabe i opgangene, blev det besluttet
  at forslagsstilleren i samr\u00e5d med bestyrelsen, ville arbejde videre med forslaget
  og unders\u00f8ge mulighederne.\\n\\n**Forslag om udskiftning af n\u00f8glesystem**\\nForslagsstilleren
  Mikkel Jochimsen motiverede sit forslag. Der blev lagt v\u00e6gt p\u00e5, at der
  er mange n\u00f8gler i oml\u00f8b, som giver anledning til, at fremmede kan l\u00e5se
  sig ind i foreningens ejendom.\\n\\nBegge muligheder i forslaget indeholder anvendelse
  af n\u00f8glebrikker.\\n\\nUdgiften til et nyt n\u00f8glesystem vil skulle finansieres
  delvist gennem egenkapitalen og gennem en ekstra-opkr\u00e6vning hos ejerne. Det
  vil v\u00e6re muligt, at anvende omkring 500.000 kr. fra egenkapitalen.\\n\\nMulighed
  1.\\n\\nPris ca. 1.350.000 kr.\\nDenne mulighed er et Salto system med offline d\u00f8re,
  hvilket kan give lidt forsinkelse ved sp\u00e6rring af n\u00f8glebrikker.\\n\\nMulighed
  2.\\n\\nPris ca. 1.600.000 kr.\\nDenne l\u00f8sning er et SMARTair system med online
  d\u00f8re, hvilket betyder, at d\u00f8rene er koblet op direkte til en server, hvorfor
  de kan sp\u00e6rres med det samme.\\n\\nForslaget blev sat til afstemning, og mulighed
  2 blev vedtaget, med et overvejende flertal.\\n\\n**Forslag til udarbejdelse af
  mulighed for grundpakke hos YouSee**\\nForslagsstilleren Gertie Skaarup deltog ikke
  ved generalforsamlingen, hvorfor grundlaget for forslaget var udsendt sammen med
  indkaldelsen.\\n\\nDet blev besluttet at bestyrelsen arbejder videre med forslaget.\\n\\n**Forslag
  om tyverisikring af vinduer p\u00e5 1. sal**\\nForslagsstilleren Jacob Midtg\u00e5rd
  motiverede sit forslag, som gik p\u00e5 at 1. sal''s ruderne limes helt fast i rammer
  og karme, s\u00e5 de ikke kan vippes ud uden, at \u00f8del\u00e6gge hele ruden.\\n\\nI
  forslaget blev der lagt v\u00e6gt p\u00e5, at forslaget vil kunne forebygge indbrud
  gennem vinduerne.\\n\\nForslaget blev debatteret, og det blev besluttet at to ejere
  skulle f\u00f8lge op hos Sj\u00e6ls\u00f8.\\n\\n**Forslag om bordb\u00e6nkes\u00e6t
  p\u00e5 f\u00e6llesomr\u00e5det**\\n\\nDet blev pr\u00e6ciseret, at det ejerforeningen
  kun kan s\u00e6tte bordeb\u00e6nkes\u00e6t op p\u00e5 omr\u00e5det over p-k\u00e6lder.
  Det \u00f8vrige omr\u00e5de tilh\u00f8rer grundejerforeningen.\\n\\nBestyrelsen
  arbejder videre sammen men grundejerforeningens bestyrelse\\n\\n### 6. Valg af formand
  for bestyrelsen og 1-4 andre bestyrels\u0435\u0441medlemmer, jf. pkt. 21\\n\\nBendix
  Kristiansen, som repr\u00e6sentant for Margretheholmen P/S, oplyste, at han ikke
  \u00f8nskede at genopstille som formand, men gerne ville forts\u00e6tte i bestyrelsen.\\nIngen
  andre \u00f8nskede at opstille som formand.\\n\\nDirigenten foreslog, at der i stedet
  blev valgt 5 bestyrels\u0435\u0441medlemmer, som efterf\u00f8lgende konstituerer
  sig med en formand. Det tilsluttede generalforsamlingen sig.\\n\\nDer var genvalg
  til Bendix Kristiansen, Mikkel Jochimsen, Morten Rostved og Kasper Buch\\nDer var
