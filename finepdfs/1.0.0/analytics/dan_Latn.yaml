  Bank, Statens Betalinger under Finansministeriet Jyske Bank, Haderslev\\n\\n2\\n\\nLedelsesberetning\\n\\nPr\u00e6sentation
  af institutionen\\n\\nForm\u00e5l\\n\\nInstitutionens form\u00e5l er i overensstemmelse
  med lovgivningen at sikre udbud af almen voksenuddannelse, forberedende voksenundervisning
  og ordblindeundervisning for voksne i institutionens geografiske d\u00e6kningsomr\u00e5de.
  Institutionen kan endvidere i overensstemmelse med dens udbudsgodkendelser og lovgivningen
  udbyde gymnasiale uddannelser.\\n\\nInstitutionen kan i tilknytning til uddannelserne,
  jf. ovenfor, gennemf\u00f8re indt\u00e6gtsd\u00e6kket virksomhed i overensstemmelse
  med budgetvejledningens regler herom.\\n\\nEndelig har institutionen i overensstemmelse
  med Institutionsloven i henhold til skriftlig aftale herom varetaget n\u00e6rmere
  bestemte administrative opgaver for andre uddannelsesinstitutioner, ligesom institutionen
  i henhold til aftale med enkelte s\u00f8nderjyske kommuner har gennemf\u00f8rt voksenspecialundervisningen
  og den s\u00e6rlige ungdomsuddannelse i omr\u00e5det.\\n\\nMission\\n\\nRealis\u00e9r
  dit potentiale.\\n\\nGennem faglighed, nyt\u00e6nkende l\u00e6ringsmetoder og moderne
  IT underst\u00f8tter VUC Syd mennesker i at realisere deres potentiale. VUC Syd
  vil noget med dig \u2013 hvis du selv vil \u2013 uanset om du er medarbejder eller
  kursist.\\n\\nVision\\n\\nFremtiden er din.\\n\\nDet er VUC Syds vision, at enhver
  skal have mulighed for at skabe sin egen fremtid.\\n\\nLedelsesberetning\\n\\n\u00c5rets
  faglige resultater\\n\\nVUC Syd har i 2014 som en konsekvens af kontanthj\u00e6lpsreformen,
  som tr\u00e5dte i kraft med virkning fra 1. januar 2014, udviklet et nyt uddannelsesforl\u00f8b
  kaldet iGo i samarbejde med jobcentrene i Haderslev og S\u00f8nderborg kommune.  Forl\u00f8bet
  tager udgangspunkt i at f\u00e5 uddannelsesparate kontanthj\u00e6lpsmodtagere motiveret
  til at begynde p\u00e5 en uddannelse. Forl\u00f8bet fokuserer i h\u00f8j grad p\u00e5
  kursistens potentiale, udvikling og bev\u00e6gelse. Jobcentrene har bidraget ved
  at knytte deres mentorer samt sagsbehandlere til forl\u00f8bet.\\n\\nForl\u00f8bet
  har en varighed p\u00e5 6 uger og b\u00e6rer tydelig pr\u00e6g af, at forl\u00f8bene
  har tilpasset sig de enkelte jobcentres behov. I S\u00f8nderborg er 2 ugers praktik
  p\u00e5 2 erhvervsuddannelser efter eget valg inkluderet i forl\u00f8bet, mens de
  6 uger i Haderslev alene foreg\u00e5r p\u00e5 VUC Syd.\\n\\nDette betyder, at udover
  de 2 jobcentre er b\u00e5de landbrugsskole, teknisk skole, social- og sundhedsuddannelserne
  samt handelsskole med i iGo forl\u00f8bet. Det sker for at sikre, at kursisten f\u00e5r
  mulighed for at reflektere over valget af fremtidig uddannelse. Vejlederne afvikler
  inden for 6 uger en v\u00e6kstsamtale med kursisten, og det er samtalens form\u00e5l
  at give kursisten m\u00e5l med uddannelse og fremtid.\\n\\nUddannelsesforl\u00f8bet
  har skabt tydelige resultater for unge kontanthj\u00e6lpsmodtagere i de 2 kommuner.
  I S\u00f8nderborg har i alt 179 kursister deltaget i forl\u00f8bet i 2014, og heraf
  er 6% kommet i ordin\u00e6rt arbejde, og 39% er p\u00e5begyndt ordin\u00e6r uddannelse.
  I alt 61% af de unge, som har v\u00e6ret omfattet af tilbuddet er ikke l\u00e6ngere
  tilknyttet jobcentret. I Haderslev har i alt 107 kursister deltaget i forl\u00f8bet
  i 2014, og heraf er 9% kommet i ordin\u00e6rt arbejde, og 39% er p\u00e5begyndt
  ordin\u00e6r uddannelse. I alt 62% af de unge, som har v\u00e6ret omfattet af tilbuddet
  er ikke l\u00e6ngere tilknyttet jobcentret.\\n\\nVUC Syd har endvidere indg\u00e5et
  en partnerskabsaftale med Aabenraa Kommune, hvor VUC varetager undervisning af ledige
  (fra 18 \u00e5r) p\u00e5 AVU i 2 dage ugentligt i kombination med, at de er i nyttejobs.
  Der er i forl\u00f8bet fokus p\u00e5 ans\u00f8gninger, personlig fremtoning og afklaring
  til videre uddannelse. VUC Syd arbejder i 2015 p\u00e5, at indg\u00e5 lignende partnerskabsaftaler
  med de \u00f8vrige kommuner i d\u00e6kningsomr\u00e5det.\\n\\nMed virkning fra august
  2015 tr\u00e6der reformen af erhvervsuddannelserne i kraft. Reformen indeb\u00e6rer
  sk\u00e6rpede krav til at blive optaget p\u00e5 en erhvervsuddannelse. Der kr\u00e6ves
  bl.a. minimum karakteren 02 i dansk og matematik for at blive optaget p\u00e5 et
  grundforl\u00f8b, og man kan maksimalt p\u00e5begynde et grundforl\u00f8b 3 gange.\\n\\nDer
  er p\u00e5 denne baggrund indg\u00e5et et partnerskab mellem EUC Syd og VUC Syd
  med det m\u00e5l, at flest muligt unge i de 2 institutioners d\u00e6kningsomr\u00e5de
  i de 4 s\u00f8nderjyske kommuner kan p\u00e5begynde og gennemf\u00f8re et grundforl\u00f8b,
  som f\u00f8rer frem til en \u00f8nsket erhvervsuddannelse. Partnerskabsaftalen skal
  underst\u00f8tte, at\\n\\n- unge, der p\u00e5begynder en erhvervsuddannelse har
  gode almene foruds\u00e6tninger herfor, og opfylder kravet om minimum karakteren
  02 i dansk og matematik ved optagelsen,\\n- de unge afklares i forhold til hvilken
  erhvervsuddannelse de gerne vil i gang med,\\n- de unge er bevidst om, hvilke krav
  der generelt er til optagelse p\u00e5 hovedforl\u00f8bet p\u00e5 en erhvervsuddannelse,
  og\\n- unge der \u00f8nsker EUX er kl\u00e6dt p\u00e5 til at n\u00e5 de faglige
  niveauer.\\n\\nVUC Syd vil i 2015 arbejde videre med, at f\u00e5 indg\u00e5et tilsvarende
  partnerskabsaftaler med de \u00f8vrige erhvervsskoler i d\u00e6kningsomr\u00e5det.\\n\\nVUC
  Syd har i 2014 igangsat et ambiti\u00f8st projekt med egen udvikling af digitalt
  undervisningsmateriale til brug p\u00e5 iPad. Materialeudviklingen sker i samarbejde
  med Apple, og arbejdet indeholder et meget stort udviklingspotentiale for en fortsat
  positiv udvikling af VUC Syd. Kombinationen af udl\u00e5n af iPads og materialer
  udviklet til iPads i h\u00f8j kvalitet kan give VUC Syds uddannelser et betydeligt
  kvalitetsl\u00f8ft, samt en endnu bedre undervisning med bedre gennemf\u00f8rsel
  og eksamensresultater til f\u00f8lge. L\u00e6rerens engagement i materialeproduktionen
  er i sig selv et kompetenceudviklingsprojekt, som f\u00f8rer til endnu mere kompetente
  l\u00e6rere, samt \u00f8get mulighed for at tiltr\u00e6kke dygtige nye medarbejdere.\\n\\nLedelsesberetning\\n\\nHoved-
  og n\u00f8gletal\\n\\n\u00c5rsrapport 2014\\n\\nN\u00f8gletallene er udarbejdet
  i overensstemmelse med Undervisningsministeriets regnskabsbekendtg\u00f8relse samt
  bestemmelserne i \u00e5rsregnskabslovens \u00a7\u00a7 99 - 101.\\n\\n6\\n\\nLedelsesberetning\\n\\nHoved-
  og n\u00f8gletal\\n\\nLedelsesberetning\\n\\nHoved- og n\u00f8gletal\\n\\n\u00c5rsrapport
  2014\\n\\n8\\n\\nLedelsesberetning\\n\\n\u00c5rets \u00f8konomiske resultat\\n\\nVUC
  Syd har i 2014 pr\u00e6steret et overskud p\u00e5 29,4 mio. kr., svarende til en
  overskudsgrad p\u00e5 12,7 %.\\n\\n\u00c5rsrapport 2014\\n\\nVUC Syd er vokset aktivitetsm\u00e6ssigt
  fra 2013 til 2014 med 8,2 %. V\u00e6ksten er st\u00f8rst inden for AVU, hvor aktiviteten
  er steget med 19 % fra 2013 til 2014. Ogs\u00e5 inden for 2-\u00e5rigt hf er der
  en betydelig v\u00e6kst, og her udg\u00f8r stigningen tilsvarende 16 % fra 2013
  \u2013 2014.\\n\\nV\u00e6ksten skyldes prim\u00e6rt, at der er et betydeligt fokus
  p\u00e5, at unge voksne b\u00f8r uddanne sig, og at der b\u00e5de ved de unge, i
  ungdommens uddannelsesvejledning (UU), og ved jobcentrene i de 4 d\u00e6kningskommuner
  er et betydeligt fokus p\u00e5 vigtigheden af uddannelse.\\n\\nTendensen til, at
  de unge voksne s\u00f8ger VUC Syds uddannelsestilbud er ikke noget nyt f\u00e6nomen,
  og VUC Syds aktivitet er vokset kontinuerligt siden overgangen til selveje i 2007.\\n\\nUdviklingen
  i antallet af \u00e5rselever p\u00e5 de enkelte uddannelsesomr\u00e5der, og i alt
  fremg\u00e5r af nedenst\u00e5ende tabel:\\n\\nDet fremg\u00e5r af tabellen, at institutionens
  aktivitet er steget med 128 % i perioden fra 2008 2014.\\n\\nStigningen skyldes
  is\u00e6r en tilv\u00e6kst i gruppen af unge mellem 18 og 25 \u00e5r, som anvender
  VUC som heltidsuddannelsestilbud, og modtager SU. Den overvejende del af VUC Syds
  aktivitet udg\u00f8res i dag af denne aldersgruppe. Det understreger samtidig ogs\u00e5,
  at VUC Syd yder et ganske v\u00e6sentligt bidrag til 95 % og 60 % m\u00e5ls\u00e6tningerne.\\n\\nI
  alt 20,6% af samtlige deltagere var under 30 \u00e5r i 2007, og i 2014 udg\u00f8r
  andelen af deltagere under 30 \u00e5r i alt 62 %.\\n\\nV\u00e6ksten siden 2007 har
  ogs\u00e5 medf\u00f8rt markante \u00f8konomiske resultater.\\n\\nDet er lykkedes
  via effektiviseringer, digitalisering og en generel professionalisering, at antallet
  af medarbejdere inden for ledelse og administration stort set er u\u00e6ndret, selvom
  aktiviteten i 2014 er mere end dobbelt s\u00e5 stor som i 2007.\\n\\n9\\n\\n\u00c5rsrapport
  2014\\n\\nDen positive \u00f8konomiske effekt af effektivisering, digitalisering
  og \u00f8get professionalisering har givet VUC Syd et \u00f8konomisk r\u00e5derum,
  som bestyrelsen har besluttet at anvende p\u00e5 et ambiti\u00f8st investeringsprogram
  i bygninger, udstyr og kompetenceudvikling for at sikre, at alle afdelingerne har
  de optimale rammer for at kunne gennemf\u00f8re undervisningen efter de undervisningsprincipper,
  som VUC Syd anvender.\\n\\nVUC Syd har i 2011 \u00e5r afsluttet anl\u00e6gsprojektet
  i S\u00f8nderborg med den gennemf\u00f8rte om- og tilbygning af afdelingen, som
  var h\u00e5rdt tiltr\u00e6ngt. Investeringen udgjorde 60 mio. kr. I 2013 blev et
  nyt hus i Haderslev taget i brug, hvor de oprindelige 3 sm\u00e5 afdelinger blev
  samlet i et nyskabende og attraktivt uddannelsesmilj\u00f8. Investeringen i Haderslev
  udgjorde ca. 210 mio. kr.\\n\\nI 2014 blev byggeriet af et nyt VUC i T\u00f8nder
  igangsat. Byggeriet placeres i et nyt Campus T\u00f8nder, hvor EUC Syd, T\u00f8nder
  Handelsskole og Handelsgymnasium, 10. Klasse og Ungdommens uddannelsesvejledning
  indg\u00e5r sammen med VUC Syd. VUC Syds byggeri udg\u00f8r ca. 3.000 m2, og anl\u00e6gsudgiften
  udg\u00f8r ca. 40 mio. kr. Byggeriet st\u00e5r klar til ibrugtagning fra august
  2015. VUC Syd har samtidig indg\u00e5et aftale om udlejning af de eksisterende bygninger
  i T\u00f8nder.\\n\\nI Aabenraa har VUC''s afdeling i \u00e5revis haft meget tr\u00e6ngte
  forhold, og der er indg\u00e5et flere lejem\u00e5l for at kunne rumme aktiviteten.
  Spredningen p\u00e5 de forskellige lokaliteter giver klare ulemper og et d\u00e5rligt
  studiemilj\u00f8. Samtidig er afdelingen ikke l\u00e6ngere tidssvarende indrettet.
  VUC Syd har primo 2014 erhvervet naboejendommen og medio 2014 er der p\u00e5begyndt
  en om- og tilbygning af afdelingen.\\n\\nByggeplanerne i Aabenraa forventes at medf\u00f8re
  en investering p\u00e5 ca. 55 mio. kr.\\n\\nTrods de store investeringer er VUC
  Syds langfristede g\u00e6ld holdt p\u00e5 et b\u00e6redygtigt grundlag, og institutionens
  langfristede g\u00e6ld udg\u00f8r ultimo 2014 i alt 108 mio. kr.\\n\\nBegivenheder
  efter regnskabs\u00e5rets afslutning\\n\\nDer er ikke indtruffet begivenheder efter
  regnskabs\u00e5rets afslutning, som p\u00e5virker institutionens finansielle stilling
  pr. 31. december 2014.\\n\\nForventninger til det kommende \u00e5r\\n\\nInstitutionen
  forventer i 2015 en fortsat v\u00e6kst i aktiviteten, og bestyrelsen har ved budgetl\u00e6gningen
  for 2015 forudsat en aktivitetsstigning p\u00e5 9 % i forhold til den realiserede
  aktivitet i 2014.\\n\\nDer er samtidig i lighed med regnskabs\u00e5ret 2014, og
  som en del af bestyrelsens byggeprogram, budgetteret med et forventet overskud p\u00e5
  30 mio. kr. i 2015.\\n\\nBestyrelsens bygningsprogram g\u00e5r i 2015 \u2013 2016
  ind i sin afsluttede fase med f\u00e6rdigg\u00f8relse af byggeprojektet i T\u00f8nder,
  jf. redeg\u00f8relsen ovenfor.\\n\\n10\\n\\nLedelsesberetning\\n\\nM\u00e5lrapportering\\n\\nVUC
  Syd har de senere \u00e5r oplevet en betydelig stigning i s\u00f8gningen til 2-\u00e5rigt
  hf, og denne stigning forventes at forts\u00e6tte i de kommende \u00e5r. Dette begrundes
  i en generel stigende s\u00f8gning til VUC''s tilbud, men ogs\u00e5 som en konsekvens
  af, at der er etableret et godt samarbejde med Ungdommens Uddannelsesvejledning
  i kommunerne. Samtidig intensiveres dialogen med 10. klasseskolerne. Bygningskapaciteten
  er ogs\u00e5 udvidet betragteligt i S\u00f8nderborg og Haderslev de seneste \u00e5r,
  hvilket muligg\u00f8r et st\u00f8rre optag.\\n\\nVUC Syd har en fastsat kapacitet
  p\u00e5 2-\u00e5rigt hf i 2014/2015 p\u00e5 i alt 26 klasser fordelt p\u00e5 1.
  og 2. \u00e5r. Der er pr. 1. august 2014 etableret i alt 11 klasser p\u00e5 1. \u00e5r,
  og der forventes som minimum oprettet 11 klasser igen p\u00e5 1. \u00e5r i august
  2015.\\n\\nM\u00e5lgruppen p\u00e5 det 2-\u00e5rige hf fordeler sig s\u00e5ledes,
  at ca. 33 % af kursisterne er under 20 \u00e5r og ca. 60 % af kursisterne er mellem
  20 \u2013 24 \u00e5r. Det tilsiger, at der er flere og flere unge kursister som
  v\u00e6lger det 2-\u00e5rige hf ved VUC Syd.\\n\\nDer er de seneste \u00e5r truffet
  beslutning om en r\u00e6kke m\u00e5l og indsatsomr\u00e5der, herunder at flere gennemf\u00f8rer
  og g\u00e5r til eksamen. Der er bl.a. etableret teamstrukturer med henblik p\u00e5,
  at der kan iv\u00e6rks\u00e6ttes en tidlig aktiv indsats i forhold til frafaldstruede
  kursister.\\n\\nResultatopg\u00f8relse\\n\\nDisponering af \u00e5rets resultat\\n\\n\u00c5rets
  resultat overf\u00f8res til egenkapitalen.\\n\\n14\\n\\n14\\n\\n\u00c5rsrapport
  2014\\n\\n1 Anvendt regnskabspraksis\\n\\n\u00c5rsrapporten for VUC Syd for 2014
  er udarbejdet i overensstemmelse med de regnskabsregler og principper som fremg\u00e5r
  af Finansministeriets bekendtg\u00f8relse nr. 70 af 27. januar 2011 om regnskab
  (regnskabsbekendtg\u00f8relsen) med de n\u00e6rmere retningslinjer i Finansministeriets
  \u00d8konomisk Administrative Vejledning (www.oav.dk) og Kvalitets- og Tilsynsstyrelsens
  paradigme for \u00e5rsrapporten 2014med tilh\u00f8rende vejledning.\\n\\n\u00c5rsrapporten
  for 2014 er aflagt i danske kroner.\\n\\nDen anvendte regnskabspraksis er u\u00e6ndret
  i forhold til sidste \u00e5r.\\n\\nGenerelt om indregning og m\u00e5ling\\n\\nRegnskabet
  er udarbejdet med udgangspunkt i det historiske kostprisprincip.\\n\\nAktiver indregnes
  i balancen, n\u00e5r det er sandsynligt, at fremtidige \u00f8konomiske fordele vil
  tilflyde institutionen, og aktivets v\u00e6rdi kan m\u00e5les p\u00e5lideligt.\\n\\nForpligtelser
  indregnes i balancen, n\u00e5r det er sandsynligt, at fremtidige \u00f8konomiske
  ressourcer vil frag\u00e5 institutionen, og forpligtelsens v\u00e6rdi kan m\u00e5les
  p\u00e5lideligt.\\n\\nVed f\u00f8rste indregning m\u00e5les aktiver og forpligtelser
  til kostpris. Efterf\u00f8lgende m\u00e5les aktiver og forpligtelser som beskrevet
  for hver enkelt regnskabspost.\\n\\nVisse finansielle aktiver og forpligtelser m\u00e5les
  til amortiseret kostpris, hvorved der indregnes en konstant effektiv rente over
  l\u00f8betiden. Amortiseret kostpris opg\u00f8res som oprindelig kostpris med fradrag
  af afdrag og till\u00e6g/fradrag af den akkumulerede afskrivning af forskellen mellem
  kostprisen og det nominelle bel\u00f8b, der forfalder ved udl\u00f8b. Herved fordeles
  kurstab og -gevinst over l\u00f8betiden.\\n\\nVed indregning og m\u00e5ling tages
  hensyn til gevinster, tab og risici, der fremkommer, inden \u00e5rsrapporten afl\u00e6gges,
  og som be- eller afkr\u00e6fter forhold, der eksisterer p\u00e5 balancedagen.\\n\\nTaxametertilskud
  indregnes som udgangspunkt i resultatopg\u00f8relsen p\u00e5 modtagelsestidspunktet.
  Bygningstaxameter og f\u00e6llesudgiftstilskud indregnes dog forskudt, da disse
  tilskud beregnes ud fra tidligere \u00e5rs aktivitetsniveau. Kvartalsvise forudbetalinger
  af taxametertilskud vedr\u00f8rende det kommende finans\u00e5r, optages i balancen
  som en kortfristet g\u00e6ldspost og indt\u00e6gtsf\u00f8res i det finans\u00e5r
  tilskuddene vedr\u00f8rer.\\n\\n\u00d8vrige indt\u00e6gter indregnes i resultatopg\u00f8relsen
  i takt med, at de indtjenes. Afg\u00f8relsen af, om indt\u00e6gter anses som indtjent,
  baseres p\u00e5 f\u00f8lgende kriterier:\\n\\n- der foreligger en forpligtende salgsaftale,\\n-
  salgsprisen er fastlagt,\\n- levering har fundet sted inden regnskabs\u00e5rets
  udl\u00f8b, og\\n- indbetalingen er modtaget eller kan med rimelig sikkerhed forventes
  modtaget.\\n\\nIndt\u00e6gter indregnes herudfra i resultatopg\u00f8relsen i takt
  med, at de indtjenes, herunder indregnes v\u00e6rdiregulering af finansielle aktiver
  og forpligtelser, der m\u00e5les til dagsv\u00e6rdi eller amortiseret kostpris.
  Endvidere indregnes i resultatopg\u00f8relsen alle omkostninger, der er afholdt
  for at opn\u00e5 \u00e5rets indtjening, herunder afskrivninger, nedskrivninger og
  hensatte forpligtelser samt tilbagef\u00f8rsler som f\u00f8lge af \u00e6ndrede regnskabsm\u00e6ssige
  sk\u00f8n af bel\u00f8b, der tidligere har v\u00e6ret indregnet i resultatopg\u00f8relsen.\\n\\n16\\n\\n1
  Anvendt regnskabspraksis (fortsat)\\n\\nLeasing\\n\\nLeasingkontrakter vedr\u00f8rende
  materielle anl\u00e6gsaktiver, hvor institutionen har alle v\u00e6sentlige risici
  og fordele forbundet med ejendomsretten (finansiel leasing), indregnes i balancen
  til dagsv\u00e6rdi af leasingaktivitet, hvis denne findes. Alternativt, og hvis
  denne er lavere, anvendes nutidsv\u00e6rdien af de fremtidige leasingydelser p\u00e5
  anskaffelsestidspunktet. Ved beregning af nutidsv\u00e6rdien anvendes leasingaftalens
  interne rentefod som diskonteringsfaktor eller en tiln\u00e6rmet v\u00e6rdi for
  denne. Finansielt leasede aktiver af- og nedskrives som institutionens \u00f8vrige
  materielle anl\u00e6gsaktiver.\\n\\nDen kapitaliserede restleasingforpligtelse indregnes
  i balancen som en g\u00e6ldsforpligtelse, og leasingydelsens rentedel omkostningsf\u00f8res
  l\u00f8bende i resultatopg\u00f8relsen.\\n\\nAlle \u00f8vrige leasingkontrakter
  betragtes som operationel leasing. Ydelser i forbindelse med operationel leasing
  indregnes i resultatopg\u00f8relsen over leasingperioden. Leasingforpligtelsen oplyses
  i en note.\\n\\nSegmentoplysninger\\n\\nI de s\u00e6rlige specifikationer gives
  resultatoplysninger p\u00e5 f\u00f8lgende segmenter:\\n\\n- Indt\u00e6gtsd\u00e6kket
  virksomhed - IDV\\n\\nPoster, som fordeles b\u00e5de ved direkte og indirekte opg\u00f8relse,
  omfatter omkostninger i alt. De poster, som fordeles ved indirekte opg\u00f8relse,
  sker ud fra fordelingsn\u00f8gler fastlagt ud fra \u00e5rselevtallet eller sk\u00f8n
  p\u00e5 de enkelte segmenter.\\n\\nResultatopg\u00f8relsen\\n\\nOms\u00e6tning\\n\\nOms\u00e6tning
  indregnes i resultatopg\u00f8relsen, s\u00e5fremt de generelle kriterier er opfyldt,
  herunder at levering og risikoovergang har fundet sted inden regnskabs\u00e5rets
  udgang, bel\u00f8bet kan opg\u00f8res p\u00e5lideligt og forventes modtaget. Der
  foretages fuld periodisering af tilskud, j\u00e6vnf\u00f8r dog afsnittet \\\"Generelt
  om indregning og m\u00e5ling\\\".\\n\\nOmkostninger\\n\\nOmkostninger omfatter de
  omkostninger, der er medg\u00e5et til at opn\u00e5 \u00e5rets oms\u00e6tning, herunder
  l\u00f8n og gager, \u00f8vrige driftsomkostninger samt afskrivninger m.v. p\u00e5
  anl\u00e6gsaktiver. Omkostningerne er opdelt p\u00e5 omr\u00e5derne:\\n\\n- Undervisningens
  gennemf\u00f8relse\\n- Markedsf\u00f8ring\\n- Ledelse og administration\\n- Bygningsdrift\\n-
  Aktiviteter med s\u00e6rlige tilskud\\n- Administrative f\u00e6llesskaber, v\u00e6rtsinstitution\\n\\n1
  Anvendt regnskabspraksis (fortsat)\\n\\nS\u00e6rlige tilskud\\n\\nOmkostninger til
  s\u00e6rlige tilskud vedr\u00f8rer projekter iv\u00e6rksat af VUC Syd som helt eller
  delvist er finansieret af eksterne kilder. Indt\u00e6gterne indregnes under deltagerbetaling
  og andre indt\u00e6gter.\\n\\nFinansielle poster\\n\\nFinansielle poster omfatter
  renteindt\u00e6gter og omkostninger, rentedelen af finansielle leasingydelser, realiserede
  og urealiserede kursgevinster og -tab vedr\u00f8rende v\u00e6rdipapirer.\\n\\nBalancen\\n\\nMaterielle
  anl\u00e6gsaktiver\\n\\nMaterielle anl\u00e6gsaktiver m\u00e5les til kostpris med
  fradrag af akkumulerede af- og nedskrivninger. Der afskrives ikke p\u00e5 grunde.\\n\\nKostpris
  omfatter anskaffelsesprisen samt omkostninger direkte tilknyttet anskaffelsen indtil
  det tidspunkt, hvor aktivet er klar til at blive taget i brug. For egne fremstillede
  aktiver omfatter kostprisen direkte og indirekte omkostninger til l\u00f8nforbrug,
  materialer, komponenter og underleverand\u00f8rer.\\n\\nRenteomkostninger p\u00e5
  l\u00e5n optaget direkte til finansiering af fremstilling af materielle anl\u00e6gsaktiver
  indregnes i kostprisen over fremstillingsperioden. Alle indirekte henf\u00f8rbare
  l\u00e5neomkostninger indregnes i resultatopg\u00f8relsen.\\n\\nAfskrivningsgrundlaget,
  som opg\u00f8res som kostpris, reduceret med eventuel scrapv\u00e6rdi, fordeles
  line\u00e6rt over aktivernes forventede brugstid, der udg\u00f8r:\\n\\nP\u00e5 bygninger
  anvendes en scrapv\u00e6rdi p\u00e5 0 %.\\n\\nAktiver med en anskaffelsessum p\u00e5
  under DKK 50.000 eksklusive moms omkostningsf\u00f8res i anskaffelses\u00e5ret.
  Aktiver, der enkeltvis har en v\u00e6rdi under DKK 50.000, men som er bestemt til
  at fungere samlet, og den samlede anskaffelsessum overstiger DKK 50.000, indregnes
  som anl\u00e6gsaktiv.\\n\\nTab ved salg af anl\u00e6gsaktiver indregnes i resultatopg\u00f8relsen
  under de enkelte omkostningsgrupper. Gevinst ved salg af anl\u00e6gsaktiver indregnes
  i resultatopg\u00f8relsen under andre indt\u00e6gter.\\n\\nNedskrivning af anl\u00e6gsaktiver\\n\\nDen
  regnskabsm\u00e6ssige v\u00e6rdi af materielle anl\u00e6gsaktiver gennemg\u00e5s
  \u00e5rligt for at afg\u00f8re, om der er indikation af v\u00e6rdiforringelse ud
  over det, som udtrykkes ved normal afskrivning. Hvis dette er tilf\u00e6ldet, foretages
  nedskrivning til den lavere genindvindingsv\u00e6rdi.\\n\\nGenindvindingsv\u00e6rdien
  for aktivet opg\u00f8res som den h\u00f8jeste v\u00e6rdi af nettosalgsprisen og
  kapitalv\u00e6rdien. S\u00e5fremt det ikke er muligt at fasts\u00e6tte genindvindingsv\u00e6rdien
  for det enkelte\\n\\n18\\n\\n1 Anvendt regnskabspraksis (fortsat)\\n\\naktiv, vurderes
  nedskrivningsbehovet for den mindste gruppe af aktiver, hvor det er muligt at opg\u00f8re
  genindvindingsv\u00e6rdien.\\n\\nTilgodehavender\\n\\nTilgodehavender m\u00e5les
  i balancen til amortiseret kostpris eller en lavere nettorealisationsv\u00e6rdi,
  hvilket her svarer til p\u00e5lydende v\u00e6rdi med fradrag af nedskrivning til
  im\u00f8deg\u00e5else af tab.\\n\\nNedskrivninger til tab opg\u00f8res p\u00e5 grundlag
  af en individuel vurdering af de enkelte tilgodehavender samt for tilgodehavender
  fra salg tillige med en generel nedskrivning baseret p\u00e5 institutionens erfaringer
  fra tidligere \u00e5r.\\n\\nV\u00e6rdipapirer\\n\\nV\u00e6rdipapirer, indregnes
  under oms\u00e6tningsaktiver, omfattende b\u00f8rsnoterede obligationer, der m\u00e5les
  til statusdagens b\u00f8rskurs.\\n\\nPeriodeafgr\u00e6nsningsposter\\n\\nPeriodeafgr\u00e6nsningsposter,
  indregnet under aktiver, omfatter afholdte omkostninger vedr\u00f8rende efterf\u00f8lgende
  regnskabs\u00e5r.\\n\\nPeriodeafgr\u00e6nsningsposter, indregnet under forpligtelser,
  udg\u00f8res af modtagne betalinger vedr\u00f8rende indt\u00e6gter i de efterf\u00f8lgende
  \u00e5r.\\n\\nG\u00e6ldsforpligtelser\\n\\nFinansielle g\u00e6ldsforpligtelser indregnes
  ved l\u00e5noptagelse til det modtagne provenu efter fradrag af afholdte transaktionsomkostninger.
  I efterf\u00f8lgende perioder m\u00e5les de finansielle forpligtelser til amortiseret
  kostpris.\\n\\nI finansielle forpligtelser indregnes tillige den kapitaliserede
  restleasingforpligtelse p\u00e5 finansielle leasingkontrakter.\\n\\n\u00d8vrige
  g\u00e6ldsforpligtelser m\u00e5les til nettorealisationsv\u00e6rdi.\\n\\nG\u00e6ldsforpligtelser
  i udenlandsk valuta omregnes til statusdagens kurs.\\n\\nPengestr\u00f8msopg\u00f8relse\\n\\nPengestr\u00f8msopg\u00f8relsen
  viser institutionens pengestr\u00f8mme fordelt p\u00e5 drifts-, investerings- og
  finansieringsaktivitet for \u00e5ret, \u00e5rets forskydning i likvider samt institutionens
  likvide midler ved \u00e5rets begyndelse og slutning.\\n\\nPengestr\u00f8m fra driftsaktivitet\\n\\nPengestr\u00f8mme
  fra driftsaktivitet opg\u00f8res som \u00e5rets resultat reguleret for ikke-kontante
  resultatposter som af- og nedskrivninger, hens\u00e6ttelser samt \u00e6ndring i
  driftskapitalen, renteindbetalinger og -udbetalinger samt betalt vedr\u00f8rende
  ekstraordin\u00e6re poster. Driftskapitalen omfatter oms\u00e6tningsaktiver minus
  kortfristede g\u00e6ldsforpligtelser eksklusiv de poster, der indg\u00e5r i likvider.\\n\\n19\\n\\n1\\n\\n\u00c5rsregnskab
  1. januar - 31. december\\n\\nAnvendt regnskabspraksis (fortsat)\\n\\nPengestr\u00f8m
  fra investeringsaktivitet\\n\\nPengestr\u00f8mme fra investeringsaktivitet omfatter
  betaling i forbindelse med k\u00f8b og salg af materielle og eventuelle finansielle
  anl\u00e6gsaktiver.\\n\\nPengestr\u00f8mme fra finansieringsaktivitet\\n\\nPengestr\u00f8mme
  fra finansieringsaktivitet omfatter \u00e6ndringer i forbindelse med optagelse af
  l\u00e5n og afdrag p\u00e5 renteb\u00e6rende g\u00e6ld suppleret med bel\u00f8b
  til indfrielse af statsl\u00e5n.\\n\\nLikvider\\n\\nLikvider omfatter likvide beholdninger
  samt kortfristede v\u00e6rdipapirer, som uden hindring kan oms\u00e6ttes til likvide
  beholdninger.\\n\\nForklaring af n\u00f8gletal\\n\\nNoter\\n\\nNoter\\n\\n15 Realkreditl\u00e5n\\n\\n16
  Byggekredit\\n\\nInstitutionen har en byggekredit med et kreditmaksimum p\u00e5
  150.000.000 kr.\\n\\n17 Sikkerhedsstillelser m.v.\\n\\nTil sikkerhed for g\u00e6ld
  til realkreditinstitut er der givet pant i ejendomme for 109.241 t.kr. Den regnskabsm\u00e6ssige
  v\u00e6rdi af de pantsatte ejendomme udg\u00f8r pr. 31. december 2014 i alt 150.600
  t.kr.\\n\\nInstitutionens bankforbindelse har udstedt betalingsgarantier for i alt
  312 t.kr. vedr\u00f8rende indg\u00e5ede lejeaftaler.\\n\\n18 Andre forpligtelser
  m.v.\\n\\nDer p\u00e5hviler institutionen leasing- og lejeforpligtelser svarende
  til et akkumuleret bel\u00f8b p\u00e5 4.186 t.kr. Leasingydelserne udl\u00f8ber
  senest 2016.\\n\\nEt eventuelt provenu ved salg inden for 10 \u00e5r af institutionens
  ejendomme, der er erhvervet fra Staten v/Ministeriet for B\u00f8rn og Undervisning
  den 1. januar 2010, skal tilbagebetales til Ministeriet for B\u00f8rn og Undervisning
  med 50 % af provenuet, efter medregning af modsvarende nyinvesteringer, s\u00e5som
  nybyggeri m.v.\\n\\n24\\n\\nS\u00e6rlige specifikationer\\n\\nOpg\u00f8relse af
  institutionens omkostninger i forbindelse med Statens Selvforsikringsordning\\n\\nOvenst\u00e5ende
  opg\u00f8res i overensstemmelse med Undervisningsministeriets \\\"Retningslinjer
  for administration af statens selvforsikringsordning vedr. statsinstitutioner, institutioner
  for erhvervsrettet uddannelse, institutioner godkendt efter lov om institutioner
  for almengymnasiale uddannelser og almen voksenuddannelse m.v., Centre for Videreg\u00e5ende
  Uddannelse og andre selvejende institutioner for videreg\u00e5ende uddannelser p\u00e5
  Undervisningsministeriets ressortomr\u00e5de\\\".\\n\\nOpg\u00f8relse af anden tilskudsfinansieret
  aktivitet, f.eks. fors\u00f8gs- og udviklingsprojekter finansieret af s\u00e6rlige
  tilskud, herunder EU-socialfondsmidler Nordisk R\u00e5d-midler m.v.\\n\\nLedelsesp\u00e5tegning\\n\\nBestyrelse
  og direktion har dags dato behandlet og godkendt \u00e5rsrapporten for regnskabs\u00e5ret
  2014 for VUC Syd.\\n\\n\u00c5rsrapporten er udarbejdet i overensstemmelse med lov
  om statens regnskab m.v. samt bekendtg\u00f8relse nr. 70 af 27. januar 2011 om statens
  regnskabsv\u00e6sen m.v. I henhold til \u00a7 39, stk. 4 i regnskabsbekendtg\u00f8relsen
  tilkendegives det hermed:\\n\\n- At \u00e5rsrapporten er rigtig, dvs. at \u00e5rsrapporten
  ikke indeholder v\u00e6sentlige fejlinformationer eller udeladelser, herunder at
  m\u00e5lopstillingen og m\u00e5lrapporteringen i \u00e5rsrapporten er fyldestg\u00f8rende.\\n-
  At de dispositioner, som er omfattet af regnskabsafl\u00e6ggelsen, er i overensstemmelse
  med meddelte bevillinger, love og andre forskrifter samt med indg\u00e5ede aftaler
  og s\u00e6dvanlig praksis.\\n- At der er etableret forretningsgange, der sikrer
  en \u00f8konomisk hensigtsm\u00e6ssig forvaltning af de midler og ved driften af
  de institutioner, der er omfattet af \u00e5rsrapporten.\\n\\nHaderslev, den 30.
  marts 2015\\n\\nHans J\u00f8rgen Hansen Direkt\u00f8r\\n\\nEndvidere erkl\u00e6rer
  bestyrelsen p\u00e5 tro og love at opfylde habilitetskravene i lov om institutio-
  ner for almengymnasiale uddannelser og almen voksenuddannelse m.v., \u00a7 17. 1\\n\\nHaderslev,
  den 30. marts 2015 Bestyrelse\\n\\nH.P. Geil formand\\n\\nThomas Andresen\\n\\nPernille
  Pripping Caspersen\\n\\nMarita Geinitz\\n\\nKim Anker Hansen\\n\\nAlexander Mahnken
  Ipsen\\n\\nJohn Lauridsen\\n\\nDorte Madsen\\n\\nTage Petersen\\n\\nElisabeth S.
  Thomsen\\n\\n1 Revisionen af \u00e5rsrapporten omfatter ikke bestyrelsens habilitetserkl\u00e6ring.\\n\\n28\\n\\nDen
  uafh\u00e6ngige revisors erkl\u00e6ringer\\n\\nTil bestyrelsen for VUC S\u00f8nderjylland\\n\\nP\u00e5tegning
  p\u00e5 \u00e5rsregnskabet\\n\\nVi har revideret \u00e5rsregnskabet for VUC S\u00f8nderjylland
  for regnskabs\u00e5ret 1. januar \u2013 31. december 2014. \u00c5rsregnskabet omfatter
  anvendt regnskabspraksis, resultatopg\u00f8relse, balance, pengestr\u00f8msopg\u00f8relse,
  noter og s\u00e6rlige specifikationer. \u00c5rsregnskabet udarbejdes efter bekendtg\u00f8relse
  nr. 70 af 27. januar 2011 om statens regnskabsv\u00e6sen m.v. (regnskabsbekendtg\u00f8relsen),
  vejledning af 28. januar 2015 om udarbejdelse af \u00e5rsrapport for statsfinansierede
  selvejende institutioner under Ministeriet for B\u00f8rn og Undervisning (ministeriets
  vejledning) samt regler fastsat i Finansministeriets \u00d8konomisk Administrative
  Vejledning.\\n\\nLedelsens ansvar for \u00e5rsregnskabet\\n\\nLedelsen har ansvaret
  for udarbejdelsen af et \u00e5rsregnskab, der er rigtigt, dvs. uden v\u00e6sentlige
  fejl og mangler i overensstemmelse med regnskabsbekendtg\u00f8relsen, ministeriets
  vejledning samt regler fastsat i Finansministeriets \u00d8konomisk Administrative
  Vejledning. Ledelsen har endvidere ansvaret for den interne kontrol, som ledelsen
  anser n\u00f8dvendig for at udarbejde et \u00e5rsregnskab uden v\u00e6sentlig fejlinformation,
  uanset om denne skyldes besvigelser eller fejl, samt valg og anvendelse af en hensigtsm\u00e6ssig
  regnskabspraksis og ud\u00f8velse af regnskabsm\u00e6ssige sk\u00f8n, som er rimelige
  efter omst\u00e6ndighederne.\\n\\nHerudover er det ledelsens ansvar, at de dispositioner,
  der er omfattet af \u00e5rsregnskabet, er i overensstemmelse med meddelte bevillinger,
  love og andre forskrifter samt med indg\u00e5ede aftaler og s\u00e6dvanlig praksis.\\n\\nRevisors
  ansvar\\n\\nVores ansvar er at udtrykke en konklusion om \u00e5rsregnskabet p\u00e5
  grundlag af vores revision. Vi har udf\u00f8rt revisionen i overensstemmelse med
  internationale standarder om revision og yderligere krav if\u00f8lge dansk revisorlovgivning
  samt god offentlig revisionsskik, jf. Undervisningsministeriets bekendtg\u00f8relse
  nr. 1292 af 12. december 2008 om revision og tilskudskontrol m.m. ved institutioner
  for almengymnasiale uddannelser og almen voksenuddannelse m.v. Dette kr\u00e6ver,
  at vi overholder etiske krav samt planl\u00e6gger og udf\u00f8rer revisionen for
  at opn\u00e5 h\u00f8j grad af sikkerhed for, om \u00e5rsregnskabet er uden v\u00e6sentlig
  fejlinformation.\\n\\nEn revision omfatter udf\u00f8relse af revisionshandlinger
  for at opn\u00e5 revisionsbevis for bel\u00f8b og oplysninger i \u00e5rsregnskabet.
  De valgte revisionshandlinger afh\u00e6nger af revisors vurdering, herunder vurderingen
  af risici for v\u00e6sentlig fejlinformation i \u00e5rsregnskabet, uanset om denne
  skyldes besvigelser eller fejl. Ved risikovurderingen overvejer revisor intern kontrol,
  der er relevant for institutionens udarbejdelse af et \u00e5rsregnskab, der er rigtigt,
  dvs. uden v\u00e6sentlige fejl og mangler. Form\u00e5let hermed er at udforme revisionshandlinger,
  der er passende efter omst\u00e6ndighederne, men ikke at udtrykke en konklusion
  om effektiviteten af institutionens interne kontrol. En revision omfatter endvidere
  vurdering af, om ledelsens valg af regnskabspraksis er passende, om ledelsens regnskabsm\u00e6ssige
  sk\u00f8n er rimelige samt en vurdering af den samlede pr\u00e6sentation af \u00e5rsregnskabet.\\n\\nRevisionen
  omfatter desuden en vurdering af, om der er etableret forretningsgange og interne
  kontroller, der underst\u00f8tter, at de dispositioner, der er omfattet af \u00e5rsregnskabet,
  er i overensstemmelse med meddelte bevillinger, love og andre forskrifter samt med
  indg\u00e5ede aftaler og s\u00e6dvanlig praksis.\\n\\nDet er vores opfattelse, at
  det opn\u00e5ede revisionsbevis er tilstr\u00e6kkeligt og egnet som grundlag for
  vores konklusion.\\n\\nRevisionen har ikke givet anledning til forbehold.\\n\\nDen
  uafh\u00e6ngige revisors erkl\u00e6ringer\\n\\nKonklusion\\n\\nDet er vores opfattelse,
  at \u00e5rsregnskabet for regnskabs\u00e5ret 1. januar \u2013 31. december 2014
  i alle v\u00e6sentlige henseender er udarbejdet i overensstemmelse med regnskabsbekendtg\u00f8relsen,
  ministeriets vejledning samt regler fastsat i Finansministeriets \u00d8konomisk
  Administrative Vejledning. Det er ligeledes vores opfattelse, at der er etableret
  forretningsgange og interne kontroller, der underst\u00f8tter, at de dispositioner
  der er omfattet af \u00e5rsregnskabet, er i overensstemmelse med meddelte bevillinger,
  love og andre forskrifter samt med indg\u00e5ede aftaler og s\u00e6dvanlig praksis.\\n\\nUdtalelse
  om ledelsesberetningen og m\u00e5lrapporteringen\\n\\nVi har genneml\u00e6st ledelsesberetningen
  og m\u00e5lrapporteringen. Vi har ikke foretaget yderligere handlinger i till\u00e6g
  til den udf\u00f8rte revision af \u00e5rsregnskabet. Det er p\u00e5 denne baggrund
  vores opfattelse, at oplysningerne i ledelsesberetningen og i m\u00e5lrapporteringen
  er i overensstemmelse med \u00e5rsregnskabet.\\n\\nHaderslev, den 24. marts 2015
  ERNST & YOUNG Godkendt Revisionspartnerselskab\\n\\nThorbj\u00f8rn Bruhn statsaut.
