  forh\u00f8jelsen er aftalt. Dvs. den afrundede eksempelberegning kan ikke rent \\\"ganges
  op\\\".\"", "\"Almen Boligselskabet Centrum Danmark Afdeling 80-64\\n\\nTil beboerne\\n\\nDato:
  marts 2023\\n\\nREFERAT af ordin\u00e6rt afdelingsm\u00f8de afholdt tirsdag, den
  15. marts 2023 kl. 16.00, p\u00e5 Frivilligcenteret, Kerteminde.\\n\\n10 beboer
  var fremm\u00f8dte, der repr\u00e6senterende 8 husstand ud af 22.\\n\\nDesuden deltog
  ejendomsmester Claus Pallesen Hansen og kundechef Claus Olesen.\\n\\nmed f\u00f8lgende
  dagsorden:\\n\\n1. Valg af dirigent, referent og stemmeudvalg.\\n\\nREFERAT: Claus
  Olesen blev valgt som dirigent. Han kunne konstatere, at m\u00f8det var lovligt
  indvarslet med 4 uger og derfor beslutningsdygtigt.\\n\\nSom referent valgtes Claus
  Olesen. Stemmeudvalg blev ville blive valgt, s\u00e5fremt behov herfor m\u00e5tte
  opst\u00e5.\\n\\n2. Afdelingsbestyrelsens beretning.\\n\\nREFERAT: Afdelingsbestyrelsesformand
  Ulla Eithz fremlagde bestyrelsens beretning. Denne er vedlagt n\u00e6rv\u00e6rende
  referat.\\n\\n3. Afdelingens r\u00e5dighedsbel\u00f8b.\\n\\nREFERAT:  Se vedh\u00e6ftede\\n\\n4.
  Nyt fra Boligselskabet ABCD.\\n\\nREFERAT: Igennem de sidste alt for mange m\u00e5neder
  har Kerteminde og Munkebo-afdelingerne lidt af personalemangel. Udfordringen er
  nu l\u00f8st, idet vi pr.  01-03-2023 har ansat ejendomsfunktion\u00e6r Jens Ole
  Pedersen. Hans spidskompetencer er omkring de gr\u00f8nne omr\u00e5der. S\u00e5
  vi har en stor tiltro til, at udeomr\u00e5derne l\u00f8bende vil komme til at tage
  sig bedre ud.\\n\\n5. Freml\u00e6ggelse af afdelingens seneste \u00e5rsregnskab
  til orientering.\\n\\nREFERAT: Claus Olesen gennemgik afdelingsregnskabet. \u00c5rets
  resultat udviser et underskud p\u00e5 kr. 17.501. Underskuddet er overf\u00f8rt
  til resultatkontoen. Underskuddet skyldes prim\u00e6rt, en ekstraordin\u00e6r henl\u00e6ggelse
  til planlagt og periodisk vedligeholdelse. Herudover har udgifterne til renholdelse
  v\u00e6ret h\u00f8jere end budgetteret.\\n\\nHen over vinteren har der v\u00e6ret
  anvendt et eksternt firma til vinterberedskabet.\\n\\n6. Godkendelse af bestyrelsens
  forslag til driftsbudget for det kommende regnskabs\u00e5r.\\nREFERAT: Claus Olesen
  fremlagde afdelingens budgetudkast. Budgettet blev vedtaget, hvilket medf\u00f8rer,\\n\\nat
  huslejen pr. 01-10-2023 stiger med 1,36%\\n\\nBehandling af indkomne forslag.\\n\\n7.\\n\\nREFERAT:
  Ingen forslag til behandling.\\n\\n8. Valg af formand for afdelingsbestyrelsen for
  2 \u00e5r Ulla Eithz er p\u00e5 valg.\\n\\n9. Valg af afdelingsbestyrelsesmedlemmer
  for 1 \u00e5r\\nP\u00e5 valg er Anne-Vibeke Rex. Lise Nielsen er valgt til 2024,
  men \u00f8nsker at udtr\u00e6de. REFERAT: Anne-Vibeke Rex blev genvalgt. Indtr\u00e5dt
  for Lise Nielsen er Vivi Pedersen.\\n10. Valg af suppleanter til afdelingsbestyrelsen
  for 1 \u00e5r\\n\\nREFERAT: Ulla Eithz blev genvalgt.\\n\\nREFERAT: Ingen suppleanter
  blev valgt.\\n\\n11. Eventuelt valg af repr\u00e6sentantskabsmedlemmer for 1 \u00e5r
  samt eventuelle suppleanter.\\n\\nAfdelingsm\u00f8det har tidligere besluttet, at
  afdelingsbestyrelsen v\u00e6lger afdelingens repr\u00e6sentantskabsmedlem(mer).\\n\\nREFERAT:
  Afdelingsbestyrelsen forts\u00e6tter som repr\u00e6sentantskabsmedlemmer.\\n\\n12.
  Eventuelt.\\n\\nREFERAT: Vinduespudsning af 1. sals lejligheder blev omtalt, da
  det giver vand ned til stuelejlighederne. Med information til stuelejlighederne
  forinden kommende vinduespudsning anses problemet ikke at v\u00e6re s\u00e5 stort.
  Her er det v\u00e6rd at notere, at vinduerne pudses med kalkfrit vand.\\n\\nReferat
  godkendt.\\n\\nKerteminde,  17. marts 2023\"", "\"Vil du ud at rejse og har du lyst
  til at formidle?\\n\\nS\u00e5 skal du da v\u00e6re provstivolont\u00f8r for Silkeborg
  Provsti efter sommerferien!\\n\\nEn provstivolont\u00f8r\\n\\n- rejser til Cambodja
  i tre m\u00e5neder med Danmission i efter\u00e5ret 2019 (udlandsopholdet str\u00e6kker
  sig fra 1.september-1.december)\\n- holder ca. 30 foredrag og opl\u00e6g i Silkeborg
  og omegn i for\u00e5ret 2020 for b\u00f8rn, konfirmander og voksne om dine oplevelser
  i (formidlingsperioden str\u00e6kker sig fra 1. januar-31. marts)\\n\\nVolont\u00f8ropholdet
  er et bes\u00f8g hos en af Danmissions partnere, hvor du bliver tilknyttet f.eks.
  en skole eller en kirke og f\u00e5r en dagligdag med opgaver som f.eks. undervisning
  i\\n\\nengelsk, musik eller idr\u00e6t eller fritidsaktiviteter for b\u00f8rn. Vi
  tilpasser opgaven efter, hvad du er god til og har lyst til. Der forventes at du
  kommer til at rejse med en anden ung dansker. I l\u00f8bet af de 3 m\u00e5neder
  f\u00e5r du et indblik i, hvordan Danmission arbejder med udvikling af samfund og
  kirker, s\u00e5 du kan fort\u00e6lle om det, n\u00e5r du kommer hjem.\\n\\nI formidlingsperioden
  bliver der lagt et program for dig \u2013 det drejer sig om ca. 30 foredrag, hvor
  du kommer rundt i kirker og sognehuse i Silkeborg provsti \u2013 og fort\u00e6ller
  om dine oplevelser og indtryk.  Det er projektudvalget for provstivolont\u00f8r,
  der laver aftalerne.\\n\\nInden udlandsopholdet er der et introkursus, der ligger
  12.-14. august, hvor du sammen med andre unge bliver forberedt til rejsen og opgaven.
  Efter udlandsopholdet er der et formidlingskursus p\u00e5 to dage i december, hvor
  du l\u00e6rer at formidle de oplevelser, du har haft.\\n\\nUnder volont\u00f8ropholdet
  f\u00e5r du betalt lommepenge (2.000,- kr/md), kost, logi og den transport, som
  er n\u00f8dvendig for opholdet \u2013 inkl. transport til Danmission til intro-
  og hjemkomstkursus.\\n\\nI formidlingsperioden f\u00e5r du lommepenge (2.000,- kr/md)
  og transport betalt, og der vil v\u00e6re mulighed for at arbejde ved siden af,
  i det omfang arbejdet kan indrettes efter det formidlingsprogram, som bliver lagt.\\n\\nEgenbetaling:
  Du skal selv betale din flybillet, vaccinationer, visum og forsikring (ca. 10.000
  kr.).\\n\\nVOLONT\u00d8REN siger:\\n\\nHvem er du?\\n\\n\\\"Jeg var afsted i Mwanza
  i Tanzania sidste \u00e5r, og det var en helt fantastisk oplevelse! Det indblik
  i lokallivet, jeg fik som provstivolont\u00f8r gjorde stort indtryk p\u00e5 mig.
  Man h\u00f8rer og ser s\u00e5 meget om Afrika i medierne, men som provstivolont\u00f8r
  kom jeg helt ind under huden p\u00e5 kulturen og folkene, og fik et langt mere nuanceret
  billede af livet dernede. Jeg fik lov til at m\u00f8de mennesker og opleve ting,
  som ikke kan opleves gennem medierne\\\". Mathilde Christoffersen, Silkeborg \u2013
  provstivolont\u00f8r Tanzania E-2018). \\\"\\n\\n* Du har lyst til at opleve, fort\u00e6lle
  og formidle\\n* Gerne med kendskab eller interesse for kirken.\\n* Netop f\u00e6rdig
  med ungdomsuddannelse\\n* Med lyst til og mod p\u00e5 at m\u00f8de verden og bagefter
  fort\u00e6lle folk i Silkeborg-omr\u00e5det om dine erfaringer\\n* M\u00e5ske kender
  du lidt til kirke fra f.eks FDF, spejder, KFS, IMU, KFUM & KFUK, LMU, DKG, fra kirkekor
  eller lign.\\n* M\u00e5ske er du bare \u00e5ben overfor at m\u00f8de andre kristne
  kulturer.\\n* Gerne bosiddende i Silkeborg Kommune\\n\\nHvem er vi?\\n\\nProjektgruppen
  for provstivolont\u00f8r best\u00e5r af Jakob Nissen, provst, Inger Engsig-Karup,
  menighedsr\u00e5dsmedlem, Peder Eriksen, frivillig i Danmission og Marianne Hedemann
  Andreassen, sognepr\u00e6st. Vi vil rigtig gerne se en ans\u00f8gning fra dig, hvor
  du skriver lidt om dig selv og hvorfor du har lyst til at komme afsted som provstivolont\u00f8r.
  Ans\u00f8gningen skal rumme navn, adresse, alder, mail, tlf. billede og gerne kontaktoplysninger
  p\u00e5 en person, som vi m\u00e5 kontakte og h\u00f8re n\u00e6rmere om dig. Ans\u00f8gningen
  sendes til Silkeborg Provsti, firstname.lastname@example.org senest fredag d. 26.
  april.\\n\\nH\u00f8r n\u00e6rmere om volont\u00f8ropholdet hos: Amalie Ehmsen, email@example.com,
  tlf. 41 999 315. Du kan ogs\u00e5 l\u00e6se om vores tidligere provstivolont\u00f8rs
  oplevelser p\u00e5 bloggen: https://nouw.com/mathildefuglsang/2018/11\\n\\nH\u00f8r
  mere om formidlingsperioden og ans\u00f8gningen hos: Projektgruppen for provstivolont\u00f8r,
  Silkeborg Provsti, tlf. 8686 9559 eller provst Jakob Nissen tlf. 2133 7055, firstname.lastname@example.org.
  Ans\u00e6ttelsessamtaler i uge 18.\\n\\n1\"", "\"ARBEJDSARK - INTRODUKTION TIL YOGA\u00d8VELSER\\n\\nASANAS\\n\\nUdstyr
  / Det er rart med en yogamatte, men ikke n\u00f8dvendigt. Det vigtigste er, at f\u00f8dderne
  ikke glider p\u00e5 gulvet. Yoga udf\u00f8res derfor bedst med bare f\u00f8dder.\\n\\nVejrtr\u00e6kning
  / Vejrtr\u00e6kningen er meget vigtig, n\u00e5r du laver yoga. S\u00f8rg derfor
  for, at eleverne er opm\u00e6rksomme p\u00e5 dette, n\u00e5r de laver \u00f8velserne.\\n\\nIndividuelle
  \u00f8velser / Som udgangspunkt best\u00e5r yoga af individuelle \u00f8velser. Det
  betyder ogs\u00e5, at der kan v\u00e6re rigtig stor forskel p\u00e5, hvordan den
  enkelte udf\u00f8rer \u00f8velsen. Nogle er meget smidige eller st\u00e6rke, andre
  er ikke. Derfor skal man ikke sammenligne sig med nogen, men blot pr\u00f8ve at
  lave \u00f8velsen, som man bedst kan, og som f\u00f8les rigtigt for en selv. Det
  m\u00e5 aldrig g\u00f8re ondt at lave yoga, men det m\u00e5 gerne v\u00e6re udfordrende.\\n\\nUdtryk
  / Da yoga er meget mere end en tr\u00e6ningstendens, forekommer der mange udtryk,
  som stammer fra den meget gamle kultur omkring yoga. Nogle af de vigtigste er:\\n\\n-
  **Asana**: er et ord p\u00e5 sanskrit (oldindisk sprog) for \u00f8velse eller stilling.
  Efter sigende findes der over 84.000 forskellige Asanas i yoga.\\n- **Om**: er en
  form for messen (en yoga-chant), hvor ordet siges meget langsomt, mens man pr\u00f8ver
  at lade lyden af bogstaverne \\\"ringe\\\" ved at sige dem som \u00e9n lang lyd
  (fx \\\"ooooooooommmmmmm\\\"). Om kaldes ogs\u00e5 \\\"lyden af universet\\\" og
  skal minde os om, at vi alle er forbundet.\\n- **Namaste**: er en h\u00e5ndstilling,
  hvor man samler h\u00e6nderne foran hjertet. Namaste betyder \\\"jeg ser det bedste
  i dig\\\".\\n\\nBjerget\\n\\n*Bjerget* er en af de vigtigste yogastillinger.\\nDen
  afslapper sindet og l\u00e6rer \u00e9n at v\u00e6re stille og st\u00e6rk ligesom
  et m\u00e6gtigt bjerg.\\n\\nSt\u00e5 ret op med hoftebreddes afstand mellem f\u00f8dderne
  og armene ned langs siden.\\nTjek, at dine kn\u00e6 er over dine ankler, dine hofter
  over kn\u00e6ene og skuldrerne over hofterne.\\nHav h\u00e5ndfladerne vendt fremad.\\nS\u00f8rg
  for at holde din ryg rank ved at skubbe bagdelen let ind under kroppen.\\nS\u00e6nk
  skuldrerne og se lige frem.\\n\\nLuk \u00f8jnene og f\u00f8l, at din krop st\u00e5r
  solidt plantet i jorden.\\nTr\u00e6k vejret dybt ind og ud flere gange.\\n\\nN\u00e5r
  du er klar til at komme ud af stillingen, tager du en ind\u00e5nding og l\u00f8fter
  armene op over hovedet.\\nHer samler du h\u00e6nderne og f\u00f8rer dem ned foran
  kroppen, mens du langsomt \u00e5nder ud.\\n\\nUsynlig stol\\n\\nSt\u00e5 ret op
  med f\u00f8dderne i hoftebreddes afstand.\\n\\nS\u00e6t h\u00e6nderne p\u00e5 hoften.\\n\\nB\u00f8j
  kn\u00e6ene langsomt, mens du holder h\u00e6nderne p\u00e5 hoften.\\n\\nPres hoften
  bagud og vip overkroppen forover. L\u00f8ft armene over hovedet. Ret din ryg.\\n\\nHold
  stillingen, s\u00e5 l\u00e6nge du kan. Husk at tr\u00e6kke vejret!\\n\\nHunden\\n\\nStil
  dig p\u00e5 h\u00e6nder og kn\u00e6 med h\u00e6nderne i skulderbreddes afstand.\\nS\u00f8rg
  for, at kn\u00e6ene er lige under hofterne.\\nTryk h\u00e6nderne ned i m\u00e5tten.\\n\\nDenne
  grundstilling kaldes ogs\u00e5 for Bordet.\\n\\n\u00c5nd ind og b\u00f8j t\u00e6rerne
  ind under f\u00f8dderne og l\u00f8ft bagdelen. \u00c5nd ud, mens du skubber dig
  tilbage og str\u00e6kker benene.\\nS\u00f8rg for at fordele v\u00e6gten ligeligt
  mellem h\u00e6nder og f\u00f8dder.\\nPr\u00f8v at danne en trekant med bagdelen
  som det \u00f8verste punkt.\\nHvis det er ubehageligt at st\u00e5 i stillingen,
  m\u00e5 du gerne b\u00f8je benene lidt. \u00c5nd ind og ud fem gange, mens du st\u00e5r
  i stillingen.\\nHvis du synes, at det er let, kan du pr\u00f8ve at f\u00e5 h\u00e6lene
  helt ned i gulvet, s\u00e5 du st\u00e5r p\u00e5 flad fod.\\n\\nHunden, der tisser\\n\\nStil
  dig i samme startposition som ved Hunden.\\n\\nL\u00f8ft det ene ben op og ud til
  siden \u2013 lige som en hund, der tisser.\\nPr\u00f8v at f\u00e5 benet helt op
  i en ret vinkel.\\n\\nG\u00f8r det samme med det modsatte ben.\\n\\nKobraen\\n\\nL\u00e6g
  dig p\u00e5 maven med h\u00e5ndfladerne i gulvet ved siden af brystet.\\n\\n\u00c5nd
  ind, l\u00f8ft overkroppen op og se fremad. Pr\u00f8v at lade v\u00e6re med at bruge
  armene til at presse kroppen op med.\\n\\nHv\u00e6s som en slange, mens du \u00e5nder
  ud.\\n\\nHvis du har brug for mere st\u00f8tte, kan du hvile underarmene p\u00e5
  gulvet. \u00c5nd ud, mens du langsomt lader overkroppen glide ned p\u00e5 gulvet
  igen.\\n\\nLav \u00f8velsen igen. Denne gang str\u00e6kker du armene helt og skubber
  brystet frem, mens du ser ligeud.\\n\\nKatten\\n\\nDu starter i grundstillingen
  \u201cBordet\u201d.\\n(H\u00e6nderne under skuldrene, kn\u00e6ene under hofterne,
  lige ryg).\\n\\n\u00c5nd ind, l\u00f8ft hovedet og skyd brystet fremad.\\nSvaj ryggen
  i en langsom bev\u00e6gelse.\\n\\n\u00c5nd ud, krum ryggen langsomt, mens du presser
  al luften ud af lungerne.\\nDu m\u00e5 gerne pr\u00f8ve at hv\u00e6se som en vred
  kat, mens du g\u00f8r det.\\n\\nFors\u00e6t med at svaje og krumme, s\u00e5 du g\u00f8r
  det fem gange i alt. Husk, at det skal v\u00e6re langsomme bev\u00e6gelser med ind-
  og ud\u00e5ndinger.\\n\\nTigeren\\n\\nDu starter i grundstillingen \\\"Bordet\\\".\\n(H\u00e6nderne
  under skuldrene, kn\u00e6ene under hofterne, lige ryg).\\n\\n\u00c5nd ind og l\u00f8ft
  benet som en tigerhale.\\nPr\u00f8v ogs\u00e5 at b\u00f8je benet bagover, s\u00e5
  t\u00e6rerne kommer s\u00e5 t\u00e6t p\u00e5 baghovedet som muligt.\\n\\nN\u00e5r
  du \u00e5nder ud, svinger du langsomt benet ind mellem armene og pr\u00f8ver at
  n\u00e5 n\u00e6sen med kn\u00e6et.\\n\\nGentag \u00f8velsen med det andet ben.\\n\\nBarnets
  stilling\\n\\nDu starter i grundstillingen \\\"Bordet\\\".\\n(H\u00e6nderne under
  skuldrene, kn\u00e6ene under hofterne, lige ryg).\\n\\nS\u00e6nk bagdelen, s\u00e5
  den hviler p\u00e5 dine h\u00e6le.\\nLad h\u00e6nderne glide ud foran dig.\\nLuk
  \u00f8jnene og pr\u00f8v at tr\u00e6kke vejret dybt flere gange.\\nSe, om du kan
  slappe af i stillingen.\\n\\nDu kan ogs\u00e5 l\u00e6gge dine arme ned langs siden,
  hvis det f\u00f8les mere afslappende for dig.\\n\\nN\u00e5r du skal ud af stillingen
  igen, s\u00e5 g\u00f8r det langsomt.\\n\\nBarnets stilling med aktive arme\\n\\nVariation:\\nN\u00e5r
  du ligger i Barnets stilling, kan du str\u00e6kke fingrene, s\u00e5 de peger ned
  i gulvet.\\nS\u00f8rg ogs\u00e5 for at have armene strakt.\\n\\nNu bev\u00e6ger
  du de strakte arme fra side til side, mens fingrene forbliver strakte og flytter
  sig som en krabbe hen over sandet.\\nPr\u00f8v at komme s\u00e5 langt ud til siderne
  som muligt.\\nFlyt armene langsomt fra side til side tre gange.\\n\\nB\u00e5den\\n\\nSid
  ned, mens du holder kn\u00e6ene t\u00e6t ind til kroppen.\\n\\nHold ryggen rank.\\n\\nL\u00e6n
  dig tilbage og l\u00f8ft f\u00f8dderne fra gulvet.\\n\\nS\u00f8rg for at holde ryggen
  rank.\\n\\nKig p\u00e5 f\u00f8dderne for nemmere at holde balancen.\\n\\nPr\u00f8v
  at str\u00e6kke benene helt ud \u2013 og hvis din balance er rigtig god, kan du
  slippe med h\u00e6nderne.\\n\\nTr\u00e6et\\n\\nStart med at stille dig i Bjergets
  stilling. Saml h\u00e6nderne foran kroppen, med h\u00e5ndfladerne mod hinanden.
  Luk \u00f8jnene og f\u00f8l, at dine f\u00f8dder st\u00e5r fast plantet i jorden.\\n\\nNu
  skal du l\u00e6gge v\u00e6gten p\u00e5 det ene ben, mens du forsigtigt l\u00f8fter
  det andet. Start med at s\u00e6tte foden op mod den anden fod og se, om du kan holde
  balancen.\\n\\nHvis din balance er god, kan du pr\u00f8ve at s\u00e6tte foden h\u00f8jere
  op p\u00e5 det modsatte ben. Pres fod og ben mod hinanden og pr\u00f8v at blive
  st\u00e5ende i denne stilling s\u00e5 l\u00e6nge som muligt. Foden skal v\u00e6re
  placeret under eller over kn\u00e6et.\\n\\nHvis du har balancen til det, s\u00e5
  l\u00f8ft begge arme strakt op og udad over hovedet, som om de er grene p\u00e5
  tr\u00e6et.\\n\\nPlanke\\n\\nL\u00e6g dig strakt med v\u00e6gten fordelt p\u00e5
  underarmene og f\u00f8dderne.\\n\\nSp\u00e6nd op i maven, og lad kroppen blive lige
  og lang som en planke.\\n\\nPr\u00f8v at tr\u00e6kke vejret stille og roligt, imens
  du laver \u00f8velsen.\\n\\nHold stillingen i 3-5 \u00e5ndedrag.\\n\\nSideplanke\\n\\nStart
  med at ligge i Planken. Drej s\u00e5 kroppen og h\u00f8jre arm, s\u00e5 du ligger
  p\u00e5 h\u00f8jre albue og drej h\u00f8jre fod, s\u00e5 du st\u00f8tter p\u00e5
  ydersiden af den. L\u00e6g den anden fod ovenp\u00e5, s\u00e5 den ogs\u00e5 er med
  til at st\u00f8tte mod gulvet.\\n\\nSp\u00e6nd i maven og fors\u00f8g at holde kroppen
  helt lige. Hvis du kan holde balancen, s\u00e5 l\u00f8ft den \u00f8verste arm mod
  himlen. Se efter den strakte arm. Hold stillingen i 3-5 \u00e5ndedrag. Skift side.\\n\\nStrakt
  planke\\n\\nSt\u00e5 med strakte arme og h\u00e6nder og f\u00f8dder i gulvet.\\n\\nSp\u00e6nd
  op i maven, og lad kroppen blive lige og lang som en planke.\\n\\nPr\u00f8v at tr\u00e6kke
  vejret stille og roligt, imens du laver \u00f8velsen.\\n\\nHold \u00f8velsen i 3-5
  \u00e5ndedrag.\\n\\nBuen\\n\\nL\u00e6g dig p\u00e5 maven med strakt krop.\\n\\nB\u00f8j
  det ene ben tilbage, og grib om anklen med h\u00e5nden p\u00e5 samme side, som det
  b\u00f8jede ben. Pres maven nedad mod gulvet imens.\\n\\nB\u00f8j det andet ben,
  og grib om anklen med den anden h\u00e5nd.\\n\\nL\u00f8ft hovedet, og tr\u00e6k
  benene opad og v\u00e6k fra numsen.\\n\\nFors\u00f8g b\u00e5de at l\u00f8fte hovedet
  og ben lige meget fra gulvet, men hvis det er for sv\u00e6rt, kan du n\u00f8jes
  med at l\u00f8fte hovedet og overkroppen.\\n\\nHold stillingen, mens du \u00e5nder
  ind og ud tre gange.\\n\\nS\u00f8stjernen\\n\\nL\u00e6g dig fladt p\u00e5 gulvet
  p\u00e5 ryggen, mens du str\u00e6kker arme og ben ud til siderne.\\n\\nMens du \u00e5nder
  ind, l\u00f8fter du arme og ben og tr\u00e6kker dem langsomt ind mod kroppen.\\n\\nTr\u00e6k
  kn\u00e6ene helt ned mod kroppen og b\u00f8j hagen mod brystet, s\u00e5 du er helt
  foldet sammen.\\n\\nMens du \u00e5nder ud, str\u00e6kker du langsomt dine arme og
  ben ud igen og l\u00e6gger hovedet forsigtigt tilbage p\u00e5 gulvet.\\n\\nGentag
  \u00f8velsen 5-6 gange. V\u00e6r opm\u00e6rksom p\u00e5 din vejrtr\u00e6kning.\\n\\nHalvbro\\n\\nLig
  p\u00e5 ryggen med b\u00f8jede ben og armene ned langs siden af kroppen.\\n\\nS\u00e6t
  dine f\u00f8dder t\u00e6t p\u00e5 numsen.\\n\\nMens du \u00e5nder ind, l\u00f8fter
  du hofterne langsomt opad \u2013 \u00e9n ryghvirvel ad gangen. Bliv ved, til du
  hviler p\u00e5 skuldrene.\\n\\nLad armene ligge ned langs kroppen.\\n\\nS\u00f8rg
  for at holde kn\u00e6ene samlet.\\n\\nTr\u00e6k vejret ind og ud fem gange.\\n\\nS\u00e6nk
  dig langsomt ned igen \u2013 \u00e9n ryghvirvel ad gangen.\\n\\nBro\\n\\nDu starter
  ligesom i Halvbroen, hvor du ligger p\u00e5 ryggen med b\u00f8jede ben og armene
  ned langs siden af kroppen.\\n\\nP\u00e5 en ind\u00e5nding tr\u00e6kker du armene
  tilbage og s\u00e6tter h\u00e5ndfladerne i gulvet ud for skuldrene.\\n\\nP\u00e5
  en ud\u00e5nding skubber du dig opad med armene, mens du sp\u00e6nder i kroppen
  og holder den helt strakt.\\n\\nTr\u00e6k vejret ind og ud tre gange.\\n\\nS\u00e6nk
  dig langsomt ned igen.\\n\\nAbesquat\\n\\nG\u00e5 ned i hug og saml h\u00e6nderne
  foran kroppen.\\n\\nDu kan evt. presse armene mod benene for at str\u00e6kke dem
  ud.\\n\\n\u00c5nd langsomt ind og ud fem gange, mens du sidder i stillingen.\\n\\nS\u00e6t
  din ene h\u00e5nd i gulvet.\\n\\nDen modsatte arm r\u00e6kker du op i luften, s\u00e5
  dine arme danner en lige linje.\\n\\nKig op imod den \u00f8verste h\u00e5nd.\\n\\nSkift
  arm.\\n\\nHvis du er en rigtig vild abe, kan du pr\u00f8ve at l\u00f8fte begge h\u00e6nder
  op over hovedet samtidig.\\n\\nFr\u00f8squat\\n\\nHvis du ikke kan f\u00e5 h\u00e6lene
  i gulvet, kan du i stedet lave et Fr\u00f8squat. Her sidder du p\u00e5 t\u00e6rerne.\\n\\nSt\u00f8t
  med h\u00e6nderne foran kroppen, hvis du har sv\u00e6rt ved at holde balancen.\\n\\nGlad
  baby\\n\\nL\u00e6g dig p\u00e5 ryggen og hold om kn\u00e6ene.\\n\\n\u00c5nd ind.\\n\\nMens
  du \u00e5nder ud, r\u00e6kker du h\u00e6nderne ud og gribet fat om dine f\u00f8dder.\\n\\nVug
  forsigtigt fra side til side, s\u00e5 du kan give dig selv lidt rygmassage.\\n\\nHvis
  det er sv\u00e6rt for dig at n\u00e5 f\u00f8dderne, kan du sagtens n\u00f8jes med
  at holde om benene.\\n\\nGiv dig selv et kram ved at l\u00f8fte hovedet og kr\u00f8lle
  dig helt sammen.\\n\\nVug forsigtigt fra side til side.\\n\\nSt\u00e5ende foroverb\u00f8jning\\n\\nB\u00f8j
  dig langsomt forover, mens du laderne arme og hoved h\u00e6nge slapt ned.\\n\\nDu
  kan b\u00f8je benene lidt, hvis det er lettere.\\n\\nHvil h\u00e6nderne p\u00e5
  benene, hvis det er for h\u00e5rdt.\\n\\nPr\u00f8v at rejse dig halvt op og g\u00f8re
  ryggen og nakken s\u00e5 lige som muligt.\\n\\nHvil h\u00e6nderne p\u00e5 benene,
  hvis det er lettere.\\n\\nB\u00f8j dig langsomt forover igen.\\n\\n\u00c5nd langsomt
  ind og ud tre gange, mens du pr\u00f8ver at slappe af i kroppen og komme lidt l\u00e6ngere
  ned for hver ud\u00e5nding.\\n\\nRul langsomt kroppen op til st\u00e5ende igen.
  Hovedet skal v\u00e6re det sidste, du l\u00f8fter.\\n\\nKriger\\n\\nSt\u00e5 med
  benene langt fra hinanden.\\n\\nDrej h\u00f8jre fod, s\u00e5 den peger ud mod siden,
  mens venstre fod peger fremad.\\n\\nB\u00f8j h\u00f8jre kn\u00e6, s\u00e5 anklen
  er direkte under kn\u00e6et.\\n\\nVenstre ben skal v\u00e6re helt strakt.\\n\\n\u00c5nd
  ind, og l\u00f8ft samtidig begge arme ud til siden, s\u00e5 de danner en lige linje.\\n\\nHold
  kroppen lige og strakt, og kig ud over din h\u00f8jre h\u00e5nd.\\n\\n\u00c5nd ind
  og l\u00f8ft begge arme op over hovedet, hvor du samler h\u00e5ndfladerne.\\n\\nArmene
  skal v\u00e6re strakte, og du skal fortsat se ud over h\u00f8jre ben.\\n\\nPr\u00f8v
  at holde stillingen s\u00e5 l\u00e6nge som muligt. Husk at tr\u00e6kke vejret!\\n\\nS\u00e6nk
  din venstre arm og s\u00e6t h\u00e5nden ind mod siden af kroppen \u2013 enten i
  hoften eller p\u00e5 benet.\\n\\nStr\u00e6k h\u00f8jre arm ind over hovedet, mens
  du b\u00f8jer kroppen forsigtigt bagud.\\n\\nSe efter h\u00f8jre h\u00e5nd.\\n\\nKom
  langsomt tilbage til udgangsstillingen igen.\\n\\nNu gentager du hele \u00f8velsen
  med modsatte ben forrest.\\n\\nSkulderstand\\n\\nV\u00e6r opm\u00e6rksom p\u00e5,
  at du i denne \u00f8velse skal l\u00e6gge v\u00e6gten p\u00e5 skuldrene og ikke
  p\u00e5 nakken.\\n\\nLig p\u00e5 ryggen og \u00e5nd ind.\\n\\nMens du \u00e5nder
  ud, b\u00f8jer du kn\u00e6ene og l\u00f8fter ben og bagdel, mens du st\u00f8tter
  med h\u00e6nderne i l\u00e6nden.\\n\\n\u00c5nd ind igen og str\u00e6k benene helt
  op, s\u00e5 du kommer til at st\u00e5 i en lige linje.\\n\\nPloven\\n\\nFra \\\"Skulderstand\\\"
  kan du g\u00e5 direkte over i den n\u00e6ste \u00f8velse, \\\"Ploven\\\".\\n\\nB\u00f8j
  i hofterne, og l\u00e6g kn\u00e6ene mod panden.\\n\\nL\u00f8ft bagdelen opad, og
  fors\u00f8g at holde ryggen helt lige.\\n\\n\u00c5nd ind, str\u00e6k benene og s\u00e6t
  f\u00f8dderne i gulvet.\\n\\nStr\u00e6k armene ud bag ryggen.\\n\\nDu kan evt. flette
  fingrene, hvis det giver dig bedre st\u00f8tte.\\n\\n\u00c5nd ind og ud tre gange,
  mens du ligger i stillingen.\\n\\nN\u00e5r du skal ud af stillingen igen, ruller
  du forsigtigt tilbage, \u00e9n ryghvirvel ad gangen.\\n\\nHovedstand\\n\\nDenne
  \u00f8velse kaldes ogs\u00e5 \\\"kongestillingen\\\" inden for yoga, fordi den har
  s\u00e5 mange gode virkninger for kroppen. S\u00e5 selvom den kan v\u00e6re lidt
  sv\u00e6r, er den med her.\\n\\nDet er en god id\u00e9 at lave \u00f8velsen op ad
  en v\u00e6g, s\u00e5 det er lettere at holde balancen. I m\u00e5 ogs\u00e5 meget
  gerne hj\u00e6lpe hinanden ved at st\u00f8tte og tage imod.\\n\\nFlet fingrene og
  s\u00e6t hovedet i gulvet, s\u00e5 baghovedet st\u00f8ttes af h\u00e6nderne.\\n\\nL\u00f8ft
  dig op p\u00e5 strakte ben, s\u00e5 du kan fornemme, hvor det er rarest at st\u00f8tte
  p\u00e5 hovedet. Det skal v\u00e6re ca. midt imellem panden og toppen af hovedet.\\n\\nNu
  begynder du at g\u00e5 med f\u00f8dderne ind mod kroppen. Sp\u00e6nd i maven og
  l\u00f8ft bagdelen opad, mens du presser albuerne ned i gulvet.\\n\\nN\u00e5r du
  kan m\u00e6rke, at f\u00f8dderne er ved at slippe gulvet, l\u00f8fter du stille
  og roligt dine ben ved at sp\u00e6nde i maven og ryggen.\\n\\nB\u00f8j i kn\u00e6ene
  og find balancen. Hvis du t\u00f8r, kan du str\u00e6kke benene ud og st\u00e5 i
  en lige linje.\\n\\nSp\u00e6nd i maven og undg\u00e5 at svaje i ryggen.\\n\\nN\u00e5r
  du skal ud af stillingen igen, s\u00e6nker du benene stille og roligt ned.\\n\\nSkulderstr\u00e6k\\n\\nS\u00e6t
  dig p\u00e5 gulvet med krydsede ben.\\n\\nP\u00e5 en ind\u00e5nding tr\u00e6kker
  du skuldrene op mod \u00f8rerne.\\n\\nPr\u00f8v at holde skuldrene afslappede, samtidig
  med at du l\u00f8fter dem.\\n\\nLad skuldrene falde ned igen, samtidig med, at du
  \u00e5nder ud p\u00e5 et dybt suk.\\n\\nGentag \u00f8velsen tre gange.\\n\\nSiddende
  sidestr\u00e6k\\n\\nS\u00e6t dig p\u00e5 gulvet med benene over kors.\\n\\nHold
  armene strakt foran dig, samtidig med at du fletter dine fingre.\\n\\nStr\u00e6k
  armene op over hovedet.\\n\\nDu kan ogs\u00e5 vende h\u00e5ndfladerne op mod loftet,
  s\u00e5 f\u00e5r du et st\u00f8rre str\u00e6k.\\n\\nTag en dyb ind\u00e5nding.\\n\\nN\u00e5r
  du \u00e5nder ud, str\u00e6kker du dig til den ene side.\\n\\nN\u00e5r du \u00e5nder
  ind igen, kommer du tilbage til midten.\\n\\n\u00c5nd ud, og str\u00e6k dig til
  den anden side.\\n\\nGentag \u00f8velsen tre gange.\\n\\nSommerfuglen\\n\\nS\u00e6t
  dig p\u00e5 gulvet, s\u00e5 du samler dine f\u00f8dder, mens du lader dine kn\u00e6
  falde ud til siden.\\n\\nHold fast p\u00e5 ydersiden af dine f\u00f8dder og tryk
  dine fods\u00e5ler mod hinanden.\\n\\nFors\u00f8g at holde ryggen ret.\\n\\n*Hold
  \u00f8velsen i 5-10 vejtr\u00e6kninger.*\\n\\nHvis du har sv\u00e6rt ved at f\u00e5
  benene ud til siden, s\u00e5 pr\u00f8v at presse dem udad med armene.\\n\\nDu m\u00e5
  gerne kunne m\u00e6rke et str\u00e6k, men det m\u00e5 ikke g\u00f8re ondt.\\n\\nDu
  kan ogs\u00e5 pr\u00f8ve at l\u00e6ne din krop forover, stadig med ret ryg.\\n\\nFisken\\n\\nL\u00e6g
  dig p\u00e5 ryggen og s\u00e6t albuerne i gulvet, samtidig med at dine h\u00e5ndflader
  ligger i gulvet.\\n\\nL\u00f8ft brystet op og l\u00e6g hovedet bagover.\\n\\n\u00c5nd
  ind og ud tre gange, mens du ligger i stillingen.\\n\\nHvis du kan n\u00e5 gulvet
  med hovedet, kan du st\u00f8tte p\u00e5 det og samle h\u00e6nderne foran brystet.\\n\\nL\u00f8ve\u00e5ndedr\u00e6t\\n\\nN\u00e5r
  en l\u00f8ve gaber, \u00e5bner den munden og str\u00e6kker tungen helt ud. Nu skal
  du pr\u00f8ve at g\u00f8re lige som en l\u00f8ve.\\n\\nHvil bagdelen mod h\u00e6lene
  og s\u00e6t storet\u00e6erne mod hinanden, mens du har kn\u00e6ene spredt. S\u00e6t
  h\u00e6nderne i gulvet mellem kn\u00e6ene og str\u00e6k armene. H\u00e6nderne skal
  vende, s\u00e5 fingrene peger ind mod dig.\\n\\nL\u00f8ft brystet og tag en dyb
  ind\u00e5nding. \u00c5bn munden s\u00e5 meget som muligt og r\u00e6k tungen ud.
  Lav en h\u00f8j sukkelyd, mens du \u00e5nder ud.\\n\\nGentag \u00f8velsen 3-5 gange.\\n\\nMountain
  climber\\n\\nStil dig i strakt planke.\\n\\nP\u00e5 en ind\u00e5nding tr\u00e6kker
  du h\u00f8jre ben frem ind under dig.\\nP\u00e5 en ud\u00e5nding str\u00e6kker du
  det ud igen.\\n\\nP\u00e5 n\u00e6ste ind\u00e5nding tr\u00e6kker du det venstre
  ben ind under dig.\\nP\u00e5 ud\u00e5ndingen str\u00e6kker du det ud igen.\\n\\nFors\u00f8et
  \u00f8velsen med skiftevis h\u00f8jre og venstre ben.\\n\\nLav 5-10 runder i alt.
  V\u00e6r opm\u00e6rksom p\u00e5 din vejrtr\u00e6kning.\"", "\"Eksamen p\u00e5 PBA
  i International Handel og Markedsf\u00f8ring, 2015\\n\\nCensur - her angives om
  det er internt eller eksternt\"", "\"Projekt Det \u00c5ndbare Hus\\n\\nNyhedsbrev
  nr. 4\\n\\n17. februar 2015\\n\\nI dette nyhedsbrev vil vi fort\u00e6lle om, hvorfor
  vi har valgt at anvende str\u00e5 b\u00e5de som tagmateriale og som bekl\u00e6dning
  p\u00e5 dele af yderv\u00e6ggene i Det \u00c5ndbare Hus og hvorfor vi netop har
  valgt Miscantus.\\n\\nVi giver ogs\u00e5 en opdatering p\u00e5 indsatsen for at
  lette brandkravene til bygninger med str\u00e5tag og uddyber, hvordan vi kan opfylde
  brandkravene i en \u00e5ndbar konstruktion.\\n\\nVi vil gerne sige tak for responsen
  p\u00e5 tidligere udgaver af dette nyhedsbrev. Det har allerede givet anledning
  til yderligere overvejelser.\\n\\nGod l\u00e6selyst!\\n\\nMed venlig hilsen\\n\\nEgen
  Vinding & Datter\\n\\nHaslevvej 81 - 4100 Ringsted \u2013 www.egenvinding.dk - Tlf.
  57 61 77 01 - Mail: firstname.lastname@example.org\\n\\nStatus\\n\\nAllerf\u00f8rst
  en kort status for projektet: Projektering og myndighedsbehandling foreg\u00e5r
  planm\u00e6ssigt og tidsplanen ser ud til at holde.\\n\\nVi har netop fastlagt f\u00f8rste
  spadestik til d. 6. marts kl. 14. Ringsteds borgmester Henrik Hvidesten har sagt
  ja til at komme og svinge spaden. S\u00e6t X i kalenderen - alle er velkomne! Se
  mere herom i n\u00e6ste nyhedsbrev, der kommer omkring 1. marts.\\n\\nTema: Valg
  af tag\\n\\nStr\u00e5tag har lavere milj\u00f8belastning end andre typer tag\\n\\nI
  researchen efter et godt tagmateriale har vi lavet en milj\u00f8screening af bl.a.
  st\u00e5lpladetag, tegl, diverse tagmembraner som f.eks. tagpap, samt str\u00e5.
  Vores konklusion er, at str\u00e5tag er et godt og oplagt valg. Str\u00e5 har gode
  egenskaber i en \u00e5ndbar konstruktion, fordi det tillader, at udeluften str\u00f8mmer
  igennem taget og ventilerer til det fri. Det er samtidig hydrofilt forst\u00e5et
  p\u00e5 den m\u00e5de, at det fordeler det vand, der m\u00e5tte v\u00e6re, j\u00e6vnt
  i materialet og afgiver det til tilgr\u00e6nsende materialer/luft med lavere relativ
  fugtighed.\\n\\nEn LCA har vist, at str\u00e5taget er det mest klimavenlige tag
  af alle. Miscantus, som er en art elefantgr\u00e6s, har vist sig meget lovende til
  str\u00e5tag. Miscantus er desuden egnet til grundvandsbeskyttelse, mens tagr\u00f8r
  er gode til at rense vandet p\u00e5 vejen mod v\u00e5domr\u00e5der, fordi det bruger
  kv\u00e6lstof og tilbageholder tungmetaller. Vi planl\u00e6gger at anvende tagr\u00f8r
  til str\u00e5v\u00e6ggene og Miscantus til taget. Str\u00e5tag og str\u00e5v\u00e6gge
  kan desuden bidrage til en rigtig flot arkitektur, som giver huset karakter.\\n\\nVi
  tester i projektet en ny konstruktionsm\u00e5de, til at l\u00f8se de problemer der
  tidligere har v\u00e6ret med str\u00e5tage i form af brandrisici og risiko for fugt
  og heraf f\u00f8lgende r\u00e5d og svamp. Opbygningen af v\u00e6gkonstruktionen
  er beskrevet i Nyhedsbrev nr. 2. Tagkonstruktionen vil v\u00e6re tilsvarende: Str\u00e5et
  s\u00f8mmes p\u00e5 et undertag af rupl\u00f8jede br\u00e6dder. Str\u00e5et skal
  slutte helt t\u00e6t til undertaget for at undg\u00e5 tilstedev\u00e6relse af ilt.
  Br\u00e6dderne bliver monteret p\u00e5 en tr\u00e6konstruktion, der rummer 510 mm
  isolering (papir, h\u00f8r eller hamp) og som indvendig afslutning s\u00e6ttes to
  lag gips.\\n\\nVi er blevet gjort opm\u00e6rksom p\u00e5, at der er eksempler p\u00e5
  nedsat levetid p\u00e5 str\u00e5tage monteret direkte p\u00e5 undertag. I disse
  tilf\u00e6lde er der brugt mineralsk isolering og uorganisk undertag, som ikke kan
  h\u00e5ndtere fugt. I vores tagopbygning anvender vi hydrofile materialer i hele
  konstruktionsh\u00f8jden. Derfor forventer vi ikke nedsat levetid, men da det er
  f\u00f8rste gang det bliver udf\u00f8rt p\u00e5 denne m\u00e5de, vil vi selvf\u00f8lgelig
  f\u00f8lge det meget n\u00f8je.\\n\\nS\u00e5vel tegl, tagpap og st\u00e5lpladetag
  kan ogs\u00e5 anvendes i en \u00e5ndbar konstruktion, hvor der s\u00e5 skal v\u00e6re
  en afstand mellem br\u00e6ddelag og tag, hvorfra fugten kan ventileres bort. Men
  i det samlede billede med milj\u00f8vurderinger fra LCA''en kommer str\u00e5tag
  ud med de st\u00f8rste fordele. Selv n\u00e5r man sammenligner med str\u00e5 fra
  Kina, der er transporteret 17.800 km med skib og 3000 km med lastbil, er str\u00e5
  mere milj\u00f8venligt end tegl, der er benchmark materiale i LCA''en.\\n\\nDet
  str\u00e5, vi skal bruge til Det \u00c5ndbare Hus, gror lige nu p\u00e5 en mark
  i Fuglebjerg, s\u00e5 det er produceret meget lokalt. Ved at v\u00e6lge t\u00e6kke-miscantus
  som tagmateriale opn\u00e5r vi en winwin-win situation: Vi f\u00e5r et optimalt
  tagmateriale, dyrkning af Miscantus er med til sikre vores grundvand og i det hele
  taget er sk\u00e5nsomt for milj\u00f8et - og vi bidrager til at skabe lokale arbejdspladser,
  b\u00e5de ved dyrkning af elefantgr\u00e6s og ved t\u00e6kkearbejdet, der jo n\u00f8dvendigvis
  m\u00e5 udf\u00f8res lokalt.\\n\\nMiscantus\\n\\nEn s\u00e6rlig type elefantgr\u00e6s
  med \u00f8konomisk og milj\u00f8m\u00e6ssigt potentiale\\n\\nMiscantus har en r\u00e6kke
  gode egenskaber b\u00e5de til at bygge med og ved dyrkningen. Det har den force
  at det hurtigt d\u00e6kker jorden s\u00e5 meget, at der ikke er behov for ukrudtsbek\u00e6mpelse,
  der skal dog luges det f\u00f8rste \u00e5r. Det kan derfor dyrkes \u00f8kologisk
  og derved undg\u00e5r man pesticider og n\u00e6ringsstoffer fra kunstg\u00f8dning
  i grundvandet. Fors\u00f8g viser, at der skal g\u00f8des med 35 kg N/ha og at alt
  dette bliver bundet i rodzonen. Dermed er der ingen udvaskning til grundvandet.\\n\\nDerfor
  er det ogs\u00e5 velegnet til grundvandss\u00e5rbare omr\u00e5der, og der er netop
  brug for at finde afgr\u00f8der, der kan dyrkes p\u00e5 disse omr\u00e5der og som
  samtidig kan afs\u00e6ttes p\u00e5 markedet og give en \u00f8konomisk rentabel produktion.\\n\\nMiscantus
  fra plantning til tagmateriale \u2013 her p\u00e5 Hollandske huse i t\u00e6t landsbymilj\u00f8\\n\\nEt
  projekt, der ogs\u00e5 er st\u00f8ttet af Milj\u00f8styrelsens Program for Gr\u00f8n
  Teknologi kaldet \\\"Beskyt grundvand \u2013 dyrk str\u00e5tag\\\", arbejder med
  at udvikle og opskalere produktionen af Miscantus, se mere her: http://straatagetskontor.dk/nyt-miljoprojekt/\\n\\nEn
  enkelt producent har dog allerede dyrket Miscantus og anvendt det til str\u00e5tag
  i 10 \u00e5r. Det er netop denne producent, S\u00f8ren Vodder, som leverer str\u00e5ene
  til Det \u00c5ndbare Hus.\\n\\nMen det danske elefantgr\u00e6s har h\u00e5rd konkurrence
  bl.a. fra tagr\u00f8r fra Kina, som s\u00e6lges billigt p\u00e5 det danske marked.
  Prisen skal dog vejes op imod kvaliteten. T\u00e6kkemand Brian Randrup fra \u00c5rs
  har gode erfaringer med at anvende Miscantus. Han mener ikke, at det samlet set
  er dyrere end andre gode tagr\u00f8r. Han har nemlig endnu aldrig m\u00e5tte kassere
  nogen leverance af Miscantus, mens han ofte har kasseret 10 % af de billigere tagr\u00f8r,
  som han har oplevet har haft en meget svingende kvalitet. Samtidig mener han, at
  Miscantus giver flotte tage og er rart at arbejde med, og s\u00e5 er det danskproduceret
  og der er 10 \u00e5rs ansvarsgaranti.\\n\\nBrandkrav og forsikring\\n\\nNye brandtests
  kan v\u00e6re med til at \u00e6ndre brandkrav\\n\\nDer er i dag meget restriktive
  brandkrav til str\u00e5t\u00e6kte bygninger. Det skyldes den traditionelle praksis,
  hvor str\u00e5et blev syet p\u00e5 l\u00e6gter, og der derfor var god adgang til
  ilt og dermed stor brandrisiko.\\n\\nDet betyder at ejendomme i dag, selvom de har
  en godkendt brandsikring, har et afstandskrav til skel p\u00e5 10 meter. Det begr\u00e6nser
  anvendelsen af str\u00e5tag meget. Branchen arbejder derfor intenst p\u00e5 at f\u00e5
  afstandskravet sat ned til 5 meter.\\n\\nDansk Brandteknisk Institut har netop gennemf\u00f8rt
  nye brandtest, med forskellige l\u00f8sninger monteret direkte p\u00e5 undertaget
  uden l\u00e6gter, bl.a. med mineraluld og masonit, eller branddug. I Det \u00c5ndbare
  Hus er vi g\u00e5et skridtet videre og bruger rupl\u00f8jede br\u00e6dder, der ligeledes
  har en brandreducerende funktion, der dog p.t. ikke er testet. Br\u00e6dderne er
  valgt, fordi de i mods\u00e6tning til de l\u00f8sninger, der er testet, kan transportere
  fugten ud gennem konstruktionen.\\n\\nEn unders\u00f8gelse fra forsikringsselskabet
  Topdanmark, hvor den faktiske risiko for brand i huse med og uden str\u00e5tage
  blev sammenlignet gennem 10 \u00e5r, har vist, at skadefrekvensen stort set er den
  samme, n\u00e5r str\u00e5tagene er brandsikret. De nye brandtest peger i samme retning.\\n\\nDen
  nuv\u00e6rende praksis med dyrere forsikringer p\u00e5 bygninger med str\u00e5tag
  pga. brandrisiko m\u00e5 ogs\u00e5 forventes at blive normaliseret som f\u00f8lge
  af de nye brandtests.\\n\\nSe tidligere nyhedsbreve p\u00e5: http://egenvinding.dk/project/detaandbarehus/\\n\\nNyhedsbrevet
  om Det \u00c5ndbare Hus kan tilmeldes og afmeldes p\u00e5 email@example.com\"",
  "\"Tlf. : 44 94 37 25\\n\\nMobil 29 27 20 45\\n\\nMobil 29 27 20 45\\n\\nE-Mail
  : email@example.com\\n\\n3. maj 2022\\n\\nAFSLUTNINGSFEST!\\n\\nFredag den 20. maj
  2022 kl. 16.00 \u2013 22.00\\n\\nSted :\\n\\nR\u00f8dovreg\u00e5rd \\\"Loen\\\"\\n\\nKirkesvinget
  1 (ved R\u00f8dovre Kirke) 2610 R\u00f8dovre\\n\\nPris :\\n\\nKr. 200,00 pr. deltager\\n\\nTilmelding:\\n\\nSenest
  onsdag den 11. maj 2022 (meget gerne f\u00f8r)\\n\\nBetaling :\\n\\nTil Inge Lise\\n\\nArbejdsfordeling:
  NB der er hyret personale til opvasken.\\n\\nAktiviteter:\\n\\nPr\u00e6mieoverr\u00e6kkelser\\n\\nDer
  er pr\u00e6mie til 1. \u2013 2. \u2013 3. i hver r\u00e6kke.\\n\\nNoget til maven:\\n\\n-
  Dampet r\u00f8dsp\u00e6ttefilet m laksemousse\\n- H\u00f8jreb\\n- Medallions  m.
  champignon \u00e0 la cr\u00e8me\\n- Frikadeller\\n- Fl\u00f8dekartofler og gr\u00f8n
  salat\\n- Ostelagkage m. kaffe/te\\n- \u00d8l og vand KUN 10.- kr.\\n- Hel flaske
  r\u00f8d/hvid/rosevin KUN kr. 75.-\\n- Cognac / Bailey kr. 20,-\\n\\nSocialt samv\u00e6r:
  \\\"Vi m\u00f8der vore konkurrenter fra holdkampene p\u00e5 en ny- og afslappet
  m\u00e5de\\\"\\n\\nVelkommen til festen.\\n\\n/Paul\\n\\n- mulighed for dans til
  god musik\\n- vi hygger os sammen og mindes en god s\u00e6son\"", "\"An employer
  branding strategy for Region Hovedstaden Psykiatri\\n\\nKandidatafhandling udarbejdet
  af: Brianne Nybroe Nielsen\\n\\nVejleder:\\n\\nLiza Castro Christiansen\\n\\nAfleveringsdato:
  17. august 2015\\n\\nAntal anslag: 178.392, svarende til 78,4 normalsider\\n\\nExecutive
  summary\\n\\nThis thesis addresses the problem regarding Region Hovedstaden Psykiatri''s
  ability to attract and maintain caretakers to the organization in a labor market
  that seems to become more and more under pressure. The organization, which is a
  part of the public service in Denmark, has a complicated relationship with the mother
  company Region Hovedstaden and have not yet developed any branding strategy.\\n\\nThe
  theoretical foundation for the main subject, employer branding and the elements
  that affects it, are presented. Here it is emphasized how important the alignment
  between all the elements are. The body of the employer brand is constructed upon
  the factors that are similar within the company''s identity, profile and image.\\n\\nTo
  provide an overview of the elements that affect employer brand a flowchart is designed.
  The purpose of flowchart is to benchmark the extent to which the company lives up
  to the theory of employer brand and from that to see where the focus areas is in
  developing an employer branding strategy.\\n\\nThe perspective of the thesis is
  social constructivism that supports the chosen method, qualitative interviews, used
  to collect data for the analysis. The analysis is based on 15 interviews with respondents
  who all have recently been through a recruitment process at Region Hovedstaden Psykiatri.
  To interpret the interviews the hermeneutical circle is used.\\n\\nThe research
  showed that the organization has a very weak image. The organization also lacks
  external branding. However, the organization''s profile are in line with its visions
  and values.\\n\\nThe employees'' perception of the organization as a working place
  are in line with the organization''s profile except for two centers, Glostrup and
  Hvidovre, where the employees'' perception deviates to some extent from the organization''s
  profile. This should be a focus area for the management.\\n\\nIt is assessed that
  there is a need for HR related competences in the recruitment process in order for
  the organization to live up to its values in this process.\\n\\nA corporate brand
  must be developed and communicated externally to support the company image.\\n\\nThe
  research shows that the employer brand should focus on the organization focusing
  on people. The people focus is expressed through working processed characterized
  by communication and diversity.\\n\\nThe employees at Region Hovedstaden Psykiatri
  possesses a high professional level which is developed by the possibilities, that
  the organization provides in terms of education.\\n\\nFurthermore Region Hovedstaden
  Psykiatri offers a high financially compensation for the competences which the employees
  possesses.\\n\\nIndholdsfortegnelse\\n\\n1 INTRODUKTION TIL REGION HOVEDSTADEN PSYKIATRI
  ...................................................................................
  3\\n\\n1 Introduktion til Region Hovedstaden Psykiatri\\n\\n1.1 Indledning\\n\\n\\\"Der
  er frihed og diversitet ved arbejdet i psykiatrien. Det er det, der skal brandes.
  Det er her den st\u00f8rste forskel er fra somatikken. Somatikken kan groft sagt
  ses meget mere som samleb\u00e5ndsarbejde. \\\" (bilag 4, M6).\\n\\n\\\"Jeg var
  meget usikker og bange f\u00f8rste gang, jeg skulle herud (p\u00e5 den lukkede afdeling
  p\u00e5 et psykiatrisk center). Der er mange, der har det s\u00e5dan ''nej nej psykiatrien
  det er ikke mig'', men det er fordi, de ikke ved, hvad det er\\\" (bilag 4, M12).\\n\\n\\\"Der
  var 5 deltagere med til samtalen, men de havde slet ikke forberedt sig. Jeg t\u00e6nkte
  ''Er det patienter det her?'' Det virkede s\u00e5 uprofessionelt\\\" (bilag 4, M1).\\n\\n\\\"Der
  er ingen fokus p\u00e5 visionerne og v\u00e6rdierne, de skal inddrages mere i jobsamtalen.
  Jeg vidste heldigvis hvad de er i kraft af, at jeg komme fra et andet center\\\"
  (bilag 4, M2).\\n\\n\\\"Hvis de (RHP) brander sig p\u00e5, hvor langt fagligt og
  karrierem\u00e6ssigt man kan n\u00e5 her, ville der v\u00e6re mange flere fra somatikken,
  der ville s\u00f8ge over i psykiatrien\\\" (bilag 4, M1).\\n\\nS\u00e5dan omtaler
  udvalgte medarbejdere egne fordomme overfor at arbejdet i Region Hovedstaden Psykiatri
  (herefter RHP), rekrutteringsprocessen og hvordan arbejdspladsen opfattes af de
  eksisterende medarbejdere. Somatik betyder legemlig (www.denstoredanske.dk) og dermed
  er somatikken behandling af legemlige sygdomme, til forskel fra psykiatrien hvor
  det er de psykiske sygdomme, der bliver behandlet.\\n\\nOver den n\u00e6ste \u00e5rr\u00e6kke
  vil arbejdsmarkedet blive presset, da antallet af personer i den arbejdsdygtige
  alder vil falde drastisk. De \u00e5rgange, der st\u00e5r p\u00e5 t\u00e6rsklen til
  at tr\u00e6de ind p\u00e5 arbejdsmarkedet, stammer fra 1980''erne, som er de mindste
  f\u00f8dsels\u00e5rgange i mere end hundrede \u00e5r (Christensen, 2007). Desuden
  er arbejdsstyrken allerede nu faldet med 30.000 til 40.000 personer hen over de
  sidste \u00e5r, og der findes ingen statistikker over fremtidige prognoser, men
  tendensen er klar (Berlinske Business, 2013). Tendensen er den samme i hele Europa,
  hvor det ventes, at befolkningsandelen i den arbejdsdygtige alder vil falde fra
  at udg\u00f8re 62 % af befolkningen til kun at udg\u00f8re 49 % af befolkningen
  (Wilden et al, 2014). Denne udvikling i befolkningssammens\u00e6tningen skal sammenholdes
  med, at det forventes, at der vil blive uddannet f\u00e6rre sygeplejersker end,
  der g\u00e5r p\u00e5 pension (www.sygeplejerskeuddannelsen.dk).\\n\\nDet betyder,
  at der bliver kamp om medarbejderne og is\u00e6r om sygeplejerskerne. For virksomhederne
  betyder det, at de skal v\u00e6re skrappere i deres kommunikation til omverdenen
  og g\u00f8re brug af medarbejdere med strategiske v\u00e6rkt\u00f8jer (branding),
  der skal v\u00e6re med til at identificere og differentiere virksomheden fra konkurrenterne
  (Wilden et al, 2014) (Backhaus & Tikoo, 2004). P\u00e5 den m\u00e5de bliver virksomheden
  employer of choice, hvilket vil \u00f8ge chancen for at finde de ''rigtige'' medarbejdere
  i f\u00f8rste fors\u00f8g (Wilden et al, 2014). For at virksomheden kan brande sig
  som arbejdsplads, skal de benytte employer branding, hvilket er denne afhandlings
  omdrejningspunkt.\\n\\nDanmark betegnes som et velf\u00e6rdssamfund, der yder service
  til sine borgere i form af gratis adgang til behandling af sygdomme, herunder ogs\u00e5
  psykiske sygdomme, der blandt andet behandles af RHP. P\u00e5 den baggrund kan det
  anses som v\u00e6rende et samfundsproblem, at det h\u00f8jst sandsynligt bliver
  et problem at skaffe tilstr\u00e6kkelig arbejdskraft i form af blandt andre sygeplejersker,
  da de udg\u00f8r en essentiel funktion i behandlingen af syge personer, hvad enten
  det er inden for somatikken eller psykiatrien.\\n\\n1.2 Problemstilling\\n\\nRHP
  har store bekymringer omkring den udvikling, der er i arbejdsmarkedet, og ser derfor
  store problemer med den fremtidige rekruttering af plejepersonalet, hvor sygeplejerskerne
  h\u00f8rer ind under. Konceptet bag employer brand, er at det skal bruges til at
  tiltr\u00e6kke, motivere og fastholde de rigtige medarbejdere (Backhaus & Tikoo,
  2004) (Seldorf, 2008, s. 11), og derfor er det et muligt v\u00e6rkt\u00f8j, der
  kan benyttes i et presset arbejdsmarked. Denne afhandling har p\u00e5 baggrund af
  ovenst\u00e5ende til form\u00e5l at s\u00e6tte fokus p\u00e5 rekruttering af plejepersonalet
  hos RHP.\\n\\n1.3 Problemformulering\\n\\nP\u00e5 baggrund af ovenst\u00e5ende problemstilling,
  stilles nedenst\u00e5ende problemformulering, der har til form\u00e5l at give et
  tydeligt og dybdeg\u00e5ende svar p\u00e5, hvordan RHP skal h\u00e5ndtere deres
  rekrutteringsproces i fremtiden.\\n\\nHvordan skal en employer branding strategi
  sammens\u00e6ttes for at skabe konkurrencefordele i rekrutteringsprocessen for RHP?\\n\\nFor
  at kunne besvare denne problemformulering skal f\u00f8lgende undersp\u00f8rgsm\u00e5l
  besvares, da de er med til at underbygge hovedsp\u00f8rgsm\u00e5let.\\n\\n Hvilken
  brandingstrategi har RHP allerede udviklet?\\n Hvordan opfatter medarbejderne virksomheden
  som arbejdsplads?\\n Hvilken profil har virksomheden?\\n Hvad er virksomhedens omd\u00f8mme?\\n
  Hvordan opleves den nuv\u00e6rende rekrutteringsproces af ans\u00f8gerne?\\n\\n184.108.40.206
  Afgr\u00e6nsning\\n\\nProblemstillingen samt det teoretiske grundlag medf\u00f8rer,
  at der bevidst foretages afgr\u00e6nsninger for at g\u00f8re afhandlingen mere specifik.
  Der er mange retninger man kan fokusere p\u00e5 inden for employer brandingfeltet,
  men denne afhandling tager sit udgangspunkt i rekrutteringsprocessen, og derfor
  kommer der en naturlig afgr\u00e6nsning til de elementer, der omhandler dette.\\n\\nAfhandlingen
  er et single casestudie, der kun omhandler elementer, der har relation til RHS''s
  rekrutteringsproces og employer brand.\\n\\nDa RHP er en stor virksomhed, der best\u00e5r
  af mange faggrupper, og da rekrutteringsprocessen afviger lidt inden for de forskellige
  faggrupper, begr\u00e6nser unders\u00f8gelsen sig til at omfatte faggruppen, der
  h\u00f8rer under plejepersonalet. Det vil sige sygeplejersker og SOSU-assistenter.
  Denne faggruppe er let tilg\u00e6ngelig i forhold til deltagelsen i unders\u00f8gelsen
  og yderst relevant i forhold til problemfeltet.\\n\\nKonkurrenterne til RHP anses
  i denne afhandling som v\u00e6rende somatikken.\\n\\nDenne afhandling afgr\u00e6nses
  fra, at skulle g\u00e5 i dybden med behandlingsmetoder, som benyttes i forbindelse
  med behandling af patienter.\\n\\n1.4 Pr\u00e6sentation af Region Hovedstaden Psykiatri\\n\\nI
  det f\u00f8lgende vil RHP som virksomhed blive pr\u00e6senteret. Virksomhedens visioner,
  v\u00e6rdier og strategier, vil blive pr\u00e6senteret og vurderet i employer branding
  \u00f8jemed, da de er centrale elementer i employer brandteorien. Efterf\u00f8lgende
  vil virksomhedens organisatoriske opbygning, og herindunder den indviklede relation
  til Region Hovedstaden, blive beskrevet og vurderet.\\n\\nFor at sikre tryghed i
  rekrutteringsprocessen har RHP udarbejdet en rekrutteringsguide samt en vejledning
  for ops\u00e6tning af stillingsannoncer, som vil blive beskrevet og vurderet i forhold
  til de opstillede visioner og v\u00e6rdis\u00e6ttet.\\n\\n1.4.1 Visioner\\n\\nRHP
  har til opgave at diagnosticere, behandle og rehabilitere mennesker, der lider af
  en psykisk sygdom. Regionsr\u00e5det har udarbejdet ti visioner, der skal fungere
  som en vejviser for den retning, som det \u00f8nskes, at RHP skal arbejde sig henimod.
  Overskriften for visionerne er Patienten i Centrum, og bygger p\u00e5, at der skal
  s\u00e6ttes fokus p\u00e5, at det er patienten, der er eksperten i sit eget liv,
  og at der derfor skal tages hensyn til de \u00f8nsker i behandlingsprocessen, som
  patienten har. \\\"Erfaringen viser, at mange har behov for en hurtig og intensiv
  indsats, der kan f\u00e5 dem tilbage p\u00e5 sporet. Tilbage i den behandling, som
  de m\u00e5ske er i gang med. Tilbage til deres normale dagligliv, deres n\u00e6rmilj\u00f8
  og netv\u00e6rk\\\" (Visioner, s.3). Det er alts\u00e5 et m\u00e5l, at f\u00e5 patienterne
  tilbage til de vante rammer i hverdagen, da det er her, de skal fungere.\\n\\nVisionerne
  indeholder ti centrale elementer, der lyder som f\u00f8lgende.\\n\\n1. En psykiatri
  med patienten i centrum \u2013 patienten er beslutningstageren\\n2. En psykiatri
  baseret p\u00e5 recovery, netv\u00e6rksinddragelse og rehabilitering\\n\\n3. En
  psykiatri med en bred vifte af behandlingstilbud\\n\\n\u2013 4. En psykiatri med
  let adgang til udredning og behandling \u2013 let og hurtig adgang til behandling
  5. En psykiatri med fokus p\u00e5 forebyggelse, ambulant og ops\u00f8gende indsats
  \u2013 fokus p\u00e5 tidlig udredning og intensiv behandling 6. En psykiatri med
  sammenh\u00e6ngende forl\u00f8b og samarbejde p\u00e5 tv\u00e6rs \u2013 effektive
  og velkoordinerede behandlingsforl\u00f8b 7. En psykiatri hvor tvang minimeres \u2013
  tvang opleves som overgreb\\n\\nalle skal tilbydes optimal behandling\\n\\n8. En
  psykiatri med kompetente og engagerede medarbejdere \u2013 gode arbejdsforhold og
  udviklingsmuligheder\\n9. En psykiatri i stimulerende fysiske rammer \u2013 tidssvarende
  og tilstr\u00e6kkelige fysiske rammer\\n10. En psykiatri med fokus p\u00e5 forskning,
  udvikling og fornyelse \u2013 skal v\u00e6re f\u00f8rende i forskning i Danmark
  og skal indg\u00e5 aktivt i international forskning (Visioner, s.3).\\n\\nSet i
  employer branding perspektivet vurderes visionen om \\\"en psykiatri med kompetente
  og engagerede medarbejdere\\\" som v\u00e6rende interessant. Under denne vision
  beskrives \u00f8nsket om at levere en h\u00f8j kvalitet samt omsorg for patienterne
  hvilket foruds\u00e6tter, at medarbejderne er kompetente og engagerede. If\u00f8lge
  visionerne bliver dette \u00f8nske opfyldt ved at efteruddanne personalet samt tage
  h\u00e5nd om et godt arbejdsklima hvilket betyder, at der skal s\u00e6ttes fokus
  p\u00e5 udviklingsmulighederne i virksomheden (Ibid.).\\n\\n6\\n\\n1.4.2 V\u00e6rdierne\\n\\nFor
  at udvikle et v\u00e6rdigrundlag i RHP har v\u00e6rdiambassad\u00f8rer v\u00e6ret
  rundt p\u00e5 alle virksomhedens centre og sociale tilbud, hvor de har diskuteret,
  hvilke v\u00e6rdier virksomhede arbejde ud fra i dagligdagen. Resultatet af denne
  omfattende unders\u00f8gelse er f\u00f8lgende fire v\u00e6rdier, som skal findes
  under overskriften Med Mennesket I Centrum:\\n\\n* Faglighed \u2013 som i kompetent,
  professionel og dygtig\\n* Respekt \u2013 som i loyal, p\u00e5lidelig og handlingsorienteret\\n*
  Ansvar \u2013 som i samarbejde, anerkendelse, indlevelse, empati og tillid\\n* Udvikling\\n\u2013
  som i innovation, nyt\u00e6nkende, vision\u00e6r og m\u00e5lrettet.\\n\\nSom overskriften
  henviser til, er fokusset i RHP rettet imod mennesket, b\u00e5de patienter, deres
  p\u00e5r\u00f8rende og medarbejdere (Psykiatriens v\u00e6rdigrundlag). Det vurderes,
  at der er en kontinuitet mellem v\u00e6rdigrundlaget og visionerne, som umiddelbart
  virker til at bygge oven p\u00e5 hinanden. F\u00e6lles for visionerne og v\u00e6rdigrundlaget
  er, at de tager udgangspunkt i patienten. S\u00e5 er sp\u00f8rgsm\u00e5let bare,
  om virksomheden lever op til v\u00e6rdierne, eller om det bare er ord. Mange virksomheder
  glemmer nemlig at f\u00f8lge v\u00e6rdierne til d\u00f8rs, hvilket kan skabe flere
  problemer (Berlinske Business, 2010). Martin Lund, Psykiatridirekt\u00f8r, mener
  dog, at den benyttede metode til udarbejdelsen af v\u00e6rdigrundlaget g\u00f8r,
  at v\u00e6rdierne bliver udlevet i virksomheden, men er godt klar over, at der skal
  arbejdes med dem internt ude p\u00e5 centrene for at f\u00e5 dem arbejdet ind i
  hverdagens handlem\u00e5de (Psykiatriens v\u00e6rdigrundlag).\\n\\nIgennem hele
  afhandlingen vil der blive henvist til b\u00e5de v\u00e6rdigrundlaget og visionerne,
  da de spiller en v\u00e6sentlig rolle i employer branding teorien.\\n\\n1.4.3 Strategier
  for RHP\\n\\nFor at f\u00e5 indblik i RHP har jeg flere gange henvendt mig til mine
  kontaktpersoner med henblik p\u00e5 at f\u00e5 adgang til virksomhedens forskellige
  strategier, men flere gange har de meldt tilbage, at den efterspurgte strategi ikke
  fandtes i organisation. Jeg har ogs\u00e5 henvendt mig til min kontaktperson i Region
  Hovedstaden, men svaret var desv\u00e6rre det samme her. P\u00e5 trods af de manglende
  strategier er der udarbejdet en personalepolitik, som er g\u00e6ldende for hele
  regionen, herunder ogs\u00e5 RHP. Personalepolitikkens vision lyder s\u00e5ledes:
  \\\" Vi skaber og videreudvikler job og arbejdspladser, som er attraktive for nuv\u00e6rende
  og kommende ledere og medarbejdere. Vi s\u00e6tter ledernes og medarbejdernes trivsel
  og arbejdsgl\u00e6de h\u00f8jt, og anerkendelse er en naturlig del af hverdagen.
  Vi er kendetegnet ved h\u00f8j faglig kvalitet, indflydelse p\u00e5 eget arbejde
  og ved at\\n\\ntage ansvar. Vi l\u00f8ser opgaverne i et professionelt samarbejde
  mellem ansatte, patienter/brugere, p\u00e5r\u00f8rende og borgere\\\" (Personalepolitikken,
  2008).\\n\\nPersonalepolitikken fremh\u00e6ver fire temaer, der skal v\u00e6re med
  til at opfylde visionen for Region Hovedstaden samt n\u00e5 regionens m\u00e5l:\\n\\n*
  Ledelse og samarbejde\\n* Udvikling og l\u00e6ring\\n* Det sunde arbejdsliv\\n*
  Ans\u00e6ttelsesvilk\u00e5r (Personale politikken, 2008).\\n\\nDet vurderes, at
  der er en r\u00f8d tr\u00e5d der g\u00e5r igen fra RHP\u00b4s egne udarbejdede visioner
  og v\u00e6rdigrundlag, hvor begreberne udvikling, l\u00e6ring og ledelse g\u00e5r
  igen. Hermed bygges der en god grobund og et solidt fundament for udarbejdelsen
  af et employer brand, der kan v\u00e6re med til at optimere rekrutteringsprocessen.\\n\\n1.4.4
  Forholdet til Region Hovedstaden\\n\\nDen 1. januar 2007 blev en stor landsd\u00e6kkende
  reform gennemf\u00f8rt, hvor landets Amtskommuner blev nedlagt (www.danmarkshistorien.dk)
  og 5 Regioner opstod, herunder Region Hovedstaden (www.regioner.dk). Regionerne
  styres af regionsr\u00e5dene, der best\u00e5r af 41 folkevalgte medlemmer, som v\u00e6lges
  hvert 4. \u00e5r. Region Hovedstaden omfatter K\u00f8benhavn og omegn, Nordsj\u00e6lland
  samt Bornholm. Regionen huser 1,6 millioner indbyggere, hvilket g\u00f8r det til
  landets meste befolkningsrige region.\\n\\nRegion Hovedstaden er en kompleks organisation,
  der best\u00e5r af 12 virksomheder samt 6 centre. Virksomhederne best\u00e5r af
  8 hospitaler, RHP, Den Sociale Virksomhed, Den Pr\u00e6hospitale Virksomhed samt
  Region Hovedstadens Apotek. De 6 centre best\u00e5r af Center for HR, Center for
  It, Medico og Telefoni, Center for Kommunikation, Center for Regional Udvikling,
  Center for Sundhed samt Center for \u00d8konomi.\\n\\nVirksomhederne, Den Sociale
  Virksomhed, Den Pr\u00e6hospitale Virksomhed og Region Hovedstadens Apotek, Center
  for It, Medico og Telefoni og Center for HR er tv\u00e6rfaglige funktioner. Region
  Hovedstaden besk\u00e6ftiger 40.400 medarbejdere (Fakta om Region Hovedstaden, 2013),
  hvor af de 4.710 medarbejdere er ansat i RHP. Se figur 1.1 nedenfor.\\n\\nAt HR
  er en tv\u00e6rfaglig funktion, har betydning for RHP''s rekrutteringsproces, da
  de hermed er underlagt nogle retningslinjer, som er g\u00e6ldende for alle virksomheder
  i organisationen, men som ikke n\u00f8dvendigvis er hensigtsm\u00e6ssige for RHP.
  For eksempel er der for Region Hovedstaden indf\u00f8rt et e-rekrutteringssystem,
  som alle virksomheder i organisationen er underlagt. Det har sine fordele som for
  eksempel at g\u00f8re den administrative del af rekrutteringsprocessen lettere at
  h\u00e5ndtere (Larsen, 2006, s. 129), samt at udgiften, vedindf\u00f8rslen af systemet
  bliver fordelt. Men da systemet d\u00e6kker over mange virksomheder, har det ikke
  v\u00e6ret muligt at fremskaffe statistikker, som kunne v\u00e6re nyttige i forbindelse
  med udarbejdelsen af denne afhandling. En statistik, som kunne v\u00e6re interessant
  at se p\u00e5, er personaleoms\u00e6tningen for RHP, men den statistik har det ikke
  v\u00e6ret muligt at udtr\u00e6kke for RHP.\\n\\nEt andet problem ved, at HR er
  en tv\u00e6rfaglig funktion, er, at n\u00e5r man arbejder i RHP, er man ansat af
  Region Hovedstaden, og det er deres logo, der st\u00e5r p\u00e5 l\u00f8nsedlerne,
  hvilket kan skabe forvirring hos medarbejderne om hvilken virksomhed, de arbejder
  i.\\n\\n1.4.5 Organisationen og dens struktur\\n\\nRHP har til opgave at diagnosticere
  og behandle mennesker med psykiske sygdomme. Behandlingen af patienterne er \\\"baseret
  p\u00e5 forskning og udvikling af medicinske og psykologiske behandlingsmetoder
  samt andre behandlingsformer\\\" (www.psykiatri-regionh.dk), hvilket er i fuld overensstemmelse
  med virksomhedens vision om at have \\\"fokus p\u00e5 forskning, udvikling og fornyelse\\\"
  (Visionerne). \u00c5rligt er der 1,1 million ambulante bes\u00f8g p\u00e5 psykiatriske
  sygehuse fordelt p\u00e5 120.000 patienter, hvoraf ca. 50.000 bliver indlagt (Fakta
  om sundhedsv\u00e6senet - sundhedsv\u00e6senet i tal, 2015). Patienternes omfatter
  psykisk syge voksne s\u00e5vel som b\u00f8rn med lidelser, der varierer fra lettere
  til sv\u00e6rt syge. Behandlingsformerne g\u00e5r fra ambulant behandling til behandling
  p\u00e5 lukkede afdelinger og tvangsindl\u00e6ggelser. Antallet af patienter er
  st\u00f8t stigende mens, antallet af sengepladser bliver mindre, hvilket g\u00f8r,
  at der er blevet flere ambulante indl\u00e6ggelser. Selv om det er et udtryk for
  en virksomhed, som er presset p\u00e5 ressourcer, er denne udvikling i overensstemmelse
  med visionen om at f\u00e5 patienterne hurtigt \\\"tilbage i deres normale daglige
  liv\\\" (Visioner, s. 3). RHP er den st\u00f8rste af sin art i Danmark og behandler
  ca. 32 procent af alle psykiske syge i landet (www.psykiatriregionh.dk).\\n\\nRHP
  best\u00e5r af 10 Centre fordelt udover hele regionen, samt et Center for B\u00f8rn
  og Ungdoms psykiatri og tre Centre for Sociale tilbud, se figur 1.2. Nogle af Centrene
  er helt nye som for eksempel Psykiatrisk Center Amager, som er placeret i gr\u00f8nne
  omgivelser p\u00e5 en stille vej, og andre steder er af en noget \u00e6ldre dato
  som Psykiatrisk Center Hvidovre. F\u00e6lles for de centre, jeg har bes\u00f8gt
  i forbindelse med udarbejdelsen af denne afhandling er, at der er mange lange tomme
  gange og utroligt stille. Visionen om en \\\"psykiatri i stimulerende rammer\\\"
  harmonerer med at Centrene ligger i gr\u00f8nne og rolige omgivelser, men det vurderes
  dog, at ikke alle Centrene er lige tidsvarende.\\n\\nTabel 1.1 Personale sammens\u00e6tning
  i RHP opgjort den 31. april 2012 ( www.psykiatri-regionh.dk)\\n\\n| Personalesammens\u00e6tning
  |  |\\n|---|---|\\n| Stillinger | Antal ansat- te |\\n| L\u00e6gepersonale | 557
  |\\n| Plejepersonale | 2.444 |\\n| \u00d8vrigt sundhedsfagligt personale | 519 |\\n|
  Administrativt personale | 815 |\\n| Servicepersonale og teknisk personale | 208
  |\\n| P\u00e6dagoger | 167 |\\n| I alt | 4.710 |\\n| Personalesammens\u00e6tningen
  den 31.4.2012 |  |\\n\\n.\\n\\nSom det ses i tabel nr. 1.1 ovenfor, er der ca. 4.710
  personer ansat i RHP, og disse medarbejdere er fordelt i f\u00f8lgende faggrupper:
  Det administrative personale befinder sig p\u00e5 adressen Kristineberg 3 p\u00e5
  \u00d8sterbro i K\u00f8benhavn (i daglig tale Kristineberg) og best\u00e5r af f\u00f8lgende
  afdelinger; HR, \u00d8konomi & Planl\u00e6gning, Kvalitet & Udvikling, Sekretariat
  & Kommunikation samt Projekt & Drift. Den administrative faggruppe er fysisk adskilt
  fra personalet p\u00e5 behandlingscentrene, hvor de \u00f8vrige personalegrupper
  har deres daglige\\n\\ngang. Dette betyder ogs\u00e5, at det administrative personale
  ikke har nogen kontakt med patientgruppen og kun i begr\u00e6nset omfang har kontakt
  med de \u00f8vrige personalegrupper. Der etableres dog kontakt, n\u00e5r en medarbejder
  bliver ansat, da der en gang om m\u00e5neden bliver afholdt velkomstm\u00f8de for
  nye medarbejdere i lokalerne p\u00e5 Kristineberg. Her bliver generelle strukturer
  for arbejdsformer og praktiske informationer gennemg\u00e5et for de nyansatte.\\n\\n1.5
  Rekruttering af nye medarbejdere til RHP\\n\\nFor at ensarte samt overskueligg\u00f8re
  rekrutteringsprocessen for de medarbejdere, der har til opgave at rekruttere, har
  RHP udarbejdet en rekrutteringsguide (rekrutteringsguiden er vedlagt afhandlingen
  som bilag 1). Form\u00e5let med rekrutteringsguiden er, at den skal ses som \\\"et
  inspirationskatalog til ledere og rekrutteringsudvalg\\\" (Bilag 1). Da m\u00e5lgruppen
  for Rekrutteringsguiden er medarbejdere, der ikke til daglig arbejder med HR, er
  den skrevet i et forst\u00e5eligt sprog. Et rekrutteringsudvalg (ogs\u00e5 kaldet
  ans\u00e6ttelsesudvalg) er en udvalgt gruppe medarbejdere, som deltager i rekrutteringsprocessen.
  I denne gruppe, som denne afhandling tager udgangspunkt i, vil et ans\u00e6ttelsesudvalg
  best\u00e5 af en afdelingssygeplejerske og de n\u00e6rmeste kollegaer. I Rekrutteringsguiden
  st\u00e5r der, at antallet af repr\u00e6sentanter i ans\u00e6ttelsesudvalget skal
  begr\u00e6nses til to til seks personer (bilag 1).\\n\\nRekrutteringsguiden er udarbejdet
  af Louise Berg, Chefkonsulent hos RHP (som ogs\u00e5 er min kontaktperson i RHP).
  Guiden er udarbejdet i fors\u00f8g p\u00e5 at ensrette rekrutteringsprocessen uanset
  hvor i virksomheden, der skal rekrutteres. Desuden skal den virke som et v\u00e6rkt\u00f8j,
  der skal g\u00f8re arbejdsgangen nemmere ved rekruttering og fungere som en tjekliste,
  s\u00e5 fejl og misforst\u00e5elser elimineres. Region Hovedstaden har fundet Rekrutteringsguiden
  s\u00e5 anvendelig at de har \\\"l\u00e5nt\\\" den for at benytte den andre steder
  i virksomheden. I guiden findes der henvisninger til steder p\u00e5 intranettet,
  for der ligger skabeloner til diverse breve (afslag, velkomst og s\u00e5 videre),
  og desuden g\u00f8r den ogs\u00e5 opm\u00e6rksom p\u00e5 forskellige forhold, som
  brugeren skal v\u00e6re ekstra opm\u00e6rksom p\u00e5 ved en rekruttering, som for
  eksempel, at man under en jobsamtale ikke m\u00e5 sp\u00f8rge ind til graviditet,
  bestemte forhold, der er g\u00e6ldende ved ans\u00e6ttelse af en l\u00e6ge osv.
  Hvilket vurderes som v\u00e6rende n\u00f8dvendig viden, hvis ens arbejdsopgave inkludere
  rekruttering og ens fagomr\u00e5der ikke naturligt inkludere viden her om.\\n\\n1.5.1
  Beskrivelse og vurdering af RHP egen rekrutteringsguide.\\n\\nI Rekrutteringsguiden
  beskrives vigtigheden af, at efterlade et positivt indtryk hos alle, der har v\u00e6ret
  en del af processen b\u00e5de dem i ans\u00e6ttelsesudvalget og ans\u00f8ger, som
  enten tilbydes eller ikke tilbydes en stilling (bilag 1). Begrundelsen for at skulle
  efterlade et positivt indtryk er et \u00f8nske om, at deltagerne skal f\u00e5 \\\"lyst\\n\\ntil
  at s\u00f8ge en stilling i Psykiatrien igen eller fort\u00e6lle det positive indtryk
  videre til familie og venner\\\" (Ibid.). Desuden skal ans\u00e6ttelsesudvalget
  v\u00e6re opm\u00e6rksomme p\u00e5 om \\\"2''eren\\\" m\u00e5ske kan bruges et andet
  sted i virksomheden (Ibid.).\\n\\nRekrutteringsguiden giver ikke nogle direkte redskaber
  til at opn\u00e5 et positivt indtryk, men understreger, at ans\u00e6ttelsesudvalget
  skal m\u00f8des og planl\u00e6gge samtalens struktur og deltagernes rolle f\u00f8r
  en samtale (Ibid.). At de skal forberede sig kan v\u00e6re medvirkende til, at medlemmerne
  af ans\u00e6ttelsesudvalget fremst\u00e5r kompetente og professionelle og dermed
  er fagligt dygtige lige som visionerne og v\u00e6rdiggrundlaget l\u00e6gger optil.
  Netop faglighed er den f\u00f8rste v\u00e6rdi i virksomhedens v\u00e6rdis\u00e6t,
  og hvis en ans\u00f8ger m\u00f8der det til en samtale, vil det give et positivt
  indtryk. Dette skal understreges i Rekrutteringsguiden, da det ikke er en viden,
  som dem i ans\u00e6ttelsesudvalgene n\u00f8dvendigvis har, da de ikke er HR folk.\\n\\nDet
  beskrives, at stillingsannoncen skal ses \\\"som en salgsannonce, hvor b\u00e5de
  arbejdspladsen og stillingen skal s\u00e6lges\\\" (Ibid.), og til det opstilles
  fem punkter, som annoncen skal bygges op omkring. Det f\u00f8rste punkt er, at annoncen
  skal have en overskrift og en indledning, der skal indeholde lige de rigtige ord
  i forhold til s\u00f8gninger. Det andet punkt er, hvad der tilbydes i kompensation
  for arbejdet, her menes ansvarsomr\u00e5der, udviklingsmuligheder og v\u00e6rdier.
  Punkt tre er hvad, der forventes af uddannelse, kompetencer og erfaring. Punkt fire
  er ans\u00e6ttelsesvilk\u00e5rene, og det sidste punkt er ans\u00f8gningsproceduren
  (Ibid.). Desuden g\u00f8res der opm\u00e6rksom p\u00e5, at stillingsannoncen skal
  skrives \\\"med s\u00e5 lidt tekst som muligt\\\" (Ibid.). Under punkt to n\u00e6vnes
  v\u00e6rdierne, som noget virksomheden tilbyder de ansatte, og det er den eneste
  gang i den 18 sider lange guide, disse v\u00e6rdier bliver n\u00e6vnt, og visionerne
  bliver ikke n\u00e6vnt eneste gang.\\n\\nDa Rekrutteringsguidens m\u00e5lgruppe
  ikke er specifikt rettet mod plejepersonalet men mod alle medarbejdere i RHP, giver
  den ingen retningslinjer for, i hvilket medie/forum stillingerne skal sl\u00e5s
  op, men bare at ans\u00e6ttelsesudvalget skal t\u00e6nke over, hvem m\u00e5lgruppen
  er.\\n\\n1.5.2 Vejledning om stillingsannoncer\\n\\nVejledning om stillingannoncer
  (vedlagt som bilag 2 til denne afhandling) beskriver lidt flere punker, som en stillingsannonce
  skal indeholde, men g\u00e5r ikke i dybden med dem. De syv punkter, som en stillingsannonce
  skal indeholde, er f\u00f8lgende:\\n\\n1. Overskriften\\n2. Arbejdsopgaverne\\n3.
  Kvalifikationer\\n4. Arbejdspladsen\\n\\n5. L\u00f8n- og ans\u00e6ttelsesvilk\u00e5r\\n6.
  Yderligere oplysninger\\n7. Ans\u00f8gningsprocedure (Bilag 2).\\n\\nIgen st\u00e5r
  der intet om at g\u00f8re opm\u00e6rksom p\u00e5 virksomhedens visioner og v\u00e6rdier,
  men vejledningen indeholder eksempler p\u00e5 fem stillingsannoncer, hvoraf den
  ene har relevans i forhold til denne afhandling og er rettet imod rekruttering af
  en sygeplejerske. I denne stillingsannonce bliver v\u00e6rdierne n\u00e6vnt i en
  s\u00e6tning, men ellers bliver der ikke gjort noget ud af dem, og visionerne bliver
  slet ikke n\u00e6vnt.\\n\\n1.6 Opsummering\\n\\nDette kapitel startede med en redeg\u00f8relse
  for den problemstillig, som RHP st\u00e5r overfor, og som denne afhandling tager
  sit udgangspunkt i. Problemstillingen udl\u00f8ser et br\u00e6ndende \u00f8nske
  om, at f\u00e5 unders\u00f8gt RHP''s rekrutteringsproces med henblik p\u00e5 en
  optimering af fastholdelse og tiltr\u00e6kning af medarbejdere.\\n\\nDet s\u00e6rlige
  og indviklede forhold, som RHP har til Region Hovedstaden, blev belyst med de fordele
  og ulemper, som det indeb\u00e6rer. S\u00e6rligt forholdet omkring den tv\u00e6rg\u00e5ende
  HR funktion er blevet belyst, hvor budskabet til medarbejderne om, hvem deres arbejdsgiver
  er, er konkretiseret.\\n\\nRHP har udarbejdet en Rekrutteringsguide og en Vejledning
  om stillingsannoncer, som medlemmer af diverse ans\u00e6ttelsesudvalg skal benytte
  ved rekruttering af nye medarbejdere. I Rekrutteringsguiden og Vejledningen om stillingsannoncer
  mangler der fokus p\u00e5 v\u00e6rdierne og visionerne. Da guiden og vejledningen
  er skrevet til personale, der ikke har faglig viden om HR (og dermed helle ikke
  n\u00f8dvendigvis kender sammenh\u00e6ngen mellem de forskellige elementer i de
  strategier der bliver udviklet og benyttet som v\u00e6rkt\u00f8jer) skal kommunikationen
  om h\u00e5ndtering af rekrutteing v\u00e6re mere klar. Det vurderes, at der er en
  klar sammenh\u00e6ng mellem virksomhedens v\u00e6rdigrundlag, som er udarbejdet
  af v\u00e6rdiambassad\u00f8rerne, og de visioner, der er udarbejdet af regionsr\u00e5det.\\n\\n2  Gennemgang
  af den udvalgte teori\\n\\n2.1 Introduktion\\n\\nI dette kapitel bliver det teoretiske
  grundlag for den forest\u00e5ende analyse af den tidligere stillede problemformulering
  defineret og gennemg\u00e5et. Da den stillede opgaves hovedfokus tager udgangspunkt
  i begrebet employer branding, vil definitionen af begrebet samt det teoretiske grundlag
  og de dertilh\u00f8rende elementer blive afd\u00e6kket i dette kapitel. Herunder
  h\u00f8rer den st\u00e6rke relation, der er imellem en virksomheds employer brand,
  corporate brand samt den interne og eksterne branding.\\n\\nDen sidste del af kapitlet
  fokuserer p\u00e5, hvilken betydning det har for branding af RHP, at de befinder
  sig i den offentlige sektor.\\n\\nUd fra litteraturen vil de mest essentielle elementer,
  der er med til at underst\u00f8tte et st\u00e6rkt employer brand, blive trukket
  ud og samlet i et skema. Dette skema er et vigtigt element samt v\u00e6rkt\u00f8j,
  i denne afhandling, da det skal benyttes som benchmark i analysen af den indsamlede
  data, der bliver pr\u00e6senteret i kapitel 4. Form\u00e5let med benchmarkingen
  er, at finde frem til de ''huller'' virksomheden har i forhold til udarbejdelsen
  af en employer brand strategi.\\n\\nKapitlet afrundes med en konklusion, der munder
  ud i den sp\u00f8rgeramme, der danner grundlag for de kvalitative interviews, der
  er grundstenen i denne afhandling. Til sidst kommer en opsummering af kapitlets
  indhold.\\n\\n2.2 Branding\\n\\nFor at kunne forst\u00e5, hvad der ligger bag begrebet
  employer branding, vil begrebet brand f\u00f8rst blive defineret. Begrundelsen for
  dette er, at teorien om employer brand er opbygget omkring marketingsprincipper
  og elementer, der har sit udspring her. Employer branding anses nemlig som et v\u00e6rkt\u00f8j,
  der kan benyttes i HRperspektiv set via en marketingsvinkel. Desuden anses det for
  en vigtig del af forst\u00e5elsesprocessen, da teorien til dette emne er en sammenkobling
  af to fagomr\u00e5der, der i en sp\u00e6ndende kombination danner forst\u00e5elsesramme
  om hovedfokusset i denne afhandling. Sammenkoblingen er et forholdsvist nyt og uudforsket
  omr\u00e5de sammenlignet med andre fagomr\u00e5der.\\n\\n2.2.1 Definition af begrebet
  brand\\n\\nBegrebet branding (oversat til dansk m\u00e6rkning) stammer oprindeligt
  fra det vilde vesten i USA, hvor man br\u00e6ndem\u00e6rkede sit kv\u00e6g, for
  p\u00e5 den m\u00e5de at kunne identificere ens kv\u00e6g fra naboernes. S\u00e5ledes
  opstod der et symbol for kv\u00e6gs tilh\u00f8rsforhold, alts\u00e5 et trademark,
  der var med til at differentiere kv\u00e6get fra naboens og dermed konkurrenterne
  (Schultz, 2005, 25). I dag benyttes branding af virksomheder til at differentiere
  deres produkt eller service fra konkurrenternes. Overf\u00f8rt til HR-perspektiv
  benyttes branding af medarbejderne (employer branding) til at differentiere arbejdspladsen
  fra konkurrenterne. \u00c9n definition af branding lyder s\u00e5ledes:\\n\\n\\\"Brand
  : name, term, sign, symbol, or design, or a combination of these, intended to identify
  the goods or services of one seller or group of sellers and to differentiate them
  from those of the competitors\\\" (Kotler, 2003, s. 349).\\n\\nDet vil sige et budskab
  fattet i korthed, da det i nogle tilf\u00e6lde skal kunne leveres og forst\u00e5s
  af m\u00e5lgruppen ved blot et enkelt symbol. Branding omtales ogs\u00e5 som et
  l\u00f8fte til forbrugerne. Der er alts\u00e5 tale om, at virksomheden skal leve
  op til en forventning om for eksempel en kvalitet, en pris eller m\u00e5ske en f\u00f8lelse.\\n\\n\\\"Branding
  er et l\u00f8fte til forbrugeren om noget, der r\u00e6kker ud over det generiske
  produkt, f.eks. sociale, emotionelle eller \u00e6stetiske kvaliteter\\\" (Kristensen
  & Morsing, 2005: 47/Aaker 1997).\\n\\nM\u00e5lgruppen er defineret som forbrugeren
  af et givent produkt eller en service, alts\u00e5 er der tale om et produkt/service
  brand. Hovedform\u00e5let med et produkt/service brand er, at det skal skabe differentiering
  og pr\u00e6ference af produktet eller af servicen i forbruger\u00f8jemed (Knox og
  Bickerton, 2000).\\n\\nI denne afhandling skal begrebet branding overf\u00f8res
  i et HR-perspektiv, derfor skal begrebet s\u00e6ttes sammen med begrebet employer
  (medarbejder).\\n\\n\\\"The goal of branding as it has evolved over this period
  has been to explore ways to add value to the basic product or service and thus create
  brand preference and loyalty.\\\" (Knox & Bickerton, 2003).\\n\\nDet betyder, at
  der skal skabes merv\u00e6rdi til et produkt eller en service og derigennem skabe
  brand pr\u00e6ference og loyalitet fra m\u00e5lgruppen (forbrugeren). Brandet skal
  alts\u00e5 konstant tilpasses og kan derfor anses\\n\\nfor at v\u00e6re dynamisk.
  Tilpasningen skal ske i overensstemmelse med m\u00e5lgruppens \u00f8nsker, for p\u00e5
  den m\u00e5de at skabe pr\u00e6ference samt loyalitet hos forbrugerne. For RHP betyder
  det, at deres brand ikke blot skal v\u00e6re et l\u00f8ft om at kunne tilbyde behandling
  af psykisk syge personer, men det skal v\u00e6re dybere og p\u00e5 samme tid r\u00f8re
  ved det f\u00f8lelsesm\u00e6ssige hos m\u00e5lgruppen. Dette kan man argumentere
  for, at de g\u00f8r ved at have et slogan for deres visioner, der hedder \\\"patienten
  i centrum\\\" samt \\\"med mennesket i centrum\\\", som er overskriften for deres
  v\u00e6rdis\u00e6t. Sp\u00f8rgsm\u00e5let er s\u00e5 bare, om det er l\u00f8fter,
  der kan holdes og bliver holdt.\\n\\nPaul Temporal (2014) mener ikke, at branding
  udelukkende kan defineres som et symbol, navn eller tegn og heller ikke som et trademark,
  som det indledningsvis bliver beskrevet ovenfor. Derimod argumenterer han for, at
  branding er et komplekst mix af to faktorer, nemlig det h\u00e5ndgribelige og det
  uh\u00e5ndgribelige.\\n\\n* Det h\u00e5ndgribelige ses som de h\u00e5rde faktorer
  s\u00e5som produktet/servicen og kommunikation.\\n* Det uh\u00e5ndgribelige ses
  som de bl\u00f8de faktorer s\u00e5som f\u00f8lelser, oplevelse, emotionelle.\\n\\nDenne
  udl\u00e6gning af begrebet branding, kan ses som en sammenfatning af de to tidligere
  definitioner. Ydermere definerer han brands som f\u00f8lgende:\\n\\n\\\"brands are
  relationships\\\" (Temporal, 2014, p. 12).\\n\\nRelationships (forhold) skal ses
  som det forhold, der er mellem udbyder, her RHP, og klienterne samt de p\u00e5r\u00f8rende.
  I den offentlige sektor er dette forhold en essentiel del i forhold til succeshistorien.
  Hvis klienterne og de p\u00e5r\u00f8rende har haft en god oplevelse, er det n\u00f8glen
  til en succeshistorie og dermed god branding (Temporal, Paul 2014, p. 12). Der er
  alts\u00e5 tale om, at medarbejderne skal levere og leve op til de v\u00e6rdier
  og l\u00f8fter, som organisationen har fastsat. Dette understreger vigtigheden af,
  at der er et godt match mellem medarbejderne og organisationen understreger Forster
  et al (2010). Denne vigtige pointe, vil blive beskrevet mere dybtg\u00e5ende igennem
  store dele af dette kapitel.\\n\\nDer er fire grunde til at udvikle brandingstrategier
  for RHP selv om, de er en del af den offentlige sektor:\\n\\n1. Differentiering
  \u2013 S\u00e5 snart der er en m\u00e5lgruppe, er en virksomheds image vigtigt.
  Det handler nemlig om at differentiere sig fra konkurrenterne, som beskrevet tidligere
  i dette kapitel, ogs\u00e5 selvom at der er tale om en organisation i den offentlige
  sektor. Grunden til dette er, at konkurrence er allestedsv\u00e6rende og forekommer
  for eksempel i form af konkurrence om talenterne (som man kan sige, at denne afhandling
  omhandler) i tider hvor der er mangel p\u00e5 arbejdskraft, og om opm\u00e6rksomhed
  fra staten, s\u00e5 der er \u00f8get chance for at f\u00e5r tildelt midler til virksomheden.\\n2.
  \u00c6ndringer \u2013 en virksomhed \u00e6ndrer sig over tid, og derfor er det vigtigt
  at v\u00e6re p\u00e5 forkant med den m\u00e5de, hvorp\u00e5 virksomheden opfattes
  af omverden og is\u00e6r af m\u00e5lgruppen. For eksempel skal RHP''s\\n\\nbehandlingscentre
  ikke sammenlignes med de sindssygehospitaler, der var f\u00f8r i tiden, da brandet
  skal anses for at v\u00e6re dynamisk.\\n3. Branding er en strategisk fordel, der
  kan medbringe magt og finansielle bel\u00f8nninger. Et eksempel herp\u00e5 kunne
  v\u00e6re, at RHP kunne form\u00e5 at brande sig s\u00e5ledes, at der var nogle
  investorer, der tildelte et specifikt omr\u00e5de eller m\u00e5ske center penge.\\n4.
  At v\u00e6re p\u00e5 forkant \u2013 l\u00e6ner sig lidt op af punkt 2, og er i overensstemmelse
  med, at brandet anses for at v\u00e6re dynamisk, og skal tilpasses den kontekst,
  som det indg\u00e5r i (Temporal, 2014, s. 7-10).\\n\\nEn virksomheds service/produkt
  kan let kopieres, ogs\u00e5 selv om det er udbudt fra den offentlige sektor, men
  der er et element, som er sv\u00e6rt at kopiere, og det er et st\u00e6rkt brand
  image (Temporal, 2014, s. 7). Derfor er det essentielt, at RHP, p\u00e5 trods af,
  at de er en del af den offentlige sektor, udvikler og vedligeholder deres branding.
  Dette vil blive beskrevet n\u00e6rmere senere i kapitlet.\\n\\n2.3 Definition af
  corporate branding\\n\\nIf\u00f8lge Schultz (2005, s.16) skal corporate branding
  anses som et dynamisk koncept, der konstant er i udvikling. Da det anses for at
  v\u00e6re dynamisk og dermed i konstant udvikling, stilles udarbejdelsen af det
  over for et dilemma, hvor der p\u00e5 den ene side fortsat skal rettes fokus p\u00e5
  marketing og kampagner p\u00e5 et mere overfladisk plan. P\u00e5 det punkt smelter
  corporate branding sammen med produkt (service) branding feltet. P\u00e5 den anden
  side bygger corporate branding p\u00e5 den erfaring, der er opn\u00e5et gennem den
  f\u00f8rste b\u00f8lge af branding f\u00e6nomenet, hvilket betyder, at det er karakteriseret
  ved en st\u00f8rre og mere realistisk indsigt i de mange konflikter og komplekse
  relationer, der eksisterer i virksomheden og dennes milj\u00f8. Schultz forudser,
  at corporate branding vil blive en af de f\u00e5 centrale og tv\u00e6rdisciplin\u00e6re
  koncepter, som kan skabe sammenh\u00e6ng mellem en virksomheds strategi, virksomheden
  og marketing.\\n\\nDen anden b\u00f8lge af corporate branding er en proces, hvorigennem
  en virksomhed kontinuerligt kan udtrykke sit form\u00e5l. Form\u00e5let skal give
  mening b\u00e5de for de mennesker, der befinder dig internt i virksomheden og eksternt
  for virksomheden (Schultz, 2005: 16). Schultz''s (2005) teori er i fin tr\u00e5d
  med den teori Forster et al (2010) tilkendegiver. Foster et al''s (2010) definerer
  corporate branding som f\u00f8lgende:\\n\\n\\\"a corporate brand is an explicit
  promise between an organisation and its key stakeholder groups\\\" (Foster et al.,
  2010/ Balmer, 1998).\\n\\nDerudover omtaler Foster et al (2010) corporate brandet
  som\\\"a powerful \\\"navigational tool\\\" to a variety of stakeholders, which
  include not only existing employees and shareholders, but also potential\\n\\nemployees\\\"
  (Forster et al., 2010). Da corporate brandet skal ses som et navigationsv\u00e6rkt\u00f8j
  for m\u00e5lgruppen, understreger det Temporal''s (2014) pointe om, at branding
  i den grad er vigtig, selv om virksomheden befinder sig i den offentlige sektor.
  Foster et al (2010) mener, at m\u00e5lgruppen for corporate brandet er n\u00f8gleinteressenterne,
  som for RHP blandt andre omfatter Region Hovedstaden, regeringen, klienterne, de
  p\u00e5r\u00f8rende, konkurrenterne (de private psykiatriske klinikker og somatikken),
  medarbejderne samt fremtidige medarbejdere. Den definition af m\u00e5lgruppen for
  et corporate brand er Backhaus & Tikoo (2004) ikke enige i. De mener, at corporate
  branding kun er m\u00e5lrettet til en ekstern m\u00e5lgruppe.\\n\\n\\\"A corporate
  brand is the visual, verbal and behavioural expression of an organisation''s unique
  business model\\\" (Knox & Bickerton, 2003).\\n\\nCorporate brand er i f\u00f8lge
  Knox & Bickerton (2003) et udtryk for en virksomheds unikke forretningsmodel, som
  bliver formidlet via visualisering, kommunikation samt via adf\u00e6rd. Her skal
  der l\u00e6gges m\u00e6rke til termerne kommunikativ og adf\u00e6rdsm\u00e6ssige
  udtryk, hvilket er en vigtig del af en virksomheds corporate brand. Det er medarbejderne,
  der via adf\u00e6rd og kommunikation skal afspejle det l\u00f8fte, som organisationen
  har givet interessenterne. Dette er is\u00e6r g\u00e6ldende i servicevirksomheder,
  som RHP, da medarbejderne her er virksomhedens ansigt udadtil. Der er alts\u00e5
  tale om at adf\u00e6rd anses som en essentiel faktor, og for at opn\u00e5 den rigtigt
  adf\u00e6rd blandt medarbejderne, skal der v\u00e6re sammenh\u00e6ng mellem en virksomheds
  vision samt v\u00e6rdier og de v\u00e6rdier medarbejderne selv har. Det vurderes,
  at der er en sammenh\u00e6ng mellem RHP''s vision og v\u00e6rdier, for eksempel
  lyder overskrifterne for de to strategier meget ens \\\"med mennesker i centrum\\\"
  og \\\"patienten i centrum\\\". Hvis der graves et spadestik dybere, vurderes det,
  at der faktisk er en sammenh\u00e6ng, hvis der ses p\u00e5 den sidste af de 10 visioner,
  som lyder \\\"en psykiatri med fokus p\u00e5 forskning, udvikling og fornyelse\\\"
  og p\u00e5 v\u00e6rdierne faglighed samt udvikling. Det vurderes dog, at der ogs\u00e5
  er et par afstikkere, hvor sammenh\u00e6ngen ikke er lige s\u00e5 tydelig. Jo st\u00f8rre
  sammenh\u00e6ng der forekommer mellem medarbejderens v\u00e6rdier og RHP''s v\u00e6rdis\u00e6t
  og visionerne, des lettere kan virksomhedens l\u00f8fte og v\u00e6rdier kommunikeres,
  da buskabet skal leveres af medarbejderne (Foster et al, 2010). Her er der alts\u00e5
  et direkte link mellem virksomhedens corporate brand og employer brand, som bliver
  beskrevet i n\u00e6rmere senere i kapitlet i afsmit 2.4.s\\n\\nDet er ikke altid
  lige til at udarbejde en virksomheds corporate brand, da der er mange facetter,
  der spiller ind. Knox & Bickerton har udarbejdet 6 konventioner, som skal overv\u00e5ges
  og holdes ved lige for p\u00e5 den m\u00e5de at sikre, at virksomhedens corporate
  brand ikke sl\u00e5r fejl.\\n\\n1. Brand sammenh\u00e6ng \u2013 vision, kultur,
  image og konkurrencesituationen\\n\\n2. Brand konstruktion/opbygning \u2013 corporate
  brand positionering\\n3. Brand bekr\u00e6ftelse \u2013 formulering af corporate
  brand proposition\\n4. Brand overensstemmelse \u2013 udvikling af en enslydende
  kommunikation\\n5. Brand kontinuitet \u2013 inkorporerer brandet dybere i virksomheden\\n6.
  Brand konditionering \u2013 overv\u00e5gning\\n\\nTeorien er udviklet via kvalitative
  data, hvor de har benyttet sig af aktionsforskning i en mindre advokatvirksomhed.
  Ulempen ved denne teori er, at den er udviklet i mindre virksomhed, hvor der var
  lettere tilgang til alle aspekter i virksomheden, og derved er det nemmere at f\u00e5
  adgang til de n\u00f8dvendige informationer, der skal benyttes til udviklingen af
  virksomhedens corporate brand (Knox & Bickerton, 2003). RHP er en st\u00f8rre virksomhed,
  som h\u00f8rer under et indviklet tilh\u00f8rsforhold til Region Hovedstaden, som
  igen ligger under for nogle restriktioner udstedt af staten (se kapitel 1). Udviklingen
  samt management af corporate brand drager mange lighedspunkter med produktbranding,
  hvor det g\u00e6lder om at differentiere sig fra konkurrenterne, men det er mere
  komplekst i sin udregning, da m\u00e5lgruppen er st\u00f8rre og mere kompleks (Knox
  & Bickerton, 2003).\\n\\nDa et corporate brand er komplekst at udvikle og efterf\u00f8lgende
  er sv\u00e6rt at vedligeholde og videreudvikle, er der mange virksomheder, der ikke
  f\u00f8lger det til d\u00f8rs. Der er mangel p\u00e5 corporate brand h\u00e5ndtering
  i mange virksomheder (Knox & Bickerton, 2003), hvilket ogs\u00e5 kommer til udtryk
  hos RHP. Der er flere gange blevet bedt om indsigt i diverse strategier, s\u00e5som
  corporate brand strategien, employer brand med flere, hvor svaret har v\u00e6ret,
  at en s\u00e5dan ikke findes, da den ikke er udviklet. Det anses som et problem
  af flere grunde, en af dem er, at et corporate brand, som n\u00e6vnt tidligere,
  skal anses som et \\\"navigational tool\\\" for interessenter (Foster el at, 2010).
  Et andet problem er, at det er vigtigt at brande sig selv, selvom der er tale om
  en virksomhed i den offentlige sektor, idet man kan bruge det til at skabe opm\u00e6rksomhed
  omkring virksomheden (Temporal, 2014).\\n\\n2.4 Employer branding\\n\\nBegrebet
  employer branding har sin prim\u00e6re oprindelse i corporate branding teorien,
  og kendetegnes som et nyt begreb og en ny disciplin, som flere og flere virksomheder
  retter fokus imod, da der i fremtiden vil v\u00e6re kamp om de menneskelige ressourcer,
  ligesom indledningen og problemfeltet til afhandling beskriver. Employer branding
  er en videreudvikling af produkt branding, set i et Human Ressource Management perspektiv.
  Det er alts\u00e5 et sammenspil mellem marketing og HR. Det er et forholdsvis nyt
  omr\u00e5de, som langt fra er f\u00e6rdigforsket. Det er et omr\u00e5de, som virksomhederne
  i h\u00f8jere grad fokuserer p\u00e5, og med god grund.\\n\\nIs\u00e6r i servicesektoren,
  som RHP h\u00f8rer under, er det vigtigt at fokusere p\u00e5 medarbejderne, da de
  leverer \\\"produktet\\\". Som pointeret tidligere skal dette helst ske i overensstemmelse
  med det udtryk, som virksomheden \u00f8nsker corporate brandet (Seldorf, 2008, s.
  11).\\n\\n2.4.1 Definition af - og rammebetingelser for employer branding\\n\\nFlere
  forskere er kommet med deres bud p\u00e5, hvordan en definition af begrebet employer
  branding skal lyde. Her bliver 3 definitioner fremstillet:\\n\\n\\\"a targeted,
  long-term strategy to manage the awareness and perceptions of employees, potential
  employees, and related stakeholders with regards to a particular firm\\\" (Backhaus
  & Tikoo, 2004/Sullivan, 2004, s, 501).\\n\\nS\u00e5ledes anses employer branding
  som en m\u00e5lrettet og strategisk proces, der har til hensigt at brande virksomheden
  som arbejdsgiver overfor eksisterede s\u00e5vel som potentielle medarbejder.\\n\\nEmployer
  branding adskiller sig fra produkt/service brand og corporate brand p\u00e5 to punkter;\\n\\n1.
  Karakteriserer virksomhedens identitet som arbejdsgiver.\\n2. Er rettet mod b\u00e5de
  interne og eksterne m\u00e5lgrupper, hvor b\u00e5de produkt brand og corporate brand
  prim\u00e6rt retter henvendelse mod en ekstern m\u00e5lgruppe (Backhaus & Tikoo,
  2004).\\n\\nForm\u00e5let med employer branding er at tiltr\u00e6kke, motivere samt
  fastholde medarbejdere. Desuden siger Backhaus & Tikoo (2004) ogs\u00e5, at employer
  branding skal g\u00f8re det nemt for medarbejderne at identificere \u00e9n arbejdsplads
  fra en anden. Det betyder, at medarbejderne og/eller de potentielle medarbejdere
  skal kunne se samt forst\u00e5 lige netop de karakteristika, der er ved at arbejde
  for en bestemt virksomhed frem for hos konkurrenten. Alts\u00e5 skal employer branding
  anses som de funktionelle, \u00f8konomiske og psykologiske fordele, der er ved at
  arbejde i en bestemt virksomhed. At virksomheden som arbejdsplads skal v\u00e6re
  nem at identificere samt skal v\u00e6re differentieret fra konkurrenterne er samme
  ''regel'', som er g\u00e6ldende ved produkt branding og corporate branding teorierne
  (Moroko & Uncles, 2008). Markedsf\u00f8ringen af et employer brand skal b\u00e5de
  ske internt i virksomheden samt eksternt for at give et klart indtryk af, hvor virksomheden
  som arbejdsplads adskiller sig fra andre og dermed understrege, hvad der g\u00f8r
  det attraktivt at arbejde der (Backhaus & Tikoo, 2004). Elementer ved interne og
  eksterne branding bliver gennemg\u00e5et senere her i kapitlet afsnit 2.4.2 og 2.4.3.
  Backhaus & Tikoo (2004) har udarbejdet et framework, der demonstrer dynamikken i
  et employer brand, se figur 2.1 nedenfor.\\n\\nDeres illustration anses som et samlet
  teoretisk fundament samt en dagsorden for, hvordan begrebet employer branding skal
  benyttes effektivt i HR samt i forsknings\u00f8jemed. Teorien er udarbejdet ud fra
  marketing og managementlitteratur/teori og illustrerer employer branding som en
  effektiv paraply, hvor under forskellige rekrutterings- og fastholdelsesaktiviteter
  kanaliseres i en koordineret HR strategi. P\u00e5standen er, at hvis rekruttering,
  personale, uddannelse & udvikling samt karriere management samles under en paraply,
  opst\u00e5r der en positiv synergieffekt, og derved vil resultatet v\u00e6re mere
  v\u00e6rdifuldt end, hvis disse aktiviteter stod alene. Hermed har employer branding
  potentiale til at v\u00e6re et meget v\u00e6rdifuldt v\u00e6rkt\u00f8j b\u00e5de
  for ledere og i forsknings\u00f8jemed. Backhaus og Tikoo (2004) g\u00f8r opm\u00e6rksom
  p\u00e5, at der er manglende forskning p\u00e5 den interne branding. Kritikken af
  Backhaus og Tikoo''s (2004) teoretiske fundament er, at der ikke er interaktion
  mellem aktiviteterne med intern fokus og ekstern fokus.\\n\\nHidtil har det prim\u00e6re
  fokus v\u00e6ret p\u00e5 ekstern branding, men der er kommet en \u00f8get fokus
  p\u00e5 den interne branding og derfor mener Mosley (2007), at der skal v\u00e6re
  en sammenh\u00e6ng mellem de eksterne rekrutteringsaktiviteter og medarbejderes
  erfaringer, alts\u00e5 kulturen \u2013 det interne. Det p\u00e5peges dog, at det
  er meget sv\u00e6rt at \u00e6ndre p\u00e5 en allerede eksisterende kultur (Mosley,
  2007) (Foster et al, 2010).\\n\\nDesuden argumenterer Mosley (2007) for, at employer
  branding skal fokusere p\u00e5 de bagvedliggende omr\u00e5der, s\u00e5som bel\u00f8nning
  og anerkendelse (bel\u00f8nning og anerkendelse ses som Employer Value Proposition,
  herefter EVP), og ikke kun p\u00e5 rekruttering. Bel\u00f8nning omfatter mere end
  bare l\u00f8n og personalegoder, det omfatter ogs\u00e5 \\\"udfordringer og ansvar
  i jobbet, udviklingsmuligheder, status og anerkendelse\\\" (Larsen, 2006, s. 150).
  Begrundelsen for at employer branding skal indeholde bel\u00f8nning og anerkendelse
  er, at det er medarbejderens adf\u00e6rd, der er den vigtigste faktor for kundetilfredshed
  for virksomheder i servicesektoren som RHP. Der er nemlig en sammenh\u00e6ng mellem
  tilfredse medarbejdere, tilfredse kunder og positivt resultat p\u00e5 bundlinjen.
  Tilfredse medarbejdere er mere tilb\u00f8jelige til at levere en ensartet og positiv
  service\\n\\n(Ibid.). Denne vurdering er Foster et al (2010) enig i og tilf\u00f8jer,
  at det ogs\u00e5 skal omfatte en integrering af intern branding og employer branding,
  for p\u00e5 den m\u00e5de at knytte medarbejderne til arbejdspladsen og derigennem
  opn\u00e5 konkurrence og indtjenings fordele. Mosley (2007) definerer begrebet employer
  branding ud fra den originale definition, der l\u00f8d s\u00e5ledes:\\n\\n\\\"...
  the package of functional, economic and psychological benefits provided by employment
  and identified with the employing company\\\" (Mosley, 2007/Barrow & Ambler, 1996
  s. 130).\\n\\nS\u00e5ledes anses employer branding som en kombination af de funktionelle,
  \u00f8konomiske og psykologiske fordele, der er ved arbejdspladsen og som er identificeret
  af virksomheden. Form\u00e5let er at skabe et sammenh\u00e6ngende regels\u00e6t,
  der har til hensigt at forenkle og fokusere prioriteter, \u00f8ge produktiviteten
  samt forbedre rekruttering, fastholdelse og engagement (Mosley, 2007/Barrow & Ambler,
  1996). N\u00f8gleordet i Mosley''s (2007) teori er sammenh\u00e6ng, alts\u00e5 den
  r\u00f8de tr\u00e5d. Netop den r\u00f8de tr\u00e5d anses som et essentielt element
  ved opbygningen af et employer brand i Foster et al (2010), der definerer begrebet
  s\u00e5ledes:\\n\\n\\\"\u2026an employer brand can be regarded as a psychological
  contract between an employer and employee, and similarly the corporate branding
  literature (e.g. Olins, 2004) has long considered a brand as a promise from an organisation
  to customers\\\" (Foster et al, 2010/Moroko and Uncles, 2008).\\n\\nHer bliver der
  refereret direkte til id\u00e9en om, at et brand er et l\u00f8fte fra virksomheden
  til kunden, pr\u00e6cis som det blev beskrevet tidligere. Form\u00e5let med et employer
  brand er, at det er med til at sikre rekruttering af de rigtige mennesker i f\u00f8rste
  fors\u00f8g. Med det menes at sikre, at de brandv\u00e6rdier, som virksomheden har,
  stemmer overens med de v\u00e6rdier, som potentielle medarbejdere har og dermed
  kan spejle sig i. Derudover har det til form\u00e5l at skabe en opfattelse af virksomheden
  som et \u00f8nskv\u00e6rdigt sted at arbejde (Forster et al, 2010).\\n\\nFor at
  et employer brand bliver en succes, skal et corporate brand l\u00f8fte v\u00e6re
  klart, og der skal v\u00e6re sammenh\u00e6ng mellem corporate brand og employer
  brandet. P\u00e5 den m\u00e5de undg\u00e5s det, at der opst\u00e5r en opfattelse
  af, at den psykologiske kontrakt bliver kr\u00e6nket. Der skal alts\u00e5 v\u00e6re
  integration mellem virksomhedens corporate brand og employer brand, ellers kan der
  forekomme uoverensstemmelser set med m\u00e5lgruppernes \u00f8jne. Resultatet af
  uoverensstemmelser kan v\u00e6re, at corporate brand har en negativ indvirkning
  p\u00e5 employer brandet eller omvendt (Forster et al, 2010). I v\u00e6rste fald
  kan det medf\u00f8re en reduktion i konkurrenceevnen p\u00e5 arbejdsmarkedet samt
  en \u00f8get personaleoms\u00e6tning (Backhaus & Tikoo, 2004).\\n\\nFor at kunne
  se sammenh\u00e6ngen mellem corporate branding, employer branding, internt fokus
  og eksternt fokus har Foster et al (2010) udarbejdet et framework, som giver et
  klart overblik og viser hvordan, de ser sammenh\u00e6ngen. Se figur nr. 2.2 nedenfor.\\n\\nHer
  er sammenh\u00e6ngen mellem de ovenst\u00e5ende emner tegnet ind. Man kan forstille
  sig, at de to trekanter foldes op i mod hinanden, og m\u00f8des i \\\"en h\u00f8jere
  enhed\\\" \u2013 hvis der alts\u00e5 er skabt sammenh\u00e6ng. Hvis der derimod
  ikke er skabt sammenh\u00e6ng, vil de to trekanter ikke v\u00e6re lige store.\\n\\nEt
  employer brand best\u00e5r overordnet af tre elementer, som alle er lige vigtige
  og derfor b\u00f8r inddrages i udarbejdelsen af employer brandet. Begrundelsen for
  dette er, at \\\"det billede, der opbygges og kommunikeres, skal v\u00e6re stabilt
  p\u00e5 tv\u00e6rs af alle tre dimensioner, for at employer brandet bliver succesfuldt\\\"
  (Seldorf, 2008, s. 11). Den f\u00f8rste dimension er virksomhedens identitet - s\u00e5dan
  som medarbejderne opfatter virksomheden. Virksomhedens identitet har medindflydelse
  p\u00e5 medarbejdernes og potentielle medarbejderes employer brand loyalitet, og
  derigennem har indvirkning p\u00e5 produktiviteten hos medarbejderne (Backhaus &
  Tikoo, 2004). Den anden dimension er virksomhedens profil - det vil sige vision
  og v\u00e6rdier samt EVP. Den sidste dimension er virksomhedens image, alts\u00e5
  den opfattelse, som omverden har af virksomheden (Seldorf, 2008, s. 11) (Backhaus
  & Tikoo, 2004) (Mosley, 2007). Employer brand image har til form\u00e5l at give
  et billede, der viser organisationen som et godt sted at arbejde (Backhaus & Tikoo,
  2004/Sullivan, 2004). Med andre ord best\u00e5r employer brandet af den opfattelse,
  der er internt i virksomheden, ledelsens \u00f8nsker for retningen af virksomheden
  og den eksterne opfattelse af virksomheden.\\n\\n220.127.116.11 Virksomhedens identitet\\n\\nVirksomhedens
  identitet kan beskrives som den kollektive opfattelse, som medarbejderne har af,
  hvem virksomheden er. Virksomhedsidentitet formidler forholdet til employer brand
  loyalitet, der er med til at \u00f8ge medarbejderproduktiviteten. Medarbejdere vil
  gerne identificere sig med den virksomhed, de arbejder i, og det g\u00f8r de, hvis
  virksomhedens identitet form\u00e5r at v\u00e6re attraktiv eller unik (Bachhause
  & Tikoo, 2004/Dutton et al, 1994).\\n\\nDes mere positiv identiteten fremst\u00e5r,
  jo mere bidrager det til selvv\u00e6rd i blandt medarbejderne, og dermed vil flere
  medarbejdere identificere sig med virksomheden (Backhaus & Tikoo, 2004/Dutton et
  al., 1994). Dette vil resultere i en f\u00f8lelse hos medarbejderen af, at identifikationen
  med virksomheden stiger, og dermed stiger engagementet hos medarbejderne ogs\u00e5
  (Backhaus & Tikoo, 2004/Crewson, 1997).\\n\\n18.104.22.168 Virksomhedens profil\\n\\nVirksomhedens
  profil er et udtryk for, om v\u00e6rdigrundlaget og adf\u00e6rden blandt medarbejderne
  underst\u00f8tter virksomhedens visioner (Seldorf, 2008, s. 15). Da det er virksomhedens
  visioner og v\u00e6rdigrundlag, der ligger til grund for virksomhedens profil, anses
  det derfor som v\u00e6rende v\u00e6rdifuldt, at den eksterne kommunikation bliver
  afspejlet i den interne adf\u00e6rd. Under virksomhedens profil h\u00f8rer EVP,
  som skal komme til udtryk via employer brandet (Backhaus & Tikoo, 2004), og som
  skal tydeligg\u00f8re v\u00e6rdien, som medarbejderen f\u00e5r via sin ans\u00e6ttelse
  i virksomheden (Seldorf, 2008, s. 52-53).\\n\\n22.214.171.124 Virksomhedens image\\n\\nVirksomhedens
  image er virksomhedens omd\u00f8mme, hvilket i h\u00f8j grad h\u00e6nger sammen
  med lysten til at arbejde i virksomheden (Larsen, 2006, s. 25). Med andre ord er
  det, det billede offentligheden har af en virksomhed, og det kan eksempelvis p\u00e5virkes
  af d\u00e5rlig omtale i medierne, og dermed vil det give problemer med rekruttering
  af nye medarbejder (Larsen, 2006 s. 137). Og selvf\u00f8lgelige omvendt kan positiv
  medieomtale v\u00e6re med til at \u00f8ge antallet af ans\u00f8gere.\\n\\nDe ovenst\u00e5ende
  tre dimensioner, som employer brandet best\u00e5r af, overlapper hinanden, og derfor
  vil de elementer, der g\u00e5r igen i alle tre dimensioner, udg\u00f8re den platform,
  der er virksomhedens DNA. Hvis DNA''en ikke fremst\u00e5r som elementer, der vil
  tiltr\u00e6kke nye medarbejdere, af den ene eller anden grund, skal der ses n\u00e6rmere
  p\u00e5 de f\u00e6lles elementer, der fremg\u00e5r af identiteten og profilen (Seldorf,
  2008, s. 51-52). P\u00e5 den baggrund bliver den forst\u00e5ende datapr\u00e6sentation
  og analyse pr\u00e6senteret med udgangspunkt i de tre dimensioner som til sammen
  ben\u00e6vnes som IPI GAP analyse (Ibid.).\\n\\n2.4.2 Intern Branding\\n\\nIntern
  branding handler om, at der skal v\u00e6re en intern kontinuitet hos alle eksisterende
  medarbejdere, b\u00e5de hos det personale, der har kontakt til patienterne, alts\u00e5
  plejepersonale og l\u00e6ger, men ogs\u00e5 det administrative personale (Foster
  et al, 2010). De skal alts\u00e5 agere i forhold til organisationens corporate brand
  b\u00e5de udadtil men ogs\u00e5 internt i organisationen - alts\u00e5 Walk The Talk.
  Desuden kan brandet kun v\u00e6re effektivt, hvis/n\u00e5r det er dybt indprentet
  i den daglige ledelse. Dette kan g\u00f8res ved udarbejdelse af arbejdsgange og
  stukturer, der har til form\u00e5l at \u00f8ge bevidstheden herom (Mosley, 2007).\\n\\nForm\u00e5let
  med interne branding er at skabe en st\u00e6rk workforce, som er sv\u00e6rt for
  andre virksomheder at efterligne. Dette g\u00f8res ved, at medarbejderne systematisk
  bliver pr\u00e6senteret for det v\u00e6rdigrundlag, som employer brandet springer
  ud af. P\u00e5 den m\u00e5de vil kulturen p\u00e5 arbejdspladsen blive opbygget
  omkring virksomhedens v\u00e6rdigrundlag. Det er meget vigtigt, at arbejdskulturen
  er b\u00e6redygtig, ellers er det ikke en fordel (Backhaus & Tikoo, 2004) med derimod
  en ulempe, da det er meget sv\u00e6rt at \u00e6ndre p\u00e5 en allerede eksisterende
  kultur.\\n\\n\\\"One of things you find in companies is that once a culture is formed
  it takes nuclear weaponry to change it\\\" (Mosley, 2007/Bezos, J., grundl\u00e6gger
  af Amazon).\\n\\nBegrundelsen for at inkorporere v\u00e6rdigrundlaget er, at medarbejderne
  skal kunne identificere sig med virksomheden og dens v\u00e6rdier og derigennem
  bestr\u00e6be sig p\u00e5 at opn\u00e5 virksomhedens strategiske m\u00e5ls\u00e6tninger.
  Og dermed vil b\u00e5de medarbejdere og organisationen arbejde i samme retning,
  og medarbejderne vil lettere kunne leve op til det l\u00f8fte, som der er givet
  via corporate branding. Derved vil klienten og de p\u00e5r\u00f8rende f\u00f8le,
  at der er leveret service af h\u00f8j kvalitet (Foster et al, 2010). God kundeservice
  er kun muligt, hvis der eksisterer en h\u00f8j grad af medarbejdertilfredshed samt
  en h\u00f8j grad af motivation (Wilden et al, 2010/ Berry & Parasuraman, 1992) (Foster
  et al, 2010). Desuden er det lettere for medarbejderne at opfylde l\u00f8ftet, hvis
  de kan identificere sig med de v\u00e6rdier, som springer ud af employer brandet
  (Foster et al, 2010).\\n\\nTil brug i den interne kommunikation er der mange forskellige
  v\u00e6rkt\u00f8jer, for eksempel intranettet, mails, m\u00f8der, workshops og mange
  flere. Unders\u00f8gelser viser dog, at den mest effektive form for intern kommunikation
  er face-to-face, og derudover er det ogs\u00e5 vigtigt, at der blandt andet skabes
  tillid, involvering samt en form for historiefort\u00e6lling i forbindelse med al
  vidensdeling (\u0160\u00e1rka, 2014). Derfor anses workshops eller teambuilding
  for at v\u00e6re de bedste metoder til intern kommunikation af indholdet i et employer
  brand.\\n\\n126.96.36.199 Rekruttering og interne branding\\n\\nRekruttering af
  de rigtige kandidater er afg\u00f8rende, is\u00e6r for servicevirksomheder, der
  er afh\u00e6ngige af de ansatte til at repr\u00e6sentere brand v\u00e6rdier og levere
  deres brand l\u00f8fte (Foster et al, 2010). Og de rigtige kandidater er dem, der
  kan identificere sig med RHP''s v\u00e6rdier. Derfor skal der fokus p\u00e5 at rekruttere
  de rigtige kandidater fra start, alts\u00e5 dem der besidder v\u00e6rdier, der er
  i overensstemmelse med alle de forskeskellige brand v\u00e6rdier, som virksomheden
  besidder. Men da dette er et forholdsvist nyt fagomr\u00e5de, mangler der forskning
  og litteratur om, hvordan man rekrutterer de rette kandidater i f\u00f8rste fors\u00f8g
  (Foster et al, 2010). N\u00e5r en ny sygeplejerske eller sosu-assistent bliver ansat
  kan intern branding v\u00e6re med til at sikre, at den nye medarbejder forts\u00e6tter
  med at forst\u00e5, hvad brandet st\u00e5r for, og hvilke v\u00e6rdier corporate
  brand foresl\u00e5r til de eksterne interessenter (Foster et al, 2010).\\n\\n2.4.3
  Ekstern Branding\\n\\nWilden et al (2010) mener, at et job skal h\u00e5ndteres i
  lighed med det produkt eller den service, som virksomheden vil s\u00e6lge til forbrugerne.
  Jobbet skal markedsf\u00f8res og designes med de samme teknikker og v\u00e6rkt\u00f8jer,
  som produkter og service bliver det. P\u00e5 den m\u00e5de skal b\u00e5de arbejdsgiverens
  behov samt de fordele, der er ved en ans\u00e6ttelse, kommunikeres b\u00e5de internt
  og eksternt. Et st\u00e6rkt employer brand g\u00f8r, at det er nemmere at levere
  budskabet for b\u00e5de intern branding og ekstern branding (Wilden et al, 2010).
  I rekrutteringsguiden st\u00e5r der; \\\"annoncen er som en salgsannonce, hvor b\u00e5de
  arbejdspladsen og stillingen skal s\u00e6lges\\\" (bilag, rekrutteringsguiden, s.
  7). Dermed har RHP indarbejdet denne pointe i deres retningslinjer.\\n\\nIf\u00f8lge
  Backhaus & Tikoo (2004) er ekstern markedsf\u00f8ring af et employer brand prim\u00e6rt
  designet til at tiltr\u00e6kke m\u00e5lgruppen, men det er ogs\u00e5 designet til
  at st\u00f8tte og styrke produktet (service) eller corporate brands. Form\u00e5let
  er at skabe et image, som skal tiltr\u00e6kke potentielle medarbejdere, der s\u00e5
  skal v\u00e6re med til at forst\u00e6rke det image som employer branding efterlader
  (Backhaus & Tikoo, 2004). For at opn\u00e5 et gunstigt og positivt image hos m\u00e5lgruppen
  skal adf\u00e6rd, kommunikation og symbolik v\u00e6re systematisk planlagt af ledelsen
  (Foster et al, 2010). Begrundelsen for dette er, at medarbejdernes adf\u00e6rd har
  en stor indflydelse p\u00e5, hvordan eksterne interessenter (her i blandt potentielle
  medarbejdere) opfatter virksomhedens corporate brand (Foster et al, 2010) og i den
  grad ogs\u00e5, hvordan virksomheden er som arbejdsplads og dermed employer brand.
  Som tidligere beskrevet kan det have store konsekvenser at ans\u00e6tte de forkerte
  medarbejdere, alts\u00e5 medarbejdere, hvis v\u00e6rdier ikke stemmer overens med
  virksomhedens v\u00e6rdigrundlag, og p\u00e5 den baggrund ikke kan levere den rigtige
  ydelse samt leve op til det l\u00f8fte, som virksomheden har givet interessenterne:
  \\\"employees have the potential to make or break the corporate brand\\\" (Foster
  et al, 2010). Dette understreger endnu en gang vigtigheden i, at der skal v\u00e6re
  sammenh\u00e6ng mellem de v\u00e6rdier, som medarbejderne har og det corporate brand
  virksomheden \u00f8nsker. Det er ogs\u00e5 en af grundende til, at det er vigtigt
  at rekruttere de rette medarbejdere i f\u00f8rste fors\u00f8g (Foster et al, 2010).\\n\\nMitchell
  (2004) mener, at der ofte opst\u00e5r problemer, da virksomhederne indgangsvinkel
  til at l\u00f8se problemerne med at f\u00e5 inkorporeret v\u00e6rdiggrundlaget i
  medarbejdernes adf\u00e6rd er, at v\u00e6rdierne ikke bliver oversat til noget,
  som medarbejderne kan bruge i sjove hverdagssituationer (Schultz, 2005, s. 105).
  Medarbejderne skal v\u00e6re med til at udvikle brandet, som skal tage udgangspunkt
  i den kultur, der allerede eksisterer p\u00e5 arbejdspladsen (Schultz, 2005, s.
  124). RHP har involveret medarbejderne i udviklingen af v\u00e6rdigrundlaget, som
  p\u00e5 den baggrund m\u00e5 antages at tage udgangspunkt i den allerede eksisterende
  kultur, der er p\u00e5 alle behandlingscentrene. Sp\u00f8rgsm\u00e5let er bare,
  om de skulle tage skridtet videre og tage lignende initiativ ved udvikling af deres
  corporate branding strategi.\\n\\nAf eksterne kommunikationsv\u00e6rkt\u00f8jer
  mener Wilden et al (2010), at word of mouth-metoden er den mest trov\u00e6rdige
  kilde til at sprede budskabet om en virksomheds employer brand. Det p\u00e5peges
  dog at negativ omtale via word of mouth kan resultere i, at medarbejdernes henvisninger
  kan neds\u00e6tte (Wilden et al, 2010/Miles & Mangold, 2004). Word of mouth i positive
  vendinger opst\u00e5r n\u00e5r medarbejderen er engagerede i virksomheden (Hughes
  & Rog, 2008).\\n\\n2.4.4 Employer Brand Equity\\n\\nFor at opn\u00e5 en bredere
  forst\u00e5else for employer branding inddrager Backhaus og Tikoo (2004) begrebet
  employer brand equity. Begrebet stammer fra Aaker''s marketingbaserede begreb om
  brand equity, der defineres som f\u00f8lgende:\\n\\n\\\"a set of brand assets and
  liabilities linked to a brand that add to or subtract from the value provided by
  a product or service to a firm and/or that firm''s customers\\\" (Aaker, 1996 s.
  7-8).\\n\\nSagt med andre ord er brand equity forbrugerorienteret og relateret til
  de associationer, som forbrugerne har til et bestemt brand samt den v\u00e6rdi,
  som forbrugerne till\u00e6gger produktet eller servicen (Backhaus & Tikoo, 2004/Keller,
  1993). Desuden skal viden om produkt/service brandet giver forbrugerne fordele ved
  at lette informationsbehandling om produktet/servicen, for derigennem at \u00f8ge
  tilliden til deres brand valg, hvilket reducerer information, omkostninger og de
  faktorer, som forbrugerne opfatter som risici. Derfor skal brand equity afspejles
  i de \u00e6ndringer, der tager udgangspunkt i forbrugernes opfattelse af risiko,
  tillid, og informationsomkostninger (Wilden et al, 2010).\\n\\nBackhaus og Tikoo
  (2004) har overf\u00f8rt begrebet brand equity til employer branding teorien, og
  definerer employer brand equity s\u00e5ledes:\\n\\n\\\"Employer brand equity is
  the desired outcome of employer brand activities. In other words, potential or existing
  employees will react differently to similar recruitment, selection, and retention
  efforts from different firms because of the underlying employer brand equity associated
  with these firms\\\"\\n\\nog\\n\\n\\\"the effect of brand knowledge on potential
  and existing employees of the firm\\\" (Backhaus & Tikoo, 2004).\\n\\nHermed er
  der tale om det \u00f8nskv\u00e6rdige resultat af employer brand aktiviteterne.
  Derudover fremh\u00e6ves det, at employer branding har forskellig effekt p\u00e5
  eksisterende og potentielle medarbejdere, eftersom alle har forskellige individuelle
  opfattelser af virksomheden som arbejdsplads. Employer brand equity skal v\u00e6re
  med til at \u00f8ge fastholdelse af medarbejderne og dermed neds\u00e6tte personaleoms\u00e6tningen
  (Backhaus & Tikoo, 2004).\\n\\n2.4.5 Succes og fiasko med employer branding\\n\\nI
  dette afsnit skal der ses eksempler p\u00e5, hvad der kan ske, hvis employer branding
  strategien er en fiasko, og hvad der kan ske, hvis den bliver en succes. Desuden
  ses der n\u00e6rmere p\u00e5 de elementer, der er med til at g\u00f8re employer
  branding til en succes for virksomheden og dens medarbejdere.\\n\\n188.8.131.52
  Fiasko\\n\\nFor at komme med et eksempel p\u00e5 hvor galt det kan g\u00e5 en virksomhed,
  hvis employer branding ikke bliver fulgt til d\u00f8rs, skal der her ses n\u00e6rmere
  p\u00e5 implementeringen af den nye skolereform, som tr\u00e5dte i kraft for skole\u00e5ret
  2014/2015. Begrundelsen for at benytte dette eksempel er, at skolen h\u00f8rer under
  den offentlige sektor og yder en service til borgerne. De to faktorer g\u00f8r,
  at det er muligt at tr\u00e6kke paralleller mellem dette eksempel samt, hvordan
  RHP skal forholde sig til udarbejdelsen samt implementeringen af deres employer
  brand.\\n\\nEfter at skolereformen er tr\u00e5dt i kraft, st\u00e5r skolerne rundt
  om i landet med et k\u00e6mpe problem i form af medarbejderflugt. Hver 10. l\u00e6rer
  har sagt deres job op, og dermed helt forladt folkeskolen som arbejdsplads, og der
  er tale om l\u00e6rere, der er langt fra pensionsalderen. Folkeskolereformen f\u00e5r
  en del af skylden, da der med den er lavet om i l\u00e6rernes grundl\u00e6ggende
  arbejdsvilk\u00e5r, da en stor del reformen handler om, hvor og hvorn\u00e5r de
  l\u00e6gger deres arbejde. If\u00f8lge Claus Hjortdal, der er formand for Danmarks
  Skolelederforening, er det ikke kun skolereformen, der ligger til grund for medarbejderflugten,
  men ogs\u00e5 hele itales\u00e6ttelsen af det at v\u00e6re l\u00e6rer \u2013 det
  er ikke smart. Problemet er s\u00e5 stort, at en unders\u00f8gelse viste, at 41
  procent af de adspurgte kommuner har store eller i nogen grad problemer med at rekruttere
  nye medarbejdere (Politikken, 2015).\\n\\nP\u00e5 trods af medarbejderflugt og d\u00e5rlig
  omtale i medierne, er eleverne positive over for reformen og st\u00f8tter op omkring
  den. Det kan dog ikke undg\u00e5s, at eleverne i nogen grad bliver p\u00e5virket
  at deres for\u00e6ldres negative holdning samt den d\u00e5rlige omtale i medierne.
  Derfor opfordrer Miranda Dagsson, der er formand for foreningen Danske Skoleelever,
  til at for\u00e6ldrene holder tilbage med deres negative holdninger omkring spisebordet
  for ikke at p\u00e5virke b\u00f8rnene negativt (Dagensdannelse, 2015).\\n\\nOvenst\u00e5ende
  er et udm\u00e6rket eksempel p\u00e5, hvordan en virksomheds/organisations employer
  brand anses for at v\u00e6re dynamisk og under konstant p\u00e5virkning af for eksempel
  kultur og sociale kontekster, s\u00e5 som medieomtale, virksomhedens interne og
  eksterne branding/kommunikation.\\n\\n184.108.40.206 Succes\\n\\nIf\u00f8lge Sullivan
  (2004) er der 8 punkter, som skal opfyldes for, at en virksomhed kan opn\u00e5 succes
  med deres employer brand. De 8 punkter er f\u00f8lgende:\\n\\n1. Balance mellem
  god ledelse og h\u00f8j produktivitet.\\n2. Opn\u00e5 offentlig anerkendelse (bedste
  arbejdsplads-liste).\\n3. Medarbejdere proaktivt fort\u00e6ller om arbejdspladsen
  (selvf\u00f8lgelig positive fort\u00e6llinger).\\n4. Bliv n\u00e6vnt.\\n5. Bliv
  den de andre benchmarker med.\\n6. \u00d8g kandidaternes bevidsthed om virksomhedens
  best practices.\\n\\n7. M\u00e5l og vurder brandingen l\u00f8bende, ogs\u00e5 selv
  om virksomheden er den bedste.\\n8. De virksomheder, der kan omfavne employer branding,
  har en konkurrencefordel (Sullivan, 2004)\\n\\nIf\u00f8lge Moroko og Uncles (2008)
  og Christensen (2007) opn\u00e5r en virksomhed succes med sit employer brand ved
  igennem marketingskommunikation at levere et pr\u00e6cist portr\u00e6t og ved konsekvent
  at levere det i en sammenh\u00e6ng med det l\u00f8fte, som produkt (service) brandet
  har givet. Denne opfattelse svarer til organisatorisk adf\u00e6rd, der ses inden
  for den psykologiske kontrakt-teori, nemlig individuelle overbevisninger om gensidige
  forpligtelser mellem arbejdstagere og arbejdsgivere. Medarbejderne danner et billede
  af disse gensidige forpligtelser under rekrutteringsprocessen og de er baseret p\u00e5
  klare erkl\u00e6ringer givet af virksomheden sammen med uformelle og m\u00e5ske
  upr\u00e6cise oplysninger. Disse uformelle og upr\u00e6cise oplysninger\\n\\nkan
  komme forskellige steder fra, for eksempel via eksterne personalekonsulenter, word
  of mouth, pressen eller sociale medier. N\u00e5r den psykologiske kontrakt er opfyldt,
  er der en st\u00f8rre tendens til at medarbejderne er engagerede og loyale. Brydes
  den derimod er der stor risiko for, at engagementet samt produktiviteten falder
  samt en \u00f8get personaleoms\u00e6tning (Moroko & Uncles, 2008).\\n\\nEn anden
  faktor for at et employer brand bliver en succes er, at det skal v\u00e6re retvisende
  og pr\u00e6cist, desuden skal det kommunikeres ud til hele virksomheden, s\u00e5
  der ikke opst\u00e5r misforst\u00e5elser eller kulturkl\u00f8fter. Hvis disse to
  faktorer opfyldes, mener Moroko og Uncles (2008), at virksomheden kan opn\u00e5
  stor succes med deres employer branding og dermed fremst\u00e5 som en attraktiv
  og \u00f8nskv\u00e6rdig arbejdsplads (Moroko & Uncles, 2008). For RHP betyder det,
  at de skal kommunikere budskabet om de fordele, der falder ind under den psykologiske
  kontrakt, der er ved deres arbejdsplads. Her retter vi igen blikket imod v\u00e6rdis\u00e6ttet,
  hvor faglighed og uddannelse i h\u00f8j grad falder ind under denne kategori og
  anses for at v\u00e6re nogle af de v\u00e6rdier, der skal l\u00e6gges v\u00e6gt
  p\u00e5 for at opn\u00e5 succes med deres employer brand.\\n\\nEn offentlig servicevirksomhed,
  der har haft succes med deres employer brand, er Center for Socialpsykiatri p\u00e5
  Lolland, som har vundet en pris for at v\u00e6re den bedste offentlige arbejdsplads
  samt den tredje bedste arbejdsplads i kategorien, Danmarks Bedste Mellemstore Arbejdsplads,
  2014 (DR, 2014) (www.greatplacetowork.dk) (Berlinske media, 2014). De havde sat
  en m\u00e5ls\u00e6tning om at blive Danmarks bedste arbejdsplads fordi, det smitter
  af p\u00e5 deres klienter (handikappede borgere). De beskriver processen som v\u00e6rende
  simpel; \\\"Husk nu fra ledelsens side at rose medarbejderne. Husk nu, at man kan
  selv. Man planl\u00e6gger selv. Man tager selv stilling. Og man skal have anerkendelse.
  Og internt blandt medarbejdere er sladder og s\u00e5 videre forbudt\\\" fort\u00e6ller
  Gert Mortensen, der er formanden for Social- og Psykiatriudvalget (DR, 2014). Han
  pointerer dog, at det er vigtigt at f\u00e5 indarbejdet tiltagene, og f\u00e5 det
  gjort hver dag. Hermed kan Center for Socialpsykiatri p\u00e5 Lolland bryste sig
  af, at v\u00e6re en arbejdsplads med glade og tilfredse medarbejdere og samtidig
  ud\u00f8ve best practices inden for omr\u00e5det. Dermed booster de deres employer
  brand i en grad, der er beundrings- og misundelsesv\u00e6rdigt for andre virksomheder.\\n\\n2.5
  Rekrutteringsteori\\n\\nEmployer brand er med til at sikre, at de rationelle og
  f\u00f8lelsesm\u00e6ssige fordele er sammenfaldende mellem eksisterende og potentielle
  medarbejderes forventninger (Mosley, 2007) (Foster et al, 2010). En ans\u00f8ger
  sammenligner sine behov, personlighed og v\u00e6rdier med det virksomheden kan tilbyde
  inden, et evt. job s\u00f8ges. Inden for servicesektoren, kan det ikke understreges
  nok, hvor vigtig en faktor det er, at de eksisterende medarbejdere er virksomhedens
  ansigt udadtil og potentielt kan yde service til en fremtidig medarbejder.\\n\\nDerfor
  skal medarbejderens adf\u00e6rd v\u00e6re i overensstemmelse med det v\u00e6rdis\u00e6t,
  virksomheden har. Det helt essentielle her er, at virksomheden har kommunikeret
  klart og pr\u00e6cist om deres kultur, identitet og v\u00e6rdier til omverden, da
  det er m\u00e5den, hvorp\u00e5 der skabes et realistisk billede af, hvad den psykologiske
  kontrakt mellem medarbejdere og virksomheden indeb\u00e6rer (Foster et al, 2010).\\n\\nRekruttering
  er en attraktionsproces, hvor det er et m\u00e5l at have mange ans\u00f8gere, for
  p\u00e5 den m\u00e5de kan arbejdsgiveren v\u00e6re mere selektiv i udv\u00e6lgelsesprocessen,
  hvilket resulterer i en bedre ans\u00e6ttelse for b\u00e5de virksomheden og enkeltpersonen
  i form af \u00f8get ydeevne. (Acarlar & Bilgi\u00e7, 2012/Carlson, Connerley and
  Mecham 2002). Tiltr\u00e6kningen af en virksomhed er den f\u00f8rste faktor, der
  indg\u00e5r i rekrutteringsprocessen, og kan betragtes som den vigtigste, for uden
  den ville der ikke komme nogle ans\u00f8gninger (Acarlar & Bilgi\u00e7, 2012). Derfor
  er det vigtigt, at virksomheden har et retvisende og positivt image, da det har
  indflydelse p\u00e5 ans\u00f8gerens tiltr\u00e6kning af virksomheden, men den fulde
  forst\u00e5else for sammenh\u00e6ngen er ikke unders\u00f8gt til bunds (Backhaus
  & Tikoo, 2004/Tom, 1971; Belt and Paolillo, 1982; Gatewood et al., 1993; Turban
  and Greening, 1997/ Barber, 1998).\\n\\nI s\u00f8gen p\u00e5 nye medarbejdere, skal
  der udformes en stillingsannonce, og den m\u00e6ngde af information, der er tilg\u00e6ngelig
  her, vurderes til at v\u00e6re positivt relateret til indflydelse p\u00e5 ans\u00f8gerens
  beslutning om at s\u00f8ge jobbet (Acarlar & Bilgi\u00e7, 2012/Barber og Roehling
  1993). Men ud over m\u00e6ngden af informationer givet i stillingsannoncen er indholdet
  og typen af information ogs\u00e5 vigtig, og det skal v\u00e6re relevant i forhold
  til jobbet (Acarlar & Bilgi\u00e7, 2012/Yu\u00a8ce and Highhouse, 1998). Desuden
  viser unders\u00f8gelser, at hvis annoncen indeholder de fordele, der er ved at
  arbejde for virksomheden, vil der v\u00e6re flere ans\u00f8gere. Desuden anses trov\u00e6rdighed
  for at have indflydelse p\u00e5, om ans\u00f8gerne finder jobbet sp\u00e6ndende
  nok til at sende en ans\u00f8gning (Acarlar & Bilgi\u00e7, 2012). Som beskrevet
  under ekstern branding, afsnit 2.4.3, anses word of mouth at v\u00e6re den mest
  trov\u00e6rdige kilde til at gengive informationer om en virksomheds employer brand
  (herunder de fordele der er ved at arbejde for en virksomhed), og dette faktum b\u00f8r
  ledere g\u00f8re brug af og etablere medarbejderne henvisning programmer (Wilden
  et al, 2010).\\n\\nEn jobannonce skal m\u00e5lrettes det jobmarked, hvorfra der
  s\u00f8ges kandidater og jobannoncerne skal tilpasses den m\u00e5lgruppe, som den
  skal \\\"ramme\\\", is\u00e6r n\u00e5r man tager i betragtning, at jo mere erhvervserfaring
  en kandidat har, jo mere kritisk indstillet er vedkommende over for klarheden og
  trov\u00e6rdigheden ved en virksomheds employer brand (Ibid.). Desuden skal selve
  ans\u00e6ttelsesprocessen og dermed jobinterviewet afspejle virksomhedens employer
  brand for at skabe trov\u00e6rdighed (Ibid.).\\n\\nArbejdsmarkedet er pr\u00e6get
  af asymmetrisk information. F\u00f8r p\u00e5begyndelse af job og direkte oplevelse
  af arbejdsbetingelser p\u00e5 f\u00f8rste h\u00e5nd, kan en potentiel medarbejder
  ikke fuldt ud vurdere kvaliteten af en potentiel arbejdsgiver med sikkerhed. Det
  samme er tilf\u00e6ldet fra arbejdsgiverens synsvinkel. Asymmetrien opst\u00e5r
  i forhold til udbud og eftersp\u00f8rgsel p\u00e5 arbejdskraft inden for den given
  branche (Larsen, 2006, s. 123).\\n\\n2.5.1 Motivationsfaktorer ved jobs\u00f8gning
  i den offentlige sektor\\n\\nN\u00e5r en person skal v\u00e6lge arbejde i dag, g\u00f8res
  det ikke kun ud fra et \u00f8konomisk perspektiv - men ogs\u00e5 af emotionelle
  grunde (Ibid.).\\n\\n\\\"medarbejderen i dag v\u00e6lger arbejdsplads med hjertet
  og ikke af rationelle \u00e5rsager, som for eksempel l\u00f8n og arbejdstider\\\"
  (Ibid.).\\n\\nOAO (Offentlige Ansattes Organisation, der arbejder for l\u00f8n og
  arbejdsvilk\u00e5r, for offentlige ansatte) har lavet en unders\u00f8gelse, der
  viser hvilke faktorer, der positivt p\u00e5virker tiltr\u00e6kning og fastholdelse
  i den offentlige sektor. Formanden for FOA (FOA er fagforbund for blandt andet sundheds
  og social assistenter, der er en del af plejerpersonalet og dermed en del af unders\u00f8gelsesm\u00e5lgruppen
  for denne afhandling) Dennis Kristensen, beskriver tre faktorer, der tiltr\u00e6kker
  samt tre faktorer, der er med til at fastholde medlemmerne af FOA til et arbejde
  i den offentlige sektor. Tiltr\u00e6kningsfaktorer er god l\u00f8n, uddannelse og
  respekt for faglighed, hvor fastholdelsesfaktorerne er igennem anerkendelse, udvikling
  og respekt. Dermed vurderes det at det v\u00e6rdis\u00e6t, som RHP har udviklet,
  er spot on i forhold til hvilke faktorer, der motiverer og fastholder medarbejderne
  (OAO).\\n\\n2.6 Branding i private sektor vs. den offentlige sektor\\n\\nSom det
  er beskrevet tidligere er der ikke udviklet og dermed heller ikke nedskrevet nogen
  form for produkt brand eller corporate brand strategi for RHS. Men if\u00f8lge Temporal
  (2014) er der ingen vej uden om branding, da der i fremtiden vil v\u00e6re sk\u00e6rpet
  konkurrence om alt, her i blandt ogs\u00e5 talenter (medarbejdere generelt) (Temporal,
  2014, s. 7).\\n\\nDer er fire grunde til, at der skal brandes, selv om RHP befinder
  sig I den offentlige sektor. Tre af grundene er de samme, som er gennemg\u00e5et
  tidligere, i afsnit 2.1.1, nemlig differentiering, f\u00f8lge med \u00e6ndringerne
  i samfundet og eftersp\u00f8rgslen. Men den fjerde grund til at benytte branding
  i den offentlige sektor er, at virksomheden allerede har et image blandt befolkningen,
  og ved at udvikle brands kan virksomheden v\u00e6re med\\n\\ntil at styre det image
  i en positiv (eller mere positiv) retning (Temporal, 2014, s.10-11). Det vil alts\u00e5
  sige, at RHP allerede har et service og et corporate image ude i befolkningen, som
  der skal tages h\u00f8jde for, n\u00e5r der udvikles et employer image. Det er dermed
  vigtigt at unders\u00f8gelsen, der skal udarbejdes til denne afhandling, klarl\u00e6gger,
  hvad RHP''s image er, i deltagernes perspektiver forud for deres eventuelle ans\u00e6ttelse
  i virksomheden. Hvis dette bliver klarlagt vurderes det, at udviklingen af et employer
  brand er muligt.\\n\\nDer er flere fordele ved at benytte branding for RHP, for
  eksempel at blive set og h\u00f8rt, b\u00e5de nationalt og internationalt, hvilket
  kan f\u00f8re til magt og penge i form af donationer osv. De st\u00f8rste forskelle
  mellem den offentlige sektor og den private sektor er, at den organisatoriske opbygning
  er hierarkisk opbygget i den offentlige sektor. Det kan ogs\u00e5 v\u00e6re tilf\u00e6ldet
  i nogle private virksomheden, men der er meget langt til den endelige beslutningstager
  i den offentlige sektor, og l\u00e6ngere end der er i de fleste private virksomheder.
  Desuden h\u00f8rer RHP ind under kategorien non-profit, og har kun til form\u00e5l
  at tjene borgerne (Temporal, 2014). Disse faktorer skal der tages h\u00f8jde for
  ved branding, s\u00e5 n\u00e5r argumentet om at branding kan betyde flere penge
  er det med henblik p\u00e5, at disse skal bruges til eksempelvis forskning, bedre
  faciliteter, flere sengepladser og s\u00e5 videre.\\n\\n2.6.1 Implementering\\n\\nN\u00e5r
  et brand skal implementeres i en virksomhed, skal det ske p\u00e5 alle niveauer,
  ellers skaber det mistillid til virksomheden (Temporal, 2014, s. 207-208). Brand
  management har til opgave at styrke virksomhedens v\u00e6rdigrundlag og s\u00f8rge
  for, at det gennemsyrer organisationskulturen (Temporal, 2014, s.148). N\u00e5r
  employer brandet skal implementeres i arbejdskulturen p\u00e5 RHP, er det vigtigt,
  at noget af v\u00e6rdigrundlaget afspejler personlighedskarakteristika, alts\u00e5
  en bestemt m\u00e5de at opf\u00f8re sig og handle p\u00e5. Det vurderes at RHP''s
  v\u00e6rdis\u00e6t indeholder s\u00e5danne karakteristika med v\u00e6rdierne respekt
  og ansvar. Udfordringer for brand management i den offentlige sektor er blandt andet
  at balancere mellem den langsigtede strategi og den kortsigtede m\u00e5ls\u00e6tning
  samt politisk indblanding (Temporal, 2014, s.148).\\n\\nHR''s rolle ved intern branding
  er begr\u00e6nset til at st\u00f8tte kommunikationen og HR har desv\u00e6rre ikke
  en aktiv rolle i implementeringen (Mosley, 2007), da denne opgave skal delegeres
  ud til mellemlederne (Johnson et al, 2006, s. 521). Dette har resulteret i, at HR
  ikke er g\u00e5et s\u00e5 meget op i substansen (Mosley, 2007). Da implementeringsansvaret
  ligger hos mellemlederne bliver face-to-face metoden, som beskrevet tidligere i
  afsnit 2.4.2, anvendelig.  Da employer branding strategien bliver udarbejdet af
  HR eventuelt i samarbejde med marketing og kommunikationsafdelingen, er strategiske
  workshops for mellemledere en mulighed for at f\u00e5 videregivet budskabet om indholdet.
  Disse workshops har til form\u00e5l at overs\u00e6tte virksomhedens employer brand
  strategi og alle de elementer, der h\u00f8rer her ind under til et sprog, der g\u00f8r
  det forst\u00e5eligt for medarbejderne og dermed kan bruges i hverdagen (Johnson
  et al, 2006, s. 574).\\n\\n2.7 Opsummering\\n\\nFor at skabe et overblik over de
  vigtigste parametre ved udviklingen af et st\u00e6rkt employer brand, har jeg udarbejdet
  et skema, se skema nr. 2.1 neden for. Alle parametrene er gennemg\u00e5et i dybden
  igennem hele kapitlet. Form\u00e5let med skemaet er, at danne grundlag for udarbejdelsen
  af en benchmarking (sammenligning) i kapilet 4 mellem, hvilken grad af vigtighed
  teorien till\u00e6gger de enkelte parametre i udviklingen af et employer brand og
  i hvor h\u00f8j grad, RHP i skrivende stund leverer, det teorien forskriver. P\u00e5
  denne m\u00e5de bliver det overskueligt, hvor indsatsen skal ligge.\\n\\n|  | PARAMETER
  I EMPLOYER BRANDING |  | VIGTIGHED | BED\u00d8MMELSE |\\n|---|---|---|---|---|\\n|
  Employer brand opbygges ud fra: |  |  |  |  |\\n| Virksomhedens identitet - medarbejdernes
  opfattelse af virksomheden som arbejdsplads |  | 5 |  |  |\\n| Virksomhedens profil
  - vision afspejles i adf\u00e6rden |  | 5 |  |  |\\n| Virksomhedens profil - v\u00e6rdier
  afspejles i adf\u00e6rd |  | 5 |  |  |\\n| Virksomhedens profil \u2013 EVP |  |
  5 |  |  |\\n| Virksomhedens image - corporate brand |  | 5 |  |  |\\n| Employer
  brand har til form\u00e5l: |  |  |  |  |\\n| at g\u00f8re arbejdspladsen identificerbar
  |  | 5 |  |  |\\n| at differentiere arbejdspladsen som arbejdsgiver |  | 5 |  |  |\\n|
  Opgaver forbundet med employer branding: |  |  |  |  |\\n| Ekstern branding |  |
  5 |  |  |\\n| Intern branding |  | 5 |  |  |\\n| Det \u00f8nsket outcome af employer
  brandet: |  |  |  |  |\\n| Employer brand equity |  | 5 |  |  |\\n\\nSkema nr. 2.1
  Skema over de parameter der indg\u00e5r i et employer branding. Udarbejder med inspiration
  fra Seldorf, 2008, Backhaus & Tikoo, 2004, Mosley, 2007, Foster et al, 2010 og Wilden
  et al, 2010.\\n\\nSkemaet skal l\u00e6ses p\u00e5 f\u00f8lgende m\u00e5de, kolonnen
  vigtighed fort\u00e6ller ud fra en skala p\u00e5 1-5 i hvor h\u00f8j grad, teorien
  till\u00e6gger hvert punkt for v\u00e6rende vigtigt, hvor 1 er slet ikke vigtig,
  2 er ikke vigtig, 3 er hverken eller, 4 er vigtig og 5 er meget vigtig. Da teorien,
  der er benyttet i denne afhandling siger, at der skal v\u00e6re en\\n\\nsammenh\u00e6ng
  mellem alle parametre i et employer brand for at skabe trov\u00e6rdighed, till\u00e6gges
  alle elementerne en vigtighed p\u00e5 5. Kolonnen bed\u00f8mmelse skal vise hvor
  st\u00e6rke de forskellige parmetre er i skrivende stund. Med andre ord skal skemaet
  vise hvor st\u00e6rk, virksomheden identitet er ud fra de pr\u00e6senterede data
  i kapitel 4 og s\u00e5 videre. Igen vil bed\u00f8mmelsen v\u00e6re ud fra en 1-5
  skala, hvor 1 er meget svagt, 2 er svagt, 3 er kunne v\u00e6re bedre, 4 er st\u00e6rkt
  og 5 er meget st\u00e6rkt.\\n\\nBrandet anses for at v\u00e6re dynamisk, hvilket
  betyder, at det konstant skal tilpasses omgivelserne, denne ''regel'' er g\u00e6ldende
  for alle virksomhedens brands. Is\u00e6r i servicesektoren er der en sammenh\u00e6ng
  mellem virksomhedens corporate brand, den interne branding og den eksterne branding.
  Sammenh\u00e6ngen opst\u00e5r, da det er vigtigt, at de ansatte og is\u00e6r dem,
  der har direkte kontakt med patienter og p\u00e5r\u00f8rende, lever op til det l\u00f8fte,
  som virksomheden har givet, via corporate branding. P\u00e5 den m\u00e5de skabes
  der kundetilfredshed, og da der kan v\u00e6re potentielle fremtidige medarbejdere
  blandt patienterne, de p\u00e5r\u00f8rende eller nogle i deres omgangskreds, er
  det vigtigt at f\u00e5 givet et godt indtryk af virksomheden. I tiltr\u00e6kningsprocessen
  er word of mouth den mest trov\u00e6rdige kilde. Alle rekrutteringer kan dog ikke
  komme via netv\u00e6rk, og derfor skal virksomheden v\u00e6re skrap i deres eksterne
  branding af deres employer brand, og dette skal ske m\u00e5lrettet mod m\u00e5lgruppen.\\n\\nEmployer
  brandet er opbygget ud fra tre dimensioner, virksomhedens identitet, profil og image,
  som alle tre lapper ind over hinanden, og lige netop de elementer, som er f\u00e6lles,
  er udgangspunktet for virksomhedens employer brand. Form\u00e5let med employer brandet
  er, at det skal v\u00e6re med til at g\u00f8re virksomheden som arbejdsplads identificerbar
  og differentiere den fra konkurrenterne. Employer brandet skal ogs\u00e5 bruges
  som v\u00e6rkt\u00f8j til at tiltr\u00e6kke, fastholde og motivere medarbejderne.\\n\\nEmployer
  brandet equity er det \u00f8nskede resultat af virksomhedens employer brand, og
  er en vigtig del af udviklingen, da det kan benyttes efterf\u00f8lgende til at m\u00e5le
  effekten. Stillingsannoncerne skal beskrive, hvor attraktiv arbejdspladsen er ved
  at informere om alle de fordele, der er ved at arbejde i virksomheden.\\n\\nSelv
  om der er tale om en virksomhed i den offentlige sektor, anses brand p\u00e5 alle
  niveauer som v\u00e6rende vigtigt, da virksomheden her igennem kan kontrollere imaget
  og v\u00e6re med i kampen om medarbejderne. Der vil dog v\u00e6re nogle hensyn,
  som der skal tages h\u00f8jde for, da virksomheden er underlagt nogle retningslinjer
  fra politisk side.\\n\\nSp\u00f8rgerammen til unders\u00f8gelsen er udarbejdet med
  inspiration fra teorien, og er vedlagt afhandlingen som bilag 3.\\n\\n3 Valg af
  metode samt videnskabelig perspektivering\\n\\n3.1 Introduktion\\n\\nForm\u00e5let
  med dette kapitel er at give l\u00e6seren en forst\u00e5else for den tankegang samt
  den arbejdsproces, der er fundamentet for udarbejdelsen af denne afhandling. Dette
  kapitel vil tage l\u00e6seren igennem den valgte metode til indsamling af de data,
  som er fundamentet for den forest\u00e5ende analyse, der har til form\u00e5l at
  besvare den stillede problemformulering. Derefter vil der blive beskrevet samt argumenteret
  for forskningsstrategien, alts\u00e5 hvordan behandles de indsamlede data i forsknings\u00f8jemed.\\n\\nDerudover
  vil der i dette kapitel ogs\u00e5 blive set n\u00e6rmere p\u00e5 det syn p\u00e5
  verden samt den fortolkningsproces, der ligger til grund for den forest\u00e5ende
  analyse, der bliver pr\u00e6senteret i kapitel 4 og 5.\\n\\n3.2 Metode \u2013 indsamling
  af data samt forskningsstrategi\\n\\n3.2.1 Kvalitativ dataindsamling\\n\\nFor at
  kunne komme med et kvalificeret bud p\u00e5 en besvarelse af problemformuleringen,
  var det n\u00f8dvendigt at indsamle prim\u00e6re data, der kan benyttes til analysen.
  Der er gennem forl\u00f8bet benyttet flere forskellige interviewteknikker, som alle
  sammen har v\u00e6ret af kvalitativ karakter. De forskellige interviewformer vil
  blive gennemg\u00e5et nedenfor.\\n\\nBegrundelserne for, at der er benyttet kvalitative
  interviews som prim\u00e6re data til udarbejdelsen af denne afhandling, er flere.
  Den f\u00f8rste er, at Wilden et al (2010) og Morko & Uncles (2008) benyttede sig
  af kvalitative interviews til udarbejdelsen af deres teorier, der omhandlende employer
  brand equity og succes kriterier, hvilke er to af de centrale teorier, denne afhandling
  er baseret p\u00e5. Desuden g\u00f8r den kvalitative interviewform det muligt at
  finde frem til en mere dybdeg\u00e5ende forklaring p\u00e5 de stillede sp\u00f8rgsm\u00e5l.
  Ved brug af denne metode er det muligt at f\u00e5 et mere fyldestg\u00f8rende og
  nuanceret billede af de oplevelser, som de adspurgte har haft.\\n\\nVed brug af
  kvalitative interviews kan der opst\u00e5 et asymmetrisk magtforhold mellem interviewer
  og deltageren. Da intervieweren dels styrer samtalesituationen og dels styrer samtaleemnet,
  argumenteres der for, at det er intervieweren, der har magten (Kvale & Brinkmann,
  2009, s. 51) (Fuglesang et al, 2013, s.\\n\\n321/H\u00f8jberg). Ligeledes argumenteres
  der for, at det lige s\u00e5vel kan v\u00e6re den interviewede, der sidder med magten,
  da denne besidder en viden, som intervieweren gerne vil have indblik i. Magtbalancen
  er dermed ikke entydig men en vigtig faktor, som intervieweren skal v\u00e6re klar
  over ved udf\u00f8relen af selve interviewet (Fuglesang et al, 2013, s. 321/H\u00f8jberg).
  Denne faktor har jeg pr\u00f8vet at tage h\u00f8jde for.\\n\\nKonsekvensen af den
  benyttede teknik er, at analysen kun vil vise et lille udsnit af det store samlede
  billede. Men fordelene vejer tungere end ulemperne, og desuden vil der blive taget
  h\u00f8jde for ulemperne i analysen. Der er benyttet forskellige varianter for kvalitative
  interviewteknikker, som vil blive gennemg\u00e5et i det f\u00f8lgende afsnit.\\n\\n220.127.116.11
  Udv\u00e6lgelse af respondenter\\n\\nAlle deltagerne i unders\u00f8gelsen h\u00f8rer
  ind under den faggruppe, der er kategoriseret som plejepersonalet. Det vil sige
  sygeplejersker, SOSU-assistenter, SOSU-medhj\u00e6lpere og socialr\u00e5dgivere.
  Alle deltagerne har v\u00e6ret en eller flere rekrutteringsforl\u00f8b igennem de
  seneste seks m\u00e5neder forud for interviewtidspunktet og kommer fra Center Amager,
  Hvidovre, Glostrup, Bispebjerg og Nordsj\u00e6lland. Nogle af centrene har deltagerne
  af interviewene kun v\u00e6ret i kontakt med i form af tidligere ans\u00e6ttelser,
  praktik eller bare en jobsamtale. Af de 15 deltagere i unders\u00f8gelsen er 7 nyuddannet,
  3 er rekrutteret internt, 3 er rekrutteret fra somatikken, 1 er lige kommet hjem
  fra udlandet og 1 er udl\u00e6nding (tysker). Ydermere er 2 deltagere sosuassistenter,
  1 deltager er socialr\u00e5dgiver og 12 deltagere er sygeplejersker. Alle h\u00f8rer
  ind under kategorien plejepersonale, som beskrevet i kapitel 1. 13 af deltagerne
  fik jobbet og arbejder i dag i RHP, mens 2 deltagere fik afslag p\u00e5 jobbet efter
  jobsamtalen og arbejder ikke for RHP. Deltagerne arbejder i RHP eller har s\u00f8gt
  meget bredt i organisationen, det vil sige, at der er deltagere, der arbejder p\u00e5
  psykiatrisk skadestue, lukkede afdelinger, eller p\u00e5 \u00e5bne afsnit. Det har
  v\u00e6ret n\u00f8dvendigt, at deltagerne kommer s\u00e5 mange steder fra og med
  forskellig baggrund for at kunne f\u00e5 deltagere nok, da der ikke er et center
  eller en afdeling, der skulle ans\u00e6tte 15 medarbejdere p\u00e5 en gang. I alt
  deltog 15 medarbejdere i interviewene, der alle varede fra 40 minutter til 60 minutter.\\n\\nKontakten
  til deltagerne af interviewene blev formidlet via hj\u00e6lp fra Kirstinebjerg.
  I f\u00f8rste omgang sendte de en mail ud til nogle udviklingschefer, der har videreformidle
  kontakten via mail til afdelingssygeplejerskerne. Nogle deltagere fik jeg kontakt
  til ved at sp\u00f8rge deltagerne, om de eventuelt kendte flere, der kunne deltage.
  Denne fremgangsm\u00e5de var n\u00f8dvendig, da e-rekrutteringssystemet ikke kunne
  tr\u00e6kke data om m\u00e5lgruppen.\\n\\n18.104.22.168 Forskellige former for ustrukturerede
  interviews\\n\\nEfter, at der var skabt kontakt til RHP, blev der arrangeret et
  forventningsm\u00f8de mellem virksomhedens repr\u00e6sentanter, som bestod af Iben
  Munck Adamsen (Ledelseskonsulent og repr\u00e6sentant for RH), Louise Berg (Chefkonsulent,
  repr\u00e6sentant for RHP) og Ulla Branner Jespersen (Udviklingschef, repr\u00e6sentant
  for RHP) og mig som studerende. Form\u00e5let var at afstemme forventninger til
  udgangspunktet og kortl\u00e6gge afhandlingens omdrejningspunkt (emnet) samt hvilken
  fremgangsm\u00e5de, der ville blive benyttet. Det blev ogs\u00e5 aftalt hvem, der
  var kontaktperson til de forskellige problemstillinger, da det grundet virksomhedens
  organisatoriske opbygning ikke var muligt at en person har adgang til alle relevante
  oplysninger for denne afhandling. Det vil sige, at Iben har adgang til de oplysninger,
  som er g\u00e6ldende p\u00e5 tv\u00e6rs af organisationen, hvor Ulla og Louise har
  adgang til de informationer, som RHP selv har ansvar for.\\n\\nM\u00f8det havde
  form af et \u00e5bent ustruktureret interview, der havde til form\u00e5l at definere
  motivet (som kan l\u00e6ses i problemstillingen i kapitel 1) bag udarbejdelsen af
  afhandlingen (Andersen, 2005. s. 167).\\n\\n22.214.171.124 Delvis strukturerede
  interviews\\n\\nDer er blevet benyttet delvis struktureret interviews til de prim\u00e6r
  data, der skal v\u00e6re med til at besvare afhandlingens problemformulering. Interviewene
  er gennemf\u00f8rt med ans\u00f8gere, der alle havde v\u00e6ret igennem et rekrutteringsforl\u00f8b
  hos RHP inden for de seneste seks m\u00e5neder.  P\u00e5 den m\u00e5de havde de
  rekrutteringsforl\u00f8bet frisk i hukommelsen og kunne bedre huske hvad, der fungerede
  og hvad, der ikke fungerede.\\n\\nInterviewene havde karakter af at v\u00e6re delvis
  strukturerede interviews. Det vil sige, at alle sp\u00f8rgsm\u00e5lene var udarbejdet
  p\u00e5 forh\u00e5nd som en sp\u00f8rgeramme, se bilag 3 (Andersen, 2005). Sp\u00f8rgerammen
  blev udarbejdet ud fra de v\u00e6sentligste elementer, der indg\u00e5r i teorien
  omhandlende employer branding, og som er udgangspunktet for afhandlingen (kapitel
  2). P\u00e5 den m\u00e5de vil interviewene ber\u00f8re alle de elementer, som er
  n\u00f8dvendige for at kunne komme med et bud p\u00e5 en l\u00f8sning p\u00e5 problemformuleringen.
  Interviewene havde alle en varighed af 40-60 minutter og blev optaget digitalt for
  senere at blive meningskondenseret. Valg af meningskondenseringen giver et mere
  overskueligt overblik over indholdet i interviewene og g\u00f8r dermed sammenligningsgrundlaget
  nemmere, n\u00e5r der skal analyseres p\u00e5 svarene. Dette vil blive beskrevet
  dybere senere i kapitlet.\\n\\nSetup af interview med ans\u00f8gere, der fik jobbet\\n\\nKontakten
  til de medvirkende i unders\u00f8gelsen skete ofte p\u00e5 baggrund af telefonisk
  kontakt med en afdelingsleder, der herefter fandt nogle kandidater. Kandidaterne
  kontaktede jeg via mail eller telefon (den m\u00e5de hvor p\u00e5 jeg lettest kunne
  komme i kontakt med dem \u2013 nogle er oftere ved mailen end andre). Hvis de\\n\\nville
  deltage, aftalte vi et tidspunkt, hvor jeg kom ud p\u00e5 deres arbejdsplads. Her
  var der booket et m\u00f8delokale, s\u00e5 vi kunne udf\u00f8re interviewet i fred.
  Nogle f\u00e5 havde eget kontor, hvilket godt kunne byde p\u00e5 forstyrrelser i
  form af telefoner, der ringede eller medarbejdere, der bankede p\u00e5. Disse forstyrrelser
  gjorde, at jeg som interviewer skulle v\u00e6re god til at holde fokus og f\u00e5
  samtalen p\u00e5 rette spor igen bagefter.\\n\\nEftersom at interviewene forgik
  ude p\u00e5 centrene, fik jeg lidt indblik i, hvordan der er p\u00e5 er psykiatriske
  hospitaler. Nogle steder var der en meget afslappet stemning, hvor patienterne sad
  ude i g\u00e5rdhaverne og hyggede. Andre steder var stemningen ikke helt s\u00e5
  afslappende. Et interview forgik p\u00e5 en lukket afdeling, hvor jeg blev f\u00f8rt
  ind i et lokale, og s\u00e5 blev alle d\u00f8rene l\u00e5st. P\u00e5 vejen ind til
  m\u00f8delokalet sad der en patient, der blev ved med at sp\u00f8rge, hvem jeg var
  og hvad jeg skulle der. Man kunne tydeligt m\u00e6rke, at patienten ikke var tryg
  ved mig og derfor virkede lidt truende p\u00e5 mig. Da jeg hele tiden var i f\u00f8lgeskab
  af en medarbejder, f\u00f8lte jeg mig nogenlunde tryg, men det var en oplevelse,
  der var gr\u00e6nseoverskridende for mig p\u00e5 mange m\u00e5der.\\n\\nEn respondent
  br\u00f8d gr\u00e6dende sammen efter endt interview og beklagede sig over de, efter
  hendes udsagn, \\\"ekstremt d\u00e5rlige arbejdsforhold\\\". Under selve interviewet
  gav hun gentagende gange udtryk for sin utilfredshed. Da jeg som menneske og kommende
  HR medarbejder ikke bare kunne g\u00e5 fra en person, der gr\u00e6dende udtrykte
  utilfredshed med sit arbejde, dr\u00f8ftede jeg problemstillingen med mine kontaktpersoner,
  som vejledte i de officielle procedurer for h\u00e5ndtering af s\u00e5danne situationer.
  Denne vejledning videregav jeg til respondenten, og s\u00e5 kontaktede jeg hende
  igen efter ca. en m\u00e5ned for at f\u00e5 en status p\u00e5 hendes problemstilling.
  Udviklingen af dette interview gik fra at v\u00e6re et delvist struktureret forskningsinterview
  til en terapeutisk samtale, hvor det emotionelle og personlige samspil helt overskyggede
  de begrebsm\u00e6ssige argumenter, som ligger til grund for sp\u00f8rgerammen (Kvale
  & Brinkmann, 2009, s. 59). Her m\u00e5tte jeg, som i den interviewedes \u00f8jne
  kommer med en indgangsvinkel til HR, huske mig selv p\u00e5 RHP''s v\u00e6rdier,
  om mennesket i centrum og is\u00e6r respekt og ansvar.\\n\\nSetup af interview med
  ans\u00f8gere, der fik afslag\\n\\nDer var lidt udfordringer ved at f\u00e5 kontakt
  til personer, som havde v\u00e6ret igennem en rekrutteringsproces med RHP, hvorefter
  de fik afslag. Jeg fik nogle kontaktoplysninger af en afdelingssygeplejerske, men
  kun to havde lyst til at deltage. Langt de fleste vendte ikke tilbage til mig p\u00e5
  trods af flere fors\u00f8g p\u00e5 at komme i kontakt med dem. Interviewene af de
  ans\u00f8gere, der fik afslag p\u00e5 jobbet, blev gennemf\u00f8rt hjemme hos dem
  selv. Fordelen ved det var, at de f\u00f8lte sig trygge og kunne snakke frit. Ulempen
  var, at der var en risiko for forstyrrelser under udf\u00f8rslen af interviewene.
  Det var den samme sp\u00f8rgeramme, som blev benyttet her, dog\\n\\nmed en mundtlig
  formulering s\u00e5 sp\u00f8rgsm\u00e5lene passede til dem. For eksempel blev der
  stillet f\u00f8lgende sp\u00f8rgsm\u00e5l: \\\"Kan du beskrive din ans\u00e6ttelsesproces
  lige fra du sendte din ans\u00f8gning til du havde din f\u00f8rste dag i dit nye
  job?\\\", som blev omformuleret til \\\"Kan du beskrive rekrutteringsprocessen lige
  fra du sendte din ans\u00f8gning til du fik afslag?\\\" P\u00e5 den m\u00e5de er
  det de samme emner, der bliver ber\u00f8rt, og derfor er svarene sammenlignelige.\\n\\n126.96.36.199
  Fokusgruppe\\n\\nFor at samle alle tr\u00e5de sammen afsluttede jeg min kontakt
  med RHP med et fokusgruppe interview. Meningen var, at alle kontaktpersonerne skulle
  v\u00e6re til stede, da resultaterne af unders\u00f8gelserne skulle freml\u00e6gges.
  Jeg havde allerede fremlagt agendaen samt understreget form\u00e5let med dette m\u00f8de
  tidligt i projektforl\u00f8bet. Form\u00e5let med fokusgruppen var at freml\u00e6gge
  resultaterne fra unders\u00f8gelsen og derved f\u00e5 input til, hvordan virksomheden
  i praksis ville h\u00e5ndtere resultatet. Det var dog kun Iben Munck Adamsen (Ledelseskonsulent
  og repr\u00e6sentant for RH), Louise Berg (Chefkonsulent og repr\u00e6sentant for
  RHP), der kunne deltage ved m\u00f8det. Det ville have v\u00e6ret givende, at Ulla
  Branner Jespersen (Udviklingschef og repr\u00e6sentant for RHP) ogs\u00e5 deltog
  ved m\u00f8det, da jeg forstiller mig, at hun besidder en viden, som de to andre
  ikke har.\\n\\nDe forslag p\u00e5 en implementeringsplan, som repr\u00e6sentanterne
  fra Region Hovedstaden og RHP kom med, virkede desv\u00e6rre ikke seri\u00f8se og
  p\u00e5 forberedt. Repr\u00e6sentanten for Regionhovedstaden Hovedstaden var mere
  overrasket over nogle af de \\\"d\u00e5rlige\\\" resultater end repr\u00e6sentanten
  fra RHP, der udm\u00e6rket var klar over faldgruberne. L\u00f8sningsforslagene fra
  RHP''s repr\u00e6sentant l\u00f8d som f\u00f8lgende: \\\"Lad os tage de lavt h\u00e6ngende
  frugter\\\" og \\\"Vi kan freml\u00e6gge vores v\u00e6rdier til den \u00e5rlige
  julefrokost\\\" (Berg, Chefkonsulent og repr\u00e6sentant for RHP)\\n\\nDet var
  desv\u00e6rre ikke et s\u00e6rligt konstruktivt m\u00f8de. Dette skyldes nok, at
  jeg skulle havde sendt resultatet p\u00e5 forh\u00e5nd, s\u00e5 der var mulighed
  for, at repr\u00e6sentanterne fra RHP kunne komme med gennemt\u00e6nkte bud p\u00e5
  implementeringer i praksis. Det er dog ikke sikkert, at dette havde hjulpet, da
  det ikke virkede som om, der var den store interesse for unders\u00f8gelsen samt
  udarbejdelsen af denne rapport fra RHP''s, side. Under hele forl\u00f8bet har v\u00e6ret
  vist mest interesse fra Region Hovedstandens repr\u00e6sentant.\\n\\n3.2.2 Meningskondensering
  samt fortolkning\\n\\nDa den valgte metode til dataindsamling er kvalitativ, kan
  datam\u00e6ngden forekomme uoverskuelig og sv\u00e6rt sammenlignelig, og derfor
  benyttes meningskondensering, hvis form\u00e5l er at hive de centrale temaer ud
  af konteksten, s\u00e5 de bliver overskuelige og dermed sammenlignelige (Kvale &
  Brinkmann, 2009, s. 228). For at benytte meningskondensering til analysemetode skal
  data igennem fem stadier. De fem stadier har til\\n\\nform\u00e5l er at reducere
  lange udsagn til kortfattede formuleringer. Meningskondensering er et godt v\u00e6rkt\u00f8j
  til at analysere komplekse og omfattende interviews (Kvale & Brinkmann, 2009 s.
  228) s\u00e5som dem, der er gennemf\u00f8rt i forbindelse med udarbejdelsen af denne
  afhandling. De fem stadier er f\u00f8lgende:\\n\\n1. L\u00e6s (lyt) hele interviewet
  igennem for at f\u00e5 en fornemmelse af helheden.\\n2. Inddel interviewet i naturlige
  meningsenheder.\\n3. Omformulering af temaet til en s\u00e5 enkel form som muligt.\\n4.
  Stille sp\u00f8rgsm\u00e5l til meningsenheder ud fra unders\u00f8gelsens hovedform\u00e5l.\\n5.
  De v\u00e6sentligste temaer i interviewet bliver sammenfattet til et deskriptivt
  udsagn, alts\u00e5 en samlet fortolkning af meningsenhederne (Kvale & Brinkmann,
  2009, s. 228)\\n\\nMeningskondenseringen af interviewene er vedlagt som bilag 4,
  og i figur 3.1 et eksempel p\u00e5, hvordan det vil fremg\u00e5.\\n\\nAf bilaget
  vil de centrale temaer fremst\u00e5 p\u00e5 f\u00f8lgende m\u00e5de:\\n\\n1. Inden
  du s\u00e5 en evt. annonce, havde du h\u00f8rt om virksomheden?\\n* Jeg kom fra
  somatikken.\\n* Jeg havde ingen ting h\u00f8rt.\\n* F\u00f8rst s\u00e5 jeg en annonce
  p\u00e5 en stilling, men den fik jeg ikke. Efterf\u00f8lgende blev jeg anbefalet
  at s\u00f8ge denne stilling jeg er i nu.\\n\\n* Er de knaldende sk\u00f8re, og har
  de ingen ressourcer?\\n* Det overordnede indtryk var, at psykiatrien havde f\u00e5et
  en vitaminindspr\u00f8jtning, og at det havde v\u00e6ret et indsatsomr\u00e5de.\\n*
  M\u00f8dte Peter Treufeldt fra direktionen og andre ledere som vakte min interesse,
  da de var nogle sp\u00e6ndende mennesker.\\n\\nFigur nr. 3.1 Meningskondensering
  af interview, udarbejdet efter Kvale & Brinkmann, 2009. Se bilag 4.\\n\\nDe er opstillet
  p\u00e5 denne m\u00e5de for at skabe overblik for l\u00e6serne og bliver fremstillet
  igennem hele kapitel 4, der omhandler pr\u00e6sentation af de indsamlede data.\\n\\n3.3
  Videnskabens hellige treenighed\\n\\nFor at kunne vurdere trov\u00e6rdigheden, styrken
  og overf\u00f8rbarheden af afhandlingens konklusion til praksis skal der ses lidt
  n\u00e6rmere p\u00e5 generaliserbarheden samt grad af validitet og reliabiliteten.
  \\\"Begreberne generaliserbarhed, reliabilitet og validitet har efterh\u00e5nden
  opn\u00e5et status som videnskabelig, hellig treenighed i moderne samfundsvidenskab.
  De synes at tilh\u00f8re et abstrakt omr\u00e5de i en videnskabelig helligdom, fjernt
  fra dagligdagens interaktioner, og de tilbedes med respekt af alle sande tilh\u00e6ngere
  af videnskaben\\\" (Kvale, 1997, s. 225).\\n\\n3.3.1 Generaliserbarhed\\n\\nGeneraliserbarhed
  er et udtryk for, hvor repr\u00e6sentative konklusioner er, baseret p\u00e5 et begr\u00e6nset
  erfaringsgrundlag. For at f\u00e5 en h\u00f8j grad af generaliserbarhed skal der
  udarbejdes en grundigt og dybtg\u00e5ende beskrivelse af casestudiet for derefter
  at benytte en induktiv metode (observans af at et tilf\u00e6lde f\u00f8rer til generel
  viden) (Andersen, 2005, s. 115). Da det vurderes, at casestudiet er beskrevet grundigt
  og i dybden igennem hele afhandlingen, burde generaliserbarheden v\u00e6re h\u00f8j.
  Det kan dog diskuteres, hvorvidt konklusionen p\u00e5 baggrund af unders\u00f8gelsen
  i denne afhandling, skal betragtes som den endelige sandhed og dermed har en h\u00f8j
  grad af generaliserbarhed. Kan en unders\u00f8gelse best\u00e5ende af 15kvalitative
  interviews, repr\u00e6sentere 4.710 medarbejders holdning? Ud fra det videnskabelige
  perspektiv, der till\u00e6gges denne afhandling, som er socialkonstruktivisme (beskrivelse
  og argumentation, for dette vil blive gennemg\u00e5et senere i kapitlet), siges
  det, at verden er foranderlig og intet kan generaliseres (Ebdrup, 2011).\\n\\nDa
  fordelingen af de interviewede repr\u00e6sentanter fra de forskellige centre ikke
  er repr\u00e6sentativt fordelt (der er for eksempel ikke udf\u00f8rt interviews,
  der kan repr\u00e6sentere en vurdering omhandlende rekrutteringsprocessen for Bornholm),
  vil resultatet blive pr\u00e6get deraf. Da der samtidig var stor forskel p\u00e5
  stemningen fra center til center, vurderes generaliserbarheden igen til at v\u00e6re
  lille. At generaliserbarheden vurderes til at v\u00e6re lav, m\u00e5 siges at v\u00e6re
  mods\u00e6tning til den stillede problemformulering og det vurderes, at konklusion
  i denne afhandling vil v\u00e6re en ud af mange - en sandhed ud af mange.\\n\\nDet
  vurderes, at denne afhandlings kvalitative unders\u00f8gelser, som er udarbejdet
  p\u00e5 et grundlag af 15 interviews, h\u00f8rer ind under den analytiske generalisering,
  der kan betegnes som et realitets check, hvor det unders\u00f8ges i hvor h\u00f8j
  grad den erfarede virkelighed (respondenternes oplevelser) stemmer overens med teorierne
  omhandlende employer branding - afhandlingens udgangspunkt (Kvale & Brikmann, 2009,
  s. 289).\\n\\nDet er i den sidste ende ikke sp\u00f8rgsm\u00e5l om resultatet af
  unders\u00f8gelserne, der ligger til grund for den forst\u00e5ende analyse kan generaliseres,
  men mere et sp\u00f8rgsm\u00e5l om, hvor holdbare/valide unders\u00f8gelserne og
  dermed resultatet er.\\n\\n3.3.2 Validitet og reliabilitet\\n\\nValidering er kvaliteten
  af interviewerens kompetencer til at indhente den n\u00f8dvendige information. \\\"At
  validere er at kontrollere\\\" (Kvale & Brikmann, 2009, s. 276). Desuden d\u00e6kker
  validering over to begreber, nemlig gyldighed og relevans. Gyldighed siger noget
  om den generelle overensstemmelse mellem den teoretiske og empiriske begrebsplan.
  Relevansen siger noget om, hvor relevant det empiriske begrebs/variabeludvalg er
  for problemformuleringen (Andersen, 2009, s. 81).\\n\\nFor at kontrollere kvaliteten
  af den udarbejdede sp\u00f8rgeramme, blev der gennemf\u00f8rt et pilotinterview.
  Pilotinterviewet havde til form\u00e5l at teste, hvordan deltagerne af unders\u00f8gelsen
  opfattede sp\u00f8rgsm\u00e5lene samt at teste for mangler \u2013 kom jeg som interviewer
  rundt om alle de ting, som var vigtige for min forst\u00e5ende analyse? P\u00e5
  den m\u00e5de testede jeg mine kompetencer som interviewer og p\u00e5 den baggrund
  vurderes det, at validiteten er h\u00f8j. Det vurderes yderligere, at validiteten
  er h\u00f8j, hvis der ses n\u00e6rmere p\u00e5 gyldigheden og relevansen af den
  indsamlet empiri, der er en h\u00f8j grad af sammenh\u00e6ng mellem det teoretiske
  og empiriske begrebsplan. Begrundelsen for dette er, at teorien er valgt p\u00e5
  baggrund af problemformuleringen, og at sp\u00f8rgerammen er udarbejdet p\u00e5
  baggrund af teorien.\\n\\n\\\"Reliabilitet vedr\u00f8rer konsistensen og trov\u00e6rdigheden
  af forskningsresultater\\\" (Kvale & Brikmann, 2009, s. 267). Reliabilitet kan overs\u00e6ttes
  til p\u00e5lidelighed og omhandler i hvor h\u00f8j grad, resultatet af en m\u00e5lemetode
  bliver p\u00e5virket af tilf\u00e6ldigheder (Andersen, 2005, s. 81).\\n\\nDa metoden
  bygger p\u00e5 en genfort\u00e6lling af deltagernes oplevelser under rekrutteringsprocessen,
  er hukommelsen hos deltagerne en faktor, der kan p\u00e5virke resultatet. Hukommelsen
  hos de interviewede kan spille et puds, men da alle deltagere har v\u00e6ret rekrutteringsprocessen
  igennem inden for et halvt \u00e5r forud for interviewene samtidig med, at alle
  deltagere p\u00e5 forh\u00e5nd var blevet informeret om det ovenst\u00e5ende emne
  (her menes rekrutteringsprocessen, da begrebet employer branding anses som et fagudtryk
  og dermed er fremmed for mange), vurderes det, at der ikke forekommer de store m\u00e6ngder
  af fejl/mangler/st\u00f8j i resultatet af interviewene. Desuden er der risiko for,
  at deltagernes generelle hum\u00f8r kan p\u00e5virke resultatet. Dette er der kommet
  et eksempel p\u00e5 tidligere i kapitlet under det delvist strukturerede interview.
  En sidste faktor, der kan p\u00e5virke reliabiliteten i denne afhandling, som er
  v\u00e6rd at n\u00e6vne, er analysemetoden som er meningskondensering. Ved brug
  af denne metode er der risiko for, at jeg som forsker kan komme til at overse en
  god pointe ved dannelsen af meningsenhederne. Men da det er mig selv der har udf\u00f8rt
  alle interviews samt lavet alt arbejdet med meningskondensering, vurderes det, at
  denne risiko er mindre end, hvis det var to eller flere studerende, der havde udarbejdet
  denne afhandling. P\u00e5 baggrund af dette vurderes det, at validiteten og reliabiliteten
  af denne afhandling er i den h\u00f8je ende.\\n\\n3.4 Videnskabsteori\\n\\nForm\u00e5let
  med afsnittet om videnskabsteori er, at det skal klarl\u00e6gge, hvordan verden
  antages at se ud, og hvordan viden skabes ud fra den valgte teori (Nygaard, 2005,
  s. 128). Derfor vil der i nedenst\u00e5ende blive redegjort for denne afhandlings
  videnskabsteoretiske st\u00e5sted. Det videnskabsteoretiske st\u00e5sted har til
  form\u00e5l, at definere forst\u00e5elsesrammen samt de grundl\u00e6gende antagelser
  vedr\u00f8rende verdensopfattelsen og meningsskabelsen, der ligger til grund for
  denne afhandling.\\n\\nDa det i kapitel 2 er blevet understeget, at et brand (herunder
  ogs\u00e5 employer brand) anses for at v\u00e6re dynamisk og under konstant p\u00e5virkning
  af for eksempel kultur og sociale kontekster, s\u00e5som medieomtale og virksomhedens
  interne og eksterne branding/kommunikation. Og da der tidligere i dette kapitel
  er redegjort for, at den anvendte metodiske tilgang ikke l\u00e6gger op til en endegyldig
  (l\u00f8sning) sandhed, udspringer inspirationen af en socialkonstruktivistisk tankegang
  samt en hermeneutisk analyseform.\\n\\n3.4.1 Socialkonstruktivisme\\n\\nDen socialkonstruktivistiske
  tankegang siger, at der ikke findes en sandhed, men at det er udgangspunktet (perspektivet),
  der bestemmer hvad konklusionen er, og intet derved kan generaliseres;\\n\\n\\\"Der
  findes nemlig ikke et universelt og objektivt udgangspunkt, hvorfra vi kan f\u00e6lde
  en endelig sandhedsdom. Derimod vil der altid v\u00e6re flere perspektiver p\u00e5
  en sag\\\" (Ebdrup, 2011/ Jensen, T., W.)\\n\\nDesuden siger socialkonstruktivismen,
  at virkeligheden er en social konstruktion samt, at det er en konstant s\u00f8gen
  efter ny viden, da videnskabens svar ikke er endelige men hele tiden skal tilpasses
  (Wenneberg, 2002). Dette er i fin overensstemmelse med synet p\u00e5 (employer)
  brandet, som ogs\u00e5 konstant skal tilpasses, og resultatet af et (employer) brand
  gerne skulle baseres p\u00e5 baggrund af sociale konstruktioner. Den sociale konstruktion,
  der er mellem deltagerne i unders\u00f8gelsen og RHP, er netop det unders\u00f8gelsen
  skal klarl\u00e6gge. Konsekvensen af at socialkonstruktivismen ser virkeligheden
  som en social konstruktion er, at muligheden for en objektiv viden forkastes (www.denstoredanske.dk).
  Da jeg opfatter naturvidenskaben som objektiv viden, till\u00e6gger jeg en moderat
  tilgang til dette perspektiv, hvor jeg ser min konklusion som \u00e8n l\u00f8sning
  ud af mange l\u00f8sninger.\\n\\nCollin har inddelt socialkonstruktivismen i 4 hovedparadigmer,
  hvoraf perspektivet i denne afhandling l\u00e6gger sig op af erkendelsesteoretisk
  konstruktivisme i en samfundsm\u00e6ssig virkelighed (Jacobsen et al, 2012 s. 337).\\n\\nSocialkonstruktivisme
  handler med andre ord om relationen mellem mennesker, hvilken efter min vurdering
  h\u00e6nger sammen med servicesektoren, som er komplekst sammensat. Hos RHP arbejdes
  der ud fra relationer mellem personalet p\u00e5 den ene side og klienterne og deres
  p\u00e5r\u00f8rende p\u00e5 den anden side (Mosley, 2007).\\n\\n3.4.2 Hermeneutik
  som analyseform\\n\\nTil at fortolke samt analysere de kvalitative data benyttes
  en hermeneutisk analyseform, som i dagligtale bliver kaldt for fortolkningens kunst
  (Jacobsen, 2012 s. 218). Hermeneutik betyder fortolkning, og er som analyseform
  en synsvinkel, hvorfra man kan anskue den sociale virkelighed (Fuglesang et al,
  2013 s. 291/ H\u00f8jberg). Hensigten med hermeneutikken er, at den mening, som
  deltageren af interviewet freml\u00e6gger i selve interviewet, bliver forst\u00e5elig
  ved hj\u00e6lp af fortolkning og eventuelt overs\u00e6ttelse til et alment tilg\u00e6ngeligt
  sprog (Jacobsen, 2012 s. 218). Dette er i fin overensstemmelse med brugen af meningskondenseringen,
  som skal hj\u00e6lpe til med at forsimple udsagnene fra interviewet og dermed overs\u00e6tte
  dem i et sprog, der giver sammenh\u00e6ng med denne afhandlings tema \u2013 alts\u00e5
  en fortolkning og overs\u00e6ttelse til et alment forst\u00e5eligt sprog for m\u00e5lgruppen
  af denne afhandling. Desuden sker fortolkning af interviewene via hermeneutisk tilgang
  ogs\u00e5 i overensstemmelse med den socialkonstruktivistiske \u00e5nd, hvor det
  pointeres, at der er mange m\u00e5der at forst\u00e5 en kontekst p\u00e5 (Kvale
  & Brinkmann, 2009, s. 234).\\n\\n\\\"Fordelen ved forst\u00e5ende og fortolkende
  tilgange er, at man kommer t\u00e6ttere p\u00e5 den sociale virkelighed, som man
  studerer, ved at tage udgangspunkt i de involverede personers egen forst\u00e5else
  og fortolkning i stedet for at se deres holdninger og handlinger gennem pr\u00e6fabrikerede
  modeller over samfundsm\u00e6ssige lovm\u00e6ssighed\\\" (Jacobsen et al, 2012,
  s. 216). Ved ovenst\u00e5ende citat ses det, at der er en klar fordel ved at benytte
  hermeneutik som analyseform, nemlig at det giver mig som forsker en mulighed for
  at komme t\u00e6ttere p\u00e5 den sociale virkelighed og dermed opn\u00e5 en dybere
  forst\u00e5else af deltagerne ved interviewene, samt meningsskabelse omkring rekrutteringsprocessen.
  Denne metode kan hj\u00e6lpe med forst\u00e5elsen og fortolkningen af RHP''s nuv\u00e6rende
  rekrutteringsproces samt den effekt, den har p\u00e5 employer brandet, og hvor der
  skal s\u00e6ttes ind i forhold til en optimering heraf.\\n\\n188.8.131.52 Den hermeneutiske
  cirkel\\n\\nVed indsamlingen, analysen samt fortolkningen af de kvalitative data,
  skal jeg som forsker af denne afhandling v\u00e6re s\u00e5 \u00e5ben som muligt
  for p\u00e5 den m\u00e5de at opfange og videregive vigtige og relevante nuancer
  i de informationer, der kommer frem via interviewene.\\n\\nKvale (1984) skelner
  imellem tre tolkningsniveauer ved udforskningen af personers livsverden; tolkning
  af den udforskedes selvforst\u00e5else, unders\u00f8gerens common-sense tolkning
  og unders\u00f8gerens teoretiske tolkning (Andersen, 2005, s. 198), hvoraf det er
  sidstn\u00e6vnte metode, der benyttes i denne afhandling, da det er fagbegreberne,
  der skal benyttes til analysen.\\n\\nFortolkningsprocessen skal ses som et fors\u00f8g
  p\u00e5 at forst\u00e5 deltagernes livsverden, og dette sker via en fremadskridende
  dialog (interview), hvor alle parter gradvist \u00e6ndrer gensidig forst\u00e5else
  for hinandens livsverden, hvilket sker ved at fordomme elimineres. Fortolkningsprocessen
  kan ses i figur nr. 3.2 nedenfor (Andersen, 2005, s.198/Andersen, 1994, s. 173).\\n\\nSom
  det er vist i figuren ovenfor, opst\u00e5r fortolkningsprocessen ved at arbejde
  sig ned igennem figuren eller dele af den adskillige gange i takt med, at tolkningsprocessen
  skrider fremad. Cirklen skal hermed forst\u00e5s som en uf\u00e6rdig proces. I forhold
  til fortolkningsprocessen af denne afhandling betyder det, at arbejdsgangen for
  eksempel er p\u00e5 f\u00f8lgende m\u00e5de: Alle parter fortolker p\u00e5 interviewet
  umiddelbart efterf\u00f8lgende, ny forst\u00e5elsesramme opst\u00e5r og dermed en
  evt. ny fortolkning, forskere lytter dialogen igennem igen, fortolker p\u00e5 ny,
  m\u00e5ske opst\u00e5r en ny forst\u00e5elsesramme og dermed en ny fortolkning.
  Denne arbejdsgang stemmer overens med arbejdsmetoden ved brug af meningskondensering,
  som jo benyttes til bearbejdning af de kvalitative data. Det resultat, der er opst\u00e5et
  med udgangspunkt i en hermeneutisk tilgang, ses som v\u00e6rende midlertidig, og
  dermed er det i fin overensstemmelse med synet p\u00e5 (employer) brandet, som anses
  for at v\u00e6re dynamisk.\\n\\n3.5 Valg af teoretikere\\n\\nFor at tage udgangspunkt
  i teorien om afhandlingens omdrejningspunkt, employer branding, har jeg valgt at
  kigge p\u00e5 tre teorier. F\u00f8rst Backhaus og Tikoo (2004), hvis teori anses
  for at v\u00e6re fundamentet i employer branding teorien og belyser, hvordan employer
  brandet p\u00e5virker eller p\u00e5virkes af omkring liggende elementer. Teoriens
  kritik g\u00e5r p\u00e5 manglende sammenh\u00e6ng mellem de interne og eksterne
  aktiviteter, der er med til at opbygge employer brandet.  Mosley''s (2007) teori
  tager udgangspunkt i servicesektoren, hvilket er i overensstemmelse med RHP. Foster
  et al (2010)`s udgangspunkt er ogs\u00e5 servicesektoren, hvor det belyses, hvordan
  forskellige interaktioner internt i virksomheden p\u00e5virker opfattelsen af employer
  brandet eksternt for virksomheden.\\n\\nSom afrunding benyttes Seldorf (2008), da
  hendes teori beskriver de dimensioner, som employer brandet best\u00e5r af, og som
  analysen bliver bygget op omkring.\\n\\nDesuden benyttes Wilden et al''s (2010)
  teori til employer branding equity. Begrundelsen for at benytte disse teorier er,
  at de efter min mening bygger oven p\u00e5 hinanden, og p\u00e5 den m\u00e5de kommer
  jeg hele vejen rundt om de elementer, der er ved et employer brand, som jeg vurderer
  vil give et brugbart svar til RHP. Men da indgangsvinklen er socialkonstruktivistisk,
  og jeg ser konklusionen p\u00e5 denne afhandling som en af mange sandheder, kunne
  man nemt argumentere for inddragelse af andre teorier som for eksempel motivationsteori.
  Her kunne man evt. benytte Helle Hededam Hein, hvis unders\u00f8gelse omfatter motivation
  af h\u00f8jt specialerede kreative medarbejdere, som omfatter sygeplejersker. Men
  p\u00e5 grund af begr\u00e6nsninger i afhandlingens omfang ikke bliver inddraget.\\n\\n3.6
  Opsummering\\n\\nIgennem dette kapitel er der redegjort for, at den benyttede metode
  til dataindsamling er kvalitativ. Begrundelsen herfor er blandt andet, at metoden
  er benyttet ved udarbejdelsen af teorierne om employer branding. Fordele og ulemper
  herved er gennemg\u00e5et ved de forskellige benyttede interviewformer. Da m\u00e6ngden
  ved brug af kvalitative data er kompleks og enorm, vil der blive benyttet meningskondensering
  til behandling heraf. P\u00e5 den m\u00e5de vil meningsenheder blive fremh\u00e6vet,
  og derved vil arbejdet med analysen samt selve analysen bliver mere overskuelig.\\n\\nDer
  er augmenteret for en lav gereraliserbarhed ved den forest\u00e5ende konklusion,
  der skal dannes p\u00e5 baggrund af de kvalitative data. Validiteten vurderes dog
  til at v\u00e6re h\u00f8j, mens realiabiliteten vurderes til at v\u00e6re i den
  h\u00f8je ende. Dette er i overensstemmelse med, at afhandlingen skal ses ud fra
  et socialkonstruktivistisk perspektiv, hvor det anses, at en fortolkning skal ses
  som \u00e9n sandhed ud af mange. Hertil argumenteres der for brugen af hermeneutik
  som analyseform, hvoraf den hermeneutiske cirkel benyttes som fortolkningsproces,
  hvilket er i overensstemmelse med brugen af samt arbejdsgangen i meningskondensering.
  Igennem hele kapitlet bliver der augmenteret for, hvordan de forskellige elementer,
  som dette kapitel er opbygget omkring, h\u00e6nger sammen og betydningen heraf.
  Desuden bliver sammenh\u00e6ngen ogs\u00e5 koblet sammen med den overordnede teori
  om (employer) branding.\\n\\nKapitlet afsluttes med argumentering for brug af de
  grundl\u00e6ggende teorier, der er pr\u00e6senteret i kapitel 2.\\n\\n4 Pr\u00e6sentation
  af den indsamlede data\\n\\n4.1 Introduktion\\n\\nI det f\u00f8lgende kapitel vil
  de indsamlede data blive pr\u00e6senteret og analyseret med udgangspunkt i det teoretiske
  fundament, som blev pr\u00e6senteret i kapitel 2.  Dette betyder, at kapitlet er
  opbygget med inspiration fra det skema, som var en del af konklusionen i kapitel
  2. Strukturen i dette kapitel er dermed som f\u00f8lger: F\u00f8rst vil RHP''s identitet
  blive pr\u00e6senteret ud fra et medarbejderperspektiv, som er tilkendegjort via
  den kvalitative dataindsamling. Dern\u00e6st bliver medarbejdernes syn p\u00e5 i,
  hvilken grad RHP''s profil, dermed menes i hvilken grad virksomhedens v\u00e6rdigrundlag
  og visioner er inkorporeret i hverdagen. Efterf\u00f8lgende bliver RHP''s image
  beskrevet ud fra den opfattelse samt det indtryk, som medarbejderne havde af virksomheden,
  inden ans\u00e6ttelsen tr\u00e5dte i kraft. Herefter bliver der set n\u00e6rmere
  p\u00e5, i hvilken grad de tre dimensioner bliver inkorporeret i rekrutteringsprocessen.
  Her vil der blive sat fokus p\u00e5, hvor RHP rammer rigtigt, og hvor de falder
  igennem i forhold til de tre dimensioner, der er grundelementerne i et employer
  brand samt i hvilken grad, RHP form\u00e5r at brande sig internt og eksternt. Til
  sidst bliver der endvidere set n\u00e6rmere p\u00e5 RHP\u00b4s evne til at g\u00f8re
  arbejdspladsen identificerbar og differentiere arbejdspladsens profil, image og
  identitet fra konkurrenterne.\\n\\n4.2 Virksomhedens identitet \u2013 medarbejdernes
  opfattelse af RHP\\n\\nSom det er pointeret ud fra det teoretiske grundlag, der
  er gennemg\u00e5et i kapitel 2, har virksomhedens identitet medindflydelse p\u00e5
  employer brand loyalitet og dermed er det med til at p\u00e5virke virksomhedens
  evne til at tiltr\u00e6kke employers of choice. Brand loyalitet p\u00e5virker produktivitetsniveauet,
  hvilket er en af faktorerne, der er opstillet for at opn\u00e5 succes med employer
  branding strategien. Det er kun svarene fra 13 af deltagerne i unders\u00f8gelsen,
  der ligger til grund for vurderingen af virksomhedens identitet, da de sidste to
  deltagere ikke er ansat i virksomheden og dermed ikke kan bidrage her. Der er tre
  begreber, der g\u00e5r igen hos st\u00f8rstedelen af deltagerne i unders\u00f8gelsen,
  og det er (tv\u00e6r)faglighed, uddannelse/udvikling og kommunikation.\\n\\n4.2.1
  Faglighed\\n\\nDer er 11 deltagere i unders\u00f8gelsen, der n\u00e6vner (tv\u00e6r)faglighed
  i en positiv vending. De 11 medarbejdere repr\u00e6senterer alle de centre, der
  er repr\u00e6senteret i unders\u00f8gelsen. Medarbejderne vurderer, at der hersker
  en\\n\\nh\u00f8j grad af faglighed p\u00e5 arbejdspladsen, b\u00e5de inden for de
  enkelte faggrupper og p\u00e5 tv\u00e6rs af faggrupperne, og det er noget, der bliver
  v\u00e6rdsat. En medarbejder svarer f\u00f8lgende p\u00e5 sp\u00f8rgsm\u00e5let
  om, hvad hun allerbedst kan lide ved sin arbejdsplads; \\\" der er risiko for, at
  nogle patienter reagerer voldsomt, og derfor er det vigtigt, at der skabes gode
  relationer til dem og kollegaerne imellem. Her er fagligheden i h\u00f8js\u00e6det
  p\u00e5 alle niveauer, og det g\u00f8r tilgangen til b\u00e5de patienter og kollegaer
  meget nemmere\\\" (bilag 4, M8). En anden medarbejder underbygger denne holdning
  med udtalelsen; \\\"Det er vigtigt med et f\u00e6lles sprog, da der skal v\u00e6re
  tillid mellem medarbejderne i tilf\u00e6lde af, at der skulle opst\u00e5 en tilspidset
  situation med en patient. Og det kommer der igennem en h\u00f8j faglighed. Men kommunikationen
  skal v\u00e6re i orden b\u00e5de mellem kollegaer og til patienterne\\\" (bilag
  4, M13).\\n\\nUd fra disse udtalelser ses det, at det h\u00f8je faglige niveau,
  som medarbejderne vurderer, at der hersker i virksomheden, er grobunden for god
  kommunikation. Begrundelsen for dette er, at fagligheden g\u00f8r, at de taler samme
  sprog og dermed skaber forst\u00e5else for hinanden. P\u00e5 baggrund af dette vurderes
  det, at der er en sammenh\u00e6ng mellem faglighed og kommunikationen internt i
  virksomheden, hvilket giver mening, da flere deltagere i unders\u00f8gelsen pointerer,
  at der forekommer meget tv\u00e6rfagligt arbejde i dagligdagen og at der i denne
  proces naturligt vil forekomme kommunikation mellem medarbejderne og til dels ogs\u00e5
  mellem patienterne. Da faglighed er en del af v\u00e6rdiggrundlaget, anses denne
  v\u00e6rdi for at v\u00e6re inkorporeret i hverdagen ude p\u00e5 Centrene.\\n\\n4.2.2
  Kommunikation\\n\\nDet andet begreb, der af deltagerne i unders\u00f8gelsen forbindes
  med RHP''s identitet, er kommunikation. At det lige netop er kommunikation, som
  deltagerne anser for at v\u00e6re en del af virksomhedens identitet, vurderes til
  at v\u00e6re i tr\u00e5d med fagomr\u00e5det psykiatri. 9 ud af 13 deltagere i unders\u00f8gelsen
  n\u00e6vner kommunikation som v\u00e6rende en del af hverdagen og flere n\u00e6vner,
  at det var en af grundene til, at de ville arbejde inden for psykiatrien. En deltager
  udtaler sig s\u00e5ledes om kommunikation; \\\"Der er plads til at kommunikere b\u00e5de
  med patienterne og kollegerne i mellem, hvilket er vigtigt for at opn\u00e5 den
  rette behandling\\\" (bilag 4, M3). Men ikke alle deltagere i unders\u00f8gelsen
  ser lige positivt p\u00e5 graden af kommunikation. En medarbejder, der kommer fra
  et speciale i somatikken, udtaler s\u00e5ledes om kommunikationen i virksomheden:
  \\\"Her f\u00e5r man ikke sk\u00e6ldud, hvis man g\u00f8r noget forkert, her snakker
  vi om tingene. Vi snakker om ALT, ja nogle gange snakker vi n\u00e6rmest tingene
  ihjel. Alt skal lige snakkes igennem, inden vi g\u00f8r noget som helst, om det
  s\u00e5 er noget s\u00e5 simpelt som booking af et m\u00f8delokale eller meget relevant,
  behandlingen af en patient\\\" (bilag 4, M1). Medarbejderne her synes alts\u00e5,
  at kommunikationen kan tage lidt overh\u00e5nd, men de kan stadig se det i et positivt
  lys, da hun senere i interviewet svarer p\u00e5 sp\u00f8rgsm\u00e5let om, hvad hun
  allerbedst kan lide ved sin arbejdsplads: \\\" Kommunikationen er med til at s\u00e6tte
  mennesket er i centrum og derfor er jeg sikker p\u00e5, at\\n\\nde (kollegaerne)
  griber mig, hvis jeg er ved at falde, og det kommer jeg helt sikkert til p\u00e5
  et tidspunkt\\\" (Ibid.). Denne udtalelse kan tolkes som, at kommunikationen medarbejderne
  imellem opfattes som et redskab til at opn\u00e5 virksomhedens v\u00e6rdigrundlag,
  \\\"med mennesket i centrum\\\".\\n\\nBilledet er et lidt et andet, hvis man ser
  p\u00e5 kommunikationen mellem centrene (medarbejderne) og Kristineberg. Tre deltagere
  fort\u00e6ller om, hvordan der bliver sat fokus p\u00e5 bestemte omr\u00e5der, n\u00e5r
  ''dem inde p\u00e5 Kristineberg'' vil have indf\u00f8rt noget nyt, at fokusset forsvinder
  igen sammen med Kristinebergs fokus p\u00e5 omr\u00e5det. N\u00e5r deltagerne benytter
  termen ''dem inde p\u00e5 Kristineberg'', tolkes det som om, der er en vis distance
  mellem medarbejderne p\u00e5 centrene og det administrative personale, der har deres
  dagligdag p\u00e5 Kristineberg p\u00e5 \u00d8sterbro. En deltager fort\u00e6ller
  om, hvordan der fra Kristineberg var rettet fokus p\u00e5 et projekt, der omhandlede
  en bestemt arbejdsgang. Her kom repr\u00e6sentanter ud p\u00e5 centret for at deltage
  ved m\u00f8der omhandlende det nye tiltag i arbejdsgangen, men s\u00e5 snart repr\u00e6sentanterne
  overlod projektet til centret, forsvandt fokus fra omr\u00e5det. P\u00e5 baggrund
  af denne og to tilsvarende historier vurderes det, at kommunikationen fra ledelsen
  og ned til medarbejderne (top down) ikke er optimal. Der forekommer en distance
  mellem de to parter og det vurderes at ligge til grund for den til tider knap s\u00e5
  optimale kommunikation. En medarbejder udtaler: \\\"Ja, jeg kender godt de der v\u00e6rdier,
  og hvem er ikke enige i dem. Problemet er bare, at det jo bare er nogle smarte og
  fluffy ord, de har fundet p\u00e5 inde p\u00e5 Kristineberg. Der er ingen substans
  i dem\\\" (bilag 4, M3). Ved denne udtalelse tydeligg\u00f8res f\u00f8lelsen af
  distancen mellem den p\u00e5g\u00e6ldende medarbejder og ''dem inde p\u00e5 Kristineberg''.\\n\\n4.2.3
  Udvikling/uddannelse\\n\\nAt deltagerne i unders\u00f8gelsen ser RHP som en virksomhede
  med et h\u00f8jt fagligt niveau, k\u00e6des i interviewene ofte sammen med mulighederne
  for videreuddannelse. Det konkluderes, at medarbejderne ser v\u00e6rdien udvikling
  som v\u00e6rende de uddannelsesmuligheder, som virksomheden tilbyder medarbejderne.
  Dermed har begrebet en lidt anden betydning for deltagerne af denne afhandlings
  unders\u00f8gelse, end det som v\u00e6rdiambassad\u00f8rerne till\u00e6gger begrebet
  udvikling. V\u00e6rdiambassad\u00f8rernes tolkning af v\u00e6rdien udvikling, er
  at t\u00e6nke nyt og pr\u00f8ve nye metoder af i overensstemmelse med feedback fra
  patienter og p\u00e5r\u00f8rende. V\u00e6rdien udvikling beskrives i v\u00e6rdigrundlaget
  som en handlem\u00e5de, der blandt andet opn\u00e5s ved, at medarbejderne yder en
  indsats. I V\u00e6rdigrundlaget st\u00e5r der s\u00e5ledes; \\\"Medarbejderne orienterer
  sig uden for Psykiatrien, er nysgerrige og finder l\u00f8sninger p\u00e5 de udfordringer
  de m\u00f8der\\\" (Psykiatriens v\u00e6rdigrundlag). Dermed er der tale om en handlem\u00e5de,
  der skal indfris for at opn\u00e5 denne v\u00e6rdi. Dermed er det ikke et tilbud
  om udvikling via uddannelse, som deltagerne af denne unders\u00f8gelse ellers till\u00e6gger
  stor v\u00e6rdi for virksomheden som arbejdsplads.\\n\\nHvis der er tale om, at
  medarbejderne har taget v\u00e6rdien udvikling til sig og inkorporeret den i dagligdagen,
  med en anden tolkning af begrebet end det, der var hensigten, er det en alvorlig
  brist i den interne kommunikation. Baggrunden for tolkningen af begrebet, stammer
  blandt andet fra denne udtalelse: \\\"At her er rig mulighed for udvikling b\u00e5de
  personligt men ogs\u00e5 fagligt, for der er masser af mulighed for videreuddannelse.
  Og s\u00e5 har jeg jo mulighed for at f\u00e5 nogle ansvarsomr\u00e5der p\u00e5
  sigt, og det vil jeg meget gerne have\\\" (bilag 4, M9).\\n\\nFlere af de nyuddannede
  deltagere i unders\u00f8gelsen beskriver mentorordning som en rigtig god m\u00e5de,
  at udvikle sine kompetencer lige fra starten af og ser den ogs\u00e5 som en god
  m\u00e5de, hvorp\u00e5 der bliver taget h\u00e5nd om dem og givet dem en tryghed
  i jobbet fra start af.\\n\\nAt RHP anses af medarbejderne som en arbejdsplads, hvor
  der er rig mulighed for udvikling, betyder ogs\u00e5, at der er muligheder for at
  n\u00e5 en stor faglig viden, og dermed baner det vej for forskellige karrierestier.
  Dermed differentierer Psykiatrien sig fra somatikken.\\n\\n4.2.4 Differentiering
  og identificerbar\\n\\nFor at se p\u00e5, hvor medarbejderne oplever, at RHP differentierer
  sig som arbejdsplads fra konkurrenterne, ses der n\u00e6rmere p\u00e5 svarene fra
  de tre deltagere, der kommer fra et job i den somatiske verden. De tre medarbejdere
  fremh\u00e6ver to v\u00e6sentlige punkter, hvor arbejdspladsen differentierer sig
  p\u00e5 en positiv m\u00e5de. Den f\u00f8rste deltager beskriver, at den st\u00f8rste
  forskel er at finde de muligheder, der er for, hvor langt fagligt og karrierem\u00e6ssigt
  man kan n\u00e5. Der siges f\u00f8lgende: \\\"Hvis de brander sig p\u00e5, hvor
  langt fagligt og karrierem\u00e6ssigt man kan n\u00e5 her, ville der v\u00e6re mange
  flere fra somatikken, der ville s\u00f8ge over i psykiatrien\\\" (bilag 4, M1).
  Da teorien siger, at man skal m\u00e5lrette den information, der gives til potentielle
  medarbejdere og is\u00e6r dem med tidligere erhvervserfaring, anses udtalelser som
  ovenst\u00e5ende som v\u00e6rende meget v\u00e6rdifulde.\\n\\nEn anden medarbejder
  udpeger et andet v\u00e6sentligt punkt, hvor arbejdet i RHP differentierer sig fra
  arbejdet i somatikken og udtaler s\u00e5ledes: \\\"Ved mit arbejde kan jeg allerbedst
  lide den frihed der er, og ogs\u00e5 den diversitet, der er i psykiatrien. Det er
  det, der skal brandes. For det er her den st\u00f8rste forskel er fra arbejdet i
  somatikken. Alts\u00e5, arbejdet i somatikken kan meget groft sagt ses som samleb\u00e5ndsarbejde,
  hvor de dagen lang lapper det ene eller det andet sammen p\u00e5 patienterne\\\"
  (bilag 4, M6).  Denne udtalelse anses som v\u00e6rende vigtig viden og vurderes
  som v\u00e6rende et element, der skal indg\u00e5 i employer branding strategien,
  hvis form\u00e5l er at g\u00f8re arbejdspladsen identificerbar samt, at differentiere
  den fra konkurrenterne.\\n\\n4.2.5 Forskel fra center til center\\n\\nSom tidligere
  beskrevet er de forskellige centres placering fordelt udover hele Region Hovedstaden.
  Medarbejderne har ikke det store kendskab til, hvordan de andre Centre er som arbejdsplads,
  men har kun viden om det center de selv arbejder p\u00e5 til daglig. Unders\u00f8gelsen
  til denne afhandling viser, at kun fem medarbejdere havde kendskab til, hvordan
  arbejdsforholdene var p\u00e5 andre centre, end lige det center, de var ansat p\u00e5
  nu. Viden om de andre centre havde de tilegnet sig via tidligere ans\u00e6ttelser
  og en enkelt via et praktikophold. Otte medarbejdere vidste intet om nogle af de
  andre centre. Denne oplysning tolkes som manglende netv\u00e6rk centrene i mellem,
  men det kan ogs\u00e5 skyldes, at mange af deltagerne i unders\u00f8gelsen er nyuddannede
  eller kommer fra somatikken og dermed ikke selv har opbygget netv\u00e6rk inden
  for virksomheden endnu.\\n\\nDer er stor forskel p\u00e5, hvordan opfattelsen af
  de forskellige centrer. Eksempelvis omtaler en medarbejder centret p\u00e5 Amager
  som f\u00f8lgende: \\\"Amager omtaler sig selv som et landsbyhospital, hvor der
  er masser af plads. Her er ingen stress, fordi her er f\u00e6rre patienter og flere
  ressourcer i kraft af, at der er flere senge pladser og mere personale, hvor det
  er noget helt andet p\u00e5 Bispebjerg\\\" (bilag 4, M4). Og en medarbejder p\u00e5
  Glostrup udtaler; \\\"Der er mangel p\u00e5 respekt b\u00e5de for personale og for
  patienterne. Der kan blive r\u00e5bt af patienterne, hvilket jeg ikke anser som
  en optimal arbejdsgang\\\" (bilag 4, M11). Og medarbejdere p\u00e5 Bispebjerg omtaler
  arbejdsklimaet som v\u00e6rende godt og anser arbejdspladsen som v\u00e6rende et
  sted, hvor man passer godt p\u00e5 hinanden, hvilket giver tryghed i hverdagen.
  Blandt de medarbejdere, der har viden om andre centre end det, de arbejder p\u00e5,
  n\u00e6vner flere Glostrup som v\u00e6rende en arbejdsplads med problemer. En deltager
  i unders\u00f8gelsen var fra netop dette center og udtrykte frustration over mange
  af de ting, der fungerer p\u00e5 nogle af de andre centre, men som ikke fungerer
  her. Sidstn\u00e6vnte citat udtrykker manglende kommunikation, manglende respekt
  for b\u00e5de kollegaer og patienter samt ledere, der ikke lever op til deres ansvar.
  Dette kan v\u00e6re en enlig svale, men flere andre deltagere, der selv har stiftet
  erfaring med dette center eller har h\u00f8rt om det via netv\u00e6rk, har givet
  udtryk for samme opfattelse af centreret, og det er en problemstilling, der skal
  tages alvorligt. Desuden bliver Ballerup ogs\u00e5 n\u00e6vnt i samme vendinger.\\n\\nEn
  deltager i unders\u00f8gelsen p\u00e5pegede, at midlerne internt i virksomheden
  bliver sk\u00e6vt fordelt, og at der er fokus p\u00e5 de lette patienter i stedet
  for de tunge patienter, som for eksempel dem med skizofreni og tvangstanker (bilag
  4, M3). Medarbejderne understregede ogs\u00e5, at de lukkede afsnit ikke skal have
  en overv\u00e6gt af nyuddannet personale men derimod have det personale, der har
  erfaring. Medarbejderens l\u00f8sningsforslag til dette var at l\u00f8fte rekrutteringen
  et niveau op for p\u00e5 den m\u00e5de at kunne fordele de menneskelige ressourcer
  mere optimalt efter, hvor behovet er (Ibid.).\\n\\n4.3 Virksomhedens profil \u2013
  sammenh\u00e6ng mellem visioner og adf\u00e6rd\\n\\nFor at se p\u00e5 virksomhedens
  profil skal der ses n\u00e6rmere p\u00e5 fire elementer, nemlig visionerne, v\u00e6rdigrundlaget,
  EVP og medarbejdernes adf\u00e6rd. Begrundelsen for dette udgangspunkt er beskrevet
  dybdeg\u00e5ende igennem kapitel 2. Da denne afhandling har en begr\u00e6nsning
  i sit omfang, vil der her kun ses n\u00e6rmere p\u00e5 3 af visionerne og det er
  f\u00f8lgende: \\\"1. En psykiatri med patienten i centrum, 8. En psykiatri med
  kompetente og engagerede medarbejdere og 9. En psykiatri i stimulerende fysiske
  rammer\\\" (Visioner, s. 3). Det er de 3 visioner, som er mest tilg\u00e6ngelige
  at analysere p\u00e5 i denne afhandling, da de resterende visioner hovedsagligt
  omhandler behandlingsmetoder, hvilket for mig som Cand. Merc. HRM-studerende vil
  v\u00e6re omfattende at skulle s\u00e6tte mig ind i og forklare det videre i denne
  afhandling.\\n\\nSom det er blevet belyst i kapitel 1, ses der en klar sammenh\u00e6ng
  mellem virksomhedens visioner og v\u00e6rdigrundlag. Desuden vurderes det, at den
  benyttede metode til udarbejdelsen af v\u00e6rdierne er god, da v\u00e6rdierne p\u00e5
  den m\u00e5de burde afspejle en allerede eksisterende kultur i virksomheden. Fordelen
  herved er, at en allerede eksisterende virksomheds kultur er meget sv\u00e6r at
  \u00e6ndre. F\u00e6lles for v\u00e6rdigrundlaget og visionerne for RHP er, at de
  begge tager udgangspunkt i patienten. I det f\u00f8lgende skal der ses n\u00e6rmere
  p\u00e5, om adf\u00e6rden i virksomheden afspejler visionerne, og til dette ses
  der n\u00e6rmere p\u00e5 de svar, som deltagerne af unders\u00f8gelsen til denne
  afhandling hovedsagligt har givet i sp\u00f8rgsm\u00e5l 4, 5, 6 og 10. Svarende
  kan dog godt blive udtrykt via andre sp\u00f8rgsm\u00e5l.\\n\\n4.3.1 Med Patienten
  i Centrum\\n\\nVed at kigge meningskondenseringen grundigt igennem og h\u00f8re
  et par interviews en gang til viste det sig, at 8 deltagere ud af 13 (2 deltagere
  medtages ikke i denne del af analysen, da de ikke arbejdede i RHP og derfor ikke
  kan deltage i belysningen af, om adf\u00e6rden i virksomheden afspejler visionerne)
  mente, at den daglige adf\u00e6rd p\u00e5 centrene afspejlede visionen om patienten
  i centrum. Her var 3 deltagere bevidste om det og n\u00e6vnte det direkte. Det vurderes,
  at andre deltagere var mindre bevidste om sammenh\u00e6ngen mellem visionerne og
  adf\u00e6rden, da de ikke kommenterede det direkte men hentydede til det. For eksempel
  sagde en deltager f\u00f8lgende \\\"b\u00e5de personale og patienter er i fokus
  her\\\" (Bilag 4, M14), hvilket kan overs\u00e6ttets til, at adf\u00e6rden afspejler
  visionen. Disse udtalelser stammer fra deltagere, der arbejder p\u00e5 Bispebjerg,
  Amager samt Nordsj\u00e6lland, og derfor antages det, at visionen om patienten i
  centrum og v\u00e6rdgrundlaget med mennesket i centrum kan afspejles i adf\u00e6rden
  p\u00e5 disse centre.\\n\\nDet er dog ikke alle deltagere, der har en opfattelse
  af, at der er overensstemmelse mellem vision og den adf\u00e6rd, som medarbejderne
  udviser i hverdagen. En medarbejder udtaler sig s\u00e5ledes om, hvordan b\u00e5de
  v\u00e6rdierne og visionerne bliver tilsidesat i en presset hverdag; \\\"V\u00e6rdierne
  og visionerne s\u00e6ttes overstyr i dette center, for at kunne f\u00e5 hverdagen
  til at fungere\\\" (bilag 4, M3). Deltageren begrunder sit udsagn med mangel p\u00e5
  ressourcer. Dette er den samme deltager, som mener, at midlerne er sk\u00e6vt og
  urimeligt fordelt blandt de forskellige centre. Igennem hele interviewet med denne
  deltager udtrykkes der stor utilfredshed med de ressourcer, der stilles til r\u00e5dighed
  til lige netop Hvidovre, som er deltagerens arbejdsplads. Deltageren udtaler f\u00f8lgende;
  \\\"Jeg kender v\u00e6rdierne, og hvem er ikke enige i dem. Men jeg synes de mister
  indhold. De skal konkretiseres i praksis. Vi er ved at f\u00e5 en overdosis af de
  buzz words\\\" (bilag4, M3) og fors\u00e6tter med udtalelser om, at centret er plaget
  af et h\u00f8jt sygefrav\u00e6r, som afspejler det arbejdspres, medarbejderne er
  under p\u00e5 grund af de manglende ressourcer. Denne deltager er den eneste i unders\u00f8gelsen,
  der repr\u00e6sentere Center Hvidovre, hvilket betyder, at validiteten af udtalelser
  i interviewet ville v\u00e6re h\u00f8jere, hvis der var flere deltagere fra samme
  Center, der kunne bekr\u00e6fte udtalelserne. Af interviewet fremg\u00e5r det, at
  deltageren ikke er utilfreds med sit arbejde men derimod har s\u00f8gt job lige
  netop p\u00e5 det center p\u00e5 grund af de problemstillinger centeret stod overfor,
  hvilket vil blive belyst senere i dette kapitel. Med viden om deltagerens tilfredshed
  i sit arbejder till\u00e6gges udtalelserne en noget h\u00f8jere validitet end f\u00f8rst
  antaget og tolkes dermed som konstruktiv kritik, der skal tages alvorligt. Endnu
  engang ses det, at der er forskel fra center til center.\\n\\n4.3.2 H\u00f8j faglighed\\n\\nVision
  nummer 8 \\\"en psykiatri med kompetente og engagerede medarbejdere\\\" (Visioner,
  s. 6), handler virksomhedens \u00f8nske om at have medarbejdere, der er engagerede
  og kompetente, hvilket visionen foreskriver, blandt andet kommer via efteruddannelse.
  Den ene v\u00e6rdi i v\u00e6rdigrundlaget omhandler som tidligere n\u00e6vnt fagligheden
  hos medarbejderne. Og netop faglighed og mulighed for faglig sparring med kollegaer
  bliver n\u00e6vnt af 11 medarbejdere som v\u00e6rende adf\u00e6rd, der pr\u00e6ger
  hverdagen ude p\u00e5 de forskellige centre. En medarbejder udtaler, at det store
  engagement er en af de ting ved arbejdspladesen, som medarbejderen allerbedst kan
  lide. Dermed vurderes det, at medarbejdernes adf\u00e6rd afspejler det \u00f8nske
  og den v\u00e6rdi, som virksomheden har opsat, og dermed er der if\u00f8lge teorien,
  som er gennemg\u00e5et i kapitel 2, et solidt fundament for, at medarbejderne kan
  levere service, i form af pleje og behandling til patienterne, af h\u00f8j kvalitet.
  Og da udtalelserne kommer fra stort set alle centre, tolkes virksomhedens \u00f8nske
  om kompetente og engagerede medarbejder at v\u00e6re bredt ud i det meste af virksomheden.\\n\\nIgen
  her er ses det, at der er et center der skiller sig ud fra m\u00e6ngden, da der
  er en deltager af unders\u00f8gelsen, der \u00f8nsker mulighed for mere faglig sparring.
  Medarbejderen f\u00f8ler sig ikke fagligt dygtig nok. Denne medarbejder arbejder
  p\u00e5 Center Glostrup og mener ikke, at der er nok tid i en presset hverdag til
  faglig sparring med kollegaer, som medarbejderen ellers p\u00e5l\u00e6gger stor
  v\u00e6rdig (bilag 4, M11). Hermed tolkes det som, at denne medarbejder kan spejle
  sig i visionen og v\u00e6rdien, der omhandler h\u00f8j fagligt niveau, og dermed
  skulle v\u00e6re et godt match med virksomheden. Men da adf\u00e6rden p\u00e5 netop
  denne medarbejders arbejdsplads, ikke kan afspejle vision og v\u00e6rdien om h\u00f8j
  faglighed, vil det g\u00e5 ud over det engagement medarbejderen ellers har potentiale
  for at udvise, og i sidste ende kvaliteten af servicen, der ydes til patienten.
  Konsekvensen heraf vil v\u00e6re, at den eksterne branding p\u00e5 netop dette center,
  vil v\u00e6re negativ og dermed have en negativ indflydelse p\u00e5 virksomhedens
  image og eventuelle potentielle medarbejder. Igen vurderes det, at denne deltagers
  udtalelser skal ses som konstruktiv kritik, da medarbejderen gerne vil leve op til
  det, som virksomheden har stillet i udsigt, i og med at medarbejderen er enig i
  visionen og v\u00e6rdien.\\n\\n4.3.3 De fysiske rammer\\n\\nVision nummer 9 omhandler,
  at de fysiske rammer for virksomheden skal v\u00e6re tidsvarende og tilstr\u00e6kkelige
  og begrundes med behandling af og velv\u00e6re hos patienterne samt med sikkerhed
  for b\u00e5de personale og patienter (Visioner, s.6). Det tolkes som, at centrene
  skal fremst\u00e5 som fysisk attraktive b\u00e5de i stand, faciliteter og beliggenhed.
  Det er indskrevet i Visionerne, at \\\"en stor del af de nuv\u00e6rende fysiske
  rammer i psykiatrien i Region Hovedstaden ikke lever op til moderne standarder for
  byggeri og skal derfor moderniseres i de kommende \u00e5r\\\" (Ibid.). Med andre
  ord er virksomheden opm\u00e6rksom p\u00e5, at der er centre, hvor standen ikke
  lever op til visionen, men dette er der udarbejdet en plan for, og dermed kan de
  centre, der ikke lever op til standarden forvente forbedringer inden for en \u00e5rr\u00e6kke.
  Dermed afspejles denne vision ikke over alt i virksomheden og igen er det centrene
  (i unders\u00f8gelsen for denne afhandling) Glostrup og Hvidovre, der er ofrene.
  Medarbejderne i unders\u00f8gelsen, der repr\u00e6senter disse to centre, siger,
  at der er mangel p\u00e5 sengepladser her og p\u00e5peger igen den sk\u00e6ve fordeling
  af midlerne, da der i den forbindelse g\u00f8res opm\u00e6rksom p\u00e5 tomme sengepladser
  p\u00e5 for eksempel Amager (bilag 4, M3) (bilag 4, M11). Medarbejdernes vurdering
  m\u00e5 antages at v\u00e6re baseret p\u00e5 tal, og derfor m\u00e5 anses som valide.\\n\\nKvaliteten
  af den service og behandling, der ydes til patienterne p\u00e5 Hvidover og Glostrup,
  vil blive opfattet som v\u00e6rende mere positiv, n\u00e5r disse centre bliver renoveret
  og det vil dermed bidrage til et mere positivt image. Indtil alle virksomhedens
  faciliteter er opdateret, s\u00e5 de lever op til visionen, vil virksomheden opn\u00e5
  et dobbelt image, med d\u00e5rligt service nogle steder og god service andre steder
  i virksomheden.\\n\\n4.3.4 Virksomhedens EVP (bel\u00f8nning og anerkendelse)\\n\\nTeorien
  siger, at virksomhedens EVP er et af de helt centrale og essentielle elementer i
  en virksomheds employer brand strategi, og dermed er det her fokusset skal v\u00e6re.
  Bel\u00f8nning og anerkendelse er en vigtig, del af succeshistorien, der er beskrevet
  i kapitel 2.\\n\\nI visionerne ses det, at virksomheden tilbyder deres medarbejdere
  efteruddannelse og et godt arbejdsmilj\u00f8 (Visionerne, s. 6). Efteruddannelse
  er tidligere i dette kapitel, fastsl\u00e5et som v\u00e6rende en v\u00e6rdi, der
  i h\u00f8j grad bliver afspejlet i adf\u00e6rden i virksomheden, og dermed er det
  en bel\u00f8nning, som skal fremg\u00e5 tydeligt af et employer brand for RHP. Desuden
  anses hele v\u00e6rdigrundlaget, som det er skrevet for virksomheden, som v\u00e6rende
  taget ud af teorien om, hvad bel\u00f8nning kan indeb\u00e6re. Med det menes der,
  at det af kapitel 2 fremg\u00e5r, at bel\u00f8nning kan best\u00e5 af \\\"udfordringer
  og ansvar i jobbet, udviklingsmuligheder, status og anerkendelse\\\" (Larsen, 2006,
  s. 150), hvilket er helt i overensstemmelse med indholdet i RHP v\u00e6rdis\u00e6ttet.
  Desuden indg\u00e5r anerkendelse ogs\u00e5 som en del af personalepolitikken, som
  er gennemg\u00e5et i kapitel 1. Der er allerede tidligere i dette kapitlet redegjort
  for, i hvilken grad adf\u00e6rden i virksomheden afspejler udviklingsmuligheder,
  udfordringer og faglighed, s\u00e5 i det f\u00f8lgende ses der n\u00e6rmere p\u00e5
  ansvar og anerkendelse.\\n\\nAnsvar bliver i unders\u00f8gelsen kun n\u00e6vnt af
  3 medarbejdere, der repr\u00e6senterer centrene Amager og Nordsj\u00e6lland. Medarbejderne
  siger s\u00e5ledes om ansvar i RHP; \\\"man er ansvarsbevist\\\" (bilag 4, M8),
  \\\"der er mulighed for at f\u00e5 nogle ansvarsomr\u00e5der\\\" (bilag 4, M9) og
  \\\"der er mulighed for udvikling og at tage ansvar\\\" (bilag 4, M10). Ud fra disse
  udtagelser ses det, at ansvar er afspejlet i adf\u00e6rden. Der kan v\u00e6re flere
  grunde til, at der ikke er flere medarbejdere, der har n\u00e6vnt det i unders\u00f8gelsen,
  s\u00e5som at flere af deltagerne er nyuddannet samt nyansatte og dermed kun havde
  v\u00e6ret ansat i ganske kort tid, da interviewene fandt sted. Men at der ikke
  er flere, der n\u00e6vner adf\u00e6rden ''ansvar'', tolkes som, at ansvar ikke anses
  som v\u00e6rende en v\u00e6rdi og adf\u00e6rd, som s\u00e6ttes i fokus i hverdagen
  ude p\u00e5 centrene. Dermed vurderes det som v\u00e6rende et element, der skal
  s\u00e6ttes fokus p\u00e5, og som skal inkorporeres i hverdagen og adf\u00e6rden.\\n\\nI
  v\u00e6rdigrundlaget findes anerkendelse under v\u00e6rdien respekt, men i unders\u00f8gelsen
  er der ingen deltagere, der n\u00e6vner hverken anerkendelse eller respekt. Det
  vurderes derfor, at v\u00e6re et tydeligt signal om, at denne v\u00e6rdi ikke p\u00e5
  nogen m\u00e5de bliver afspejlet i den daglige adf\u00e6rd i RHP.\\n\\n\u00d8konomisk
  bel\u00f8nning er ogs\u00e5 en del af EVP, men ikke mange deltagere i unders\u00f8gelsen
  kommenterer dette forhold. Der er dog 3 medarbejdere, der kommenterede p\u00e5 det,
  og den f\u00f8rste siger f\u00f8lgende; \\\"l\u00f8nningerne her er kanonh\u00f8je
  i forhold til andre steder\\\" (bilag 4, M1, s. xx). Denne medarbejder er rekrutteret
  fra den\\n\\nsomatiske verden og sammenligner i udtalelsen l\u00f8nningerne i RHP
  med l\u00f8nningsniveauet i den somatiske verden. Men det er ikke kun denne deltager,
  der ser positivt p\u00e5 l\u00f8nningsniveauet i RHP, en anden medarbejder udtaler
  s\u00e5ledes; \\\" jeg vil gerne kompenseres for mine kompetencer, og det bliver
  jeg her\\\" (bilag 4, M2), Medarbejderen forklarer senere, at der for eksempel ikke
  bliver \u00f8konomisk kompensation for ens kompetenceniveau i Region Sj\u00e6lland.
  Hvis dette forhold er rigtigt, hvilket det vurderes at v\u00e6re, da medarbejderne
  i begge tilf\u00e6lde sammenligner deres nuv\u00e6rende l\u00f8n hos RHP med tidligere
  l\u00f8nniveau og et tilbud om et l\u00f8nniveau, skal det ses som en konkurrencem\u00e6ssig
  fordel for RHP. Og denne konkurrencem\u00e6ssige fordel skal kommunikeres klart
  og tydeligt b\u00e5de internt og eksternt. Det er dog ikke alle, der ser lige positivt
  p\u00e5 l\u00f8nningerne, da en medarbejder omtaler emnet p\u00e5 f\u00f8lgende
  m\u00e5de: \\\"l\u00f8nnen m\u00e5 gerne v\u00e6re bedre, da det kan kompensere
  for det h\u00e5rde arbejdsmilj\u00f8\\\" (bilag 4, M14), men denne udtalelse er
  ikke baseret p\u00e5 sammenligninger med lignende stillinger, men derimod bare et
  \u00f8nske om mere l\u00f8n med begrundelse i arbejdes karakter. Denne form for
  argumentation anses for at v\u00e6re let k\u00f8bt, og hvem vil ikke gerne have
  mere i l\u00f8n?\\n\\n4.4 Virksomhedens image \u2013 omverdens opfattelse af RHP\\n\\nFor
  at kunne vurdere virksomhedens image er det hovedsagligt svarene fra de 3 indledende
  sp\u00f8rgsm\u00e5l i sp\u00f8rgerammen, som benyttes, og sp\u00f8rgsm\u00e5lene
  lyder s\u00e5ledes; \\\"1. Inden du s\u00e5 en evt. annonce, havde du h\u00f8rt
  om virksomheden? 2. Hvordan h\u00f8rte du om din nuv\u00e6rende stilling? 3. Hvilke
  forventninger havde du til at arbejde her, inden du startede?\\\" (bilag 3, Sp\u00f8rgerammen).
  P\u00e5 den m\u00e5de findes der frem til virksomhedens omd\u00f8mme i den offentlige
  befolkning. Virksomhedens image styres af corporate brandet, hvilket er vigtigt
  at udvikle for kunne styre omd\u00f8mmet i en positiv retningen. I rekrutterings\u00f8jemed
  er det vigtigt at have et retvisende og positivt image af virksomheden, da det er
  imaget, der i f\u00f8rste omgang skal tiltr\u00e6kke nye medarbejdere.\\n\\n4.4.1
  Hvem er RHP?\\n\\nUnders\u00f8gelsen viser, at 7 ud af deltagerne svarede, at de
  ikke har h\u00f8rt noget om virksomheden, inden de s\u00f8gte job i den. Det vurderes
  som v\u00e6rende kritisk, i forhold til det opstillede problemfelt, der blev pr\u00e6senteret
  i kapitel 1. Her belyses problemstillingen i at skulle rekruttere fra et arbejdsmarked,
  hvor eftersp\u00f8rgslen p\u00e5 medarbejdere er st\u00f8rre end udbuddet. Samtlige
  af de nyuddannede deltagere i unders\u00f8gelsen svarede entydigt, at de ikke havde
  h\u00f8rt om RHP som virksomhed, men at de havde v\u00e6ret i praktik i Psykiatrien,
  og flere af dem p\u00e5 det center, hvor de i dag er ansat. Denne udmelding tolkes
  som om, at RHP''s image n\u00e6rmest er ikke eksisterende eller i h\u00f8j grad
  fejlsl\u00e5et, da det er fagomr\u00e5det, der er kendskab til og ikke virksomheden.
  En medarbejder svarede; \\\"i mit praktikophold fik jeg indblik i, hvad Psykiatrien
  er som fagomr\u00e5de, men ikke s\u00e5 meget om virksomheden RHP\\\" (bilag 4,
  M15), dette kan skyldes det lidt indviklede forhold, der er mellem Region Hovedstaden
  og RHP, som er blevet beskrevet n\u00e6rmere i kapitel 1. Til trods for det indviklede
  forhold, er det essentielt at potentielle medarbejdere kender til virksomheden,
  og derfor skal det v\u00e6re et indsatsomr\u00e5de, som virksomheden anbefales at
  prioritere h\u00f8jt.\\n\\n4.4.2 Fordomme om Psykiatrien eller RHP\\n\\nDeltagerne
  kendte til fagomr\u00e5det Psykiatrien og flere havde forventninger eller forestillinger
  om, hvad det ville sige at arbejde inden for omr\u00e5det. Nogle forventninger og
  forestillinger var positive og andre var knap s\u00e5 flatterende. En medarbejder
  udtaler s\u00e5ledes; \\\"F\u00f8rst havde jeg en forestilling om, at de var knaldende
  sk\u00f8re, og ingen ressourcer har. Men det helt overordnede indtryk var, at psykiatrien
  havde f\u00e5et en vitaminindspr\u00f8jtning, og at det havde v\u00e6ret et indsatsomr\u00e5de\\\"
  (bilag 4, M1). Her bliver RHP og dens medarbejdere i f\u00f8rste omgang associeret
  med en kolb\u00f8ttefabrik, som ikke vurderes at v\u00e6re flatterende. Og som teorien
  bag employer branding foreskriver (kapitel 2), er associationer forbundet med image
  og dermed med, hvor attraktiv virksomheden er. Derfor tolkes RHP''s image i denne
  sammenh\u00e6ng ikke til at v\u00e6re en s\u00e6rlig attraktiv virksomhed. Men medarbejderen
  havde ogs\u00e5 indtryk af, at det var et fagomr\u00e5de, der var i rivende udvikling,
  og som var blevet tildelt nogle ressourcer. En anden medarbejder var direkte bange,
  da hun skulle til jobsamtale og udtaler s\u00e5ledes; \\\"Jeg var meget usikker
  og bange f\u00f8rste gang jeg skulle her ud (p\u00e5 den lukkede afdeling p\u00e5
  et psykiatrisk center red.). Der er mange, der har det s\u00e5dan ''nej nej psykiatrien
  det er ikke mig'', men det er fordi, de ikke ved hvad det er\\\" (bilag 4, M12).
  Medarbejderen her hentyder til de fordomme, der er forbundet med arbejdet med psykisk
  syge personer. Disse fordomme kommer ikke ud af den bl\u00e5 luft, men bygger p\u00e5
  den omtale psykisk syge f\u00e5r i medierne, lige som teorien forskriver det, hvilket
  er blevet beskrevet n\u00e6rmere i kapitel 2. Desuden har FOA udarbejdet en rapport,
  der underbygger denne fordom. I rapporten konkluderes det, at mere end halvdelen
  af de medvirkende i unders\u00f8gelsen i en periode inden for et \u00e5r har \\\"v\u00e6ret
  udsat for fysisk vold fra borgere p\u00e5 deres arbejdsplads\\\" (FOA, 2014). Volden
  bestod blandet andet af skub, kast med genstande og slag (Ibid.). Rapporten er ikke
  den f\u00f8rste af sin art og har v\u00e6ret n\u00e6vnt i flere nyhedsmedier. Her
  skal det dog understreges, at det er fagomr\u00e5det psykiatri og ikke virksomheden
  RHP, der bliver n\u00e6vnt, og dermed er det en faktor som virksomheden kan bruge
  og vende til en fordel. Dette kr\u00e6ver dog, at RHP udarbejder en handleplan for,
  hvordan s\u00e5danne situationer skal takles, og inddrager den i en employer branding
  strategi. S\u00e5danne handleplaner findes allerede ude p\u00e5 centrene, hvor flere
  medarbejdere understreger, at personalet \\\"er gode til at snakke om tingene bagefter,
  hvis der har v\u00e6ret nogle voldsomme situationer\\\" (bilag 4, M3).\\n\\nOrganisationen
  EN AF OS tager kampen op med de fordomme, der er forbundet med psykiske sygedomme.
  Det vurderes, at hvis RHP deltog i en form for samarbejde med den organisation,
  ville de kunne drage fordele af det i deres rekrutteringsproces. Hermed bliver fordommen
  om arbejdet i Psykiatrien og herunder RHP, s\u00e5dan som teorien bag fortolkningsprocessen
  siger det i kapitel 3, ikke elimineret, men der tages h\u00e5nd om problemet, hvilket
  kan inddrages i udarbejdelsen af en employer branding strategi.\\n\\n4.4.3 Det gode
  omd\u00f8mme\\n\\nUnders\u00f8gelsen, der er udarbejdet i forbindelse med denne
  afhandling, viste at RHP ikke kun har et negativt omd\u00f8mme. En deltager i unders\u00f8gelsen
  havde en forestilling om, at RHP var en virksomhed med en bred vidde og havde via
  sin praktik m\u00f8dt nogle \\\"brandgode sygeplejersker\\\" (bilag 4, M4). En anden
  deltager i unders\u00f8gelsen siger, at fagligt netv\u00e6rk havde oplyst (alts\u00e5
  via word of mouth), at \\\"der var en god og stabil l\u00e6gegruppe\\\" (bilag 4,
  M6). Samme medarbejder fortalte ogs\u00e5, at en bekendt havde v\u00e6ret indlagt
  p\u00e5 netop det center. Indl\u00e6ggelse resulterede i et vellykket selvmord,
  hvilket efterlod de p\u00e5r\u00f8rende med en negativ oplevelse af stedet. Medarbejderne
  kunne dog gennemskue behandlingen af patienten og bed\u00f8mte, at personalet p\u00e5
  centeret havde handlet helt rigtigt og dermed vurderede at den negative omtale mere
  end noget andet handlede om sorg over tabet af patienten. Med andre ord betyder
  det at, RHP har et image, om end det er svagt, af at have nogle fagligt dygtige
  medarbejdere, hvilket er i overensstemmelse med den opfattelse, som medarbejderne
  selv har, og dermed det et vigtigt element, der skal indg\u00e5 i en employer brand
  strategien.\\n\\n4.4.4 RHP''s omd\u00f8mme i Region Hovedstaden\\n\\nSamtlige medarbejdere,
  der deltog i unders\u00f8gelsen, og som er rekrutteret fra den somatiske verden,
  svarede at de intet kendskab havde til virksomheden, inden de startede. Dette er
  p\u00e5 trods af, at de i realiteten var ansat af samme virksomhed (Region Hovedstaden),
  og nogle endda p\u00e5 det somatiske hospital, der l\u00e5 i forbindelse med det
  Psykiatriske Center. Derfor vurderes det, at der ogs\u00e5 p\u00e5l\u00e6gges Region
  Hovedstaden et ansvar i rekrutteringsprocessen. I og med at RHP ikke har et st\u00e6rkt
  image i den somatiske verden, vil det v\u00e6re en meget sv\u00e6r opgave at tiltr\u00e6kke
  potentielle medarbejde herfra. Det kunne t\u00e6nkes, at dette er en bevidst strategi
  fra Region Hovedstadens side, der i denne proces har en dobbelt rolle. Det vurderes,
  at Region Hovedstadens har en interesse i, at der ikke bliver shoppet medarbejdere
  fra den ene virksomhed til den anden, da problemstillingen med et presset arbejdsmarkeder
  det samme for den somatiske verden og for Psykiatrien. Da HR er en tv\u00e6rfaglig
  funktion for alle virksomheder i Region Hovedstaden, er dette endnu et argument
  for, at det ville v\u00e6re en god ide at l\u00f8fte rekrutteringsprocessen et niveau
  op, s\u00e5 HR f\u00e5 en rolle her.\\n\\n4.4.5 Er RHP en \u00f8nskv\u00e6rdig arbejdsplads?\\n\\n12
  deltagere i unders\u00f8gelsen svarer, at de ville havde s\u00f8gt et andet job
  indenfor RHP, hvis de ikke havde f\u00e5et det job, de besidder nu. Det vil alts\u00e5
  sige, at kun 3 deltagere ikke ville s\u00f8ge inden for virksomheden igen. De begrundelser,
  som deltagerne kommer med for at ville s\u00f8ge andet job inden for virksomheden,
  er det h\u00f8je faglige niveau, arbejdsformen (kommunikation), arbejdsgangen og
  gode praktik forl\u00f8b.\\n\\n4.5 Rekrutteringsprocessen\\n\\nSom beskrevet i kapitel
  2 skal rekrutteringsprocessen afspejle virksomhedens profil, visioner og identitet,
  samt udnytte de positive elementer i imaget. Og som beskrevet i kapitel 1, har RHP
  udarbejdet en Rekrutteringsguide, der skal ses som et inspirationskatalog for de
  ans\u00e6ttelsesudvalg ude p\u00e5 centrene, der har til opgave at rekruttere nye
  medarbejdere til virksomhedens centre. I det f\u00f8lgende afsnit skal der derfor
  ses n\u00e6rmere p\u00e5, hvordan deltagerne af unders\u00f8gelsen har oplevet den
  rekrutteringsproces, de netop har v\u00e6ret igennem inden interviewene blev gennemf\u00f8rt.
  Dette skal sammenlignes med, hvad virksomheden \u00f8nsker og hvad den udsender
  af signaler.\\n\\n4.5.1 Tidsrammen\\n\\nSom start ses der p\u00e5 de elementer i
  rekrutteringsprocessen, som alle deltagerne oplevede som v\u00e6rende ens, nemlig
  den hurtige proces fra ans\u00f8gningen var sendt og indtil, de havde v\u00e6ret
  til jobsamtalen og efterf\u00f8lgende fik svar. Alle deltagerne var til samtale
  inden for 3 uger efter, at ans\u00f8gningen var sendt afsted, og alle deltagerne
  fik svar inden for 2 til 6 dage efter samtalen, hvilket resulterede i en generel
  tilfredshed med den del af processen. Der var dog en deltager, der udtrykte utilfredshed
  med at have f\u00e5et svar inden for den lovede tidshorisont (det var allerede p\u00e5
  vej hjem fra samtalen, at svaret kom). Begrundelsen for utilfredsheden med dette
  var, at deltageren ikke selv havde f\u00e5et lov til at t\u00e6nke igennem om jobbet
  var \u00f8nskv\u00e6rdigt (bilag 4, M5).\\n\\n4.5.2 Ans\u00e6ttelsesudvalget st\u00f8rrelse\\n\\nF\u00e6lles
  for alle deltagernes jobsamtale er, at der var flere deltagere med til jobsamtalen.
  Som beskrevet i Rekrutteringsguiden, anbefales det, at ans\u00e6ttelsesudvalget
  best\u00e5r af 2 til 6 personer (bilag 1, s. 5), hvilket i alle tilf\u00e6ldene
  er overholdt. Ved jobsamtalerne deltog i gennemsnit 4 personer fra ans\u00e6ttelsesudvalgene.\\n\\nUmiddelbart
  kan det for mig som udenforst\u00e5ende og fortolker, virke lettere overdrevet,
  at et ans\u00e6ttelsesudvalg skal have den st\u00f8rrelse, men den ved hj\u00e6lp
  at den valgte af den hermeneutiske cirkels fortolkningsproces (kapitel 3), blev
  min fordom elimineret. Alle deltagere p\u00e5 n\u00e6r en kommenterede, at alle
  der var med i netop deres ans\u00e6ttelsesudvalg er relevante i forhold til den
  stilling, som de var til samtale om. Den sidste deltager kan ikke vurdere personerne
  i ans\u00e6ttelsesudvalgets relevans i forhold til den stilling, som er udgangspunktet
  for jobsamtalen. Begrundelsen for dette er, at rollefordelingen ikke var tydelig
  ved samtalen (bilag 4, M7). En af de positivt stemte deltagere siger f\u00f8lgende
  om st\u00f8rrelsen p\u00e5 ans\u00e6ttelsesudvalget; \\\"der var 4 repr\u00e6sentanter
  og de var alle relevante for jobbet. Det f\u00f8ltes naturligt med mange til samtalen,
  i forhold til jobbet. Det handler jo om relationer\\\" (bilag 4, M10). Hermed mente
  deltagerne, at de deltagere, der deltog i jobsamtalen, var de kolleger, der indg\u00e5r
  i t\u00e6t samarbejde med deltageren i dagligdagen, og derfor indg\u00e5r de i en
  relation med hinanden.\\n\\nUlempen ved at have store ans\u00e6ttelsesudvalg er,
  at det har \u00f8konomiske omkostninger, men de \u00f8konomiske omkostninger ved
  at ans\u00e6tte den forkerte medarbejder i jobbet er st\u00f8rre. Som beskrevet
  i kapitel 2 kan en ''forkert'' medarbejder, der ikke leverer den rigtige ydelse,
  samt lever op til det l\u00f8fte, som virksomheden har givet interessenterne, fuldst\u00e6ndig
  \u00f8del\u00e6gge virksomhedens image. P\u00e5 baggrund af dette kan ans\u00e6ttelsesudvalgets
  st\u00f8rrelse ses som en fordel, hvis alle deltagere er forberedte og igennem jobsamtalen
  har som prioritet, at forventningsafstemme i forhold til virksomhedens identitet
  og profil. Det vil alts\u00e5 sige, at ans\u00e6ttelsesudvalgets st\u00f8rrelse
  kan ses som en st\u00f8rre fordel end ulempe. Med andre ord er jobsamtalens hovedform\u00e5l
  at afstemme v\u00e6rdier hos ans\u00f8geren i forhold til virksomhedens v\u00e6rdigrundlag
  og visioner.\\n\\nSom en afsluttende bem\u00e6rkning skal det understreges, at det
  vurderes som en god ide at oplyse om antal deltagere ved jobsamtalen, idet flere
  medarbejdere sagde, at de ikke var blevet oplyst herom inden samtalen. En medarbejder
  udtalte, at det var lidt overv\u00e6ldende med s\u00e5 mage til samtalen (bilag
  4, M13).\\n\\n4.5.3 Indtryk af ans\u00e6ttelsesudvalget og strukturen ved jobsamtalen\\n\\nI
  unders\u00f8gelsen bliver der omtalt flere jobsamtaler, end der er deltagere, og
  dette skyldes at flere af deltagerne har v\u00e6ret til jobsamtale p\u00e5 flere
  stillinger. Unders\u00f8gelsen viste, at hele 14 deltagere havde en oplevelse af,
  at deltagerne ved jobsamtalen havde forberedt sig og stillede relevante sp\u00f8rgsm\u00e5l
  til job ans\u00f8geren. Men ved unders\u00f8gelsen blev der omtalt 5 samtaler, hvor
  deltagerne ikke var forberedte, hvilket gav jobans\u00f8geren et indtryk af uprofessionel
  h\u00e5ndtering (bilag 4, M1). At medarbejderne skal fremst\u00e5 som professionelle,
  n\u00e6vnes i v\u00e6rdiggrundlaget under faglighed. Med andre ord skal den h\u00f8je
  faglighed v\u00e6re med til at sikre, at personalet fremst\u00e5r som professionelle,
  hvilket adf\u00e6rden ved disse jobsamtaler ikke lever op til. En medarbejder fort\u00e6ller
  om en samtale, hvor der var en patient med til jobsamtalen; \\\"der var en patient
  med\\n\\ntil jobsamtalen (Hiller\u00f8d). Og patienten blev lidt gr\u00e6nseoverskridende
  i samtalen uden, at han blev stoppet af de andre. Og samtalen foregik i patient
  dagligstuen. Det var meget uprofessionelt\\\" (bilag 4, M9). Efterf\u00f8lgende
  fort\u00e6ller deltageren, at situationen gav en f\u00f8lelse af utryghed. Dette
  vurderes som v\u00e6rende meget uprofessionelt, og adf\u00e6rden afspejler p\u00e5
  ingen m\u00e5de visionerne og v\u00e6rdigrundlaget, som det ellers er hensigten.
  Rollefordelingen skal if\u00f8lge Rekrutteringsguiden v\u00e6re planlagt p\u00e5
  forh\u00e5nd, dette giver indtryk af, at personalet i dette ans\u00e6ttelsesudvalg
  ikke har rettet sig efter Rekrutteringsguiden. Desuden er det heller ikke i tr\u00e5d
  med Rekrutteringsguiden, der pointerer, at en samtale uanset udfaldet skal efterlade
  ans\u00f8geren med et positivt indtryk af virksomheden for p\u00e5 den m\u00e5de
  at skabe lyst til at arbejde i virksomheden i fremtiden, selv om det ikke bliver
  i den ans\u00f8gte stilling. Desuden er det et m\u00e5l, at f\u00e5 positiv omtale
  via word of mouth b\u00e5de if\u00f8lge teorien, som er beskrevet i kapitel 2 og
  Rekrutteringsguiden, da det er et en af de mest trov\u00e6rdige kilder og dermed
  er der flere, der bliver tiltrukket af virksomheden som arbejdsplads.\\n\\nVed en
  grundig gennemgang af interviewene st\u00e5r det klart, at kun ved 2 jobsamtaler
  bliver der snakket om RHP v\u00e6rdigrundlag og visionerne. Dette kan v\u00e6re
  et resultat af, at de medarbejdere, der sidder i ans\u00e6ttelsesudvalgene, ikke
  er kl\u00e6dt p\u00e5 rent fagligt til at varetage denne opgave uden st\u00f8tte
  fra en fagperson. Dette er endnu en grund til at l\u00f8fte rekrutteringsopgaverne
  et niveau og dermed inddrage en HR-medarbejder. HR medarbejdere besidder en viden
  om de vigtige elementer i rekrutteringsprocessen, som kan v\u00e6re sv\u00e6r at
  tillegne sig, n\u00e5r ens speciale ligger inden for et helt andet fagligt omr\u00e5de,
  og rekruttering kun er en lille del af ens arbejdsomr\u00e5de. Desuden bliver v\u00e6rdierne
  kun n\u00e6vnt \u00e9n gang i hele Rekrutteringsguiden, og visionerne bliver slet
  ikke n\u00e6vnt. Da rekruttering i h\u00f8j grad vurderes til at foreg\u00e5 ud
  fra Rekrutteringsguiden, vurderes det, at den skal korrigeres til at inddrage virksomhedens
  v\u00e6rdigrundlag og visioner mere centralt. Derudover vurderes det, at den skal
  laves om fra at have status som inspirationskatalog til at v\u00e6re retningslinjer
  for rekruttering i RHP.\\n\\n4.5.4 Stillingsannoncens indhold\\n\\nDet der i f\u00f8rste
  omgang skal tiltr\u00e6kke nye medarbejdere til virksomheden er det virksomhedens
  image, som skal fremst\u00e5 positivt og retvisende. Man da RHP ikke har et s\u00e6rligt
  st\u00e6rkt image, er det endnu vigtigere, at stillingsannoncerne fremst\u00e5r
  skarpe. I kapitel 1 blev det gjort klart, at vejledningen i ops\u00e6tning af stillingsannoncer
  (se bilag 2) ikke pointerer nok, at v\u00e6rdierne og visionerne skal kunne l\u00e6ses
  i en stillingsannonce. Dette er vigtige oplysninger, da den nye medarbejder skal
  kunne identificere sig med virksomhedens profil for at kunne yde service af h\u00f8j
  kvalitet. Desuden siger teorien, som beskrevet i kapitel 2, at de fordele, der er
  ved at arbejde i en virksomhed, skal fremg\u00e5 af stillingsannoncen for p\u00e5
  den m\u00e5de vil flere s\u00f8ge jobbet. Fordelene best\u00e5r af EVP''et (hvis
  indhold er beskrevet tidligere), da det er det virksomheden tilbyder sine\\n\\nmedarbejdere
  i bytte for arbejdskraften. Ingen af disse elementer er beskrevet i Vejledningen
  om stillingsannoncer, som ligesom Rekrutteringsguiden kun skal bruges som inspiration.
  Det vurderes, at Vejledningen om stillingsannoncer ikke kun skal v\u00e6re til inspiration
  men, at der igen her laves retningslinjer for udarbejdelse af stillingsannoncerne,
  ikke for at de skal v\u00e6re enslydende og kedelige, men for at v\u00e6re sikker
  p\u00e5, at de indeholder de rigtige informationer, alts\u00e5 de informationer
  der tiltr\u00e6kker medarbejder.\\n\\nMedarbejdernes opfattelse af stillingsannoncerne
  var, at de var mangelfulde i informationsniveauet, og da de selv s\u00f8gte information
  om arbejdspladsen, var det sv\u00e6rt at finde. To deltagere i unders\u00f8gelsen
  udtaler identisk at: \\\"Det var sv\u00e6rt at finde information om centrene som
  arbejdsplads p\u00e5 hjemmesiderne, men der er masser information rettet mod patienter
  og p\u00e5r\u00f8rende\\\" (bilag 4, M8) (bilag 4, M13).\\n\\n4.6 Opsummering\\n\\nFor
  at f\u00e5 givet et overskueligt overblik over pr\u00e6sentationen af de indsamlede
  data og tilh\u00f8rende analyser, er de v\u00e6sentligste punkter samlet i et SWOT-skema
  (Kotler, 2003, s. 64), som ses i tabel nr. 4.1. Desuden er graden af, i hvor h\u00f8j
  grad virksomheden lever op til de parametre, der indg\u00e5r i en employer brandet,
  vurderet og indsat i skemaet i tabel 4.2.\\n\\nSom opsummering kan det siges, at
  medarbejderne vurderer, at virksomhedens identitet skal findes i det h\u00f8je faglige
  niveau, den gode kommunikation medarbejderne imellem, en arbejdsplads hvor der er
  mulighed for at udvikle sig, og hvor arbejdsgangen g\u00f8r, at arbejdet i h\u00f8j
  grad adskiller sig fra samleb\u00e5ndsarbejde - der af medarbejderne vurderes til,
  at pr\u00e6ge den somatiske verden. Medarbejderne anser ogs\u00e5 virksomheden for
  at v\u00e6re splittet i den forstand, at der er stor forskel i kulturen p\u00e5
  de forskellige centre.\\n\\nIgennem kapitlet vurderes RHP''s EVP-niveau til at v\u00e6re
  relativt h\u00f8jt, da de medarbejdere, der arbejder i virksomheden kan forvente
  udfordringer, muligheder for udvikling, en l\u00f8n der kompenserer for kompetencer
  samt mulighed for ansvar. Virksomheden skal dog arbejde p\u00e5, at f\u00e5 anerkendelse
  inkorporeret i adf\u00e6rden. P\u00e5 den bagrund vurderes det, at virksomhedens
  interne branding af v\u00e6rdigrundlaget og visionerne stort set er lykkedes.\\n\\nSom
  afrunding vurderes det, at RHP image er meget svagt, hvilket g\u00f8r det til en
  vanskelig opgave at tiltr\u00e6kke medarbejdere is\u00e6r i et presset arbejdsmarked.
  Derudover er den eksterne branding ogs\u00e5 fejlsl\u00e5et, hvilket g\u00f8r det
  sv\u00e6rt at tiltr\u00e6kke nye medarbejder. Begrundelsen for at imaget vurderes
  som v\u00e6rende svagt, skal findes i den manglende udvikling af et corporate brand,
  der kan g\u00f8re opm\u00e6rksom p\u00e5 virksomhedens eksistens og ikke bare Psykiatrien,
  som anses for at v\u00e6re et fagomr\u00e5de. Associationerne og de fordomme,\\n\\nder
  er omkring Psykiatrien som arbejdsfelt, vurderes heller ikke til at v\u00e6re s\u00e6rlig
  gunstigt for tiltr\u00e6kningsevnen. Derfor skal RHP l\u00e6gge et stort arbejde
  i, at f\u00e5 skabt et image, der er positiv og retvisende. Dette kan blandt andet
  g\u00f8res ved at f\u00e5 udarbejdet deres forskellige branding strategier, b\u00e5de
  produkt (service) branding, corporate branding samt employer branding.\\n\\nSTYRKER\\n\\nSVAGHEDER\\n\\n1.
  Der hersker et h\u00f8jt fagligt niveau i virksomheden\\n2. God kommunikation kollegaer
  og patienter i mellem\\n3. Mulighed for udvikling, i form af uddannelse\\n4. Ovenst\u00e5ende
  betyder, at der er karrieremuligheder\\n5. Diversitet og frihed i arbejdet, hvor
  somatikken er pr\u00e6get af samleb\u00e5ndsarbejde\\n6. Indtryk af at Psykiatriener
  et fagomr\u00e5de, der har f\u00e5et en vitamin indspr\u00f8jtning\\n7. H\u00f8jt
  fagligt niveau bliver afspejlet i adf\u00e6rden i s\u00e6r p\u00e5 Amager og Bispebjerg.\\n8.
  Tidsrammen i rekrutteringsprocessen vurderes som v\u00e6rende tilfredsstillende.\\n\\nMULIGHEDER\\n\\n1.
  Der er fokus p\u00e5 tabu om psykiske lidelser med organisationen EN AF OS.\\n1.
  Oplevelse af distance mellem medarbejder p\u00e5 centrene og Kristineberg\\n2. Ovenst\u00e5ende
  betyder, at der forekommer brister i kommunikationen mellem de to parter\\n3. Betydningen
  af v\u00e6rdien udvikling tolkes forskelligt\\n4. Forskelligt arbejdsklima, p\u00e5
  de forskellige centre\\n5. Ressourcer/midler er sk\u00e6vt fordelt\\n6. Virksomheden
  RHP''s image er n\u00e6rmest ikke eksisterende\\n7. P\u00e5 to centre, Glostrup
  og Hvidovre, hersker der en presset hverdag, hvilket betyder at Visioner og V\u00e6rdigrundlag
  ikke bliver afspejlet i adf\u00e6rden\\n8. Glostrup og Hvidovre lever ikke op til
  de fysiske rammekrav\\n9. V\u00e6rdier og visioner fylder ikke meget i selve jobsamtalen\\n10.
  Rekrutteringsguiden er et inspirations katalog, kan evt. der er behov for retningslinjer\\n\\nTRUSLER\\n\\n1.
  Presset arbejdsmarked med st\u00f8rre eftersp\u00f8rgsels en udbud\\n2. Region Hovedstaden,
  der med HR kan deltage i en eller anden grad i rekrutteringsprocessen, for at forbygge
  shopperi.\\n2. F\u00e6rre uddannet sygeplejersker end der g\u00e5r p\u00e5 pension\\n3.
  Negativ medieomtale om voldlige patienter\\n\\nTabel nr. 4.1 SWOT, der har til form\u00e5l
  at give overblik over den pr\u00e6senteret data (Kotler, 2003 s.64)\\n\\nFlere gange
  igennem kapitlet l\u00e6gges der op til, at en HR-medarbejder skal ind over rekrutteringsprocessen,
  da der indg\u00e5r elementer og faktorer i processen, som medarbejdere, der ikke
  har tilstr\u00e6kkelige viden herom, ikke kan navigere igennem. Heriblandt indholdet
  af stillingsannoncerne og indholdet af jobsamtalen.\\n\\nFigur 4.2 nedenfor viser
  i hvilken grad, RHP lever op til de parametre, som indg\u00e5r i et employer brand.
  Som det er beskrevet i kapitel 2, viser kolonnen vigtighed, teoriens udl\u00e6gning
  af, hvor vigtig den enkelte parameter er i forhold til udviklingen af et employer
  brand. P\u00e5 en skala fra 1-5 er 1 slet ikke vigtig, 2 er ikke vigtig, 3 er hverken
  eller, 4 er vigtig og 5 er meget vigtig. Da teorien, der er benyttet i denne afhandling,
  siger at der skal v\u00e6re en sammenh\u00e6ng mellem alle parametrene i et employer
  brand for p\u00e5 den m\u00e5de at skabe trov\u00e6rdighed, till\u00e6gges alle
  elementerne en vigtighed p\u00e5 5. Kolonnen bed\u00f8mmelse skal vise, hvor st\u00e6rkt
  de forskellige parmetre, er bed\u00f8mt ud fra ovenst\u00e5ende analyse, der er
  baseret p\u00e5 interviewende med medarbejderne. Igen er bed\u00f8mmelsen ud fra
  en skala 1-5, hvor 1 er meget svagt, 2 er svagt, 3 er kunne v\u00e6re bedre, 4 er
  st\u00e6rkt, 5 er meget st\u00e6rkt. Bed\u00f8mmelsen af i hvor h\u00f8j grad RHP
  lever op til teorien, er baseret p\u00e5 en vurdering og tolkning af de interviews
  (unders\u00f8gelsen), der er grundlaget for dette kapitel. Med andre ord er det
  mig som fortolker, der overs\u00e6tter informationerne til et fagligt sprog, som
  der kan videretolkes p\u00e5. Dette er i overensstemmelse med at benytte hermeneutikken
  som analyseform (kapitel 3).\\n\\nTabel nr. 4.2 Skema der viser parameter i employer
  branding.\\n\\n| Employer brand opbygges ud fra: |  |  |\\n|---|---|---|\\n| Virksomhedens
  identitet - medarbejdernes opfattelse af virksomheden som arbejdsplads | 5 | 4 |\\n|
  Virksomhedens profil - vision afspejles i adf\u00e6rden | 5 | 3\u00bd |\\n| Virksomhedens
  profil - v\u00e6rdier afspejles i adf\u00e6rden | 5 | 3\u00bd |\\n| Virksomhedens
  profil - EVP | 5 | 3\u00bd |\\n| Virksomhedens image - corporate brand | 5 | 1 |\\n|
  Employer brand har til form\u00e5l: |  |  |\\n| at g\u00f8re arbejdspladsen identificerbar
  | 5 | 3 |\\n| at differentiere arbejdspladsen som arbejdsgiver | 5 | 3 |\\n| Opgaver
  forbundet med employer branding: |  |  |\\n| Ekstern branding | 5 | 1 |\\n| Intern
  branding | 5 | 3\u00bd |\\n| Det \u00f8nsket outcome af employer brandet: |  |  |\\n\\nUd
  fra ovenst\u00e5ende skema ses det tydeligt, hvor indsatsomr\u00e5derne for udvikling
  af et employer brand skal v\u00e6re. Der skal beskrives et \u00f8nsket outcome for
  employer brand (employer brand equity), det kan til dels\\n\\ntolkes som v\u00e6rende
  denne afhandlings problemfelt, men skal konkretiseres. Desuden ses det, at virksomheden
  ikke har form\u00e5et at skabe et image, hvilket h\u00e6nger sammen med den lave
  bed\u00f8mmelse af den eksterne branding. Da der ikke er nogle af parametrene, der
  vurderes som v\u00e6rende i tr\u00e5d med, hvad teorien siger, skal der laves en
  indsats, der ber\u00f8rer alle parametre. Det skal dog n\u00e6vnes, at virksomhedens
  identitet bliver vurderet som v\u00e6rende st\u00e6rk, da der kun er et indsatsomr\u00e5de
  her, nemlig distancen mellem centrene og Kristineberg. Og s\u00e5 skal alle centrene
  have samme identitet. Det f\u00f8lgende kapitel (kapitel 5), tager udgangspunkt
  i ovenst\u00e5ende skema (tabel 4.2).\\n\\n5 Anbefalinger\\n\\n5.1 Introduktion\\n\\nDette
  kapitel omhandler de anbefalinger, som RHP r\u00e5des til at f\u00f8lge, hvis de
  vil have succes med deres employer brand. Kapitlet tager sit udgangspunkt i konklusionen
  fra det forg\u00e5enden kapitel 4. I overskrifter kan det siges, at RHP n\u00e6rmest
  har et ikke eksisterende image, og det vurderes, at \u00e5rsagen er manglende udvikling
  af et corporate brand. Dermed er virksomhedens eksterne brand heller ikke eksisterende
  ligesom, der ikke er udarbejdet et employer brand equity. Virksomheden har en identitet
  og en profil, der dog skal arbejders videre med. Kapitlet er opbygget ud fra de
  vigtigste tiltag, som RHP skal udf\u00f8re. Derefter kommer de handlinger, der b\u00f8r
  gennemf\u00f8res, for til sidst at pr\u00e6sentere de handlinger, der kan gennemf\u00f8res
  for at opn\u00e5 succes med den employer brand strategi, der pr\u00e6senteres i
  kapitel 6. Dette kapitel rundes af med de faldgruber, som kan have negative konsekvenser
  for virksomheden og dens employer brand.\\n\\n5.2 Success med employer branding\\n\\nFor
  at RHP kan f\u00e5 succes med en employer branding strategi, skal det v\u00e6ret
  et m\u00e5l, at virksomheden udf\u00f8rer best practices, for derefter at g\u00f8re
  omverdenen opm\u00e6rksom herp\u00e5 og dermed v\u00e6re den virksomhed, som alle
  benchmarker med (Sullivan, 2004). N\u00e5r denne m\u00e5ls\u00e6tning er opn\u00e5et,
  er det vigtigt, at blive ved med at m\u00e5le og vurdere p\u00e5 employer brandet,
  da det skal ses som v\u00e6rende dynamisk med sine omgivelser, og derfor hele tiden
  skal tilpasses.\\n\\nF\u00f8r virksomheden kan komme til det ovenst\u00e5ende punkt,
  er der nogle tiltag, som skal gennemf\u00f8res. Disse tiltag kategoriseres ud fra
  tre dimensioner, skal, b\u00f8r og kan. Det vil sige, at det er anbefalinger, som
  virksomheden skal f\u00f8lge, b\u00f8r f\u00f8lge og kan f\u00f8lge, for at den
  opn\u00e5r den beskrevne succes med employer brandet.\\n\\n5.2.1 SKAL\\n\\n1. Der
  skal udarbejdes en corporate brand strategi for RHP. Begrundelsen herfor findes
  i kapitel 4, hvor unders\u00f8gelsen viste, at virksomhedens image er meget svagt.
  Desuden beskriver teorien, at bare fordi virksomheden befinder sig i den offentlige
  sektor, anses det ikke l\u00e6ngere for at v\u00e6re en begrundelse for ikke at
  brande sig (Temporal, 2014). Fordelen ved at udarbejde en corporate brand strategi
  er, at det vil v\u00e6re med til styre virksomhedens image i en positiv retning,
  hvilket kan f\u00f8re til to yderligere fordele; 1. tiltr\u00e6kning af nye medarbejdere
  (Backhaus & Tikoo, 2004) samt 2. til\\n\\n\u00f8konomisk donation (Temporal, 2014),
  der skal anvendes i henhold til visionerne, da det er vigtigt at have kontinuitet.\\n2.
  Der skal fokus p\u00e5 den eksterne branding. Med det menes, at det er virksomhedens
  corporate brand, som skal eksponeres for at st\u00f8tte og styrke employer brandet
  (Backhaus & Tikoo, 2004). Herindunder skal stillingsannoncerne ogs\u00e5 markedsf\u00f8res
  ligesom et produkt (Wilden et al, 2010), igen for at tiltr\u00e6kke nye medarbejdere.
  Corporate brand strategien og den eksterne branding skal i denne sammenh\u00e6ng
  ses som st\u00f8tteaktiviteter for employer brandet, der ikke vil f\u00e5 succes,
  uden at der bliver ydet en indsats p\u00e5 dette omr\u00e5de.\\n3. Der skal fokus
  p\u00e5 centrene Hvidovre og Glostrup, s\u00e5 de ikke udskiller sig s\u00e5 markant,
  som unders\u00f8gelsen viser. Dette kan g\u00f8res ved at kopiere ledelsesstilen
  fra centrene Amager og Bispebjerg. Det n\u00e6vnes blandt andet i unders\u00f8gelsen,
  at der er en leder p\u00e5 Bispebjerg, som har til m\u00e5l, at alle praktikanter
  skal ans\u00e6ttes i virksomheden efter, at uddannelsen er afsluttet. Det kunne
  indf\u00f8res, at alle ledere skal have det m\u00e5l. Desuden skal disse centre
  prioriteres h\u00f8jt, n\u00e5r faciliteterne skal opdateres i henhold til visionerne.\\n4.
  Der skal v\u00e6re fokus p\u00e5 at indf\u00f8re anerkendelse i hverdagen, da unders\u00f8gelsen
  viste mangel p\u00e5 denne adf\u00e6rd, idet dette er en del af virksomhedens EVP,
  og if\u00f8lge teoretikerne skal der v\u00e6re fokus p\u00e5 netop virksomhedens
  EVP i en employer branding strategi (Mosley, 2007) (Larsen, 2006). Desuden anses
  det for at v\u00e6re en af motivationsfaktorerne for plejepersonalet. Se kapitel
  2 for uddybelse (OAO). Implementering af anerkendelse i adf\u00e6rden skal ske via
  mellemlederne ude p\u00e5 de forskellige centre (Johnson et al, 2006, s. 521).\\n5.
  L\u00f8bende skal alle aktiviteter, der har relation til employer brandet m\u00e5les
  og vurderes for at kunne v\u00e6re sikker p\u00e5, at alt er up to date. Begrundelsen
  for dette er, at brandet anses som v\u00e6rende dynamisk og dermed skal tilpasses
  omgivelserne (Paul Temporal, 2014) (Sullivan, 2004).\\n6. Det allervigtigste, som
  RHP skal er at huske, at lige meget hvilken strategi der bliver valgt, skal det
  kunne afspejles i organisationen. WALK THE TALK!\\n\\n5.2.2 B\u00d8R\\n\\n1. HR
  b\u00f8r have en rolle i rekrutteringsprocessen, og den v\u00e6sentligste begrundelse
  for dette er, at de skal have overblik over ressourcefordelingen, s\u00e5ledes at
  for eksempel Hvidovre, der har mange sv\u00e6rt syge patienter, der kr\u00e6ver
  pleje fra personale med erfaring, ikke kun f\u00e5r nyuddannet personale.\\n2. Mellemledere,
  der deltager i ans\u00e6ttelsesudvalget, b\u00f8r komme p\u00e5 kursus/workshops
  i, hvordan man rekrutterer fra A til Z.\\n\\n3. Rekrutteringsguiden b\u00f8r laves
  om til retningslinjer, for at sikre en mere ensartet rekruttering, der efterlader
  et positivt indtryk hos ans\u00f8geren. P\u00e5 den m\u00e5de sikres det ogs\u00e5,
  at der ikke kommer patienter med til jobsamtalerne.\\n4. Vejledning om stillingsannoncerne
  b\u00f8r ligeledes laves om til retningslinjer.\\n\\n5.2.3 KAN\\n\\n1. RHP kan lave
  henvisningsprogrammer, hvor ansatte, der henviser en ny medarbejder, f\u00e5r en
  eller anden form for bel\u00f8nning. P\u00e5 den m\u00e5de kan virksomheden skabe
  et st\u00e6rkt image, da word of mouth er den mest trov\u00e6rdige kilde.\\n\\n5.3
  Konsekvensen af ikke at f\u00f8lge anbefalingerne\\n\\nHvis RHP ikke som minimum
  f\u00f8lger anbefalingerne, der er beskrevet med skal, kan det f\u00e5 negative
  konsekvenser for virksomheden. Begrundelsen herfor skal findes i de fordomme, der
  er ved at arbejde med psykisk syge. Disse fordomme er beskrevet i kapitel 4. Og
  sammenholdes disse med skr\u00e6mmeeksemplet fra kapitel 2, omhandlende skolereformen,
  kan en konsekvens v\u00e6re, at der vil komme en eller anden form for reform, der
  bliver bestemt af politikerne/regeringen, og som kan have negative konsekvenser
  for RHP som arbejdsplads og dermed deres evne til at tiltr\u00e6kke nye medarbejdere.\\n\\nHvis
  virksomheden ikke eksister i den brede befolknings bevidsthed, og fagomr\u00e5det
  er forbundet med fordomme, kan det v\u00e6re baggrunden for politisk indgriben p\u00e5
  omr\u00e5det. Ligesom med skolereformen er det jo et fagomr\u00e5de, der ber\u00f8rer
  mange danskere, der enten selv er psykisk syge eller har familie, venner eller bekendte
  der er psykisk syge eller p\u00e5 anden m\u00e5de er ber\u00f8rt af det. Derfor
  er det ogs\u00e5 et omr\u00e5de, som mange har en mening om. Et politisk indgreb,
  kan have gode intentioner, men p\u00e5virker personalet og employer branding meget
  negativt.\\n\\n6 Konklusion\\n\\nI gennem hele denne afhandling har omdrejningspunktet
  v\u00e6ret, hvordan en employer branding strategi skal sammens\u00e6ttes for virksomheden
  RHP, s\u00e5 der skabes konkurrencefordele i rekrutteringsprocessen. I den forbindelse,
  er det via en teoretisk gennemgang af emnet employer branding blevet skitseret,
  hvilken sammenh\u00e6ng, der er mellem en employer branding strategi og alle de
  omkringliggende aktiviteter samt, hvordan de p\u00e5virkes og p\u00e5virker hinanden.
  I teorien argumenteres der for sammenh\u00e6ngen mellem en virksomheds corporate
  brand og employer brand. Corporate brandet er grobunden for virksomhedens image,
  som er virksomhedens omd\u00f8mme i den offentlige befolkning og bliver fremf\u00f8rt
  via ekstern branding. Desuden siger teorien, at hvis en virksomhed skal skabe konkurrencefordele,
  skal der udarbejdes branding strategier, der skal gennemsyre hele virksomheden.
  Og disse branding strategier skal vise et retvisende billede af virksomheden for
  at skabe trov\u00e6rdighed, loyalitet, engagement fra medarbejderne samt at \u00f8ge
  produktiviteten. Desv\u00e6rre har RHP ikke udarbejdet nogle branding strategier.\\n\\nDen
  kvalitative unders\u00f8gelse, der er udarbejdet i forbindelse med denne kandidatafhandling,
  viste i imidlertid, at p\u00e5 grund af virksomhedens manglende corporate brand
  strategi og ikke mindst mangel p\u00e5 ekstern branding af virksomheden, er RHP''s
  image meget svagt. Derfor er denne afhandling kommet med en anbefaling om, at RHP
  skal udarbejde et corporate brand for derigennem at kunne styre virksomhedens omtale
  i en positiv retning, da det vil v\u00e6re med til at tiltr\u00e6kke potentielle
  medarbejdere i fremtiden og dermed v\u00e6re et vigtigt element i en employer branding
  strategi.\\n\\nDa platformen for en employer branding strategi skal udarbejdes ud
  fra virksomhedens DNA, der best\u00e5r af det felt, som er f\u00e6lles for virksomhedens
  identitet, profil og image, og da virksomhedens image er meget svagt, skal der ses
  n\u00e6rmere p\u00e5 de positive elementer, som identiteten og profilen har tilf\u00e6lles.
  Det er inden for denne platform, at RHP skal skabe sit employer brand og udarbejde
  et employer brand equity.\\n\\nUnders\u00f8gelsen viste, at virksomhedens identitet
  skal findes i;\\n\\n* Det h\u00f8je faglige niveau som hersker p\u00e5 arbejdspladsen\\n*
  Kommunikationen der er med patienter og kollegaer \u2013 det springer ud af arbejdsgangen
  og g\u00f8r, at der er diversitet, hvilket differentierer arbejdspladesen fra den
  somatiske verden\\n* Mulighed for at udvikle sig i gennem efteruddannelse \u2013
  hvilket ogs\u00e5 differentierer arbejdspladesen fra den somatiske verden\\n* En
  arbejdsplads hvor der er forskel p\u00e5 de forskellige centre - medarbejderne oplever,
  at der er stor forskel p\u00e5 tilg\u00e6ngelige ressourcer p\u00e5 centrene\\n*
  En arbejdsplads hvor det administrative personale opleves som distanceret fra resten
  af virksomheden\\n\\nVirksomhedens profil viste sig ved unders\u00f8gelsen at best\u00e5
  af nedenst\u00e5ende punkter. Med andre ord er der sammenh\u00e6ng mellem virksomhedens
  visioner og adf\u00e6rden i virksomheden p\u00e5 f\u00f8lgende omr\u00e5der:\\n\\n*
  Patienten og mennesket er i centrum\\n* Der udvises h\u00f8j faglighed blandt medarbejderne\\n*
  Nogle steder er der tidssvarende fysiske rammer \u2013 andre steder anses det som
  v\u00e6rende et indsatsomr\u00e5de, hvilket skal kommunikeres ud til medarbejderne
  p\u00e5 de ber\u00f8rte centre\\n* P\u00e5 to centre, Glostrup og Hvidovre, bliver
  v\u00e6rdier og visioner sat tilsidesat i en fortravlet hverdag\\n\\nUnder virksomhedens
  profil h\u00f8rer EVP, og unders\u00f8gelsen viste, at RHP''s EVP er:\\n\\n* Mulighed
  for udvikling, efteruddannelse og l\u00f8nforhold, der af medarbejdere med indblik
  i l\u00f8nforholdende i den somatiske verdens, vurderes at v\u00e6re gunstige (medarbejderne
  bliver afl\u00f8nnet efter deres kompetencer).\\n* RHP skal fokusere p\u00e5 at
  f\u00e5 anerkendelse og ansvar ind i adf\u00e6rden i hverdagen.\\n\\nDet betyder,
  at de punkter som virksomhedens profil og identitet har til f\u00e6lles, er virksomhedens
  DNA og alle elementerne har karakter af, at kunne betegnes som virksomhedens EVP.
  Som det er beskrevet i teorien, skal employer brand equity (det \u00f8nskede outcome
  af virksomhedens employer brand) tage udgangspunkt i denne platform for derigennem
  at \u00f8ge fastholdelse af medarbejderne og dermed neds\u00e6tte personaleoms\u00e6tningen.
  RHP''s employer brand equity er p\u00e5 nuv\u00e6rende tidspunkt at kunne tiltr\u00e6kke
  plejepersonale, der kan identificere sig med virksomheden.\\n\\nUd fra dette ses
  det, at RHP''s employer branding skal tage udgangspunkt i at v\u00e6re en arbejdsplads
  der s\u00e6tter mennesket i centrum, hvilket kommer til udtryk via arbejdsgangen,
  der er pr\u00e6get af kommunikation og diversitet. Medarbejderne i RHP besidder
  et h\u00f8jt fagliget niveau, som udvikles p\u00e5 baggrund af de muligheder, som
  virksomheden stiller til r\u00e5dighed i form af efteruddannelse. Desuden tilbyder
  virksomheden \u00f8konomisk kompensation for de kompetencer, som medarbejderne besidder.\\n\\nFor
  at dette skal oms\u00e6ttes til en konkurrencem\u00e6ssig fordel i rekrutteringsprocessen,
  skal det inkorporeres internt i virksomheden og gennemsyre kulturen via intern branding.
  Da alle elementerne er taget ud fra den allerede eksisterende kultur i virksomheden,
  men ikke er repr\u00e6senteret i samme grad alle steder, skal der s\u00e6ttes fokus
  p\u00e5 implementering p\u00e5 Glostrup og Hvidovre, hvor visionerne og v\u00e6rdigrundlaget
  ikke er gennemtr\u00e6ngende nok i kulturen. Pr\u00e6sentationen af employer brandet
  og det v\u00e6rdiggrundlag, som det er udarbejdet ud fra skal, skal systematisk
  freml\u00e6gges for medarbejderne, og dette er mellemlederens opgave. Derfor skal
  mellemledere i hele virksomheden p\u00e5 workshops, hvor form\u00e5let er at give
  dem v\u00e6rkt\u00f8jer og viden til at gennemf\u00f8re implementeringen. Form\u00e5let
  med den ovenfor beskrevne interne branding er at skabe en\\n\\nst\u00e6rk workforce,
  som er sv\u00e6rt at efterligne, og s\u00f8rge for, at b\u00e5de nye og etablerede
  medarbejdere bliver ved med at forst\u00e5 virksomhedens employer brand.\\n\\nDen
  eksterne branding af RHP''s employer brand har til form\u00e5l at tiltr\u00e6kke
  potentielle medarbejdere, der s\u00e5 skal v\u00e6re med til at forst\u00e6rke virksomhedens
  image. Det mest effektive kommunikationsv\u00e6rkt\u00f8j til ekstern branding af
  employer brandet er word of mouth, og derfor forsl\u00e5s det, at der kan laves
  et henvisningsprogram, hvor eksisterende medarbejdere f\u00e5r en eller anden form
  for bel\u00f8nning, hvis de henviser en potentiel medarbejder. P\u00e5 den m\u00e5de
  sikrer RHP ekstern branding fra den mest trov\u00e6rdige kilde, og dermed p\u00e5virkes
  tiltr\u00e6kningskraften positivt. Da det ikke er muligt at basere al ekstern branding
  i rekrutteringsprocessen p\u00e5 netv\u00e6rk (word of mouth), skal der s\u00e6ttes
  fokus p\u00e5 elementer som stillingannoncer. Til udarbejdelse af disse har RHP
  udarbejdet et inspirationskatalog. Denne afhandling anbefaler dog, at inspirationskataloget
  b\u00f8r laves om til retningslinjer, der mere dybdeg\u00e5ende beskriver v\u00e6rdien
  i at fremh\u00e6ve RHP''s v\u00e6rdigrundlag og visioner i stillingannoncerne.\\n\\nRHP
  har udarbejdet en Rekrutteringsguide, der har til form\u00e5l at v\u00e6re inspirationskatalog
  for ans\u00e6ttelsesudvalgene, der h\u00e5ndterer rekruttering ude p\u00e5 centrene
  i rekrutteringsprocessen. Unders\u00f8gelsen viste, at ikke alle ans\u00e6ttelsesudvalg
  klarer opgaven lige godt, da ans\u00f8gerne oplever, at der er flere, der ikke forbereder
  sig og dermed efterlader et akavet indtryk, der ikke er i overensstemmelse med ovenst\u00e5ende
  employer branding strategi samt virksomhedens v\u00e6rdiggrundlag og visioner. P\u00e5
  den baggrund b\u00f8r Rekrutteringsguiden laves om til retningslinjer, og en HR
  medarbejder b\u00f8r inddrages i rekrutteringen, for at sikre en professionel h\u00e5ndtering
  af forl\u00f8bet.\\n\\nBegrundelsen for, at den interne og eksterne branding af
  employer brandet till\u00e6gges s\u00e5 stor betydning, er at det er vigtigt for
  en servicevirksomhed som RHP, at medarbejderne skal kunne spejle sig i virksomhedens
  visioner og v\u00e6rdiggrundlag, da disse anses som v\u00e6rende virksomhedens ansigt
  udadtil. P\u00e5 den m\u00e5de vil medarbejderen lettere kunne sende det rigtige
  signal til patienter og p\u00e5r\u00f8rende, der kan best\u00e5 af potentielle fremtidige
  medarbejdere. Det handler med andre ord om at udsende et positivt budskab om virksomheden
  som arbejdsplads til omverdenen.\\n\\n7 Litteraturliste\\n\\n7.1 Videnskabelige
