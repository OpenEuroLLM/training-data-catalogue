  kan henvende sig til Mikkel.\\n\\nBenyttelsen af de \u201csorte skure\u201d blev
  dr\u00f8ftet.\\n\\nDa ikke flere \u00f8nskede ordet, h\u00e6vede dirigenten generalforsamlingen
