  var genvalg af DEAS A/S.\\n\\n10. Eventuelt.\\n\\nEt medlem er ved at unders\u00f8ge
  muligheden for at etablere ekstra altaner. N\u00e6rmere vil f\u00f8lge. Hvis myndighederne
  giver lov, vil forslag herom blive fremlagt p\u00e5 en generalforsamling.\\n\\nMikkel
