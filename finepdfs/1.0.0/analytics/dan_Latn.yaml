  pkt. 2: Vedt\u00e6gts\u00e6ndring vedr. vedligeholdelse af andelen:\\nVedt\u00e6gternes
  \u00a710 stk. 1. \u00e6ndres fra:\\nDen enkelte andelshaver har pligt til at vedligeholde
  lejligheden med maling, hvitning og tapetsering samt \u00f8vrige vedligeholdelsesarbejder,
  som p\u00e5hviler en lejer i henhold til lejeloven, eller som efter s\u00e6rlig
  generalforsamlingsbeslutning er p\u00e5lagt andelshaverne.\\n\\ntil:\\nAl vedligeholdelse
  inde i boligen p\u00e5hviler andelshaveren, bortset fra vedligeholdelse af f\u00e6lles
