  509\"", "\"Peter Khallash Bengtsen Kontor for livslang l\u00e6ring firstname.lastname@example.org\\n\\n29.oktober
  2008\\n\\nH\u00f8ringssvar vedr. forslag til etablering af en dansk kvalifikationsramme
  for livslang l\u00e6ring\\n\\nDansk Folkeoplysnings Samr\u00e5d (DFS) takker for
  muligheden for at frems\u00e6tte synspunkter vedr. forslaget til etablering af en
  national dansk kvalifikationsramme (NQF) og \u00f8nsker at tilkendegive f\u00f8lgende
  synspunkter:\\n\\nSom paraplyorganisation for de folkeoplysende skoleformer, der
  udg\u00f8r rammen om en v\u00e6sentlig del af den ikke-formelle l\u00e6ring blandt
  unge og voksne, st\u00f8tter DFS tiltag, der kan fremme borgernes muligheder for
  at deltage i livslang l\u00e6ring. Udviklingen af en f\u00e6lles referenceramme
  er som udgangspunkt en god id\u00e9, der kan fremme mobilitet og fleksibel adgang
  til formel uddannelse nationalt og internationalt via en f\u00e6lles europ\u00e6isk
  kvalifikationsramme (EQF).\\n\\nDen l\u00e6ringsforst\u00e5else, der defineres i.f.m.
  EQF, nemlig at \\\"l\u00e6ringsudbytte (er) en beskrivelse af, hvad en studerende/
  elev ved, forst\u00e5r og er i stand til at udf\u00f8re som et resultat af en l\u00e6reproces.
  EQF l\u00e6gger dermed v\u00e6gt p\u00e5 resultatet af l\u00e6ring i stedet for
  at fokusere p\u00e5 indholdet i uddannelsen eller dens l\u00e6ngde (jf faktaboks
  s.3). l\u00e6gger op til at inddrage ogs\u00e5 ikke-formelt l\u00e6ringsudbytte.\\n\\nDFS
  kunne derfor \u00f8nske en tydeligg\u00f8relse af at der netop er flere adgangsveje
  til at n\u00e5 et givet niveau og dermed en tydeligg\u00f8relse af at kvalifikationsrammen
  kan underst\u00f8tte borgernes mulighed for at f\u00e5 vurderet og anerkendt deres
  realkompetencer udviklet i s\u00e5vel arbejdsliv som i 3. sektor.\\n\\nDFS hilser
  det velkomment at samtlige niveauer og typer af formel voksenuddannelse vil blive
  beskrevet i form af l\u00e6ringsudbytte, idet det netop vil styrke samspillet mellem
  formel og ikke-formel l\u00e6ring.\\n\\nDFS finder det relevant yderligere at afs\u00f8ge
  mulighederne for at relatere l\u00e6ringsudbytte fra de folkeoplysende skoleformer
  i forhold til kvalifikationsrammen (b\u00e5de NQF og EQF), idet vi umiddelbart finder
  begrebsbrugen anvendelig til niveaubeskrivelser af vores l\u00e6ringsaktiviteter
  i form af hhv. viden, f\u00e6rdigheder og kompetencer. Disse kan s\u00e5 via realkompetencevurdering
  i forhold til en given formel uddannelse evt. anerkendes og oms\u00e6ttes til kompetencebeviser
  eller uddannelsesbeviser.\\n\\nMed venlig hilsen\\n\\nHenrik Christensen Sekretariatsleder\\n\\nDanish
  Adult Education Association\\n\\nGI. Kongevej 39 E, 2.tv. DK 1610 K\u00f8benhavn
