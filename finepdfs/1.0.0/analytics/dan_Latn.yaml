  "\"Sk\u00e6lsk\u00f8r Amat\u00f8r-Sejlklub\\n\\nBestyrelsesm\u00f8de i SAS 19.august.
  2013. kl. 18:30\\n\\nDagsorden.\\n\\n1. Meddelelser v. formanden.\\n2. Godkendelse
  af dagsorden.\\n3. Regnskab.\\n4. Klubhus.\\n5. Kapsejlads.  a, Harboe Cup.\\n6.
  Broudvalg. a, Flagmast. b, Elm\u00e5lere.\\n7. Juniorudvalg.\\n8. Multirum.\\n9.
  Evt.\\n10. Punkter til n\u00e6ste m\u00f8de.\\n11. Dato for n\u00e6ste m\u00f8de.\\n\\nAfbud
  : Peder\\n\\n1. Formanden fortalte at vi har haft en del g\u00e6stesejlere i sommer,
  dog f\u00e6rre end sidste \u00e5r. ca halvdelen frihavnsg\u00e6ster.K\u00f8leskabet
  i forgangen er skiftet.\\n2. Godkendt.\\n3. Godkendt\\n4. Klubhuset er udlejet 4
  gange i efter\u00e5ret. Formanden berettede om hovmester-sagen.\\n\\nBestyrelsen
  henviser til vedt\\n\\n\u00e6\\n\\ngterne ang\\n\\n\u00e5\\n\\nende indkaldelse
  til ekstraordin\\n\\n\u00e6\\n\\nr generalforsamling.\\n\\n5. Klubmesterskab 31.aug,
  alle er velkomne. Jazz vandt DM for bb10, tillykke. Claus fremlagde budget for Harboe
  Cup. Hj\u00e6lper-staben er ved at v\u00e6re p\u00e5 plads.\\n6. Formanden er ved
  at samle et team til at give flagmasten en overhaling. Bestyrelsen lukker elm\u00e5lersagaen,
  der er kommet de forn\u00f8dne tilsagn fra vores forsikringsselskab. Der vil blive
  indf\u00f8rt ny tekst i havnereglementet ang\u00e5ende elforbrug. Der neds\u00e6ttes
  et udvalg ang\u00e5ende estakaderne/flydebro. Jan og Ole  deltager i udvalget, og
  udpeger \u00f8vrige deltagere. Der p\u00e5t\u00e6nkes indkaldelse til medlemsarbejdsdag
  i f\u00f8rste halvdel af september, mere f\u00f8lger.\\n\\nSk\u00e6lsk\u00f8r Amat\u00f8r-Sejlklub\\n\\n7.
  Lodsbroturen er veloverst\u00e5et. Udskiftning i tr\u00e6nerstaben, velkommen tilbage
  til Anna. De st\u00f8rste s\u00f8stjerner er ved at rykke op i optimistgruppen.\\n8.
  Byggetilladelsen til multirummet er kommet fra kommunen. Der arbejdes videre mod
  indhentelse af tilbud. Der arrangeres omflytning af kapsejladsudstyr til det gamle
  jollemasteskur for at frig\u00f8re plads til fritidsfiskernes udstyr. S\u00f8ges
  n\u00e5et inden standernedhaling.\\n9. Dato for standernedhaling vil blive oplyst
  p\u00e5 hjemmesiden. Formanden fors\u00f8ger at finde en ny tovholder til vinteropbevaring
  af b\u00e5de p\u00e5 parkeringspladsen. Per bliver formand for udvalget ang\u00e5ende
  100 \u00e5rs jubil\u00e6umskrift. Ole arbejder p\u00e5 udarbejdelse af skilt p\u00e5
  klubhuset. 10.\\n11. 25.sep\"", "\"Forslag til \u00e6ndring af vedt\u00e6gternes
  \u00a7 7 og 17 i henhold til den nye lov om l\u00e5n i andele.\\n\\nDen nuv\u00e6rende
  vedt\u00e6gts \u00a7 7, stk. 2, 1. og 2. punktum:\\n\\\"Andelen i foreningens formue
  kan ikke g\u00f8res til genstand for arrest eller eksekution. Andelen kan ikke pants\u00e6ttes
  og ikke bel\u00e5nes, og der kan ikke gives transport i et eventuelt tilgodehavende
  eller en overdragelse, som endnu ikke er aftalt. Der kan heller ikke anvises eller
  meddeles fuldmagt for nogen anden end andelshaveren til at modtage og kvittere for
  afregning af et s\u00e5dant tilgodehavende.\\\"\\n\\n\u00c6ndres til:\\n\\\"Andelen
  kan bel\u00e5nes i overensstemmelse med reglerne i andelsboligforeningsloven. Foreningen
  kan kr\u00e6ve, at andelshaveren betaler gebyr for afgivelse af erkl\u00e6ring i
  henhold til andelsboligforeningslovens \u00a7 4a. Der kan ikke gives transport i
  et eventuelt tilgodehavende efter en overdragelse, som endnu ikke er aftalt. Der
  kan heller ikke anvises eller meddeles fuldmagt for nogen anden end andelshaveren
  til at modtage og kvittere for afregning af et s\u00e5dant tilgodehavende.\\\"\\n\\nResten
  af \u00a7 7 forbliver u\u00e6ndret.\\n\\nDen nuv\u00e6rende vedt\u00e6gts \u00a7
  17:\\n\\\"Erhververen af en andel, hvortil der alene er knyttet retten til en bolig,
  kan forlange, at foreningen yder en garanti for l\u00e5n i et pengeinstitut til
  delvis d\u00e6kning af den del af prisen, der betales for andelen i foreningens
  formue. Garantien ydes til 60% af den del af prisen for andelen i foreningens formue,
  der overstiger kr. 40.000,00. Det garanterede l\u00e5n skal afdrages over maksimalt
  15 \u00e5r og forfalder ved videresalg af andelen. Udeblivelse af betaling af renter
  og afdrag p\u00e5 det garanterede l\u00e5n betragtes som misligholdelse med betaling
  af boligafgift og kan medf\u00f8re eksklusion og oph\u00e6velse af brugsretten til
  boligen. Uanset ovenst\u00e5ende er foreningen ikke forpligtet til at stille garanti
  p\u00e5 vilk\u00e5r, der er mere byrdefulde for foreningen, end hvad den til enhver
  tid g\u00e6ldende lovregel herom m\u00e5tte p\u00e5kr\u00e6ve.\\\"\\n\\n\u00c6ndres
  til:\\n\\\"I tilf\u00e6lde af, at foreningen i henhold til tidligere regler i vedt\u00e6gterne
  og andelsboligforeningsloven har afgivet garanti for l\u00e5n til delvis finansiering
  af en overdragelsessum, og l\u00e5ntager ikke betaler renter og afdrag rettidigt,
  skal l\u00e5ngiver underrette foreningen skriftligt om restancen. Bestyrelsen skal
  i s\u00e5 fald sende skriftligt p\u00e5krav til l\u00e5ntager om berigtigelse af
  restancen inden en angiven frist p\u00e5 4 dage.\\n\\nS\u00e5fremt restancen berigtiges
  inden fristens udl\u00f8b, skal l\u00e5ngiver v\u00e6re forpligtet til at lade l\u00e5net
  blive st\u00e5ende som oprindeligt aftalt. S\u00e5fremt restancen ikke berigtiges
  inden fristens udl\u00f8b, kan bestyrelsen ekskludere l\u00e5ntageren af foreningen
  og bringe hans brugsret til oph\u00f8r i overensstemmelse med reglerne i \u00a7
  24 om eksklusion.\\\"\\n\\nTILL\u00c6G\\nTIL VEDT\u00c6GTERNE FOR\\nANDELSBOLIGFORENINGEN
  ISTEDGADE 87/SAXOGADE 86-90\\n\\n2006\\n\\nL\u00e5ngiver kan f\u00f8rst rejse krav
  mod foreningen i henhold til garantien, n\u00e5r overdragelsessummen for salg af
  boligen er indbetalt, men dog senest 6 m\u00e5neder efter, at skriftlig underretning
  om restancen er givet. Garantien kan kun g\u00f8res g\u00e6ldende for det bel\u00f8b,
  som restg\u00e6lden eller l\u00e5neaftalen skulle udg\u00f8re, da underretning om
  restancen blev givet med till\u00e6g af 6 foreg\u00e5ende m\u00e5nedsydeler og med
  till\u00e6g af rente af de n\u00e6vnte bel\u00f8b.\\\"\\n\\n\u00a7 22, stk. 2 forbliver
  indtil videre u\u00e6ndret.\\n\\nVedt\u00e6gternes \u00a710 stk. 1. \u00e6ndres
  fra:\\nDen enkelte andelshaver har pligt til at vedligeholde lejligheden med maling,
  hvidtning og tapetsering samt \u00f8vrige vedligeholdelsesarbejder, som p\u00e5hviler
  en lejer i henhold til lejeloven, eller som efter s\u00e6rlig generalforsamlingsbeslutning
  er p\u00e5lagt andelshaverne.\\n\\ntil:\\nAl vedligeholdelse inde i boligen p\u00e5hviler
  andelshaveren, bortset fra vedligeholdelse af f\u00e6lles forsyningsledninger, udskiftning
  af centralvarmeanl\u00e6g, radiatorer incl. ventil\u00f8r, udskiftning af vinduer
  samt udvendige d\u00f8re, herunder d\u00f8re fra trappe og ind til lejligheden.\\n\\nAndelshaverens
  vedligeholdelsesplicht omfatter ogs\u00e5 eventuelle n\u00f8dvendige udskiftninger
  af bygningsdele og tilbeh\u00f8r til boligen, s\u00e5som f.eks. udskiftning af gulve
  og k\u00f8kkenborde. Andelshaverens vedligeholdelsesplicht omfatter ogs\u00e5 forringelse,
  som skyldes slid og \u00e6ldelse.\\n\\nOm overdragelse af andele\\n\u00a7 14, stk
  2. Som den lyder nu:\\nAndre andelshavere har dern\u00e6st fortrinsret. R\u00e6kkef\u00f8lge
  g\u00e5r efter anciennitet i foreningen. Dog har andelshavere, som \u00f8nsker at
  overtage en ledig nabolejlighed i samme opgang med henblik p\u00e5 sammenl\u00e6gning
  fortrinsret, uanset anciennitet. Sammenl\u00e6gningen skal foreg\u00e5 efter anvisningerne
  i \u00a7 11. Overholdes betingelserne ikke, vil tilladelse blive trukket tilbage,
  og nabolejligheden vil blive tilbudt til de \u00f8vrige berettigede.\\n\\n\u00c6ndringsforslag\\n\u00a7
  14, stk 2.\\nAndre andelshavere har dern\u00e6st fortrinsret. R\u00e6kkef\u00f8lge
  g\u00e5r efter anciennitet i foreningen. Dog har andelshavere, som \u00f8nsker at
  overtage en ledig nabolejlighed, underbo, overbo eller nabolejlighed i naboopgang,
  med henblik p\u00e5 sammenl\u00e6gning fortrinsret, uanset anciennitet dog s\u00e5ledes,
  at \\\"enkeltelejligheder har fortrinsret. Skulle flere berettigede v\u00e6re interessererede
  i lejligheden, overdrages lejligheden dog efter anciennitet i foreningen. Sammenl\u00e6gningen
  skal foreg\u00e5 efter anvisningerne i \u00a711. Overholdes betingelserne ikke,
  vil tilladelse blive trukket tilbage, og nabolejligheden vil blive tilbudt til de
  \u00f8vrige berettigede.\\n\\nS\u00e5ledes vedtaget p\u00e5 foreningens ordin\u00e6re
  generalforsmaling\\n6. april 2004.\\n\\nTILL\u00c6G\\nTIL VEDT\u00c6GTERNE FOR\\nANDELSBOLIGFORENINGEN
  ISTEDGADE 87/SAXOGADE 86-90\\n\\n2006\\n\\nad dagsordenens pkt. 1: Vedt\u00e6gts\u00e6ndring
