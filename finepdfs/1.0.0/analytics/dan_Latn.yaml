  16   4,95 km\\n\\nStartet : 2   Udg\u00e5et : 0   Disk.: 0\"", "\"Bilag til nyheden
  om gasledningen \\\"Nord Stream 2\\\" fra Rusland til Tyskland.\\n\\nBeregning af
  de n\u00e6vnte tal for gassens d\u00e6kning og den udsendte CO2:\\n\\n**\\n\\nDe
  to r\u00f8rledninger leverer tilsammen 55 mia m 3 gas/\u00e5r. Br\u00e6ndv\u00e6rdi
  for metan: ca. 38 MJ/m 3\\n\\nEnergiindholdet er derfor 55 * 10^9 m\\n\\n3\\n\\n/\u00e5r
  * 38 * 10^6 MJ/m\\n\\n3\\n\\n= 2,1 * 10^12 MJ/\u00e5r.\\n\\nDa 1 kWh = 3,6 MJ, svarer
  det til:  2,1 * 10^12 MJ/\u00e5r / 3,6 * 10^6 MJ/kWh = 0,58 * 10^12 kWh/\u00e5r.\\n\\nTil
  sammenligning leverer et 1000 MW kraftv\u00e6rk med lastfaktor 0,9 \u00e5rligt:\\n\\n1000
  MW * 365 d\u00f8gn * 24 timer * 0,9 = 7,9 * 10^6 MWh/\u00e5r = 7,9 * 10^9 kWh/\u00e5r.\\n\\nHvis
  al gassen benyttes til elproduktion, kan den med en virkningsgrad p\u00e5 0,45 producere:\\n\\n0.58
  * 10^12 * 0,45 = 261 * 10^9 kWh/\u00e5r.\\n\\nGassen kan alts\u00e5 erstatte:  261/7,9
  =  ca. 33 kraftv\u00e6rker p\u00e5 hver 1000 MWe.\\n\\nHvis gassen benyttes til
  varmeform\u00e5l, f.eks. boligopvarmning, hvor virkningsgraden er ca. 90 %, er ydelsen
  ca. dobbelt s\u00e5 stor.\\n\\nDen faktiske d\u00e6kning ligger derfor et sted imellem
  disse to tal.\\n\\n**\\n\\nDen m\u00e6ngde CO2, der dannes ved forbr\u00e6nding
  af gassen beregnes:\\n\\nGassen (metan) har massefylde:  0,720 kg/m3.\\n\\nMetan
  er CH4\\n\\nmed molv\u00e6gt:  12 + 4 * 1 = 16  og  CO2 har molv\u00e6gt:  12 +
  2 * 16 = 44.\\n\\nVed forbr\u00e6ndingen:  CH4 + 2 O2 => CO2 + 2 H2O  f\u00e5s alts\u00e5
  44 g CO2 for hver 16 g CH4.\\n\\nCO2 udsendt pr \u00e5r:   55 * 10^9 m 3 * 0,720
  kg/m 3 * 44 g CO2/16 g CH4 = 109 mia kg CO2 mio ton CO2/\u00e5r.\\n\\n/\u00e5r =
  109\\n\\nDet er ca. tre gange Danmarks indenlandske CO2-udslip.\\n\\nKlimam\u00e6ssigt
  udleder gas meget mindre CO2 end kul og olie, men meget  mere end atomkraft, vandkraft,
  vindkraft og solceller.\"", "\"RAPPORTSKEMA\\n\\n(til brug for afl\u00e6ggelse af
  rapport for pulje C-bevillinger)\\n\\nC3: Web mv.\"", "\"NOTAT\\n\\nListe over ghettoomr\u00e5der
  pr. 1. december 2016\\n\\nI henhold til almenboligloven beregner og offentligg\u00f8r
  transport-, bygnings- og boligministeren hvert \u00e5r den 1. december en liste
  over ghettoomr\u00e5der.\\n\\nListen omfatter almene boligomr\u00e5der med mindst
  1.000 beboere, der opfylder mindst 3 af f\u00f8lgende fem kriterier:\\n\\n1. Andelen
  af 18-64 \u00e5rige uden tilknytning til arbejdsmarkedet eller uddannelse overstiger
  40 pct. (gennemsnit for de seneste 2 \u00e5r).\\n2. Andelen af indvandrere og efterkommere
  fra ikke-vestlige lande overstiger 50 pct.\\n3. Antal d\u00f8mte for overtr\u00e6delse
  af straffeloven, v\u00e5benloven eller lov om euforiserende stoffer overstiger 2,70
  pct. af beboere p\u00e5 18 \u00e5r og derover (gennemsnit for de seneste 2 \u00e5r).\\n4.
  Andelen af beboere i alderen 30-59 \u00e5r, der alene har en grunduddannelse (inkl.
  uoplyst uddannelse), overstiger 50 pct. af samtlige beboere i samme aldersgruppe.\\n5.
  Den gennemsnitlige bruttoindkomst for skattepligtige i alderen 15-64 \u00e5r i omr\u00e5det
  eksklusive uddannelsess\u00f8gende er mindre end 55 pct. af den gennemsnitlige bruttoindkomst
  for samme gruppe i regionen(*).\\n\\nP\u00e5 listen pr. 1. december 2016 er der
  25 boligomr\u00e5der, hvilket er samme antal, som p\u00e5 listen i 2015. Der er
  fire nye omr\u00e5der p\u00e5 listen og fire omr\u00e5der, som forlader listen.\\n\\nFaldet
  i antallet af omr\u00e5der p\u00e5 listen skyldes prim\u00e6rt en nedgang i antallet
  af d\u00f8mte.\\n\\nModsat er det for to af fire boligomr\u00e5der lavt uddannelsesniveau,
  der er \u00e5rsagen til at omr\u00e5derne kommer p\u00e5 listen. De \u00f8vrige
  to omr\u00e5der er kommet med p\u00e5 listen p\u00e5 grund af en stigning i andelen
  af beboere med ikke vestlig baggrund og faldende indkomst.\\n\\nOmr\u00e5derne p\u00e5
  den nye liste er vist i tabel 1 nedenfor. Tabellen viser kriteriev\u00e6rdierne
  for de enkelte omr\u00e5der samt, hvilke omr\u00e5der der er nye p\u00e5 listen
  i\\n\\nDato [dato]\\n\\nJ. nr. [j.nr.]\\n\\nforhold til den foreg\u00e5ende liste.
  I tabel 2 ses de omr\u00e5der, der er udg\u00e5et af listen for 2016 i forhold til
  2015.\\n\\nBilag 1 viser, hvilke almene boligafdelinger der indg\u00e5r i boligomr\u00e5derne
  p\u00e5 listen.\\n\\n*)Danmarks Statistik har stoppet udgivelsen af den indkomstvariabel,
