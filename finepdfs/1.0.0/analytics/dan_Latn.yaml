  Vegetar\\n- Veganer\\n\\nAndre \u00f8nsker kan ligeledes tilgodeses\"", "\"\u00d8VRIGE
  G\u00c6LDENDE UDTALELSER\\n\\nI dette dokument kan I l\u00e6se alle de g\u00e6ldende
  udtalelser i Landsammenslutningen af Handelsskoleelever. Udtalelserne er alle sammen
  skrevet af elever eller elevr\u00e5d og vedtaget p\u00e5 enten en Generalforsamling
  eller en Medlemskonference. Det er muligt at stille \u00e6ndringsforslag til alle
  udtalelserne via forslagsformularen p\u00e5 www.handeselever.dk/MK2020.\\n\\nINDHOLD\\n\\nGENERALFORSAMLING
  2020\\n\\n#1 Erhvervscase\\n\\nLandssammenslutningen af Handelsskoleelever \u00f8nsker
  klarere rammer for, hvad erhvervscase skal indeholde, fordi vores oplevelse er,
  at der er meget stor forskellighed i, hvordan forl\u00f8bene tilrettel\u00e6gges
  p\u00e5 tv\u00e6rs af landet samt undervisernes v\u00e6gtning af elementer i freml\u00e6ggelsen,
  herunder ogs\u00e5 proces og samarbejde i forl\u00f8bet, samt holdninger til udformning
  af synopsis. Dette mener vi er s\u00e6rligt problematisk i lyset af, at det ved
  udtr\u00e6k til eksamen vil v\u00e6re en anden underviser end den, der har vejledt
  os, som vil skulle vurdere vores pr\u00e6station. Derfor mener vi, at det er vigtigt,
  at der p\u00e5 sigt opn\u00e5s bred enighed i l\u00e6rerkollegiet mht. udformning,
  tilrettel\u00e6ggelse og vurdering af erhvervscase. Dette kunne eksempelvis ske
  gennem dybdeg\u00e5ende dr\u00f8ftelser blandt landets undervisere eller tydeligere
  vejledninger fra Styrelsen for Undervisning og Kvalitet. Metoden dette opn\u00e5s
  p\u00e5 er som s\u00e5dan underordnet for os som elever.\\n\\nDet er ligeledes vigtigt,
  at underviserne i h\u00f8jere grad pr\u00e6senterer de faglige m\u00e5l, som vi
  forventes at im\u00f8dekomme ved forl\u00f8bets afslutning og eventuel eksamen,
  da dette vil give os bedre foruds\u00e6tninger for at tilrettel\u00e6gge vores pr\u00e6station
  p\u00e5 en m\u00e5de, der g\u00f8r det muligt for os at belyse vores evner til at
  opfylde de 8 faglige m\u00e5l, der er opstillet for erhvervscase.\\n\\nLH st\u00f8tter,
  at der i erhvervscase eksamineres gruppevis, men finder alligevel problemer med
  den nuv\u00e6rende eksamensform. Den nuv\u00e6rende eksamenstid som 20 minutter
  pr. eksaminand giver en uhensigtsm\u00e6ssig samlet l\u00e6ngde af eksamen, som
  bliver for lang for store grupper og for kort for ekstraordin\u00e6rt sm\u00e5 grupper.
  Samtidig giver eksamensformen i praksis kun begr\u00e6nset adgang til at vurdere
  eleverne individuelt, hvilket skal til for at sikre elevernes retssikkerhed.\\n\\n#2
  Studieturspolitik\\n\\nI disse dage ser vi som elever debatten omkring priser p\u00e5
  studieture rase, hvilket selvf\u00f8lgelig er en debat, som vi ogs\u00e5 har interesse
  i at tage del i, is\u00e6r efter annonceringen af B\u00f8rne- og Undervisningsministerens
  \u00f8nske om at indf\u00f8re et loft over egenbetalingen p\u00e5 studieture.\\n\\nDet
  er vigtigt for os at sl\u00e5 fast, at vi i udgangspunktet er imod enhver form for
  brugerbetaling p\u00e5 vores uddannelser, men at vi i denne sammenh\u00e6ng gerne
  vil g\u00f8re en undtagelse mht. egenbetaling p\u00e5 studieture, idet det nuv\u00e6rende
  alternativ til h\u00f8j egenbetaling p\u00e5 studieture ikke er, at staten stiller
  ressourcer til r\u00e5dighed til, at skolerne kan lappe hullet, men derimod en overh\u00e6ngende
  fare for, at vores skoler ikke l\u00e6ngere vil have mulighed for at udbyde de kvalitative
  studietursforl\u00f8b, som vi ser i dag.\\n\\nI den forbindelse er det ogs\u00e5
  vigtigt at fastsl\u00e5 den klare forskel mellem studieture, forlagt undervisning
  i udlandet og praktik i virksomheder i udlandet, og vi som elever g\u00f8re det
  klart, at de studieturene med egenbetaling som oftest ikke bare er en druktur i
  en europ\u00e6isk storby. Derimod oplever vi, at mange skoler p\u00e5 deres studieture
  stiller unikke muligheder for at opn\u00e5 st\u00f8rre internationalt udsyn og interkulturel
  dannelse ved at gennemf\u00f8re undervisning p\u00e5 lokale uddannelsesinstitutioner,
  bes\u00f8g og eventuelt praktik i lokale virksomheder og indkvartering hos lokale
  v\u00e6rtsfamilier, som er en mulighed, f\u00e5 elever ellers vil have. Ligeledes
  er det et vigtigt aspekt af vores merkantile dannelse som handelsskoleelever, at
  vi f\u00e5r indblik i andre kulturer og lande ved at m\u00f8de dem og ved at opleve,
  hvordan der kan eksistere enorme forskelle i kultur og levestandard blandt de familier,
  vi m\u00e5tte v\u00e6re indkvarteret hos, som giver os unik viden, der er essentiel
  i forbindelse med b\u00e5de international afs\u00e6tning og marketing samt en fuldst\u00e6ndig
  opn\u00e5else af en merkantil forst\u00e5else af verden.\\n\\nStudieture er for
  os at se ikke en \\\"ligegyldig konkurrenceparameter\\\" for handelsskolerne, hvis
  eneste form\u00e5l er at f\u00e5 elever til at v\u00e6lge handelsskolen frem for
  andre ungdomsuddannelsesvalg, men har derimod et stort l\u00e6ringsudbytte for de
  involverede elever, og er i sin grundform essentielle for den merkantile dannelse.\\n\\nN\u00e5r
  alt dette er sagt, \u00f8nsker vi dog ikke, at dyre studieture skal st\u00e5 i vejen
  for elevers trivsel eller forhindre elever i at opn\u00e5 en merkantil forst\u00e5else
  af verden og blive merkantilt dannede, hvorfor vi gerne ser, at skolerne forpligtes
  til at sikre fornuftige rateindbetalinger, alternative studieture og vide muligheder
  for, at elever kan s\u00f8ge om og modtage legater. Dette er vigtigt for at sikre,
  at handelsskolen og ungdomsuddannelseslandskabet ikke opdeles i A- og B-hold, s\u00e5fremt
  staten ikke er villig til at finansiere alle unges studietur.\\n\\nAfslutningsvis
  er det vigtigt for os at fastsl\u00e5, at vi naturligvis helst s\u00e5, at der ikke
  var egenbetaling p\u00e5 de studieture, skolerne udbyder, men vi er villige til
  at acceptere denne egenbetaling, fordi vi ellers frygter, at det vil g\u00e5 voldsomt
  ud over kvaliteten af de uddannelsesforl\u00f8b, vi ellers vil modtage.\\n\\nSom
  elever oplever vi ofte forvirring i forbindelse med studieomr\u00e5dets 7 forl\u00f8b.
  Det er naturligvis forst\u00e5eligt, da det stadig er relativt nyt for l\u00e6rerne
  og skolerne at lave, men derfor kr\u00e6ver det netop, at man laver en indsats for
  at f\u00e5 studieomr\u00e5det til at fungere p\u00e5 den nye m\u00e5de. Det er vigtigt,
  at l\u00e6rerne oplever at have styr p\u00e5 forl\u00f8bene og viden om, hvordan
  de fungerer. Det kr\u00e6ver b\u00e5de opkvalificering af l\u00e6rerkollegiet, men
  det kr\u00e6ver ogs\u00e5, at der s\u00e6ttes ressourcer af til kvalitative og udbytterige
  studieomr\u00e5deforl\u00f8b, s\u00e5 vi som elever kan opleve forl\u00f8b, der
  b\u00e5de er generelle for hele skolen samt forl\u00f8b, der er specifikke for vores
  studieretning, s\u00e5 vi p\u00e5 den m\u00e5de kan dykke ned i de s\u00e6rlige
  faglige muligheder og fokusomr\u00e5der, som vores respektive studieretninger har.
  Det giver den nuv\u00e6rende juridiske udformning af studieomr\u00e5det rig mulighed
  for, men det er ikke vores oplevelse, at alle institutioner benytter sig af denne
  mulighed. Derfor \u00f8nsker LH, at l\u00e6rerne modtager en opkvalificerende indsats
  som skal g\u00f8re dem i stand til at arbejde p\u00e5 tv\u00e6rs og udvikle kvalitetstunge
  studieomr\u00e5deforl\u00f8b med udgangspunkt i den studieretning, de underviser
  p\u00e5, og at der afs\u00e6ttes de n\u00f8dvendige \u00f8konomiske og vejledningsm\u00e6ssige
  ressourcer til at g\u00f8re dette p\u00e5 effektiv vis.\\n\\nSom helhed er vi dog
  positive over for studieomr\u00e5det og den studieforberedende dannelse, der ligger
  i disse forl\u00f8b. Alligevel er der v\u00e6sentlige mangler i studieomr\u00e5det
  som helhed, og vi kan ofte ogs\u00e5 opleve uenighed i l\u00e6rerkollegiet mht.
  tilrettel\u00e6ggelse af forl\u00f8bet og hvad der forventes af os. Derudover er
  det vigtigt, at l\u00e6rerne b\u00e5de evaluerer vores indsats l\u00f8bende samtidig
  med de er udtalte omkring vores faglige progression s\u00e5vel som den intenderede
  progression ved hvert forl\u00f8b, s\u00e5 vi som elever er mere klar over, hvad
  det er, vi skal l\u00e6re. Vi anser det ligeledes for vigtigt, at studieplanen,
  eller som minimum hovedpunkter fra studieplanen, i h\u00f8jere grad freml\u00e6gges
  for os, s\u00e5 vi har de bedste foruds\u00e6tninger for at se, hvordan fagligheden
  og progressionen mellem de forskellige studieomr\u00e5deforl\u00f8b er tilt\u00e6nkt.
  Derudover skal institutionerne v\u00e6re opm\u00e6rksomme p\u00e5 forskellige fag
  og niveauer i tilrettel\u00e6ggelse af SO-forl\u00f8b og studieplanl\u00e6gning.\\n\\n#4
  Terminspr\u00f8ver\\n\\nLandssammenslutningen af Handelsskoleelever mener, at det
  skal v\u00e6re obligatorisk at udbyde terminspr\u00f8ver i de fag, som eleverne
  kan blive udtrukket til skriftlig eksamen i. Dette kan ske gennem en tilretning
  af bestemmelsen i Lov om de gymnasiale uddannelser, \u00a7 28, stk. 4, som kr\u00e6ver
  fem interne pr\u00f8ver, heraf i dansk, matematik og studieretningsfag. LH \u00f8nsker
  med forslaget ikke at\\n\\nbegr\u00e6nse brugen af disse, men blot at give skriftlige
  eksamenslignende terminspr\u00f8ver op til eksamensterminen i fag, hvor eleverne
  kan blive udtrukket til skriftlig eksamen. Dette er vigtigt, idet terminspr\u00f8verne
  er med til at afstresse eleverne og give os de bedste mulige foruds\u00e6tninger
  for at g\u00e5 til eksamen og pr\u00e6stere under de givne forhold. Det kr\u00e6ver
  dog, at vi p\u00e5 forh\u00e5nd kender til og kan l\u00e6re at forholde os til de
  forhold, og l\u00e6re, hvordan vi selv reagerer i en eksamenslignende situation.\\n\\nDet
  er vores klare holdning, at undervisere ikke b\u00f8r skulle v\u00e6lge mellem at
  give deres elever undervisning eller terminspr\u00f8ver, og institutionens \u00f8konomiske
  ressourcer skal derfor prioriteres, s\u00e5 vi som elever kan f\u00e5 b\u00e5de
  undervisning og g\u00e5 til terminspr\u00f8ve. Det vil v\u00e6re positivt, hvis
  terminspr\u00f8ver t\u00e6ller som elevtimer, hvor underviseren f\u00e5r tilkendt
  ekstra ressourcer til at rette vores terminspr\u00f8ver fyldestg\u00f8rende.\\n\\nLigeledes
  mener vi, at antallet af terminspr\u00f8ver skal fordeles j\u00e6vnt gennem uddannelsesforl\u00f8bet
  under hensyntagen til relevansen af den enkelte terminspr\u00f8ve.\\n\\n#5 Udbud
  af HHX\\n\\nVi har p\u00e5 det seneste oplevet mange diskutere muligheden for, at
  almene gynnasier kan udbyde b\u00e5de HHX og merkantile grundforl\u00f8b i erhvervsuddannelserne.
  Begge dele er vi i LH kraftigt imod. Det er vigtigt at sl\u00e5 fast, at HHX skal
  foreg\u00e5 p\u00e5 et erhvervsgymnasium og ikke p\u00e5 det almene gymnasium, fordi
  uddannelsen gerne skal afspejle den virkelighed, den udspringer af: Erhvervslivet.
  Vi ser i forvejen en tendens til, at erhvervsgymnasiet akademiseres og i h\u00f8jere
  grad bev\u00e6ger sig hen imod en almen studentereksamen, og hvis gymnasieskolerne
  f\u00e5r lov til at udbyde HHX, vil dette blot forst\u00e6rke tendensen ang\u00e5ende
  manglende praktisk n\u00e6rhed. Vi \u00f8nsker som elever en t\u00e6t kobling til
  erhvervslivet, og det erhvervsrelaterede perspektiv og samarbejdet med erhvervslivet
  og lokale virksomheder er i mange henseender afg\u00f8rende for vores udbytte af
  undervisningen.\\n\\nDet er afg\u00f8rende for kvaliteten af vores uddannelse, at
  vores l\u00e6rere i de HHXspecifikke fag har praktisk erhvervserfaring og kender
  til og kan perspektivere vores undervisning til hverdagen i erhvervslivet. Ligeledes
  er det vigtigt, at vi har forskellige l\u00e6replaner p\u00e5 tv\u00e6rs af de tre
  gymnasiale retninger, fordi det er med til at tydeligg\u00f8re skellet mellem dem
  og give os st\u00f8rre dybde og indsigt i den merkantile kernefaglighed, som vi
  er stolte af. Hvis HHX fortsat skal v\u00e6re\\n\\nen relevant uddannelsesmulighed
  for unge, er det vigtigt, at fagligheden ikke langsomt udvandes ved at harmonisere
  l\u00e6replaner, oprette udbud af HHX p\u00e5 almene gymnasier og p\u00e5 sigt ogs\u00e5
  saml\u00e6se fag p\u00e5 tv\u00e6rs af de gymnasiale retninger, fordi det vil v\u00e6re
  med til at fjerne det essentielle erhvervsperspektiv og ligeledes g\u00f8re det
  sv\u00e6rere at lave tv\u00e6rfaglige forl\u00f8b, som kan give os dybere indsigt
  i den merkantile faglighed p\u00e5 HHX og i erhvervslivet.\\n\\nLigeledes anerkender
  vi gerne, at det er vigtigt med et bredt udbud i hele landet, som kan g\u00f8re,
  at flere elever har mulighed for at m\u00f8de de merkantile fag og v\u00e6lge HHX,
  vi mener bare ikke, at den rigtige m\u00e5de at sikre dette p\u00e5, er ved uforvarende
  at lade almene gymnasier udbyde og udvande vores uddannelse, men er villige til
  at indg\u00e5 i dialog om alternative l\u00f8sninger, som b\u00e5de kan sikre et
  dybdeg\u00e5ende fagligt fokus og et bredt udbud.\\n\\n#6 Frihed til eleverne\\n\\nFor
  LH er frihed en vigtig v\u00e6rdi. Her forst\u00e5s der b\u00e5de frihed til, at
  vores skoler lokalt kan indrette sig til vores fordel, men med frihed forst\u00e5s
  ogs\u00e5, at vi elever skal have frihed til at kunne bestemme over os selv, vores
  nutid og fremtid. Desv\u00e6rre ser vi i dag, at en r\u00e6kke politikere, t\u00e6nketanke
  mm. \u00f8nsker at begr\u00e6nse vores personlige frihed og vores frie valg.\\n\\nVi
  har dog flere gange set, hvordan forskellige regeringer \u00f8nsker at indskr\u00e6nke
  vores frihed, for eksempel med forslaget til en ny gymnasiereform i 2014, hvor initiativer
  som karakterkrav, statsligt fastlagte studieretninger og obligatorisk matematik
  B satte dagsordenen, ligesom aftalepartierne med erhvervsuddannelsesreformen i 2014
  gjorde det klart, at de har andre interesser end vores frihed. Med reformen indf\u00f8rte
  de nemlig karakterkrav og der var generelt et klart \u00f8nske om at tvinge flere
  elever til at v\u00e6lge erhvervsuddannelserne til. At indf\u00f8re et karakterkrav
  er for nogles vedkommende en desperat handling, der skal sikre fagligt h\u00f8jt
  niveau gennem udelukkelse i stedet for at iv\u00e6rks\u00e6tte inkluderende initiativer.
  For andre er det et m\u00e5l i sig selv at bestemme, hvor mange der m\u00e5 g\u00e5
  p\u00e5 bestemte uddannelser.\\n\\nAt politiske partier \u00f8nsker at styre elever
  over p\u00e5 erhvervsuddannelserne fra gymnasierne ser vi som en klar trussel mod
  vores frihed og frie valg. Vores uddannelse er med til at afg\u00f8re hele vores
  fremtidige liv, og med en solid vejledningsindsats i grundskolen burde vi v\u00e6re
  i stand til selv at tage en oplyst beslutning om, hvad det er, vi vil, og vi \u00f8nsker
  ikke, at det er politikerne, der skal bestemme, hvordan vores liv skal se ud.\\n\\nUddannelse
  er ikke blot en retningsgiver for vores liv som individer, men det har betydning
  for hele samfundet. N\u00e5r vi tager en uddannelse er vi med til at styre samfundet
  i en given retning, og n\u00e5r politikerne vil v\u00e6lge for os, tvinger de samfundet
  i deres retning. Men fremtidens samfund er ogs\u00e5 vores \u2013 derfor vil vi
  ogs\u00e5 v\u00e6re med til at styre retningen.\\n\\n#7 Uddannelse uden for storbyen\\n\\nI
  Danmark har der i en l\u00e6ngere periode foreg\u00e5et en centralisering af bl.a.
  uddannelserne. Dette har f\u00f8rt til, at mange af unge, som tager en ungdomsuddannelse
  uden for storbyen, ofte har lange transporttider til skole, fritidsjob, sport og
  venner.\\n\\nDen offentlige transport halter bagud, og b\u00e5de bus og tog k\u00f8rer
  ofte kun \u00e9n gang i timen. Dette er problematisk, da det kan f\u00f8re til,
  at unge v\u00e6lger en anden uddannelse, end den, de \u00f8nsker, af hensyn til
  deres daglige transporttid til og fra uddannelsesstedet. Herudover p\u00e5virker
  de lange transporttider ogs\u00e5 elevernes fritid, og is\u00e6r den tid de har
  til r\u00e5dighed til at lave deres dag-til-dag- lektier, ligesom det p\u00e5virker
  eleverne \u00f8konomisk, da et ungdomskort koster flere hundrede kroner om m\u00e5neden.\\n\\nCentraliseringen
  har ydermere f\u00f8rt til, at der nu generelt er f\u00e6rre uddannelser, og nogle
  derfor ikke har mulighed for at v\u00e6lge f.eks. hhx eller eventkoordinatoruddannelsen
  p\u00e5 grund af, deres d\u00e5rlige transportmuligheder, som ville g\u00f8re hverdagen
  absurd for eleven, hvis denne alligevel valgte uddannelse efter \u00f8nske og ikke
  bekvemmelighed. S\u00e5fremt man politisk \u00f8nsker at centralisere uddannelserne
  yderligere omkring de st\u00f8rre byer, er det vigtigt, at der f\u00f8lger de n\u00f8dvendige
  investeringer i den offentlige infrastruktur med, som skal til for at g\u00f8re
  uddannelsesvalget lettere og mere overkommeligt for eleverne.\\n\\nLH mener derfor,
  at:\\n\\n* Uddannelserne b\u00f8r ikke centraliseres yderligere, da de nuv\u00e6rende
  transporttider i forvejen f\u00e5r folkeskoleeleverne til at g\u00e5 p\u00e5 kompromis
  med deres ungdomsuddannelses\u00f8nsker.\\n* Der skal inds\u00e6ttes flere tog-
  og busafgange, som g\u00f8r det muligt for de unge at deltage i ungdomsmilj\u00f8et
  og v\u00e6lge den ungdomsuddannelse, som passer dem bedst. Dette vil sikre mobilitet
  for de unge og p\u00e5 l\u00e6ngere sigt sikre en engageret og veluddannet arbejdsstyrke.\\n*
  Ungdomskort b\u00f8r have en for eleverne overkommelig pris.\\n* Elever p\u00e5
  hovedforl\u00f8b b\u00f8r ogs\u00e5 have adgang til at f\u00e5 Ungdomskort\\n\\n*
  Uddannelsesvalget b\u00f8r aldrig st\u00e5 imellem \u00f8nske og bekvemmelighed\\n\\n#8
  Samfundsdeltagelse\\n\\nDet er vigtigt at have for \u00f8je, at uddannelse ikke
  bare foreg\u00e5r for arbejdsmarkedets skyld, men at der er flere forskellige hensyn,
  som vi m\u00e5 tage, n\u00e5r vi uddanner unge og elever. F\u00f8rst og fremmest
  skal uddannelse kl\u00e6de os p\u00e5 til at beg\u00e5 os i samfundet, og det er
  derfor vigtigt, at vi gennem vores uddannelse kan blive alment dannede og opn\u00e5
  en st\u00f8rre forst\u00e5else af det samfund, vi lever i. I den digitale tidsalder
  som vi lever i, er det dog ogs\u00e5 vigtigt, at vi opn\u00e5r digital dannelse,
  som kan sikre os den n\u00f8dvendige viden til at interagere med digitale teknologier
  og give os en forst\u00e5else af konsekvenserne af vores digitale handlinger. For
  at vi kan beg\u00e5 os effektivt i samfundet er det dog ogs\u00e5 vigtigt, at vi
  opn\u00e5r en basal \u00f8konomisk dannelse, der kan kl\u00e6de os p\u00e5 til at
  v\u00e6re voksne og selvst\u00e6ndige individer, som kan tage ansvar for vores egen
  \u00f8konomi og \u00f8konomiske velv\u00e6re. Dannelse som begreb d\u00e6kker dog
  meget vidt, og det er derfor ogs\u00e5 vigtigt, at vores uddannelser og uddannelsesinstitutioner
  opfordrer os til aktiv deltagelse i samfundet, s\u00e5 vi derved kan opn\u00e5 demokratisk
  dannelse og gennem denne blive til hele og oplyste individer, som kan tage del i
  samfundet, men som ogs\u00e5 er attraktive for arbejdsmarkedet, fordi vi forst\u00e5r
  at agere i og komme med input i de processer, som vi indg\u00e5r i.\\n\\n#9 Elevdemokrati
  - en grundsten i uddannelse\\n\\nElevdemokrati er en af de vigtigste grundsten i
  skabelsen af velfungerende skoler. Som elever m\u00e6rker vi, hvad der fungerer,
  og hvad der ikke fungerer, og derfor er det vigtigt, at LH har en st\u00e6rk stemme
  i samfundet og p\u00e5 skolerne. Sammen skal vi k\u00e6mpe for bedre vilk\u00e5r,
  og det er vores ansvar at stille krav til vores skoler. En del af disse krav er:\\n\\n1.
  Elevkoordinator p\u00e5 alle uddannelsesinstitutioner\\n\\nEn elevkoordinator skal
  fungere som elevernes direkte kontakt til skolens medarbejdere. Derfor skal elevkoordinatoren
  altid v\u00e6re i t\u00e6t dialog med skolens elever og elevr\u00e5d. Elevkoordinatoren
  skal underst\u00f8tte elevr\u00e5det i deres arbejde, hvilket betyder, at elevkoordinatoren
  skal hj\u00e6lpe elevr\u00e5det med at organisere sig p\u00e5 elevr\u00e5dets pr\u00e6misser.
  Det skal ogs\u00e5 v\u00e6re en person, der kan hj\u00e6lpe elevr\u00e5det med at
  afholde arrangementer og s\u00f8rge for, at der er god og konstruktiv dialog med
  ledelsen. Yderligere skal en elevkoordinator ogs\u00e5 bruges i indsatser mod mobning,
  mistrivsel, frav\u00e6r mv.\\n\\n2. En ny og forbedret undervisningsmilj\u00f8lov\\n\\nLH
  udviklede en undervisningsmilj\u00f8lov under Medlemskonferencen 2016. Denne undervisningsmilj\u00f8lov
  danner grundlag for LH''s krav til en ny og forbedret undervisningsmilj\u00f8lov.
  Der findes i dag en undervisningsmilj\u00f8lov, som mildest talt er intetsigende.\\n\\nDen
  danner ikke grundlag for, hvad godt undervisningsmilj\u00f8 er. Derfor ser man desv\u00e6rre
  ogs\u00e5, at der p\u00e5 flere skoler rundt omkring i landet opst\u00e5r flere
  og flere situationer, hvor undervisningsmilj\u00f8et er st\u00e6rkt kritisabelt.
  Derfor er det vigtigt, at der bliver udarbejdet en undervisningsmilj\u00f8lov, der
  s\u00e6tter krav til, hvad vi kan forvente ude p\u00e5 skolerne. Derfor skal vi
  have minimum de samme krav til undervisningsmilj\u00f8, som l\u00e6rerne har til
  deres arbejdsmilj\u00f8. Loven skal derfor ligestilles med arbejdsmilj\u00f8loven.
  Yderligere skal den s\u00e6tte krav til, hvor ofte der skal foretages en vurdering
  af undervisningsmilj\u00f8et, og at denne skal v\u00e6re tilg\u00e6ngelig p\u00e5
  skolens hjemmeside. Der skal s\u00e6ttes krav til, at vi har indsigelser ift. vidtg\u00e5ende
  sp\u00f8rgsm\u00e5l om vores undervisningsmilj\u00f8, og at vi f\u00e5r samme antal
  medlemmer i Dansk Center for Undervisningsmilj\u00f8s bestyrelse som repr\u00e6sentanterne
  for skolernes ejere.\\n\\n3. Elevr\u00e5denes h\u00f8rings- og indsigelsesret\\n\\nI
  dag kan skolens ledelse i mange tilf\u00e6lde trumfe os i udvikling af skolens milj\u00f8er
  og faciliteter. Derfor skal vi stille krav om, vi skal have b\u00e5de h\u00f8rings-
  og indsigelsesret i alle tilf\u00e6lde, hvor vores hverdag som elever ber\u00f8res.
  Det g\u00e6lder f.eks. studie- og ordensregler, undervisningsmilj\u00f8udvalg, antimobbestrategi,
  udlicitering af f.eks. kantinen mv. I alle de tilf\u00e6lde, hvor det ber\u00f8rer
  os, skal vi have repr\u00e6sentanter med, som har stemmeret, men elevr\u00e5det
  skal ogs\u00e5 have h\u00f8ringsog indsigelsesret.\\n\\n4. Skolens arbejde med elevr\u00e5d
  og elevr\u00e5dsstruktur\\n\\nDer foreg\u00e5r flere og flere fusioner og dannes
  flere campusskoler, hvorfor mange uddannelser bliver lagt sammen under samme tag
  eller administration. Derfor kr\u00e6ves der en indsats fra skolerne, s\u00e5 elevr\u00e5dene
  ikke sv\u00e6kkes. Der skal derfor stilles krav til, hvordan elevr\u00e5dene skal
  sammens\u00e6ttes, og hvordan man sikrer en st\u00e6rk repr\u00e6sentation af alle
  elever. I den forbindelse er det vigtigt, at man sikrer flere forskellige fagligheder
  og elevgrupper i skolernes bestyrelser og at den lokale autonomi p\u00e5 hver afdeling
  s\u00e6ttes i h\u00f8js\u00e6det, s\u00e5 elevr\u00e5det stadig har optimale muligheder
  for medbestemmelse og indflydelse p\u00e5 deres skole.\\\"\\n\\n#10 Revidering af
  EMMA\\n\\nArbejdsmarkedet og Folketinget er sammen blevet enige om det, der kaldes
  EMMA-kriterierne, der har til form\u00e5l at f\u00e5 elever til at s\u00f8ge elevpladser,
  og bestemmer, hvorvidt man anerkendes som elevpladss\u00f8gende. De s\u00e5kaldte
  EMMAkriterier st\u00e5r for engageret, geografisk mobil, faglig mobil og aktivt
  s\u00f8gende. Det lyder som udgangspunkt som nogle gode kriterier, dog har disse
  taget gevaldig overh\u00e5nd. N\u00e5r man siger, at elever skal v\u00e6re fagligt
  mobil, mener man, at vi skal v\u00e6re villige til at tage en elevplads, som er
  helt anderledes end den, vi ville have haft, og som er inden for et helt andet felt
  end det, vi er i gang med at uddanne os til. Faglig mobil betyder i realiteten,
  at hvis man uddanner sig til eventkoordinator, og f\u00e5r tilbudt en elevplads
  som detailelev, skal man tage imod denne ellers mister man sin mulighed for at f\u00e6rdigg\u00f8re
  uddannelsen. Det er katastrofalt, at vi ikke kan bestemme, hvorvidt vi har lyst
  til at skifte fagligt spor. N\u00e5r politikerne og arbejdsmarkedet vil have,at
  vi er geografisk mobile, vil de have, at vi skal v\u00e6re villige til at tage en
  elevplads i den anden ende af landet. Om vi er unge eller gamle, er det ikke rart
  for nogen at skulle flytte fra sine normale leveforhold for at f\u00e5 en elevplads.
  Hvis man ikke takker ja til tilbuddet om en elevplads i den anden ende af landet,
  vil man ogs\u00e5 miste sin mulighed for, at f\u00e6rdigg\u00f8re uddannelsen. Det
  er absurd, at de nuv\u00e6rende kriterier g\u00f8r, at man ryger ud af uddannelsessystemet,
  hvis man ikke f\u00f8lger disse kriterier.\\n\\nI LH anser vi det som utrolig vigtigt,
  at vi f\u00e5r kigget grundigt p\u00e5 fejlene i kriterierne, s\u00e5 de ikke udelukker
  nogen fra at f\u00e6rdigg\u00f8re deres uddannelse. Ved en lempelse af kriterierne
  ser vi det som en n\u00f8dvendighed, at man styrker SKP''en, s\u00e5 denne har mulighed
  for at tage de elever, der ikke kan f\u00e5 en elevplads inden for deres geografiske
  eller faglige omr\u00e5de. Ligeledes er det vigtigt, at vi i LH kritiserer EMMA-kriterierne
  for at v\u00e6re et koncept, der giver eleverne skylden for\\n\\nikke at f\u00e5
  en elevplads, frem for de virksomheder og politikere, der ikke tager et stort nok
  ansvar for elevpladsmanglen i alle brancher og omr\u00e5der.\\n\\nMEDLEMSKONFERENCE
  2019\\n\\n#11 Udtalelse om elevr\u00e5dsbekendtg\u00f8relsen\\n\\nLandssammenslutningen
  af handelsskoleelever mener at elevr\u00e5dsbekendtg\u00f8relsen skal laves om til
  en lov, s\u00e5ledes den kommer til at hedde elevr\u00e5dsloven. Dette mener vi
  p\u00e5 baggrund af at p\u00e5 nuv\u00e6rende tidspunkt kan der laves bekendtg\u00f8relser
  som det passer undervisningsministeren. Dette kan blive et problem i fremtiden,
  hvis der fx kommer en minister som mener at elever som kommer 1 minut for sent skal
  eleven have frav\u00e6r for hele dagen. Derfor burde bekendtg\u00f8relsen laves
  om til en lov s\u00e5ledes den kun kan \u00e6ndres i Folketinget. Derudover st\u00e5r
  der ogs\u00e5 i elevr\u00e5dsbekendtg\u00f8relsen en r\u00e6kke regler som skoler
  skal f\u00f8lge for at kunne stille et elevr\u00e5d. Dette er fx at for at skolen
  kan optage medlemmer skal de samle til storm\u00f8de p\u00e5 skolen. Dette er et
  problem for bl.a. skole som har flere afdelinger i forskellige byer. Derfor mener
  Landsammenslutningen af Handelsskoleelver at regler for hvem der m\u00e5 v\u00e6re
  medlem af elevr\u00e5det samt hvordan det skal sammens\u00e6ttes skal st\u00e5 beskrevet
  i de enkelts elevr\u00e5ds vedt\u00e6gter, s\u00e5ledes de kan tilpasse dem skolen
  og deres omst\u00e6ndigheder.\\n\\n#12 Revision af bestemmelserne i elevr\u00e5dsbekendtg\u00f8relsen\\n\\nLH
  \u00f8nsker elevr\u00e5dsbekendtg\u00f8relsen revideret, s\u00e5 den bliver mere
  overskuelig og realistisk. En ny bekendtg\u00f8relse skal indeholde f\u00e6rre og
  simplere bestemmelser, s\u00e5 den bliver nemmere at administrere og forst\u00e5
  for s\u00e5vel elever som institutioner.\\n\\nFor institutioner med flere uddannelser
  og/eller afdelinger mener LH, at hver uddannelse og afdeling skal have sit eget
  elevr\u00e5d. I denne forbindelse kan eud og eux regnes for samme uddannelse. Institutionen
  skal s\u00e5 sikre, at disse elevr\u00e5d samarbejder p\u00e5 tv\u00e6rs og bl.a.
  udpeger bestyrelsesmedlemmer.\\n\\nLH mener derudover, at valg til elevr\u00e5det
  efter bekendtg\u00f8relsen skal decentraliseres til de enkelte \u00e5rgange eller
  klasser. Dette sikrer en bred repr\u00e6sentation i r\u00e5det og kan reguleres
  yderligere i elevr\u00e5dets vedt\u00e6gter. Endelig skal en revideret bekendtg\u00f8relse
  forpligte ledelsen til at inddrage og h\u00f8re elevr\u00e5det ifm. planl\u00e6gning
  af skole\u00e5ret mv.\\n\\n#12 Tilbud til psykisk s\u00e5rbare unge\\n\\nLH mener,
  at ungdomsuddannelsesinstitutioner skal g\u00f8re mere for at hj\u00e6lpe psykisk
  s\u00e5rbare unge og bek\u00e6mpe psykisk s\u00e5rbarhed blandt unge. Hver institution
  skal have en r\u00e6kke tilbud til psykisk s\u00e5rbare unge, som skal v\u00e6re
  let tilg\u00e6ngelige. En elev skal kunne f\u00e5 hj\u00e6lp og st\u00f8tte ved
  at henvende sig, men undervisere og studievejledere skal ogs\u00e5 aktivt henvise
  elever til tilbuddene i relevant omfang. Eksempler p\u00e5 tilbud til psykisk s\u00e5rbare
  unge er bl.a. udvidet studievejledning, coaching, mentorordninger og skolepsykolog.
  En afg\u00f8rende indsats, som dog ikke kan st\u00e5 alene, er en opprioritering
  af skolernes studievejledning. Institutionerne skal have og prioritere \u00f8konomiske
  midler til at ans\u00e6tte kompetente studievejledere, som er synlige og kan danne
  trygge relationer til den enkelte. En n\u00e6rv\u00e6rende studievejleder med tid
  og vilje til at hj\u00e6lpe er afg\u00f8rende for den enkeltes lyst til at henvende
  sig.\\n\\nInstitutionerne skal ogs\u00e5 arbejde aktivt med at skabe sunde milj\u00f8er
  socialt som fagligt. Alle elever skal f\u00f8le sig velkomne og inkluderede, og
  ingen skal f\u00f8le usunde pres ift. karakterer, pr\u00e6station eller socialisering.
  Institutionerne skal lade eleverne arbejde med trivsel og psykisk velv\u00e6re,
  s\u00e6rligt p\u00e5 uddannelsens f\u00f8rste \u00e5r, s\u00e5 alle opn\u00e5r en
  bevidsthed herom.\\n\\nEndvidere skal institutionerne ikke kun se p\u00e5 elevernes
  pr\u00e6stationer, men ogs\u00e5 fokusere p\u00e5 den enkelte elevs indsats og progression.
  Dybdeg\u00e5ende individuel feedback er afg\u00f8rende for den enkelte elevs tro
  p\u00e5 og lyst til faglig progression.\\n\\n#13 Ungdomsuddannelse for unge med
  funktionsneds\u00e6ttelse\\n\\nLH mener, at ogs\u00e5 unge med funktionsneds\u00e6ttelse
  skal kunne gennemf\u00f8re merkantile ungdomsuddannelser. Dette er allerede tilf\u00e6ldet
  i dag, men der er plads til forbedringer. Relevant specialp\u00e6dagogisk st\u00f8tte,
  SPS, skal tilbydes alle med behov. Skolerne skal informere alle elever om muligheden
  og underst\u00f8tte, at elever med behov tildeles st\u00f8tte.\\n\\nMuligheden for
  at tage en uddannelse p\u00e5 over normeret tid, bl.a. fire\u00e5rig merkantil studentereksamen,
  skal fremh\u00e6ves og udbredes. Skolerne skal tilrettel\u00e6gge disse tilbud individuelt
  med fokus p\u00e5 den enkeltes behov og \u00f8nsker. Tilbuddene skal tilrettel\u00e6gges
  med en j\u00e6vn arbejdsbyrde, da de netop er m\u00e5lrettet elever, der ikke kan
  overkomme de arbejdsbyrder, som f\u00f8lger med at gennemf\u00f8re uddannelsen p\u00e5
  normeret tid.\\n\\nOgs\u00e5 fysiske rammer er afg\u00f8rende for elever med fysiske
  funktionsneds\u00e6ttelser. Institutionerne skal have faciliteter til disse elever,
  s\u00e5 de s\u00e5 vidt muligt stilles som skolens \u00f8vrige elever ift. bev\u00e6gelig
  p\u00e5 matriklen, toiletforhold mm.\\n\\nGENERALFORSAMLING 2019\\n\\n#13 De merkantile
  EUV-elevers udfordringer\\n\\nI dag er de \u00e6ldre elever en stor del af erhvervsuddannelserne,
  herunder vores. De fylder en del i erhvervsuddannelsesdebatten og med god grund.\\n\\nVi
  ser problemerne med eud-reformen fra 2015 i form af lavere gennemf\u00f8rselsprocent
  blandt de voksne og et mindre optag af dem p\u00e5 vores uddannelser.  Problemerne
  opst\u00e5r allerede inden, de starter. De kan ikke starte p\u00e5 grundforl\u00f8b
  1, da det er for lang tid siden, de forlod grundskolen, og skal derfor starte direkte
  p\u00e5 grundforl\u00f8b 2. Det betyder dog, at de enten skal have fuldf\u00f8rt
  nogle bestemte fag p\u00e5 forh\u00e5nd i forbindelse med anden uddannelse eller
  forbi VUC for at tage disse fag, f\u00f8r de kan starte p\u00e5 handelsskolen. Det
  er i forvejen sv\u00e6rt som voksen at skulle tilbage p\u00e5 skoleb\u00e6nken,
  men de skal ofte starte p\u00e5 2 skoler for at kunne g\u00e5 i gang med deres erhvervsuddannelse.
  Derudover opleves der en r\u00e6kke andre barrierer, da de ofte er et andet sted
  i livet og f.eks. har b\u00f8rn. Den manglende fleksibilitet og de mange timer g\u00f8r
  det sv\u00e6rt for dem at kunne tage en merkantil erhvervsuddannelse, da de er for
  meget v\u00e6k fra hjemmet. Derudover fylder frav\u00e6r utroligt meget for disse
  elever, der ikke kun selv kan blive syge, men ogs\u00e5 risikerer at skulle tage
  sig af eventuelle syge b\u00f8rn og ordne praktiske ting i skoletiden. EMMA-kriterierne
  er ogs\u00e5 et stort problem for voksne, da de ikke bare kan tage en familie og
  rykke til den anden ende af landet for at f\u00e5 en praktikplads.\\n\\nDet er vigtigt
  for LH, at man uanset foruds\u00e6tninger kan tage en uddannelse. Derfor har vi
  \u00f8nsker til reformjusteringer for at sikre de voksnes muligheder p\u00e5 vores
  uddannelser.\\n\\nLH \u00f8nsker konkret:\\n\\n* Anderledes frav\u00e6rsregler for
  voksne med familie\\n* Handelsskolerne kan udbyde opkvalificerende fag, s\u00e5
  man ikke f\u00f8rst skal starte p\u00e5 VUC\\n* Mulighed for forl\u00e6ngelse af
  uddannelsestiden\\n* Mulighed for enkelte fag p\u00e5 fjernstudie\\n* Praktikpladsgaranti
  n\u00e6r hjemmet.\\n\\n#14 Elevernes arbejdstider\\n\\nVi skal som elevorganisation
  blande os i debatten om vores elevers arbejdstider. Det er helt konkret vores detailelever,
  der st\u00e5r for skud. Dele af Folketinget vil gerne fjerne lukkeloven, s\u00e5
  butikker kan have \u00e5bent 24 timer i d\u00f8gnet. Det er problematisk, hvis vores
  elever kan risikere s\u00e5 sk\u00e6ve arbejdstider, n\u00e5r man politisk samtidig
  k\u00e6mper for bedre ungdomsmilj\u00f8er for elever p\u00e5 erhvervsuddannelserne.
  Derfor vil vi i Landssammenslutningen af Handelsskoleelever ikke have lukkeloven
  fjernet, da vi ser den som n\u00f8dvendig for at sikre vores elevers arbejdsvilk\u00e5r,
  der heller ikke ville f\u00e5 till\u00e6g for deres sk\u00e6ve arbejdstider. Derudover
  skal man ogs\u00e5 sikre, at det fortsat er en attraktiv branche at arbejde i, men
  en fjernelse af lukkeloven vil g\u00f8re det for besv\u00e6rligt, hvis man har eller
  \u00f8nsker at stifte familie og derved risikerer man, at f\u00e6rre vil s\u00f8ge
  den vej.\\n\\n#15 Klasseloft p\u00e5 eud/eux\\n\\nKlasselokaler fyldt til randen
  med elever p\u00e5 de merkantile erhvervsuddannelser er desv\u00e6rre hverdagskost
  for mange handelsskoleelever. Det er med til at skade l\u00e6ringen blandt eleverne
  og vil aldrig kunne gavne den enkelte. P\u00e5 gymnasierne findes der allerede et
  klasseloft, hvor der maksimalt m\u00e5 v\u00e6re 28 elever i gennemsnit pr. \u00e5rgang
  i klasserne. Det er med til at sikre, at klasserne ikke bliver overfyldte, s\u00e5
  l\u00e6ringen ikke skades. S\u00e5dan et klasseloft findes desv\u00e6rre ikke p\u00e5
  erhvervsuddannelserne og derfor er der beklageligvis en tendens til \\\"megaklasser\\\",
  hvor der kan v\u00e6re helt op til 35+ elever i klasserne. Med s\u00e5 mange elever
  i klasserne bliver afstanden fra elev til l\u00e6rer alt for stor, og det bliver
  sv\u00e6rt for l\u00e6reren at vurdere alle elevers kunnen. Dertil er det ogs\u00e5
  sv\u00e6rt for l\u00e6reren at hj\u00e6lpe alle elever, der har behov for dette,
  hvilket i v\u00e6rste fald betyder, at eleven ikke l\u00e6rer det n\u00f8dvendige
  eller mister motivationen og dropper ud.\\n\\nMed s\u00e5 kort tid til at l\u00e6re
  hele pensum p\u00e5 h\u00f8jere niveauer end tidligere, s\u00e5 er det helt centralt,
  at der er tid til, at l\u00e6reren kan hj\u00e6lpe alle elever, som har brug for
  det, s\u00e5 den enkelte f\u00e5r noget ud af undervisningen og har mulighed for
  at n\u00e5 sit fulde potentiale. For at sikre s\u00e5 god en uddannelse som muligt,
  mener LH, at det selvsamme klasseloft p\u00e5 gymnasierne ogs\u00e5 skal indf\u00f8res
  p\u00e5 erhvervsuddannelserne.\\n\\n#16 Uddannelsesloftet\\n\\nI december 2016 blev
  uddannelsesloftet pr\u00e6senteret. Det var et forslag om, at man ikke l\u00e6ngere
  m\u00e5 tage flere uddannelser p\u00e5 samme eller lavere niveau.  Det skaber yderligere
  et pres p\u00e5 eleverne der skal v\u00e6lge tidligere og rigtigt f\u00f8rste\\n\\ngang.
  Med et uddannelsesloft ville der ikke v\u00e6re plads til at v\u00e6lge forkert.
  Derfor var LH med i initiativet mod uddannelsesloftet sammen med resten af elev-
  og studenterbev\u00e6gelsen. Vi g\u00e5r ind for fri og lige adgang til uddannelse,
  hvilket et uddannelsesloft forhindrer.\\n\\nI februar 2017 havde man \u00e6ndret
  uddannelsesloftet s\u00e5 man i stedet for livslang udelukkelse i stedet f\u00e5r
  en uddannelseskarant\u00e6ne p\u00e5 6 \u00e5r. Det betyder at man 6 \u00e5r efter
  man har afsluttet sin uddannelse kan tage en uddannelse p\u00e5 samme eller lavere
  niveau. Dette viser, at vi ved at st\u00e5 sammen er med til at l\u00e6gge et pres
  p\u00e5 beslutningen, dog er 6 \u00e5rs uddannelseskarant\u00e6ne langt fra nok.
  LH g\u00e5r ind for at fjerne loftet helt.\\n\\nDa borgerforslag blev en politisk
  mulighed gik LH sammen med resten af Elevog Studenterbev\u00e6gelsen om at stille
  Danmarks f\u00f8rste borgerforslag i januar 2018. Forslaget handlede om en afskaffelse
  af uddannelsesloftet og n\u00e5ede kravet om 50.000 underskrifter p\u00e5 under
  14 dage.\\n\\n#17 Psykisk undervisningsmilj\u00f8\\n\\nN\u00e5r man taler om undervisningsmilj\u00f8,
  s\u00e5 t\u00e6nker man ofte p\u00e5 de fysiske rammer, og hvordan disse rammer
  p\u00e5virker ens fysiske helbred. De fysiske rammer p\u00e5virker ikke kun vores
  fysiske helbred, men ogs\u00e5 vores psykiske helbred. Det er dog ikke kun skolernes
  fysiske rammer, der p\u00e5virker os psykisk, men ogs\u00e5 samfundet vi lever i.
  Gennem de sidste mange \u00e5r har vores samfund udviklet sig mod en mere konkurrencepr\u00e6get
  samfund, og her er der ogs\u00e5 kommet mange flere krav til eleverne.\\n\\nKravet
  om h\u00f8je karakterer fra samfundets side er ikke noget nyt, men desv\u00e6rre
  er der kommet mere og mere fokus p\u00e5 karaktererne frem for p\u00e5 individet
  og dets kompetencer. Dette har medf\u00f8rt et \u00f8get pres p\u00e5 eleverne og
  udvikling af stress, angst, depression samt andre psykiske udfordringer, er ikke
  l\u00e6ngere en ualmindelighed blandt ungdommen, men derimod en trist tendens.\\n\\nForebyggelse
  af psykiske udfordringer, der kan komme som f\u00f8lge af de krav, der stilles til
  eleverne, er ekstremt vigtig. Derfor skal skolernes ledelser og l\u00e6rere sikre
  at lektier og afleveringer harmonerer p\u00e5 tv\u00e6rs af fag, s\u00e5 man undg\u00e5r
  pressede situationer for eleverne.\\n\\nAlle elever har krav p\u00e5 et godt psykisk
  undervisningsmilj\u00f8 og i Landssammenslutningen af Handelsskoleelever \u00f8nsker
  vi et klasseloft p\u00e5 alle uddannelser, og ikke blot p\u00e5 gymnasierne. Dette
  skal sikre, at skolerne ikke blot kan komme 30-\\n\\n40 elever i et klasselokale.
  Et klasseloft skal v\u00e6re med til at sikre mere tid til den enkelte elev.\"",
  "\"RENG\u00d8RING AF FORST\u00d8VERKAMMER\\n\\n1. Fjern slangen fra bunden af forst\u00f8verkammeret.
  Dette b\u00f8r g\u00f8res ved at vrikke forsigtig med den. Det er ikke n\u00f8dvendigt
  at rense slangen, fordi den ikke har kontakt med medicinen.\\n2. Skru l\u00e5get
  af forst\u00f8verkammeret og fjern forst\u00f8verindsatsen.\\n3. Vask maske og forst\u00f8verens
  dele i varmt vand med et mildt opvaskemiddel, og skyl grundigt.\\n4. Derefter l\u00e6gges
  disse dele i en blanding af 3 dele destilleret/ koldt kogt vand og 1 del hvid eddike
  (5% surhedsgrad) i 30 minutter.\\n5. Tag delene op af eddikeopl\u00f8sningen, skyl
  under varmt vand og lad dem luftt\u00f8rre. T\u00f8r aldrig delene med viskestykke
  eller vask dem i opvaskemaskinen.\\n\\nADVARSEL:\\n\\nRygning og brug af \u00e5ben
  ild er forbudt under behandling.\\n\\nMEDICAL DANMARK A/S\\n\\nMedicinsk Forst\u00f8verkammer\\n\\nmed
  maske (System 22)\\n\\nBRUGERMANUAL\\n\\nMEDICAL DANMARK A/S\\n\\nBRUGERVEJLEDNING\\n\\nBillede
  1\\n\\nMaske med\\nventilationshuller\\nMedicinsk forst\u00f8verkammer\\nIlt / luftslange
  med studs\\n\\nBillede 2\\n\\nForst\u00f8verkammertop\\nForst\u00f8verkammerindsats\\nForst\u00f8verkammerbund\\n\\nMedicinsk
  forst\u00f8verkammer (system 22) kan drives p\u00e5 f\u00f8lgende tre m\u00e5der:\\n\\n-
  Atmosf\u00e6risk medicinsk luftflaske\\n- Kompressor (forst\u00f8ver)\\n- Medicinsk
  iltflaske\\n\\nLuft- og iltflaske skal v\u00e6re monteret med reduktionsventil indstillet
  p\u00e5 8 liter i minuttet.\\n\\nFor at opn\u00e5 maksimal forst\u00f8vning skal
  der forefindes et bartryk p\u00e5 0,6 til 1,2 bar og et flow p\u00e5 minimum 8 liter
  i minuttet.\\n\\nForst\u00f8vertid ved 4 \u2013 6 ml er 8 til 12 minutter.\\n\\nFyldning
  af forst\u00f8verkammer:\\n\\nSkru forst\u00f8verkammertop af (drej mod uret) og
  h\u00e6ld medicinen i forst\u00f8verkammerets bund. Se billede 2.\\n\\nS\u00f8rg
  for at indsatsen sidder korrekt ved lukning af forst\u00f8verkammeret.\\n\\nMonter
  forst\u00f8vers\u00e6ttet som billede 1.\\n\\nDet er vigtigt at du sidder behageligt
  og der er ro omkring dig inden du g\u00e5r i gang med behandlingen, og giv dig selv
  den forn\u00f8dne tid til inhalationen.\\n\\nN\u00e5r forst\u00f8verkammeret er
  tomt er behandlingen f\u00e6rdig.\\n\\nEr der sp\u00f8rgsm\u00e5l til ovenst\u00e5ende
  kontakt din l\u00e6ge, sygeplejerske eller Medical Danmark.\"", "\"Kom til juletr\u00e6sfest
  i Vigersted forsamlingshus s\u00f8ndag d. 3. december 2017 kl. 15.00-16.30.\\n\\nVi
  skal danse om juletr\u00e6et og der vil bliver serveret gl\u00f8gg, juice og \u00e6bleskiver
  til alle der har tilmeldt sig og betalt 25 kr. pr. person.\\n\\nHvis vi er heldige
  kigger julemanden m\u00e5ske forbi\u2026..\\n\\nJulearrangementer koster 25 kr.
  pr. person, og skal indbetales p\u00e5 mobilepay 21421210 (Karina Kristensen) med
  det antal personer der \u00f8nsker at deltage.\\n\\nHusk at p\u00e5f\u00f8rer navn.\\n\\nTilmeldingsfrist
  senest d. 23. November 2017\\n\\nN\u00f8rkle damerne vil ogs\u00e5 v\u00e6re til
  stede, og s\u00e6lge af deres fine ting og sager.\"", "\"Er der flere \u00f8kologiske
  b\u00f8ffer p\u00e5 vej?\\n\\nAf: Mogens Vestergaard, Institut for Husdyrvidenskab,
  Aarhus Universitet\\n\\nDanmark har en stor andel af \u00f8kologiske malkek\u00f8er,
  som giver m\u00e6lk og f\u00f8der kalve. Det burde jo betyde, at fx tyrekalvene
  kunne ende som \u00f8kologiske b\u00f8ffer, men det g\u00f8r kun en lille del af
  dem. Hvor blev de af og kan vi g\u00f8re noget ved det?\\n\\nN\u00e5r der er kunder
  til \u00f8kologisk m\u00e6lk, s\u00e5 er der ogs\u00e5 kunder til \u00f8kologiske
  b\u00f8ffer. Der findes da ogs\u00e5 \u00f8kologisk oksek\u00f8d p\u00e5 det danske
  marked, nemlig fra uds\u00e6tterk\u00f8er og et mindre antal stude. Her definerer
  vi oksek\u00f8d som r\u00f8dt k\u00f8d fra voksne dyr (k\u00f8er, stude og evt.
  store kvier).\\n\\nEffektiviteten kan ogs\u00e5 \u00f8ges ved at bruge krydsningskalve.
  Det kr\u00e6ver, at m\u00e6lkeproducenten bruger k\u00f8dkv\u00e6gss\u00e6d til
  nogle af k\u00f8erne. Vores Organic RDD projekt SUMMER har demonstreret en v\u00e6sentligt
  bedre tilv\u00e6kst og slagtekvalitet hos krydsningskalve.\\n\\nMen k\u00f8d fra
  yngre dyr, fx tyrekalve slagtet 10-12 mdr. gamle, og som kan karakteriseres som
  rosafarvet, det skal man lede l\u00e6nge efter. Men hvorfor nu det?\\n\\n\u00d8kologiske
  tyrekalve s\u00e6lges\\n\\nJa, det skyldes, at de nyf\u00f8dte tyrekalve i langt
  overvejende grad s\u00e6lges 14 dage gamle til opdr\u00e6tning i den konventionelle
  slagtekalve- og ungtyreproduktion. De mister alts\u00e5 deres ''r\u00f8de \u00f8kologiske
  \u00f8rem\u00e6rke'' meget tidligt i livet. Dette g\u00e6lder DH og RDM tyrekalve.\\n\\nHvorfor
  s\u00e6lger \u00f8kologen sine tyrekalve? Det \u00f8kologiske regels\u00e6t foreskriver
  brug af m\u00e6lk til min. 3 mdr., at kalvene skal p\u00e5 gr\u00e6s i sommerhalv\u00e5ret,
  og at der skal anvendes min. 60 % grovfoder i rationen. Da afregningsprisen p\u00e5
  slagteriet kun er f\u00e5 kroner h\u00f8jere per kg slagtekrop, s\u00e5 kan man
  d\u00e5rligt f\u00e5 \u00f8konomi i at opfede en s\u00e5dan \u00f8kokalv. Skal kalven
  forblive \u00f8kologisk, m\u00e5 der rykkes p\u00e5 effektivitet, afregningspris
  og/eller regels\u00e6t.\\n\\nHvordan kan effektiviteten for\u00f8ges?\\n\\nDer er
  ikke tradition for, at specialiserede \u00f8kologiske landm\u00e6nd indk\u00f8ber
  tyrekalve ved frav\u00e6nning fra m\u00e6lk og opfeder disse i et rationelt system.
  Det kan v\u00e6re en m\u00e5de at \u00f8ge effektiviteten p\u00e5. Med u\u00e6ndret
  regels\u00e6t vil det kr\u00e6ve rationelle og gode gr\u00e6sningsarealer, stort
  grovfoderareal og velf\u00e6rdsvenlig vinteropstaldning.\\n\\nSkal der anvendes
  tyrekalve for at udnytte deres h\u00f8jere v\u00e6kstpotentiale i forhold til stude,
  s\u00e5 er der en s\u00e6rlig udfordring med hegn, h\u00e5ndtering, sikring af fedningsgrad
  mm.\\n\\nHvilke krav skal vi stille til \u00f8kologisk ungkv\u00e6g?\\n\\nKan vi
  acceptere en tidligere frav\u00e6nningsalder, fx 2 mdr., Kan vi acceptere udefold
  frem for reel afgr\u00e6sning? S\u00e5danne \u00e6ndringer vil reducere omkostningerne.
  Men samtidig er det vigtigt, at \u00f8kologisk ungkv\u00e6g er et unikt produkt
  og opfylder specifikke krav til opstaldning, fodring, fedtsyresammens\u00e6tning,
  smag mm.\\n\\nSkal afregningsprisen op og hvad vil forbrugerne betale?\\n\\nDet
  er helt sikkert n\u00f8dvendigt med en h\u00f8jere afregningspris til landmanden.
  Man skal ogs\u00e5 vide, hvor meget en \u00f8kologisk indstillet forbruger er villig
  til at betale for k\u00f8det. Det bliver unders\u00f8gt i SUMMER projektet. Personligt
  tror jeg f\u00f8rst p\u00e5 en markant \u00f8gning i produktionen, n\u00e5r detailled
  og forbrugere har vist en tilstr\u00e6kkelig sikker interesse. I mellemtiden vil
  jeg arbejde videre med at forbedre effektivitet, produktkvalitet og sundhed i \u00f8kologisk
  ungkv\u00e6gsproduktion.\\n\\nL\u00e6s mere om Organic RDD projektet, SUMMER p\u00e5:\\n\\nhttp://www.icrofs.dk/Sider/Forskning/
  organicrdd_summer.html\\n\\nDenne klumme blev bragt d. 11. oktober 2013 i \u00d8kologi
  & Erhverv nr. 531.\"", "\"Risiko- og kapitalstyring\\n\\nJyske Bank A/S Vestergade
  8-16 8600 Silkeborg Telefon 89 89 89 89 E-mail: email@example.com www.jyskebank.dk
  CVR nr. 17 61 66 17 Tryk: Jyske Bank\\n\\nIndhold\\n\\nIndhold\\n\\n1\\n\\nForord\\n\\nRisikorapportens
  form\u00e5l er at give et indblik i Jyske Banks interne risiko- og kapitalstyring
  samt regulatoriske kapitalforhold. I rapporten beskrives indledningsvist koncernens
  risikoanskuelse og risikoorganisation, hvorefter koncernens risiko- og kapitalstyring
  gennemg\u00e5s. I gennemgangen introduceres blandt andet de risici, som koncernen
  er eksponeret over for, hvoraf f\u00f8lgende uddybes: kreditrisiko, markedsrisiko,
  likviditetsrisiko og operationel risiko.\\n\\nSom det vil fremg\u00e5, er avanceret
  risikostyring og en st\u00e6rk kapitalbase centrale m\u00e5ls\u00e6tninger for koncernen,
  hvorfor risikostyring er en integreret del af koncernens daglige drift og strategiske
  beslutninger.\\n\\n\u00c5ret 2010\\n\\nIgennem 2010 var der svag fremgang i den
  \u00f8konomiske aktivitet. S\u00e5ledes blev den bratte \u00f8konomiske nedtur afl\u00f8st
  af positiv v\u00e6kst i fire kvartaler i tr\u00e6k. Opsvinget i 2010 har imidlertid
  v\u00e6ret drevet af offentligt forbrug, opbygning af varelagre og \u00f8get eksport,
  og har s\u00e5ledes i en vis grad v\u00e6ret underst\u00f8ttet af ikke-permanente
  v\u00e6kstmotorer. Den \u00f8konomiske fremgang er s\u00e5ledes fortsat meget skr\u00f8belig.
  Derudover er en r\u00e6kke centrale makro\u00f8konomiske n\u00f8gletal, som f.eks.
  antal ledige, antal offentliggjorte tvangsauktioner og konkurser, fortsat p\u00e5
  et h\u00f8jt niveau. Eftervirkningerne af krisen ses s\u00e5ledes fortsat.\\n\\nJyske
  Bank har derfor ogs\u00e5 i 2010 haft fokus p\u00e5 konsolidering og risikoforhold
  for at styrke koncernens robusthed og risikoprofil i forhold til den fremtidige
  udvikling.\\n\\nFremgangen i \u00f8konomien er afspejlet i, at omfanget af koncernens
  nedskrivninger er aftaget igennem 2010. Nedskrivningerne er dog fortsat p\u00e5
  et relativt h\u00f8jt niveau.\\n\\nKoncernens finansielle stilling ultimo 2009 gav
  Jyske Bank mulighed for at takke nej til deltagelse i Bankpakke II.\\n\\nJyske Bank
  kommer styrket ud af 2010 med yderligere konsolidering og et u\u00e6ndret st\u00e6rkt
  likviditetsberedskab, der g\u00f8r, at Jyske Bank er solidt positioneret i sektoren
  ved udgangen af 2010.\\n\\nKommende lovgivning\\n\\nDer er en r\u00e6kke tiltag
  under udarbejdelse vedr\u00f8rende regulering af den finansielle sektor. Der k\u00f8rer
  s\u00e5ledes i \u00f8jeblikket flere parallelle processer i regi af G20, Basel,
  IASB, og EU-Kommissionen m.fl. Mange af de nye tiltag implementeres over en l\u00e6ngere
  \u00e5rr\u00e6kke (2012-2023). Den kommende finansielle regulering stiller nye og
  sk\u00e6rpede krav til blandt andet bankernes kapital og likviditet. S\u00e5ledes
  stilles der betydeligt st\u00f8rre krav til b\u00e5de niveauet og kvaliteten af
  den n\u00f8dvendige minimumskapital. Endvidere stilles der h\u00f8jere krav til
  likviditetsberedskab og finansieringsstruktur.\\n\\nJyske Bank forventer ikke at
  f\u00e5 udfordringer med at overholde den kommende regulering, da Jyske Banks aktuelle
  kapitalniveau til fulde opfylder de forventede sk\u00e6rpede krav. Dels er koncernens
  kapitalstruktur, med en h\u00f8j kernekapital (ekskl. hybrid kernekapital) fuldt
  kompatibelt med de foreliggende udkast p\u00e5 omr\u00e5det, og dels giver kvaliteten
  og strukturen af koncernens likviditetsberedskab et godt udgangspunkt til at foretage
  eventuelle tilpasninger.\\n\\n- Solvensprocent 15,8 (2009: 15,3)\\n- Basiskapital
  16,1 mia. kr. (2009: 15,4 mia. kr.)\\n- Kernekapitalprocent 14,1 (2009: 13,5)\\n-
  EAD 212,9 mia. kr. (2009: 201,5 mia. kr.)\\n- \u00d8konomisk kapital 6,4 mia. kr.
  (2009: 5,4 mia.kr.)\\n- Risikov\u00e6gtede poster 101,6 mia. kr. (2009: 100,4 mia.
  kr.)\\n- Individuelt solvensbehov 9,4% (2009: 9,7%)\\n\\nRisikostyring\\n\\nRisikoprofil\\n\\nJyske
  Bank p\u00e5tager sig risiko med udgangspunkt i de strategiske m\u00e5ls\u00e6tninger.
  For at tilsikre effektiv m\u00e5ling, overv\u00e5gning, rapportering og ledelse
  bygger koncernens risikoprofil p\u00e5 en blanding af kapitalm\u00e5ls\u00e6tninger,
  risikopolitikker og \u2013bef\u00f8jelser samt kvantitative m\u00e5l, herunder  solvensbehov,
  indtjening og ekstern rating.\\n\\nJyske Bank anvender egne modeller i den interne
  styring. Med godkendelse som avanceret bank p\u00e5 kreditrisiko \u00e5bner kapitald\u00e6kningsbekendtg\u00f8relsen
  mulighed for at opg\u00f8re det regulatoriske kapitalkrav p\u00e5 baggrund af disse
  modeller, hvorved risiko- og kapitalstyring kan ses i sammenh\u00e6ng.\\n\\nP\u00e5
  baggrund af overordnede risikopolitikker er der udarbejdet specifikke risikoinstrukser
  p\u00e5 de v\u00e6sentligste risikoomr\u00e5der.\\n\\n\u00d8konomisk kapital\\n\\n\u00d8konomisk
  kapital er fundamentet for Jyske Banks risikoopg\u00f8relse og udtrykker det maksimale
  tab, som Jyske Bank kan p\u00e5drage sig med en given sandsynlighed over en given
  periode. \u00d8konomisk kapital bygger p\u00e5 Value-At-Risk (VaR) principper (med
  1 \u00e5rs horisont) for de risikotyper, som koncernen \u00f8nsker at modellere
  kvantitativt.\\n\\n\u00d8konomisk kapital omfatter en kvantificering af de fire
  hovedrisikotyper, som koncernen er eksponeret mod: kreditrisiko, markedsrisiko,
  operationel risiko og forretningsrisiko.\\n\\nRisici begr\u00e6nser sig dog ikke
  kun til det n\u00e6ste \u00e5r, ligesom der er forhold, som et VaR-setup ikke kan
  tage h\u00f8jde for. For at f\u00e5 et overblik over koncernens samlede risikoprofil
  bliver opg\u00f8relsen af \u00f8konomisk kapital derfor suppleret med opg\u00f8relse
  af likviditetsrisiko samt makro\u00f8konomiske stresstests, partielle f\u00f8lsomhedsanalyser,
  ekspertvurderinger mv., hvilket giver det samlede risikobillede.\\n\\nRisikobilledet\\n\\n\u00d8konomisk
  kapital\\nStress-\\ntests\\nScenarie-\\nanalyse\\nEkspert-\\nvurderinger\\nLovgivning   og\\ncompliance\\nMarkeds-\\nrisiko\\nOperationel\\nrisiko\\nKredit-\\nrisiko\\nForretningsrisiko\\nLikviditets-\\nrisiko\\nForretnings-\\nrisiko\\n\\n3\\n\\nRisikostyring\\n\\nDen
  daglige risikostyring afspejler konceptet for risiko med l\u00f8bende m\u00e5ling,
  overv\u00e5gning og rapportering. De bagvedliggende kvantitative modeller videreudvikles,
  valideres og forbedres l\u00f8bende.\\n\\nAnsvarsfordeling\\n\\nBestyrelsen fastl\u00e6gger
  og reviderer l\u00f8bende politikker, bef\u00f8jelser og principper for risiko-
  og kapitalstyringen og modtager l\u00f8bende rapportering p\u00e5 udviklingen i
  risici og udnyttelsen af tildelte risikorammer.\\n\\nDen overordnede \u00f8konomi-
  og risikostyring samt kapitaloptimering h\u00e5ndteres i enheden \u00d8konomi &
  Risikostyring, ligesom \u00d8konomi & Risikostyring forel\u00e6gger direktionen
  risikostyringsprincipper og politikker, som bestyrelsen godkender. Enheden har desuden
  ansvaret for:\\n\\n- indregning, m\u00e5ling og rapportering af regnskab og intern
  \u00f8konomi i koncernen, herunder ekstern rapportering samt implementering af r\u00e5dgivervendte
  \u00f8konomi- og risikov\u00e6rkt\u00f8jer\\n\\nRisikoorganisation\\n\\nBESTYRELSE\\nDIREKTION\\n\u00d8konomi
  & Risikostyring\\nBalance &\\nEgenbeholdning\\nJyske Markets\\nKoncernrisikokomit\u00e9\\nKapital
  og Risiko\\nMarkedsrisiko\\nModeludvikling\\nRegnskab\\n\u00d8konomistyring\\nKredit\\nKreditoverv\u00e5gning\\nRevisionsudvalg\\nKoncernegenbeholdningsforum\\nKoncernbalanceforum\\n\\n-
  implementering af risikostyringsprincipper og politikker med henblik p\u00e5 l\u00f8bende
  forbedring af risikostyring og intern kapitalallokering\\n- kvantificering af koncernens
  risici samt at overv\u00e5ge og rapportere om, hvorvidt koncernens risici holder
  sig inden for de rammer, der er godkendt af bestyrelsen.\\n\\n\u00d8konomi & Risikostyring
  er uafh\u00e6ngig af forretningsvendte aktiviteter.\\n\\nDen daglige styring af
  kreditrisici foretages af kunder\u00e5dgivere og kreditafdelingen. Markedsrisici
  - herunder likviditetsrisici \u2013 styres af Balance & Egenbeholdning, hvor investeringer
  generelt er baseret p\u00e5 makro\u00f8konomiske principper og derfor i sagens natur
  er langsigtede. Den daglige styring af operationelle risici foretages i de enkelte
  enheder i koncernen.\\n\\nRevisionsvalget er lovpligtigt og udv\u00e6lges blandt
  bestyrelsesmedlemmerne. Revisionsudvalget har blandt sine opgaver at overv\u00e5ge
  og vurdere effektiviteten af koncernens interne kontrol- og risikostyringssystemer.
  Dette sker blandt andet ved skriftlig og mundtlig rapportering til udvalget samt
  ved udvalgets behandling af revisionsrapporter p\u00e5 omr\u00e5det.\\n\\nKoncernrisikokomit\u00e9en
  forbehandler risikorelaterede emner inden endelig behandling i bestyrelsen. P\u00e5
  kvartalsvise m\u00f8der behandles emner i relation til:\\n\\n- lovgivningens krav
  til kapitald\u00e6kningsopg\u00f8relse\\n- koncernens basiskapital, solvensbehov
  samt kapital- og likviditetsberedskab (med tilh\u00f8rende n\u00f8dplaner)\\n- interne
  procedurer til risikom\u00e5ling og -styring\\n- allokering af risikokapital til
  enheder og risikotyper\\n- v\u00e6sentlige \u00e6ndringer i modelprincipperne bag
  risikostyringen samt den \u00e5rlige reestimation og validering af modeller.\\n\\nHovedopgaven
  for Koncernegenbeholdningsforum er p\u00e5 m\u00e5nedlige m\u00f8der at sikre, at
  koncernens faktiske markedsrisikoprofil er i overensstemmelse med vurderingen af
  markedsforventningerne og den tilsigtede risikoprofil.\\n\\nKoncernens likviditetsrisikoprofil,
  balanceudvikling og finansieringsstruktur vurderes af Koncernbalanceforum, som p\u00e5
  kvartalsvise m\u00f8der tilsikrer en fortl\u00f8bende betryggende likviditetsrisikoprofil
  og balancestruktur i overensstemmelse med de overordnede retningslinjer. Der foretages
  skriftlig rapportering til direktionen m.fl. p\u00e5 m\u00e5nedsbasis og efter behov
  indkaldes til supplerende m\u00f8der.\\n\\n5\\n\\nKapitalstyring\\n\\nKapitalstyring
  har til form\u00e5l at optimere koncernens kapitalstruktur i forhold til den fastlagte
  risikoprofil.\\n\\nNye kapitald\u00e6kningsregler\\n\\nEU-Kommissionen arbejder
  p\u00e5 en r\u00e6kke tiltag, der vil medf\u00f8re v\u00e6sentlige \u00e6ndringer
  i kapitald\u00e6kningsreglerne. Et af hovedform\u00e5lene er at \u00f8ge bankernes
  modstandsdygtighed i krisesituationer.\\n\\nDer forventes blandt andet sk\u00e6rpede
  krav til kernekapital \u2013 herunder en v\u00e6sentlig for\u00f8gelse af kernekapitalen
  (ekskl. hybrid), samt indf\u00f8relse af modcykliske kapitalkrav, der s\u00e6nkes
  i krisetider.\\n\\nJyske Banks h\u00f8je kernekapitalsniveau opfylder til fulde
  aktuelt de ventede, sk\u00e6rpede krav.\\n\\nKapitalm\u00e5ls\u00e6tning\\n\\nJyske
  Banks kapitalm\u00e5ls\u00e6tning tager udgangspunkt i en solvens, der er tilstr\u00e6kkelig
  til, at koncernen kan forts\u00e6tte sin udl\u00e5nsvirksomhed i en periode med
  sv\u00e6re forretningsbetingelser. S\u00e5ledes skal kapitalen b\u00e5de sikre,
  at lovm\u00e6ssige og interne kapitalkrav kan opfyldes i en s\u00e5dan situation
  samt modst\u00e5 store uventede tab.\\n\\nKoncernens kapitalplanl\u00e6gning tilrettel\u00e6gges
  ud fra en langsigtet m\u00e5ls\u00e6tning om at opn\u00e5 en rating p\u00e5 AA-niveau.
  Koncernen anser et ratingniveau p\u00e5 mindst A-niveau for vigtig.\\n\\nKapitalplanl\u00e6gning
  er ogs\u00e5 i 2011 kendetegnet ved maksimal konsolidering samt optimering af de
  risikov\u00e6gtede poster under hensyntagen til forretningsstrategien.\\n\\nVed
  indgangen til 2011 vurderes en kernekapitalprocent p\u00e5 minimum 12 og en samlet
  solvensprocent p\u00e5 minimum 14 at v\u00e6re i overensstemmelse med ovenn\u00e6vnte
  rating-m\u00e5ls\u00e6tninger.\\n\\nKapitalforhold\\n\\nUdviklingen i koncernens
  solvens- og kernekapitalprocent fremg\u00e5r af nedenst\u00e5ende tabel.\\n\\nTabellen
  viser, at solvens- og kernekapitalprocent er h\u00f8jere end de n\u00e6vnte m\u00e5ls\u00e6tninger.
  I overensstemmelse med koncernens kapitalm\u00e5ls\u00e6tning har Jyske Bank over
  det seneste \u00e5r \u00f8get kapitalgrundlaget. Den forbedrede solvensm\u00e6ssige
  situation skyldes is\u00e6r en stigende basiskapital.  Jyske Bank har valgt ikke
  at hjemtage ansvarlig kapital via Bankpakke II.\\n\\nBasiskapital\\n\\nBasiskapitalen
  best\u00e5r af kernekapital og supplerende kapital. Udviklingen i basiskapital er
  prim\u00e6rt bestemt ud fra \u00e5rets resultat.\\n\\nMinimumskapital\\n\\nMinimumskapitalopg\u00f8relsen
  udtrykker de regulatoriske kapitalkrav og bygger p\u00e5 risikotyperne kredit-,
  markeds- og operationel risiko og fremg\u00e5r af tabellen nedenfor. Minimumskapitalkravet
  relateret til CRD for\u00f8ges som f\u00f8lge af de videref\u00f8rte overgangsregler
  relateret til de tidligere kapitald\u00e6kningsregler, CAD.\\n\\nKreditrisikoen
  udg\u00f8r hovedparten af minimumskapitalkravet. Udviklingen i minimumskapital inden
  for kreditrisiko, markedsrisiko og operationel risiko beskrives i de f\u00f8lgende
  afsnit.\\n\\nRisikov\u00e6gtede poster (RVA) med kreditrisiko har v\u00e6ret faldende
  p\u00e5 trods af, at Exposure At Default (EAD) har v\u00e6ret stigende. \u00c5rsagen
  hertil skyldes prim\u00e6rt to forhold. Datterselskabet Jyske Finans'' kreditportef\u00f8lje
  er i 2010 blevet fuldt integreret i den avancerede opg\u00f8relsesmetode (AIRB).
  Implementeringen giver mulighed for at medregne en r\u00e6kke l\u00f8s\u00f8resikkerheder
  i beregningen af de risikov\u00e6gtede poster, som derved mindskes.  Derudover er
  der ved opg\u00f8relsen af v\u00e6rdi- en af finansielle sikkerheder taget en avanceret
  opg\u00f8relsesmetode i brug, som bygger p\u00e5 VaR principper.\\n\\nTil opg\u00f8relsen
  af kreditrisiko har Jyske Bank godkendelse til at anvende den avancerede interne
  ratingbaserede metode (AIRB). Godkendelsen omfatter anvendelse af avancerede metoder
  til beregning af minimumskapitalen p\u00e5 hovedparten af koncernens kreditportef\u00f8lje.\\n\\nVed
  udgangen af 2010 er AIRB fuldt ud implementeret i henhold til den implementeringsplan,
  som blev aftalt med Finanstilsynet i 2007, og koncernens krediteksponering fordeler
  sig herefter som vist i nedenst\u00e5ende tabel.\\n\\nNote: 8% af risikov\u00e6gtede
  poster.\\n\\nDet samlede minimumskapitalkrav til kreditrisiko er faldet i forhold
  til 2009.\\n\\n7\\n\\nKapitalstyring\\n\\nJyske Banks eksponeringer fordelt p\u00e5
  opg\u00f8relsesmetode ses af tabellen ovenfor. Som en direkte f\u00f8lge af, at
  Jyske Finans'' kunder nu opg\u00f8res efter AIRBmetoden, er andelen af Jyske Banks
  krediteksponeringer behandlet p\u00e5 AIRB-metoden steget fra 69% i 2009 til 72%
  i 2010, mens resten opg\u00f8res efter standardmetoden.\\n\\nTabellen over eksponeringer
  fordelt p\u00e5 styrkeprofilkarakterer illustrerer, at selvom den \u00f8konomiske
  udvikling i 2010 generelt har v\u00e6ret positiv, har opsvinget v\u00e6ret svagt
  set i lyset af den h\u00e5rde recession i 2008 og 2009. Dette har bevirket, at boniteten
  i Jyske Banks kreditportef\u00f8lje af erhvervskunder er blevet polariseret s\u00e5ledes,
  at de st\u00e6rke kunder er blevet st\u00e6rkere, mens de svage kunder er blevet
  svagere.\\n\\nAnvendelsen af avancerede metoder til opg\u00f8relse af kreditrisici
  medf\u00f8rer, at kapitalopg\u00f8relsen afspejler de risici, der netop kendetegner
  Jyske Banks kreditportef\u00f8lje. Den stigende andel eksponeringer p\u00e5 AIRBmetoden
  betyder dermed, at de enkelte risici er bedre modelleret end ultimo 2009. Sammens\u00e6tningen
  af Jyske Banks kreditportef\u00f8ljer er n\u00e6rmere beskrevet i afsnittet Kreditrisiko.\\n\\n*Ovenst\u00e5ende
  tabel omfatter kun performing-kunder\\n\\nDen numerisk st\u00f8rste stigning i eksponeringen
  mod detailkunder har fundet sted i det midterste kreditsegment, men ogs\u00e5 eksponeringen
  mod det d\u00e5rligste kreditsegment er steget. \u00c5rsagen til den forringede
  bonitet skal ogs\u00e5 for detailkunder findes i den makro\u00f8konomiske udvikling,
  der er reflekteret i kreditmodellerne.\\n\\nMarkedsrisiko opg\u00f8res efter standardmetoden
  til opg\u00f8relsen af minimumskapitalen, og operationel risiko opg\u00f8res efter
  standardindikatormetoden. Der er imidlertid til interne form\u00e5l udarbejdet avancerede
  metoder til opg\u00f8relse af begge risikotyper. Disse metoder anvendes blandt andet
  ved opg\u00f8relsen af den tilstr\u00e6kkelige basiskapital og tilh\u00f8rende solvensbehov.\\n\\nDen
  samlede minimumskapital til markedsrisiko er steget fra ultimo 2009. Stigningen
  skyldes for\u00f8gelse af eksponeringen i danske og udenlandske realkreditobligationer
  i f\u00f8rste 1. kvartal 2010 og igen i 4. kvartal 2010, hvilket har medf\u00f8rt
  et \u00f8get kapitalkrav til koncernens g\u00e6ldsinstrumenter. I den mellemliggende
  periode har niveauet for minimumskapitalen v\u00e6ret forholdsvist stabilt.\\n\\nKravet
  til minimumskapitalen p\u00e5 portef\u00f8ljen af securitiseringer er steget i forhold
  til sidste \u00e5r som f\u00f8lge af nedgraderinger i portef\u00f8ljen af CLO/CDO''er.
  Nedgraderingerne er sket l\u00f8bende gennem \u00e5ret, og kravet til minimumskapitalen
  p\u00e5 securitiseringer er dermed ligeledes \u00f8get l\u00f8bende. Nedenst\u00e5ende
  tabel viser endvidere en markant stigning i uv\u00e6gtede poster med en risikov\u00e6gt
  lavere end 50%. Denne stigning skyldes en \u00f8get eksponering i securitiseringer
  funderet i boligl\u00e5n til private; disse securitiseringer har en h\u00f8j kreditvurdering,
  og kravet til minimumskapitalen er derfor kun steget beskedent i forhold til stigningen
  i de uv\u00e6gtede poster. En v\u00e6sentlig del af de tilk\u00f8bte securitiseringer
  er placeret i handelsbeholdningen, hvorfor en st\u00f8rre andel af kravet til minimumskapitalen
  kan henf\u00f8res til positioner i handelsbeholdningen i forhold til 2009.\\n\\nTil
  opg\u00f8relse af minimumskapitalen p\u00e5 portef\u00f8ljen af securitiseringer
  anvendes b\u00e5de AIRB-metoden for kreditrisiko og standardmetoden for markedsrisiko,
  idet portef\u00f8ljen kan opdeles i en anl\u00e6gsbeholdning og en handelsbeholdning,
  hvor anl\u00e6gsbeholdningen er den st\u00f8rste portef\u00f8lje.\\n\\nMinimumskapitalen
  til operationel risiko er steget, hvilket afspejler stigende gennemsnitlige nettoindt\u00e6gter
  over de tre \u00e5r, opg\u00f8relsen omfatter.\\n\\nHeraf i handelsbeholdning\\n\\n1.728\\n\\n133\\n\\n132\\n\\n67\\n\\n9\\n\\nKapitalstyring\\n\\nICAAP\\n\\nJyske
  Banks ICAAP samler valideringer, m\u00e5linger og vurderinger med henblik p\u00e5
  at fastl\u00e6gge Jyske Banks tilstr\u00e6kkelige basiskapital og individuelle solvensbehov
  1 . Jyske Banks ICAAP giver et veldokumenteret overblik over nuv\u00e6rende og fremtidige
  risici og deres indbyrdes sammenh\u00e6nge. I Jyske Banks ICAAP indg\u00e5r en r\u00e6kke
  eksisterende og nyudviklede stresstests, der har til hensigt at modellere de mikro-
  og makro\u00f8konomiske faktorer, som Jyske Bank er eksponeret imod.\\n\\nHvert
  \u00e5r vil have sine s\u00e6rlige fokusomr\u00e5der, som koncernen i almindelighed
  og koncernledelsen i s\u00e6rdeleshed har valgt ud fra de risici, som er aktuelle
  i et givent \u00e5r eller har generel interesse som f\u00f8lge af Jyske Bank specifikke
  forhold, f.eks. portef\u00f8ljesammens\u00e6tning. De udf\u00f8rte analyser i relation
  til Jyske Banks ICAAP i 2010 er s\u00e5ledes valgt med henblik p\u00e5 at vurdere
  de forhold, der i 2010 og flere \u00e5r frem forventes at f\u00e5 indflydelse p\u00e5
  Jyske Banks solvensbehov.\\n\\nAnalyserne for hver risikotype har til hensigt at
  d\u00e6kke b\u00e5de kvalitative og kvantitative elementer i relation til b\u00e5de
  overv\u00e5gning og l\u00f8bende kvalitetssikring, herunder grundige vurderinger
  af modelforuds\u00e6tninger.\\n\\nMetode og foruds\u00e6tninger\\n\\nDen tilstr\u00e6kkelige
  basiskapital opg\u00f8res med udgangspunkt i Jyske Banks interne \u00f8konomisk
  kapitalmodeller, hvor det l\u00f8bende sikres, at opg\u00f8relsen er d\u00e6kkende
  og retvisende. I forl\u00e6ngelse af den \u00f8konomiske kapital vurderes de 17
  lovgivningsfastsatte forhold 2 , som i henhold til kapitald\u00e6kningsbekendtg\u00f8relsen
  skal vurderes ved udm\u00e5lingen af den tilstr\u00e6kkelige basiskapital.\\n\\nIndividuelt
  solvensbehov\\n\\nJyske Bank reserverer kapital til forhold, som ikke er indeholdt
  i den \u00f8konomiske kapital. For kreditrisiko vedr\u00f8rer det st\u00f8rste till\u00e6g
  store svage engagementer. Dette till\u00e6g er udarbejdet p\u00e5 baggrund af en
  meget forsigtig vurdering af forhold, der indg\u00e5r i beregningerne p\u00e5 disse
  engagementer, og som kan v\u00e6re beh\u00e6ftet med usikkerhed.\\n\\n1 Solvensbehovet
  udtrykker den tilstr\u00e6kkelige basiskapital set i forhold til de risikov\u00e6gtede
  poster (RVA).\\n\\n2 En oversigt over mapningen af de 17 forhold til Jyske Banks
  risikokategorier findes i Bilag 2.\\n\\nKapitaltill\u00e6ggene vedr\u00f8rende markedsrisiko
  er relateret til forhold, som ikke er indeholdt i den g\u00e6ldende VaR-beregning.
  Kapitaltill\u00e6g vedr\u00f8rende \u00f8vrige forhold d\u00e6kker over emner, som
  b\u00e5de er specifikke for Jyske Bank, og emner som er generelle for banksektoren.\\n\\nDet
  samlede, individuelle solvensbehov fremg\u00e5r af nedenst\u00e5ende tabel.\\n\\nDet
  individuelle solvensbehov er dels bestemt af den interne m\u00e5ling af tilstr\u00e6kkelig
  basiskapital som anf\u00f8rt ovenfor og dels af lovfastsatte gr\u00e6nser. Udover
  minimumskapitalen (solvensprocent p\u00e5 8%) er solvensbehovet underlagt overgangsreglerne
  for AIRBinstitutter. Koncernen har ultimo 2010 beregnet et internt solvensbehov
  p\u00e5 9,4%.\\n\\nSolvensbehov og kapitalbuffer\\n\\nKapitalbuffer plus den l\u00f8bende
  indtjening angiver den kritiske gr\u00e6nse for det maksimale tab, der kan forekomme
  uden behov for ekstra tilf\u00f8rsel af kapital. Jyske Banks store andel af kernekapital
  (ekskl. hybrid kernekapital) underbygger kvaliteten af den samlede kapital.\\n\\nSolvensbehov
  for Jyske Bank A/S\\n\\nDen tilstr\u00e6kkelige basiskapital for moderselskabet
  Jyske Bank A/S vil som en konservativ antagelse v\u00e6re identisk med koncernens,
  hvis moderselskabet h\u00e6fter for alle risici i datterselskaberne. Ved udm\u00e5ling
  af till\u00e6g til den \u00f8konomiske kapital er der samtidig ikke konstateret
  et behov for till\u00e6g i datterselskaberne. Opg\u00f8relserne af de risikov\u00e6gtede
  poster i henhold til CRD er 6,5% h\u00f8jere for Jyske Bank A/S end for koncernen,
  prim\u00e6rt fordi moderselskabets udl\u00e5n til datterselskaber v\u00e6gter i
  Jyske Banks solvensopg\u00f8relse. F\u00f8lgelig bliver moderselskabets solvensbehov
  8,8%.\\n\\nStresstests\\n\\nStresstest er et nyttigt kapitalstyringsv\u00e6rkt\u00f8j
  og derfor en v\u00e6sentlig del af Jyske Banks tilgang til fremskrivning af den
  tilstr\u00e6kkelige basiskapital og tilh\u00f8rende solvensbehov.\\n\\nEt form\u00e5l
  med stresstestanalyserne er at belyse, om det fremtidige risikoniveau i et bestemt
  scenarie kan kapitald\u00e6kkes givet koncernens indtjening, kapitalpolitik og -m\u00e5ls\u00e6tning
  samt risikom\u00e5l. Resultaterne af stresstestanalyserne anvendes f.eks. ogs\u00e5
  i vurderingen af, om kapitalniveauet og kvaliteten heraf er tilstr\u00e6kkelig,
  og f\u00f8lgelig om det er n\u00f8dvendigt med iv\u00e6rks\u00e6ttelse af koncernens
  kapitaln\u00f8dplan. Et centralt emne er derfor at fastl\u00e6gge de omst\u00e6ndigheder,
  som koncernen \u00f8nsker at kunne holde kapital til. Et andet form\u00e5l er vurderingen
  af solvensbehovet. Denne vurdering skal jf. lovkrav hertil som minimum tage udgangspunkt
  i stresstests, der svarer til et mildt recessionsscenarie.\\n\\nScenarier\\n\\nStresstests
  anvendes i en r\u00e6kke forskellige sammenh\u00e6nge. S\u00e5ledes udf\u00f8res
  b\u00e5de stresstests, der kan karakteriseres som f\u00f8lsomhedsanalyser af enkelte
  parametres betydning for risikoberegningen, samt omfattende scenariebaserede stresstest
  af betydningen af \u00e6ndrede konjunkturforhold. Netop scenariebaserede stresstests
  er udgangspunktet for vurderingen af behovet for et konjunkturtill\u00e6g til den
  tilstr\u00e6kkelige basiskapital, ligesom det anvendes intensivt i kapitalplanl\u00e6gningsanalyser.\\n\\nUdgangspunktet
  for stresstestanalyserne er opstilling af relevante makro\u00f8konomiske scenarier.
  Disse omfatter et scenarie for den forventede udvikling samt scenarier for forskellige
  recessionstilstande i dansk \u00f8konomi. Definitionen af recessionsscenarier beror
  b\u00e5de p\u00e5 hvilke omr\u00e5der, der vurderes at v\u00e6re beh\u00e6ftet med
  st\u00f8rst risiko, og hvilke forhold der er mest betydende for koncernen givet
  den aktuelle eksponering. Eksempler p\u00e5 scenarier fremg\u00e5r af nedenst\u00e5ende
  tabel.\\n\\n| BNP Privatforbrug Arbejdsl\u00f8shedsprocent Huspriser | 1,7% 1,7%
  2,2% |\\n|---|---|\\n|  | 1,9% 2,1% 2,1% |\\n|  | 4,2% 4,2% 4,1% |\\n|  | 1,0% 1,0%
  1,5% |\\n\\nKapitalstyring\\n\\nProcesser og modeller\\n\\nN\u00e5r scenarierne
  er fastlagt, benyttes en r\u00e6kke makrovariable til fremskrivning af tabsprocenter.
  Tabsprocenterne fremskrives p\u00e5 brancheniveau, s\u00e5 der tages h\u00f8jde
  for, at brancherne p\u00e5virkes forskelligt afh\u00e6ngig af scenariets karakter.
  De fremskrevne tabsprocenter overs\u00e6ttes herefter til mikroniveau, s\u00e5ledes
  at samtlige kunder f\u00e5r fremskrevet Probability of Default (PD) afh\u00e6ngig
  af hvilken branche, de tilh\u00f8rer. PD benyttes i fremskrivningen af den tilstr\u00e6kkelige
  basiskapital og minimumskapitalen 3 \u00e5r frem i tiden. Sidst fremskrives regnskabsposterne
  i overensstemmelse med det specificerede makroscenarie.\\n\\nStresstestanalyserne
  af recessionsscenarierne medf\u00f8rer typisk en stigning i den tilstr\u00e6kkelige
  basiskapital, hvilket er en naturlig konsekvens af den forventelig d\u00e5rligere
  kreditkvalitet i en stress-situation.\\n\\nBehandling af resultater\\n\\nLavv\u00e6kst-scenariet
  n\u00e6vnt ovenfor medf\u00f8rer dels en forringet konsolideringsevne og dels et
  h\u00f8jere solvensbehov. Begge er forhold, der reducerer afstanden mellem den udbudte
  og efterspurgte kapital. Trods krisen har basisindtjeningen ekskl. nedskrivninger
  p\u00e5 udl\u00e5n mv. vist en robust udvikling og er i stand til at absorbere store
  nedskrivninger p\u00e5 udl\u00e5n mv. S\u00e5ledes er et af resultaterne fra stresstestanalyserne
  af en langvarig recession ogs\u00e5, at det for\u00f8gede nedskrivningsomfang i
  stor udstr\u00e6kning kan im\u00f8deg\u00e5s af basisindtjeningen. Endelig viser
  stresstestanalyserne, at koncernens kapitalstruktur og -niveau fortsat vil v\u00e6re
  p\u00e5 et betryggende niveau selv ved en langvarig recession. I lavv\u00e6kst-scenariet
  viser analyserne s\u00e5ledes en kapitalbuffer p\u00e5 mellem 6% og 7%.\\n\\nVurdering
  af behov for konjunkturtill\u00e6g\\n\\nProcessen omkring stresstesten spiller en
  vigtig rolle for fastl\u00e6ggelsen af et eventuelt konjunkturtill\u00e6g til kapitalen.
  Der skal foretages konjunkturtill\u00e6g, hvis modellerne indikerer, at den nuv\u00e6rende
  \u00f8konomiske situation er bedre end en mild recession. P\u00e5 trods af at det
  forventede scenarie vidner om \u00f8konomisk fremgang, er der flere faktorer i modellerne,
  der tr\u00e6kker i modsat retning. For eksempel har nedskrivningerne v\u00e6ret
  h\u00f8je gennem hele 2010.\\n\\nTilsvarende er PD p\u00e5 et historisk set h\u00f8jt
  niveau ved udgangen af 2010. P\u00e5 den baggrund vurderes det ikke, at der er behov
  for et konjunkturtill\u00e6g til koncernens kapital ultimo 2010.\\n\\nEksterne stresstests\\n\\nJyske
  Bank deltog i sommeren 2010 i CEBS'' stresstest af 91 store europ\u00e6iske banker.
  Til forskel fra de interne stresstests var scenarierne givet fra CEBS'' side. Herudover
  gennemf\u00f8rtes CEBS'' stresstest ved hj\u00e6lp af de ovenfor beskrevne modeller
  og processer. Jyske Bank opn\u00e5ede en meget tilfredsstillende delt 7. plads blandt
  de 91 deltagende europ\u00e6iske banker.\\n\\nDanmarks Nationalbank har i november
  2010 foretaget en top-down stresstest af de 14 st\u00f8rste danske banker. Stresstesten
  indebar bl.a. et kombineret lavv\u00e6kst- og rentescenarie, hvor bankerne blev
  udsat for en meget h\u00e5rd lavkonjunktur kombineret med st\u00e6rkt stigende renter.
  Nationalbankens beregninger viste, at hovedparten af de testede banker ville f\u00e5
  problemer med at overholde solvensbehovet. Jyske Banks egne beregninger viser, at
  Jyske Bank vil v\u00e6re i stand til at overholde solvenskravet.\\n\\nFor at teste
  koncernens modstandsdygtighed i en ekstrem situation, har Jyske Bank gennemf\u00f8rt
  en intern stresstest med udgangspunkt i Nationalbankens lavv\u00e6kst- og rentescenarie.
  Stresstesten af dette ekstreme scenarie har til form\u00e5l at afd\u00e6kke koncernens
  kapitalforhold ved en meget ugunstig udvikling i makro\u00f8konomien. Derved afd\u00e6kkes
  de enkelte kreditsegmenter i en ekstrem situation, hvilket giver nyttig information
  til konstruktionen af s\u00e5kaldte omvendte stresstests, hvor der testes, hvor
  store tabsprocenter Jyske Bank kan modst\u00e5 givet de best\u00e5ende kapitalforhold.
  Resultatet af denne stresstest viser, at de nuv\u00e6rende kapitalforhold g\u00f8r
  Jyske Bank i stand til at klare selv en meget h\u00e5rd tilbagegang i konjunkturerne.
  Endvidere indikerer stresstesten, at Jyske Banks kapitalforhold er blandt de 3 bedste
  sammenlignet med de \u00f8vrige 13 deltagende banker i Nationalbankens stresstest.\\n\\n\u00d8konomisk
  kapital\\n\\n* \u00d8konomisk kapital udtrykker den kapital, der kr\u00e6ves for
  at underst\u00f8tte det nuv\u00e6rende risikoniveau \u00e9t \u00e5r frem. I koncernen
  d\u00e6kker den \u00f8konomiske kapital uventede tab inden for et \u00e5r med en
  sandsynlighed p\u00e5 99,97% svarende til niveauet for en AA-rated bank\\n\\n\u00d8konomisk
  kapital udg\u00f8r kernen i styringen af koncernens risiko- og kapitalforhold og
  er et centralt element i den daglige \u00f8konomiske styring.\\n\\nEn af styrkerne
  ved \u00f8konomisk kapital er, at det giver et samlet tal for alle risikotyper,
  produkter og forretningsenheder, hvor der tages h\u00f8jde for korrelationseffekter
  indenfor og mellem risikotyperne. Der er s\u00e5ledes tale om \u00e9t risikom\u00e5l
  udtrykt i \u00e9n f\u00e6lles enhed, hvor kapitalen til enhver tid afspejler koncernens
  risiko et \u00e5r frem.\\n\\nJyske Bank anvender RAROC-baserede v\u00e6rkt\u00f8jer
  p\u00e5 alle niveauer fra vurdering af enkeltforretninger til vurdering af resultater
  p\u00e5 kunde-, afdelings-, omr\u00e5de-, forretningsenheds- og koncernniveau. RAROC-opg\u00f8relserne
  giver overblik over risikoen og rentabiliteten i koncernens forskellige aktiviteter.
  Udviklingen i den generelle kreditkvalitet i portef\u00f8ljen, koncentrationsrisiko
  og sikkerhedsv\u00e6rdier mv. vurderes n\u00f8je i denne sammenh\u00e6ng.\\n\\nRisikobilledet\\n\\nJyske
  Banks m\u00e5ls\u00e6tning er, at alle v\u00e6sentlige risici skal v\u00e6re indeholdt
  i den \u00f8konomiske kapital. Jyske Banks risikobillede bliver l\u00f8bende vurderet,
  og der bliver taget stilling til, hvorvidt der er andre risici, der skal kvantificeres
  i den \u00f8konomiske kapital. De risici, der allerede indg\u00e5r i kapitalopg\u00f8relsen,
  testes og valideres for at sikre, at risikoen til stadighed er retvisende belyst.\\n\\n\u00d8konomisk
  kapital omfatter en kvantificering af de fire hovedrisikotyper, som koncernen er
  eksponeret mod: kreditrisiko, markedsrisiko, operationel risiko og forretningsrisiko.
  Under hver hovedtype er forskellige typer risici indeholdt. Kreditrisiko omfatter
  s\u00e5ledes blandt andet koncentrationsrisiko, migrationsrisiko og modpartsrisiko,
  og markedsrisiko d\u00e6kker over rente-, valuta-, r\u00e5vare- og aktierisiko.
  Under operationel risiko behandles kontrolrisici, og forretningsrisiko omfatter
  udover koncernens forretningsrisiko ogs\u00e5 koncernens omd\u00f8mmerisiko.\\n\\nRAROC\\n\\nRAROC
  er koncernens prim\u00e6re ledelsesv\u00e6rkt\u00f8j til resultatm\u00e5ling af
  det risikojusterede \u00f8konomiske resultat.\\n\\nBeregningen af \u00f8konomisk
  kapital og opg\u00f8relse af RAROC p\u00e5 omr\u00e5de- og forretningsenhedsniveau
  sker kvartalsvis. Rapporteringen forel\u00e6gges Koncernrisikokomit\u00e9en og forretningsenhedernes
  ledelse, som fastl\u00e6gger aktiviteter til opf\u00f8lgning og eventuelle tiltag
  til reduktion af risikoen.\\n\\nRAROC anvendes ogs\u00e5 p\u00e5 kunde- og produktniveau
  til resultatm\u00e5ling og til rentabilitetsvurdering samt ved prisfasts\u00e6ttelse
  af nye l\u00e5n. Det er derfor centralt, at koncernen er i stand til at opg\u00f8re
  den \u00f8konomiske kapital p\u00e5 kunde- og produktniveau. RAROCopg\u00f8relserne
  og faciliteter til prisfasts\u00e6ttelse g\u00f8res tilg\u00e6ngelige i rentabilitetssystemer,
  hvori medarbejdere og ledere har adgang til aktuelle risikojusterede rentabilitetsopg\u00f8relser
  p\u00e5 forskellige niveauer.\\n\\nRentabilitetssystemerne tager i sine opg\u00f8relser
  hensyn til sammens\u00e6tningen af koncernens kreditportef\u00f8lje, hvilket betyder,
  at koncentrations- og diversifikationseffekter kommer direkte til udtryk i rentabilitetsopg\u00f8relserne
  p\u00e5 nye l\u00e5n. Tilbydes l\u00e5n til kunder i eksempelvis brancher, som i
  forvejen er kraftigt repr\u00e6senteret i koncernens kreditportef\u00f8lje, vil
  det alt andet lige betyde h\u00f8jere kapitalkrav og dermed lavere rentabilitet.
  Systemerne indarbejder endvidere ogs\u00e5 faste og variable omkostninger samt omkostninger
  forbundet med finansiering af l\u00e5net.\\n\\nUdvikling i \u00f8konomisk kapital\\n\\nDen
  \u00f8konomiske kapital er for koncernen ultimo 2010 opgjort til 6,4 mia. kr. mod
  5,4 mia. kr. ultimo 2009, hvilket udg\u00f8r en stigning p\u00e5 17%. Stigningen
  er hovedsagligt drevet af en betydelig stigning i kreditrisikoen, der prim\u00e6rt
  skyldes en negativ udvikling i kreditkvaliteten.\\n\\n| 2010 2009 |  |\\n|---|---|\\n|
  Kreditrisiko Markedsrisiko Operationel risiko Forretningsrisiko | Mio. kr. % Mio.
  kr. % |\\n|  | 4.756 75 3.826 70 |\\n|  | 633 10 640 12 |\\n|  | 304 5 311 6 |\\n|  |
  675 10 664 12 |\\n| I alt | 6.368 100 5.441 100 |\\n\\nStigningen i den \u00f8konomiske
  kapital mod kreditrisikoen p\u00e5 24% i 2010 skyldes i stort omfang en forv\u00e6rring
  af kundernes kreditkvalitet. S\u00e6rligt landbruget er karakteriseret af en negativ
  udvikling og bevirker, at den \u00f8konomiske kapital for landbrugskunderne stiger
  med 300 mio. kr.\\n\\nOmkring 240 mio. kr. af stigningen i \u00f8konomisk kapital
  mod kreditrisiko skyldes en \u00f8get beholdning af obligationer, eftersom Jyske
  Bank i 2010 har set et potentiale i investering i udenlandske stats- og realkreditobligationer.\\n\\nKoncernens
  \u00f8konomiske kapital til markedsrisiko er stort set u\u00e6ndret i forhold til
  ultimo 2009.\\n\\nDet begr\u00e6nsede fald i kapital til operationel risiko d\u00e6kker
  over to modsatrettede effekter. Risikoen stiger isoleret set, prim\u00e6rt som f\u00f8lge
  af den igangv\u00e6rende proces, hvor store dele af Jyske Banks ITudvikling flyttes
  til Bankdata.  I modsat retning medf\u00f8rer en stigende diversifikation mod andre
  risikotyper, at risikoen samlet set reduceres.\\n\\nModellering af risikotyperne
  i \u00f8konomisk kapital\\n\\nDe forskellige risici, som indg\u00e5r i den \u00f8konomiske
  kapital, stiller meget forskellige krav til den tekniske modellering af portef\u00f8ljerisikoen.
  Systemet, hvori beregningerne foretages, er derfor bygget op omkring forskellige
  delmodeller, som specifikt er designet til at afspejle de enkelte risikotypers s\u00e6rlige
  egenskaber og karakteristika. De forskellige modeller er beskrevet nedenfor og under
  de enkelte risikoafsnit senere i rapporten.\\n\\nKreditrisiko\\n\\nMed henblik p\u00e5
  at underst\u00f8tte koncernens m\u00e5ls\u00e6tning om at kunne styre koncernens
  kreditrisici p\u00e5 portef\u00f8ljeniveau, anvender Jyske Bank en avanceret kreditportef\u00f8ljemodel
  p\u00e5 tv\u00e6rs af alle forretningsenheder og kundegrupper.\\n\\nModellen baserer
  sig p\u00e5 et Merton-setup, hvor kundens kreditkvalitet er m\u00e5lt som forholdet
  mellem v\u00e6rdien af kundens aktiver og forpligtelser relativt til volatiliteten
  p\u00e5 aktiverne. Default indtr\u00e6der, hvis v\u00e6rdien af aktiverne er lavere
  end v\u00e6rdien af forpligtelserne.\\n\\nI modellen kapitaliseres s\u00e5vel almindelig
  defaultrisici som risici for v\u00e6rditab som f\u00f8lge af reduktion af kundernes
  kreditkvalitet. Sidstn\u00e6vnte risici kaldes for migrationsrisiko og udtrykker
  den sandsynlige migrering, som forventes i kundernes kreditkvalitet frem til udl\u00f8b
  af aktiverne i portef\u00f8ljen.\\n\\nAlle krediteksponeringer i koncernen indg\u00e5r
  direkte i modellens beregninger, herunder garantier, obligationer og afledte finansielle
  instrumenter. For afledte finansielle instrumenter, hvor den fremtidige krediteksponering
  er stokastisk, anvendes et setup til bestemmelse af den forventede fremtidige positive
  eksponering (EPE).\\n\\nPortef\u00f8ljemodellen tager i beregningerne h\u00f8jde
  for de enkelte kunders og eksponeringers specifikke karakteristika. Grundelementerne
  i den forbindelse er PD, LGD, EAD, l\u00f8betid, forventede cashflowprofiler samt
  usikkerhed omkring tabets st\u00f8rrelse ved misligholdelse. Korrelation mellem
  kunderne i portef\u00f8ljen modelleres via en faktormodel ud fra oplysninger om
  kundernes aktiviteter i lande, brancher og f\u00f8lsomhed over for den generelle
  systematiske risiko.\\n\\nTabsfordelingen afd\u00e6kkes ved hj\u00e6lp af Monte
  Carlosimulation. P\u00e5 baggrund af den simulerede tabsfordeling bestemmes den
  \u00f8konomiske kapital, som allokeres tilbage til hver enkelt facilitet i portef\u00f8ljen.\\n\\nModellen
  h\u00e5ndteres i det tilk\u00f8bte software \\\"Moody''s/KMV Portfolio Manager\\\",
  som i dag er fuldt integreret s\u00e5vel data- som beregningsm\u00e6ssigt.\\n\\nMarkedsrisiko\\n\\nTil
  opg\u00f8relse og overv\u00e5gning af risikoen p\u00e5 markedsrisikopositioner anvender
  koncernen VaR. H\u00e5ndteringen sker p\u00e5 basis af en egenudviklet model.\\n\\nVaR
  udtrykker det maksimale tab, som koncernen kan p\u00e5drage sig med en given sandsynlighed
  over en given periode. Til \u00f8konomisk kapital anvendes en periode p\u00e5 1
  \u00e5r og et sandsynlighedsniveau p\u00e5 99,97%.\\n\\nOperationel risiko\\n\\nOperationel
  risiko overv\u00e5ges, styres og kapitaliseres p\u00e5 basis af en scenariebaseret
  tilgang, hvor fokus er p\u00e5 store risici med v\u00e6sentlig betydning for koncernen.\\n\\nDer
  anvendes en portef\u00f8ljemodel, som bygger p\u00e5 Monte Carlo-simulation, og
  i beregningerne anvendes data fra scenarieanalyserne i form af vurderinger af tabsfrekvens
  og tabsst\u00f8rrelse/tabsfordeling for hvert enkelt scenarie.\\n\\nModellen bygger
  p\u00e5 en antagelse om uafh\u00e6ngighed mellem risikoscenarierne, hvilket er tilsikret
  i definitionen af scenarierne. Modellen beregner den \u00f8konomiske kapital, som
  skal holdes for hvert risikoscenarie. Kapitalen allokeres til de indtjenende enheder
  efter en internt udviklet allokeringsmodel.\\n\\nForretningsrisiko\\n\\nJyske Bank
  foretager beregningen af den \u00f8konomiske kapital i forbindelse med forretningsrisiko
  p\u00e5 basis af en egenudviklet model.\\n\\nRisikoen optr\u00e6der som f\u00f8lge
  af uventede tab i indtjeningen. Tabene kan v\u00e6re foranlediget af forskellige
  h\u00e6ndelser, eksempelvis ny lovgivning, stigende konkurrence mm., som skader
  forretningen eller bevirker, at forretningsgrundlaget mindskes eller bortfalder.\\n\\nBeregningen
  af den \u00f8konomiske kapital sker ud fra en mapning af koncernens aktiviteter
  mod benchmarkselskaber, hvis aktiviteter kun indbefatter forretningsrisiko. Under
  antagelse af at den kapital, som disse benchmark-selskaber holder, afspejler den
  risiko, enhederne p\u00e5tager sig, beregnes den tilsvarende \u00f8konomiske kapital
  til forretningsrisiko for koncernen.\\n\\nEn ny model til beregning af forretningsrisiko
  er under udvikling. Modellen beregner kapitalbehovet p\u00e5 baggrund af negative
  afvigelser i basisindtjeningen ud fra principper inspireret af Jyske Banks stresstest
  setup. Beregningerne for hver enhed h\u00e5ndteres s\u00e6rskilt, hvilket tillader
  en skr\u00e6ddersyet modellering af forretningsomr\u00e5derne.\\n\\nForel\u00f8bige
  analyser baseret p\u00e5 den nye model indikerer, at det nuv\u00e6rende kapitalniveau
  for forretningsrisiko er tilstr\u00e6kkeligt. Den nye model forventes f\u00e6rdigudviklet
  i l\u00f8bet af 2011 og vil blive implementeret efter validering af antagelser og
  resultater.\\n\\nKreditrisiko\\n\\n* Kreditrisiko er risikoen for, at koncernen
  f\u00e5r tab som f\u00f8lge af, at kunder og andre modparter ikke overholder deres
  betalingsforpligtelser. I kreditrisikoen indg\u00e5r l\u00e5n, tilsagte kreditter
  og garantier samt markedsv\u00e6rdier p\u00e5 afledte finansielle instrumenter og
  eventuelle kapitalandele.\\n\\nStyring af kreditrisikoen sker blandt andet p\u00e5
  baggrund af koncernens kreditrisikomodeller, som omfatter modellering af PD, LGD
  og EAD. Modellerne anvendes til forskellige form\u00e5l, herunder r\u00e5dgivning
  af Jyske Banks kunder og rapportering til ledelsen.\\n\\nKreditpolitik og forankring\\n\\nJyske
  Banks bestyrelse fastl\u00e6gger de overordnede rammer for kreditgivningen i koncernen,
  ligesom de st\u00f8rste engagementer l\u00f8bende forel\u00e6gges bestyrelsen til
  bevilling. Bestyrelsen videredelegerer tillige bef\u00f8jelser til direktionen.\\n\\nKreditrisikoen
  styres via Jyske Banks kreditpolitik, der er fastlagt med det m\u00e5l, at koncernens
  tab skal v\u00e6re p\u00e5 et acceptabelt niveau i forhold til koncernens kapitalgrundlag
  og forretningsomfang samt udviklingen i det omgivende samfund. Kundernes forretninger
  med koncernen skal langsigtet give et tilfredsstillende afkast opgjort efter RAROC-principper.\\n\\nDer
  er udf\u00e6rdiget specifikke kreditpolitikker p\u00e5 alle omr\u00e5der, hvor koncernen
  p\u00e5tager sig kreditrisiko med fastl\u00e6ggelse af niveauet for kreditrisikoen
  samt beskrivelse af u\u00f8nskede forretningstyper. Politikkerne tilpasses l\u00f8bende
  udviklingen p\u00e5 forretningsomr\u00e5derne og de styringsv\u00e6rkt\u00f8jer,
  der er til r\u00e5dighed for kunder\u00e5dgivere og overv\u00e5gningsfunktioner.\\n\\nEt
  b\u00e6rende element ved bed\u00f8mmelse af erhvervskundernes kreditv\u00e6rdighed
  er deres evne til at servicere g\u00e6lden med likviditet fra driften sammenholdt
  med deres finansielle styrke. For privatkunder er balancen mellem nettoindkomst,
  udgifter og formue afg\u00f8rende.\\n\\nBevilling og overv\u00e5gning af kreditrisici\\n\\nJyske
  Bank l\u00e6gger v\u00e6gt p\u00e5, at beslutninger om at yde kreditter tr\u00e6ffes
  t\u00e6t p\u00e5 kunden. Bef\u00f8jelser til den enkelte kunder\u00e5dgiver er tildelt
  ud fra en vurdering af kompetence og behov. Kreditbeslutninger over kunder\u00e5dgivernes
  bef\u00f8jelser foretages i Kreditafdelingen.\\n\\nOverv\u00e5gningen af koncernens
  kreditrisiko foretages af de to afdelinger Kapital og Risiko samt Kreditoverv\u00e5gning,
  som ikke har forretningsansvar. Der sker l\u00f8bende overv\u00e5gning og analyser
  af fordelingen af koncernens engagementer p\u00e5 st\u00f8rrelse, brancher og geografiske
  omr\u00e5der med hovedv\u00e6gt p\u00e5 at begr\u00e6nse risikoen i s\u00e6rligt
  risikofyldte brancher og geografiske omr\u00e5der og for at sikre en tilfredsstillende
  spredning i portef\u00f8ljen.\\n\\nOverv\u00e5gningen sker s\u00e5vel via kvantitative
  modeller som ved en specifik overv\u00e5gning af kreditkvaliteten i den enkelte
  afdeling og ved gennemgang af udvalgte st\u00f8rre engagementer. Overv\u00e5gningen
  omfatter herudover s\u00e5vel en kvalitativ som kvantitativ kontrol af de data,
  der indg\u00e5r i risiko- og RAROC-beregningerne.\\n\\nStore engagementer\\n\\nStore
  engagementer overv\u00e5ges l\u00f8bende i henhold til FiL \u00a7145, herunder engagementer
  st\u00f8rre end 10% af koncernens basiskapital. Den aktuelle procent er 32,5 mod
  26,7 ultimo 2009, og stigningen skyldes hovedsagelig ny lovgivning p\u00e5 omr\u00e5det.
  Koncernen har to engagementer, der er st\u00f8rre end 10% af basiskapitalen. Der
  er tale om engagementer med de to st\u00f8rste finanskoncerner i Danmark.\\n\\nSummen
  af engagementer >10% af basiskapitalen\\n\\nKreditvurderingsprocessen\\n\\nKreditprocesserne
  afpasses efter den risiko, der knytter sig til det enkelte engagement. Centrale
  elementer i kreditprocessen er PD og styrkeprofilkarakter.\\n\\nPD er sandsynligheden
  for, at kunden defaulter i l\u00f8bet af det kommende \u00e5r. En defaultkunde er
  en kunde, som ikke forventes at honorere sine forpligtelser over for koncernen.
  Langt de fleste kunder tildeles en PD p\u00e5 baggrund af statistiske kreditscoremodeller,
  som er udviklet internt i koncernen.\\n\\nMeget store virksomheder og virksomheder
  inden for specielle brancher tildeles dog en PD p\u00e5 baggrund af en uafh\u00e6ngig
  ekspertvurdering. Som eksempler kan n\u00e6vnes ejendomsselskaber, finansieringsselskaber,
  finansielle institutioner og stater. Her tages udgangspunkt i eventuelle eksterne
  ratings i den interne kreditvurdering af kunden.\\n\\nDer er en lang r\u00e6kke
  forhold, som er relevante for beregningen af en kundes PD. Der tages h\u00f8jde
  for specifikke forhold vedr\u00f8rende kunden, men samtidig medtages ogs\u00e5 forhold
  omkring den situation, som kunden befinder sig i. I beregningen af PD indg\u00e5r
  derfor regnskabstal, kontobev\u00e6gelser, ledelses- og markedsforhold, branchevurderinger
  mv. Der indg\u00e5r ogs\u00e5 specielle faresignaler omkring kundens kreditm\u00e6ssige
  udvikling, betalingsprofil og tabshistorik i beregningen.\\n\\nFor at skabe bedst
  muligt overblik over kundernes kreditkvalitet overs\u00e6ttes PD til interne ratings
  kaldet styrkeprofilkarakterer. Styrkeprofilkarakterer m\u00e5les p\u00e5 en skala
  fra 1 til 14, hvor 1 er den h\u00f8jeste kreditkvalitet (laveste PD), og 14 er den
  laveste kreditkvali- tet (h\u00f8jeste PD). Skalaen er fast over tid, s\u00e5ledes
  at kunderne migrerer op og ned afh\u00e6ngig af deres aktuelle PD. Niveaum\u00e6ssigt
  kalibreres PD til den langsigtede andel af defaultkunder m\u00e5lt tilbage til midten
  af 1980''erne, hvor den seneste st\u00f8rre lavkonjunktur begyndte.\\n\\nS\u00e5fremt
  den modelberegnede styrkeprofilkarakter vurderes ikke at v\u00e6re retvisende, har
  uafh\u00e6ngige krediteksperter mulighed for efter indstilling fra den kundeansvarlige
  at revurdere styrkeprofilkarakteren.\\n\\nKrediteksponeringer\\n\\nKrediteksponeringernes
  st\u00f8rrelse opg\u00f8res ved beregning af EAD (Exposure At Default). EAD er den
  forventede st\u00f8rrelse af engagementet p\u00e5 defaulttidspunket, s\u00e5fremt
  kunden defaulter i l\u00f8bet af det kommende \u00e5r. Kundens samlede EAD afh\u00e6nger
  af specifikke forhold ved kunden og de produkter, kunden er i besiddelse af. Ved
  de fleste produkttyper er EAD-beregningen baseret p\u00e5 statistiske modeller,
  mens enkelte produkttyper baseres p\u00e5 ekspertmodeller.\\n\\nVed faste l\u00e5n
  er eneste usikkerhedsmoment, hvor lang tid der g\u00e5r, f\u00f8r kunden eventuelt
  misligholder l\u00e5net. Usikkerheden er derimod st\u00f8rre ved kreditter, hvor
  kunden selv kan disponere inden for kreditrammen. Her er det afg\u00f8rende, hvor
  meget kunden udnytter den givne kreditramme op til tabstidspunktet. Dette kan modelleres
  ved hj\u00e6lp af kundespecifikke forhold samt forhold omkring engagementet.\\n\\nGarantier
  og tilsagn er specielle produkter i den henseende, at der skal ske en bestemt begivenhed,
  for at produktet bliver udnyttet. Det er s\u00e5ledes v\u00e6sentligt at vurdere
  sandsynligheden for, at produktet udnyttes, samt i hvilken grad det udnyttes, givet
  kunden defaulter inden for det n\u00e6ste \u00e5r. For tilsagn baseres EAD-parametrene
  prim\u00e6rt p\u00e5 ekspertvurderinger, da det er et omr\u00e5de, hvor koncernen
  historisk har haft meget f\u00e5 default-h\u00e6ndelser, hvorfor datagrundlaget
  er for spinkelt til egentlig statistisk modellering. For garantier eksisterer der
  tilstr\u00e6kkelig data til statistisk modellering.\\n\\nP\u00e5 afledte finansielle
  instrumenter opg\u00f8res EAD efter EPE-metoden - se n\u00e6rmere herom under modpartsrisiko.\\n\\nKreditrisiko\\n\\nI
  det f\u00f8lgende vises Jyske Banks krediteksponeringer m\u00e5lt ved EAD opdelt
  p\u00e5 en r\u00e6kke forskellige karakteristika.\\n\\nErhvervs-eksponeringer fordelt
  p\u00e5 styrkeprofil\\n\\nDetail-eksponeringer fordelt p\u00e5 styrkeprofil\\n\\nFor
  s\u00e5vel erhvervskunder som detailkunder (private samt sm\u00e5 virksomheder)
  er der sket en polarisering af portef\u00f8ljen. En st\u00f8rre andel befinder sig
  s\u00e5ledes i styrkeprofil 1 og i intervallet styrkeprofil 11-14, hvilket i h\u00f8j
  grad skyldes den samfundsm\u00e6ssige udvikling. Udviklingen i konjunkturerne har
  is\u00e6r ramt erhvervskunderne, hvilket har p\u00e5virket fordelingen negativt.
  Langt st\u00f8rstedelen af portef\u00f8ljen har dog stadig en god bonitet.\\n\\nFigurerne
  omfatter de enheder og selskaber i koncernen, hvor Jyske Bank er godkendt til at
  anvende avancerede modeller. Figurerne er ekskl. EAD til defaultede kunder, som
  Jyske Bank har klassificeret som h\u00f8j eller fuld risiko. Eksponering til disse
  kunder udg\u00f8r 5,1% (2009: 4,6%) af Jyske Banks samlede AIRB eksponering.\\n\\nDer
  er sket en begr\u00e6nset stigning i de gennemsnitlige eksponeringer p\u00e5 900
  mio. kr. svarende til 0,4%. Trods den minimale for\u00f8gelse er der indenfor eksponeringskategorierne
  sket v\u00e6sentlige \u00e6ndringer. Eksponeringer mod stater og offentlige myndigheder
  er faldet med 24% (3,4 mia. kr.). EAD mod institutter er faldet 6% (1,8 mia. kr.).\\n\\nDen
  gennemsnitlige eksponering for erhvervskunderne er steget med 6% (5,3 mia. kr.),
  mens detaileksponeringer stort set er u\u00e6ndret. I efterf\u00f8lgende tabeller
  sammenlignes ultimo 2010 med ultimo 2009, hvorfor der ikke kan sammenholdes med
  ovenn\u00e6vnte tabel, som viser gennemsnitseksponeringer.\\n\\n19\\n\\nKreditrisiko\\n\\nBranchefordelingen
  af den samlede portef\u00f8lje er p\u00e5virket af stigningen i eksponeringerne
  p\u00e5 11,4 mia. kr., hvilket svarer til ca. 6%. Stigningen d\u00e6kker over flere
  modsatrettede bev\u00e6gelser. Eksponeringer mod stater og offentlige er faldet
  med 15% (2,2 mia.kr.). Til geng\u00e6ld er eksponeringer mod institutter steget
  med 12% (3,8 mia. kr.) og mod erhverv med 9% (7,9 mia. kr.).\\n\\nStigningen i eksponeringskategorien
  Erhverv er prim\u00e6rt sket i branchegrupperne \u00d8vrig erhverv (3 mia. kr.),
  Finansiering og forsikring (2,8 mia. kr.) , Industri og r\u00e5stofindvinding (2,4
  mia. kr.) og Landbrug, jagt, skovbrug og fiskeri (1,2 mia. kr.).\\n\\nDe samlede
  eksponeringer til detailkunderne er steget med knap 2,4% (1,5 mia. kr.). Stigningen
  skyldes en stigning i eksponeringen til privatkunder med pant i fast ejendom p\u00e5
  1,6 mia. kr. og en stigning i eksponering til \u00f8vrige mindre erhverv p\u00e5
  knap 1,2 mia. kr. Disse stigninger er til dels modsvaret af fald i de \u00f8vrige
  kategorier p\u00e5 samlet 1,3 mia. kr.\\n\\nAf bilag 2 fremg\u00e5r yderligere en
  r\u00e6kke supplerende fordelinger af kreditrisiko.\\n\\nModpartsrisiko\\n\\nModpartsrisiko
  er risikoen for tab hos en modpart, der ikke overholder sine forpligtelser. Modpartsrisikoen
  opst\u00e5r, n\u00e5r koncernen handler afledte finansielle instrumenter med kunder.\\n\\nI
  koncernens politik for styring af modpartsrisiko skelnes mellem sm\u00e5 og store
  modparter. Sidstn\u00e6vnte inkluderer finansielle institutioner. De grundl\u00e6ggende
  opg\u00f8relsesprincipper for de to kundetyper er ens, dog er styring af st\u00f8rre
  modparter udbygget med yderligere styringsparametre.\\n\\nModpartsrisiko opg\u00f8res
  som summen af markedsv\u00e6rdi og markedsrisiko p\u00e5 de afledte finansielle
  instrumenter, som koncernen har handlet med modparten. Markedsrisikoen p\u00e5 koncernens
  modparter opg\u00f8res for risikotyperne rente-, aktie-, valuta- og r\u00e5varerisiko.
  Principperne herfor er beskrevet i kapitlet vedr\u00f8rende markedsrisiko.\\n\\nI
  styringen og overv\u00e5gningen af store modparter opg\u00f8r koncernen ligeledes
  afviklingsrisiko. Denne risiko opst\u00e5r ved afvikling af handler med afledte
  finansielle instrumenter, n\u00e5r den ene part overholder sin forpligtelse og overf\u00f8rer
  den solgte valuta til modparten, mens den anden part ikke overholder sin forpligtelse.
  For at reducere afviklingsrisikoen sker al handel s\u00e5 vidt muligt gennem CLS
  (Continuous Linked Settlement), en anden form for clearingscentral eller via individuel
  aftale om betalingsnetting.\\n\\nJyske Bank opg\u00f8r dagligt eksponeringen mod
  de enkelte modparter i koncernens systemer til styring af modpartsrisici, og de
  indg\u00e5r i kreditrisikostyringen p\u00e5 linje med \u00f8vrige kreditengagementer.
  Modparten bevilges lines inden for den g\u00e6ldende instruks efter individuel risikovurdering
  af modparten, hvor den aktuelle udnyttelse beregnes ud fra kundens eksponering i
  de enkelte risici. Minimum en gang \u00e5rligt eller ved \u00e6ndring i modpartens
  kreditv\u00e6rdighed revurderes tildelte lines.\\n\\nRisikoreduktion\\n\\nVed etablering
  af lines til afledte finansielle instrumenter tilstr\u00e6ber koncernen at reducere
  risikoen ved oprettelse af:\\n\\n- Service-, GMRA og CSA-aftale, som sikrer Jyske
  Bank ret til yderligere sikkerheder, s\u00e5fremt modpartens negative markedsv\u00e6rdi
  (g\u00e6ld til Jyske Bank) overstiger et p\u00e5 forh\u00e5nd aftalt maksimalt bel\u00f8b\\n-
  ISDA, GMRA, dansk rammeaftale eller serviceaftale, som sikrer koncernen ret til
  netting af markedsv\u00e6rdier p\u00e5 indg\u00e5ede handler med afledte finansielle
  instrumenter\\n- CLS, hvor afviklingsrisikoen fjernes, da clearingen foreg\u00e5r
  gennem en tredje part, som garanterer for udvekslingen.\\n\\nFor finansielle modparter
  og storkunder vil aftalen som oftest v\u00e6re gensidig, hvilket betyder, at Jyske
  Bank skal stille sikkerhed over for modparten, hvis markedsv\u00e6rdien i modpartens
  fav\u00f8r overstiger det aftalte maksimale bel\u00f8b.\\n\\nS\u00e5fremt der alene
  handles afledte finansielle instrumenter med kort l\u00f8betid (op til 6 m\u00e5neder),
  kan der efter individuel vurdering bevilges frafald af serviceaftale.\\n\\nModpartsrisiko
  og kapitalberegninger\\n\\nModpartsrisiko p\u00e5 afledte finansielle instrumenter
  kapitalbelastes s\u00e5vel regulatorisk efter kapitald\u00e6kningsbekendtg\u00f8relsen
  og i den interne risikostyring i Jyske Banks \u00f8konomiske kapitalmodel.\\n\\nVed
  opg\u00f8relse af den regulatoriske minimumskapital anvendes den s\u00e5kaldte markedsv\u00e6rdimetode
  med tilh\u00f8rende nettingmetode. Metoden indeb\u00e6rer, at der opg\u00f8res et
  kredit\u00e6kvivalent bel\u00f8b svarende til de positive markedsv\u00e6rdier efter
  netting tillagt en hovedstolsv\u00e6gt.\\n\\nKoncernens modpartsrisiko opgjort efter
  markedsv\u00e6rdimetoden fremg\u00e5r af nedenst\u00e5ende tabel\\n\\nI koncernens
  interne risikostyring anvendes et andet og mere nuanceret setup. Det specielle ved
  afledte finansielle instrumenter er, at den fremtidige cashflow-profil er ukendt.
  Der anvendes s\u00e5ledes en model, hvis grundl\u00e6ggende hensigt er at estimere
  den fremtidige cashflow- og eksponeringsprofil p\u00e5 baggrund af markedsv\u00e6rdierne
  og volatiliteten p\u00e5 modpartens produkter. Metoden kaldes ogs\u00e5 for EPE-metoden
  (Expected Positive Exposure).  Netting indg\u00e5r ogs\u00e5 i disse beregninger.\\n\\nSikkerheder\\n\\nMed
  henblik p\u00e5 at begr\u00e6nse kreditrisikoen vurderes n\u00f8dvendigheden af
  sikkerheder i det enkelte kundeforhold. Det er som hovedregel et krav, at kunden
  stiller hel eller delvis sikkerhed for engagementet. Begr\u00e6nsning af risikoen
  via sikkerheder indg\u00e5r derfor som en v\u00e6sentlig del i vurderingen af tabets
  st\u00f8rrelse i tilf\u00e6lde af default hos kunden (LGD).\\n\\nLGD er den andel
  af koncernens samlede engagement med kunden, som koncernen forventer at tabe, s\u00e5fremt
  kunden defaulter i l\u00f8bet af det kommende \u00e5r. Kundens LGD afh\u00e6nger
  af specifikke forhold ved kunden men ogs\u00e5 af kundens engagement og de tilh\u00f8rende
  sikkerheder. Helt overordnet afh\u00e6nger LGD s\u00e5ledes ogs\u00e5 af Jyske Banks
  evne til at inddrive betalinger og realisere sikkerheder.\\n\\nModelleringen af
  LGD er i Jyske Bank inddelt i to hovedomr\u00e5der: den del af engagementet, der
  er d\u00e6kket af sikkerheder samt den del af engagementet, der ikke er (blanko).
  I blankodelen estimeres den andel af kundens blankoengagement, som koncernen er
  i stand til at inddrive. Her er det kundespecifikke forhold s\u00e5vel som forhold
  omkring engagementet, der er afg\u00f8rende for st\u00f8rrelsen af LGD. I sikkerhedsdelen
  estimeres det forventede provenu ved realisation af sikkerhederne. Her er det afg\u00f8rende,
  hvilken type sikkerheder Jyske Bank har pant i samt aktivernes likviditet. I de
  tilf\u00e6lde, hvor der er tale om forholdsvis sj\u00e6ldne aktiver, foretager Jyske
  Bank et ekspertsk\u00f8n over provenuet, mens provenuet estimeres statistisk for
  mere hyppigt forekommende aktivklasser som k\u00f8ret\u00f8jer, fast ejendom og
  v\u00e6rdipapirer.\\n\\nModellerne for fast ejendom og k\u00f8ret\u00f8jer indeholder
  en l\u00f8bende ajourf\u00f8ring af den v\u00e6rdi, sikkerhederne till\u00e6gges,
  hvor der blandt andet tages h\u00f8jde for markedsm\u00e6ssige v\u00e6rdi\u00e6ndringer
  og forringelse som f\u00f8lge af alder. B\u00f8rsnoterede v\u00e6rdipapirer v\u00e6rdis\u00e6ttes
  p\u00e5 daglig basis.\\n\\nI beregningen af kapitalen anvendes LGD-estimater, som
  afspejler koncernens forventede tabsandele i en lavkonjunktur. LGD-estimaterne er
  baseret p\u00e5 de stillede sikkerheder, der anvendes til reduktion af kreditrisikoen.
  V\u00e6rdien af de stillede sikkerheder, der indg\u00e5r som kreditrisikoreduktion,
  fremg\u00e5r af efterf\u00f8lgende tabel.\\n\\nV\u00e6rdierne i tabellen er et udtryk
  for den forventede realisationsv\u00e6rdi fratrukket omkostninger til inddrivning
  og salg af de enkelte aktiver. V\u00e6rdien af de stillede sikkerheder er steget
  med godt 27%, hvilket er en v\u00e6sentligt st\u00f8rre stigning end for\u00f8gelsen
  af eksponeringerne. Stigningen skyldes prim\u00e6rt en stigning i v\u00e6rdipapirer,
  kontanter mv. p\u00e5 46% svarende til 16 mia. kr. For\u00f8gelsen afspejler stigende
  aktivv\u00e6rdier p\u00e5 de finansielle markeder. Der har derudover v\u00e6ret
  en mindre stigning i v\u00e6rdien af ejendomme, hvilket afspejler stabiliseringen
  af ejendomsmarkedet. Der har endvidere v\u00e6ret en stigning i l\u00f8s\u00f8re
  p\u00e5 46% svarende til knap 3 mia. kr., som hovedsagligt skyldes sikkerheder i
  Jyske Finans. I l\u00f8bet af 2010 kom erhvervsportef\u00f8ljen i Jyske Finans over
  p\u00e5 AIRB-metoden til opg\u00f8relse af kreditrisiko, hvilket giver mulighed
  for indregKreditrisiko\\n\\nning af l\u00f8s\u00f8resikkerheder. Derudover har der
  v\u00e6ret en stigning i \u00f8vrige sikkerheder p\u00e5 ca. 3,4 mia. kr.\\n\\nKoncernens
  eksponeringer afd\u00e6kket med garantier og kautioner fremg\u00e5r nedenfor. V\u00e6rdierne
  er de afd\u00e6kkede eksponeringers st\u00f8rrelse og er ikke at forveksle med den
  forventede realisationsv\u00e6rdi af den p\u00e5g\u00e6ldende garanti eller kaution.\\n\\nReestimation
  og validering af kreditrisikomodeller\\n\\nModellerne bag beregningerne af PD, LGD
  og EAD bliver som minimum reestimeret og valideret \u00e9n gang \u00e5rligt, uanset
  om modellerne er statistisk baserede eller ekspertvurderede. Reestimationen sikrer,
  at modellerne kontinuerligt afspejler de seneste \u00e6ndringer i data, s\u00e5ledes
  at modellerne giver s\u00e5 n\u00f8jagtig og opdateret information som muligt. Valideringen
  indeholder test af stabilitet, backtesting og benchmarking og har til hensigt at
  afd\u00e6kke eventuelle omr\u00e5der, der kr\u00e6ver s\u00e6rlig opm\u00e6rksomhed.\\n\\nTest
  af stabilitet har til form\u00e5l at overv\u00e5ge, hvorvidt modellernes estimerede
  parametre er stabile over tid. Identifikation af eventuelle strukturelle brud og
  systematiske afvigelser i parametre er vigtige aspekter, n\u00e5r der modelleres
  over s\u00e5 lange tidshorisonter, som det er tilf\u00e6ldet inden for kreditrisiko.\\n\\nForm\u00e5let
  med backtesting er at sammenligne modellernes forudsigelser med det, der rent faktisk
  er sket. Her er det vigtigt at korrigere for, at det ofte er n\u00f8dvendigt at
  sammenligne langsigtede estimater med kortsigtede realisationer. Eksempelvis er
  PD for en given STY-klasse kalibreret til et langsigtet niveau, mens realisationerne
  m\u00e5les p\u00e5 kort sigt (1 \u00e5rs horisont). Analysen m\u00e5 derfor betinges
  af, hvor i konjunkturforl\u00f8bet disse kortsigtede realisationer stammer fra.\\n\\nI
  forhold til benchmarking anvendes eksterne modeller. Alternativt opstilles internt
  udviklede benchmark, som modellerne efterpr\u00f8ves og overv\u00e5ges i forhold
  til.\\n\\nNedskrivninger p\u00e5 udl\u00e5n mv.\\n\\nJyske Bank foretager nedskrivninger
  p\u00e5 udl\u00e5n mv., n\u00e5r der konstateres objektiv indikation for v\u00e6rdiforringelse
  ud fra indtrufne begivenheder, og de p\u00e5g\u00e6ldende begivenheder har en virkning
  p\u00e5 st\u00f8rrelsen af de forventede fremtidige betalinger.\\n\\nKunder\u00e5dgiverne
  vurderer l\u00f8bende - og minimum hvert kvartal \u2013 hvorvidt der er indtr\u00e5dt
  objektiv indikation for v\u00e6rdiforringelse p\u00e5 koncernens kunder.\\n\\nRisikoklasser\\n\\nJyske
  Banks risikoengagementer opdeles i tre kategorier: engagementer med lav, h\u00f8j
  og fuld risiko. De to sidstn\u00e6vnte risikoklasser best\u00e5r af defaultede kunder,
  der ikke l\u00e6ngere i fuldt omfang vurderes at kunne opfylde deres betalingsforpligtelser
  over for koncernen. Risikoklasserne indg\u00e5r i koncernens nedskrivningsmetode.\\n\\nIndividuelle
  nedskrivninger p\u00e5 udl\u00e5n mv.\\n\\nJyske Bank opdeler individuelle nedskrivninger
  i henholdsvis signifikante og ikke-signifikante nedskrivninger. Nedskrivningen beregnes
  som forskellen mellem den regnskabsm\u00e6ssige v\u00e6rdi f\u00f8r nedskrivningen
  og nutidsv\u00e6rdien af de forventede fremtidige betalinger. Ved vurdering af de
  forventede fremtidige betalinger p\u00e5 signifikante udl\u00e5n tages udgangspunkt
  i en sandsynlighedsv\u00e6gtning af de mulige udfald.\\n\\nGruppevise nedskrivninger
  p\u00e5 udl\u00e5n mv.\\n\\nGruppevise nedskrivninger beregnes i et ratingbaseret
  nedskrivningssetup, hvor alle kunder, der ikke behandles individuelt, opdeles i
  nedskrivningsgrupper p\u00e5 baggrund af blandt andet kundernes styrkeprofilkarakterer
  og risikoklasse. Jyske Banks modeller til beregning af gruppevise nedskrivninger
  anvender korrigerede tabsparametre, der er udviklet til brug i koncernens \u00f8konomiske
  kapitalmodel. Til anvendelse i nedskrivningssammenh\u00e6ng er parametrene tilpasset
  p\u00e5 en r\u00e6kke omr\u00e5der, s\u00e5ledes at disse er i overensstemmelse
  med IFRS.\\n\\nNedskrivningsberegningen tager udgangspunkt i nettoforv\u00e6rringen
  i kreditrisikopr\u00e6mien p\u00e5 portef\u00f8ljeniveau siden etableringstidspunktet.
  Der anvendes s\u00e5ledes en nettotilgang ved beregning af gruppevise nedskrivninger
  i Jyske Bank, hvor der inden for den enkelte nedskrivningsgruppe beregnes nedskrivninger
  p\u00e5 baggrund af nettoforv\u00e6rringen af de fremtidige betalingsstr\u00f8mme
  siden etablering.\\n\\nGruppevis objektiv indikation for v\u00e6rdiforringelse er
  til stede, n\u00e5r der observeres data i en gruppe, der indikerer et fald i gruppens
  samlede fremtidige betalinger. I disse tilf\u00e6lde beregnes en gruppevis nedskrivning
  som det tilbagediskonterede forventede nettotab p\u00e5 gruppen.\\n\\nHens\u00e6ttelser
  p\u00e5 garantier og andre forpligtelser\\n\\nHens\u00e6ttelse beregnes, n\u00e5r
  det er sandsynligt, at forpligtelsen vil medf\u00f8re et tr\u00e6k p\u00e5 koncernens
  ressourcer, og n\u00e5r forpligtelsen kan m\u00e5les p\u00e5lideligt.\\n\\nJyske
  Banks hens\u00e6ttelser til garantier og andre forpligtelser omfatter blandt andet
  garantier stillet over for samarbejdspartnere, garantier stillet p\u00e5 vegne af
  koncernens kunder, afledte finansielle instrumenter og uudnyttede kredittilsagn.\\n\\nP\u00e5
  grundlag af historiske tabserfaringer sk\u00f8nner koncernen over de omkostninger,
  der er n\u00f8dvendige for at indfri forpligtelser p\u00e5 garantier eller omkostninger
  som f\u00f8lge af tab p\u00e5 kundens misligholdelse af indg\u00e5ede finansielle
  forretninger. Der indg\u00e5r b\u00e5de en vurdering af risikoen p\u00e5 relevante
  grupper af garantier og af den aktuelle tabsrisiko p\u00e5 ensartede grupper af
  kunder.\\n\\nHens\u00e6ttelse foretages med den sk\u00f8nnede tabsrisiko.\\n\\nUdvikling
  i nedskrivninger p\u00e5 udl\u00e5n mv.\\n\\nN\u00e5r et tab sk\u00f8nnes for uundg\u00e5eligt,
  tabsafskrives med et bel\u00f8b svarende til det sk\u00f8nnede tabs st\u00f8rrelse.\\n\\nFor
  misligholdte eksponeringer (defaultede og 90 days past-due) udg\u00f8r nedskrivnings-
  og hens\u00e6ttelsessaldoen 3,2 mia. kr. ultimo 2010 (2009: 2,5 mia. kr.).\\n\\nDriftsvirkningen
  p\u00e5 misligholdte eksponeringer udg\u00f8r 1,8 mia. kr. inkl. tab for 2010 mod
  2,3 mia. kr. i 2009. Tendensen har dermed v\u00e6ret aftagende.\\n\\nKreditrisiko\\n\\nDe
  mest risikofyldte brancher er (nedskrivningsprocent i parentes): Landbrug, jagt,
  skovbrug og fiskeri (4,4%), Bygge- og anl\u00e6g (4,3%) og Fast ejendom (3,4%).\\n\\nI
  2010 er 87% (2009: 84%) af nedskrivningerne p\u00e5 misligholdte eksponeringer relateret
  til erhverv, mens 13% (2009: 16%) er relateret til privat.\\n\\nDesuden har branchen
  Landbrug, jagt, skovbrug og fiskeri med knap en fordobling vist den st\u00f8rste
  v\u00e6kst i misligholdte eksponeringer. Omvendt er de konstaterede tab i branchen
  relativt lave.\\n\\nDet seneste \u00e5r har den samfunds\u00f8konomiske udvikling
  fortsat v\u00e6ret h\u00e5rd for virksomheder med aktiviteter relateret til fast
  ejendom, og det er derfor ikke overraskende, at brancherne Bygge- og anl\u00e6g
  og Fast ejendom ogs\u00e5 i 2010 har relativt store tab i forhold til branchernes
  eksponeringer. Der er i l\u00f8bet af 2010 tabt henholdsvis 2,0% (Bygge- og anl\u00e6g)
  og 1,6% (Fast ejendom) af branchernes eksponering.\\n\\nDen geografiske fordeling
  er vist i bilag 2, hvoraf der ogs\u00e5 fremg\u00e5r oplysninger omkring landefordeling,
  uudnyttede forpligtelser mv. p\u00e5 misligholdte eksponeringer.\\n\\nMarkedsrisiko\\n\\n*
  Markedsrisiko er risikoen for det tab, som kan opst\u00e5, n\u00e5r markedsv\u00e6rdien
  af koncernens aktiver og forpligtelser \u00e6ndrer sig som f\u00f8lge af kurs\u00e6ndringer
  p\u00e5 de finansielle markeder.\\n\\nJyske Bank p\u00e5tager sig markedsrisiko
  som f\u00f8lge af dispositioner foretaget p\u00e5 de finansielle markeder samt almindelige
  bankforretninger som ind- og udl\u00e5n. I opg\u00f8relsen af Jyske Banks markedsrisiko
  indg\u00e5r alle produkter, som indeholder en eller flere af de nedenn\u00e6vnte
  risici.\\n\\nBef\u00f8jelserne tildelt Handel & Analyse er tilpasset s\u00e5ledes,
  at de prim\u00e6rt underst\u00f8tter den daglige handelsoms\u00e6tning. Strategiske
  positioner disponeres af Balance & Egenbeholdning, hvilket st\u00f8rrelsen af omr\u00e5dets
  bef\u00f8jelser afspejler.\\n\\nRenterisiko:\\n\\nRisikoen for tab som f\u00f8lge
  af \u00e6n- dringer i markedsrenterne.\\n\\nValutakurs- risiko :\\n\\nRisikoen for
  tab som f\u00f8lge af \u00e6n- dringer i valutakurserne.\\n\\nAktierisiko:\\n\\nRisikoen
  for tab som f\u00f8lge af \u00e6n- dringer i aktiekurserne.\\n\\nR\u00e5varerisiko:\\n\\nRisikoen
  for tab som f\u00f8lge af \u00e6n- dringer i r\u00e5varepriserne.\\n\\nVolatilitets-\\n\\nrisiko:\\n\\nRisikoen
  for tab som f\u00f8lge af \u00e6n- dringer i volatiliteterne.\\n\\nVisse finansielle
  instrumenter indeholder elementer af kreditrisiko, ogs\u00e5 kaldet v\u00e6rdipapirbaserede
  kreditrisici. Denne type kreditrisiko styres og overv\u00e5ges parallelt med markedsrisikoen.\\n\\nPolitik
  og forankring\\n\\nJyske Banks bestyrelse fastl\u00e6gger en markedsrisikopolitik
  og tilh\u00f8rende retningslinjer, der angiver bestyrelsens risikoprofil p\u00e5
  markedsrisikoomr\u00e5det. Politikken er konkretiseret i en r\u00e6kke bef\u00f8jelser,
  der videredelegeres til direktionen.  En yderligere begr\u00e6nsning af bef\u00f8jelserne
  foretages inden delegering til de ansvarlige for Jyske Banks disponerende omr\u00e5der
  i Jyske Markets: Balance & Egenbeholdning samt Handel & Analyse. De to omr\u00e5der
  under Jyske Markets er de eneste omr\u00e5der i koncernen, der m\u00e5 have markedsrisici
  af betydning.\\n\\nDisponering under de respektive bef\u00f8jelser er underst\u00f8ttet
  af udf\u00f8rlige forretningsgange i Jyske Markets.\\n\\nFor at kunne f\u00f8lge
  markedsudviklingen p\u00e5 n\u00e6rmeste hold og derved have mulighed for at tilpasse
  eventuelle afvigelser mellem koncernens faktiske risikoprofil og den tilsigtede,
  afholdes der m\u00e5nedlige m\u00f8der i Koncernegenbeholdningsforum. P\u00e5 m\u00f8derne
  deltager de ansvarlige direktionsmedlemmer samt repr\u00e6sentanter fra Jyske Markets.\\n\\nOverv\u00e5gning
  og rapportering\\n\\nOverv\u00e5gningen af alle risikopositionerne foretages dagligt.
  Positioner, der overskrider de fastlagte bef\u00f8jelser eller risikostyringspolitikken,
  rapporteres straks til direktionen. S\u00e5fremt positionerne overstiger direktionens
  samlede bef\u00f8jelse, rapporteres der straks til bestyrelsen og intern revision.\\n\\nDer
  udarbejdes m\u00e5nedlige bef\u00f8jelsesoversigter over de forskellige bef\u00f8jelsesenheders
  udnyttelsesgrader, som fremsendes til direktionen og bestyrelsen.\\n\\nUdviklingen
  i markedsrisiko\\n\\nJyske Banks markedsrisiko opgjort ved VaR var ultimo 2010 12
  mio. kr., hvilket er n\u00e6sten u\u00e6ndret i forhold til ultimo 2009. Opg\u00f8relsen
  af VaR har dog vist st\u00f8rre udsving i l\u00f8bet af 2010. VaR toppede i 2. kvartal
  2010 med 24 mio.kr., hvilket var for\u00e5rsaget af en markant stigning i markedsvolatiliteterne
  og ikke af en \u00f8get eksponering i positioner. Udviklingen fremg\u00e5r af den
  efterf\u00f8lgende graf.\\n\\nMarkedsrisiko\\n\\nUdvikling i Value-at-Risk i procent
  af egenkapital\\n\\nSom grafen viser, er det prim\u00e6rt Jyske Banks renteportef\u00f8lje,
  der driver udviklingen i opg\u00f8relsen af VaR, idet renterisikoen er Jyske Banks
  v\u00e6sentligste markedsrisiko. Undtagelsesvist oversteg valutarisikoen renterisikoen
  midt i 2010. \u00c5rsagen hertil skal findes i v\u00e6sentlige \u00e6ndringer i
  Jyske Banks renteportef\u00f8lje.\\n\\nI takt med at markedsrenterne faldt markant
  i 2010, reduceredes renterisikoen, der n\u00e5ede et historisk lavt niveau i 3.
  kvartal 2010. Jyske Banks renterisiko er efterf\u00f8lgende steget og kan ultimo
  2010 betegnes som v\u00e6rende p\u00e5 et gennemsnitligt historisk niveau. Renterisikoen
  er udover bankens basisforretning i form af ind- og udl\u00e5n domineret af eksponeringer
  i danske og udenlandske realkreditobligationer samt s\u00e6rligt d\u00e6kkede obligationer
  med kort og mellemlang l\u00f8betid.\\n\\nUdviklingen i de \u00f8vrige markedsrisici
  \u2013 aktier, r\u00e5varer og valuta - har i l\u00f8bet af 2010 v\u00e6ret fastholdt
  p\u00e5 moderate niveauer. Jyske Banks eksponering i r\u00e5varer er dog i sidste
  halvdel af 2010 reduceret som f\u00f8lge af strategiske tiltag, og eksponeringen
  i r\u00e5varer kan betegnes som beskeden. Modsat er aktierisikoen langsomt steget
  igen oven p\u00e5 turbulensen omkring virksomhedernes indtjeningsmuligheder, idet
  udsigterne synes at v\u00e6re stabiliserede og positive.\\n\\nDe stabiliserede markeder
  har ogs\u00e5 givet anledning til, at Jyske Bank i l\u00f8bet af 2010 har \u00f8get
  eksponeringen i v\u00e6rdipapirbaseret kreditrisici. I denne forbindelse er der
  solgt to Credit Default Swaps, der antager en samlet nominel v\u00e6rdi p\u00e5
  225 mio. kr.\\n\\nMarkedsrisikotyper\\n\\nJyske Bank skal dagligt h\u00e5ndtere
  flere forskellige typer af markedsrisici. Hver risikotype har s\u00e6rlige karakteristika
  og styres ved s\u00e5vel individuelle risikom\u00e5l som samlet gennem koncernens
  VaR-model. Til afd\u00e6kning af markedsrisici anvendes afledte finansielle instrumenter.
  Styringen heraf suppleres af risikom\u00e5l udvik- let i henhold til klassisk optionsteori;
  dvs. ved positionernes delta-, gamma- og/eller vegarisiko.\\n\\nRenterisiko\\n\\nRenterisikoen
  beregnes dagligt p\u00e5 baggrund af varighedsm\u00e5l. Dette m\u00e5l defineres
  som renterisikoen ved en generel stigning i renteniveauet p\u00e5 \u00e9t procentpoint
  (Renterisiko 1). Varigheden angiver den procentvise gevinst eller det procentvise
  tab, der opst\u00e5r ved en \u00f8jeblikkelig parallelforskydning af samtlige rentekurver
  med \u00e9t procentpoint.\\n\\nRenterisikoen beregnes med udgangspunkt i aftalte
  betalinger. Jyske Bank har ikke fastforrentede mellemv\u00e6render med ubestemt
  l\u00f8betid. Visse l\u00e5n er ydet til fast rente med mulighed for f\u00f8rtidig
  indfrielse. Renterisiko 1 er korrigeret for dette optionselement. Jyske Bank har
  udviklet en avanceret risikostyringsmodel, der korrigerer realkreditobligationernes
  risikon\u00f8gletal for obligationernes indbyggede optionselement. I renterisikoen
  indg\u00e5r konverterbare realkreditobligationer dermed med den optionsjusterede
  varighed. Risikostyring af koncernens portef\u00f8lje af realkreditobligationer
  suppleres af beregning og rammer p\u00e5 positioner i Option-Adjusted Spreads (OAS-positioner).\\n\\nRenterisiko
  1 suppleres med et yderligere risikom\u00e5l, renterisiko 2, der tager h\u00f8jde
  for de risici, der er knyttet til sp\u00e6ndforretninger mellem rentepositioner
  i forskellige instrumenter og valutaer. Renterisiko 2 beregnes derfor som renterisiko
  1 plus till\u00e6g for rentestrukturrisici, volatilitetsrisici, landerisici og basisrisici.\\n\\nValutarisiko\\n\\nJyske
  Banks valutarisikoindikatorer beregnes med udgangspunkt i Valutaindikator 1 i henhold
  til Finanstilsynets regnskabsbekendtg\u00f8relse. Valutakursindikator 1 opg\u00f8res
  som summen af den st\u00f8rste numeriske v\u00e6rdi af nettotilgodehavender (lang
  position) eller nettog\u00e6ld (kort position) for hver valuta opgjort i kr.\\n\\nValutaindikator
  1 tager ikke h\u00f8jde for, at nogle valutaer er mere volatile og m\u00e5ske mindre
  likvide end andre. Derfor benytter Jyske Bank til styringsform\u00e5l en v\u00e6gtet
  valutaindikator 1 (Jyske Valutaindikator). Endvidere anvendes VaR som et styringsredskab
  p\u00e5 valutaeksponeringen.\\n\\nAktierisiko\\n\\nAktierisiko opg\u00f8res ved
  type a og b.\\n\\nAktierisiko a opg\u00f8res som 10% af nettoeksponeringen i aktier,
  hvor nettoeksponeringen er opgjort som positive eksponeringer fratrukket negative
  eksponeringer. Aktierisiko A udtrykker s\u00e5ledes st\u00f8rrelsen af det tab/den
  gevinst, der vil v\u00e6re resultatet af en global kurs\u00e6ndring p\u00e5 10%.\\n\\nAktierisiko
  b opg\u00f8res som 10% af den numeriske eksponering i aktier. Dette risikom\u00e5l
  udtrykker s\u00e5ledes bruttoeksponeringen, idet risikom\u00e5let viser st\u00f8rrelsen
  af det tab, der vil v\u00e6re resultat af et 10% kursfald p\u00e5 alle positive
  eksponeringer samtidig med en 10% kursstigning p\u00e5 alle negative eksponeringer.\\n\\nJyske
  Bank-aktier samt finansielle sektoraktier mv. er ikke medtaget i aktierisiko a og
  b. Foruden aktierisiko a og b har koncernen limitering af enkelteksponeringer i
  aktier for at begr\u00e6nse koncentrationsrisikoen.\\n\\nAktier uden for handelsbeholdning\\n\\nAktier
  uden for handelsbeholdningen vedr\u00f8rer fortrinsvist finansielle sektoraktier,
  som relaterer sig til koncernens almindelige driftsaktiviteter. Der er ikke planer
  om videresalg.\\n\\nJyske Bank realiserede i 2010 et tab p\u00e5 en position som
  f\u00f8lge af frasalg.\\n\\nAktier uden for handelsbeholdningen indg\u00e5r som
  en del af foruds\u00e6tningen for Jyske Banks almindelige forretningsaktivitet.
  Aktierne er optaget til dagsv\u00e6rdi som beskrevet i anvendt regnskabspraksis
  i koncernens \u00e5rsrapport. Urealiserede kursgevinster/tab har p\u00e5virket driftsresultatet.\\n\\nR\u00e5varerisiko\\n\\nR\u00e5varerisiko
  opg\u00f8res ved type a og b.\\n\\nR\u00e5varerisiko a opg\u00f8res som den samlede
  nettoeksponering i r\u00e5varer, hvor nettoeksponeringen er opgjort som positive
  eksponeringer fratrukket negative eksponeringer. Der er s\u00e5ledes modregningsret
  p\u00e5 tv\u00e6rs af r\u00e5varetyper og forfaldstidspunkter.\\n\\nR\u00e5varerisiko
  b opg\u00f8res som den samlede numeriske eksponering i r\u00e5varer. Dette risikom\u00e5l
  opg\u00f8r s\u00e5ledes bruttoeksponeringen, hvor der kun er modregningsret for
  kontrakter med samme underliggende r\u00e5vare og samme forfaldsdato.\\n\\nV\u00e6rdipapirbaseret
  kreditrisiko\\n\\nV\u00e6rdipapirbaseret kreditrisiko relaterer sig til koncernens
  obligationsbeholdning. Kreditelementet afspejles ikke i renterisikom\u00e5lene og
  fordrer derfor en selvst\u00e6ndig styring.\\n\\nJyske Bank styrer eksponeringen
  i v\u00e6rdipapirbaserede kreditrisici ved limitering af koncentrationsrisiko angivet
  ved v\u00e6rdipapirernes kreditkvalitet, der er defineret ved ratings fra anerkendte
  ratingbureauer. P\u00e5 basis af papirernes kreditkvalitet opg\u00f8res koncentrationsrisikoen
  p\u00e5 ratingklasser og obligationstyper. Der opereres dermed med forskellige limits
  afh\u00e6ngig af, om v\u00e6rdipapiret er en statsobligation, erhvervsobligation
  eller securitisering (CLO/CDO).\\n\\nEndelig er koncentrationsrisikoen limiteret
  p\u00e5 enkelteksponeringer.\\n\\nSecuritiseringer\\n\\nJyske Banks aktiviteter
  inden for securitiseringer knytter sig til investeringer i trancher udstedt af andre
  institutter og juridiske enheder. Koncernen agerer dermed hverken udsteder eller
  eksponeringsleverende virksomhed. Investeringerne er prim\u00e6rt i traditionelle
  securitiseringer og fordeler sig p\u00e5 f\u00f8lgende securitiseringstyper:\\n\\n-
  RMBS (Residential Mortgage Backed Serurities): Best\u00e5r udelukkende af AAA-ratede
  seniortrancher.\\n- CLO/CDO''er:\\no Seniortrancher med en oprindelig AAA rating  -
  enkelte er i dag AA rated.\\no Mezzanin trancher, der har en stor ratingspredning.\\n\\nSecuritiseringstyperne
  og den geografiske eksponering p\u00e5 portef\u00f8ljens underliggende aktiver er
  vist i den efterf\u00f8lgende tabel, hvoraf det fremg\u00e5r, at den v\u00e6sentligste
  eksponering er koncentreret p\u00e5 det europ\u00e6iske kontinent.\\n\\nMarkedsrisiko\\n\\nJyske
  Bank har igennem 2010 \u00f8get eksponeringen i europ\u00e6iske RMBS''er, og st\u00f8rstedelen
  af koncernens eksponeringer i securitiseringer ligger i AAA-rated seniortrancher,
  hvilket fremg\u00e5r af tabellen nedenfor. Tranchernes prim\u00e6re underliggende
  investeringer best\u00e5r af amerikanske og europ\u00e6iske bank- og boligl\u00e5n.\\n\\nValue-at-Risk\\n\\nJyske
  Bank har udviklet en VaR model til beregning og overv\u00e5gning af markedsrisici.
  VaR udtrykker den maksimale tabsrisiko over en periode, baseret p\u00e5 den historiske
  udvikling i de enkelte forretningstypers kurs og samvariation. Der er opstillet
  og uddelegeret risikobef\u00f8jelser p\u00e5 VaR.\\n\\nModellen er en parametrisk
  VaR baseret p\u00e5 en forbedret RiskMetrics-model. Volatiliteter og kovarianser
  i modellen er estimeret p\u00e5 baggrund af data seks m\u00e5neder tilbage i tiden.
  Dataene er v\u00e6gtet s\u00e5ledes, at de seneste observationer v\u00e6gter mest.
  VaR-modellen er specielt tilpasset, s\u00e5 den afspejler den indbyggede risiko
  for f\u00f8rtidsindfrielse p\u00e5 danske realkreditobligationer.\\n\\nRisikobef\u00f8jelser
  opg\u00f8res med 99% sandsynlighed samt p\u00e5 basis af 1 dags horisont og defineres
  som Daily Earnings at Risk (DEaR). En 99% DEaR indikerer 1% sandsynlighed for, at
  dagens faktiske kursreguleringer overskrider DEaR-tallet. Med andre ord b\u00f8r
  der p\u00e5 \u00e5rsbasis i gennemsnit v\u00e6re 2-3 dage, hvor koncernens kursreguleringer
  overstiger den DEaR, som VaRmodellen har estimeret. En s\u00e5dan h\u00e6ndelse
  betegnes en outlier.\\n\\nBacktesting\\n\\nFor at vurdere n\u00f8jagtigheden af
  VaR-modellen foretages der dagligt backtesting af modellen, hvor den estimerede
  VaR sammenlignes med den faktiske daglige kursregulering p\u00e5 markedsrisikorelaterede
  positioner.\\n\\nJyske Bank har anvendt VaR i risikoopg\u00f8relser siden 2001.
  Historisk har backtesten gennemsnitligt vist to outliers \u00e5rligt med en variationsbredde
  inden for 1-3 outliers, hvilket underbygger validiteten af Jyske Banks VaR-model.\\n\\nF\u00f8lsomhedsanalyser\\n\\nJyske
  Bank har i vidt omfang modsatrettede positioner p\u00e5 tv\u00e6rs af markeder.
  Det v\u00e6rst t\u00e6nkelige scenarie er, at alle lange (positive) positioner falder
  i kurs, mens korte (negative) positioner stiger i kurs. En f\u00f8lsomhedsanalyse
  p\u00e5 bankens eksisterende balance er vist i tabellen nedenfor. Tabellen viser
  resultateffekten af en negativ kursudvikling for koncernen, beregnet ved en negativ
  rente\u00e6ndring p\u00e5 0,5 procentpoint. Endvidere er vist koncernens f\u00f8lsomhed
  over for en stigning i renteniveauet p\u00e5 1 procentpoint samt f\u00f8lsomheden
  over for et globalt fald i aktiemarkederne p\u00e5 10%. F\u00f8lsomhedsanalyserne
  er udtryk for en \\\"alt andet lige\\\"-betragtning og tager ikke \u00e6ndringer
  i balancen i betragtning som f\u00f8lge af \u00e6ndringerne i markedsudviklingen.
  I forhold til 2009 viser f\u00f8lsomhedsanalysen generelt et fald i koncernens markedsrisikoeksponering
  i 2010; kun f\u00f8lsomheden over for \u00e6ndringer i aktiemarkederne er steget.\\n\\nNote:
  Der er tale om et mildt stress-scenarium. Med \\\"negativ\\\" forst\u00e5s, at lange
  positioner falder i kurs, og korte positioner stiger i kurs. Alle er opgjort pr.
  valuta.Aktierisiko er beregnet for handelsbeholdningen.\\n\\n* Der ses bort fra
  EUR ved beregningen.\\n\\nLikviditetsrisiko\\n\\n* Likviditetsrisiko er risikoen
  for, at Jyske Bank ikke er i stand til at generere eller opn\u00e5 tilstr\u00e6kkelig
  likviditet til en rimelig pris for at opfylde sine betalingsforpligtelser eller
  i sidste ende ikke er i stand til at opfylde sine forpligtelser i takt med, at de
  forfalder.\\n\\nLikviditetsrisiko opst\u00e5r som f\u00f8lge af et finansieringsmismatch
  i balancen, idet Jyske Banks udl\u00e5nsportef\u00f8lje har l\u00e6ngere varighed
  end dens gennemsnitlige finansieringskilder. Jyske Banks bestyrelse fastl\u00e6gger
  likviditetsrisikoprofilen udtrykt som en afbalancering af risikoniveau og Jyske
  Banks omkostninger til styring af likviditetsrisiko.\\n\\nStyring og overv\u00e5gning\\n\\nForm\u00e5l
  og overordnet setup\\n\\nDet generelle form\u00e5l med Jyske Banks likviditetsstyring
  er at sikre tilstr\u00e6kkelig kort- og langsigtet likviditet til rettidig honorering
  af Jyske Banks betalingsforpligtelser til rimelige finansieringsomkostninger. Opn\u00e5else
  af dette overordnede m\u00e5l sikres ved nedenst\u00e5ende delm\u00e5ls\u00e6tninger
  og politikker:\\n\\n1. En st\u00e6rk og stabil indl\u00e5nsbase, som sikrer stabilitet
  i den langsigtede finansiering af koncernens udl\u00e5nsaktiviteter.\\n2. Fastholdelse
  af et h\u00f8jt ratingniveau hos internationale ratingbureauer.\\n3. Aktiv deltagelse
  p\u00e5 de internationale pengemarkeder samt adgang til de internationale kapitalmarkeder
  ved anvendelse af l\u00e5neprogrammer, hvorved adgang til en meget diversificeret
  og professionel finansieringsbase opn\u00e5s.\\n4. Opretholdelse af en betydelig
  h\u00f8jlikvid likviditetsbuffer afstemt i forhold til afl\u00f8bsprofilen p\u00e5
  kapitalmarkedsfinansieringen. Likviditetsbufferen sikrer, at Jyske Bank kan modst\u00e5
  effekten af en ugunstig likviditetssituation.\\n\\nI overensstemmelse med retningslinjerne
  fra Baselkomit\u00e9en hviler koncernens likviditetsstyring p\u00e5\\n\\n- forfaldsanalyse
  mellem fremtidige ind- og udbetalinger\\n- likviditetsn\u00f8dplan.\\n- stresstests,
  som anvendes i bef\u00f8jelsesstruktur\\n\\nBestyrelsen har vedtaget en likviditetspolitik,
  der blandt andet fasts\u00e6tter en specifik kritisk tidshorisont for koncernens
  likviditetsposition under et ugunstigt stressscenarie. Direktionen har p\u00e5 basis
  af disse overordnede limits udstukket specifikke operationelle bef\u00f8jelser til
  Jyske Markets, der i de organisatoriske omr\u00e5der, Handel & Analyse samt Balance
  & Egenbeholdning, har til opgave p\u00e5 daglig basis at f\u00f8lge og styre likviditeten
  i henhold til bef\u00f8jelser og likviditetspolitikker.\\n\\nLikviditetspositioner
  overv\u00e5ges dagligt af afdelingen Markedsrisiko i forhold til de fastlagte bef\u00f8jelser.
  Bef\u00f8jelsesoverskridelser rapporteres i henhold til proceduren for markedsrisici.\\n\\nDen
  kortsigtede likviditetsstyring\\n\\nDen korte operationelle likviditet styres i
  Handel & Analyse, som er aktiv p\u00e5 de internationale pengemarkeder i alle st\u00f8rre
  valutaer og relaterede derivater samt prisstiller i de nordiske interbankpengemarkeder.
  Handel & Analyse er underlagt bef\u00f8jelser til den korte finansiering p\u00e5
  interbank- og engrosaftalemarkedet samt bef\u00f8jelser til den maksimale placering
  p\u00e5 l\u00e6ngere l\u00f8betider p\u00e5 samme markeder.\\n\\nDen strategiske
  likviditetsstyring\\n\\nDen strategiske likviditetsstyring i Balance & Egenbeholdning
  baseres p\u00e5 opg\u00f8relser af koncernens likviditetsposition i forskellige
  stressscenarier. Betalinger fra aktivsiden i likviditetsbalancen grupperes efter
  deres likviditetsgrad, mens betalinger fra forpligtelsessiden grupperes efter deres
  forventede stabilitet i forskellige scenarier.\\n\\nSom udgangspunkt bygger analyserne
  p\u00e5 de kontraktligt fastsatte forfaldstidspunkter for de enkelte betalinger.
  Der tages dog hensyn til, at en del af balancen reelt har en l\u00f8betid, der afviger
  fra den kontraktligt fastsatte. I analyserne anvendes derfor scenariespecifikke
  forventninger til kunders adf\u00e6rd i de tilf\u00e6lde,\\n\\nLikviditetsrisiko\\n\\nhvor
  den kontraktlige l\u00f8betid ikke anses for at v\u00e6re retvisende for den reelle
  l\u00f8betid p\u00e5 henholdsvis indog udl\u00e5n. I relevante stressscenarier anvendes
  likviditetsreserven til at d\u00e6kke negative betalings-gaps.\\n\\nBalance & Egenbeholdning
  har ansvaret for l\u00f8bende at sikre, at koncernen kan overholde den kritiske
  overlevelseshorisont i de 3 scenarier, der anvendes i den strategiske styring:\\n\\nScenarie
  1 \u2013 et h\u00e5rdt Jyske Bank-specifikt stressscenarie, der overv\u00e5ges dagligt
  og indg\u00e5r som det centrale n\u00f8gletal i bef\u00f8jelsesstrukturen:\\n\\nH\u00e5rdt
  Jyske Bank-specifikt stress-scenarie med kort kritisk overlevelseshorisont p\u00e5
  4 uger, hvor koncernen skal have reserver til at modst\u00e5, at en bredere del
  af koncernens pris- og kreditf\u00f8lsomme finansiering ikke kan refinansieres.
  Udover at koncernen ikke kan refinansiere sig p\u00e5 kapitalmarkederne (interbankl\u00e5n,
  CPog EMTN-udstedelser), antages ligeledes afl\u00f8b af alle st\u00f8rre anfordrings-
  og aftaleindl\u00e5n fra erhvervs- og privatkundesegmenterne.\\n\\nScenarie 2 -
  et bredt sektor stress-scenarie, der overv\u00e5ges l\u00f8bende som en del af den
  interne likviditetsstyring:\\n\\nBred generel kapital- og pengemarkedskrise, der
  i nogen grad spreder sig til privat- og erhvervskunder og blandt andet medf\u00f8rer
  tr\u00e6k p\u00e5 uudnyttede lines og commitments til st\u00f8rre erhvervskunder.
  Jyske Bank oplever samtidig en stagnation i indl\u00e5nsv\u00e6ksten, og muligheden
  for at refinansiere sig p\u00e5 de internationale kapitalmarkeder udt\u00f8rrer.
  M\u00e5ls\u00e6tningen er en horisont p\u00e5 6 m\u00e5neder, hvor basisbankdriften
  skal opretholdes.\\n\\nScenarie 3 - et mildt sektor stress-scenarie (ogs\u00e5 kaldet
  Moody''s-scenariet), der overv\u00e5ges l\u00f8bende som en del af den interne likviditetsstyring:\\n\\nEn
  mild ikke-Jyske Bank-specifik kapitalmarkedskrise med en overlevelseshorisont p\u00e5
  mindst et \u00e5r. Koncernen skal kunne modst\u00e5 afl\u00f8b af penge- og kapitalmarkedsfinansiering
  samtidig med, at koncernen skal kunne finansiere en normal v\u00e6kst i udl\u00e5n.\\n\\nForm\u00e5let
  med at integrere stressscenarie 1 i bef\u00f8jelsesstrukturen er at sikre, at koncernen
  til enhver tid kan opfylde sine forpligtelser og opretholde driften over en specifik
  tidshorisont, hvis der opst\u00e5r en krise- situation, hvor koncernen m\u00e5tte
  v\u00e6re afsk\u00e5ret fra en v\u00e6sentlig del af sine normale finansieringskilder.\\n\\nLikviditetsn\u00f8dplan\\n\\nLikviditetsn\u00f8dplanen
  tr\u00e6der i kraft, hvis koncernen kun kan overholde interne bef\u00f8jelser til
  st\u00e6rkt for\u00f8gede omkostninger eller ultimativt ikke er i stand til at opretholde
  de kritiske tidshorisonter. N\u00f8dplanen beskriver et detaljeret s\u00e6t af rapporter
  til ledelsesbeslutning og fastl\u00e6gger et bredt katalog over mulige handlinger,
  der kan styrke koncernens likviditetssituation.\\n\\nJyske Bank har i l\u00f8bet
  af 2010 haft solid og betryggende overd\u00e6kning i de stressbaserede interne bef\u00f8jelser
  og retningslinjer.\\n\\nKoncernens likviditetsberedskab\\n\\nJyske Banks samlede
  likviditetsberedskab best\u00e5r kun af aktiver, som ikke er b\u00e5ndlagt til sikkerhedsstillelse,
  eller som ikke anvendes i den daglige drift af koncernen. S\u00e5danne aktiver kan
  enten s\u00e6lges hurtigt eller pants\u00e6ttes som sikkerhed for l\u00e5n og kan
  s\u00e5ledes anvendes til en hurtig og effektiv likviditetsfremskaffelse. Fremskaffelsen
  af sikret finansiering er ikke afh\u00e6ngig af Jyske Banks kreditv\u00e6rdighed
  men afh\u00e6nger alene af kvaliteten af aktiverne, der stilles til sikkerhed. I
  beregningen af koncernens samlede likviditetsberedskab tages h\u00f8jde for mulige
  v\u00e6rdiforringelser af de respektive aktiver.\\n\\nJyske Banks v\u00e6rdipapirbeholdning
  er opdelt i fem grupper efter likviditetsgrad:\\n\\n1. Ultra likvide aktiver i kr.,
  der kan anvendes i repotransaktioner med Nationalbanken: Indskudsbeviser i Nationalbanken,
  danske stats- og realkreditobligationer samt s\u00e6rligt d\u00e6kkede obligationer.\\n2.
  Meget likvide aktiver i EUR, der kan anvendes i repo-transaktioner med den europ\u00e6iske
  centralbank: Europ\u00e6iske realkreditobligationer, statsobligationer samt finansielle
  seniorudstedelser.\\n3. Likvide aktiver: Identiske med meget likvide aktiver blot
  i anden valuta end EUR.\\n4. \u00d8vrige likvide aktiver: \u00d8vrige likvide obligationer
  af h\u00f8j kvalitet.\\n5. Relativt illikvide aktiver: Emerging Market obligationer,
  erhvervs- og strukturerede obligationer og aktier.\\n\\nJyske Bank har en overordnet
  politik for st\u00f8rrelsen og kvaliteten af det samlede likviditetsberedskab, som\\n\\njusteres
  i takt med koncernens balancesammens\u00e6tning og risikoprofil i \u00f8vrigt.\\n\\nPolitikken
  for likviditetsberedskabet indeb\u00e6rer i praksis, at beredskabet prim\u00e6rt
  best\u00e5r af aktiver i likviditetsgruppe 1 og gruppe 2. Det er s\u00e5ledes Jyske
  Banks politik, at minimumsbef\u00f8jelsen p\u00e5 den kritiske overlevelseshorisont
  i stressscenarie 1 skal kunne overholdes alene ved frig\u00f8relse af aktiver i
  likviditetsgruppe 1 og 2, inkl. brugen af Jyske Banks uudnyttede syndikerede kreditfacilitet
  p\u00e5 500 mio. EUR.\\n\\n| Likviditetsberedskab og afl\u00f8b | 2010 | 2009 |\\n|---|---|---|\\n|
  (mia. kr.) |  |  |\\n\\nTabellen viser udviklingen i Jyske Banks likviditetsberedskab
  over en 12 m\u00e5neders periode i stressscenarie 3 (Moody''s).\\n\\nUltimo 2010
  udg\u00f8r koncernens likviditetsberedskab 59 mia. kr. inkl. koncernens uudnyttede
  syndikerede l\u00e5nefacilitet p\u00e5 500 mio. EUR mod 54 mia. kr. ultimo 2009.
  Indskudsbeviser i Nationalbanken udg\u00f8r 5 mia. kr. Resten af beredskabet best\u00e5r
  hovedsageligt af danske realkreditobligationer og s\u00e6rligt d\u00e6kkede obligationer,
  og 52 mia. kr. kan bel\u00e5nes i enten Nationalbanken eller ECB.\\n\\nKoncernens
  likviditetsreserve m\u00e5lt ved \u00a7 152, stk. 1, nr. 2 i Lov om Finansiel Virksomhed
  har til stadighed ligget h\u00f8jt. Ultimo 2010 ligger likviditetsbr\u00f8ken p\u00e5
  28,0%, hvilket er en overd\u00e6kning p\u00e5 180% mod 173% ultimo 2009.\\n\\nFinansiering\\n\\nKoncernens
  prim\u00e6re finansieringskilde er indskud fra kunder, og koncernen har en solid
  og veldiversificeret indl\u00e5nsbase. Ultimo 2010 finansierede indl\u00e5n (ekskl.
  puljeindl\u00e5n), 86% af udl\u00e5nsportef\u00f8ljen, hvilket er et u\u00e6ndret
  niveau i forhold til ultimo 2009.\\n\\nFinansiering via interbank- og engrosaftalemarkedet
  foretages via Handel & Analyse som led i den korte operationelle likviditetsstyring.
  Handel & Analyse finansierer desuden egne engros-relaterede aktiviteter gennem optagelse
  af usikrede l\u00e5n p\u00e5 engrosaftalemarkedet og interbank-markederne. Kontinuerlig
  aktivitet i disse markeder bidrager til en st\u00f8rre sikkerhed med hensyn til
  at kunne genfinansiere den korte likviditet og er en naturlig del af forretningsgrundlaget
  i Handel & Analyse.\\n\\nKapitalmarkedsfinansiering via l\u00e5neprogrammer\\n\\nTil
  styring af den langsigtede strategiske risikoprofil anvendes to l\u00e5neprogrammer
  for at sikre, at koncernen har en maksimal fleksibilitet for valg af l\u00f8betid,
  valuta, rente (fast/variabel) og investorbase.\\n\\nDet franskregulerede CP-program
  sikrer diversifikation og dybde i den korte og mellemlange likviditetsstyring i
  relation til overholdelse af koncernens likviditetsm\u00e5ls\u00e6tning. Finansiering
  under programmet kan have en l\u00f8betid op til 1 \u00e5r, men vil typisk have
  en l\u00f8betid p\u00e5 3 m\u00e5neder.\\n\\nJyske Bank har siden programmet blev
  oprettet i 2006 arbejdet p\u00e5 at udvide kendskabet til koncernens CPprogram blandt
  investorerne. Ultimo 2010 udgjorde fremskaffelse af likviditet under CP-programmet
  24 mia. kr. (3,2 mia. EUR).\\n\\nUdest\u00e5ende CP-program\\n\\nLikviditetsrisiko\\n\\nTil
  den langsigtede finansiering p\u00e5 de internationale kapitalmarkeder har koncernen
  siden 1999 anvendt et Euro Medium Term Note Programme (EMTN). Den typiske l\u00f8betid
  p\u00e5 seniorg\u00e6ld ligger mellem 2 og 10 \u00e5r. Ultimo 2010 udgjorde seniorudstedelser
  under programmet 21,9 mia. kr. (3,9 mia. USD). Den prim\u00e6re investorbase for
  obligationer udstedt under EMTN er geografisk godt diversificeret inden for Europa.
  Koncernen arbejder l\u00f8bende p\u00e5 at fastholde investorbasen og kendskabet
  til Jyske Bank i god tid, f\u00f8r et finansieringsbehov opst\u00e5r. Som f\u00f8lge
  af en solid likviditetsprofil og udviklingen i balancen, har Jyske Bank i 2010 ikke
  haft brug for at lave benchmark obligationsudstedelser. Via mindre private placements
  er der i l\u00f8bet af 2010 udstedt obligationer under EMTN programmet for 2,5 mia.
  kr. (335 mio. EUR). til attraktive priser med en v\u00e6gtet gennemsnitlig l\u00f8betid
  p\u00e5 8 \u00e5r.\\n\\nUltimo 2010 har Jyske Bank fire udest\u00e5ende benchmark-obligationer
  p\u00e5 markedet.\\n\\nNy likviditetslovgivning\\n\\nJyske Bank har siden 2007 k\u00f8rt
  med en intern likviditetsstyring baseret p\u00e5 stressscenarier, der har v\u00e6ret
  v\u00e6sentlig h\u00e5rdere end de lovm\u00e6ssige likviditetskrav. Baselkomit\u00e9en
  har i 2010 udsendt forslag til nye likviditetsn\u00f8gletal, der skal implementeres
  i hhv. 2015\\n\\nfor s\u00e5 vidt ang\u00e5r den stressbaserede Liquidity Coverage
  Ratio (LCR) og 2018 for s\u00e5 vidt ang\u00e5r Net Stable Funding Ratio (NSFR),
  der fokuserer p\u00e5 at minimere l\u00f8betidsmismatch i bankernes balance.  Der
  er indtil videre ikke kommet en endelig afklaring af behandlingen af danske realkreditobligationer/covered
  bonds i de to nye n\u00f8gletal. Under foruds\u00e6tning af at realkreditobligationer/covered
  bonds kan medregnes i den s\u00e5kaldte Level 1 beholdning, viser interne beregninger
  en p\u00e6n overd\u00e6kning af LCR ratio, hvorimod NSFR aktuelt ligger under 1.\\n\\nKreditvurderinger\\n\\nKoncernens
  kreditvurderinger er afg\u00f8rende for prisen p\u00e5 likviditets- og kapitalfremskaffelse
  samt muligheden for finansiel fleksibilitet i form af adgang til en bred investorbase.
  Aktuelt er koncernens rating p\u00e5 A hos Standard & Poor''s og A1 hos Moody''s.
  Koncernens kreditvurderinger har v\u00e6ret u\u00e6ndrede i l\u00f8bet af 2010.\\n\\nOperationel
  risiko\\n\\n* Operationel risiko er defineret som risikoen for tab som f\u00f8lge
  af utilstr\u00e6kkelige eller fejlslagne interne processer, menneskelige eller systemm\u00e6ssige
  fejl og eksterne begivenheder.\\n\\nJyske Bank overv\u00e5ger og styrer aktivt operationelle
  risici for at reducere risikoen for, at der sker operationelle h\u00e6ndelser med
  v\u00e6sentlige tab til f\u00f8lge. Det prim\u00e6re fokus er p\u00e5 koncernens
  st\u00f8rste risici med store potentielle tab.\\n\\nRisikoidentifikation og vurdering\\n\\nJyske
  Bank har valgt at anvende en scenariebaseret analysemetode. I scenarieanalyserne
  kortl\u00e6gges koncernens st\u00f8rste operationelle risici ved at analysere de
  centrale processer og h\u00e6ndelser, der kan v\u00e6re \u00e5rsag til potentielle
  tab. Gennem en vurdering af effektiviteten af kontrolmilj\u00f8et fremh\u00e6ves
  eventuelle risici, der ikke i tilstr\u00e6kkelig grad afd\u00e6kkes af de etablerede
  kontroller. Scenarieanalyserne indeholder forslag til, hvordan de operationelle
  risici kan reduceres og er dermed et effektivt v\u00e6rkt\u00f8j for ledelsen og
  de ansvarlige forretningsenheder i styringen af risiciene.\\n\\nAlle risikoscenarier,
  der kan medf\u00f8re direkte eller indirekte tab p\u00e5 over 5 mio. kr., eller
  som kan skade koncernens omd\u00f8mme betydeligt, analyseres. Scenarierne identificeres
  i samarbejde med ledelsen med udgangspunkt i interne og eksterne h\u00e6ndelser.\\n\\nDer
  arbejdes p\u00e5 nuv\u00e6rende tidspunkt med 40-45 scenarier, som d\u00e6kker alle
  forretningsomr\u00e5der i koncernen. Scenarierne d\u00e6kker en bred vifte af risici
  s\u00e5som fejlr\u00e5dgivning, handelsfejl, fejl i modeller eller fejl i interne
  og eksterne rapporteringer, ligesom risikoen for svindel behandles. Operationelle
  risici hos vigtige samarbejdspartnere er ogs\u00e5 d\u00e6kket, herunder nedbrud
  i IT-drift varetaget af JN Data.\\n\\nStyring og overv\u00e5gning\\n\\nUdviklingen
  i den operationelle risiko overv\u00e5ges l\u00f8bende for at sikre det bedst mulige
  grundlag for styringen af risiciene, herunder opg\u00f8relse af \u00f8konomisk kapital.
  Overv\u00e5gningen bygger p\u00e5 f\u00f8lgende elementer:\\n\\n- L\u00f8bende dialog
  med ledelsen for at sikre, at alle v\u00e6sentlige operationelle risici i koncernen
  er afspejlet i risikoscenarierne\\n- Tab p\u00e5 over 5.000 kr. som f\u00f8lge af
  operationelle fejl eller h\u00e6ndelser registreres, overv\u00e5ges, analyseres
  og rapporteres l\u00f8bende med henblik p\u00e5 at optimere processer og reducere
  fremtidige tab\\n- Evaluering af eksisterende risikoscenarier, risikoeksponering
  og kontrolmilj\u00f8 i samarbejde med forretningsenhedernes eksperter\\n\\nEkstraordin\u00e6re
  evalueringer af eksisterende risikoscenarier sker efter \u00f8nske fra ledelsen,
  eller n\u00e5r det sk\u00f8nnes relevant som f\u00f8lge af ekstraordin\u00e6re interne
  eller eksterne h\u00e6ndelser.\\n\\nDirektionen og enhedsdirekt\u00f8rerne har det
  overordnede ansvar for styringen af operationelle risici, hvilket er en integreret
  del af den daglige drift og sker gennem et system af omfattende politikker og kontrolforanstaltninger,
  der er udarbejdet med henblik p\u00e5 et optimalt procesmilj\u00f8. P\u00e5 baggrund
  af scenarierapporter og regelm\u00e6ssig rapportering om udviklingen i koncernens
  operationelle risici vurderer ledelsen l\u00f8bende koncernens eksponering og tr\u00e6ffer
  beslutninger om eventuelle tiltag til reduktion af denne.\\n\\nDirektionen og bestyrelsen
  modtager \u00e5rligt en samlet rapport, der beskriver udviklingen i koncernens operationelle
  risici ledsaget af fejlstatistikker fra fejlregistreringen.\\n\\nOperationel risiko\\n\\nUdvikling
  og fokus i 2010\\n\\nDen \u00f8konomiske kapital til operationel risiko er \u00f8get
  med 3% siden ultimo 2009, f\u00f8r diversifikation med andre risikotyper. Jyske
  Banks beslutning om at konvertere st\u00f8rstedelen af IT-udviklingen til Bankdata
  \u00f8ger de operationelle risici.\\n\\nI 2010 er der udover de eksisterende scenarieanalyser
  foretaget analyser p\u00e5 tv\u00e6rs af forretningsenhederne, for at afd\u00e6kke
  eventuelle uhensigtsm\u00e6ssigheder igennem eksempelvis v\u00e6rdik\u00e6der.\\n\\nNedenfor
  ses fordelingen af Jyske Banks \u00f8konomiske kapital til operationel risiko fordelt
  p\u00e5 Basel kategorierne. St\u00f8rstedelen af kapitalen er drevet af scenarier
  under kategorien \\\"Ordreafvikling, levering og processtyring\\\". I denne kategori
  findes der scenarier som eksempelvis projektrisiko, fejl i modeller og manuelle
  fejl, og den prim\u00e6re grund til stigningen er projektrisikoen ved konverteringen
  til Bankdata. Den n\u00e6stst\u00f8rste kategori for Jyske Bank er \\\"Kunder, Produkter
  og forretningspraksis\\\", som omfatter risikoscenarier omkring fejl i produktudvikling
  og fejlr\u00e5dgivning af kunder. Den tredjest\u00f8rste kategori er \\\"Intern
  svig\\\", som udover svindel med koncernens midler beg\u00e5et af medarbejdere ogs\u00e5
  rummer insider handel og fysisk eller logisk sabotage.\\n\\n\u00d8konomisk kapital
  for operationel risiko, Baselkategorier\\n\\nBilag 1: Ordliste\\n\\nBilag 1: Ordliste\\n\\nBilag
  1: Ordliste\\n\\nBilag 2: Supplerende tabeller\\n\\nBilag 2: Supplerende tabeller\\n\\nBilag
  2: Supplerende tabeller\\n\\nOvenst\u00e5ende geografiske fordeling af eksponeringer
  er i store tr\u00e6k ogs\u00e5 g\u00e6ldende for den geografiske fordeling af misligholdte
  eksponeringer. Dog er v\u00e6rdireguleringen for udenlandske eksponeringer forholdsm\u00e6ssigt
  noget mindre, da eksponeringer i udlandet i stort omfang er baseret p\u00e5 en h\u00f8j
  grad af sikkerhedsm\u00e6ssig afd\u00e6kning.\\n\\nBilag 2: Supplerende tabeller\""]'
