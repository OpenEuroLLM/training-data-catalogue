sample: '["\"M\u00d8DEREFERAT\\n\\nBestyrelsesm\u00f8de i Egebjergvang onsdag den
  2.02 2022 kl. 17:00. (8.12.21 + 5.01.22 annulleret)\\n\\nAfbud fra: Eva, Gert J\\n\\n|
  1. | Valg af ordstyrer |  |\\n|---|---|---|\\n| 2. A | Valg af referent |  |\\n|
  2. B | Bestyrelsen |  |\\n| 3. | Velkomstpakke |  |\\n| 4. | Tidligere referat |  |\\n|
  5. | \u00d8konomi ved Gert |  |\\n| 6 | Ejendomskontoret |  |\\n| 7 | Vinduer og
  d\u00f8re |  |\\n| 8. | F\u00e6lleshuset |  |\\n| 9. | Nye hegn |  |\\n| 10. | Aktiviteter
  tilladt i k\u00e6lderrum? |  |\\n| 11. | Telefontid p\u00e5 kontoret |  |\\n| 12.
  | P-udvalg | Udvidelser, El-stander-ans\u00f8gning droppet. Sten skal fjernes ved
  |\\n|  |  | P-pladsen (St\u00e5r vist ikke p\u00e5 Gert J-listen). \u2013 Egebjergvang
  vil |\\n|  |  | henvende sig til F\u00e6llesvirket om etablering af El-stander i
  |\\n|  |  | omr\u00e5det Egebjergg\u00e5rd. |\\n\\n| 14. | N\u00f8glekvitteringer
  |\\n|---|---|\\n| 15 | St\u00f8jmur |\\n| 16 | Julefrokost vedtaget |\\n| 17 | Driftsaftale
  for driftsf\u00e6llesskabet |\\n| 18 | Vaskeriet |\\n| 21 | Skadedyr |\\n| 22 |  |\\n|
  23 |  |\\n| 25 | N\u00e6ste m\u00f8de |\"", "\"\\n\\nSPANSK FESTSKRIFT Faustino
  Men\u00e9ndez Pidal, der var generalsekret\u00e6r for den internationale genealogiske
  og heraldiske kongres i Madrid 1982 og i mange \u00e5r har v\u00e6ret leder af det
  kgl. akademi i Madrid for heraldik og genealogi, har i anledning af sin 80-\u00e5rs
  dag modtaget et festskrift p\u00e5 over 1.000 sider i to bind, Anales de la Real
  Academia Matritense de Her\u00e1ldica y Genealog\u00eda, vol. VIII/1-2 (2004). Den
  spanske konges f\u00e6tter, Don Carlos af Bourbon, infant af Spanien, der var kongressens
  pr\u00e6sident, har skrevet forord. Foruden en lang r\u00e6kke bidrag af har udenlandske
  heraldiske spor af Christian IIs dronning Elisabeth (Isabel). (Oplysninger: Nils
  G. Bartholdy) NORSK KOMMUNALHERALDIK: VINDAFJORD Ogs\u00e5 i Norge er der nyheder
  p\u00e5 vej i den kommunale heraldik. Der har v\u00e6ret en del kommunesammenl\u00e6gninger,
  blandt andet kommunerne \u00d8len og Vindafjord blevet sl\u00e5et sammen til \u00e9n
  kommune. Navnet bliver Vindafjord. Der har v\u00e6ret afholdt konkurrence kommunev\u00e5ben,
  og kommunens indbyggere havde frist til 1. januar til at give deres mening om 31\\n\\nEn
  foresl\u00e5et modernisering af  Kristiansands v\u00e5ben har ogs\u00e5 v\u00e6ret
  til debat, blandt andet i artikler i avisen F\u00e6drelandsvennen, der kan ses her,
  og hvor ogs\u00e5 et forslag til den p\u00e5t\u00e6nkte modernisering af http://www.fedrelandsvennen.no/nyheter/article22819
  http://www.fedrelandsvennen.no/nyheter/article22863 http://www.fedrelandsvennen.no/nyheter/article25372
  http://www.fedrelandsvennen.no/nyheter/kristiansand v\u00e5benet kan ses:\\n\\nDANSKE
  RANGKRONER\\nDet er en kendt sag, at den britiske adels\\nheraldiske rangkroner
  b\u00e5de eksisterer som tegnede\\nkroner og som virkelige, fysiske kroner, der
  b\u00e6res\\nunder kroningen af monarken. Der findes s\u00e5 vidt\\nvides ingen
  vidnesbyrd om, at fysiske rangkroner\\nhar eksisteret Danmark, eller andre nordiske
  lande.\\nNedenfor viste billede af kammerjunkerinde Aase\\nde Neergaard, f. komtesse
  Krag-Juel-Vind-Frijs\\n(1892-1959), viser hende b\u00e6rende et diadem, der\\numiskendeligt
  ligner den heraldiske grevekrone.\\n\\nfra den Krag-Juel-Vind-Frijske del af kammerjunkerindens
  sl\u00e6gt, da Neergaard-sl\u00e6gten ikke har en grevelig linie. Hvis der er nogen,
  der har oplysninger om dette diadem, eller kender andre lignende eksempler, h\u00f8rer
  undertegnede gerne om det.\\n\\nHer slutter det andet nummer af Societas Heraldica\\nScandinavicas\\nelektroniske\\nnyhedsbrev\\n-\\nendelig
  ved med at sende ris, ros og f\u00f8rst og\\nfremmest\\nbilleder\\nog\\nandet\\nmateriale
  til redakt\u00f8ren.\\n(OBS: bem\u00e6rk adresse\u00e6ndringen!)\\nRonny Andersen\\nKongensgade
  63, 3. tv.\"", "\"\\\\\\n\\nr\\n\\ni\\n\\nDen Maade, Tala'' at holdt Mordviljen
  oppe, fremgaar af et Ciffertelegram, afsendt den 15. September 1915.\\n\\nDel har
  lidligere veerel meddeli, al Regeringen paa Komileens Ordre har beslullel fuldkomment
  at udrydde aile de Armeniere, der bor i Tyrkiet. De, som vil modseelle sig denne
  Befaling, kan ikke regnes for Regeringens Venner (d. o. s. er Landsforrredere).
  Uden Hensyn lil Kvinder, Bom eller syge, hvor lungsindige (md 0delC2ggelsens Midler
  kan synes, uden at Iylle til Folelser eller Samviitighed, der ~''/~ a i gores Ende
  paa deres Tilveerelse. Inde~rigsministeren\\n\\nTil Polilikonlo''rel i Aleppo!\\n\\nTa
  la ''al.\"", "\"Generalforsamling\\nViby Jujitsu\\nonsdag d. 20. februar 2008 kl.
  19.00\\nhos Ole Larsen - Elisevej 2, D\u00e5strup\\n\\nReferent: Michael G. Andersen\\n\\nI
  overensstemmelse med vedt\u00e6gterne er der fastsat f\u00f8lgende dagsorden:\\n\\n1.
  Velkomst v/forstander (Ole Larsen)\\n   \u27a2 Ole b\u00f8d velkommen.\\n\\n2. Valg
  af dirigent (m\u00e5 ikke v\u00e6re medlem af bestyrelsen)\\n   \u27a2 Ren\u00e9
  blev valgt til dirigent (Camilla ville helst ikke og resten var fra bestyrelsen).
  Ren\u00e9 konstaterede, at indkaldelsen var lovlig.\\n\\n3. Formandens \u00e5rsberetning
  v/forstander (Ole Larsen)\\n   \u27a2 Vi er 16 p\u00e5 b\u00f8rneholdet og 14 p\u00e5
  voksenholdet pr. 31. december 2007. Vi er generelt en ret social klub. Vi har fx
  lige v\u00e6ret til julefrokost og vi har v\u00e6ret med til fastelavnsfest og vi
  har v\u00e6ret med til at arrangere julet\u00f8rsfest. S\u00e5 har vi v\u00e6ret
  ude at bowle og i sommers var vi p\u00e5 Lalandia og tr\u00e6ne. Der har ogs\u00e5
  v\u00e6ret julestue for for\u00e6ldre, bedstefor\u00e6ldre og s\u00f8skende. Der
  var ca. 60 personer og det var en stor succes. Vi har dog ogs\u00e5 v\u00e6ret lidt
  faglige. Ole og Ren\u00e9 har v\u00e6ret p\u00e5 kursus. Vi har i sommers graduert
  voksne og b\u00f8rn alle bestod.\\n   \u27a2 Beretningen blev godkendt.\\n\\n4.
  Godkendelse af regnskabet v/kassereren (Ivan Mott)\\n   \u27a2 Ivan havde meldt
  afbud. Regnskabet er revideret og p\u00e5tegnet af revisor. Regnskabet udviser et
  resultat p\u00e5 -12.802,75 kr. (2006: 2.521,64 kr.) og en egenkapital p\u00e5 26.430,50
  kr. (2006: 39.783,25 kr.). Resultatet er i s\u00e6r p\u00e5virket af turen til Lalandia
  som afholdes hvert 2. \u00e5r.\\n   \u27a2 Regnskabet blev godkendt.\\n\\n5. Behandling
  af indkomne forslag (p.t. ingen indkommet)\\n   \u27a2 Ingen.\\n\\n6. Valg til bestyrelsen
  (3-5 medlemmer) samt valg af suppleanter hertil:\\n   Formand (Ole Larsen), sekret\u00e6r
  (Michael G. Andersen) og bestyrelsesmedlem Tobias Bendorff er ikke p\u00e5 valg
  i \u00e5r.\\n   a. Kasserer (Ivan Mott genopstiller).\\n      \u27a2 Ivan Mott blev
  valgt.\\n   b. Bestyrelsesmedlem (Ren\u00e9 Hemmingsen genopstiller).\\n      \u27a2
  Ren\u00e9 Hemmingsen blev valgt.\\n   c. Suppleant til bestyrelsen (Camilla Lauritzen
  genopstiller)\\n      \u27a2 Camilla Lauritzen blev valgt.\\n\\n7. Valg til repr\u00e6sentantskab
  samt suppleanter hertil (m\u00f8de torsdag den 24. april 2008 kl. 19.00):\\n   (Formand
  (Ole Larsen) og kasserer (p.t. Ivan Mott) er f\u00f8dt medlemmer)\\n   a. Medlem
  til repr\u00e6sentantskabet (Michael G. Andersen genopstiller)\\n      \u27a2 Michael
  G. Andersen blev valgt.\\n\\nb. Suppleant til repr\u00e6sentantskabet (Tobias Bendorff
  genopstiller)\\n   \u27a2 Tobias Bendorff blev valgt.\\n\\n8. Eventuelt\\n   \u27a2
  Ole: Viby IF bliver 100 i 2009. Vil vi lave en opvisning? Eller invitere nogle andre?
  Ren\u00e9 mente, at ja selvf\u00f8lgelig b\u00f8r vi holde en opvisning. Det var
  der enighed om. S\u00e5 vi finder en dato.\\n\\n   \u27a2 Ole: Skal vi v\u00e6re
  vagter til en halffest? Ren\u00e9: Nej tak. Det skal nok v\u00e6re professionelle.
  Desuden er det ikke sjovt at skulle smide nogen ud, man kender. Det var der ogs\u00e5
  enighed om.\\n\\n   \u27a2 Ole: Fredag den 7. marts 2008 er der idr\u00e6tsnat i
  hallen. Kan juts v\u00e6re med? Ren\u00e9 og Michael kan ikke deltage. Ole sp\u00f8rger
  nogle af de andre, og giver besked til Inga.\\n\\n   \u27a2 Michael: Husk at ajourf\u00f8re
  adresselisten \ud83d\ude0a\\n\\n   \u27a2 Ole: Skal vi lave en udflugt/oplevelse
  for b\u00f8rnene? Ja, det var en god id\u00e9.\\n\\n   \u27a2 Der burde laves en
  tr\u00e6ningsweekend for voksenholdet. Det er n\u00e6sten planlagt.\\n\\n   \u27a2
  Mht. halfordeling l\u00e6gger vi billet ind p\u00e5 de samme tider som i \u00e5r.
  Vi dr\u00f8ftede ogs\u00e5 om det var tilfredsstillende at v\u00e6re p\u00e5 Peder
  Syv Skolen. Det er dog sv\u00e6rt at g\u00f8re noget, for der er ikke plads i Viby
  Hallen.\\n\\n   \u27a2 Skolen l\u00e5ner vores m\u00e5tter. Vi kunne m\u00e5ske
  skrive til skolen, at de gerne m\u00e5 l\u00e5ne dem, men at de skal passe p\u00e5
  dem (dvs. ingen sko). Michael har f\u00e5et opgaven at skrive (Ole t\u00e6ller antallet
  af m\u00e5tter p\u00e5 mandag og giver besked om, hvorvidt vi har alle 30). M\u00e5tterne
  koster ca. 1.500 kr. stykket.\\n\\n   \u27a2 Det er ok at k\u00f8be et par bolde
  (til stikbold) \u2013 der er n\u00e6sten ingen tilbage.\\n\\nDer var ikke mere og
  Ren\u00e9 takkede for god ro og orden.\\n\\nDen 20. februar 2008 / Michael G. Andersen\"",
  "\"Naalakkersuisut frems\u00e6tter hermed f\u00f8lgende beslutningsforslag i henhold
  til \u00a7 33 i Forretningsordenen for Inatsisartut:\\n\\nForslag til Inatsisartutbeslutning
  om, at Gr\u00f8nlands Selvstyre oph\u00e6ver det territoriale forbehold for Gr\u00f8nland
  i relation til Minamatakonventionen.\\n\\n(Naalakkersuisoq for Arbejdsmarked, Forskning
  og Milj\u00f8)\\n\\nBegrundelse\\n\\nKviks\u00f8lv kan for\u00e5rsage en r\u00e6kke
  alvorlige skader p\u00e5 sundhed og milj\u00f8. Den globale kviks\u00f8lvsaftale,
  Minamatakonventionen, handler om at begr\u00e6nse brugen og udledningen af kviks\u00f8lv.
  Ved at tiltr\u00e6de konventionen kan vi reducere de lokale udledninger af kviks\u00f8lv
  og bakke op om den globale indsats, som ogs\u00e5 vil begr\u00e6nse eksponeringen
  for kviks\u00f8lv i Gr\u00f8nland, fordi en betydelig del af kviks\u00f8lvforureningen
  i Arktis kommer fra andre dele af verden. Forslaget er en anbefaling fra rapporten
  \\\"Samfunds\u00f8konomisk analyse af oph\u00e6velse af territorialt forbehold for
  Gr\u00f8nland i relation til Minamatakonventionen\\\". Rapporten er vedlagt.\\n\\nKonventionens
  indhold\\n\\nForhandlingerne om en global kviks\u00f8lvsaftale, Minamatakonventionen,
  blev afsluttet i januar 2013. Form\u00e5let med konventionen er at beskytte menneskers
  sundhed og milj\u00f8et mod menneskeskabte emissioner og udledninger af kviks\u00f8lv
  og kviks\u00f8lvforbindelser. Danmark underskrev konventionen den 10. oktober 2013
  med territorialt forbehold for Gr\u00f8nland.\\n\\nMinamatakonventionen tr\u00e5dte
  i kraft i august 2017, da 50 lande havde ratificeret konventionen. I dag har 128
  lande underskrevet konventionen, herunder alle otte lande, som er medlemmer af Arktisk
  R\u00e5d. Ministre fra de otte lande, sammen med delegerede fra seks organisationer
  af oprindelige folk i Arktis, opfordrede i den s\u00e5kaldte Fairbanks Deklaration
  fra 2017 til en hurtig og effektiv implementering af Minamatakonventionen. Minamatakonventionen
  er vigtig for landenes bestr\u00e6belser p\u00e5 at mindske forureningen med kviks\u00f8lv
  i Arktis.\\n\\nKonventionens bestemmelser regulerer kviks\u00f8lv i hele stoffets
  livscyklus; fra udvinding og anvendelse til emissioner og affaldsbehandling. Det
  g\u00f8r den ved at:\\n\\n- forbyde fremstilling, import og eksport af en lang r\u00e6kke
  produkter tilsat kviks\u00f8lv,\\n- fasts\u00e6tte restriktioner for blandt andet
  kviks\u00f8lvudvinding og international handel med kviks\u00f8lv,\\n- fasts\u00e6tte
  forbud eller driftsbetingelser for flere fremstillingsprocesser, hvor der anvendes
  kviks\u00f8lv, samt\\n- s\u00f8ge at hindre nye anvendelser af kviks\u00f8lv i produkter
  og industrielle processer.\\n\\nDet vurderes at v\u00e6re vigtigt for effektiviteten
  af konventionen, at s\u00e5 mange af verdens lande som muligt g\u00e5r sammen om
  at begr\u00e6nse brugen af kviks\u00f8lv og tiltr\u00e6der konventionen. Etableringen
  af en international aftale om at begr\u00e6nse brugen af kviks\u00f8lv globalt har
  derfor stor betydning for at begr\u00e6nse tilf\u00f8rslen af kviks\u00f8lv til
  milj\u00f8et i Gr\u00f8nland. Hovedparten af det kviks\u00f8lv, som ender i milj\u00f8et
  og i f\u00f8devarer i Gr\u00f8nland, er transporteret til Arktis via atmosf\u00e6ren
  eller med havstr\u00f8mme.\\n\\n______________________\\n\\n\u00d8konomiske og administrative
  konsekvenser\\n\\nGr\u00f8nland opfylder allerede st\u00f8rstedelen af kravene i
  Minamatakonventionen. De \u00f8konomiske og administrative konsekvenser af at tiltr\u00e6de
  konventionen er derfor begr\u00e6nsede. Konsekvenserne afh\u00e6nger af, om vi v\u00e6lger
  en s\u00e5kaldt minimumsimplementering af konventionen, hvor vi kun akkurat g\u00f8r
  nok til at leve op til konventionen, eller om vi v\u00e6lger en l\u00f8sning, hvor
  vi bruger den bedste tilg\u00e6ngelige teknologi (BAT) til at begr\u00e6nse kviks\u00f8lv
  bedst muligt. Det handler is\u00e6r om, hvorvidt vi \u00f8nsker at begr\u00e6nse
  udledning af kviks\u00f8lv fra tandl\u00e6geklinikker.\\n\\nFor begge tilgange vil
  der v\u00e6re behov for ressourcer til at udarbejde lovgivning, rapportering og
  eventuelt oplysningsmaterialer. De samlede engangsomkostninger er ansl\u00e5et at
  v\u00e6re i st\u00f8rrelsen 138.000 - 275.000 kr. Hertil kommer en udgift til rapportering,
  som er ansl\u00e5et til mindre end 12.500 kr. hvert 4. \u00e5r.\\n\\nHvis der stilles
  krav til tandl\u00e6geklinikkerne om at fjerne kviks\u00f8lv fra klinikkernes affald
  og spildevand, vil det reducere den lokale udledning. Det kr\u00e6ver, at alle tandklinikker
  benytter amalgamseparatorer til at fjerne tandfyldningsmaterialet amalgam, der indeholder
  kviks\u00f8lv, fra klinikkernes affald/spildevand. Teknologien hertil findes i dag,
  men det er ikke et specifikt krav i Minamatakonventionen, at den skal benyttes.
  Hvis vi i Gr\u00f8nland v\u00e6lger en BAT-tilgang til konventionen, hvor der stilles
  krav om, at tandklinikkerne ikke udleder kviks\u00f8lv, vil der v\u00e6re omkostninger
  til at installere amalgamseparatorer og omkostninger til bedre affaldsh\u00e5ndtering
  af det opsamlede amalgam. Dette vurderes at kunne bel\u00f8be sig til 700.000 -
  1.000.000 kr. i investeringer og 50.000 - 150.000 kr. pr. \u00e5r i l\u00f8bende
  omkostninger. Udgifterne vil p\u00e5hvile den offentlige tandpleje.\\n\\nGrundet
  COVID-19 situation vil de \u00f8konomiske konsekvenser s\u00f8gt begr\u00e6nset
  mest muligt og der g\u00e5s efter en minimumsimplementering, som vurderes at v\u00e6re
  tilstr\u00e6kkelig. Det vil betyde, at det er ikke n\u00f8dvendigt at foretage investeringer
  i amalgamseptorer.\\n\\nH\u00f8ring\\n\\nForslaget har i perioden 5. maj 2020 til
  17. juni 2020 v\u00e6ret sendt i offentlig h\u00f8ring. Der har ikke v\u00e6ret
  nogle bem\u00e6rkninger til forslaget.\\n\\nMed disse bem\u00e6rkninger vil jeg
  p\u00e5 vegne af Naalakkersuisut overlade punktet til velvillig behandling i Inatsisartut.\\n\\nBilag\\n\\n1.
  Samfunds\u00f8konomisk analyse af oph\u00e6velse af territorialt forbehold for Gr\u00f8nland
  i relation til Minamatakonventionen \u2013 Teknisk baggrundsrapport\\n2. Socio\u00f8konomiske
  konsekvenser af oph\u00e6velse af territorialt forbehold i relation til Minamatakonventionen
  \u2013 Konsekvensnotat\\n3. Notat - Gennemgang af Minamatakonventionen\"", "\"GUG
