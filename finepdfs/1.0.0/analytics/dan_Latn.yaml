  siden v\u00e6re opm\u00e6rksom p\u00e5, hvilket specifik anerkende sprog, der g\u00f8r
  det lettest for dig at kommunikerer med dine kolleger og/eller dine medarbejdere.\\n\\nN\u00e5r
