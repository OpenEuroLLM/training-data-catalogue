  "\"Gener\u00e1tor HTML k\u00f3du pro galerii LightBox\\n\\nPo implementaci LightBoxu
  do motivu jsem pot\u0159eboval pro sv\u00e9 galerie vytvo\u0159it html k\u00f3d.
  Pro ka\u017ed\u00fd obr\u00e1zek zvl\u00e1\u0161\u0165. Vzhledem k tomu, \u017ee
  galerie obsahuj\u00ed des\u00edtky obr\u00e1zk\u016f, vytvo\u0159il jsem tento skript.\\n\\nJedn\u00e1
  se o jednoduch\u00e9 makro v Excelu, kter\u00e9 pracuje s \u00fadaji jako jsou n\u00e1zev
  souboru, velikost miniatury, alt, ... .\\n\\nPo otev\u0159en\u00ed se\u0161itu je
  pot\u0159eba nejd\u0159\u00edve z\u00edskat seznam soubor\u016f s obr\u00e1zky pro
  galerii. Proto jsem na list \\\"Seznam soubor\u016f\\\" p\u0159idal n\u00e1stroj.
  Pokud ho budete cht\u00edt vyu\u017e\u00edt, tak se p\u0159epn\u011bte na list \\\"Seznam
  soubor\u016f\\\". Stiskn\u011bte tla\u010d\u00edtko [Na\u010d\u00edst soubory].
  Zobraz\u00ed se dialogov\u00e9 okno pro vyhled\u00e1n\u00ed slo\u017eky. Vyberte
  slo\u017eku, ve kter\u00e9 m\u00e1te obr\u00e1zky a potvr\u010fte OK . Do listu
  se na\u010dte n\u00e1zev souboru, slo\u017eka, velikost a cel\u00e1 cesta z vybran\u00e9
  slo\u017eky.\\n\\nZkop\u00edrujte si ve sloupci A seznam soubor\u016f. P\u0159epn\u011bte
  se na list \\\"HTML\\\" nastavte se na bu\u0148ku A13 a vlo\u017ete. Do sloupce
  B vypl\u0148te parametr ALT nebo nechte p\u016fvodn\u00ed vzorec, kter\u00fd podle
  po\u010dtu soubor\u016f vypln\u00ed hodnotu \\\"Galerie: obr\u00e1zek 1 z 28\\\".
  Do sloupce C vypl\u0148te parametr TITLE. Te\u010f m\u016f\u017eeme p\u0159ej\u00edt
  k dal\u0161\u00edm \u00fadaj\u016fm v horn\u00ed tabulce. Pi\u0161te jen do pol\u00ed,
  kter\u00e9 jsou sv\u011btle tyrkysov\u00e9. U ka\u017ed\u00e9ho popisu je vlo\u017een
  koment\u00e1\u0159 bun\u011bk, tak\u017ee zde nebudu popisovat jednotliv\u00e9 parametry.
  Pro kontrolu je v bu\u0148ce A10 vid\u011bt n\u00e1hled (nelze p\u0159ehl\u00e9dnout)
  html k\u00f3du. Informace soubor, alt_popis a title_popis se pak dopln\u00ed prom\u011bnnou
  p\u0159i zpracov\u00e1n\u00ed makrem.\\n\\nMakro vytvo\u0159\u00ed soubor \\\"Galerie.html\\\",
  kter\u00fd najdete vedle souboru XLS. V souboru jsem nechal v \u010d\u00e1sti \\\"head\\\"
  linky na js script a css. Soubor pak sta\u010d\u00ed otev\u0159\u00edt a pot\u0159ebn\u00e9
  k\u00f3dy zkop\u00edrovat do va\u0161\u00ed html str\u00e1nky. Tento gener\u00e1tor
  lze samoz\u0159ejm\u011b vyu\u017e\u00edt i pro jin\u00e9 \u00fa\u010dely.\\n\\nSoubor
  s gener\u00e1torem: Nejste p\u0159ihl\u00e1\u0161en(a).\\n\\n1\"", "\"Posudek vedouc\u00ed
  diplomov\u00e9 pr\u00e1ce Bc. Zuzany Frances \u0160imonov\u00e9\\n\\nStudentka Bc.
  Zuzana Frances \u0160imonov\u00e1 vypracovala diplomovou pr\u00e1ci na t\u00e9ma
  \u201eVliv chemick\u00e9 a term\u00e1ln\u00ed imidizace polyimid\u016f na jejich
  vybran\u00e9 vlastnosti\\\". Tato diplomov\u00e1 pr\u00e1ce se zab\u00fdv\u00e1
  posouzen\u00edm vlivu p\u0159\u00edpravy polyimid\u016f metodami tepeln\u00e9 synt\u00e9zy
  a synt\u00e9zy s vyu\u017eit\u00edm chemick\u00fdch katalyz\u00e1tor\u016f s c\u00edlem
  porovn\u00e1n\u00ed \u00fa\u010dinnosti obou metod synt\u00e9zy a zvolen\u00fdch
  typ\u016f katalyz\u00e1tor\u016f.\\n\\nV liter\u00e1rn\u00ed re\u0161er\u0161i diplomantka
  zpracovala problematiku synt\u00e9zy polyimid\u016f r\u016fzn\u00fdmi postupy. P\u0159edkl\u00e1dan\u00e1
  re\u0161er\u0161e dostupn\u00e9 literatury, p\u0159i n\u00ed\u017e autorka \u010derpala
  z adekv\u00e1tn\u00edho po\u010dtu zdroj\u016f, je zpracov\u00e1na systematicky
  a diplomantka v n\u00ed prok\u00e1zala znalost problematiky v dan\u00e9m oboru.
  V praktick\u00e9 \u010d\u00e1sti studentka detailn\u011b popsala laboratorn\u00ed
  synt\u00e9zu polyimid\u016f metodou tepeln\u00e9 a chemick\u00e9 imidizace s vyu\u017eit\u00edm
  n\u011bkolika katalyz\u00e1tor\u016f i pou\u017eit\u00e9 hodnot\u00edc\u00ed metody.
  Diskuze je vedena p\u0159ehledn\u011b a srozumiteln\u011b. Velice kladn\u011b hodnot\u00edm
  samostatnost autorky, snahu o pochopen\u00ed problematiky a schopnost nal\u00e9zat
  logick\u00e1 vysv\u011btlen\u00ed zaznamenan\u00fdch jev\u016f.\\n\\nMohu konstatovat,
  \u017ee p\u0159edkl\u00e1dan\u00e1 diplomov\u00e1 pr\u00e1ce splnila zad\u00e1n\u00ed.
  V r\u00e1mci t\u00e9to pr\u00e1ce bylo dosa\u017eeno velk\u00e9 mno\u017estv\u00ed
  p\u016fvodn\u00edch v\u00fdsledk\u016f, kter\u00e9 maj\u00ed praktick\u00fd v\u00fdznam
  a mohou p\u0159isp\u011bt k roz\u0161\u00ed\u0159en\u00ed pr\u016fmyslov\u00e9ho
  vyu\u017eit\u00e9 polyimidov\u00fdch materi\u00e1l\u016f.\\n\\nNa z\u00e1klad\u011b
  v\u00fd\u0161e jmenovan\u00fdch skute\u010dnost\u00ed doporu\u010duji diplomovou
  pr\u00e1ci Bc. Zuzany Frances \u0160imonov\u00e9 k obhajob\u011b a hodnot\u00edm
  ji klasifika\u010dn\u00edm stupn\u011bm\\n\\nA  - v\u00fdborn\u011b.\\n\\nV Pardubic\u00edch
  20.5. 2022\\n\\nIng. Jana Machotov\u00e1, Ph.D.\""]'
