  |\\n| HONZA MARE\u010cEK | 1:50 |\\n| TOM\u00c1\u0160 LINDNER | 1:50 |\\n| M\u00cdLA
  HOR\u00c1\u010cEK | 2:00 |\\n| R\u00cd\u0160A BEDN\u00c1\u0158 | 2:00 |\\n| KAREL
  KODR | 2:00 |\\n| HEL\u010cA MCALORUM | 2:10 |\\n| M\u00cd\u0160A STEKL\u00c1 |
  2:10 |\\n| JARDA KR\u00c1TK\u00dd | 2:10 |\\n| VERONIKA KRI\u017dANOV\u00c1 | 2:10
  |\\n| DARINA NOVIKOV\u00c1 | 2:30 |\\n| PAVL\u00cdNA BRO\u010eANI | 2:30 |\\n\\nNa\u0161e
  skv\u011bl\u00e1 skupina pacemaker\u016f v\u00e1s podpo\u0159\u00ed a provede z\u00e1vodem.
  Hledejte jejich barevn\u00e9 vlajky a m\u011bjte ty nejlep\u0161\u00ed b\u011b\u017eeck\u00e9
  spole\u010dn\u00edky!\\n\\nJirka Fix, RunCzech Pacemakers:\\nMoc se t\u011b\u0161\u00edme
  na perfektn\u00ed z\u00e1vod s 15 000 b\u011bzc\u00ed. Pro n\u00e1s t\u00fdm to
  bude nov\u00e1 zku\u0161enost! U\u017e te\u010f v\u00edme, \u017ee RunCzech p\u0159ipravil
  spoustu novinek, ze kter\u00fdch budete nad\u0161eni - tou nejv\u011bt\u0161\u00ed
  je samoz\u0159ejm\u011b nov\u00e1 tra\u0165 startu a trat\u00ed. P\u0159idejte se
  k n\u00e1m a za\u017eijte nov\u00e9 dobrodru\u017estv\u00ed na zn\u00e1m\u00e9m
  z\u00e1vod\u011b.\\n\\nNa trati v\u00e1s bude \u010dekat stabiln\u00ed t\u00fdm
  pacemaker\u016f, kte\u0159\u00ed v\u00e1s provedou z\u00e1vodem od 1:24 do 2:30
  hod.\\n\\nMEDAILE\\n\\n1/2Maraton Praha 2024 p\u0159edstav\u00ed design medaile,
  kter\u00fd vz\u00e1d\u00e1 hold jedn\u00e9 z nejzn\u00e1m\u011bj\u0161\u00edch pra\u017esk\u00fdch
  pam\u00e1tek: orloji na Starom\u011bstsk\u00e9m n\u00e1m\u011bst\u00ed. St\u0159edov\u011bk\u00e9
  hodiny, um\u00edst\u011bn\u00e9 na Starom\u011bstsk\u00e9 radnici v srde\u010di
  Prahy, byly z\u00e1zra\u010dkem techniky a um\u011bn\u00ed a svou slo\u017eitou
  mechanikou a symbolickou v\u00fdzdobou dodnes p\u0159itahuj\u00ed n\u00e1v\u0161t\u011bvn\u00edky
  z cel\u00e9ho sv\u011bta.\\n\\nR\u00c9VVI\\n\\nCOMBO, KTER\u00c9 T\u011a PODR\u017d\u00cd\\n\\nP\u0158IPRAV
  SV\u00c9 SVALY NA KVALITN\u00cd V\u00ddKON!\\n\\nPRO B\u011a\u017dCE\\n\\nStartovn\u00ed
  \u010d\u00edslo a bal\u00ed\u010dek: Vyzvedni si p\u0159id\u011blen\u00e9 startovn\u00ed
  \u010d\u00edslo spole\u010dn\u011b s mal\u00fdm d\u00e1rkem od n\u00e1s.\\n\\nSprchy:
  Sprchy budou pro v\u0161echny b\u011b\u017ece k dispozici v technick\u00e9m z\u00e1zem\u00ed\\n\\nMas\u00e1\u017ee
  a Tejpov\u00e1n\u00ed: Pokud chcete po z\u00e1vodu relaxovat, mas\u00e1\u017ee najdete
  v technick\u00e9m z\u00e1zem\u00ed\\n\\n\u00daschovna: Do \u00faschovny si m\u016f\u017eete
  odlo\u017eit sv\u016fj batoh. Dobrovoln\u00edci v\u00e1m jej ulo\u017e\u00ed na
  v\u011b\u0161\u00e1k dle startovn\u00edho \u010d\u00edsla\\n\\n\u0160atny: K dispozici
  budou d\u00e1msk\u00e9 i p\u00e1nsk\u00e9 \u0161atny ve stanech s lavi\u010dkami.
  Na z\u00e1vod tak m\u016f\u017eete p\u0159ij\u00edt v civilu a p\u0159evl\u00e9ct
  se pohodln\u011b a\u017e zde\\n\\nToalety: Mobiln\u00ed WC zaji\u0161\u0165uje firma
  Johnny servis. Nezapome\u0148te si p\u0159ed z\u00e1vodem odsko\u010dit\\n\\nMedaile:
  Ka\u017ed\u00fd b\u011b\u017eec dostane v c\u00edli medaile. Pro leto\u0161n\u00ed
  sezonu se m\u016f\u017eete t\u011b\u0161it na netradi\u010dn\u00ed tvar s dominantou
  m\u011bsta na trase.\\n\\nOb\u010derstvovac\u00ed stanice: Na trati a v c\u00edli
  bude um\u00edst\u011bno 8 ob\u010derstvovac\u00edch stanic\\n\\nL\u00e9ka\u0159sk\u00e1
  slu\u017eba: Zdravotn\u00ed slu\u017eba bude k dispozici na startu, v c\u00edli
  a na trati. Pokud pot\u0159ebujete zavolat pomoc, po\u017e\u00e1dejte dobrovoln\u00edka
  nebo volejte z\u00e1chranou slu\u017ebu na \u010d\u00edsle 155.\\n\\nPam\u011btn\u00ed
  medaile: Ka\u017ed\u00fd b\u011b\u017eec obdr\u017e\u00ed v c\u00edli pam\u011btn\u00ed
  medaili.\\n\\nCilov\u00e9 fotografie: M\u016f\u017eete si objednat na adrese www.marathonphotos.live.
  K dispozici budou p\u0159ibli\u017en\u011b t\u0159i dny po z\u00e1vod\u011b\\n\\nDiplom:
  Vzpom\u00ednat na sv\u016fj v\u00fdkon m\u016f\u017eete d\u00edky diplomu, kter\u00fd
  v\u00e1m bude doru\u010den emailem s v\u00fdsledky\\n\\nTri\u010dko: Ka\u017ed\u00fd
  b\u011b\u017eec si m\u016f\u017ee zakoupit ofici\u00e1ln\u00ed tri\u010dko z\u00e1vodu
  zna\u010dky adidas a letos jako novinku speci\u00e1ln\u00ed adidas bundu\\n\\nOdbaven\u00ed
  bez obav rychle a pohodln\u011b\\n\\nINOVATIVN\u00cd \u017dIV\u00c9 VYS\u00cdL\u00c1N\u00cd\\n\\nLivestream\\n-
  kompletn\u00ed pokryt\u00ed z\u00e1vodu od startu a\u017e po finish a mnohem v\u00edce\\n-
  \u017eiv\u00e9 sledov\u00e1n\u00ed kamer na trati\\n- interaktivn\u00ed mapa z\u00e1vodu
  s ve\u0161ker\u00fdmi \u00fadaji jako tempo, rychlost nadmo\u0159sk\u00e1 v\u00fd\u0161ka\\n-
  mo\u017enost zp\u011btn\u00e9ho p\u0159ehr\u00e1v\u00e1n\u00ed kdykoliv po z\u00e1vod\u011b\\n-
  v\u00fdb\u011br toho nejlep\u0161\u00edho z\u00e1b\u011bru v dan\u00fd moment\\n-
  \u017eiv\u00e9 vys\u00edl\u00e1n\u00ed zde\\n\\nPULSE.TV is a streaming platform
  built for sport.\\n\\nRUNCZECH APP\\n\\nChceme se st\u00e1le zlep\u0161ovat a nab\u00edzet
  novinky a nejnov\u011bj\u0161\u00ed technologie. Proto jsme pracovali na nov\u00e9
  aplikaci, kter\u00e1 zlep\u0161\u00ed komfort \u00fa\u010dastn\u00edk\u016f na\u0161ich
  z\u00e1vod\u016f.\\n\\nTato platforma n\u00e1m umo\u017en\u00ed p\u0159ev\u00e9st
  maxim\u00e1ln\u00ed mo\u017en\u00fd objem informac\u00ed do online prost\u0159ed\u00ed
  a t\u00edm redukovat po\u010det ti\u0161t\u011bn\u00fdch materi\u00e1l\u016f.\\n\\nB\u011b\u017eci
  na jednom m\u00edst\u011b z\u00edskaj\u00ed v\u0161echny pot\u0159ebn\u00e9 informace
  o z\u00e1vod\u011b, doprovodn\u00fd program i bal\u00ed\u010dek v\u00fdhod od partner\u016f
  a mnoho dal\u0161\u00edch novinek.\\n\\nCHARITATIVN\u00cd PARTNER\\n\\nJi\u017e
  v\u00edce ne\u017e 25 let podporuje RunCzech nejen my\u0161lenku fyzick\u00e9 kondice
  a du\u0161evn\u00edho zdrav\u00ed, ale i spole\u010densk\u00e9 a environment\u00e1ln\u00ed
  odpov\u011bdnosti.\\n\\nS ka\u017ed\u00fdm z\u00e1vodem, kter\u00fd po\u0159\u00e1d\u00e1me,
  se zavazujeme finan\u010dn\u011b podpo\u0159it r\u016fzn\u00e9 projekty, kter\u00e9
  jsou d\u016fle\u017eit\u00e9 pro b\u011b\u017ece i komunitu.\\n\\nNav\u00edc pom\u00e1h\u00e1me
  organizac\u00edm, se kter\u00fdmi spolupracujeme, t\u00edm, \u017ee jejich p\u0159\u00edb\u011bhy
  pos\u00edl\u00e1me do na\u0161\u00ed rozs\u00e1hl\u00e9 s\u00edt\u011b b\u011b\u017ec\u016f
  a b\u011b\u017eeck\u00fdch nad\u0161enc\u016f ve v\u00edce ne\u017e 40 zem\u00edch
  sv\u011bta.\\n\\nV r\u00e1mci na\u0161eho \u00fasil\u00ed o to, aby byl sv\u011bt
  laskav\u011bj\u0161\u00ed a p\u0159\u00edv\u011btiv\u011bj\u0161\u00ed k \u017eivotu,
  vynakl\u00e1d\u00e1me obrovsk\u00e9 \u00fasil\u00ed na to, aby samotn\u00e9 z\u00e1vody
  nenaru\u0161ovaly \u017eivotn\u00ed prost\u0159ed\u00ed.\\n\\nSv\u011btlu\u0161ka
  vznikla v roce 2003 jako vlastkov\u00fd projekt Nada\u010dn\u00edho fondu \u010cesk\u00e9ho
  rozhlasu a ji\u017e podruh\u00e9 je hlavn\u00edm charitativn\u00edm partnerem 1/2Maratonu
  Praha.\\n\\nSmyslem Sv\u011btlusky je umo\u017enit lidem se zrakov\u00fdm posti\u017een\u00edm
  samostatnost a \u017e\u00edt autenticky na z\u00e1klad\u011b vlastn\u00ed volby.
  Pro\u010d? Proto\u017ee v \u010cesk\u00e9 republice \u017eije 250 tis\u00edc lid\u00ed
  se zrakov\u00fdm posti\u017een\u00edm a t\u0159etina z nich je t\u00e9m\u011b\u0159
  nevidom\u00e1 nebo nevidom\u00e1. Z toho 95 % zrakov\u011b posti\u017een\u00fdch
  d\u011bt\u00ed m\u00e1 dal\u0161\u00ed posti\u017een\u00ed (kter\u00e1 se nes\u010d\u00edtaj\u00ed,
  ale n\u00e1sobi). Roste po\u010det zrakov\u011b posti\u017een\u00fdch seniour\u016f
  v d\u016fsledku nemoci souvisej\u00edc\u00edch s v\u011bkem. V\u010dasn\u00e1 pomoc
  pro d\u011bti se zrakov\u00fdm posti\u017een\u00edm je dostupn\u00e1 pouze 14 %
  rodin, kter\u00e9 j\u00ed skute\u010dn\u011b pot\u0159ebuj\u00ed. A\u017e 70 % lid\u00ed
  se zrakov\u00fdm posti\u017een\u00edm je nezam\u011bstnan\u00fdch z d\u016fvodu
  nedostate\u010dn\u00e9 p\u00e9\u010de o zrak.\\n\\nPO\u010cET NA 1/2MARATONU: 1
  060\\n\\nNa v\u0161ech z\u00e1vodech RunCzech potk\u00e1te nepostradateln\u00e9
  pomocn\u00edky s dob\u00fdm srdcem. V z\u00e1zem\u00ed, na trase, na ob\u010derstvovac\u00edch
  stanic\u00edch, ve startu i v c\u00edli a v\u0161ude tam, kde jsou pot\u0159eba.
  Pom\u00e1haj\u00ed b\u011b\u017ec\u016fm nabrat druh\u00fd dech a hldaj\u00ed bezpe\u010dnost
  a plynulost z\u00e1vodu. RunCzech dobrovoln\u00edci pom\u00e1haj\u00ed zabezpe\u010dit
  chod z\u00e1vod\u016f a jsou jejich d\u016fle\u017eitou sou\u010d\u00e1st\u00ed.
  Bez dobrovoln\u00edk\u016f by \u017e\u00e1dn\u00fd z\u00e1vod nebyl!\\n\\nPROSTOR
