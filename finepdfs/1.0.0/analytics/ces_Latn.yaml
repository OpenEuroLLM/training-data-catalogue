  nemus\u00ed po\u010d\u00edtat spr\u00e1vn\u011b.   Cyklick\u00fd odkaz m\u016f\u017ee
  b\u00fdt vzorec, kter\u00fd odkazuje zp\u00e1tky na hodnotu v bu\u0148ce, ve kter\u00e9
  m\u00e1te vzorec napsan\u00fd, nebo na bu\u0148ku, kter\u00e1 je z\u00e1visl\u00e1
  na hodnot\u011b ve svoj\u00ed vlastn\u00ed bu\u0148ce.\\\" Nap\u0159. p\u0159i z\u00e1pisu
  ceny do \u0159\u00e1dku 14 se cena nep\u0159en\u00e1\u0161\u00ed do \u0159\u00e1dku
  12 ani do listu Rozpo\u010det \u2013 Jen objekty celkem.\\n\\nPodle n\u00e1s by
  za \u0159\u00e1dkem 282 02-SO 201 \u2013 VSTUP DO \u0160KOLY m\u011bly b\u00fdt
  n\u00e1zvy z \u0159\u00e1dk\u016f 391 a 392 jako n\u00e1zev odd\u00edlu, proto\u017ee
  u t\u011bchto \u0159\u00e1dk\u016f je mod\u0159e vyzna\u010deno upozorn\u011bn\u00ed.\\n\\nTo
