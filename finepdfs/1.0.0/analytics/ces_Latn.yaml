  naj\u00edt nov\u00e9 p\u0159\u00e1tel\u00e9. Propojujeme aktivn\u00ed lidi na m\u00edstn\u00ed
  i mezin\u00e1rodn\u00ed \u00farovni a vytv\u00e1\u0159\u00edme prostor, kter\u00fd
  spojuje wellness a networking. Jsme tu proto, abychom b\u011b\u017ec\u016fm v\u0161ech
  \u00farovn\u00ed pomohli dos\u00e1hnout jejich c\u00edl\u016f a stanovit si nov\u00e9.
  Jsme odhodlan\u00ed budovat b\u011b\u017eeckou komunitu, kde all runners are beautiful.
  Bezpe\u010dn\u00fd prostor, kde jsou i v\u0161ichni rovn\u00ed bez ohledu na sv\u00e9
  zku\u0161enosti, v\u011bk a v\u00e1hu.\\n\\nRunczech Store: Neexistuje lep\u0161\u00ed
  m\u00edsto pro n\u00e1kup b\u011b\u017eeck\u00e9ho vybaven\u00ed ne\u017e nejv\u011bt\u0161\u00ed
  m\u00edsto pro b\u011b\u017eeck\u00e9 profesion\u00e1ly v \u010cesku. S t\u00e9m\u011b\u0159
  t\u0159iceti lety zku\u0161enost\u00ed s po\u0159\u00e1d\u00e1n\u00edm b\u011b\u017eeck\u00fdch
  akc\u00ed a v\u00fdukou b\u011bh\u00e1n\u00ed pro ve\u0159ejnost v\u00e1m porad\u00edme
  s v\u00fdb\u011brem spr\u00e1vn\u00e9 b\u011b\u017eeck\u00e9 obuv\u00ed, oble\u010den\u00ed
  a dopl\u0148k\u016f, d\u00edky kter\u00fdm je b\u011bh\u00e1n\u00ed radost. Nav\u0161tivte
  www.runczechstore.com a p\u0159esv\u011bd\u010dte se sami! Na Running Expo se potk\u00e1me
  v pavilonu D.\\n\\nEnergy at Work: RunCzech nab\u00edz\u00ed program, kter\u00fd
  pom\u00e1h\u00e1 firm\u00e1m a pracovn\u00edm t\u00fdm\u016fm zpest\u0159it b\u011b\u017en\u00fd
  pracovn\u00ed den. Tr\u00e9ninky jsou navr\u017eeny podle va\u0161ich pot\u0159eb,
  p\u0159\u00e1n\u00ed a \u00farovn\u011b kondice a c\u00edl\u016f zam\u011bstnanc\u016f.
  Pln\u00e9 ch\u00e1peme, \u017ee ne ka\u017ed\u00fd \u010dlov\u011bk je na stejn\u011b
  \u00farovni, proto jsou tr\u00e9ninky navr\u017eeny tak, aby vyhovovaly ka\u017ed\u00e9mu.
  M\u00edsto, den a cas kon\u00e1n\u00ed tr\u00e9nink\u016f jsou na vas.\\n\\n---\\n\\n**5
  M\u00cdST, KTER\u00c1 VID\u011aT V PRAZE**\\n\\nPraha, hlavn\u00ed m\u011bsto \u010cesk\u00e9
  republiky, je \u010dasto naz\u00fdv\u00e1na \u201estov\u011b\u017eat\u00e1\u201c.
  Je to historick\u00fd z\u00e1zrak, v n\u011bm\u017e se m\u00eds\u00ed gotick\u00e1,
  renesan\u010dn\u00ed a barokn\u00ed architektura, a proto je vyhled\u00e1van\u00fdm
  c\u00edlem cestovatel\u016f z cel\u00e9ho sv\u011bta. Zde je p\u011bt nejhez\u010d\u00edch
  m\u00edst, kter\u00e1 mus\u00edte p\u0159i n\u00e1v\u0161t\u011bv\u011b Prahy nav\u0161t\u00edvit,
  abyste pln\u011b poznali jej\u00ed kr\u00e1su a historickou hloubku.\\n\\n1. **Pra\u017esk\u00fd
  hrad**\\n   Pra\u017esk\u00fd hrad, kter\u00fd dominuje panoramatu m\u011bsta, je
  nejen nejv\u011bt\u0161\u00edm starobyl\u00fdm hradem na sv\u011bt\u011b, ale tak\u00e9
  tepaj\u00edc\u00edm srdcem \u010desk\u00e9 historie. V hradn\u00edm komplexu se
  nach\u00e1z\u00ed mistrovsk\u00e9 d\u00edlo gotiky, katedr\u00e1la sv. V\u00edta,
  spolu se Star\u00fdm kr\u00e1lovsk\u00fdm pal\u00e1cem, bazilikou sv. Ji\u0159\u00ed
  a Zlatou uli\u010dkou. Proch\u00e1zka hradn\u00edm are\u00e1lem nab\u00edz\u00ed
  cestu st\u00e1let\u00fdmi architektonick\u00e9ho v\u00fdvoje a mo\u017enost b\u00fdt
  sv\u011bdkem ceremoni\u00e1lu str\u00e1d\u00e1n\u00ed str\u00e1\u017ei.\\n\\n2.
  **Karl\u016fv most**\\n   Karl\u016fv most, kter\u00fd spojuje Star\u00e9 M\u011bsto
  s Malou Stranou, je ikonick\u00fdm symbolem Prahy. Tento historick\u00fd most postaven\u00fd
  ve 14. stolet\u00ed je lemov\u00e1n sochami katolick\u00fdch sv\u011btc\u016f a
  nab\u00edz\u00ed malebn\u00fd v\u00fdhled na Vltavu a velkolepou krajinu m\u011bsta.
  N\u00e1v\u0161t\u011bva za sv\u00edt\u00e1n\u00ed nebo za soumraku p\u0159in\u00e1\u0161\u00ed
  kouzeln\u00fd z\u00e1\u017eitek, je zde m\u00e9n\u011b lid\u00ed a \u00fa\u017easn\u00e9
  sv\u011btlo pro fotografov\u00e1n\u00ed.\\n\\n3. **Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed
  a orloj**\\n   Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed je srdcem Prahy, obklopen\u00fdm
  barevn\u00fdmi barokn\u00edmi budovami a gotick\u00fdmi kostely, jako je kostel
  Panny Marie p\u0159ed T\u00fdnem a Starom\u011bstsk\u00e1 radnice. V\u00fdstavn\u00ed
  dominantou n\u00e1m\u011bst\u00ed je st\u0159edov\u011bk\u00fd orloj, kter\u00fd
  ka\u017edou hodinu p\u0159edv\u00e1d\u00ed \u00fachvatn\u00e9 mechanick\u00e9 p\u0159edstaven\u00ed.
  Na ru\u0161n\u00e9m n\u00e1m\u011bst\u00ed se b\u011bhem roku konaj\u00ed tak\u00e9
  r\u016fzn\u00e9 trhy, v\u010detn\u011b proslul\u00fdch v\u00e1no\u010dn\u00edch.\\n\\n4.
  **Vy\u0161ehrad**\\n   Vy\u0161ehrad je historick\u00e1 pevnost, kter\u00e1 se nach\u00e1z\u00ed
  na kopci nad Vltavou v Praze a nab\u00edz\u00ed panoramatick\u00fd v\u00fdhled na
  m\u011bsto. Dnes je Vy\u0161ehrad nejen kulturn\u00ed pam\u00e1tkou, ale tak\u00e9
  klidn\u00fdm parkem, kde se nach\u00e1z\u00ed bazilika svat\u00e9ho Petra a Pavla,
  Vy\u0161ehradsk\u00fd h\u0159bitov, kde je poh\u0159beno mnoho slavn\u00fdch \u010cech\u016f,
  a starobyl\u00e9 opav\u011bn\u00ed, kter\u00e9 \u0161ept\u00e1 p\u0159\u00edb\u011bhy
  z minulosti.\\n\\n5. **Tan\u010d\u00edc\u00ed d\u016fm**\\n   Tan\u010d\u00edc\u00ed
  d\u016fm, n\u00e1padn\u011b modern\u00ed uprost\u0159ed historick\u00e9 struktury
  Prahy, je architektonick\u00fdm z\u00e1zra\u010dkem, kter\u00fd vynik\u00e1 sv\u00fdm
  dekonstruktivistick\u00fdm designem p\u0159ipom\u00ednaj\u00edc\u00edm dva tanecn\u00edky.
  Tato jedine\u010dn\u00e1 stavba, zn\u00e1m\u00e1 tak\u00e9 \u201eFred a Ginger\u201c
  podle Freda Astaira a Ginger Rogersov\u00e9, ukazuje bravuru a inovativn\u00ed str\u00e1nku
  Prahy. A\u010dkoliv se jedn\u00e1 p\u0159edev\u0161\u00edm o kancel\u00e1\u0159skou
  budovu, v jej\u00edm nejvy\u0161\u0161\u00edm pat\u0159e se nach\u00e1z\u00ed restaurace
  s n\u00e1dhern\u00fdm v\u00fdhledem na m\u011bsto, co\u017e z n\u00ed \u010din\u00ed
  povinnou n\u00e1v\u0161t\u011bvu pro milovn\u00edky architektury a ty, kte\u0159\u00ed
  cht\u011bj\u00ed vid\u011bt Prahu z nove perspektivy.\\n\\nMlad\u00ed nad\u011bjn\u00ed
  sportovci reprezentuj\u00ed RunCzech na nejpresti\u017en\u011bj\u0161\u00edch z\u00e1vodech
  na sv\u011bt\u011b.\\n\\nChceme propojit profesion\u00e1ln\u00ed a amat\u00e9rsk\u00e9
  b\u011b\u017ece, organizovat workshopy, nav\u0161t\u011bvovat \u0161koly a organizovat
  setk\u00e1n\u00ed s profesion\u00e1ln\u00edmi sportovci v na\u0161em b\u011b\u017eeck\u00e9m
  centru a p\u0159i p\u0159edz\u00e1vodn\u00edch b\u011b\u017ec\u00edch.\\n\\nCelkov\u00e9
  \u00fasp\u011bchy:\\n\\n- 8 sv\u011btov\u00fdch rekord\u016f\\n- 3 olympionici\\n-
  2 nejlep\u0161\u00ed sv\u011btov\u00e9 \u010dasy\\n- 1 v\u00edt\u011bzstv\u00ed
  na p\u0159edn\u00edch sv\u011btov\u00fdch z\u00e1vodech\\n\\nC\u00edle:\\n- Podpora
  mlad\u00fdch talentovan\u00fdch sportovc\u016f\\n- Vytvo\u0159it podm\u00ednky pro
  sportovce, aby mohli sout\u011b\u017eit se \u0161pi\u010dkov\u00fdmi evropsk\u00fdmi
  v\u00fdtrvalci\\n- Inspirujte a motivujte ke sportu v\u0161echny ve v\u0161ech v\u011bkov\u00fdch
  skupin\u00e1ch\\n\\n\u010cestn\u00ed Atleti:\\n- Ji\u0159\u00ed Homol\u00e1\u010d
  / Patrik Vebr / Damian Vich / Martin \u017dajic\\n\\nJOIN US ON: SUPERHALFS.COM\\n\\nGET
  YOUR SUPERMEDAL\\n\\nGET YOUR SUPERPASSPORT\\n\\nCOMPLETE 6 RACES IN ANY ORDER\\n\\nGET
  A STAMP FOR EVERY RACE COMPLETED\\n\\nYOU HAVE 60 MONTHS TO DO IT\\n\\nJUNIORSK\u00dd
  MARATON\\n\\nJuniorsk\u00e9 mistrovstv\u00ed v maratonu, kter\u00e9 RunCzech po\u0159\u00e1d\u00e1
  od roku 1997, je st\u00e1le nejv\u011bt\u0161\u00ed akc\u00ed b\u011b\u017eeckou
  pro st\u0159edo\u0161kol\u00e1ky a jejich u\u010ditele.\\n\\nTento z\u00e1vod ka\u017edoro\u010dn\u011b
  p\u0159iv\u00edt\u00e1 tis\u00edce student\u016f \u2013 jde o \u0161tafetov\u00fd
  z\u00e1vod, ka\u017ed\u00fd t\u00fdm se skl\u00e1d\u00e1 z 10 \u010dlen\u016f a
  ka\u017ed\u00fd \u010dlen b\u011b\u017e\u00ed 4,2 km. Je to akce, kter\u00e1, jak
