  1 m,   1 x 1,5 m,   1 x 2 m,   1 x 3 m,   1,5 x 2 m,  2 x 2 m,\\n\\nPlexi pouze
  na objedn\u00e1vku.\"", "\"Hodnocen\u00ed V\u00fdchovn\u00e9ho poradenstv\u00ed
  pro \u0161koln\u00ed rok 2017-2018\\n\\n* Na Z\u0160 a M\u0160 Malonty bylo v tomto
  \u0161koln\u00edm roce evidov\u00e1no 6 \u017e\u00e1k\u016f, jejich\u017e v\u00fduka
  prob\u00edhala dle IVP. PLPP byl v tomto \u0161koln\u00edm roce vypracov\u00e1n
  pro 3 \u017e\u00e1ky.\\n* 3 \u017e\u00e1ci byli vy\u0161et\u0159eni v PPP v \u010cesk\u00e9m
  Krumlov\u011b, 3 \u017e\u00e1ci klinick\u00fdm psychologem.\\n* U vy\u0161et\u0159en\u00fdch
  \u017e\u00e1k\u016f byla uplat\u0148ov\u00e1na doporu\u010den\u00ed pro pr\u00e1ci
  uveden\u00e1 v jednotliv\u00fdch zpr\u00e1v\u00e1ch.\\n* \u017d\u00e1ci 8. a 9.
  t\u0159\u00eddy se tradi\u010dn\u011b pod\u00edvali na \u010deskobud\u011bjovickou
  v\u00fdstavu Vzd\u011bl\u00e1n\u00ed a \u0159emeslo (listopad 2017) s t\u00e9matikou
  volby povol\u00e1n\u00ed a sb\u00edrali cenn\u00e9 informace p\u0159\u00edmo od
  z\u00e1stupc\u016f a student\u016f jednotliv\u00fdch \u0161kol. Vybran\u00e9 \u0161koly
  \u017e\u00e1ci nav\u0161t\u011bvovali i ve dnech otev\u0159en\u00fdch dve\u0159\u00ed.
  \u0160kol\u00e1m, jejich\u017e u\u010debn\u00ed obory byl nejv\u011bt\u0161\u00ed
  z\u00e1jem, byla umo\u017en\u011bna prezentace p\u0159\u00edmo na na\u0161\u00ed
  \u0161kole.\\n* V r\u00e1mci poradensk\u00e9 \u010dinnosti byly dle z\u00e1jmu individu\u00e1ln\u011b
  probr\u00e1ny mo\u017enosti jednotliv\u00fdch \u017e\u00e1k\u016f s jejich rodi\u010di.\\n*
  V listopadu nav\u0161t\u00edvili \u017e\u00e1ci 9. t\u0159. \u00da\u0159ad pr\u00e1ce
  v \u010cesk\u00e9m Krumlov\u011b s besedou o mo\u017enostech budouc\u00edho uplatn\u011bn\u00ed
  v dan\u00e9m povol\u00e1n\u00ed.\\n* Velmi p\u0159\u00ednosn\u00e1 je spolupr\u00e1ce
  s Odborem soci\u00e1ln\u00edch v\u011bc\u00ed a zdravotnictv\u00ed M\u011bstsk\u00e9ho
  \u00fa\u0159adu v Kaplici.\\n* V\u00fdchovn\u00e1 poradkyn\u011b absolvovala v lednu
  Fakultativn\u00ed e-learningov\u00e9 vzd\u011bl\u00e1v\u00e1n\u00ed v\u00fdchovn\u00fdch
  poradc\u016f Z\u0160 k problematice jednotn\u00fdch p\u0159ij\u00edmac\u00edch zkou\u0161ek.\\n*
  Ve \u0161kole bylo vedeno 6 klub\u016f v r\u00e1mci v\u00fdzvy \u010d. 02_16_022
  a 02_16_023\\n* Z\u00e1pis do 1. t\u0159\u00eddy: V dubnu jsme se se\u0161ly s u\u010ditelkami
  z M\u0160 a ty n\u00e1s informovaly o budouc\u00edch prv\u0148\u00e1\u010dc\u00edch
  formou portfoli\u00ed, kter\u00e9 d\u011btem vytvo\u0159ily a podle nich\u017e jsme
  se dob\u0159e orientovaly v jejich dovednostech a v\u011bdomostech. K z\u00e1pisu
  do 1. t\u0159\u00eddy se dostavilo 18 d\u011bt\u00ed. 14 d\u011bt\u00ed nastoup\u00ed
  tento \u0161koln\u00ed rok do na\u0161\u00ed \u0161koly, dv\u011b d\u011bti se odst\u011bhovaly
  a dv\u011bma byl po domluv\u011b s rodi\u010di navr\u017een O\u0160D.\\n* \u017d\u00e1ci,
  kte\u0159\u00ed ukon\u010dili povinnou \u0161koln\u00ed doch\u00e1zku: celkem 13
  \u017e\u00e1k\u016f z 9. ro\u010dn\u00edku a 2 \u017e\u00e1ci z 8. ro\u010dn\u00edku\\n\\nVypracovala
  Mgr., Bc. Lucie M\u011brtlov\u00e1 (VP)\"", "\"(1) **Zna\u010den\u00ed:**\\n   -
  \\\\([n] := \\\\{1, \\\\ldots, n\\\\}\\\\)\\n   - \\\\(n^k := n \\\\cdot (n-1) \\\\cdot
  \\\\ldots \\\\cdot (n-k+1)\\\\)  \\\\((klesaj\u00edc\u00ed mocnina)\\\\)\\n     \\\\(n^0
  = 1\\\\), jeliko\u017e je to pr\u00e1zdn\u00fd sou\u010din.\\n\\n(2) **Po\u010det
  funkc\u00ed** z \\\\(n\\\\)-prvkov\u00e9 mno\u017einy \\\\(N\\\\) do \\\\(m\\\\)-prvkov\u00e9
  mno\u017einy \\\\(M\\\\):\\n   \\\\[\\n   \\\\# f : N \\\\to M = m^n\\n   \\\\]\\n   Nebo:
  \\\\(\\\\# f : [n] \\\\to [m] = m^n\\\\)\\n\\n   Pro ka\u017ed\u00fd z \\\\(n\\\\)
  prvk\u016f si nez\u00e1visle na ostatn\u00edch m\u016f\u017eeme vybrat \\\\(m\\\\)
  mo\u017enost\u00ed, kam se zobraz\u00ed.\\n\\n(3) **Princip bijekce**: pokud mezi
  kone\u010dn\u00fdmi mno\u017einami \\\\(A\\\\) a \\\\(B\\\\) existuje bijekce, tak
  maj\u00ed stejn\u00fd po\u010det prvk\u016f. Speci\u00e1ln\u011b tedy b\u00fdv\u00e1
  jedno, jestli \\\\([n]\\\\) je konkr\u00e9tn\u00ed mno\u017eina \\\\(\\\\{1, \\\\ldots,
  n\\\\}\\\\), nebo libovoln\u00e1 jin\u00e1 \\\\(n\\\\)-prvkov\u00e1 mno\u017eina.\\n\\n(4)
  **Po\u010det podmno\u017ein** \\\\(n\\\\)-prvkov\u00e9 mno\u017einy \\\\(N\\\\):\\n   \\\\[\\n   |2^N|
  = 2^n\\n   \\\\]\\n   Nebo: \\\\(\\\\# A \\\\subseteq N = 2^n\\\\)\\n   Nebo: \\\\(|2^{[n]}|
  = 2^n\\\\)\\n\\n   Podmno\u017ein\u011b \\\\(A \\\\subseteq N\\\\) p\u0159i\u0159ad\u00edme
  charakteristickou funkci \\\\(c_A : N \\\\to \\\\{0, 1\\\\}\\\\) definovanou tak,
  \u017ee \\\\(c_A(x) = 1\\\\) pro \\\\(x \\\\in A\\\\) a \\\\(c_A(x) = 0\\\\) jinde.
  Ka\u017ed\u00e1 takov\u00e1 funkce jednozna\u010dn\u011b ur\u010duje podmno\u017einu
  (form\u00e1ln\u011b: existuje bijekce mezi mno\u017einou v\u0161ech podmno\u017ein
  \\\\(2^N\\\\) a mno\u017einou v\u0161ech funkc\u00ed z \\\\(N\\\\) do \\\\(\\\\{0,
  1\\\\}\\\\). Proto je podmno\u017ein stejn\u011b jako funkc\u00ed, podle (2) tedy
  \\\\(2^n\\\\).\\n\\n(5) **Po\u010det sud\u00fdch a lich\u00fdch podmno\u017ein**
  \\\\(n\\\\)-prvkov\u00e9 nepr\u00e1zdn\u00e9 mno\u017einy \\\\(N\\\\). Ozna\u010d\u00edme\\n   \\\\[\\n   S
  = \\\\{A \\\\subseteq N \\\\mid |A| \\\\text{ je sud\u00e9}\\\\}\\n   \\\\]\\n   mno\u017einu
  v\u0161ech sud\u00fdch podmno\u017ein,\\n   \\\\[\\n   L = \\\\{A \\\\subseteq N
  \\\\mid |A| \\\\text{ je lich\u00e9}\\\\}\\n   \\\\]\\n   mno\u017einu v\u0161ech
  lich\u00fdch podmno\u017ein. Potom:\\n   \\\\[\\n   |S| = |L| = 2^{n-1}\\n   \\\\]\\n\\n   Ka\u017ed\u00e1
  podmno\u017eina je bu\u010f sud\u00e1 nebo lich\u00e1, tak\u017ee \\\\(|S| + |L|\\\\)
  je rovno po\u010dtu v\u0161ech podmno\u017ein, co\u017e podle (4) je \\\\(2^n\\\\).
  Jakmile tedy uk\u00e1\u017eeme, \u017ee sud\u00fdch a lich\u00fdch je stejn\u011b,
  mus\u00ed jak \\\\(|S|\\\\), tak \\\\(|L|\\\\) b\u00fdt \\\\(2^n/2 = 2^{n-1}\\\\).\\n\\n   To,
  \u017ee sud\u00fdch a lich\u00fdch je stejn\u011b, dok\u00e1\u017eeme sestrojen\u00edm
  bijekce. Zvol\u00edme n\u011bjak\u00fd prvek \\\\(a \\\\in N\\\\) a pro \\\\(A \\\\subseteq
  N\\\\) definujeme \\\\(f(A) = A \\\\triangle \\\\{a\\\\}\\\\). \u010cili pokud \\\\(a\\\\)
  le\u017e\u00ed v \\\\(A\\\\), tak ho odebereme, pokud nele\u017e\u00ed, tak ho p\u0159id\u00e1me.
  V\u0161imneme si, \u017ee \\\\(f\\\\) zobrazuje sud\u00e9 mno\u017einy na lich\u00e9
  a opa\u010dn\u011b. Dokonce je sama k sob\u011b inverzn\u00ed, tak\u017ee je to
  bijekce mezi \\\\(S\\\\) a \\\\(L\\\\).\\n\\n(6) **Po\u010det prost\u00fdch funkc\u00ed**
  z $n$-prvkov\u00e9 mno\u017einy do $m$-prvkov\u00e9 mno\u017einy:\\n\\\\[\\n\\\\#\\\\{f
  : [n] \\\\to [m] \\\\mid f \\\\text{ prost\u00e1}\\\\} = m^n\\n\\\\]\\nPrvky $[n]$
  proch\u00e1z\u00edme v n\u011bjak\u00e9m po\u0159ad\u00ed a p\u0159id\u011blujeme
  jim funk\u010dn\u00ed hodnoty z $[m]$. Pro prvn\u00ed prvek m\u00e1me $m$ mo\u017enost\u00ed,
  pro druh\u00fd u\u017e jen $m - 1$ atd.\\n\\n(7) **K\u00f3dov\u00e1n\u00ed funkcemi**.
  Pomoc\u00ed funkc\u00ed m\u016f\u017eeme popisovat r\u016fzn\u00e9 dal\u0161\u00ed
  objekty:\\n- $f : A \\\\to \\\\{0, 1\\\\}$ odpov\u00eddaj\u00ed podmno\u017ein\u00e1m
  (jejich charakteristick\u00e9 funkce)\\n- $f : [k] \\\\to A$ odpov\u00eddaj\u00ed
  uspo\u0159\u00e1dan\u00fdm $k$-tic\u00edm, tedy prvky kart\u00e9zsk\u00e9 mocniny
  $A^k$: $f(1)$ je prvn\u00ed prvek $k$-tice, $f(2)$ druh\u00fd atd.\\n- $f : [k]
  \\\\to A$ prost\u00e9 odpov\u00eddaj\u00ed uspo\u0159\u00e1dan\u00fdm $k$-tic\u00edm
  bez opakov\u00e1n\u00ed\\n- $f : \\\\mathbb{N} \\\\to A$ odpov\u00eddaj\u00ed nekone\u010dn\u00fdm
  posloupnostem prvk\u016f z $A$\\n\\n(8) **Permutace** na $n$-prvkov\u00e9 mno\u017ein\u011b
  $N$ \u0159\u00edk\u00e1me bijekc\u00edm z $N$ do $N$. Ka\u017ed\u00e1 prost\u00e1
  funkce mezi dv\u011bma stejn\u011b velk\u00fdmi mno\u017einami nutn\u011b mus\u00ed
  b\u00fdt bijekce, tak\u017ee po\u010det bijekc\u00ed je podle (6) roven $n^n = n!$.
  Tomu \u0159\u00edk\u00e1me faktori\u00e1l \u010d\u00edsla $n$. P\u0159itom $0! =
  1$, op\u011bt se jedn\u00e1 o pr\u00e1zdn\u00fd sou\u010din.\\n\\n(9) **Line\u00e1rn\u00ed
  uspo\u0159\u00e1d\u00e1n\u00ed** na $n$-prvkov\u00e9 mno\u017ein\u011b $N$ popi\u0161eme
  o\u010d\u00edslov\u00e1n\u00edm prvk\u016f od nejmen\u0161\u00edho k nejv\u011bt\u0161\u00edmu,
  tedy bijekc\u00ed $[n] \\\\to N$. Takov\u00fdch bijekc\u00ed je stejn\u011b jako
  permutac\u00ed na $N$, tedy $n!$. \u010casto jim dokonce tak\u00e9 (lehce nepo\u0159\u00e1dn\u011b)
  \u0159\u00edk\u00e1me permutace.\\n\\n(10) **Neuspo\u0159\u00e1dan\u00e9 $k$-tice**
  neboli $k$-prvkov\u00e9 podmno\u017einy $n$-prvkov\u00e9 mno\u017einy $N$:\\n\\\\[\\n\\\\#\\\\{A
  \\\\subseteq N \\\\mid |A| = k\\\\} = \\\\frac{n^k}{k!}\\n\\\\]\\nHledan\u00fd po\u010det
  ozna\u010dme $H$. Budeme dv\u011bma zp\u016fsoby po\u010d\u00edtat uspo\u0159\u00e1dan\u00e9
  $k$-tice prvk\u016f $N$ bez opakov\u00e1n\u00ed. Jednak odpov\u00eddaj\u00ed prost\u00fdm
  funkc\u00edm z $\\\\{1, \\\\ldots, k\\\\}$ do $A$, tak\u017ee podle (6) jich je
  $n^k$. Jednak m\u016f\u017eeme ka\u017edou neuspo\u0159\u00e1danou $k$-tici uspo\u0159\u00e1dat
  $k!$ r\u016fzn\u00fdmi zp\u016fsoby, co\u017e d\u00e1v\u00e1 $H \\\\cdot k!$ mo\u017enost\u00ed.
  Ob\u011bma zp\u016fsoby mus\u00ed vyj\u00edt tot\u00e9\u017e, tak\u017ee $H \\\\cdot
  k! = n^k$, a tedy $H = \\\\frac{n^k}{k!}$.\\n\\n(11) **Kombina\u010dn\u00ed \u010d\u00edsla**
  (binomick\u00e9 koeficienty) jsou u\u017eite\u010dn\u00e1 zkratka pro pr\u00e1v\u011b
  odvozen\u00fd vztah. Pro \u010d\u00edsla $n, k \\\\geq 0$ zavedeme:\\n\\\\[\\n\\\\binom{n}{k}
  = \\\\frac{n^k}{k!} = \\\\frac{n \\\\cdot (n - 1) \\\\cdot \\\\ldots \\\\cdot (n
  - k + 1)}{1 \\\\cdot 2 \\\\cdot \\\\ldots \\\\cdot k}\\n\\\\]\\nNebo:\\n\\\\[\\n\\\\binom{n}{k}
  = \\\\frac{n!}{k! \\\\cdot (n - k)!}\\n\\\\]\\nZavedeme-li nav\u00edc n\u00e1sleduj\u00edc\u00ed
  zna\u010den\u00ed pro mno\u017einu v\u0161ech $k$-prvkov\u00fdch podmno\u017ein:\\n\\\\[\\n\\\\binom{N}{k}
  = \\\\{A \\\\subseteq N \\\\mid |A| = k\\\\}\\n\\\\]\\ndostaneme stru\u010dn\u00fd
  z\u00e1pis vztahu (10):\\n\\\\[\\n\\\\left|\\\\binom{N}{k}\\\\right| = \\\\binom{n}{k}\\n\\\\]\\n\\n(12)
  Vlastnosti kombina\u010dn\u00edch \u010d\u00edsel:\\n\\n- \\\\( \\\\binom{0}{0}
  = 1 \\\\) \u2026 pr\u00e1zdn\u00e1 podmno\u017eina je jen jedna\\n- \\\\( \\\\binom{n}{n}
  = 1 \\\\) \u2026 \u201epln\u00e1\u201c podmno\u017eina je tak\u00e9 jedna\\n- \\\\(
  \\\\binom{n}{1} = n \\\\) \u2026 jednoprvkov\u00fdch je tolik, co prvk\u016f\\n-
  \\\\( \\\\binom{n}{n-1} = n \\\\) \u2026 \\\\((n-1)\\\\)-prvkov\u00e1 podmno\u017eina
  je ur\u010dena t\u00edm, kter\u00fd jeden prvek v n\u00ed chyb\u00ed\\n- \\\\( \\\\binom{n}{n-k}
  = \\\\binom{n}{k} \\\\) \u2026 obecn\u011b \\\\((n-k)\\\\)-prvkov\u00e1 podmno\u017eina
  je ur\u010dena t\u00edm, kter\u00fdch \\\\(k\\\\) prvk\u016f v n\u00ed nen\u00ed\\n-
  \\\\( \\\\sum_{k=0}^{n} \\\\binom{n}{k} = 2^n \\\\) \u2026 roz\u0159\u00eddili jsme
  v\u0161echny podmno\u017einy \\\\(n\\\\)-prvkov\u00e9 mno\u017einy podle velikosti\\n\\n(13)
  Charakteristick\u00e9 funkce \\\\(k\\\\)-prvkov\u00fdch podmno\u017ein mno\u017einy
  \\\\([n]\\\\) vypadaj\u00ed tak, \u017ee pr\u00e1v\u011b \\\\(k\\\\) prvk\u016fm
  p\u0159i\u0159azuj\u00ed jedni\u010dku a zbyl\u00fdm \\\\(n-k\\\\) nulu. Odpov\u00eddaj\u00ed
  tedy posloupnostem \\\\(n\\\\) nul a jedni\u010dek s pr\u00e1v\u011b \\\\(k\\\\)
  jedni\u010dkami.\\n\\n(14) Sou\u010det kombina\u010dn\u00edch \u010d\u00edsel pro
  \\\\(n, k \\\\geq 1\\\\):\\n\\n\\\\[\\n\\\\binom{n}{k} = \\\\binom{n-1}{k} + \\\\binom{n-1}{k-1}\\n\\\\]\\n\\nLev\u00e1
  strana po\u010d\u00edt\u00e1 \\\\(k\\\\)-prvkov\u00e9 podmno\u017einy n\u011bjak\u00e9
  \\\\(n\\\\)-prvkov\u00e9 mno\u017einy \\\\(A\\\\). Zvol\u00edme libovoln\u011b \\\\(a
  \\\\in A\\\\) a rozd\u011bl\u00edme \\\\(k\\\\)-prvkov\u00e9 podmno\u017einy na
  dva druhy: neobsahuj\u00edc\u00ed \\\\(a\\\\) a obsahuj\u00edc\u00ed \\\\(a\\\\).
  T\u011bch prvn\u00edch je \\\\(\\\\binom{n-1}{k}\\\\), proto\u017ee vyb\u00edr\u00e1me
  \\\\(k\\\\)-prvkovou podmno\u017einu ze zbyl\u00fdch \\\\(n-1\\\\) prvk\u016f. Ty
  druh\u00e9 obsahuj\u00ed krom\u011b \\\\(a\\\\) je\u0161t\u011b dal\u0161\u00edch
  \\\\(k-1\\\\) prvk\u016f vybran\u00fdch ze zbyl\u00fdch \\\\(n-1\\\\) prvk\u016f,
  co\u017e lze vybrat \\\\(\\\\binom{n-1}{k-1}\\\\) zp\u016fsoby.\\n\\n(15) Pascal\u016fv
  troj\u00faheln\u00edk \u2013 tabulka kombina\u010dn\u00edch \u010d\u00edsel:\\n\\n\\\\[\\n\\\\begin{array}{cccccc}\\nn
  = 0 & 1 & k = 0 \\\\\\\\\\nn = 1 & 1 & 1 & k = 1 \\\\\\\\\\nn = 2 & 1 & 2 & 1 &
  k = 2 \\\\\\\\\\nn = 3 & 1 & 3 & 3 & 1 & k = 3 \\\\\\\\\\nn = 4 & 1 & 4 & 6 & 4
  & 1 & k = 4 \\\\\\\\\\nn = 5 & 1 & 5 & 10 & 10 & 5 & 1 & k = 5 \\\\\\\\\\n\\\\end{array}\\n\\\\]\\n\\nSledujte,
  jak se v Pascalov\u011b troj\u00faheln\u00edku projevuj\u00ed identity (12) a (14).\\n\\n(16)
  **Binomick\u00e1 v\u011bta.** Pro ka\u017ed\u00e9 $x, y \\\\in \\\\mathbb{R}$ a
  $n \\\\in \\\\mathbb{N}$ plat\u00ed:\\n\\n$$ (x + y)^n = \\\\sum_{k=0}^{n} \\\\binom{n}{k}
  x^{n-k} y^k $$\\n\\nRozn\u00e1soben\u00edm sou\u010dinu $(x+y)(x+y)\\\\ldots(x+y)$
  vznikne $2^n$ \u010dlen\u016f. Ka\u017ed\u00fd z nich je sou\u010dinem celkem $n$
  prom\u011bnn\u00fdch $x$ a $y$, tak\u017ee ho m\u016f\u017eeme p\u0159erovnat na
  $x^{n-k} y^k$ pro n\u011bjak\u00e9 $k$. Stejn\u00fd v\u00fdraz vznikne p\u0159erovn\u00e1n\u00edm
  ze v\u0161ech \u010dlen\u016f, kter\u00e9 z pr\u00e1v\u011b $k$ z\u00e1vorek vybraly
  $y$ a ze zbyl\u00fdch vybraly $x$. To lze prov\u00e9st $\\\\binom{n}{k}$ zp\u016fsoby.\\n\\n(17)
  **Aplikace binomick\u00e9 v\u011bty:**\\n\\n- Pro $x = y = 1$ dostaneme: $(1 + 1)^n
  = \\\\sum_{k=0}^{n} \\\\binom{n}{k}$.\\n  Tak\u017ee sou\u010det $n$-t\u00e9ho \u0159\u00e1dku
  Pascalova troj\u00faheln\u00edku je $2^n$. To u\u017e zn\u00e1me z (12).\\n\\n-
  Pro $x = 1$, $y = -1$ dostaneme: $(1 - 1)^n = \\\\sum_{k=0}^{n} \\\\binom{n}{k}
  \\\\cdot (-1)^k$.\\n  Proto $0 = \\\\binom{n}{0} - \\\\binom{n}{1} + \\\\binom{n}{2}
  - \\\\binom{n}{3} + \\\\ldots - \\\\ldots$, tak\u017ee sud\u00fdch a lich\u00fdch
  podmno\u017ein je stejn\u011b \u2013 m\u00e1me jin\u00fd d\u016fkaz tvrzen\u00ed
  (5). (Mimochodem, kde jsme pot\u0159ebovali p\u0159edpoklad $n > 0$, bez kter\u00e9ho
  tvrzen\u00ed neplat\u00ed?)\\n\\n- P\u0159ijdete na n\u011bjak\u00e9 dal\u0161\u00ed
  zaj\u00edmav\u00e9 dosazen\u00ed?\"", "\"Z\u00e1pis z 25. ve\u0159ejn\u00e9ho zased\u00e1n\u00ed
  zastupitelstva obce Hlinka ze dne 16.04.2018.\\n\\n1) Zah\u00e1jen\u00ed. Starosta
  obce p\u0159iv\u00edtal p\u0159\u00edtomn\u00e9 a zah\u00e1jil 25. ve\u0159ejn\u00e9
  zased\u00e1n\u00ed. P\u0159\u00edtomn\u00ed jsou: Marcel Chovan\u010d\u00e1k, Jaroslav
  P\u00e1linek, Helena Ba\u010dovsk\u00e1, Stanislav Kubala, Milena Hebnarov\u00e1.
  Starosta konstatoval, \u017ee se zastupitelstvo se\u0161lo v po\u010dtu 5 \u010dlen\u016f
  a je usn\u00e1\u0161en\u00ed schopn\u00e9. Pot\u00e9 p\u0159e\u010detl program zased\u00e1n\u00ed
  a nechal hlasovat o schv\u00e1len\u00ed \u010di dopln\u011bn\u00ed tohoto programu.\\n\\nProgram
  zased\u00e1n\u00ed:\\n1) Zah\u00e1jen\u00ed.\\n2) Volba navrhovatele a ov\u011b\u0159ovatele
  z\u00e1pisu.\\n3) Ur\u010den\u00ed zapisovatele.\\n4) Kontrola usnesen\u00ed.\\n5)
  Rozpo\u010dtov\u00e9 opat\u0159en\u00ed za posledn\u00ed obdob\u00ed.\\n6) Dohody
  pro zastupitele za proveden\u00ed inventur za rok 2017\\n7) Smlouva s Povod\u00ed
  Odry o prodeji pozemku parc.\u010d. 1194/4 a parc.\u010d.9\\n8) V\u0158 na d\u011btsk\u00e9
  h\u0159i\u0161t\u011b v M\u0160, hodnot\u00edc\u00ed komise a podm\u00ednky, seznam
  osloven\u00fdch firem\\n9) Z\u00e1m\u011br na Opravu cesty kolem mal\u00e9ho d\u011btsk\u00e9ho
  h\u0159i\u0161t\u011b a vjezd\u016f v kolonce\\n10) Schv\u00e1len\u00ed \u00fa\u010detn\u00ed
  z\u00e1v\u011brky obce za rok 2017\\n11) Z\u00e1m\u011br na opravu prostranstv\u00ed
  p\u0159ed prodejnou Heda\\n12) Z\u00e1m\u011br na opravu studny a jej\u00edho okol\u00ed
  u bytov\u00e9ho domu \u010d.54\\n13) Z\u00e1m\u011br na umyt\u00ed fas\u00e1dy bytov\u00e9ho
  domu \u010d.52-54\\n14) Z\u00e1m\u011br na vybudov\u00e1n\u00ed chodn\u00edku kolem
  bytov\u00e9ho domu \u010d.50-51\\n15) Schv\u00e1len\u00ed z\u00e1v\u011bre\u010dn\u00e9ho
  \u00fa\u010dtu obce za rok 2017\\n16) Z\u00e1m\u011br o odkupu pozemku \u010d. 1510/1\\n17)
  Dohoda o \u00faprav\u011b smlouvy o sdru\u017een\u00fdch slu\u017eb\u00e1ch dod\u00e1vky
  elekt\u0159iny s \u010cEZ Prodej a.s.\\n18) Stanovisko Ing. Josefa Vendolsk\u00e9ho
  k nav\u00fd\u0161en\u00ed pron\u00e1jmu pozemku v obo\u0159e\\n19) Cenov\u00e1 nab\u00eddka
  obce na odkup parc.\u010d.St.50 v\u010detn\u011b nemovitosti \u010d.p.3.\\n20) \u017dadost
  o finan\u010dn\u00ed dar od \u010cesk\u00e9ho svazu v\u010dela\u0159\u016f o.s.
  Z\u00e1kladn\u00ed organizace T\u0159eme\u0161n\u00e1\\n21) Zm\u011bna poji\u0161\u0165ovny
  prost\u0159ednictv\u00edm zprost\u0159edkovatele VPV Bohemia s.r.o.\\n22) R\u016fzn\u00e9\\n23)
  Diskuse\\n\\nUsnesen\u00ed \u010d.25/1: Zastupitelstvo obce schvaluje program zased\u00e1n\u00ed
  bez dal\u0161\u00edho dopln\u011bn\u00ed.\\nHlasov\u00e1n\u00ed: pro: 5 proti: zdr\u017eel
