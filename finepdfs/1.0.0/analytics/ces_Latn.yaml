  nezav\u00edtali.\\n\\nJi\u0159\u00ed Ka\u0148a\"", "\"Didaktick\u00fd manu\u00e1l
  v\u00fdukov\u00e9 p\u0159\u00edpadov\u00e9 studie\\n\\nTEACHING NOTE\\n\\n2. Synopse
  v\u00fdukov\u00e9 p\u0159\u00edpadov\u00e9 studie\\n\\nP\u0159\u00edpadov\u00e1
  studie se zab\u00fdv\u00e1 spole\u010dnost\u00ed LESS & TIMBER, kter\u00e1 je v\u00fdznamn\u00e9m
  subjektem na \u010desk\u00e9m, ale i evropsk\u00e9m d\u0159evozpracuj\u00edc\u00edm
  trhu. V sou\u010dasn\u00e9 dob\u011b je spole\u010dnost nejmodern\u011bj\u0161\u00edm
  z\u00e1vodem na zpracov\u00e1n\u00ed p\u0159es\u00edlen\u00e9ho d\u0159eva nejen
  v \u010cR, ale i v cel\u00e9 Evrop\u011b.  Uv\u00e1d\u00ed tr\u017en\u00ed, legislativn\u00ed,
  mezin\u00e1rodn\u00ed, ale v\u00fdvojov\u00e1 specifika podnik\u00e1n\u00ed v oblasti
  d\u0159eva\u0159stv\u00ed. St\u011b\u017eejn\u00edm zdrojem informac\u00ed pro tvorbu
  v\u00fdukov\u00e9 p\u0159\u00edpadov\u00e9 studie byl rozhovor s \u0159editelem
  spole\u010dnosti a v\u00fdzkumn\u00e1 p\u0159\u00edpadov\u00e1 studie t\u00e9to
  spole\u010dnosti. P\u0159\u00edpadov\u00e1 studie se \u010dlen\u00ed do \u010dty\u0159
  z\u00e1kladn\u00edch \u010d\u00e1st\u00ed, kter\u00fdmi jsou p\u0159edstaven\u00ed
  firmy, p\u0159\u00edstup k p\u0159\u00edle\u017eitostem, zaveden\u00ed nov\u00fdch
  a inovativn\u00edch produkt\u016f a p\u016fsoben\u00ed na mezin\u00e1rodn\u00edch
  trz\u00edch a dopad covidu-19. Tyto \u010d\u00e1sti p\u0159edstavuj\u00ed i hlavn\u00ed
  odborn\u00e9 zam\u011b\u0159en\u00ed p\u0159\u00edpadov\u00e9 studie. Ka\u017ed\u00e1
  \u010d\u00e1st je zakon\u010dena ot\u00e1zkami k vypracov\u00e1n\u00ed a diskuzi.\\n\\n3.
  Kl\u00ed\u010dov\u00e1 slova\\n\\nd\u0159evozpracuj\u00edc\u00ed pr\u016fmysl, p\u0159es\u00edlen\u00e9
  d\u0159evo, pila\u0159sk\u00e9 produkty, lepen\u00fd hranol\\n\\n4. C\u00edlov\u00e9
  skupiny\\n\\nP\u0159\u00edpadovou studii lze vyu\u017e\u00edt ve vysoko\u0161kolsk\u00e9m
  studijn\u00edch programech jak na bakal\u00e1\u0159sk\u00e9m, tak i magistersk\u00e9m
  stupni studia. Vhodn\u00fdm studijn\u00edm programem pro vyu\u017eit\u00ed p\u0159\u00edpadov\u00e9
  studie je program podnik\u00e1n\u00ed a management, pop\u0159. programy bl\u00edzk\u00e9.
  Mezi konkr\u00e9tn\u00ed p\u0159edm\u011bty, ve kter\u00fdch je mo\u017en\u00e9
  p\u0159\u00edpadovou studii aplikovat, lze uv\u00e9st Marketing a marketingov\u00e9
  komunikace, Podnik\u00e1n\u00ed a podnik, Mal\u00e9 a st\u0159edn\u00ed podnik\u00e1n\u00ed
  \u010di Inova\u010dn\u00ed podnik\u00e1n\u00ed.\\n\\nJe vhodn\u00e9, pokud studenti
  \u0159e\u0161\u00edc\u00ed p\u0159\u00edpadovou studii ji\u017e maj\u00ed z\u00e1kladn\u00ed
  znalosti o podnik\u00e1n\u00ed, tr\u017en\u00edch p\u0159\u00edle\u017eitostech
  a inovac\u00edch.\\n\\n5. V\u00fdukov\u00e9 c\u00edle, kl\u00ed\u010dov\u00e9 probl\u00e9my
  a ot\u00e1zky\\n\\nStudenti se p\u0159i pr\u00e1ci s v\u00fdukovou p\u0159\u00edpadovou
  studi\u00ed sezn\u00e1m\u00ed se specifiky podnik\u00e1n\u00ed v oblasti d\u0159evozpracuj\u00edc\u00edho
  pr\u016fmyslu. Hlavn\u00edm v\u00fdukov\u00fdm c\u00edlem p\u0159\u00edpadov\u00e9
  studie je na konkr\u00e9tn\u00edm p\u0159\u00edkladu aplikovat znalosti podnik\u00e1n\u00ed,
  tr\u017en\u00edch p\u0159\u00edle\u017eitost\u00ed a inovac\u00ed. Mezi dal\u0161\u00ed
  v\u00fdukov\u00e9 c\u00edle pat\u0159\u00ed rozvinout schopnost kritick\u00e9ho
  a interdisciplin\u00e1rn\u00edho my\u0161len\u00ed, podpo\u0159it argumenta\u010dn\u00ed
  a komunika\u010dn\u00ed dovednosti a schopnost prezentovat a obh\u00e1jit sv\u00e1
  stanoviska.\\n\\nMezi kl\u00ed\u010dov\u00e9 ot\u00e1zky, kter\u00e9 se student\u016fm
  p\u0159edkl\u00e1daj\u00ed k \u0159e\u0161en\u00ed, pat\u0159\u00ed zhodnocen\u00ed
  toho, jak spole\u010dnost p\u0159istupuje k p\u0159\u00edle\u017eitostem a inovac\u00edm,
  a formulov\u00e1n\u00ed n\u00e1vrh\u016f p\u0159\u00edle\u017eitost\u00ed a inovac\u00ed,
  na kter\u00e9 by se mohla spole\u010dnost zam\u011b\u0159it. Dal\u0161\u00ed kl\u00ed\u010dovou
  ot\u00e1zkou je, jak by spole\u010dnost mohla pos\u00edlit sv\u00e9 mezin\u00e1rodn\u00ed
  p\u016fsoben\u00ed.\\n\\n6. U\u010debn\u00ed strategie\\n\\nPro aplikaci p\u0159\u00edpadov\u00e9
  studie se jev\u00ed jako vhodn\u00e9 se jev\u00ed diskuzn\u00ed skupiny a diskuze.\\n\\nJe
  vhodn\u00e9 prezentovat a diskutovat \u0159e\u0161en\u00ed p\u0159\u00edpadov\u00e9
  studie etapovit\u011b v r\u00e1mci jej\u00edch jednotliv\u00fdch \u010d\u00e1st\u00ed.\\n\\nStudenti
  nejprve individu\u00e1ln\u011b \u010dtou p\u0159\u00edpadovou studii, analyzuj\u00ed
  ji a vytv\u00e1\u0159ej\u00ed s k n\u00ed pozn\u00e1mky. N\u00e1sledn\u011b jsou
  rozd\u011bleni do d\u00edl\u010d\u00edch skupin, v jejich r\u00e1mci diskutuj\u00ed
  zji\u0161t\u011bn\u00ed z individu\u00e1ln\u00ed p\u0159\u00edpravy studie a n\u00e1sledn\u011b
  \u0159e\u0161\u00ed identifikovan\u00e9 probl\u00e9my a ve studii naformulovan\u00e9
  ot\u00e1zky. N\u00e1sledn\u011b prost\u0159ednictv\u00edm sv\u00fdch z\u00e1stupc\u016f
  jednotliv\u00e9 skupiny prezentuj\u00ed sv\u00e1 \u0159e\u0161en\u00ed a prob\u00edh\u00e1
  diskuze a komparace mezi skupinami.\\n\\n7. Ot\u00e1zky a \u00fakoly (ot\u00e1zky
  k diskusi pro studenty \u0159e\u0161\u00edc\u00ed p\u0159\u00edpad)\\n\\nP\u0159edstaven\u00ed
  firmy\\n\\n- Jak lze popsat charakterizovat dodavatelsk\u00e9 vztahy spole\u010dnosti?
  Jak\u00e9 hlavn\u00ed faktory tento vztah ovliv\u0148uj\u00ed?\\n- Jak\u00e9 jsou
  v\u00fdhody a nev\u00fdhody d\u0159evozpracuj\u00edc\u00edho trhu z pohledu trhu
  a p\u0159\u00edstupu k z\u00e1kazn\u00edk\u016fm?\\n\\n- M\u016f\u017ee m\u00edra
  zadlu\u017een\u00ed ohrozit i velmi \u00fasp\u011b\u0161nou firmu a pro\u010d?\\n-
  Jak\u00e9 ekonomick\u00e9, marketingov\u00e9 \u010di soci\u00e1ln\u00ed v\u00fdhody
  lze identifikovat v ekologick\u00e9m p\u0159\u00edstupu spole\u010dnosti ve vyu\u017eit\u00ed
  v\u00fdrobn\u00edho odpadu?\\n\\nP\u0159\u00edstup k p\u0159\u00edle\u017eitostem\\n\\n-
  Jak hodnot\u00edte aktivity spole\u010dnosti v oblasti garance kvality a spolehlivosti?\\n-
  Je dle va\u0161eho n\u00e1zoru hled\u00e1n\u00ed a formulace p\u0159\u00edle\u017eitost\u00ed
  v\u00fdhradn\u011b v rukou managementu spole\u010dnosti? Kdo dal\u0161\u00ed p\u0159\u00edpadn\u011b
  participuje?\\n- Jak\u00e9 dal\u0161\u00ed aktivity byste spole\u010dnosti doporu\u010dili?\\n-
  Ve kter\u00fdch postupech (p\u0159\u00edstupech) spole\u010dnosti spat\u0159ujete
  prvky kauz\u00e1ln\u00edho p\u0159\u00edstupu a ve kter\u00fdch naopak prvky efektua\u010dn\u00edho
  p\u0159\u00edstupu?\\n\\nZaveden\u00ed nov\u00fdch a inovativn\u00edch produkt\u016f\\n\\n-
  Jak hodnot\u00edte inova\u010dn\u00ed procesy ve spole\u010dnosti na p\u0159\u00edkladech
  uveden\u00fdch v textu studie?\\n- Jak\u00e1 jsou omezen\u00ed a mo\u017enosti inovac\u00ed
  tradi\u010dn\u00ed obor\u016f podnik\u00e1n\u00ed, mezi kter\u00e9 d\u0159evozpracuj\u00edc\u00ed
  pr\u016fmysl m\u016f\u017eeme zahrnout?\\n- Pova\u017eujete vyu\u017eit\u00ed modern\u00edch
  marketingov\u00fdch n\u00e1stroj\u016f jako v\u00fdznamn\u00fd na B2B trz\u00edch?
  Pro\u010d?\\n- Jak\u00e9 p\u0159ek\u00e1\u017eky mohou b\u00fdt d\u016fvodem neefektivit
  zapojen\u00ed spole\u010dnosti do B2C trh\u016f?\\n- Ve kter\u00fdch postupech spole\u010dnosti
  spat\u0159ujete prvky kauz\u00e1ln\u00edho p\u0159\u00edstupu a ve kter\u00fdch
  naopak prvky efektua\u010dn\u00edho p\u0159\u00edstupu?\\n\\nP\u016fsoben\u00ed
  na mezin\u00e1rodn\u00edch trz\u00edch a dopad covidu-19\\n\\n- Vyu\u017e\u00edv\u00e1
  spole\u010dnost aktivn\u011b modern\u00ed marketingov\u00e9 n\u00e1stroje?\\n- Zhodno\u0165te
  mo\u017enosti a omezen\u00ed vstupu spole\u010dnosti LESS & TIMBER na zahrani\u010dn\u00ed
  trhy?\\n- Jak hodnot\u00edte dopady epidemick\u00e9 situace na d\u0159eva\u0159sk\u00fd
  pr\u016fmysl a konkr\u00e9tn\u011b spole\u010dnost LESS & TIMBER?\\n- Jak\u00e1
  opat\u0159en\u00ed mohla spole\u010dnost p\u0159ijmout pro minimalizaci negativn\u00edch
