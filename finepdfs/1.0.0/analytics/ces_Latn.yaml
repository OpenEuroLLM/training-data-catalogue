  A MIL\u00cd SOUSED\u00c9,\\n\\nza\u010d\u00edn\u00e1 advent, obdob\u00ed, kdy d\u011bti
  p\u00ed\u0161\u00ed sv\u00e1 p\u0159\u00e1n\u00ed Je\u017e\u00ed\u0161kovi a ulicemi
  se nesou melodie koled. Proto mi hned v \u00favodu dovolte, abych v\u00e1m za sebe
  i za sv\u00e9 kolegy pop\u0159\u00e1l p\u0159\u00edjemn\u00e9 pro\u017eit\u00ed
  sv\u00e1tk\u016f.\\n\\nJedn\u00edm dechem z\u00e1rove\u0148 p\u0159id\u00e1v\u00e1m
  pozv\u00e1n\u00ed na v\u00e1no\u010dn\u00ed spole\u010densk\u00e9 a kulturn\u00ed
  akce konan\u00e9 pod z\u00e1\u0161titou na\u0161\u00ed m\u011bstsk\u00e9 \u010d\u00e1sti.\\n\\nV\u00e1noce
  na Des\u00edtce budou \u0161t\u011bdr\u00e9 a bohat\u00e9! M\u016f\u017eete se t\u011b\u0161it
  na tradi\u010dn\u00ed rozsv\u011bcov\u00e1n\u00ed nazdoben\u00fdch stromk\u016f.
  Ten hlavn\u00ed, obklopen\u00fd trhy, najdete na n\u00e1m\u011bst\u00ed Svatojana
  \u010cecha, ale v ka\u017ed\u00e9 \u010dtvrti se rozza\u0159\u00ed i lok\u00e1ln\u00ed
  stromy a na Kub\u00e1n\u0161k\u00e9m n\u00e1m\u011bst\u00ed budou tradi\u010dn\u011b
  stromky pat\u0159\u00edc\u00ed mate\u0159sk\u00fdm a z\u00e1kladn\u00edm \u0161kol\u00e1m
  z Des\u00edtky. Atmosf\u00e9ru umocn\u00ed ochutn\u00e1v\u00e1n\u00ed tradi\u010dn\u00ed
  ryb\u00ed pol\u00e9vky a po sv\u00e1tc\u00edch nebude chyb\u011bt ani bruslen\u00ed.
  Kompletn\u00ed program najdete na n\u00e1sleduj\u00edc\u00edch str\u00e1nk\u00e1ch
  nebo na webu m\u011bstsk\u00e9 \u010d\u00e1sti. Tak p\u0159ij\u010fte, srde\u010dn\u011b
  v\u00e1s zvu.\\n\\nV prosinci tak\u00e9 vrchol\u00ed st\u011bhov\u00e1n\u00ed na\u0161eho
  \u00fa\u0159adu. Des\u00edtka tak dostala p\u0159ed\u010dasn\u00fd v\u00e1no\u010dn\u00ed
  d\u00e1rek v podob\u011b d\u016fstojn\u00fdch prostor ve Vinohradsk\u00e9 169. Cht\u011bl
  bych touto cestou pod\u011bkovat ka\u017ed\u00e9mu, kdo se na st\u011bhov\u00e1n\u00ed
  pod\u00edlel, a v\u00e1m, ob\u010dan\u016fm, d\u011bkuji za trp\u011blivost. P\u0159esun
  byl logisticky i organiza\u010dn\u011b n\u00e1ro\u010dn\u00fd, nicm\u00e9n\u011b
  u\u017e s\u00eddlime v nov\u00e9m. Na\u0161 z\u00e1vazek nenechat starou budovu
  ve Vr\u0161ovick\u00e9 ladem trv\u00e1, a a\u017e budeme zn\u00e1t v\u00fdsledky
  ekonomick\u00e9 anal\u00fdzy, kter\u00e1 n\u00e1m napov\u00ed, jak s budovou d\u00e1le
  nalozit, sezn\u00e1m\u00edme v\u00e1s s nimi.\\n\\nVedle bl\u00ed\u017e\u00edc\u00edch
  se sv\u00e1tk\u016f a \u00fasp\u011b\u0161n\u011b zavr\u0161en\u00e9ho st\u011bhov\u00e1n\u00ed
  bych cht\u011bl vyzdvihnout je\u0161t\u011b jednu d\u016fle\u017eitou v\u011bc,
  kter\u00e1 v tom informa\u010dn\u00edm \u0161umu b\u011b\u017en\u00fdch dn\u00ed
  trochu zapadla. M\u00e1me na mysli nov\u011b nav\u00e1zanou spolupr\u00e1ci s Fakultn\u00ed
  nemocnic\u00ed Kr\u00e1lovsk\u00e9 Vinohrady. Memorandum, t\u00fdkaj\u00edc\u00ed
  se nap\u0159\u00edklad prevence, p\u00e9\u010de o seniory, paliativn\u00ed p\u00e9\u010de
  a soci\u00e1ln\u011b-zdravotn\u00edho pomez\u00ed, jsme podepsali s \u0159editelem
  t\u00e9to \u0161pi\u010dkov\u00e9 instituce MUDr. Janem Votavou. Moc se t\u011b\u0161\u00edm
  na dal\u0161\u00ed kroky a akce, kter\u00e9 Praha 10 ve spolupr\u00e1ci s nemocnic\u00ed
  podnikne.\\n\\nV\u00e1\u017een\u00ed a mil\u00ed soused\u00e9, rok 2023 byl v mnoha
  ohledech n\u00e1ro\u010dn\u00fd. V\u0161echny n\u00e1s potr\u00e1pilo zdr\u017eov\u00e1n\u00ed,
  vzr\u016fstaj\u00edc\u00ed nejistota ve sv\u011bt\u011b a mnoho dal\u0161\u00edch
  negativn\u00edch zpr\u00e1v. Pevn\u011b v\u011b\u0159\u00edm, \u017ee ten nadch\u00e1zej\u00edc\u00ed
  bude lep\u0161\u00ed. S n\u00edm ur\u010dit\u011b p\u0159ijdou nov\u00e9 v\u00fdzvy,
  ale i mo\u017enosti. P\u0159eji v\u00e1m odvahu je p\u0159ijmout, s\u00edlu je p\u0159ekonat
  a moudrost je spr\u00e1vn\u011b vyu\u017e\u00edt.\\n\\nA hlavn\u011b v\u00e1m p\u0159eji
  poklidn\u00e9 sv\u00e1tky.\\n\\n\u2014 Ing. arch. Martin Valovi\u010d,\\nstarosta
