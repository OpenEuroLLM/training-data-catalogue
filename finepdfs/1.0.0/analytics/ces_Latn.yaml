  Laplaceova transformace .................................. 20\\n      3.2.1 Popis
  Laplaceovy transformace ........................ 20\\n      3.2.2 P\u0159\u00edklad,
  Laplaceova transformace ..................... 21\\n\\nKapitola 1\\n\\nZ\u00e1kladn\u00ed
  definice\\n\\n1.1 Zpo\u017ed\u011bn\u00ed\\n\\nZpo\u017ed\u011bn\u00edm $\\\\tau(t)$
  je obecn\u011b funkce, kter\u00e1 v praxi nej\u010dast\u011bji vyjad\u0159uje \u010dasovou
  prodlevu pot\u0159ebnou k zapo\u010det\u00ed d\u011bje \u010di reakce. Zpo\u017ed\u011bn\u00ed
  m\u016f\u017eeme d\u011blit do n\u011bkolika druh\u016f. P\u0159\u00edklady r\u016fzn\u00fdch
  druh\u016f zpo\u017ed\u011bn\u00ed jsou uvedeny n\u00ed\u017ee.\\n\\nSe zpo\u017ed\u011bn\u00edm
  se m\u016f\u017eeme setkat nap\u0159\u00edklad u r\u016fstu mikroorganism\u016f,
  reprodukce vy\u0161\u0161\u00edch organism\u016f, chemick\u00fdch reakc\u00ed nebo
  t\u0159eba u reakce imunitn\u00edho syst\u00e9mu \u017eivo\u010dicha na infekci.
  Ke ka\u017ed\u00e9mu druhu zpo\u017ed\u011bn\u00ed je zde uveden\u00fd re\u00e1ln\u00fd
  p\u0159\u00edklad u\u017eit\u00ed diferenci\u00e1ln\u00ed rovnice (p\u0159\u00edpadn\u011b
  syst\u00e9mu diferenci\u00e1ln\u00edch rovnic) v praxi, dokonce v\u017edy v oboru
  biologie.\\n\\n1.1.1 Konstantn\u00ed zpo\u017ed\u011bn\u00ed\\n\\nJe takov\u00e9
  zpo\u017ed\u011bn\u00ed, kde $\\\\tau(t) = \\\\tau = \\\\text{konst}$. Diferenci\u00e1ln\u00ed
  rovnici s konstantn\u00edm zpo\u017ed\u011bn\u00edm pak lze zapsat jako:\\n\\n$$x''(t)
  = f(t, x(t), x(t - \\\\tau)), \\\\quad \\\\tau > 0,$$\\n\\n(1.1)\\n\\nkde $t \\\\in
  \\\\mathbb{R}$, $x(t)$ je hledan\u00e1 funkce, $x : \\\\mathbb{R} \\\\to \\\\mathbb{R}$,
  $x(t - \\\\tau)$ hledan\u00e1 funkce se zpo\u017ed\u011bn\u00fdm argumentem a $f$
  funkce z $\\\\mathbb{R}^3$ do $\\\\mathbb{R}$.\\n\\nSyst\u00e9m rovnic s konstantn\u00edm
  zpo\u017ed\u011bn\u00edm pak zapisujeme jako:\\n\\n$$\\\\dot{x}(t) = f(t, x(t),
  x(t - \\\\tau)), \\\\quad \\\\tau > 0,$$\\n\\n(1.2)\\n\\nkde \\\\( \\\\mathbf{x}(t)
  = (x_1(t), x_2(t), \\\\ldots, x_n(t)) \\\\), \\\\( x_i : \\\\mathbb{R} \\\\to \\\\mathbb{R}
  \\\\), \\\\( i = 1, 2, \\\\ldots, n \\\\), \\\\( n \\\\in \\\\mathbb{N} \\\\), \\\\(
  \\\\mathbf{f} : \\\\mathbb{R}^3 \\\\to \\\\mathbb{R}^n \\\\).\\n\\n**P\u0159\u00edklad**\\n\\nRe\u00e1ln\u00fdm
  p\u0159\u00edkladem diferenci\u00e1ln\u00ed rovnice s konstantn\u00edm zpo\u017ed\u011bn\u00edm
  je Mackey-Glass\u016fv model krvetvorby (viz [6]):\\n\\n\\\\[\\nx''(t) = \\\\beta
  \\\\frac{x(t - \\\\tau)}{1 + x(t - \\\\tau)^n} - \\\\gamma x(t),\\n\\\\]\\n\\nkde
  byly parametry \\\\( \\\\beta, \\\\gamma \\\\) a \\\\( n \\\\) zvoleny tak, aby
  odpov\u00eddaly experiment\u00e1ln\u00edm dat\u016fm (podle Mackeyho a Glasse nap\u0159:
  \\\\( \\\\beta = 0, 2, \\\\gamma = 0, 1 \\\\) a \\\\( n = 10 \\\\)), a kde \\\\(
  \\\\tau \\\\) vyjad\u0159uje \u010dasov\u00e9 zpo\u017ed\u011bn\u00ed mezi po\u010d\u00e1tkem
  bun\u011b\u010dn\u00e9 produkce v kostn\u00ed d\u0159eni a kone\u010dn\u00fdm uvoln\u011bn\u00edm
  zral\u00fdch bun\u011bk do krevn\u00edho ob\u011bhu.\\n\\n### 1.1.2 Diskr\u00e9tn\u00ed
  zpo\u017ed\u011bn\u00ed\\n\\nSyst\u00e9m rovnic s v\u00edce konstantn\u00edmi zpo\u017ed\u011bn\u00edmi
  naz\u00fdv\u00e1me syst\u00e9m s diskr\u00e9tn\u00edm zpo\u017ed\u011bn\u00edm.
  Zapisujeme jej ve tvaru:\\n\\n\\\\[\\n\\\\mathbf{x}''(t) = \\\\mathbf{f}(t, \\\\mathbf{x}(t),
  \\\\mathbf{x}(t - \\\\tau_1), \\\\mathbf{x}(t - \\\\tau_2), \\\\ldots, \\\\mathbf{x}(t
  - \\\\tau_n)),\\n\\\\quad 0 < \\\\tau_1 \\\\leq \\\\tau_2 \\\\leq \\\\cdots \\\\leq
  \\\\tau_n,\\n\\\\]\\n\\nkde \\\\( \\\\mathbf{x}(t) = (x_1(t), x_2(t), \\\\ldots,
  x_n(t)) \\\\), \\\\( x_i : \\\\mathbb{R} \\\\to \\\\mathbb{R} \\\\), \\\\( i = 1,
  2, \\\\ldots, n \\\\), \\\\( n \\\\in \\\\mathbb{N} \\\\), \\\\( \\\\mathbf{f} :
  \\\\mathbb{R}^{n+2} \\\\to \\\\mathbb{R}^n \\\\).\\n\\n**P\u0159\u00edklad**\\n\\nP\u0159\u00edklad
  nalezneme v modelov\u00e1n\u00ed cirkadi\u00e1nn\u00edho rytmu savc\u016f, tedy
  endogenn\u00edho (vnit\u0159n\u00edho) rytmu, kter\u00fd ovliv\u0148uje zhruba dvaceti\u010dty\u0159hodinov\u00fd
  cyklus aktivity a pasivity organismu. Tento rytmus je modelov\u00e1n pomoc\u00ed
  syst\u00e9mu rovnic (viz [8]):\\n\\n\\\\[\\nB''(t) = \\\\frac{v_s k_1^{n_1}}{k_1^{n_1}
  + R(t - \\\\tau_3)^{n_1}} + \\\\frac{v_d P_f(t - \\\\tau_2)}{k_2 + P_f(t - \\\\tau_2)}
  - k_3 B,\\n\\\\]\\n\\\\[\\nP''(t) = \\\\frac{v_m k_5^{n_2}}{k_5^{n_2} + P_f(t -
  \\\\tau_2)^{n_2}} + \\\\frac{v_p B(t - \\\\tau_1)}{k_4 + B(t - \\\\tau_1)} - k_6
  P,\\n\\\\]\\n\\\\[\\nR''(t) = \\\\frac{v_r k_7^{n_3}}{k_7^{n_3} + P_f(t - \\\\tau_2)^{n_3}}
  + \\\\frac{v_c B(t - \\\\tau_1)}{k_8 + B(t - \\\\tau_1)} - k_9 R,\\n\\\\]\\n\\nkde
  \\\\( B(t), P(t), R(t) \\\\) vyjad\u0159uj\u00ed koncentraci proteinu BMAL1, komplexu
  CRY-PER a proteinu REV-ERB\\\\( \\\\alpha \\\\) a kde \\\\( P_f \\\\) je voln\u00fd
  komplex PER-CRY, pro kter\u00fd plat\u00ed: \\\\( P_f = P - B \\\\).\\n\\na $P_f
  = 0$ pokud $P < B$, $v_{s,p,r,c,d,m}$ jsou rychlosti synt\u00e9zy b\u00edlkovin,
  $k_{1,2,4,5,7,8}$ jsou Michaelisovy konstanty, $n_{1,2,3}$ jsou Hillovy koeficienty,
  kter\u00e9 charakterizuj\u00ed m\u00edru kooperativnosti represivn\u00edch proces\u016f
  a $k_{3,6,9}$ jsou degrada\u010dn\u00ed konstanty $B$, $P$ a $R$ prvn\u00edho \u0159\u00e1du.\\n\\nHodnota
  $\\\\tau_1$ vyjad\u0159uje zpo\u017ed\u011bn\u00ed vazby od BMAL1 k zah\u00e1jen\u00ed
  synt\u00e9zy proteinu PER-CRY a z\u00e1rove\u0148 od BMAL1 k zah\u00e1jen\u00ed
  synt\u00e9zy proteinu REV-ERB$\\\\alpha$, $\\\\tau_2$ je zpo\u017ed\u011bn\u00ed
  proteinu PER-CRY k aktivaci a potla\u010den\u00ed BMAL1 a REV-ERB$\\\\alpha$ a k
  potla\u010den\u00ed vlastn\u00ed produkce a $\\\\tau_3$ je zpo\u017ed\u011bn\u00ed
  proteinu REV-ERB$\\\\alpha$ k potla\u010den\u00ed produkce BMAL1.\\n\\n### 1.1.3
  Zpo\u017ed\u011bn\u00ed z\u00e1visl\u00e9 na \u010dase\\n\\nRovnici se zpo\u017ed\u011bn\u00edm
  z\u00e1visl\u00fdm na \u010dase zap\u00ed\u0161eme jako:\\n\\n$$x''(t) = f(t, x(t),
  x(t - \\\\tau(t))), \\\\quad \\\\tau(t) \\\\geq 0,$$\\n\\nkde zpo\u017ed\u011bn\u00ed
  $\\\\tau(t)$ je tentokr\u00e1t funkc\u00ed z\u00e1vislou na \u010dase $t$.\\n\\n**P\u0159\u00edklad**\\n\\nTakov\u00e9
  zpo\u017ed\u011bn\u00ed se nap\u0159\u00edklad vyskytuje v rovnic\u00edch modeluj\u00edc\u00edch
  dvoudruhov\u00e9 populace (tzv. model Lotka - Volterra), kter\u00fdm je v\u011bnov\u00e1na
  \u010d\u00e1st 4.2.\\n\\nObecn\u00fd syst\u00e9m t\u011bchto rovnic (viz [7]) pak
  m\u00e1 tvar:\\n\\n$$x''_1(t) = x_1(t)[r_1 - a_{11}x_1(t) - a_{12}x_1(t - \\\\tau_1(t))
  - a_{13}x_2(t - \\\\tau_2(t))],$$\\n\\n$$x''_2(t) = x_2(t)[r_2 - a_{21}x_2(t) -
  a_{22}x_2(t - \\\\tau_3(t)) - a_{23}x_1(t - \\\\tau_4(t))],$$\\n\\nkde $a_{ij} \\\\geq
  0$ pro $i = 1, 2, j = 1, 2, 3$, $r_k \\\\geq 0$ pro $k = 1, 2$ $\\\\tau_l(t) \\\\geq
  0$ pro $l = 1, 2, 3, 4$ jsou spojit\u011b diferencovateln\u00e9 funkce na $(0, +\\\\infty)$
  a $x_m(t)$ pro $m = 1, 2$ vyjad\u0159uje velikost $m$-t\u00e9ho druhu populace v
  \u010dase $t$.\\n\\n### 1.1.4 Distribuovan\u00e9 zpo\u017ed\u011bn\u00ed\\n\\n####
  188.8.131.52 Omezen\u00e9 distribuovan\u00e9 zpo\u017ed\u011bn\u00ed\\n\\nNa rozd\u00edl
  od p\u0159edchoz\u00edch typ\u016f nen\u00ed tento syst\u00e9m z\u00e1visl\u00fd
  na spo\u010detn\u011b mnoha minul\u00fdch stavech, ale je zde nutn\u00e9 zn\u00e1t
  v\u0161echny p\u0159edchoz\u00ed stavy na intervalu $I = \\\\langle t, t - \\\\tau
  \\\\rangle$. Z\\n\\nt\u011bchto p\u0159edchoz\u00edch zpo\u017ed\u011bn\u00ed n\u00e1sledn\u011b
  po\u010d\u00edt\u00e1me v\u00e1\u017een\u00fd pr\u016fm\u011br. Syst\u00e9m rovnic
  s omezen\u00fdm distribuovan\u00fdm zpo\u017ed\u011bn\u00edm m\u00e1 tvar:\\n\\n\\\\[
  \\\\mathbf{x}''(t) = \\\\mathbf{f}(t, \\\\mathbf{x}(t), \\\\int_0^\\\\tau k(s)\\\\mathbf{x}(t-s)ds),
  \\\\quad \\\\infty > \\\\tau > 0, \\\\]  \\n\\n(1.11)\\n\\nkde \\\\( \\\\mathbf{x}(t)
  = (x_1(t), x_2(t), \\\\ldots, x_n(t)) \\\\), \\\\( k(s) \\\\) je v\u00e1hov\u00e1
  funkce a interval \\\\( I \\\\) je zde omezen\u00fd, tedy ud\u00e1losti ve vzd\u00e1len\u00e9
  minulosti nemaj\u00ed na sou\u010dasnost vliv.\\n\\n### 184.108.40.206 Neomezen\u00e9
  distribuovan\u00e9 zpo\u017ed\u011bn\u00ed\\n\\nV tomto p\u0159\u00edpad\u011b nast\u00e1v\u00e1
  zm\u011bna v omezenosti zpo\u017ed\u011bn\u00ed \\\\( \\\\tau \\\\). Syst\u00e9m
  rovnic s neomezen\u00fdm distribuovan\u00fdm zpo\u017ed\u011bn\u00edm m\u00e1 tedy
  tvar:\\n\\n\\\\[ \\\\mathbf{x}''(t) = \\\\mathbf{f}(t, \\\\mathbf{x}(t), \\\\int_0^\\\\infty
  k(s)\\\\mathbf{x}(t-s)ds), \\\\]\\n\\n(1.12)\\n\\nkde \\\\( \\\\mathbf{x}(t) = (x_1(t),
  x_2(t), \\\\ldots, x_n(t)) \\\\), \\\\( k(s) \\\\) je op\u011bt v\u00e1hov\u00e1
  funkce a interval \\\\( I \\\\) je zde neomezen\u00fd, tedy na sou\u010dasnost maj\u00ed
  vliv i ud\u00e1losti ze vzd\u00e1len\u00e9 minulosti.\\n\\n**P\u0159\u00edklad**\\n\\nS
  distribuovan\u00fdm zpo\u017ed\u011bn\u00edm se m\u016f\u017eeme setkat nap\u0159\u00edklad
  p\u0159i modelov\u00e1n\u00ed infekce HIV (viz [9]), kde je syst\u00e9m rovnic zanedb\u00e1vaj\u00edc
  odpov\u011b\u010f adaptivn\u00ed imunity modelov\u00e1n n\u00e1sledovn\u011b:\\n\\n\\\\[\\n\\\\begin{align*}\\nx''(t)
  &= \\\\lambda - \\\\delta x(t) - \\\\beta x(t)v(t), \\\\\\\\\\ny''(t) &= \\\\beta
  \\\\int_0^h f(\\\\tau)e^{-m\\\\tau}x(t-\\\\tau)v(t-\\\\tau)d\\\\tau - ay(t), \\\\\\\\\\nv''(t)
  &= ky(t) - \\\\mu v(t),\\n\\\\end{align*}\\n\\\\]\\n\\n(1.13)  \\n(1.14)  \\n(1.15)\\n\\nkde
  \\\\( x(t) \\\\), \\\\( y(t) \\\\) a \\\\( v(t) \\\\) ozna\u010duj\u00ed koncentraci
  neinfikovan\u00fdch bun\u011bk, infikovan\u00fdch bun\u011bk a voln\u00fdch \u010d\u00e1stic
  viru v \u010dase \\\\( t \\\\).\\n\\nNeinfikovan\u00e9 bu\u0148ky jsou produkov\u00e1ny
  konstantou \\\\( \\\\lambda \\\\), um\u00edraj\u00ed rychlost\u00ed \\\\( \\\\delta
  x \\\\) a jsou infikov\u00e1ny voln\u00fdm virem rychlost\u00ed \\\\( \\\\beta xv
  \\\\).\\n\\nInfikovan\u00e9 bu\u0148ky zanikaj\u00ed rychlost\u00ed \\\\( ay \\\\).\\n\\nVoln\u00e9
  viry jsou produkov\u00e1ny infikovan\u00fdmi bu\u0148kami rychlost\u00ed \\\\( ky
  \\\\) a odum\u00edraj\u00ed rychlost\u00ed \\\\( \\\\mu v \\\\).\\n\\nD\u00e1le
  p\u0159edpokl\u00e1d\u00e1me, \u017ee neinfikovan\u00e9 bu\u0148ky jsou kontaktov\u00e1ny
  \u010d\u00e1sticemi viru v \u010dase \\\\( t - \\\\tau \\\\) a stanou se infikovan\u00fdmi
  v \u010dase \\\\( t \\\\), kde \\\\( \\\\tau \\\\) je n\u00e1hodn\u00e1 veli\u010dina
  s distribu\u010dn\u00edm rozd\u011blen\u00edm\\n\\npravd\u011bpodobnosti a hustotou
  pravd\u011bpodobnosti $f(\\\\tau)$ v intervalu $[0, h]$ a kde $h$ je limes superior
  tohoto zpo\u017ed\u011bn\u00ed. Toto rozd\u011blen\u00ed pravd\u011bpodobnosti uva\u017eujeme
  pro zjednodu\u0161en\u00ed jako kladnou integrovatelnou funkci na $[0, h]$ spl\u0148uj\u00edc\u00ed
  $\\\\int_0^h f(\\\\tau) d\\\\tau = 1$. V\u00fdraz $e^{-m\\\\tau}$ zn\u00e1zor\u0148uje
  pravd\u011bpodobnost p\u0159e\u017eit\u00ed od \u010dasu $t - \\\\tau$ do \u010dasu
  $t$, kde $m$ je rychlost hnut\u00ed bun\u011bk, kter\u00e9 jsou infikovan\u00e9,
  ale je\u0161t\u011b neprodukuj\u00ed viry.\\n\\n### 1.1.5 Dal\u0161\u00ed typy zpo\u017ed\u011bn\u00ed\\n\\nExistuje
  mnoho typ\u016f zpo\u017ed\u011bn\u00ed, kter\u00e1 v p\u0159edchoz\u00edm v\u00fd\u010dtu
  nejsou zahrnuta a samoz\u0159ejm\u011b tak\u00e9 \u00falohy s kombinacemi r\u016fzn\u00fdch
  typ\u016f zpo\u017ed\u011bn\u00ed.\\n\\nMezi dal\u0161\u00ed typy zpo\u017ed\u011bn\u00ed,
  o kter\u00fdch jsme zde zat\u00edm nehovo\u0159ili m\u016f\u017eeme za\u0159adit
  nap\u0159\u00edklad tzv. neutr\u00e1ln\u00ed zpo\u017ed\u011bn\u00ed (viz [10]).
  Diferenci\u00e1ln\u00ed rovnice s neutr\u00e1ln\u00edm zpo\u017ed\u011bn\u00edm
  je potom takov\u00e1 rovnice, kde se v prav\u00e9 \u010d\u00e1sti objev\u00ed derivovan\u00fd
  \u010dlen se zpo\u017ed\u011bn\u00edm v argumentu, nap\u0159. takto: $x''(t) = f(t,
  x(t), x(t - \\\\tau_1), x''(t - \\\\tau_2))$.\\n\\nD\u00e1le lze definovat nap\u0159\u00edklad
  diferenci\u00e1ln\u00ed rovnici se zpo\u017ed\u011bn\u00edm z\u00e1visl\u00fdm na
  stavu syst\u00e9mu, kde je zpo\u017ed\u011bn\u00ed definov\u00e1no jako: $\\\\tau(t)
  = \\\\tau(t, x(t))$, kde $x(t) = (x_1(t), x_2(t), \\\\ldots, x_n(t))$.\\n\\n###
  1.2 \u00dalohy se zpo\u017ed\u011bn\u00edm\\n\\n#### 1.2.1 Diferenci\u00e1ln\u00ed
  rovnice se zpo\u017ed\u011bn\u00edm, po\u010d\u00e1te\u010dn\u00ed \u00faloha\\n\\nDiferenci\u00e1ln\u00ed
  rovnic\u00ed se zpo\u017ed\u011bn\u00edm naz\u00fdv\u00e1me takovou diferenci\u00e1ln\u00ed
  rovnici, kter\u00e1 vyjad\u0159uje derivaci prom\u011bnn\u00e9 $x$ podle \u010dasu
  $t$ pomoc\u00ed $x$ (a derivac\u00ed $x$ ni\u017e\u0161\u00edho \u0159\u00e1du)
  v \u010dase $t$ a v d\u0159\u00edvej\u0161\u00edch okam\u017eic\u00edch. Tedy v
  argumentu nezn\u00e1m\u00e9 funkce se vyskytuje zpo\u017ed\u011bn\u00ed $\\\\tau(t)$.
  Je pak z\u0159ejm\u00e9, \u017ee p\u0159i z\u00e1pisu diferenci\u00e1ln\u00ed rovnice
  se zpo\u017ed\u011bn\u00edm nen\u00ed mo\u017en\u00e9 vynech\u00e1vat argumenty
  nezn\u00e1m\u00e9 funkce.\\n\\nNyn\u00ed je t\u0159eba zav\u00e9st obecn\u00e9 zna\u010den\u00ed
  diferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm pro r\u016fzn\u00e9
  typy zpo\u017ed\u011bn\u00ed. P\u0159edpis definujeme pro syst\u00e9m takov\u00fdch
  rovnic.\\n\\nDefinice 1. (Syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm)\\n\\nNech\u0165
  je syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm d\u00e1n
  rovnost\u00ed:\\n\\n\\\\[ x''(t) = f(t, x(g_1(t)), ..., x(g_m(t))), \\\\]  \\n\\n(1.16)\\n\\nkde
  \\\\( x(t) : \\\\mathbb{R} \\\\to \\\\mathbb{R}^n \\\\), \\\\( g_j(t) : \\\\mathbb{R}
  \\\\to \\\\mathbb{R} \\\\) se naz\u00fdv\u00e1 zpo\u017ed\u011bn\u00fd argument
  a plat\u00ed: \\\\( g_j(t) \\\\leq t \\\\) pro \\\\( j = 1, ..., m \\\\), \\\\(
  m \\\\in \\\\mathbb{N} \\\\), kde velmi \u010dasto \\\\( g_1(t) = t \\\\). D\u00e1le
  \\\\( J \\\\) je interval v \\\\( \\\\mathbb{R} \\\\), \\\\( D \\\\) je otev\u0159en\u00e1
  mno\u017eina v \\\\( \\\\mathbb{R}^n \\\\) a \\\\( f : J \\\\times D^m \\\\to \\\\mathbb{R}^n
  \\\\).\\n\\nPozn\u00e1mka 1. Lze tak\u00e9 pou\u017e\u00edvat zna\u010den\u00ed
  \\\\( t - \\\\tau_j(t) \\\\) m\u00edsto \\\\( g_j(t) \\\\), kde jsou nez\u00e1porn\u00e9
  veli\u010diny \\\\( \\\\tau_j(t) \\\\) zpo\u017ed\u011bn\u00edmi.\\n\\nD\u00e1le
  p\u0159edpokl\u00e1dejme, \u017ee \\\\( \\\\exists \\\\gamma, t_0, \\\\beta \\\\in
  \\\\mathbb{R}, \\\\gamma \\\\leq t_0 \\\\) takov\u00e9, \u017ee:\\n\\n\\\\[ \\\\forall
  j = 1, \\\\ldots, m : \\\\quad \\\\gamma \\\\leq g_j(t) \\\\leq t \\\\quad \\\\text{pro}
  \\\\quad t_0 \\\\leq t < \\\\beta. \\\\]\\n\\nNyn\u00ed definujme po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednku. Poznamenejme, \u017ee oproti oby\u010dejn\u00fdm diferenci\u00e1ln\u00edm
  rovnic\u00edm n\u00e1m pro jednozna\u010dn\u00e9 \u0159e\u0161en\u00ed diferenci\u00e1ln\u00ed
  rovnice se zpo\u017ed\u011bn\u00edm nesta\u010d\u00ed po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka d\u00e1na specifikac\u00ed syst\u00e9mu v \u010dase \\\\( t_0 \\\\).\\n\\nDefinice
  2. (Po\u010d\u00e1te\u010dn\u00ed podm\u00ednka)\\n\\nPo\u010d\u00e1te\u010dn\u00ed
  podm\u00ednkou pro syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm
  rozum\u00edme rovnost:\\n\\n\\\\[ x(t) = \\\\Theta(t), \\\\quad \\\\text{pro} \\\\quad
  \\\\gamma \\\\leq t \\\\leq t_0, \\\\]  \\n\\n(1.17)\\n\\nkde \\\\( \\\\Theta \\\\)
  je dan\u00e1 po\u010d\u00e1te\u010dn\u00ed funkce \\\\( \\\\Theta : [\\\\gamma,
  t_0] \\\\to D \\\\).\\n\\nDefinice 3. (Po\u010d\u00e1te\u010dn\u00ed \u00faloha)\\n\\nPo\u010d\u00e1te\u010dn\u00ed
  \u00falohou pro syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm
  rozum\u00edme syst\u00e9m (1.16) spolu s po\u010d\u00e1te\u010dn\u00ed podm\u00ednkou
  (1.17):\\n\\n\\\\[ \\\\begin{cases} \\nx''(t) = f(t, x(g_1(t)), ..., x(g_m(t)))
  & \\\\text{pro } t_0 \\\\leq t < \\\\beta, \\\\\\\\\\nx(t) = \\\\Theta(t) & \\\\text{pro
  } \\\\gamma \\\\leq t \\\\leq t_0. \\n\\\\end{cases} \\\\]  \\n\\n(1.18)\\n\\nKv\u016fli
  \u010dast\u00e9mu odkazov\u00e1n\u00ed na syst\u00e9m (1.16) definujeme je\u0161t\u011b
  zkr\u00e1cen\u00fd z\u00e1pis syst\u00e9mu diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm.\\n\\n**Definice
  4.** (Zkr\u00e1cen\u00fd z\u00e1pis syst\u00e9mu diferenci\u00e1ln\u00edch rovnic
  se zpo\u017ed\u011bn\u00edm)\\n\\n*Zkr\u00e1cen\u00fd z\u00e1pis syst\u00e9mu diferenci\u00e1ln\u00edch
  rovnic se zpo\u017ed\u011bn\u00edm* je d\u00e1n rovnic\u00ed:\\n\\n\\\\[\\nx''(t)
  = F(t, x_t),\\n\\\\]\\n\\nkde \\\\(F(t, x_t) = f(t, x(g_1(t)), \\\\ldots, x(g_m(t)))\\\\).\\n\\n**Definice
  5.** (Zkr\u00e1cen\u00fd z\u00e1pis po\u010d\u00e1te\u010dn\u00ed \u00falohy)\\n\\n*Zkr\u00e1cen\u00fd
  z\u00e1pis po\u010d\u00e1te\u010dn\u00ed \u00falohy* pro syst\u00e9m diferenci\u00e1ln\u00edch
  rovnic se zpo\u017ed\u011bn\u00edm je d\u00e1n vztahy:\\n\\n\\\\[\\n\\\\begin{cases}\\nx''(t)
  = F(t, x_t) & \\\\text{pro } t_0 \\\\leq t < \\\\beta, \\\\\\\\\\nx(t) = \\\\Theta(t),
  & \\\\text{pro } \\\\gamma \\\\leq t \\\\leq t_0.\\n\\\\end{cases}\\n\\\\]\\n\\n**Definice
  6.** (\u0158e\u0161en\u00ed po\u010d\u00e1te\u010dn\u00ed \u00falohy)\\n\\n*\u0158e\u0161en\u00edm*
  po\u010d\u00e1te\u010dn\u00ed \u00falohy (1.29) je takov\u00e1 spojit\u00e1 funkce
  \\\\(x : [\\\\gamma, \\\\beta_1) \\\\to D\\\\), kter\u00e1 pro libovoln\u00e9 \\\\(\\\\beta_1
  \\\\in (t_0, \\\\beta]\\\\) spl\u0148uje:\\n\\n- \\\\(x''(t) = F(t, x_t)\\\\) pro
  \\\\(t_0 \\\\leq t < \\\\beta_1\\\\),\\n- \\\\(x(t) = \\\\Theta(t)\\\\) pro \\\\(\\\\gamma
  \\\\leq t \\\\leq t_0\\\\).\\n\\n**Definice 7.** (Jednozna\u010dn\u00e9 \u0159e\u0161en\u00ed)\\n\\n\u0158ekneme,
  \u017ee \u0159e\u0161en\u00ed je d\u00e1no *jednozna\u010dn\u011b*, pokud pro ka\u017ed\u00e1
  dv\u011b \u0159e\u0161en\u00ed \\\\(x_1(t), x_2(t)\\\\), kde \\\\(x_1(t) : [\\\\gamma,
  \\\\beta_1) \\\\to D\\\\), \\\\(x_2(t) : [\\\\gamma, \\\\beta_1) \\\\to D\\\\),
  plat\u00ed:\\n\\n\\\\[\\nx_1(t) = x_2(t) \\\\quad \\\\text{pro } t \\\\in [\\\\gamma,
  \\\\beta_1).\\n\\\\]\\n\\n**Definice 8.** (Syst\u00e9m diferenci\u00e1ln\u00edch
  rovnic s omezen\u00fdm zpo\u017ed\u011bn\u00edm)\\n\\nJestli\u017ee existuje \\\\(\\\\tau
  \\\\geq 0\\\\) takov\u00e9, \u017ee plat\u00ed:\\n\\n\\\\[\\nt - \\\\tau \\\\leq
  g_j(t) \\\\leq t \\\\quad \\\\text{pro } t \\\\geq t_0, \\\\ j = 1, \\\\ldots, m,\\n\\\\]\\n\\npak
  o syst\u00e9mu diferenci\u00e1ln\u00edch rovnic (1.16) hovo\u0159\u00edme jako o
  syst\u00e9mu diferenci\u00e1ln\u00edch rovnic s omezen\u00fdm zpo\u017ed\u011bn\u00edm.\\n\\nDefinice
  9. (Po\u010d\u00e1te\u010dn\u00ed podm\u00ednka pro syst\u00e9m s omezen\u00fdm
  zpo\u017ed\u011bn\u00edm)\\nPo\u010d\u00e1te\u010dn\u00ed podm\u00ednka pro syst\u00e9m
  diferenci\u00e1ln\u00edch rovnic s omezen\u00fdm zpo\u017ed\u011bn\u00edm je d\u00e1na
  vztahem:\\n\\n\\\\[ x(t) = \\\\Theta(t), \\\\quad \\\\text{pro } t_0 - \\\\tau \\\\leq
  t \\\\leq t_0, \\\\]  \\n\\n(1.23)\\n\\nkde \\\\( \\\\tau \\\\in \\\\mathbb{R},
  \\\\tau \\\\geq 0 \\\\).\\n\\nDefinice 10. Nech\u0165 je \\\\( \\\\chi \\\\) funkce
  definovan\u00e1 alespo\u0148 na \\\\([t - \\\\tau, t] \\\\to \\\\mathbb{R}^n\\\\).
  Pak definujeme novou funkci \\\\( \\\\chi_t : [-\\\\tau, 0] \\\\to \\\\mathbb{R}^n
  \\\\) jako:\\n\\n\\\\[ \\\\chi_t(\\\\sigma) = \\\\chi(t + \\\\sigma) \\\\quad \\\\text{pro
  } -\\\\tau \\\\leq \\\\sigma \\\\leq 0. \\\\]\\n\\n(1.24)\\n\\nTedy pro z\u00edsk\u00e1n\u00ed
  \\\\( \\\\chi_t \\\\) nejprve uva\u017eujeme \\\\( \\\\chi(s) \\\\) na intervalu
  \\\\( t - \\\\tau \\\\leq s \\\\leq t \\\\) a tuto \u010d\u00e1st pot\u00e9 p\u0159evedeme
  na interval \\\\([- \\\\tau, 0]\\\\).\\n\\nPokud \\\\( \\\\chi \\\\) je spojitou
  funkc\u00ed, pak \\\\( \\\\chi_t \\\\) je spojitou funkc\u00ed na \\\\([- \\\\tau,
  0]\\\\).\\n\\nPozn\u00e1mka 2. Zde je \u00famysln\u011b pou\u017eito zna\u010den\u00ed
  \\\\( \\\\chi \\\\), abychom \\\\( x \\\\) zna\u010dili takovou funkci, kter\u00e1
  spl\u0148uje syst\u00e9m diferenci\u00e1ln\u00edch rovnic.\\n\\nZna\u010den\u00ed\\n\\nOzna\u010dme
  \\\\( C = C([- \\\\tau, 0], \\\\mathbb{R}^n) \\\\) mno\u017einu v\u0161ech spojit\u00fdch
  funkc\u00ed z \\\\([- \\\\tau, 0]\\\\) do \\\\( \\\\mathbb{R}^n \\\\). D\u00e1le
  zna\u010d\u00edme \\\\( C_D = C([- \\\\tau, 0], D) \\\\) mno\u017einu v\u0161ech
  spojit\u00fdch funkc\u00ed z \\\\([- \\\\tau, 0]\\\\) do \\\\( D \\\\).\\n\\nPlat\u00ed,
  \u017ee pokud \\\\( \\\\chi : [t - \\\\tau, t] \\\\to \\\\mathbb{R}^n \\\\) je spojit\u00e1
  funkce na \\\\([t - \\\\tau, t]\\\\), potom \\\\( \\\\chi_t \\\\in C_D \\\\).\\n\\nAby
  byly z\u00e1pisy (1.16) a (1.19) ekvivalentn\u00ed pro \\\\( f \\\\) definovanou
  na \\\\( J \\\\times D^m \\\\), pak pot\u0159ebujeme, aby \\\\( F(t, \\\\chi_t)
  \\\\) d\u00e1vala smysl pro \\\\( t \\\\in J \\\\) a \\\\( \\\\chi_t \\\\in C_D
  \\\\). Tedy definujeme \\\\( F \\\\) jako:\\n\\n\\\\[ F : J \\\\times C_D \\\\to
  \\\\mathbb{R}^n. \\\\]\\n\\nPo\u010d\u00e1te\u010dn\u00ed podm\u00ednku (1.23) m\u016f\u017eeme
  d\u00e1le upravit do tvaru:\\n\\n\\\\[ x(t_0 + \\\\sigma) = \\\\Theta(t_0 + \\\\sigma)
  \\\\quad \\\\text{pro } -\\\\tau \\\\leq \\\\sigma \\\\leq 0 \\\\]\\n\\n(1.25)\\n\\na
  n\u00e1sledn\u011b do zkr\u00e1cen\u00e9ho tvaru:\\n\\n\\\\[ x_{t_0} = \\\\Theta_{t_0}.
  \\\\]  \\n\\n(1.26)\\n\\nZaveden\u00edm rovnosti \\\\( \\\\Phi = \\\\Theta_{t_0}
  \\\\) dost\u00e1v\u00e1me tvar:\\n\\n\\\\[ x_{t_0} = \\\\Phi. \\\\]  \\n\\n(1.27)\\n\\nTento
  z\u00e1pis vyjad\u0159uje \\\\( x(t_0 + \\\\sigma) = \\\\Phi(\\\\sigma) \\\\), p\u0159\u00edpadn\u011b
  pro \\\\( t = t_0 + \\\\sigma \\\\) dost\u00e1v\u00e1me:\\n\\n\\\\[ x_t = \\\\Phi(t
  - t_0) \\\\quad \\\\text{pro } t_0 - \\\\tau \\\\leq t \\\\leq t_0. \\\\]  \\n\\n(1.28)\\n\\nPoznamenejme
  tak\u00e9, \u017ee \\\\( x(t_0) = \\\\Phi(0) \\\\).\\n\\n**Definice 11.** (Zkr\u00e1cen\u00fd
  z\u00e1pis po\u010d\u00e1te\u010dn\u00ed \u00falohy s omezen\u00fdm zpo\u017ed\u011bn\u00edm)\\n\\n*Zkr\u00e1cen\u00fd
  z\u00e1pis po\u010d\u00e1te\u010dn\u00ed \u00falohy pro syst\u00e9m diferenci\u00e1ln\u00edch
  rovnic s omezen\u00fdm zpo\u017ed\u011bn\u00edm* definujeme jako:\\n\\n\\\\[\\n\\\\begin{cases}\\nx''(t)
  = F(t, x_t) \\\\\\\\\\nx_{t_0} = \\\\Phi,\\n\\\\end{cases}\\n\\\\]  \\n\\n(1.29)\\n\\nkde
  \\\\( \\\\Phi \\\\in C_D \\\\), \\\\( F : J \\\\times C_D \\\\to \\\\mathbb{R}^n
  \\\\), kde \\\\( J = [t_0, \\\\beta) \\\\) pro \\\\( \\\\beta > t_0 \\\\), a kde
  \\\\( D \\\\subset \\\\mathbb{R}^n \\\\).\\n\\nKapitola 2\\n\\nKvalitativn\u00ed
  vlastnosti \u0159e\u0161en\u00ed\\n\\n2.1 \u00davodn\u00ed definice a v\u011bty\\n\\nTato
  kapitola se zab\u00fdv\u00e1 diferenci\u00e1ln\u00edmi rovnicemi s omezen\u00fdm
  zpo\u017ed\u011bn\u00edm. Vybudovat teorii pro diferenci\u00e1ln\u00ed rovnice s
  neomezen\u00fdm zpo\u017ed\u011bn\u00edm je obecn\u011b n\u00e1ro\u010dn\u011bj\u0161\u00ed
  a v\u00edce je mo\u017en\u00e9 dohledat nap\u0159\u00edklad v knize [1]. Ne\u017e
  p\u0159ejdeme k v\u011bt\u00e1m o existenci a jednozna\u010dnosti \u0159e\u0161en\u00ed,
  je t\u0159eba zav\u00e9st n\u011bkolik z\u00e1kladn\u00edch pojm\u016f.\\n\\n2.1.1
  Spojitost\\n\\nDefinice 12. (Podm\u00ednka spojitosti)\\n\u0158ekneme, \u017ee je
  spln\u011bna podm\u00ednka spojitosti, pokud \\\\( F(t, x_t) \\\\) je spojit\u00e1
  funkce vzhledem k \\\\( t \\\\) na \\\\( J = [t_0, \\\\beta) \\\\) pro ka\u017edou
  spojitou funkci \\\\( x : [t_0 - \\\\tau, \\\\beta) \\\\to D \\\\).\\n\\nV\u011bta
  1. (\u0158e\u0161en\u00ed a spojitost)\\nPokud \\\\( F : [t_0, \\\\beta) \\\\times
  C_D \\\\to \\\\mathbb{R}^n \\\\) spl\u0148uje podm\u00ednku spojitosti z definice
  12, potom je spojit\u00e1 funkce \\\\( x : [t_0 - \\\\tau, \\\\beta_1) \\\\to D
  \\\\) pro libovoln\u00e9 \\\\( \\\\beta_1 \\\\in (t_0, \\\\beta) \\\\) \u0159e\u0161en\u00edm
  (1.29) pr\u00e1v\u011b tehdy, kdy\u017e plat\u00ed:\\n\\n\\\\[\\nx(t) = \\\\begin{cases}
  \\n\\\\Phi(t - t_0) & \\\\text{pro } t_0 - \\\\tau \\\\leq t \\\\leq t_0 \\\\\\\\\\n\\\\Phi(0)
  + \\\\int_{t_0}^{t} F(s, x_s) ds & \\\\text{pro } t_0 \\\\leq t < \\\\beta_1.\\n\\\\end{cases}\\n\\\\]
  (2.1)\\n\\n2.1.2 Gr\u00f6nwallovo lemma\\n\\nLemma 1. (Gr\u00f6nwall)\\nNech\u0165
  $C \\\\geq 0$ je konstanta, $C \\\\in \\\\mathbb{R}$, $u$, $v$ jsou nez\u00e1porn\u00e9
  spojit\u00e9 funkce definovan\u00e9 na intervalu $J \\\\subseteq \\\\mathbb{R}$
  a $t_0 \\\\in J$ takov\u00e9, \u017ee plat\u00ed:\\n\\n$$u(t) \\\\leq C + \\\\int_{t_0}^{t}
  u(s)v(s) \\\\, ds \\\\quad \\\\text{pro v\u0161echna } t \\\\in J,$$\\n\\n(2.2)\\n\\npotom
  plat\u00ed:\\n\\n$$u(t) \\\\leq Ce^{\\\\int_{t_0}^{t} v(s) \\\\, ds} \\\\quad \\\\text{pro
  v\u0161echna } t \\\\in J.$$\\n\\n(2.3)\\n\\n2.1.3 Lipschitzovskost\\n\\nDefinice
  13. ($\\\\tau$-norma)\\nPro $\\\\Psi \\\\in C_D$ definujeme $\\\\tau$-normu jako:
  $||\\\\Psi||_\\\\tau = \\\\sup_{-\\\\tau \\\\leq \\\\sigma \\\\leq 0} ||\\\\Psi(\\\\sigma)||$.\\n\\nDefinice
  14. (Lipschitzovskost)\\nNech\u0165 $F : J \\\\times C_D \\\\to \\\\mathbb{R}^n$
  a nech\u0165 $M$ je podmno\u017einou $J \\\\times C_D$. Jestli\u017ee existuje $K
  \\\\geq 0$ takov\u00e9, \u017ee plat\u00ed:\\n\\n$$||F(t, \\\\Psi) - F(t, \\\\tilde{\\\\Psi})||
  \\\\leq K||\\\\Psi - \\\\tilde{\\\\Psi}||_\\\\tau$$\\n\\n(2.4)\\n\\nkde $(t, \\\\Psi)$
  a $(t, \\\\tilde{\\\\Psi}) \\\\in M$, potom \u0159\u00edk\u00e1me, \u017ee $F$ je
  lipschitzovsk\u00e1 na $M$ s lipschitzovskou konstantou $K$.\\n\\nDefinice 15. (Lok\u00e1ln\u00ed
  lipschitzovskost)\\nFunkce $F : J \\\\times C_D \\\\to \\\\mathbb{R}^n$ je lok\u00e1ln\u011b
  lipschitzovsk\u00e1, jestli\u017ee pro ka\u017ed\u00e9 zadan\u00e9 $(\\\\bar{t},
  \\\\bar{\\\\Psi}) \\\\in J \\\\times C_D$ existuj\u00ed \u010d\u00edsla $a > 0$,
  $b > 0$ takov\u00e1, \u017ee mno\u017eina $M_{ab}$ d\u00e1na:\\n\\n$$M_{ab} = ([\\\\bar{t}
  - a, \\\\bar{t} + a] \\\\cap J) \\\\times \\\\{\\\\Psi \\\\in C_D : ||\\\\Psi -
  \\\\tilde{\\\\Psi}||_\\\\tau \\\\leq b\\\\}$$\\n\\n(2.5)\\n\\nje podmno\u017einou
  $J \\\\times C_D$ a $F$ je lipschitzovsk\u00e1 na $M_{ab}$.\\n\\n2.2 Existence a
  jednozna\u010dnost \u0159e\u0161en\u00ed\\n\\nLemma 2. Nech\u0165 je funkce $\\\\chi
  : [t_0 - \\\\tau, \\\\beta) \\\\to \\\\mathbb{R}^n$ spojit\u00e1. Potom pro libovoln\u00e9
  zadan\u00e9 $\\\\tilde{t} \\\\in [t_0 - \\\\tau, \\\\beta)$ a $\\\\epsilon > 0$
  existuje $\\\\delta > 0$ tak, \u017ee:\\n\\n$$||\\\\chi_t - \\\\chi_{\\\\tilde{t}}||_\\\\tau
  < \\\\epsilon \\\\quad \\\\text{pr\u00e1v\u011b tehdy, kdy\u017e} \\\\quad t \\\\in
  [t_0, \\\\beta) \\\\quad \\\\text{a} \\\\quad |t - \\\\tilde{t}| < \\\\delta.$$\\n\\nV\u011bta
  2. (Jednozna\u010dnost)\\n\\nNech\u0165 $F : [t_0, \\\\beta) \\\\times C_D \\\\to
  \\\\mathbb{R}^n$ spl\u0148uje podm\u00ednku spojitosti (viz definice 12) a nech\u0165
  je lok\u00e1ln\u011b lipschitzovsk\u00e1. Potom pro ka\u017edou po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednku $\\\\Phi \\\\in C_D$ m\u00e1 po\u010d\u00e1te\u010dn\u00ed \u00faloha
  (1.29) nejv\u00fd\u0161e jedno \u0159e\u0161en\u00ed na $[t_0 - \\\\tau, \\\\beta_1)$
  pro libovoln\u00e9 $\\\\beta_1 \\\\in (t_0, \\\\beta]$.\\n\\nD\u016fkaz. (Sporem)\\n\\nP\u0159edpokl\u00e1dejme,
  \u017ee pro libovoln\u00e9 $\\\\beta_1 \\\\in [t_0, \\\\beta)$ existuj\u00ed dv\u011b
  \u0159e\u0161en\u00ed $x, \\\\tilde{x}$, kde $x : [t_0 - \\\\tau, \\\\beta_1) \\\\to
  D$, $\\\\tilde{x} : [t_0 - \\\\tau, \\\\beta_1) \\\\to D$, takov\u00e1 \u017ee $x
  \\\\neq \\\\tilde{x}$.\\n\\nNech\u0165: $t_1 = \\\\inf\\\\{t \\\\in (t_0, \\\\beta_1)
  : x \\\\neq \\\\tilde{x}\\\\}$. Potom $t_0 \\\\leq t_1 < \\\\beta$ a $x(t) = \\\\tilde{x}(t)$
  pro $t_0 - \\\\tau \\\\leq t \\\\leq t_1$. Jeliko\u017e $(t_1, x_{t_1}) \\\\in [t_0,
  \\\\beta_1) \\\\times C_D$, existuj\u00ed \u010d\u00edsla $a > 0$, $b > 0$ tak,
  \u017ee mno\u017eina\\n\\n$$M = [t_1, t_1 + a] \\\\times \\\\{\\\\Phi \\\\in C :
  ||\\\\Phi - x_{t_1}||_\\\\tau \\\\leq b\\\\}$$\\n\\nje obsa\u017eena v $[t_0, \\\\beta)
  \\\\times C_D$ a $F$ je Lipschitzovsk\u00e1 na $M$.\\n\\nNa z\u00e1klad\u011b lemma
  2 existuje $\\\\delta \\\\in (0, a]$ tak, \u017ee $(t, x_t) \\\\in M$ a $(t, \\\\tilde{x}_t)
  \\\\in M$ pro $t_1 \\\\leq t < t_1 + \\\\delta$. Nav\u00edc $x$ a $\\\\tilde{x}$
  spl\u0148uj\u00ed podm\u00ednku spojitosti pro $t_0 - \\\\tau \\\\leq t < t_1 +
  \\\\delta$.\\n\\nTedy pro $t_1 \\\\leq t < t_1 + \\\\delta$ plat\u00ed:\\n\\n$$||x(t)
  - \\\\tilde{x}(t)|| = \\\\left\\\\| \\\\int_{t_0}^{t} [F(s, x_s) - F(s, \\\\tilde{x}_s)]
  \\\\, ds \\\\right\\\\| \\\\leq \\\\int_{t_1}^{t} K ||x_s - \\\\tilde{x}_s||_\\\\tau
  \\\\, ds.$$ \\n\\nPrav\u00e1 strana rovnosti je rostouc\u00ed funkc\u00ed prom\u011bnn\u00e9
  $t$ a z\u00e1rove\u0148 plat\u00ed $x(t) = \\\\tilde{x}(t)$ pro $t_1 - \\\\tau \\\\leq
  t \\\\leq t_1$. Z toho plyne:\\n\\n$$||x_t - \\\\tilde{x}_t||_\\\\tau \\\\leq \\\\int_{t_1}^{t}
  K ||x_s - \\\\tilde{x}_s||_\\\\tau \\\\, ds \\\\quad \\\\text{pro} \\\\quad t_1
  \\\\leq t < t_1 + \\\\delta$$\\n\\nPou\u017eit\u00edm Gr\u00f6nwallovo lemma 1 zji\u0161\u0165ujeme,
  \u017ee $x(t) = \\\\tilde{x}(t)$ na intervalu $[t_1, t_1 + \\\\delta)$, \u010d\u00edm\u017e
  doch\u00e1z\u00edme ke sporu. \u25a1\\n\\nV\u011bta 3. (Spojit\u00e1 z\u00e1vislost
  \u0159e\u0161en\u00ed na po\u010d\u00e1te\u010dn\u00ed funkci)\\nNech\u0165 \\\\(
  F : [t_0, \\\\beta) \\\\times C_D \\\\to \\\\mathbb{R}^n \\\\) spl\u0148uje podm\u00ednku
  spojitosti a nech\u0165 je (glob\u00e1ln\u011b) lipschitzovsk\u00e1. Nech\u0165
  jsou d\u00e1ny \\\\( \\\\Phi, \\\\tilde{\\\\Phi} \\\\in C_D \\\\) a nech\u0165 jsou
  \\\\( x, \\\\tilde{x} \\\\) jednozna\u010dn\u00fdmi \u0159e\u0161en\u00edmi (1.19)
  pro \\\\( x_{t_0} = \\\\Phi \\\\) a \\\\( \\\\tilde{x}_{t_0} = \\\\tilde{\\\\Phi}
  \\\\).\\n\\nJestli\u017ee maj\u00ed \\\\( x \\\\) i \\\\( \\\\tilde{x} \\\\) smysl
  na \\\\([t_0 - \\\\tau, \\\\beta_1)\\\\), potom plat\u00ed:\\n\\n\\\\[\\n||x(t)
  - \\\\tilde{x}(t)|| \\\\leq ||\\\\Phi - \\\\tilde{\\\\Phi}||_\\\\tau e^{K(t-t_0)}
  \\\\quad \\\\text{pro } t_0 \\\\leq t \\\\leq \\\\beta_1\\n\\\\]  \\n\\n(2.6)\\n\\nD\u016fkaz.
  viz [1].\\n\\nV\u011bta 4. (Lok\u00e1ln\u00ed existence)\\nNech\u0165 \\\\( F :
  [t_0, \\\\beta) \\\\times C_D \\\\to \\\\mathbb{R}^n \\\\) spl\u0148uje podm\u00ednku
  spojitosti a nech\u0165 je lok\u00e1ln\u011b lipschitzovsk\u00e1. Potom pro ka\u017edou
  \\\\( \\\\Phi \\\\in C_D \\\\) m\u00e1 po\u010d\u00e1te\u010dn\u00ed \u00faloha
  (1.29) jednozna\u010dn\u00e9 \u0159e\u0161en\u00ed na \\\\([t_0 - \\\\tau, t_0 +
  \\\\Delta)\\\\) pro \\\\( \\\\Delta > 0 \\\\).\\n\\nD\u016fkaz. viz [1].\\n\\nDefinice
  16. (Prodlu\u017eov\u00e1n\u00ed \u0159e\u0161en\u00ed)\\nNech\u0165 je \\\\( x
  \\\\) \u0159e\u0161en\u00ed \u00falohy (1.29) na intervalu \\\\([t_0 - \\\\tau,
  \\\\beta_1)\\\\) a \\\\( y \\\\) \u0159e\u0161en\u00ed t\u00e9 sam\u00e9 \u00falohy
  na intervalu \\\\([t_0 - \\\\tau, \\\\beta_2)\\\\). Pokud je \\\\( \\\\beta_2 >
  \\\\beta_1 \\\\), \u0159\u00edk\u00e1me, \u017ee \\\\( y \\\\) je prodlou\u017een\u00edm
  \\\\( x \\\\), neboli \u017ee \\\\( x \\\\) m\u016f\u017ee b\u00fdt prodlou\u017eeno
  na interval \\\\([t_0 - \\\\tau, \\\\beta_2)\\\\).\\n\\n\u0158e\u0161en\u00ed \\\\(
  x \\\\) rovnice (1.29) je \u00fapln\u00e9, pokud neexistuje \u0159e\u0161en\u00ed,
  kter\u00e9 je jeho prodlou\u017een\u00edm.\\n\\nDefinice 17. (Kvazi-omezen\u00e1
  funkce)\\n\u0158\u00edk\u00e1me, \u017ee funkce \\\\( F : [t_0, \\\\beta) \\\\times
  C_D \\\\to \\\\mathbb{R}^n \\\\) je kvazi-omezen\u00e1, pokud \\\\( F \\\\) je omezen\u00e1
  na ka\u017ed\u00e9 mno\u017ein\u011b ve tvaru: \\\\([t_0, \\\\beta_1] \\\\times
  C_A\\\\), kde \\\\( t_0 < \\\\beta_1 < \\\\beta \\\\) a \\\\( A \\\\) je uzav\u0159en\u00e1
  omezen\u00e1 podmno\u017eina \\\\( D \\\\).\\n\\nV\u011bta 5. (Prodlou\u017een\u00e1
  existence \u0159e\u0161en\u00ed)\\nNech\u0165 \\\\( F : [t_0, \\\\beta) \\\\times
  C_D \\\\to \\\\mathbb{R}^n \\\\) spl\u0148uje podm\u00ednku spojitosti, nech\u0165
  je lok\u00e1ln\u011b lipschitzovsk\u00e1 a kvazi-omezen\u00e1. Potom pro ka\u017ed\u00e9
  \\\\( \\\\Phi \\\\in C_D \\\\) m\u00e1 soustava (1.29) \u00fapln\u00e9 jednozna\u010dn\u00e9
  \u0159e\u0161en\u00ed \\\\( x \\\\) na intervalu \\\\([t_0 - \\\\tau, \\\\beta_1]\\\\).\\n\\nD\u016fkaz.
  viz [1].\\n\\nV\u011bta 6. (Glob\u00e1ln\u00ed existence)\\nNech\u0165 $D = \\\\mathbb{R}^n$.
  Nech\u0165 $\\\\mathbf{F} : [t_0, \\\\beta) \\\\times C \\\\to \\\\mathbb{R}^n$
  spl\u0148uje podm\u00ednku spojitosti a nech\u0165 je lok\u00e1ln\u011b lipschitzovsk\u00e1.
  D\u00e1le p\u0159edpokl\u00e1dejme, \u017ee:\\n\\n$$||\\\\mathbf{F}(t, \\\\Psi)||
  \\\\leq M(t) + N(t) ||\\\\Psi||_\\\\tau \\\\quad \\\\text{na } [t_0, \\\\beta) \\\\times
  C,$$\\n\\nkde $M$ a $N$ jsou kladn\u00e9 spojit\u00e9 funkce na $[t_0, \\\\beta)$.\\n\\nPotom
  existuje \u00fapln\u00e9 jednozna\u010dn\u00e9 \u0159e\u0161en\u00ed na cel\u00e9m
  intervalu $[t_0 - \\\\tau, \\\\beta)$\\n\\nD\u016fkaz. viz [1].\\n\\nKapitola 3\\n\\n\u0158e\u0161en\u00ed
  diferenci\u00e1ln\u00edch rovnic s konstantn\u00edm zpo\u017ed\u011bn\u00edm\\n\\n3.1
  Metoda krok\u016f\\n\\n3.1.1 Popis metody krok\u016f\\n\\nMetoda krok\u016f vyu\u017e\u00edv\u00e1
  lok\u00e1ln\u00ed transformaci dan\u00e9 diferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm
  na oby\u010dejnou diferenci\u00e1ln\u00ed rovnici. Jedno takov\u00e9 \u010d\u00e1ste\u010dn\u00e9
  \u0159e\u0161en\u00ed pak naz\u00fdv\u00e1me jedn\u00edm krokem.\\n\\nNa intervalu
  \\\\([t_0 - \\\\tau, t_0]\\\\) m\u00e1me zadanou po\u010d\u00e1te\u010dn\u00ed funkci
  \\\\(\\\\Theta\\\\) tak, \u017ee\\n\\n\\\\[ x(t) = \\\\Theta(t) \\\\quad \\\\text{pro}
  \\\\quad t_0 - \\\\tau \\\\leq t \\\\leq t_0. \\\\]\\n\\nV prvn\u00edm kroku hled\u00e1me
  prodlou\u017een\u00ed tohoto \u0159e\u0161en\u00ed na interval \\\\(I_1\\\\) d\u00e9lky
  \\\\(\\\\tau\\\\), tedy pro v\u0161echna \\\\(t\\\\) kde \\\\(t \\\\in I_1 = [t_0,
  t_0 + \\\\tau]\\\\), vy\u0159e\u0161en\u00edm oby\u010dejn\u00e9 diferenci\u00e1ln\u00ed
  rovnice. Toto \u0159e\u0161en\u00ed, tedy \u0159e\u0161en\u00ed \\\\(x\\\\) v prvn\u00edm
  kroku, ozna\u010d\u00edme jako \\\\(x_1\\\\).\\n\\nPro druh\u00fd interval op\u011bt
  d\u00e9lky \\\\(\\\\tau\\\\), tedy \\\\(I_2 = [t_0 + \\\\tau, t_0 + 2\\\\tau]\\\\)
  vyu\u017e\u00edv\u00e1me \u0159e\u0161en\u00ed \\\\(x_1\\\\) z intervalu \\\\(I_1\\\\).
  Ve druh\u00e9m kroku tedy hled\u00e1me prodlou\u017een\u00e9 \u0159e\u0161en\u00ed
  \\\\(x_2\\\\) (kter\u00e9 je prodlou\u017een\u00edm \u0159e\u0161en\u00ed \\\\(x_1\\\\))
  na intervalu \\\\(I_2\\\\).\\n\\nTakto pokra\u010dujeme do libovoln\u00e9ho kroku,
  kde jsme schopni diferenci\u00e1ln\u00ed rovnice \u0159e\u0161it a kde m\u00e1 takov\u00e9
  \u0159e\u0161en\u00ed smysl. M\u016f\u017eeme tak\u00e9 objevit v d\u00edlc\u00edch
  \u0159e\u0161en\u00ed n\u011bjak\u00fd \u0159\u00e1d a z\u00edskat tak p\u0159edpis
  \u0159e\u0161en\u00ed pro libovoln\u00fd krok.\\n\\nV\u00fdsledn\u00e9 \u0159e\u0161en\u00ed
  definujeme pomoc\u00ed jednotliv\u00fdch krok\u016f jako:\\n\\n\\\\[\\nx(t) = \\\\begin{cases}
  \\n\\\\Theta(t) & \\\\text{pro } t \\\\in [t_0 - \\\\tau, t_0], \\\\\\\\\\nx_1(t)
  & \\\\text{pro } t \\\\in [t_0, t_0 + \\\\tau], \\\\\\\\\\nx_2(t) & \\\\text{pro
  } t \\\\in [t_0 + \\\\tau, t_0 + 2\\\\tau], \\\\\\\\\\n\\\\vdots & \\\\\\\\\\nx_k(t)
  & \\\\text{pro } t \\\\in [t_0 + (k-1)\\\\tau, t_0 + k\\\\tau], \\\\\\\\\\n\\\\vdots
  & \\n\\\\end{cases}\\n\\\\]  \\n\\n(3.1)\\n\\n### 3.1.2 P\u0159\u00edklad 1, metoda
  krok\u016f\\n\\nUva\u017eujme rovnici:\\n\\n\\\\[ x''(t) = 2x(t - 5) \\\\]  \\n\\n(3.2)\\n\\ns
  po\u010d\u00e1te\u010dn\u00ed podm\u00ednkou: \\\\( \\\\Theta(t) = 1, \\\\quad \\\\text{pro
  } t \\\\in [-5, 0]. \\\\)\\n\\nZpo\u017ed\u011bn\u00ed je tedy konstantn\u00ed a
  jeho velikost je \\\\( \\\\tau(t) = 5. \\\\) Toto tak\u00e9 pou\u017eijeme p\u0159i
  volb\u011b subinterval\u016f v jednotliv\u00fdch t\u0159ech uk\u00e1zkov\u00fdch
  kroc\u00edch t\u00e9to metody.\\n\\n1) \\\\( t \\\\in \\\\langle 0, 5 \\\\rangle:
  \\\\) \\\\( x''_1(t) = 2 \\\\cdot \\\\Theta(t - 5) = 2 \\\\cdot 1 = 2. \\\\)\\n   Obecn\u00e9
  \u0159e\u0161en\u00ed: \\\\( x_1(t) = 2t + c_1. \\\\)\\n   Po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka pro \\\\( t = 0: \\\\) \\\\( 1 = 2 \\\\cdot 0 + c_1, \\\\) z toho
  vyj\u00e1d\u0159\u00edme \\\\( c_1 = 1 \\\\) a dost\u00e1v\u00e1me partikul\u00e1rn\u00ed
  \u0159e\u0161en\u00ed: \\\\( x_1(t) = 2t + 1. \\\\)\\n   Nyn\u00ed je t\u0159eba
  vypo\u010d\u00edtat hodnotu \\\\( x_1(t) \\\\) pro \\\\( t = 5. \\\\) Tu pak pou\u017eijeme
  jako po\u010d\u00e1te\u010dn\u00ed podm\u00ednku ve druh\u00e9m kroku, tedy plat\u00ed
  \\\\( x_1(5) = 11. \\\\)\\n\\n2) \\\\( t \\\\in \\\\langle 5, 10 \\\\rangle: \\\\)
  \\\\( x''_2(t) = 2 \\\\cdot x_1(t - 5) = 2(2(t - 5) + 1) = 4t - 18. \\\\)\\n   Obecn\u00e9
  \u0159e\u0161en\u00ed: \\\\( x_2(t) = 2t^2 - 18t + c_2. \\\\)\\n   Po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka: \\\\( 11 = 2 \\\\cdot 5^2 - 18 \\\\cdot 5 + c_2, \\\\) tedy \\\\(
  c_2 = 51. \\\\)\\n   Partikul\u00e1rn\u00ed \u0159e\u0161en\u00ed: \\\\( x_2(t)
  = 2t^2 - 18t + 51, \\\\)\\n   \\\\( x_2(10) = 71. \\\\)\\n\\n3) \\\\( t \\\\in \\\\langle
  10, 15 \\\\rangle: \\\\) \\\\( x''_3(t) = 2 \\\\cdot x_2(t - 5) = 2(2(t - 5)^2 -
  18(t - 5) + 51) = 4t^2 - 76 + 382. \\\\)\\n   Obecn\u00e9 \u0159e\u0161en\u00ed:
  \\\\( x_3(t) = \\\\frac{4}{3}t^3 - 38t^2 + 382t + c_3. \\\\)\\n\\nPo\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka: $71 = \\\\frac{4}{3} \\\\cdot 10^3 - 38 \\\\cdot 10^2 + 382 \\\\cdot
  10 + c_3$, tedy $c_3 = -1282,3$.\\n\\nPartikul\u00e1rn\u00ed \u0159e\u0161en\u00ed:
  $x_3(t) = \\\\frac{4}{3}t^3 - 38t^2 + 382t - 1282,3$.\\n\\nNa obr\u00e1zc\u00edch
  n\u00ed\u017ee jsou vykreslena \u0159e\u0161en\u00ed t\u0159\u00ed p\u0159edchoz\u00edch
  krok\u016f a celkov\u00e9 \u0159e\u0161en\u00ed pro $t \\\\in \\\\langle 0, 15 \\\\rangle$.\\n\\nObr\u00e1zek
  3.1: $t \\\\in \\\\langle 0, 5 \\\\rangle$\\n\\nObr\u00e1zek 3.2: $t \\\\in \\\\langle
  5, 10 \\\\rangle$\\n\\nObr\u00e1zek 3.3: $t \\\\in \\\\langle 10, 15 \\\\rangle$\\n\\nObr\u00e1zek
  3.4: $t \\\\in \\\\langle 0, 15 \\\\rangle$\\n\\n3.1.3 P\u0159\u00edklad 2, metoda
  krok\u016f\\n\\nUva\u017eujme rovnici:\\n\\n\\\\[ x''(t) = 3x(t - \\\\pi) \\\\]  \\n\\n(3.3)\\n\\ns
  po\u010d\u00e1te\u010dn\u00ed podm\u00ednkou: \\\\( \\\\Theta(t) = \\\\cos(t) \\\\)
  pro \\\\( t \\\\in \\\\left\\\\langle -\\\\frac{\\\\pi}{2}, \\\\frac{\\\\pi}{2}
  \\\\right\\\\rangle \\\\).\\n\\nZpo\u017ed\u011bn\u00ed \\\\( \\\\tau(t) = \\\\pi
  \\\\) je tedy op\u011bt konstantn\u00ed.\\n\\nVe t\u0159ech kroc\u00edch metody
  krok\u016f budeme zkoumat interval \\\\( t \\\\in \\\\left\\\\langle \\\\frac{\\\\pi}{2},
  \\\\frac{7\\\\pi}{2} \\\\right\\\\rangle \\\\).\\n\\n1) \\\\( t \\\\in \\\\left\\\\langle
  \\\\frac{\\\\pi}{2}, \\\\frac{3\\\\pi}{2} \\\\right\\\\rangle \\\\):\\n\\n\\\\[
  x''_1(t) = 3 \\\\cdot \\\\Theta(t - \\\\pi) = 3 \\\\cos(t - \\\\pi) = -3 \\\\cos
  t. \\\\]\\n\\nObecn\u00e9 \u0159e\u0161en\u00ed: \\\\( x_1(t) = -3 \\\\sin t + c_1
  \\\\).\\n\\nPo\u010d\u00e1te\u010dn\u00ed podm\u00ednka: \\\\( \\\\Theta\\\\left(\\\\frac{\\\\pi}{2}\\\\right)
  = x_1\\\\left(\\\\frac{\\\\pi}{2}\\\\right) \\\\),\\n\\n\\\\[ \\\\cos\\\\left(\\\\frac{\\\\pi}{2}\\\\right)
  = -3 \\\\sin\\\\left(\\\\frac{\\\\pi}{2}\\\\right) + c_1, \\\\text{ z toho: } c_1
  = 3 \\\\]\\n\\nPartikul\u00e1rn\u00ed \u0159e\u0161en\u00ed: \\\\( x_1(t) = -3 \\\\sin(t)
  + 3 \\\\).\\n\\n\\\\[ x_1\\\\left(\\\\frac{3\\\\pi}{2}\\\\right) = 6. \\\\]\\n\\n2)
  \\\\( t \\\\in \\\\left\\\\langle \\\\frac{3\\\\pi}{2}, \\\\frac{5\\\\pi}{2} \\\\right\\\\rangle
  \\\\):\\n\\n\\\\[ x''_2(t) = 3 \\\\cdot x_1(t - \\\\pi) = 3(-3 \\\\sin(t - \\\\pi)
  + 3) = -9 \\\\sin(t - \\\\pi) + 9 = 9 \\\\sin t + 9. \\\\]\\n\\nObecn\u00e9 \u0159e\u0161en\u00ed:
  \\\\( x_2(t) = -9 \\\\cos t + 9t + c_2 \\\\).\\n\\nPo\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka: \\\\( x_1\\\\left(\\\\frac{3\\\\pi}{2}\\\\right) = x_2\\\\left(\\\\frac{3\\\\pi}{2}\\\\right)
  \\\\),\\n\\n\\\\[ 6 = -9 \\\\cos\\\\left(\\\\frac{3\\\\pi}{2}\\\\right) + 9t + c_2,
  \\\\text{ z toho: } c_2 = 6 - \\\\left(\\\\frac{27\\\\pi}{2}\\\\right) \\\\]\\n\\nPartikul\u00e1rn\u00ed
  \u0159e\u0161en\u00ed: \\\\( x_2(t) = -9 \\\\cos t + 9t + 6 - \\\\left(\\\\frac{27\\\\pi}{2}\\\\right)
  \\\\).\\n\\n\\\\[ x_2\\\\left(\\\\frac{5\\\\pi}{2}\\\\right) = 6 + 9\\\\pi. \\\\]\\n\\n3)
  \\\\( t \\\\in \\\\left\\\\langle \\\\frac{5\\\\pi}{2}, \\\\frac{7\\\\pi}{2} \\\\right\\\\rangle
  \\\\):\\n\\n\\\\[ x''_3(t) = 3 \\\\cdot x_2(t + \\\\pi) = 3(-9 \\\\cos(t + \\\\pi)
  + 9(t + \\\\pi) + 6 - \\\\frac{27\\\\pi}{2}) = -27 \\\\cos(t + \\\\pi) + 27(t +
  \\\\pi) + 18 - \\\\frac{81\\\\pi}{2} = 27 \\\\cos t + 27t + 18 - \\\\frac{27\\\\pi}{2}
  \\\\]\\n\\nObecn\u00e9 \u0159e\u0161en\u00ed: \\\\( x_3(t) = 27 \\\\sin t + \\\\frac{27t^2}{2}
  + 18t - \\\\frac{27\\\\pi t}{2} + c_3 \\\\).\\n\\nPo\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka: \\\\( x_2\\\\left(\\\\frac{5\\\\pi}{2}\\\\right) = x_3\\\\left(\\\\frac{5\\\\pi}{2}\\\\right)
  \\\\),\\n\\n\\\\[ 6 + 9\\\\pi = 27 \\\\sin\\\\left(\\\\frac{5\\\\pi}{2}\\\\right)
  + \\\\frac{27\\\\left(\\\\frac{5\\\\pi}{2}\\\\right)^2}{2} + 18\\\\left(\\\\frac{5\\\\pi}{2}\\\\right)
  - \\\\frac{27\\\\pi\\\\left(\\\\frac{5\\\\pi}{2}\\\\right)}{2} + c_3, \\\\text{
  z toho: } c_3 = -21 - 36\\\\pi - \\\\left(\\\\frac{405\\\\pi^2}{8}\\\\right) \\\\]\\n\\nPartikul\u00e1rn\u00ed
  \u0159e\u0161en\u00ed: \\\\( x_3(t) = 27 \\\\sin t + \\\\frac{27}{2}t^2 + (18 -
  \\\\frac{27\\\\pi}{2})t - 21 - 36\\\\pi - \\\\left(\\\\frac{405\\\\pi^2}{8}\\\\right)
  \\\\).\\n\\nNa obr\u00e1zc\u00edch n\u00ed\u017ee jsou op\u011bt vykreslena \u0159e\u0161en\u00ed
  t\u0159\u00ed krok\u016f a celkov\u00e9 \u0159e\u0161en\u00ed pro $t \\\\in \\\\left\\\\langle
  \\\\frac{\\\\pi}{2}, \\\\frac{7\\\\pi}{2} \\\\right\\\\rangle$.\\n\\nObr\u00e1zek
  3.5: $t \\\\in \\\\left\\\\langle \\\\frac{\\\\pi}{2}, \\\\frac{3\\\\pi}{2} \\\\right\\\\rangle$\\n\\nObr\u00e1zek
  3.6: $t \\\\in \\\\left\\\\langle \\\\frac{3\\\\pi}{2}, \\\\frac{5\\\\pi}{2} \\\\right\\\\rangle$\\n\\nObr\u00e1zek
  3.7: $t \\\\in \\\\left\\\\langle \\\\frac{5\\\\pi}{2}, \\\\frac{7\\\\pi}{2} \\\\right\\\\rangle$\\n\\nObr\u00e1zek
  3.8: $t \\\\in \\\\left\\\\langle \\\\frac{\\\\pi}{2}, \\\\frac{7\\\\pi}{2} \\\\right\\\\rangle$\\n\\n3.2
  Laplaceova transformace\\n\\n3.2.1 Popis Laplaceovy transformace\\n\\nLaplaceova
  transformace je \u010dastou metodou pro \u0159e\u0161en\u00ed oby\u010dejn\u00fdch
  diferenci\u00e1ln\u00edch rovnic. M\u016f\u017eeme ji ale vyu\u017e\u00edt i p\u0159i
  \u0159e\u0161en\u00ed diferenci\u00e1ln\u00edch rovnic s konstantn\u00edm zpo\u017ed\u011bn\u00edm.
  Hlavn\u00ed my\u0161lenkou je z\u00edskat pomoc\u00ed Laplaceovy transformace algebraickou
  rovnici, vy\u0159e\u0161it ji a pomoc\u00ed zp\u011btn\u00e9 transformace z\u00edskat
  p\u016fvodn\u00ed \u0159e\u0161en\u00ed. V t\u00e9to \u010d\u00e1sti je \u010derp\u00e1no
  z [11] a [12].\\n\\n220.127.116.11 P\u0159\u00edm\u00e1 Laplaceova transformace\\n\\nP\u0159\u00edm\u00e1
  Laplaceova transformace p\u0159ev\u00e1d\u00ed re\u00e1lnou funkci definovanou v
  \u010dasov\u00e9 oblasti (tzv. origin\u00e1l nebo tak\u00e9 p\u0159edm\u011bt) na
  komplexn\u00ed funkci (tzv. obraz) definovanou v oblasti komplexn\u00ed prom\u011bnn\u00e9.\\n\\nP\u0159\u00edmou
  Laplaceovu transformaci definujeme vztahem:\\n\\n\\\\[ X(s) = \\\\mathcal{L}\\\\{x(t)\\\\}
  = \\\\int_0^\\\\infty x(t)e^{-st} dt, \\\\tag{3.4} \\\\]\\n\\nkde \\\\( s = \\\\alpha
  + i\\\\beta \\\\) je komplexn\u00ed prom\u011bnn\u00e1: \\\\( \\\\alpha \\\\) je
  re\u00e1ln\u00e1 slo\u017eka komplexn\u00ed prom\u011bnn\u00e9 \\\\( s \\\\), \\\\(
  \\\\beta \\\\) je imagin\u00e1rn\u00ed slo\u017eka komplexn\u00ed prom\u011bnn\u00e9
  \\\\( s \\\\), \\\\( t \\\\) je re\u00e1ln\u00e1 prom\u011bnn\u00e1 (\u010das),
  \\\\( x(t) \\\\) je origin\u00e1l, tedy re\u00e1ln\u00e1 funkce definovan\u00e1
  v \u010dasov\u00e9 oblasti pro \\\\( t \\\\in (0, \\\\infty) \\\\), \\\\( X(s) \\\\)
  je obraz origin\u00e1lu, tedy komplexn\u00ed funkce definovan\u00e1 v oblasti komplexn\u00ed
  prom\u011bnn\u00e9 \\\\( s \\\\) a \\\\( \\\\mathcal{L} \\\\) je oper\u00e1tor p\u0159\u00edm\u00e9
  Laplaceovy transformace.\\n\\n18.104.22.168 Inverzn\u00ed Laplaceova transformace\\n\\nInverzn\u00ed
  (nebo tak\u00e9 zp\u011btn\u00e1) Laplaceova transformace je ji\u017e podle n\u00e1zvu
  zp\u011btn\u00fdm krokem p\u0159\u00edm\u00e9 Laplaceovy transformace, tedy p\u0159ev\u00e1d\u00ed
  obraz (komplexn\u00ed funkci definovanou v oblasti komplexn\u00ed prom\u011bnn\u00e9)
  na origin\u00e1l (re\u00e1lnou funkci definovanou v \u010dasov\u00e9 oblasti).\\n\\nInverzn\u00ed
  Laplaceovu transformaci definujeme vztahem:\\n\\n\\\\[ x(t) = \\\\mathcal{L}^{-1}\\\\{X(s)\\\\}
  = \\\\frac{1}{2\\\\pi i} \\\\int_{c-i\\\\infty}^{c+i\\\\infty} X(s)e^{st} ds, \\\\tag{3.5}
  \\\\]\\n\\nkde \\\\( \\\\mathcal{L}^{-1} \\\\) je inverzn\u00ed Laplace\u016fv oper\u00e1tor
  a \\\\( c \\\\) je libovoln\u00e9 re\u00e1ln\u00e9 \u010d\u00edslo le\u017e\u00edc\u00ed
  v oblasti konvergence obrazu \\\\( X \\\\).\\n\\n22.214.171.124 Vlastnosti Laplaceovy
  transformace\\n\\nDerivov\u00e1n\u00ed origin\u00e1lu pro prvn\u00ed derivaci: \\\\(
  \\\\mathcal{L}\\\\{x''(t)\\\\} = sX(s) - x(0). \\\\)\\n\\nDerivov\u00e1n\u00ed origin\u00e1lu
  pro n-tou derivaci: \\\\( \\\\mathcal{L}\\\\{x^{(n)}(t)\\\\} = s^n X(s) - \\\\sum_{j=1}^{n}
  s^{n-j} \\\\frac{d^{j-1}x(0)}{dt^{j-1}}. \\\\)\\n\\nIntegrov\u00e1n\u00ed origin\u00e1lu:
  \\\\( \\\\mathcal{L}\\\\{\\\\int_0^t x(\\\\sigma)d\\\\sigma\\\\} = \\\\frac{1}{s}X(s).
  \\\\)\\n\\nPo\u010d\u00e1te\u010dn\u00ed a koncov\u00e1 hodnota:\\n\\n\\\\[\\n\\\\begin{align*}\\nx(0)
  &= \\\\lim_{t \\\\to 0} x(t) = \\\\lim_{s \\\\to \\\\infty} sX(s) \\\\\\\\\\nx(\\\\infty)
  &= \\\\lim_{t \\\\to \\\\infty} x(t) = \\\\lim_{s \\\\to 0} sX(s)\\n\\\\end{align*}\\n\\\\]\\n\\nPosunut\u00ed
  (zpo\u017ed\u011bn\u00ed) origin\u00e1lu:\\n\\\\( \\\\mathcal{L}\\\\{x(t-a)\\\\}
  = e^{-as}X(s), \\\\quad \\\\text{kde } a \\\\geq 0, x(t-a) = 0 \\\\text{ pro } t
  < a. \\\\)\\n\\nPosunut\u00ed (\u00fatlum) obrazu: \\\\( \\\\mathcal{L}\\\\{e^{-at}x(t)\\\\}
  = X(s+a). \\\\)\\n\\nPodobnost (zm\u011bna m\u011b\u0159\u00edtka):\\n\\\\[\\n\\\\begin{align*}\\n\\\\mathcal{L}\\\\left\\\\{x\\\\left(\\\\frac{t}{a}\\\\right)\\\\right\\\\}
  &= aX(as), \\\\\\\\\\n\\\\mathcal{L}^{-1}\\\\left\\\\{X\\\\left(\\\\frac{s}{a}\\\\right)\\\\right\\\\}
  &= ax(at).\\n\\\\end{align*}\\n\\\\]\\n\\n3.2.2 P\u0159\u00edklad, Laplaceova transformace\\n\\nUva\u017eujeme
  po\u010d\u00e1te\u010dn\u00ed \u00falohu:\\n\\n\\\\[\\n\\\\begin{cases}\\nx''(t)
  = 2x(t-\\\\tau) \\\\\\\\\\n\\\\Theta(t) = 1, \\\\quad \\\\text{pro } t \\\\in [t_0
  - \\\\tau, t_0],\\n\\\\end{cases}\\n\\\\] (3.6)\\n\\nkde \\\\( \\\\tau = 5. \\\\)\\n\\nNa
  ob\u011b strany diferenci\u00e1ln\u00ed rovnice aplikujeme Laplaceovu transformaci
  \\\\( X(s) = \\\\mathcal{L}\\\\{x(t)\\\\} = \\\\int_0^\\\\infty x(t)e^{-st}dt. \\\\)\\n\\nZ\u00edsk\u00e1me
  tedy rovnici:\\n\\n\\\\[\\n\\\\int_0^\\\\infty x''(t)e^{-st}dt = 2 \\\\int_0^\\\\infty
  x(t - \\\\tau)e^{-st}dt\\n\\\\]\\n\\na jednotliv\u00e9 integr\u00e1ly ozna\u010d\u00edme
  velk\u00fdmi p\u00edsmeny \\\\(I_i, i = 1, 2\\\\):\\n\\n\\\\[\\n\\\\underbrace{\\\\int_0^\\\\infty
  x''(t)e^{-st}dt}_{I_1} = \\\\underbrace{2 \\\\int_0^\\\\infty x(t - \\\\tau)e^{-st}dt}_{I_2}.\\n\\\\]\\n\\nOba
  integr\u00e1ly uprav\u00edme.\\n\\n\\\\[\\nI_1 = \\\\int_0^\\\\infty x''(t)e^{-st}dt
  = sX(s) - \\\\Theta(t)\\n\\\\]\\n\\n\\\\[\\nI_2 = 2 \\\\int_0^\\\\infty x(t - \\\\tau)e^{-st}dt
  =\\n\\\\]\\n\\n\\\\[\\n= |u=t-\\\\tau| = 2 \\\\int_{-\\\\tau}^\\\\infty x(u)e^{-s(u+\\\\tau)}du
  =\\n\\\\]\\n\\n\\\\[\\n= 2 \\\\int_{-\\\\tau}^0 x(u)e^{-s(u+\\\\tau)}du + 2 \\\\int_0^\\\\infty
  x(u)e^{-s(u+\\\\tau)}du =\\n\\\\]\\n\\n\\\\[\\n= 2e^{-s\\\\tau}\\\\Theta(t) \\\\int_{-\\\\tau}^0
  e^{-su}du + 2e^{-s\\\\tau}X(s) =\\n\\\\]\\n\\n\\\\[\\n= 2\\\\Theta(t)\\\\frac{1-e^{-s\\\\tau}}{s}
  + 2e^{-s\\\\tau}X(s)\\n\\\\]\\n\\nT\u00edmto jsme p\u0159evedli diferenci\u00e1ln\u00ed
  rovnici se zpo\u017ed\u011bn\u00edm na algebraickou rovnici s nezn\u00e1mou \\\\(X(s)\\\\)
  ve tvaru:\\n\\n\\\\[\\nsX(s) - \\\\Theta(t) = 2\\\\Theta(t)\\\\frac{1-e^{-s\\\\tau}}{s}
  + 2e^{-s\\\\tau}X(s).\\n\\\\]\\n\\nPo vyj\u00e1d\u0159en\u00ed \\\\(X(s)\\\\) dostaneme
  rovnici ve tvaru:\\n\\n\\\\[\\nX(s) = \\\\frac{2\\\\Theta(t)(1-e^{-s\\\\tau}) +
  s\\\\Theta(t)}{s(s-2e^{-s\\\\tau})}\\n\\\\]\\n\\na po dosazen\u00ed \\\\(\\\\Theta(t)
  = 1, \\\\tau = 5\\\\):\\n\\n\\\\[\\nX(s) = \\\\frac{2(1-e^{-5s})+s}{s(s-2e^{-5s})}.\\n\\\\]\\n\\nNyn\u00ed
  by bylo t\u0159eba aplikovat zp\u011btnou Laplaceovu transformaci a z\u00edskali
  bychom \u0159e\u0161en\u00ed \\\\(x(t)\\\\).\\n\\nKapitola 4\\n\\nModelov\u00e1n\u00ed
  v\u00fdvoje populac\u00ed\\n\\nAbychom co nejl\u00e9pe pochopili re\u00e1ln\u00fd
  syst\u00e9m (a\u0165 u\u017e biologick\u00fd nebo jin\u00fd), v\u0161echny jeho
  pochody a vnit\u0159n\u00ed vazby, pou\u017e\u00edv\u00e1me matematick\u00e9 modelov\u00e1n\u00ed.
  V\u00fdsledkem tohoto modelov\u00e1n\u00ed je abstraktn\u00ed zjednodu\u0161en\u00fd
  popis p\u016fvodn\u00edho re\u00e1ln\u00e9ho syst\u00e9mu.\\n\\nZ\u00e1kladem pro
  matematick\u00fd model re\u00e1ln\u00e9ho syst\u00e9mu jsou rovnice (v\u010detn\u011b
  po\u010d\u00e1te\u010dn\u00edch podm\u00ednek), kter\u00e9 tento syst\u00e9m popisuj\u00ed.
  Sestavujeme je pomoc\u00ed zn\u00e1m\u00fdch parametr\u016f modelu s dan\u00fdmi
  po\u010d\u00e1te\u010dn\u00edmi hodnotami a pomoc\u00ed souboru experiment\u00e1ln\u00edch
  dat. T\u00edmto se pak dost\u00e1v\u00e1me k diferenci\u00e1ln\u00edm rovnic\u00edm.\\n\\nV
  t\u00e9to kapitole \u010derp\u00e1me z textu [3].\\n\\n4.1 Modely jednodruhov\u00fdch
  populac\u00ed pomoc\u00ed diferenci\u00e1ln\u00edch rovnic\\n\\nP\u0159i popisu
  jednodruhov\u00e9 populace pokl\u00e1d\u00e1me za jej\u00ed charakteristickou vlastnost
  velikost populace.\\n\\nTuto velikost lze vyj\u00e1d\u0159it po\u010dtem jedinc\u016f
  dan\u00e9 populace \u017eij\u00edc\u00edch v ur\u010dit\u00e9m vymezen\u00e9m prostoru
  nebo nap\u0159\u00edklad hustotou os\u00eddlen\u00ed tohoto prostoru.\\n\\nDefinice
  18. (Z\u00e1kladn\u00ed rovnice pro popis jednodruhov\u00e9 populace)\\nZ\u00e1kladn\u00ed
  rovnici pro popis jednodruhov\u00e9 populace zapisujeme ve tvaru:\\n\\n\\\\[ x(t
  + \\\\Delta t) = x(t) + \\\\Delta x_b - \\\\Delta x_d + \\\\Delta x_m, \\\\]  \\\\hspace{1cm}
  (4.1)\\n\\nkde \\\\( x(t) \\\\) ozna\u010duje velikost populace v z\u00e1vislosti
  na \u010dase \\\\( t \\\\), a pak tedy \\\\( x(t + \\\\Delta t) \\\\) je velikost
  populace v \u010dase \\\\( t + \\\\Delta t \\\\).\\n\\nD\u00e1le \\\\( \\\\Delta
  x_b \\\\) zna\u010d\u00ed p\u0159\u00edr\u016fstek v d\u016fsledku porodnosti za
  dobu \\\\( \\\\Delta t \\\\), \\\\( \\\\Delta x_d \\\\) \u00fabytek zap\u0159\u00ed\u010din\u011bn\u00fd
  \u00famrtnost\u00ed a \\\\( \\\\Delta x_m \\\\) ostatn\u00ed zm\u011bny ve velikosti
  populace (zap\u0159\u00ed\u010din\u011bn\u00e9 jin\u00fdmi vlivy).\\n\\nVe zjednodu\u0161en\u00e9
  situaci se m\u016f\u017eeme soust\u0159edit pouze na zm\u011bny velikosti populace
  v z\u00e1vislosti na porodnosti a \u00famrtnosti a rovnici tedy zapsat jako:\\n\\n\\\\[\\nx(t
  + \\\\Delta t) = x(t) + \\\\Delta x_b - \\\\Delta x_d. \\\\tag{4.2}\\n\\\\]\\n\\nPo\u010det
  narozen\u00fdch jedinc\u016f \\\\( \\\\Delta x_b \\\\) v cel\u00e9 populaci za dobu
  \\\\( \\\\Delta t \\\\) lze zapsat ve tvaru:\\n\\n\\\\[\\n\\\\Delta x_b = B(x, t)
  \\\\Delta t,\\n\\\\]\\n\\nkde \\\\( B(x, t) \\\\) pak naz\u00fdv\u00e1me porodnost,
  kter\u00e1 vyjad\u0159uje po\u010det jedinc\u016f narozen\u00fdch za jednotku \u010dasu.\\n\\nObdobn\u011b
  m\u016f\u017eeme vyj\u00e1d\u0159it \u00famrtnost \\\\( D(x, t) \\\\) jako:\\n\\n\\\\[\\n\\\\Delta
  x_d = D(x, t) \\\\Delta t.\\n\\\\]\\n\\nPokud uvedenou porodnost a \u00famrtnost
  vzt\u00e1hneme ke stavu populace, dostaneme potom relativn\u00ed porodnost:\\n\\n\\\\[\\nb(x,
  t) = \\\\frac{B(x, t)}{x(t)}\\n\\\\]\\n\\na relativn\u00ed \u00famrtnost:\\n\\n\\\\[\\nd(x,
  t) = \\\\frac{D(x, t)}{x(t)}.\\n\\\\]\\n\\nRovnici jednodruhov\u00e9 populace pak
  m\u016f\u017eeme zapsat jako:\\n\\n\\\\[\\nx(t + \\\\Delta t) = x(t) + (b(x, t)
  - d(x, t))x(t) \\\\Delta t. \\\\tag{4.3}\\n\\\\]\\n\\nNeboli:\\n\\n\\\\[\\n\\\\frac{x(t
  + \\\\Delta t) - x(t)}{\\\\Delta t} = \\\\gamma(x, t)x(t), \\\\tag{4.4}\\n\\\\]\\n\\nkde
  \\\\( \\\\gamma(x, t) = b(x, t) - d(x, t) \\\\) vyjad\u0159uje rozd\u00edl relativn\u00ed
  porodnosti a relativn\u00ed \u00famrtnosti.\\n\\nPro limitn\u00ed p\u0159\u00edpad
  $\\\\Delta t \\\\to 0$ dostaneme diferenci\u00e1ln\u00ed rovnici ve tvaru:\\n\\n$$x''(t)
  = \\\\gamma(x, t)x(t),$$\\n\\n(4.5)\\n\\nkterou ozna\u010dujeme jako **obecn\u00e9
  deterministick\u00e9 vyj\u00e1d\u0159en\u00ed dynamiky stavu populace**.\\n\\nPokud
  lze tento stav popsat spojitou funkc\u00ed, pou\u017e\u00edv\u00e1me **spojit\u00e9
  deterministick\u00e9 modely**.\\n\\nZ biologick\u00e9ho hlediska lze tento stav
  popsat spojitou funkc\u00ed pokud plat\u00ed, \u017ee populace $x(t)$ je dostate\u010dn\u011b
  velk\u00e1, abychom nemuseli po\u010d\u00edtat s jednotlivci a z\u00e1rove\u0148
  jsou v\u0161ichni jedinci populace bez v\u011bkov\u00e9ho rozli\u0161en\u00ed (tzn.
  populace je jednotn\u00e1 z hlediska jedinc\u016f v produk\u010dn\u00edm v\u011bku).\\n\\nPokud
  nen\u00ed n\u011bkter\u00e1 z v\u00fd\u0161e uveden\u00fdch podm\u00ednek spln\u011bna,
  nem\u016f\u017eeme pou\u017e\u00edt spojit\u00e9 modely. Lze pak pou\u017e\u00edt
  n\u011bkter\u00fd z diskr\u00e9tn\u00edch model\u016f.\\n\\n**P\u0159\u00edklad**\\n\\nJednoduch\u00fdm
  p\u0159\u00edkladem pou\u017eit\u00ed spojit\u00e9ch deterministick\u00fdch model\u016f
  m\u016f\u017ee b\u00fdt rovnice, kde polo\u017e\u00edme:\\n\\n$$\\\\gamma(x, t)
  = 1.$$\\n\\nDostaneme diferenci\u00e1ln\u00ed rovnici ve tvaru:\\n\\n$$x''(t) =
  x(t).$$\\n\\n\u0158e\u0161en\u00edm t\u00e9to rovnice je pak\\n\\n$$x(t) = Ce^t,$$\\n\\nkde
  $C \\\\in \\\\mathbb{R}$.\\n\\nP\u0159id\u00e1n\u00edm po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednky\\n\\n$$x(0) = 100$$\\n\\nz\u00edsk\u00e1me konkr\u00e9tn\u00ed hodnotu
  konstanty $C$ vyj\u00e1d\u0159en\u00edm z rovnice:\\n\\n$$x(0) = Ce^0,$$\\n\\ntedy\\n\\n\\\\[
  C = 100. \\\\]\\n\\n\u0158e\u0161en\u00edm po\u010d\u00e1te\u010dn\u00ed \u00falohy
  je pak:\\n\\n\\\\[ x(t) = 100e^t. \\\\]\\n\\n### 4.1.1 Spojit\u00e9 deterministick\u00e9
  modely jednodruhov\u00fdch populac\u00ed pomoc\u00ed diferenci\u00e1ln\u00edch rovnic
  se zpo\u017ed\u011bn\u00edm\\n\\nU model\u016f jednodruhov\u00fdch populac\u00ed
  podle rovnice:\\n\\n\\\\[ x''(t) = f(x(t)) \\\\] (4.6)\\n\\np\u0159edpokl\u00e1d\u00e1me,
  \u017ee jednotlivci populace jsou schopni reprodukce ihned v okam\u017eiku sv\u00e9ho
  narozen\u00ed. V realit\u011b se ale naopak \u010dasto setk\u00e1v\u00e1me s t\u00edm,
  \u017ee dan\u00fd jednotlivec pot\u0159ebuje po sv\u00e9m zrozen\u00ed ur\u010dit\u00fd
  \u010dasov\u00fd interval k dosa\u017een\u00ed schopnosti reprodukce. Tedy je rychlost
  rozmno\u017eov\u00e1n\u00ed \u010dasto ovlivn\u011bna stavem v minulosti rozd\u00edln\u011b
  o st\u0159edn\u00ed dobu \\\\( \\\\tau \\\\) pot\u0159ebnou k z\u00edsk\u00e1n\u00ed
  reproduk\u010dn\u00ed schopnosti.\\n\\nT\u00edm se pak dost\u00e1v\u00e1me ke zpo\u017ed\u011bn\u00ed,
  kter\u00e9 do rovnice jednodruhov\u00e9 populace za\u010dlen\u00edme.\\n\\n**Definice
  19.** (Jednodruhov\u00e1 populace pomoc\u00ed diferenci\u00e1ln\u00ed rovnice se
  zpo\u017ed\u011bn\u00edm)\\n\\nModel jednodruhov\u00e9 populace pomoc\u00ed diferenci\u00e1ln\u00ed
  rovnice se zpo\u017ed\u011bn\u00edm zapisujeme ve tvaru:\\n\\n\\\\[ x''(t) = f(x(t),
  x(t - \\\\tau)). \\\\] (4.7)\\n\\n### 4.1.2 Diskr\u00e9tn\u00ed deterministick\u00e9
  modely jednodruhov\u00fdch populac\u00ed pomoc\u00ed diferenci\u00e1ln\u00edch rovnic
  se zpo\u017ed\u011bn\u00edm\\n\\nU populac\u00ed, kde se vyskytuj\u00ed jedinci
  pouze z jedn\u00e9 generace u\u017e\u00edv\u00e1me diskr\u00e9tn\u00edch hodnot,
  kter\u00e9 vyjad\u0159uj\u00ed stav populace v ur\u010dit\u00e9 \u010d\u00e1sti
  v\u00fdvoje (jako je z\u00e1rodek, ml\u00e1d\u011b, dosp\u011bl\u00fd jedinec atd.).
  Tyto hodnoty jsou definov\u00e1ny pomoc\u00ed \u010dasov\u00e9ho intervalu doby,
  kter\u00e1 uplyne od zrozen\u00ed z\u00e1rodku po dosp\u011blost.\\n\\nDefinice
  20. (Diskr\u00e9tn\u00ed model jednodruhov\u00e9 populace)\\nDiskr\u00e9tn\u00ed
  model jednodruhov\u00e9 populace zapisujeme pomoc\u00ed diferen\u010dn\u00ed rovnice:\\n\\n\\\\[
  x_{n+1} = f(x_n, x_{n-1}, x_{n-2}, \\\\ldots, x_{n-k}), \\\\]  \\n\\n(4.8)\\n\\nkde
  \\\\( n, k \\\\in \\\\mathbb{N}, \\\\) \\\\( n > k \\\\) a \\\\( x_{n+1} \\\\) je
  po\u010det jedinc\u016f \\\\( n \\\\) plus prvn\u00ed generace, \\\\( x_n \\\\)
  po\u010det jedinc\u016f zkouman\u00e9 generace, \\\\( x_{n-1} \\\\) po\u010det jedinc\u016f
  p\u0159edchoz\u00ed generace atd.\\n\\nPo\u010det jedinc\u016f n\u00e1sleduj\u00edc\u00ed
  generace je tedy ur\u010den \\\\( k + 1 \\\\) po sob\u011b jdouc\u00edmi p\u0159edch\u00e1zej\u00edc\u00edmi
  generacemi.\\n\\nV jednodu\u0161\u0161\u00edm p\u0159\u00edpad\u011b lze n\u00e1sleduj\u00edc\u00ed
  generaci vyj\u00e1d\u0159it pomoc\u00ed funkce po\u010dtu jedinc\u016f pouze p\u0159edch\u00e1zej\u00edc\u00ed
  generace:\\n\\n\\\\[ x_{n+1} = f(x_n). \\\\]  \\n\\n(4.9)\\n\\nV p\u0159\u00edpad\u011b,
  \u017ee v dan\u00e9 populaci pot\u0159ebujeme zahrnout dosp\u00edv\u00e1n\u00ed
  del\u0161\u00ed ne\u017e z\u00e1kladn\u00ed \u010dasov\u00fd krok m\u011b\u0159\u00edtka,
  pot\u0159ebujeme op\u011bt zahrnout \u010dasov\u00e9 zpo\u017ed\u011bn\u00ed \\\\(
  \\\\tau \\\\) generac\u00ed.\\n\\nDynamiku takov\u00fdch populac\u00ed potom zap\u00ed\u0161eme
  pomoc\u00ed diferen\u010dn\u00ed rovnice.\\n\\nDefinice 21. (Diskr\u00e9tn\u00ed
  model jednodruhov\u00e9 populace se zpo\u017ed\u011bn\u00edm)\\nDiskr\u00e9tn\u00ed
  model jednodruhov\u00e9 populace se zpo\u017ed\u011bn\u00edm definujeme rovnic\u00ed
  ve tvaru:\\n\\n\\\\[ x_{n+1} = f(x_n, x_{n-\\\\tau}). \\\\]  \\n\\n(4.10)\\n\\n4.2
  Modely dvoudruhov\u00fdch populac\u00ed pomoc\u00ed diferenci\u00e1ln\u00edch rovnic
  se zpo\u017ed\u011bn\u00edm\\n\\nV situaci, kdy \u017eije v jedn\u00e9 oblasti v\u00edce
  druh\u016f, b\u00fdv\u00e1 vz\u00e1jemn\u00fdm sou\u017eit\u00edm ovlivn\u011bna
  dynamika ka\u017ed\u00e9 z t\u011bchto populac\u00ed. V nejjednodu\u0161\u0161\u00edm
  p\u0159\u00edpad\u011b se zam\u011b\u0159\u00edme na situace, kde jsou takov\u00e9
  druhy dva, tedy tzv. dvoudruhov\u00e9 populace.\\n\\nKlasifikovat pot\u00e9 m\u016f\u017eeme
  i vz\u00e1jemn\u00fd vliv t\u011bchto dvou populac\u00ed. Jednoduch\u00fdm rozd\u011blen\u00edm
  vlivu na kladn\u00fd, z\u00e1porn\u00fd a neutr\u00e1ln\u00ed m\u016f\u017eeme vytvo\u0159it
  z\u00e1kladn\u00ed typy vz\u00e1jemn\u00e9 interakce, jako nap\u0159\u00edklad:\\n\\n-
  mutualismus, kde \u017eij\u00ed ob\u011b populace ve vz\u00e1jemn\u00e9 symbi\u00f3ze
  (ka\u017ed\u00e1 m\u00e1 na druhou kladn\u00fd vliv, maj\u00ed tedy ze sou\u017eit\u00ed
  prosp\u011bch),\\n- opa\u010dnou konkurenci, kde maj\u00ed ob\u011b populace vz\u00e1jemn\u011b
  \u0161patn\u00fd vliv na druhou,\\n- neutralismus, kde je vz\u00e1jemn\u00fd vztah
  neutr\u00e1ln\u00ed,\\n- nebo velmi \u010dast\u00fd typ dravec-ko\u0159ist, kde
  jedna populace prosp\u00edv\u00e1 na \u00fakor druh\u00e9.\\n\\n4.2.1 Modely dravec-ko\u0159ist\\n\\nOzna\u010dme
  \\\\((\\\\Delta x)_n\\\\) po\u010det ko\u0159\u00edst\u00ed narozen\u00fdch v \u010dasov\u00e9m
  intervalu \\\\(\\\\langle t, t + \\\\Delta t \\\\rangle\\\\).\\n\\nP\u0159edpokl\u00e1d\u00e1me-li
  \u00fam\u011bru mezi \\\\((\\\\Delta x)_n\\\\), po\u010dtem ko\u0159\u00edst\u00ed
  \\\\(x(t)\\\\) v \u010dase \\\\(t\\\\), d\u00e9lkou \u010dasov\u00e9ho intervalu
  \\\\(\\\\Delta t\\\\) a relativn\u00ed porodnost\u00ed \\\\(k_1 > 0\\\\), m\u016f\u017eeme
  p\u0159\u00edr\u016fstek populace ko\u0159isti vyj\u00e1d\u0159it jako:\\n\\n\\\\[\\n(\\\\Delta
  x)_n = k_1 x(t) \\\\Delta t.\\n\\\\]  \\n\\n(4.11)\\n\\nD\u00e1le ozna\u010dme \\\\((\\\\Delta
  x)_u\\\\) po\u010det ko\u0159\u00edst\u00ed uloven\u00fdch po\u010dtem dravc\u016f
  \\\\(y(t)\\\\) v \u010dasov\u00e9m intervalu \\\\(\\\\langle t, \\\\Delta t \\\\rangle\\\\).
  Pak je \\\\((\\\\Delta x)_u\\\\) \u00fam\u011brn\u00fd d\u00e9lce intervalu \\\\(\\\\Delta
  t\\\\), po\u010dtu vz\u00e1jemn\u00fdch setk\u00e1n\u00ed jedinc\u016f obou druh\u016f
  a pravd\u011bpodobnosti \\\\(k_2 > 0\\\\) setk\u00e1n\u00ed dravce s ko\u0159ist\u00ed,
  kter\u00e9 skon\u010d\u00ed z\u00e1hubou ko\u0159isti.\\n\\nPotom \\\\((\\\\Delta
  x)_u\\\\) m\u016f\u017eeme zapsat do rovnosti jako:\\n\\n\\\\[\\n(\\\\Delta x)_u
  = k_2 x(t) y(t) \\\\Delta t.\\n\\\\]  \\n\\n(4.12)\\n\\nCelkovou zm\u011bnu stavu
  ko\u0159\u00edst\u00ed za dobu $\\\\Delta t$ m\u016f\u017eeme zapsat jako rozd\u00edl:\\n\\n$$\\\\Delta
  x = (\\\\Delta x)_n - (\\\\Delta x)_u = k_1 x(t) \\\\Delta t - k_2 x(t)y(t) \\\\Delta
  t = \\\\Delta t (k_1 x(t) - k_2 x(t)y(t)). \\\\quad (4.13)$$\\n\\nObdobn\u011b p\u0159edpokl\u00e1dejme
  \u00fam\u011bru mezi po\u010dtem dravc\u016f $(\\\\Delta y)_n$ narozen\u00fdch za
  dobu $\\\\Delta t$, po\u010dtem vz\u00e1jemn\u00fdch setk\u00e1n\u00ed dravc\u016f
  s ko\u0159ist\u00ed, dobou $\\\\Delta t$ a konstantou $k_p > 0$, vyjad\u0159uj\u00edc\u00ed
  \u00fa\u010dinnost p\u0159em\u011bny biomasy ko\u0159isti na biomasu dravce. Konstantu
  $k_3 > 0$ pak vyj\u00e1d\u0159\u00edme jako $k_2 \\\\cdot k_p$.\\n\\nPak m\u016f\u017eeme
  zapsat rovnost:\\n\\n$$(\\\\Delta y)_n = k_3 x(t)y(t) \\\\Delta t. \\\\quad (4.14)$$\\n\\nStejn\u00fdm
  principem vyj\u00e1d\u0159\u00edme \u00fam\u011bru \u00fabytku v populaci dravc\u016f
  $(\\\\Delta y)_u$ jako:\\n\\n$$(\\\\Delta y)_u = k_4 y(t) \\\\Delta t, \\\\quad
  (4.15)$$\\n\\nkde $y(t)$ je populace dravc\u016f v \u010dase $t$ a $k_4 > 0$ konstanta
  vyjad\u0159uj\u00edc\u00ed relativn\u00ed \u00famrtnost dravc\u016f.\\n\\nNyn\u00ed
  m\u016f\u017eeme celkovou zm\u011bnu v populaci dravc\u016f vyj\u00e1d\u0159it vztahem:\\n\\n$$\\\\Delta
  y = (\\\\Delta y)_n - (\\\\Delta y)_u = k_3 x(t)y(t) \\\\Delta t - k_4 y(t) \\\\Delta
  t = \\\\Delta t (k_3 x(t)y(t) - k_4 y(t)) \\\\quad (4.16)$$\\n\\nPro limitn\u00ed
  p\u0159\u00edpad $\\\\Delta t \\\\to 0$ pak dost\u00e1v\u00e1me obecn\u00fd tvar
  rovnice dravec-ko\u0159ist.\\n\\n**Definice 22.** (Model dravec-ko\u0159ist)\\n\\nModel
  dravec-ko\u0159ist obecn\u011b vyjad\u0159ujeme pomoc\u00ed syst\u00e9mu diferenci\u00e1ln\u00edch
  rovnic ve tvaru:\\n\\n$$x''(t) = k_1 x(t) - k_2 x(t)y(t) \\\\quad (4.17)$$\\n$$y''(t)
  = k_3 x(t)y(t) - k_4 y(t). \\\\quad (4.18)$$\\n\\nLze tedy vid\u011bt, \u017ee pokud
  je po\u010det dravc\u016f $y(t)$ nulov\u00fd, populace ko\u0159isti neomezen\u011b
  roste, jeliko\u017e p\u0159edpokl\u00e1d\u00e1me, \u017ee konstanty $k_1, k_2, k_3,
  k_4$ jsou kladn\u00e1 \u010d\u00edsla. Naopak pokud je nulov\u00fd po\u010det ko\u0159isti
  $x(t)$, hyne populace dravc\u016f.\\n\\n126.96.36.199 Model dravec-ko\u0159ist pomoc\u00ed
  diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm\\n\\nU v\u00fd\u0161e
  uveden\u00e9 soustavy diferenci\u00e1ln\u00edch rovnic nyn\u00ed p\u0159edpokl\u00e1d\u00e1me,
  \u017ee r\u016fst populace pred\u00e1tor\u016f odpov\u00edd\u00e1 zm\u011bn\u00e1m
  po\u010dtu dravc\u016f a ko\u0159isti se zpo\u017ed\u011bn\u00edm $\\\\tau$. Po
  p\u0159id\u00e1n\u00ed konstanty $K$ zna\u010d\u00edc\u00ed kapacitu prost\u0159ed\u00ed
  dost\u00e1v\u00e1me rovnice ve tvaru (viz [1]).\\n\\nDefinice 23. (Model dravec-ko\u0159ist
  pomoc\u00ed diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm)\\n\\n\\\\begin{align}\\nx''(t)
  &= k_1 \\\\left(1 - \\\\frac{x(t)}{K}\\\\right)x(t) - k_2 x(t)y(t) \\\\\\\\\\ny''(t)
  &= k_3 x(t-\\\\tau)y(t-\\\\tau) - k_4 y(t).\\n\\\\end{align}\\n\\n4.2.2 Model dravec-ko\u0159ist,
  metoda krok\u016f\\n\\nV t\u00e9to \u010d\u00e1sti je uveden v\u00fdpo\u010det rovnic
  metody dravec-ko\u0159ist analyticky pomoc\u00ed metody krok\u016f. V knize [1]
  je u v\u00fd\u0161e zm\u00edn\u011bn\u00e9ho tvaru rovnice poznamen\u00e1no, \u017ee
  metodou krok\u016f \u0159e\u0161it lze.\\n\\nPo\u010d\u00e1te\u010dn\u00ed podm\u00ednky
  jsou zjednodu\u0161eny. Ve v\u00fdpo\u010dtu je tedy uva\u017eov\u00e1no: $k_1 =
  k_2 = k_3 = k_4 = 1$, nav\u00edc je zanedb\u00e1n vliv kapacity prost\u0159ed\u00ed
  na ko\u0159ist, tedy i cel\u00fd v\u00fdraz $\\\\left(1 - \\\\frac{x(t)}{K}\\\\right)$
  uva\u017eujeme rovn\u00fd 1.\\n\\nTedy dost\u00e1v\u00e1me soustavu ve tvaru:\\n\\n\\\\begin{align}\\nx''(t)
  &= x(t) - x(t)y(t), \\\\\\\\\\ny''(t) &= x(t-\\\\tau)y(t-\\\\tau) - y(t).\\n\\\\end{align}\\n\\nD\u00e1le
  uva\u017eujeme konstantn\u00ed zpo\u017ed\u011bn\u00ed:\\n\\n$$\\\\tau = 2$$\\n\\na
  po\u010d\u00e1te\u010dn\u00ed podm\u00ednky:\\n\\n\\\\begin{align}\\nx(t) &= 10,
  \\\\quad t \\\\leq 0, \\\\\\\\\\ny(t) &= 5, \\\\quad t \\\\leq 0.\\n\\\\end{align}\\n\\nNyn\u00ed
  u\u017e n\u00e1sleduje \u0159e\u0161en\u00ed pomoc\u00ed metody krok\u016f:\\n\\n1)
  \\\\( t \\\\in \\\\langle 0, 2 \\\\rangle \\\\):\\n\\n\\\\[\\ny_1''(t) = 10 \\\\cdot
  5 - y_1 = 50 - y_1\\n\\\\]\\n\\n\\\\[\\n\\\\int \\\\frac{1}{50 - y_1} dy = \\\\int
  1 dt\\n\\\\]\\n\\n\\\\[\\n- \\\\ln |50 - y_1| = t + c_1, \\\\quad \\\\text{kde }
  c_1 \\\\in \\\\mathbb{R}\\n\\\\]\\n\\nObecn\u00e9 \u0159e\u0161en\u00ed: \\\\( y_1
  = ce^{-t} + 50, \\\\ c \\\\in \\\\mathbb{R} \\\\)\\n\\nPo\u010d\u00e1te\u010dn\u00ed
  podm\u00ednka: \\\\( y_1(0) = 5 = c + 50, \\\\ z \\\\ toho: \\\\ c = -45 \\\\)\\n\\n**Partikul\u00e1rn\u00ed
  \u0159e\u0161en\u00ed:** \\\\( y_1(t) = -45e^{-t} + 50. \\\\)\\n\\n\\\\[\\ny_1(2)
  = -45e^{-2} + 50 = 43.9 \\\\ (\\\\text{zaokrouhleno}).\\n\\\\]\\n\\n\\\\[\\nx_1''(t)
  = x_1(t) - x_1(t)(-45e^{-t} + 50) = x_1(1 + 45e^{-t} - 50)\\n\\\\]\\n\\n\\\\[\\n\\\\int
  \\\\frac{1}{x_1} dx = \\\\int (1 + 45e^{-t} - 50) dt\\n\\\\]\\n\\n\\\\[\\n\\\\ln
  |x_1| = -49t - 45e^{-t} + c_1, \\\\ kde \\\\ c_1 \\\\in \\\\mathbb{R}\\n\\\\]\\n\\nObecn\u00e9
  \u0159e\u0161en\u00ed: \\\\( x_1 = ce^{-49t-45e^{-t}}, \\\\ c \\\\in \\\\mathbb{R}
  \\\\)\\n\\nPo\u010d\u00e1te\u010dn\u00ed podm\u00ednka: \\\\( x_1(0) = 10 = ce^{-45},
  \\\\ z \\\\ toho: \\\\ c = 3.49 \\\\cdot 10^{20} \\\\ (\\\\text{zaokrouhleno}).
  \\\\)\\n\\n**Partikul\u00e1rn\u00ed \u0159e\u0161en\u00ed:** \\\\( x_1(t) = 3.49
  \\\\cdot 10^{20} e^{-49t-45e^{-t}}. \\\\)\\n\\n\\\\[\\nx_1(2) = 34.9e^{-98-45e^{-2}}
  = 2.2 \\\\cdot 10^{-44} \\\\ (\\\\text{zaokrouhleno}).\\n\\\\]\\n\\n2) \\\\( t \\\\in
  \\\\langle 2, 4 \\\\rangle \\\\):\\n\\n\\\\[\\ny_2''(t) = x_2(t-2)y_2(t-2) - y_2(t)
  =\\n\\\\]\\n\\n\\\\[\\n3.49 \\\\cdot 10^{20} e^{-49t-45e^{-t}} \\\\cdot (-45e^{-t}
  + 50) - y_2\\n\\\\]\\n\\nTuto rovnici neum\u00edme vy\u0159e\u0161it analyticky.\\n\\n4.2.3
  Model dravec-ko\u0159ist a Wolfram Mathematica\\n\\nV t\u00e9to \u010d\u00e1sti
  je uveden k\u00f3d k v\u00fdpo\u010dtu v\u00fd\u0161e \u0159e\u0161en\u00e9ho (zjednodu\u0161en\u00e9ho)
  tvaru modelu dravec-ko\u0159ist v softwaru Wolfram Mathematica. Cel\u00fd k\u00f3d
  viz obr\u00e1zek 4.1.\\n\\n```mathematica\\nManipulate[\\n Module[{t, x, y, sol},\\n  sol
  = First[NDSolve[{\\n     x''[t] == k1 x[t] - k2 x[t] y[t], x[t /; t <= 0] == pocetx,\\n     y''[t]
  == k3 x[t - \u03c4] y[t - \u03c4] - k4 y[t]},\\n    {x, y}, {t, 0, 2}]];\\n  Plot[Evaluate[{x[t],
  y[t]} /. sol], {t, 0, 2}, WorkingPrecision -> 10,\\n   PlotLegends -> {\\\"x(t)
  = ko\u0159ist\\\", \\\"y(t) = dravci\\\"}],\\n  {{pocetx, 10}, 1, 20},\\n  {{pocety,
  5}, 1, 20},\\n  {{\u03c4, 2}, 0, 10},\\n  {{k1, 1}, 0, 5},\\n  {{k2, 1}, 0, 5},\\n  {{k3,
  1}, 0, 5},\\n  {{k4, 1}, 0, 5}]\\n```\\n\\nObr\u00e1zek 4.1: K\u00f3d\\n\\nJednotliv\u00e9
  parametry jsou po spu\u0161t\u011bn\u00ed programu nastaviteln\u00e9 pomoc\u00ed
  posuvn\u00fdch li\u0161t v r\u00e1mci definovan\u00fdch mezi. Tedy nap\u0159\u00edklad
  `pocetx` vyjad\u0159uj\u00edc\u00ed po\u010d\u00e1te\u010dn\u00ed velikost populace
  ko\u0159isti je na za\u010d\u00e1tku nastaven na hodnotu po\u010d\u00e1te\u010dn\u00ed
  podm\u00ednky, tedy `pocetx = x(t) = 10`, pro \\\\( t \\\\leq 0 \\\\), ale je mo\u017en\u00e9
  pohybovat se v rozmez\u00ed \\\\( x(t) = 1 \\\\) a\u017e \\\\( x(t) = 20 \\\\),
  p\u0159\u00edpadn\u011b nastavit jin\u00e9 rozmez\u00ed jednoduchou zm\u011bnou
  k\u00f3du.\\n\\nPro na\u0161\u00ed volbu vstupn\u00edch parametr\u016f dost\u00e1v\u00e1me
  graf viz obr\u00e1zek 4.2.\\n\\nObr\u00e1zek 4.2: V\u00fdsledek pro z\u00e1kladn\u00ed
  nastaven\u00ed parametr\u016f na intervalu [0, 2]\\n\\nPro kontrolu vypo\u010dten\u00e9ho
  v\u00fdsledku z \u010d\u00e1sti 4.2.2 je v obr\u00e1zku 4.3 vykreslen v\u00fdsledek
  metody krok\u016f.\\n\\nObr\u00e1zek 4.3: Porovn\u00e1n\u00ed v\u00fdsledk\u016f\\n\\nPo
  zhl\u00e9dnut\u00ed obr\u00e1zku 4.3 bychom mohli v\u00e1hat, zda tento model odpov\u00edd\u00e1
  realit\u011b, p\u0159edev\u0161\u00edm zv\u00e1\u017e\u00edme-li rostouc\u00ed populaci
  dravc\u016f v dob\u011b, kdy je ko\u0159ist na pokraji vyhynut\u00ed. M\u016f\u017eeme
  se tedy pod\u00edvat na stejn\u00fd v\u00fdvoj bez zpo\u017ed\u011bn\u00ed $\\\\tau$,
  resp. s $\\\\tau = 0$, viz obr\u00e1zek 4.4.\\n\\nObr\u00e1zek 4.4: V\u00fdsledek
  pro z\u00e1kladn\u00ed nastaven\u00ed parametr\u016f na intervalu $[0, 2]$ bez zpo\u017ed\u011bn\u00ed
  $\\\\tau$\\n\\nPokud bychom vykreslili v\u00fdvoj p\u016fvodn\u00edho modelu se
  zpo\u017ed\u011bn\u00edm i pro nedopo\u010dten\u00fd krok $t \\\\in (2, 4)$, dostali
  bychom v\u00fdsledek viz 4.5.\\n\\nObr\u00e1zek 4.5: V\u00fdsledek pro z\u00e1kladn\u00ed
  nastaven\u00ed parametr\u016f na intervalu $[0, 4]$\\n\\nPo porovn\u00e1n\u00ed
  v\u00fdsledk\u016f z obr\u00e1zk\u016f 4.4 a 4.5 je viditeln\u00e9, \u017ee po zaveden\u00e9m
  zpo\u017ed\u011bn\u00ed rostla populace dravc\u016f d\u011ble, p\u0159esto\u017ee
  ji\u017e nebyl dostatek ko\u0159isti. Tato zm\u011bna je zp\u016fsobena pr\u00e1v\u011b
  zpo\u017ed\u011bn\u00edm $\\\\tau$, v tomto p\u0159\u00edpad\u011b s hodnotou $\\\\tau
  = 2$.\\n\\nProgram n\u00e1m umo\u017e\u0148uje sledovat v\u00fdvoj do mnohem vy\u0161\u0161\u00edch
  \u010das\u016f, ne\u017e jsme schopni vypo\u010d\u00edtat. Nap\u0159\u00edklad tedy
  m\u016f\u017eeme pro p\u016fvodn\u00ed nastaven\u00ed parametr\u016f zobrazit v\u00fdvoj
  pro $t = 0$ a\u017e $t = 60$, viz obr\u00e1zek 4.6.\\n\\n![Obr\u00e1zek 4.6: Del\u0161\u00ed
  \u010dasov\u00fd v\u00fdvoj](image)\\n\\nPro vysok\u00e9 $t$ (nap\u0159. $t = 167$)
  p\u0159i t\u011bchto vstupn\u00edch parametrech vypisuje program chybovou hl\u00e1\u0161ku.
  V\u00fdpo\u010det t\u00e9to soustavy diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm
  je pro vysok\u00e9 \u010dasy pro program Wolfram Mathematica n\u00e1ro\u010dn\u00fd,
  tedy ani p\u0159i jeho pou\u017eit\u00ed nem\u016f\u017eeme o\u010dek\u00e1vat v\u00fdsledky
  pro libovoln\u00e9 $t$. Pokud by \u0161lo jen o n\u011bkolik m\u00e1lo hodnot, kdy
  program NDSolve hl\u00e1s\u00ed singularity v matici v pr\u016fb\u011bhu numerick\u00e9ho
  v\u00fdpo\u010dtu, p\u0159edpokl\u00e1d\u00e1m, \u017ee by se tyto hodnoty daly
  o\u0161et\u0159it nap\u0159. pou\u017eit\u00edm p\u0159\u00edkazu `WhenEvent` a
  v t\u011bchto n\u011bkolika \u010dasech hodnotu prom\u011bnn\u00fdch nevykreslit.\\n\\nOp\u011bt
  by n\u00e1s mohlo zaj\u00edmat, jak bude vypadat tento dlouhodob\u011bj\u0161\u00ed
  v\u00fdvoj pro nulov\u00e9 zpo\u017ed\u011bn\u00ed a pro zpo\u017ed\u011bn\u00ed
  relativn\u011b velk\u00e9.\\n\\nPro $\\\\tau = 0$ se n\u00e1r\u016fst a vym\u00edr\u00e1n\u00ed
  populac\u00ed zna\u010dn\u011b zrychluj\u00ed. Tento cyklus se na stejn\u00e9m \u010dasov\u00e9m
  intervalu $t \\\\in [0, 60]$ odehraje dokonce t\u0159i a p\u016flkr\u00e1t. V\u00fdvoj
  pro $\\\\tau = 0$ je vykreslen na obr\u00e1zku 4.7.\\n\\nPro $\\\\tau = 20$ je n\u00e1r\u016fst
  a vym\u00edr\u00e1n\u00ed populac\u00ed naopak v\u00fdrazn\u011b zpomaleno. V\u00fdvoj
  pro $\\\\tau = 20$ je vykreslen na obr\u00e1zku 4.8.\\n\\nObr\u00e1zek 4.7: Del\u0161\u00ed
  \u010dasov\u00fd v\u00fdvoj pro $\\\\tau = 0$\\n\\nObr\u00e1zek 4.8: Del\u0161\u00ed
  \u010dasov\u00fd v\u00fdvoj pro $\\\\tau = 20$\\n\\nTento model jist\u011b neodpov\u00edd\u00e1
  realit\u011b, uv\u00e1\u017e\u00edme-li nekone\u010dn\u00e9 velikosti populac\u00ed
  zachycen\u00e9 na obr\u00e1zku 4.6. Toto je d\u00e1no zjednodu\u0161en\u00edm modelu
  a zanedbanou kapacitou prost\u0159ed\u00ed. Pokud se vr\u00e1t\u00edme k p\u016fvodn\u00ed
  soustav\u011b rovnic (4.19), m\u016f\u017eeme k\u00f3d (viz obr\u00e1zek 4.1) upravit
  do podoby viz obr\u00e1zek 4.9.\\n\\nHodnoty p\u016fvodn\u00edch parametr\u016f
  tedy z\u016fstaly stejn\u00e9: $k_1 = k_2 = k_3 = k_4 = 1$, $\\\\tau = 2$, $pocetx
  = 10$ $pocety = 5$. Vlo\u017eili jsme ale zp\u011bt v\u00fdraz $\\\\left(1 - \\\\frac{x(t)}{K}\\\\right)$,
  tedy kapacita prost\u0159ed\u00ed nen\u00ed zanedb\u00e1na. Prom\u011bnn\u00e1 $K$
  je v k\u00f3du kv\u016fli intern\u00edm pravidl\u016fm softwaru zna\u010dena $c$
  a je nastavena na hodnotu $c = 60$. Obr\u00e1zek 4.10 zachycuje model pro toto nastaven\u00ed
  parametr\u016f se zapo\u010d\u00edtanou kapacitou prost\u0159ed\u00ed. V porovn\u00e1n\u00ed
  s obr\u00e1zkem 4.6 tento model zachycuje realitu o pozn\u00e1n\u00ed l\u00e9pe.\\n\\nObr\u00e1zek
  4.9: K\u00f3d s kapacitou prost\u0159ed\u00ed\\n\\nObr\u00e1zek 4.10: Model se zapo\u010dtenou
  kapacitou prost\u0159ed\u00ed\\n\\nZ\u00e1v\u011br\\n\\nC\u00edlem t\u00e9to pr\u00e1ce
  bylo popsat diferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm, \u010demu\u017e
  byla detailn\u011b v\u011bnov\u00e1na prvn\u00ed kapitola od p\u0159edstaven\u00ed
  zpo\u017ed\u011bn\u00ed v r\u016fzn\u00fdch podob\u00e1ch po odvozen\u00ed a definov\u00e1n\u00ed
  pojm\u016f syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm,
  po\u010d\u00e1te\u010dn\u00ed podm\u00ednka a po\u010d\u00e1te\u010dn\u00ed \u00faloha
  pro syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm. Z\u00e1rove\u0148
  byl v t\u00e9to kapitole spln\u011bn po\u017eadavek na uveden\u00ed biologick\u00fdch
  model\u016f popsan\u00fdch pomoc\u00ed diferenci\u00e1ln\u00edch rovnic nebo jejich
  soustav. Detailn\u011bji popsan\u00e9 modely v\u010detn\u011b odvozen\u00ed byly
  n\u00e1sledn\u011b uvedeny ve \u010dtvrt\u00e9 kapitole.\\n\\nDal\u0161\u00edm c\u00edlem
  pr\u00e1ce bylo pops\u00e1n\u00ed teorie existence \u0159e\u0161en\u00ed \u00faloh
  se zpo\u017ed\u011bn\u00edm. T\u00e9to problematice byla v\u011bnov\u00e1na kapitola
  druh\u00e1, kde byly definov\u00e1ny podm\u00ednky existence a jednozna\u010dnosti
  \u0159e\u0161en\u00ed pro syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm.\\n\\nVe
  t\u0159et\u00ed kapitole byly seps\u00e1ny poznatky o \u0159e\u0161en\u00ed diferenci\u00e1ln\u00edch
  rovnic s konstantn\u00edm zpo\u017ed\u011bn\u00edm. Byly zde nast\u00edn\u011bny
  dv\u011b metody, Metoda krok\u016f a Laplaceova transformace, spo\u010d\u00edvaj\u00edc\u00ed
  v (lok\u00e1ln\u00ed) transformaci diferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm
  na oby\u010dejnou diferenci\u00e1ln\u00ed rovnici. Z\u00e1rove\u0148 zde byly p\u0159edstaveny
  p\u0159\u00edklady \u0159e\u0161en\u00e9 odpov\u00eddaj\u00edc\u00ed metodou.\\n\\nPosledn\u00ed
  kapitola otev\u0159ela t\u00e9ma modelov\u00e1n\u00ed v\u00fdvoje populac\u00ed.
  Jsou zde odvozeny modely v\u00fdvoje jednodruhov\u00e9 a dvoudruhov\u00e9 populace.
  U dvoudruhov\u00fdch populac\u00ed byly uvedeny z\u00e1kladn\u00ed typy vz\u00e1jemn\u00e9
  interakce, z nich\u017e byl detailn\u011bji zkoum\u00e1n vztah dravec-korist. Pro
  tento model byl proveden v\u00fdpo\u010det metodou krok\u016f. N\u00e1sledn\u011b
  byl spln\u011bn posledn\u00ed z c\u00edl\u016f, \u0159e\u0161en\u00ed p\u0159\u00edkladu
  pomoc\u00ed po\u010d\u00edta\u010de. Pro stejn\u00fd model byl seps\u00e1n k\u00f3d
  v softwaru Wolfram Mathematica, kter\u00fd umo\u017e\u0148uje (pomoc\u00ed posuvn\u00fdch
  li\u0161t) m\u011bnit nastaven\u00ed konstant a po\u010d\u00e1te\u010dn\u00edch
  podm\u00ednek v definovan\u00e9m rozsahu. V\u00fdsledky v\u00fdpo\u010dtu metodou
  krok\u016f se pro stejn\u00e1 po\u010d\u00e1te\u010dn\u00ed nastaven\u00ed s v\u00fdsledkem
  software shoduj\u00ed. Nav\u00edc je sepsan\u00fd program vhodn\u00fd pro v\u00fdpo\u010dty
  dlouhodob\u011bj\u0161\u00edho v\u00fdvoje.\\n\\nVhodn\u00fdm roz\u0161\u00ed\u0159en\u00edm
  t\u00e9to pr\u00e1ce by bylo zkoum\u00e1n\u00ed dal\u0161\u00edch metod pro \u0159e\u0161en\u00ed
  diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm, p\u0159\u00edpadn\u011b
  hlub\u0161\u00ed pr\u016fzkum uveden\u00fdch re\u00e1ln\u00fdch model\u016f v prvn\u00ed
  kapitole pr\u00e1ce. K\u00f3d ve \u010dtvrt\u00e9 kapitole by mohl b\u00fdt velmi
  jednodu\u0161e upraven pro jin\u00e9 hodnoty, \u010di jejich v\u011bt\u0161\u00ed
  rozmez\u00ed, i pro kompletn\u011b jin\u00e9 modely. D\u00e1le by bylo mo\u017en\u00e9
  dodat k pr\u00e1ci historick\u00e1 data t\u00fdkaj\u00edc\u00ed se uveden\u00fdch
  model\u016f a cel\u00e9 discipl\u00edny diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm.\\n\\n[1]
  Driver Rodney David, Ordinary and Delay differential equations, New York, Springer,
