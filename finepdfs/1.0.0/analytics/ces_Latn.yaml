  auditora\\no ov\u011b\u0159en\u00ed konsolidovan\u00e9 \u00fa\u010detn\u00ed z\u00e1v\u011brky\\nspole\u010dnosti\\nCARBOUNION
  HOLDING, a.s.\\nk 31.12.2017\\n\\nZPR\u00c1VA NEZ\u00c1VISL\u00c9HO AUDITORA\\no
  ov\u011b\u0159en\u00ed konsolidovan\u00e9 \u00fa\u010detn\u00ed z\u00e1v\u011brky
  spole\u010dnosti CARBOUNION HOLDING, a.s.\\n\\nSe s\u00eddlem: U Vorl\u00edk\u016f
  353/17, Bubene\u010d, 160 00 Praha 6\\nIdentifika\u010dn\u00ed \u010d\u00edslo:
  046 68 995\\nHlavn\u00ed p\u0159edm\u011bt podnik\u00e1n\u00ed: pron\u00e1jem a
  spr\u00e1va nemovitost\u00ed\\n\\nTato zpr\u00e1va nez\u00e1visl\u00e9ho auditora
  o ov\u011b\u0159en\u00ed \u00fa\u010detn\u00ed z\u00e1v\u011brky je ur\u010dena
  spole\u010dn\u00edk\u016fm spole\u010dnosti CARBOUNION HOLDING, a.s.\\n\\nV\u00fdrok
  aud\u00edtora\\n\\nProvedli jsme audit p\u0159ilo\u017een\u00e9 konsolidovan\u00e9
  \u00fa\u010detn\u00ed z\u00e1v\u011brky obchodn\u00ed spole\u010dnosti CARBOUNION
  HOLDING, a.s. (d\u00e1le tak\u00e9 \u201eSpole\u010dnost\u201c) sestaven\u00e9 na
  z\u00e1klad\u011b \u010desk\u00fdch \u00fa\u010detn\u00edch p\u0159edpis\u016f,
  kter\u00e1 se skl\u00e1d\u00e1 z rozvahy k 31.12.2017, v\u00fdkazu zisku a ztr\u00e1ty
  za rok kon\u010d\u00edc\u00ed 31.12.2017 a p\u0159\u00edlohy t\u00e9to \u00fa\u010detn\u00ed
  z\u00e1v\u011brky, kter\u00e1 obsahuje popis pou\u017eit\u00fdch podstatn\u00fdch
  \u00fa\u010detn\u00edch metod a dal\u0161\u00ed vysv\u011btluj\u00edc\u00ed informace.
  \u00dadaje o Spole\u010dnosti jsou uvedeny v bod\u011b 1 p\u0159\u00edlohy t\u00e9to
  konsolidovan\u00e9 \u00fa\u010detn\u00ed z\u00e1v\u011brky.\\n\\nPodle na\u0161eho
  n\u00e1zoru konsolidovan\u00e1 \u00fa\u010detn\u00ed z\u00e1v\u011brka pod\u00e1v\u00e1
  v\u011brn\u00fd a poctiv\u00fd obraz aktiv a pasiv spole\u010dnosti CARBOUNION HOLDING,
  a.s. k 31.12.2017 a n\u00e1klad\u016f a v\u00fdnos\u016f a v\u00fdsledku jej\u00edho
  hospoda\u0159en\u00ed za rok kon\u010d\u00edc\u00ed 31.12.2017 v souladu s \u010desk\u00fdmi
  \u00fa\u010detn\u00edmi p\u0159edpisy.\\n\\nZ\u00e1klad pro v\u00fdrok\\n\\nAudit
  jsme provedli v souladu se z\u00e1konem o auditorech a standardy Komory auditor\u016f
  \u010cesk\u00e9 republiky pro audit, kter\u00fdmi jsou mezin\u00e1rodn\u00ed standardy
  pro audit (ISA), p\u0159\u00edpadn\u011b dopln\u011bn\u00e9 a upraven\u00e9 souvisej\u00edc\u00edmi
  aplika\u010dn\u00edmi dolo\u017ekami. Na\u0161e odpov\u011bdnost stanoven\u00e1
  t\u011bmito p\u0159edpisy je podrobn\u011bji pops\u00e1na v odd\u00edlu Odpov\u011bdnost
  auditora za audit \u00fa\u010detn\u00ed z\u00e1v\u011brky. V souladu se z\u00e1konem
  o auditorech a Etick\u00fdm kodexem p\u0159ijat\u00fdm Komorou auditor\u016f \u010cesk\u00e9
  republiky jsme na Spole\u010dnosti nez\u00e1visl\u00ed a splnili jsme i dal\u0161\u00ed
  etick\u00e9 povinnosti vypl\u00fdvaj\u00edc\u00ed z uveden\u00fdch p\u0159edpis\u016f.
  Domn\u00edv\u00e1me se, \u017ee d\u016fkazn\u00ed informace, kter\u00e9 jsme shrom\u00e1\u017edili,
  poskytuj\u00ed dostate\u010dn\u00fd a vhodn\u00fd z\u00e1klad pro vyj\u00e1d\u0159en\u00ed
  na\u0161eho v\u00fdroku.\\n\\nOdpov\u011bdnost statut\u00e1rn\u00edho org\u00e1nu
  Spole\u010dnosti za \u00fa\u010detn\u00ed z\u00e1v\u011brku\\n\\nStatut\u00e1rn\u00ed
  org\u00e1n Spole\u010dnosti odpov\u00edd\u00e1 za sestaven\u00ed konsolidovan\u00e9
  \u00fa\u010detn\u00ed z\u00e1v\u011brky pod\u00e1vaj\u00edc\u00ed v\u011brn\u00fd
  a poctiv\u00fd obraz v souladu s \u010desk\u00fdmi \u00fa\u010detn\u00edmi p\u0159edpisy,
  a za takov\u00fd vnit\u0159n\u00ed kontroln\u00ed syst\u00e9m, kter\u00fd pova\u017euje
  za nezbytn\u00fd pro sestaven\u00ed \u00fa\u010detn\u00ed z\u00e1v\u011brky tak,
  aby neobsahovala v\u00fdznamn\u00e9 (materi\u00e1ln\u00ed) nespr\u00e1vnosti zp\u016fsoben\u00e9
  podvodem nebo chybou.\\n\\nP\u0159i sestavov\u00e1n\u00ed \u00fa\u010detn\u00ed
  z\u00e1v\u011brky je statut\u00e1rn\u00ed org\u00e1n Spole\u010dnosti povinen posoudit,
  zda je Spole\u010dnost schopna nep\u0159etr\u017eit\u011b trvat, a pokud je to relevantn\u00ed,
  popsat v p\u0159\u00edloze \u00fa\u010detn\u00ed z\u00e1v\u011brky z\u00e1le\u017eitosti
  t\u00fdkaj\u00edc\u00ed se jej\u00edho nep\u0159etr\u017eit\u00e9ho trv\u00e1n\u00ed
  a pou\u017eit\u00ed p\u0159edpokladu nep\u0159etr\u017eit\u00e9ho trv\u00e1n\u00ed
  p\u0159i sestaven\u00ed \u00fa\u010detn\u00ed z\u00e1v\u011brky, s v\u00fdjimkou
  p\u0159\u00edpad\u016f, kdy statut\u00e1rn\u00ed org\u00e1n pl\u00e1nuje zru\u0161en\u00ed
  Spole\u010dnosti nebo ukon\u010den\u00ed jej\u00ed \u010dinnosti, resp. kdy nem\u00e1
  jinou re\u00e1lnou mo\u017enost ne\u017e tak u\u010dinit.\\n\\n**Odpov\u011bdnost
  auditora za audit konsolidovan\u00e9 \u00fa\u010detn\u00ed z\u00e1v\u011brky**\\n\\nNa\u0161\u00edm
  c\u00edlem je z\u00edskat p\u0159im\u011b\u0159enou jistotu, \u017ee konsolidovan\u00e1
  \u00fa\u010detn\u00ed z\u00e1v\u011brka jako celek neobsahuje v\u00fdznamnou (materi\u00e1ln\u00ed)
  nespr\u00e1vnost zp\u016fsobenou podvodem nebo chybou a vydat zpr\u00e1vu auditora
  obsahuj\u00edc\u00ed na\u0161 v\u00fdrok. P\u0159im\u011b\u0159en\u00e1 m\u00edra
  jistoty je velk\u00e1 m\u00edra jistoty, nicm\u00e9n\u011b nen\u00ed z\u00e1rukou,
  \u017ee audit proveden\u00fd v souladu s v\u00fd\u0161e uveden\u00fdmi p\u0159edpisy
  ve v\u0161ech p\u0159\u00edpadech v konsolidovan\u00e9 \u00fa\u010detn\u00ed z\u00e1v\u011brce
  odhal\u00ed p\u0159\u00edpadnou existuj\u00edc\u00ed v\u00fdznamnou (materi\u00e1ln\u00ed)
  nespr\u00e1vnost. Nespr\u00e1vnosti mohou vznikat v d\u016fsledku podvod\u016f nebo
  chyb a pova\u017euj\u00ed se za v\u00fdznamn\u00e9 (materi\u00e1ln\u00ed), pokud
  lze re\u00e1ln\u011b p\u0159edpokl\u00e1dat, \u017ee by jednotliv\u00e9 nebo v souhrnu
  mohly ovlivnit ekonomick\u00e1 rozhodnut\u00ed, kter\u00e1 u\u017eivatel\u00e9 \u00fa\u010detn\u00ed
  z\u00e1v\u011brky na jej\u00edm z\u00e1klad\u011b p\u0159ij\u00edmaj\u00ed.\\n\\nP\u0159i
  prov\u00e1d\u011bn\u00ed auditu v souladu s v\u00fd\u0161e uveden\u00fdmi p\u0159edpisy
  je na\u0161\u00ed povinnost\u00ed uplat\u0148ovat b\u011bhem cel\u00e9ho auditu
  odborn\u00fd \u00fasudek a zachov\u00e1vat profesn\u00ed skepticismus. D\u00e1le
  je na\u0161\u00ed povinnosti:\\n\\n- Identifikovat a vyhodnotit rizika v\u00fdznamn\u00e9
  (materi\u00e1ln\u00ed) nespr\u00e1vnosti konsolidovan\u00e9 \u00fa\u010detn\u00ed
  z\u00e1v\u011brky zp\u016fsoben\u00e9 podvodem nebo chybou, navrhnout a prov\u00e9st
  auditorsk\u00e9 postupy reaguj\u00edc\u00ed na tato rizika a z\u00edskat dostate\u010dn\u00e9
  a vhodn\u00e9 d\u016fkazn\u00ed informace, abychom na jejich z\u00e1klad\u011b mohli
  vyj\u00e1d\u0159it v\u00fdrok. Riziko, \u017ee neodhal\u00edme v\u00fdznamnou (materi\u00e1ln\u00ed)
  nespr\u00e1vnost, k n\u00ed\u017e do\u0161lo v d\u016fsledku podvodu, je v\u011bt\u0161\u00ed
  ne\u017e riziko neodhalen\u00ed v\u00fdznamn\u00e9 (materi\u00e1ln\u00ed) nespr\u00e1vnosti
  zp\u016fsoben\u00e9 chybou, proto\u017ee sou\u010d\u00e1st\u00ed podvodu mohou b\u00fdt
  tajn\u00e9 dohody (kaluze), fa\u0161lov\u00e1n\u00ed, um\u011bl\u00fdm opomenut\u00ed,
  nepravdiv\u00e1 prohl\u00e1\u0161en\u00ed nebo obch\u00e1zen\u00ed vn\u011bj\u0161\u00edch
  kontrol p\u0159edstavenstvem.\\n- Sezn\u00e1mit se s vnit\u0159n\u00edm kontroln\u00edm
  syst\u00e9mem Spole\u010dnosti relevantn\u00edm pro audit v takov\u00e9m rozsahu,
  abychom mohli navrhnout auditorsk\u00e9 postupy vhodn\u00e9 s ohledem na dan\u00e9
  okolnosti, nikoli abychom mohli vyj\u00e1d\u0159it n\u00e1zor na \u00fa\u010dinnost
  jej\u00edho vnit\u0159n\u00edho kontroln\u00edho syst\u00e9mu.\\n- Posoudit vhodnost
  pou\u017eit\u00fdch \u00fa\u010detn\u00edch pravidel, p\u0159im\u011b\u0159enost
  proveden\u00fdch \u00fa\u010detn\u00edch odhad\u016f a informace, kter\u00e9 v t\u00e9to
  souvislosti p\u0159edstavenstvo Spole\u010dnosti uvedlo v p\u0159\u00edloze \u00fa\u010detn\u00ed
  z\u00e1v\u011brky.\\n- Posoudit vhodnost p\u0159edpokladu nep\u0159etr\u017eit\u00e9ho
  trv\u00e1n\u00ed p\u0159i sestaven\u00ed \u00fa\u010detn\u00ed z\u00e1v\u011brky
  p\u0159edstavenstvem a ta, zda s ohledem na shrom\u00e1\u017ed\u011bn\u00e9 d\u016fkazn\u00ed
  informace existuje v\u00fdznamn\u00e1 (materi\u00e1ln\u00ed) nejistota vypl\u00fdvaj\u00edc\u00ed
  z ud\u00e1lost\u00ed nebo podm\u00ednek, kter\u00e9 mohou v\u00fdznamn\u011b zpochybnit
  schopnost Spole\u010dnosti nep\u0159etr\u017eit\u011b trvat. Jestli\u017ee dojdeme
  k z\u00e1v\u011bru, \u017ee takov\u00e1 v\u00fdznamn\u00e1 (materi\u00e1ln\u00ed)
  nejistota existuje, je na\u0161\u00ed povinnosti upozornit v na\u0161\u00ed zpr\u00e1v\u011b
  na informace uveden\u00e9 v t\u00e9to souvislosti v p\u0159\u00edloze \u00fa\u010detn\u00ed
  z\u00e1v\u011brky, a pokud tyto informace nejsou dostate\u010dn\u00e9, vyj\u00e1d\u0159it
  modifikovan\u00fd v\u00fdrok. Na\u0161e z\u00e1v\u011bry t\u00fdkaj\u00edc\u00ed
  se schopnosti Spole\u010dnosti nep\u0159etr\u017eit\u011b trvat vych\u00e1zej\u00ed
  z d\u016fkazn\u00edch informac\u00ed, kter\u00e9 jsme z\u00edskali do data na\u0161\u00ed
  zpr\u00e1vy. Nicm\u00e9n\u011b budouc\u00ed ud\u00e1losti nebo podm\u00ednky mohou
  v\u00e9st k tomu, \u017ee Spole\u010dnost ztrat\u00ed schopnost nep\u0159etr\u017eit\u011b
  trvat.\\n- Vyhodnotit celkovou prezentaci, \u010dlen\u011bn\u00ed a obsah konsolidovan\u00e9
  \u00fa\u010detn\u00ed z\u00e1v\u011brky, v\u010detn\u011b p\u0159\u00edlohy, a d\u00e1le
  to, zda konsolidovan\u00e1 \u00fa\u010detn\u00ed z\u00e1v\u011brka zobrazuje podkladov\u00e9
