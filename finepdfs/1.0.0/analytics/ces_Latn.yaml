  1     |\\n\\nKONSTRUKCE\\n\\nJednotka je vestav\u011bn\u00fd ventil\u00e1tor sm\u00ed\u0161en\u00e9ho
  pr\u016ftoku. T\u011blo ventil\u00e1toru je vyrobena z ocelov\u00fdch plech\u016f
  (s vyu\u017eit\u00edm tepeln\u011b a zvukov\u011b izola\u010dn\u00edch materi\u00e1l\u016f
  pro modely Dalap AP quiet). Krou\u017eky p\u0159ipojen\u00ed jsou kulat\u00e9. Ventil\u00e1tor
  je vybaven motorem, kter\u00fd m\u00e1 ob\u011b\u017en\u00e9 kolo s \u00fahlop\u0159\u00ed\u010dn\u00fdmi
  lopatkami. Motor m\u00e1 v\u00fdstup na tepeln\u00e9 rel\u00e9. Kontakt je zabudovan\u00fd
  do vinut\u00ed motoru pro ochranu proti p\u0159eh\u0159\u00e1t\u00ed (TW). Rel\u00e9
  mus\u00ed b\u00fdt v\u017edy p\u0159ipojena. Pou\u017eit\u00ed motoru s kuli\u010dkov\u00fdmi
  lo\u017eisky se speci\u00e1ln\u011b zvolen\u00fdm mazivem zajist\u00eduje bezhluchov\u00fd
  a bez\u00fadr\u017ebov\u00fd provoz ventil\u00e1toru. Sm\u011br proud\u011bn\u00ed
  vzduchu je vyzna\u010den \u0161ipkou na krytu ventil\u00e1toru.\\n\\nKONSTRUKCE
  A PROVOZN\u00cd LOGIKA\\n\\nDalap AP quiet\\n\\nV\u00fdfuk\\n\\nKryt\\nMotor\\nVentilatory
  Dalap AP quiet jsou vybaveny krytem pro pohlcov\u00e1n\u00ed \u0161umu\\nOb\u011b\u017en\u00e9
  kolo\\n\\nMONT\u00c1\u017d A NASTAVEN\u00cd\\n\\nP\u0159e\u010dt\u011bte si u\u017eivatelskou
  p\u0159\u00edru\u010dku p\u0159ed mont\u00e1\u017e\u00ed jednotky\\n\\nP\u0159\u00edstroj
  mus\u00ed b\u00fdt namontov\u00e1n pouze kvalifikovan\u00fdm odborn\u00edkem, \u0159\u00e1dn\u011b
  vy\u0161kolen\u00fdm a vybaven\u00fd pot\u0159ebn\u00fdmi n\u00e1stroji a materi\u00e1ly\\n\\nVentil\u00e1tor
  Dalap AP quiet je zav\u011b\u0161en na mont\u00e1\u017en\u00ed plochu skrz z\u00e1vitovou
  ty\u010d upevn\u011bnou uvnit\u0159 expanzn\u00ed kotvy. Dalap AP quiet je vhodn\u00fd
  pro horizont\u00e1ln\u00ed i vertik\u00e1ln\u00ed instalaci pomoc\u00ed upev\u0148ovac\u00ed
  konzoly. Ventil\u00e1tor je ur\u010den pro mont\u00e1\u017e do kruhov\u00e9ho potrub\u00ed.
  Ventil\u00e1tory jsou instalov\u00e1ny mezi vzduchov\u00fdm potrub\u00edm. Sk\u0159\u00edn\u011b
  je vybavena upev\u0148ovac\u00edmi konzolami pro snadn\u011bj\u0161\u00ed instalaci
  ventil\u00e1toru. B\u011bhem instalace za\u0159\u00edzen\u00ed zajist\u011bte pohodln\u00fd
  p\u0159\u00edstup pro n\u00e1slednou \u00fadr\u017ebu a opravu. Upev\u0148ovac\u00ed
  prvky pro mont\u00e1\u017e ventil\u00e1toru nejsou sou\u010d\u00e1st\u00ed dod\u00e1vky
  a je nutn\u00e9 je objednat zvl\u00e1\u0161\u0165. P\u0159i v\u00fdb\u011bru upev\u0148ovac\u00edch
  prvk\u016f zv\u00e1\u017eit materi\u00e1l mont\u00e1\u017en\u00ed plochy i hmotnost
  jednotky, viz \u010d\u00e1st Technick\u00e9 \u00fadaje. Upev\u0148ovac\u00ed prvky
  pro mont\u00e1\u017e jednotky by m\u011bly b\u00fdt zvoleny servisn\u00edm technikem.\\n\\nPro
  dosa\u017een\u00ed nejlep\u0161\u00edch v\u00fdkon\u016f ventil\u00e1toru a minimalizaci
  tlakov\u00fdch ztr\u00e1t zp\u016fsoben\u00fdch turbulenc\u00ed p\u0159ipojte p\u0159\u00edm\u00fd
  vzduchov\u00fd pr\u016fchod k pouzdr\u016fm na obou stran\u00e1ch jednotky p\u0159i
  mont\u00e1\u017ei.\\n\\nMinim\u00e1ln\u00ed d\u00e9lka p\u0159\u00edm\u00e9ho vzduchov\u00e9ho
  kan\u00e1lu:\\n- rovn\u00fd 1 pr\u016fm\u011bru vzduchov\u00e9ho potrub\u00ed na
  stran\u011b s\u00e1n\u00ed\\n- rovn\u00e1 se 3 pr\u016fm\u011bry vzduchov\u00fdch
  kan\u00e1lk\u016f na stran\u011b v\u00fdstupu\\n\\nPokud jsou vzduchov\u00e9 kan\u00e1ly
  p\u0159\u00edli\u0161 kr\u00e1tk\u00e9 nebo nejsou p\u0159ipojeny, chr\u00e1\u0148te
  \u010d\u00e1sti p\u0159\u00edstroje p\u0159ed vniknut\u00edm ciz\u00edch p\u0159edm\u011bt\u016f.\\n\\nAby
  se zabr\u00e1nilo nekontrolovateln\u00e9mu p\u0159\u00edstupu k ventil\u00e1toru,
  mohou b\u00fdt \u010depy pokryty ochrannou m\u0159\u00ed\u017ekou nebo jin\u00fdm
  ochrann\u00fdm za\u0159\u00edzen\u00edm o \u0161\u00ed\u0159ce ok nejvy\u0161\u0161e
  12,5 mm.\\n\\n**MONT\u00c1\u017d VENTIL\u00c1TORU Dalap AP quiet**\\n\\nVAROV\u00c1N\u00cd!
  Upev\u0148ovac\u00ed prvky jsou nen\u00ed sou\u010d\u00e1st\u00ed dod\u00e1vky!\\n\\n-
  Matici\\n- Podlo\u017eka\\n- Guma na utlumen\u00ed vibrac\u00ed\\n- Podlo\u017eka\\n-
  Matici\\n- Z\u00e1vitov\u00e1 ty\u010d\\n\\nmin 800 mm\\n\\nP\u0159\u00edstup ke
  svorkovnici\\n\\n1. Odsroubujte \u0161rouby, kter\u00e9 spojuj\u00ed svorku na upev\u0148ovac\u00ed
  konzolu pomoc\u00ed kl\u00ed\u010de p\u0159\u00edslu\u0161n\u00e9 velikosti.\\n\\n2.
  Upevn\u011bte dr\u017e\u00e1ky na povrch pomoc\u00ed \u0161roub\u016f s hmo\u017edinkami
  odpov\u00eddaj\u00edc\u00ed velikosti (nejsou sou\u010d\u00e1st\u00ed dod\u00e1vky).\\n\\n3.
  Zajist\u011bte ventil\u00e1tor na dr\u017e\u00e1ku se svorkami a \u0161rouby d\u0159\u00edve
  odstran\u011bn\u00fdmi. Ventil\u00e1tor pe\u010dliv\u011b odstavte. Ujist\u011bte
  se, \u017ee je ventil\u00e1tor p\u0159ed provozem bezpe\u010dn\u011b p\u0159ipevn\u011bn.\\n\\nVentil\u00e1tor
  je dimenzov\u00e1n pro p\u0159ipojen\u00ed k jednof\u00e1zov\u00e9mu nebo t\u0159\u00edf\u00e1zov\u00e9mu
  s\u00ed\u0165ov\u00e9mu nap\u00e1jen\u00ed 230 V nebo 400 V podle n\u00ed\u017ee
  uveden\u00fdch sch\u00e9mat zapojen\u00ed. Ozna\u010den\u00ed svorek je um\u00edst\u011bno
  uvnit\u0159 svorkovnice. Ozna\u010den\u00ed svorek odpov\u00edd\u00e1 ozna\u010den\u00ed
  na sch\u00e9matu zapojen\u00ed.\\n\\nP\u0159ipojte ventil\u00e1tor k elektrick\u00e9
  s\u00edt\u00ed pomoc\u00ed izolovan\u00fdch, odoln\u00fdch a tepeln\u011b odoln\u00fdch
  kabel\u016f (kably, vodi\u010de) s p\u0159\u00edslu\u0161n\u00fdm pr\u016f\u0159ezem.
  Kabely jsou vedeny do svorkovnicov\u00e9ho krabice p\u0159es ut\u011bsn\u011bn\u00fd
  p\u0159\u00edvod pro spln\u011bn\u00ed po\u017eadavk\u016f na elektrickou t\u0159\u00eddu
  bezpe\u010dnosti. Ventil\u00e1tor mus\u00ed b\u00fdt p\u0159ipojen k nap\u00e1jec\u00edmu
  zdroji prost\u0159ednictv\u00edm extern\u00edho jisti\u010de s tepeln\u011b-magnetick\u00fdm
  vypnut\u00edm. Jmenovit\u00fd proud jisti\u010de nesm\u00ed b\u00fdt ni\u017e\u0161\u00ed
  ne\u017e jmenovit\u00e1 spot\u0159eba proudu.\\n\\n| MODEL                  | SCH\u00c9MA
