  email@example.com\\n\\nCen\u00edk a objedn\u00e1vka: www.praha10.cz/mesicnikpraha10\\n\\nVy\u0161lo
  v Praze 1. prosince 2023 / Uz\u00e1v\u011brka p\u0159\u00ed\u0161t\u00edho \u010d\u00edsla
  10. prosince 2023 / Vych\u00e1z\u00ed 11x ro\u010dn\u011b\\n\\nIlustrace na ob\u00e1lce:
  Nikola Logosov\u00e1\\n\\nTexty neozna\u010den\u00e9 jm\u00e9nem autora jsou redak\u010dn\u00edm
  d\u00edlem. Ve\u0161ker\u00e9 n\u00e1m\u011bty, p\u0159ipom\u00ednky \u010di nab\u00eddky
  na spolupr\u00e1ci pos\u00edlejte na v\u00fd\u0161e uvedenou adresu redakce m\u011bs\u00ed\u010dn\u00edku
  Praha 10.\\n\\nVESM\u00cdRN\u00c1 MISE V SRN\\n\\nD\u00edky n\u011bkolikalet\u00e9
  spolupr\u00e1ci s AWO Schullandheim im Vogtland vyj\u00ed\u017ed\u011bj\u00ed \u017e\u00e1ci
  Z\u0160 Jakutsk\u00e1 pravideln\u011b za sportem a kreativitou do SRN na t\u00fddenn\u00ed
  tematick\u00e9 pobytu. Klub KMD p\u0159i Z\u0160 Jakutsk\u00e1, kter\u00fd se v\u011bnuje
  b\u00e1d\u00e1n\u00ed v oblasti p\u0159\u00edrodn\u00edch v\u011bd, v leto\u0161n\u00edm
  \u0161koln\u00edm roce op\u011bt vyu\u017eil nab\u00eddku od Asociace mal\u00fdch
  debruj\u00e1\u0159\u016f \u010cR na pobyt v N\u011bmecku. Spole\u010dn\u011b s n\u011bmeck\u00fdmi
  d\u011btmi z M\u00fdlau pro\u017eili na\u0161i \u017e\u00e1ci t\u00fdden pln\u00fd
  zaj\u00edmav\u00fdch vesm\u00edrn\u00fdch a sportovn\u00edch aktivit. Vyr\u00e1b\u011bli
  funk\u010dn\u00ed raketov\u00e9 modely s doletem a\u017e 150 metr\u016f, ryzovali
  zlato, sj\u00ed\u017ed\u011bli bobovou dr\u00e1hu a p\u0159i lesn\u00edm rallye
  a sportovn\u00ed olympi\u00e1d\u011b prov\u011b\u0159ili sv\u00e9 fyzick\u00e9 schopnosti
  a v\u0161eobecn\u00e9 znalosti. Velk\u00fdm z\u00e1\u017eitkem tak\u00e9 byla n\u00e1v\u0161t\u011bva
  vesm\u00edrn\u00e9 stanice MIR v obci Morgenr\u00f6the-Rautenkranz a skokansk\u00e9ho
  m\u016fstku v Klingenthalu. Se z\u00e1kladn\u00edmi n\u011bmeck\u00fdmi slov\u00ed\u010dky
  se sezn\u00e1movali v pr\u016fb\u011bhu cel\u00e9ho pobytu, ale p\u0159edev\u0161\u00edm
  p\u0159i celodenn\u00ed \u010desko-n\u011bmeck\u00e9 animaci, pln\u00e9 dvojjazy\u010dn\u00fdch
  komunika\u010dn\u00edch a pohybov\u00fdch her, kter\u00e9 pro ob\u011b skupiny p\u0159ipravila
  \u010desk\u00e1 organizace Tandem.\\n\\n\u2014 Mgr. Zdenka Ko\u010dkov\u00e1\\n\\nNAD\u011aJE
  M\u00cdSTN\u00cdHO GYMNASTICK\u00c9HO KLUBU CORRIDOOR\\n\\n\u010casto jsme se v
  na\u0161ich p\u0159edchoz\u00edch \u010dl\u00e1nc\u00edch v\u011bnovali \u00fasp\u011bch\u016fm
  na\u0161ich vynikaj\u00edc\u00edch z\u00e1vodnic \u2013 \u017een, ale tentokr\u00e1t
  se zam\u011b\u0159\u00edme na jinou inspirativn\u00ed str\u00e1nku gymnastick\u00e9ho
  klubu Corridoor. V na\u0161\u00ed r\u016fznorod\u00e9 a nad\u011bjn\u00e9 rodin\u011b
  gymnast\u016f m\u00e1me tak\u00e9 mu\u017ee. A mezi t\u011bmi nejlep\u0161\u00edmi
  je Michal Gorochov. Ji\u017e nyn\u00ed se d\u00edky sv\u00e9 vytv\u00e1\u0159alosti
  dok\u00e1zal st\u00e1t jedni\u010dkou gymnastick\u00e9ho aerobiku v \u010cesk\u00e9
  republice. Na leto\u0161n\u00edm Cantanhede Open v Portugalsku sout\u011b\u017eil
  Michal s elitn\u00edmi gymnasty z cel\u00e9ho sv\u011bta a dos\u00e1hl skv\u011bl\u00e9ho
  4. m\u00edsta. Na presti\u017en\u00edch mezin\u00e1rodn\u00edch z\u00e1vodech Slovak
  a Czech Open se shodn\u011b um\u00edstil na 3. m\u00edst\u011b. Na sout\u011b\u017ei
  Plovdiv Cup v Bulharsku skon\u010dili na p\u011bkn\u00e9m 6. m\u00edst\u011b a z
  \u0159\u00edjnov\u00e9ho z\u00e1vodu na Slovensku si odvezl zlatou medaili. Jeho
  p\u0159\u00edb\u011bh je motivac\u00ed nejen pro na\u0161e mal\u00e9 \u010dleny,
  ale tak\u00e9 pro ty, kte\u0159\u00ed hledaj\u00ed sport poskytuj\u00edc\u00ed kompletn\u00ed
  fyzickou p\u0159\u00edpravu a ment\u00e1ln\u00ed odolnost. Pokud m\u00e1te z\u00e1jem
  o tento dynamick\u00fd sport a chcete se st\u00e1t sou\u010d\u00e1st\u00ed na\u0161\u00ed
  gymnastick\u00e9 rodiny, nev\u00e1hejte se n\u00e1s zeptat na dal\u0161\u00ed informace.\\n\\n\u2014
  Eli\u0161ka Strako\u0161ov\u00e1\\nfoto: Tom\u00e1\u0161 Kr\u00ed\u017e\\n\\nHALLOWEENSK\u00c1
  P\u00c1RTY\\n\\nVe v\u0161ech odd\u011blen\u00edch \u0161koln\u00ed dru\u017einy
  Z\u0160 Gutova se 31. 10. 2023 vyrojili kostivci, duchov\u00e9, \u010darod\u011bjnice,
  zombie a dal\u0161\u00ed nadp\u0159irozen\u00e9 bytosti, aby spole\u010dn\u011b
  oslavili sv\u00e1tek Halloween. Pan\u00ed vychovatelky si ve sv\u00fdch odd\u011blen\u00edch
  p\u0159ipravily pestr\u00fd a z\u00e1bavn\u00fd program s r\u016fzn\u00fdmi hrami,
  sout\u011b\u017eemi, diskot\u00e9kou a samoz\u0159ejm\u011b nechyb\u011blo ani ob\u010derstven\u00ed
  slo\u017een\u00e9 ze sam\u00fdch dobrot, kter\u00e9 si podle chuti p\u0159inesly
  d\u011bti z domova. P\u00e1rty se vyda\u0159ila a d\u011bti odch\u00e1zej\u00ed
  dom\u016f spokojen\u00e9.\\n\\nMOJE STOPA VE \u0160KOLE JI\u017d POT\u0158ET\u00cd\\n\\nVe
  dvan\u00e1cti ze t\u0159in\u00e1cti z\u00e1kladn\u00edch \u0161kol z\u0159izovan\u00fdch
  Prahou 10 odstartoval t\u0159et\u00ed ro\u010dn\u00edk participa\u010dn\u00edho
  rozpo\u010dtu Moje stopa ve \u0161kole. Projekt \u017e\u00e1k\u016fm v praxi ukazuje,
  jak funguje ob\u010dansk\u00e1 participace, a z\u00e1rove\u0148 je u\u010d\u00ed
  praktick\u00fdm dovednostem.\\n\\nPrincip Moje stopy je jednoduch\u00fd. Ka\u017ed\u00fd
  \u017e\u00e1k ze zapojen\u00e9 \u0161koly m\u016f\u017ee vymyslet projekt, z\u00edskat
  pro n\u011bj podporu u sv\u00fdch spolu\u017e\u00e1k\u016f a hlasovat pro n\u011bj.
  P\u0159i hled\u00e1n\u00ed n\u00e1pad\u016f se fantazii meze nekladou. Mus\u00ed
  v\u0161ak koresponduvat s prost\u0159edky, kter\u00e9 jsou k dispozici. Ka\u017ed\u00e1
  \u0161kola m\u00e1 35 tis\u00edc korun.\\n\\n\u0158e\u0161\u00ed se t\u0159eba zveleben\u00ed
  \u0161koln\u00edch zahrad nebo prostor, kde \u017e\u00e1ci tr\u00e1v\u00ed p\u0159est\u00e1vky.
  V jednom z p\u0159edchoz\u00edch ro\u010dn\u00edk\u016f se nap\u0159\u00edklad hlasovalo
  pro po\u0159\u00edzen\u00ed 3D tisk\u00e1rny k podpo\u0159en\u00ed technick\u00e9
  v\u00fduky a v\u00fdrob\u011b dopl\u0148k\u016f na \u0161koln\u00ed akce.\\n\\nT\u0159et\u00ed
  ro\u010dn\u00edk Moje stopy za\u010dal v z\u00e1\u0159\u00ed, kdy prob\u011bhlo
  setk\u00e1n\u00ed \u0161koln\u00edch koordin\u00e1tor\u016f, jeho\u017e c\u00edlem
  bylo sd\u00edlen\u00ed poznatk\u016f mezi zku\u0161en\u00fdmi koordin\u00e1tory
  a nov\u00e1\u010dky. V \u0159\u00edjnu \u0161koly sb\u00edraly a posuzovaly projekty,
  v listopadu pak prob\u011bhly kampan\u011b jednotliv\u00fdch projekt\u016f a celo\u0161koln\u00ed
  hlasov\u00e1n\u00ed. V\u00edt\u011bzn\u00fdm projektem budeme v dal\u0161\u00edm
  vyd\u00e1n\u00ed m\u011bs\u00ed\u010dn\u00edku v\u011bnovat samostatn\u00fd \u010dl\u00e1nek.\\n\\nKU\u017dELK\u00c1\u0158KY
  V EVROPSK\u00c9M POH\u00c1RU\\n\\nKu\u017eelk\u00e1rky Slavia Praha se po zisku
  st\u0159\u00edbrn\u00e9 medaile v lize a v\u00edt\u011bzstv\u00ed v \u010cesk\u00e9m
  poh\u00e1ru z\u00fa\u010dastnily Evropsk\u00e9ho poh\u00e1ru klubov\u00fdch dru\u017estev.
  Tato akce prob\u011bhla ve m\u011bst\u011b Br\u010dko v Bosn\u011b a Hercegovin\u011b.
  V siln\u00e9 konkurenci se dru\u017estvo po kvalifikaci probobojovalo do Final four.
  Zde v\u0161ak u\u017e nesta\u010dilo na poloprofesion\u00e1ln\u00ed t\u00fdmy a
  obsadilo kone\u010dn\u00e9 4. m\u00edsto. Na z\u00e1klad\u011b tohoto v\u00fdsledku
  bude hr\u00e1t osmifin\u00e1le Ligy mistr\u016f. Soupe\u0159em bude n\u011bmeck\u00fd
  t\u00fdm KV Liebsdheim. Prvn\u00ed z\u00e1pas se uskute\u010dn\u00ed v N\u011bmecku.
  Odveta se pak odehraje 9. 12. 2023 v Praze.\\n\\n\u2014 Lubo\u0161 Zelenka\\n\\nST\u011aHUJEME
