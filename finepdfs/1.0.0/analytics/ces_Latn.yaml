  | Z\u00e1b\u011bhlice   |\\n\\nM\u00e1me lep\u0161\u00ed m\u00edsto pro va\u0161e
  star\u00e9 pneumatiky\\n\\nZdarma m\u016f\u017eete odevzdat va\u0161e star\u00e9
  pneumatiky ve sb\u011brn\u00e9m dvo\u0159e.\\n\\nSeznam sb\u011brn\u00fdch dvor\u016f:
  odpady.praha.eu\\n\\n30. prosince uplyne 164 let od narozen\u00ed Josefa Bohuslava
  Foerstra, v\u00fdznamn\u00e9ho \u010desk\u00e9ho hudebn\u00edho skladatele, pedagoga,
  spisovatele a hudebn\u00edho kritika. P\u0159i proch\u00e1zk\u00e1ch Stra\u0161nicemi
  nem\u016f\u017eeme minout Foerstrovu ulici, jej\u00ed\u017e jm\u00e9no p\u0159ipom\u00edn\u00e1,
  \u017ee zde \u017eil pr\u00e1v\u011b zm\u00edn\u011bn\u00fd skladatel. Ulice nese
  tento n\u00e1zev od roku 1947. P\u0159ejmenov\u00e1na tak byla je\u0161t\u011b za
  skladatelova \u017eivota, co\u017e nen\u00ed zcela obvykl\u00e9. J. B. Foerster
  se narodil v Praze a poch\u00e1zel z kantorsk\u00e9ho rodu s dlouhoro\u010dnou hudebn\u00ed
  tradic\u00ed. V roce 1879 se rozhodl pro hudebn\u00ed dr\u00e1hu, opustil n\u011bmeckou
  techniku a vstoupil na varhanickou \u0161kolu. V letech 1893 a\u017e 1918 p\u016fsobil
  se svou \u017eenou, slavnou (... pokra\u010dov\u00e1n\u00ed v tajemstv\u00ed), v
  Hamburku a V\u00eddni, kde se v\u011bnoval sv\u00e9 skladatelsk\u00e9, pedagogick\u00e9
  a \u017eurnalistick\u00e9 \u010dinnosti. V letech 1931 a\u017e 1939 byl prezidentem
  \u010cesk\u00e9 akademie v\u011bd a um\u011bn\u00ed. V roce 1936 jeho prvn\u00ed
  man\u017eelka zem\u0159ela. Se svou druhou man\u017eelkou Olgou se v roce 1938 p\u0159est\u011bhoval
  do Stra\u0161nic. Jako prvn\u00ed hudebn\u00edk z\u00edskal roku 1945 titul n\u00e1rodn\u00ed
  um\u011blec.\\n\\nJ. B. Foerster ve sv\u00e9m d\u00edle zhudebnil Nerudovy a Sl\u00e1dkovy
  b\u00e1sn\u011b, d\u00e1le je autorem \u0161esti oper, p\u011bti symfonii, symfonick\u00fdch
  b\u00e1sn\u00ed, instrument\u00e1ln\u00edch koncert\u016f, skladeb komorn\u00edch
  a klav\u00edrn\u00edch, \u010dty\u0159 m\u0161\u00ed, stovky skladeb pro sbory a
  p\u00edsni (mimo jin\u00e9 Or\u00e1\u010d, Velk\u00e9 \u0161\u00edr\u00e9 rodn\u00e9
  l\u00e1ny, Z osudu rukou). V roce 1919 vznikla Foerstera spole\u010dnost, kter\u00e1
  se dodnes pod\u00edl\u00ed na propagaci jeho d\u00edla.\\n\\nSpr\u00e1vn\u00e9 zn\u011bn\u00ed
  tajenky n\u00e1m za\u0161lete e-mailem (firstname.lastname@example.org), nebo po\u0161tou
  (Praha 10, m\u011bstsk\u00fdm m\u011bstsk\u00e9 \u010d\u00e1sti, Vinohradsk\u00e1
