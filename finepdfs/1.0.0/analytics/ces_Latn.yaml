  z\u00e1v\u011brky: 31. prosince 2017\\n\\nKonsolidovan\u00e9 v\u00fdkazy tvo\u0159\u00ed
  p\u0159\u00edlohu \u010d\u00edslo 7, \u00fa\u010detn\u00ed jednotky byly konsolidov\u00e1ny
  plnou metodou.\\n\\nIC Profil Karlatolt Felel\u0151ss\u00e9gi T\u00e1rsas\u00e1g\\nS\u00eddlo:
  8200 Veszpr\u00e9m, R\u00e1k\u00f3czi utca 5, Ma\u010farsko\\nVznik: 21.8.2014\\nVlastnictv\u00ed:
  10%\\nDatum \u00fa\u010detn\u00ed z\u00e1v\u011brky: 31. prosince 2017\\n\\nZ uveden\u00e9ho
  pod\u00edlu vlastnictv\u00ed vypl\u00fdv\u00e1 uplat\u0148ovan\u00fd rozhoduj\u00edc\u00ed
  vliv u spole\u010dnost\u00ed CARBOUNION BOHEMIA, spol. s r.o., Humatex, a.s., Emeran
  1860 s.r.o., CARBOUNION SLOVAKIA, s.r.o., Carbounion Austria GmbH, CARBOSPED, spol.
  s r.o.i a CARBOUNION INVEST, spol s r.o. Tyto \u00fa\u010detn\u00ed z\u00e1v\u011brky
  byly konsolidov\u00e1ny metodou pln\u00e9 konsolidace.\\n\\nSpole\u010dnost PURS
  akciov\u00e1 spole\u010dnost a spole\u010dnost IC Profil byly konsolidov\u00e1ny
  metodou ekvivalence. Spole\u010dnosti CARBOSPED, spol. s r.o. a CARBOUNION INVEST,
