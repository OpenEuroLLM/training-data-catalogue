  21     | com Re   | spole\u010dn\u00fd p\u00f3l sp\u00edna\u010d\u016f 1..8 |\\n\\n5.
  Mont\u00e1\u017e\\n\\nExpanzn\u00ed modul 8OPW mus\u00ed b\u00fdt zamontov\u00e1n
  v rozv\u00e1d\u011b\u010di. Je ur\u010den pro mont\u00e1\u017e na li\u0161tu DIN35mm.
  Na t\u00e9to li\u0161ti se pojistit z\u00e1mkem (sou\u010d\u00e1st plastov\u00e9ho
  pouzdra) a sou\u010dasn\u011b se m\u016f\u017ee zajistit proti bo\u010dn\u00edmu
  pohybu nap\u0159. dv\u011bma ukon\u010dovac\u00edmi svorkami DIN.\\n\\n5.1. P\u0159\u00edvodn\u00ed
  kabely\\n\\nNap\u00e1jec\u00ed kabel:\\nD\u00e9lka nap\u00e1jec\u00edho kabelu nen\u00ed
  omezena, pr\u016f\u0159ez vodi\u010de mus\u00ed zajistit po\u017eadavky proudov\u00e9ho
  odb\u011bru. Pokud je p\u0159\u00edvod del\u0161\u00ed ne\u017e 5m je p\u0159edeps\u00e1n
  st\u00edn\u011bn\u00fd kabel nap\u0159. typ JYTY, apod, jeho\u017e stinici folie
  se p\u0159ipoji do jednoho m\u00edsta na svorku PE (v rozv\u00e1d\u011b\u010di).\\n\\nM\u011b\u0159ic\u00ed
  kabely:\\nD\u00e9lka p\u0159\u00edvodn\u00edch kabel\u016f nen\u00ed omezena pokud
  jsou zaru\u010deny elektrick\u00e9 parametry pro spr\u00e1vnou funk\u010dnost jednotliv\u00fdch
  vstup\u016f \u010di v\u00fdstup\u016f (nap\u011b\u0165ov\u00e9 a proudov\u00e9 \u00farovn\u011b).
  Kabely jsou p\u0159edeps\u00e1ny st\u00edn\u011bn\u00e9 nap\u0159. typ JYTY, JQTQ,
  JYSTY, SYKFY apod. Stinici folie ka\u017ed\u00e9ho kabelu se p\u0159ipoj\u00ed do
  jednoho m\u00edsta na svorku PE (v rozv\u00e1d\u011b\u010di).\\n\\nKomunika\u010dn\u00ed
  kabely:\\nD\u00e9lka kabelu I2C nesm\u00ed p\u0159es\u00e1hnout 1m.\\n\\n5.2. Konfigurace\\n\\nSyst\u00e9m
  se dod\u00e1v\u00e1 nakonfigurov\u00e1n na p\u0159\u00edslu\u0161nou adresu I2C
  dle objedn\u00e1vky. P\u0159\u00edpadn\u00e1 zm\u011bna adresy I2C je mo\u017en\u00e1
  po odklopen\u00ed v\u00ed\u010dka modulu. Adresa se nastavuje bin\u00e1rn\u011b
  propojkami v rozsahu 0..7.\\n\\n6. V\u00fdrobn\u00ed nastaven\u00ed\\n\\nSvorkovnice
  jsou osazeny na v\u0161ech vstupech/v\u00fdstupech.\\nAdresa je nastavena na 0.\\n\\n7.
  \u00dadr\u017eba\\n\\nZa\u0159\u00edzen\u00ed nevy\u017eaduje pravidelnou kontrolu
  ani \u00fadr\u017ebu. Jeho provoz je monitorov\u00e1n za\u0159\u00edzen\u00edm master
  na sb\u011brnici I2C.\"", "\"DALAP AP QUIET\\n\\nInline fan - Ducts fan\\n\\nOBSAH\\n\\nBezpe\u010dnostn\u00ed
