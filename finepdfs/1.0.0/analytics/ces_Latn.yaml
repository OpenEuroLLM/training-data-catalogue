  \u010d\u00edsel.\\n\\n\u00dahrnn\u00fd limit V\u00e1m je stanoven COOP Mobilem v
  z\u00e1vislosti na tarifu, o\u010dek\u00e1van\u00e9 \u00fatrat\u011b a po\u010dtu
  SIM na vy\u00fa\u010dtov\u00e1n\u00ed.\\n\\nNav\u00fd\u0161en\u00ed nebo sn\u00ed\u017een\u00ed
