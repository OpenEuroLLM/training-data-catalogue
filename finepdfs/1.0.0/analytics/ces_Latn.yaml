  si poslechli poh\u00e1dku Popelka.\\n\\nN\u00e1v\u0161t\u011bva se n\u00e1m kr\u00e1sn\u011b
  hodila do na\u0161eho t\u00e9matu Poh\u00e1dkov\u00fd t\u00fdden. D\u011btem se
  spole\u010dnost poh\u00e1dkov\u00e9 babi\u010dky velmi l\u00edbila a budeme doufat,
  \u017ee se za n\u00e1mi n\u011bkdy op\u011bt p\u0159ijde pod\u00edvat.\"", "\"Letn\u00ed
  virtu\u00e1ln\u00ed hry spoj\u00ed sportovce z cel\u00e9ho sv\u011bta. Sice bez
  kruh\u016f i ohn\u011b, ale se stejn\u00fdm nad\u0161en\u00edm.\\n\\nVirtu\u00e1ln\u00ed
  z\u00e1vody mohou b\u00fdt sportovn\u00edm zpest\u0159en\u00edm va\u0161\u00ed dovolen\u00e9.
  Mohou b\u00fdt testem va\u0161\u00ed formy. Nebo t\u0159eba jen z\u00e1bavou, kterou
  si u\u017eijete s p\u0159\u00e1teli. Virtu\u00e1ln\u00ed z\u00e1vody se stali fenom\u00e9nem
  a produktem doby covidov\u00e9, p\u0159i\u010dem\u017e Letn\u00ed virtu\u00e1ln\u00ed
  hry jsou vrcholem sez\u00f3ny. Propoj\u00ed skute\u010dn\u00e9 sportov\u00e1n\u00ed
  s online sv\u011btem a budete se do nich moci zapojit hned v n\u011bkolika discipl\u00edn\u00e1ch.
  Registrace i \u00fa\u010dast jsou p\u0159itom zdarma.\\n\\nPozornost sportovn\u00edch
  fanou\u0161k\u016f z cel\u00e9ho sv\u011bta bude brzy up\u0159ena na jedin\u00e9
  m\u00edsto \u2013 do japonsk\u00e9ho Tokia, kde v p\u016flce \u010dervence odstartuj\u00ed
  Olympijsk\u00e9 hry. V term\u00ednu od 16.7. \u2013 15.8. se k nim ale bude moct
  na d\u00e1lku p\u0159idat ka\u017ed\u00fd z n\u00e1s. Na programu Letn\u00edch virtu\u00e1ln\u00edch
  her jsou b\u011bh, cyklistika, triatlon, plav\u00e1n\u00ed a ch\u016fze. \u00da\u010dastnit
  se ve sv\u00fdch kategori\u00edch mohou i d\u011bti.\\n\\nMotivace pro za\u010d\u00e1te\u010dn\u00edky,
  test pro zku\u0161en\u00e9\\n\\nObejdou se bez ohn\u011b i bez vlajky s p\u011bti
  kruhy. Z\u00e1bavu a vzru\u0161en\u00ed ale nab\u00eddnou stejn\u00e9 jako skute\u010dn\u00e9
  hry. Projekt Letn\u00ed virtu\u00e1ln\u00ed hry navazuje na popul\u00e1rn\u00ed
  Virtu\u00e1ln\u00ed b\u011bhy a cykloj\u00edzdy, do kter\u00fdch se u\u017e druh\u00fdm
  rokem pravideln\u011b zapoj\u00ed stovky tis\u00edc \u010desk\u00fdch b\u011b\u017ec\u016f.
  Z\u00e1rove\u0148 bude prob\u00edhat i celosv\u011btov\u00fd z\u00e1vod Summer virtual
  games (summervirtualgames.com) a ka\u017ed\u00fd \u00fa\u010dastn\u00edk se tak
  automaticky zapoj\u00ed do celosv\u011btov\u00e9ho sportovn\u00edho happeningu.
  Nez\u00e1le\u017e\u00ed p\u0159itom na v\u00fdkonnosti, v\u011bku ani pohlav\u00ed.\\n\\nPrincip
  je jednoduch\u00fd: na webu www.letnivirtualnihry.cz se b\u011bhem n\u011bkolika
  vte\u0159in zaregistrujete k z\u00e1vod\u016fm, kter\u00e9 v\u00e1s nejv\u00edce
  oslov\u00ed. N\u00e1sledn\u011b vybranou discipl\u00ednu absolvujete ve skute\u010dn\u00e9m
  sv\u011bt\u011b a sv\u016fj v\u00fdkon zm\u011b\u0159\u00edte sportovn\u00edmi hodinkami,
  jakoukoli aplikac\u00ed v telefonu \u010di vyfot\u00edte \u010das na stopk\u00e1ch.
  Nakonec u\u017e jen prost\u0159ednictv\u00edm odkazu v e-mailu nahrajete na web
  Letn\u00edch virtu\u00e1ln\u00edch her. V\u0161e je zdarma.\\n\\n\u201ePopularita
  Virtu\u00e1ln\u00edch b\u011bh\u016f velmi rychle roste. Odpad\u00e1 p\u0159i nich
  toti\u017e ve\u0161ker\u00fd ostych, kter\u00fd lidi ob\u010das odrazuje od \u00fa\u010dasti
  na skute\u010dn\u00fdch z\u00e1vodech a umo\u017en\u00ed jim zapojit ve velk\u00e9m
  m\u011b\u0159\u00edtku i d\u011bti. Nemus\u00ed m\u00edt strach, \u017ee je n\u011bkdo
  uvid\u00ed nebo \u017ee skon\u010d\u00ed posledn\u00ed. V\u00fdhodou je i to, \u017ee
  mohou z\u00e1vod absolvovat b\u011bhem del\u0161\u00edho \u010dasov\u00e9ho okna
  a nemus\u00ed tak pl\u00e1novat rodinn\u00e9 v\u00edkendy podle term\u00ednov\u00e9
  listiny skute\u010dn\u00fdch z\u00e1vod\u016f. Dokonce je mo\u017en\u00e9 ka\u017ed\u00fd
  z\u00e1vod absolvovat v\u00edcekr\u00e1t, nebo si vyzkou\u0161et v\u00edce trat\u00ed.
  Pro v\u00fdkonnostn\u00ed sportovce jsou zase virtu\u00e1ln\u00ed z\u00e1vody z\u00e1bavn\u00fdm
  zpest\u0159en\u00edm tr\u00e9nink\u016f. M\u00e1me prok\u00e1zan\u00e9, \u017ee
  a\u010d jde o z\u00e1vod virtu\u00e1ln\u00ed, sportovci jej podprahov\u011b vn\u00edmaj\u00ed
  a dosahuj\u00ed p\u0159i n\u011bm lep\u0161\u00edch v\u00fdsledk\u016f a mnohdy
  i osobn\u00edch rekord\u016f,\\\" vyjmenov\u00e1v\u00e1 d\u016fvody popularity virtu\u00e1ln\u00edho
  z\u00e1vod\u011bn\u00ed Pavel Kosa\u0159, organiz\u00e1tor Virtu\u00e1ln\u00edch
  b\u011bh\u016f.\\n\\nB\u011bhejte, jezd\u011bte na kole, plavte, zkuste triatlon\\n\\nV
  programu Letn\u00edch virtu\u00e1ln\u00edch her jsou skute\u010dn\u00e9 sporty a
  discipl\u00edny inspirovan\u00e9 nejb\u011b\u017en\u011bj\u0161\u00edmi sv\u011btov\u00fdmi
  sportovn\u00edmi d\u00e9lkami/distancemi:\\n\\n* B\u011bh: 800 m, 1500 m, 5000 m,
  10 000 m, 21 km, maraton + d\u011btsk\u00e9 kategorie\\n* Plav\u00e1n\u00ed: 800
  m, 1500 m + d\u011btsk\u00e9 kategorie\\n* Cyklistika: 25 km, 50 km + d\u011btsk\u00e9
  kategorie + z\u00e1vody na kolob\u011b\u017ece a in-line brusl\u00edch\\n* Triatlon:
  olympijsk\u00fd (1,5 km plav\u00e1n\u00ed, 40 km cyklistika, 10 km b\u011bh), sprint
  (0,75 \u2013 20 \u2013 5 km). Z\u00e1vod nen\u00ed nutn\u00e9 absolvovat v kuse,
  ale discipl\u00edny mus\u00edte zvl\u00e1dnout b\u011bhem 24 hodin\\n\\n* Ch\u016fze:
  10 km, 20 km  + d\u011btsk\u00e9 kategorie\\n\\nPo\u0159ad\u00ed ve v\u00fdsledc\u00edch
  p\u0159itom nen\u00ed d\u016fle\u017eit\u00e9. C\u00edlem projektu je motivovat
  amat\u00e9rsk\u00e9 sportovce v jejich v za\u010d\u00e1tc\u00edch, inspirovat je
  k p\u0159ekon\u00e1v\u00e1n\u00ed vlastn\u00edch limit\u016f a podpo\u0159it je
  v p\u0159irozen\u00e9 lidsk\u00e9 sout\u011b\u017eivosti. Z\u00e1vody m\u016f\u017eete
  absolvovat s rodinou, p\u0159\u00e1teli nebo z nich vytvo\u0159it v\u00fdzvu pro
  kolegy v pr\u00e1ci.\\n\\nPro leto\u0161n\u00ed ro\u010dn\u00edk z\u00edskal projekt
