  dle z\u00e1kona \u010d. 134/2016 Sb.,\\n\\no zad\u00e1v\u00e1n\u00ed ve\u0159ejn\u00fdch
  zak\u00e1zek.\\n\\nZodpov\u00edd\u00e1: starostka obce\\n\\nPr\u016fb\u011b\u017en\u011b
  b\u011bhem roku kontroluje:  kontroln\u00ed v\u00fdbor obce.\\\"\\n\\nV Se\u010di,
