  \u00fa\u0159edn\u00ed desce dne: 31. 5. 2021\\n\\nSejmuto dne: 19. 6. 2021\\n\\n6\"",
  "\"(krom\u011b letn\u00edch a v\u00e1no\u010dn\u00edch pr\u00e1zdnin)\\n\\nProvoz
  recepce PO-\u010cT 10:00 - 15:00 hodin\\n\\nKULTURN\u011a KOMUNITN\u00cd CENTRUM
  SENIOR FITNES\\n\\nRozvrh platn\u00fd od 2.dubna 2024\\n\\nChytr\u00fd tel.-t\u00e9matick\u00e9
  kurzy mal\u00e1 u\u010debna: 15:00 - 16:30 (11/3 - 22/4)\"", "\"Obr\u0148te se proti
  vir\u016fm. Silnou imunitu pos\u00edl\u00ed l\u00e9ko\u0159ice i houby \u0161itake\\n\\nProst\u011bjov,
  b\u0159ezen 2020\\n\\n\u00danava, bolest sval\u016f a kloub\u016f a zv\u00fd\u0161en\u00e1
  teplota. P\u0159esto\u017ee p\u0159ed podobn\u00fdmi p\u0159\u00edznaky v posledn\u00edch
  dnech varuj\u00ed m\u00e9dia v souvislosti s Coronavirem, stejn\u00e9 projevy nese
  i oby\u010dejn\u00e9 nachlazen\u00ed, \u010di ch\u0159ipka. V ka\u017ed\u00e9m p\u0159\u00edpad\u011b,
  a v rizikov\u00e9m obdob\u00ed zvl\u00e1\u0161t\u011b, se vyplat\u00ed pos\u00edlit
  imunitu. Obranu proti vir\u016fm nekoup\u00edme jen v l\u00e9k\u00e1rn\u011b \u2013
  \u00fa\u010dinn\u00e9 pomocn\u00edky se\u017eeneme i z p\u0159\u00edrodn\u00edch
  zdroj\u016f.\\n\\nChladn\u00e9 m\u011bs\u00edce, kdy lid\u00e9 tr\u00e1v\u00ed v\u011bt\u0161inu
  dne ve vytopen\u00fdch m\u00edstnostech, jsou pro p\u0159enos vir\u016f ide\u00e1ln\u00ed.
  Such\u00fd vnit\u0159n\u00ed vzduch vysu\u0161uje sliznice, a ty se tak st\u00e1vaj\u00ed
  nebezpe\u010dn\u00fdm prost\u0159ed\u00edm pro mno\u017een\u00ed vir\u016f. Pokud
  se vytopen\u00fdm m\u00edstnostem nevyhnete, jako vhodn\u00e1 prevence poslou\u017e\u00ed
  grapefruit. V\u00fdta\u017eek ze semen ovoce doporu\u010duje nejzn\u00e1m\u011bj\u0161\u00ed
  \u010desk\u00e1 bylink\u00e1\u0159ka Jarmila Podhorn\u00e1. \u201eExtrakt ze semen
  grepu p\u016fsob\u00ed proti stovk\u00e1m kmen\u016f vir\u016f a bakteri\u00ed.
  Nav\u00edc obsahuje bioflavonoidy kter\u00e9 posiluj\u00ed imunitu a \u010dist\u00ed
  organismus, tak\u017ee pom\u00e1haj\u00ed proti nachlazen\u00ed a infekc\u00edm,\\\"
  upozor\u0148uje Podhorn\u00e1.\\n\\nJeliko\u017e grepov\u00e9 kapky p\u016fsob\u00ed
  tak\u00e9 jako p\u0159\u00edrodn\u00ed antibiotikum, pom\u00e1h\u00e1 grep nejen
  jak prevence virov\u00fdch a bakteri\u00e1ln\u00edch infekc\u00edch ale tak\u00e9
  p\u0159i jejich l\u00e9\u010db\u011b. \u201eK vnit\u0159n\u00edmu u\u017eit\u00ed
  se hod\u00ed p\u0159edev\u0161\u00edm tinktury, kter\u00e9 pom\u00e1haj\u00ed v
  proti nep\u0159\u00e1telsk\u00fdm vir\u016fm, ale nap\u0159\u00edklad tak\u00e9
  pl\u00edsn\u00edm,\\\" dod\u00e1v\u00e1 bylink\u00e1\u0159ka.\\n\\nD\u016fv\u011brn\u011b
  zn\u00e1m\u00e9 \u201el\u00e9ky\\\"\\n\\nPodobn\u011b jako grapefruit, i dal\u0161\u00ed
  pomocn\u00edky v boji proti nemocem zn\u00e1me z na\u0161\u00ed sp\u00ed\u017ee.
  Typick\u00fdm p\u0159\u00edkladem je pe\u010d\u00e1rka neboli \u017eampion. Jeho
  l\u00e1tky ocen\u00edme p\u0159edev\u0161\u00edm p\u0159i probl\u00e9mech s horn\u00edmi
  cestami d\u00fdchac\u00edmi, ale i pr\u016fdu\u0161kami. Nejv\u00edce prosp\u011b\u0161n\u00fdch
  l\u00e1tek se nach\u00e1z\u00ed v \u010derstv\u00fdch plodnic\u00edch a jejich po\u010det
  se skladov\u00e1n\u00edm i konzervac\u00ed kles\u00e1. Nejl\u00e9pe proto poslou\u017e\u00ed
  \u017eampiony ve form\u011b tinktury. Je to antibiotikum na horn\u00ed cesty d\u00fdchac\u00ed.
  Pe\u010d\u00e1rky ale nejsou jedin\u00e9 houby pro boj s ch\u0159ipkou a nachlazen\u00ed.
  Podobnou slu\u017ebu prok\u00e1\u017eou tak\u00e9 japonsk\u00e9 houbi\u010dky \u0161itake,
  s v\u00fdrazn\u00fdmi protivirov\u00fdmi \u00fa\u010dinky.\\n\\nT\u00e9m\u011b\u0159
  univerz\u00e1ln\u00edm pomocn\u00edkem je \u010desnek. A to jak set\u00fd, ze kter\u00e9ho
  vyu\u017e\u00edv\u00e1me cibulku, tak medv\u011bd\u00ed, kter\u00fd nese svou s\u00edlu
  v listech. Jako pomocn\u00edk proti \u0161\u00ed\u0159en\u00ed infek\u010dn\u00edch
  onemocn\u011bn\u00ed se pou\u017e\u00edval ji\u017e ve star\u00e9m Egypt\u011b.
  \u201eNap\u0159\u00edklad z 560 zn\u00e1m\u00fdch kmen\u016f Zlat\u00e9ho stafylokoka
  jich \u010desnek 500 ni\u010d\u00ed,\\\" upozor\u0148uje Podhorn\u00e1.\\n\\nNejen
  v kuchyni, ale i v l\u00e9k\u00e1rni\u010dce poslou\u017e\u00ed tak\u00e9 bazalka.
  A\u0165 ve form\u011b tinktury, \u010dajov\u00e9 sm\u011bsi nebo koupele \u2013
  nezap\u0159e sv\u00e9 antibakteri\u00e1ln\u00ed \u00fa\u010dinky, \u00falevu p\u0159i
  bolesti ani pomoc s vyka\u0161l\u00e1v\u00e1n\u00edm.\\n\\nZa star\u00fdch herb\u00e1\u0159\u016f\\n\\nDobr\u00e1
  imunita je z\u00e1klad pro boj organismu s virov\u00fdmi a bakteri\u00e1ln\u00edmi
  onemocn\u011bn\u00edmi. K jedn\u011bm z nejlep\u0161\u00edch antibakteri\u00e1ln\u00edch
  prost\u0159edk\u016f pat\u0159\u00ed licho\u0159e\u0159i\u0161nice. Likviduje v
  organismu streptokoky, stafylokoky a dal\u0161\u00ed druhy bakteri\u00ed, hlavn\u011b
  na d\u00fdchac\u00edch a mo\u010dov\u00fdch cest\u00e1ch. Zpracovan\u00e9 pupeny
  vrby v gemmoterapeutikum jsou vynikaj\u00edc\u00edm prost\u0159edkem proti vir\u016fm,
  ale tak\u00e9 pom\u00e1haj\u00ed ji\u017e p\u0159i vznikl\u00e9 vir\u00f3ze a sni\u017euj\u00ed
  i vysok\u00e9 teploty.\\n\\nDobrou slu\u017ebu v prevenci i v akutn\u00edm boji
  s nemocemi n\u00e1m prok\u00e1\u017eou tak\u00e9 rostliny, kter\u00e9 zn\u00e1me
  sp\u00ed\u0161 od na\u0161ich babi\u010dek. Typick\u00fdm p\u0159\u00edznakem je
  \u010dert\u016fv ko\u0159en, zn\u00e1m tak\u00e9 jako sibi\u0159sk\u00fd \u017een\u0161en,
  kter\u00fd se pou\u017e\u00edv\u00e1 mimo jin\u00e9 p\u0159i dol\u00e9\u010dov\u00e1n\u00ed
  infek\u010dn\u00edch chorob, slabosti a virov\u00fdch onemocn\u011bn\u00edch. \u201e\u010cert\u016fv
  ko\u0159en p\u016fsob\u00ed jako adaptogen a harmoniz\u00e1tor, co\u017e znamen\u00e1,
  \u017ee zvy\u0161uje tak\u00e9 obranyschopnost organismu,\\\" dopl\u0148uje bylink\u00e1\u0159ka.\\n\\nO
  \u010dern\u00e9m bezu bylo zn\u00e1m\u00e9 p\u0159\u00edslov\u00ed \\\"p\u0159ed
  bezem klekni\\\". Ke zlep\u0161en\u00ed stavu organismu se oded\u00e1vna vyu\u017e\u00edvalo
  n\u011bkolik \u010d\u00e1st\u00ed bezu. \u010caj z kv\u011bt\u016f je vynikaj\u00edc\u00edm
  prost\u0159edkem na nemoci z prochladnut\u00ed, ni\u010d\u00ed bakterie, \u010dist\u00ed
  zahlen\u011bn\u00e9 pr\u016fdu\u0161ky, plody zlep\u0161uj\u00ed nervov\u00e9 probl\u00e9my,
  ale pupen n\u00e1m m\u016f\u017ee pomoci s likvidac\u00ed vir\u016f a bakteri\u00ed.\\n\\nTak\u00e9
  je u n\u00e1s cel\u00e1 \u0159ada cizokrajn\u00fdch bylinn\u00fdch prost\u0159edk\u016f,
  kter\u00e9 se vyzna\u010duj\u00ed antivirov\u00fdmi a antibakteri\u00e1ln\u00edmi
  \u00fa\u010dinky.\\n\\nTradi\u010dn\u00ed \u010c\u00ednsk\u00e1 medic\u00edna vyu\u017e\u00edv\u00e1
  andrographis - m\u011bk\u00fdn latnat\u00fd, kter\u00fd se vyzna\u010duje siln\u00fdm
  antibakteri\u00e1ln\u00edm a antivirov\u00fdm p\u016fsoben\u00edm. Vilkakora - ko\u010di\u010d\u00ed
  dr\u00e1p poch\u00e1z\u00ed z amazonsk\u00fdch prales\u016f a m\u00e1 hodn\u011b
  druh\u016f p\u0159\u00edzniv\u00fdch p\u016fsoben\u00ed na lidsk\u00fd organismus.
  Jedn\u00edm z nich je tak\u00e9 protivirov\u00e9 a protiz\u00e1n\u011btliv\u00e9
  p\u016fsoben\u00ed.\\n\\nK nejv\u00fdznamn\u011bj\u0161\u00edm bylin\u00e1m v tradi\u010dn\u00edm
  \u010d\u00ednsk\u00e9m l\u00e9\u010ditelstv\u00ed pat\u0159\u00ed zlatice.  Jej\u00ed
  hlavn\u00ed l\u00e9\u010div\u00e9 \u00fa\u010dinky jsou antiseptick\u00e9 a protiz\u00e1n\u011btliv\u00e9.
  Ka\u017ed\u00e1 tato rostlina p\u016fsob\u00ed likvida\u010dn\u011b na ur\u010dit\u00fd
  druh vir\u016f a proto je nejl\u00e9pe zhotovit sm\u011bs z t\u011bch nej\u00fa\u010dinn\u011bj\u0161\u00edch.\\n\\nKontakt\\n\\nMgr.
  Jarmila Podhorn\u00e1\\n\\nNad\u011bje\\n\\nTelefon:\\n\\n+420 582 391 254,Fax:\\n\\n+420
