  5 vyhl\u00e1\u0161ky \u010d. 136/2004 Sb., kterou se stanov\u00ed podrobnosti ozna\u010dov\u00e1n\u00ed
  zv\u00ed\u0159at a jejich evidence a evidence hospod\u00e1\u0159stv\u00ed a osob
  stanoven\u00fdch plemen\u00e1\u0159sk\u00fdm z\u00e1konem. Kon\u011b, kte\u0159\u00ed
  maj\u00ed pr\u016fkaz kon\u011b vystaven\u00fd v souladu s p\u0159edpisy Evropsk\u00fdch
  spole\u010denstv\u00ed se slovn\u00edm a grafick\u00fdm popisem, se pova\u017euj\u00ed
  za kon\u011b ozna\u010den\u00e9 v souladu s touto vyhl\u00e1\u0161kou. 2. V\u0161ichni
  kon\u011b bez rozd\u00edlu v\u011bku mus\u00ed spl\u0148ovat po\u017eadavky na jejich
  ozna\u010den\u00ed podle \u00a7 13 a\u017e \u00a7 15 vyhl\u00e1\u0161ky \u010d.
  136/2004 Sb., kterou se stanov\u00ed podrobnosti ozna\u010dov\u00e1n\u00ed zv\u00ed\u0159at
  a jejich evidence a evidence hospod\u00e1\u0159stv\u00ed a osob stanoven\u00fdch
