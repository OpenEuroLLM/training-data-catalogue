  13\\n\\nTato u\u017eivatelsk\u00e1 p\u0159\u00edru\u010dka sest\u00e1vaj\u00edc\u00ed
  z technick\u00fdch \u00fadaj\u016f, n\u00e1vodu k obsluze a technick\u00fdch specifikac\u00ed
  zahrnuje instalaci a mont\u00e1\u017e integrovan\u00e9ho ventil\u00e1toru s plynulou
  regulac\u00ed (d\u00e1le jen \\\"ventil\u00e1tor\\\" nebo \\\"jednotka\\\" jako
  uveden\u00e9 v odd\u00edlech \\\"Bezpe\u010dnostn\u00ed po\u017eadavky\\\" a \\\"Z\u00e1ruka
  v\u00fdrobce\\\", jako\u017e i v upozorn\u011bn\u00edch a informa\u010dn\u00edch
  bloc\u00edch).\\n\\nBEZPE\u010cNOSTN\u00cd POKYNY\\n\\nP\u0159ed instalac\u00ed
  a obsluhou p\u0159\u00edstroje pe\u010dliv\u011b p\u0159e\u010dt\u011bte u\u017eivatelskou
  p\u0159\u00edru\u010dku.\\nDodr\u017eujte u\u017eivatelsk\u00e9 manu\u00e1ln\u00ed
  po\u017eadavky, jako\u017e i ustanoven\u00ed v\u0161ech platn\u00fdch m\u00edstn\u00edch
  a n\u00e1rodn\u00edch stavebn\u00edch, elektrick\u00fdch a technick\u00fdch norem
  a norem.\\nUpozorn\u011bn\u00ed obsa\u017een\u00e1 v u\u017eivatelsk\u00e9 p\u0159\u00edru\u010dce
  mus\u00ed b\u00fdt pova\u017eov\u00e1na za nejv\u00e1\u017en\u011bj\u0161\u00ed,
  proto\u017ee obsahuj\u00ed d\u016fle\u017eit\u00e9 osobn\u00ed bezpe\u010dnostn\u00ed
  informace.\\nNedodr\u017een\u00ed pravidel a bezpe\u010dnostn\u00edch opat\u0159en\u00ed
  uveden\u00fdch v tomto n\u00e1vodu k obsluze m\u016f\u017ee zp\u016fsobit zran\u011bn\u00ed
  nebo po\u0161kozen\u00ed p\u0159\u00edstroje.\\nPo pe\u010dliv\u00e9m p\u0159e\u010dten\u00ed
  p\u0159\u00edru\u010dky udr\u017eujte jej po celou dobu \u017eivotnosti p\u0159\u00edstroje.\\nP\u0159i
  p\u0159evodu ovl\u00e1dac\u00edho prvku jednotky mus\u00ed b\u00fdt u\u017eivatelsk\u00e1
  p\u0159\u00edru\u010dka p\u0159evedena na p\u0159ij\u00edmaj\u00edc\u00edho oper\u00e1tora\\n\\nLegenda
  symbol\u016f:\\n\\n| ![Symbol] | VAROV\u00c1N\u00cd! |\\n|-----------|------------|\\n|
  ![Symbol] | NE!        |\\n\\nBEZPE\u010cNOSTN\u00cd OPAT\u0158EN\u00cd PRO MONT\u00c1\u017d
  A PROVOZ JEDNOTKY\\n\\n- P\u0159ed jakoukoliv instala\u010dn\u00ed operac\u00ed
  odpojte p\u0159\u00edstroj od elektrick\u00e9 s\u00edt\u011b.\\n- Nepokl\u00e1dejte
  nap\u00e1jec\u00ed kabel p\u0159\u00edstroje v bl\u00edzkosti topn\u00e9ho za\u0159\u00edzen\u00ed.\\n-
  P\u0159\u00edstroj mus\u00ed b\u00fdt uzemn\u011bn!\\n- P\u0159i instalaci za\u0159\u00edzen\u00ed
  dodr\u017eujte bezpe\u010dnostn\u00ed p\u0159edpisy t\u00fdkaj\u00edc\u00ed se pou\u017eit\u00ed
  elektrick\u00e9ho n\u00e1\u0159ad\u00ed.\\n\\n\u2022 Vyvarujte se po\u0161kozen\u00ed
  nap\u00e1jec\u00edho kabelu.\\n\u2022 Na nap\u00e1jec\u00ed kabel neumistujte \u017e\u00e1dn\u00e9
  ciz\u00ed p\u0159edm\u011bty.\\n\\n\u2022 Nep\u0159ipojujte po\u0161kozen\u00e1
  za\u0159\u00edzen\u00ed nebo kabely p\u0159i p\u0159ipojov\u00e1n\u00ed p\u0159\u00edstroje
  k elektrick\u00e9 s\u00edt\u011b.\\n\\n\u2022 Nedot\u00fdkejte se ovl\u00e1dac\u00edch
  prvk\u016f jednotky vlhk\u00fdmi rukama.\\n\u2022 Neinstalujte a neprov\u00e1d\u011bjte
  \u00fadr\u017ebu mokr\u00fdmi rukama.\\n\\n\u2022 Rozbalte p\u0159\u00edstroj opatrn\u011b.\\n\\n\u2022
  Nepou\u017e\u00edvejte p\u0159\u00edstroj mimo rozsah teplot uveden\u00fdch v u\u017eivatelsk\u00e9m
  p\u0159\u00edru\u010dce.\\n\u2022 Nepou\u017e\u00edvejte p\u0159\u00edstroj v agresivn\u00edm
  nebo v\u00fdbu\u0161n\u00e9m prost\u0159ed\u00ed.\\n\\n\u2022 Neum\u00fdvajte p\u0159\u00edstroj
  vodou.\\n\u2022 Chra\u0148te elektrick\u00e9 \u010d\u00e1sti p\u0159\u00edstroje
  p\u0159ed vniknut\u00edm vody.\\n\\n**BEZPE\u010cNOSTN\u00cd OPAT\u0158EN\u00cd
  PRO MONT\u00c1\u017d A PROVOZ JEDNOTKY**\\n\\n\u2022 Nedovolte, aby d\u011bti obsluhovaly
  p\u0159\u00edstroj.\\n\\n\u2022 Neskladujte \u017e\u00e1dn\u00e9 nebezpe\u010dn\u00e9
  nebo vysoce ho\u0159lav\u00e9 l\u00e1tky v bl\u00edzkosti p\u0159\u00edstroje.\\n\\n\u2022
  Neotv\u00edrejte p\u0159\u00edstroj b\u011bhem provozu.\\n\\n\u2022 Neblokujte vzduchov\u00fd
  kan\u00e1l p\u0159i zapnut\u00ed p\u0159\u00edstroje.\\n\\n\u2022 Neum\u00eds\u0165ujte
  na p\u0159\u00edstroj a neum\u00eds\u0165ujte na n\u011bj ciz\u00ed p\u0159edm\u011bty.\\n\\n\u2022
  P\u0159ed jakoukoli technickou \u00fadr\u017ebou odpojte p\u0159\u00edstroj od elektrick\u00e9
  s\u00edt\u011b.\\n\\n\u2022 Pokud p\u0159\u00edstroj generuje neobvykl\u00e9 zvuky,
  odvzdu\u0161\u00eduje nebo vyd\u00e1v\u00e1 kou\u0159, odpojte jej od zdroje nap\u00e1jen\u00ed
  a obra\u0165te se na prodejce.\\n\\n\u2022 Nep\u0159idejte proud vzduchu, kter\u00fd
  p\u0159\u00edstroj vytv\u00e1\u0159\u00ed, sm\u011brem k otev\u0159en\u00e9mu plamenu
  nebo zdroj\u016fm zap\u00e1len\u00ed.\\n\\n\u2022 V p\u0159\u00edpad\u011b nep\u0159etr\u017eit\u00e9ho
  provozu jednotky pravideln\u011b kontrolujte bezpe\u010dnost mont\u00e1\u017ee.\\n\\n\u2022
  Za\u0159\u00edzen\u00ed pou\u017e\u00edvejte pouze k ur\u010den\u00e9mu \u00fa\u010delu.\\n\\n**U\u010cEL**\\n\\nVentil\u00e1tor
  je ur\u010den pro v\u011btr\u00e1n\u00ed r\u016fzn\u00fdch pr\u016fmyslov\u00fdch
  prostor, baz\u00e9n\u016f, bytov\u00fdch dom\u016f, kancel\u00e1\u0159\u00ed, nemocnic,
  restaurac\u00ed a dal\u0161\u00edch prostor. Modely Silent jsou ur\u010deny pro
  nap\u00e1jec\u00ed a ods\u00e1vac\u00ed ventilaci syst\u00e9my r\u016fzn\u00fdch
  komer\u010dn\u00edch a pr\u016fmyslov\u00fdch prostor s vysok\u00fdmi n\u00e1roky
  na hladinu hluku (knihovny, konferen\u010dn\u00ed s\u00e1ly, vzd\u011bl\u00e1vac\u00ed
  instituce, mate\u0159sk\u00e9 \u0161koly atd). Jednotka je sou\u010d\u00e1st\u00ed
  a nen\u00ed ur\u010dena k nez\u00e1visl\u00e9mu provozu.\\n\\nVentil\u00e1tor je
  ur\u010den pro podlahovou, z\u00e1v\u011bsnou nebo stropn\u00ed mont\u00e1\u017e.
  Jednotka je ur\u010dena pro nep\u0159etr\u017eit\u00fd provoz. P\u0159epravovan\u00fd
  vzduch nesm\u00ed obsahovat \u017e\u00e1dn\u00e9 ho\u0159lav\u00e9 nebo v\u00fdbu\u0161n\u00e9
  sm\u011bsi, odpa\u0159ov\u00e1n\u00ed chemik\u00e1li\u00ed, lepkav\u00e9 l\u00e1tky,
  vl\u00e1knit\u00e9 materi\u00e1ly, hrub\u00fd prach, \u010d\u00e1stice saz\u00ed
