  PRAHA          |\\n\\nBATTLE OF THE TEAMS\\n\\nRUN FOR ALL. ALL FOR RUN.\\n\\nMaratony
  tvo\u0159\u00ed velkou rodinu, tr\u00e9nujte spolu, podporujte se. Ale a\u017e te\u010f
  mohou opravdu sout\u011b\u017eit v t\u00fdmu.\\n\\nP\u0158IDALI JSME DRAMATICK\u00dd
  PRVEK B\u011aZECK\u00c9MU SPORTU\\n\\nProm\u011bna maratonu v t\u00fdmov\u00fd sport
  dodala z\u00e1vodu spoustu vzru\u0161en\u00ed a dramatu. Z\u00e1le\u017e\u00ed na
  ka\u017ed\u00e9m b\u011b\u017eci. Z\u00e1le\u017e\u00ed na ka\u017ed\u00e9 vte\u0159in\u011b.
  Motivuje ka\u017ed\u00e9ho b\u011b\u017ece, aby se sna\u017eil dos\u00e1hnout sv\u00e9ho
  nejlep\u0161\u00edho v\u00fdkonu. B\u011b\u017eeck\u00fd sport se tak stal sledovan\u011bj\u0161\u00edm
  a atraktivn\u011bj\u0161\u00edm.\\n\\nBattle of the Teams se stal sou\u010d\u00e1st\u00ed
  Pra\u017esk\u00e9ho mezin\u00e1rodn\u00edho maratonu a p\u0159inesl s sebou nov\u00fd
  prvek. Ka\u017ed\u00fd b\u011b\u017eec m\u016f\u017ee ovlivnit v\u00fdsledek sv\u00e9ho
  t\u00fdmu.\\n\\nEUROHEROES\\n\\nEuroHeroes je projekt RunCzech, kter\u00fd vznikl
  ze t\u0159\u00ed d\u016fvod\u016f. Zv\u00fd\u0161it konkurenceschopnost evropsk\u00fdch
  sportovc\u016f na sv\u011btov\u00e9 sc\u00e9n\u011b. Oslavit jejich skv\u011bl\u00e9
  v\u00fdkony. A vytvo\u0159it fanou\u0161kovskou z\u00e1kladnu pro evropsk\u00e9
  b\u011b\u017ece s nad\u011bj\u00ed, \u017ee inspiruj\u00ed novou generaci, kter\u00e1
  p\u016fjde v jejich stop\u00e1ch.\\n\\nS t\u00edmto z\u00e1m\u011brem jsme \u010dty\u0159i
  z na\u0161ich p\u016flmaraton\u016f ozna\u010dili jako s\u00e9rii EuroHeroes, \u00fa\u010dastn\u00ed
  se pouze elitn\u00ed evrop\u0161t\u00ed b\u011b\u017eci. Ka\u017ed\u00fd z\u00e1vod
  je ocen\u011bn zna\u010dkou kvality World Athletics Road Race Label a p\u011btihv\u011bzdi\u010dkov\u00fdm
  certifik\u00e1tem Evropsk\u00e9 atletiky.\\n\\nMATTONI RUNNING FESTIVAL\\n\\nZa\u017eijte
  vzru\u0161uj\u00edc\u00ed z\u00e1vodn\u00ed den s nov\u011b zaveden\u00fdmi vzd\u00e1lenostmi
  RunCzech! A\u0165 u\u017e se chyst\u00e1te p\u0159ekonat hranici p\u016flmaratonu,
  nebo teprve za\u010d\u00edn\u00e1te, v na\u0161ich nov\u00fdch kategori\u00edch
  se najde m\u00edsto pro ka\u017ed\u00e9ho. Nev\u00e1hejte - po\u010det m\u00edst
  je omezen!\\n\\nP\u0159ipojte se ke vzru\u0161uj\u00edc\u00ed akci RunCzech, kter\u00e1
  v\u00e1m zaru\u010d\u00ed profesion\u00e1ln\u011b zvl\u00e1dnut\u00fd z\u00e1vod,
  elektrizuj\u00edc\u00ed atmosf\u00e9ru, exkluzivn\u00ed medaile a spoustu ob\u010derstven\u00ed.
  Nejde jen o b\u011bh, ale o z\u00e1bavu, kamar\u00e1dstv\u00ed a nezapomenuteln\u00e9
  z\u00e1\u017eitky. Zajist\u011bte si sv\u00e9 m\u00edsto na startu je\u0161t\u011b
  dnes!\\n\\nMATTONI FREERUN\\n\\nMattoni Free Run je n\u00e1s desetilet\u00fd program,
  d\u00edky kter\u00e9mu vzniklo v\u00edce ne\u017e 90 trat\u00ed po cel\u00e9 \u010cesk\u00e9
  republice. Projekt vznikl p\u0159edev\u0161\u00edm pro za\u010d\u00ednaj\u00edc\u00ed
  b\u011b\u017ece, kte\u0159\u00ed se s b\u011bh\u00e1n\u00edm trpce seznamuj\u00ed.
  Uk\u00e1zalo se v\u0161ak, \u017ee je po\u017eehn\u00e1n\u00edm pro b\u011b\u017ece
  v\u0161ech \u00farovn\u00ed, a to po cel\u00e9 \u010cesk\u00e9 republice, proto\u017ee
  nab\u00edz\u00ed bezplatn\u00fd p\u0159\u00edstup na certifikovan\u00e9 a bezpe\u010dn\u00e9
  trat\u011b pod veden\u00edm profesion\u00e1ln\u00edch tren\u00e9r\u016f. Postupem
  \u010dasu se vytvo\u0159ila b\u011b\u017eeck\u00e1 komunita spojuj\u00edc\u00ed
  b\u011b\u017ece po cel\u00e9 zemi.\\n\\nProfesionality tren\u00e9r\u016f nebereme
  na lehkou v\u00e1hu. Proto MFR ka\u017edoro\u010dn\u011b vyd\u00e1v\u00e1 ofici\u00e1ln\u00ed
  tren\u00e9rsk\u00e9 licence a zaji\u0161\u0165uje \u0161kolen\u00ed tren\u00e9r\u016f.\\n\\nDM
  RODINN\u00c1 M\u00cdLE\\n\\nPo velmi \u00fasp\u011b\u0161n\u00e9 s\u00e9rii dm rodinn\u00fdch
  b\u011bh\u016f nastal \u010das na zm\u011bnu - dm rodinnou m\u00edlu. B\u011bh na
  v\u00edce ne\u017e 3 km byl pro n\u011bkter\u00e9 b\u011b\u017ece limituj\u00edc\u00ed,
  a\u0165 u\u017e fyzicky nebo psychicky. Krat\u0161\u00ed vzd\u00e1lenost umo\u017e\u0148uje
  udr\u017eet cel\u00e9 b\u011b\u017eeck\u00e9 pole v\u00edce pohromad\u011b, a t\u00edm
  umo\u010dinuje spole\u010dn\u00fd z\u00e1\u017eitek z b\u011bhu.\\n\\nNov\u00e9
  kategorie:\\nD\u011bti b\u011b\u017e\u00edc\u00ed samostatn\u011b (8 - 14 let)\\nRodina
  a d\u011bti (0 - 99 let)\\nPrarodi\u010de a vnou\u010data (0 - 99 let)\\nProch\u00e1zka
  (0 - 99 let)\\n\\n8 268 B\u011a\u017dC\u016e\\nRODINN\u00c9 M\u00cdLE\\n\\nDM BAMBINI
  RUN\\n\\nAby si z\u00e1vod u\u017eili i ti nejmen\u0161\u00ed, po\u0159\u00e1d\u00e1me
  tak\u00e9 dm Bambini Run. B\u011bh je zcela zdarma a ka\u017ed\u00fd \u00fa\u010dastn\u00edk
  obdr\u017e\u00ed tri\u010dko, startovn\u00ed \u010d\u00edslo a v c\u00edli \u010dokol\u00e1dovou
  medaili.\\n\\ndm Bambini Run je rozd\u011blen do t\u0159\u00ed kategori\u00ed podle
  v\u011bku z\u00e1vodn\u00edk\u016f. Z\u00e1vod m\u00e1 omezen\u00fd po\u010det registrac\u00ed,
  proto nev\u00e1hejte, proto\u017ee o z\u00e1vod je velk\u00fd z\u00e1jem!\\n\\nNAPOLI
  RUNNING\\n\\nNapoli Running poskytuje elektrizuj\u00edc\u00ed atmosf\u00e9ru b\u011b\u017ec\u016fm
  z Neapole, It\u00e1lie i cel\u00e9ho sv\u011bta p\u0159i z\u00e1vodech, v nich\u017e
  je b\u011b\u017eec st\u0159edem projektu, s vynikaj\u00edc\u00ed organiza\u010dn\u00ed
  kvalitou certifikovanou na n\u00e1rodn\u00ed i mezin\u00e1rodn\u00ed \u00farovni.
  V pr\u016fb\u011bhu let se Napoli Running poda\u0159ilo vytv\u00e1\u0159et pozitivn\u00ed
  dopad v ekonomick\u00e9 a soci\u00e1ln\u00ed oblasti, propagovat zdrav\u00fd \u017eivotn\u00ed
  styl a pos\u00edlit image neapolsk\u00e9ho \u00fazem\u00ed a jeho instituc\u00ed
  t\u00edm, \u017ee z\u00e1vod v Neapoli z\u00edskal mezin\u00e1rodn\u00ed status
  d\u00edky mnoha zahrani\u010dn\u00edm b\u011b\u017ec\u016fm, kte\u0159\u00ed se
  rozhodli z\u00fa\u010dastnit na\u0161ich z\u00e1vod\u016f.\\n\\nNeapolsk\u00fd m\u011bstsk\u00fd
  p\u016flmaraton v\u00e1m umo\u017en\u00ed b\u011b\u017eet na jednom z nejkr\u00e1sn\u011bj\u0161\u00edch
  n\u00e1b\u0159e\u017e\u00ed na sv\u011bt\u011b s jedine\u010dn\u00fdm, nevidan\u00fdm
  panoramatem a historick\u00e9m centru, kter\u00e9 je zaps\u00e1no na seznamu sv\u011btov\u00e9ho
  d\u011bdictv\u00ed UNESCO. Z\u00e1vod ocen\u011bn\u00fd presti\u017en\u00ed zna\u010dkou
  World Athletics a p\u011btihv\u011bzdi\u010dkov\u00fdm ocen\u011bn\u00edm kvality
  od European Athletics je dr\u017eitelem italsk\u00e9ho mu\u017esk\u00e9ho i \u017eensk\u00e9ho
  rekordu. Dal\u0161\u00ed b\u011bh, Bosco in Rosa je nesout\u011b\u017en\u00ed z\u00e1vod/ch\u016fze
  na 5 km, jeho\u017e \u00fa\u010dastn\u00edky budou pouze \u017eeny. Z\u00e1vod se
  uskute\u010dn\u00ed v r\u00edjnu a jeho c\u00edlem je zapojit \u017eeny do b\u011b\u017eeck\u00e9ho
  sv\u011bta.\\n\\nITALSK\u00c9 REKORDY\\n\\nYEMANEBERHAN CRIPPA 59:26\\nNAPOLI CITY
  HALF MARATHON 2022\\n\\nSOFIA YAREMCHUK 01:08:27\\nNAPOLI CITY HALF MARATHON 2024\\n\\nDM
  BREAKFAST RUN\\n\\nP\u0159ipojte se k n\u00e1m na dm Breakfast Run v sobotu 4. kv\u011btna
  v Letensk\u00fdch sadech. Tento nesout\u011b\u017en\u00fd, p\u0159\u00e1telsk\u00fd
  b\u011bh na 4 km je skv\u011bl\u00fdm zp\u016fsobem, jak si u\u017e\u00edt p\u0159edmaratonskou
  atmosf\u00e9ru a nav\u00e1zat kontakt s ostatn\u00edmi b\u011b\u017eci. D\u00edky
  pohodov\u00e9mu tempu 5:30 a\u017e 6:00 na km je to akce pro v\u0161echny \u010dleny
  b\u011b\u017eeck\u00e9 komunity, o\u010dek\u00e1v\u00e1me kolem tis\u00edcce \u00fa\u010dastn\u00edk\u016f.\\n\\nPo
  b\u011bhu si m\u016f\u017eete vychutnat chutnou sn\u00eddani v\u010detn\u011b k\u00e1vy
  Lavazza, ob\u010derstven\u00ed od dm a nealkoholick\u00e9 n\u00e1poje Mattoni. Ide\u00e1ln\u00ed
  zah\u00e1jen\u00ed nezapomenuteln\u00e9ho maratonsk\u00e9ho v\u00edkendu!\\n\\ndm\\n\\nNaskenuj
  QR k\u00f3d a pod\u00edvej se na kompletn\u00ed seznam z\u00e1vod\u016f!\\n\\n**Zaj\u00edmav\u00e1
