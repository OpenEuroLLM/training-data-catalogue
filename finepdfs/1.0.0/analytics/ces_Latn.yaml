  \u010cesk\u00fd Svaz Ochr\u00e1nc\u016f P\u0159\u00edrody KOSENKA\\n\\nStalo se\\n\\n*
  V polovin\u011b \u0159\u00edjna jsme p\u0159edali na m\u011bstsk\u00fd \u00fa\u0159ad
  na\u0161e p\u0159ipom\u00ednky a n\u00e1m\u011bty k inovaci \u00dazemn\u00edho  pl\u00e1nu
  Vala\u0161sk\u00fdch Klobouk. D\u00edky v\u0161em kdo se zapojili. V\u00edme u\u017e
  ze zku\u0161enost\u00ed s cyklostezkou, \u017ee cesta k v\u00fdsledku b\u00fdv\u00e1
  letit\u00e1 i trnit\u00e1.  D\u00e1le budeme spolupracovat, aby se podstatn\u00e9
  informace z odborn\u00fdch podklad\u016f a re\u00e1ln\u00e9 zku\u0161enosti ze \u017eivota
  spole\u010dnosti jako sou\u010d\u00e1sti p\u0159\u00edrody prom\u011bnily v \u0159e\u0161en\u00ed.\\n*
  15. \u0159\u00edjna 2019  byla v Praze Konference k 40. v\u00fdro\u010d\u00ed zalo\u017een\u00ed
  \u010cesk\u00e9ho svazu ochr\u00e1nc\u016f p\u0159\u00edrody. Slavnostn\u00ed konference
  se uskute\u010dnila v prostor\u00e1ch Sen\u00e1tu \u010cR a byla d\u016fstojn\u00fdm
  i velmi p\u0159\u00e1telsk\u00fdm setk\u00e1n\u00edm pam\u011btn\u00edk\u016f i
  dne\u0161n\u00edch aktivist\u016f i na\u0161ich p\u0159\u00edznivc\u016f a podporovatel\u016f.
  Stav p\u0159\u00edrody a spole\u010dnosti nen\u00ed zcela radostn\u00fd, ale m\u016f\u017eeme
  se za \u010dty\u0159icet let \u010dinnosti pochv\u00e1lit \u0159adou velmi cenn\u00fdch
  a kr\u00e1sn\u00fdch v\u00fdsledk\u016f, kter\u00e9 d\u00e1vaj\u00ed smysl na\u0161emu
  kon\u00e1n\u00ed a zodpov\u011bdnosti za spole\u010dnou budoucnost s p\u0159\u00edrodou.\\n*
  Po 14 dn\u016f v \u0159\u00edjnu prob\u00edhala pastva ovc\u00ed v chr\u00e1n\u011bn\u00fdch
  \u00fazem\u00edch spravovan\u00fdch \u010cSOP KOSENKA. Zadan\u00e9 \u00fakoly se
  n\u00e1m poda\u0159ilo splnit, v n\u011bkter\u00fdch ukazatel\u00edch i rozsahu
  d\u00edky dobrovoln\u00edk\u016fm p\u0159ekro\u010dit. D\u011bkujeme za v\u011bcnou
  a \u00fasp\u011b\u0161nou spolupr\u00e1ci se Spr\u00e1vou CHKO B\u00edl\u00e9 Karpaty.
  Krajin\u00e1\u0159sky jsou po 40 letech existence zdej\u0161\u00ed chr\u00e1n\u011bn\u00e1
  \u00fazem\u00ed ve velmi dobr\u00e9m stavu.  P\u0159esto vid\u00edme, \u017ee s\u00edla
  klimatick\u00fdch zm\u011bn nezadr\u017eiteln\u011b ovliv\u0148uje biologick\u00fd
  stav, biodiverzitu, hydrologick\u00fd re\u017eim. Negativn\u00ed zm\u011bny se st\u00e1le
  prohlubuj\u00ed. P\u0159\u00edroda si s t\u00edm ur\u010dit\u011b porad\u00ed. Jak
  se s nimi vypo\u0159\u00e1d\u00e1 \u010dlov\u011bk? P\u0159\u00edroda je pro n\u00e1s
  nezpochybnitelnou matkou, moudrou i p\u0159\u00edsnou u\u010ditelkou.\\n* Blahop\u0159ejeme
  rodin\u011b Suchanov\u00fdch k narozen\u00ed syna Mari\u00e1nka 18. 10. 2019. Dobrou
  stopu, nebe nad hlavou, \u0161t\u011bst\u00ed, zdrav\u00ed a napln\u011bn\u00fd
  \u017eivot p\u0159ej\u00ed v\u0161ichni z Kosenky.\\n* Podzimn\u00ed exkurze 18.
  \u0159\u00edjna pro d\u00e1rce \u0160\u010d\u00farnice byla spojena s dokon\u010den\u00edm
  kamerov\u00fdch z\u00e1b\u011br\u016f z dronu pro filmov\u00fd dokument ke \u0160\u010d\u00farnici,
  kter\u00fd zpracov\u00e1v\u00e1 pro \u010ceskou televizi Zden\u011bk Zvonek. Po\u010das\u00ed
  n\u00e1m p\u0159\u00e1lo, t\u011b\u0161\u00edme se na premi\u00e9ru.\\n* Leto\u0161n\u00ed
  management chr\u00e1n\u011bn\u00fdch \u00fazem\u00ed jsme zakon\u010dili podzimn\u00edm
  pokosen\u00edm a \u00faklidem mok\u0159adu na Dob\u0161en\u011b. 19. \u0159\u00edjna
  byl v B\u00edl\u00fdch Potokoch Ov\u010d\u00e1ck\u00fd den. Vyda\u0159il se. Kr\u00e1sn\u00e9
  bab\u00ed l\u00e9to, 32 \u00fa\u010dastn\u00edk\u016f, d\u011bti i dosp\u011bl\u00ed
