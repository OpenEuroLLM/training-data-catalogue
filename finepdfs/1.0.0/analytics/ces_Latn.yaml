  2. V\u00ddZNAMN\u00c9 \u00da\u010cETN\u00cd Z\u00c1SADY, METODY, ZP\u016eSOBY OCE\u0147OV\u00c1N\u00cd\\n\\n####
  2.1 Z\u00e1klad \u00fa\u010detnictv\u00ed\\n\\nP\u0159ilo\u017een\u00e1 \u00fa\u010detn\u00ed
  z\u00e1v\u011brka byla p\u0159ipravena v souladu se z\u00e1konom \u010d. 563/1991
  Sb., o \u00fa\u010detnictv\u00ed, ve zn\u011bn\u00ed pozd\u011bj\u0161\u00edch p\u0159edpis\u016f
  (d\u00e1le jen z\u00e1kona o \u00fa\u010detnictv\u00ed) a prov\u00e1d\u011bc\u00ed
  vyhl\u00e1\u0161kou \u010d. 500/2002 Sb., kterou se prov\u00e1d\u00ed jej\u00ed
  n\u011bkter\u00e1 ustanoven\u00ed z\u00e1kona \u010d. 563/1991 Sb., o \u00fa\u010detnictv\u00ed,
  ve zn\u011bn\u00ed pozd\u011bj\u0161\u00edch p\u0159edpis\u016f, pro \u00fa\u010detn\u00ed
  jednotky, kter\u00e9 jsou podnikateli \u00fa\u010dtuj\u00edc\u00edmi v soustav\u011b
  podvojn\u00e9ho \u00fa\u010detnictv\u00ed, ve zn\u011bn\u00ed pozd\u011bj\u0161\u00edch
  p\u0159edpis\u016f, ve zn\u011bn\u00ed platn\u00e9m pro rok 2017.\\n\\nByla vypracov\u00e1na
  na principu historick\u00fdch cen.\\n\\n#### 2.2 Oce\u0148ov\u00e1n\u00ed aktiv
  \u2013 zp\u016fsoby ocen\u011bn\u00ed\\n\\nOce\u0148ov\u00e1n\u00ed dlouhodob\u00e9ho
  finan\u010dn\u00edho majetku\\n\\nPod\u00edly a cenn\u00e9 pap\u00edry jsou oce\u0148ov\u00e1ny
  po\u0159izovac\u00ed cenou, kter\u00e1 zahrnuje cenu po\u0159\u00edzen\u00ed a n\u00e1klady
  s po\u0159\u00edzen\u00edm souvisej\u00edc\u00ed. Pokud byly vlo\u017eeny jako p\u0159\u00edplatek
  mimo z\u00e1kladn\u00ed kapit\u00e1l, byly vlo\u017eeny za cenu ocen\u011bn\u00ed
  dle znalec, p\u0159i\u010dem\u017e pro ocen\u011bn\u00ed byla pou\u017eita v\u00fdnosov\u00e1
  metoda diskontovan\u00fdch pen\u011b\u017en\u00edch tok\u016f, resp. majetkov\u00e1
  metoda substan\u010dn\u00ed hodnoty.\\n\\n**Ocen\u011bn\u00ed hmotn\u00e9ho a nehmotn\u00e9ho
  majetku**\\n\\nDlouhodob\u00fd majetek je oce\u0148ov\u00e1n po\u0159izovac\u00ed
  cenou, kter\u00e1 zahrnuje cenu po\u0159\u00edzen\u00ed a n\u00e1klady s po\u0159\u00edzen\u00edm
  souvisej\u00edc\u00ed.\\n\\nDrobn\u00fd hmotn\u00fd majetek do 5 tis. K\u010d se
  neeviduje a je \u00fa\u010dtov\u00e1n p\u0159i po\u0159\u00edzen\u00ed do n\u00e1klad\u016f.\\n\\nDrobn\u00fd
  hmotn\u00fd majetek od 5 tis. K\u010d do 40 tis. K\u010d je p\u0159i po\u0159\u00edzen\u00ed
  po p\u0159edchoz\u00edm za\u0159\u00edzen\u00ed v operativn\u00ed evidenci \u201eDrobn\u00e9ho
  hmotn\u00e9ho majetku\u201c odepisov\u00e1n jednor\u00e1zov\u011b tj. ve v\u00fd\u0161i
  100%.\\n\\nDrobn\u00fd nehmotn\u00fd majetek do 60 tis. K\u010d je \u00fa\u010dtov\u00e1n
  p\u0159i po\u0159\u00edzen\u00ed do n\u00e1klad\u016f.\\n\\n**Odpisov\u00e1n\u00ed**\\n\\n\u00da\u010detn\u00ed
  odpisy jsou vypo\u010dteny na z\u00e1klad\u011b po\u0159izovac\u00ed ceny a p\u0159edpokl\u00e1dan\u00e9
  doby \u017eivotnosti p\u0159\u00edslu\u0161n\u00e9ho majetku. Odpisov\u00fd pl\u00e1n
  je v pr\u016fb\u011bhu pou\u017e\u00edv\u00e1n\u00ed dlouhodob\u00e9ho majetku aktualizov\u00e1n
  na z\u00e1klad\u011b o\u010dek\u00e1van\u00e9 doby \u017eivotnosti.\\n\\n**2.3 P\u0159epo\u010dty
  ciz\u00edch m\u011bn**\\n\\nP\u0159i p\u0159epo\u010dtu ciz\u00edch m\u011bn na
  \u010deskou m\u011bnu je pou\u017e\u00edv\u00e1n denn\u00ed kurs \u010cNB.\\n\\nK
  datu sestaven\u00ed \u00fa\u010detn\u00ed z\u00e1v\u011brky se majetek a z\u00e1vazky
  v ciz\u00ed m\u011bn\u011b p\u0159epo\u010d\u00edt\u00e1vaj\u00ed kursem \u010cNB.
  Rovn\u011b\u017e \u00fadaje rozvahy a v\u00fdkazu zisku a ztr\u00e1ty zahrani\u010dn\u00edch
  dce\u0159in\u00fdch spole\u010dnost\u00ed byly p\u0159epo\u010dteny na K\u010d kursy
  \u010cNB k 31.12.2017.\\n\\n**2.4 Da\u0148 z p\u0159\u00edjm\u016f**\\n\\nSplatn\u00e1
  da\u0148 z p\u0159\u00edjm\u016f se po\u010d\u00edt\u00e1 za pomoci platn\u00e9
  da\u0148ov\u00e9 sazby z \u00fa\u010detn\u00edho zisku zv\u00fd\u0161en\u00e9ho
  nebo sn\u00ed\u017een\u00e9ho o trvale nebo do\u010dasn\u011b da\u0148ov\u011b neuznateln\u00e9
  n\u00e1klady a neda\u0148ov\u00e9 v\u00fdnosy (nap\u0159. tvorba a z\u00fa\u010dtov\u00e1n\u00ed
  ostatn\u00edch rezerv a opravn\u00fdch polo\u017eek, n\u00e1klady na reprezentaci,
  rozd\u00edl mezi \u00fa\u010detn\u00edmi a da\u0148ov\u00fdmi odpisy, nezaplacen\u00e9
  smluvn\u00ed sankce). Za konsolidovan\u00fd celek \u010din\u00ed K\u010d 82 635
  tis.\\n\\nOdlo\u017een\u00e1 da\u0148ov\u00e1 povinnost vych\u00e1z\u00ed z rozd\u00edlu
  mezi \u00fa\u010detn\u00ed a da\u0148ovou z\u016fstatkovou cenou dlouhodob\u00e9ho
  majetku a dal\u0161\u00edch do\u010dasn\u00fdch rozd\u00edl\u016f mezi \u00fa\u010detn\u00edm
  v\u00fdsledkem hospoda\u0159en\u00ed a da\u0148ov\u00fdm z\u00e1kladem, upraven\u00e9ho
  sazbou dan\u011b z p\u0159\u00edjmu pro n\u00e1sleduj\u00edc\u00ed rok. Odlo\u017een\u00e1
  da\u0148ov\u00e1 pohled\u00e1vka se \u00fa\u010dtuje pouze pokud neexistuj\u00ed
  pochybnosti o jej\u00edm da\u0148ov\u00e9m uplatn\u011bn\u00ed v n\u00e1sleduj\u00edc\u00edm
  obdob\u00ed. Ve v\u00fdkazech je odlo\u017een\u00e1 da\u0148 sou\u010d\u00e1st\u00ed
  dan\u011b z p\u0159\u00edjmu a \u010din\u00ed za konsolidovan\u00fd celek K\u010d
  - 284 tis.\\n\\n**2.5 Deriv\u00e1ty**\\n\\nN\u00e1vazn\u011b na dostupn\u00e9 progn\u00f3zy
  o zpevnov\u00e1n\u00ed kurzu \u010desk\u00e9 koruny proti EUR byly mate\u0159skou
  spole\u010dnost\u00ed uzav\u0159eny m\u011bnov\u00e9 zaji\u0161\u0165ovac\u00ed
  obchody (typu forward, swap a opce) na zaji\u0161t\u011bn\u00ed budouc\u00edch pen\u011b\u017en\u00edch
  tok\u016f p\u0159i inkasu budouc\u00edch pohled\u00e1vek v EUR a platb\u00e1ch budouc\u00edch
  z\u00e1vazk\u016f v EUR.\\n\\nK tomu byla zvolena forma zaji\u0161\u0165ovac\u00edho
  \u00fa\u010detnictv\u00ed, jej\u00ed\u017e postupy upravuje samostatn\u00e1 sm\u011brnice.
  \u010c\u00e1st deriv\u00e1t\u016f byla ur\u010dena k obchodov\u00e1n\u00ed a v\u00fdsledky
  p\u0159ecen\u011bn\u00ed k 31.12.2017 byly za\u00fa\u010dtov\u00e1ny v\u00fdsledkov\u011b.
  Zaji\u0161\u0165ovac\u00ed deriv\u00e1ty byly p\u0159ecen\u011bny rozvahov\u011b.
  P\u0159\u00edpadn\u00e9 rozd\u00edly v oce\u0148ov\u00e1n\u00ed u dce\u0159in\u00fdch
  podnik\u016f nemaj\u00ed v\u00fdznamn\u00fd vliv na konsolidovanou \u00fa\u010detn\u00ed
  z\u00e1v\u011brku.\\n\\n2.6 Pou\u017eit\u00e9 metody konsolidace\\n\\nPLN\u00c1
  METODA\\n\\nRozvaha a v\u00fdkaz zisku a ztr\u00e1ty dce\u0159in\u00fdch podnik\u016f
  byly pro pot\u0159eby konsolidace propo\u010dteny kursy \u010cNB k datu \u00fa\u010detn\u00ed
  z\u00e1v\u011brky. Po proveden\u00ed summarizace \u00fadaj\u016f \u00fa\u010detn\u00edch
  z\u00e1v\u011brk\u016f bylo p\u0159istoupeno k vylu\u010dov\u00e1n\u00ed vz\u00e1jemn\u00fdch
  operac\u00ed mezi mate\u0159sk\u00fdm a dce\u0159in\u00fdmi podniky.\\n\\nKonsolida\u010dn\u00ed
  rozd\u00edl\\n\\nCARBOUNION HOLDING, a.s. je vlastn\u00edkem spole\u010dnost\u00ed
  uveden\u00fdch na stran\u011b 3 a\u017e 7. Z rozd\u00edl\u016f mezi po\u0159izovac\u00ed
  cenou pod\u00edlu, resp. jejich ocen\u011bn\u00edm znalcem a jejich ocen\u011bn\u00edm
  podle pod\u00edlov\u00e9 \u00fa\u010dasti na v\u00fd\u0161i vlastn\u00edho kapit\u00e1lu
  ke dni akvizice nebo ke dni dal\u0161\u00edho zv\u00fd\u0161en\u00ed pod\u00edlu
  vznikly kladn\u00e9 i z\u00e1porn\u00e9 konsolida\u010dn\u00ed rozd\u00edly, kter\u00e9
  se odepisuj\u00ed 15 let.\\n\\nMetoda ekvivalence\\n\\nU spole\u010dnosti PURS akciov\u00e1
  spole\u010dnost, IC Profil Kft a ALZA CARGO Sp. z o.o. byla pou\u017eita metoda
  ekvivalence, proto\u017ee mate\u0159sk\u00e1 spole\u010dnost vlastn\u00ed 30,7%
  /PURS/, resp. 10% /IC Profil/ a 33% /ALZA/.\\n\\nVylou\u010den\u00ed \u00fa\u010detn\u00edch
  operac\u00ed bez vlivu na v\u00fdsledek hospoda\u0159en\u00ed\\n\\na) pohled\u00e1vky
  a z\u00e1vazky\\n\\nVz\u00e1jemn\u00e9 pohled\u00e1vky a z\u00e1vazky k 31.12.2017
  byly vylou\u010deny ve v\u00fd\u0161i 449 961 tis. K\u010d. Tuto \u010d\u00e1stku
  ovlivnily p\u016fj\u010dky ve v\u00fd\u0161i K\u010d 349 521 tis., a to p\u0159edev\u0161\u00edm
  spole\u010dnosti CARBOUNION INVEST, spol. s r.o. ve v\u00fd\u0161i K\u010d 115 634
  tis., p\u0159edev\u0161\u00edm na zv\u00fd\u0161en\u00ed z\u00e1kladn\u00edho kapit\u00e1lu
  a d\u00e1le p\u016fj\u010dka spole\u010dnosti CARBOUNION Austria GmbH ve v\u00fd\u0161i
  K\u010d 85 488 tis. a CARBOUNION BOHEMIA spol. s r.o. ve v\u00fd\u0161i K\u010d
  142 083 tis.\\n\\nb) n\u00e1klady a v\u00fdnosy\\n\\nV konsolidaci byly vylou\u010deny
  vz\u00e1jemn\u00e9 n\u00e1klady a v\u00fdnosy ve v\u00fd\u0161i 908 186 tis. K\u010d.\\n\\nTyto
  vz\u00e1jemn\u00e9 n\u00e1klady a v\u00fdnosy ovlivnila p\u0159edev\u0161\u00edm
  spole\u010dnost CARBOSPED spol. s r.o., kter\u00e1 poskytuje p\u0159epravn\u00ed
  slu\u017eby pro spole\u010dnosti holdingu, jejich\u017e hodnota \u010dinila K\u010d
  323 725 tis., d\u00e1le prodej zbo\u017e\u00ed v r\u00e1mci holdingu CARBOUNIONEM
  BOHEMIA spol. s r.o. ve v\u00fd\u0161i K\u010d 302 636 tis. a CARBOUNIONEM Austria
  GmbH ve v\u00fd\u0161i K\u010d 205 011 tis. V\u00fdplata dividend mate\u0159sk\u00e9
  spole\u010dnosti \u010dinila K\u010d 302 000 tis. K\u010d.\\n\\nVylou\u010den\u00ed
  \u00fa\u010detn\u00edch operac\u00ed s vlivem na v\u00fdsledek hospoda\u0159en\u00ed\\n\\nMezi
  spole\u010dnostmi konsolida\u010dn\u00edho celku do\u0161lo k minim\u00e1ln\u00edm
  \u00fa\u010detn\u00edm operac\u00edm s vlivem na v\u00fdsledek hospoda\u0159en\u00ed
  a to z d\u016fvodu prodeje osobn\u00edch automobil\u016f v minul\u00fdch letech
  v r\u00e1mci konsolida\u010dn\u00edho celku \u2013 rozd\u00edl odpis\u016f \u010dinil
  190 tis. K\u010d.\\n\\nKonsolidovan\u00fd v\u00fdsledek hospoda\u0159en\u00ed\\n\\nKonsolidovan\u00fd
  v\u00fdsledek hospoda\u0159en\u00ed za rok 2017 \u010din\u00ed K\u010d 332 854 tis.
  p\u0159ed zdan\u011bn\u00edm /minul\u00fd rok K\u010d 289 558 tis./ a K\u010d 250
  019 po zdan\u011bn\u00ed.\\n\\n3. DOPL\u0147UJ\u00cdC\u00cd \u00daDAJE KE KONSOLIDOVAN\u00c9
  ROZVAZE A V\u00ddKAZU ZISKU A ZTR\u00c1TY\\n\\n3.1 Ud\u00e1losti po datu \u00fa\u010detn\u00ed
  z\u00e1v\u011brky\\n\\nPo datu \u00fa\u010detn\u00ed z\u00e1v\u011brky nedo\u0161lo
  k \u017e\u00e1dn\u00fdm ud\u00e1lostem, kter\u00e9 by ovlivnily hospoda\u0159en\u00ed
  konsolidovan\u00e9 jednotky. U spole\u010dnosti CARBOUNION KOMODITY s.r.o. prob\u00edh\u00e1
  pr\u00e1vn\u00ed spor se spole\u010dnost\u00ed COOP ENERGY a.s., kde se insolven\u010dn\u00ed
  spr\u00e1vce dom\u00e1h\u00e1 ur\u010den\u00ed ne\u00fa\u010dinnosti plateb za zbo\u017e\u00ed
  dodan\u00e9 spole\u010dnost\u00ed CARBOUNION KOMODITY a to ve v\u00fd\u0161i K\u010d
  118 377 612,29. Tento spor byl rozhodnut ve prosp\u011bch spole\u010dnosti COOP
  ENERGY a.s., av\u0161ak spole\u010dnost CARBOUNION KOMODITY s.r.o. podala odvol\u00e1n\u00ed,
  a podle vyj\u00e1d\u0159en\u00ed zastupuj\u00edc\u00ed Advok\u00e1tn\u00ed kancel\u00e1\u0159e
  HAVEL and Partners by m\u011bl b\u00fdt v\u00fdsledek sporu pro KOMODITY \u00fasp\u011b\u0161n\u00fd.
  Schopnost spole\u010dnosti pokra\u010dovat ve sv\u00e9m podnik\u00e1n\u00ed je z\u00e1visl\u00e1
  na v\u00fdsledku tohoto sporu.\\n\\n3.2 Dlouhodob\u00fd majetek\\n\\nDlouhodob\u00fd
  hmotn\u00fd majetek\\n\\nDlouhodob\u00fd hmotn\u00fd majetek tvo\u0159\u00ed zejm\u00e9na
  budovy, jejich vybaven\u00ed, stroje a dopravn\u00ed prost\u0159edky.\\n\\nDlouhodob\u00fd
  nehmotn\u00fd majetek\\n\\nDlouhodob\u00fd nehmotn\u00fd majetek p\u0159edstavuj\u00ed
  softwarov\u00e9 programe pro zpracov\u00e1n\u00ed dat a jin\u00fd nehmotn\u00fd
  majetek.\\n\\n3.3 Pohled\u00e1vky a z\u00e1vazky\\n\\nZ\u00e1vazky po lh\u016ft\u011b
  splatnosti v\u00edce jak 360 dn\u016f nejsou \u017e\u00e1dn\u00e9.\\n\\nPohled\u00e1vky
  po lh\u016ft\u011b splatnosti v\u00edce jak 360 dn\u016f jsou ve v\u00fd\u0161i
  K\u010d 19 371 tis\u00edc, ke kter\u00fdm byly vytvo\u0159eny opravn\u00e9 polo\u017eky
  ve v\u00fd\u0161i 100 %. Jedn\u00e1 se p\u0159edev\u0161\u00edm o pohled\u00e1vky
  za odb\u011bratele, kte\u0159\u00ed vstoupili do insolvence.\\n\\nVe spole\u010dnostech
  konsolida\u010dn\u00edho celku nejsou \u017e\u00e1dn\u00e9 pohled\u00e1vky ani z\u00e1vazky
  star\u0161\u00ed 5 let.\\n\\nPohled\u00e1vky\\n\\nKr\u00e1tkodob\u00e9 pohled\u00e1vky
  p\u0159edstavuj\u00ed zejm\u00e9na pohled\u00e1vky z obchodn\u00edho styku a z\u00e1p\u016fj\u010dky.\\n\\nZ\u00e1vazky\\n\\nKr\u00e1tkodob\u00e9
  z\u00e1vazky p\u0159edstavuj\u00ed zejm\u00e9na z\u00e1vazky z obchodn\u00edho styku
  a z\u00e1p\u016fj\u010dky.\\n\\nV r\u00e1mci skupiny CARBOUNION byl zaveden syst\u00e9m
  vyu\u017e\u00edv\u00e1n\u00ed valn\u00fdch pen\u011b\u017en\u00edch prost\u0159edk\u016f
  jednotliv\u00fdch spole\u010dnost\u00ed skupiny v r\u00e1mci tzv. \u201eCash pool\u201c.
  Prost\u0159edky vlo\u017een\u00e9 do tohoto syst\u00e9mu nebo vyu\u017e\u00edvan\u00e9
  z tohoto syst\u00e9mu jsou k datu \u00fa\u010detn\u00ed z\u00e1v\u011brky vyk\u00e1z\u00e1ny
  v rozvaze v polo\u017ek\u00e1ch \u201eKr\u00e1tkodob\u00e9 pohled\u00e1vky/z\u00e1vazky
  \u2013 ovl\u00e1dan\u00e1 nebo ovl\u00e1daj\u00edc\u00ed osoba.\\n\\n3.4 Vlastn\u00ed
