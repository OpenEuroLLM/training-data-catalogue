  zpo\u017ed\u011bn\u00edm 15\\n   3.1 Metoda krok\u016f ..............................................
  15\\n      3.1.1 Popis metody krok\u016f .................................... 15\\n      3.1.2
  P\u0159\u00edklad 1, metoda krok\u016f ............................... 16\\n      3.1.3
