  2017\\n\\n.................................\\n\\npodpis\\n\\n1 / 1\"", "\"Bakal\u00e1\u0159sk\u00e1
  pr\u00e1ce\\n\\nDiferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm\\n\\nEli\u0161ka
  Brabcov\u00e1 2018\\n\\n\u010cestn\u00e9 prohl\u00e1\u0161en\u00ed\\n\\nProhla\u0161uji,
  \u017ee jsem svoji bakal\u00e1\u0159skou pr\u00e1ci vypracovala samostatn\u011b
  a s pou\u017eit\u00edm informa\u010dn\u00edch pramen\u016f, kter\u00e9 jsou v pr\u00e1ci
  citov\u00e1ny.\\n\\nV Plzni dne ........................................... .......................................................\\n\\nEli\u0161ka
  Brabcov\u00e1\\n\\nPod\u011bkov\u00e1n\u00ed\\n\\nR\u00e1da bych pod\u011bkovala
  sv\u00e9mu vedouc\u00edmu pr\u00e1ce RNDr. Petru Tomiczkovi, CSc. za n\u00e1vrh
  t\u00e9matu bakal\u00e1\u0159sk\u00e9 pr\u00e1ce, rady i p\u0159ipom\u00ednky a
  hlavn\u011b za velice klidn\u00fd p\u0159\u00edstup v pr\u016fb\u011bhu cel\u00e9ho
  zpracov\u00e1n\u00ed.\\n\\nAbstrakt\\n\\nP\u0159edm\u011btem t\u00e9to pr\u00e1ce
  jsou diferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm. Je zde definov\u00e1no
  zpo\u017ed\u011bn\u00ed, syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm,
  po\u010d\u00e1te\u010dn\u00ed podm\u00ednka a po\u010d\u00e1te\u010dn\u00ed \u00faloha
  pro syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm. Uvedeny
  jsou tak\u00e9 kvalitativn\u00ed vlastnosti \u0159e\u0161en\u00ed a metody pro \u0159e\u0161en\u00ed
  diferenci\u00e1ln\u00edch rovnic s konstantn\u00edm zpo\u017ed\u011bn\u00edm. D\u00e1le
  jsou zde pops\u00e1ny p\u0159\u00edklady model\u016f v oblasti biologie. Model dravec-ko\u0159ist
  je \u0159e\u0161en pomoc\u00ed metody krok\u016f a n\u00e1sledn\u011b ov\u011b\u0159en
  numerick\u00fdm v\u00fdpo\u010dtem pomoc\u00ed softwaru Wolfram Mathematica.\\n\\nKl\u00ed\u010dov\u00e1
  slova: diferenci\u00e1ln\u00ed rovnice se zpo\u017ed\u011bn\u00edm, zpo\u017ed\u011bn\u00ed,
  kvalitativn\u00ed vlastnosti \u0159e\u0161en\u00ed, konstantn\u00ed zpo\u017ed\u011bn\u00ed,
  metoda krok\u016f, Laplaceova transformace, modely populac\u00ed, model dravec-ko\u0159ist\\n\\nAbstract\\n\\nThe
  subject of this thesis are delay differential equations. Delay, system of delay
  differential equations, initial condition and initial value problem are defined
  here. The qualitative theory and solution methods for constant delay differential
  equations are also mentioned. Furthermore, examples of biological models are described.
  The predator-prey model is solved using the method of steps and subsequently verified
  by a numerical calculation using the Wolfram Mathematica software.\\n\\nKeywords:
  delay differential equations, delay, qualitative theory, constant delay, method
  of steps, Laplace transform, population models, predator-prey model\\n\\n\u00davod\\n\\nV
  t\u00e9to pr\u00e1ci se v\u011bnujeme diferenci\u00e1ln\u00edm rovnic\u00edm se
  zpo\u017ed\u011bn\u00edm a jejich aplikac\u00edm. V prvn\u00ed kapitole je p\u0159edstaveno
  zpo\u017ed\u011bn\u00ed v jeho r\u016fzn\u00fdch podob\u00e1ch. U ka\u017ed\u00e9ho
  takov\u00e9ho druhu zpo\u017ed\u011bn\u00ed je krom\u011b z\u00e1pisu diferenci\u00e1ln\u00ed
  rovnice a syst\u00e9mu diferenci\u00e1ln\u00edch rovnic uveden p\u0159\u00edklad
  re\u00e1ln\u00e9ho modelu se zam\u011b\u0159en\u00edm na oblast biologie. D\u00e1le
  je definov\u00e1n syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm,
  po\u010d\u00e1te\u010dn\u00ed podm\u00ednka a n\u00e1sledn\u011b po\u010d\u00e1te\u010dn\u00ed
  \u00faloha pro syst\u00e9m diferenci\u00e1ln\u00edch rovnic se zpo\u017ed\u011bn\u00edm
  v\u010detn\u011b odvozen\u00ed a vysv\u011btlen\u00ed z\u00e1pis\u016f.\\n\\nDruh\u00e1
  kapitola je v\u011bnov\u00e1na kvalitativn\u00edm vlastnostem \u0159e\u0161en\u00ed
  diferenci\u00e1ln\u00edch rovnic s omezen\u00fdm zpo\u017ed\u011bn\u00edm. V jej\u00ed
  prvn\u00ed \u010d\u00e1sti definujeme spojitost a lipschitzovskost, ve druh\u00e9
  \u010d\u00e1sti se pak zab\u00fdv\u00e1me existenc\u00ed a jednozna\u010dnost\u00ed
  \u0159e\u0161en\u00ed.\\n\\nVe t\u0159et\u00ed kapitole jsou uvedeny metody \u0159e\u0161en\u00ed
  diferenci\u00e1ln\u00edch rovnic s konstantn\u00edm zpo\u017ed\u011bn\u00edm. P\u0159ibli\u017eujeme
  zde metodu krok\u016f a Laplaceovu transformaci a tak\u00e9 jsou zde uvedeny p\u0159\u00edklady.\\n\\nV
  posledn\u00ed kapitole jsou seps\u00e1ny poznatky ohledn\u011b modelov\u00e1n\u00ed
  v\u00fdvoje jednodruhov\u00fdch a dvoudruhov\u00fdch populac\u00ed. Nejprve je odvozena
  diferenci\u00e1ln\u00ed rovnice popisuj\u00edc\u00ed populaci a n\u00e1sledn\u011b
  je zavedeno zpo\u017ed\u011bn\u00ed. Jsou zde uvedeny z\u00e1kladn\u00ed typy vz\u00e1jemn\u00e9
  interakce dvoudruhov\u00fdch populac\u00ed, z nich\u017e byl pro detailn\u011bj\u0161\u00ed
  zkoum\u00e1n\u00ed zvolen vztah dravec-ko\u0159ist. Syst\u00e9m diferenci\u00e1ln\u00edch
  rovnic se zpo\u017ed\u011bn\u00edm modeluj\u00edc\u00ed vztah dravec-ko\u0159ist
  je odvozen, zpracov\u00e1n metodou krok\u016f pro zjednodu\u0161en\u00e9 po\u010d\u00e1te\u010dn\u00ed
  nastaven\u00ed a d\u00e1le \u0159e\u0161en pomoc\u00ed numerick\u00e9ho softwaru
  Wolfram Mathematica. V\u00fdsledky v\u00fdpo\u010dtu se s numerick\u00fdm v\u00fdpo\u010dtem
  shoduj\u00ed a nav\u00edc je sepsan\u00fd program vhodn\u00fd pro v\u00fdpo\u010dty
  dlouhodob\u011bj\u0161\u00edho v\u00fdvoje.\\n\\n| Zna\u010den\u00ed | Definice
