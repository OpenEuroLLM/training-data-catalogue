  Vinohradech.\\n\\nZ\u0160 B\u0158E\u010c\u0164ANOV\u00c1\\nB\u0159e\u010d\u0165anov\u00e1
  2919/6, www.zsbrectanova.cz\\n\\n6/12 16.00\u201317.30\\nV\u00c1NO\u010cN\u00cd
  SETK\u00c1N\u00cd\\n\\n11/12 17.30\\nV\u00c1NO\u010cN\u00cd KONCERT\\nKoncert s
  rozsv\u00edcen\u00edm stromu p\u0159ed pavilonem H.\\n\\nZ\u0160 OLE\u0160SK\u00c1\\nOle\u0161sk\u00e1
  2222/18, www.zs-olesska.cz\\n\\n20/12 18.00\\nROZSV\u00cdCEN\u00cd V\u00c1NO\u010cN\u00cdHO
  STROMKU\\n\\nV\u00c1NO\u010cN\u00cd STROMKY OP\u011aT ROZZ\u00c1\u0158\u00cd DES\u00cdTKU\\n\\nZa\u010d\u00e1tek
  adventu je spojen s rozsv\u011bcen\u00edm v\u00e1no\u010dn\u00edch stromk\u016f,
  kter\u00e9 nejen\u017ee navozuj\u00ed tu pravou v\u00e1no\u010dn\u00ed atmosf\u00e9ru,
  ale nav\u00edc spojuj\u00ed sousedy z jednotliv\u00fdch \u010dtvrt\u00ed. Des\u00edtku
  rozza\u0159\u00ed 11 velk\u00fdch strom\u016f, dopln\u00ed je 33 mal\u00fdch stromk\u016f
  na Kub\u00e1nsk\u00e9m n\u00e1m\u011bst\u00ed. Ty pat\u0159\u00ed \u017e\u00e1k\u016fm
  a \u017e\u00e1ky\u0148\u00edm m\u00edstn\u00edch z\u00e1kladn\u00edch a mate\u0159sk\u00fdch
  \u0161kol.\\n\\nPod\u00edvejte se, jak vypadaly ozdoben\u00e9 v\u00e1no\u010dn\u00ed
  symboly v r\u016fzn\u00fdch \u010d\u00e1stech Prahy 10 b\u011bhem n\u011bkolika
  posledn\u00edch let. A nezapome\u0148te, \u017ee v ned\u011bli 3. 12. 2023 budete
  m\u00edt p\u0159\u00edle\u017eitost vyfotografovat si rozsv\u00edcen\u00ed t\u011bch
  letosn\u00edch.\\n\\nD\u011aTI V PRAZE 10 MAJ\u00cd KVALITN\u011aJ\u0160\u00cd VZD\u011aL\u00c1V\u00c1N\u00cd
  D\u00cdKY EVROPSK\u00ddM I N\u00c1RODN\u00cdM PROGRAM\u016eM\\n\\nM\u011bstsk\u00e1
  \u010d\u00e1st Praha 10 uzav\u0159ela v listopadu 2023 ji\u017e t\u0159et\u00ed
  projekt M\u00edstn\u00ed ak\u010dn\u00ed pl\u00e1n rozvoje vzd\u011bl\u00e1v\u00e1n\u00ed
  III., tzv. MAP, ve \u0161kol\u00e1ch um\u00edst\u011bn\u00fdch v katastru des\u00e1t\u00e9
  m\u011bstsk\u00e9 \u010d\u00e1sti. Tento projekt byl zam\u011b\u0159en na prohlouben\u00ed
  spolupr\u00e1ce subjekt\u016f p\u016fsob\u00edc\u00edch v oblasti z\u00e1kladn\u00edho
  a p\u0159ed\u0161koln\u00edho vzd\u011bl\u00e1v\u00e1n\u00ed. D\u00edky n\u011bmu
  do\u0161lo ke zlep\u0161en\u00ed kvality vzd\u011bl\u00e1v\u00e1n\u00ed, roz\u0161\u00ed\u0159en\u00ed
  nab\u00eddky vzd\u011bl\u00e1vac\u00edch aktivit, podpo\u0159e inkluzivn\u00edch
  p\u0159\u00edstup\u016f a sout\u011b\u017e\u00ed pro d\u011bti a k mnoha dal\u0161\u00edm
  pozitivn\u00edm zm\u011bn\u00e1m.\\n\\nMAP je osv\u011bd\u010den\u00e1 kvalitn\u00ed
  platforma pro setk\u00e1v\u00e1n\u00ed pedagog\u016f, \u0159editel\u016f, rodi\u010d\u016f
  a dal\u0161\u00edch zainteresovan\u00fdch stran, jej\u00edm\u017e prost\u0159ednictv\u00edm
  mohou sd\u00edlet sv\u00e9 zku\u0161enosti a spole\u010dn\u011b posunout vzd\u011bl\u00e1vac\u00ed
  syst\u00e9m d\u00e1le sm\u011brem k pot\u0159eb\u00e1m 21. stolet\u00ed. \u201eSd\u00edlen\u00ed
  informac\u00ed, know-how a prohlubov\u00e1n\u00ed spolupr\u00e1ce je cestou ke kvalitn\u011bj\u0161\u00edmu
  vzd\u011bl\u00e1v\u00e1n\u00ed. Z\u00e1stupci instituc\u00ed se mohou inspirovat
  dobrou prax\u00ed, z\u00e1rove\u0148 se vyvaruj\u00ed proslap\u00e1v\u00e1n\u00ed
  slep\u00fdch ulicek. Spolupr\u00e1ce a komunikace je prosp\u011b\u0161n\u00e1 pro
  v\u0161echny zapojen\u00e9 akt\u00e9ry,\u201d \u0159\u00edk\u00e1 radn\u00ed pro
  \u0161kolstv\u00ed Ond\u0159ej Po\u010d\u00e1rovsk\u00fd.\\n\\nZapojeny M\u0160
  i Z\u0160 z Des\u00edtky\\n\\nDo MAPu jsou obecn\u011b zapojeny mate\u0159sk\u00e9
  a z\u00e1kladn\u00ed \u0161koly z\u0159izovan\u00e9 m\u011bstskou \u010d\u00e1st\u00ed
  Praha 10, \u0161koly z\u0159izovan\u00e9 Magistr\u00e1tem hlavn\u00edho m\u011bsta
  Prahy (speci\u00e1ln\u00ed nebo z\u00e1kladn\u00ed um\u011bleck\u00e9) a tak\u00e9
  \u0161koly v soukrom\u00e9m vlastnictv\u00ed na \u00fazem\u00ed m\u011bstsk\u00e9
  \u010d\u00e1sti Praha 10. Celkem se zapojilo t\u00e9m\u011b\u0159 pades\u00e1t mate\u0159sk\u00fdch,
  z\u00e1kladn\u00edch a z\u00e1kladn\u00edch um\u011bleck\u00fdch \u0161kol. Pro
  33 ze 47 subjekt\u016f je z\u0159izovatelem pr\u00e1v\u011b Praha 10. Zbyvaj\u00edc\u00edch
  14 m\u00e1 jin\u00e9ho z\u0159izovatele.\\n\\nNov\u00e9 multimedi\u00e1ln\u00ed
  u\u010debny, modern\u00ed polytechnick\u00e1 v\u00fduka\\n\\nMAP III., jak n\u00e1zvy
  napov\u00edd\u00e1, navazuje na MAP I a II. I v r\u00e1mci t\u011bchto ak\u010dn\u00edch
  pl\u00e1n\u016f se poda\u0159ilo ve \u0161kol\u00e1ch \u00fasp\u011b\u0161n\u011b
  realizovat \u0159adu konkr\u00e9tn\u00edch v\u011bc\u00ed, mezi kter\u00e9 pat\u0159\u00ed
  podpora environment\u00e1ln\u00edho a polytechnick\u00e9ho vzd\u011bl\u00e1v\u00e1n\u00ed,
  modernizace polytechnick\u00e9 u\u010debny, odborn\u00e9 u\u010debny pro p\u0159\u00edrodn\u00ed
  v\u011bdy, modernizace v\u00fduky p\u0159\u00edrodn\u00edch v\u011bd, modernizace
  u\u010deben pro \u010dten\u00e1\u0159skou gramotnost, modernizace u\u010deben fyziky,
  multimedi\u00e1ln\u00ed u\u010debna pro v\u00fduku a mnoho dal\u0161\u00edch. \u0158ada
  mate\u0159sk\u00fdch a z\u00e1kladn\u00edch \u0161kol byla a je tak\u00e9 zapojena
  do v\u00fdzvy t\u00fdkaj\u00edc\u00ed se za\u010dle\u0148ov\u00e1n\u00ed a podpory
  \u017e\u00e1k\u016f s odli\u0161n\u00fdm mate\u0159sk\u00fdm jazykem.\\n\\nAktualizace
  strategick\u00fdch dokument\u016f\\n\\nMAP III p\u0159edstavoval p\u0159echodn\u00e9
  obdob\u00ed sm\u011brem k nadch\u00e1zej\u00edc\u00edmu projektu MAP IV a jeho hlavn\u00edm
  c\u00edlem bylo pokra\u010dov\u00e1n\u00ed partnerstv\u00ed s dan\u00fdmi subjekty.
  To znamenalo pr\u016fb\u011b\u017en\u00e9 aktualizace strategick\u00fdch a koncep\u010dn\u00edch
  dokument\u016f. Spole\u010dn\u011b se z\u00e1stupci jednotliv\u00fdch subjekt\u016f,
  tedy \u0161kol, se p\u0159ipravovaly pl\u00e1ny pro n\u00e1sleduj\u00edc\u00ed t\u0159i
  roky. Kl\u00ed\u010dov\u00fdm datem byl 2. listopad, kdy prob\u011bhlo z\u00e1v\u011bre\u010dn\u00e9
  setk\u00e1n\u00ed z\u00e1stupc\u016f \u0161kol v\u011bnovan\u00e9 problematice kvality
  vzd\u011bl\u00e1v\u00e1n\u00ed.\\n\\nM\u011bstsk\u00e1 \u010d\u00e1st z\u00edskala
  d\u00edky evropsk\u00fdm projekt\u016fm v r\u00e1mci Opera\u010dn\u00edho programu
  Praha \u2013 p\u016fl r\u016fstu, do kter\u00e9ho spadaj\u00ed i MAPy, od roku 2018
  v\u00edce ne\u017e 45 milion\u016f korun.\\n\\nPARK POD RAPIDEM NOV\u011a PONESE
  JM\u00c9NO RUTH BONDYOV\u00c9\\n\\nVr\u0161ovick\u00e1 roda\u010dka Ruth Bondyov\u00e1
  pro\u0161la za II. sv\u011btov\u00e9 v\u00e1lky dv\u011bma koncentra\u010dn\u00edmi
  t\u00e1bory. Po jej\u00edm konci se rozhodla odej\u00edt do Izraele, kde se za\u010dala
  v\u011bnovat novin\u00e1\u0159sk\u00e9 pr\u00e1ci, psan\u00ed a p\u0159ekladatelstv\u00ed.
  Do hebrejskiny p\u0159elo\u017eila d\u00edla mnoh\u00fdch velik\u00e1n\u016f \u010desk\u00e9
  literatury 20. stolet\u00ed. Nyn\u00ed po n\u00ed byl pojmenov\u00e1n park v Praze
  10, kter\u00fd dosud nesl n\u00e1zev Pod Rapidem.\\n\\nP\u0159ejmenov\u00e1n\u00ed
  parku je spole\u010dnou iniciativou veden\u00ed m\u011bstsk\u00e9 \u010d\u00e1sti
  a izraelsk\u00e9 velvyslanckyn\u011b Anny Azari. Ta p\u0159i p\u0159\u00edle\u017eitosti
  100. v\u00fdro\u010d\u00ed narozen\u00ed Ruth Bondyov\u00e9 oslovila m\u011bstskou
  \u010d\u00e1st. Rada jej\u00ed n\u00e1vrh podpo\u0159ila. Posledn\u00ed slovo m\u011bl
  pra\u017esk\u00fd magistr\u00e1t, kter\u00fd o p\u0159ejmenov\u00e1n\u00ed park\u016f
  a ulic zpravidla na n\u00e1vrhy m\u011bstsk\u00fdch \u010d\u00e1st\u00ed rozhoduje.
  \u201eKdy\u017e jsem se sezn\u00e1moval s podklady a \u017eivotem Ruth Bondyov\u00e9,
  p\u0159ipomn\u011bl jsem si, o kolik bolestn\u011bj\u0161\u00ed jsou velk\u00e9
  d\u011bjiny, pokud jsou vypr\u00e1v\u011bny prost\u0159ednictv\u00edm konkr\u00e9tn\u00edho
  osudu. O to \u00factyhodn\u011bj\u0161\u00ed je, \u017ee tato vr\u0161ovick\u00e1
  roda\u010dka nikdy nezanev\u0159ela na svou rodnou zem, um\u00edst\u011bnou v sam\u00e9m
  srdci Evropy. Ve sv\u00e9 biografii dokonce uvedla, \u017ee narodit se v Pra-\\n\\nRuth
  Bondyov\u00e1 za sv\u016fj \u017eivot p\u0159elo\u017eila do hebrej\u0161tiny \u010dty\u0159i
  des\u00edtky \u010desk\u00fdch knih. Mezi nimi nechyb\u011bla d\u00edla Karla \u010capka,
  Jaroslava Ha\u0161ka, Bohumila Hrabala nebo V\u00e1clava Havla. D\u00edky n\u00ed
  se Izraelci mohli sezn\u00e1mit s \u010deskou satirou a n\u00e1hledem na sv\u011bt.
  Navzdory t\u011b\u017ek\u00fdm osudov\u00fdm zkou\u0161k\u00e1m j\u00ed pr\u00e1v\u011b
  tento styl humoru z\u016fstal vlastn\u00ed. V Izraeli se pod\u00edlela na prvn\u00edm
  rozhlasov\u00e9m satirick\u00e9m po\u0159adu.\\n\\n\u0158\u00eddila se heslem nikdy
  se nevzd\u00e1t a bojovat. D\u00edky tomu i d\u00edky n\u00e1hod\u011b p\u0159e\u017eila
  holocaust. V Osv\u011btimi byla sv\u011bdkem vyvra\u017ed\u011bn\u00ed spoluv\u011bz\u0148\u016f
  z rodinn\u00e9ho t\u00e1bora. N\u00e1sledn\u011b byla nucen\u011b nasazen\u00e1
  v Hamburku na odkl\u00edzen\u00ed trosek po spojeneck\u00fdch n\u00e1letech. Nakonec
  byla internov\u00e1na v koncentra\u010dn\u00edm t\u00e1bo\u0159e Bergen-Belsen.
  \u201eNikdo si nemyslel, \u017ee dojde k vyhl\u00e1\u0161en\u00ed. Moji rodi\u010de
  \u0159\u00edkali, \u017ee se uskromn\u011b. Op\u00edrali se o historickou zku\u0161enost
  \u017did\u016f s pogromy, pron\u00e1sledov\u00e1n\u00edm a chudobou. Nikdo si samo\u0159\u00edznejm\u011b
  nep\u0159edstavoval plynov\u00e9 komory. I dnes se \u010dlov\u011bk pt\u00e1: Jak
  je to mo\u017en\u00e9? Jak tam nahnali ty miliony? V\u017edy\u0165 je to nemysliteln\u00e9.\u201c
  \u0159ekla Bondyov\u00e1 historik\u016fm z projektu Pam\u011bti n\u00e1roda.\\n\\nS
  parkem nejsou spojena konkr\u00e9tn\u00ed popisn\u00e1 \u010d\u00edsla. Jeho p\u0159ejmenov\u00e1n\u00ed
  tak nevy\u017eaduje dodate\u010dn\u00e9 n\u00e1klady nebo nutnost m\u011bnit si
  ob\u010dansk\u00e9 pr\u016fkazy.\\n\\nU\u017e v\u00e1m nic neute\u010de\\n\\nD\u016fle\u017eit\u00e9
  informace z Prahy 10 p\u0159\u00edmo do va\u0161eho telefonu\\n\\n- Rychl\u00e9
  zpr\u00e1vy do mobilu\\n- Aktu\u00e1ln\u00ed informace z m\u011bstsk\u00e9 \u010d\u00e1sti\\n-
  Pozv\u00e1nky na ud\u00e1losti\\n- Upozorn\u011bn\u00ed na blokov\u00e1 \u010di\u0161t\u011bn\u00ed
  a odst\u00e1vky\\n- Hl\u00e1\u0161en\u00ed podn\u011bt\u016f a z\u00e1vad\\n\\nSt\u00e1hn\u011bte
  si aplikaci MUNIPOLIS\\n\\nP\u0159ihlaste se k odb\u011bru na praha10.munipolis.cz\\n\\nCo
  m\u00e1m d\u011blat, kdy\u017e n\u00e1doby na t\u0159\u00edd\u011bn\u00ed nesta\u010d\u00ed,
  kde po\u017eadat o p\u0159istaveni nov\u00fdch?\\nV sou\u010dasn\u00e9 dob\u011b
  je v ulic\u00edch Prahy 10 celkem 281 stanovi\u0161\u0165 t\u0159\u00edd\u011bn\u00e9ho
  sb\u011bru, tedy m\u00edst, kde se nach\u00e1zej\u00ed ve\u0159ejn\u011b p\u0159\u00edstupn\u00e9
  sb\u011brn\u00e9 n\u00e1doby na odd\u011blen\u00e9 odkl\u00e1d\u00e1n\u00ed plast\u016f,
  pap\u00edru, skla a dal\u0161\u00edch t\u0159\u00edd\u011bn\u00fdch slo\u017eek
  dom\u00e1c\u00edch odpad\u016f. Nastaven\u00ed \u010detnosti v\u00fdvozu jednotliv\u00fdch
  n\u00e1dob se v r\u016fzn\u00fdch lokalit\u00e1ch li\u0161\u00ed. N\u011bkde je
  dost\u00e1vaj\u00edc\u00ed vyv\u00e1\u017eet pap\u00edr dvakr\u00e1t t\u00fddn\u011b,
  jinde je nutn\u00e9, aby n\u00e1doba byla vyprazdrov\u00e1na p\u011btkr\u00e1t i
  v\u00edcekr\u00e1t za t\u00fdden. Pokud se opakovan\u011b setk\u00e1v\u00e1te s
  t\u00edm, \u017ee kapacita n\u00e1doby nedost\u00e1v\u00e1, pak je pro zlep\u0161en\u00ed
  situace v m\u00edst\u011b pot\u0159eba uv\u011bdomit o tom \u00fa\u0159ad m\u011bstsk\u00e9
  \u010d\u00e1sti. V Praze 10 lze nap\u0159. zasl\u00e1t podn\u011bt vyu\u017eit\u00edm
  \u201eodpadov\u00e9ho\u201c e-mailu firstname.lastname@example.org, anebo nedostate\u010dn\u00fd
  objem ozn\u00e1mit jako z\u00e1vadu k \u0159e\u0161en\u00ed na e-mail email@example.com.
  Situaci na stanovi\u0161t\u011b n\u00e1sledn\u011b prov\u011b\u0159uj\u00ed pracovn\u00edci
  Odboru \u017eivotn\u00edho prost\u0159ed\u00ed, kte\u0159\u00ed v p\u0159\u00edpad\u011b,
  \u017ee se informace potvrd\u00ed, podaj\u00ed \u017e\u00e1dost o nav\u00fd\u0161en\u00ed
  \u010detnosti v\u00fdvozu na Magistr\u00e1t hlavn\u00edho m\u011bsta Prahy.\\n\\nKa\u017edou
  prvn\u00ed st\u0159edu sly\u0161\u00edme zkou\u0161ku sir\u00e9n, jak pozn\u00e1m,
  \u017ee hroz\u00ed skute\u010dn\u011b nebezpe\u010d\u00ed?\\nJedn\u00edm z pro\u0159\u00e1d\u0148ov\u00fdch
  opat\u0159en\u00ed, jak v\u010das varovat obyvatelstvo p\u0159ed hroz\u00edc\u00edm
  nebezpe\u010d\u00edm (povodn\u011bmi, n\u00e1sledky hav\u00e1ri\u00ed s \u00fanikem
  nebezpe\u010dn\u00fdch l\u00e1tek, nebezpe\u010d\u00edm velk\u00fdch po\u017e\u00e1r\u016f
  atd.), je varov\u00e1n\u00ed formou sir\u00e9n.\\n\\nPrvn\u00ed st\u0159edu v m\u011bs\u00edci
  prob\u00edh\u00e1 na cel\u00e9m \u00fazem\u00ed republiky akustick\u00e1 zkou\u0161ka
  provozuschopnosti cel\u00e9ho syst\u00e9mu varov\u00e1n\u00ed. Ve 12:00 se sir\u00e9ny
  rozeznaj\u00ed zkusebn\u00edm nep\u0159eru\u0161ovan\u00fdm t\u00f3nem po dobu 140
  sekund. V p\u0159\u00edpad\u011b re\u00e1ln\u00e9 hrozby nebo vzniku mimo\u0159\u00e1dn\u00e9
  ud\u00e1losti je obyvatelstvo varov\u00e1no prost\u0159ednictv\u00edm varovn\u00e9ho
  sign\u00e1lu \u201eV\u0161eobecn\u00e1 v\u00fdstraha\u201c. Tento sign\u00e1l je
  vyhla\u0161ov\u00e1n kolisav\u00fdm t\u00f3nem sir\u00e9ny po dobu 140 vte\u0159in
  a m\u016f\u017ee zazn\u00edt t\u0159ikr\u00e1t po sob\u011b v \u010dase t\u0159in\u00e1ctov\u00fdch
  intervalech. U elektronick\u00fdch sir\u00e9n po tomto sign\u00e1lu okam\u017eit\u011b
  n\u00e1sleduje mluvn\u00e1 verb\u00e1ln\u00ed informace, kterou se sd\u011bluj\u00ed
  obyvatelstvu \u00fadaje o bezprost\u0159edn\u00edm nebezpe\u010d\u00ed vzniku nebo
  ji\u017e nastal\u00e9 mimo\u0159\u00e1dn\u00e9 ud\u00e1losti a opat\u0159en\u00ed
  k ochran\u011b obyvatelstva. Dal\u0161\u00edm sign\u00e1lem (n\u00edzk\u00fdm varovn\u00fdm),
  kter\u00fd sir\u00e9ny mohou vys\u00edlat, je \u201ePo\u017e\u00e1rn\u00ed poplach\u201c,
  kter\u00fd slou\u017e\u00ed ke svol\u00e1n\u00ed jednotek po\u017e\u00e1rn\u00ed
  ochrany. Tento sign\u00e1l je vyhla\u0161ov\u00e1n p\u0159eru\u0161ovan\u00fdm t\u00f3nem
  sir\u00e9ny po dobu 1 minutu. U elektronick\u00fdch sir\u00e9n n\u00e1sleduje po
  akustick\u00e9m t\u00f3nu verb\u00e1ln\u00ed informace.\\n\\nP\u0159ehled sign\u00e1l\u016f,
  verb\u00e1ln\u00edch informac\u00ed z elektronick\u00fdch sir\u00e9n a podrobn\u00e9
  informace o tom, jak se chovat, kdy\u017e zazn\u00ed sir\u00e9na, najdete na na\u0161ich
  str\u00e1nk\u00e1ch https://praha10.cz/mestska-cast/bezpecnost/mimoradne--udalosti.
  Na danych str\u00e1nk\u00e1ch tak\u00e9 naleznete informace z Krizov\u00e9ho \u0161t\u00e1bu,
  ochrany p\u0159ed povodn\u011bmi, ukryt\u00ed nebo o p\u0159\u00edpadn\u00e9 evakuaci
  a dal\u0161\u00ed.\\n\\nKdo zaji\u0161\u0165uje deratizaci na ve\u0159ejn\u00fdch
  ploch\u00e1ch? Kam nahl\u00e1sit v\u00fd\u0161ky potkan\u016f?\\nHlavn\u00ed m\u011bsto
  Praha zaji\u0161\u0165uje ka\u017ed\u00fd rok plnouc\u00ed deratizaci ve\u0159ejn\u00fdch
  prostranstv\u00ed, kter\u00e9 m\u00e1 ve sv\u00e9m vlastnictv\u00ed. V sou\u010dinnosti
  s organizac\u00ed Pra\u017esk\u00e9 vodovody a kanalizace se prov\u00e1d\u00ed jej\u00ed
  z\u00e1sahy v kanaliza\u010dn\u00ed s\u00edti. Souhrn lok\u00e1lit, kde tyto pr\u00e1ce
  prob\u00edhaj\u00ed na \u00fazem\u00ed Prahy 10, je na webov\u00fdch str\u00e1nk\u00e1ch
  www.praha10.cz ve slo\u017ece \u201e\u017eivotn\u00ed prost\u0159ed\u00ed \u2013
  \u00fadr\u017eba a \u00faklid\u201c. Obdobn\u011b m\u011bstsk\u00e1 \u010d\u00e1st
  zaji\u0161\u0165uje v p\u0159\u00edpad\u011b zv\u00fd\u0161en\u00e9ho v\u00fdskytu
  potkan\u016f deratiza\u010dn\u00ed z\u00e1sah na pozemc\u00edch sv\u011b\u0159en\u00fdch
  do vlastn\u00ed spr\u00e1vy. V ostatn\u00edch p\u0159\u00edpadech by ochranou deratizaci
  m\u011bl prov\u00e9st p\u0159\u00edslu\u0161n\u00fd vlastn\u00edk pozemku, domu
  \u010di jin\u00e9ho objektu. S dotazy k problematice je mo\u017en\u00e9 se obra\u0165
  na Hygienickou stanici hlavn\u00edho m\u011bsta Prahy \u2013 firstname.lastname@example.org,
  kter\u00e1 zaji\u0161\u0165uje dohled nad prov\u00e1d\u011bn\u00edm deratizace v
  Praze.\\n\\nV m\u011bs\u00ed\u010dn\u00edku vid\u00edm pravidelnou rubriku Jak se
  podnik\u00e1 na Des\u00edtce. Jak vyb\u00edr\u00e1te jednotliv\u00e9 podniky, jak\u00e9
  jsou podm\u00ednky zve\u0159ejn\u011bn\u00ed \u010dl\u00e1nk\u016f?\\nPravideln\u00e1
  rubrika Jak se podnik\u00e1 na Des\u00edtce je mezi \u010dten\u00e1\u0159i obl\u00edbenou
  str\u00e1nkou v m\u011bs\u00ed\u010dn\u00edku. Tato rubrika slou\u017e\u00ed hlavn\u011b
  jako bezplatn\u00e1 podpora zaveden\u00fdm, ale i nov\u00fdm podnikatel\u016fm z
  Prahy 10, kte\u0159\u00ed p\u0159in\u00e1\u0161ej\u00ed rezident\u016fm Des\u00edtky
  slu\u017eby s p\u0159esahem a jejich podnik m\u016f\u017ee p\u0159ib\u00fdt. Jednotliv\u00e9
  podniky jsou vyb\u00edr\u00e1ny z tip\u016f \u010dten\u00e1\u0159\u016f n\u00e1hodn\u011b
  a tak\u00e9 podle jednotliv\u00fdch obor\u016f. Sna\u017e\u00edme se, aby se po
  sob\u011b neopakovaly stejn\u00e9 druhy a typy podnikatelsk\u00fdch z\u00e1m\u011br\u016f.
  V p\u0159\u00edpad\u011b, \u017ee by n\u011bkter\u00fd z podnikatel\u016f Des\u00edtky
  cht\u011bl sd\u011blit sv\u016fj p\u0159\u00edb\u011bh, jak vybudoval sv\u00e9 podnik\u00e1n\u00ed,
  a cht\u011bl p\u0159edstavit sv\u00e9 slu\u017eby \u010dten\u00e1\u0159\u016fm m\u011bs\u00ed\u010dn\u00edku
  Prahy 10, m\u016f\u017ee sv\u016fj po\u017eadavek zaslat na e-mail email@example.com.
  Nem\u016f\u017eeme slibit, \u017ee se na n\u011bj okam\u017eit\u011b dostane, n\u00e1vrh
  je v \u0159ad\u011b mnoho, ale ur\u010dit\u011b se mu z na\u0161\u00ed redakce ozvou
  se zp\u011btnou vazbou.\\n\\nPoprv\u00e9 jsem na\u010detl QR k\u00f3d z tituln\u00ed
  strany m\u011bs\u00ed\u010dn\u00edku, p\u0159ehodilo m\u011b to na digit\u00e1ln\u00ed
  verzi m\u011bs\u00ed\u010dn\u00edku pod Munipolis. K \u010demu je\u0161t\u011b Munipolis
  slou\u017e\u00ed? Vyplat\u00ed se st\u00e1hnout tuto aplikaci do mobilu, m\u00e1
  to v\u016fbec smysl?\\nMUNIPOLIS je takov\u00fd obecn\u00ed rozhlas pro 21. stolet\u00ed.
  Jde o otev\u0159en\u00fd informa\u010dn\u00ed kan\u00e1l spojuj\u00edc\u00ed m\u011bsta,
  m\u011bstsk\u00e9 \u010d\u00e1sti a obce s jejich ob\u010dany a komunitami. Z\u00e1rove\u0148
  je to d\u016fle\u017eit\u00fd kan\u00e1l pro krizovou komunikaci m\u011bstsk\u00e9
  \u010d\u00e1sti. V p\u0159\u00edpad\u011b pot\u0159eby dok\u00e1\u017ee tato aplikace
  velmi rychle a efektivn\u011b varovat registrovan\u00e9 u\u017eivatele.\\n\\nOb\u010dan\u016fm
  doporu\u010dujeme aplikaci st\u00e1hnout, proto\u017ee sv\u00fdmi mo\u017enostmi
  a funkcionalitami dalece p\u0159esahuje mo\u017enosti soci\u00e1ln\u00edch s\u00edt\u00ed.
  Munipolis umo\u017e\u0148uje podn\u011bty t\u00fdkaj\u00edc\u00ed se \u00fadr\u017eby,
  \u010distoty apod. Na radnice jsme skrze tuto platformu p\u0159ijali a vy\u0159e\u0161ili
  p\u0159es 11 tis\u00edc r\u016fzn\u00fdch hl\u00e1\u0161en\u00ed.\\n\\nMunipolis
  umo\u017e\u0148uje jednodu\u0161e kontaktovat vybran\u00e9 skupiny obyvatel m\u011bstsk\u00e9
  \u010d\u00e1sti. Vedle SMS zpr\u00e1v umo\u017e\u0148uje rozsestal tak\u00e9 mailingy,
  pop\u0159. vytv\u00e1\u0159et ankety, dotazn\u00edky nebo participa\u010dn\u00ed
  projekty. Nav\u00edc si m\u016f\u017eete sami zvolit, jak\u00e9 informace v\u00e1s
  zaj\u00edmaj\u00ed. Ty v\u00e1m pak budou chodit prost\u0159ednictv\u00edm pravideln\u00e9ho
  newsletteru. Budete m\u00edt p\u0159ehled o tom, co se deje ve va\u0161\u00ed \u010dtvrti,
  ve va\u0161em sousedstv\u00ed. Jak se do projektu registrovat? P\u0159es web: https://www.munipolis.cz/registrace
  nebo sta\u017een\u00edm aplikace pro telefony se syst\u00e9mem Android a iOS\\n\\nV
  ulici Magnitogorsk\u00e1 m\u00e1 vyr\u016fst bytov\u00fd d\u016fm. Co s v\u00fdstavbou
  m\u011bstsk\u00e9 \u010d\u00e1st d\u011bl\u00e1 a jak je mo\u017en\u00e9, \u017ee
  se v lokalit\u011b stav\u00ed?\\nKancel\u00e1\u0159 hlavn\u00edho architekta \u00daM\u010c
  Praha 10 se k z\u00e1m\u011bru investora, kter\u00fd byl p\u0159edstaven v roce
  2022 formou architektonick\u00e9 studie, vyj\u00e1d\u0159ila nesouhlasn\u011b. Prezentovan\u00e1
  podoba nedotv\u00e1\u0159\u00ed urbanistickou strukturu, nadm\u00edrn\u011b vyt\u011b\u017euje
  \u00fazem\u00ed a zejm\u00e9na nerespektuje strategick\u00fd dokument m\u011bstsk\u00e9
  \u010d\u00e1sti, a to Generel ve\u0159ejn\u00fdch prostranstv\u00ed Prahy 10. Pokud
  chce investor pozemek vyu\u017e\u00edt, m\u011bl by v maxim\u00e1ln\u011b mo\u017en\u00e9
  m\u00ed\u0159e respektovat okoln\u00ed z\u00e1stavbu, urbanistick\u00e9 uspo\u0159\u00e1d\u00e1n\u00ed
  lokality i funk\u010dn\u00ed vyu\u017eit\u00ed \u00fazem\u00ed. V tomto duchu se
  nesou pripom\u00ednky Kancel\u00e1\u0159e hlavn\u00edho architekta, tedy samospr\u00e1vy
  m\u011bstsk\u00e9 \u010d\u00e1sti. Ta jako takov\u00e1 nerozhoduje o tom, zda d\u016fm
  bude st\u00e1t, nebo ne. O tom rozhoduje st\u00e1tn\u00ed spr\u00e1va, tedy stavebn\u00ed
  \u00fa\u0159ad. Ten se \u0159\u00edd\u00ed pra\u017esk\u00fdmi stavebn\u00edmi p\u0159edpisy
  a stavebn\u00edm z\u00e1konem, radnice m\u016f\u017ee z\u00e1m\u011br investora
  pouze p\u0159ipom\u00ednkovat.\\n\\nPozemek prodalo developerovi Ministerstvo obrany
  \u010cesk\u00e9 republiky, kter\u00e9 jej m\u011blo ve vlastnictv\u00ed ji\u017e
  p\u0159ed rokem 1989. \u00dazemn\u00ed pl\u00e1n hlavn\u00edho m\u011bsta Prahy
  charakterizuje p\u0159edm\u011btn\u00fd pozemek jako parcelu vyu\u017eitelnou pro
  v\u00fdstavbu obytn\u00e9 z\u00e1stavby bez koeficientu m\u00edry vyu\u017eit\u00ed
  plochy. \u00dazemn\u00ed pl\u00e1n tud\u00ed\u017e p\u0159edpokl\u00e1d\u00e1, \u017ee
  p\u0159\u00edpadn\u00e1 nov\u00e1 z\u00e1stavba bude sv\u00fdm objemem a charakterem
  odpov\u00eddaj\u00edc\u00ed z\u00e1stavb\u011b okoln\u00ed. Jak\u00fd je aktu\u00e1ln\u00ed
  stav? Stavebn\u00ed \u00fa\u0159ad zat\u00edm nezah\u00e1jil \u00fazemn\u00ed/stavebn\u00ed
  \u0159\u00edzen\u00ed pro ne\u00faplnost projektov\u00e9 dokumentace.\\n\\nREVITALIZACE
  PARKU NA SOLIDARIT\u011a ZVOLENA KOMUN\u00c1LN\u00cdM PROJEKTEM ROKU 2023\\n\\nRadnice
  Praha 10 zaznamenala velk\u00fd \u00fasp\u011bch, kdy\u017e letos dokon\u010den\u00e1
  revitalizace parku Na Solidarit\u011b ve Stra\u0161nic\u00edch byla zvolena Komun\u00e1ln\u00edm
  projektem roku 2023 v kategorii V\u011brn\u00e1 zelen\u011b. Porota tradi\u010dn\u00ed
  celorepublikov\u00e9 sout\u011b\u017ee \u010dasopisu Modern\u00ed obec, kterou za\u0161t\u00edtiluje
  Ministerstvo pro m\u00edstn\u00ed rozvoj, ocenila na\u0161i des\u00edtkovou p\u00e9\u010di
  o ko\u0159eny st\u00e1vaj\u00edc\u00edch strom\u016f p\u0159i obnov\u011b t\u00e9to
  parkov\u00e9 plochy.\\n\\n\u00daprava tohoto zelen\u00e9ho prostranstv\u00ed byla
  ojedin\u011bl\u00e1 rozsahem p\u00e9\u010de o ko\u0159enov\u00e9 syst\u00e9my vzrostl\u00fdch
  strom\u016f. B\u011bhem prac\u00ed se postupovalo tak, aby nedo\u0161lo k jejich
  po\u0161kozen\u00ed p\u0159i zakl\u00e1d\u00e1n\u00ed nov\u00fdch cest a byla zaji\u0161t\u011bna
  jejich budouc\u00ed prosperita. Vzrostl\u00e9 stromy jsou nenahraditeln\u00e9 a
  na Praze 10 je jim v\u011bnov\u00e1na n\u00e1le\u017eit\u00e1 pozornost.\\n\\nKostky
  m\u00edsto asfaltu\\n\\n\\\"B\u011bhem revitalizace parku jsme t\u011bsn\u011b pod
  povrchem objevili velk\u00e9 svazky ko\u0159en\u016f, daleko mohutn\u011bj\u0161\u00ed,
  ne\u017e jsme o\u010dek\u00e1vali. To komplikovalo dal\u0161\u00ed postup, tud\u00ed\u017e
  jsme museli vymyslet \u0159e\u0161en\u00ed. Varianta pok\u00e1cet ty stromy pro
  n\u00e1s nep\u0159ipadala v \u00favahu. Zvolili jsme \u0159e\u0161en\u00ed vyu\u017e\u00edvaj\u00edc\u00ed
  technologi\u00ed, kter\u00e1 se u n\u00e1s sice tolik nepou\u017e\u00edv\u00e1,
  ale funguje. Jmenuje se Air Spade. V kombinaci se sac\u00edm bagrem umo\u017enila
  ko\u0159enov\u00fd odhalit, ods\u00e1t zeminu a prov\u00e9st speci\u00e1ln\u00ed
  o\u0161et\u0159en\u00ed. Nakonec jsme zm\u011bnili povrch cest. P\u016fvodn\u011b
  pl\u00e1novan\u00fd asfalt nahradily \u017eulov\u00e9 kostky,\\\" dopl\u0148uje
  podrobnosti k p\u00e9\u010di o d\u0159eviny Martin Pec\u00e1nek, vedouc\u00ed Odboru
  \u017eivotn\u00edho prost\u0159ed\u00ed \u00daM\u010c Praha 10.\\n\\nP\u0159isp\u011bl
  i magistr\u00e1t\\n\\nCelkov\u00e9 n\u00e1klady na stavebn\u00ed pr\u00e1ce \u010dinily
  10,6 mil. K\u010d. Projekt byl zah\u00e1jen na sklonku minul\u00e9ho volebn\u00edho
  obdob\u00ed a je v\u00fdsledkem aktivn\u00ed finan\u010dn\u00ed spolupr\u00e1ce
  m\u011bstsk\u00e9 \u010d\u00e1sti s hl. m. Prahou. Magistr\u00e1t se na projektu
  pod\u00edlel \u010d\u00e1stkou 5 milion\u016f korun z dotac\u00ed na adapta\u010dn\u00ed
  opat\u0159en\u00ed ke zm\u00edr\u0148ov\u00e1n\u00ed klimatick\u00e9 zm\u011bny.\\n\\nRevitalizace
  bude pokra\u010dovat\\n\\nU\u017e nyn\u00ed Des\u00edtka pl\u00e1nuje zah\u00e1jit
  projektov\u00e9 pr\u00e1ce na revitalizaci druh\u00e9, ji\u017en\u00ed \u010d\u00e1sti
  parku i p\u0159\u00edpravy projektu adaptace na klimatickou zm\u011bnu u dal\u0161\u00edch
  zelen\u00fdch prostranstv\u00ed, o kter\u00fdch budeme pr\u016fb\u011b\u017en\u011b
  informovat a p\u0159iv\u00e9me k nim m\u00edstn\u00ed obyvatele. V parku bylo vysazeno
  23 nov\u00fdch strom\u016f. Uprost\u0159ed prostoru se nach\u00e1z\u00ed piknikov\u00fd
  st\u016fl a nov\u00e9 cesty lemuj\u00ed nov\u00fd mobili\u00e1\u0159.\\n\\nDES\u00cdTKA
  I V ROCE 2023 NA VLN\u011a UDR\u017dITELNOSTI\\n\\nM\u010c Praha 10 pat\u0159\u00ed
  v r\u00e1mci mezin\u00e1rodn\u00ed hodnocen\u00ed metodou m\u00edstn\u00ed Agenda
  21 (MA21) mezi TOP 10 obc\u00ed \u010cesk\u00e9 republiky. \u00dasp\u011bch se skr\u00fdv\u00e1
  v dlouhodob\u00e9 koncep\u010dn\u00ed spolupr\u00e1ci veden\u00ed m\u011bstsk\u00e9
  \u010d\u00e1sti a zam\u011bstnanc\u016f \u00fa\u0159adu. A samoz\u0159ejm\u011b
  v pr\u016fb\u011b\u017en\u00e9m zapojov\u00e1n\u00ed obyvatel a m\u00edstn\u00edch
  organizac\u00ed a spolk\u016f. \u201eDeklarace k podpo\u0159e udr\u017eiteln\u00e9ho
  rozvoje prost\u0159ednictv\u00edm m\u00edstn\u00ed Agenda 21 a Programu Zdrav\u00e9
  m\u011bsto\u201c byla schv\u00e1lena v nov\u00e9m volebn\u00edm obdob\u00ed Zastupitelstvem
  M\u010c v lednu 2023. V z\u00e1\u0159\u00ed 2023 Zastupitelstvo souhlasilo s p\u0159ihl\u00e1\u0161en\u00edm
  M\u010c Praha 10 jako\u017eto z\u00e1jemce o vstup do nejvy\u0161\u0161\u00ed kategorie
  A metody MA21 v roce 2024. Jak\u00e9 dal\u0161\u00ed novinky a \u00fasp\u011bchy
  p\u0159inesl rok 2023?\\n\\nDes\u00edtka se v leto\u0161n\u00edm roce poprv\u00e9
  p\u0159ipojila k iniciativ\u011b Evropsk\u00fd t\u00fdden udr\u017eiteln\u00e9ho
  rozvoje (ETUR), propaguj\u00edc\u00ed my\u0161lenku dlouhodob\u00e9ho udr\u017eiteln\u00e9ho
  rozvoje. Nav\u00e1zali jsme na dobrou tradici na\u0161ich dal\u0161\u00edch \u00fasp\u011b\u0161n\u00fdch
  kampan\u00ed jako Stromy za narozen\u00e9 d\u011bti nebo Des\u00edtka bez odpadu
  a jako obec se p\u0159ipojili k t\u00e9to celoevropsk\u00e9 kampani. V r\u00e1mci
  ETUR prob\u011bhly mimo jin\u00e9 tyto aktivity: v Kin\u011b Pilot\u016f byly prom\u00edt\u00e1ny
  Ozv\u011bny Ekofilmu ve spolupr\u00e1ci s M\u017dP \u010cR. Des\u00edtka se op\u011bt
  i v tomto volebn\u00edm obdob\u00ed p\u0159ihl\u00e1sila k deklaraci #dostbyloplastu,
  o \u010dem\u017e budeme je\u0161t\u011b podrobn\u011bji informovat po \u00fapln\u00e9m
  p\u0159est\u011bhov\u00e1n\u00ed \u00fa\u0159adu M\u010c. Ve spolupr\u00e1ci s Domem
  \u010dten\u00ed prob\u011bhla vych\u00e1zka po zeleni a knihobudk\u00e1ch. S Klubem
  K2 jsme nab\u00eddli p\u0159edn\u00e1\u0161ku k udr\u017eiteln\u00e9mu rodi\u010dovstv\u00ed.
  T\u011b\u0161\u00edme se na dal\u0161\u00ed ro\u010dn\u00edk. Ke spolupr\u00e1ci
  r\u00e1di p\u0159iv\u00edtame ka\u017ed\u00e9ho, kdo bude m\u00edt chu\u0165 se
  zapojit!\\n\\nOcen\u011bn\u00ed mezi \u0160ampiony udr\u017eiteln\u00e9ho rozvoje
  v \u010cR 2023\\n\\nV pond\u011bl\u00ed 13. listopadu byla ve slavnostn\u00edm s\u00e1le
  Parlamentu \u010cesk\u00e9 republiky p\u0159ed\u00e1na ocen\u011bn\u00ed pro \u201e\u0160ampiony\u201c
  Zdrav\u00fdch m\u011bst, obc\u00ed a region\u016f za rok 2023. Jedn\u00e1 se o hodnocen\u00ed
  m\u011bst, m\u011bstsk\u00fdch \u010d\u00e1st\u00ed, obc\u00ed \u010di kraj\u016f,
  kter\u00e9 aktivn\u011b zapojuj\u00ed ve\u0159ejnost, strategicky pl\u00e1nuj\u00ed
  a sm\u011b\u0159uj\u00ed k udr\u017eiteln\u00e9mu rozvoji a zdrav\u00ed. Op\u011bt
  po roce toto ocen\u011bn\u00ed obh\u00e1jila i na\u0161e m\u011bstsk\u00e1 \u010d\u00e1st.
  Z\u00e1stupci obc\u00ed a kraj\u016f p\u0159evzali ocen\u011bn\u00ed z rukou V\u011bry
  Kov\u00e1\u0159ov\u00e9, 1. m\u00edstop\u0159edsedkyn\u011b Poslaneck\u00e9 sn\u011bmovny
  Parlamentu \u010cR. \u201eOpakovan\u011b z\u00edskan\u00e9 ocen\u011bn\u00ed dokl\u00e1d\u00e1,
  \u017ee jsme lidov\u011b \u0159e\u010deno \u201eneusnuli na vav\u0159\u00ednech\u201c
  a tak\u00e9 v nov\u00e9m volebn\u00edm obdob\u00ed podporujeme udr\u017eitelnost
  a strategick\u00fd rozvoj. V zapojov\u00e1n\u00ed obyvatel se letos v\u00edce soust\u0159ed\u00edme
  na mladou generaci. Je vid\u011bt, \u017ee i mlad\u00fdm lidem na m\u00edst\u011b
  jejich \u017eivot\u016f hodn\u011b z\u00e1le\u017e\u00ed a jsou ochotn\u00ed se
  dobrovoln\u011b v jeho prosp\u011bch anga\u017eovat,\\\" \u0159\u00edk\u00e1 Milan
  Mar\u0161\u00e1lek, ges\u010dn\u00ed radn\u00ed pro \u017eivotn\u00ed prost\u0159ed\u00ed
  a udr\u017eitelnost a m\u00edstn\u00ed Agendu 21.\\n\\nF\u00f3rum mlad\u00fdch a
  spolupr\u00e1ce se Sn\u011bmem \u017e\u00e1k\u016f\\n\\nV polovin\u011b prosince
  prob\u011bhne F\u00f3rum mlad\u00fdch, kter\u00e9 m\u011bstsk\u00e1 \u010d\u00e1st
  organizuje ve spolupr\u00e1ci se Sn\u011bmem \u017e\u00e1k\u016f. Ten sdru\u017euje
  aktivn\u00ed d\u011bti a ml\u00e1de\u017e ze \u0161koln\u00edch parlament\u016f.
  Akce je ur\u010dena pro \u017e\u00e1ky druh\u00fdch stup\u0148\u016f z\u00e1kladn\u00edch
  \u0161kol a st\u0159edo\u0161kol\u00e1ky, kte\u0159\u00ed budou na jimi zvolen\u00e1
  t\u00e9ma diskutovat s odpov\u011bdn\u00fdmi z\u00e1stupci radnice. Vedle participativn\u00edho
  rozpo\u010dtu \u201eMoje stopa ve \u0161kole\\\" tak p\u0159id\u00e1v\u00e1me druh\u00fd
  pil\u00ed\u0159 participace nastupuj\u00edc\u00ed generace.\\n\\nSENIO\u0158I NA
  PRAZE 10 JSOU PRIORITA\\n\\nPraha 10 je velk\u00e1 m\u011bstsk\u00e1 \u010d\u00e1st,
  kter\u00e1 po\u010dtem obyvatel m\u016f\u017ee konkurovat t\u0159eba cel\u00e9mu
  Liberci. \u017dije zde p\u0159es 110 000 obyvatel, z toho kolem 25 000 seni\u00f6r\u016f.
  V z\u00e1\u0159\u00ed rad\u00e1 schv\u00e1lila r\u00e1mcov\u00fd dokument Koncepce
  rodinn\u00e9 politiky, kter\u00fd mysl\u00ed tak\u00e9 na seniory v Praze 10. Je
  p\u0159ipraven pl\u00e1n, jak v ka\u017ed\u00e9 \u010dtvrti m\u011bstsk\u00e9 \u010d\u00e1sti
  Praha 10 \u0159\u00e1dn\u011b zmapovat poskytovan\u00e9 slu\u017eby, pochopit pot\u0159eby
  seniory, jak sjednotit informace a jak vytvo\u0159it co nejlep\u0161\u00ed podm\u00ednky
  pro kvalitn\u00ed vz\u00e1jemn\u00e9 sou\u017eit\u00ed. V \u0159\u00edjnu uspo\u0159\u00e1dal
  David Ka\u0161par, m\u00edstostarosta s kompetenc\u00ed soci\u00e1ln\u00ed a rodinn\u00e9
  politiky a zdravotnictv\u00ed, setk\u00e1n\u00ed z\u00e1stupc\u016f m\u011bstsk\u00e9
  \u010d\u00e1sti a p\u0159\u00edsp\u011bvkov\u00fdch organizac\u00ed, aby napl\u00e1novali,
  jak je\u0161t\u011b l\u00e9pe v\u0161echny propojit a jak\u00e9 akce pro seniory
  m\u016f\u017ee veden\u00ed p\u0159\u00ed\u0161t\u00ed rok uspo\u0159\u00e1dat.\\n\\nDlouhodob\u00e9
  c\u00edle:\\n\u2022 Podporovat sousedsk\u00e9 a komunitn\u00ed aktivity otev\u00edr\u00e1n\u00edm
  \u0161kol, knihoven, seniorsk\u00fdch center a rodinn\u00fdch center setk\u00e1v\u00e1n\u00ed.\\n\u2022
  Podporovat skupiny senior\u016f, kter\u00e9 se samy organizuj\u00ed a anga\u017euj\u00ed
  ve prosp\u011bch jin\u00fdch senior\u016f nebo posiluj\u00ed mezigenera\u010dn\u00ed
  vazby.\\n\u2022 Nad\u00e1le podporovat \u0161irokou paletu aktivit, kter\u00e9 pro
  n\u011b p\u0159ipravuje Praha 10 a spolupracuj\u00edc\u00ed organizace.\\n\\nA jak\u00e9
  slu\u017eby pro seniory m\u016f\u017eete aktu\u00e1ln\u011b vyu\u017e\u00edvat?\\n\u2022
  Des\u00edtkov\u00e1 p\u0159\u00edsp\u011bvkov\u00e1 organizace Centrum soci\u00e1ln\u00ed
  a o\u0161et\u0159ovatelsk\u00e9 pomoci poskytuje slu\u017eby zam\u011b\u0159en\u00e9
  zejm\u00e9na na pomoc seniory a jejich rodin\u00e1m: pe\u010dovatelskou slu\u017ebu,
  dom\u00e1c\u00ed zdravotn\u00ed p\u00e9\u010di, odleh\u010dovac\u00ed slu\u017eby
  nebo kluby pro seniory. Spravuje domovy pro seniory a tak\u00e9 140 byt\u016f ur\u010den\u00fdch
  pro bydlen\u00ed senior\u016f a osob se zdravotn\u00edm posti\u017een\u00edm (web:
  csop10.cz/, tel.: 271 746 720).\\n\u2022 Prost\u0159ednictv\u00edm Odboru soci\u00e1ln\u00edho
  poskytujeme soci\u00e1ln\u00ed slu\u017eby pro osam\u011bl\u00e9 \u010di nemocn\u00e9
  seniory, odkazujeme na n\u00e1vazn\u00e9 slu\u017eby a hled\u00e1me vhodn\u00e9
  podp\u016frn\u00e9 organizace (Soci\u00e1ln\u00ed poradensk\u00e9 centrum, e-mail:
  firstname.lastname@example.org).\\n\u2022 M\u011bstsk\u00e1 \u010d\u00e1st Praha
  10 organizuje sportovn\u00ed, volno\u010dasov\u00e9 a kulturn\u00ed akce pro seniory.
  V oblasti sportu se jedn\u00e1 zejm\u00e9na o pravideln\u00e9 kurzy j\u00f3gy, nordic
  walking, rehabilita\u010dn\u00ed plav\u00e1n\u00ed a cvi\u010den\u00ed pro seniory
  (web: praha10.cz/sportujemesdesitkou, e-mail: email@example.com).\\n\u2022 Po\u0159\u00e1d\u00e1me
  kulturn\u00ed akce: cykly komorn\u00edch koncert\u016f ve Vr\u0161ovic\u00edch z\u00e1m\u010dku
  \u010di jin\u00e9m r\u016fm\u016fm.\\n\\nM\u00e1me bohat\u00fd dota\u010dn\u00ed
  program. Celkem se v dota\u010dn\u00edm \u0159\u00edzen\u00ed rozd\u011bl\u00ed
  p\u0159es 33 milion\u016f korun a velk\u00e1 \u010d\u00e1st projekt\u016f se zam\u011b\u0159uje
  na slu\u017eby pro seniory (web: praha10.cz/dotace).\\n\\nOrganizujeme kurzy tr\u00e9nov\u00e1n\u00ed
  pam\u011bti, po\u010d\u00edta\u010dov\u00e9 kurzy \u010di kurzy zach\u00e1zen\u00ed
  s chytr\u00fdmi telefony.\\n\\nKLUBY PRO SENIORY CSOP:\\n\\nKluby pro seniory CSOP
  po\u0159\u00e1daj\u00ed jednodenn\u00ed v\u00fdlety, pra\u017eiminov\u00e9 z\u00e1jezdy,
  p\u0159edn\u00e1\u0161ky, hudebn\u011b odpoledne a dal\u0161\u00ed aktivity.\\n\\n\u2022
  Klub \u0160\u00e1mov\u00e1 7, Vr\u0161ovice, vedouc\u00ed Jana Tampierlov\u00e1
  (tel.: 739 643 954)\\n\u2022 Klub Zvonkov\u00e1 6, Z\u00e1b\u011bhlice, vedouc\u00ed
  Stanislava Jadni\u010dkov\u00e1 (tel.: 601 132 969)\\n\u2022 Klub Karpatsk\u00e1
  19, Vr\u0161ovice, vedouc\u00ed Jaroslava Tich\u00e1 (tel.: 773 747 021)\\n\u2022
  Klub Po\u010dernick\u00e1 64, Male\u0161ice, vedouc\u00ed Ivanka Kos\u0148ansk\u00e1
  (tel.: 778 521 896)\\n\u2022 Klub Na Lou\u017ei 19, Vr\u0161ovice, vedouc\u00ed
  Marta K\u0159esinov\u00e1 (tel.: 773 453 445)\\n\\nVedouc\u00ed Klub\u016f senior\u016f,
  rekreace a z\u00e1jezdy: Eva Greplova, pevn\u00e1 linka: 277 011 710, mobiln\u00ed
  telefon: 739 643 970, e-mail: firstname.lastname@example.org\\n\\nZIMN\u00cd HUMANIT\u00c1RN\u00cd
  OPAT\u0158EN\u00cd V PRAZE\\n\\nI pro leto\u0161n\u00ed zimu p\u0159ipravuje hlavn\u00ed
  m\u011bsto Praha humanit\u00e1rn\u00ed opat\u0159en\u00ed na pomoc lidem bez p\u0159\u00edst\u0159e\u0161\u00ed.
  Podrobnosti k p\u0159ipraven\u00fdm opat\u0159en\u00edm, kter\u00e1 obvykle trvaj\u00ed
  od za\u010d\u00e1tku prosince do konce b\u0159ezna n\u00e1sleduj\u00edc\u00edho
  roku, budou k dispozici u koordin\u00e1tora pomoci, kter\u00fdm je Centrum soci\u00e1ln\u00edch
  slu\u017eeb Praha, p\u0159\u00edsp\u011bvkov\u00e1 organizace hl. m. Prahy (d\u00e1le
  CSSP). Do pomoci se zapojuj\u00ed organizace poskytuj\u00edc\u00ed soci\u00e1ln\u00ed
  slu\u017eby, na opat\u0159en\u00edch d\u00e1le spolupracuje M\u011bstsk\u00e1 policie
  hl. m. Prahy, Zdravotnick\u00e1 z\u00e1chrann\u00e1 slu\u017eba hl. m. Prahy a soci\u00e1ln\u00ed
  kur\u00e1tor\u016f jednotliv\u00fdch m\u011bstsk\u00fdch \u010d\u00e1st\u00ed.\\n\\nDenn\u00ed
  centra i l\u00e9ka\u0159sk\u00e1 pomoc\\nSmyslem zimn\u00edch opat\u0159en\u00ed
  je zajistit bezpe\u010d\u00ed osob bez p\u0159\u00edst\u0159e\u0161\u00ed v mraziv\u00fdch
  dnech. Opat\u0159en\u00ed spo\u010d\u00edvaj\u00ed zejm\u00e9na v nav\u00fd\u0161en\u00ed
  kapacit l\u016f\u017eek v nocleh\u00e1rn\u00e1ch, v mo\u017enosti p\u0159esp\u00e1t
  v mraziv\u00fdch dnech v nocleh\u00e1rn\u011b zdarma \u010di vyuz\u00edt v pr\u016fb\u011bhu
  dne prostory denn\u00edch center k zah\u0159\u00e1t\u00ed a k zaji\u0161t\u011bn\u00ed
  j\u00eddla. V denn\u00edch centrech jsou nab\u00edzeny rovn\u011b\u017e poradensk\u00e9
  slu\u017eby nebo l\u00e9ka\u0159sk\u00e1 pomoc. Pr\u00e1mo na ulic\u00edch b\u011bhem
  dne i v pr\u016fb\u011bhu noci p\u016fsob\u00ed ter\u00e9nn\u00ed slu\u017eby. P\u0159edpokl\u00e1d\u00e1
  se, \u017ee stejn\u011b jako v lo\u0148sk\u00e9m roce budou i letos zahrnovat zimn\u00ed
  opat\u0159en\u00ed tak\u00e9 zaji\u0161t\u011bn\u00ed kapacit pro osoby se zdravotn\u00edm
  hendikepem.\\n\\nNa koho se obr\u00e1tit?\\nDal\u0161\u00ed informace m\u016f\u017eete
  naj\u00edt na webov\u00e9m port\u00e1lu CSSP k problematice bezdomovectv\u00ed:
  www.bezdomova.eu, a to v\u010detn\u011b n\u00e1vod\u016f pro ve\u0159ejnost, jak\u00fdm
  zp\u016fsobem postupovat v p\u0159\u00edpad\u011b, \u017ee potk\u00e1te na ulici
  \u010dlov\u011bka, kter\u00fd pot\u0159ebuje pomoc. Na tomto m\u00edst\u011b uv\u00e1d\u00edme
  z\u00e1kladn\u00ed telefonick\u00e9 kontakty \u2013 zdravotnick\u00e1 z\u00e1chrann\u00e1
  slu\u017eba: 155, m\u011bstsk\u00e1 policie: 156.\\n\\nU\u0160ET\u0158ETE \u010cAS
  A ENERGIJ S FLEXIBILN\u00cdMI SLU\u017dBAMI \u010cESK\u00c9 PO\u0160TY\\n\\nNebav\u00ed
  v\u00e1s \u010dekat ve front\u011b? Jste st\u00e1le ve skluze a ka\u017ed\u00e1
  minutka pro v\u00e1s hraje roli? Zm\u011bnily se okolnosti \u010di m\u00edsto va\u0161eho
  pobytu a pot\u0159ebujete upravit po\u0161tovn\u00ed slu\u017eby na m\u00edru? Nejv\u00fdhodn\u011bj\u0161\u00ed.
  Vyzkou\u0161ejte praktick\u00e9 slu\u017eby \u010cesk\u00e9 po\u0161ty, kter\u00e9
  v\u00e1m usnadn\u00ed \u017eivot. Objednejte se na pobo\u010dku p\u0159es internet,
  zm\u011b\u0148te doru\u010den\u00ed z\u00e1silky online nebo si nechte ukl\u00e1dat
  z\u00e1silky na v\u00fdhodn\u011bj\u0161\u00ed po\u0161t\u011b.\\n\\n\u010cesk\u00e1
  po\u0161ta nab\u00edz\u00ed sv\u00fdm z\u00e1kazn\u00edk\u016fm vedle tradi\u010dn\u00edch
  po\u0161tovn\u00edch slu\u017eeb i celou \u0159adu inovativn\u00edch \u0159e\u0161en\u00ed,
  kter\u00e1 v\u00e1m usnadn\u00ed \u017eivot a u\u0161et\u0159\u00ed va\u0161 \u010das.\\n\\nSlu\u017eba
  objedn\u00e1n\u00ed na pobo\u010dku\\nTato slu\u017eba je zdarma a umo\u017e\u0148uje
  v\u00e1m dop\u0159edu si online rezervovat term\u00edn pro nej\u010dast\u011bj\u0161\u00ed
  slu\u017eby, jako je Czech POINT, vyzvednut\u00ed dopis\u016f, posl\u00e1n\u00ed
  dopis\u016f i bal\u00edk\u016f, po\u0161tovn\u00ed pouk\u00e1zky, platba SIPO, v\u00fdplata
  d\u016fchod\u016f nebo specializovan\u00e9 bankovn\u00ed p\u0159ep\u00e1\u017eky.
  Sta\u010d\u00ed si vybrat pobo\u010dku a slu\u017ebu, zvolit term\u00edn n\u00e1v\u0161t\u011bvy
  a objednat se. P\u0159i p\u0159\u00edchodu na po\u0161tu zad\u00e1te rezerva\u010dn\u00ed
  k\u00f3d do vyvol\u00e1vac\u00edho syst\u00e9mu a p\u016fjdete hned na \u0159adu.
  Pro objedn\u00e1n\u00ed slu\u017eby m\u016f\u017eete pou\u017e\u00edt i na\u0161i
  mobiln\u00ed aplikaci Po\u0161taOnline. Slu\u017eba je dostupn\u00e1 na po\u0161t\u00e1ch
  s vyvol\u00e1vac\u00edm syst\u00e9mem. Bli\u017e\u0161\u00ed informace naleznete
  na na\u0161ich webov\u00fdch str\u00e1nk\u00e1ch https://www.ceskaposta.cz/sluzby/ostatni-sluzby/objednavka-na-pobocku.\\n\\nSlu\u017eba
  zm\u011bna doru\u010den\u00ed online\\nS touto slu\u017ebou m\u016f\u017eete online
  m\u011bnit parametry doru\u010dov\u00e1n\u00ed bal\u00edku nebo dopisu p\u0159es
  internet. M\u016f\u017eete si nap\u0159\u00edklad prodlou\u017eit ulo\u017en\u00ed
  dobu pro vyzvednut\u00ed, nechat z\u00e1silku znovu doru\u010dit, doru\u010dit na
  jinou adresu, ulo\u017eit na jinou po\u0161tu nebo zm\u011bnit term\u00edn doru\u010den\u00ed.
  V\u011bt\u0161ina voliteln\u00fdch dispozic je poskytov\u00e1na zdarma. Informace
  ke slu\u017eb\u011b a vstup do aplikace najdete tak\u00e9 na webov\u00fdch str\u00e1nk\u00e1ch
  https://www.ceskaposta.cz/sluzby/ostatni-sluzby/zmena-dispozice.\\n\\nSlu\u017eba
  zm\u011bna ukl\u00e1dac\u00ed po\u0161ty\\nSlu\u017e\u00ed pro v\u0161echny do\u0161l\u00e9
  z\u00e1silky a umo\u017e\u0148uje v\u00e1m po\u017eadat o ukl\u00e1d\u00e1n\u00ed
  doru\u010dovan\u00fdch z\u00e1silek na jin\u00e9 po\u0161t\u011b, kter\u00e1 je
  pro v\u00e1s v\u00fdhodn\u011bj\u0161\u00ed a dostupn\u011bj\u0161\u00ed. Nap\u0159\u00edklad
  po\u0161ta v m\u00edst\u011b v\u00fdkonu pr\u00e1ce apod. Informace ke slu\u017eb\u011b
  najdete na webov\u00fdch str\u00e1nk\u00e1ch https://www.ceskaposta.cz/sluzby/ostatni-sluzby/zmena-ukladaci-posty-pro-vsechny-dosle-zasilky.\\n\\nKrom\u011b
  v\u00fd\u0161e zm\u00edn\u011bn\u00fdch slu\u017eeb nab\u00edz\u00ed \u010cesk\u00e1
  po\u0161ta tak\u00e9 r\u016fzn\u00e9 zp\u016fsoby v\u00fdplaty d\u016fchod\u016f.
  Odsnosy d\u016fchod je ulo\u017een na v\u00fdplat\u011b na po\u0161t\u011b a p\u0159\u00edjemce
  si ho vyzvedv\u00e1 bez vyzv\u00e1n\u00ed ze strany \u010cP. Doru\u010dn\u00fd d\u016fchod
  je doru\u010dov\u00e1n doru\u010dovatelem na adresu p\u0159\u00edjemce, a pokud
  nen\u00ed zast\u00edzen, je ulo\u017een na p\u0159\u00edslu\u0161n\u00e9 ukl\u00e1dac\u00ed
  po\u0161t\u011b. D\u016fchod lze tak\u00e9 nechat zas\u00edlat na osobn\u00ed \u00fa\u010det
  u \u010cSOB, kter\u00fd je mo\u017eno z\u0159\u00eddit na kter\u00e9koli po\u0161t\u011b.\\n\\nPro
  zm\u011bnu zp\u016fsobu v\u00fdplaty d\u016fchodu sta\u010d\u00ed podat \u017e\u00e1dost
  minim\u00e1ln\u011b 10 pracovn\u00edch dn\u016f p\u0159ed splatnost\u00ed d\u016fchodu
  na kter\u00e9koli po\u0161t\u011b, vyplnit tiskopis \u010d. 12-236 D\u016fchodov\u00e1
  slu\u017eba \u2013 \u017e\u00e1dost o zm\u011bnu a p\u0159edlo\u017eit sv\u016fj
  osobn\u00ed doklad a pokud mo\u017eno i \u00fast\u0159\u00edzek v\u00fdplatn\u00edho
  dokladu pro p\u0159\u00edjemce d\u016fchodu. Pro v\u00edce informac\u00ed nav\u0161tivte
  n\u00e1\u0161 web https://www.ceskaposta.cz/sluzby/platebni-a-financni-sluzby-cr/duchodova-sluzba.\\n\\nINFORMACE
  Z DES\u00cdTKY\\n\\nSEN\u00c1TOR JAN PIRK M\u00c1 KANCEL\u00c1\u0158 V PRAZE 10\\n\\nP\u0159edn\u00ed
  tuzemsk\u00fd kardiochirurg, profesor a od lo\u0148sk\u00e9ho roku tak\u00e9 sen\u00e1tor
  Jan Pirk \u00fa\u0159aduje ve Vladivostock\u00e9 12, kousek od fotbalov\u00e9ho
  stadionu v Edenu. V\u00fdb\u011br lokality nebyl n\u00e1hodn\u00fd, Jan Pirk je
  du\u0161\u00ed sportovec a celo\u017eivotn\u00ed fanou\u0161ek Slavie, za kterou
  n\u011bkolik des\u00edtek let hr\u00e1l pozemn\u00ed hokej. Nav\u00edc je kancel\u00e1\u0159
  dob\u0159e dostupn\u00e1 m\u011bstskou hromadnou dopravou.\\n\\nJeho kancel\u00e1\u0159
  je po p\u0159edchoz\u00ed telefonick\u00e9 nebo e-mailov\u00e9 domluv\u011b s asistentkou
  dostupn\u00e1 ka\u017ed\u00e9mu, kdo m\u00e1 n\u011bjak\u00fd podn\u011bt nebo t\u00e9ma.
  \u201eM\u016fj \u017eivot je spjat\u00fd s Des\u00edtkou, s l\u00e9ka\u0159stv\u00edm
  a se sportem. Jsem p\u0159esv\u011bd\u010den\u00fd o tom, \u017ee \u010dlov\u011bk
  je skute\u010dn\u011b \u00fasp\u011b\u0161n\u00fd pouze, pokud d\u011bl\u00e1 v\u011bci,
  ke kter\u00fdm m\u00e1 vztah a kde m\u00e1 z\u00e1rove\u0148 n\u011bjakou znalost.
  Proto se v horn\u00ed komo\u0159e sna\u017e\u00edm zlep\u0161ovat pr\u00e1v\u011b
  \u010desk\u00e9 zdravotnictv\u00ed a na lok\u00e1ln\u00ed \u00farovni pom\u00e1h\u00e1m
  s propagac\u00ed sportu. M\u00e1m radost, \u017ee je v Praze 10 misto, kde se m\u016f\u017eu
  potkat s lidmi. Ve sv\u00e9 kancel\u00e1\u0159i se r\u00e1d uvid\u00edm s ka\u017ed\u00fdm,
  kdo bude m\u00edt pocit, \u017ee pro n\u011bj v sen\u00e1tu m\u016f\u017eu n\u011bco
  ud\u011blat,\u201c \u0159\u00edk\u00e1 sen\u00e1tor Jan Pirk.\\n\\nProf. MUDr. Jan
  Pirk, DrSc., z\u00edskal za svou pades\u00e1tiletou kari\u00e9ru \u0159adu ocen\u011bn\u00ed.
  V roce 2004 obdr\u017eel medaili T. G. Masaryka. O p\u011bt let pozd\u011bji z\u00edskal
  titul L\u00e9ka\u0159 roku 2009 v kategorii l\u00e9ka\u0159 nemocnic, l\u00e9\u010debn\u00fdch
  \u00fastav\u016f a l\u016f\u017ekov\u00fdch odd\u011blen\u00ed. T\u011bmi nejv\u011bt\u0161\u00edmi
  ocen\u011bn\u00edmi jsou zpr\u00e1vy pacient\u016f, kter\u00e9 \u00fasp\u011b\u0161n\u011b
  operoval. Jan Pirk se sv\u00fdm t\u00fdmem uskute\u010dnil 7000 operac\u00ed srdce,
  295 \u00fasp\u011b\u0161n\u00fdch transplantac\u00ed srdce a 4 transplantace bloku
  srdce a plic. Tato \u010d\u00edsla ho \u0159ad\u00ed k vysoko uzn\u00e1van\u00fdm
  kardiochirurg\u016fm v Evrop\u011b. Mimo to je aktivn\u00edm propag\u00e1torem zdrav\u00e9ho
  \u017eivotn\u00edho stylu a pohybu. S\u00e1m t\u0159in\u00e1ctkr\u00e1t b\u011b\u017eel
  maraton.\\n\\nPokud budete cht\u00edt kancel\u00e1\u0159 nav\u0161t\u00edvit, je
  po p\u0159edchoz\u00ed domluv\u011b otev\u0159ena ka\u017ed\u00e9 prvn\u00ed pond\u011bl\u00ed
  v m\u011bs\u00edci.\\n\\nAdresa kancel\u00e1\u0159e: Vladivostock\u00e1 1530/12\\nProvozn\u00ed
  doba: ka\u017ed\u00e9 prvn\u00ed pond\u011bl\u00ed v m\u011bs\u00edci po domluven\u00ed
  sch\u016fzky mezi 15. a 18. hodinou. Rezervace sch\u016fzky je mo\u017en\u00e1 prost\u0159ednictv\u00edm
  telefonu 777 260 044 nebo e-mailu email@example.com.\\n\\nSETK\u00c1N\u00cd PRO
  \u017dADATELE O DOTACI\\n\\n\u017dadatel\u00e9, kte\u0159\u00ed se chystaj\u00ed
  podat \u017e\u00e1dost v r\u00e1mci dota\u010dn\u00edho programu m\u011bstsk\u00e9
  \u010d\u00e1sti Praha 10 pro oblast podpory p\u00e9\u010de o pam\u00e1tkov\u011b
  hodnotn\u00e9 nemovit\u00e9 objekty na \u00fazem\u00ed m\u011bstsk\u00e9 \u010d\u00e1sti
  Praha 10 v roce 2024, mohou vyu\u017e\u00edt p\u0159\u00edle\u017eitost obezn\u00e1mit
  se bl\u00ed\u017ee se z\u00e1sadami programu, polo\u017eit sv\u00e9 ot\u00e1zky,
  p\u0159\u00edpadn\u011b probrat sv\u016fj vlastn\u00ed z\u00e1m\u011br obnovy. M\u011bstsk\u00e1
  \u010d\u00e1st Praha 10 pro n\u011b chyst\u00e1 na 13. 12. 2023 setk\u00e1n\u00ed
  v nov\u00e9 budov\u011b \u00fa\u0159adu na adrese Vinohradsk\u00e1 3218/169 v s\u00e1le
  Brat\u0159\u00ed \u010capk\u016f v p\u0159\u00edzem\u00ed, kter\u00e9 bude za\u010d\u00ednat
  v 17.00. Sv\u00e9 dotazy mohou p\u0159ipadn\u00fd \u017eadatel\u00e9 sm\u011brovat
  tak\u00e9 na odd\u011blen\u00ed pam\u00e1tkov\u00e9 p\u00e9\u010de, a to na n\u00ed\u017ee
  uveden\u00e9 kontakty.\\n\\nDota\u010dn\u00ed program nab\u00edz\u00ed \u0161irokou
  mo\u017enost uplatn\u011bn\u00ed a jeho d\u016fle\u017eit\u00fdm prvkem je pe\u010dliv\u00e9
  posouzen\u00ed ka\u017ed\u00e9 \u017e\u00e1dosti, kter\u00e1 se m\u016f\u017ee dot\u00fdkat
  rozmanit\u00fdch z\u00e1m\u011br\u016f obnovy v oblasti p\u00e9\u010de o historicky
  hodnotn\u00fd nemovit\u00fd fond. Dop\u0159edu nen\u00ed vylou\u010den nikdo, kdo
  se domn\u00edv\u00e1, \u017ee pr\u00e1v\u011b jeho \u00famysl by mohl k dosa\u017een\u00ed
  sledovan\u00e9ho c\u00edle p\u0159isp\u011bt. M\u011bstsk\u00e1 \u010d\u00e1st Praha
  10 vedle ohl\u00e1\u0161en\u00e9ho setk\u00e1n\u00ed nab\u00edz\u00ed tak\u00e9
  konzultace p\u0159\u00edmo na m\u00edst\u011b a p\u0159\u00edpadn\u011b t\u00e9\u017e
  poradenstv\u00ed ohledn\u011b dal\u0161\u00edch souvisej\u00edc\u00edch ot\u00e1zek.\\n\\nVyu\u017eijte
  p\u0159edlo\u017een\u00e9 mo\u017enosti a dostavte se do budovy \u00fa\u0159adu
  13. 12. 2023, nebo pou\u017eijte n\u011bkter\u00fd z kontakt\u016f na odd\u011blen\u00ed
  pam\u00e1tkov\u00e9 p\u00e9\u010de:\\n\\ntel.: +420 267 093 216\\nmobil: +420 720
  965 952\\ne-mail: firstname.lastname@example.org\\n\\nT\u011b\u0161\u00edme se na
  setk\u00e1n\u00ed s v\u00e1mi a na va\u0161e z\u00e1m\u011bry v oblasti p\u00e9\u010de
  o nemovit\u00e9 objekty, kter\u00e9 dokl\u00e1daj\u00ed v\u00fdvoj stavebn\u00ed
  kultury na \u00fazem\u00ed na\u0161\u00ed m\u011bstsk\u00e9 \u010d\u00e1sti.\\n\\nVLASTN\u00cdTE
  POZORUHODN\u00dd | V\u00ddZNAMN\u00dd | JEDINE\u010cN\u00dd OBJEKT?\\n\\nPODPOR\u00cdME
  V\u00c1S!\\n\\nDota\u010dn\u00ed program pro oblast podpory p\u00e9\u010de o pam\u00e1tkov\u011b
  hodnotn\u00e9 nemovit\u00e9 objekty 2024 byl vyhl\u00e1\u0161en dne 30. 10. 2023
  na obdob\u00ed do 31. 12. 2024.\\n\\npraha10.cz\\n\\nSYP\u00c1\u010cE JSOU P\u0158IPRAVENY
  NA ZIMN\u00cd \u00daDR\u017dBU KOMUNIKAC\u00cd\\n\\nTechnick\u00e1 spr\u00e1va komunikac\u00ed
  (TSK) si na boj s p\u0159\u00edpadnou sn\u011bhovou nad\u00edlkou p\u0159ipravila
  73 sypa\u010de vybaven\u00fdch sn\u011b\u017en\u00fdmi pluhy a 130 men\u0161\u00edch
  stroj\u016f ur\u010den\u00fdch na \u00faklid bo\u010dn\u00edch ulic nebo chodn\u00edk\u016f.
  Ty se budou starat o s\u00ed\u0165zdonost 2 211 kilometr\u016f silnic. Zimn\u00ed
  sezona tradi\u010dn\u011b kon\u010d\u00ed 31. b\u0159ezna.\\n\\nPra\u017esk\u00e9
  komunikace za\u0159azen\u00e9 do zimn\u00ed \u00fadr\u017eby jsou rozd\u011bleny
  do t\u0159\u00ed kategori\u00ed podle sv\u00e9ho v\u00fdznamu. Do I. kategorie,
  kde p\u0159\u00edpadnou zimn\u00ed nad\u00edlku budou odklizet velk\u00e9 silni\u010dn\u00ed
  sypa\u010de s pluhy, p\u0159irozen\u011b spadaj\u00ed nap\u0159\u00edklad nejd\u016fle\u017eit\u011bj\u0161\u00ed
  pra\u017esk\u00e9 dopravn\u00ed tepny, silnice I. a II. t\u0159\u00eddy, komunikace
  vyu\u017e\u00edvan\u00e9 p\u011bt\u00e9rnick\u00fdmi linkami voz\u016f MHD nebo
  silnice vedouc\u00ed k nemocnic\u00edm. Celkem jde o 1 397 kilometr\u016f komunikac\u00ed.
  Ty mus\u00ed b\u00fdt uklizen\u00e9 do dvou hodin od momentu, kdy technika vyjede
  z gar\u00e1\u017ee.\\n\\n\u0158idi\u010di sn\u011b\u017en\u00fdch pluh\u016f se
  dr\u017e\u00ed p\u0159edem stanoven\u00fdch tras, napl\u00e1novan\u00fdch TSK. Ka\u017ed\u00e1
  z nich je dlouh\u00e1 maxim\u00e1ln\u011b 50 kilometr\u016f. Sypa\u010de maj\u00ed
  na korb\u011b cca 5 tun soli a 2 tuny soln\u00e9ho roztoku nebo li\u0161anky, co\u017e
  na tuto vzd\u00e1lenost vysta\u010d\u00ed.\\n\\nDo II. kategorie spadaj\u00ed zb\u00fdvaj\u00edc\u00ed
  \u00faseky silnic II. t\u0159\u00eddy, m\u00edstn\u00ed komunikace a sb\u011brn\u00e9
  komunikace. Zbyl\u00e9 komunikace pat\u0159\u00ed do III. kategorie. S t\u00edm
  se prodlu\u017euje doba \u00fadr\u017eby na 24, respektive 48 hodin. O ty se star\u00e1
  50 men\u0161\u00edch stroj\u016f.\\n\\nTSK m\u00e1 rovn\u011b\u017e na starost \u00faklid
  chodn\u00edk\u016f, zast\u00e1vek MHD a dal\u0161\u00edch m\u00edst d\u016fle\u017eit\u00fdch
  prochody metropole, jako jsou p\u0159\u00edstupov\u00e9 cesty k centr\u00e1ln\u00edm
  \u00fa\u0159ad\u016fm, kulturn\u00edm instituc\u00edm nebo stanic\u00edm metra.
  Celkem jde o 1 734 kilometr\u016f. Na jejich \u00fadr\u017ebu bude p\u0159ipraveno
  bezm\u00e1la 900 pracovn\u00edk\u016f a 80 multifunk\u010dn\u00edch voz\u016f ur\u010den\u00fdch
  pro \u00faklid chodn\u00edk\u016f.\\n\\nZaj\u00edmavost na z\u00e1v\u011br. \u010c\u00e1st
  techniky pro zimn\u00ed \u00fadr\u017ebu komunikac\u00ed poskytuje nejv\u011bt\u0161\u00ed
  metropolitn\u00ed svozov\u00e1 spole\u010dnost Pra\u017esk\u00e9 slu\u017eby. N\u011bkter\u00e9
  vozy t\u00e9to spole\u010dnosti je\u0161t\u011b p\u0159ed p\u00e1r t\u00fddny fungovaly
  jako \u00faklidov\u00e9 samosb\u011brn\u00e9 vozy nebo krop\u00edc\u00ed cisterny.
  Technici je p\u0159estavili na zimn\u00ed sezonu. V praxi tedy cisterny na korb\u00e1ch
  a krop\u00edc\u00ed li\u0161ty, respektive samosb\u011brn\u00e9 technologie, nahradily
  n\u00e1stavby na posypov\u00fd materi\u00e1l a sn\u011bhov\u00e9 radlice.\\n\\nZimn\u00ed
  \u00fadr\u017eba samoz\u0159ejm\u011b neznamen\u00e1 jen \u00faklid sn\u011bhu.
  V p\u0159\u00edpad\u011b p\u0159\u00edzniv\u00fdch klimatick\u00fdch podm\u00ednek
  bude prob\u00edhat standardn\u00ed \u00faklid silnic i chodn\u00edk\u016f a dal\u0161\u00ed
  n\u00e1hradn\u00ed pr\u00e1ce, kter\u00e9 budou na\u0159izov\u00e1ny dle aktu\u00e1ln\u00ed
  pot\u0159eby s p\u0159ihl\u00e9dnut\u00edm k preferenc\u00edm jednotliv\u00fdch
  m\u011bstsk\u00fdch \u010d\u00e1st\u00ed.\\n\\nKARAVANY Z \u201eOSADY\u201c U SKALKY
  ZMIZ\u00cd, V\u011aCI SE DALY KONE\u010cN\u011a DO POHYBU\\n\\nU\u017e je to cel\u00e1
  \u0159ada let, co se Praha 10 pot\u00fdk\u00e1 s neleg\u00e1ln\u00edmi \u201eosadn\u00edky\u201c,
  kte\u0159\u00ed si zaparkovali sv\u00e9 karavany na pozemku hlavn\u00edho m\u011bsta.
  Proto\u017ee si na probl\u00e9my v okol\u00ed st\u011b\u017euj\u00ed obyvatel\u00e9,
  zapojila se Praha 10 do \u0159e\u0161en\u00ed slo\u017eit\u00e9ho probl\u00e9mu.\\n\\n\u201eRoky
  se touto situac\u00ed s karavany na hlavn\u00edm m\u011bst\u011b z pozice vlastn\u00edka
  pozemk\u016f nikdo aktivn\u011b nezab\u00fdval. Tehdej\u0161\u00ed ve\u0159ejen\u00ed
  m\u011bsta situaci p\u0159ech\u00e1zel s t\u00edm, \u017ee s t\u00edm je t\u00e9\u017ek\u00e9
  n\u011bco ud\u011blat. Te\u010f se do toho zapojila Praha 10. V listopadu provedl
  stavebn\u00ed \u00fa\u0159ad na Praze 10 za \u00fa\u010dasti m\u011bstsk\u00e9 policie
  zdiskutov\u00e1n\u00ed aktu\u00e1ln\u00edho stavu nepovolen\u00fdch staveb, nutn\u00fd
  pro zah\u00e1jen\u00ed \u0159\u00edzen\u00ed o odstran\u011bn\u00ed staveb. Pot\u00e9
  m\u016f\u017ee n\u00e1sledovat rozhodnut\u00ed o na\u0159\u00edzen\u00ed jejich
  odstran\u011bn\u00ed a potom budeme moci \u0159\u00edct, \u017ee karavanov\u00e9
  m\u011bste\u010dko zmiz\u00ed,\u201c \u0159\u00edk\u00e1 mistrovnosta pro bezpe\u010dnost
  Radek Lojda.\\n\\nNa neleg\u00e1ln\u00ed \u201eosadn\u00edky\u201c si st\u011b\u017euj\u00ed
  m\u00edstn\u00ed obyvatel\u00e9 n\u011bkolik let, a\u0165 u\u017e kv\u016fli hluku,
  kv\u016fli obav\u011b z hromadn\u00e9 st\u00e1le v\u011bt\u0161\u00edho mno\u017estv\u00ed
  odpadu v\u0161ude kolem, nebo pro podez\u0159en\u00ed, \u017ee v okol\u00ed m\u016f\u017ee
  doch\u00e1zet k prodeji drog.\\n\\n\u201eBohu\u017eel ten probl\u00e9m neum\u00edme
  vy\u0159e\u0161it okam\u017eit\u011b jako m\u00e1vnut\u00edm kouzeln\u00e9ho proutku,
  ale existuj\u00ed z\u00e1kony, o kter\u00e9 se m\u016f\u017eeme op\u00edr\u00e1t.
  Ud\u011bl\u00e1me v\u0161e proto, aby nakonec karavany opravdu zmizely a byly p\u0159esunuty
  na vyhovuj\u00edc\u00ed m\u00edsto,\u201c \u0159\u00edk\u00e1 Radek Lojda.\\n\\nV
  ot\u00e1zce bezpe\u010dnosti se radn\u011b v\u011bnuj\u00ed tak\u00e9 situaci v
  ulici \u00davalsk\u00e1. Pom\u011brn\u011b ru\u0161nou ulici mus\u00ed ka\u017ed\u00fd
  den p\u0159ech\u00e1zet des\u00edtky osob a p\u0159edev\u0161\u00edm d\u011bti,
  kdy\u017e jdou do \u0161koly.\\n\\n\u201eJe to velmi podobn\u00e9 jako v ulici Na
  Pades\u00e1t\u00e9m, kde o mo\u017enostech, jak zklidnit provoz, u\u017e jedn\u00e1me.
  V\u0161ichni vid\u00edme, \u017ee i tento \u00fasek by si opravdu zaslou\u017eil
  zpomalen\u00ed dopravy, ale jako m\u011bstsk\u00e1 \u010d\u00e1st m\u00e1me jen
  omezen\u00e9 mo\u017enosti, komunikace je v majetku a spr\u00e1v\u011b magistr\u00e1tu
  a TSK. Pr\u00e1v\u011b se budu sna\u017eit v co nejbli\u017e\u0161\u00ed dob\u011b
  zv\u00fd\u0161it bezpe\u010dnost p\u0159echodu a pro zklidn\u011bn\u00ed dopravy
  vyu\u017e\u00edt v\u0161echny prost\u0159edky, kter\u00e9 jako Des\u00edtka vyu\u017e\u00edt
  m\u016f\u017eeme,\u201c uzav\u00edr\u00e1 Lojda.\\n\\nD\u016eM UM NA ZAHRA\u010e\u00c1KU
  \u017d\u00cdJE\\n\\nNa Praze 10 v Zahradn\u00edm M\u011bst\u011b najdete v are\u00e1lu
  Jaho-\\ndov\u00e1 jedno z mnoha pracovi\u0161\u0165 st\u0159ediska voln\u00e9ho
  \u010dasu pro d\u011bti a ml\u00e1de\u017e, spadaj\u00edc\u00ed pod p\u0159\u00edsp\u011bvkovou
  organizaci DDM Praha 10 \u2013 D\u016fm UM, kter\u00e1 umo\u017e\u0148uje efektivn\u00ed
  vyu\u017eit\u00ed voln\u00e9ho \u010dasu s \u0161irokou \u0161k\u00e1lou z\u00e1jmov\u00fdch
  aktivit.\\n\\nPracovi\u0161t\u011b v Zahradn\u00edm M\u011bst\u011b je nadstandardn\u011b
  vybaveno a zabezpe\u010deno, nebo\u0165 budovy pavilonu C a D byly ned\u00e1vno
  pln\u011b rekonstruov\u00e1ny a za\u0159\u00edzeny. Sou\u010d\u00e1st\u00ed tohoto
  pracovi\u0161t\u011b je n\u011bkolik kluboven pro pravidelnou i spont\u00e1nn\u00ed
  z\u00e1jmovou \u010dinnost. Keramick\u00fd a v\u00fdtvarn\u00fd ateli\u00e9r, modern\u011b
  vybaven\u00e1 PC u\u010debna, pracovna s 3D tisk\u00e1rnami, hudebn\u00ed, divadeln\u00ed
  s\u00e1l, posilovna, t\u011blocvi\u010dna a dal\u0161\u00ed. Mimo vlastn\u00ed prostory
  vyu\u017e\u00edv\u00e1 DDM tak\u00e9 pronajat\u00fd t\u011blocvi\u010dn\u00fd p\u0159ilehl\u00fdch
  z\u00e1kladn\u00edch \u0161kol. Um\u00edst\u011bno je zde t\u00e9\u017e centrum
  pro p\u0159ed\u0161koln\u00ed d\u011bti Sedmikr\u00e1\u0161ka a otev\u0159en\u00fd
  klub pro ml\u00e1de\u017e.\\n\\nKrou\u017eky i sout\u011b\u017en\u00ed dru\u017estva\\nVe
  \u0161koln\u00edm roce 2023/2024 pracovi\u0161t\u011b otev\u0159elo 137 z\u00e1jmov\u00fdch
  \u00fatvar\u016f z oblasti hudby, tan\u010de, sportu, techniky, v\u00fdtvarn\u00e9
  \u010dinnosti, keramiky, divadla a dal\u0161\u00edch pro v\u00edce ne\u017e 1600
  d\u011bt\u00ed. Velk\u00e9 m\u00edsto m\u00e1 sport, a to od krou\u017ek\u016f pro
  z\u00e1bavu (sportovn\u00ed hry, stoln\u00ed tenis, florbal, basketbal, odbijen\u00e1,
  badminton) a\u017e po sout\u011b\u017en\u00ed dru\u017estva Wizards (florbal, basketbal,
  odbijen\u00e1, futsal), kter\u00e1 hraje v\u00fdkonnostn\u00ed sout\u011b\u017ee.
  Mimo pravidelnou \u010dinnost po\u0159\u00e1d\u00e1 DDM r\u016fzn\u00e9 akce, jako
  jsou v\u00fdtvarn\u00e9 a keramick\u00e9 d\u00edlny pro ve\u0159ejnost, tane\u010dn\u00ed
  workshopy, besidy (bl\u00edzko se Mikul\u00e1\u0161sk\u00e1), turnaje v e-sportech
  a mnoho dal\u0161\u00edch. Neodmyslitelnou sou\u010d\u00e1st\u00ed jsou t\u00e1borov\u00e9
  pro d\u011bti, a to jak p\u0159\u00edm\u011bstsk\u00e9, tak i v\u00fdjezdni, kter\u00e9
  se t\u011b\u0161\u00ed velk\u00e9 oblib\u011b a mnohdy se ani nedostane na v\u0161echny
  z\u00e1jemce. V tomto za\u0159\u00edzen\u00ed pracuje hned 6 intern\u00edch zam\u011bstnanc\u016f
  na pozici pedagoga voln\u00e9ho \u010dasu a n\u011bkolik des\u00edtek kvalifikovan\u00fdch
  extern\u00edch lektor\u016f.\\n\\nPokud jste o t\u00e9to instituci doposud nesly\u0161eli,
  nev\u00e1hejte nav\u0161t\u00edvit jej\u00ed webov\u00e9 str\u00e1nky www.dumum.cz
  a zkuste \u0161t\u011bst\u00ed, zda neobjev\u00edte v n\u011bkter\u00e9m krou\u017eku
  je\u0161t\u011b voln\u00e9 m\u00edsto. Sledujte tak\u00e9 d\u016fle\u017eit\u00e9
  term\u00edny po\u0159\u00e1dan\u00fdch akc\u00ed, jejich zahajov\u00e1n\u00ed \u010di
  p\u0159ihl\u00e1\u0161ov\u00e1n\u00ed, aby v\u00e1m n\u011bco zaj\u00edmav\u00e9ho
  neuniklo. Vst\u0159\u00edcn\u00ed pedagogov\u00e9 v\u00e1m v informa\u010dn\u00ed
  kancel\u00e1\u0159i v p\u0159\u00edstavb\u011b u pavilon\u016f na Zahradn\u00edm
  M\u011bst\u011b r\u00e1di porad\u00ed.\\n\\nSTROJA\u0158I Z DES\u00cdTKY UM\u011aJ\u00cd
  OPRAVOVAT LETECK\u00c9 MOTORY\\n\\n\u0158emeslo m\u00e1 zlat\u00e9 dno a stroja\u0159ina
  m\u00e1 v tuzemsku dlouhou tradici. Za prvn\u00ed republiky zde existovaly stroja\u0159sk\u00e9
  firmy produkuj\u00edc\u00ed sv\u011btov\u011b unik\u00e1tn\u00ed v\u00fdrobky. Za
  zm\u00ednku stoj\u00ed t\u0159eba Tatra 77, kter\u00e1 byla prvn\u00edm s\u00e9riov\u011b
  vyr\u00e1b\u011bn\u00fdm aerodynamick\u00fdm automobilem. Mezivl\u00e1dn\u00ed \u010deskoslovensk\u00e9
  letectvo se ve velk\u00e9 m\u00ed\u0159e op\u00edralo o produkci dom\u00e1c\u00ed
  Avie. A jedno z prvn\u00edch leti\u0161\u0165 na \u00fazem\u00ed Prahy bylo prozat\u00edmn\u00ed
  leti\u0161t\u011b ve Stra\u0161nic\u00edch. To je ale t\u00e9ma pro jin\u00fd \u010dl\u00e1nek.\\n\\n\u00davodn\u00ed
  historick\u00fd exkurz m\u00e1me za sebou, poj\u010fme se pod\u00edvat na obor leteck\u00fd
  mechanik, kter\u00fd na tuto tradici navazuje. Studenti se zde nau\u010d\u00ed bezchybn\u011b
  se orientovat v technick\u00e9 dokumentaci, z\u00edskaj\u00ed znalosti konstrukce,
  syst\u00e9m\u016f a agreg\u00e1t\u016f letadel. Ty si pak mohou praxi nebo studium
  na vysok\u00e9 \u0161kole d\u00e1le roz\u0161\u00ed\u0159ovat nebo se \u00fazce
  specializovat.\\n\\nPo maturit\u011b certifikace\\nJde o presti\u017en\u00ed pr\u00e1ci
  s perspektivn\u00ed budoucnost\u00ed. Leteck\u00fd pr\u016fmysl je glob\u00e1ln\u00ed
  odv\u011btv\u00ed a pot\u0159ebuje talentovan\u00e9, schopn\u00e9 lidi, kte\u0159\u00ed
  jej budou posouvat d\u00e1l. To na druhou stranu znamen\u00e1, \u017ee na \u017e\u00e1ky
  jsou kladen\u00fd pom\u011brn\u011b vysok\u00e9 n\u00e1roky p\u0159ed samotnou maturitn\u00ed
  zkou\u0161kou i po n\u00ed. Po slo\u017een\u00ed zkou\u0161ky do sp\u011blosti je
  \u010dek\u00e1 proces z\u00edsk\u00e1n\u00ed certifikace, kter\u00e1 je harmonizov\u00e1na
  s pravidly Evropsk\u00e9 unie. Z toho vyplynul, \u017ee dve\u0159e na evropsk\u00e9
  trhy maj\u00ed \u0161ikovn\u00ed absolventi stoprocentn\u011b otev\u0159en\u00e9.\\n\\nDal\u0161\u00ed
  atraktivn\u00ed obory\\nSt\u0159edn\u00ed \u0161kola elektrotechniky a stroj\u00edrenstv\u00ed
  v Zahradn\u00edm M\u011bst\u011b nab\u00edz\u00ed i jin\u00e9 obory. Za zm\u00ednku
  stoj\u00ed t\u0159eba oper\u00e1tor a mechanik CNC stroj\u016f nebo n\u00e1stroja\u0159.
  I ty jsou atraktivn\u00ed, proto\u017ee mlad\u00e9ho \u010dlov\u011bka sezn\u00e1mi
  s nov\u00fdmi trendy, jako je t\u0159eba 3D tisk, kter\u00fd p\u0159inesl takovou
  malou pr\u016fmyslovou revoluci. Pro\u010d se jim tedy nezab\u00fdvat na profesion\u00e1ln\u00ed
  \u00farovni? Pro v\u0161echny obory \u0161kola zaji\u0161\u0165uje pot\u0159ebn\u00e9
  praxe ve vybran\u00fdch firm\u00e1ch.\\n\\nOdv\u011btv\u00ed s budoucnost\u00ed\\nZkusme
  se pod\u00edvat na chv\u00edli na sv\u011bt okolo n\u00e1s. Co uvid\u00edme? V\u0161echno
  musel n\u011bkdo vymyslet, navrhnout, vyrobit. V\u00fdsledky stroja\u0159iny vid\u00edme
  v\u0161ude kolem n\u00e1s. To je d\u016fvod, pro\u010d ji studovat. \u010clov\u011bk
  pochop\u00ed, jak v\u011bci funguj\u00ed, z\u00edsk\u00e1 znalosti o vlastnostech
  materi\u00e1l\u016f a hlavn\u011b bude m\u00edt p\u0159\u00edle\u017eitost p\u0159isp\u011bt
  k chodu sv\u011bta kolem n\u00e1s. Stroja\u0159ina u\u017e d\u00e1vno nen\u00ed
  t\u011b\u017ek\u00e1 \u0161pinav\u00e1 pr\u00e1ce, p\u0159i n\u00ed\u017e cel\u00fd
  profesn\u00ed \u017eivot str\u00e1v\u00edte u jednoho stroje. Naopak. Je to dynamicky
  se rozv\u00edjej\u00edc\u00ed obor s budoucnost\u00ed.\\n\\nPODNIKATEL DES\u00cdTKY\\n\\nHistoricky
  prvn\u00edho ro\u010dn\u00edku ankety Podnikatel roku se z\u00fa\u010dastnilo 2
  268 hlasuj\u00edc\u00edch, kte\u0159\u00ed rozd\u011blili celkem 5 712 hlas\u016f
  ve \u010dty\u0159ech kategori\u00edch \u2013 gastronomie, relax a kr\u00e1sa, \u0159emesla
  a ostatn\u00ed prodejny a slu\u017eby. Mimo to z hlasov\u00e1n\u00ed vzejde je\u0161t\u011b
  absolutn\u00ed v\u00edt\u011bz. Ten si odnese cenu pojmenovanou po Jind\u0159ichu
  Waldesovi, kter\u00e9mu za prvn\u00ed republiky p\u0159ezd\u00edvali Vr\u0161ovick\u00fd
  Ba\u0165a \u010di Kr\u00e1l knofl\u00edk\u016f. Jeho tov\u00e1rna je zn\u00e1m\u00e1
  sp\u00ed\u0161e pod zna\u010dkou Koh-i-noor. Slavnostn\u00ed ud\u00edlen\u00ed cen
  se uskute\u010dn\u00ed 7. prosince 2024. Report\u00e1\u017e ze slavnostn\u00edho
  ve\u010dera p\u0159iprav\u00edme pro lednov\u00e9 \u010d\u00edslo magaz\u00ednu.\\n\\nJE
