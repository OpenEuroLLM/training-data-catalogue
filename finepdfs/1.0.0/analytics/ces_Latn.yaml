  st\u00e1da ovc\u00ed jedine\u010dn\u011b vycvi\u010den\u00fdmi psy veden\u00fdch
  zku\u0161en\u00fdm ov\u010d\u00e1kem panem Vojtou Molkem.  \u00dasp\u011b\u0161n\u011b
  byly dokon\u010deny i rekonstruk\u010dn\u00ed pr\u00e1ce na z\u00e1kladn\u011b Okr\u0161la,
  kter\u00e1 u\u017e pln\u011b slou\u017e\u00ed sv\u00e9mu \u00fa\u010delu v t\u011bsn\u00e9
  n\u00e1vaznosti na rezervaci. D\u011bkujeme za kr\u00e1sn\u00e9 setk\u00e1n\u00ed
  v n\u00e1dhern\u00e9 podzimn\u00ed p\u0159\u00edrod\u011b B\u00edl\u00fdch Potok\u016f.\\n\\n*
  Spolu s dal\u0161\u00edmi z\u00e1jemci jsme se 22.10. aktivn\u011b z\u00fa\u010dastnili
