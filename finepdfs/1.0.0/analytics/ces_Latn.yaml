  PRAHA 6. 4. 2024\\n\\nCZ\\n\\nSUPERHALFS HALF MARATHON SERIES\\n\\nRUNCZECH | ALL
  RUNNERS ARE BEAUTIFUL\\n\\n| \u00daVODN\u00cd SLOVO |\\n\\n**Bohuslav Svoboda**\\n\\nMil\u00e9
  b\u011b\u017ekyn\u011b a b\u011b\u017eci,\\n\\nobdivuji v\u0161echny, kte\u0159\u00ed
  se leto\u0161n\u00edho p\u016flmaratonu \u00fa\u010dastn\u00ed. Ka\u017ed\u00fd
  \u00fasp\u011bch za\u010d\u00edn\u00e1 odhodl\u00e1n\u00edm to zkusit. A vy v\u0161ichni,
  kte\u0159\u00ed jste se rozhodli, u\u017e tedy \u00fasp\u011b\u0161n\u00ed jste.
  Patn\u00e1ct tis\u00edc b\u011b\u017ec\u016f se rozhodlo vyj\u00e1d\u0159it svou
  svobodu, radost z pohybu, v tom nejlep\u0161\u00edm slova smyslu podpo\u0159it sv\u00e9
  t\u011blo, i svou mysl.\\n\\nB\u011b\u017ete v Praze a j\u00e1 m\u00e1m tu \u010dest
  st\u00e1t v jej\u00edm \u010dele. V\u011b\u0159\u00edm, \u017ee krom\u011b z\u00e1\u017eitku
  ze sportu si odnesete i hezk\u00e9 vzpom\u00ednky na jedno z nejkr\u00e1sn\u011bj\u0161\u00edch
  m\u011bst na sv\u011bt\u011b. \u00dasp\u011b\u0161n\u00fd start a bezpe\u010dn\u00e9
  dosa\u017een\u00ed c\u00edle.\\n\\nBohuslav Svoboda, prim\u00e1tor hl. m. Prahy\\n\\n---\\n\\n**Carlo
  Capalbo**\\n\\nV\u00e1\u017een\u00ed p\u0159\u00e1tel\u00e9, b\u011b\u017eci a fanou\u0161ci,
  v\u00edtejte na 1/2Maratonu Praha 2024!\\n\\nLetos v \u00fapln\u011b nov\u00e9m
  pojet\u00ed, vyprodan\u00fd z\u00e1vod s 15 000 b\u011b\u017eci a nov\u00fdm startem
  na Bubensk\u00e9m n\u00e1b\u0159e\u017e\u00ed. T\u00edmto z\u00e1vodem odstartujeme
  spole\u010dn\u011b 30. sezonu RunCzech.\\n\\nD\u011bkuji za va\u0161\u00ed podporu
  b\u011bhem uplynul\u00fdch let, jste to vy, kte\u0159\u00ed n\u00e1s \u017eenou
  dop\u0159edu a pro v\u00e1s v\u0161echny se sna\u017e\u00edme p\u0159in\u00e1\u0161et
  v\u017edy n\u011bco nov\u00e9ho, nov\u00fd z\u00e1\u017eitek, nov\u00fd osobn\u00ed
  rekord, nov\u00e1 p\u0159\u00e1telstv\u00ed a radost z pohybu.\\n\\nALL RUNNERS
  ARE BEAUTIFUL je n\u00e1\u0161 b\u011b\u017eeck\u00fd sv\u011bt, do kter\u00e9ho
  je KA\u017dD\u00dd \u010dlov\u011bk zv\u00e1n, sv\u011bt pln\u00fd sportu, z\u00e1bavy
  a p\u0159\u00e1telstv\u00ed.\\n\\nCarlo Capalbo, prezident organiza\u010dn\u00edho
  v\u00fdboru RunCzech\\n\\nALL RUNNERS ARE BEAUTIFUL\\n\\nNA\u0160E NOV\u00c1 IDENTITA.
  JEDINE\u010cNOST. TO, \u010cIM JSME TAK V\u00ddJIME\u010cN\u00cd.\\n\\nALL RUNNERS
  ARE BEAUTIFUL n\u00e1s zm\u011bnilo. Nen\u00ed to jen s\u00e9rie z\u00e1vod\u016f.
  Nen\u00ed to jen zn\u00e1\u010dka. Stali jsme se toti\u017e definic\u00ed tohoto
  sportu, stali jsme se \u0161ampionem b\u011bhu. Stali jsme se hlasem, kter\u00fd
  promluvil k milion\u016fm b\u011b\u017ec\u016f na cel\u00e9m sv\u011bt\u011b. Z\u00e1le\u017e\u00ed
  n\u00e1m na nich. V\u00e1\u017e\u00edme si jejich odvahy nasadit si b\u011b\u017eeck\u00e9
  boty, p\u0159ekonat se, s\u00e1hnout si na dno.\\n\\nTo je pro n\u00e1s definice
  v\u00edt\u011bzstv\u00ed a \u00fasp\u011bchu. Za\u010d\u00edt. Vytvrat. \u00da\u010dastnit
  se. N\u011bco pro sebe ud\u011blat. Vyhecovat se. U\u017e\u00edt si to.\\n\\nB\u011bh
  je radost. O to tady p\u0159ece jde. Ka\u017ed\u00fd, kdo chce b\u00fdt sou\u010d\u00e1st\u00ed
  tohoto kr\u00e1sn\u00e9ho sportu - mlad\u00fd, star\u00fd, vysok\u00fd, mal\u00fd,
  rychl\u00fd, nebo pomal\u00fd - je v\u00edt\u00e1n.\\n\\nALL RUNNERS ARE BEAUTIFUL
  je symbol v\u0161ech b\u011b\u017ec\u016f bez rozd\u00edlu. Nez\u00e1le\u017e\u00ed,
  k\u00fdm jsme, co d\u011bl\u00e1me, nebo kter\u00fd b\u011bh zrovna b\u011b\u017e\u00edme.
  B\u011b\u017e\u00edme.\\n\\nRUNNING EXPO\\n\\n4. DUBNA \u2013 5. DUBNA, 2024\\nV\u00fdstavi\u0161t\u011b
  Hole\u0161ovice, K\u0159i\u017e\u00edkovy Pavilony D+E\\n\\nOtev\u00edrac\u00ed
  doba\\n\u010ctvrtek, 4. 4. 12:00 \u2013 20:00\\nP\u00e1tek, 5. 4. 10:00 \u2013 20:00\\nSobota,
  6. 4. 7:00 \u2013 8:00\\n(pouze vyzvednut startovn\u00edho \u010d\u00edsla)\\n\\nAutem:\\nNejbli\u017e\u0161\u00ed
  parkovi\u0161t\u011b najdete hned na V\u00fdstavi\u0161ti. Jedn\u00e1 se o placen\u00e9
  parkovi\u0161t\u011b.\\n\\nJak se dostat na start?\\nPokud si budete vyzved\u00e1vat
  startovn\u00ed \u010d\u00edslo v sobotu r\u00e1no, doporu\u010dujeme se p\u0159epravit
  na start z\u00e1vodu metrem a p\u0159edej\u00edt tak p\u0159\u00edpadn\u00fdm v\u00fdluk\u00e1m
  a uzav\u00edrk\u00e1m. Nejbli\u017e\u0161\u00ed stanice metra startu je na lince
