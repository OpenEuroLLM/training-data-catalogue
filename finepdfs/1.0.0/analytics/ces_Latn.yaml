  o pln\u011bn\u00ed p\u0159\u00edjm\u016f a v\u00fddaj\u016f za rok 2020 (\u00fadaje
  v K\u010d)\\n\\nPln\u011bn\u00ed p\u0159\u00edjm\u016f celkem a v\u00fddaj\u016f
  celkem k 31.12.2020 obsahuj\u00ed konsolida\u010dn\u00ed polo\u017eky (pol. 4134
  a pol. 5345, 5349) ve v\u00fd\u0161i 6 234 000,00 K\u010d.\\n\\n\u00dadaje o pln\u011bn\u00ed
  rozpo\u010dtu p\u0159\u00edjm\u016f, v\u00fddaj\u016f a o dal\u0161\u00edch finan\u010dn\u00edch
  operac\u00edch v pln\u00e9m \u010dlen\u011bn\u00ed podle rozpo\u010dtov\u00e9 skladby
  jsou obsa\u017eeny v p\u0159\u00edloze \u010d. 1 \u2013 V\u00fdkaz FIN 2-12 M \u2013
  viz elektronick\u00e1 \u00fa\u0159edn\u00ed deska www.secublovic.cz\\n\\n2)   Hospod\u00e1\u0159sk\u00e1
  \u010dinnost obce\\n\\nObec Se\u010d nevede hospod\u00e1\u0159skou \u010dinnost.\\n\\n3)   \u00dadaje
  o hospoda\u0159en\u00ed s majetkem a o dal\u0161\u00edch finan\u010dn\u00edch operac\u00edch\\n\\nV
  roce 2020 byly dokon\u010deny akce, kter\u00e9 byly za\u0159azeny do majetkov\u00e9
  evidence a zah\u00e1jeno odpisov\u00e1n\u00ed. Mezi nejv\u00fdznamn\u011bj\u0161\u00ed
  pat\u0159\u00ed vybudov\u00e1n\u00ed chodn\u00edku v hodnot\u011b 1 450 tis. K\u010d,
  d\u00e1le pak technick\u00e9 zhodnocen\u00ed budovy \u010d.p. 78 (rekonstrukce vodovodu)
  v \u010d\u00e1stce 133 422,34 K\u010d a oplocen\u00ed u skl\u00e1dky za 66 713,49
  K\u010d. V souladu s \u010cesk\u00fdm \u00fa\u010detn\u00edm standardem \u010d.
  708 a s vnit\u0159n\u00edm p\u0159edpisem odepsala obec Se\u010d v roce 2020 majetek
  v celkov\u00e9 v\u00fd\u0161i 304 830,00 K\u010d. Do majetkov\u00e9 evidence byl
  rovn\u011b\u017e za\u0159azen bez\u00faplatn\u011b p\u0159evzat\u00fd pozemek od
  SP\u00da v hodnot\u011b 13 252,32 K\u010d.\\n\\nV roce 2019 byl zalo\u017een fond
  vodohospod\u00e1\u0159sk\u00e9 infrastruktury se samostatn\u00fdm \u00fa\u010dtem,
  kter\u00fd je ur\u010den na obnovu a opravy vybudovan\u00e9 infrastruktury. Finan\u010dn\u00ed
  prost\u0159edky, kter\u00e9 byly ur\u010deny na obnovu a opravy v minul\u00fdch
  letech, byly p\u0159evedeny na zvl\u00e1\u0161tn\u00ed \u00fa\u010det fondu. Tvorba
  fondu v roce 2020 \u010dinila celkem 667 415,00 K\u010d. Fond byl \u010derp\u00e1n
  na opravy vodohospod\u00e1\u0159sk\u00e9 infrastruktury v \u010d\u00e1stce 46 016,00
  K\u010d.\\n\\n\u00dadaje o hospoda\u0159en\u00ed s majetkem a dal\u0161\u00edch
  finan\u010dn\u00edch operac\u00edch jsou uvedeny v ro\u010dn\u00ed \u00fa\u010detn\u00ed
  z\u00e1v\u011brce ve v\u00fdkazech rozvaha, v\u00fdkaz zisk\u016f a ztr\u00e1ty
  a p\u0159\u00edloha.\\n\\nV\u00fdkaz Rozvaha, V\u00fdkaz zisk\u016f a ztr\u00e1ty
  a P\u0159\u00edloha \u00fa\u010detn\u00ed z\u00e1v\u011brky za rok 2020 jsou dostupn\u00e9
  na internetov\u00fdch str\u00e1nk\u00e1ch na adrese: www.secublovic.cz a v p\u0159\u00edloze
  \u010d. 2 n\u00e1vrhu z\u00e1v\u011bre\u010dn\u00e9ho \u00fa\u010dtu. V\u00fdkazy
  a p\u0159\u00edloha \u00fa\u010detn\u00ed z\u00e1v\u011brky obsahuj\u00ed \u00fadaje
