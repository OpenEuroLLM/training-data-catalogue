  "\"Z\u00e1pis \u010d. 1\\n\\nze zased\u00e1n\u00ed ZASTUPITELSTVA OBCE KOMOROVICE\\n\\nkonan\u00e9ho
  dne 14. 11. 2018 od 19,00 hodin\\n\\nv zasedac\u00ed m\u00edstnosti O\u00da Komorovice\\n\\nP\u0159\u00edtomni:
  Bc. P\u0159emysl Je\u017e, Pavel Alenka, Radka Krej\u010d\u00ed, Marie \u010celedov\u00e1,
  Pavel\\n\\nPacl\u00edk, Jan Koudelka\\n\\nOmluveni: Josef Hr\u016fza\\n\\nZapisovatel:
  Vlasta Kupil\u00edkov\u00e1\\n\\n1. Zah\u00e1jen\u00ed\\n\\nP\u0159ed zah\u00e1jen\u00edm
  zased\u00e1n\u00ed bylo zastupiteli Pavlu Pacl\u00edkovi p\u0159ed\u00e1no osv\u011bd\u010den\u00ed
  o zvolen\u00ed \u010dlenem zastupitelstva obce podle \u00a7 53 z\u00e1kona \u010d.
  491/2001 Sb., o volb\u00e1ch do zastupitelstev obc\u00ed a n\u011bkter\u00fdch souvisej\u00edc\u00edch
  z\u00e1kon\u016f, v platn\u00e9m zn\u011bn\u00ed z d\u016fvodu omluven\u00e9 ne\u00fa\u010dasti
  na ustavuj\u00edc\u00edm zased\u00e1n\u00ed zastupitelstva obce.\\n\\nZased\u00e1n\u00ed
  zastupitelstva obce zah\u00e1jil starosta obce Bc. P\u0159emysl Je\u017e v 19,00
  hodin uv\u00edt\u00e1n\u00edm p\u0159\u00edtomn\u00fdch zastupitel\u016f a konstatoval,
  \u017ee informace o kon\u00e1n\u00ed a programu zased\u00e1n\u00ed byla zve\u0159ejn\u011bna
  na \u00fa\u0159edn\u00ed desce obecn\u00edho \u00fa\u0159adu a na internetov\u00fdch
  str\u00e1nk\u00e1ch obce, a to nejm\u00e9n\u011b sedm dn\u016f p\u0159ede dnem kon\u00e1n\u00ed
  zased\u00e1n\u00ed zastupitelstva. Starosta d\u00e1le uvedl, \u017ee zastupitelstvo
  se se\u0161lo v  po\u010dtu 6 \u010dlen\u016f ze 7 a je tedy usn\u00e1\u0161en\u00edschopn\u00e9.\\n\\nStarosta
  obce v souladu s \u00a7 69 odst. 2 z\u00e1kona o obc\u00edch vyzval p\u0159\u00edtomn\u00e9ho
  \u010dlena zastupitelstva Pavla Pacl\u00edka ke slo\u017een\u00ed slibu. Slo\u017een\u00ed
  slibu prob\u011bhlo tak, \u017ee starosta p\u0159e\u010detl slib stanoven\u00fd
  v \u00a7 69 odst. 2 z\u00e1kona o obc\u00edch a vyzval Pavla Pacl\u00edka ke slo\u017een\u00ed
  slibu pronesen\u00edm slova \u201eslibuji\\\" a podpisem na p\u0159ipraven\u00e9m
  archu. (p\u0159\u00edloha \u010d. 1 ustavuj\u00edc\u00edho zastupitelstva).\\n\\nZastupitel
  Pavel Pacl\u00edk neodm\u00edtl slo\u017eit slib ani neslo\u017eil slib s v\u00fdhradou.\\n\\n2.
