  "\"Prom\u011bny obce Horn\u00ed Vysok\u00e9\\n\\nTerezie V\u00e1vrov\u00e1\\n\\nVzd\u011bl\u00e1vac\u00ed
  c\u00edl\\n\\nSrovn\u00e1vac\u00ed kompozice ilustruje historickou zm\u011bnu v
  konkr\u00e9tn\u00ed obci. \u017d\u00e1ci srovn\u00e1vaj\u00ed fotografie toto\u017en\u00e9ho
  m\u00edsta v obci z let 1925 a 2004, hledaj\u00ed podobnosti a rozd\u00edly. V\u00fdstup
  z t\u00e9to jednoduch\u00e9 popisn\u00e9 pr\u00e1ce (ve stylu \u00fakol\u016f pro
  p\u0159ed\u0161kol\u00e1ky \u201enajdi 10 rozd\u00edl\u016f\\\") by je m\u011bl
  motivovat k z\u00e1jmu o historii a k ot\u00e1zk\u00e1m po p\u0159\u00ed\u010din\u00e1ch
  zm\u011bn, je\u017e fotografie ukazuj\u00ed. Cvi\u010den\u00ed lze spojit s v\u00fdkladem
  d\u016fsledk\u016f druh\u00e9 sv\u011btov\u00e9 v\u00e1lky, prom\u011bn \u010desk\u00e9
  krajiny a zde se odehr\u00e1vaj\u00edc\u00edch proces\u016f jako urbanizace, kolektivizace
  ad.\\n\\nJednotliv\u00e9 operace\\n\\nIkony na jednotliv\u00fdch slidech cvi\u010den\u00ed
  poukazuj\u00ed na to, jak\u00fd druh operace  dan\u00e1 obrazovka umo\u017e\u0148uje:\\n\\nP\u0159i
  kliknut\u00ed lev\u00fdm tla\u010d\u00edtkem do obrazu p\u0159ibl\u00ed\u017e\u00ed
  lupa \u010d\u00e1st obrazu ve v\u00fd\u0159ezu.\\n\\nDo boxu pro text zapisujete
  odpov\u011b\u010f na ot\u00e1zku nebo jin\u00fd koment\u00e1\u0159 (dle zad\u00e1n\u00ed).\\n\\nAplikace
  umo\u017e\u0148uje u\u017eivateli, aby na fotografii barevn\u011b ozna\u010dil d\u016fle\u017eit\u00e9
  prvky a doplnil je textov\u00fdm koment\u00e1\u0159em. Tahem my\u0161i se stisknut\u00fdm
  lev\u00fdm tla\u010d\u00edtkem kresl\u00edte do obrazu. Nakliknut\u00edm na nakreslen\u00fd
  tvar prav\u00fdm tla\u010d\u00edtkem otev\u0159ete menu s nab\u00eddkou \u00fakon\u016f:
  zm\u011bnit barvu tvaru, (T) doplnit textov\u00fd koment\u00e1\u0159, (X) smazat
  nakliknut\u00fd objekt.\\n\\nZ\u00e1kladn\u00ed typy pr\u00e1ce s cvi\u010den\u00edm\\n\\n1.
  U\u010ditel m\u016f\u017ee pracovat spole\u010dn\u011b s celou t\u0159\u00eddou
  s vyu\u017eit\u00edm dataprojektoru. Zan\u00e1\u0161\u00ed pak v\u00fdsledky pr\u00e1ce
  do jednoho cvi\u010den\u00ed. Po vypln\u011bn\u00ed toto cvi\u010den\u00ed ukl\u00e1d\u00e1,
  aby mu je server odeslal na zadanou e-mailovou adresu. V\u00fdsledek spole\u010dn\u00e9
  pr\u00e1ce m\u016f\u017ee nasd\u00edlet \u017e\u00e1k\u016fm.\\n\\n2. Historylab
  lze vyu\u017e\u00edt ke skupinov\u00e9 pr\u00e1ci ve t\u0159\u00edd\u011b, pokud
  je mo\u017en\u00e9 pracovat s n\u011bkolika po\u010d\u00edta\u010di. U\u010ditel
  p\u0159ed\u00e1 \u017e\u00e1k\u016fm odkaz na konkr\u00e9tn\u00ed cvi\u010den\u00ed
  a instruuje je, aby na z\u00e1v\u011br cvi\u010den\u00ed vyplnili e-mailovou adresu
  jednoho ze \u017e\u00e1k\u016f ve skupin\u011b i adresu u\u010ditele a ulo\u017eili
  v\u00fdsledky pr\u00e1ce. Vypln\u011bn\u00e1 cvi\u010den\u00ed server ode\u0161le
  na zadan\u00e9 adresy. \u017d\u00e1k, jemu\u017e cvi\u010den\u00ed p\u0159i\u0161lo
  na e-mail, m\u016f\u017ee v\u00fdsledky rozposlat ostatn\u00edm \u010dlen\u016fm
  skupiny.\\n3. U\u010ditel m\u016f\u017ee cvi\u010den\u00ed zadat i jako dom\u00e1c\u00ed
  \u00fakol. Mus\u00ed \u017e\u00e1k\u016fm odeslat odkaz na cvi\u010den\u00ed a instruovat
  je, aby po vypln\u011bn\u00ed \u00fakolu zadali svou e-mailovou adresu i adresu
  u\u010ditele a ulo\u017eili v\u00fdsledky pr\u00e1ce. Vypln\u011bn\u00e1 cvi\u010den\u00ed
  server ode\u0161le na zadan\u00e9 adresy.\\n\\nPrameny\\n\\nOber Weissig, 1925\\n\\nZdroj:
  Antikomplex, z. s.\\n\\nDoporu\u010den\u00fd postup pro spole\u010dnou pr\u00e1ci
  v hodin\u011b s dataprojektorem\\n\\n1. \u00davodn\u00ed f\u00e1ze. T\u0159\u00edda
  si spole\u010dn\u011b s pomoc\u00ed lupy prohl\u00ed\u017e\u00ed prom\u00edtanou
  dvojici fotografi\u00ed. U\u010ditel zapisuje jejich post\u0159ehy do textov\u00fdch
  pol\u00ed pod sn\u00edmky, p\u0159\u00edpadn\u011b vyb\u00edr\u00e1 \u017e\u00e1ky,
  aby se na z\u00e1pisu pod\u00edleli. (5 minut)\\n3. Interpreta\u010dn\u00ed f\u00e1ze.
  Na popis podobnost\u00ed a rozd\u00edl\u016f na fotografi\u00edch navazuje interpretace
  zachycen\u00fdch zm\u011bn s d\u016frazem na jejich historick\u00e9 p\u0159\u00ed\u010diny.
  Konkr\u00e9tn\u011b se \u017e\u00e1ci zam\u011b\u0159uj\u00ed na prom\u011bnu funkce
  domu, kter\u00fd je na fotografi\u00edch zachycen. Sna\u017e\u00ed se z fotografi\u00ed
  vyvodit z\u00e1v\u011bry o zm\u011bn\u00e1ch \u017eivota v obci. U\u010ditel moderuje
  diskuzi a zapisuje v\u00fdsledky diskuze do textov\u00e9ho pole. Podn\u011bcuje
  i dal\u0161\u00ed, detailn\u011bj\u0161\u00ed ot\u00e1zky. Je mo\u017en\u00e9 se
  pr\u016fb\u011b\u017en\u011b vracet k p\u0159edchoz\u00edm popis\u016fm fotografi\u00ed.
  U\u010ditel n\u00e1sledn\u011b vypl\u0148uje identifika\u010dn\u00ed \u00fadaje
  a ukl\u00e1d\u00e1 cvi\u010den\u00ed na server. (15 minut)\\n2. Analytick\u00e1
  f\u00e1ze. Na z\u00e1klad\u011b podn\u011bt\u016f ze t\u0159\u00eddy ozna\u010duje
  u\u010ditel (nebo vybran\u00fd \u017e\u00e1k) na sn\u00edmc\u00edch v aplikaci konkr\u00e9tn\u00ed
  objekty, kter\u00e9 se zm\u011bnily a kter\u00e9 z\u016fstaly stejn\u00e9. Ozna\u010den\u00e9
  body spole\u010dn\u011b dopl\u0148uj\u00ed textov\u00fdmi koment\u00e1\u0159i. U\u010ditel
  podn\u011bcuje ot\u00e1zky, kter\u00e9 z popisu fotografi\u00ed vypl\u00fdvaj\u00ed.
  M\u016f\u017ee se vracet k popis\u016fm na p\u0159edchoz\u00edch slidech a zahrnout
  je do diskuze. (5 minut)\\n4. Navazuj\u00edc\u00ed f\u00e1ze. Dle vlastn\u00ed preference
  u\u010ditel zapojuje pr\u00e1ci s prameny do dal\u0161\u00edho v\u00fdkladu.\\n\\nDoporu\u010den\u00fd
  postup pro skupinovou pr\u00e1ci ve t\u0159\u00edd\u011b\\n\\n1. \u00davodn\u00ed
  f\u00e1ze. \u017d\u00e1ci si ve skupin\u00e1ch s pomoc\u00ed lupy prohl\u00ed\u017eej\u00ed
  dvojici fotografi\u00ed. Zapisuj\u00ed sv\u00e9 post\u0159ehy do textov\u00fdch
  pol\u00ed pod sn\u00edmky. (5 minut)\\n3. Interpreta\u010dn\u00ed f\u00e1ze. Na
  popis fotografi\u00ed navazuje interpretace zachycen\u00fdch zm\u011bn s d\u016frazem
  na jejich historick\u00e9 p\u0159\u00ed\u010diny. Konkr\u00e9tn\u011b se \u017e\u00e1ci
  zam\u011b\u0159uj\u00ed na prom\u011bnu funkce domu, kter\u00fd je na fotografi\u00edch
  zachycen. Sna\u017e\u00ed se z fotografi\u00ed vyvodit z\u00e1v\u011bry o zm\u011bn\u00e1ch
  \u017eivota v obci. \u017d\u00e1ci ve skupin\u00e1ch diskutuj\u00ed a zapisuj\u00ed
  z\u00e1v\u011bry do textov\u00e9ho pole. U\u010ditel podn\u011bcuje i dal\u0161\u00ed,
  detailn\u011bj\u0161\u00ed ot\u00e1zky. P\u0159ipom\u00edn\u00e1, \u017ee je mo\u017en\u00e9
  se pr\u016fb\u011b\u017en\u011b vracet k p\u0159edchoz\u00edm popis\u016fm fotografi\u00ed.
  U\u010ditel instruuje \u017e\u00e1ky, aby zadali identifika\u010dn\u00ed \u00fadaje
  a ulo\u017eili cvi\u010den\u00ed. (5 minut)\\n2. Analytick\u00e1 f\u00e1ze. \u017d\u00e1ci
  ve skupin\u00e1ch na sn\u00edmc\u00edch v aplikaci ozna\u010duj\u00ed konkr\u00e9tn\u00ed
  objekty, kter\u00e9 se zm\u011bnily a kter\u00e9 z\u016fstaly stejn\u00e9. Ozna\u010den\u00e9
  body dopl\u0148uj\u00ed textov\u00fdmi koment\u00e1\u0159i. U\u010ditel proch\u00e1z\u00ed
  skupiny a podn\u011bcuje ot\u00e1zky, kter\u00e9 z popisu fotografi\u00ed vypl\u00fdvaj\u00ed.
  (5 minut)\\n4. Prezenta\u010dn\u00ed a diskuzn\u00ed f\u00e1ze. Jednotliv\u00e9
  skupiny prezentuj\u00ed p\u0159ed t\u0159\u00eddou sv\u00e9 z\u00e1v\u011bry. U\u010ditel
  moderuje diskuzi a vrac\u00ed se dle pot\u0159eby k fotografi\u00edm. (15 min)\\n5.
  Navazuj\u00edc\u00ed f\u00e1ze. Dle vlastn\u00ed preference u\u010ditel zapojuje
  v\u00fdstupy z pr\u00e1ce s prameny do dal\u0161\u00edho v\u00fdkladu.\\n\\nDoporu\u010den\u00fd
  postup pro dom\u00e1c\u00ed pr\u00e1ci\\n\\nDom\u00e1c\u00ed \u00fakol doporu\u010dujeme
  zad\u00e1vat t\u0159\u00edd\u011b, kter\u00e1 m\u00e1 ji\u017e zku\u0161enost s
  aplikac\u00ed z pr\u00e1ce v hodin\u011b. Vzd\u011bl\u00e1vac\u00ed dopad \u00fakolu
  se zvy\u0161uje, pokud mu v\u011bnujeme pozornost v navazuj\u00edc\u00ed hodin\u011b.
  U\u010ditel \u017e\u00e1k\u016fm ode\u0161le e-mailem odkaz na cvi\u010den\u00ed.
  D\u00edky zku\u0161enostem s aplikac\u00ed by se m\u011bli v prost\u0159ed\u00ed
  snadno zorientovat a plnit \u00fakoly dle zad\u00e1n\u00ed. U\u010ditel m\u016f\u017ee
  p\u0159edem zd\u016fraznit v\u00fdstupy, kter\u00e9 se mu jev\u00ed jako kl\u00ed\u010dov\u00e9
  a kter\u00e9 by m\u011bli \u017e\u00e1ci prezentovat na navazuj\u00edc\u00ed hodin\u011b.
  U\u010ditel tak m\u016f\u017ee zrychlen\u011b a spole\u010dn\u011b s celou t\u0159\u00eddou
  proj\u00edt cvi\u010den\u00ed p\u0159es dataprojektor po linii navr\u017een\u00e9
  v\u00fd\u0161e. Zam\u011b\u0159\u00ed se p\u0159itom zejm\u00e9na na prezenta\u010dn\u00ed
  a diskuzn\u00ed f\u00e1zi, v jejich\u017e r\u00e1mci mohou \u017e\u00e1ci p\u0159edstavit
  v\u00fdsledky dom\u00e1c\u00ed pr\u00e1ce.\\n\\nMo\u017en\u00e9 v\u00fdstupy\\n\\n\u00davodn\u00ed
  f\u00e1ze. \u017d\u00e1ci by si m\u011bli uv\u011bdomit, \u017ee budou pracovat
  s dv\u011bma fotografiemi t\u00e9ho\u017e m\u00edsta s \u010dasov\u00fdm rozd\u00edlem
  79 let.\\n\\nAnalytick\u00e1 f\u00e1ze. \u017d\u00e1ci si mohou na star\u0161\u00ed
  fotografii v\u0161imnout \u0159ady prvk\u016f (obchod, automobil, benzinov\u00e1
  \u010derpac\u00ed stanice, n\u00e1pisy, strom, lid\u00e9, reklamy aj.). N\u00e1pis
  vpravo (s p\u0159ekladem) Karlik\u00b4s Gasthaus (Hostinec p. Karlika), cedule Verkauf
  Molkerei, t\u00e4glich frische Vollmilch, Buttermilch, Rahm, Teebutter (Prodej ml\u00e9\u010dn\u00fdch
  v\u00fdrobk\u016f, denn\u011b \u010derstv\u00e9 plnotu\u010dn\u00e9 ml\u00e9ko,
  podm\u00e1sl\u00ed, smetana, m\u00e1slo), n\u00e1pis vlevo Gemischtwaren - Franz
  Karlik (Sm\u00ed\u0161en\u00e9 zbo\u017e\u00ed - Franz Karlik). \u017d\u00e1ci se
  soust\u0159ed\u00ed na vymizen\u00ed t\u011bchto detail\u016f. Do pop\u0159ed\u00ed
  se dost\u00e1v\u00e1 t\u00e9ma zm\u011bny funkce vyobrazen\u00e9ho domu a historick\u00fdch
  p\u0159\u00ed\u010din, kter\u00e9 k tomu vedly.\\n\\nInterpreta\u010dn\u00ed f\u00e1ze.
  \u017d\u00e1ci si uv\u011bdom\u00ed mno\u017estv\u00ed rozd\u00edl\u016f na fotografi\u00edch,
  kter\u00e9 podn\u011bcuj\u00ed dal\u0161\u00ed ot\u00e1zky: Pro\u010d se vyobrazen\u00e9
  m\u00edsto na fotografi\u00edch radik\u00e1ln\u011b zm\u011bnilo? Kde le\u017e\u00ed?
  M\u00e1 jeho geografick\u00e1 poloha n\u011bjakou spojitost s jeho prom\u011bnou?
  Horn\u00ed Vysok\u00e9 je mal\u00e1 obec v turisticky v\u00fdznamn\u00e9 lokalit\u011b
  \u010cesk\u00e9ho St\u0159edoho\u0159\u00ed. Hostinec s ubytov\u00e1n\u00edm pro
  hosty a obchod se sm\u00ed\u0161en\u00fdm zbo\u017e\u00edm byly pro podobn\u00e9
  obce p\u0159ed 2. sv\u011btovou v\u00e1lkou b\u011b\u017en\u00e9, benzinov\u00e1
  pumpa je sp\u00ed\u0161e zvl\u00e1\u0161tnost\u00ed. Focen\u00ed bylo na tehdej\u0161\u00ed
  dobu v\u00fdjime\u010dnou ud\u00e1lost\u00ed, proto se p\u0159ed domem shrom\u00e1\u017edila
  cel\u00e1 rodina. Po vys\u00eddlen\u00ed n\u011bmecky mluv\u00edc\u00edho obyvatelstva
  n\u00e1v\u0161t\u011bvn\u00edk\u016f obce citeln\u011b ubylo, popula\u010dn\u00ed
  \u00fabytek souvisel i s pozd\u011bj\u0161\u00ed urbanizac\u00ed. Proto se sn\u00ed\u017eila
  i ob\u010dansk\u00e1 vybavenost. Z obce se stalo v\u00edkendov\u00e9 s\u00eddlo
  chalup\u00e1\u0159\u016f z m\u011bsta.\\n\\nNavazuj\u00edc\u00ed f\u00e1ze. Na pr\u00e1ci
  s fotografi\u00ed m\u016f\u017ee u\u010ditel napojit celou \u0159adu t\u00e9mat
  dle vlastn\u00ed preference. Srovn\u00e1vac\u00ed kompozice m\u016f\u017ee poslou\u017eit
  jako dopln\u011bk v\u00fdkladu o \u010desko-n\u011bmeck\u00e9m sou\u017eit\u00ed
  p\u0159ed v\u00e1lkou, o d\u016fsledc\u00edch v\u00e1lky a nucen\u00e9m vys\u00eddlen\u00ed.
  Dot\u00fdk\u00e1 se v\u0161ak t\u00e9\u017e obecn\u011bj\u0161\u00edch d\u016fsledk\u016f
  modernizace (vylid\u0148ov\u00e1n\u00ed venkova, prom\u011bna jeho funkce atp.).
  \u017d\u00e1ci mohou na z\u00e1klad\u011b star\u00fdch fotografi\u00ed (nap\u0159.
  z rodinn\u00fdch zdroj\u016f) prov\u00e9st podobn\u00e9 srovn\u00e1n\u00ed ve vztahu
  k regionu.\"", "\"Poh\u00e1dkov\u00e1 babi\u010dka\\n\\nV \u00fater\u00fd 13. 9.
