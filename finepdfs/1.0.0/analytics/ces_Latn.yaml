  \u2013 WWW.BEZNOSKOVA.CZ\\n\\nPRAHA 10 NAVAZUJE SPOLUPR\u00c1CI S FAKULTN\u00cd
  NEMOCNIC\u00cd KR\u00c1LOVSK\u00c9 VINOHRADY\\n\\nStarosta m\u011bstsk\u00e9 \u010d\u00e1sti
  Praha 10 Martin Valovi\u010d a \u0159editel Fakultn\u00ed nemocnice Kr\u00e1lovsk\u00e9
  Vinohrady Jan Votava podepsali dne 7. 11. 2023 memorandum o hlub\u0161\u00ed spolupr\u00e1ci.
  Dokument navazuje na ned\u00e1vnou podporu m\u011bstsk\u00e9 \u010d\u00e1sti, jej\u00edm\u017e
  c\u00edlem byl rozvoj paliativn\u00ed p\u00e9\u010de v t\u00e9to nemocnici.\\n\\nSpolupr\u00e1ce
  se t\u00fdk\u00e1 n\u011bkolika oblast\u00ed. Zdaleka nejde jen o t\u00e9ma zahrnuj\u00edc\u00ed
  akutn\u00ed a chronick\u00e9 nemoci \u010di prevenci, ale v\u011bnuje se i agend\u011b
  soci\u00e1ln\u011b-zdravotn\u00edho pomez\u00ed. Zdravotnictv\u00ed je jedn\u00edm
  z p\u0159\u00edliv\u016f programov\u00e9ho prohl\u00e1\u0161en\u00ed Rady M\u010c
  Praha 10 pro roky 2022\u20132026.\\n\\n\u201eNav\u00e1z\u00e1n\u00ed spolupr\u00e1ce,
  je\u017e povede ke zlep\u0161en\u00ed kvality a dostupnosti p\u00e9\u010de pro ob\u010dany
  des\u00e1t\u00e9 m\u011bstsk\u00e9 \u010d\u00e1sti, je logick\u00fdm krokem. Prevence,
  p\u00e9\u010de o seniory, paliativn\u00ed p\u00e9\u010de jsou aktu\u00e1ln\u00edmi
  t\u00e9maty, jejich\u017e v\u00fdznam bude v n\u00e1sleduj\u00edc\u00edch letech
  nar\u016fstat. Dne\u0161n\u00ed podpis pova\u017euji za za\u010d\u00e1tek zdrav\u00e9
  spolupr\u00e1ce mezi Prahou 10 a Fakultn\u00ed nemocnic\u00ed Kr\u00e1lovsk\u00e9
  Vinohrady,\\\" vyjmenovala d\u016fvody, kter\u00e9 vedly k podpisu memoranda starosta
  Martin Valovi\u010d.\\n\\n\u0160pi\u010dkov\u00e9 l\u00e9ka\u0159sk\u00e9 za\u0159\u00edzen\u00ed\\nFakultn\u00ed
  nemocnice Kr\u00e1lovsk\u00e9 Vinohrady je jednak nejv\u011bt\u0161\u00edm poskytovatelem
  zdravotnick\u00fdch slu\u017eeb v Praze 10, jednak jde o \u0161pi\u010dkov\u00e9
  l\u00e9ka\u0159sk\u00e9 za\u0159\u00edzen\u00ed prov\u00e1zan\u00e9 s III. l\u00e9ka\u0159skou
  fakultou Univerzity Karlovy, specializuj\u00edc\u00ed se mimo jin\u00e9 na traumatologii
  nebo kardiologie. Sou\u010d\u00e1st\u00ed nemocnice je nav\u00edc komplexn\u00ed
  onkologick\u00e9 centrum. M\u00edstn\u00ed nemocnice rovn\u011b\u017e zaji\u0161\u0165uje
  l\u00e9ka\u0159skou pohotovostn\u00ed slu\u017ebu nejen pro des\u00e1tou m\u011bstskou
  \u010d\u00e1st. \u201eMemorandum vn\u00edm\u00e1me jako zcela p\u0159irozen\u00fd
  v\u00fdvoj na\u0161\u00ed vz\u00e1jemn\u00e9, sousedsk\u00e9 spolupr\u00e1ce: Tu
  budeme nad\u00e1le prohlubovat a zlep\u0161ovat pro maxim\u00e1ln\u00ed spokojenost
  pacient\u016f z Prahy 10,\\\" komentuje podpis memoranda \u0159editel Fakultn\u00ed
  nemocnice Kr\u00e1lovsk\u00e9 Vinohrady MUDr. Jan Votava.\\n\\nPodpora paliativn\u00ed
  p\u00e9\u010de\\nV neposledn\u00ed \u0159ad\u011b se nemocnice zam\u011b\u0159uje
  na paliativn\u00ed medic\u00ednu, tedy nesm\u00edrn\u011b d\u016fle\u017eit\u00fd
  obor zdravotn\u00ed p\u00e9\u010de, kter\u00fd se zab\u00fdv\u00e1 kvalitou \u017eivota
  nevyl\u00e9\u010diteln\u011b nemocn\u00fdch. \u201ePraha 10 rozvoj tohoto oboru
  podporuje na n\u011bkolika \u00farovn\u00edch. V minulosti jsme p\u016fl milionem
  korun podporili rozvoj t\u00e9to p\u00e9\u010de ve vinohradsk\u00e9 fakultn\u00ed
  nemocnici, z\u00e1rove\u0148 spolupracujeme s neziskov\u00fdm sektorem poskytuj\u00edc\u00edm
  soci\u00e1ln\u00ed slu\u017eby. Spole\u010dn\u011b s kolegy usiluj\u00ed o to, aby
  Des\u00edtka byla solid\u00e1rn\u00ed a um\u011bla n\u011bjak\u00fdm zp\u016fsobem
  pomoci nevyl\u00e9\u010diteln\u011b nemocn\u00fdm a jejich bl\u00edzk\u00fdm,\\\"
  dodal z\u00e1v\u011brem m\u00edstostarosta David Ka\u0161par.\\n\\nSpolupr\u00e1ce
  zahrnuje n\u00e1sleduj\u00edc\u00ed oblasti:\\n- paliativn\u00ed p\u00e9\u010de,\\n-
  pomez\u00ed zdravotn\u00ed a soci\u00e1ln\u00ed p\u00e9\u010de,\\n- spole\u010dn\u00e1
  informa\u010dn\u00ed kampa\u0148 pro seniory o zdravotn\u00edch slu\u017eb\u00e1ch
  na \u00fazem\u00ed M\u010c Praha 10,\\n- elektronick\u00e9 zdravotnictv\u00ed (eHealth)
  zejm\u00e9na ve vztahu k senior\u016fm,\\n- realizace osv\u011btov\u00fdch akc\u00ed
  pro ve\u0159ejnost,\\n- rozvoj spolupr\u00e1ce a s\u00edtov\u00e1n\u00ed s ostatn\u00edmi
  akt\u00e9ry v oblasti zdravotnictv\u00ed na \u00fazem\u00ed Prahy 10.\\n\\nPS\u00cd/KO\u010cI\u010c\u00cd
  BES\u00cdDKA/SB\u00cdRKA\\nHeroldovy sady\\n\\nD\u00e1rky pro \u00fatulky m\u016f\u017eete
  p\u0159in\u00e1\u0161et ke strome\u010dku v oplocen\u00e9 \u010d\u00e1sti Heroldov\u00fdch
  sad\u016f.\\n\\nCO DAROVAT?\\nZv\u00ed\u0159ec\u00ed hra\u010dky, deky, pel\u00ed\u0161ky,
  vod\u00edtka nebo konzervy, granule, pi\u0161koty \u010di jin\u00e9 dobroty pro
  psy a ko\u010dky.\\n\\nMIKUL\u00c1\u0160 NA LED\u011a: BRUSLEN\u00cd A Z\u00c1BAVA
  S PRAHOU 10\\n\\nOp\u011bt se bl\u00ed\u017e\u00ed v\u00e1no\u010dn\u00ed \u010das
  a s n\u00edm spojen\u00e1 radost ze setk\u00e1n\u00ed s Mikul\u00e1\u0161em, \u010dertem
  a and\u011blem. Tentokr\u00e1t v\u0161ak budete m\u00edt jedine\u010dnou p\u0159\u00edle\u017eitost
  sportovat spole\u010dn\u011b s t\u011bmito t\u0159emi obl\u00edben\u00fdmi postavami
  na zimn\u00edm stadionu Icerink v P\u0159etluck\u00e9 ulici.\\n\\nOdbor \u0161kolstv\u00ed
  m\u011bstsk\u00e9 \u010d\u00e1sti Praha 10 ve spolupr\u00e1ci se zimn\u00edm stadionem
  Icerink p\u0159ipravil na 5. prosince mikul\u00e1\u0161sk\u00e9 bruslen\u00ed se
  vstupem pro ve\u0159ejnost zdarma. Tato rodinn\u00e1 akce nab\u00eddne d\u011btem
  i rodi\u010d\u016fm nezapomenuteln\u00fd z\u00e1\u017eitek. Bruslit se bude ve dvou
  \u010dasov\u00fdch bloc\u00edch trvaj\u00edc\u00edch 90 minut. Prvn\u00ed blok za\u010d\u00edn\u00e1
  v 15.00 hodin, po n\u011bm bude n\u00e1sledovat \u00faprava ledov\u00e9 plochy pro
  n\u00e1v\u0161t\u011bvn\u00edky druh\u00e9ho bloku, kter\u00fd za\u010dne v 16.45.\\n\\nNa
  konci ka\u017ed\u00e9ho bloku si mohou n\u00e1v\u0161t\u011bvn\u00edci u\u017e\u00edt
  kr\u00e1tk\u00e9 brusla\u0159sk\u00e9 vystoupen\u00ed Mikul\u00e1\u0161e, \u010derta
  a and\u011bla. Pro mal\u00e9 brusla\u0159e bude m\u00edt Mikul\u00e1\u0161 p\u0159ipravenou
  drobnou nad\u00edlku, co\u017e jist\u011b v\u0161echny pot\u011b\u0161\u00ed.\\n\\nCeloro\u010dn\u00ed
  bruslen\u00ed na Icerinku\\nZimn\u00ed stadion Icerink nab\u00edz\u00ed mo\u017enost
  ve\u0159ejn\u00e9ho bruslen\u00ed po cel\u00fd rok pro v\u0161echny v\u011bkov\u00e9
  kategorie. Atmosf\u00e9ru si m\u016f\u017eete u\u017e\u00edt na jedn\u00e9 ze dvou
  ledov\u00fdch ploch za doprovodu hudby. Krom\u011b voln\u00e9ho bruslen\u00ed jsou
  k dispozici lekce s instruktory pro ty, kte\u0159\u00ed cht\u011bj\u00ed zdokonalit
  sv\u00e9 brusla\u0159sk\u00e9 dovednosti.\\n\\nPro rodiny s d\u011btmi je p\u0159ipravena
  akce s n\u00e1zvem Family on Ice, kde bude omezen\u00fd po\u010det brusla\u0159\u016f
  a z\u00e1bavn\u00fd program veden\u00fd zku\u0161en\u00fdmi instruktory. Ti se postaraj\u00ed
  o vyuku j\u00edzdy na led\u011b pro d\u011bti i dosp\u011bl\u00e9.\\n\\nHokejov\u00ed
  nad\u0161enci a m\u00edrn\u011b pokro\u010dil\u00ed brusla\u0159i si mohou vyzkou\u0161et
  program Rodina s hokejkou pod veden\u00edm profesion\u00e1l\u016f, kter\u00fd je
  zam\u011b\u0159en na z\u00e1kladn\u00ed hokejov\u00e9 dovednosti a umo\u017en\u00ed
  i mini hokejov\u00fd z\u00e1pas pro \u010dleny rodiny.\\n\\nOdv\u00e1\u017en\u00ed
  si mohou vyzkou\u0161et \u201erybn\u00edkov\u00fd hokej\u201c na t\u0159ech h\u0159i\u0161t\u00edch
  s n\u00edzk\u00fdmi mini branckami, bez vystroje a s omezen\u00fdm po\u010dtem hr\u00e1\u010d\u016f.\\n\\n\u0160koly
  na led\u011b\\nD\u011bti a \u017e\u00e1ci ze \u0161kol Prahy 10 ji\u017e p\u011bt
  let nav\u0161t\u011bvuj\u00ed zimn\u00ed stadion Icerink, kde z\u00edsk\u00e1vaj\u00ed
  zku\u0161enosti od zn\u00e1m\u00fdch brusla\u0159\u016f Tom\u00e1\u0161e Vernera
  a Martina Hol\u00e9ho. B\u011bhem lekc\u00ed si osvoji pohyb na led\u011b, zdokonal\u00ed
  rovnov\u00e1hu a dr\u017een\u00ed t\u011bla a vytvo\u0159\u00ed si k bruslen\u00ed
  pozitivn\u00ed vztah. Nejlep\u0161\u00ed brusla\u0159i mohou rozv\u00edjet sv\u00e9
  dovednosti v Akademii Tom\u00e1\u0161e Vernera.\\n\\nKAM J\u00cdT NA DES\u00cdTCE
  O V\u00c1NOC\u00cdCH\\n\\nICERINK | P\u0159etluck\u00e1 3422/23 | Stra\u0161nice\\n6:00\u201300:30
  | rezerva\u010dn\u00ed syst\u00e9m | dosp\u011bl\u00ed 200,\u2013 / d\u00edt\u011b
  170,\u2013\\nwww.icerink.cz\\n\\nZimn\u00ed stadion HASA | S\u00e1mov\u00e1 1 |
  Vr\u0161ovice\\nPO\u2013ST 9\u201311 | \u010cT 9\u201311:30 | PA 10:30\u201312:30
  | SO 9\u201311, 16\u201318 | NE 10\u201312\\n100,\u2013 / osoba\\nwww.hotelhasa.cz/zimni-stadion\\n\\nHC
  Slavia Praha | Vladivostock\u00e1 1460/10 | Vr\u0161ovice\\n27. 12. a 28. 12. 12\u201313:30
  | zdarma\\nwww.hc-slavia.cz\\n\\nGutovka | Gutova 39 | Stra\u0161nice\\nPO\u2013P\u00c1
  15\u201317 | SO\u2013NE 10\u201321 | na 2 hod. dosp\u011bl\u00ed 110,\u2013 / d\u00edt\u011b
  90,\u2013 | cel\u00fd den dosp\u011bl\u00ed 360,\u2013 / d\u00edt\u011b 260,\u2013\\n\\nHTC
  Praha Arena | Slu\u017eeb 3451/3A | Stra\u0161nice\\nSoboty 13:30\u201315:30 + 24.
  12. 8:30\u201311:30\\nMikul\u00e1\u0161sk\u00e1 5. 12. od 15:45 | pro celou rodinu
  150,\u2013\\nwww.htcpraha.cz\\n\\nRadnice Prahy 10 se z rozhodnut\u00ed ODS, TOP
  09, a dokonce i koalice Vlasta definitivn\u011b p\u0159est\u011bhovala. Radn\u00ed
  si jako nov\u00e9 s\u00eddlo vybrali lukrativn\u00ed a velmi drah\u00e9 prostory
  Vinice Business Center ve Stra\u0161nic\u00edch. P\u0159itom sou\u010d\u00e1st\u00ed
  managementu firmy, kter\u00e1 budovu vlastn\u00ed, je i spoluz\u00e1k sou\u010dasn\u00e9ho
  starosty Martina Valo\u0161ice (ODS). P\u0159esto, \u017ee na rekonstrukci radnice
  je st\u00e1le platn\u00e9 stavebn\u00ed povolen\u00ed, \u017eadn\u00e9 kroky k jej\u00ed
  oprav\u011b se ned\u011blaj\u00ed. Budova Vlasty tak bude ch\u00e1trat stejn\u011b
  jako nedalek\u00fd Eden.\\n\\nKdo zaplat\u00ed drah\u00fd n\u00e1jem radnice, kdy\u017e
  Praha 10 nem\u00e1 ani na opravu t\u00e9 sou\u010dasn\u00e9? Bohu\u017eel to zaplat\u00ed
  ob\u010dan\u00e9, a nav\u00edc to budou \u010dasto ti nejznanej\u0161\u00ed. Radn\u00ed
  potichu zdra\u017euj\u00ed v\u0161e, co mohou. Nejd\u0159\u00edve zcela zru\u0161ili
  podporu d\u011btem ve \u0161kol\u00e1ch, a rodi\u010de si tak za ly\u017ea\u0159sk\u00e9
  kurzy a \u0161koly v p\u0159\u00edrod\u011b p\u0159iplat\u00ed n\u011bkolik tis\u00edc
  nav\u00edc. N\u00e1sledovalo nav\u00fd\u0161en\u00ed n\u00e1jemn\u00e9ho organizac\u00edm
  v z\u00e1jmu obce, jako jsou rodinn\u00e1 centra, klubovny, potravinov\u00e9 banky
  a dal\u0161\u00ed o neuv\u011b\u0159iteln\u00fdch 150 %. A nyn\u00ed dost\u00e1vaj\u00ed
  n\u00e1jemn\u00edci m\u011bstsk\u00fdch byt\u016f dopisy se zdra\u017een\u00edm
  o t\u00e9m\u011b\u0159 20 %.\\n\\nODS, TOP 09 a koalice Vlasta se chovaj\u00ed jak
  na dob\u00fdv\u00e1n\u00ed \u00fazem\u00ed, nebavi se s lidmi ani s opozic\u00ed.
  Developersk\u00e9 projekty jedou jako nikdy p\u0159edt\u00edm a na posledn\u00ed
  zastupitelstv\u00ed p\u0159i\u0161lo protestovat v\u00edce ne\u017e dvacet spolobu\u010dan\u016f.
  Napi\u0161te mi na firstname.lastname@example.org, porveme se za v\u00e1s!\\n\\n\u2014
  Ing. Petr Bene\u0161\\nzastupitel, Pir\u00e1ti\\n\\nNa konci prvn\u00edho povolebn\u00edho
  roku m\u00e1me jasno ve v\u00fdsledc\u00edch i priorit\u00e1ch v oblasti \u017eivotn\u00edho
  prost\u0159ed\u00ed na Praze 10. Resum\u00e9 2023: Probehla revitalizace parku Na
  Solidarit\u011b (severn\u00ed \u010d\u00e1st), kter\u00e9 si nejen my velmi pova\u017eujeme!
  Jsem r\u00e1d, \u017ee byla v nejkrat\u0161\u00edm mo\u017en\u00e9m term\u00ednu
  dokon\u010dena. V\u00fdznamn\u00e9 jsme se v\u011bnovali Male\u0161ick\u00e9mu parku.
  Zasadil jsem se o opravu po\u0161kozen\u00fdch teras a provoz vodn\u00ed kask\u00e1dy.
  P\u0159ipravujeme koncep\u010dn\u00ed zkvalitn\u011bn\u00ed spr\u00e1vy ve\u0159ejn\u00e9
  zelen\u011b, pl\u00e1n nov\u00fdch stromor\u00e1d\u00ed a posilujeme roli adapta\u010dn\u00edch
  opat\u0159en\u00ed na zm\u011bnu klimatu.\\n\\nV r\u00e1mci z\u00e1konn\u00e9ho
  procesu posuzov\u00e1n\u00ed vliv\u016f na \u017eivotn\u00ed prost\u0159ed\u00ed
  (EIA) se Rada M\u010c vyjad\u0159uje ke v\u0161em zam\u011b\u0159\u016fm a uplat\u0148ovan\u00fdm
  po\u017eadavk\u016fm na kompenza\u010dn\u00ed opat\u0159en\u00ed jsme garanty v
  ochran\u011b zdrav\u00ed a kvality \u017eivota ob\u010dan\u016f. Uplatnili jsme
  p\u0159ipom\u00ednky ke krajin\u00e1\u0159sk\u00e9 studii Trojmez\u00ed.\\n\\nPriority
  2024: Investi\u010dn\u00edmi prioritami jsou v m\u00e9 radni\u010dn\u00ed gesci
  projekt na revitalizaci parku Na Solidarit\u011b (ji\u017en\u00ed \u010d\u00e1st),
  dal\u0161\u00ed \u00fapravy nov\u011b pojmenovan\u00e9ho parku Ruth Bondyov\u00e9
  (d\u0159\u00edve Pod Rapidem) a v\u00fdznamn\u00e9 a d\u0159\u00edve upozd\u011bn\u00e9
  opravy d\u011btsk\u00fdch h\u0159i\u0161\u0165, sportovi\u0161\u0165 a agility nap\u0159\u00ed\u010d
  Des\u00edtkou. Provozn\u011b se zam\u011b\u0159\u00edme na v\u00fd\u0161\u0161\u00ed
  kvalitu \u00faklidu ulic a pe\u010di o lavi\u010dky. Tradi\u010dn\u011b podpo\u0159\u00edme
  zapojov\u00e1n\u00ed ve\u0159ejnosti, environment\u00e1ln\u00ed osv\u011btu a udr\u017eitelnost.
  P\u0159ej\u00ed klidn\u00fd advent, kr\u00e1sn\u00e9 v\u00e1no\u010dn\u00ed sv\u00e1tky
  a pohodov\u00fd konec roku.\\n\\n\u2014 Ing. Milan Mar\u0161\u00e1lek\\nzastupitel,
  VLASTA a STAN s podporou KDU-\u010cSL\\n\\nNep\u0159ijemn\u00e9 p\u0159ekvapen\u00ed
  si nachystala koalice ODS, TOP 09, Vlasta, STAN a KDU-\u010cSL pro ob\u010dany Prahy
  10 na sv\u00e9m zased\u00e1n\u00ed 21. z\u00e1\u0159\u00ed, kde rozhodla o zv\u00fd\u0161en\u00ed
  n\u00e1jemn\u00e9ho v m\u011bstsk\u00fdch byt\u00edch. Nov\u011b tak jejich obyvatel\u00e9
  zaplat\u00ed za metr \u010dtvere\u010dn\u00ed a\u017e 165 korun. Radn\u00ed se neobte\u017eovali
  tento krok, kter\u00fd je pro mnoh\u00e9 ob\u010dany, jich\u017e se t\u00fdk\u00e1,
  z\u00e1sadn\u00ed, projednat na zastupitelstvu, ani se samotn\u00fdmi ob\u010dany.
  A zjevn\u011b je netr\u00e1pi ani v\u0161udyp\u0159\u00edtomn\u00e9 zdra\u017eov\u00e1n\u00ed,
  s n\u00edm\u017e se na\u0161e zem\u011b pot\u00fdk\u00e1.\\n\\nZ pohledu pr\u00e1va
  se ned\u00e1 postupu radn\u00edch p\u0159\u00edli\u0161 co vytknout, nicm\u00e9n\u011b
  pr\u00e1vo by m\u011blo b\u00fdt minimem mor\u00e1lky, a ta se z cel\u00e9 v\u011bci
  bohu\u017eel vyt\u00e1\u010d\u00ed. K \u010demu je argument, \u017ee i vy\u0161\u0161\u00ed
  n\u00e1jemn\u00e9 v obecn\u00edm bytu je st\u00e1le ni\u017e\u0161\u00ed ne\u017e
  n\u00e1jemn\u00e9 komer\u010dn\u00ed, tomu, kdo na n\u011bj proste a jednodu\u0161e
  u\u017e nebude m\u00edt pen\u00edze, a nav\u00edc m\u011bstsk\u00fd byt kv\u016fli
  t\u011bm soukrom\u00fdm neodpov\u00eddaj\u00ed?\\n\\nZastupitel\u00e9 ANO s t\u00edmto
  p\u0159\u00edstupem, kter\u00fd nem\u00e1 s poskytov\u00e1n\u00edm dostupn\u00e9ho
  bydlen\u00ed soci\u00e1ln\u011b slab\u00fdm nic spo\u010dle\u0148n\u00e9ho, rozhodn\u011b
  nesouhlas\u00ed a mohokr\u00e1t se proti n\u011bmu vymezili. Na prosincov\u00e9m
  zastupitelstvu budeme po\u017eadovat, aby zastupitelstvo odm\u00edtlo takto razantn\u00ed
  nav\u00fd\u0161en\u00ed.\\n\\nP\u0159esto mi dovolte, abych v\u00e1m i v t\u00e9to
  nehled\u011b dob\u011b za zastupitele hnut\u00ed ANO pop\u0159\u00e1la klidn\u00e9
  pro\u017eit\u00ed sv\u00e1tk\u016f v\u00e1no\u010dn\u00edch a \u00fasp\u011b\u0161n\u00fd
  rok 2024.\\n\\n\u2014 JUDr. Radmila Kleslov\u00e1\\nzastupitelka, ANO 2011\\n\\nZ
  oblasti Vr\u0161ovic v posledn\u00ed dob\u011b st\u00e1le \u010dast\u011bji zazn\u00edvaj\u00ed
  obavy z developersk\u00fdch pl\u00e1n\u016f.\\n\\nNejedn\u00e1 se jen o osud budovy
  administrativn\u00edho are\u00e1lu Vlasta, odkud se v sou\u010dasn\u00e9 dob\u011b
  st\u011bhuj\u00ed \u00fa\u0159ady pry\u010d, ale i o p\u0159ilehl\u00e9 kulturn\u00ed
  d\u016fm Eden, budovu tov\u00e1rny Koh-i-noor, Chemapolu a celou oblast pod\u00e9l
  trat\u011b sm\u011brem k Boti\u010di. Nam\u00edsto Edenu developer navrhuje dva
  bytov\u00e9 domy, nam\u00edsto budovy Chemapolu m\u00e1 podle pl\u00e1n\u016f vyr\u016fst
  14 nov\u00fdch dom\u016f, nam\u00edsto parku v ulici Magnitogorsk\u00e1 pak m\u00e1
  vyr\u016fst kapacitn\u00ed polyfunk\u010dn\u00ed d\u016fm a\u017e o deseti patrech.
  Mysl\u00edm tak\u00e9, \u017ee p\u0159es nej\u00fa\u0159nej\u0161\u00ed proklamace
  je dnes u\u017e t\u00e9m\u011b\u0159 jist\u00e9, \u017ee se \u00da\u0159ad M\u010c
  Praha 10 do budovy Vlasta nevr\u00e1t\u00ed. Je to podle m\u00e9ho n\u00e1zoru \u0161koda,
  stejn\u011b jako st\u00e1le pravd\u011bpodobn\u011bj\u0161\u00ed demolice budovy.
  Ptal jsem se proto na posledn\u00edm zastupitelstvu starosty Valo\u0161ice, zda
  m\u00e1 jako architekt alespo\u0148 v hlav\u011b ucelenou p\u0159edstavu, jak\u00fdm
  zp\u016fsobem se s celou zm\u00edn\u011bnou oblast\u00ed nalo\u017e\u00ed.\\n\\nNejsme
  jako hnut\u00ed SPD a priori proti nov\u00e9 v\u00fdstavb\u011b ani n\u00e1hrad\u011b
  st\u00e1vaj\u00edc\u00edch budov za modern\u00ed stavby. Ve\u0159ejnost si v\u0161ak
  zaslou\u017e\u00ed o projekt podobn\u00e9ho rozsahu, kdy uprost\u0159ed Vr\u0161ovic
  m\u00e1 vzniknout tak\u0159ka nov\u00e1 m\u011bstsk\u00e1 \u010dtvr\u0165, ucelen\u00e9
  informace. Z odpov\u011bd\u00ed panu starosty a kus\u00fdch informac\u00ed pos\u00edb\u0159an\u00fdch
  na internetu se v\u0161ak nemohu zbavit dojmu, \u017ee se n\u011bco chyst\u00e1,
  jen n\u00e1m nikdo nechce otev\u0159en\u011b \u0159\u00edci co.\\n\\n\u2014 Mgr.
  Josef Neru\u0161il\\nzastupitel, SPD, Trikolora a NK pro Prahu 10\\n\\nV\u00e1\u017een\u00ed
  spoluob\u010dan\u00e9, s bl\u00edzc\u00edmi se v\u00e1no\u010dn\u00edmi sv\u00e1tky
  vych V\u00e1m cht\u011bl popr\u00e1t hodn\u011b \u0161t\u011bst\u00ed, klidu a pohody.
  Z\u00e1rove\u0148 V\u00e1m p\u0159eji, a\u0165 rok 2024 prob\u00edh\u00e1 podle
  Va\u0161ich nejs k\u00fdrstej\u0161\u00edch p\u0159\u00e1n\u00ed.\\n\\nZa sebe mus\u00edm
  up\u0159\u00edmn\u011b p\u0159iznat, \u017ee m\u011b se u\u017e v\u00e1no\u010dn\u00ed
  d\u00e1rky splnil \u2013 \u00farad m\u011bstsk\u00e9 \u010d\u00e1sti se kone\u010dn\u011b
  p\u0159est\u011bhoval do nov\u00fdch prostor na Vinici. Nov\u00e9 kancel\u00e1\u0159e
  jsou na mnohem vy\u0161\u0161\u00ed kvalitativn\u00ed \u00farovni a jsou i dostate\u010dn\u011b
  reprezentativn\u00ed a praktick\u00e9 pro v\u0161echny, kte\u0159\u00ed si mus\u00ed
  na \u00fa\u0159ad\u011b cokoliv vy\u0159\u00eddit. Nejen za m\u011bstnictv\u00edm
  \u00fa\u0159adu, ale i n\u00e1v\u0161t\u011bvn\u00edk\u016fm nav\u00edc nov\u011b
  slou\u017e\u00ed samoobslu\u017en\u00e1 j\u00eddelna v suter\u00e9nu.\\n\\nZp\u011btn\u011b
  se V\u00e1m omlouv\u00e1m za p\u0159\u00edpadn\u00e9 komplikace s provozem \u00fa\u0159adu
  b\u011bhem t\u011bch n\u011bkolika t\u00fddn\u016f, kdy \u010d\u00e1st \u00fa\u0159edn\u00edk\u016f
  pracovala na Vr\u0161ovicke a \u010d\u00e1st Na Vinici. Ne p\u0159eprav\u00e1m se
  \u0159\u00edk\u00e1, \u017ee je lep\u0161\u00ed vyho\u0159et ne\u017e se stehovat.
  Ale zv\u00e1dli jsme to! Vy i j\u00e1 si bezpe\u010dn\u011b velmi rychle zvykneme
  na nov\u00fd standard, zejm\u00e9na kdy\u017e jde o prostory kvalitn\u011bj\u0161\u00ed
  a n\u00e1v\u0161t\u011bvn\u00edky p\u0159\u00e1tel\u0161t\u011bj\u0161\u00ed.\\n\\nPodle
  m\u00e9ho n\u00e1zoru je radnice i l\u00e9pe dopravn\u011b dostupn\u00e1.\\n\\nDouf\u00e1m,
  \u017ee kvalita prost\u0159ed\u00ed ovlivn\u00ed v tom dobr\u00e9m i v\u00fdkon
  \u00fa\u0159adu a budeme zvl\u00e1dat v\u0161e s \u00fasm\u011bvem a nadhledem k
  Va\u0161\u00ed spokojenosti.\\n\\nNakonec bych cht\u011bl prozradit alespo\u0148
  jedno z m\u00fdch p\u0159edsvezet\u00ed na rok 2024: Douf\u00e1m, \u017ee se mi
  kone\u010dn\u011b poda\u0159\u00ed prosadit za\u010d\u00e1tek opravy poloviny vily
  brat\u0159\u00ed \u010capk\u016f.\\n\\nDr\u017eme si tedy navz\u00e1jem palce, a\u0165
  se n\u00e1m d\u00e1\u0159\u00ed v roce 2024 v\u0161echny p\u0159ek\u00e1\u017eky
  s rezervou p\u0159ekon\u00e1vat a posunovat \u201eDes\u00edtku\u201c k lep\u0161\u00edmu
  m\u00edstu k \u017eivotu.\\n\\n\u2014 Ing. Tom\u00e1\u0161 Pek, S. E.\\nzastupitel,
  Spole\u010dn\u011b pro Prahu 10\\n\\nDOM\u00c1C\u00cd V\u00c1NO\u010cN\u00cd OZDOBY\\n\\nPou\u017eijte
  materi\u00e1l, kter\u00fd m\u00e1te doma.\\n\\n- Perni\u010dky a cukrov\u00ed\\n-
  D\u0159\u00edvka a p\u0159\u00edrodniny\\n- Flitry, kor\u00e1lky a b\u00ed\u017eu\\n-
  Origami\\n- Star\u00e9 knihy, mapy a noty\\n- Ruli\u010dky od v\u0161eho\\n- Pamlsky\\n-
  Improvizujte!\\n- Vlna, prov\u00e1zky, ma\u0161le\\n- Pap\u00edr\\n\\nKDY\u017d
  ULICE PROMLUV\u00cd\\n\\nRUSK\u00c1\\n\\nV minul\u00e9m \u010d\u00edsle jsme v r\u00e1mci
  t\u00e9to rubriky proch\u00e1zel\u00ed Ruskou ulic\u00ed a \u201enav\u0161t\u00edvili
  jsme\u201c zdej\u0161\u00ed pobo\u010dku M\u011bstsk\u00e9 knihovny v Praze, kterou
  zn\u00e1me jako D\u016fm \u010dten\u00ed. Dnes p\u0159ejdeme od kulturn\u00ed instituce
  k t\u011bm z oblasti zdravotnictv\u00ed. A hned dv\u011b si b\u011bhem podzimu p\u0159ipomn\u011bly
  v\u00fdznamn\u00e9 v\u00fdro\u010d\u00ed. Prvn\u00ed z nich je 3. l\u00e9ka\u0159sk\u00e1
  fakulta Univerzity Karlovy, kter\u00e1 s\u00eddl\u00ed na adrese Rusk\u00e1 87.
  Nenach\u00e1z\u00ed se v\u0161ak ji\u017e ve Vr\u0161ovic\u00edch, ale ve vinohradsk\u00e9
  \u010d\u00e1sti Prahy 10. Jak se p\u00ed\u0161e i na webov\u00fdch str\u00e1nk\u00e1ch
  t\u00e9to vysok\u00e9 \u0161koly: \u201eS\u00eddlo 3. l\u00e9ka\u0159sk\u00e9 fakulty
  UK se nach\u00e1z\u00ed ve vinohradsk\u00e9m zdravotnick\u00e9m are\u00e1lu, nejv\u011bt\u0161\u00edm
  are\u00e1lu l\u00e9ka\u0159sk\u00e9ho \u0161kolstv\u00ed, v\u00fdzkumu i praxe v
  cel\u00e9 \u010cesk\u00e9 republice. Are\u00e1l je krom\u011b 3. l\u00e9ka\u0159sk\u00e9
  fakulty tvo\u0159en Fakultn\u00ed nemocnic\u00ed Kr\u00e1lovsk\u00e9 Vinohrady,
  St\u00e1tn\u00edm zdravotn\u00edm \u00fastavem, Institutem pro postgradu\u00e1ln\u00ed
  vzd\u011bl\u00e1v\u00e1n\u00ed ve zdravotnictv\u00ed, St\u00e1tn\u00edm \u00fastavem
  pro kontrolu l\u00e9\u010div a St\u0159edn\u00ed zdravotnickou \u0161kolou. Se v\u0161emi
  t\u011bmito institucemi 3. l\u00e9ka\u0159sk\u00e1 fakulta spolupracuje v \u0159ad\u011b
  oblast\u00ed v\u00fduky, v\u00fdzkumu i l\u00e9ka\u0159sk\u00e9 praxe.\u201c\\n\\n3.
  L\u00c9KA\u0158SK\u00c1 FAKULTA UK SLAV\u00cd 70 LET\\n\\nNa 23. listopadu 2023
  p\u0159ipravila 3. l\u00e9ka\u0159sk\u00e1 fakulta slavnostn\u00ed shrom\u00e1\u017ed\u011bn\u00ed
  k 70. v\u00fdro\u010d\u00ed vzniku t\u00e9to instituce, kter\u00e9 bylo spojeno
  se Zlatou promoc\u00ed absolvent\u016f z roku 1973. Fakulta se hrd\u011b hl\u00e1s\u00ed
  k tradici l\u00e9ka\u0159sk\u00e9ho u\u010den\u00ed Univerzity Karlovy, kter\u00e9
  tvo\u0159ilo jeden ze \u010dty\u0159 z\u00e1kladn\u00edch sm\u011br\u016f p\u0159i
  zalo\u017een\u00ed univerzity v roce 1348, nicm\u00e9n\u011b jedn\u00edm z dal\u0161\u00edch
  d\u016fle\u017eit\u00fdch mezn\u00edk\u016f byl rok 1953. Tehdy Ministerstvo vysok\u00fdch
  \u0161kol rozd\u011blilo pra\u017eskou l\u00e9ka\u0159skou fakultu Univerzity Karlovy
  na t\u0159i samostatn\u00e9 fakulty \u2013 fakultu v\u0161eobecn\u00e9ho l\u00e9ka\u0159stv\u00ed
  (i se stomatologick\u00fdm sm\u011brem), fakultu d\u011btsk\u00e9ho l\u00e9ka\u0159stv\u00ed
  a l\u00e9ka\u0159skou fakultu hygienickou. Vznik samostatn\u00e9 L\u00e9ka\u0159sk\u00e9
  fakulty hygienick\u00e9 UK v roce 1953 p\u0159inesl v praxi n\u011bkter\u00e9 podstatn\u00e9
  zm\u011bny. M\u011bla sice z\u00e1kladn\u00ed l\u00e9ka\u0159sk\u00e9 zam\u011b\u0159en\u00ed,
  ale profilovala se jako specializovan\u00e1 fakulta na probl\u00e9my hygieny a prevence.
  V roce 1990 do\u0161lo k jej\u00edmu p\u0159ejmenov\u00e1n\u00ed na 3. l\u00e9ka\u0159skou
  fakultu UK, \u010d\u00edm\u017e bylo zv\u00fdrazn\u011bno jej\u00ed prim\u00e1rn\u00ed
  v\u0161eobecn\u00e9 zam\u011b\u0159en\u00ed. V sou\u010dasn\u00e9 dob\u011b pat\u0159\u00ed
  mezi v\u00fdukov\u00e9 z\u00e1kladny fakulty p\u0159edev\u0161\u00edm Fakultn\u00ed
  nemocnice Kr\u00e1lovsk\u00e9 Vinohrady, ale i dal\u0161\u00ed pra\u017esk\u00e9
  nemocnice a zdravotnick\u00e9 \u00fastavy.\\n\\nNA RUSK\u00c9 JE I ST\u0158EDN\u00cd
  ZDRAVOTNICK\u00c1 \u0160KOLA\\n\\nVe \u010dtvrtek 21. z\u00e1\u0159\u00ed 2023 slavila
  St\u0159edn\u00ed zdravotnick\u00e1 \u0161kola v Praze 10 - Vinohradech 70. v\u00fdro\u010d\u00ed
  sv\u00e9ho zalo\u017een\u00ed. Nach\u00e1z\u00ed se na adrese Rusk\u00e1 91.\\n\\nBudova
  \u0161koly byla postavena a zprovozn\u011bna v roce 1950 jako intern\u00e1t pro
  \u017e\u00e1ky pra\u017esk\u00fdch zdravotnick\u00fdch \u0161kol. V t\u00e9 dob\u011b
  bylo toti\u017e pro \u017e\u00e1ky t\u011bchto \u0161kol ubytov\u00e1n\u00ed v intern\u00e1tu
  povinn\u00e9.\\n\\nULICE ALTAJSK\u00c1 A ARCHANGELSK\u00c1\\n\\nR\u00e1d bych v\u0161ak
  dnes je\u0161t\u011b zm\u00ednil dv\u011b ulice, kter\u00e9 dostaly sv\u00e9 jm\u00e9no
  v dob\u011b, kdy se ve Vr\u0161ovic\u00edch pojmenov\u00e1valy ulice podle m\u011bst,
  st\u00e1t\u016f a zem\u011bpisn\u00fdch n\u00e1zv\u016f z \u00fazem\u00ed n\u011bkdej\u0161\u00edho
  Sov\u011btsk\u00e9ho svazu. Prvn\u00ed ulice se jmenuje Altajsk\u00e1 a ke sv\u00e9mu
  n\u00e1zvu p\u0159i\u0161la v roce 1952. Vznikla v\u0161ak ji\u017e po 2. sv\u011btov\u00e9
  v\u00e1lce. Jm\u00e9no dostala podle poho\u0159\u00ed, kter\u00e9 se nach\u00e1z\u00ed
  v centr\u00e1ln\u00ed Asii a rozprost\u00edr\u00e1 se na pomez\u00ed Ruska, Kazachst\u00e1nu,
  \u010c\u00edny a Mongolska. Druhou ulic\u00ed je Archangelsk\u00e1, kterou bychom
  na map\u00e1ch tak\u00e9 na\u0161li od roku 1952. Archangelsk je p\u0159\u00edstavn\u00ed
  m\u011bsto na severu evropsk\u00e9 \u010d\u00e1sti Ruska. Le\u017e\u00ed p\u0159i
  \u00fast\u00ed Severn\u00ed Dviny do B\u00edl\u00e9ho mo\u0159e. Toto m\u011bsto
  je z\u00e1rove\u0148 administrativn\u00edm centrem Archangelsk\u00e9 oblasti.\\n\\nDEMOLICE
  ARE\u00c1LU TESLY V ROCE 2015\\n\\nUlice Archangelsk\u00e1 a Altajsk\u00e1 spole\u010dn\u011b
  s ulicemi Kavkazsk\u00e1 a Vr\u0161ovick\u00e1 vytv\u00e1\u0159ej\u00ed obd\u00e9ln\u00edk,
  na kter\u00e9m s\u00eddlila od roku 1912 tov\u00e1rna obuvnick\u00e9 firmy \u0160vagera
  a Heller. Budovu projektoval architekt Jind\u0159ich Pollert. Pozd\u011bji vlastnila
  tato firma obchodn\u00ed zna\u010dku Helia. Od roku 1925 d\u011blala sv\u00e9 s\u00eddlo
  firma Kanold a spol., kter\u00e1 vyr\u00e1b\u011bla smetanov\u00e9 bonbony. Tehdy
  se v\u0161ak je\u0161t\u011b nenach\u00e1zela na Vr\u0161ovick\u00e9 ulici, ale
  na trase Kr\u00e1le Ji\u0159\u00edho. Od roku 1950 zde fungovala pobo\u010dka stra\u0161nick\u00e9
  tov\u00e1rny \u2013 n\u00e1rodn\u00edho podniku Tesla. V prosinci 2014 byly zah\u00e1jeny
  demoli\u010dn\u00ed pr\u00e1ce tohoto are\u00e1lu a po nich n\u00e1sledovala samotn\u00e1
  v\u00fdstavba projektu 4Block. Tento bytov\u00fd komplex zkolaudovala developersk\u00e1
  skupina Crestyl v kv\u011btnu 2017. Autorem cel\u00e9 stavby byla architektonick\u00e1
  kancel\u00e1\u0159 David Chmelar architekti.\\n\\n\u2014 Michal Ezechel, kronik\u00e1\u0159
  M\u010c Praha 10\\n\\nHLAS JAKO CESTA K SOB\u011a\\n\\nM\u00e1 pracovn\u00ed dr\u00e1ha
  byla velmi klikat\u00e1 a pestr\u00fd. Teprve ned\u00e1vno jsem zjistila, \u017ee
  spad\u00e1m do kategorie multitalentovan\u00fdch lid\u00ed, pro kter\u00e9 nen\u00ed
  snadn\u00e9 a leckdy ani mo\u017en\u00e9 z\u016fstat cel\u00fd \u017eivot u jednoho
  oboru a \u00fazce se specializovat. Do roku 2011 jsem se pohybovala ve velice r\u016fzn\u00fdch
  prost\u0159ed\u00edch, poznala fungov\u00e1n\u00ed a pr\u00e1ci pro mnoho firem,
  v\u011bt\u0161inou v\u011bt\u0161\u00edch zahrani\u010dn\u00edch spole\u010dnost\u00ed.
  Pracovala jsem na v\u0161ech mo\u017en\u00fdch pozic\u00edch, od asistentky, specialistky
  n\u00e1kupu, vedouc\u00ed mal\u00e9ho odd\u011blen\u00ed a\u017e po konzultantsk\u00e9
  pozice, nejprve v IT sf\u00e9\u0159e a posl\u00e9ze jako konzultantka n\u00e1boru
  (recruiter).\\n\\nZa\u010d\u00e1tky v HR\\nD\u00edky vstupu do zahrani\u010dn\u00ed
  person\u00e1ln\u00ed agentury se v roce 2011 za\u010dala odv\u00edjet \u00fapln\u011b
  jin\u00e1 etapa m\u00e9 kari\u00e9ry. V t\u00e9 dob\u011b jsem za\u010dala z\u00edsk\u00e1vat
  prvn\u00ed zku\u0161enosti v individu\u00e1ln\u00ed pr\u00e1ci s lidmi a v obchodn\u00edch
  jedn\u00e1n\u00edch s firmami, kter\u00e9 hledaly vysoce specializovan\u00e9 zam\u011bstnance.
  Tehdy se za\u010dal \u201erodit\u201c m\u016fj osobit\u00fd styl pr\u00e1ce s lidmi,
  kter\u00fd byl zalo\u017een\u00fd na hlubok\u00e9m pochopen\u00ed jejich individu\u00e1ln\u00edch
  pot\u0159eb a osobn\u00edch motivac\u00ed. \u201eRecruitmentu\u201c jsem z\u016fstala
  v\u011brn\u00e1 t\u00e9m\u011b\u0159 11 let. Pozd\u011bji jsem z agentury p\u0159e\u0161la
  na \u201evolnou nohu\u201c a pracovala jako \u00fasp\u011b\u0161n\u00fd, nez\u00e1visl\u00fd
  headhunter pro n\u011bkolik sv\u00fdch firemn\u00edch klient\u016f a pro si\u0165
  uchaze\u010d\u016f o pr\u00e1ci nebo lid\u00ed, kte\u0159\u00ed tou\u017eili po
  kari\u00e9rn\u00ed zm\u011bn\u011b.\\n\\nPr\u00e1ce s talenty\\nV roce 2018 p\u0159i\u0161el
  dal\u0161\u00ed vnit\u0159n\u00ed impuls, vol\u00e1n\u00ed po v\u00fdrazn\u00e9
  kari\u00e9rn\u00ed zm\u011bn\u011b. P\u0159ivedlo m\u011b to ke studiu talentov\u00e9
  metodiky, kter\u00e1 mi uk\u00e1zala, jak konkr\u00e9tn\u011b se li\u0161\u00ed
  jednotliv\u00e9 vlohy a talenty lid\u00ed, se kter\u00fdmi pracuji. \u017de se talenty
  a siln\u00e9 str\u00e1nky daj\u00ed m\u011b\u0159it, kategorizovat, d\u00e1 se s
  t\u00edm pracovat analyticky a tato data vyu\u017e\u00edt k optimalizaci nebo sestavov\u00e1n\u00ed
  efektivn\u011b spolupracuj\u00edc\u00edch firemn\u00edch pracovn\u00edch t\u00fdm\u016f
  i k hled\u00e1n\u00ed ur\u010dit\u00fdch typ\u016f lid\u00ed na konkr\u00e9tn\u00ed
  pracovn\u00ed pozici. Absolvovala jsem \u00fasp\u011b\u0161n\u011b certifikovan\u00fd
  v\u00fdcvik na pr\u00e1ci s talenty podle metody CliftonStrengths\u00ae a za\u0159\u00eddila
  tuto metodu do sv\u00e9 headhuntersk\u00e9 pr\u00e1ce i do individu\u00e1ln\u00edch
  slu\u017eeb pro sv\u00e9 klienty.\\n\\nKou\u010dink jako \u017eivotn\u00ed cesta\\nV
  roce 2019 jsem si roz\u0161\u00ed\u0159ila sv\u00e9 know-how p\u016flro\u010dn\u00edm
  akreditovan\u00fdm kou\u010dovac\u00edm v\u00fdcvikem u spole\u010dnosti Results
  @ Emotions, kter\u00fd jsem v roce 2020 zakon\u010dila mezin\u00e1rodn\u00ed certifikac\u00ed
  ACC od ICF. Od roku 2019 se pln\u011b v\u011bnuji kou\u010dinku. Zam\u011b\u0159uji
  se p\u0159ev\u00e1\u017en\u011b na hlas, komunikaci, osobit\u00fd mluven\u00fd a
  p\u011bveck\u00fd projev a spolupr\u00e1ci i na firemn\u00edch projektech jako kou\u010dka
  hlasu, talent\u016f a osobn\u00edho rozvoje.\\n\\nKlienti, kte\u0159\u00ed p\u0159ich\u00e1zej\u00ed,
  v\u011bt\u0161inou \u0159e\u0161\u00ed tato t\u00e9mata:\\n- Chci znovu za\u010d\u00edt
  zp\u00edvat.\\n- Chci se za\u010d\u00edt vyjad\u0159ovat sebev\u011bdom\u011b, bez
  tr\u00e9ny a stresu.\\n- Nel\u00edb\u00ed se mi m\u016fj hlas, pot\u0159ebuji prozkoumat
  jeho mo\u017enosti.\\n- Chci poznat s\u00e1m/sama sebe pomoc\u00ed sv\u00e9ho hlasu.\\n-
  Chci v\u00e9st/nahr\u00e1vat p\u016fsobiv\u00e9 prezentace/meditace a pot\u0159ebuji
  pracovat s hlasem v\u011bdom\u011b.\\n- P\u0159ipravuji se na d\u016fle\u017eitou
  prezentaci, pot\u0159ebuji profesion\u00e1ln\u00ed a citliv\u00e9 veden\u00ed.\\n-
  Pot\u0159ebuji podpo\u0159it v obdob\u00ed n\u00e1ro\u010dn\u00fdch zm\u011bn, hled\u00e1m
  citliv\u00e9ho a pevn\u00e9ho pr\u016fvodece-kou\u010de, kter\u00fd by m\u011b pomohl
  vracet k m\u00e9 p\u0159irozenosti a poskytl mi podporu na t\u00e9to cest\u011b.\\n\\nJak
  pracuji?\\nPracuji formou individu\u00e1ln\u00edch osobn\u00edch nebo online setk\u00e1n\u00ed,
  vyu\u017e\u00edv\u00e1m kou\u010dink, mentoring, pr\u00e1ci se siln\u00fdmi str\u00e1nkami
  a jejich uplatn\u011bn\u00edm v \u017eivot\u011b, t\u00e9m\u011b\u0159 20let\u00e9
  pracovn\u00ed zku\u0161enosti z firemn\u00edho byznysu, \u017eivotn\u00ed zku\u0161enosti
  a zralost \u010dlov\u011bka, kter\u00fd pro\u0161el mnoha peripetiemi pracovn\u00edmi
  i \u017eivotn\u00edmi a z\u00edskal ur\u010dit\u00fd nadhled a schopnost vid\u011bt
  a sly\u0161et v\u011bci v \u0161ir\u0161\u00edch souvislostech a m\u00e1 mnoho soucitu,
  proto\u017ee v\u00ed, \u017ee v\u0161echno je mo\u017en\u00e9 a ze v\u0161eho existuje
  cesta ven.\\n\\nObjev sv\u016fj hlas\\nPo\u0159\u00e1d\u00e1m tak\u00e9 skupinov\u00e1
  (networkingov\u00e1) setk\u00e1n\u00ed se zam\u011b\u0159en\u00edm otev\u0159\u00edt
  bezpe\u010dn\u00fd a l\u00e9\u010div\u00fd tv\u016fr\u010d\u00ed hudebn\u00ed prostor,
  v n\u011bm\u017e se ka\u017ed\u00fd m\u016f\u017ee projet podle sv\u00e9ho natur\u00e1lu,
  vyj\u00e1d\u0159it svou \u201eum\u011bleckou\u201c \u010d\u00e1st a sd\u00edlet
  s ostatn\u00edmi kousek sebe. Vrac\u00edm lidi zp\u00e1tky k d\u00e1n\u00fdm pro\u017eitk\u016fm
  ze spole\u010dn\u00e9ho zp\u00edv\u00e1n\u00ed, muzicov\u00e1n\u00ed a propojuv\u00e1n\u00ed
  se s ostatn\u00edmi. V\u00edce informac\u00ed o konkr\u00e9tn\u00edch akc\u00edch
  lze naj\u00edt na str\u00e1nce Objev sv\u016fj hlas \u2013 facebook.com/objevsvujhlas
  v sekci Ud\u00e1losti.\\n\\nPro\u010d jsem si vybrala t\u00e9ma hlasu?\\nT\u00e9ma
  vyj\u00e1d\u0159en\u00ed emoc\u00ed, vlastn\u00ed zranitelnosti a z\u00e1kladn\u00edch
  \u017eivotn\u00edch pot\u0159eb je sou\u010d\u00e1st\u00ed m\u00e9ho \u017eivotn\u00edho
  p\u0159\u00edb\u011bhu. Kdy\u017e jsem v roce 2016 onemocn\u011bla z\u00e1hadnou
  n\u011bkolikam\u011bs\u00ed\u010dn\u00ed bolest\u00ed hlavy, ke kter\u00e9 nebyl
  \u017e\u00e1dn\u00fd zjevn\u00fd d\u016fvod, zavedlo m\u011b zoufal\u00e9 hled\u00e1n\u00ed
  pomoci a\u017e do prost\u0159ed\u00ed alternativn\u00ed medic\u00edny. U\u017e p\u0159i
  prvn\u00edm setk\u00e1n\u00ed jsem dostala ot\u00e1zky, kter\u00e9 mi zd\u00e1nliv\u011b
  ned\u00e1valy smysl.\\n\\n\u201eKolik toho p\u0159ed ostatn\u00edmi skr\u00fdv\u00e1te?
  Jak\u00e1 dilemata jsou ve va\u0161em \u017eivot\u011b? Kolik se toho sna\u017e\u00edte
  vy\u0159e\u0161it sama ve sv\u00e9 hlav\u011b? Kolik bolest\u00ed a nev\u00fd\u010ditk\u00e1ch
  v\u011bc\u00ed si v sob\u011b nos\u00edte? Jste schopn\u00e1 ty v\u011bci sd\u00edlet,
  vyj\u00e1d\u0159it nahlas a komunikovat to s t\u011bmi, kter\u00fdch se to t\u00fdk\u00e1?\u201c
  Jen \u201eprost\u00fdm\u201c vyj\u00e1d\u0159en\u00edm toho, jak jsem v\u011bci
  skute\u010dn\u011b c\u00edtila, jak\u00e9 bolesti, strachy a obavy jsem si v sob\u011b
  nosila, jsem se hned uzdravila. Bolest byla pry\u010d. Za\u010dala jsem s up\u0159\u00edmnou
  komunikac\u00ed mezi sv\u00fdmi nejbli\u017e\u0161\u00edmi a m\u016fj nov\u00fd
  zp\u016fsob komunikace zp\u016fsobil velk\u00e9 zem\u011bt\u0159esen\u00ed v m\u00e9m
  osobn\u00edm \u017eivot\u011b. Cena, kterou jsem za vyj\u00e1d\u0159enou pravdu
  zaplatila, byla ale zcela adekv\u00e1tn\u00ed m\u00e9 \u00falev\u011b. D\u00edky
  tomuto procesu jsem se dostala na \u00fapln\u011b novou pracovn\u00ed cestu.\\n\\nNajdi,
  kdo jsi!\\nV t\u00e9 dob\u011b jsem si vyty\u010dila, \u017ee budu maxim\u00e1ln\u011b
  pravdiv\u00e1, v\u011brn\u00e1 podstat\u011b toho, kdo jsem, a postupn\u011b opust\u00edm
  v\u011bci, kter\u00e9 se mnou nelad\u00ed. K tomu jsem za\u010dala v\u00e9st i sv\u00e9
  klienty v individu\u00e1ln\u00ed \u010di skupinov\u00e9 spolupr\u00e1ci. Najdi,
  kdo jsi, a vyj\u00e1d\u0159i to! V\u0161echno bude jasn\u011bj\u0161\u00ed a \u017eiv\u011bj\u0161\u00ed.
  Cel\u00fd \u017eivot zp\u00edv\u00e1m, m\u00e1m absolutn\u00ed sluch, jsem intuitivn\u00ed
  a citliv\u00fd muzikant, dlouh\u00e9 roky studuji hlas a zp\u011bv, sama ob\u010das
  vystupuji jako \u0161anson\u00e9rka nebo rockerka. Zp\u00edv\u00e1m, hraji na n\u011bkolik
  hudebn\u00edch n\u00e1stroj\u016f, skl\u00e1d\u00e1m hudbu, p\u00ed\u0161u texty
  nebo b\u00e1sn\u011b. V\u0161echno, co um\u00edm, co jsou m\u00e9 talenty a v\u00e1sn\u011b,
  jsem spojila do role kou\u010dky a mentorky, kter\u00e1 vede lidi zp\u00e1tky k
  vn\u00edm\u00e1n\u00ed sv\u00e9ho hlasu, k pozornosti a vn\u00edmavosti ke sv\u00fdm
  emoc\u00edm a k sob\u011b a k pravdiv\u00e9mu vyj\u00e1d\u0159en\u00ed toho, kdo
  jsou.\\n\\nCo o mn\u011b \u0159\u00edkaj\u00ed klienti?\\nNej\u010dast\u011bji vyzdvihuj\u00ed
  schopnost empatie, napojen\u00ed se na klienta a zrcadlen\u00ed jeho pot\u0159eb,
  autentick\u00e9 vyjad\u0159ov\u00e1n\u00ed, opravdovost, schopnost p\u0159ij\u00edmat
  bez vyhr\u00e1vky, up\u0159\u00edmn\u00fd z\u00e1jem o druh\u00e9, vytvo\u0159en\u00ed
  bezpe\u010dn\u00e9ho, d\u016fv\u011brn\u00e9ho prostoru, kde se d\u00e1 tvorit,
  experimentovat, otev\u00edrat i hlub\u0161\u00ed t\u00e9mata a nach\u00e1zet nov\u00e9
  pohledy na v\u011bc, klid a pevnost.\\n\\nT\u011b\u0161\u00edm se, \u017ee se potk\u00e1m
  mo\u017en\u00e1 pr\u00e1v\u011b s v\u00e1mi, a\u0165 u\u017e na skupinov\u00e9m
  setk\u00e1n\u00ed, nebo p\u0159i osobn\u00ed konzultaci. Mou nejv\u011bt\u0161\u00ed
  radost\u00ed je vid\u011bt sv\u00e9 klienty rozkv\u00e9tat a uvol\u0148ovat se do
  svobody a napln\u011bn\u00e9ho \u017eivota.\\n\\nKONTAKT\\n\\nwww.marketadvarkova.cz\\ntel.:
  777 296 926\\ne-mail: email@example.com\\nfacebook.com/groups/magiehlasu\\n\\nKONTEJNERY
  NA OBJEMN\u00dd ODPAD\\n\\nDo kontejner\u016f lze odkl\u00e1dat v\u00fdhradn\u011b
  domovn\u00ed odpad objemn\u00e9ho charakteru \u2013 n\u00e1bytek, podlahov\u00e9
  krytiny, kovov\u00e9 odpady, zdravotn\u00ed keramika, zrcadla, ly\u017ee apod. Do
  kontejner\u016f nepat\u0159\u00ed nebezpe\u010dn\u00e9 odpady (v\u010d. lednicek,
  monitor\u016f, televizor\u016f, autobateri\u00ed apod.), pneumatiky, bioodpady a
  stavebn\u00ed odpad. Kontejnery je zak\u00e1z\u00e1no pou\u017e\u00edvat k odkl\u00e1d\u00e1n\u00ed
  odpad\u016f z podnikatelsk\u00e9 \u010dinnosti.\\n\\nK bezplatn\u00e9mu p\u0159ed\u00e1v\u00e1n\u00ed
  objemn\u00e9ho odpadu (i nebezpe\u010dn\u00e9ho) lze vyu\u017e\u00edt sb\u011brn\u00e9
  dvory hlavn\u00edho m\u011bsta Prahy, nap\u0159. v ul. U Plyn\u00e1rny, Tepl\u00e1rensk\u00e1,
  Zakryt\u00e1, Peruck\u00e1 nebo Male\u0161ick\u00e1 \u010d. 74. Ve sb\u011brn\u00fdch
  dvorech je otev\u0159eno v pond\u011bl\u00ed a\u017e p\u00e1tek od 8.30 do 18.00
  hodin a v sobotu od 8.30 do 15.00 hodin.\\n\\nKAM S V\u00c1NO\u010cN\u00cdM STROMKEM?\\n\\nSymbol
  v\u00e1no\u010dn\u00edch sv\u00e1tk\u016f, strome\u010dek, p\u0159edstavuje ji\u017e
  v obdob\u00ed p\u0159ed p\u0159\u00edchodem nov\u00e9ho roku velk\u00e9 mno\u017estv\u00ed
  odpadu, kter\u00e9 se mnohdy vyskytuje voln\u011b pohoven\u00fd n\u011bkde na chodn\u00edku
  \u010di v parku. Stejn\u011b jako v minul\u00fdch letech bude mo\u017en\u00e9 stromky
  odkl\u00e1dat p\u0159ed svozem n\u00e1dob na sm\u011bsn\u00fd odpad v jejich bl\u00edzkosti
  nebo tak\u00e9 k n\u00e1dob\u00e1m na t\u0159\u00edd\u011bn\u00fd odpad. Jejich
  postupn\u00fd odvoz zajist\u00ed m\u00edstn\u00ed svozov\u00e1 firma, a to a\u017e
  do konce \u00fanora. Mnohem lep\u0161\u00edm \u0159e\u0161en\u00edm je odstrojen\u00fd
  stromek odv\u00e9zt a p\u0159edat ve sb\u011brn\u00e9m dvore hlavn\u00edho m\u011bsta.
  P\u0159evzet\u00ed je bezplatn\u00e9. A je\u0161t\u011b p\u0159\u00ednosn\u011bj\u0161\u00ed
  je, pokud se takov\u00e1 mo\u017enost nab\u00edz\u00ed, stromek odstrojit a n\u00e1sledn\u011b
  se\u0161t\u011bpovat nebo roz\u0159ezat a vyu\u017e\u00edt na vlastn\u00ed zahrad\u011b,
  t\u0159eba jako z\u00e1klad z\u00e1honu anebo do kompostu.\\n\\n\u201eREUSE\u201c
  BYL \u00daSP\u011a\u0160N\u00dd\\n\\nVice ne\u017e 600 lid\u00ed nav\u0161t\u00edvilo
  v polovin\u011b z\u00e1\u0159\u00ed Reuse ned\u011bli v Z\u00e1b\u011bhlic\u00edch,
  kter\u00e1 se uskute\u010dnila na prostranstv\u00ed u obchodn\u00edho centra Cil
  v Topolov\u00e9 ulici. Akci zajistilo hlavn\u00ed m\u011bsto Praha ve spolupr\u00e1ci
  s m\u011bstskou \u010d\u00e1st\u00ed Praha 10.\\n\\nNosnou my\u0161lenkou po\u0159\u00e1d\u00e1n\u00ed
  t\u00e9to akce je \u201ed\u00e1t v\u011bcem druhou \u0161anci\u201c. Lze tak p\u0159ech\u00e1zet
  zbyto\u010dn\u00e9mu vzniku odpadu, proto\u017ee mnoho v\u011bc\u00ed, kter\u00e9
  se staly kv\u016fli dlouhodob\u00e9mu nepou\u017e\u00edv\u00e1n\u00ed \u010di \u201ezest\u00e1rnut\u00ed\u201c
  nepot\u0159ebn\u00fdmi, m\u016f\u017ee je\u0161t\u011b n\u011bjakou dobu poslou\u017eit
  n\u011bkomu jin\u00e9mu. Reuse aktivity jsou sou\u010d\u00e1st\u00ed tzv. cirkul\u00e1rn\u00ed
  ekonomiky, kter\u00e1 preferuje op\u011btovn\u00e9 vyu\u017eit\u00ed vyslou\u017eil\u00fdch
  v\u00fdrobk\u016f \u010di jejich recyklaci. V Praze 10 se reuse den uskute\u010dnil
  ji\u017e pot\u0159et\u00ed a op\u011bt byl o n\u011bj velk\u00fd z\u00e1jem. Naprostou
  v\u011bt\u0161inu donesen\u00fdch v\u011bc\u00ed z dom\u00e1cnosti p\u0159edstavovalo
  oble\u010den\u00ed, d\u00e1le knihy, kuchy\u0148sk\u00e9 n\u00e1doby \u010di kup\u00f3nov\u00e9
  dopl\u0148ky. Naprost\u00e1 v\u011bt\u0161ina byla na m\u00edst\u011b rozebrana.
  Zbyl\u00e9 p\u0159edm\u011bty byly v\u011bnov\u00e1ny soci\u00e1ln\u00edmu dru\u017estvu
  Diakonie Broumov.\\n\\nJAK SE ZBAVIT STAR\u00c9 PNEUMATIKY?\\n\\nHlavn\u00ed m\u011bsto
  Praha zavedlo v leto\u0161n\u00edm roce bezplatn\u00e9 p\u0159ed\u00e1v\u00e1n\u00ed
  pneumatik ve v\u0161ech sb\u011brn\u00fdch dvorech, tedy i v Praze 10, ve sb\u011brn\u00e9m
  dvore v ulici U Plyn\u00e1rny, a stejn\u011b tak v dal\u0161\u00edch bl\u00edzk\u00fdch
  dvorech \u2013 v ulic\u00edch Male\u0161ick\u00e1, Peruck\u00e1, Tepl\u00e1rensk\u00e1
  a Zakryt\u00e1 \u2013 je mo\u017en\u00e9 pneumatiky odevzdat bez poplatku. K odmitnut\u00ed
  p\u0159evzet\u00ed pneumatiky m\u016f\u017ee doj\u00edt v p\u0159\u00edpad\u011b,
  \u017ee s ohledem na odevzd\u00e1van\u00e9 mno\u017estv\u00ed a typ pneumatik lze
  m\u00edt pochybnost o tom, \u017ee poch\u00e1zej\u00ed z provozu vozidla fyzick\u00e9
  osoby. Stejn\u011b tak nelze p\u0159ijmat pneumatiky zne\u010di\u0161t\u011bn\u00e9
  \u010di v\u00fdrazn\u011b po\u0161kozen\u00e9. P\u0159ebr\u00e1n\u00ed pneumatik
  ve sb\u011brn\u00fdch dvorech prob\u00edh\u00e1 v re\u017eimu tzv. zp\u011btn\u00e9ho
  odb\u011bru na z\u00e1klad\u011b spolupr\u00e1ce hlavn\u00edho m\u011bsta Prahy
  se spole\u010dnost\u00ed GREEN Logistics CZ, kter\u00e1 ve\u0159ejn\u00e1 m\u00edsta
  zp\u011btn\u00e9ho odb\u011bru provozuje. Pneumatiky lze tak\u00e9 p\u0159ed\u00e1vat
  i na jin\u00fdch m\u00edstech, kde je zp\u011btn\u00fd odb\u011br zaveden, co\u017e
  jsou p\u0159edev\u0161\u00edm provozovny pneuservis\u016f a autoservis\u016f.\\n\\n|
