  archiv\\n\\nstehujemedesitku.cz\\ninfolinka: 267 093 666\\nfirstname.lastname@example.org\\n\\nK\u00c9\u017d
  BY KA\u017dD\u00dd Z N\u00c1S CHT\u011aL B\u00ddT \u010cLOV\u011aKEM DOBRE V\u00daLE,
  \u0158\u00cdK\u00c1 FAR\u00c1\u0158 ARTUR MATUSZEK\\n\\nKatolick\u00fd far\u00e1\u0159
  Artur Matuszek pe\u010de o vr\u0161ovickou farnost. Do n\u00ed spadaj\u00ed dva
  kostely, z nich\u017e jedn\u00edm je ikonick\u00fd kostel svat\u00e9ho V\u00e1clava
  na n\u00e1m\u011bst\u00ed Svatopluka \u010cecha. V rozhovoru jsme se dotkli toho,
  jak se li\u0161\u00ed atmosf\u00e9ra funkcionalistick\u00e9ho kostela od klasicist\u00e9ho,
  ale hlavn\u011b jsme si pov\u00eddali o adventu, v\u00e1no\u010dn\u00edm \u010dase
  a o tom, co d\u011blat, aby do spojen\u00e9 n\u00e1doby lidstv\u00ed po kapk\u00e1ch
  p\u0159ib\u00fdvalo dobro.\\n\\nPane far\u00e1\u0159i, lze podle v\u00e1s n\u011bjak
  pojmenovat tajemstv\u00ed V\u00e1noc?\\n\u0158ekl bych, \u017ee odpov\u011b\u010f
  je obsa\u017eena ji\u017e v samotn\u00e9 ot\u00e1zce, a to, \u017ee V\u00e1noce
  jsou tajemstv\u00edm nebo mysteriem, kdybychom pou\u017eili latinsk\u00e9 slovo.
  Ka\u017ed\u00fd rok dost\u00e1v\u00e1me p\u0159\u00edle\u017eitost toto tajemstv\u00ed
  o trochu v\u00edce poodhalit a pro\u017e\u00edt. Ve v\u00e1no\u010dn\u00edm p\u0159\u00edb\u011bhu
  B\u016fh nevystupuje jako n\u011bkdo vzd\u00e1len\u00fd, neur\u010dit\u00e9 n\u011bco
  kdesi vysoko, ale jako n\u011bkdo, kdo je tu s n\u00e1mi, s ka\u017ed\u00fdm z n\u00e1s.
  To vyjad\u0159uje narozen\u00ed Je\u017e\u00ed\u0161e Krista.\\n\\nZ\u00e1rove\u0148
  jsou V\u00e1noce pova\u017eov\u00e1ny za rodinn\u00e9 sv\u00e1tky. Da\u0159\u00ed
  se podle v\u00e1s lidem v dne\u0161n\u00ed usp\u00e1chan\u00e9 dob\u011b zpomalit
  a zam\u011b\u0159it se na ty nejbli\u017e\u0161\u00ed?\\n\\nV tom jsem takov\u00fd
  realistick\u00fd optimista. Ten realismus tkv\u00ed v tom, \u017ee zpomalit se moc
  ned\u00e1\u0159\u00ed, ale dopl\u0148uj\u00ed to o ten optimismus. To zam\u011b\u0159en\u00ed
  se na nejbli\u017e\u0161\u00ed tam je. Jsem p\u0159esv\u011bd\u010den\u00fd o tom,
  \u017ee ka\u017ed\u00fd \u010dlov\u011bk tou\u017e\u00ed l\u00e1sku d\u00e1vat,
  ale taky ji p\u0159ij\u00edmat, a rodina je pro v\u011bt\u0161inu z n\u00e1s t\u00edm
  nejp\u0159irozen\u011bj\u0161\u00edm m\u00edstem l\u00e1sky.\\n\\nMaj\u00ed podle
  v\u00e1s leto\u0161n\u00ed V\u00e1noce n\u011bjak\u00e9 specifick\u00e9 poselstv\u00ed?\\nKa\u017ed\u00e9
  V\u00e1noce maj\u00ed v\u017edy stejn\u00e9 poselstv\u00ed: \u201eSl\u00e1va na
  v\u00fdsostech Bohu a na zemi pokoj lidem dobr\u00e9 v\u016fle.\u201c Letos mi toto
  poselstv\u00ed p\u0159ipad\u00e1 obzvl\u00e1\u0161t aktu\u00e1ln\u00ed \u2013 k\u00e9\u017e
  by ka\u017ed\u00fd z n\u00e1s cht\u011bl b\u00fdt \u010dlov\u011bkem dobr\u00e9
  v\u016fle, aby se mohl \u0161\u00ed\u0159it pokoj na zemi, po\u010d\u00ednaje na\u0161imi
  rodinami a nejbli\u017e\u0161\u00edm okol\u00edm.\\n\\nPt\u00e1m se i proto, \u017ee
  posledn\u00ed roky jsou extr\u00e9mn\u011b turbulentn\u00ed. Stres z glob\u00e1ln\u00ed
  pandemie a nekonan\u00fdch lockdown\u016f vyst\u0159\u00eddal stres z n\u011bkolika
  konflikt\u016f. Co byste poradil lidem, kter\u00e9 zrovna tohle su\u017euje?\\nMy
  lid\u00e9 se mnohdy zat\u011b\u017eujeme v\u011bcmi, kter\u00e9 stejn\u011b nedok\u00e1\u017eeme
  ovlivnit nebo zm\u011bnit. Ale ka\u017ed\u00fd z n\u00e1s m\u016f\u017ee p\u0159isp\u011bt
  k n\u011b\u010demu dobr\u00e9mu a n\u011bco dobr\u00e9ho dok\u00e1zat alespo\u0148
  ve sv\u00e9m okol\u00ed.\\n\\nI toto kon\u00e1n\u00ed bude m\u00edt citeln\u00fd
  dopad, proto\u017ee lid\u00e9 a lidstvo jsou spojen\u00fdmi n\u00e1dobami. Kdy\u017e
  bude n\u011bkde po kapk\u00e1ch p\u0159ib\u00fdvat dobro, hladina dobra se bude
  zvy\u0161ovat celkov\u011b. To sice plat\u00ed i o zlu, ale k\u00e9\u017e by ka\u017ed\u00fd
  z n\u00e1s pokusil b\u00fdt \u010dlov\u011bkem dobr\u00e9 v\u016fle, p\u0159\u00edsp\u011bjeme
  t\u00edm k pokoji, po kter\u00e9m v\u0161ichni tou\u017e\u00edme.\\n\\nPosu\u0148me
  se k va\u0161\u00ed zku\u0161enosti s V\u00e1nocemi. Jak pro\u017e\u00edv\u00e1te,
  coby katolick\u00fd far\u00e1\u0159, obdob\u00ed adventu a V\u00e1noc?\\nAdvent
  a V\u00e1noce jsou takov\u00fdm nejsiln\u011bj\u0161\u00edm a pracovn\u011b nejr\u016fzn\u011bj\u0161\u00edm
  obdob\u00edm. Advent je pro lidi vyzvou k uspo\u0159\u00e1d\u00e1n\u00ed si v\u011bci
  ve sv\u00e9m \u017eivot\u011b, a pr\u00e1v\u011b p\u0159i tom m\u016f\u017ee far\u00e1\u0159
  pomoci. Proto se konaj\u00ed duchovn\u00ed obnovy, lid\u00e9 maj\u00ed v\u011bt\u0161\u00ed
  z\u00e1jem o zpov\u011b\u010f \u010di duchovn\u00ed rozhovor s kn\u011bzem. O V\u00e1noc\u00edch
  je m\u00fdm \u00fakolem umo\u017enit n\u00e1v\u0161t\u011bvn\u00edk\u016fm kostela,
  aby mohli pro\u017e\u00edt radost z v\u00edry a oslavit Boha.\\n\\nJak tedy v pr\u016fb\u011bhu
  takov\u00e9ho z\u00e1plachu vypad\u00e1 v\u00e1\u0161 \u0160t\u011bdr\u00fd den
  a \u0160t\u011bdr\u00fd ve\u010der?\\n\\nTen den se pod\u0159izuje m\u00fdm povinnostem
  v kostele. Ji\u017e odpoledne m\u00edv\u00e1me ve farnosti m\u0161\u00ed svatou
  pro rodiny s d\u011btmi. Po jej\u00edm konci m\u00e1m \u010das p\u0159ipravit si
  svou \u0161t\u011bdrove\u010dern\u00ed ve\u010de\u0159i. Sna\u017e\u00edm se, aby
  m\u011bla v\u0161echny n\u00e1le\u017eitosti a p\u0159il\u0161\u00ed se nel\u00ed\u0161ila
  od toho, jak to prob\u00edh\u00e1 v v\u011bcech dom\u00e1cnostech. M\u00e1m hezky
  prost\u0159eno, m\u00e1m stromek, by\u0165 mal\u00fd, a i na betl\u00e9m jsem na\u0161el
  prostor. Po ve\u010de\u0159i jdu do kostela slou\u017eit p\u016flnocn\u00ed m\u0161\u00ed.\\n\\nZm\u00ednil
  jste slavnostn\u00ed tabuli, dr\u017e\u00edte tradice? V z\u00e1kladu ano, v n\u011bkolika
  v\u011bcech se v\u0161ak li\u0161\u00ed, proto\u017ee poch\u00e1z\u00edm z polsk\u00e9ho
  Slezska, tak si ji d\u011bl\u00e1m tak, jak jsme ji d\u011bl\u00e1vali u n\u00e1s
  doma. \u010clov\u011bk m\u00e1 r\u00e1d ty tradice, ty chut\u011b, kter\u00e9 mu
  p\u0159ipom\u00ednaj\u00ed domov. Z\u00e1kladem je sma\u017een\u00fd kapr a knedl\u00edky
  podobn\u00e9 \u010desk\u00fdm chlupat\u00fdm knedl\u00edk\u016fm. Misto mouky je
  v nich bramborov\u00fd \u0161krub. K tomu m\u00e1m bor\u0161\u010d, i kdy\u017e
  v tomto p\u0159\u00edpad\u011b jde sp\u00ed\u0161 o v\u00fdvar obarven\u00fd \u0161\u0165\u00e1vou
  z \u010derven\u00e9 \u0159epy, do kter\u00e9ho se p\u0159id\u00e1vaj\u00ed \u201eou\u0161ky\u201c,
  co\u017e jsou t\u011bstovinov\u00e9 ta\u0161ti\u010dky pln\u011bn\u00e9 houbami.
  Na Bo\u017e\u00ed hod nev\u011brim, sp\u00ed\u0161 doj\u00edd\u00e1m to, co bylo
  k ve\u010de\u0159i. To je ostatn\u011b tak\u00e9 zvyk z domova. M\u00e1ma si tak
  mohla odpoc\u00ednout od va\u0159en\u00ed.\\n\\nJe\u0161t\u011b se chci zeptat na
  oby\u010deje, jako je t\u0159eba kr\u00e1jen\u00ed jabl\u00ed\u010dek? Dodr\u017eujete
  n\u011bjak\u00e9? Op\u011bt se vra\u010d\u00edm k domovu. M\u011bli jsme jeden takov\u00fd
  zvyk \u2013 l\u00e1mal jsem oplatky, bileho chleba. Ten jsme si vzdycky na za\u010d\u00e1tku
  ve\u010de\u0159e rozlomili a jeden druh\u00e9mu jsme pop\u0159\u00e1li radostn\u00e9
  sv\u00e1tky. Oplatku m\u00e1m taky, ale pro\u017e\u00edv\u00e1m tuto tradici symbolicky.
  Rozlom\u00edm oplatku ve sv\u00e9m srdci, ve sv\u00fdch my\u0161lenk\u00e1ch s t\u011bmi,
  se kter\u00fdmi bych v tu chv\u00edli r\u00e1d byl.\\n\\nVrcholem ve\u010de\u0159e
  pak je p\u016flnocn\u00ed m\u0161e, jak je to s jej\u00ed popularitou u n\u00e1s
  ve Vr\u0161ovic\u00edch? V\u00e1nocn\u00ed m\u0161e, mluv\u00edm o obou m\u0161\u00edch,
  jsou nejnav\u0161t\u011bvovan\u011bj\u0161\u00ed za cel\u00fd rok, pon\u011bvad\u017e
  p\u0159ijdou lid\u00e9, kte\u0159\u00ed jinak do kostela b\u011b\u017en\u011b nechod\u00ed.
  \u00dapln\u011b nejnav\u0161t\u011bvovan\u011bj\u0161\u00ed (jest\u011b v\u00edce
  ne\u017e p\u016flnocn\u00ed) je odpoledn\u00ed m\u0161e pro rodiny s d\u011btmi.
  Ka\u017edop\u00e1dn\u011b se farn\u00ed kostel svat\u00e9ho V\u00e1clava ve Vr\u0161ovic\u00edch
  na \u0160t\u011bdr\u00fd den v\u017edy zapln\u00ed.\\n\\nVr\u0161ovick\u00e1 farnost
  \u010d\u00edt\u00e1 dva kostely. Zm\u00ednil jste kostel na \u010cechov\u011b n\u00e1m\u011bst\u00ed
  a men\u0161\u00ed kostel svat\u00e9ho Mikul\u00e1\u0161e ve Vr\u0161ovick\u00e9ho
  n\u00e1m\u011bst\u00ed. Ty stavby nemohou b\u00fdt rozd\u00edln\u011bj\u0161\u00ed.
  Jedna pat\u0159\u00ed k nejstar\u0161\u00edm vr\u0161ovick\u00fdm pam\u00e1tk\u00e1m,
  druh\u00e1 je vrcholem funkcionalistick\u00e9 architektury. Li\u0161\u00ed se genius
  loci t\u011bchto m\u00edst?\\n\\nSvat\u00fd Mikul\u00e1\u0161 je star\u0161\u00ed,
  daleko men\u0161\u00ed kostel. M\u016f\u017ee tedy p\u016fsobit takov\u00fdm komorn\u011bj\u0161\u00edm,
  na n\u011bkoho mo\u017en\u00e1 utuln\u011bj\u0161\u00edm dojmem. Nav\u00edc d\u00edky
  tradi\u010dn\u00ed architektu\u0159e d\u00fdch\u00e1 vic takov\u00fdm t\u00edm zn\u00e1m\u00fdm
  sakr\u00e1ln\u00edm. Naopak kostel svat\u00e9ho V\u00e1clava je funkcionalistick\u00e1
  stavba, kter\u00e1 m\u016f\u017ee p\u016fsobit pon\u011bkud stroze a d\u00e1v\u00e1
  do p\u0159ed\u011b funkci. Je tu takov\u00fd paradox, proto\u017ee v tomto kostele
  je probl\u00e9m vym\u011bnit \u017e\u00e1rovku. Sv\u011btla jsou zapu\u0161t\u011bn\u00e1
  a jsou k tomu pot\u0159eba v\u017edy minim\u00e1ln\u011b t\u0159i lid\u00e9. Proto
  ob\u010das s lehkou nad\u0161\u00e1kou \u0159\u00edk\u00e1m, \u017ee jde o nefunk\u010dn\u00ed
  funkcionalistickou stavbu. Samoz\u0159ejm\u011b, je to ikona Vr\u0161ovic a na n\u011bkoho
  zase v\u00edce p\u016fsob\u00ed genius loci tohoto m\u00edsta.\\n\\nO kolik far\u00e1nek
  se na Des\u00edtce star\u00e1te? To je slo\u017eit\u00e1 ot\u00e1zka! Na \u00fazem\u00ed
  farnosti bydl\u00ed 38 000 lid\u00ed; samoz\u0159ejm\u011b zd\u00e1leka ne v\u0161ichni
  se s farnost\u00ed zto\u017e\u0148uj\u00ed, pova\u017euj\u00ed se za v\u011b\u0159\u00edc\u00ed,
  za katol\u00edky. Ale je tady hodn\u011b lid\u00ed, kte\u0159\u00ed n\u011bjak\u00fd
  vztah k v\u00ed\u0159e maj\u00ed. Ono se to vzdycky uk\u00e1\u017ee v takov\u00fdch
  \u017eivotn\u00edch momentech, jako jsou k\u0159ty d\u011bt\u00ed, svatby, poh\u0159by
  nebo n\u011bjak\u00e9 osobn\u00ed z\u00e1le\u017eitosti, kdy tito lid\u00e9 vyhled\u00e1vaj\u00ed
  far\u00e1\u0159e nebo kostel. I to jsou m\u00f3j far\u00e1nci, by\u0165 t\u0159eba
  nejsou pravideln\u00fdmi n\u00e1v\u0161t\u011bvn\u00edky bohoslu\u017eeb. No a pak
  je tu to siln\u00e9 j\u00e1dro, \u017eiv\u00e9 a siln\u00e9 spole\u010denstv\u00ed
  far\u00e1nek, kte\u0159\u00ed se znaj\u00ed a pravideln\u011b se setk\u00e1vaj\u00ed.\\n\\nNed\u00e1
  mi, abych se nezeptal, kdy\u017e sah\u00e1te po Bibli pro sv\u00e9 pot\u0159eby,
  berete si ji v pol\u0161t\u00ednce, nebo v \u010de\u0161tin\u011b?\\n\\nNo, to je
  velice zaj\u00edmav\u00e1 ot\u00e1zka. \u0158\u00edk\u00e1 se, \u017ee P\u00edsmo
  svat\u00e9 by \u010dlov\u011bk m\u011bl \u010d\u00edst bud'' v origin\u00e1le, nebo
  v mate\u0159\u0161tinou. Mohu t\u00e9to \u0159\u00edct, \u017ee \u010de\u0161tina
  u\u017e se stala mou mate\u0159\u0161tinou. Je to d\u016fvod t\u00edm, \u017ee k\u00e1z\u00fa
  v \u010de\u0161tin\u011b. Dod\u00e1v\u00e1m, \u017ee k Bohu se \u010dlov\u011bk
  modl\u00ed ze sv\u00e9ho srdce, a to se modlim v na\u0161em slezsk\u00e9m n\u00e1\u0159e\u010d\u00ed.\\n\\nJak
  u\u017e jsme uvedli, do \u010cech jste p\u0159i\u0161el po\u010d\u00e1tkem 90. let,
  vr\u0161ovickou farnost vedete od roku 2016. Mezi t\u00edm jste p\u016fsobil mimo
  jin\u00e9 v kostele svat\u00e9 Ludmily na n\u00e1m\u011bst\u00ed M\u00edru, ale
  va\u0161e prvn\u00ed anga\u017em\u00e1 je spjato se st\u0159edo\u010desk\u00fdm
  Mn\u00ed\u0161kem pod Brdy. Jak na tato m\u00edsta vzpom\u00edn\u00e1te?\\n\\nMn\u00ed\u0161ek,
  to je jako prvn\u00ed l\u00e1ska, a tak to nav\u017edy z\u016fstane. P\u0159i\u0161el
  jsem tam jako mlad\u00fd kn\u011bz do ciz\u00edho prost\u0159ed\u00ed a od far\u00e1\u0148k\u016f
  se mi dostalo neuv\u011b\u0159iteln\u00e9 podpory. \u010cas od \u010dasu se tam
  r\u00e1d vr\u00e1t\u00edm v r\u00e1mci skaleck\u00e9 pouti a moc m\u011b t\u011b\u0161\u00ed,
  \u017ee i po t\u011bch letech m\u011b tam lid\u00e9 st\u00e1le pozn\u00e1vaj\u00ed.\\n\\nJak\u00e9
  byly za\u010d\u00e1tky ve Vr\u0161ovic\u00edch? P\u016fsob\u00edm tady osm\u00fdm
  rokem a p\u0159i\u0161el jsem sem jako zral\u00fd \u010dlov\u011bk s ur\u010ditou
  \u017eivotn\u00ed zku\u0161enost\u00ed, co\u017e mi v m\u00e9m p\u016fsoben\u00ed
  pomohlo. Vr\u0161ovick\u00e1 farnost je velice \u017eiv\u00e1 farnost, a t\u00edm
  pro far\u00e1\u0159e i dost n\u00e1ro\u010dn\u00e1. I zde jsem se ale setkal s velkou
  vst\u0159\u00edcnost\u00ed a p\u0159ijet\u00edm ze strany far\u00e1\u0148k\u016f.
  Nev\u00edm, jestli je to typick\u00e9 pro ka\u017ed\u00e9ho kn\u011bze, anebo je
  to specifick\u00e9 pro m\u00e9, ale kam jsem p\u0159i\u0161el, tam se mi vzdycky
  dostalo velice v\u0159el\u00e9ho p\u0159ijet\u00ed. M\u016f\u017eu \u0159\u00edct,
  \u017ee posledn\u00ed roky jsou nejkr\u00e1sn\u011bj\u0161\u00edmi v m\u00e9m kn\u011b\u017esk\u00e9m
  \u017eivot\u011b.\\n\\nNa co by se lid\u00e9 m\u011bli v nov\u00e9m roce zam\u011b\u0159it,
  co byste jim vzk\u00e1zal?\\n\\nR\u00e1d bych \u010dten\u00e1\u0159\u016fm pop\u0159\u00e1l,
  a\u0165 maj\u00ed touhy a a\u0165 maj\u00ed velk\u00e9 touhy! \u0158\u00edk\u00e1
  se, \u017ee pan B\u016fh si z na\u0161ich pl\u00e1n\u016f moc ned\u011bl\u00e1,
  ale bere v\u00e1\u017en\u011b to, po \u010dem tou\u017e\u00edme. Kdy\u017e se d\u00edv\u00e1m
  na sv\u016fj \u017eivot a na to, jak dopadly moje touhy, m\u016f\u017eu se pod to
  jenom podepsat.\\n\\nPOZV\u00c1NKA\\n\\nZveme tak\u00e9 na rozsv\u00edcen\u00ed
  hlavn\u00edho stromu M\u010c Praha 10, kter\u00e9 se uskute\u010dn\u00ed 3. 12.
  2023 od 18:30 hod. p\u0159ed kostelem sv. V\u00e1clava na n\u00e1m\u011bst\u00ed
  Svatopluka \u010cecha. P\u0159ed rozsv\u00edcen\u00edm, od 18:00 hod., za\u010d\u00edn\u00e1
  hudebn\u00ed program, jeho\u017e sou\u010d\u00e1st\u00ed bude ike z\u00e1vadice
  a po\u017eehn\u00e1n\u00ed p. far\u00e1\u0159e Artura Matuszka. Pan far\u00e1\u0159
  se z\u00fa\u010dastn\u00ed i za\u017eehn\u00e1n\u00ed provozu V\u00e1no\u010dn\u00edho
  m\u011bste\u010dka (17. 12. 2023, 15:00 hod.), kter\u00e9 pro vas M\u010c Praha
  10 p\u0159ipravila na dobu od 17. do 22. 12. tak\u00e9 p\u0159ed kostelem na n\u00e1m\u011bst\u00ed
  Svatopluka \u010cecha. V kostele se tak\u00e9 bude 10. 12. od 18:00 hod. konat v\u00e1no\u010dn\u00ed
  koncert. Zp\u011bvy doby adventn\u00ed p\u0159ednesou sbor Vox nymburgensis. Za
