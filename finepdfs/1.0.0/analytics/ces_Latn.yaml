  odst. 4 z\u00e1kona \u010d. 154/2000 Sb., o \u0161lecht\u011bn\u00ed, plemenitb\u011b
  a evidenci hospod\u00e1\u0159sk\u00fdch zv\u00ed\u0159at a o zm\u011bn\u011b n\u011bkter\u00fdch
  souvisej\u00edc\u00edch z\u00e1kon\u016f (plemen\u00e1\u0159sk\u00fd z\u00e1kon),
  ve zn\u011bn\u00ed pozd\u011bj\u0161\u00edch zm\u011bn a dopl\u0148k\u016f, kter\u00fd
