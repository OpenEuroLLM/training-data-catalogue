  SERVIS\"", "\"Co n\u00e1s do konce \u0161koln\u00edho roku \u010dek\u00e1\\n\\nP\u011bt
  zased\u00e1n\u00ed a dal\u0161\u00ed akce. Takov\u00fd je pl\u00e1n na druh\u00e9
  pololet\u00ed tohoto \u0161koln\u00edho roku. Hned dv\u011b t\u00e9mata p\u0159ijdou
  na \u0159adu v b\u0159eznu.\\n\\nPrvn\u00ed z nich bude prob\u00edrat t\u00e9ma
  Podnik\u00e1n\u00ed v Opav\u011b a zvolili jsme pro n\u011bj netradi\u010dn\u00ed
  dobu. Sobotu 5. b\u0159ezna. Naraz\u00ed to sice na riziko, \u017ee p\u0159ijde
  m\u00e9n\u011b \u00fa\u010dastn\u00edk\u016f, za to snad bude jedn\u00e1n\u00ed
  intenzivn\u011bj\u0161\u00ed. Hlavn\u00edm bodem bude p\u0159\u00edprava grantu
  na spolufinancov\u00e1n\u00ed projektu Nap\u0159i\u010d s EU a tak\u00e9 p\u0159edstaven\u00ed
  Business Heroes, kter\u00e9ho se zhost\u00ed zastupitelka a jedna z tv\u016frky\u0148
  \u201einkub\u00e1toru\u201c pro mlad\u00e9 podnikatele Olga Pavl\u00ed\u010dkov\u00e1.\\n\\nDal\u0161\u00ed
  b\u0159eznov\u00e9 zased\u00e1n\u00ed se bude 31. 3. zab\u00fdvat t\u00e9matem Participace
  ml\u00e1de\u017ee. P\u0159ipravuj\u00ed ho Mi\u0161a Skrbelov\u00e1 a K\u00e1ja
  Konarsk\u00e1 a chystaj\u00ed mnoh\u00e1 p\u0159ekvapen\u00ed.\\n\\nDo konce roku
  n\u00e1m pak je\u0161t\u011b zb\u00fdv\u00e1 t\u00e9ma Zdravotnictv\u00ed (to si
  vzali za sv\u00e9 Tereza Marulevov\u00e1, Venda Brani\u0161ov\u00e1 a Ver\u010da
  Urbancov\u00e1) a Opava jako m\u011bsto kultury (Vendy Petr\u017eelov\u00e1 a Katka
  Bo\u0159uck\u00e1). St\u00e1le je\u0161t\u011b zb\u00fdv\u00e1 rozhodnut\u00ed o
  posledn\u00edm t\u00e9matu. Mezi n\u00e1vrhy byla nap\u0159\u00edklad Inkluze nebo
  Nez\u00e1vislost a objektivita m\u00e9di\u00ed. Krom\u011b b\u011b\u017en\u00fdch
  zased\u00e1n\u00ed n\u00e1s \u010dek\u00e1 tak\u00e9 Den zem\u011b 17. dubna a mo\u017en\u00e1
  je\u0161t\u011b \u00faklid v r\u00e1mci akce Uklidme \u010cesko 16. dubna.\\n\\nMilan\\n\\nMal\u00fd
  kulturn\u00ed servis neboli KamNa\\n\\nV b\u0159eznu zvou pedagogov\u00e9 St\u0159ediska
  voln\u00e9ho \u010dasu nap\u0159\u00edklad na folklorn\u00ed akce souvisej\u00edc\u00ed
  s vyn\u00e1\u0161en\u00edm Ma\u0159eny jako symbolu zimy (12. b\u0159ezna \u2013
  v\u00fdroby Ma\u0159en v SV\u010c na Jaselsk\u00e9 od 15 hodin a 13. b\u0159ezna
  jejich vyn\u00e1\u0161en\u00ed a p\u00e1len\u00ed \u2013 tak\u00e9 od 15 hodin).
  V\u00fdrobky z kv\u011btin budou prov\u00e1zet Kv\u011btnou ned\u011bli 20. b\u0159ezna
  a pot\u00e9 bude n\u00e1sledovat Velikono\u010dn\u00ed zvykoslov\u00ed (pro mate\u0159sk\u00e9
  \u0161koly 21. b\u0159ezna na Jaselsk\u00e9 a pro z\u00e1kladn\u00ed \u0161koly
  22. a 23. 3. tamt\u00e9\u017e). Duben p\u0159inese obnovenou premi\u00e9ru akce,
  kter\u00e1 navazuje na n\u011bkdej\u0161\u00ed Poh\u00e1dkov\u00e9 dome\u010dky.
  Tato novinka se ponese Na k\u0159\u00eddlech mot\u00fdl\u00edch a uskute\u010dn\u00ed
  se v sobotu 16. dubna odpoledne.\\n\\nMilan\\n\\nHled\u00e1 se logo\\n\\nN\u00e1\u0161
  ml\u00e1de\u017enick\u00fd parlament dlouhou dobu pou\u017e\u00edval logo, kter\u00e9
  souviselo s jednotn\u00fdm grafick\u00fdm stylem cel\u00e9ho St\u0159ediska voln\u00e9ho
  \u010dasu. Nastal \u010das to p\u0159ehodnotit a pohl\u00e9dnout se po nov\u00e9m
  v\u00fdtvarn\u00e9m a grafick\u00e9m zpracov\u00e1n\u00ed. Tak aby nebylo logo zam\u011bniteln\u00e9
  s \u017e\u00e1dn\u00fdm jin\u00fdm, aby n\u00e1s reprezentovalo a odkazovalo na
  to, \u017ee reprezentujeme i Opavu jako m\u011bsto. Pr\u00e1ce na nov\u00e9m reprezentativn\u00edm
  symbolu OZDM se ujal David Horn\u00fd a vytvo\u0159il u\u017e dv\u011b podoby. Proto
  d\u00e1v\u00e1me ke zv\u00e1zen\u00ed, kter\u00e1 z nich bude na konec ta v\u00edt\u011bzn\u00e1.
  Kone\u010dn\u00e1 podoba loga n\u00e1s bude reprezentovat nap\u0159\u00edklad na
  materi\u00e1lech k projektu Nap\u0159i\u010d s Evropskou uni\u00ed (viz n\u00e1sleduj\u00edc\u00ed
  strana).\\n\\nMilan\\n\\n\u00davodn\u00edk p\u0159edsedkyn\u011b\\n\\nKdy\u017e
  mi Milan pov\u011bd\u011bl, \u017ee zase za\u010dne OZDM vyd\u00e1vat noviny, byla
  jsem r\u00e1da, \u017ee jsem se toho je\u0161t\u011b do\u017eila. Vzhledem k tomu,
  \u017ee jsem mohla b\u00fdt u vzniku p\u0159edchoz\u00edch novin vyd\u00e1van\u00fdch
  je\u0161t\u011b, kdy\u017e koordin\u00e1torkou byla Ver\u010da. Posledn\u00ed noviny
  se jmenovaly \u201eNa\u0161e listy\u201c a na jejich vzniku se pod\u00edlel cel\u00fd
  t\u00fdm lid\u00ed, jeho\u017e sou\u010d\u00e1st\u00ed bylo spoustu dnes ji\u017e
  b\u00fdval\u00fdch zastupitel\u016f, co\u017e je hlavn\u00ed d\u016fvod, pro\u010d
  noviny p\u0159estaly vych\u00e1zet. Dnes u\u017e jsou ale v zastupitelstvu nov\u00ed
  lid\u00e9 a proto m\u00e1me i nov\u00e9 noviny. Douf\u00e1m, \u017ee se v\u00e1m
  budou l\u00edbit.\\n\\nK\u00e1ja\\n\\nDov\u011btkek koordin\u00e1tora\\n\\nTaky
  v\u011b\u0159\u00edm, \u017ee tento list (sp\u00ed\u0161 ne\u017e noviny) bude m\u00edt
  sv\u00e9 po- kracovatele a hlavn\u011b, \u017ee se po jeho p\u0159e\u010dten\u00ed
  vzdem v\u00edme v\u00edna z\u00e1jmu o psan\u00ed a \u017ee p\u0159\u00ed\u0161t\u00ed
  \u010d\u00edslo bude dvakr\u00e1t \u010di v\u00edcekr\u00e1t rozs\u00e1hlej\u0161\u00ed.
  Bylo by p\u011bkn\u00e9 m\u00edt noviny, ve kter\u00fdch m\u016f\u017eeme informovat
  o tom, co bylo a co se chyst\u00e1. Tak\u017ee sb\u00edr\u00e1me podn\u011bty na
  nov\u00e9 \u010dl\u00e1nky a p\u0159ij\u00edm\u00e1me nov\u00e9 \u010dleny redakce
  nebo tak\u00e9 nov\u00e9 spr\u00e1vce webu a facebookov\u00e9 skupiny!\\n\\nMilan\\n\\nOpava
  bude diskutovat o vystoupen\u00ed Brit\u00e1nie z Evropsk\u00e9 unie\\n\\nPokud
  byste cht\u011bli v\u011bd\u011bt, co se skr\u00fdv\u00e1 za tajemn\u00fdm slovem
  brexit, m\u00e1me pro v\u00e1s \u0159e\u0161en\u00ed. Opavsk\u00e9 zastupitelstvo
  d\u011bt\u00ed a ml\u00e1de\u017ee si toto t\u00e9ma vybralo pro sv\u00e9 diskusn\u00ed
  f\u00f3rum v kv\u011btnu v r\u00e1mci cyklu Nap\u0159\u00ed\u010d s Evropskou uni\u00ed.\\n\\nJde
  o projekt zam\u011b\u0159en\u00fd na strukturovan\u00fd dialog ml\u00e1de\u017ee
  na ot\u00e1zky souvisej\u00edc\u00ed s Evropskou uni\u00ed. Brexit p\u0159inese
  t\u00e9ma jako vystoupen\u00ed Velk\u00e9 Brit\u00e1nie z Evropsk\u00e9 unie, hrozba
  opu\u0161t\u011bn\u00ed EU ze strany dal\u0161\u00ed st\u00e1t\u016f a dal\u0161\u00ed
  problematiku. P\u0159ipravy na prvn\u00ed velk\u00fd spole\u010dn\u00fd projekt
  krajsk\u00fdch ml\u00e1de\u017enick\u00fdch samospr\u00e1v jsme zah\u00e1jili na
  zased\u00e1n\u00ed Parlamentu d\u011bt\u00ed a ml\u00e1de\u017ee Moravskoslezsk\u00e9ho
  kraje (PDM MSK) v Ostrav\u011b 12. \u00fanora. Sch\u016fzky se \u00fa\u010dastnili
  z\u00e1stupci Ostravy, Kop\u0159ivnice, Karvin\u00e9, Orlov\u00e9, Vratimova.\\n\\nOstravsk\u00e9ho
  zased\u00e1n\u00ed krajsk\u00e9ho parlamentu se \u00fa\u010dastnili i z\u00e1stupci
  OZDM. Sn\u00edmky: Milan\\n\\nMlad\u00ed zastupitel\u00e9 sestavovali rozpo\u010det
  m\u011bsta\\n\\nM\u011bstsk\u00fd rozpo\u010det, to je vlastn\u011b takov\u00e9
  dom\u00e1c\u00ed hospoda\u0159en\u00ed, jen s v\u00edce nulami a strukturov\u011bj\u0161\u00edmi
  polo\u017ekami. Tak by se ve zkratce dal vystihnout hlavn\u00ed poznatek, kter\u00fd
  si mohli \u010dlenov\u00e9 OZDM odn\u00e9st ze zased\u00e1n\u00ed na t\u00e9ma Rozpo\u010det
  m\u011bsta. Uskute\u010dnilo se 25. ledna 2016 v zasedac\u00ed m\u00edstnosti rady
  m\u011bsta na Hl\u00e1sce. A\u010dkoliv t\u00e9ma nep\u016fsobilo jednodu\u0161e
  a pro mnoh\u00e9 ani p\u0159ita\u017eliv\u00e9, nakonec zased\u00e1n\u00ed poskytlo
  vcelku jasn\u00fd v\u00fdhled do taj\u016f hospoda\u0159en\u00ed m\u011bsta. P\u0159ipravn\u00fd
  t\u00fdm vedl a t\u00e1hl m\u00edstop\u0159edseda Jakub Mr\u00e1zek. Na tvorb\u011b
  prezentace a seznamovac\u00ed hry pracoval Tom\u00e1\u0161 Tesa\u0159\u00edk, simulaci
  hru ve spolupr\u00e1ci s hosty z odboru finan\u010dn\u00edho a rozpo\u010dtov\u00e9ho
  organizoval Mat\u011bj Ma\u010duga a n\u00e1pady taky p\u0159isp\u011bl Ale\u0161
  Hrk.\\n\\nJako hosty jsme si pozvali Miroslava Dr\u00f6sslera, vedouc\u00edho odboru
  finan\u010dn\u00edho a rozpo\u010dtov\u00e9ho a Lenku Grigarovou, kter\u00e1 v r\u00e1mci
  tohoto odboru vede odd\u011blen\u00ed rozpo\u010dtu. Tak\u017ee jist\u011b povolan\u011bj\u0161\u00ed
  a do problematiky zasv\u011bcen\u011bj\u0161\u00ed hosty jsme ani m\u00edt nemohli.\\n\\nLenka
  Grygarov\u00e1 n\u00e1m pomohla u\u017e p\u0159i p\u0159\u00edprav\u011b simulacn\u00ed
  hry, kter\u00e1 vznikala tro\u0161ku p\u0159ekotn\u011b a\u017e na m\u00edst\u011b,
  ale nakonec poskytla zaj\u00edmav\u00fd z\u00e1\u017eitek v\u0161em z\u00fa\u010dastn\u011bn\u00fdm.
  \u010cty\u0159i skupiny prezentovaly rozpo\u010dty sestaven\u00e9 pro fiktivn\u00ed
  m\u011bsto o 60 tis\u00edc\u00edch obyvatel\u00edch. N\u011bkter\u00e1 krit\u00e9ria
  na stran\u011b p\u0159\u00edjm\u016f byla jasn\u011b dan\u00e1 (p\u0159\u00edjem
  na 1 obyvatele ve v\u00fd\u0161i 9 000 korun) a dal\u0161\u00ed z\u00e1le\u017eela
  na politick\u00e9m rozhodnut\u00ed konkr\u00e9tn\u00edho m\u011bsta (nap\u0159.
  poplatky za odpad a za psy).\\n\\nP\u0159i prezentov\u00e1n\u00ed jednotliv\u00fdch
  n\u00e1pad\u016f padala i zaj\u00edmav\u00e1 stanoviska a postoje: z\u00e1stupci
  jednoho z m\u011bst \u00fapln\u011b zru\u0161ili hazard a p\u0159\u00edjmy z\u00edsk\u00e1vali
  z b\u0159idlicov\u00e9ho dolu. Ob\u010das tu i tam jednotliv\u00e9 t\u00fdmy ust\u0159\u00edlely
  nap\u0159\u00edklad v n\u00e1kladech na person\u00e1ln\u00ed z\u00e1le\u017eitosti
  (provoz m\u011bstsk\u00e9ho \u00fa\u0159adu) \u010di v podpo\u0159e sportu, ale
  to byly jen ojedin\u011bl\u00e9 p\u0159\u00edpady.\\n\\nHost\u00e9 ocenili vcelku
  re\u00e1ln\u011b nasimulovan\u00fd pr\u016fb\u011bh hry, str\u017eiliv\u011b uv\u00e1zuvali
  z\u00e1stupc\u016f jednotliv\u00fdch t\u00fdm\u016f a pohocheni princip\u016f tvorby
  vyrovnan\u00e9ho m\u011bstsk\u00e9ho rozpo\u010dtu.\\n\\nPo ob\u011bdov\u00e9 pauze
  se rovinula velk\u00e1 debata o n\u00e1kladech na provozov\u00e1n\u00ed kryt\u00e9ho
