  %\\n\\nN\u00c1RODNOSTI\\n\\nV\u011aK\\n\\nPO\u010cET B\u011a\u017dC\u016e PODLE
  REGION\u016e\\n\\n15 411 B\u011a\u017dC\u016e\\n\\n30 LET RUNCZECH\\n\\nZa\u010d\u00e1tek
  - Stejn\u011b jako mnoho jin\u00fdch v\u011bc\u00ed v \u010cesk\u00e9 republice,
  vznikli i n\u00e1pad uspo\u0159\u00e1dat v Praze mezin\u00e1rodn\u00ed maraton u
  piva. Byla kr\u00e1sn\u00e1 podzimn\u00ed sobota v listopadu 1994 a Carlo Capalbo
  sed\u011bl v mal\u00e9m baru se sv\u00fdm kamar\u00e1dem a italsk\u00fdm kolegou
  Gelingem Bordinem, v\u00edt\u011bzem marat\u00f3nu na olympijsk\u00fdch hr\u00e1ch
  v Soulu v roce 1988. Pot\u00e9, co si na ubrousek nakreslili n\u00e1vrh z\u00e1vodn\u00ed
  trat\u011b, rozhodli se zvouvat Emiliu Z\u00e1topkovou a po\u017e\u00e1dat ho o
  podporu. Slavn\u00fd Emil Z\u00e1topek, dr\u017eitel t\u0159\u00ed zlat\u00fdch
  medail\u00ed z letn\u00edch olympijsk\u00fdch her v Helsink\u00e1ch. Na start prvn\u00edho
  ro\u010dn\u00edku pra\u017esk\u00e9ho marat\u00f3nu se postavilo 985 b\u011b\u017ec\u016f,
  ale nebe\u017eeli jen oni. Lid\u00e9 se mohli zapojit je\u0161t\u011b do dal\u0161\u00edch
  dvou distanc\u00ed - 9,2 km a 4,8 km. Kapacita t\u011bchto b\u011bh\u016f byla n\u011bkolikr\u00e1t
  nav\u00fd\u0161ena a celkem se jich z\u00fa\u010dastnilo 15 000 lid\u00ed (d\u011bti
  i dosp\u011bl\u00ed).\\n\\n1996 - K maratonu p\u0159ib\u00fdv\u00e1 dal\u0161\u00ed
  z\u00e1vod \u2013 Zlat\u00e1 des\u00edtka pro elitn\u00ed b\u011b\u017eeck\u00e9.\\n\\n1997
  - Poprv\u00e9 se b\u011b\u017e\u00ed studentsk\u00e9 \u0161tafety Juniorsk\u00e9ho
  maratonu za podpory Evropsk\u00e9 komise. Zlat\u00e1 des\u00edtka dost\u00e1v\u00e1
  nov\u00e9 jm\u00e9no Grand Prix. Po\u010det \u00fa\u010dastn\u00edk\u016f roste
  na dvojn\u00e1sobek, na startu je 1 848 b\u011b\u017ec\u016f.\\n\\n1998 - Trasa
  se od Zbraslavi p\u0159esouv\u00e1 v\u00edce do centra Prahy, poprv\u00e9 se b\u011b\u017e\u00ed
  p\u0159es Karl\u016fv most.\\n\\n1999 - K maratonu a Grand Prix p\u0159ib\u00fdv\u00e1
  tak\u00e9 p\u016flmaraton. Atmosf\u00e9ru z\u00e1vodu poprv\u00e9 pom\u00e1h\u00e1
  dotv\u00e1ret tak\u00e9 Marathon Music Festival.\\n\\n2000 - K maratonu a Grand
  Prix p\u0159ib\u00fdv\u00e1 tak\u00e9 p\u016flmaraton. Atmosf\u00e9ru z\u00e1vodu
  poprv\u00e9 pom\u00e1h\u00e1 dotv\u00e1ret tak\u00e9 Marathon Music Festival.\\n\\n2001
  - B\u011b\u017eeck\u00e1 legenda Haile Gebrselassie vyhr\u00e1v\u00e1 Grand Prix.
  Italsk\u00e1 b\u011b\u017ekyn\u011b Maura Viceceonte stanov\u00ed nov\u00fd \u017eensk\u00fd
  rekord v maratonu 2:26:33.\\n\\n2002 - V p\u0159edve\u010der maratonu se kon\u00e1
  z\u00e1vod na inlinech, \u00fa\u010dastn\u00ed se ho 530 brusla\u0159\u016f.\\n\\n2003
  - Prezident republiky V\u00e1clav Klaus se poprv\u00e9 \u00faj\u00edm\u00e1 role
  start\u00e9ra maratonu. Grand Prix se otev\u00edr\u00e1 veletr\u017enosti.\\n\\n2004
  - R\u00f3bert \u0160tefko dob\u00edh\u00e1 v maratonu na 3. m\u00edst\u011b a \u010dasem
  2:12:33 si zajistuje kvalifikaci na olympi\u00e1du v At\u00e9n\u00e1ch.\\n\\n2005
  - Hlavn\u00ed hv\u011bzdou Grand Prix je Stefano Baldini, olympijsk\u00fd v\u00edt\u011bz
  z At\u00e9n.\\n\\n2006 - Po\u010det \u00fa\u010dastn\u00edk\u016f p\u016flmaratonu
  poprv\u00e9 p\u0159evy\u0161uje po\u010det maratonsk\u00fdch b\u011b\u017ec\u016f.\\n\\n2007
  - Z maratonsk\u00e9ho Sport Expa na V\u00fdstavi\u0161ti Hole\u0161ovice se s 30
  000 n\u00e1v\u0161t\u011bvn\u00edky st\u00e1v\u00e1 nejv\u011bt\u0161\u00ed sportovn\u00ed
  veletrh v zemi.\\n\\n2008 - B\u011bh pro mu\u017ee na 10 km v r\u00e1mci Grand Prix
  je ocen\u011bn st\u0159\u00edbrnou zn\u00e1mkou IAAF.\\n\\n2009 - Pra\u017esk\u00fd
  p\u016flmaraton jako prvn\u00ed z cel\u00e9ho seri\u00e1lu z\u00e1vod\u016f z\u00edsk\u00e1v\u00e1
  nejvy\u0161\u0161\u00ed ocen\u011bn\u00ed \u2013 zlatou zn\u00e1mku IAAF.\\n\\n2010
  - Poprv\u00e9 se kon\u00e1 z\u00e1vod mimo Prahu \u2013 p\u016flmaraton v Olomouci.
  Zlat\u00e1 zn\u00e1mka IAAF je ud\u011blena i maratonu, jen\u017e zaznamen\u00e1v\u00e1
  rekordn\u00ed \u00fa\u010dast 7 934 b\u011b\u017ec\u016f.\\n\\n2011 - Po Olomouci
  p\u0159ib\u00fdv\u00e1 k mimopra\u017esk\u00fdm z\u00e1vod\u016fm i \u00dast\u00ed
  nad Labem. Jmenuj\u00ed se prvn\u00ed zlat\u00ed PIM Kingove, kte\u0159\u00ed odb\u011bhli
  v\u0161ech 15 ro\u010dn\u00edk\u016f.\\n\\n2012 - Atdsue Tsegay se \u010dasem 58:47
  z p\u016flmaratonu v Praze st\u00e1v\u00e1 \u010dtvrt\u00fdm nejrychlej\u0161\u00edm
  mu\u017eem historie. S dal\u0161\u00edm p\u016flmaratonem v \u010cesk\u00fdch Bud\u011bjovic\u00edch
  vznik\u00e1 znacka RunCzech, pod kterou pat\u0159\u00ed v\u0161echny z\u00e1vody.
  Jan Kreisinger si \u010dasem 2:16:25 zajistuje nominaci na Olympijsk\u00e9 hry v
  Lond\u00fdn\u011b.\\n\\n2013 - Na pra\u017esk\u00e9 Letn\u00e9 se otev\u00edr\u00e1
  unik\u00e1rn\u00ed b\u011b\u017eeck\u00e9 centrum s n\u00e1zvem Running Mall. Do
  RunCzech b\u011b\u017eeck\u00e9 ligy p\u0159ib\u00fdv\u00e1 1/2Maraton Karlovy Vary.\\n\\n2014
  - Maraton slav\u00ed 20 let, startovn\u00ed \u010d\u00edsla vyprod\u00e1na u\u017e
  na za\u010d\u00e1tku roku. Praha kompletuje sb\u00edrku zlat\u00fdch zn\u00e1mek,
  po p\u016flmaratonu a maratonu z\u00edsk\u00e1v\u00e1 nejvy\u0161\u0161\u00ed ocen\u011bn\u00ed
  v Grand Prix Praha.\\n\\n2015 - Zlatou zn\u00e1mkou IAAF byly ocen\u011bny p\u016flmaratony
  v Olomouci a \u00dast\u00ed nad Labem.\\n\\n2016 - Eva Vrabcov\u00e1 zab\u011bhla
  na maratonu Praha \u010das 2:30:10, \u010d\u00edm\u017e o 58 vte\u0159in vy\u0161plh\u00e1
  rekorde z\u00e1vodu Aleny Peterkov\u00e9 z roku 2000 a splnila limit pro olympi\u00e1du
  v Riu. RunCzech team p\u0159edstavil dva z\u00e1vody v It\u00e1lii \u2013 Napoli
  City Half Marathon a Sorrento Positano.\\n\\n2017 - Na z\u00e1vodech RunCzech padlo
  9 absolutn\u00edch rekord\u016f a \u010dty\u0159i \u010desk\u00e9 rekordy. Kejanka
  a \u010dlenka RunCzech Racing Teamu Joyciline Jepkosgei p\u0159ekonala na 1/2Maratonu
  Praha \u010dasem 1:04:52 sv\u011btov\u00fd rekord v p\u016flmaratonu i sv\u011btov\u00e1
  maxima na 10, 15 a 20 kilometr\u016f. P\u0159i z\u00e1v\u011bre\u010dn\u00e9 Grand
  Prix pak Jepkosgei sv\u016fj rekord na 10 kilometr\u016f je\u0161t\u011b vy\u0161plh\u00e1
  na 29:43.\\n\\n2018 - Eva Vrabcov\u00e1 p\u0159ekonala ji\u017e jubilejn\u00edm
  dvac\u00e1t\u00e9m ro\u010dn\u00edku 1/2Maratonu Praha \u010dty\u0159ia\u010dtyracet
  let star\u00fd \u010desk\u00fd rekord. Nov\u00e9 tuzemsk\u00e9 maximum m\u00e1 d\u00edky
  \u010dlence RunCzech Racing t\u00fdmu hodnotu 1:11:01. RunCzech spou\u0161t\u00ed
  projekt \u201eEuroHeroes\u201c na podporu talent\u016f evropsk\u00e9 atletiky a
  aktivn\u00edho \u017eivotn\u00edho stylu. V Ji\u017eersk\u00fdch hor\u00e1ch odstartoval
  prvn\u00ed ro\u010dn\u00edk z\u00e1vodu Liberec Nature Run.\\n\\n2019 - RunCzech
  dos\u00e1hl rekordu v po\u010dtu \u00fa\u010dastn\u00edk\u016f: 95 129 b\u011b\u017ec\u016f.
  Volkswagen Maraton Praha slav\u00ed 25. v\u00fdro\u010d\u00ed. Start EuroHeroes
  Challenge se kon\u00e1 b\u011bhem Mattoni 1/2Maratonu Karlovy Vary a 1/2Maratonu
  \u010cesk\u00e9 Bud\u011bjovice.\\n\\n2020 - Kdy\u017e n\u00e1s COVID donutil zru\u0161it
  v\u0161echny z\u00e1vody, spustili jsme nov\u00fd z\u00e1vod 21k pouze pro nejlep\u0161\u00ed
  elitn\u00ed b\u011b\u017ece zn\u00e1m\u00fd jako \u201eReady for the Restart\u201c.
  Peres Jepchirch triumfovala v Praze s \u010dasem 1:05:34, \u010d\u00edm\u017e stanovila
  nov\u00fd sv\u011btov\u00fd rekord v \u017eensk\u00fdch z\u00e1vodech.\\n\\n2021
  - Podarilo se uspo\u0159\u00e1dat 5 region\u00e1ln\u00edch z\u00e1vod\u016f a p\u0159in\u00e9st
  skute\u010dn\u00e9 z\u00e1\u017eitky v neskon\u010dit\u00e9 dob\u011b. Byly spu\u0161t\u011bny
  dva nov\u00e9 virtu\u00e1ln\u00ed projekty; Mattoni Run&Plog a Pry\u010d ze \u017eidle.\\n\\n2022
  - Restart po pandemii v pln\u00e9 s\u00edle. Projekt Battle of the Teams byl p\u0159edstaven
  na Pra\u017esk\u00e9m maratonu pro v\u0161echny b\u011b\u017ee\u010de.\\n\\n2023
  - N\u00e1vrat s\u00e9rie EuroHeroes, kter\u00fd v \u017een\u00e1ch vyhr\u00e1la
  \u010desk\u00e1 b\u011b\u017ekyn\u011b Tereza Hrochov\u00e1. Nov\u00fd koncept rodinn\u00fdch
  b\u011bh\u016f \u2013 rodinn\u00e1 mile p\u0159il\u00e1k\u00e1 k b\u011bhu je\u0161t\u011b
  v\u00edce lid\u00ed a rodin.\\n\\n2024 - T\u011b\u0161\u00edme se na v\u0161echny
  nov\u00e9 p\u0159\u00edb\u011bhy a z\u00e1\u017eitky!\\n\\nZN\u00c1MKY KVALITY WA\\n\\nSez\u00f3na
  2024 ve velk\u00e9m stylu \u2013 RunCzech si udr\u017eel mimo\u0159\u00e1dn\u011b
  vysok\u00fd standard a za\u0159adil se na prvn\u00ed m\u00edsto mezi organizacemi
  s nejv\u011bt\u0161\u00edm po\u010dtem z\u00e1vod\u016f ocen\u011bn\u00fdch zn\u00e1mkami
  od World Athletics.\\n\\nV\u0161echny z\u00e1vody RunCzech (krom\u011b Mattoni Liberec
  Nature Run a Unicredit Pra\u017esk\u00e9 \u0160tafety) maj\u00ed zn\u00e1mku kvality
  WA Label Road Race nebo WA Elite Label Road Race. T\u00fdk\u00e1 se to pra\u017esk\u00fdch
  i region\u00e1ln\u00edch z\u00e1vod\u016f a ocen\u011bn byl tak\u00e9 p\u016flmaraton
  v italsk\u00e9 Neapoli.\\n\\n7 M\u011aST\\n5 \u010cESK\u00ddCH M\u011aST + 2 ITALIE\\n\\n3
  PRA\u017dSK\u00c9 Z\u00c1VODY SE ZN\u00c1MKOU KVALITY ELITE\\n\\n6 ZN\u00c1MEK KVALITY
  SV\u011aTOV\u00c9 ATLETICK\u00c9 FEDERACE\\n4 CZ + 2 ITA\\n\\nVODI\u010cI\\n\\n|
  TOM\u00c1\u0160 VOCETKA | 1:24 |\\n| JI\u0158\u00cd FIX | 1:30 |\\n| PEP\u00c1 KA\u0160TIL
  | 1:30 |\\n| TOM\u00c1\u0160 BURDA | 1:30 |\\n| VOJTA KNESPL | 1:40 |\\n| OND\u0158A
