  kabely 7\\n   - 5.2. Konfigurace 7\\n\\n6. V\u00fdrobn\u00ed nastaven\u00ed 8\\n\\n7.
  \u00dadr\u017eba 8\\n\\n1. \u00davod\\n\\nExpanzn\u00ed modul 8OPW je roz\u0161i\u0159uj\u00edc\u00ed
  modul galvanicky odd\u011blen\u00fdch v\u00fdkonov\u00fdch v\u00fdstup\u016f v proveden\u00ed
  DIN 35mm. Je ur\u010den pro roz\u0161\u00ed\u0159en\u00ed v\u00fdstup\u016f m\u011b\u0159ic\u00edch
  syst\u00e9m\u016f s minim\u00e1ln\u00edmi n\u00e1klady.\\n\\nObsahuje 8 galvanicky
  odd\u011blen\u00fdch v\u00fdstup\u016f se spole\u010dn\u00fdm p\u0159\u00edvodem.\\n\\nDo
  syst\u00e9mu se expanzn\u00ed modul 8OPW zapojuje prost\u0159ednictv\u00edm rozhran\u00ed
  fast I2C. Rozsah adres 0..7 umo\u017e\u0148uje na spole\u010dn\u00e9 sb\u011brnici
  zapojit a\u017e 8 kus\u016f t\u011bchto expanzn\u00edch modul\u016f, co\u017e p\u0159edstavuje
  roz\u0161\u00ed\u0159en\u00ed o max.64 v\u00fdkonov\u00fdch v\u00fdstup\u016f.\\n\\n2.
  Technick\u00e9 \u00fadaje\\n\\n2.1. Elektrick\u00e9 parametry\\n\\nNap\u00e1jec\u00ed
  nap\u011bt\u00ed DC 24V\\nNap\u00e1jec\u00ed proud max. 50mA (v\u0161echny v\u00fdstupy
  ZAP)\\nRozhran\u00ed I2C 400kBd (fast Philips slave)\\n\\nPo\u010det v\u00fdstup\u016f
  8\\nMax.nap\u011bt\u00ed v\u00fdstup\u016f AC 250V\\nMax.proud v\u00fdstupu 1A/2A/5A
  (dle spinac\u00edho prvku)\\nMax.proud cel\u00e9ho modulu 10A\\nGalvanick\u00e9
  odd\u011blen\u00ed v\u00fdstup/syst\u00e9m ano 4kV\\nGalvanick\u00e9 odd\u011blen\u00ed
  navz\u00e1jem ne\\n\\n2.2. Rozm\u011bry\\n\\nMechanick\u00e9 proveden\u00ed plastov\u00fd
  modul\\nMont\u00e1\u017e na li\u0161tu DIN 35mm\\nObsazen\u00e9 m\u00edsto 3 moduly\\nKryt\u00ed
  IP20\\nP\u0159ipojen\u00ed vstup\u016f/v\u00fdstup\u016f \u0161roubovac\u00ed konektory
  Elettro GIBI\\nP\u0159ipojovac\u00ed vodi\u010d 0,4..1,5mm\u00b2\\npracovn\u00ed
  teplota -20..+70\u00b0C\\nskladovac\u00ed teplota -20..+70\u00b0C\\nRelativn\u00ed
  vlhkost 10..70% nekondenz.\\nV\u00e1ha 0,1 kg\\nRozm\u011bry 53 x 90 x 58\\n\\n3.
  Vstupy/v\u00fdstupy\\n\\n3.1. V\u00fdkonov\u00e9 v\u00fdstupy\\n\\nV\u00fdkonov\u00e9
  v\u00fdstupy expanzn\u00edho modulu 8OPW je mo\u017eno volit ze 3 typ\u016f. Typy
  pro proudy 1A a 2A jsou reprezentov\u00e1ny optoelektronick\u00fdmi sp\u00edna\u010di
  v nule a jsou ur\u010deny pro st\u0159\u00eddav\u00e1 nap\u011bt\u00ed 230V/50Hz.
  Proveden\u00ed 3 je osazeno klasick\u00fdmi 5A rel\u00e9 a je mo\u017eno jej pou\u017e\u00edt
  i pro stejnosm\u011brn\u00e1 nap\u011bt\u00ed.\\n\\nV\u0161echny v\u00fdstupy pou\u017e\u00edvaj\u00ed
  spole\u010dnou svorku p\u0159ivodn\u00edho nap\u011bt\u00ed.\\n\\nV\u00fdstupn\u00ed
  sp\u00ednac\u00ed prvky nejsou proudov\u011b ani p\u0159ep\u011b\u0165ov\u011b chr\u00e1n\u011bny.\\n\\n3.2.
  Rozhran\u00ed I2C\\n\\nRozhran\u00ed I2C expanzn\u00edho modulu 8OPW je typu slave
  a je ur\u010deno pro zapojen\u00ed do sb\u011brnice I2C \u0159\u00edzen\u00e9 za\u0159\u00edzen\u00edm
  master s max. frekvenc\u00ed 400kBd. Vstupy sb\u011brnice I2C jsou intern\u011b
  chr\u00e1n\u011bny proti p\u0159ep\u011bt\u00ed (5V 0,25W). V\u00fdstup 5V je ur\u010den
  pro pomocn\u00e9 nap\u00e1jen\u00ed zvy\u0161ovac\u00edch rezistor\u016f, pokud
  je t\u0159eba je pou\u017e\u00edt.\\n\\n3.3. Nap\u00e1jen\u00ed\\n\\nNap\u00e1jen\u00ed
  expanzn\u00edho modulu 8OPW je stejnosm\u011brn\u00e9. Proudov\u00fd odb\u011br
  ze zdroje je konstantn\u00ed v cel\u00e9m rozsahu nap\u00e1jec\u00edch nap\u011bt\u00ed
  a m\u011bn\u00ed se pouze s po\u010dtem sepnut\u00fdch v\u00fdstup\u016f modulu.\\n\\nStabilizace
  nap\u00e1jec\u00edho nap\u011bt\u00ed nen\u00ed nutn\u00e1.\\n\\nSvorka GND nap\u00e1jec\u00edho
  zdroje je vnit\u0159n\u011b propojena se svorkou GND rozhran\u00ed I2C.\\n\\n4.
  Rozm\u00edst\u011bn\u00ed konektor\u016f a svorek\\n\\n| Svorka | Ozna\u010den\u00ed
