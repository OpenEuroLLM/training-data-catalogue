  "\"Akce ZOFV Ostrava - V\u00fdstup na Lysou horu 2022 (Beskydy)\\n\\nDne 4.11.2022
  se uskute\u010dnil ji\u017e 28 ro\u010dn\u00edk akce ,,V\u00fdstup na Lysou horu\\\",
  kterou po\u0159\u00e1dala ZO FV Ostrava. \u00da\u010dastn\u00edci se se\u0161li
  p\u0159ed \u017eelezni\u010dn\u00ed stanic\u00ed Fr\u00fddek-M\u00edstek a p\u0159esunuli
  autobusem do Kr\u00e1sn\u00e9, Ni\u017en\u00ed Mohelnice zast\u00e1vky rozcest\u00ed.
  Po ofici\u00e1ln\u00edm zah\u00e1jen\u00ed jsme vyrazili sm\u011br Lys\u00e1 hora.
  Ka\u017ed\u00fd rok se sna\u017e\u00edme volit jinou cestu v\u00fdstupu na vrchol
  t\u00e9to kr\u00e1lovny Beskyd (Lys\u00e1 hora - 1323 m.n.m.).Vyrazili jsme lesn\u00ed
  stezkou a stoupali pozvolna k vrcholu Zimn\u00fd (1080 m.n.m.) a\u017e k napojen\u00ed
  na \u010dervenou turistickou zna\u010dku. Pak ji\u017e pohodln\u00fdm v\u00fdstupem
  dorazili a\u017e na vrchol. Ob\u010derstvili jsme se v Bezru\u010dov\u011b chat\u011b
  (K\u010cT) a po\u0159\u00eddili vrcholovou fotografii. Sestup dol\u016f z Lys\u00e9
  hory jsme zvolili po \u010derven\u00e9 turistick\u00e9 zna\u010dce na  Luk\u0161inec  a
  pak po \u017elut\u00e9 do hosp\u016fdky U Veli\u010dk\u016f, kde jsme m\u011bli
  objednan\u00fd ob\u011bd. Na tomto m\u00edst\u011b byla tak\u00e9 tato tradi\u010dn\u00ed
  podzimn\u00ed turistick\u00e1 akce ukon\u010den\u00e1. Leto\u0161n\u00ed ro\u010dn\u00edk
  se vyda\u0159il. Jednak bylo n\u00e1dhern\u00e9 po\u010das\u00ed a tak\u00e9 se
  z\u00fa\u010dastnilo mnoho \u010dlen\u016f jak na\u0161\u00ed ZO FV Ostrava, tak
  i z ostatn\u00edch odborov\u00fdch organizac\u00ed.\"", "\"\u010c esk\u00fd poh\u00e1r
