  celky.\\n\\nSpole\u010dnosti nezahrnut\u00e9 do konsolida\u010dn\u00edho celku,
  vlastn\u011bn\u00e9 CARBOUNION HOLDINGEM a.s. z d\u016fvodu nev\u00fdznamnosti:\\n-
