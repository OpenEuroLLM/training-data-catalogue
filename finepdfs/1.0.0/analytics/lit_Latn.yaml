  ugdymas \u2013 tai teorini\u0173 \u017eini\u0173 ir praktini\u0173 \u012fg\u016bd\u017ei\u0173
  visuma. Siekiant kryptingai ir tikslingai vykdyti \u0161\u012f ugdym\u0105, tarp
  pat norint i\u0161siai\u0161kinti, ar vykdomas priemon\u0117s turi teigiam\u0105
  poveik\u012f, reikia \u017einoti, kiek ir kok\u012fj\u0173 sveikatos \u017eini\u0173
  tur\u0117t\u0173 moksleiviai. Sveikatos \u017eini\u0173 testas 5, 6 kl. klasi\u0173
  mokiniams \u2013 tai kasmetinis vaik\u0173 \u017eini\u0173 patikrinimas, kurioje
  siekiama steb\u0117ti sveikatos \u017eini\u0173 dinamik\u0105. Mokin\u0173 sveikatos
  \u017eini\u0173 testas ap\u017evelgia tokius temas, kaip sveika gyvensena, mityba,
  fizinis aktyvumas, pirmoji pagalba, lig\u0173 profilaktika, \u017ealing\u0173 l\u0117poci\u0173
  (alkoholio, r\u016bkymo, psichoaktyvi\u0173j\u0173 med\u017eiag\u0173 vartojimo)
  prevencija ir kt. Tikslas \u2013 patikrinti moksleivi\u0173 sveikatos \u017einias,
  siekiant sistemingai vykdyti visuomen\u0117s sveikatos prie\u017ei\u016br\u0105
  mokykloje. Priemon\u0117: sveikatos \u017eini\u0173 testas. |\\n| --- | --- | ---
  |\\n| IV sav. | Akeija: \u201eSunki kuprin\u0117 = grei\u010diau tavo nugara!\u201c
  | Ta\u0161kykinga k\u016bno laikysena \u2013 tai i\u0161orinio gro\u017eio ir vidin\u0117s
  darmos atspindys. Ji sudaro optimalias s\u0105lygas kru\u0161in\u0117s lastos, duben\u0117s,
  galimin\u0173 kaul\u0173 ir vidaus organ\u0173 vystymuisi ir veiklai. Tod\u0117l
  jos formavimui b\u016btina r\u016bpinis nuo pat vaikyst\u0117s. Netaisyklinga k\u016bno
  laikysena retai buna \u012fgimta, da\u017eniausiai ji susiformuoja d\u0117l silpno
  raumen\u0173 tonuso, netaisyklingo s\u0117d\u0117jimo, sunkos ir ant vieno per\u0117s
  ne\u0161iojamos kuprin\u0117s. Ry\u0161kiausi pakitimai vyksta jaunesniame mokyklin\u0117je
  am\u017eiuje: nes toliau auga ir kaul\u0117ja skeletas, ta\u010diau sukurtas teb\u0117ra
  ne visai sukaulej\u0119s, lankstus. Reikalavimai mokytiniams kuprin\u0117ms yra
  nustatyti higienos normoje HN 41:2003 \u201eMokyklin\u0117s prekes\u201c. Dokumente
  nurodyta, kad tu\u0161\u010dios mokyklin\u0117s kuprin\u0117s svoris pradin\u0173
  klasi\u0173 moksleiviams turi b\u016bti ne daugiau kaip 700 g., vyresni\u0173j\u0173
  klasi\u0173 moksleiviams \u2013 ne daugiau kaip 1000 g. Optimalus plnos kuprin\u0117s
  svoris turet\u0173 sudaryti ne daugiau kaip 10% mokinio k\u016bno svorio. Tikslas
  \u2013 \u012fvertinti 5, 6 kl. mokin\u0173 ne\u0161iojam\u0173 kuprin\u0173 svori\u0173,
  siekiant i\u0161vengti vaik\u0173 laikysenos sutrikim\u0173 d\u0117l per didelio
  kuprin\u0173 svorio. Akejos rezultatus palyginti su keili\u0173 pastar\u0173j\u0173
  met\u0173 rezultatais. |\\n| --- | --- | --- |\\n\\nPrienot\u0117s:\\n\u2713 akcija
  \u201eKa kuprin\u0117je le\u0161i?\u201c; (5, 6 kl.);\\n\u2713 diskusija \u201eAr
  ne per sunki tavo kuprin\u0117?\u201c;\\n\u2713 stendas \u2013 \u201eAr tinkamai
  pasiruo\u0161ei mokyklai?\u201c\\n\\n| IV sav. | Rugpj\u016b\u010dio 29 d. Pasaulin\u0117
