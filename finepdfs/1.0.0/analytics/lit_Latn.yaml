  Vilnius\\nTel. (8 5) 278 0900\\nFaks. (8 5) 275 1155\"", "\"PATVIRTINTA Direktoriaus
  2015 m. gegu\u017e\u0117s 15 d. \u012fsak. Nr. M-206\\n\\nV\u0160\u012e ALANTOS
  TECHNOLOGIJOS IR VERSLO MOKYKLOS MOKINI\u0172 PRI\u0116MIMO TVARKA 2015-2016 MOKSLO
  METAMS\\n\\nI. MOKINI\u0172 PRI\u0116MIMO BENDROSIOS NUOSTATOS\\n\\n1.\\n\\nMokini\u0173
  pri\u0117mim\u0105 \u012f mokykl\u0105 organizuoja ir vykdo mokini\u0173 pri\u0117mimo
  komisija, tvirtinama mokyklos direktoriaus \u012fsakymu. Komisija svarsto stojan\u010di\u0173
  asmen\u0173 pra\u0161ymus, pos\u0117d\u017eiai vyksta ne re\u010diau kaip kas 14
  dien\u0173. Pos\u0117d\u017ei\u0173 datos tvirtinamos direktoriaus \u012fsakymu.
  Komisijos sprendimas \u012fra\u0161omas pos\u0117d\u017eio protokole (forma pridedama).\\n2.
  Pra\u0161ymai mokykloje priimami nuo gegu\u017e\u0117s 20 iki rugs\u0117jo 1 dienos.
  Pra\u0161ym\u0173 pri\u0117mimas prat\u0119siamas tik pagal t\u0105 program\u0105,
  jeigu yra laisv\u0173 viet\u0173.\\n3. Asmenys priimami mokytis pagal profesinio
  mokymo programas mokini\u0173 pri\u0117mimo komisijos sprendimu, atsi\u017evelgus
  \u012f j\u0173 i\u0161silavinim\u0105 ir/ar mokymosi pasiekimus, sveikatos b\u016bkl\u0119,
  motyvacij\u0105, specifini\u0173 geb\u0117jim\u0173 tinkamum\u0105 pasirinktai profesinio
  mokymo programai.\\n4. Jeigu asmuo nepriimamas mokytis \u012f pasirinkt\u0105 profesinio
  mokymo program\u0105, nepri\u0117mimo argumentai i\u0161d\u0117stomi ra\u0161tu,
  o pateikti dokumentai gr\u0105\u017einami po mokini\u0173 pri\u0117mimo komisijos
  pos\u0117d\u017eio.\\n5. Mokini\u0173, priimam\u0173 mokytis pagal profesinio mokymo
  programas, i\u0161silavinimo reikalavimus nustato profesinio mokymo program\u0173
  reikalavimai.\\n6. Mokytis pagal formaliojo profesinio mokymo programas priimami
  \u012f:\\n6.1. profesinio mokymo programas kartu su pagrindinio ugdymo programos
  II dalimi. Asmenys nuo 14 iki 16 met\u0173, ne\u012fgij\u0119 pagrindinio i\u0161silavinimo,
  priimami mokytis pagal \u0161ias programas.\\n6.2. profesinio mokymo programas kartu
  su vidurinio ugdymo programa. Priimami mokytis \u012fgij\u0119 pagrindin\u012f i\u0161silavinim\u0105.\\n6.3.
  profesinio mokymo programas:\\n6.3.1. asmenys, turintys vidurin\u012f i\u0161silavinim\u0105
  ar tik baig\u0119 vidurinio ugdymo program\u0105 pagal vieneri\u0173, vieneri\u0173
  su puse ar dvej\u0173 met\u0173 profesinio mokymo programas\\n6.3.2. asmenys, baig\u0119
  pagrindinio ugdymo program\u0105, ta\u010diau negav\u0119 pagrindinio ugdymo pasiekim\u0173
  pa\u017eym\u0117jimo, pagal trej\u0173 met\u0173 profesinio mokymo program\u0105,
  \u012fgyjant profesij\u0105.\\n6.3.3. asmenys, baig\u0119 pagrindinio ugdymo program\u0105
  pagal individualizuot\u0105 program\u0105 pagal trej\u0173 met\u0173 profesinio
  mokymo program\u0105.\\n7. Asmenys, j\u0173 pageidavimu, gali b\u016bti priimami
  mokytis pagal suaugusi\u0173j\u0173 vidurinio ugdymo program\u0105 (neakivaizdiniu
  mokymo proceso organizavimo b\u016bdu).\\n8. Pirmumo teise priimami: asmenys, turintys
  auk\u0161tesnius mokymosi pasiekimus; na\u0161lai\u010diai; vaikai, turintys r\u016bpintojus;
  vaikai, atlik\u0119 teismo skirtas bausmes.\\n9. Mokini\u0173 pri\u0117mimas \u012f
  mokykl\u0105 tvirtinamas mokyklos direktoriaus \u012fsakymu. Mokymo sutartis sudaroma
  iki pirmosios mokymosi dienos.\\n10. Mokinys, priimtas \u012f mokykl\u0105, bet
  per 10 dien\u0173 nuo mokymosi prad\u017eios be pateisinamos prie\u017easties neprad\u0117j\u0119s
  lankyti pamok\u0173, mokyklos direktoriaus \u012fsakymu i\u0161braukiamas i\u0161
  mokini\u0173 s\u0105ra\u0161\u0173. Apie tai mokinys ir/ar jo t\u0117vai/r\u016bpintojai
  informuojami ra\u0161tu.\\n11.\\nMokiniai per mokslo metus priimami \u012f laisvas
  vietas mokyklos direktoriaus \u012fsakymu.\\n\\nII. DOKUMENT\u0172 PATEIKIMAS\\n\\n12.
  Dokumentus priima, registruoja tam tikslui skirtame \u017eurnale ir \u012fvertina
  dokument\u0173 pri\u0117mimo komisija.\\n13. Stojantieji \u012f mokykl\u0105 dokument\u0173
  pri\u0117mimo komisijai pateikia \u0161iuos dokumentus:\\n13.1. pra\u0161ym\u0105,
  kuriame nurodoma pasirinkta mokymo programa ir/ar bendrojo lavinimo programa;\\n13.2.
  mokymosi pasiekimus \u012fteisinan\u010dius dokumentus;\\n13.3. sveikatos pa\u017eym\u0117jim\u0105
  (086 /a forma).;\\n13.4. Vaiko sveikatos pa\u017eym\u0117jim\u0105 (027-1a forma
  \u2013 pateikia stojantieji mokytis pagal profesinio mokymo kartu su pagrindinio
  ir vidurinio ugdymo programas);\\n13.5. dvi fotonuotraukas (3x4 cm);\\n13.6. pas\u0105/asmens
  tapatyb\u0117s kortel\u0119 arba gimimo liudijim\u0105 (pateikia komisijai asmeni\u0161kai);\\n\\n13.7.
  \u012fgyt\u0105 kvalifikacij\u0105 patvirtinant\u012f dokument\u0105 (pateikia asmenys,
  kurie jau yra \u012fgij\u0119 kvalifikacij\u0105).\\n\\n13.8. u\u017esienio kalbos
  kalbin\u0117s kompetencijos lygio nustatymo pa\u017eyma (pateikia norintys mokytis
  pagal profesinio mokymo kartu su vidurinio ugdymo programa);\\n13.9. \u012f mokykl\u0105
  priimami u\u017esienie\u010diai, pateikia dokumentus, patvirtinan\u010dius j\u0173
  teis\u0119 laikinai ar nuolat gyventi Lietuvos Respublikoje.\\n14. Karo prievolininkai
  pateikia \u0161auktinio liudijim\u0105 arba karo prievolininko status\u0105 liudijant\u012f
  dokument\u0105.\\n15. Speciali\u0173j\u0173 ugdymosi poreiki\u0173 asmenys iki 21
  met\u0173 turi pateikti pedagogini\u0173 psichologini\u0173 tarnyb\u0173 pa\u017eymas
  d\u0117l program\u0173 pritaikymo.\\n16. Baigusieji (adaptuot\u0105, individualizuot\u0105,
  pritaikyt\u0105) pagrindinio ugdymo program\u0105 pateikia pa\u017eym\u0105 apie
  pagrindinio ugdymo programos baigiamosios klas\u0117s bendrojo lavinimo dalyko \u2013(\u0173)
  programos \u2013(\u0173) mokymosi pasiekimus (ko i\u0161moko).\\n17. Stojantieji,
  pateik\u0119 dokumentus, informuojami apie j\u0173 pra\u0161ym\u0173 svarstymo laik\u0105.\\n18.
  Asmuo, kuris mok\u0117si, ta\u010diau ne\u012fgijo pirmosios kvalifikacijos ir siekia
  po pertraukos toliau mokytis, pateikia pra\u0161ym\u0105 iki einam\u0173j\u0173
  met\u0173 rugs\u0117jo 1 d., nurodydamas atitinkam\u0105 profesinio mokymo programos
  dal\u012f.\\n19. Asmuo, turintis kvalifikacij\u0105 ar \u012fgysiantis j\u0105 iki
  mokymo sutarties pasira\u0161ymo, privalo mokyklai pateikti tai \u012frodan\u010dius
  dokumentus.\\n\\n__________________________________\"", "\"ISAKYMAS\\nD\u0116L SKUODO
