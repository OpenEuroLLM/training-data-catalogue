  2247                                                                |\\n| -                                                                   |\\n|
  -                                                                   |\\n| 7                                                                   |\\n|
  150,08                                                              |\\n\\nAtrankin\u0117s
  mamografin\u0117s patikros d\u0117l kr\u016bties v\u0117\u017eio programa skirta
  moterims nuo 50 iki 69 met\u0173. Pagal program\u0105 kart\u0105 per dvejus metus
  atliekamas mamografinis tyrimas, leid\u017eiantis tiksliai diagnozuoti v\u0117\u017e\u012f
  ar ikiv\u0117\u017einius pakitimus. Mamografijos tyrimui galima u\u017esiregistruoti
  i\u0161 anksto gavus \u0161eimos gydytojo siuntim\u0105.\\n\\nPrie\u0161in\u0117s
  liaukos (prostatos) v\u0117\u017eio ankstyvosios diagnostikos programa skirta vyrams
  nuo 50 iki 75 met\u0173 bei vyrams nuo 45 met\u0173, kuri\u0173 t\u0117vai ar broliai
  yra sirg\u0119 prostatos v\u0117\u017eiu. Pagal \u0161i\u0105 program\u0105 kart\u0105
  per dvejus metus atliekamas kraujo tyrimas, parodantis prostatos specifinio antigeno
  (toliau - PSA) koncentracij\u0105 kraujyje. Jei PSA kiekis vir\u0161ija norm\u0105,
  \u0161eimos gydytojas siun\u010dia konsultuotis pas urolog\u0105, o \u0161is prireikus
  atlieka tam tikr\u0105 tyrim\u0105 \u2013 prie\u0161in\u0117s liaukos biopsij\u0105.
  Padid\u0117j\u0119s PSA kiekis leid\u017eia tik i\u0161 anksto nusp\u0117ti prie\u0161in\u0117s
  liaukos v\u0117\u017e\u012f, o jos biopsija yra vienintelis b\u016bdas objektyviai
  patvirtinti arba paneigti \u0161ios ligos diagnoz\u0119.\\n\\nStorosios \u017earnos
  v\u0117\u017eio ankstyvosios diagnostikos programa skirta 50\u201374 met\u0173 am\u017eiaus
  asmenims, kurios tikslas \u2013 kuo anks\u010diau nustatyti storosios \u017earnos
  v\u0117\u017e\u012f. Storosios \u017earnos v\u0117\u017eys yra\\n\\nviena onkologini\u0173
  lig\u0173, kuria Lietuvoje sergama da\u017eniausiai. Kiekvienais metais nustatoma
  apie 1500 nauj\u0173 ligos atvej\u0173 ir j\u0173 kasmet daug\u0117ja. Jei nustatomas
  ankstyv\u0173j\u0173 stadi\u0173 storosios \u017earnos v\u0117\u017eys, jo gydymas
  gali b\u016bti efektyvus. Deja, pacientas ilgai nejau\u010dia joki\u0173 ligos po\u017eymi\u0173,
  tod\u0117l da\u017enai Lietuvoje aptinkamas IV stadijos storosios \u017earnos v\u0117\u017eys,
  kurio ne\u012fmanoma i\u0161gydyti visi\u0161kai. \u0160i programa Utenos regione
  \u012fgyvendinama nuo 2014 m. liepos 1 d.\\n\\nGimdos kaklelio v\u0117\u017eio ankstyvosios
  diagnostikos programa tai valstybin\u0117 gimdos kaklelio piktybini\u0173 navik\u0173
  prevencijos programa, finansuojama Privalomojo sveikatos draudimo fondo l\u0117\u0161omis.
  \u0160ios programos tikslas \u2013 suma\u017einti Lietuvos moter\u0173 sergamum\u0105
  gimdos kaklelio piktybiniais navikais ir mirtingum\u0105 nuo j\u0173. Pagal \u0161i\u0105
  program\u0105 privalomuoju sveikatos draudimu apdraustoms 25 \u2013 60 met\u0173
  moterims nemokamai vien\u0105 kart\u0105 per 3 metus atliekamas citologinis gimdos
  kaklelio tyrimas, kitaip vadinamas PAP testu. Jei \u0161io tyrimo rezultatas patologinis,
  pacient\u0117 siun\u010diama specializuotai ginekologinei pagalbai \u2013 diagnozei
  patikslinti ir gydyti. Tuomet V\u0161\u012e Utenos ligonin\u0117je suteikiama gimdos
  kaklelio biopsijos ir jos rezultat\u0173 \u012fvertinimo paslauga, j\u0105 teikia
  gydytojas aku\u0161eris ginekologas, vadovaudamas Lietuvos Respublikos sveikatos
  apsaugos ministro 2004 m. liepos 16 d. \u012fsakymu Nr. V-548 \u201eD\u0117l Atrankin\u0117s
  patikros d\u0117l gimdos kaklelio patologijos programos atlikimo metodikos patvirtinimo\u201c.\\n\\n**Paslaug\u0173
  prieinamumas**\\n\\nStacionarini\u0173, ambulatorini\u0173 ir ypatingai specializuot\u0173
  asmens sveikatos prie\u017ei\u016bros paslaug\u0173 **prieinamumas** yra vienas
  sveikatos prie\u017ei\u016bros kokyb\u0117s vertinimo sudedam\u0173j\u0173 rodikli\u0173.
  Kokyb\u0117s suvokimas ir vertinimas \u012ftakoja sveikatos prie\u017ei\u016bros
  proceso dalyvi\u0173 (politik\u0173, medik\u0173, pacient\u0173, vadybinink\u0173,
  tiek\u0117j\u0173) elgsen\u0105, o pastaroji \u2013 sveikatos prie\u017ei\u016bros
  tinkamumo suvokim\u0105. Visa tai formuoja pacient\u0173 l\u016bkes\u010dius, kurie
  ne visada atspindi poreikius sveikatos prie\u017ei\u016brai ir koreliuoja su jos
  rezultatais. Siekiant u\u017etikrinti auk\u0161t\u0105 ir visapusi\u0161k\u0105
  sveikatos prie\u017ei\u016bros paslaug\u0173 kokyb\u0119, didelis d\u0117mesys skiriama
  sveikatos prie\u017ei\u016bros prieinamumui.\\n\\nSiekiant pagerinti stacionarini\u0173
  paslaug\u0173 prieinamum\u0105, 2015 m. gydytojai ortopedai traumatologai \u012fsisavino
  smulki\u0173j\u0173 s\u0105nari\u0173 t.y. \u010diurnos artroskopines operacijas.
  Artroskopin\u0117s operacijos prana\u0161umai: nelieka rand\u0173; pacientas gydymo
  \u012fstaigoje praleid\u017eia dvi valandas ir i\u0161ra\u0161omas tolimesniam ambulatoriniam
  gydymui bei steb\u0117jimui; atsigauti po operacijos ir gr\u012f\u017eti \u012f
  visavert\u012f gyvenim\u0105 pakanka ambulatorin\u0117s reabilitacijos; pacientai
  po artroskopini\u0173 operacij\u0173 sveiksta gana greitai: da\u017eniausiai pakanka
  savait\u0117s, kartais \u2013 trij\u0173, ir \u017emogus gali gr\u012f\u017eti prie
  kasdien\u0117s veiklos; tai yra tausojan\u010dios operacijos.\\n\\nGydytojai chirurgai
  prad\u0117jo atlikti laparoskopines hernioplastikas, apendektomijas. Privalumai:
  lengvai toleruojama, tausojant \u017emogaus organizm\u0105, po jos paprastai nereikia
  analgetik\u0173, grei\u010diau gyja, ma\u017eesn\u0117s kraujosr\u016bvos, nelieka
  rand\u0173, suma\u017e\u0117ja komplikacij\u0173 ir infekcij\u0173\\n\\nrizika,
  nedidel\u0117 pooperaciniai s\u0105aug\u0173 tikimyb\u0117, trumpesnis pooperacinis
  laikotarpis.\\n\\nAtaskaitiniu laikotarpiu gydytojas urologas V. Usovas atliko laparoskopin\u0119
  pieloplastik\u0105. Tai sud\u0117tinga laparoskopin\u0117 operacija, kuri pavyko
  s\u0117kmingai, be komplikacij\u0173. Pacientas jau po keli\u0173 dien\u0173 i\u0161vyko
  \u012f namus.\\n\\nGydytojas otorinolaringologas M. Groblys prad\u0117jo daryti
  gomurio plastik\u0105 (uvuliopalatofaringoplastika) d\u0117l knarkimo (miego apn\u0117jos).
  Operacija atliekama taikant bendrin\u0119 nejautr\u0105 ir vidutini\u0161kai trunka
  iki 1,5 val. Toki\u0173 operacij\u0173 efektyvumas ma\u017edaug 70-80 proc.\\n\\nSiekiant
  pagerinti ambulatorini\u0173 paslaug\u0173 prieinamum\u0105, vykdoma konsultaciniai
  ambulatoriniai asmens sveikatos prie\u017ei\u016bros paslaug\u0173 steb\u0117sena,
  duomenys apie trumpiausias ir ilgiausias cilies pas gydytojus specialistus teikiami
  Panev\u0117\u017eio teritorinei ligonijai kasai (5 lentel\u0117).\\n\\n5 lentel\u0117.
