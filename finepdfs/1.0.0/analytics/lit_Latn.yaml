  nebeatnaujinti; taip pat \u012fsp\u0117ta, kad nesilaikant \u0161io nurodymo bus
  skirta bauda. Likusias Rechtbank sprendimo dalis jis panaikino, o EPAL reikalavimus
  atmet\u0117 2 . Teismas, kiek tai reik\u0161minga kasaciniame procese, pateik\u0117
  toliau i\u0161d\u0117stytus motyvus.\\n\\nRechtbank nustatytas draudimas nebuvo
  apsk\u0173stas, kiek jis susij\u0119s su pad\u0117kl\u0173, kuriuos PHZ suremontavo
  pati ir kuri\u0173 atveju remontas apima \u201eb\u016bkl\u0117s pakeitimus, kurie
  n\u0117ra nereik\u0161mingi\\\", kaip tai suprantama pagal Beniliukso Teisingumo
  Teismo sprendim\u0105 Valeo, komercializavimu (3.2 punktas).\\n\\nNagrin\u0117jami
  europad\u0117klai \u012f apyvart\u0105 buvo i\u0161leisti paties preki\u0173 \u017eenklo
  savininko arba su jo sutikimu. Atsi\u017evelgiant \u012f \u0161ioje byloje dar taikytino
  2009 m. vasario 26 d. Tarybos reglamento Nr. 207/2009 (toliau \u2013 BP\u017dR)
  13 straipsn\u012f, u\u017edrausti tolesn\u012f komercializavim\u0105 EPAL gali tik
  tuo atveju, kai d\u0117l pagr\u012fst\u0173 prie\u017eas\u010di\u0173 nesutinka
  su tolesniu pad\u0117kl\u0173 komercializavimu, ypa\u010d jeigu i\u0161leidus juos
  \u012f rink\u0105 pasikeit\u0117 arba pablog\u0117jo j\u0173 kokyb\u0117 (3.6 punktas).\\n\\nPer
  pos\u0117d\u012f apeliacin\u0117je instancijoje EPAL paai\u0161kino, kad pakeitim\u0105,
  kaip jis suprantamas pagal BP\u017dR 13 straipsnio 2 dal\u012f, sudaro pad\u0117kl\u0173
  sugadinimas prie\u0161 remont\u0105 \u2013 taigi, ne pats remontas. (Tod\u0117l)
  EPAL nebelaiko remonto b\u016bkl\u0117s pakeitimu. Tai rei\u0161kia, kad preki\u0173
  \u017eenklo pa\u017eeidimu grind\u017eiamas reikalavimas negali b\u016bti patenkintas
  remiantis BP\u017dR 13 straipsnio 2 dalyje\\n\\n1 <...> (Pirmosios instancijos teismo
  sprendimo \u0161altinis nenurodomas).\\n\\n2 <...> (Apeliacin\u0117s instancijos
  teismo sprendimo \u0161altinis nenurodomas).\\n\\napibr\u0117\u017etais pakeitimais,
  nes EPAL neteig\u0117 ir nematyti, kad PHZ prekiavo sugadintais pad\u0117klais (4.2\u20134.3
