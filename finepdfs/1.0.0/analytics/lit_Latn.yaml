  atostogose.\\n\\n6. DARBUOTOJ\u0172 SKAI\u010cIAUS DINAMIKA\\n\\n\u012estaigos tikslus
  pasiekti gali tik i\u0161silavin\u0119s, kvalifikuotas, darniai dirbantis personalas.
  Pagal Pasaulin\u0117s sveikatos organizacijos nuostatas, \u017emogi\u0161kieji i\u0161tekliai
  yra strateginis sveikatos prie\u017ei\u016bros sistemos kapitalas ir sveikatos prie\u017ei\u016bros
  paslaug\u0173 kokyb\u0117 priklauso nuo jas teikian\u010di\u0173j\u0173 sugeb\u0117jim\u0173,
  kvalifikacijos ir motyvacijos.\\n\\nDarbuotoj\u0173 skai\u010diaus dinamika 2014-2015
  metais atspindi 14 lentel\u0119.\\n\\n14 lentel\u0117. Darbuotoj\u0173 skai\u010diaus
  dinamika 2014-2015 metais\\n\\n| Rodiklis | 2014 m. | 2015 m. |\\n|----------|---------|---------|\\n|          |
  sausio 1 d. | gruod\u017eio 31 d. | sausio 1 d. | gruod\u017eio 31 d. |\\n| Fiziniai
  asmen\u0173 skai\u010dius | 464 | 469 | 469 | 456 |\\n| Etat\u0173 skai\u010dius
  | 481,75 | 475,19 | 475,19 | 468,5 |\\n\\nKelet\u0105 pastar\u0173j\u0173 met\u0173
  vyksta nat\u016brali darbuotoj\u0173 kaita, kai pensinio am\u017eiaus darbuotojus,
  i\u0161einan\u010dius i\u0161 darbo, kei\u010dia jauni. Vertinant strateginiu po\u017ei\u016briu
  tai yra stiprioji \u012fstaigos pus\u0117. Viena vertus, vyresni darbuotojai turi
  sukaup\u0119 didel\u0119 patirt\u012f, kita vertus, sunkiau priima naujoves, jiems
  tenkan\u010dius i\u0161\u0161\u016bkius ir n\u0117ra tokie iniciatyv\u016bs. Jaunesni
  darbuotojai turi ma\u017eiau patirties ir \u012fg\u016bd\u017ei\u0173,\\n\\nta\u010diau
  jie imlesni naujov\u0117ms, geba geriau prisitaikyti prie kintan\u010di\u0173 s\u0105lyg\u0173,
  turi naujausias teorines \u017einias, geriau orientuojas informacijos gausyb\u0117je
  ir naujose technologijose.\\n\\nI\u0161 darbo 2015 m. i\u0161\u0117jo 9 ilgame\u010diai
  pensinio am\u017eiaus gydytojai:\\n\\n- infektologas;\\n- neurologas;\\n- 2 aku\u0161eriai
  ginekologai;\\n- vaik\u0173 lig\u0173 gydytojas;\\n- fizin\u0117s medicinos ir reabilitacijos
  gydytojas;\\n- gydytojas chirurgas, echoskopuotojas;\\n- gydytojas radiologas;\\n-
  vidaus lig\u0173 gydytojas.\\n\\nAtaskaitiniu laikotarpiu atleistus pensinio am\u017eiaus
  darbuotojus pakeit\u0117 jauni gydytojai specialistai: gydytojas infektologas, vaik\u0173
  lig\u0173 gydytojas, fizin\u0117s medicinos ir reabilitacijos gydytojas.\\n\\nPer
  2015 m. V\u0161\u012e Utenos ligonin\u0117je buvo \u012fdarbinti 33 darbuotojai
  (pirmaeil\u0117se pareigose \u2013 22), atleisti 46 darbuotojai (pirmaeil\u0117se
  pareigose \u2013 29).\\n\\nPagrindinis darbuotoj\u0173 kompetencijos elementas yra
  i\u0161silavinimas. Utenos ligonin\u0117s darbuotojai yra i\u0161silavin\u0119 ir
  pakankamai kvalifikuoti. Beveik visi gydytojai turi po dvi ir daugiau licencij\u0173,
  tobulinasi ne tik Lietuvoje, bet ir u\u017esienyje. Vienas tre\u010ddalis slaugytoj\u0173
  turi auk\u0161t\u0105j\u012f i\u0161silavinim\u0105.\\n\\nI\u0161silavinimas svarbus
  darbuotojo kompetencijai, ta\u010diau vien tik jo efektyviam darbui nepakanka. Aplinkoje
  vykstantys poky\u010diai reikalauja \u012fgyvendinti mokymosi vis\u0105 gyvenim\u0105
  u\u017etikrinimo strategij\u0105. I \u0161ioje mokymosi samprataje j\u0117gina tiek
  formalusis, tiek neformalusis mokymasis, \u012fgyjant pagrindin\u012f profesin\u012f
  i\u0161silavinim\u0105, keliant kvalifikacij\u0105, persikvalifikuojant, lavinant
  darbuotoj\u0173 profesines ir bendr\u0105sias kompetencijas. Esant pakankamai i\u0161vystytomis
  neformalaus mokymo strukt\u016broms, dalis darbuotoj\u0173 tobulina ne tik savo
  profesin\u0119 kvalifikacij\u0105, kuri reikalinga licencijai gauti bei perregistruoti,
  ta\u010diau ugado savo bendrusius geb\u0117jimus: mokosi bendravimo su pacientais
  ir bendradarbiavimo \u012fg\u016bd\u017ei\u0173, lavina kompiuterinio ra\u0161tingumo
  \u012fg\u016bd\u017eius. Tai skatina darbuotoj\u0173 savigarb\u0105, didina j\u0173
  motyvacij\u0105.\\n\\n2014 m. i\u0161va\u017eiuojamuosiuose kursuose kvalifikacij\u0105
  k\u0117l\u0117 99 \u012fstaigos darbuotojai, 2015 m. - 198. Bendradarbiaujant su
  Utenos kolegija bei Lietuvos Sveikatos moksl\u0173 universitetu, pritraukiant projektines
  l\u0117\u0161as, 2015 m. \u012fstaigoje organizuota 13 konferencij\u0173, seminar\u0173
  bei kit\u0173 form\u0173 mokymo kurs\u0173, kuriuose savo kvalifikacij\u0105 tobulino
  603 darbuotojai. 2015 m. did\u017eiulis d\u0117mesys skirtas kompiuterinio ra\u0161tingumo
  \u012fg\u016bd\u017ei\u0173 \u012fgijimui ir tobulinimui. Utenos kolegijos informacin\u0173
  technologij\u0173 auditorijoje vykdyti projektiniai mokymai \u201eInformacini\u0173
  komunikacini\u0173 technologij\u0173\\n\\nnaudojimo ir valdymo \u012fg\u016bd\u017ei\u0173
  tobulinimas\u201c pagal asmens sveikatos prie\u017ei\u016bros specialistams skirt\u0105
  162 val. neformaliojo \u0161vietimo program\u0105. Vykdant projekt\u0105 \u201eElektronini\u0173
  sveikatos prie\u017ei\u016bros paslaug\u0173 pl\u0117tra Utenos regiono asmens sveikatos
  prie\u017ei\u016bros \u012fstaigose (VP2-3.1-IVPK-11-V-01-008), organizuoti dviej\u0173
  dali\u0173 po 16 val. mokymai \u201eSveikatos prie\u017ei\u016bros \u012fstaigos
  informacin\u0117s sistemos naudotoj\u0173 mokymai\u201c (I dalis - 195 darbuotojai,
  II dalis - 119 darbuotoj\u0173).\\n\\nDalis darbuotoj\u0173 dalyvavo bendravimo
  su pacientais sud\u0117tingose ir konfliktin\u0117se situacijose mokymuose. Mokym\u0173
  metu buvo mokoma taikyti konflikt\u0173 ir streso valdymo priemones, suprasti pacientus,
  kalb\u0117ti \u201evertybi\u0173 kalba\u201c, \u012fgyti efektyvaus bendravimo ir
  konstruktyvaus problem\u0173 sprendimo \u012fg\u016bd\u017ei\u0173.\\n\\nVisi \u012fstaigoje
  dirbantys gydytojai, aku\u0161er\u0117s ir slaugytojai, Lietuvos Respublikos \u012fstatym\u0173
  nustatyta tvarka turi licencijas, suteikian\u010dias teis\u0119 versti gydytojo,
  aku\u0161erio ir bendraja slaugos praktika.\\n\\nPa\u017eym\u0117tina, kad siekiant
  toliau gerinti sveikatos prie\u017ei\u016bros paslaug\u0173 kokyb\u0119, planuojant
  \u017emogi\u0161kuosius i\u0161teklius (atsi\u017evelgiant \u012f darbuotoj\u0173
  am\u017ei\u0173 bei siekiant u\u017etikrinti gydytoj\u0173 pakei\u010diamum\u0105),
  \u012fstaiga \u012fdarbint\u0173 \u0161i\u0173 specialyb\u0173 gydytojus: gydytojas
  radiologas \u2013 2; gydytojas oftalmologas \u2013 1; gydytojas aku\u0161eris ginekologas
  \u2013 2; fizin\u0117s medicinos ir reabilitacijos gydytojas \u2013 1; gydytojas
  anesteziologas reanimatologas \u2013 1; vidaus lig\u0173 gydytojas \u2013 2.\\n\\nDarbuotoj\u0173
  darbo sauga. Vadovaujantis Lietuvos Respublikos socialin\u0117s apsaugos ir darbo
  ministro ir Lietuvos Respublikos sveikatos apsaugos ministro 2012 m. spalio 25 d.
  \u012fsakymu Nr. A1-457/V-961 patvirtintais Profesin\u0117s rizikos vertinimo nuostatais,
  kasmet atliekamas profesin\u0117s rizikos vertinimas:\\n\\n- Indentifikuojami esami
  ir galimi rizikos veiksni\u0173 darbo vietose;\\n- Nustatomi darbuotojai, kuriems
  kyla pavojus d\u0117l j\u0173 veiklos;\\n- Surenkama informacija apie ligonin\u0117je
  \u012fvykusius nelaimingus atsitikimus, profesines ligas, profilaktinius sveikatos
  patikrinimus;\\n- Atliekama darbuotoj\u0173 apklausa apie rizikos veiksnius j\u0173
  darbo vietose;\\n- Nustatomas rizikos dydis ir nusprend\u017eiama ar rizika priimtina,
  toleruotina ar nepriimtina;\\n- Numatomos rizikos \u0161alinimo ir ma\u017einimo
  priemon\u0117s;\\n- Rizikos \u0161alinimo ir ma\u017einimo priemoni\u0173 planas
  aptariamas su darbuotojais.\\n\\nRizikos vertinimas atliktas visose darbo vietose,
  stebint darbo aplink\u0105 ir atliekamus darbus, kalbantis ir konsultuojantis su
  darbuotojais, \u012fvertinant turim\u0105 informacij\u0105, dalyvaujant darbuotoj\u0173
  atstovams, darbuotoj\u0173 atstovams saugai ir sveikatai, vadovaujantis 2013-2014
  metais nustatytais rizikos veiksniais vertinant darbo viet\u0173 profesin\u0119
  rizik\u0105. Nenustatyta darbuotoj\u0173 dirban\u010di\u0173 didel\u0117s rizikos
  ar nepriimtinos rizikos s\u0105lygomis.\\n\\nMedicinos personalas dalyvauja profesin\u0117s
  kvalifikacijos tobulinimo kursuose, mokymuose, susijusiuose su sveikatos sauga.
  Radiacin\u0117s saugos centras apr\u016bpina Radiologijos skyriaus darbuotojus individualiais
  dozimetrais ir atlieka i\u0161orin\u0117s ap\u0161vitos steb\u0117sen\u0105 bei
  kontrol\u0119. Atliekama individuali\u0173 apsaugos priemoni\u0173 patikra. Cheminei
  dezinfekcijai naudojamos tik teis\u0117s akt\u0173 nustatyta tvarka aprobuotos ir
  registruotos med\u017eiagos. Atliekantys dezinfekcij\u0105 darbuotojai yra apmokyti,
  instruktuooti ir naudoja asmenin\u0117s apsaugos priemones. Mokymo kursuose apmokyti
  darbuotoj\u0173 saugos ir sveikatos komiteto nariai.\\n\\nGer\u0173 darbo s\u0105lyg\u0173
  ir patogiai \u012frengt\u0173 darbo viet\u0173 pasiskirstymas \u012fstaigoje yra
  netolygus. Dalis patalp\u0173 renovuota, \u012frengta geros ir patogios darbo vietos,
  apr\u016bpinta moderni\u0173 \u012franga bei darbo priemon\u0117mis, kitur \u2013
  neatliktas remontas, ta\u010diau kasmet pad\u0117tis ger\u0117ja, pagal galimyb\u0119
  ie\u0161koma jvairi\u0173 finansavimo \u0161altini\u0173. 2015 metais renovuotos
  Terapijos klinikos patalpos (pabaigtas IV auk\u0161tas), Konsultacin\u0117je poliklinikoje
  \u012frengtos medicinos darbuotojams persirengimo patalpos, tod\u0117l pager\u0117jo
  medicinos darbuotoj\u0173 darbo s\u0105lygos ir pacient\u0173 prie\u017ei\u016bra.
  Vaik\u0173 lig\u0173 skyriuje suremontuotos 3 palatos, pakeista koridoriuje grind\u0173
  danga, \u017eaidim\u0173 kambarys paremontuotas ir papuo\u0161tas \u017eaismingomis
  interjero detal\u0117mis.\\n\\nStebimas neefektyvus dalies padalinii\u0173 (patalp\u0173)
  i\u0161d\u0117stymas:\\n\\n- Pri\u0117mimo-skubios pagalbos skyriaus \u2013 per
  ma\u017eai patalp\u0173;\\n- Konsultacin\u0117s poliklinikos \u2013 patalpos i\u0161d\u0117stytos
  skirtinguose pastatuose;\\n- Centrin\u0117s sterilizacin\u0117s;\\n- Pulmonologijos
  sektoriaus - n\u0117ra tinkamos jungties su pagrindiniu ligonin\u0117s korpusu,
  kur teikiamos diagnostin\u0117s proced\u016bros ar, reikalui esant, reanimacija;\\n-
  Klinikin\u0117s diagnostikos laboratorijos \u2013 patalp\u0173 i\u0161planavimas
  neatitinka poreiki\u0173;\\n- Hemodializ\u0117s poskyrio \u2013 ambulatoriniams
  pacientams skirtas poskyris tur\u0117t\u0173 b\u016bti I auk\u0161te (\u0161iuo
  metu V auk\u0161te).\\n\\n7. S\u0104NAUDOS VALDYMO I\u0160LAIDOMS\\n\\n15 lentel\u0117.
