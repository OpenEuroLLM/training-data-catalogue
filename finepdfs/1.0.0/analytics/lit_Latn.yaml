  2017 m. | 97                |\\n| 2018 m. | 341               |\\n| 2019 m. | 585               |\\n|
  2020 m. | 137               |\\n\\nV\u012e Turto bankas dalyvauja \u012fgyvendinant
  valstybei nuosavyb\u0117s teise priklausan\u010dio administracin\u0117s paskirties
  nekilnojamojo turto centralizuoto valdymo reform\u0105, kurios strateginiai tikslai
