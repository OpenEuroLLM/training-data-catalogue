  Valymas: 11,9 \u20ac\\n- Kitos eksplotavimo ir administravimo s\u0105naudos: 4,0
  \u20ac\\n- Patalp\u0173 draudimas (TD): 0,4 \u20ac\\n- Patalp\u0173 draudimas (CA):
  0,8 \u20ac\\n\\nIII. V\u012e TURTO BANKO PATIK\u0116JIMO TEISE VALDOMAS VNT\\n\\nThe
  city of Vilnius, the capital of Lithuania, is a vibrant and historic city with a
  rich cultural heritage. It is located in the southeastern part of the country, on
  the banks of the Neris River. The city has a population of over 540,000 people and
  is known for its well-preserved medieval architecture, including the Old Town, which
  is a UNESCO World Heritage Site.\\n\\nVilnius is a popular tourist destination,
  attracting visitors from all over the world who come to explore its stunning architecture,
  delicious cuisine, and lively nightlife. The city is also home to several universities,
  including the University of Vilnius, which is one of the oldest universities in
  Eastern Europe.\\n\\nIn addition to its rich history and culture, Vilnius is also
  known for its beautiful natural surroundings. The city is surrounded by forests
  and parks, making it an ideal place for outdoor activities such as hiking, cycling,
  and picnicking.\\n\\nOverall, Vilnius is a fascinating city that offers something
  for everyone. Whether you''re interested in history, culture, or nature, you''ll
  find plenty to see and do in this charming and vibrant city.\\n\\nIII. V\u012e TURTO
  BANKO PATIK\u0116JIMO TEISE VALDOMAS VNT\\n\\n1. V\u012e Turto banko patik\u0117jimo
  teise valdom\u0173 VNT portfelio ap\u017evalga\\n\\nV\u012e Turto banko patik\u0117jimo
  teise valdom\u0105 VNT sudaro:\\n\\n1. Nekilnojamasis turtas, naudojamas \u012fmon\u0117s
  veikloje (savininko kapital\u0105 atitinkantis NT).\\n2. Centralizuotai valdyti
  perduotas administracin\u0117s paskirties VNT (toliau \u2013 AVNT)\\\\(^{21}\\\\).\\n3.
  Nekilnojamasis turtas, kuris nenaudojamas valstyb\u0117s funkcijoms vykdyti ir kuris
  yra skirtas parduoti:\\n   3.1. turtas, \u012ftrauktas \u012f Vie\u0161\u0105m\u0117s
  aukcione parduodamo valstyb\u0117s nekilnojamojo turto s\u0105ra\u0161\u0105;\\n   3.2.
  turtas, \u012ftrauktas \u012f Atnaujinamo valstyb\u0117s nekilnojamojo turto s\u0105ra\u0161\u0105
  (toliau \u2013 atnaujinamas VNT);\\n   3.3. valstyb\u0117s paveld\u0117tas, konfiskuotas,
  dovanotas ar be\u0161eimininkis turtas (toliau \u2013 valstyb\u0117s paveld\u0117tas
  NT).\\n\\n| Metai | \u012emon\u0117s veikloje naudojamas NT (t\u016bkst. m\\\\(^2\\\\))
