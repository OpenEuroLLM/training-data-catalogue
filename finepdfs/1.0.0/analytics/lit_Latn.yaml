  modifikacijoms\\n\\nPasi\u016blymai modifikacijoms\\n\\nPasi\u016blymai modifikacijoms\\n\\nPasi\u016blymai
  modifikacijoms\\n\\n6. GEOGRAFIJA\\n\\n6.1.\\n\\nPasi\u016blymai modifikacijoms\\n\\nU\u017eduot\u012f
  galima atlikti ir i\u0161 kitos pus\u0117s (de\u0161in\u0117s). \u0160iuo b\u016bdu
  mokiniai tur\u0117t\u0173 sujungti sostin\u0119 su \u0161alimi (vietoje \u0161alies
  su sostine).\\n\\nMokytojas taip pat gali paklausin\u0117ti, naudodamas tik miest\u0173
  pavadinim\u0173 kortas. Pvz., mokytojas paklausia ''''kokia yra Japonijos sostin\u0117?'''',
  o mokinys turi nuridenti kamuoliuk\u0105 prie kortos su teisingu atsakymu.\\n\\nTaip
  pat galima naudoti \u0161i\u0105 u\u017eduot\u012f siekiant \u012fgyti platesnes
  geografijos \u017einias, pvz su kitomis \u0161alimis, miestais (ne tik sostin\u0117mis).\\n\\n7.
  KATALIK\u0172 RELIGIJA\\n\\n7.1.\\n\\n8. ASMENIN\u0116S HIGIENOS PRATIMAI\\n\\n8.1.\"",
  "\"Akloji politika.\\n\\nGal ne vienas nusiteb\u0117s: kaip gali politika buti akla?
  Politika rei\u0161kia daugiau\u2013ma\u017eiau pla\u010di\u0105 visuomen\u0117s
  apydydair\u0105, \u017eiur\u0117jim\u0105 tolyn, \u012f ateit\u012f, kas bus ryto,
  po ryt, u\u017e met\u0173, u\u017e de\u0161imtme\u010di\u0173, ar \u0161imto \u2014
  ir \u0161tai atranda da koki\u0105 akl\u0105 politik\u0105! Kaip aklas budamas gali
  \u017ei\u016br\u0117ti ir da j\u0105 kok\u012f toly, \u012f ateit\u012f! Tai tiesa,
  kad politika negali but akla. Ta\u010diaus kartais (o tie kartai labai tankus) atsitaiko
  teip, kad ypa\u010d tie pasidaro akli, kurie veda pla\u010di\u0105j\u0105, visuomeni\u0161k\u0105j\u0105
  politik\u0105: kapitalist\u0173 ir karali\u0173 valdzia tankiai teip daro, kad rodos
  jie jau ryto po ryt vistiek negyv\u0119s, tai ir rupinasi tik apie \u00abduok mums
  \u0161iandien\u00bb, duok mums \u0161iandien galv\u0119 ir turtus, i\u0161pl\u0117\u0161ius
  i\u0161 badaujan\u010di\u0173 darbinink\u0173 \u0161eimyn\u0173. Jie teip elgiasi,
  kaip vienas pasak\u0117: \u00abPo man\u0119s \u2014 kad ir tvanas!\u00bb Rupi mat,
  kad tik pa\u010diam but gerai; kad tik gal\u0117t\u0173 iki savo galui u\u017elaikyt
  savo rankose valdzi\u0105 ir pl\u0117sti kraut\u012f turtus.\\n\\nCaro valdzia veda
  toki\u0105 akl\u0105 politik\u0105, kad nors caras kasdien dreba u\u017e savo gyvast\u012f,
  ta\u010diaus jis yra juodosios \u0161int\u0117n\u0117s vadov\u0173 ir teip savo
  valdini\u0173 krauto liejim\u0173 ir turto pl\u0117\u0161imu laiko t\u0105 \u00abDievo
  duot\u0105\u00bb jam valdzi\u0105, kol jis busi\u0173s gyvas, \u00abnenusi\u017eengsi\u0105s\u00bb
  prie\u0161 Diev\u0105, nei\u0161si\u017ead\u0117si\u0105s valdzios; paskui \u2014
  kad ir tvanas! Amerikos kapitalist\u0173 valdzia pana\u0161iai elgiasi. Tiesa, ji
  \u0161iek\u2013tiek \u017eiuri \u012f ateit\u012f, bent laukdama ateinan\u010di\u0173
  met\u0173 rinkim\u0173 stengiasi sulaukti visuotin\u0105 kriz\u0119 \u2013 pramon\u0117s
  nupulolinim\u0105 ir visi\u0161k\u0105 darbo sustojim\u0105. Teip daro valdzia,
  arba kapitalist\u0173 seimas. Bet patys kapitalistai n\u0117 tos politikos neturi:
  jie, matomai, ir pramon\u0117s susikr\u0117timu stengiasi daugiau pasinaudoti \u0161iandien,
  nepaisant, kas bus rytoj. Ai\u0161ku, kad prad\u0117jus vienai kuriai pramon\u0117s
  \u0161akai i\u0161tikri\u0173j\u012f siubuoti ir netekus ten darbininkams darbo,
  kai\u2013kurie kit\u012f pabr\u0131kantai, ar kasykl\u0173 savininkai \u2014 kaip
  vario kasykl\u0173, Montanoje \u2014 prad\u0117jo numu\u0161in\u0117ti darbininkams
  u\u017edarbius. Jei, girdi, nesutiksit dirbt u\u017e numa\u017eint\u0105 u\u017emokest\u012f,
  tai mes visai tur\u0117sime netrukus u\u017edaryt dirbtuv\u0117s. Darbininkai bijodami
  visai netekti darbo, sutinka dirbt u\u017e ma\u017eesn\u012f u\u017edarb\u012f.
  Ir numu\u0161a t\u0105, k\u0105 prie\u0161 kelet\u0105 met\u0173 teip sunkiai darbininkai\\n\\ni\u0161kovoj.\\n\\nJeigu
  darbas susima\u017eina, tai pirmiausia kokia dalis darbinink\u0173 netenka darbo,
  arba jei visi lieka prie darbo, tai esti sutrumpinama darbo diena, arba, ant galo,
  dirba dvi partijos, prasikeisdamos, po kokias tris dienas per savait\u0119. Bet
  jeigu lieka tas pats darbo dienos ilgumas, tas pats darbo i\u0161na\u0161umas, tiek
  pat darbinink\u0173, kaip pirmiausia budavo, tai numa\u017einimas u\u017edarbio,
  man rodos, yra tik apipl\u0117\u0161imas darbinink\u0173, yra tik gudrus j\u0173
  baim\u0117s i\u0161naudojimas, lyginai, kaip traukimas pini\u0173 gaudinant pragaru...
  Ir kapitalistai nieko nemato ir n\u0117norii matyt, kas bus toliau, kad i\u0161tikri\u0173j\u0173
  \u012fvyks kriz\u0117s. Tik kai\u2013kurie rupinasi, kas reikia daryt, kad tu bedarbi\u0173
  laiku nei\u0161vykt\u0173 \u201esumi\u0161imai\u201c, nesukilt\u0173 baduoliai...\\n\\nKapitalistin\u0117\u2013vaibiska
  politika ir tada buva akla, kad\u0105 jau kriz\u0117 \u012fvyk\u0119s, kada visuom\u0117n\u0117
  sujudus ir kada grei\u010dia pavojus esan\u010diai tvarkai, vald\u017eiai. Visokios
  g\u0117ryb\u0117s puva sakrovose, o patys j\u0173 sutvertojai\u2013darbininkai bad\u0105
  ir \u0161alt\u012f ken\u010dia; kapitalistai t\u0173 g\u0117rybi\u0173 negal duoti,
  nes nieks netur nuo u\u017emok\u0117t. Badui i\u0161tikus jie stengiasi sunaikinti
  dal\u012f g\u0117rybi\u0173, kad pardavin\u0117t\u0173 kainos (\u010dienios) nenupulyt...
  Kit\u0105 syk, kad nori pakelti kainas ir jeigu tai aprub\u0117\u017eiuoja \u012fstatymai,
  tai kapitalistai nepristato kiek reikia tavyr\u0173. Teip vakarin\u0117se valsstyb\u0117se
  dar\u0117 pernai \u017eiem\u0105 anglies savininkai.\\n\\nTokiomis ir kitokiomis
  gudryb\u0117mis kapitalistai varo savo trumpregi\u0105, o kartais visai akla politika.
  Ir jie su tokia apjakel\u0117 ne\u012fsveigtingimai \u012fjos \u012f skrad\u017eias.
  Darbininkai turi ir \u010dia jiems patarnaut \u2014 pastum\u0117t kiek galint...\\n\\nLietuviu
  moter\u0173 susiva\u017eiavimas Kaune.\\n\\n(Pabaiga).\\n\\nIII. Kova su girtuoklybe.\\n\\nDaug
  moter\u0173 reikia prik\u0117sti nuo vyro girtuoklio, \u016bk\u0117 suvra, duonos
  nebentenka, u\u017edirbti pinigai eina smuklininko ki\u0161en\u0117n; o \u010dia
  vaikams n\u0117ra ko duoti... vis tai moter\u0173 reikia perkent\u0117ti. Skund\u0117si
  moters sodiet\u0117s, kaip jos ken\u010dia, pra\u0161e susirinkimo u\u017etarti,
  skund\u0117si ir jaunos mergait\u0117s ant girtuokli\u0173 broli\u0173 ir t\u0117v\u0173.
  \u2014 P. \u017demait\u0117 kviet\u0117 ne ant vyro mest b\u0117da, bet pa\u010dioms
  moterims nustot g\u0117rus degtine, priv\u0117d\u0117 ji ai\u0161ki\u0173 pavyzd\u017ei\u0173,
  kaip moters geria vestuv\u0117se, krik\u0161tyneose ir kitose balinose, kaip vaikams
  nedraud\u017eia gert, bet da pamokina, kviet\u0117 moteris visai nustot g\u0117rus,
  \u2014 tada ir skatiko atliks ir sveikata bus geresn\u0117 ir ramiau bus. Neteb\u0117tina,
  kad kitos moterys sulyg giryt\u0117s \u012fne\u0161\u0119 labai a\u0161trias re\u017eoliucijas,
  pavyzd\u017eiui \u2014 p. Mila\u0161ait\u0117 pateik\u0117: \u00abVardu viso susirinkimo
  kreiptis pas Kauno gubernatori\u0173 pra\u0161ant u\u017etarimo prie auk\u0161tesn\u0119
  vald\u017ei\u0105, kad panaikint\u0173 monopolius, o degtin\u0117, kad pirsadavin\u0117t\u0173
  tik vaistyni\u0161ciose (aptiekose); teipgi reikia pra\u0161yt, kad perpus b\u016bt\u0173
  u\u017edarysta alud\u017ei\u0173.\u00bb Toki pat pra\u0161ym\u0105 patar\u0117 idot
  ir d\u016bmos asttovams. Varg\u0161\u0117 apsirinko, manydama, kad vald\u017eia
  paklausys tu meldim\u0173; juk daugelyj valsi\u0173 pra\u0161\u0117, kad nors \u0161ventadienis
  b\u016bt\u0173 monopoliai u\u017edarysti, o gubernatorius atsak\u0117, kad negali
  to leist, ir suprantama, \u2014 \u0161ventadieniai keli\u0173 syk didesnis pelnas;
  o apie panaikinim\u0105 monopolij\u0173, tai vald\u017eia ir u\u017emint neduoda,
  juk monopoliai tai vienas i\u0161 svarbiausi\u0173 b\u016bd\u0173 traukt\u012f i\u0161
  \u017emoni\u0173 pinigams. Dauguma i\u0161 susirinkusi\u0173j\u0173 numan\u0117,
  kad neverta gubernatoriui net u\u017esimint apie panaikinim\u0105 monopolij\u0173,
  tai priimta tokia rezoliucija: \u00abIduoti D\u016bmos asttovams peticij\u0105,
  kad monopoliai b\u016btu panaikinti, o degtin\u0117 b\u016bt\u0173 pardavin\u0117jama
  tik aptiekose, kaipo vaistas.\u00bb\\n\\nIV. \u016ak\u0117s pakelimas.\\n\\nGra\u017eiai
  m\u016bs\u0173 moters aud\u017eia. Jaunos mergait\u0117s verpia, meta, paskui aud\u017eia;
  greit pereina \u017eemos vakarai, nenuobodas jie, aud\u017eiant. Apie knyga n\u0117ra
  kada galvoti, kiekviena misija, kaip \u010dia daugiau suaudus, kaip \u010dia gra\u017eiau
  i\u0161ra\u0161ius, kaip daugiau krai\u010dio prisid\u0117jus. S\u0117dint prie
  ratelio akys \u012fsopsta, pir\u0161tai pradyla; aud\u017eiant krutin\u0117 noksta,
  plau\u010diai genda, d\u017eiova \u0161tai jau u\u017e pe\u010di\u0173... O pas
  mus skaitos garsia ta mergait\u0117, kuri gra\u017eiai aud\u017eia, turtinga, kuri
  daug krai\u010dio turi.\\n\\nBet paskutiniame laike tykios mergait\u0117s pasileido,
  patingo avst, vis \u017ei\u016bri, kaip \u010dia i\u0161 \u201e\u017edo\u201c nusipirkus
  ir gra\u017eiau apsisaitius; jau atsiranda ir tokiai, kurios pradena niekint audimus;
  geriaus, sako, vilnas parduot ir paskui nusipirk, daugiau laiko atliks knygai paskaityt.
  Susivaziaivimo \u012freng\u0117jos audim\u0173 nykme pamat\u0117 t\u0117vyn\u0117s
  pra\u017eiut\u012f ir u\u017emaun\u0117 pamokint susirinkius. Tam tikslui buvo parengti
  keli referatai: \u00abApie namin\u0119 \u016bk\u0119\u00bb \u2014 Roba\u0161auskien\u0117s,
  \u00abApie namin\u0119 amatinkyst\u0119, b\u016btentaud\u0117jyst\u0119\u00bb \u2014
  Lebkauskien\u0117s, \u00abApie rank\u0173 i\u0161dirbini\u0173 mokyklas\u00bb \u2014
  \u010cumkyt\u0117s. \u2014 Labai keistai skamb\u0117jo tie referatai, pirmo kalb\u0117jo
  apie moter\u0173 varging\u0105 pad\u0117jim\u0105, skund\u0117s, kad jos u\u017everstos
  \u016bk\u0117s darbai, neturin\u010dios, kada atsilis\u010d\u0117t, kalb\u0117jo,
  kad moterims reikia ap\u0161vietimo, mokykl\u0173, o dabar daugiau nori moterims
  u\u017eduot darbo, ragina v\u0117l per naktis verpt, dienoms aust, rankdarbiu\u0161i
  u\u017esimt. U\u017emir\u0161o, kad tik tada moterys gal\u0117s susilygint su vyru
  ir u\u017eimt jo vietas, kuomet prasiplatinus kapitalizm\u0173 ma\u017eiau bereik\u0117s
  u\u017esiimint naminiu \u016bkiu, kuomet \u012fvykus didesniams darbo pasidalinimui,
  visk\u0105 galima bus u\u017e pinigus pirkt, \u2014 tuomet tai moteris atsitraukus
  nuo pe\u010di\u016bnas, staikli\u0173, ratelio ir kartu su vyru eis \u012f pabrik\u0105,
  kontor\u0105, mokykl\u0105 ir parlament\u0105. O m\u016bs\u0173 susivaziaivimo \u012freng\u0117jos
  si\u016bl\u0117 moterims da labiau prisiri\u0161ti prie namin\u0117s \u016bk\u0117s,
  namie dirbt t\u0105, k\u0105 galima pigiau nusipirkti i\u0161 pabrik\u0173; si\u016bl\u0117
  austi naminius audeklus, o pa\u010dios d\u0117v\u0117jo pabrakiniais; \u2014 o kitos
  matomai pa\u010dios nor\u0117jo i\u0161 to pasinaudot: teip, viena gyv\u0117s, kad
  esanti baigus rankdarbi\u0173 mokykl\u0105 ir galinti dabar kitus pamokinti; kita
  moteris (i\u0161 Duset\u0173 parapijos) parod\u0117 savo darbo skar\u0105; skara
  daili, \u0161ilta, darbas geras. Paklaussta, kiek ji apskai\u010dius darb\u0105,
  vilnas ir tt. \u012fkainot\u0173 skar\u0105, atsak\u0117, \u2014 11 rublius. O i\u0161
  krautv\u0117s tokia pat skara galima b\u016bt\u0173 nusipirkt u\u017e 7\u20138 rublius.
  Ta moteri\u0161k\u0117 si\u016bl\u0117s, galinti pamokinti austi. \u2014 Kilo gin\u010dai;
  nieks i\u0161 moter\u0173 nestojo pries namin\u0119 \u016bk\u0119, and\u0117jyst\u0119,
  tik vyrai (pavz. mokytojas Lekeckas) darodin\u0117jo, kad m\u016bs\u0173 moters
  nors dirbt\u0173 kiauras naktis, su pabrik\u0173 negales konkursuoti, tokia skara,
  jeigu pereisianti per kelias pirkli\u0173 rankas, daeisianti iki 20 rub., o u\u017e
  t\u0105 kain\u0105 galima es\u0105 pirkt 3 skaras pabrinkimo darbo. Kunigas visom
  keturiom \u0161oko girt moter\u0173 skaras. Kun. Tomas, kun. Janu\u0161evi\u010dia,
  kun. Oli\u0161aukas ragino moteris aust, verpt, vadino tokias moteris tauntos parama.
  \u2014 Kun. Janu\u0161evi\u010dia teip toli nu\u0117jo, kad i\u0161ved\u0117 visa
  teorij\u0105 pakelimo t\u0117vyn\u0117s. Jo nuomon\u0117 es\u0105 tris \u0161a\u0161tini\u0173,
  i\u0161 kuri\u0173 galima gaut pinig\u0173, \u2014 \u016bk\u0117, pramon\u0117,
  vaisba. \u016ak\u0117 galima pakelt ne \u012fvedant ma\u0161in\u0105s, ne produktyvi\u0161kiau
  sunaudojant medeg\u0105 ir laik\u0105, bet auginant vi\u0161\u010diukus, pars\u016bkius,
  kalakutus; jam, girdi, kaip Dvasi\u0161kos Seminarijos rektorius \u0161ita \u016bk\u0117s
  \u0161aka esanti gerai pa\u017e\u012fstama. U\u017emir\u0161o kunigas, jeigu nebus
  gr\u016bd\u0173, tai nebus i\u0161 ko pars\u016bk\u0173 liuobt ir vi\u0161\u010diuk\u0173
  su kalakutais leisint. \u2014 Antras \u0161altinis tai pramon\u0117. Ne u\u017edejimas
  pabr\u00fck \u2014 tiek aud\u017eiamius ir verpiamius, tiek kitoki\u0173, ne raginimas
  tur\u010diamas d\u0117ti savo kapitalus did\u017eioj\u0173 pramon\u0117n, bet namin\u0117
  pramon\u0117 r\u016bpi kunigui. Pagyr\u0117s keliais \u017eod\u017eiais lietuvaiteis
  aud\u0117jas, kunigas pradeda girt savo divonus, kuriuos jis pirm dvidesimties met\u0173
  pirk\u0117s, kasdien vaik\u0161\u010diojas ir jie da dabar i\u0161rod\u0105\\n\\nkai
  nauji, o jo draugai perk\u0105 kas dvej\u00ebs metai ir sune\u0161ioj\u0173, tai
  mat, k\u0105 rei\u0161kia nam\u0173 darbas! (Teko patirt, kad kun. Janu\u0161evy\u010diaus
  di-\\nvonai jau labai ir labai apsitiryne, tai pernai d\u0117king\u0173 lietuvi\u0173
  kuop-\\npa atminimui 25 met\u0173 jo kunigyst\u0117s nupirk\u0119 naujus). \u201eKad
  ir brangi-\\nau m\u0117s mok\u00ebsim u\u017e naminius i\u0161dirbimus, bet jie
  bus geresni,\\nstipresni; mes palaikysim savo pramon\u0119\u201c. \u2014 Tre\u010dias
  \u0161altinis t\u0117vyn-\\nnei pakelt tai, anot kunigo, reikia u\u017esiimti vaizba.
  \u201eDabar vaizba\\nrankose \u017eyd\u0173, reikia nuo j\u0173 atimt. M\u016bs\u0173
  lietuvaiteis gali vaizba u\u017e-\\nsiimt, jos ne blogesn\u00eb, jeigu ne geresn\u00eb
  tur\u012f galv\u0105 u\u017e \u017eyd\u0105; tegul\\nstoja krautuv\u0117s, tegul
  u\u017ededa savo krautuv\u0117s! O mums visiems rei-\\nkia palaikyt savo krautuvininkai,
  kad ir brangiau m\u0117s ten mok\u00eb-\\nsim, negu pas \u017eyd\u0105; lietuviav
  da n\u0117ra \u012fprat\u0119, negali pigiau nuleist;\\npirkim pas juos, \u2014
  palaikysim savo kra\u0161t\u0105 vaizb\u0105! Idomu patirt,\\nkur eitu kunigas pirkt:
  pas \u017eyd\u0105 ar pas lietuv\u012f, jeigu pas pirmajai\\nb\u016bt\u0173 pigiau;
  vargu nor\u0117t\u0173 bereikalo \u012fpilt kelet\u0105 rubli\u0173, kad ir \u00absa-\\nvos\u00bb
  biznieriams ki\u0161ien\u0117n. Gera dnuot kitiemis patarimus ir moter\u00ebl\u00ebs\\nsavon
  pu\u0161en traukt, jeigu tas nieko neprekiuoja. \u2014 Kun. Janu\u0161-\\nevi\u010dia
  tai tikras u\u017etar\u0117jas smulkiosios bur\u017euazijos, vis\u0173 pramonin-\\nk\u0173,
  biznieriu, vertelg\u0173; vargu \u0161ie berast\u0173 sau geresn\u012f ideolog\u0105*).\\nO
  moters vis tyl\u0117jo, bet buvo matyt, kad jos pritaria kunig\u0173\\nkalboms,
  nes knomet mokytojas Lekeckas nor\u0117jo atsakyti u\u017e duotus\\njam \u00abpipirus\u00bb
  kunigams, moter\u00ebl\u00ebi tarpe pasigirdo \u0161auksmai: \u00abne-\\nnorim,
  nenorim...\u00bb Lekeckas tur\u0117jo nustot kalb\u0117j\u0119s.\\n\\nJokios rezoliucijos
  apie \u016bk\u012f ir audimus nepri\u0117m\u00eb; susirinku-\\nsions ir be to buvo
  suprantama, jos i\u0161id\u0117jo \u0161irdin ponili\u0173 ir kunig\u0173\\nkalbas
  ir parva\u017eiavusios puls t\u0117vyn\u0119 gelb\u0117t, tik ka\u017ein ar visos\\naudimu,
  verpimu ir vi\u0161\u010diuk\u0173 auginimu?\\n\\n* * *\\n\\nV. Kunigai ir j\u0173
  politika moter\u0173 susiva\u017eiavime.\\n\\nBaigdamas apra\u0161in\u00ebt susiva\u017eiavim\u0105,
  negaliu nepamin\u00ebt sky-\\nrium kunig\u0173 darbo. J\u0173 iniciatyva (sumanymu)
  buva su\u0161aukta \u0161i-\\ntas susiva\u017eiavimas, organizaciniam susiva\u017eiavimo
  komitete be-\\nveik visos buvo kunig\u0173 politikos \u0161alinink\u00ebs; regejos,
  kad prie\u0161o\\nkunigams visai nereiks sutikti ir susiva\u017eiavimas eis, kunig\u0173
  veda-\\nmas. \u2014 \u0160tai pirm\u0105 susiva\u017eiavimo diena, renka pirm\u00ebsdes.
  Sal\u0119j\\nvienas i\u0161 kunig\u0173 stropi\u0161ai agituoja, kad i pirmininkus
  rinkt\u0173 kunig\u0105. Nepavyko! Nuolat kunigai u\u017elipa ant tribunos, kalba
  gra\u017eiai,\\ngirdisi tokie auk\u0161ti \u017eon\u017eiai: \u00abmokslas\u00bb,
  \u00absusipratimas\u00bb, \u00ab\u0161viesa\u00bb. \u2014\\n\\n*) Ideologas \u017emogus,
  kuris kokio nors laumo ekonominius reikalus paver\u010dia teorija,\\n\u012f\u0161kelia
  juos lig id\u0117jos.\\n\\nIlgai \u017ei\u016br\u00ebi \u012f kunig\u0105 Ol\u0161evsk\u012f,
  \u00ab\u0161v. Juozapo darbinink\u0173 draugijos\u00bb\\npirminink\u0105; \u017ei\u016briu
  ir stebinusi, nejaugi tai jis gali b\u016bt tos draugi-\\njos pirmininku, nejaugi
  jis ranka \u012f rank\u0105 eina su policimeisteriu,\\nnejaugi jis suk\u00ebl\u0117
  broli\u0161k\u0105 kov\u0105 tarp Kauno darbinink\u0173; jeigu tai\\njis, tai kaip
  giri drista vie\u0161ai susirinkimui meloti, sakyt\u012f apie\\nmoks\u0142\u0105,
  ap\u0161vietim\u0105, mokyklas. Teip, tai tas pats kun. Ol\u0161anckas,\\nkarmelit\u0173
  klebonas, tik pakol n\u0117ra prie\u0161o jis nerodo savo b\u016bdo.\\n\u2014 Kur
  gis pasid\u0117jo tie visi gar\u0161us filiozofai, socialist\u0173 keik\u0117jai?\\nNejaugi
  j\u0173 \u010dia n\u0117ra? Bet ilgai kunigai nei\u0161k\u0119n\u0117t svetimam
  kaili\u0173\\nlindot, yla i\u0161 mai\u0161o i\u0161lindo. Pakol nemat\u0117 sau
  pavojaus, gra\u017eiai ir\\npadoriai jie laik\u0117s, bet kaip tik prad\u0117jo
  svarstyti klausim\u0105 apie ko-\\nmiteto buvein\u0119 ir kunigai pamat\u0117, kad
  j\u0173 numyl\u0117tam Kaunu gr\u0105-\\nsina pavojus, jie pasirod\u0117 kuom es\u0105.
  Kun Ol\u0161anckas, kun. Janu-\\n\u0161evi\u010dia i\u0161simais\u0117 \u012f davatk\u0173
  b\u016brius ir kar\u0161tai agitavo u\u017e Kaun\u0105. O\\n\u00abpirmeivis\u00bb
  kun. Tumas, redaktorius \u00abbepartijinio\u00bb laikra\u0161\u010dio \u00abVil-\\ntis\u00bb,
  tai visus kunigus pervir\u0161ijo. Dailiai jis pirm\u0105 kalb\u0117jo, pasiro-\\nd\u0117
  laisv\u00ebs \u0161alininku, jis pripa\u017eino, kad lietuvi\u0173 moter\u0173 s\u0105junga
  tu-\\nri susijungt su kit\u0173 taut\u0173 s\u0105jungomis, kad i moter\u0173 s\u0105jungas
  gali\\nprisid\u00ebt ir vyrai, knomet gi pamat\u0117, kad i Sajungos komitet\u0105
  tei-\\nkiami yra du m\u016bs\u0173 draug\u0173 ir gali jie komitet\u0105 pakli\u00fbti,
  kun. Tu-\\nmas sukruto. Buvo ir jis statomas kandidata \u012f Sajungos komitet\u0105;\\nduodamas
  kitiemis paveiksle, jis savo kandidat\u016br\u0105 nu\u00ebm\u00eb, \u2014 ieida-\\nmi
  komitet\u0105 parodysiame, girdi, kad moters be vyru negali apsi-\\neit; knomet
  kit\u0173 vyrai nenu\u00ebm\u00eb savo kandidat\u016bros ir pa\u010dios moters\\nagitavo,
  kad ir vyrai b\u016bt\u0173 i\u0161rinkti komitetan, kun. Tumas pa\u0161o-\\nkes
  i\u0161r\u00eb\u017ee: \u00abPanel\u0117 P. ir jos kamyn\u00eb nori, kad i komitet\u0105
  pakli\u00fbt\u0173\\ntiesu vyru ne d\u00ebt\u00f2, kad jie vyrai, bet d\u00ebt\u00f2,
  kad socialistai!\u00bb\\n\\nTas buvo pasakyt\u0105 visi\u0161k gird\u017eiant policijai.
  Kilo didelis er-\\nmyderis, vieni \u0161vilp\u00eb, kiti plojo. Davatkos garsiavos,
  \u2014 tai mat\\nsocialistai norejo pral\u00edst. Tvarkos nebebuvo, pirminink\u00eb
  paskyr\u00eb\\npertrauk\u0105. \u2014 Po pertrankos pirminink\u00eb i\u0161rei\u0161k\u00eb
  kun. Tumui pa-\\npeikim\u0105; po to kun. Tumas pasak\u00eb: \u00abA\u0161 t\u0105
  papeikim\u0105 priemu, a\u0161\\nto u\u017esipelniau. Per paskutines dienas tur\u00ebjan
  daug darbo, susiner-\\nvaves \u010des\u00f9, u\u017esikar\u0161\u010diavau, tai
  ir nepama\u010diau, kaip prasitariau. Be\\nto a\u0161 esu u\u017esiem\u00ebs sutv\u00ebrimu
  bepartijinio laikra\u0161\u010dio, tai a\u0161 bijoau,\\nkad i komitet\u0105 nepakli\u00fbt\u0173
  partijos \u017emon\u00ebs. Ir jeigu a\u0161 per 11 me-\\nt\u0173 dirbdamas t\u0117vyn\u00ebs
  dirv\u0173 tur\u00ebjan nuopelnus, tai meld\u017eiu man\\nt\u0105 nusid\u00ebjim\u0105
  dovanoit\u00bb.\\n\\nSusirinkimas dovanojo, bet to, kas buvo pasakyt\u0105 nebesugausi,\\n\u2014
  \u00ab\u017eodis ne \u017evirblis, i\u0161skrido \u2014 nebepavyssi\u00bb \u2014
  sako rus\u0173 patar\u00eb.\\nGird\u0117jo policija, o m\u016bs\u0173 saly\u0173
  u\u017e prigul\u0117jim\u0105 prie partijos baud\u017eia\\n\\ni\u0161tr\u0117mimu
  Sibiram... Antra, \u201ebepartijin\u0117s\u201c kun. Tumas kelia partijinius vaidus,
  \u2014 aprik\u0161tijo \u017emog\u0173 \u201esocialistui\u201c, prilipino prie jo
  marke, ir \u0161e, \u017ei\u016br\u0117kite, kaip jis baisus \u017emogus; susirinkusios,
  gi moter\u0117l\u0117s numan\u0117 apie socialistus tiek, kiek kian\u0117 apie de\u0161\u0119s,
  jeigu kuri ir gird\u0117jo apie juos, tai vien \u201eNed\u0117d\u0117nijo Skaitymo\u201c
  ir \u201eSali\u010dinio\u201c keiksmus ir kunig\u0173 pamokslius. Kunigai matomai
  nori socialistu vard\u0105 padaryt teip baisiu, kad motinos verkian\u010dius vaikus
  socialistais baidyt\u0173.\\n\\nDa pavyzdis kunig\u0173 darb\u0173.\\n\\nSusirinkimas
  nutaria i komitet\u0105 rinkt 10 ypat\u0173. Jau beveik visos i\u0161rinktos, paskutin\u0117s
  balotiruojamos. Ma\u017eai pa\u0117jo i\u0161 Kauno, netinka tas kunigui Stakialai,
  jis i\u0161 savo vietos visa gerke reikia: \u201eNe reikia i\u0161 Vilniaus!...
  Pirmin\u0117k\u0117 ty\u010dia savas paveda!... Pra\u0161o ji u\u017eeit ant katedros,
  neina. Policimeisteris i\u0161si\u0161ka ir k\u0105 tik neu\u017edengia susivaizavimo.
  U\u017e kun. Stakial\u0117s pasielgim\u0105, \u017einoma, negalima u\u017emest d\u0117m\u0117s
  kunigams, nes jis tik rubais yra kunigui; bet \u0161tai kitos kunigo darbas. Tuojaus
  po nustabdymo kun. Stakial\u0117s, ant estrados atsiranda kun. Dogelis ir nepapra\u0161\u0119s
  balso, \u0161aukia, mindamas po koju prezidiumo autoritet\u0105: \u201eAr norite,
  kad daugiau i\u0161 Kauno \u012f\u0117j\u0173 \u012f komitet\u0105? \u2014 Norime,
  norime, i\u0161 Kauno, \u2014 gird\u017eias sal\u0117j balsai: \u2014 \u201eTai
  ko gi tyliite!\u201c Toks pasielgimas kun. Dogelio, kuras atmet\u0117 visus parlamentari\u0161kus
  papro\u010dius, nes atskiri kalb\u0117tojai gali darodint\u0119, o tik vienas prezidium
  gal\u012f klaust susirinkiniu nuomon\u0117s, parod\u0117, kad kunigai, nor\u0117dami
  pri\u0117\u0161\u0105 apgal\u0117t, griebliai \u012fvairiausi\u0173 \u012franki\u0173
  \u2014 tilkslai i\u0161teisina \u012frankius.\\n\\n* * *\\n\\nSusivaizavimas u\u017esibaig\u0117.
  U\u017edengdama susivaizvim\u0105 pirmink\u0117 pasak\u0117: \u201eNeuzmir\u0161kim,
  sesers-pili\u00eat\u0117s, kad \u010dia tame mus\u0173 sunkime viei u\u017emanymai
  buvo duodami, vien gr\u016bdai buvo metami, o nuo mus\u0173 pa\u010di\u0173 prigul\u0117s,
  kaip m\u0117s \u010dia tuos mestuosius gr\u016bdus aukl\u0117sime, kaip m\u0117s
  namo pargri\u017eiusis elgsim\u0117s. Tat su kar\u0161ta \u0161irdimi, su viltimi
  eikime pirmyn! Atidar\u0117me akis \u2014 nebeuzmerkime ju! Nuo tos dienos tegul
  prasideda mus\u0173 naujas gyvenimas.\\n\\nIr i\u0161tikri\u0173j tam\u0117 susirinkime
  viei u\u017emanymai buvo duodami. Susivaizavimo nutarimai n\u0117ra priverstiniai
  visoms moterims, jei nie\u0161reik\u0161 nuomon\u0117s ir tro\u0161kim\u0105 mus\u0173
  kra\u0161to moter\u0173. I ta susirinkim\u0105 va\u017eiavo kas nor\u0117jo, atva\u017eiavusi\u0173
  nieks nerinko, nesiunt\u0117, vos tik kelios buvo delegat\u0117s nuo moter\u0173
  draugij\u0173. Darbinink\u0117s kit\u0173 miest\u0173 ir kaim\u0173 atvykti negalejo,
  o Kauno davatk\u0173 tai buvo ap\u0161iaini: i\u0161\u0117jimas sal\u0117n prekiavo
  nedaug, tik 25 kap., tai vien\u0117n\u0117s buvo visai prieinama. \u2014 Susivaizavimo
  nutarimai yra tiek neai\u0161k\u016bs, kad sunku pasakyti kokia partija pa\u0117m\u0117
  vir\u0161\u0173. Vis\u0173 rus\u0173 laikra\u0161\u010diai apskelb\u0117, kad klerikalai
  gave did\u017eiausi\u0105 sm\u016bgi; \u017einoma, jei \u017ei\u016br\u0117t \u012f
  nekurios kunig\u0173 darbus ir i\u0161reik\u0161ta jiems papeikim\u0105, tai teip
  ir i\u0161rodyt\u0173, bet i\u0161sigilinus i vis\u0105 susivaizavimo turin\u012f
  galima pripa\u017eint, kad kunigai jeigu ne visame susivaizavime, tai bent tarp
  atsi\u0117v\u0117t\u0173 davatk\u0173, tur\u0117jo did\u0117le \u012ftekme. Pagal
  i\u0161rinktojo komiteto s\u0105statos galima pripa\u017eint, kad vir\u0161\u0173
  gavo klerikalai; i komitet\u0105 pakliuvo: 8 klerikal\u0117s, 4 pirmeiv\u0117s ir
  4 kairiosios. Bet, kadangi i\u0161 sinktosios kunig\u0173 \u0161alinink\u0117s yra
  ma\u017eo mokslu, prie tam ne veiklios, neatsi\u017eym\u0117je literat\u016broj
  ir buvo grei\u010diau i\u0161rinktos d\u0117l garb\u0117s, tai galima tik\u0117tis,
  kad pirmeiv\u0117s ir kairiosios, daugiausia jau pasirod\u017eiusios kokiaj nors
  veikimo \u0161akoj, mok\u0117s patraukti pla\u010dias moter\u0173 minias savon pus\u0117n
  ir jei Sajungai lemta yra gyvent, i\u0161traukus j\u0105 i\u0161 to po kunig\u0173
  \u012ftekm\u0117s.\\n\\nBet ar \u0161ioks ar toks bus komiteto veikimas, susivaizavimas
  turi savo vert\u0119: jis suk\u0117l\u0117 moteris. Parod\u0117 moteriai, kad ne
  tik puodas, gyvulai, ratelis ir stal\u010di\u0117s kai turi r\u016bp\u0117t, parod\u0117,
  kad moters gali susirinkt ir \u012fvairius klausimus svarstyti. Ir dabar visos buvusios
  susivaizavime moters, i\u0161va\u017ein\u0117j\u0119 po vis\u0105 kra\u0161t\u0105
  i\u0161ne\u0161ios apie susivaizavim\u0105 gand\u0105, sukel\u0117 kalbas, gin\u010dus,
  naujas mintis, naujus tro\u0161kimus. I\u0161ne\u0161ios ir kunig\u0173 vestaji
  \u0161auksm\u0105: \u201evyru ne reikia\u201c, ir vargu ant naudos kunigams i\u0161
  to mestojo gr\u016bdo i\u0161augs vaisiai. Prad\u0117s moters svarstyti savo pad\u0117jim\u0105
  ir i\u0161\u0117jimo \u012fjie\u0161kot... Ir tegul tik atsiranda ie\u0161kojimas
  i\u0161\u0117jimo i\u0161 dabartinio skurdo pad\u0117jimo, o bus kam parodyt kelia
  prie laisv\u0117s, ir supras moters, kad vien tik darbinink\u0173 partija, nuvertusi
  visok\u012f prispaudim\u0105, gali u\u017etikrinti ir moteriai laisv\u0119 ir lygyb\u0119.\\n\\nK.\\n\\n---\\n\\nApie
  \u017eemes klausima Lietuvoje.\\n\\nLietuvoj dalis apsi\u0161vietusi\u0173 jauninkai\u010di\u0173
  ir \u0161iaip jau kiek susipratusi\u0173 \u017emoni\u0173 dauguma, labiausiai be\u017eemiai
  ir ma\u017ea\u017eemiai, tik i\u0161skyrus dal\u012f nieko nema\u010diusi\u0173,
  nori, kad \u017eem\u0117 i\u0161 dvaur b\u016bt\u0173 atimta be jokie atlyginimo
  ir atiduota visiems darbo \u017emon\u0117ms; kad b\u016bt\u0173 atiduota tiems,
  kas j\u0105 i\u0161dirbo, kas pirmuosius dirvonus i\u0161ple\u0161\u0117, kas j\u0105
  jau daug am\u017ei\u0173 dirbo ir dirba, keno kraujin ir prakaitu ji visa permerkta.
  Susipratusieji darbo \u017emon\u0117s sako:\\n\\n\u2014 Nereik mums pon\u0173, kad
  jie mus valdyt\u0173, kad jie mus\u0173 \u017eem\u0119 ir mus pa\u010dius sunkut\u0173!
  Nereik mums, kad jie did\u017eiausius plotus tyrlausiais laikyt\u0173, o m\u0117s,
  jiesi\u0173 tarnaudami, varga ir alk\u012f tiktai vis kent\u0117tume.\\n\\nLietuvos
  darbo \u017emon\u0117s sako, kad Lietuvoj yra daug \u017eem\u0117s nedirbamos, apleistos,
  tr\u016bksta daug jiegos j\u0105 vis\u0105 i\u0161dirbt; u\u017etai kas jos nei\u0161dirba,
  kas laiko apleist\u0105, reikia nuo tu \u017eem\u0117s dal\u012f atimt ir atiduot
  tiems, kas nori dirbt. Jie sako: \u2014 \u017dem\u0119 atimt nuo tu vis\u0173, kas
  jos nedirba, kas ne i\u0161 \u017eem\u0117s gyvena, kas turit kitus pelno \u0161altinius,
  ir atiduot visiems darbo \u017emon\u0117ms, be\u017eemiais ir ma\u017ea\u017eemiais,
  tik ne u\u017e i\u0161simok\u0117jim\u0105, ne u\u017e pinigus, bet suvis veltui,
  dar jiem prad\u017eioj gyvenimo pad\u0117t, naujiems gyventojams, kiek tik reikia
  trioboms statyti, veltui duot mi\u0161ko; tokie betur\u010diai, kurie darbar n\u0117
  rublio neturi, k\u0105 jie su duotaja \u017eeme darys, ar rankomis kasin\u0117s
  ir po dangaus lub\u0173 tarp keturi\u0173 v\u0117j\u0173 gyvenst!\\n\\nKai-kurie
  klausia: \u2014 K\u0105 daryt su tais, kurie gav\u0119 pa\u0161elpa pragers ir v\u0117l
  netur\u0117s? \u2014 Tiems, kas duotaja pa\u0161elp\u0105 i\u0161leis, \u2014 kitai
  atsako, \u2014 tai antr\u0105 kart\u0105 nebeduot, arba pa\u0161elp\u0105 duot ne
  pinigais, tik med\u017eiag\u0105.\\n\\nVieni nori, kad \u017eem\u0117 b\u016bt\u0173
  visuomen\u0117s nuosavybe, kad b\u016bt\u0173 ginama pirkt ir parduot, kas nori
  \u017eem\u0119 dirbt, kad b\u016bt\u0173 tiems ir be pirkimo duodama. Antri nori,
  kad \u017eem\u0119 gal\u0117t\u0173 pirkt ir parduot, tik apribot\u0173, kiek daug
  gali pirkt, kad kartais kit\u012f perdaug nepri\u0161iprktu, jeigu paskui norintiems
  sau skyrimu \u017eem\u0119 tur\u0117t neb\u016bt\u0173 kur gaut ir tokiu b\u016bdu
  b\u016bt\u0173 var\u017eoma liuosyb\u0117 ir daugumas nor\u0117dami ant sav\u0119s
  laisv\u0119 tur\u0117t b\u016bt\u0173 priversti did\u017eia\u017eemiams dirbt. Jeigu
  leist pirkt, tai tik t\u0105 \u017eem\u0119, kuri yra atliekanama da niekam neduota,
  ta, kurios neb\u0117ra kas dirbt\u0173, arba kas gaves ir gerai j\u0105 i\u0161dirb\u0117s
  parduot\u0173. Pinigus u\u017e atliekan\u0105j\u0105 \u017eem\u0119 gautus paimit
  valsstyb\u0117s i\u0161dan visuomen\u0117s reikalams.\\n\\nKas vien\u0105 kart\u0105
  gaut\u0173 \u017eem\u0119 pardnos, tam antr\u0105 kart\u0105 veltui nebeduot; bet
  jo u\u017eangusiesiems vaikams, jeigu jie nor\u0117t\u0173, v\u0117l duot.\\n\\nJeigu
  kas veltui gautosios, arba ir pirktosios nedirbs, labai apleis, tai i\u0161 t\u0173
  atimt ir kitiemis atiduot. Jokiui b\u016bdu \u017eem\u0117s apleistas laikyt neleist.\\n\\nPirkliams,
  amatinkams ir kitokiem \u017emon\u0117ms, kurie lig\u0161iol \u017eem\u0117s nedirbo,
  ne i\u0161 \u017eem\u0117s gyveno, tokiem \u017eem\u0117s veltui neduot, jeigu duot,
  tai u\u017e pinigus ir tai nedaug.\\n\\nToliaus ma\u017ea\u017eemiai ir be\u017eemiai
  apie \u017eem\u0117s sutvarkym\u0105 sako:\\n\\n\u2014 Kaip saul\u0117s \u0161viesos,
  vandens ir oro, teip ir \u017eem\u0117s, kaip visuomen\u0117s turto, negalima kam
  nors am\u017einai parduot; jeigu parduot, tai tik savo darb\u0105. Teip: jeigu kas
  prast\u0105 \u017eem\u0119 gaves j\u0105 gera i\u0161dirbti, prie jos daug savo
  darbo prid\u0117t\u0173, paskui nor\u0117t\u0173 kiton vieton i\u0161s\u0117ti,
  nor\u0117t\u0173 tai savo darb\u0105 parduoti, \u017einoma, toks savas darbas, tik
  ne \u017eem\u0117, gal b\u016bt parduodamas. Dar galima leisti \u017eem\u0119 mainyti
  ir vieni kitiems priebus prisid\u0117ti. Tie Lietuvos darbo \u017emon\u0117s sako:\\n\\n\u2014
  Reikia duot \u017emon\u0117ms tikr\u0105 laisv\u0119; kas nori prie kit\u0173 dirbt,
  tedirba, teparsiamsio. Tik reikia nutart ir i\u0161leist tok\u012f \u012fstatym\u0105,
  u\u017e kiek ma\u017edaug pigiausia gal\u0117t\u0173 dirbt, kad samdininkai teip
  labai neb\u016bt\u0173 i\u0161naudojami ar sutrupint darbo diena.\\n\\nDvarininkai
  ir did\u017eieji \u016bkininkai sako:\\n\\n\u2014 Nuo am\u017ei\u0173 \u017eem\u0117
  buvo ir bus m\u016bs\u0173, m\u0117s visokius mokes\u010dius mok\u0117jome, m\u0117s
  j\u0105 i\u0161pirkome, \u00abvikupus\u00bb i\u0161mok\u0117jome. O be\u017eemiai
  ir ma\u017ea\u017eemiai sakos, kad ir jie \u00abvikupus\u00bb mok\u0117j ir jie
  visos vie\u0161patybos sunkybes ant savo pe\u010di\u0173 ne\u0161\u0117 ir da u\u017e
  anuos \u00abvikup\u0173\u00bb mok\u0117tojus sunkiau gyven\u0119. Jie sako: \u2014
  M\u0117s did\u017eiausi\u0173 \u00abvikup\u0173\u00bb dal\u012f u\u017edirbome,
  m\u0117s u\u017e pigi\u0105 alga \u016bkininkams tarnavome, be apribojimo dienomis
  ir naktimis sunkiai dirbome ir nuo samdytoj\u0173-\u016bkinink\u0173 brangesni\u0173
  alg\u0173 negal\u0117jom\u0117 reikiauti, kad buvo sunkus mokes\u010diai... M\u0117s
  b\u016bdami samdininkais u\u017e \u016bkininkus sunkiai dirbome ir buvome labiau
  spaud\u017eiami. M\u016bs\u0173 t\u0117vai ir seneliai, net ir dabar m\u0117s patys,
  \u016bkininkams mokame u\u017e ple\u010dius ir u\u017e ganyklas; u\u017e p\u016bro
  bulbi\u0173 pasodinim\u0105, u\u017e ma\u017e\u0105 \u017eem\u0117s lope\u013c\u012f
  \u0161imterlapiai atidirbame, o da jie sako, kad jie vi\u0117sai u\u017e ta \u017eem\u0119
  mokes\u010dius moka...\\n\\nMums, be\u017eemiais ir ma\u017ea\u017eemiais, did\u017eiau
  ta \u017eem\u0117 priguli, kaip tiems \u00abvikup\u0173\u00bb mok\u0117tojams.\\n\\nKada
  nuo vis\u0173 atsiskyrimui vienam gyvent sunku, tai susipratusieje darbo \u017emon\u0117s
  kovoj\u0105 u\u017e piln\u0105 linosyb\u0119 \u012fvairi\u0173 draugyste, kad gal\u0117t\u0173
  dang \u017emoni\u0173 i draugyst\u0119 susidiej\u0119, paimit viename \u0161mote
  daug \u017eem\u0117s ir dirbt, su geresniais \u016bki\u0161kais irkankiais, visi
  i\u0161 vieno.\\n\\n\u017dinoma, pakol caro vald\u017eia vie\u0161pataus, pakol
  viskas tebebus kraugeri\u0173 valdinink\u0173 rankose, pakol nebus visuotino, lygus,
  tiesaus ir slapto balsavimo, tol n\u0117ra ko laukti teisingo \u017eem\u0117s padalinimo.\\n\\nDabar,
  pakol tokios vald\u017eios rankose gyvename, turim reikalaut, kad \u017eem\u0117
  b\u016bt\u0173 duodama am\u017einuos nusavyb\u0117n; ar gi galime \u017eem\u0119
  pavest i kokius kraugeri\u0173 rankas, kad mus i\u0161gabent\u012f i Sibiro t\u00fdrus,
  o \u010dia Lietuvos laukus apgyvendint\u0173 \u00abtikraisiais rusais\u00bb \u2014
  juoda\u0161im\u010diai?\\n\\nTik tada tur\u0117sime \u017eem\u0119 ir laisv\u0119,
  kada carizmas ir kapitalizmas bus i\u0161griaunti.\\n\\nSilpnutis.\\n\\nI\u0161
  d\u016bm\u0173 palengva i\u0161kilsiantis gaisras,\\nKurs degis pasaul\u0119, ir
  jomsioms bus saul\u0119!\\n\\nJuras.\\n\\n28.V.1907 m. Pary\u017eius.\\n\\nPOLITI\u0160KOS
  \u017dINIOS.\\n\\nRusija. D\u016bmoje mai\u0161tas! Nebereikalo d\u016bma pavadin\u0117ta
  juoda-\\nja... Per\u0117t\u0105 p\u0117tny\u010di\u0105 buvo d\u016bmoje debatai
  apie vald\u017eios aprei\u0161ki-\\nm\u0105, ministerij\u0173 pirmininko Stolypono
  paduot\u0105. Subato tuos deba-\\ntus (gi\u016b\u010dus) pertraukta su de\u0161ini\u0173j\u0173
  (altgaleiv\u0173) astov\u0173... kum\u0161-\\n\u010dia. Konstitucini\u0173 demokrat\u0173
  astovas F.Rodi\u010dev a\u0161triai kritiko-\\nva vald\u017ei\u0105 ir tie vald\u017eios
  \u0161alilinkai juoda\u0161im\u010diai pakel\u0117 bais\u0173\\nrisksm\u0105 prie\u0161
  j\u012f ir pagalbos nust\u016bm\u0117 nuo tribunos. Rodi\u010dev vos i\u0161-\\nne\u0161\u0117
  savo kail\u012f, laim\u0117jo jo, kad sp\u0117jo pasisl\u0117pt. Ant jo u\u017ep\u016bol\u0117
  100\\njuoda\u0161im\u010di\u0173, vedam\u0173 Pur\u0161kevi\u010diaus ir dviej\u0173
  kunig\u0173. D\u016bmoje yra\\n457 astovai, taigi tre\u010diai astov\u0173 dalis
  yra pe\u0161tukai. \u017dod\u017eio lai-\\nsv\u0119 d\u016bmoje sutrinta su juodaja
  kum\u0161\u010dia; ji u\u017ekim\u0161 kiekvien\u0105 bur-\\nn\u0105, kuri tik dr\u012fs
  \u017eiopelti, ir vis\u0105 d\u016bm\u0105 gal neu\u017eilgo nuramis teip,\\nkad
  nieks ten nekalb\u0117s. Ta kum\u0161\u010dia privers tik revoliucij\u0105 kal-\\nb\u0117t...\\n\\nU\u017esieni\u0173
  dalyk\u0173 ministeris tariasi su caru, kokius pietus pa-\\nrengt Amerikos kar\u0117s
  sekretoriniui Taftui, va\u017eiuojan\u010diam per Siberi-\\nj\u0105 i Petersburg\u0105.\\n\\nPersija.
  Pakilus neuzsigan\u0117dinimui dabartin\u0117 vald\u017eia, minis-\\nteriai atsisak\u0117
  nuo savo viet\u0173, ta\u010diaus \u0161ahas to atsisakymo nepri-\\nma. Persijoj
  mat yra jau konstitucija tokia, kaip kitose \u0161alise (tik\\nne kaip Rusijoj),
  nes didesne parlamento daliai nepritarus minis-\\nteriams, \u0161ie kaipio neuzsitikimi
  atsisako nuo vald\u017eios. Toks parla-\\nment\u0173 paprotys.\\n\\nPortugalija.
  Augant vald\u017eios reakejai, auga ir ker\u0161tas, ir te-\\nroras pradeda labiau
  apsireik\u0161t. Lisabonoj susekta bomb\u0173 sand\u0117-\\nlis, konfi\u0161kuota
  700 bomb\u0173 ir ar\u0117\u0161tuota apie 80 \u017emoni\u0173. Po to val-\\nd\u017eia
  da ar\u0161iau elgiasi: draud\u017eia susirinkimus, paa\u0161trino cenz\u016br\u0105,\\nkelia
  laikra\u0161\u010dius u\u017edar\u0117.\\n\\nAnglija. Londone moters v\u0117l prad\u0117jo
  savo smark\u0173j\u012f darb\u0105 a\\npie visuotin\u0105 balsavim\u0105. Joms pritaria
  soejalistai ir demonstraty-\\nvi\u0161kai reikalauja parlamento \u012fvesti moter\u0173
  balsavimo ties\u0105.\\n\\nI\u0161 Amerikos darbinink\u0173 gyvenimo.\\n\\nSunkus
  apkaltinimas darbinink\u0173 vadovy. Neseniai \u00abKovoje\u00bb mi-\\nn\u0117jom,
  kad \u00abAmerikos Darbinink\u0173 Federacijos\u00bb prezidentui Gom-\\npersui yra
  u\u017emetama sunkus prasir\u017eengimai prie\u0161 darbininkus. Ver-\\nta daugiau
  pa\u017ei\u016br\u0117t, k\u0105 padar\u0117 tas vis\u0173 Amerikos darbinink\u0173\u0161i\u0173\\ns\u0105jung\u0173
  vadovas. Tie u\u017emetimai, matoma, ne visi ir ne visai teisin-\\ngi, nes tai kapitalist\u0173
  laikra\u0161\u010diai juos pak\u0117l\u0117; bet visiems \u017einoma,\\nkad seniejie
  s\u0105jung\u0173 (unij\u0173) vadovai buvo ir yra neteisingais vado-\\nvais, kurie
  nerod darbininkams tikro kelio, kuriojui jie eidiams ga-\\nl\u0117t\u0173 atsiginti
  ir galutiniai i\u0161sibig\u0117teli i\u0161 skriaudos; tie vadovai da\\natitraukdavo
  nuo to kelio ir teip tarnavo kapitalistams.\\n\\nNew Yorke i\u0161einantis kapitalist\u0173
  laikra\u0161\u010di\u0173 \u00abAmerican Industries\u00bb, tarnanjas \u00abkapitalo
  ir darbo (!) reikalams\u00bb, parodo \u0161iuos at-\\nsitikimus: H.Rice, spaustuvininkas,
  gyvenas ant East 20 gatv\u0117s\\nNew Yorke, \u2014 tvirtina, kad jis 1889 m. dav\u0117s
  Gompersui 50 dol.\\nir u\u017e tai gav\u0117s i\u0161 Federacijos spaudos darbus,
  i\u0161 ko peln\u0117s 3000 do-\\nleri\u0173. 1890 m. u\u017e toki pat patarnavim\u0105
  dav\u0117s Gompersui jau 500\\ndol., o 1801 m. paprakos pakilo jau iki 1,000 dol.\\n\\nMin\u0117tas
  laikra\u0161\u010dis daugiau skund\u017eia, kaip Gomperso gauja lengvai m\u0117to
  organizacijos pinigus. Tulas C.L. Loder, i\u0161rokav\u0119s Federacijos organo
  (\u00abAm. Federationist\u00bb) iplaukas ir i\u0161\u0117sigas ir atra\u0161\u0119s,
  kad 1903 met\u0173 paibgo buv\u0119 grynos ieigos $25,999,05; o tuo tarpu buvo apskelbta
  esant 15 t\u016bkstan\u010di\u0173 nepriekitekliaus (deficito).\\n\\nTie visi u\u017emetimai
  padar\u0117 gana andring\u0105 Federacijos susivai\u017eiavim\u0105, kurs \u0161iam
  lapkriti\u00f1o m\u0117n. buvo Norfolke, Va. Bet tas, matyt, vir\u0161ininkams nieko
  kolei kas nekenkia. Ta\u010diau Federacija, kaip ir visos unijos pradeda eit pirmyn
  ir u\u017e kel\u012f met\u0173 galima tik\u0117tis \u2014 stos ant demokrati\u0161k\u0173
  pamat\u0173 ir nesiduos darbininkai va\u017eioti u\u017e nosies kokiems \u00abvadovams\u00bb.\\n\\nBadas
  \u00abD\u0117kavojimo Dienoje\u00bb. Amerikie\u010diai kasmetis \u0161ven\u010dia
  pasikutini lapkriti\u00f1o ketverg\u0105. T\u0105 \u0161vent\u0119 vadina \u00abThanksgiving
  Day\u00bb \u2014 \u00abd\u0117kavojimo diena\u00bb \u2014 mat dangu d\u0117kavoja
  u\u017e suteiktas vasaros met\u0173 gerybes. New Yorke po to \u00abd\u0117kavojimo\u00bb
  kit\u0105 dien\u0105 (p\u0117tny\u010dioje) rytmetyje policistas McDonald rado vos
  gyv\u0105 \u017emog\u0173 gulint 62-ros gatv\u0117s ir 1-mos avenue. Jis i\u0161
  silpumo puol\u0117 ir labai susizied\u0117, ir teip be jokios pagelbos i\u0161gul\u0117jo
  per nakt\u012f. Tarp sutrint\u0173 popiergalii jo ki\u0161eniu rado adres\u0105:
  \u00abNo. 955 Park avenue\u00bb. Detektivai \u012f tai vietai nu\u0117j\u0119 klausin\u0117jo,
  bet n\u0117ks apie tok\u012f \u017emog\u0173 ten nieko ne\u017einojo. Tai \u2014
  benamis-varg\u0161as. Pinig\u0173 nei vieno cento pasi nerado. Nuv\u0117rus i ligonbut\u012f,
  daktarai nusprend\u0117, kad jis per 36 valandas nieko burnoj netur\u0117j\u0119s.
  \u2014 Tai kokij\u0173 atsitikim\u0173 liudytojais \u0117sme toje laimingoj Amerikoj!
  O tokij\u0173 atsitikim\u0173 ne \u0161imtai, bet t\u016bkstan\u010diai. D\u0117kavokit,
  darbininkai, dangui, kada badu mir\u0161tat!\\n\\nV\u0117\u017einink\u0173 streikus.
  Scranton, Pa. Lapkriti\u00f1o 25 dieuos nakt\u012f \u2014 vidurnakyt \u2014 sustreikavo
  36 v\u0117\u017eininkai (\u00abswitchmen\u00bb), samdomi ant \u00abDelaware, Lachawanna
  & Western\u00bb gele\u017einkelio pleciaus.\\n\\nReikalauja pa\u010di\u0173tin\u0173
  bank\u0173. Chicagos \u00abDarbinink\u0173 Federacija\u00bb nutar\u0117 reikalauti,
  kad kongresas (parlamentas) \u012fvest\u0173 pa\u010di\u0173 taupomasis bankas,
  sujungtas su visas Jungtin\u0173 Valstybi\u0173 pa\u010dtos kantorais, su 2 nuo\u0161im\u010diais
  pal\u016bki ir su i\u0161mok\u0117jimu kiekvienoje pa\u010dtoje. Visos Amerikos
  darbininkai to nori.\\n\\nBedarb\u0173 i\u0161\u0117ivyst\u0117 \u012f Kanad\u0105.
  Niagara Falls, Ont. Bedarbiai darbininkai i\u0161 Jungtin\u0173 Valstybi\u0173 per
  Niagara ribe\u017ei\u0173 eina \u012f Kanad\u0105, pasiund\u0119 pasakojimas apie
  didel\u0119 gerove Kanadoj ir reikalingum darbinink\u0173 pri\u0117 gele\u017einkel\u012f.
  \u0160imtai vargdieni\u0173 persik\u0117l\u0117 \u012f Kanad\u0105, o kadangi ten
  jie negausa darbo, tai beab\u0117jo \u017eiem\u0105 perleis kaip valkatos kal\u0117jime.
  Amerikos vald\u017eia apie norin\u010dius gr\u012f\u017eti nesir\u016bpin\u0101,
  i\u0161\u0117mus tik Amerikos pilie\u010dius. I\u0161 kit\u0173 vis\u0173 reikalauja
  u\u017esimok\u0117t mokesti 4 dol. nuo galvos. (\u00abSt. Louis Labor\u00bb).\\n\\nPolicija
  \u0161audo streikininkus. Joliet, Ill., lapkriti\u00f1o 26 d. \u2014 \u00abWestern
  Stone Co.\u00bb darbininkams sustreikavus, buvo ve\u017eami streiklau\u017eiai,
  nepriekiausi prie s\u0105jungos. Streikininkai pastojo jiems keli\u0105, kilo pe\u0161tyn\u0117s.
  Policija \u0117m\u0117 \u0161audyti ir streikinink\u0173 minia, susidedan\u010di\u0105
  i\u0161 300 \u017emoni\u0173. Daug sunkiai su\u017eeisti.\\n\\nRusi\u0161kas \u012fnagis
  pri\u0117 darbinink\u0173 vienyb\u0119 K\u016bboje. Havana, lapkriti\u00f1o 22 d.
  \u2014 Jungtinis darbinink\u0173 Komitetas tur\u0117jo savo susirinkim\u0105. Slaptoji
  policija sunod\u0117, ir visas susirinkimas tapo are\u0161tuotas, i\u0161viso apie
  250 \u017emoni\u0173; vienkart ir komiteto prezident\u0105 ir sekretori\u0173 are\u0161tavo.
  Visi s\u0117d\u0117 kal\u0117jime; kaucija neprimama. Juos kaltina u\u017e suokalb\u012f,
  daryta su tikslu sugadyt vie\u0161a ramum\u0105 ir tvark\u0105.\\n\\nDarbinink\u0173
  judejimas svetur.\\n\\nRytin\u0117je Indijoje apie Kalkut\u0105 sustreikavo gele\u017einkelio
  darbininkai, ant linijos 2,165 myli\u0173 ilgio. Streik\u0105 prad\u0117jo ma\u0161inistai,
  beveik vieni europie\u010diai. Paskiau jiem pritardami ir paremdami, sustreikavo
  ir vietiniai to gele\u017einkelio darbininkai. 6,000 keleivi\u0173 ant \u012fvairi\u0173
  sto\u010di\u0173 laukia pasibaigiant streiku. Ma\u0161inistai daugiausia sustojo
  ant ma\u017e\u0173 sto\u010di\u0173, o kaip kur traukiniai stovi vidurlauk\u0119se.
  J\u0173 reikalavimus kompanija rodos tuo i\u0161pildys.\\n\\n\u0160vedijoj visi
  eigar\u0173 ir tabako pabriskantai susivienijo su \u00abtauti\u0161ka\u00bb (!)
  tabako pirkli\u0173 draugija, \u017einoma, su tikslu pakelti tabako kainas ir numa\u017einti
  savo darbininkams algas.\\n\\nPersijoj pirmiau divon\u0173 pramon\u0117je dirbo
  daugiausia moters, o per pastaruosius ketverius metus j\u0173 viet\u0105 prad\u0117jo
  u\u017eimti vaikai ir dabar Tabriez mieste, kur daugiausia yra divon\u0173 dirbtuvii,
  dirba t\u016bkstan\u010diai ma\u017e\u0173 vaik\u0173. Kapitalizmas visur stengiasi
  pavergt silpniesius.\\n\\nSANJUNGOS REIKALAI.\\n\\n\u00abKovos\u00bb redakcijai
  persik\u0117lus.\\n\\nDraugai ir Draug\u0117s:\u2014 26 d. lapkr. m\u0117nesio \u00abKovos\u00bb
  redakcija tapo perkelta \u012f kit\u0105 nam\u0105. Pertankus kraustymas redakcijos
  yra labai neparankus: netik k\u0105 yra suri\u0161tas su bereikalingais i\u0161ka\u0161\u010diais,
  bet sutramdo per nekur\u012f laik\u0105 ir visa redakcijos darb\u0105. Tod\u0117l,
  perkeldami \u0161\u012fmet \u00abK-s\u00bb spausuv\u0119, jie\u0161kojom tokio namo,
  kad \u00abKova\u00bb gal\u0117t\u0173 pasilikti ilgesn\u012f laik\u0105, kelet\u0105
  met\u0173, arba ir visados. \u0160iame name darbo vieta daug atsakantesn\u0117,
  negu buvo pirmiau, per k\u0105 ir pats darbas bus i\u0161na\u0161esnis. \u2014 Yra
  puikus cementuotas ir gana \u0161viesus sklepas, kuriame galima but\u0173 \u012fvest
  ma\u0161inierijas. Reikia tik draug\u0173 pritarimo ir noro. Pa\u0161aliniai darbai
  iki \u0161iol negalima buvo varyt kaip reikiant daugiausiai per tai, kad nebuvo
  savo ma\u0161in\u0173, savo pres\u0173. Duodant spausdint kitur, prisieina taikinties
  teip, kaip tenai nori ir i\u0161gali. Per tai ne tik k\u0105 i\u0161siomka daug
  pinig\u0173, bet ir reikalavim\u0173 i\u0161pildymas neretai tampa sutrukdytas.
  Smulkesni\u0173 pa\u0161alin\u0173 darb\u0173 visai nebuvo i\u0161rokiavimo atlikt,
  neturint savo ma\u0161in\u0173.\\n\\nTod\u0117l, draugai, dabar per\u0117jus \u012f
  nauj\u0105 nam\u0105, kur vieta kliu\u010di\u0173 nebedaro, pasirodo reikalingu
  S\u0105jungai nusipirkt nedidel\u012f pres\u0105 spausdinimui ma\u017eesni\u0173j\u0173
  darb\u0173. Bet, \u017einoma, viena ma\u0161ina yra suri\u0161ta su kita. Tod\u0117l
  perkant pres\u0105 sykiu reikia pirkt ir peili plautymui popieros ir sagstom\u0105j\u0105
  ma\u0161in\u0105. Tai apsieit\u0173 \u012f 400\u2013500 doleri\u0173. Bet ta suma
  n\u0117ra jug teip baisi. M\u016bs\u0173 draug\u0173 skaitlius dabar siekia jau
  beveik du t\u016bkstan\u010di\u0173 ir kiekvienas prisid\u0117damas po skatik\u0105
  tik, duotum\u0117m S\u0105jungei jau nema\u017e\u0105 param\u0105. Tod\u0117l, draugai,
  tik panor\u0117kim, ir bus viskas. Stengkim\u0117s visoms sp\u0117koms stiprint
  \u00abKov\u0105\u00bb, kad j\u0105 galima but\u0173 neu\u017eilgo dvigubai padidinti,
  arba patankinti i\u0161leidim\u0105. Kiek i\u0161gal\u0117dami aukaukime pats ir
  kitus raginkim aukant literaturos fondan \u2014 i\u0161leidimui darbinink\u0173
  ra\u0161t\u0173, kuri\u0173 m\u0117s iki \u0161iol visai netur\u0117jom\u0117. Aukaukime
  ir skolinkime reikalams S\u0105jungos. Remkime kiek\\n\\ni\u0161gal\u0117dami prad\u0117t\u0105
  darb\u0105. Draugai, artinasi krizis, kuris, kaip matosi, gal bus vienas i\u0161
  did\u017eiausi\u0173, gal jis padarys gali kapitalist\u0173kai vald\u017eiai Amerikoje.
  \u010cia, draugai, pasirodytos a\u0161ikus reikalas darbinink\u0173 organizacijos
  ir savo organo, kada reiks stoti \u012f aktyvi\u0161k\u0105 kov\u0105 u\u017e laimingesn\u0119
  gadyn\u0119 \u2014 socializm\u0105. Nesigilinsiu \u012f tolimesnius i\u0161vad\u017eiojimus;
  \u017einau, kad pats draugai t\u0105 supranta, atjau\u010dia, visoms savo pajegom
  dirbo iki \u0161iol, dirba dabar ir toliaus dirbs ne su ma\u017eesnimi pa\u0161iventimu
  ir energija.\\n\\nTaigi, draugai, teneaugina mus jokie prie\u0161ai, jokios \u0161m\u0117klas,
  tik susidrutinkim ir su nauja sp\u0113ka suremkime pe\u010dius ir stumkime darb\u0105
  pirmyn.\\n\\nSu darbinink\u0161ka meile\\n\\n\u00abKovos\u00bb administratorius
  A.Ru\u0161inas.\\n\\n---\\n\\n**LSS. Sekretoriaus prane\u0161imai.**\\n\\nNaujai
  susitv\u0117r\u0117 kuopos:\\n\\nMt. Carmel, Pa. 10-ta kuopa buvo u\u017egesus,
  dabar v\u0117l atgijo.\\nNiagara Falls, N.Y. nauja kuopa Nr. 82.\\nBrooklyn, N.Y.,
  pietin\u0117je dalyje miesto nauja kuopa N 83.\\nChicago, Ill. Pullman Sta. susitv\u0117r\u0117
  nauja kuopa N 20; ji u\u017eima viet\u0105 i\u0161nykusios kuopos Senecaville, Ohio.\\n\\nLSS.
  sek. P.Dubickas.\\n\\n---\\n\\n**Literat\u016bros Komiteto kry\u017eul\u0117 Nr.
  4.**\\n\\nPrad\u017eioj \u0161io, lapkri\u010dio, m\u0117nesio per Literat\u016bros
  Komitet\u0105 per\u0117jo kry\u017eul\u0117 Nr 4, kurioje nutarta:\\n\\n1. Visus
  S\u0105jungos i\u0161leid\u017eiamus ra\u0161tus spaud\u017einti tik vien po antgalvy
  \u00abLietuv\u0173 Socialisty S\u0105jungo Amerikoje\u00bb su jos deviza \u00abDarbininkai
  vis\u0173 \u0161ali\u0173, vienykit\u0117s! J\u016bs nieko neturiu pralaim\u0117ti,
  tik ret\u0117\u017eius\u00bb, pa\u017eymint vir\u0161uje b\u0117gant\u012f numer\u012f
  spaudzinamosios bro\u0161i\u016br\u0117l\u0117s. Pav. \u00abKovotoj\u0173 giesm\u0117s\u00bb
  tur\u0117t\u0173 b\u016bti N 3, \u00abPriekus Engels\u00bb N 4 ir tt. \u00abSocijalisto
  Knygyn\u0117lio\u00bb serija nuo N 7 panaikinti.\\n\\n2. Ant paskutinio luobelio
  talpinti tik LSS. i\u0161leisties ra\u0161tus ir j\u0173 prekes.\\n\\n3. Atspaud\u017einus
  \u00abKovotoj\u0173 giesmes\u00bb, tur\u0117t\u0173 b\u016bti prad\u0117ta spaud\u017einti
  bro\u0161i\u016brel\u0117 \u00abPriekus Engels\u00bb \u2014 jo gyvenimas, ra\u0161tai
  ir darbai, kuriuos rankra\u0161tis randasi pas Lit. Kom. archyvarij\u0173 drg. J.O.
  \u0160irvyda. (Pasi\u016bsta \u00abKovai\u00bb jau koks m\u0117nuo. \u0160irv.).\\n\\n4.
  Patalpint P. Engels''o paveiksl\u0105.\\n5. Atspaud\u017einti 2.000 egz.\\n6. Nuli\u0117ti
  elektrotypus.\\n7. Autorini duoti reikalaujam\u0105 honorar\u0105 (600 ekz.)\\n\\nPirm\u0117dis
  \u2014 J.\u0160ukys,\\nSekretorius \u2014 B.\u017diurys,\\nArchyvarijus \u2014 J.O.\u0160irvydas.\\n\\nP.S.
  Pasira\u0161au tik po nutarimais N 1, 2, 3, ir 4; NN 5, 6 ir 7 ir kain\u0173 knygut\u0117s
  palieku nusp\u0117sti S\u0105jungos Pild. Komitetui ir \u00abKovos\u00bb Administratoriui,
  nes manau, kad tas yra ne mus\u0173 priederme.\\n\\nB.\u017diurys.\\n\\nP.S. Pasira\u0161au
  po NN: 1, iki \u017eod\u017eio: \u00abret\u0117\u017eius\u00bb, 2, 3, 4, 5, 6 ir
  7.\\n\\nJ.O.\u0160irvydas.\\n\\n---\\n\\n**Kur revoliucijos dainos su gaidomis?**\\n\\n15
  d. lapkri\u010dio LSS. Literat\u016bros Komitetas man prisunt\u0117 \u0161iok\u012f
  lai\u0161k\u0105:\u2014 \u00abMalonus drauge! Kaip \u017einoma, jog per Tamist\u0105
  prirengtoji spaudon knygut\u0119 \u00abRevoliucijos Aidai\u00bb, del tu\u0173 kliu\u010di\u0173
  ne nuo mus\u0173 prigulin\u010di\u0173, tapo atid\u0117ta ant tolesnio laiko ir
  kadangi reikalas i\u0161leidimo j\u0173 yra ne menkas, tai Literat\u016bros Komitetas
  \u2014 \u012fne\u0161us drg. J.\u0160ukiu \u2014 \u0161iuomi kreipsi prie Tamstos,
  u\u017eklausdamas, kokios prie\u017eastys yra, jog m\u0117s iki tuolika negaunam
  jokios \u017einios apie j\u0173 (Revoliucijos Aid\u0173) likim\u0105? Jeigu dar
  nepertaistytos, tad meld\u017eiam tai kuonogrei\u010diaus padaryti, o jei gatavos
  \u2014 teikite mums (Lit. Kom.)jas priduoti, arba paa\u0161kinti kliutis, d\u0117l
  kuri\u0173 jos negalimos priduoti. Tikim\u0117s, jog draugas mums prane\u0161\u0117
  apie galutin\u012f j\u0173j\u0173 likim\u0105. Laukdami prisuntimo \u00abRevoliucijos
  Aid\u0173\u00bb arba lai\u0161ko pasilikame su socialisti\u0161kais link\u0117jimais
  LSS. Literat\u016bros Komitetas \u2014 pirms. J.\u0160ukys, sek. B.\u017diurys,
  archyvarijus \u2014 J.\u0160irvydas\u00bb.\\n\\n\u010cia kalbama apie tas \u00abRevoliucijos
  Dainas su gaidomis\u00bb, kurias da pernai LSPA. Centro Komitetas, \u012fne\u0161us
  19 kuopai, rado u\u017e reikaling\u0173 i\u0161leisti. J\u0173 i\u0161leidimu keletas
  19 kuopos draug\u0173 paskolinio apie $150.00, bet Partijos reikalams svyruojant
  i\u0161leidimas t\u0173 dain\u0173 tapo atid\u0117tas iki III susiva\u017eiavimui.
  III susiva\u017eiavimas, kaip matyt i\u0161 protokolo, nutar\u0117 min\u0117tas
  dainas kuogrei\u010diausiai i\u0161leisti. Tuoj po susiva\u017eiavimu, galutiniai
  prireng\u0117s tam tikrus gaid\u0173 blankus, a\u0161 pasi\u016b\u010diau \u012f
  \u00abKovos\u00bb redakcij\u0105, i\u0161 kur buvo gaidos paduotos \u012f fabrik\u0105
  d\u0117l padarymo nuo j\u0173j\u0173 kli\u0161i\u0173. Neu\u017eilgo 2l N \u00abKovos\u00bb
  redakcijai apskelb\u0117, kad \u00abRevoliucijos dainos su gaidomis\u00bb greitame
  laike taps atspausdintos ir bus duodamos dovani\u0173 \u00abKovos\u00bb skaitytojams
  ir platinotajams. Tik \u0161tai 25 N \u00abKovos\u00bb pasirod\u0117 prane\u0161imas,
  kad dainos jau buvo spaudoje, bet... 19-ta kuopa susabd\u0117 darb\u0105 ir pareikalo
  vus sugra\u017einti gaidas per\u017eiureti... Man, kaip 19-tos kuopos nariai, gerai
  \u017einoma, kad toji kuopa niekad joki\u0173 nutarim\u0173 apie sustabdym\u0105
  darbo spaudinimo gaid\u0173 \u2014 nedar\u0117; turbut kokios naujos \u00ab19-tos\u00bb
  kuopos atsirado. Vienkart su tuom nekurie naujosi\u0173 tvarkos komitet\u0173 nariai
  prad\u0117jo ant man\u0119s, kaip rink\u0117jo t\u0173 dain\u0173 \u0161nairuoti,
  lyg ant padariusio did\u0119 piktat\u00e9d\u0117jist\u0119, u\u017emetinejo man
  vogim\u0105 svetim\u0173 kompozicij\u0173, tro\u0161kim\u0173 garb\u0117s, ant galo
  da\u0117jo iki skandal\u0173 ir... necenz\u016brisk\u0173 i\u0161kolijim\u0173 svetain\u0117j,
  buk a\u0161 didvyriams kelia uzstoja sl(!!) Ir nors kompozitorius, kuriam buvo paskirta
  tos dainos per\u017eiureti, jau por\u0105 m\u0117nesi\u0173 Amerikoje gyveno \u2014
  apie Revol. Dainas nieko nebuvo gird\u0117ti. Mat \u00ab19-tosios kuopos\u00bb nutar\u0117,
  kad atva\u017eiavusis i\u0161 Europos kompozitorius sud\u0117stytu gaidas rev. dainoms,
  manasias gi pakisio po suolu, neradami reikalingu net man apie tai prane\u0161ti.
  Bet aut nelaim\u0117s \u2014 kompozitorius ne tik k\u0105 nepute \u012f pseudo 19-tosios
  kuopos dud\u0105, bet dar pasak\u0117, kad esan\u010dios lietuvi\u0161koj kalboj
  revoliucijos dainos \u2014 n\u0117 daugiau, n\u0117 ma\u017eiau kaip... m\u0117\u0161la
  i*)*, ir tod\u0117l jis joms gaid\u0173 ner-\\n\\n*) Tas \u017eodis matomai i\u0161
  autoriaus fantazijos i\u0161dyg\u0119s: minimasis kompozitorius, abejotu, ar teip
  b\u016bt\u0173 sak\u0119s, bereikalo, rodos, \u010dia autorius cituoja tokius \u017eod\u017eius.
  Argi be tos nesmagoj kvaspines negalima jau ra\u0161yti polemikos? REd.\\n\\nGyvenimas
  \u2014 kova.\\n\\nI\u0161 rus\u0173 kalbos vert\u0117 \u0160ermuk\u0161n\u0117.\\n\\n[U\u017ebaiga].\\n\\nSkard\u017eiai
  skamba balsas vir\u0161 \u0161imto galv\u0173. Drebulis giliaus u\u017esid\u0117gimo
  perb\u0117ga per visus susirinkiusius.\\n\\nSenas mi\u0161kas linguoja savo \u017ealia
  galva ir kaip teip dusliai murma. Krek\u017ed\u0117l\u0117s maudosi \u0161vie\u017eiam
  rytme\u010dio ore. Lengvutis vejalis ant savo sparn\u0173 atne\u0161a dyvin\u0105
  sald\u0173 kvap\u0105. Kalba u\u017ebaigta.\\n\\nMinioj jud\u0117jimas. Gird\u0117tis
  balsai. Pradeda gyvos \u0161nekos.\\n\\nIr tarp \u0161nek\u0173, u\u017eimo vis
  ai\u0161kiau kilo smagia daina. Ji eina platyn, tvirt\u0117ja ir, kaip \u0161viesi
  sriov\u0117 pasipyl\u0117 ir prapl\u0117\u0161\u0117 kviepiant\u012f or\u0105.\\n\\nTen
  toliau, tarp tanki\u0173 krumyn\u0173 i\u0161dygo koks juodas \u0161e\u0161elis
  ir greit v\u0117l pranypo. Biaurus nusi\u0161ypojimas i\u0161kreip\u0117 ant valand\u0117l\u0117s
  plonas lupas.\\n\\nNicks \u0161nipo nepamat\u0117...\\n\\n* * *\\n\\nV\u0117lyva
  naktis.\\nChaimas s\u0117di savo kamarait\u0117j. Pro atvir\u0105 lang\u0105 karts\\n\\nPittsburg,
  Pa. Lietuviai, kaip ir visi darbininkai, nusigand\u0119 labai, kad darbai ma\u017einasi,
  daugyb\u0117 darbinink\u0173 atsta-\\n\\nnuo kartu i\u0161siver\u017eia v\u0117s\u016bs
  vejalis ir judina lempos \u0161vies\u0105. Nuo gatv\u0117s girdisi tolymas trenksmas
  kok\u0173 tai pav\u0117lavusi\u0173 rat\u0173.\\n\\nChaimas giliai u\u017esimast\u0117.\\n\\nPrie\u0161
  j\u012f guli du atidarytu lai\u0161ku. Linksmos naujienos: galingos \u017emoni\u0173
  jud\u0117jimo bangos pakilo. Visoj \u0161alyje \u2014 audra. Baku mieste keturios
  de\u0161imtys tuskanteli\u0173 darbinink\u0173 i\u0161ne\u0161\u0117 savo apmaud\u0105
  ant gatv\u0117s. Odesoje ant gatvi\u0173 daromi did\u017eiausi mini\u0173 susirinkimai.
  Prakiln\u0173 oratoriai u\u017edega \u0161venta ugnumi vargingas, nuskriaustasias
  \u0161irdis. Visi vakarai ugnyje. U\u017edaryti pabrakai, u\u017edarin\u0117tos
  dirbtuv\u0117s, nustojo vaik\u0161\u010dioj\u0119 traukiniai. Mil\u017einas tik
  vien\u0105 jud\u0117jim\u0105 padar\u0117. Vilnys kyla vis auk\u0161tyn, vis auk\u0161ty...\\n\\n\u2014
  Jos u\u017epils ir m\u016bs miest\u0105, \u2014 sako Chaimas, ir laimingas nusi\u0161ypojimas
  nu\u0161viet\u0117 jo veid\u0105.\\n\\nBet greitai jis v\u0117l surimtejo. Galvoje
  pas j\u012f gimsta naujas platus plenas. Minios jud\u0117jimas turi but organizuotas,
  vienuotinas nepasikakinimas turi buti ap\u0161viestas supratimo liepsna, reikalavimai
  turi buti ai\u0161kiai i\u0161rei\u0161ksti. Prakeikimas prie\u0161ams turi i\u0161
  vis\u0173 pus\u0173 skamb\u0117ti. Kalb\u0117tojai turi but pasireng\u0119 visose
  miesto dalyse.\\n\\nKiekviena valand\u0117l\u0117 brangi.\\n\\nChaimas griebiasi
  u\u017e pluksnos. Jis ra\u0161o atsi\u0161aukim\u0105 darbininkams, atsi\u0161aukim\u0105
  visai draugijai. Jis ai\u0161kina prasm\u0119 dideli\u0173 atsitikim\u0173.\\n\\nRevoliacija
  artinas, jau ji at\u0117jo. Didelis istorijos nusprendimas jau para\u0161ytas. Am\u017eiais
  u\u017ekalti ret\u0117\u017eiai puola. Pat\u0117 nuo darbo ir da atstato. B\u0117t
  kod\u0117l darbams prad\u0117jus stoti, nestoja g\u0117rymas \u2013 kar\u010diamos
  pilnos \u017emoni\u0173 ir nematyt ap\u0161viest\u0173 nuo giryt\u0117s... M\u016bs\u0173
  ap\u0161viestunai pilnai u\u017esipl\u0117y akis ruduoju skystimu \u2013 tai j\u0173
  auk\u0161\u010diausia kultura ir svarbiausi susirinkimai kar\u010diamose; pasir\u0117m\u0117
  ant baro giriasi savo mokslu, yra toki\u0173, k\u0105 reikia, kad jie septyni\u0173
  klaus\u0119 es\u0105. Gerai tai n\u0117 abe, n\u0117 eme, bet kar\u010diamoj\u0173
  prakalbas sakyti tai moka. \u2013 Jei m\u0117s tik kar\u010diamoj\u0173 mokisiime
  \u017emones, tai \u017einoma, nieko nei\u0161mok\u0117sime. Senov\u0117s patar\u0117
  sako: dviej dievam negali tarnauti \u2013 stikliniam ir kitam dievui.\\n\\nVietiniai
  socialistai teip pat ne kaip darbuojasi: bloginiausia, kad jie nesirupina suprast
  sociali\u0161ko mokslo pamat\u0173 ir u\u017esigan\u0117dina tik tu\u0161\u010diu
  \u0161nek\u0161iu, o kiti da pasigiria es\u0105 laisvais arba laisvamaniais.\\n\\nA.J.\\n\\nPaterson,
  N.J. LSS. 65 kuopa susirinkime lapkri\u010dio 17 d. nutar\u0117me vienbalsiai remti
  kiek gal\u0117dami literaturos ir socializmo mokslo platintojus drgg. P.Dubick\u0105
  ir A.Baltru\u0161ait\u012f, kurie nukent\u0117jo 22 rugpj\u016b\u010dio per neteising\u0105
  are\u0161tavim\u0105 per prie\u017east\u0119 kun. Kaulakio u\u017e pardavin\u0117jim\u0105
  literaturos, m\u0117s patemij\u0119 t\u0105 liudnij\u0105 \u017einut\u0119, i\u0161rei\u0161kiam\u0117
  savo veik\u0117jam u\u017esuojaut\u0105 ir pri\u017eadame reikale aukauti nors po
  kelet\u0105 cent\u0173, nors tokiu budu m\u0117s pri\u017eadam ginti juos nuo visoki\u0173
  bur\u017eu\u0173, kuriie negana, k\u0105 sl\u0117gia, alina ir demoralizuoj\u0105
  dor\u0161kai ir pro-\\n\\nsik\u0117l\u0117 sunki ir galinga darbinink\u0173 ranka...\\n\\nLaikas
  b\u0117ga.\\n\\nChaimas \u012fsigilin\u0117s \u012f savo darb\u0105. Ryt atsi\u0161aukimai
  turi buti parengti.\\n\\n\u0160tai \u2014 bild\u0117sis \u012f duris.\\n\\nChaimas
  kruptel\u0117jo. Tamsus \u0161e\u0161\u0117lis perb\u0117go per jo veid\u0105.\\n\\n\u2014
  Kas ten?\\n\u2014 Krasininks (pa\u010dtorius). Jums telegrama. Atidarykit.\\n\u2014
  Tuoju. U\u017esideg\u0161iu \u017eiburi.\\n\\nChaimas pripuola prie dur\u0173, klauso.
  Nakties tylumoje girdisi silpnas pentin\u0173 \u017evang\u0117sis.\\n\\n\u2014 \u017dandarail!
  \u2014 prab\u0117ga jam mintis per galv\u0105.\\n\\nTylos, ant pir\u0161t\u0173
  pri\u0117ina jis prie lango, \u017eiuri kieman. Apa\u010dioj tyla \u2014 viskas
  miega.\\n\\nSkubinai griebia jis popieras nuo stalo ir kem\u0161a sau \u012f ki\u0161enius.
  \u010ciumpa nuo sienos rank\u0161lust\u012f, priri\u0161a prie lango ir per j\u012f
  nusileid\u017eia nuo antro gyvenimo \u012f kiem\u0105.\\n\\n\u012e duris dar smarkiau
  beld\u017eia.\\n\\nKaip koks \u0161e\u0161\u0117lis, slenka Chaimas per kiem\u0105
  prie u\u017epakalin\u0117s tvoros. Jis girdi savo \u0161irdies greit\u0105 plakim\u0105.
  Kiemo kert\u0117j niukso sukrautos malkos. Jis per malkas u\u017esipl\u0117ja ant
  tvoros. \u0160tai jau jis per\u0161oko \u012f kit\u0105 kiem\u0105, o ten \u2014
  vartai vis\u0105 nakt atviri stovi.\\n\\nI\u0161 tolo girdi jis stipr\u0105 tra\u0161k\u0119jim\u0105.
  \u00abRaudonsiuliai\u00bb i\u0161lau\u017e\u0117 duris.\\n\\n* * *\\n\\nCourtney,
  Pa. Spalio 20 d. draugai darbininkai paren\u0119 prakalbas. Kalb\u0117jo F.Bago\u010dius,
  J.Luko\u0161evi\u010dia (apie revoliucij\u0105 Lietuvoj) ir senas Maskolijos kareivis
  L.Verbluigevi\u010dia \u2014 apie nuo\u017emus laikym\u0105 rus\u0173 kareivij.
  Drg. Bago\u010diui paraginus prisira\u0161yt \u012f Liet. Soc. S\u0105jung\u0105,
  \u012fsira\u0161e tris nauji draugai. Auk\u0173 sumesta $ 15.90, kuriuos perskiriam
  pusiau: revoliucijai ir literaturos fondan. Bavo tokij\u0173 nesusiprat\u0117li\u0173,
  k\u0105 neaukavo ir da kitus atkalbin\u0117jo.\\n\\nSocijalistas.\\n\\nRochester,
  N.Y. Spalio 10 d. atsibuvo vestuv\u0117s Juozo Krystu\u010dio su Ona Valiuliute.
  Besilinksminant tose gra\u017eiose\\n\\nDienos b\u0117ga, b\u0117ga m\u0117nesiai.\\n\\n\u017dmon\u0117s,
  miestai, d\u017eiaugsmas, nuludimas \u2014 viskas mai\u00f1osi sriaunam gyvenimo
  verpete. Su neapsakomu greitumu auga sp\u0117kos, tvirt\u0117ja drasa.\\n\\nIr tarp
  daugyb\u0117s \u012fvairi\u0173 paveiksli\u0173 pradeda ai\u0161k\u0117ti \u0161velnus
  moter\u0117s veidas, \u2014 kaip balta leliaj \u017ealiosios \u017eol\u0117s juroj.\\n\\nJi
  jauna. Vilnys puiki\u0173 \u0161vies\u0173 plauk\u0173 dabina jos galv\u0105. Veidas
  i\u0161bal\u0117s. M\u0117lynos akys pilnos meil\u0117s ir u\u017euojautos, teip
  dyvinai maloniai su\u0161ildo du\u0161i\u0105. Veidas i\u0161didus, dr\u0105sus...\\n\\nJie
  da\u017enai susieidavo. Jie ir dar keli draugai kas savait\u0117 susiedavo apsvarstyti
  \u012fvairi\u0173 klausim\u0173. Jie susirinkdavo ir siaurose, dr\u0117gnose ir
  tamsoje kamaraitese nuskurusioje miesto dalyj, ir puikiuose kambariuose turtingiausi\u0173j\u0173
  nam\u0173, ir lauke ir mi\u0161ko tankumyn\u0117j. Jie tar\u0117si apie streikus,
  apie minius protestus, apie agitacij\u0105 ir organizavim\u0105. Jos tylus balsas,
  \u0161velnus kaip gitaros balsas, rimtai ir gri\u0119\u017etai skamb\u0117jo minut\u0117j
  u\u017esidegimu. Akys teip dyvinai \u017eib\u0117jo.\\n\\nJiedu pasteb\u0117jo viens
  kit\u0105 ir kaip tai net\u0119cia atsiskirdavo nuo kit\u0173. Paprastas juodv\u0117jas
  pasiveikinimas d\u0117l j\u0173 tur\u0117jo ypating\u0105 vert\u0119. Paspaudime
  rankos buvo tiek nepasakyt\u0173 \u017eod\u017ei\u0173... Ir abiemis jiems gyvenimas
  paliko kaip ir \u0161iltesnis. Rimtos kalbos apsisipuo stebuklinga spalva. Ir visas
  pasaulis i\u0161rod\u0117 tokiu geru, tokiu linksmu...\\n\\nN\u0117 karto jie da
  apie meil\u0119 nebuvo kalb\u0117j\u0119. Jie tik per susirink\u010dius susieidavo.
  Svarbi\u0173 klausimai u\u017eimdavo vis\u0105 j\u0173 atydi\u0105. Kitaiap jie
  nesimatydavo. Ji buvo policijos prie\u017eiuroje, jis slapst\u0117si kitu vardu.
  Ji darbavosi ant vietos,\\n\\nvestuv\u0117se, atsimin\u0117m, kad ne visi toki laimingi,
  kaip m\u0117s, kiti puva kalejimuose, kiti nukankinti, ir da kankina tas \u0161iaur\u0117s
  me\u0161kinas, tas gyv\u0117 Mik\u0117. \u017diaur\u0173 pasidaro pamisliju, kad
  labai ma\u017eai yra pas mus susipratimo. A\u0161 nepamir\u0161iu tos valandos ir
  to reginio, kada drg. S.Valiulis u\u017eman\u0117 apie aukas ir drgg. J.Merku\u0161evy\u010dius
  ir J.Greeley ejo rinkti: visi jaunikai\u010diai smuko kas per duris, kas \u012f
  kamp\u0105, o kits gal po stalu pasmuk\u0119s niuksojo... Ar tai ne sarmata vaikinams,
  kad visos merginos paaukavo, kiek katra gal\u0117jo, o vaikinai beveik n\u0117 vienas.
  A\u010di\u016b jums mergait\u0117s ne tik u\u017e aukas, bet ir u\u017e ta, kad
  tai visai gaujai tamsiol\u0173 tokiai sarmata padar\u0117! Suaukauta \u00a7 2, i\u0161\u0117mus
  siuntimo ka\u0161tus 6c., pasi\u016bn\u010diu RRK. i\u0161dininkui.\\n\\nVeselininkas\\n\\nCollinsville,
  Ill. Susirink\u0119 pas P.Vaitavi\u010di\u0173 gra\u017eus burelis lietuvi\u0173,
  kalb\u0117josi apie \u0161i\u0173 dien\u0173 pad\u0117jim\u0105 teipgi ir apie m\u016bs\u0173
  brolius vaitojan\u010dius Rusijos kalejimuose ir kankinamus u\u017e linosyb\u0119.
  T.\u017durauckas pasak\u0117 eiles apie senov\u0117s baud\u017eiav\u0105, kuri tarpais
  susirinkusiems prijukino, o tarpais sugraudino; drg. J.Stepanavi\u010dia teipgi
  pasak\u0117 eiles \u00abOi likis, t\u00e9vyn\u0117\u00bb ir \u00abPaliov\u0117 griaut
  ir bautb kanuol\u0117s\u00bb. Labai tas visiems patiko. Ant pabaigos da T.\u017durauckas
  pasak\u0117 juokingas eiles apie girtuokl\u012f, su kuriomis gal\u0117jo ir verkiantj
  prajuokint. U\u017emanius sumest auk\u0173 revoliucijai, ko\u017enas met\u0117 savo
  auk\u0105 su did\u017eiausi\u0173 noru. Sumesta $ 8.90. Skiriama 6 dol. revoliucijos
  naudai ir 2.90 \u00abKovos\u00bb fondan. S.Stankus pasidarbavo rinkdamas aukas tarpe
  draug\u0173 ir pa\u017e\u012fstam\u0173; surinko da $ 10.85. Pagal aukantoj\u0173
  nor\u0105 skiriame revoliucijos reikalams.\\n\\nMieli broliai ir seseris, nepraleiskim
  progos, kur tik kada galint rinkime aukas ar tai susirinkime, ar tai vesel\u0117se:
  vis tik reikia dr\u0105sos ir prad\u017eios, o vis bus nors viena plyta prie laisv\u0117s
  ir ap\u0161vietos rumo. Prisi\u0173sdami aukas padra\u0161insime savo brolius ir
  seseris kovojan\u010dius u\u017e laisv\u0119.\\n\\nT.\u017durauckas.\\n\\nWilmington,
  Del. U\u017emanius geriem draugams kaslink rinkimo auk\u0173 naudai LSDP., i\u0161rinkta
  \u012f komitet\u0105 eiti per namus kolektavoti su paliudijimu P.Sargunas i\u0161
  dr-t\u0117s \u0161v. Kazimiero 108-tos kuopos SLA., M.Dovidaitis i\u0161 K. Gedimino
  kliubo, ir K.Mankeliunas i\u0161 66-tos kuopos LSS. Yra jau per\u0117j\u0119 kai-kurias
  vietas lietuvi\u0173 agpyventas, bet labai ma\u017eai kas atsi\u017eym\u0117jo aukomis.
  Gailu, kad m\u016bs\u0173 tarpe yra skirtumas nevienu tautoje, bet kiekvienos gubernijos
  lietuvi\u0173 atsi\u017eym\u0117 ant kiek turi susipratimo kaip Suvalk\u0173 ir
  Kauno gubernij\u0173; apie kit\u0173 gubernij\u0173 visi\u0161kai \u010dia ir nemin\u0117sime.
  \u2014 Kada pabaigsite kolektav\u0119, surinktus pinigus i\u0161si\u016bsime ant
  LSDP. I\u0161dininko rank\u0173.\\n\\nLapkri\u010dio 5 d. didelis sujudimas atsibuvo
  visam Delaware st\u0117ite tarp \u017emoni\u0173 gerian\u010di\u0173 ir negerian\u010di\u0173
  svaiginan\u010dius g\u0117rimus. G\u0117rikai ir kar\u010diam\u0173 lankytojai labai
  nusimin\u0119 buvo, kadangi pilie\u010diai i\u0161\u0161aukti buvo prie slapto balsavimo
  apie u\u017edarim\u0105 kar\u010diam\u0173. Kad ir naudingas u\u017emanymas buvo,
  bet g\u0117rikai savo pus\u0119 atlaik\u0119, o negerianti pralaim\u0117jo.\\n\\npusi\u0173.\\n\\nAkimirksnis
  \u2014 jau viens i\u0161 j\u0173 turi Chaim\u0105 u\u017e rankos. Antrasis i\u0161sitraukia
  i\u0161 ki\u0161eniaus revolver\u012f ir sta\u010di\u0161i jam aprei\u0161kia:\\n\\n\u2014
  Tamsta are\u0161tuotas.\\n\\nNetoli leidosi nuo kalno jauna mergel\u0117, baltu
  drabu\u017eiu apsivilkus.\\n\\n* * *\\n\\nKal\u0117jimas miega.\\nSpinda \u0161lap\u012f
  stogai. Balta tvirta siena lyg juokiasi ironi\u0161kai.\\nViskas miega.\\nChaimas
  s\u0117di ant lango ir tykiai \u017eiuri \u012f nakties tamsum\u0105.\\nM\u0117nulis
  nubalo ir liudnai \u017eiuri i\u0161 auk\u0161tyb\u0117s. Stipresnis paliko v\u0117jalis
  ir atne\u0161\u0117 v\u0117s\u0173 \u0161vie\u017eium\u0105. Kur tai pabudo pauk\u0161tyt\u0117
  ir i\u0161 mieg\u0173 pragydo dv\u00ed, tr\u00eds gaidas.\\nSuimtas!\\nKamera ne\u0161vari.
  Dr\u0117gnosios sienos siurbia krauj\u0105. \u017demos lubos sl\u0117gia galv\u0105.
  Ret\u0117\u017eiai \u017evanga. Ir tas j\u0173 \u017evang\u0117jimo garsas, kaip
  a\u0161trus, duriantis akmuo, gula ant du\u0161ios. Per largel\u012f lenda baisus
  sargo veidas. Ko jis ten \u0161aipos?\\nSuimtas!\\nO ten... dideliam ir pla\u010diam
  pasaulyj, ten verda, putDarbinink\u0161ka pramon\u0117 labai suma\u017e\u0117jo,
  daug \u017emoni\u0173 yra be darbo. Kriaun\u010di\u0173 darbai eina geriau, negu
  pirmiau.\\n\\nNekurie draugai surengs prakalbas 22 kp. SLA. Gedimino kliubo svetain\u0117je,
  400 W. Front st. Ant kurio laiko, tikrai ne\u017einoma.\\n\\nM.Dovidaitis\\n\\nChicagie\u010di\u0173
  \u017einiai. Nesenai \u012f Jungtines Valstijas atva\u017eiavo vienas \u017eymus
  ir \u017einomas veik\u0117jas Rusijoj, buvusiis astovas (pasiuntinys) i\u0161vaikytos
  II dumos drg. J.Ozol. Jo tikslas tai supa\u017eindinti amerikie\u010dius su politi\u0161ku
  ir ekonomi\u0161ku pad\u0117jimu dabartin\u0117s Rusjos. Laikra\u0161\u010di\u0173
  skaitytojams \u017einomas jo energi\u0161kas darbas II dumoj, prie\u0161 netikus\u012f
  \u0161alies suredym\u0105; jo dr\u0105sus atsakymai vardin social\u2013demokratijos
  ir audra, kuri pakilo valdan\u010di\u0173j\u0173 tarpe per jo atidengim\u0105 prie\u0161
  vis\u0105 civilizuot\u0105 sviet\u0105. Nurod\u0117 tuos bausius darbus vald\u017eios,
  kurie praktikavos ir praktikuojasi Rusijos kalejimuose ir are\u0161tant\u0173 namuose.\\n\\nI\u0161vaikius
  II dum\u0105, reakcija Rusijoj i\u0161vyravo ir prasid\u0117jo persekiojimas t\u0173
  element\u0173 dumos, kurie dr\u012fso kritikuoti ir apkalbinti darbus cari\u0161kos
  biurokratijos. Daugeliui pasiuntini\u0173 prisiejo permainyt\u012f savo pasiuntinyst\u0117s
  kr\u0117slus ant kalejimo ir tiktai a\u010diu geroms aplinkyb\u0117ms astovui drg.
  J. Ozolui pasisek\u0117 i\u0161silinusioti i\u0161 to likimo.\\n\\nPirmutines savo
  kalbas po atkeliaivimui Amerikon drg. J.Ozol laik\u0117 New Yorke, prad\u0117damas
  nuo su\u0161aukimo I dumos, baigdamas i\u0161vaikymu antrosios. Re\u017eim\u0105
  atau\u0161an\u010dios\\n\\nHarvey. III. Lapkr. 24 d. pareng\u0117 prakalbas vietiniai
  lietuviniai, nor\u0117dami suorganizuoti LSS. kuop\u0105. Kalb\u0117tojai buvo \u0161ie:
  drgg. K.Rutkus ir Jan\u010dauskis. \u017dmoni\u0173 visai ma\u017eai susirinko,
  ba, \u017einomas dalykas, kaipgi eis, kad visus socialistus velniais vadina... K.Rutkus
  ai\u0161kin\u0117 nelaiming\u0105 darbinink\u0173 pad\u0117jim\u0105 ir kapitalist\u0173
  laiming\u0105 ulevojim\u0105. Drg. Jan\u010dauskis ai\u0161kin\u0117, kad darbininkai
  be vienyb\u0117s negali nugriaut kapitalizmo. Baigiant kalb\u0105 K.Rutkus paragino
  paukauti su\u0161elpimui na\u0161lai\u010di\u0173 Lietuvoj; tada prad\u0117jo visai
  b\u0117gt i\u0161 sal\u0117s keletas paukavo i\u0161 viso 76c. pasi\u016bsta i\u0161dan
  RRK. perduot LSDP.\\n\\nP.J. Kaupavi\u010dia.\\n\\nNaujoji gadyne.\\n\\nKalnai ir
  girios mainosi \u0161iandien po visus pavergo svieto kra\u0161tus. Ukanos, miglos
  sklaidosi vir\u0161\u0173, debeisai skirstos \u2013 gamta eina skaistyn... Didel\u0117
  permaina sviet\u0117 jau rodos. Mainosi dienos mums, broliai, vargo sunus! Kur vald\u017eia
  \u017emones laiko suspaudus, \u0161iandien ten laikai mainosi kit\u012f; kur vargas
  tik buvo, ten pradeda \u0161viesa i\u0161 vir\u0161aus u\u017e\u0161vieti; kur a\u0161aros
  liejos, kur kraujas tek\u0117jo, ten pradeda biurokratijos jis charakterizuojuo
  darodydamas tuo, kad \u0161alis \u017eingsnis po \u017eingsniui eina prie finansi\u0161ko
  bankruto ir sude-moralizavimo visos liaudies. Toliau ai\u0161kiai nupie\u0161ia
  darbus social\u2013demokratijos, kovojan\u010dios u\u017e laisv\u0119 Rusijoj ir
  reika lingumo liaudies atstov\u0173; teipgi apie privilegijas, kuriomis naudojasi
  caro vald\u017eia link atstov\u0173. Ir ant galc su daugel fakti\u0161kais darodymais
  jis lemia neatbutin\u0105 ir greit\u0105 puolim\u0105 dabartin\u0117s caro vald\u017eios.\\n\\nChicagon
  astovas dr-gas J.Ozol atkeliaus pirmose die-lose gruod\u017eio m., tod\u0117l, kas
  norite i\u0161girsti jo prakalb\u0173, pasi-tengkite buti, nes bus garsinama per
  lapelius.\\n\\nA.\u017dimontas.\\n\\nJaunus gyvenimus, ten \u017eydi naujos viltys,
  ten plati sriov\u0117 perlau\u017e\u0117 ledo plut\u0105 ir lauzo \u012f skiltis
  sunkius ret\u0117\u017eius. Audra auga. Ir ne\u0161a naujas sp\u0117kas u\u017esalusiam
  pasauliui. Artinasi pavasario rytas, ateina didel\u0117 kova u\u017e laisv\u0119.\\n\\nSuimtas!\\n\\nSp\u0117kos
  \u017euva, \u017euva geresnieji metai. O ten \u2014 ten kiekvienas kovotojas brangus,
  ten darbas daugyb\u0117s rank\u0173 reikalauja, ten kiekvienas dr\u0105sus \u017emogus
  \u2014 naujas pergales \u017eingsnis, naujas akmuo dideliam laisaus gyvenimo rumui.\\n\\nJis
  kalejime \u2014 jaunas erelis su galingais sparnais. Priskaltas, surakintas. Ma\u017ei
  juodi \u0161ik\u0161nosparniai juokiasi i\u0161 jo, erzina j\u012f.\\n\\nNebeilgai
  jau jis bus surakintas...\\n\\n\u0160alin prakeikimas, visos neteisyb\u0117s, k\u0105
  platinot tarpe m\u016bs\u0173 vien tik vargus. Gana, k\u0105 i\u0161jud\u0117t broli\u0173
  milijonus, paglem\u017e\u0117t teisyb\u0119, atv\u0117r\u0117t bad\u0105... \u0160iandien
  m\u0117s linksmi, akis atsidar\u0119, nutrauk\u0119 narves nuo savo veid\u0173,
  visi susitelk\u0119 \u012f burius did\u017eiausi\u0173 traukiam marseliet po raudonaj\u0105
  v\u0117liav\u0105, ei-dami nutraukti visiems veidmainiams nuo veid\u0173 prigavingas
  narves.\\n\\nK.Armonas.\\n\\nI\u0160 LIETUVOS. Beisogala (Kauno gub.). I Beisogalos
  stot\u012f (Liepojaus\u2013Romn\u0173 gel\u017ek.) at\u0117jo minia apylink\u0117s
  moter\u0173, kurios nedav\u0117 krauti \u012f vagonus ve\u017eam\u0173j\u0173 \u012f
  u\u017esien\u012f grup\u0119. Vietinis \u017eandaras negalejo prie\u0161inties moter\u0173
  miniai ir noroms\u2013noroms reik\u0117jo sutikti su \u00abma\u0161tiniukais\u00bb
  reikalavimu. Pagelbon buvo tuojuas pakviesta pavieto policija ir atvyk\u0119 sargybiniai
  i\u0161vaik\u0117 minia. Suimta keletas moter\u0173. Grudus po to sukrov\u0117 \u012f
  vagonus ir i\u0161ve\u017e\u0117 \u012f u\u017esien\u012f.\\n\\n(\u00abV.\u017d.\u00bb)\\n\\nAtsi\u0161aukimas.\\n\\nPaskutiniu
  laiku mus\u0173 draugams prad\u0117jus smarkiau varyti agitacij\u0105, lietuvi\u0161ki
  jezuitai i\u0161 kailio neriasi ir nesumano, kaip t\u0105 sulauktyti. Pirmiaus jie,
  b\u016bdavo, pasikirtais ned\u0117d\u017eiantis per pamokslus ''extra'' keikdavo
  tuos, kurie skaito socialist\u0173 laikra\u0161\u010dius, knyg\u0117les ir lankosi
  socialist\u0173 susirinkimose. \u017dmon\u0117s, matydami toki\u0105 beprotyb\u0119,
  prad\u0117jo visai ant juoko kunigus laikyti ir i susirinkimus daugiau lankosi negu
  paprastai. Kunigai, matydami, kad j\u0173 keiksmai nieko negelbsti, kad \u017emon\u0117s
  pradeda reikalauti grynio mokslo ir ap\u0161vietimo, prad\u0117jo tam reikaliui
  naudoti policijos galyb\u0119, mislydami, kad su policijos pagelba jiems lengviau
  pasiseks sulaukyti \u017emones nuo pirm\u017eengyst\u0117s. Teip yra atsiti\u0161k\u0119,
  Philadelphijoje, Brooklynje, Chicagoj, Nevarke, Baltimorej ir kitur. Ar kunigams
  pasiseks atsiekt savo tikslus? Trumpam laike tai pamatysime.\\n\\nA\u0161 pra\u0161au
  draug\u0173 i\u0161 to viet\u0173, kur lietuvi\u0161ki kunigai atsi\u017eym\u0117jo
  kokiais nors persekiojimais, keiksmai per pamokslus, ar skusdamis policijai, u\u017edarydami
  susirinkim\u0173 sal\u0117s ar kokiais persekiojimais, kad sura\u0161\u0117 visk\u0105
  ai\u0161kiai man prisistum\u0117t\u0173. Ra\u0161ydami turite apra\u0161yt kuriuo
  vietoj tas atsiti\u0161k\u0173, kuria diena, piln\u0105 vard\u0105 kunigo ir jo
  pagelinink\u0173. Jeigu galima ir istori\u0161k\u0173 darbai b\u016bt\u0173 gerai
  nurodyti tokio kunigo; pavyzd\u017eiui \u2014 kaip man pasakojo apie garsusi Philadelphijos
  klebon\u0105 \u2014 jis savo parapijonus i\u0161tvirtin\u0119s teip, kad jau su
  jais vietas visoje Philadelphijoje nerandasi; jam beklebonantur turb\u016bt ar i
  a\u0161tuont\u0105 viet\u0105 su savo ba\u017enyt\u0117le tur\u0117jo kraustytis...\\n\\nTikiuos,
  kad draugai i\u0161klausys ir i\u0161pildys mano pra\u0161ym\u0105.\\n\\nP. Dubickas.\\n\\nDARBININKO
  KRONIKA.\\n\\nHelsingforse (Finland.) atidaryta socialist\u0173 mokykl\u0105 vaikams.
  U\u017esira\u0161\u0117 jau 200 vaik\u0173 ir mergaiti\u0173. I ved\u0117jus (mokytojas
  ir k.) u\u017esira\u0161\u0117: 22 ypatos. \u0160alia paprast\u0173 mokyklos dalyku,
  bus i\u0161guldin\u0117jama tarptauti\u0161koji kalba esperanto, etnologija, mokslas
  apie valstyb\u0119 (politik\u0105) gamtos mokslai, muzyk\u0117 ir tt.\\n\\n\\\"Appeal
  to Reason\\\" (i\u0161\u0117jina Girarde, Kansas) amerikie\u010di\u0173 socialist\u0173
  savaitra\u0161\u010dio N 625 pa\u0161v\u0117stas kaliniams ir kankiniams, \u012fs\u0117kmui
  \u2014 \\\"kal\u0117jinams ir kartyn\u0117ms! Mat to laikra\u0161\u010dio redaktori\u0173
  vald\u017eia ar\u0117stavo ir kartina u\u017e neteising\u0105 ap\u0161meizim\u0105
  ir kitus prie\u0161 valstyb\u0119 pras\u012f\u017eingimus (vienas straipsnis buvo
  konfiskuotas). D\u0117l tos proges min\u0117tas numeris pa\u0161v\u0117stas kankiniams,
  kuri\u0173 ne ma\u017eai buvo ne tik barbari\u0161kose \u0161alise, bet ir \\\"laisvoje\\\"
  Amerikoj.\\n\\nAmerikos laisv\u0119 neu\u017eliogo bus tik svajon\u0117!\\n\\nKalifornijoj
  padaryta nauji peili\u0173, su Moyerio ir Haywoodo paveiksl\u0117liais ir para\u0161u
  (angli\u0161ku): \\\"Visos pasaul\u0117s darbininkai, vienykit\u0117s\\\". Kaip
  garsinama, tu peili\u0173 pelnas b\u016bsias pa\u0161v\u0117stas socialist\u0173
  propagandai. Tas apgarsinimas paserg\u0117ta laikra\u0161tyje \\\"Common Sense\\\",
  Los Angeles, Cal.\\n\\nI\u0161 Indijos prane\u0161ama, lapkri\u010dio 28 d., kad
  mohamedai neklau so vald\u017eios padavadijimo \u2014 persikraustyti kitur i\u0161
  viet\u0173, kur u\u017e\u0117j\u0119s maras. Jie mat tiki, kaip j\u0173 koranas
  (biblija) sako, kad negali \\\"b\u0117gt nuo Dievo r\u016bstyb\u0117s\\\", tai teip
  ir mir\u0161ta. Lygiai ketvirta dalis milijono myri\u0173, atsitiktusiu i\u0161
  epidemijos, priklauso nuo to tik\u0117jimo.\\n\\nMilijonierius John Whitley lapkri\u010dio
  29 d. Bellectaire hotelyje New Yorke suvar\u0117 dvi kulkas \u012f galv\u0105 miegan\u010diai
  savo pa\u010diai ir pats i\u0161skoko per lang\u0105 nuo de\u0161imto gyvenimo;
  jo kunas ant gatv\u0117s nukrit\u0119s teip su\u017ei\u016b, kad negalima pa\u017eint.
  To prie\u0161as\u010dia buvusios pinigin\u0117s painios ir didelis nuostolis.\\n\\nK\u0104
  RA\u0160O LIETUVI\u0172 LAIKRA\u0160\u010cIAI?\\n\\n\\\"Vilniaus \u017diniose\\\"
  ra\u0161o A. Karvelis: \\\"Nieks Lietuvoj, man rodos, neatjau\u010diau tu ''ipatinguju'',
  ''a\u0161trijuju'' ir kit\u0173 laikin\u0173 \u012fstatym\u0173, kaip lietuvi\u0173
  suvalkie\u010diai. Jie b\u016bdami ma\u017e-daug daugiau apsi\u0161viet\u0117 ir
  geriau susiprat\u0117 u\u017e kitus lietuvinus, tad suteiktas manifestu laisves
  stengsi kiek galint i\u0161naudoti: \u0117m\u0117 tverti \u012ftairius ap\u0161vietimo
  ir kitas draugijas... steigti knygynus bei skaityklas, susirinkimuose skaityt leckijas,
  referatus ir tt.\\\" Tas vald\u017eiai nepatiko ir Var\u0161avos general-gubernatorius
  Skalonas i\u0161leido rugp. 20 d. du \u012fsakym\u0173. Vienas buvo viso lenk\u0173
  karalyst\u0117s i\u0161\u0161ilpinas \u2014 u\u017edraudimas steigti ir laikyti
  k n y g y n u s ir s k a i t y k l a s, be vald\u017eios leidimo. Per\u017eeng\u0119sis
  ta \u012fsakymu bus baud\u017eiamas 3000 rub. arba 3 m\u0117n. kalejimo. Kitu \u012fsakymu,
  kuris prad\u017eioj lapkri\u010dio drange su pirmuoju buvo oficiali\u0161kai (per
  vals\u010di\u0173 valdybas) \u012fduotas draugij\u0173 pirmininkams, Skalonas u\u017edraud\u017eia
  draugijoms ir pavieniems ypatoms \u00abrenti\u00bb skaitymus, leckijas su tikslu
  ap\u0161vieti \u017emones, teipogi \u012fkurti mokykles ir mokyklas bei suaugusiems
  kursus\u00bb. Beto da esas u\u017edrausta nuo pirmuoju lipdyti ir apskritai platinti
  bo tam tikro vald\u017eios leidimo visokias afi\u0161as, apskelbimus, nors ir nekal\u0117\u010diausius.
  Labiausiai atkreipiami atyda \u012f apskelbimus apie draugij\u0173 susirinkimus,
  veikim\u0105. \\\"Visi tie ret\u0117\u017eiai, visi tie \u017eabangai, biurokrat\u0173
  statomi ir taikinami ypa\u010d ant \u017emoni\u0173 \u0161vietimosi\\\". \\\"Apskritai
  tarp liandies vie\u0161patauja tokia nuomon\u0117, kad jeigu, girdi, kas vald\u017eios
  leista, tai turi b\u016bt negera, neteisinga; vald\u017eia norint per tai su\u017einoet
  kas ka ir kaip veikia ir suki\u0161ti \u012f kalejimus, i\u0161gr\u016bsti Sibiran,
  katorgon arba ir pas Abraom\u0105. (\u00abV.\u017d.\u00bb N 183).\\n\\n* * *\\n\\n\\\"Viltis\\\"
  straipsniukyje \\\"Svietas margas, lietuviu da margesni parodo, kad Lietuvoje \u00abkas
  \u0161eimyna, tai dvi ar keletas taut\u0173: Anupras Vilei\u0161is lietuvis, Anuprien\u0117
  gi Vilei\u0161ien\u0117 \u2014 lenk\u0117 ir da endek\u0117, g\u0105zdinant\u012f
  D\u017eien. Wilensk\u00bb lietuvis n\u0117 su\u017ealiavusio dyvlekcio jiem neduosianti...
  Petras Vilei\u0161is didelis patriotas \u2014 lietuvis, jo gi dukte \\\"Marja Wilejszys,
  teip pat patriot\u0117 bet... lenk\u0173 edneka\\\". \\\"Viltis stebisi, kod\u0117l
  teip yra. (Ar ne d\u0117to, kad patriotai platina lietuvyt\u0117 vestamis lenkes!!)\\n\\n*
  * *\\n\\nAnam numeryj pamin\u0117jom, k\u0105 mano apie d\u016bm\u0105 konservatyvi\u0161ki
  mus\u0173 laikra\u0161\u010diai, kaip pirmieiviskai\u2013klerikali\u0161koji \\\"Viltis\\\"
  baimijasi u\u017e jos gyvavimo netikrum\u0105, jeigu \u010dia partijos nesusivieny-\\nsian\u010dios.
  Dabar pa\u017ei\u016br\u0117kim, k\u0105 ra\u0161o lietuvi\u0173 socialdemokratai.\\n\\n\u00ab\u017darijos\u00bb
  N 17, \u012f\u017eanginiame straipsnyje \u00abJuodoji d\u016bma\u00bb, ra\u0161o:\\n\u00abDarbininkai
  tenai (d\u016bmoje) gali nieko nelaukti. Jais neuzsi-\\nims. Nebent tik leist\u0173
  \u012fstatymus j\u0173 prispanidumi. Reikia v\u0117l pra-\\nd\u0117ti darb\u0105
  nuo pamat\u0173 ir juos judinti i\u0161naujo. \u2014 Lietuviams teip\\npat n\u0117ra
  ko ten jie\u0161koti. Dauguma did\u017eiausia \u2014 tai rusal ir dar\\njuoda\u0161im\u010diai.
  Jie neken\u010dia svetimtau\u010dio, jie siundo tauta prie\u0161\\ntauta ir \u012ftaiso
  skerdynes, jie nor\u0117t\u0173, kad visur b\u016bt\u0173 rus\u0173 kalba,\\nkad
  \u017emogus nustot\u0173 buv\u0119s tuo, kuo yra. Tenai, toj d\u016bmoj, lietu-\\ntuviai
  gales sulaukti tik panci\u0173.\\n\\n\u00abNieko gero lai nelaukia pirm\u0117viai.
  Juodoji d\u016bma suks atgal\\ntekini, pasileidusi atgal, spirs upeli gr\u012f\u017eti
  atgal, jie tvenks j\u0173 dar-\\nb\u0105 ir trukdys.\\n\\n\u00abLai nelaukia nieko
  ir tikriejie demokratai, kurie nori, kad\\nvald\u017eia nuo \u017emoni\u0173 paeit\u0173
  ir ju klausyt\u0173. Juoda\u0161im\u010diai nor\u0117s, kad\\ngr\u012f\u017et\u0173
  atgal galutiniai nagalka ir durtuvas ir serg\u0117t\u0173 am\u017einai, kad\\nbiurokratams
  gerai b\u016bt\u0173.\\n\\n\u00abIr nepravoslavai \u2014 katalikai, evangelikai,
  \u017eydai ir kiti \u2014\\nneras ten u\u017etarimo. \u0160a\u017ein\u0117s laisv\u0119
  jau var\u017eo, var\u017eys dar labiaus.\\nJ\u0173, tu juoda\u0161im\u010diu, kad
  visur i\u0161ivyraut\u0173 provoslav\u0173 popas.\u00bb\\n\\n\u00ab\u017darija\u00bb
  mato tik vien\u0105 naud\u0105 i\u0161 d\u016bmos: \u00abpamatysime, kasdie-\\nna
  dirban\u010dius mus\u0173 nevidonus. Pa\u017ei\u016brime juos. \u017dinome, bent,
  kad\\ni\u0161 ten negalima laukti pakakinimo mus\u0173 reikal\u0173\u00bb. \u00abSavo
  reikalus\\napr\u016bp\u0161i\u0161me mes patys... patys pergals\u0117sime savo naminius
  nevido-\\nnus. Laikas atkreipti akis nuo svetimos vietos, i\u0161 kur laukiamas\\nbuvo
  pagelbos, \u012f save. Savyje jie\u0161koti sp\u0117kos, stoties ant savo ko-\\nj\u0105\u00bb.\\n\\nKRASOS
  DE\u017dUTE.\\n\\nK.Vidunui. Jeigu j\u016bs nera\u0161\u0117t korespondencijos,
