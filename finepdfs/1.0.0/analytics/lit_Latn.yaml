sample: '["\"NAUDOJIMOSI KAUNO KOLEGIJOS BIBLIOTEKA IR INFORMACIJOS I\u0160TEKLI\u0172
  CENTRU TAISYKL\u0116S\\n\\nI. BENDROSIOS NUOSTATOS\\n\\n1. Kauno kolegijos biblioteka
  ir informacijos i\u0161tekli\u0173 centras (toliau \u2013 Biblioteka) yra strukt\u016brinis
  kolegijos padalinys. Ji veikia vadovaudamasi Lietuvos Respublikos \u012fstatymais,
  Vyriausyb\u0117s nutarimais, patvirtintais Lietuvos standartais, kolegijos statutu,
  direktoriaus \u012fsakymais, Bibliotekos nuostatais ir \u0161iomis taisykl\u0117mis
  (toliau \u2013 Taisykl\u0117s).\\n2. Taisykl\u0117se vartojamos s\u0105vokos:\\n\\nBibliotekos
  fondas \u2013 visi dokumentai, kuriais Biblioteka apr\u016bpina savo vartotojus:
  dokumentai, sukaupti Bibliotekoje, ir i\u0161tekliai, pasiekiami nuotoliniu b\u016bdu,
  kuri\u0173 nuolatinei ar laikinai prieigai \u012fgytos teis\u0117s.\\n\\nDokumentas
  \u2013 naudojama ir saugojama laikmena su joje \u012fra\u0161yta informacija: knyga,
  periodinis leidinys, garsinis ir (arba) regimasis, kartografinis, vaizdinis, elektroninis
  ar kitu b\u016bdu pateikiantis informacij\u0105 dokumentas.\\n\\nVartotojas \u2013
  asmuo, Taisykli\u0173 nustatyta tvarka \u012fgij\u0119s teis\u0119 naudotis Bibliotekos
  paslaugomis.\\n\\n3. Bibliotekos fondai yra nacionalinis turtas, saugomas valstyb\u0117s
  \u012fstatym\u0173 nustatyta tvarka.\\n4. Biblioteka garantuoja vartotojams spaudini\u0173
  ir kit\u0173 dokument\u0173, neatsi\u017evelgiant \u012f j\u0173 autori\u0173 ar
  juose u\u017efiksuot\u0173 \u017eini\u0173 politin\u0119 ar ideologin\u0119 orientacij\u0105,
  prieinamum\u0105.\\n5. Naudojimasis Biblioteka yra nemokamas, i\u0161skyrus paslaugas,
  \u012ftrauktas \u012f Lietuvos Respublikos kult\u016bros ministerijos patvirtint\u0105
  \\\"Bibliotekos teikiam\u0173 mokam\u0173 paslaug\u0173 s\u0105ra\u0161\u0105\\\".
  Mokam\u0173 paslaug\u0173 \u012fkainius tvirtina kolegijos direktorius.\\n\\nII.
  VARTOTOJ\u0172 APTARNAVIMAS\\n\\n6. Registracija:\\n6.1. Registruotais Bibliotekos
  vartotojais gali b\u016bti: kolegijos studentai ir darbuotojai; u\u017esienio studentai,
  atvykstantys \u012f kolegij\u0105 pagal student\u0173 main\u0173 ir kitas programas.\\n6.2.
  Bibliotekos informacijos sistemoje vartotojai registruojami, perkeliant j\u0173
  duomenis i\u0161 kolegijos student\u0173 ir darbuotoj\u0173 duomen\u0173 bazi\u0173
  bei kit\u0173 institucij\u0173 duomen\u0173 bazi\u0173.\\n6.3. Vartotojai \u012fgyja
  teis\u0119 naudotis Bibliotekos paslaugomis susipa\u017ein\u0119 su Taisykl\u0117mis.
  Pirmojo kurso studentams mokslo met\u0173 prad\u017eioje Biblioteka rengia privalomus
  mokymus, kiti vartotojai supa\u017eindinami individualiai. Asmens dokumento br\u016bk\u0161ninio
  kodo nuskaitymas i\u0161duodant dokument\u0105,  prilygsta vartotojo para\u0161ui
  ir patvirtinimui, kad vartotojas yra susipa\u017ein\u0119s su Taisykl\u0117mis ir
  \u012fsipareigoja j\u0173 laikytis.\\n7. Bibliotekos informacijos sistemoje neregistruoti
  asmenys, pateik\u0119 galiojant\u012f asmens tapatyb\u0117s dokument\u0105, Bibliotekos
  dokumentais gali naudotis  tik skaityklose.\\n\\n8. Dokument\u0173 skolinimas:\\n8.1.
  Dokumentus galima skolintis turint asmens tapatyb\u0117s kortel\u0119, studento
  pa\u017eym\u0117jim\u0105 arba kolegijos bibliotekos skaitytojo pa\u017eym\u0117jim\u0105
  ir darbuotojo pa\u017eym\u0117jim\u0105 su br\u016bk\u0161niniu kodu, kurie sudaro
  galimyb\u0119 identifikuoti asmen\u012f bibliotekos informacijos sistemoje.\\n8.2.
  Asmens tapatyb\u0117s kortel\u0117s, studento pa\u017eym\u0117jimo, skaitytojo pa\u017eym\u0117jimo
  ar darbuotojo pa\u017eym\u0117jimo br\u016bk\u0161ninio kodo nuskaitymas i\u0161duodant
  dokument\u0105  prilygsta vartotojo para\u0161ui.\\n8.3. Dokumentai skolinami nuo
  vienos dienos iki semestro, atsi\u017evelgiant \u012f j\u0173 paklaus\u0105 ir Bibliotekoje
  esan\u010di\u0173 egzempliori\u0173 kiek\u012f.\\n8.4. Neskolinami \u012f namus
  dokumentai: periodiniai ir t\u0119stiniai leidiniai, standartai, reti ir vertingi
  spaudiniai bei vienas knygos egzempliorius. Dokument\u0173 status\u0105 (skaitymo
  s\u0105lygas) vartotojai gali su\u017einoti bibliotekos el. kataloge. Atviruosiuose
  fonduose neskolinam\u0173 knyg\u0173 egzemplioriai pa\u017eym\u0117ti spalvota juostele.\\n8.6.
  Naujai gautas dokumentas, naudojamas kaip pagrindin\u0117 literat\u016bra studij\u0173
  dalykui, studij\u0173 dalyko d\u0117stytojui gali b\u016bti skolinamas m\u0117nesiui,
  neatsi\u017evelgiant \u012f egzempliori\u0173 kiek\u012f. Pratyb\u0173 ar kit\u0173
  u\u017esi\u0117mim\u0173 metu d\u0117stytojo naudojami dokumentai yra d\u0117stytojui
  skolinami semestrui, esant poreikiui prat\u0119siant skolinimo termin\u0105.\\n8.7.
  Dokumentai skolinami tik gr\u0105\u017einus anks\u010diau paimtus dokumentus, kuri\u0173
  naudojimo terminas baig\u0117si.\\n8.8. Vartotojams skolinamas tik vienas to paties
  pavadinimo egzempliorius.\\n9. Elektronin\u0117s ir informacini\u0173 technologij\u0173  paslaugos\\n9.1.
  Registruotiems vartotojams Biblioteka el. pa\u0161tu siun\u010dia informacij\u0105
  apie art\u0117jant\u012f ar pasibaigus\u012f pasiskolint\u0173 dokument\u0173 gr\u0105\u017einimo
  termin\u0105 bei kitus prane\u0161imus, susijusius su Bibliotekos paslaugomis. Informacija
  siun\u010diama tik kolegijos suteiktais el. pa\u0161to adresais. \u0160i informacija
  neatleid\u017eia bibliotekos vartotojo nuo atsakomyb\u0117s laiku gra\u017einti
  dokumentus.\\n9.2. Bibliotekos vartotojai gali naudotis prenumeruojamomis duomen\u0173
  baz\u0117mis ar leidiniais Bibliotekoje, kolegijoje ir kitur, prisijung\u0119 per
  kolegijos virtual\u0173 privat\u0173 tinkl\u0105 (VPN).\\n9.3. Bibliotekoje esan\u010diomis
  informacin\u0117mis technologijomis (i\u0161maniosiomis lentomis ir kt.) galima
  naudotis, atsiklausus bibliotekos darbuotojo.\\n9.4. Vartotojams skirti Bibliotekos
  kompiuteriai naudojami tik mokymo/si ir mokslo tikslams. Galima atlikti paie\u0161k\u0105
  internete, si\u0173sti ir gauti elektronin\u012f pa\u0161t\u0105, \u012fsira\u0161yti
  informacij\u0105 \u012f elektronines laikmenas, naudotis \u012fdiegtomis programomis.\\n9.5.
  Dirbant kompiuteriu draud\u017eiama naudotis pokalbi\u0173 sistemomis, \u017eaisti
  kompiuterinius \u017eaidimus. Draud\u017eiama \u017ei\u016br\u0117ti ar d\u0117ti
  pornografinius, rasin\u0119 ar tautin\u0119 neapykant\u0105 bei smurt\u0105 propaguojan\u010dius
  puslapius, skleisti informacij\u0105, diskredituojan\u010di\u0105 ar kenkian\u010di\u0105
  kitiems asmenims ar organizacijoms.\\n10. Atsiskaitymas su Biblioteka\\n10.1. Studentai
  gr\u0105\u017eina visus pasiskolintus dokumentus baigdami ar nutraukdami studijas
  ir prie\u0161 akademines atostogas. Atsiskaitymas su Biblioteka patvirtinamas Bibliotekos
  darbuotojo para\u0161u atsiskaitymo lapelyje arba fakultet\u0173 dekanatams nusi\u0173stuose
  s\u0105ra\u0161uose.\\n10.2. Darbuotojai atsiskaito prie\u0161 ilgalaikes atostogas,
  sta\u017euotes ir nutraukdami darbo sutart\u012f kolegijoje ne v\u0117liau kaip
  prie\u0161 3 darbo dienas iki paskutin\u0117s darbo dienos. Negr\u0105\u017einus
  knyg\u0173, kolegijos nuostoliai d\u0117l prarast\u0173 knyg\u0173 bus i\u0161ie\u0161komi
  i\u0161 darbuotojo \u012fstatym\u0173 nustatyta tvarka.\\n11. Paskutin\u012f m\u0117nesio
  penktadien\u012f vartotojai neaptarnaujami. \u0160i diena skiriama Bibliotekos informacijos
  sistemos duomen\u0173 atnaujinimui, Bibliotekos darbuotoj\u0173 kvalifikacijos k\u0117limui,
  patalp\u0173 ir fond\u0173 tvarkymui bei kitiems vidaus darbams.\\n\\n12. Suderinus
  su kolegijos vadovybe, galima keisti skaitytoj\u0173 aptarnavimo laik\u0105 vasaros
  metu ar kitomis ypatingomis aplinkyb\u0117mis.\\n\\nIII. VARTOTOJ\u0172 TEIS\u0116S,
  PAREIGOS IR ATSAKOMYB\u0116\\n\\n12. Vartotojai turi teis\u0119:\\n12.1. Gauti i\u0161sami\u0105
  informacij\u0105 apie Bibliotekos fond\u0105 ir jos teikiamas paslaugas.\\n12.2.
  Nustatyta tvarka naudotis Bibliotekoje saugomais dokumentais, duomen\u0173 baz\u0117mis  bei
  kitomis informacin\u0117mis paslaugomis.\\n12.3. Pra\u0161yti prat\u0119sti pasiskolint\u0173
  dokument\u0173 gr\u0105\u017einimo termin\u0105, kol jis dar nepasibaig\u0119s;
  terminas prat\u0119siamas, jei paskolint\u0173 dokument\u0173 nelaukia kiti vartotojai.\\n12.4.
  Pareik\u0161ti savo nuomon\u0119 \u017eod\u017eiu, ra\u0161tu ar bibliotekos elektroniniu
  pa\u0161tu apie Bibliotekos darb\u0105 ir jos teikiamas paslaugas; teikti pasi\u016blymus
  Bibliotekos veiklai gerinti.\\n13. Vartotojai privalo:\\n13.1. Tausoti ir saugoti
  naudojamus Bibliotekos dokumentus ir kit\u0105 turt\u0105; apie pasteb\u0117tus
  defektus ar gedimus prane\u0161ti Bibliotekos darbuotojui.\\n13.2. Neardyti leidini\u0173
  i\u0161d\u0117stymo fonduose tvarkos, paimt\u0173 dokument\u0173 ned\u0117ti atgal
  \u012f lentynas; nei\u0161ne\u0161ti dokument\u0173  i\u0161 Bibliotekos patalp\u0173
  be darbuotojo leidimo.\\n13.3. Bibliotekos patalpose laikytis vie\u0161osios tvarkos
  taisykli\u0173 ir tylos, nesinaudoti mobiliojo ry\u0161io telefonais ir priemon\u0117mis,
  nesusijusiomis su studijomis, nevalgyti, nesine\u0161ti dideli\u0173 rankini\u0173.\\n13.4.
  Nurodytu laiku gr\u0105\u017einti pasiskolintus dokumentus arba prat\u0119sti naudojimosi
  jais termin\u0105.\\n13.5. Bibliotekos el. kataloge sekti informacij\u0105 apie
  pasiskolintus dokumentus, j\u0173 gr\u0105\u017einimo terminus bei delspinigius.\\n13.6.
  Laikytis autori\u0173 teisi\u0173, naudojantis prenumeruojamomis ir testuojamomis
  duomen\u0173 baz\u0117mis: neperduoti ir nesuteikti prieigos kitiems asmenims, nenaudoti
  rastos informacijos komerciniais tikslais ir jos neperpublikuoti, nesisi\u0173sti
  informacijos dideliais kiekiais naudojant specialias priemones.\\n13.7. Nedelsiant
  prane\u0161ti Bibliotekai, praradus skaitytojo, darbuotojo ar studento pa\u017eym\u0117jim\u0105
  arba pasikeitus asmens duomenims \u2013 pavardei, gyvenamajai vietai, elektroninio
  pa\u0161to adresui.\\n14. Vartotoj\u0173 atsakomyb\u0117\\n14.1. Negr\u0105\u017ein\u0119
  nustatytu laiku pasiskolint\u0173 dokument\u0173, vartotojai moka delspinigius pagal
  kolegijos Direktoriaus patvirtint\u0105 tvark\u0105. Maksimali delspinigi\u0173
  suma \u2013 1 MGL.\\n14.2. Prarad\u0119 arba nepataisomai sugadin\u0119 Bibliotekos
  dokumentus, vartotojai pakei\u010dia juos tokiais pat ar Bibliotekos pripa\u017eintais
  lygiaver\u010diais. Naujas dokumentas parenkamas, Bibliotekos darbuotojui \u012fvertinus
  prarastojo dokumento kain\u0105, leidimo metus, turim\u0173 egzempliori\u0173 skai\u010di\u0173
  ir paklaus\u0105 kolegijoje.\\n14.3.Vartotojai, gr\u0105\u017ein\u0119 tokio paties
  pavadinimo, bet pa\u017eym\u0117t\u0105 kitu, negu buvo pasiskolin\u0119, br\u016bk\u0161niniu
  kodu spaudin\u012f, atsako kaip u\u017e prarast\u0105.\\n14.4. Dokumentai su kit\u0173
  bibliotek\u0173 spaudais vietoj prarast\u0173 nepriimami.\\n14.5.Vartotojai, prarad\u0119
  studento pa\u017eym\u0117jim\u0105 ar asmens tapatyb\u0117s kortel\u0119, ir neprane\u0161\u0119
  Bibliotekai, yra atsakingi u\u017e kito asmens, pasinaudojusio jo dokumentu, pasiskolintus
  dokumentus.\\n\\n14.6. Vartotojams, piktybi\u0161kai pa\u017eeidusiems Taisykles,
  Bibliotekos vadov\u0117s sprendimu iki 6 m\u0117nesi\u0173 gali b\u016bti apribota
  teis\u0117 naudotis Biblioteka. Apie netinkam\u0105 elges\u012f prane\u0161ama dekanui
  ar padalinio vadovui.\"", "\"Byla C-133/20\\n\\nPra\u0161ymas priimti prejudicin\u012f
