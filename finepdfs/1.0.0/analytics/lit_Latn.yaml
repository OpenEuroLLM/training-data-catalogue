  atostogos | III, IV g. kl. |\\n\\n### LAPKRITIS\\n\\n| I sav. | I\u0161s\u016bki\u0173
  konkursas \u201ePirmok\u0173 sveikatyn\u0117\u201c | Vaik\u0173 mityba \u2013 aktuali
  visuomen\u0117s sveikatos tema, kuri\u0105 skiriamas ypatingai didelis d\u0117mesys.
  Teisingam matimuisi, jokia daro ne tik tev\u0173 \u017einios, \u0161eimos socialin\u0117,
