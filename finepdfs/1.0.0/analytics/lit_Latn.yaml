  yra \u017emogus, sergan\u010dis atvir\u0105 plau\u010di\u0173 tuberkulioz\u0117s
  forma. N\u0117rydomas tuberkulioze sergan\u010dius \u017emogus gali mirti ir ru\u017ek\u0117sti
  daugybei aplinkini\u0173, tod\u0117l svarbu \u017einoti, kaip apsisaugoti nuo gresm\u0117s
  susiryt.\\n\\nKovo 24 d. PSO sprendimu minima Tarptautin\u0117 tuberkulioz\u0117s
