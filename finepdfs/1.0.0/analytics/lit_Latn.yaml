  pa\u0161alinim\u0105 arba apie jos apeigos kelio \u012fdiegim\u0105.\\n\\nPagalbos
  tarnybos darbo laikas yra nuo 8 val. iki 17 val. darbo dienomis.\\n\\n2. Problemos
  prieinamumas\\n\\nCentrin\u0117s duomen\u0173 baz\u0117s prieinamumas yra vidutinis
