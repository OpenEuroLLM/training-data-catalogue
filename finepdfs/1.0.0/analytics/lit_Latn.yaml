  Nr. COM(2015) 264 galutinis konstatuojama, kad Lietuvoje \u201eLov\u0173 skai\u010dius
  ligonin\u0117se vienam gyventojui vis dar didelis, palyginti su kitomis ES \u0161alimis\u201c.
  Siekiant efektyviai taikyti stacionarin\u012f gydym\u0105, \u0161alies ligonin\u0117s
  skatinamos diegti naujas medicinines technologijas, gydymo metodus, tarp j\u0173
  ir dienos stacionaro paslaugas, dienos chirurgijos, ambulatorin\u0117s chirurgijos
  ir pan. (3 lentel\u0117).\\n\\n3 lentel\u0117. Prioritetini\u0173 paslaug\u0173
  teikimo dinamika\\n\\n| Paslauga               | 2014 m. |          | 2015 m. |          |\\n|------------------------|---------|----------|---------|----------|\\n|                        |
  Vnt.    | Eur      | Vnt.    | Eur      |\\n| Dienos chirurgijos     | 867     |
  234747,99| 899     | 276665,29|\\n| Dienos stacionaro      | 4246    | 67291,38
  | 4777    | 80334,76 |\\n| Steb\u0117jimo paslauga     | 2677    | 177376,06| 2395    |
  168699,50|\\n| Ambulatorin\u0117s chirurgijos | 194   | 7439,08  | 167     | 6753,95  |\\n\\nMa\u017einant
  hospitalizacij\u0173 skai\u010di\u0173 ir optimizuojant vidutin\u0119 gul\u0117jimo
  trukm\u0119, V\u0161\u012e Utenos ligonin\u0117je orientuojamasi \u012f stacionarini\u0173
  paslaug\u0173 redukavim\u0105, kei\u010diant jas specializuotomis ambulatorin\u0117mis,
  dienos chirurgijos, dienos stacionaro, steb\u0117jimo paslaugomis, tod\u0117l \u0161i\u0173
  prioritetini\u0173 paslaug\u0173 skai\u010dius kasmet auga (3 lentel\u0117).\\n\\nPa\u017eym\u0117tina,
  kad pagrindiniai stacionaro veiklos rodikliai yra geri.\\n\\nPrevencin\u0117s programos
  taip pat priskiriamos prioritetiniams paslaugoms. Gyventoj\u0173 sveikata yra tiesioginis
  darbingum\u0105 lemiantis veiksnyss, nes tik sveiki ir ilgiau darbo rinkoje aktyv\u016bs
  pilie\u010diai daro teigiam\u0105 poveik\u012f darbo na\u0161umui ir konkurencingumui.
  Gyventoj\u0173 sveikatingumo skatinimas yra neatsiejama strategijos \u201eEuropa
  2020 m.\u201c pa\u017eangaus, tvaraus ir integralaus augimo strategijos tiksl\u0173
  dalis. Lietuvoje vykdomos 6 prevencin\u0117s programos siekiant diagozuoti lig\u0105
  ankstyvoje stadijoje, kurioje ji yra lengvai pagydoma. Ataskaitiniais metais V\u0161\u012e
  Utenos ligonin\u0117je vykdytos 4 prevencin\u0117s programos.\\n\\nDalyvavimas prevencin\u0117je
  programoje \u2013 tai daugelio \u017emoni\u0173 galimyb\u0117 nemokamai i\u0161sitiirti,
  nes l\u0117\u0161\u0173 apdraustuj\u0173 privalomuoju sveikatos draudimu prevenciniams
  sveikatos tyrimams skiriamas i\u0161 Privalomojo sveikatos draudimo fondo (toliau
  - PSDF) biud\u017eeto. D\u0117l min\u0117t\u0173 tyrim\u0173 pacientai pirmiausia
  kreipiasi \u012f \u0161eimos gydytoj\u0105, kuris i\u0161samiai supa\u017eindina
  su programomis ir paskiria reikiamus tyrimus. Pas Utenos ligonin\u0117s gydytojus
  specialistus pacientai patenka gav\u0119 siuntimus i\u0161 \u0161eimos gydytojo.\\n\\n4
  lentel\u0117. Prevencini\u0173 program\u0173 dinamika\\n\\n| Paslauga                                      |
