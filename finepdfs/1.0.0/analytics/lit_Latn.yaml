  projektavimas. |\\n\\n**Vilniaus miesto 5-ojo policijos komisariato ir keli\u0173
  policijos pastato Sietyno g. 24, Vilniuje, statyba**\\n\\n2020 m. planuojamas tolesnis
  VI Turto banko atnaujinimo projekt\u0173 vykdymas. Vadovaujantis esamu reglamentavimu,
  nauji atnaujinamo valstyb\u0117s nekilnojamojo turto objektai \u012f atnaujinimo
  s\u0105ra\u0161\u0105 ne\u012ftraukiami.\\n\\nCentralizuotai valdomo VNT modernizavimo
  projektai, i\u0161 dalies finansuojami ES l\u0117\u0161omis\\n\\nVykdam VJ Turto
  bankui pavestas VNT valdymo ir prie\u017ei\u016bros funkcijas, 2019 m. buvo \u012fgyvendinami
  3 modernizacijos projektai.\\n\\n| Eil\u0117s Nr. | Strateginis projektas / programa
  | Patvirtinta apimtis, m\u00b2 | Patvirtintas biud\u017eetas | Planuota pabaiga
  | Statusas, kas atlikta 2019 m. |\\n|-----------|----------------------------------|-----------------------|-----------------------|-----------------|-------------------------------|\\n|
  1         | Pastato L. Sapiegos g. 12, Kaune, atnaujinimas (modernizavimas) | 1
  521                 | 689 770 \u20ac             | 2019 m. IV ketv. | Atlikta 95
  proc. darb\u0173.       |\\n| 2         | Pastato Naujoji g. 2, Alytuje, atnaujinimas
  (modernizavimas) | 2 906                 | 276 148 \u20ac             | 2020 m.
  II ketv. | 2019 m. pasira\u0161ytas susitarimas d\u0117l darb\u0173 prad\u017eios
  termino nuk\u0117limo \u012f 2020 m. |\\n| 3         | Pastato Vasario 16-osios
  g. 16-6, Taurag\u0117je, atnaujinimas (modernizavimas) | 1 200                 |
  269 740 \u20ac             | 2019 m. IV ketv. | Baigti rangos darbai.         |\\n\\nPastatas
  Vasario 16-osios g. 16-6, Taurag\u0117je\\n\\nVJ Turto bankas 2019 m. nupirko energinio
  pastat\u0173 audito paslaugas, buvo atliktas 11 nauj\u0173 modernizacijos projekt\u0173
  pastat\u0173 energinis auditas. Atrinkus pastatus, 2020 m. keturis i\u0161 j\u0173
  planuojama modernizuoti gautomis i\u0161 UAB Vie\u0161\u0173j\u0173 investicij\u0173
  pl\u0117tros agent\u016bros (toliau \u2013 VIPA) paskolos ir gr\u0105\u017einamosios
  subsidijos l\u0117\u0161omis.\\n\\nKiti V\u012e Turto banko vykdomi projektai:\\n\\n2019
  m. V\u012e Turto bankas dalyvavo \u012fgyvendinant \u0161iuos svarbius projektus:\\n\\n1.
  Vilniaus koncert\u0173 ir sporto r\u016bm\u0173 rekonstrukcija.\\n\\nLietuvos Respublikos
  Vyriausyb\u0117 2015 m. bir\u017eelio 9 d. nutarimu Nr. 597 \u201eD\u0117l Vilniaus
  koncert\u0173 ir sporto r\u016bm\u0173 rekonstrukcijos ir pritaikymo kongresams,
  konferencijoms ir kult\u016briniam renginiams, projekto pripa\u017einimo valstybei
  svarbiu projektu\u201d paved\u0117 valstyb\u0117s \u012fmon\u0117i Turto bankui
  \u012fgyvendinti Vilniaus kongres\u0173 centro rekonstrukcijos projekt\u0105 (toliau
  \u2013 Projektas). \u012egyvendinant Projekt\u0105 planuojama rekonstruoti ir pritaikyti
  kongresams, konferencijoms ir kitiemis kult\u016briniam renginiams Vilniaus koncert\u0173
  ir sporto r\u016bm\u0173 pastat\u0173 kompleks\u0105, esant\u012f Rintin\u0117s
  g. 1, Vilniuje, ir kartu su Vilniaus miesto savivaldybe atlikti tvarkybos darbus
  gretimai esan\u010dioje Vilniaus \u017eyd\u0173 \u0160nipi\u0161ki\u0173 sen\u0173j\u0173
  kapini\u0173 (toliau \u2013 \u0160nipi\u0161ki\u0173 kapin\u0117s) teritorijoje.
  \u012egyvendinant Projekt\u0105 2019 m. sausio 17 d. buvo pasira\u0161yta Vilniaus
  kongres\u0173 centro rekonstrukcijos techninio projektu parengimo ir projekto vykdymo
  prie\u017ei\u016bros sutartis. Rengiant technin\u012f projekt\u0105 buvo atlikti
  visi reikiami pastato tyrimai, pastato i\u0161or\u0117s ir vidaus skenavimas ir
  parengtas pastato detalus esamos situacijos 3D modelis. Per 2019 m. buvo parengti
  esminiai techninio projekto sprendiniai, kurie apima verting\u0173j\u0173 pastato
  savybi\u0173 i\u0161saugojim\u0105, unikalios vantine\u0161 stogo konstrukcijos
  rekonstrukcij\u0105, pastato i\u0161pl\u0117timo ry\u0161ineje dalyje ir vis\u0173
  in\u017einerini\u0173 sistem\u0173 atnaujinim\u0105. Technin\u0117me projekte numatyta,
  kad po rekonstrukcijos pastato plotas u\u017eims iki 17 300 kv. m., Jame bus \u012frengta
  iki 10 jaujraus dyd\u017eio konferencij\u0173 sali\u0173, kuri\u0173 did\u017eiausioje
  tilps iki 2 400 dalyvi\u0173, o per kult\u016brinius renginius \u2013 iki 4 000
  dalyvi\u0173. Techninio projekto sprendiniai buvo projektuojami taikant BIM metodik\u0105.
  Projekto sprendiniai, susij\u0119 su \u017eem\u0117s judinimo darbais ir \u0160nipi\u0161ki\u0173
  kapini\u0173 teritorijos sutvarkymu, buvo derinami su Lietuvos \u017eyd\u0173 bendruomen\u0117
  ir Europos \u017eyd\u0173 kapini\u0173 i\u0161saugojimo komiteto atstovais. 2019
  m. gruod\u017eio 4 d. V\u012e Turto bankas, Lietuvos \u017eyd\u0173 bendruomen\u0117
  ir Europos \u017eyd\u0173 kapini\u0173 i\u0161saugojimo komitetas pasira\u0161\u0117
  sutikimo protokol\u0105, kuriuo buvo pritarta Projekto sprendiniams. 2019 m. taip
  pat buvo parengtos Vilniaus kongres\u0173 centro nuomos s\u0105lygos ir suderintos
  su suinteresuotas rinkos dalyviais. 2020 m. planuojama t\u0119sti Projekto \u012fgyvendinim\u0105,
  baigti projektavimo darbus, gauti statybos leidim\u0105, paskelbti pastato rekonstrukcijos
  vie\u0161aj\u012f konkurs\u0105 ir konkurso b\u016bdu atrinkti pastato operatori\u0173.\\n\\nNaudingasis
  plotas \u2013 17 300 kv. metrai\\n\\nB energinio efektyvumo klas\u0117 (kult\u016bros
  paveldo objektas)\\n\\nBIM modelis ir objekto vizualizacija\\n\\n2. Administracin\u0117s
  paskirties pastato T. \u0160ev\u010denkos g. 13, Vilniuje, rekonstrukcija.\\n\\nLietuvos
  Respublikos Vyriausyb\u0117 2015 m. gruod\u017eio 16 d. nutarimu Nr. 1315 \u201eD\u0117l
  nekilnoamojo turto Vilniuje, T. \u0160ev\u010denkos g. 13, perdavimo valstyb\u0117s
  \u012fmonei Turto bankui\u201c perdav\u0117 Turto bankui administracin\u012f pastat\u0105
  (unikalus numeris \u2013 1097-2011-0018), esant\u012f Vilniuje, T. \u0160ev\u010denkos
  g. 13.\\n\\nPastatas statytas 1972 m. kaip Geologijos ir geografijos institutas.
  Pastata planuojama rekonstruoti pritaikant Vadovyb\u0117s apsaugos departamento
  (toliau \u2013 VAD) veiklai. \u012evykd\u017eius esminius pastato rekonstravimo
  (modernizavimo) darbus b\u016bt\u0173 u\u017etikrintas vie\u0161ojo sektoriaus institucijos
  VAD (naudotojo) patalp\u0173 eksploatavimo ir prie\u017ei\u016bros i\u0161laid\u0173
  ir energijos s\u0105naud\u0173 suma\u017einimas; pastato efektyvesnis panaudojimas
  visuomen\u0117s reikm\u0117ms; padidinta vie\u0161\u0173j\u0173 paslaug\u0173 teikimo
  ir klient\u0173 aptarnavimo kokyb\u0117; sudarytos tinkamos, higienos ir sveikatos
  saugos reikalavimus atitinkan\u010dios, salygos VAD darbuotojams.\\n\\n2016 m. atliktas
  energin\u012f audit\u0105 nustatyta, kad 2016 m. prad\u017eioje (perimamo turto
  laikotarpiu) pastato b\u016bkl\u0117 atitiko E energinio naudingumo klas\u0119.
  Nuo 2015 m. pastatas ne\u0161ildomas, i\u0161jungtas vandens tiekimas. Nuo pastato
  pastatymo jokie pastato esminiai rekonstrukcijos darbai nebuvo vykdyti, i\u0161skyrus
  2007\u20132008 m. didesn\u0117s dalies pastato lang\u0173 pakeitim\u0105 \u012f
  plastikinius langus. Visi in\u017eineriniai, elektros, vandens, \u0161ildymo sistemos
  ir tinklai i\u0161 esm\u0117s renovuoti.\\n\\nEsamas pastatas yra karkasin\u0117s
  konstrukcijos, penki\u0173 auk\u0161t\u0173 su r\u016bsiu. Sudarytas i\u0161 dviej\u0173
  karkasin\u0173 korpus\u0173, kuriuos jungia m\u016brin\u0173 konstrukcij\u0173 laiptin\u0117
  ir ventiliacijos \u0161achtos intarpas. Esamos in\u017einerin\u0117s sistemos prastos,
  nepatenkinamos b\u016bkl\u0117s, nusid\u0117v\u0117jusios, i\u0161 dalies neveikian\u010dios,
  neatitinkan\u010dios \u0161iuolai\u010di\u0173 reikalavim\u0173.\\n\\nNumatoma A
  korpuso fasadus ir nelaikan\u010diasias sienas bei pertvaras demontuoti, paliekant
  tik laikan\u010diasias konstrukcijas. Esamas B korpusas visi\u0161kai demontojamas
  ir jo vietoj\u0435 projektuojamas naujas korpusas. Taip pat demontojamas dabartin\u0117s
  akt\u0173 sal\u0117s korpusas palei T. \u0160ev\u010denkos gatv\u0119, kurio vietoj\u0435
  numatoma nusileidimo \u012f po\u017eemin\u012f auk\u0161t\u0105 dengta rampa \u2013
  D korpusas. Tarp A ir B korpus\u0173 sankirtos numatomas naujas vieno auk\u0161to
  C korpusas. Projektuojamas 5 auk\u0161t\u0173 pastatas su r\u016bsiu ir antstatu
  (antstatto plotas nevir\u0161ija pus\u0117s 5-ojo auk\u0161to ploto). Dalis 5-o
  auk\u0161to stogo bus eksplotuojama, ant jos numatoma \u012frengti teras\u0105 ir
  polisio zonas. Teritorija ir visas pastatas bus pritaikytas \u017emon\u0117ms su
  negalia. Numatoma pastato energinio naudingumo klas\u0117 \u2013 A.\\n\\nRekonstruojamo
  pastato T. \u0160ev\u010denkos g. 13, Vilniuje, antrame auk\u0161te numatomos \u012fslaptintos
  patalpos, projektuojamos kito projektuotojo pagal Lietuvos Respublikos vie\u0161\u0173j\u0173
  pirkim\u0173, atliekam\u0173 gynybos ir saugumo srityje, \u012fstatym\u0105, Lietuvos
  Respublikos valstyb\u0117s ir tarnybos paslap\u010di\u0173 \u012fstatym\u0105 bei
  Lietuvos Respublikos Vyriausyb\u0117s 2018 m. rugpj\u016b\u010dio 13 d. nutarim\u0105
  Nr. 820 \u201eD\u0117l Lietuvos Respublikos valstyb\u0117s ir tarnybos paslap\u010di\u0173
  \u012fstatymo \u012fgyvendinimo\u201c. Parenagtame techniniame projekte numatyti
  visi sprendiniai iki \u201eslapto dalies\u201c, \u012fskaitant in\u017einerini\u0173
  tinkl\u0173 prievadus pagal \u201eslapto dalies\u201c pateiktas u\u017eduotis. Neteikiami
  jokie \u012fslaptintos patalp\u0173 zonos sprendiniai, i\u0161skyrus neatsiejamus
  nuo pastato konstrukcinius sprendinius, t. y. kolonos, sijas, rem\u0117j\u0117s,
  lauko sienas ir vidaus pertvaras \u2013 skirian\u010dias \u012fslaptint\u0105 patalp\u0173
  zon\u0105 nuo kit\u0173 patalp\u0173 ir pan. Visi \u012fslaptintos patalp\u0173
  zonos sprendiniai, \u012fskaitant vidaus pertvaras, apdail\u0105 ir visus in\u017einerinius
  sprendinius, rengiama kito projektuotojo ir priskiriamas \u201eslaptais daliais\u201c.\\n\\nPastato
  5-ame auk\u0161te projektuojama \u0161audykla, skirta Vadovyb\u0117s apsaugos departamento
  veiklai. I \u0161audykla civiliai nebus \u012fleid\u017eiami.\\n\\nBendras pastato
  plotas iki rekonstrukcijos yra 5 185,90 kv. metrai. Pagal parengt\u0105 pastato
  rekonstrukcijos projekt\u0105 bendras pastato plotas po rekonstrukcijos bus 6 309,97
  kv. metrai.\\n\\n2019 m. buvo parengtas administracinio pastato, esan\u010dio T.
  \u0160ev\u010denkos g. 13, Vilniuje, rekonstrukcijos techninis projektas (techninio
  projekto sprendiniai buvo projektuojami taikant BIM metodik\u0105), gautas statyb\u0105
  leid\u017eiantis dokumentas, paskelbtas rangos darb\u0173 konkursas. \u0160iuo metu
  vykdomos rangos darb\u0173 pirkimo proced\u016bros. Planuojama projekto pabaigos
  data \u2013 2022 m.\\n\\nNaudingasis plotas \u2013 6 309,97 kv. metrai\\n\\nA energinio
  efektyvumo klas\u0117\\n\\nBIM modelis\\n\\nIV. VALSTYBEI NUOSAVYB\u0116S TEISE
  PRIKLAUSANTIS KITAS TURTAS\\n\\nThe sun sets over a picturesque harbor, casting
  a warm glow over the water and the boats docked along the pier. The sky is painted
  with hues of orange and pink, creating a serene and tranquil atmosphere.\\n\\nIV.
  VALSTYBEI NUOSAVYB\u0116S TEISE PRIKLAUSANTIS KITAS TURTAS\\n\\nVadovaujantis VTIPS
  nuostatais, sistemoje renkama ir kaupiama apibendrinta informacija apie valstybei
  nuosavyb\u0117s teise priklausant\u012f kit\u0105 ilgalaik\u012f material\u0173j\u012f
  turt\u0105, gaunama i\u0161 vie\u0161\u0173j\u0173 registru, valstyb\u0117s informacin\u0117s
  sistem\u0173 ir kit\u0173 duomen\u0173 teik\u0117j\u0173, turto valdytoj\u0173 (jeigu
  tok\u012f duomen\u0173 n\u0117ra registruose ar j\u0173 negali pateikti kiti duomen\u0173
  teik\u0117jai).\\n\\nU\u017e min\u0117to valstyb\u0117s turto valdym\u0105 ir eksploatavim\u0105
  atsakingi \u0161\u012f turt\u0105 valdantys ir naudojantys valdytojai.\\n\\n\u017demiau
