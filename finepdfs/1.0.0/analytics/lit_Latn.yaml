  Galimi atsakymo laiko ir problemos sprendimo pavyzd\u017eiai pateikti 1 lentel\u0117je.\\n\\nAtstatymo
  laiko ir problemos sprendimo pavyzd\u017eiai\\n\\nAtsakymo laikas yra laiko intervalas
  nuo to momento, kai pagalbos tarnybos personalas tiek\u0117jui nusiun\u010dia problemos
  patvirtinim\u0105 (prane\u0161imo gavimo patvirtinimas) iki problemos analiz\u0117s
  prad\u017eios.\\n\\nProblemos sprendimo laikas yra laiko intervalas, kai pagalbos
