  Mi\u0161kyt\u0117\\n\\nAtspausdinta \\\"Profi-W\\\"\u00ae programa, Edrana\"", "\"FRA
  prane\u0161imas spaudai Viena, 2017 m. gruod\u017eio 6 d.\\n\\nKova su ma\u017eum\u0173
  diskriminacija ir neapykanta joms beveik 10 met\u0173 vis dar neduoda norim\u0173
  rezultat\u0173\\n\\nD\u0117l visoje Europoje vyraujan\u010dios pla\u010diai paplitusios
  diskriminacijos, nepakantos ir neapykantos kyla gr\u0117sm\u0117, kad daug ma\u017eum\u0173
  grupi\u0173 nari\u0173, kurie \u0161iaip jau\u010diasi labai prisiri\u0161\u0119
  prie \u0161alies, kurioje gyvena, ir pasitiki jos institucijomis, gali b\u016bti
  marginalizuojami ir atskirti. Tokios i\u0161vados padarytos Europos S\u0105jungos
  pagrindini\u0173 teisi\u0173 agent\u016brai (FRA) atlikus didel\u012f pakartotin\u012f
  tyrim\u0105.\\n\\n\u201eBeveik prie\u0161 de\u0161imtmet\u012f atkreip\u0117me d\u0117mes\u012f
  \u012f didelio masto etnin\u0119 diskriminacij\u0105 ir neapykant\u0105. \u0160iandien
  i\u0161 \u0161i\u0173 rezultat\u0173 matyti, kad m\u016bs\u0173 teis\u0117s aktai
  ir politika nepakankamai saugo \u017emones, kuriems yra sukurti, \u2013 teigia FRA
  direktorius Michael O''Flaherty. \u2013 Kiekviena diskriminacijos ir neapykantos
  i\u0161rai\u0161ka trukdo siekti socialin\u0117s sanglaudos, d\u0117l jos atsiranda
  nelygyb\u0117, \u017elugdanti kart\u0173 ry\u0161ius ir skatinanti atskirt\u012f,
  ir galiausiai gali tur\u0117ti skaud\u017ei\u0173 pasekmi\u0173.\\\"\\n\\nAtaskaitoje,
  apibendrinan\u010dioje Antrosios apklausos apie ma\u017eumas ir diskriminacij\u0105
  Europos S\u0105jungoje (EU-MIDIS II) pagrindinius rezultatus, nurodoma, kad reikia
  konkre\u010di\u0173 ir grie\u017etesni\u0173 teisin\u0117s apsaugos nuo diskriminacijos
  priemoni\u0173, kurios turi b\u016bti derinamos su veiksmingomis sankcijomis. Be
  to, kadangi 88 proc. etnin\u0117s diskriminacijos, 90 proc. priekabiavimo d\u0117l
  neapykantos ir 72 proc. smurto d\u0117l neapykantos atvej\u0173 liko neprane\u0161ti,
  siekiant paskatinti aukas prane\u0161ti apie incidentus, reikia dar aktyviau vykdyti
  informavimo veikl\u0105 ir teis\u0117saugos ir lygyb\u0117s \u012fstaigoms suteikti
  tinkam\u0173 priemoni\u0173 veiksmingai i\u0161tirti \u0161iuos prane\u0161imus.\\n\\nKitos
  pagrindin\u0117s i\u0161vados:\\n\\n* 31 proc. apklaust\u0173 antrosios kartos imigrant\u0173
  per pastaruosius metus patyr\u0117 priekabiavim\u0105 d\u0117l neapykantos. 50 proc.
  \u0161i\u0173 auk\u0173 su priekabiavimu susid\u016br\u0117 bent \u0161e\u0161is
  kartus per tuos metus.\\n* 38 proc. apklaust\u0173j\u0173, pirmiausia i\u0161 \u0160iaur\u0117s
  Afrikos(45 proc.), rom\u0173 (41 proc.) ir i\u0161 U\u017esachario Afrikos (39 proc.),
  per pastaruosius penkerius metus patyr\u0117 diskriminacij\u0105. Daugiausia diskriminacijos
  patyr\u0117 darbo ie\u0161kantys \u017emon\u0117s (29 proc.).\\n* Ma\u017eiau ma\u017eumoms
  priklausan\u010di\u0173 \u017emoni\u0173 (61 proc.) \u012fgijo bent vidurin\u012f
  i\u0161silavinim\u0105, palyginti su pla\u010di\u0105ja visuomene (74 proc.). D\u0117l
  \u0161ios prie\u017easties jiems sunkiau \u012fsidarbinti.\\n\\nI\u0161 rezultat\u0173
  taip pat matyti, kad ma\u017eum\u0173 grupi\u0173 nariai labiau nei pla\u010dioji
  visuomen\u0117 pasitiki vald\u017eios institucijomis ir kad dauguma j\u0173 yra
  prisiri\u0161\u0119 prie \u0161alies, kurioje gyvena. Jie taip pat yra atviri kitoms
  etnin\u0117ms grup\u0117ms.\\n\\nTa\u010diau ai\u0161kiai matomas ir diskriminacijos,
  priekabiavimo ir smurto poveikis. Aukos ma\u017eiau pasitiki vald\u017eios institucijomis
  ir yra ma\u017eiau prisiri\u0161usios prie \u0161alies, kurioje gyvena.\\n\\nTai
  antroji Pagrindini\u0173 teisi\u0173 agent\u016bros atlikta ES ma\u017eum\u0173
  ir imigrant\u0173 apklausa. Respondentai buvo apklausiami apie patirtis, susijusias
  su diskriminacija, priekabiavimu, policijos patikromis ir informuotumu apie teises,
  taip pat integracijos \u017eenklus, kaip antai priklausymo bendruomenei jausm\u0105
  ir pasitik\u0117jim\u0105 vald\u017eios institucijomis bei po\u017ei\u016br\u012f
  \u012f kitas grupes.\\n\\nDaugiau informacijos rasite informacijos rinkinyje \u017einiasklaidai
  arba ra\u0161ykite e. pa\u0161tu email@example.com arba skambinkite telefonu +43
  1 580 30 642.\\n\\nPastabos redaktoriams\\n\\n* \u0160i ataskaita parengta atlikus
  ES apklaus\u0105, kurioje apklausta 25 500 imigrant\u0173 arba etnin\u0117s ma\u017eumos
  kilm\u0117s asmen\u0173, \u012fskaitant romus ir rusus, visose 28 ES valstyb\u0117se
  nar\u0117se. Ji grind\u017eiama pirm\u0105ja tokia FRA apklausa, atlikta 2008 m.\\n*
  FRA yra nepriklausoma agent\u016bra, kuri Europos S\u0105jungai ir jos valstyb\u0117ms
  nar\u0117ms teikia param\u0105 ir ekspertines \u017einias \u017emogaus teisi\u0173
  srityje.\"", "\"Lietuvos Respublikos teisingumo ministerijai\\n\\n2023 m. spalio
  30 d., Nr. 23-166AR\\n\\nKopija Lietuvos Respublikos Vyriausybei\\n\\nD\u0116L LIETUVOS
  RESPUBLIKOS VYRIAUSYB\u0116S NUTARIMO \u201eD\u0116L LIETUVOS RESPUBLIKOS VYRIAUSYB\u0116S
  1994 M. RUGPJ\u016a\u010cIO 11 D. NUTARIMO NR. 728 \u201eD\u0116L LIETUVOS RESPUBLIKOS
  VYRIAUSYB\u0116S DARBO REGLAMENTO PATVIRTINIMO\\\" PAKEITIMO\\\" PROJEKTO DERINIMO\\n\\nLietuvos
  verslo konfederacija (toliau \u2013 LVK) i\u0161nagrin\u0117jo pateikt\u0105 derinti
  Lietuvos Respublikos Vyriausyb\u0117s nutarimo \u201eD\u0117l Lietuvos Respublikos
  Vyriausyb\u0117s 1994 m. rugpj\u016b\u010dio 11 d. nutarimo Nr. 728 \u201eD\u0117l
  Lietuvos Respublikos Vyriausyb\u0117s darbo reglamento patvirtinimo\\\" pakeitimo\\\"
  projekt\u0105 (Reg. Nr. 23-15135).\\n\\nNorime atkreipti d\u0117mes\u012f \u012f
  tai, kad parengtose Ministr\u0173, Vyriausyb\u0117s \u012fstaig\u0173, \u012fstaig\u0173
  prie ministerij\u0173 ir kit\u0173 Vyriausybei pavald\u017ei\u0173 ir atskaiting\u0173
  vie\u0161ojo administravimo subjekt\u0173 (toliau \u2013 \u012estaigos) normini\u0173
  teis\u0117s akt\u0173 projekt\u0173 derinimo taisykl\u0117se (toliau \u2013 Taisykl\u0117s)
  teis\u0117s akt\u0173 projekt\u0173 derinimo reikalavimai tapat\u016bs Lietuvos
  Respublikos Vyriausyb\u0117s (toliau \u2013 Vyriausyb\u0117) darbo reglamente \u012ftvirtintoms
  Vyriausyb\u0117s vykdomoms teis\u0117k\u016bros proced\u016broms, ta\u010diau pastebime
  ir reik\u0161ming\u0173 patobulinim\u0173 Taisykli\u0173 nuostatose. Pavyzd\u017eiui,  Taisykli\u0173
  24 punkte  numatoma, kad ne tik su suinteresuotomis institucijomis, bet ir su suinteresuotais
  asmenimis, teikusiais pastabas, b\u016bt\u0173 organizuojamas susitikimas pastaboms,
  su kuriomis teis\u0117s akto projekto reng\u0117jas nesutinka, aptarti. Manome,
  kad tai geras pokytis, kuris gal\u0117t\u0173 b\u016bti \u012ftvirtintas ir pa\u010diame
  Vyriausyb\u0117s darbo reglamente. Tai u\u017etikrint\u0173 didesn\u012f suinteresuot\u0173
  asmen\u0173 \u012ftraukiamum\u0105 \u012f teis\u0117k\u016bros proces\u0105. Siekiant
  u\u017etikrinti, kad \u0161i nuostata pernelyg neapsunkint\u0173 \u012estaig\u0173
  darbo, svarstytina numatyti, kad pasitarimas organizuojamas tik su tais suinteresuotais
  asmenimis, su kuriais yra oficialiai derinamas teis\u0117s akto projektas ir (arba)
  \u0161ie subjektai yra \u012fra\u0161yti \u012f lobist\u0173 ar \u012ftakdari\u0173
  s\u0105ra\u0161\u0105. LVK pabr\u0117\u017eia, kad mato \u0161\u012f pakeitim\u0105
  kaip itin svarb\u0173 ir nepritaria Aplinkos ministerijos i\u0161vadoje pateiktai
  nuomonei, kad kokybi\u0161kam suinteresuot\u0173 grupi\u0173 pastab\u0173 i\u0161nagrin\u0117jimui
  u\u017etikrinti u\u017etenka gerosios praktikos pavyzd\u017eio pritaikymo, nes reta
  \u012estaiga \u0161iai dienai taiko toki\u0105 praktik\u0105.\\n\\nPritariame ir
  palaikome Teisingumo ministerijos iniciatyv\u0105 skaidrinti teis\u0117k\u016bros
  proces\u0105 bei padaryti j\u012f atviresn\u012f, taikant vienod\u0105 praktik\u0105
  ministr\u0173 ir \u012fstaig\u0173 prie ministerij\u0173 vadov\u0173 normini\u0173
  teis\u0117s akt\u0173 projekt\u0173 rengimo procese.\\n\\nTaip pat si\u016blytume
  numatyti, kad teis\u0117k\u016bros procese dalyvaujantiems suinteresuotiems asmenims
  b\u016bt\u0173 pateikiami konsultavimosi su visuomene (\u201evie\u0161\u0173j\u0173
  konsultacij\u0173\\\") rezultatai, kad tokia praktika b\u016bt\u0173 \u012fteisinta
  vis\u0173 \u012estaig\u0173 lygiu (\u012ftvirtinant \u0161i\u0105 nuostat\u0105
  ir Vyriausyb\u0117s darbo reglamente). Tai leist\u0173 suvienodinti praktik\u0105
  d\u0117l konsultavimosi su visuomene rezultat\u0173 vie\u0161inimo, atsi\u017evelgiant
  \u012f tai, kad m\u016bs\u0173 praktikoje pasitaikydavo atvej\u0173, kai ministerija
  neketina pateikti konsultavimosi su visuomene rezultat\u0173, kai kuriems darbuotojams
  netgi galvojant, kad tai padaryti n\u0117ra galima. Pareiga pateikti konsultavimosi
  su visuomene rezultatus u\u017etikrint\u0173 gr\u012f\u017etam\u0105j\u012f ry\u0161\u012f
  visiems pastab\u0173 teik\u0117jams, kaip kad jis yra u\u017etikrintas teis\u0117s
  akto derinimo atveju (derinimo lentel\u0117s rengimo imperatyvu). Jeigu konsultavimosi
  su visuomene pasekm\u0117je yra pateikiamas teis\u0117s akto projektas, kartu su
  juo visgi gal\u0117t\u0173 b\u016bti pateikiami ir konsultavimosi rezultatai.\\n\\nGedimino
  pr. 2/1-28, LT-01103 Vilnius Apibendrinant, norime akcentuoti, kad dauguma \u012estaig\u0173
  nustatysiamas nuostatas taiko jau \u0161iandien ir t\u0105 teigiamai vertiname,
  ta\u010diau kartu apgailestaujame, kad praktikoje susiduriame ir su tokiais atvejais,  kai
  nesilaikoma Vyriausyb\u0117s darbo reglamente \u012ftvirtint\u0173 teis\u0117s akt\u0173
  projekt\u0173 rengimo ir derinimo reikalavim\u0173. Pavyzd\u017eiui, neretai n\u0117ra
  laikomasi derinimo termin\u0173, nustatyt\u0173 Vyriausyb\u0117s\\n\\nTel. +370
  5 212 1111, firstname.lastname@example.org, www.lvk.lt\\n\\ndarbo reglamente \u2013
  itin retai dideli teis\u0117s akt\u0173 projektai yra derinami 12 darbo dien\u0173,
  taip pat kai kurios ministerijos jau yra u\u017emir\u0161usios, kad sutrumpinti
  derinimo laikotarp\u012f galima tik \u201ei\u0161imtiniais atvejais\\\" ir \u201ed\u0117l
  nenumatyt\u0173 aplinkybi\u0173\\\". Atitinkamai, siekiant gerinti teis\u0117k\u016bros
  kokyb\u0119 ir \u012fgyvendinti \u201eAtviros Vyriausyb\u0117s\\\" tikslus yra itin
  svarbu, kad teis\u0117s akt\u0173 nuostatos b\u016bt\u0173 ne tik tobulinamos, bet
  ir nuosekliai taikomos.\\n\\nPagarbiai\\n\\nGeneralin\u0117 direktor\u0117\\n\\nIneta
  Rizgel\u0117\"", "\"| TEMA | VEIKLA / PRIEMON\u0116 | TIKSLIN\u0116 GRUP\u0116 |\\n|------|------------------|---------------|\\n|
