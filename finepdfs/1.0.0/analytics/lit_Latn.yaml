  (CA)                   | 0,01    | 0,02    |\\n| **I\u0161 viso s\u0105naud\u0173**                      |
  5,26    | 7,89    |\\n\\n+50,0 %\\n\\n2.5. Administracin\u0117s paskirties VNT portfelio
  optimizavimas\\n\\nVJ Turto bankas dalyvauja \u012fgyvendinant AVNT centralizuoto
  valdymo reform\u0105, kurios strateginiai tikslai \u2013 optimizuoti AVNT apimtis,
  kad valstyb\u0117 tur\u0117t\u0173 tik tiek nekilnoamojo turto, kiek jo reikia valstyb\u0117s
  funkcijoms vykdyti; valdyti klient\u0173 apr\u016bpinim\u0105 AVNT, kuris turi b\u016bti
  pagr\u012fstas ka\u0161t\u0173 ir naudos analize ir atitikti nustatytus efektyvaus
  valdymo rodiklius bei normatyvus; ma\u017einti AVNT valdymo ir prie\u017ei\u016bros
  s\u0105naudas, kurios yra den- giamos valstyb\u0117s l\u0117\u0161omis. Planuojama,
  kad VJ Turto bankas iki 2021 m. perims vis\u0105 perduotin\u0105 centralizuotai
  valdyti AVNT. Konsolidavus vis\u0105 AVNT, portfelis bus skirstomas \u012f dvi dalis:\\n\\n-
  valdytin\u0105 AVNT (VNT, kur\u012f planuojama nuomoti valstybin\u0117ms institucijoms,
  i\u0161laikyti portfelyje ir palaikyti arba kelti jo vert\u0119);\\n- parduotin\u0105
  AVNT (VNT, kurio pardavimo l\u0117\u0161omis b\u016bt\u0173 kuriama arba palaikoma
  valdytinio portfelio vert\u0117).\\n\\nValdytinio portfelio optimizavim\u0105 planuojama
  \u012fgyvendinti:\\n\\n- koncentruojant \u012fstaigas did\u017eiuosiuose VNT objektuose,
  atsisakant pavieni\u0173 ma\u017eesni\u0173 pastat\u0173 ir patalp\u0173;\\n- laisvus
  plotus pritaikant \u012fstaig\u0173 poreikiams;\\n- ma\u017einant \u012fstaig\u0173
  naudojam\u0105 plot\u0105.\\n\\nNuo 2021 m. VJ Turto bankas pereina prie nuomos
  santyki\u0173. Patrauklesn\u0117se vietose nuomos mokes\u010dis \u012fstaigoms tur\u0117t\u0173
  b\u016bti auk\u0161tesnis u\u017e 2020 m. mokam\u0105 atlyg\u012f. Tai tur\u0117t\u0173
  paskatinti klientus optimizuoti savo naudojama plot\u0105. Surenkamas nuomos mokes\u010dis
  u\u017etikrins reikiamas l\u0117\u0161as laisv\u0173 plot\u0173 pritaikymui \u012fstaig\u0173
  poreikiams. Iki \u0161iol patalp\u0173 pritaikymo i\u0161laidas tur\u0117davo padengti
  pati institucija, o tai neskatino \u012fstaig\u0173 koncentracijos.\\n\\n3. Parduodamas
  VNT\\n\\n\u012egyvendindama centralizuot\u0105 valstyb\u0117s nekilnoamojo turto
  valdym\u0105, VJ Turto bankas ne tik valdo, naudoja valstyb\u0117s nekilnojamaj\u012f
  tur\u0105, perduota valdyti patik\u0117jimo teise, ir juo disponuoja, bet ir organizuoja
  nereikalingo valstyb\u0117s turto pardavimo aukcionus.\\n\\n2019 m. pagal pardavimus
  jmonei buvo ypatingi \u2013 visi met\u0173 prad\u017eioje i\u0161sikelti ambicingi
  planai spartinti valstyb\u0117s funkcijoms nereikalingo nekilnoamojo turto pardavimus
  buvo s\u0117kmingai \u012fvykdinti. Suorganizuotas rekordinis skai\u010dius vie\u0161i\u0173j\u0173
  aukcion\u0173 ir parduotas rekordinis skai\u010dius valstybei priklausan\u010di\u0173
  objekt\u0173. Per 2019 m. buvo suorganizuoti ir paskelbti 1 505 vie\u0161ieji aukcionai,
  po kuriu sudaryti 465 sandoriai d\u0117l valstybei priklausan\u010di\u0173 nekilnoamojo
  turto objekt\u0173. Bendra sudaryt\u0173 pardavimo sandori\u0173 vert\u0117 sudaro
  31,52 mln. eur\u0173. Palyginti su pra\u0117jusiais metais, organizuot\u0173 aukcion\u0173
  skai\u010dius i\u0161augo 2,1 kart\u0105, sudaryt\u0173 sandori\u0173 \u2013 2,3
  kart\u0105, o parduoto turto vert\u0117 \u2013 net 3,5 kart\u0105 daugiau. L\u0117\u0161os
  u\u017e parduodamus objektus pervedamos \u012f valstyb\u0117s biud\u017eet\u0105
  arba skiriamos valstyb\u0117s nekilnojamajam turui atnaujinti.\\n\\n| Metai | Organizuoti
  VNT aukcionali | Sudaryti VNT pardavimo sandoriai | Sandori\u0173 vert\u0117 (mln.
  \u20ac) |\\n|-------|---------------------------|----------------------------------|------------------------|\\n|
  2019  | 1 505 +110,2 %            | 465 +130,2 %                     | 31,52 +254,2
  %         |\\n| 2018  | 716                       | 202                              |
  8,9                    |\\n| 2017  | 532 +34,6 %               | 169 +19,5 %                      |
  10,6 -16,0 %           |\\n\\nMa\u017eaver\u010dio ir didel\u0117s vert\u0117s turto
  pardavimai\\n\\nIgyvendinant 2019 m. pardavimo tikslus, ypatingas d\u0117mesys buvo
  skiriamas ir ma\u017eaver\u010dio (<10 t\u016bkst. eur\u0173) turto pardavimui,
  kuris, palyginti su jo verte, yra \u012fmuls eksploatacin\u0117ms s\u0105naudoms.
  Per 2019 m. buvo sudaryti 268 \u0161ios kategorijos turto pardavimo sandoriai. Tai
  2,8 karto daugiau nei ankstesniais 2018 m.\\n\\nMa\u017eaver\u010dio (<10 t\u016bkst.
  eur) turto pardavim\u0173 sandoriai, vnt.\\n\\n2019 m. i\u0161siskyr\u0117 ir didel\u0117s
  (>250 t\u016bkst. eur\u0173) vert\u0117s VNT pardavimais. Turto bankas sudar\u0117
  19 sandori\u0173, kuri\u0173 vert\u0117s vir\u0161ijo 250 t\u016bkst. eur\u0173,
  o bendra pajam\u0173 suma u\u017e \u0161iuos sandorius sudar\u0117 18,83 mln. eur\u0173,
  arba 60 proc. vis\u0173 2019 m. VNT pardavim\u0173 pajam\u0173.\\n\\nDidel\u0117s
  (>250 t\u016bkst. eur) vert\u0117s turto pardavim\u0173 sandoriai, vnt.\\n\\n2019
  m. did\u017eiausi\u0173 sandori\u0173 TOP 10\\n\\n1. Kuro saugykli\u0173 su infrastrukt\u016bra
  teritorija, esanti Savanori\u0173 pr. ir Gari\u016bn\u0173 g. sankirtoje (Jo\u010dion\u0173
  g. 55, Vilnius). Pardavimo kaina \u2013 **7,191 mln. eur\u0173**.\\n2. Ligonin\u0117s
  pastat\u0173 kompleksas, esantis Vytauto g. 15, Vilniuje. Pardavimo kaina \u2013
  **4,36 mln. eur\u0173**.\\n3. Administracin\u0117s patalpos, esan\u010dios \u017dygimant\u0173
  g. 9, Vilniuje. Pardavimo kaina \u2013 **2,05 mln. eur\u0173**.\\n4. Bendrabu\u010dio
  patalpos su kavin\u0117s patalpomis, esan\u010dios Kedr\u0173 g. 6, Vilniuje. Pardavimo
  kaina \u2013 **1,33 mln. eur\u0173**.\\n5. Gara\u017e\u0173 paskirties pastatas,
  esantis Durpi\u0173 g. 2, Vilniuje. Pardavimo kaina \u2013 **1,18 mln. eur\u0173**.\\n6.
  Administracin\u0117s patalpos, esan\u010dios Pilies g. 7, Vilniuje. Pardavimo kaina
  \u2013 **716 t\u016bkst. eur\u0173**.\\n7. Ligonin\u0117s pastatas, esantis J\u016bros
  g. 4, Klaip\u0117doje. Pardavimo kaina \u2013 **572 t\u016bkst. eur\u0173**.\\n8.
  Negyvenamosios patalpos, esan\u010dios Gedimino pr. 10, Vilniuje. Pardavimo kaina
  \u2013 **516 t\u016bkst. eur\u0173**.\\n9. Negyvenamosios patalpos, esan\u010dios
  Gedimino pr. 64 A, Vilniuje. Pardavimo kaina \u2013 **462 t\u016bkst. eur\u0173**.\\n10.
  Administracin\u0117s patalpos, esan\u010dios Kalvarij\u0173 g. 28, Vilniuje. Pardavimo
  kaina \u2013 **450 t\u016bkst. eur\u0173**.\\n\\nPardavimai pagal turto paskirt\u012f\\n\\nKaip
  ir ankstesniais 2018 m., 2019 m. daugiau nei 50 proc. vis\u0173 sandori\u0173 sudar\u0117
  gyvenamosios paskirties, antroje vietoje \u2013 gamybin\u0117s paskirties, tre\u010dioje
  \u2013 administracin\u0117s paskirties turto sandoriai.\\n\\nPirk\u0117j\u0173 segmentai\\n\\nPra\u0117j\u0119
  metai, kurie buvo gana aktyv\u016bs pardavim\u0173 at\u017evilgiu, leid\u017eia
  atskleisti detalesn\u012f valstyb\u0117s turto pirk\u0117j\u0173 vaizd\u0105. Vertinant
  2019 m. \u012fvykusius sandorius pagal finansin\u0119 i\u0161rai\u0161k\u0105, akivaizd\u017eiai
  matyti, kad did\u017eiausi\u0105 vert\u0119 kuria juridiniai asmenys, kuri\u0173
  sandoriai sudaro beveik 70 proc. vis\u0173 turto pardavim\u0173 pajam\u0173. \u0160iuo
  pirk\u0117j\u0173 segmentu sudaro tiek stamb\u016bs investuotojai ir NT vystytojai,
  tiek ma\u017eesn\u0117s \u012fmon\u0117s. Vertinant pardavim\u0173 rezultatus pagal
  sudaryt\u0173 sandori\u0173 kiek\u012f, matyti, kad did\u017eioji dalis sandori\u0173
  sutar\u010di\u0173 buvo pasira\u0161yta su fiziniais asmenimis (beveik 60 proc.
  vis\u0173 sandori\u0173).\\n\\n4. Atnaujinamas VNT\\n\\n2019 m. V\u012e Turto bankas
  dalyvavo \u012fgyvendinant 8 valstyb\u0117s nekilnoamojo turto atnaujinimo projektus
  (toliau \u2013 atnaujinimo projektai), kuriuos vykdant buvo parengti techniniai
  arba techniniai darbo projektai, paskelbti rangos darb\u0173 arba projektavimo ir
  projekto vykdymo prie\u017ei\u016bros paslaug\u0173 konkursai.\\n\\n\u012egyvendinant
  valstyb\u0117s nekilnoamojo turto atnaujinim\u0105 pagal 2007 m. spalio 10 d. LRV
  nutarimo Nr. 1082 \u201eAtnaujinamo valstyb\u0117s nekilnoamojo turto s\u0105ra\u0161as\u201c
  galiojan\u010di\u0105 redakcij\u0105, 2019 m. i\u0161 s\u0105ra\u0161o buvo i\u0161braukta
  2017 m. \u012fgyvendintas Lietuvos kariuomen\u0117s atnaujinimo projektas \u2013
  kompleksinio pastato Pagub\u0117s g. 63, Vilniuje, rekonstrukcija. Min\u0117to projekto
  le\u0161\u0173 likutis buvo perskirstytas kitiemis atnaujinimo projektams \u012fgyvendinti.
  Siekiant padengti kit\u0173 iki 2019 m. baigt\u0173 atnaujinimo projekt\u0173 \u012fsisokinimus
  ir paskatinti vykdom\u0173 atnaujinimo projekt\u0173 eig\u0105, 2019 m. liepos 24
  d. LRV nutarimu \u201eDel Lietuvos Respublikos Vyriausyb\u0117s 2007 m. spalio 10
