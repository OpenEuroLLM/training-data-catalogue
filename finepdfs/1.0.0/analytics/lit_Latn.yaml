sample: '["\"Europos S\u0105jungos  strukt\u016brini\u0173 fond\u0173 l\u0117\u0161\u0173
  panaudojimo vertinimo plano 1 priedas\\n\\nTechnin\u0117 parama, planuojama  2014\u20132020
  m. Europos S\u0105jungos fond\u0173 investicij\u0173 panaudojimui vertinti\\n\\n|  |  |
  ES strukt\u016brini\u0173 fond\u0173 l\u0117\u0161\u0173 dalis, mln. lit\u0173 |
  ES strukt\u016brini\u0173 fond\u0173 l\u0117\u0161\u0173 dalis, mln. eur\u0173 |
  Valstyb\u0117s biud\u017eeto l\u0117\u0161\u0173 dalis, mln. lit\u0173 | Valstyb\u0117s
  biud\u017eeto l\u0117\u0161\u0173 dalis, mln. eur\u0173 | I\u0161 viso, mln. lit\u0173
  |\\n|---|---|---|---|---|---|---|\\n| 1 | Technin\u0117 parama, skirta informuoti
  apie veiksm\u0173 program\u0105 ir j\u0105 vertinti | 20,0 | 5,79 | 3,5 | 1,01 |
  23,5 |\"", "\"TRUSKAVOS PAGRINDIN\u0116 MOKYKLA\\n\\n2017\u20132018 MOKSLO MET\u0172
  PRADINIO UGDYMO PROGRAMOS UGDYMO PLANAS\\n\\n2017\\n\\nPavermenys\\n\\nPATVIRTINTA:
  K\u0117daini\u0173 r. Truskavos pagrindin\u0117s mokyklos Direktoriaus 2017 m. rugpj\u016b\u010dio
  30 d. \u012esakymu Nr. V - 61\\n\\n2017\u20132018 MOKSLO MET\u0172 PRADINIO UGDYMO
  PROGRAMOS BENDRASIS UGDYMO PLANAS\\n\\nI SKYRIUS\\n\\nBENDROSIOS NUOSTATOS\\n\\n1.
  K\u0117daini\u0173  r. Truskavos   pagrindin\u0117s   mokyklos  (toliau Mokyklos)
  2017\u20132018 mokslo met\u0173 ugdymo planas reglamentuoja pradinio, pagrindinio,
  speciali\u0173j\u0173 ugdymo(si) poreiki\u0173 mokiniams  pritaikyt\u0173  program\u0173  bei  neformaliojo  vaik\u0173  \u0161vietimo  program\u0173  \u012fgyvendinim\u0105
  mokykloje.\\n2. 201\u20132018 m. m. ugdymo planas sudarytas vadovaujantis Bendraisiais
  ugdymo planais,  Bendrojo  lavinimo  ugdymo  turinio  formavimo,  vertinimo,  atnaujinimo  ir  diegimo
  strategija, Mokini\u0173 pa\u017eangos ir pasiekim\u0173 vertinimo samprata, Mokyklos
  metiniu veiklos planu, Mokyklos  strateginiu  planu,  mokini\u0173,  j\u0173 t\u0117v\u0173  ir  mokytoj\u0173  si\u016blymais,  Pradinio  ir  pagrindinio
  ugdymo  bendrosiomis  programomis,  patvirtintomis  Lietuvos  Respublikos  \u0161vietimo  ir  mokslo
  ministro 2008 m. rugpj\u016b\u010dio 26 d. \u012fsakymu Nr. ISAK-2433.\\n3. Ugdymo
  plan\u0105 reng\u0117 mokyklos direktoriaus 2016 m.  kovo 3 d. Nr. V- 42 \u012fsakymu
  sudaryta darbo grup\u0117.\\n4. Ugdymo plano tikslas \u2013 apibr\u0117\u017eti  Pradinio,
  pagrindinio  ir vidurinio ugdymo program\u0173  bendruosius  reikalavimus,  kuriomis  vadovaudamasi  mokykla  gali  savaranki\u0161kai  bei
  tikslingai, atsi\u017evelgdama \u012f mokyklos bendruomen\u0117s poreikius, planuoti
  ir organizuoti ugdym\u0105 taip, kad\\nkiekvienas mokinys  pasiekt\u0173  geresnius  ugdymo(si)  rezultatus  ir  \u012fgyt\u0173  vis\u0105  gyvenim\u0105  b\u016btin\u0173
  bendr\u0173j\u0173 ir dalykini\u0173 kompetencij\u0173.\\n5. U\u017edaviniai:\\n5.1.
  nustatyti reikalavimus ugdymo procesui organizuoti;\\n5.2. laiku identifikuoti kylan\u010dius
  mokymosi sunkumus ir tinkamai individualizuoti ir diferencijuoti ugdym\u0105;\\n5.3.
  paskirstyti pamok\u0173 skai\u010di\u0173, skirt\u0105 pradinio, pagrindinio ugdymo
  programoms \u012fgyvendinti;\\n5.4. racionaliai naudoti modernizuot\u0105 mokymo(si)
  aplink\u0105, kurti ir diegti inovatyvius ugdymo metodus, kurie u\u017etikrint\u0173
  kokybi\u0161k\u0105 i\u0161silavinim\u0105, ugdyt\u0173 verslumo \u012fg\u016bd\u017eius;\\n5.5.
  pagal  poreik\u012f  tobulinti  vertinimo  sistem\u0105,  steb\u0117ti  mokini\u0173  pa\u017eang\u0105  ir  siekti
  mokini\u0173 pasiekim\u0173 gerinimo;\\n5.6. gerinti mokytoj\u0173, mokini\u0173
  ir t\u0117v\u0173 bendradarbiavim\u0105;\\n5.7.efektyvinti neformaliojo  ugdymo  ir  klasi\u0173  vadov\u0173  veikl\u0105:  ugdyti  sveikos
  gyvensenos \u012fg\u016bd\u017eius,  poreik\u012f pa\u017einti ir puosel\u0117ti
  savo kra\u0161to kult\u016br\u0105 ir tradicijas.\\n6. Mokyklos ugdymo plane vartojamos
  s\u0105vokos:\\n\\nDalyko modulis \u2013 apibr\u0117\u017eta, savaranki\u0161ka
  ir kryptinga ugdymo programos dalis.\\n\\nKontrolinis darbas \u2013 \u017eini\u0173,
  geb\u0117jim\u0173, \u012fg\u016bd\u017ei\u0173 parodymas arba mokinio \u017einias,
  geb\u0117jimus, \u012fg\u016bd\u017eius patikrinantis ir formaliai vertinamas darbas,
  kuriam atlikti skiriama ne ma\u017eiau kaip 30 minu\u010di\u0173.\\n\\nLaikinoji
  grup\u0117 \u2013 mokini\u0173 grup\u0117 dalykui pagal modul\u012f mokytis, diferencijuotai
  mokytis dalyko ar mokymosi pagalbai teikti.\\n\\nMokyklos  ugdymo  planas \u2013  mokykloje  vykdom\u0173  ugdymo  program\u0173  \u012fgyvendinimo  apra\u0161as,
  parengtas, vadovaujantis bendraisiais ugdymo planais.\\n\\nPamoka \u2013 pagrindin\u0117
  nustatytos trukm\u0117s nepertraukiamo mokymosi organizavimo forma.\\n\\nSpecialioji  pamoka
  \u2013  pamoka  mokiniams,  turintiems  speciali\u0173j\u0173  ugdymosi  poreiki\u0173,  skirta
  \u012fgimtiems ar \u012fgytiems sutrikimams kompensuoti, i\u0161skirtiniams asmens
  gabumams ugdyti.\\n\\nSpecialiosios  pratybos \u2013 \u0161vietimo  pagalbos  teikimo  forma
  mokiniams,  turintiems  speciali\u0173j\u0173 ugdymosi poreiki\u0173, padedanti
  \u012fveikti mokymosi sunkumus ir sutrikimus.\\n\\nKitos  ugdymo  plane  vartojamos  s\u0105vokos  atitinka  Lietuvos  Respublikos  \u0161vietimo
  \u012fstatyme ir kituose \u0161vietim\u0105 reglamentuojan\u010diuose teis\u0117s
  aktuose vartojamas s\u0105vokas.\\n\\nII SKYRIUS\\n\\nMOKYKLOS UGDYMO TURINIO  PLANO
  RENGIMAS\\n\\n7. Mokyklos ugdymo planas parengtas vadovaujantis 2017-2018 ir 2018-2019
  mokslo met\u0173 Pradinio ugdymo programos bendruoju ugdymo planu ir Pagrindinio
  ir vidurinio ugdymo program\u0173 bendraisiais ugdymo planais, Pradinio, pagrindinio
  ir vidurinio ugdymo program\u0173 apra\u0161u, patvirtintu Lietuvos Respublikos
  \u0161vietimo ir mokslo ministro 2015 m. gruod\u017eio 21 d. \u012fsakymu Nr. V-1309
  \u201eD\u0117l pradinio, pagrindinio ir vidurinio ugdymo program\u0173 apra\u0161o
  patvirtinimo\\\" (toliau \u2013 Ugdymo  program\u0173  apra\u0161as),  Pradinio  ir  pagrindinio  ugdymo  bendrosiomis  programomis,
  patvirtintomis Lietuvos Respublikos \u0161vietimo ir mokslo ministro 2008 m. rugpj\u016b\u010dio
  26d. \u012fsakymu Nr. \u012eSAK-2433 \u201eD\u0117l Pradinio ir pagrindinio ugdymo
  bendr\u0173j\u0173 program\u0173 patvirtinimo\\\", 1 priedo \u201ePradinio ugdymo
  bendroji programa\\\" (toliau -Bendroji programa), nuostatomis d\u0117l ugdymo turinio
  k\u016brimo ir mokymosi pasiekim\u0173, Geros mokyklos koncepcija, patvirtinta Lietuvos
  Respublikos \u0161vietimo ir mokslo ministro 2015 m. gruod\u017eio 21 d. \u012fsakymu
  Nr. V-1308 \u201eD\u0117l Geros mokyklos koncepcijos  patvirtinimo\\\", Bendraisiais  ugdymo
  planais, Mokymosi pagal formaliojo \u0161vietimo programas form\u0173 ir mokymo
  tvarkos apra\u0161u, patvirtintu Lietuvos Respublikos \u0161vietimo ir mokslo ministro
  2012 m. bir\u017eelio 28 d. \u012fsakymu Nr. V-1049 \u201eD\u0117l Mokymosi pagal
  formaliojo \u0161vietimo programas  form\u0173  ir  mokymo  organizavimo  tvarkos  apra\u0161o  patvirtinimo\\\",  pradin\u012f  ugdym\u0105,
  pagrindin\u012f, neformal\u0173j\u012f vaik\u0173 \u0161vietim\u0105 ir mokyklos
  veikl\u0105 reglamentuojan\u010diais teis\u0117s aktais bei mokyklos strateginiu
  planu.\\n8. Rengiant mokyklos ugdymo plan\u0105, mokyklos direktoriaus 2017 m. gegu\u017e\u0117s
  31d. \u012fsakymu Nr.V-173 sudaryta darbo grup\u0117, \u012f kuri\u0105 bendradarbiavimo
  pagrindais \u012ftraukti mokytojai, mokyklos administracijos,  Vaiko gerov\u0117s
  komisijos atstovai.\\n9. Mokyklos ugdymo planas rengiamas vieneriems mokslo metams.\\n10.
  Mokyklos  ugdymo  plan\u0105  iki  ugdymo  proceso  prad\u017eios  tvirtina  mokyklos
  direktorius, projekt\u0105 suderin\u0119s su mokyklos taryba,  K\u0117daini\u0173
  rajono savivaldyb\u0117s administracijos \u0160vietimo, kult\u016bros ir sporto
  skyriaus ved\u0117ju.\\n11. Mokyklos ugdymo plane \u012fteisinami mokyklos bendruomen\u0117s\\n\\n(
  tarybos pos\u0117d\u017eio protokolas 2017-06-23 Nr. M-3) susitarimai d\u0117l:\\n\\n11.1.
  prioritetini\u0173 ugdymo tiksl\u0173 ir u\u017edavini\u0173, keliam\u0173 mokyklos
  numatytam ugdymo laikotarpiui - metams;\\n11.2. ugdymo proceso organizavimo laikotarpi\u0173
  (pusme\u010diai);\\n11.3. Bendrajai programai \u012fgyvendinti skiriam\u0173 ugdymo
  valand\u0173 konkre\u010diai klasei paskirstymo;\\n11.4. ugdymo turinio formavimo
  ( dalykinio ir (ar) mi\u0161raus ugdymo), mokymosi organizavimo form\u0173 (pamoka);\\n11.5.
  ugdymo turinio planavimo laikotarpi\u0173, strukt\u016bros ir kit\u0173 su ugdymo
  turinio planavimu susijusi\u0173 aspekt\u0173;\\n11.6. edukacini\u0173 erdvi\u0173
  k\u016brimo, panaudojimo ir pritaikymo, atsi\u017evelgiant \u012f mokini\u0173 ugdymosi
  poreikius, keliamus ugdymo tikslus;\\n11.7. Bendrosios programos pritaikymo mokiniams,
  turintiems speciali\u0173j\u0173 ugdymosi poreiki\u0173 d\u0117l i\u0161skirtini\u0173
  gabum\u0173, \u012fgimt\u0173 ar \u012fgyt\u0173 sutrikim\u0173, nepalanki\u0173
  aplinkos veiksni\u0173, pradinio ir pagrindinio Ugdymo individualizuotos programos
  \u012fgyvendinimo;\\n11.8. ugdymo valand\u0173, skiriam\u0173 mokini\u0173 ugdymo
  poreikiams tenkinti panaudojimo;\\n11.9. klasi\u0173 dalijimo \u012f grupes, ma\u017eiausio
  mokini\u0173 skai\u010diaus jose nustatymo, laikin\u0173j\u0173 grupi\u0173 sudarymo;\\n11.11.
  mokini\u0173 mokymosi kr\u016bvio reguliavimo priemoni\u0173: pasiekim\u0173 patikrinam\u0173j\u0173
  darb\u0173 organizavimo  b\u016bd\u0173 (kontrolini\u0173,  diagnostini\u0173,  savaranki\u0161k\u0173  darb\u0173
  ir kt.)  ir laikotarpi\u0173, did\u017eiausio patikrinam\u0173j\u0173 darb\u0173
  skai\u010diaus per savait\u0119, nam\u0173 darb\u0173 skyrimo;\\n11.12. mokini\u0173  ugdymo  pasiekim\u0173  ir  pa\u017eangos  vertinimo  metodikos  ir  tvarkos
  (mokykloje parengtas pradini\u0173 klasi\u0173 mokini\u0173 pa\u017eangos ir pasiekim\u0173
  vertinimo tvarkos apra\u0161as, patvirtintas  mokyklos  direktoriaus  \u012fsakymu  2017-06-15  Nr.  V-181  ir  mokini\u0173  pa\u017eangos  ir
  pasiekim\u0173 vertinimo tvarkos apra\u0161as, patvirtintas mokyklos direktoriaus
  \u012fsakymu 2016-08-30 Nr. V-70) ;\\n11.13. vadov\u0117li\u0173  ir  kit\u0173  mokymo(si)  priemoni\u0173  pasirinkimo,  naudojimosi  jomis
  gimnazijoje princip\u0173 ir tvarkos;\\n11.14. pa\u017eintin\u0117s ir kult\u016brin\u0117s,
  projektin\u0117s veiklos organizavimo;\\n11.15. neformaliojo  vaik\u0173  \u0161vietimo  program\u0173  pasirinkimo  ir  j\u0173  \u012fgyvendinimo
  (derinant su Bendrosios programos dalyk\u0173 ugdymo programomis ar vykdant atskiras
  programas), skiriam\u0173 ugdymo valand\u0173, mokini\u0173 skai\u010diaus grup\u0117se;\\n11.16.
  prevencini\u0173  ir  kit\u0173  ugdymo  program\u0173  pasirinkimo  ir  j\u0173  \u012fgyvendinimo
  (integruojant \u012f Bendrosios programos dalykus ar vykdant atskiras programas,
  skiriant joms tikslines ugdymo valandas);\\n11.17. bendradarbiavimo  su  mokini\u0173  t\u0117vais  (glob\u0117jais)  tiksl\u0173  ir
  form\u0173;  (apra\u0161as, patvirtintas mokyklos direktoriaus \u012fsakymu 2016-08-30
  Nr. V-70) ;\\n11.18. pasirenkam\u0173j\u0173  dalyk\u0173 ir dalyk\u0173 moduli\u0173,
  modulini\u0173 program\u0173 pasi\u016blos ir rengimo (nesant \u0161vietimo ir mokslo
  ministro patvirtint\u0173);\\n11.19. mokini\u0173 socialin\u0117s-pilietin\u0117s
  veiklos organizavimas mokantis pagal pagrindinio ugdymo program\u0105.( parengtas
  socialin\u0117s-pilietin\u0117s veiklos tvarkos apra\u0161as, patvirtintas gimnazijos
  direktoriaus \u012fsakymu 2016-09-28 Nr. V-191) ;\\n11.21. skaitymo, ra\u0161ymo,
  kalb\u0117jimo, skai\u010diavimo ir skaitmenini\u0173 geb\u0117jim\u0173 ugdymo
  per vis\u0173 dalyk\u0173 pamokas, \u012fgyvendinant pagrindinio ugdymo programos
  pirm\u0105j\u0105 dal\u012f;\\n11.23. \u0161vietimo pagalbos teikimo;\\n11.24. mokinio
  individualaus plano sudarymo ir reikalavim\u0173 \u0161iam planui numatymo;\\n11.25.
  kit\u0173 \u0161io dokumento 16 punkte nenurodyt\u0173, ta\u010diau mokyklai svarbi\u0173
  pradinio, pagrindinio  ugdymo program\u0173 \u012fgyvendinimo nuostat\u0173.\\n12.
  Siekiant tenkinti mokini\u0173 ugdymosi poreikius, mokyklos ugdymo plane gali b\u016bti
  \u012fteisinti ir kiti Bendrame ugdymo plane nenumatyti sprendimai, jei mokyklai
  pakanka mokymo l\u0117\u0161\u0173 ir  tiems  sprendimams  pritaria  mokyklos  taryba  ir  savininko  teises  ir  pareigas  \u012fgyvendinanti
  institucija, savivaldyb\u0117s vykdomoji institucija ar jos \u012fgaliotas asmuo.\\n13.
  Mokykla,  vykdydama  pradinio,  pagrindinio  ugdymo  programas,  vadovaujasi dalyk\u0173  programoms  \u012fgyvendinti  skiriam\u0173  minimali\u0173  pamok\u0173  skai\u010diumi  per  savait\u0119,  pateikt\u0105
  ugdymo plano 23, 132 ir 148 punktuose.\\n14. Pradedantiems mokytis pagal pradinio
  ugdymo program\u0105  naujai atvykusiems mokiniams skiriamas 1 m\u0117nesio adaptacinis
  laikotarpis.\\n15. Mokykla,  rengdama  ugdymo  plan\u0105,  remiasi  \u0161vietimo  steb\u0117senos,  mokini\u0173
  pasiekim\u0173 ir pa\u017eangos vertinimo procese informacija, mokyklos \u012fsivertinimo
  ir i\u0161or\u0117s vertinimo duomenimis, 4 klasi\u0173 standartizuot\u0173 test\u0173
  ir 2 klas\u0117s diagnostini\u0173 test\u0173 duomenimis. Standartizuot\u0173 test\u0173
  rezultatus dalyk\u0173 mokytojai i\u0161analizuoja kartu su mokiniais pamokose ir
  numato individualios pagalbos  b\u016bdus,  rezultatai  aptariami  ir  analizuojami  metodin\u0117se  grup\u0117se  ir  mokytoj\u0173  tarybos
  pos\u0117dyje.  Mokiniams,  kurie  nepasiek\u0117  minimalaus  lygmens,  teikiama  pagalba  (trumpalaiki\u0173
  konsultacij\u0173 metu).\\n\\nIII SKYRIUS\\n\\nPRADINIO UGDYMO PROGRAMOS \u012eGYVENDINIMAS\\n\\nPIRMAS
  SKIRSNIS\\n\\nPRADINIO UGDYMO PROCESO TRUKM\u0116\\n\\n16. Ugdymo organizavimas:\\n16.1.
  2017\u20132018 mokslo metai:\\n16.1.1. Mokslo metai prasideda 2017 m. rugs\u0117jo
  1 d., baigiasi 2018 m. rugpj\u016b\u010dio 31 d.\\n\\nVieneri\u0173 mokslo met\u0173
  ugdymo proceso trukm\u0117: 1 \u2013 4 klas\u0117ms \u2013 34 savait\u0117s (170
  ugdymo dien\u0173);\\n\\n16.1.2. 2017\u20132018 mokslo metais ugdymo procesas prasideda
  2017 m. rugs\u0117jo 1 d., baigiasi 2018 m. gegu\u017e\u0117s 31 d.;\\n\\n16.1.3.
  2017\u20132018 mokslo metais ugdomasis procesas bus vykdomas pusme\u010diais:\\n\\n16.1.4.
  Ugdomojo proceso metu mokiniams skiriamos atostogos:\\n\\n16.2. Vasaros atostog\u0173
  prad\u017ei\u0105 mokiniams nustato mokyklos direktorius, suderin\u0119s su mokyklos
  taryba ir savininko teises ir pareigas \u012fgyvendinan\u010dia institucija.\\n17.
  Mokykla dirba penkias dienas per savait\u0119.\\n18. Ugdymo  procesas,  \u012fgyvendinant  pagrindinio  ugdymo  program\u0105,  skirstomas
  pusme\u010diais (mokyklos direktoriaus 2015 m. bir\u017eelio 10 d. \u012fsakymu
  Nr. V \u2013 63 ).\\n19. Mokyklos  vadovas,  i\u0161kilus  situacijai,  kelian\u010diai  pavoj\u0173  mokini\u0173  sveikatai  ar
  gyvybei, ar paskelbus ekstremali\u0105j\u0105 situacij\u0105, priima sprendimus
  d\u0117l ugdymo proceso koregavimo. Ekstremalioji  situacija  \u2013  tai  pad\u0117tis,  kuri  gali  susidaryti  d\u0117l  kilusio  ekstremalaus  (gamtinio,
  techninio, ekologinio ar socialinio) \u012fvykio ir kelia didel\u012f pavoj\u0173
  \u017emoni\u0173 gyvybei ar sveikatai, turtui, gamtai  arba  lemia  \u017emoni\u0173  \u017e\u016bt\u012f,  su\u017ealojim\u0105  ar  didelius  turtinius  nuostolius.  Sprendim\u0105  d\u0117l
  ekstremaliosios  situacijos  paskelbimo  nelaim\u0117s  apimtoje  savivaldyb\u0117s  teritorijoje  priima
  savivaldyb\u0117s administracijos direktorius, o jeigu ekstremalioji situacija i\u0161plinta
  \u012f daugiau negu tris savivaldybes, valstyb\u0117s lygio ekstremali\u0105j\u0105
  situacij\u0105 skelbia Lietuvos Respublikos Vyriausyb\u0117. Mokyklos  vadovas  apie  priimtus  sprendimus  d\u0117l  ugdymo  proceso  koregavimo  informuoja
  valstybin\u0117s mokyklos (biud\u017eetin\u0117s \u012fstaigos) savininko teises
  ir pareigas \u012fgyvendinan\u010di\u0105 institucij\u0105, savivaldyb\u0117s mokyklos
  (biud\u017eetin\u0117s \u012fstaigos) savivaldyb\u0117s vykdom\u0105j\u0105 institucij\u0105
  ar jos \u012fgaliot\u0105 asmen\u012f,  valstybin\u0117s  ir  savivaldyb\u0117s  mokyklos  (vie\u0161osios  \u012fstaigos)  ir  nevalstybin\u0117s  mokyklos
  savinink\u0105 (dalyvi\u0173 susirinkim\u0105).\\n20. I\u0161kilus ekstremaliai
  situacijai, kelian\u010diai pavoj\u0173 mokini\u0173 sveikatai ar gyvybei, paskelbus
  epidemin\u0119 pad\u0117t\u012f d\u0117l staigaus ir ne\u012fprastai didelio u\u017ekre\u010diam\u0173j\u0173
  lig\u0173 i\u0161plitimo viename ar keliuose administraciniuose teritoriniuose vienetuose
  mokyklos vadovas priima sprendimus d\u0117l ugdymo proceso koregavimo, apie priimtus
  sprendimus informuoja K\u0117daini\u0173 rajono savivaldyb\u0117s administracijos
  \u0161vietimo skyri\u0173, mokyklos taryb\u0105.\\n21. Jei  oro  temperat\u016bra  20  laipsni\u0173  \u0161al\u010dio  ar  \u017eemesn\u0117,  \u012f  mokykl\u0105  gali  nevykti
  prie\u0161mokyklin\u0117s grup\u0117s vaikai bei 1 - 4 klasi\u0173 mokiniai. \u0160ios
  dienos \u012fskai\u010diuojamos \u012f mokymosi dien\u0173 skai\u010di\u0173.\\n\\nANTRASIS
  SKIRSNIS\\n\\nBENDROSIOS PROGRAMOS \u012eGYVENDINIMO BENDROSIOS NUOSTATOS\\n\\n22.
  Mokyklos ugdymo turinys \u012fgyvendinamas atrenkant ir pritaikant ugdymo turin\u012f
  pagal mokyklos tikslus, Lietuvos visuomen\u0117s vertybes, konkre\u010dius mokini\u0173
  ugdymo(si) poreikius.\\n23. Mokyklos ugdymo turinys formuojamas ir \u012fgyvendinamas
  vadovaujantis pradinio ir pagrindinio  ugdymo bendrosiomis programomis, patvirtintomis
  Lietuvos Respublikos \u0161vietimo ir mokslo ministro 2008 m. rugpj\u016b\u010dio
  26 d. \u012fsakymu Nr. ISAK-2433 (\u017din., 2008, Nr. 99-3848) (toliau\u2013  Pagrindinio  ugdymo  bendrosios  programos),  ir  Vidurinio  ugdymo  bendrosiomis
  programomis, patvirtintomis Lietuvos Respublikos \u0161vietimo ir mokslo ministro
  2011 m. vasario 21 d.  \u012fsakymu  Nr.  V-269  (\u017din.,  2011,  Nr.  26-1283)  (toliau  \u2013  Vidurinio  ugdymo  bendrosios
  programos),  Bendraisiais  ugdymo  planais,  Mokymosi  pagal  formaliojo  \u0161vietimo  programas
  (i\u0161skyrus auk\u0161tojo mokslo studij\u0173 programas) form\u0173 ir mokymo
  organizavimo tvarkos apra\u0161u, patvirtintu Lietuvos Respublikos \u0161vietimo
  ir mokslo ministro 2012 m. bir\u017eelio 28 d. \u012fsakymu Nr. V1049 (\u017din.,
  2012, Nr. 76-3957), ir atsi\u017evelgiant \u012f mokyklai skirtas mokymo l\u0117\u0161as.\\n24.
  Formuojant  mokyklos  ugdymo  turin\u012f  ir  rengiant  mokyklos  ugdymo  plan\u0105
  remiamasi  \u0161vietimo  steb\u0117senos,  mokini\u0173  pasiekim\u0173  ir  pa\u017eangos  vertinimo  ugdymo  procese
  informacija, pasiekim\u0173 tyrim\u0173, mokyklos veiklos \u012fsivertinimo ir i\u0161orinio
  vertinimo duomenimis.\\n25. 2017\u20132018mokslo metais pradinio ugdymo programai
  (ugdymo dalykams)ir neformaliojo \u0161vietimo programoms \u012fgyvendinti skiriama
  valand\u0173:\\n25.1. pradinio ugdymo programai (ugdymo dalykams) ir neformaliajam
  ugdymui skiriamos ugdymo valandos per  metus. Pamokos trukm\u0117 1 klas\u0117je
  \u2013 35 min., 2\u20134 klas\u0117se \u2013 45 min., valandos:\\n\\np* - valandos,
  skiriamos mokini\u0173 ugdymosi poreikiams tenkinti.\\n\\n25. 2. 1 \u2013 4 klas\u0117ms
  skiriamos val./sav.  mokini\u0173 ugdymo (si) poreikiams tenkinti:\\n\\n2 klas\u0117
  \u2013 k\u016bno kult\u016bra (1*p val.);\\n4 klas\u0117 \u2013 matematika (1* p
  val.).\\n26. Bendrajai programai (ugdymo dalykams) ir neformaliojo \u0161vietimo
  programoms per metus skiriamos ugdymo valandos:\\n26.1.ugdymo(si) valand\u0173 skai\u010di\u0173
  klasei per savait\u0119 sudaro: minimalus pamok\u0173 skai\u010dius mokiniui, valandos,
  skiriamos  mokini\u0173 ugdymo(si) poreikiams  tenkinti, neformaliojo  \u0161vietimo
  valand\u0173 skai\u010dius;\\n26.1.1.ugdymo procesas gali b\u016bti organizuojamas
  ne tik mokykloje, bet ir u\u017e jos rib\u0173;\\n26.1.2.ugdymo procesas gali b\u016bti
  organizuojamas pamoka  ir kitais b\u016bdais (projektai, ekskursijos, i\u0161vykos,
  k\u016brybiniai darbai ir kt.);\\n27. Mokykloje r\u016bpinamasi lietuvi\u0173 kalbos
  ugdymu per vis\u0173 dalyk\u0173 pamokas:\\n27.1. ra\u0161to darbus mokiniai \u012fteikia
  ra\u0161ytus ranka; \u201a\\n27.2. mokom\u0105sias u\u017eduotis panaudoti kalbai
  ir m\u0105stymui ugdyti, kreipiant mokini\u0173 d\u0117mes\u012f \u012f kalbos nuoseklum\u0105,
  logi\u0161kum\u0105, planingum\u0105;\\n27.3. skatinti mokinius savaranki\u0161kai,
  ri\u0161liai ir taisyklingai reik\u0161ti mintis \u017eod\u017eiu ir ra\u0161tu
  per vis\u0173 dalyk\u0173 pamokas;\\n27.4. vertinant  mokinio  pasiekimus  teikti  gr\u012f\u017etam\u0105j\u0105  informacij\u0105  ir  apie  kalbos
  mok\u0117jim\u0105, nurodyti privalumus ir taisytinus bei tobulintinus dalykus;\\n27.5.
  ugdyti  kalbin\u0119  atsakomyb\u0119,  kalbin\u0119  rai\u0161k\u0105,  suvokiant  tai  kaip  vien\u0105  i\u0161
  prisistatymo vie\u0161oje erdv\u0117je \u012fvaizd\u017eio element\u0173 ir skland\u017eios
  komunikacijos pagrind\u0105.\\n28. Pradinio ugdymo programos dalyk\u0173 ugdymo
  organizavimas:\\n28.1.Dorinis ugdymas: Dorinio ugdymo dalyk\u0105 (tradicin\u0117s
  religin\u0117s bendruomen\u0117s ar bendrijos tikybos ar etikos dalyk\u0105) mokiniui  parenka
  t\u0117vai (glob\u0117jai),\\n28.1.1. dorinio ugdymo dalyk\u0105 mokiniui galima
  keisti kiekvienais mokslo metais pagal t\u0117v\u0173 (glob\u0117j\u0173) para\u0161yt\u0105
  pra\u0161ym\u0105;\\n28.1.2. mokykloje   nesusidarius mokini\u0173 grupei etikai
  arba tikybai mokytis, sudaroma laikinoji grup\u0117 i\u0161 keli\u0173 klasi\u0173
  mokini\u0173.\\n\\n28.2. Lietuvi\u0173 kalbos ugdymas:\\n\\n28.2.1.lietuvi\u0173
  kalbos ugdymas yra pradinio ugdymo programos sudedamoji dalis ir jo mokoma:\\n28.2.2.pagal
  Lietuvos Respublikos \u0161vietimo ir mokslo ministro patvirtint\u0105 lietuvi\u0173
  kalbos ugdymo program\u0105;\\n28.2.3. mokykla, formuodama ugdymo turin\u012f, gali:\\n220.127.116.11.
  mokiniams, kurie nepasiekia lietuvi\u0173 kalbos pagrindinio ugdymo bendrojoje programoje  numatyto  patenkinamo  lygio,  sudaro  s\u0105lygas  i\u0161lyginti  mokymosi  spragas  (skiria
  individualias konsultacijas).\\n28.3. U\u017esienio kalbos ugdymas:\\n28.3.1.pirmos
  u\u017esienio kalbos mokomasi 2 - 4 klas\u0117se;\\n28.3.2. u\u017esienio kalbai
  mokyti visose 2-4 klas\u0117se skiriama po 2 ugdymo valandas per savait\u0119.\\n\\n28.
  4. Matematinis ugdymas:\\n\\n28.4.1. organizuojant  matematin\u012f  ugdym\u0105  rekomenduojama  vadovautis  ne  tik
  Bendrosios programos matematikos dalyko programa, bet ir nacionalini\u0173 bei tarptautini\u0173
  mokini\u0173 pasiekim\u0173  tyrim\u0173  rekomendacijomis,  naudoti  informacines  komunikacines  technologijas,
  skaitmenines mokom\u0105sias priemones.\\n\\n28.5. Socialinis ir gamtamokslinis
  ugdymas:\\n\\n28.5.1. mokymasis  per  gamtos  moksl\u0173  pamokas  grind\u017eiamas  tiriamojo  pob\u016bd\u017eio
  metodais, dialogais, diskusijomis, bendradarbiaujant, savaranki\u0161kai atliekamu
  darbu ir panaudojant informacines komunikacines technologijas;\\n28.5.2. gamtamoksliniams  geb\u0117jimams  ugdytis  skiriama  1/2  pasaulio  pa\u017einimo
  dalykui skirto ugdymo laiko. Rekomenduojamos ugdymo veiklos, sudaran\u010dios s\u0105lygas
  ugdytis praktinius gamtamokslinius geb\u0117jimus, tod\u0117l dal\u012f (1/4) dalykui
  skiriamo laiko ugdymas tur\u0117t\u0173 vykti tyrin\u0117jimams palankioje aplinkoje,
  nat\u016bralioje gamtin\u0117je (pvz., parke, mi\u0161ke, prie vandens telkinio
  ar pan.) aplinkose, laboratorijose;\\n\\n28.6.\\n\\nMeninis ugdymas:\\n\\n28.6.1.
  meninio ugdymo srities dalykus sudaro privalomieji dail\u0117s, muzikos dalykai;\\n28.6.2.
  men\u0173 dalyk\u0173 mokymas  integruotas \u012f neformaliojo \u0161vietimo programas.\\n28.7.
  Technologinis ugdymas.\\n\\n:\\n\\n28.7.1. technologiniam ugdymui rekomenduojama
  skirti ne ma\u017eiau kaip 1/3 dail\u0117s ir technologij\u0173 dalykui skiriamo
  laiko, nurodyto Bendrojo ugdymo plano 22, 23 punktuose.\\n\\n28.8. K\u016bno kult\u016bra:\\n\\n28.8.1.
  k\u016bno kult\u016brai  2 klas\u0117je skiriamos 2 ugdymo  valandos per savait\u0119,
  tod\u0117l sudaroma galimyb\u0117  mokiniams papildomai rinktis j\u0173 pom\u0117gius
  atitinkan\u010dias aktyvaus jud\u0117jimo pratybas;\\n28.8.2. specialiosios  medicinin\u0117s  fizinio  paj\u0117gumo  grup\u0117s  mokiniai  dalyvauja
  pamokose su pagrindine grupe, bet pratimai ir kr\u016bvis jiems skiriami pagal gydytojo
  rekomendacijas ir atsi\u017evelgus \u012f savijaut\u0105;\\n28.8.3. parengiamosios
  medicinin\u0117s fizinio paj\u0117gumo grup\u0117s mokiniams kr\u016bvis ir pratimai
  skiriami atsi\u017evelgus \u012f j\u0173 lig\u0173 pob\u016bd\u012f ir sveikatos
  b\u016bkl\u0119. Neskiriama ir neatliekama pratim\u0173, galin\u010di\u0173  skatinti  lig\u0173  pa\u016bm\u0117jim\u0105.  D\u0117l  ligos  pob\u016bd\u017eio  negalintiesiems  atlikti  \u012fprast\u0173  u\u017eduo\u010di\u0173
  mokytojas taiko alternatyvias atsiskaitymo u\u017eduotis, kurios atitinka mokini\u0173
  fizines galimybes ir gydytojo rekomendacijas.;\\n28.8.4. mokykla mokiniams, atleistiems
  nuo k\u016bno kult\u016bros pamok\u0173 d\u0117l sveikatos ir laikinai d\u0117l
  ligos, si\u016blo kit\u0105 veikl\u0105 (stalo \u017eaidimus, \u0161a\u0161kes,
  \u0161achmatus, veikl\u0105 kompiuteri\u0173 klas\u0117je, bibliotekoje);\\n28.8.5.
  siekiant  skatinti  mokini\u0173  fizin\u012f  aktyvum\u0105,  sveikatinim\u0105,  rekomenduojama
  ugdymo proceso metu pagal galimybes organizuoti judri\u0105sias pertraukas ar fiziniam
  aktyvinimui skirtas veiklas. Pradini\u0173 klasi\u0173 vadovai po dviej\u0173 pamok\u0173,
  ilgosios pertraukos metu, organizuoja fizinius u\u017esi\u0117mimus lauke pagal
  galimybes.\\n\\nTRE\u010cIAS SKIRSNIS\\n\\nBENDROSIOS PROGRAMOS UGDYMO DALYK\u0172,
  INTEGRUOJAM\u0172J\u0172 PROGRAM\u0172 \u012eGYVENDINIMAS\\n\\n29. \u012e Bendrosios
  programos ugdymo dalyk\u0173 program\u0173 turin\u012f integruojama:\\n29.1. bendr\u0173j\u0173
  kompetencij\u0173 ir gyvenimo \u012fg\u016bd\u017ei\u0173 ugdymo integruojam\u0173j\u0173
  program\u0173 \u2013 Mokymosi mokytis, Komunikavimo,  Darnaus  vystymosi, Kult\u016brinio  s\u0105moningumo,
  Gyvenimo \u012fg\u016bd\u017ei\u0173  ugdymo  program\u0173  pagrindai  (Pradinio  ir  pagrindinio  ugdymo  bendr\u0173j\u0173  program\u0173,
  patvirtint\u0173 Lietuvos Respublikos \u0161vietimo ir mokslo ministro 2008 m. rugpj\u016b\u010dio
  26 d. \u012fsakymu Nr. ISAK-2433 \u201eD\u0117l Pradinio ir pagrindinio ugdymo bendr\u0173j\u0173
  program\u0173 patvirtinimo\\\", 11 priedas \u201eBendr\u0173j\u0173 kompetencij\u0173
  ir gyvenimo \u012fg\u016bd\u017ei\u0173 ugdymas\\\"). \u0160i\u0173 program\u0173
  atskirai planuoti ir vykdyti nereikia, jos yra integruotos \u012f Bendrosios programos
  turin\u012f;\\n29.2. \u017emogaus saugos bendroji programa ir Sveikatos ir lyti\u0161kumo
  ugdymo bei rengimo \u0161eimai bendroji programa;\\n29.3. mokyklos pasirinktos prevencin\u0117s
  \\\"OPKUS\\\" ir kitos ugdymo programos. Mokykla  privalo  sudaryti  s\u0105lygas  kiekvienam  mokiniui  dalyvauti  bent  vienoje  nuoseklioje  ir
  ilgalaik\u0117je prevencin\u0117je programoje, kuri apimt\u0173 smurto, paty\u010di\u0173,
  alkoholio, tabako, taip pat kit\u0173 psichik\u0105 veikian\u010di\u0173 med\u017eiag\u0173
  vartojimo prevencij\u0105, skatint\u0173 sveik\u0105 gyvensen\u0105, \u012fgyvendindama
  Smurto prevencijos \u012fgyvendinimo mokyklose rekomendacijas, patvirtintas Lietuvos
  Respublikos \u0161vietimo ir mokslo ministro 2017 m. kovo 22 d. \u012fsakymu Nr.
  V- 190 \u201eD\u0117l Smurto prevencijos \u012fgyvendinimo mokyklose rekomendacij\u0173
  patvirtinimo\\\";\\n29.4. etnin\u0117s kult\u016bros ugdymas;\\n29.5. informacini\u0173  komunikacini\u0173  technologij\u0173  ugdymas.  Informacin\u0117s
  komunikacin\u0117s  technologijos  ugdymo  procese  naudojamos  kaip  ugdymo  priemon\u0117,  taip  pat
  mokoma informacini\u0173 komunikacini\u0173 technologij\u0173 pradmen\u0173;\\n29.6.
  ugdymo karjerai programa, patvirtinta Lietuvos Respublikos \u0161vietimo ir mokslo
  ministro 2014 m. sausio 15 d. \u012fsakymu Nr. V-72 \u201eD\u0117l Ugdymo karjerai
  programos patvirtinimo\\\";\\n29.7. mokytojas,  formuodamas  klas\u0117s  mokini\u0173  ugdymo  turin\u012f,  numato  ugdymo
  dalykus, \u012f kuriuos integruojamas Sveikatos ir lyti\u0161kumo ugdymo bei rengimo
  \u0161eimai bendrosios, \u017dmogaus saugos bendrosios, etnin\u0117s kult\u016bros
  ugdymo, mokyklos pasirinkt\u0173 prevencini\u0173 ir kit\u0173 program\u0173, informacini\u0173
  komunikacini\u0173 technologij\u0173 ugdymo turinys.\\n30. Mokykla, atsi\u017evelgdama
  \u012f mokyklos bendruomen\u0117s, mokini\u0173 ugdymosi poreikius, Bendrojo ugdymo
  plano 40.1.2, 40.1.3 papunk\u010diuose nurodytoms ugdymo programoms \u012fgyvendinti\\n\\ngali
  skirti atskir\u0105 ugdymo laik\u0105 i\u0161 valand\u0173, skirt\u0173 ugdymosi
  poreikiams tenkinti, o etninei kult\u016brai ugdyti \u2013 i\u0161 neformaliojo
  \u0161vietimo valand\u0173.\\n\\nKETVIRTAS SKIRSNIS\\n\\nMOKINI\u0172 PASIEKIM\u0172
  IR PA\u017dANGOS VERTINIMAS\\n\\n31. Mokini\u0173 pasiekimai ir pa\u017eanga vertinami
  vadovaujantis Lietuvos Respublikos \u0161vietimo ir mokslo  ministro  patvirtintais  teis\u0117s  aktais,  reglamentuojan\u010diais  bendrojo  ugdymo  programose
  dalyvaujan\u010di\u0173  mokini\u0173  mokymosi  pasiekim\u0173  vertinim\u0105,  vertinimo  rezultat\u0173  panaudojim\u0105,  ir
  Bendr\u0105ja programa.\\n32. Mokytojas  numato  mokini\u0173  ugdymosi  pasiekimus  ir  vertinim\u0105  vadovaudamasis
  mokykloje  priimtais  susitarimais  d\u0117l  ugdymo  turinio  planavimo  ir  pasiekim\u0173  vertinimo,
  atsi\u017evelgdamas \u012f klas\u0117s mokini\u0173 mokymosi rezultatus, ugdymosi
  poreikius ir galimybes, Truskavos pagrindin\u0117s  mokyklos  mokini\u0173  pasiekim\u0173  ir  pa\u017eangos  vertinimo  bei  fiksavimo  organizavimo
  apra\u0161u, patvirtintu Truskavos pagrindin\u0117s mokyklos direktoriaus 2016 rugpj\u016b\u010dio
  23 d. \u012fsakymu Nr. V \u2013 69,   patvirtintu metodikos tarybos grup\u0117je.\\n33.
  Numatydamas  1 klas\u0117s  mokini\u0173  pasiekimus  ir vertinim\u0105,  mokytojas  susipa\u017e\u012fsta  su
  prie\u0161mokyklinio ugdymo pedagogo ar jungtin\u0117s grup\u0117s ikimokyklinio
  ugdymo aukl\u0117tojo, \u0161vietimo pagalbos specialisto, jeigu buvo teikta pagalba,
  parengtomis rekomendacijomis pradini\u0173 klasi\u0173 mokytojui apie vaiko pasiekimus.
  Planuojant mokini\u0173, pradedan\u010di\u0173 mokytis pagal Pradinio ugdymo program\u0105,
  su pa\u017eangos ir pasiekim\u0173 vertinimu pedagogai  susipa\u017e\u012fsta su
  prie\u0161mokyklinio ugdymo pedagogo parengtomis rekomendacijomis apie vaiko pasiekimus
  (jei mokinys lank\u0117 prie\u0161mokyklin\u0119 grup\u0119).\\n34. 1 - 4 klas\u0117se
  mokini\u0173 pasiekimai fiksuojami atitinkamose Dienyno skiltyse \u012fra\u0161ant
  mokinio  pasiekt\u0105  mokymosi  lyg\u012f  (patenkinamas,  pagrindinis,  auk\u0161tesnysis)  pagal  pasiekim\u0173
  po\u017eymius, apra\u0161ytus Bendrojoje programoje:\\n34.1. pusme\u010dio mokini\u0173
  pa\u017eanga fiksuojama Pradinio ugdymo dienyne, kuris pildomas vadovaujantis dienyno
  paai\u0161kinimais;\\n34.2. pradini\u0173 klasi\u0173 mokini\u0173 pasiekimai ir
  pa\u017eanga  pa\u017eymiais nevertinami.\\n35. Mokini\u0173 t\u0117vai (glob\u0117jai,
  r\u016bpintojai)  informuojami apie mokini\u0173 mokymosi pa\u017eang\u0105 ir pasiekimus
  vadovaudamasi Lietuvos Respublikos asmens duomen\u0173 teisin\u0117s apsaugos \u012fstatymu(\u017din.,
  1996,  Nr.  63-1479;  2008,  Nr.  22-804)  ir  pagal   \u201eT\u0117v\u0173  informavimo  apie  vaik\u0173  pa\u017eang\u0105  ir
  pasiekimus  bei  elges\u012f  ir  lankomum\u0105  tvark\u0105\\\",  patvirtint\u0105  Truskavos  pagrindin\u0117s  mokyklos
  direktoriaus 2016 m. spalio 15d. \u012fsakymu Nr. V \u2013 139a.\\n\\nPENKTAS SKIRSNIS\\n\\nNEFORMALIOJO
  VAIK\u0172 \u0160VIETIMO ORGANIZAVIMAS\\n\\n36. Neformaliojo  vaik\u0173 \u0161vietimo  veikla
  skirta mokini\u0173 asmenin\u0117ms, socialin\u0117ms, edukacin\u0117ms kompetencijoms
  ugdyti per pasirinkt\u0105 menin\u0119, sportin\u0119, technin\u0117s k\u016brybos
  ar kit\u0105 veikl\u0105.\\n37. Neformaliam  \u0161vietimui   1-4 klas\u0117se valand\u0173
  skai\u010dius  per metus  numatomas Bendrojo ugdymo plano 22 punkte. Atsi\u017evelgiant
  \u012f neformaliojo vaik\u0173 \u0161vietimo ypatumus, veikla:\\n37.1. vykdoma  aplinkose,  padedan\u010diose  \u012fgyvendinti  neformaliojo  vaik\u0173  \u0161vietimo
  tikslus.\\n38. Neformaliojo vaik\u0173 \u0161vietimo mokykloje grup\u0117s skai\u010dius
  yra ne ma\u017eiau 7 mokini\u0173.\\n38.1. neformaliojo vaik\u0173 \u0161vietimo
  programos  mokykloje veikla pradedama 2017 m. rugs\u0117jo 18 d.\\n\\n39. De\u0161imt
  ugdymo proceso dien\u0173 per mokslo metus skiriama kult\u016brinei, meninei, pa\u017eintinei,
  k\u016brybinei, sportinei, praktinei, socialinei, prevencinei veiklai. Ji organizuojama
  mokyklos pasirinktu laiku. \u0160ios dienos \u012fskai\u010diuojamos \u012f mokymosi
  dien\u0173 skai\u010di\u0173:\\n\\n\u0160E\u0160TAS SKIRSNIS\\n\\nMOKINIO INDIVIDUALAUS
  UGDYMO PLANO SUDARYMAS\\n\\n40. Norint pad\u0117ti mokiniui s\u0117kmingai mokytis,
  ugdymas gali b\u016bti  individualizuojamas sudarant mokinio individual\u0173 ugdymo
  plan\u0105, kuriuo siekiama pad\u0117ti mokiniui planuoti, kaip pagal savo   i\u0161gales  pasiekti  auk\u0161tesni\u0173  ugdymo(si)  pasiekim\u0173,  ugdyti  asmenin\u0119  atsakomyb\u0119,  d\u0117l
  s\u0105moningo mokymosi geb\u0117jimo \u012fgyvendinti i\u0161sikeltus tikslus.
  Mokykla susitaria d\u0117l individualaus mokinio ugdymo plano sudarymo laikotarpio
  ir formos. Mokinio individualiame ugdymo plane nurodoma sritis, dalykai, d\u0117l
  kuri\u0173 kyla mokymosi sunkum\u0173, j\u0173 prie\u017eastys, numatomi u\u017edaviniai,\\n\\nkaip
  bus \u0161alinami i\u0161kil\u0119 mokymosi sunkumai. Mokinio individualiame ugdymo
  plane apibr\u0117\u017eiami ir s\u0117km\u0117s kriterijai, numatoma pagalba.\\n41.
  Mokinio individualus ugdymo planas rengiamas ir \u012fgyvendinamas bendradarbiaujant
  klas\u0117s vadovui, mokytojams, mokiniams, mokini\u0173 t\u0117vams (glob\u0117jams,
  r\u016bpintojams) ir mokyklos vadovui ar mokyklos vadovo pavaduotojui ugdymui, \u0161vietimo
  pagalbos specialistams.\\n41.1. individualaus ugdymo plano turin\u012f lemia numatomi
  artimiausi ir tolesni mokinio ugdymo(si) tikslai ir b\u016bdai j\u0173 siekti. (Pvz..
  jame numatoma tiksli mokinio veikla gali b\u016bti siejama su mokymosi  poreikiais,  norimo  dalyko  pasiekim\u0173  gerinimu.  Mokinio  prisiimti  \u012fsipareigojimai
  orientuojami \u012f mokymosi pasiekim\u0173 gerinim\u0105.);\\n41.2. individualus
  ugdymo planas sudaromas ra\u0161ytine forma mokslo metams arba ligos laikotarpiui;\\n41.3.
  mokinio individualaus ugdymo plano form\u0105 mokiniui si\u016blo Mokykla .\\n\\nSEPTINTAS
  SKIRSNIS\\n\\nUGDYMO DIFERENCIJAVIMAS\\n\\n42. Ugdymo diferencijavimas \u2013 tai
  ugdymo tiksl\u0173, u\u017edavini\u0173, mokymo ir mokymosi turinio,  metod\u0173,  mokymo(si)  priemoni\u0173,  mokymosi  aplinkos,  vertinimo  pritaikymas  mokini\u0173
  skirtyb\u0117ms. Jo tikslas \u2013 sudaryti s\u0105lygas kiekvienam mokiniui s\u0117kmingiau
  mokytis.\\n43. Mokiniai  skiriasi  turima  patirtimi,  motyvacija,  interesais,  siekiais,  geb\u0117jimais,
  mokymosi stiliumi, pasiekim\u0173 lygiu ir kt., tai lemia skirtingus mokymosi poreikius.
  Diferencijuotu ugdymu atsi\u017evelgiama \u012f \u0161iuos poreikius, pritaikant
  mokiniui mokymosi u\u017edavinius ir u\u017eduotis, ugdymo turin\u012f, metodus,
  mokymo(si) priemones, temp\u0105 ir skiriam\u0105 laik\u0105. Diferencijuotas ugdymas
  taip pat kompensuoja brendimo, mokymosi tempo netolygumus, atsirandan\u010dius mokini\u0173
  am\u017eiumi gr\u012fstoje vertikalaus skirstymo klas\u0117mis sistemoje.\\n44.
  Diferencijavimas bus taikomas:\\n44.1. mokiniui individualiai;\\n44.2. mokini\u0173
  grupei:\\n44.2.1. tam  tikriems  tikslams  pasiekti,  pavyzd\u017eiui:  pasiekim\u0173  skirtumams  ma\u017einti,
  gabumams pl\u0117toti, skirtingoms mokymosi strategijoms \u012fgyvendinti;\\n44.2.2.
  tam  tikroms  veikloms  atlikti  (projektiniai,  tiriamieji  mokini\u0173  darbai,  darbo
  grup\u0117s) grupes galima sudaryti i\u0161 mi\u0161ri\u0173 arba pana\u0161i\u0173
  polinki\u0173, interes\u0173 mokini\u0173.\\n45. Mokini\u0173  perskirstymas  ar  priskyrimas  grupei,  nepa\u017eeid\u017eiantis  j\u0173  priklausymo
  nuolatin\u0117s klas\u0117s bendruomenei, yra laikinas \u2013 tik tam tikro dalyko
  pamokoms arba tik tam tikroms u\u017eduotims  atlikti.  D\u0117l  pergrupavimo  tiksl\u0173  ir  princip\u0173  turi  b\u016bti  tariamasi  su  mokini\u0173  t\u0117vais
  (glob\u0117jais, r\u016bpintojais), jis neturi daryti \u017ealos mokinio savivertei,
  tolesnio mokymosi galimyb\u0117ms bei mokini\u0173 santykiams klas\u0117je ir mokykloje.\\n\\nA\u0160TUNTAS
  SKIRSNIS\\n\\nMOKYMOSI PAGALBOS TEIKIMAS\\n\\n46. Mokini\u0173  pasiekimai  mokykloje  stebimi  ir  analizuojami,  laiku  identifikuojami
  kylantys mokymosi sunkumai. Apie atsiradusius mokymosi sunkumus informuojami mokyklos\\n\u0161vietimo
  pagalbos specialistai, mokinio t\u0117vai (glob\u0117jai, r\u016bpintojai) ir kartu
  tariamasi d\u0117l mokymosi pagalbos suteikimo.\\n47. Mokymosi pagalbos organizavimas
  apr\u0117pia ne tik priimamus sprendimus, bet ir panaudot\u0173 priemoni\u0173 poveikio
  analiz\u0119. Mokymosi pagalba  teikiama laiku ir atitinka mokinio mokymosi galias.
  Mokykloje klas\u0117s vadovas atsakingas u\u017e mokymosi pagalbos organizavim\u0105:\\n47.1.
  mokymosi pagalba pirmiausiai integruojama \u012f mokymo ir mokymosi proces\u0105.
  Mokymosi pagalb\u0105 mokiniui pirmiausia suteikia j\u012f mokantis mokytojas, pritaikydamas
  tinkamas mokymo(si) u\u017eduotis, metodikas ir kt.;\\n47.2. mokymosi  pagalba  gali  b\u016bti  teikiama  skiriant  trumpalaikes  ar  ilgalaikes
  konsultacijas, kuri\u0173 trukm\u0119 nustatys mokykla pagal mokymosi pagalbos poreik\u012f.
  Mokymosi pagalba bus skiriama individualiai arba sudarant mokini\u0173, kuriems
  reikia pana\u0161aus pob\u016bd\u017eio pagalbos, grupes. \u0160ios grup\u0117s
  gal\u0117s b\u016bti sudarytos ir i\u0161 gretim\u0173 klasi\u0173. Mokymosi pagalbai
  teikti gali b\u016bti naudojamos  pamokos,  skirtos  mokinio  ugdymo  poreikiams  tenkinti,  mokymosi  pasiekimams
  gerinti. Konsultacijos skiriamos mokyklos nuo\u017ei\u016bra.\\n48. Pedagogai ir
  \u0161vietimo pagalbos specialistai skiria d\u0117mes\u012f  kiekvieno naujai at\u0117jusio
  mokinio  adaptacijai  mokykloje  \u2013  supa\u017eindinimui  su  mokyklos  aplinka,  formaliomis  ir
  neformaliomis mokyklos gyvenimo taisykl\u0117mis ir reikalavimais.\\n\\nDEVINTAS
  SKIRSNIS\\n\\nMOKYKLOS IR MOKINI\u0172 T\u0116V\u0172 (GLOB\u0116J\u0172, R\u016aPINTOJ\u0172)
  BENDRADARBIAVIMAS\\n\\n49. Mokini\u0173  t\u0117vai  (glob\u0117jai,  r\u016bpintojai)  nuolat  informuojami  apie  mokykloje
  organizuojam\u0105  ugdymo  proces\u0105,  mokymosi  pasiekimus,  mokymo(si)  pagalbos  teikim\u0105,
  elektroniniame dienyne ir pagal  \u201eT\u0117v\u0173 informavimo apie vaik\u0173
  pa\u017eang\u0105 ir pasiekimus bei elges\u012f ir lankomum\u0105 tvark\u0105\\\",
  patvirtint\u0105 Truskavos pagrindin\u0117s mokyklos direktoriaus 2007 m. spalio
  15d. \u012fsakymu Nr. V \u2013 139a.\\n\\nDE\u0160IMTAS SKIRSNIS\\n\\nMOKINI\u0172
  MOKYMOSI KR\u016aVIO REGULIAVIMAS\\n\\n50. Mokyklos direktoriaus pavaduotojas ugdymui:\\n50.1.
  organizuoja ir vykdo mokini\u0173 mokymosi kr\u016bvio bei mokiniams skiriam\u0173
  nam\u0173 darb\u0173 steb\u0117sen\u0105 ir kontrol\u0119;\\n50.2. organizuoja mokytoj\u0173
  bendradarbiavim\u0105 sprend\u017eiant mokini\u0173 mokymosi kr\u016bvio optimizavimo
  klausimus;\\n50.3. u\u017etikrina,  kad  mokiniams  per  dien\u0105  neb\u016bt\u0173  skiriamas  daugiau  kaip  vienas
  kontrolinis darbas. Apie kontrolin\u012f darb\u0105 mokinius b\u016btina informuoti
  ne v\u0117liau kaip prie\u0161 savait\u0119. Nerekomenduojami kontroliniai darbai
  po atostog\u0173 ar \u0161ventini\u0173 dien\u0173.\\n51. Ugdymo  valandos  Ugdymo
  planui  \u012fgyvendinti  paskirstomos  ugdymo dalykams klasei vieneriems metams
  skiriam\u0105 ugdymo valand\u0173 skai\u010di\u0173, i\u0161laikant bendr\u0105
  pradinio ugdymo programos koncentrui (per dvejus metus) skiriam\u0173 ugdymo valand\u0173
  skai\u010di\u0173.\\n52. Mokinys mokyklos vadovo \u012fsakymu gali b\u016bti atleid\u017eiamas:\\n52.1.
  nuo dail\u0117s, muzikos, \u0161okio, k\u016bno kult\u016bros, i\u0161imties  atvejais  \u2013
  ir kit\u0173 dalyk\u0173 pamok\u0173 (ar j\u0173 dalies) lankymo, jei mokosi neformaliojo
  vaik\u0173 \u0161vietimo ir formal\u0173j\u012f \u0161vietim\u0105 papildan\u010dio  ugdymo  mokyklose  pagal  atitinkamas  formal\u0173j\u012f  \u0161vietim\u0105  papildan\u010dio  ugdymo\\n\\nprogramas
  (yra jas baig\u0119s) ar kitas neformaliojo vaik\u0173 \u0161vietimo programas (pvz.,
  informacini\u0173 technologij\u0173, programavimo ir kt.). Sprendimas priimamas
  dalyko, nuo kurio pamok\u0173 mokinys atleid\u017eiamas, mokytojui susipa\u017einus
  su neformaliojo vaik\u0173 \u0161vietimo programomis. \u0160ios programos turi der\u0117ti
  su bendr\u0173j\u0173 program\u0173 turiniu. Mokini\u0173 pasiekimai, gauti neformaliojo
  \u0161vietimo \u012fstaigose, bus \u012fskaitomi \u012f dalyko pusme\u010di\u0173
  rezultatus;\\n\\n52.2. mokinys, atleistas nuo atitinkam\u0173 men\u0173 ar sporto
  srities dalyk\u0173 pamok\u0173, tuo metu gali u\u017esiimti kita veikla arba mokytis
  individualiai. Mokykla u\u017etikrina nuo pamok\u0173 atleist\u0173 mokini\u0173
  saugum\u0105 ir u\u017eimtum\u0105;\\n52.3. per dien\u0105 skiriamos  daugiau kaip
  5 pamokos. Per savait\u0119 \u2013 25 pamokos.\\n\\nVIENUOLIKTAS SKIRSNIS\\n\\nLAIKIN\u0172J\u0172
  GRUPI\u0172 SUDARYMAS, KLASI\u0172 DALIJIMAS\\n\\n53. Mokini\u0173  skai\u010dius  laikinojoje  grup\u0117je  negali  b\u016bti  didesnis,  nei  nustatytas
  did\u017eiausias mokini\u0173 skai\u010dius klas\u0117je.\\n54. Mokyklos ugdymo
  turiniui \u012fgyvendinti klas\u0117 \u012f grupes dalijama arba sudaromos laikinosios
  grup\u0117s dalykams mokyti:\\n54.1. doriniam ugdymui, jeigu tos pa\u010dios klas\u0117s
  mokiniai yra pasirink\u0119 tikyb\u0105 ir etik\u0105;\\n54.2. mokymosi,  \u0161vietimo  pagalbai  teikti,  (pavyzd\u017eiui,  konsultacijoms  ir  pan.),
  panaudojant mokinio ugdymo poreikiams tenkinti ir pasiekimams gerinti skirtas pamokas;\\n54.3.
  mokini\u0173 skai\u010dius laikinojoje grup\u0117je  - ne ma\u017eiau 5 mokiniai.\\n\\nKETVIRTAS
  SKYRIUS\\n\\nMOKINI\u0172, TURIN\u010cI\u0172 SPECIALI\u0172J\u0172 UGDYMOSI POREIKI\u0172
  (I\u0160SKYRUS ATSIRANDAN\u010cIUS D\u0116L I\u0160SKIRTINI\u0172 GABUM\u0172),
  UGDYMO ORGANIZAVIMAS\\n\\nPIRMAS SKIRSNIS\\n\\nBENDROSIOS NUOSTATOS\\n\\n55. Mokykloje  yra  sudaromos  s\u0105lygos  mokiniui,  turin\u010diam  speciali\u0173j\u0173  ugdymosi
  poreiki\u0173,  gauti  kokybi\u0161k\u0105  ir  poreikius  atitinkant\u012f  ugdym\u0105  bei  b\u016btin\u0105  \u0161vietimo  pagalb\u0105.  D\u0117l
  objektyvi\u0173  prie\u017eas\u010di\u0173  negalinti  teikti  ugdymo,  tenkinan\u010dio  mokinio  specialiuosius  ugdymosi
  poreikius, ir b\u016btinos \u0161vietimo pagalbos, mokiniui bus pasi\u016blyta kitokia
  pagalba, padedanti mokytis teis\u0117s akt\u0173 nustatyta tvarka, rasti kit\u0105
  mokykl\u0105, galin\u010di\u0105 tenkinti mokinio specialiuosius ugdymosi poreikius,
  pagalbos ir paslaug\u0173 reikmes ugdymo procese.\\n56. Mokykla mokinio, turin\u010dio
  speciali\u0173j\u0173 ugdymosi poreiki\u0173, ugdym\u0105 organizuoja vadovaudamasi
  Mokini\u0173, turin\u010di\u0173 speciali\u0173j\u0173 ugdymosi poreiki\u0173, ugdymo
  organizavimo tvarkos apra\u0161u, patvirtintu  Lietuvos  Respublikos  \u0161vietimo  ir  mokslo
  ministro  2011 m. rugs\u0117jo  30 d. \u012fsakymu Nr. V-1795 (\u017din.,  2011,
  Nr. 122-5771) ir \u0161io skyriaus  nuostatomis  (jei  \u0161is  skyrius nereglamentuoja,  mokykla  vadovaujasi  kitomis  Bendrojo  ugdymo  plano  nuostatomis,
  nustatan\u010diomis \u0161vietimo program\u0173 \u012fgyvendinim\u0105), ir atsi\u017evelgia
  \u012f:\\n56.1. formaliojo \u0161vietimo program\u0105;\\n56.2. mokymosi form\u0105
  ir mokymo proceso organizavimo b\u016bd\u0105;\\n56.3. \u012f  specialiojo  ugdymo  ir  \u0161vietimo  pagalbos  poreik\u012f  (speciali\u0173j\u0173  ugdymosi\\nporeiki\u0173
  vertinimo i\u0161vadas, pedagogini\u0173 psichologini\u0173 tarnyb\u0173 rekomendacijas);\\n56.4.
  esamas mokyklos galimybes.\\n\\nANTRAS SKIRSNIS\\n\\nMOKINI\u0172, TURIN\u010cI\u0172
  SPECIALI\u0172J\u0172 UGDYMOSI POREIKI\u0172, PA\u017dANGOS IR PASIEKIM\u0172 VERTINIMAS\\n\\n57.
  Mokinio, kuris mokosi pagal bendrojo ugdymo program\u0105, mokymosi pa\u017eanga
  ir pasiekimai  vertinami  pagal  bendrosiose  programose  numatytus  pasiekimus  ir  vadovaujantis
  Bendr\u0173j\u0173 ugdymo plan\u0173 37\u201339 punkt\u0173 nuostatomis ir \u201eTruskavos
  pagrindin\u0117s mokyklos mokini\u0173 pa\u017eangos  ir  pasiekim\u0173  vertinimo  bei  fiksavimo  organizavimo  apra\u0161u\\\",  patvirtintu  Truskavos
  pagrindin\u0117s mokyklos direktoriaus 2016 rugpj\u016b\u010dio 31 d. \u012fsakymu
  Nr. V \u2013 69, patvirtintu mokyklos metodikos gru\u0117je.\\n58. Mokinio,  kuris  mokosi  pagal  bendrojo  ugdymo  dalyk\u0173  pritaikyt\u0105  program\u0105,
  mokymosi pa\u017eanga ir pasiekimai ugdymo procese vertinami pagal \u0161ioje programoje
  numatytus pasiekimus, vertinimo kriterijai aptariami su mokiniu, jo t\u0117vais
  (glob\u0117jais, r\u016bpintojais), \u0161vietimo pagalb\u0105 teikian\u010diais
  specialistais, susitariama, kokiais aspektais bus pritaikomas mokinio pasiekim\u0173
  vertinimas ir pa(si)tikrinim\u0173 b\u016bdai, kaip jie der\u0117s su bendrosiose
  programose numatytais pasiekim\u0173 lygiais.\\n59. D\u0117l mokinio, kuris mokosi
  pagal pagrindinio ugdymo individualizuot\u0105 program\u0105, mokymosi  pasiekim\u0173  vertinimo  (b\u016bd\u0173,  periodi\u0161kumo)  ir  \u012fforminimo  susitariama  mokykloje.
  Susitarimai priimami, atsi\u017evelgus \u012f mokinio galias ir vertinimo suvokim\u0105,
  specialiuosius ugdymosi poreikius, planuojam\u0105 pa\u017eang\u0105, t\u0117v\u0173
  (glob\u0117j\u0173, r\u016bpintoj\u0173) pageidavimus.\\n\\nTRE\u010cIAS SKIRSNIS\\n\\nSPECIALIOSIOS
  PEDAGOGIN\u0116S PAGALBOS MOKINIAMS TEIKIMAS\\n\\n60. Specialiosios pedagogin\u0117s
  ir specialiosios pagalbos paskirtis \u2013 didinti ugdymo veiksmingum\u0105.\\n61.
  Mokykla  speciali\u0105j\u0105  pedagogin\u0119  ir  speciali\u0105j\u0105  pagalb\u0105  mokiniui  teikia,
  vadovaudamasi teis\u0117s aktais ir \u012fgyvendindama pedagogin\u0117s psichologin\u0117s
  tarnybos ar mokyklos vaiko gerov\u0117s komisijos rekomendacijas.\\n62. Specialioji
  pedagogin\u0117 pagalba teikiama:\\n62.1. vadovaujantis  Specialiosios  pedagogin\u0117s  pagalbos  teikimo  tvarkos  apra\u0161u,
  patvirtintu Lietuvos Respublikos \u0161vietimo ir mokslo ministro 2011m. liepos
  8 d. \u012fsakymu Nr.V1228 (\u017din., 2011, Nr. 92-4395);\\n62.2. ugdymo proceso
  metu;\\n62.3. speciali\u0173j\u0173 pratyb\u0173 forma: individualios, pogrup\u0117s
  (2\u20134 mokiniai, logopedas), pagalba pamokos metu.\\n\\nKETVIRTAS SKIRSNIS\\n\\nMOKINI\u0172,
  BESIMOKAN\u010cI\u0172 PAGAL PRADINIO UGDYMO INDIVIDUALIZUOT\u0104 PROGRAM\u0104,
  UGDYMAS\\n\\n63. Mokiniui, besimokan\u010diam pagal pagrindinio ugdymo individualizuot\u0105
  program\u0105, mokyklos ar individualus ugdymo planas sudaromas atsi\u017evelgiant
  \u012f mokinio intelekto sutrikim\u0105 (ne\u017eymus,  vidutinis,  \u017eymus  ar  labai  \u017eymus),  mokymosi  form\u0105,  mokymo  organizavimo  b\u016bd\u0105,
  ugdym\u0105 \u012fgyvendinan\u010dios mokyklos paskirt\u012f.\\n\\n64. Pagrindinio
  ugdymo individualizuota programa rengiama mokiniui atsi\u017evelgiant \u012f mokinio  galias  ir  geb\u0117jimus  ir  vadovaujantis  pedagogin\u0117s  psichologin\u0117s  tarnybos
  rekomendacijomis.\\n\\n_________________________________________\\n\\nSUDERINTA:\\n\\nMokyklos
