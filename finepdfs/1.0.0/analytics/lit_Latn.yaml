  AM, 2019 Lietuvos koordinacij\u0173 sistema LKS-94\"", "\"NUMERI\u0172 PERK\u0116LIMO
  CENTRIN\u0116S DUOMEN\u0172 BAZ\u0116S ADMINISTRAVIMO PASLAUG\u0172 SUTARTIES PRIEDAS
  NR. 7\\n\\nPROBLEM\u0172 PA\u0160ALINIMO IR PASLAUG\u0172 TEIKIMO ATK\u016aRIMO
  TERMINAI\\n\\n1. Problem\u0173 sprendimas ir registravimas\\n\\nProblem\u0173 sprendimui
  ir registravimui, o taip pat serviso organizacijai naudojama lanksti u\u017eklaus\u0173
  d\u0117l s\u0105veikos problem\u0173 valdymo registracijos sistema \u2013 t.y. Pagalbos
  tarnyba (angl. Help Desk). Registruot\u0173 vartotoj\u0173 sistema u\u017etikrina
  problem\u0173 registracijos galimyb\u0119 trimis b\u016bdais:\\n\\n- Naudojantis
  pagalbos sistemos grafine interneto vartotojo s\u0105saja (GUI).\\n- E. pa\u0161tu:
  gavus prane\u0161im\u0105 specialiu elektroniniu adresu, prane\u0161im\u0105 automati\u0161kai
  nagrin\u0117s pagalbos sistema \u201eHelpDesk\\\" ;\\n- Telefonu: sulaukus skambu\u010dio
  telefonu, pagalbos tarnybos darbuotojas vis\u0105 gaut\u0105 informacij\u0105 turi
  rankiniu b\u016bdu suvesti \u012f pagalbos sistem\u0105.\\n\\nAdministratorius u\u017etikrina,
  kad Paslaugos gav\u0117jo prane\u0161imo apie Problem\u0105 gavimas b\u016bt\u0173
  patvirtintas tokiais terminais:\\n\\n- prane\u0161ant problem\u0173 valdymo registracijos
  sistema ar elektroniniu pa\u0161tu - ne v\u0117liau kaip per 1 (vien\u0105) valand\u0105
  nuo prane\u0161imo gavimo;\\n- prane\u0161ant telefonu \u2013 i\u0161 karto pasibaigus
  prane\u0161imui telefonu.\\n\\nProblemos apibr\u0117\u017eimas ir sprendimas priklauso
  nuo jos svarbos laipsnio.\\n\\nAtsi\u017evelgiant \u012f prieinamumo lyg\u012f,
  siekiant\u012f 99,7 %, ir \u012f trump\u0105 problemai i\u0161spr\u0119sti reikaling\u0105
  laik\u0105, yra nustatyta grie\u017eta pagalbos pra\u0161ymo strukt\u016bra. Asmuo,
  teikiantis pra\u0161ym\u0105, turi pateikti \u0161iuos duomenis:\\n\\nskambinant
  telefonu:\\n\\n- skambintojo telefono numer\u012f ir juridinio asmens arba asmeninius
  tapatyb\u0117s duomenis\\n- telefono numer\u012f asmens, kuriam reikia perskambinti\\nskambinant
  telefonu ir visais kitais atvejais:\\n\\n- galim\u0105 problemos pob\u016bd\u012f;\\n-
  asmenin\u012f problemos \u012fvertinim\u0105, \u012fskaitant ir problemos dyd\u012f
  (sunkumo lyg\u012f: kritinis, auk\u0161tas, \u017eemas);\\n- problemos istorijos
