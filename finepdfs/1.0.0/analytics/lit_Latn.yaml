  likidumas, susijusius su finansavimo sumomis.\"", "\"LIETUVOS RESPUBLIKOS SOCIALIN\u0116S
  APSAUGOS IR DARBO MINISTERIJA\\n\\nBiud\u017eetin\u0117 \u012fstaiga, A.Vivulskio
  g. 11, LT-03162 Vilnius,  tel. (8 5) 266 8176, (8 5) 266 8169, faks. (8 5) 266 4209,
  el. p. firstname.lastname@example.org, https://socmin.lrv.lt. Duomenys kaupiami
  ir saugomi Juridini\u0173 asmen\u0173 registre, kodas 1886 03515\\n\\n____________________________________________________________________________________________________\\n\\nSavivaldybi\u0173
  administracijoms Lietuvos savivaldybi\u0173 asociacijai\\n\\nNr.\\n\\nD\u0116L SOCIALINI\u0172
  PASLAUG\u0172 ORGANIZAVIMO KARANTINO METU\\n\\nSocialin\u0117s apsaugos ir darbo
  ministerija (toliau \u2013 ministerija) teikia rekomendacijas savivaldyb\u0117ms,
  kaip organizuoti socialini\u0173 paslaug\u0173 teikim\u0105 Lietuvos Respublikos
  teritorijoje karantino metu.\\n\\nSocialin\u0117s  paslaugos  turi  b\u016bti  teikiamos  vadovaujantis  Lietuvos  Respublikos
  Vyriausyb\u0117s  2020  m.  kovo  14  d.  nutarimu  Nr.  207  \u201eD\u0117l  karantino  Lietuvos  Respublikos
  teritorijoje paskelbimo\\\", taip pat, Vyriausyb\u0117s ir Valstyb\u0117s ekstremalios  situacijos  operacijos
  centro pateiktomis rekomendacijomis. Visa aktuali informacija d\u0117l koronaviruso
  patalpinta adresu http://lrv.lt/lt/aktuali-informacija/informacija-del-naujojo-koronaviruso/svarbiausia-informacija.\\n\\nD\u0117l  paslaug\u0173  namuose  teikimo.  Asmenims,  gaunantiems  integrali\u0105  pagalb\u0105,
  socialin\u0119 glob\u0105 asmens namuose, pagalbos \u012f namus paslaugas, turi
  b\u016bti u\u017etikrintas gyvybi\u0161kai svarbi\u0173  paslaug\u0173  teikimas  tokiu  da\u017enumu,  kad  b\u016bt\u0173  patenkinti  asmens  gyvybiniai  poreikiai:
  suteikiamos sveikatos prie\u017ei\u016bros paslaugos, apr\u016bpinama maistu, medikamentais.\\n\\nRekomenduojama  socialines  paslaugas  teikiantiems  specialistams,  jei  \u012fmanoma,
  klient\u0173 kasdienius poreikius vertinti komunikacin\u0117mis ry\u0161io priemon\u0117mis.
  Teikiant paslaugas, b\u016btina laikytis asmens higienos, naudoti apsaugines priemones
  (vienkartines pir\u0161tines, vienkartines kaukes ir kt.), esant poreikiui, dezinfekuoti
  pavir\u0161ius asmens namuose ir pagal galimybes laikantis 2 metr\u0173 atstumo,
  saugant klient\u0105 ir jo artimuosius nuo tikimyb\u0117s b\u016bti u\u017ekr\u0117stiems
  virusu. Paslaug\u0173 teikimo intensyvum\u0105 si\u016blome derinti telefonu ar
  kitomis nuotolin\u0117mis formomis su paslaugas gaunan\u010diu asmeniu ar jo \u0161eimos
  nariais, pagal galimyb\u0119 retinti vizitus, pvz., nuperkant maisto daugiau.\\n\\nSi\u016blome
  savivaldyb\u0117ms svarstyti galimyb\u0119 teikti paslaug\u0173 namuose gav\u0117jams
  maisto produktus vykdant centralizuot\u0105 produkt\u0173 ar \u0161ilto maisto tiekim\u0105,
  perorganizuoti transport\u0105, kad darbuotojai  kuo  ma\u017eiau  va\u017ein\u0117t\u0173  visuomeniniu  transportu.  Tai  saugot\u0173  socialines  paslaugas
  teikian\u010dius  darbuotojus  nuo  didesn\u0117s  rizikos  u\u017esikr\u0117sti  virusu  prekybos  centruose.  Esant
  darbuotojo ir kliento bendram sutarimui, maisto produktai gali b\u016bti palikti
  prie kliento dur\u0173.\\n\\nD\u0117l socialin\u0117s prie\u017ei\u016bros \u0161eimoms
  teikimo. Socialin\u0117s prie\u017ei\u016bros paslaug\u0173 teikimas socialin\u0119
  rizik\u0105 patirian\u010dioms \u0161eimoms tur\u0117t\u0173 b\u016bti teikiamos
  intensyviau nei \u012fprastai d\u0117l \u0161iuo metu vaikams nustatyto ugdymo proceso
  namuose, ta\u010diau nuotoliniu b\u016bdu. Tam tikrais atvejais ar esant \u012ftarimams  d\u0117l
  padid\u0117jusios  rizikos  (pvz., \u0161eimoje  augan\u010dio  k\u016bdikio) b\u016btina
  periodi\u0161kai teikti paslaugas ir asmens namuose, laikantis auk\u0161\u010diau
  i\u0161vardint\u0173 saugumo priemoni\u0173. Kilus bet kokiam \u012ftarimui d\u0117l
  galimai prie\u0161 vaik\u0105 naudojamo smurto ar kitokio pavojus vaiko fiziniam
  ar psichiniam saugumui, sveikatai ar gyvybei, apie tai b\u016btina nedelsiant informuoti
  policij\u0105.\\n\\nD\u0117l  socialini\u0173  paslaug\u0173  poreikio  vertinimo.
  Karantino  metu  rekomenduojame asmens poreikius socialin\u0117ms paslaugoms pagal
  galimybes vertinti nuotoliniu b\u016bdu, su pa\u010diu asmeniu asmeni\u0161kai arba
  su artimaisiais aptariant individualius asmens pagalbos poreikius ir j\u0173 intensyvum\u0105,
  \u0161eimos nari\u0173, artim\u0173j\u0173 galimybes pasir\u016bpinti asmeniu karantino
  laikotarpiu. Kai kurios  savivaldyb\u0117s  jau  t\u0105  daro, pvz.,  Vilniaus  miesto  Socialin\u0117s  paramos  centras  susisiek\u0117
  telefonu su  visais pagalbos \u012f namus gav\u0117jais ar j\u0173 artimaisiais,
  beveik pus\u0117 j\u0173 sutiko pasir\u016bpinti patys.\\n\\nAsmenims,  kuriais  n\u0117ra
  kam pasir\u016bpinti, turi  b\u016bti suteiktos  gyvybi\u0161kai svarbios paslaugos,
  o socialini\u0173 paslaug\u0173 poreikis gali b\u016bti nustatomas paslaug\u0173
  teikimo metu.\\n\\nD\u0117l  asmens  geb\u0117jim\u0173  priimti  kasdienius  sprendimus  vertinimo.
  Asmens, gyvenan\u010dio bendruomen\u0117je, geb\u0117jim\u0173 priimti kasdienius
  sprendimus vertinim\u0105 rekomenduojame atid\u0117ti iki karantino pabaigos, apie
  tai informuojant teism\u0105.\\n\\nD\u0117l  atvejo  vadybos  organizavimo. Atvejo  vadybos  pos\u0117d\u017eius  karantino  metu
  rekomenduojame  organizuoti  nuotoliniu  b\u016bdu,  u\u017etikrinant  \u0161eimos  galimybes  jungtis  \u012f
  pos\u0117d\u012f nuotoliniu b\u016bdu taip pat.\\n\\nD\u0117l  pagalbos  organizavimo  \u0161eimoms,
  kurios  d\u0117l  savo darbo  specifikos  negali pasir\u016bpinti senyvo am\u017eiaus
  asmeniu ar asmeniu su negalia, kuris karantino metu negali gauti paslaug\u0173  nestacionarioje  socialini\u0173  paslaug\u0173  \u012fstaigoje.  Rekomenduojame  savivaldyb\u0117ms
  organizuoti  socialin\u0117s  prie\u017ei\u016bros  ar  dienos  socialin\u0117s  globos  paslaugas  asmens  namuose,
  pasitelkiant  darbuotojus,  kurie  d\u0117l  karantino  negali  dirbti  nestacionarioje  socialini\u0173  paslaug\u0173
  \u012fstaigoje arba organizuoti toki\u0173 asmen\u0173 prie\u017ei\u016bros grup\u0119,
  u\u017etikrinant tinkam\u0105 viruso prevencij\u0105 asmens higienos priemon\u0117mis,
  da\u017enu patalp\u0173 v\u0117dinimu ir dezinfekcija.\\n\\nTaip  pat  rekomenduojame  savivaldyb\u0117ms  susisiekti  su  savivaldyb\u0117s  teritorijoje
  veikian\u010diomis  nevyriausybin\u0117mis   organizacijomis,  kurios  teikia  paslaugas  \u012fvairioms  klient\u0173
  grup\u0117ms ir dalintis informacija apie asmenis, stokojan\u010dius pagalbos karantino
  metu. Pvz., daugelis \u0161alies organizacij\u0173 kartu su \u201eMaisto banku\\\"
  dienos centruose dalindavo besibaigian\u010dio galiojimo maisto  produktus.  Kadangi  \u201eMaisto  bankas\\\"  veiklos  nenutraukia,  ta\u010diau  nevyriausybin\u0117s
  organizacijos neturi resurs\u0173 maisto davinius pristatyti \u012f klient\u0173
  namus, tod\u0117l reikalingi savanoriai ir pan.\\n\\nD\u0117l  Globos  centr\u0173  veiklos.
  Rekomenduojame  Globos  centr\u0173  darbuotojams organizuoti klientams reikaling\u0173
  b\u016btin\u0173j\u0173 paslaug\u0173 suteikim\u0105 dirbant nuotoliniu b\u016bdu.
  Visa, ne b\u016btinoji pagalba klientams teikiama telefonu ir kitomis ry\u0161io
  priemon\u0117mis da\u017eniau nei \u012fprastai. Planuoti ar jau vykstantys mokymai
  pagal GIMK programos Pagrindin\u0119, Specializuot\u0105, Artim\u0173j\u0173 giminai\u010di\u0173
  ir T\u0119stin\u0119 dalis turi b\u016bti stabdomi ir atitinkamai kei\u010diamos
  mokym\u0173 datos. Tais atvejais, kai yra elektroninio ry\u0161io galimyb\u0117s
  ir Valstyb\u0117s vaiko teisi\u0173 apsaugos ir \u012fvaikinimo tarnybos prie Socialin\u0117s  apsaugos  ir  darbo  ministerijos  atestuoti  asmenys  turi  galimybes  mokymus  vesti
  nuotoliniu b\u016bdu (telekonferencijos  ar naudojant interneto  konferencij\u0173  program\u0173
  b\u016bdu ar kt. priemon\u0117mis), rekomenduojama mokymus pagal GIMK programos
  Specializuot\u0105 ir T\u0119stin\u0119 dalis organizuoti nuotoliniu b\u016bdu.\\n\\nD\u0117l
  speciali\u0173j\u0173  poreiki\u0173  vertinimo. Informuojame,  kad vadovaujantis
  Lietuvos Respublikos  sveikatos  apsaugos  ministro-valstyb\u0117s  lygio  ekstremaliosios  situacijos  valstyb\u0117s
  operacij\u0173 vadovo 2020 m. kovo 16 d. sprendimo Nr. V-387 \u201eD\u0117l sveikatos
  prie\u017ei\u016bros \u012fstaig\u0173 darbo organizavimo paskelbus karantin\u0105
  Lietuvos Respublikos teritorijoje\\\" (toliau \u2013 Sprendimas) 1.3.7 papunk\u010diu,
  asmen\u0173, kurie kreipiasi \u012f Ne\u012fgalumo ir darbingumo nustatymo tarnyb\u0105
  prie Socialin\u0117s apsaugos ir darbo ministerijos  (toliau  \u2013 NDNT) ne\u012fgalumo  ir
  darbingumo  lygi\u0173, speciali\u0173j\u0173 poreiki\u0173 nustatymas vykdomas
  asmeniui nedalyvaujant ir Asmens veiklos ir geb\u0117jimo dalyvauti \u012fvertinimo
  klausimynas (toliau \u2013 Klausimynas) pildomas susisiekus su \u0161iais asmenims
  ar j\u0173 atstovais  telefono  ry\u0161io  priemon\u0117mis  ar  el.  pa\u0161tu.  Vadovaujantis  Sprendimu  savivaldyb\u0117s
  administracijos  paskirti  darbuotojai,  arba  savivaldyb\u0117s  administracijos  direktoriaus  \u012fgalioti
  seni\u016bnijos socialiniai darbuotojai ar socialini\u0173 paslaug\u0173 \u012fstaigos
  socialiniai darbuotojai Asmens veiklos ir geb\u0117jimo dalyvauti \u012fvertinimo
  klausimyn\u0105 (toliau \u2013 Klausimynas) senatv\u0117s pensijos am\u017ei\u0173
  sukakusiems asmenims u\u017epildo susisiek\u0119 su \u0161iais asmenimis, ar j\u0173
  atstovais telefono ry\u0161io priemon\u0117mis ar el. pa\u0161tu. Tuo atveju, jei
  specialieji poreikiai vertinami senatv\u0117s pensijos am\u017ei\u0173 sukakusiam
  asmeniui, gaunan\u010diam paslaugas socialin\u0117s globos \u012fstaigoje, palaikomojo
  gydymo ir slaugos  ligonin\u0117je  ar  asmens  sveikatos  prie\u017ei\u016bros  \u012fstaigoje,  Klausimyn\u0105  u\u017epildyti  pra\u0161ome
  bendradarbiaujant su \u0161i\u0173 \u012fstaig\u0173 socialiniais darbuotojais.\\n\\nTaip  pat  informuojame,  kad  Sprendimo  1.3.8  papunktyje  nustatyta,  kad  jeigu
  asmeniui nustatytas dalinis darbingumas, ne\u012fgalumas, specialieji poreikiai,
  NDNT sprendimas d\u0117l  priimto  dalinio  darbingumo,  ne\u012fgalumo,  speciali\u0173j\u0173  poreiki\u0173  t\u0119siamas  automati\u0161kai  iki
  karantino galiojimo pabaigos ir dar 30 kalendorini\u0173 dien\u0173 jam pasibaigus,
  t. y., asmenys neturi pateikti joki\u0173 dokument\u0173 NDNT, vykti \u012f NDNT
  d\u0117l termino prat\u0119simo taip pat nereikia. NDNT prat\u0119susi  terminus,  apie  savo
  priimtus  sprendimus  informuos  pensij\u0105  ar  i\u0161mok\u0105  mokan\u010dias
  institucijas,  o i\u0161mok\u0105 mokan\u010dios institucijos (savivaldyb\u0117s)  tikslin\u0117s
  kompensacijos mok\u0117jim\u0105 NDNT nurodytais terminais atnaujina (prat\u0119sia)  be
  atskiro asmens, turin\u010dio teis\u0119 gauti tikslin\u0119 kompensacij\u0105,  arba
  j\u0173  \u012fgaliot\u0173 asmen\u0173, sutuoktini\u0173, artim\u0173j\u0173  giminai\u010di\u0173,  socialini\u0173  paslaug\u0173
  \u012fstaigos darbuotoj\u0173 arba neveiksniais tam tikroje srityje pripa\u017eint\u0173
  asmen\u0173, turin\u010di\u0173 teis\u0119 gauti tikslines kompensacijas, glob\u0117j\u0173;
  18 met\u0173 nesukakusi\u0173 asmen\u0173 t\u0117v\u0173 (\u012ft\u0117vi\u0173)
  arba glob\u0117j\u0173 ar r\u016bpintoj\u0173, arba artim\u0173j\u0173 giminai\u010di\u0173,
  arba socialini\u0173 paslaug\u0173 \u012fstaigos darbuotojo pra\u0161ymo ir apie
  tai informuoja \u0161iuos asmenis.  Pra\u0161ome pagal galimybes  apie \u0161\u012f
  Sprendim\u0105 informuoti  savo savivaldybi\u0173 gyventojus.\\n\\nAtkreiptinas  d\u0117mesys,  jog  savivaldyb\u0117se  \u012frengiant  saviizoliacijos  patalpas  tam
  naudojant  buvusi\u0173  socialin\u0117s  globos  \u012fstaig\u0173  patalpas  (pvz.,  vaik\u0173  globos  nam\u0173),  turi  b\u016bti
  u\u017etikrinama, kad jose neb\u016bt\u0173 teikiamos  jokios socialin\u0117s paslaugos:
  tiek stacionarios, tiek ir nestacionarios, taip pat, kad \u0161iose \u012fstaigose
  neb\u016bt\u0173 likusi\u0173 gyventi \u0161i\u0173 \u012fstaig\u0173 paslaug\u0173
  gav\u0117j\u0173.\\n\\nDar  kart\u0105 primename,  kad  bet  koks  kontaktas  turi  b\u016bti  vykdomas  laikantis
  Vyriausyb\u0117s ir Valstyb\u0117s ekstremalios situacijos operacijos centro nurodyt\u0173
  rekomendacij\u0173.\\n\\nD\u0117kojame u\u017e bendradarbiavim\u0105 ir susitelkim\u0105.\\n\\nViceministr\u0117\\n\\nVilma
  Augien\u0117\"", "\"SPECIALIEJI REIKALAVIMAI PAREIGAS EINAN\u010cIAM DARBUOTOJUI\\n\\n3.
  Darbuotojas, einantis \u0161ias pareigas, turi atitikti \u0161iuos specialius reikalavimus:\\n3.1.
  tur\u0117ti ne \u017eemesn\u012f kaip auk\u0161tesn\u012fj\u012f i\u0161silavinim\u0105
  ar special\u0173j\u012f vidurin\u012f i\u0161silavinim\u0105, \u012fgyt\u0105 iki
  1995 met\u0173 socialinio darbo srityje;\\n3.2. b\u016bti susipa\u017ein\u0119s
  ir savo darbe vadovautis Lietuvos Respublikos Konstitucija, Lietuvos Respublikos
  teis\u0117s aktais, reglamentuojan\u010diais vie\u0161\u0105j\u012f administravim\u0105
  ir socialin\u012f darb\u0105;\\n3.3. geb\u0117ti savaranki\u0161kai planuoti ir
  organizuoti savo darb\u0105;\\n\\n;\\n\\n3.4. mok\u0117ti valdyti, kaupti, sisteminti
  ir apibendrinti informacij\u0105\\n3.5. skland\u017eiai d\u0117styti mintis ra\u0161tu
  ir \u017eod\u017eiu.\\n\\n\u0160IAS PAREIGAS EINAN\u010cIO DARBUOTOJO FUNKCIJOS\\n\\n4.
  \u0160ias pareigas einantis darbuotojas vykdo tokias funkcijas:\\n4.1. konsultuoja
  seni\u016bnijos gyventojus ir priima j\u0173 pra\u0161ymus d\u0117l socialini\u0173
  i\u0161mok\u0173 socialini\u0173 paslaug\u0173 skyrimo, speciali\u0173j\u0173 poreiki\u0173
  lygio nustatymo, specialiosios kompensacin\u0117 technikos i\u0161davimo ir kt.
  paramos skyrimo, kuriuos perduoda atitinkamoms institucijoms;\\n\\n,\\n\\ns\\n\\n4.2.
  tikrina reikaling\u0173 dokument\u0173 nuora\u0161\u0173 tikrum\u0105 su originalais
  ir patvirtina juos\\n4.3. lanko vieni\u0161us senyvo am\u017eiaus, ne\u012fgalius
  asmenis su vidutiniais arba dideliais specialiaisiais poreikiais, ne re\u010diau
  kaip kart\u0105 per pusmet\u012f, i\u0161siai\u0161kina jiems b\u016btinos buitin\u0117s
  ir \u016bkin\u0117s pagalbos reikalingum\u0105 (poreik\u012f), imasi priemoni\u0173
  j\u0173 \u012fgyvendinimui, pasitelkiant visuomenei naudingos veiklos atlik\u0117jus;\\n4.4.
  veda socialiai remtin\u0173 asmen\u0173, \u017emoni\u0173 su negalia, daugiavaiki\u0173
  \u0161eim\u0173, vieni\u0161\u0173 senyvo am\u017eiaus \u017emoni\u0173 bei asmen\u0173,
  gr\u012f\u017eusi\u0173 i\u0161 \u012fkalinimo \u012fstaig\u0173, apskait\u0105;\\n4.5.
  ai\u0161kinasi svarbiausias seni\u016bnijos socialines problemas, si\u016blo seni\u016bnui
  j\u0173 sprendimo b\u016bdus;\\n4.6. informuoja, konsultuoja seni\u016bnijos gyventojus
  paramos maisto produktais, drabu\u017eiais, avalyne bei kitos paramos gavimo klausimais,
  organizuoja ir teikia jiems reikiam\u0105 nepinigin\u0119 param\u0105 bei tvarko
  jos apskait\u0105;\\n\\nl\\n\\n4.7. prireikus \u012fvertina atskir\u0173 asmen\u0173
  (\u0161eim\u0173) gyvenimo s\u0105lygas ir teikia si\u016blymus d\u0117 socialin\u0117s
  paramos toms \u0161eimoms (asmenims) reikalingumo bei paramos b\u016bd\u0173;\\n4.8.
  veda asmen\u0173, atliekan\u010di\u0173 visuomenei nauding\u0105 veikl\u0105 ir
  atlikt\u0173 visuomenei nauding\u0173 darb\u0173 apskaitos \u017eurnal\u0105;\\n4.9.
  rengia visuomenei naudingos veiklos atlikimo sutartis, organizuoja ir kontroliuoja
  visuomenei naudingos veiklos atlikim\u0105;\\n4.10. rengia ir teikia Socialin\u0117s
  paramos skyriui prane\u0161im\u0105 apie asmenis atlikusius (neatlikusius) visuomenei
  nauding\u0105 veikl\u0105 nustatyta tvarka;\\n4.11. pagal suinteresuot\u0173 institucij\u0173
  paklausimus analizuoja seni\u016bnijos gyventoj\u0173 materialin\u0119 pad\u0117t\u012f,
  gyvenimo s\u0105lygas, rengia materialini\u0173 ir buities s\u0105lyg\u0173 tyrimo
  aktus bei teikia institucijoms duomenis, i\u0161vadas ir pasi\u016blymus d\u0117l
  socialin\u0117s paramos, socialini\u0173 paslaug\u0173 seni\u016bnijos gyventojams
  skyrimo, globos (r\u016bpybos) nustatymo ir kt. klausimais;\\n4.12. vertina seni\u016bnijoje
  gyvenan\u010di\u0173 \u0161eim\u0173, turin\u010di\u0173 nepilname\u010di\u0173
  vaik\u0173, t\u0117v\u0173 geb\u0117jim\u0105 aukl\u0117ti savo vaikus, renka duomenis
  apie vaik\u0173 neprie\u017ei\u016bros, smurto prie\u0161 vaikus atvejus;\\n4.13.
  priima pra\u0161ymus kompensacinei technikai gauti bei i\u0161dalina ne\u012fgaliesiems;\\n4.14.
  esant b\u016btinumui organizuoja mirusi\u0173 vieni\u0161\u0173 asmen\u0173, likusi\u0173
  be artim\u0173j\u0173 giminai\u010di\u0173 ir globos, laidojim\u0105;\\n4.15. renka
  ir savivaldyb\u0117s administracijos direktoriui teikia duomenis reikalingus mokyklinio
  am\u017eiaus vaik\u0173 apskaitai;\\n4.16. teikia duomenis \u0160ven\u010dioni\u0173
  rajono savivaldyb\u0117s administracijos Kult\u016bros, \u0161vietimo, jaunimo ir
  sporto skyriui apie neaktyvius jaunus \u017emones seni\u016bnijoje;\\n4.17. veda
  darbo laiko apskaitos \u017einiara\u0161\u010dius;\\n4.18. tvarko tarnybinio automobilio
  kelion\u0117s lap\u0173 apskait\u0105;\\n\\n4.19. tvarko gyvenamosios vietos deklaravimo
  duomen\u0173 ir gyvenamosios vietos neturin\u010di\u0173 asmen\u0173 apskait\u0105
  teis\u0117s akt\u0173 nustatyta tvarka. I\u0161duoda ir pasira\u0161o nustatytos
  formos pa\u017eymas apie deklaruot\u0105 gyvenam\u0105j\u0105 viet\u0105 gyventojams.
  Rengia seni\u016bno \u012fsakymus d\u0117l gyvenamosios vietos deklaravimo duomen\u0173
  taisymo, keitimo. Rengia \u0161eimos sud\u0117t\u012f patvirtinan\u010dius dokumentus,
  i\u0161skyrus atvejus, kai tai pagal teis\u0117s aktus turi b\u016bti patvirtinta
  kitais dokumentais;\\n4.20. tvarko seni\u016bnijos darbuotoj\u0173 duomenis programose
  VATARAS ir VATIS;\\n4.21. darbo funkcijoms atlikti turi prieig\u0105 prie \u0161i\u0173
  informacini\u0173 sistem\u0173 ir i\u0161orini\u0173 informacini\u0173 portal\u0173:
  dokument\u0173 valdymo sistema DVS Kontora (naudotojo teis\u0117s) ir Socialin\u0117s
  paramos \u0161eimai informacin\u0117 sistema SPIS (naudotojo teis\u0117s);\\n4.22.
  rengia ir teikia seni\u016bnui ataskaitas apie veikl\u0105 metams pasibaigus iki
  kito m\u0117nesio 15 dienos;\\n4.23. nuolat tikrina vardin\u0119 elektroninio pa\u0161to
  d\u0117\u017eut\u0119 (firstname.lastname@example.org) ir elektroninio pa\u0161to
  d\u0117\u017eut\u0119 (email@example.com);\\n4.24. vykdo kitus nenuolatinio pob\u016bd\u017eio
  seni\u016bnijos seni\u016bno pavedimus;\\n4.25. u\u017etikrina su darbu susijusi\u0173
  duomen\u0173 konfidencialum\u0105 pareigyb\u0117s apra\u0161yme nurodyt\u0173 funkcij\u0173
  vykdymo tikslams.\"", "\"Katalikai pasauly\\n\\nVatikanas. \u2014 Popie\u017eius
  Paulius VI paskelbta Tre\u010dioji pasaulin\u0117s Taikos Diena. Naujose M\u0117tuse
  susilauk\u0117 didelio atsi\u0161vieso pasaulio spaud\u0117je, kuri\u0105 \u012ftraukia
  nauja vyriausyb\u0173 sluoksniuose. Specialiu parei\u0161kimu ir pad\u0117ka paskelb\u0117
  Jungtin\u012f Taut\u0173 generalinis sekretorius U Thant-Savo parei\u0161kim\u0105.
  U Thant i\u0161k\u0117l\u0117 Paulius VI pastangas taikos labui. \u0160i veikla
  eina ranka raukon su Jungtin\u012f Taut\u0173 veikla pastoviai taikai \u012fgyvendinti
  ir vienims konfliktams taut\u0173 tarpe i\u0161spresti.\\n\\nPopie\u017eius Paulius
  VI veikla taikos labui lyg\u0117l aktili\u0173 i\u0161kelia Vatikane gav\u0119 \u012fvairi\u0173
  taut\u0173 vad\u0173 parei\u0161kim\u0173. Italijos prezidentas Saragat nurodo,
  kad popie\u017eiaus taikos siekiama stiprina vis\u0105 ital\u0173 taut\u0105 ir
  teikia tik tautineje, tiek tarptautineje plotmeje. Pagrindinis \u0161ios akcijos
  tikslas yra am\u017eini\u0173 \u017emonijos ir krik\u0161\u010dionyb\u0117s ideali\u0173
  dvasioje \u012fgyvendinti laisve, teisingum\u0105 ir tikr\u0105j\u0105 tiesa bei
  apsaugoti pagrindines \u017emogaus teises ir kult\u016bros vystym\u0105si.\\n\\nPana\u0161ias
  mintis savo sve\u010diams nurodo ir pilieti\u0161kai i\u0161k\u0117l\u0119s Pili\u0173
  rengin\u0117s Alvarado, Bolivijos prezidentas Alfredo Candil Paraguajus prezidentas
  Stroessner, Venezuelos prezidentas Rafa el Caldera, Senegalo ir kit\u0173 Afrikos
  taut\u0173 prezidentai bei \u012fvairi\u0173 pasaulio valstybi\u0173 vyriausyb\u0173
  atstovai, kurie tarpe ir Jugoslavijos ministras pirmininkas Mitja Ribicic.\\n\\nFreiburgas.
  \u2014 Penkiadesimt Sveicarijos katalik\u0173 pasaulie\u010di\u0173 savanori\u0173
  \u0161iuo metu rengiasi vykti \u012f misij\u0173 krastus pad\u0117ti ukiniai besivystan\u010dioms
  tautoms. La Corbi\u00e8re institute ji\u0173 baig\u0117 specialius pastangomis kursus
  technin\u0117 ir dviratin\u0117 galim\u0105 teikti bei pl\u0117tojai susipa\u017eino
  su tu krast\u0173 problemomis.\\n\\nMuenchenas. \u2014 (KNA) Vokietijos katalik\u0173
  Ackermann var do instituto Muenchene paskelbtais duomenimis 1969 met\u0173 gale
  \u010cekoslovakijoje veik\u0117 dar 40 vyr\u0173 ir 55 moter\u0173 vienuolynai,
  tur\u0117j aptle 1,200 vyr\u0173 ir aptle 5,000 moter\u0173 vienuolyn\u0173. Prisiveddint
  met\u0173, tai yra 1950 metais, \u010cekoslovakijoje buvo 3,200 vyr\u0173 ir daugiau
  negu 10,000 moter\u0173 vienuolyn\u0173. Dvi\u0161imt pasauli\u0173 m\u016bs\u0173
  \u010cekoslovakijoje suma\u017e\u0117jimo prie\u017ei\u016br\u0173 \u2014 ra\u0161oma
  Ackermann instituto prane\u0161ime \u2014 ten ka i\u0161k\u0117l\u0117 didi administratyvin\u0173
  suvar\u017eym\u0173.\\n\\nRoma. \u2014 Pagal sen\u0105j\u0105 tradicij\u0105 Kristaus
  gimimo \u0161vent\u0119 \u0161ven\u010diant Romos ukrainie\u010di\u0173 kataliku
  bendruomene. Naujoje ukrainie\u010di\u0173, Klaip\u0117dos bazilikos Mi\u016b\u017ee
  auksio ir \u0161ventei prikalt\u0173 pamokal\u0105 pasak\u0117 ukrainie\u010di\u0173
  arkivyskupas kardinolas Slypyj, ilgus metus kent\u0117j\u0119s Sibiro kal\u0117jimuose
  ir dabar vadovauja laisvojo pasaulio ukrainie\u010di\u0173 dvasiniam gyvenimui.\\n\\nMaskva.
  \u2014 \u0160iuo metu Maskvoje dar veikia 40 ortodoks\u0173 ba\u017eny\u010di\u0173,
  kuriose tam tikromis programis ar regaliai leid\u017eiama laikytis nauj\u0173 id\u0117j\u0173.
  Kai prane\u0161a jugoslavie\u010di\u0173 korespondentas i\u0161 Maskvos, ortodoks\u0173
  ba\u017eny\u010dias Maskvoje administruoja special\u016bs dviejimt\u0117s pasaulie\u010di\u0173
  komitetai, kuriuos grie\u017etai kontroliuoja valstybin\u0117s administracijos atstovai.
  Ypatingai grie\u017etas bausm\u0117s taikomas u\u017e religijos skleidim\u0105 jaunimo
  tarpe.\\n\\nAmerikos R. Kinijos pasikalb\u0117jimai\\n\\nVAR\u0160UVA. \u2014 \u0160iandien
  prasideda Amerikos ir Rytadosios Kinijos pasikalb\u0117jimai. Jie skiriama didel\u0117s
  reik\u0161m\u0117s, ir jie bus ambasadorto lygio. Ypa\u010d svarbu, kad pasikalb\u0117jimai
  bus slapti, ir spauda nedaug k\u0105 gal\u0117s pasiek\u0117ti. Naudos i\u0161 j\u0173
  gali b\u016bti abiem partneriams: kilnama susitrep\u0117 pad\u0117tis j\u0173 derbose
  su sovietais, o Amerikai ir apskritai vakarams irgi naudinga parodyti sovietams,
  jog j\u0117gas galima ir kitai\u0161i\u0161kai i\u0161siba\u0161auoti.\\n\\n\u0160erga
  R. Kinijos premjeras\\n\\nHONG KONG. \u2014 Slaptas radio si\u016bstuvas R. Kinijos
  prez\u0117nas, kad premjeras \u010cu En-lai labai serga, o santykiai tarp komunist\u0173
  partijos pirmininko Mao Tze-tungo ir karo ministerio, Mac iepriud Lin Piao labai
  pablog\u0117jo. Jeigu sergantis \u010cu kaip nors i\u0161 neatsakytys, gali nutr\u016bkti
  abiej\u0173 vad\u0173 ry\u0161iai. Mao Tze-tungo \u017emona \u010cang \u010cing,
  es\u0105 ir daranti, kad tie du vyrai susip\u0117s\u0117.\\n\\nPavergt\u0173j\u0173
  Europos taut\u0173 memorandumas\\n\\nWASHINGTON. \u2014 Pavergt\u0173j\u0173 Europos
  kra\u0161t\u0173 delegacija vadovaujama latvio Alfredo Berzini\u0161k sausio 15
  d. lank\u0117si Valstyb\u0117s departamente ir pakalb\u0117jo su dr. Lisle. Ryt\u0173
  Europos skyriaus direktoriumi. Pasikalb\u0117jimo tema buvo planuojama Europos saugumo
  konferencija, kurios taip nori Maskva. Delegacija \u012fteik\u0117 atitinkam\u0105
  memorandum\u0105, kuriame nusi\u0161vie\u010diamos soviet\u0173 intencijos ir primenamos
  ankstesn\u0117s pana\u0161ios sutartys, kuri\u0173 sovietai sulauk\u0119 kiekvien\u0105
  kart\u0105, kada tas jiems buvo naudinga.\\n\\nLONDONAS. \u2014 Ne\u017einomi asmenys
  sekmedijai m\u0117gino suproginti Karl Markso paminkl\u0105 Highgate kapin\u0117se,
  Londone. Bomba nudras\u0117ke kelias akmens plok\u0161tes, bet paminklo nei\u0161jaud\u0117jo.
  M\u0117gino nupjauti Marksono, pripr\u0119s svastik\u0173 ir kitok\u0173 \u017eenkl\u0173.\\n\\nVandalizmas
  Amerikos mokyklose\\n\\nWASHINGTON. \u2014 \u0160io kra\u0161to mokyklos darosi
  pasalios ir tvirtoves. Kai kuri\u0173 dien\u0117s apvertos spygijotomis torvomis,
  nakt\u012f ap\u0161viet\u0117siamos proektoriai, sargai budi su \u0161unimis, alarmo
  mygtukai sujungti netik su gaisrininkais, bet ir su policijos punktais. Langai kaip
  kaip leid\u017eia apkal\u0117, gele\u017ein\u0117s vartai, kuriuos visada stiklo
  tik vaik\u0161tininkas pakaitalas. Tai vis priemon\u0117s apsaugoti nuo vandal\u0173,
  jais \u012fsibrov\u0117ti, pad\u0117g\u0117j\u0173, da\u017eniausiai tu pa\u017ei\u0173
  mokyklos mokin\u012f.\\n\\nL\u016b\u017edina statistika\\n\\n36 mokykl\u0173 rajonai,
  1967-68 mokslo metais labiausiai nukent\u0117jo nuo vandal\u0173, buvo ap\u0161viet\u0117ti
  ir suvesti \u012f duonynes. Tie 36 rajon\u0173 duonynes n\u0117ra labai \u0161viesios:
  ties metais Chicagos mokyklos padaryti su\u017ealojimai mokes\u010di\u0173 mok\u0117tojams
  vir\u0161ijo 2 milijonus doleri\u0173.\\n\\nNew Yorko mokyklose laikte tu pa\u010diu
  m. m. buvo i\u0161kulti 243,652 langai u\u017e 1,21 mil. doleri\u0173, vagysci\u0173
  ir jau\u0161iam\u0173j\u0173 buvo 2,757, kurie kainavo 1,219,912 dol., o 196 pad\u0117gimai
  at\u0117jo 278,585 doleriu. Los Angeles tur\u0117jo 5,183 incidentus, kurie kainavo
  940,124 dol., Baltimor\u0117 \u2014 747 u\u017e 716,602 dol., Milwauke \u2014 u\u017e
  11,060 u\u017e 406,699 dol. Washington, DC 43,128 dol. \u017ealos ir t. t. Prasijusi\u0173
  met\u0173 duonynas dar nevesti, bet jie dar ma\u017eiau d\u017ei\u016bgina. Tie
  skalai\u010diai palimpiu \u012f kit\u0173 mokykl\u0173, kuriose, kaip atsimenaime,
  vyriausias teismas, gindamas sa\u017ein\u0117s laisvei kiti kraut\u016bnimo, u\u017edraud\u0117
  malda \u012f \u0161v. Ra\u0161to skaitym\u0105. Kai moralinis pagrindas i\u0161sulmaamas
  i\u0161 po koj\u0173 tem\u0173, kuri\u0173 rankose tautos ateitis, vaisiai gali
  b\u016bti laubai kartis.\\n\\nNaudos \u017eem\u0117s palydovus\\n\\nPokalbys Vilniuje,
  be lietuvi\u0173, dalyvavo ir Soviet\u0173 S-sos Ry\u0161i\u0173 ministrojus atstovai
  bei sve\u010diai i\u0161 kit\u0173 respublik\u0173. Igoris Grodnevas de\u0161te
  apie tai, kad \\\"artimiausias metais visose \u0161alyse ry\u0161iaus bas naudojama
  tik kabeli\u0173 \u2014 radijo rel\u0117in\u0117 technika. Lygiaigre\u010diai bus
  vystomi ry\u0161iai per dirbinius \u017dem\u0117s palydovus, daugiausia televizijos
  programoms, ypa\u010d spa\u0142votoms, perduoti.\\\"\\n\\nTai, palyginus su Vakaru
  pasauliu, \\\"naujienos\\\", kuriuos kitur \u012fgyvendintos \u017eymiai anks\u010diau.\\n\\n\u010cia
  pridurtina, kad automatin\u0117s telefon\u0173 stotys Kaune nepriklausomos Lietuvos
  pa\u0161tuoje gyventoj\u0173 buvo naudojamos visai eil\u0117 met\u0173 (automatin\u0117
  stotis Klaip\u0117doje \u012frengta 1935 m., Kauno pa\u0161te \u2014 1936 m.). Jei
  ne keitos okupacijos ir sovietin\u0117 \\\"pa\u017ei\u016bra\\\" \u012f re\u010diau,
  jei ne pirm\u0105j\u012f piln\u0105 automatizacij\u0105 b\u016bty buv\u0119 galima
  skelbti ne 1969 m. pabaigoje, bet bent prie\u0161 20 met\u0173. (Ella)\\n\\nDemonstrantai
  neduoda ramyb\u0117s ir sovietams\\n\\nMASKVA. \u2014 Demonstrant\u0173 draja ima
  varginti jau ir sovietus. Se\u0161tadien\u012f pristatikino du italai universalin\u0117je
  kraujoje, kurie sumazinti vis d\u0117diant\u012f automobil\u0173 susikim\u0161im\u0105
  prie dideli\u0173 centr\u0173, paskui palaikyti kelias tolimojo susisiekimo linijas,
  tokias, kaip ta New Yorko ir Chicago, arba Chicagos ir Los Angeles. Planuoja \u012fsteigt\u012f
  atskir\u0105 korporacij\u0105, kuria federalin\u0117 vald\u017eia at\u0117t\u0173
  su 100 mil. doleri\u0173 \u012fna\u0161u.\\n\\nITALIJOS ambasada ne\u017eino, kur
  dabar yra anie du italai suimi \u0161e\u0161tadien\u012f. Pan\u0117s\u0117s atsikitim\u0105
  spalio m\u0117nes\u012f buvo ir su dviej\u0173 nam\u0173 \u0161k Skandinvijos kra\u0161tu.
  Tada sovietai pasitenkinuoju juos i\u0161vartydami.\\n\\nEUGENE, Oregon. \u2014
  Wayne Moore, buv\u0119s senatorius, perb\u0117g\u0117lis i\u0161 respublikin\u012f
  ir demokrat\u0173 partij\u0173 kaim\u0173 ir atvygim\u0173 kontrol\u0119. Kitokie
  sprendimo kovai su infliacija n\u0117ra.\\n\\nPORT MORESBY, Nauj. Gv\u0117n\u0117ja.
  \u2014 New Britain saloje, kur II pas. karo metu vyko dideli m\u016b\u0161iai su
  japonais, prad\u0117jo veikti Tuluwon ugniaukinis. T\u016bkstantis gyventoj\u0173
  buvo evakuota. Auk\u0173 nebuvo.\\n\\nJezuit\u0173 istorija\\n\\nROMA. \u2014 1894
  metais Romoje prad\u0117ta leisti Jezuit\u0173 vienuolijos veiklos istorija \\\"Monumenta
  Historica\\\". \u0160ios diegomis papildyta \u0161imtmet\u0173 ir \u0161imt\u0173
  pirm\u0173j\u0173 tom\u0173. Jezuit\u0173 veiklos \\\"Monumenta Historica\\\" apima
  87,600 puslapiai ir duoda visus dokumentus nuo pat j\u0117zuit\u0173 vienuoli\u0173
  \u012fsisik\u016brimo. \u0160iame istoriniame rinkinyje randami taip pat visi dokumentai
  apie j\u0117zuit\u0173 veikl\u0105 Lietuvoje.\"", "\"PATVIRTINTA\\n\\nLietuvos Respublikos
  ekonomikos ir inovacij\u0173 ministro\\n\\n2021 m. kovo 29 d. \u012fsakymu Nr. 4-246\\n\\nVIE\u0160OSIOS
  \u012eSTAIGOS VALDYMO KOORDINAVIMO CENTRO 2021 MET\u0172 VEIKLOS PLANAS\\n\\nVALSTYBEI
  PRIKLAUSAN\u010cI\u0172 \u012eMONI\u0172 VALDYMO PROFESIONALUMAS  IR SKAIDRUMAS\\n\\nPAGRINDINIS
  VALSTYB\u0116S VALDOM\u0172 \u012eMONI\u0172 VALDYMO KOMPETENCIJ\u0172 CENTRAS\\n\\nStrateginiai
  tikslai:\\n\\n1. Skatinti gerojo valdymo princip\u0173 diegim\u0105 valstyb\u0117s
  valdom\u0173 \u012fmoni\u0173 valdymo sistemoje, koordinuoti princip\u0173 taikym\u0105
  ir kelti pritaikymo kokyb\u0119; dalytis patirtimi konsultuojant valstybei atstovaujan\u010dias
  institucijas (toliau \u2013 VAI), valstyb\u0117s valdomas \u012fmones (toliau \u2013
  VV\u012e), savivaldyb\u0117s valdomas \u012fmones (toliau \u2013 SV\u012e) ir kitas
  suinteresuot\u0105sias \u0161alis.\\n2. Tinkamai \u012fgyvendinti Europos socialinio
  fondo l\u0117\u0161omis finansuojamus projektus, susijusius su \u017emogi\u0161k\u0173j\u0173
  i\u0161tekli\u0173 pl\u0117tra, steb\u0117sena, prognozavimu bei ekonomikos steb\u0117sena
  ir tyrimais.\\n\\n2021 met\u0173 u\u017edaviniai:\\n\\n1. Didinti VV\u012e kolegiali\u0173
  prie\u017ei\u016bros ir valdymo organ\u0173 nepriklausomum\u0105 ir kompetencijas.\\n2.
  Efektyvinti VV\u012e valdym\u0105.\\n3. Perduoti gerosios valdysenos patirt\u012f
  ir \u017einias SV\u012e ir j\u0173 valdytojams.\\n4. Suteikti galimybes VV\u012e
  (ir pagal srit\u012f kitoms suinteresuotosioms \u0161alims) keistis patirtimi ir
  tobulinti veiklos principus.\\n5. U\u017etikrinti Investicij\u0173 skatinimo ir
  pramon\u0117s pl\u0117tros 2014\u20132020 met\u0173 programos veiksm\u0173 plano
  3 tikslo \u201eApr\u016bpinti Lietuvos versl\u0105 konkurencingais \u017emogi\u0161kaisiais
  i\u0161tekliais\\\" 1.15 veiksmo \u201eU\u017etikrinti darbo rinkos profesin\u0117s
  strukt\u016bros palyginim\u0105 tarptautiniu bei \u0161alies mastu, parengiant i\u0161pl\u0117stin\u0119
  Lietuvos profesij\u0173 klasifikatoriaus versij\u0105, palaikant jos funkcionalum\u0105
  ir pl\u0117tr\u0105\\\" ir 1.18 veiksmo \u201eSukurti darbin\u0117je veikloje \u012fgyjam\u0173
  auk\u0161to meistri\u0161kumo kvalifikacij\u0173 posistem\u0117s model\u012f\\\"
  \u012fgyvendinim\u0105.\\n\\nSiekiami veiklos rezultatai:\\n\\n| Rodiklis | Planuojama
  reik\u0161m\u0117 2021 m. |\\n|---|---|\\n| VV\u012e, kuri\u0173 Gerojo valdymo
  indekso \u012fvertis didesnis nei B+, dalis nuo vis\u0173 \u012fmoni\u0173, proc.
  | 501 |\\n\\nSvarbiausi 2021 m. darbai:\\n\\n1. Pateikti si\u016blym\u0173 d\u0117l
  Nuosavyb\u0117s gairi\u0173 pakeitimo siekiant \u012fgyvendinti veiklos rodikli\u0173
  koncepcij\u0105 (I ketv.).\\n2. Parengti metin\u0119 2020 m. VV\u012e veiklos ataskait\u0105
  (II\u2013III ketv.).\\n3. Parengti metin\u0119 2020 m. SV\u012e veiklos ataskait\u0105
  (II\u2013III ketv.).\\n4. Parengti 2020 m. VV\u012e gerojo valdymo indekso ataskait\u0105
  (I\u2013III ketv.).\\n5. Parengti ir pateikti si\u016blym\u0173 d\u0117l konkre\u010di\u0173
  pelningumo rodikli\u0173, kapitalo strukt\u016bros rodikli\u0173 ir individualios
  dividend\u0173 politikos VV\u012e 2 (I\u2013IV ketv.).\\n6. \u012egyvendinant Europos
  socialinio fondo projekt\u0105 Nr. 09.4.3-ESFA-V-834-03-0001 \u201eMASTER-PRO. Darbin\u0117je
  veikloje \u012fgyjam\u0173 auk\u0161to meistri\u0161kumo kvalifikacij\u0173 posistem\u0117s\\n\\n1
  Nesant \u017eenkli\u0173 indekso metodologijos poky\u010di\u0173.\\n\\n2 Jei priimti
  teis\u0117s aktai, reguliuojantys atitinkam\u0173 rodikli\u0173 (politikos) nustatym\u0105.\\n\\nmodelio
  suk\u016brimas\\\", parengti dokument\u0173 paket\u0105, skirt\u0105 darbdavi\u0173
  asocijuotoms strukt\u016broms, siekian\u010dioms diegti darbin\u0117je veikloje
  \u012fgyjamas auk\u0161to meistri\u0161kumo kvalifikacij\u0173 posistemes (I\u2013
  IV ketv.)\\n\\n7. \u012egyvendinant Europos socialinio fondo projekt\u0105 Nr. 09.4.3-ESFA-V-834-05-0001
  \u201ePROKLAS. Lietuvos profesij\u0173 klasifikatoriaus naujos redakcijos ir i\u0161pl\u0117stin\u0117s
  versijos suk\u016brimas\\\", parengti LPK ir ESCO susiejimo ataskait\u0105, LPK
  naujos redakcijos ir i\u0161pl\u0117stin\u0117s versijos suk\u016brimo koncepcij\u0105
  bei profesij\u0173 tyrimo metodik\u0105 (I\u2013III ketv.).\\n\\nFinansinis planas
  i\u0161 vis\u0173 finansavimo \u0161altini\u0173 \u2013 1 569,3 t\u016bkst. eur\u0173\\n\\n\u017dmogi\u0161kieji
  i\u0161tekliai. Lietuvos Respublikos ekonomikos ir inovacij\u0173 ministro 2019
  m. vasario 14 d. \u012fsakymu Nr. 4-89 \u201eD\u0117l vie\u0161osios \u012fstaigos
  \u201eSteb\u0117senos ir prognozi\u0173 agent\u016bra\\\" strukt\u016bros ir pareigybi\u0173
  s\u0105ra\u0161o patvirtinimo\\\" patvirtinta 14 pareigybi\u0173.\\n\\nVIE\u0160OSIOS
  \u012eSTAIGOS VALDYMO KOORDINAVIMO CENTRO 2021 MET\u0172 VEIKLOS PLANAS PAGAL VEIKSMUS,
  ATSAKINGUS VYKDYTOJUS IR VYKDYMO TERMINUS\\n\\nV\u0161\u012e Valdymo koordinavimo
  centas (toliau \u2013 VKC), vykdydamas 2021 met\u0173 veiklos plane numatytus veiksmus,
  \u012fgyvendina Lietuvos Respublikos ekonomikos ir inovacij\u0173 ministro valdymo
  sri\u010di\u0173 strateginio veiklos plano, patvirtinto Lietuvos Respublikos ekonomikos
  ir inovacij\u0173 ministro 2021 m. kovo 23 d. \u012fsakymu Nr. 4-217 \u201eD\u0117l
  Lietuvos Respublikos ekonomikos ir inovacij\u0173 ministro valdymo sri\u010di\u0173
  2021\u20132023 met\u0173 strateginio veiklos plano patvirtinimo\\\" programos \u201eEkonomikos
  pl\u0117tros ir konkurencingumo didinimas\\\" (kodas 01 05), 3 tikslo 1 u\u017edavinio
  \u201e\u012egyvendinant nustatytas atskir\u0173 veikl\u0173 prioritetines kryptis,
  sudaryti prielaidas ekonomikos pl\u0117trai\\\" 01-05-03-01-26 priemon\u0119 \u201eAtlikti
  valstyb\u0117s valdom\u0173 \u012fmoni\u0173 valdymo koordinavimo centro funkcijas\\\"
