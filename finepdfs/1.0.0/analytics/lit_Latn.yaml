  \u017emogui nuo ma\u017eesn\u012f tapr\u0173 gyvenimo b\u016bd\u0105, o medicinin\u0117ms
  proliaktikos priemon\u0117s (patikros) b\u016bt\u0173 vykdomos pla\u010diai apimant
  tas gyventoj\u0173 grupes, kurioms jos skirtos. \u017dmogaus papilomos viruso (ZPV)
  infekcija yra l\u0117tin\u0117, da\u017eniausiai nepaisireik\u0161ianti jokiais
  simptomais. Veikiant rizikos veiksniams, gali sukelti \u012fvairius paz\u0117d\u017einimus
  ir... | 1 kl. |\\n\\n5,6,7 kl.\\n\\n| III sav. | Tarpautin\u0117 ner\u016bkymo diena.
  Akcija \u201eSveikata geriau gArinti ar gErinti?\u201c | Kiekvienais metais tre\u010diadien\u012f
  ketvirtadien\u012f minima Tarpautin\u0117 ner\u016bkymo diena, kuri d\u017eiaznai
  atkreipia rinkan\u010di\u0173j\u0173 d\u0117mes\u012f kaip galimyb\u0119 atsakyti
  r\u016bkymo savo ir savo arim\u0173j\u0173 sveikatos labui. \u0160oninis d\u0117mesnis
  nerima i\u0161n kelia e. cigare\u010di\u0173 populiarumas, kurios tampa vis patrauklesn\u0117s
  tarp vaik\u0173 ir jaunimo. Atkreipiamas d\u0117mesys, kad e. cigare\u010di\u0173
  degimo metu i\u0161si\u0161ikina med\u017eiag\u0173, kuri\u0173 kiekiai atitinka
  identi\u0161k\u0173j\u0173 ungini\u0173 kiek\u012f tabako cigare\u010di\u0173se
  ir jos nera sveikosnes alternatyva \u201eklasikmen\u0173\u201c cigare\u010diams.
  \u0160is ilgalaikis procesas padidina sergamum\u0105 bei mirtingum\u0105 nuo \u012fvairi\u0173
  lig\u0173, tok\u0173 kaip \u0161irdies nepakankamumas, miokardo infarktas, plau\u010di\u0173
  ir kit\u0173 organ\u0173 onkologiniai susirgimai, le\u00eetines obstruktines kv\u0117pavimo
  sistemos ligos. Tikslas \u2013 ugdyti mokin\u012f savinom\u0119 psichologin\u0119
  atsparum\u0105 aplinkos negilamiems veiksniams, suteikti informacijos apie \u017eal\u0105
  sveikatai. Priemon\u0117s: \u2713 praktinis\u2013teorinis u\u017esi\u0117mimas;
  \u2713 plakatas. | Vis\u0173 am\u017eiaus grupi\u0173 moksleiviai |\\n| IV sav.
  | \u201eKo ne\u017einome apie antimikrobini\u0173 atsparum\u0105?\u201c | Atsparumas
  antibiotikams yra nat\u016bralus rei\u0161kinys, kur\u012f sukelia bakterij\u0173
  gen\u0173 mutacijos. Gaussus ir netinkamas antibiotik\u0173 vartojimas pasparina
  antibiotikams atspari\u0105 bakterij\u0173 atsparum\u0105 ir plitim\u0105, tod\u0117l
  kyta gresm\u0117 visuomen\u0117s sveikatai. Svarku atkreipti mokyklos bendruomen\u0117s
  d\u0117mes\u012f ir didinti vaik\u0173 ir staugusi\u0173j\u0173 supratim\u0105 apie
  teising\u0105 savalauki\u0105 antibiotik\u0173 vartojim\u0105. Tikslas \u2013 suteikti
  \u017eini\u0173 apie teising\u0105 antibiotik\u0173 vartojim\u0105 ir didinti supratim\u0105
  apie mikroorganizm\u0173 atsparum\u0105 antimikrobiniems med\u017eiagoms. Priemon\u0117s:
  \u2713 Akcija\u2013viktoria; \u2713 Stendas *lapkri\u010dio 18 d.\u2013 Europos
  supratimo apie antibiotikus diena. | 8\u2013II g kl. |\\n\\n| IV sav. | Fizinio
  aktyvumo skatinimas | Fizinis aktyvumas \u2013 griau\u010di\u0173 raumen\u0173 sukelti
  judesiai, kuriuos atliekant energijos suvar\u017eojimas yra didesnis negu ramyb\u0117s
  b\u016bsenoje; padid\u0117ta \u0161irdies susitraukimo da\u017enis, parausta veido
  oda, suintensyv\u0117ja kv\u0117pavimas ir prakaitavimas. Moksliniais tyrimais \u012frodyta,
  kad nuolatinis aerobinis fizinis kr\u016bvis suma\u017eina rizik\u0105 susirgti
  kai kuriomis leinimis neinfekciniams ligoms bei pagerina bendr\u0105 savijaut\u0105.
  Tikslas \u2013 u\u017edvyti vaik\u0173 poreiki b\u016bti fiziniai aktyvesniems ir
