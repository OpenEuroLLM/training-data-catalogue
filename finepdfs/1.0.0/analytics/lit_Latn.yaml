  Nera duomen\u0173 apie VGTU orlaivi\u0173 tipus.\\n\\nVALSTYBIN\u0116S \u017dEM\u0116S
  PLOTAI\\n\\nBendra informacija apie valstybin\u0117s \u017eem\u0117s plotus\\nPagal
  Nacionalin\u0117s \u017eem\u0117s tarnybos prie \u017dem\u0117s \u016bkio ministerijos
  (toliau \u2013 Nacionalin\u0117 \u017eem\u0117s tarnyba), kaip visos Lietuvos Respublikos
  valstybin\u0117s \u017eem\u0117s, i\u0161skyrus \u017eem\u0119, kuri \u012fstatym\u0173
  nustatyta tvarka patik\u0117jimo teise perduota kitiem subjektams, patiketines,
  pateiktus duomenis, iki 2020 m. sausio 1 d. Nacionalin\u0117s \u017eem\u0117s tarnybos
  patikejimo teise valdomas valstybin\u0117s \u017eem\u0117s plotas sudar\u0117 apie
  2,17 mln. ha \u017eem\u0117s, i\u0161 kurios NTR jau registruota 1,42 mln. ha \u017eem\u0117s
  (i\u0161 j\u0173 \u2013 175,4 t\u016bkst. ha \u017eem\u0117s \u016bkio paskirties
  \u017eem\u0117s) valstyb\u0117s nuosavyb\u0117s teise, o NTR neregistruota Nacionalin\u0117s
  \u017eem\u0117s tarnybos patikejimo teise valdoma valstybin\u0117 \u017eem\u0117
  sudaro apie 758 t\u016bkst. ha (i\u0161 kurios laisva valstybin\u0117 \u017eem\u0117
  sudaro apie 284 t\u016bkst. ha). 2019 m. beveik tre\u010ddal\u012f viso NTR \u012frengiutoto
  valstybin\u0117s \u017eem\u0117s ploto sudar\u0117 valstybin\u0117 \u017eem\u0117,
  perduota naudotis neatlygintinai (panaudai), ir valstybin\u0117 \u017eem\u0117,
  perduota patikejimo teise kitiem patiketiniams.\\n\\n\u017dem\u0117s \u016bkio ministerija,
  siekdama jai nustatyt\u0173 tiksl\u0173, rengia \u017eem\u0117s reformos, \u017eem\u0117tvarkos,
  geodezijos, kartografijos, nekilnojamojo turto kadastro, \u017eem\u0117s naudojimo
  valstybin\u0117s kontrol\u0117s ir kit\u0173 srity\u010di\u0173 Lietuvos Respublikos
  Vyriausyb\u0117s nutarim\u0173 ir kit\u0173 teis\u0117s akt\u0173 projektus, t.
  y. formuoja valstyb\u0117s politik\u0105 \u017eem\u0117s reformos, \u017eem\u0117tvarkos,
  laisvos valstybin\u0117s \u017eem\u0117s tvarkymo srityse, o valstyb\u0117s politik\u0105
  min\u0117tose srityse \u012fgyvendina Nacionalin\u0117 \u017eem\u0117s tarnyba.\\n\\nNacionalin\u0117s
  \u017eem\u0117s tarnybos duomenimis, nuo \u017eem\u0117s reformos prad\u017eios
  iki 2020 m. sausio 1 d. \u0161alies kaimo vietov\u0117se yra pateikta 787,85 t\u016bkst.
  pilie\u010di\u0173 pra\u0161ym\u0173 atkurti nuosavyb\u0117s teises \u012f 4,02
  mln. ha plot\u0105, o nuosavyb\u0117s teises \u0161alies kaimo vietov\u0117se jau
  atkurtos 783,08 t\u016bkst. pilie\u010di\u0173 \u012f 4,018 t\u016bkst. ha plot\u0105.
  Per 2019 metus Nacionalin\u0117 \u017eem\u0117s tarnyba 1622 pilie\u010diams atk\u016br\u0117
  nuosavyb\u0117s teises \u012f 2808 ha plot\u0105 (primt\u012f 2256 sprendimai d\u0117l
  nuosavyb\u0117s teisi\u0173 atk\u016brimo), taigi, 2020 m. sausio 1 d. duomenimis,
  liko atkurti nuosavyb\u0117s teises 4766 pilie\u010diams \u012f 6554 ha \u017eem\u0117s
  plot\u0105, i\u0161 j\u0173 \u2013 3110 pilie\u010di\u0173 \u012f 4665 ha \u017eem\u0117s
  plot\u0105 negalima atkurti nuosavyb\u0117s teisi\u0173 ir (ar) suprojektuoti \u017eem\u0117s
  sklyp\u0173 d\u0117l pa\u010di\u0173 pilie\u010di\u0173 neveikimo.\\n\\nI\u0161nuomota
  valstybin\u0117 \u017eem\u0117\\nNTR 2019 m. \u012frengiutotas i\u0161nuomotas valstybin\u0117s
  \u017eem\u0117s plotas sudaro 11,6 t\u016bkst. ha ploto, tai yra 52 proc. viso per
  metus \u012frengiutoto valstybin\u0117s \u017eem\u0117s ploto (22,53 t\u016bkst.
  ha). Did\u017eiaja dal\u012f 2019 m. \u012frengiutoto i\u0161nuomo to valstybin\u0117s
  \u017eem\u0117s ploto sudaro valstybin\u0117s \u017eem\u0117s \u016bkio paskirties
  \u017eem\u0117s plotas, t. y. 10,4 t\u016bkst. ha, ir tai yra 89 proc. viso 2019
  m. \u012frengiutoto i\u0161nuomoto valstybin\u0117s \u017eem\u0117s ploto (11,6
  t\u016bkst. ha). NTR 2019 m. \u012frengiutotas i\u0161nuomotas valstybin\u0117s
  kitos paskirties \u017eem\u0117s plotas sudaro 1,35 t\u016bkst. ha ir tai yra 11
  proc. viso 2019 m. \u012frengiutoto i\u0161nuomoto valstybin\u0117s \u017eem\u0117s
  ploto (11,6 t\u016bkst. ha).\\n\\nParduota valstybin\u0117 \u017eem\u0117\\nNTR
  2019 m. \u012frengiutotas parduotas valstybin\u0117s \u017eem\u0117s plotas sudaro
  2,94 t\u016bkst. ha ploto ir tai yra 13 proc. viso 2019 m. \u012frengiutoto valstybin\u0117s
  \u017eem\u0117s ploto (22,53 t\u016bkst. ha). 2019 m. NTR \u012frengiutotas parduotas
  \u017eem\u0117s \u016bkio paskirties \u017eem\u0117s plotas sudaro 1,57 t\u016bkst.
  ha, t. y. 53 proc. viso per metus \u012frengiutoto parduoto valstybin\u0117s \u017eem\u0117s
  ploto (2,94 t\u016bkst. ha), o NTR per metus \u012frengiutotas parduotas kitos paskirties
  \u017eem\u0117s plotas yra 1,1 t\u016bkst. ha, tai sudaro 37 proc. viso per metus
  \u012frengiutoto parduoto valstybin\u0117s \u017eem\u0117s ploto (2,94 t\u016bkst.
  ha).\\n\\nValstybin\u0117s \u017eem\u0117s valdymo, naudojimo ir disponavimo ja
  efektyvumo rodikliai\\n\u017dem\u0117s \u016bkio ministro 2018 m. kovo 16 d. \u012fsakymu
  Nr. 3D-161 \u201eD\u0117l valstybin\u0117s \u017eem\u0117s valdymo, naudojimo ir
  disponavimo ja rodikli\u0173 patvirtinimo\u201c patvirtinti valstybei nuosavyb\u0117s
  teise priklausan\u010dios valstybin\u0117s \u017eem\u0117s valdymo, naudojimo ir
  disponavimo ja efektyvumo rodikliai. Remiantis \u017d\u016aM pateiktais duomenimis,
  \u017eemiau pateikiama apibendrinta informacija apie nustatyt\u0173 efektyvumo rodikli\u0173
  vykdym\u0105 2018 m. ir 2019 m.\\n\\n---\\n\\n25 Remiantis 2020-04-01 LR \u017eem\u0117s
  \u016bkio ministerijos ra\u0161te Nr. 2D-988 (12.141 E) pateikta informacija.\\n\\n|
  Valstybin\u0117s \u017eem\u0117s valdymo, naudojimo ir disponavimo ja efektyvumo
  rodikliai | Normin\u0117 reik\u0161m\u0117 | 2018 m. faktin\u0117 reik\u0161m\u0117
  | 2019 m. faktin\u0117 reik\u0161m\u0117 |\\n|---|---|---|---|\\n| **1. NTR per
  metus \u012fregistruotas i\u0161nuomotas valstybin\u0117s \u017eem\u0117s plotas
  nuo viso per metus \u012fregistruoto valstybin\u0117s \u017eem\u0117s ploto, i\u0161
  kurio:** | | | |\\n| 1.1. i\u0161nuomotas \u017eem\u0117s \u016bkio paskirties \u017eem\u0117s
  plotas | 69 % | 63 % | 89 % |\\n| 1.2. i\u0161nuomotas kitos paskirties \u017eem\u0117s
  plotas | 30 % | 36 % | 11 % |\\n| **2. NTR per metus \u012fregistruotas parduotas
  valstybin\u0117s \u017eem\u0117s plotas nuo viso per metus \u012fregistruoto valstybin\u0117s
  \u017eem\u0117s ploto, i\u0161 kurio:** | | | |\\n| 2.1. parduotas \u017eem\u0117s
  \u016bkio paskirties \u017eem\u0117s plotas | 82 % | 78 % | 53 % |\\n| 2.2. parduotas
  kitos paskirties \u017eem\u0117s plotas | 15 % | 16 % | 37 % |\\n\\n2019 m. vis
  didesnis d\u0117mesys buvo skiriamas valstybin\u0117s \u017eem\u0117s tvarkymui
  ir administravimui \u2013 tai rodo ir \u0161iuo jsakymu patvirtint\u0173 rodikli\u0173,
  susijusi\u0173 su NTR \u012fregistruotu i\u0161nuomotos valstybin\u0117s \u017eem\u0117s
  \u016bkio paskirties \u017eem\u0117s ir parduotos valstybin\u0117s kitos paskirties
  \u017eem\u0117s plot\u0173, padid\u0117jimas, palyginti su 2018 m.\\n\\nAnalizuojant
  valstybin\u0117s \u017eem\u0117s valdymo, naudojimo ir disponavimo ja aspektus,
  taip pat galimus sprendimus d\u0117l valstybin\u0117s \u017eem\u0117s valdymo apim\u010di\u0173,
  i\u0161ry\u0161k\u0117ja vis didesnis valstybin\u0117s \u017eem\u0117s pardavimo
  ir nuomos poreikis, kuriam turi \u012ftakos valstyb\u0117s ekonominiai veiksmai.\\n\\n###
