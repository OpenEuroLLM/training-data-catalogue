  Fusion (RNG)/Metallic | RNG | - | \u20ac 300 |\"", "\"VIE\u0160OSIOS \u012eSTAIGOS
  UTE\u0145OS LIGONIN\u0116S 2015 MET\u0172 VEIKLOS ATASKAITA\\n\\n\u012estaigos vadovas:\\nDirektorius
  Dalius Drunga\\n\\n2016 UTENA\\n\\nVie\u0161oji \u012fstaiga Utenos ligonin\u0117
  \u012frengiota juridini\u0173 asmen\u0173 registre 1997 m. gruod\u017eio 8 d., \u012fstaigos
  kodas 183854143. \u012estaigos steig\u0117jas \u2013 Utenos rajono savivaldyb\u0117.
  \u012estaigos adresas Auk\u0161takalnio g. 3, LT-28151 Utena. Telefonas 8-398-63820,
  faksas 8-398-63820. Elektroninio pa\u0161to adresas firstname.lastname@example.org;
  Interneto tinklapis: www.utenosligonine.lt\\n\\n1. VEIKLOS TIKSLAI, POB\u016aDIS
  IR VEIKLOS REZULTATAI\\n\\nVie\u0161oji \u012fstaiga Utenos ligonin\u0117 yra Lietuvos
  nacionalin\u0117s sveikatos sistemos Utenos rajono savivaldyb\u0117s asmens sveikatos
  prie\u017ei\u016bros regiono lygmens pelno nesiekiantis ribotos civilin\u0117s atsakomyb\u0117s
  vie\u0161asis juridinis asmuo, kurio tikslas \u2013 tenkinti vie\u0161uosius interesus
  vykdant sveikatos prie\u017ei\u016bros veikl\u0105.\\n\\n\u012estaigos steig\u0117jas
  \u2013 Utenos rajono savivaldyb\u0117. Utenos rajono savivaldyb\u0117s taryba \u2013
  steig\u0117jo teises ir pareigas \u012fgyvendinanti institucija.\\n\\n\u012estaigos
  buvein\u0117 \u2013 Auk\u0161takalnio g. 3, LT-28151 Utena.\\n\\nV\u0161\u012e Utenos
  ligonin\u0117s veiklos sritys \u2013 organizuoti ir teikti asmens sveikatos prie\u017ei\u016bros
  paslaugas, kurias teikti teis\u0119 suteikia \u012fstaigai i\u0161duota asmens sveikatos
  prie\u017ei\u016bros licencija.\\n\\nPagrindin\u0117 \u012fstaigos veiklos r\u016b\u0161is
  pagal Ekonomini\u0173 veiklos r\u016b\u0161i\u0173 klasifikatori\u0173, patvirtint\u0105
  Statistikos departamento prie Lietuvos Respublikos Vyriausyb\u0117s generalinio
  direktoriaus 2007 m. spalio 31 d. \u012fsakymu Nr. D\u012e-226 \u201eD\u0117l Ekonomini\u0173
  veiklos r\u016b\u0161i\u0173 klasifikatoriaus patvirtinimo\u201c \u017emoni\u0173
  sveikatos prie\u017ei\u016bros veikla (pagal klasifikatori\u0173 - 86).\\n\\nV\u0161\u012e
  Utenos ligonin\u0117s vadovyb\u0117 ir darbuotojai laikosi nuostatos, kad pacientas
  yra svarbiausias asmuo ir visas vadovyb\u0117s ir medik\u0173 darbas yra skirtas
  paciento sveikatai gerinti. Tod\u0117l V\u0161\u012e Utenos ligonin\u0117s:\\n\\n**Misija**
  \u2013 teikti pacientams mokslu ir pa\u017eangiausiomis technologijomis pagr\u012fstas,
  saugias, kokybi\u0161kas, atitinkan\u010dias pacient\u0173 poreikius ir interesus
  bei j\u0173 l\u016bkes\u010dius sveikatos prie\u017ei\u016bros paslaugas naudojantis
  turimais i\u0161tekliais, atsi\u017evelgiant \u012f steig\u0117jo ir paslaug\u0173
  u\u017esakov\u0173 keliamus teis\u0117tus reikalavimus ir u\u017etikrinant informacijos
  apie pacientus privatum\u0105, pagarb\u0105 ir orum\u0105 santykiuose su pacientais
  bei j\u0173 artimaisiais ir bendraujant tarpusavyje.\\n\\n**Vizija** \u2013 pa\u017eangi,
  atitinkanti XXI am\u017eiaus Europos S\u0105jungos standartus, siekianti sveikatos
  prie\u017ei\u016bros auk\u0161tos kokyb\u0117s, optimal\u0173 s\u0105lyg\u0173 pacientams
  ir darbuotojams, ligonin\u0117.\\n\\nPagrindinis \u012fstaigos veiklos **tikslas**
  yra nustatyta tvarka Lietuvos Respublikos ir u\u017esienio gyventoj\u0173 sveikatos
  stiprinimas ir teikiam\u0173 asmens sveikatos prie\u017ei\u016bros paslaug\u0173
  gerinimas siekiant suma\u017einti sergamum\u0105 ir mirtingum\u0105, teikiant kokybi\u0161kas
  medicinines paslaugas.\\n\\n\u012estaigos veiklos **u\u017edaviniai**: organizuoti
  ir teikti nespecializuotas, specializuotas kvalifikuotas stacionarines ir ambulatorines
  sveikatos prie\u017ei\u016bros paslaugas Utenos rajono, kit\u0173 Lietuvos Respublikos
  vietovi\u0173 gyventojams bei u\u017esienie\u010diams, diegti Europos S\u0105jungos
  asmens sveikatos prie\u017ei\u016bros paslaug\u0173 standartus. Savo tikslams ir
  u\u017edaviniams pasiekti \u012fstaiga organizuoja \u012fstatym\u0173 nedraud\u017eiam\u0105
  \u016bkin\u0119 komercin\u0119 veikl\u0105:\\n\\n- personalo darbo ir poilsio s\u0105lyg\u0173
  gerinimas;\\n- pacient\u0173 sveikatos prie\u017ei\u016bros s\u0105lyg\u0173 gerinimas;\\n\\n-
  konferencij\u0173, seminar\u0173, tobulinimosi kurs\u0173 organizavimas.\\n\\n\u012estaigos
  vidaus organizacin\u0117 valdymo strukt\u016bra pateikiama 1 priede.\\n\\nUtenos
  rajono savivaldyb\u0117s tarybos 2015 m. lapkri\u010dio 26 d. sprendimu Nr. TS-315
  \u201eD\u0117l Vie\u0161osios \u012fstaigos Utenos ligonin\u0117s valdymo strukt\u016bros
  patvirtinimo\u201c patvirtinta nauja Vie\u0161osios \u012fstaigos Utenos ligonin\u0117s
  valdymo strukt\u016bra, kuri \u012fsigalios 2016 m. baland\u017eio 27 d. (2 priedas).\\n\\n\u012estaigos
  veiklos rezultat\u0173 2014-2015 m. rodikli\u0173 poky\u010diai atsispindi 1 lentel\u0117je,
  ta\u010diau vienareik\u0161mi\u0161kai vertinti atskir\u0173 stacionaro rodikli\u0173
  kitimo tendencij\u0173 (ma\u017e\u0117jimo ar did\u0117jimo) negalima, b\u016btina
  sistemi\u0161kai vertinti daugel\u012f rodikli\u0173.\\n\\n1 lentel\u0117. Pagrindiniai
  \u012fstaigos veiklos rezultatai 2014 m. ir 2015 m.\\n\\n| Eil. Nr. | Rodiklis                                                                 |
