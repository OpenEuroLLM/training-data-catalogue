  TARNYBOS FINANSINI\u0172 PASLAUG\u0172 IR RINK\u0172 PRIE\u017dI\u016a\\n\\nROS
  DEPARTAMENTO DIREKTORIUS\\n\\nSPRENDIMAS\\n\\nD\u0116L V. P. IR ERGO INSURANCE SE
  GIN\u010cO NAGRIN\u0116JIMO\\n\\n2018 m. vasario 28 d. Nr. 242-76 Vilnius\\n\\nLietuvos
  bankas gavo V. P.(toliau \u2013 parei\u0161k\u0117jas) kreipim\u0105si, kuriuo parei\u0161k\u0117jas
  pra\u0161\u0117 i\u0161nagrin\u0117ti tarp jo ir ERGO Insurance SE, veikian\u010dios
  Lietuvoje per \u012fsteigt\u0105 filial\u0105, (toliau \u2013 draudikas) kilus\u012f
  gin\u010d\u0105 d\u0117l draudimo i\u0161mokos dyd\u017eio.\\n\\nNustatyta:\\n\\n2016
  m. vasario 17 d. parei\u0161k\u0117jas su draudiku sudar\u0117 transporto priemoni\u0173
  draudimo sutart\u012f (draudimo liudijimas Nr. duomenys neskelbtini) (toliau \u2013
  sutartis), kurios pagrindu nuo 2016 m. vasario 17 d. iki 2017 m. vasario 16 d. buvo
  apdraustas parei\u0161k\u0117jo automobilis \u201eVW Touran\\\" (toliau \u2013 automobilis).
  Draudimo sutartis sudaryta Transporto priemoni\u0173 draudimo taisykli\u0173 Nr.
  30 (2014 m. rugpj\u016b\u010dio 1 d. redakcija) (toliau \u2013 Taisykl\u0117s) pagrindu.\\n\\n2017
  m. sausio 23 d. draudikas gavo parei\u0161k\u0117jo prane\u0161im\u0105 apie 2017
  m. sausio 20 d. \u012fvykus\u012f \u012fvyk\u012f, kurio metu buvo i\u0161dau\u017etas
  automobilio stiklas ir pavogta automobilio \u201emultimedija\\\". Parei\u0161k\u0117jo
  prane\u0161imo apie eismo \u012fvyk\u012f pagrindu draudikas prad\u0117jo \u017ealos
  administravimo proced\u016br\u0105: ap\u017ei\u016br\u0117jo automobil\u012f, apgadinimus
  u\u017efiksavo fotonuotraukose ir 2017 m. sausio 23 d. Transporto priemon\u0117s
  ap\u017ei\u016bros defekt\u0173 akte (toliau \u2013 aktas). Akte parei\u0161k\u0117jas
  nurod\u0117 norintis, kad draudikas apskai\u010diuot\u0173 automobiliui eismo \u012fvykio
  metu padaryt\u0105 \u017eal\u0105.\\n\\n2017 m. vasario 13 d. draudikas sudar\u0117
  automobilio \u017ealos s\u0105mat\u0105 Nr. 523987-001 (toliau \u2013 \u017ealos
  s\u0105mata), apskai\u010diuotas automobilio \u017ealos dydis \u2013 1 060 Eur (be
  PVM). Vadovaudamasis min\u0117ta \u017ealos s\u0105mata, sprendimu draudikas 2017
  m. vasario 22 d. i\u0161mok\u0117jo parei\u0161k\u0117jui 954 Eur draudimo i\u0161mok\u0105
  (i\u0161skai\u010dius 10 proc. i\u0161skait\u0105 d\u0117l vagyst\u0117s).\\n\\nParei\u0161k\u0117jas
  nesutiko su draudiko apskai\u010diuotu \u017ealos dyd\u017eiu ir kreip\u0117si \u012f
  nepriklausom\u0105 turto vertintoj\u0105 UAB \u201eKauno nepriklausom\u0173 autoekspert\u0173
  biuras\\\" d\u0117l \u017ealos automobiliui dyd\u017eio \u012fvertinimo. 2017 m.
  baland\u017eio 12 d. parei\u0161k\u0117jas pateik\u0117 draudikui nepriklausomo
  turto vertintojo UAB \u201eKauno nepriklausom\u0173 autoekspert\u0173 biuras\\\"
  2017 m. baland\u017eio 6 d sudaryt\u0105 Autotransporto priemon\u0117s vertinimo
  ataskait\u0105 Nr. 21710031 (toliau \u2013 Vertinimo ataskaita), kurioje nurodytos
  2 728,01 Eur (be PVM) automobilio remonto i\u0161laidos, \u012fvertinus automobilio
  detali\u0173 nusid\u0117v\u0117jim\u0105. Draudikas atsisak\u0117 vadovautis parei\u0161k\u0117jo
  pateikta Vertinimo ataskaita ir kreip\u0117si \u012f remonto \u012fmon\u0119 UAB
  \u201eAutojuta\\\", kurios 2017 m. baland\u017eio 27 d. pateiktame komerciniame
  pasi\u016blyme automobilio remonto kaina su darb\u0173 atlikimu \u012fvertinta 3
  051,26 Eur be PVM.\\n\\nRemdamasis UAB \u201eAutojuta\\\" pasi\u016blymu, draudikas
  2017 m. gegu\u017e\u0117s 5 d. sprendimu i\u0161mok\u0117jo parei\u0161k\u0117jui
  papildom\u0105 795,88 Eur draudimo i\u0161mok\u0105 (atskai\u010dius 39,5 proc.
  nusid\u0117v\u0117jim\u0105 ir 10 proc. i\u0161skait\u0105 d\u0117l vagyst\u0117s).
  I\u0161 viso draudikas parei\u0161k\u0117jui i\u0161mok\u0117jo 1 749,88 Eur draudimo
  i\u0161mok\u0105 (1 733,51 Eur u\u017e automobilio remont\u0105 ir 16,37 Eur delspinigi\u0173
  (priskai\u010diuot\u0173 nuo 2017 m. vasario 23 d. iki 2017 m. gegu\u017e\u0117s
  3 d.).\\n\\n,\\n\\nParei\u0161k\u0117jas nesutiko su draudiko i\u0161mok\u0117tos
  draudimo i\u0161mokos dyd\u017eiu, tod\u0117l kreipimesi \u012f Lietuvos bank\u0105
  nurod\u0117, kad draudikas nepagr\u012fstai atsisak\u0117 i\u0161mok\u0117ti draudimo
  i\u0161mok\u0105 apskai\u010diuot\u0105 pagal Vertinimo ataskait\u0105, ir pra\u0161\u0117
  draudikui rekomenduoti i\u0161mok\u0117ti papildom\u0105\\n\\n.\\n\\n592,56 Eur
  draudimo i\u0161mok\u0105\\n\\nAtsiliepime \u012f parei\u0161k\u0117jo kreipim\u0105si
  draudikas teig\u0117, kad tarp parei\u0161k\u0117jo ir draudiko sudaryta sutartis
  yra savanori\u0161kojo draudimo sutartis, kurioje sutarties \u0161alys apsibr\u0117\u017e\u0117
  savo teises ir pareigas. Parei\u0161k\u0117jo automobilis buvo apdraustas draudimo
  apsaugos variantu \u201erinkos verte\\\". Taisykli\u0173 7.1.1 papunktyje nustatyta
  draudimo i\u0161mokos mok\u0117jimo tvarka, kai automobilis apdraustas \u201erinkos
  verte\\\": \u201ejei draudimo sutartis sudaryta draudimo \u201erinkos verte\\\"
  draudimo apsaugos variantu, \u017ealos d\u0117l transporto priemon\u0117s sugadinimo,
  kai j\u0105 remontuoti ekonomi\u0161kai tikslinga, atlyginimo dydis nustatomas pagal
  tur\u0117tas remonto i\u0161laidas, b\u016btinas atkurti sugadint\u0105 transporto
  priemon\u0119 ar jos detali\u0173 ir (ar) dali\u0173 rinkos vert\u0119 iki draud\u017eiamojo
  \u012fvykio. Jeigu draud\u0117jas atsisako remontuoti transporto priemon\u0119,
  atlyginamos apskai\u010diuotos b\u016btinos turto remonto i\u0161laidos atkurti
  sugadint\u0105 transporto priemon\u0119 ar jos detali\u0173 ir (ar) dali\u0173 rinkos
  vert\u0119 iki draud\u017eiamojo \u012fvykio. B\u016btinas remonto i\u0161laidas
  sudaro remonto darb\u0173 vert\u0117, da\u017eymo darb\u0173 vert\u0117, kei\u010diam\u0173
  dali\u0173 vert\u0117 (nuvertinant dalis d\u0117l nusid\u0117v\u0117jimo), da\u017eymo
  med\u017eiag\u0173 vert\u0117. B\u016btinos remonto i\u0161laidos apskai\u010diuojamos
  pagal vidutinius darb\u0173 ir kei\u010diam\u0173 detali\u0173 ir (ar) dali\u0173
  \u012fkainius, atitinkan\u010dius technologijos lyg\u012f, vadovaujantis gamyklos
  gamintojos rekomenduojamais laiko normatyvais. Jeigu nustatyta, kad sugadintos detal\u0117s
  ir (ar) dalys gali b\u016bti remontuojamos, bet neprivalo b\u016bti kei\u010diamos,
  remontas turi b\u016bti atliekamas kaip tik \u0161iuo numatytu b\u016bdu. Tuo atveju,
  jei draud\u0117jas atsisako remontuoti savo transporto priemon\u0119 ir nesutinka
  su draudiko apskai\u010diuotomis b\u016btinomis remonto i\u0161laidomis, draudikas
  pateikia draud\u0117jui transporto priemoni\u0173 remonto paslaugas teikian\u010dios
  (-i\u0173) bendrov\u0117s (-i\u0173) konkret\u0173 (-ius) pasi\u016blym\u0105 (-us)
  d\u0117l transporto priemon\u0117s remonto atstatant j\u0105 \u012f toki\u0105 pat
  b\u016bkl\u0119, kokia buvo prie\u0161 \u012fvykstant draud\u017eiamajam \u012fvykiui,
  bei i\u0161moka i\u0161mok\u0105, vadovaujantis min\u0117tu (-ais) konkre\u010diu
  (-ais) remonto pasi\u016blymu (ais).\\\" Draudikas pa\u017eym\u0117jo, kad parei\u0161k\u0117jui
  i\u0161mok\u0117jo tinkamai apskai\u010diuot\u0105 1 749,88 Eur draudimo i\u0161mok\u0105,
  taigi \u012fvykd\u0117 i\u0161 draudimo sutarties kilusias pareigas, ir pra\u0161\u0117
  parei\u0161k\u0117jo reikalavim\u0105 draudikui atmesti kaip nepagr\u012fst\u0105.\\n\\nKonstatuojama:\\n\\nVadovaujantis
  Vartotoj\u0173 ir finans\u0173 rinkos dalyvi\u0173 gin\u010d\u0173 neteisminio sprendimo
  proced\u016bros Lietuvos banke taisykli\u0173, patvirtint\u0173 Lietuvos banko valdybos
  2012 m. sausio 26 d. nutarimu Nr. 03-23 (2016 m. sausio 28 d. redakcija), 45 punktu,
  vartojimo gin\u010dai Lietuvos banke nagrin\u0117jami laikantis rungimosi, gin\u010d\u0173
  nagrin\u0117jimo operatyvumo, koncentracijos, ekonomi\u0161kumo ir bendradarbiavimo
  princip\u0173. Nagrin\u0117damas gin\u010d\u0105 Lietuvos bankas atlieka pateikt\u0173
  \u012frodym\u0173 vertinim\u0105 ir jo pagrindu priimamas sprendimas.\\n\\nAtsi\u017evelgiant
  \u012f gin\u010do \u0161ali\u0173 paai\u0161kinimus ir pateiktus \u012frodymus,
  darytina i\u0161vada, kad \u0161ali\u0173 gin\u010das kilo d\u0117l draudiko atlikto
  automobilio remonto i\u0161laid\u0173 skai\u010diavimo pagr\u012fstumo.\\n\\nDraudimo
  sutartimi viena \u0161alis (draudikas) \u012fsipareigoja u\u017e sutartyje nustatyt\u0105
  draudimo \u012fmok\u0105 (premij\u0105) sumok\u0117ti kitai \u0161aliai (draud\u0117jui)
  arba tre\u010diajam asmeniui, kurio naudai sudaryta sutartis, \u012fstatyme ar draudimo
  sutartyje nustatyt\u0105 draudimo i\u0161mok\u0105, apskai\u010diuot\u0105 \u012fstatyme
  ar draudimo sutartyje nustatyta tvarka, jeigu \u012fvyksta \u012fstatyme ar draudimo
  sutartyje nustatytas draud\u017eiamasis \u012fvykis (Lietuvos Respublikos civilinio
  kodekso 6.987 straipsnis). Taigi, sudarydamas draudimo sutart\u012f, draudikas \u012fsipareigoja,
  atsitikus draud\u017eiamajam \u012fvykiui, i\u0161mok\u0117ti draudimo sutartyje
  nustatyt\u0105 draudimo i\u0161mok\u0105, apskai\u010diuot\u0105 draudimo sutartyje
  nustatyta tvarka.\\n\\nSvarbu pa\u017eym\u0117ti, kad tarp \u0161ali\u0173 sudaryta
  draudimo sutartis yra savanori\u0161ka, tod\u0117l draudikas, vadovaudamasis Civilinio
  kodekso 6.156 straipsnio 1 dalies nuostatomis, tokio pob\u016bd\u017eio sutartyse
  gali savo nuo\u017ei\u016bra pasi\u016blyti s\u0105lygas, susijusias su teikiama
  draudimo apsauga. Nuo pasirinktos draudimo apsaugos priklauso draudikui mokamo atlyginimo
  u\u017e prisiimtus \u012fsipareigojimus, t. y. draudimo \u012fmokos, dydis. Kasacinio
  teismo praktikoje yra nurodyta, kad draudimo sutartimi draudimo objektui teikiama
  draudimo apsauga n\u0117ra absoliuti \u2013 draudikas, prisiimdamas draudimo rizik\u0105,
  nustato draudimo sutartimi suteikiamos draudimo apsaugos ribas (Lietuvos Auk\u0161\u010diausiojo
  Teismo Civilini\u0173 byl\u0173 skyriaus teis\u0117j\u0173 kolegijos 2012 m. kovo
  13 d. nutartis, priimta civilin\u0117je byloje Nr. 3K-3-91/2012; 2009 m. bir\u017eelio
  15 d. nutartis, priimta civilin\u0117je byloje Nr. 3K-3-32/2009; 2013 m. baland\u017eio
  19 d. nutartis, priimta civilin\u0117je byloje Nr.\\n\\n3K-3-215/2013).\\n\\nPa\u017eym\u0117tina,
  kad parei\u0161k\u0117jas, sudarydamas draudimo sutart\u012f, siek\u0117 apsaugoti
  savo turtinius interesus, susijusius su apdrausta transporto priemone, nuo galimos
  \u017ealos, o draudikas \u012fsipareigojo i\u0161mok\u0117ti draudimo i\u0161mok\u0105
  \u012fvykus draud\u017eiamajam \u012fvykiui. Galiojantys teis\u0117s aktai leid\u017eia
  draudikui nustatyti prisiimamos draudimo rizikos ir teikiamos draudimo apsaugos
  ribas \u2013 atvejus, kada mokama draudimo i\u0161moka, kaip apskai\u010diuojama
  draudimo i\u0161moka. Sudarydamas draudimo sutart\u012f draudikas pasi\u016blo s\u0105lygas,
  kurios apibr\u0117\u017eia jo prisiimam\u0105 rizik\u0105, ir pagal tai apskai\u010diuoja
  draudimo \u012fmokos dyd\u012f.\\n\\nAtsi\u017evelgiant \u012f turto draudimo kompensacin\u0119
  paskirt\u012f, pa\u017eym\u0117tina tai, kad asmens patirt\u0105 \u017eal\u0105
  b\u016btina tiksliai \u012fvertinti, siekiant, kad draudiko mokama draudimo i\u0161moka
  atlygint\u0173 tiek, kiek asmuo i\u0161 tikr\u0173j\u0173 prarado. Draudimo teisiniuose
  santykiuose \u012fgyvendinamas Civilinio kodekso 6.251 straipsnyje \u012ftvirtintas
  visi\u0161ko nuostoli\u0173 atlyginimo principas ne tik suteikia nukent\u0117jusiam
  asmeniui teis\u0119 reikalauti visi\u0161ko nuostoli\u0173 atlyginimo, bet ir numato,
  kad asmeniui neturi b\u016bti atlyginama daugiau \u017ealos, nei jis patyr\u0117
  d\u0117l draud\u017eiamojo \u012fvykio. Lietuvos Auk\u0161\u010diausiasis Teismas
  nutartyje civilin\u0117je byloje Nr. 3K-3-44/2015 konstatavo, kad \u017ealos atlyginimas,
  laikantis visi\u0161ko nuostoli\u0173 atlyginimo principo, i\u0161 esm\u0117s rei\u0161kia,
  jog sprend\u017eiant gin\u010d\u0105 d\u0117l \u017ealos atlyginimo privalo b\u016bti
  nustatytas tikrasis \u017ealos dydis, nes, nusta\u010dius ma\u017eesn\u012f u\u017e
  tikruosius nuostolius \u017ealos dyd\u012f, lieka i\u0161 dalies neapgintos nukent\u0117jusio
  asmens teis\u0117s. Kai nustatytas \u017ealos dydis vir\u0161ija tikruosius nuostolius,
  nukent\u0117j\u0119s asmuo nepagr\u012fstai praturt\u0117ja skolininko s\u0105skaita.\\n\\nVertinant
  gin\u010do \u0161ali\u0173 pateiktus \u012frodymus ir aplinkybes, pa\u017eym\u0117tina,
  kad parei\u0161k\u0117jas kreipimesi \u012f Lietuvos bank\u0105 nurod\u0117, kad
  draudiko apskai\u010diuotos draudimo i\u0161mokos nepakanka automobiliui suremontuoti.
  D\u0117l \u0161ios prie\u017easties parei\u0161k\u0117jas Lietuvos banko pra\u0161o
  rekomenduoti draudikui i\u0161mok\u0117ti draudimo i\u0161mok\u0105, apskai\u010diuot\u0105
  vadovaujantis parei\u0161k\u0117jo pateikta Vertinimo ataskaita. Vertinant tai,
  ar draudikui kyla pareiga mok\u0117ti draudimo i\u0161mok\u0105, atlyginan\u010di\u0105
  parei\u0161k\u0117jo d\u0117l automobilio sugadinim\u0173 patirt\u0105 \u017eal\u0105,
  kuri nustatyta pagal Vertinimo ataskaitoje apskai\u010diuotas remonto s\u0105naudas,
  pa\u017eym\u0117tina, kad automobilio \u201eWV Touran\\\" draudimo sutartis buvo
  sudaryta pagal Taisykli\u0173 s\u0105lygas.\\n\\nKaip min\u0117ta, Taisykli\u0173
  7.1.1 papunktyje nustatyta, kad tuo atveju, jei draud\u0117jas atsisako remontuoti
  savo transporto priemon\u0119 ir nesutinka su draudiko apskai\u010diuotomis b\u016btinomis
  remonto i\u0161laidomis, draudikas pateikia draud\u0117jui transporto priemoni\u0173
  remonto paslaugas teikian\u010dios bendrov\u0117s konkret\u0173 pasi\u016blym\u0105
  d\u0117l transporto priemon\u0117s remonto atkurti j\u0105 \u012f toki\u0105 pat
  b\u016bkl\u0119, kokia buvo prie\u0161 \u012fvykstant draud\u017eiamajam \u012fvykiui,
  bei i\u0161moka i\u0161mok\u0105, vadovaudamasis min\u0117tu konkre\u010diu remonto
  pasi\u016blymu.\\n\\nVertinant gin\u010do \u0161ali\u0173 pateiktus \u012frodymus
  matyti, kad draudikas, vadovaudamasis Taisykli\u0173 s\u0105lygomis, atsisak\u0117
  i\u0161mok\u0117ti parei\u0161k\u0117jo patirt\u0105 \u017eal\u0105 kompensuojan\u010di\u0105
  draudimo i\u0161mok\u0105, apskai\u010diuot\u0105 pagal Vertinimo ataskaitoje nustatyt\u0105
  \u017ealos dyd\u012f. Draudikas, nesutikdamas su parei\u0161k\u0117jo nurodytais
  argumentais, jog parei\u0161k\u0117jo patirtas nuostolio dydis privalo b\u016bti
  apskai\u010diuojamas pagal pateikt\u0105 Vertinimo ataskait\u0105, nurod\u0117,
  kad draudimo i\u0161moka buvo apskai\u010diuota pagal draudimo sutarties s\u0105lygas.
  Taisykli\u0173 7.1.1 papunktyje nustatyta, kad jei draud\u0117jas ar draud\u0117jo
  atstovas atsisako remontuoti transporto priemon\u0119 draudiko nurodytose remonto
  dirbtuv\u0117se ir nesutinka su draudiko apskai\u010diuotomis b\u016btinomis remonto
  i\u0161laidomis, nuostolis apskai\u010diuojamas pagal draudiko nurodyt\u0173 remonto
  dirbtuvi\u0173 nustatytus detali\u0173 bei remonto \u012fkainius ir laiko normatyvus.
  Draudiko teigimu, atsi\u017evelgiant \u012f pirmiau min\u0117tas Taisykli\u0173
  nuostatas, parei\u0161k\u0117jui nesutikus su draudiko apskai\u010diuotomis b\u016btinomis
  remonto i\u0161laidomis, \u017ealos dydis buvo apskai\u010diuotas pagal bendradarbiaujan\u010dios
  remonto \u012fmon\u0117s UAB \u201eAutojuta\\\" (oficialus \u201eWolkswagen\\\"
  atstovas Lietuvoje) nustatytas remonto i\u0161laidas.\\n\\nLietuvos banko vertinimu,
  galiojantys teis\u0117s aktai leid\u017eia draudikui nustatyti prisiimamos draudimo
  rizikos ir teikiamos draudimo apsaugos ribas \u2013 atvejus, kada mokama draudimo
  i\u0161moka ir kaip ji apskai\u010diuojama. Nagrin\u0117jamu atveju \u0161alys sudarydamos
  draudimo sutart\u012f susitar\u0117, kad jei draud\u0117jas nesutinka su draudiko
  apskai\u010diuotomis b\u016btinomis remonto\\n\\ni\u0161laidomis, nuostolis apskai\u010diuojamas
  pagal draudiko nurodyt\u0173 remonto dirbtuvi\u0173 nustatytus detali\u0173 bei
  remonto \u012fkainius ir laiko normatyvus. D\u0117l \u0161ios prie\u017easties,
  parei\u0161k\u0117jui nepasirinkus draudimo i\u0161mokos, apskai\u010diuotos pagal
  patirtas sugadinto automobilio remonto i\u0161laidas, mok\u0117jimo b\u016bdo ir
  nesutikus su draudiko apskai\u010diuotu draudimo i\u0161mokos dyd\u017eiu, draudikas,
  vadovaudamasis Taisykli\u0173 nuostatomis, pagr\u012fstai nuostol\u012f apskai\u010diavo
  pagal bendradarbiaujan\u010dios remonto \u012fmon\u0117s rinkoje vyraujan\u010dius
  remonto darb\u0173 \u012fkainius. Taigi, apibendrinus gin\u010do \u0161ali\u0173
  pateiktus dokumentus ir paai\u0161kinimus, remiantis reik\u0161ming\u0173 aplinkybi\u0173
  ir turim\u0173 faktini\u0173 duomen\u0173 visuma, darytina i\u0161vada, kad parei\u0161k\u0117jo
  pateikti argumentai, kad draudikas netinkamai apskai\u010diavo parei\u0161k\u0117jo
  patirt\u0105 nuostol\u012f, o draudimo i\u0161moka turi b\u016bti i\u0161mok\u0117ta,
  atsi\u017evelgiant \u012f Vertinimo ataskaitoje pateiktus duomenis, yra vertintini
  kriti\u0161kai.\\n\\nApibendrinant nustatytas aplinkybes ir vadovaujantis gin\u010do
  \u0161ali\u0173 pateikt\u0173 \u012frodym\u0173 visuma bei draudimo sutarties nuostatomis,
  \u012ftvirtinan\u010diomis draudimo i\u0161mokos apskai\u010diavimo, kai d\u0117l
  draud\u017eiamojo \u012fvykio sugadinta transporto priemon\u0117 n\u0117ra remontuojama,
  s\u0105lygas, konstatuotina, kad draudiko apskai\u010diuotas draudimo i\u0161mokos,
  atlyginan\u010dios \u017eal\u0105 d\u0117l parei\u0161k\u0117jo automobilio sugadinimo,
  dydis yra pagr\u012fstas ir atitinkantis draudimo sutarties \u0161ali\u0173 nustatytas
  draudimo sutarties s\u0105lygas. Atsi\u017evelgiant \u012f tai darytina i\u0161vada,
  kad parei\u0161k\u0117jo reikalavimas perskai\u010diuoti nuostolio dyd\u012f pagal
  pateikt\u0105 nepriklausomo turto Vertinimo ataskait\u0105 yra nepagr\u012fstas,
  tod\u0117l atmestinas.\\n\\nRemdamasis tuo, kas i\u0161d\u0117styta, ir vadovaudamasis
  Lietuvos Respublikos vartotoj\u0173 teisi\u0173 apsaugos \u012fstatymo 27 straipsnio
  1 dalies 3 punktu, Lietuvos banko valdybos 2012 m. sausio 26 d. nutarimo Nr. 03-23
  \u201eD\u0117l Vartotoj\u0173 ir finans\u0173 rinkos dalyvi\u0173 gin\u010d\u0173
  neteisminio sprendimo proced\u016bros Lietuvos banke taisykli\u0173 patvirtinimo\\\"
  2 punktu ir \u0161iuo nutarimu patvirtint\u0173 Vartotoj\u0173 ir finans\u0173 rinkos
  dalyvi\u0173 gin\u010d\u0173 neteisminio sprendimo proced\u016bros Lietuvos banke
  taisykli\u0173 59.3 papunk\u010diu, n u s p r e n d \u017e i u:\\n\\nAtmesti parei\u0161k\u0117jo
  V. P. reikalavim\u0105.\\n\\nLietuvos banko sprendimas d\u0117l gin\u010do esm\u0117s
  yra rekomendacinio pob\u016bd\u017eio ir teismui neskund\u017eiamas. Vartotojui
  ir finans\u0173 rinkos dalyviui i\u0161lieka teis\u0117 d\u0117l gin\u010do sprendimo
  kreiptis \u012f teism\u0105 arba kit\u0105 gin\u010d\u0173 nagrin\u0117jimo institucij\u0105
  \u012fstatym\u0173 nustatyta tvarka. Kreipimasis \u012f teism\u0105 po Lietuvos
  banko sprendimo d\u0117l gin\u010do esm\u0117s pri\u0117mimo nelaikomas \u0161io
  sprendimo apskundimu.\\n\\nDirektorius\\n\\nMindaugas \u0160al\u010dius\"", "\"GELMI\u0172
