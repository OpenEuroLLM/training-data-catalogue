  II.     | TENKANTIS MAZUMOS DALIAI |              |                          |                                 |\\n\\nDirektor\u0117\\n(vie\u0161ojo
  sektoriaus subjekto vadovas arba jo \u012fgaliotas administracijos vadovas) Marija
  Mork\u016bnien\u0117\\n(parai\u0161a) (vardas ir pavard\u0117)\\n\\nSavivaldyb\u0117s
  \u012fstaig\u0173 buhalterin\u0117s apskaitos tarnybos ved\u0117ja\\n(vyriausiasis
  buhalteris (buhalteris)) Virginija Slavinskien\u0117\\n(vardas) (vardinis ir pavard\u0117)\\n\\nVyr.
  buhalter\u0117\\n\\nMonika \u017durauskait\u0117\\n\\nI. BENDROJI DALIS\\n\\n1.
  Kupi\u0161kio rajono Suba\u010diaus vaik\u0173 lop\u0161elis dar\u017eelis (toliau
  \u2013 \u012fstaiga) yra Kupi\u0161kio rajono savivaldyb\u0117s biud\u017eetin\u0117
  \u012fstaiga, Valstyb\u0117s \u012fmon\u0117s Registru centro Panev\u0117\u017eio
  filiale \u012fregistruota 1995 m. bir\u017eelio 02 d. \u012estaigos kodas \u2013
  190042135. \u012estaigos adresas \u2013 Kupi\u0161kio raj. Suba\u010dius, Auk\u0161tai\u010di\u0173
  a.11.\\n\\n2. Kupi\u0161kio rajono Suba\u010diaus vaik\u0173 lop\u0161elis dar\u017eelis
  - juridinis asmuo, turintis \u016bkin\u012f, finansin\u012f ir teisin\u012f savaranki\u0161kum\u0105,
  savo antspaud\u0105 ir s\u0105skaitas bankuose. Dar\u017eelio steig\u0117jo funkcijas
  vykdo Kupi\u0161kio rajono savivaldyb\u0117s taryba, \u012fstaigos veikla - ikimokyklinis
  ugdymas. Vidutinis darbuotoj\u0173 skai\u010dius per ataskaitin\u012f laikotarp\u012f
  12 \u017emoni\u0173.\\n\\n3. Kupi\u0161kio rajono Suba\u010diaus vaik\u0173 lop\u0161elis
  dar\u017eelis neturi kontroliuojam\u0173 ir asocijuot\u0173j\u0173 subjekt\u0173,
  filial\u0173 ir kit\u0173 strukt\u016brini\u0173 padalini\u0173.\\n\\n4. Svarbi\u0173
  s\u0105lyg\u0173 ir aplinkybi\u0173, kurioms esant veikia Kupi\u0161kio rajono Suba\u010diaus
  vaik\u0173 lop\u0161elis dar\u017eelis ir kurios gal\u0117t\u0173 paveikti \u012fstaigos
  tolesn\u0119 veikl\u0105, n\u0117ra.\\n\\nII. APSKAITOS POLITIKA\\n\\n5. 2016 m.
  II ket. Finansin\u0117s ataskaitos parengtos pagal vie\u0161ojo sektoriaus apskaitos
  ir finansin\u0117s atskaitomyb\u0117s standartus.\\n\\n6. Apskaitos politika pateikta
  prie 2015 met\u0173 finansini\u0173 ataskait\u0173 rinkinio.\\n\\nIII. PASTABOS\\n\\n7.
  Kupi\u0161kio rajono Suba\u010diaus vaik\u0173 lop\u0161eliui dar\u017eeliui n\u0117ra
  numatyt\u0105 restrukt\u016brizavimo, veiklos nutraukim\u0105 \u2013 nenumatomas.\\n\\n8.
  \u012estaiga neapibr\u0117\u017et\u0173 \u012fsipareigojim\u0173, neapibr\u0117\u017etojo
  turto poky\u010di\u0173, sprendim\u0173 d\u0117l teisini\u0173 gin\u010d\u0173 nuo
  ataskaitini\u0173 finansini\u0173 met\u0173 prad\u017eios iki paskutin\u0117s tarpinio
  ataskaitinio laikotarpio dienos netur\u0117jo, reik\u0161ming\u0173 \u012fvyki\u0173
  po paskutin\u0117s tarpinio ataskaitinio laikotarpio dienos neivyko.\\n\\n9. Finansavimo
  sum\u0173 detalizavimas pateikiamas pagal 20-ojo VSAFAS \u201eFinansavimo sumos\u201c
