  pokytis: 97\\n  - Perimamas centralizuotai valdyti plotas met\u0173 prad\u017eioje:
  244\\n\\n- **2019 m.**\\n  - Centralizuotai valdyti perimto AVNT pokytis: 341\\n  -
  Perimamas centralizuotai valdyti plotas met\u0173 prad\u017eioje: 244\\n\\n- **2020
  m.**\\n  - Centralizuotai valdyti perimto AVNT pokytis: 585\\n  - Perimamas centralizuotai
  valdyti plotas met\u0173 prad\u017eioje: 137\\n\\n- **Fakti\u0161kai perimtas centralizuotai
  valdyti AVNT (FM ir jai pavald\u017eios institucijos, EIM, EM, \u017dUM ir kt.)**:
  13,4 %\\n- **Objektai, patenkantys \u012f vie\u0161\u0173j\u0173 pastat\u0173 atnaujinimo
  (modernizavimo) programos apimtis**: 47,2 %\\n- **SM, KM, \u0160MSM, SADM, TM valdomas
  AVNT**: 81,1 %\\n- **Visas lik\u0119s perduotinas centralizuotai valdyti AVNT**:
  100 %\\n\\nJ\u012f \u0161\u012f skai\u010di\u0173 patenka ne tik etapais perimtas,
  bet ir kitais pagrindais perimtas VNT.\\n\\n2.2. V\u012e Turto banko valdomo AVNT
  portfelio ap\u017evalga\\n\\n2019 m. pabaigoje V\u012e Turto bankas visoje Lietuvoje
  patik\u0117jimo teise vald\u0117 apie 2 000 administracin\u0117s paskirties turto
