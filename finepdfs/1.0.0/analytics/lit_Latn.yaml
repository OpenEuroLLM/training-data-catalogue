  7 pam. 4 kl.- Antradienis Ketvirtadienis 7 pam. |\"", "\"Triuk\u0161m\u0105 slopinanti
  nuotek\u0173 sistema\\n\\nNaujiena: SiTech+\\n\\nVamzd\u017ei\u0173 ir jungiam\u0173j\u0173
  dali\u0173 tankis bei svoris tiesiogiai daro \u012ftak\u0105 nuotek\u0173 sistemos
  akustin\u0117ms charakteristikoms. D\u0117l didelio tankio bei daugiafunkcin\u0117s
  sienel\u0117s strukt\u016bros Wavin SiTech+ nuo\u0161ato naujus auk\u0161tesnius
  standartus triuk\u0161m\u0105 slopinan\u010dioms nuotek\u0173 sistemoms. Sistema
  puikiai tinka montuoti triuk\u0161mui jautriose aplinkose, tokiose kaip: vie\u0161bu\u010diai,
  ofissai, ligonin\u0117s, slaugos namai ar gyvenamosios erdv\u0117s tiek vykdant
  didel\u0117s apmities projektus, tiek ir smulkius renovacinius darbus. Naujov\u0117ski
  gamint\u0173 dizaino sprendimai nuo \u0161iol montavim\u0105 padar\u0117 dar patogesn\u012f
  ir sunkiai pasiekiamose vietose.\\n\\n**Briaunuotos movin\u0117s dalys**\\nGamini\u0173
  movin\u0117s dalys turi briaun\u0117les i\u0161or\u0117je, leid\u017eian\u010dias
  tvirtieliu suimiti bei lengvai sumontuoti sistemos elementus net esant sud\u0117tingoms
  montavimo s\u0105lygoms.\\n\\n**Tikslus kampinis pozicijavimas**\\nJungiamosios
  dalys turi 15\u00b0 ir 45\u00b0 interval\u0173 \u017eym\u0117jimus, leid\u017eian\u010dius
  greitai ir tiksliai pasukti jas reikalingu kampu.\\n\\n**Vizualin\u0117 sujungimo
  kontrol\u0117**\\nJungiamosios dalys turi pilno sujungimo kontrol\u0117s \u017eym\u0119.
  Tai leid\u017eia lengvai vizualiai i\u0161sikrinti ar gaminiai yra pilnai sujungti
  tarpusavyje, net ir atliktus 10 mm vamzd\u017ei\u0173 patraukim\u0105 po sujungimo
  atgal, reikaling\u0105 d\u0117l vamzdyno \u0161ilumini\u0173 poslinki\u0173.\\n\\n**Juoda
  spalva**\\nJuoda SiTech+ gamini\u0173 spalva prailgina sistemos ilgaam\u017ei\u0161kum\u0105.
  Matinis juodas pavir\u0161ius pagerina apsauga nuo UV spinduli\u0173, ypa\u010d
  taip atvejais, kai gaminiai sandeliuojami lauke. Ma\u017ea to, matinis juodas pavir\u0161ius
  yra ma\u017eiau jautrus purvui.\\n\\n---\\n\\n**Charakteristika**\\n\\n| Reik\u0161m\u0117
