  III sav. | Akcija \u201eNeu\u017ei\u016br\u0117k stiklin\u0117s vandens\u201c |
  Kovo 22 d. visame pasaulyje minima Pasaulin\u0117 vandens diena, kuriuos tikslas
  \u2013 aktrupi\u0173 d\u0117mes\u012f \u012f vanden\u0173 svarb\u0105 \u017emonijai
  ir j\u0105 supan\u010diai aplinkai. Vanden\u0173 svarba nenugri\u017eiama, ji susijusi
  su \u017emogaus la\u0161eli\u0173 gyvybingumu, med\u017eiag\u0173 apykaita, maistini\u0173
  med\u017eiag\u0173 perne\u0161imu, k\u016bno temperat\u016bros reguliavimu ir \u0161alinimo
  funkcijomis. Remiantis Pasaulin\u0117s sveikatos organizacijos (PSO) rekomendacijomis,
  vidurin\u0117skaip per dien\u0105 reikia i\u0161gerti apie 30 ml/1 kg k\u016bno
  mas\u0117s. Jei vaikas sveria, pavyzd\u017eiui, 20 kg, jis turet\u0173 per dien\u0105
  i\u0161gerti ir\u0161is stiklin\u0117s vandens.\\n\\nTikslas: Aktrupi\u0173 d\u0117mes\u012f
  \u012f tai, kad vanduo kaip ir oras, yra pagrindinis gyvyb\u0117s ir geros sveikatos
  \u0161altinis.\\n\\nPrienon\u0117:\\n\u2713 vandenis stotel\u0117 kur vaikai gali\u0117s
  atsigerti jvairi\u0173 skoni\u0173 vandens;\\n\u2713 skrajut\u0117s.\\n\\n* kovo
  21 d. \u2013 Pasaulin\u0117 Dauno sindromo diena\\n* kovo 22 d. \u2013 Pasaulin\u0117
  vandens diena |\\n\\n| IV sav. | Kaip apsisaugoti nuo tuberkulioz\u0117s? | Kv\u0117pravimo
