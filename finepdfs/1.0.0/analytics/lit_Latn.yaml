  pievos\\n\\nDuomenys: ORT10LT 2015-2019 \u00a9 Nacionalin\u0117 \u017eem\u0117s
  tarnyba prie \u017d\u016aM, 2019; LR saugom\u0173 teritorij\u0173 valstyb\u0117s
