  24761   | 25102   |\\n| 18.     | Dant\u0173 protezavimo paslaug\u0173, kompensuojam\u0173
  i\u0161 PSDF, skai\u010dius             | 146     | 106     |\\n\\nHospitalizacijos
  atvej\u0173 skai\u010dius ataskaitiniais metais ne\u017eymiai ma\u017eesnis nei
  2014 metais, ta\u010diau kasmet stebimas pacient\u0173 augimas i\u0161 kit\u0173
  savivaldybi\u0173 (2013 m. \u2013 3104 pacientai, 2014 m. \u2013 3289 pacientai,
  2015 m. \u2013 3425). Did\u017eiausi srautai i\u0161 Mol\u0117t\u0173 (2014 m. \u2013
  1021 pacientas, 2015 m. \u2013 1077), Zarasu (2014 m. \u2013 1095 pacientai, 2015
  m. \u2013 1120), Ignalinos (2014 m. \u2013 294 pacientai, 2015 m. \u2013 339), Roki\u0161kio
  (2014 m. \u2013 108 pacientai, 2015 m. \u2013 136), Anyk\u0161\u010di\u0173 (2014
  m. \u2013 287 pacientai, 2015 m. \u2013 265) rajon\u0173 savivaldybi\u0173, 2014
  m. \u2013 104, 2015 m. \u2013 102 pacientai i\u0161 Vilniaus. Prognozuojamas ir
  ateityje terapinio ir chirurginio profili\u0173 pacient\u0173 sraut\u0173 augimas
  i\u0161 kit\u0173 savivaldybi\u0173. Ataskaitiniu laikotarpiu aku\u0161erin\u0117s
  pagalbos apimtys, lyginant su 2014 m. ne\u017eymiai\\n\\nsumaz\u0117jo \u2013 269
  gimdymai ir pasiek\u0117 2013 m. lygi (268 gimdym\u0173).\\n\\nLigonin\u0117s stacionare
  gydyt\u0173 pacient\u0173 skai\u010dius kasmet nuosekliai ma\u017e\u0117ja, kaip
  tai numatyt\u0105 LR Vyriausyb\u0117s 2009 m. gruod\u017eio 7 d. nutarime Nr. 1654
  \u201eD\u0117l sveikatos prie\u017ei\u016bros \u012fstaig\u0173 ir paslaug\u0173
  restrukt\u016brizavimo tre\u010diojo etapo programos patvirtinimo\u201c bei LR Vyriausyb\u0117s
  2015 m. gruod\u017eio 9 d. nutarime Nr. 1290 \u201eD\u0117l ketvirtojo sveikatos
  sistemos pl\u0117tros ir ligonini\u0173 tinklo konsolidavimo etapo plano patvirtinimo\u201c.
  Operacij\u0173 skai\u010dius i\u0161laiko augimo tendencijas, operacinis aktyvumas
  kasmet did\u0117ja: nuo 69,8 % 2011 m. iki 81,9 % 2014 m. Viena vertus, ataskaitiniu
  laikotarpiu ne\u017eymiai suma\u017e\u0117jo (2 %) operacinis aktyvumas, kita vertus,
  padid\u0117jo dienos chirurgijos paslaug\u0173 skai\u010dius (4 %). Taip didinamas
  \u012fstaigos veiklos efektyvumas - organizuojamas darbas taip, kad kuo minima\u0161n\u0117mis
  s\u0105naudomis pasiekti geriausi\u0173 rezultat\u0173.\\n\\nPagrindiniai stacionaro
  veiklos rodikliai, apibr\u0117\u017eiantys stacionaro veiklos efektyvum\u0105, atsispindi
  2 lentel\u0117je. Atkreiptinas d\u0117mesys \u012f kasmet trump\u0117jant\u012f
  vidutin\u012f gul\u0117jimo laik\u0105: nuo 6,61 2012 m. iki 5,97 2015 m. Tai \u2013
  efektyvesnio gydymo rezultatas, kai tinkamai organizuojant darb\u0105, b\u016btinus
  tyrimus padarius ambulatorin\u0117je grandyje, pacientui per trumpesn\u012f laik\u0105
  suteikiama kokybi\u0161ka paslauga. Tokiu b\u016bdu ma\u017einamos maitinimo, komunalini\u0173
  paslaug\u0173, medikament\u0173 ir pana\u0161ios i\u0161laidos \u2013 tuo didinamas
  \u012fstaigos veiklos efektyvumas.\\n\\nDinamikoje stebima koreliacija tarp hospitalizacijos
  atvej\u0173 skai\u010diaus ir lovadieni\u0173 skai\u010diaus atspindi kokybi\u0161k\u0105
  diagnostikos ir gydymo rezultat\u0105 bei vadybini\u0173 proces\u0173 steb\u0117sen\u0105,
  kas salygoja \u012fstaigos veiklos efektyvum\u0105.\\n\\nStebimas kasmet did\u0117jantis
  letali\u0161kumo rodiklis. Ta\u010diau pa\u017eym\u0117tina, kad V\u0161\u012e Utenos
  ligonin\u0117s letali\u0161kumo rodiklis (2014 m. \u2013 2,39/100,0 pacient\u0173;
  2015 m. \u2013 2,52/100,0 pacient\u0173) nesiekia Lietuvos rodiklio (2014 m. \u2013
  2,72/100,0 pacient\u0173). Manoma, kad \u0161io rodiklio blog\u0117jim\u0105 galima
  sieti su blog\u0117jan\u010dia demografine situacija Utenos regione, did\u0117jan\u010diu
  senyvo am\u017eiaus, vieni\u0161\u0173 ir socialiai sunkiai gyvenan\u010di\u0173
  \u017emoni\u0173 skai\u010diumi. Siekiant palyginti \u0161iuos rodiklius atskir\u0173
  ligonini\u0173 (skyri\u0173) galima tik juos standartizavus pagal po\u017eymius,
  kurie gal\u0117jo tur\u0117ti \u012ftakos rodiklio dyd\u017eiui.\\n\\nLovos apyvarta
  ir lovos funkcionavimo rodikliai kasmet ma\u017e\u0117jantys ir n\u0117ra pakankami
  - tendencijos matosi 2 lentel\u0117je. Ta\u010diau kelet\u0105 pastar\u0173j\u0173
  met\u0173 \u0161i\u0173 rodikli\u0173 regresij\u0105 galima pateisinti \u012fstaigoje
  vykdoma renovacija \u2013 viena vertus, ger\u0117ja ligonin\u0117s pastat\u0173
  b\u016bkl\u0117, kas igalina teikti kokybi\u0161kesnes paslaugas ir u\u017etikrina
  geras s\u0105lygas darbuotojams, kita vertus \u2013 blog\u0117jantys kai kurie stacionaro
  veiklos rodikliai, pasiek\u0117 kritin\u0119 rib\u0105 ir veda prie poky\u010di\u0173.
  Planuojama stacionari\u0173j\u0173 paslaug\u0173 pl\u0117tra, kas ne tik pagerint\u0173
  min\u0117tus rodiklius, bet ir suteikt\u0173 galimyb\u0119 pacientams gauti platesn\u012f
  spektr\u0105 stacionari\u0173j\u0173 paslaug\u0173 savo rajone. Kita vertus, Lietuvos
  lovos apyvartos vidurkis blogesnis (30,3 paciento) nei V\u0161\u012e Utenos ligonin\u0117s
  (32,79 paciento).\\n\\n2 lentel\u0117. Pagrindiniai stacionaro veiklos rodikliai
