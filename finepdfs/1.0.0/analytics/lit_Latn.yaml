  10,6 \u20ac  |\\n\\n36 \u20ac\\n\\nMETIN\u0116 ATASKAITA\\n\\nII. VALSTYB\u0116S
  FUNKCIJOMS VYKDYTI NAUDOJAMAS KIT\u0172 SUBJEKT\u0172 NT\\n\\nVilnius, Lithuania\\n\\nII.
  VALSTYB\u0116S FUNKCIJOMS VYKDYTI NAUDOJAMAS KIT\u0172 SUBJEKT\u0172 NT\\n\\n1.
  I\u0161sinuomotas NT\\n\\n1.1. I\u0161sinuomoto NT ap\u017evalga\\n\\nI\u0161sinuomotas
  NT \u2013 tai vie\u0161ojo sektoriaus subjekt\u0173 nuomos sutarties pagrindu valstyb\u0117s
  pavestoms funkcijoms vykdyti naudojamas NT, kurio savininkas \u2013 privataus sektoriaus
  subjektas.\\n\\n2019 m. i\u0161 privataus sektoriaus i\u0161sinuomoto NT plotas,
  palyginti su 2018 m., \u0161iek tiek did\u0117jo (+2,3 proc.) ir buvo kiek didesnis
  nei 76 t\u016bkst. kv. metr\u0173. Nors i\u0161sinuomoto NT plotas did\u0117jo,
  u\u017e i\u0161sinuomot\u0105 NT plot\u0105 sumok\u0117tas metinis nuomos mokes\u010dis
  ataskaitiniais metais ma\u017e\u0117jo (-6,2 proc.) ir sudar\u0117 kiek daugiau
  nei 5,55 mln. eur\u0173. 2019 m. taip pat daugiau nei 490 t\u016bkst. eur\u0173
  (beveik -28 proc.) ma\u017e\u0117jo ir i\u0161sinuomoto NT i\u0161laikymo sanaudos.
  Remiantis VTIPS duomenimis, 2019 m. buvo pateiktos daugiau nei tre\u010ddaliu ma\u017eesnio
  i\u0161sinuomoto NT ploto i\u0161laikymo sanaudos nei 2018 m., tod\u0117l darytina
  i\u0161vada, kad i\u0161sinuomoto NT objekty i\u0161laikymo sanaud\u0173 kitimo
  pagrindin\u0117 prie\u017eastis \u2013 \u012f VTIPS pateikiam\u0173 duomen\u0173
  kiekiei ir j\u0173 kokyb\u0117s poky\u010diai.\\n\\nAtkreiptinas d\u0117mesys, kad
  visus duomenis apie kitiems subjektams priklausant\u012f NT \u012f VTIPS pateikia
  \u0161io turto naudotojai, tod\u0117l Ataskaitoje informacijos apie valstyb\u0117s
  funkcijoms vykdyti naudojamus kit\u0173 subjekt\u0173 NT objektus yra pateikiama
  tik tiek, kiek jos \u012f VTIPS yra suvedusios institucijos, kurios naudojasi kitiems
  subjektams priklausan\u010diais NT objektais.\\n\\n| Metai | I\u0161sinuomoto NT
  bendras plotas (mln. m\u00b2) | Sumok\u0117tas metinis nuomos mokes\u010dis (mln.
  \u20ac) | Sanaudos (mln. \u20ac) |\\n|-------|----------------------------------------|------------------------------------------|------------------|\\n|
  2019  | 0,076 +2,3 %                           | 5,55 -6,2 %                              |
  1,28 -27,8 %     |\\n| 2018  | 0,075                                  | 5,92                                     |
  1,77             |\\n| 2017  | 0,068 +10,1 %                          | 5,07 +16,8
  %                             | 1,95 -9,3 %      |\\n\\nKaip ir ankstesniais ataskaitiniais
  metais, 2019 m. valstyb\u0117s institucijos daugiausia nuomojosi administracin\u0117s
  paskirties NT: i\u0161 viso kiek daugiau nei 61 t\u016bkst. kv. metr\u0173\\\\(^{19}\\\\).
  Ataskaitiniu laikotarpiu taip pat d\u0117l \u012f VTIPS suvest\u0173 3 nauj\u0173
  i\u0161sinuomot\u0173 sand\u0117liavimo paskirties NT objekt\u0173, kuri\u0173 bendras
  plotas sudaro beveik 6,7 t\u016bkst. kv. metr\u0173 (naudotojai \u2013 Lietuvos
  nacionalinis operos ir baleto teatras ir Valstybinio Kernav\u0117s kult\u016brinio
  rezervato direkcija), i\u0161auga (+ 6,6 t\u016bkst. kv. metr\u0173) gamybos ir
  sand\u0117liavimo paskirties i\u0161sinuomoto NT plotas. Kit\u0173 paskir\u010di\u0173
  i\u0161sinuomoto NT plotas 2019 m. kito ne\u017eymiai.\\n\\n\\\\(^{19}\\\\) Remiantis
  \u012f VTIPS pateiktais duomenimis ir V\u012e Turto banko ekspertiniu vertinimu.\\n\\n1.2.
  I\u0161sinuomoto NT nuomas mokes\u010dis\\n\\nKaip jau min\u0117ta, institucijos
  u\u017e i\u0161sinuomot\u0105 NT, naudojam\u0105 valstyb\u0117s pavestoms funkcijoms
  vykdyti, 2019 m. i\u0161 viso sumok\u0117jo daugiau nei 5,5 mln. eur\u0173 nuomas
  mokes\u010dio.\\n\\nU\u017e did\u017eiausi\u0105 i\u0161sinuomot\u0105 administracin\u0117s
  paskirties NT objekt\u0173 plot\u0105 (daugiau nei 61 t\u016bkst. kv. metr\u0173)
  buvo sumok\u0117tas ir did\u017eiausias nuomas mokes\u010dis, kuris sudaro beveik
  92 proc. bendros ataskaitini\u0173 laikotarpiai su-mok\u0117tos nuomas mokes\u010dio
  sumos ir siek\u0117 beveik 5,1 mln. eur\u0173. Valstyb\u0117s institucijoms kit\u0173
  subjekt\u0173 nuosavyb\u0117s teise valdomo administracin\u0117s paskirties NT 1
  kv. metro nuoma 2019 m. vidutini\u0161kai kainavo 7,3 euro per m\u0117nes\u012f.
  Ataskaitiniu laikotarpiu taip pat rei\u0161kmingai kito (+192 t\u016bkst. eur\u0173)
  ir metinis nuomas mokes\u010dis, sumok\u0117tas u\u017e i\u0161sinuomot\u0105 gamybos
  ir sand\u0117liavimo paskirties NT. Kaip jau min\u0117ta anks\u010diau, \u0161ios
  paskirties i\u0161sinuomoto NT metinis nuomas mokes\u010dio did\u0117jim\u0105 lem\u0117
  3 nauj\u0173 i\u0161sinuomot\u0173 sand\u0117liavimo paskirties NT objekt\u0173,
  kuri\u0173 bendras plotas sudaro beveik 6,7 t\u016bkst. kv. metr\u0173, suvedimas
  \u012f VTIPS.\\n\\nU\u017e i\u0161sinuomot\u0105 NT sumok\u0117to nuomas mokes\u010dio,
  tenkan\u010dio 1 kv. metrui, pasiskirstymas pagal NT paskirt\u012f pateikiamas 8
  priede.\\n\\nValstyb\u0117s institucij\u0173 ir \u012fmoni\u0173 naudojam\u0105
  kit\u0173 subjekt\u0173 NT galima palyginti su VNT, kuris yra i\u0161sinuomotas
  kitiem \u2013 ne vie\u0161ojo sektoriaus subjektams.\\n\\n| 2019 m. | Vis\u0173
  paskir\u010di\u0173 | Bendras plotas (mln. m\u00b2) | Metinis nuomas mokes\u010dis
  (mln. \u20ac) | Nuomas mokes\u010dis, (Eur u\u017e m\u00b2 per m\u0117n.) |\\n|---------|----------------|------------------------|---------------------------------|-------------------------------------|\\n|         |
  I\u0161sinuomotas NT | 0,076                  | 5,55                            |
  7,3                                 |\\n|         | I\u0161sinuomotas VNT | 0,303                  |
  5,35                            | 2,2                                 |\\n\\nD\u0117l
  gana dideli\u0173 i\u0161sinuomoto NT objekt\u0173 portfelio ir VNT objekt\u0173
  portfelio skirtum\u0173 ir siekiant tikslesni\u0173 rezultat\u0173, papildomai i\u0161sinuomoto
  NT ir i\u0161nuomoto VNT lyginamajai analizei pasirinkti tik vienos \u2013 administracin\u0117s
  \u2013 paskirties NT objektai.\\n\\n| 2019 m. | Administracin\u0117s paskirties
  | Bendras plotas (mln. m\u00b2) | Metinis nuomas mokes\u010dis (mln. \u20ac) | Nuomas
  mokes\u010dis, (Eur u\u017e m\u00b2 per m\u0117n.) |\\n|---------|----------------------------|------------------------|---------------------------------|-------------------------------------|\\n|         |
  I\u0161sinuomotas NT            | 0,061                  | 5,09                            |
  8,3                                 |\\n|         | I\u0161sinuomotas VNT           |
  0,030                  | 0,96                            | 3,6                                 |\\n\\nMatyti,
  kad 2019 m. i\u0161 kit\u0173 subjekt\u0173 i\u0161sinuomotas administracin\u0117s
  paskirties NT kainavo daugiau nei dukart brangiau negu tre\u010diosioms \u0161alims
  nuomojamas AVNT.\\n\\nDid\u017eiausiu \u2013 4,5 t\u016bkst. kv. metr\u0173 \u2013
  administracin\u0117s paskirties NT objektu \u2013 administracin\u0117mis patalpomis,
  esan\u010diomis Vilniuje, Ulono g. 2, \u2013 naudojosi Vilniaus apskrities valstybin\u0117
  mokes\u010di\u0173 inspekcija ir u\u017e min\u0117t\u0105 turta per metus sumok\u0117jo
  beveik 445 t\u016bkst. eur\u0173 nuomas mokes\u010dio. Remiantis \u012f VTIPS pateiktais
  duomenimis, brangiausiai, beveik 16,6 euro u\u017e 1 kv. metr\u0105 per m\u0117nes\u012f,
  u\u017e i\u0161sinuomot\u0105 NT, esant\u012f Sal\u010dininkuose, 2019 m. mok\u0117jo
  Valstyb\u0117s \u012fmon\u0117 \u201eRegitra\u201d.\\n\\n25 valstyb\u0117s institucij\u0173,
  i\u0161sinuomojusi\u0173 did\u017eiausius NT plotus, ir 25 did\u017eiausi\u0173
  (pagal plot\u0105) i\u0161sinuomot\u0173 objekto s\u0105ra\u0161ai pateikiami 9
  ir 10 prieduose.\\n\\n1.3. I\u0161sinuomoto NT i\u0161laikymo s\u0105naudos\\n\\nI\u0161sinuomoto
  NT naudotoj\u0173 \u012f VTIPS pateiktais duomenimis, 2019 m. metin\u0117s i\u0161sinuomoto
  NT i\u0161laikymo s\u0105naudos sudar\u0117 beveik 1,3 mln. eur\u0173 ir, palyginti
  su 2018 m., buvo beveik tre\u010ddaliu, t. y. apie 0,49 mln. eur\u0173, ma\u017eesn\u0117s.
  Daugiau nei pus\u0119 (apie 58 proc.) bendr\u0173 i\u0161sinuomoto NT i\u0161laikymo
  s\u0105naud\u0173 sudar\u0117 komunalin\u0117s s\u0105naudos (i\u0161 viso apie
  0,74 mln. eur\u0173), i\u0161 kuri\u0173 elektros s\u0105naudos (beveik 0,4 mln.
  eur\u0173) sudar\u0117 daugiau nei tre\u010ddal\u012f vis\u0173 bendr\u0173 i\u0161sinuomoto
  NT i\u0161laikymo s\u0105naud\u0173. Taip pat i\u0161si\u0161kyr\u0117 kitos eksploatavimo
  ir administravimo i\u0161laidos, kuriuos sudar\u0117 apie 27 proc. vis\u0173 2019
  m. i\u0161sinuomoto nekilnojamojo turto i\u0161laikymo s\u0105naud\u0173.\\n\\nKaip
  jau min\u0117ta, 2019 m., palyginti su 2018 m., buvo pateiktos daugiau nei tre\u010ddaliu
  ma\u017eesnio i\u0161sinuomoto NT ploto i\u0161laikymo s\u0105naudos, tod\u0117l
  darytina i\u0161vada, kad i\u0161sinuomoto NT objekt\u0173 i\u0161laikymo s\u0105naud\u0173
  ma\u017e\u0117jimo pagrindin\u0117 prie\u017eastis \u2013 \u012f VTIPS pateikiam\u0173
  duomen\u0173 kiekio bei j\u0173 kokyb\u0117s poky\u010diai.\\n\\n---\\n\\n20 M\u0117nesio
  nuomas mokes\u010dio kaina apskai\u010diuota pagal i\u0161sinuomoto VNT arba i\u0161sinuomoto
