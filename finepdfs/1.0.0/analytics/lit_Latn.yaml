  1999 | Warriors Team |\"", "\"\u017dem\u0117s dirbimo intensyvumo ir \u0161iaud\u0173
  \u012fterpimo poveikis dirvo\u017eemio agrochemin\u0117ms savyb\u0117ms \u017eiemini\u0173
  kvie\u010di\u0173 pas\u0117lyje\\n\\nJolita Rasimavi\u010di\u016bt\u0117, Vaclovas
  Bogu\u017eas, Vaida Steponavi\u010dien\u0117, Au\u0161ra Sinkevi\u010dien\u0117,
  Rita \u010cepulien\u0117\\n\\nAleksandro Stulginskio universitetas\\n\\n\u017dem\u0117s
  dirbimas turi didel\u0119 \u012ftak\u0105 agroekosistemoms. Supratimas apie dirvo\u017eemio
  ekosistemos strukt\u016br\u0105 ir funkcijas taikant \u012fvairaus intensyvumo \u017eem\u0117s
  dirbimo sistemas ar s\u0117j\u0105 \u012f ne\u012fdirbt\u0105 dirv\u0105 yra esmin\u0117
  s\u0105lyga bet kuriai ateities \u016bkininkavimo sistemai. Labai svarbu i\u0161ai\u0161kinti
  ne tik trumpalaik\u012f, bet ir ilgalaik\u012f \u017eem\u0117s dirbimo poveik\u012f
  dirvo\u017eemio agrochemin\u0117ms savyb\u0117ms. Tyrimai buvo t\u0119siami 2016\u20132017
  m. dar 1999 m. prad\u0117tame ilgalaikiame stacionariame lauko eksperimente, \u012frengtame
  Aleksandro Stulginskio universiteto Bandym\u0173 stotyje. Tyrim\u0173 dirvo\u017eemis
  pagal LTDK-99 klasifikacij\u0105 yra sekliai pasotintas, giliau karbonatingas gl\u0117jinis
  palva\u017eemis (pagal WRB 2014 klasifikacij\u0105 \u2013 Epieutric Endocal-caric
  Endogleyic Planosol (Endoclayic, Aric, Drainic, Humic, Episiltic)). Ilgalaikis ir
  pastovus augalini\u0173 liekan\u0173 paskleidimas, ra\u017eienoje auginamos baltosios
  garsty\u010dios panaudojimas \u017ealiajai tr\u0105\u0161ai ir tiesiogin\u0117 s\u0117ja
  \u012f ne\u012fdirbt\u0105 dirv\u0105 esmingai padidina \u017eiemini\u0173 kvie\u010di\u0173
  derlingum\u0105.\\n\\nTiesiogin\u0117 s\u0117ja, \u0161iaud\u0173 \u012fterpimas,
  agrochemin\u0117s savyb\u0117s, derlingumas\\n\\n\u012evadas\\n\\nAugalininkyst\u0117je
  tinkam\u0105 \u017eem\u0117s dirbimo sistemos parinkim\u0105 galima laikyti svarbiausiu
  veiksniu, b\u016btent nuo jos s\u0117kmingo pasirinkimo priklauso augal\u0173 augimas,
  derlius ir kokyb\u0117 (Alam et al., 2014). Nuo \u017eem\u0117s dirbimo sistem\u0173
  priklauso ne tik fizikin\u0117s, biologin\u0117s, bet ir chemin\u0117s dirvo\u017eemio
  savyb\u0117s (Lal, Stewart, 2013; Kumar et al., 2014) bei pas\u0117li\u0173 produktyvumas
  (Kahlon, 2014). Tradicinis \u017eem\u0117s dirbimas (ariminis \u017eem\u0117s dirbimas
  \u2013 dirvos arimas verstuviniais pl\u016bgais) prastina dirvo\u017eemio savybes
  ir laikomas brangiausiu \u017eem\u0117s dirbimu, ta\u010diau b\u016btent \u0161is
  \u017eem\u0117s dirvos dirbimas yra da\u017eniausiai naudojamas (Bogu\u017eas, 2010).\\n\\nAugal\u0173
  vystymasis priklauso ir nuo dirvo\u017eemio r\u016bg\u0161tingumo (Staugaitis, Ma\u017evila,
  \u0160umskis, 2010). Dirvo\u017eemio pH daro \u012ftak\u0105 dirvo\u017eemio cheminei
  sud\u0117\u010diai, taigi ir pa\u010diam derlingumui. Mokslinink\u0173 teigimu,
  dirvo\u017eemio pH esant 4,0\u20135,0, fosfatai augalams n\u0117ra prieinami, kai
  pH yra 5,5, fosfatai, kalis, kalcis, magnis pasisavinamas ribotai, o mikroelementai
  i\u0161 dirvo\u017eemio i\u0161plaunami. Esant pH ma\u017eesniam nei 4,0, slopinama
  bakterij\u0173 ir kit\u0173 dirvo\u017eemio mikroorganizm\u0173 veikla, vyraujant
  dirvo\u017eemio pH 5,0\u20138,0,  augalai geba gerai pasisavinti cink\u0105, azot\u0105,
  var\u012f, sier\u0105, o pH esant 7,0\u20138,0 \u2013 kal\u012f (Motuzas ir kt.,
  2009).\\n\\nSeniai \u017einoma, kad \u017eem\u0117s dirbimas ir \u0161iaud\u0173
  tvarkymas (augalini\u0173 liekan\u0173 \u012fterpimas) \u012ftakoja dirvo\u017eemio
  agrochemini\u0173 savybi\u0173 dinamik\u0105 (Jan Van Greonigen et al., 2011). Pastaraisiais
  de\u0161imtme\u010diais siekiant praturtinti dirvo\u017eem\u012f organine med\u017eiaga
  vis pla\u010diau naudojama \u017ealioji tr\u0105\u0161a (Romanovskaja ir kt., 2013).\u017dalioji
  tr\u0105\u0161a tai augal\u0173 \u017ealioji sultingoji mas\u0117, kuri \u012fterpiama
  \u012f dirvo\u017eem\u012f (Tripolskaja, 2005). \u017daliajai tr\u0105\u0161ai tinka
  dauguma nelepi\u0173 augal\u0173, kurie greitai auga ir u\u017eaugina daug \u017ealiosios
  mas\u0117s. Taip pat galimi keli\u0173 r\u016b\u0161i\u0173 augal\u0173 mi\u0161iniai
  (\u017dekonien\u0117, 2006).\u017dalioji tr\u0105\u0161a ne tik pagerina dirvo\u017eemio
  agrochemines savybes, bet tuo pa\u010diu teigiamai veikia ir augalus bei ekologin\u0119
  visum\u0105 (Nemeik\u0161ien\u0117 ir kt., 2010).\\n\\nKalis labai svarbus augalams,
  jis skatina baltym\u0173 sintez\u0119, ma\u017eina vandens i\u0161garinim\u0105,
  pakankamas kalio kiekis daro \u012ftak\u0105 augal\u0173 atsparumui sausr\u0173
  metu, ligoms ir kenk\u0117jams (Daug\u0117lien\u0117, Baltramaityt\u0117, 2005).
  Apie kalio pakankamum\u0105 galima spr\u0119sti i\u0161 augal\u0173 lap\u0173, vegetacijos
  trukm\u0117s. Esant nepakankamam jo kiekiui, augal\u0173 lapai greitai pagelsta,
  nusvyra \u017eemyn (Adomaitis ir kt., 2004).\\n\\nTyrim\u0173 tikslas ir objektas
  \u2013 \u012fvertinti tiesiogin\u0117s s\u0117jos, supaprastinto \u017eem\u0117s
  dirbimo ir augalini\u0173 liekan\u0173 \u012ftak\u0105 \u017eiemini\u0173 kvie\u010di\u0173
  dirvo\u017eemio agrochemin\u0117ms savyb\u0117ms ir derlingumui.\\n\\nTyrim\u0173
  metodika\\n\\n\u017diemini\u0173 kvie\u010di\u0173 tyrimai buvo atliekami 2016\u20132017
  m. dar 1999 m. prad\u0117tame ilgalaikiame stacionariame lauko eksperimente, \u012frengtame
  Aleksandro Stulginskio universiteto Bandym\u0173 stotyje. Tyrim\u0173 dirvo\u017eemis
  pagal LTDK-99 klasifikacij\u0105 yra sekliai pasotintas, giliau karbonatingas gl\u0117jinis
  palva\u017eemis (pagal WRB 2014 klasifikacij\u0105 \u2013 Epieutric Endocal-caric
  Endogleyic Planosol (Endoclayic, Aric, Drainic, Humic, Episiltic)).\\n\\nIlgalaikis
  lauko eksperimentas \u012frengtas laukeli\u0173 skaidymo metodu, 4 pakartojimais,
  i\u0161 viso 48 laukeliai. Laukeli\u0173 dydis: pradinis \u2013 102 m 2 (6 m x 17
  m), apskaitoma-sis \u2013 30 m 2 (15 m x 2,0 m).:Taikoma s\u0117jomaina: vasariniai
  rapsai, \u017eieminiai kvie\u010diai, vasariniai mie\u017eiai. Vienoje eksperimento
  dalyje \u0161iaudai pa\u0161alinti (-\u0160), o kitoje dalyje \u2013 susmulkinti
  ir paskleisti (+\u0160). Ir fone be \u0161iaud\u0173, ir fone su paskleistais \u0161iaudais
  tiriamos visos \u017eem\u0117s dirbimo sistemos.\\n\\nFaktorius A: \u0161iaud\u0173
  paskleidimas: be \u0161iaud\u0173 (-\u0160), \u0161iaudai susmulkinti ir paskleisti
  (+\u0160).\\n\\nFaktorius B: \u017eem\u0117s dirbimo sistemos: gilusis arimas 23\u201325
  cm gyliu ruden\u012f (GA), seklusis \u017ealiosios tr\u0105\u0161os \u012fterpimas
  rotoriniu kultivatoriumi 5\u20136 cm gyliu prie\u0161 s\u0117j\u0105 (\u017dTRK),
  ne\u012fdirbta dirva, tiesiogin\u0117 s\u0117ja (ND).\\n\\nDirvo\u017eemio agrochemin\u0117s
  savyb\u0117s buvo nustatomos prie\u0161 \u012frengiant lauko eksperiment\u0105,
  jo vykdymo metais. Kiekviename laukelyje dirvo\u017eemio gr\u0105\u017etu buvo paimti
  jungtiniai apie 250 g dirvo\u017eemio \u0117miniai i\u0161 penkiolikos viet\u0173
  i\u0161 0\u201310, 10\u201320 ir 20\u201330 cm armens sluoksnio. pHpotenciometriniu
  metodu. Suminis azotas nustatytas Kjeldalio metodu (%), fosforingumas ir kalingumas
  \u2013 A-L (Egnerio-Riehm-Domingo) metodu mg kg -1 dirvo\u017eemio. \u017diemini\u0173
  kvie\u010di\u0173 gr\u016bd\u0173 derlius eksperimento laukeliuose buvo nuimtas
  kombainu, pasvertas ir i\u0161reik\u0161tas 14 %, 100\\n\\n% \u0161varumo gr\u016bd\u0173
  mase. \u0160varumui nustatyti i\u0161 vis\u0173 kiekvieno varianto pakartojim\u0173
  buvo  sudaroma apie 2 kg gr\u016bd\u0173 jungtinis m\u0117ginys. Gr\u016bdai supilami
  \u012f audeklo mai\u0161elius. I\u0161 kiekvieno varianto jungtinio m\u0117ginio
  atsverti 3 \u0117miniai. I\u0161 j\u0173 i\u0161skirtos priemai\u0161os, o \u0161var\u016bs
  gr\u016bdai pasverti.\\n\\nRezultatai ir aptarimas\\n\\nDirvo\u017eemio pH tyrimai
  buvo atlikti 2016 m. (1 pav.). Po 17 met\u0173 nuo lauko eksperimento \u012frengimo
  nustatyta, kad dirvoje, kurioje \u0161iaudai susmulkinti ir paskleisti (+\u0160),
  visuose tirtuose dirvos sluoksniuose pH didesnis nuo 3,5 iki 1,2 proc., lyginant
  su dirva be \u0161iaud\u0173 (-\u0160). Dirvoje (20\u201330 cm) kurioje \u0161iaudai
  susmulkinti ir paskleisti (+\u0160) nustatytas esmingai didesnis 3,5 proc. pH, lyginant
  su dirva be \u0161iaud\u0173 (-\u0160). \u017dem\u0117s dirbimo sistem\u0173 poveikis
  dirvo\u017eemio pH buvo esminis giliausiame sluoksnyje 20\u201330 cm, palyginus
  su giliuoju arimu (GA), kur buvo taikytas seklusis \u017ealiosios tr\u0105\u0161os
  \u012fterpimas rotoriniu kultivatoriumi pavasar\u012f (\u017dTRK) ir tiesiogin\u0117
  s\u0117ja \u012f ne\u012fdirbt\u0105 dirv\u0105 (ND) \u2013 esmingai didesni 3,7\u20134,2
  proc. Dirvos pH suma\u017e\u0117jimas nustatytas viduriniame 10\u201320 cm dirvos
  sluoksnyje, kur prie\u0161 s\u0117j\u0105 rotoriniu kultivatoriumi \u012fterpta
  \u017ealioji tr\u0105\u0161a (\u017dTRK), bei tiesiogin\u0117s s\u0117jos \u012f
  ne\u012fdirbt\u0105 dirv\u0105 laukeliuose (ND). Palyginus su giliuoju arimu (GA),
  dirvo\u017eemio pH nustatytas nevienodas. Sekliai \u012fterpus \u017eali\u0105j\u0105
  tr\u0105\u0161\u0105 rotoriniu kultivatoriumi pavasar\u012f (\u017dTRK) dirvos pH
  nustatytas ma\u017eesnis, tiesiogin\u0117s s\u0117jos \u012f ne\u012fdirbt\u0105
  dirv\u0105 laukeliuose (ND) dirvos pH - didesnis.\\n\\nPalyginus gautus tyrim\u0173
  rezultatus su A. Kairyt\u0117s (2005) tyrim\u0173 prad\u017eioje gautais duomenimis,
  jie labai pana\u0161\u016bs tame pa\u010diame eksperimente ir po de\u0161imties
  met\u0173, \u2013 \u0161iaud\u0173 panaudojimas esmingai didino dirvo\u017eemio
  pH giliausiame tirtame dirvo\u017eemio sluoksnyje.\\n\\nPastaba. Esminio skirtumo
  tikimyb\u0117s lygis: * - P\u2264 0,05. A veiksnys: -\u0160 \u2013 be \u0161iaud\u0173
  (kontrol\u0117), +\u0160 \u2013 \u0161iaudai susmulkinti ir paskleisti, B veiksnys:
  GA \u2013 \u012fprastinis gilusis arimas 23\u201325 cm gyliu ruden\u012f (kontrol\u0117),
  \u017dTRK \u2013 seklusis \u017ealiosios tr\u0105\u0161os \u012fterpimas rotoriniu
  kultivatoriumi 5\u20136 cm gyliu prie\u0161 s\u0117j\u0105, ND \u2013 ne\u012fdirbta
  ra\u017eiena, tiesiogin\u0117 s\u0117ja.\\n\\nNotes. Significant differences at
  *P \u22640.05>0.01; Fisher LSD test vs.control. Factor A: R - straw removed (control),
  S \u2013 straw chopped and spread. Factor B: CP - conventional deep ploughing (control),
  GMR \u2013 catch cropping and green manure incorporation with rotary cultivator,
  NT - no-tillage, direct drilling.\\n\\nLietuvos derling\u0173 dirvo\u017eemi\u0173
  regionuose vyrauja chemizuoti augalininkyst\u0117s \u016bkiai, kuriuose daugiausia
  auginami javai ir rapsai. Tokiuose \u016bkiuose susikaupia didelis kiekis \u0161iaud\u0173
  (iki 6 t ha -1 ir daugiau) (Arlauskien\u0117 et al., 2009).\\n\\nTyrimo duomenimis
  (2 pav.), \u0161iaud\u0173 paskleidimas suminiam azoto kiekiui esmin\u0117s \u012ftakos
  netur\u0117jo visuose tirtuose dirvos sluoksniuose.\\n\\nPalyginus su giliuoju arimu
  (GA), esminis suminis azoto padid\u0117jimas nustatytas nuo 31,3 iki 41,7 proc.
  vir\u0161utiniame ir apatiniame dirvos sluoksniuose sekliai purentoje dirvoje rotoriniu
  kultivatoriumi prie\u0161 s\u0117j\u0105 su \u017eali\u0105ja tr\u0105\u0161a (\u017dTRK),
  o tiesiogin\u0117s s\u0117jos \u012f ne\u012fdirbt\u0105 dirv\u0105 laukeliuose
  (ND) (20\u201330 cm) \u2013 1,6 karto didesnis. I\u0161analizavus kitus gautus rezultatus
  esmini\u0173 skirtum\u0173 nenustatyta.\\n\\nPastaba. Esminio skirtumo tikimyb\u0117s
  lygis: * - P\u2264 0,05; ** - P\u2264 0.01. A veiksnys: -\u0160 \u2013 be \u0161iaud\u0173
  (kontrol\u0117), +\u0160 \u2013 \u0161iaudai susmulkinti ir paskleisti, B veiksnys:
  GA \u2013 \u012fprastinis gilusis arimas 23\u201325 cm gyliu ruden\u012f (kontrol\u0117),
  \u017dTRK \u2013 seklusis \u017ealiosios tr\u0105\u0161os \u012fterpimas rotoriniu
  kultivatoriumi 5\u20136 cm gyliu prie\u0161 s\u0117j\u0105, ND \u2013 ne\u012fdirbta
  ra\u017eiena, tiesiogin\u0117 s\u0117ja.\\n\\nNotes. Significant differences at
  *P \u22640.05>0.01, ** P \u22640.01>0.001; Fisher LSD test vs.control. Factor A:
  R - straw removed (control), S \u2013 straw chopped and spread. Factor B: CP - conventional
  deep ploughing (control), GMR \u2013 catch cropping and green manure incorporation
  with rotary cultivator, NT - no-tillage, direct drilling.\\n\\nAtlikus judriojo
  fosforo (P2O5) kiekio dirvo\u017eemyje tyrimus (3 pav.) nustatyta, kad \u0161iaud\u0173
  \u012fterpimas (+\u0160) tur\u0117jo esmin\u0117s \u012ftakos dirvo\u017eemio apatiniame
  20\u201330 cm sluoksnyje. Jame judriojo fosforo (P2O5) kiekis buvo 1,9 karto ma\u017eesnis,
  lyginant su dirva be \u0161iaud\u0173 (-\u0160). \u017dem\u0117s dirbimo sistemose
  judriojo fosforo (P2O5) kiekio esminiai skirtumai nustatyti tik vir\u0161utiniame
  0\u201310 cm dirvo\u017eemio sluoksnyje. Palyginus su giliuoju arimu (GA), kur buvo
  taikytas seklusis \u017ealiosios tr\u0105\u0161os \u012fterpimas rotoriniu kultivatoriumi
  pavasar\u012f (\u017dTRK) ir tiesiogin\u0117 s\u0117ja \u012f ne\u012fdirbt\u0105
  dirv\u0105 (ND) \u2013 atitinkamai 1,8 karto didesni. Ilgalaikis pavir\u0161inis
  \u017eem\u0117s dirbimas skatina judriojo fosforo kaupim\u0105si vir\u0161utiniame
  dirvos sluoksnyje.\\n\\nPastaba. Esminio skirtumo tikimyb\u0117s lygis: ** - P\u2264
  0.01; *** - P\u2264 0.001. A veiksnys: -\u0160 \u2013 be \u0161iaud\u0173 (kontrol\u0117),
  +\u0160 \u2013 \u0161iaudai susmulkinti ir paskleisti, B veiksnys: GA \u2013 \u012fprastinis
  gilusis arimas 23\u201325 cm gyliu ruden\u012f (kontrol\u0117), \u017dTRK \u2013
  seklusis \u017ealiosios tr\u0105\u0161os \u012fterpimas rotoriniu kultivatoriumi
  5\u20136 cm gyliu prie\u0161 s\u0117j\u0105, ND \u2013 ne\u012fdirbta ra\u017eiena,
  tiesiogin\u0117 s\u0117ja.\\n\\nNotes. Significant differences at ** P \u22640.01>0.001,
  *** P \u22640.001; Fisher LSD test vs.control. Factor A: R - straw removed (control),
  S \u2013 straw chopped and spread. Factor B: CP - conventional deep ploughing (control),
  GMR \u2013 catch cropping and green manure incorporation with rotary cultivator,
  NT - no-tillage, direct drilling.\\n\\nSvarbiausias augal\u0173 mityboje \u2013
  kalis, kurio pasisavinimas priklauso nuo daugelio geochemini\u0173 bei agroklimatini\u0173
  s\u0105lyg\u0173 (Gu\u017eys 2013).\\n\\nI\u0161analizavus 2016 m. gautus duomenis
  (4 pav.) nustatyta, kad judriojo kalio (K2O) kiekiui dirvo\u017eemyje \u0161iaud\u0173
  paskleidimas netur\u0117jo esmin\u0117s \u012ftakos. \u017dem\u0117s dirbim\u0173
  sistem\u0173 poveikis esmingai didesnis nuo 2,5 iki 2,6 karto vir\u0161utiniame
  0\u201310 cm dirvos sluoksnyje, palyginus su giliuoju arimu (GA). Judriojo kalio
  (K2O) kiekis dirvo\u017eemyje esmingai ma\u017eesnis 1,8 karto (20\u201330 cm.)
  laukeliuose su sekliai \u012fterpiama \u017eali\u0105j\u0105 tr\u0105\u0161a rotoriniu
  kultivatoriumi pavasar\u012f (\u017dTRK), lyginat su tradiciniu \u017eem\u0117s
  dirbimu (GA). Viduriniame dirvos sluoksnyje 10\u2013 20 cm, kur taikytas seklusis
  \u017ealiosios tr\u0105\u0161os \u012fterpimas kultivatoriumi ir tiesiogin\u0117
  s\u0117ja judriojo kalio kiek\u012f padidino nuo 2,3 iki 15,6 proc., lyginant su
  giliai arta dirva (GA).\\n\\nPastaba. Esminio skirtumo tikimyb\u0117s lygis: * -
  P\u2264 0,05; *** - P\u2264 0.001. A veiksnys: -\u0160 \u2013 be \u0161iaud\u0173
  (kontrol\u0117), +\u0160 \u2013 \u0161iaudai susmulkinti ir paskleisti, B veiksnys:
  GA \u2013 \u012fprastinis gilusis arimas 23\u201325 cm gyliu ruden\u012f (kontrol\u0117),
  \u017dTRK \u2013 seklusis \u017ealiosios tr\u0105\u0161os \u012fterpimas rotoriniu
  kultivatoriumi 5\u20136 cm gyliu prie\u0161 s\u0117j\u0105, ND \u2013 ne\u012fdirbta
  ra\u017eiena, tiesiogin\u0117 s\u0117ja.\\n\\nNotes. Significant differences at
  *P \u22640.05>0.01, *** P \u22640.001; Fisher LSD test vs.control. Factor A: R -
  straw removed (control), S \u2013 straw chopped and spread. Factor B: CP - conventional
  deep ploughing (control), GMR \u2013 catch cropping and green manure incorporation
  with rotary cultivator, NT - no-tillage, direct drilling.\\n\\nNustatyta (5 pav.),
  jog \u0161iaud\u0173 paskleidimas (+\u0160) tur\u0117jo esmin\u0117s \u012ftakos
  \u017eiemini\u0173 kvie\u010di\u0173 derlingumui. Jis buvo 5,6 proc. didesnis, lyginant
  su dirva be \u0161iaud\u0173 (-\u0160). Seklus \u017ealiosios tr\u0105\u0161os \u012fterpimas
  rotoriniu kultivatoriumi (\u017dTRK) ir tiesiogin\u0117 s\u0117ja \u012f ne\u012fdirbt\u0105
  dirv\u0105, lyginant su giliuoju arimu (GA) \u017eiemini\u0173 kvie\u010di\u0173
  derlingum\u0105 padidino nuo 8,9 iki 14,1 proc.\\n\\nGautos pana\u0161ios tyrim\u0173
  rezultat\u0173 tendencijos ir taikant supaprastintas \u017eem\u0117s dirbimo sistemas.
  D. \u0160imanskait\u0117s (2002) dvej\u0173 tyrim\u0173 met\u0173 duomenimis, \u017eiemini\u0173
  kvie\u010di\u0173 derlingumas (s\u0117jant juos tiesiai \u012f ra\u017eien\u0105)
  nesuma\u017e\u0117jo, palyginus su giliuoju rudeniniu \u017eem\u0117s dirbimu.\\n\\nPastaba.
  Esminio skirtumo tikimyb\u0117s lygis: ** - P\u2264 0.01; *** - P\u2264 0.001. A
  veiksnys: -\u0160 \u2013 be \u0161iaud\u0173 (kontrol\u0117), +\u0160 \u2013 \u0161iaudai
  susmulkinti ir paskleisti, B veiksnys: GA \u2013 \u012fprastinis gilusis arimas
  23\u201325 cm gyliu ruden\u012f (kontrol\u0117), \u017dTRK \u2013 seklusis \u017ealiosios
  tr\u0105\u0161os \u012fterpimas rotoriniu kultivatoriumi 5\u20136 cm gyliu prie\u0161
  s\u0117j\u0105, ND \u2013 ne\u012fdirbta ra\u017eiena, tiesiogin\u0117 s\u0117ja.\\n\\nNotes.
  Significant differences at ** P \u22640.01>0.001, *** P \u22640.001; Fisher LSD
  test vs.control. Factor A: R - straw removed (control), S \u2013 straw chopped and
  spread. Factor B: CP - conventional deep ploughing (control), GMR \u2013 catch cropping
  and green manure incorporation with rotary cultivator, NT - no-tillage, direct drillin\\n\\nI\u0161vados\\n\\n1.
  Pastovus \u0161iaud\u0173 paskleidimas bei pavir\u0161inis purenimas ir tiesiogin\u0117
  s\u0117ja \u012f ne\u012fdirbt\u0105 dirv\u0105 padidina dirvo\u017eemio pH.\\n2.
  Taikant supaprastint\u0105 \u017eem\u0117s dirbim\u0105 ir s\u0117j\u0105 \u012f
  ne\u012fdirbt\u0105 dirv\u0105, judri\u0173j\u0173 fosforo ir kalio bei suminio
  azoto kiekiai labai skirtingai pasiskirsto, esmingai daugiau j\u0173 susikaupia
  vir\u0161utiniame (0-10 cm) armens sluoksnyje, o viduriniame (10 -20 cm) nustatytas
  padid\u0117jimas.\\n3. Ilgalaikis ir pastovus augalini\u0173 liekan\u0173 paskleidimas,
  ra\u017eienoje auginamos baltosios garsty\u010dios panaudojimas \u017ealiajai tr\u0105\u0161ai
  ir tiesiogin\u0117 s\u0117ja \u012f ne\u012fdirbt\u0105 dirv\u0105 esmingai padidina
  \u017eiemini\u0173 kvie\u010di\u0173 derlingum\u0105.\\n\\nLiterat\u016bra\\n\\n1.
