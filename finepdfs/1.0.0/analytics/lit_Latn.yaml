  komunalines paslaugos: 5,1 \u20ac\\n- Einamasis remontas: 1,6 \u20ac\\n- Apsauga:
  1,5 \u20ac\\n- Valymas: 6,4 \u20ac\\n- Kitos eksplotavimo ir administravimo s\u0105naudos:
  14,5 \u20ac\\n- Patalp\u0173 draudimas (TD): 0,14 \u20ac\\n- Patalp\u0173 draudimas
  (CA): 0,11 \u20ac\\n\\nLyginant i\u0161siniuomoto NT s\u0105naudas su bendromis
  VNT s\u0105naudomis, svarbu atkreipti d\u0117mes\u012f, kad i\u0161siniuomoto NT
  objekt\u0173 portfelis ir VNT objekt\u0173 portfelis vis dar reik\u0161mingai skiriasi,
  pavyzd\u017eiui, ataskaitiniu laikotarpiu i\u0161siniuomoto NT objekt\u0173 paskir\u010di\u0173
  buvo 10, o VNT objekt\u0173 paskir\u010di\u0173 \u2013 15; daugelio NT paskir\u010di\u0173
  plotai skiriasi daugiau nei keliasde\u0161imt kart\u0173. D\u0117l \u0161ios prie\u017easties
  kokybi\u0161kas bendr\u0173 VNT s\u0105naud\u0173 ir bendr\u0173 i\u0161siniuomoto
  NT s\u0105naud\u0173, tenkan\u010di\u0173 1 kv. metrui, palyginimas ir reik\u0161ming\u0173
  i\u0161vad\u0173 pateikimas yra sunkiai \u012fmanomas.\\n\\n2. Savivaldybi\u0173
  NT panauda\\n\\n2.1. Savivaldybi\u0173 NT panaudos ap\u017evalga\\n\\nSavivaldybi\u0173
  NT \u2013 tai vie\u0161ojo sektoriaus subjekt\u0173 panaudos pagrindais laikinai
  neatlygintinai valstyb\u0117s pavestoms funkcijoms vykdyti naudojamas NT, kurio
  savinink\u0117 \u2013 savivaldyb\u0117.\\n\\nValstyb\u0117s institucijos valstyb\u0117s
  pavestoms funkcijoms vykdyti naudoja ne tik i\u0161 privataus sektoriaus i\u0161sinuomoto
  NT objektus, bet panaudos pagrindais neatlygintinai taip pat naudoja ir savivaldyb\u0117ms
  priklausant\u012f NT, kurio plotas 2019 m. siek\u0117 beveik 77 t\u016bkst. kv.
  metr\u0173. Min\u0117to turto i\u0161laikymo s\u0105naudos valstybei kainavo beveik
  235 t\u016bkst. eur\u0173 per metus.\\n\\nKaip min\u0117ta anks\u010diau, vis\u0105
  informacij\u0105 apie kitiemis subjektams, taigi ir savivaldyb\u0117ms priklausant\u012f
