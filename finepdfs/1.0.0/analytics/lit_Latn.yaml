  2                                                | 30                       | 0                        |\\n\\nI\u0161analizavus
  5 lentel\u0117s duomenis, stebimas kai kuri\u0173 specialist\u0173 tr\u016bkumas
  (2). Reikia pa\u017eym\u0117ti, kad kitas prie\u017eastis (4) daugiausia lemia laisvas
  paciento pasirinkimas pas pageidaujam\u0105 specialist\u0105 \u2013 i\u0161auga
  eil\u0117s pas pacientams patrauklesn\u012f ar populiaresn\u012f gydytoj\u0105 specialist\u0105.
  Pacient\u0173 eil\u0117s suma\u017e\u0117jo kreipiantis pas neurologus, nefrolog\u0105,
  gastroenterolog\u0105, vaik\u0173 ir suaugusi\u0173j\u0173 pulmonolog\u0105, vaik\u0173
  kardiolog\u0105, endoskopuotoj\u0105, echoskopuotoj\u0105, fizin\u0117s medicinos
  ir reabilitacijos gydytoj\u0105. Kadangi eil\u0117 specialist\u0173 (infektologas,
  hematologas, reumatologas) dirba nepilnu etatu (yra tik po vien\u0105 specialist\u0105
  ir stacionarui, ir poliklinikai), o konsultacij\u0173 poreikis didelis, eil\u0117s
  nei\u0161vengiamos.\\n\\nPa\u017eym\u0117tina, kad vienareik\u0161mi\u0161kai vertinti
  ilgiausios laukimo trukm\u0117s nereik\u0117t\u0173, kadangi ji gali susidaryti
  tik kart\u0105 per metus, gydytojui atostogaujant, tuo tarpu trumpiausia laukimo
  trukm\u0117 geriausiai atspindi \u0161\u012f rodikl\u012f.\\n\\nKokyb\u0117s u\u017etikrinimas
  ir gerinimas\\n\\nSiekiant u\u017etikrinti teikiam\u0173 asmens sveikatos prie\u017ei\u016bros
  paslaug\u0173 kokyb\u0119 bei nuolat j\u0105 gerinti, \u012fstaigoje \u012fforminta
  dokumentais, pri\u017ei\u016brima bei atnaujinama kokyb\u0117s vadybos sistema (toliau
  \u2013 KVS), atitinkanti Lietuvoje galiojan\u010di\u0173 teis\u0117s akt\u0173,
  reglamentuojan\u010di\u0173 asmens sveikatos prie\u017ei\u016bros veikl\u0105, reikalavimus.
  \u012estaigoje vykstantys procesai apra\u0161yti kokyb\u0117s vadybos dokumentuose:
  kokyb\u0117s vadove, proced\u016brose, darbo instrukcijose, reglamentuose, metodikose.
  Kokyb\u0117s vadybos sistema ligonin\u0117je u\u017etikrina kokybi\u0161kas medicinos
  paslaugas, pacient\u0173 aptarnavim\u0105, paremt\u0105 profesine darbuotoj\u0173
  kvalifikacija ir etika, taip pat tinkam\u0105 medicinos \u012frang\u0105 ir kitas
  priemones.\\n\\n\u012estaigos veiklai ir paslaug\u0173 kokybei vertinti ir gerinti
  organizuojamas vidaus medicininis auditas (toliau - VMA), kurio veikla, apimtys
  ir atsakomyb\u0117 apra\u0161yta KVS proced\u016broje P 02-2011 \u201eVidaus medicininio
  audito veikla\u201c. Ligonin\u0117je atliekamas planinis ir neplaninis VMA. Planiniai
  VMA atliekami pagal sudaryt\u0105 metin\u012f VMA plan\u0105. Neplaniniai VMA atliekami
  gavus skundus, u\u017efiksavus neatitiktis, esant neigiamiems atsiliepimams apie
  paslaugos kokyb\u0119 arba esant kitoms prie\u017eastims.\\n\\nAtaskaitiniais metais
  atlikta 26 vidaus auditai. Planiniai auditai atlikti sveikatos prie\u017ei\u016bros
  kokybei, sutartini\u0173 \u012fsipareigojim\u0173 su Ligoni\u0173 kasomis vykdymui,
  racionaliam i\u0161tekli\u0173 naudojimui ir kitiems rodikliams \u012fvertinti.
  Neplanini\u0173 audit\u0173 metu i\u0161nagrin\u0117ta 13 skund\u0173 \u2013 su
  parei\u0161k\u0117jais rasti konstruktyv\u016bs sprendimai. Skund\u0173 ir pasi\u016blym\u0173
  nagrin\u0117jimo tvarka apra\u0161yta KVS proced\u016broje P 03-2011 \u201eSkund\u0173
  valdymas\u201c. Ligonin\u0117je vykdomos anonimin\u0117s pacient\u0173 apklausos
  atskleid\u0117, kad absoliuti pacient\u0173 dauguma gerai ir labai gerai vertina
  personalo darb\u0105. \u012estaigoje korupcijos aprai\u0161k\u0173 nesteb\u0117ta.\\n\\nRemiantis
  ligonin\u0117s vidine analize, vis dar yra proces\u0173, kuriuos reikia tobulinti:
  b\u016btinas\\n\\nefektyvesnis patalp\u0173 ir personalo darbo laiko panaudojimas,
  medikament\u0173 ir medicinos priemoni\u0173 valdymas, dokumentacijos valdymas,
  patrauklios aplinkos k\u016brimas ir pan.\\n\\n6 lentel\u0117. \u012estaigos stipriosios
  ir silpnosios pus\u0117s\\n\\n| Veiklos elementai | Stipryb\u0117s                                                                 |
  Silpnyb\u0117s                                                                 |\\n|-------------------|---------------------------------------------------------------------------|---------------------------------------------------------------------------|\\n|
  **Paslaugos**     | *Pagrindin\u0117 regiono ligonin\u0117*, teikianti kokybi\u0161kas
  ir savalaikes paslaugas. | Pri\u0117mimo-skubios pagalbos skyrius perpildytas savaitgaliuais
  neb\u016btinosis pagalbos pacientais d\u0117l PSPC riboto darbo laiko, kas didina
  personalo poreiki\u0173 ir \u012fstaigos ka\u0161tus. |\\n|                   |
