  siek\u0117 454,81 t\u016bkst. kv. metr\u0173 ir sudar\u0117 beveik 78 proc. viso
  V\u012e Turto banko centralizuotai valdyti perimto AVNT ploto, kuris, kaip min\u0117ta,
  ataskaitinio laikotarpio pabaigoje siek\u0117 beveik 585 t\u016bkst. kv. metr\u0173.
  I\u0161 viso sudarytos 717 panaudos sutartys, i\u0161 j\u0173 98 panaudos sutartys
  ir 619 panaudos sutar\u010di\u0173 su turto valdymo ir prie\u017ei\u016bros sutartimi.
  Likusi\u0173 22 proc. centralizuotai valdomo AVNT dal\u012f sudar\u0117 i\u0161nuomotas
  ir laisvas AVNT plotas.\\n\\n### V\u012e Turto banko patik\u0117jimo teise valdomas
