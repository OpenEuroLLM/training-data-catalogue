  Bogu\u017eas, Vaida Steponavi\u010dien\u0117, Au\u0161ra Sinkevi\u010dien\u0117,
  Rita \u010cepulien\u0117\\n\\nTillage system and straw incorporation effects on
  soil chemical properties of winter wheat crop\\n\\nSummary\\n\\nSoil tillage has
  long-term impacts on the agroecosystems. Understanding the structure and functions
  of the soil ecosystem, when applying soil tillage systems of different intensity
  or direct drilling, is an essential condition for any future farming system. It
  is very important to ascertain not only the short-term but also the long-term effects
  of soil agrochemical properties. Research was carried out during a period of 2016-2017
  in a long-term fixed experiment, set up in 1999, at the Experimental Station of
  Aleksandras Stulginskis University. The soil of the experimental site is Epieutric
  Endocalcaric Endogleyic Planosol (Endoclayic, Aric, Drainic, Humic, Episiltic))
  according to WRB 2014 classification. Long-term and regular spreading of plant residues
  and the use of white mustard grown in the stubble for green manure increased winter
  wheat productivity.\\n\\nNo-tillage, straw retention, soil agrochemical properties,productivity\\n\\nAcknowledgement\\n\\nThis
