  (BPL)\\n\\nOrlaivio vado am\u017eius\\n\\n34 metai\\n\\nOrlaivio vado skryd\u017ei\u0173
  patirtis\\n\\nI\u0161 viso - 238 val. 40 min.\\n\\nPer paskutines 90 d. \u2013 21
  val.\\n\\nPer paskutines 30 d. - 8 val. 30 min.\\n\\nTrumpa ap\u017evalga\\n\\n2016
  m. rugpj\u016b\u010dio 6 d. apie 18 val. 30 min. vietos laiku kar\u0161to oro balionas
  pakilo skryd\u017eiui nuo pievos esan\u010dios prie Baltojo tilto Vilniuje. Kar\u0161to
  oro baliono pilotas pa\u017eym\u0117jo, kad  apie18 val. 50 min. pasikeit\u0117
  v\u0117jo kryptis ir atsirado v\u0117jo g\u016bsiai, tod\u0117l nusprend\u0117 nusileisti.
  Artimiausi\u0105 viet\u0105 nusileidimui pavyko rasti tik po 20 min. Pieva  nebuvo  labai  tinkama  nusileidimui,
  nes  skersai  jos  buvo  elektros  laidai, pievoje gan\u0117si avys, o kiek tol\u0117liau
  stov\u0117jo gyvenamasis namas. Tod\u0117l norint nusileisti iki artimiausios kli\u016bties,
  praskridus elektros laidus, reik\u0117jo nedelsiant \u017eem\u0117ti.\\n\\n19 val.
  15 min. kar\u0161to oro balionas kietai nusileido ant \u017eem\u0117s, krep\u0161ys
  apvirto ant \u0161ono ir kelet\u0105 metr\u0173 buvo velkamas \u017eeme.\\n\\nSkryd\u017eio
  metu kar\u0161to oro balione buvo vienas pilotas ir \u0161e\u0161i keleiviai. D\u0117l
  kieto nusileidimo du keleiviai susitrenk\u0117 koj\u0173 \u010diurnas, o viena keleiv\u0117
  (Jungtin\u0117s Karalyst\u0117s piliet\u0117) susilau\u017e\u0117 \u010diurn\u0105.\\n\\nSaugos
  tyrimas\\n\\nSaugos tyrim\u0173 institucija, vadovaujantis 2010 m. spalio 20 d.
  Europos Parlamento ir Tarybos reglamento Nr. 996/2010 d\u0117l civilin\u0117s aviacijos
  avarij\u0173 ir incident\u0173 tyrimo ir prevencijos, kuriuo panaikinama Direktyva
  94/56/EB (toliau \u2013 Reglamentas Nr. 996/2010), 5 straipsnio 1 dalimi, prad\u0117jo
  kar\u0161to oro baliono \u201eBal\u00f3ny Kub\u00ed\u010dek spol. s.r.o. BB45 N\\\",
  nacionalinis ir registracijos \u017eenklai LY-DNB, avarijos saugos tyrim\u0105.\\n\\nVadovaujantis
  Reglamento Nr. 996/2010 10 straipsniu, Jungtin\u0117s Karalyst\u0117s saugos tyrim\u0173
  institucija (Aircraft Accident Investigation Branch) atliekamam saugos tyrimui paskyr\u0117
  \u012fgaliot\u0105j\u012f atstov\u0105.\\n\\nSaugos tyrimo etapas \u2013  analizavimas.\"",
  "\"20 straipsnis\\n\\nSTUDENTAI\\n\\nBendras komentaras\\n\\n\u0160is straipsnis
  nustato student\u0173 \u2013 vienos Susitarian\u010dios valstyb\u0117s rezident\u0173
  kitoje Susitarian\u010dioje valstyb\u0117je gaunam\u0173 pajam\u0173, skirt\u0173
  pragyvenimui, mokslui ar sta\u017euotei, neapmokestinimo atvejus.\\n\\nI\u0161mokos,
  kurias savo pragyvenimui, mokslui ar sta\u017euotei gauna studentas, mokinys ar
  praktikantas, kuris yra arba prie\u0161 pat atvykdamas \u012f Susitarian\u010di\u0105j\u0105
  Valstyb\u0119 buvo kitos Susitarian\u010diosios Valstyb\u0117s rezidentas ir kuris
  pirma min\u0117toje Valstyb\u0117je tiktai mokosi ar sta\u017euojasi, neapmokestinamos
  toje Valstyb\u0117je su s\u0105lyga, kad tokie mok\u0117jimai gaunami i\u0161 \u0161altini\u0173,
  esan\u010di\u0173 u\u017e tos Valstyb\u0117s rib\u0173.\\n\\nKomentaras\\n\\n\u0160io
  straipsnio nuostatos taikomos i\u0161mokoms, kurias studentai, mokiniai ar praktikantai,
  vienos valstyb\u0117s rezidentai, gauna pragyvenimui, mokslui ar sta\u017euotei
  kitoje valstyb\u0117je apmok\u0117ti.\\n\\nI\u0161mokos, kurias gauna studentas,
  mokinys ar praktikantas, vienos Susitarian\u010dios valstyb\u0117s rezidentas, besimokantis
  kitoje Susitarian\u010dioje valstyb\u0117je, toje kitoje valstyb\u0117je neapmokestinamos,
  jeigu:\\n\\n tas studentas, mokinys ar praktikantas yra pirmosios valstyb\u0117s
  rezidentas ar juo buvo prie\u0161 pat atvykdamas \u012f kit\u0105 valstyb\u0119,\\n
  i\u0161mokos yra tiesiogiai susijusios su pragyvenimu, mokslu, ar sta\u017euote
  ir i\u0161mokos gaunamos i\u0161 \u0161altini\u0173, esan\u010di\u0173 u\u017e tos
  kitos valstyb\u0117s, kurioje fizinis asmuo studijuoja, mokosi ar sta\u017euojasi,
  rib\u0173, neatsi\u017evelgiant \u012f tai, ar tos l\u0117\u0161os yra gaunamos
  i\u0161 valstybini\u0173, ar i\u0161 priva\u010di\u0173 \u0161altini\u0173. \u0160io
  straipsnio tikslais laikoma, kad pajam\u0173 \u0161altinis yra toje valstyb\u0117je,
  kurios rezidentas pats ar kurio vardu i\u0161mokamos atitinkamos i\u0161mokos arba
  kurioje yra \u0161ias i\u0161mokas mokanti \u012fmon\u0117s nuolatin\u0117 buvein\u0117.\\n\\nPavyzdys\\n\\n2006
  m. studentas, Lietuvos rezidentas, gav\u0119s stipendij\u0105 i\u0161 Vilniaus Universiteto,
  i\u0161vyko \u012f 5 m\u0117nesi\u0173 sta\u017euot\u0119 Ispanijoje. Tokios studento
  gautos pajamos Ispanijoje, remiantis Sutarties 20 str. nuostatomis, neapmokestinamos.\\n\\nJei
  vienos Susitarian\u010diosios valstyb\u0117s studentas, sta\u017euotojas ar praktikantas
  mokosi kitoje Susitarian\u010dioje valstyb\u0117je ir finansavim\u0105 gauna i\u0161
  tos valstyb\u0117s, kurioje mokosi, praktikuojasi ar sta\u017euojasi, \u0161io straipsnio
  nuostatos netaikomos, o tokios studento, sta\u017euotojo ar praktikanto gautos i\u0161mokos
  apmokestinamos atsi\u017evelgiant \u012f Sutar\u010di\u0173 21 straipsnio nuostatas
  (Kitos pajamos).\\n\\nPavyzdys\\n\\nTarkime, Austrijos stipendij\u0173 fondas skiria
  stipendij\u0105 fiziniam asmeniui - Lietuvos rezidentui, kuris studijuoja Austrijoje.
  Atsi\u017evelgiant \u012f tai, kad Austrijoje studijuojantis Lietuvos rezidentas
  gauna stipendij\u0105 i\u0161 pa\u010dios Austrijos \u0161altinio, ji apmokestinama
  ne pagal Lietuvos \u2013Austrijos sutarties 20 straipsnio (Studentai), o pagal \u0161ios
  sutarties 22 (Kitos pajamos) straipsnio nuostatas. Kadangi pagal pastarojo straipsnio
  nuostatas tokios pajamos yra apmokestinamos tik pajam\u0173 gav\u0117jo rezidavimo
  valstyb\u0117je, teis\u0119 apmokestinti min\u0117t\u0105 stipendij\u0105 turi tik
  Lietuva.\\n\\n\u0160io straipsnio nuostatos bet kokiu atveju neapriboja rezidavimo
  valstyb\u0117s teis\u0117s apmokestinti toki\u0173 rezidento gaut\u0173 i\u0161mok\u0173
  pragyvenimui, mokslui ar sta\u017euotei. Ta\u010diau tuo atveju, jeigu \u0161ios
  i\u0161mokos apmokestinamos ir toje valstyb\u0117je, kurioje asmuo mokosi ar sta\u017euojasi
  (t.y. nei\u0161pildomos visos \u0161iame straipsnyje nustatytos s\u0105lygos, d\u0117l
  ko valstyb\u0117, kurioje asmuo mokosi, \u012fgyja teis\u0119 apmokestinti \u0161io\\n\\nasmens
  mokslui gautas pajamas), rezidavimo valstyb\u0117, jeigu jos vidaus teis\u0117s
  aktai nustato min\u0117t\u0173 i\u0161mok\u0173 apmokestinim\u0105, privalo u\u017etikrinti
  t\u0173 i\u0161mok\u0173 dvigubo apmokestinimo panaikinim\u0105.\\n\\nStraipsnio
  nuostatos netaikomos pajamoms, gautoms u\u017e studento, mokinio ar praktikanto
  suteiktas paslaugas. \u0160ios pajamos apmokestinamos remiantis Sutarties 15 straipsnio
  (Veikla, susijusi su darbo santykiais) nuostatomis ar 14 straipsnio (Individuali
  savaranki\u0161ka veikla) nuostatomis.\\n\\nPavyzdys\\n\\nSakykime, kad Danijos
  stipendij\u0173 fondas skiria 22 000 Lt stipendij\u0105 fiziniam asmeniui - Danijos
  rezidentui u\u017e 2006 - 2007 m. teis\u0117s studijas Lietuvos universitete. Pagal
  \u0161io straipsnio nuostatas, fizinio asmens - Danijos rezidento - pajamos Lietuvoje
  neapmokestinamos.\\n\\nTa\u010diau sakykime, kad \u0161is Danijos rezidentas, studijuodamas
  tame pa\u010diame Lietuvos universitete d\u0117sto dan\u0173 kalb\u0105. U\u017e
  \u0161ias paskaitas Lietuvos universitetas skiria jam 1500 Lt dyd\u017eio atlyginim\u0105.
  Tokios Lietuvoje studijuojan\u010dio fizinio asmens pajamos apmokestinamos remiantis
  Sutarties 15 straipsnio (Veikla, susijusi su darbo santykiais) nuostatomis.\\n\\nSutartyje
  vartojama s\u0105voka ,,praktikantas\\\" apima asmenis, kurie siun\u010diami sta\u017euotis
  \u012f kitos Susitarian\u010diosios valstyb\u0117s \u012fmon\u0119 ar \u012fstaig\u0105.
  Tuo atveju, kai praktikantas sta\u017euojasi Susitarian\u010diosios valstyb\u0117s
  \u012fmon\u0117je ar \u012fstaigoje ir tuo pa\u010diu gauna pajam\u0173 u\u017e
  suteiktas paslaugas, b\u016btina atskirti i\u0161mokas, gaunamas sta\u017euotei
  atlikti, kurios sta\u017eavimosi valstyb\u0117je bus neapmokestinamos ir i\u0161mokas
  u\u017e suteiktas paslaugas, kurioms apmokestinti taikomos Sutarties 15 straipsnio
  (Veikla susijusi su darbo santykiais) arba 14 straipsnio (Individuali savaranki\u0161ka
  veikla) nuostatos.\\n\\nI\u0161mokos, kurias savo pragyvenimui, mokslui ar sta\u017euotei
  gauna fizinis asmuo, turi b\u016bti pagr\u012fstos ir nevir\u0161yti protingos i\u0161laid\u0173
  sumos, kurios paprastai pakanka u\u017etikrinti tokio pob\u016bd\u017eio studijas,
  pragyvenim\u0105 ar sta\u017eavim\u0105si.\\n\\nSTRAIPSNIO \\\"STUDENTAI\\\" YPATUMAI
  PAGAL ATSKIRAS VALSTYBES\\n\\nUkraina, Uzbekistanas, Vokietija, Vengrija\\n\\nJAV\\n\\nSutarties
  20 straipsnio 1 paragrafe nustatyta:\\n\\n1.a) Fizin\u012f asmen\u012f, kuris yra
  Susitarian\u010diosios Valstyb\u0117s rezidentas atvykimo \u012f kit\u0105 Susitarian\u010di\u0105j\u0105
  Valstyb\u0119 dien\u0105 ir kuris laikinai gyvena toje kitoje Susitarian\u010diojoje
  Valstyb\u0117je, tur\u0117damas pagrindin\u012f tiksl\u0105:\\n(i) mokytis universitete
  ar kitoje toje kitoje Susitarian\u010diojoje Valstyb\u0117je pripa\u017eintoje mokymosi
  institucijoje arba\\n(ii) atlikti sta\u017euot\u0119, reikaling\u0105 \u012fgyjant
  profesini\u0173 ar specialyb\u0117s \u012fg\u016bd\u017ei\u0173, arba\\n(iii)mokytis
  ar atlikti tyrin\u0117jimus gaudamas tam stipendij\u0105, pa\u0161alp\u0105 ar apdovanojim\u0105
  i\u0161 valstybin\u0117s, religin\u0117s, labdaros, mokslo, literat\u016brin\u0117s
  ar \u0161vietimo organizacijos,\\n\\nta kita Susitarian\u010dioji Valstyb\u0117
  atleid\u017eia nuo mokes\u010dio, mokamo nuo \u0161io paragrafo b) punkte apra\u0161yt\u0173
  sum\u0173 ne ilgesniu kaip penkeri\u0173 met\u0173 laikotarpiu, prasidedan\u010diu
  jo atvykimo \u012f t\u0105 kit\u0105 Susitarian\u010di\u0105j\u0105 Valstyb\u0119
  dien\u0105.\\n\\nb) \u0160io paragrafo a) punkte minimos sumos yra:\\n(i) i\u0161
  u\u017esienio gaunamos ir jo pragyvenimui, \u0161vietimui, mokslui, tyrin\u0117jimams
  ar sta\u017euotei skiriamos i\u0161mokos (bet ne kompensacija u\u017e suteiktas
  paslaugas),\\n(ii) stipendija, pa\u0161alpa ar apdovanojimas ir\\n(iii) pajamos,
  gaunamos u\u017e toje kitoje Susitarian\u010diojoje Valstyb\u0117je teikiamas paslaugas,
  kuri\u0173 bendra suma bet kuriais mokestiniais metais nevir\u0161ija penki\u0173
  t\u016bkstan\u010di\u0173 Jungtini\u0173 Valstij\u0173 doleri\u0173 ($5,000) arba
  j\u0173 ekvivalento Lietuvos litais.\\n\\n\u0160ioje sutartyje, kaip ir kitose Sutartyse,
  nustatyta, kad Susitarian\u010dioji valstyb\u0117, kurioje kitos Susitarian\u010dios
  valstyb\u0117s rezidentas mokosi, sta\u017euojasi ar atlieka tyrin\u0117jimus, neapmokestina
  tam tikr\u0173 mokslui, sta\u017euotei ar tyrin\u0117jimams gaut\u0173 pajam\u0173,
  ta\u010diau ne ilgesn\u012f negu 5 met\u0173 laikotarp\u012f. Pasibaigus \u0161iam
  laikotarpiui, i\u0161mokos, gautos pragyvenimui, mokslui, tyrin\u0117jimams ar sta\u017euotei,
  apmokestinamos taikant sutarties 22 straipsnio (Kitos pajamos) nuostatas.\\n\\nBe
  to, i\u0161pl\u0117stas pajam\u0173, kurioms taikomas \u0161is Sutarties straipsnis,
  s\u0105ra\u0161as: jis taikomas tam tikroms stipendijoms, pa\u0161alpoms ir apdovanojimams,
  nepriklausomai nuo to, i\u0161 kurios valstyb\u0117s \u0161altini\u0173 \u0161ios
  l\u0117\u0161os gautos (ta\u010diau, atsi\u017evelgiant \u012f a) (iii) punkto nuostatas
  \u0161ios l\u0117\u0161os turi b\u016bti gautos i\u0161 valstybin\u0117s, religin\u0117s,
  labdaros, mokslo, literat\u016brin\u0117s ar \u0161vietimo organizacijos), o taip
  pat pajamoms, gautoms u\u017e kitoje susitarian\u010dioje valstyb\u0117je teikiamas
  paslaugas, jeigu \u0161i\u0173 paslaug\u0173 suma mokestiniais metais nevir\u0161ija
  5000 JAV doleri\u0173 (ar j\u0173 ekvivalento litais). Ta\u010diau pajamoms u\u017e
  teikiamas paslaugas \u0161is straipsnis taikomas tik tokiu atveju, jei jas gaunan\u010dio
  asmens buvimo kitoje susitarian\u010dioje valstyb\u0117je pagrindinis tikslas yra
  mokslas, sta\u017euot\u0117 ar tyrin\u0117jimai. Jeigu pajam\u0173 u\u017e paslaugas
  bendra suma mokestiniais metais vir\u0161ija 5 000 JAV doleri\u0173, apmokestinama
  tik \u0161\u012f dyd\u012f vir\u0161ijanti suma.\\n\\nSutarties 20 straipsnio 2
  paragrafe nustatyta:\\n\\n2. Fizin\u012f asmen\u012f, kuris yra Susitarian\u010diosios
  Valstyb\u0117s rezidentas atvykimo \u012f kit\u0105 Susitarian\u010di\u0105j\u0105
  Valstyb\u0119 dien\u0105 ir kuris kaip pirma min\u0117tos Susitarian\u010diosios
  Valstyb\u0117s rezidento darbuotojas arba pagal su \u0161iuo rezidentu sudaryt\u0105
  sutart\u012f laikinai gyvena toje kitoje Susitarian\u010diojoje Valstyb\u0117je,
  tur\u0117damas pagrindin\u012f tiksl\u0105:\\n\\nKinija (21 str.)\\n\\na) \u012fgyti
  technin\u0117s, profesin\u0117s ar komercin\u0117s-\u016bkin\u0117s veiklos patirties
  i\u0161 asmens, kuris n\u0117ra tas pirma min\u0117tos Susitarian\u010diosios Valstyb\u0117s
  rezidentas, arba\\nb) mokytis universitete ar kitoje toje kitoje Susitarian\u010diojoje
  Valstyb\u0117je pripa\u017eintoje mokymosi institucijoje,\\nta kita Susitarian\u010dioji
  Valstyb\u0117 dvylikos vienas po kito einan\u010di\u0173 m\u0117nesi\u0173 laikotarpiu
  atleid\u017eia nuo mokes\u010dio, mokamo nuo jo u\u017e paslaugas gaunam\u0173 pajam\u0173,
  jeigu j\u0173 bendra suma nevir\u0161ija a\u0161tuoni\u0173 t\u016bkstan\u010di\u0173
  Jungtini\u0173 Valstij\u0173 doleri\u0173 ($8,000) arba j\u0173 ekvivalento Lietuvos
  litais.\\n\\n\u0160is paragrafas taikomas tais atvejais, kai asmuo \u2013 vienos
  susitarian\u010dios valstyb\u0117s rezidentas - kitoje susitarian\u010dioje valstyb\u0117je
  mokosi ar sta\u017euojasi kaip pirmosios susitarian\u010dios valstyb\u0117s rezidento
  darbuotojas: jei vienos susitarian\u010dios valstyb\u0117s rezidentas, kuris yra
  tos pa\u010dios valstyb\u0117s subjekto darbuotojas kitoje susitarian\u010dioje
  valstyb\u0117je mokosi mokymosi institucijoje arba siekia \u012fgyti technin\u0117s,
  profesin\u0117s ar komercin\u0117s-\u016bkin\u0117s veiklos patirties ir jo bendra
  gaunam\u0173 u\u017e paslaugas pajam\u0173 suma nevir\u0161ija 8 000 JAV doleri\u0173
  (ar j\u0173 ekvivalento Lietuvos litais), tai studijavimo ar sta\u017eavimosi vietos
  valstyb\u0117 12 m\u0117nesi\u0173 laikotarpiu neapmokestina tokio darbuotojo pajam\u0173,
  gaut\u0173 u\u017e jo teikiamas paslaugas.\\n\\nSutarties 20 straipsnio 3 paragrafe
  nustatyta:\\n\\n3. Fizin\u012f asmen\u012f, kuris yra vienos i\u0161 Susitarian\u010di\u0173j\u0173
  Valstybi\u0173 rezidentas tuo metu, kai atvyksta laikinai gyventi \u012f kit\u0105
  Susitarian\u010di\u0105j\u0105 Valstyb\u0119, ir kuris laikinai gyvena kitoje Susitarian\u010diojoje
  Valstyb\u0117je ne ilgesniu kaip vieneri\u0173 met\u0173 laikotarpiu kaip tos kitos
  Susitarian\u010diosios Valstyb\u0117s Vyriausyb\u0117s remiamos programos dalyvis,
  tur\u0117damas pagrindin\u012f tiksl\u0105 sta\u017euotis, atlikti tyrin\u0117jimus
  ar mokytis, ta kita Susitarian\u010dioji Valstyb\u0117 atleid\u017eia nuo mokes\u010dio,
  mokamo nuo jo u\u017e taip sta\u017euojantis, atliekant tyrin\u0117jimus ar mokantis
  teikiamas paslaugas toje kitoje Susitarian\u010diojoje Valstyb\u0117je gaunam\u0173
  pajam\u0173, jeigu j\u0173 bendra suma nevir\u0161ija de\u0161imties t\u016bkstan\u010di\u0173
  Jungtini\u0173 Valstij\u0173 doleri\u0173 ($10,000) arba j\u0173 ekvivalento Lietuvos
  litais.\\n\\n\u0160is paragrafas taikomas tais atvejais, kai atitinkamos sumos yra
  gaunamos vienos valstyb\u0117s rezidentui dalyvaujant kitos valstyb\u0117s Vyriausyb\u0117s
  remiamoje programoje: jei vienos susitarian\u010dios valstyb\u0117s rezidentas,
  atvykstantis \u012f kit\u0105 susitarian\u010di\u0105 valstyb\u0119 kaip priiman\u010dios
  valstyb\u0117s Vyriausyb\u0117s remiamos programos dalyvis, tur\u0117damas pagrindin\u012f
  tiksl\u0105 sta\u017euotis, atlikti tyrin\u0117jimus ar mokytis ne ilgesniam kaip
  vieneri\u0173 met\u0173 laikotarpiui, priiman\u010dioje valstyb\u0117je yra atleid\u017eiamas
  nuo atitinkam\u0173 pajam\u0173, jeigu j\u0173 bendra suma nevir\u0161ija 10 000
  Jungtini\u0173 Valstij\u0173 doleri\u0173 arba j\u0173 ekvivalento Lietuvos litais.\\n\\nSutarties
  20 straipsnio 4 paragrafe nustatyta:\\n\\n4. \u0160is straipsnis netaikomas pajamoms,
  gaunamoms i\u0161 tyrin\u0117jim\u0173, kai tokie tyrin\u0117jimai atliekami ne
  visuomeniniais tikslais, o pirmiausia konkretaus asmens ar asmen\u0173 naudai.\\n\\n\u0160iame
  paragrafe nustatyti 20 straipsnio taikymo apribojimai tam tikriems tyrin\u0117jimams.
  Pavyzd\u017eiui, \u0161iame straipsnyje nustatytas atleidimas nuo mokes\u010di\u0173
  nebus taikomas i\u0161 ne pelno siekian\u010dios organizacijos gautoms dotacijoms,
  skirtoms koki\u0173 nors vaist\u0173 paie\u0161kai priva\u010dios kompanijos u\u017esakymu.\\n\\nBendrajame
  komentare nurodytas straipsnis \\\"Studentai\\\" \u012ftvirtintas Sutarties 21 straipsnyje.\\n\\nPranc\u016bzija\\n\\nSingap\u016bras\\n\\nSlov\u0117nija
  (21 str.)\\n\\nSutarties 21 straipsnyje nustatyta:\\n\\nStudentas, mokinys arba
  praktikantas, kuris yra arba prie\u0161 pat atvykdamas \u012f Susitarian\u010di\u0105j\u0105
  Valstyb\u0119 buvo kitos Susitarian\u010diosios Valstyb\u0117s rezidentas ir kuris
  pirma pamin\u0117toje Valstyb\u0117je tiktai mokosi, sta\u017euojasi, neapmokestinamas
  toje pirma pamin\u0117toje Valstyb\u0117je u\u017e tokias savo pragyvenimui, mokslui
  ar sta\u017euotei jo gautas pajamas:\\n\\na) mok\u0117jimus, gautus i\u0161 \u0161altini\u0173,
  esan\u010di\u0173 u\u017e tos Susitarian\u010diosios Valstyb\u0117s rib\u0173, ir
  skirtus jo pragyvenimui, mokslui, studijoms, tyrimams ar sta\u017euotei,\\nb) dotacijas,
  stipendijas ar apdovanojimus, kuriuos suteikia Vyriausyb\u0117 arba mokslo, \u0161vietimo
  ar kult\u016bros organizacija.\\n\\nSutarties 21 straipsnio b punkte i\u0161skiriami
  papildomi pajam\u0173 i\u0161mok\u0117jimo \u0161altiniai, kuri\u0173 i\u0161mokamos
  pajamos neapmokestinamos priiman\u010diojoje valstyb\u0117je: tai bet kokios dotacijos,
  stipendijos ar apdovanojimai, kuriuos studentui, mokiniui arba praktikantui suteikia
  Vyriausyb\u0117 arba mokslo, \u0161vietimo ar kult\u016bros organizacija jo pragyvenimui,
  mokslui ar sta\u017euotei.\\n\\nSutarties 20 straipsnio 2 paragrafe nustatyta:\\n\\n2.
  Neatsi\u017evelgiant \u012f 14 ir 15 straipsni\u0173 nuostatas, atlyginimai, kuriuos
  u\u017e individualias paslaugas, suteiktas Susitarian\u010diojoje Valstyb\u0117je,
  gauna studentas arba mokinys, arba praktikantas, kuris yra arba prie\u0161 pat atvykdamas
  \u012f t\u0105 Valstyb\u0119 buvo kitos Susitarian\u010diosios Valstyb\u0117s rezidentas
  ir kuris pirma pamin\u0117toje Valstyb\u0117je tiktai mokosi ar sta\u017euojasi,
  neapmokestinami toje Valstyb\u0117je su s\u0105lyga, kad \u0161ios paslaugos susijusios
  su jo mokymusi ar sta\u017eavimusi ir yra atsitiktin\u0117s arba atlyginimai u\u017e
  tokias paslaugas yra b\u016btini papildant jo \u017einioje esan\u010dius ir jo pragyvenimui
  skirtus i\u0161teklius.\\n2 paragrafe \u012ftvirtinamos papildomos nuostatos d\u0117l
  student\u0173, mokini\u0173 ar praktikant\u0173 gaunam\u0173 pajam\u0173 neapmokestinimo:
  atlyginimas, gautas u\u017e tokio asmens paslaugas, suteiktas Susitarian\u010diojoje
  Valstyb\u0117je, yra neapmokestinamas, jeigu tokios paslaugos yra susijusios su
  jo mokymusi ar sta\u017eavimusi ir yra atsitiktin\u0117s arba atlyginimai u\u017e
  tokias paslaugas yra b\u016btini papildant jo \u017einioje esan\u010dius ir jo pragyvenimui
  skirtus i\u0161teklius.\\n\\nSutarties 20 straipsnio 2 paragrafe nustatyta:\\n\\n2.
  Praktikanto atveju \u0161io straipsnio 1 dalies nuostatos taikomos tik i\u0161mokoms
  mokymosi ar praktinio tobulinimosi laikotarpiu, nevir\u0161ijan\u010diu dvylikos
  m\u0117nesi\u0173 nuo tos dienos, kai jis tokiu tikslu \u012f pirma min\u0117t\u0105
  Valstyb\u0119 atvyko pirm\u0105 kart\u0105.\\n2 paragrafe \u012ftvirtinamos praktikant\u0173
  gaunam\u0173 atlyginim\u0173 neapmokestinimo s\u0105lygos: i\u0161mokos, skiriamos
  mokymuisi ar praktiniam tobulinimuisi, toje valstyb\u0117je neapmokestinamos ne
  ilgiau kaip 12 m\u0117nesi\u0173 laikotarpiu nuo tos dienos, kai jis tokiu tikslu
  pirm\u0105 kart\u0105 atvyksta \u012f t\u0105 valstyb\u0119.\\n\\nBendrajame komentare
  nurodytas straipsnis \\\"Studentai\\\" \u012ftvirtintas Sutarties 21 straipsnyje.\\n\\nSutarties
  21 straipsnio 2 paragrafe nustatyta:\\n\\n2. 1 dalies nuostatos netaikomos pajamoms,
  gautoms i\u0161 mokslo tiriamojo darbo, jei toks tiriamasis darbas vykdomas ne valstyb\u0117s
  interesais, o pirmiausia juo siekiama kito konkretaus asmens ar asmen\u0173 asmenin\u0117s
  naudos.\\n\\n\u0160iame paragrafe nustatyti straipsnio taikymo apribojimai tam tikriems
  tyrin\u0117jimams. Pvz. \u0161iame straipsnyje nustatytas atleidimas nuo mokes\u010di\u0173
  nebus taikomas i\u0161 ne pelno siekian\u010dios organizacijos gautoms dotacijoms,
  skirtoms koki\u0173 nors vaist\u0173 paie\u0161kai priva\u010dios kompanijos u\u017esakymu.\\n\\nD\u0116STYTOJAI
  IR TYRIN\u0116TOJAI\\n\\nBendras komentaras\\n\\n\u0160is straipsnis nustato d\u0117stytoj\u0173
  ir tyrin\u0117toj\u0173 \u2013 vienos Susitarian\u010dios valstyb\u0117s rezident\u0173,
  d\u0117stan\u010di\u0173 ar atliekan\u010di\u0173 tiriamuosius darbus kitoje Susitarian\u010dioje
  valstyb\u0117je, neapmokestinimo atvejus.\\n\\nStraipsnis \\\"D\u0117stytojai ir
  tyrin\u0117tojai\\\" yra tik keliose Lietuvos sudarytose Sutartyse.\\n\\n1. Fizinis
  asmuo, kuris Susitarian\u010diojoje Valstyb\u0117je lankosi d\u0117stymo arba tiriamojo
  darbo atlikimo universitete, koled\u017ee arba kitoje toje Susitarian\u010diojoje
  Valstyb\u0117je pripa\u017eintoje mokymo \u012fstaigoje tikslais ir kuris yra arba
  prie\u0161 pat atvykdamas buvo kitos Susitarian\u010diosios Valstyb\u0117s rezidentas,
  pirmiau min\u0117toje Susitarian\u010diojoje Valstyb\u0117je atleid\u017eiamas nuo
  mokes\u010di\u0173, imam\u0173 nuo atlyginimo u\u017e tok\u012f d\u0117stym\u0105
  arba tiriam\u0105j\u012f darb\u0105, bet ne ilgiau kaip dvejus metus, skai\u010diuojant
  nuo jo pirmojo atvykimo \u012f t\u0105 Valstyb\u0119 tokiais tikslais dienos.\\n\\nKomentaras\\n\\n\u0160io
  straipsnio nuostatos taikomos i\u0161mokoms, kurias d\u0117stytojai ar tyrin\u0117tojai,
  vienos Susitarian\u010diosios valstyb\u0117s rezidentai, gauna u\u017e d\u0117stym\u0105
  ar atliekam\u0105 tiriam\u0105j\u012f darb\u0105 kitos Susitarian\u010diosios valstyb\u0117s
  universitete, koled\u017ee arba kitoje pripa\u017eintoje mokymo \u012fstaigoje.\\n\\nSusitarian\u010dioji
  valstyb\u0117, kurioje fizinis asmuo, kitos Sutarian\u010diosios valstyb\u0117s
  rezidentas, d\u0117sto arba atlieka tyrimus, du metus nuo fizinio asmens pirmo atvykimo
  tokiais tikslais dienos jo gaunamo atlyginimo neapmokestina, jeigu:\\n\\n tas d\u0117stytojas
  ar tyrin\u0117tojas yra pirmosios Susitarian\u010dios valstyb\u0117s rezidentas
  ar juo buvo prie\u0161 pat atvykdamas \u012f kit\u0105 Susitarian\u010di\u0105j\u0105
  valstyb\u0119,\\n asmuo kitoje susitarian\u010dioje valstyb\u0117je lankosi d\u0117stymo
  ar tiriamojo darbo tikslais ir atlyginimas gaunamas u\u017e t\u0105 d\u0117stym\u0105
  ar tiriam\u0105j\u012f darb\u0105, ir\\n d\u0117stoma ar atliekami tyrimai universitete,
  koled\u017ee arba kitoje toje Susitarian\u010diojoje Valstyb\u0117je pripa\u017eintoje
  mokymo \u012fstaigoje.\\n\\n\u0160io straipsnio nuostatos bet kokiu atveju neapriboja
  rezidavimo valstyb\u0117s teis\u0117s apmokestinti toki\u0173 rezidento gaut\u0173
  atlyginim\u0173, kuriuos rezidavimo valstyb\u0117 apmokestina pagal savo vidaus
  teis\u0117s akt\u0173 nuostatas. Ta\u010diau tuo atveju, jeigu \u0161ie atlyginimai
  apmokestinami ir toje valstyb\u0117je, kurioje asmuo d\u0117sto ar atlieka tiriamuosius
  darbus (t.y., kai Sutartis suteikia teis\u0119 tokius atlyginimus apmokestinti valstyb\u0117je,
  kurioje asmuo d\u0117sto), tai rezidavimo valstyb\u0117, jeigu jos vidaus teis\u0117s
  aktuose \u012ftvirtintos min\u0117t\u0173 atlyginim\u0173 apmokestinimo nuostatos,
  privalo u\u017etikrinti t\u0173 atlyginim\u0173 dvigubo apmokestinimo panaikinim\u0105.\\n\\nPavyzdys\\n\\nItalijos
  universitete d\u0117stantis Lietuvos rezidentas du metus nuo jo d\u0117stymo prad\u017eios,
  remiantis Lietuvos \u2013 Italijos sutarties nuostatomis, Italijoje buvo atleid\u017eiamas
  nuo mokes\u010di\u0173, susijusi\u0173 su atlyginimo gavimu, bet tre\u010diaisiais
  jo d\u0117stytojavimo metais pajamos, gautos u\u017e d\u0117stytojavim\u0105, prad\u0117tos
  apmokestinti pagal Italijos vidaus teis\u0117s akt\u0173 nuostatas. Ta\u010diau
  d\u0117stytojo, kaip Lietuvos rezidento, visais metais gautos pajamos Lietuvoje
  apmokestinamos pagal Gyventoj\u0173 pajam\u0173 mokes\u010dio \u012fstatymo nuostatas,
  nepriklausomai nuo to, kada apmokestinimo teises \u012fgyja ir Italija.\\n\\nAtkreiptinas
  d\u0117mesys, kad, atsi\u017evelgiant \u012f tai, kad tre\u010diaisiais d\u0117stymo
  metais Italija taip pat turi teis\u0119 apmokestinti tok\u012f Lietuvos d\u0117stytojo
  gaut\u0105 atlyginim\u0105, Lietuva, atsi\u017evelgdama \u012f sutarties 25 straipsn\u012f
  (Dvigubo apmokestinimo panaikinimas) bei  vadovaudamasi Gyventoj\u0173 pajam\u0173
  mokes\u010dio  \u012fstatymo nuostatomis, privalo u\u017etikrinti dvigubo tokio
  atlyginimo apmokestinimo panaikinim\u0105.\\n\\n2. 1 dalies nuostatos netaikomos
  pajamoms, gaunamoms u\u017e tiriam\u0105j\u012f darb\u0105, jei toks tiriamasis
  darbas vykdomas ne visuomeniniais interesais, o vis\u0173 pirma konkretaus asmens
  arba asmen\u0173 naudai.\\n\\n2 paragrafe nustatomos 1 paragrafo nuostat\u0173 taikymo
  i\u0161imtys.\\n\\nJei tiriamasis darbas mokymo \u012fstaigoje bus atliekamas konkre\u010di\u0173
  asmen\u0173 ar asmens naudai, o ne visuomeniniais tikslais (pvz., mokymo \u012fstaigoje
  tyrimai atliekami pelno siekian\u010dios organizacijos u\u017esakymu) tyr\u0117jo
  gautoms pajamoms nebus taikomos \u0161io straipsnio 1 paragrafo nuostatos, tod\u0117l
  tokios pajamos bus apmokestinamos vadovaujantis Sutar\u010di\u0173 14 (Individuali
  veikla), 15 (Samdomas darbas) ar 21 straipsnio (Kitos pajamos) straipsni\u0173 nuostatomis.
  Ta\u010diau tuo atveju, kai tyrimas buvo atliekamas visuomeniniais tikslais, o v\u0117liau
  tyrimo rezultatas tapo priva\u010dios \u012fmon\u0117s nuosavybe, i\u0161 tokio
  tyrimo gautoms pajamoms \u0161io straipsnio 1 dalies nuostatos gali b\u016bti taikomos.\\n\\nPavyzdys\\n\\nPelno
  nesiekianti organizacija u\u017esak\u0117 1 metus trunkan\u010dius Lenkijos mokymo
  \u012fstaigoje atliekamus mokslinius tyrimus, susijusius su vaist\u0173 retoms ligoms
  gydyti suk\u016brimu. \u0160i\u0173 tyrim\u0173 rezultatas v\u0117liau tapo kitos,
  pelno siekian\u010dios organizacijos nuosavybe. Neatsi\u017evelgiant \u012f tai,
  tyrimus atlikusi\u0173 Lietuvos tyr\u0117j\u0173 gautiems atlyginimams sutarties
  21 straipsnio 1 paragrafo nuostatos b\u016bt\u0173 taikomos, t.y. Lenkijoje jie
  b\u016bt\u0173 atleid\u017eiami nuo mokes\u010dio.\\n\\nSTRAIPSNIO \\\"D\u0116STYTOJAI
  IR TYRIN\u0116TOJAI\\\" YPATUMAI PAGAL ATSKIRAS VALSTYBES\"", "\"\\\"L.K.B. Kronika\\\"
  Nr. 27\\n\\nKun. Ra\u010di\u016bno vargai su rajono pareig\u016bnais\\n\\nVietin\u0117
  administracija nepaiso nei soviet\u0173 \u012fstatym\u0173, nei tarptautini\u0173
  \u012fsipareigojim\u0173\\n\\n(Tiesinis i\u0161 vakar dienos)\\n\\nReikalavimas
  gauti \u0160ak\u0173 rajono leidim\u0105 laikyti pamaldas ba\u017eny\u010dioje ar
  draudamas apiegas atlikti Ba\u017eny\u010dios drausmei nenusikaltusiams kunigui
  tiesiogiai priestarauja:\\n\\n1. Taryb\u0173 S\u0105jungos Konstitucijos 124 straipsnio.
  Konstitucija sako: \\\"Religinio kulto atlikimo ir antireligin\u0117s propagandos
  laisv\u0119 pripa\u017e\u012fsta vienims pilie\u010diams\\\". Pabr\u0117\u017eiama
  vienims, t.y. ne tik turintiems rajono Vykdomojo komiteto leidim\u0105 ar regstacijos
  pa\u017eym\u0117jim\u0105.\\n\\n2. Priestarauja Katalik\u0173 Ba\u017eny\u010dios
  kanon\u0173 kodeksus. Taryb\u0173 S\u0105jungoje Ba\u017eny\u010dia yra atskirta
  nuo valstyb\u0117s, tod\u0117l teise spresti kas, kur, kaip ir ka\u017eka gali atlikti
  kulto apeigas priklauso ne taryb\u0117s vald\u017eios pareig\u016bnams, o Ba\u017eny\u010dios
  vadov\u0117bei. Ta mint\u012f patvirtina Katalik\u0173 Ba\u017eny\u010dios kanon\u0173
  kodeksas (Can.1260): \\\"Ba\u017eny\u010dios dvasininkai, atliktai-\\n\\nmi kulto
  apeigas, teturi priklausyti nuo ba\u017enytinio vir\u0161 ninko\\\".\\n\\n3. Tiesiogiai
  priestarauja Visuotin\u0117 \u017emogaus teisi\u0173 deklaracijai. Ji sako: \\\"Kiekvienas
  \u017emogus turi teise i m nties, sa\u017ei\u016bn\u0117s ir religijos laisve. \u0160i
  teise apima ir laisv\u0119 i\u0161pa\u017einti religij\u0105 arba i\u0161sitikintumis
  pav''entui ir kartu su kitais, vie\u0161ai arba priva\u010diai, mokslo skelbimu,
  pamaldomis ir religin\u0117mis bei ritualin\u0117mis s apeigomis (18 str.). Taigi
  bet kokis draudimas laikyti pamaldas nei ba\u017enytin\u0117je drausmei nemusikalusiam
  kunigui yra ai\u0161kus Visuotin\u0117s \u017emogaus teisi\u0173 deklaracijos pa\u017ei\u016br\u0117mas.\\n\\n4.
  Tiesiogiai priestarauja Hel sinkio konferencijos susitarimams. Ta kas, saugumo ir
  bendradarbiavimo labui 1975 liepos 30-rugpj\u016b\u010dio 1 l Helsinkyje susiguo
  saugumo ir bendradarbiavimo pasitarimo u\u017esienio dokumentas pasira\u0161ytas
  L. Bre\u017enev\u0105 Taryb\u0173 S\u0105jungos ir Respublik\u0173 S\u0105jungos
  vardu. VII skyriuje \\\"\u017dmogaus teisi\u0173 ir pagrindini\u0173 laisvi\u0173\\\"
  i\u0161sakant minties, sa\u017ei\u016bn\u0117s, religijos ir i\u0161sitikintum\u0173
  laisve, gerbimos\\\" sakoma: \\\"Dalyvaujan\u010dios valstyb\u0117s gerbs \u017emogaus
  teises ir pagrindines laisves, i\u0161sakant minties, sa\u017ei\u016bn\u0117s, religijos
  ir i\u0161sitikintum\u0173 laisve, nepaisant skirtingos ras\u0117s, lyties, kalbos
  ir religijos... \u0160ia prasm\u0119 Dalyvaujan\u010dios valstyb\u0117s i\u0161pa\u017e\u012fsta
  ir gerbs asmenin\u0117s laisv\u0119 i\u0161pa\u017einti vienasmeni\u0161kai ar bendrai
  su kitais religija arba tikiyb\u0105, veikiant pagal savo paties sa\u017eiune\\\".
  (Tai-\u0161i parai\u0161ka sa\u017eiune, o ne pagal rajono Vykdomojo komiteto leidim\u0105
  \u2014Mano pastaba). \\\"Dalyvaujan\u010dios valstyb\u0117s i\u0161pa\u017e\u012fsta
  visuotin\u0117s \u017emogaus teis\u0173 ir pagrindini\u0173 laisvi\u0173 reik\u0161m\u0119:
  j\u0173 gerbimas yra esminis veiksmys taikos, teisingumo ir gerov\u0117s, reikalingos
  draugi\u0161kiems santykiams ir bendradarbiavimui taip ju, kaip ir tarp vis\u0173
  valstybi\u0173 pl\u0117toti\\\".\\n\\n\u0160ios deklaracijos X-me skyriuje \\\"S\u0105jungin\u0117s
  \u012fsipareigojim\u0173 pagal tarptautin\u0119 teis\u0119\\\" vykdymas ra\u0161oma:\\n\\n(Bus
  daugiau)\\n\\nKinijos d\u0117mesys \u017eem\u0117s ukiui\\n\\nPekinas. \u2014 Kin\u0173
  \u017eini\u0173 agent\u016bra Hsinhua sako, kad reformuojant ekonomik\u0105 administracija
  valstyb\u0117 bus padalinta \u012f \u0161e\u0161is ukin\u0117s rajonus, ir did\u017eiausias
  d\u0117mesys bus kreiptamas \u012f \u017eem\u0117s uki.\\n\\nLietus paskandino Kansas
  City\\n\\nKansas City. \u2014 Nepaprastas lietuvis i\u0161siliko Kansas City. Per
  24 valandas prilyjo 12 t\u016bkst. Blue River i\u0161silijo 13 krant\u0173, kai
  vanduo pakilo 20 ped\u0173. Mieste \u017emon\u0117s gelb\u0117jojosi ant stogo,
  automobili\u0173, v\u0117joj\u0117 ir telefoni\u0173 stulpus. Vakar bent septyni
  \u017emon\u0117s buvo nukent\u0117j\u0119. Daugeliu liko be elektros energijos ir
  nat\u016brali\u0173 duj\u0173. Prasid\u0117jo ir pl\u0117\u0161imai, kai policija
  ir gaisrininkai buvo u\u017esi\u0117m\u0119 \u017emones gelb\u0117ti. Gretkelis
  Nr. 35 neprava\u017eiuojamas.\\n\\nCholera Vid. Rytuose\\n\\nDamaskas. \u2014 Sirijoje
  ir Jordani\u0173 plinta cholera. Iki \u0161iol u\u017eregistruota 70 mirusi\u0173
  ir 2,300 susirgusi\u0173. I\u0161 atostog\u0173 atsikautus visi medicinos personalas.\\n\\nPekinas.
  \u2014 Kinija i\u0161band\u0117 vai ruojam\u0105 raketa su atomine galvute, prane\u0161\u0117
  Kinijos \u017eini\u0173 agent\u016bra. Nesakoma, kada buvo atlikti tokie bandymai.\\n\\nAntibes.
  Pranc\u016bzija. \u2014 Prie\u0161 Irano \u0161acho seser\u012f Ashraf buvo pasik\u0117sin\u0117mis
  pranc\u016bz\u0173 Rivieroje. Nu\u0161auta jos palydov\u0117 ir per\u0161autas \u0161eiferis,
  bet princes\u0117 nebuvo su\u017eeista.\\n\\nWashingtonas. \u2014 Senatas 55-27
  balsais pri\u0117m\u0117 \u012fstatymo projekt\u0105 nuo 1980 met\u0173 leisti gaminti
  tik tokius automobilius, kurie su vienu galionu gazolinio nuvia\u017eiuoja ne ma\u017eiau
  kaip 16 myli\u0173.\\n\\nWashingtonas. \u2014 Christopher Boyce, 24 met\u0173, vieno
  FBI agento s\u016bn\u016bs, nateistas 40 met\u0173 u\u017e CIA \u017eini\u0173 perdavim\u0105
  sovietams. Boyce dirbo vienoje gynyb\u0117s \u012fmon\u0117je.\\n\\nMed\u017eiaga
  Belgrado konferencijai\\n\\nLietuviai gina Pavolgio vokie\u010dius\\n\\nLietuvos
  visuomenin\u0117 grup\u0117 Helsinkio susitarim\u0173 vykdymui remti\\n\\nDOKUMENTAS
  Nr. 6\\n\\nAntrojo pasaulinio karo metais Stalinas \u012fvykd\u0117 viena did\u017eiausi\u0173
  i\u0161 \u0161imtme\u010dio nusikaltim\u0173: i\u0161trem\u0117 i\u0161tisas tautos
  i\u0161 j\u0173 teritorij\u0173, i\u0161tr\u0117m\u0117j\u0173 \u017eemes apgvendindamas
  svetimais ateitiniams. Toks likimas i\u0161tiko Krymo totorius, Pavolgio vokie\u010dius,
  kalmukus, ing\u016bsus, \u010d\u0117\u010denus, kabardus, balkarus ir kt. Dv\u0117\u0161imt
  ketveriems metams pra\u0117jus nuo tiro no mirties, i mus kreip\u0117si keturiadisetis
  devyni\u0173 Pavolgio vokie\u010di\u0173 \u017eemos, gyvenan\u010dios Lietuvoje,
  Radvili\u0161kio rajone. apra\u0161ydamos, kaip Pavolgio vokie\u010diai vis dar
  tebeilaikomi u\u017e \u012fstatym\u0173 rib\u0173; jiem \u012fvairiausiais b\u016bdais
  trukdoma prisiregistruoti ir i\u0161darbinti. Vokie\u010diai kreip\u0117si \u012f
  pagrindines Maskvos ir Vilniaus administracin\u0117s instancijas, bet pagalbai nesilaik\u0117.
  Tod\u0117l jie pastat\u0117, kad nesimokaus j\u0117mus pili\u010di\u0173 lygiateisikuomis,
  nes atsiskys tarybin\u0117s piliet\u0117s ir reikalaus i\u0161va\u017eiavimo \u012f
  savo senaj\u0105 tariorin\u0119 t\u0117vyn\u0119 \u2014 Vokie\u010di\u0173 Federatyvine
  Respublika.\\n\\nTokiu b\u016bdu pa\u017eeid\u017eiamas 1965 \u012fsakas, atsakant\u012f
  suvar\u017eymus, ta komus vokie\u010diams TSRS teritorijoje, pa\u017eeid\u017eiami
  pati TSRS konstitucija, tarptautinis paktas apie pilietines ir politines teises.\\n\\nHelsinkio
  susitarim\u0173 vykdymui remti Lietuvos visuomenin\u0117 grup\u0117 parei\u0161kia,
  kad toks nesi\u0173janti\u0173 Pavolgio vokie\u010di\u0173 pers\u0117kiojimas priestarauja
  ir Helsinkio susitarim\u0173 dvasiai.\\n\\nPagrindas:\\n\\n1. Parei\u0161kimas su
  keturiadisetis septyniais para\u0161ais (rus\u0173 kalba),\\n2. Parei\u0161kimas
  su keturiadisetis devyniais para\u0161ais (rus\u0173 kalba).\\n\\nKun. Karolis Garu\u010das\\nEilanas
  Finkelsteinas\\nOna Lukausait\u0117-Po\u0161kien\u0117\\nViktoras Petkus\\nTomas
  Venelou\\nVilnius, 1977.III.19\\n\\nNenaudingai praleid\u017eia laik\u0105\\n\\nBonna.
  \u2014 Greta Garbo, pri\u017ei\u016br\u0117ta geriausia film\u0173 aktore, kokia
  kada buvo, pirm\u0105 kart\u0105 po 30 met\u0173 vokie\u010di\u0173 laikra\u0161\u010diams
  dav\u0117 pasikalb\u0117jim\u0105 ir sako kad, baigusi film\u0173 karjer\u0105,
  gyvenim\u0105 praleido nenaudingais. Dabar esa sunku atsakyti.\\n\\nGarbo gyvena
  atsiskyrel\u0117s gyvenim\u0105, niekas jos nemato, nors per metus apie 10 m\u0117nesi\u0173
  praleid\u017eia savo namuose New Yorke ir por\u0105 m\u0117nesi\u0173 \u0160veicarijos
  kalne.\\n\\nLibane neramu\\n\\nBeirutas. \u2014 Jau kuris laikas, kai Libano pietuose
  vyksta susidaudymai tarp krik\u0161\u010dioni\u0173 ir pa\u0161telieti\u0173, kai
  kairi\u0173j\u0173 musulmon\u0173, krik\u0161\u010dioni\u0173 naujausi i\u0161sik\u0117ra
  ir Izraelio l\u0117ktuv\u0173 arba artilerija. Amerikos diplomatai visk\u0105 daro,
  kad nekilpt\u0173 naujas pilietinis karas, baro\u0161o \u0161velninti pad\u0117t\u012f,
  tarpininkauja tarp arab\u0173 ir Izraelio.\\n\\nKALENDORIUS\\n\\nRugs\u0117jo 14:
  Maternas, Notburga, Eivisvinas, Asta.\\nRugs\u0117jo 15: Nikodemas, Melitina, Vismantas,
  Nautinga.\\nSaul\u0117 teka 6:28, leid\u017eiasi 7:04.\\n\\nORAS:\\n\\nDalinai saul\u0117tai,
  \u0161iltiau, apie 1/2 laipniai.\\n\\nMIN\u010cI\u0172 JUOSTA\\n\\n\u0160e\u0161tasis
  vyr. skaut\u0173, gintar\u0173, sk. vy\u010di\u0173 ir j\u016br\u0173 bud\u017ei\u0173
  saskrydis Dainavoje\\n\\nPaskutiniojo vakaro, rugs\u0117jo 3 d., i\u0161 Toronto,
  New Yorko, Chicago ir Detroitu prad\u0117jo rinktis ses\u0117s i\u0161 Lietuvos
  Dainavos Juosto atkaklio vyr. sk. Dalia Rudys ir sk. vyr. Saulius Anuzis, atskleid\u0117,
  paskyr\u0117 kambarius ir palink\u0117jo j\u0117bos nakties ne\u0161e toliu saragb\u0105
  prie registracijos. \u0160e\u0161tadienio ryta, visus prik\u0117l\u0117 stiprus
  brolio Sauliaus balsas ir kvie\u010d\u0117 pusy\u010diauti. Saskryd\u017eio \u0161eiminink\u0117s,
  vyr. skaut\u0117 Viktorija ir Kristina Janukt\u0117 drauge su vyr. sk. \u017eidin\u0117s\u0117se
  ses\u0117 Zalaukin\u0117se visas skautai pavaldygino, ir vos tik sp\u0117jom \u012fsigerti
  antro kvaro puoduk\u0105 \u2014 saskryd\u017eio atidarymas.\\n\\n\u0160eiminink\u0117s
  \\\"Min\u010di\u0173 juostos\\\" vadov\u0117s, Vir\u0161il\u0117n\u0117s, kapelionas
  v.s. A. Saulaitis, S.J., ses\u0117 vir\u0161inink\u0117 vyr. sk. Violeta Abarait\u0117,
  komendant\u0117 vyr. sk. Paulita Abra\u0161i\u016bt\u0117, brolio vir\u0161inink\u0117s
  v.v. Ram\u016bnas Savickas ir komendantas Tomas R\u016bdys. V\u0117lavios pakyla,
  himnas ir arti 80 ses\u0117s ir broli\u0173 prad\u0117da savo \u0161e\u0161t\u0105j\u0105
  saskryd\u012f.\\n\\nKad saskryd\u017eiui pasibaigus neketink\u0173 ne vieno nepie\u0161tamato
  ses\u0117s ar brolio, brolis Saulaitis praveda idom\u0173 suspa\u017einimo \u017eaidim\u0105,
  kurio metu dalyviai su ra\u0161yti pa\u0161alba supina saskryd\u017eio vard\u0105
  \\\"Min\u010di\u0173 Juosta\\\".\\n\\nPirmos svetainybos \u2014 \\\"Lietuvos v\u0117liavos\\\"
  Dalyv\u0117s \u2014 vyr. skaut\u0117 A. Banionyt\u0117 ir G. Grigai\u010dien\u0117,
  pateikia dalyviams savo mintis ir \u0161vygmenim, kas atstins ka sukuris m\u016bri\u0173
  keima arba grynai lietuvi\u0161ka. Tema aktuali, ypa\u010d \u0161io am\u017eiaus
  jaunimui, kurie patys artimoje ateityje gal tur\u0117s padaryti tok\u012f pat apsisprendim\u0105.
  Po diskusij\u0173 pletusi, linksmas sportas, \u017eaidimai ir maudymas.\\n\\nNors
  dar vakaras toli, bet visi skubiai \u012f u\u017etemdyt\u0105 kambari pama\u017etyni
  fil. P. Peniko paruo\u0161ta ir atve\u017eta Seserijos film\u0105 1973 met\u0173
  jubiliejui \\\"Svajon\u0117\\\". Bendrai, pasirod\u0117 lietuvi\u0161k\u0173 \u0161vies\u0173,
  geltonlapini\u0173, vyr. skaut\u0173 ir j\u0173 vadov\u0173 veidai. Jos dirba, \u017eaid\u017eia
  sportuota ir lygiokia. Ne viena ten sedin\u0117s ses\u0117 aptaiga save, savo drauge
  ar vadove.\\n\\nV.s. A. Saulai\u010dio pa\u0161nek\u0117s apie lietuvi\u0173 visuomen\u0119,
  aktyv\u0173 jos veikim\u0105, atradim\u0105 nauj\u0173 bud\u0173 su\u0161iekto ir
  surag\u0161int\u0173 lietuvin\u012f \u012f aktyviju esantes, pra\u0117ina su dideliu
  pasiekimu. Pa\u0161nek\u0117s buvo u\u017ebaigtas parodom skraidin\u012f i\u0161
  Brolia\u017eio lietuvi\u0173 gyvenimo bei brolio Saulaitio pasakojim\u0173 savo
  asmenski\u0173 \u0161vygmeny\u0173 dirbant el\u0117je met\u0173 tarpu.\\n\\nV\u0117lavi\u0173
  ne\u012fd\u0117lio metu su laukiai prad\u0117jo \\\"te\u0161\u0117lo\\\" ir administratoriaus
  (nors jis save ir pasivadinuo \\\"Kirviu\\\") v.s. J. Asmino, kuris arve\u017e\u0117
  mie\u0161a die\u010dia, LSS Tarybos Pirminkv\u0117s v.s. L. Milukien\u0117.\\n\\nDalyv\u0117\\n\\n\\\"AU\u0160ROS
  VART\u0172\\\"\\nTUNTO SVEIGA\\n\\nPirmoji postovykl\u0117s \\\"Au\u0161ros Vart\u0173\\\"
  skaut\u0173 tunto sveiga \u012fvyks sekmandin\u0117, rugs\u0117jo 18 d., Jaunimo
  Centro did\u017eiojoje sal\u0117je. Visos ses\u0117s, pilnose uniformose, renkasi
  9:30 val. ryto. Sveiga bus prad\u0117ta dalyvavimui v.s. Misi\u0173 koj\u0117je.
  Po pamald\u0173 ir likim\u0173 sveiga su\u0117g\u0117ja ir va\u017eieliai. Visi
  dalyvav\u0119 privokal\u0117s. T\u0117veliai priskiria. I\u0161laikai atversti ses\u0117s
  nei puntuokumas yra vienas i\u0161 skaut\u0173k\u0173j\u0173 privalum\u0173. Sveigoje
  kvie\u010diami dalyvauti vie\u0161eliai, sve\u010diai ir visos bet kada \\\"Au\u0161ros
  Vart\u0173\\\" tume skautuojusis ses\u0117s.\\n\\nKvie\u010diame naujas nare, ypa\u010d
  \\\"Nerijos\\\" ir skaut\u0173 tunto \\\"Ve\u0161ties\\\" laivo udr\u0117tys un
  vadov\u0117mis g. v. Easa Jovaruasait\u0117 ir g. v. v. Loreta Andrijausait\u0117
  pasira\u0161uosius prad\u0117ti nauj\u0105 metus krieda visas j\u016brin\u012f skautavim\u0105
  susidom\u0117jusias lietuviav\u00e9s isjungt\u0173 i j\u016br\u0173 skaut\u0173
  el\u0117s. J\u0173 sveiga vyksta kiekviena sekmandin\u0117 10-11 val. ryto Jaunimo
  Centre. Del informacij\u0173 telefonuokite tuntinink\u0117s ps. Dalei Gotcei\u010dienei,
  246-5420.\\n\\nPRASIDEI\u0160A \\\"NERIJOS\\\"\\nTUNTO SUEIG\u0116S\\n\\n\\\"Nerijos\\\"
  j\u016br\u0173 skaut\u0173 tunto vis\u0173 laivi\u0173 sueig\u0117s prasideda sekmandin\u0117,
  rugs\u0117jo 18 d., 10 val. ryto Jaunimo Centre nauj\u0173 palaid\u0173, antruoju
  au\u0161ko \u0161altin\u0117s. Visos ses\u0117s renkasi \u012f tas pa\u010dias klases,
  kuriose nesud\u0117lau praejusi\u0173 velkos metas.\\n\\nKvie\u010diame visas j\u016brin\u012f
  skautavim\u0105 susidom\u0117jimas mergaites jungtis \u012f \\\"Nerijos\\\" tunto
  ses\u0117s el\u0117s. Naujos n\u0117ra primimos sekmandin\u0117s, susiegi metu.
  Del informacij\u0173 kreipkitis \u012f p. J. Aleksinien\u0117 telefonu 598-6985.\\n\\n\\\"LITUVINCIOS\\\"
  TUNTO\\nD\u0116MESIUI\\n\\n\\\"Lituvincios\\\" skaut\u0173 tunto atviras prasideda
  sekmandin\u0117, rugs\u0117jo 18 d., Jaunimo Centre. Skaut\u0173 sveigos 10 val.,
  o jaunim\u0117j\u0173 skaut\u0173 \u2014 11 val. ryto. Ta pat diena Jaunimo centre
  206 km. vyks nauj\u0173 nari\u0173 registracija nuo 10 iki 11:30 val. ryto.\\n\\nLemonto
  lietuvinink\u0173 mokykla tanka tr\u0117s galimyb\u0117 u\u017esi\u0117m\u0117ti
  triu\u0161ti \u012f \u0161e\u0161tadien\u012f, rugs\u0117jo 17 d., tuoj po lietuviniam
  pamok\u0173 skaut\u0173kylos parodose arba telefonuojant draugininkui ps. V. Rap\u0161iui,
  589-2528.\\n\\nSiaur\u0173 vakar\u0173 prie\u0161m\u0117nuose gynan\u010diame registracijos
  reikal\u0173 kreipkitis \u012f s. J. Pilkelei, tel. 529-9058.\\n\\nVadov\u0173 lavinimas.
  Paseibia, kad, i\u0161skyrus Chicago, n\u0117ra platuot\u0173 vadov\u0173 paruo\u0161imo
  (skiltin\u0117s ar drauginink\u0173) kurs\u0173. Be vadovo prie\u0161m\u0117nuose
  atsid\u016br\u0117s blogiausiai, prad\u0117s ma\u017eyti. Pavyzd\u017eiui, ypa\u010d
  suma\u017e\u0117j\u0119s Detroito ir Clevelando vietetai, nors velkimo s\u0105lygos
  yra geros patalp\u0173 ir visuomen\u0117s nusiteikimo at\u017evilgiu.\\n\\nTutuninkai.
  \u0160ioje kadencijoje buvo sureisti 2 tutuninkai: Pilienu ir Lituvinicos tuntams;
  pagr\u0105styta, sutiko pareigas dar vie\u0161nerius metus eiti dabartinius V. Kudirkos
  v\u0117lininkams. Clevelando tutuninkas ruo\u0161iasi i\u0161vykti studijoms, bet
  yra pareig\u0117tas, jog Clevelando skautavimo le\u0161ko tutuninko ir susitikym\u0173,
  kurie L\u016bdi\u0161iu su Baltijos tuntu Detroito ne\u0161is neatsiranda asmens
  tuto vadov\u0173 pareigoms perimti. Klalpedos v\u0117lininkai net registruoja net
  atsako \u012f jokius rajono vadovyb\u0117s ra\u0161us.\\n\\nStovyklos. Visi vietetai
  vasara stovyklaus, Baltijos tunto skaut\u0173 kelneri masti prid\u017eiungia pris
  Lietuvos Roko Bendrose stovyklose geriau pavyksta sportas, pratybos bei konkursais,
  susipa\u017e\u012fsta, patiriamas nauji id\u0117j\u0173.\\n\\nPageidaujam\u0105,
  kad vietoviai vadovai geriau reaguot\u0173 ir ra\u0161omus laikus bei u\u017epildyt\u0173,
  gr\u0105\u017eint\u0173 jiems siun\u010diamas blankas. Taip pat laukiamie kreipiantis
  talkos, pagalbos vietov\u0117se kylaian\u010dias vadov\u0173 lavinimo, stovykli\u0173
  ruo\u0161imo ir kitais reikalais. Brolijoje veikia vi\u0161oki skyri\u0173, kurie
  pasi\u016blys vadovams visuomet pad\u0117ti.\\n\\nVienetu, stovyk\u0173 lankymas
  ir pan. Aplankyta Lituanica stovyklos metu Rake 1976 liepos m\u0117n.; kartu savait\u0119
  stovyklauta, elanat skaut\u0173 pastovykl\u0117s v-k-o pareigas. Aplankyta V. Kudirkos
  vie\u0161ininkija Kazuko mug\u0117s proga 1977 kovo m\u0117n. Dalyauta Baltijos
  tunto sv. Jurgio suj\u0117g\u0117je 1977 baland\u017eio m\u0117n. Dalyauta Lietuvinink\u0173
  Kazuko mug\u0117s atidaryme 1977.\\n\\nDalyvauja visos akivaizdiniuose LSB vad\u017ei\u0173
  pos\u0117d\u017eiune, kuriu nuo kadencijos prad\u017eios buvo 8.\\n\\nEtnin\u0117
  raj. vadov\u0173 pareigas, buvo dirbama karu su Vidurio rajono vadu v. Z. Jaunium
  ir Seresijos rajono vadove jas. A. Gasnerine, ruo\u0161iant pra\u0117jusi\u0173
  spa li Chicagoje \u012fvykus LSS Tarybos pos\u0117d\u012f; vis\u0173 technini\u0173
  darb\u0173, pa\u0161i\u016br\u0117jim\u0173 pareigoms, teko atkurti rajono vadovai.\\n\\n\u0160iuo
  metu J\u0117zus sale rajono vadov\u0173 ruo\u0161ia skiltin\u0117s stovyklos Rako
  stovykliaviet\u0117je. Man tenka eiti Brolijos pastovykl\u0117s vadov\u0173 pareigas
  ir aktiviai dalyvauti stovyklos programos sudaryme. Stovyklos pagrindu imamas Lituvinicos
  tunto skirt, kur\u012f konsep tas, \u012f priartainai \u0161ios stovyklos aplinkai.\\n\\nVadov\u0173
  lavinimas. Paseibia, kad, i\u0161skyrus Chicago, n\u0117ra platuot\u0173 vadov\u0173
  paruo\u0161imo (skiltin\u0117s ar drauginink\u0173) kurs\u0173. Be vadovo prie\u0161m\u0117nuose
  atsid\u016br\u0117s blogiausiai, prad\u0117s ma\u017eyti. Pavyzd\u017eiui, ypa\u010d
  suma\u017e\u0117j\u0119s Detroito ir Clevelando vietetai, nors velkimo s\u0105lygos
  yra geros patalp\u0173 ir visuomen\u0117s nusiteikimo at\u017evilgiu.\\n\\nTutuninkai.
  \u0160ioje kadencijoje buvo sureisti 2 tutuninkai: Pilienu ir Lituvinicos tuntams;
  pagr\u0105styta, sutiko pareigas dar vie\u0161nerius metus eiti dabartinius V. Kudirkos
  v\u0117lininkams. Clevelando tutuninkas ruo\u0161iasi i\u0161vykti studijoms, bet
  yra pareig\u0117tas, jog Clevelando skautavimo le\u0161ko tutuninko ir susitikym\u0173,
  kurie L\u016bdi\u0161iu su Baltijos tuntu Detroito ne\u0161is neatsiranda asmens
  tuto vadov\u0173 pareigoms perimti. Klalpedos v\u0117lininkai net registruoja net
  atsako \u012f jokius rajono vadovyb\u0117s ra\u0161us.\\n\\nStovyklos. Visi vietetai
  vasara\\n\\nNUO PIEMENS LIGI VISUOMENES VEIK\u0116JO\\n\\nPetro Indreikos 70 met\u0173
  am\u017eiaus proga\\n\\nBRONIUS KVIKLYS\\n\\nYra kuki\u0161iu, ne visiems gerai
  \u017einom\u0173 \u017emoni\u0173, kurie didesniam darbus m\u0117t\u0117 visuomen\u0117je
  ir taip atlik\u0117. Pr\u0117ki tok\u012f reik\u0161m\u0117 prisik\u0117ti ir Petras
  Indreika, per\u0117j\u0119s n\u0117m\u0117si atsakingai savo 70 met\u0173 am\u017eiumi
  sukti.\\n\\nPetras atskirtas ry\u0161iais, giman\u010dios 1907.VIII.30 Jonavo ir
  Urk\u016bl\u0117s Indreik\u0173 \u0161eimoje Cipeli\u0173 kaime, Skapi\u0161kio
  vls. Rok\u0161kiko apskrityje. Kaimas apsuptas balomis ir pelk\u0117mis, kurios
  asi\u0161akota nuo Skapi\u0161kio (Mituvos) e\u017eero. Ruden\u012f ir pavasar\u012f,
  keliais pa\u017eilgus, kaimas likdavo atskirtas ne tik nuo miestelio, bet ir nuo
  aplink\u0117s kaim\u0173. Tr\u016bksiant \u0161iaud\u0173 stogams dengti, kai kurie
  kaimo gyventojai stogus dengdavo indr\u0117mis (nendrimis), kurias k\u016bl\u0117davo
  suri\u0161\u0119 nedavosi i\u0161 Palink\u0173 pelki\u0173. Pasakojama, kad pirmieji
  kaimo gyventojai pavard\u017ei\u0173 neturi\u0117j. Joms atsirandant kai kurie ju,
  kuri\u0173 sodybos buvo indr\u0117mis dengtos, gavo Indreik\u0173 vard\u0105. I\u0161
  \u0161io kaimo atskirtas u\u017esok\u0117 balt\u0117j: Giedrius Alfonso Indreika
  ir Pr. Rudinskas agronomija, m\u016b\u0161i\u0161kis Petras Indreika \u2013 ekonomika.
  Bet prie\u0161 tai, mus\u0173 sukauviniukinas gan\u0117 band\u0105.\\n\\nI pasaulinio
  karo metu Cipeli\u0173 k., atsid\u016br\u0117 fronto zonoje. Per j\u012f \u0117jo
  fronto linija. Frontas pastovai laik\u0117si 4 savaites ir \u017einoma, viskas sud\u0117g\u0117.
  Tada \u010dipeli\u0161kai li\u016bdnai duodavo: \\\"Sureig\u0117 \u010dipeli\u0161kai,
  murudavo medeliukai.\\\" Karo veiksm\u0173 metu nuo \u0161eimos buvo atskirtas \u0161eimos
  galva, o motina vleno rusu karui neteisingai palaiptva vokie\u010di\u0173 \u0161nip\u0117,
  buvo persauta \u2013 neteko vienos akies.\\n\\n1919 m. Petras prad\u0117jo lankytis
  Skapi\u0161kio pr. mokykl\u0105. 1927 m. baig\u0117 Skapi\u0161kyje Antano Nami\u0161kio
  mokytoja vidurin\u0119 mokykl\u0105. O 1931 m. Rok\u0161kiko \u0117mnia\u017ei\u0105.
  Taip pa\u010diais metais i\u0161stojo ir Karo mokykl\u0105, o j\u0105 baig\u0117
  kari\u0161i\u0173 as-\\n\\npirant, 1932 m. ruden\u012f i\u0161stojo i Vytauto D.
  universiteto Teis\u0173 fakulteto ekonomikos skyriui. 1936 m. gavo diplomuoto ekonomisto
  vard\u0105.\\n\\n1934 m. prad\u0117jo dirbti Centrin\u0117je kariuomen\u0117s bibliotekoje,
  A. Ruozan\u010dio vadovab\u0117je. Bendradarbiavo \\\"Kario\\\" ir \\\"Karos\\\"
  \u017eurnalose, sek\u0117 vokie\u010di\u0173 kari\u0173 spaud\u0105; dar\u0117 santraukas.
  1937 m. persikel\u0117 tamaun\u012f \u012f \\\"Lietuk\u012f\\\". \u010cia darbas,
  kaip ekonomistui, buvo ar\u010diau \u0161irdies. 1938 m. tarnybos reikalais jam
  teko lankyta Leningrade, Rusijoje. Lietuviai prekybos delegacija pirma kart\u0105
  plauk\u0117 iki \u0161ia isgyt\u0173 \\\"Mariampol\u0117s\\\" laiv\u0173. Esant
  lietuvi\u0173 j\u016brini\u0173 trukum\u0173, laiviai vaivaro norveg\u0173 kapitonas
  H. Leonardsen. \u010cia Petras pirma kart\u0105 tur\u0117jo proges pa\u017einti
  sovietin\u012f gyvenimo b\u016bda, \u012fvairias kontrol\u0117s, sunkumus ir daugybe
  ne\u012fmanum\u0173. \u0160ia kelion\u0117 yra apra\u0161o savo dar nespausdinusio
  atsiminimo.\\n\\nBok\u0161to okupacijos metu dirbo ir JAV-bes. I\u0161 prad\u017ei\u0173
  dirbo \u017eem\u0117s \u016bkio, bet 1950.VIII.5 perseki\u0161k\u0117 \u012f East
  Chicaga, Indiana. Petras prad\u0117jo dirbti pileno fabriko Youngstown Sheet and
  Tube Co. mechanizm\u0117s skyriuje. \u010cia i\u0161dirbo 22 metus ir 1972.K. i\u0161\u0117jo
  pensijon. E. Chicagoje Petras, kitados buv\u0119s Cipeli\u0173 kaimo pirmuoju, i\u0161vare
  pla\u010dia lietuvi\u0173 vartus \u012fvairiai paver\u010dia akil\u0117lai.\\n\\nKai
  kurios JAV ir Japonijos \u0161viesos jau i\u0161leido \u0161toku pilienu skatinimoje
  rankinis laikrod\u017ei\u0173 M. S.\\n\\nSUKURTAS MEDICININKAS LAIKRODIS\\n\\nJAV
  sukurstutu laikrod\u017ei\u0173, kurie rod\u0117 ne tik laik\u0105, bet ir matuoja
  \u017emogaus puls\u0105.\\n\\nTai tikslu sert rankinio laikrod\u017eio drugo \u012fmonijotamai
  nedels prietaisas, kuris pulso vartuoknu paver\u010dia akil\u0117lai.\\n\\nKai kurios
  JAV ir Japonijos \u0161viesos jau i\u0161leido \u0161toku pilienu skatinimoje rankinis
  laikrod\u017ei\u0173 M. S.\\n\\nBOSTONO \u017dINIOS\\n\\nKACINSKO KURI\u0172I KONCERTAS\\n\\nSpalio
  10 d., sekmadien\u012f, 3 val. p. p. Lietuv\u0173 Pilieli\u0173 d-jos tre\u010diojo
  auk\u0161to sal\u0117je \u012fvyks Jeronimo Ka\u010dinsko kuri\u0173j\u0173 koncertas.
  Program\u0105 atliks Berklee muzikos kolegijos saksofon\u0173 kvartetas, smuikininkas
  Gerald Mordis, pianistas De Wart ir Berklee kolegijos choras, kuris atliks kelet\u0105
  Jeronimo Ka\u010dinsko dain\u0173. Jdomu, kad jie dainuos lietuvi\u0161kai.\\n\\nM\u010cSU
  MIRUSIEJI\\n\\n\u0160is Darbo dienos savaitgalis buvo gal vienas i\u0161 negali\u0161siniausi\u0173.
  Po ligesn\u0117s ligos mir\u0117 in\u017einerius Aleksandras Lap\u0161ys, ra\u0161ytojas
  Petras Pilkis ir laborant\u0117 Aldona Labuckait\u0117.\\n\\nPARENGIMAI\\n\\n\u2014
  Rugpj\u016bto 18 d. Maironio Parko Shrewsbury \u012fvyks 6-ji Lietuv\u0173 diena,
  kuriai rengia L. B. Bostono apygarda ir Worcesterio apylink\u0117.\\n\\n\u2014 Rugpj\u016bto
  25 d. 2 val. po p. Tautos \u0161vent\u0117 ir dr. Jono Baasanavi\u010diaus min\u0117jimas
  Liet. Pilieli\u0173 d-jos sal\u0117je. Rengia L. B. Bostono apylink\u0117.\\n\\n\u2014
  Spalio 8 d. 3 val. p. p. Laisv\u0117s Varpo koncertas Lietuv\u0173 Pilieli\u0173
  d-jos sal\u0117je So. Boston.\\n\\n\u2014 Spalio 16 d. 3 val. p. N. Anglijos Balty
  d-jos koncertas First & Second Church sal\u0117je, 66 M\u00e4hrborough St. Program\u0105
  atliks latvi\u0173 moter\u0173 ansamblis \\\"Melodija\\\".\\n\\n\u2014 Spalio 29
  d. Balfo Brocktono\\n\\nNAUJAS \u017dODYNAS STUDENTAMS\\n\\nLIETUVISKAI ANGLISKAS
  \u017dODYNAS\\n\\nI\u0161leistas mink\u0161tasis vori\u0161elis\\n\\nkaina tik $3.00\\n\\nKai
  kurios kolegijos da\u017enai mok\u0117s lietuvi\u0173 kalbos ir da\u017enai studentams
  reikia lietuvi\u0161kai anglisk\u0105 \u017eodyn\u0105 pamokomis. Dabar Draugas
  i\u0161leido studentams papildyt\u0105 laid\u0105 \u0161io \u017eodyno, kur\u012f
  suredagavo Vilnius P\u0117teri\u0161kis. \u017dodynas vori\u0161elis \u0161io \u017eodyno
  kainuoja $10.00.\\n\\nRa\u0161ykite: DRAGAUS, 4545 W. 63rd St., Chicago, Ill. 60629\\n\\n(Malenkait\u0117
  pri\u0117m\u0117 45 centus po\u0161to siuntim\u0105, ir mok\u0117jimais, jei gyvenate
  Illinois valstyb\u0117je).\\n\\nPerskaite \\\"Draugo\\\", duokite ji kitiems.\\n\\nSACHMATAI\\n\\nKrep\u0161is.
  \u010cia vykdoma Lietuvos \u0161achmat\u0173 pirmenybes laim\u0117jo Maskvos d.m
  Balalaivos, surink\u0119s 12\u00bd ta\u0161ko i\u0161 16 galim\u0173. Sek\u0117
  Dementjeva ir Maselevi\u010dius (abu i\u0161 Kaliningrado) po 10\u00bd ta\u0161k\u0173.
  Moisejevas (Maskva) 9\u00bd, ir Vladas Mi\u0161kenas (Vilnius) ir Ivanovas (Pergana)
  po 9 ta\u0161k\u0173. Kit\u0173 lietuvi\u0173 leid\u017eiasi maino ko \u0161altyn\u0173:
  G. Eizenis (7), Janas mo\u010delaitis Ma\u017eyrovos (6\u00bd ta\u0161k\u0173) ir
  Khipid\u017ei\u0161kis R. Barstatis su B. Ramlaucovu po 9 ta\u0161k\u0173, G. Pie\u0161\u010dia
  (Vln) 6\u00bd, P. R\u0117gelis (Kaunas) 6, panev\u0117\u017eietis A. \u010cesnakas
  5\u00bd ir R. Survila (Vln) 4\u00bd ta\u0161k\u0173. Reikia pabr\u0117\u017eti,
  kad Lietuvos jam\u0173 vyrai nurod\u0117 nemazai ta\u0161k\u0173 i\u0161 patyr\u0173
  \u0161iuo soviet\u0173 meistri\u0173, kaip antai: Rastenis suderavo kalnin\u012f
  gr\u012f\u017et\u012f Malveikin\u012f ir ma\u0161kin\u0119 Berkovici\u0173, Barstatis
  \u2013 Iva navos (Pergana) ir Domenika (Maskva), plunksn\u0117jo Morovos Kuind\u017eis
  (Mek), Berkovicius (Mak) ir Dementjeva (Klaip\u0117da) o pri\u0117s Majorovos, Barstatis
  ir Survila, pasi\u017eym\u0117jo vilniietis G. Pie\u0161\u010dia.\\n\\nVIII.18)
  susuko i\u0161leisti kelera abiturient\u0173 laidu.\\n\\nGyventamas Meerbecke, karatu
  su spaudos darbuotoju Jonu Narbutu (da\u017ear gvyd\u0117 Montr\u0117jalyje) em\u0117si
  lietuvi\u0161k\u0105 knyg\u0173 leidimo. Be galo tr\u016bkstant lietuvi\u0173 \u012fvairi\u0173
  trukum\u0173, laiviai vaivaro norveg\u0173 kapitonas H. Leonardsen. \u010cia Petras
  pirma kart\u0105 tur\u0117jo proges pa\u017einti sovietin\u012f gyvenimo b\u016bda,
  \u012fvairias kontrol\u0117s, sunkumus ir daugybe ne\u012fmanum\u0173. \u0160ia
  kelion\u0117 yra apra\u0161o savo dar nespausdinusio atsiminimo.\\n\\nBok\u0161to
  okupacijos metu dirbo ir JAV-bes. I\u0161 prad\u017ei\u0173 dirbo \u017eem\u0117s
  \u016bkio, bet 1950.VIII.5 perseki\u0161k\u0117 \u012f East Chicaga, Indiana. Petras
  prad\u0117jo dirbti pileno fabriko Youngstown Sheet and Tube Co. mechanizm\u0117s
  skyriuje. \u010cia i\u0161dirbo 22 metus ir 1972.K. i\u0161\u0117jo pensijon. E.
  Chicagoje Petras, kitados buv\u0119s Cipeli\u0173 kaimo pirmuoju, i\u0161vare pla\u010dia
  lietuvi\u0173 vartus \u012fvairiai paver\u010dia akil\u0117lai.\\n\\nKai kurios
  JAV ir Japonijos \u0161viesos jau i\u0161leido \u0161toku pilienu skatinimoje rankinis
  laikrod\u017ei\u0173 M. S.\\n\\n**J. A. VALSTYB\u0116SE**\\n\\nJo\u017eas \u0160imoli\u016bnas,
  \u0161iuo metu dirb\u0119s karin\u0117je aviacijoje, kartu su savo draugu Draugo
  Ratkovich, St. Petersburg, Fla. (7229 Central Ave.), atidare mero ir meni\u0161k\u0173
  dirbin\u0173 pardavotoje, kurioje v\u0117lais bus ir lietuvi\u0161ko meno dalyku.
  St. Petersburgu lietuviams ir turistams be vasarot\u0173j\u0173 verta \u0161ia meno
  kautuv\u0117 aplankyti, ypa\u010d norint \u012fsigyti tinkam\u0173 svetyn\u0173.\\n\\n\u2014
  JAV LB kra\u0161to valdyba yra u\u017emegzusi formalus tarporganizacinia ry\u0161ius
  su naujausiai \u012fsik\u016brusia pilie\u010di\u0173 \u012fstaigomis organizacija
  \u2014 \\\"New Directions\\\". \u0160i organizacija, savo eil\u0117se nariais turinti
  \u012ftakingu JAV-\u0173 politinio - visuomeninio gyvenimo valstyb\u0117s, veikla
  \u017emogaus teisi\u0173 gynimo srityje. Ji pasakuo u\u017e \u012fkurima specialios
  Baltojo r\u016bmu komisijos \u017emogaus teisi\u0173 klau\u0161imams, kad i\u0161sijungt\u0173
  \u0161i\u0105 arit\u012f i\u0161 Valstyb\u0117s depart. \u017einiuos, nes ten politiniai
  motyvai da\u017enai priver\u010dia \\\"neaptel\u0117ti\\\" valstyb\u0119, nuoseigdami
  \u017emogaus teisi\u0173 nuostatas. \\\"New Directions\\\" taip pat pasakuo u\u017e
  ratifikacij\u0105 genocido konvencijos ir moralines bei materialines pagalbos teikim\u0105
  politiniams kalniams.\\n\\n\u2014 \\\"Mindango\\\" draugija \u0161ioj\u012f ansambliu
  naudoj\u012f \\\"Pumpur\u0117li\u0173\\\" grup\u0117 buvo pavir\u0161iuoju Marijos
  Auxiliadoro parapijos rengimu Valiko dienos \u0161vent\u0119, kuri \u012fvyko vienuol\u0117s
  Konsolino sal\u0117je. Mindaugied\u0117ms teko atlikti svarbiusis \u0161vent\u0117s
  programos dal\u012f. J\u0173 lokalai labai patiko atvykusiesiems Berlio miesto gyventojams.
  Seseris pasakavo, kad prie\u0161ingas \u0161ok\u0117jas dovanojo mokyt. E. \u0160an\u010dien\u0117
  ir jos pad\u0117j\u0117ja Nancy Sivenyte, sekretor\u0117 pad\u0117jo Francisko Perlikas,
  muzik\u0105 ir garsiaukalbus Vark\u0117 Jurgis \u0160ilaulauskas.\\n\\n\u2014 Tradicin\u0117
  ma\u017edaugiai kelion\u0117 \u012f Kanados kankini\u0173 \u0161ventov\u0119 Mid''ande
  \u012fvyka rugs\u0117jo 18, sekmadien\u012f.\\n\\n**MIEGAS**\\n\\nO, kaip gera yra
  miegoti! Atsagulti \u012f \u0161ilt\u0105 lov\u0105, u\u017esikloti iki aus\u0173,
  o tada u\u017emerkti akis ir pamazu, pamazu dingti \u0161io pasaulio. Nors miegas
  tuo ir neatine, bet jau gali svajoti ir sapnoti.\\n\\nDar kitas m\u0117nesis b\u016bdas
  yra atliejo klas\u0117s smauti, klausant monotonio mokytojo balso... Pamazu ta \u0161iluma
  tave apgaubia, akys pa\u010dios u\u017eaimerkia, o mokytojo \u017eod\u017eiai lyg
  lopin\u0117 \u0161il\u016bl\u0117ja...\\n\\nMan geriausia miego dalis yra sapnai.
  Sapnuse pamir\u0161tu visas savo r\u016bp\u0117sena. Sapnai visoniet yra pilni dijom\u0173
  nuotyki\u0173. \u017dinoma, b\u016bna ir baug\u0173 sapn\u0173, kurie mane i\u0161traukia
  i\u0161 vieno pasaulio \u012f kit\u0105 ir pa\u017eadina.\\n\\nLina Pu\u0161kevi\u010di\u016bt\u0117,\\nKr.
  Donelai\u010dio lit. m-los VIII kl. mok. \\\"M\u016bs\u0173 \u017eem\u0117s at\u017eala\\\".\\n\\n**PEL\u0116**\\n\\nJi
  n\u0117ra pel\u0117, tik atrodo kaip pel\u0117. Pel\u0117 yra geros, nes jos neklausa.
  Mano pel\u0117 turi juodas akis, geltonas dantukus. Jos kailis rudas, turi ilga
  uodeg\u0105, balta pl\u016bva ir ma\u017eas kojyt\u0117s su nagais. Jos vardas yra
  Herry.\\n\\nLoreta Stanulyt\u0117,\\nToronto \\\"Maironio\\\" lit. m-los 4 sk. mokin\u0117.
  Kanada. \\\"M\u016bs\u0173 pasaulis\\\".\\n\\n**BUVO IDOMU**\\n\\nSal\u0117je visi
  mok\u0117m\u0117s dainuoti, buvo tautini\u0173 \u0161oki\u0173 ir dramos b\u016breliai.
  Baig\u0117me savo darb\u0105. Vakare maud\u0117m\u0117s, \u017eaid\u0117m \u017eaidimus
  ir pa\u0161okom paviljon\u0117 prie ezero. Sal\u0117je Dam\u0173 \u017eyti parod\u0117
  \u0161ios jaunut\u0117s stov\u0117jo filmu. Buvo \u012fdomu matyti save.\\n\\nRonaldas
  Bartnikas,\\n\\\"Kunigai\u010di\u0173 \u0161e\u0161\u0117lyje\\\".\\n\\n**MUS\u0172
  P\u0158EDAS**\\n\\nM\u016bs\u0173 u\u017ekyje yra i\u0161kasta didel\u0117 duob\u0117,
  kuri yra gil\u0117 ir pilna vandens. Mes vadiname pr\u016bdijus pilnas \u017ev\u016bn\u0105.
  Vasara mes ciname m\u0117sieri\u0161kai. Labai sunuku pagauti didel\u0117s \u017ev\u016bn\u0173.
  M\u0105styd\u0173 pagau. Mama \u0161verda sriuba.\\n\\nLydia Stroput\u0117,\\nDarius
  - Gir\u0117no lit. mokyklos V sk. mokin\u0117\\n\\n**NE KARV\u0116**\\n\\nAnglijoje,
  netoli vald\u017ei\u0173 pastat\u0173, vienas generalas tur\u0117jo gyvenama nam\u0173
  ir didel\u0119 pleiv\u0105 aplink, per kuri\u0105 niekas negal\u0117jo praeiti,
  nes kariet\u016br\u0173 generolo karv\u0119. Nori nesuti \u012f vald\u017ei\u0173s
  namus, kurioje eti aplink generolo pleiv\u0105. Karv\u0117 viena au\u0161kito didel\u012f
  \u017emon\u0105, nepaisydama dr\u0105simo, nor\u0117jo tiesiai per piev\u0105 etiti
  \u012f vald\u017ei\u0173s nam\u0173. Tuo jau at\u0117jo sargybiniai ir pon\u0173
  gr\u0105\u017eino atgal.\\n\\n\u2014 Kaip tu dr\u012fsti taip elgtis? \u2014 prie\u0161inosi
  ponia, \u2014 ar tu neteina, kas a\u0161 esu?\\n\\n\u2014 Ne\u017einau, \u2014 atsak\u0117
  sargybinis, \u2014 kas tamsta esi, bet gerai \u017einau, kad tamsta nesi generolo
  karv\u0119.\\n\\nPonia nieko nelaukdama gr\u012f\u017eo atgal.\\n\\n**LIETUVIJA**\\n\\nLietuva
  yra mano tauta, kur a\u0161 nor\u0117\u010diau gyventi. Lietuva yra mano dalma,
  kuriai a\u0161 ar\u010diau nor\u0117\u010diau mylieti.\\n\\nLydia Stroput\u0117,\\nDarius
  - Gir\u0117no lit. mokyklos V sk. mokin\u0117\\n\\n**SVEIKAS GYVAS**\\n\\nVisi sustoja
  ratu. Vienas vaik\u0161\u010dioja aplinkui, suduoda kurnas nori rate stovindam per
  nugara, sakydamas: \\\"Sveikas gyvas!\\\", ir b\u0117ga aplink rata. Pasveikintas
  b\u0117ga prie\u0161ingon pus\u0117n. Susitik\u0119 abud\u0173 padnuoja vienas antrojam
  rank\u0105, paklausia: \\\"Kaip sekasi?\\\" ir b\u0117ga toliau. Katras pirmas atb\u0117go
  \u012f tu\u0161\u010di\u0105j\u0105 viet\u0105, tas ir atsitais, o pasilik\u0119s
  b\u0117ga aplink rata ir sveikina kit\u0105.\\n\\nGalima \u017eaisti ir kitai: pasveikintas
  vaikas gaudo jam sudavus per nugara ir stengiasi gri\u017einti sm\u016bgi.\\n\\nTe,
  kurie kartu jau b\u0117go, atsigri\u017eta nugara \u012f rat\u0105, ir j\u0173 nebegalima
  sveikinti, kol visi \u017ead\u0117jai nebuv\u0119 b\u0117g\u0119.\\n\\n**AUSTRALIJIOJE**\\n\\n\u2014
  A. Barbora Kaitin\u0117n\u0117\\nMilo Hobarte, sulaikauja 88 m. am\u017eiaus.\\n\\n\u2014
  A. a. Petras Slegeris mir\u0117 rugpj\u016b\u010dio 26 d., sulaikauja 70 m. Buvo
  kil\u0119s i\u0161 \u0160iauli\u0173.\\n\\n\u2014 A. a. Bruno Umbressas mir\u0117
  v\u0117\u017eiu Melbourne, sulaikauja 63 m. am\u017eiaus. Liko \u017emona, dukra
  ir du s\u016bn\u016bs.\\n\\n**OKUP. LIETUVIJE**\\n\\n\u2014 Pamin\u0117tas Lietuvos
  gimnazijos 1927 m. \u017eengiusi\u0173 auksinis 50 m. jubiliejus. I\u0161 19-kos
  baigusi\u0173j\u0173 susirinko tik 8-ni; kit\u0173 i\u0161mir\u0117, arba i\u0161sivainavoje.
  Min\u0117jimo ralyviai \\\"palink\u0117jo vienas kitam laimingo kar\u0161\u010diaus
  am\u017eiaus\\\".\\n\\n\u2014 Marijampol\u0117je, okupant\u0173 perkrik\u0161tytoje
  \u012f Kapsuku, o lietuvi\u0173 vadinan\u010dio \\\"Kapsuku\\\", rugs\u0117jo 1
  d. atidaryta technikos mokykla, kuri ruo\u0161 \u0161altkalvius, santechnikus, elektromontierius,
  da\u017eytojus - tinkutojus, stalus ir m\u016brininkus. I mokykl\u0105 priimami
  abiej\u0173 ly\u010di\u0173 jaunuoliai, baig\u0119 8 klas\u0117s. Mokslas t\u0119sis
  3 metus. Moksleiviai kartu \u0117jys ir vidurin\u012f i\u0161silavinim\u0105.\\n\\nKrista
  Oftalt\u0117,\\nMontrealio lit. m-los 6 sk. mokin\u0117. Kanada. \\\"Liejena\\\".\\n\\n**OKUP.
  LIETUVIJE**\\n\\n\u2014 Pamin\u0117tas Lietuvos gimnazijos 1927 m. \u017eengiusi\u0173
  auksinis 50 m. jubiliejus. I\u0161 19-kos baigusi\u0173j\u0173 susirinko tik 8-ni;
  kit\u0173 i\u0161mir\u0117, arba i\u0161sivainavoje. Min\u0117jimo ralyviai \\\"palink\u0117jo
  vienas kitam laimingo kar\u0161\u010diaus am\u017eiaus\\\".\\n\\n\u2014 Marijampol\u0117je,
  okupant\u0173 perkrik\u0161tytoje \u012f Kapsuku, o lietuvi\u0173 vadinan\u010dio
  \\\"Kapsuku\\\", rugs\u0117jo 1 d. atidaryta technikos mokykla, kuri ruo\u0161 \u0161altkalvius,
  santechnikus, elektromontierius, da\u017eytojus - tinkutojus, stalus ir m\u016brininkus.
  I mokykl\u0105 priimami abiej\u0173 ly\u010di\u0173 jaunuoliai, baig\u0119 8 klas\u0117s.
  Mokslas t\u0119sis 3 metus. Moksleiviai kartu \u0117jys ir vidurin\u012f i\u0161silavinim\u0105.\\n\\nKrista
  Oftalt\u0117,\\nMontrealio lit. m-los 6 sk. mokin\u0117. Kanada. \\\"Liejena\\\".\\n\\n**VASAROS
  IDOMUMAI**\\n\\n\u2014 A\u0161 \u0117jau stovyklauti. Su manim \u0117jot t\u0117t\u0117,
  mama, brolinkas ir d\u0117d\u0117. Mes pagavom \u017ev\u016bn\u0173. Nusigyv\u0117me
  pavald\u0117me vadov\u0173 atstv\u0117tai, maist\u0105, pasmaid\u0117me baseinu
  ir gr\u012f\u017eome. Jaiva\u017edin\u0117jau, per viena diena, kojoms vir\u0161
  20 myli\u0173! \u2014 te\u0161\u0117 Simas.\\n\\n\u2014 O a\u0161 smaugiausi atsimenu
  linksm\u0105 talent\u0173 vakar\u0105 \\\"Dainavoje\\\", kuriamie dalyvavo visa
  stovykla. Vienas berniukas puikiai akordeono pagrojo, kitis trys padainavo. Taip
  pat buvo \\\"televizijos karas\\\", kur valkai angl\u0173kai skelbimus ver\u010d\u0117
  \u012f lietuvi\u0173 kalba. Tai labai juokingai akamb\u0117jo! \u2014 linksmai nustoj\u0117kite
  prisiimines Paulius.\\n\\n\u2014 Ir taip m\u016bs\u0173 pasikalb\u0117jimas teko.
  Susitar\u0117me jo dali\u0173 u\u017era\u0161yti \\\"Punkukai\\\". Abu labai norime
  ir \u0161is vasara vykti \u012f lietuvi\u0161ko jaunimo stovykl\u0105. Ir \u0161\u012f
  kart\u0105 keliau laisvime ta pa\u0161a stovykla. Mes norime dar daugiau ger\u0173
  dalyk\u0173 i\u0161mokti ir stengiam\u0117s daugiau dirbti. Norime susitikti su
  lietuvi\u0161ku jaunimu, nauju draugu \u012fsigyti \u2014 berniuk\u0173 ir mergin\u0173.
  Ko \u010diau gra\u017e\u0173 mergin\u0173!\\n\\nTariam\u0117s b\u016bti tame pa\u010diame
  b\u016brielyje ir dr\u0105sne stikli\u0173 visus stovyklos u\u017edavinius. Sportuoime
  taip pat drauge, bet linksmavarkius praleisime atskirai. Su merginomis... Cha!\\n\\nPaulius
  Raimundas Klimas ir Simas Vytautas \u017dmud\u017ei\u016bnas,\\nRochester, N. Y.,
