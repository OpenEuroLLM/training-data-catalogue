  \u2013\\nJONAS UBI\u0160\"", "\"\u012eVADAS\\n\\n\u201eMokymo metodika naudojant
  \u201eBarboleta\\\" balansin\u0119 lent\u0105\\\" projekte siekiama didinti ir tobulinti
  vaik\u0173 kalbos, atminties, d\u0117mesio, loginio m\u0105stymo geb\u0117jimus
  pasitelkiant Barboleta balansines lentas. Projektas finansuojamas Europos S\u0105jungos
  Erasmus+ programos l\u0117\u0161omis. Projekto siekiniai:\\n\\n1. Darbo su balansine
  lenta metodika;\\n2. Mokymosi u\u017eduotys skirtos Barboleta balansinei lentai.\\n3.
  Skaitmenin\u0117 IT platforma.\\n\\nBarboleta balansin\u0119 lent\u0105 i\u0161rado
  klinikin\u0117 psicholog\u0117 Baiba Blomniece-Jurane, kurios tikslas \u2013 pad\u0117ti
  vaikams pagerinti geb\u0117jim\u0105 susikaupti, emoci\u0161kai \u012fsitraukti
  \u012f mokymosi proces\u0105, suma\u017einti streso lyg\u012f bei pagerinti mokymosi
  rezultatus. Pastarieji teigiami poky\u010diai pasiekiami jud\u0117jimo d\u0117ka.
  Daugiau informacijos apie Barboleta balansin\u0119 lent\u0105 rasite tinklalapyje
  https://barboleta.lv/.\\n\\nProjektas \u012fgyvendinamas bendradarbiaujant 4 skirting\u0173
  tip\u0173 organizacijoms, atstovaujan\u010dioms trims skirtingoms Europos S\u0105jungos
  \u0161alims.\\n\\nVienas i\u0161 projekte pasiekt\u0173 rezultat\u0173 - u\u017eduo\u010di\u0173,
  skirt\u0173 darbui su \u201eBarboleta\\\" balansine lenta, rinkinys.. Skirtingose
  organizacijose sukurtas u\u017eduotis savo darbe gali pasitelkti \u012fvair\u016bs
  specialistai. Pratimai buvo parengti \u0161iems mokomiesiems bei specialiesiems
  dalykams:\\n\\n* Logopedija;\\n* Angl\u0173, ispan\u0173 ir ital\u0173 kaip u\u017esienio
  kalbos dalykams;\\n* Gimtosios kalbos mokymasis (lietuvi\u0173 ir ital\u0173). \u0160ie
  pratimai pateikiami atitinkamos versijos dokumentuose;\\n* Geometrijos, geografijos,
  katalik\u0173 religijos, kasdieni\u0173 \u012fg\u016bd\u017ei\u0173 pratim\u0173
  pavyzd\u017eiai.\\n\\n1. LOGOPEDIJA\\n\\n1.1.\\n\\nPasi\u016blymai modifikacijoms\\n\\n1.11.\\n\\n2.
  ANGL\u0172 KAIP U\u017dSIENIO KALBA\\n\\n2.1.\\n\\nPasi\u016blymai modifikacijoms\\n\\nKamuoliuk\u0105
  galima ridenti ir i\u0161 kitos pus\u0117s pradedant nuo pabaigos. \u0160iuo b\u016bdu
  tikslas yra atsiminti vertimus i\u0161 u\u017esienio kalbos.\\n\\nPasi\u016blymai
