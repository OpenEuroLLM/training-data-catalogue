  kilm\u0117s nuorodos ar kokyb\u0117s garantijos funkcija (4.4 ir 4.7 punktai).\\n\\nPreki\u0173
  \u017eenklo savininkas gali nesutikti su tolesniu preki\u0173 komercializavimu,
  jeigu tam yra pagr\u012fsta prie\u017eastis ir jeigu tolesnis komercializavimas
  pa\u017eeid\u017eia ar gali pa\u017eeisti preki\u0173 \u017eenklo funkcijas (4.5
  punktas).\\n\\nKilm\u0117s nuorodos funkcija pa\u017eeid\u017eiama, be kita ko,
  tada, kai preki\u0173 \u017eenklas perpardav\u0117jo reklamoje naudojamas taip,
  kad gali susidaryti \u012fsp\u016bdis, jog perpardav\u0117j\u0105 ir preki\u0173
  \u017eenklo savinink\u0105 (nagrin\u0117jamu atveju \u2013 EPAL ir (arba) jos narius)
  sieja verslo ry\u0161iai, jog perpardav\u0117jo \u012fmon\u0117 priklauso preki\u0173
  \u017eenklo savininko platinimo tinklui arba jog tarp abiej\u0173 \u012fmoni\u0173
  egzistuoja ypatingi santykiai. PHZ toliau prekiauja \u012fsigytais pad\u0117klais.
  Tai rei\u0161kia, kad ji parduoda naudotas prekes, ir reikia suponuoti, kad jos
  pirk\u0117jai tai \u017eino. PHZ tai nurodo ir savo (orig. p. 4) tinklapyje, kuriame
  vaizduojamas pad\u0117klas, pa\u017eym\u0117tas EPAL preki\u0173 \u017eenklu. \u0160ios
  aplinkyb\u0117s neleid\u017eia teigti, kad susidaro \u012fsp\u016bdis, jog PHZ ir
  EPAL ar jos nariai yra susij\u0119 ekonominiais ry\u0161iais arba jog PHZ tinklapis
  labai kenkia preki\u0173 \u017eenklo reputacijai (4.9 punktas).\\n\\nEPAL kolektyvinio
  preki\u0173 \u017eenklo funkcija yra u\u017etikrinti, kad \u0161ios prek\u0117s
  kilusios i\u0161 vieno i\u0161 EPAL nari\u0173 / licencijos gav\u0117jo (t. y. yra
  pagrindin\u0117s kilm\u0117s); tai garantuoja j\u0173 kokyb\u0119 pirmojo i\u0161leidimo
  \u012f rink\u0105 momentu. Preki\u0173 \u017eenklo funkcija n\u0117ra garantuoti
  kokyb\u0119 v\u0117liau, ir jis neu\u017etikrina, kad preki\u0173 neremontuos tretieji
  asmenys. Tod\u0117l naudojant kolektyvin\u012f preki\u0173 \u017eenkl\u0105 ne\u012fmanoma
  pasiekti, kad su preki\u0173 \u017eenklo savininko sutikimu \u012f rink\u0105 i\u0161leistus
  pad\u0117klus remontuos i\u0161imtinai preki\u0173 \u017eenklo savininko nariai
  ir licencijos gav\u0117jai, laikydamiesi tam tikr\u0173 standart\u0173, ir taip
  bus i\u0161saugota kokyb\u0117 po pirmojo i\u0161leidimo \u012f rink\u0105. Tod\u0117l,
  kitaip, nei teigia EPAL, kilm\u0117s nuorodos funkcijai nedaro \u012ftakos tai,
  kad licencijos neturintis asmuo atlieka remont\u0105, tod\u0117l vykstant tolesniam
  komercializavimui ne\u012fmanoma u\u017etikrinti vienodos europad\u0117kl\u0173
  kokyb\u0117s (4.10 punktas).\\n\\nD\u0117l pirma nurodyt\u0173 prie\u017eas\u010di\u0173
  n\u0117ra pa\u017eeid\u017eiama nei kokyb\u0117s garantijos funkcija, nei investavimo
  funkcija. Be to, EPAL pozicija, kad PHZ atliktas remontas nepakeit\u0117 preki\u0173
  b\u016bkl\u0117s, rei\u0161kia, kad PHZ, toliau prekiaudama suremontuotais pad\u0117klais,
  nepa\u017eeid\u017eia \u0161i\u0173 preki\u0173 \u017eenklo funkcij\u0173, nes pad\u0117klai
  po remonto n\u0117ra pakeisti ir tod\u0117l negali b\u016bti laikomi esan\u010diais
  blogesn\u0117s kokyb\u0117s nei anks\u010diau, taigi, negali b\u016bti laikomi ir
  kenkian\u010diais EPAL preki\u0173 \u017eenklo reputacijai (4.11 punktas).\\n\\nPapildomi
  EPAL argumentai, kad bet koks licencijos neturin\u010dio asmens atliktas remontas
  apima didesn\u012f nei nereik\u0161mingas pakeitim\u0105, yra prie\u0161taringi,
  nelogi\u0161ki ir, atsi\u017evelgiant \u012f tai, kas i\u0161d\u0117styta, neturi
  reik\u0161m\u0117s (4.13 punktas).\\n\\nPagr\u012fst\u0173 prie\u017eas\u010di\u0173,
  kaip jos suprantamos pagal BP\u017dR 13 straipsnio 2 dal\u012f, n\u0117ra, nes toliau
  prekiaudama pad\u0117klais PHZ nedaro arba negali daryti \u012ftakos n\u0117 vienai
  i\u0161 preki\u0173 \u017eenklo funkcij\u0173 (4.14 punktas). Tod\u0117l EPAL teis\u0117
  \u012f preki\u0173 \u017eenkl\u0105 nagrin\u0117jam\u0173 europad\u0117kl\u0173
  at\u017evilgiu yra pasibaigusi (5.1 punktas).\\n\\nSavo reikalavimus EPAL subsidiariai
  grind\u0117 tuo, kad buvo padarytas neteis\u0117tas veiksmas. Reik\u0161dama \u0161\u012f
  reikalavim\u0105, EPAL teig\u0117, kad prekiaudama EPAL preki\u0173 \u017eenklu
  pa\u017eym\u0117tais pad\u0117klais, kurie neatitiko EPAL sistemos standart\u0173,
  PHZ pa\u017eeid\u017eia \u0161i\u0105 sistem\u0105. Taigi rei\u0161kiant neteis\u0117tu
  veiksmu grind\u017eiam\u0105 reikalavim\u0105 i\u0161 esm\u0117s remiamasi argumentais,
  kad PHZ naudoja EPAL preki\u0173 \u017eenkl\u0105; vadinasi, \u0161i\u0173 reikalavim\u0173
  likimas yra toks pat kaip ir teise \u012f preki\u0173 \u017eenkl\u0105 grind\u017eiam\u0173
  reikalavim\u0173 (5.3 punktas).\\n\\n3. Kasacinio skundo pagrindo vertinimas\\n\\n3.1.1
  Pirmoji kasacinio skundo pagrindo dalis susijusi su EPAL argumentais, kad EPAL d\u0117l
  pagr\u012fst\u0173 prie\u017eas\u010di\u0173 nesutinka su tolesniu pad\u0117kl\u0173
  komercializavimu, nes pasikeit\u0117 arba pablog\u0117jo j\u0173 kokyb\u0117.\\n1.1.1
  ir 1.1.2 dalyse teigiama, kad Hof (4.2 punkte) neatsi\u017evelg\u0117 \u012f tai,
  jog EPAL r\u0117m\u0117si pagr\u012fsta prie\u017eastimi \u2013 EPAL sistemos i\u0161saugojimu
  ir kontrole siekiant u\u017ekirsti keli\u0105 jos trukdymui. Taip pat teigiama,
  kad Hof neatsi\u017evelg\u0117 \u012f tai, jog, kaip argumentavo EPAL, bet koks
  PHZ (ar kit\u0173 licencijos neturin\u010di\u0173 asmen\u0173) (orig. p. 5) atliktas
  remontas turi b\u016bti vertinamas kaip didesnis nei nereik\u0161mingas pakeitimas.
  EPAL argumentai, kad jeigu pad\u0117klai sugadinami prie\u0161 remont\u0105, prek\u0117s
  b\u016bkl\u0117 pasikei\u010dia, niekaip nekei\u010dia to, kad bet koks PHZ atliktas
  remontas privalo b\u016bti laikomas didesniu nei nereik\u0161mingas pakeitimu.\\n1.1.3
  dalyje kritikuojami Hof 4. 3 punkte pateikti motyvai ir (apibendrintai) teigiama,
  kad pakeitimas gali b\u016bti ir tuo atveju, kai prek\u0117s n\u0117ra sugadintos.\\n1.1.4
  dalyje teigiama, kad Hof 4. 3 punkte neatsi\u017evelg\u0117 \u012f EPAL paai\u0161kinimus,
  jog PHZ atliktas sugadint\u0173 pad\u0117kl\u0173 remontas niekaip nekei\u010dia
  to, kad j\u0173 b\u016bkl\u0117 d\u0117l sugadinimo pasikeit\u0117.\\n1.1.5 dalyje
  teigiama, kad Hof (4. 13 punkte) neatsi\u017evelg\u0117 \u012f tai, kad pagal suformuot\u0105
  jurisprudencij\u0105 papildomi \u0161alies argumentai negali b\u016bti ignoruojami
  vien tod\u0117l, kad jie prie\u0161tarauja pagrindiniams \u0161alies argumentams.\\n\\n3.1.2
  2 dalyje teigiama, kad Hof, (4.5 punkte) remdamasis tuo, jog nesutikti su tolesniu
  preki\u0173 komercializavimu preki\u0173 \u017eenklo savininkas gali tik tuomet,
  kai (i) yra pagr\u012fsta prie\u017eastis ir (ii) tolesnis komercializavimas gali
  pa\u017eeisti preki\u0173 \u017eenklo funkcij\u0105, laik\u0117si neteisingos teisin\u0117s
  nuomon\u0117s. Jeigu preki\u0173 \u017eenklo savininkas d\u0117l pagr\u012fstos
  prie\u017easties nesutinka su tolesniu preki\u0173 komercializavimu, \u0161is komercializavimas
  taip pat pa\u017eeid\u017eia preki\u0173 \u017eenklo funkcijas. Taigi tai n\u0117ra
  du skirtingi kriterijai, kuriuos b\u016btina atitikti.\\n3.1.3 3.1 dalyje pirmiausia
  teigiama, kad Hof (4.9 punkte) neatsi\u017evelg\u0117 \u012f tai, jog tas, kas prekiauja
  atnaujintomis prek\u0117mis, i\u0161 principo privalo imtis vis\u0173 pagr\u012fstai
  \u012fmanom\u0173 priemoni\u0173 siekdamas parodyti, kad tai yra atnaujintos prek\u0117s.
  Hof taip pat neatsi\u017evelg\u0117 \u012f tai, kad \u012fsp\u016bdis, jog PHZ ir
  EPAL ar jos narius sieja verslo ry\u0161iai, gali susidaryti ne tik d\u0117l atitinkam\u0173
  preki\u0173 reklamos, bet ir d\u0117l \u0161i\u0173 preki\u0173 komercializavimo
  ir d\u0117l kitokio pana\u0161aus \u012f preki\u0173 \u017eenkl\u0105 ar su juo
  sutampan\u010dio \u017eymens naudojimo. Pavyzd\u017eiui, gali b\u016bti svarbu tai,
  ar, naudojant atitinkam\u0105 etiket\u0119, i\u0161vengiama klaidinan\u010dio \u012fsp\u016bd\u017eio,
  kad preki\u0173 \u017eenklo savinink\u0105 ir tre\u010di\u0105j\u012f asmen\u012f
  sieja ekonominiai santykiai. \u0160iuo aspektu nurodytina \u012f Beniliukso Teisingumo
  Teismo sprendim\u0105 Valeo 3 , Europos S\u0105jungos Teisingumo Teismo sprendim\u0105
  Viking Gas / Kogan 4 ir Hoge Raad (Auk\u0161\u010diausiasis Teismas) sprendim\u0105
  Kool / Primagaz 5 .\\n3.1.4 3.2 dalyje kritikuojami Hof (4.10 punkte) pateikti motyvai,
  kad preki\u0173 \u017eenklo funkcija n\u0117ra garantuoti kokyb\u0119 po pirmojo
  i\u0161leidimo \u012f rink\u0105, kad jis taip pat negarantuoja, jog tretieji asmenys
  neatliks preki\u0173 remonto, ir kad naudojant kolektyvin\u012f preki\u0173 \u017eenkl\u0105
  ne\u012fmanoma pasiekti, jog su preki\u0173 \u017eenklo savininko sutikimu \u012f
  rink\u0105 i\u0161leistus pad\u0117klus remontuot\u0173 i\u0161imtinai tam tikri
  (juridiniai) asmenys \u2013 preki\u0173 \u017eenklo savininko nariai arba licencijos
  gav\u0117jai \u2013, laikydamiesi tam tikr\u0173 standart\u0173, tokiu b\u016bdu
  siekiant i\u0161saugoti kokyb\u0119 po pirmojo i\u0161leidimo \u012f rink\u0105.\\n3.2.1
  dalyje teigiama, kad Hof neatsi\u017evelg\u0117 \u012f tai, jog EPAL preki\u0173
  \u017eenklo funkcijos kaip tik ir yra (orig. p. 6) u\u017etikrinti kokyb\u0119 ne
  tik pirmojo i\u0161leidimo \u012f rink\u0105 momentu, bet ir po to. Tai susij\u0119
  su preki\u0173, kurias galima mainyti, kurios yra skirtos (daugkartiniam) naudojimui
  ir labai da\u017enai patiria dideles apkrovas, pob\u016bd\u017eiu. Tod\u0117l pad\u0117kl\u0173
  gamybai ir remontui b\u016btina kelti auk\u0161tus reikalavimus, o naudotojai turi
  gal\u0117ti pagr\u012fstai tik\u0117tis, kad pad\u0117klai \u0161iuos reikalavimus
  atitinka.\\n3.2.2 dalyje teigiama, kad Hof 4.10 punkto paskutiniame sakinyje neatsi\u017evelg\u0117
  \u012f tai, jog, kaip argumentuoja EPAL, EPAL preki\u0173 \u017eenkl\u0105 pa\u017eeid\u017eia
  tik tolesnis PHZ suremontuot\u0173 pad\u0117kl\u0173, pa\u017eym\u0117t\u0173 EPAL
  \u017eenklu,\\n3 1992 m. lapkri\u010dio 6 d. sprendimas (\u0161altinis nenurodomas)
  (bylos Nr. A 89/1 ir A 91/1].\\n4 2011 m. liepos 14 d. sprendimas, byla C-46/10,
  ECLI:EU:C:2011:485.\\n5 2018 m. sausio 5 d. sprendimas, ECLI:NL:HR:2018:10.\\n\\nkomercializavimas.
  EPAL buvo paai\u0161kinusi, kad jeigu PHZ nori pati remontuoti europad\u0117klus
  neprisijungdama prie EPAL, ji privalo pa\u0161alinti ir (arba) u\u017etepti EPAL
  \u017eenklus, taip ai\u0161kiai parodydama visuomenei, kad tai yra atnaujinti pad\u0117klai.
  \u012emanoma pa\u0161alinti kolektyvin\u012f EPAL preki\u0173 \u017eenkl\u0105 nepakenkiant
  produkto tinkamumui naudoti ir (arba) patrauklumui.\\n\\n3.2.3 dalyje teigiama,
  kad Hof (4.10 punkte) neteisingai \u012fvertino kolektyvinio preki\u0173 \u017eenklo
  pob\u016bd\u012f ir jam b\u016bdingus aspektus. Su EPAL kolektyviniu preki\u0173
  \u017eenklu yra siejami reikalavimai ir EPAL nariams, ir tam, kaip EPAL nariai preki\u0173
  \u017eenkl\u0105 naudoja. Tod\u0117l EPAL kolektyvinio preki\u0173 \u017eenklo funkcija
  tikrai yra garantuoti kokyb\u0119 po pirmojo i\u0161leidimo \u012f rink\u0105. 3.2.4
  dalyje teigiama, kad Hof, vertindamas kilm\u0117s nuorodos funkcij\u0105 ir preziumuodamas,
  kad \u0161i funkcija gali tur\u0117ti reik\u0161m\u0117s tik pirmojo i\u0161leidimo
  \u012f rink\u0105 momentu, bet ne v\u0117liau, r\u0117m\u0117si neteisinga teisine
  nuomone. \u012e BP\u017dR 13 straipsnio 2 dalies taikymo srit\u012f patenkantys
  atvejai per definitionem yra tolesnio jau i\u0161leist\u0173 \u012f rink\u0105 preki\u0173
  komercializavimo atvejai.\\n3.1.5 4 dalyje kritikuojamas Hof (5.3 punkte) pateiktas
  motyvas, kad EPAL reikalavimai, kiek jie grind\u017eiami neteis\u0117tu veiksmu,
  i\u0161 esm\u0117s remiasi argumentais, kad PHZ naudoja EPAL preki\u0173 \u017eenkl\u0105,
  ir tod\u0117l \u0161i\u0173 reikalavim\u0173 likimas yra toks pat kaip ir teise
  \u012f preki\u0173 \u017eenkl\u0105 grind\u017eiam\u0173 reikalavim\u0173. 4.1 dalyje
  paai\u0161kinama, kad Hof ignoravo EPAL argumentus, jog remont\u0105 PHZ atlieka
  nesivadovaudama taikomais grie\u017etais kokyb\u0117s standartais ir specifikacijomis
  ir neprisiima kit\u0173 pareig\u0173, kurias privalo vykdyti EPAL nariai, ta\u010diau
  pad\u0117klus parduoda kaip europad\u0117klus. Taip PHZ gauna naudos i\u0161 EPAL
  sistemos EPAL ir jos nari\u0173 s\u0105skaita, u\u017esiima nes\u0105\u017eininga
  konkurencija ir kenkia EPAL asociacijai ir jos sistemai. Hof nepagr\u012fstai ne\u012fvertino,
  ar \u0161ie veiksmai EPAL, kaip kolektyvinio preki\u0173 \u017eenklo savinink\u0117s,
  at\u017evilgiu n\u0117ra neteis\u0117ti.\\n3.2.1 Taigi visos kasacinio skundo pagrindo
  dalys, i\u0161skyrus 4 dal\u012f, yra susijusios su klausimu, ar EPAL, remdamasi
  savo kolektyviniu preki\u0173 \u017eenklu, pagal (\u0161ioje byloje dar taikytino)
  BP\u017dR (t. y. 2009 m. reglamento) 13 straipsnio 2 dal\u012f gali nesutikti su
  tolesniu EPAL \u012f rink\u0105 su EPAL preki\u0173 \u017eenklu i\u0161leist\u0173
  pad\u0117kl\u0173 komercializavimu, kur\u012f atlieka PHZ, kuri n\u0117ra EPAL nar\u0117
  ar licencijos gav\u0117ja, kiek \u0161ie pad\u0117klai buvo suremontuoti PHZ.\\n3.2.2
  Pagal BP\u017dR 13 straipsnio 2 dal\u012f, siejam\u0105 su 13 straipsnio 1 dalimi,
  tai \u012fmanoma tik tuo atveju, jeigu EPAL tam turi pagr\u012fst\u0173 prie\u017eas\u010di\u0173,
  kurios, kaip nustatyta \u0161ioje normoje, (orig. p. 7) vis\u0173 pirma yra tuomet,
  jeigu i\u0161leidus prekes \u012f rink\u0105 pasikeit\u0117 arba pablog\u0117jo
  j\u0173 kokyb\u0117.\\n3.2.3 Europos S\u0105jungos Teisingumo Teismas dar n\u0117ra
  parei\u0161k\u0119s nuomon\u0117s d\u0117l to, ar (ir, jei taip, kokiomis aplinkyb\u0117mis)
  tolesnis suremontuot\u0173 preki\u0173 \u017eenklu pa\u017eym\u0117t\u0173 produkt\u0173
  komercializavimas, kur\u012f atlieka licencijos neturintis\\n\\nasmuo, gali b\u016bti
  pagr\u012fsta prie\u017eastis preki\u0173 \u017eenklo tur\u0117tojui nesutikti su
  tolesniu preki\u0173 komercializavimu naudojant preki\u0173 \u017eenkl\u0105.\\n3.2.4
  Pirmuoju klausimu, kuriame keliama \u0161i pagrindin\u0117 problema, siekiama i\u0161siai\u0161kinti,
  ar Teisingumo Teismo ai\u0161kinant (vis\u0173 pirma) Preki\u0173 \u017eenkl\u0173
  direktyvos 89/104 5 straipsnio 1 dalies a punkt\u0105 i\u0161pl\u0117tota \u201efunkcij\u0173
  teorija\\\", susijusi su preki\u0173 \u017eenklo teikiama apsauga, \u2013 kilm\u0117s
  nuorodos ir kokyb\u0117s garantijos funkcija bei informavimo, investavimo ar reklamos
  funkcijos 6 \u2013 turi reik\u0161m\u0117s ir taikant BP\u017dR 13 straipsnio 2
  dal\u012f ir, jei taip, ar tai susij\u0119 su s\u0105vokos \u201epagr\u012fstos
  prie\u017eastys\\\" ai\u0161kinimu, ar su papildomu reikalavimu, kur\u012f preki\u0173
  \u017eenklo savininkas privalo \u012fvykdyti tam, kad gal\u0117t\u0173 s\u0117kmingai
  nesutikti su tolesniu komercializavimu. Kartu kyla klausimas, ar visada galima preziumuoti
  \u201epagr\u012fstas prie\u017eastis\\\", kai tolesnis komercializavimas pa\u017eeid\u017eia
  ar gali pa\u017eeisti vien\u0105 ar kelias \u0161i\u0173 funkcij\u0173.\\n3.2.5
  Gali b\u016bti, kad preki\u0173 \u017eenklo savininko galimyb\u0117 nesutikti su
  suremontuot\u0173 preki\u0173 tolesniu komercializavimu priklauso nuo to, (a) ar
  tai produktai, kuri\u0173 gamybai turi b\u016bti keliami techniniu po\u017ei\u016briu
  auk\u0161ti reikalavimai, pavyzd\u017eiui, d\u0117l saugumo, ir (b) ar remontas
  apima prek\u0117s b\u016bkl\u0117s pakeitim\u0105, kuris n\u0117ra nereik\u0161mingas
  (kaip tai suprantama pagal Beniliukso Teisingumo Teismo jurisprudencij\u0105, susijusi\u0105
  su tuometiniais Beniliukso teis\u0117s aktais 7 ). Taigi tai susij\u0119 su klausimu,
  ar pagr\u012fst\u0173 prie\u017eas\u010di\u0173 buvimui turi \u012ftakos atitinkam\u0173
  preki\u0173 arba atlikto remonto pob\u016bdis.\\n3.2.6 Taip pat kyla klausimas,
  ar, vertinant pagr\u012fstos prie\u017easties buvim\u0105, yra ar gali b\u016bti
  svarbios ypatingos aplinkyb\u0117s, kaip antai susiklos\u010diusios \u0161ioje byloje
  (\u017er. 2.1 punkto ii ir iii papunk\u010dius).\\n3.2.7 Gali b\u016bti, kad, atsi\u017evelgiant
  \u012f Teisingumo Teismo sprendim\u0105 byloje Viking Gas / Kosan Gas 8 , reikia
  nuspr\u0119sti, kad pagr\u012fstos prie\u017eastys yra tada, kai prek\u0117s \u017eenklas
  naudojamas tokiu b\u016bdu, kuris gali sukelti \u012fsp\u016bd\u012f, kad prek\u0117s
  \u017eenklo savinink\u0105 (ar jo licencijos gav\u0117jus) ir \u0161al\u012f, kuri
  toliau komercializuoja prekes, sieja ekonominiai ry\u0161iai, ypa\u010d kad \u0161i
  \u0161alis priklauso preki\u0173 \u017eenklo savininko platinimo tinklui arba kad
  tarp j\u0173 egzistuoja ypatingas santykis. Kita vertus, gali b\u016bti, kad, remiantis
  \u0161iuo sprendimu, reikia nuspr\u0119sti, kad pagr\u012fst\u0173 prie\u017eas\u010di\u0173
  n\u0117ra, jeigu suremontavus pad\u0117klus ai\u0161kiai parodoma, kad remont\u0105
  atliko ne preki\u0173 \u017eenklo savininkas ar vienas i\u0161 jo licencijos gav\u0117j\u0173.
  Viena i\u0161 galimybi\u0173 tai padaryti b\u016bt\u0173 pad\u0117kl\u0173 \u017eenklinimas
  etiket\u0117mis, jeigu reikia, pa\u0161alinant preki\u0173 \u017eenkl\u0105. Gali
  b\u016bti, kad \u0161iuo at\u017evilgiu turi reik\u0161m\u0117s\\n6 \u017dr. naujausi\u0105
  2013 m. rugs\u0117jo 19 d. Sprendim\u0105 Martin y Paz / Depuydt (C-661/11, ECLI:EU:C:2013:577).\\n7
  1992 m. lapkri\u010dio 6 d. Sprendimas Automotive / Valeo (\u0161altinis nenurodomas)
  (bylos Nr. A 89/1 ir A 91/1).\\n8 2011 m. liepos 14 d. sprendimas, byla C-46/10,
  ECLI:EU:C:2011:485.\\n\\ntai, ar preki\u0173 \u017eenklas (orig. p. 8) gali b\u016bti
  pa\u0161alintas paprastai, nepakenkiant pad\u0117kl\u0173 techniniam tinkamumui
  ar praktiniam tinkamumui naudoti.\\n3.2.8 Kadangi \u0161ioje byloje nagrin\u0117jamas
  kolektyvinis preki\u0173 \u017eenklas, kyla dar vienas klausimas, ar atsakymas \u012f
  pirma min\u0117tus klausimus visi\u0161kai ar i\u0161 dalies taikomas ir kolektyviniam
  preki\u0173 \u017eenklui. \u0160iuo po\u017ei\u016briu svarbu yra tai, kad (2009
  m.) BP\u017dR, kitaip nei 2015 m. S\u0105jungos preki\u0173 \u017eenklo reglamente
  (2017/1001), sertifikavimo \u017eenklas nenumatytas, taigi gali b\u016bti, kad BP\u017dR
  turi b\u016bti ai\u0161kinamas taip, kad su kolektyviniu preki\u0173 \u017eenklu,
  taip pat ir atsi\u017evelgiant \u012f BP\u017dR 67 straipsnio nuostatas, siejama
  arba gali b\u016bti siejama kokyb\u0117s garantija, galiojanti ir po pirmojo i\u0161leidimo
  \u012f rink\u0105 (t. y. preki\u0173 \u017eenklo savininko arba jo nari\u0173 atlikto
  i\u0161leidimo) momento.\\n3.2.9 Kadangi Teisingumo Teismas dar n\u0117ra pri\u0117m\u0119s
