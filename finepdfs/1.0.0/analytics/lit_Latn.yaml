  |\\n| TM          | Lietuvos Respublikos teisingumo ministerija |\\n\\nTurto naudotojai\\nValstyb\u0117s
  institucijos ir \u012fstaigos, j\u0173 kontroliuojamos sveikatos prie\u017ei\u016bros
  \u012fstaigos, auk\u0161tosios mokyklas ir moksliini\u0173 tyrim\u0173 institutai,
  bendrojo ugdymo mokyklos, profesinio mokymo \u012fstaigos, socialin\u0117s globos
  ir (arba) socialini\u0173 paslaug\u0173 \u012fstaigos, kuri\u0173 teisin\u0117 forma
  yra vie\u0161oji \u012fstaiga, taip pat \u0161i\u0173 vie\u0161i\u0173j\u0173 \u012fstaig\u0173
  kontroliuojamos tokio pat pob\u016bd\u017eio veikl\u0105 vykdan\u010dios vie\u0161osios
  \u012fstaigos ir vie\u0161ojo sektoriaus subjekt\u0173 kontroliuojamos program\u0173
  ir projekt\u0173, finansuojam\u0173 i\u0161 valstyb\u0117s biud\u017eeto, \u012fskaitant
  Europos S\u0105jungos finansines paramas, tarptautines finansines paramas ir kitas
  l\u0117\u0161as, administravimo funkcijas atliekan\u010dios \u012fstaigos, kurioms
  galimyb\u0119 gauti \u0161ias l\u0117\u0161as nustatyta j\u0173 veiklos srityje
  reglamentuojan\u010diuose \u012fstatymuose ir kituose teis\u0117s aktuose ir kuri\u0173
  teisin\u0117 forma yra vie\u0161oji \u012fstaiga, ir vie\u0161oji \u012fstaiga Lietuvos
  nacionalinis radijas ir televizija\\n\\nTurto valdymo \u012fstatymas\\nLietuvos
  Respublikos valstyb\u0117s ir savivaldybi\u0173 turto valdymo, naudojimo ir disponavimo
  juo \u012fstatymas\\n\\nTurto valdytojai\\nValstyb\u0117s institucijos, \u012fstaigos,
  valstyb\u0117s \u012fmon\u0117s ir Turto valdymo \u012fstatyme nustatytais atvejais
  kit\u0173 juridini\u0173 asmen\u0173, patik\u0117jimo teise valdantys, naudojantis
  valstyb\u0117s tur\u0105 ir disponuojantys juo\\n\\nEIM\\nLietuvos Respublikos ekonomikos
  ir inovacij\u0173 ministerija\\n\\nURM\\nLietuvos Respublikos u\u017esienio reikal\u0173
  ministerija\\n\\nV\u012e\\nValstyb\u0117s \u012fmon\u0117\\n\\nVie\u0161ojo sektoriaus
  subjektai\\nValstyb\u0117s turto valdytojai ir VTIPS naudotojai, teis\u0117s akt\u0173
