  \u017demiau esan\u010diame paveiksle kit\u0105 dal\u012f sudaro \u0161i\u0173 paskir\u010di\u0173
  turtas: kitos \u2013 8 proc., specialiosios \u2013 4 proc., po 2 proc. \u2013 pagalbinio
  u\u017ekio ir prekybos ir paslaug\u0173, po 1 proc. \u2013 sporto ir poilsiu, ir
  0,1 proc. \u2013 religin\u0117s.\\n\\n**2019 m. valstyb\u0117s nekilnoamojo turto
  pasiskirstymas pagal NT paskirt\u012f ir naudojim\u0105**\\n\\n\\\\(^4\\\\) Subjektai,
  VNT valdantys patik\u0117jimo teise, ji naudoja valstyb\u0117s jiems priskirtoms
  funkcijoms vykdyti ir turi teise priimti arba inicijuoti sprendimus d\u0117l \u0161io
  turto valdymo, naudojimo ir disponavimo juo, i\u0161skyrus sprendimus d\u0117l perleidimo
  kit\u0173 asmen\u0173 nusavyb\u0119, ar d\u0117l daiktini\u0173 teisi\u0173 suvar\u017eymo.
  VNT patik\u0117jimo teise valdo, naudoja ir disponuoja juo CTV valstyb\u0117s institucijos,
  \u012fstaigos ir organizacijos, valstyb\u0117s \u012fmon\u0117s, taip pat savivaldyb\u0117s
  Turto valdymo \u012fstatymo nustatytais atvejais. Kitiemis juridiniams asmenims
  VNT patik\u0117jimo teise gali b\u016bti perduotas pagal turto patik\u0117jimo sutart\u012f
  tik tais atvejais, kai \u012fstatymai jiems priskiria valstyb\u0117s funkcij\u0173
  vykdym\u0105 (pvz., universitetai, AB \u201eLietuvos gele\u017einkeliai\u201c).\\n\\n\\\\(^5\\\\)
  Remiantis VTIPS duomenimis ir ekspertiniu VJ Turto banko vertinimu.\\n\\nLietuvoje
