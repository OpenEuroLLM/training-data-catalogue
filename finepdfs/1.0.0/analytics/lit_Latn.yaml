  \u2013 PHZ, <...> (orig. p. 2)\\n```\\n\\n1. Tolesn\u0117 bylos eiga kasaciniame
  procese\\n\\n1.1 <...>\\n\\n1.2 <...> (Nacionalinio proceso eiga)\\n\\n2. Faktin\u0117s
  aplinkyb\u0117s\\n\\n2.1 Kasaciniame procese galima vadovautis \u0161iomis faktin\u0117mis
  aplinkyb\u0117mis.\\n(i) EPAL yra \u012fregistruoto ES \u017eodinio / vaizdinio
  preki\u0173 \u017eenklo EPAL Nr. 472415 savinink\u0117; \u0161is \u017eenklas 1998
  m. gruod\u017eio 22 d. buvo \u012fregistruotas, be kita ko, \u201eDaugkartinio naudojimo
  pad\u0117klams\\\" (klas\u0117s 6 ir 20) \u017eym\u0117ti. Nurodyta, kad preki\u0173
  \u017eenklas yra kolektyvinis \u017eenklas.\\n(ii) Egzistuoja privatin\u0117s teis\u0117s
  reguliuojama vadinam\u0173j\u0173 EUR / EPAL pad\u0117kl\u0173 standartizacijos
  sistema (toliau ir \u2013 EPAL sistema). \u0160ioje sistemoje numatyta, kad pad\u0117klai
  (toliau \u2013 europad\u0117klai) ir po remonto turi atitikti tam tikrus standartus
  ir specifikacijas. Remiantis \u0161ia sistema, teis\u0119 gaminti ir remontuoti
  europad\u0117klus bei prekiauti jais turi tik \u012fmon\u0117s, kurioms EPAL yra
  suteikusi naudojimosi teis\u0119 (licencijos gav\u0117jai).\\n(iii) EPAL administruoja
  europad\u0117klus ir kontroliuoja j\u0173 kokyb\u0119. \u0160ie pad\u0117klai \u017eymimi
  i\u0161degintu EUR ir (arba) EPAL preki\u0173 \u017eenklu ir i\u0161leid\u017eiami
  \u012f rink\u0105. EPAL tikslas \u2013 sukurti ir palaikyti visame pasaulyje atvir\u0105
  vienodos kokyb\u0117s ir vienod\u0173 po\u017eymi\u0173 pad\u0117kl\u0173 main\u0173
  sistem\u0105. Be to, EPAL kovoja su pad\u0117kl\u0173 klastojimu.\\n(iv) PHZ neturi
  ii papunktyje apra\u0161ytos naudojimosi teis\u0117s. 2014 m. ji remontavo ir toliau
  prekiavo europad\u0117klais, pa\u017eym\u0117tais EPAL preki\u0173 \u017eenklu.\\n2.2.1
  \u0160ioje byloje EPAL reikalauja, kiek tai reik\u0161minga kasaciniame procese,\\n\\n\u2013
  pripa\u017einti, kad remontuodama anks\u010diau su EPAL preki\u0173 \u017eenklu
  \u012f rink\u0105 i\u0161leistus pad\u0117klus ir jais prekiaudama PHZ padar\u0117
  preki\u0173 \u017eenklo pa\u017eeidim\u0105 arba veik\u0117 neteis\u0117tai;\\n\u2013
  \u012fsp\u0117jant apie nesilaikant \u0161io nurodymo gresian\u010di\u0105 baud\u0105,
  nurodyti nutraukti EPAL preki\u0173 \u017eenklu pa\u017eym\u0117t\u0173 pad\u0117kl\u0173
  remont\u0105 ir tolesn\u012f komercializavim\u0105.\\n\\nApibendrinant EPAL teigia,
  kad PHZ ne tik remontavo EPAL preki\u0173 \u017eenklu pa\u017eym\u0117tus pad\u0117klus,
  bet jais ir toliau prekiavo. (orig. p. 3)\\n\\n2.2.2 Rechtbank (Pirmosios instancijos
  teismas) reikalavimus patenkino, kiek jie buvo susij\u0119 su tolesniu europad\u0117kl\u0173
  komercializavimu, bet atmet\u0117 juos tiek, kiek jie buvo susij\u0119 tik su europad\u0117kl\u0173
  remontu 1 .\\n2.2.3 Hof (Apeliacinis teismas) paliko galioti Rechtbank sprendim\u0105,
  kiek jame, PHZ buvo nurodyta, gavus \u0161\u012f sprendim\u0105, nedelsiant nutraukti
