  koncentracija kraujyje;  \\n- fizinio aktyvumo stoka;  \\n- r\u016bkymas;  \\n-
  COVID \u2013 19 infekcija.  \\nTikslas \u2013 supa\u017eindinti mokyklas bendruomen\u0119
  su \u0161irdies tausojimu ir prevencijos b\u016bdais.  \\nPriemon\u0117:  \\n\u2713
