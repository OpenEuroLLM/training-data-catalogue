  lavinimo mokyklas mokytojui ir sveikat\u0173j\u0173 pa\u017eeid\u017eios specialistui,
  kurie \u012fvairiomis mokiniams idomiomis formomis g\u0117sta pateikti esmin\u0117s
  sveikos mitybos \u017einias. Tikslas: ugdyti vaik\u0173 pa\u017eint\u012f su dar\u017eov\u0117mis,
  vaisiais, vandeniu, gr\u016bdineis kilm\u0117s produktais ir suvokti j\u0173 naud\u0105
  sveikatai. Priemon\u0117: \u2713 teorinis - praktinis u\u017esi\u0117mimas *lapkri\u010dio
  9 d. \u2013 Europos sveikos mitybos diena |\\n| --- | --- | --- |\\n| II sav. |
  Prevencin\u0117s programos Lietuvoje. Onkologini\u0173 lig\u0173 profilaktika. |
  Pasaulin\u0117 sveikatos organizacija (PSO), remdamasi moksliniais \u012frodymais
  teigia, kad daugelio v\u0117\u017eio susirgimu b\u016bt\u0173 galima visi\u0161kai
