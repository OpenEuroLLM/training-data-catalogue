  pa\u0161alinti problem\u0105.\\n\\nProblemos nustatymas ir sprendimas priklauso
  nuo problemos sunkumo lygio. Problemos pagal sunkumo lyg\u012f klasifikuojamos sekan\u010diai:\\n\\n-
  Kritinis: sistema neveikia ir n\u0117ra problemos apeigos b\u016bd\u0173; problema
  daro didel\u012f poveik\u012f subjekto veiklai;\\n- Auk\u0161tas: sistema veikia;
  n\u0117ra problemos apeigos b\u016bd\u0173; problema i\u0161 dalies turi poveik\u012f
  subjekto veiklai;\\n- \u017demas: sistema veikia; galima rasti problemos apeigos
  b\u016bdus;\\n\\nAdministratorius imasi vis\u0173 proting\u0173 priemoni\u0173 u\u017etikrindamas,
