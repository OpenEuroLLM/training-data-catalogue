  ............................................. 99\\n\\nI\u017dANGA\\n\\nThe sun rises
  over a city, casting a warm glow over the landscape.\\n\\n2019 met\u0173 valstybei
  nuosavyb\u0117s teise priklausan\u010dio turto valdymo, naudojimo ir disponavimo
  juo ataskaita (toliau \u2013 Ataskaita) \u2013 tai ketvirtoji tokio pob\u016bd\u017eio
  V\u012e Turto banko ekspert\u0173 parengta ataskaita, kuriuoje siekiama ne\u0161ali\u0161kai
  parodyti valstyb\u0117s nekilnojamojo turto (toliau \u2013 VNT) apimtis, jo i\u0161laikymo
  s\u0105naudas, turto valdymo efektyvumo rodiklius, pateikti informacij\u0105 apie
  VNT sandorius ir j\u0173 b\u016bkl\u0119, taip pat nekilnojamojo turto panaudojimo
  atvejus, kurie leid\u017eia identifikuoti spr\u0119stinias problemas. Ketvirtus
  metus vyksta administracin\u0117s paskirties VNT centralizavimas, tad atskiras d\u0117mesys
  Ataskaitoje yra skiriamas \u0161io proceso rezultatams aptarti.\\n\\nPrie\u0161
  pradedant detaliai nagrin\u0117ti Ataskaitos duomenis, pateikiame pagrindiniai 2019
  m. \u012fgyvendint\u0173 VNT valdymo efektyvumo didinimo priemoni\u0173 rezultatai:\\n\\n-
  2019 m. valstyb\u0117s turto centralizacijai prie\u0161paskutiniu V etapu buvo pateikt\u0173
  ir perimta 244 t\u016bkst. kv. metr\u0173 administracin\u0117s paskirties nekilnojamojo
  turto. I\u0161 viso I\u2013V etapais centralizuotai valdyti atiduota beveik 585
  t\u016bkst. kv. metr\u0173 valstyb\u0117s nekilnojamojo turto ploto, kuris sudaro
  81 proc. viso centralizuotai valdyti perimtino administracin\u0117s paskirties ploto.\\n\\n-
  Valstyb\u0117s administracinio nekilnojamojo turto centralizavimas, perteiklinio
  ir nereikalingo valstyb\u0117s turto bei i\u0161 tre\u010di\u0173j\u0173 \u0161ali\u0173
  i\u0161sinuomoto turto atsisakymas 2019 m. valstybei suteik\u0117 beveik 33,8 mln.
  eur\u0173 naudos.\\n\\n- 2019 m. vykstant VNT centralizacijai, institucijos i\u0161
  viso atsi\u0161ak\u0117 apie 16,4 t\u016bkst. kv. metr\u0173 valdom\u0173 patalp\u0173
  perteiklinio ploto, o tai per metus leido sutaupyti daugiau nei 0,4 mln. eur\u0173
  \u0161i\u0173 patalp\u0173 i\u0161laikymo s\u0105naud\u0173.\\n\\n- Daugiausia valdyt\u0173
  patalp\u0173 ploto (i\u0161 viso apie 10 t\u016bkst. kv. metr\u0173) atsi\u0161ak\u0117
  Valstybin\u0117 mokes\u010di\u0173 inspekcija \u2013 tai leido per metus sutapyt\u012f
  apie 0,25 mln. eur\u0173 \u0161i\u0173 patalp\u0173 i\u0161laikymo s\u0105naud\u0173.
  Papildomai 0,183 mln. eur\u0173 valstyb\u0117s l\u0117\u0161\u0173 buvo sutaupyta
  Valstybinei mokes\u010di\u0173 inspekcijai atsisakius i\u0161sinuomot\u0173 patalp\u0173
  (i\u0161 viso apie 2,1 t\u016bkst. kv. metr\u0173).\\n\\n- 2019 m. V\u012e Turto
  bankas vie\u0161uosiuose aukcionuose pardav\u0117 rekordin\u012f kiek\u012f valstybei
  nereikalingo nekilnojamojo turto objekt\u0173 \u2013 keliskart daugiau nei ankstesniais
  metais: i\u0161 viso buvo parduoti 863 nekilnojamojo turto objektai\u00b9, kuri\u0173
  bendras plotas sudaro daugiau nei 85,2 t\u016bkst. kv. metr\u0173. (2018 m. buvo
  parduota 417 objekt\u0173 (bendras plotas \u2013 34,5 t\u016bkst. kv. metr\u0173);
  2017 m. \u2013 294 nekilnojamojo turto objektai (bendras plotas \u2013 36,95 t\u016bkst.
  kv. metr\u0173)).\\n\\n- Tai leido valstybei sutaupyti apie 1,7 mln. eur\u0173 pastat\u0173
  eksploatacijos s\u0105naud\u0173 ir gauti daugiau nei 31,5 mln. eur\u0173 pajam\u0173.\\n\\n-
  Daugiausiai VNT \u012f parduodamo turto s\u0105ra\u0161\u0105 perdav\u0117 V\u012e
  Valstybin\u012f mi\u0161k\u0173 ur\u0117dija \u2013 233 nekilnojamojo turto objektus
  (17,1 t\u016bkst. kv. metr\u0173), Lietuvos edukologijos universitetas\u00b2 \u2013
  20 nekilnojamojo turto objekt\u0173 (16,7 t\u016bkst. kv. metr\u0173), Lietuvos
  agrarin\u012f ir mi\u0161k\u0173 mokslo centras \u2013 11 nekilnojamojo turto objekt\u0173
  (3,7 t\u016bkst. kv. metr\u0173).\\n\\n**Valstyb\u0117s l\u0117\u0161\u0173 taupymas,
  efektyvinant VNT valdym\u0105**\\n\\n2019 m. bir\u017eelio m\u0117n. Lietuvos Respublikos
  Vyriausyb\u0117 (toliau \u2013 Vyriausyb\u0117) pri\u0117mus nutarim\u0105 buvo
  \u012fgyvendintas V administracin\u0117s paskirties VNT perdavimo valdyti centralizuotai
  etapas. D\u0117l \u0161io etapo, \u012f kur\u012f buvo \u012ftrauktas Susisiekimo
  ministerijos, Kult\u016bros ministerijos, \u0160vietimo, mokslo ir sporto ministerijos,
  Socialin\u0117s apsaugos ir darbo ministerijos bei Teisingumo ministerijos ir joms
  pavald\u017ei\u0173 \u012fstaig\u0173 bei kit\u0173 institucij\u0173 valdomas nekilnojamasis
  turtas, V\u012e Turto banko centralizuotai valdomo nekilnojamojo turto portfelis
  padid\u0117jo 244 t\u016bkst. kv. metr\u0173 ir i\u0161 viso sudaro 81 proc. viso
  perimtino centralizuotai valdyti administracin\u0117s paskirties VNT ploto.\\n\\n---\\n\\n\u00b9
  Parduot\u0173 objekt\u0173 (unikali\u0173 numeri\u0173) skai\u010dius, neskaiciuojant
  \u017eem\u0117s skl\u0173p\u0173 ir kitos turto, pvz., l\u0117ktuvo.\\n\\n\u00b2
  Dabar Vytauto Did\u017eiojo universitetas.\\n\\nPer V centralizacijos etap\u0105
  V\u012e Turto bankui daugiausiai VNT valdyti perdav\u0117 U\u017eimtumo tarnyba
  prie Lietuvos Respublikos socialin\u0117s apsaugos ir darbo ministerijos (44,7 t\u016bkst.
  kv. metry) ir Valstybinio socialinio draudimo fondo valdyba bei jai pavald\u016bs
  teritoriniai skyriai (i\u0161 viso apie 36 t\u016bkst. kv. metry).\\n\\nVykdant
  VNT centralizacijai, institucijos kriti\u0161kiau \u012fsivertino naudojam\u0105
  administracin\u0117s paskirties VNT plot\u0105 ir i\u0161 viso per 2019 m. atsisak\u0117
  apie 16,4 t\u016bkst. kv. metr\u0173 perteklini\u0173 patalp\u0173. Tai leido valstybei
  per metus sutauptyti daugiau nei 0,4 mln. eur\u0173 \u0161i\u0173 patalp\u0173 eksploatacijos
  s\u0105naud\u0173. Skaiciuojama, kad per penkerius VNT centralizavimo metus institucijos
  i\u0161 viso atsisakys apie 70 t\u016bkst. kv. metr\u0173 perteklinio VNT ploto
  ir sutauypys apie 1,75 mln. eur\u0173 valstyb\u0117s l\u0117\u0161\u0173.\\n\\nI\u0161auges
  VNT centralizacijos mastas ir vie\u0161ai skelbiama Ataskaita, kaip paskatinimo
  priemon\u0117s, leido perkelti institucijas \u012f jiems tinkamasnes patalpas ir
  sutauptyti valstyb\u0117s l\u0117\u0161\u0173 bei pagerinti darbo s\u0105lygas.
  Pavyzd\u017eiui, vien Valstybine mokes\u010di\u0173 inspekcija per 2018\u20132019
  m. apie 10 t\u016bkst. kv. metry suma\u017eino naudojam\u0105 administracin\u0117s
  paskirties VNT plot\u0105 ir atsisak\u0117 2,1 t\u016bkst. kv. metry i\u0161siniuomoto
  NT ploto. Visa tai leido sutauptyti per 0,43 mln. eur\u0173 valstyb\u0117s l\u0117\u0161\u0173.\\n\\nVykdant
  VNT centralizavim\u0105, efektyvesnio valdymo buvo siekiama ne tik optimizuojant
  bendr\u0105 ir vienam darbuotojui tenkanti\u0105 plot\u0105, bet ir diegiant pastat\u0173
  prie\u017ei\u016bros ir klient\u0173 aptarnavimo standartus. Pa\u017eym\u0117tina,
  kad, V\u012e Turto bankui centralizuotai valdyti per\u0117mus kit\u0173 institucij\u0173
  savaranki\u0161kai valdytus pastatus, visas perimtas turtas yra apdraud\u017eiamas,
  pastatams priskiriami asmenys, atsakingi u\u017e pastat\u0173 technin\u0119 prie\u017ei\u016br\u0105,
  pastat\u0173 konstrukcij\u0173 prie\u017ei\u016bra yra atliekama laikantis STR reikalavim\u0173,
  vadovaujamas elektros vartojimo taisykl\u0117ms, sudaromos elektroras tiekimo schemos,
  pastat\u0173 \u0161ildymo sistemos prie\u017ei\u016bros pagal taisyklis rekomendacijas
  ir kt.\\n\\nV\u012e Turto bankas, siekdamas \u012fsivertinti klient\u0173 l\u016bkes\u010dius
  ir gr\u012f\u017etamaj\u012f ry\u0161\u012f, susijus\u012f su paslaugomis ir pastat\u0173
  prie\u017ei\u016bra, 2019 m. pareng\u0117 klient\u0173 aptarnavimo standart\u0105,
  kur\u012f savo veikloje prad\u0117s taikyti jau 2020 m. 2019 m. buvo atliktas klient\u0173
  pasitenkinimo tyrimas, kurio duomenys bus atskaitos ta\u0161kas, gerinant klientams
  teikiamas paslaugas ir jas ple\u010diant. 2020 m. bir\u017eelio m\u0117n. buvo atliktas
  pakartotinis NPS (Net Promoter Score) metodika pagr\u012fstas klient\u0173 pasitenkinimo
  V\u012e Turto banko teikiamomis paslaugomis tyrimas. I\u0161 68 klient\u0173, dalyvavusi\u0173
  min\u0117toje apklausoje, 27 (39 proc.) \u012fmon\u0117 \u012fvertino auk\u0161\u010diausiu
  balu (nuo 9 iki 10), o \u017eemiausiu balu (nuo 0 iki 6) \u012fmon\u0117 \u012fvertino
  16 (22 proc.) respondent\u0173: bendras klient\u0173 pasitenkinimo \u012fmon\u0117
  ir jos teikiamomis paslaugomis rodiklis \u2013 17 proc., t. y. 18 procentini\u0173
  punkt\u0173 didesnis nei 2019 m. Tai rodo, kad veiklos ir klientams teikiam\u0173
  paslaug\u0173 gerinimo priemon\u0117s yra efektyvios ir duoda norim\u0105 rezultat\u0105.\\n\\n2019
  m. ir toliau buvo s\u0117kmingai \u012fgyvendinama viena i\u0161 Vyriausyb\u0117s
  programos prioritetini\u0173 priemoni\u0173 \u2013 iki 2020 m. pabaigos centralizuotai
  valdyti 100 proc. viso perimtino administracin\u0117s paskirties VNT ir konsoliduoti
  bendraj\u0105 \u2013 turto valdymo ir prie\u017ei\u016bros \u2013 funkcij\u0105,
  taip pat siekti iki 10 proc. suma\u017einti turto valdymo ir prie\u017ei\u016bros
  s\u0105naudas. 2019 m. pabargoje V\u012e Turto bankas vald\u0117 81 proc. viso perimtino
  administracin\u0117s paskirties VNT ploto ir fiksavo 8,4 proc. ma\u017eesnes centralizuotai
  valdyti perimto VNT i\u0161laikymo s\u0105naudas.\\n\\n**Valstyb\u0117s l\u0117\u0161\u0173
  taupymas, parduodant nereikaling\u0105 nekilnojam\u0105j\u012f turt\u0105**\\n\\n2019
  m. Vyriausyb\u0117s sprendimais Vie\u0161ame aukcione parduodamo valstyb\u0117s
  nekilnoamojo turto s\u0105ra\u0161as papildytas 746 naujais VNT objektais.\\n\\nDaugiausia
  VNT \u012f parduodamo turto s\u0105ra\u0161\u0105 perdav\u0117 V\u012e Valstybini\u0173
  mi\u0161k\u0173 ur\u0117dija \u2013 233 nekilnoamojo turto objektus (17,1 t\u016bkst.
  kv. metry), Lietuvos edukologijos universitetas<sup>3</sup> \u2013 20 nekilnoamojo
  turto objekt\u0173 (16,7 t\u016bkst. kv. metry), Lietuvos agrarin\u012f ir mi\u0161k\u0173
  mokslo centras \u2013 11 nekilnoamojo turto objekt\u0173 (3,7 t\u016bkst. kv. metry).
  2019 m. V\u012e Turto bankas suorganizavo 1 504 vie\u0161uosius aukcionus \u2013
  tai did\u017eiausias skaicius per vis\u0105 V\u012e Turto banko gyvavimo istorij\u0105.
  Per aukcijonus buvo parduoti 863 valstybei nereikalingi nekilnoamojo turto objektai.
  Bendras parduot\u0173 objekt\u0173 plotas sudaro 85,2 t\u016bkst. kv. metry. Parduota
  475 gyvenamosios paskirties (23,5 t\u016bkst. kv. metry), 134 administracin\u0117s
  (beveik 21,8 t\u016bkst. kv. metry), 33 gamybos ir sandeliavimo (8,5 t\u016bkst.
  kv. metry), 42 kitos paskirties (7 t\u016bkst. kv. metry), 59 transporto ir gara\u017e\u0173
  (8,8 t\u016bkst. kv. metry), 42 pagalbinio \u00fakio (3,4 t\u016bkst. kv. metry),
  27 poilsio (1,3 t\u016bkst. kv. metry), 7 moksl\u00f8 (1,6 t\u016bkst. kv. metry),
  22 gydymo (beveik 8 t\u016bkst. kv. metry), 10 prekybos ir paslaug\u0173 (0,7 t\u016bkst.
  kv. metry), 7 specialiosios (0,6 t\u016bkst. kv. metry) paskirties nekilnoamojo
  turto objektai ir 5 in\u017eineriniai statiniai. Tai leido valstybei sutauptyti
  apie 1,7 mln. eur\u0173 pastat\u0173 eksploatacijos s\u0105naud\u0173 ir gauti 31,5
  mln. eur\u0173 pajam\u0173.\\n\\n---\\n\\n<sup>3</sup> Dabar Vytauto Did\u017eiojo
  universitetas.\\n\\nTokiam dideliam valstyb\u0117s funkcijoms vykdyti nenaudojamo
  VNT objekt\u0173 skai\u010diaus identifikavimui ir pardavimui poveik\u012f tur\u0117jo
  ir valstybei nuosavyb\u0117s teise priklausan\u010dio turto valdymo, naudojimo ir
  disponavimo juo ataskaitos, kuriose buvo \u012fvardytos svarbiausi\u0173s problemas,
  kliudan\u010dios siekti efektyvaus turto valdymo. Atsisakyti valstybei nereikalingo
  ir turto valdytoj\u0173 nenaudojamo nekilnojamojo turto, suma\u017einti tokio turto
  i\u0161laikymo l\u0117\u0161as ar \u0161iam tikslui j\u0173 neskirti \u2013 vienas
  i\u0161 prioritetini\u0173 centralizuoto turto valdymo tiksl\u0173.\\n\\n2020 m.
  planuojama baigti paskutin\u012f \u2013 VI \u2013 VNT centralizacijos etap\u0105.
  Nuo 2019 m. spalio \u012fsigaliojus Lietuvos Respublikos valstyb\u0117s ir savivaldybi\u0173
  turto valdymo, naudojimo ir disponavimo juo \u012fstatymo naujajai redakcijai, V\u012e
  Turto bankas kaip centralizuotas valstyb\u0117s turto valdytojas gavo daugiau teisi\u0173
  ir pareig\u0173. 2020 m. panaudos sutartys bus persira\u0161omos kaip nuomos sutartys.
  Patrauklesn\u0117se vietose nuomos mokes\u010dis \u012fstaigoms tur\u0117t\u0173
  b\u016bti auk\u0161tesnis u\u017e 2020 m. mokama mokes\u010di. Tai tur\u0117t\u0173
  paskatinti klientus optimizuoti savo naudojam\u0105 plot\u0105 ir leisti efektyviau
  naudoti valstybei priklausant\u012f administracin\u0117s paskirties tur\u0105. 2020
  m. V\u012e Turto bankas taip pat pareng\u0117 pirmaj\u012f 10 met\u0173 laikotarpio
  investicini\u0173 plan\u0105, kurio tikslas \u2013 tur\u0117ti geros b\u016bkl\u0117s,
  neperteklin\u012f portfel\u012f ir apr\u016bpinti biud\u017eetines \u012fstaigas
  j\u0173 poreikius ir \u0161iuolaiki\u0161kus darbo metodus atitinkan\u010diu administracin\u0117s
  paskirties turu. Pirmuosius trejus metus did\u017eiausias d\u0117mesys bus skiriamas
  energinio naudingumo efektyvinimo projektams ir blogos b\u016bkl\u0117s valdytiniems
  pastatams atnaujinti. Igyvendinant atnaujinimo projektus bus siekiama ne tik pagerinti
  pastat\u0173 b\u016bkl\u0119, bet ir efektyvinti darbo viet\u0173 planavim\u0105
  patalpose.\\n\\nI\u0161 kit\u0173 valstyb\u0117s institucij\u0173 ir \u012fstaig\u0173,
  valdan\u010di\u0173 valstyb\u0117s nekilnojamaj\u012f tur\u0105, tikimasi atsakingo
  ir ne\u017einybi\u0161ko po\u017ei\u016brio \u012f turto valdymo efektyvum\u0105
  \u2013 siekti atsisakyti nenaudojamo nekilnojamojo turto, o valdom\u0105 tur\u0105
  i\u0161naudoti efektyviau. Tik nuosekliai formuojant ir \u012fgyvendinant VNT valdymo
  politik\u0105, \u012fmanoma pasiekti real\u0173 poveik\u012f VNT valdymo efektyvumui
  turin\u010di\u0173 rezultat\u0173.\\n\\nMETIN\u0116 ATASKAITA\\n\\nSANTRAUKA\\n\\n#
  Vilnius, Lithuania\\n\\nVilnius is the capital and largest city of Lithuania. It
  is located in the southeastern part of the country, on the banks of the Vilnia River.
  The city has a rich history dating back to the 14th century when it was founded
  by King Jogaila of Lithuania. Over the centuries, Vilnius has been ruled by various
  powers including Poland, Russia, and Germany. Today, Vilnius is a vibrant city with
  a mix of old and new architecture, museums, galleries, and cultural events. The
  city is also known for its beautiful parks and gardens, including the famous Gediminas
  Hill.\\n\\nSANTRAUKA\\n\\n2019 met\u0173 valstybei nuosavyb\u0117s teise priklausan\u010dio
  turto valdymo, naudojimo ir disponavimo juo ataskaita (toliau \u2013 Ataskaita)
  \u2013 tai ketvirtoji tokio pob\u016bd\u017eio V\u012e Turto banko parengta ataskaita,
  kuriuo siekiama ne\u0161ali\u0161kai parodyti valstyb\u0117s nekilnoamojo turto
  (toliau \u2013 VNT) apimtis, jo i\u0161laikymo s\u0105naudas, turto valdymo efektyvumo
  rodiklius, pateikti informacij\u0105 apie VNT sandorius, taip pat ap\u017evelgti
  i\u0161snuomot\u0105 ir savivaldybioms priklausant\u012f NT, kuriuo naudojasi institucijos,
  vykdydamos joms pavestas valstyb\u0117s funkcijas. \u017demiau pateikiami esminiai
  \u0161ios ataskaitos faktai ir atliktos analiz\u0117s rezultatai.\\n\\nVNT sudaro
  Lietuvoje ir u\u017esienio valstyb\u0117se registruoti NT objektai, kuri\u0173 savinink\u0117
  yra Lietuvos Respublika. Absoliu\u010di\u0105 daugum\u0105 \u2013 net 99,8 proc.
  viso VNT sudaro Lietuvoje registruotas valstybei priklausantis NT. U\u017esienio
  valstyb\u0117se registruotos VNT sudaro vos 0,2 proc. viso VNT ploto ir daugiausia
  apima Lietuvos Respublikos ambasad\u0173, konsulat\u0173, atstov\u0173 ir ambasadori\u0173
  rezidencij\u0173 pastatus, kuriuos patik\u0117jimo teise valdo URM. Detali informacija
  apie u\u017esienio valstyb\u0117se registruot\u0105 VNT yra pateikiama 1 priede.\\n\\nValstybei
  nuosavyb\u0117s teise priklausantis nekilnojamasis turtas\\n\\nLietuvoje registruotas
  VNT\\n99,8 %\\n9,92 mln. m\u00b2\\n\\nU\u017esienyje registruotas VNT\\n0,2 %\\n0,024
  mln. m\u00b2\\n\\nLietuvoje registruotas valdomas VNT\\n\\nVNT objekt\u0173 skai\u010diaus
  (-2,0 proc.) ir VNT ploto (-3,4 proc.) poky\u010dius 2019 m. l\u0117m\u0117 daugiau
  nei duktart i\u0161aug\u0119s VNT objekt\u0173 pardavimas (per 2019 m. i\u0161 viso
  buvo parduota beveik 85,2 t\u016bkst. kv. metr\u0173 VNT ploto) ir did\u0117jan\u010dios
  valstyb\u0117s perimto be\u0161eimininkio ar paveld\u0117to NT apimtys. Likutin\u0117s
  vert\u0117s (+7,3 proc.) did\u0117jim\u0105 l\u0117m\u0117, palyginti su 2018 m.
  ataskaitiniu laikotarpiu, i\u0161augusios \u012f VTIPS suvest\u0173 duomen\u0173
  apie VNT likutines vertes apimtys. S\u0105naud\u0173 (-9,0 proc.) ma\u017e\u0117jim\u0105
  l\u0117m\u0117 remonto (-21,5 proc.), vandens (-27 proc.) bei \u0161ildymo (-17
  proc.) s\u0105naud\u0173 ma\u017e\u0117jimas.\\n\\n| Metai | Objekt\u0173 skai\u010dius
  (vnt.) | Valdomas VNT plotas (mln. m\u00b2) | VNT likutin\u0117 vert\u0117 (mln.
  \u20ac) | S\u0105naudos (mln. \u20ac) |\\n|-------|------------------------|-------------------------------|-----------------------------|------------------|\\n|
  2019  | 27 878                 | 9,92                          | 2 929,34                    |
  151,85           |\\n| 2018  | 28 458                 | 10,27                         |
  2 729,35                    | 166,94           |\\n| 2017  | 28 292                 |
  10,38                         | 2 937,84                    | 154,58           |\\n\\n+7,3
  %  -9,0 %\\n\\n-2,0 %  -3,4 %\\n\\n+0,6 %  -1,1 %\\n\\n-7,1 %  +8,0 %\\n\\n+21,5
  %  -27 %  -17 %\\n\\nLietuvoje registruotas naudojamas VNT\\n\\nVNT, perduoto turto
  valdytojams patik\u0117jimo teise\\\\(^4\\\\), \u012fskaitant perduot\u0105 patik\u0117jimo
  sutarties pagrindu, ir naudojamuo turto valdytojo valstyb\u0117s pavestoms funkcijoms
  vykdyti, bei VNT, nenaudojamuo turto valdytojo pavestoms valstyb\u0117s funkcijoms
  vykdyti, proporcija nekinta 3 metus i\u0161 eil\u0117s: 78 proc. viso VNT ploto
  yra naudojama valdytoj\u0173 valstyb\u0117s pavestoms funkcijoms vykdyti, o likusi
  22 proc. dalis \u2013 teises akt\u0173 nustatyta tvarka yra arba panaudos pagrindais
  perduota laikinai neatlyginimai valdyti ir naudoti kitiemis subjektams, arba i\u0161nuomota,
  arba lieka laisva.\\n\\n2019 m. ma\u017e\u0117jo ne tik VNT plotas, naudojamas turto
  valdytojo pavestoms valstyb\u0117s funkcijoms vykdyti (-4,1 proc.), bet ir atiduotas
  panaudai (-1,5 proc.), i\u0161nuomotas (-0,4 proc.) ir laisvas VNT plotas (-28,6
  proc.). Naudojamo VNT ploto ma\u017e\u0117jimas koreliuoja su bendro valdomo VNT
  ploto ma\u017e\u0117jimu, ta\u010diau didesn\u012f naudojamo ploto ma\u017e\u0117jim\u0105
  gal\u0117jo lemti ir duomen\u0173 i\u0161 NTR atraujinim\u0173 VTIPS, d\u0117l kurio
  gauta tikslesn\u0117s informacijos apie naudojamus plotus. Patik\u0117tiniam valstyb\u0117s
  pavestoms funkcijoms vykdyti nereikalingo bendro VNT ploto (perduoto naudoti kitoms
  institucijoms, i\u0161nuomoto ir laisvo) ma\u017e\u0117jimas gali b\u016bti siejamas
  su CTV reformos s\u0117kmingo \u012fgyvendinimo rezultatais: did\u0117ja nereikalingo
  VNT pardavimai, geriau ir efektyviau naudojamas CTV perduotas VNT plotas.\\n\\n|
  Metai | Patik\u0117jimo teis\u0117 / sutartis (mln. m\u00b2) | Panauda VSS (mln.
  m\u00b2) | Panauda ne VSS\\\\(^5\\\\) (mln. m\u00b2) | Nuoma (mln. m\u00b2) | Laisvas
  (mln. m\u00b2) |\\n|-------|--------------------------------------|----------------------|-------------------------------|----------------|-----------------|\\n|
  2019  | 7,73                                 | 1,65                 | 0,082                         |
  0,30           | 0,10            |\\n| 2018  | 8,06                                 |
  1,68                 | 0,076                         | 0,30           | 0,15            |\\n|
  2017  | 8,28                                 | 1,60                 | 0,089                         |
  0,29           | 0,18            |\\n\\nVNT sud\u0117tis pagal paskirt\u012f i\u0161
  esm\u0117s nekito ir ketvirtaisiais metais. 2019 m. pabaigoje did\u017eiausi\u0105
  bendro VNT ploto dal\u012f sudar\u0117 mokslo (20 proc., 1,9 mln. kv. metr\u0173)
