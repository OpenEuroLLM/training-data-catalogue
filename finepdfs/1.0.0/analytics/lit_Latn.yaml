  Hardinge\\n\\nGELMI\u0172 \u0160VIESA\\n\\nI\u0161 angl\u0173 kalbos vert\u0117
  Viktorija Uz\u0117lait\u0117\\n\\nVilnius\\n2023\\n\\nAutor\u0117s parei\u0161kimas\\n\\nKuriant
  \u0161i\u0105 knyg\u0105 buvo pa\u017eeisti fizikos d\u0117sniai. Ties\u0105 sakant,
  a\u0161 kikendama juos klaikiai i\u0161kraipiau ir i\u0161 esm\u0117s perk\u016briau.\\n\\nSkiriu
  Ellai ir kitiems Nacionalin\u0117s kur\u010di\u0173j\u0173 draugijos Jaunimo patar\u0117j\u0173
  komiteto nariams\\n\\nGALINGIAUSI MIRIADO DIEVAI\\n\\nRijikas\\nPilkaapsiaustis\\n\u0160arvuotasis
  Princas\\nSlap\u016bn\u0117\\nStiklinis Kardinolas\\nDolora\\nKalmadotas\\nRaudonasis
  Li\u016bdnis\\nKeturveidis\\nRink\u0117jas\\n\\nSakoma, kad gal\u0117tum t\u016bkstan\u010dius
  kilometr\u0173 plaukti palei Miriad\u0105 sal\u0173 grandin\u0119 \u2013 nuo \u0161erk\u0161not\u0173
  \u0161iaurini\u0173 krant\u0173 iki ve\u0161lia \u017ealuma apaugusi\u0173 piet\u0173
  sal\u0173. Sakoma, kad salyno gyventojai pana\u0161\u016bs \u012f raudonus krabukus,
  b\u0117giojan\u010dius pakrant\u0117mis, jie u\u017esigr\u016bdin\u0119, kar\u0161tako\u0161iai
  ir vandenyje jau\u010diasi taip pat gerai kaip sausumoje.\\n\\nSakoma, kad vandenynas
  aplink Miriad\u0105 pakvai\u0161\u0117s. J\u016brininkai pasakoja apie did\u017eiulius
  verpetus, praryjan\u010dius laivus, apie netik\u0117tai \u012f pavir\u0161i\u0173
  pl\u016bstelin\u010dias dvokias ledines sroves, nuo kuri\u0173 plaukiantiesiems
  sustoja \u0161irdis. O juodi debesys giedrame danguje gali atsirasti i\u0161 niekur
  nieko.\\n\\nSakoma, kad po tikraja j\u016bra gl\u016bdi \u0161iurpi ko\u0161mar\u0173
  karalyst\u0117. Kai Poj\u016br\u0117 i\u0161rie\u010dia kuk\u0161ter\u0105, vir\u0161utin\u0117
  j\u016bra \u012fsisiaut\u0117ja.\\n\\nSakoma, kad Poj\u016br\u0117je gyvena dievai.\\n\\nApie
  Miriad\u0105 daug \u0161nekama, ir visa tai tiesa.\\n\\nDievai yra tokie pat tikri,
  kaip kranto linijos ir srov\u0117s, ir tokie pat negail\u0117stingi, kaip v\u0117jai
  ir verpetai. Stiklinis Kardinolas savo skaidriais \u010diuptuvais trai\u0161ko burlaivius.
  Raudonasis Vieni\u0161ius pl\u016bduriuoja vandenye lyg kraujo klanas. Kalmadotas
  staugia i\u0161\u017eioj\u0119s burn\u0105, piln\u0105 a\u0161triu it skustuvai
  dant\u0173. Dolora iriasi judindama kelias de\u0161imtis \u017emogaus koj\u0173.
  Slap\u016bn\u0117 tyko ramiose gelm\u0117se, u\u017esiklojusi plaukais, primenan\u010diais
  gyvates. Retsykiais kuris nors j\u0173 i\u0161nyra i\u0161 Poj\u016br\u0117s \u012f
  blausi\u0105 dienos \u0161vies\u0105, praryja koki\u0105 \u0161kun\u0105, suskaldo
  prieplauk\u0105 ir apsigyvena vis\u0173 ma\u010diusi\u0173j\u0173 ko\u0161maruose.
  Kai kurie tai daro dainuodami.\\n\\n\u0160imtus met\u0173 dievai, keldami siaub\u0105
  ir pagarb\u0105, vie\u0161patavo Miriade, ir kiekvienas tur\u0117jo savo teritorij\u0105.
  Siekiant numaldyti dievus, vandenims buvo aukojami \u017emon\u0117s, o ant laiv\u0173
  buvo pie\u0161iamos akys, maldaujan\u010dios pasigail\u0117ti. Taigi \u017emon\u0117s
  tarnavo dievams, j\u0173 bijojo ir juos garbino.\\n\\nBet vien\u0105 dien\u0105
  dievai susikov\u0117.\\n\\nVis\u0105 savait\u0119 jie drask\u0117 vieni kitus \u012f
  gabalus, j\u016bra bangavo ir mai\u0161\u0117si vanduo, \u017euvo \u0161imtai salyno
  gyventoj\u0173. Galiausiai neliko n\u0117 vieno dievo gyvo, tik gelm\u0117se skend\u0117jo
  mil\u017eini\u0161ki j\u0173 k\u016bnai. Net ir pra\u0117jus trisde\u0161im\u010diai
  met\u0173 po Negandos niekas ne\u017einojo, kas nutiko. Dievai tebebuvo m\u012bslingos
  b\u016btyb\u0117s, nors baim\u0117 pama\u017eu atl\u0117go.\\n\\nSakoma, kad monetos
  dyd\u017eio dievo k\u016bno gabal\u0117lis gali atne\u0161ti laim\u0119, nes Jame
  gl\u016bdi keista, nesuprantama galia. Bet tik narsus \u017emogus ry\u017etusi nerti
  ie\u0161koti toko lobio.\\n\\nTai irgi tiesa.\\n\\n\u2014 Ar tai tikrai saugu? \u2014
  kop\u0117\u010diomis sunkiai kabarodamas i\u0161 pas-\\nkubomis sukalt\u0105 medin\u0119
  bok\u0161teli paklaus\u0117 keliaujantis pirklys. \u2014\\nManiau, par\u016bpinsi
  viet\u0105 kokioje nors valtyje!\\n\\n\u2014 Visos valtys u\u017eimtos, \u2014 lipdamas
  jam \u012fkandin maloniai pa-\\nai\u0161kino Harkas. \u2014 Ten s\u0117di gubernatorius,
  jo draugai, turtuoliai,\\nskyr\u0119 pinig\u0173 ekspedicijai, j\u0173 \u0161eim\u0173
  nariai. N\u0117 vienos laisvos viete-\\nl\u0117s! \u2014 Tai gal\u0117jo b\u016bti
  ir tiesa. Harkas nepatikrino. \u2014 Be to, vietos\\nvaltyse beproti\u0161kai brangios.
  \u010cia bus de\u0161imt kart\u0173 pigiau, o vaiz-\\ndas dar geresnis!\\n\\nKol
  jie pasiek\u0117 vir\u0161\u0173, pirklys u\u017eduso; nusi\u0161luost\u0117 veid\u0105
  nosi-\\nne. Vyras, kuriam priklaus\u0117 \u0161is i\u0161kler\u0119s bok\u0161tas,
  palyd\u0117jo pirkli\\nsu Harku prie dviej\u0173 nepatog\u0173, ne itin patikim\u0173
  suoliuk\u0173 ir i\u0161\\npirklio pa\u0117m\u0117 u\u017emokest\u012f u\u017e abu.
  Pu\u010diant \u017evarbiam v\u0117jui statinys\\ngirg\u017ed\u0117jo, ir pirklys
  g\u016b\u017e\u0117si, spausdamas sau prie galvos kepur\u0119. Jis\\nnepasteb\u0117jo,
  kaip bok\u0161to \u0161eimininkas slap\u010dia pamerk\u0117 ak\u012f Harkui\\nir
  sumok\u0117jo komisinius.\\n\\nTrij\u0173 metr\u0173 auk\u0161\u010dio bok\u0161teliai
  b\u016bdavo atgabenami tik per \u0161ven-\\ntes ir turgaus dienomis. Jie i\u0161ties
  nebuvo labai tvirti, ir Harkas\\n\u017einojo, kad v\u0117liau, kai ant sien\u0173
  sulips pigiausius bilietus nusipir-\\nk\u0119 \u017ei\u016brovai, kil\u0119 r\u016bmtas
  pavojus. Ta\u010diau nusprend\u0117 to nemin\u0117ti.\\n\\n\u2014 Tikrai gerai matyti,
  \u2014 nenorom sutiko pirklys.\\n\\nAnt krantin\u0117s ir prieplaukose susigr\u016bd\u0117
  \u017emon\u0117s vaizdo neu\u017e-\\nstojo. Uostas jau nuo ankstyvo ryto buvo sausakim\u0161as
  ir net uol\u0173\\nvir\u0161\u016bn\u0117s bei bok\u0161tai apsispiesti \u017ei\u016brov\u0173.
  Visi nor\u0117jo matyti didel\u012f,\\nsam\u010dio formos uost\u0105 apa\u010dioje.\\n\\nNors
  kol kas neatrod\u0117, kad jis vertas toksio d\u0117mesio. Tai tebuvo viena i\u0161
  daugelio gili\u0173, tyki\u0173 ilank\u0173, idealiai tinkam\u0173 povandeniniams
  laivams, kuri\u0173 \u010dia buvo galyb\u0117. Greta siauru\u010di\u0173 \u201ebarakud\u0173\u201c
  juodais gele\u017einiais pelekaus k\u0117psajo plok\u0161ti gele\u017einiai \u201ev\u0117\u017eliai\u201c
  su sraigtais u\u017epakalyje. \u0160alia ma\u017e\u0173 senovini\u0173 \u201egraib\u0161tuk\u0173\u201c
  i\u0161 med\u017eio ir odos \u017evilg\u0117jo plieno ir stiklo nardymo varpai.\\n\\n\u0160iandien
  visi tie laivai pl\u016bduriavo pri\u0161vartuoti uosto pakra\u0161\u010diuose.
  Netrukus gr\u012f\u0161 did\u017eiulis povandeninis laivas, tad reik\u0117jo atlaisvinti
  keli\u0105. Kai tasai pasirodys, vis\u0173 akys \u012fsmigs \u012f j\u012f \u2013
  kiekvienam bus smalsu, k\u0105 jis pargabena.\\n\\n\u2014 Regis, visi salos gyventojai
  susirinko paspokso ti! \u2014 su\u0161uko pirklys.\\n\\n\u2014 Slap\u016bn\u0117
  buvo m\u016bs\u0173 deiv\u0117, \u2014 primin\u0117 Harkas. \u2014 Slap\u016bn\u0117s
  Svajos vard\u0105 gavo nuo jos. Galima sakyti, ji... gr\u012f\u017eta namo.\\n\\nI\u0161
  tikro Slap\u016bn\u0117, be \u0161ios salos, vald\u0117 dar kelias, bet Harkas su
  teik\u0117 sau menininko laisv\u0119. Kam tai r\u016bpi? Ji gyveno labai seniai,
  Harkas dar net nebuvo gim\u0119s. Dievai jau priklaus\u0117 istoriniams laikams,
  o istorij\u0105 gali pasakoti kaip tik nori.\\n\\nDiena buvo giedra, bet tolimas
  salas ties horizonto linija jau gaub\u0117 migla ir j\u0173 kont\u016brai buvo i\u0161bluk\u0119.
  Tai rei\u0161k\u0117, kad art\u0117ja lietus. Harkas u\u017euod\u0117 kepsnin\u0117se
  prie kranto kepamus krabus ir staiga ji ap\u0117m\u0117 neapsakoma meil\u0117 \u0161iai
  salai. Keturiolika savo gyvenimo met\u0173 praleido uol\u0117tose Slap\u016bn\u0117s
  Svajos pakrant\u0117se ir \u010dia i\u0161moko visko, ko jam reik\u0117jo. Juk anks\u010diau
  ar v\u0117liau \u017emon\u0117s ir daiktai atsidurdavo \u0161ioje saloje. Da\u017enai
  jie b\u016bdavo paged\u0119, prazuv\u0119, bet tai nesvarbu. Jam patiko, kad \u010dia
  atplaukdavo dideli\u0173 laiv\u0173, kad skamb\u0117davo \u012fvairios tarm\u0117s,
  kad slap\u010dia gal\u0117jai \u012fsigyti bema\u017e ko tik nori. Patiko ir suktyb\u0117s,
  ir alkis.\\n\\n\u201eGaila, Jeltas to nemato, \u2013 pagalvojo jis, ir i\u0161kart
  su\u0117m\u0117 nerimas. \u2013 Velniai raut\u0173, kurgi tas Jeltas?\u201c\\n\\nRyte
  Jeltas pakviet\u0117 Hark\u0105 susitikti prie kalv\u0117s aptarti vieno vyruko
  pasi\u016blyto \u201edarbelio\u201c. Harkas pralauk\u0117 jo dvi valandas, tada
  pasidav\u0117. Taip jau b\u016bna su tuo Jeltu. Kai reikalas rimtas, jis visada
  pad\u0117s, bet paprastai ateina ir i\u0161eina kada panor\u0117j\u0119s, kaip koks
  katinas, nieko neai\u0161kindamas ir neatsipra\u0161in\u0117damas.\\n\\nHarkas neabejojo,
  kad Jeltas u\u017esi\u0117m\u0117 \u012fdomesniais darbais ir ji u\u017emir\u0161o.
  Vis d\u0117lto \u0161ird\u012f grau\u017e\u0117 nerimo kirminukas, ir \u0161is sulig
  kiekviena valanda augo. Jeltas tur\u0117jo pries\u0173, o pra\u0117itis jo buvo
  tokia, kad gal\u0117jo pasivijusi igelti.\\n\\n\u2013 I\u0161 ko atpa\u017einti
  \u201eBedugn\u0117s vaik\u0105\u201c? \u2013 Pirklys prisimerk\u0119s pro \u017ei\u016bronus
  stebeilijosi \u012f uost\u0105.\\n\\n\u2013 O, ji atpa\u017einsit lengvai! \u2013
  Harkas, kaip ir dauguma Slap\u016bn\u0117s Svajos gyventoj\u0173, nepaprastai did\u017eiavosi
  \u201eBedugn\u0117s vaiku\u201c. \u2013 Jis ilgas kaip \u0161kuna, puikiai pritaikytas
  nardyti Poj\u016br\u00e9je. Trisde\u0161imt \u012frkli\u0173, juodas skaistplienis,
  de\u0161imt \u017enypli\u0173 ir trys u\u017epakaliniai sraigtai. Geriausias ir
  did\u017eiausias kada nors pastatytas paie\u0161k\u0173 laivas. Vos ji i\u0161vyd\u0119
  \u017emon\u0117s pratr\u016bks valiuoti.\\n\\nPaprastai \u012f povandenini\u0173
  laiv\u0173 uost\u0105 kit\u0173 laiv\u0173 nei\u0161leisdavo, i\u0161skyrus vien\u0105
  kit\u0105 keleivini\u0173 laineri\u0173, nar\u0173 valtis ir krovini\u0173 vilkikus.
  Bet \u0161iandien prieplaukoje buvo pri\u0161vartuotos trys i\u0161\u010diustytos
  bar\u017eos, kad keli i\u0161rinktieji gal\u0117t\u0173 steb\u0117ti, kaip gri\u017eta
  \u201eBedugn\u0117s vaikas\u201c.\\n\\n\u2013 \u0160tai ten gubernatoriaus jachta!
  \u2013 Harkas parod\u0117 paprast\u0105 \u017eali\u0105 ir balt\u0105 v\u0117liav\u0105
  ant vienburio laivelio stiebo. \u2013 Joje bus susirink\u0119 visi investuotojai
  \u2013 turtuoliai, apmok\u0117j\u0119 \u201eBedugn\u0117s vaiko\u201c ekspedicij\u0105.
  \u2013 Harkas \u012fsivaizdavo juos pripampusius brangi\u0173\\n\\nvyn\u0173 ir
  vilties, su lo\u0161\u0117j\u0173 \u012fkar\u0161\u010diu tyrin\u0117jan\u010dius
  vanden\u012f. \u2013 \u0160iandien jie susikraus turtus \u2013 arba \u017elugs,
  \u2013 prid\u016br\u0117 jis.\\n\\n\u2013 \u017dlugs? \u2013 perklaus\u0117 pirklys.
  \u2013 Da\u017enai taip nutinka?\\n\\n\u2013 Kartais. \u2013 Pajut\u0119s liguist\u0105
  smalsum\u0105, Harkas pasiskubino ji patenkinti. \u2013 Vien\u0105 puik\u0173 povandenin\u012f
  laiv\u0105 \u201eNieko nenor\u0117k\u201c gelm\u0117je u\u017epuol\u0117 giganti\u0161kas
  kalmaras, tad \u012f uost\u0105 parsivilk\u0117 nieko nep\u0117\u0161\u0117s. Kai
  i\u0161kilo \u012f pavir\u0161i\u0173 ir \u017emon\u0117s i\u0161vydo tu\u0161\u010dius
  tinklus, pus\u0117 investuotoj\u0173 i\u0161 nevilties met\u0117si \u012f vanden\u012f.
  Gubernatoriaus sargybiniai daugum\u0105 j\u0173 i\u0161trauk\u0117, bet keli po
  drabu\u017eiais vilk\u0117jo sunkius \u0161arvinius mar\u0161kinius ir metalinius
  \u0161arvus. \u2013 Harkas rankos mostu pavaizdavo, kaip anie grimzta \u012f dugn\u0105,
  ir pa\u0161aipiai pakraip\u0117 galv\u0105.\\n\\nPirklys pralinksm\u0117jo. Visuomet
  smagu \u012fsivaizduoti, kaip tie bjauryb\u0117s turtuoliai sielvartauja ir sk\u0119sta.
  \u017dinoma, Harko akimis, ir pirklys buvo tur\u010dius. Taigi paties s\u0105\u017ein\u0117
  nelabai grau\u017e\u0117, kad \u0161iek tiek paplonins jo pinigin\u0119. Harkas
  vyl\u0117si tai padaryti dar saulei nenusileidus.\\n\\n\u2013 Giganti\u0161kas kalmaras?
  \u2013 i\u0161 jaudulio pirklio balsas skamb\u0117jo slopiai. \u2013 Taigi \u0161iuose
  vandenyse tebesama t\u0173 j\u016br\u0173 pabais\u0173?\\n\\n\u2013 A, ten apa\u010dioje
  apst\u0173 pavoju! \u2013 d\u017eiaugsmingai patikino Harkas. \u2013 A\u0161triadant\u0117s
  \u017euvys baltomis akimis, kirm\u0117l\u0117s, nus\u0117tos geltonai \u0161vie\u010dian\u010diais
  ta\u0161kais! \u0160altosios srov\u0117s ir verpetai! Duob\u0117s, kurios \u012fsiurbia
  ir nutempia \u012f Poj\u016br\u0119! Juodos smailos uolos ir \u017eiojintys ply\u0161iai,
  kuriuose knib\u017eda raudondan\u010di\u0173! J\u016br\u0173 e\u017eiai, kuri\u0173
  dygliai tokio ilgumo, kaip j\u016bs\u0173 ranka! Potvyni\u0173 bangos, atne\u0161an\u010dios
  geltonas med\u016bzas, galin\u010dias vienu prisilietimu nugalabyti bangin\u012f!\\n\\nVisi
  \u0161ie dalykai buvo tikri ar bent jau i\u0161 dalies tikri, ir tarnavo Harko tikslams.
  Harkas geriau u\u017e kitus \u017einojo, kad istorija \u2013 tai valiuta. Kas \u010dia
  tokio, jei j\u0105 \u0161iek tiek pagra\u017eins? Gr\u012f\u017e\u0119s namo \u012f
  Vakar\u0173 \u017eemyn\u0105 pirklys met\u0173 metus m\u0117gausis \u0161iais pasakojimais.\\n\\nPirklys
  nusipurt\u0117. Veikiausiai pagalvojo, kad po vandeniu viskas taip nereg\u0117ta
  ir mi\u0161linga. Tie \u017eemyno gyventojai tikri keistuoliai. Jiems, ko gero,
  rodosi, kad sulig krantu \u017eem\u0117 baigiasi, o salos t\u0117ra sieliai, pl\u016bduriuojantys
  pilkoje, neramioje j\u016broje. \u010cionyk\u0161\u010diai, tokie kaip Harkas, po
  vandeniu praleido marias laiko ir \u017einojo, kad salos t\u0117ra kaln\u0173 vir\u0161\u016bn\u0117l\u0117s.
  Po vandens pavir\u0161iumi j\u0173 \u0161laitai toliau leid\u017eiasi \u017eemyn,
  kur ne kur st\u016bkso kalnag\u016bbriai, \u017eioji prarajos, plyti niekam ne\u017einomos
  lygumos ir styro sta\u010dios uolos. Kiekviena vieta turi savo gyventoj\u0173, jai
  b\u016bding\u0173 kra\u0161tovaizd\u017eio element\u0173, lobi\u0173 ir staigmen\u0173.\\n\\n\u2013
  \u0160tai jis! \u2013 su\u0161uko Harkas.\\n\\nUosto \u017eiotyse jis pamat\u0117
  lyg\u0173 vandens plotel\u012f, kur pailgas po vandeniu slypintis daiktas nepastebimai
  lau\u017e\u0117 bangas. Toje vietoje ant bang\u0173 sup\u0119si kirai \u0161ai\u017eiai
  krykaudami pakilo ir pe\u0161damiesi tarpusavyje nuskrido dideliais b\u016briais.\\n\\n\u2013
  \u0160tai! Matot t\u0105 balt\u0105 put\u0173 juost\u0105? Jie i\u0161k\u0117l\u0117
  periskop\u0105!\\n\\nKiti \u017emon\u0117s irgi rod\u0117 pir\u0161tais ir \u0161\u016bk\u010diojo.
  Po keli\u0173 sekund\u017ei\u0173 i\u0161\u0161ov\u0117 nedidel\u0119 patranka,
  garsas nuaid\u0117jo per vis\u0105 uost\u0105. I dang\u0173 pakilo ir nusklend\u0117
  baltas d\u016bm\u0173 debes\u0117lis.\\n\\nMinia kurtinamai sust\u016bgo. Kai povandeninis
  laivas namo pargabendavo diev\u0105, visiems b\u016bdavo \u0161vent\u0117. Vaikyst\u0117je
  Harkas nekantriai laukdavo toki\u0173 akimirk\u0173 ir i\u0161p\u016bt\u0117s akis
  steb\u0117davo, kas vyksta. Dabar ir v\u0117l pajuto t\u0105 vaiki\u0161k\u0105
  jaudul\u012f ir nerim\u0105.\\n\\nVandens pavir\u0161iuje pasirod\u0117 juodas pailgas
  povandeninis laivas. Nuo bok\u0161telio ir peili\u0173 gele\u017et\u0117s primenan\u010di\u0173
  pelek\u0173 nub\u0117go putotas vanduo, saul\u0117je sutvisko \u017ealvariniai iliuminatori\u0173
  r\u0117mai. Ant pirmagalio nupie\u0161tos \u0161viesios maldaujan\u010dios akys
  buvo \u0161lapios, tarsi sklidinos a\u0161ar\u0173.\\n\\n\u2014 Pamet\u0117 irklus,
  \u2014 sumurm\u0117jo Harkas; jo \u017eod\u017eius nustelb\u0117 minios riaumojimas.\\n\\nA\u0161tuoni\u0173
  irkl\u0173 buvo lik\u0119 tik l\u016b\u017egaliai. \u201eBedugn\u0117s vaikui\u201c
  pakilus auk\u0161\u010diau, jis pamat\u0117, kad laivas ir daugiau nukent\u0117j\u0119s:
  nelik\u0119 vieno sraigt\u0105, u\u017epakalyje viena korpuso dalis atsiknojusi,
  pro kreiv\u0105 ang\u0105 \u0161nyp\u0161damas ver\u017eiasi j\u016bros vanduo.
  Kai \u017emon\u0117s tai pasteb\u0117jo, klegesio tonas pasikeit\u0117. Priekinis
  skyrius veikiausiai sandarus \u2014 juk kas nors tur\u0117jo parvairuoti povandenin\u012f
  laiv\u0105, bet tie, kurie s\u0117d\u0117jo gale, tikr\u0173 tikriausiai negyvi.\\n\\nPirklys
  prispaud\u0117 prie aki\u0173 \u017ei\u016bronus ir palinko \u012f priek\u012f.
  Po nosimi v\u0117r\u0117si istorija, kuri\u0105 jis v\u0117liau pasakos draugams,
  taigi tragedija jam tiko ne blogiau u\u017e pergal\u0119. O gal net geriau. Istorijos
  \u2014 \u017eiaur\u016bs padarai, kartais tunkantys nuo kruvin\u0173 \u012fvyki\u0173.\\n\\n\u2014
  Kur krovinys? \u2014 paklaus\u0117 jis. \u2014 Kod\u0117l \u017emon\u0117s laksto
  po prieplauk\u0105? Kas ten vyksta?\\n\\n\u2014 Atsidar\u0117 bok\u0161telis! \u2014
  prane\u0161\u0117 Harkas. \u2014 Ka\u017ekas i\u0161 jo i\u0161lipo... Kalbasi...
  Tikriausiai gubernatorius siun\u010dia ten narus. Gali b\u016bti, kad po laivu kas
  nors priri\u0161ta!\\n\\nGubernatoriaus sargybiniai krante pasiruo\u0161\u0117 harp\u016bnus
  ir pneumatinius \u0161autuvus \u2014 jie pasir\u016bpins, kad prie laivo priplaukt\u0173
  tik leidim\u0105 turin\u010dios valtys. Jei koks savavalis plaukikas, naras ar povandeninis
  laivas pasukt\u0173 link \u201eBedugn\u0117s vaiko\u201c, \u012f j\u012f susmigt\u0173
  mirtini ginklai.\\n\\nNarai saul\u0117je blizgan\u010diais \u0161almais sulipo \u012f
  vanden\u012f ir pradingo. Po penki\u0173 minu\u010di\u0173 vandens pavir\u0161ius
  suraibuliavo. Prie did\u017eiojo povandeninio laivo kai kas kilo \u2013 kai kas
  ilgas, plonas, apraizgytas tinklu...\\n\\n\u2013 Koks didelis! \u2013 su\u0161uko
  pirklys. \u2013 Nieko pana\u0161aus nesu mat\u0119s!\\n\\nDaiktas tinkle \u2013
  ne, du daiktai \u2013 buvo tokiu pat ilgio kaip \u201eBedugn\u0117s vaikas\u201c,
  bet ne storesni u\u017e \u017emogaus liemen\u0119. Ma\u017edaug per vidur\u012f
  jie buvo \u012flenkti, ir akimirk\u0105 Harkas paman\u0117, kad daiktai l\u016b\u017eo
  gabenant. Bet putoms nus\u0117dus jis i\u017ei\u016br\u0117jo, kad tie ploni daiktai
  lankstosi. Po pl\u016bduriuojan\u010diu tinklu pamat\u0117 balt\u0105 ir raudon\u0105
  kiaut\u0105, apkibus\u012f juodomis j\u016br\u017eol\u0117mis ir aplipusi moliuskais.
  Pro tinklo aki buvo i\u0161lind\u0119s pilkas smailus nagas.\\n\\nJam \u017ei\u016brint,
  tos ne\u012ftik\u0117tinio ilgumo kojos sujud\u0117jo, susilenk\u0119 ir v\u0117l
  i\u0161sities\u0117.\\n\\nI\u0161 baim\u0117s ir susi\u017eav\u0117jimo suspurdo
  \u0161irdis. Vien\u0105 akimirk\u0105 jis v\u0117l tapo ma\u017eu vaiku. Bema\u017e
  i\u0161ivaizdavo, kaip Slap\u016bn\u0117 i\u0161nyra i\u0161 vandens, nusipurto
  tinkl\u0105 ir taip uzklykia, kad uolos virsta dulk\u0117mis, o besirangantys jos
  plaukai u\u017etemdo dang\u0173...\\n\\nBet netrukus jis atgavo sveik\u0105 prot\u0105.
  Suvok\u0117, kad tas kraupias kojas judina ne kas kita, o bangos, sukeltos besidarbuojan\u010di\u0173
  nar\u0173.\\n\\n\u2013 Ar tai ji? \u2013 tampydamas Hark\u0105 u\u017e rankov\u0117s
  paklaus\u0117 pirklys. \u2013 Ar tai Slap\u016bn\u0117?\\n\\n\u2013 Ne, \u2013 atsak\u0117
  Harkas. \u2013 Tai yra... taip. Jos dalys. Dvi kojos.\\n\\n\u0160kunos ilgio kojos,
  labai pana\u0161ios \u012f vorinio krabo. Nuostabus radinys, ir vis d\u0117lto i\u0161
  nusivylimo suspaud\u0117 kr\u016btin\u0119. Tai ko gi jis tik\u0117josi?\\n\\n\u2013
  Maniau, ji i\u0161 tu, turin\u010di\u0105 \u017emogi\u0161k\u0105 i\u0161vaizd\u0105?
  \u2013 sumurm\u0117jo pirklys.\\n\\nPAD\u0116KA\\n\\nNor\u0117\u010diau pad\u0117koti
  Ellai, jaunai skaitytojai, para\u0161iusiai man ir paklaususiai, ar gal\u0117\u010diau
  \u012f kuri\u0105 nors savo knyg\u0105 \u012ftraukti kur\u010di\u0105 veik\u0117j\u0105.
  Ji mano galvoje suk\u0117l\u0117 nedidel\u012f perversm\u0105, ir a\u0161 suk\u016briau
  j\u016bros pabu\u010diuotuosius, o Ella tapo mano specialist\u0117 konsultante.
  A\u010di\u016b ir kitiems Nacionalin\u0117s kur\u010di\u0173j\u0173 vaik\u0173 draugijos
  Jaunimo konsultacij\u0173 komiteto nariams (Amber, Adamui, Cam, Estherai, Francescai,
  Idai, Jaydenui, Jovitai, Lily, Lucy, Molly, Mollie, Luy, Reubenui, Rhodriui, Samui,
  Sarah\u2019ai ir Zainui) u\u017e ne\u012ftik\u0117tin\u0105 j\u0173 ind\u0117li.
  D\u0117koju savo redaktoriams (Jane Newman, Judithai Tarr ir Kayleigh Goacher, taip
  pat Ellai, Jovitai, Francescai ir Idai i\u0161 YAB); Rosie Eggleston; vyriausiajai
  redaktorei Rachelei Petty u\u017e tai, kad neap\u0161auk\u0117 man\u0119s, kai \u012fteikiau
  pirm\u0105 juodra\u0161t\u012f, vos vos didesn\u012f u\u017e m\u0117nul\u012f, ir
  u\u017e tai, kad pad\u0117jo ji apkapoti iki knygos matmen\u0173; agentei Nancy
  Miles; Martinui u\u017e tai, kad kelis m\u0117nesius tv\u0117r\u0117 kuoktel\u0117jusi\u0105,
  sulauk\u0117jusi\u0105, pusiau naktini\u0173 gyvenim\u0105 gyvenan\u010di\u0105
  draug\u0119, i\u0161tikt\u0105 art\u0117jan\u010dio termino kriz\u0117s; Rhiannonai
  Lassiter u\u017e antgamti\u0161kai \u012f\u017evalgius atsiliepimus; Robertui F.
  Burgessui u\u017e \u201eShips Beneath the Sea: A History of Subs and Submersibles\u201c
  (\u201eLaivai po j\u016bra: povandenini\u0173 laiv\u0173 ir povandeni\u0173 aparat\u0173
  istorija\u201c); Williamui Beebe u\u017e \u201eHalf Mile Down\u201c (\u201ePus\u0117
  mylios \u017eemyn\u201c); George\u2019ui Taylorui ir Julietei Bishop (redaktoriams)
  u\u017e \u201eThe Deep: The Extraordinary Creatures of the Abyss\u201c, \u201eThe
  Incredible Record-Setting Deep-Sea Dive of the Batysphere\u201c, \u201eBeing Deaf:
  The Experience of Deafness\u201c (\u201eGelme: Nepaprasti bedugni\u0173 gyventojai\u201c,
  \u201eNe\u012ftik\u0117tinas rekordinis\\n\\nbatisferos pan\u0117rimas \u012f gelm\u0119\u201c,
  \u201eB\u016bti kur\u010diam: Kurtumo patyrimas\u201c); Carol Padden ir Tomui Humphriesui
  u\u017e \u201eInside Deaf Culture\u201c (\u201eKur\u010di\u0173j\u0173 kult\u016bra
  i\u0161 vidaus\u201c); Ry K. Holcomb, Samueliui K. Holcombui ir Thomasui K. Holcombui
  u\u017e \u201eDeaf Culture Our Way: Anecdotes from Deaf Community\u201c (\u201eKur\u010di\u0173j\u0173
  kult\u016bra m\u016bsi\u0161kai: Kur\u010di\u0173j\u0173 bendruomen\u0117s anekdota\u201c);
  ir galiausiai visiems nardymo instruktoriams ir narams, parod\u017eiusiem man keist\u0105
  gelmi\u0173 didyb\u0119.\\n\\nFRANCES HARDINGE\\n\\nVaikyst\u0119 praleido dideliame
  sename name, nuo ma\u017eens \u012fkv\u0117pusiame j\u0105 kurti keistas istorijas.
  Oksfordo universitete baigusi angl\u0173 kalb\u0105 ji para\u0161\u0117 kritik\u0173
  d\u017eiaugsmingai sutikt\u0105 \u201eNakties skryd\u012f\u201c ir laim\u0117jo
  presti\u017ein\u0119 Branfordo Boase''o premij\u0105 u\u017e pirm\u0105 roman\u0105.
  V\u0117liau ji para\u0161\u0117 daug puikiai \u012fvertint\u0173 roman\u0173, tarp
  j\u0173 buvo \u201eVien oda ir \u0161e\u0161\u0117liai\u201c, \u201eVeidas kaip
  stiklas\u201c, \u201eGegut\u0117s daina\u201c ir Costa premij\u0105 laim\u0117j\u0119s
  \u201eMel\u0173 medis\u201c. Autor\u0117 garsi savo turtinga kalba.\\n\\nJaudinant
  istorija apie klasting\u0105 ir pavojing\u0105 kaip vandenynas draugyst\u0119, apie
  \u0161iurpi\u0105 kaip dievai kelion\u0119...\\n\\n\u201eKiekvienas tur\u0117t\u0173
  perskaityti Frances Hardinge. Kiekvienas. Tu\u010dtuojau.\u201c\\n\\nPatrickas Nessas\\n\\n\u201eViena
  geriausi\u0173 m\u016bs\u0173 istorij\u0173 pasakotoj\u0173.\u201c\\n\\nSarah Perry,
  \u201eThe Essex Serpent\u201c autor\u0117\\n\\n\u201eHardinge kuria nauj\u0105 pasaul\u012f
  ir jame \u012fkurdina stebuklus. Tikra magija.\u201c\\n\\nM. R. Carey, \u201eThe
  Girl With All the Gifts\u201c autor\u0117\\n\\n\u201eNaujas Hardinge romanas \u2013
  visada didelis \u012fvykis.\u201c\\n\\nSunday Times\\n\\n\u201eRetas autorius geba
  sukurti toki\u0105 ne\u012ftik\u0117tinai gra\u017ei\u0105 \u0161iuolaiki\u0161k\u0105
  pasak\u0105.\u201c\\n\\nGuardian\\n\\nHarkas ir Jeltas \u2013 na\u0161lai\u010diai,
  besisukantys kaip i\u0161mano, kad i\u0161gyvent\u0173. Jie visada buvo kaip broliai.
  Kai vienas papuola \u012f b\u0117d\u0105, kitas tuoj pat skuba \u012f pagalb\u0105.
  Ta\u010diau ne vien\u0105 tamsi\u0105 paslapt\u012f saugantis Jeltas i\u0161 Harko
  nuolat reikalauja daugiau, nei \u012fmanoma. \u0160yk\u012f j\u016bros gelm\u0117se
  rastas lobis pakei\u010dia vaikin\u0173 gyvenimus. Jiems ima ai\u0161k\u0117ti \u0161iurpios
  paslaptys apie kadaise gimtaj\u012f salyn\u0105 vald\u017eiusius j\u016br\u0173
  dievus, o tai, kas atrod\u0117 ne\u012fmanoma, pama\u017eu ima vir\u0161ti realybe.
  Tai \u012fsp\u016bdingas, kvap\u0105 gniau\u017eiantis romanas apie sud\u0117ting\u0105
  dviej\u0173 jaunuoli\u0173 draugyst\u0119, ypating\u0105 pagarb\u0105 u\u017esitarnavusiems
  j\u016bros pab\u016b\u010diuotuosius, d\u0117l nuolatinio nardymo praradusius klaus\u0173,
  monstri\u0161kas dievybes, tamsias paslaptis vandenyno gelm\u0117se bei kartais
  g\u0105sdinan\u010di\u0105 \u017emoni\u0173 bei diev\u0173 prigimt\u012f. K\u016brinyje
  dera laukin\u0117 autor\u0117s fantazija, unikali mitologija, siaubo elementai bei
  ry\u0161k\u016bs veik\u0117j\u0173 portretai.\\n\\nBrit\u0173 ra\u0161ytoja Frances
  Hardinge (g. 1973 m.) lietuvi\u0173 skaitytojams jau pa\u017eistama i\u0161 knyg\u0173
  \u201eMel\u0173 medis\u201c, \u201eVeidas kaip stiklas\u201c bei \u201eGegut\u0117s
  daina\u201c. Autor\u0117 ra\u0161o knygas, \u017eavin\u010dias \u012fvairaus am\u017eiaus
  skaitytojus \u2013 tiek suaugusiuosius, tiek paauglius, tiek stor\u0173 roman\u0173
  nesibaidan\u010dius vaikus. Ji meistri\u0161kai valdo \u017eod\u017eius ir lyg burtinink\u0117
  jais i\u0161keri \u012fstabius paslaptingus pasaulius, o kasdienius gyvenimus pripildo
  \u0161iurpi\u0173 paslap\u010di\u0173 ir nenumatyt\u0173 pavoj\u0173. Knyga \u201eGelmi\u0173
  \u0161viesa\u201c 2020 m. nominuota \u201eLodestar\u201c apdovanojimui.\\n\\nGolf
  Ball Pattern\\n\\nThis pattern features a golf ball held by a hand, surrounded by
  swirling waves and seaweed. The design is repeated in a grid-like pattern, creating
  a visually striking and cohesive look.\\n\\nVisos \u017emoni\u0173 baim\u0117s suteka
  \u012f Poj\u016br\u012f, kaip kad upeliai ir up\u0117s \u012f j\u016br\u0105. \u017dmogaus
  baim\u0117 turi siaubing\u0105 gali\u0105. Ji visk\u0105 kei\u010dia, visk\u0105
  i\u0161kreipia, visus varo i\u0161 proto. Baim\u0117 \u2013 tai juodos i\u0161\u010dios,
  kur gimsta ir klesti pabaisos.\\n\\nPovandeniniai Miriado dievai tokie pat tikri,
  kaip krant\u0173 linijos ir srov\u0117s, ir tokie pat negailestingi, kaip v\u0117jas
  ir verpetai. Bet vien\u0105 dien\u0105 dievai susikovo, jie drask\u0117 vieni kitus
  \u012f gabalus, \u017euvo \u0161imtai salyno gyventoj\u0173, o Miriadas pasikeit\u0117
  am\u017eiams.\\n\\nNuo tu \u012fvyki\u0173 pra\u0117jo daug met\u0173. Gyvenimas
  Miriado salyne t\u0119siasi lyg niekur nieko, nors dar ne visi pamir\u0161o, k\u0105
  rei\u0161kia bijoti j\u016bros ir saugotis diev\u0173 pyk\u010dio. Kreivose Slap\u016bn\u0117s
  Svajos gatvel\u0117se gyvena Harkas ir geriausias jo draugas Jeltas. Kad i\u0161gyvent\u0173,
  berniukai pasitelk\u0119 vis\u0105 i\u0161mon\u0119 ie\u0161ko g\u0117rybi\u0173,
  kurias b\u016bt\u0173 galima parduoti: \u0161ukuoja papl\u016bdimius, nardo j\u016broje,
  rankiodami diev\u0173 relikvijas. Ta\u010diau po vandeniu kai kas nerimsta ir kvie\u010dia
  narsuolius leistis \u012f paie\u0161kas. Tas kai kas labai vertingas. Ir labai pavojingas.\\n\\nTai,
  kas pavojinga ir kelia siaub\u0105, taip pat ir nenumaldomai traukia. Ta\u010diau
  kartais baim\u0117 yra \u0161is tas daugiau nei tik vaizduotos padarinys. Kai kurios
  legendos pernelyg didingos, o paslaptys \u2013 pernelyg \u0161iurpios, kad nugrimzt\u0173
  \u012f u\u017emar\u0161t\u012f.\"", "\"LIETUVOS ARCHITEKT\u0172 S\u0104JUNGOS VILNIAUS
  SKYRIAUS ATASKAITINIO RINKIMINIO SUSIRINKIMO DARBOTVARK\u0116\\n\\n2022 m. spalio
  6 d.\\n\\nLIETUVOS ARCHITEKT\u0172 S\u0104JUNGA, KALVARIJ\u0172 G. 1, VILNIUS\"",
  "\"Kam i\u0161monei tiesa?\\nApie Mikalojaus Povilo Vilu\u010dio parod\u0105 \\\"Titanike\\\"\\n\\nErika
  Grigoravi\u010dien\u0117\\n\\nNuo spalio 30 d., \u201eTitaniko\u201c antro auk\u0161to
  sal\u0117je vyksta Mikalojaus Povilo Vilu\u010dio k\u016briniai paroda, susegintas
  kaitinimo ir i\u0161monei tiesos m\u0117\u010dio praga. Parodos kur\u0117tor\u0117s
  \u2013 Grafikos centro galerijos darbuotojos, dailetyrinink\u0117s Kristina Kleponyt\u0117-Seme\u0161kien\u0117
  ir Jurga Mincinauskien\u0117 \u2013 sa\u017einingai, profesionaliai padidino Vilu\u010dio
  k\u016brybos atspalvius, atskleid\u0117 sandaros vieno \u017eymiaus\u0173 Lietuvos
  grafik\u0173 k\u016brybos ap\u017evalg\u0105. Jos rausv\u0117si daillinko dirbtuv\u0117je,
  ie\u0161kojo jo k\u016brini\u0173 VU bibliotekos Grafikos kabinet\u0117je, prievartavo
  rimt\u0173j\u0173, \u012fvairi\u0173 \u0161altini\u0173, visk\u0105 surinko taip,
  kad daillinko k\u016brybos raidos tarpusiai, pagrindin\u0117s k\u016brini\u0173
  grup\u0117s gerai matyt\u0173 vos \u012fj\u016bs ir sakes (atrodyt\u0173, kas \u010dia
  nuostabaus \u2013 daill\u0117s paroda, kaip medija, juk kaip tik ir tur\u0117t\u0173
  pateikti sustrukt\u016brinta kokios nors k\u016brinii\u0173 vi\u0161umos vaizd\u0105,
  bet to, deja, negali ma pasakyti, pvz., apie Arsenele rengiamas ekspekcijas).\\n\\n\u0160iuolaikiniam
  k\u016briniui institutui ir k\u016brini\u0173 laikui, kaip Vilu\u010dio giliosi
  technin\u0117s ir simbolin\u0117s giliaupaud\u0117s galimybes. Jo studij\u0173 laikais,
  XX a. 7-ajame de\u0161imtmetyje, Lietuvos grafikijoje klest\u0117jo \u0161ik\u0161ki\u0173
  spauda \u2013 grafikos primityviai stilizuot\u0173, i\u0161 tau sodin\u0117jimo
  i\u0161siskyrusi\u0173, i\u0161tais\u0173 ir linoleumo ra\u0161tini\u0173, daugiausia
  lietuvi\u0173 literat\u016bros veikal\u0173 kaimo tema ilustracijos ir estamp\u0173
  tautosakos motyvais. Vilu\u010dio kartu grafikai i\u0161siai\u0161kijo \u201egyvenimo
  tradicijas\u201c, nus kaimi\u0173 ir miest\u0173 folkloro paveld\u0105, i\u0161siai\u0161kino
  profesionali\u0173 dail\u0117s, poezijos, ra\u0161ytoj\u0173 istorijos ir amato
  \u012fg\u016bd\u017ei\u0173 reik\u0161m\u0119 metalo graviravimui. Parodoje eksponeuojami
  daugumai \u017einuoj\u0119 nematyt\u0173 daillinko ankstyvieji sausos adatos ra\u0161tini\u0173
  ir ofort\u0173. Estampuose ir ilustracijose pra\u0117itis ir dabartis, skaitiniai
  ir fantastija, i\u0161mon\u0117 ir grafikos tyrimai susipina pagal sapno logik\u0105.
  Tvirt\u0173 raum\u0117n\u0173, ne muo galin\u012f m\u016bs\u0173 \u201eLietuva\u201c
  spindul\u012f, 1968 m., fosiavimo v\u0117d\u0117kama, kardais angujanti begalv\u0117
  b\u016btyb\u0117 (ofort\u0173 pagal Simono Daukanto veikala serija \u201e\u017dalgiris\u201c
  m\u016bs\u0173 1970), vonion spraustas karstumo gali\u016bnas (\u201eA\u0161tuoniol\u0117\u201c,
  1971) ir kai kurios eln\u0117s\u010di\u0173 her\u0117j\u0173 atstovaujan\u010dios
  androidai (Vytauto Ona\u010dio \u201eNerimo pasaskos\u201c, 1971, Vytauto Skripko
  \u201eJ\u016bros kl\u0117t\u0117\u201c, 1972) turi arbe i\u0161rai\u0161k\u0173
  stili\u0173 poz\u012fjim\u0173 ir tarsi priklauso i\u0161 karto folkloro paveldui
  ir ra\u0161menyse daug kar\u0161tamogi\u0173 k\u016brybos greit\u0117j\u0173 br\u016bk\u0161neli\u0173,
  jau br\u017eiamas ir su li\u016bniote. Vilu\u010dio darbusose \u0161is svarbus anks\u010diausiai
  tautodal\u0117 gr\u012fst\u0173 ra\u0161tini\u0173\\n\\nNukel\u0117 | 6 pusl.\\n\\nMikalojas
  Povilas Vilutis, \u201eM\u0117lynas riteris\u201c, silikografija. 1990 m.\\n\\n\u201eForce
  majeure\u201c\\n\\nI\u0161 \u201eScanoramos\u201c dienora\u0161\u010dio\\n\\nKitoks,
  bet geras\\n\\nPasibaigus festivaliui \u201eVilnius Mama Jazz\u201d\\n\\nAlgirdas
  Klov\u00e0\\n\\nTrylik\u0161\u010dias treptinantis d\u017eiazo festivalis \u201eVilnius
  Mama Jazz\u201d buvo kiekvieno nesvidu. Po duj\u0173j\u0173 pirm\u0173j\u0173 tradicini\u0173
  suorganizavim\u0173 \u012f kar\u0173 Lietuvos ra\u0161\u0173 dramos teatre, savaitgal\u012f
  pateko \u012f toki, kaip \u017ei\u016brovai vadino \u201ed\u017eiazo \u017eomark\u0105\u201d,
  kuris man i\u0161 tikruj\u0173 labai patiko, nes buvo sve\u010diai muzikantai, ir
  j\u0117gas i Lietuvos pasaulin\u012f dramaturgij\u0105, jau foje pasilikto fotografija
  paroda, kuria daugelis d\u017eiazo megi\u0173 ankstesn\u012f gal\u0117jo matyti
  Birstone, bet \u010dia j\u0173 buvo atsiskleid\u0119 eksponuojantys. Parodoje daugiausiai
  di\u017eiazo fotografi\u0173 \u2013 Daini\u0173 Labrino, Vytauto Sutuvi\u010diaus,
  Albertas \u0160vy\u010dionis ir Nerijus Petranuskas. Gaile tik, kad prire nustrokuo
  nebuvo \u012fvardinta, kas \u010dia u\u017efiksuotas, ta\u010diau, pamat\u0117s
  1988 m. Birstone, kuris buvo \u012ftrauktas \u012f supratim\u0105, laikas bega.\\n\\nPasid\u017eiaug\u0119
  paroda patek\u0117m \u012f d\u017eiazo k\u016brimo ir akirimo \u201erank\u0105\u201d
  pasauli. Instrumentus demonstravo \u201eTiamet\u201d, o kompaktini\u0173 ir viulini\u0173
  plok\u0161\u010di\u0173, kurios pagal patsar\u0117ja ECM ir Thaddeus\u2019 Records,
  atsi\u017evelgiant \u012f \u201eR\u016bdminka knygynas\u201d, kurio valdose, be
  kita ko, sud\u0117t\u0117s nuolaidi gal\u0117jai ma\u0161tripti puk\u0173 kai\u010di\u0173
  \u012fra\u0161\u0173, i\u0161laist\u0173 \u201eNoBusines Records\u201d. Pavarogus
  nus pirkim\u0173, galioti priesti... Verslo \u017einiai skai\u010diuojami.\\n\\nTai
  dar ne viskas, ka s\u016bl\u0117 d\u017eiazo foj\u0117s. Atsigavusius gerimais ir
  u\u017ekain\u0117s, \u010dia gailejai sukriti deivynas gabli\u0173ve\u010di\u0173
  \u0161e\u0161tadien\u012f pa\u017einti ir atskleisti ant palapin\u0117s, kuri\u0105
  reng\u0117 Lietuvos lauk\u0173 koncertu, kurie, beje, vyko ir \u010dia pat, foj\u0117.
  \u0160ioje netik\u0117tai labai jaukojo aplinkoje koncertavo kai kurie Lietuvos
  kolektyvai, bet man labiausiai simtus patyri, jam susitikti su \u201eJazzovilniu\u201d,
  kuris buvo pastrodymu prad\u0117j\u0119s Vilniaus Balo Dvariono esm\u0117tame muzikos
  mokyklos d\u017eiazo di\u017eio ansambli \u201eMade in 254\u201d. Tai d\u017eiazo
  klasei, kurioje jau ne vie\u0161us metus vyks lietuvi\u0173 kompozitori\u0173 koncertai
  ir u\u017esienio muzik\u0173 jaunimo d\u017eiazo koncertai, ta numeris. Laimejusi
  Grand Prix jaujan\u012f d\u017eiazo atlik\u0173j\u0173 konkurse \u201eVilnius Jazz
  Young Power 2014\u201d ir Lietuvos gretutin\u0173 teisi\u0173 asociacijos AGATA
  apdovanojimais, jau buvo \u012ftraukta \u012f Lietuvos komand\u0105, laisrai gerti
  pagr\u012fsto ir \u201eMama Jazz\u201d renginyje. Labiausiai simtine pirmonis dvis
  kompozicijos, kuri\u0173 autoriai, artdo, \u2013 pats grup\u0117s narai. \u010cia
  puikiai suskamb\u0117jo visi d\u017eiazo muzikantai, kuri\u0173, kaip labai likijas
  \u012fsiai\u0161kinti ir joms savo muzikini\u0173 \u0161i\u0173 bendi kompozicij\u0173,
  tarpiai suteikdami malonum\u0105 klausyti ir steb\u0117ti, kaip pras j\u0173 kuras
  jukramas giedel\u0117s ir garus. Es\u0105 d\u0117kina \u201eVilnius Mama Jazz\u201d
  koncert\u0173 sal\u0117 galin\u0117je, kuri\u0105 buvo norinti, tai d\u017eiazo
  mezi\u0173 komanda, kuriuo kiekvienam turu savo u\u017ekain\u0117jai, niekaip neapsaiba
  kalb\u0105.\\n\\nIr tikrai, \u010dia buvo mes tur\u0117t\u0173 pasieci galiausi\u0105sios
  Lietuvos d\u017eiazo klubo, buvo d\u017eiazo gar\u0161enybi\u0173 \u2013 saksofoninink\u0173
  Vytauto Labu\u010dio, Liudo Mocki\u016bno, Jono Maksimovi\u010diaus, Dovydo Stalmo,
  trimitinink\u0173 Dominyko V\u0117\u0161i\u016bnasko, Mindaugo Vai\u0161kolo, tromboninink\u0173
  Jurgio Gud\u017ei\u016bno, Jevaro Jasinskio, gitaras virtuozo Juozu Miliausko, klavi\u0161inink\u0173
  Tumo Kav\u010di\u016bno ir Dmitrijos Gokovano, kontrabasininko Eugenijaus Kan\u0117vait\u0117s
  bei Vincio Nivicko, pianist\u0173 Ar\u016bno \u017dukausko, Ar\u016bno Arka\u017ei\u016bno
  Gatauseno, Pavolo Gintaro ir paties Vladimiro Tarasovo \u2013 projekt\u0117 dalyvavo
  ind\u0173 klasi\u0161kos muzikos \u017einovai Rytis Kam\u010di\u016btis (tabla),
  Anatolijus Lomenovas (sitaras) ir J\u016brat\u0117 Aulely (tamp\u016bra). Smagu,
  kad taip naudota nuo pat pirmos projekt\u0173 kompozicijos, nes \u012fsine \u012fsakotus
  world music spalvos, kuria reik\u0117jama prap\u0117ti (gauta, kad tik vien\u0117je
  di\u017eioje) sitaros ir tamp\u016bra. Apie k\u016brimo id\u0117j\u0105 kaip ir
  muzikantams labiausiai patinka Bilfo Lo Frisello ir Mi\u0161eo Daviso muzika. Beje,
  pirmijai grup\u0117s \u201eKneebone\u201d vadovauja lygio Lee \u201eBass\u201d Hancoke
  klube. The Tenorist Bar\u2019i tai j\u0173 k\u016brybai visi\u0161kai laikams u\u017ed\u0117jo
  tokio muzikos antspaud\u0105. Ta\u010diau, man jis nepasirodo itin ry\u0161kus.\\n\\nKitas
  JAV kolektyvas, padar\u0119s man tikrai ger\u0105 \u012fsp\u016bd\u012f \u2013 tai
  \u017einomas trimetis \u201eTerrorist Collective\u201d ir \u201eE-Collective\u201d.
  Tiesa, elektronikos \u010dia buvo daug ir man pasirod\u0117, jog legendiniu trimitininku
  vadinamas T Blanchard\u2019as grojo muzik\u0105 ir per daug susizav\u0119s elektroniniais
  instrumentais, ta\u010diau jau\u010diau, kad jis buvo i\u0161sik\u0117l\u0119s \u012fgros,
  protin\u0117s ir \u012fprat\u0173 dingos. Beje, \u0161ios kompozicijos i\u0161duoda
  Terence\u2019o pomeig\u012f ra\u0161yti muzik\u0105 filmams, jos skamba labai ilustratyviai,
  dramati\u0161kai ir \u201ekine-mografiskai\u201d. Kitokia maniai, buvo b\u016btina,
  jog d\u017eiazo aktoriaus vidurin\u0117s keli\u0173 lietuvi\u0161kos satarin\u0117s
  temin\u0117 med\u017eiaga bei rimtin\u0117 faktiliai, pukiai sulapsi su d\u017eiazo
  spalva. Kitat labiausiai jismunau dalis buvo ta, kurioje \u012fvyko \u012fvair\u016bs
  ind\u0173 muzikos veiksmai ir elektronika. Taip pat, \u201eJonomas \u201eGlobeleonas
  XXX\u201d \u2013 labiausiai i\u0161pl\u0117tota, pukiai sukromstota ir sure\u017eustas,
  stilistika ir tematika sukurtais k\u016brybus. Ir atlik\u0117j\u0173 labiausiai
  jismunau \u201eZodus Mifalas\u201d ir \u201eTerrorist Collective\u201d projekto
  epizodai, kaip ir apskritai jie tekd\u0117s did\u017eiuli\u0173 kri\u016bv\u0173.
  Visos kompozicijos dalyse labiausiai stebimo ir d\u017eiazo tu, kad, maestro V.
  Tarasovo pavysta ne tik i\u0161 gyvenk\u0173j\u0173, bet ir i\u0161 gyvenan\u010di\u0173j\u0173,
  kuri\u0173 muzikos, kaip labai, buvo labai \u012ftikin\u0117jusiai muzikavimo savybes,
  bet ir suklest\u0117jusi visi ir visi d\u017eiazo vietai. Tam jai gali pavykti turbut
  tik ne paprastai gerai muzikantai, pedagogai, kompozitoriai, i\u0161siskyrusiai,
  kuri\u0173 k\u016bryba po kiekvieno rank\u0173 padid\u0117jusi. Taip pat, kai j\u0173
  \u017ei\u016brovams, festivalio reng\u0117jams, remeg\u0117jams, bet ir savanori\u0173,
  kurie, deja, nedaugelis pasteb\u0117, o be j\u0173, visi \u017ei\u016br\u0117jo,
  bu\u010di\u0173 sunika.\\n\\n\u0160iuolaikin\u0117je, turtoje, kit\u0173 m\u016bs\u0173
  kult\u016broje, buvo daug muzikant\u0173 i\u0161 JAV ir kitur, kaip visumot, laukiai
  me labai daug. Prad\u0117snu nuo t\u0173, kurie asmeniskai man patiko labiausiai.
  Tai jauniausi\u0173j\u0173 nusiteikusi kompozitoriai \u201eKneebone\u201d, puikiai
  dekliav\u0119s d\u017eiazo klubo, kuris, kaip ir elektronika, i\u0161laiza su funk
  ir roka. \u0160is virtuositoks muzikai labai profesionaliai grojantis kolektyvas
  savo muzikavimo stiliumi kaipkai priklauso legendine grupe \u201eWeather Report\u201d.
  I\u0161siskyrusiai, kuri\u0173 muzikos i\u0161laiza tikrai net nemazai rodo b\u016bding\u0173
  bruo\u017e\u0173. Galb\u016bt ne v\u0117l j\u0173 pavadinimi \u201ed\u017eiazo scenos
  \u201eHead\u201d arba bygmani su \u201eQueens Of The Stone Age\u201d \u2013 atspindint
  muzikos tikrum\u0105 ir energij\u0105, o patiemis \u017einoma, nuostabusis Liudo
  Mocki\u016bno giganitikso (bosinio) saksofono garas.\\n\\n\u0160tai, kai stipriai
  i\u0161 kit\u0173 \u0161alis k\u016bryb\u0117s prie\u017ei\u016bra, \u201eHubert
  D\u2019Aumont Jazzman\u201d, kur\u012f muzikai bg ir tur\u0117t\u0173 atspind\u0117ti
  konceptualiai id\u0117jas, susijusias su arba arba \u0161alis ne\u0161vainiausiomis
  vadinan\u010diom \u201eJazmin\u0173 revoliucij\u0105\u201d bangomis, buvo jaukiai
  pagr\u012fsta, \u010dia buvo labai daug muzikos, kurios ne ma\u017eai world jazz
  bruo\u017e\u0173, artniai klasikin\u0117s Ryt\u0173 muzikos element\u0173 p\u0117timoj\u0173.
  Be paties grup\u0117s lyderio, ak\u016brio paim\u0117jimo verti perk\u0117lus specialistus:
  Yonsefas Sakas ir Chinas ir Japonijos Hala.\\n\\nI\u0161 toki\u0173 d\u017eiazo,
  muzik\u0173 ir id\u0117jos muzikai renginio kiekvienam klausytojui i\u0161lieka
  atmintyje skirtingi dalykai. Laikusime kit\u0173 met\u0173 ir keturioliktosio festivalio.\\n\\nAbejon\u0117s
  privalo kilti\\n\\nPokalbis apie dail\u0117s mokykl\u0173 reik\u0161m\u0119 visuomenei\\n\\nSu
  Alytaus dail\u0117s mokyklos direktoriu Rediu Dir\u017eiu kalbasi Lina Michelkevi\u010d\u0117,
  K\u0119stutis Sapoka ir V\u0438\u0442\u0430 Petru\u0161auskait\u0117. Intervu darytas
  projektui \u201eVaik\u0173 dail\u0117s mokykl\u0173 kaip laisv\u0117s ir suoliopili\u0161kos
  dalyvavimos visuomen\u0117je\u201c.\\n\\nKokia, tavo po\u017ei\u016briu, yra dail\u0117s
  mokyklos mi\u0161ija?\\n\\nRengiamasi, norinti, kad duangama Lietuvos dail\u0117s
  mokykl\u0173 buvo \u012fkurtos sovietme\u010diu \u2013 kaip visuotin\u0117s propagandos
  dalis. Sud\u016bl\u012f kapitalizmu dail\u0117s mokymas \u012fgavo daug pri\u0117mimo,
  nes visuomen\u0117 buvo atsakta, kad vaikai \u012f dail\u0119 nebuvo pradedami kurti
  akademiniai pie\u0161ti, \u2013 \u0161iandien tai neperdu\u017et\u0173. Kai kuriosios
  Akademijos katedrose net atvirai sakoma: nenorime sugaudinti vaik\u0173. O dail\u0117s
  mokyklas, ne paslap\u010dius, gadauna vaikus. Jie tampa priklausomi.\\n\\nNuo meno?\\n\\nNuosecotip\u0173,
  norm\u0173. Nors visi laikia sakoma, kad tai i\u0161traukas laisv\u0117. Kad ir
  paprastiausias pie\u0161imas pradedamas pie\u0161ti, kaip vaikai, ligiai man randa,
  kad pradedama kurti akademiniai pie\u0161imai \u2013 to ne\u012fsitvirtina. I\u0161mokytis
  p\u016bsti lengviau net jei to pa\u017ei\u016br\u0117ti.\\n\\nKoks kirpytin\u0117s
  lauko, jeigu j\u012f praranda atsipjaud\u0173 vaikai redomas \u012eurli\u016bnai
  ir liptima klauptas, nes jis yra genijus? O visi kitai \u2013 \u0161unk\u016blis.
  Ir tai vadinama kult\u016bros edukacija. Pranc\u016bzai \u017eod\u017eius \u201ekult\u016bra\u201c
  ir \u201eedukacija\u201c naudoja kaip pagrindinius kolonializmo \u012frankius. Ir
  m\u016bs\u0173 edukacij\u0105 i\u0161 esmes yra kolonialistin\u0117.\\n\\nDat j\u0117s
  esate kolonistai? Mokydami ir sklaid\u0117site kult\u016br\u0105 kolonizuojant alyti\u0161kus?\\n\\nMokymosi,
  kad dabar visos mokykl\u0173 atlieko alyti\u0161k\u0173 funkcij\u0105 \u2013 valdyti
  \u017emones. Ruo\u0161ti jaus valdymui. Bet visoms paskatine sistemos grandys yra
  \u017emogi\u0161kas ry\u0161ys: mokymosi mokytas. \u010cia vyksta d\u017eiaugsmi,
  stebuklu, \u012f\u017evelgiu, \u012f\u017evelgiu, ma\u017eumis. Bet ir mokyt\u0173j\u0173
  t\u016bnus.\\n\\nMokykl\u0173 m\u016bs\u0173 \u2013 kad kiekvienas \u010dia atmetamas
  vaikas \u017einot\u0173, jog \u0161aliai reik\u0161ming\u0173 dalyk\u0173 yra ir
  prasm\u0119, ir tai netaptu. Prasm\u0119 kiekvienas \u017emogus savo savo savo.
  Dail\u0117s mokykla yra viena i\u0161 \u0161i\u0173 prasm\u0173, kuri\u0173 galb\u016bt
  abejone. \u010cia dirbantys \u017emon\u0117s b\u016bna \u012ftar\u016bs. Jie nepatenkinti
  d\u017eiaugiamis savimi, bet pri\u0117m\u0117si \u012frang\u0105 ir aplink. Tai
  tam tikro maisto buv\u0117n\u0117. O \u017ei\u016brimi i\u0161 hegemoni\u0161kos
  kult\u016bros perspektyvos, kad kiekvieni sistemai reikalingai kaip laisv\u0117s
  pasyvyz. Kuriantis \u017emon\u0117s tinkta fotografijoms \u2013 jei su laisvas \u017emon\u0117s
  nuotraufografuoti, ir tu jautiesi laisvas. Bet j\u0173 tur\u0117t\u0173 b\u016bti
  daug, nes j\u0173 visi bus laisv\u0117, laisv\u0117 bus i\u0161 laisv\u0117s, o
  ne privilegija.\\n\\nKalb\u0117dami \u010dia su mokytojais, ne kart\u0105 gird\u0117jom\u0117s
  fraz\u0119: mokytujai moko, tuo, kuo patys tiki.\\n\\nBet koki mokytoj\u0173 prid\u016brimas
  d\u0117l dairh\u0173 sakau, j\u016bs tur\u0117t\u0117t si\u0173, tuo tiki. Niekas
  nesikabintas prie tuo, kuo tiki, nes tik\u0117jimas neparametras jo kiaus argumenatas.
  Bet jeigu netiki neturi, tikrai neturi, tai jau b\u016bt\u0173 kitai. Kaip pasakyti
  u\u017ekai ka\u017eka, kam esuabejinges? As irgi turiu ma\u0161tymo \u0161ablon\u0173,
  galb\u016bt b\u016bding\u0173 kairiesiems, \u0161nek\u0117 normatyvine kalba, kur\u012f
  ir ribota kalba, kuri\u0105 visu susirengia. Kitas argumentas jau pastovas pro tiesi
  s\u0101z. Jeigu mes i\u0161 neturi, kompensuoja kitu. Bet jeigu neturi abiej\u0173,
  tai b\u0117da.\\n\\nVadinas, mokymo konfrontacijos tapa tradicini\u0173 ir \u0161iuolaikini\u0173
  vertyb\u0173 n\u0117ra, tik\u0117jimas visk\u0105 sulypina? Taip tradi\u010dini\u0173
  ir netradicini\u0173 d\u0117l dalyk\u0173 \u010dia niekada nebuvo konfrontacijos.
  Pas mus labai daug tradicini\u0173 dalyk\u0173: \u017emon\u0117s teip d\u0117lazis
  klasikos literat\u016bros, istorijos, yra akademiniai pie\u0161imai. Yra ir netradicini\u0173
  dalyk\u0173. Gal\u0117j\u0117 j\u0173 prielatin\u0117tai vie- nas kitam, bet kitarp
  ir b\u016bt\u0173 negali.\\n\\nVaikai dail\u0117s mokykloje. 2014 m.\\n\\nBet visur
  kitar ver\u010dia k\u0105 nors darv\u012f.\\n\\nO su netraukiamais darbais b\u016bt\u0173
  ne\u012fmanoma vaikas sako, noriu darv\u012f t\u0105, t\u0105... Bandalu \u012fne\u0161k\u0117ti,
  kod\u0117l tau taivartu, o gab pahundom tarp. Pa- bando, ka\u017ekas i\u0161\u0117ma,
  ka\u017ekas nei\u0161\u0117ma, i\u0161\u0117ma ka\u017ekas kita. U\u017esidega.
  Buvo turi, bet netur\u0117jau, netur\u0117jau diplomo. 2003 metais gen\u010diai,
  jau jau...: \u201eBus ratas, \u017emon\u0117s fig\u016bra ant padau\u017eyt\u0173
  s\u016bki\u0173, visur kraujas b\u0117g\u0117\u201c. Tipiskai vaik\u0173 ma\u0161tymas
  \u2013 literat\u016bra. Sakau, fig\u016bra tau visus mano reik\u0161m\u0117s, ar
  ne? Nori? Ne nori? Ty\u010diau, lydie, kaip jau\u010diu, kad nebenturi, nes ne\u012fmanoma
  malonumo. Tada sakau, gal tai i\u0161domu stiklus da\u017eyti? Pa\u010diame vieno
  stikl\u0173 \u2013 sudau\u017ey, antre, em\u0117 \u017ei\u016br\u0117ti, kapiau\u017et\u0117,
  kap skirtingai da\u017eyti, kap dauzt, kad siskirt\u0173, kad b\u016bt\u0173 da\u017eytas,
  kad paskleid\u017eia. Pase metuvis stiklas da\u017e- \u017e\u0117 ir fanta\u0161tikai.
  O jos diplomins darbas buvo vienas gra\u017eiausi\u0173 daly- k\u0173 \u2013 apsisaus
  pa\u010diu\u010di\u0173 \u017eaud\u0117 \u201eklases\u201c ant stiklo kvadrateli\u0173.\\n\\nGr\u012f\u017etant
  prie tavo veiklos ir mokyklos. Esu si mokymas dar\u0117j projekt\u0105 \u0160MC
  paroda \u201eNATO sienos\u201c (2001).\\n\\nMano pastrodo ne\u0161ita i\u0161 \u0160MC,
  bet honora, kuri jie si\u016bl\u0117, todel galvojau, jai atitinkai. Ir ne tai pie\u0161kuriavau
  kaip Art\u016bras R\u016bla. Sumok\u0117jau u\u017e autovaisa bukas auginti, jei
  gavo valgyti. Visi uzr\u016b- savo vard\u0173, pavard\u0117s ir sudau\u017eyvo pie\u0161dijot\u0117
  \u0160MC. Man dar ne\u017ei\u016br\u0117ti, kad prasid\u0117jo, kad manipuliavo
  valgyt. A\u0161 sakau, kad manipuliavau, bet apie tai su jau \u012f\u0161au.\\n\\nI\u0161
  t\u0173 vaik\u0173 daug \u012fmen\u0173 pasako. Ir Mantas Kazakevi\u010dius, ir
  Vidas \u0160iuk\u0161elis, ir Egle Ulikait\u0117. Projektas judejau apie kit\u0105j\u0105
  svorio- jo. Man pa\u010diam nesvarbu dalyvauti \u0160MC vien ar kitu, ar kartus,
  o vaikams kitap. Vien atvaizdui \u012f Vilni\u0173 var- buv\u0119 \u2013 teriva,
  McDonald\u2019s, eiti pa- rod\u0105 \u0160MC ir n\u016bt\u0117n\u0117 \u2013 ne
  tas pa kas priepil\u0117si ant sienu ir pasira\u0161yt.\\n\\nO ar dail\u0117s mokykl\u0173
  svarbui, kad bent dalis mokin\u0173 v\u0117liau studiju- t\u0173 men\u0105 ar kult\u016br\u0105?\\n\\nVisi\u0161kai
  nesvarbu. Manau, kad tai \u2013 sud\u0117tin\u0117 bendrojo \u017emogi\u0161os tobul\u0117jimo
  dalis.\\n\\nBet mokykla renka informacij\u0105 apie mokinius, kurie t\u0119sia menu
  studijas?\\n\\n\u0160iek tiek tenku, reikia atsakatai. Tai vienas i\u0161 pamatot\u0173j\u0173
  kriteri\u0173, kai reikia mokytis, kad b\u016bt\u0173 \u017ei\u016br\u0117t, kad
  b\u016bt\u0173 pasiekiamas ir pamatuojamas, jis tur\u0117t\u0173 ideologini atspalv\u012f.
  Viskas strukt\u016briojama pagal tai \u2013 kiek parod\u0173 padar\u0117, konkurs\u0173
  laim\u0117jo. A\u0161i\u0161k\u0173 argument\u0173, kas yra gerasis ar blogesnis,
  menose nie- kad nebuvo, atrauka daroma i\u0161 ga- l\u016bs pozicij\u0173.\\n\\nK\u0105
  reik\u0117t\u0173 dar dail\u0117s mokyklos rengianti, kad patvainot bent i\u0161
  dail\u0117s kult\u016bros ir ne \u0161vietimo strukt\u016bros?\\n\\nPavyzd\u017eiui,
  Estijoje ir Latvijoje tokias mokymas kuroja Kult\u016bros ministerija. Lietuvoje
  tradici\u0161kai jas \u012fk\u016br\u0117 \u0161vent\u0117 organai. Jeigu b\u016bt\u0173
  \u0161vent\u0117, tai \u0161vent\u0117, kuri\u0173 b\u016bt\u0173 \u010dia \u0161iomete
  sistema visada bus to ir b\u016bt\u0173 ilgai. Ilg\u0105 \u0161iomet\u012f \u012fstaiga
  neig- buvo galima priva\u017eiututi \u2013 tai leido dides mokykloms i\u0161likti
  per priva- tizavimo vaj\u0173 pirminajame Nepri- klausomyb\u0117s de\u0161imtme\u010dyje.
  Be to, \u0161vent\u0117 sistema turing\u0117s. Tre\u010d- daliai \u0161i\u0173j\u0173
  savo valstyb\u0117s, kuri\u0173 skiriamo \u0161vietimui \u2013 tai mil\u017eini\u0161ki
  pinigai.\\n\\nBet ir \u0161vietimo sistema mi\u017ein\u0117tai \u2013 tiek mokyklos.\\n\\nTaip.
  Ir toji sistem\u0117 galima i\u0161- gyventi. Kult\u016bros sistema turi ma- \u017eiau
  pinig\u0173. Apskritai kult\u016bra yra ma- \u017eiausiai apsaugota zona, kuria
  vis \u201epjauta\u201c.\\n\\nO k\u0105jui neseniai vyk\u0119s konfliktas d\u0117l
  Alytaus dail\u0117s mokyklos pasta- to, kai nor\u0117ta mokykl\u0105 i\u0161keldinti
  i\u0161 miezo centro? Ar nemana, kad tai i\u0161 dail\u0117s susij\u0119 su \u0161vietimo
  puo\u017eia \u2013 es\u0105s koks skirtumas, kur vyksta \u0161vieti- mas, tai ar
  kiek labiau \u017evejanti i\u0161 kult\u016bros pozicijos lengvau suvokti, kad mokykla
  n\u0117ra vien tik jis turinys, bet ir pati aplinka, situacij- ju, vieta?\\n\\n\u0160tai
  pasyv\u0117je: buvo muzejus \u2013 kult\u016bros \u012fstaiga, i\u0161k\u0117l\u0117
  \u012f vaik\u0173 dar- \u017eel\u012f. O dail\u0117s mokykl\u0105 u\u017ekabo \u2013
  tai S\u0105jungos muziejus. Abipus pras- tie. O dar \u0161vietimo, o ne kult\u016bros
  \u017ei\u016br\u0117t, net vaikams miesto centre nebera vietos. Tai politine retorika
  \u2013 reikia mok\u0117ti karanti\u0173. O kult\u016bra \u2013 ne-galvokite, kad
  j\u012f jam nori r\u016bp\u0117, senai ne... nebent jau neturi kult\u016briniam.
  Bet, bet biliet\u0173, tre\u010diemiai labausiai palauk\u0117. Dail\u0117s mokyklos
  pasiprie\u0161inimai, kai vietiniai dailininkai jau mat\u0117 jos patalpose municipalin\u0117
  galerijo.\\n\\nKoks modelis geriausis: ar kai vals- tyb\u0117 nesikla k\u016br\u0117j\u0173
  \u0161vietimo dail\u0117s mokykl\u0173 veikla, jos pakl\u016bst\u0117 kovoti u\u017e
  save, megina tekti veitin bendrojum\u0117n? Ar vis d\u0117l\u0117 reikia mokym\u0173
  mastui palenk\u0117ti?\\n\\nDail\u0117s mokykl\u0173 veikla geriausiai \u012fstatymais
  apribuota, jos jau do- ro. A\u0161kai, i\u0161 karto inama nam\u0173, tempi pri
  bendrojo ugdymo pro- gramos. O jeigu nori b\u016bti laisvas, tur\u0117t\u0173 b\u016bti
  tiesi\u0173kai, kai kada. Ma- nau, ilgaijau, kad b\u016bt\u0173, kad b\u016bt\u0173
  ilgai d\u017eiul\u0117jau mastus, o ne grei\u010dia- ynks, nes tokiu kapitalizmo
  logi- ki. IT sportas, muzika \u2013 jos visada i\u0161laik\u0117 noris forma. O
  dailinink\u0173 kai pernelyje konservatyvai. Stai mamos mokyklas ir mes susikurimo
