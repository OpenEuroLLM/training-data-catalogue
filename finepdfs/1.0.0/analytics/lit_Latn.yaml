  Respublikos \u017eem\u0117s \u016bkio ministerija\\n\\nI. VALSTYBEI NUOSAVYB\u0116S
  TEISE PRIKLAUSANTIS NEKILNOJAMASIS TURTAS\\n\\nThe city of Kaunas, Lithuania, is
  a beautiful blend of history and modernity. Its rich cultural heritage is evident
  in its architecture, which ranges from medieval castles to contemporary buildings.
  The city is also known for its vibrant arts scene, with numerous galleries and museums
  showcasing the works of local and international artists.\\n\\nKaunas is situated
  on the banks of the Nemunas River, which adds a serene element to the city''s atmosphere.
  The river provides a picturesque backdrop for many of the city''s landmarks, including
  the Kaunas Castle and the Cathedral of St. Casimir. These historic sites offer visitors
  a glimpse into the city''s past, while the surrounding green spaces provide a peaceful
  retreat from the urban environment.\\n\\nIn addition to its cultural attractions,
  Kaunas is also home to several universities and research institutions, making it
  an ideal destination for students and scholars alike. The city''s proximity to Vilnius,
  the capital of Lithuania, makes it a convenient base for exploring the country''s
  other major cities and natural wonders.\\n\\nOverall, Kaunas is a charming and dynamic
  city that offers something for everyone. Whether you''re interested in history,
  art, or simply enjoying the outdoors, there''s no shortage of things to do in this
  beautiful Lithuanian city.\\n\\nI. VALSTYBEI NUOSAVYB\u0116S TEISE PRIKLAUSANTIS
  NEKILNOJAMAS TURTAS\\n\\n1. Bendra ap\u017evalga: poky\u010diai ir duomen\u0173
  kokyb\u0117\\n\\n2019 m., palyginti su ankstesniais ataskaitiniais laikotarpiais,
  i\u0161siskyr\u0117 ry\u0161kesniu VNT objekt\u0173 skai\u010diaus ir valdomo VNT
  ploto ma\u017e\u0117jimu, kuris, tiketina, i\u0161 dalies l\u0117m\u0117 ir s\u0105naud\u0173
  kitim\u0105. Ta\u010diau, atlikus detal\u0119s \u017eemiau nurodyt\u0173 poky\u010di\u0173
  analiz\u0119, nustatyta, kad vis d\u0117lto VNT i\u0161laikymo s\u0105naudy ir likutin\u0117s
  vert\u0117s pasikeitimams daugiausia \u012ftakos tur\u0117jo \u012f VTIPS vedam\u0173
  duomen\u0173 kiekio ir kokyb\u0117s poky\u010diai.\\n\\n| Metai | Institucij\u0173
  skai\u010dius (vnt.) | Objekt\u0173 skai\u010dius (vnt.) | Valdomas VNT plotas (mln.
  m\u00b2) | VNT likutin\u0117 vert\u0117 (mln. \u20ac) | S\u0105naudos (mln. \u20ac)
  |\\n|-------|-----------------------------|------------------------|-------------------------------|-----------------------------|------------------|\\n|
  2019  | 532 -9,8 %                  | 27 906 +2,0 %          | 9,94 -3,4 %                   |
  2 996,11 +8,2 %             | 151,85 -9,0 %    |\\n| 2018  | 590                         |
  28 486                 | 10,29                         | 2 769,46                    |
  166,94           |\\n| 2017  | 700 -15,7 %                 | 28 320 +0,6%           |
  10,40 -1,1 %                  | 3 007,30 -7,9 %             | 154,58 +8,0 %    |\\n\\nKaip
  ir pra\u0117jusiui ataskaitiniu laikotarpiu, institucij\u0173, t. y. VNT valdytoj\u0173,
  skai\u010diaus ma\u017e\u0117jim\u0105 (-9,8 proc.) l\u0117m\u0117 2019 m. baigtos
  vykdyti institucij\u0173 reorganizavimo ir likvidavimo proced\u016bros.\\n\\n2019
  m. VNT objekt\u0173 skai\u010diaus (-2,0 proc.) ir VNT ploto (-3,4 proc.) poky\u010dius
  l\u0117m\u0117 daugiau nei dukart i\u0161augus VNT objekt\u0173 pardavimas (2019
  m. i\u0161 viso buvo parduota beveik 85,2 t\u016bkst. kv. metr\u0173 VNT ploto)
  ir did\u0117jan\u010dios valstyb\u0117s perimto be\u0161eimininkio ar paveld\u0117to
  NT apimtys.\\n\\nRemiantis VTIPS duomenimis, ataskaitiniu laikotarpiu i\u0161 viso
  keit\u0117si 2 839 NT objekt\u0173 savininkai:\\n\\n- 953 NT objekt\u0173 savininke
  tapo Lietuvos Respublika (perimtas be\u0161eimininkis ir (ar) paveld\u0117tas NT);\\n-
  1 886 VNT objekt\u0173 savininkais tapo kiti juridiniai arba fiziniai asmenys (parduotas
  tretiesiems asmenims ir (ar) perduotas savivaldyb\u0117s nuosavyb\u0117n VNT).\\n\\nDa\u017eniausiai
  LR NT objekt\u0173 savininke tampa per\u0117mus be\u0161eiminink\u0173 NT ar NT
  paveldint (jei po fizinio asmens mirties per nustatyt\u0105 termin\u0105 neatsiranda
  ties\u0117tas nuosirujus priklausiusio NT paveld\u0117tojas). Taigi, perimtas be\u0161eimininkis
  ir valstyb\u0117s paveld\u0117tas NT \u2013 didina, o VNT pardavimas ir VNT nuosavyb\u0117s
  perdavimas savivaldyb\u0117s nuosavyb\u0117n \u2013 ma\u017eina VNT objekt\u0173
  skai\u010di\u0173 ir bendr\u0105 valdom\u0105 plot\u0105. Gauti NT savinink\u0173
  pasikeitim\u0173 analiz\u0117s rezultatai (2019 m. parduot\u0173 ar perduot\u0173
  VNT objekt\u0173 buvo beveik dvigubai daugiau nei perimt\u0173 ar paveld\u0117t\u0173
  NT objekt\u0173) parod\u0117, kaip VNT pardavimas ir be\u0161eimininkio bei valstyb\u0117s
  paveld\u0117to NT perimimas lemia viso valstyb\u0117s nuosavyb\u0117s teise valdomo
  nekilnojamojo turto portfelio poky\u010dius.\\n\\nLikutin\u0117s vert\u0117s (+8,2
  proc.) did\u0117jim\u0105 l\u0117m\u0117, palyginti su 2018 m. ataskaitiniu laikotarpiu,
  i\u0161augusios \u012f VTIPS suvest\u0173 duomen\u0173 apie VNT likutines vertes
  apimtys. Kaip ir pra\u0117jusiui ataskaitiniu laikotarpiu, 2019 m. did\u017eiausi\u0105
  \u012ftak\u0105 bendros VNT likutin\u0117s vert\u0117s sumos poky\u010diu tur\u0117jo
  SAM patikejimo teise valdom\u0173 VNT objekt\u0173 likutini\u0173 ver\u010di\u0173
  (ne)pateikimas. 2018 m. bendros VNT likutin\u0117s vert\u0117s ma\u017e\u0117jim\u0105
  l\u0117m\u0117 SAM valdom\u0173 NT objekt\u0173, kurie panaudos pagrindais perduoti
  naudotis \u012fvairiomis LR ligonin\u0117mis, likutin\u0117s vert\u0117 nepateikimas,
  kuris apie\\n\\n183 mln. eur\u0173 l\u0117m\u0117 bendros 2018 m. likutin\u0117s
  vert\u0117s suma\u017e\u0117jim\u0105. 2019 m. bendros VNT likutin\u0117s vert\u0117s
  padid\u0117jim\u0105 taip pat l\u0117m\u0117 SAM: 2019 m. nurodytos 147 objektais
  didesnio SAM valdom\u0173 VNT objekt\u0173 skai\u010diaus likutin\u0117s vert\u0117s
  ir d\u0117l to 2019 m. bendra SAM valdom\u0173 VNT objekt\u0173 likutin\u0117 vert\u0117
  i\u0161augo 184,7 mln. eur\u0173 suma ir sudar\u0117 net 81 proc. bendros VNT likutin\u0117s
  vert\u0117s padid\u0117jimo.\\n\\nSanaud\u0173 (-9,0 proc.) ma\u017e\u0117jim\u0105
  l\u0117m\u0117 remonto (-21,5 proc.), vandens (-27 proc.) ir \u0161ildymo (-17 proc.)
  sanaud\u0173 ma\u017e\u0117jimas.\\n\\nVNT sudaro Lietuvoje ir u\u017esienio valstyb\u0117se
  registruoti NT objektai, kuri\u0173 savinink\u0117 yra Lietuvos Respublika. Absoliuci\u0105
  daugum\u0105 \u2013 net 99,8 proc. viso VNT sudaro Lietuvoje registruotas valstybei
  priklausantis NT. U\u017esienio valstyb\u0117se registruotas VNT sudaro vos 0,2
  proc. viso VNT ploto ir daugiausia apima Lietuvos Respublikos ambasad\u0105, konsulat\u0105,
  atstovybi\u0173 ir ambasadori\u0173 rezidencij\u0173 pastatus, kuriuos patik\u0117jimo
  teise valdo URM.\\n\\n**Valstybei nuosavyb\u0117s teise priklausantis nekilnojamasis
  turtas**\\n\\n- **Lietuvoje registruotas VNT**\\n  - 99,8 %\\n  - 9,92 mln. m\u00b2\\n\\n-
  **U\u017esienyje registruotas VNT**\\n  - 0,2 %\\n  - 0,024 mln. m\u00b2\\n\\nKadangi
  duomenys apie u\u017esienyje registruotus VNT objektus i\u0161 esm\u0117s nesikei\u010dia
  jau tr\u0119s\u0173 met\u0173, 2019 m. Ataskaitoje jie neb\u016bs nagrin\u0117jami
  detaliu: visa informacija apie u\u017esienio valstyb\u0117se registruot\u0105 VNT
  yra pateikama [1 priede](#).\\n\\nV\u012e Turto banko \u012fgyvendintos VTIPS duomen\u0173
  korekti\u0161kumo ir kokyb\u0117s u\u017etikrinimo priemon\u0117s \u2013 nuolatinis
  VTIPS funkcionalumo tobulinimas, aktyv\u016bs VTIPS prie\u017ei\u016bros ir bendradarbiavimo
  su institucijomis veiksmai (primenan\u010dioms ir paraginant jas pateikti duomenis
  \u012f VTIPS ar, pasteb\u0117jus neatitikim\u0173, patikslinti juos ir pan.), duomen\u0173
  suvedimo \u012f VTIPS seminarai yra rezultatyv\u016bs: sanaud\u0173 ir kabinetinio
  ploto duomen\u0173 pateikimo \u012f VTIPS kokyb\u0117 ger\u0117jo ketvirtus metus
  i\u0161 eil\u0117s. 2019 m. fiksuoti kiek prastesni duomen\u0173 apie darbuotoj\u0173
  skai\u010di\u0173 suvedimo \u012f VTIPS rezultatai: 2019 m. darbuotoj\u0173 skai\u010diaus
  nepateik\u0117 80 institucij\u0173, i\u0161 kuri\u0173 net 66 \u012fstaig\u0173
  darbuotoj\u0173 skai\u010di\u0173 buvo pateikusios 2018 m.\\n\\n### Ar pateiktos
  s\u0105naudos\\n\\n**Visas VNT**\\n\\n- **2017 m.**\\n  - Taip: 75,1%\\n  - Ne:
  24,9%\\n\\n- **2018 m.**\\n  - Taip: 72,5%\\n  - Ne: 27,5%\\n\\n- **2019 m.**\\n  -
  Taip: 75%\\n  - Ne: 25%\\n\\n**Tik administracin\u0117s paskirties VNT**\\n\\n-
  **2017 m.**\\n  - Taip: 80,2%\\n  - Ne: 19,8%\\n\\n- **2018 m.**\\n  - Taip: 84,5%\\n  -
  Ne: 15,5%\\n\\n- **2019 m.**\\n  - Taip: 86,6%\\n  - Ne: 13,4%\\n\\n### Ar pateiktas
  kabinetinis plotas\\n\\n**Tik administracin\u0117s paskirties VNT**\\n\\n- **2017
  m.**\\n  - Taip: 55,7%\\n  - Ne: 44,3%\\n\\n- **2018 m.**\\n  - Taip: 78,6%\\n  -
  Ne: 21,4%\\n\\n- **2019 m.**\\n  - Taip: 86,1%\\n  - Ne: 13,9%\\n\\n### Ar pateiktas
  darbuotoj\u0173 skai\u010dius\\n\\n**Tik administracin\u0117s paskirties VNT**\\n\\n-
  **2017 m.**\\n  - Taip: 90,4%\\n  - Ne: 9,6%\\n\\n- **2018 m.**\\n  - Taip: 93,7%\\n  -
  Ne: 6,3%\\n\\n- **2019 m.**\\n  - Taip: 82,7%\\n  - Ne: 17,3%\\n\\n2. Lietuvoje
  registruotas VNT\\n\\n2.1. Objekt\u0173 skai\u010dius, plotas, likutin\u0117 vert\u0117
  ir i\u0161laikymo s\u0105naudos\\n\\n2019 m. pabaigoje turto valdytojai i\u0161
  viso vald\u0117 apie 9,92 mln. kv. metr\u0173 Lietuvoje registruoto VNT ploto, kurio
  i\u0161laikymas kainavo beveik 152 mln. eur\u0173, o likutin\u0117 vert\u0117 siek\u0117
  beveik 3 mlrd. eur\u0173.\\n\\n| Metai | Objekt\u0173 skai\u010dius (vnt.) | Valdomas
  VNT plotas (mln. m\u00b2) | VNT likutin\u0117 vert\u0117 (mln. \u20ac) | S\u0105naudos
  (mln. \u20ac) |\\n|-------|------------------------|-------------------------------|-----------------------------|------------------|\\n|
  2019  | 27 878                 | 9,92                          | 2 929,34                    |
  151,85           |\\n| 2018  | 28 458                 | 10,27                         |
  2 729,35                    | 166,94           |\\n| 2017  | 28 292                 |
  10,38                         | 2 937,84                    | 154,58           |\\n\\nValdomo
  VNT ploto pasiskirstymo pagal NT paskirt\u012f analiz\u0117 parod\u0117, kad, palyginti
  su pra\u0117jusiu ataskaitiniu laikotarpiu, ma\u017e\u0117jo 11 i\u0161 14 NT paskir\u010di\u0173
  VNT plotas, o 3 NT paskir\u010di\u0173 \u2013 gydymo (+11 t\u016bkst. kv. metr\u0173),
  specialiosios (+23,7 t\u016bkst. kv. metr\u0173) ir sporto (+1 t\u016bkst. kv. metr\u0173)
  \u2013 VNT plotas 2019 m. did\u0117jo. Gydymo paskirties VNT ploto augim\u0105 l\u0117m\u0117
  VTIPS duomen\u0173 pasikeitimai d\u0117l informacijos i\u0161 NTR atnaujinimo, po
  kurio sistemoje atsirado 1 naujas gydymo paskirties objektas (0,7 t\u016bkst. kv.
  metr\u0173), buvo pakeista 4 objekty (bendras plotas vir\u0161 4,4 t\u016bkst. kv.
  metr\u0173) paskirtis, padid\u0117jo 6 gydymo paskirties objekt\u0173 plotas (i\u0161
  viso +4,4 t\u016bkst. kv. metr\u0173). Specialiosios paskirties VNT ploto padid\u0117jim\u0105
  taip pat l\u0117m\u0117 VTIPS duomen\u0173 pasikeitimai d\u0117l informacijos i\u0161
  NTR atnaujinimo sistemoje, t. y. atsirado 9 nauji specialiosios paskirties objektai
  (bendras plotas apie 16,6 t\u016bkst. kv. metr\u0173), 7 objekt\u0173 buvusi paskirtis
  pakeista \u012f speciali\u0105j\u0105 (i\u0161 viso apie 8,2 t\u016bkst. kv. metr\u0173).\\n\\n2019
  m. did\u0117jo 9 i\u0161 15 NT paskir\u010di\u0173 VNT likutin\u0117 vert\u0117,
  o likusi\u0173 NT paskir\u010di\u0173 likutin\u0117s vert\u0117s atskaitiniu laikotarpiu
  ma\u017e\u0117jo. 2019 m. labiausiai i\u0161augo gydymo (+188,7 mln. eur\u0173)
  ir gyvenamosios (+178,7 mln. eur\u0173) paskirties VNT likutin\u0117 vert\u0117.
  Kaip jau min\u0117ta, 2019 m. gydymo paskirties VNT likutin\u0117s vert\u0117s \u0161uol\u012f
  l\u0117m\u0117 \u012f VTIPS pateiktos didesni\u0173 likutin\u0117s vert\u0117s duomen\u0173
  apimtys: nurodytos 147 objektais didesnio SAM valdom\u0173 VNT objekt\u0173 skai\u010diaus
  likutin\u0117s vert\u0117s ir d\u0117l to bendra SAM valdom\u0173 VNT objekt\u0173
  likutin\u0117 vert\u0117 i\u0161augo 184,7 mln. eur\u0173 suma ir sudar\u0117 net
  81 proc. 2019 m. bendros VNT likutin\u0117s vert\u0117s padid\u0117jimo. Kit\u0173
  paskir\u010di\u0173 VNT likutini\u0173 ver\u010di\u0173 augimui taip pat daugiausia
  \u012ftakos tur\u0117jo VTIPS duomen\u0173 kiekio (nauj\u0173 objekt\u0173 duomen\u0173
  i\u0161 NTR \u012fkelimas \u012f VTIPS ir likutini\u0173 ver\u010di\u0173 \u012fvedimas;
  didesnio VNT objekt\u0173 skai\u010diaus likutin\u0117s vert\u0117s (ne)pateikimas)
  ir kokyb\u0117s (valdytoj\u0173 duomen\u0173 vedimo \u012f VTIPS klaidos) poky\u010diai.
  Pavyzd\u017eiui, gyvenamosios paskirties VNT likutin\u0117s vert\u0117s did\u0117jim\u0105
  (+12,5 mln. eur\u0173) l\u0117m\u0117 366 nauj\u0173 gyvenamosios paskirties NT
  objekt\u0173 duomen\u0173 i\u0161 NTR \u012fkelimas \u012f VTIPS ir likutini\u0173
  ver\u010di\u0173 (i\u0161 viso daugiau nei 3,7 mln. eur\u0173) pateikimas. Kadangi
  net 359 (i\u0161 min\u0117t\u0173j\u0173 366) NT\\n\\n---\\n\\n6 NT paskir\u010di\u0173
  \u201eKiti in\u017eineriniai statiniai\u201c objektai ploto neturi.\\n\\nobjekt\u0173
  valdytojas yra Turto bankas, galima teigti, kad gyvenamosios paskirties likutin\u0117s
  vert\u0117s i\u0161augim\u0105 netiesiogiai l\u0117m\u0117 be\u0161\u0117imininkio
  ar paveld\u0117to NT objekty per\u0117mimas. Kadangi da\u017eniausiai yra perimami
  ar paveldimi gyvenamosios paskirties NT objektai su priklausiniais, kuri\u0173 NT
  paskirtis paprastai b\u016bna kit\u0173 in\u017einerini\u0173 statini\u0173 (kiem\u0173
  aik\u0161tel\u0117s, tvoros ir pan.), transporto ir gara\u017e\u0173 (gara\u017eai),
  pagalbinio \u016bkio (sand\u0117liukai, t\u016bkiniai pastatai ir pan.) ir pan.,
  tad min\u0117t\u0173 NT paskir\u010di\u0173 objekt\u0173 likutini\u0173 ver\u010di\u0173
  did\u0117jim\u0105 taip pat galima sieti su Turto banko vykdomomis be\u0161\u0117imininkio
  ar paveld\u0117to NT objekty per\u0117mimo proced\u016bromis.\\n\\n**Likutin\u0117
  vert\u0117, mln. \u20ac**\\n\\n- **Administracin\u0117 Mokslo**: 714,7, 691,0, 657,6\\n-
  **Gydymo**: 330,2, 282,2, 265,2\\n- **Kult\u016bros**: 280,1, 293,3, 265,2\\n- **Kitas**:
  215,0, 207,8, 199,9\\n- **Gamybos ir sand\u0117liavimo**: 207,9, 206,6, 178,2\\n-
  **Gyvenamoji**: 164,7, 163,8, 173,0\\n- **Kiti in\u017eineriniai statiniai**: 150,1,
  134,9, 134,3\\n- **Specialioji**: 160,0, 155,1, 176,3\\n- **Transporto ir gara\u017e\u0173**:
  92,2, 77,1, 79,0\\n- **Prekybos ir paslaug\u0173**: 45,0, 40,4, 34,9\\n- **Sporto**:
  24,2, 23,7, 18,6\\n- **Pagalbinio \u016bkio**: 10,4, 8,9, 9,6\\n- **Poilsio**: 8,6,
  7,2, 7,7\\n- **Religin\u0117**: 0,7, 0,2\\n\\nVNT objekt\u0173 skai\u010diaus pasiskirstymas
  pagal NT paskirtis pateikiamas 2 priede.\\n\\nVNT valdytoj\u0173 \u012f VTIPS pateiktais
  duomenimis, bendros metin\u0117s Lietuvoje registruoto VNT i\u0161laikymo s\u0105naudos
  2019 m. sudar\u0117 beveik 152 mln. eur\u0173 ir buvo 9 proc. ma\u017eesn\u0117s
  nei 2018 m.\\n\\n| VNT i\u0161laikymo s\u0105naudos, mln. \u20ac | 2017 m. | 2018
  m. | 2019 m. |\\n|--------------------------------|---------|---------|---------|\\n|
  **Komunalin\u0117s s\u0105naudos**      | 90,55   | 94,91   | 87,10   |\\n| \u0160ildymas                       |
  37,99   | 40,42   | 33,59   |\\n| Elektra                        | 40,21   | 39,29   |
  41,31   |\\n| Vanduo                         | 8,07    | 10,37   | 7,58    |\\n|
  Kitos komunalin\u0117s s\u0105naudos    | 4,28    | 4,83    | 4,63    |\\n| **Remonto
  s\u0105naudos**           | 26,68   | 30,41   | 23,88   |\\n| Einamasis remontas             |
  18,97   | 23,82   | 17,97   |\\n| Kapitalinis remontas           | 7,71    | 6,59    |
  5,91    |\\n| **Eksplotavimo ir administravimo s\u0105naudos** | 36,93 | 41,13 |
  40,48 |\\n| Apsauga                        | 8       | 8,50    | 8,99    |\\n| Valymas                        |
  16,21   | 18,70   | 20,72   |\\n| Kitos eksplotavimo ir administravimo s\u0105naudos
  | 12,71 | 13,94 | 10,77 |\\n| **Kitos patalp\u0173 i\u0161laikymo s\u0105naudos**
  | 0,42 | 0,49 | 0,39 |\\n| Patalp\u0173 draudimas (TD)        | 0,35    | 0,41    |
  0,33    |\\n| Patalp\u0173 draudimas (CA)        | 0,07    | 0,08    | 0,05    |\\n|
  **I\u0161 viso s\u0105naud\u0173**           | 154,58  | 166,94  | 151,85  |\\n\\n+/-
  proc. - procentin\u0117 pokytis.\\n\\nV\u012e Turto banko ekspertiniu vertinimu,
  2019 m. Lietuvoje registruoto VNT i\u0161laikymo s\u0105naud\u0173 esmin\u0117s
  kitimo prie\u017eastys yra \u0161ios:\\n\\n- \u0161ildymo s\u0105naud\u0173 suma\u017e\u0117jimas
  (-16,9 proc.), kuris gal\u0117t\u0173 b\u016bti siejamas su \u0161iltu \u017eiemos
  sezonu;\\n- suma\u017e\u0117jusios s\u0105naudos u\u017e suvartot\u0105 vanden\u012f
  (-26,9 proc.);\\n- remonto s\u0105naud\u0173 suma\u017e\u0117jimas (-21,5 proc.).\\n\\n2019
  m. daugiausia kainavo administracin\u0117s (beveik 35 mln. eur\u0173) paskirties
  objekt\u0173 i\u0161laikymas. Labiausiai atskaitiniu laikotarpiu, palyginti su 2018
  m., kito specialiosios paskirties (-9,3 mln. eur\u0173), mokslo (-7,3 mln. eur\u0173),
  kitos paskirties (+6,1 mln. eur\u0173) bei transporto ir gara\u017e\u0173 (-4,3
  mln. eur\u0173) VNT objekt\u0173 i\u0161laikymo s\u0105naudos. 3 met\u0173 duomen\u0173
  analiz\u0117 parod\u0117, kad mokslo, kitos, specialiosios, transporto ir gara\u017e\u0173
  paskirties VNT objektams kasmet buvo b\u016bdingas s\u0105naud\u0173 kitimas, kur\u012f
  gal\u0117jo lemti \u012f VTIPS suvedam\u0173 duomen\u0173 kiekio ir kokyb\u0117s
  poky\u010diai.\\n\\nSpecialiosios paskirties VNT i\u0161laikymo s\u0105naud\u0173
  ma\u017e\u0117jim\u0105 (-9,3 mln. eur\u0173) atskaitiniu laikotarpiu l\u0117m\u0117
  40 specialiosios paskirties VNT objekt\u0173 (i\u0161 viso per 37,6 t\u016bkst.
  kv. metr\u0173 ploto) 2019 m. s\u0105naud\u0173 duomen\u0173 nepateikimas VTIPS:
  2018 m. min\u0117t\u0173 objekt\u0173 s\u0105naudos siek\u0117 beveik 9,4 mln. eur\u0173.
  Mokslo paskirties VNT objekt\u0173 i\u0161laikymo s\u0105naud\u0173 suma\u017e\u0117jim\u0105
  (-7,3 mln. eur\u0173) l\u0117m\u0117 suma\u017e\u0117jusios \u012fvairi\u0173 mokslo
  \u012fstaig\u0173 remonto s\u0105naudos, kurios 2019 m., palyginti su 2018 m., suma\u017e\u0117jo
  daugiau nei 5,1 mln. eur\u0173 (-54 proc.). Mokslo paskirties VNT objekt\u0173 i\u0161laikymo
  s\u0105naud\u0173 ma\u017e\u0117jim\u0105 taip pat l\u0117m\u0117 ir duomen\u0173
  apie 2019 m. mokslo paskirties VNT objekt\u0173 i\u0161laikymo s\u0105naudas nepateikimas
  \u012f VTIPS: d\u0117l \u0161ios prie\u017easties min\u0117tos paskirties VNT objekt\u0173
  s\u0105naudos ma\u017e\u0117jo dar beveik 4,9 mln. eur\u0173 suma. Atskaitiniu laikotarpiu
  taip pat ma\u017e\u0117jo ir transporto ir gara\u017e\u0173 paskirties VNT i\u0161laikymo
  s\u0105naudos (-4,3 mln. eur\u0173): min\u0117tos paskirties VNT i\u0161laikymo
  s\u0105naud\u0173 kitim\u0105 2019 m. l\u0117m\u0117 beveik 4,6 mln. eur\u0173 ma\u017eesn\u0117s
  nei 2018 m. remonto s\u0105naudos.\\n\\nAtskaitiniais metais labiausiai augo kitos
  paskirties VNT i\u0161laikymo s\u0105naudos (+6,1 mln. eur\u0173). Pagrindin\u0117
  min\u0117t\u0105 kitim\u0105 l\u0117musi prie\u017eastis \u2013 pagerej\u0119s duomen\u0173
  apie 2019 m. kitos paskirties VNT i\u0161laikymo s\u0105naudas pateikimas \u012f
  VTIPS. Remiantis VTIPS duomenimis, 2019 m., palyginti su 2018 m., buvo pateiktos
  87 objektais didesnio skai\u010diaus min\u0117tos paskirties VNT objekt\u0173, kuri\u0173
  bendras plotas sudar\u0117 per 418 t\u016bkst. kv. metr\u0173, i\u0161laikymo s\u0105naudos,
  o bendra pateikt\u0173 s\u0105naud\u0173 suma vir\u0161ijo 7 mln. eur\u0173.\\n\\n**VNT
  i\u0161laikymo s\u0105naudos, mln. \u20ac**\\n\\n![Graph showing VNT maintenance
  costs in millions of euros for different categories.]\\n\\nVNT i\u0161laikymo s\u0105naud\u0173
  ir naudojamo ploto, kurio s\u0105naudos pateiktos, pasiskirstymas pagal NT paskirt\u012f
  pateiktas 3 priede.\\n\\n2019 m. s\u0105naudy, tenkan\u010di\u0173 1 kv. metrui,
  analiz\u0117 atskleid\u0117, kad 2019 m. ma\u017e\u0117jo vis\u0173 s\u0105naud\u0173
  1 kv. metro kaina, i\u0161skyrus kapitalinio remonto, apsaugos ir elektros s\u0105naudas.
  Elektros ir apsaugos 1 kv. metro s\u0105naudos 2019 m. i\u0161augo atitinkamai 0,4
  euro (+7 proc.) ir 0,3 euro (+12 proc.). Kaip ir kasmet, brangiausiai valstybei\\n\\nkainavo
  kapitalinis remontas, kurio 1 kv. metro kaina ataskaitiniu laikotarpiu siek\u0117
  59,4 euro\\\\(^9\\\\) ir buvo 18,2 euro (+44 proc.) didesn\u0117 nei 2018 m. Kapitalinio
  remonto s\u0105naud\u0173, tenkan\u010di\u0173 1 kv. metrui VNT ploto, augim\u0105
  2019 m. l\u0117m\u0117 Nacionalinio visuomen\u0117s sveikatos centro prie SAM valdom\u0173
  3,5 t\u016bkst. kv. metr\u0173 administraciniai patalp\u0173, esan\u010di\u0173
  Kalvarij\u0173 g. 153, Vilniuje, kapitalinis remontas, kuris i\u0161 viso kainavo
  beveik 1,8 mln. eur\u0173, o 1 kv. metro kaina buvo kiek didesn\u0117 nei 507 eurai.
  Kapitalinio remonto s\u0105naud\u0173, tenkan\u010di\u0173 1 kv. metrui VNT ploto,
  augim\u0105 taip pat l\u0117m\u0117 ir kiti brangesni 2019 m. kapitaliniai remontai:
  beveik 650 kv. metr\u0173 ploto administracin\u0117s paskirties objekto, esan\u010dio
  Pilies g. 12, Klaip\u0117doje, kur\u012f valdo Lietuvos Respublikos speciali\u0173j\u0173
  tyrim\u0173 tarnyba, kapitalinis remontas, kainav\u0119s per 304 t\u016bkst. eur\u0173
  arba 470 eur\u0173 u\u017e 1 kv. metr\u0105; Nacionalin\u0117s \u017eem\u0117s tarnybos
  prie \u017d\u016aM valdom\u0173 administracin\u0173 patalp\u0173, esan\u010di\u0173
  Maironio g. 9, Utenoje, kapitalinis remontas, i\u0161 viso kainav\u0119s 127,5 t\u016bkst.
  eur\u0173 arba 403,5 euro u\u017e 1 kv. metr\u0105; ir kiti.\\n\\n---\\n\\n\\\\(^9\\\\)
  VNT i\u0161laikymo s\u0105naudos, tenkan\u010dios 1 kv. metrui, apskai\u010diuotos
  pagal t\u0105 naudojam\u0105 VNT plot\u0105, kurio s\u0105naudos buvo pateiktos
  VTIPS.\\n\\n2.2. VNT pasiskirstymas pagal naudojimo pagrind\u0105\\n\\nVNT, perduoto
  turto valdytojams patik\u0117jimo teise\\\\(^{10}\\\\), \u012fskaitant perduot\u0105
  patik\u0117jimo sutarties pagrindu, ir naujojamo turto valdytojo valstyb\u0117s
  pavestoms funkcijoms vykdyti, bei VNT, nenaudojamo turto valdytojo pavestoms valstyb\u0117s
  funkcijoms vykdyti, proporcija nekinta 3 metus i\u0161 eil\u0117s: 78 proc. viso
  VNT ploto yra naudojama valdytoj\u0173 valstyb\u0117s pavestoms funkcijoms vykdyti,
  o likusi 22 proc. dalis \u2013 teises akt\u0173 nustatyta tvarka yra arba panaudos
  pagrindais perduota laikinai neatlygin\u010diai valdyti ir naudotis kitiems subjektams,
  arba i\u0161nuomota, arba lieka laisva.\\n\\n![VNT pasiskirstymas pagal naudojim\u0105](image)\\n\\nNaudojamo
  VNT ploto pagal naudojimo pagrind\u0105 analiz\u0117 atskleid\u0117, kad 2019 m.
  ma\u017e\u0117jo ne tik VNT plotas, naudojamas turto valdytojo pavestoms valstyb\u0117s
  funkcijoms vykdyti (-4,1 proc.), bet ir atiduotas panaudai (-1,5 proc.), i\u0161nuomotas
  (-0,4 proc.) ir laisvas VNT plotas (-28,6 proc.). Naudojamo VNT ploto ma\u017e\u0117jimas
  koreliuoja su bendro valdomo VNT ploto ma\u017e\u0117jimu, ta\u010diau didesniu
  naudojamuo ploto ma\u017e\u0117jimu \u012ftakos galejo tur\u0117ti ir duomen\u0173
  i\u0161 NTR atnaujinimas VTIPS, d\u0117l kurio gauta tikslesn\u0117s informacijos
  apie naudojamus plotus. Patik\u0117tiniam valstyb\u0117s pavestoms funkcijoms vykdyti
  nereikalingo bendro VNT ploto (perduoto naudoti kitoms institucijoms, i\u0161nuomoto
  ir laisvo) ma\u017e\u0117jimas gali b\u016bti siejamas su CTV reformos s\u0117km\u0119
  \u012fgyvendinimo rezultatais: did\u0117ja nereikalingo VNT pardavimai, geriau ir
  efektyviau naudojamas CTV perduotas VNT plotas. 2019 m. VNT pasiskirstymo pagal
  naudojimo pagrind\u0105 duomen\u0173 poky\u010diams \u012ftakos taip pat tur\u0117jo
  ir atskaitiniu laikotarpiu baigta \u012fgyvendinti \u0160MSM inicijuota profesinio
  mokymo sistemos pertvarka, kuriai vykdant ir siekiant didesn\u0117s profesinio mokymo
  attitikties darbo rinkos poreikiams bei \u012fgyvendinant Lietuvos Respublikos profesinio
  mokymo \u012fstatym\u0105 biud\u017eetines profesinio mokymo \u012fstaigos buvo
  pertvarkytos \u012f vie\u0161\u0105sias \u012fstaigas. Profesinio mokymo sistemos
  pertvarkos dalimi tapo ir VNT objekt\u0173, kuriuos iki min\u0117tos pertvarkos
  patik\u0117jimo teise vald\u0117 \u0160MSM, o panaudos pagrindais naudojosi profesinio
  mokymo \u012fstaigos, perdavimas patik\u0117jimo teise valdyti (ir valstyb\u0117s
  pavestoms funkcijoms naudoti) tiesiogiai profesinio mokymo \u012fstaigoms. Tod\u0117l
  d\u0117l \u012fvairi\u0173 mokslo paskirties objekt\u0173 ir kompleks\u0173 perdavimo
  tiesiogiai valdyti min\u0117toms mokymo \u012fstaigoms \u0160MSM patik\u0117jimo
  teise valdom\u0173 VNT objekt\u0173 portfelis 2019 m., palyginti su 2018 m., suma\u017e\u0117jo
  239 objektais (-41 proc.) ir 221,7 t\u016bkst. kv. metru plotu (-53,5 proc.).\\n\\n|
  Metai | Patik\u0117jimo teis\u0117 / sutartis (mln. m\u00b2) | Panauda (mln. m\u00b2)
  | Nuoma (mln. m\u00b2) | Laisvas (mln. m\u00b2) |\\n|-------|--------------------------------------|-----------------|----------------|-----------------|\\n|
  2019  | 7,73 -4,1 %                          | 1,73 -1,6 %     | 0,30 -0,4 %    |
  0,10 -28,6 %    |\\n| 2018  | 8,06                                | 1,76            |
  0,30           | 0,15            |\\n| 2017  | 8,28 -2,6 %                          |
  1,69 +4,2 %     | 0,29 +3,4 %    | 0,18 -17,7 %    |\\n\\n\\\\(^{10}\\\\) Subjektai
  patik\u0117jimo teise valdom\u0105 VNT naudoja valstybes jiems priskirtoms funkcijoms
  vykdyti ir turi teise priimti arba iniciuoti sprendimus d\u0117l \u0161io turto
  valdymo, naudojimo ir disponavimo j\u0173; i\u0161skyrus sprendimus d\u0117l perleidimo
  kit\u0173 asmen\u0173 nuosavyb\u0119, ar d\u0117l daiktini\u0173 teisi\u0173 suvar\u017eymo.
  VNT patik\u0117jimo teise turto, naudoja ir disponuoja juo CTV, valstyb\u0117s institucijos,
  \u012fstaigos ir organizacijos, valstyb\u0117s \u012fmon\u0117s, taip pat savivaldyb\u0117s
  turto valdymo \u012fstatymo nustatyta atvejais. Kitame juridiniame asmenyse VNT
  patik\u0117jimo teise gali b\u016bti perduotas pagal turto patik\u0117jimo sutart\u012f
  tik tai atvejais, kai \u012fstatymai jiems priskiria valstyb\u0117s funkcij\u0173
  vykdym\u0105 (pvz., universitetai, AB \u201eLietuvos gele\u017einkeliai\u201c).\\n\\n2.2.1.
  VNT panauda\\n\\n2019 m. pabaigoje panaudos pagrindais laikiniai neatlygintinai
  valdyti ir naudoti perduoto VNT plotas buvo kiek didesnis nei 1,7 mln. kv. metry
  ir sudar\u0117 17,4 proc. viso valstybei nuosavyb\u0117s teise priklausan\u010dio
  NT ploto. Palyginti su pra\u0117jusiu ataskaitiniu laikotarpiu, panaudos pagrindais
  perduotas VNT plotas ma\u017e\u0117jo (-1,6 proc.), ta\u010diau panaudos sutar\u010di\u0173
  skai\u010dius ir toliau augo (+6,4 proc.).\\n\\n| Metai | Naudojamo VNT bendras
  plotas (mln. m\u00b2) | Panaudos sutar\u010di\u0173 skai\u010dius (vnt.) |\\n|-------|--------------------------------------|----------------------------------|\\n|
  2019  | 1,73                                 | 3 220                            |\\n|
  2018  | 1,76                                 | 3 026                            |\\n|
  2017  | 1,69                                 | 2 602                            |\\n\\n2019
  m., skirtingai nei ankstesniu ataskaitiniu laikotarpiu, vie\u0161ojo sektoriaus
  subjektams (toliau \u2013 VSS) panaudos pagrindais laikiniai neatlygintinai valdyti
  ir naudoti suteiktas VNT plotas ma\u017e\u0117jo (-2 proc.) ir sudar\u0117 beveik
  1,65 mln. kv. metry, o ne vie\u0161ojo sektoriaus (toliau \u2013 ne VSS) panaudos
  gav\u0117jams laikiniai perduotas naudoti VNT plotas did\u0117jo (+8,3 proc.) ir
  vir\u0161ijo 0,08 mln. kv. metry, bet sudar\u0117 vos 0,8 proc. viso Lietuvoje registruoto
  VNT ploto.\\n\\n| Metai | Panauda VSS (mln. m\u00b2) | Panauda ne VSS\u00b9 (mln.
  m\u00b2) |\\n|-------|----------------------|--------------------------|\\n| 2019  |
  1,65                 | 0,082                    |\\n| 2018  | 1,68                 |
  0,076                    |\\n| 2017  | 1,60                 | 0,089                    |\\n\\nDetali
  panaudos ne VSS analiz\u0117 parod\u0117, kad ne VSS panaudos gav\u0117jams laikiniai
  naudoti perduoto VNT ploto did\u0117jim\u0105 l\u0117m\u0117 dviej\u0173 Policijos
  departamento prie VRM valdomy specialiosios paskirties objekty, kuri\u0173 bendras
  plotas sudaro daugiau nei 11,3 t\u016bkst. kv. metry, perdavimas laikiniai neatlygintinai
  panaudos pagrindais naudotis vienai u\u017edarajai akcin\u0117i bendrovei.\\n\\n![2019
  m. VNT panauda ne VSS](image)\\n\\n\u00b9 Remiantis VTIPS duomenimis ir ekspertiniu
  V\u012e Turto banko vertinimu.\\n\\nNe vie\u0161ojo sektoriaus subjekt\u0173, laikinai
  neatlygintinai panaudos pagrindais naudojan\u010di\u0173 daugiausia VNT ploto, TOP
  50 s\u0105ra\u0161as pateikiamas [4 priede].\\n\\nDvejus metus i\u0161 eil\u0117s
  fiksuojamas neterminuot\u0173\\\\(^{12}\\\\) panaudos sutar\u010di\u0173 skai\u010diaus
  (-4,3 proc.) ir pagal jas perduoto naudotis VNT ploto (-19 proc.) ma\u017e\u0117jimas.
  2019 m. taip pat ma\u017e\u0117jo ir trumpalaiki\u0173 (iki 1 met\u0173 ir iki 5
  met\u0173) panaudos sutar\u010di\u0173 skai\u010diaus (atitinkamai -23 proc. ir
  -41,5 proc.) ir pagal jas perduotas VNT plotas (atitinkamai -28 proc. ir -87,5 proc.).\\n\\nNeterminuot\u0173
  panaudos sutar\u010di\u0173 skai\u010diaus ir pagal jas perduoto VNT ploto ma\u017e\u0117jim\u0105
  l\u0117m\u0117 2019 m. \u012fgyvendinta \u0160MSM inicijuota profesinio mokymo sistemos
  pertvarka, kurios pagrindu \u0160MSM profesinio mokymo \u012fstaigoms tiesiogiai
  patik\u0117jimo teise valdyti perdav\u0119 VNT objektus, kuriuose profesinio mokymo
  \u012fstaigos ilg\u0105 laik\u0105 naudojos panaudos pagrindais. Neterminuot\u0173
  panaudos sutar\u010di\u0173 skai\u010diaus ir pagal jas perduoto VNT ploto ma\u017e\u0117jim\u0105
  atsakaitiniais metais l\u0117m\u0117 ir \u0161i\u0173 sutar\u010di\u0173 nutraukimas
  su K\u016bno kult\u016bros ir sporto departamento prie LRV valdom\u0173 29 VNT objekty
  (bendras plotas \u2013 22 t\u016bkst. kv. metr\u0173) naudotojais (\u012fvairiais
  aeroklubais).\\n\\nTrumpalaiki\u0173 (iki 1 met\u0173 ir iki 3 met\u0173) panaudos
  sutar\u010di\u0173 skai\u010diaus ir pagal jas perduoto VNT ploto ma\u017e\u0117jim\u0105
  taip pat l\u0117m\u0117 auk\u0161\u010diau min\u0117ta profesinio mokymo sistemos
  pertvarka, d\u0117l kurios vien \u0160MSM patik\u0117jimo teise valdomuose objektuose
  (d\u0117l patik\u0117jimo teises \u012f panaudos pagrindais naudotus VNT objektus
  perdavimo profesinio mokymo \u012fstaigoms) trumpalaiki\u0173 panaudos sutar\u010di\u0173
  skai\u010dius i\u0161 viso suma\u017e\u0117jo 173 sutartimis, o pagal jas perduotas
  plotas i\u0161 viso suma\u017e\u0117jo 88,6 t\u016bkst. kv. metr\u0173. Atkreiptinas
  d\u0117mesys, kad nors iki 3 met\u0173 trukm\u0117s panaudos sutar\u010di\u0173
  skai\u010dius atsakaitiniais metais ma\u017e\u0117jo, ta\u010diau pagal jas perduotas
  plotas reik\u0161mingai i\u0161augo. Remiantis VTIPS duomenimis, pagrindin\u0117
  prie\u017eastis, l\u0117musi \u0161\u012f pokyt\u012f, \u2013 iki 3 met\u0173 trukm\u0117s
  panaudos sutar\u010di\u0173 skai\u010diaus ir pagal jas perduoto ploto (+282 t\u016bkst.
  kv. metr\u0173) i\u0161augimas SAM valdomuose VNT objektuose.\\n\\nIki 5 met\u0173
  trukm\u0117s panaudos sutar\u010di\u0173 poky\u010dius l\u0117m\u0117 ne tik min\u0117ta
  profesinio mokymo sistemos pertvarka, bet ir poky\u010diai, susij\u0119 su SAM valdomais
  VNT objektais: 2019 m. taip pat reik\u0161mingai ma\u017e\u0117jo \u0161i\u0173
  objekt\u0173 5 met\u0173 trukm\u0117s panaudos sutar\u010di\u0173 skai\u010dius
  bei pagal jas perduotas VNT plotas. D\u0117l min\u0117t\u0173 prie\u017eas\u010di\u0173
  \u0161ios trukm\u0117s panaudos sutar\u010di\u0173 skai\u010dius suma\u017e\u0117jo
  144 sutartimis, o pagal jas perduotas VNT plotas ma\u017e\u0117jo net 377,2 t\u016bkst.
  kv. metr\u0173.\\n\\nMaksimalaus panaudos laikotarpio (iki 20 met\u0173) sutar\u010di\u0173
  skai\u010diaus (+35 proc.) ir pagal jas perduoto VNT ploto (+44 proc.) augimas sietinas
  su s\u0117kmingai \u012fgyvendinamos CTV reformos rezultatais. Perdavus VNT valdyti
  CTV, su buvusi\u0173 turto valdytojas yra sudaromos naujos, da\u017eniausiai maksimalaus
  laikotarpio (iki 20 m.) panaudos sutartys, taip pat yra per\u017ei\u016brimos ir,
  jei reikia, perra\u0161omos ir esamos panaudos sutartys su kitais VNT naudotojais,
  besinaudojan\u010diais CTV perduodamais VNT objektais. Remiantis VTIPS duomenimis,
  maksimalios (iki 20 m.) trukm\u0117s panaudos sutar\u010di\u0173, sudaryt\u0173
  V\u012e Turto banko ir \u012fvairi\u0173 valstyb\u0117s \u012fstaig\u0173, skai\u010dius
  per metus i\u0161augo daugiau nei 50 proc. (nuo 759 iki 1 152), o pagal \u0161ias
  sutartis perduotas VNT plotas padid\u0117jo beveik 60 proc. (nuo 261 iki 413 t\u016bkst.
  kv. metr\u0173).\\n\\n---\\n\\n\\\\(^{12}\\\\) Neterminuotos panaudos sutartys,
  kuri\u0173 galiojimo terminas ilgesnis nei 20 met\u0173 (skai\u010diuojant nuo 2016-12-31),
  traktuojamos kaip neterminuotos.\\n\\n2.2.2. VNT nuoma\\n\\nAtaskaitinius metais
  i\u0161nuomoto VNT\\\\(^{13}\\\\) plotas, palyginti su 2018 m., kito ne\u017eymiai
  (-0,4 proc.), vir\u0161ijo 0,3 mln. kv. metr\u0173 ir sudar\u0117 vos 3 proc. viso
  valstybei nuosavyb\u0117s teise priklausan\u010dio NT ploto.\\n\\nU\u017e VNT nuom\u0105
  gautas metinis nuomas mokes\u010dis ma\u017e\u0117jo (-6,5 proc.) trejus metus i\u0161
  eil\u0117s ir 2019 m. buvo 5,35 mln. eur\u0173.\\n\\n| Metai | I\u0161nuomoto VNT
  bendras plotas (mln. m\u00b2) | Gautas metinis nuomas mokes\u010dis (mln. \u20ac)
  |\\n|-------|--------------------------------------|----------------------------------------|\\n|
  2019  | 0,303 -0,4 %                         | 5,35 -6,5 %                            |\\n|
  2018  | 0,304                                | 5,72                                   |\\n|
  2017  | 0,294 +3,4 %                         | 6,55 -12,7 %                           |\\n\\nLabiausiai
  ataskaitiniu laikotarpiu kito kult\u016bros (-13,4 t\u016bkst. kv. metr\u0173) ir
  administracin\u0117s (-11,4 t\u016bkst. kv. metr\u0173) paskirties i\u0161nuomoto
  VNT plotas. Kult\u016bros paskirties i\u0161nuomoto VNT ploto ma\u017e\u0117jim\u0105
  l\u0117m\u0117 patikslinti Kai\u0161iadori\u0173 technologij\u0173 ir verslo mokyklos
  ir Vilniaus universiteto i\u0161nuomoto ploto duomenys VTIPS. Da\u017eniausiai i\u0161nuomoto
  VNT ploto korekcij\u0173 poreik\u012f lemia nurodytas neteisingas i\u0161nuomotas
  VNT objekto stogo plotas, skirtas telekomunikacij\u0173 antenai sumontuoti: pasitaiko,
  kad VNT valdytojai antenos nuomai nurodo vis\u0105 pastato plot\u0105, nors antena
  teuziima, pavyzd\u017eiui, vos 1 kv. metro plot\u0105. Kita prie\u017eastis \u2013
  valandin\u0117 mokymo \u012fstaig\u0173 sporto sali\u0173 nuoma, kuri NTR yra registruojama,
  kiekvienam nuomininkui priskiriant vis\u0105 pastato plot\u0105, ir d\u0117l to
  taip pat nepagr\u012fstai padidinamas i\u0161nuomoto VNT plotas. Kad min\u0117t\u0173
  i\u0161nuomoto VNT ploto netikslum\u0173 neb\u016bt\u0173, b\u016btinos VTIPS duomen\u0173
  rankin\u0117s korekcijos. Administracin\u0117s paskirties i\u0161nuomoto VNT ploto
  ma\u017e\u0117jim\u0105 l\u0117m\u0117 EiM valdyto 4,4 t\u016bkst. kv. metr\u0173
  ploto administracinio pastato, esan\u010dio K. Petrausko g. 26, Kaune, perdavimas
  patik\u0117jimo teise valdyti \u0161io pastato ilgame\u010diam naudotojui V\u0161\u012e
  Kauno moksli\u0173 ir technologij\u0173 parkei. 2019 m. i\u0161nuomoto VNT ploto
  poky\u010diui \u012ftakos taip pat tur\u0117jo ir Vilniaus universiteto valdyto
  8,8 t\u016bkst. kv. metr\u0173 ploto administracinio pastato, esan\u010dio V. A.
  Grai\u010di\u016bno g. 8\\\\(^{14}\\\\), Vilniuje, \u012ftraukimas \u012f Vilniaus
  universiteto kapital\u0105.\\n\\nGamybos ir sand\u0117liavimo (+7,2 t\u016bkst.
  kv. metr\u0173) paskirties i\u0161nuomoto VNT ploto augim\u0105 2019 m. l\u0117m\u0117
  Kauno miesto savivaldyb\u0117s patik\u0117jimo teise valdom\u0173 3 sandeli\u0173
  (bendras plotas 4,8 t\u016bkst. kv. metr\u0173) i\u0161nuomojimas, taip pat 4,3
  t\u016bkst. kv. metr\u0173 gamybos ir sand\u0117liavimo paskirties i\u0161nuomoto
  TB patik\u0117jimo teise valdomo VNT ploto padid\u0117jimas (did\u017eiausias i\u0161nuomotas
  objektas \u2013 3,2 t\u016bkst. kv. metr\u0173 plot\u0105 u\u017emantis gamybos
  ir sand\u0117liavimo paskirties pastat\u0173 kompleksas, esantis Kaune, Lamp\u0117d\u017ei\u0173
  g.). Gyvenamosios (+4,8 t\u016bkst. kv. metr\u0173) paskirties i\u0161nuomoto VNT
  ploto augim\u0105 taip pat l\u0117m\u0117 \u0161ios paskirties TB valdom\u0173 objekt\u0173
  i\u0161nuomoto\\n\\n---\\n\\n\\\\(^{13}\\\\) Valstyb\u0117s turto valdytojo funkcijoms
  vykdyti nenaudojamas VNT teis\u0117s akt\u0173 nustatyta tvarka gali b\u016bti i\u0161nuomotas,
  jeigu i\u0161nuomoto VNT nereikia kitam vie\u0161ojo sektoriaus subjektui arba jeigu
  jis n\u0117ra skirtas gynybai ar nacionalinio saugumo tikslams.\\n\\n\\\\(^{14}\\\\)
  VTIPS duomenimis, min\u0117to turto (ir visos teritorijos) dabartine savinink\u0117
  \u2013 Ilgamet\u0117 \u0161io turto naudotoja UAB \u201eThermo Fisher Scientific
  Baltics\u201c.\\n\\nploto padid\u0117jimas (+8,3 t\u016bkst. kv. metr\u0173), tai
  pat Kauno technologijos universiteto 2,4 t\u016bkst. kv. metr\u0173 ploto bendrabuolio
  nuoma ir V\u012e Valstybini\u0173 mi\u0161k\u0173 ur\u0117dija valdomo ir i\u0161nuomoto
  gyvenamosios paskirties VNT ploto padid\u0117jimas (+1,8 t\u016bkst. kv. metr\u0173).
  Mokslo paskirties i\u0161nuomoto VNT ploto padid\u0117jim\u0105 (+6,6 t\u016bkst.
  kv. metr\u0173) l\u0117m\u0117 \u0160iauli\u0173 universiteto, Kauno technologijos
  universiteto ir Vytauto Did\u017eiojo universiteto valdom\u0173 VNT objekt\u0173
  i\u0161nuomoto ploto augimas, o taip pat valandin\u0117s sporto sali\u0173 nuomos
  duomen\u0173 pateikimas \u012f VTIPS.\\n\\n![I\u0161nuomotas plotas pagal NT paskirt\u012f,
  t\u016bkst. m\u00b2](image)\\n\\nGauto VNT metinio nuomos mokes\u010dio ma\u017e\u0117jim\u0105
  l\u0117m\u0117 beveik 420 t\u016bkst. eur\u0173 (-30 proc.) suma\u017e\u0117j\u0119s
  administracin\u0117s paskirties VNT nuomos mokestis ir daugiau nei 380 t\u016bkst.
  eur\u0173 (-61 proc.) ma\u017eesnis nuomos mokestis, gautas u\u017e in\u017einerini\u0173
  statini\u0173 nuom\u0105.\\n\\nVNT metinio nuomos mokes\u010dio, gauto u\u017e administracin\u0117s
  paskirties i\u0161nuomot\u0105 VNT, ma\u017e\u0117jim\u0105 l\u0117m\u0117 auk\u0161\u010diau
  min\u0117to 8,8 t\u016bkst. kv. metr\u0173 ploto administracinio pastato, esan\u010dio
  V. A. Grai\u010di\u016bno g. 8, Vilniuje, jtraukimas \u012f Vilniaus universiteto
  kapital\u0105, d\u0117l kurio gautas metinis nuomos mokestis suma\u017e\u0117jo
  beveik 210 t\u016bkst. eur\u0173. Keleri\u0173 met\u0173 administracin\u0117s paskirties
  VNT i\u0161nuomojimo rodikli\u0173 ma\u017e\u0117jimo tendencija koreliuoja ir su
  did\u0117jan\u010diais nereikalingo VNT, \u012fskaitant ir AVNT, pardavimais: vien
  2019 m. buvo parduota per 21,4 t\u016bkst. kv. metr\u0173 administracin\u0117s paskirties
  VNT objekt\u0173 (su priklausiniais) ploto.\\n\\nAtaskaitiniu laikotarpiu ma\u017e\u0117jo
  ir metinis nuomos mokes\u010dis, gautas u\u017e in\u017einerini\u0173 statini\u0173
  nuom\u0105 (-384 t\u016bkst. eur\u0173). \u0160\u012f pokyt\u012f l\u0117m\u0117
  V\u012e Lietuvos oro uostai valdom\u0173 5 in\u017einerini\u0173 statini\u0173,
  u\u017e kuriuos per metus b\u016bdavo gautama apie 438 t\u016bkst. eur\u0173 nuomos
  mokes\u010dio, nuomos sutar\u010di\u0173 pabaiga. I\u0161nuomoti in\u017eineriniai
  statiniai \u2013 tai automobili\u0173 stov\u0117jimo ir kiemo aik\u0161tel\u0117s,
  hidrotechnikos \u012frenginiai, takai (pvz., p\u0117s\u010di\u0173j\u0173), bok\u0161tai
  (pvz., vandens, ap\u017evalgos ir pan.), u\u017etvankos ir pan.\\n\\nAtkreiptinas
  d\u0117mesys, kad dvejus metus i\u0161 eil\u0117s labiausiai augo nuomos mokes\u010dis,
  gautas u\u017e gydymo paskirties VNT nuom\u0105: 2018 m. jis i\u0161augo 368 t\u016bkst.
  eur\u0173 (1,5 kartu), o 2019 m. gydymo paskirties VNT nuomos pajamos ugtel\u0117jo
  dar beveik 300 t\u016bkst. eur\u0173 (+45 proc.). Min\u0117tus poky\u010dius l\u0117m\u0117
  SAM valdom\u0173 ligonin\u0117s patalp\u0173, esan\u010di\u0173 Eiveni\u0173 g.
  2, Kaune, i\u0161nuomojimas (+148 t\u016bkst. eur\u0173) ir esamo i\u0161nuomoto
  SAM valdomo VNT ploto ir nuomos kain\u0173 padid\u0117jimas. Metinis nuomos mokes\u010dis,
  gautas u\u017e gydymo paskirties VNT nuom\u0105, padid\u0117jo beveik 149,5 t\u016bkst.
  eur\u0173 suma.\\n\\nGautas metinis nuomas mokes\u010dis pagal NT paskirt\u012f,
  t\u016bkst. \u20ac\\n\\nMetinio nuomos mokes\u010dio, tenkan\u010dio 1 kv. metriui,
  detal\u0117sne analiz\u0117 pagal NT paskirt\u012f pateikiama 5 priede. 20 did\u017eiausi\u0173
  VNT nuomotoj\u0173 pagal bendr\u0105 i\u0161nuomot\u0105 plot\u0105 ir gauto metinio
  nuomos mokes\u010dio dyd\u012f sara\u0161ai pateikiami 6 ir 7 prieduose.\\n\\n2.2.3.
  Laisvas, valstyb\u0117s funkcijoms vykdyti nenaudojamas VNT\\n\\nLaisvo VNT ploto
  ma\u017e\u0117jimas pastebimas jau trejus metus i\u0161 eil\u0117s. 2019 m. laisvo
  VNT plotas ma\u017e\u0117jo beveik tre\u010diadal\u012f, buvo kiek didesnis nei
  0,1 mln. kv. metr\u0173 ir sudar\u0117 apie 1,1 proc. viso Lietuvoje registruoto
  VNT ploto. Pagrindin\u0117s laisvo ploto ma\u017e\u0117jimo prie\u017eastys yra
  nagrin\u0117jamos \u017eemiau, pateikiant laisvo ploto pasiskirstymo pagal NT paskirt\u012f
  analiz\u0117s rezultatus.\\n\\n| Metai | Laisvos, nenaudojamos VNT (mln. m\u00b2)
  |\\n|-------|-----------------------------------|\\n| 2019  | 0,105 -28,6%                      |\\n|
  2018  | 0,147                             |\\n| 2017  | 0,178 -17,7%                      |\\n\\n2019
  m. VNT objekt\u0173 (pastat\u0173), kuriuose deklaruojamas laisvas plotas, i\u0161
  viso buvo 463, t. y. beveik 17 proc. ma\u017eiau nei 2018 m. 292 VNT objekte deklaruojamas
  laisvas plotas buvo nuo 1 iki 100 kv. metr\u0173. Kitaip tariant, prie beveik 63
  proc. laisvo ploto turin\u010di\u0173 VNT objekt\u0173 (pastat\u0173) nurodytas
  laisvas plotas vidutini\u0161kai buvo ma\u017eesnis nei 31 kv. metras. Vadinas,
  tokius s\u0105lyg\u0173skai ma\u017e\u0173 laisv\u0173 plot\u0173 i\u0161nuomojimas
  ar atidavimas panaudai gali b\u016bti komplikuotas, tod\u0117l laisvas plotas tur\u0117t\u0173
  b\u016bti vertinamas ne pagal bendr\u0105 dyd\u012f, o kiekvieno VNT objekto (pastato)
  atskirai.\\n\\nLabiausiai 2019 m. ma\u017e\u0117jo mokslo (-20 t\u016bkst. kv. metr\u0173),
  gydymo (-9,8 t\u016bkst. kv. metr\u0173) bei transporto ir gara\u017e\u0173 (-6,2
  t\u016bkst. kv. metr\u0173) paskirties VNT laisvas plotas. Min\u0117t\u0173 paskirti\u0173
  laisvo VNT ploto ma\u017e\u0117jim\u0105 lem\u0117 \u012fvairios prie\u017eastys:
  dalis kaip laisvu pa\u017eym\u0117t\u0173 objekt\u0173 buvo perduoti valdyti TB,
  dalies laisv\u0173 plot\u0173 (ypa\u010d mokslo paskirties VNT objektuose) \u017eym\u0117jimas
  nustojavo galioti, kai profesines mokyklas d\u0117l anks\u010diau min\u0117tos reformos
  dalyvaudavo VTIPS procese \u201ePerdavimas patikejimo teise\u201c, kur\u012f sekmingai
  baigus visas ankstesn\u0117s laisvos dalys nustodavo galioti. Kita dalis laisv\u0173
  plot\u0173 likdavo sistemoje kaip galiojan\u010dios d\u0117l netinkamai baigt\u0173
  VTIPS proces\u0173, susijusi\u0173 su VNT i\u0161nuomojimu.\\n\\n---\\n\\n15 Laisvo
  VNT plot\u0105 netraukiami po\u017eym\u012f \u201elaisvas\u201c turintys VNT plotai,
  prie kuri\u0173 VTIPS nurodyti iniciuoti procesai (del j\u0173 perdavimo, i\u0161nuomojimo
  ir pan.). Laisvo VNT ploto apim\u010di\u0173 korekti\u0161kumas ir tikslumas daugiausia
  priklauso nuo VNT valdytoj\u0173 duomen\u0173 \u012f VTIPS pateikimo kokyb\u0117s
  ir valdom\u0173 VNT objekt\u0173 informacijos VTIPS nuolatin\u0117s per\u017ei\u016bros,
  korekcijos ir atnaujinimo.\\n\\nAtlikus detalesn\u0119 laisvo, nenaudojamo VNT analiz\u0119
  paa\u0161k\u0117jo, kad did\u017eiausio laisvo ploto (26 t\u016bkst. kv. metr\u0173)
  valdytoja i\u0161lieka SAM vien d\u0117l Klaip\u0117doje esan\u010dios beveik 24
  t\u016bkst. kv. metr\u0173 ploto gydyklas, kuri 2019 m. buvo pa\u017eym\u0117ta
  kaip laisa, nors i\u0161 VTIPS duomen\u0173 matyti, kad 2020 m. prad\u017eioje gydykl\u0105
  ketinama laikinai neatlygintinai panaudos pagrindais perduoti V\u0160\u012e Klaip\u0117dos
  j\u016brinink\u0173 ligoninei, kuri \u0161iuo objektu naudojos iki \u0161iol.\\n\\nI\u0161samesn\u0117
  VNT laisvo ploto studija parod\u0117, kad gana da\u017enai institucijos nurodo VNT
  plot\u0105 kaip laisv\u0105 i\u0161 ankssto, o procesus inicijuoj\u0105 tik po keleto
  m\u0117nesi\u0173. D\u0117l to, pavyzd\u017eiu, 2019 m. pa\u017eym\u0117tas laisvas
  plotas patenka \u012f 2019 m. laisvo VNT ploto apimt\u012f, nors i\u0161 2020 m.
  inicijuot\u0173 proces\u0173 matyti, kad tam tikras 2019 m. nurodytas kaip laisvas
  plotas i\u0161 tikri\u0173j\u0173 nebuvo laisvas, nes buvo numatytas konkre\u010diems
  panaudos gav\u0117jams ar nuomownikams. Taigi i\u0161 tikri\u0173j\u0173 laisvo,
  nereikalingo valstyb\u0117s funkcijoms vykdyti VNT ploto apimtys yra dar ma\u017eesn\u0117s.\\n\\n2.3.
  Administracin\u0117s paskirties nekilnojamojo turto valdymas, naudojimas ir disponavimas
  juo\\n\\n2.3.1. Administracin\u0117s paskirties VNT ap\u017evalga\\n\\nLietuvoje
  registruoto AVNT objekt\u0173 skai\u010dius ir plotas ma\u017e\u0117jo dvejus metus
  i\u0161 eil\u0117s ir 2019 m. buvo kiek didesnis nei 1,74 mln. kv. metry bei sudar\u0117
  17,6 proc. viso ataskaitiniu laikotarpiu valdyto ir Lietuvoje registruoto VNT ploto.
  Nors AVNT objekt\u0173 skai\u010dius ir valdomas plotas ma\u017e\u0117jo, likutin\u0117
  jo vert\u0117 ir i\u0161laikymo s\u0105naudos ataskaitiniu laikotarpiu ne\u017eymiai
  did\u0117jo.\\n\\n| Metai | Objekt\u0173 skai\u010dius (vnt.) | Valdomas VNT plotas
  (mln. m\u00b2) | Likutin\u0117 vert\u0117 (mln. \u20ac) | S\u0105naudos (mln. \u20ac)
  |\\n|-------|------------------------|-------------------------------|-------------------------|------------------|\\n|
  2019  | 1 871                  | 1,74                          | 691,97                  |
  34,96            |\\n| 2018  | 1 984                  | 1,80                          |
  691,02                  | 34,89            |\\n| 2017  | 2 006                  |
  1,82                          | 714,69                  | 35,97            |\\n\\nAtskir\u0173
  s\u0105naud\u0173 eilu\u010di\u0173 poky\u010diai rodo, kad ataskaitiniu laikotarpiu,
  palyginti su 2018 m., labiausiai, beveik pus-tr\u0117\u010dio karto, did\u0117jo
  kapitalinio remonto (+1,5 mln. eur\u0173) AVNT s\u0105naudos, kurios 2019 m. ir
  l\u0117m\u0117 bendr\u0173 AVNT i\u0161laikymo s\u0105naud\u0173 augim\u0105. Ataskaitiniu
  laikotarpiu taip pat reik\u0161mingiau did\u0117jo ir valymo (+0,7 mln. eur\u0173)
  bei apsaugos (+0,15 mln. eur\u0173) s\u0105naudos.\\n\\n| AVNT i\u0161laikymo s\u0105naudos,
  mln. \u20ac | 2017 m. | 2018 m. | 2019 m. |\\n|---------------------------------|---------|---------|---------|\\n|
  Komunalin\u0117s s\u0105naudos            | 18,99   | 18,58   | 17,26   |\\n| \u0160ildymas                         |
  7,74    | 7,60    | 6,53    |\\n| Elektra                          | 8,80    | 8,65    |
  8,40    |\\n| Vanduo                           | 1,14    | 1,11    | 1,11    |\\n|
  Kitos komunalin\u0117s s\u0105naudos      | 1,30    | 1,21    | 1,22    |\\n| Remonto
  s\u0105naudos                 | 6,78    | 6,27    | 7,22    |\\n| Einamasis remontas               |
  5,75    | 5,19    | 4,61    |\\n| Kapitalinis remontas             | 1,03    | 1,07    |
  2,61    |\\n| Eksplotavimo ir administravimo s\u0105naudos | 10,05 | 9,87 | 10,36
  |\\n| Apsauga                          | 2,32    | 2,22    | 2,36    |\\n| Valymas                          |
  4,85    | 5,08    | 5,77    |\\n| Kitos eksplotavimo ir administravimo s\u0105naudos
  | 2,89 | 2,57 | 2,22 |\\n| Kitos patalp\u0173 i\u0161laikymo s\u0105naudos | 0,16   |
  0,18    | 0,12    |\\n| Patalp\u0173 draudimas (TD)           | 0,12    | 0,14    |
  0,10    |\\n| Patalp\u0173 draudimas (CA)           | 0,035   | 0,037   | 0,02    |\\n|
  i\u0161 viso s\u0105naud\u0173                   | 35,97   | 34,89   | 34,96   |\\n\\nKaip
  ir ankstesniais ataskaitiniais metais, brangiausiai valstybei kainavo administracin\u012f
  pastat\u0173 kapitalinio remonto dabai, kuri\u0173 1 kv. metro s\u0105naudos ataskaitiniu
  laikotarpiu buvo didesn\u0117s nei 180 eur\u0173\\\\(^{16}\\\\), t. y. beveik daugiau
  kaip pustre\u010dio karto didesn\u0117s nei 2018 m. \u0160io AVNT kapitalinio remonto,
  tenkan\u010dio 1 kv. metrui, did\u0117jimo prie\u017eastys \u2013 jau nagrin\u0117tos
  Ataskaitoje: tai pavieni\u0173 administracini\u0173 paskirties VNT objekt\u0173
  kapitalini\u0173 remont\u0173, atlikt\u0173 2019 m., s\u0105naudos. Pavyzd\u017eiu,
  Nacionalinio visuomen\u0117s sveikatos centro prie SAM valdom\u0173 3,5 t\u016bkst.
  kv. metr\u0173 administracini\u0173 patalp\u0173, esan\u010di\u0173 Kalvarij\u0173
  g. 153, Vilniuje, kapitalinis remontas, kuris i\u0161 viso kainavo beveik 1,8 mln.
  eur\u0173, o 1 kv. metro kaina buvo kiek didesn\u0117 nei 507 eurai.\\n\\n2019 m.
  taip pat ne\u017eymiai (nuo 0,03 iki 0,6 euro u\u017e 1 kv. metr\u0105) brango ir
  administracini\u0173 pastat\u0173 s\u0105naudos u\u017e suvartot\u0105 vanden\u012f
  (+0,03 euro, arba +3,7 proc.), elektr\u0105 (+0,2 euro, arba +3,4 proc.), apsaugas
  (+0,2 euro, arba +8,8 proc.) ir valymo (+0,6 euro, arba +10 proc.) paslaugas. Visos
  kitos AVNT 1 kv. metro i\u0161laikymo s\u0105naudos ataskaitiniu laikotarpiu ma\u017e\u0117jo.\\n\\n**AVNT
  i\u0161laikymo s\u0105naudos, tenkan\u010dios 1 m\u00b2**\\n\\n![Graph showing AVNT
  maintenance costs per square meter for 2017, 2018, and 2019]\\n\\n### 2.3.2. Administracin\u0117s
  paskirties VNT panaudojimo efektyvumo rodikliai\\n\\nKaip ir ankstesniu ataskaitiniu
  laikotarpiu, 2019 m. AVNT panaudojimo efektyvumo ap\u017evalgai pasirinkti \u0161ie
  2017 m. finans\u0173 ministro patvirtinti AVNT efektyvumo rodikliai\\\\(^{17}\\\\):\\n\\n1.
  Bendras plotas, tenkantis vienam darbuotojui. Normin\u0117 reik\u0161m\u0117 \u2013
  28 kv. metrai.\\n2. Kabinetinis plotas, tenkantis vienam darbuotojui. Normin\u0117
  reik\u0161m\u0117 \u2013 10 kv. metr\u0173.\\n3. Administracinio VNT bendros i\u0161laikymo
  s\u0105naudos, tenkan\u010dios 1 kv. metrui bendro ploto. Normin\u0117 reik\u0161m\u0117
  \u2013 36 eurai.\\n\\nVertinant AVNT panaudojimo efektyvum\u0105 buvo analizuoti
  CTV perduoti administracin\u0117s paskirties VNT objektai, kuriuos CTV vald\u0117
  visus 2019 m. Did\u017eiausias efektyvumas buvo pasteb\u0117tas t\u0173 VNT objekt\u0173,
  kuriuos vald\u0117 teritorin\u0117s Valstybin\u0117s mokes\u010di\u0173 inspekcijos
  ir 2018 m. viduryje perdav\u0117 valdyti CTV. Detaliai rodikli\u0173 analizei pasirinkti
  \u0161ie buv\u0119 Valstybini\u0173 mokes\u010di\u0173 inspekcij\u0173 AVNT objektai:\\n\\n1.
  3 796,72 m\u00b2 administracinis pastatas (L. Petraci\u016b\u010diaus a. 2, Naujoji
  Akmen\u0117)\\n2. 1 115,8 m\u00b2 administracinis pastatas (J. Jablonskio g. 30,
  Anyk\u0161\u010diai)\\n3. 921,76 m\u00b2 administracinis pastatas (Livonijos g.
  10, Joni\u0161kis)\\n4. 900,59 m\u00b2 administracinis pastatas (K\u0119stu\u010dio
  g. 2, \u0160ilut\u0117)\\n5. 874,16 m\u00b2 administracinis pastatas (Vytauto Did\u017eiojo
  g. 37, Pakruojis)\\n\\n---\\n\\n\\\\(^{16}\\\\) VNT i\u0161laikymo s\u0105naudos,
  tenkan\u010dios 1 kv. metrui, apskai\u010diuotos pagal t\u0105 naudojam\u0105 VNT
  plot\u0105, kurio s\u0105naudos buvo pateiktos VTIPS.\\n\\n\\\\(^{17}\\\\) Lietuvos
  Respublikos finans\u0173 ministro 2017 m. vasario 23 d. \u012fsakymas Nr. 1K-65
  \u201eD\u0117l Administracin\u0117s paskirties nekilnojamojo turto panaudojimo efektyvumo
  rodikli\u0173 ir apsir\u016bpinimo administracin\u0117s paskirties nekilnojamoju
  turtu, reikaling\u0173 veikl\u0173 vykdymo ir valstybiniems funkcijoms \u012fgyvendinti,
  normatyv\u0173 nustatymo\u201c.\\n\\n6. 649,7 m\u00b2 administracinis pastatas (Vytauto
  g. 75, Palanga)\\n7. 526,32 m\u00b2 \u012fstaiga (Vytauto g. 10, Lazdijai)\\n8.
  522,32 m\u00b2 \u012fstaiga (Vilniaus al. 2-31, Druskini\u0161kiai)\\n9. 496,4 m\u00b2
  \u012fstaiga (Vilniaus g. 44-1, Mol\u0117tai)\\n10. 309,52 m\u00b2 administracinis
  pastatas (Vasario 16-osios g. 21, Garg\u017edai)\\n\\n\u017demiau pateikiamos apibendrintos
  nurodyt\u0173 AVNT objekt\u0173 efektyvumo rodikli\u0173 faktin\u0117s 2018 m. ir
  2019 m. reik\u0161m\u0117s. Nors tam tikrais atvejais, AVNT objekt\u0105 perdavus
  valdyti CTV, plot\u0173 efektyvumo rodikliai vis dar neatitiko nustatyt\u0173 normini\u0173
  reik\u0161mi\u0173, ta\u010diau visais pateiktais atvejais matyti reik\u0161mingas
  ploto panaudojimo efektyvumo pagerejimas, kai objekt\u0105 valdyti per\u0117m\u0117
  CTV.\\n\\n**Bendras naudojamas administracin\u0117s paskirties NT plotas, tenkantis
  vienam darbuotojui**\\n\\n**Darbuotoj\u0173 skai\u010dius** \u2013 valstyb\u0117s
  \u012fstaigos darbuotoj\u0173, kurie naudojasi administracinio VNT arba i\u0161sinuomoto
  administracin\u0117s paskirties NT objektu, skai\u010dius be darbuotoj\u0173, kurie
  yra valstyb\u0117s \u012fstaigos pareigyb\u0117\u0173 s\u0105ra\u0161e, bet kuriems
  n\u0117ra priskirta darbo vieta kabinetuose.\\n\\nAuk\u0161\u010diau min\u0117t\u0173
  AVNT objekt\u0173 analiz\u0117 parod\u0117, kad naudojamas plotas, tenkantis vienam
  pastato naudotoj\u0173 darbuotojui perdavus objektus CTV, vidutini\u0161kai buvo
  pagerintas nuo 42,2 iki 27,3 kv. metr\u0173. Net 6 analizuojamu AVNT objekt\u0173
  bendro ploto panaudojimo efektyvumas buvo pagerintas iki nustatytos 28 kv. metr\u0173
  normin\u0117s reik\u0161m\u0117s, o 3 objekt\u0173 \u2013 reik\u0161mingai pagerintas
