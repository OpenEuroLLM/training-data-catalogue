  nei 5,55 mln. eur\u0173. 2019 m. daugiau nei 490 t\u016bkst. eur\u0173 (beveik -28
  proc.) taip pat ma\u017e\u0117jo ir i\u0161sinuomoto NT i\u0161laikymo s\u0105naudos.
