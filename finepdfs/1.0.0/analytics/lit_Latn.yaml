  Didelio susib\u016brimo vietose, tokiose kaip mokykla u\u017ekre\u010diam\u0173
  lig\u0173 grei\u010diems i\u0161vengti yra sunku. Vaikai daug bendrauja tarpusavyje,
  begioja, lie\u010dia vienas kit\u0105, dalinasi daiktais, tod\u0117l susidaro palankios
  s\u0105lygos plisti virusams ir bakterijoms. U\u017esikre\u010diame nesitikant elementaros
  higienos: neplaunamos rankos, valgoma neplautos mi\u0161ko ir sodo uogos, vaisiai,
  dar\u017eoves. Vienuos efektyviausi\u0173 b\u016bd\u0173, kaip pa\u0161alinti \u012fvairi\u0173
  infekcij\u0173 suk\u0117l\u0117jus \u2013 plauti rankas. **Tikslas** \u2013 skatinti
  vis\u0105 mokyklos bendruomen\u0119 aktyviai ir reguliariai ripintis savo rank\u0173
  higiena, siekiant suma\u017einti u\u017ekre\u010diam\u0173 lig\u0173, tok\u0173,
  kaip vir\u0161utini\u0173 kvepavim\u0173 tak\u0173 infekcijos, plitim\u0105 mokyklos
  bendruomen\u0117je. **Prie\u017emon\u0117:** \u2713 teorinis\u2013praktinis u\u017esi\u0117mimas.
  *pagal poreiki\u0173, skatinimis vis\u0105 mokyklos bendruomen\u0119 aktyviai ir
  reguliariai ripintis savo rank\u0173 higiena, siekiant suma\u017einti u\u017ekre\u010diam\u0173
  lig\u0173 plitim\u0105 mokyklos bendruomen\u0117je *spalio 15 d. \u2013 Pasauline
  rank\u0173 plovimo diena |\\n\\n| I \u2013 IV sav. | Dantys ir pri\u017ei\u016bra.
  Burnos higiena | Burnos higiena \u2013 vienas i\u0161 dant\u0173 prie\u017ei\u016bros
  b\u016bd\u0173, padedan\u010di\u0173 i\u0161laikyti sveikus dantis. Tinkamai nei\u0161valius
  apma\u0161\u0173 dant\u0173 \u0161epe\u010dieliu, jos sukteleja ir susiformuoja
  dant\u0173 akmenys, kuriuos kaupiasi bakterijos sukelian\u010dios \u012fvairias
  dant\u0173 ligas. Da\u017enos pasekl\u0117s; blogas burnos kvapas, neseteisiskai
  atrodantys dantys, dant\u0173 \u0117duonis bei kitos ligos. **Tikslas** \u2013 supa\u017eindinti
  moksleivius su tinkama burnos higiena, siekiant u\u017ekirsti keli\u0105 \u012fvairioms
  dant\u0173 ligoms. **Prie\u017emon\u0117:** \u2713 teorinis\u2013praktinis u\u017esi\u0117mimas
  su burnos higieniste. | PUG, 1 kl. |\\n\\n| II skv. | Maisto \u0161vaistymas: maistai,
  i\u0161s\u016bkiai, ma\u017einimo b\u016bdai. | Atliekos \u2013 nepageidaujamos
  med\u017eiagos, kurios da\u017eniausiai susidaro d\u0117l \u017emogaus veiklos.
  Jos yra nenaudingos, da\u017enai pavojingos ir neturi ekonomines ar kitos vert\u0117s.
  Ta\u010diau pasaulio mokslininkai tvirtina, kad gamoje n\u0117ra nieko nenaudingo,
  o atliekos tampa tar\u0161os \u0161altiniu, sukeldamos \u012fvairias aplinkos ir
  sveikatos problemas. Europos komisijos duomenimis, per metus i\u0161ne\u0161ama
  apie 20 proc. viso pagaminamo maisto, kuris yradamas i\u0161skiria \u0161iltamamio
  efekta sukelian\u010dias dujas. Norint pa\u017eaboti maisto \u0161vaistymo problem\u0105,
  priemoni\u0173 reikia imti tiek kiekviename tiekimo grandin\u0117s etape \u2013
  nuo augintoj\u0173 iki prekybinink\u0173 ir vartotoj\u0173. Tikslas: supa\u017eindinti
  mokinius su aplinkos tar\u0161os pasekmenimis gamtai ir \u017emogaus sveikatai,
  mokyti racionalios maisto vartojimo kult\u016bros. Priemon\u0117: \u2713 teorinis
  \u2013 praktinis u\u017esi\u0117mimas (\u012fvairi\u0173 pakuo\u010di\u0173 ir maisto
  produkt\u0173 r\u016b\u0161iavimas, naudojant tam priskirtas talpas); * spalio 16
  d. \u2013 Pasaulin\u0117 maisto diena | 4\u20135 kl. |\\n| --- | --- | --- |\\n|
  III skv. | Saugumas \u0161viesoje ir tamsoje. Ar mokame tinkamai d\u0117v\u0117ti
  at\u0161vaitus? | Spartis automobilizacijos augimo tempai ir nuolat did\u0117jan\u010di\u0173
  eismo intensyvumas sukelia vis daugiau kli\u016b\u010di\u0173 u\u017etkrintant saug\u0173
  eism\u0105 Lietuvoje. Visuomen\u0117s supratimas apie eismo kult\u016br\u0105, savitarpio
  pagarb\u0105 ir pagalb\u0105 kitam taip pat dar ne kiekvienam tapo norma. Vis dar
  registruojama daugyb\u0117 eism\u0173 \u012fvyki\u0173 \u012f kuriuos patenka p\u0117s\u010diai.
  Remiantis statistiniais duomenimis, nors paskutiniai penkme\u010di\u0173 pastebimai
  teigiamas \u017euvusi\u0173 p\u0117\u0161i\u0173j\u0173 skaiciaus ma\u017e\u0117jimo
  dinamika, problema i\u0161sileka aktuali. Beveik visi \u017euvusi\u0173j\u0173 netur\u0117jo
  n\u0117 at\u0161vaito, n\u0117 \u017eibinto, n\u0117 jokio kitos \u0161vies\u0173
  atspindin\u010dio ar sklend\u017ean\u010dio daikto. Siekiant suma\u017einti patiriam\u0173
  traum\u0173 ir mir\u010di\u0173 skaici\u0173 d\u0117l nesaugaus p\u0117\u0161i\u0173j\u0173
  elgesio, b\u016btina tinkamai informuoti moksleivi\u0173 apie pagrindines saugaus
  elgesio kelyje taisykles. Tikslas: supa\u017einti vaikus su saugaus elgesio kelyje
  taisykl\u0117mis ir ugdyti j\u0173 supratim\u0105 apie at\u0161vait\u0173 sej\u0117jim\u0105.
  Priemon\u0117: \u2713 teorinis-praktinis u\u017esi\u0117mimas; \u2713 at\u0161vaitai;
  \u2713 stendas. | PUG, 1 kl. |\\n\\n| IV sav. | Traum\u0173 ir su\u017ealojim\u0173
