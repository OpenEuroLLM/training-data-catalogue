  41,7 +36,0 %                             | 513,7 +72,0 %           |\\n\\nArt\u0117jant
  AVNT centralizuavimo pabaigai, centralizuotai valdyti perduoto AVNT portfelis 2019
  m. toliau augo ir pirm\u0105 kart\u0105 sudar\u0117 daugiau nei pus\u0119 V\u012e
  Turto bankas patik\u0117jimo teise valdomo VNT.\\n\\n**2019 m. V\u012e Turto banko
  patik\u0117jimo teise valdomas VNT**\\n\\n- Centralizuotai valdyti perduotas AVNT
  53,3 %\\n- \u012emon\u0117s veikloje naudojamas NT 0,3 %\\n- Nenaudojamas valstyb\u0117s
  funkcijoms ir skirtas parduoti NT 46,4 %\\n- Vie\u0161ajame aukcione parduodamas
  NT 34,2 %\\n- Atnaujinamas NT 6,1 %\\n- Valstyb\u0117s paveld\u0117tas NT 6,1 %\\n\\n\\\\(^{21}\\\\)
  Nekilnojamasis turtas, perduotas V\u012e Turto bankui valdyti, naudoti ir disponuoti
  juo patik\u0117jimo teise ir naudojamas valstyb\u0117s institucij\u0173 ir \u012fstaig\u0173
  funkcijoms atlikti ir veiklai vykdyti.\\n\\n2. V\u012e Turto banko valdomas administracin\u0117s
  paskirties VNT\\n\\n2.1. Administracin\u0117s paskirties VNT perdavimas CTV\\n\\nV\u012e
  Turto bankas, vadovaudamasi Valstyb\u0117s nekilnojamojo turto centralizuoto valdymo,
  naudojimo, disponavimo juo ir naujo, administracin\u0117s paskirties, valstyb\u0117s
  nekilnojamojo turto \u012fsigijimo tvarkos apra\u0161u ir vykdyma centralizuotai
  valdomo valstyb\u0117s turto valdytojo (toliau \u2013 CTV) funkcijas, administracin\u0117s
  paskirties valstyb\u0117s nekilnojamaj\u012f tur\u0105t\u0173 centralizuotai valdyti
  perima etapais, pagal \u012fsigaliojusius Vyriausyb\u0117s nutarimus d\u0117l administracin\u0117s
  paskirties valstyb\u0117s nekilnojamojo turto perdavimo CTV.\\n\\nEtapais perduodamas
  turtas atrenkamas vadovaujantis instituciniu, s\u0105naud\u0173 sutaupymo ar maksimalaus
  panaudojimo principais. Kiekvienas etapas laikomas baigtu, kai V\u012e Turto bankas
  perima Lietuvos Respublikos Vyriausyb\u0117s nutarimu nurodyt\u0105 valstyb\u0117s
  nekilnojamaj\u012f tur\u0105t\u0173 patik\u0117jimo teise valdyti, naudoti ir juo
  disponuoti ir pasira\u0161o su nurodytomis valstyb\u0117s institucijomis ir \u012fstaigomis
  valstyb\u0117s nekilnojamojo turto panaudos sutartis, administracin\u0117s paskirties
  valstyb\u0117s nekilnojamojo turto valdymo ir prie\u017ei\u016bros sutartis, nekilnojamojo
  turto ir jam priskirto \u017eem\u0117s sklypo pri\u0117mimo ir perdavimo aktus.\\n\\nAdministracinio
  turto centralizavimas prad\u0117tas 2015 m. ir tur\u0117t\u0173 b\u016bti baigtas
  2020 m. 2019 m. \u012fgyvendintas penktas etapas i\u0161 \u0161e\u0161i\u0173 ir
  centralizuotai valdomo turto portfelis met\u0173 pabaigoje sudar\u0117 beveik 585
  t\u016bkst. kv. m ploto patalp\u0173.\\n\\nCentralizuotai valdyti perimtino AVNT
  poky\u010dis, t\u016bkst. m\u00b2\\n\\n- **2017 m.**\\n  - Centralizuotai valdyti
  perimto AVNT pokytis: 46,2\\n  - Perimamas centralizuotai valdyti plotas met\u0173
