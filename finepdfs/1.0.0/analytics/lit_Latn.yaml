  Did\u017eiausi objektai: Vilniaus kongres\u0173 centras (rengiamos rangos konkurso
  salygos), Go\u0161tauto g. 11, Vilnius (atliekama galimyb\u0173 studija viso komplekso
  pritaikymui \u012fstaig\u0173 veikai), J\u016bros g. 1/1B, Klaip\u0117da (planuojama
  pritaikyti teismams).\\n\\nV\u012e Turto bankas, patik\u0117jimo teise valdydamas
  administracin\u0117s paskirties valstyb\u0117s nekilnojamaj\u012f tur\u0105, teikia
  VNT valdymo ir prie\u017ei\u016bros paslaugas, kurias planuoja pl\u0117sti ir kurioms
  priskirina:\\n\\n- sutar\u010di\u0173 su paslaug\u0173 (draudimo, apsaugos, valymo,
  teritorijos prie\u017ei\u016bros) teik\u0117jais sudarymas, administravimas ir vykdymo
  kontrol\u0119;\\n- komunalini\u0173 paslaug\u0173 sutar\u010di\u0173 sudarymas ir
  (arba) administravimas ir \u012fmok\u0173 u\u017e komunalines paslaugas paskirstymas,
  apskai\u010diavimas, \u012fmok\u0173 mokejimo kontrol\u0119;\\n- perduoto VNT fizin\u0117s
  b\u016bkl\u0117s, technin\u0117s prie\u017ei\u016bros, in\u017einerin\u0117s \u012frangos
  ir tinkl\u0173 (\u0161ildymo, vandentiekio ir kanalizacijos, elektros, v\u0117dinimo
  ir kondicionavimo) prie\u017ei\u016bros organizavimas;\\n- patalpose esan\u010di\u0173
  \u012frangos gedim\u0173 \u0161alinimo organizavimas;\\n- kitos su turto valdymu
  ir prie\u017ei\u016bra susijusios paslaugos.\\n\\nDid\u017eiausia nauda didinant
  centralizuotai valdom\u0105 VNT plot\u0105 numatoma d\u0117l centralizuot\u0173
  vykdom\u0173 VNT objekt\u0173 prie\u017ei\u016bros ir eksploatavimo paslaug\u0173
  pirkimo ekonomijos (planuojama, kad tai leist\u0173 sutaupyti iki 10\u201315 proc.
  nekilnojamojo turto eksploatavimo s\u0105naud\u0173), vienod\u0173 turto valdymo
  princip\u0173, kryptingos bendros VNT valdymo strategijos ir naudojamo funkcijoms
  vykdyti ploto optimizavimo.\\n\\nV\u012e Turto bankui per\u0117mus centralizuotai
  valdyti administracin\u0117s paskirties VNT, siekiama, kad institucijos gal\u0117t\u0173:\\n\\n1.
  koncentruotis \u012f tiesiogini\u0173 funkcij\u0173 vykdym\u0105 ir atsisakyti did\u017eiosios
  dalies su \u016bkiu susisijusi\u0173 reikal\u0173 tvarkymo;\\n2. racionaliau panaudoti
  turto plot\u0105, atsisakyti institucij\u0173 funkcijoms vykdyti nereikalingo ploto;\\n3.
  optimizuoti turto i\u0161laikymo s\u0105naudas.\\n\\n### 2.4. V\u012e Turto banko
  valdomo AVNT i\u0161laikymo s\u0105naudos\\n\\nVTIPS duomenimis, V\u012e Turto banko
  patik\u0117jimo teise valdomo AVNT bendros i\u0161laikymo s\u0105naudos 2019 m.
  i\u0161 viso siek\u0117 beveik 8 mln. eur\u0173. 2019 m. VNT i\u0161laikymo s\u0105naud\u0173
  50 proc. did\u0117jim\u0105 l\u0117m\u0117 48 proc. i\u0161aug\u0119s centralizuotam
  valdymui perimtas AVNT plotas.\\n\\n| TB valdomo AVNT i\u0161laikymo s\u0105naudos,
  mln. \u20ac | 2018 m. | 2019 m. |\\n|------------------------------------------|---------|---------|\\n|
