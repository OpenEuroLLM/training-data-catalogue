  za vsak okus\\n- zdravo in aktivno \u017eivljenje\\n- Tr\u017ei\u010d \u2013 malo
  mesto z velikim srcem\\n- Tr\u017ei\u010d \u2013 oaza polnega \u017eivljenja\\n-
  Tr\u017ei\u010d \u2013 prijeten za bivanje in delo\\n- buti\u010dni turisti\u010dni
  biser Slovenije\\n- so\u017eitje med ljudmi in strpnost\\n- ljudem in naravi\\n-
  prijazn ob\u010dina\\n- za mlade (dru\u017eine)\\n- navdihuj\u010de okolje\\n- otro\u0161ki
  direndaj\\n- Tr\u017ei\u010d ZA VSE\\n- visoka kakovost bivanja\\n- zabava\\n- Tr\u017ei\u010danci
