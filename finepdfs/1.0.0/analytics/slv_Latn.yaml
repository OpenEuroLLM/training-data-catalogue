  zanko. Stopnja presnove nara\u0161\u010da od do 0,85 z malim prirastkom. Pri vsaki
  spremembi stopnje presnove z interpolacijo ocenimo 3 X 2 X ) ( 3 A A0 r c \u2212
  in izra\u010dunamo prostornino me\u0161alnega reaktorja. Ra\u010dunanje prekinemo,
