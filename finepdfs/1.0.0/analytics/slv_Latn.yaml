  \u0160tevilo oseb v tem primeru se omeji na enega udele\u017eenca na 10 kvadratnih
  metrov oziroma ve\u010d udele\u017eencev, \u010de gre za osebe iz skupnega gospodinjstva.
  Tudi zunaj mora biti razdalja med udele\u017eenci najmanj 1,5 metra, razen med osebami
  iz skupnega gospodinjstva.\\n\\nPOBO\u017dNOSTI PRVEGA TEDNA\\n\\n\u010cetrtek tega
  tedna je ''prvi v mesecu''. Po ustaljeni navadi pred Najsvetej\u0161im molimo za
  duhovne poklice.\\n\\nV petek \u010dastimo Srce Jezusovo. Pri sv. ma\u0161i in ob
  \u010de\u0161\u010denju SRT izgovarjamo pro\u0161njo: \u00bbUpodobi, Gospod, na\u0161a
  srca po svojem srcu!\u00ab\\n\\nSobota je posve\u010dena Mariji. Ta dan \u0161e
  posebej poudarjamo, kar je izra\u017eeno v ''Zdrava Mariji'': \u00bbBlagoslovljena
  si med \u017eenami.\u00ab\\n\\nPrva nedelja v mesecu je bila nekdaj ''mo\u0161ka
  nedelja''. K spovedi in obhajilu so bili posebej vabljeni mo\u0161ki. Kar je dobro
  in koristno naj ostane.\\n\\nPSMM 2021 SLOVENIJA\\n\\nJULIJ: Prijateljski odnosi
  v dru\u017ebi. Molimo, da bi v konfliktnih situacijah na dru\u017ebenem, gospodarskem
  in politi\u010dnem podro\u010dju delovali kot pogumni in navdu\u0161eni graditelji
  dialoga in prijateljstva.\\n\\nORATORIJ 2021\\n\\nLeto\u0161nji oratorij bo na Polzeli
  potekal od 12. do 16. julija, za\u010del pa se bo v nedeljo, 11.\\n\\njulija, s
  sveto ma\u0161o ob 10. uri. Prijavnice so na voljo ob oznanilih in jih vzemite ter
  vrnite do srede, 7. julija - osebno v \u017eupni\u0161\u010du ali v po\u0161tni
  nabiralnik na \u017eupni\u0161\u010du s prilo\u017eenim prispevkom. Za podrobnej\u0161e
  informacije pokli\u010dite na tel.: 070 910 052 (Erik) ali pi\u0161ite na firstname.lastname@example.org.\\n\\nDUHOVNA
  OBNOVA\\n\\nV gra\u0161\u010dini Novi Klo\u0161ter:\\n\\nza mo\u0161ke\\n\\nv ponedeljek,
  28. junija, ob 18. uri, za \u017eenske\\n\\nv sredo, 30. junija, ob 18. uri.\\n\\n\u017dUPNIJSKA
  PISARNA\\n\\n\u017dupnijska pisarna je odprta vsak torek od 9. do 11. ure za sre\u010danje
  z eno osebo ali eno dru\u017eino. Stvari je mogo\u010de urediti tudi po svetih ma\u0161ah.\\n\\nSKRB
  ZA CERKEV\\n\\n\u010ci\u0161\u010denje in kra\u0161enje cerkve: Polzela II.\"",
