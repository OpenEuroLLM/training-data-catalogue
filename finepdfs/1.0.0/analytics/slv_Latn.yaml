  OB\u010cINSKEGA PODROBNEGA PROSTORSKEGA NA\u010cRTA ZA UEP ME 51 (DEL) (ID 3978)\\n\\n1.
  Podatki o vlogi\\n\\nMinistrstvo za kulturo (v nadaljnjem besedilu: Ministrstvo)
  je dne 22. 5. 2024 prejelo dopis pripravljavca prostorskega akta URBI d.o.o. \u0161t.
  \u0161t. 24-114-2350, s katerim je bilo pozvano k izdaji mnenja na osnutek Ob\u010dinskega
  podrobnega prostorskega na\u010drta za EUP ME 51 (del) v Ob\u010dini Menge\u0161
  (v nadaljnjem besedilu: osnutek OPPN za EUP ME 51 (del). Ministrstvo je mnenje izdalo
  z dopisom \u0161t. 35012-37/2024-3340-10 z dne 4. 6. 2024. V njem je predlagalo
  nekaj redakcijskih popravkov besedila 30. \u010dlena (ohranjanje kulturne dedi\u0161\u010dine)
  in, da se zaradi zagotavljanja ustrezne strokovne obravnave za intenzivno ozelenitev
  vzhodnega robu obmo\u010dja OPPN ME 51 (del) z grmovnato vegetacijo doda obvezo
  izdelave na\u010drta krajinske arhitekture.\\n\\nMinistrstvo je dne 1. 7. 2024 prejelo
  dopis pripravljavca prostorskega akta URBI d.o.o. \u0161t. \u0161t. 24166-2350,
  s katerim je bilo pozvano k izdaji dopolnjenega mnenja na osnutek Ob\u010dinskega
  podrobnega prostorskega na\u010drta za EUP ME 51 (del) v Ob\u010dini Menge\u0161
  (v nadaljnjem besedilu: osnutek OPPN za EUP ME 51 (del). Prilo\u017eene so bile
  dodatne obrazlo\u017eitve in utemeljitve ter dopolnjen odlok o OPPN za EUP ME 51
  (del) (pripravil URBI d.o.o., junij 2024).\\n\\nT: 01 369 59 00\\n\\nF: 01 369 59
  01\\n\\nE: email@example.com www.mk.gov.si\\n\\nDOKUMENT JE ELEKTRONSKO PODPISAN!\\n\\nPodpisnik:
