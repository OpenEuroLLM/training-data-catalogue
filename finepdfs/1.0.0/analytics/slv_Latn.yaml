  POSTAVKE PP 150060, PP 150061, PP 150062 IN PP 150063**\\n\\n**OPOLNOMO\u010cENJE
  CILJNIH SKUPIN .................................................................
  (2.500.000 EUR)**\\n\\nSofinanciranje programa Zdrav \u017eivljenjski slog omogo\u010da
  osnovno\u0161olskim u\u010dencem vsaj dve dodatni brezpla\u010dni uri \u0161portne
  dejavnosti na teden, kar jim poleg ur \u0161portne vzgoje v okviru rednega u\u010dnega
  na\u010drta zagotavlja eno uro \u0161portne vadbe na dan. Pestrost programa omogo\u010da
  u\u010dencem, da spoznajo najmanj 15 razli\u010dnih \u0161portnih panog, kar je
  poleg strokovnega vodenja programa zagotovo velika motivacija za vklju\u010ditev
  in dobra podlaga za oblikovanje zdravega \u017eivljenjskega sloga v smeri odpravljanja
  posledic negativnih vplivov sodobnega na\u010dina \u017eivljenja. Program ima tudi
  dolgoro\u010dne u\u010dinke na naslednja podro\u010dja: zmanj\u0161evanje socialne
  izklju\u010denosti, zmanj\u0161evanje neenakosti v zdravju, prepoznavanje pozitivnega
  vpliva na zdravje, zmanj\u0161evanje brezposelnosti, doseganje u\u010dinkov, ki
  jih zastavljajo smernice EU na podro\u010dju telesne dejavnosti za zdravje, ipd.\\n\\n**PRORA\u010cUNSKE
  POSTAVKE PP 150044, PP 150045, PP 150046 IN PP 150047**\\n\\n**IZBOLJ\u0160ANJE
  KOMPETENC IN SPODBUJANJE PRO\u017dNIH OBLIK U\u010cENJA .................................................................
  (2.390.000 EUR)**\\n\\n**USPOSABLJANJE STROKOVNIH DELAVCEV V \u0160PORTU:**\\n\\nSofinancirali
  se bodo ukrepi za izbolj\u0161anje kompetenc zaposlenih glede na potrebe trga dela,
  ki bodo usmerjeni v regionalno razpr\u0161eno izvajanje programov usposabljanja
  razli\u010dnih nacionalnih pano\u017enih \u0161portnih zvez, potrjenih s strani
  Strokovnega sveta RS za \u0161port oz. akreditacijskega organa, ter v prenovo teh
  programov. Zaposlenim se bo zagotovilo pridobivanje znanj in kompetenc, ki so nujne
  zaradi potreb posameznih delovnih mest, do katerih prihaja zaradi nove oz. spremenjene
  \u0161portne opreme in orodij, tehnike izvajanja trena\u017enega procesa in procesa
  rehabilitacije, didakti\u010dnih pripomo\u010dkov idr.\\n\\nRAZVOJ KADROV V \u0160PORTU:\\n\\nV
  okviru projekta Razvoj kadrov v \u0161portu se bodo sofinancirali ukrepi za odpravo
  razkoraka med pridobljenimi znanji in potrebami trga dela, ki bodo usmerjeni v doseganje
  sinergij med razvojem mlaj\u0161ega vrhunskega kadra na podro\u010dju \u0161porta
  in uveljavljenih strokovnjaki (trenerji), v spodbujanje razvoja dvojne kariere vrhunskih
  \u0161portnikov in njihovega bolj usmerjenega in \u00bbmehkega\u00ab prehoda iz
  vrhunske tekmovalne kariere v kariero \u0161portnih strokovnjakov pri nadaljnjem
  razvoju \u0161porta v Sloveniji ter v povezovanje znanstveno-raziskovalno delo na
  podro\u010dju \u0161porta s strokovnim delom vrhunskih trenerjev v praksi in tako
  omogo\u010diti neposreden prenos spoznanj in novega znanja v njihovo neposredno
  delo, kakor tudi rast in razvoj kadrov, ki delajo z mlaj\u0161imi starostnimi kategorijami.\\n\\nPRORA\u010cUNSKE
  POSTAVKE PP 150040, PP 150041, PP 150042 IN PP 150043\\n\\nZNI\u017dANJE BREZPOSELNOSTI
  MLADIH ......................................................... (600.000 EUR)\\n\\nSofinanciranje
  programa Mladi za mlade omogo\u010da zaposlovanje mladih diplomantov \u0161portne
  smeri za organiziranje, izvajanje in spremljanje telesne dejavnosti v poklicnih
  in strokovnih srednjih \u0161olah ter visoko\u0161olskih zavodih, v okviru programov
  dodatnih ur \u0161portne vzgoje na teh institucijah. Gre za ukrep, ki lahko udejanja
  cilje tako spodbujanja kot izvajanja redne telesne dejavnosti za zdravje, vklju\u010devanja
  mladih na trg dela preko zaposlovanja mladih diplomantov s podro\u010dja \u0161porta,
  doseganje u\u010dinkov, ki jih zastavljajo smernice EU na podro\u010dju telesne
  dejavnosti za zdravje, zmanj\u0161evanje socialne izklju\u010denosti ter dvig kakovostne
  ravni \u017eivljenja prebivalcev Slovenije.\\n\\nII. \u0160PORTNA INFRASTRUKTURA\\n\\nPRORA\u010cUNSKA
  POSTAVKA 222010\\n\\nINVESTICIJE V \u0160PORTNO INFRASTRUKTURO ...........................................(800.000
  EUR)\\n\\nV okviru prora\u010dunske postavke se sofinancira z razpisom izbrano \u0161portno
  infrastrukturo v lasti lokalnih skupnosti, sofinancira nakup in ureditev zemlji\u0161\u010d
  v Nordijskem centru Planica, sofinancira vzdr\u017eevalna dela v servisnem objektu
  Kavka ter ureditev depoa za potrebe Muzeja \u0161porta.\\n\\nJAVNA SLU\u017dBA JAVNEGA
  ZAVODA \u2013 \u017d\u0160RS PLANICA\\n\\nZ letnim programom \u0161porta v Republiki
  Sloveniji za leto 2017 so, v skladu s 5. \u010dlenom Sklepa o ustanovitvi javnega
  zavoda Zavod za \u0161port Republike Slovenije Planica (sklep \u0161t. 01403-75/2009/9),
  sprejetega na 33. Seji Vlade Republike Slovenije, dne 24. 6. 2009 dolo\u010deni
  naslednji programi, za katere obstaja javni interes in se za njihovo izvajanje zagotavljajo
  sredstva v dr\u017eavnem prora\u010dunu Direktorata za \u0161port za leto 2017 ter
  jih kot javno slu\u017ebo izvaja Javni zavod \u017d\u0160RS Planica:\\n\\n1. Programi
  prostoti\u010dne \u0161portne vzgoje otrok in mladine (\u00bbMali son\u010dek\u00ab,
  \u00bbZlati son\u010dek\u00ab, \u00bbCiciban planinec\u00ab, \u00bbMladi planinec\u00ab,
  \u00bbKrpan\u00ab, \u00bb\u0160olska \u0161portna tekmovanja\u00ab, u\u010denje
  plavanja - \u00bbNau\u010dimo se plavati\u00ab, programi v po\u010ditnicah in pouka
  prostih dnevnih - \u00bbHura prosti \u010das\u00ab). V dr\u017eavnem prora\u010dunu
  2017 se zagotovi 588.000 EUR \u2013 iz PP 561910\\n\\n2. Zalo\u017eni\u0161ka dejavnost
  v \u0161portu. V dr\u017eavnem prora\u010dunu 2017 se zagotovi 11.000 EUR \u2013
  PP 715910.\\n\\n3. Informatika v \u0161portu (zbiranje in dajanje podatkov za potrebe
  informatike v \u0161portu, dograjevanje aplikacij): v dr\u017eavnem prora\u010dunu
  2017 se zagotovi do 120.000 EUR. Ta sredstva bodo namenjena tudi za izpopolnitev
  aplikacij za podro\u010dje \u0161porta \u2013 iz PP 715910\\n\\n4. Za projekte Muzeja
  \u0161porta se v dr\u017eavnem prora\u010dunu 2017 zagotovi 12.000 EUR \u2013 iz
  PP 715910\\n\\n5. Za delovanje javnega zavoda Z\u0160RS Planica, vezano na to\u010dki
  1. in 2., usklajeno z letnim delovnim na\u010drtom zavoda, ki ga sprejme svet zavoda
  Z\u0160RS Planica, se v dr\u017eavnem prora\u010dunu za leto 2017 zagotovi do 431.600
  EUR \u2013 iz PP 715910\\n\\nOBRAZLO\u017dITEV\\n\\nIz dr\u017eavnega prora\u010duna
  Republike Slovenije se v prora\u010dunskem letu 2017 za programe \u0161porta zagotovi
  18.177.482 EUR in sicer: 17.377.482 EUR za programske in razvojne naloge in 800.000
  EUR za \u0161portno infrastrukturo, kar je 2.000.000 EUR ve\u010d kot v Letnem programu
