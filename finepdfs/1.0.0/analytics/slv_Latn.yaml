  PROGRAMSKA PRENOVA |\\n\\n2.3 Razvojni izzivi\\n\\nIz socio-ekonomskega profila
  in SWOT/TOWS analize opredeljujemo 9 najpomembnej\u0161ih izzivov razvoja in preobrazbe
  s katerimi se danes soo\u010da ob\u010dina Tr\u017ei\u010d. Gre za zahtevne in kompleksne
  izzive, ki so realni in neizogibni, zato terjajo odgovore in re\u0161itve. Izzivi
  so shematsko prikazani v spodnji sliki. Izzive v nadaljevanju razvojnega na\u010drta
  podrobneje opisujemo ter jih naslavljamo z mo\u017enimi strategijami in naborom
  ukrepov in projektov za naslednje desetletno obdobje.\\n\\nIZZIV 1:\\nOBVLADOVANJE
  DEMOGRAFSKIH GIBANJ\\n\\nIZZIV 2:\\nOBVLADOVANJE IN PODOBA OBMO\u010cIJ V ZATONU\\n\\nIZZIV
  3:\\nPODJETNI\u0160KI AMBIENT ZA NASTAJANJE IN RAST LOKALNIH PODJETIJ (MSP)\\n\\nIZZIV
  4:\\nVALORIZACIJA POTENCIALOV TURIZMA, KMETIJSTVA, NARAVE IN KULTURE\\n\\nIZZIV
  5:\\nRAZDROBLJENOST IN PROSTORSKA PODHRANJENOST PROSTO\u010cASNE PONUDBE\\n\\nIZZIV
