  Kregar.\\n- Tanja Ro\u017eenbergar \u0160ega, kustosinja etnologinja\\n\\nEVIDENTIRANJE
  IN ZBIRANJE GRADIVA:\\n\\n- evidentirano gradivo za stalno postavitev: urarstvo
