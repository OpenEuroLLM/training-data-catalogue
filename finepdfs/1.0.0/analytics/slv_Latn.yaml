  if end do 7     write(6,700) X3 700   format(/,''  Stopnja presnove zaporedja reaktorjev
  Vc1, Vc2 in '', &''Vm je'',f5.2,''.'') stop end\\n```\\n\\nDobljeni rezultati:\\n\\n*********************************************************************
