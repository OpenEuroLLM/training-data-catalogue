  Kam odlo\u017eiti?                                      |\\n|----------------------------------------------|--------------------------------------------------------------------------|----------------------------------------------------|\\n|
  PLASTI\u010cNA EMBALA\u017dA (\u017eivil, \u010distil, sredstev za osebno higieno,
  pralnih sredstev) | Temeljito izpraznite, lahko splo\u0161\u010dite oz. stisnete,
  etilet ni potrebno odstranjevati | V rumeno vre\u010do                                     |\\n|
  STIROPOR                                     | Ni ga potrebno lomiti na manj\u0161e
  kose, zbrati v vre\u010dah                   | V zbirni center, manj\u0161i kosi
  v rumeno vre\u010do        |\\n| TEKSTIL                                      |
  Brez priprave                                                            | V zbirni
  center                                    |\\n| BIOLO\u0160KO RAZGRADLJIVI ODPADKI                 |
  Odlije teko\u010di del                                                         |
  Na kompostni kup ali v rjavi zabojnnik (zelen obrez pa v zbirni center) |\\n| NEVARNI
  ODPADKI                              | Poskrbite, da oznaka, ki ozna\u010duje za
  katero nevarno snov gre, ostane na embala\u017ei | V akciji zbiranja nevarnih odpadkov
  in v zbirni center |\\n| LESENA EMBALA\u017dA                              | Brez
  priprave                                                            | V zbirni center                                    |\\n|
  ELEKTRI\u010cNA OPREMA                            | Brez priprave                                                            |
  V zbirni center ali v akciji zbiranja kosovnih odpadkov |\\n| BATERIJE IN AKUMULATORJI                     |
  Brez priprave                                                            | V zbirni
  center in v akciji zbiranja nevarnih odpadkov |\\n| RA\u010cUNALNI\u0160KA OPREMA                          |
  Brez priprave                                                            | V zbirni
  center                                    |\\n| TV sprejemniki, radijski sprejemniki,
  DVD predvajalniki, mobilni telefoni... | Brez priprave                                                            |
  V zbirni center ali v akciji zbiranja kosovnih odpadkov |\\n| BELA TEHNIKA                                 |
  Brez priprave                                                            | V zbirni
  center ali v akciji zbiranja kosovnih odpadkov |\\n\\nIN KAJ \u0160E SODI V ZABOJNIK
  ZA PREOSTANEK ODPADKOV?\\n\\nOb doslednem upo\u0161tevanju navodil za lo\u010devanje
  odpadkov bo odpadkov, ki sodijo v zabojnik za preostanek komunalnih odpadkov ostalo
  zelo malo.\\n\\nVanj sodijo:\\n- smeti, ki jih pometemo po tleh\\n- napolnjene vre\u010dke
  sesalnikov (lahko jih tudi komposti\\n- ne\u010dista embala\u017ea (v kolikor se
  je ne da o\u010distiti)\\n- razbiti kro\u017eniki, skodelice, kozarci\\n- plenice,
  vlo\u017eki, vatirane pal\u010dke\\n- iztrebki malih \u017eivali\\n- kosti\\n- izrabljeni
  \u010devlji\\n- ohlajen pepel (lahko ga tudi kompostirate)\\n- cigaretni ogorki\\n-
  \u017eve\u010dilni gumi\\n- papirnate serviete, papirnate brisa\u010de in papirnati
  rob\u010dki za enkratno uporabo (lahko jih daste na kompostni kup)\\n- izrabljene
  kuhinjske krpe in gobice.\\n\\nNasvet\\nV zabojniku za ostale odpadke bo vedno dovolj
  prostora, \u010de bomo odpadke pravilno lo\u010devali.\\n\\nKONEC TE\u017dAV S PREVELIKO
  TE\u017dO IN PREPOLNIMI ODLAGALI\u0160\u010cI\\n\\nPRETEKLOST PRIHODNOST\\n\\nRAVANJANJE
  Z ODPADNIMI NAGROBNIMI SVE\u010cAMI\\n\\nOd 1.1.2010 je obvezno lo\u010deno zbiranje
  odpadnih nagrobnih sve\u010d na pokopali\u0161\u010dih, zato bo na pokopali\u0161\u010du
  name\u0161\u010den dodaten zabojnik z napisom \u00bbSamo za odpadne nagrobne sve\u010de\u00ab,
  v katerega boste lahko odlagali izklju\u010dno odpadne nagrobne sve\u010de.\\n\\nTudi
  v primeru nagrobnih sve\u010d velja, da je bolje manj kot ve\u010d zato vedno, ko
  se odlo\u010date za nakup nagrobnih sve\u010d pomislite na to:\\n\\n- iz katerega
  materiala je sve\u010da narejena (znak za recikliranje)\\n- da ve\u010dje kot so
  sve\u010de, ve\u010d je na koncu nastalih odpadkov\\n- da ni nujno, da bodo po velikosti
  ve\u010dje sve\u010de gorele dlje, saj je \u010das gorenja odvisen tako od koli\u010dine
  kot od kakovosti voska\\n- elektronske sve\u010de resda gorijo dlje, a vsebujejo
  baterijo, ki je nevarni odpadek in je recikliranje zaradi polnila \u0161e bolj komplicirano
  kot recikliranje obi\u010dajnih PVC sve\u010d\\n- da s pri\u017eiganjem ve\u010d
  sve\u010d na enem grobu ne izkazujemo ve\u010djega spo\u0161tovanja do preminulih
  kot z eno samo sve\u010do\\n- da z izbiro trajne oblike sve\u010de varujete okolje
  in nenazadnje privar\u010dujete.\\n\\nDogorele nagrobn\u0435 sve\u010de ne pozabite
  odlo\u017eiti v zabojnik, ki ima obi\u010dajno napis \\\"Samo za odpadne nagrobne
  sve\u010de\\\", le tedaj bodo reciklirane. Ponudbo na trgu narekuje povpra\u0161evanje
  potro\u0161nikov. \u010ce boste zahtevali okolju prijazne sve\u010de, bodo sve\u010darji
  slej kot prej tradicionalne materiale zamenjali z novimi, okolju prijaznej\u0161imi.\\n\\nZELENI
  NASVETI ZA MANJ ODPADKOV IN VAROVANJE OKOLJA\\n\\nNajbolj\u0161i odpadek je tisti,
  ki sploh ne nastane.\\nIzogibamo se nepotrebni embala\u017ei.\\nIzogibamo se izdelkom
  za enkratno uporabo.\\nIzberemo povratno embala\u017eo.\\nHrane ne zavijamo v odve\u010dno
  folijo ali papir. Uporabimo plasti\u010dne posode za ve\u010dkratno uporabo.\\nV
  trgovino se odpravimo z nakupovalno vre\u010dko za ve\u010dkratno uporabo, vre\u010dko
  ali nakupovalno torbo iz tekstila ali s ko\u0161aro.\\nPodarimo stvari, ki jih ne
  potrebujemo ve\u010d.\\nObdarujmo najbli\u017eje z ekolo\u0161kimi darili.\\n\\nOdgovorno
  kupujemo.\\nNe pretiravamo, kupimo le tisto, kar potrebujemo.\\nKupujemo okolju
  prijazne izdelke, ki so narejeni iz recikliranih materialov oziroma, ki se lahko
  predelajo.\\nIzogibamo se izdelkom, ki vsebujejo nevarne snovi.\\nIzogibamo se uporabi
  pr\u0161il v dozah na potisni plin.\\nKupujemo univerzalna \u010distila, ki so izdelana
  brez nevarnih agresivnih kemikalij.\\n\\nSpoznajmo znake na embala\u017ei:\\n\\n-
  Zelena pika je znak, ki ozna\u010duje, da je embala\u017ea izdelka vklju\u010dena
  v sistem ravnjanja z odpadno embala\u017eo ter da se zbira, ponovno uporabi, reciklira
  ali druga\u010de ustrezno predela.\\n\\n- Znak pre\u010drtan smetnjak na kolesih
  ozna\u010duje, da se mora izdelek odlo\u017eiti lo\u010deno. Ve\u010dinoma se pojavlja
  na elektri\u010dni in elektronski opremi.\\n\\n- Embala\u017ea, na kateri je simbol
  s kro\u017enico, je delno ali v celoti izdelana iz recikliranega materiala.\\n\\n-
  Trikotnik je mednarodni simbol, ki nam pove, da izdelek lahko recikliramo. V sredini
  trikotnika je napisana \u0161tevilka, spodaj pa kratica, ki ozna\u010duje vrsto
  materiala, iz katerega je embala\u017ea narejena. Oznake se nana\u0161ajo na razli\u010dne
  vrste plasti\u010dnih materialov.\\n\\n7 NAJPOGOSTEJ\u0160IH VPRA\u0160ANJ\\n\\n1.
  KAJ JE EMBALA\u017dA?\\nEmbala\u017ea so vsi izdelki iz katerega koli materiala,
  namenjeni temu, da blago ne glede na to, ali gre za surovine ali izdelke, obdajajo
  ali dr\u017eijo skupaj zaradi hranjenja ali varovanja, rokovanja z njim, njegove
  dostave ali predstavitve na poti od embalera do kon\u010dnega uporabnika.\\n\\n2.
  KAJ SE ZGODI \u010cE BODO V RUMENI VRE\u010cI ODLO\u017dENI NEPRIMERNI ODPADKI?\\n\u010ce
  bodo v vre\u010di odlo\u017eeni drugi odpadki, ki se ne uvr\u0161\u010dajo med komunalno
  plasti\u010dno, kovinsko, papirno ali sestavljeno embala\u017eo bo svetovalni nadzornik
  na vre\u010do nalepil nalepko in ozna\u010dili kateri odpadki ne sodijo v rumeno
  vre\u010do. Vsebino rumene vre\u010de bo moral povzro\u010ditelj presortirati, da
  jo bo izvajalec javne slu\u017ebe odpeljal.\\n\\n3. KAKO PRIPRAVITI EMBALA\u017dO
  ZA V RUMENO VRE\u010cO?\\n- embala\u017ea mora biti splo\u0161\u010dena, da se zmanj\u0161a
  volumen, druga\u010de boste vre\u010de prehitro uporabili\\n- embala\u017ea mora
  biti \u010dista, kar pomeni, da mora biti temeljito izpraznjena\\n\\n4. ZAKAJ SO
  VRE\u010cKE PROZORNE?\\nVre\u010dke so namensko prozorne, da je mogo\u010de \u017ee
  vizualno opaziti, kaj je odlo\u017eeno v njih. Zelo pomembno je tudi za smetarje,
  ki na hitro pogledajo in presodijo vsebino v vre\u010dki, \u010de je primerna jo
  vzamejo, v nasprotnem primeru, \u010de je v vre\u010dki je neprimerna vsebina pa
  vre\u010dko pustijo na prevzemnem mestu.\\n\\n5. KAM LAHKO ODLO\u017dIM \u010cASOPISNI
  PAPIR IN STEKLENICE?\\n\u010casopisni papir odlo\u017eite v kartonsko \u0161katlo
  na odjemno mesto ob rumeni vre\u010di na dan odvoza, skladno z urnikom. Stekleno
  embala\u017eo odlo\u017eite v plasti\u010dno posodo ali kartonsko \u0161katlo in
  jo prav tako postavite ob rumeno vre\u010do na tisti dan, ko bodo pobrali stekleno
  embala\u017eo, kar je ozna\u010deno na urniku. Za stekleno embala\u017eo lahko uporabljate
  staro vedro ali drugo plasti\u010dno posodo, saj vam bodo smetarji posodo izpraznili
  in vam jo pustili na odjemnem mestu, da jo boste lahko vedno znova uporabljali za
  zbiranje steklene embala\u017ee.\\n\\n6. KAJ SE BO ZGODILO Z RUMENIMI VRE\u010cAMI
  POTEM, KO JIH BODO SMETARJI ODEPVELJALI?\\nRumene vre\u010de bodo odpeljane v sortirnico,
  kjer jih strojno odprejo in vsebino transportirajo na teko\u010di trak, ob katerem
  so delavci, ki sortirajo embala\u017eo po frakcijah glede na posamezen tip materiala.\\n\\n7.
  ALI IMajo \u0160E KJE V SLOVENIJI ALI V TUJINI SISTEM RUMENIH VRE\u010c ZA LO\u010cENO
  ZBIRANJE ODPADNE EMBALA\u017dE?\\nDa. Ta sistem je uvedlo \u017ee 30 ob\u010din
  v Sloveniji, vsak mesec se pridru\u017eijo nove ob\u010dine. Ugotovitve so namere
  pokazale, da ni mogo\u010de s sistemom zbiralnic (ekolo\u0161kih otokov) zbrati
  zahtevanih koli\u010din odpadne embala\u017ee, kot predvideva zakonodaja. Ker je
  storitev lo\u010denega zbiranja potrebno pribli\u017eati uporabniku, je sistem rumene
  vre\u010de uveden v vseh evropskih dr\u017eavah, tudi v Kanadi in ve\u010djem \u0161tevilu
  Ameri\u0161kih dr\u017eav.\"", "\"GRAF LINEARNE FUNKCIJE\\n\\n1. PONOVIMO\\nLinearna
  funkcija je funkcija s predpisom $f(x) = kx + n$, pri \u010demer sta $k$ in $n$
  iz mno\u017eice $\\\\mathbb{R}$. \u0160tevilo $k$ imenujemo smerni koeficient linearne
  funkcije, \u0161tevilo $n$ je za\u010detna vrednost linearne funkcije.\\n\\n2. Graf
  linearne funkcije je premica.\\nDa lahko nari\u0161emo premico, moramo narisati
  najmanj dve to\u010dki.\\n\\n3. PRIMER_1.\\nGraf linearne funkcije ste \u017ee spoznali
  v 3. tednu dela na daljavo na u\u010dnem listu MEDSEBOJNO ODVISNE KOLI\u010cINE,
  FUNKCIJA in sicer PRIMER2. \u0160e enkrat si ga natan\u010dno preglejte.\\n\\n4.
  PRIMER_2.\\nNari\u0161i graf linearne funkcije $f$ s predpisom $f(x) = 2x + 3$.\\nRe\u0161ujemo
  po korakih 1), 2), 3), ...\\n\\n1) Najprej nari\u0161emo tabelo:\\n\\n| $x$ | $f(x)
  = 2x + 3$ | $(x, y)$ |\\n|-----|-----------------|---------|\\n| 1   | $2 \\\\cdot
  1 + 3 = 5$ | (1, 5) |\\n| 0   | $2 \\\\cdot 0 + 3 = 3$ | (0, 3) |\\n| -1  | $2 \\\\cdot
  (-1) + 3 = 1$ | (-1, 1) |\\n\\n2) Izberemo si najmanj 3 poljubna \u0161tevila. Izbiramo
  iz mno\u017eice celih \u0161tevil $\\\\mathbb{Z}$. Vsaj eno \u0161tevilo naj bo
  negativno.\\n\\n3) Izbrana \u0161tevila vstavljaj v predpis.\\n\\n4) Dobi\u0161
  tri to\u010dke.\\n\\n5) Nari\u0161i koordinatni sistem. Izberi ustrezno enoto. To\u010dke
  upodobi in jih pove\u017ei.\\n\\nZapomni si:\\nGraf linearne funkcije je premica.\\n\\n5.
  PRIMER_3\\n\\nKako ugotovimo, ali neka to\u010dka le\u017ei ali ne le\u017ei na
  grafu neke linearne funkcije?\\n\\nImamo dve mo\u017enosti.\\nLahko preberemo z
  grafa ali pa izra\u010dunamo s pomo\u010djo funkcijskega predpisa.\\n\\na) Preberemo
  z grafa\\n\\nPodan je graf linearne funkcije s predpisom \\\\( f(x) = -3x - 2 \\\\).\\nKatere
  od to\u010dk le\u017eijo in katere ne le\u017eijo na grafu funkcije?\\n\\\\((-2,4)\\\\)
  le\u017ei\\n\\\\((-1,1)\\\\) le\u017ei\\n\\\\((-2,-1)\\\\) ne le\u017ei\\n\\\\((0,-2)\\\\)
  le\u017ei\\n\\nb) Izra\u010dunamo s pomo\u010djo funkcijskega predpisa. Preverili
  bomo za dve to\u010dki.\\n\\n- Ali to\u010dka \\\\( A(-2,4) \\\\) le\u017ei na grafu
  linearne funkcije s predpisom \\\\( f(x) = -3x - 2 \\\\)?\\n\\nKaj pomeni zapis
  \\\\( A(-2,4) \\\\)?\\n\\nIz zapisa razberemo, da je \\\\( x = -2 \\\\) (prva koordinata
  to\u010dke) in \\\\( y = 4 \\\\) (druga koordinata to\u010dke).\\n\\nObe koordinati
  vstavimo v na\u0161 funkcijski predpis in izra\u010dunamo.\\n\\n\\\\[\\nA(-2,4)\\n\\\\]\\n\\n\\\\[\\nf(x)
  = -3x - 2\\n\\\\]\\n\\n\\\\[\\ny = -3x - 2\\n\\\\]\\n\\n\\\\[\\n4 = -3 \\\\cdot
  (-2) - 2\\n\\\\]\\n\\n\\\\[\\n4 = 6 - 2\\n\\\\]\\n\\n\\\\[\\n4 = 4\\n\\\\]\\n\\n...
  leva in desna stran sta enaki, torej to\u010dka A le\u017ei na grafu na\u0161e funkcije\\n\\nAli
  to\u010dka $B(-2, -1)$ le\u017ei na grafu linearne funkcije s predpisom $f(x) =
  -3x - 2$?\\n\\nKaj pomeni zapis $B(-2, -1)$?\\n\\nIz zapisa razberemo, da je $x
  = -2$ (prva koordinata to\u010dke) in $y = -1$ (druga koordinata to\u010dke).\\n\\nObe
  koordinati vstavimo v na\u0161 funkcijski predpis in izra\u010dunamo.\\n\\n$$f(x)
  = -3x - 2$$\\n\\n$$y = -3x - 2$$\\n\\n$$-1 = -3 \\\\cdot (-2) - 2$$\\n\\n$$-1 =
  6 - 2$$\\n\\n$$-1 \\\\neq 4$$\\n\\n... leva in desna stran NISTA enaki, torej to\u010dka
  B NE LE\u017dI na grafu na\u0161e funkcije.\\n\\n6. PRIMER 4**\\n\\nNari\u0161i
  graf funkcije $f(x) = \\\\frac{x}{3} + 2$. Vemo: $\\\\frac{x}{3} = \\\\frac{1}{3}
  \\\\cdot x$\\n\\nVrednosti spremenljivke $x$ izberemo premi\u0161ljenno (ve\u010dkratniki
  \u0161tevila 3), da lahko v izra\u010dunu kraj\u0161amo.\\n\\n$$f(x) = \\\\frac{x}{3}
  + 2$$\\n\\n| $x$ | $y = f(x)$ | $(x, y)$ |\\n|-----|-------------|---------|\\n|
  -3  | $\\\\frac{-3}{3} + 2 = -1 + 2 = 1$ | (-3, 1) |\\n| 0   | $\\\\frac{0}{3} +
  2 = 0 + 2 = 2$ | (0, 2) |\\n| 3   | $\\\\frac{3}{3} + 2 = 1 + 2 = 3$ | (3, 3) |\\n\\nIzberemo
  poljubne ve\u010dkratnike \u0161tevila 3.\\n\\nGraf linearne funkcije je premica.\\n\\nPremica
  je natanko dolo\u010dena z dvema to\u010dkama, zato zadostuje, da dolo\u010di\u0161
  le dve to\u010dki in skozi njiju nari\u0161e\u0161 premico (tretja to\u010dka je
  kontrolna).\\n\\n7. VAJA_1\\n\\nNari\u0161i graf linearne funkcije $f$ s predpisom
  $f(x) = x + 3$.\\n\\n| $x$ | $f(x) = 2x + 3$ | $(x, y)$ |\\n|-----|-----------------|---------|\\n|     |                 |         |\\n|     |                 |         |\\n|     |                 |         |\\n\\n8.
  VAJA_2\\n\\nNari\u0161i graf linearne funkcije $f$ s predpisom $f(x) = 2x - 1$.\\n\\n|
  $x$ | $f(x) = 2x + 3$ | $(x, y)$ |\\n|-----|-----------------|---------|\\n|     |                 |         |\\n|     |                 |         |\\n|     |                 |         |\\n\\n9.
  VAJA_3\\n\\nNari\u0161i graf linearne funkcije $f$ s predpisom $f(x) = -2x - 3$.\\n\\n|
  $x$ | $f(x) = 2x + 3$ | $(x, y)$ |\\n|-----|-----------------|---------|\\n|     |                 |         |\\n|     |                 |         |\\n|     |                 |         |\\n\\n10.
  VAJA_4**\\n\\nNari\u0161i graf linearne funkcije $f$ s predpisom\\n\\n$$f(x) = \\\\frac{1}{2}x
  + 3.$$ \\n\\n| $x$ | $f(x) = 2x + 3$ | $(x, y)$ |\\n|-----|-----------------|---------|\\n|     |                 |         |\\n|     |                 |         |\\n|     |                 |         |\\n\\n11.
  VAJA_5**\\n\\nNari\u0161i graf linearne funkcije $f$ s predpisom\\n\\n$$f(x) = -x
  - \\\\frac{3}{2}.$$ \\n\\n| $x$ | $f(x) = 2x + 3$ | $(x, y)$ |\\n|-----|-----------------|---------|\\n|     |                 |         |\\n|     |                 |         |\\n|     |                 |         |\\n\\n12.
  VAJA_6\\n\\nOdgovori. Svojo odlo\u010ditev utemelji z ra\u010dunom.\\n\\n- Ali le\u017ei
  to\u010dka $A(4, -3)$ na grafu funkcije $f(x) = x - 2$? ____________\\n\\n- Ali
  le\u017ei to\u010dka $B(-2, 1)$ na grafu funkcije $f(x) = 2x + 5$? ____________\\n\\n-
  Ali le\u017ei to\u010dka $A\\\\left(0, -\\\\frac{1}{3}\\\\right)$ na grafu funkcije
  $f(x) = 3x - \\\\frac{1}{3}$? ____________\\n\\n13. VAJA_7\\n\\nEna\u010dbam linearnih
  funkcij pripi\u0161i to\u010dke, ki jim ustrezajo.\\nRe\u0161itve poi\u0161\u010di
  med ponujenimi mo\u017enostmi.\\nStranske ra\u010dune lahko zapisuje\u0161 v zvezek.\\n\\n|
  Ena\u010dba       | To\u010dka   |\\n|--------------|---------|\\n| $f(x) = x +
  6$ |         |\\n| $f(x) = 5x + \\\\frac{1}{2}$ |     |\\n| $f(x) = -x - 8$ |      |\\n|
  $f(x) = -\\\\frac{1}{2}x + 1$ |    |\\n\\n| Ena\u010dba       | To\u010dka   |\\n|--------------|---------|\\n|
  $f(x) = 2x - 3$ |        |\\n| $f(x) = 4x + 1$ |      |\\n| $f(x) = -4x + 2$ |     |\\n|
  $f(x) = \\\\frac{2}{3}x$ |    |\\n\\nT(\u22125, 1)\\nT(1, \u22125) T(\u22121, 6)\\nT(1,
  \u22129) T(\u2212$\\\\frac{1}{4}$, 0)\\nT($\\\\frac{1}{2}$, 3) T(4, \u22121)\\nT(0,
  \u22123) T(\u22129, \u22121)\\nT(\u2212$\\\\frac{3}{2}$, \u22121)\\n\\n14. VAJA_8**_izziv\\n\\nIzpolni
  preglednice in nari\u0161i grafe\\nlinearnih funkcij v isti koordinatni\\nsistem.\\n\\nKaj
  opazi\u0161?\\n\\n| x | $f(x) = 2x$ | (x, y) |\\n|---|-------------|--------|\\n|
  -1 |             |        |\\n| 0  |             |        |\\n| 1  |             |        |\\n\\n|
  x | $f(x) = 2x + 4$ | (x, y) |\\n|---|----------------|--------|\\n| -1 |                |        |\\n|
