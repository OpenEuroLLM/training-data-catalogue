  GLOBALNIH TVEGANJ (PODNEBNIH SPREMEMB, EPIDEMIJ, RECESIJ..)\\n\\nIZZIV 9:\\nUPRAVLJANJE
  RAZVOJA IN PREOBRAZBE\\n\\nSlika 13 9 izzivov razvoja in preobrazbe ob\u010dine
  Tr\u017ei\u010d 2020\\n\\n3 Strategija Tr\u017ei\u010d 2030\\n\\n3.1 Vizija Tr\u017ei\u010d
  2030\\n\\nRazvojna vizija ob\u010dine Tr\u017ei\u010d 2030 predstavlja dolgoro\u010dni
  pogled na \u017eeleno prihodnjo sliko ob\u010dine. Odra\u017ea razmi\u0161ljanja
  ob\u010danov, izra\u017eena v spletni razvojni anketi in usmeritve obstoje\u010dih
  sektorskih programov ob\u010dine ter dr\u017eave. Ob\u010danom, podjetjem in investitorjem
  sporo\u010da pri\u010dakovane spremembe do leta 2030.\\n\\nNova vizija nakazuje
  smele razvojne ambicije Ob\u010dine Tr\u017ei\u010d v smeri preobrazbe prostorske
  in socio-kulturene \u00bbzapu\u0161\u010dine\u00ab industrijskega obdobja v sodobnej\u0161o,
  aktivno in trajnostno naravnano ob\u010dino. Ustvarjamo okolje, ki spodbuja uresni\u010devanje
  podjetni\u0161kih prilo\u017enosti posameznikov in se prilagaja spremenjenemu \u017eivljenjskemu
  slogu. Dana\u0161nje in prihajajo\u010de tr\u017ei\u0161ke generacije so bolj izobra\u017eene
  in zaposlene, pogosto izven ob\u010dine, zato v doma\u010dem prostoru pri\u010dakujejo
  prilagodljive javne storitve, urejeno bivalno okolje in prostor za sprostitev.\\n\\nV
  tem kontekstu je klju\u010dno sporo\u010dilo PRE-MI\u0160LJENE vizije ob\u010dine
  Tr\u017ei\u010d 2030:\\n\\nVIZIJA pre-mi\u0161ljen TR\u017dI\u010c 2030\\nTr\u017ei\u010d
  2030, premi\u0161ljen prenovljen za nove generacije ponuja razko\u0161je prilo\u017enosti.
  Izberi svojo.\\n\\nVizijo ob\u010dine Tr\u017ei\u010d 2030 opredeljujejo naslednji
  **gradniki, na\u010dela in vrednote**:\\n\\n- **ZELENA IDENTITETA IN TRAJNOSTNA
  POT**\\n  Gorske vedute Dobr\u010de, Begunj\u0161\u010dice, Ko\u0161ute, Stor\u017ei\u010da
  in Kri\u0161ke gore, povirja Mo\u0161enika, Lom\u0161\u010dice in Tr\u017ei\u0161ke
  Bistrice, razse\u017eni gozdovi, biotska in geolo\u0161ka pestrost ter kmetijska
  zemlji\u0161\u010da son\u010dnih teras Kovorskega in Kri\u0161kega polja so, skupaj
  z ve\u010dstoletno zgodovino Tr\u017ei\u010da, klju\u010dne vrednote in najpomembnej\u0161i
  naravni viri ob\u010dine. Na\u0161i predniki so z njimi stoletja smotorno ravnali,
  zato jih moramo neokrnjene predati novim generacijam. **Trajnostni razvoj je edina
  mo\u017ena in glavna razvojna smer ob\u010dine Tr\u017ei\u010d v naslednjem obdobju.**
  Varovanje narave, krajine in okolja so ob\u010dani v anketi postavili na prvo mesto.\\n\\n-
  **PREMI\u0160LJENA, PAMETNA PREOBRAZBA**\\n  Tri desetletja gospodarskega, dru\u017ebenega
  in prostorskega preobra\u017eanja Tr\u017ei\u010da iz industrijske ob\u010dine v
  mesto z raznoliko podjetni\u0161ko strukturo in kakovostnim bivalnim okoljem ka\u017eejo
  rezultate. Izkusnje iz na\u010drtne podpore razvoju turizma in sodobne prenove javnih
  prostorov (Gorenjska pla\u017ea, kolesarski park, BPT, Dov\u017eanova soteska...)
  bomo usmerili tudi v druge dejavnosti, kot je lokalna samooskrba in na druga obmo\u010dja,
  ki terajo premike, kot je npr. mestno jedro. Nadaljnji **tok preobra\u017ebe bomo
  vodili premi\u0161ljeno, a dovzetno za nove pristope in digitalne spremembe**, ki
  bodo koristne za ob\u010dino in ob\u010dane. Mestu \u017eelimo vrniti urbani utrip,
  stanovanjske soseske narediti prijaznej\u0161e, na tr\u017ei\u0161kem pode\u017eelju
  pa ohraniti aktivne kmetije in kulturno krajino. Skrb za delovna mesta ob\u010dani
  postavljajo visoko, ob bok varstvu narave.\\n\\n- **PREBUJANJE POTENCIALOV IN URESNI\u010cEVANJE
  PRILO\u017dNOSTI**\\n  \u00bbZa zadovoljstvo ob\u010danov je potrebna motivacija,
  da ustvarjajo nekaj novega. S tem se skupnost utrjuje in nadgrajuje. Tr\u017ei\u010d
  naj bo tudi sredi\u0161\u010de ustvarjanja in prilo\u017enosti, ne pa zgolj odsko\u010dna
  deska ali kon\u010dna destinacija, od koder gre\u0161 lahko samo \u0161e v hribe
  in v Avstrijo\u00ab, je zapisal/-a eden/ena od sodelujo\u010dih Tr\u017ei\u010danov
  oz. Tr\u017ei\u010danka v razvojni anketi. Podobno so v procesu priprave razvojnega
  na\u010drta razmi\u0161ljali tudi drugi, zato **prihodnji razvoj ob\u010dine usmerjamo
  v spodbujanje prilo\u017enosti.**\\n\\n- **STRPNA IN VKLJU\u010cO\u010cA SKUPNOST**\\n  Staranje
  prebivalstva, novi dru\u017ebeni vzorci in \u017eivljenjski slogi, digitalna orodja,
  podnebne spremembe in migracije spremenjajo tudi tradicionalno tr\u017ei\u0161ko
  skupnost. Pomembno je, da s pozornostjo do vseh skupin in generacij, strpnostjo
  in dialogom ohranimo zdravo, vklju\u010dujo\u010de in varno socialno okolje.\\n\\n-
  **UTRIP NOVIH GENERACIJ**\\n  V skrbi za starajo\u010do skupnost ne smemo pozabiti
  na nove generacije, ki zagotavljajo perspektivo mestu in vasem. Vzpostavljanje okolja
  in podpora pobudam, ki bodo omogo\u010dile dru\u017eenje, ustvarjanje in **uresni\u010devanje
  \u017eivljenjskih ambicij mladih sta v jedru razvojne vizije.** Pri tem se osredoto\u010damo
  na odraslo\u010do mladino, ki po kon\u010dani osnovni \u0161oli pogosto pretrega
  stik z lokalnim okoljem.\\n\\n- **NOVA PODOBA IN POZICIJA**\\n  Skozi opisan pristop
  gradimo, urejamo in komuniciramo novo podobo ob\u010dine Tr\u017ei\u010d:\\n  -
  kot **prodorne, trajnostno razvijajo\u010de alpske ob\u010dine - ob\u010dine \u00bbs
  potencialom\u00ab;**\\n  - kot konkuren\u010dnega prostora za bivanje dru\u017ein
  in posameznikov - ljubiteljev outdoor dejavnosti;\\n  - kot ob\u010dine z naprednim
  javnim lokalnim servisom;\\n  - kot trajnostne outdoor turisti\u010dne destinacije;\\n  -
  kot mesta, ki je dovolj blizu in dovolj dale\u010d stran od urbanih sredi\u0161\u010d,
  da omogo\u010da umirjeno in uravnote\u017eeno bivanje med vsakodnevnim delom in
  \u017eivljenjem z naravo.\\n\\n3.2 Poslanstvo Ob\u010dine Tr\u017ei\u010d\\n\\nOb\u010dina
  Tr\u017ei\u010d v skladu z Zakonom o lokalni samoupravi skrbi za opravljanje lokalnih
  zadev javnega pomena kar pomeni, da je njeno poslanstvo osredoto\u010deno na:\\n\\n-
  zagotavljanje pogojev za kakovostno bivanje ob\u010danov (vrtci, O\u0160, izobra\u017eevanje
  odraslih, socialno varstvo, zdravstvena infrastruktura na primarni ravni, kultura
  in \u0161port...) in konkuren\u010den gospodarski razvoj (podjetni\u0161tvo, turizem,
  kmetijstvo);\\n- varstvo okolja (vode, zraka, tal) in usklajeno na\u010drtovanje
  prostorskega razvoja, u\u010dinkovito gospodarjenje s stavbnimi zemlji\u0161\u010di
  in ustvarjanje pogojev za gradnjo in preskrbo s stanovanji;\\n- zagotavljanje lokalnih
  gospodarskih javnih slu\u017eb (vodoskrba, odvajanje in \u010di\u0161\u010denje
  odpadnih voda, urejanje lokalnih cest, upravljanje z odpadki, pokopaliska in pogrebska
  dejavnost);\\n- u\u010dinkovito in transparentno upravljanje z ob\u010dinskim premo\u017eenjem.\\n\\nRazvojni
  na\u010drt naslavljva vsa na\u0161tetra podro\u010dja, zato je v naslednjih letih
  ena klju\u010dnih nalog Ob\u010dine Tr\u017ei\u010d in vseh njenih javnih zavodov,
  podjetij in slu\u017eb uresni\u010devanje vizije, ciljev, ukrepov in projektov opredeljenih
  v Razvojnem na\u010drtu Ob\u010dine Tr\u017ei\u010d 2030.\\n\\n3.3 Strate\u0161ki
  razvojni model: 3 strate\u0161ki cilji = 4 fokusna podro\u010dja\\n\\n\u017da uresni\u010devanje
  vizije Tr\u017ei\u010d 2030 in na osnovi opredeljenih klju\u010dnih razvojnih izzivov
  ter izbranega scenarija se prihodnji razvojni model Ob\u010dine Tr\u017ei\u010d
  osredoto\u010da na 3 svebinske in 1 prese\u010dno fokusno podro\u010dje ter njihove
  med seboj soodvisne strate\u0161ke cilje in ukrepe. Strate\u0161ki cilji sledijo
  izhodi\u0161\u010dnemu konceptu trajnostnega razvoja in odgovarjajo na potrebe vseh
  najpomembnej\u0161ih ciljnih skupin: ob\u010danov in ob\u010dank, turistov in obiskovalcev,
  zaposlenih in nosilcev podjetni\u0161ke, turisti\u010dne in kmetijske dejavnosti
  v ob\u010dini. Uresni\u010devanje strate\u0161kih ciljev bomo spremljali skozi nabor
  merljivih kazalnikov, opredeljenih na ravni posameznega cilja.\\n\\n\u25b6 Pregled
  ciljev in kazalnikov uspe\u0161nosti je prikazan na sliki 14, celoten model pa na
  sliki 15 na naslednjih straneh.\\n\\n3.4 Teritorialni razvojni model: 3 razvojna
  obmo\u010dja = 1 uravnote\u017eena in povezana razvojna smer\\n\\nZ razvojnim na\u010drtom
  Ob\u010dina Tr\u017ei\u010d nadaljuje politiko skladnega razvoja ob\u010dine, pri
  \u010demer \u017eelimo v prihodnjem razvojnem obdobju \u0161e posebej spodbuditi
  tesnej\u0161e funkcionalno, prostorsko, prometno in programsko povezovanje somestja
  Bistrica \u2013 Tr\u017ei\u010d \u2013 Ravne z zalejem in obratno. S predlaganimi
  ukrepi odpravljamo pomanjkljivosti v oskrbi in opremljenosti ter krepimo razvojne
  prilo\u017enosti posameznih obmo\u010dij, tako mestnega jedra, razvrednotenih obmo\u010dij,
  stanovanjskih sosesek kot tudi gorskih in ravni\u0161kih pode\u017eelskih naselij,
  ki z urbanizacijo in razvojem turizma spreminjajo svoj zna\u010daj. Razvojni na\u010drt
  smiselno gradi na modelu treh razvojnih obmo\u010dij: severnem gorskem obmo\u010dju
  treh dolin, ju\u017enemu demografsko vitalnem delu ob\u010dine in mestnemu delu
  kot vozli\u0161\u010du \u00bbvsrcu\u00ab, ki terja posebno razvojno pozornost in
  novo energijo.\\n\\n\u25b6 Ob grafi\u010dki na sliki 16 so podane klju\u010dne razvojne
  usmeritve po razvojnih obmo\u010djih.\\n\\n**FOKUSNO PODRO\u010cJE 1: PAMETNA REGENERACIJA**\\n\\n*Cilj:*
  Premi\u0161ljena zelena podjetni\u0161ka prenova za ve\u010djo odpornost in nova
  delovna mesta na vseh podro\u010djih (v gospodarstvu, turizmu, kmetijstvu)\\n\\n*Kazalnik*\\n\\n-
  \u0160tevilo delovnih mest: + 5% (iz 3.400 leta 2020 na 3.600 leta 2030)\\n- Dodana
  vrednost: + 30% (iz 35.977 EUR/zaposlenega leta 2019 na 44.000 EUR/zaposlenega leta
  2030)\\n- Obseg funkcionalno degradiranih obmo\u010dij: - 30% (iz 10 ha leta 2020
  na 7 ha leta 2030)\\n\\n**FOKUSNO PODRO\u010cJE 2: POUDARJENO ZELENI**\\n\\n*Cilj:*
  Ohranjeno naravno in sonaravno urejeno bivanjsko okolje\\n\\n*Kazalnik*\\n\\n- Priklju\u010denost
  na kanalizacijo in C\u010cN v aglomeraciji Tr\u017ei\u010d: 98% (iz 82,7% leta 2019
  na 98% leta 2030)\\n- Sodoben lokalni sistem trajnostne mobilnosti: DA\\n- Nastale
  koli\u010dine komunalnih odpadkov: - 20% (iz 409 kg/prebivalca leta 2019 na 327
  kg/prebivalca)\\n\\n**FOKUSNO PODRO\u010cJE 3: VKLJU\u010cUJO\u010cA SKUPNOST**\\n\\n*Cilj:*
  Vklju\u010dujo\u010da, vitalna in aktivna skupnost\\n\\n*Kazalnik*\\n\\n- \u0160tevilo
  mladih 0\u201314 let: + 5% (iz 2.189 leta 2020 na 2.300 leta 2030)\\n- Izobrazbena
  struktura: delovna mesta z vi\u0161jo in visoko izobrazbo v ob\u010dini (sprememba
  strukture na raven povpre\u010dja regije, iz 28% leta 2020 na 32% leta 2030)\\n-
  \u0160tevilo dru\u0161tev: ohraniti (ohraniti dejavnost 124 dru\u0161tev, kot jih
  je registriranih leta 2021)\\n\\n**FOKUSNO PODRO\u010cJE 4: UPRAVLJANJE RAZVOJA
  IN PREOBRAZBE**\\n\\n*Cilj:* Uresni\u010ditev strategije Tr\u017ei\u010d 2030\\n\\n*Kazalnik*\\n\\n-
