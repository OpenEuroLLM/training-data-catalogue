  kriterij.\\n\\nZa integracijo moramo uporabiti numeri\u010dno metodo za re\u0161evanje
  diferencialnih ena\u010db. V tretjem poglavju Numeri\u010dno re\u0161evanje diferencialnih
  ena\u010db u\u010dbenika Modeliranje procesnih operacij 1 najdemo pripravljeno programsko
  opremo za navadno Eulerjevo metodo (iteracijska metoda 1. reda) ter Runge-Kuttove
  metode 1., 2. in 4. reda (izbolj\u0161ave Eulerjeve metode). Za re\u0161evanje diferencialnih
  ena\u010db smo med temi mo\u017enostmi izbrali Runge-Kuttovo metodo 4. reda, ostale
  metode pa lahko preizkusite za vajo.\\n\\n3 SIMULACIJA PROCESNIH OPERACIJ\\n\\nZa
  simulacijo procesnih operacij je na voljo programska oprema, ki sestavlja paket
  DYFLO. Ta je podrobno razlo\u017een v istoimenskem poglavju Modeliranja procesnih
  operacij 1 , zato naj tu navedemo samo splo\u0161no strukturo paketa in na\u0161tejemo
  podprograme, ki jih paket omogo\u010da.\\n\\nSplo\u0161no strukturo paketa DYFLO
  predstavljata spremenljivki STRM in DATA:\\n\\n\u2013 Spremenljivka STRM(IS, IP)
  podaja lastnosti (IP) tokov oziroma vozli\u0161\u010d (IS) in ima dimenzijo (300,
  24).\\n\u2013 Spremenljivka DATA(IC, ID) podaja osnovne lastnosti (ID) kemijskih
  komponent (IC) in ima dimenzijo (20, 10).\\n\\nPaket DYFLO vsebuje programsko opremo
  z naslednjimi podprogrami:\\n\\n\u2013 ENTHL za ra\u010dunanje entalpije teko\u010de
  zmesi,\\n\u2013 ENTHV za ra\u010dunanje entalpije parnega toka,\\n\u2013 TEMP za
  dolo\u010danje temperature pri dani entalpiji in sestavi,\\n\u2013 EQUIL za izra\u010dun
  ravnote\u017ene sestave pare pri znanem tlaku oziroma temperaturi,\\n\u2013 za oceno
  koeficientov aktivnosti (ACTYW po Wilsonovi metodi, ACTYM po Margulesovi metodi
  in ACTY, ki upo\u0161teva idealno plinsko zmes),\\n\u2013 DEWPT za ra\u010dunanje
  rosi\u0161\u010da,\\n\u2013 HTEXCH za izra\u010dun splo\u0161nih faznih transformacij
  (razen vrenja),\\n\u2013 FLASH za simulacijo parcialnega in totalnega kondenzatorja,
  kotla z razpenjanjem ter simulacijo adiabatnega razpenjanja,\\n\u2013 CVBOIL za
  simulacijo kotlov in uparjalnikov brez zastanka,\\n\u2013 PCON za parcialno in totalno
  kondenzacijo,\\n\u2013 HLDP za simulacijo zastanka,\\n\u2013 VVBOIL za simulacijo
  kotla z zastankom ter\\n\u2013 PRL in RPRL za izpis rezultatov.\\n\\nNavedeni podprogrami
  niso samostojno uporabni. Uporabljali jih bomo skupaj s podprogrami za re\u0161evanje
  algebrskih in diferencialnih ena\u010db pri modeliranju reaktorjev.\\n\\n4 MODELIRANJE
  REAKTORJEV\\n\\nModeliranje reaktorjev je obravnavano v ve\u010d stopnjah:\\n\\n1.
  Modeli reaktorjev so sistemi navadnih nelinearnih diferencialnih in algebrskih ena\u010db,
  v katerih je neodvisna spremenljivka \u010das. Primeri iz u\u010dbenika Modeliranja
  procesnih operacij 1 so:\\na. reakcija v me\u0161alnem reaktorju za teko\u010do
  fazo (strani 79-82 v u\u010dbeniku),\\nb. reakcija v \u0161ar\u017enem reaktorju
  (stran 82 v u\u010dbeniku),\\nc. heterogena kinetika v \u0161ar\u017enem reaktorju
  \u2013 program HETKIN (strani 85-92 v u\u010dbeniku),\\nd. semikontinuirna kopolimerizacija
  v raztopini \u2013 program KOPOLI (strani 92-98 v u\u010dbeniku),\\ne. porazdelitev
  bivalnih \u010dasov v me\u0161alnem reaktorju \u2013 program RETTIME (strani 98-102
  v u\u010dbeniku).\\n2. Modeli reaktorjev so ve\u010dstopenjski sistemi, dobljeni
  z raz\u0161iritvijo 1. faze. Primer iz Modeliranja procesnih operacij 1 je:\\na.
  reakcija z ekstrakcijo v kaskadnem reaktorju \u2013 program KASKA (strani 103108
  v u\u010dbeniku).\\n3. Modeli reaktorjev so sistemi navadnih nelinearnih diferencialnih
  ena\u010db, v katerih je neodvisna spremenljivka razdalja ali geometrijska dol\u017eina
  (predvideno je stacionarno obratovanje, da je izlo\u010den \u010das kot neodvisna
  spremenljivka). Primer iz Modeliranja procesnih operacij 1 je:\\na. reakcija katalitskega
  razpadanja etilena v cevnem reaktorju (strani 108-118 v u\u010dbeniku)\\ni. simulirana
  s spremenljivim korakom \u2013 program VARSTEP,\\nii. simulirana s serijskim integriranjem
  \u2013 program  SITR.\\n4. Modeli reaktorjev so sistemi parcialnih diferencialnih
  ena\u010db, v katerih sta neodvisni spremenljivki prostorska spremenljivka in \u010das).
  Primera iz Modeliranja procesnih operacij 1 sta:\\na. heterogena kinetika v cevnem
  reaktorju \u2013 program DYNSIM (strani 119-123 v u\u010dbeniku),\\n\\nb. reakcija
  polimerizacije v \u0161ar\u017enem reaktorju (strani 123-128 v u\u010dbeniku).\\n\\nZa
  dolo\u010den tip reaktorja se pri ra\u010dunalni\u0161kih vajah:\\n\\n\u2013 sestavi
  ra\u010dunalni\u0161ki program, tako da se k dolo\u010denemu programu poi\u0161\u010dejo
  ustrezni podprogrami za modeliranje reaktorjev in simulacijo procesnih operacij
  ter podprogrami za numeri\u010dno re\u0161evanje algebrskih in diferencialnih ena\u010db,\\n\u2013
  testira sestavljeni program in po mo\u017enosti dobljene rezultate primerja z rezultati
  ali njihovimi grafi\u010dnimi prikazi, podanimi v Modeliranju procesnih operacij
  1 ,\\n\u2013 analizira dobljene rezultate in\\n\u2013 spreminja vhodne podatke (izvaja
  simulacije)  s ciljem izbolj\u0161ati testne rezultate.\\n\\n5 DIAGRAMI POTEKA\\n\\nZa
  vsak re\u0161evani problem je treba izdelati diagrame poteka. To so:\\n\\n\u2013
  blokovni diagrami ena\u010db in\\n\u2013 ra\u010dunalni\u0161ki diagrami poteka.\\n\\nDiagrami
  poteka morajo biti narisani z enim od ra\u010dunalni\u0161kih orodij, katere \u0161tudent
  obvlada. V navodilih za vaje je uporabljen ra\u010dunalni\u0161ki program SmartDraw.
  Z njim se \u0161tudentje seznanijo v drugem letniku \u0161tudija pri ra\u010dunalni\u0161kih
  vajah iz predmeta Procesne bilance. Zato si lahko po potrebi znanje osve\u017eijo
  z navodili za ra\u010dunalni\u0161ke vaje iz Procesnih bilanc 4 .\\n\\n5.1 Blokovni
  diagrami\\n\\nEna\u010dbe iz problema napi\u0161emo v blokovni obliki, tako da dobimo
  potek informacij:\\n\\nvhodne veli\u010dine \u23af\u23af\u2192 ena\u010dbe v sistemu\\n\\n\u23af\u23af\u2192
  izhodne veli\u010dine\\n\\nPotek informacij v obliki blokovnega diagrama ena\u010db
  so matemati\u010dni (analitski) ekvivalent analiziranega fizikalnega sistema. Kompleksno
  povezan sistem takih blokov imenujemo model.\\n\\nSlika 5-1 prikazuje blokovni diagram
  poteka za ra\u010dunanje prostornin treh me\u0161alnih reaktorjev v kaskadi (primer
  1 na strani 3).\\n\\nBlokovni diagram za ra\u010dunanje stopenj presnov kaskade
  dveh cevnih in enega me\u0161alnega reaktorja (primer 2 na strani 5) je predstavljen
  na Sliki 5-2. \u010crni trikotnik\\n\\nozna\u010duje integracijski blok. Tako lahko
  takoj lo\u010dimo ena\u010dbe, ki jih je treba re\u0161evati algebrsko od ena\u010db,
  ki jih je treba integrirati.\\n\\n.\\n\\n5.2 Ra\u010dunalni\u0161ki diagrami poteka\\n\\nStandardni
  ra\u010dunalni\u0161ki diagrami poteka nas vodijo skozi pripravo ra\u010dunalni\u0161kih
  programov. Za risanje diagramov poteka uporabljamo dovoljene grafi\u010dne znake
  oziroma simbole 4 . Grafi\u010dni simboli so lahko prosojni ali obarvani. Z obarvanjem
  simbolov dose\u017eemo ve\u010djo preglednost diagramov poteka. Tekst v grafi\u010dnih
  simbolih je lahko slovenski ali angle\u0161ki. Ustrezne ena\u010dbe je treba pisati
  v matemati\u010dni obliki in ne v FORTRANski.\\n\\nSlika 5-3 prikazuje ra\u010dunalni\u0161ki
  diagram poteka za pripravo glavnega programa za ra\u010dunanje prostornin kaskade
  treh enako velikih me\u0161alnih reaktorjev (primer 1 na strani 3). Ra\u010dunalni\u0161ki
  program bo klical podprogram CONV, ki uporablja Wegsteinovo metodo.\\n\\nSlika 5-4
  prikazuje ra\u010dunalni\u0161ki diagram poteka za pripravo glavnega programa za
  ra\u010dunanje stopenj presnov kaskade dveh cevnih in enega me\u0161alnega reaktorja
  (primer 2 na strani 5). Ra\u010dunalni\u0161ki program bo klical podprogram FUN1
  za oceno hitrosti reakcije pri neki stopnji presnove in podprograme INT, INTI in
  PRNTF, ki prestavljajo orodje za integracijo ena\u010db po Runge-Kuttovih metodah.
  V diagramu poteka je predvidena Runge-Kuttova metoda 4. reda.\\n\\n6 PROGRAMIRANJE\\n\\n6.1
  Ra\u010dunalni\u0161ki program in dobljeni rezultati za kaskado treh me\u0161alnih
  reaktorjev\\n\\nGlavni program za ra\u010dunanje prostornin treh enako velikih me\u0161alnih
  reaktorjev (primer 1 na strani 3), ki kli\u010de podprogram CONV 1 :\\n\\n```\\nC     *************************************************************
  C     * Prostornina treh identicnih mesalnih reaktorjev v kaskadi * C     *************************************************************
  real k OPEN(6,STATUS=''NEW'',FILE=''PRIMER1G.REZ'') write(6,100) 100   format(1x,52(''*''),/,1x,''*
