  |\\n\\nZa ve\u010d glej podroben socio-ekonomski profil prikazan skozi 100 kazalnikov
  v Prilogi 1.\\n\\nOb\u010dina Tr\u017ei\u010d, v zavejtu Karavank, Dobr\u010de in
  Stor\u017ei\u010da, a nedale\u010d od Ljubljane in Celovca\\n\\nOb\u010dina Tr\u017ei\u010d
  s povr\u0161ino 155 km\u00b2 in 15.003 prebivalci sodi med srednje velike slovenske
  ob\u010dine in med pet najve\u010djih gorenjskih ob\u010din. Pretekli industrijski
  in dana\u0161nji tranzicijski razvojni polo\u017eaj ob\u010dine pomembno zaznamujeta
  njena lega med pobo\u010dji gorske verige Karavank na meji z Avstrijo in odprtost
  in dostopnost proti Ljubljanski kotlini na jugu. Severni del opredeljujejo tri gorske
  doline (doline Mo\u0161enika, Tr\u017ei\u0161ke Bistrice in Lom\u0161\u010dice),
  ju\u017eni del ob\u010dine pa son\u010dna pobo\u010dja Dobr\u010de in Kri\u0161\u010de
  gore z Dobravami in terasami Tr\u017ei\u0161ke Bistrice.\\n\\nUrbana naselja z razvrednotenim
  obmo\u010djem BPT in Peko\\n\\nUrbano obmo\u010dje predstavlja soto\u010dje Mo\u0161enika
  in Tr\u017ei\u0161ke Bistrice ume\u0161\u010deno staro mestno jedro Tr\u017ei\u010da
  in novej\u0161e predmestno naselje Bistrica pri Tr\u017ei\u010du. Med njima je obse\u017eno
  gospodarsko obmo\u010dje Peko-BPT, danes deloma aktivne in deloma opu\u0161\u010dene
  rabe. Znotraj o\u017ejega urbanega obmo\u010dja mesta 4,6 ha zaseda razvrednoteno
  obmo\u010dje nekdajnega BPT, nepopolno izkori\u0161\u010dene so tudi povr\u0161ine
  nekdajne tovarne Peko. Na\\n\\n---\\n\\n12 Vsi podatki SURS, 2016, H2 (to je 1.
  7. 2016 oz. polno leto), razen kjer je druga\u010de ozna\u010deno.\\n13 Lasten prera\u010dun
  za GD, s.p. in zadruge skupaj na podlagi podatkov AJPES za leto 2019.\\n14 Anketa
  med ob\u010dani (april 2021, N=457), pri \u010demer je 1 najni\u017eja in 4 najvi\u0161ja
  mo\u017ena ocena splo\u0161nega zadovoljstva z bivanjem v ob\u010dini Tr\u017ei\u010d.\\n15
  Kazalnik razvitosti ob\u010din za leti 2020 in 2021, Ministrstvo za finance, https://www.gov.si/teme/financiranje-obcini/.\\n\\ncelotnem
  obmo\u010dju ob\u010dine je po podatkih iz leta 2020 evidentiranih 6 funkcionalno
  degradiranih obmo\u010dij v skupni povr\u0161ini 10,41 ha.\\\\textsuperscript{16}
  \\\\textit{Glej tudi sliko 9 na koncu tega poglavlja.}\\n\\n\\\\textbf{TR\u017dI\u010c
  2020, demografsko vitalno pode\u017eelje in stagnacija urbanih obmo\u010dij}\\n\\nPoselitev
  ob\u010dine Tr\u017ei\u010d je razpr\u0161ena na 35 naselij, od tega na dve mestni
  (Tr\u017ei\u010d in Bistrica pri Tr\u017ei\u010du) in 33 pode\u017eelskih naselij.
  Po podatkih SURS je leta 2020 od 15.003 prebivalcev, 6.462 ali 43 \\\\% prebivalcev
  ob\u010dine prebivalo v urbanem delu in 8.499 ali 57 \\\\% na pode\u017eelju. Po
  \u0161tevilu prebivalcev so bila leta 2020 najve\u010dja naselja: Tr\u017ei\u010d
  (3.726), Bistrica pri Tr\u017ei\u010du (2.736), Podljubelj (900), Pristava (899),
  Kri\u017ee (884) in Kovor (815). Najmanj\u0161a so naselja Hu\u0161ica (6), Novake
  (16) in Gozd (26). Gostota poselitev v ob\u010dini zna\u0161a 97 prebivalca/km\\\\textsuperscript{2},
  kar je nekoliko manj od povpre\u010dja Slovenije (103,6 prebivalcev/km\\\\textsuperscript{2})
  in Gorenjske (97,3 prebivalcev/km\\\\textsuperscript{2}). V ob\u010dini Tr\u017ei\u010d
  se je \u0161tevilo prebivalcev v obdobju 2008-2018 zmanj\u0161evalo. Od leta 2018
  naprej je opazen rahel trend nara\u0161\u010danja, ki je posledica pove\u010danega
  selitvenega prirasta iz tujine. Tako kot ve\u010dina gorenjske regije se tudi ob\u010dina
  Tr\u017ei\u010d soo\u010da s problematiko hitro starajo\u010de dru\u017ebe. Indeks
  staranja v ob\u010dini je bil leta 2020 nad povpre\u010djem regije in dr\u017eave,
  zna\u0161al je 152 (Gorenjska 129, Slovenija 136). Tudi povpre\u010dna starost se
  je med letoma 2010 in 2020 dvignila iz 41,8 na 44,4 let, kar je ve\u010d od povpre\u010dja
  regije in dr\u017eave. V starostni skupini do 14 let je bilo leta 2020 2.189 (leta
  2010 2.127) prebivalcev, v aktivni populaciji 9.492 oseb (leta 2010 \u0161e 10.622),
  starej\u0161ih od 65 let pa je 3.280 (leta 2010 2.564). 887 ob\u010danov je starej\u0161ih
  od 80 let. V opazovanem obdobju 2010-2020 se je \u0161tevilo starej\u0161ih pove\u010dalo
  za 28 \\\\%, obseg aktivne populacije pa zmanj\u0161al za 11 \\\\%. Pomembno je,
  da se je \u0161tevilo mladih (0-14 let) pove\u010dalo za 3 \\\\%. \\\\textit{Glej
  tudi slike 5, 6 in 10 ter tabelo 1 na koncu tega poglavlja.}\\n\\n\\\\textbf{TR\u017dI\u010c
  2020 v gospodarskem prehodu, iz industrijske v mikro podjetni\u0161ko in bivanjsko
  ob\u010dino}\\n\\nGospodarstvo ob\u010dine se je v zadnjih treh desetletjih, po
  zatonu velikih industrijskih podjetij (PEKO, BPT...) in izgubi delovnih mest razpr\u0161ilo.
  Leta 2020 je bilo v ob\u010dini 3.404 delovnih mest, od katerih jih je v gospodarstvu
  pribli\u017eno 2.000. Leta 2019 je bilo v ob\u010dini 292 aktivnih gospodarskih
  dru\u017eb s 1730 zaposlenimi in 424 aktivnih samostojnih podjetnikov (24 \\\\%
  manj kot 2010) z 255 zaposlenimi. V gospodarski strukturi po \u0161tevilu prevladujejo
  mikro podjetja. Povpre\u010dno tr\u017ei\u0161ko podjetje oz. s.p. je imelo leta
  2019 2,8 zaposlenega in je ustvarilo 35.977 EUR dodane vrednosti na zaposlenega,
  kar je 21 \\\\% manj od slovenskega povpre\u010dja. Podjetni\u0161ka dinamika, izra\u017eena
  v \u0161tevilu poslovnih subjektov na 1.000 prebivalcev, je ni\u017eja od regijskega
  in slovenskega povpre\u010dja (Tr\u017ei\u010d 48,4, Gorenjska 54,6 in Slovenija
  57,3). Med gospodarskimi dru\u017ebami sta dve veliki (dve dru\u017ebi skupine CABLEX,
  skupaj 341 zaposlenih), 4 srednje (INTEC MKD d.o.o., KOMTEKS d.o.o., Komunala Tr\u017ei\u010d
  in KVIBO d.o.o.), 37 majhnih in 249 mikro podjetij. \u0160est najve\u010djih podjetij
  je leta 2019 ustvarilo 40 \\\\% delovnih mest in celotne dodane vrednosti, 51 \\\\%
  prihodkov, 55 \\\\% dobi\u010dka in 62 \\\\% izvoza tr\u017ei\u0161kega gospodarstva.
  420 s.p.-jev je mikro podjetnikov, \u0161tirje med njimi sodijo v skupino malih
  podjetij.\\n\\nPredelovalna panoga v strukturi \u0161e prevladuje, a je zelo opazen
  trend kontinuiranega prestrukturiranja iz industrijske v storitveno ob\u010dino.
  Dele\u017e prihodkov predelovalne dejavnosti se je zmanj\u0161al iz 44 \\\\% leta
  2010 na 34 \\\\% leta 2019, dele\u017e industrijskih delovnih mest pa iz 55 \\\\%
  na 47 \\\\% (leta 2019 945 zaposlenih). V opazovanem obdobju je najbolj narasel
  obseg trgovine (378 ali 19 \\\\% vseh zaposlenih, 31 \\\\% prihodkov). Dejavnost
  gradbeni\u0161tva ostaja pomembna, a stagnira (164 ali 9 \\\\% zaposlenih, 7 \\\\%
  prihodkov). Visoko rast v obdobju 2010 -2019 izkazujejo storitvene dejavnosti: gostin\u0441\u0442\u0432\u043e
  in turizem (2,8 \\\\% zaposlenih, 1,7 \\\\% prihodkov), IKT (3,5 \\\\% zaposlenih,
  6,1 \\\\% prihodkov, 14,3 \\\\% dobi\u010dka) in strokovno-tehni\u010dne storitve
  kot je zalo\u017eni\u0161tvo (6,1 \\\\% zaposlenih, 9 \\\\% prihodkov, 42,5 \\\\%
  dobi\u010dka leta 2019). Glede na obseg delovno aktivnega prebivalstva in razpolo\u017eljivih
  delovna mesta zna\u0161a pokritost delovnih mest v ob\u010dini 53 \\\\%. Medtem
  ko v svoji\\n\\n\\\\textsuperscript{16} Izvedba druge faze a\u017euriranja podatkov
  in prostorske baze funkcionalno degradiranih obmo\u010dij v Sloveniji, Zaklju\u010dno
  poro\u010dilo, naro\u010dnik: MGRT, izvajalec, Filozofska fakulteta, Ljubljana,
  november 2020.\\n\\nob\u010dini dela 2.225 ob\u010danov, jih 4.208 na delo odhaja
  izven ob\u010dine. To je vplivalo na spremembo zna\u010daja ob\u010dine \u2013 iz
  nekdaj zaposlitveno intenzivnega sredi\u0161\u010da v vsse bolj bivanjsko okolje.
  Glej karti 11 in 12 na koncu poglavlja.\\n\\n**TR\u017dI\u010c 2020. visoko kakovostno
  naravno in kulturno okolje za bivanje, turizem in rekreacijo**\\n\\nOb\u010dina
  Tr\u017ei\u010d ima visok potencial narave, gorske alpske krajine in kulturnega
  ambijenta idealnega za bivanje, turizem, rekreacijo in druge trajnostne gospodarske
  rabe. Prebivalci v anketi izra\u017eajo visoko raven zadovoljstva s kakovostjo naravnega
  okolja (ocena 3,3 od 4) in mo\u017enostjo rekreacije. 74 % ob\u010dine pora\u0161\u010dajo
  gozdovi, ve\u010dji del ob\u010dine oz. kar 79,4 % njene povr\u0161ine zaradi izjemne
  biodiverzitete sodi v Natura 2000 obmo\u010dja. Na obmo\u010dju ob\u010dine sta
  dve zavarovani obmo\u010dji: naravni spomenik Dov\u017eanova soteska v Udin Bor\u0161t,
  med ve\u010dje naravne vrednote dr\u017eavnega pomena pa sodijo greben Ko\u0161ute
  in Begunj\u0161\u010dice, vodotoka Tr\u017ei\u0161ka Bistrica in Lom\u0161\u010dica
  ter mokri\u0161\u010da v Seni\u010dnem. Bogato kulturno okolje dokazuje 275 enot
  kulturne dedi\u0161\u010dine. V Podljubelju je tabori\u0161\u010de Ljubelj, ki je
  kulturni spomenik dr\u017eavnega pomena, sicer pa je v ob\u010dini 65 kulturnih
  spomenikov lokalnega pomena. Tradicijo in kulturno izro\u010dilo skozi razne dejavnosti
  ohranja 23 kulturnih in umetni\u0161kih dru\u0161tev. Leta 2019 je ob\u010dina zabele\u017eila
  8.263 prihodov in 20.721 preno\u010ditev turistov, kar je 7-krat ve\u010d prihodov
  in 11-krat ve\u010d preno\u010ditev kot leta 2010. Rast\u010do obisk potrjuje privla\u010dnost
  obmo\u010dja, zlasti v segmentu pohodni\u0161tva, gorskega kolesarstva in ostalih
  dejavnosti v naravi. Glej tudi karti 7 in 8.\\n\\n**TR\u017dI\u010c 2020. raznovrsten
  in dostopen osnovni javni servis**\\n\\nV ob\u010dini Tr\u017ei\u010d deluje 13
  krajevnih skupnosti: KS Bistrica pri Tr\u017ei\u010du, KS Brezje pri Tr\u017ei\u010du,
  KS Jelendol, KS Kovor, KS Kri\u017ee, KS Le\u0161e, KS Lom pod Stor\u017ei\u010dem,
  KS Podljubelj, KS Pristava, KS Ravne, KS Sebenje, KS Seni\u010dno in KS Tr\u017ei\u010d
  \u2013 mesto. Ob\u010dina Tr\u017ei\u010d je ostala enovita ob\u010dina in skozi
  svoje delovanje utrdila mre\u017eo lokalnih javnih zavodov in podjetij, ki ob\u010danom
  nudijo cenovno, programsko in \u010dasovno sprejemljiv dostop do vseh najpomembnej\u0161ih
  \u017eivljenjskih storitev (vrtec, O\u0160, zdravstveno in socialno varstvo, lekarna,
  dom starej\u0161ih, knji\u017enica, muzej, izobra\u017eevanje odraslih, kulturna
  in \u0161portna infrastruktura, komunalne in redarske storitve). Otrokom, mladim
  in starej\u0161im so na voljo raznovrstne dru\u017ebene prostot\u010dasne dejavnosti
  v institucionalni kot v civilni obliki. Prebivalci Tr\u017ei\u0161\u010da se lahko
  udejstvujejo v 124 dru\u0161tvih, ki delujejo na podro\u010dju \u0161porta in kulture,
  gasilstva, planinstva, humanitarnih in drugih dejavnosti.\\n\\nS podpovpre\u010dnim
  koeficientom razvitosti 0,96, ki ga na dve leti opredeljuje Ministrstvo za finance,
  se ob\u010dina Tr\u017ei\u010d v letih 2020-2021 uvr\u0161\u010da na 140.-148. mesto
  med 212 slovenskimi ob\u010dinami. Kljub temu je 73 % anketirancev zadovoljnih s
  kvaliteto bivanja (povpre\u010dna ocena 2,8 od 4) in kakovostjo javnih storitev
  (2,8 od 4). Razvojna prizadevanja ob\u010dine se odra\u017eajo v plaketi Zlatega
  kamna, ki Ob\u010dino Tr\u017ei\u010d po indeksu ISSO uvr\u0161\u010da med najbolj
  prodorne slovenske ob\u010dine.18\\n\\n---\\n\\n17 Razvojna anketa med ob\u010dani,
