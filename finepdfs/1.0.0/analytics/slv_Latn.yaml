  razvojna sprememba.\\n\\nV na\u010drtu ukrepov so za vsako fokusno podro\u010dje
  v obliki matrike navedeni projekti oz. programske spremembe, ocenjene finan\u010dne
  posledice in potencialni viri financiranja. Za vsak projekt je opredeljen nosilec
  ter okvirni \u010dasovni na\u010drt izvedbe. Projekti so dodatno klasificirani po
  tipu in obmo\u010dju posega, za kar so uporabljene okraj\u0161ave kot so pojasnjene
  v nadaljevanju. Na\u010drt ukrepov je potrebno razumeti kot dinami\u010den okvir,
  ki se tekom desetletnega obdobja v izvajanju prilagaja razli\u010dnim, danes te\u017eko
