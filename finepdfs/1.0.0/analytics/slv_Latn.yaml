  ki dolo\u010da programe \u0161porta, ki se sofinancirajo iz javnih sredstev, obseg
  in vrsto dejavnosti, potrebnih za njihovo uresni\u010devanje, in obseg sredstev,
  ki se zagotovijo v dr\u017eavnem prora\u010dunu.\\n\\nIz dr\u017eavnega prora\u010duna
