  Dopolnjeno mnenje k osnutku OPPN za EUP ME 51 (del)\\n\\nObmo\u010dje OPPN za EUP
  ME 51 (del) je izven varovanih obmo\u010dij kulturne dedi\u0161\u010dine, na vzhodni
  strani pa meji na arheolo\u0161ko najdi\u0161\u010de:\\n\\n| EID | ime |\\n|---|---|\\n|
  1-30848 | Menge\u0161 - Arheolo\u0161ko najdi\u0161\u010de Mali Menge\u0161 |\\n\\nPosebnih
  varstvenih re\u017eimov kulturne dedi\u0161\u010dine na samem obmo\u010dju ni.\\n\\nUgotavljamo,
  da je odlok (30. \u010dlen \u2013 ohranjanje kulturne dedi\u0161\u010dine) ustrezno
  popravljen. Priporo\u010dilne podrobnej\u0161e usmeritve za podro\u010dje varstva
  arheologije in opredelitev \u0161tevila dreves na parkirna mesta so upo\u0161tevane.\\n\\nGlede
  navedenega priporo\u010dila, da \u00bbse za intenzivno ozelenitev vzhodnega robu
  obmo\u010dja OPPN ME 51 (del) z grmovnato vegetacijo v 11. \u010dlenu, kjer so opredeljeni
  pogoji za urejanje zelenih povr\u0161in, javno dostopnih povr\u0161in, zemlji\u0161\u010d
  in drugih posegov, doda obvezo izdelave na\u010drta krajinske arhitekture\u00ab,
  je bilo pojasnjeno, da bo vrsta zasaditve na ra\u0161\u010denem terenu obdelana
  v fazi DGD in bo odvisna od organizacije funkcionalnega zemlji\u0161\u010da ter
  pogojev za ponikanje meteornih voda na vodovarstvenem obmo\u010dju. O potrebnosti
  na\u010drta krajinske arhitekture se bo odlo\u010dilo v postopu priprave DGD v skladu
  s prepisi s podro\u010dja graditve.\\n\\nGlede na to, da je bil predlog iz prej\u0161njega
