sample: '["\"JO\u017dE RUS:\\n\\nTRIGLAV.\\n\\nHistorijsko-geografske \u010drtice
  (z 1 sliko v prilogi).\\n\\nI.\\n\\nTRIGLAV PRED VALVASORJEM.\\n\\nTriglav! Na\u0161e
  nacionalno znamenje! Koliko predstav najbujnej\u0161e fantazije je moralo biti zgo\u0161\u010denih
  okrog njegovega imena \u017ee v dobi Valvasorjevi. In vendar je temu mo\u017eu,
  ki je sicer prisluhnil tolikerim utripom ljudske du\u0161e in zabele\u017eil toliko
  \\\"posebnosti\\\" iz na\u0161e narave, ba\u0161 Triglav, \\\"najvi\u0161ji in najbolj
  pravlji\u010dni\\\", kakor ga ozna\u010duje Kugy, ostal s svojim pravim imenom nespoznan.\\n\\nKakor
  se je pri nas o tem dejstvu \u017ee mnogo razmi\u0161ljalo, o tem vendarle ni \u0161e
  nik\u010de posumil, da Triglavovo ime za Valvasorja \u0161e ne bi obstajalo. Verovanju
  v starost triglavskega imena naj te vrstice slu\u017eijo v potrjenje in prepri\u010danje.\\n\\nPoznavanje
  narave je bilo v starih \u010dasih prav enostransko, a topografski aparat, ki se
  je \u017e njim bavil stari \u010dlovek, je bil kaj boren. \u0160e posebno redki
  so kajpak sledovi gorskih imen. Samo v \u010drtah, ki so po njih vodila tovorna
  pota, so bile Alpe po nekoliko \u017ee tedaj znane, tako da je stara geografija
  (n. pr. W. Lazius in Valvasor) ta tesna lokalna imena kaj rada porabljala za poimenovanje
  celih skupin alpskih grebenov. V divjih, skalnih alpskih vrhuncih pa so na\u0161i
  predniki videli le grozo in strah. B. Hacquet, eden prvih obiskovalcev Triglava,
  je \u0161e v poznem 18. stoletju zapisal tole zna\u010dilno opazko: \\\"Terglou
  oder Terklow, welches so viel hei\u00dft, als Berg des Abscheus oder Entsetzens.\\\"\\n\\nTudi
  pisane stare listine omenjajo v prvi vrsti krajevna imena, ki so bila tori\u0161\u010de
  \u010dlovekovega gospodarstva. Vi\u0161je alpske vrhove najdemo zapisane pa le tedaj,
  \u010de je po njihovem vencu dr\u017eala kaka meja. Po pisanih dokumentih te vrste
  (\\\"Konfinsbeschreibungen, Konfinien\\\"), je treba iskati tudi ime Triglava. Resno
  za sledom triglavskega imena je \u0161el doslej pa\u010d edini A. Gsirner v svoji
  vzorni studiji \\\"Die Julischen Alpen. Westlicher Teil (Raibler Berge)\\\". Deloma
  po njegovem uhojenem potu, deloma v novih smereh, ho\u010demo tu razmi\u0161ljati
  o vlogi, ki jo je igral triglavski vrh v zgodovini civilizovanega sveta.\\n\\nPri
  tem pridejo v po\u0161tev opisi mej gospo\u0161\u010din, ki so s svojimi posestnimi
  pravicami segale pod stene Triglava. Bilo je troje ve\u010djih, Blejska in Belope\u0161ka
  gospo\u0161\u010dina na savski, a Bov\u0161ko glavarsvo na so\u0161ki strani, sredi\\n\\n1)
  Oryctographia Carniolica, Leipzig 1778\u201489, IV., 82. \u2014 Sli\u010dno se l.
  1687. omenja Mont Blanc sploh prvkrat kar z imenom \\\"Maudit\\\" ali prokleti.
  Dreyer, A., Der Alpinismus, Berlin 1909, p. 19.\\n\\n2) Ztschr. Alpenver. 1900,
  395\u2014420.\\n\\nmed prvima dvema pa se je razprostiralo \u0161e \u010detrto,
  manj\u0161e posestvo Dovje. Bled z Bohinjem vred je bil do sekularizacije l. 1803.
  v lasti briksenskih \u0161kofov, \u0161kofje iz Freisinga so bili posestniki na
  Dovjem, a ostala dva kompleksa na severu nastopata \u017ee od 15. ozir. 16. stoletja
  kot posestvi vladajo\u010de hi\u0161e Habsburgov.\\n\\nOkoli l. 1000 je bila slovenska
  zemlja \u0161e kaj redko naseljena. Zato v prvi darilni listini Blejske gospo\u0161\u010dine
  iz l. 1004. stroga omejitve tudi \u0161e ni bila tako potrebna. V tej listini se
  omenja samo: \\\"posestvo, Bled po imenu, v kranjski pokrajini in v grofiji Waltilonovi\\\"\u00b3).
  Sedem let pozneje je obseg posestva \u017ee nekoliko jasneje za\u010drtan v besedah:
  \\\"inter duos fluvios minoris et maioris Souva\\\"\u2074). Ko pa se je \u0161kofo
  po svojih oskrbnikih in kolonistih po zemlji\u0161\u010du bolje razgledal, je posestvo
  dobilo tudi dolo\u010dno mejno \u010drto. L. 1073. daruje cesar Henrik IV. briksenskemu
  \u0161kofu lovske pravice (Wildbann) na posestvih njegove cerkve \u2014 \\\"super
  prediis ecclesiae suae\\\" \u2014 s tole dolo\u010dno mejo:\\n\\n\\\"Quorum prediorum
  longitudinem seu latitudinem certo rivorum limite determinavimus. De rivo Tobropotoch,
  quod teutonice Guelbach (dicitur), usque ad flumen Feistriza et a summo vertice
  Creine montis usque in medium fundum Sowe fluminis.\\\"\u2075)\\n\\nOd hudournika
  Dobra\u010dnika do izliva Triglavskse Bistrice pa preko \\\"najvi\u0161jega vrha
  kranjskega gorovja\\\" v dno doline Savice, to poredje v listini na\u0161tetih imen
  nas od Triglavskse Bistrice v Vratih do Savice v Bohinju pa\u010d ne more voditi
  drugod kakor \u010dez rog samega Triglava. Izraz, \\\"summus vertex Creine montis\\\"
  se torej krije z dana\u0161njim imenom Triglav. Radi tega sme tudi leto 1073. veljati
  za skrajni datum, ko se triglavska gora omenja, ne sicer z njenim prvim imenom,
  a vendar \u017ee tako jasno in dolo\u010dno, da je izklju\u010den vsak dvom. (Trditve
  starej\u0161ih geografov, da je pri Strabonu navedeno ime Tullum mons to, kar na\u0161
  Tolmin ozir. Triglav, a Phlygadia Bovec\u2076), Mangart ozir. Blego\u0161, bodo
  pa\u010d morale ostati za vedno na nizki ceni golega domnevanja, ker jim Strabon
  ne daje dovolj pojasnjujo\u010dega teksta v pomo\u010d).\\n\\nGornja oznaka triglavske
  gore iz l. 1073. igra poslej v opisih mej Blejske gospo\u0161\u010dine stalno svojo
  vlogo. Tako nam Fr. A. Sinnacher\u2077) poro\u010da o vizitaciji, ki jo je na nekem
  blejskem misalu popisal sam \u0161kofo\\n\\n---\\n\\n\u00b3) Kos, Fr., Gradivo za
  zgodovino Slovencev, III., \u0161t. 17.\\n\u2074) Kos, l. c. \u0161t. 28. \u2014
  Iz teh dokumentiranih imen vidimo jasno, kako je na\u0161e ljudstvo ob dajanju imen
  povirima krakoma Save \u2014 pa tudi drugod (Sora, gl. Kos, II. \u0161t. 444.) \u2014
  presojalo momente, ki so mu bili najbli\u017eji, vodnatost ozir. velikost, in dalo
  slabej\u0161emu kraku krakoj ime v diminutivu. (Imena vasi Savica, Sorica so pa\u010d
  le sekundarna, izposojena). \u0160ele tuja literatura in \u0161ola sta zabrisali
  spomin na lepa stara imena, jih zamenjali z drugimi, umetnimi in tako napravili
  precej\u0161no zmedo.\\n\u2075) Schumi, Fr., Urk.- u. Reg.-Buch, I., 59, \u0161t.
  49. \u2014 Kos, l. c. \u0161t. 274.\\n\u2076) Valvasor, J. W., Die Ehre d. H. Krain,
  Laibach \u2014 N\u00fcrnberg 1689, I (III) 301 s. II (V) 59.\\n\u2077) Beitr\u00e4ge
  zur Gesch. d. bisch\u00f6fl. Kirche S\u00e4ben u. Brixen. Brixen 1821\u201437.,
  VI., 463 s. \u2014 Kimovec, Fr., Bled nekdaj in sedaj. Ljubljana 1908, 19.\\n\\nvizitator
  v l. 1458. Bil je to slavni briksenski \u0161kof in kardinal Nicolaus Cusanus (1401\u20141464),
  najbolj u\u010dena glava svoje dobe. Na Bled je pri\u0161el dne 30. aprila 1458,
  od 4.\u20147. maja je bil v Bohinju. Za zadnji dan je dal sklicati Bohinjce v Bitnje.
  Tu je ma\u0161eval, potem pa zbranemu ljudstvu tudi opisal meje svoje gospo\u0161\u010dine:\\n\\n\\\"Die
  Herrschaft Veldes, sagten wir, fange an auf der H\u00f6he des Berges Kronberg, und
  die zwei W\u00e4sser die gr\u00f6ssere und die kleinere Sau entspringen in dieser
  Herrschaft, und geh\u00f6ren zu derselben von ihrem Ursprung bis zu ihrem Zusammenflu\u00df
  und noch weiter bis an die zwei W\u00e4sser Feustritz und Gutenbach. Dieses sind
  jene Bemarkungen und Forstbezircke von Vels, welche in dem Brief des Kaisers Heinrich
  IV. als dem Banne unterworfen erkl\u00e4rt werden.\\\"\\n\\n(Ob takih prilikah so
  se tuji mogotci zastran bolj\u0161ega uspeha vselej radi poslu\u017eili \u0161e
  tolma\u010da, pa je verjetno, da je tudi fokrat v Bitnju tolma\u010d \u2014 doma\u010din
  mejno to\u010dko, \\\"summus vertex Creine montis\\\" poklical Bohinjcem v spomin
  \u017e njegovim pravim, starim doma\u010dim imenom Triglav).\\n\\nU\u010deni Cusanus
  se je bavil tudi s kozmografijo in velja kot tak za predhodnika Kopernikovega. Od
  njega imamo celo zemljevid, ki je iz\u0161el v Eichst\u00e4ttu l. 1491). To je prva
  karta srednje Evrope sploh. Pri roki je sicer nimamo, ali iz vsega zgoraj povedanega
  bi se dalo sklepati, da je na tej karti ozna\u010den morda tudi na\u0161 Triglav.
  Potem bi bila to prva kartografska ozna\u010dba na\u0161ega gorskega prvaka, seveda
  \u0161e vedno ne z njegovim prvim imenom; saj za ono dobo absolutne vlade latinskega
  jezika drugega tudi ne smemo pri\u010dakovati. Dobrih petdeset let pozneje (1561)
  je W. Lazius) izdal karto Vojvodine Kranjske. Na tej karti ima (gorenjska) Sava
  svoj izvir pod gorovjem Ocra Mons, in sicer zahodno od koro\u0161ko-kranjsko-gori\u0161ke
  trojne meje. Vzhodno odtu je ozna\u010deno gorovje \\\"Ober Krainpurg\\\" z izvirom
  So\u010de na jugu in kamnogori\u0161kim Pustim gradom na severu, do\u010dim se ju\u017eno
  od \u0160kofje Loke razprostira \\\"Krayngebyrg\\\". Ali ne ti\u010di morda tudi
  v imenu Ober Krainpurg namigavanje na \\\"summus vertex Creine montis\\\"?\\n\\nCusanovo
  poro\u010dilo) je bilo pisano br\u017ekone tudi v latin\u0161\u010dini in zdi se,
  da je bila jasna oznaka triglavsko gore v originalu \u0161e kompletna. Svoj opis
  meje Cusanus celo pri\u010dne pri triglavskem vrhu. Toda glede ostale meje je opa\u017eati
  \u017ee pri njem precej\u0161njih neto\u010dnosti: izvir (gorenjske) Save mu je
  \u017ee v podro\u010dju Blejske gospo\u0161\u010dine, pod imenom Bistrice pa je
  najbr\u017e mi\u0161ljena reka tega imena v Bohinju. Zemlje la\u010dnost je bila
  potem vzrok, da so se neto\u010dnosti le vedno bolj mno\u017eile. Dokument \\\"Der
  Herrschaft Veldes Confinien\\\" iz l. 1655. \u2014 hrani ga ljubljanski muzej \u2014
  nam ka\u017ee to prav jasno. Del, ki ho\u010de opisovati mejo v triglavskem kraju,
  se namre\u010d glasi:\\n\\n9) Meyers Gro\u00dfes Konversations-Lexikon: \\\"Cusa,
  N. v.\\\"\\n10) Lazius, W., Karten d. \u00f6sterr. Lande ... aus d. J. 1545\u201463.
  Hg. v. E. Oberhummer u. Fr. v. Wieser. Innsbruck 1906. Tafel VIII. Krain (Ducafas
  Carniolae).\\n11) Doti\u010dnega misala na Bledu menda ne bo, ker bi bil sicer \u017ee
  davno pogorel z \u017eupni\u0161\u010dem vred.\\n\\n\u201eVon danen siehet mann
  das Geb\u00fcrg Flitsch, von der Sp\u00fcz dieses Perges siehet mann den Chrainperg,
  bis auf den Pach Pischenig genanntdi und herabwerfs bey der Kh\u00e4rnerischen Sau
  der halbe Flu\u00df, bis auf die Poll\u00e4ner Pr\u00fcgge.\u201c\\n\\nKrivih tolma\u010dev
  je na\u0161el tudi na\u0161 \u201esummus vertex Creine montis\u201c. Zvezo \u0161tirih
  skupaj spadajo\u010dih besed so raztrgali na dvoje. Druga polovica, t. j. \u201eCreinae
  mons\u201c, je blejski gospodi \u017ee sama zase obveljala za topografsko oznako
  nekega mejnega hriba in prevedli so jo v \u201eKronberg\u201c ozir. \u201eKrainberg\u201c.
  V gornjem mejnem opisu Triglav pa\u010d \u0161e paradiro kot \u201evrhunev bov\u0161kega
  gorovja\u201c, vendar raz njega je dalje proti severu vidna \u0161e neka druga mejna
  to\u010dka, po imenu Krainberg. V gornjem Sinnacherjevem prevodu Cusanovega poro\u010dila
  pa nastopata obe te dve to\u010dki strnjeni v eno kot \u201evrhunev gore Krainberga\u201c;
  triglavski vrh je torej \u017ee pu\u0161\u010den v nemar.\\n\\nZa to izumetni\u010deno
  to\u010dko so celo na\u0161li resni\u010den kraj takega imena. Sinnacher pi\u0161e:
  \u201eDer Forst wird durch... die Spitze des Berges Creina, wahrscheindlich durch
  jenes Gebirg, das Krain von K\u00e4rnten scheidet... begr\u00e4nzt\u201c\\\\(^{11}\\\\).
  Krainberg je namre\u010d \u0161e danes nem\u0161ko ime za Strmico, vas na severnem,
  koro\u0161kem robu cestnega prelaza K\u00f3renskih Poljan\\\\(^{12}\\\\) (1073 m);
  ni\u017ee ob tej cesti, \u017ee pri dnu Zilske doline, pa stoji vas Pod Krajnikom
  (nem. Krainegg). Radi tega ni \u010dudno, \u017ee so se istemu razlaganju dali premotiti
  tudi na\u0161i zgodovinarji P. Hicinger\\\\(^{13}\\\\), Fr. Schumi\\\\(^{14}\\\\)
  in Fr. Kos\\\\(^{15}\\\\).\\n\\nPo Kosovi razlagi je meja blejskih lovskih pravic
  na severu bilo \u201egorovje na kranjsko-koro\u0161ki meji nad Kranjsko goro\u201c,
  Dobri potok mu je oni nad Tr\u017ei\u010dem, a Bistrica da pomeni Tr\u017ei\u0161ko
  Bistrico; \u201esummus vertex Creine montis\u201c pa mu je \u201enajvi\u0161ji vrh
  pri Kranjski gori\u201c. Izraz \u201eusque in medium fundum Sovve fluminis\u201c
  bi potemtakem pomenil gorenjsko Savo, ne bohinjske.\\n\\nImamo res slu\u010daj,
  ko ne more priti v po\u0161tev noben drug kraj kakor omenjeni Krainberg na Karavankah.
  Bilo je to l. 1263, ko sta si dva grofa Ortenburga razdelila dedi\u0161\u010dino,
  raztreseno po Koro\u0161kem in Kranjskem, in do- lo\u010dila za razmejilno to\u010dko
  \u201emons Chreinberch\u201c\\\\(^{16}\\\\). Pa tudi za prve \u010dase briksen\u0161kega
  gospodstva na Kranjskem bi se \u201esummus vertex...\u201c smel \u0161e postaviti
  prav tja, vkljub temu, da so bila posestva Briksna na levem bregu Save v primeri
  z onimi na desnem bregu raztresena in majhnega obsega; saj je bil Gorenjski kot
  v 11. in 12. stoletju sicer \u0161e \u201eherrenlos\u201c. Toda vsaj od srede 13.
  stoletja je briksen\u0161ka cerkev svoje godspostvo na Gorenjskem delila tudi z
  mogo\u010dnimi grofi Ortenburgi. Do\u010dim sta bila Freising in Briksen gospodarja
  bolj na desnem savskem bregu, so bili Ortenburgi prete\u017eno posestniki levega
  brega. Kar se ti\u010de Briksna posebej, nam je lega njegovih\\n\\n\\\\(^{11}\\\\)
  Sinnacher, l. c., II. 446.\\n\\\\(^{12}\\\\) Badjura, R., Jugoslovenske Alpe \u2014
  Slovenija. Ljubljana, 1922, 246.\\n\\\\(^{13}\\\\) Die polit. Verh\u00e4ltnisse
  Krains im Mittelalter. MHVK 1856, p. 33, Ann. 26.\\n\\\\(^{14}\\\\) L. c. p. 59.\\n\\\\(^{15}\\\\)
  L. c. \u0161t. 274, pripomba.\\n\\\\(^{16}\\\\) Schumi, l. c., II., 249, \u0161t.
  317.\\n\\nposestev ozna\u010dena prav jasno \u017ee v listini iz l. 1011., pa tudi
  v naslednji iz l. 1040., ki pravi: \u201einter duo flumina que vocantur Suowa, ab
  exortu usque ad concursum eorum\u201c\\\\(^{17}\\\\).\\n\\nJasno je torej, da morejo
  besede \u201esuper prediis ecclesiae suae\u201c iz l. 1073. imeti v mislih edinole
  Bled z Bohinjem in Triglavom. Da bi bil celo Cusanus v svojem opisu v 15. stoletju
  mislil na levi breg Save do karavan\u0161kega grebena, tega si menda ne bo upal
  trditi nih\u010de.\\n\\nTudi Bistrico in Dobri potok i\u0161\u010de Kos okoli Karavank
  in deva oboje k dana\u0161njemu Tr\u017ei\u010du. Mi pa bomo naleteli med nadaljnim
  razpravljanjem na obe imeni v vseh opisih mej dov\u0161kih in belope\u0161kih. In
  \u010de sta oba vodotoka \u2014 Dobri potok tudi pod imeni Gutenbach, Dobersnig,
  Dobresnec \u2014 \u0161e v novej\u0161ih \u010dasih tvorila mejo oblasti de\u017eelskega
  sodi\u0161\u010da v Beli pe\u010di proti sodi\u0161\u010du na Bledu, potem vodi
  istih imen, ki ju navaja listina iz l. 1073, skorajda ne smemo iskati drugod kakor
  prav tam. Bistrica more torej biti edino ona v Vratih, ki ji pravimo Triglavska,
  Dobri potok pa nam pomeni dana\u0161nji Dobr\u010dnik\\\\(^{18}\\\\), t. j. hudournik,
  ki doteka s Karavank, izpod Velikega vrha in Ro\u017e\u010dice, in \u0161e danes,
  kakor \u017ee v sivi starini, deli ob\u010dino dov\u0161ko od jeseni\u0161ke. Dobr\u010dnik
  ob hudi nalivih kaj rad podivja, dona\u0161a do svojega izliva blizu jeseni\u0161ke
  Hru\u0161ice mno\u017eine murja (Muren) in onemogo\u010da promet po dnu Gorenjske
  doline; v dneh 8. in 9. avg. t. l. je celo razdril del \u017eelezni\u0161ke proge\\\\(^{19}\\\\).\\n\\nPosledica
  krivega tolma\u010denja imena \u201esummus vertex Creine montis\u201c je bila, da
  je blejska gospoda za\u010dela v opise svojih mej mesto Triglavske Bistrice vpletati
  kranjskogorsko Pi\u0161enco (gl. gornji opis iz l. 1655.) in s po-hlepnimi rokami
  segati preko freisin\u0161kega posestva na Dovjem kar na ozemlje drugega soseda,
  Bele pe\u010di. Prisvajali so si pravico ribolova ob desnem bregu (gorenjske) Save
  navzgor ne samo do izliva Triglavske Bistrice, temve\u010d tja do izvira Save in
  \u017eiveli v stalnih sporih radi mej z Belo pe\u010djo.\\n\\nDovje je freisin\u0161ka
  cerkev prejela v last med l. 1029. in 1045.\\\\(^{20}\\\\). Meje dov\u0161kega posestva
  opisuje v ljubljanskem muzeju shranjeni belope\u0161ki dokument iz l. 1664. takole:\\n\\n\u201eErslich
  von der Sau nach dem Flu\u00df Dobripotok oder Dobersnig bi\u00df auf den Perg Velikiuarh,
  von danen auf die Chieppa Jeppa und Belza den Flu\u00df abwerfs bi\u00df an die
  Sau, und hin\u00fcber nach der Veistritz an die Lukhnia, Terglau Kerma, na Terfa,
  Zmisapelz in der Rodouna und Veliciplas gegen Dobersnik \u00fcber in der Moskachlia...\u201c\\n\\nPosestvo
  se je torej raztezalo od triglavskih sten preko Mojstrane in Dovjega tja na sleme
  Karavank, a se po svojem obsegu krije z arealom dana\u0161nje ob\u010dine Dovje.
  Ali to posestvo ne nastopa nikoli v pravnem oziru\\n\\n---\\n\\n\\\\(^{17}\\\\)
  Kos, l. c. \u0161t. 107.\\n\\n\\\\(^{18}\\\\) Badjura, l. c., 207.\\n\\n\\\\(^{19}\\\\)
  Gl. \u201eJutro\u201c 10. 8. 1926, \u0161t. 181. \u2014 Ob hudi nevihti dne 29.
  okt. t. l. je Dobr\u010dnik skupaj s Savo zopet silno razsajal.\\n\\n\\\\(^{20}\\\\)
  Kos, l. c. \u0161t. 85.\\n\\nkot enakovredno z obema velikima sosedama. Desetino
  in tlako so Dov\u017eani odrajovali v \u0160koifo Loko, sede\u017e uprave freisin\u0161kih
  posestev na Kranjskem, a v zadevah vi\u0161jega sodstva, lovstva in pa\u0161e je
  bilo posesivo razdeljeno med sosedni gospo\u0161\u010dini Bled in Belo pe\u010d.\\n\\nIz
  Bele pe\u010di imamo dvoje mejnih opisov, enega pri A. G\u0161irnerju iz l. 1664.,
  drugega pri A. M\u00fcllnerju iz l. 1626. ozir. 1573. Odstavek pri G\u0161irnerju,
  ki govori o meji belope\u0161ke de\u017eelske sodnije proti jugu, se glasi:\\n\\n\\\"Von
  Kerma abwerts nach der Feistritz auf die Saw, wo der dobripotok oder Dobresnee,
  so auf Teutsch guettenpach genant, in die Saw feli, dan abwerts der Saw raint Weissenfels
  mit der herrschaft Veldes alles nach der halben Wasserfl\u00fcssen zu verstehen.\\\"\\n\\nAko
  primerjamo ta opis z gornjim opisom dov\u0161ke ob\u010dine, vidimo, da je belope\u0161ka
  gosposka pri\u0161tevala k svoji de\u017eelski sodniji le karavan\u0161ki del Dovjega,
  triglavskega pa priznavala Blejski gospo\u0161\u010dini. Meja med obema deloma je
  korito Save od izliva Triglavske Bistrice do izliva Dobr\u010dnikovega. Beli pe\u010di
  je karavan\u0161ki del Dovjega bil posebne vrednosti: delal je zvezo od Kranjske
  gore proti Jesenicam in Radovljici. Blejecem pa je \u017ee listina iz l. 1073. dala
  pravico lova in ribolova v triglavskem delu Dovjega, zato jim ni bilo te\u017eko,
  pritegniti nase tudi vi\u0161je sodstvo nad njim.\\n\\nTudi opis mej Bov\u0161kega
  glavarstva je skrit v M\u00fcllnerjevo monografijo o \u017eelezu. V naslednjem sta
  podani vzporedno vrsti to\u010dk skupne bov\u0161ko-belope\u0161ke mejne \u010drte,
  kakor in kolikor jih navaja G\u0161irnerjev belope\u0161ki in M\u00fcllnerjev bov\u0161ki
  dokument. (G\u0161irnerjev opis je bilo mogo\u010de primerjati z originalom, ki
  ga hrani ljubljanski muzej, in tako popraviti nekatere napake.)\\n\\n1612: Schober
  \u2014 Manhart \u2014 Podgrat \u2014 Traunik \u2014 Vorsh\u016bk \u2014 Dingna \u2014
  Kroklia\\n1664: Mangari \u2014 podgrad \u2014 Traunlik \u2014 Versik \u2014 digna
  \u2014\\n\u2014 Presodniza \u2014 Prosek \u2014 Sadniza \u2014 Weisenbach \u2014
  Pichauz \u2014\\npresodnica \u2014 prosek \u2014 Sadnica \u2014 Willepotok \u2014
  pichalz \u2014 Lukna \u2014\\nTerglau \u2014 Carma.\\n\u2014 Terglou \u2014 Kerma.\\n\\nOba
  opisa se precej ujemata med seboj. Kakor je razvidno iz na\u0161tetih imen, se meja
  takrat \u0161e ni dr\u017eala povsod razvodnega alpskega grebena. Med Vr\u0161i\u010dem
  in Pihavcem je namre\u010d belope\u0161ki teritorij segal dale\u010d na so\u0161ko
  stran; njegova meja je tu delila prese\u0161ki gozd na mali bov\u0161ki in veliki
  belope\u0161ki del in obsegla planinske pa\u0161nike, ki imajo na njih pa\u0161ne
  pravice Borovci (Kranjskogorci) \u0161e danes, ko spadajo ti pa\u0161niki k tuji
  dr\u017eavi Italiji. S Pihavca dr\u017ei mejna \u010drta kakor danes po robu na
  Luknjo, iz Luknje\\n\\n21) L. c. p., 400.\\n22) Geschichte des Eisens in Krain,
  G\u00f6rz und Istrien. Wien 1909, p. 124 s.; tu pravi M\u00fcllner: \\\"\u00dcber
  die Grenzen dieser Herrschaft geben uns Urbarausz\u00fcge 1573 und 1626. Ausk\u00fcnfte\\\",
  potem pa citira le eno besedilo. Iz tega se da sklepali, da se oba izvle\u010dka
  glasita enako in da je starej\u0161i slu\u017eil kot predloga mlaj\u0161emu.\\n23)
  L. c., p. 653.\\n24) \u010cerm\u00e1k, J., Skupina Razorsk\u00e1. Knih. \u010d.
  spol. zem\u011bv\u011bd. \u010d. 5, Praha 1907, p. 5,\\n\\npo Plemenicah na vrh
  Triglava, od tu pa \u0161e na neko vi\u0161insko to\u010dko, ki ji dajeta oba opisa
  ime \u201eKrma\u201c. Od Krme dalje pa gresta meji obeh kompleksov vsaka na svojo
  stran; nadaljevanje belope\u0161kega besedila meje od Krme do Dobr\u010dnika je
  natisnjeno na isti strani zgoraj.\\n\\nPo svoji starosti sta si oba dokumenta primeroma
  malo narazen. M\u00fcllnerjev bov\u0161ki opis je bil napisan l. 1612., Gstirnerjev
  iz Bele pe\u010di pa datira iz l. 1664. Od poslednjega znatno starej\u0161a sta
  belope\u0161ka opisa, ki ju citira M\u00fcllner, eden je iz l. 1626, drugi pa celo
  iz l. 1573. V vseh pa je kot ena mejnih to\u010dk napisan tudi Triglav. Skrajni
  datum, ko se omenja Triglav, bi bilo potemtakem leto 1573. Toda imamo indirektnih
  dokazov, da je bilo triglavsko ime znano in zapisano \u017ee mnogo poprej.\\n\\nVsi
  natan\u010dnej\u0161i opisi mej segajo namre\u010d glede svojega postanka tako dale\u010d
  nazaj, kakor dale\u010d segajo po\u010detki urednej\u0161ega gospodarstva na doti\u010dnih
  posestvih. Saj to\u010dno znane meje so prvi pogoj reda v gospodarstvu. Opisi mej
  so se torej vedno in vedno obnavljali v obliki bolj ali manj vernih prepisov po
  predlogah starej\u0161ega datuma. Nastop novega gospodarja, najemnika ali oskrbnika,
  pa sestavljanje novih urbarjev in re\u0161evanje mejnih sporov, vse to so bili pogosti
  povodi temu obnavljanju.\\n\\nGornji opis bov\u0161kih mej je napravil Juri Filip
  Gera ob nastopu glavarske slu\u017ebe, kakor pi\u0161e na koncu opisa: \u201eaus
  alten Schriften, Behelfen, Confinsbeschreibungen, Aussage der alten M\u00e4nner
  mit Einehmung des Augenscheines, soviel ich in dem Gebirg steigen k\u00f6nnen im
  September 1612\u201c\\\\(^{25}\\\\). Tu omenjene predloge segajo vsaj do l. 1509.,
  ko je bil cesar Maksimiljan I. v vojni z Bene\u010dani zasedel m. dr. tudi Bov\u0161ko
  glavarstvo. Da najdemo morda Triglav zapisan \u0161e v starej\u0161ih dobah, bi
  bilo treba stikati za mejnimi opisi Tolminskega glavarstva. Enota Bov\u0161ke kotline
  je namre\u010d bila po l. 1086\\\\(^{26}\\\\) razdeljena na dva dela tako, da je
  ve\u010dji severozahodni del bil last furlanskega samostana v Ro\u017eacu, manj\u0161i
  pa je tvoril sestaven del Tolminskega. Trojna meja med Belo pe\u010djo in tedanjim
  Tolminskim in Bov\u0161kim glavarstvom je bila na Krokli (danes Kukla), torej severno
  od Triglava\\\\(^{27}\\\\).\\n\\nNa tem mestu moramo \u0161e zabele\u017eiti zanimivost,
  ki nam poro\u010da o njej A. Kaspre\\\\(^{28}\\\\), da je namre\u010d Triglav primeroma
  zgodaj do\u017eivel celo svoje upodobljenje. Zgodilo se je to v reljefu Bov\u0161kega
  glavarstva, ki ga je bil napravil isti zgoraj omenjeni bov\u0161ki glavar Gera med
  l. 1617. in 1619. Hranili so reljef v Gradcu, a je najbr\u017ee kmalu razpal, ker
  je bil iz proste ilovice; namenjen pa je bil vladarju v orientacijo ob pogostih
  mejnih spornih zadevah z Benetkami in Belo pe\u010djo. Vestni Gera je bil potemtakem
  \u00bbprvi, ki je plasti\u010dno zobrazil slikovit del slovenske zemlje. Nad vse
  obmejne gore in vrhe se je veli\u010dastno vzpenjal orja\u0161ki Triglav\u00ab.\\n\\n\\\\(^{25)}\\\\)
  M\u00fcllner, l. c., p. 653.\\n\\\\(^{26)}\\\\) Kos, l. c., \u0161t. 385.\\n\\\\(^{27)}\\\\)
  M\u00fcllner, l. c., p. 653.\\n\\\\(^{28)}\\\\) Pridvi\u017eni zemljevid bov\u0161kega
  glavarstva iz za\u010detka 17. stoletja. \u010cZN 1913, p. 37\u201440.\\n\\nDa je
  belope\u0161ki dokument iz l. 1664. tudi le prepis starej\u0161ega originala, nam
  pri\u010da A. M\u00fcllner\\\\(^{29}\\\\), ki pozna, kakor smo videli zgoraj, kar
  dva starej\u0161a opisa. Drugi sledovi pa gredo \u0161e dalje nazaj. Dokler so posestniki
  Gorenjske doline bili grofje Ortenburgi, tod \u0161e ni bilo pravega gospodarstva.
  A ko so ti l. 1421. izumrli in so dedi\u0161\u010dino prevzeli celjski grofje, je
  v desetih letih \u017ee stal tam grad Wei\u00dfenfels (1531) kot sredi\u0161\u010de
  urejenega gospodarstva. Po drugi strani je A. Gstirner dognal, da je de\u017eelsko
  sodi\u0161\u010de (Landgericht) v Beli pe\u010di obstajalo vsaj \u017ee l. 1464.
  Iz obojega se da sklepati, da mora prvotni izvirnik mejnih opisov belope\u0161kih
  segati v dobo med l. 1531. in 1464.\\n\\nKakor je za l. 1351. za Blejsko gospo\u0161\u010dino
  \u017ee dokazan uradni gozdar\\\\(^{30}\\\\), nam silno zmedeni mejni opis iz l.
  1655. vendar pri\u010da, da poznavanje ogromnega kompleksa v ogradi divjih alpskih
  grebenov in vrhov niti v 17. stoletju ni bilo zadostno. Da, celo iz l. 1720. beremo
  \u0161e samoobto\u017ebe: \\\"weil man doch an solcher Herrschaft kein aigentliche
  und grintliche Information nit hat\\\"\\\\(^{31}\\\\). Zato so spori blejske gospode
  s sosedji radi mej trajali tja do srede 18. stoletja. Belope\u0161ki mejni opis
  iz ljubljanskega muzeja vsebuje m. dr. tudi poseben seznam z naslovom \\\"Freiungen
  und Streitigkeiten in Landgerichts-Confininen\\\". Iz tega seznamov se da posneti,
  da je bil l. 1664. sporen ves svet ob meji od Mangarta do Krme. V severnem delu
  je vladal spor z Bovcem radi borov\u0161kih planin na oni strani Vr\u0161i\u010da,
  v ju\u017enem delu pa je \u0161e vedno me\u0161al pojme \\\"summus vertex ...\\\"
  ozir. Krainberg.\\n\\nKartografska zbirka ljubljanskega muzeja hrani zemljevid velikega
  merila z naslovom \\\"Karte von der dem Hochstifte Brixen geh\u00f6rigen im Lande
  Krain gelegenen Herrschaft Veldes.\\\" Legenda k tej karti: \\\"Die rothen Tupfen
  bezeichnen den Konfin, so wie selber laut Vertr\u00e4gen vom 5. J\u00e4nner 1668
  und 4. Juli 1749 best\u00e4tigt worden\\\", nam govori o dveh mejnih pogodbah. V
  dokumentu \\\"Vorl\u00e4ufige Grenzbeschreibung Ober-G\u00f6rjach\\\" iz l. 1825.,
  ki ga hrani mapni arhiv v Ljubljani, pa se na koncu dov\u0161ki \u017eupan sklicuje
  na pogodbo med Bledom in \u0160kofjo Loko z dne 11. avg. 1717. V prvi pogodbi je
  moral biti re\u0161en spor radi meje kje na jugu, s pogodbama iz l. 1717. ozir.
  1749. pa je bilo brez dvoma poravnano vpra\u0161anje blejskih mej proti Beli pe\u010di
  in Dovjemu. To se da sklepati tudi iz zbirke panoram\\\\(^{32}\\\\), ki je bila
  napravljena z o\u010ditnim namenom, da poslu\u017ei kot pripomo\u010dek v tem mejnem
  sporu. Te zbirke 19. list, ki se nam je kot edini re\u0161il v muzej, predstavljata
  namre\u010d po dolgem dolino Spodnje Krme in Radovine z dolino Kotom v ozadju; Kot
  in neka ograda v Krmi sta ozna\u010dena kot sporna. List pa nosi letnico 1701. Preskrbel
  je panorama \u2014 pa\u010d po naro\u010dilu blejske gosposke \u2014 Matija Lo\u010dnikar,
  ki je bil od 1685.\u20141725. \u017eupnik v G\u00f6rjah, prej pa na Jesenicah\\\\(^{33}\\\\).\\n\\n\\\\(^{29)}\\\\)
  L. c., p. 124. \u2014 Mejni spis iz l. 1655. gl. zg. p. 85.\\n\\\\(^{30)}\\\\) Sinnacher,
  l. c., V., 244.\\n\\\\(^{31)}\\\\) Sinnacher, l. c., IX., 307.\\n\\\\(^{32)}\\\\)
  M\u00fcllner, A., Ein Panorama aus den oberkrainer Alpen. Argo 1892, I., p. 36-38.\\n\\\\(^{33)}\\\\)
  Valvasor, l. c., II (VIII) 720.\\n\\nOmenjena blejska kart\u00e1 je sicer pozen,
  a vendar menda najstarej\u0161i dokument z Bleda, kjer nastopa na\u0161 Triglav
  s svojim prvim imenom, in sicer \\\"Veliki Terglau\\\" kot trojna mejna to\u010dka,
  a \\\"Mali Terglau\\\" znotraj blejskih mej. Vsa severna mejna \u010drta Blejske
  gospo\u0161\u010dine je na tej karti potisnjena od \u010drte ob Triglavski Bistrici
  proti jugu; na njej so do Mozaklje ozna\u010deni ti-le vrhovi: Gore, Mezesnovc,
  Lukna Pezh, Na Gomilje in Sredna Gora.\\n\\nIz podanih izzledkov je razvidno, da
  je Triglav oficijelno bil na blejsko-bohinjski strani izredno dolgo neznan in nepriznan;
  bil je zastrt od napa\u010dno pojmovane njegove prve oficijelne oznake (iz l. 1073.)
  \\\"summus vertex Creine montis\\\". Od belope\u0161ke in bov\u0161ke strani pa
  je Triglav dokumentari\u010dno dokazan za dobrih sto let (l. 1573) pred Valvasorjem,
  do\u010dim nam indirektna zasledovanja potrjujejo, da je ime Triglav slu\u017eilo
  v dokumentih \u017ee 250 let pred Valvasorjem.\\n\\nSvojemu visoko \u0161irle\u010demu
  rogu primerno slu\u017ebo vogalnega mejnika je Triglav dobil \u017ee l. 1073. Toda
  politika je na\u0161ega gorskega prvaka s te \u010dastne slu\u017ebe kmalu degradirala
  med redove. Vr\u0161il je samo poni\u017eno slu\u017ebo vmesne mejne to\u010dke,
  njegova slaba namestnica pa je bila gora Krma (Krainberg), dokler ga ni sredi 18.
  stoletja doba prosvitljenosti znova odkrila in priznala v vsej njegovi veli\u010dastnosti.\\n\\nII.\\n\\nGORA
  KRMA \u2014 VALVASORJEV TRIGLAV.\\n\\nV gornji \u010drtici smo spoznali zna\u010dilno
  vlogo, ki jo je igralo ime Krma \u0161e v Valvasorjevi dobi. Krmo navajajo dosledno
  vsi mejni opisi iz Bele pe\u010di in Bovca. Po njihovem besedilu se namre\u010d
  mejna \u010drta med Bovcem in Belo pe\u010djo na jugu ne kon\u010da vrh Triglava,
  ampak sega \u0161e nekam dalje proti jugu do to\u010dke, ki nosi omenjeno ime. Na
  Krmi je torej za Bov\u0161ko in Belope\u0161ko gospo\u0161\u010dino to\u010dka,
  kjer se pri\u010dne njuno meja\u0161enje z Blejsko gospo\u0161\u010dino: ona je
  trojna mejna to\u010dka.\\n\\nDanes se ime Krme razteza preko \u0161est km dale\u010d
  od Gornje Radovine tja do pod ju\u017enih sten triglavskega roga; pomeni nam zemlji\u0161\u010da
  in objekte gorjanskega kmetskega gospodarstva, ki se izmenjavajo s silnimi grobljami,
  melmi, murami in skladanicami hribinskih sten. \u0160iroko dno in strm izpodrezane
  strani v pre\u010dnem, a neenakomerno, stopnjevinasto spu\u0161\u010danje v podol\u017enem
  prerezu nam to divjeromanti\u010dno gorsko dolino ozna\u010dajo za kopanj\u00f3)
  (Trogta), t. j. nekdano re\u010dno dolino, ki so ji bili ledniki dali njeno dana\u0161nje
  lice. Smer doline je v stopnjevinastem gornjem delu naglo proti NE. Temu primerno
  razlikujemo tudi v poimenovanju dve Krmi, spodnjo in gornjo; jo\u017eefinski kataster
  pa pozna v dolini troje gozdnih kompleksov: Malo, Veliko in Spodnjo Krmo.\\n\\n1)
  Rus, J., Slovenska zemlja. Splo\u0161na knji\u017e. II. Ljubljana 1924, p. 7, 25.\\n\\nProf.
  J. Ravnik:\\n\\nTriglav izpod \u0160krlatice.\\n\\nDruga\u010de je bilo pred polovico
  18. stoletja. Za mejno to\u010dko namre\u010d taka dolga dolina ni bila primerna,
  \u0161e manj seveda kak gozdn\u00ed kompleks: takemu namenu je mogel slu\u017eiti
  le jasno dolo\u010den visok alpski vrh ali vsaj greben. In res pozn\u00e1 Valvasor
  goro tega imena. O njej nam ve pod posebnim poglavjem povedati v prvem stavku tole:
  \u201eMed Mojstrano in Bovcem na Gorenjskem stoji gora Krma (Kerma) v sredi med
  Kranjsko in bov\u0161ko de\u017eelico prav kakor kak razsojevalec\u201c). Krma mu
  je torej gora, da, ona je celo dale\u010d vidna mejna gora med kranjsko de\u017eelo
  in bov\u0161ko kotlino in edina, ki jo pozn\u00e1 na prostranem ozemlju od Mojstrane
  do Bovca in Bohinja. Temu nasproti je gorjanskemu \u017eupniku M. Lo\u010dnikarju
  samo na malem prostoru okoli Spodnje Krme in Gornje Radovine znanih kar 23 imen
  skupaj, a v ospredje svoje panorame je zarisal desni, t. j. ju\u017eni gorski rob
  doline Krme in mu napisal skupno ime \u201edas Geb\u00fcrg Kerma\u201c. Tudi Florjan\u010di\u010deva
  karta Kranjske iz l. 1744. ima poleg in blizu Triglava, ki je tu prvi\u010d javno
  ozna\u010den in tiskan, na sli\u010dnem mestu gorski venec z imenom \u201eMons Kerma\u201c.
  Pa \u0161e enkrat pride gora Krma na spregled, vendar tokrat izre\u010dno kot vi\u0161inska
  to\u010dka, njena lega pa je lo\u010dno, geodetsko dolo\u010dena. Mapni arhiv v
  Ljubljani hrani originale definitivnih opisov mej katastralnih ob\u010din bohinjske
  Srednje vasi in Zgornjih Gorij iz l. 1868. Vrh Velikega Dra\u017ekega vrha (2243
  m) je trojna mej\u00e1 teh dveh ob\u010din z ob\u010dino podstudorsko. Opis mej
  sredenjske ob\u010dine pravi potem dobesedno: \u201eOd Velikega Dra\u017ekega vrha
  dr\u017ei mej\u00e1 med desno planinski pa\u0161niki sredenjskimi in levo golim
  skalovjem gospo\u0161\u010dine Zgornje Gorje po gorskem hrbtu, pre\u010dka po 368
  se\u017enjih gorsko kopo Krmo (Bergkuppe Krm vrh, po gorjanskem opisu Bergkuppe
  Kerma) in dose\u017ee gorski vrh, Mali Dra\u017eki vrh imenovan.\u201c Razdalja
  med obema Dra\u017ekima vrhom zna\u0161a po obeh opisih povpre\u010dno 1285 m, gora
  Krma pa je od Vel. vrha oddaljena 700 m (= 368 klj), stoji torej skoraj na sredi
  grebena Dra\u017ekih vrhov.\\n\\nTi dokumenti nam poro\u010dajo o geografski legi
  Krme eden bolj dolo\u010dno od drugega. Vsi trije, Lo\u010dnikarjev v obliki panoramske
  slike, Florjan\u010di\u010d na kartografski na\u010din, dr\u017eavni kataster pa
  z besedo in mero, nam jo devajo na jug od Triglava. Krma teh dokumentov se torej
  po svoji legi vjema s Krmo, ki jo poznajo stari mejni opisi belope\u0161ki in bov\u0161ki
  kot skupno to\u010dko svojega meja\u0161enja proti Blejski gospo\u0161\u010dini.
  Druga\u010de je z Valvasorjevim opisom: ko opisuje goro Krmo, misli pri tem na \u2014
  Triglav.\\n\\n\u017de iz zgoraj podanega stavka Valvasorjevega o Krmi odseva jasna
  aluzija na Triglav, \u0161e bolj razlo\u010dno pa je Triglav ozna\u010den v drugem
  stavku, ki pravi: \u201eTa (sc. Krma) ima to \u010dudno lastnost, da na njegovem
  vrhu julija meseca dan kaj dolgo traja, tako da ne \u010duti\u0161 dosti ve\u010d
  ko eno uro, ko pojema no\u010d in polem nara\u0161\u010da dan\u201c). Krma se nam
  torej predstavlja kot\\n\\n---\\n\\n2) Valvasor, J. W., Die Ehre des Herzogthums
  Krain, I. (IV.) 562.\\n3) Gl. prip. 2. \u2014 Anastasius Gr\u00fcn opeva Triglav
  m. dr. takole:\\n\u201eDer Erste, der Morgens den Purpur tr\u00e4gt.\\nDer Letzte,
  der Abends ihn fallen l\u00e4\u00dft.\u201c\\n\\nvisoko mole\u010d gorski vrh, ki
  mu solnce zjutraj zabli\u0161\u010di prej ko vsem goram daljne okolice, a mu sveti
  zahajajo\u010de solnce \u0161e dolgo kot zadnji to\u010dki na povr\u0161ju Slovenske
  zemlje; radi tega da se v vedrih poletnih \u010dasih no\u010d na Krmi prav ob\u010dutno
  skraj\u0161a a dan podalj\u0161a. Imamo pa v Valvasorjevem delu \u0161e dvoje mest,
  katerih zmisel nas nedvomno navaja na vrh Triglava. Na kraju 1. poglavja 3. knjige
  pi\u0161e Valvasor: \u00bbJaz tudi nikakor ne dvomim, da so nekateri kranjski sne\u017eniki
  \u0161e mnogo vi\u0161ji kakor tadva zgoraj omenjena, namre\u010d kakor Notranjski
  Sne\u017enik in \u201eBistri\u0161ki sne\u017enik\u201c, ki jima je bil izmeril
  vi\u0161ini. Da ima tu v mislih v prvi vrsti goro Krmo (Triglav), se da sklepati
  iz drugega mesta, kjer v poglavju \u201eo raznih zeli\u0161\u010dih na Kranjskem\u201c
  pripominja: \u00bbPoleg doslej omenjenih imamo \u0161e ve\u010d drugih, dobrih,
  izbranih in slavnih zeli v na\u0161i de\u017eeli, to posebno na visokem gorovju,
  kakor na gorah Krma, Veliki Stol, Bistrica, Nanos in U\u010dka gora\u201c. V kratki
  vrsti petih gora tedanje Kranjske so, kakor vidimo, zastopane vse obse\u017enej\u0161e
  visoke gorske skupine. Na \u010delo zastopnikov Karavank in Kamni\u0161kih Alp ter
  notranjskega in istrskega Visokega Krasa pa je Valvasor postavil zopet svojo goro
  Krmo v Triglavskem pogorju; dal je prednost gori, ki jo je, kakor se bomo \u0161e
  prepri\u010dali, od vseh najmanj poznal.\\n\\nV slu\u010daju Valvasorjeve gore Krme
  gre potemtakem za zmoto, ki je v o\u010deh na\u0161ega intimnega razmerja do Triglava
  tako velika, da se nam zdi, kakor da je zasluzni mo\u017e v svoji dolenjski poni\u017enosti
  pozabil na stre\u0161no sleme svoje sijajne zgradbe postaviti vsaki na\u0161i vasi
  neizogibni zvonik. Kako to, da je pri\u0161la v Valvasorjeve knjige Krma, pa ne
  Triglav?\\n\\nKar se ti\u010de poizvedovanja krajevnih imen, je bil Valvasor odvisen
  od zastopnikov kranjskega ljudstva in izobra\u017eenstva. Tako si A. M\u00fcllner)
  v mislih predstavlja Valvasorja, kako je po svoji navadi prijahal tudi v dolino
  Krmo, toda ne dalje kakor do zadnjega kmeta, in izvaja: \u00bbRealni kmetje, ki
  mislijo samo na svoje pa\u0161nike in \u010drede, so mu imenovali Krmo, v katere
  zadnjem koncu stojijo \u0161e skrajni ov\u010darski stani, in tako je pri\u0161el
  Triglav pod imenom \u201eKrma\u201c v njegovo knjigo\u00ab. E. H. Costa) celo domneva,
  da je v 17. stoletju, f. j. v dobi Valvasorjevi (1641\u20141693), najvi\u0161ji
  kranjski gori bilo ime Krma. Fr. Schumi) pa misli ob gori Krmi na Mali Triglav.\\n\\nDa
  Costovo mnenje ne dr\u017ei, nam daje prednja \u010drtica dovolj dokazov. \u010ce
  pa je bil Valvasor dospel osebno v dolino Krme, tedaj je verjetna samo M\u00fcllnerjeva
  razlaga, ker v Gornjo Krmo, Malemu Triglavu na dogled, kakor misli Schumi, se prav
  gotovo ni bil dvignil.\\n\\n1) I. (III.) 303.\\n2) I. (III.) 360.\\n3) \u00dcber
  geographische Nomenklatur. Argo 1893, II., 32.\\n4) \u00dcber den Ursprung des Namens
  des Berges Triglav. MHVK 1856, p. 23: \u00bbEs mu\u00df also dieser h\u00f6chste
  Berg Krains damals Kerma und nicht Triglav gehei\u00dfen haben, oder dem Valvasor
  der Berg und der Name Triglav fremd gewesen sein, was nicht anzunehmen ist.\u00ab\\n5)
  Coll. Schumi v muzeju, \u0161t. 30.\\n\\nO zanimivem razmerju Valvasorjevem do triglavske
  pokrajine bo govora v posebnem sestavku. Tu naj povdarnimo samo to, da je od vsega
  razumni\u0161tva in izobra\u017eenstva na tedanjem Kranjskem spoznal le dva mo\u017ea,
  ki sta mu o divjem alpskem svetu vedela kaj ve\u010d povedati. To sta bila dva doktorja
  medicine, eden je bil Lovro pl. Rechberg, drugi Janez K. Petermann. O prvem ni ni\u010d
  znanega. Verjetno, da je kot zdravnik spadal med botanike, ki pripoveduje o njih
  Valvasor, da jih stikanje za zdravilnimi zeli\u0161\u010di privede v Alpe vi\u0161e
  ko druge zemljane. Dr. Petermann pa je bil \\\"romano-pontificius resolutorum coacademicus\\\"
  in fizik-zdravnik de\u017eelnih stanov kranjskih, torej \u017ee kot tak kranjskemu
  baronu Valvasorju precej blizu; najdemo ga celo med osmerico, ki je po tedanjem
  obi\u010daju v vezanih besedah \u010dastitala Valvasorju na njegovem sijajnem delu\\\").\\n\\nV
  Valvasorjevem pripovedovanju o gorenjskih krajih najdemo Petermannova omenjenega
  kar na \u0161tirih mestih, kjer se nam razodeva ne samo strokovnjak svojega poklica
  \u2014 analiziral je namre\u010d neko kiselico pod Ljubelom \u2014, temve\u010d
  tudi alpski lovec in za tedanje \u010dase redek prijatelj narave. Dr. Petermann
  je na\u0161emu pisatelju poslu\u017eil s svojim poznavanjem rudne Bel\u0161\u010dice)
  in \\\"mrzlega\\\" Velikega Stola), \u010digar izredno lepi razgled na pol Koro\u0161ke
  in Kranjske ne more prehvaliti. Na njega in drja. Rechberga se sklicuje Valvasor
  tudi v poglavju o Krmi). Ko namre\u010d pripoveduje o nevihtah, ki na Krmi baje
  nastanejo \u017ee, \u010de kdo poka z bi\u010dem, in se poziva na izpovedi prebivalcev
  iz okolice, tedaj kli\u010de za pri\u010di \u0161e oba zdravnika, \u010de\u0161:
  \\\"Beide Doctores der Medizin haben solches vor wenig Jahren selbst pers\u00f6nlich
  gesehen.\\\" Iz tega je razvidno, da se tudi oba omenjena zdravnika nista bila povzpela
  po dolini Krmi tako dale\u010d in tako visoko, da bi dospela pred obli\u010de \\\"najvi\u0161jega\\\"
  in ga identificirala. Valvasorja pa sta v njegovi veri na goro Krmo o\u010dividno
  le potrdila in mu pregnala vsak dvom, ki bi bil mo\u017een glede tega imena.\\n\\nM\u00fcllnerjeve
  besede o realizmu kmetskega ljudsiva imajo na sebi dosti resnice. Tega realizma
  pa tudi pri samem Valvasorju ne manjka. Vkljub temu se M\u00fcllner hudo moti, ko
  trdi, da je Valvasor Triglav pa\u010d poznal, da pa je kakor pri preprostem ljudstvu
  tudi pri njem prevladalo prakti\u010dno, realisti\u010dno pojmovanje \\\"gore\\\"
  in da samo radi tega Triglava, neproduktivnega, pustega in skalnatega kolosa ne
  omenja z nobeno besedo. Kaj takega bi smeli pri\u010dakovati od vsakogar, nikdar
  pa od Valvasorja, ki je stikal za posebnostmi kakor ni\u010d\u010de ne pred njim
  ne za njim. Tudi tega ne smemo trditi, da Triglavovo ime Valvasorju ni pri\u0161lo
  do u\u0161es.\\n\\n9) Doti\u010dna Petermannova pesem \\\"Allusio panegyrica...
  ad autorem\\\" je z drugimi vred natisnjena na \u010delu prve knjige \\\"Die Ehre
  d. H. Krain\\\".\\n\\n10) I. (IV.) 603.\\n11) I. (IV.) 576.\\n12) I. (IV.) 561.\\n13)
  Gl. prip. 2.\\n14) Gl. prip. 6.\\n\\nMorda ga je bil sli\u0161al, ali ker njemu
  ob mislih na Krmo ni mogel prisoditi va\u017enosti, ki mu pristoja, ga tudi ni apercipiral
  v svojo du\u0161evnost.\\n\\nKakor je sicer Valvasor dobil po svojem po\u017ertvovalnem
  prizadevanju v roke, lahko re\u010demo, vso obstoje\u010do literaturo o Kranjski
  in jo primerjajo\u010d spretno vpletal med svoja osebna opa\u017eanja, o triglavski
  pokrajini vendar ni imel nobenega avtorja na razpolago. Tudi v arhivih in kronikah
  gradov in \u017eupni\u0161\u010d je imel z ozirom na Triglav prav malo bere; vse
  kar mu je bilo med dokumenti v tem oziru na razpolago, so bili opisi blejskih in
  belope\u0161kih mej\\\\(^{15}\\\\). Vendar to\u010dnej\u0161ih informacij o Triglavskem
  pogorju je mogel najti le v mejnih opisih na Jesenicah, kjer je bil ob njegovem
  \u010dasu sede\u017e belope\u0161ke gosposke. Na Bledu namre\u010d oficijelno niso
  poznali ne Triglava ne Krme, zato pa so belope\u0161ki mejni opisi razkrili Valvasorju
  znamenitost, da se na gori Krmi stikajo zemlji\u0161\u010da treh velikih gospo\u0161\u010din.
  Valvasorjeve besede, da stoji gora Krma v sredi med Kranjsko in bov\u0161ko de\u017eelico
  prav kakor kak razsojevalec (gleichsam ein Schiedsmann)\\\\(^{16}\\\\), se nam zdi,
  da namigavajo dovolj razlo\u010dno na te mejne opise.\\n\\nMed vrsto to\u010dk belope\u0161ke
  meje je na Jesenicah dobil pred o\u010di tudi ime \u201eTerglou\u201c. Da se ob
  tem imenu ni bil ustavil, se da razlagati \u017ee iz dejstva, da pride takoj za
  Triglavom na vrsto gora Krma, ki je o njej mogel brati vendarle le nekaj ve\u010d
  kakor golo ime.\\n\\nVzemimo zdaj mo\u017enost, da je bil Valvasor triglavsko ime
  tudi sli\u0161al. Tedaj so mu ga doma\u010dini gotovo izgovorili prav tako, kakor
  izgovarjajo njihovi potomci danes, namre\u010d Targwou; ker po Fr. Ramov\u0161evi\\\\(^{17}\\\\)
  ugotoviti se je bil antekonzonanti\u010dni l v gorenj\u0161\u010dini in koro\u0161\u010dini
  preobrazil v w \u017ee sredi 16. stoletja, torej dobrih sto let pred Valvasorjem.
  Pisali pa so triglavsko ime, kakor se lahko prepri\u010damo iz mejnih opisov \u2014
  pa\u010d pod uplivom tradicionalnega knji\u017eevnega pisanja \u2014 vselej z l-om.
  Ali vokala v obeh delih Triglavovega imena, sta vendar tudi v pismu ostala ista,
  kakor ju je ljudstvo izgovarjalo, torej \u201eTerglou\u201c. Do ortografsko pravilnega
  imena \u201eTriglav\u201c so se povzpteli \u0161ele slavisti Zoisovega kro\u017eka
  polnih sto let za Valvasorjem, do\u010dim je A. T. Linhart\\\\(^{18}\\\\), zgodovinar
  iz istega kro\u017eka, celo umel spraviti goro Triglav v zvezo s staroslovanskim
  bogom Triglavom.\\n\\nBog Triglav tudi Valvasorju ni neznan. Omenja ga dvakrat kot
  boga severnoslovanskih plemen \u0160tetincev, Pomorjanov in Sklavov, a \u0160telinci
  da so mu na \u010dast dr\u017eali in \u010dastili \u010drnega konja. Pi\u0161e pa
  njegovo ime obakrat \u201eTrigla\u0159\u201c\\\\(^{19}\\\\). Costa, ki je to Valvasorjevo
  poglavje poznal, zato tudi ni dopu\u0161\u010dal mo\u017enosti, da bi triglavska
  gora po svojem interesantnem imenu\\n\\n---\\n\\n\\\\(^{15}\\\\) Gl. prvo \u010drlico
  zgoraj.\\n\\\\(^{16}\\\\) Gl. prip. 2.\\n\\\\(^{17}\\\\) Histori\u010dna gramatika
  slovenskega jezika, II., Ljubljana 1924, \u00a7 4 in 19.\\n\\\\(^{18}\\\\) Versuch
  einer Geschichle von Krain... Ljubljana 1788\u201491, II. 256.\\n\\\\(^{19}\\\\)
  II. (VII.) 380 s.\\n\\\\(^{20}\\\\) Gl. prip. 7.\\n\\nostala Valvasorju tuja. Saj
  mitologija in z njo vezana etimologija sta bili nekdaj objekt najve\u010djega zanimanja,
  a specijalno v Valvasorjevih folijantih je marsikatera stran izpolnjena z vpra\u0161anji
  te vrste. In vendar se Costa zelo moti. Pogre\u0161il je v tem, da je ortografsko
  pravilni \\\"Triglav\\\" svoje dobe deval tudi v starinske \u010dase Valvasorjeve.
  V resnici pa se Valvasorjevim \u010dutom ne po gorenjsko izgovarjani \\\"Targwodu\\\"
  ne pisani \\\"Terglou\\\" \u2014 oba z naglasom na drugem delu besede \u2014 nista
  mogla zdeti, da bi bila koli\u010daj sli\u010dna \u0161tetinskemu bo\u017eanskemu
  imenu \\\"Triglat\\\". Radi tega ta slu\u010daj Valvasorja niti ni mogel speljati
  na tako priljubljena pota etimologiziranja, zato tudi o kakem \u010de\u0161\u010denju
  tega boga med starimi Slovenci ni napisal besedice.\\n\\nPo utisih, ki jih dobimo
  iz teh podatkov in razmi\u0161ljanja o Krmi na eni ter Triglavu na drugi strani,
  nam bo zdaj jasno, zakaj je Valvasorju ime Triglav ostalo tuje. Ker pa je njegovemu
  impozantnemu vrhu, ki ga je imel priliko opa\u017eati \u017ee iz svojih daljnih
  dolenjskih krajev, hotel dati ime, imenoval je ta vrh z imenom \\\"Krma\\\". To
  ime mu je namre\u010d edino izmed vseh v Triglavskem pogorju vzbudivo nekaj zanimanja.
  Prvi\u010d ono je, kakor danes, tako \u017ee tedaj pomenilo kultivirano gorsko dolino,
  ki se je po njej mogo\u010de pribli\u017eati Triglavu na najbolj komoden na\u010din
  \u2014 jasen znak, da je v Valvasorjevi glavi tudi v tem slu\u010daju prevladal
  realizem njegove dobe. Drugi\u010d pa je ime Krma veljalo v sodobnih dokumentih
  kot skupna to\u010dka treh gospo\u0161\u010din. Zato je popolnoma razumljivo, \u010de
  Valvasor meje med Gorenjsko dolino in Bov\u0161ko kotlino ni postavil drugam kakor
  na najvi\u0161jo in najbolj vidno gorsko to\u010dko; tudi nobeden izmed nas si na
  Valvasorjevem mestu v ulogi trojne mejne to\u010dke ne bi bil mogel predstavljati
  katerekoli \u0161tevilnih gora Gorenjskega kota, ampak edinole med visokimi najvi\u0161jo.\\n\\nSli\u010dne
  postopke v rabi krajevnih imen moremo tudi danes opa\u017eati vsepovsod. Da pa bo
  mo\u017enost takega slu\u010daja pri Valvasorju docela potrjena, treba nam je pokazati
  iz njegovih knjig samo tale posebno jasen analogon. V Kamni\u0161kih Alpah je bil
  Valvasor spoznal reko Kamni\u0161ko Bistrico\u00b9), enako tudi dolino in gozdovje\u00b2)
  tega imena. A ko je hotel dati ime tudi divjim goram, ki delajo Bistrici veli\u010dastni
  okvir, kaj je bilo bolj priprosto, kakor da jih je krstil z \\\"Bistri\u0161kim
  gorovjem\\\"\u00b3), neki vrhunc, ki mu je bil zmeril vi\u0161ino, pa z \\\"Bistri\u0161kim
  sne\u017enikom\\\"\u2074) ali kar enostavno z \u2014 \\\"Bistrico\\\"\u2075). Ves
  postopek Valvasorjev nam le\u017ei tu na dlani. Vkljub temu ho\u010demo navesti
  \u0161e drug slu\u010daj, to pa zato, ker ga imamo iz Vrat, t. j. iz najbli\u017eje
  sose\u0161\u010dine Krme in Triglava. Starodavno Triglavsko Bistrico, ki se omenja
  \u017ee l. 1073. in potem redno v vseh mejnih opisih, pozna namre\u010d\\n\\n\u00b9)
  I. (II.) 152.\\n\u00b2) I. (II.) 137, 145.\\n\u00b3) I. (II.) 99, 110.\\n\u2074)
  I. (III.) 302.\\n\u2075) I. (III.) 380.\\n\\nValvasor le pod imenom Mojstrana\\\\(^{25}\\\\)).
  Ime naselbine ob vodi je komodno prenesel na vodo samo. Ali ni tako izpreminjanje
  krajevnih imen tudi danes splo\u0161en pojav? Bistrico, ki te\u010de skozi dolenijsko
  Ribnico, n. pr. imenujejo tuji\u010di kratko in ro\u010dno z Ribni\u0161\u010dico
  iz enostavnega vzroka, ker jim njeno pravo ime ni znano. In prav tak\u0161en tujec
  se nam zdi na\u0161 Dolenjec Valvasor pod vzvi\u0161enim gorenjskim Triglavom.\\n\\nR\u00e9sum\u00e9.
  \u2014 Der Triglav. Historisch-geographische Skizzen. 1. Der Triglav vor Valvasor.
  Es werden auf Grund der erreichten Konfinsbeschreibungen der Herrschaften Bled,
  Dovje, Bela pe\u010d und Bovec die \u00e4ltesten dokumentarisch bewiesenen Anf\u00fchrungen
  der h\u00f6chsten Bergspitze Sloveniens und Jugoslaviens besprochen. 1073 wird ihrer
  zum erstenmal Erw\u00e4hnung getan als \u201esummus vertex Creinae montis\u201c.
  Die direkt bewiesene Existenz ihres heutigen Namens Triglav (spr. Triglau) reicht,
  allerdings in orthographisch unrichtigen Fassungen, bis 1573, also gute hundert
  Jahre vor Valvasor (1689). Trotzdem ist der Name Triglav Valvasor unbekannt geblieben.\\n\\n2.
  Der Berg Krma \u2014 Valvasors Triglav. Von allen Bergspitzen zwischen Mojstrana,
  Bovec und Bohinj kennt Valvasor einzig und allein den Berg \u201eKerma\u201c. Nur
  dieser Name vermochte in seinem realistischen Kopfe einiges Interesse zu erwecken.
  Er bedeutete erstens ein kultiviertes Hochtal, durch das man sich auf die bequemste
  Weise dem Triglav n\u00e4hern kann und zweitens galt zu seiner Zeit als dreifacher
  Grenzpunkt der alpenhaftesten Herrschaften der Slovenischen Erde. Valvasor nennt
  die Krma an drei Stellen seines Werkes und legt ihre alle Merkmale bei, die eine
  Alpenspitze als die h\u00f6chste in Krain charakterisieren k\u00f6nnen.\\n\\nHENRIK
  TUMA:\\n\\nKRNICA IN POLICA.\\n\\n1. Krnica.\\n\\nEno najza\u010dilnej\u0161ih imen
  v Alpah je Krnica. Na Koro\u0161kem, kjer se dotika slovensko in bavarsko nare\u010dje,
  prevaja se krnica za Kar ali Kor. Krni\u0161ka \u0160pica v Vi\u0161ki skupini 2335
  m je nem\u0161ka Korspitze, do\u010dim je Krni\u0161ka \u0160pica 1973 m \u0161e
  Karnitzenspitze, Krni\u0161ka Grapa v Kanalski dolini pa je pokvarjena v Krunzengraben.
  Krnica v bistvenem pomenu je po staro dolenj\u0161\u010dini velika, iz lesa izdolbljena,
  izkrnjena skleda, v poslovici: \u201eTako je po\u017ere\u0161en, da bi po\u017erl
  celo krnico\u201c. Ta pomen je prenesen na izpodjedeno vodno strugo, tolmun, v katerem
  se su\u010de voda. Pleter\u0161nik: tiefe Stelle im Wasser, T\u00fcmpel, Wasserwirbel,
  Flussstief, Kesseltal. Krni\u010dica je lesena skledica za sol, isto krni\u010dka
  ali ne\u010dkica. Po Schmellerjevem etimologi\u010dnem slovarju bavarskega nare\u010dja
  je Kar razli\u010dna posoda v sestavljenkah Beikar, Peihar (iz tega slovenski pehar),
  Brunnkar (korito pri vodnjaku), Fischkar, K\u00e4skar, Mehlkar; der Kar, Mass f\u00fcr
  Getreide, bo pa\u010d za korec.\\n\\n\\\\(^{25}\\\\) I. (II.) 156.\"", "\"Begunje
  na G Begunje na Gorenjskem, 23 orenjskem, 23 orenjskem, 23. 4 . 4. 4 . 4. 2008 .
  2008 . 2008,  \u0161t. 2 ,  \u0161t. 2 ,  \u0161t. 26\\n\\nDrage krajanke in krajani!\\n\\nObele\u017eitev
  dogodkov iz na\u0161e preteklosti, ki so jim posve\u010deni tudi na\u0161i prazniki,
  bo letos nekoliko druga\u010dna kot obi\u010dajno. V Begunjah bo 27. aprila potekala
  osrednja dr\u017eavna proslava v po\u010dastitev dneva upora proti okupatorju, na
  kateri bo slavnostni govornik predsednik republike. Zato letos \u0161e ene sve\u010danosti
  ob 4. maju \u2013 krajevnem prazniku, na pokopali\u0161\u010du talcev v gra\u0161\u010dinskem
  parku ne na\u010drtujemo.\\n\\nNa na\u0161i lokalni ravni bodo mogo\u010de prvomajski
  prazniki najbolj pra\u017enji v Dvorski vasi, kjer bomo \u0161tevilne luknje v makadamski
  lokalni poti zamenjali z novo asfaltno prevleko. Najbolj slovesni pa bodo v Begunjah,
  kjer bo, kot \u017ee re\u010deno, potekala osrednja dr\u017eavna proslava, kjer
  \u017eelim, da se sre\u010damo v najve\u010djem \u0161tevilu. Na krajevno kulturno
  prireditev pa vas vabim 9. maja ob 19.00 v Center Polj\u010de.\\n\\nNaj vam v imenu
  sveta KS Begunje in tudi v mojem imenu za\u017eelim prijetno praznovanje prvomajskih
  praznikov in prav tako 4. maja \u2013 praznika KS Begunje.\\n\\nPrireditve ob krajevnem
  prazniku \u2013 4. maju\\n\\nNedelja, 27. april ob 13.00\\n\\nLeto\u0161nja dr\u017eavna
  proslava ob dnevu upora proti okupatorju bo v nedeljo, 27. aprila, ob 13. uri, na
  nogometnem igri\u0161\u010du v Begunjah. Slavnostni govornik bo predsednik Republike
  Slovenije dr. Danilo T\u00fcrk. Umetni\u0161ki program proslave, ki ga je ustvaril
  Matija Mil\u010dinski s sodelavci, prikazuje usode posameznikov v \u010dasih uporov.
  Besedila in glasba so izbrani ve\u010dinoma med deli knji\u017eevnikov in skladateljev,
  ki so se rodili ali \u017eiveli in delovali na \u0161ir\u0161em obmo\u010dju radovlji\u0161ke
  de\u017eele. Tudi prete\u017eni del ustvarjalcev in nastopajo\u010dih prihaja iz
  teh krajev, nastopili bodo Harmonikarski orkester Glasbene \u0161ole Radovljica,
  operna pevca Janja Hvala in Janko Vol\u010dan\u0161ek, Pihalni orkester Lesce, plesalke
  Blejskega plesnega studia, igralci Alenka Bole Vrabec, Sabina Kogov\u0161ek Zrnec,
  Gregor \u010cu\u0161in in Gaber Kristjan Trseglav, Aleksander Me\u017eek in drugi.\\n\\nOrganizator
  proslave je Protokol Republike Slovenije, ki je k sodelovanju povabil Ob\u010dino
  Radovljica, Krajevno skupnost Begunje, PGD Begunje in \u0160portno dru\u0161tvo
  Begunje. Proslavo bosta iz Begunj neposredno prena\u0161ala prvi program Televizije
  Slovenija in prvi program Radia Slovenija.\\n\\nTa dan bo popolna zapora ceste od
  Jo\u017eovca do zbiralnice mleka od 12.30 do 14.30 ure. Parkiranje v centru Begunj
  ne bo mo\u017eno.\\n\\nPetek, 9. maj ob 19.00 \u2013 Center za obrambno usposabljanje
  Polj\u010de:\\n\\nKrajevna kulturna prireditev ob prazniku.\\n\\nNastopili bodo
  u \u010d enci \u0161ole iz Begunj, \u0161olski pevski zbor Murke, folklorna skupina
  Begunj\u0161 \u010d ica, otroci doma \u010d ega vrtca, pevski zbor A. T. Linharta
  Radovljica, Petra Antolin in drugi gostje.\\n\\nVsi nastopajo\u010di bodo veseli
  va\u0161ega obiska. Vstop prost.\\n\\nNikoli ti niso dane sanje, ne da bi ti bila
  dana tudi mo\u010d, da jih uresni\u010di\u0161. (Richard Bach)\\n\\n2\\n\\n1. gorski
  tek na Roblek\\n\\n\u0160portna zveza Radovljica vabi na prvi gorski tek na Roblek.
  Pri\u010detek teka bo 1. maja ob 11. uri v Dragi. Ve\u010d informacij \u2013 Jure
  Vre\u010dek, \u0160Z Radovljica.\\n\\nPo doma\u010de v Krpinu\\n\\nTuristi\u010dno
  dru\u0161tvo Begunje tudi letos vabi na tradicionalno glasbeno prireditev \u00bbPo
  doma\u010de v Krpinu\u00ab, v soboto, 14. junija 2008 ob 18.00. Za glasbo in dobro
  po\u010dutje bo poskrbljeno. Vabljeni.\\n\\nO kresi se dan obesi\\n\\nTudi v leto\u0161njem
  letu bo grad Kamen 23. junija 2008 za\u017earel v svojem sijaju. Prireditve, ki
  se bodo odvijale na gradu tega dne, so namenjene predvsem krajanom KS Begunje, pa
  tudi drugim obiskovalcem. Program se bo za\u010del po 17. uri, kot vsako leto bo
  nastopil Pihalni orkester Lesce, za najmlaj\u0161e bo otro\u0161ka predstava, maturantje
  srednje \u0161ole za gostinstvo in turizem bodo pri\u010darali duha kresne no\u010di,
  obudili obi\u010daje in postregli obiskovalcem, nazadnje pa bo seveda zagorel kres.
  Ve\u010d o dogajanju in to\u010dnem programu pa boste \u0161e obve\u0161\u010deni.\\n\\nO\u010distimo
  svoj kraj\\n\\nPo na\u0161ih krajih sta  potekali dve \u010distilni akciji. U\u010denci
  in u\u010diteljice podru\u017eni\u010dno \u0161ole Begunje so v petek, 18. aprila
  z akcijo \u00bbO\u010distimo na\u0161 doma\u010di kraj\u00ab v sodelovanju s turisti\u010dnim
  dru\u0161tvom in krajevno skupnostjo o\u010distili okolico glavnih\\n\\ncest v kraju.
  \u00bbSmo eko\u0161ola in to je ena izmed vzgojnih dejavnosti, v kateri sodelujemo
  vsako leto. Pogre\u0161am pa predvsem stare star\u0161e u\u010dencev. \u010cudi
  nas, da se na\u0161emu vabilu ne odzovejo v ve\u010djem \u0161tevilu, da bi skupaj
  o\u010distili kraj,\u00ab je dejala vodja \u0161ole Nata\u0161a Vre\u010dek.\\n\\n\u0160portno
  dru\u0161tvo Dvorska vas je v soboto, 5. aprila v sodelovanju s KS organiziralo
  \u010distilno akcijo. \u010ci\u0161\u010denja se je udele\u017eilo 32 \u010dlanov
  in \u010dlanic, ki so o\u010distili okolico poti in cest od gradu Drn\u010da do
  Zg. Otoka. Organizatorje je razveselila velika udele\u017eba mladih. Nabrali so
  za polno avtomobilsko prikolico odpadkov, ki so bili odpeljani v zbirni center v
  Radovljico. Vsem udele\u017eencem se \u0161portno dru\u0161tvo zahvaljuje za prispevek
  k lep\u0161emu izgledu kraja.\\n\\n3\\n\\nFestival Avsenik, 20.\u201325. avgust
  2008\\n\\nSpo\u0161tovane krajanke, spo\u0161tovani krajani Begunj!\\n\\nVsi poznate
  Gostilno Avsenik in njen pester glasbeni program, ki skozi celo leto v Begunje privablja
  nemalo turistov, doma\u010dih in tujih. Za nas pa ste najpomembnej\u0161i gostje
  prav vi \u2013 doma\u010dini, zato vam \u017eelimo predstaviti leto\u0161nji\\n\\ndogodek,
  ki bo proslavil 55 let Avsenikove glasbe in s katerim \u017eelimo pozitivno vplivati
  na promocijo na\u0161ega lepega kraja. Zavedamo se, da je pri vsaki stvari, pa naj
  bo \u0161e tako pozitivno naravnana, tudi kak\u0161na stvar, ki moti in nam dela
  sive lase. Zato se vam \u017ee vnaprej opravi\u010dujemo za morebitne nev\u0161e\u010dnosti
  in probleme, ki bodo spremljali prvi Festival Avsenik. Prvi zato, ker si \u017eelimo,
  da postane tradicionalen in da bomo lahko vsako leto gostili v Begunjah smetano
  narodnozabavne glasbe. Zdi se nam prav, da se pri vsej poplavi tovrstnih prireditev,
  doma in po svetu, kon\u010dno zgodi tudi v Begunjah, tam, od koder izhaja.\\n\\nFestival
  Avsenik se bo odvijal od 20. do 25. avgusta 2008 v velikem prireditvenem \u0161otoru
  na nogometnem igri\u0161\u010du v Begunjah. V petih tematsko razli\u010dno obarvanih
  dnevih bodo Avsenikove skladbe v \u017eivo izvajali najbolj\u0161i izvajalci Avsenikove
  glasbe.\\n\\nDa bi \u010dim bolje predstavili kraj in njegove lepote, smo skupaj
  s KS, turisti\u010dnim dru\u0161tvom, na\u0161imi gasilci in LTO Radovljica ter
  ostalimi pripravili tudi spremljajo\u010di program, ki bo vabil v Begunje \u017ee
  tekom dneva. Pri vsem tem bomo veseli va\u0161ega sodelovanja, va\u0161ih idej in
  pripomb. Vabimo vse, ki bi radi aktivno sodelovali pri programu kot turisti\u010dni
  vodniki, hostese, animatorji, ali informatorji, da nam po\u0161ljete vlogo za sodelovanje
  na na\u0161 naslov.\\n\\nVstopnice so \u017ee v prodaji na vseh prodajnih mestih
  Eventima (www.eventim.si). Vsi krajani Begunj pa imate pri nakupu vstopnic za Festival
  10 % popust, vendar samo na na\u0161em prodajnem mestu v gostilni.\\n\\nSkupaj z
  vstopnicami bomo tr\u017eili tudi namestitve v Begunjah in okolici. Zato vse, ki
  imate v tem terminu \u0161e proste kapacitete, prosimo, da nam to sporo\u010dite,
  da vas vklju\u010dimo v na\u0161o bazo ponudnikov turisti\u010dnih namestitev.\\n\\nZa
  vse dodatne informacije smo vam na voljo od ponedeljka do petka, od 7. do 15. ure.\\n\\nTradicija
  Avsenik d.o.o, Begunje 21, 4275 Begunje na Gorenjskem, tel: (04) 5333 402,  E-mail:
  email@example.com\\n\\n4\\n\\nOd doma\u010dih gasilcev \u2026\\n\\nZa nami je uspe\u0161no
  leto 2007 tako na podro\u010dju tekmovanj, izobra\u017eevanja ter praznovanja 125-letnice.
  Na 126. rednem ob\u010dnem zboru konec januarja je bilo izvoljeno novo vodstvo gasilskega
  dru\u0161tva. Predsednik dru\u0161tva je ostal Janez Ga\u0161perin in poveljnik
  Tone Klan \u010d ar. Tako kot vsa leta doslej kot zastavljeni cilji ostajajo predvsem
  izobra\u017eevanje gasilcev in izbolj\u0161anje po\u017earne varnosti na na\u0161em
  po\u017earnem okoli\u0161u.\\n\\nLeto\u0161nje leto bo v znamenju prenove notranjosti
  gasilskega orodi\u0161\u010da, kar bomo zastavili nekoliko \u0161ir\u0161e. Zato
  napro\u0161amo vse gasilce in gasilke, da se udele\u017eijo morebitnih delovnih
  akcij, o katerih bodo pravo\u010dasno obve\u0161\u010deni.\\n\\nNa podro\u010dju
  operative bomo poleg rednih vaj, kot so preverjanje zvez, vzdr\u017eevanje strojev
  in opreme, dali tudi nekoliko ve\u010dji pomen na dru\u0161tvenih in meddru\u0161tvenih
  vajah na stanovanjskih in gospodarskih objektih, saj kvalitetna\\n\\nizvedba tak\u0161nih
  vaj veliko pripomore pri ga\u0161enju in re\u0161evanju pri morebitnih intervencijah.
  V mesecu maju bomo izvedli preglede ro\u010dnih gasilnih aparatov ter vzporedno
  izvedli akcijo nakupa novih gasilnikov za gospodinjstva. Zavedati se moramo, da
  mora biti gasilnik pregledan enkrat letno in je klju\u010dnega pomena pri prvem
  posredovanju za\u010detnega po\u017eara.\\n\\nGasilci osve\u0161\u010dajo mlade
  o po\u017earni varnosti\\n\\nV pripravi je tudi dodelava operativnega na\u010drta
  za na\u0161 po\u017earni okoli\u0161 z vsemi informacijami, ki jih gasilci potrebujemo
  za izvr\u0161evanje po\u017earne varnosti. Zato pozivamo podjetja na podro\u010dju
  KS Begunje s proizvodno, gostinsko ali ostalo dejavnostjo, da nam posredujejo po\u017earne
  na\u010drte in oceno po\u017earne ogro\u017eenosti za njihove objekte, saj vsaka
  informacija v primeru po\u017eara olaj\u0161a delo in pove\u010da varnost gasilcev
  pri posredovanju (kontakt \u2013 Klemen: 041 340 583).\\n\\nV leto\u0161njem letu
  imamo veliko dela tudi na podro\u010dju tekmovanj. Ekipa pionirjev se je uvrstila
  na regijsko tekmovanje, ki bo 10. maja v Naklem, ekipi veteranov, \u010dlanov A
  in \u010dlanic B, sta se prav tako uvrstili na regijsko tekmovanje, ki bo 11. maja
  na Bledu, dober rezultat pa bo prinesel uvrstitev na dr\u017eavno tekmovanje, ki
  bo 18. maja 2008 v Ravnah na Koro\u0161kem. Priprave so v polnem teku. Vsem tekmovalcem
  \u017eelimo dobro uvrstitev. Va\u0161i gasilci, UO in poveljstvo PGD\\n\\nInformacije
  iz dru\u0161tva upokojencev\\n\\nDru\u0161tvo upokojencev Begunje je za\u010delo
  delovati davnega leta 1976 in tako smo imeli letos \u017ee 32. redni ob\u010dni
  zbor, ki se ga je udele\u017eilo lepo \u0161tevilo \u010dlanov in \u010dlanic. Po
  zadnji evidenci je v dru\u0161tvo vklju\u010denih 406 upokojencev, prevladujejo
  pa \u017eenske. Na leto\u0161njem ob\u010dnem zboru smo se zahvali za dolgoletno
  po\u017ertvovalno delo na\u0161ima \u010dlanicama ge. Mariji Leskovec in ge. Rafki
  Tomc.\\n\\nV zadnjem \u010dasu, ko je med \u010dlani nekaj mlaj\u0161ih ljudi, se
  je na podro\u010dju aktivnosti dru\u0161tva premaknilo marsikaj na bolje. Tako smo
  vklju\u010deni v projekt Zveze dru\u0161tev upokojencev Slovenije \u00bbStarej\u0161i
  za starej\u0161e\u00ab, organizirajo in tudi realizirajo se izleti, \u0161port in
  rekreacija sta \u017ee tako in tako stalnica. V okviru dru\u0161tva je bilo lani
  dru\u017eabno sre\u010danje za materinski dan, konec novembra in v za\u010detku
  decembra je v prostorih dru\u0161tva potekala delavnica za izdelavno adventnih ven\u010dkov
  ter bo\u017ei\u010dnih in novoletnih okraskov. Za leto\u0161njo prireditev ob dnevu
  \u017eena pa smo bili celo pohvaljeni v De\u017eelnih novicah. Finan\u010dni prispevek
  za to sre\u010danje sta nam dala krajevna skupnost in Turisti\u010dno dru\u0161tvo
  Begunje, za kar se jima ob tej priliki zahvaljujemo.\\n\\nZa dru\u017eenje in zabavo
  svojih \u010dlanov skrbi dru\u0161tvo tako, da skozi vse leto prireja sre\u010danja,
  kot so pustovanje, piknik, kolesarsko tekmovanje, martinovanje in \u0161tefanovanje.
  Z vsemi navedenimi dejavnostmi in \u0161e kaj novega si bomo izmislili, nameravamo
  nadaljevati tudi v leto\u0161njem letu. Zato resno upamo, da nam prostori, v katerih
  delujemo, ne bodo odvzeti in da bodo pristojni uspe\u0161ni pri pogovorih in pogajanjih
  na ob\u010dinski ravni, tako da bi stavba in prostori v njej ostala Begunjam in
  Begunj\u010danom. Ida Legat, tajnica DU Begunje\\n\\n6\\n\\n7\\n\\n\u010cestitke\\n\\nkrajankam
  in krajanom, ki v leto\u0161njem letu praznujejo 80-letni jubilej!\\n\\niz Begunj,
  in\\n\\nAlojzija Dolenc ki\\n\\nv leto\u0161njem letu praznuje 90-letni jubilej.\\n\\nVsem
  jubilantkam in jubilantu, ki so \u017ee ali \u0161e bodo praznovali visok jubilej,
  iskreno \u010d estitamo in jim \u017eelimo obilo zdravja in radosti v \u017eivljenju.\\n\\nVANDALIZEM
  V DOLINI DRAGI\\n\\nTam kjer murke cveto, tam kjer pti\u010dki pojo, \u017ee kar
  nekaj \u010dasa ni ve\u010d tako, kot je bilo. Beseda gre o GROBI\u0160\u010cU TALCEV
  v dolini DRAGI, tam so na\u0161i fantje, \u017eene, mo\u017eje od leta 1941\u201342
  pokopani.\\n\\nNa prostoru pokopanih ve\u010d ni bronaste skulpture TALCA, ta pritegnil
  pogled je vsakega obiskovalca. Dan in no\u010d je bdel nad vsemi \u017ertvami nasilja,
  ostali so sami, le podstavek nanj spominja.\\n\\nVandali! Ali se sploh zavedate,
  kaj ste storili? S takim dejanjem star\u0161e, sorodnike, posebno sebe ste osramotili.
  Nobenega opravi\u010dila ni za tako gnusno po\u010detje, hvala vsem, ki zaslu\u017eni
  so za va\u0161e prijetje.\\n\\nKoliko dela, znanja, spo\u0161tovanja vlo\u017eil
  je kipar Boris KALIN, da od leta 1954 v vsej pokon\u010dnosti postavljen bil je
  v dolin''.\\n\\nVsem ustreljenim v spomin in \u017eivim v opomin, da kaj takega
  ve\u010d se ne zgodi v na\u0161i zgodovin''.\\n\\nPodstavek naj \u010daka na novega
  bronastega mo\u017ea, da Draga spet bo taka, kot je bila. Finan\u010dna sredstva
  naj ne bi bila problem, na vseh instancah ste\u010de pogovor naj o tem.\\n\\nVsi
  mi, posebno \u0161e sorodniki ustreljenih, zagotovo smo zaradi uni\u010denja spomenika
  lahko zagrenjeni. Na tem posve\u010denem kraju stopali so ljudje, ki niso vredni,
  da v na\u0161i lepi dr\u017eavi \u017eive.\\n\\nSve\u010dke, cvetje prina\u0161ajmo
  na ta \u017ealostni kraj. Vpra\u0161anje \u0161e vedno ostaja \u2013 zakaj? Zakaj
  okupator zakrivil zlo\u010dine je brez primere, hude, prehude za Begunje bile so
  takrat razmere.  (M. \u0160vab)\\n\\nCenik storitev KS Begunje za leto 2008\\n\\nZa
  leto 2008 veljajo naslednje cene pokopali\u0161kih storitev in najemnin:\\n\\n17
  \u20ac\\n\\n32 \u20ac\\n\\n15 \u20ac\\n\\nCeno prvega zakupa grobnega mesta in polno
  ceno uporabe poslovilnih ve\u017eic je dolo\u010dil Ob\u010dinski svet Ob\u010dine
  Radovljica s Sklepom o potrditvi vi\u0161ine najemnin grobov in cen pokopali\u0161kih
  storitev za leto 2008 (UO 90/08) in zna\u0161ajo za:\\n\\n- prvi zakup grobnega
  mesta:\\n\\n200 \u20ac\\n\\n- polna cena uporabe poslovilnih ve\u017eic:\\n\\n105
  \u20ac\\n\\nV skladu s pravilnikom je potrebno tudi podpisati pogodbo o najemu grobnega
  mesta. Tisti, ki je \u0161e niste, jo boste prejeli na dom. Prosimo pa vas, da potem
  en podpisan izvod \u010dimprej vrnete v pisarno KS.\\n\\nVra\u010danje vlaganj v
  javno telekomunikacijsko omre\u017eje\\n\\nKrajevna skupnost Begunje na Gorenjskem
  je v zakonsko dolo\u010denem roku zbrala podatke o vseh vlaganjih v javno telekomunikacijsko
  omre\u017eje, potrebno dokumentacijo in popoln zahtevek za vra\u010dilo oddala Ob\u010dini
  Radovljica, ki je zahtevke vseh krajevnih skupnosti vlo\u017eila na pristojno dr\u017eavno
  pravobranilstvo v Kranju.\\n\\nV javnost prihaja vse ve\u010d informacij o \u017ee
  vrnjenih sredstvih po Sloveniji, zato posamezni upravi\u010denci spra\u0161ujejo,
  kaj je z vra\u010danjem v na\u0161i krajevni skupnosti. Pridobili smo uradno informacijo,
  ki pravi, naj po\u010dakamo, da bomo pri\u0161li na vrsto. Skupinske vloge se \u0161e
  re\u0161ujejo in naj bi bile re\u0161ene v leto\u0161njem letu.\\n\\nKresovanje
  v Dvorski vasi\\n\\n\u0160portno dru\u0161tvo Dvorska vas organizira 30. aprila
  2008 ob 21. uri ob \u0161portnem igri\u0161\u010du Radvan v Dvorski vasi kresovanje,
  kamor vabi krajane in \u010dlane. \u0160D\\n\\nKnji\u017enica v Begunjah\\n\\nKnji\u017enica
