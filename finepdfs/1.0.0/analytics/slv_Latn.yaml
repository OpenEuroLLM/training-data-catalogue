  BILANCE PRIHODKOV IN ODHODKOV 2008\\n\\nII . rebalans 2008\"", "\"Minister za zdravje
  izdaja na podlagi prvega odstavka 26. \u010dlena in v zvezi s 23. \u010dlenom Zakona
  o humanitarnih organizacijah (Uradni list RS, \u0161t. 98/03), na predlog DRU\u0160TVA
  PSORIATIKOV SLOVENIJE, Oblakova 5, p.p. 221, 3000 Celje, naslednjo\\n\\nODLO\u010cBO\\n\\n1.
  DRU\u0160TVU PSORIATIKOV SLOVENIJE se podeli status humanitarne organizacije.\\n\\n2.
  DRU\u0160TVO PSORIATIKOV SLOVENIJE se z dnem pravnomo\u010dnosti te odlo\u010dbe
  vpi\u0161e v razvid humanitarnih organizacij, ki delujejo na podro\u010dju humanitarnih
  organizacij za kroni\u010dne bolnike pri Ministrstvu za zdravje, pod zap. \u0161t.
  HO - KO-0008/05.\\n\\nObrazlo\u017eitev:\\n\\nDru\u0161tvo psoriatikov Slovenije
  (v nadaljevanju: dru\u0161tvo) je dne 04. 08. 2004 na Ministrstvo za zdravje vlo\u017eilo
  vlogo \u0161t. 5005-21/2004 s katero je predlagalo ministru za zdravje, da se mu
  podeli status humanitarne organizacije, v skladu z ustreznimi dolo\u010dbami Zakona
  o humanitarnih organizacijah (v nadaljevanju: ZHO).\\n\\nKomisija za oceno izpolnjevanja
  meril za podelitev statusa humanitarne organizacije je vlogo dru\u0161tva, ki jo
  je na podlagi zahteve za dopolnitev dru\u0161tvo ve\u010dkrat dopolnilo dne 12.
  04. 2004, dne 06. 06. 2005 in dne 20. 06. 2005, pregledala in ugotovila, da je njihova
  vloga popolna in da je prilo\u017eena naslednja pisna dokumentacija:\\n- fotokopija
  pravil dru\u0161tva iz 2004 leta, ki je potrjena s strani UE Celje pod. \u0161t.
  215-88/2005 z dne 09. 05. 2005,\\n- fotokopija obvestila o identifikaciji in razvrstitvi
  po dejavnosti \u0161t. 103-03-0361/2004 z dne 01. 03. 2004,\\n- poro\u010dilo o
  delu dru\u0161tva za leto 2003,\\n- program dela dru\u0161tva za leto 2004,\\n-
  odlo\u010dba o statusu dru\u0161tva, ki deluje v javnem interesu, \u0161t. 50-37/96
  z dne 5. 12. 1996,\\n- fotokopija zapisnika o izredni skup\u0161\u010dini dru\u0161tva,
  ki je potekala dne 20. 11. 2004,\\n- dokumentacija o dopolnitvi vloge z dne 06.
  06. 2005 (sklep o imenovanju strokovne organizacijske komisije),\\n- mnenje Raz\u0161irjenega
  strokovnega kolegija za dermatovenorologijo z dne 10. 09. 2004.\\n\\nKomisijo za
  oceno izpolnjevanja meril za podelitev statusa humanitarne organizacije, ki poda
  pristojnemu ministru mnenje na podlagi tretjega odstavka 25. \u010dlena Zakona o
  humanitarnih organizacijah, sta skupaj imenovala minister za zdravje in minister
  za delo, dru\u017eino in socialne zadeve s sklepom \u0161t. 5845-1/2002-57 z dne
  03. 02. 2004 in sklepom o spremembi sklepa o imenovanju, \u0161t. 5845-1/2002-58
  z dne 27. 07. 2004 (v nadaljevanju: komisija).\\n\\nNavedena komisija je popolno
  vlogo dru\u0161tva na svoji 9. redni seji dne 28. 06. 2005 vsebinsko obravnavala
  in ugotovila, da je vloga dru\u0161tva popolna, ker so bili prilo\u017eeni vsi potrebni
  in zahtevani dokumenti, tako kot to dolo\u010da 24. \u010dlen ZHO.\\n\\nKomisija
  je tako ugotovila, da Dru\u0161tvo psoriatikov Slovenije izpolnjuje tako splo\u0161ni
  pogoj in tudi ostala zakonsko dolo\u010dena posebna merila za pridobitev statusa
  humanitarne organizacije, ki so podrobneje opredeljena v ZHO od 15. do 21. \u010dlena.\\n\\nPo
  prou\u010ditvi celotne dokumentacije je komisija ugotovila, da dru\u0161tvo po na\u010delih
  nepridobitnosti in prostovoljnosti v javnem interesu opravlja humanitarno dejavnost
  prete\u017eno na podro\u010dju zdravstvenega varstva, s \u010dimer dru\u0161tvo
  izpolnjuje kriterij upravi\u010denca do pridobitve statusa humanitarne organizacije
  v skladu s prvim odstavkom 2. \u010dlena ZHO.\\n\\nV skladu z drugim odstavkom 25.
  \u010dlena ZHO je komisija najprej pregledala dokazila o tem, ali je izpolnjen splo\u0161ni
  pogoj iz 15. \u010dlena ZHO, ki dolo\u010da, da lahko za pridobitev statusa humanitarne
  organizacije zaprosijo le tista dru\u0161tva in organizacije, ki \u017ee najmanj
  eno leto pred vlo\u017eitvijo vloge opravljajo humanitarno dejavnost na podro\u010dju
  socialnega oziroma zdravstvenega varstva. Ugotovilo se je, da dru\u0161tvo izpolnjuje
  navedeni pogoj, saj deluje \u017ee od 1979. leta dalje.\\n\\nAktivnosti dru\u0161tva
  se izvajajo v oblikah in na\u010dinih, ki dru\u0161tvo v skladu z dolo\u010dili
  11. \u010dlera ZHO uvr\u0161\u010dajo med organizacije za kroni\u010dne bolnike.
  Dru\u0161tvo je sestavljeno iz enajstih podru\u017enic ter ima trenutno evidentiranih
  okrog 2000 \u010dlanov, kajti v Sloveniji naj bi bilo okoli 40.000 posameznikov,
  obolelih za luskavico. To je pogosta, dedno pogojena, nenalezljiva, vnetna, kroni\u010dna
  ko\u017ena bolezen. Dru\u0161tvo izdaja dvakrat letno tudi svoje glasilo - Za prostor
  pod soncem.\\n\\nDru\u0161tvo je opredeljeno kot prostovoljno, nepridobitno, humanitarno
  zdru\u017eenje fizi\u010dnih oseb - bolnikov s psoriazo oziroma luskavico na podlagi
  drugega odstavka 7. \u010dlena ZHO in zdru\u017euje osebe z dolo\u010deno kroni\u010dno
  boleznijo, kot to opredeljuje 10. \u010dlen Zakona o humanitarnih organizacijah.\\n\\nOsnovni
  namen dru\u0161tva je organizirano re\u0161evanje problemov, s katerimi se sre\u010dujejo
  prizadeti s psoriazo, zastopanje njihovih interesov v delovnem in \u017eivljenjskem
  okolju, da se \u010dim uspe\u0161neje organizira in izvaja njihovo zdravljenje in
  zmanj\u0161ujejo negativni u\u010dinki psoraze v vseh pojavnih oblikah, kot je razvidno
  iz vsebine 8. \u010dlena temeljnega akta dru\u0161tva.\\n\\nIz prilo\u017eene dokumentacije
  je razvidno, da dru\u0161tvo deluje prete\u017eno na zdravstveno preventivnem podro\u010dju
  in v\u010dlanjevanja tudi ne omejuje na obmo\u010dju svojega delovanja, s \u010dimer
  dru\u0161tvo izpolnjuje merilo odprtosti delovanja v skladu s prvim odstavkom 17.
  \u010dlena ZHO.\\n\\nDru\u0161tvo deluje predvsem na podro\u010dju varovanja zdravja
  obolelih posameznikov za psoriazo tako, da dru\u0161tvo uresni\u010duje svoje cilje
  z naslednjimi oblikami in na\u010dini dejavnosti po 11. \u010dlena ZHO, kot je razvidno
  iz posameznih alinej 9. \u010dlena temeljnega akta dru\u0161tva:\\n\\n- organiziranje
  obolelih za psoriazo,\\n- prirejanje strokovnih predavanj o zdravljenju psorijaze,\\n-
  dajane pobud in z organiziranjem pomo\u010di pri \u0161irjenju in zagotavljanju
  materialnih pogojev zdravljenja psorijaze.\\n\\nIz predstavitve dru\u0161tva v letu
  2003 je razvidno, da svojo dejavnost preko izvajanja razli\u010dnih programov dru\u0161tvo
  prete\u017eno opravlja po na\u010delih nepridobitnosti in prostovoljnosti, zato
  dru\u0161tvo izpolnjuje merilo prostovoljnosti.\\n\\nIz vsebine temeljnega akta
  dru\u0161tva je razvidno, da ima dru\u0161tvo v 32. \u010dlenu opredeljeno strokovno
  organizacijsko komisijo, ki je posvetovalni organ dru\u0161tva ter je sestavljena
  iz predstavnikov bolnikov in stroke.\\n\\nIz njihove dopolnjene vloge z dne 06.
  06. 2005 za pridobitev statusa humanitarne organizacije je razvidno, da imajo strokovno
  usposobljene zunanje sodelavce, ki skupaj tvorijo njihovo strokovno organizacijsko
  komisijo.\\n\\nPrilo\u017eeno je tudi pozitivno mnenje Raz\u0161irjenega strokovnega
  kolegija za dermatovenorologijo, ki ga je podpisal prim. mag. Marko Poto\u010dnik,
  dr. med., dr. stom., z dne 10. 09. 2004, kjer je razvidno, da so programi dru\u0161tva
  strokovno ustrezni ter usklajeni z na\u010deli dermatovenerolo\u0161ke stroke, kar
  je v skladu s drugim odstavkom 17. \u010dlena ZHO.\\n\\nTi programi torej izpolnjujejo:\\n-
  merilo odprosti delovanja, ker pomo\u010d ni omejena samo na \u010dlanstvo v dru\u0161tvu
  ter ni lokalno omejeno podro\u010dje delovanja dru\u0161tva, kar je v skladu s prvim
  odstavkom 17. \u010dlena ZHO,\\n- merilo strokovnosti izvajanja ustreznih programov,
  ker programe dru\u0161tva spremlja in strokovno vodi strokovno posvetovalno telo,
  kar je v skladu z drugim odstavkom 17. \u010dlena ZHO,\\n- merilo prostovoljnosti,
  ker se programi dru\u0161tva izvajajo ve\u010dinoma s prostovoljci, kar je v skladu
  s prvim odstavkom 18. \u010dlena ZHO,\\n- merilo nepla\u010dljivosti, ker se usluge
  in storitve nudijo kroni\u010dno obolelim posameznikom brez pla\u010dila, kar je
  skladno z drugim odstavkom 18. \u010dlena ZHO,\\n- merilo specifi\u010dnosti pri
  organizacijah za kroni\u010dne bolnike, ker ima dru\u0161tvo v svojih vrstah evidentiranih
  trenutno 2000 \u010dlanov, kar je skladno s tretjim odstavkom 20. \u010dlena ZHO.\\n\\nS
  tem, ko dru\u0161tvo izpolnjuje zgoraj navedena merila, ki jih dolo\u010da ZHO,
  je komisija za oceno izpolnjevanja meril za podelitev statusa humanitarne organizacije
  podala pozitivno mnenje v skladu z drugim odstavkom 9. \u010dlena svojega poslovnika
  in resornemu ministru za zdravje na podlagi tretjega odstavka 25. \u010dlena ZHO
  predlagala, da se navedenemu dru\u0161tvu podeli status humanitarne organizacije.\\n\\nGlede
  na zgoraj navedeno obrazlo\u017eitev minister za zdravje v skladu s prvim odstavkom
  26. \u010dlena ZHO **podeljuje Dru\u0161tvu psoriatikov Slovenije status humanitarne
  organizacije**.\\n\\nDru\u0161tvo psoriatikov Slovenije je v skladu z 29. \u010dlenom
  ZHO dol\u017eno obve\u0161\u010dati Ministrstvo za zdravje o vseh spremembah podatkov,
  ki se vodijo v razvidu humanitarnih organizacij, in vsa dejstva, ki vplivajo na
  izpolnjevanje meril za pridobitev statusa humanitarne organizacije, najkasneje v
  30 dneh od nastanka oziroma registracije spremembe.\\n\\nOdlo\u010dba je po drugi
  to\u010dki prvega odstavka 24. \u010dlena Zakona o upravnih taksah (Uradni list
  RS, \u0161t. 40/04- pre\u010di\u0161\u010deno besedilo) prosta pla\u010dila takse.\\n\\nPOUK
  O PRAVNEM SREDSTVU:\\n\\nTa odlo\u010dba je v upravnem postopku dokon\u010dna in
  zoper njo ni mo\u017ena prito\u017eba, mo\u017een pa je upravni spor. Upravni spor
  se lahko spro\u017ei v 30 dneh, od dneva vro\u010ditve te odlo\u010dbe pri Upravnem
  sodi\u0161\u010du Republike Slovenije v Ljubljani. To\u017ebo je mogo\u010de vlo\u017eiti
  ali podati na zapisnik neposredno pri navedenem sodi\u0161\u010du, lahko pa se po\u0161lje
  tudi priporo\u010deno po po\u0161ti. To\u017ebi v dveh izvodih je potrebno prilo\u017eiti
  to odlo\u010dbo.\\n\\nDatum: 16. 08. 2005\\n\u0160tevilka: 5005-21/2004-8\\n\\nAndrej
  BRU\u010cAN\\nMINISTER\"", "\"VSE JE V IMENU\\n\\nJoc Triglav\\n\\n\u017de dolgo
  \u010dasa se mi v prebliskih prostega \u010dasa v mislih vedno znova za\u010dne
  napletati ideja, kako bi Geodetski upravi Republike Slovenije oziroma bodo\u010di
  slovenski geodetski agenciji dali novo enostavno ime, ob katerem si pri izgovorjavi
  mi sami ter na\u0161i uporabniki in poslovni partnerji doma in po svetu ne bi lomili
  jezika. Pri tem sem si za izhodi\u0161\u010de razmi\u0161ljanja zakoli\u010dil nekatere
  osnovne pogoje. Ime mora z nekaj \u010drkami jasno povedati, kdo smo in kaj po\u010dnemo,
  pri tem pa ne sme biti omejevalno glede na\u0161ega bodo\u010dega \u0161irjenja
  na nove poslovne dejavnosti in na nova podro\u010dja dela. Hkrati mora biti ime
  zapisano enako v sloven\u0161\u010dini in v tujih jezikih ter imeti enak sporo\u010dilni
  pomen doma in po svetu.\\n\\nIn tako se mi je lani nekega lepega dne med lenarjenjem
  v senci cvetov pod doma\u010do \u010de\u0161njo v mislih kot mozaik skupaj zlo\u017eilo
  ime, ki izpolnjuje vse te pogoje, pa \u0161e kak\u0161nega zraven. Odtlej sem se
  tu in tam spomnil, da bi bilo dobro najti \u010das in voljo, to ime zapisati na
  papir in ga povedati naprej ter na kratko razlo\u017eiti slovenskim geodetom. Preberite
  torej to mojo kratko skico novega imena, \u010de ne zaradi drugega pa zato, da vzpodbudite
  tudi lastni razmislek o tej temi in mogo\u010de pridete na dan z lastnimi, bolj\u0161imi
  idejami o drugih mo\u017enih novih imenih za na\u0161o geodetsko upravo. Ve\u010d
  ljudi ve\u010d ve in pravo ime lahko vse pove!\\n\\nA IN PREDLOGI\\n\\nMNENJA IN
  PREDL\\n\\n449\\n\\n450\\n\\ngeo-reg\\n\\nTo sta osnovni sestavini tega novega imena.
  Ni\u010d posebnega, ali ne? Pa vendar, \u010de ju pogledate \u0161e enkrat, vam
  teh nekaj \u010drk lahko pove vse. Naj na\u0161tejem nekaj osnovnih razlogov za
  njuno izbiro.\\n\\ngeo\\n\\nOsnova vsega, kar po\u010dnemo na geodetski upravi,
  je v besedi geo, ki v novej\u0161i latin\u0161\u010dini pomeni zemlja in je gr\u0161kega
  izvora (g\u0119 \u2013 zemlja). Na tej osnovi so kot neoklasi\u010dne zlo\u017eenke
  po gr\u0161kem besedotvornem vzorcu nastale besede kot npr. geodezija [geo + gr.
  dais\u00eda \u2013 (raz)delitev zemlje], geodet\u2013geodetinja\u2013geodetka [geo
  + gr. da\u00edein \u2013 deliti] in geometer\u2013geometrinja [geo + gr. metre\u00edn
  \u2013 meriti]. To smo torej mi in tu je izvor imena na\u0161e znanosti, stroke
  in poklica. A koren geo seveda najdemo \u0161e v \u0161tevilnih drugih besedah,
  s katerimi je geodezija bodisi tesno povezana ali pa skupaj z geodezijo spadajo
  v podro\u010dje geoznanosti. Med njimi na\u0161tejmo le nekatere, ki jih najdemo
  v Velikem slovarju tujk Cankarjeve zalo\u017ebe: geodinamika, geofizika, geografija,
  geoid, geokemija, geologija, geomagnetika, geomehanika, geometrija, geomontografija,
  geomorfologija, geonim, geonomija, geopolitika, geopotencial, georama, geosfera,
  geoskopija, geosinhron, geostacionaren, geostatika, geotehnika, geotektonika.\\n\\nPoleg
  zgoraj navedenih je \u0161e nekaj novej\u0161ih, \u017ee uveljavljenih zlo\u017eenk,
  ki se za\u010dnejo na geo- in so \u017ee ali pa \u0161e bodo postale te\u017ekokategornice,
  npr.: geoinformatika, geomatika, geolokacija, georeferenciranje, geokodiranje, geostatistika,
  geodemografija, georelacijski model, geosemantika, geotopologija itd.\\n\\nNa\u0161tevanje
  geo-besed bi lahko \u0161e nadaljevali, a naj bo zaenkrat dovolj, saj zgoraj navedeni
  pojmi brez posebne dodatne razlage povsem zado\u0161\u010dajo za osnovno sliko o
  razlogih, zakaj geo brez vsakega dvoma spada v novo ime na\u0161e slu\u017ebe.\\n\\nreg\\n\\nTudi
  pri drugi polovici novega imena si pomagajmo z latin\u0161\u010dino in poi\u0161\u010dimo
  pomen nekaterih latinskih besed, ki so jim skupne za\u010detne \u010drke reg:\\n\\n-
  rega \u2013 \u010drta, vrsta\\n- regio \u2013 krajina, meja, kraj, ozemlje\\n\\n-\\n\\nregionalis
  \u2013 krajinski, ki se nana\u0161a na regijo, obmo\u010dje\\n- regia \u2013 hi\u0161a
  rimskega vrhovnega sve\u010denika (pontifex maximus) na rimskem forumu\\n- regeneratio
  \u2013 obnova, prerod\\n- regenerare \u2013 spet roditi, obnoviti\\n- regens \u2013
  vladajo\u010d\\n- regere \u2013 vladati\\n- regerere \u2013 vpisati\\n- regestum
  \u2013 kronolo\u0161ko urejen seznam listin, prepis ali izvle\u010dek iz teh listin\\n-
  registrum \u2013 register, uraden seznam, izkaz, popis\\n- registratio \u2013 vpis
  v register, popis\\n- registrator \u2013 vpisovalec v register, listinska mapa,
  avtomatski zapisovalnik\\n- registrare \u2013 opaziti, zaznati\\n- regula \u2013
  pravilo\\n- regulare \u2013 uravnavati, napraviti pravilno\\n- regularis \u2013
  pravilen\\n- regulatio \u2013 urejanje s predpisi\\n\\n\u010ce dobro pogledate latinske
  besede v gornjem seznamu in njihov pomen, je mogo\u010de \u017ee z malce domi\u0161ljije
  prav v vsaki najti povezavo s tem, kar geodetska uprava po\u010dne danes, ali s
  tem, kar bo vsekakor po\u010dela v prihodnosti. Na kratko bi besede iz gornjega
  seznama lahko povezali v osnovni miselni snopi\u010d nekako takole: Meje, ozemlja
  in nasploh prostor obvladujemo z zaznavanjem in opazovanjem dejstev v prostoru,
  dolo\u010danjem pravil opazovanj in vpisov ter z obnavljanjem pravilnosti vpisanih
  dejstev opazovanj v kronolo\u0161ko urejenih seznamih listin.\\n\\nIn kaj po\u010dneta
  v tem seznamu pontifex maximus in njegova hi\u0161a regia? \u010ceprav so se pontifex
  maximus imenovali vrhovni sve\u010deniki v predkr\u0161\u010danskem starem Rimu
  in se tako \u0161e vedno naslavlja tudi sodobni pape\u017e, sodi regia v ta seznam
  iz povsem drugega razloga. Za besedo pontifex je v\u010dasih uporabljena razlaga
  \u00bbgraditelj mostov\u00ab, dejansko pa je njen izvor v etru\u0161\u010danski
  besedi pont, katere pomen je \u00bbpripravljalec poti\u00ab. Beseda maximus pa pomeni
  \u00bbnajve\u010dji\u00ab. S tem izhodi\u0161\u010dem enostavno pove\u017eimo skupaj
  \u0161e drugi miselni snopi\u010d: s svojim znanjem in delom bomo \u00bbpripravljali
  poti\u00ab v prostoru vsem ostalim strokam in uporabnikom, hkrati pa bomo svoje
  aktivnosti usmerjali in vodili tako, da bomo \u00bbgraditelji mostov\u00ab med nami
  in med njimi vsemi. S tem bomo postavili svojo dejavnost, svojo hi\u0161o regio
  v samo sredi\u0161\u010de forum znanja o prostoru.\\n\\n\u2013\\n\\n\u010crtica
  v imenu med geo in reg ni brez pomena, saj hkrati po eni strani pomensko lo\u010duje
  dva enakovredna dela in ju po drugi strani vsebinsko povezuje v eno celoto. Ena
  polovica brez druge sicer lahko obstaja, vendar delujeta pravilno in popolno \u0161ele
  kot celota.\\n\\ngeoreg\\n\\n\u010ce si v svoji ozkosr\u010dnosti malo pogledamo
  skozi prste in \u010de premoremo malo poguma, potem lahko \u010drtico med geo in
  reg enostavno zbri\u0161emo ter s tem sebi in svetu takoj povemo, da obe polovici
  ne samo da tvorita skupno celoto, temve\u010d sta med seboj nedeljivi in nelo\u010dljivo
  povezani.\\n\\ngeoreg.si\\n\\nKer bomo tudi v bodo\u010de slu\u017eba dr\u017eave
  Slovenije in \u017eelimo to povedati tudi s svojim imenom, v dobi globalne ekonomije
  k na\u0161emu imenu vsekakor spada mednarodna oznaka na\u0161e dr\u017eave.\\n\\nwww.georeg.si\\n\\nIme
  na\u0161e spletne strani, ki bo bodo\u010de vozli\u0161\u010de vseh na\u0161ih internih
  aktivnosti in osnovno sti\u010dno\\n\\nA IN PREDLOGI\\n\\nMNENJA IN PREDL\\n\\n451\\n\\n452\\n\\npolje
  z vsemi na\u0161imi uporabniki, bo seveda enako. Ker smo dobrega srca, bomo dovolili
  uporabo imena tudi za geodetske in zemlji\u0161koknji\u017ene zadeve pristojnim
  uradnim slu\u017ebam na\u0161ih sosednjih dr\u017eav www.georeg.at, www.georeg.hr,
  www.georeg.hu, www.georeg.it in tudi vsem ostalim dr\u017eavam, da se ne bodo same
  ubadale z imenom. Ime bo seveda lahko uporabljala tudi pristojna skupna agencija
  Evropske unije www.georeg.eu, ko bo neko\u010d v prihodnosti ustanovljena.\\n\\ngeorek
  in georec\\n\\nV Sloveniji bomo uvedli skupno ime, skupni pojem za vse izpise, potrdila
  oz. izvle\u010dke ali standardne izdelke iz na\u0161ih zdru\u017eenih nepremi\u010dninskih
  evidenc. To skupno ime je georek, ki je najbli\u017eji foneti\u010dni pribli\u017eek
  na\u0161ega novega imena georeg. Pod imenom georek bomo zbrali in smiselno uredili
  vse na\u0161e izdelke, da bodo vsebinsko in oblikovno jasni in prepoznavni vsem
  uporabnikom. Ko bo stranka pri\u0161la k nam ali vstopila na na\u0161o spletno stran,
  bo enostavno naro\u010dila georek svoje parcele, stavbe, objekta gospodarske javne
  infrastrukture ipd. Stranka bo seveda lahko pridobila tudi samo dolo\u010deno posami\u010dno
  sestavino georeka ali izbrano kombinacijo sestavin georeka. Tako se bo izpis posestnega
  lista oz. bodo\u010di zemlji\u0161koknji\u017eni izpisek imenoval npr. georek-1,
  kopija katastrskega na\u010drta bo npr. georek-2 in tako naprej do georeka-999 in
  po potrebi \u0161e naprej. Tujci pa se bodo nau\u010dili, da pri nas lahko dobijo
  georec (ang. okr. georecord) nepremi\u010dnin. In tako bo pojem georek postal enostaven
  in enoten osnovni razpoznavni znak komunikacije na\u0161e slu\u017ebe z na\u0161imi
  uporabniki.\\n\\n... georegis\\n\\nTo ime je za dana\u0161nji \u010das za na\u0161o
  slu\u017ebo seveda preve\u010d bahavo. Ko pa se bomo \u010dez leta uveljavili kot
  dejanski kralji podatkov o prostoru, ko bomo vedeli o prostoru bistveno ve\u010d
  in ko bomo znali to znanje in vedenje tudi vsebinsko celovito in tehnolo\u0161ko
  brezhibno ponuditi vsem na\u0161im uporabnikom, potem si bomo mogo\u010de zaslu\u017eili
  tudi to ime in nas bodo uporabniki res lahko na\u0161li na naslovu www.georegis.si
  ali www.georegis.eu.\\n\\nZa konec\\n\\nKoliko je vredna ideja, ki je zrasla v \u010de\u0161njevi
  senci doma\u010dega vrta, boste presodili sami. Po pribli\u017eno letu dni, kolikor
  je trajalo, preden sem vam idejo iz glave vendarle skiciral tudi na papir, so nove
  besede, ki jih navajam v tem prispevku, \u0161e vedno nove in jih ne boste na\u0161li
  v spletnih iskalnikih. Ali bodo te besede \u2013 ali besede, ki bodo plod va\u0161ega
  lastnega razmisleka o novem imenu \u2013 kdaj iz cvetov idej tudi res dozorele in
  obrodile sadove, ni najbolj pomembno. Dejstvo pa je, da geodetska uprava ne bomo
  ve\u010d dolgo, pravzaprav \u017ee dolgo nismo ve\u010d samo to. Na\u0161a stroka
  in slu\u017eba, njuna vsebina ter njun prostor pod soncem se temeljito spreminjajo,
  zato se kot njihov temeljni del nujno spreminjamo tudi mi sami. \u010ce sprememb
  znotraj geodetske slu\u017ebe ne bomo izvedli celovito in premi\u0161ljeno, po na\u0161ih
  lastnih zamislih in na lastno pobudo, nas bodo nedvomno vsaki\u010d znova po svoji
  potrebi in podobi bolj ali manj stihijsko spreminjale zgolj razmere izven na\u0161e
  slu\u017ebe! Va\u0161 lastni razmislek o novem imenu je dobra prilo\u017enost, da
  se tega zaveste. Brez razmisleka ni idej in brez idej ne bo sadov. Zatorej \u0161e
  enkrat: Ve\u010d ljudi ve\u010d ve in pravo ime lahko vse pove!\\n\\nIskrica ob
  visokem jubileju\\n\\nTokratna \u0161tevilka Geodetskega vestnika je tematska, posve\u010dena
  je visokemu \u017eivljenjskemu jubileju na\u0161ega kolega geodeta. Spo\u0161tovani
  dr. Milan Naprudnik, \u017eelim vam, da bi se vam pri prebiranju prispevkov te \u0161tevilke,
  tudi ob tej moji skici, porajale nove iskre misli o slovenski geodeziji. Naj se
  vam v spomin prikli\u010de \u010dim ve\u010d prijetnih trenutkov z geodeti in vsemi
  drugimi, s katerimi ste delili vsa ta plodna desetletja svojega dela in ustvarjanja.
  Kot klen \u010dlovek \u0161irokih obzorij, vedrega duha in dobrih idej ostanite
  tudi s svojim prihodnjim delom svetal zgled mlaj\u0161im generacijam geodetk in
  geodetov!\\n\\nPrispelo v objavo: 23. maj 2007\\n\\nJoc Triglav, univ. dipl. in\u017e.
  geod.\\n\\nGeodetska uprava Republike Slovenije\\n\\nObmo\u010dna geodetska uprava
  Murska Sobota\\n\\nSlom\u0161kova ulica 19, SI-9000 Murska Sobota\\n\\nE-po\u0161ta:
  firstname.lastname@example.org\\n\\nA IN PREDLOGI\\n\\nMNENJA IN PREDL\\n\\n453\"",
  "\"Odziv na javno predstavitev projekta Potni\u0161kega centra Ljubljana\\n\\nV
  Koaliciji za trajnostno prometno politiko (KTPP) smo se pred tedni kriti\u010dno
  odzvali na na\u010drte, ki so bili objavljeni v okviru predhodnega postopka presoje
  vplivov na okolje projekta z imenom Ureditev GJI in obnova cest na obmo\u010dju
  potni\u0161kega centra Ljubljana. Javno smo se odzvali na javno objavo na\u010drtov
  v okviru uradnega postopka. Takrat nam ni bilo znano, da nosilci projektov pripravljajo
  skupno javno predstavitev, prav tako ne, da so se na\u010drti od predhodnega postopka
  dalje znatno spreminjali.\\n\\nPo na\u0161em odzivu smo bili s strani Mestne ob\u010dine
  Ljubljana povabljeni k sodelovanju pri nadaljnjem razvoju projekta in povabila smo
  bili iskreno veseli. Predstavniki koalicije smo se zato udele\u017eili tudi javne
  predstavitve projekta Potni\u0161kega centra Ljubljana (PCL) v Mestni hi\u0161i
  10. oktobra 2023.\\n\\nKot smo izpostavili \u017ee na predstavitvi, ugotavljamo,
  da se je projekt od poleti objavljenega pomembno spremenil na bolje. Izbolj\u0161ave
  vsekakor pozdravljamo in upamo, da bodo tudi morebitne nadaljnje spremembe \u0161le
  v za\u010drtani smeri. Kot smo napovedali, smo na\u010drte tudi bolj podrobno preu\u010dili
  in v nadaljevanju podajamo predloge in mnenja glede nove verzije na\u010drtov za
  obnovo cest na obmo\u010dju Potni\u0161kega centra Ljubljana.\\n\\nSplo\u0161no\\n\\n2.
  Zelo spodbudno je, da se so\u010dasno z na\u010drtovanjem u\u010dinkovitega prestopanja
  z regionalnega, medkrajevnega in mednarodnega na mestni promet na\u010drtuje tudi
  celovita prenova linij LPP. \u010ceprav ne gre za del projekta PCL, pa je po na\u0161em
  mnenju klju\u010dnega pomena za njegovo uspe\u0161nost, zato se nam zdi to zelo
  pomemben nastavek za nadaljnji razvoj projekta.\\n1. Projekt, ki je bil javno predstavljen
  10. oktobra, je v nekaterih klju\u010dnih vidikih pomembno druga\u010den od projekta,
  na katerega smo se javno odzvali v KTPP. Z zadovoljstvom ugotavljamo, da je ve\u010dina
  sprememb projekta po na\u0161ih ocenah pozitivnih.\\n3. Pomembno se nam zdi, da
  se v novem projektu kapaciteta cest v obmo\u010dju PCL za osebni avtomobilski promet
  na nobeni od obodnih cest ne pove\u010duje bistveno, \u0161tevilo pasov se je glede
  na projekt, ki je bil objavljen v okviru predhodnega postopka, na Vilharjevi cesti
  zmanj\u0161alo, pri \u010demer je eden od treh pasov rumeni pas.\\n4. Iz predstavitve
  je bilo razvidno, da se na\u010drtovalci zavedajo pomena odraslega drevja za kakovost
  bivalnega okolja in si prizadevajo, da bi na obmo\u010dju ohranili \u010dim ve\u010dje
  \u0161tevilo obstoje\u010dih dreves. Ob Vilharjevi cesti je tako npr. skladno z
  novim projektom mogo\u010de ohraniti nekoliko ve\u010dji dele\u017e dreves na severni
  strani ceste.\\n\\nKljub zgoraj omenjenim izbolj\u0161avam je po na\u0161em mnenju
  projekt obnove cest na vseh podro\u010djih mogo\u010de \u0161e dodatno optimizirati.\\n\\nPodnebni
  program mre\u017ee Plan B za Slovenijo sofinancirata Eko sklad in Ministrstvo za
  okolje, podnebje in energijo s sredstvi Sklada za podnebne spremembe. Za mnenja,
  predstavljena v tem dokumentu, so izklju\u010dno odgovorni avtorji dokumenta in
  ne odra\u017eajo nujno stali\u0161\u010d Ministrstva za okolje, podnebje in energijo
  ali Eko sklada j.s.\\n\\nJavni potni\u0161ki promet\\n\\n- \u010ceprav iz na\u010drtov
  to ni najbolj razvidno, je bilo iz predstavitve razumeti, da je glavna prestopna
  to\u010dka iz nove \u017eelezni\u0161ke in avtobusne postaje na LPP predvidena na
  Masarykovi. To je glede na zate\u010deno stanje okoli\u0161kih projektov najbolj\u0161a
  mo\u017enost v danih okoli\u0161\u010dinah. Prav tako je bilo razumeti, da se predvideva
  temeljitej\u0161a sprememba linij LPP. Oboje je zelo pomembno in tudi medsebojno
  povezano, saj ni pomembna le bli\u017eina prestopa med medkrajevnim vlakom oziroma
  avtobusom, pa\u010d pa tudi ustrezna pogostnost linij, ki bodo potekale po Masarykovi,
  ter njihova vpetost v celotno shemo linij LPP. V idealnem scenariju bi bila prestopna
  to\u010dka na Masarykovi tudi nova glavna prestopna to\u010dka med linijami LPP.\\n-
  Pri celoviti prenovi omre\u017eja LPP bi bilo potrebno upo\u0161tevati tudi postajali\u0161\u010da
  Slovenskih \u017eeleznic in regionalnih avtobusov v obmo\u010dju omre\u017eja LPP
  ter jih obravnavati kot prestopne to\u010dke, ki lahko dopolnijo mo\u017enosti prestopanja
  na mestni promet.\\n- Bistvena sprememba je tudi nov terminal avtobusne postaje
  ob Masarykovi cesti. \u010ceprav bi lahko delitev avtobusne postaje na dva sklopa
  za potnike po eni strani predstavljala slab\u0161o preglednost, pa po drugi strani
  predstavlja prilo\u017enost, da se na avtobusni postaji ob Masarykovi ustavljajo
  predvsem regionalni oziroma primestni avtobusi. Ob predvideni glavni prestopni to\u010dki
  na Masarykovi se tako za ve\u010dino dnevnih voza\u010dev pomembno skraj\u0161a
  razdalja za prestop na mestni promet. Za nadaljnji razvoj projekta je zato pomembno
  opredeliti, kateri avtobusi bodo ustavljali na Masarykovi, kateri pa na Vilharjevi
  cesti, pri \u010demer je pomembno, da se bodo na Masarykovi ustavljali tisti, ki
  v najve\u010dji meri slu\u017eijo dnevnim voza\u010dem.\\n- Kot je bilo jasno razvidno
  iz animacije prometne ureditve na javni predstavitvi, je za u\u010dinkovito vodenje
  LPP potrebno urediti lo\u010dene oziroma rumene pasove tudi na odseku Masarykove
  (oziroma Trga OF) med Miklo\u0161i\u010devo in Dunajsko cesto. V nasprotnem primeru
  bodo avtobusi stali skupaj z osebnimi avtomobili po ve\u010d intervalov za levo
  zavijanje na Slovensko, s \u010dimer se bistveno zmanj\u0161a u\u010dinkovitost
  in privla\u010dnost javnega prometa.\\n- Prav tako \u0161e vedno menimo, da je potrebno
  omogo\u010diti potek linij LPP tudi po Vilharjevi cesti, zaradi mo\u017enosti prestopa
  s severnega terminala nove avtobusne postaje na mestni promet. Sedanji predlog ureditve
  tega ne omogo\u010da, saj ni mogo\u010d potek LPP v smeri proti zahodu. Potek linij
  LPP skozi novo avtobusno postajo ni ustrezna re\u0161itev, saj bi zaradi manevriranja
  medkrajevnih avtobusov mestni avtobusi preve\u010d \u010dakali, nevarno bi bilo
  tudi izstopanje potnikov  desno na vozi\u0161\u010de.  Ob trenutni ureditvi ni mogo\u010da
  niti ureditev postajali\u0161\u010da LPP v smeri proti vzhodu. Ponovno predlagamo,
  da se preveri mo\u017enost preureditve: ju\u017enega pasu, ki je zdaj namenjen peronom
  in drop-off, v rumeni pas za LPP proti vzhodu, srednji pas bi bil namenjen ostalemu
  prometu, severni pas pa bi bil rumerni pas za LPP proti zahodu. Avtobusna linija
  mimo nove avtobusne postaje bi bila zelo koristna z vidika navezave nove avtobusne
  postaje na mestni promet, po njej pa bi npr. lahko potekala tudi dana\u0161nja linija
  20, ki bi se prek Vojkove in \u017delezne mimo avtobusne postaje povezala na Dunajsko.\\n-
  Menimo, da je lo\u010dene oziroma rumene pasove za LPP nujno urediti tudi na Dunajski
  cesti, saj gre za glavno os javnega prometa v mestu.\\n\\nPredlogi in komentarji
  po posameznih sklopih\\n\\nVilharjeva\\n\\n- Kljub spremembi v tripasovno cesto
  so v ve\u010djem delu poteka dejansko \u0161e vedno \u0161tirje pasovi, saj je zaradi
  zavijalnih pasov na ve\u010d kot polovici dol\u017eine dodan \u0161e po en pas.
  Dol\u017eino zavijalnih pasov je treba zmanj\u0161ati na najmanj\u0161o mo\u017eno
  mero, oziroma jih je na dolo\u010denih delih smiselno celo ukiniti.\\n- Pozdravljamo
  spremembo odseka Vilharjeve med \u017delezno cesto in Topni\u0161ko v tripasovno
  cesto z rumenim pasom za avtobuse v smeri proti vzhodu, namesto \u0161tiripasovne
  ceste brez rumenih pasov. S tak\u0161no ureditvijo ostaja tudi ve\u010d prostora
  za kolesarje in pe\u0161ce ter predvsem za ohranitev ve\u010djega \u0161tevila obstoje\u010dih
  dreves oziroma za zasaditev novih. Obstoje\u010da velika drevesa morajo biti tudi
  v nadaljnjem na\u010drtovanju ohranjena, kadar je le mogo\u010de, saj nova drevesa
  potrebujejo ve\u010d desetletij, da je njihov u\u010dinek primerljiv s starimi,
  v dana\u0161njih klimatskih pogojih pa so slab\u0161i tudi pogoji za rast.\\n- Nujno
  je omogo\u010diti ureditev linij LPP po Vilharjevi (razlaga in konkretni predlogi
  so opisani zgoraj).\\n- Preveriti je potrebno mo\u017enost ureditve delilnega zelenega
  pasu med kolesarsko stezo in cesti\u0161\u010dem po celotni dol\u017eini na ju\u017eni
  strani.\\n- Potrebno je podalj\u0161ati podhod za kolesarje tudi pod Vilharjevo
  ter ustrezno urediti iztek na severni strani, ki danes ni primeren.\\n- Prehodnost
  prostora za pe\u0161ce se nikakor ne sme zmanj\u0161evati, zato se nam ne zdi sprejemljivo
  zmanj\u0161evanje \u0161tevila prehodov za pe\u0161ce glede na sedanje stanje. Predlagamo
  ohranitev obojestranskega prehoda za pe\u0161ce pri \u010crtomirovi ulici in vsaj
  enostranskega pri Novakovi ulici. Prav tako predlagamo tudi dvostranski prehod za
  pe\u0161ce pri izvozu iz avtobusne postaje.\\n- Dodati je potrebno drevored na ju\u017eni
  strani ceste na zahodnem delu, med avtobusno postajo in Dunajsko cesto.\\n- Predlagamo
  ponovno preveritev mo\u017enosti za ohranitev drevoreda na severni strani ceste
  med \u017delezno in Neubergerjevo ulico. Morda bi lahko pri tem pomagal delen zamik
  voznih pasov oziroma ukinitev zavijalnih pasov v tem odseku.\\n\\nMasarykova\\n\\n-
  \u0160irino vozi\u0161\u010da na zahodnem delu je potrebno zmanj\u0161ati na najmanj\u0161o
  mo\u017eno mero, da bi pridobili ve\u010d prostora za zelenje, ki ga je trenutno
  v tem delu zelo malo, ter za povr\u0161ine za kolesarje in pe\u0161ce. Predlagamo
  preveritev \u0161irine voznih pasov, ki naj bo \u010dim manj\u0161a.\\n- Komentarji
  in predlogi ureditev za JPP na Masarykovi so opisani pri to\u010dki glede javnega
  potni\u0161kega prometa zgoraj.\\n- Na zahodnem delu, med Miklo\u0161i\u010devo
  in Dunajsko (Trg OF), predlagamo ureditev delilnega zelenega pasu med kolesarsko
  stezo in vozi\u0161\u010dem na ju\u017eni strani ceste.\\n- Prehodnost prostora
  za pe\u0161ce se nikakor ne bi smela zmanj\u0161evati, zato predlagamo ohranitev
  obojestranskega prehoda za pe\u0161ce pri Kotnikovi ulici ter preveritev mo\u017enosti
  dodatnega prehoda pri Maistrovi ulici.\\n\\n\u017delezna\\n\\n- \u0160irino cesti\u0161\u010da
  je potrebno zmanj\u0161ati na minimum, kar je v primeru \u017delezne pomembno tudi
  zaradi \u010dim la\u017ejega prehoda med sosesko Zupan\u010di\u010deva jama in Severnim
  parkom, ki je glavna zelena povr\u0161ina za ta del Be\u017eigrada.\\n\\nPark na
  kri\u017ei\u0161\u010du \u0160martinske in Topni\u0161ke\\n\\n- \u010ce prav razumemo,
  se park v novem na\u010drtu znatno \u0161iri na zemlji\u0161\u010de proti jugu,
  kar na\u010deloma pozdravljamo.\\n- \u010ceprav je ureditev bypassa v projektu z
  vidika ohranitve parka in z vidika kolesarjev in pe\u0161cev bolj\u0161a od tiste
  v predhodni razli\u010dici projekta, se nam \u0161e vedno ne zdi sprejemljiva. Ne
  razumemo, kak\u0161na je prednost ureditve bypassa za JPP, kolesarjenje in hojo,
  ne zdi pa se nam sprejemljivo, da se ureditev izvaja izklju\u010dno za izbolj\u0161anje
  pogojev za osebni motorni promet, saj je to v nasprotju tako s strate\u0161kimi
  usmeritvami na ravni mesta kot s cilji konkretnega projekta PCL.\\n- Namesto bypassa
  predlagamo ureditev obi\u010dajnega zavijalnega pasu skozi kri\u017ei\u0161\u010de,
  ki se stika z ostalimi voznimi pasovi, s \u010dimer se prepre\u010di fragmentacija
  zelene povr\u0161ine.\\n- Predlagamo premik avtobusne postaje pred kri\u017ei\u0161\u010de,
  s \u010dimer se zmanj\u0161a \u010dakanje, saj se avtobus tako ali tako ustavi na
  semaforju.\\n\\nVerjamemo, da je ob nadaljnji optimizaciji lahko projekt PCL skupaj
  s prenovo zasnove linij LPP in povezanimi projekti dr\u017eave klju\u010den korak
  k uresni\u010devanju vizije podnebno nevtralnega mesta in eden klju\u010dnih projektov
  v okviru Misije 100. Verjamemo tudi, da je bil od javne predstavitve dele\u017een
  \u0161e dodatnih izbolj\u0161av in zato z veseljem pri\u010dakujemo povabilo k nadaljnjemu
  sodelovanju.\"", "\"Datum: 17. julij 2020\\n\\nIO KZS\u201320\u201312 KS\\n\\nZapisnik
  12. koresponden\u010dne seje z dne, 14.07.2020\\n\\nIO KZS je (v sestavi Borut Strojin,
  Toma\u017e Deber\u0161ek, Zdenko Miklavc, Jo\u017ee Hartl, Marko Mitrovi\u010d,
  Matija Sev\u0161ek in Bla\u017e \u017dibret) na svoji 12. koresponden\u010dni seji
  dne, 14.07.2020 obravnaval predlog predsednika KZS z naslednjim dnevnim redom:\\n\\nDnevni
  red:\\n\\n1. \u010crtanje klubov iz \u010dlanstva KZS\\n\\nAd. 1:\\n\\nVsi klubi
  v \u010dlanstvu KZS so januarja 2020 prejeli ra\u010dun za \u010dlanarino, s pla\u010dilom
  do 31. januarja 2020. Do 17.06.2020 \u010dlanarine niso poravnali: KK Shotokan Velenje
  in KK Civitas.\\n\\nRok za pla\u010dilo \u010dlanarine Karate zvezi Slovenije za
  leto 2020 je potekel 31.01.2020. Pri rednih pregledih pla\u010dil letne \u010dlanarine
  smo ugotavljali, da nista pla\u010dala \u010dlanarine: KK Shotokan Velenje in KK
  Civitas  ter ju na to ve\u010dkrat pisno opomnili.\\n\\nKer na dan, 17.06.2020,
  nista imela poravnane letne \u010dlanarine za leto 2020 smo ju pozvali, da v roku
  8 dni poravnata letno \u010dlanarino v vi\u0161ini 350,00 EUR na TRR KARATE ZVEZE
  SLOVENIJE. Obvestili smo ju po mailu in s priporo\u010deno po\u0161to (povratnica).\\n\\nKK
  Civitas nas je po mailu obvestil, da bo klub prenehal z delovanjem.\\n\\nKK Shotokan
  Velenje ni prevzel po\u0161te, po mailu pa tudi ni odgovoril.\\n\\nPo Statutu KZS
  v skladu z 2. odstavkom 12. \u010dlena Statuta Karate zveze Slovenije predlagam
  \u010drtanje iz \u010dlanstva KZS.\\n\\nPredlagam naslednja sklepa IO KZS:\\n\\nSklep
  \u0161t. 1 KS 12/2020:\\n\\nIO KZS potrdi sklep, da se klub KK Civitas Puconci,
  zaradi nepla\u010dane \u010dlanarine za leto 2020 \u010drta iz \u010dlanstva Karate
  zveze Slovenije.\\n\\nSklep \u0161t. 2 KS 12/2020:\\n\\nIO KZS potrdi sklep, da
  se klub KK Shotokan Velenje, zaradi nepla\u010dane \u010dlanarine za leto 2020 \u010drta
  iz \u010dlanstva Karate zveze Slovenije.\\n\\nOba sklepa soglasno potrdijo vsi \u010dlani
  IO KZS (7 ZA).\\n\\nZapisnik sestavil:\\n\\nSamo Jurhar                                                                                           Borut
  Strojin\\n\\nSekretar KZS                                                                                         Predsednik
  KZS\\n\\nmati\u010dna \u0161tevilka: 5227089, dav\u010dna \u0161tevilka: SI55169147\\n\\n\u0161tevilka
  TRR: 03100-1012382504\\n\\nKARATE ZVEZA SLOVENIJE\\n\\nGrajski trg 1 \u2013 3313
  POLZELA\\n\\nE-po\u0161ta:\\n\\nfirstname.lastname@example.org\\n\\nhttp://www.karate-zveza.si\\n\\nMobitel:
  040 303-106\"", "\"Spo\u0161tovane veteranke in veterani, \u010dlanice in \u010dlani
  dru\u0161tva  spo\u0161tovani soborci, cenjeni \u017eupani:  ob\u010dine Tolmin
  Uro\u0161 Bre\u017ean, ob\u010dine Kobarid Marko Matajurc, in ob\u010dine Bovec,
  tudi na\u0161 soborec in na\u0161 \u010dlan Valter Mleku\u017e.\\n\\nCenjeni predstavniki  domoljubih  in
  veteranskih organizacij veseli me, da se sre\u010dujemo tudi ob tak\u0161nih slovesnostih,
  ki jih je  \u0161e posebno v tem za veterane osamosvojitvene vojne  jubilejnem letu
  ve\u010d kot sicer.\\n\\nPozdravljena komandirja PP Tolmin in Bovec\\n\\nSpo\u0161tovani
  vsi navzo\u010di .\\n\\nZahvaljujem se vam za zaupanje spo\u0161tovane soborke in
  soborci, \u010dlanice in \u010dlani dru\u0161tva,  da smem danes z vami deliti nekaj
  mojih misli in  mojega razmi\u0161ljanja. Danes dopoldan sem kratko nagovoril udele\u017eence
  slovesnosti za Kri\u017eno goro nad Colom, kjer je postavljeno obele\u017eje v spomin
  na februar 1944, ko je partizan Lev Svetek Zorin na tem kraju  napisal tekst za
  primorsko himno Vstajenje Primorske. Mogo\u010de se boste vpra\u0161ali zakaj omenjam
  vam veterani osamosvojitvene vojne pa tudi vsem ostalim to  tako sorazmerno oddaljeno
  obdobje, kot je obdobje narodno osvobodilnega boja. Povsem preprosto  vam povem,
  da zato, ker si moramo  prav v tem obdobju  v katerem danes \u017eivimo povedati
  resnico in se globoko zamisliti nad razmerami in stanjem duha  v na\u0161i domovini.\\n\\nPred
  32 leti smo se odlo\u010dili, da  si bomo sami urejali  \u017eivljenje v na\u0161i  samostojni
  Sloveniji. Pred 30 leti smo plebiscitarno odlo\u010ditev  prebivalcev Slovenije
  morali obraniti z oro\u017ejem. Seveda so to datumi, ki mogo\u010de nekaterim be\u017enim
  poznavalcem ne povedo veliko. Tisti, ki smo  bili takrat zraven  kot mili\u010dniki
  vemo morebiti malo ve\u010d. Vemo tudi to, da se demokratizacija Slovenije ni za\u010dela
  s razpisom prvih ve\u010dstrankarskih volitev aprila 1990  ali z razpisom  plebiscita
  decembra  istega leta. Vrniti se moramo v leto 1988  in razmisliti kak\u0161no vlogo
  so imela civilno dru\u017ebena gibanja, ki so nastala v tem \u010dasu in seveda
  nasproti njim o vlogi tedanje milice. Spomniti se moramo na 1 december 1989 in na
  vlogo milice pri prepre\u010ditvi mitinga resnice v Ljubljani in se vpra\u0161ati:
  ali bi  lahko izpeljali volitve aprila 1990, \u010de bi bile v Sloveniji razgla\u0161ene
  izredne razmere. Pokojni Ciril Zlobec je  takrat  enemu izmed tvorcev kasnej\u0161e
  morije na Balkanu  zapisal: \u00bbTovari\u0161 Milo\u0161evi\u010d  ostanite  v
  dovolj \u0161irokih mejah  ljubezni, ki vam jo izkazuje na\u0161 narod. Ne silite
  v tuj dom  do katerega va\u0161i stezosledci vso pot  sejejo samo sovra\u0161tvo,
  ki ne more za vra\u010dilo pri\u010dakovati ljubezni niti spo\u0161tovanja ne itd
  \u00ab Spo\u0161tovani in spo\u0161tovane ne se  \u010duditi \u010de boste v nekaterih
  medijih sli\u0161ali, da je miting prepre\u010dil nek sindikalist strojevodij in
  ne organi za notranje zadeve.\\n\\nKo smo pod okriljem organov za notranje zadeve
  leta 1990 ustanavljali manevrsko strukturo narodne za\u0161\u010dite se je slovenski
  narod lahko naslonil le na edino obkro\u017eeno in dobro usposobljeno  organizacijo
  - dr\u017eavni organ, to je bila slovenska milica: V\u010dasih smo si tudi kak\u0161no
  rekli o tem, kdo je bil bolj pomemben plava ali zelena veja  te organizacije, pa
  je neko\u010d sedanji predsednik vlade  dejal: \u00bbPrepir o tem, katera veja znotraj
  MSNZ oziroma katera linija - plava ali zelena je bila bolj pomembna, je brezpredmeten.
  Tisti, ki smo bili zraven od samega za\u010detka, in na za\u010detku ni bilo ni\u010d,
  samo gro\u017enja, pa\u010d vemo, da tako brez ene kot brez druge komponente tega
  projekta ne bi bilo, pa tudi slovenske osamosvojitve ne. Na za\u010detku je pravzaprav
  obstajala samo policija oziroma milica, saj ko je bilo potrebno nekaj zavarovati,
  takrat \u0161e ni bilo ni\u010d. Ko so se delali prvi seznami teh enot MSNZ in ko
  so se prvi transporti oro\u017eja preme\u0161\u010dali, je to varovala pa\u010d
  Beznikova enota in po pokrajinah posebne enote milice....\\\"\\n\\nTako smo bolj
  ali manj pripravljeni  pri\u010dakovali razglasitev samostojnosti Slovenije. Tisti,
  ki imamo prilo\u017enost kaj spregovoriti o tem  je prav, da  govorimo o dejstvih,
  ki imajo podlago v nekaterih dokumentih takratnega \u010dasa. Nekaj tega smo \u017ee
  naredili, nekaj knji\u017enih izdaj,  ki govorijo o vlogi milice in organov za notranje
  zadeve smo \u017ee izdali. Po\u010dasi se bomo morali navaditi tudi na  to, da tistim,
  ki tega ne vedo povemo, da so bili mili\u010dniki tisti tako imenovani aktivni in
  tisti tako imenovani rezervni v osamosvojitveni vojni popolnoma izena\u010deni,
  kar se pooblastil in statusa ti\u010de. Imeli so enake slu\u017ebene izkaznice z
  napisanimi pooblastili kot aktivni mili\u010dniki.\\n\\nSpo\u0161tovane in spo\u0161tovani\\n\\nObdobje
  oboro\u017eenih spopadov  je bilo kratko dobrih 10 dni je trajalo z vmesnimi prekinitvami.
  Seveda oboro\u017eeni spopadi  niso  potekali  povsod, prav tako je bila \u0161tevil\u010dnost
  na\u0161ih takratnih nasprotnikov, jugoslovanske  armade  razli\u010dna  po posameznih  regijah
  krajih in obmo\u010djih. Vse to  seveda ne zmanj\u0161uje  prispevka takratne milice
  v posameznih okoljih  v osamosvojitveni vojni. Iz dokumentov, ki so na voljo lahko
  razberemo, da je milica  ob tesnem sodelovanju z enotami teritorialne obrambe  in
  ob nesebi\u010dni  podpori in pomo\u010di  prebivalcev svoje poslanstvo ve\u010d
  kot odli\u010dno opravila. Vedeti je potrebno, da je v vsem tem \u010dasu milica
  poleg  obrambnih nalog   opravljala tudi njeno temeljno  poslanstvo kot varnostne
  slu\u017ebe, ki  je skrbela za varnost ljudi in premo\u017eenja  ter vse ostalo,
  kar obi\u010dajno  po\u010dnejo  tak\u0161ne slu\u017ebe. Nekatere naloge so bile
  v \u010dasu osamosvojitvene vojne zaupne samo  takratni milici. To je bila skrb
  za  vojne ujetnike, za  njihovo obravnavo ob upo\u0161tevanju  vseh  konvencij in
  pravil, ki govorijo o ravnanju in postopanju v vojnimi ujetniki. O tem smo v Zdru\u017eenju
  SEVER letos izdali knjigo,\\n\\nza katero so predgovore napisali  priznani strokovnjaki
  s tega podro\u010dja. V njej boste na\u0161li tudi zapise o zbirnih centrih v Dre\u017enici
  in Tolminu.\\n\\nV Zdru\u017eenju Sever strmimo za tem, da na\u0161e publikacije  temeljijo
  na dejstvih in dokumentih takratnega \u010dasa. Nekaj se jih je ohranilo, \u010deprav  smo
  za\u010deli s projektom policija med vojno  \u0161ele leta 1994 in so bili nekateri
  dokumenti zaradi predpisov \u017ee uni\u010deni. Na sre\u010do so nekateri komandirji
  policijskih enot njihovo delo slabo opravili in so se dokumenti ohranili.\\n\\nSeveda
  se delo milice in organov za notranje zadeve nasploh  ni kon\u010dalo  v drugi polovici
  julija 1991, ko je bilo  konec oboro\u017eenih spopadov in je bil sprejet sklep
  o umiku enot JA iz Slovenije. \u0160e kako pazljivo je bilo  potrebno spremljati
  vse te premike, odhode, tako po cestah, kot tudi po \u017eeleznici, vse do  odhoda
  zadnjega vojaka  25 oktobra iz koprskega pristani\u0161\u010da.\\n\\nTo je zgodovina
  slovenske  milice, policisti smo postali \u0161ele leta 1992,   na katero bi morala
  biti policija danes in v prihodnosti  ponosna. Generacija v policiji  se je zamenjala,
  danes delajo v policiji policistke in policisti, ki so se  rodili po osamosvojitveni
  vojni. Kakor koli, to zgodovina na katero  policija, kdor koli jo vodi na dr\u017eavnem  regijskem
  ali lokalnem nivoju ne bi smela pozabiti. Pa je res tako se v\u010dasih spra\u0161ujemo.\\n\\nRazmere  in
  stanje v na\u0161i domovini ni dobro. Virus, ki nas pesti \u017ee skoraj  dve leti
  bomo \u017ee enkrat premagali, tako ali druga\u010de, se ga bomo otresli. Tako kot
  sam, se gotovo tudi vi spra\u0161ujete   ali bomo kdaj  tudi kot dru\u017eba ozdraveli.
  Bo kdaj konec  ali vsaj umirjanje napetosti, ki jih je vsaj delno povzro\u010dila
  epidemija. \u0160e ve\u010d pa jih povzro\u010da sovra\u017eni govor, netolerantnost,
  krepitev  razli\u010dnih vrst nestrpnosti, krepitev razli\u010dnih skrajnih  skupin.
  Iz zgodovine lahko razberemo , kaj so skrajnosti povzro\u010dile  svetu, predvsem
  v moriji druge svetovne vojne. V Zdru\u017eenju Sever zato obsojamo vse vrste skrajnosti.
  Na\u0161a organizacija je plebiscitarno potrdila listino  vrednot, ki temeljijo
  na: Varstvu \u010dlovekovih pravic in svobo\u0161\u010din, pravni dr\u017eavi, socialni
  dr\u017eavi, strpnosti, zdravemu \u017eivljenjskemu okolju, zagotavljanju varnostnih
  in obrambnih zmogljivosti, tovari\u0161tvu in solidarnosti in ne nazadnje  na domoljubju
  in patriotizmu. Ob\u010de \u010dlove\u0161ke vrednote so to, lahko jih poosebi  vernik
  ali ateist. Pa jih nekateri zmorejo spo\u0161tovati ?  \u010ce bi parafraziral  star
  pregovor bi lahko rekel: ne glej kaj jaz delam, spo\u0161tuj tisto kar ti zapovedujem.\\n\\nMislim,
  da  je potrebno, ne nujno je, da za\u010dnemo razmi\u0161ljati, kam so  delitve
  pripeljale v preteklosti in se iz tega kaj nau\u010dimo. Neprimerna \u017ealjiva
  pisanja, do druga\u010dnih ne glede na razloge za to druga\u010dnost, pa tudi \u010de
  je ta druga\u010dnost samo druga\u010dnost v razmi\u0161ljanju ne bodo prinesla
  lep\u0161ega ni bolj\u0161ega jutri za nobenega.\\n\\nNaj s tem apelom po strpnosti,
  spo\u0161tovanju  in povezovanju, tam kjer je to mogo\u010de zaklju\u010dim more
  dana\u0161nje razmi\u0161ljanje.\\n\\nPrijetno dru\u017eenje tudi po uradnem delu
  vam \u017eelim.\\n\\nHvala vam, ker ste mi prisluhnili. Vse dobro \u017eelim vam  spo\u0161tovane
  in spo\u0161tovani in vse dobro tudi tebi draga moja domovina Slovenija.\\n\\nTolmin
  4.9.2021\\n\\nAngel Vidmar\"", "\"Datum: 25. 2. 2022\\n\\nDatum prejema prijave
