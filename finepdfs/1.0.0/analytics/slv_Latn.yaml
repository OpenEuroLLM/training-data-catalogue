  z novim v sodelovanju z mladimi. Inovacijski projekti so ena izmed oblik pomlajevanja
  \u0161olstva z didakti\u010dnimi novostmi. So var\u010dna in smotrna oblika posodabljanja
  \u0161olstva z vidika \u010dasa in stro\u0161kov. U\u010ditelji pomlajujejo stroko
  z raziskovanjem lastne prakse skupaj z u\u010denci ob zunanji ekspertni podpori.
  Kurikulum posodabljajo, da jim koristi pri pou\u010devanju in u\u010dencem pri u\u010denju.
  Posodabljanje je smiselno, \u010de se zdi uporabnikom potrebno. \u0160olske novosti
  se odkrivajo pri u\u010denju, ko se jih lahko hkrati tudi preveri in oceni njihovo
  vrednost. Prednost neposrednega posodabljanja je, da u\u010ditelji zaradi tega ne
  manjkajo pri pouku.\\n\\nVe\u010d, ko je do\u017eivetij in izku\u0161enj, tem bolje
  okolje pripomore k u\u010dinkovitej\u0161emu re\u0161evanju u\u010dnih izzivov,
  zato je smiselno oblikovati inovativna odprta u\u010dna okolja. Nekaj u\u010diteljev
  in u\u010dencev se je odzvalo na nate\u010daj \u00bbU\u010dilnica\u00ab Zavoda RS
  za \u0161olstvo lani, \u0161e ve\u010d pa na leto\u0161nji razpis z naslovom \u00bbU\u010dilnica
  brez katedra\u00ab. Preko \u0161estdeset projektnih skupin, zdru\u017eenih v nacionalno
  mre\u017eo z video posnetki predstavljajo inovativne oblike odprtega u\u010dnega
  okolja (www.zrss.si).\\n\\nInovativno odprto u\u010dno okolje predstavlja u\u010dne
  prilo\u017enosti, kjer je mo\u017ena izbira u\u010denja (oblik, metod, vsebin, prostora
  in \u010dasa) ter raznoterost vsebin z vidika virov in orodij za u\u010denje. Zagotovljena
  je podpora odraslih pri samostojnem u\u010denju,  zbli\u017eevanje in sodelovanje
  s so\u0161olci in u\u010denje z eksperti iz okolja. Spodbuja se celovito zaznavanje
  v naravi in laboratoriju ter u\u010denje v kombinaciji naravnega in umetnega okolja.
  U\u010denci so del ekspertne ekipe, ki razmi\u0161ljajo, i\u0161\u010dejo, preizku\u0161ajo,
  preverjajo in vrednotijo. Inovativno odprto u\u010dno okolje posve\u010da \u010das
  refleksijam opravljenega u\u010denja in rezultatov oz. produktov. Inovativno odprto
  u\u010dno okolje nudi u\u010dencu namesto katedra izku\u0161nje na obeh straneh
  \u00bbpulta\u00ab: u\u010dnega, pou\u010devalnega, ustvarjalnega, predstavitvenega,
  prodajnega\u2026\\n\\nOdprta \u0161ola nudi u\u010dencu strokovno oporo pri na\u010drtovanju
  u\u010denja, ko razmi\u0161lja o tem, kaj in kako se bo u\u010dil. Odprta \u0161ola
  ima odprt planski sistem za izvajanje u\u010dnega programa. \u0160ola u\u010dencu/em
  organizira prostor in \u010das za svobodno, fleksibilno u\u010denje, kakovostno
  povratno informiranje v pou\u010devanju in predstavljanje ustvarjenega. V odprti
  \u0161oli vsak u\u010denec ob pomo\u010di u\u010ditelja vodi svoj osebni kurikul,
  ki je obogaten z osebnimi interesi za ustvarjalno u\u010denje. U\u010denci se s
  formativnim spremljanjem varno prilagajajo in po potrebi raziskujejo vire ter vplive
  v okolju. U\u010ditelji v \u0161olah organizirajo varna in zanimiva do\u017eivetja,
  ko delujejo udje, \u010dutila in mo\u017egani. U\u010denci se ob pomo\u010di u\u010ditelja
  in podpori star\u0161ev u\u010dijo samostojnega uravnavanja u\u010denja in predstavljanja
  nau\u010denega. U\u010ditelji v pou\u010devanju upo\u0161tevajo na\u010delo Komenskega:
  \u00abod bli\u017enjega k daljnemu\u00ab in drugo njegovo na\u010delo v obratnem
  smislu: \u00bbod neznanega k znanemu\u00ab, pri odkrivanju pa uporabijo svoje predznanje
  in pomo\u010d odraslega.\\n\\nInovativno odprto u\u010dno okolje se \u0161iri v
  ve\u010dji in celovitej\u0161i svet, kjer imajo ljudje svoj \u00bbkot\u00ab za premi\u0161ljevanje
  in prostor za sodelovanje z drugimi v socialnih u\u010dnih skupinah. Bistveni namen
  odprtega u\u010dnega okolja je v medsebojnem sodelovanju; spletanju, mre\u017eenju
  v \u0161olski, morda regijski, nacionalni, evropski in svetovni mre\u017ei.\\n\\nOdprto
  u\u010denje je bilo v slovenskih \u0161olah \u017ee prisotno v sedemdesetih in osemdesetih
  letih, vendar je bilo nekoliko druga\u010dno. Odpirali so vrata, da bi jih obiskali
  so\u0161olci, star\u0161i in zanimivi ljudje. \u0160li so na ekskurzije, tabore
  in obiskali razli\u010dne delovne organizacije. Slovenski u\u010ditelji pa se skupaj
  z u\u010denci v sedanjem \u010dasu spoprijemajo z izzivi svobodnega varnega u\u010denja
  za trajno znanje; s fleksibilno organizacijo \u0161olanja in u\u010denja, z bogatenjem
  u\u010dnega prostora, s skupnim na\u010drtovanjem u\u010denja, spremljanjem in reflektiranjem
  u\u010dnih dose\u017ekov namesto klasi\u010dnega pou\u010devanja. U\u010ditelji
  skupaj z u\u010denci pomlajujejo u\u010dno okolje, ki jim omogo\u010da spodbudno
  in ustvarjalno trajno znanje. Kakovostne povratne informacije v inovativni odprti
  pedago\u0161ki komunikaciji pozitivno vplivajo na vzdu\u0161je in tudi u\u010dni
  uspeh. Razvite kompetence u\u010diteljev in u\u010dencev omogo\u010dajo u\u010dinkovitej\u0161o
  funkcionalno pismenost.\"", "\"Institucijam in organom Odbora za spremljanje\\n\\n\u0160tevilka:
