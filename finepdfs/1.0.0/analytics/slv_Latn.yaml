  Sodobna skupnost\\n- Infrastruktura\\n- Prenova in vklju\u010dujo\u010di programi
  za vse generacije\\n- Dostopne storitve\\n- Prenova stanovanjske politike\\n- Vzdr\u017eevani
  skupnosti objekti\\n\\nKartografska podlaga: DKSO, GURS\\n\\n4.4 Prese\u010dno podro\u010dje
  4: Upravljanje razvoja in preobrazbe\\n\\nRazvojni izzivi:\\n- Upravljanje razvoja
  in preobrazbe\\n\\nCilj: Doseganje razvojnih sprememb, na\u010drtovanih s tem razvojnim
  dokumentom\\n\\nUsmeritev\\n\\nOb\u010dina Tr\u017ei\u010d je s svojo velikostjo
  relativno obvladljiva, kljub temu raznovrstnost problematike, zahtevnost upravljanja
  razvoja in prenove razvednotenih obmo\u010dij, kompleksnost in dolgotrajnost procesov,
  kakor tudi omejena finan\u010dna sredstva terjajo premi\u0161ljen pristop. Po drugi
  strani mre\u017ea javnih institucij s profesionalnimi kadri (muzej, knji\u017enica,
  zdravstveni dom, Ljudska univerza, vrtec, \u0161ole), doseganjem uspe\u0161ni projekti,
  kakovostne prenove in dose\u017eene nagrade (Tr\u017ei\u0161ki muzej, podjeten.si,
  Gorenjska pla\u017ea, info center v Dov\u017eanovi soteski, urbano igri\u0161\u010de
  s kolesarskim parkom v BPT) zagotavljajo dobro podlago za ambiciozno zastavljen
  razvojni na\u010drt.\\n\\nKoordinirano usmerjanje razvojnega procesa od pravo\u010dasnega
  na\u010drtovanja projektov do anga\u017eiranja javnih zavodov, dru\u0161tev, podjetij
  in prebivalcev ter izkori\u0161\u010danja finan\u010dnih virov dr\u017eave in EU
  v postkovidnem obdobju, bo odlo\u010dilno za uresni\u010devanje zastavljenih ciljev.
  Za klju\u010dna fokusna podro\u010dja in obmo\u010dja razvoja bo treba zdru\u017eiti
  razli\u010dne strokovnjake v razvojno ekipo za Tr\u017ei\u010d 2030. Medsebojno
  povezovanje, optimiziranje in uravnote\u017eenje razvojnih ukrepov in projektov
  med fokusnimi podro\u010dji, kakor tudi med mestnim in pode\u017eelskimi obmo\u010dji
  bo zagotovilo, da s pretiranim osredoto\u010danjem na problemati\u010dna obmo\u010dja
  in teme ne zanemarimo potreb in prilo\u017enosti bolj dinami\u010dnih okolij, posameznikov
  in skupin.\\n\\nV novem razvojnem obdobju bomo na vseh podro\u010djih lokalnih storitev,
  javnih slu\u017eb in infrastrukture, kjer je ekonomsko upravi\u010deno, sledili
  konceptu ''pametnih skupnosti'' in spodbujali usposabljanja za dvig digitalnih kompetenc
  ob\u010danov. S ciljem zagotavljanja sinergij, kriti\u010dne mase uporabnikov in
  prenosa znanj bo Ob\u010dina Tr\u017ei\u010d \u0161e naprej sodelovala s sosednjimi
  ob\u010dinami in regijo. Ob\u010dina s tem na\u010drtom razli\u010dnim raziskovalnim,
  razvojnim in drugim partnerjem tudi sporo\u010da, da je odprta za raziskave, presku\u0161anje
  inovativnih pristopov in poslovno-finan\u010dnih modelov na podro\u010djih, kjer
  imamo najve\u010dje potrebe: socialna oskrba, mikro mobilnost, kro\u017eno gospodarjenje,
  vpliv podnebnih sprememb, regeneracija razvednotenih obmo\u010dij, integracija itd).\\n\\nSlika
