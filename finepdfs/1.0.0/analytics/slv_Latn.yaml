  IN ZBIRANJE GRADIVA:\\n\\n- evidentiranje muzejskih predmetov, povezanih s \u0161portom
  po slovenskih muzejih in pri posameznikih, ki so povezani s \u0161portom in njegovo
  zgodovino\\n\\nUREJANJE, DOKUMENTIRANJE IN HRANJENJE GRADIVA:\\n\\n- urejanje pedago\u0161ke
  fototeke\\n- zbiranje, urejanje, dokumentiranje zbirke iz otro\u0161kega \u017eivljenja\\n-
  sprotna inventarizacija pridobljenih knjig in revij v muzejski knji\u017enici\\n\\nRAZISKOVALNO
  IN PUBLICISTI\u010cNO DELO:\\n\\n- priprava programa lutkovnih prireditev za Poletje
