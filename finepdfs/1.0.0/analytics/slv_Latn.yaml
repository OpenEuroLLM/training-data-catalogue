  barva indeksa pomeni, da se ob\u010dina nahaja v slab\u0161em polo\u017eaju glede
  na leto 2010 oz. glede na kot regijo oz. dr\u017eavo. Zelena barva pomeni bolj\u0161i
  polo\u017eaj ob\u010dine.\"", "\"NAVODILO PACIENTOM\\n\\nNAVODILA PACIENTOM S PO\u0160KODBO
  GLAVE\\n\\nTa navodila so namenjena po\u0161kodovancem (in njihovim skrbnikom) z
  ugotovljeno po\u0161kodbo glave, ki so bili po zaklju\u010deni diagnostiki ali opazovanju
  odpu\u0161\u010deni domov.\\n\\nLA\u017dJE PO\u0160KODBE GLAVE\\n\\nUdarci v glavo
  in la\u017eje po\u0161kodbe glave so pogoste, posebno pri otrocih. \u010ce je po\u0161kodovanec
  pri polni zavesti (buden in bister) in \u010de nima globoke razpo\u010dne rane ali
  huj\u0161e po\u0161kodbe mehkih delov v predelu glave, je po\u0161kodba mo\u017egan
  malo verjetna.\\n\\nVendarle pa lahko mo\u010dnej\u0161i udarec v glavo povzro\u010di
  po\u0161kodbo mo\u017egan ali znotraj lobanjsko krvavitev. Po\u0161kodovana krvna
  \u017eila lahko krvavi v mo\u017egane ali bolj pogosto v prostor med mo\u017eganskimi
  ovojnicami in lobanjo. Take po\u0161kodbe niso pogoste, so pa resne in zaradi pritiska
  hematoma na mo\u017egane lahko ogrozijo \u017eivljenje po\u0161kodovanca/ke.\\n\\nZnaki
  po\u0161kodbe mo\u017egan ali znotraj lobanjske krvavitve se lahko pojavijo \u0161ele
  po nekaj urah, v\u010dasih celo nekaj dni po po\u0161kodbi glave. Zelo redko se
  lahko znaki po\u010dasnega krvavenja v lobanjski prostor razvijejo tudi ve\u010d
  tednov po po\u0161kodbi glave (pri starej\u0161ih, kroni\u010dnih odvisnikih od
  alkohola, itd).\\n\\nPonoven obisk pri zdravniku je nujen, \u010de se po po\u0161kodbi
  glave in po odpustu iz bolni\u0161nice pojavijo naslednji znaki:\\n\\n- zaspanost
  v okoli\u0161\u010dinah, v katerih bi bili normalno povsem budni;\\n- vedno mo\u010dnej\u0161i
  glavobol;\\n- zmedenost, nenavadno obna\u0161anje;\\n- motnje govora in razumevanja;\\n-
  motnja funkcije dela telesa (npr. oslabelost roke ali noge);\\n- motnja ravnote\u017eja,
  mi\u0161i\u010dni kr\u010di;\\n- motnje vida (npr. zamegljen vid ali dvojni vid);\\n-
  kri ali bistra teko\u010dina, ki izteka iz nosu ali u\u0161esa,\\n- poslab\u0161anje
  sluha na eno ali obe u\u0161esi po po\u0161kodbi;\\n- nenavaden na\u010din dihanja
  (po\u010dasnej\u0161e ali hitrej\u0161e dihanje, nenavadno dolge pavze med dvema
  vdihoma in podobno).\\n\\nNENAVADNA ZASPANOST\\n\\nPo udarcu v glavo majhni otroci
  pogosto jokajo in so vznemirjeni, potem pa se umirijo. Zelo obi\u010dajno potem
  v kratkem \u010dasu zaspijo. To je normalno. Normalno se po takem spanju popolnoma
  zbudijo in so povsem bistri. Nekateri star\u0161i se bojijo dovoliti otrokom po
  po\u0161kodbi zaspati, \u010deprav je \u010das, da gredo spat. To jim lahko dovolite.
  Nenavadna zaspanost pomeni, da se jih ne da normalno zbuditi. \u010ce ste zaskrbljeni,
  potem otroka zbudite po eni uri ali prej. Seveda bodo nerazpolo\u017eeni, ker ste
  jih zbudili, vendar bo s tem va\u0161a skrb pomirjena. Potem jim dovolite, da ponovno
  zaspijo. \u010ce ste posebno zaskrbljeni zaradi po\u0161kodbe glave, jih lahko zbudite
  tudi ve\u010dkrat tekom no\u010di. Ko otroci spijo, preverjajte samo ali dihajo
  normalno in ali spijo v normalnem polo\u017eaju.\\n\\nGLAVOBOL\\n\\nLahen glavobol
  po udarcu v glavo je normalen. Obi\u010dajno je podro\u010dje udarca bole\u010de
  na dotik ali na otip, tudi oteklina je normalna. Po\u0161kodovanec lahko vzame la\u017eji
  analgetik kot je Lekadol ali Naklofen. Zaskrbljeni pa moramo biti, \u010de postaja
  glavobol mo\u010dnej\u0161i in mo\u010dnej\u0161i.\\n\\nNP KRG KOTR 001\\n\\nizdaja
  1 (03/2012)\\n\\n1 / 2\\n\\nNEKATERI DRUGI ZNAKI, KI SE LAHKO POJAVIJO PO PO\u0160KODBI
  GLAVE\\n\\nPo po\u0161kodbi glave se lahko razvijejo la\u017eji simptomi, ki niso
  pomembni in ki postopoma izzvenijo v tednu ali dveh. To so lahko la\u017eji glavobol,
  ob\u010dutek slabosti brez bruhanja (razdra\u017eljivost, utrujenost, izguba apetita,
  te\u017eave s koncentracijo). Te te\u017eave se lahko pojavijo kot reakcija na po\u0161kodbo
  glave in niso posledica krvavitve ali resne po\u0161kodbe glave. Seveda, \u010de
  kakor koli dvomite in ste zaskrbljeni zaradi znakov po po\u0161kodbi glave, je najbolje,
  da greste na pregled k osebnemu zdravniku, kakor hitro je mogo\u010de ali se z njim
  posvetujete po telefonu. Zdravnika obi\u0161\u010dite tudi, \u010de zgoraj navedeni
  znaki v dveh tednih niso povsem izzveneli.\\n\\nNEKAJ SPLO\u0160NIH NAVODIL\\n\\n\u010ce
  je le mogo\u010de prvih osemin\u0161tirideset ur po po\u0161kodbi glave ne ostajajte
  doma sami. Ta navodila poka\u017eite sorodniku ali prijatelju, tako da bo tudi on
  obve\u0161\u010den in pozoren na znake, ki govorijo za resno po\u0161kodbo glave.
  Ostanite v kraju, kjer je dosegljiva medicinska pomo\u010d. Nekaj dni ne u\u017eivajte
  alkohola ali opojnih drog. Nekaj dni ne jemljite uspavalnih tablet ali pomirjeval,
  razen \u010de vam jih je predpisal zdravnik. Z zdravnikom se posvetujte glede dela
  in kontaktnih \u0161portov, kot so \u0161porti z \u017eogo. Obi\u010dajno odsvetujemo
  delo z nevarnimi stroji, v nevarnih okoli\u0161\u010dinah, delo na vi\u0161ini in
  kontaktne \u0161porte (borilne \u0161porte, \u0161porte z \u017eogo, itd.) tri tedne
  po po\u0161kodbi glave. Ne vozite avtomobila, motornega kolesa ali kolesa in ne
  upravljajte nevarnih strojev, dokler se ne po\u010dutite popolnoma zdravega. \u010ce
  ste zaradi kakr\u0161nih koli znakov ali poslab\u0161anja po odpustu iz bolni\u0161nice
  po po\u0161kodbi glave zaskrbljeni, se posvetujte z zdravnikom.\\n\\nNP KRG KOTR
  001\\n\\nizdaja 1 (03/2012)\\n\\n2 / 2\"", "\"20. redna seja ob\u010dinskega sveta
  dne 20.  februarja 2018\\n\\nGradivo za 16. to\u010dko dnevnega reda\\n\\nZADEVA:
  Letni program \u0161porta v ob\u010dini Slovenska Bistrica za leto 2018\\n\\nPoro\u010devalka:
  Irena JEREB, vodja  oddelka za dru\u017ebene dejavnosti\\n\\nOB\u010cINA SLOVENSKA
  BISTRICA\\n\\nOb\u010dinska uprava\\n\\nOddelek za dru\u017ebene dejavnosti\\n\\nKolodvorska
  ulica10,  2310 Slovenska Bistrica\\n\\ntelefon: h.c. + 386 2 / 843 28 20,  81 81
  912, fax: + 386 2 / 843 28 50 e-mail: email@example.com uradna spletna stran http://www.slovenska-bistrica.si\\n\\n\u0160tevilka:
  20/2018-LP\u0160\\n\\nDatum:  31.01.2017\\n\\nOB\u010cINA SLOVENSKA BISTRICA O  b  \u010d  i  n  s  k  i   s  v  e  t\\n\\nZADEVA:    Letni
  program \u0161porta v ob\u010dini Slovenska Bistrica za leto 2018\\n\\nI. PREDLAGATELJ\\n\\n\u017dupan,
  dr. Ivan \u017dAGAR\\n\\nII. DELOVNO TELO, PRISTOJNO ZA OBRAVNAVO\\n\\nOdbor za
  dru\u017ebene dejavnosti\\n\\nIII. VRSTA POSTOPKA\\n\\nEnofazni\\n\\nIV. PRAVNE
  PODLAGE\\n\\n- Pravilnik o sofinanciranju letnega programa  \u0161porta v ob\u010dini
  Slovenska Bistrica (Uradni list RS, \u0161t. 29/16),\\n- Statut Ob\u010dine Slovenska
  Bistrica (Uradni list RS, \u0161t. 55/2010)\\n\\nV. NAMEN, CILJI SPREJEMA\\n\\nLetni
  program \u0161porta je dokument v katerem so opredeljena podro\u010dja \u0161porta,
  ki se bodo sofinancirala z prora\u010dunskimi sredstvi Ob\u010dine, ter obseg sredstev
  po posameznih  vsebinah.\\n\\nProgram je osnova za izvedbo javnega razpisa, na osnovi
  katerega se prora\u010dunska sredstva razdelijo med izvajalce \u0161portnih programov.\\n\\nIzhodi\u0161\u010de
  za pripravo programa je bil Letni program \u0161porta ob\u010dine Slovenska Bistrica
  za leto 2017 in realizacija sredstev v letu 2017.\\n\\nS predlogom  Letnega programa
  \u0161porta za leto 2018 sta tudi   sogla\u0161ala  Zavod za \u0161port Slovenska
  Bistrica in \u0160portna zveza ob\u010dine Slovenska Bistrica.\\n\\nVI. FINAN\u010cNE
  POSLEDICE\\n\\nSredstva so zagotovljena v prora\u010dunu ob\u010dine Slovenska Bistrica
  na postavki 126.96.36.199. Letni program \u0161porta, v vi\u0161ini 193.725,00 \u20ac.\\n\\nVII.
  PREDLOG SKLEPA\\n\\nOb\u010dinskemu svetu predlagamo, da predlo\u017eeno gradivo
  obravnava, o njem razpravlja ter  sprejme naslednji\\n\\nSKLEP\\n\\nOb\u010dinski
  svet Ob\u010dine Slovenska Bistrica sprejme Letni program \u0161porta v ob\u010dini
  Slovenska Bistrica za leto 2018.\\n\\nS spo\u0161tovanjem!\\n\\nPripravila:\\n\\nNata\u0161a
  Pernat\\n\\nIrena JEREB, dipl. upr. org., vodja oddelka\\n\\nPriloga:\\n\\n- Letni
  program \u0161porta v ob\u010dini Slovenska Bistrica za leto 2018 - predlog\\n\\nO  B  \u010c  I  N  A
  SLOVENSKA BISTRICA\\n\\nO b \u010d i n s k i s v e t\\n\\nKolodvorska ulica 10,  2310
  Slovenska Bistrica\\n\\ntelefon: h.c. + 386 2 / 843 28 00fax: + 386 2 / 818 11 41\\n\\ne-mail:
  firstname.lastname@example.org internetna stran: www.slovenska-bistrica.si\\n\\nNa
  osnovi Pravilnika o sofinanciranju letnega programa \u0161porta v ob\u010dini Slovenska
  Bistrica (Uradni list RS, \u0161t. 29/16) in na osnovi Odloka o prora\u010dunu ob\u010dine
  Slovenska Bistrica za leto 2018, Ob\u010dinski svet Ob\u010dine Slovenska Bistrica
  sprejme\\n\\nLETNI PROGRAM \u0160PORTA V OB\u010cINI SLOVENSKA BISTRICA za leto
  2018\\n\\n1. \u010dlen\\n\\nOb\u010dina Slovenska Bistrica z letnim programom \u0161porta
  dolo\u010da \u0161portna podro\u010dja, obseg in vrsto dejavnosti ter obseg sredstev,
  ki se za ta namen zagotavljajo v prora\u010dunu za leto 2018.\\n\\n2.\\n\\n\u010dlen\\n\\n\u0160portni
  programi se sofinancirajo na podlagi Pravilnika o sofinanciranju letnega programa
  \u0161porta v  ob\u010dini Slovenska Bistrica (v nadaljnjem besedilu: Pravilnik).\\n\\n3.
  \u010dlen\\n\\nIzvajalcem \u0161portnih programov se v letu 2018 sofinancirajo  naslednje
  dejavnosti:\\n\\n1. \u0160PORTNI PROGRAMI\\n1.1. Prosto\u010dasna \u0161portna vzgoja
  otrok in mladine\\n\\nProsto\u010dasna \u0161portna vzgoja otrok in mladine predstavlja
  \u0161irok spekter \u0161portnih dejavnosti za populacijo od pred\u0161olskega do
  vklju\u010dno srednje\u0161olskega obdobja. Vrednotijo se organizirane oblike \u0161porte
  dejavnosti ne-tekmovalnega zna\u010daja za otroke in mladino, ki nadgrajujejo \u0161olsko
  \u0161portno vzgojo, so vzgojno naravnani in niso del uradnih tekmovalnih sistemov
  NP\u0160Z.\\n\\n1.2. \u0160portna  vzgoja otrok s posebnimi potrebami\\n\\nProsto\u010dasno
  \u0161portno vzgojo otrok  in mladine s posebnimi potrebami predstavljajo \u0161portni
  programi, ki so namenjeni otrokom in mladini z motnjami v razvoju oziroma s prirojenimi
  in /ali pridobljenimi okvarami in se izvajajo z namenom ustrezno poskrbeti za uspe\u0161no
  socialno\\n\\nintegracijo v vsakdanjem \u017eivljenju.\\n1.3. \u0160portna vzgoja
  otrok in mladine usmerjenih  v kakovostni in vrhunski \u0161port \u0160portna vzgoja
  otrok in mladine usmerjenih v kakovostni in vrhunski \u0161port predstavlja \u0161irok
  spekter programov za otroke in mladino, ki se s \u0161portom ukvarjajo zaradi doseganja
  vrhunskih\\n\\n\u0161portnih rezultatov. Programi vklju\u010dujejo na\u010drtno
  skrb za mlade \u0161portnike, zato morajo izvajalci izpolnjevati prostorske, kadrovske
  in druge zahteve NP\u0160Z.\\n\\n1.4. Kakovostni \u0161port\\n\\nV skupino kakovostnega
  \u0161porta pri\u0161tevamo \u0161portnike in \u0161portne ekipe, ki ne izpolnjujejo
  pogojev za pridobitev statusa vrhunskega \u0161portnika, nastopajo na mednarodnih
  tekmovanjih, v uradnih tekmovalnih sistemih NP\u0160Z do naslova dr\u017eavnega  prvaka,
  ki jih potrdi OKS-Z\u0160Z in so registrirani skladno s pogoji NP\u0160Z ter OKS-Z\u0160Z.\\n\\n1.5
  Vrhunski \u0161port\\n\\nVrhunski \u0161port predstavlja programe priprav in tekmovanj
  vrhunskih \u0161portnikov, ki so v skladu s Pogoji, pravili in kriteriji za registriranje
  in kategoriziranje \u0161portnikov v Republiki Sloveniji v zadnji objavi OKS-Z\u0160Z
  pred objavo javnega razpisa navedeni kot \u010dlani \u0161portnega dru\u0161tva
  s sede\u017eem v ob\u010dini in so s svojimi \u0161portnimi dose\u017eki dosegli
  naziv \u0161portnika svetovnega razreda, mednarodnega razreda ali perspektivnega
  razreda.\\n\\n1.6. \u0160port invalidov\\n\\n\u0160port invalidov v svojih pojavnih
  oblikah predstavlja pomembne psihosocialne kot tudi \u0161portne u\u010dinke. Osnovni
  cilj je invalidom omogo\u010diti enakovredno sodelovanje pri prosto\u010dasnih \u0161portnih
  dejavnostih kako tudi v programih vrhunskih \u0161portnikov.\\n\\n1.7. \u0160portna
  rekreacija\\n\\n\u0160portna rekreacija predstavlja smiselno nadaljevanje obvezne
  in prosto\u010dasne \u0161portne vzgoje otrok in mladine, \u0161portne vzgoje otrok
  s posebnimi potrebami in tekmovalnega \u0161porta. \u0160portna rekreacija je zbir
  raznovrstnih \u0161portnih dejavnosti odraslih vseh starosti (nad 18 let) s ciljem
  aktivne in koristne izrabe \u010dlovekovega prostega \u010dasa, ohranjanja zdravja
  in dobrega po\u010dutja ter udele\u017ebe na rekreativnih tekmovanjih.\\n\\n2. USPOSABLJANJE
  IN  IZPOPOLNJEVANJE STROKOVNIH KADROV V \u0160PORT\\n\\nKakovostni strokovni kadri
  v \u0161portu so klju\u010d razvoja in  uspe\u0161nosti. Programi izobra\u017eevanja
  so v domeni izobra\u017eevalnega sistema, medtem ko programe usposabljanja in izpopolnjevanja
  izvajajo v NP\u0160Z po veljavnih programih usposabljanja in izpopolnjevanja, ki
  so verificirani pri strokovnem svetu RS za \u0161port in/ali pri strokovnih organih
  NP\u0160Z. Z prora\u010dunskimi sredstvi se bo sofinanciral del  materialni stro\u0161kov  udele\u017eencev
  v programih.\\n\\n3. DELOVANJE \u0160PORTNIH DRU\u0160TEV IN \u0160PORTNE ZVEZE\\n\\nS
  prora\u010dunskim sredstvi  se bo v letu 2018 sofinanciralo delovanje \u0161portnih
  dru\u0161tev in \u0161portne zveze.\\n\\n\u0160portna dru\u0161tva bodo sofinancirana  na
  podlagi pravilnika, kjer bodo pridobila to\u010dke glede na \u010das delovanja,
  \u0161tevilo \u010dlanov ter \u010dlanstva v NP\u0160Z in O\u0160Z.\\n\\nOb\u010dinska
  \u0161portna zveza je reprezentativni predstavnik civilne \u0161portne dru\u017ebe
  na lokalni ravni. O\u0160Z bo pridobila sofinancerska sredstva za  izvajanje programov
  in za stro\u0161ke dela ter za materialne stro\u0161ke delovanja zveze.\\n\\n4.
  \u0160PORTNE PRIREDITVE IN PROMOCIJA \u0160PORTA\\n\\n\u0160portne prireditve so
  osrednji dogodek organizacijske kulture \u0161porta z vplivom na promocijo okolja.
  S sredstvi LP\u0160 se bodo na podlagi pravilnika sofinancirali materialni stro\u0161ki
  izvedbe \u0161portnih prireditev. Udele\u017eba na uradnih tekmovanjih v okviru
  tekmovanj NP\u0160Z (dr\u017eavna prvenstva, liga\u0161ka in pokalna tekmovanja)
  ni  predmet sofinanciranja v okviru  te postavke.\\n\\n4. \u010dlen\\n\\nNamenska
  sredstva v prora\u010dunski postavki 188.8.131.52. Letni program \u0161porta, v
  vi\u0161ini =193.725,00 EUR, se delijo  po naslednjih podro\u010djih \u0161porta:\\n\\n5.
  \u010dlen\\n\\nRazpolo\u017eljiva  prora\u010dunska sredstva se razdelijo na podlagi
  javnega razpisa, na katerega se lahko prijavljajo \u0161portna dru\u0161tva ter
  drugi izvajalci, kot to dolo\u010da pravilnik. Predlo\u017eeni programi na javnem
  razpisu so podlaga za ustrezno vrednotenje in spremljanje izvajanja programov, ki
  jih sofinancira ob\u010dina.\\n\\n\u0160tevilka: 20/2018-LP\u0160\\n\\nSlovenska
  Bistrica, dne 20.02.2018\\n\\n\u017dupan dr. Ivan \u017dAGAR\"", "\"2.\\n\\nZapisnik
  II. seje dija\u0161ke skupnosti Gimnazije Ilirska Bistrica, 20. 11. 2020\\n\\nSeja
  dija\u0161ke skupnosti Gimnazije Ilirska Bistrica je potekala 20. 11. 2020, ob 14.15
  preko videokonferen\u010dnega sistema ZOOM. Prisotnih je bilo skupaj 5 predstavnikov
  razredov, tri programa gimnazije in dva programa tehnik ra\u010dunalni\u0161tva:\\n\\n*
  Ga\u0161per Kastelic, Jan Kastelic;\\n\\n4. a/IB\\n\\n* Timon Bubni\u010d;\\n\\n3.
  a/IB\\n\\n*\\n\\nMiha \u0160krabolje, Luka Dekleva; 4. r/IB\\n\\nMentorica dija\u0161ke
  skupnosti: prof. Eva Kristan.\\n\\nPoleg omenjenih je prisoten vodja enote Gimnazije
  Ilirska Bistrica prof. Gorazd Brne.\\n\\nDNEVNI RED\\n\\n1. Obseg snovi v okviru
  izobra\u017eevanja na daljavo\\n2. Preverjanje/ocenjevanje znanja na daljavo in
  potrebno \u0161tevilo ocen\\n3. Izvedba splo\u0161ne/poklicne mature\\n4. Razno\\n\\n1.
  Obseg snovi v okviru izobra\u017eevanja na daljavo\\n\\nDijaki \u010detrtega letnika
  programa tehnik ra\u010dunalni\u0161tva so izpostavili, da se pri nekaterih (strokovnih)
  predmetih, predvsem prakti\u010dni del modulov, izvaja zelo okrnjeno oz. neprilagojeno
  delu na daljavo. Nato pa so dodali, da jim predelava snovi pri strokovnih predmetih
  ne predstavlja dodatnih te\u017eav.\\n\\nPredstavljeno je, da se dijaki zaklju\u010dnega
  letnika gimnazijskega programa glede izvajanja maturitetnih predmetov, dogovarjajo
  s profesorji, ki jih te predmete pou\u010dujejo.\\n\\nProfesor Gorazd Brne predstavi
  sistem poteka izobra\u017eevanja na daljavo na Gimnaziji Ilirska Bistrica od za\u010detka
  dela na daljavo v \u0161olskem letu 2020/2021, ki je opredeljeno v Aneksu k \u0161olskim
  pravilom na Gimnaziji Ilirska Bistrica v \u010dasu izvajanja pouka v razmerah, povezanih
  s COVID-19. Utemelji, da je poleg ur izvedenih preko videokonferenc pri\u010dakovati
  tudi dodatno delo (v primeru izobra\u017eevanja v \u0161oli se izvede pouk v \u0161oli,
  ki se mu doda doma\u010de (popoldansko) delo.\\n\\nPreverjanje in ocenjevanje znanja
  na daljavo in potrebno \u0161tevilo ocen\\n\\nPredstavljeno je, da \u0161oli konkretna
  navodila, glede ocenjevanj in \u0161tevila potrebnih ocen pridobljenih pri delu
  na daljavo, niso bila posredovana. \u0160ola je v ta namen oblikovala Aneks k \u0161olskim
  pravilom ocenjevanja na Gimnaziji Ilirska Bistrica, ki opredeljuje na\u010dine ocenjevanja.
  (prof. Gorazd Brne)\\nIzpostavljena je problematika neenotnosti na\u010dinov nadzora
  ocenjevanj na daljavo, za katero se uporabljajo razli\u010dna spletna orodja (npr.:
  exam.net, safeexambrowser.com \u2026). Pri tem pa so prisotne tudi razli\u010dne
  zahteve s strani profesorjev o na\u010dinu nadzora ocenjevanja \u2013 oddajanje
  video-povezave preko ve\u010d naprav hkrati pri nekaterih predmetih, pri nekaterih
  pa le preko ene kamere. \u2013 Predlagano je poenotenje praks ocenjevanja znanja
  v okviru Gimnazije Ilirska Bistrica.\\n\\n3. Izvedba splo\u0161ne in poklicne mature\\n\\nPonovno
  je predstavljen predlog/pobuda za izvajanje, poleg ustnih, tudi pisnih delov izpita
  splo\u0161ne in poklicne mature na Gimnaziji Ilirska Bistrica. (Delovna skupina
  \u0160C Postojna za Gimnazijo Ilirska Bistrica je pobudo obravnavala in jo predala
  tudi svetu star\u0161ev/vodstvu \u0160C Postojna, ki naj bi podal(o) uraden pisni
  odgovor nanjo, a tega do trenutnega \u010dasa ni bilo). \u2013 Predstojnik enote
  utemelji problematiko izvajanja pisnih izpitov splo\u0161ne in poklicne mature na
  enoti v Ilirski Bistrici, kljub temu da je bila splo\u0161na in poklicna matura
  2020 (deloma) izvedena v Ilirski Bistrici, a pod prilagojenimi pogoji.\\n\\nPredstavljena
  so mnenja/predlogi o izvedbi splo\u0161ne in poklicne mature, ki so jih oblikovali
  dijaki zaklju\u010dnih letnikov programa gimnazije in programa tehnik ra\u010dunalni\u0161tva,
  in bodo predstavljeni na Regionalnem posvetu o izvedbi mature 2021 v prihodnjem
  tednu, s strani Dija\u0161ke organizacije Slovenije:\\n\\n- prilagojena poklicna
  matura (ve\u010dinski dele\u017e snovi predviden za obravnavo v 3. letniku TR se
  utrjuje \u0161ele v septembru 2020; velik del 3. letnika in del 4. letnika poteka
  izobra\u017eevanj na daljavo, ki ne prina\u0161a z \u00bbnormalnim\u00ab izobra\u017eevanjem
  kakovostno primerljivega znanja);\\n\\n- prilagojeno izvajanje internega dela splo\u0161ne
  mature (laboratorijske vaje, ekskurzije) v primeru dalj\u0161ega izobra\u017eevanja
  na daljavo;\\n- manj\u0161a sprememba koledarja splo\u0161ne mature (datumska raztegnitev);\\n-
  izlo\u010ditev enega izmed dveh literarnih del pri predmetih sloven\u0161\u010dina
  in angle\u0161\u010dina splo\u0161ne mature.\\n\\nProfesor Gorazd Brne predlaga
  posvet s tajnico splo\u0161ne mature mag. Sonjo \u0160krlj Po\u010dkaj in tajnico
  poklicne mature prof. Kajetano Torni\u010d glede izvedbe splo\u0161ne in poklicne
  mature 2021.\\n\\nDijaki \u010detrtega letnika tehnika ra\u010dunalni\u0161tva povpra\u0161ajo
  o mo\u017enosti izvedbe dodatnih ur matematike za matematiko na maturi kot 5. predmet
  (gimnazijska raven). \u2013 Profesor Brne predstavi kot mo\u017enost izvedbe dodatnih
  (20) ur matematike s strani prof. Rudija Valen\u010di\u010d v okviru strokovnih
  programov v Postojni ali s strani prof. Marje Oberstar (/prof. Tja\u0161e A\u017enik)
  le za dijake tehnikov ra\u010dunalni\u0161tva v Ilirski Bistrici.\\n\\n4. Razno\\n\\n-
  Predstavljena je problematika izvedbe PUD-a, ki je bil organiziran pri oddelku zaklju\u010dnega
  letnika programa tehnik ra\u010dunalni\u0161tva. Navedeno je bilo, da se je datum
  opravljanja PUD-a (tik) pred nastopom opravljanja delovne prakse premaknil na kasnej\u0161i
  \u010das, zato so imeli nekateri dijaki te\u017eave in so bili s strani delodajalcev
  sre\u010dani z nerazumevanjem. (Nastalo situacijo pojasni prof. Gorazd Brne).\\n-
  S strani vodje enote Gimnazije Ilirska Bistrica je predlagan dodaten sestanek dija\u0161ke
  skupnosti glede izvedbe dneva odprtih vrat Gimnazije Ilirska Bistrica za u\u010dence
  zaklju\u010dnih razredov ilirskobistri\u0161kih osnovnih \u0161ol.\\n- Predlagana
  (s strani 4. r/IB) je izvedba izobra\u017eevalnega dela na \u0161oli/v \u017eivo
  vsaj za zaklju\u010dne letnike. V 4. r/IB je bila (s strani predstavnika razreda)
  izvedena anketa, v kateri se ve\u010dinski dele\u017e razreda s tem strinja.\\n\\nZapisnik
  sestavil: Jan Kastelic, 4. a/IB\\n\\nMentorica: prof. Eva Kristan\"", "\"KATALOG
  ZNANJA\\n\\n1. Ime modula: NA\u010cRTOVANJE ELEKTRI\u010cNIH IN\u0160TALACIJ\\n\\n2.
  Usmerjevalni cilji:\\n\\nDijak:\\n\\n* uporablja tehni\u010dno dokumentacijo, strokovno
  terminologijo, izdeluje in arhivira skice, risbe in na\u010drte,\\n* na\u010drtuje,
  uporablja in izbira ustrezne elemente/naprave navadnih in pametnih in\u0161talacij
  v razli\u010dnih prostorih in objektih,\\n* spozna lastnosti elementov in delovanje
  naprav, dimenzionira: vodnike, tokokroge, varovalne elemente, naredi enostaven svetlobno-tehni\u010dni
  izra\u010dun in izbere svetila,\\n* spozna programska orodja za na\u010drtovanje
  in\u0161talacij, dimenzioniranje vodnikov in kablov ter projektiranje razsvetljave,\\n*
  razvija sposobnosti re\u0161evanja problemov, vodenja, timskega dela, finan\u010dne
  ocene investicije in izdelave predra\u010duna,\\n* opravlja nadzor, vzdr\u017eevalna
  dela, meritve, odkriva napake, nastavlja parametre naprav, popravi ali zamenja posamezne
  dele in uvaja izbolj\u0161ave,\\n* dela v skladu s predpisanimi postopki in standardi
  za zagotavljanje varnega delovnega okolja.\\n\\n3. Poklicne kompetence:\\n\\n1.
  Izdelovanje/na\u010drtovanje projektne dokumentacije in pridobivanje soglasij.\\n3.
  Izdelovanje, monta\u017ea in priklju\u010devanje elementov pametnih in\u0161talacij.\\n2.
  Izbiranje, ozna\u010devanje in dokumentiranje elementov in\u0161talacij.\\n4. Nastavljanje
  in spreminjanje parametrov ter zagon naprav/sistemov in\u0161talacij.\\n6. Merjenje
  koli\u010din, odpravljanje napak in uvajanje izbolj\u0161av.\\n5. Sodelovanje v
  projektnih timih.\\n7. Upo\u0161tevanje ukrepov za varno delo in prepre\u010devanje
  onesna\u017eevanja okolja.\\n\\n4. Operativni cilji:\\n\\n1. Izdelovanje/na\u010drtovanje
  projektne dokumentacije in pridobivanje soglasij.\\n\\nInformativni cilji\\n\\nFormativni
  cilji\\n\\n* razlikuje osnovne graditve objektov (IP, PGD, PZR, PID),\\n* bere podatke
  iz strokovne literature, pozna simbole, oznake,\\n* uporabi standarde in predpise,\\n*
  upo\u0161teva tehni\u010dna navodila in bere na\u010drte,\\n* se seznani z veljavnimi
  standardi, predpisi in soglasji\\n* razlikuje simbole, se seznani s strokovno literaturo,
  vezalnimi na\u010drti, shemami, tehni\u010dnimi navodili in ostalo dokumentacijo,\\n*
  pridobi soglasja in izdela enostaven elaborat\\n\\n2. Izbiranje, ozna\u010devanje
  in dokumentiranje elementov in\u0161talacij.\\n\\nInformativni cilji\\n\\nFormativni
  cilji\\n\\nDijak:\\n\\n* razlo\u017ei delovanje RCD stikal, taljivih varovalk ali
  in\u0161talacijskih odklopnikov,\\n* lo\u010di namembnost prostorov in lokacijo
  razdelilnikov,\\n* navede kaj je te\u017ei\u0161\u010de porabe,\\n* na\u0161teje
  svetlobne vire in njihovo uporabo (\u017earnice z \u017earilnimi nitkami, sijalke,
  LED svetila),\\n* razlikuje in pozna fotometri\u010dne koli\u010dine (svetlobni
  tok, svetilnost, osvetljenost in svetlost),\\n* lo\u010di in\u0161talacijske stike
  in stikala,\\n* dolo\u010di vti\u010dno-spojne elemente,\\n* dolo\u010di \u0161tevilo
  tokokrogov, njihovo obremenitev, vrsto in prerez vodnikov,\\n* ozna\u010duje tokokroge,\\n*
  na\u0161teje kaj vsebujejo razdelilniki,\\n\\n3. Izdelovanje, monta\u017ea in priklju\u010devanje
  elementov pametnih in\u0161talacij.\\n\\nInformativni cilji\\n\\nFormativni cilji\\n\\nDijak:\\n\\n*
  opi\u0161e delovanje/topologijo sistema, prenos podatkov in programiranje naprav,\\n*
  na\u0161teje elemente pametnih in\u0161talacij (vodila, protokole, komponente),\\n\\nDijak:\\n\\n*
  glede na vrsto in uporabo objekta na\u010drtuje EIB/KNX in\u0161talacije,\\n* pozna
  pomen, prednosti pametnih in\u0161talacij in njihovo tehnologijo,\\n\\nDijak:\\n\\n*
  izbere za\u0161\u010dito pred napetostjo dotika, dolo\u010da nazivne tokove varovalnih
  in stikalnih elementov,\\n* projektira tokokroge, vodnike, razsvetljavo in stikala,\\n*
  dolo\u010di lokacijo razdelilnikov v objektu,\\n* uporabi razli\u010dne svetlobne
  vire in stikala,\\n* upo\u0161teva pomen IP \u0161tevilk glede na prostor,\\n* razlikuje
  fotometri\u010dne koli\u010dine in jih ra\u010duna,\\n\\n4. Nastavljanje in spreminjanje
  parametrov ter zagon naprav/sistemov in\u0161talacij.\\n\\n5. Sodelovanje v projektnih
  timih.\\n\\n6. Merjenje koli\u010din, odpravljanje napak in uvajanje izbolj\u0161av.\\n\\n7.
  Upo\u0161tevanje ukrepov za varno delo in prepre\u010devanje onesna\u017eevanja
  okolja.\"", "\"LETNO PORO\u010cILO Zavoda Radio \u0160tudent za leto 2021\\n\\nVSEBINA\\n\\nOSNOVNI
  PODATKI O ZAVODU\\n\\nZavod Radio \u0160tudent (v nadaljevanju Zavod R\u0160) deluje
  v skladu z dolo\u010dili Zakona o zavodih in sklepov organov upravljanja.\\n\\nZavod
  R\u0160 je bil ustanovljen kot samostojna pravna oseba leta 1975, v sodni register
  je bil vpisan 9.6.1975.\\n\\nGlavna dejavnost Zavoda R\u0160 je: 60.100 Radijska
  dejavnost\\n\\nZavod  Radio  \u0160tudent  je  \u0161tudentski  radio,  katerega  ustanoviteljica  je  \u0160tudentska
  organizacija  Univerze  v  Ljubljani,  ter  nepridobitna  civilno-dru\u017ebena  in  kulturno-
  izobra\u017eevalna organizacija,  ki ima   pravni   status   privatnega   zavoda.   Z   dnem
  12.4.2012   ima   program   Radia   \u0160tudent   tudi   uradno   priznan   nacionalni   status
  \u0161tudentskega radijskega programa posebnega pomena. Po svojih dejavnostih in
  delovanju pa tudi priznan status nevladne organizacije, ki deluje v javnem interesu
  na podro\u010dju mladinskega sektorja.\\n\\nKlju\u010dni organi Zavoda R\u0160 so:\\n\\n-
  Svet Zavoda R\u0160 s 7 \u010dlani - predsednik \u017dan Zupan,\\n- Strokovni svet
  R\u0160, ki ga sestavljajo vodje poslovnih in programskih slu\u017eb s 15 \u010dlani,\\n-
  direktorica Zavoda R\u0160 \u2013 Ana Kandare,\\n- odgovorni urednik R\u0160 \u2013
  Matja\u017e Zorec.\\n\\nSvet  Zavoda  R\u0160  ima  3  predstavnike  imenovane  s  strani  organov  ustanovitelja,  3
  predstavnike imenovane s strani sodelavcev in 1 predstavnika javnosti.\\n\\nZavod  Radio  \u0160tudent  je  imel  na  dan  31.12.2021  7  redno  zaposlenih  na  krovnih
  funkcijah,  in  sicer  direktorico,  odgovornega  urednika,  vodjo  projektne  pisarne,  vodjo
  ekonomsko-propagandne slu\u017ebe in skrbnika zvo\u010dne podobe medijskih vsebin,
  vodjo tonsko-tehni\u010dne slu\u017ebe, vodjo organizacije,  izvedbe   in   razvoja   programa   \u2013   VOIP
  ter razvijalca  in  upravljalca  spletnih  in  IT  re\u0161itev.  Poslovni krovni  sodelavec,  ki
  sodelujejo z  R\u0160  kot  s.p. pa je \u0161e vodja  finan\u010dno-administrativne  slu\u017ebe  R\u0160
  in pomo\u010dnik  direktorice.\\n\\nDrugi krovni sodelavci na dan 31.12.2021 so
  \u0161e slede\u010di \u010dlani Strokovnega sveta R\u0160, vodje uredni\u0161tev
  in programskih slu\u017eb: urednica  Glasbene  redakcije,  urednik  Redakcije  za
  kulturo  in  humanisti\u010dne  vede, urednik   Aktualno-politi\u010dne   redakcije,   urednica   Univerzitetne   redakcije,   urednik
  Znanstvene redakcije, vodja Slu\u017ebe za napovedovanje in vodja lektorske slu\u017ebe
  R\u0160.\\n\\nRadio  \u0160tudent  je  ena  najstarej\u0161ih  in  najve\u010djih  evropskih  urbanih  nekomercialnih
  radijskih  postaj  v  Evropi,  ki  oddaja  \u0161tudentski  nepridobitni  radijski  program  \u017ee  52.
  leto, kar  je  tudi  njegova  glavna  dejavnost.  Zaradi  narave  njegovega  poslanstva  je
  enako pomembna tudi dejavnost izobra\u017eevanja mladih za novinarska in druga dela
  na  radijski postaji.  Na  avdicije  treh  programskih  slu\u017eb  (Tonsko-tehni\u010dna  slu\u017eba,
  Slu\u017eba  za  napovedovanje  in  Video  sekcija)  in  5  uredni\u0161tev  (Aktualno-politi\u010dna
  redakcija,   Redakcija za   kulturo   in   humanisti\u010dne   vede,   Glasbena   redakcija,
  Univerzitetna  redakcija  in Znanstvena redakcija) se za posamezne radijske poklice
  letno  prijavi  preko  250  kandidatov, kar  pomeni,  da  je  interes  za  delo  na  Radiu
  \u0160tudent velik.\\n\\nPomembna   dejavnost   Radia   \u0160tudent,   predvsem   v   finan\u010dnem,   deloma   tudi
  izobra\u017eevalnem  smislu,  je  marketing,  tako  v  smislu  tr\u017eenja  lastnega  etra  kot  tudi
  avdio produkcije  in  video  sinhronizacije  za  zunanje  naro\u010dnike, v zadnjih
  dveh letih tudi z uspe\u0161no razvito komercialno dejavnostjo video prenosov in
  produkcije. Dejavnost  \u010drpanja javnih sredstev za dejavnosti R\u0160 v javnem
  interesu je \u0161e naprej na zelo visoki ravni in je v zadnjih letih v finan\u010dnem  smislu  postala  najpomembnej\u0161a  dejavnost  Radia  \u0160tudent.
  Preko prijavljanja  razli\u010dne  produkcije  (programske,  izobra\u017eevalne,  kulturno-glasbene  in
  specifi\u010dne produkcije za dru\u017ebeno-ranljive skupine) na ustrezne razpise
  skrbi tako za sofinanciranje obstoje\u010dih vsebin kot tudi za ustvarjanje novih.
  Poleg na\u0161tetih jedrnih dejavnosti je Radio \u0160tudent izvajal tudi dejavnosti
  kulturne in glasbene produkcije ter zalo\u017eni\u0161tva,  seveda  v  meri,  kot  so  to  omogo\u010dala  na  ciljnih  razpisnih  podro\u010djih
  pridobljena sredstva oziroma drugi viri podpore dejavnostim.\\n\\nPo  vrstah  dejavnosti  torej  pokrivamo  radijsko  produkcijo  in  predvajanje,  produkcijo
  zvo\u010dnih   podob, video  produkcijo  in  video  sinhronizacijo ter video prenose,  glasbeno  in
  kulturno  produkcijo  ter  zalo\u017eni\u0161tvo,  usposabljanja  na  podro\u010dju  kulture  in  medijev,
  hkrati  pa  nudimo  podporo  dejavnostim  manj\u0161inskih  dru\u017ebenih  skupin,  razvoju  in
  izvedbam projektnih idej na podro\u010dju kulture in medijev.\\n\\nRadio   \u0160tudent  je  tudi  spo\u0161tovan  \u010dlan  mednarodnega  zdru\u017eenja  skupnostnih  radijev
  AMARC Europe in \u010dlan mre\u017ee \u0161tudentskih radijskih postaj in programov
  z obmo\u010dja Balkana, ki se redno sre\u010dujejo na regionalnih seminarjih Hear.Me
  in so v letu 2014 oblikovale mre\u017eo \u0161tudentskih radijskih postaj SWORD.
  Od leta 2012 naprej pa je tudi \u010dlan Asociacije \u2013   mre\u017ee   nevladnih   organizacij   in   samostojnih   ustvarjalcev   na
  podro\u010dju kulture in umetnosti.\\n\\nFinan\u010dno poslovanje poteka v skladu
  z veljavno zakonodajo, ki ureja to podro\u010dje, in je ra\u010dunovodsko spremljano
  s strani  ra\u010dunovodske slu\u017ebe, ATELJE 12 d.o.o., ki jo vodi Enes Niko\u010devi\u0107.\\n\\nVSEBINSKO
  PORO \u010c  ILO POSLOVODSTVA ZAVODA R \u0160 ZA LETO 2021\\n\\nZavod Radio \u0160tudent
  \u2013 Vsebinska izvedba za leto 2021\\n\\nZavod  Radio \u0160tudent  je od za\u010detka
  oddajanja leta 1969 naprej  s strani javnih \u0161tudentskih virov  subvencionirana   \u0161tudentska   radijska   postaja   in  nepridobitna  civilno-dru\u017ebena
  ter kulturno-izobra\u017eevalna   organizacija,   katere   ustanoviteljica   je   od   osamosvojitve
  naprej \u0160tudentska  organizacija  Univerze  v  Ljubljani.  Od  12.  4.  2012  ima  program  Radia  \u0160tudent
  tudi  uradno  priznani  nacionalni status  \u0161tudentskega  radijskega  programa  posebnega
  pomena. Z odlo\u010dbo, izdano 3.11.2017 in obnovljeno 13.10.2020,  pa je bil Zavodu
  Radio \u0160tudent podeljen tudi status zavoda, ki deluje v javnem interesu v mladinskem
  sektorju.\\n\\nKlju\u010dni podatki Radia \u0160tudent\\n\\nFrekvenca analognega
  oddajanja: 89,3 MHz (500 W) UKV STEREO\\n\\nOddajnik   Radia   \u0160tudent   pokriva   \u0161ir\u0161e   obmo\u010dje   Ljubljane   -   podro\u010dje   z  okoli
  500.000 prebivalcev  -  potencialnih  poslu\u0161alcev.  Po  zadnji  raziskavi  Mediane
  RM  iz 2021  ima  Radio \u0160tudent  10.000 poslu\u0161alk in poslu\u0161alcev
  na dan, kar je dvakrat ve\u010d kot leta 2018, ko je bilo 5.000 poslu\u0161alcev
  na dan. Po podatkih Mediane TGI (2021) je med poslu\u0161alstvom 30% mladih (do
  29 let), poslu\u0161astvo R\u0160 pa odlikujeta tudi najvi\u0161je povpre\u010dje
  tako glede povpre\u010dnega dohodka kot tudi izobrazbe med vsemi ob\u010dinstvi
  radijskih postaj v Sloveniji. Oddajanje pa  se  lahko  spremlja  tudi  preko interneta
  (www.radiostudent.si) in Siol TV (programsko mesto 319).\\n\\nAgencija  za  komunikacijska  omre\u017eja  in  storitve  je  4.6.2018  Radiu  \u0160tudent  kot  najvi\u0161je
  ocenjenemu   programu   na   drugem   pozivu   podelila pravico   raz\u0161irjanja   radijskega
  programa na obmo\u010dju celotne Slovenije v digitalni radiodifuzni tehniki, T-DAB+.
  Radio \u0160tudent ob podpori ustanovitelja prek DAB+ oddaja redno od konca septembra
  2018.\\n\\nhttps://www.facebook.com/radiostudent89.3\\n\\nhttps://twitter.com/radiostudent
  https://www.instagram.com /ra d i o stu d e nt\\n\\nVSEBINSKA  PREDSTAVITEV\\n\\nRadio  \u0160tudent  je  ena  najstarej\u0161ih  in  najve\u010djih  evropskih  urbanih  nekomercialnih  radijskih
  postaj  v  Evropi,  ki  oddaja  \u0161tudentski  nepridobitni  radijski  program.  Poleg  ustvarjanja  in
  oddajanja izobra\u017eevalnega, umetni\u0161kega, informativnega in glasbenega programa
  je enako pomembna tudi vzgojno-izobra\u017eevalna vloga Radia \u0160tudent. R\u0160
  vzgaja in izobra\u017euje mlade za  novinarska  in  druga  dela  na  radijski  postaji,  hkrati  pa  s  posve\u010danjem  zahtevnej\u0161im  in
  zapostavljenim temam izobra\u017euje poslu\u0161alstvo.\\n\\nSkupnosti, ki se jim
  posve\u010da Radio \u0160tudent v okviru svojega poslanstva, so zelo raznolike,
  in sicer:\\n\\n- \u0161tudentska skupnost in zaposleni v visokem \u0161olstvu \u2013
  posebna programska produkcija v  izvedbi  Univerzitetne  redakcije  \u2013  intervjuji,  komentarji,  okrogle  mize,  novice  s  podro\u010dja
  \u0161tudentskih in visoko\u0161olskih tem; zelo pomembno je tudi vklju\u010devanje
  \u0161tudentske skupnosti v okviru usposabljanj in sprejema novih sodelavcev R\u0160,\\n-
  analitiki  in  zainteresirana  \u0161tudentska  ter  \u0161ir\u0161a  javnost  na  podro\u010dju  dru\u017ebenopoliti\u010dnih
  tem \u2013 kompleksne oddaje,  komentarji, okrogle mize, aktualna obravnava tem
  z dru\u017ebeno-politi\u010dnega  podro\u010dja  v  produkciji  Aktualno-politi\u010dne
  redakcije, Redakcije  za  kulturo  in  humanisti\u010dne  vede, , Univerzitetne
  redakcije ter od leta 2018 tudi nove Znanstvene redakcije  (ki  smo  jo  leta  2014  \u2013  takrat  \u0161e  kot  med-redakcijo  -  s  podporo  \u0160OU  v
  Ljubljani vzpostavili   v   okviru   projekta   sodelovanja   s   \u0160tudentskimi   organizacijami   visoko\u0161olskih
  zavodov, predvsem naravoslovno-tehni\u010dnih fakultet Univerze v Ljubljani),\\n-
  kulturne institucije in NVO v kulturi \u2013 promocija, predstavitev kulturne produkcije
  drugih organizacij,  kulturne  in  glasbene  novice,  \u0161ola  kulturne  in  glasbene  kritike,  ena  najve\u010djih
  produkcij  kulturni\u0161kih  recenzij  v  Sloveniji,  intermedijska  produkcija  in  spletna  platforma
  RADAR ter intermedijski festival RADART,\\n- etni\u010dne manj\u0161inske skupnosti
  \u2013 posebne oddaje za srbsko, hrva\u0161ko in afri\u0161ko skupnost ter begunce
  v produkciji pripadnikov in organizacij teh skupnosti,\\n- dru\u017ebene  manj\u0161inske  skupnosti  in  socialno-politi\u010dne  skupine
  \u2013  posebne  oddaje za brezdomce, LGBT skupnost, anarhiste ipd.,\\n- posebna  pokrivanja  dru\u017ebeno-politi\u010dnih  tem  doma  in  po  svetu
  \u2013  redno  pokrivamo teme  s  podro\u010dja  dr\u017eav  Zahodnega  Balkana  \u2013  oddaja  Balkan  Ekspres  in  teme  iz
  dr\u017eav tretjega sveta \u2013 oddaja Ju\u017ena Hemisfera;\\n- poslu\u0161alci   in   ustvarjalci   glasbe,   zalo\u017eniki   ter   promotorji,   glasbeni   novinarji
  \u2013 glasbene recenzije in glasbene opreme v pripravi preko 60 novinarjev Glasbene
  redakcije, posebne oddaje o glasbenih \u017eanrih, ki jih drugi radijski mediji
  ne pokrivajo v zadostni meri, glasbene novice, glasbeni intervjuji in najave koncertov,\\n-
  glasbene  skupine  in  koncertna  prizori\u0161\u010da \u2013  promocija,  studijski  koncerti  v  \u017eivo,
  povezovanje  glasbenih  skupin  in  klubov  (mladinski,  \u0161tudentski  in  kulturni  centri  in  klubi),
  nate\u010daj za mlade in \u0161e neuveljavljene glasbene skupine (koncertna turneja
  Klubski maraton 2021 je bila kljub epidemiji covid-19 izvedena v 8  mladinskih,  \u0161tudentskih  in  lokalnih
  kulturnih  centrih  ter  klubih), glasbeno zalo\u017eni\u0161tvo v okviru ZAR\u0160,
  Festival TRESK  \u2013  predstavitev  glasbe  in  zalo\u017eni\u0161tva,  ki  je  bil  leta  2021
  kljub epidemiolo\u0161kim oviram izveden v prilagojeni obliki z vidika mednarodne
  udele\u017ebe, kar se ti\u010de slovenskih izvajalcev pa v polnokrvni koncertni
  izvedbi v Kino \u0160i\u0161ka.\\n\\nDEJAVNOSTI RADIA \u0160TUDENT\\n\\nGlavna dejavnost
  Radia \u0160tudent je ustvarjanje in oddajanje \u0161tudentskega nepridobitnega
  radijskega programa.\\n\\nTedenska povpre\u010dja dele\u017eev posameznih zvrsti
  programskih vsebin v 24-urnem dnevnem oddajnem \u010dasu (\u017eivi program, lastna
  produkcija):\\n\\n```\\ninformativne najmanj   ....6,60... % kulturno-umetni\u0161ke
  najmanj   ....26,34..% izobra\u017eevalne najmanj ....1,04....% otro\u0161ke ali
  mladinske najmanj ....0,30....% verske najmanj   ...../........ % \u0161portne najmanj   ....0,45....%
  kulturno-zabavne najmanj   ....34,47..% zabavne najmanj   ....0,60....%\\n```\\n\\nZaradi  narave  poslanstva  Zavoda  Radio  \u0160tudent  je  enako  pomembna  tudi  dejavnost
  izobra\u017eevanja mladih za novinarska in druga dela na radijski postaji. V letu
  2021 smo ponovno izvajali vse avdicije za nove programske sodelavce R\u0160 v \u0161tirih
  programskih slu\u017ebah (Tonsko-tehni\u010dna  slu\u017eba, Slu\u017eba  za  napovedovanje,
  Lektorska slu\u017eba in Video  sekcija  R\u0160) in 5 uredni\u0161tvih   (Aktualno-politi\u010dna   redakcija,   Redakcija   za   kulturo   in   humanisti\u010dne   vede,
  Glasbena redakcija, Univerzitetna redakcija in Znanstvena redakcija).  Na avdicije  se  je  prijavilo  preko
  285 zainteresiranih  novih  sodelavcev,  v  okviru  1.  kroga avdicij  pa  je  bilo  v  usposabljanja  po
  principu  u\u010denja  ob  delu  vklju\u010denih  preko  127 potencialnih  novih  sodelavcev,  ve\u010dinoma
  \u0161tudentov.  Izbrani  kandidati  so  dele\u017eni  obse\u017enega  in  kakovostnega  izobra\u017eevanja,  ki  ga
  redno delno sofinancira tudi Mestna ob\u010dina Ljubljana v okviru lokalnih mladinskih
  aktivnosti, od  leta  2018  naprej  pa  tudi  Urad  RS za  mladino.  Mlade  pa  vklju\u010dujemo  tudi  na  podro\u010dju
  \u0161tudentskih in dija\u0161kih praks.\\n\\nRadio \u0160tudent ima tudi mo\u010dno
  spletno prezenco. Spletni portal R\u0160 \u2013 www.radiostudent.si je namre\u010d
  eden najbolje razvitih spletnih portalov na podro\u010dju \u0161tudentskih in skupnostnih
  medijev,  o  pomenu  portala  na \u0161ir\u0161em medijskem podro\u010dju pri\u010dajo
  tudi podatki glede obiskanosti. Portal je imel v letu 2021 v povpre\u010dju ve\u010d
  kot 31.000 unikatnih obiskovalcev mese\u010dno, skoraj 4% ve\u010d kot v letu 2020.
  \u010ceprav se porast morda ne zdi velik, je zadovoljivo dejstvo da smo ve\u010d
  kot le ohranili \u0161tevilo unikatnih obiskovalcev iz leta 2020 - v tistem letu
  je v primerjavi z letom 2019 \u0161tevilo unikatnih obiskovalcev naraslo za skoraj
  30 % (na skoraj 30.000) Zanimiv podatek je, da smo zabele\u017eili obiske iz 178
  razli\u010dnih dr\u017eav, najve\u010d med tujimi obiski jih je bilo z Norve\u0161ke
  (17.560), tem sledijo obiski z Irske (17.204) in Hrva\u0161ke (9.809). Zaradi \u010dedalje
  ve\u010djih potreb na podro\u010dju upravljanja s spletom R\u0160, pa tudi zaradi
  rasto\u010dih potreb na podro\u010dju celotne dejavnosti informacijskih tehnologij,
  smo v 2021 pove\u010dali tudi investicijo v razvoj in upravljanje spletnih in IT
  re\u0161itev, za\u010deli pa smo tudi z delom na podro\u010dju prenove spletne strani
  R\u0160, ki bo dokon\u010dno prenovljena v prvi polovici 2022.\\n\\nV zadnjem letu
  smo nadaljevali z dodatnim investiranjem v aktivno upravljanje socialnih omre\u017eij
  R\u0160, ki poteka tako na ravni celotnega medija kot tudi na redakcijski ravni.
  To je opazno  pri  splo\u0161nem  trendu  pove\u010danja \u017ee tako velikega \u0161tevila
  sledilcev Facebook strani Radia \u0160tudent s 16.367 na za\u010detku leta vse do
  17.873 ob koncu leta. Povpre\u010dje  dosega  objav prvega trimese\u010dja 2021
  se giblje okoli 8.670, prvega trimese\u010dja leta 2020 pa okoli 2.830. Razlog za
  tako ob\u010duten skok \u0161tevilk je bila kriza ob odtegnitvi financiranja s strani
  \u0160OU, v kateri se je R\u0160 zna\u0161el ob za\u010detku leta. V tistih mesecih
  so se kanali na socialnih omre\u017ejih izkazali za enega izmed najbolj u\u010dinkovitih
  na\u010dinov komuniciranja z zainteresirano javnostjo. Mladi od 18-34 let predstavljajo
  dve tretjini podpornikov R\u0160 na Facebooku, na Instagramu \u0161e ve\u010d, predvsem
  je pri  slednjem zaznati najve\u010dji porast sledilcev od 4.932 na za\u010detku
  marca 2020 do 6.882 ob koncu leta.\\n\\nR\u0160 je tudi v letu 2021 nadaljeval z
  raz\u0161irjanjem dejavnosti glasbene produkcije, ki jo po sklopih predstavljajo:\\n\\n-
  Mednarodni Festival Tresk #12 - obra\u010dun glasbe in zalo\u017eni\u0161tva - je
  bil v letu 2021 prilagojen epidemiolo\u0161kim razmeram v dr\u017eavi. Festivalski
  dogodki so spri\u010do tega potekali v hibridni obliki. Festival, ki prejema podporo
  MK in MOL preko projektnih razpisov, poleg nastopov glasbenih skupin ponuja  \u0161e
  sejmi\u0161\u010de glasbenih zalo\u017eb, delavnice in okrogle mize na temo sodobne
  glasbene produkcije in distribucije, vse bolj pomemben del festivala pa postajajo
  njegovi vizualni nate\u010daji, ki pokrivajo kar pet kategorij. Letos se je tradicionalnemu
  sejmi\u0161\u010du pridru\u017eilo \u0161e virtualno sejmi\u0161\u010de na spletni
  platformi Gather.\\n- koncerti v \u017eivo iz studia R\u0160, pri \u010demer je
  ena pomembnej\u0161ih form na tem podro\u010dju cikel jutranjih  koncertov  Afterparty,
  ki  povpre\u010dno  \u0161tiri krat  mese\u010dno  predstavlja izbrane,  v ve\u010dini  slovenske  inovativne  glasbene  skupine,
  od  leta  2019  dalje  pa  se posve\u010damo tudi iskanju zanimivih tujih glasbenikov
  tekom njihovih turnej v Sloveniji, kar smo ohranili tudi v 2021;\\n- najve\u010dji  projekt  na  podro\u010dju  glasbene  produkcije  R\u0160  in  eden  redkih  glasbenih
  nate\u010dajev  v  Sloveniji  je Klubski  maraton  Radia  \u0160tudent,  ki  je  bil  tudi
  v 2021 izveden \u017ee enaindvajseti\u010d, epidemiolo\u0161kim oviram navkljub.
  Nate\u010daj  za  izbor  glasbenih  skupin  zaradi  \u0161irine  prijav predstavlja  pomemben  prerez  slovenske  glasbene  scene  v  dolo\u010denem  letu.  Po  2
  skladbi  izbranih  maratoncev  sta  izdani  na  kompilaciji  Klubski  maraton 2021  (500
  izvodov), kar so za ve\u010dino bendov prvi pravi studijski posnetki. Turneja je
  v letu 2021 skupaj  obiskala 7 mladinskih, \u0161tudentskih  klubov in  lokalne  kulturne  centre.
  Finale KM je bil tokrat izveden v \u017eivo izveden na letnem vrtu Gale Hale.\\n-
  Veliki koncertni dogodek je bil v letu 2021 izveden v okviru praznovanja 52. rojstnega
  dne Radia \u0160tudent v ve\u010d koncertnih sklopih. V okviru dogodka R\u0160 52
  - Nikoli nujnej\u0161i smo izvedli nastopa v okviru dveh celostnuh koncertnih dni
  v GalI Hali in z nastopi iz premikajo\u010de ladijce na Ljubljanici. V del Velikega
  koncerta je bil izid kompilacije Senzorama Vol 1., koncertni dogodek Re\u0160olucija
  2021 s protestni\u0161ko procesijo in Zlati gol \\\"Gala Banket\\\".\\n- Zalo\u017eba
  Radia \u0160tudent (ZAR\u0160) predstavlja platformo za mlade in \u0161e neuveljavljene
  bende, pa tudi nekatere izku\u0161enej\u0161e bende, da izvedejo snemanja v produkcijskem
  studiu R\u0160, nastopijo v  \u0161ir\u0161i javnosti pod blagovno znamko ter promocijsko
  in medijsko podporo R\u0160. Plo\u0161\u010de, izdane v okviru ZAR\u0160, prejemajo
  zelo dobre kritike tudi s strani \u0161ir\u0161e  strokovne  javnosti.  Gre  za  poslanstvo,  ki  ga  R\u0160  goji  in  razvija  \u017ee  od  svojih
  za\u010detkov,  \u0161e     intenzivneje pa od leta 2008 z zagonom zalo\u017ebe
  www.radiostudent.si/zalozba. V letu  2021  so pri   ZAR\u0160,   poleg   omenjenih
  kompilacij Klubskega maratona 21 in Senzorame Vol. 1 iz\u0161la  \u0161e  plo\u0161\u010de
  izvajalcev Psihedelavci, Ujme, M.U.G. Trio, Lovekovski in serija zvo\u010dnih ekspetimentov
  Poetrix.  Vseh  94 izdaj zalo\u017ebe pa je na voljo tudi na http://zars.bandcamp.com/.\\n\\nV
  letu 2021 je R\u0160 nadaljeval z delovanjem na podro\u010dju kulturne produkcije,
  pri \u010demer izpostavljamo Platformo za intermedijsko produkcijo RADAR, v sklopu
  katere poteka intenzivna izmenjava radio art programov mednarodne mre\u017ee radijskih
  postaj Radia Network. Ta deluje tudi kot predstavitveni in promocijski portal za
  intermedijsko umetnosti v Sloveniji, in sicer tako za lastno produkcijo R\u0160
  kot za produkcijo drugih organizacij - www.radiostudent.si/radar. Pod njegovim okriljem
  poteka tudi festival intermedijski umetnosti RADART - v letu 2021 je v sklopu  10.
  obletnice  potekal  med  9.,10, in 11.6. 2021 kot  \\\"RADAR #12: RADIO KRI\u010cA\u010c\\\"
  in so potekali na prostem na trgu AKC Metelkova, zaklju\u010dni dogodek pa se je
  odvil v prostorih Cirkulacije 2. Obletnica platforme se je odvila v sklopu Re\u0160olucije
  - potestni\u0161ke procesije Radia \u0160tudent.\\n\\nDejavnost crowdfundinga v
  letu 2021\\n\\nZavod R\u0160 je v letu 2021 mo\u010dno okrepil tudi dejavnosti za
  podporo svojemu delovanju in razvoju ter z akcijami pridobivanja donacij predvsem
  v obdobju prvega trimese\u010dja ter najbolj intenzivno v maju in juniju 2021 (torej
  ob krizah upada financiranja s strani \u0160OU in MK) zbral skupaj 64.900 EUR neposredne
  donacijske podpore ve\u010dinoma od fizi\u010dnih oseb in v manj\u0161i meri tudi
  podjetij (14.000 EUR). Ve\u010dji del donacijskih sredstev je bil pridobljen preko
  platforme \u0160iriR\u0160, manj\u0161i preko mednarodne platforme Benevity, zaradi
  statusa nevladne organizacije v javnem interesu smo lahko uvedli tudi novo opcijo
  SMS donacij, s katerimi smo zbrali skoraj petino vseh donacij  oziroma 13.500 EUR.\\n\\nVelik
  poskok smo dosegli tudi pri donacijah iz dohodnine dav\u010dnih zavezancev, ki v
  2021 zna\u0161ajo 30.200 EUR in so postale pomemben del trajnej\u0161e donacijske
  podpore, glede na leto prej pa predstavljajo ve\u010d kot podvojitev tako \u0161tevila
  donatorjev (iz 410 na 1.026) kot tudi podvojitev samih donacij iz dohodnine v vrednosti,
  saj smo v letu 2020 prejeli iz tega vira 7.300 EUR.  V letu 2021 smo tako v skupnem
  se\u0161tevku donacij fizi\u010dnih oseb, podjetij in donacij iz dohodnine zbrali
  kar 95.000 EUR.\\n\\nDonacije podjetij in znanih posameznikov iz obletni\u010dnega
  2019, ko je R\u0160 praznoval 50-obletnico delovanja, so tokrat mo\u010dneje nadome\u0161\u010dale
  donacije rednih poslu\u0161alcev in podpornikov, ki so se mno\u017ei\u010dno odzvali
  v znak podpore \u017ee ob januarski krizi s \u0160OU, ob majski odtegnitvi sredstev
  medijskega razpisa MK pa so pokazali neizmerno podporo ne le v finan\u010dnem, ampak
  tudi moralnem smislu. Pa niso bili edini. Ob gro\u017enji prekinitve financiranja
  in privatizaciji Radia \u0160tudent s strani \u0160OU je peticijo za ohranitev R\u0160
  podpisalo ve\u010d kot 1.500 oseb in ve\u010d kot 500 institucij, pismo podpore
  je na lastno pobudo poslalo skoraj 100 akademskih, znanstveno-raziskovalnih, civilnodru\u017ebenih
  organizacij, sindikatov ter vse relevantne evropske organizacije (Evropska zveza
  novinarjev, Evropski svet, Community Media Forum Europe) in nekateri evropski poslanci.\\n\\nKriza
  z ustanoviteljem je med drugim botrovala tudi temu, da se je \\\"dvignila zavest
  \u0161tudentske javnosti, ki se je za\u010dela organizirati v obliki \u0161tevilnih
  iniciativ, ki skupaj tvorijo aktualno \u0161tudentsko gibanje\\\", kot so zapisali
  v Dru\u0161tvu novinarjev Slovenije ob podelitvi nagrade \u010cuvaj 2021 Univerzitetni
  redakciji R\u0160 za pokrivanje zapletov z \u0160OU. Dogajanje je pritegnilo veliko
  pozornosti strokovne, \u0161tudentske in \u0161ir\u0161e javnosti, kar se je najbolj
  plasti\u010dno zrcalilo v gledanosti prora\u010dunske seje \u0161tudentskega zbora
  \u0160OU v marcu 2021, ki je pred ekrane za 5 neprekinjenih ur posedla kar 5.000
  gledalcev. Vsa ta pozornost in medijsko pokrivanje finan\u010dne krize R\u0160 tudi
  v drugih medijih je nedvomno med klju\u010dnimi dejavniki, ki so omogo\u010dili
  nadvse uspe\u0161no zbiranje donacijske podpore in krpanje finan\u010dnih lukenj.\\n\\nPorast
  zbranih donacij je torej v prvi vrsti odraz na krizne razmere, ki so R\u0160 v letu
  2021 pahnile pred najve\u010dji pre\u017eivetveni izziv doslej. V drugi vrsti so
  pa izbolj\u0161ave spletnega vmesnika platforme \u0160iriR\u0160, vzpostavitev trajnika,
  poenostavljeno oddajanje donacij, vizualna izpostavitev donacijske platforme na
  vidnej\u0161em mestu na spletni strani R\u0160 ter u\u010dinkovita komunikacija
  potrebe po donacijski podpori preko kanalov R\u0160, z mo\u010dnim poudarkom na
  dru\u017eabnih omre\u017ejih, nedvomno olaj\u0161ali proces zbiranja donacijskih
  sredstev.\\n\\nDejavnost marketinga ter prodaje storitev in blaga v letu 2021\\n\\nPomembna
  dejavnost Radia  \u0160tudent tako v finan\u010dnem kot tudi izobra\u017eevalnem
  smislu je marketing. Marketin\u0161ka dejavnost zajema produkcijo radijskih oglasov
  za lastne potrebe in zunanje naro\u010dnike, sinhronizacijo risanih filmov, produkcijo
  zvo\u010dnih knjig, sinhronizacije video vsebin, produkcijo avdio vodi\u010dev,
  produkcijo podcastov, tr\u017eenje radijskega programa, tr\u017eenje spletne strani
  Radia \u0160tudent, ogla\u0161evanje programa in znamke Radia \u0160tudent, prodajo
  oznam\u010denega prodajnega blaga, celostno ogla\u0161evanje lastnih ve\u010djih
  projektov ter od leta 2020 tudi storitve profesionalne video produkcije v izvedbi
  video sekcije Radia \u0160tudent.\\n\\nPridobitni prihodki iz naslova prodaje storitev
  marketinga in druge prodaje in obra\u010duna storitev so zna\u0161ali 146.098 EUR,
  kar je 72,7% ve\u010d kot leta 2020 (84.610 EUR). K ob\u010dutnemu izbolj\u0161anju
  marketin\u0161kih rezultatov glede na prej\u0161nje leto \u2013 kljub temu, da so
  posledice epidemi\u010dnih razmer bile ob\u010dutne tudi v letu 2021 in se bodo
  nedvomno kazale tudi v prihodnje \u2013 je pripomogla vrsta faktorjev. Mednje lahko
  po eni strani pri\u0161tevamo \u0161e uspe\u0161nej\u0161e delovanje profesionalne
  video produkcije in razvoj novih storitev avdio produkcije, po drugi strani pa precej
  pove\u010dano odzivnost podjetij, kar zadeva sponzoriranje radijskih projektov (koncertna
  turneja Klubski maraton, festival Tresk) ali sponzoriranje rednega programa radia.
  Slednje lahko nedvomno pojmujemo kot odziv na krizno situacijo, ki je Radio \u0160tudent
  v letu 2021 doletela tako z vidika zagotavljanja osnovnih sredstev s strani ustanovitelja
  kot tudi z vidika odtegnitve sredstev medijskega razpisa Ministrstva za kulturo
  RS, kar pomeni, da so tovrstni uspehi na podro\u010dju sponzorske podpore v letu
  2022 v dolo\u010deni meri neponovljivi.\\n\\nPridobitni prihodki iz naslova zunanjih
  storitev video produkcijske ekipe so se s 17.119 EUR v letu 2020 povzpeli na 26.243
  EUR v letu 2021. Kot posledica kvalitetno opravljenih storitev v prej\u0161njem
  letu smo namre\u010d v letu 2021 uspeli \u0161e raz\u0161iriti glas o kakovosti
  na\u0161e video slu\u017ebe in pridobiti nove naro\u010dnike, med katerimi \u0161e
  vedno prevladujejo kulturne in nevladne organizacije, a so med njimi tudi znanstveni
  in\u0161tituti in posamezne agencije. Poleg najpogostej\u0161e storitve, t.j. videoprenosov
  dogodkov in asistence ob hibridnih postavitvah, smo \u017ee v za\u010detku leta
  zasnovali in realizirali tudi prvi kreativni video projekt \u2013 kraj\u0161o serijo
  promocijskih videov za kampanjo Dru\u0161tva Focus.\\n\\nPrav tako smo dosegli preboj
  na \u017ee omenjenem podro\u010dju sponzorstev, ob \u010demer velja ponovno poudariti
  pove\u010dano odzivnost podjetij kot posledico solidarnosti ob umanjkanju osnovnih
  sredstev za delovanje radia ter zavrnitvi na razpisu za programske vsebine medijev
  Ministrstva za kulturo. Skupni znesek sponzorske podpore (primarno za radijske projekte,
  kot sta Klubski maraton in festival Tresk, sekundarno pa tudi za redni radijski
  program in delovanje radijske spletne strani) zna\u0161a 19.350 EUR; kljub \u017eelji
  in ambicijam, da bi se tovrstnemu znesku iz naslova sponzorstev pribli\u017eali
  tudi v prihodnjem letu, pa je realno pri\u010dakovati, da bo pripravljenost potencialnih
  sponzorjev na podporo delovanja in projektov radia v letu 2022 nekoliko manj\u0161a.\\n\\nRazmere
  za tr\u017eenje etrske promocije Radia \u0160tudent so bile v letu 2021 nekoliko
  bolj\u0161e kot v letu 2020, saj so tudi kulturne institucije in manj\u0161i gostinski
  obrati, ki so tradicionalno predstavljali najve\u010dji dele\u017e naro\u010dnikov
  v tem segmentu storitev, do\u017eiveli delno izbolj\u0161anje pogojev za opravljanje
  svojih kulturnih oziroma gostinskih dejavnosti. Kljub temu je bila realnost epidemije
  ter z njo povezanih ukrepov in omejitev tudi v preteklem letu \u0161e vedno prisotna,
  zato bi te\u017eko govorili, da so se prilo\u017enosti za tr\u017eenje etrske promocije
  vrnile v okvire iz let pred prihodom koronavirusa. Raven studijske avdio produkcije
  za zunanje naro\u010dnike medtem ostaja razmeroma stabilna oziroma se nekoliko pove\u010duje,
  delno tudi na ra\u010dun povpra\u0161evanja po novih produkcijskih storitvah, denimo
  po produkciji podcastov, zvo\u010dnih knjig, avdiovodi\u010dev ali produkcije za
  interaktivne spletne platforme. Iz naslova etra in pripadajo\u010de produkcije smo
  v letu 2021 dosegli okoli 49.000 EUR prihodkov, iz naslova zunanje produkcije (ki
  ni bila izvedena za namen radijskega etriranja) pa okoli 23.500 EUR.\\n\\nSpletna
  trgovina, ki smo jo lansirali v letu 2020, je do\u017eivela prodajni vrh \u017ee
  v za\u010detnih mesecih leta, nato pa se je raven prodaje nekoliko spustila. Kljub
  temu smo v letu 2021 preko trgovine ustvarili prihodek v vi\u0161ini 5.766 EUR,
  ki predstavlja 7,7% skok prihodkov v okviru dejavnosti prodaje blaga v primerjavi
  z letom 2020. To je bilo mo\u017eno predvsem zaradi raz\u0161iritve asortimana prodajnih
  artiklov iz CD in LP plo\u0161\u010d na oznam\u010deno prodajno blago (merchandise),
  kot so majice, nogavice, \u0161alice, torbe in za\u0161\u010ditne maske.\\n\\nNa
  kon\u010dno bilanco marketinga Radia \u0160tudent, ki je bila v 2021 odli\u010dna,
  je nenazadnje vplivalo precej\u0161nje zmanj\u0161anje marketin\u0161kega kolektiva;
  \u0161tevilo delavcev v marketin\u0161ki pisarni je po prekinitvi sodelovanja z
  vodjo marketinga, odhodu glavne asistentke marketinga ter odhodu sodelavke za digitalni
  marketing ostajalo nizko vse do oktobra 2021, ko se je znova vzpostavila celovita
  marketin\u0161ka ekipa. Zaradi zmanj\u0161anega kolektiva so bili do oktobra 2021
  tako tudi stro\u0161ki vodenja marketin\u0161ke pisarne v primerjavi s predhodnimi
  leti razmeroma nizki. Tako kot v epidemiji z vidika prodaje storitev in kadrovske
  strukture marketinga izjemno kriti\u010dnem letu 2020 velja tudi za 2021 izpostaviti
  pomemben prispevek k razvoju marketin\u0161kih dejavnosti in prodaje storitev s
  strani direktorice Ane Kandare, ki je ob razglasitvi epidemije in uvedbi var\u010devalnih
  ukrepov novembra 2020 za\u010dasno prevzela funkcijo vodje marketinga, aprila 2021
  je vodenje prevzel \u017diga Rus.\\n\\nOb\u010dutno pove\u010danje prilivov iz raznolike
  marketin\u0161ke dejavnosti je bilo v letu 2021 \u0161e toliko bolj pomembno zaradi
  padajo\u010de podpore ustanovitelja in izpada sofinanciranja medijskih vsebin s
  strani Ministrstva za kulturo, saj brez teh sredstev ne bi mogli zagotoviti ustreznega
  pokrivanja stro\u0161kov in uspe\u0161nega \u010drpanja javnih sredstev iz \u0161tevilnih
  lokalnih, nacionalnih in evropskih razpisov.\\n\\nV letu 2021 je R\u0160 prvi\u010d
  v zgodovini za\u0161\u010ditil besedno in znakovno blagovno znamko \\\"Radio \u0160tudent\\\"
  pri uradu za intelektualno lastnino.\\n\\nDejavnost fundraisinga v letu 2021\\n\\nZelo
  pomembna dejavnost Radia \u0160tudent, ponovno z izredno visokimi pridobljenimi
  viri v letu 2021, je dejavnost fundraisinga in vodenja projektov, ki preko prijavljanja
  produkcije (medijske, izobra\u017eevalne, kulturno-glasbene, zagovorni\u0161ke in
  specifi\u010dne produkcije za dru\u017ebenoranljive skupine) na ustrezne razpise
  skrbi tako za sofinanciranje obstoje\u010dih programskih vsebin kot tudi ustvarjanje
  novih. Zavod Radio \u0160tudent je v letu 2021 na podro\u010dju projektnega dela
  izvajal razli\u010dne lokalne, nacionalne in mednarodne projekte. S projekti nismo
  zagotavljali le potrebnih virov prihodkov, ob nizkem sofinanciranju rednega delovanja
  s strani \u0160OU v Ljubljani, ampak smo zagotavljali tudi ustrezen denarni tok
  za potrebe rednih pla\u010dil vseh stro\u0161kov R\u0160, pri \u010demer smo kar
  se da zgodaj oddajali projektne zahtevke, da smo ustrezno hitro po\u010drpali sredstva.
  Skupni prihodki projektne pisarne so zelo intenzivni \u017ee vse od leta 2017 dalje
  in sicer so po letih obdobja 2017-2021 zna\u0161ali:\\n\\n- 225.000 \u20ac - leta
  2017\\n- 273.000 \u20ac - leta 2018\\n- 312.000 \u20ac - leta 2019\\n- 297.000 \u20ac
  - leta 2020\\n- 272.000 \u20ac - leta 2021\\n\\nV letu 2021 pridobljeni in izvajani
  ve\u010dletni programi in projekti, vklju\u010dno s tistimi pridobljenimi v preteklih
  letih dela projektne pisarne, so popisani spodaj glede na obseg sredstev/prihodkov
  vezanih na leto 2021 oz. dalj\u0161e obdobje, \u010de gre za medletne projekte.
  Pri projektih, ki se odvijajo obdobno medletno, gre za medletne razmejitve, torej
  je le del skupnih prihodkov projekta vezan na 2021. V letu 2021 nas je prvi\u010d,
  odkar je mo\u017eno pridobiti podporo za produkcijo medijskih vsebin na Ministrstvu
  za kulturo, doletela nepri\u010dakovana in grozljiva situacija z vidika poslovanja
  v obliki popolne odtegnitve kakr\u0161nekoli podpore s strani ministrstva za produkcijo
  jedrnih medijskih vsebin radijskega programa R\u0160, sicer \u0161tudentskega programa
  posebnega nacionalnega pomena, kar je seveda mo\u010dno okrnilo vire pridobljene
  s strani Ministrstva za kulturo.\\n\\nVe\u010dji projekti \u2013 znesek sofinanciranja
  10.000 \u20ac in ve\u010d na letni ali medletni ravni:\\n\\n- MOL  \u2013  Oddelek
  za kulturo / Podporni programi v kulturi  \u2013  program 2020 - 2023 Gre za razli\u010dne
  sklope podpore delovanju spletne strani R\u0160, organizaciji kulturno-umetni\u0161kih
  ter intermedijskih dogodkov, podporni medijski produkciji na podro\u010dju kulture
  in organizaciji glasbenih dogodkov in festivalov. Skupna podpora MOL v letu 2021
  je zna\u0161ala 30.000 \u20ac, od tega 12.000 \u20ac za podporne programe v kulturi,
  15.000 \u20ac za glasbeno umetnost in 3.000 \u20ac za intermedijsko umetnost.\\n\\nS
  podporo MOL smo:\\n\\n- producirali in objavili na spletni strani ve\u010d kot 1491
  razli\u010dnih novinarskih prispevkov,\\n- producirali in objavili na spletni strani
  54 video prispevkov,\\n- organizirali 8 kulturno-umetni\u0161kih omizij,\\n- organizirali
  skupaj 89 \u017eivih koncertnih nastopov doma\u010dih in tujih glasbenih izvajalcev
  (koncertni cikli in festivali Afreparty, DJ Afterparty, Klubski maraton, Festival
  Tresk #12, Veliki koncert ob 52. rojstnem dnevu Radia \u0160tudent),\\n- organizirali
  fizi\u010dno in virtualno sejmi\u0161\u010de neodvisnih glasbenih zalo\u017eb, 4
  strokovne pogovore in 1 delavnico na temo osnove manipulacije zvoka in avdio produkcije
  v sklopu Festivala Tresk #12,\\n- v sklopu intermedijske produkcije RAD+ART organizirali
  dva sklopa dogodkov \u2013 prvi je potekal v sklopu 10. obletnice RADAR kot kombinacija  \u017eivih
  in radijskih nastopov (\\\"Radio Kri\u010da\u010d\\\"). Drugi dogodek z naslovom
  \\\"Banket\\\" pa je potekal v obliki  interdisciplinarne uprizoritve.\\n- DG Regio
  / Govori\u0161 kohezijsko \u2013 u\u010denje se nadaljuje - AVG 20 \u2013 JUL 21
  - Nadaljevanje projekta raziskovanja in promocije evropske kohezijske politike (EKP)
  na njenih ciljnih podro\u010djih, ki smo ga izvajali v sodelovanju s CNVOS. Skupno
  sofinanciranje za leto 2021 je zna\u0161alo 56.925,69 \u20ac.\\n\\nV sklopu projekta
  smo izvedli:\\n\\n- izvedli 10 raziskovalnih poti po Sloveniji in izdelali 10 kratkih
  video reporta\u017e za promocijo na dru\u017ebenih omre\u017ejih,\\n- izdelal ve\u010d
  kot 65 medijskih prispevkov o pomenu in vplivu EKP ,\\n- organizirali 13 javnih
  dogodkov z \u017eivim video prenosom z razli\u010dnimi dele\u017eniki na podro\u010dju
  EKP,\\n- organizirali 4 sete javnih pozivov za najbolj\u0161i \u0161tudentski esej
  na teme EKP,\\n- izdelali in promovirali spletno video igro na temo EKP,\\n- nudili
  celotno komunikacijsko in promocijsko podporo v sodelovanju s CNVOS.\\n- DG Regio
  / Ma Region  \u2013  Mon Europe (nadalje se bo uporabljalo funkcionalno ime projekta
  Europe in my backyard) \u2013 NOV 21 \u2013 OKT 22 \u2013 Pod krovnim vodstvom produkcijske
  in medijske hi\u0161e EMA RTV Sevilla smo v \u0161irokem evropske radijske partnerstvu
  prijavili projekt, v okviru katerega bomo skupaj raziskovali, poro\u010dali in promovirali
  cilje in vplive evropske kohezijske politike (EKP) na njenih ciljnih podro\u010djih.
  Oddaje bodo predvajane v nacionalnih jezikih partnerskih organizacij na ve\u010d
  kot 100 radijskih postajah mre\u017ee, projekt pa zajema tudi \u0161ir\u0161i spekter
  multi-medijske produkcije iz podro\u010dja kohezijske politike. Od skupnega  sofinanciranja  v  vi\u0161ini  37.509,92  \u20ac  smo  prejeli  40%  predfinanciranja  v  znesku
  15.003,97 \u20ac, od tega je bilo sofinanciranje za za\u010detne aktivnosti projekta,
  vklju\u010dno s partnerskim sestankom v Milanu v mesecu novembru, v skupnem znesku
  4.155,99  \u20ac, preostalo predfinanciranje v vi\u0161ini 10.847,98 \u20ac je za
  porabo v letu 2022.\\n\\nV sklopu projekta bomo pripravili:\\n\\n1. 20 radijskih
  oddaj o EKP in 20 intervjujev z relevantnimi dele\u017eniki pri dolo\u010deni temi,\\n2.
  5 videov o doma\u010dih projektih, ki so bili uspe\u0161no implementirani s kohezijskimi
  sredstvi,\\n3. webinar o aktualni in relevantni temi s podro\u010dja EKP z doma\u010dimi
  in tujimi strokovnjaki,\\n4. komunikacijske in promocijske aktivnosti v sodelovanju
  s celotnim partnerstvom.\\n- EACEA  \u2013  Creative Europe Programme  \u2013 Indie-RE:
  Independent Radio Exchange \u2013 NOV 19 \u2013 OKT 22 (potrjeno podalj\u0161anje
  za eno leto do OKT 22 za potrebe normalne izvedbe vseh mednarodnih izmenjav) \u2013
  Cilj projekta je produkcija, izmenjava in distribucija glasbenoinformativnih oddaj
  preko evropske radijske mre\u017ee, z namenom mednarodne promocije lokalne urbane
  in alternativne glasbe. Projekt vklju\u010duje tudi izmenjave glasbenih novinarjev
  ter gostovanja glasbenikov in strokovnjakov iz glasbene industrije iz partnerskih
  dr\u017eav na glasbenih festivalih. V projektu poleg koordinatorja Radia \u0160tudent
  sodelujejo \u0161e krovni partnerji Radio Campus France - mre\u017ea \u0161tudentskih
  radiev iz Francije, alternativni skupnostni Radio Corax iz Nem\u010dije, Radio Popolare
  di Milano iz Italije s svojo mre\u017eo radiev ter kot pridru\u017eena \u010dlana
  mre\u017ee \u0161e Radio Orange Dunaj in Radio Student Zagreb. Skupna vi\u0161ina
  sofinanciranja za del aktivnosti Radia \u0160tudent v celotnem obdobju projekta
  zna\u0161a 77.952,59 \u20ac, vi\u0161ina razmejenega sofinanciranja za leto 2021
  pa zna\u0161a 23.140 \u20ac. Od predfinanciranja 54.566,80 \u20ac prejetega v 2019
  je za sofinanciranje za kon\u010dno obdobje izvedbe preostalo \u0161e 4.142 \u20ac.\\n\\nV
  sklopu projekta bomo v celotnem trajanju projekta skupaj s partnerji:\\n\\n- producirali
  in predvajali po radijski mre\u017ei v 6 partnerskih dr\u017eavah skupaj 132 radijskih
  oddaj (izvedeno do konca 2021),\\n- organizirali 5 glasbenih festivalov s skupaj
  minimalno 15 gostujo\u010dimi tujimi glasbeniki (2 festivala Tresk in 6 gostovanj
  ter vsaj 15 doma\u010dih glasbenih nastopov v Sloveniji, ostali v partnerskih dr\u017eavah
  - festivala Tresk v 2020-2021, festivali v tujini v 2022),\\n- organizirali 18 mednarodnih
  rezidenc glasbenih novinarjev v partnerskih dr\u017eavah z reporta\u017eami, podcasti
  o lokalnih glasbenih scenah v tujini in drugimi skupnimi dejavnostmi novinarskih
  ekip.\\n- MK / Glasbene umetnosti - ve\u010dletni projekt 2018-2021 - Glasbeni svetilnik
  R\u0160 \u2013 zadnje leto obstoje\u010dega ve\u010dletnega sofinanciranja - Glasbeni
  svetilnik Radia \u0160tudent je ve\u010dletni javni kulturni projekt na podro\u010dju
  umetnosti, ki obsega organizacijo studijskega koncertnega cikla Afterparty, Klubskega
  maratona Radia \u0160tudent in enega Velikega koncertnega dogodka R\u0160 na leto.
  Vi\u0161ina sofinanciranja za leto 2021 zna\u0161a 17.666,42 \u20ac,\\n\\nV sklopu
  projekta smo v letu 2021 kljub epidemiji COVID-19 uspe\u0161no izvedli:\\n\\n- 41
  \u017eivih studijskih nastopov v sklopu cikla Afterparty in DJ afterparty,\\n- koncertno
  turnejo Klubskega maratona s skupaj 27 koncertnimi nastopi,\\n- splet koncertov
  v okviru 3 dogodkov v sklopu Velikega koncertnega dogodka R\u0160 z 26 koncertnimi
  nastopi.\\n\\n- MK / Glasbene umetnosti - ve\u010dletni projekt 2018-2021 \u2013
  Festival TRESK \u2013 zadnje leto obstoje\u010dega ve\u010dletnega sofinanciranja
  \u2013 gre za vsakoletni glasbeno-zalo\u017eni\u0161ki dogodek izveden \u017ee 12.
  leto zapored, ki obsega predstavitve doma\u010dih in tujih glasbenikov, neodvisnih
  zalo\u017eb, nate\u010daje za najbolj\u0161e oblikovanje in druge vizualne aspekte
  na podro\u010dju glasbenih umetnosti, DIY glasbene delavnice in povezovanje alternativne
  glasbene scene. Odobrena vi\u0161ina sofinanciranja za leto 2021 zna\u0161a 11.102,43
  \u20ac.\\n\\nV sklopu projekta, ki je potekal septembra 2021, smo organizirali in
  izvedli:\\n\\n- nagradni vizualni nate\u010daj v 5 kategorijah vezanih na glasbeno
  produkcijo (najbolj\u0161i videospot, koncertna fotografija, podoba albuma, plakat
  in promocija koncerta)\\n- razstavo nagrajencev vizualnega nate\u010daja v galeriji
  Dobra vaga\\n- virtualno in fizi\u010dno sejmi\u0161\u010de neodvisnih glasbenih
  zalo\u017enikov, na katerem se je predstavilo 22 zalo\u017eb\\n- ve\u010ddnevno
  glasbeno festivalsko dogajanje s skupaj 9 koncertnimi nastopi doma\u010dih glasbenikov\\n-
  6 diskurzivnih festivalskih enot (predavanja, delavnice, okrogle mize)\\n- MJU /
  Profesionalizacija delovanja NVO \u2013 projekt zaposlitev in organizacijskega razvoja
  \u00bbNa liniji - Mre\u017ea neodvisnih nepridobitnih medijev\u00ab \u2013 NOV 19
  \u2013 JAN 22 \u2013 projekt obsega oblikovanje mre\u017ee neodvisnih nepridobitnih
  medijev z namenom krepitve zagovorni\u0161tva in vplivanja na odlo\u010devalce na
  podro\u010dju 3. medijskega sektorja (3MS), medsebojnega opolnomo\u010denja \u010dlanov
  ter zagotavljanja dolgoro\u010dne kadrovske in finan\u010dne vzdr\u017enosti projektnih
  partnerjev. Pri projektu sodelujejo Radio \u0160tudent, Mariborski Radio \u0161tudent
  \u2013 MAR\u0160 ter Klub Inde \u2013 Drugje v okviru katerega deluje Neodvisni
  obalni radio \u2013 NOR.\\n\\nV sklopu projekta smo v letu 2021:\\n\\n- nadaljevali
  z razvojem delovanja projektne pisarne R\u0160 preko projektno zaposlenega Vodje
  projektne pisarne in razvijalca dejavnosti mre\u017ee, Bojana Stefanovi\u0107a,
  ki ga je avgusta 2021 zamenjala nova vodja projektne pisarne, Valentina Rajakovi\u0107\\n-
  omogo\u010dali profesionalno delovanje vseh IT dejavnosti, vklju\u010dno z vsemi
  ra\u010dunalni\u0161kimi, stre\u017eni\u0161kimi in spletnimi sistemi ter vzpostavitvijo
  storitev v oblaku, ki se bile \u0161e posebej pomembne v \u010dasu epidemije, preko
  projektno zaposlenega Vodje IT Radia \u0160tudent -  razvijalca in upravljalca spletnih
  in IT re\u0161itev za potrebe konzorcija in mre\u017ee, Jurija Podgor\u0161ka,\\n-
  urejevali in nadgrajevali spletno platformo neuvrsceni.org, namenjeno distribuciji
  strokovnih gradiv na temo 3MS in u\u010dnih ter informativnih prispevkov na podro\u010dju
  izobra\u017eevanja medijskih delavcev,\\n- ustanovili Dru\u0161tvo Neuvr\u0161\u010deni,
  ki  \u0161teje  \u017ee 8  \u010dlanov (razli\u010dne medijske organizacije in dru\u0161tva,
  ki delujejo kot neodvisni mediji na podro\u010dju 3MS)\\n- izvedli razli\u010dne
  promocijske in komunikacijske kampanje znotraj partnerstva, ki so promovoriale na\u0161e
  dejavnosti, krizne \u010dase in pozivale mlade nadobudne posameznike, naj se vklju\u010dijo
  v medijska usposabljanja na partnerskih radijih\\n- usposobili ve\u010d kot 100
  novih mladih novinarjev in radijskih producentov na vseh treh skupnostnih radijih\\n\\nZaposleni
  na projektu so razvijali nove projektne prijave, koordinirali izvedbo podro\u010dnih
  dejavnosti ter sodelovali pri razvoju programskih re\u0161itev za potrebe \u010dlanov
  konzorcija in mre\u017ee, v sodelovanju s krovnimi internimi sodelavci R\u0160 in
  projektno zaposlenimi pri drugih dveh partnerjih projekta. Skupno sofinanciranje
  stro\u0161kov pla\u010d za celotno obdobje projekta zna\u0161a za Zavod Radio \u0160tudent
  100.000,00 \u20ac, vi\u0161ina razmejenega sofinanciranja za leto 2021 zna\u0161a
  45.833,33 \u20ac, mesec januar 2021 smo krili iz drugih virov, kot enega od 3 mesecev
  projekta kritega iz drugih virov. Preostalo sofinanciranje iz projekta v vi\u0161ini
  4.166,67 \u20ac je namenjeno kritju pla\u010d zadnjega od 27 mesecev projekta, ki
  je januar 2022.\\n\\n- MJU / Poziv Ministrstva za javno upravo za sofinanciranje
  projektov podprtih s strani EU - v okviru poziva MJU za sofinanciranje lastnega
  finan\u010dnega dele\u017ea pri projektih, podprtih s strani EU, smo v letu 2020
  pridobili dodatno medletno sofinanciranje projekta \u00bbGovori\u0161 Kohezijsko
  - u\u010denje se nadaljuje\u00ab v skupni vrednosti 12.994,42 \u20ac, od \u010desar
  je glede na porabo 9.517,56 \u20ac razmejeno na 2021, ter projekta Indie-RE v skupni
  vrednosti 16.195,63 \u20ac, od \u010desar je glede na porabo 5.260,00 \u20ac razmejeno
  na 2021, preostala poraba iz tega vira v vi\u0161ini 8.783,85 \u20ac je namenjena
  sofinanciranju kon\u010dne izvedbe Indie-RE v letu 2022.\\n- ACF Slovenija / Opolnomo\u010denje
  ranjljivih skupin - projekt Migrant migrantu glas v partnerstvu s Slovensko filantropijo
  - NOV 20 - OKT 22, predvideno podalj\u0161anje do APR 23 - Cilj projekta je opolnomo\u010diti
  pripadnike ranljive dru\u017ebene skupine \u2013 migrante iz t.i. tretjih dr\u017eav,
  ki so v Sloveniji manj kot 10 let, za samostojno delovanje na podro\u010dju medijske
  produkcije,  zagovorni\u0161tva  in  uresni\u010devanja  \u010dlovekovih  pravic  ter
  izbolj\u0161anja  dru\u017ebenega, pravnega in ekonomskega polo\u017eaja njihove
  skupnosti v Sloveniji. Celoten dele\u017e sofinanciranja Radia \u0160tudent je 45.000,00\u20ac,
  pri \u010demer je sofinanciranje 100%, za leto 2021 je bilo pora\u010dunane porabe
  iz projektnih virov v vi\u0161ini 16.249,63 \u20ac. Iz \u017ee prejetih 70% vi\u0161ine
  predfinanciranja projekta, po prvem zahtevku za predpla\u010dilo in odobrene vmesnem
  poro\u010dilu, v znesku 31.500 \u20ac, nam preostane 15.250,37 \u20ac za sofinanciranje
  porabe v letu 2022.\\n\\nV sklopu projekta bomo v celotnem projektnem obdobju skupaj
  s partnerjem Slovenska filantropija:\\n\\n- izvedli preko 70 delavni\u0161kih sre\u010danj
  in preko 600 mentorskih ur usposabljanja na podro\u010djih medijske pismenosti in
  produkcije, organizacije javnh dogodkov, ustanovitve NVO in pridobivanja  sredstev,  zagovorni\u0161tva  ter  izvedbe  komunikacijskih  kampanj,\\n-
  opolnomo\u010dili 36 pripadnikov migrantske skupnosti za samostojno medijsko delovanje
  in zagovorni\u0161tvo,\\n- organizirali 8 javnih dogodkov in producirali 18 radijskih
  oddaj na temo problematike migrantske skupnosti.\\n- Open Society Foundation - APR
  21+ - preko evropske pisarne OSF smo prejeli krovno institucionalno podporo za potrebe
  izvajanja \u0161irokega spektra aktivnosti R\u0160, ki jih zagotavlja strokovna
  in raznovrstna kadrovska struktura R\u0160, podpora pa je poleg kritja stro\u0161kov
  krovnih kadrov in splo\u0161nih storitev namenjena tudi specifi\u010dnim razvojnim
  podro\u010djem, ki zajemajo slede\u010de aktivnosti in vrste stro\u0161kov: vklju\u010devanje
  mladih IT sodelavcev v razvoj programerskih re\u0161itev za produkcijo in vodenje,
  prenova spletne strani R\u0160, vklju\u010devanje zunanjih predavateljev v okviru
  avdicij za mlade in \u0161ir\u0161ega spektra usposabljanj R\u0160, zahtevnej\u0161a
  produkcija video vsebin specifi\u010dnih tematik razli\u010dnih uredni\u0161tev
  R\u0160, komunikacijske kampanje za  \u0161ir\u0161o promocijo R\u0160 in programov
  crowdfundinga ter storitve pravnega svetovanja in pomo\u010di na podro\u010djih
  krovnega poslovanja in institucionalnih vpra\u0161anj. Prejeli smo sofinanciranje
  v vi\u0161ini 100.000 $ oziroma potem 84.691,91 \u20ac. Glede na izjemne rezultate
  na podro\u010dju prodaje razli\u010dnih vrst storitev in pridobivanja donacijske
  podpore je bila poraba iz tega vira za leto 2021 v vi\u0161ini 4.691,91 \u20ac,
  preostalo sofinanciranje v vi\u0161ini 80.000 \u20ac je za porabo v obdobju od januarja
  2022 dalje.\\n\\nSrednje veliki projekti \u2013 znesek sofinanciranja od 5.000 \u20ac
  do 10.000 \u20ac na letni ali medletni ravni:\\n\\n- Center za kreativnost MAO \u2013
  Platforma centra za kreativnost \u2013 FEB-NOV 21 \u2013 projekt redne medijske
  informativne, strokovno-raziskovalne in prezentacijske podpore dejavnostim Centra
  za kreativnost MAO, delovanja drugih partnerjev mre\u017ee in \u0161ir\u0161ega
  spektra t.i. kulturno-kreativnega sektorja v Sloveniji v formatu novic, intervjujev
  z akterji in kompleksnih oddaj o specifi\u010dnih podro\u010djih KKS v izvedbi novinarjev
  Redakcije za kulturo in humanisti\u010dne vede. Sofinanciranje na letni ravni zna\u0161a
  10.655,74 \u20ac.\\n- Urad RS za mladino \u2013 Mladinski center Radio \u0160tudent
  \u2013 dvoletni program 2020-2021 \u2013 podpora izobra\u017eevalnim aktivnostim
