  Zunajbilan\u010dne obveznosti | 0 | 28.741 |\\n\\nPOJASNILA K RA\u010cUNOVODSKIM
  IZKAZOM\\n\\nPojasnila k izkazu poslovnega izida (Tabela 2)\\n\\nPRIHODKI\\n\\nV
  obdobju od 1. 1. do 31. 12. 2021 je Zavod Radio \u0160tudent (v nadaljevanju Zavod
  R\u0160) izkazal 636.222 EUR celotnih prihodkov, kar je za 15% ve\u010d kot v letu
  2020.\\n\\nDele\u017e prihodkov od nepridobitne dejavnosti v celotnih prihodkih
  v letu 2021 zna\u0161a 74,23 %, v letu 2020 je zna\u0161alo to razmerje 81,73%.\\n\\nPrihodki
  od nepridobitne dejavnosti predstavljajo prejeta sredstva s strani ustanovitelja,
  vsa pridobljena sredstva na projektih na lokalnem, nacionalnem in evropskem nivoju,
  ki so se porabila za stro\u0161ke leta 2021, prejete donacije s strani podpornikov
  Zavoda R\u0160, donacije iz dohodnine fizi\u010dnih oseb in subvencija za zaposlitev
  javnega delavca.\\n\\nV letu 2021 je Zavod R\u0160 prek programa javnih del prejel
  8.766 EUR sredstev za zaposlitev na eno delovno mesto (zaporedno dve osebi) v obdobju
  marec - december 2021.\\n\\nV Tabeli 2 so prihodki predstavljeni po posameznih virih
  financiranja.\\n\\nMed nepridobitnimi prihodki je poleg osnovne dotacije ustanovitelja
  \u0160OU v letu 2021 v znesku 92.400 EUR predstavljena tudi dotacija za nakup potrebne
  opreme za oddajanje programa, ki se dolgoro\u010dno razmejuje med prihodki do leta
  2024. Sredstva v vi\u0161ini 20.000 EUR je Zavod R\u0160 prejel leta 2018, od \u010desar
  je bilo takrat nabavljeno za 5.567 EUR opreme, v letu 2019 pa za preostalih 14.433
  EUR opreme, s \u010dimer so bila sredstva v celoti porabljena. V letu 2021 se poraba
  omenjene dotacije izkazuje na prihodkih v skupni vi\u0161ini 3.937 EUR kot zna\u0161a
  amortizacija v letu 2021 omenjene nabavljene opreme.\\n\\nTabela 4: Razmejitev dotacije
  \u0160OU iz leta 2018\\n\\n| \u0160OU dotacija za opremo/prostore v 2018 - am 2018
  | 794 |\\n|---|---|\\n| \u0160OU dotacija za opremo/prostore v 2018 - am 2019+potr.mat.
  | 3.694 |\\n| \u0160OU dotacija za opremo/prostore v 2018, 2019 - am 2020 | 4.383
  |\\n| \u0160OU dotacija za opremo/prostore v 2018, 2019 - am 2021 | 3.937 |\\n|
  \u0160OU dotacija za opremo/prostore v 2018, 2019 - am 2022 | 3.128 |\\n| \u0160OU
  dotacija za opremo/prostore v 2018, 2019 - am 2023 | 3.107 |\\n| \u0160OU dotacija
  za opremo/prostore v 2018, 2019 - am 2024 | 955 |\\n| SKUPAJ (prejeto v letu 2018)
  | 20 |\\n\\nVe\u010dinski del vseh pridobitnih prihodkov (163.940 EUR) predstavljajo
  storitve marketinga v vi\u0161ini 146.098 EUR. Med ostalimi pridobitnimi prihodki
  izkazujemo \u0161e kritje stro\u0161kov za DAB+ s strani ustanovitelja, prihodke
  iz prodaje blaga (Zalo\u017eba R\u0160, promo material), prihodki iz oddajanja prostora
  za anteno v najem in odpis  rezervacij za pla\u010dilo avtorskih pravic IPF (za
  leto 20216), ki so starej\u0161e od 5 let (glej str.25).\\n\\nZavod je tudi vletu
  2021 ves \u010das epidemije COVID-19 posloval, upo\u0161tevajo\u010d vse potrebne
  varnostne ukrepe. Na podlagi Zakona o dodatnih ukrepih za omilitev posledic COVID-19
  (ZDUOP) smo prejeli dr\u017eavno pomo\u010d za minimalno pla\u010do enega zaposlenega
  v znesku 300 EUR, poleg tega \u0161e bolni\u0161ko nadomestilo za karanteno. Omenjeni
  prihodki predstavljajo del pridobitne dejavnosti Zavoda R\u0160.\\n\\nFinan\u010dni
  in drugi prihodki predstavljajo druge izredne in finan\u010dne prihodke.\\n\\nODHODKI\\n\\nV
  obdobju od 1. 1. do 31. 12. 2021 je Zavod R\u0160 izkazal 633.813 EUR celotnih odhodkov
  kar je za 17% ve\u010d kot v letu 2020.\\n\\n,\\n\\nStro\u0161ki storitev predstavljajo
  69% vseh stro\u0161kov Zavoda R\u0160 v letu 2021, in sicer v vi\u0161ini 435.784
  EUR. V izkazu prihodkov in odhodkov (Tabela 2) so stro\u0161ki storitev razdeljeni
  po vrstah posameznih storitev in tudi primerjalno z letom 2020.\\n\\nV letu 2021
  se je povpre\u010dno \u0161tevilo zaposlenih na Zavodu R\u0160 povi\u0161alo iz
  5,6 v letu 2020 na 7,11 v letu 2021. Stro\u0161ki dela v letu 2021 so zato posledi\u010dno
  vi\u0161ji za 17 % v primerjavi s prej\u0161njim letom. Skupni stro\u0161ek dela
  vseh zaposlenih je v 2021 zna\u0161al 160.924 EUR od tega za specifi\u010dne zaposlitve:\\n\\nTabela
  5: Podatki o zaposlenih glede na stro\u0161kovno mesto/projekt v letu 2021\\n\\n|
  Stro\u0161kovno mesto (\u0161tevilo zaposlenih oseb na dan 31.12.21) | stro\u0161ki
  dela (EUR) | skupaj obra- \u010dunane ure |\\n|---|---|---|\\n| Javna dela (mar-dec
  21) \u2013 1 oseba | 14.697 | 1.632 |\\n| MJU-Na liniji (nov 19-jan 22) \u2013 2
  osebi | 51.197 | 4.176 |\\n| Ostali zaposleni - krovno \u2013 5 oseb | 95.03 | 9.043
  |\\n| Skupaj stro\u0161ki dela | 160.924 | 14.851 |\\n\\n\u0160e naprej bele\u017eimo
  trend pove\u010devanja \u0161tudentskega dela prek napotnic, v primerjavi z letom
  2020 kar za 44%, ki se vidi v Tabeli 6:\\n\\nTabela 6: Rast obsega \u0161tudentskega
  dela oz. sodelavcev preko \u0161tudentskih napotnic:\\n\\n|  | vrednost \u0161tudentskega
  dela |\\n|---|---|\\n| 2021 | 112.75 |\\n| 2020 | 78.035 |\\n| 2019 | 72.735 |\\n|
  2018 | 66.619 |\\n| 2017 | 58.997 |\\n| 2016 | 47.882 |\\n\\nV letu 2021 se je v
  primerjavi z letom 2020 zni\u017eal stro\u0161ek avtorskih honorarjev za 15% in
  zvi\u0161al stro\u0161ek izpla\u010dil drugim sodelavcem, ki izvajajo svojo dejavnost
  v obliki samostojne dejavnosti ali preko dru\u0161tev, zavodov in drugih organizacij
  (s.p., samozaposleni v kulturi ipd.).\\n\\nV letu 2021 bele\u017ei Zavod R\u0160
  povi\u0161anje stro\u0161ka amortizacije v primerjavi z letom 2020 za 49%, kar je
  posledica ve\u010djih investicij v osnovna sredstva v zadnjih nekaj letih. Med stro\u0161ki
  amortizacije bele\u017eimo tudi odpis drobnega inventarja, ki se odpisuje s 100%
  amortizacijsko stopnjo.\\n\\nV letu 2021 je Zavod R\u0160 prevrednotil svoje terjatve
  do kupcev in odpisal neizterljive terjatve v vi\u0161ini 2.292 EUR. Vzrok neizterljivosti
  je predvsem v prenehanju poslovanja in ve\u010dletni nelikvidnosti na\u0161ih kupcev.\\n\\nZa
  odpisane terjatve v vi\u0161ini 1.372 EUR smo zvi\u0161ali dav\u010dno osnovo v
  obra\u010dunu davka od dohodka pravnih oseb.\\n\\nPOSLOVNI REZULTAT\\n\\nV letu
  2021 je Zavod R\u0160 ustvaril pozitivno razliko med prihodki in odhodki oz. prese\u017eek
  prihodkov nad odhodki v vi\u0161ini 2.409 EUR, od tega je obveznosti davka od dohodka
  pravnih oseb za 185 eur.\\n\\nPojasnila k bilanci stanja (Tabela 3)\\n\\nSREDSTVA\\n\\nDolgoro\u010dna
  sredstva\\n\\nVrednost osnovnih  sredstev  smo  v  letu  2021  ohranili  na  obsegu  preteklega  leta
  (zmanj\u0161anje le za 0,6 %). Skupne nabave opreme so v letu 2021 zna\u0161ale
  15.833 EUR, od tega 966 EUR za fonoteko (21.543 EUR v 2020, od tega fonoteka 1.359
  EUR), predstavljajo pa predvsem prenovitev ra\u010dunalni\u0161kih sistemov, njihove
  nadgradnje in nakupe studijske opreme. Del navedenih nabav je financirala tudi Mestna
  ob\u010dina Ljubljana.\\n\\nMed dologoro\u010dnimi sredstvi bele\u017eimo tudi registracijo
  blagovne znamke in logotip Zavoda R\u0160, ki je zna\u0161ala 654 EUR in se bo amortizirala
  10 let.\\n\\nV letu 2021 je Zavod R\u0160 na podlagi vsakoletne inventure pregledal
  sklad osnovnih sredstev v kateri je bilo ugotovljeno nekaj pokvarjene in zastarele
  opreme, ki je bila zato na zadnji bilan\u010dni  dan  leta  2021  odpisana.  Odpisana  sredstva  niso  imela  nobene  knjigovodske
  vrednosti. Inventurni zapisnik je priloga Letnega poro\u010dila.\\n\\nKratkoro\u010dna
  sredstva\\n\\nZaloge trgovskega blaga predstavljajo zalogo neprodanih CD-jev, LP-jev,
  drugih zvo\u010dnih zapisov in promocijskega trgovskega blaga na dan 31.12.2021.\\n\\nKratkoro\u010dne  poslovne  terjatve  do
  kupcev smo na  dan  31.12.2021  preverili,  uskladili stanja  z na\u0161imi kupci,  manj\u0161i  del
  starej\u0161ih  spornih  terjatev, za  katere ni ve\u010d mo\u017enosti popla\u010dila
  pa smo odpisali.\\n\\nDruge kratkoro\u010dne poslovne terjatve v znesku 31.714 EUR
  v ve\u010dini predstavljajo na dan 31.12.2021 odprte terjatve do financerjev projektov,
  terjatev do \u0160OU iz naslova pora\u010duna iz koncesijske  dajatve  v  vi\u0161ini  8.400  eur  in  terjatve  do  Zavoda  RS  za  zaposlovanje  za
  subvencijo  decembrske  pla\u010de  izpla\u010dane  v  januarju  2022.  Med  drugimi  kratkoro\u010dnimi
  terjatvami vodimo tudi sredstva ra\u010duna PayPal, ki so na dan 31.12.2021 zna\u0161ala
  8.586 EUR.\\n\\nDenarna  sredstva v  vi\u0161ini 163.531 EUR predstavljajo  denarna  sredstva  na  poslovnih
  ra\u010dunih na dan 31.12.21 v znesku 63.531 EUR in stanje depozita pri poslovni
  banki v vi\u0161ini 100.000 EUR.\\n\\nOBVEZNOSTI DO SREDSTEV\\n\\nPrese\u017eek
  prihodkov oz. odhodkov je na dan 31. 12. 2021 \u0161e vedno negativen oz. na strani
  prese\u017eka  odhodkov  in  predstavlja  se\u0161tevek  vseh  preteklih  nerazporejenih  poslovnih
  rezultatov.\\n\\nDolgoro\u010dne rezervacije predstavljajo oblikovane rezervacije
  za stro\u0161ke avtorskih pravic IPF, ki smo jih v letu 2018 prvotno oblikovali
  za 5 let, za obdobje 2014-2018, saj nam  \u0161e ni uspelo dogovoriti dokon\u010dno
  ceno in vrednost popla\u010dila avtorskih pravic. Tudi letos smo odpravili oblikovane
  rezervacije leta 2016 zaradi zastaranja. Vrednost oblikovanih rezervacij, ki je
  bila dolo\u010dena na podlagi dosedanjih pogajanj z IPF, je najmanj\u0161a mo\u017ena
  vrednost stro\u0161kov, ki jih bo Zavod R\u0160 moral v prihodnje po zaklju\u010denih
  pogajanjih z IPF poravnati. Skupne dologoro\u010dne rezervacije na dan 31.12.2021
  zna\u0161ajo 14.637 EUR.\\n\\nTabela 7: Oblikovanje dolgoro\u010dnih rezervacij
  za IPF po letih (v EUR)\\n\\n|  | stro\u0161ek/mes | letni stro\u0161ek |\\n|---|---|---|\\n|
  2017 | 237 | 2.853 |\\n| 2018 | 237 | 2.853 |\\n| 2019 | 246 | 2.956 |\\n| 2020
  | 250 | 3.004 |\\n| 2021 | 248 | 2.971 |\\n|  |  | 14.637 |\\n\\nDolgoro\u010dne
  pasivne \u010dasovne razmejitve izkazujejo razmejeno donacijo Google JEF iz leta
  2020 (4.370 EUR) za nabavo osnovnih sredstev in razmejeno dotacijo \u0160OU v Ljubljani
  iz leta 2018, ki je zna\u0161ala 20.000 EUR. Razmejitve v vi\u0161ini 10.345 EUR
  predstavljajo bodo\u010do amortizacijo za obdobje 2022-2024 za nabavljeno opremo
  iz prejetih sredstev(glej Tabelo 4).\\n\\nKratkoro\u010dne  obveznosti  do  dobaviteljev
  v  znesku 37.340  EUR predstavljajo  odprte obveznosti, ki  zapadejo v pla\u010dilo
  v letu 2022.\\n\\nDruge kratkoro\u010dne poslovne obveznosti v vi\u0161ini 10.614
  EUR predstavljajo obveznosti do dr\u017eave (DDV in druge dajatve) ter obveznost
  za izpla\u010dilo avtorskih honorarjev za mesec december 2021.\\n\\nKratkoro\u010dne  pasivne
  \u010dasovne  razmejitve predstavljajo  kratkoro\u010dno  odlo\u017eene  prihodke
  razli\u010dnih projektov in neporabljenih donacij:\\n\\nZa poravnavo teh obveznosti
  imamo v ve\u010dji meri \u017ee denarna sredstva na poslovnem ra\u010dunu 31.12.2021,
  ki pa ne izhajajo iz prese\u017ekov preteklih let, ampak predstavljajo predpla\u010dila
  za sofinanciranje na\u0161ih stro\u0161kov poslovanja in projektov od 1.1.2022 dalje.\\n\\nRA
  \u010cUNOVODSKE USMERITVE\\n\\nPodlaga za sestavitev ra\u010dunovodskih izkazov\\n\\nVsi
  ra\u010dunovodski izkazi Zavoda R\u0160 so sestavljeni na osnovi Slovenskih ra\u010dunovodskih
  standardov (SRS 34 Ra\u010dunovodske re\u0161itve v nepridobitnih organizacijah
  \u2013 pravnih osebah zasebnega prava), Zakona o zavodih in Zakona o ra\u010dunovodstvu.\\n\\nLetno
  poro\u010dilo za leto 2021 za AJPES je priloga tem pojasnilom, ki so standardizirana
  oblika Letnega poro\u010dila. Zneski in imena postavk so v obeh prikazih (Tabeli
  2  in 3, Prilogi AJPES) identi\u010dni.\\n\\nPri nekaterih prikazanih zneskih v
  ra\u010dunovodskih izkazih smo dodatno obrazlo\u017eili njihovo vsebino, pri drugih
  pa tudi primerjalne informacije iz preteklega obdobja in jih vklju\u010dujemo tudi
  v besedne in opisne informacije.\\n\\nVsi zneski so v EUR.\\n\\nTe\u010daj in na\u010din
  prera\u010duna v doma\u010do valuto\\n\\nPostavke v ra\u010dunovodskih izkazih,
  ki so izkazane v tujih valutah, so v bilanci stanja in izkazu prihodkov in odhodkov
  prera\u010dunane v EUR po srednjem te\u010daju Banke Slovenije. Pozitivne ali negativne
  te\u010dajne razlike, ki so posledica teh dogodkov, se pripoznajo v izkazu prihodkov
  in odhodkov med finan\u010dnimi prihodki oziroma odhodki.\\n\\nRa\u010dunovodske
  usmeritve\\n\\nPri izkazovanju in vrednotenju postavk se neposredno uporabljajo
  dolo\u010dila Slovenskih ra\u010dunovodskih standardov, razen  pri  vrednotenju  postavk,  pri  katerih  standardi  dajejo  zavodu  mo\u017enost  izbire  med  razli\u010dnimi  na\u010dini
  vrednotenja. Zavod R\u0160 je uporabil usmeritve, ki so opisane v nadaljevanju.\\n\\nNeopredmetena
  sredstva\\n\\nNeopredmetena sredstva zajemajo nalo\u017ebe v pridobljene dolgoro\u010dne
  premo\u017eenjske pravice, npr. registracija blagovne znamke. Neopredmeteno sredstvo
  se ob za\u010detnem pripoznavanju ovrednoti po nabavni vrednosti (v nabavno vrednost
  se v\u0161tevajo tudi uvozne in nevra\u010dljive nakupne dajatve). Neopredmetena
  sredstva se zaradi okrepitve ne prevrednotujejo.\\n\\nOpredmetena osnovna sredstva\\n\\nOpredmetena
  osnovna sredstva se ob za\u010detnem pripoznavanju ovrednotijo po nabavni vrednosti
  (v nabavno vrednost se v\u0161tevajo tudi uvozne in nevra\u010dljive nakupne dajatve).
  Opredmetena osnovna sredstva so vrednotena po nabavnih vrednostih, zmanj\u0161anih
  za enakomerno \u010dasovno obra\u010dunano amortizacijo.\\n\\nV  nabavni  vrednosti  opredmetenega  osnovnega  sredstva  so  v\u0161teti  njegova  nakupna  cena  in  vsi  stro\u0161ki
  usposobitve sredstva za nameravano uporabo.\\n\\nOpredmetena osnovna sredstva niso
  ve\u010d predmet knjigovodskega evidentiranja, \u010de so odtujena ali izni\u010dena,
  ker od njih ni ve\u010d mogo\u010de pri\u010dakovati koristi. Izkupi\u010dek od
  prodaje opredmetenega osnovnega sredstva se evidentira med prevrednotovalne poslovne
  prihodke, neodpisana vrednost pa med prevrednotovalne poslovne odhodke.\\n\\n\u010ce
  pozneje nastali stro\u0161ki, ki so povezani z opredmetenim osnovnim sredstvom,
  pove\u010dujejo njegove bodo\u010de koristi v primerjavi s prej ocenjenimi, se pove\u010da
  njegova nabavna vrednost. \u010ce pa stro\u0161ki pove\u010dujejo dobo koristnosti
  tega sredstva, se najprej zmanj\u0161a do takrat obra\u010dunani popravek vrednosti
  sredstva.\\n\\nPopravila ali vzdr\u017eevanje opredmetenih osnovnih sredstev so
  namenjena obnavljanju ali ohranjanju prihodnjih gospodarskih koristi, ki se pri\u010dakujejo
  na podlagi prvotno ocenjene stopnje u\u010dinkovitosti sredstev. Pripoznajo se kot
  odhodki, kadar se pojavijo.\\n\\nAmortizacija\\n\\nNeodpisana  vrednost  opredmetenega  osnovnega  sredstva  in  neopredmetenega  sredstva  se  zmanj\u0161uje  z
  amortiziranjem. Opredmeteno osnovno sredstvo se za\u010dne amortizirati prvi dan
  naslednjega meseca po tem, ko je razpolo\u017eljivo za uporabo.\\n\\nNeopredmeteno
  sredstvo se za\u010dne amortizirati, ko je na razpolago za uporabo. Neopredmetena
  sredstva in opredmetena  osnovna  sredstva  podjetje  amortizira  posamezno  po  metodi  enakomernega  \u010dasovnega
  amortiziranja.\\n\\nAmortizacijske stopnje temeljijo na \u017eivljenjski dobi sredstev
  in zna\u0161ajo:\\n\\n| pohi\u0161tvo | 10 let |\\n|---|---|\\n| ra\u010dunalni\u0161ka
  oprema 1 | 3 leta |\\n| ra\u010dunalni\u0161ka oprema 2 | 2 leti |\\n| avdio / video
  oprema za studio 1 | 10 let |\\n| avdio / video oprema za studio | 9 let |\\n| avdio
  / video oprema za studio | 5 let |\\n| materialne pravice (blagovna znamka) | 10
  let |\\n| drobni inventar | 1 leto |\\n| fonoteka \u2013 se ne amortizira |  |\\n\\nFinan\u010dne
  nalo\u017ebe\\n\\nFinan\u010dne nalo\u017ebe vseh vrst se najprej izkazujejo po
  nabavni vrednosti. Lo\u010deno se izkazujejo dolgoro\u010dne in kratkoro\u010dne
  finan\u010dne nalo\u017ebe.\\n\\nTerjatve\\n\\nTerjatve vseh vrst se v za\u010detku
  izkazujejo z zneski, ki izhajajo iz ustreznih listin, ob predpostavki, da bodo popla\u010dane.
  Terjatve, nominirane v tuji valuti, se konec obdobja prera\u010dunajo po srednjem
  te\u010daju Banke Slovenije; razlika predstavlja finan\u010dne prihodke ali odhodke.\\n\\nPoznej\u0161a
  pove\u010danja ali zmanj\u0161anja terjatev pove\u010dujejo poslovne oziroma finan\u010dne
  prihodke oziroma odhodke. Vsa pove\u010danja oziroma zmanj\u0161anja pa morajo biti
  utemeljena z ustreznim dokumentom.\\n\\nPopravek vrednosti terjatev do kupcev doma
  in v tujini se oblikuje glede na starostno strukturo terjatev. Ko je odpis terjatve
  utemeljen z ustrezno listino, se pokrije v breme tako vzpostavljenega popravka vrednosti.\\n\\nDenarna
  sredstva\\n\\nDenarna sredstva sestavljajo gotovina, knji\u017eni denar in denar
  na poti. Gotovina je denar v blagajni, in sicer v obliki bankovcev, kovancev in
  prejetih \u010dekov. Knji\u017eni denar je denar na ra\u010dunih pri banki ali drugi
  finan\u010dni ustanovi, ki se lahko uporablja za pla\u010devanje. Denar na poti
  je denar, ki se prena\u0161a iz blagajne na ustrezni ra\u010dun pri banki ali drugi
  finan\u010dni ustanovi in se istega dne \u0161e ne vpi\u0161e kot dobroimetje pri
  njej.\\n\\nDenarna sredstva, izra\u017eena v doma\u010di valuti, se izkazujejo po
  nominalni vrednosti. Tuje valute se prera\u010dunajo v doma\u010do valuto po srednjem
  te\u010daju Banke Slovenije na dan prejema. Te\u010dajna razlika sestavlja finan\u010dne
  prihodke ali odhodke.\\n\\nDolgovi\\n\\nDolgovi so finan\u010dni in poslovni, kratkoro\u010dni
  in dolgoro\u010dni.\\n\\nKratkoro\u010dni in dolgoro\u010dni dolgovi vseh vrst se
  v za\u010detku izkazujejo z zneski, ki izhajajo iz ustreznih listin, ob predpostavki,
  da upniki zahtevajo njihovo popla\u010dilo.\\n\\nPozneje se pove\u010dujejo s pripisanimi
  donosi (obresti, druga nadomestila), za katere obstaja sporazum z upnikom. Obra\u010dunane
  obresti od dolgov so finan\u010dni odhodki. Dolgovi se zmanj\u0161ujejo za odpla\u010dane
  zneske in morebitne druga\u010dne poravnave v dogovoru z upnikom. Dolgoro\u010dni
  dolgovi se zmanj\u0161ujejo tudi za tisti del, ki bi moral biti popla\u010dan v
  manj kot letu dni, kar se izkazuje med kratkoro\u010dnimi dolgovi.\\n\\nDolgovi
  do pravnih ali fizi\u010dnih oseb v tujini se prera\u010dunajo v doma\u010do valuto
  na dan nastanka. Te\u010dajna razlika, ki se je pojavila do dneva poravnave tak\u0161nih
  obveznosti oziroma do dneva bilance stanja, sestavlja finan\u010dne odhodke ali
  prihodke.\\n\\nKratkoro\u010dne \u010dasovne razmejitve\\n\\nAktivne  kratkoro\u010dne  \u010dasovne  razmejitve  zajemajo  kratkoro\u010dno  odlo\u017eene  stro\u0161ke  (odhodke)  in  kratkoro\u010dno
  nezara\u010dunane prihodke. Kratkoro\u010dno odlo\u017eeni stro\u0161ki vsebujejo
  zneske, ki ob svojem nastanku \u0161e ne bremenijo dejavnosti, s katero se zavod
  ukvarja, in \u0161e ne vplivajo na poslovni izid. Kratkoro\u010dno nezara\u010dunani
  prihodki se pojavijo, \u010de se pri ugotavljanju poslovnega izida utemeljeno upo\u0161tevajo
  prihodki, Zavod R\u0160 pa zanje \u0161e ni dobil pla\u010dila in jih tudi ni zara\u010dunal.\\n\\nPasivne
  kratkoro\u010dne \u010dasovne razmejitve zajemajo vnaprej vra\u010dunane stro\u0161ke
  (odhodke) in kratkoro\u010dno odlo\u017eene prihodke. Vnaprej vra\u010dunane stro\u0161ke
  sestavljajo stro\u0161ki, ki so pri\u010dakovani, a se \u0161e niso pojavili in
  se nana\u0161ajo na obdobje, za katero se ugotavlja poslovni izid. Kratkoro\u010dno
  odlo\u017eeni prihodki nastajajo, \u010de so storitve Zavoda R\u0160 \u017ee zara\u010dunane
  ali je \u017ee sklenjena pogodba s financerjem, storitve pa se bodo opravile v prihodnjih
  poslovnih obdobjih. Prihodki se lahko kratkoro\u010dno odlo\u017eijo tudi, ko je
  upravi\u010denost do priznanja prihodkov v trenutku prodaje \u0161e dvomljiva.\\n\\nPripoznavanje
  prihodkov\\n\\nPrihodki se pripoznajo, \u010de je pove\u010danje gospodarskih koristi
  v obra\u010dunskem obdobju povezano s pove\u010danjem sredstva ali z zmanj\u0161anjem
  dolga in je pove\u010danje mogo\u010de zanesljivo izmeriti.\\n\\nPrihodki se pripoznajo,
  ko se upravi\u010deno pri\u010dakuje, da bodo vodili do prejemkov, \u010de ti niso
  uresni\u010deni \u017ee ob nastanku.\\n\\nPrihodke delimo na nepridobitne in pridobitne.
  Nepridobitni prihodki se pri izdelavi dav\u010dnega obra\u010duna za Davek od dohodka
  pravnih oseb izvzemajo od celotnih obdav\u010dljivih prihodkov.\\n\\nMed nepridobitne
  prihodke \u0161tejemo donacije pravnih in fizi\u010dnih oseb, prora\u010dunska sredstva,
  pridobljena na javnih razpisih, sredstva, pridobljena na razpisih v tujini, dotacije
  ustanovitelja in druge dotacije ter subvencije.\\n\\nPridobitni prihodki so prihodki,
  ki so pridobljeni na trgu s prodajo storitev in blaga, tudi pridobljena sredstva
  pomo\u010di dr\u017eave v \u010dasu epidemije COVID-19 ter odprava rezervacij  zaradi  njihovega  zastaranja
  (nad 5 let).\\n\\nPoslovni prihodki\\n\\nPrihodki od opravljenih storitev, razen
  od opravljenih storitev, ki vodijo do finan\u010dnih prihodkov, se merijo po prodajnih
  cenah dokon\u010danih storitev ali po prodajnih cenah nedokon\u010danih storitev
  glede na stopnjo njihove dokon\u010dnosti.\\n\\nFinan\u010dni prihodki\\n\\nFinan\u010dni
  prihodki so prihodki iz nalo\u017ebenja. Pojavljajo se v zvezi z dolgoro\u010dnimi
  in kratkoro\u010dnimi finan\u010dnimi nalo\u017ebami in tudi v zvezi s terjatvami.\\n\\nFinan\u010dni
  prihodki se pripoznajo ob obra\u010dunu ne glede na prejemke, \u010de ne obstaja
  utemeljen dvom glede njihove velikosti, zapadlosti v pla\u010dilo in popla\u010dljivosti.\\n\\nObresti
  se obra\u010dunavajo v sorazmerju s prete\u010denim obdobjem ter glede na neodpla\u010dni
  del glavnice in veljavno obrestno mero. Prevrednotovalni finan\u010dni prihodki
  se pojavijo ob odtujitvi dolgoro\u010dnih in kratkoro\u010dnih finan\u010dnih nalo\u017eb.\\n\\nDrugi
  prihodki\\n\\nDruge prihodke sestavljajo neobi\u010dajne postavke. Pojavljajo se
  v dejansko nastalih zneskih.\\n\\nPripoznavanje odhodkov\\n\\nOdhodki se pripoznajo,
  \u010de je zmanj\u0161anje gospodarskih koristi v obra\u010dunskem obdobju povezano
  z zmanj\u0161anjem sredstva ali s pove\u010danjem dolga in je to zmanj\u0161anje
  mogo\u010de zanesljivo izmeriti.\\n\\nPoslovni odhodki\\n\\nPoslovni  odhodki  se  pripoznajo,  ko
  je  porabljen  material oziroma  opravljene  storitve.  Poslovni  odhodki  se pripoznajo
  v obdobju, na katerega se nana\u0161ajo.\\n\\nPrevrednotovalni poslovni odhodki
  se pripoznavajo, ko je opravljeno ustrezno prevrednotenje, ne glede na njihov vpliv  na  poslovni
  izid. Prevrednotovalni  poslovni odhodki  se  pojavljajo  v zvezi z opredmetenimi  osnovnimi
  sredstvi, neopredmetenimi sredstvi in obratnimi sredstvi zaradi njihove oslabitve.\\n\\nFinan\u010dni
  odhodki\\n\\nFinan\u010dni odhodki so odhodki za financiranje in odhodki za nalo\u017ebenje.
  Finan\u010dni odhodki se pripoznajo po obra\u010dunu ne glede na pla\u010dila, ki
  so povezana z njimi. Prevrednotovalni finan\u010dni odhodki se pojavijo v zvezi
  z dolgoro\u010dnimi in kratkoro\u010dnimi finan\u010dnimi nalo\u017ebami zaradi
  njihove oslabitve.\\n\\nDrugi odhodki\\n\\nDruge odhodke sestavljajo neobi\u010dajne
  postavke, ki se izkazujejo v dejansko nastalih zneskih.\\n\\nIZJAVA POSLOVODSTVA  ZAVODA
  R\u0160\\n\\nPoslovodstvo potrjuje ra\u010dunovodske izkaze za leto 2021, kon\u010dane
  na dan 31. decembra\\n\\n2021, in uporabljene ra\u010dunovodske usmeritve ter pojasnila
  k ra\u010dunovodskim izkazom v tem letnem poro\u010dilu.\\n\\nPoslovodstvo je odgovorno
  za pripravo Letnega poro\u010dila tako, da ta predstavlja resni\u010dno in po\u0161teno
  sliko premo\u017eenjskega stanja Zavoda R\u0160 in izidov njegovega poslovanja za
  leto\\n\\n2021.\\n\\nPoslovodstvo potrjuje, da so bile dosledno uporabljene ustrezne
  ra\u010dunovodske usmeritve in da so bile ra\u010dunovodske ocene izdelane po na\u010delu
  previdnosti in dobrega gospodarjenja.\\n\\nPoslovodstvo  potrjuje,  da  so  ra\u010dunovodski  izkazi  skupaj  s  pojasnili  izdelani  na  osnovi
  predpostavke o nadaljnjem poslovanju Zavoda R\u0160 in v skladu z veljavno zakonodajo
  ter\\n\\nSlovenskimi ra\u010dunovodskimi standardi.\\n\\nPoslovodstvo  je  odgovorno  za  ustrezno  vodeno  ra\u010dunovodstvo,  za  sprejetje  ustreznih
  ukrepov  za  zavarovanje  premo\u017eenja,  za  prepre\u010devanje  in  odkrivanje  prevar  ter  drugih\\n\\nnepravilnosti
  oziroma nezakonitosti.\\n\\ndirektorica Zavoda Radia \u0160tudent\\n\\nAna Kandare\\n\\nV
  Ljubljani, 21.02.2022\\n\\n34\\n\\nIme poslovnega subjekta ZAVOD RADIO \u0160TUDENT\\n\\nMati\u010dna
