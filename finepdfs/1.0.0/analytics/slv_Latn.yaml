  if(abs((Vc2n-Vc2)/Vc2) .lt. 0.01) then write(6,500) X2 500     format(/,4x,''Stopnja
  presnove cevnega reaktorja Vc2 je '',\\n```\\n\\n```\\n&  ''X2 = '',f4.2,''.'',/)
  go to 5 endif go to (4,5), NF 4     call inti(X2,0.001,4) call int(Vc2n,dVc2ndX2)
  go to 6 C C   c)X3 - stopnja presnove tretjega mesalnega reaktorja v zaporedju,
  Vm C     -----------------------------------------------------------------5     do
  X3 = X2,0.85,0.001 CA0_rA3 = fun1(X3,10,pX,pCA0_rA) Vmn =v0*Ca0_rA3*(X3-X2) if(abs((Vmn-Vm)/Vm)
