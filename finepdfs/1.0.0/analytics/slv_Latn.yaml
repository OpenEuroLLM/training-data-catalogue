  za diesel | 20 | Podzemni horizontalni, dvojna stena, izdelan iz | Diesel |\\n\\nII.\\n\\nPreostalo
  besedilo izreka okoljevarstvenega dovoljenja \u0161t. 35407-94/2006-15 z dne 3.11.2009
  ostane nespremenjeno.\\n\\nIII.\\n\\nV tem postopku stro\u0161ki niso nastali.\\n\\nObrazlo\u017eitev\\n\\n1.
  Zahtevek za spremembo okoljevarstvenega dovoljenja\\n\\nAgencija Republike Slovenije
  za okolje (v nadaljevanju: naslovni organ), je dne 27.12.2011 s strani stranke TERMOELEKTRARNA
  TOPLARNA LJUBLJANA, d.o.o., Toplarni\u0161ka ulica 19, 1000 Ljubljana, ki jo zastopa
  direktor Samo Lozej (v nadaljevanju: upravljavec) prejela prijavo nameravane spremembe
  v obratovanju naprave, ki lahko povzro\u010da onesna\u017eevanje okolja ve\u010djega
  obsega in sicer za kuri\u0161no napravo z nazivno vhodno toplotno mo\u010djo ve\u010d
  kot 50 MW.\\n\\nZa navedeno napravo je naslovni organ izdal okoljevarstveno dovoljenje
  \u0161t. 35407-94/2006-15 z dne 3.11.2009 (v nadaljevanju: okoljevarstveno dovoljenje).\\n\\nZahtevek
  iz prijave za spremembo okoljevarstvenega dovoljenja se nana\u0161a na zamenjavo
  goriva v Vr\u0161ni kotlarni in sicer zamenjavo srednje te\u017ekega kuri\u0161nega
  olja z ekstra lahkim kuri\u0161nim oljem. Zamenjava goriva bo zahtevala tudi spremembe
  v skladi\u0161\u010denju in transportu goriva in sicer se bo v rezervoarjih z oznakama
  REZ3 in REZ4, kjer se trenutno skladi\u0161\u010di srednje te\u017eko kuri\u0161no
  olje in v rezervoarju z oznako REZ5, ki trenutno ni v uporabi, po izvedeni spremembi
  skladi\u0161\u010dilo ekstra lahko kuri\u0161no olje, ki se bo uporabljalo za obratovanje
  proizvodnih enot vr\u0161ne kotlarne (dveh vro\u010devodnih kotlov z oznakama N4,
  N5 in dveh parnih kotlov z oznakama N6, N7), ter za zagon parnih kotlov z oznakami
  N1, N2 in N3.\\n\\nNaslovni organ je na osnovi citirane prijave ugotovil, da ne
  gre za ve\u010djo spremembo v obratovanju naprave, ampak za spremembo pogojev in
  ukrepov iz okoljevarstvenega dovoljenja \u0161t. 35407-94/2006-15 z dne 3.11.2009,
  ter zato dne 21.3.2012 upravljavca pozval, da v roku 30 dni po prejemu poziva vlo\u017ei
  vlogo za spremembo okoljevarstvenega dovoljenja.\\n\\nNaslovni organ je dne 23.4.2012
  s strani upravljavca prejel Vlogo za spremembo okoljevarstvenega dovoljenja \u0161t.
  35407-94/2006-15 z dne 3.11.2009. Upravljavec je vlogo za spremembo okoljevarstvenega
  dovoljenja dopolnil dne 30.8.2012, 25.9.2012, 24.10.2012 in 28.1.2013.\\n\\n2. Pravna
  podlaga za spremembo okoljevarstvenega dovoljenja\\n\\n68. \u010dlen Zakona o varstvu
  okolja (Uradni list RS, \u0161t. 39/06-ZVO-1-UPB1, 49/06-ZMetD, 66/06-OdIUS in 33/07-ZPNa\u010drt,
  57/08-ZFO-1A, 70/08, 108/09, 48/12 in 57/12; v nadaljevanju: ZVO-1) dolo\u010da,
  da mora upravljavec za obratovanje naprave, v kateri se bo izvajala dejavnost, ki
  lahko povzro\u010di onesna\u017eevanje okolja ve\u010djega obsega, in za vsako ve\u010djo
  spremembo v obratovanju te naprave pridobiti okoljevarstveno dovoljenje. V skladu
  s to\u010dko 8.3 tretjega \u010dlena ZVO-1, je ve\u010dja sprememba v obratovanju
  naprave njena sprememba ali raz\u0161iritev, ki ima lahko pomembne \u0161kodljive
  vplive na ljudi ali okolje ali ki sama po sebi dosega prag, predpisan za uvrstitve
  naprave med tiste, ki lahko povzro\u010dajo onesna\u017eevanje ve\u010djega obsega.\\n\\nPrvi
  odstavek 77. \u010dlena ZVO-1 dolo\u010da, da mora upravljavec vsako spremembo,
  povezano z delovanjem ali raz\u0161iritvijo naprave, ki lahko vpliva na okolje,
  ali spremembo firme ali sede\u017ea, pisno prijaviti ministrstvu, pristojnemu za
  varstvo okolja, kar dokazuje s potrdilom o oddani po\u0161iljki. Skladno s petim
  odstavkom 77. \u010dlena ZVO-1 lahko ministrstvo spremeniti okoljevarstveno dovoljenje
  tudi, \u010de na podlagi prijave iz prvega odstavka 77. \u010dlena ugotovi, da ne
  gre za ve\u010djo spremembo v obratovanju naprave, ampak za spremembo pogojev in
  ukrepov iz okoljevarstvenega dovoljenja. V tem primeru ministrstvo v 30 dneh od
  prijave pisno pozove upravljavca naprave, da v dolo\u010denem roku vlo\u017ei vlogo
  za spremembo okoljevarstvenega dovoljenja, ki mora vsebovati sestavine iz 70. \u010dlena
  ZVO-1, razen elaborata o dolo\u010ditvi vplivnega obmo\u010dja naprave. \u010ce
  upravljavec naprave v dolo\u010denem roku vloge za spremembo okoljevarstvenega dovoljenja
  ne vlo\u017ei, se \u0161teje, da je od nameravane spremembe odstopil. Skladno s
  sednjim odstavkom 77. \u010dlena ministrstvo odlo\u010di o spremembi okoljevarstvenega
  dovoljenja v primeru iz petega odstavka 77. \u010dlena ZVO-1 v 30 dneh od prejema
  popolne vloge, pri \u010demer se ne uporabljajo dolo\u010dbe 71. \u010dlena ZVO-1
  in drugega do \u010detrtega odstavka 73. \u010dlena ZVO-1.\\n\\nMinistrstvo skladno
  s 4. to\u010dko prvega odstavka 78. \u010dlena ZVO-1 okoljevarstveno dovoljenje
  spremeniti po uradni dol\u017enosti, \u010de to zahtevajo spremembe predpisov na
  podro\u010dju varstva okolja, ki se nana\u0161ajo na obratovanje naprave. Skladno
  s prvim odstavkom 126. \u010dlena Zakona o splo\u0161nem upravnem postopku (Uradni
  list RS, \u0161t. 24/06-ZUP-UPB2, 105/06-ZUS-1, 126/07, 65/08 in 8/10; v nadaljevanju:
  ZUP) pristojni organ za\u010dne postopek po uradni dol\u017enosti, \u010de tako
  dolo\u010da zakon ali na zakonu temelji\u010d predpis in \u010de ugotovi ali zve,
  da je treba glede na obstoje\u010de dejansko stanje zaradi javne koristi za\u010deti
  upravni postopek.\\n\\nZaradi spremembe predpisov, kot je navedeno v nadaljevanju,
  je naslovni organ skladno s 4. to\u010dko prvega odstavka 78. \u010dlena ZVO-1 v
  povezavi s prvim odstavkom 126. \u010dlena ZUP za\u010del postopek spremembe okoljevarstvenega
  dovoljenja tudi po uradni dol\u017enosti.\\n\\nNaslovni organ je dne 23.4.2012 s
  strani upravljavca prejel Vlogo za spremembo okoljevarstvenega dovoljenja \u0161t.
  35407-94/2006-15 z dne 3. 11. 2009. Upravljavec je vlogo za spremembo okoljevarstvenega
  dovoljenja dopolnil dne 30. 8. 2012, 25. 9. 2012, 24. 10. 2012 in 28. 1. 2013.\\n\\n3.
  Ugotovljeno dejansko stanje in dokazi na katere je oprto\\n\\nNaslovni organ je
  v postopku izdaje odlo\u010dbe o spremembi okoljevarstvenega dovoljenja odlo\u010dal
  na podlagi:\\n\\n1. Vloge za spremembo okoljevarstvenega dovoljenja \u0161t. 35407-94/2006-15
  z dne 3. 11. 2009, prejete 23.4.2012 in njenih dopolnitev z dne 30. 8. 2012, 25.
  9. 2012, 24. 10. 2012 in 28. 1. 2013, s prilogami:\\n   - Poro\u010dilo o preverjanju
  ukrepov za rezervoarje zgrajene v delavnici, \u0161t. 20/11POP, (za REZ5), 23.8.2011,
  Petrol tehnologija d.o.o.\\n   - Poro\u010dilo o preverjanju ukrepov za prepre\u010devanje
  iztekanja nevarnih teko\u010din, \u0161t. 5/10, (za REZ4), 22.3.2010, Petrol tehnologija
  d.o.o.\\n   - Poro\u010dilo o preverjanju ukrepov za prepre\u010devanje iztekanja
  nevarnih teko\u010din, \u0161t. 6/10, (za REZ3), 22.3.2010, Petrol tehnologija d.o.o.\\n\\n2.
  Dokumentacije, ki jo je upravljavec predlo\u017eil v prijavi nameravane spremembe
  s prilogami:\\n   - Strokovna ocena vplivov na okolje zamenjave rabe srednje te\u017ekega
  kuri\u0161nega olja z ekstra lahkim kuri\u0161nim oljem v TERMOELEKTRARNI TOPLARNI
  LJUBLJANA, Referat \u0161t.: 2130, leto 2011, ELEKTROIN\u0160TITUT MILAN VIDMAR,
  Hajdrihova 2, Ljubljana in\\n   - Strokovna ocena vplivov na okolje zamenjave rabe
  srednje te\u017ekega kuri\u0161nega olja z ekstra lahkim kuri\u0161nim oljem v TERMOELEKTRARNI
  TOPLARNI LJUBLJANA (Dopolnitev), Referat \u0161t.: 2130/1, leto 2012, ELEKTROIN\u0160TITUT
  MILAN VIDMAR, Hajdrihova 2, Ljubljana (v nadaljevanju: strokovna ocena).\\n\\nV
  postopku je bilo na podlagi zgornj navedene dokumentacije upravne zadeve ugotovljeno,
  kot sledi v nadaljevanju.\\n\\nNameravana sprememba se nana\u0161a na zamenjavo
  goriva v Vr\u0161ni kotlarni oz. veliki kuri\u0161ni napravi VK \u2013 s kotli Vro\u010devodni
  kotel VKLM1 (N4), Vro\u010devodni kotel VKLM2 (N5), Parni kotel BKG1 (N6) in Parni
  kotel BKG2 (7) in sicer zamenjavo srednje te\u017ekega kuri\u0161nega olja z ekstra
  lahkim kuri\u0161nim oljem. Omenjena kuri\u0161na naprava ima skupno vhodno toplotno
  mo\u010d 164 MW in mora skladno s to\u010dko 2.1.15. izreka okoljevarstvenega dovoljenja
  in na osnovi 14. \u010dlena Uredbe o mejnih vrednostih emisij snovi v zrak iz velikih
  kuri\u0161nih naprav (Uradni list RS, \u0161t. 73/05, 92/07 in 68/12) prenehati
  obratovati s 1. januarjem 2016, med 1. januarjem 2008 in 31. decembrom 2015 pa skupno
  ne sme obratovati ve\u010d kot 20000 ur.\\n\\nNameravana sprememba se nana\u0161a
  tudi na zamenjavo srednje te\u017ekega kuri\u0161nega olja z ekstra lahkim kuri\u0161nim
  oljem za zagon velike kuri\u0161ne naprave GPO s tremi parnimi kotli z oznakami
  N1, N2 in N3, ki za gorivo uporabljajo premog.\\n\\nKot izhaja iz dokumentacije
  vloge za spremembo okoljevarstvenega dovoljenja bo zamenjava goriva vplivala na
  zmanj\u0161anje emisij snovi v zrak.\\n\\nNameravana sprememba oz. zamenjava goriva
  bo zahtevala spremembe v skladi\u0161\u010denju in transportu goriva in sicer se
  bo v rezervoarjih z oznakama REZ3 in REZ4, kjer se trenutno skladi\u0161\u010di
  srednje te\u017eko kuri\u0161no olje in v rezervoarju z oznako REZ5, ki trenutno
  ni v uporabi, po izvedeni spremembi skladi\u0161\u010dilo ekstra lahko kuri\u0161no
  olje. Naslovni organ je na osnovi dopolnitve vloge z dne 30.8.2012 in prilo\u017eenega
  Poro\u010dila o preverjanju ukrepov za rezervoarje zgrajene v delavnici, \u0161t.
  20/11POP, za REZ5, z dne 23.8.2011, ki ga je izdelal Petrol tehnologija d.o.o. ugotovil,
  da REZ5 nima opreme, ki prepre\u010duje njegovo polnitev nad nazivno prostornino
  nepremi\u010dnega rezervoarja, \u010deprav bi jo skladno z dolo\u010dili Uredbe
  o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) moral imeti. Upravljavec
  je v dopolnitvi vloge dne 28.1.2013 potrdil, da je prepolnitiveni ventil na REZ5
  \u017ee vgradil. V omenjeni dopolnitvi vloge je upravljavec tudi prikazal skladnost
  zadr\u017eevalnih sistemov z dolo\u010dili Uredbe o skladi\u0161\u010denju nevarnih
  teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t.
  104/09, 29/10 in 105/10) ter v prilo\u017eeni tabeli 1 navedel, da gre pri REZ3,
  REZ4 in REZ5 za rezervoarje v objektih in, da so omenjeni rezervoarji skladni z
  dolo\u010dili 7. \u010dlena Uredbe o skladi\u0161\u010denju nevarnih teko\u010din
  v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t.\\n\\n104/09,
  29/10 in 105/10), ki dolo\u010da zahteve za skladi\u0161\u010denje nevarnih teko\u010din
  v objektih.\\n\\nIz vloge je razvidno, da po izvedeni spremembi v napravi iz to\u010dke
  1 izreka okoljevarstvenega dovoljenja oz. rezervoarjih ne bo ve\u010d muljev iz
  dna rezervoarjev REZ4 in REZ5.\\n\\nZaradi predmetne spremembe se proizvodna zmogljivost
  naprave iz to\u010dke 1 izreka tega dovoljenja ne bo spremenila.\\n\\nZaradi predmetne
  spremembe se dopustne vrednosti emisije snovi v zrak naprave iz to\u010dke 1 izreka
  tega dovoljenja ne bodo spremenile.\\n\\nNaslovni organ je ugotovil, da so se spremenili
  tudi predpisi iz 17. \u010dlena ZVO-1, ki so veljali v \u010dasu izdaje okoljevarstvenega
  dovoljenja \u0161t. 35407-94/2009-15 z dne 3. 11. 2009, in sicer:\\n\\n- Uredba
  o uporabi ozonu \u0161kodljivih snovi in fluoriranih toplogrednih plinov (Uradni
  list RS, \u0161t. 41/10),\\n- Uredba o stanju povr\u0161inskih voda (Uradni list
  RS, \u0161t. 14/09 in 98/10)\\n- Uredba o skladi\u0161\u010denju nevarnih teko\u010din
  v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t. 104/09,
  29/10 in 105/10),\\n- Uredba o emisiji snovi v zrak iz malih in srednjih kurilnih
  naprav (Uradni list RS, \u0161t. 23/11)\\n- Pravilnik o prvih meritvah in obratovalnem
  monitoringu odpadnih vod ter o pogojih za njegovo izvajanje (Uradni list RS, \u0161t.
  54/11),\\n- Uredba o ravnjanju z embala\u017eo in odpadno embala\u017eo (Uradni
  list RS, \u0161t. 84/06, 106/06, 110/07 in 67/11),\\n- Uredba o odpadkih (Uradni
  list RS, \u0161t. 103/11),\\n- Uredba o emisiji snovi in toplote pri odvajanju odpadnih
  vod v vode in javno kanalizacijo (Uradni list RS, \u0161t. 64/12),\\n- Uredba o
  vrsti dejavnosti in naprav, ki lahko povzro\u010dajo onesna\u017eevanje okolja ve\u010djega
  obsega (Uradni list RS, \u0161t. 97/04, 71/07, 122/07 in 68/12).\\n\\nZaradi spremembe
  Uredbe o uporabi ozonu \u0161kodljivih snovi in fluoriranih toplogrednih plinov
  (Uradni list RS, \u0161t. 41/10), Uredbe o odpadkih (Uradni list RS, \u0161t. 103/11)
  in Uredbe o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) je bilo potrebno spremeniti
  tudi pogoje in zahteve v izreku okoljevarstvenega dovoljenja.\\n\\n4. Pravna podlaga
  za dolo\u010ditev zahtev in razlogi za odlo\u010ditev\\n\\nNa podlagi 9. \u010dlena
  Uredbe o vrsti dejavnosti in naprav, ki lahko povzro\u010dajo onesna\u017eevanje
  okolja ve\u010djega obsega (Uradni list RS, \u0161t. 97/04, 71/07, 122/07 in 68/12)
  se dopustne vrednosti emisij, tj. mejne vrednosti emisij v vode, zrak in/ali tla,
  porabe naravnih virov in/ali energije ali drug ustrezen parameter, naveden v okoljevarstvenem
  dovoljenju, ki med obratovanjem naprave ne sme biti prese\u017een, dolo\u010dijo
  za snovi iz priloge 2, ki je sestavni del te uredbe, razen v primeru, \u010de nastanek
  teh snovi pri delovanju naprave ni mogo\u010d. Ne glede na to, se v dovoljenju lahko
  dolo\u010dijo dopustne vrednosti emisij tudi za snovi, ki niso navedene v prilogi
  2, \u010de pomembno prispevajo k obremenjevanju okolja iz naprave glede na njegovo
  kakovost in predpisane standarde kakovosti okolja. Dopustne vrednosti emisij morajo
  biti stro\u017eje od vrednosti, dosegljivih z uporabo najbolj\u0161ih razpolo\u017eljivih
  tehnik ali predpisanih mejnih vrednosti, \u010de je to potrebno zaradi doseganja
  predpisanih standardov kakovosti okolja. Poleg dopustnih vrednosti emisije se v
  dovoljenju dolo\u010dijo tudi obratovalni pogoji, potrebni za zagotavljanje visoke
  stopnje varstva okolja kot celote, ki temelijo na uporabi najbolj\u0161ih razpolo\u017eljivih
  tehnik.\\n\\nSkladno z 11. \u010dlenom Uredbe o vrsti dejavnosti in naprav, ki lahko
  povzro\u010dajo onesna\u017eevanje okolja ve\u010djega obsega (Uradni list RS, \u0161t.
  97/04, 71/07, 122/07 in 68/12), se v postopku izdaje okoljevarstvenega dovoljenja
  glede vpra\u0161anj, ki niso urejena s to uredbo, smiselno uporabljajo dolo\u010dbe
  predpisov, ki urejajo obseg in vsebino vioge ter postopek za pridobitev in vsebino
  okoljevarstvenega dovoljenja za druge naprave.\\n\\nNaslovni organ je zaradi zamenjave
  goriva v veliki kurlini napravi z oznako TE-TOL E oz. VK in sicer te\u017ekega kurlinega
  olja z ekstra lahkim kurlinim oljem (ELKO) spremenil Preglednico 1 v to\u010dki
  1 izreka okoljevarstvenega dovoljenja, in sicer je v stolpcu \u00bbGorivo 1\u00ab
  za veliko kurlino napravo z oznako TE-TOL E namesto te\u017ekega kurlinega olja
  dolo\u010dil ekstra lahko kurlino olje (ELKO), kot izhaja iz to\u010dke I/1 izreka
  te odlo\u010dbe.\\n\\nNaslovni organ je zaradi zamenjave goriva v veliki kurlini
  napravi z oznako TE-TOL E oz. VK spremenil to\u010dko 2.1.10 izreka okoljevarstvenega
  dovoljenja, in sicer je gorivo te\u017eko kurlino olje nadomestil z ekstra lahkim
  kurlinim oljem (ELKO), kot izhaja iz to\u010dke I/2 izreka te odlo\u010dbe.\\n\\nNaslovni
  organ je zaradi zamenjave goriva v veliki kurlini napravi z oznako TE-TOL E oz.
  VK spremenil to\u010dko 2.2.2 in preglednico 5 izreka okoljevarstvenega dovoljenja,
  in sicer je besedilo \u00bbte\u017eko kurlino olje\u00ab nadomestil z besedilom
  \u00bbekstra lahko kurlino olje\u00ab, kot izhaja iz to\u010dke I/5 izreka te odlo\u010dbe.\\n\\nV
  \u010dasu izdaje te odlo\u010dbe velja Uredba o uporabi ozonu \u0161kodljivih snovi
  in fluoriranih toplogrednih plinov (Uradni list RS, \u0161t. 41/10). Zaradi navedenega
  je naslovni organ spremenil to\u010dke 2.1.19, 2.1.20 izreka okoljevarstvenega dovoljenja
  in dodal to\u010dke 2.3.26, 2.3.27 in 2.3.28, kot izhaja iz to\u010dk I/3, I/4 in
  I/6 izreka te odlo\u010dbe.\\n\\nZahteve v to\u010dki 2.1.19 izreka okoljevarstvenega
  dovoljenja je naslovni organ spremenil na podlagi 3. \u010dlena Uredbe o uporabi
  ozonu \u0161kodljivih snovi in fluoriranih toplogrednih plinov (Uradni list RS,
  \u0161t. 41/10) v povezavi s 3. \u010dlenom Uredbe (ES) \u0161t. 842/2006 o dolo\u010dilih
  fluoriranih toplogrednih plinov (OJ L 161, 2006) ter 23. \u010dlenom Uredbe (ES)
  \u0161t. 1005/2009 o snoveh, ki tanj\u0161ajo ozonski pla\u0161\u010d (OJ L 286,
  2009).\\n\\nUpravljavec v skladu z Uredbo (ES) \u0161t. 1005/2009 o snoveh, ki tanj\u0161ajo
  ozonski pla\u0161\u010d (OJ L 286, 2009) od 1.1.2015 dalje pri servisiranju in vzdr\u017eevanju
  ne sme uporabljati ve\u010d nobenih delno halogeniranih klorofluorooglikovodikov
  (R22) tudi recikliranih ne. Zato je naslovni organ spremenil to\u010dko 2.1.20 izreka
  okoljevarstvenega dovoljenja na podlagi 4. odstavka 11. \u010dlena te uredbe.\\n\\nNaslovni
  organ je zahteve v to\u010dkah 2.3.26, 2.3.27 in 2.3.28 izreka okoljevarstvenega
  dovoljenja dolo\u010dil na podlagi 5., 10., 11., 12. in 40. \u010dlena Uredbe o
  uporabi ozonu \u0161kodljivih snovi in fluoriranih toplogrednih plinov (Uradni list
  RS, \u0161t. 41/10).\\n\\nUpravljavec uporablja nepremi\u010dno opremo za hlajenje
  in klimatizacijo, ki vsebuje 3 kg ali ve\u010d ozonu \u0161kodljive snovi, navedeno
  v spodnji preglednici:\\n\\n| Oprema/sistem* (tip) | Vrsta hladiva |\\n|----------------------|---------------|\\n|                      |
  Ozonu \u0161kodljiva snov | Fluoriran toplogredni plin |\\n| Klima naprava Air Blue
  Italija, tip: EDA 140 | R22 (HCFC-22) |   |\\n| Klima naprava Menerga Nem\u010dija,
  tip: FRECOLAIR 141901 |   | R407c** |\\n| Klima naprava IMP Klimat Slovenija, tip:
  MK OD 05 V | R22 (HCFC-22) |   |\\n| Klima naprava Trane Francija, tip: CGWH 230
  |   | R407c** |\\n\\n* sistem ali aplikacija: oprema za hlajenje, klimatizacijo,
  vklju\u010dno s tokokrogi/razvodi hladiv\\n\\n** pripravek, zmes dveh ali ve\u010d
  plinov, vsaj eden od njih fluoriran toplogredni plin\\n\\nV \u010dasu izdaje te
  odlo\u010dbe velja Uredba o odpadkih (Uradni list RS, \u0161t. 103/11). Naslovni
  organ je zaradi nove Uredbe o odpadkih (Uradni list RS, \u0161t. 103/11) v to\u010dki
  l/7 izreka te odlo\u010dbe spremenil oz. nadomestil to\u010dko 6.1. okoljevarstvenega
  dovoljenja z novo to\u010dko 6.1. V okviru nove to\u010dke 6.1. so zahteve iz to\u010dke
  6.1.1. dolo\u010dene na podlagi prvega odstavka 9. \u010dlena, zahteve iz to\u010dke
  6.1.2. na podlagi prvega odstavka 10. \u010dlena, to\u010dka 6.1.3. na podlagi 18.
  \u010dlena, to\u010dka 6.1.4. na podlagi 21. \u010dlena, to\u010dka 6.1.5. na podlagi
  tretjega odstavka 22. \u010dlena, to\u010dka 6.1.6. na podlagi prvega odstavka 24.
  \u010dlena, to\u010dka 6.1.7. na podlagi prvega odstavka 22. \u010dlena in prvega
  odstavka 23. \u010dlena, to\u010dka 6.1.8. na podlagi drugega odstavka 24. \u010dlena,
  to\u010dka 6.1.9. na podlagi tretjega odstavka 24. \u010dlena, to\u010dka 6.1.10.
  na podlagi prvega odstavka 25. \u010dlena in drugega odstavka 26. \u010dlena, to\u010dka
  6.1.11. na podlagi petega odstavka 21. \u010dlena ter to\u010dka 6.1.12. na podlagi
  27. \u010dlena Uredbe o odpadkih (Uradni list RS, \u0161t. 103/11).\\n\\nV \u010dasu
  izdaje te odlo\u010dbe velja Uredba o skladi\u0161\u010denju nevarnih teko\u010din
  v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t. 104/09,
  29/10 in 105/10). Naslovni organ je zaradi spremembe v skladi\u0161\u010denju in
  transportu goriva ter zaradi spremembe Uredbe o skladi\u0161\u010denju nevarnih
  teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t.
  104/09, 29/10 in 105/10) v to\u010dki l/8 izreka te odlo\u010dbe spremenil oz. nadomestil
  to\u010dko 8.1 izreka okoljevarstvenega dovoljenja z novo to\u010dko 8.1, kot sledi.\\n\\nV
  okviru nove to\u010dke 8.1. okoljevarstvenega dovoljenja je to\u010dka 8.1.1. izreka
  okoljevarstvenega dovoljenja dolo\u010dena na podlagi vloge upravljavca in podatkov
  o rezervoarjih nevarnih teko\u010din. V to\u010dki 8.1.1. izreka okoljevarstvenega
  dovoljenja je naslovni organ dolo\u010dil v katerih rezervoarjih se lahko skladi\u0161\u010dijo
  nevarne teko\u010dine.\\n\\nNaslovni organ je za rezervoarje v to\u010dkah 8.1.2.,
  8.1.3. in 8.1.4. izreka okoljevarstvenega dovoljenja, na podlagi 5. \u010dlena Uredbe
  o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) dolo\u010dil zahteve
  za projektiranje, gradnjo, obratovanje in vzdr\u017eevanje rezervoarjev.\\n\\nNaslovni
  organ je v to\u010dkah 8.1.5. in 8.1.6. izreka okoljevarstvenega dovoljenja, na
  podlagi 8. \u010dlena Uredbe o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih
  skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10)
  dolo\u010dil zahteve za cevovode in drugo opremo skladi\u0161\u010da ter zahteve
  pri pretakanju nevarnih teko\u010din, namenjenem prazenjenju in polnjenju nepremi\u010dnih
  rezervoarjev.\\n\\nNaslovni organ je v to\u010dkah 8.1.7. in 8.1.8. izreka okoljevarstvenega
  dovoljenja, na podlagi prvega odstavka 6. \u010dlena Uredbe o skladi\u0161\u010denju
  nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list
  RS, \u0161t. 104/09, 29/10 in 105/10) dolo\u010dil zahteve za zunanje - podzemne
  skladi\u0161\u010denje nevarnih teko\u010din.\\n\\nNaslovni organ je v to\u010dkah
  8.1.9., 8.1.10., 8.1.11. in 8.1.12. izreka okoljevarstvenega dovoljenja, na podlagi
  drugega, tretjega, \u010detrtega in petega odstavka 6. \u010dlena Uredbe o skladi\u0161\u010denju
  nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list
  RS, \u0161t. 104/09, 29/10 in 105/10) dolo\u010dil zahteve za zunanje - nadzemne
  skladi\u0161\u010denje nevarnih teko\u010din. Naslovni organ v zvezi z zadr\u017eevalnimi
  sistemi pri nadzemnem skladi\u0161\u010denju ni posebej dolo\u010dil zahtev v zvezi
  z odvajanjem padavinske odpadne vode, ki je dolo\u010dena v sedmem odstavku 6. \u010dlena
  Uredbe o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10), ker je ta zahteva dolo\u010dena
  \u017ee v to\u010dki 3.1 izreka okoljevarstvenega dovoljenja.\\n\\nNaslovni organ
  je v to\u010dkah 8.1.13. in 8.1.14. izreka okoljevarstvenega dovoljenja, na podlagi
  prvega in \u010detrtega odstavka 7. \u010dlena Uredbe o skladi\u0161\u010denju nevarnih
  teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t.
  104/09, 29/10 in 105/10) dolo\u010dil zahteve za skladi\u0161\u010denje nevarnih
  teko\u010din v objektih.\\n\\nNaslovni organ je v to\u010dki 8.1.15. izreka okoljevarstvenega
  dovoljenja, na podlagi sedmega odstavka 6. \u010dlena in petega odstavka 7. \u010dlena
  Uredbe o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) dolo\u010dil zahteve
  za zadr\u017eevalne sisteme.\\n\\nNaslovni organ je v to\u010dki 8.1.16. izreka
  okoljevarstvenega dovoljenja, na podlagi osmega odstavka 6. \u010dlena Uredbe o
  skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) dolo\u010dil prepoved
  zunanjega skladi\u0161\u010denja nevarnih teko\u010din v nepremi\u010dnih posodah.\\n\\nNaslovni
  organ je v to\u010dkah 8.1.17., 8.1.18., 8.1.19. in 8.1.20. izreka okoljevarstvenega
  dovoljenja, na podlagi prvega, drugega in petega odstavka 16. \u010dlena in drugega
  odstavka 18. \u010dlena Uredbe o skladi\u0161\u010denju nevarnih teko\u010din v
  nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t. 104/09,
  29/10 in 105/10) dolo\u010dil zahteve za preverjanje ukrepov za prepre\u010devanje
  iztekanja nevarne teko\u010dine.\\n\\nNaslovni organ je v to\u010dki 8.1.21. izreka
  okoljevarstvenega dovoljenja, na podlagi prvega odstavka 11. \u010dlena Uredbe o
  skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) dolo\u010dil zahteve
  glede prijave prenehanja uporabe skladi\u0161\u010da.\\n\\nNaslovni organ je v to\u010dkah
  8.1.22. in 8.1.23. izreka okoljevarstvenega dovoljenja, na podlagi prvega in drugega
  odstavka 13. \u010dlena Uredbe o skladi\u0161\u010denju nevarnih teko\u010din v
  nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t. 104/09,
  29/10 in 105/10) dolo\u010dil zahteve glede prenehanja uporabe skladi\u0161\u010dne
  posode.\\n\\nNaslovni organ je v to\u010dki 8.1.24. izreka okoljevarstvenega dovoljenja,
  na podlagi 15. \u010dlena Uredbe o skladi\u0161\u010denju nevarnih teko\u010din
  v nepremi\u010dnih skladi\u0161\u010dnih posodah (Uradni list RS, \u0161t. 104/09,
  29/10 in 105/10) dolo\u010dil zahteve glede evidence o skladi\u0161\u010denju nevarnih
  teko\u010din.\\n\\nNaslovni organ na podlagi drugega odstavka 14. \u010dlena Uredbe
  o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) ni dolo\u010dil izdelave
  na\u010drta ravnanja z nevarnimi teko\u010dinami, ker mora upravljavec izdelati
  zasnovo\\n\\nzmanj\u0161evanja tveganja za okolje za obrat manj\u0161ega tveganja
  za okolje.\\n\\nNaslovni organ je skladno s \u010detrtnim odstavkom 9. \u010dlena
  Uredbe o vrsti dejavnosti in naprav, ki lahko povzro\u010dajo onesna\u017eevanje
  okolja ve\u010djega obsega (Uradni list RS, \u0161t. 97/04, 71/07 in 122/07) v to\u010dki
  I/9 izreka te odlo\u010dbe dolo\u010di tudi druge pogoje za zmanj\u0161anje tveganja
  ob nesre\u010dah in obvladovanje nenormalnih razmer, ki temelijo na uporabi najbolj\u0161ih
  razpolo\u017eljivih tehnik, in sicer je za to\u010dko 8.3. okoljevarstvenega dovoljenja
  dodal novo to\u010dko 8.4. s to\u010dkama 8.4.1. in 8.4.2. na podlagi Referen\u010dnega
  dokumenta o najbolj\u0161ih razpolo\u017eljivih tehnikah zmanj\u0161evanja emisij
  pri skladi\u0161\u010denju surovin ali nevarnih snovi.\\n\\nKot izhaja iz to\u010dke
  I/10 izreka te odlo\u010dbe, je naslovni organ spremenil tudi Prilogo 1 okoljevarstvenega
  dovoljenja in sicer je na podlagi vloge upravljavca in njenih dopolnitev s podatki
  o rezervoarjih nevarnih teko\u010din spremenil vrsto nevarne teko\u010dine v rezervoarjih
  z oznakami REZ3, REZ4 in REZ5 in \u010drtal rezervoar z oznako REZ12, ker ne vsebuje
  nevarne teko\u010dine. Naslovni organ je tudi uvrstil rezervoarje glede na Uredbo
  o skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih skladi\u0161\u010dnih
  posodah (Uradni list RS, \u0161t. 104/09, 29/10 in 105/10) med zunanje in tiste
  v objektih ter popravil preglednico tako, da je iz nje razvidno, kateri rezervoarji
  imajo skupen zadr\u017eevalni sistem.\\n\\nNa podlagi navedenega je naslovni organ
  ugotovil, da so izpolnjeni vsi predpisani pogoji za zahtevano spremembo okoljevarstvenega
  dovoljenja \u0161t. 35407-94/2006-15 z dne 3. 11. 2009, zato je upravljavcu na podlagi
  5. odstavka 77. \u010dlena ZVO-1 izdal odlo\u010dbo o spremembi okoljevarstvenega
  dovoljenja za obratovanje naprave, ki lahko povzro\u010da onesna\u017eevanje okolja
  ve\u010djega obsega in sicer za kurilno napravo z nazivno vhodno toplotno mo\u010djo
  ve\u010d kot 50 MW. Hkrati je bilo treba stranki dolo\u010diti pogoje v smislu izpolnjevanja
  dolo\u010dil zakonodaje varstva okolja. V odlo\u010dbi o spremembi okoljevarstvenega
  dovoljenja so skladno z 8. \u010dlenom Uredbe o vrsti dejavnosti in naprav, ki lahko
  povzro\u010dajo onesna\u017eevanje okolja ve\u010djega obsega (Uradni list RS, \u0161t.
  97/04, 71/07, 122/07 in 68/12), ki dolo\u010da podrobnej\u0161o vsebino okoljevarstvenega
  dovoljenja, in na podlagi pravnih podlag, ki so navedene 4. to\u010dki obrazlo\u017eitve
  te odlo\u010dbe, dolo\u010dene zahteve v zvezi z emisijami snovi v zrak, obveznosti
  v zvezi z izvajanjem obratovalnega monitoringa in poro\u010danjem za emisije snovi
  v zrak, zahteve za ustrezno ravnanje z odpadki, ki nastajajo zaradi opravljanja
  dejavnosti, zahteve v zvezi s skladi\u0161\u010denjem nevarnih teko\u010din in ukrepi
  za obratovanje naprave v izrednih razmerah.\\n\\nPreostalo besedilo izreka okoljevarstvenega
  dovoljenja \u0161t. 35407-94/2006-15 z dne 3. 11. 2009 ostane nespremenjeno, kot
  izhaja iz to\u010dke II. Izreka te odlo\u010dbe.\\n\\n5. Dol\u017enost obve\u0161\u010danja
  javnosti o spremembi okoljevarstvenega dovoljenja\\n\\nSkladno z dolo\u010dbo 78a.
  \u010dlena v povezavi s 65. \u010dlenom ZVO-1 mora naslovni organ v 30 dneh po vro\u010ditvi
  odlo\u010dbe o spremembi okoljevarstvenega dovoljenja strankam z objavo na krajevno
  obi\u010dajen na\u010din in na svetovnem spletu obvestiti javnost o sprejeti odlo\u010ditvi.\\n\\n6.
  Stro\u0161ki postopka\\n\\nSkladno s prvim odstavkom 113. \u010dlena ZUP gredo stro\u0161ki,
  ki nastanejo organu ali stranki med postopkom ali zaradi postopka (oglase, strokovno
  pomo\u010d, itd.), v breme tistega, na katerega\\n\\nzahtevo se je postopek za\u010del.
  V skladu s petim odstavkom 213. \u010dlena v povezavi z 118. \u010dlenom ZUP je
  bilo treba v izreku tega dovoljenja odlo\u010diti tudi o stro\u0161kih postopka.
  Glede na to, da v tem postopku stro\u0161ki niso nastali, je bilo o njih odlo\u010deno,
  kot izhaja iz to\u010dke III. izreka te odlo\u010dbe.\\n\\n**Pouk o pravem sredstvu:**\\nZoper
  to odlo\u010dbo je dovoljena prito\u017eba na Ministrstvo za kmetijstvo in okolje,
  Dunajska 22, 1000 Ljubljana, v roku 15 dni od dneva vro\u010ditve te odlo\u010dbe.
  Prito\u017eba se vlo\u017ei pisno ali poda ustno na zapisnik pri Agenciji RS za
  okolje, Vojkova cesta 1b, 1102 Ljubljana. Za prito\u017ebo se pla\u010da upravna
  taksa v vi\u0161ini 18,12 EUR. Upravna taksa se pla\u010da v gotovini oziroma z
