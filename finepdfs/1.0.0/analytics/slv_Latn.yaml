  prostorninski vtok, L/s xB3=0.875     ! koncna stopnja presnove C6H4O2 kaskade reaktorjev
  write(6,200) k, cB0, v0, xB3 xB1z=0.5      ! ocena stopnje presnove C6H4O2 prvega
