  Ob\u010dine Tr\u017ei\u010d.)\\n\\nSlika 18 Nalo\u017ebeni projekti fokusnega podro\u010dja
  Pametna regeneracija\\n\\n4.2 Fokusno podro\u010dje 2: Poudarjeno zeleni\\n\\nRazvojni
  izzivi:\\n- Upravljanje mobilnosti, \u0161e posebej dnevnih migracij ob\u010danov
  izven ob\u010dine, mobilnosti znotraj ob\u010dine in koni\u010dne obremenitve zelenega
  zaledja z osebnimi vozili\\n- Pritiski na okolje, naravne vire in tveganje izgubljanja
  identitete\\n- Obvladovanje globalnih tveganj na lokalni ravni\\n\\nCilj: Ohranjeno
  naravno okolje in sonaravno urejeno bivanjsko okolje\\n\\nUsmeritev\\nObmo\u010dje
  ob\u010dine Tr\u017ei\u010d predstavlja visoko vredno naravno okolje, saj z 80 %
  povr\u0161ine pod Natura 2000 sodi med biotsko in geolo\u0161ko najbolj raznovrstna
  obmo\u010dja Slovenije. Ohranjanje najpomembnej\u0161ih naravnih virov \u2013 voda,
  kmetijskih zemlji\u0161\u010d, planin in gozdov - kakor tudi varovanje naselitvene
  dedi\u0161\u010dine in kakovostno urejanje javnega prostora zato ostajajo pomembne
  strate\u0161ke usmeritve Ob\u010dine Tr\u017ei\u010d v naslednjih letih.\\n\\nPoleg
  zagotavljanja rednega vzdr\u017eevanja prometne in okoljske infrastrukture na celotnem
  obmo\u010dju ob\u010dine bomo nadaljevali z izgradnjo kanalizacijskega omre\u017eja.
  Skladno z direktivami EU prednostno v aglomeraciji Tr\u017ei\u010d, nato postopoma
  sledi opremljanje manj\u0161ih sistemov na pode\u017eelju v Natura 2000 obmo\u010djih.
  Posebna skrb bo namenjena izbolj\u0161avam na vodovodnem sistemu \u010crni gozd
  in ukrepom za zmanj\u0161anje koli\u010din odpadkov. Ob\u010dina Tr\u017ei\u010d
  je \u0161e posebej ranljiva na podnebne spremembe, zato bomo vlagali v spremljanje
  stanja in izbolj\u0161ave infrastrukture na hudourni\u0161kih, poplavnih in plazovitih
  obmo\u010djih. Z urejanjem varnih povezovalnih kolesarskih poti med Tr\u017ei\u010dem
  in ob\u010dino Naklo, zelenih pe\u0161poti med mestom in zaledjem, plo\u010dnikov
  v naseljih ter z ekonomi\u010dnimi re\u0161itvami in re\u017eimi lokalne mobilnosti
  bomo spodbujali ob\u010dane k hoji, kolesarjenju in uporabi javnega prevoza za prihod
  na delo, v \u0161olo in tudi za obisk gorskih obmo\u010dij.\\n\\nKakovost bivanja
  v mestu Tr\u017ei\u010d bo pomembno izbolj\u0161ala na\u010drtovana severna priklju\u010dna
