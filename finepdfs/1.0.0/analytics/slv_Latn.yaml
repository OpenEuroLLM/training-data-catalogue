  za Hermanove prijatelje v Otro\u0161kem muzeju\\n- pisanje \u010dlankov\\n- redna
  obvestila in vabila medijem o dogajanju v muzeju (odprtja razstav, predavanja, seminarji,
  gledali\u0161ke predstave, aktivnosti samo v otro\u0161kem muzeju...)\\n\\nPEDAGO\u0160KO
  DELO: Otro\u0161ki muzej Hermanov brlog\\n\\nA. DELOVNI LISTI, VPRA\u0160ALNIKI
