  Tr\u017ei\u010d 2020: Kje smo mo\u010dni? Kje smo \u0161ibki?\\n\\nSkozi ekonomsk-socialni
  profil ob\u010dine, podan v obliki 100 razvojnih kazalnikov ob\u010dine Tr\u017ei\u010d
  na vseh treh podro\u010djih trajnosti, analiziramo razvojni polo\u017eaj ob\u010dine
  leta 2020 ter ga primerjamo z letom 2010 in s polo\u017eajem ob\u010dine na Gorenjskem
  in v Sloveniji. Analiza kazalnikov je prikazana v prilogi 1. V nadaljevanju na podlagi
