  dol\u017eenih primerih uporablja zgolj \u00bbTr\u017ei\u010d\u00ab, pri tem pa mislimo
  na celotno obmo\u010dje ob\u010dine.\\n\\n\\\\textsuperscript{6} https://www.bsc-kranj.si/library/files/upload/Program%20priprave%20RPP%20Gorenjske%202021-2027_sprejet.pdf\\n\\n\\\\textsuperscript{7}
