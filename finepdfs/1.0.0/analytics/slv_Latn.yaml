sample: '["\"Agencija Republike Slovenije za okolje izdaja na podlagi \u010detrtega
  odstavka 8. \u010dlena Uredbe o organih v sestavi ministrstev (Uradni list RS, \u0161t.
  58/03, 45/04, 86/04-ZVOP-1, 138/04, 52/05, 82/05, 17/06, 76/06, 132/06, 41/07, 64/08-ZViS-F,
  63/09, 69/10, 40/11, 98/11, 17/12, 23/12, 82/12 in 109/12) in na podlagi 77. in
  78. \u010dlena Zakona o varstvu okolja (Uradni list RS, \u0161t. 39/06-ZVO-1-UPB1,
  49/06-ZMetrD, 66/06-Odl. US, 33/07-ZPNa\u010drt, 57/08-ZFO-1A, 70/08, 108/09, 48/12
  in 57/12) v upravni zadevi spremembe okoljevarstvenega dovoljenja za obratovanje
  naprave, ki lahko povzro\u010da onesna\u017eevanje okolja ve\u010djega obsega, po
  uradni dol\u017enosti in na zahtevo stranke TERMOELEKTRARNA TOPLARNA LJUBLJANA,
  d.o.o., Toplarni\u0161ka ulica 19, 1000 Ljubljana, ki jo zastopa direktor Samo Lozej,
  naslednjo\\n\\nODLO\u010cBO\\no spremembi okoljevarstvenega dovoljenja\\n\\nI.\\n\\nOkoljevarstveno
  dovoljenje \u0161t. 35407-94/2006-15 z dne 3. 11. 2009, izdano stranki \u2013 upravljavcu
  TERMOELEKTRARNA TOPLARNA LJUBLJANA, d.o.o., Toplarni\u0161ka ulica 19, 1000 Ljubljana
  (v nadaljevanju: upravljavec) se spremeni tako, kot izhaja iz nadaljevanja te odlo\u010dbe:\\n\\n1.)
  Preglednica 1 v to\u010dki 1 izreka okoljevarstvenega dovoljenja se spremeni tako,
  da se glasi:\\n\\nPreglednica 1: Kurilne naprave in plinska turbina\\n\\n| Oznaka
  | Vrsta kotle/ plinske turbina | Vh.topl. mo\u010d [MW] | Oznaka velike kurilne
  naprave(5)/ oznaka objekta/ oznaka odvodnika | Vh.topl. mo\u010d velike kurilne
  naprave [MW] | Gorivo 1 | Gorivo 2 |\\n|--------|-----------------------------|------------------|---------------------------------------------------------------|------------------------------------------|---------|---------|\\n|
  N1     | Parni kotel 1               | 137              | TE-TOL D GPO(2) Z1                                           |                                          |
  premog  | /       |\\n| N2     | Parni kotel 2               | 137              |                                                               |                                          |
  premog  | /       |\\n| N3     | Parni kotel 3               | 207              |                                                               |                                          |
  premog  | biomasa(6) |\\n| N4     | Vro\u010devodni kotel VKLM1      | 66               |
  TE-TOL E VK(3) Z2                                             |                                          |
  ELKO(1) | /       |\\n| N5     | Vro\u010devodni kotel VKLM2      | 66               |                                                               |                                          |
  ELKO(1) | /       |\\n| N6     | Parni kotel BKG1            | 16               |                                                               |                                          |
  ELKO(1) | /       |\\n| N7     | Parni kotel BKG2            | 16               |                                                               |                                          |
  ELKO(1) | /       |\\n| N36    | Plinska turbina - NOVA      | 250              |
  / PPE(4) Z3                                                   |                                          |
  zemeljski plin | ELKO(1) |\\n\\n(1) ELKO = Elektri\u010dna energija\\n(2) GPO =
  Gospodarski plin\\n(3) VK = Vro\u010devodni kotel\\n(4) PPE = Plinska turbina\\n(5)
  TE-TOL = Termoelektrarna toplarna\\n(6) Biomasa = Biomasa\\n\\n(1) Ekstra lahko
  kuri\u0161no olje\\n(2) GPO: Glavni pogonski objekt\\n(3) VK: Vr\u0161na kotlarna\\n(4)
  PPE: Plinsko parna elektrarna\\n(5) Oznaka velike kuri\u0161ne naprave: v skladu
  z Operativnim programom zmanj\u0161evanja emisij snovi v zrak iz velikih kuri\u0161nih
  naprav\\n(6) Biomasa: biomasa v skladu s predpisom, ki ureja emisije snovi v zrak
  iz velikih kuri\u0161nih naprav\\n\\n2.) To\u010dka 2.1.10. izreka okoljevarstvenega
  dovoljenja se spremeni tako, da se glasi:\\n\\n2.1.10. Upravljavcu se dovoli kot
  gorivo uporabljati v kotlih Vro\u010devodni kotel VKLM1 z oznako (N4), Vro\u010devodni
  kotel VKLM2 z oznako (N5), Parni kotel BKG1 z oznako (N6) in Parni kotel BKG2 z
  oznako (N7) ekstra lahko kuri\u0161no olje.\\n\\n3.) To\u010dka 2.1.19 izreka okoljevarstvenega
  dovoljenja se spremeni tako, da se glasi:\\n\\n2.1.19. Upravljavec mora za nepremi\u010dno
  opremo za hlajenje, klimatizacijo in toplotne \u010drpalke (v nadaljevanju: oprema),
  ki vsebuje ozonu \u0161kodljive snovi ali dolo\u010dene fluorirane toplogredne pline
  (ali pripravkov iz teh plinov), zagotavljati, da se ti hladilni plini pri namestitvi,
  obratovanju, vzdr\u017eevanju, razgradnji ali odstranjevanju te opreme, ne izpu\u0161\u010dajo
  v zrak.\\n\\n4.) To\u010dka 2.1.20. izreka okoljevarstvenega dovoljenja se spremeni
  tako, da se glasi:\\n\\n2.1.20 Upravljavec od 01. 01. 2015 dalje pri vzdr\u017eevanju
  in servisiranju obstoje\u010de opreme za hlajenje in klimatizacijo ne sme ve\u010d
  uporabljati nobenih delno halogeniranih klorofluorovodikov (R22), tudi recikliranih
  ne.\\n\\n5.) V To\u010dki 2.2.2. izreka in preglednici 5 okoljevarstvenega dovoljenja
  se besedilo \u00bbte\u017eko kuri\u0161no olje\u00ab zamenja z besedilom \u00bbekstra
  lahko kuri\u0161no olje\u00ab.\\n\\n6.) Za to\u010dko 2.3.25. izreka okoljevarstvenega
  dovoljenja se dodajo nove to\u010dke 2.3.26., 2.3.27. in 2.3.28., ki se glasijo:\\n\\n2.3.26.
  Upravljavec mora nepremi\u010dno opremo, ki obratuje ali je za\u010dasno zunaj uporabe
  in vsebuje 3 kg ali ve\u010d ozonu \u0161kodljivih snovi ali fluoriranih toplogrednih
  plinov, prijaviti Agenciji RS za okolje najpozneje tri mesece po za\u010detku obratovanja
  opreme. V primeru sprememb podatkov iz prijave to v roku enega meseca sporo\u010di
  Agenciji RS za okolje na obrazcu za prijavo stacionarne opreme.\\n\\n2.3.27. Namestitev
  in vzdr\u017eevanje nepremi\u010dne opreme za hlajenje in klimatizacijo, ki vsebuje
  ozonu \u0161kodljive snovi ali dolo\u010dene fluorirane toplogredne pline, polnjenje
  te opreme s hladilnimi plini ter preverjanje in zajem teh plinov iz opreme izvaja
  poobla\u0161\u010deno podjetje, ki ima potrdilo Agencije RS za okolje o vpisu v
  evidenco poobla\u0161\u010denih podjetij za vzdr\u017eevanje in namestitev nepremi\u010dne
  opreme.\\n\\n2.3.28. Upravljavec nepremi\u010dne opreme za hlajenje, klimatizacijo,
  toplotne \u010drpalke in vgrajen gasilni sistem mora najpozneje do 31. marca teko\u010dega
  leta predlo\u017eiti Agenciji RS za okolje letno poro\u010dilo o polnjenju in zajemu
  ozonu \u0161kodljivih snovi ali fluoriranih toplogrednih plinov za preteklo leto,
  v katerem je treba navesti tudi podatke o ravnanju z odpadnimi ozonu \u0161kodljivimi
  snovmi in fluoriranimi toplogrednimi plini.\\n\\n7.) To\u010dka 6.1. izreka okoljevarstvenega
  dovoljenja se spremeni tako, da se glasi:\\n\\n6.1. Zahteve za ustrezno ravnanje
  z odpadki, ki nastajajo zaradi opravljanja dejavnosti\\n\\n6.1.1. Upravljavec mora
  pri nastajanju odpadkov in ravnanju z njimi kot prednostni vrstni red upo\u0161tevati
  hierarhijo ravnanja: prepre\u010devanje, priprava za ponovno uporabo, recikliranje,
  drugi postopki predelave, kot je na primer energetska predelava, in odstranjevanje
  odpadkov.\\n\\n6.1.2. Upravljavec mora odpadke skladi\u0161\u010diti tako, da ni
  ogro\u017eeno \u010dlovekovo zdravje in da ravnanje ne povzro\u010da \u0161kodljivih
  vplivov na okolje.\\n\\n6.1.3. Upravljavec mora odpadke skladi\u0161\u010diti lo\u010deno
  po vrstah odpadkov tako, da so izpolnjene zahteve za predvideni na\u010din nadaljnjega
  ravnanja.\\n\\n6.1.4. Upravljavec mora za nastale odpadke zagotoviti obdelavo odpadkov,
  tako da jih odda osebi, ki je vpisana v evidenco oseb, ki ravnajo z odpadki ali
  prepusti, \u010de je prepu\u0161\u010danje s posebnim predpisom dovoljeno ali proda
  trgovcu, \u010de ta zanje zagotovi njihovo obdelavo in \u010de so nastali odpadki
  nenevarni in zanje ne velja poseben predpis.\\n\\n6.1.5. Upravljavec mora odpadke
  skladi\u0161\u010diti tako, da koli\u010dina za\u010dasno skladi\u0161\u010denih
  odpadkov ne presega koli\u010dine odpadkov, ki zaradi delovanja ali dejavnosti upravljavca
  naprave nastanejo v obdobju dvanajstih mesecev.\\n\\n6.1.6. Upravljavec mora zagotoviti,
  da so odpadki pri za\u010dasnem skladi\u0161\u010denju pakirani tako, da ne ogro\u017eajo
  okolja in \u010dlovekovega zdravja, ter da so opremljeni z oznako o nazivu odpadka
  in njegovi klasifikacijski \u0161tevilki.\\n\\n6.1.7. Upravljavec mora odpadke za\u010dasno
  skladi\u0161\u010diti tako, da se hranijo lo\u010deno in ne pride do me\u0161anja
  nevarnih odpadkov z nevarnimi odpadki, ki imajo druga\u010dne fizikalne, kemi\u010dne
  ali nevarne lastnosti, me\u0161anja nevarnih odpadkov z drugimi odpadki in snovmi
  ali materiali, vklju\u010dno z me\u0161anjem zaradi re\u0161enja nevarnih snovi
  ter z odpadki ravnati tako, da so primerni za obdelavo.\\n\\n6.1.8. Upravljavec
  mora nevarne odpadke opremiti tudi z oznako \u00bbnevarni odpadek\u00ab in z navedbo
  nevarnih lastnosti v skladu s predpisi, ki urejajo kemikalije.\\n\\n6.1.9. Upravljavec
  mora odpadke, ki se prevajajo in so nevarno blago, ozna\u010diti po predpisih, ki
  urejajo prevoz nevarnega blaga.\\n\\n6.1.10. Upravljavec mora zagotoviti, da se
  za vsako po\u0161iljko odpadkov, ki se preme\u0161\u010dajo na obmo\u010dju RS,
  izpolni eviden\u010dni list. Eviden\u010dni list je veljaven, ko ga s svojim podpisom
  potrdita upravljavec in zbiralec ali obdelovalec, ki je odpadke prevzel.\\n\\n6.1.11.
  Upravljavec izpolnjevanje obveznosti zagotavljanja obdelave odpadkov iz 6.1.4 to\u010dke
  izreka tega dovoljenja dokazuje z:\\n- veljavnim eviden\u010dnim listom za odpadke
  iz prej\u0161nje to\u010dke izreka tega dovoljenja ali\\n- z listino iz Uredbe 1013/2006/ES
  za odpadke, ki jih je postal v obdelavo v drugo dr\u017eavo.\\n\\n6.1.12. Upravljavec
  mora imeti Na\u010drt gospodarjenja z odpadki in mora v skladu z njim izvajati ukrepe
  prepre\u010devanja in zmanj\u0161evanja nastajanja odpadkov ter ravnati z odpadki.
  Na\u010drt gospodarjenja z odpadki mora izdelati za obdobje \u0161tirih let in ga
  vsako leto pregledati in ustrezno popraviti ali dopolniti.\\n\\n8.) To\u010dka 8.1.
  izreka okoljevarstvenega dovoljenja se spremeni tako, da se glasi:\\n\\n8.1. Skladi\u0161\u010denje
  nevarnih teko\u010din\\n\\n8.1.1. Upravljavec sme za skladi\u0161\u010denje nevarnih
  teko\u010din uporabljati rezervoarje navedene v Prilogi 1 tega dovoljenja.\\n\\n8.1.2.
  Upravljavec mora pri projektiranju, gradnji, obratovanju in vzdr\u017eevanju nepremi\u010dnih
  rezervoarjev REZ15 in REZ16 zagotoviti upo\u0161tevanje standarda SIST EN 12285
  za nadzemne in podzemne rezervoarje, ki so izdelani iz jeklene plo\u010devine v
  delavnici in so zaradi vgradnje prepeljani na obmo\u010dje skladi\u0161\u010denja.\\n\\n8.1.3.
  Upravljavec mora pri obratovanju in vzdr\u017eevanju nepremi\u010dnih rezervoarjev
  REZ1, REZ2, zagotoviti, da je upo\u0161tevan standard SIST EN 14015 za rezervoarje,
  ki so zavarjeni iz jeklene plo\u010devine na kraju vgradnje.\\n\\n8.1.4. Upravljavec
  mora pri obratovanju in vzdr\u017eevanju nepremi\u010dnih rezervoarjev REZ3, REZ4,
  REZ5, REZ6, REZ7, REZ8, REZ9, REZ10, REZ11, REZ13 in REZ14 zagotoviti, da je upo\u0161tevan
  standard SIST EN 12285 za nadzemne in podzemne rezervoarje, ki so izdelani iz jeklene
  plo\u010devine v delavnici in so zaradi vgradnje prepeljani na obmo\u010dje skladi\u0161\u010denja.\\n\\n8.1.5.
  Pri skladi\u0161\u010denju nevarnih teko\u010din je treba zagotoviti, da so cevovodi
  grajeni in vzdr\u017eevani tako, da so u\u010dinki korozije \u010dim manj\u0161i,
  in nadzorovani tako, da se ob iztekanju lahko prepre\u010di nenadzorovano izlijanje
  nevarne teko\u010dine v okolje.\\n\\n8.1.6. Pri pretakanju nevarnih teko\u010din
  zaradi praznjenja in polnjenja nepremi\u010dnih rezervoarjev iz priloge 1 tega dovoljenja,
  je treba zagotoviti:\\n   i. da imajo cevi za polnjenje in praznjenje nepremi\u010dnega
  rezervoarja tesne spoje,\\n   ii. da ima nepremi\u010dni rezervoar opremo, ki prepre\u010duje
  njihovo polnitev nad nazivno prostornino nepremi\u010dnega rezervoarja,\\n   iii.
  da je utrjena povr\u0161ina pretakali\u0161\u010da, na kateri se pretakajo nevarne
  teko\u010dine, prekrita s plastijo nepropustnega materiala za nevarno snov, ki se
  pretaka,\\n   iv. zadr\u017eevalni sistem, ki prepre\u010di, da bi razliha nevarna
  teko\u010dina s povr\u0161ine pretakali\u0161\u010da odtekla v vode ali v kanalizacijo
  ali pronicala v tla.\\n\\n8.1.7. Upravljavec mora pri podzemnem skladi\u0161\u010denju
  nevarnih teko\u010din v nepremi\u010dnem podzemnem rezervoarju z dvojnim pla\u0161\u010dem
  REZ16 zagotoviti, da je opremljen z opremo za zvo\u010dno ali vizualno opozarjanje
  ob nenadzorovanem iztekanju nevarne teko\u010dine.\\n\\n8.1.8. Upravljavec mora
  pri podzemnem skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnem rezervoarju
  z enojnim pla\u0161\u010dem REZ6 zagotoviti, da je name\u0161\u010den v grajenem
  in z vseh strani zaprtem objektu, katerega dno in stene so neprepustne za skladi\u0161\u010deno
  nevarno teko\u010dino in ima 25% ve\u010djo prostornino, kot je njegova nazivna
  prostornina, tako, da se ob morebitnem razliju vsa skladi\u0161\u010dena nevarna
  teko\u010dina v tem objektu zadr\u017ei.\\n\\n8.1.9. Upravljavec mora pri nadzemnem
  skladi\u0161\u010denju nevarnih teko\u010din v nepremi\u010dnih nadzemnih rezervoarjih
  REZ1, REZ2, REZ14, REZ15 zagotoviti:\\n   - zadr\u017eevalni sistem za prestrezanje
  in zadr\u017eevanje iztekajo\u010de nevarne teko\u010dine,\\n   - da je nepremi\u010dni
  rezervoar name\u0161\u010den in opremljen tako, da je vsak trenutek mogo\u010de
  ugotoviti iztekanje nevarne teko\u010dine iz nepremi\u010dnega rezervoarja in cevovodov
  ter pripadajo\u010de opreme.\\n\\n8.1.10. Prostornina zadr\u017eevalnega sistema
  posameznega nepremi\u010dnega rezervoarja pri nadzemnem skladi\u0161\u010denju (REZ14,
  REZ15) mora biti najmanj enaka nazivni prostornini nepremi\u010dnega rezervoarja.\\n\\n8.1.11.
  Prostornina skupnega zadr\u017eevalnega sistema, ki se uporablja za nepremi\u010dna
  nadzemna\\n\\nrezervoarja REZ1 in REZ2 mora biti najmanj 10% ve\u010dja od nazivne
  prostornine najve\u010djega rezervoarja za katerega se uporablja zadr\u017eevalni
  sistem.\\n\\n8.1.12. Upravljavec mora pri nadzemnem skladi\u0161\u010denju nevarnih
  teko\u010din v nepremi\u010dnih nadzemnih rezervoarjih z nazivno prostornino ve\u010djo
  od 1 m$^3$ (REZ1, REZ2, REZ15) zagotoviti, da so nepremi\u010dni rezervoarji opremljeni
  z opremo za zvo\u010dno ali vizualno opozarjanje ob nenadzorovanem iztekanju nevarne
  teko\u010dine.\\n\\n8.1.13. Upravljavec mora pri skladi\u0161\u010denju nevarnih
  teko\u010din v nepremi\u010dnih posodah v skladi\u0161\u010dih iz Priloge 2 tega
  dovoljenja in nepremi\u010dnih rezervoarjih v objektih REZ3, REZ4, REZ5, REZ7, REZ8,
  REZ9, REZ10, REZ11, iz priloge 1 tega dovoljenja, zagotoviti:\\n   - da sta nepremi\u010dna
  posoda ali nepremi\u010dni rezervoar name\u0161\u010dena in opremljena tako, da
  je vsak trenutek mogo\u010de ugotoviti iztekanje nevarne teko\u010dine iz nepremi\u010dnega
  rezervoarja in cevovodov ter pripadajo\u010de opreme in\\n   - zadr\u017eevalni
  sistem za prestrezanje in zadr\u017eevanje iztekajo\u010de nevarne teko\u010dine.\\n\\n8.1.14.
  Prostornine skupnih zadr\u017eevalnih sistemov rezervoarjev v objektu REZ3, REZ4,
  REZ5 in REZ7, REZ8, REZ9 in REZ10, REZ11, morajo biti najmanj 10% ve\u010dje od
  nazivne prostornine najve\u010djega rezervoarja za katerega se uporablja zadr\u017eevalni
  sistem.\\n\\n8.1.15. Zadr\u017eevalni sistemi ne smejo imeti odprtin, iz katerih
  bi nevarne teko\u010dine lahko nenadzorovano iztekale, njegove stene pa morajo biti
  dovolj visoke, da prestre\u017eejo curke iztekajo\u010de nevarne teko\u010dine iz
  nepremi\u010dnega rezervoarja.\\n\\n8.1.16. Zunanje skladi\u0161\u010denje nevarnih
  teko\u010din v nepremi\u010dnih posodah ni dovoljeno.\\n\\n8.1.17. Upravljavec mora
  zagotoviti preverjanje ukrepov za prepre\u010devanje iztekanja nevarnih teko\u010din
  iz nepremi\u010dnih rezervoarjev v skladi\u0161\u010du z zmogljivostjo, ve\u010djo
  od 40 m$^3$, in sicer:\\n   - pred prvim polnjenjem nepremi\u010dnega rezervoarja,\\n   -
  z ob\u010dasnimi pregledi nepremi\u010dnega rezervoarja med njegovim obratovanjem,\\n   -
  z ob\u010dasnimi pregledi izpraznjenega nepremi\u010dnega rezervoarja,\\n   - po
  rekonstrukciji nepremi\u010dnega rezervoarja ali pred njegovim ponovnim polnjenjem,
  \u010de nepremi\u010dni rezervoar ni bil polnjen z nevarno teko\u010dino ve\u010d
  kot dve leti.\\n\\n8.1.18. Upravljavec mora za vsako preverjanje ukrepov za prepre\u010devanje
  iztekanja nevarnih teko\u010din iz nepremi\u010dnih rezervoarjev iz to\u010dke 8.1.17.
  izreka tega dovoljenja od izvajalca preverjanja pridobiti poro\u010dilo o opravljenem
  preverjanju ukrepov za prepre\u010devanje iztekanja nevarnih teko\u010din.\\n\\n8.1.19.
  Upravljavec mora poro\u010dilo o opravljenem preverjanju ukrepov za prepre\u010devanje
  iztekanja nevarnih teko\u010din hraniti ves \u010das obratovanja nepremi\u010dnih
  rezervoarjev, na katere se to poro\u010dilo nana\u0161a.\\n\\n8.1.20. Upravljavec
  mora zagotoviti, da preverjanje ukrepov za prepre\u010devanje iztekanja nevarnih
  teko\u010din iz nepremi\u010dnih rezervoarjev iz to\u010dke 8.1.1. izreka tega dovoljenja
  opravi izvajalec, ki ima registrirano dejavnost za opravljanje analiz in preizkusov
  in ima akreditacijo SIST EN ISO/IEC 17020 za kontrolo tesnosti rezervoarjev in kontrolo
  ukrepov za prepre\u010devanje iztekanja nevarne teko\u010dine po postopkih iz standarda
  SIST EN 14015 za rezervoarje, ki so zavarjeni iz jeklene plo\u010devine na mestu
  vgradnje, ter SIST EN12285 za nadzemne in podzemne rezervoarje, ki so izdelani iz
  jeklene plo\u010devine v delavnici in so zaradi vgradnje pripeljani na obmo\u010dje
  skladi\u0161\u010denja.\\n\\n8.1.21. Upravljavec mora prenehanje uporabe skladi\u0161\u010d
  in rezervoarjev prijaviti ministrstvu pristojnemu za varstvo okolja.\\n\\n8.1.22.
  Upravljavec mora zagotoviti, da za\u010dasno ali stalno prenehanje uporabe skladi\u0161\u010dne
  posode ne povzro\u010di onesna\u017eenja tal ali vode.\\n\\n8.1.23. Upravljavec
  mora rezervoar, ki se preneha uporabljati, izprazniti in o\u010distiti.\\n\\n8.1.24.
  Upravljavec mora za skladi\u0161\u010da in rezervoarje z nevarnimi teko\u010dinami
  katerih zmogljivost presega 10 m$^3$ voditi evidenco o skladi\u0161\u010denju nevarnih
  teko\u010din iz katere mora biti razviden letni pretok nevarnih teko\u010din. Evidenco
  nevarnih teko\u010din za posamezno koledarsko leto mora hraniti pet let.\\n\\n9.)
  Za to\u010dko 8.3. izreka okoljevarstvenega dovoljenja se doda nova to\u010dka 8.4.,
  ki se glasi:\\n\\n8.4. Ukrepi za obratovanje naprave v izrednih razmerah\\n\\n8.4.1.
  Upravljavec mora zagotoviti, da se v primeru razlitja nevarnih teko\u010din le-te
  zadr\u017eijo v lovilnih sistemih, ki morajo biti mehansko, termi\u010dno in kemi\u010dno
  odporni, da ne pride do onesna\u017eenja zemljinje in vode z razlitlo snovjo.\\n\\n8.4.2.
  Upravljavec mora v primeru po\u017eara zagotoviti popolno zajetje gasilnih sredstev
  in razlitih nevarnih teko\u010din.\\n\\n10.) Priloga 1 okoljevarstvenega dovoljenja
