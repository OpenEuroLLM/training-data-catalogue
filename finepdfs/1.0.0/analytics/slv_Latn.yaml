  "\"Glasilo \u017eupnije sv. Marjete Polzela, Trg sv. Marjete 1\\n\\n27. junij\\n\\nTel.:   041
  634 392 (M.\u0160.)  *  041 381 472 (M.S.)  * 041 259 317 (D.S.)  *  031 559 635
  (J.K.)\\n\\nBES EDA \u017d I V EG A BOG A\\n\\nVstopil je in jim rekel: \u00bbKaj
  se razburjate in jokate? Deklica ni umrla, ampak spi.\u00ab In posmehovali so se
  mu. On pa je vse odsl\u00f4vil in vzel s seboj o\u010deta in mater deklice ter tiste,
  ki so bili z njim, in stopil tja, kjer je bila deklica. Prijel jo je za roko in
  ji rekel: \u00bbTal\u00edta kum,\u00ab kar pomeni: Deklica, re\u010dem ti, vstani!
  Deklica je takoj vstala in hodila; imela je namre\u010d dvanajst let. Od za\u010dudenja
  so bili vsi iz sebe.\\n\\n(Mr 5,39-42)\\n\\n\u00bbBog je \u010dloveka ustvaril za
  neminljivost.\u00ab\\n\\n\u00bbBog ni nar\u00e9dil smrti, ne vesel\u00ed se propada
  \u017eivega. Vse je namre\u010d ustvaril za bivanje.\u00ab (Mdr 1,13) O\u010de,
  vodi na\u0161e misli, besede in dejanja, da bomo ohranjali trdno vero in s teboj
  ve\u010dno \u017eiveli\\n\\nBeseda, izgovorjena ali napisana, ima mo\u010d, da gradi
  ali da podira. Da daje ali da jemlje. Da razodeva ali da prikriva. Da obnavlja ali
  da zapira.\\n\\nNi pa beseda le predmet razodevanja misli in \u010dustev, ampak
  je \u017eivljenje samo. Zato je mo\u010d besede neprecenljiva, nenadgradljiva. \u010ce
  se tega zavedamo, bomo z njo ravnali spo\u0161tljivo. Ne bomo je zlorabljali, a
  z njo tudi ne skoparili. Ne bomo je uporabljali kot sredstvo zla, ampak kot kelih
  \u017elahtnega obdarovanja. Odmerjena in resni\u010dna beseda namre\u010d vliva
  \u017eivljenje in prina\u0161a mir. Je energija in frekvenca brez\u010dasnosti,
  ki nas povezuje z Bogom.\\n\\nOBLETNICE TA TEDEN\\n\\n\u2026 KRSTI\\n\\n(ZA 30 LET
