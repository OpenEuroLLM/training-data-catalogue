  za kemijo in kemijsko tehnologijo Univerze v Mariboru\\n\\nNa\u010din izdaje:\\n\\nelektronsko
  u\u010dno gradivo\\n\\nGradiva iz publikacije, brez dovoljenja avtorja, ni dovoljeno
  kopirati, reproducirati, objavljati ali prevajati v druge jezike.\\n\\n```\\nCIP
  - Katalo\u017eni zapis o publikaciji Univerzitetna knji\u017enica Maribor 66.0(075.8)(076)
  ORE\u0160KI, Severina Reakcijska tehnika [Elektronski vir] : navodila za ra\u010dunalni\u0161ke
  vaje / Severina Ore\u0161ki. - Maribor : Fakulteta za kemijo in kemijsko tehnologijo,
  2006 ISBN 86-435-0784-9 COBISS.SI-ID 57116417\\n```\\n\\nPredgovor\\n\\nNavodila
  za ra\u010dunalni\u0161ke vaje iz Reakcijske tehnike so namenjena \u0161tudentom
  4.\\n\\nletnikov univerzitetnega programa Kemijska tehnologija in univerzitetnega
  programa\\n\\nBiokemijska tehnologija. Vsebujejo napotke za \u010dimbolj u\u010dinkovito
  izvedbo ra\u010dunalni\u0161kih vaj in \u0161tudente vodijo skozi pravilno pripravo
  poro\u010dil o opravljenih ra\u010dunalni\u0161kih vajah pri predmetu\\n\\nReakcijska
  tehnika.\\n\\nNavodila za vaje so pripomo\u010dek za re\u0161evanje problemov s
  podro\u010dja kemijske reakcijske kinetike in modeliranja reaktorjev z ra\u010dunalni\u0161kim
  programiranjem. Na osnovi\\n\\nu\u010dbenika Modeliranje procesnih operacij\\n\\n\u0161tudente
  seznanjajo z numeri\u010dnimi metodami in programsko opremo, ki je na voljo za re\u0161evanje
  algebrskih in diferencialnih ena\u010db. Uporabo\\n\\nprogramske opreme predstavljajo
  na dveh primerih s podro\u010dja reakcijske tehnike. Vsebujejo tudi pregled programske
  opreme za simuliranje procesnih operacij in modeliranje reaktorjev.\\n\\nZa re\u0161ena
  primera iz reakcijske tehnike prikazujejo pripravo blokovnih diagramov in ra\u010dunalni\u0161kih
  diagramov poteka ter izdelana ra\u010dunalni\u0161ka programa z dobljenimi rezultati.\\n\\nNavodila
  za vaje \u0161tudente tudi seznanjajo z napotki za pripravo poro\u010dila o opravljenem
  delu in dobljenih rezultatih pri ra\u010dunalni\u0161kih vajah ter z na\u010dinom
  ocenjevanja opravljenega dela pri\\n\\nvajah.\\n\\nMaribor, junij 2006                                                                                           Severina
  Ore\u0161ki\\n\\ni\\n\\nUPORABLJENI SIMBOLI\\n\\nVSEBINA\\n\\n1 UVOD\\n\\nPri ra\u010dunalni\u0161kih
  vajah iz Reakcijske tehnike se re\u0161ujejo problemi s podro\u010dja reakcijske
  tehnike, ki zahtevajo ra\u010dunalni\u0161ko programiranje. Programski jezik je
  FORTRAN. Osnova za vaje je u\u010dbenik Modeliranje procesnih operacij 1 . Iz u\u010dbenika
  se \u010drpa teorija in programska oprema za:\\n\\n\u2013 numeri\u010dno re\u0161evanje
  algebrskih ena\u010db,\\n\u2013 snemanje enodimenzijskih in dvodimenzijskih funkcij,\\n\u2013
  numeri\u010dno re\u0161evanje diferencialnih ena\u010db,\\n\u2013 simulacijo procesnih
  operacij in\\n\u2013 modeliranje reaktorjev.\\n\\nDelo pri ra\u010dunalni\u0161kih
  vajah iz Reakcijske tehnike poteka v petih stopnjah. Te so:\\n\\n\u2013 testiranje
  programske opreme za numeri\u010dno re\u0161evanje algebrskih in diferencialnih
  ena\u010db (poglavje Numeri\u010dno re\u0161evanje algebrskih ena\u010db in poglavje
  Numeri\u010dno re\u0161evanje diferencialnih ena\u010db u\u010dbenika Modeliranje
  procesnih operacij 1 ),\\n\u2013 re\u0161evanje problemov iz reakcijske tehnike
  s testirano programsko opremo,\\n\u2013 pisni pregled znanja iz poznavanja paketa
  DYFLO (peto poglavje Simulacija procesnih operacij u\u010dbenika Modeliranje procesnih
  operacij 1 ),\\n\u2013 priprava programske opreme za simulacijo procesnih operacij
  in\\n\u2013 testiranje in simuliranje reaktorjev (poglavje Modeliranje reaktorjev
  u\u010dbenika Modeliranje procesnih operacij 1 ).\\n\\nOpravljeno delo in dobljeni
  rezultati morajo biti predstavljeni v pisnem poro\u010dilu o vajah. Poro\u010dilo
  se pripravi z urejevalnikom teksta Word. Sheme, blokovne diagrame, ra\u010dunalni\u0161ke
  diagrame poteka in grafi\u010dni prikaz rezultatov je treba narisati z ra\u010dunalni\u0161kimi
  orodji (npr. SmartDraw, Excel, CorelDraw ipd.)\\n\\n2 OSNOVE MODELIRANJA\\n\\nZa\u010detna
  poglavja u\u010dbenika Modeliranja procesnih operacij 1 (prvo do \u010detrto poglavje)
  vsebujejo numeri\u010dne metode in opis programske opreme za re\u0161evanje algebrskih
  in diferencialnih ena\u010db ter primere iz osnov modeliranja, ki so re\u0161ljivi
  s to programsko opremo. Samih numeri\u010dnih metod ni potrebno podrobno poznati,
  vendar moramo za uspe\u0161no uporabo izdelane programske opreme poznati:\\n\\n\u2013
  zaporedje dogodkov,\\n\u2013 osnovna na\u010dela posameznega programa in\\n\u2013
  omejitve programa.\\n\\nZ vsebino za\u010detnih poglavij so seznanjeni samo \u0161tudentje
  univerzitetne smeri Kemijska tehnologija pri predmetu Dinamika procesov v tretjem
  letniku \u0161tudija. \u0160tudentje univerzitetne smeri Biokemijska tehnologija
  se s temi poglavji sre\u010dajo prvi\u010d \u0161ele na ra\u010dunalni\u0161kih
  vajah iz Reakcijske tehnike. Ker je programska oprema iz za\u010detnih poglavjih
  u\u010dbenika bistvenega pomena za re\u0161evanje problemov iz osnov modeliranja,
  bomo njeno uporabnost razlo\u017eili na dveh primerih iz reakcijske tehnike.\\n\\n2.1
  Re\u0161evanje problemov iz reakcijske tehnike z numeri\u010dnimi metodami za re\u0161evanje
  algebrskih ena\u010db\\n\\nZa numeri\u010dno re\u0161evanje algebrskih ena\u010db
  so na voljo iterativne numeri\u010dne metode:\\n\\n\u2013 navadna iteracijska metoda,
  ki je vgrajena v glavni program DIR_SUBST,\\n\u2013 parcialna substitucija, ki jo
  predstavlja podprogram CPS,\\n\\n\u2013Wegsteinova metoda, ki jo predstavlja podprogram
  CONV,\\n\\n\u2013 Newton-Raphsonova metoda, ki je vgrajena v glavni program NR,\\n\u2013
  algoritem za re\u0161evanje implicitnih sistemov vi\u0161jega reda, pri katerem
  lahko uporabimo poljubno numeri\u010dno metodo,\\n\u2013 metoda interpolacije za
  snemanje enodimenzijskih funkcij, ki jo predstavlja podprogram FUN1, in\\n\u2013
  metoda interpolacije za snemanje dvodimenzijskih funkcij, ki jo predstavlja podprogram
  FUN2.\\n\\nUporaba programske opreme za re\u0161evanje algebrskih ena\u010db bo
