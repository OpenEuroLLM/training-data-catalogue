  in ostrena infrastruktura\\n\\nKartografska podlaga: DTKSO, GURS\\n\\n4.3 Fokusno
  podro\u010dje 3: Vklju\u010dujo\u010da skupnost\\n\\nRazvojni izzivi:\\n- Obvladovanje
  demografskih gibanj\\n- Razdrobljenost in prostorska podhranjenost prosto\u010dasne
  ponudbe in aktivacija razli\u010dnih generacij\\n\\nCilj: Vklju\u010dujo\u010da,
  demografsko vitalnej\u0161a in aktivna skupnost\\n\\nUsmeritev\\nPosledica preteklega
  gospodarskega prehoda se v ob\u010dini odra\u017ea v stagnaciji in staranju prebivalstva.
  Oba pojava sta \u0161e posebej izrazita v somestni osi Bistrica/Pristava/Kri\u017ee
  \u2013 Tr\u017ei\u010d \u2013 Slap/\u010cadovlje ter v odro\u010dnej\u0161ih hribovskih
  naseljih: Jelendol, Grahov\u0161e, Hudi Graben, Le\u0161e, Viso\u010de, Brdo, Vadi\u010de,
  Popovo, Retnje in Gozd. Od leta 2017 demografske trende uravnavajo priselitve iz
  tujine, \u0161e zlasti na mestno obmo\u010dje. Leta 2020 je v ob\u010dini prebivalo
  903 tujih dr\u017eavljanov oz. 6 % vseh ob\u010danov kar je manj kot v regiji (7,2
  %) in dr\u017eavi (7,7 %).\\n\\nV tem pogledu z razvojnim na\u010drtom te\u017eimo
  k modernizaciji dru\u017ebenih storitev in infrastrukture na na\u010din, da slednje
  nudijo kakovostno in dostopno izobra\u017eevalno, zdravstveno, socialno in prosto\u010dasno
  oskrbo, hkrati pa imajo \u0161ir\u0161e u\u010dinke na urbano preobrazbo mestnega
  obmo\u010dja ter dvig privla\u010dnosti celotne ob\u010dine za bivanje, investiranje
  in obiskovanje. Dom starej\u0161ih bo kratkoro\u010dno posodobil obstoje\u010di
  objekt v Bistrici pri Tr\u017ei\u010du, za pove\u010danje zmogljivosti varstva starej\u0161ih
  pa bomo iskali prostor za manj\u0161o enoto na pode\u017eelskem obmo\u010dju ob\u010dine.
  Ob\u010dina s svojimi javnimi zavodi na\u010drtuje ureditev Centra za krepitev zdravja
  pri zdravstvenem domu, ureditev nove knji\u017enice kot sodobnega sti\u0161i\u010da
  znanja, prenove gradu Neuhaus pa kot kulturno-umetni\u0161kega vozli\u0161\u010da.
  Na demografsko propulzivnej\u0161ih obmo\u010djih (Kri\u017ee) bo potrebno zagotoviti
  zadostne infrastrukturne pogoje vrtca in O\u0160, povsod pa skrbeti za vzdr\u017eevanje
  obstoje\u010de \u0161olske, \u0161portne in kulturne infrastrukture.\\n\\nProgramsko
  bo pozornost usmerjena v prosto\u010dasne in medgeneracijske programe, njihovo posodabljanje,
  povezovanje in pribli\u017eevanje vsem skupinam prebivalcev, \u0161e posebej mladinii
  in aktivni populaciji. S posodobitvijo stanovanjske politike \u017eelimo vzpostaviti
  pogoje za pritegnitev investitorjev v kakovostnej\u0161a tr\u017ena stanovanja in
  spodbuditi ve\u010djo izrabo obstoje\u010dega neizkori\u0161\u010denega stavbnega
  fonda.\\n\\nUspe\u0161nost navedenih ukrepov bi se dolgoro\u010dno morala odraziti
  v izbolj\u0161ani demografski sliki, dvigu izobrazbene strukture na raven Gorenjske
  regije, ohranjanju dru\u0161tvenega \u017eivljenja in socialne varnosti.\\n\\nSlika
