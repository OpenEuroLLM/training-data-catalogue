  fotografij in diapozitivov\\n- muzejske zbirke: dokumentiranje in deponiranje pridobljenega
  gradiva v depoje\\n\\nRESTAVRIRANJE GRADIVA:\\n\\n- zbirka poslovilnih pisem ustreljenih
