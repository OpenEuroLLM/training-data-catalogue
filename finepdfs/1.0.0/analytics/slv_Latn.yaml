  novinarji) in glasbeni produkciji dogodkov (Klubski maraton), s poudarkom na aktivno
  vklju\u010denih mladih, ki jih v manj\u0161i meri sofinancira URSM. Sofinanciranje
  temelji na statusu organizacije v javnem interesu na podro\u010dju mladinskih dejavnosti.
  Sofinanciranje na letni ravni zna\u0161a 10.425 \u20ac.\\n- Razli\u010dni viri pridobljeni
  s strani Ministrstva za zunanje zadeve Republike Srbije in Ministrstvo za kulturo
  in informiranje Republike Srbije ter slovenskega Ministrstva za kulturo \u2013 del
  sofinanciranja za produkcijo in predvajanje oddaj srbske skupnosti Kontrola leta
  v letu 2021 s strani krovnega partnerja Srbskega kulturnega centra Danilo Ki\u0161.
  Del sofinanciranja za R\u0160 za leto 2021 je v vi\u0161ini 6.370 \u20ac. V sklopu
  projekta smo producirali 20 oddaj srbske skupnosti.\\n\\nManj\u0161i projekti \u2013
  znesek sofinanciranja do 5.000 \u20ac na letni ali medletni ravni:\\n\\n- MOL-Urad
  za mladino / Usposabljanje Radia \u0160tudent za mlade na podro\u010dju radijskega
  in spletnega novinarstva 2021 \u2013 3-letno programsko sofinanciranje 2021-2023.
  Sofinanciranje za izvajanje rednih avdicij in usposabljanj v vseh 5 uredni\u0161tvih
  in lektorske slu\u017ebe R\u0160 na podro\u010dju radijskega in spletnega novinarstva
  na letni ravni zna\u0161a 4.320 \u20ac. Glede na vire Urada za mladino MOL, kjer
  konkurira vedno ve\u010d prijaviteljev in projektov, je sofinanciranje manj\u0161e
  kot je bilo v preteklem 3-letnem programskem obdobju.\\n\\nV sklopu projekta smo:\\n\\n-
  organizirali avdicije v vseh 5 uredni\u0161tvih in v lektorski slu\u017ebi R\u0160
  \u2013 november 2021 \u2013 na katere se je v novembru 2020 prijavilo preko 120
  kandidatov. Skupaj s kandidati, prijavljenimi na avdicije novembra 2020, je bilo
  v letu 2021  preko 100 mladih vklju\u010denih v programe novinarskega usposabljanja\\n\\n-
  (novembra  2020)  sprejeli 71  kandidatov  v  usposabljanje po  principu  mentorstev  v
  manj\u0161ih skupinah in u\u010denja ob delu, izmed katerih je bilo tekom leta 2021
  30 mladih sprejetih med redne sodelavce,\\n- izvedli preko 20 strokovnih predavanj
  na podro\u010dju \u0161ir\u0161ih medijskih in radijskih tem ter specifi\u010dnih
  podro\u010dnih uredni\u0161kih tematik.\\n- MOL-Urad za mladino / Usposabljanje
  Radia \u0160tudent za mlade na podro\u010dju spikerstva in tonske tehnike 2021 \u2013
  3-letno programsko sofinanciranje 2021-2023. Sofinanciranje za izvajanje rednih
  avdicij in usposabljanj v vseh obeh programskih slu\u017ebah R\u0160 na podro\u010dju
  \u0161pikerstva in tonske tehnike na letni ravni zna\u0161a 4.320 \u20ac. Glede
  na vire Urada za mladino MOL, kjer konkurira vedno ve\u010d prijaviteljev in projektov,
  je sofinanciranje manj\u0161e kot je bilo v pretklem programskem obdobju.\\n\\nV
  sklopu projekta smo:\\n\\n- organizirali avdicije v obeh programskih slu\u017ebah
  na katere se je prijavilo preko 120 kandidatov\\n- sprejeli 56 kandidatov v usposabljanje,
  izmed katerih so bili 4 mladi tekom 2021 sprejetih med redne sodelavce,\\n- izvedli
  preko 20 strokovnih predavanj na podro\u010dju \u0161ir\u0161ih medijskih in radijskih
  tem ter specifi\u010dnih tematik programskih slu\u017eb.\\n- MOL-Urad za mladino
  / Usposabljanje Radia  \u0160tudent za mlade video snemalce in upravljalce dru\u017eabnih
  omre\u017eij R\u0160  2020  \u2013  3-letno programsko sofinanciranje 2020 2022.
  Sofinanciranje za izvajanje rednih avdicij in usposabljanj Video slu\u017ebe R\u0160
  na podro\u010dju video produkcije in monta\u017ee ter vzpostavitev in strokovno
  delovanje uredni\u0161ke ekipe na podro\u010dju socialnih omre\u017eij na letni
  ravni zna\u0161a 3.840 \u20ac.\\n\\nV sklopu projekta smo v 2021:\\n\\n- izvedli
  avdicijo video slu\u017ebe (RTV\u0160), na katero se je prijavilo 35 kandidatov,\\n-
  sprejeli 24 kandidatov v uvajanje na podro\u010dju video produkcije, izmed katerih
  jih je bilo 5 sprejetih med redne sodelavce,\\n- izvedli usposabljanje za upravljalce
  dru\u017ebenih omre\u017eij, ki ga je uspe\u0161no zaklju\u010dilo 13 mladih kandidatov,
  kar je omogo\u010dilo vzpostavitev uredni\u0161ke ekipe socialnih omre\u017eij,\\n-
  izvedli 5 strokovnih predavanj na podro\u010dju video produkcije in upravljanja
  socialnih omre\u017eij ter omogo\u010dili strokovne te\u010daje za krovne urednike
  socialnih omre\u017eij.\\n- JSKD \u2013 Etni\u010dne manj\u0161ine 2021 \u2013 Oddaje
  afri\u0161ke skupnosti v angle\u0161kem jeziku Sunrise Africa - celoletni set priprave
  in predvajanja 10 oddaj afri\u0161ke skupnosti - za izvedbo celoletnega cikla oddaj
  smo prejeli sofinanciranje v vi\u0161ini 2.038 \u20ac.\\n- Ured za Hrvate izvan
  Hrvatske - podpora oddaji hrva\u0161ke skupnosti \u00bbMali grani\u010dni prijelaz\u00ab.
  V letu 2021 smo prejeli podporo v vi\u0161ini 1.993,93 \u20ac. V sklopu projekta
  smo pripravili in predvajali 20 oddaj hrva\u0161ke skupnosti.\\n\\n- Program ERASMUS+
  -  Demokracija v novicah \u2013 gre za projekt usposabljanj v obliki delavnic za
  mlade na razli\u010dnih podro\u010djih multi-medijske produkcije in prezentacije
  ter spremljanja demokrati\u010dnih in novinarskih standardov pri pripravi produkcij,
  pri \u010demer je krovni partner projekta in prijavitelj Zavod \u0160OLT. Za izvedbo
  ene dvodnevne delavnice s strani R\u0160 zadnjem \u010detrtletju 2021 smo prejeli
  sofinanciranje v vi\u0161ini 1.500 \u20ac.\\n- Google Emergency Journalism Fund
  / Podpora medijem v \u010dasu COVID-19 - 2020 Pridobljeno strukturno finan\u010dno
  podporo korporacije Google smo izkoristili za nakup nujno potrebne tehni\u010dne
  opreme. Celoten znesek podpore zna\u0161a 4.369,50 \u20ac, od tega je v letu 2021
  amortizirana oprema v skupni vrednosti 892,44 \u20ac, kolikor zna\u0161a tudi letni
  razmejeni prihodek.\\n\\nPosebni dose\u017eki in nagrade Radia \u0160tudent v letu
  2021:\\n\\n- med dose\u017eki uredni\u0161tva tudi v letu 2021 izpostavljamo nagrado
  \u010cuvaj/Watchdog Dru\u0161tva novinarjev Slovenije. Nagrado je prejela Univerzitetna
  redakcija  R\u0160 za novinarsko poro\u010danje o \u0161tudentskem organiziranju.\\n*
  med dose\u017eke  \u0161tejemo tudi zahvalo Radiu  \u0160tudent za ve\u010d  kot
  pol stoletno opravljanje civilno dru\u017ebenega in kulturno-izobra\u017eevalnega
  poslanstva, ki mu ga je podelil in vro\u010dil predsednik Republike Slovenije  Borut
  Pahor.\\n- med dose\u017eki uredni\u0161tva velja izpostaviti tudi nagrado Women
  On Women, ki jo podeljuje komisija Mesta \u017eensk, za radijsko oddajo lezbi\u010dne
