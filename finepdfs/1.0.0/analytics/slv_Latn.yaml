  Inc., New Jersey, 1986.\\n4. S. Ore\u0161ki, Procesne bilance \u2013 ra\u010dunalni\u0161ke
  vaje 1. del, Diagrami poteka, programiranje, priprava poro\u010dil, 2. popravljena
  in dopolnjena izdaja, Fakulteta za kemijo in kemijsko tehnologijo, Maribor, 2005.\\n5.
  P. Glavi\u010d, Mednarodni sistem merskih enot in znakov, 2. popravljena in dopolnjena
  izdaja, Fakulteta za kemijo in kemijsko tehnologijo, Maribor, 1997.\\n6. P. Glavi\u010d,
  Veli\u010dine in enote SI (Syst\u00e8me International), Fakulteta za kemijo in kemijsko
  tehnologijo, Maribor, 2001.\\n7. P. Glavi\u010d, Navodila za izdelavo diplomskega
  dela, Fakulteta za kemijo in kemijsko tehnologijo, Maribor, 2006.\"", "\"PRETEKLOST
  PRIHODNOST\\n\\nZA PRIHODNOST: LO\u010cEVANJE ODPADKOV\\n\\nKako z odpadki v gospodinjstvu?\\n\\nDRAGE
  OB\u010cANKE, SPO\u0160TOVANI OB\u010cANI!\\n\\nV rokah dr\u017eite knji\u017eico,
  ki vam bo pomagala la\u017eje za\u010deti na\u0161o novo pot pri ravnjanju z odpadki.
  Podro\u010dje odpadkov, njihovo zbiranje, lo\u010devanje, predelava, uni\u010devanje
  ostankov, zapiranje in sanacija deponij je silno pomembna tema dana\u0161njega sveta.
  Z njo se ubadajo mnoge vlade in armade strokovnjakov. Veliko dobrih praks v Evropi
  in svetu je \u017ee, tudi ponekod po Sloveniji. \u0160ir\u0161e obmo\u010dje Maribora,
  kamor sodimo tudi mi, ni ravno znano po ble\u0161\u010de\u010di urejenosti. Ni predelave,
  ni pravega lo\u010devanja, ni lastnega odlagali\u0161\u010da, tudi idej za prihodnost
  ni ravno veliko. Zato smo se sami lotili iskanja re\u0161itev.\\n\\nV pomo\u010d
  nam je Okoljsko raziskovalni zavod (ORZ), s sposobno ekipo strokovnjakov. Vodi ga
  ena najbolj znanih strokovnjakinj s tega podro\u010dja, doktorica Marinka Vovk.
  \u017de pred \u010dasom smo se skupaj lotili iskanja najbolj\u0161ih re\u0161itev.
  Postavili smo si nekaj osnovnih ciljev.\\n\\n- Odpadki ne smejo ostati smeti. Kajti
  smeti so takrat, ko niso uporabni za ni\u010d drugega kot za uni\u010denje ali polnjenje
  deponij.\\n- Odpadki morajo v najve\u010dji mo\u017eni meri postati surovina za
  ponovno predelavo.\\n- Zbiranje odpadkov moramo pribli\u017eati ljudem, priti po
  zbrane in lo\u010dene odpadke na doma\u010di prag.\\n- Ravnjanje z odpadki mora
  dolgoro\u010dno postati cenej\u0161e, \u017ee v prvi fazi ne sme prese\u010di \u017ee
  uveljavljenih cen.\\n\\nPo dolgotrajnih pogovorih, \u0161tudijah dobre prakse, analiz
  vsega, kar se z odpadki dogaja pri nas, smo se odlo\u010dili za sistem, ki je za
  na\u0161e okolje novost, sicer pa \u017ee preizku\u0161eno in uveljavljeno v Evropi
  in ponekod v Sloveniji. Izku\u0161nja je dobra, u\u010dinkovita, ljudje so zadovoljni.
  Preverili smo. Denimo v na\u0161i Roga\u0161ki Slatini. Vsi so zadovoljni. Ob\u010dani,
  ob\u010dina, izvajalci. Sistem smo poimenovali Rumena vre\u010dka po najbolj prepoznavni
  rumeni vre\u010di, v katero bomo zbirali vso embala\u017eo: papirnato, plasti\u010dno,
  kovinsko in sestavljeno (tetrapaki). Kako in kaj ter kam je vsebina te knji\u017eice.
  Svetujem, da jo dobro preberemo in shranimo. Prav nam bo pri\u0161la.\\n\\nSicer
  je to \u0161ele za\u010detek akcije. Na petih zborih ob\u010danov smo se ve\u010d
  kot deset ur pogovarjali, svetovali, pokazali, odgovorili na marsikatero vpra\u0161anje.
  \u0160e ve\u010d jih je ostalo odprtih. Zato se bomo pogovarjali tudi vnaprej. Odprli
  bomo tako imenovano svetovalno pisarno, na voljo bosta tudi brezpla\u010dna telefonska
  \u0161tevilka in elektronski naslov. Lahko boste telefonirali, obiskali na\u0161e
  strokovnjake ali po elektronski po\u0161ti dobili odgovore na svoja vpra\u0161anja.
  Obvestili vas bomo o dnevih in urah, ob katerih nas boste lahko obiskali, telefonirali,
  elektronsko komunicirali. Vsebino vre\u010dk bodo tudi pregledovali. Ne zato, da
  bi koga kaznovali, ampak zato, da bi svetovali, pojasnjevali, da bi se vsi skupaj
  \u010desa nau\u010dili. Za tiste, ki mislijo, da so gozd in obroblje cest odlagali\u0161\u010da
  odpadkov, je predvidena tudi kak\u0161na kazen.\\n\\nV akciji O\u010distimo Slovenijo
  je sodelovalo skoraj sedemsto ob\u010danov Miklav\u017ea, \u010destitke in zahvala
  vsem. Verjamem, da bomo z enako zavzetostjo in strpnostjo sodelovali tudi pri novem
  na\u010dinu ravnjanja z odpadki. Hvale\u017eni nam bodo na\u0161i otroci in vnuki.
  Zemlja rabi dvesto let da razgradi en sam preprost jogurtov lon\u010dek, \u010de
  ga zakopljemo, \u010ce ga lo\u010deno zberemo, pa ga je mo\u017eno predelati v novo
  surovino. Ne zakopljimo ga. Saj smo jih \u017ee doslej veliko in preve\u010d.\\n\\nLeo
  Krem\u017ear, \u017eupan\\n\\nZ vse bolj pestro ponudbo izdelkov na prodajnih policah
  se ve\u010da tudi pestrost, predvsem pa koli\u010dina zbranih komunalnih odpadkov.
  Vse ve\u010dje so zakonodajne zahteve ravnania z odpadki, pri uporabnikih storitev
  pa se porajajo \u0161tevilna vpra\u0161anja o tem, kako pravilno ravnati s posamezno
  vrsto odpadkov. Zato smo se v na\u0161i Ob\u010dini odlo\u010dili za posodobitev
  sistema ravnania z odpadki. Z novim sistemom bomo celovito poskrbeli za vse vrste
  odpadkov, predvsem pa je pomembno dejstvo, da bomo na\u0161e storitve \u0161e bolj
  pribli\u017eali vam, uporabniki in ob tem zmanj\u0161ali koli\u010dine odlo\u017eenih
  odpadkov.\\n\\nK manj\u0161i koli\u010dini komunalnih odpadkov lahko prispeva vsak
  posameznik s tem, da premisli in kupi le tisto, kar zares potrebuje, z izbiro potro\u0161ni\u0161kih
  dobirin brez oziroma z manj embala\u017ee in s ponovno uporabo. Za odpadke, ki vseeno
  nastanejo, poskrbimo s skrbnim lo\u010devanjem, tako bomo v najve\u010dji meri prispevali
  k \u010distemu okolju, ohranjanju virov in iz dru\u017ebe, ki odmetava, pre\u0161li
  v dru\u017ebo, ki reciklira.\\n\\n\u010ce je bilo neko\u010d dovolj, da smo tisto,
  \u010desar nismo ve\u010d potrebovali, enostavno vrgli v ko\u0161 za smeti, danes
  ni ve\u010d tako. Zaradi na\u010dina \u017eivljenja in nara\u0161\u010danja potro\u0161ni\u0161tva,
  se ustvarjajo vedno ve\u010dji kupi odpadkov. Izdelki za enkratno uporabo in nepotrebna
  embala\u017ea posledi\u010dno predstavljajo ogromne koli\u010dine odpadkov. Zato
  je \u010dedalje pomembnej\u0161e, da z odpadki ravnamo odgovorno in gospodarno.\\n\\nDr\u017eava
  je z zakoni predpisala tak\u0161no ravnanje z odpadki, ki bo omogo\u010dilo recikliranje
  in pridobivanje uporabnih surovin iz odpadnih snovi. Zgolj odlaganje na odlagali\u0161\u010de
  je preteklost, kajti naravni viri so omejeni, zato odpadki predstavljajo dragocene
  surovine.\\n\\nZA RECIKLIRANJE POTREBUJEMO SODOBNE OKOLJSKE TEHNOLOGIJE\\n\\nZ lo\u010denim
  zbiranjem odpadkov na izvoru prepre\u010dimo odlaganje potencialno koristnih odpadkov
  na odlagali\u0161\u010de. V vsakem gospodinjstvu nastajajo odpadki, ki jih je mogo\u010de
  s pravilnim ravnanjem ponovno uporabiti. Odpadki v tem primeru predstavljajo sekundarne
  surovine (se pravi surovine, s katerimi nadomestimo osnovne surovine kot so plastika,
  kovine, steklo, les, itd.), pri tem pa varujemo okolje in ohranjamamo naravne vire,
  saj pri recikliranju porabijo manj energije, vode in naravnih virov za nove izdelke.\\n\\nNara\u0161\u010danje
  koli\u010din odpadkov prispeva k temu, da obstoje\u010di sistemi ravnania z odpadki,
  zgrajeni na na\u010delu linearnosti, danes ne morejo ve\u010d slediti tej rasti.
  Zato je potrebna sprememba v na\u010dinu dojemanja odpadkov. Trajnostno ravnania
  z odpadki zahteva premik od upravljanja z odpadki (kako bomo ravnali z odpadki)
  k ohranjanju virov (kako bomo prepre\u010dili nastajanje odpadkov in ohranili naravne
  vire). Od linearega na\u010dina razmi\u0161ljanja moramo preiti h kro\u017enemu,
  cikli\u010dnemu: zapreti moramo snovni tok od proizvodnje surovin do odpadka tako,
  da se surovine vrnejo na za\u010detek proizvodnega kroga, \u0161e preden postanejo
  odpadek, namenjen na odlagali\u0161\u010de - z minimalnimi mo\u017enimi emisijami
  in s tem tudi najmanj\u0161o koli\u010dino negativnih u\u010dinkov na okolje. Zmanj\u0161anje
  uporabe novih naravnih virov, ki vstopajo v proizvodno verigo, je namre\u010d povezano
  s trajnim zmanj\u0161evanjem koli\u010din nastalih odpadkov. Vendar s tem ne prihranimo
  samo virov, marve\u010d tudi energije, potrebno za proizvodnjo surovin, njihov transport,
  predelavo in pripravo za proizvodnjo, kar direktno vpliva tudi na zmanj\u0161anje
  negativnih vplivov na okolje.\\n\\nODPADNA EMBALA\u017dA JE SUROVINA\\n\\nOdpadna
  embala\u017ea je lahko pomemben vir sekundarnih surovin, ker je praviloma izdelana
  iz kakovostnih materialov. \u010ce jo ustrezno predelamo v sekundarno surovino,
  lahko tako dobljeni material \u0161e enkrat uporabimo za razli\u010dne izdelke.\\n\\nIz
  plasti\u010dne embala\u017ee izdelujejo: ohi\u0161ja za svin\u010dnike, vzgljalnike,
  razli\u010dne cevi, vre\u010dke, cvetli\u010dne lon\u010dke, stikala, vetrovke,
  vrtne garniture (stole, mize).\\n\\nIz odpadnega papirja nastajajo razli\u010dni
  papirnatni izdelki: zvezki, knjige, u\u010dbeniki, \u010dasopisi, fascikli, ovitki
  knjig ...\\n\\nIz odpadlega stekla nastajajo novi stekleni predmeti vseh vrst.\\n\\nIz
  lesenih embala\u017e naredijo: sekance, vlaknenke, lesne brikete, ki se v gospodinjstvih
  uporabijo kot gorivo (biomasa) za ogrevanje.\\n\\nIz zbranih biolo\u0161kih odpadkov
  nastane kakovosten kompost.\\n\\nIz odpadnega jedilnega olja izdelajo biogoriva.\\n\\nIz
  tekstilnih odpadkov in starih obla\u010dil izdelujejo preje, polnila, izolacijo,
  \u010distilne krpe, tudi obla\u010dila.\\n\\nOdpadno elektroniko lo\u010dijo na
  posamezne komponente in odpelijo na reciklazo.\\n\\nSISTEM ZBIRANJA ODPADNE EMBALA\u017dE
  V RUMENO VRE\u010cO\\n\\nRumena vre\u010da je namenjena zbiranju odpadne embala\u017ee.
  Sistem je individualen (vsako gospodinjstvo dobi ve\u010d namenskih rumenih vre\u010d)
  in enostaven, saj v eno rumeno vre\u010do hkrati zbiramo odpadno embala\u017eo iz:\\n\\n-
  **PAPIRJA**: manj\u0161e \u0161katle, vre\u010dke iz papirja in ostali embala\u017eni
  papir\\n- **PLASTIKE**: PET plastenke pija\u010d, plastenke pra\u0161kov, \u010distil,
  kozmetike, jogutrovi lon\u010dki, vre\u010dke, folija, plasti\u010dne \u0161katle/ko\u0161arice
  \u017eivil\\n- **KOVIN**: plo\u010devinke, konzerve, kovinski pokrov\u010dki iz
  kozarcev za vlaganje, zama\u0161ki, kovinske posodice \u017eivil\\n- **SESTAVLJENIH
  MATERIALOV**: tetrapak embala\u017ea mleka, sokov, omak, vre\u010dk od \u010dipsa\\n\\n**Nasvet**\\n\\nEmbala\u017ee,
  ki jo odlagamo v rumeno vre\u010do ni potrebno prej oprati, dovolj je, da jo temeljito
  izpraznimo in stisnemo. ALUMINIJA\u0160TA PLO\u010cEVINKA JE 100% OBNOVLJIVA!\\n\\nKAKO
  POTEKA ODVOZ RUMENIH VRE\u010c?\\n\\nNapolnjene rumene vre\u010de bodo komunalni
  delavci pobirali od vrat do vrat, kar pomeni, da vre\u010de postavimo glede na urnik
  odvoza, na obi\u010dajno odjemno mesto. Odvoz rumenih vre\u010d in preostankov komunalnih
  odpadkov potekata po urniku odvoza, ki ga bodo gospodinjstva dobila za celo leto
  vnaprej.\\n\\nKAJ SE ZGODI Z RUMENIMI VRE\u010cAMI POTEM?\\n\\nRUMENE VRE\u010cE
  ZA ODVOZ\\n\\nVsebina rumenih vre\u010d se presortira v sortirnicah. Delo se opravi
  mehansko in strojno. Strojno se odstrani kovine (z magnetom), ro\u010dno pa se sortirajo
  frakcije plastike in papirja na podfrakcije. Tako pripravljena embala\u017ea se
  odda podjetjem za predelavo.\\n\\nSistem zbiranja odpadne embala\u017ee v rumeno
  vre\u010do omogo\u010da do 80% zmanj\u0161anje volumna me\u0161anih komunalnih odpadkov,
  kar omogo\u010da, da zmanj\u0161amo \u0161tevilo oz. pogostost odvozov me\u0161anih
  komunalnih odpadkov in s tem tudi koli\u010dino odpadkov, ki bi jih morali odlo\u017eiti
  na odlagali\u0161\u010du.\\n\\nPAPIR IN PAPIRNATA EMBALA\u017dA\\n\\nOdvoz papirja
  bo potekal 1x mese\u010dno. Priporo\u010dljivo je, da zberete papir lo\u010deno
  v kartonski \u0161katli. Po urniku izvajalca papir prilo\u017eite lo\u010deno v
  \u0161katli na odjemno mesto pred stanovanjskim objektom ali pa papir odpeljete
  v zbirni center.\\n\\n**Nasvet**\\nPri zbiranju papir in karton zlo\u017eimo, da
  pridobimo na prostoru.\\n\\n**Med papir odlagajte:**\\nve\u010djo kartonsko embala\u017eo,
  \u010dasopise, revije, zvezke, knjige, prospekte, kataloge, ovojni papir in papirnate
  nakupovalne vre\u010dke, pisarni\u0161ki papir.\\n\\n**Med papir ne sodi:**\\nkartonska
  embala\u017ea za teko\u010da \u017eivila (npr.: tetrapak od soka), embala\u017ea
  iz katere ne odstranimo vseh ostankov \u017eivil (npr.: papirnati pladnji in kozarci),
  celofan in povo\u0161\u010den papir, vre\u010de od cementa, lepila, papirnate brisa\u010de,
  rob\u010dki, tapete,...\\n\\nSTEKLO IN STEKLENA EMBALA\u017dA\\n\\nOdvoz stekla
  in steklene embala\u017ee bo 1x mese\u010dno. Priporo\u010dljivo je, da zberete
  steklo v kartonski \u0161katli ali v drugi primerni posodi. Po urniku izvajalca
  stekleno embala\u017eo prilo\u017eite lo\u010deno v namenski \u0161katli na odjemno
  mesto pri stanovanjskem objektu. Steklo lahko oddate tudi v zbirnem centru.\\n\\n**Med
  lo\u010deno zbrano steklo sodi:**\\nsteklenice od pija\u010de, \u017eivil, kozmetike,
  zdravil, kozarci od vlo\u017eenih \u017eivil, druga steklena embala\u017ea.\\n\\n**Med
  odpadno steklo ne sodijo:**\\nokenska in avtomobilska stekla, stekla svetil, ogledala,
  pleksi in karbonsko steklo, laboratorijsko steklo, keramika, kamenje,...\\n\\n**Nasvet**\\nStekleno
  embala\u017eo pred oddajo izpraznemo in o\u010distimo, zama\u0161ke od steklenic
  odstranimo.\\n\\nRAVNANJE Z BIOLO\u0160KO RAZGRADLJIVIMI ODPADKI\\nsprememba s 1.
  majom 2010\\n\\nS 1. januarjem 2010 se je iztekel tudi rok za uvajanje lo\u010denega
  zbiranja biolo\u0161kih odpadkov. Zato ste v mesecu marcu dobili iz strani izvajalca
  izjavo, na kateri ste ozna\u010dili ali boste imeli zabojnik za zbiranje biolo\u0161kih
  odpadkov ali lastni kompost.\\n\\nS 1. majom 2010 bomo za\u010deli z zbiranjem in
  odvozom biolo\u0161kih odpadkov. Tisti, ki imate mo\u017enost lastnega kompostiranja
  in ste na izjavi ozna\u010dili, da boste biolo\u0161ke odpadke sami kompostirali
  v svojih kompostnikih zabojnika za biolo\u0161ke odpadke ne boste dobili. V primeru,
  da naknadno ocenite, da zabojnik potrebujete, ga boste lahko dobili tudi kasneje.\\n\\nKaj
  lahko odlagamo v zabojnik za biolo\u0161ke odpadke ali na kompost?\\n\\n- odpadki,
  ki ostanejo pri pripravi hrane, olupki in ostanki sadja in zelenjave,\\n- kavna
  usedlina, kavni filtri in \u010dajne vre\u010dke,\\n- jaj\u010dne lupine,\\n- ostanek
  neuporabljene hrane in okvarjeni prehrambeni izdelki (brez embala\u017ee),\\n- zemlja
  iz cvetli\u010dnih lon\u010dkov in korit,\\n- odpadki z vrtov in okolice hi\u0161e,
  kot so ro\u017ee, listje, trava, plevel, \u017eagovina, odmrle rastline, odpadki,
  ki nastanejo pri obrezovanju dreves in oblikovanju \u017eivih mej.\\n\\nKaj ne sodi
  v rjavi zabojnik?\\n\\n- plasti\u010dne vre\u010dke,\\n- meso in mesni izdelki,\\n-
  iztrebki malih \u017eivali,\\n- kosti, pepel\\n- sanitetni material, plenice,\\n-
  kamenje,\\n- olja in ma\u0161\u010dobe,\\n- nerazgradljivi materiali.\\n\\nKako
  ravnamo z biolo\u0161ko razgradljivimi odpadki?\\nNa vrtu ali zelenici postavimo
  kompostnik in tako sami poskrbimo za svoje biolo\u0161ke odpadke. S pravilnim ravnanjem
  z biolo\u0161kimi odpadki pripomoremo k zmanj\u0161anju toplogrednih plinov.\\n\\nPrakti\u010dni
  nasveti za kompostiranje:\\nKompostnik postavimo na polsen\u010den del vrta, za\u0161\u010diten
  pred vetrom. Postavimo ga direktno na zemljo in ga ne podlagamo z betonom ali drugim
  materialom, saj je pomembno, da mikroorganizmi neovirano prehajajo iz tal v kompost.\\n\\nNa
  kompostni kup lahko odlagamo enake odpadke, kot jih sprejema rjavi zabojnik. Na
  dno nalo\u017eimo grobi material (tanj\u0161e veje), kar zagotavlja zra\u010denje.
  Nadaljujemo z oblikovanjem kupa iz organskega materiala. Med posamezne plasti je
  priporo\u010dljivo dodajati hlevski gnoj in ostanke starega komposta. Proces kompostiranja
  oz. razgradnje organskih snovi se bo pri\u010del spontano. Ob\u010dasno poskrbimo
  za zra\u010denje tako, da kup obrnemo in poskrbimo za primerno vlogo. Leseni ali
  plasti\u010den kompostnik lahko kupimo v specializirani trgovini ali pa ga izdelamo
  sami. Kompost je zrel (primeren za uporabo) po pribli\u017eno 6 mesecih. Material
  mora biti temno rjave barve in di\u0161ati po gozdni prsti.\\n\\nKOMPOSTIRANJE NA
  LASTNEM VRTU je zelo dobra odlo\u010ditev, saj na ta na\u010din:\\n- vra\u010damo
  hranljive snovi v zemljo\\n- pridelamo odli\u010dno organsko gnojilo (humus ali
  kompost)\\n- ni potrebno kupovati umetnih ali organskih gnojil\\n- izbolj\u0161amo
  sposobnost zadr\u017eevanja vlage in strukturo zemlje\\n- poskrbimo za ni\u017eji
  znesek na polo\u017enici s stro\u0161ki ravnanja z odpadki\\n- da zmanj\u0161anja
  izpustov toplogrednih plinov niti ne omenjamo.\\n\\nPOSPE\u0160ENO KOMPOSTIRANJE
  BREZ NEPRIJETNEGA VONJA\\nZ UPORABO EM BIOLO\u0160KEGA KOMPOSTNIKA\\n\\nMo\u017eno
  je pospe\u0161eno kompostiranje biolo\u0161ko razgradljivih odpadkov, ki dnevno
  nastajajo v va\u0161i kuhinji. Biolo\u0161ke odpadke lahko na enostaven na\u010din
  predelate v koristno gnojilo brez neprijetnih vonjav in ostalih nev\u0161e\u010dnosti.\\n\\nPotrebujete
  le:\\n- EM biolo\u0161ki kompostnik\\n- Bokashi (pripravek iz organskega materiala
  (\u017eitnih otrobov, koruzne moke, pirinih plev, nasekljane slame) in efektivnih
  mikroorganizmov). Ve\u010d informacij si lahko preberete na spletni strani www.em-tehnologija.com\\n\\nOpis
  postopka:\\nNa dno EM biolo\u0161kega kompostnika nasujemo toliko Bokashija, da
  je dno pokrito. Nadaljujemo z biolo\u0161kimi odpadki, ki nastanejo tekom dneva.
  Zve\u010der odpadke potla\u010dimo, da iztisnemo odve\u010dni zrak in potrosimo
  z Bokashijem. Nadaljujemo vsak dan, dokler posoda ni polna. Ob\u010dasno iz pipice
  na spodnjem delu posode odlijemo teko\u010dino, ki jo uporabimo za zalivanje ro\u017e,
  zelenice, vrta (razred\u010deno z vodo v razmerju 1 : 100)\\n\\nEfektivni mikroorganizmi
  poskrbijo, da biolo\u0161ki odpadki fermentirajo, torej ni neprijetnih vonjav, kot
  smo jih vajeni, \u010de biolo\u0161ki odpadki gnijejo. Fermentirane biolo\u0161ke
  odpadke (ki ohranijo svojo obliko in barvo) lahko takoj uporabimo na vrtu, kjer
  se potem v zemlji hitro razkrojijo. U\u010dinki odli\u010dnega gnojila bodo opazni
  v kratkem \u010dasu. Ve\u010d o tem postopku kompostiranja si lahko preberete na
  \u017ee prej omenjeni spletni strani.\\n\\nNasvet\\nProces kompostiranja na kompostniku
  bo pravilno, zato moramo poskrbeti za zadostno zra\u010denje in vlogo. Kompostnik
  ne sme biti premo\u010den z vodo in tudi ne presuh. Kompost je potrebno vsake toliko
  \u010dasa preme\u0161ati, razrahljati in prezra\u010diti.\\n\\n\u010ce te mo\u017enosti
  nimamo, je na voljo:\\n- lo\u010deno zbiranje v namenske rjave zabojnike.\\n\\nLo\u010devanje
  biolo\u0161kih odpadkov je obvezno, saj pome\u0161ani med me\u0161animi komunalnimi
  odpadki povzro\u010dajo nastajanje toplogrednih plinov med razkrajanjem na odlagali\u0161\u010du.
  Biolo\u0161ke odpadke je torej prepovedano odlagati med me\u0161ane komunalne odpadke
  oz. med preostanek odpadkov.\\n\\nNasvet\\nBiolo\u0161ke odpadke NE odlagajte v
  rjave zabojnike v NAVADNIH PLASTI\u010cNIH VRE\u010cKAH. \u010ce \u017ee uporabljate
  vre\u010dko, izberite razgradijivo namensko vre\u010dko iz papirja ali iz \u0161kroba.
  Lahko pa jih tudi zavijete v navaden \u010dasopisni papir.\\n\\nZabojnike za biolo\u0161ke
  odpadke bomo v \u010dasu poletnih mesecih praznili enkrat tedensko, v ostalih mesecih
  pa vsakih 14 dni po prilo\u017eenem urniku. Izvajalec bo 1-2 x letno zabojnike za
  biolo\u0161ke odpadke tudi o\u010distil.\\n\\nVSE MANJ ME\u0160ANIH KOMUNALNIH ODPADKOV\\n\\nSedanj\u00ed
  sistem zbiranja odpadkov\\n\\nvsi odpadki pome\u0161ani\\nv 120 l zabojniku\\n\\n60
  % embala\u017ee\\n25 % biolo\u0161kih\\n15 % ostali odpadki\\n\\nNovi sistem izvornega
  lo\u010denega zbiranja odpadkov\\n\\n60 % embala\u017ee\\nrumena vre\u010da\\n25
  % biolo\u0161kih\\n120 l zabojnik ali lastni kompost\\n15 % ostali odpadki\\n120
  l zabojnik\\n\\nRAVNANJE S KOSOVNIMI ODPADKI\\n\\nOdvoz kosovnih odpadkov bo od
  leta 2011 potekal od vrat do vrat po sistemu dopisnice. Vsako gospodinjstvo bo prejelo
  dopisnico na podlagi katere se boste sami odlo\u010dili za vam ustrezen termin odvoza
  kosovnih odpadkov. Ko boste \u017eeleli odvoz kosovnih odpadkov, boste poklicali
  na dopisnici navedeno telefonsko \u0161tevilko in se dogovorili za termin odvoza.
  Na dogovorjeni dan odvoza boste postavili kosovne odpadke na va\u0161e odjemno mesto
  do 6. ure zjutraj. V letu 2010 bo akcija izpeljana kot doslej.\\n\\nKaj sodi med
  kosovne odpadke?\\n\\nODDALI BOSTE LAHKO NASLEDNJE SKUPINE ODPADKOV\\n\\nda\\n-
  kosi pohi\u0161tva\\n- sanitarni elementi\\n- elektri\u010dna in elektronska oprema
  (hladiilniki, zamrzovalniki, klimatske naprave za uporabo v gospodinjstvih, osebni
  ra\u010dunalniki, TV in radijski sprejemniki ter druga zabavna elektronika)\\n-
  vzmetnice\\n- \u0161tedilniki\\n\\nne\\n- nevarni odpadki\\n- odslu\u017eeni avtomobili\\n-
  avtomobilske gume\\n- me\u0161ani komunalni odpadki\\n- biolo\u0161ko razgradljivi
  odpadki\\n- gradbeni odpadki\\n- kmetijski stroji\\n- papir\\n- steklo\\n\\nTovrstne
  odpadke lahko v \u010dasu obratovanja pripeljete v Zbirni center Miklav\u017e na
  Dravskem polju.\\n\\nNasvet\\nOb nakupu elektri\u010dne in elektronske opreme od
  trgovca zahtevajte, da ob dostavi novega aparata starega brezpla\u010dno odpeljejo.
  To obveznost trgovcem nalaga Uredba o shemi za elektri\u010dno in elektronsko opremo.\\n\\nZBIRNI
  CENTER MIKLAV\u017d NA DRAVSKEM POLJU\\n\\nOd avgusta 2008 ima ob\u010dina Miklav\u017e
  sodobni zbirni center namenjen zbiranju lo\u010denih frakcij odpadkov. V Zbirni
  center Miklav\u017e na Dravskem polju, ki se nahaja na desni stani ceste na relaciji
  Maribor \u2013 Ptuj, lahko ob\u010dani Ob\u010dine Miklav\u017e na Dravskem polju
  pripeljejo odpadke brezpla\u010dno.\\n\\nZbirni center je odprt:\\nob torkih in
  \u010detrtkih med 15. in 19. uro,\\nob sobotah med 9. in 17. uro.\\nKontakt: 041
  650 925\\n\\nZbirni center sestavljajo naslednji sklopi:\\n\\n- **recep\u010dija**
  (vratarnica); v izvedbi tipskega kontejnerja s sanitarijami, pokritega z nadstre\u0161nico,\\n-
  **kesoni** (10 m\u00b3) za ve\u010dje kose nenevarnih odpadkov,\\n- **1100-litrske
  posode** za manj\u0161e koli\u010dine nenevarnih odpadkov,\\n- prostor za zbiranje
  nevarnih odpadkov iz gospodinjstev,\\n- prostor za zelen obrez.\\n\\nZbirni center
  sprejema naslednje vrste odpadkov:\\n\\n**Nenevarni odpadki**\\n\\nV kesonih se
  zbira odpadni material:\\n\\n- papir, karton in lepenka vseh vrst in velikosti,
  vklju\u010dno z odpadno embala\u017eo iz lepenke in kartona,\\n- plastika (folije
  in gajbice, brez PET-plastenk),\\n\\n- odpadki iz kovin,\\n- les, vklju\u010dno
  z odpadno embala\u017eo iz lesa,\\n- izrabljene avtomobilske gume,\\n- gradbeni
  material,\\n- bela tehnika (\u0161tedilniki, pralni in pomivalni stroji ipd.),\\n-
  hladilno-zamrzovalni aparati (hladilniki, klimatske naprave ipd.),\\n- ostali me\u0161ani
  kosovni odpadki (oblazinjeno pohi\u0161tvo, vzmetnice ipd.)\\n- ter zeleni obrez.\\n\\n1100-litrske
  posode ob dovozni poti so namenjene zbiranju:\\n- \u010dasopisnega papirja in revij,\\n-
  PET-plastenk (npr. plastenke pija\u010d),\\n- steklene embala\u017ee,\\n- obla\u010dila
  in tekstil,\\n- elektri\u010dnih kablov.\\n\\nNevarni odpadki iz gospodinjstev se
  zbirajo v namenskem kontejnerju, kot\\n- akumulatorji in baterije,\\n- barve, \u010drnila
  in lahki v njihovi embala\u017ei,\\n- olja in ma\u0161\u010dobe, ki niso jedilna,\\n-
  flouroscentne cevi do dol\u017eine 1,6m,\\n- lepila, topila in smole,\\n- zdravila,\\n-
  pesticidi in insekticidi v njihovi embala\u017ei,\\n- kozmetika, detergenti,\\n-
  kisline, alkalije in fotokemikalije.\\n\\nV prostoru za nevarne odpadke se zbirajo
  tudi ra\u010dunalni\u0161ki monitorji in TV-ekrani. Ostala elektronika se zbira
  v posebej za te odpadke namenjenem zbiralniku. Lo\u010deno se zbira odpadna salonitna
  kritina in salonitne cevi.\\n\\nRAVNANJE Z NEVARNIMI ODPADKI\\n\\nNevarne odpadke
  zbiramo enkrat letno s posebej prirejeno pomicno zbiralnico po v naprej dolo\u010denem
  urniku. Nevarne odpadke zbiramo lo\u010deno po posameznih skupinah, zato jih je
  potrebno lo\u010devati \u017ee v gospodinjstvih in jih hraniti do zbiralne akcije.
  Lahko pa jih sami pripeljete v zbirni center.\\n\\nV \u010dasu akcije zbiranja nevarnih
  odpadkov lahko oddate:\\n\\n- topila, kisline, baze,\\n- fotokemikalije,\\n- baterije
  in akumulatorje,\\n- odpadke, ki vsebujejo \u017eivo srebro in druge te\u017eke
  kovine\\n- lepila in smole\\n- barve, \u010drnila,\\n- detergente, ki vsebujejo
  nevarne snovi,\\n- sredstva za varstvo rastlin,\\n- zdravila,\\n- tiskalnike,\\n-
  les, ki vsebuje nevarne snovi,\\n- embala\u017eo, ki vsebuje ostanke nevarnih snovi
  ali je z njimi onesna\u017eena.\\n\\nZ nevarnimi snovmi ravnavajte previdno, dosledno
  upo\u0161tevajte proizvajal\u010deva navodila za uporabo, morebitne ostanke in embala\u017eo
  nevarnih snovi oddajte v akciji zbiranja nevarnih odpadkov ali v zbirnem centru.\\n\\nPri
  ravnjanju z nevarnimi snovmi in odpadki bodite \u0161e posebej pozorni na oznake
  za nevarnost, ki so predstavljene v tabeli na naslednji strani.\\n\\n## OZNAKE NEVARNIH
  SNOVI\\n\\n### LAHKO VNETLJIVO\\n**F (Highly Flammable)**\\nSnovi, ki se lahko vnamejo
  \u017ee po kraj\u0161em stiku z virom vziga, v stiku z zrakom, \u010de so izpostavljene
  segrevanju ali vi\u0161jem tlaku.\\nTake snovi so: bencin, etanol, aceton, kovine
  v prahu.\\n\\n### ZELO LAHKO VNETLJIVO\\n**F+ (Extremely Flammable)**\\nSo lahke
  teko\u010dine, ki imajo zelo nizko plameni\u0161\u010de (temperatura, pri kateri
  za\u010dne snov goreti) in nizko vreli\u0161\u010de. So tudi plini, ki se na zraku
  vnamejo \u017ee pri sobni temperaturi (20 \u00b0C) in obi\u010dajnem tlaku (1 bar).\\nTake
  snovi so: kloroetan, dietileter, vodikov sulfid.\\n\\n### STRUPENO\\n**T (Toxic)**\\nSnovi,
  ki povzro\u010dajo hude okvare zdravja (npr. rak, dedne genske okvare, oslabitev
  plodnosti) ali celo smrt, \u010de jih zau\u017eijemo, vdihavamo oz. \u010de pridejo
  v stik z na\u0161o ko\u017eo.\\nTake snovi so: klor, metanol, nekatere spojine te\u017ekih
  kovin (npr. svinca), benzen.\\n\\n### ZELO STRUPENO\\n**T+ (Very Toxic)**\\nSnovi,
  ki \u017ee v majhnih koli\u010dinah povzro\u010dajo hude okvare zdravja (npr. rak,
  dedne genske okvare, oslabitev plodnosti) ali celo smrt, \u010de jih zau\u017eijemo,
  vdihavamo oz. \u010de pridejo v stik z na\u0161o ko\u017eo.\\nTake snovi so: ogljikov
  monoksid, brom, vodikov sulfid, nekatere arzenove spojine, nikotin.\\n\\n### ZDRAVJU
  \u0160KODLJIVO\\n**Xn (Nocif, Harmful)**\\nSnovi, lahko povzro\u010dijo takoj\u0161nje
  okvare zdravja pri zau\u017eitju, vdihavanju ali ob stiku s ko\u017eo. Lahko imajo
  tudi dolgoro\u010dne vplive in povzro\u010dijo okvare, ki jih ne opazimo takoj,
  tudi rakava obolenja, dedne genske okvare ali zmanj\u0161anje plodnosti.\\nTake
  snovi so: heksan, triklorometan (kloroform), modra galica, nikelj.\\n\\n### DRA\u017dILNO\\n**Xi
  (Irritant)**\\nSnovi, ki povzro\u010dajo dra\u017eenje ko\u017ee, o\u010di in dihal.
  V dolo\u010denih primerih povzro\u010dijo tudi hude po\u0161kodbe o\u010di.\\nTake
  snovi so: nekatera \u010distilna sredstva, natrijev karbonat (o\u010di), kalcijev
  klorid (o\u010di), heksan (ko\u017ea).\\n\\n### JEDKO\\n**C (Corrosive)**\\nSnovi,
  ki lahko po\u0161kodujejo ali celo uni\u010dijo \u017eivo tkivo (npr. ko\u017eo)
  in nekatere materiale (npr. blago), s katerim pridejo v stik.\\nTako ozna\u010dene
  snovi lahko povzro\u010dijo ko\u017ene opekline.\\nTake snovi so: koncentrirane
  kisline in baze, brom, srebrov nitrat, fenol.\\n\\n### OKOLJU NEVARNO\\n**N (Dangerous
  For The Environment)**\\nSnovi, ki lahko povzro\u010dijo takoj\u0161njo ali pa dolgoro\u010dno
  \u0161kodo okolju (voda, tla, zrak) in organizmom, ki \u017eive v teh okoljih (npr.
  \u010debele, pti\u010di, ribe).\\nTake snovi so: nekateri biocidi in spojine te\u017ekih
  kovin (npr. svinca), klor, vodikov sulfid, modra galica.\\n\\n### EKSPLOZIVNO\\n**E
  (Explosive)**\\nSnovi, ki lahko ob dolo\u010denih pogojih (ob udarcu, stiskanju,
  trenju, povi\u0161ani temperaturi) eksplodirajo (se v hipu kemijsko spremenijo).\\nTake
  snovi so: smodnik, nitroglicerin, TNT.\\n\\n### OKSIDATIVNO\\n**O (Oxidizing)**\\nSnovi,
  ki zaradi razli\u010dnih vplivov oddajajo kisik in lahko burno reagirajo ob stiku
  z drugimi, zlasti vnetljivimi materiali kar lahko privede do po\u017eara.\\nTake
  snovi so: vodikov peroksid (s koncentracijo vi\u0161jo od 20 %), kalijev manganat(VII),
  amonijev nitrat.\\n\\nPONOVNA UPORABA\\n\\nSte se vpra\u0161ali, kam s predmeti,
  ki jih ne potrebujete ve\u010d, a so \u0161e uporabni?\\n\\nIzdelke in predmete,
  ki niso po\u0161kodovani pripeljite v zbirni center Miklav\u017e na Dravskem polju,
  ki bo sodeloval s Centrom ponovne uporabe v Roga\u0161ki Slatini. Ponovna uporaba
  ima prednost pred recikliranjem, saj odpadek z obnovo in popravlilom ter o\u010di\u0161\u010denjem
  \u00bbdobi novo \u017eivljenje\u00ab.\\n\\nLo\u010dujmo odpadke in jih ne odmetavajmo
  v naravo. Ekolo\u0161kih otokov, kjer so do sedaj bili zabojniki za papir, plastiko
  in steklo ne bo ve\u010d. Prepri\u010dani smo, da boste vsaj del odgovorov na va\u0161a
  vpra\u0161anja v zvezi z lo\u010devanjem odpadkov na\u0161li v tej bro\u0161uri.
  \u010ce \u017eelite ve\u010d informacij, se obrnite na svetovalno pisarno organizirano
  v sklopu ob\u010dinske uprave. Kontaktna brezpla\u010dna \u0161tevilka: 080 63 70\\n\\nNa\u0161
  modri planet je najbolj \u010dudovito mo\u017eno naravno okolje. njegovo \u017eivljenje
  je na\u0161e \u017eivljenje, njegova prihodnost je na\u0161a prihodnost.\\n\\nDALAJ
  LAMA\\n\\nRecikliranje je pridobivanje surovin iz \u017ee uporabljenih, odpadnih
  snovi v proizvodnem procesu. Predpogoj za recikliranje odpadkov je njihovo lo\u010deno
  zbiranje.\\n\\nV tabeli poi\u0161\u010dite odpadke, ki nastajajo v va\u0161em gospodinjstvu
  in preverite, ali pravilno ravnate z njimi:\\n\\n| Odpadek                  | Priprava                                                                 |
  Kam odlo\u017eiti?          |\\n|--------------------------|--------------------------------------------------------------------------|------------------------|\\n|
  PAPIR, \u010cASOPIS, REVIJE, OGLASNI MATERIAL | Brez priprave                                                            |
  1 x mese\u010dno ali v zbirni center |\\n| KARTON                   | Zlo\u017eite
  ga, da zavzame manj prostora                                      | 1 x mese\u010dno
