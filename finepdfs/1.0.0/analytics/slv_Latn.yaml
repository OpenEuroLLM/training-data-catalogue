  2030 ............................................................. 53\\n\\n1 Priprava
  razvojnega dokumenta\\n\\nVelika soodvisnost prenove razvrednotenih obmo\u010dij
  in celostnega razvoja ob\u010dine\\nOb\u010dina Tr\u017ei\u010d je v letih 2020
  - 2021 sodelovala kot pilotno obmo\u010dje v projektu trAILS\u00b9 (Preobraza alpskih
  industrijskih obmo\u010dij), ki ga je skupaj s partnerji iz drugih alpskih dr\u017eav
  izvaja razvojna agencija BSC Kranj, sofinanciral pa program INTERREG Alpski prostor.
  V prvih letih so bila izdelana razli\u010dna vrednotenja stanja prostora, okolja,
  narave in krajine ter socio-gospodarske dinamike razvrednotenih industrijskih obmo\u010dij
  Alp, med njimi tudi \u0161ir\u0161e obmo\u010dje Bomba\u017ene predilnice in tkalnice
  Tr\u017ei\u010d (BPT). Na podlagi enotne metodologije so bili izpostavljeni potenciali
  in mo\u017eni scenariji preobrazbe.\u00b2 Ena klju\u010dnih ugotovitev predhodnih
  faz je mo\u010dna vpetost in soodvisnost preobrazbe razvrednotenih industrijskih
  obmo\u010dij Tr\u017ei\u010da od razvoja vplivnega obmo\u010dja, tako bli\u017enjega
  starega mestnega jedra kakor tudi naravnega pode\u017eelskega zaledja celotne ob\u010dine.
  Velja pa tudi obratno, razvoj celotne ob\u010dine Tr\u017ei\u010d je tesno povezan
  z uspe\u0161nostjo in vsebino prenove obmo\u010dja BPT-Peko.\\n\\nEkonomsko-socialni
  profil razvoja industrijskih in degradiranih obmo\u010dij \u2013 podlaga novemu
  razvojnemu premisleku ob\u010dine Tr\u017ei\u010d 2030\\nLeta 2020 se je iztekla
  dosedanja Strategija razvojna ob\u010dine Tr\u017ei\u010d 2008 \u2013 2020,\u00b3
  zato ugotovitve in izhodi\u0161\u010da projekta trAILS, nove okoli\u0161\u010dine,
  povezane z epidemijo covid-19, podnebnimi spremembami, digitalizacijo in spremenjenimi
  \u017eivljenjskimi vzorci terjajo premislek o smereh in prioritetah razvoja ob\u010dine
  v naslednjem desetletju. So\u010dasno nastajajo nove usmeritve finan\u010dne perspektive
  Evropske unije (EU) 2021-2027 in posebni programi za okrevanje in odpornost EU in
  Slovenije po pandemiji Covid-19.\\n\\nKot ugotavljajo analiti\u010dne podlage projekta
  trAILS, se je ob\u010dina Tr\u017ei\u010d v zadnjem desetletju \u0161e soo\u010dala
  s posledicami gospodarske preobrazbe nekdaj monostrukturnega industrijskega obmo\u010dja:
  stagnacijo delovnih mest, visoko dnevno delovno migracijo izven ob\u010dine, demografskim
  upadom in staranjem prebivalstva. Po drugi strani pa obmo\u010dje bele\u017ei pozitivne
  premike, ki se ka\u017eejo skozi o\u017eivljanje opu\u0161\u010denih industrijskih
  obmo\u010dij, napredek podjetni\u0161tva in izkoris\u010danje prilo\u017enosti v
  turizmu, potenciala lokacije in naravnega zaledja.\\n\\nCelostni in trajnostni model
  razvoja TR\u017dI\u010c 2030 upo\u0161teva 5 priporo\u010dil projekta trAILS\\n-
  PRIPORO\u010cILO 1: razvoj naj temelji na lokalnih danostih, strategiji izrabe gospodarskih
  prilo\u017enosti ter pametni rabi ekolo\u0161kih, kulturno dedi\u0161\u010dinskih
  in inovacijskih potencialov posameznikov in skupnosti;\\n- PRIPORO\u010cILO 2: trajnostni
  razvoj naj predstavlja temeljni strate\u0161ki model, saj je ob\u010dina Tr\u017ei\u010d
  kot del alpske regije z dobro ohranj\u0435\u043d\u0438m naravnim okoljem lahko primer
  preobrazbe z vzdr\u017eno rabo naravnih virov;\\n- PRIPORO\u010cILO 3: razvrednotena
  obmo\u010dja so prilo\u017enosti za trajnosten prostorski in okoljski razvoj ob\u010dine
  Tr\u017ei\u010d, zato naj se spodbuja prenova in ponovna raba namesto poseganja
  na zelene povr\u0161ine;\\n- PRIPORO\u010cILO 4: krepite je treba ozave\u0161\u010denost
  prebivalcev o prednostih in prilo\u017enostih, ki jih nudi obmo\u010dje ob\u010dine
  za ve\u010djo kakovost \u017eivljenja vseh;\\n- PRIPORO\u010cILO 5: ustvarja naj
  se pogoje in prilo\u017enosti za podjetni\u0161tvo, saj so mala in srednje velika
  podjetja (MSP) klju\u010d za zagotavljanje vzdr\u017enej\u0161ih delovnih mest in
  dolgoro\u010dno, na zunanjih vplive, bolj odpornega lokalnega gospodarstva.\u2074\\n\\n\u00b9
  https://www.alpine-space.eu/projects/trails/en/home\\n\u00b2 \u017dIVO TR\u017dI\u010c,
  Rezultati vrednotenj, izvedenih v okviru delovnega paketa T2, Univerza v Ljubljani,
  SC Kranj, Univerza in Veroni, Tehni\u0161ka univerza Dunaj, Politehni\u0161ka univerza
  Milano, Tehni\u0161ka univerza Muenchen, uredniki Toma\u017e Pipan, Manca Kro\u0161elj,
  Univerza v Ljubljani, 2020.\\n\u00b3 https://www.trzic.si/projekti/strategija-razvoja.html\\n\u2074
  \u017dIVO TR\u017dI\u010c, Rezultati vrednotenj, izvedenih v okviru delovnega paketa
  T2, Univerza v Ljubljani, SC Kranj, Univerza in Veroni, Tehni\u0161ka univerza Dunaj,
  Politehni\u0161ka univerza Milano, Tehni\u0161ka univerza Muenchen, uredniki Toma\u017e
  Pipan, Manca Kro\u0161elj, Univerza v Ljubljani, 2020, str. 4.\\n\\nZasnova strate\u0161kega
  modela razvoja Ob\u010dine Tr\u017ei\u010d\\\\textsuperscript{5} 2030 poleg navedenega
  sledi tudi usmeritvam Regionalnega razvojnega programa Gorenjske 2021\u20132027,\\\\textsuperscript{6}
  Trajnostnega energetsko-podnebnega na\u010drta Gorenjske\\\\textsuperscript{7} kakor
  tudi Strategije razvoja Slovenije 2030, nove regionalne in kohezijske politike Evropske
  unije do leta 2027.\\\\textsuperscript{8} Na\u010drta za okrevanje in odpornost
  ter smiselno upo\u0161teva ambicije podnebne nevtralnosti EU do leta 2050 in cilje
  trajnostnega razvoja OZN.\\n\\n**Kako smo pri\u0161li od ekonomsko\u2013socialnega
  profila razvrednotenih obmo\u010dij do celostne strategije razvoja ob\u010dine?**\\n\\nMetodologija
  priprave razvojnih programov ob\u010din v Sloveniji ni predpisana, zato dokument
  smiselno povzema pristope strate\u0161kega na\u010drtovanja na dr\u017eavni in regionalni
  ravni, opisana analiti\u010dna izhodi\u0161\u010da, usmeritve in dobre prakse projekta
  trAILS iz drugih alpskih obmo\u010dij.\\n\\nV procesu priprave smo upo\u0161tevali
  na\u010dela razvojnega na\u010drtovanja,\\\\textsuperscript{9} v dokument pa smiselno
  vklju\u010dili vse bistvene elemente,\\\\textsuperscript{10} ki jih sicer za dr\u017eavne
  razvojne dokumente predpisuje Uredba o dokumentih razvojnega na\u010drtovanja in
  postopkih za pripravo predloga dr\u017eavnega prora\u010duna (Ur. l. RS, \u0161t.
  54/10 in 35/18). Pri zasnovi razvojnega na\u010drta izhajamo tudi iz obstoje\u010dih
  sektorskih programov ob\u010dine ter veljavnega ob\u010dinskega prostorskega na\u010drta.\\\\textsuperscript{11}\\n\\nProces
  nastajanja razvojnega na\u010drta je vodila ekipa zunanjih strokovnjakov s tesnim
  vklju\u010devanjem javnosti in najpomembnej\u0161ih dele\u017enikov. Spomladi 2021
  je bila izvedena anketa o razvojnih potrebah in pogledih ob\u010danov, v kateri
  je svoje mnenje oddalo 457 oz. 3 % prebivalcev ob\u010dine. V okviru mo\u017enosti,
  ki so jih dopu\u0161\u010dali ukrepi epidemije, so sledile delavnice po fokusnih
  podro\u010djih: i) strate\u0161ki koncept razvoja, ii) vklju\u010dujo\u010da in
  napredna skupnost, iii) urbane sinergije BPT/PEKO-mestno jedro, iv) nova mobilnost
  ob\u010danov in obiskovalcev ter v) kmetijstvo, gozdarstvo in lokalna pridelava
  hrane. V nadaljevanju so zunanj\u00ed sodelavci opravili posvetovanja s strokovnimi
  slu\u017ebami ob\u010dine in vodstvi ob\u010dinskih javnih zavodov z namenom preveritve
  strate\u0161kih zasnov in projektov.\\n\\n**Namen in obdobje veljavnosti**\\n\\nNamen
  razvojnega na\u010drta je s prebivalci, glavnimi dele\u017eniki in organi ob\u010dine
  opredeliti in dogovoriti smer nadaljnjega razvoja in preobrazbe ob\u010dine Tr\u017ei\u010d,
  dolo\u010diti skupne cilje in strate\u0161ke projekte ob\u010dine Tr\u017ei\u010d
  do leta 2030. Razvojni na\u010drt ob\u010danom, podjetjem in investitorjem sporo\u010da
  razvojne ambicije ob\u010dine, vodstvu Ob\u010dine Tr\u017ei\u010d, ob\u010dinski
  upravi, ob\u010dinskim zavodom in izvajalcem javnih slu\u017eb pa slu\u017ei kot
  vodilo pri delovanju. Razvojne usmeritve so podlaga za prihodnje na\u010drtovanje
  prora\u010duna ter urejanje prostora in drugih delovnih podro\u010dij v pristojnosti
  ob\u010dine.\\n\\n\\\\textsuperscript{5} Kadar govorimo o ob\u010dini kot instituciji,
  uporabljamo veliko za\u010detnico, v primerih, ko navajamo njeno geografsko obmo\u010dje,
