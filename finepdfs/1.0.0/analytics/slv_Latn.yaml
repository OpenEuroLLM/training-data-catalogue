  bodo prejeli re\u0161itve zgornjih nalog v 5. tednu dela na daljavo.\"", "\"LETNI
  PROGRAM \u0160PORTA\\n\\nV REPUBLIKI SLOVENIJI ZA LETO 2017\\n\\nV skladu in na
  podlagi 7. \u010dlena Zakona o \u0161portu (Uradni list RS, \u0161t. 22/98, 97/01-ZSDP
