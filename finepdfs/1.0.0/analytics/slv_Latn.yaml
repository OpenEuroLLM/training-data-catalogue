  v Dobrni,  dogovor  o  prevzemu stolov ob prenovi kina\\n- evidentiranje gradiva
  v Bolnici Celje\\n- evidentiranje zobozdravstvene opreme\\n\\nUREJANJE, DOKUMENTIRANJE
