  MPD Gaberje 97 ter mentorstvo eni od skupin\\n- obisk \u0161tudentov oddelka za
  etnologijo FF, predstavitev muzeja in razgovor o delu etnologa v muzeju\\n- pedago\u0161ki
  program za poskusno postavitev modistovske delavnice\\n\\nPRIPRAVE, STROKOVNO IN
  RAZISKOVALNO DELO ZA PRIHODNJE OB\u010cASNE RAZSTAVE TER STALNE IN \u017dE OBSTOJE\u010cE
  ZBIRKE:\\n\\n- vodja projekta prenove, nove stalne postavitve in celostne podobe
  muzeja: Andreja Rihter\\n* Priprava nove stalne razstave :\\n- delo v kreativni
  skupini za pripravo stalne razstave / z zunanjimi sodelavci (osnutek scenarija,
  evidentiranje muzealij, priprava in pregled fotografskega in video materiala, izdelava
  miselnih vzorcev za rekonstrukcije v 2. nadstropju, pridobitev topografske kartone
  obnovljenih hi\u0161 v starem mestnem jedru)\\n- izdelan koncept: avdiovizualno
  gradivo kot medij na stalni razstavi\\n- priprava  scenarija  za  postavitev  rekonstrukcije  modistovske
  delavnice\\n* Slovenska zobozdravstvena zbirka\\n- dolgoro\u010dna izposoja zobozdravstvene
  ordinacije iz Berlina (Deutsches Tecnikmuseum)\\n- izdelava koncepta ureditve prostora\\n-
  razgovori na Ministrstvu za znanost RS\\n\\nNekajletno delo se je v letu 1997 kon\u010dalo
  z odprtjem obnovljenega fotografskega ateljeja Josipa Pelikana kot stalno postavitvijo
  na\u0161ega muzeja. Gradivo se je od leta 1989 evidentiralo in zbiralo v MNZC.\\n\\nPodjetje
  z dolgoletno tradicijo Zlatarna Celje je v minulem letu kon\u010dalo v ste\u010dajnem
  postopku. Po razgovoru direktorice s ste\u010dajnim upraviteljem so izdelki ZC in
  zlatarskih delavnic evidentirani, konec leta 1997 (ko je bila sklenjena pogodba
  z Ministrstvom za kulturo), pa se je za\u010del tudi prevzem gradiva v muzej.\\n\\n5\\n\\n3.2.
  Kustodiat za pedago\u0161ko delo\\n\\nV kustodiatu so strokovno delale:\\n\\n- Bronica
