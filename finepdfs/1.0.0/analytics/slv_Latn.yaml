  , drugega reaktorja v zaporedju in tretjega reaktorja v zaporedju Stopnja presnove
  reaktorjev v kaskadi je torej 0,47. 0,23 1 = X 0,29 2 = X 0,47. 3 = X\\n\\n7 PRIPRAVA
  PORO\u010cILA\\n\\nPoro\u010dilo mora vsebovati rezultate celotnih ra\u010dunalni\u0161kih
  vaj iz Reakcijske tehnike. Za vsako nalogo je treba podati.\\n\\n1. SEZNAM UPORABLJENIH
  SIMBOLOV, v katerem navedete simbole, pomene simbolov in enote v mednarodnem sistemu
  merskih enot in znakov 5,6 . Pravilen zapis merskih enot in znakov je treba upo\u0161tevati
  skozi celotno poro\u010dilo.\\n2. OPIS PROBLEMA, v katerem predstavite re\u0161evani
  problem.\\n3. MATEMATI\u010cNI MODEL, ki mora vsebovati:\\na) fizikalno-matemati\u010dne
  zveze in izpeljave, potrebne za izra\u010dun, in\\nb) uporabljeno numeri\u010dno
  metodo.\\n\\n.\\n\\n4. BLOKOVNI DIAGRAM ena\u010db 1\\n5. RA\u010cUNALNI\u0160KI
  DIAGRAM POTEKA, narisan po uveljavljenih pravilih za risanje diagramov poteka 4
  .\\n6. IZRA\u010cUN, ki mora vsebovati:\\n\u2013 morebitne predhodne izra\u010dune,
  \u010de jih ni bilo mogo\u010de vklju\u010diti v ra\u010dunalni\u0161ki program,\\n\u2013
  programsko opremo: izpis datoteke s programom, podatkovne datoteke in datoteke z
  rezultati, ki jih lahko vstavite na ustrezno mesto v poro\u010dilu ali pa prilo\u017eite
  kot prilogo pri vsaki nalogi posebej;\\n\u2013 morebitne kon\u010dne izra\u010dune,
  \u010de jih ni bilo mogo\u010de vklju\u010diti v ra\u010dunalni\u0161ki program.\\n7.
  REZULTATE, kjer je za\u017eeljeno:\\na) podati kon\u010dne rezultate, po katerih
  naloga spra\u0161uje (ne iteracij) in\\nb) grafi\u010dno prikazati dobljene rezultate,
  kadar je mo\u017eno.\\n8. DISKUSIJO dobljenih rezultatov s stali\u0161\u010da reakcijske
  tehnike.\\n9. UPORABLJENE VIRE po vzoru Navodil za izdelavo diplomskega dela 7 .
  Na primer:\\n(\u0161t.) I. Priimek, Naslov, Zalo\u017eba, Mesto izdaje, Leto izdaje,
  uporabljene strani.\\n\\n8 OCENJEVANJE RA\u010cUNALNI\u0160KIH VAJ\\n\\nPri oceni
  ra\u010dunalni\u0161kih vaj iz Reakcijske tehnike se upo\u0161tevajo:\\n\\n\u2013
  samostojnost pri delu,\\n\u2013 poznavanje ra\u010dunalni\u0161kega paketa DYFLO
  in\\n\u2013 oddano poro\u010dilo o ra\u010dunalni\u0161kih vajah.\\n\\nPoro\u010dilo
  o ra\u010dunalni\u0161kih vajah se prizna, \u010de so dobljene naloge pravilno re\u0161ene
  in \u010de zberete vsaj 60 % mo\u017enih to\u010dk. Podrobnosti o ocenjevanju poro\u010dila
  so razvidne iz slike 8.1. Negativno ocenjena poro\u010dila morate popraviti in jih
  ponovno oddati v pregled. Pozitivno ocenjeno poro\u010dilo se lahko enkrat popravlja
  z namenom izbolj\u0161ati oceno. Pri oddaji poro\u010dila se je treba dr\u017eati
  dogovorjenih rokov. Prekora\u010deni roki vplivajo na zni\u017eanje ocene ra\u010dunalni\u0161kih
  vaj.\\n\\nOcena ra\u010dunalni\u0161kih vaj iz Reakcijske tehnike se skupaj z oceno
  laboratorijskih vaj iz Reakcijske tehnike in (delnimi) pisnimi izpiti po ena\u010dbi\\n\\noblikuje
  v kon\u010dno oceno vaj iz Reakcijske tehnike.\\n\\nSlika 8.1a: Ocenjevalni list
  za poro\u010dilo o ra\u010dunalni\u0161kih vajah iz Reakcijske tehnike.\\n\\n9 DODATEK\\n\\nV
  dodatku so skupaj z ustreznimi stranmi iz u\u010dbenika Modeliranje procesnih operacij
  1 navedeni abecedni seznami:\\n\\n\u2013 numeri\u010dnih metod,\\n\u2013 programske
