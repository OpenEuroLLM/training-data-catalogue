  \u00bbranljivosti\u00ab. Na osnovi primerjave prednosti, potencialov in prilo\u017enosti
  ter slabosti in nevarnosti (SWOT) so v Tabeli 2 nakazani klju\u010dni razvojni izzivi
  ob\u010dine in mo\u017ene strategije re\u0161evanja (t. i. TOWS). Glej tudi Prilogo
