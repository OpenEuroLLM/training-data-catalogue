  1: Pametna regeneracija\\n\\nRazvojni izzivi\\n- Obvladovanje in podoba obmo\u010dij
  v zatonu (funkcionalno degradirana obmo\u010dja)\\n- Podjetni\u0161ki ambient za
  nastajanje in rast podjetij\\n- Valorizacija potencialov turizma, kmetijstva, narave
  in kulture\\n\\nCilj: Premi\u0161ljena zelena podjetni\u0161ka revitalizacija za
  ve\u010djo odpornost in nova delovna mesta na vseh podro\u010djih gospodarstva,
  turizma in kmetijstva\\n\\nUsmeritev\\nOb\u010dina Tr\u017ei\u010d je v zadnjih
  treh desetletjih po kolapsu industrije uspela stabilizirati socialne in gospodarske
  temelje, za\u010drtati prostorske pogoje in zagnati turizem, kar nam omogo\u010da
  prehod v novo razvojno fazo. Z razvojnim na\u010drtom do leta 2030 Ob\u010dina Tr\u017ei\u010d
  bistveno ne spreminja dosedanjega na\u010drtnega pospe\u0161evanja perspektivnih
  dejavnosti in prenove ve\u010d kot 10 ha razvrednotenih povr\u0161in. Nadaljevali
  bomo z urejanjem javne infrastrukture na teh obmo\u010djih. Ukrepom na obmo\u010dju
  BPT-ja, dodajamo obmo\u010dje tovarne Peko in turisti\u010dna obmo\u010dja na Ljubelju,
  \u010de bo izra\u017een tudi interes lastnikov.\\n\\nPo drugi strani pristopamo
  k bolj na\u010drtnemu usmerjanju celostnega gospodarsko-socialnega o\u017eivljanja
  mestega jedra Tr\u017ei\u010da ter spodbujanju kmetijstva, prideleve hrane in razli\u010dnih
  inovativenih dejavnosti na tr\u017ei\u0161kih kmetijah. Krepimo uveljavljanje Tr\u017ei\u010da
  kot zelene outdoor turisti\u010dne destinacije, \u0161e zlasti se usmerjamo na izbolj\u0161anje
  ponudbe kulinarike, do\u017eivetij v kulturi in upravljanje dejavnosti v naravi.
  Program spodbujanja podjetni\u0161tva \u00bbpodjeten.si\u00ab posodabljamo v ustvarjalen.
  sik, ki bo \u0161e posebej namenjen odra\u0161\u010dajo\u010di mladini.\\n\\nV podporo
  razvoju podjetni\u0161kih in kreativnih idej na vseh gospodarskih podro\u010djih
  ter procesu razvoja in prenove posameznih obmo\u010dij ob\u010dine, bomo postopoma
  vzpostavljali \u00bbtr\u017ei\u0161ko kreativno sredi\u0161\u010de\u00ab z razvojno
  ekipo in prostori za sre\u010devanje, sodelovanje in soustvarjanje inovativnih Tr\u017ei\u010danov.
  Da bodo vsi deli ob\u010dine, omogo\u010dili ob\u010danom poslovanje, delo in izobra\u017eevanje
  na daljavo moramo s strani operaterjev zagotoviti ve\u010dja vlaganja v \u0161irokopasovno
  omre\u017eje, \u0161e zlasti na tr\u017ei\u0161kem pode\u017eelju.\\n\\nS podporo
  podjetnim na vseh gospodarskih podro\u010djih ter zagotavljanjem pogojev za rast
  obstoje\u010dih podjetij bomo pove\u010dali odpornost lokalnega gospodarstva, z
  znanjem dodajali vrednost tr\u017ei\u0161kim pridelekom, izdelkom in storitvam ter
  spreminjali industrijsko podobo ob\u010dine v \u00bbob\u010dino s perspektivo\u00ab.\\n\\nSlika
