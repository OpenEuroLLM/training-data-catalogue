  kulture na internetu\\n- Izjava o pokopali\u0161\u010du Golovec za TV tednik\\n-
  Du\u0161an Mlacovi\u0107: posredovanje razglednic in fotografij Pelikana za razstavo
  o dru\u017eabnem \u017eivljenju v zdravili\u0161\u010du Rog. Slatina\\n\\nPEDAGO\u0160KO
  DELO:\\n\\n- recenzije srednje\u0161olskih raziskovalnih nalog\\n- Vodstva po stalnih
  (Celje po drugi svet. vojni in  in zobozdravstvena zbirka, Stari pisker) in ob\u010dasnih
  razstavah (Glavni trg v Celju, Bleiweis in njegov \u010das, Oj, ta voja\u0161ki
