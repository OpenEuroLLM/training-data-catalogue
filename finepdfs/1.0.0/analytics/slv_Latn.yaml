  1 , O H C 2 4 6 X 1 , O H C 2 4 6 X\\n\\n2.2 Re\u0161evanje problemov iz reakcijske
  tehnike z numeri\u010dnimi metodami za snemanje funkcij in re\u0161evanje diferencialnih
  ena\u010db\\n\\nZa re\u0161evanje diferencialnih ena\u010db imamo na voljo metode
  za numeri\u010dno integracijo ena\u010db:\\n\\n\u2013 enostavno Eulerjevo metodo
  (integracija 1. reda) in\\n\u2013 Runge-Kuttove metode 1., 2. in 4. reda.\\n\\nMetode
  Runge-Kutta so predstavljene s podprogramom INT, kontrolnim podprogramom INTI in
  podprogramom PRNTF, ki dolo\u010da pogostost izpisa in testira konec ra\u010dunanja
  (\u010de \u017eelimo izpisovati ve\u010d kot deset spremenljivk, uporabimo \u0161e
  podprogram PRNTRS). Metoda 4. reda je za kemijskega tehnologa skoraj univerzalno
  uporabna, metodi 1. in 2. reda zado\u0161\u010data samo v nekaterih primerih.\\n\\nUporaba
  programske opreme za snemanje enodimenzijskih poljubnih funkcij in re\u0161evanje
  diferencialnih ena\u010db bo prikazana na zaporedju dveh cevnih in enega me\u0161alnega
  reaktorja. Problem, ki ga je potrebno re\u0161iti, je del problema, vzetega iz literature
  3 , in je slede\u010d:\\n\\nPrimer 2\\n\\nAvtokatalitska reakcija\\n\\nA C B + \u2192\\n\\npoteka
  v kaskadi dveh cevnih in enega me\u0161alnega reaktorja (slika 2.2). Prostornina
