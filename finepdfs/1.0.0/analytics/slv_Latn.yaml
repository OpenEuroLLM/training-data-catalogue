  in organizacija spremljevalnih dejavnosti ob razstavah Hi, konji\u010dek in Hitreje,
  vi\u0161je, mo\u010dneje v Otro\u0161kem muzeju\\n- strokovna priprava vsebinskega
  dela projekta Hitreje, vi\u0161je, mo\u010dneje v Otro\u0161kem muzeju, vsebinska
