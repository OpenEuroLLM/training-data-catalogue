  Tanja Fajon, Franc Bogovi\u010d, Ljudmila Novak).\\n\\nKratek komentar poslovodstva
  Zavoda R\u0160 glede poslovnega rezultata v letu 2021\\n\\nV letu 2021 je bilo 636.222
  EUR prihodkov, kar je 15,1% ve\u010d prihodkov kot v letu 2020, ter 633.813 EUR
  odhodkov, kar pomeni 17,5% ve\u010d odhodkov kot v letu 2021. Poslovni rezultat
  Zavoda R\u0160 za leto 2021 tako izkazuje prese\u017eek prihodkov nad odhodki v
  skupni vi\u0161ini 2.409 EUR. Na letni ravni poslovanja gre za izjemen rezultat,
  katerega gre v dolo\u010deni meri pripisati nadaljnjemu uspe\u0161nemu soo\u010danju
  s posledicami epidemije, predvsem pa hitremu in u\u010dinkovitemu odzivu na popolno
  odtegnitev sredstev Ministrstva za kulturo (MK) v sklopu krovnega medijskega razpisa
  za produkcijo jedrnih medijskih vsebin radijskega programa R\u0160 ter krizi ob
  zmanj\u0161anju sredstev za delovanje s strani ustanovitelja, \u0160tudentske organizacije
  Univerze v Ljubljani (\u0160OU) v prvem trimese\u010dju 2021.\\n\\nOdtegnitev sofinanciranja
  medijskih vsebin R\u0160 s strani MK je Radio \u0160tudent doletelo v maju 2021
  in predstavlja izpad sredstev v vi\u0161ini skoraj 100.000 EUR v primerjavi z letom
  prej. Kot neposreden odgovor na finan\u010dno krizo smo takoj zagnali obse\u017ene
  var\u010devalne ukrepe, predvsem pa s pomo\u010djo izjemne donacijske podpore v
  letu 2021 preko obnovljene lastne donacijske platforme \u0160iri R\u0160 (kjer smo
  dodali opcijo \u00bbtrajnika\u00ab - redne mese\u010dne podpore) in z uvedbo zbiranja
  sredstev tudi z SMS donacijami uspeli zbrati kar 64.879 EUR donacij poslu\u0161alk
  in poslu\u0161alcev, v manj\u0161i meri tudi podjetij, ter 30.167 EUR donacij iz
  dohodnine, kar v skupnem se\u0161tevku zna\u0161a dobrih 95.000 EUR prihodka iz
  naslova donacij.\\n\\nIzredne prihodke je v letu 2021 ustvaril tudi marketing R\u0160,
  ki je pove\u010dal prihodek za skoraj tri \u010detrtine v primerjavi z letom prej,
  iz 84.610 EUR na 146.098 EUR. Rast prihodkov je deloma posledica nadaljevanja razvoja
  novih storitev produkcije v marketingu R\u0160 (porast prihodkov z naslova tr\u017eenja
  storitev video produkcije za 50% v primerjavi z letom prej ter rednej\u0161a produkcija
  zvo\u010dnih knjig, podcastov in avdio vodi\u010dev). Tudi nekatere prihodke marketinga
  R\u0160 gre v dolo\u010deni meri razumeti v kontekstu odgovora na finan\u010dno
  krizo. V letu 2021 namre\u010d bele\u017eimo tudi pove\u010danje sponzoriranja krovnih
  glasbenih in drugih krovnih projektov R\u0160, ki odra\u017eajo solidarnost s strani
  podpornih podjetij, ki so projekte R\u0160 sofinancirali z izrednimi sponzorskimi
  sredstvi (v vi\u0161ini 19.350 EUR) in so kot taki v letu 2022 vsaj do dolo\u010dene
  mere neponovljivi.\\n\\nUspe\u0161na poslovna bilanca izvira tudi iz rasto\u010dih
  prihodkov projektne pisarne R\u0160 iz naslova pridobivanja sredstev iz javnih razpisov,
  ki v letu 2021 kljub tektonskemu izpadu sredstev medijskega razpisa MK dosegajo
  kar 272.100 EUR (lani so vklju\u010dno s sredstvi medijskega razpisa zna\u0161ali
  296.600 EUR, brez njega pa 197.380 EUR). Ob tem je treba izpostaviti skokovit porast
  sredstev predvsem iz evropskih projektov, in sicer za 110% v primerjavi z letom
  prej (iz 51.700 EUR na 109.600 EUR).\\n\\nDeloma zaradi ve\u010djega vklju\u010devanja
  \u0161tudentov tudi v evropske projekte, deloma zaradi ob\u010dutnega porasta interesa
  \u0161tudentov za delo na Radiu \u0160tudent - ki je \u017ee v obletni\u010dnem
  letu 2019 (ko je R\u0160 praznoval svojo 50-letnico obstoja) obrodilo rekordno \u0161tevilo
  prijav \u0161tudentov na avdicije redakcij in programskih slu\u017eb - se je v letu
  2021 ob\u010dutno pove\u010dal tudi obseg \u0161tudentskega dela, in sicer za 45%
  v primerjavi z letom prej - stro\u0161ke iz tega naslova smo pove\u010dali iz 78.000
  EUR na 112.800 EUR (avtorsko delo pa zmanj\u0161ali za 15%). Dvig dele\u017ea \u0161tudentskega
  dela je delno povezan tudi z neposredno izpostavitvijo Radia \u0160tudent v letu
  2021 med \u0161tudentsko in drugo populacijo mladih, do katere je pri\u0161lo tudi
  zaradi komunikacijskih kampanj v podporo Radiu \u0160tudent, predvsem prvemu valu
  re\u0161evanja R\u0160 zaradi gro\u017enje popolne ukinitve financiranja in privatizacije
  s strani ustanovitelja \u0160OU. Navedeno potrjujejo tudi podatki glede povpre\u010dnega
  dosega, ki je bil v prvem trimese\u010dju leta 2021 na dru\u017eabni platformi Facebook
  (kjer mladi med 18 in 34 leti predstavljajo 2/3 sledilcev - od vseh 17.873 sledilcev
  ob koncu leta 2021), kar trikrat ve\u010dji v primerjavi z dosegom v istem trimese\u010dju
  predlani, v istem obdobju se je tudi pove\u010dalo  \u0161tevilo sledilcev na platformi
  Instagram R\u0160  za 40% (na 6.882).\\n\\nPozitiven trend vklju\u010devanja \u0161tudentov
  in drugih mladih v delo na Radiu \u0160tudent je skladen tudi z pove\u010danjem
  poslu\u0161anosti R\u0160, ki se je v obdobju od leta 2018 do za\u010detka leta
  2021 podvojil (iz 5.000 na 10.000 poslu\u0161alk in poslu\u0161alcev na dan, podatki
  Mediane RM, januar \u2013 maj 2021), med poslu\u0161alstvom je kar 30% mladih pod
  29 leti. Poslu\u0161alstvo R\u0160 sicer odlikujeta tudi najvi\u0161ja povpre\u010den
  dohodek in izobrazba med vsemi ob\u010dinstvi radijskih postaj v Sloveniji (Mediana
  TGI, 2021).\\n\\nSredstva ustanovitelja \u0160OU, \u010detudi so v letu 2021 predstavljala
  zgolj \u0161e 84.000 EUR osnovne  podpore  oz.  92.400  EUR kon\u010dne  podpore  (po  povi\u0161anju  financiranja  vseh  zavodov
  dru\u017eine \u0160OU za 10% zaradi vi\u0161je prejete koncesijske dajatve na letni
  ravni na strani \u0160OU) in so tako v 2021 predstavljala zgolj \u0161e 14,5% vseh
  prihodkov R\u0160, potrebnih za delovanje R\u0160, kar je doslej najni\u017eji obseg
  kot tudi dele\u017e sofinanciranja delovanja R\u0160 s strani \u0160OU. Kljub temu
  so bila ta sredstva klju\u010dna za zagotovitev uspe\u0161nega \u010drpanja vseh
  drugih projektnih virov. Ni odve\u010d spomniti, da se R\u0160 najmanj od leta 2013
  dalje soo\u010da s sistemati\u010dnim in v primerjavi z drugimi zavodi dru\u017eine  \u0160OU
  skrajno deprivilegiranim zmanj\u0161evanjem sredstev ustanovitelja. R\u0160 je uspel
  izpad teh sredstev ve\u010d kot uspe\u0161no nadomestiti z razvojem svoje dejavnosti
  ter z oblikovanjem \u0161irokega portfelja drugih virov na podro\u010dju projektov,
  komercialne prodaje in donacij.\\n\\nKljub navedenim pozitivnim premikom v dejavnostih
  R\u0160 pa si \u017eelimo, da bi \u0160OU kot ustanovitelj pri nadaljnji podpori
  delovanja R\u0160 kot \u010dlana dru\u017eine \u0160OU, bolje razumel izjemen pomen
  dovolj\u0161njega obsega sofinanciranja iz sredstev \u0160OU kot temeljnih sredstev,
  na katerih R\u0160 gradi vse preostale vire in dejavnosti, vklju\u010dno z vedno
  pomembnej\u0161imi projektnimi dejavnostmi. Ve\u010dletno padanje sofinanciranja
  R\u0160  s strani \u0160OU namre\u010d  vedno bolj krni stanovitnost delovanja R\u0160,
  \u010detudi R\u0160 uspe\u0161no krepi svojo raznolikost, doseg in pomen delovanja
  za \u0161tudentsko in \u0161ir\u0161o zainteresirano javnost ter si z lastnim uspe\u0161nim
  anga\u017emajem zagotavlja vedno ve\u010dji dele\u017e prihodkov iz drugih virov.\\n\\nPorast
  zbranih donacij in v dolo\u010deni meri tudi rast prihodkov marketinga R\u0160 v
  2021 je bil v prvi vrsti odraz kriznih razmer, ki so R\u0160 v letu 2021 pahnile
  pred najve\u010dji pre\u017eivetveni izziv doslej. Izkupi\u010dek je zelo za\u010dasna
  stabilnost radia, ki pa v prihodnjih letih terja ve\u010dje razumevanje in podporo
  ustanovitelja \u0160OU, da bi se lahko temeljiteje posvetili prepotrebnemu razvoju
  radia, ki je kljub ve\u010d kot pol-stoletnemu obstoju mlad kot \u017ee dolgo ne,
  kar velja tako za ustvarjalce radijskega programa kot tudi poslu\u0161alce.\\n\\nZa
  konec vnovi\u010d apeliramo na ustanovitelja \u0160OU, tokrat ne zgolj za to, da
  Radio \u0160tudent sofinancira z dovolj\u0161njimi sredstvi za nemoteno delovanje,
  ter mu z dodatnimi sredstvi omogo\u010di prepotreben in zaslu\u017een razvoj, ampak
  tudi to, da mu omogo\u010di ohranitev statusa delovanja v javnem interesu. 21.3.2022
  namre\u010d pote\u010de rok, do katerega ima R\u0160 kot nevladna organizacija s
  statusom delovanja v javnem interesu \u010das za uskladitev svojega temeljnega pravnega
  akta z leta 2018 sprejetim Zakonom o nevladnih organizacijah (ZNOrg), za kar je
  potrebna \u2154 ve\u010dina na \u0161tudentskem zboru \u0160OU. V nasprotnem primeru
  bi R\u0160 izgubil status delovanja v javnem interesu, kar v praksi med drugim pomeni,
  da bi bilo ogro\u017eeno pridobivanje sredstev na javnih razpisih. \u0160OU zato
  pozivamo, da preneha z nerazumnim zavla\u010devanjem prilagoditve Akta o ustanovitvi
  R\u0160  z ZNOrg in da kot odgovoren ustanovitelj omogo\u010di nadaljnje uspe\u0161no
  pridobivanje javnih sredstev ter donacij iz dohodnine in SMS donacij, ki so prav
  tako vezane na status delovanja v javnem interesu.\\n\\nFINAN\u010c NO PORO \u010c  ILO
