  18,177,482\"", "\"Letno sre\u010danje VGN in GS ter zaklju\u010dek te\u010daja VGN\\n\\nSobota,
  25. september 2021, na Ko\u010di na Planini nad Vrhniko\\n\\nVse gorske stra\u017earje
  in varuhe gorske narave, zlasti udele\u017eence leto\u0161njega te\u010daja za varuhe
  gorske narave, vabimo na letno sre\u010danje varuhov gorske narave in gorskih stra\u017earjev
  ter zaklju\u010dek te\u010daja VGN.\\n\\nProgram:\\n\\nDo 9:00: zbor udele\u017eencev
  pri Starem malnu\\n\\nOd 9:00 do 11:30: voden pohod na okoljsko/naravovarstveno
  temo: Problematika jam in kra\u0161ki pojavi na \u0161ir\u0161em obmo\u010dju Planine;
  strokovno bo vodil Franci Gabrov\u0161ek; na poti ogled Lintverna in vhoda Feranove
  bu\u017ee.\\n\\nOd 11:30 do 12:30: Ko\u010da na Planini nad Vrhniko in njeni okoljski
  vidiki, razgled s stolpa\\n\\nOd 12:30 do 13:30: Malica\\n\\nOd 13:30 do 14:30:
  Zaklju\u010dek te\u010daja VGN 2021\\n\\nOd 14:30 do 16:00: Dru\u017eenje\\n\\nPredvidoma
  do 16:00: Zaklju\u010dek in povratek v dolino\\n\\nObvezne prijave do 23. 9. 2021
  sprejema Du\u0161an Pra\u0161nikar na e-naslov:\\n\\nfirstname.lastname@example.org.\\n\\nKVGN
  PZS za vse udele\u017eence letnega sre\u010danja in te\u010dajnike krije stro\u0161ke
  planinske malice s \u010dajem.\\n\\nPrireditev bo v vsakem vremenu!\\n\\nPogoj za
  udele\u017ebo na sre\u010danju je izpolnjevanje pogoja PCT! Kdor za ta dan nima
  izpolnjenega pogoja PCT, ne bo mogel prisostvovati dogodku.\\n\\nNavodilo za dostop
  do zbirnega mesta:\\n\\nZbirno mesto je Star maln, lokacija na google zemljevidu:
  https://email@example.com,14.248935,15z/data=!4m5!\\n\\n3m4!1s0x0:0xd01f65c40853edc0!8m2!3d45.958543!4d14.2490105\\n\\nPri
  izvozu Vrhnika iz AC levo smer Logatec in na drugem semaforju (poleg O\u0160 Vrhnika)
  zavijete desno. Po cca 1,5 km pridete do Parkiri\u0161\u010da pri \u0160tirni (ki
  je tudi izhodi\u0161\u010de za pot do ko\u010de), kjer se usmerite levo in takoj
  desno na makadamsko pot. Sledite oznaki za Star maln, do kamor je \u0161e cca 3
  km vo\u017enje.\\n\\nProsimo vas, da se na dogodek pripeljete skupaj s \u010dim
  manj avtomobili, torej da se \u017ee predhodno dogovorite za skupne prevoze.\\n\\nMarijan
  Den\u0161a, Na\u010delnik KVGN\"", "\"Za prvi sadjarjev korak...\\n\\nCuprablau
  Z\\n\\nZaradi previsokih temperatur v zadnjem obdobju je potrebno ko\u0161\u010di\u010dasto
  sadje \u010dim prej po\u0161kropiti, vsekarok pred prvimi padavinami, saj glive
  iz rodu (Taphrina) povzro\u010dajo bolezni ko\u0161\u010di\u010darjev, najbolj znana
  je breskova kodravost (Taphrina deformans), ki brste oku\u017ei takoj, ko se le
  ti pri\u010dnejo odpirati, pogosto se sre\u010damo tudi z ro\u017ei\u010davostjo
  \u010de\u0161pelj (Taphrina pruni). Tudi, \u010de bo pri\u0161lo v prihodnjem tednu
  do zni\u017eanja temperatur, to ne bo zmanj\u0161alo nevarnosti oku\u017eb z breskovo
  kodravostjo, v primeru padavin.\\n\\nPrvo \u0161kropljenje breskev in ostalih ko\u0161\u010di\u010darjev
  opravimo s pripravkomom Cuprablau Z 35 WP v odmerku 3 kg/ ha, [30g/10L] vode ali
  Cuprablau Z 35 WG v odmerku 1,6 - 2,1 kg/ha, [21g/10 L vode], ko se pri\u010dnejo
  odpirati konice luskolistov. Isto\u010dasno pripravka Cuprablau Z 35 WP ali Cuprablau
  Z ultra zatira tudi glivo, ki povzro\u010da listno luknji\u010davost ko\u0161\u010di\u010darjev
  (Stigmina carpophila).\\n\\n\u0160krlep je najpomembnej\u0161a bolezen jablan in
  hru\u0161k. Gliva (Venturia inaequalis) povzro\u010diteljica bolezni prezimi v odpadnem
  listju. Za prepre\u010devanje primarnih oku\u017eb uporabite pripravka Cuprablau
  Z 35 WP v odmerku 3 kg/ ha, [30g/10 L] vode ali Cuprablau Z 35 WG v odmerku 1,6
  - 2,1 kg/ha, [21g/10 L vode] v 7 do 10 dnevnih razmikih. Priporo\u010da se \u0161kropljenje
  v fenolo\u0161ki fazi od mi\u0161ijega u\u0161esa do faze, ko so sovetja v balonskem
  stadiju (BBCH 54-59).\\n\\nPripravek Cuprablau Z 35 WP in Cuprablau Z 35 WG delujejo
  tudi: Proti jablanovemu raku (Nectria galligena), proti navadni sadni gnilobi/skladi\u0161\u010dni
  moniliji (Monilia fructigena), proti gnilobi koreninskega vrata jablan in hru\u0161k
  (Phytophthora cactorum) proti bakterijskemu hru\u0161evemu o\u017eigu (Erwinia amylovora).
  Predviden \u010das prvega \u0161kropljenja jabolk in hru\u0161k s pripravkomom Cuprablau
  Z bo v drugi polovici meseca marca.\\n\\nNOVO!\\n\\nCUPRABLAU Z 35 WG v 100g pakiranju.
  Lahko se prodaja brez predlo\u017eitve potrdila o pridobitvi znanj iz fitofarmacije.\"",
  "\"Prvo sre\u010danje \u0160TUDENSKE SKUPINE 2013/14\\n\\nSKUPINA\\n\\n- Med \u010dem
  si izbiral/a, ko si se odlo\u010dal/a ali pride\u0161 sem ali gre\u0161 kam drugam
  oz. ne gre\u0161 nikamor?\\n\\nVLOGA VERE\\n\\n- Ali je vera, ki nas povezuje, samo
  zunanji znak ali v njej i\u0161\u010de\u0161 in \u017eeli\u0161 najti tudi globlji
  smisel?\\n- Kaj je tisto, kar misli\u0161, da ti vera lahko da, \u010desar drugje
  ne more\u0161 najti?\\n\\nTEMELJNA NA\u010cELA\\n\\n- Kaj te vodi v vsakdanjem \u017eivljenju?
  Kako bi zapisal glavno na\u010delo?\\n- To na\u010delo je zraslo v tvoji glavi,
  v tvoji dru\u017eini, v razumevanju Evangelija, v sprejemanju splo\u0161nih na\u010del
  dru\u017ebe ali kje drugje? Vidi\u0161 v njem pomanjkljivosti? Se ga \u017eeli\u0161
  otresti, ga spremeniti ali utrditi?\\n\\nTEMELJNI CILJI V \u017dIVLJENJU\\n\\n-
  Kaj je tvoj temeljni cilj v \u017eivljenju?\\n- Kaj \u017eeli\u0161 dose\u010di
  v tem letu?\\n- Kako bi ocenil/a tvoje dosedanje delo za doseganje kon\u010dnega
  cilja?\\n- Kaj ti je pri tem najbolj pomagalo?\\n- Kaj te je najbolj oviralo?\\n-
  Kaj si \u017eeli\u0161 spremeniti, nadgraditi?\\n- Pri \u010dem ti lahko sre\u010danja
  \u0161tudentske skupine pomagajo? Kaj od sre\u010danj pri\u010dakuje\u0161?\\n\\nPOMEN
  SRE\u010cEVANJA ZA \u017dIVLJENJE\\n\\n- Kak\u0161nih vsebin si pri sre\u010danjih
  \u017eeli\u0161?\\n- Ka\u0161en naj bo na\u010din sre\u010devanja, na\u010din dela?\\n-
  Koliko si pripravljen vlo\u017eiti v sre\u010danja oz. v to, da bi sre\u010danja
  slu\u017eila tvojim ciljem?\\n\\nResni\u010dno opravi\u010denje\\n\\nSicer pa, bratje
  moji, veselite se v Gospodu. Meni ni odve\u010d, vam pa je v prid, da vam pi\u0161em
  iste stvari \u2026\\n\\nToda kar je bilo zame dobi\u010dek, to sem zaradi Kristusa
  za\u010del imeti za izgubo. \u0160e ve\u010d, za izgubo imam vse zaradi vzvi\u0161enosti
  spoznanja Kristusa Jezusa, mojega Gospoda. Zaradi njega sem zavrgel vse in imam
  vse za smeti, da bi bil Kristus moj dobi\u010dek in da bi se zna\u0161el v njem,
  in to ne s svojo pravi\u010dnostjo, ki izvira iz postave, ampak s pravi\u010dnostjo,
  ki je po veri v Kristusa, se pravi s pravi\u010dnostjo, ki je iz Boga in sloni na
  veri, da bi spoznal njega in mo\u010d njegovega vstajenja ter dele\u017e pri njegovem
  trpljenju, pri tem pa postajam podoben njegovi smrti, da kako pridem do vstajenja
  od mrtvih.\\n\\nHitim proti cilju\\n\\nNe, kakor da bi to \u017ee dosegel ali pri\u0161el
  do popolnosti, vendar pa se trudim, da bi to osvojil, ker je tudi mene osvojil Kristus
  Jezus. Ne mislim, bratje, da sem to dosegel. Eno pa: pozabljam, kar je za menoj,
  in se iztegujem proti temu, kar je pred menoj, ter te\u010dem proti cilju po nagrado,
  h kateri nas od zgoraj kli\u010de Bog v Kristusu Jezusu. Zato vsi, kar nas je popolnih,
  imejmo to v mislih; \u010de pa kaj druga\u010de mislite, vam bo Bog razodel tudi
  to. Sicer pa se dr\u017eimo tega, kar smo dosegli.\\n\\nVsi skupaj postanite moji
  posnemovalci, bratje, in se ozirajte po tistih, ki \u017eivijo po zgledu, kakr\u0161nega
  imate v nas. Mnogi namre\u010d \u017eivijo \u2013 ve\u010dkrat sem vam jih \u017ee
  omenil, zdaj pa jih omenjam jokaje \u2013 kot sovra\u017eniki Kristusovega kri\u017ea.
  Njihov konec je pogubljenje, njihov bog je trebuh, njihova slava je v njihovi sramoti,
  premi\u0161ljujejo zemeljske stvari. Na\u0161a domovina pa je v nebesih, od koder
  tudi pri\u010dakujemo odre\u0161enika, Gospoda Jezusa Kristusa. Ta bo z mo\u010djo,
