  euskara arloko hainbat diru laguntza onartu zituen.\\n\\nGaltzaundi Euskara Taldeak
  Tolosaldeko euskara elkarte eta eskualdeko 28 herrietan ari da lanean euskararen
  normalizaziorantz, eta Irura ere horretan ari da. Galtzaundik egiten duen lana aurrera
