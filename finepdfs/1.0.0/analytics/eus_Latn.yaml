  , euskara arloko hainbat laguntza onartu zituen.\\n\\n28 kanala elkartearen helburua
  Tolosaldeko bailarako telebista euskaraz sustatzea da.\\n\\nHori ikusita, udalbatzak,
  aho batez, hau onartu du:\\n\\nERABAKIA:\\n\\n1\u00ba.- 2.500 euroko diru laguntza
  ematea 2019ko egitasmoa sustatzeko eta horretarako elkarte honekin hitzarmena sinatzea.\\n\\n2\u00ba.-Ana
  Jes\u00fas Leunda Gurruchaga anderea, Irurako Udaleko Alkatea denari, baimena ematea
  Udalaren izenean hitzarmen hori sinatzeko eta beste edozein gestio egiteko, helburua
  bete dadin.\\n\\nHAMABOSTGARREN GAIA\\n\\nTOLOSALDEKO EMAKUMEEN ETXEAREN EGITASMOA
  ONARTZEKO ETA HURA GARATZEKO KONPROMISOA HARTZEKO MOZIOA ONARTZEKO, HALA BADAGOKIO.\\n\\nMozio
  hau aurkeztu da:\\n\\nMOZIOA, TOLOSALDEKO EMAKUMEEN ETXEAREN EGITASMOA ONARTZEKO
  ETA HURA GARATZEKO KONPROMISOA HARTZEKO\\n\\nEmakumeen etxeak eta txokoak Mugimendu
  Feministaren erreibindikazio historiko izan dira eta dira. Eskaera hori 80ko hamarkadan
  hasi zen gauzatzen Estatuan, hain zuzen ere, Zaragozako eta Kataluniako ekipamenduak
  sortu zirenean. Euskal Herrian, berriz, 2003koak dira lehen ekimenak, emakumeen
  etxeak jarri zirenean Ermuan aurrena eta Arrasaten ondoren, eta 2004an ireki zuten
  Eibarren.\\n\\n2010etik aurrera etorriko ziren besteak: Gipuzkoan, Donostian, Hernanin
  eta Azpeitian; Bizkaian, Basaurin, Ondarroan eta Durangon; eta Nafarroan, Iru\u00f1ean.
  Denek helburu bera dute, baina bakoitzak bere egiturak, kudeatzeko modua eta funtzionamendua
  ditu, udalerri bakoitzaren errealitate eta beharretara egokituta. Aipatzekoak dira
  Donostiako eta Ondarroako etxeak, kudeatzen baitituzte Udalaren, erakunde feministen
  eta emakumeen ehun asoziatiboaren artean.\\n\\nEtxe hauek sortu zituzten politika
  feministak bultzatzeko eta emakumeen erreferente izateko. Leku hauek elkartzeko,
  eztabaidatzeko, ikasteko eta ahalduntzeko dira, eta, era berean, abiapuntu dira
  emakumeek parte har dezaten udalerriko politikan eta bizitzan. Era askotako gaiak
  izaten dituzte aztergai eta herriko kolektibo feministen eta emakume-taldeen kezkak
  eta jakin-mina jasotzen dira, besteak beste, teoria, literatura edo genealogia feminista,
  indarkeria matxista, autodefentsa feminista, sexualitatea, abortatzeko eskubidea,
  emakumeen arteko ahizpatasuna; aholkularitza juridikoa eta psikologikoa ematen da;
  liburutegi espezializatuak antolatzen dira...\\n\\nAurrekariak\\n\\n2017ko udaberrian,
  zenbait feminista eta emakume-talde elkartu eta Tolosaldeko Emakumeen Etxearen eskaerari
  indarra eta forma ematea erabaki zuten. Horren inguruan hitz egiteko bilera ireki
  bat antolatu zen eta izugarrizko arrakasta izan zuen. Eskualde osorako izango zen
  Emakumeen Etxe bat behar zela ondorioztatu zen, Tolosan kokatua, eta parte-hartze
  prozesu bat beharrezkoa zela emakumeek nolako etxea nahi zuten erabakitzeko. Eskaera
  horrekin 300 sinadura inguru bildu ziren.\\n\\nGainera, iazko martxoaren 8ko greba
  feministaren testuinguruan, Tolosaldeko Asanblada Feminista sortu da. Bere erronka
  nagusia Emakumeen Etxea sortzea da, eskualdeko emakumeen eta eragileen arteko sareak
  eraikitzea, elkarlanean jarduteko baldintzak sortzea eta errealitate bihurtzeko
  plangintza edo bide-orria lantzea, eta, azkenik, herriko nahiz eskualdeko eragile
  eta herritarrak era honetako ekipamenduaren beharraz sentsibilizatzeko komunikazio-kanpaina
  garatzea.\\n\\nHorrela, 2016an, ordezkari politikoak eta emakumeen taldeko ordezkariak
  Basauriko eta Donostiako etxeetara joan ziren, gune horietan emandako esperientziak
  aztertzeko eta proiektu honen abiapuntu bat izateko.\\n\\nUrte horretan, era berean,
  Emakumeen Etxearen lan-talde politiko-teknikoa sortu zen. Talde horretan biltzen
  dira Udal gobernua, oposizioko zinegotziak eta emakumeen ordezkariak. 2018an, Berastegiko
  eta Asteasuko alkateak talde honetan integratzen dira. Talde honen helburua da,
  besteak beste, elkarlanean proiektua kokatzea eta minimo batzuk definitzea eta adostea.
  Horrela, hainbat gai tratatu dira: etxearen arrazoiak, definizioa, lan-ildoak, eskainiko
  diren zerbitzuak, antolamendua, kudeaketa eta abar.\\n\\nBeraz, 2018ko maiatzean,
  hasiera eman zitzaion parte-hartze prozesuari eta bi lan-talde gehiago sortu ziren:
  Talde Eragilea (Tolosaldeko Asanblada feministako ordezkariek, emakumeen taldekoek,
  emakume norbanakoek eta Tolosako Berdintasun teknikariak osatutakoa) eta Emakumeen
  Gune Zabala (interesa duten eskualdeko emakume orok). Parte-hartze prozesua Elhuyar
  Aholkularitzako teknikariekin garatu da.\\n\\nHorrela, prozesu parte-hartzailea
  bi fasetan garatu zen: lehen fasean, maiatzean eta ekainean, etxearen printzipioak,
  helburua, nolakotasuna, erabilera eta jarduerak definitu ziren; eta bigarren fasean,
  irailetik abendura bitartean, etxearen kudeaketa-eredua, antolaketa, baliabideak
  eta abar definitu ziren. Prozesuan zehar, guztira, eskualdeko 104 emakume inguruk
  hartu dute parte.\\n\\nHoriek horrela, Irurako Udaleko udal taldeek, aho batez,
  Osoko Bilkura honetan erabakitzen dute ondorengo konpromisoak hartzea udal esparruan:\\n\\n1.-
  Onartzea Talde Eragilean sortutako eta Emakumeen Gune Zabalean onartutako Emakumeen
  Etxearen egitasmoaren zehaztapenaren dokumentua.\\n2.- Babestea Tolosaldeko Emakumeen
  Etxearen egitasmoa, balizko aldaketa politikotik harago, eta prozesua nahiz emaitza
  alderdi politikoen interesen logikatik kanpo mantentzea.\\n3.- Sozializatzea eta
  ikusgarri egitea herrian Tolosaldeko Emakumeen Etxearen inguruan egin den prozesua
  nahiz emaitza bera (Udalaren web orriaren, sare sozialen edo udal aldizkariaren
  bidez zabaltzea).\\n4.- Baliabide ekonomikoak eta giza-baliabideak jartzea, Tolosaldeko
  Emakumeen Etxearen jarduna garatu ahal izateko, berariazko aurrekontu-partida bat
  izendatuta eta hornituta.\\n\\nHAMASEIGARREN GAIA\\n\\nEUSKAL FONDOAREN 2019RAKO
  DIRU LAGUNTZA ONARTZEA, HALA BADAGOKIO.\\n\\nUdal hau Euskal Fondoa Elkartearen
  kide da eta 2019. egitasmorako diru laguntzak onartu nahi ditu.\\n\\nHori ikusita,
  udalbatzak, aho batez, hau onartu du:\\n\\nERABAKIA:\\n\\n1\u00ba.- Diru laguntza
  hauek onartzea eta ordaintzea:\\na) P 305K: Ur edangarriaren sistema handitzea,
  San Benito, Los Encuentros, El Cortijo eta Liriosen. San Francisco Menendez: 1.500
  \u20ac\\nb) P 307K: Saharako errefuxiatuen kanpalekuetako garraio azpiegiturari
  laguntzea: prestakuntza, suntsikorrak eta ordezkoak: 1.000 \u20ac\\n2\u00ba.- Eta
  gainera horretaz gain Saharako umeentzako oporrak bakean egitasmoari: 500 \u20ac  ematea.\\n\\nHAMAZAZPIGARREN
  GAIA\\n\\n2020KO TOKIKO JAI OFIZIALA ONARTZEA, HALA BADAGOKIO.\\n\\nUrtero bezala,
  2020 urterako Irurako tokiko Jai Ofiziala onartu behar da. Hori ikusita, udalbatzak,
  aho batez, hau onartu du:\\n\\nERABAKIA\\n\\n1\u00ba.- 2020 urterako tokiko Jai
  Ofiziala irailaren 29, San Migel eguna, izendatzea.\\n2\u00ba.-Erabaki hau jakinaraztea
  Eusko Jaurlaritzako dagokion Sailari.\\n\\nHEMEZORTZIGARREN GAIA\\n\\nIDAZKARI KONTU-HARTZAILEAREN
  TXOSTENAK.\\n\\nEz dago ezer.\\n\\nHEMERETZIGARREN GAIA\\n\\nGALDE-ERREGUAK.- Gai
  hauek jorratu dira:\\n\\na) Ainhoa Ugalde zinegotziak (EH Bildu) adierazi du, bi
  diru laguntza berandu ordaindu direla.\\nIdazkariak erantzun du diru laguntza batzuk
  zuritzeko denbora pasatzen dela: dokumentazio ekartzea, errebisatzea, beste dokumentu
  batzuk eskatzea berriz, \u2026\\nb) Mikel Gotzon Iturbe zinegotziak (EH Bildu) galdetu
  du nola dagoen Urdaitegia enpresaren zarataren arazoa.\\nAlkateak erantzun du joan
  den astean enpresa batek azterketa teknikoa\\negin zuela eta datorren astean etorriko
  dela Udalera emaitzak azaltzeko.\\nc) Olaia Nieto zinegotziak (EH Bildu) adierazi
  du azken lau urteko balorazioa egin nahi duela: udaleko gobernutik ez dela elkarrizketarik
  izan ez herritarrekin ezta oposizioekin ere, eta gobernutik Alkateak bakarrik hitz
  egin duela eta beste kideak isilik geratu direla. Alkateak bere adierazpenak beti
  irakurri egin dituela, bere naturaltasunari margenik utzi gabe eta ezta oposizioari
  ere.\\n\\nBerak saiatu direla beren lana egiten: kontrol lana eta herritarrei informatzen.
  Lan gogor horrek bere emaitzak eman dituela. Adibidez, Goiko Parkea lehen estaltzea
  hobea zela onartu dutela, EH Bildu programan agertzen zen bezala, aurreko lege aldian
  martxan jarritako proiektuak jarraitu direla.\\n\\nDatorren legislaturako hau proposatzen
  dute: normaltasuna berreskuratzea Iruran, herritarrekin hitz egitea berriz, herri
  eta auzo batzarrak egitera ausartzea, oposizioarekin negoziatzera ausartzea, herritarren
  hoberena egitera ausartzea eta ez Tolosatik edo Donostiatik esan dutenaren menpe
  egotea. Eta gogoratuz, PNV hauteskunde programan jartzen zuela, Iruran bizi kalitatea
  hobetuko dituen proiektuen informazio zabala emango zela eta herritarrekin partaidetza
  zabala eta eztabaida bilatuko zirela eta hori ez da lortu ez herritarrekin ez oposizioarekin.\\n\\nAlkateak
  adierazi du, egun batzuk barru oraingo legislatura amaituko dela eta posible dela
  azken udalbatza izatea, nahiz eta beste bat ospatu behar agian. Lau urte izan direla
  lanean Iruraren alde eta herritarren nahia betetzen, horrela nahi izan zutelako,
  arro eta pozik dagoela egindako lanarekin. Eskerrak eman nahi dizkiela, idazkari
  kontu-hartzaileari eta udaleko departamentu guztietako tekniko eta langileei, beraien
  lana eta laguntzari esker, hainbat proiektu eta lan aurrera eman direlako. Eta nola
  ez eskerrak eman hemen dauden zinegotziei egindako lanagatik, eskerrak guztiei eta
  ongi izan.\\n\\nOHARRA: eztabaida osoa jasota dago \u201c www.irura.eus \u201d helbidean.\\n\\nAztertzeko
  beste gairik ez dagoenez, alkateak 20:00an eman du amaitutzat bilera. Bertan esandako
  guztia aktan jaso dut, eta dena EGIAZTATZEN dut, idazkari gisa.\\n\\nALKATEA\\n\\nIDAZKARIA\"",
  "\"Vitoria-Gasteiz, 31 de octubre de 2013\\n\\nEstimado(a) socio(a):\\n\\nCon el
  fin de que puedas tomar parte en la Asamblea de la Asociaci\u00f3n y en la votaci\u00f3n
  de los puntos del orden del d\u00eda y de los proyectos a financiar con el fondo
  del a\u00f1o 2013, te convocamos para el pr\u00f3ximo d\u00eda 27 de noviembre,
  mi\u00e9rcoles, a las 13.30 h. en primera convocatoria y a las 14 h. en segunda
  convocatoria, en la sala n\u00ba 22 de Lakua 1.\\n\\nOrden del d\u00eda:\\n\\n1.
  Lectura y aprobaci\u00f3n del Acta de la Asamblea anterior.\\n3. Renovaci\u00f3n
  de la Junta Directiva\\n2. Informaci\u00f3n del seguimiento realizado de los proyectos
  2012.\\n4. Ruegos y preguntas\\n5. Votaci\u00f3n de los proyectos 2013 y posterior
  recuento de votos.\\n\\nComo el a\u00f1o pasado, y con el fin de consumir menos
  papel, no os enviamos los res\u00famenes de los proyectos ni el Acta de la Asamblea
  anterior y la composici\u00f3n de la Junta Directiva. Toda la documentaci\u00f3n
  pertinente est\u00e1 disponible en la p\u00e1gina web de zer0,7: www.zer07.org.\\n\\nEste
  a\u00f1o la convocatoria contempla la financiaci\u00f3n de proyectos desarrollados
  en pa\u00edses de \u00c1frica o de Am\u00e9rica, indistintamente, seg\u00fan su
  IDH -\u00cdndice de Desarrollo Humano- (los quince pa\u00edses de \u00c1frica y
  los ocho de Am\u00e9rica con menor IDH). Se han presentado 42 proyectos a la convocatoria,
  de los cu\u00e1les se han admitido 41, retirando uno que no se ajustaba a los requisitos
  de la convocotaria. El resumen individualizado de cada uno de los proyectos admitidos
  se puede consultar en la p\u00e1gina web de zer0,7. Si quieres conocer m\u00e1s
  detalles de los proyectos, puedes contactarnos llamando a los tel\u00e9fonos 945
  181353 (Cecilia Ceballos) y 945 018588 (Pilar Bilbao).\\n\\nAdjuntamos la papeleta
  de votaci\u00f3n de proyectos. Cada socio o socia elegimos un \u00fanico proyecto,
  La forma de distribuci\u00f3n de los fondos ser\u00e1 en orden descendente de n\u00famero
  de votos, hasta llegar al reparto del total del fondo disponible.\\n\\nEste a\u00f1o
  hemos introducido como novedad la posibilidad de votar por correo electr\u00f3nico.
  Quienes dese\u00e9is utilizar esta opci\u00f3n pod\u00e9is remitir el voto a la
  siguiente direcci\u00f3n: firstname.lastname@example.org\\n\\nAdem\u00e1s hay que
  votar el acta de la Asamblea anterior y la renovaci\u00f3n de la Junta Directiva
  (\u00faltima p\u00e1gina de la papeleta de votaci\u00f3n). La candidatura que proponemos
  es continuista con la actual pero hacemos un llamamiento para que os anim\u00e9is
  a implicaros en la gesti\u00f3n de la Asociaci\u00f3n. En los \u00faltimos tiempos
  se han jubilado varias de las personas m\u00e1s activas y realmente necesitamos
  el apoyo de m\u00e1s gente.\\n\\nLa papeleta de votaci\u00f3n puedes entregarla
  en la Asamblea, enviarla por correo electr\u00f3nico o enviarla por correo a la
  siguiente direcci\u00f3n postal, a la que deber\u00e1 llegar antes del d\u00eda
  27 de noviembre, a las 12 h:\\n\\nAsociaci\u00f3n zer0''7. Biblioteca Central del
  Gobierno Vasco c/ Donostia-San Sebastian, n\u00ba 1 \u2013 01010 Vitoria-Gasteiz\\n\\nEsperando
  contar con tu voto en la Asamblea y anim\u00e1ndote a participar en la gesti\u00f3n
  de la Asociaci\u00f3n, te enviamos un cordial saludo.\\n\\nEl Presidente de Zer0''7\\n\\nJuan
  Zuazagoitia Nubla\\n\\nVitoria-Gasteiz, 2013ko urriaren 31\\n\\nBazkide hori:\\n\\nElkartearen
  Batzar Nagusirako deia luzatu nahi dizugu, aztergaien eta 2012ko fondoarekin finantzatuko
  ditugun proiektuen gaineko erabakietan parte har dezazun. Batzarra azaroaren 27an,
  asteazkenean, egingo dugu; Lakua 1eko 22. gelan, 13:30ean lehen deialdian eta 14:00etan
  bigarrenean.\\n\\nAztergaiak:\\n\\n1. Aurreko Batzar Nagusiko akta irakurri eta
  onartu.\\n3. Zuzendaritza Batzordea berritu.\\n2. 2012an onartutako proiektuen jarraipenaren
  berri eman.\\n4. Norberak lekarkeena.\\n5. 2013ko proiektuen bozketa eta boto kontaketa.\\n\\nPaper
  gutxiago erabiltzearren ez dizkizugu proiektuen laburpenak eta aurreko bilera-akta
  bidaltzen. Agiri horiek guztiak eskuragarri dituzu elkartearen web gunean: www.zer0,7.org\\n\\nAurtengo
  deialdian jasotakoari jarraiki, Giza Garapenerako Indize (GGI) baxuena duten Afrikako
  15 herrialdeetan zein Amerikako 8 herrialdeetan garatutako proiektuak finantzatuko
  dira. Deialdira 42 proiektu aurkeztu dira eta 41 izan dira onartuak; deialdiko baldintzak
  betetzen ez zituen bat baztertu dugu. Onartutako proiektuen laburpenak Elkartearen
  web gunean daude ikusgai, baina proiekturen bat osorik irakurri nahi baduzu, deitu
  telefono zenbaki hauetariko batera: 945 181353 (Cecilia Ceballos), 945 018588 (Pilar
  Bilbao).\\n\\nErantsita doakizu bozkatzeko txartel. Bazkide bakoitzak proiektu bakar
  bat aukeratu behar du. Fondoa ohi bezala banatuko da. Hau da, boto gehien bereganatzen
  duen proiektutik hasi eta gutxien lortzen duenera, banatzeko daukagun dirua agortu
  arte.\\n\\nDeialdi honetan posta elektronikoz ere bozkatu ahal izango da. Aukera
  hori erabili nahi duenak bidal dezala boto-txartela honako helbidera: email@example.com\\n\\nHorrez
  gain, azken bilera-akta eta Zuzendaritza Batzordea berritzea ere bozkatu behar da
  (bozkatzeko txartelaren azken orrialdean). Proposatutako hautagaiak orain artean
  ere lan hori egindakoak dira, aldatzeko aukera handirik ez dugulako. Izan ere, gutxi
  gara honetan lanean ari garenok eta ari ziren batzuk erretiro hartu dute. Beraz,
  elkartearen kudeaketan parte hartzera gonbidatzen zaitugu, jende gehiagoren laguntza
  behar baitugu.\\n\\nBoto-txartela batzarrera eraman dezakezu edo postaz bidali ondoren
  adierazten den helbidera. Postaz bidaltzen baduzu, gogoan izan azaroaren 27ko 12:00ak
  baino lehen jaso behar dugula.\\n\\nZer0,7 Elkartea. Eusko Jaurlaritzako Liburutegi
  Nagusia. Donostia-San Sebastian, 1 \u2013 01010 Vitoria-Gasteiz\\n\\nElkartearen
