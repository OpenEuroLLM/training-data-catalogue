  O            | O            |\\n\\n2.2. 2013-2018 ALDIAREN EGOERAREN AZTERKETA\\n\\n2.2.1.
  Egoera ekologikoaren eta egoera kimikoaren bilakaera\\n\\nAtal honetan, 14 tarteko
  ur-masen eta kostaldeko lau ur-masen 2013-2018 aldiaren egoera ekologikoaren, egoera
  kimikoaren eta egoera globalaren bilakaera laburbiltzen da.\\n\\n1995ean Jarraipen-sarea
  hasi zenetik, egoera ekologikoaren, egoera kimikoaren eta egoera globalaren bilakaera
  aztertzea zaila da hainbat urtetan egin zaizkion aldaketengatik. Aipatzekoak dira:\\n\\n-
  Lagintze-puntu kopuru ezberdina dela-eta (1995ean, 1998an, 2002an eta 2006an aldaketak
  egin dira), ur-masen bilakaera alderatzea zaila da (hala ere, konparaketa lagintze-puntuka
  egin daiteseke).\\n\\n- Egoera ekologikoa aztertzeko erabili den metodologian aldaketak
  egon dira (bereziki 1995-2001 eta 2002-2011 aldietan metodo bateratzale bat erabili
  zelako, 2013-2018an, BKDK irizpidea erabili delarik).\\n\\n- 1995-2001 bitartean
  ez dago daturik elementu batzuentzat (adibidez, fitoplankton eta makroalgen kasuan
  eta, hein txikiago batean, arrainetan).\\n\\n- Interkalibrazioa egin ostean metodo
  batzuk aldatu egin dira (itsasertzeko makroalgak eta arrainak).\\n\\nHala ere, 2013-2018
  bitartean ebaluazio irizpide homogeneoak, lagintze-puntu kopuru egonkorra, eta kontrolerako
  estrategia eta adierazle berberak daudenez, irizpide bakar bat erabiliz azter daiteke
  bilakaera (6. taula, 5. irudia, 6. irudia, 7. irudia).\\n\\n6. taula  Tarteko eta
  kostaldeko ur-masen egoeraren bilakaera 2013-2018 bitartekoan. (Gakoak: egoera ekologikoa:
