  "\"MEATZARITZA ETA ENERGIA TECNOLOGIAREN GRADUA\\n\\nIKASTEGI HONETAN IRAUNGITZEKO\\n\\nIraungitzear
  dauden ikasgai deialdiak bigarren lauhilekoko ikasgai bati dagozkionak izango dira
  (maiatza-uztaila). Irakaskuntza zegoenean, lehenengo lauhilekoan ematen zituzten
  ikasgaientzako deialdiaren aurrerapena eskatu ahal izango da.\"", "\"PERSONAS QUE
  HAN SOLICITADO LA ADQUISICI\u00d3N EN PROPIEDAD DE ALGUNA DE LAS VIVIENDAS VACANTES
  DE LA UE-02 DE ARRATZU.\\n\\nSOLICITUDES Y SUBSANACIONES\\n\\nLas siguientes personas
  que han solicitado la compra de vivienda en propiedad dentro del plazo se\u00f1alado
  por las bases cumplen todas las condiciones y no deben presentar documento alguno:\\n\\n-
  LEIRE MEABE AGIRRE ETA ANDER UBERUAGA LARRUSKAIN.\\n\\nSin embargo, las siguientes
  personas que han solicitado la compra de vivienda en propiedad deber\u00e1n presentar
  los siguientes documentos en el plazo de 5 d\u00edas h\u00e1biles a contar desde
  el d\u00eda de publicaci\u00f3n de esta relaci\u00f3n en el Tabl\u00f3n de Anuncios
  del Ayuntamiento y la p\u00e1gina web de Arratzu, con arreglo al art\u00edculo 8
  de las bases.\\n\\n1.- PEDRO JAVIER URIBARRI URIAGUERECA.\\n\\n- Certificado negativo
  emitido por la Hacienda Estatal (Plaza Moyua-Bilbao) de ser titular de bienes inmuebles.
  (Art\u00edculo 6.3.1 de las Bases).\\n\\n- Los solicitantes deber\u00e1n de presentar
  en el momento de la solicitud, certificaci\u00f3n bancaria acreditativa de la solvencia
  financiera para la concesi\u00f3n del cr\u00e9dito hipotecario suficiente.\\n\\n2.-
  IGOR GOIRIENA GONDRA ETA AMAIA URIBE ASTORQUIA.\\n\\nBiek agiri hau aurkeztu behar
  dute:\\n\\n- Estatuko Ogasunak (Bilboko Moyua plazakoak) ondasun higiezinen titulartasunik
  eza egiaztatzeko egindako ziurtagiria. (Baseak 6.3.1 artikulua).\\n\\nBaita ere,
  bien izenean batera egin baitute eskaera, hurrengo ziurtagiri hau aurkeztu behar
  dute:\\n\\n-Eskabidea aurkezterakoan, eta bakarrik etxebizitza erosteko asmoa agertzen
  duten eskatzaleek, bankuaren ziurtagiri bat aurkeztu behar dute, egiaztatzeko kaudimen
  finantzario nahikoa dutela etxebizitza eta eranskinak eskuratzeko behar adinako
  hipoteka-kreditu bat eman diezaieten. Hori ez da oztopo Arratzuko Udalak eska diezaien
  beharrezko deritzentz beste dokumentu gehigarri batzuk aurkezteko. (Baseak 6.5.D
  artikulua).\\n\\n2.- IGOR GOIRIENA GONDRA Y AMAIA URIBE ASTORQUIA.\\n\\nLos dos
  deber\u00e1n presentar el siguiente documento:\\n\\n- Certificado negativo emitido
  por la Hacienda Estatal (Plaza Moyua-Bilbao) de ser titular de bienes inmuebles.
  (Art\u00edculo 6.3.1 de las Bases).\\n\\nDel mismo modo, a nombre de los dos pues
  han hecho la solicitud conjuntamente, deber\u00e1n presentar la siguiente documentaci\u00f3n:\\n\\n-
  Los solicitantes deber\u00e1n de presentar en el momento de la solicitud, certificaci\u00f3n
  bancaria acreditativa de la solvencia financiera para la concesi\u00f3n del cr\u00e9dito
  hipotecario suficiente para la adquisici\u00f3n de la vivienda y anexos \u2013para
  aquellas solicitudes que opten por la adquisici\u00f3n de vivienda- y sin que ello
  obste para que el Ayuntamiento de Arratzu pueda solicitar la presentaci\u00f3n de
  cualquier otra documentaci\u00f3n complementaria que entienda necesaria. (Art\u00edculo
  6.5.d de las bases).\\n\\n3.- GARAZI IBARRA REMENTERIA ETA JON INAZIO JAUREGI GERRIKAETXEBARRIA.\\n\\nBien
  izenean, batera egin baitute eskaera, hurrengo ziurtagiri hau aurkeztu behar dute:\\n\\n-
  Eskabidea aurkezterakoan, eta bakarrik etxebizitza erosteko asmoa agertzen duten
  eskatzaleek, bankuaren ziurtagiri bat aurkeztu behar dute, egiaztatzeko kaudimen
  finantzario nahikoa dutela etxebizitza eta eranskinak eskuratzeko behar adinako
  hipoteka-kreditu bat eman diezaieten. Hori ez da oztopo Arratzuko Udalak eska diezaien
  beharrezko deritzten beste dokumentu gehigarri batzuk aurkezteko. (Baseak 6.5.D
  artikulua).\\n\\nEra berean, agiriak aurkeztu behar dituzten eskatzaleei oharra
  egiten zaie - Baldintza orriaren 8. artikuluarekin bat-haiek ez badituztela esandako
  epean ekartzen euren eskabidea artxibatu daitekeela alkatetza dekretu bidez.\\n\\n3.-
  GARAZI IBARRA REMENTERIA Y JON INAZIO JAUREGI GERRIKAETXEBARRIA.\\n\\nA nombre de
  los dos pues han hecho la solicitud conjuntamente, deber\u00e1n presentar la siguiente
  documentaci\u00f3n:\\n\\n- Los solicitantes deber\u00e1n de presentar en el momento
  de la solicitud, certificaci\u00f3n bancaria acreditativa de la solvencia financiera
  para la concesi\u00f3n del cr\u00e9dito hipotecario suficiente para la adquisici\u00f3n
  de la vivienda y anexos \u2013para aquellas solicitudes que opten por la adquisici\u00f3n
  de vivienda- y sin que ello obste para que el Ayuntamiento de Arratzu pueda solicitar
  la presentaci\u00f3n de cualquier otra documentaci\u00f3n complementaria que entienda
  necesaria. (Art\u00edculo 6.5.d de las bases).\\n\\nDel mismo modo, se advierte
  a los/as solicitantes que deban presentar documentos que de acuerdo con el art\u00edculo
  8 de las Bases si las mismas no lo presentan en el plazo se\u00f1alado se podr\u00e1
  archivar su solicitud mediante decreto de alcald\u00eda.\\n\\nArratzun, 2014ko apirilaren
  30ean\\n\\nALKATEA,\\n\\nLoiola auzoa, 2 \u2022 48383 ARRATZU (BIZKAIA) \u2022 Tel.:
  946 256 884 \u2022 Fax: 946 255 404 \u2022 e-mail: email@example.com\"", "\"ERDIZ,
  BELATE ETA LIZARTZUKO NEKAZARIENDAKO OHARRA\\n\\nErdiz, Belate eta Lizartzuko nekazariei
  bilkura deia egin zitzaien martxoaren 28an Baztango Udaletxean bildu eta ondoko
  kontu hauetaz solasteko:\\n\\n- Zezenak bazkalekuetan.\\n- Lanak bazkalekuetan.\\n-
  Lepokoak behiendako.\\n- Galde-eskeak.\\n\\nEgun hartan 30 nekazari etorri ziren
  bilerarat eta ondoko erabakiak hartu ziren:\\n\\nZezenak bazkalekuetan: laz erabaki
  ziren irizpideak aipatu ziren eta berdin segituko da. Hauek dira irizpideak:\\n\\nAspinak
  uzten dituen zezenak 2 dira. Bat Erdizen azienda sartzen duen nekazari batek dauka
  eta bertzea Belaten azienda sartzen duen nekazari batek. Ikusita Aspinak ez dituela
  zezen gehiago utzikoa eta nekazariek bazkalekuetan zezenak egotea nahi dutela, ondoko
  erabakiak adostu ziren:\\n\\n1. Erdizen 4 zezen sartzen ahalko dira eta Belaten
  3 zezen.\\n\\nNOTA PARA LOS GANADEROS DE ERDIZ, BELATE Y LIZARTZU\\n\\nSe convoc\u00f3
  a los ganaderos de Erdiz, Belate y Lizartzu a una reuni\u00f3n el 28 de marzo en
  el Ayuntamiento de Baztan para tratar los siguientes temas:\\n\\n- Toros en los
  pastizales.\\n- Trabajos en los pastiza-les.\\n- Collares para las vacas.\\n- Ruegos
  y preguntas.\\n\\nA la reuni\u00f3n acudieron 30 ganaderos y se tomaron los siguientes
  acuerdos:\\n\\nToros en los pastizales: Se citaron los criterios que se acordaron
  el a\u00f1o pasado. Los criterios son los siguientes:\\n\\nAspina ha cedido 2 toros.
  Uno de ellos lo tiene un ganadero que introduce el ganado en Erdiz, y el otro un
  ganadero que lleva el ganado a Belate. Viendo que Aspina no ceder\u00e1 ning\u00fan
  toro m\u00e1s y que los ganaderos quieren que los toros est\u00e9n en los pastizales,
  se tomaron los siguientes acuerdos:\\n\\n1. En Erdiz se podr\u00e1n introducir 4
  toros y en Belate 3.\\n\\n2. Como los de Aspina son solo 2, los particulares podr\u00e1n
  llevar sus toros (3 a erdiz y 2 a Belate).\\n\\n3. Los ganaderos interesados en
  introducir los toros en los pastizales lo tendr\u00e1n que comunicar al Ayuntamiento
  antes del 17 de mayo.\\n\\n4. Tendr\u00e1n prioridad los toros de raza Piren\u00e1ica.
  Si no se rellena el cupo con toros de raza Piren\u00e1ica, se podr\u00e1n introducir
  toros de otras razas.\\n\\n5. El d\u00eda 21 de mayo se proceder\u00e1 a examinar
  la lista de los ganaderos que est\u00e1n interesados en introducir toros, y en caso
  de que se hayan apuntado m\u00e1s toros de los que se pueden introducir, se har\u00e1
  un sorteo entre ellos.\\n\\n6. Desde el a\u00f1o pasado a los ganaderos que tienen
  toros de Aspina se les cede gratuitamente la cuota de 12 vacas a cambio de ocuparse
  todo el a\u00f1o del toro.\\n\\n7. A los ganaderos que introduzcan toros particulares
  se les ceder\u00e1 gratuitamente la cuota de seis vacas.\\n\\nTrabajos en los pastizales:
  Como se hizo el a\u00f1o pasado, este a\u00f1o tambi\u00e9n se repasar\u00e1 el
  cerramiento y se echar\u00e1 mineral ecol\u00f3gico. Adem\u00e1s, han sido numerosas
  las peticiones de los ganaderos: echar todo uno en las mangas o corralizas de Artesiaga
  y Lizartzu, acondicionar la pista...\\n\\nKonfaren sarrerako pista moldatzea, bazkalekuetako
  askak errepasatzea, Altzaldeko ateka errepasatzea...\\n\\nAkitzeko aipatu, Pitzamarreko
  sarreran korle bat egiteko aukera eztabaidatu zela eta Udaletik aztertuko zela erantzun
  zen. Dena dela, Udaletik oroitarazi zen Nafarroako Gobernuak nekazal azpiegituretarako
  diru-laguntzak kendu zituela eta lan guzti hauen egiteak ahalegin ekonomiko handia
  dakartela.\\n\\nLepokoak behiendako: laz egin zen bileran, nekazarien eskaeretako
  bat, behiendako lepokoak ahalbidetzea izan zen. Hala bada, Udalak, aurren behiak
  lepokoak jarrita sartzeko aukera izanen dela baleztatu zuen. Horretarako, Udalak,
  hainbat lepoko erosi ditu eta aurren behiak bazkalekuetan sartzeko bi modu izanen
  dira: beti bezala su-marka emanda edo lepokoak jarrita. LEPOKOAK NAHI DITUZUENOK,
  FABOREZ JAKINARAZI UDALARI MAIATZAREN 5A BAINO LEHEN!!! Lepokoak debalde emanen
  dira eta azienda bazkalekuetatik ateratzean Udaletxera bueltan ekarri beharko dira.\\n\\nCollares
  para las vacas: En la reuni\u00f3n celebrada el a\u00f1o pasado, una de las solicitudes
  de los ganaderos fue la provisi\u00f3n de collares para el ganado. As\u00ed pues,
  se afirm\u00f3 que este a\u00f1o las vacas podr\u00edan entrar con el collar puesto.
  Para ello, el Ayuntamiento ha comprado numerosos collares y este a\u00f1o habr\u00e1
  dos modos de que las vacas entren en los pastizales: como de costumbre, con la marca
  de fuego, o con el collar puesto. \u00a1LOS QUE DESE\u00c9IS COLLARES COMUNICARLO
  EN EL AYUNTAMIENTO, POR FAVOR, ANTES DEL 5 DE MAYO! Los collares se dar\u00e1n gratuitamente
  y habr\u00e1n de devolverse al Ayuntamiento al sacar el ganado de los pastizales.\\n\\nRuegos
  y preguntas: En este puto\\n\\nBelateko zohikaztegiaz (turberaz) solastu zen batez
  ere. Udaletik adierazi zen, iaz Nafarroako Gobernuko Ingurumen saileko arduradunekin
  bilera bat egin zela. Bilera hartan, Bartzango Udaletik, Belateko nekazariekin bilera
  bat egin zela aipatu zitzaien eta eskatu egin zitzaien zohikaztegiaren iskindegia
  behar den bezala jartzeko. Ikusita iskindegiaarekin arazoak izan direla, aurten
  berriz ere bilera bat egiten da eta iskindegia berritzeaz gain, belar-sastrakak
  garbitzeko lanak ere egiteko eskatuko zaie.\\n\\nse trat\u00f3 principalmente el
  tema de la turbera de Belate. Se expone desde el Ayuntamiento que el a\u00f1o pasado
  se celebr\u00f3 una reuni\u00f3n con los responsables del Departamento de Medio
  Ambiente del Gobierno de Navarra. En dicho encuentro el Ayuntamiento inform\u00f3
  de la realizaci\u00f3n de una reuni\u00f3n con los ganaderos y se les solicit\u00f3
  que colocaran un cerramiento en condiciones alrededor de la turbera. Viendo que
  este a\u00f1o ha vuelto a haber problemas, se les volver\u00e1 a solicitar una reuni\u00f3n
  y se les pedir\u00e1 que renueven el cerramiento y realicen labores de desbroce.\\n\\nBatzango
  Udaleko mendi, nekazaritza eta ingurugiro zinegotzia\\n\\nConcejal de Medio Ambiente,
  Ganader\u00eda y Montes\\n\\nJon Elizetxe Bidegarai\"", "\"VITORIA-GASTEIZKO UDALA\\n\\nHIRIGINTZA\\n\\nPlangintza
  eta Hirigintza Antolamendua Gauzatzea\\n\\nBehin betiko onespena ematea Gasteizko
  udalerriko Hiri Antolamenduko Plan Orokorraren xedapen aldaketari, zein Zuhatzuko
  menpeko toki-erakundeko lerrokadura planoan eta kalifikazio xehatuan atzemandako
  akatsak zuzentzeko baita\\n\\nHauxe erabaki zuen udalbatzak 2016ko apirilaren 22an
  egindako ohiko bilkuran:\\n\\nGaia: Behin betiko onespena ematea Gasteizko udalerriko
  Hiri Antolamenduko Plan Orokorraren xedapen aldaketari, zein Zuhatzuko menpeko toki-erakundeko
  lerrokadura planoan eta kalifikazio xehatuan atzemandako akatsak zuzentzeko baita.\\n\\nErabaki-proposamena\\n\\nZuhatzu
  menpeko toki-erakundeko lerrokadura planoan eta kalifikazio xehean antzemandako
  akatsak zuzentzeko Gasteizko Udalerriko Hiri Antolamenduko Plan Orokorra aldatzeko
  egin den proiektua ikusi da, zeina Udaleko Hirigintza Saileko Plangintzarako eta
  Hirigintza Antolamendua Gauzatzeko Zerbitzuak idatzi baitu.\\n\\n2001ean, Zuhatzu
  menpeko toki-erakundean urbanizazio-proiektu bat gauzatu zenean, 00592051-1305-0014
  eta 0059-2051-1305-0054 katastro-erreferentzia duten lursailen barrualdeko zatiak
  laga zituzten, 1990eko Gasteizko Hiri Antolamenduko Plan Orokorraren antolamendu
  xehatuaren arabera zuzkidura publikoetarako baitziren, bideetarako, zehazki.\\n\\nOndoren,
  indarrean dagoen Hiri Antolamenduko Plan Orokorrean (2003koa), lagatako lur azalerak
  OR-10 bizitegirako ordenantzaren barruan kalifikatu zituzten.\\n\\nUdal honetako
  Alkatetzaren eta Erakunde Harremanen Saileko Nekazaritza Eremuaren Zerbitzuak 2015eko
  irailaren 22an sinatutako txostenaren arabera, 2003ko Gasteizko Hiri Antolamenduko
  Plan Orokorra aldatu beharra dago, Zuhatzu menpeko toki-erakundeko lerrokadura planoa
  eta kalifikazio xehatua egindako urbanizazio lanei doitzeko.\\n\\nHorren haritik,
  Gasteizko Hiri Antolamenduko Plan Orokorraren aldakuntza honen helburua da lagatako
  lur azalera horien kalifikazio xehatua aldatzea, OR-10 bizitegirako ordenantzatik
  bide sarera.\\n\\nBeraz, aldakuntza proiektu honek ez du Hiri Antolamenduko Plan
  Orokorreko egiturazko antolakuntza zehaztapenik aldatzen, bertako antolamendu xehatuko
  zehaztapenen bat bakarrik aldatzen du.\\n\\nGasteizko Hiri Antolamenduko Plan Orokorraren
  xedapen-aldaketa horri dagokion proiektuan jasota dago oroitidazkia, non honako
  hauek aipatzen baitira: haren xedea, ekimena, haren egokiera eta beharraren justifikazioa
  eta indarrean dagoen plangintza eta proposatutakoa, baita planoak eta dagokion dokumentazio
  grafikoa ere.\\n\\nTokiko Gobernu Batzarrak 2016ko urtarrilaren 29an egindako bilkuran
  eman zitzaion hasierako onespena Plan Orokorraren xedapen aldaketa horri, Zuhatzu
  menpeko toki erakundeko lerrokadura planoan eta kalifikazio xehean antzemandako
  akatsak zuzentzeko helburua baitu, idatzitako proiektuarekin \u2013dosierrean jasoa\u2013
  bat etorriz.\\n\\n2016ko maiatzaren 16a, astelehena  \u2022  55 zk.\\n\\nII - ARABAKO
  LURRALDE HISTORIKOAREN TOKI ADMINISTRAZIOA\\n\\nUdalbatzaren erabaki hori 2016ko
  otsailaren 15eko ALHAOn (18. zk) eta 2016ko otsailaren 5eko Diario de Noticias de
  Alava egunkarian argitaratu zen, eta aldakuntzari buruzko dokumentazioa hilabete
  batez jendaurrean jarri. Ez da inolako alegaziorik aurkeztu denbora horretan.\\n\\nAplikagarri
  den legediari dagokionez, Euskal Autonomia Erkidegoko Lurzoruari eta Hirigintzari
  buruzko ekainaren 30eko 2/2006 Legearen 61. eta 62. artikuluek plan orokorraren
  eduki substantiboa eta hori gauzatzeko beharrezko den gutxieneko dokumentazioa zehazten
  dituzte, eta plan orokorraren aldakuntzak antzeko dokumentuetan formalizatuko dira,
  edukia aldakuntzaren xedera egokituta.\\n\\n2/2006 Legea garatzen duten premiazko
  neurriei buruzko ekainaren 20ko 105/2008 Dekretuaren 30. artikuluan ezartzen denaren
  arabera, plangintza orokorrean integraturiko antolakuntza xehatua aldatu egin ahalko
  da plangintza orokorraren aldakuntzaren figura baliatuz, besteak beste, eta horretarako
  2/2006 Legearen 95., 96. eta 97. artikuluetan araututako prozedura ezartzen du.\\n\\nUdalbatzari
  dagokio hirigintzako legediak aurreikusitako planen nahiz bestelako tresnen udal
  tramitazioari amaiera ematen dion onespena ematea, Toki Jaurbidearen Oinarriak arautzen
  dituen 7/1985 Legeak\u2014Tokiko Gobernua Eraberritzeko Neurriei buruzko 57/2003
  Legeak osatua\u2014 123.1.i artikuluan ezarritakoaren ildotik.\\n\\nProposatzen
  den antolamendu aldaketaren ildotik \u2014dosierraren parte diren hirigintza-agirietan
  justifikatzen da horren beharra eta egokiera\u2014, aipatutako arauak aintzat harturik
  eta Toki Jaurbidearen Oinarriei buruzko 7/1985 Legeak \u2014abenduaren 16ko Tokiko
  Gobernua Eraberritzeko Neurriei buruzko 57/2003 Legeak osatua\u2014 122.4 a) artikuluan
  aitortzen dion aginpidea baliaturik, hauxe proposatzen dio Hirigintzako Irizpen
  Batzordeak Udalbatzari:\\n\\nErabakia\\n\\n1. Gasteizko udalerriko Hiri Antolamenduko
  Plan Orokorraren xedapen aldaketa bat \u2013zeinak izaera xehatua baitu\u2013 behin
  betiko onestea, Zuhatzu menpeko toki-erakundeko lerrokadura planoan eta kalifikazio
  xehatuan atzemandako akatsak zuzentzeko, Gasteizko Udaleko Hirigintza Saileko Plangintza
  eta Hirigintza Antolamendua Gauzatzeko Zerbitzuak idatzitako proiektuarekin bat
  etorriz, zeina dosierrean jaso baita.\\n2. Erabaki hau ALHAOn argitaratzea, Lurzoruari
  eta Hirigintzari buruzko ekainaren 30eko 2/2006 Legearen 89.5. artikuluak xedatutakoaren
  ildotik.\\n3. Erabaki honen kontra, amaiera ematen baitio administrazio-bideari,
