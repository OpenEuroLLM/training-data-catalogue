sample: '["\"Alcalde - Alkatea\\n\\nD. Miguel de los Toyos Nazabal jauna.\\n\\nTenientes
  de Alcalde - Alkate Ordeak\\n\\nD\u00f1a. Mar\u00eda Jos\u00e9 Teller\u00eda Etxeberria
  andrea.\\n\\nD. Arcadio Benitez D\u00e1vila jauna.\\n\\nD\u00f1a. Esther Kareaga
  Olano andrea.\\n\\nD. Eneko Andueza Lorenzo jauna.\\nD. Pedro Escribano Ruiz de
  la Torre jauna.\\n\\nD\u00f1a. Mar\u00eda Arrate Gallastegui Oyarzabal andrea.\\n\\nD.
  Jos\u00e9 Luis Vall\u00e9s Molero jauna.\\n\\nConcejales - Zinegotziak\\n\\nD\u00f1a.
  Ana Mar\u00eda Rodr\u00edguez Fouz andrea.\\n\\nD. Igor Aldalur Zendoia jauna.\\nD.
  Josu Cristobal Churruca jauna.\\nD. Gorka Novoa Aguirregomezkorta jauna.\\n\\nD\u00f1a.
  Leire Abanzabalegui Aranguren andrea.\\n\\nD\u00f1a. Nerea Castro S\u00e1nchez andrea.\\n\\nD\u00f1a.
  Igone Lamarain Cobo andrea.\\n\\nD\u00f1a. Eva Juez Garmendia andrea.\\n\\nD. I\u00f1aki
  Zuloaga Alberdi jauna.\\n\\nD\u00f1a. Mar\u00eda Luz Balenziaga Gisasola andrea.\\n\\nD.
  Javier Zorrakin Berrizbeitia jauna.\\n\\nD\u00f1a. Maria Carmen Larra\u00f1aga Maiztegui
  andrea.\\n\\nD\u00f1a. Sof\u00eda V\u00e1zquez Gon\u00e7alves andrea.\\n\\nSecretaria
  General - Idazkari Orokorra\\n\\nD\u00f1a. Arantzazu Ech\u00e1niz Petralanda andrea.\\n\\nEibarko
  hirian, bi mila eta hamabosteko ekainaren hamarrean, goizeko hamabiak izanik, Jardunean
  dagoen Udal Batzarra bildu zen bilera berezian, Udaletxeko Batzar Aretoan goian
  aipaturiko jaun/andreek osatuta.\\n\\njaunak eta anderea ez dira etorri.\\n\\nJarduneko
  Alkate jaunak bilerari hasiera eman dio eta eguneko aztergaiaren atal bakarra irakurri
  da.\\n\\nATAL BAKARRA\\n\\n2015eko maiatzaren 22ko eta 2015eko maiatzaren 15eko
  bilerei zegozkion akten zirriborroa ontzat ematea.\\n\\n2015eko maiatzaren 22ko
  eta 2015eko maiatzaren 25eko bilerei zegozkion akten zirriborroak botazioan jarrita,
  etorri direnek aho batez ontzat eman dute eta akta bezala utzi.\\n\\nEta bilerak
  beste xederik ez zuenez, Jarduneko Alkateak amanera eman zion eguerdiko XXX eta
  XXX.\\n\\nGuzti horren akta egin da ondoren, denak sinatu dutelarik XXX orrian,
  eta nik,\\n\\nEn la Ciudad de Eibar, a diez de junio de dos mil quince y siendo
  las doce horas, se reuni\u00f3 en sesi\u00f3n extraordinaria el Pleno Municipal
  en funciones en el Sal\u00f3n de Plenos de la Casa Consistorial, formado por los/las
  se\u00f1ores/as anteriormente mencionados/as.\\n\\nNo asisten:\\n\\nEl Sr. Alcalde
  en funciones declara abierta la sesi\u00f3n y se procede a la lectura del \u00fanico
  punto del Orden del D\u00eda.\\n\\nPUNTO UNICO\\n\\nAprobaci\u00f3n del Borrador
  de las Actas correspondiente a las sesiones de 22 de mayo de 2015 y de 25 de mayo
  de 2015.\\n\\nSometido a votaci\u00f3n los Borradores de Actas correspondientes
  a las sesiones de 22 de mayo de 2015 y de 25 de mayo de 2015, se aprueban por unanimidad
