  o impugnarse directamente, en el plazo de dos meses, ante el Juzgado de lo Contencioso-Administrativo
  de San Sebasti\u00e1n. Todo ello sin perjuicio de la interposici\u00f3n de cualquier
  otro recurso que se estime conveniente.\\n\\nAzpeitia, a 13 de mayo de 2022.\u2014La
  alcaldesa, Nagore Alkorta Elorza. (3212)\\n\\nLG.:S.S.1-1958\"", "\"(The Hustler)\\n\\nLABURPENA\\n\\nEddie
  Felson (Paul Newman) moralik gabeko gazte harroputza da. Ia egun osoa ematen du
  billar aretoetan. Bertara doan edozein inozoren aurka jokatzen duenean, sosik gabe
  uzten du gizagaixoa. Jokoan hoberena bera dela erakutsi nahian, \\\"Minnesotako
  gizena\\\" ezizenez ezaguna den jokalariaren bila hasiko da, jokalari onenetan onena
  omen dena, haren aurka jokatu eta irabazteko asmoz.. Bert Gordon (Scott, oso jokalari
  oldarkorra) Gleasonen alde jarriko da, eta horrek eragin handia izango du jokoan.
  Eddiek norgehiagoka honetan irabazle ateratzeko aukera dauka, baina bere auto-estimu
  baxua dela-eta, galdu egingo du eta lur jota geratuko da. Emakume bakarti baten
  maitasunak (Laurie) atera lezake bizimodu petral horretatik, baina Eddiek ez du
  Minnesotako Gizenaren aurka irabazi arte etsiko, eta bost axola horretarako larrutik
  ordaindu behar badu ere.\\n\\nKRITIKA\\n\\nArgazkilaritza onenaren eta zuzendaritza
  artistiko onenaren Oskar sarien irabazlea\\n\\n\\\"Zalantzarik gabe, bikaina, filmetan
  nire kuttunetako bat\\\"\\n\\nCarlos Boyero: El Mundo egunkaria\\n\\n\\\"Galbideari
  buruzko katalogorik onena\\\"\\n\\nJavier Oca\u00f1a: Cineman\u00eda\\n\\n\\\"Film
  klasiko paregabea. Arrakastaren Estatu Batuetako filosofiaren inguruan egin den
  erradiografia onenetako bat\\\"\\n\\nFernando Morales: El Pa\u00eds egunkaria\\n\\nFITXA
  TEKNIKO ETA ARTISTIKOA\"", "\"2017-01-31ko OHIKO UDALBATZA\\n\\nIrurako udaletxean,
  2017ko urtarrilaren 31n, arratsaldeko 19:30ean, lehen deialdia egin ondoren, Udalbatza
  bildu da ohiko osoko bilkura egiteko. Mahaiburua Ana Jes\u00fas Leunda Gurruchaga
  izan da, udaleko alkatelehendakaria, eta zinegotzi hauek agertu dira gaiak aztertzeko:\\n\\n-Azaldu
  diren EAJ/PNV udal-taldeko zinegotziak: Jesus Maria Alonso Insausti, Jose Ramon
  Epelde Irizar, Maria Cristina Santos San Sebastian eta Marta Castrillo Iturralde.\\n\\n-Azaldu
  ez diren EAJ/PNV udal-taldeko zinegotziak: inor ez.\\n\\n-Azaldu diren EH BILDU
  udal-taldeko zinegotziak: Ainhoa Ugalde Gorostiaga, Olaia Nieto Legarra, Mikel Gotzon
  Iturbe Saizar eta Jose Ignacio Imaz Bengoechea.\\n\\n-Azaldu ez diren BILDU udal-taldeko
  zinegotziak: inor ez.\\n\\nMiguel Antonio Arrizabalaga Brusin Udaleko idazkariak
  egin ditu idazkari lanak.\\n\\nAlkateak irekitzat jo du saio publikoa; segituan,
  eta alkatearen baimenarekin, idazkariak jakinarazi du bilera egin daitekeela, bertara
  agertu baita gutxieneko partaide-kopurua, Toki Erregimeneko Oinarriak arautzen dituen
  apirilaren 2ko 7/1985 Legeak eta azaroaren 28ko 2568/1986 Errege Dekretuak, Toki
  Erakundeen Antolakuntza, Funtzionamendu eta Araudi Juridikoaren Erregelamendua onartzen
  duenak, agindutakoa.\\n\\nLEHENENGO GAIA AURREKO AKTAK ONARTZEA (2016-12-13; 2017-01-26).\\n\\nUdalbatzak
  2016ko abenduaren 13ko aktaren zirriborroa onartu du, aho batez.\\n\\nBIGARREN GAIA\\n\\nALKATETZAREN
  DEKRETU HAUEN BERRI EMATEA: 2016/220 DEKRETUTIK 2016/241 DEKRETURA ARTE ETA 2017/1
  DEKRETUTIK 2017/18 DEKRETURA ARTE.\\n\\nAlkateak 2016/220 dekretutik 2016/241 dekretura
  arteko eta 2017/1 dekretutik 2017/18 dekretura artekoen berri eman dio udalbatzari.\\n\\nUdalbatza
  jakinaren gainean geratu da.\\n\\nAinhoa Ugalde zinegotziak galdetu du ea udaleko
  garbitzaileak auzia jarri duen Udalaren aurka.\\n\\nIdazkariak adierazi du langileak
  Gizarte Segurantzaren aurka jarri duela auzia, baja erregimena aldatzeko, hau da,
  baja arrunta izan ordez lanistripu edo lan-gaixotasunagatik izan dadin.\\n\\nAlkateak
  adierazi du gaur operatu dutela.\\n\\nHIRUGARREN GAIA\\n\\nIRURAKO UDALEKO LANGILEEN
  2017RAKO EGUTEGIA ONARTZEA, HALA BADAGOKIO.\\n\\nUdal honetako langileen 2017rako
  lan-egutegia onartu beharra dago.\\n\\nUdalbatzak, aho batez, hau onartu du:\\n\\nERABAKIA\\n\\n1.-Udal
  honetako langileen 2017rako lan-egutegia onartzea, honako lanarloetakoak:\\n-Bulego
  orokorra.\\n-Obra eta zerbitzuen brigada.\\n-Hirigintza.\\n-Kultura\\n-Euskara zerbitzua\\n-Gizarte
  zerbitzuak.\\n2.-Gainera araudi orokorrak hauek izango dira:\\na) Urteko lanaldiak
  1.592 ordu izango ditu, dedikazio partziala duten langileentzat izan ezik. Azken
  hauei dagokien murrizketa partziala egingo zaie. Aipatutako ordu-kopurua baino txikiagoa
  azaltzen den egutegien kasuan, guztizko kopurura iritsi arteko gainerako orduak
  bilerekin, aparteko orduekin osatuko dira.\\nb) Asteko ordutegi normalizatua: 35
  ordu, 8:00etatik 15:00etara izango da.\\nc) Egutegia aurkeztu ez dutenek bulego
  orokorreko egutegia hartuko dute erreferentzia gisa.\\nd) Oporrak: 24 lanegun, astelehenetik
  ostiralera.\\ne) Norberaren arazoetarako lizentzia egunak: urteko lan-ordutegiko
  6 egun.\\nf) Antzinatasun egunak: seigarren hirurtekoa betetzean, bi egun gehiago,
  eta zortzigarrenetik aurrera, hirurteko bakoitzeko egun bat gehiago.\\ng) Jaiegun
  ofizialak, estatukoak, autonomikoak eta tokikoak: 14 jaiegun.\\n\\nLAUGARREN GAIA\\n\\nTOLOSALDEKO
  UDALERRIEN TOKIKO GARAPEN IRAUNKORREKO POLITIKEN SUSTAPENERAKO, TOLOSALDEA GARATZEN
  S.A ETA IRURAKO UDALAREN ARTEAN LANKIDETZA HITZARMENA ONARTZEA, HALA BADAGOKIO.\\n\\nProposatu
  da hitzarmena onartzea, Irurako Udalaren eta Tolosaldea Garatzen S.A.-ren arteko
  harremana arautzeko, Tolosaldeko udalerrietan garapen jasangarriaren inguruko ekimenak
  garatzeko tokiko garapen jasangarriko teknikariak kontratatzeko. Orain proposatu
  da teknikariaren dedikazioa %10 jaistea.\\n\\nHori ikusita, aldeko 5 botorekin eta
  4 abstentziorekin, udalbatzak hau onartu du:\\n\\nLehena.- Aipatu den hitzarmena
  onartzea.\\n\\nBigarrena.- Ana Jes\u00fas Leunda Gurruchaga Alkateari baimena ematea
  hitzarmen hori sinatzeko Irurako Udalaren izenean.\\n\\nAinhoa Ugalde zinegotziak
  adierazi du bere taldea abstenitu egin dela, ez dutelako onuradunik ikusten aldaketa
  honekin.\\n\\nBOSGARREN GAIA KOMUNITATEAREN ALDEKO LANAK EGITEKO ESKAERA.\\n\\nR.
  A. de M. hiritarrak eskatu du zigor penala betetzeko herriarentzako lanak egitea
  Irurako Udalean, baina asteburuetan bakarrik.\\n\\nBaina ikusita asteburuetan ezin
  dela kontrolatu lan horiek betetzen diren edo ez, udal-zerbitzurik ez dagoelako,
  Gizarte Zerbitzuetako batzordeak, 2016ko azaroaren 30ean eginiko bileran, ezezkoa
  emateko proposamena egin du.\\n\\nHori ikusita, Udalbatzak, aho batez,  hau erabaki
  du:\\n\\nERABAKIA\\n\\nUko egitea eskaerari, eskatu diren baldintzak ezinezkoak
  direlako.\\n\\nSEIGARREN GAIA\\n\\nPOLIOMIELITISAK JOTAKO LAGUNENTZAT SOSTENGU MOZIOA.\\n\\nMozio
  hau aurkeztu da:\\n\\n\\\"Poliomilitisak jota izan ziren eta gaur egun ondorio berantiar
  edo post-polio sindromea (PPS), jasatzen\\n\\n\\\"Moci\u00f3n de apoyo a las personas
  que fueron afectadas por la Poliomielitis y que hoy est\u00e1n padeciendo los Efectos
  Tard\u00edos y\\n\\nari diren lagunentzat sostengu mozioa.\\n\\nEuskal Parlamentuko
  talde guztiek, oraintsu, post-polio sindromeak jota daudenen arretarako EZ LEGEZKO
  proposamenaren Transakzioko Zuzenketa aurkeztea onartu zuten, besteak beste ondorengo
  ataletan.\\n\\n1. Euskal Parlamentuak, Osakidetza osasun portaeren gida bat lantzera
  premiatzen du, diagnosi jarraibideak, Neurologi espezialisten arretaz eta errehabilitaziorako
  tratamenduekin post-polio ondorio eta sindromea duten gaixoen arretarako.\\n\\n2.-
  Euskal Parlamentuak Seguritate Sozialari, Post-polio Sindromea aintzat har dezala
  eskatzen dio, eta gaixo bakoitzaren egoera balora dezala bakoitzak ditun kalteetan
  okertzerik eman den, ezintasunaren sakontze bat egon ote den jakiteko.\\n\\nHorregatik
  eskatu nahi dugu:\\n\\n-Euskal Gobernuko Osasun Departamentuari post-polio sindromea
  ORPHA 2492 kodigoan, berau, EERR lez kontsideratua egonik Euskal Gobernuak argitaratutako
  EERR katalogoan sar dezala eskatzen diogu.\\n\\nEspainiako Gobernuari post-polio
  sindromea, mintsu eta gaitasun ezaren eragile kontsidera dezala eskatzen diogu,
  era berean ezgaitasunen balorazio sistema/baremoan sartuaz.\\n\\n-Espainiako Gobernuari,
  abenduaren 4ko RDko 1.go artikulua 1851/2009 alda dezala eskatzen diogu. Bertan\\n\\nS\u00edndrome
  Postpolio (SPP).\\n\\nRecientemente la totalidad de los grupos parlamentarios del
  Parlamento Vasco, aprob\u00f3 presentar una Enmienda de Transacci\u00f3n a la Proposici\u00f3n
  No de Ley sobre la atenci\u00f3n a las personas afectadas por el S\u00edndrome Postpolio
  recogiendo entre otros, los siguientes puntos:\\n\\n1.- El Parlamento Vasco insta
  a Osakidetza a elaborar una gu\u00eda de actuaci\u00f3n sanitaria, pautas diagn\u00f3sticas,
  atenci\u00f3n por especialistas de Neurolog\u00eda y tratamientos de Rehabilitaci\u00f3n
  a los enfermos de secuelas y S\u00edndrome Postpolio.\\n\\n2.- El Parlamento Vasco
  insta a la Seguridad Social a que reconozca el S\u00edndrome Postpolio y proceda
  a valorar el estado de cada afectado, por si el agravamiento de las secuelas que
  padecen fuera constitutivo de calificaci\u00f3n de invalidez.\\n\\nRelacionado con
  dicha Enmienda Transaccional, presentamos a Pleno:\\n\\n-Pedimos al D. de Salud
  del G. Vasco, que el S\u00edndrome Postpolio, al ser una Enfermedad Rara con el
  c\u00f3digo ORPHA 2492, sea a\u00f1adida a la lista de EERR del G. Vasco.\\n\\nPedimos
  al Gobierno de Espa\u00f1a que se considere el S\u00edndrome Postpolio como una
  patolog\u00eda dolorosa, invalidante e incapacitante, incluy\u00e9ndola en el sistema
  de valoraci\u00f3n de la discapacidad.\\n\\n-Pedimos al Gobierno de Espa\u00f1a
  que modifique el art. 1 del RD 1851/2009 de 4 de diciembre, en el que se regula
  la jubilaci\u00f3n ezgaitasuna duten langileen erretiro edo jubilazioa erregulatzen
  da, eta erretiratzeko sasoian, sendagile baten txostenak sostengatuz %45eko ezintasuna
  edukitzea, nahikoa izatea eskatzen da.\\n\\n-Espainiako Gobernuari, moldaketa hauek
  Estatuko Administrazio Zibileko Funtzionarioei aplika diezaietela eskatzen diegu.
  Hauek, Clases Pasivas deituriko erregimenean, kokaturik daude.\\n\\nde los trabajadores
  con discapacidad en el sentido de que la exigencia del grado de discapacidad del
  45% sea \u00fanicamente en el momento de solicitud de jubilaci\u00f3n, previo informe
  m\u00e9dico.\\n\\n-Pedimos al Gobierno de Espa\u00f1a que estas modificaciones tambi\u00e9n
  se apliquen a los Funcionarios de la Administraci\u00f3n Civil del Estado, encuadrados
  en el R\u00e9gimen Especial de la Seguridad Social de los Funcionarios Civiles del
  Estado, dentro del R\u00e9gimen de Clases Pasivas.\\n\\nEPE-Euskadiko Polio Elkartea-,
  FEAPETeko bazkide izanik, Udaletxe honetako Plenoari, gaur internazionalki polioa
  gogoratzen den egunean, poliomielitisdunak aintzat hartuaz publikoki bere babesa
  adieraz diezaien eskatzen diogu.\\\"\\n\\nPEAPET (Federaci\u00f3n Espa\u00f1ola
  de Asociaciones de Polio y sus Efectos Tard\u00edos), y EPE (Euskadiko Polio Elkartea),
  instamos al Pleno de este Ayuntamiento a mostrar su apoyo y reconocer p\u00fablicamente
  a los supervivientes de la poliomielitis con ocasi\u00f3n de la conmemoraci\u00f3n
  del D\u00eda Internacional de la Lucha Contra la Polio.\\\"\\n\\n.\\n\\nUdalbatzak
  aho batez erabaki du mozioa onartzea.\\n\\nZAZPIGARREN GAIA KONTU-HARTZAILEAREN
  TXOSTENAK.\\n\\nTxosten hau jakinarazi da:\\n\\n\\\"2016. EKITALDIAN ORDAINTZEKO
  BATEZ BESTEKO EPEA.\\n\\n2/2012 Lege Organikoak, apirilaren 27koak, Aurrekontu Egonkortasunari
  eta Finantzen Iraunkortasunari buruzkoak, ekarri du batez besteko epea kontzeptua
  (OBE). Kontzeptu honek azaltzen du zor komertziala ordaintzeko erabili den denbora
  edo izan den atzerapena. Horrela Administrazio Publiko guztiek, gardentasun-ariketa
  berri batean, ordaintzeko batez besteko epea argitaratu beharko dute.\\n\\nAtxikita
  dauden orrietan Irurako Udalari 2016ko hiruhilabeteko bakoitzeko ordainketa epeari
  buruzko txostenak jakinarazten dizkizuet.\\n\\nHorren laburpena hau da:\\n\\n-1.
  hiruhilabeteko epea: 1,57 egun.\\n-2. hiruhilabeteko epea: -8,68 egun.\\n-3. hiruhilabeteko
  epea: -10,78 egun.\\n-4. hiruhilabeteko epea: -19,84 egun.\\n\\nKopurua negatiboa
  agertzeak adierazi nahi du jarritako epean baino denbora gutxiagoan ordaintzen direla
  fakturak. Kopuru positiboak, aldiz, denbora gehiagoan ordaintzen direla adierazi
  nahi du.\\n\\nKasu batean agertzen da positibo, nahiz eta lege barruan egon: muga
  30 egunekoa da.\\\"\\n\\nUdalbatza jakinaren gainean geratu da.\\n\\nZORTZIGARREN
  GAIA\\n\\nGALDE-ERREGUAK.- Gai hauek jorratu dituzte:\\n\\na) Ainhoa Ugalde zinegotziak
  galdetu du ea nola dagoen 2017ko Aurrekontuko izapidea, urtarrilaren amaieran gaude
  eta.\\nAlkateak erantzun du prestatzen ari direla, eta prestatuta dagoenean zabalduko
  dutela, eta batzorde informatiboa ospatuko dela udalbatza pasa aurretik.\\n\\nAztertzeko
  beste gairik ez dagoenez, alkateak 19:45ean eman du amaitutzat bilera. Bertan esandako
  guztia aktan jaso dut, eta dena EGIAZTATZEN dut, idazkari gisa.\\n\\nALKATEA\\n\\nIDAZKARIA\"",
  "\"d i ren hauen pantailetan. Zurikeriaren beste adibide bat baino ez, adierazpen-askatasunerako
  sasoi gorriotan.\\n\\nOskar retan ere Big Bro t h e r-en esku sartzea agerian izan
  genuen. Ekitaldian debekua zabaldu zen: kazetariek ez zuten baimenik izan izendapenetan
  zinegile eta aktore beltzen eskasiak sortutako iskanbilari buruz aritzeko. Itsurakeriari
  Stop!\\n\\nEdizio mugatu batean (1.500 ale baino ez) Negu Gorriak-ek plazaratu berri
  duen konpaktoa zentsuraren ondorioa da. U s t e l keria izeneko lana taldearekiko
  elkartasuna adierazi dutenentzako oparia da. 14 kantu zentsuraren atzaparrari aurre
  egiteko. Hasiera: Oker Dabiltza; eta amaiera: Hipokrisiari Stop!!o\\n\\nUNIBERTSITATEA\\n\\nLONTXO
  OIHARTZABAL\\n\\nIKASKETA-PLANGINTZA BERRIAK\\n\\nIrakurleak jadanik badakikeenez,
  aldakuntza eta berrikuntza handiak proposatzen ziren unibertsitateko ikasketen eremuan.
  Aurrekoak baino malguagoak, ikaslearen ikaste-erritmora eta interesetara egokituagoak
  izan beharko lukete plangintza berriek. Oinarrizko eta derrigorrezko ikasgaiekin
  batera hautazkoak ere eskaini beharko litzaizkioke ikasleari. Ikasketetan aurrera
  doan neurrian hautazko ikasgaien kopurua eta portzentaia gehitu egingo litzateke
  gainera.\\n\\nAukeratutako ikasketa-eremuko oinarrizko ezagutzak eta jakintza-gaiak
  aztertzeko eta lantzeko aukerekin batera, eremu h o r ren inguruan ikasle bakoitzak
  izan ditzakeen interes eta jakinmin bereziei ere garapenbide bat ireki nahi izan
  zaie horrela jokatuz. Ikaslearen motibagarritasuna modu egokiagoan eragin daitekeela
  aukera ezberdin horiek eskainiz pentsatu izan da. Eta izan ere, halaxe beharko luke
  izan.\\n\\nUnibertsitatetik pasa den edonork daki nolako itxituraz mugaturik zeuden
  aurreko aldiko ikasketa-plangintzak. Oinarrizko eskolan bezalaxe, urtez urte erabakita
  eta antolatuta zeuden ikasgai guztiak. Edozein haur-eskoletako ordutegia zirudien
  gure unibertsitateko ordutegiak.\\n\\nHori guztia solfan jarri denean, ordea, larritasunak
  eta urduritasunak jo du irakasle bat baino gehiago. Legez ezarrita etorri dira karrera
  bakoitzeko ikasgaiak. Ez dira horien artean agertu hainbat eta hainbat katedradunek
  eta irakasle titularre k urte luzez irakatsi dituzten gaiak. Eta hortxe hasi da
  norg e h i agoka: oinarrizkoak ez badira, derrigorrezko bezala ager daitezela, behintzat,
  fakultateko plangintza berrietan, fakultateek badute-eta oinarrizkoak ez izanagatik
  ere hainbat ikasgairi derrig o r rezkotasuna ezartzeko ahalmena. Eta horrelaxe ezarri
  dira d e r r i g o r rezkotzat landu beharreko ezagutza-ere m u a rekin azal-azaleko
  loturak baino ez dituzten ikasgaiak. Ez da plangintza arrazoitu eta koherente bat
  moldatu; irakasle batzuen intere s partikularrak izan dira gorde nahi izan direnak.\\n\\nModu
  bertsuan jokatu da unibertsitateko zenbait sailetan hautazko ikasgaien zerrendak
  moldatzerakoan ere. Ez zaio e z a g u t z a - e re m u a ren jakintza-egiturari
  begiratu; irakasle bakoitzak lanbidez edo afizio hutsez aurrez prestaturik zuen
  edo zituen gaiak proposatu ditu eta horiek eskaintzen zaizkio ikasleari; jakintza-arloarekin
  loturarik izan edo ez izan, horrek ez du axolarik irakasle eta unibertsitateko sail
  askorentzat.\\n\\nBada gehiagorik ere, ordea. Hautazko ikasgai-kopuru ikaragarriak
  eskaini dira zenbait fakultateetako zenbait sailetako plangintzetan, malgutasunaren
  itxura emateko edo. Sartu dira indarrean plangintza berriak eta aurrera ezin eramana
  sumatzen hasi dira han eta hemen. Ikasgaiak eskaini bai, eskaini dira, baina zeinek
  emanik ez dago orain, eskaini eta proposatu zituenak gehiegi eskaini eta proposatu
  zituelako, edo eskaini eta proposatu zituen irakaslea jada fakultatean ez dagoelako.
  Plangintzei eta ikasleei begirunerik ez dienak ezin eskatuko du errespetorik beretzat!o\\n\\nPLANGINTZA
  BERRIAK ETA EUSKAL ADARREKO IRAKASLEAK\\n\\nAipatu plangintza berriak direla eta
  zaildu egiten zaio bere bete-beharra euskal adarreko hainbat eta hainbat irakasleri.
  Kontuan hartzen bada 24 kredituko lana burutu behar duela irakasle bakoitzak (kreditu
  1= 10 ordu), euskal adarreko taldeak ez direla bikoizten oraindik (salbuespenak
  beti salbuespen), zenbait fakultatetan oinarrizko eta derrigorrezko irakasgaiak
  bakarrik eskaintzen direla euskaraz eta mota horietako irakasgaiak nagusiki 6 eta
  9 kreditutakoak direla, euskaraz irakatsi behar duen irakaslea 3 edo 4 irakasgai
  ezberdin pre s t a t z era beharturik dago urtean zehar. Eta zenbaitetan elkarrekiko
  loturarik ez duten irakasgaiak gainera (ez da salbuespena!).\\n\\nGaur egun ikerkuntzak
  daraman abiadura kontuan harturik eta edozein ezagutza-eremutan argitaratzen diren
  lan-kopuruak begibistan izanik, nahiko lan sortzen zaio irakasle bati \u00abbere
  gaiko\u00bb lanen nondik-norakoari jarraitzen. Zer esanik ez hiru edo lau gai ezberdinetako
  azken emaitzak kontuan hartuz p restatu nahi baldin baditu bere irakas-saioak. Ikerkuntza
  nondik nora dabilen kontrolatu beharra du gutxieneko kalitatez irakatsi nahi duenak.
  Euskal adarreko irakasleoi Euskal Herriko Unibertsitateak eskatzen digun eginkizuna
  ezin da gutxieneko kalitatez bete baldintza horietan. Baina izan, horietxek dira
  irakasle askoren baldintza errealak.\\n\\nGehitu horri guztiari euskaraz idatziriko
  irakas-materialen eta argitalpenen urritasuna eta edonor kontura daiteke egoeraren
  larritasunaz. Herri honetako administraritzako ard u r a d unek eta politikariek
  jabetu beharko lukete lehenik horre t a z , baina erregela berdinez ateratzen dituzte
  beren kontuak horiek oraingoz: 24 kreditu= irakasle bat.\\n\\nE rdal adarreko zenbait
  irakaslek, aldiz (eta hau ere ez da salbuespena), irakasgai bakar bat prestatu behar
  du: bi edo hiru talde paralelori sei edo bederatzi kreditutako irakasgai bat irakastea
  nahikoa du eta. Begibistan izan behar da hirugarren zikloko irakasgai bat (doktoradutzarako
  ikastaroak izenpean ezagutzen direnak) ere ematen dutela irakasle horiek:\\n\\nberaiek
  ikerkuntzaren bidez ondotxo ezagutzen duten gairen bat eta kredituz bikoitzak direnak
  (5 ordu= kreditu bat).\\n\\nEginkizunetan, betebeharretan, ez gabiltza baldintza
  berd inetan; eskubideetan, ordea, parekoak gara: soldatak berd i n a k , oporraldi
  berdinak, etab. Zuzena ote da hori guztia? Diskriminazio baikorraren irizpideak
  ez ote du balio eremu honetarako? Balegoke zer esanik. Badago, behintzat, zertaz
  pentsaturik.o\\n\\nKALITATEA ETA IKASLE-KOPURUAK\\n\\nZiurtasun osoz langabezira
  doazen lizentziatuak eta diplomadunak prestatzen ari da gaur egun Euskal Herriko
  Unibertsitatea (beste asko eta asko bezalaxe). Hala eta guztiz ere uholdeka datoz
  ikasle berriak unibertsitatera. Eta berd i n t a s u n e r a k o ez dakit zein eskubide
  aipatuz, eska dezaten ikasle guztiak onartu nahian gabiltza begi-belarri ezinezko
  ahaleginetan: gogoz kontrako ikasketak egitera behartzen ari gara ehundaka eta ehundaka
  ikasle, ikasle beroien kaltetan eta irakaskuntzaren kaltetan, talde batean inolako
  jakinminik gabeko ikasleak dituzunean talde osoaren martxa oztopatzen baitizute
  horrelakoek. Eta kontu, bigarren edo hirugarren urterako unibertsitatea utziko dizute
  ordurarteko ahalegina ezerezean lagaz.\\n\\nEgia da bizibide duin bat izan ahal
  izateko pre s t a k u n t z a egoki baterako eskubidea duela gizaki orok. Eskubide
  hau, o rdea, ezin gauza dezake unibertsitateak orain datozkion ikasle-kopuruekin;
  ez toki egokirik eta nahikorik, ez baliabide aproposik, ez behar hainbat irakaslerik
  duelako betebehar hori behar bezala burutzeko. Gizarteak unibertsitateari nagusiki
  eskatzen diona, aldiz, beste zerbait da: kalitate handiz prestaturiko goi-mailako
  teknikariak behar ditu gaurko gizarteak; teknik a ren eta aurre r a p e n a ren
  eskakizun berrietara moldatzeko eta egokitzeko gai izango diren goi-mailako teknikariak
  eskatzen zaizkio unibertsitateari industriaren, jakintzaren eta ikerkuntzaren eremuetatik.\\n\\nGoazen
  eran inolaz ere konpondu ezineko gatazka hauxe, nire ustez. Oso maila ezberdinetako
  eta berezituetako langile\\n\\neta teknikariak behar ditu egungo lan-munduak. Lanbide-hezkuntzak
  eta unibertsitateko ikaskuntzek ezin prestatuko dituzte era horretako langile eta
  teknikariak, gaur daudenean jarraituz behintzat. Maila eta ibilbide ugariagoko eta
  bere z i t u a g o e t ako prestaketa-aukerak ireki beharra dago ezinbestean, teknikari-eskola-mota
  ezberdinak sortuz horretarako. Bere interesei eta etorkizunari era egokiagoan erantzungo
  lieketen aukerabideak ikusiko lituzke horrela ikasleak eta ilusio handiagoz ekingo
  lioke prestakuntzari. Ikaslearentzat onura, gizarteare n t z a t abantaila eta unibertsitatearentzat
  egokitasun hobea.\\n\\nHortxe dago, bestela, paradoxa: administrariak eta administrari-laguntzaileak
  prestatzen dituzte lanbide-hezkuntzako ikastegiek; baina administrari edo administrari-laguntzaile
  batek duen eginkizunetarako ekonomi-zientzietan edo enpresa-ikasketetan lizentziatuak
  eskatzera jarri dira administrazio-mundua bera eta kutxak eta banketxeak: langabezian
  dagoen lizentziatu ugari baitago administrari edo administrari-laguntzaile baten
  soldataren truke lan egiteko. Non lan egingo dute unibertsitaterako aukerabiderik
  izan ez eta lanbide-hezkuntzarako irtenbidera jo beharrean aurkitu zirenek?o\\n\\nSOZIOLINGUISTIKA\\n\\nKIKE
  AMONARRIZ\\n\\nUKRAINIA\\n\\nG u rean ez dira oso ugariak Europa ekialdeko hizkuntz
  norm a l i z a z i o - p rozesuei buruz iristen zaizkigun berriak; are gutxiago
  azterketak edo hausnarketak.\\n\\nLlengua i dre t a l d i z k a r i a ren azken
  zenbakian, Oleksander Butsenko izeneko idazle ukrainiarraren \u00abLos aspectos
  ling\u00fc\u00edsticos de la nueva democracia en Ucrania\u00bb artikulua zekarrela
  ikusi-\"", "\"2020ko urriaren 27a, asteartea\\n\\n205\\n\\nMartes, a 27 de octubre
  de 2020\\n\\nTOKI ADMINISTRAZIOA\\n\\nOIAR TZU NGO UDALA\\n\\nOiar tzu ngo GUR-1C
  eremuko xehetasun azterketa\\n\\nUdalaren Osoko Bilkurak, 2020ko irailaren 30ean
  egindako bilkuran, Josu Azpeitia Zabaleku jaunak aurkeztu eta Ibon Salaberri arkitektoak
  ida tzi tako \u00abOiar tzu ngo GUR-1C eremuko Xehetasun Azterketa, bigarren moldaketa\u00bb
  dokumentua onartu zuen behin betikoz.\\n\\nErabaki hau behin betikoa da eta administrazio
  bidea amai tzen du. Nahi izanez gero, Administrazioarekiko Auzi Errekur tso a aurkez
  daiteke Euskadiko Autonomia Erkidegoko Justiziako Auzitegi Nagusian, Administrazioarekiko
  Auzietako Salan, bi hilabeteko epean, erabaki hau argitaratu eta biharamunetik hasita.\\n\\n2/2006
  Legearen 89.3 artikulua betez, Xehetasun Azterketaren ale bat igorri da Gi puz koa
  ko Foru Aldundira, Hirigin tza ko Plangin tza ren Erregistro Administratiboan sar
  tze ko.\\n\\nOiar tzu n, 2020ko urriaren 8a.\u2014Alkatea.\\n\\n(5377)\\n\\nERANSKINA\\n\\n2.
  ALDAKETA PROPOSAMENA\\n\\nProposa tzen den aldaketak, 2020ko mar txo ak 2ko txos
  tenari eran tzu ten dio:\\n\\nHirugarren puntuan ager tzen den hi tzar mena presta
  tzen den heinean, 1., 2. eta 4. puntuak justifika tzen dira.\\n\\n\u2014 4. puntua:\\n\\n2019ko
  abenduak 4an AESAk (Agencia Estatal de Seguridad A\u00e9rea) Xehetasun Azterketa
  jaso zuen.\\n\\n2020ko urtarrilak 31ean, E19-4242 espediente zenbakidun txos tena
  bidal tzen du non aldeko eran tzu na ematen duen ondorengo terminoetan:\\n\\n\u00abTercero.
  Los servicios t\u00e9cnicos de AESA han comprobado que la construcci\u00f3n proyectada
  y la gr\u00faa torre proyectada no violan las servidumbres de radioel\u00e9ctricas
  ni de operaciones del Aeropuerto de San Sebasti\u00e1n.\\n\\nCuarta. Desde el punto
  de vista de las servidumbres de aer\u00f3dromo, en particular, de la superficie
  de ascenso a despegue, el estudio realizado por los servicios t\u00e9cnicos de esta
  Agencia acredita que la construcci\u00f3n proyectada y la gr\u00faa torre no comprometer\u00e1n
  regularidad de las operaciones en el Aeropuerto de San Sebasti\u00e1n\u00bb.\\n\\n\u2014
  2. puntua:\\n\\nUdaleko txos tenak bigarren puntuan dio:\\n\\n\u00abZoru publikoan
  egiten den ibilgailuen sotoko sarrera arrapala orube pribatuaren barruan sartu behar
  da. Ordenan tze tako 41 art. \u2026 eraikinaren barrualdean kokatutako sarbide arrapala
  bateratua badute.\u00bb\\n\\nDokumentazio grafikoan ikus daitekeenez, garajeetan
  sar tze ko arrapala sartu da par tze la pribatu resultantearen eremuaren barne beti
  ere 3.000 m\u00b2-ko azalera gainditu gabe.\\n\\nwww.gipuzkoa.eus\\n\\n3\\n\\nADMINISTRACI\u00d3N
  LOCAL\\n\\nAYUNTAMIENTO DE OIAR TZUN\\n\\nEstudio de Detalle del \u00e1rea GUR-1C
  de Oiar tzun\\n\\nEl Pleno del Ayuntamiento, en sesi\u00f3n ordinaria celebrada
  el d\u00eda 30 de septiembre de 2020, aprob\u00f3 definitivamente el documento \u00abEstudio
  de Detalle del \u00e1rea GUR-1C de Oiar tzun, segun da adaptaci\u00f3n\u00bb, redactado
  por el arquitecto Ibon Salaberri y promovido por el Sr. Josu Azpeitia Zabaleku.\\n\\nEl
  precedente acuerdo es definitivo y pone fin a la v\u00eda administrativa, se podr\u00e1
  interponer recurso Contencioso-Administrativo en el plazo de dos meses, ante la
  Sala de lo Contencioso Administrativo del Tribunal Superior de Justicia del Pa\u00eds
  Vasco, a partir del d\u00eda siguiente al de la publicaci\u00f3n del presente anuncio.\\n\\nEn
  cumplimiento del art\u00edculo 89.3 de la Ley 2/2006 se ha remitido un ejemplar
  del Estudio de Detalle a la Diputaci\u00f3n Foral de Gi puz koa para su inclusi\u00f3n
  en el Registro Administrativo de Planeamiento Urban\u00edstico.\\n\\nOiar tzun,
  a 8 de octubre de 2020.\u2014El alcalde.\\n\\n(5377)\\n\\nANEXO\\n\\n2.\u00aa PROPUESTA
  DE CAMBIO\\n\\nEl cambio propuesto responde al informe del 2 de marzo de 2020:\\n\\nComo
  se elabora el acuerdo establecido en el tercer punto, se justifican los puntos 1.\u00ba,
  2.\u00ba y 4.\u00ba\\n\\n\u2014 Punto 4:\\n\\nEl 4 de diciembre de 2019, la AESA
  (Agencia Estatal de Seguridad A\u00e9rea) recibi\u00f3 un Estudio Detallado.\\n\\nEl
  31 de enero de 2020 envi\u00f3 el informe n\u00famero E19-4242 en el que respondi\u00f3
  favorablemente en los siguientes t\u00e9rminos:\\n\\n\u00abTercero. Los servicios
  t\u00e9cnicos de AESA han comprobado que la construcci\u00f3n proyectada y la gr\u00faa
  torre proyectada no violan las servidumbres de radioel\u00e9ctricas ni de operaciones
  del Aeropuerto de San Sebasti\u00e1n.\\n\\nCuarta. Desde el punto de vista de las
  servidumbres de aer\u00f3dromo, en particular, de la superficie de ascenso a despegue,
  el estudio realizado por los servicios t\u00e9cnicos de esta Agencia acredita que
  la construcci\u00f3n proyectada y la gr\u00faa torre no comprometer\u00e1n regularidad
  de las operaciones en el Aeropuerto de San Sebasti\u00e1n\u00bb.\\n\\n\u2014 Punto
  2:\\n\\nEl informe del ayuntamiento dice en el segundo punto:\\n\\n\u00abLa rampa
  de entrada al s\u00f3tano de los veh\u00edculos p\u00fablicos se puede acceder desde
  el interior de la parcela privada. art. 41 de las ordenanzas. \u2026 si tienen una
  rampa de acceso unificada ubicada dentro del edificio\u00bb.\\n\\nComo se puede
  apreciar en la documentaci\u00f3n gr\u00e1fica, la rampa de acceso a los garajes
  se ha incluido dentro de la superficie de la parcela privada resultante, siempre
  sin sobrepasar una superficie de 3.000 m\u00b2.\\n\\nLG.:S.S.1-1958\\n\\n1\\n\\n\u2014
  1. puntua:\\n\\nUdaleko txos tenak aurreneko puntuan dio:\\n\\n\u00abProposamenak
  plangin tzak zehaztutako gehienezko eraikigarritasuna gaindi tzen du, sotoko azalera
  berraztertu behar dira\u00bb.\\n\\nDokumentazio grafikoan, XA05 planoan, soto solairuko
  erabilerak zehaztu dira eta honenbestez justifika tzen da bizi tza bakoi tze ko
  30 m\u00b2-ko garajea garatuko dela gehienez ziurtatuz barnekaletik zuzenean garajeetara
  sarrera izango dela.\\n\\nEraikigarritasun konparatua.\\n\\nAurreko proiektuak gara
  tzen zituen 400 m\u00b2/etxe bizi tza ko 4 familia-bakarreko eraikinetan. Guztira
  beraz, 1.600 m\u00b2 lirateke.\\n\\nHAPOak, bere II.6.8.2 atalean dion bezala, GUR-1C
  eremurako justifika tzen den eraikigarritasuna 1.400 m\u00b2-tan uzten da. Ohar
  gisa azal tzen du HAPOak ondorengoa:\\n\\n\u00ab* Egia esateko 1.600 m\u00b2 dira,
  aurreikusitako lau etxe bakoi tze ko 400 m\u00b2 (t) egoi tza erabilerakoa, behin
  1b. taula esan den eren 50 m\u00b2/etxe bizi tza ko (garajea eta beste erabileretarako)
  kenduta\u00bb.\\n\\nAldaketak, beraz, batez bestea egiten du garaje eta beste erabileretako
  azalerak konputazioan sar ez daitezen, horregatik etxe bizi tzen eraikigarritasuna
  1.600 m\u00b2-tik, 1.400 m\u00b2ra jaisten du.\\n\\nBestalde, Araudiaren xede orokorra
  da Etxe bizi tza berriek gu txie nez 2 ibilgailuen tza ko gordelekua izatea par
  tze la barruan. Proposaturiko tipologiak (XA05 planoa) semisoto oina ordena tzen
  du garajeak antola tze ko ahalik eta azalera murriztuena utziz garajeetako \u00abkalea\u00bb
  eratu eta bizi tze tako eskailera nukleoak zein instalazio gelak eta suteen araudia
  bete tze ko bestibuluak ordena tze ko.\\n\\n2 ibilgailu gorde tze ko garaje itxi
  a proposa tzen ditu etxe bizi tza ko. Esandakoak ain tzat hartuta, proposa tzen
  den aldaketak, garajeaz gain, horrelako bizi tza azalerak izango ditu:\\n\\nEtxe
  bizi tza tipologia berbera errepika tzen da 8 bizi tze tan: Behe solairuan gara
  tzen da programa nagusia eta goi solairuan gehi tzen zaizkio logelak:\\n\\nTipologiaren
  garapena (ikus XA05 planoa).\\n\\n\u2014 Behe solairua:\\n\\nAzalera erabilgarria:
  101,68 m\u00b2.\\n\\nAzalera eraikia: 122.60 m\u00b2.\\n\\n\u2014 Piso superior:\\n\\nAzalera
  erabilgarria: 33,13 m\u00b2.\\n\\nAzalera eraikia: 47,40 m\u00b2.\\n\\nHonekin,
  etxe bizi tza bakoi tze ko 170,00 m\u00b2-ko azalera eraikia izango luke. Beraz,
  guztira, 8 etxe bizi tza programak 1.360 m\u00b2 izango lituzke.\\n\\nSoto solairuan
  etxe bizi tza bakoi tze ko 30 m\u00b2ko garaje itxi a garatuko da, bizi tza bakoi
  tze ko 2 ibilgailu gorde tze ko aukera emango duena. Soto solairuko bestelako azalerak
  ibilgailuen bar ne kalea, instalazioak eta etxe bi zi tze ta ra ko eskailerak orde
  na tze ko izango dira.Gauzak horrela:\\n\\nAzalera eraikia guztira: 1.360 + (30x8)=
  1.600 m\u00b2.\\n\\nwww.gipuzkoa.eus\\n\\n2\\n\\n\u2014 Punto 1:\\n\\nEl informe
  del Ayuntamiento dice en el primer punto:\\n\\n\u00abLa propuesta excede la edificabilidad
  m\u00e1xima especificada en el plan, el \u00e1rea del s\u00f3tano necesita ser reconsiderada\u00bb.\\n\\nLa
  documentaci\u00f3n gr\u00e1fica, en plano XA05, concreta los usos de la planta s\u00f3tano
  y por tanto justifica el de sa rro llo de un garaje m\u00e1ximo de 30 m\u00b2 por
  vivienda asegurando que habr\u00e1 acceso directo desde la calle interior a los
  garajes.\\n\\nTabla de superficies comparativa.\\n\\nEl proyecto modificado trata
  de 4 edificios unifamiliares de 400m\u00b2/vivienda. Por tanto, el total ser\u00eda
  de 1.600 m\u00b2.\\n\\nEl PGOU, como se indica en su apartado II.6.8.2, deja la
  edificabilidad justificable del \u00e1rea GUR-1C en 1.400 m\u00b2. En el documento
  se se\u00f1ala lo siguiente:\\n\\n\u00ab* De hecho, son 1.600 m\u00b2, 400 m\u00b2
  (t) para el uso de la residencia para cada una de las cuatro casas previstas, y
  seg\u00fan la tabla 1B, 50 m\u00b2 / vivienda (para garaje y otros usos)\u00bb.\\n\\nEl
  cambio supone, por tanto, que las superficies de garajes y otros usos no se incluyen
