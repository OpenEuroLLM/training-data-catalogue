  = zer edo zer, zerbait.\\n\\n13\"", "\"2019-04-30eko OHIKO UDALBATZA\\n\\nIrurako
  udaletxean, 2019ko apirilaren 30ean, arratsaldeko 19:30ean, lehen deialdia egin
  ondoren, Udalbatza bildu da ohiko osoko bilkura egiteko. Mahaiburua Ana Jes\u00fas
  Leunda Gurruchaga izan da, udaleko alkate-lehendakaria, eta zinegotzi hauek agertu
  dira gaiak aztertzeko:\\n\\n-Azaldu diren EAJ/PNV udal-taldeko zinegotziak: Jose
  Ramon Epelde Irizar, Maria Cristina Santos San Sebastian, Marta Castrillo Iturralde
  eta Jes\u00fas Mar\u00eda Alonso Insausti.\\n\\n-Azaldu ez diren EAJ/PNV udal-taldeko
  zinegotziak: Inor ez.\\n\\n-Azaldu diren EH BILDU udal-taldeko zinegotziak: Ainhoa
  Ugalde Gorostiaga, Jose Ignacio Imaz Bengoechea, Mikel Gotzon Iturbe Saizar eta
  Olaia Nieto Legarra.\\n\\n-Azaldu ez diren BILDU udal-taldeko zinegotziak: Inor
  ez.\\n\\nMiguel Antonio Arrizabalaga Brusin Udaleko idazkari kontu-hartzaileak egin
  ditu idazkari-lanak.\\n\\nAlkateak hasitzat jo du saio publikoa; segituan, eta alkatearen
  baimenarekin, idazkariak jakinarazi du bilera egin daitekeela, bertara agertu baita
  gutxieneko partaide kopurua, Toki Erregimeneko Oinarriak arautzen dituen apirilaren
  2ko 7/1985 Legeak eta azaroaren 28ko 2568/1986 Errege Dekretuak, Toki Erakundeen
  Antolakuntza, Funtzionamendu eta Araudi Juridikoaren Erregelamendua onartzen duenak,
  agindutakoa.\\n\\nLEHENENGO GAIA\\n\\nAURREKO AKTAK ONARTZEA (2019-02-26; 2019-03-26).\\n\\nUdalbatzak,
  aho batez,  2019ko otsailak 26ko eta martxoak 26ko bileren aktak onartu ditu.\\n\\nBIGARREN
  GAIA\\n\\nALKATETZAREN DEKRETU HAUEN BERRI EMATEA: 2019/52 DEKRETUTIK 2019/81 DEKRETURA
  BITARTEAN.\\n\\nAlkateak 2019/52 dekretutik 2019/81 dekretura bitartekoen berri
  eman dio Udalbatzari.\\n\\nHIRUGARREN GAIA 2018KO IRURAKO UDALAREN AURREKONTUAREN
  LIKIDAZIOAREN\\n\\nALKATEAREN DEKRETUA JAKINARAZPENA.\\n\\nIdazkariak adierazten
  du espedientea ez dagoela osatuta eta udalbatzak erabaki du mahaiaren gainean uztea,
  aho batez.\\n\\nLAUGARREN GAIA\\n\\nIRURAKO UDALEKO 2019KO AURREKONTUAREN 1\u00ba.
  KREDITU ALDAKETAREN ESPEDIENTEA ONARTZEA, HALA BADAGOKIO.\\n\\nIdazkariak adierazten
  du ez dagoela proposamenik.\\n\\nBOSGARREN GAIA\\n\\nTOLOMENDIKO ELKARTEAREN 2019KO
  EKARPENA ONARTZEA, HALA BADAGOKIO.\\n\\nTolosaldeko Landa Garapen Elkarteak, Tolomendik,
  2019ko apirilaren 4ean ospatutako urteko Batzar Orokorrean, 2019. urterako Elkartearen
  aurrekontua onartu zuen.\\n\\nBanaketaren ondorioz, Irurako Udalari 3.319,32 \u20ac
  ordaintzea dagokio, Elkartearen funtzionamendurako.\\n\\nHori ikusita udalbatzak,
  aho batez, hau onartu du:\\n\\nERABAKIA\\n\\n1\u00ba.- 3.319,32 euroko ekarpena
  onartzea.\\n\\n2\u00ba.- Ekarpen hori zuzenean ordaintzea.\\n\\nSEIGARREN GAIA\\n\\nLOATZO
  MANKOMUNITATEAREN 2019KO EKARPENA ONARTZEA, HALA BADAGOKIO.\\n\\nAlkateak Loatzo
  Mankomunitatearen 2019ko aurrekontuaren datuak adierazi ditu eta zenbat dagokion
  Irurako Udalari ordaintzea ekarpen bezala. Amaitzeko adierazi du, nahiz eta ekarpena
  oraindik ez den onartua izan, bere proposamena onartzea dela.\\n\\nEta hori ikusita,
  udalbatzak, aho batez, hau onartu du:\\n\\nERABAKIA:\\n\\n1\u00ba.- 2019. ekitaldiko
  Loatzo Mankomunitateari 48.155,96 euroko ekarpena onartzea.\\n2\u00ba.- Zuzenean
  ordaintzea.\\n\\nZAZPIGARREN GAIA\\n\\nMENDEKOTASUN PRESTAZIO EKONOMIKOAK JASOTZEN
  DITUZTEN HERRITARREN EGOERAREN ALDIKO JARRAIPENA EGITEKO GIPUZKOAKO FORU ALDUNDIAREN
  ETA IRURAKO UDALAREN ARTEKO HITZARMENA ONARTZEA, HALA BADAGOKIO.\\n\\nGipuzkoan
  mendekotasun prestazioen inguruan indarrean dagoen araudiak ezartzen du Foru Aldundiak
  udalen bitartez egingo dituela prestazioen titularrak jasotako zainketen kalitatearen
  aldian aldiko jarraipenak, betiere udalen ordezkaritzarekin nahikoa izango den finantzaketa
  aurretik adostua.\\n\\n2018ko abenduan Gipuzkoako Gizarte Zerbitzuen Erakunde Arteko
  Mahaiak kudeaketa emakidarako proposamen bat ontzat eman zuen, finantzaketa barne.\\n\\nJoan
  den otsailaren 12an Diputatuen Foru Kontseiluak horrela egitea nahi luketen Udalekin
  sinatu beharreko hitzarmen eredua onartu zuen.\\n\\nHori ikusita, 5 boto alde (PNV/EAJ)
  eta 4 abstentzio (EH Bildu). Udalbatzak hau onartu du:\\n\\nERABAKIA\\n\\n1\u00ba.-
  Aipatu den hitzarmena onartzea.\\n2\u00ba.- Ana Jes\u00fas Leunda Gurruchaga anderea,
  Irurako Udaleko Alkatea denari, baimena ematea Udalaren izenean hitzarmen hori sinatzeko
  eta beste edozein gestio egiteko, helburua bete dadin.\\n\\nEztabaida:\\n\\nOlaia
  Nieto zinegotziak (EH Bildu) adierazi du, bere taldea abstenitu egin dela, konpetentzia
  Diputaziokoa delako. Egia dela udaleko teknikariak egiten duela orain lana hau,
  baina ez dela bere konpetentzia eta bera ez zegoela erabat ados hitzarmen honekin.\\n\\nZORTZIGARREN
  GAIA\\n\\nIRURAKO ZAHARREN BILTOKIKO ETA IRURAKO UDALAREN ARTEAN HITZARMENA, JARDUEREN
  PROGRAMAK GAUZATZEKO HELBURUAREKIN ONARTZEA, HALA BADAGOKIO.\\n\\nGizarte Zerbitzuetako
  Batzordeak 2019ko apirilaren 3an eginiko bileran, onartu zuen Irurako Zaharren Biltokia
  Elkartearekin hitzarmena 2019tik 2022 bitartekoa. Bere helburua da, alde batetik,
  4.000 euroko diru laguntza ematea bere jarduerak gauzatzeko eta beste aldetik Share
  Kaleko 7 zenbakiko udal lokala dohain lagatzea bere jarduerak burutzeko.\\n\\nHori
  ikusita, udalbatzak aho batez, hau onartu du:\\n\\nERABAKIA\\n\\n1\u00ba.- Aipatu
  den hitzarmena onartzea.\\n2\u00ba.- Ana Jes\u00fas Leunda Gurruchaga anderea, Irurako
  Udaleko Alkatea denari, baimena ematea Udalaren izenean hitzarmen hori sinatzeko
  eta beste edozein gestio egiteko, helburua bete dadin.\\n\\nBEDERATZIGARREN GAIA\\n\\nHERRIAN
  IZANDAKO EMAKUME PILOTARI PROFESIONALEN BERRIA EMATEKO DIRU LAGUNTZA ONARTZEA, HALA
  BADAGOKIO.\\n\\nRaketistak Lehen eta Orain Kultur Kirol Elkarteak raketisten gaineko
  datuak jaso ditu lau urtez. Irurako herriko raketisten datu babesa sortzeko eta
  osatzeko 600 euroko diru laguntza eskaera egiten dute.\\n\\nHori ikusita, udalbatzak,
  aho batez, onartu du diru laguntza ematea eta zuzenean ordaintzea.\\n\\nHAMARGARREN
  GAIA\\n\\n2019KO IRAKASKUNTZAKO ERAKUNDEENTZAKO DIRU LAGUNTZAK ONARTZEA, HALA BADAGOKIO.\\n\\nKultura,
  Kirola, Euskara eta Gazteria Batzordeak, 2019ko martxoaren 12an egindako bileran,
  euskara arloko hainbat diru laguntza onartu zituen.\\n\\nHori ikusita, udalbatzak,
  aho batez, onartu du diru laguntza hauek ematea eta zuzenean ordaintzea:\\n\\n-Ibilaldia:
  160 \u20ac\\n\\n-Araba Euskaraz: 160 \u20ac\\n\\n-Kilometroak: 160 \u20ac\\n\\n-Nafarroa
  Oinez: 260 \u20ac\\n\\n-Herri Urrats: 260 \u20ac\\n\\nHAMAIKAGARREN GAIA\\n\\nGALTZAUNDI
