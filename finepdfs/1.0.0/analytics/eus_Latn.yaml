  EZ0   | EZ0   | EZ0   | EZ0   | EZ0   | EZ0   | EZ0   | OBO   | OBO   | OBO   |
  OBO   | OBO   | OBO   |\\n| Nerbio kanpoaldea| O     | O     | O     | O     | O     |
  N     | EZ0   | EZ0   | EZ0   | EZ0   | EZ0   | EZ0   | EZ0   | OBO   | OBO   |
  OBO   | OBO   | OBO   | OBO   |\\n| Barbadun         | O     | O     | O     | O     |
  O     | N     | O     | O     | O     | O     | O     | O     | O     | O     |
  O     | O     | O     | O     | OBO   |\\n\\nKostaldeko ur-masek, oro har, ingurumen-helburuak
  betetzen dituzte, egoera ekologiko oso on edo oneko balioespenekin. Monpas-Pasaia
  ur-masak 2012an egoera eskasa izan zuen arren (makroalgien egoeraren ondorioz),
  hoberanzko joera azaltzen du, isuriak Murgita senaiatik desbideratu zirenetik. Bestalde,
  nahiz eta, zenbaitetan, IKAk ez bete (adibidez, Monpas-Pasaia ur-masan, 2013an,
  benzo(a)pireno edo/eta kadmiaogatik), kostaldeko ur-masetan egoera kimiko ona erdiesten
  da, orohar. Hemen, aipatzekoak da, azturtutako kutsatsuale bakoitzari BKDK printzipioa
  ezartzentzako eta, hortaz, egoera kimikoen helburuak ez betetzeko aukera handia
  dela.\\n\\nAldiz, tarteko ur-masetan IKAk betetzeko-maila eskasagoa da. Butroe,
  Deba eta Urumnea tarteko ur-masek bakarrik erdiesten dute egoera ekologikoa urtero.
  Barbadun, Nerbioi kanpoaldea eta Urola ur-masek, bat ez beste urte guztietan dute
  egoera ekologikoa ona. Gehienetan, egoera ekologikoa erdiesten ez den urteetan,
  egoera neurrizkoa dute ur-masek. Salbuespen dira: Oka barnealdea (saneamendua ez
  dago osatuta), zeinak egoera eskasa edo txarra baituen gehienetan; eta Lea eta Artibai,
  egoera eskasa izan baitzuten urteetako batean.\\n\\nOrohar, egoera ona ez lortzearen
  arrazoia arrainei, makroornogabe bentikoei eta fitoplanktonari zor zaie. Bestetik,
  badira zenbait substantzien kutsadura kronikoagatik (HCH) etengabe egoera kimiko
  onera heltzen ez diren ur-masak (Nerbioi barrualdea eta kanpoaldea). Egoera kimiko
  onik erdiesten ez duten beste ur-masak Oka barrualdea (hiru urtetan), eta Lea, Artibai,
  Oiartzun eta Bidasoa (bi urtetan) dira. Barbadun, Ori\u00f1a eta Urumnea ur-masak
  dira urte guztietan egoera kimiko ona azaldu duten bakarrak. Egoera kimikoko IKAk
  ez betetzearren arrazoia HCH, benzo(g,h,i)perileno+Indeno(1,2,3-cd)pireno, naftaleno,
  kadmia, nikel eta berunaren kontzentrazioei zor zaie, besteaak beste.\\n\\nOso aldututako
  ur masa batzuetan (Nerbioi kanpoaldea eta Urumnea) egoera ekologikoa ona gehiagotan
  erdiestea kalitate-helburuak ur-masa naturalenak baino baxuagoak izateari zor izango
  zaio ziur aski. Hala ere, gogoan izan behar da Urumnea beti erdiesten duela egoera
  kimiko ona.\\n\\nBi egoera horiek (egoera ekologikoa eta egoera kimikoa) aintzat
  hartuz gero, tarteko 14 ur-masetatik bakar batek, Urumnea, erdiesten du egoera orokor
  ona 2013-2018 bitarteko urte guztietan.\\n\\nLehen aipatu den BKDK printzipioa erabiliz
  erdietsitako emailtzak ulertzeko, egoera ekologikoaren balioespenaren analisia (7.
  taula eta 5. irudia) adierazle edo elementu banaka egitean, ondokoak aipatu daiteke:\\n\\n-
  **Baldintza fisiko-kimiko orokorrak.** 2013-2018 bitarteak kostaldeko lau ur-masek,
  eta tarteko Barbadun, Butroe, Oka kanpoaldea, Lea, Deba, Oria, Urumea eta Bidasoa
  ur-masek betetzen dituzte urtero ingurumen-helburuak. Azken sei urteotan ingurumen-helburuak
  betetzen ez dituen ur-masa bakarra Oka barrualdea da eta, lehen esan denez, saneamendu
  eskasagatik dela uste da. Gainontzeko ur-masek gorabeherak azaltzen dituzte.\\n\\n-
  **Substantzia preferenteak.** Neurtutako substantzia guztiak ingurumen-helburuak
  betetzen dira ur-masa eta urte guztietan.\\n\\n- **Fitoplanktona.** Fitoplanktonaren
  ingurumen-helburuak ur-masa eta urte gehienetan betetzen dira, Oka barrualdean eta
  Oiartzunen izan ezik, non sistematikoki ez baitiren betetzen. Hainbat aldiz aipatu
  denez, saneamendurik ez dagoen ingurueta bat da Oka; Oiartzun, berriz, degradazio
  historikotik leheneratze-bidean dago. Oiartzunen egoera onetik neurri zkorra pasatzearen
  arrazoia lehen zegoen uhertasuna fitoplanktonen hazkunderako muga izateari zor lekioke,
  eta orain dagoen gardentasun handiagoak muga hori lausotzeari.\\n\\n- **Makroalgak.**
  2013-2018 bitartean kostaldeko lau ur-masek makroalgen ingurumen-helburuak betetzen
  dituzte. Tarteko ur-masetan, bestalde, makroalgak ez dira kontuan hartzen egoera
  ekologikoaren balioespen orokorra egiteko, nahiz eta aztertzen diren.\\n\\n- **Makroornogabe
  bentikoak.** Urte eta ur-masa gehienetan ingurumen-helburuak betetzen dira. Baina,
  sistematikoki, Oka barrualdean eta Artibain ez dira betetzen eta beste ur-masa batzuetan
  ere (Barbadun eta Oka kanpoaldea) betetzen ez diren urteak badira. Gogoratu behar
  da Okan saneamendua ez dagoela guztiak bukatuta (eta Gernikako hondakin-uren araztegia
  ez dabilela behar bezala), Artibain dragatze-lan handiak burutu direla eta Barbadunen
  leheneratze lanak egin direla CLH inguruan.\\n\\n- **Arrainak.** Aztertu den bitarte
  osoan betetzen dira arrainen ingurumen-helburuak Barbadun, Nerbioi barrualdea, Nerbioi
  kanpoaldea, Butroe, Deba, Urola, Oiartzun eta Urumean. Gainontzeko ur-masetan arrainen
  egoera neurri zkorra da, Lean izan ezik, non egoera eskasa hauteman baitzen 2013an.\\n\\nEgoera
  kimikoari dagokionez, 2013-2018 bitartean tarteko uretan helburuen betetze-maila
  %50 eta %85 artekoa da (6. irudia). Kostaldeko ur-masetan egoera kimikoaren helburuen
  betetze-maila handiagoa da: %75 eta %100 artekoa (6. irudia). Txosten honetan esan
  den bezala, lehentasunezko hainbat substantzia neurtzeak eta BKDK printzipioa jarraitzeak,
  ingurumen-helburuak gainditzea errazten du eta, beraz, egoera kimikoa ez betetzeko
  arriskua handiagoa da. Hala ere, ez da egoera txarra luzaroan mantentzen.\\n\\nEgoera
  globala baliozatzeko, egoera ekologikoaren eta egoera kimikoen arteko baliorik txarrena
  hartzen denez, egoera globala betetzen ez duten kasuak igotzea zentzuzkoa da. Honela,
  egoera globalari dagokionez, tarteko uretan %35 eta %50 artean dago betetze-maila
  eta kostaldean, %75 eta %100 artean (7. irudia).\\n\\n5. irudia  Tarteko eta kostaldeko
  ur-masen egoera/potenzial ekoizkigokoaren bilakaera 2013-2018 bitartean. Oso ona
  edo maximoa (OO edo OO; urdina), ona (O edo O; berdea), Neurriko (N edo NP; horia),
  eskasa (E edo E; laranja) eta txarra (T edo T; gorria).\\n\\n6. irudia  Tarteko
  eta kostaldeko ur-masen egoera kimikoaren bilakaera 2013-2018 bitartean.\\n\\n7.
  irudia  Tarteko eta kostaldeko ur-masen egoera globalaren bilakaera 2013-2018 bitartean.\\n\\n7.
  taula  Tarteko eta kostaldeko ur-masen egoera ekologikoaren adierazleen bilakaera
  2013-2018 bitartekoan. (Gakoak: Makroornogabeak, arrainak, fitoplanktona, makroalgak,
  egoera biologikoa, baldintza orokorrak eta egoera ekologikoa: oso ona (OO urdina),
  ona (O berdea), neurriazkoa (N horia), eskasa (E laranja) eta txarra (T gorria).
  Substazia preferenteak: oso ona (OO; urdina), ona (O; berdea), eta egoera ez da
  ona (EZ; gorria). Oharra: Ur-masa oso aldatuak kasuan (ikusi 2. taula) adieraze
  biologiko eta egoera ekologikoaren balioespenak ahalmenari dagozkie.\\n\\n| UR-MAZA       |
