  Incumplimiento de la ordenanza: infracciones y sanciones.\\n\\nLG.:S.S.1-1958\\n\\n1\\n\\n18.
  artikulua. Lizen tziarik gabeko instalazioak.\\n19. artikulua. Baimendutako elementuak
  edo azalera gaindi tzea.\\n20. artikulua. Arau-hausteen sailkapena.\\n21. artikulua.
  Zehapenak.\\n22. artikulua. Eran tzu kizuna alda tzen duten inguruabarrak.\\n23.artikulua.
  Prozedura.\\n\\nARRAZOIEN AZALPENA\\n\\nOrdenan tza honek arau tzen ditu, Toki Araubidearen
  Oinarriei buruzko 7/1985 Legeak eta Administrazio Publikoen Ondarea arau tzen duen
  araudiak \u2013nagusiki 33/2003 Legeak osa tzen duenak\u2013 ezarritakoarekin bat,
  hiriko espazio publikoan gaurdaino egin diren askotariko erabilerak, hiriko espazio
  publiko tzat hartuta udalaren jabari publikoko bide eta espazio guztiak, baita beste
  administrazio publiko  batzuen jabarikoak edota titulartasun pribatukoak izanda
  ere herritar ororen erabilera publikoari atxi kiak dauden udalerriko beste espazio
  guztiak ere.\\n\\nErregulazioaren helburua da espazio publikoak izan ditza keen
  erabilera desberdinak ahalik eta modu argi eta soilenean arau tzea eta, bereziki,
  espazio publikoaren aprobe txa mendu berezia edo erabilera pribatiboa dakarten erabilerena,
  espazio publikoaren erabilera arruntaren (per tsona guztiei berdin baina modu desberdinean
  dagokienaren) babes handiagoa lor tzeko.\\n\\nOrdenan tza honen xede diren baimenak
  emateko garaian Udalak bermatu beharko duen herritarren eskubide nagusia bide publikoa
  per tsona guztien tzat irisgarria izatea izango da. Alde horretatik, bai ordenan
  tza honek bai bere aplikazio-egin tzek bereziki hartuko dituzte kontuan espazio
  publikoen irisgarritasunaren oinarrizko baldin tzak arau tzen dituzten indarreko
  arauak, oinarrian apirilaren 11ko Eusko Jaurlari tzako 68/2000 Dekretua dutenak
  (hiri-inguruetako, espazio publikoetako, eraikinetako eta informazio- eta komunikazio-sistemetako
  irisgarritasun-baldin tzei buruzko arau teknikoak onar tzen dituena), baita  otsailaren
  1eko VIV/561/2010 Ministro Agindua ere (espazio publiko urbanizatuek izaera irisgarria
  eta ezdiskrimina tzailea izateko eta horiek erabil tzeko oinarrizko baldin tzen
  dokumentu teknikoa gara tzen duena).\\n\\nOrdenan tza honen beste prin tzi pio gidari
  bat da Eibarko bide eta espazio publikoetan egiten diren erabilera guztiek, bereziek
  zein pribatiboek, udalak aurretiaz emandako ahalbide tze-titulua edo baimena izan
  behar dutela, Administrazio Publikoen Ondareari buruzko 33/2003 Legearen 84. artikuluak
  aurreikusitakoarekin bat etorriz.\\n\\nAzkenik, nabarmendu behar da ordenan tza
  2006/123/CE Zerbi tzu Direktibak, zerbi tzuak ezar tze ari eta emateari buruzkoak,
  ezarritakoarekin bat etorriz egin dela. Horrela, Direktibaren eta bere transposiziorako
  proiekta tzen diren arauen prin tzi pioak eta gidalerroak errespeta tzen dira. Baimen
  tze-teknika manten tzen da Administrazio Publikoen Ondareari buruzko Legearen 6.
  eta 84. artikuluetan ezarritakoarekin bat etorriz, baita administrazioaren isiltasun
  negatiboa ere, Omnibus Legeak egiten duen 30/1992 Legearen 43. artikuluaren aldaketan
  ezarritakoarekin bat. Bereziki, arreta handia jarri da espazio publikoa beren zerbi
  tzu-jardueraren fun tsezko oinarri gisa erabil tzen duten zerbi tzu-emaileei (ostalariei
  eta merkatariei) ahalik eta baldin tza  gutxien eska tzea berma tzeko, espazio publikoaren
  izaera mugatuaren eta eskasiaren fun tsezko premisa, eman daitezkeen baimenen kopurua
  muga tzea dakarrena, gogoan hartuta. Baimenak emateko garaian inpar tzialtasun-
  eta gardentasun-prin tzi pioak guztiz beteko direla berma tzen da, baita baimenen
  iraupena mugatua izango dela, bai- www.gipuzkoa.eus\\n\\n2\\n\\nArt\u00edculo 18.
  Instalaciones sin licencia.\\nArt\u00edculo 19. Exceso de elementos o superficie
  sobre lo autorizado.\\nArt\u00edculo 20. Clasificaci\u00f3n de las infracciones.\\n\\nArt\u00edculo
  21. Sanciones.\\n\\nArt\u00edculo 22. Circunstancias modificativas de la responsabilidad.\\n\\nArt\u00edculo
  23. Procedimiento.\\n\\nEXPOSICI\u00d3N DE MOTIVOS\\n\\nLa presente Ordenanza regula,
  al amparo de lo establecido en la Ley 7/1985, de Bases del R\u00e9gimen Local y
  en la normativa reguladora del Patrimonio de las Administraciones P\u00fablicas,
  constituida principalmente por la Ley 33/2003, los diferentes usos o utilizaciones
  que vienen realiz\u00e1ndose del espacio p\u00fablico de la ciudad, considerando
  \u00e9ste como el conjunto de las diferentes v\u00edas y espacios del dominio p\u00fablico
  municipal, as\u00ed como los otros espacios existentes en el t\u00e9rmino municipal
  que, correspondiendo al dominio de otras administraciones p\u00fablicas o a la titularidad
  privada, se hallan afectos al uso p\u00fablico de la ciudadan\u00eda en general.\\n\\nEl
  objetivo de la regulaci\u00f3n es la consecuci\u00f3n de la m\u00e1s clara y sencilla
  ordenaci\u00f3n de los diferentes usos que pueden hacerse del espacio p\u00fablico,
  en particular, de los usos que supongan el aprovechamiento especial, o el uso privativo
  del mismo, a fin de lograr una mayor protecci\u00f3n del uso com\u00fan del espacio
  p\u00fablico, que no es otro que aquel que corresponde por igual y de forma indistinta
  a todas las personas.\\n\\nEl principal derecho ciudadano que el Ayuntamiento deber\u00e1
  garantizar a la hora de conceder las autorizaciones que constituyen el objeto de
  esta ordenanza, es el de la accesibilidad de la v\u00eda p\u00fablica para todas
  las personas. A este respecto tanto en la presente ordenanza como en sus actos de
  aplicaci\u00f3n se tendr\u00e1 especialmente presente la normativa vigente que regula
  las condiciones b\u00e1sicas de accesibilidad de los espacios p\u00fablicos, constituida
  b\u00e1sicamente por el Decreto del Gobierno Vasco 68/2000, de 11 de abril, por
  el que se aprueban las normas t\u00e9cnicas sobre condiciones de accesibilidad de
  los entornos urbanos, espacios p\u00fablicos, edificaciones y sistemas de informaci\u00f3n
  y comunicaci\u00f3n y por la Orden ministerial VIV/561/2010, de 1 de febrero, por
  la que se desarrolla el documento t\u00e9cnico de condiciones b\u00e1sicas de accesibilidad
  y no discriminaci\u00f3n para el acceso y utilizaci\u00f3n de los espacios p\u00fablicos
  urbanizados.\\n\\nOtro principio rector de esta Ordenanza es que todo uso, especial
  o privativo, que se realice en las v\u00edas y espacios p\u00fablicos de Eibar debe
  contar de forma previa con el pertinente t\u00edtulo habilitante o autorizaci\u00f3n
  de parte municipal, de acuerdo con lo prevenido en el art\u00edculo 84 de la Ley
  33/2003, del Patrimonio de las Administraciones P\u00fablicas.\\n\\nPor \u00faltimo,
  hay que se\u00f1alar que la Ordenanza se ha elaborado en consonancia con lo establecido
  en la Directiva de Servicios 2006/123/CE, relativa a la libertad de establecimiento
  y de prestaci\u00f3n de servicios. As\u00ed, se respetan los principios y directrices
  de la Directiva y de la normativa interna que se proyecta para la transposici\u00f3n
  de aquella. Se mantiene la t\u00e9cnica autorizante de acuerdo con lo establecido
  en los art\u00edculos 6 y 84 de La Ley de Patrimonio de las Administraciones P\u00fablicas,
  as\u00ed como el silencio administrativo negativo, de acuerdo con lo establecido
  en la modificaci\u00f3n del art\u00edculo 43 de la Ley 30/1992 que realiza la \u00abLey
  \u00d3mnibus\u00bb. En particular se ha puesto especial cuidado en garantizar la
  exigencia de los m\u00ednimos requisitos posibles a los prestadores de servicios
  que utilizan el espacio p\u00fablico como soporte fundamental de su actividad de
  servicios \u2013hosteleros, comerciantes\u2013 bajo la premisa fundamental de la
  limitaci\u00f3n y escasez del espacio p\u00fablico, que provoca la necesidad de
  limitar, el n\u00famero de autorizaciones que pueden ser otorgadas. Cuando ello
  tenga lugar, se asegura\\n\\nLG.:S.S.1-1958\\n\\nmen horiek ez direla automatikoki
  berrituko eta jarduera uzten duen emaileak edo berarekin erlazionatutako per tso
  nek ez dutela abantailarik izango ere. Komunitate-erregulazioaren aurkako edozein
  baldin tza sar tzea saihestuko da, eta ezar tzen direnak beharrezkoak, propor tzionatuak,
  ez-diskrimina tzaileak, argiak, objektiboak, gardenak eta irisgarriak izan beharko
  dira, eta aurretiaz eman beharko da horien berri. Azkenik, administrazioaren aldetik
  ahalik eta gehien sinplifika tzeko ahaleginak egingo dira, beharrezkoak ez diren
  izapide administratibo guztiak ezabatuz, espazio publikoaren erabilera errazteko.\\n\\nATARIKO
  TITULUA\\n\\nDEFINIZIOAK\\n\\nTerrazak: Mahaiek, aulkiek, eguzkitakoek, eguzki-oihalek,
  jardinerek eta hiri-altza rien beste elementu mugikor eta desmuntagarriek osatutako
  instalazioak dira, beren jarduera ostalari tzako establezimendu baten gehigarri
  gisa egiten dutenak.\\n\\nErabilera pribatiboa espazio publikoaren zati baten okupazioa
  zehazten duena da, eta ondorioz espazio hori beste per tsona  batzuek erabilia izatea
  muga tzen edo saihesten da. Erabilera pribatiboak lizen tzia edo emakida administratiboa
  lor tzea eska tzen du.\\n\\nLEHEN TITULUA\\n\\nXEDAPEN OROKORRAK\\n\\n1. artikulua.
  Aplikazio-eremua.\\n\\nEibarko hiriko espazio publikoa kale, bide, zirkulazio-bide,
  plaza, pasealeku, hiribide, parke, lorategi eta bestelako espazio libreek eta hiritarren
  erabilera publiko edo orokorrera bideratutako beste espazio  batzuek osa tzen dute,
  titulartasun publikoa udalarena edo beste administrazio publiko  batzuena izan,
  edo erabilera publikoari lotutako titulartasun pribatukoak izan.\\n\\n2. artikulua.
  Helburua.\\n\\nOrdenan tza honen helburua da udalaren jabari publikoko eta azaleran
  erabilera publikoa duten jabari pribatuko lursailen aprobe txa menduaren araubide
  juridikoa erregula tzea, ostalari tzako jardueraren osagarriak diren mahai hankabakarrak
  edo antzeko instalazioak (barrikak eta mahai altuak, esaterako) dituzten terrazak
  aldi baterako edo modu iraunkorrean okupa tze ari dagokionez. Halaber, jarduera
  komer tzialei lotutako bide publikoko beste elementu  batzuen instalazioa erregula
  tzen da.\\n\\n3. artikulua. Baimenak.\\n\\nBide publikoa ordenan tza honetan erregulatutako
  elementuekin okupa tzeak jabari publikoko ondasunen aprobe txa mendu berezi eta
  pribatiboa dakarrenez, aurretiazko baimena behar da, dagokion udal baimena lortuz.
  Mendekotasun hau bide-segurtasunarekin eta ordena publikoarekin, oinezkoak pasa
  tze arekin eta desgaitasuna duten per tso nen oinarrizko irisgarritasun-baldin tze
  kin erlazionatutako interes orokorreko arrazoietan justifika tzen da, baita ibilgailu-sarbidean,
  hiriko ingurumenean eta espazio publiko urbanizatuen apainduran ere.\\n\\nInstalazioa
  eran tsita duen establezimendua ireki tzeko baimenaren titularrak diren per tsona
  fisiko zein juridikoei bakarrik emango zaie baimena edo lizen tzia.\\n\\nBaimenaren
  dokumentua eta bere xehetasun-planoa, edo horien fotokopia bana, jardueraren tokian
  egon beharko dira, eska tzen dituzten agin tzari tzako agenteen esku.\\n\\nAurretiko
  eskubiderik eza. Jabari publikoko ondasunen besterenezintasunari eta preskribaezintasunari
  buruzko oharrekin bat, okupazioa baimendu ahal izateko beharrezkoak diren bal- www.gipuzkoa.eus\\n\\n3\\n\\nel
  perfecto cumplimiento de los principios de imparcialidad y de transparencia en su
  otorgamiento y, asimismo, la duraci\u00f3n limitada de las autorizaciones, la no
  renovaci\u00f3n autom\u00e1tica de las mismas y la no existencia de ventajas para
  el prestador cesante o personas vinculadas al mismo. Se evita incluir todo requisito
  contrario a la regulaci\u00f3n comunitaria, y los que se establecen cumplen con
  el criterio de ser necesarios, proporcionados y no discriminatorios, claros e inequ\u00edvocos,
  objetivos, transparentes y accesibles, y est\u00e1n hechos p\u00fablicos con antelaci\u00f3n.
  Por \u00faltimo se pretende la m\u00e1xima simplificaci\u00f3n administrativa, suprimiendo
  todos los tr\u00e1mites administrativos innecesarios, a fin de facilitar la utilizaci\u00f3n
  del espacio p\u00fablico.\\n\\nT\u00cdTULO PRELIMINAR\\n\\nDEFINICIONES\\n\\nTerrazas:
  Son las instalaciones formadas por mesas, sillas, sombrillas, toldos, jardineras
  y otros elementos de mobiliario urbano m\u00f3viles y desmontables, que desarrollan
  su actividad de forma aneja a un establecimiento de hosteler\u00eda.\\n\\nUso Privativo
  es el que determina la ocupaci\u00f3n de una porci\u00f3n del espacio p\u00fablico
  de modo que se limita o excluye la utilizaci\u00f3n del mismo por otras personas.
  El uso privativo requiere la obtenci\u00f3n de licencia o de concesi\u00f3n administrativa.\\n\\nT\u00cdTULO
  PRIMERO\\n\\nDISPOSICIONES GENERALES\\n\\nArt\u00edculo 1. \u00c1mbito de aplicaci\u00f3n.\\n\\nEl
  espacio p\u00fablico de la ciudad de Eibar est\u00e1 integrado por las calles, caminos,
  v\u00edas de circulaci\u00f3n, plazas, paseos, avenidas, parques, jardines y dem\u00e1s
  espacios libres y otros espacios destinados al uso p\u00fablico o general de la
  ciudadan\u00eda, ya sean de titularidad p\u00fablica municipal o de otras administraciones
  p\u00fablicas, ya sean de titularidad privada afecta al uso p\u00fablico.\\n\\nArt\u00edculo
  2. Objeto.\\n\\nLa presente Ordenanza tiene por objeto la regulaci\u00f3n del r\u00e9gimen
  jur\u00eddico a que debe someterse el aprovechamiento de terrenos de dominio p\u00fablico
  municipal y de dominio privado de uso p\u00fablico en superficie, mediante su ocupaci\u00f3n
  temporal o permanente con terrazas de veladores o instalaciones an\u00e1logas como
  barricas y mesas altas que constituyan complemento de la actividad de hosteler\u00eda.
  Tambi\u00e9n se regula la instalaci\u00f3n de otros elementos en la v\u00eda p\u00fablica,
  vinculados a actividades comerciales.\\n\\nArt\u00edculo 3. Autorizaciones.\\n\\nLa
  ocupaci\u00f3n de la v\u00eda p\u00fablica con los elementos regulados en esta ordenanza
  supone un aprovechamiento especial y privativo de bienes de dominio p\u00fablico
  por lo que est\u00e1 sujeto a previa autorizaci\u00f3n, mediante la obtenci\u00f3n
  de la correspondiente licencia municipal Este sometimiento se justifica en razones
  de inter\u00e9s general relacionadas con la seguridad vial y el orden p\u00fablico,
  el tr\u00e1nsito peatonal y la garant\u00eda de las condiciones b\u00e1sicas de
  accesibilidad de las personas con discapacidad, el acceso rodado de veh\u00edculos,
  el medio ambiente urbano y el ornato de los espacios p\u00fablicos urbanizados.\\n\\nLa
  licencia s\u00f3lo se otorgar\u00e1 a las personas f\u00edsicas o jur\u00eddicas
  titulares de la licencia de apertura del establecimiento al que est\u00e1 aneja
  la instalaci\u00f3n.\\n\\nEl documento de la licencia y su plano de detalle, o una
  fotocopia de los mismos, deber\u00e1n encontrarse en el lugar de la actividad, a
  disposici\u00f3n de los agentes de la autoridad que la reclamen.\\n\\nCarencia de
  derecho preexistente. En virtud de las notas de inalienabilidad e imprescriptibilidad
  de los bienes de dominio p\u00fablico, la mera concurrencia de los requisitos necesarios
  para\\n\\nLG.:S.S.1-1958\\n\\ndin tzak batera bete tze  hutsak ez du inolako eskubiderik
  ematen lizen tzia lor tze ari dagokionez. Udalak, baldin tza erreal eta aurreikusgarri
  guztiak kontuan hartuz, askatasun osoa izango du lizen tzia emateko edo uka tzeko,
  eta interes orokorra interes partikularraren gainetik ezarriko du.\\n\\nInolako
  okupaziorik gabe  utzi ahal izango dira oinezko asko ibil tzen direlako Tokiko Gobernu
  Batza rrak jende-pilaketa handiko tarte tzat har tzen dituen lekuak. Halaber, aldi
  baterako bertan behera  utzi ahal izango da lizen tzia bidez baimenduta dagoen bide
  publikoa okupa tzeko aukera, jai-ospakizunak, kirolekitaldiak edo beste mota bateko
  gertaerak direla medio, alkate tza ren dekretu bidez.\\n\\nBIGARREN TITULUA\\n\\nTERRAZAK\\n\\n4.
  artikulua. Kokapena.\\n\\nEz da  utziko mahairik jar tzen 3 metrotik beherako zabalera
  duten espaloietan edo oinezkoen ibilbideetan. Instalazioak inolaz ere ezin du hartu
  espaloiak duen zabaleraren %50etik gorako lekurik. Oinezkoen  gutxieneko pasabide
  libreak, edozein kasutan ere, metro 2,00koa edo hortik gorako zabalera izango du.
  Oinezkoen tzako esparruetan terrazen altza riak jarriko dira inolako oztoporik gabeko
  3 metro edo gehiagoko zabalerako leku bat uzteko moduan, oinezkoak eta ibilgailu
  baimenduak eta larrialdietakoak pasa tzea ahalbide tzeko. Salbuespen gisa gutxieneko
  pasoa 1,50-ra murriztu ahal izango da apirilaren 11ko 68/2000 Dekretuaren araudiak
  aurreikusitako kasu honetan: Hektarea bakoi tzeko 12 etxe bizi tzako den tsi tatea
  edo txi kiagoa duten etxe bizi tzen urbanizazioetan.\\n\\nOinezkoen tzat aldi baterako
  bakarrik egoki tzen diren zonetan \u2013asteburuetan normalean\u2013, oinezkoen
  tzako lekuaren tamaina leku hori trafikoaren tzat ixten denean bakarrik baldin bada
  nahikoa, lizen tziak eman ahal izango dira oinezkoen tzat bakarrik uzten denean
  terrazak jarri ahal izateko.\\n\\nMahaiak eta aulkiak espaloietan jar tzen direnean,
  espaloiaren zintarriaren lerro horretan jarriko dira. Hala ere, oinezkoen aldeetan,
  oinezkoen ibilbide irisgarria bide erditik badoa, terraza jar daiteke establezimenduaren  fatxada
  ondoan. Kasu berezietan, gunearen eraketa fisikoak berak uzten ez duenean edo jarraibide
  horiek bete tzea komeni ez denean, Udalak okupazioari beste ezaugarri  batzuk ezar
  diezazkioke. Edonola ere, zuhai tzak, zuhaitz-txor koak, parterreak, hiri-altza
  riak, sarbideak eta oinezkoen tzako pasaguneak errespetatuko dira.\\n\\nBaimenak
  establezimenduaren beraren aurrean dagoen lurzatia okupa tzea ahalbidetuko du. Salbuespen
  gisa, alboko establezimenduari dagokion tartea okupatuta egon daiteke. Mahaiak edo
  terrazak fatxa den ondoan jarriz gero, aurretik, aldameneko lokalaren titularrak
  ida tziz emandako baimena ekarri behar da.\\n\\nOinezkoen guneetan, baimenak, establezimendu
  parean dagoen lur-zatia okupa tzen  utziko du. Salbuespena bada ere, luzetarako
  okupazio handiagoa baimendu ahal izango da, aipatutako okupazioa lehendik dauden
  erabilerekin bateragarria bada.\\n\\nIrisgarritasun-araudiarekin bat etorriz, oinezkoaren
  eskubideari emango zaio lehentasuna, eta horretarako saltokietara eta atarietara
  sar tzeko lekuak libre  utzita jarriko da terraza, horietatik  gutxienez 60 cm aldenduz.
  Halaber, 1,50 metroko zeharkako pasagune libre bat  utzi beharko da terrazak okupatutako
  luzetarako 11 metrotik behin, okupatu beharreko lekuaren ezaugarriak direla-eta
  bestelako banaketa bat egitea egokiagoa denean izan ezik.\\n\\nIrisgarritasun-araudiak
  defini tzen duen oinezkoen tzako ibilbide irisgarria ez da inolaz ere inbadituko
  edo aldatuko. Okupatutako azalera hautemangarria izan beharko da, eta ikusteko desgaitasuna
  duten per tso nen tzat arrisku tsua izan daitekeen www.gipuzkoa.eus\\n\\n4\\n\\nque
  la ocupaci\u00f3n pueda ser autorizada no otorga derecho alguno a la obtenci\u00f3n
  de la licencia. El Ayuntamiento, considerando todas las circunstancias reales o
  previsibles, tendr\u00e1 la plena libertad para conceder o denegar la licencia,
  haciendo prevalecer el inter\u00e9s general sobre el particular.\\n\\nPodr\u00e1n
  ser excluidos de ocupaci\u00f3n alguna aquellos espacios que, por su intensidad
  de tr\u00e1nsito peatonal, sean declarados Tramos congestionados por la Junta de
  Gobierno Local. Tambi\u00e9n se podr\u00e1n suspender temporalmente la posibilidad
  de ocupaci\u00f3n de la v\u00eda p\u00fablica autorizada mediante licencia, por
  causa de eventos festivos, deportivos o de otra \u00edndole, mediante Decreto de
  alcald\u00eda.\\n\\nT\u00cdTULO SEGUNDO\\n\\nTERRAZAS\\n\\nArt\u00edculo 4. Ubicaci\u00f3n.\\n\\nNo
  se permitir\u00e1 la instalaci\u00f3n de terrazas en aceras o zonas de tr\u00e1nsito
  peatonal de anchura inferior a 3 metros. En ning\u00fan caso la superficie ocupada
  por la instalaci\u00f3n podr\u00e1 exceder del 50% de la anchura de la acera. El
  paso peatonal libre m\u00ednimo tendr\u00e1 en todo caso una anchura mayor o igual
  que 2,00 metros. Cuando se instalen en zonas peatonales el mobiliario de las terrazas
  se colocar\u00e1 de forma que quede un espacio libre de todo obst\u00e1culo de,
  al menos, 3 metros de anchura, para permitir el tr\u00e1nsito peatonal y el paso
  de veh\u00edculos autorizados y de emergencias. Se podr\u00e1 reducir el paso m\u00ednimo
  a 1,50 m, de forma excepcional, en los casos previstos en la normativa Decreto 68/2000,
  de 11 de abril: urbanizaciones de viviendas de densidad igual o inferior a 12 viviendas/Hect\u00e1rea.\\n\\nEn
  las zonas en que se realiza la peatonalizaci\u00f3n temporal, generalmente los fines
  de semana, si las dimensiones del espacio peatonal s\u00f3lo fueran suficientes
  cuando la zona se cierra al tr\u00e1fico, podr\u00e1n concederse licencias para
  la instalaci\u00f3n de terrazas s\u00f3lo en los per\u00edodos de peatonalizaci\u00f3n.\\n\\nCuando
  se instalen en aceras la terraza se situar\u00e1 en la l\u00ednea del bordillo de
  la acera. En zonas Peatonales, en el caso de que el itinerario peatonal accesible
  discurra por el centro de la v\u00eda, la terraza podr\u00e1 ubicarse junto a fachada
  del establecimiento. En casos especiales, cuando por la propia configuraci\u00f3n
  f\u00edsica del espacio no sea posible, o conveniente seguir estas indicaciones,
  el Ayuntamiento podr\u00e1 establecer otras caracter\u00edsticas de la ocupaci\u00f3n.
  En cualquier caso se respetar\u00e1n los \u00e1rboles, los alcorques, los parterres,
  el mobiliario urbano y sus accesos y los pasos de peatones.\\n\\nLa autorizaci\u00f3n
  permitir\u00e1 la ocupaci\u00f3n del tramo de suelo situado ante el propio establecimiento.
  Excepcionalmente podr\u00e1 estar ocupado el tramo correspondiente al establecimiento
  vecino contiguo, En el caso que las terrazas est\u00e9n adosadas a las fachadas,
  ser\u00e1 necesaria previa autorizaci\u00f3n escrita del titular del local contiguo.\\n\\nEn
  el caso de zonas peatonales, la autorizaci\u00f3n permitir\u00e1 la ocupaci\u00f3n
  del tramo de suelo situado ante el propio establecimiento. Excepcionalmente puede
  autorizarse una ocupaci\u00f3n longitudinal mayor cuando la mencionada ocupaci\u00f3n
  sea compatible con los usos existentes.\\n\\nEn concordancia con la normativa de
  accesibilidad se primar\u00e1 el derecho del peat\u00f3n, para ello, la colocaci\u00f3n
  se realizar\u00e1 dejando libres las zonas de acceso a comercios y portales, retir\u00e1ndose
  de los mismos un m\u00ednimo de 60 cm. Deber\u00e1 dejarse asimismo un paso libre
  transversal de 1,50 metros cada 11 metros de ocupaci\u00f3n longitudinal de la terraza,
  salvo en casos en que las caracter\u00edsticas del espacio a ocupar aconsejen otra
  distribuci\u00f3n.\\n\\nEn ning\u00fan caso se invadir\u00e1 o alterar\u00e1 el
  itinerario peatonal accesible, seg\u00fan lo define la normativa de accesibilidad.
  La superficie ocupada deber\u00e1 ser detectable, evitando cualquier elemento o
  situaci\u00f3n que pueda generar un peligro a las perso-\\n\\nLG.:S.S.1-1958\\n\\nedozein
  elementu edo egoera saihestuko da. Instalazio hauetako elementuen diseinuak eta
  kokapenak per tsona guztiek erabil tzea ahalbidetuko dute.\\n\\nOkupazio-modulu
  orokorra 1,85 x 1,85 metro karratukoa izango da, beraz, mahai bat eta 4 aulki jar
  tze koa. Espaloi estuetan edo mahai 1 eta 4 aulki jar tzeko aukerarik ez dagoen
  lekuetan, dagoen lekura hobeto egoki tzeko asmoz, baimena emango da barrikak eta
  aulkiak jar tzeko, edo modulu orokorrari aldaketa  batzuk egiteko. Beraz, horrelako
  kasuetan, mahai 1 eta 3 aulkiz osatutako moduluak (1,85 x 1,35 m) edo mahai 1 eta
  aulki 2koak (1,85 x 0,85 m) jar tzen  utziko da.\\n\\n5. artikulua. Instalazio-motak
  eta okupatutako lekua muga tzea.\\n\\n5.1. Instalazio-motak: Ordenan tza honek baimen
  tzen dituen terrazak mota bikoak dira:\\n\\nTerraza desmuntagarriak. Instalazio-mota
  hau da normalean jar tzen dena eta mahaiak, aulkiak eta elementu lagungarriak (eguzkitakoak,
  paramentuak, estufak, loron tziak...) izaten ditu. Jardinerak edo loron tziak eta
  babeseko paramentu bertikalak jar tzeko aukera egongo da. Instalatutako elementu
  guztiak egunero  batzeko eta horretarako egokitutako lokalean gorde tzeko modukoak
  izango dira; debekatuta dago elementu horiek lurzoruan aingura tzea.\\n\\nTerraza
  finkoak. Salbuespen badira ere, Udalak baimena eman dezake horrelako terrazak oinezkoen
  guneetan, plazetan edo gune libre berezietan jar tzeko, betiere oinezkoen edo emergen
  tziazko ibilgailuen pasoko lekuak ez badira eta beste bide edo gune libre  batzuetara
  irteerarik edo konexiorik ez badute \u2013esate baterako Eibarko Bizikleta plaza\u2013
  eta haien kokapenak umeen tzako jolastoki-erabilerari, hiri-altza riei, kale-garbiketari
  eta abarri eragiten ez badie.\\n\\nEz da horrelako terrazarik jar tzen  utziko ostalari
  tzako establezimenduaren eta jarri nahi den terraza finkoaren artean ibilgailuak
  zirkula tzeko bideren bat badago.\\n\\nTerraza finkoek diseinu irekia eduki beharko
  dute eta ikusmenaren iragazkortasuna; terrazek ez diote oztopo egingo hiria hautemateko
  moduari eta ez dute edukion tzi trinko bezala jardungo.\\n\\nTerraza finkoek har
  tzen duten lekua, lurzoruari ainguratutako alboetako haize-babesleek mugatuta egongo
  da. Haizebabesle horien egiturek Oxironez pintatutako metalezko mihiztadura edukiko
  dute eta segurtasunezko beirazko panelak, bai eta ehun-material lisoko estalki desmuntagarria
  ere.\\n\\nTerraza finkoaren estalkia egin daiteke bai isuri biko olanarekin egindako
  lehorpea jarrita, bai erdian masta duten itzal kinak edo eguzkitakoak erabilita.
  Hala ere, horrek ez du bazter tzen behar bezala justifikatutako beste soluzio zehatz  batzuk
  onar tzeko aukera.\\n\\nTerrazaren fun tzionamendu-ordutegitik kanpo estalkia  itxi
  eta altza riak barrura erretiratu behar dira.\\n\\nElementu horien modeloak Eibarko
  Udalaren aldez aurretiko baimena izan beharko du.\\n\\n6. artikulua. Altza rien
  ezaugarriak.\\n\\n6.1. Mahai eta aulkien materialak terraza munta tzeko eta desmunta
  tzeko garaian zoladuraren gainean lekualda tzen direnean zoladura ez kalte tzeko
  eta ahalik eta zarata  gutxien sor tzeko modukoak izango dira. Terraza osa tzen
  duten mahaiak eta aulkiak ezingo dira PVCzkoak edo  antzeko material batekoak izan,
  eta ahal dela aluminiozkoak edo egurrezkoak izango dira.  Altzari guztiek beren
  euskarri guztiak osorik bilduko dituzten gomazko elementuak izango dituzte, talkak
  izanez gero edo arrastatuz gero sortutako zaratak saihesteko.\\n6.2. Terraza bakoi
  tzak mota bakar bateko aulkiak eta mahaiak erabiliko ditu, eta elementu-mota bakoi
  tzak kolore\\n\\nwww.gipuzkoa.eus\\n\\n5\\n\\nnas con discapacidad visual. El dise\u00f1o
  y ubicaci\u00f3n de los elementos de estas instalaciones permitir\u00e1n su uso
  por parte de todas las personas.\\n\\nEl m\u00f3dulo de ocupaci\u00f3n gen\u00e9rico
  ser\u00e1 de 1,85 x 1,85 metros cuadrados correspondiente a 1 mesa y 4 sillas. En
  el caso de aceras estrechas en las que no es posible la colocaci\u00f3n del m\u00f3dulo
  principal de 1 mesas y 4 sillas, con el fin de adaptarse mejor al espacio disponible,
  se permitir\u00e1 la colocaci\u00f3n de barriles y taburetes, o bien variaciones
  del m\u00f3dulo principal; en estos casos, se permitir\u00e1 la instalaci\u00f3n
  de m\u00f3dulos compuestos por 1 mesa y 3 sillas (1,85 m x 1,35 m) o m\u00f3dulos
  de 1 mesa y 2 sillas (1,85 m x 0,85 m).\\n\\nArt\u00edculo 5. Tipos de instalaciones
  y delimitaci\u00f3n del espacio ocupado.\\n\\n5.1. Tipos de instalaciones. Las terrazas
  que autoriza esta Ordenanza son de dos tipos:\\n\\nTerrazas desmontables. Constituyen
  el tipo general de instalaci\u00f3n y est\u00e1 formado por mesas, sillas y elementos
  auxiliares como sombrillas, paramentos, estufas, jardineras, etc. Cabr\u00e1 la
  posibilidad de colocaci\u00f3n de jardineras y de paramentos verticales de protecci\u00f3n.
  Las caracter\u00edsticas de todos los elementos instalados deber\u00e1n permitir
  su recogida y guarda diaria en el local habilitado al efecto, estando prohibido
  su anclaje al suelo.\\n\\nTerrazas estables. Excepcionalmente podr\u00e1 autorizarse
  por el Ayuntamiento este tipo de terrazas en \u00e1reas peatonales, plazas o espacios
  libres singulares, que no constituyan lugares de paso peatonal o de veh\u00edculos
  de emergencia, y que no tengan salida o conexi\u00f3n con otras v\u00edas o espacios
  libres, como por ejemplo Eibarko Bizikleta Plaza, y que permitan su ubicaci\u00f3n
  sin afectar al uso de parque infantil, mobiliario urbano, limpieza viaria,... etc.\\n\\nAdem\u00e1s
  no se permitir\u00e1 su instalaci\u00f3n si existe una v\u00eda con circulaci\u00f3n
  rodada entre el establecimiento de hosteler\u00eda y la ubicaci\u00f3n de terraza
  estable propuesta.\\n\\nEl dise\u00f1o de las terrazas estables deber\u00e1 ser
  abierto y deber\u00e1 primar la permeabilidad de vistas, sin que suponga obst\u00e1culo
  a la percepci\u00f3n de la ciudad ni operen a modo de contenedor compacto.\\n\\nLas
  terrazas estables deber\u00e1n contar con un recinto delimitado por paravientos
  laterales anclados al suelo, de una altura m\u00e1xima de 1,80 metros, formados
  por un ensamblaje met\u00e1lico pintado en oxir\u00f3n y paneles de vidrio de seguridad,
  as\u00ed como de una cubierta desmontable de material textil liso.\\n\\nLa cubierta
  de la terraza estable se podr\u00e1 realizar, bien mediante un p\u00f3rtico con
  toldo partido a dos aguas, bien mediante sombrillas o parasoles con m\u00e1stil
  central, sin perjuicio de la posibilidad de admitir soluciones espec\u00edficas
  debidamente justificadas.\\n\\nFuera del horario de funcionamiento de la terraza
  se deber\u00e1 cerrar la cubierta y retirar el mobiliario.\\n\\nEl modelo de estos
  elementos deber\u00e1 contar con la autorizaci\u00f3n previa del Ayuntamiento de
  Eibar.\\n\\nArt\u00edculo 6.\\n\\nCaracter\u00edsticas del mobiliario.\\n\\n6.1.
  Las mesas y sillas ser\u00e1n de un material tal que, tanto en su desplazamiento
  sobre el pavimento como durante el montaje y desmontaje de la terraza, no da\u00f1en
  el mismo y produzcan el menor ruido posible. Las mesas y sillas que componen la
  terraza no podr\u00e1n ser de PVC o material similar, ser\u00e1n preferentemente
  de aluminio o madera. Todo mobiliario dispondr\u00e1 de elementos de goma que recojan
  totalmente todos lo apoyos para evitar ruidos por impacto y arrastre en el exterior.\\n6.2.
  Cada terraza utilizar\u00e1 un \u00fanico tipo de silla y mesa, as\u00ed como un
  \u00fanico color, igual para cada tipo de elemento. Se\\n\\nLG.:S.S.1-1958\\n\\nbakarra
  izango du. Debekatu egiten da terraza edo mahai hankabakarra osa tzen duen edozein
  elementutan publizitatea jar tzea, baita bertako elementu lagungarri desberdinetan
  ere.\\n\\n3. Bai eskaera berrietan bai berri tze-eskaeretan jarriko diren altza
  rien ezaugarriak adierazi beharko dira, baita altza rien euskarrien gomazko elementuenak
  ere, eta horiek guztiek Udaleko Zerbi tzu Teknikoen onespena jaso beharko dute.\\n7.
  artikulua. Eguzkitakoak eta eguzki-oihalak.\\n\\nTerrazako elementu gisa eguzkitakoak
  jarri ahal izango dira, arau hauei jarraiki:\\n\\na) Eguzkitakoak jar tzeko lizen
  tzia beharko da, eta hori terraza jar tzeko lizen tziarekin batera eskatu ahal izango
  da, edo terrazaren lizen tzia eskatu ondoren.\\nb) Eguzkitakoak tolesgarriak eta
  desmuntagarriak izan beharko dira, eta ez da baimenduko zoladuran edozein motatako
  ainguraketen bidez eustea.\\nc) Eguzkitakoen hegalak ezingo du terrazaren tzat baimendutako
  azalera gainditu, ezta oinezkoak pasa tzea oztopatu ere. Espaloiaren lur-arrasetik
  zabaldutako eguzkitakoen alderdirik baxueneraino 2,20 metroko altuera librea gera
  tzeko moduan jarriko dira.\\n\\nEguzki-oihalek beti izango dute maniobra errazen
  bidez bil tzeko aukera. Debekatuta dago eguzki-oihalen perimetroko azalera bertikalak
  ixtea, baita terrazako zona material zurrun, zeharrargi edo gardenekin estal tzea
  edo ixtea ere, nahiz eta egitura argi eta desmuntagarriek  eutsita egon. Eguzki-oihalak
  ere 2,20 metroko  gutxieneko altueran egongo dira.\\n\\n8. artikulua. Bestelako
  elementuak.\\n\\n8.1. Barrikak eta mahai altuak.\\n\\nBarrikak edo mahai altuak
  eta aulkiak jar tzen  utziko da, baldin eta haien pisuagatik eta neurriengatik egunero
  erraz jaso tzeko eta eramateko modukoak badira; barrikek,  gutxi gorabehera, 60
  cm-ko diametroa izango dute eta 1,20 metroko altura; aulkiak barrikaren altueraren
  araberakoak izango dira. Materialak erraz garbi tzeko modukoak izango dira. Inolaz
  ere ezingo dira bide publikoan geratu establezimenduak zabalik egoteko duen ordutegitik
  kanpo.\\n\\nAltzari-mota hauek 4. artikuluaren kokapen baldin tzak bete beharko
  dituzte oinezkoen tzako ibilbide irisgarria inbadi tzeke. Establezimenduaren  fatxada
  ondoan jar daitezkeen elementu bakarrak fatxa dan lotutako elementu finkoak izango
  dira, barrikek edo mahai altuek bete tzen duten fun tzio berdina bete tzen dutenak
  eta sekzio konstantekoak, ikusteko desgaitasuna duten per tso nen tzat arriskurik
  ez izateko. Arrazoi horregatik, elementu finko horiek ezingo dute aulkirik izan.
  Elementu horiek ez dira fatxa daren lerrotik kanpora 40 cm baino gehiago aterako
  eta kasu guztietan oinezkoak pasatu ahal izatea bermatu beharko da,  gutxienez metro
  2ko zabalera duen zati bat, inolako oztoporik gabe  utziz.\\n\\nBide publikoa okupa
  tze agatiko tasa ordain tzeko orduan, barrika edo mahai bakoi tza bi metro karratuko
  okupazioa duen azalera gisa sartuko da kalkuluan.\\n\\n8.2. Berogailuak.\\n\\nTerraza
  jar tzea baimenduta duten ostalari tzaestablezimenduek kanpoaldean berogailuak jar
  tzeko baimena izango dute, betiere baldin tza hauek betez:\\n\\na. Kanpoaldeko berogailu
  bat jarriko da, gehienez, baimendutako lau mahaiko.\\nb. Berogailu horiek urria
  eta apirila bitartean jarri ahal izango dira.\\nc. Ostalari tza-establezimendu batek
  kanpoaldeko berogailuak jar tzea aukera tzen badu egunero kendu beharko ditu, bide
  publikoan jarritako gainerako altza riak bezala, horretarako baimendutako ordutegiari
  jarraiki.\\n\\nwww.gipuzkoa.eus\\n\\n6\\n\\nproh\u00edbe la publicidad en cualquiera
  de los elementos que componen la terraza o velador, as\u00ed como en sus distintos
  elementos auxiliares.\\n6.3. Tanto en las nuevas solicitudes como en las peticiones
  de renovaci\u00f3n se deber\u00e1 indicar las caracter\u00edsticas del mobiliario
  que se va a instalar, as\u00ed como de los elementos de goma de los apoyos del mobiliario,
  el cual deber\u00e1 recibir el visto bueno de los Servicios T\u00e9cnicos Municipales.\\n\\nArt\u00edculo
  7. Sombrillas y toldos.\\n\\nPodr\u00e1n instalarse, como elemento de la terraza,
  sombrillas, con sujeci\u00f3n a las siguientes normas:\\n\\na) La instalaci\u00f3n
  de sombrillas est\u00e1 sujeta a licencia, que podr\u00e1 solicitarse conjuntamente
  con la de la terraza, o con posterioridad a la misma.\\nb) Las sombrillas deber\u00e1n
  ser plegables y desmontables, sin que se permita su sujeci\u00f3n al pavimento mediante
  cualquier clase de anclaje.\\nc) El vuelo de las sombrillas, no podr\u00e1 exceder
  de la superficie autorizada para terraza, ni entorpecer el tr\u00e1nsito peatonal.
  Se colocar\u00e1n de forma que quede una altura libre de 2,20 metros medidos desde
  la rasante de la acera hasta la parte m\u00e1s baja de las mismas una vez desplegadas.\\n\\nLos
  toldos ser\u00e1n tendr\u00e1n siempre posibilidad de ser recogidos mediante f\u00e1cil
  maniobra. Queda prohibido el cerramiento de las superficies verticales del per\u00edmetro
  de los mismos, as\u00ed como el cubrimiento o cerramiento de la zona de terraza
  con materiales r\u00edgidos, transl\u00facidos o transparentes, aunque est\u00e9n
  soportados por estructuras ligeras y desmontables. Los toldos estar\u00e1n igualmente
  a una altura m\u00ednima de 2,20 m.\\n\\nArt\u00edculo 8. Otros elementos.\\n\\n8.1.
  Barricas y mesas altas.\\n\\nSe permitir\u00e1 la instalaci\u00f3n de barriles o
  mesas altas y taburetes, siempre que sus peso y dimensiones permitan su f\u00e1cil
  portabilidad y recogida diaria; las dimensiones aproximadas de los barriles ser\u00e1
  de 60 cm. de lado o di\u00e1metro, y 1,20 metros de altura, debiendo ser los taburetes
  de altura adecuada al barril. Los materiales empleados deber\u00e1n facilitar su
  f\u00e1cil limpieza. En ning\u00fan caso podr\u00e1 permanecer en la v\u00eda p\u00fablica
  fuera del horario de apertura del establecimiento.\\n\\nEste tipo de mobiliario
  deber\u00e1 respetar las condiciones de ubicaci\u00f3n del art\u00edculo 4 sin invadir
  el itinerario peatonal accesible. \u00danicamente se podr\u00e1n colocar junto a
  la fachada del establecimiento elementos fijos sujetos a fachada, que cumplan la
  misma funci\u00f3n que las barricas o mesas altas, y que deber\u00e1n tener secci\u00f3n
  constante para no generar peligro a las personas con discapacidad visual. Por esta
  raz\u00f3n estos elementos fijos no podr\u00e1n contar con taburetes. Estos elementos
  no sobresaldr\u00e1n de la l\u00ednea fachada m\u00e1s de 40 cm., debiendo garantizarse
  en cualquier caso el paso peatonal, libre de todo obst\u00e1culo, de un m\u00ednimo
  de 2 m. de anchura.\\n\\nA efectos del pago de la correspondiente tasa por ocupaci\u00f3n
  de v\u00eda p\u00fablica, cada barrica o mesa alta computar\u00e1 por una superficie
  de dos metros cuadrados de ocupaci\u00f3n.\\n\\n8.2. Estufas.\\n\\nPara los establecimientos
  hosteleros que tengan autorizada la colocaci\u00f3n de terraza, estar\u00e1 permitida
  la colocaci\u00f3n de estufas de exterior ajust\u00e1ndose a los siguientes requisitos:\\n\\na.
  Las estufas de exterior se colocar\u00e1n como m\u00e1ximo en una proporci\u00f3n
  de una por cada cuatro mesas autorizadas.\\nb. La temporada en la que podr\u00e1n
  colocarse dichas estufas ser\u00e1 la comprendida entre los meses de octubre a abril.\\nc.
  Caso de que un establecimiento hostelero opte por la colocaci\u00f3n de estufas
  de exterior deber\u00e1 retirarlas diariamente, al igual que el resto de mobiliario
  instalado en la v\u00eda p\u00fablica, de acuerdo con el horario autorizado al respecto.\\n\\nLG.:S.S.1-1958\\n\\nd.
  Edonola ere, interesdunak ABC hau tsezko itzal gailuak jarri beharko ditu, 21A22
  113B eraginkortasunekoak, erraz iristeko moduko leku batean.\\ne. Berogailuaren
  modeloa elektrizitatearekin edo gasa zein kea isur tzen ez duen beste erregai batekin
  ibiliko da gehienbat.\\nf. Elektrikoak ez diren berogailuen artean, azaroaren 27ko
  1428/1992 Errege Dekretuarekin, gasezko aparailuei buruzko Europako Erkidegoetako
  Kon tseiluaren 90/396/CEE Direktiban aplika tze koak diren xedapenak ematen dituenarekin,
  bat datozen gas-berogailuak bakarrik baimenduko dira. Edonola ere, karkasa batek
  edo  antzeko egitura batek babestuta egon beharko du berogailuak, propano gasa duten
  elementuak manipula tzea eragozteko. Ezingo da berogailu horiek eraikinen baten
  fatxada-lerrotik edo zuhaitz, kale-argi edo beste elementu batzuetatik 2,00 metro
  baino distan tzia txi kiagoan jar tzeko baimenik eman. Instalazio horien eskaeran
  berogailuen kalitatebermea eta Europar Batasuneko homologazio-ziurtagiria aurkeztu
  beharko dira, baita PGLen eta bere eratorrien instalazioetan espezializatutako manten
  tze-enpresarekin egindako kontratua ere.\\n\\nHala eta guztiz ere, eta aipatutako
  berogailuak jar tze ari zuzenean edo zeharka eragin diezaioketen hiri-altza rien
  beste elementu  batzuk edo hainbat egoera izan daitezkeela kontuan hartuta, berogailuak
  jar tzeko baimena ukatu ahal izango da xede horretarako egingo den txos ten teknikoarekin
  bat etorriz.\\n\\n8.3. Aulki korrituak.\\n\\nEspaloia edo oinezkoak bakarrik pasa
  tzeko zona terraza jar tzeko behar adina zabala ez denean baimendu ahal izango dira.
  Fatxa daren planotik kanpora irteten badira, mugikorrak izan beharko dira eta egunero
  kendu beharko dira. 3 m-ko luzera izango dute gehienez ere, eta horiek jar tzeko
  baimena eman ahal izango da soilik kalean  gutxienez 2 metroko zabalera duen inolako
  oztoporik gabeko espazio librea uzten denean, oinezkoei pasa tzeko aukera berma
  tzeko. Terraza duten establezimenduetan ez da aulki korriturik jarriko.\\n\\n8.4.
  Bide publikora ematen duten erakusmahai-leihoak.\\n\\nEstablezimenduetan erakusmahai-leihoak
  zabal tzen lagako da terraza-zerbi tzu rako; hala ere, terrazak erretira tzen direnean
  horrelakoak egin behar dira, eta 00:00etatik aurrera beti  itxita eduki behar dira.
  Erakusmahai-leiho horiek erabil tzen diren bitartean ez da musikarik edo beste zarata-iturririk
  jarrita egongo establezimendu barruan. Erakusmahai-leihoak zabal tzeko baimena honetara
  baldin tza tuko da: lokalaren zarata-isolamendua mantenduko dela teknikoki berma
  tzera.\\n\\n8.5. Kanpoko apalak.\\n\\nKanpoko apalak kon tsu mizioak laga tzeko
  bakarrik  utziko dira jar tzen, baldin eta apal horiek  fatxada-lerroa baino atze
  rago jar tzen badira eta oinezkoei  jotzeko arriskurik ez badakarkie.\\n\\n9. artikulua.
  Zarata eta ordutegia.\\n9.1. Zarata-transmisioaren mailak muga tzea. Adierazitako
  instalazioen fun tzionamenduak ezingo die transmititu ez etxe bizi tzei eta ezta
  bestelako bizitegi- zein ospitale-erabileren barne- eta kanpo-inguruneei ere ezarritako
  gehieneko zaratamaila gaindi tzen duen zaratarik.\\n\\nTitularrarena da terraza
  ixteko obligazioa bezeroek horiek inguruko bizilagunei eragozpenak sor tzen badizkiete;
  baita terrazarako baimendutako esparru horretatik kanpo bezeroei kon tsu mizioak
  atera tzen ez uztea ere.\\n\\nTerrazetan ez da inolako musika-aparaturik, bozgorailurik
  eta abarrik jarriko. Zuzeneko emanaldiak guztiz debekatuta daude terraza-espazioetan,
  baita ikus-entzu nezkoen ekipoak jar tzea edo audio- zein bideo-emanaldiak egitea
  ere.\\n\\nwww.gipuzkoa.eus\\n\\n7\\n\\nd. En todo caso, el interesado deber\u00e1
  disponer de extintores de polvo ABC, eficacia 21A22 113B, en lugar f\u00e1cilmente
  accesible.\\ne. El modelo de estufa funcionar\u00e1 preferentemente con electricidad
  u otro combustible que no genere emisiones de gas o de humos.\\nf. Fuera de las
  estufas el\u00e9ctricas s\u00f3lo se permitir\u00e1n estufas de gas que deber\u00e1n
  sujetarse al Real Decreto 1428/1992 de 27 de noviembre, por el que se dictan las
  disposiciones de aplicaci\u00f3n de la Directiva del Consejo de las Comunidades
  Europeas 90/396/CEE sobre aparatos de gas. En todo caso, la estructura de la estufa
  deber\u00e1 ir protegida con una carcasa o similar que impida la manipulaci\u00f3n
  de aquellos elementos que contengan el gas propano. No podr\u00e1 autorizarse la
  instalaci\u00f3n de estas estufas a menos de 2,00 metros de la l\u00ednea de fachada
  de alg\u00fan inmueble, ni de otros elementos, tales como \u00e1rboles, farolas,
  etc. En la solicitud de estas instalaciones se deber\u00e1 presentar Garant\u00eda
  de calidad y Certificado de Homologaci\u00f3n de la Comunidad Europea de las estufas
  y Contrato con empresa de mantenimiento especializada en instalaciones de GLP y
  sus derivados\u00bb.\\n\\nNo obstante lo anterior, y atendida la existencia de otros
  elementos de mobiliario urbano o de diversas circunstancias que puedan afectar de
  manera directa o indirecta a la colocaci\u00f3n de las estufas referidas, podr\u00e1
  denegarse la autorizaci\u00f3n para su instalaci\u00f3n de acuerdo con el informe
  t\u00e9cnico que al efecto se efect\u00fae.\\n\\n8.3. Bancos corridos.\\n\\nSe podr\u00e1n
  autorizar en calles cuya acera, o zona de tr\u00e1nsito exclusivo peatonal, no tenga
  la anchura suficiente para la instalaci\u00f3n de terraza. Si sobresalen del plano
  de fachada deber\u00e1n ser movibles y retirarse diariamente. Su longitud m\u00e1xima
  ser\u00e1 de 3 m. y su colocaci\u00f3n s\u00f3lo se podr\u00e1 autorizar cuando
  se deje un espacio libre de todo obst\u00e1culo en la calle de al menos, 2 metros
  de anchura, que garantice el tr\u00e1nsito de peatones. No proceder\u00e1 su colocaci\u00f3n
  en establecimientos que cuenten con terraza.\\n\\n8.4. Ventanas mostrador a v\u00eda
  p\u00fablica.\\n\\nSe permitir\u00e1 la apertura de ventanas-mostrador en el establecimiento
  para el servicio de terrazas, las mismas deber\u00e1n estar cerradas cuando se retiren
  las terrazas, y en todo caso a partir de las 00:00 horas, y mientras se haga uso
  de las mismas no podr\u00e1 reproducirse m\u00fasica u otras fuentes de ruido en
  el establecimiento. Su apertura siempre queda condicionada a que se garantice t\u00e9cnicamente
  el mantenimiento del aislamiento ac\u00fastico del local.\\n\\n8.5. Repisas exteriores.\\n\\nS\u00f3lo
  se permitir\u00e1 la colocaci\u00f3n de repisas para el dep\u00f3sito de consumiciones,
  en el exterior de los establecimientos, cuando las mismas se retranqueen respecto
  de la l\u00ednea de fachada y no generen riesgo de colisi\u00f3n a los viandantes.\\n\\nArt\u00edculo
  9. Ruido y Horario.\\n\\n9.1. Limitaci\u00f3n de niveles de transmisi\u00f3n sonora.
  El funcionamiento de las instalaciones expresadas no podr\u00e1 transmitir al medio
  ambiente interior y exterior de las viviendas y otros usos residenciales u hospitalarios
  niveles de ruido superiores a los m\u00e1ximos establecidos.\\n\\nSer\u00e1 obligaci\u00f3n
  del titular proceder al cierre de la terraza en caso de que los usuarios de las
  mismas produzcan molestias al vecindario, as\u00ed como impedir que los usuarios
  de la terraza saquen las consumiciones fuera de la zona autorizada para la terraza.\\n\\nNo
  se instalar\u00e1 en las terrazas ning\u00fan tipo de aparato musical, ni altavoces,
  etc. Quedan terminantemente prohibidas las actuaciones en directo, as\u00ed como
  la instalaci\u00f3n de equipos audiovisuales o la emisi\u00f3n de audio o v\u00eddeo
  en los espacios de terraza.\\n\\nLG.:S.S.1-1958\\n\\nTerrazak eta beren elementuak
  instala tzeak eta desmunta tzeak inguruko bizilagunei zaratengatiko eragozpenik
  ez sor tzeko behar adina bitarteko jarriko da. Mahai, aulki eta gainerako elementu
  guztiek hanketan gomak edo neopreno-zatiak izango dituzte arrasta tzean zarata  gutxiago
  atera tzeko, 6. artikuluan adierazi bezala.\\n\\n9.2. Euskal Autonomia Erkidegoaren
  esparruan ikuskizun publikoen eta aisialdiko jardueren ordutegiak, nahiz jarduera
  horien inguruko bestelako alderdiak ezar tzen dituen ekainaren 17ko 140/1997 Dekretuarekin
  bat etorriz, terraza jar tzeko ordutegi baimendua hau izango da:\\na)\\nOstiral,
  zapatu eta jaiegun bezperetan:\\n\u2014 Maia tza ren 1etik irailaren 30era: 09:00etatik
  01:30era.\\n\u2014 Urtearen gainerakoan: 09:00etatik 00:30era.\\nb) Domekatik ostegunera
  edo eguenera:\\n\u2014 Maia tza ren 1etik irailaren 30era: 09:00etatik 00:30era.\\n\u2014
  Urtearen gainerakoan: 09:00etatik 23:00etara.\\nc) Herriko jaietan, Aste Santuan,
  Aratusteetan eta Gabonetan.\\n\u2014 Baimendutako ordutegia beste ordu betez luzatuko
  da.\\n\\nHori dena, Udalak berak edo Autonomia Erkidegoak, bakoi tzak bere eskumenez
  baliatuta, sar ditza keten aldaketen kaltetan gabe.\\n\\n10. artikulua. Eran tzu
  kizun zibileko asegurua.\\n\\nEstablezimenduko titularrak izan behar duen eran tzu
  kizun zibileko aseguruaren eta suteen aseguruaren polizaren estaldura terrazaren
  fun tzionamendutik erator daitezkeen izaera bereko arrisku posibleetara zabaldu
  beharko da.\\n\\n11. artikulua. Altza riak ken tzea eta garbiketa.\\n11.1. Arau
  orokor gisa, establezimenduaren titularrak mahaiak, aulkiak eta gainerako  altzari
  guztiak kendu beharko ditu egunero; horiek establezimenduaren barnean edo beste
  lokal batean  utziko dira lanaldi bakoi tza amai tzean eta okupatutako espazioa
  garbitasun-baldin tza ezin hobeetan  utzi beharko da.\\n\\nAulki-pilak, mahaiak,
  barrikak, eguzkitakoak edo terrazako beste edozein elementu lagungarri ezingo dira
  inolaz ere bide publikoan bildu.\\n\\nTerrazako altza riak biltegira tzeko behar
  adina tokirik ez izatea nahikoa arrazoi izan daiteke terraza jar tzeko lizen tzia
  uka tzeko edo muga tzeko.\\n\\n11.2. Jardueraren titularrek  gutxienez egunean birritan
  garbitu beharko dute terrazak okupa tzen duen eremu hori, eta, nolanahi ere, terraza
  ixteko ordua iri tsi eta hura erretiratu ondoren.\\n\\nMahaiek hau tson tziak eduki
  behar dituzte, eta hau tson tzi horiek ura eduki behar dute.\\n\\n12. artikulua.
  Artikuluen salmenta automatikoa eta jokomakinak.\\n\\nArau orokor gisa, debekatuta
  dago espazio publikoa edozein motatako artikuluak sal tzeko makina bana tzaileak
  instalatuz okupa tzea.\\n\\nEspazio pribatuetan instalatuta egonik oinezkoek erabil
  tzeko eremuetatik irisgarriak diren makina bana tzaileak, kutxa zain automatikoak,
  telefono publikoak eta  antzeko elementuak jar tzeko baimena parean  gutxienez 2
  m-ko zabalera duen inolako oztoporik gabeko eremua dutenean bakarrik eman ahal izango
  da.\\n\\nMakina horiek per tsona guztien tzat egon beharko dute erabil tzeko irisgarri.
  Elementuaren diseinuak gurpil-aulkia darabi- www.gipuzkoa.eus\\n\\n8\\n\\nSe dispondr\u00e1n
  los medios para que la instalaci\u00f3n y el desmontaje de las terrazas y sus elementos
  no generen molestias por ruidos al vecindario. Los apoyos en el suelo de las mesas,
  sillas, taburetes y dem\u00e1s elementos ir\u00e1n provistos de gomas o neoprenos
  para minimizar el ruido por arrastre de las mismas, como se indica en el art\u00edculo
  6.\\n\\n9.2. De acuerdo al decreto 140/1997, de 17 de junio, por el que se establecen
  los horarios de los espect\u00e1culos p\u00fablicos y actividades recreativas y
  otros aspectos relativos a estas actividades en el \u00e1mbito de la Comunidad Aut\u00f3noma
  del Pa\u00eds Vasco, el horario autorizado para la instalaci\u00f3n de la terraza
  ser\u00e1:\\na) Los viernes, s\u00e1bados y v\u00edsperas de festivo:\\n\u2014 Del
  1 de mayo al 30 de septiembre: entre las 9:00 y las 01:30 horas.\\n\u2014 Resto
  del a\u00f1o entre las 9:00 y las 00:30 horas.\\nb) De domingo a jueves:\\n\u2014
  Del 1 de mayo al 30 de septiembre: entre las 9:00 y las 00:30 horas.\\n\u2014 Resto
  del a\u00f1o: entre las 9:00 y las 23:00 horas.\\nc) Fiestas locales, Semana Santa,
  Carnavales y Navidades.\\n\u2014 Se ampliar\u00e1 una hora el horario autorizado.\\n\\nTodo
  ello sin perjuicio de las modificaciones que pudieran introducirse por el Ayuntamiento
  o la Comunidad Aut\u00f3noma en el ejercicio de sus competencias.\\n\\nArt\u00edculo
  10. Seguro de responsabilidad civil.\\n\\nLa p\u00f3liza de seguro de responsabilidad
  civil e incendios de que deba disponer el titular del establecimiento deber\u00e1
  extender su cobertura a los posibles riesgos de igual naturaleza que pudieran derivarse
  del funcionamiento de la terraza.\\n\\nArt\u00edculo 11.\\n\\nRetirada del mobiliario
  y limpieza.\\n\\n11.1. Como norma general, el titular del establecimiento queda
  obligado a la retirada diaria de las mesas y sillas y todos los elementos del mobiliario,
  que siempre se retirar\u00e1n al interior del establecimiento, u otro local, al
  final de cada jornada, debiendo dejar el espacio ocupado en perfectas condiciones
  de limpieza.\\n\\nEn ning\u00fan caso podr\u00e1n almacenarse en la v\u00eda p\u00fablica
  pilas de sillas, mesas, barricas, sombrillas o cualquier otro elemento auxiliar
  de la terraza.\\n\\nLa inexistencia de un espacio suficiente para almacenar el mobiliario
  de la terraza podr\u00e1 ser causa suficiente para la denegaci\u00f3n de la licencia
  de instalaci\u00f3n o su limitaci\u00f3n.\\n\\n11.2. Los titulares de la actividad
  deber\u00e1n limpiar la zona utilizada por la terraza un m\u00ednimo de dos veces
  al d\u00eda y, en todo caso, una vez retirada la instalaci\u00f3n al t\u00e9rmino
  de su horario de funcionamiento.\\n\\nLas mesas deber\u00e1n contar con ceniceros,
  y estos deber\u00e1n contener agua.\\n\\nArt\u00edculo 12. Venta autom\u00e1tica
  de art\u00edculos y m\u00e1quinas recreativas.\\n\\nComo norma general, se proh\u00edbe
  la ocupaci\u00f3n del espacio p\u00fablico mediante la instalaci\u00f3n de cualquier
  tipo de m\u00e1quinas expendedoras de todo tipo de art\u00edculos.\\n\\nLas m\u00e1quinas
  expendedoras, cajeros autom\u00e1ticos, tel\u00e9fonos p\u00fablicos y otros elementos
  similares que est\u00e9n instaladas en espacios privados pero que sean accesibles
  desde \u00e1reas de uso peatonal s\u00f3lo podr\u00e1n autorizarse cuando cuenten
  con un \u00e1rea frontal libre de obst\u00e1culos de un m\u00ednimo de 2 m. de anchura.\\n\\nEl
  uso de estas m\u00e1quinas deber\u00e1 ser accesible a todas las personas. El dise\u00f1o
  del elemento deber\u00e1 permitir la aproxima-\\n\\nLG.:S.S.1-1958\\n\\nlen per
  tsona bat gertura tzea ahalbidetu beharko du. Gailu manipulagarriak 0,70 m eta 1,20
  m arteko altueran egongo dira.\\n\\nJolas eta olgetako aparailuak jar tzea, haurren
  tzako jokoak esaterako, salbuespen gisa baimendu ahal izango da horiek jarri nahi
  diren espazio publiko zeha tza ren egiturak ahalbide tzen duenean, ez badio oinezkoen
  tzako  gutxieneko 2 metroko pasaguneari oztoporik egiten.\\n\\n13. artikulua. Merkatari
  tza-establezimenduak heda tzea.\\n\\nMerkatari tza-establezimenduen jarduera espazio
  publikora hedatu ahal izango da bide publikoa jarduera komer tzial bati lotutako
  elementuekin okupatuz, esate baterako salmentan dauden artikuluen erakusketekin,
  publizitate-elementuekin, eta abarrekin. Okupazio horiek Udalak aurrez baimena ematearen
  mendekoak izango dira, eta honek baimena emateko neurtu beharko du dagokion espazio
  publikoak irisgarritasunaren ikuspegitik horretarako aukera ematen duen; halaber,
  Udalak bermatu beharko du  gutxienez 2 m-ko zabalera duen oinezkoen tzako ibilbide
  irisgarri bat egotea, baita zatiaren okupazioarekin erlazionatutako jarduera komer
  tzialak nahitaezko udal-baimena izatea ere.\\n\\nOkupazioa merkatari tza-establezimenduaren
  fun tzio na men du-ordutegira mugatuko da, eta antolamendu estetiko egokia mantendu
  beharko du, baita per tsona guztiei irisgarritasuna bermatuko dien eta oinezkoen
  tzako ibilbide irisgarriei eragozpenak edo distor tsioak eragingo ez dizkien antolamendu
  zeha tza ere.\\n\\nOkupazio hauei ordenan tza honen hirugarren tituluko 7. eta 10.
  artikuluak aplikatuko zaizkie jarritako elementuen kokapenari eta elementu horiek
  ken tze ari dagokionez.\\n\\nKasu bakoi tzean, dagokion bide publikoa okupa tze
  agatiko tasak aplikatuko zaizkie okupazio horiei.\\n\\nLAUGARREN TITULUA\\n\\nLIZEN
  TZIAK IZAPIDE TZEA ETA KUDEA TZEA\\n\\n14. artikulua. Organo eskuduna.\\n\\nLizen
  tziak emateko organo eskuduna Eibarko Udal Alkate tza da, eta horrek Gobernu Batza
  rra eskuordetu ahal izango du, indarrean dagoen araudiari jarraiki. Prozedura zeha
  tzaileei hasiera emateko eta horiek ebazteko eskumena duen agintari tza lizen tziak
  emateko eskumena esleituta duen agintari tza bera izango da.\\n\\n15. artikulua.
  Prozedura.\\n\\nInstalazio berria egiteko edo dagoeneko emanda dagoen lizen tzia
  bat alda tzeko aurkeztuko diren lizen tzia-eskaerak dokumentu hauekin batera aurkeztu
  beharko dira:\\n\\n\u2014 Establezimenduaren fun tzionamendu-lizen tziaren fotokopia
  edo hori emateko espedientearen erreferen tzia.\\n\u2014 Jarri nahi diren hiri-altza
  rien elementu homologatuen zerrenda, horien kopurua espresuki adieraziz.\\n\u2014
  Terrazaren kokapen-planoa 1:1.000 eta 1:500 arteko eskalan, okupatuko den azalera,
  espaloiaren zabalera, iskinetarainoko distan tzia, autobus-geltokiak, kioskoak eta
  bertan dauden hiri-altza rien gainerako elementuak adierazita dituena.\\n\u2014
  Xehetasun-planoa 1:200 eta 1:100 arteko eskalan, jarri nahi diren elementu guztiak
  adieraziz, baita horien mota, kopurua, dimen tsioak, kokapena eta okupatuko duten
  azalera osoa ere adieraziz, eta xehetasun horiek guztiek planoan islatuta geratu
  beharko dute.\\n\u2014 Terrazako elementuak biltegira tzeko dagoen espazioaren justifikazioa.\\n\\nwww.gipuzkoa.eus\\n\\n9\\n\\nci\u00f3n
  de una persona usuaria de silla de ruedas. Los dispositivos manipulables estar\u00e1n
  a una altura comprendida entre 0,70 m y 1,20 m.\\n\\nLos aparatos l\u00fadico-recreativos,
  como juegos infantiles, podr\u00e1n excepcionalmente autorizarse cuando la conformaci\u00f3n
  del concreto espacio p\u00fablico donde pretenda instalarse as\u00ed lo permita,
  por no interferir el paso peatonal m\u00ednimo de 2 metros.\\n\\nArt\u00edculo 13.
  Extensiones de establecimientos comerciales.\\n\\nLas extensiones de actividad de
  establecimientos comerciales al espacio p\u00fablico podr\u00e1n consistir bien
  en la exposici\u00f3n de art\u00edculos en venta, de elementos de propaganda u otro
  tipo de ocupaciones de la v\u00eda p\u00fablica vinculadas a una actividad comercial.
  Estas ocupaciones se sujetan a previa autorizaci\u00f3n por parte del Ayuntamiento,
  quien para otorgarla deber\u00e1 ponderar el espacio p\u00fablico afectado as\u00ed
  lo permite, por raz\u00f3n de accesibilidad, garantizando un itinerario peatonal
  accesible de anchura m\u00ednima de 2 m. y que la actividad comercial a que se vincula
  la ocupaci\u00f3n de la porci\u00f3n goce de la preceptiva autorizaci\u00f3n municipal.\\n\\nLa
  ocupaci\u00f3n s\u00f3lo podr\u00e1 mantenerse durante el horario de funcionamiento
  del establecimiento comercial, y deber\u00e1 mantener una adecuada composici\u00f3n
  est\u00e9tica y una rigurosa disposici\u00f3n que garantice la accesibilidad de
  todas las personas a la misma y no implique molestias o distorsiones de los itinerarios
  peatonales accesibles.\\n\\nSer\u00e1n de aplicaci\u00f3n a estas ocupaciones los
  art\u00edculos 7 y 10 del titulo tercero de esta ordenanza en lo relativo a ubicaci\u00f3n
  y retirada de los elementos instalados.\\n\\nEstas ocupaciones estar\u00e1n sujetas
  la correspondiente tasa por ocupaci\u00f3n de v\u00eda p\u00fablica.\\n\\nT\u00cdTULO
  CUARTO\\n\\nTRAMITACI\u00d3N Y GESTI\u00d3N DE LAS LICENCIAS\\n\\nArt\u00edculo
  14. \u00d3rgano competente.\\n\\nEl \u00f3rgano competente para la concesi\u00f3n
  de las licencias es la Alcald\u00eda del Ayuntamiento de Eibar, quien podr\u00e1
  delegar en la Junta de Gobierno, conforme a la legislaci\u00f3n vigente. La autoridad
  competente para la incoaci\u00f3n y resoluci\u00f3n de los procedimientos sancionadores
  ser\u00e1 la misma que tenga atribuida la del otorgamiento de las licencias.\\n\\nArt\u00edculo
  15. Procedimiento.\\n\\nLas solicitudes de licencia que se presenten para una nueva
  instalaci\u00f3n o para la modificaci\u00f3n de una licencia ya concedida ir\u00e1n
  acompa\u00f1adas de la siguiente documentaci\u00f3n:\\n\\n\u2014 Fotocopia de la
  licencia de funcionamiento del establecimiento o referencia a su expediente de concesi\u00f3n.\\n\u2014
  Relaci\u00f3n de los elementos homologados de mobiliario urbano que se pretendan
  instalar, con indicaci\u00f3n expresa de su n\u00famero.\\n\u2014 Plano de situaci\u00f3n
  de la terraza a escala entre 1:1.000 o 1:500 en el que se reflejen la superficie
  a ocupar, ancho de acera, distancia a las esquinas, paradas de autobuses, quioscos,
  as\u00ed como los elementos de mobiliario urbano existentes.\\n\u2014 Plano de detalle
  a escala entre 1:200 y 1:100, con indicaci\u00f3n de todos los elementos que se
  pretende instalar, as\u00ed como su clase, n\u00famero, dimensiones, total de superficie
  a ocupar y colocaci\u00f3n de los mismos debiendo todo ello quedar reflejado en
  el plano.\\n\u2014 Justificaci\u00f3n del espacio con que se cuenta para almacenar
  los elementos de la terraza.\\n\\nLG.:S.S.1-1958\\n\\n16. artikulua. Ebazpena.\\n\\nEskaera
  ordenan tza honek eskatutako baldin tze tan aurkeztuta, eta txos ten tekniko eta
  juridikoa egin ondoren, udal-organo eskudunak eba tziko du legeak ezarritako epearen
  barnean.\\n\\nLizen tzia-dokumentuan finkatuko dira instalazioaren eta elementu
  lagungarrien, okupatu beharreko azaleraren, mahaien eta aulkien kopuruen, indarraldiaren
  eta beharrezko tzat  jotzen diren gainerako berezitasunen baldin tzak.\\n\\nEskatutako
  lizen tzia ematea egoki tzat har tzen ez bada edo eman beharreko baimenak dagoeneko
  eskatu denarekiko aldaketarik badakar, Udalak entzu naldia emango dio eska tzaileari,
  egoki irudi tzen zaiona argudia dezan.\\n\\nEska tzaileak jabari publikoa okupa
  tze agatik dagokion tasa ez ordain tzeak edo ordenan tza honekin bat ezarritako
  isunak ez ordain tzeak lizen tzia uka tzea ekarriko du.\\n\\nLizen tzia urte osokoa
  izango da eta berdin dio eskaera zein hiletan egiten den. Hurrengo jardunaldietarako,
  besterik Gabe berriztatuko da hasierako lizen tzia hartarako emandako denbora berbererako,
  aldez aurretik tasa ordaindu dela egiaztatuta, eta urtea hasi baino hamabost egun
  lehenagotik, alde bietako batek ere \u2013udalak edo titularrak\u2013 ez badu berriztapenaren
  kontrako asmorik adierazten.\\n\\nUdal Administrazioak lizen tzia-berri tze aren
  kontrako asmoa adieraziko du ondoko kasu hauetan:\\n\\nTerrazaren fun tzionamendutik
  sortutako kalte edo gogaikarritasun larriak daudela ondoriozta tzen duten prozedurei
  hasiera eman izan zaienean.\\n\\n\u2014 Lizen tziaren baldin tzak edo Ordenan tza
  honek ezarritako baldin tzak ez direla bete agerian geratu denean.\\n\u2014 Aurreko
  urteari dagokion tasa ordaindu ez denean.\\n\\nLizen tzian udal-zerbi tzu publikoek
  baimendutako gehieneko okupazio-azalera muga tzeko beharrizana ezarri ahal izango
  da. Ezingo da muga hori gainditu, eta hori horrela izatea establezimenduaren titularra
  den per tso naren eran tzu kizuna izango da.\\n\\n17. artikulua. Ezezta tzea.\\n\\nEdonola
  ere, ordenan tza honetan aurreikusitako edozein instalazio lurzoru publikoan jar
  tzeko lizen tziak prekarioan emango dira, bertan adierazitako preskripzioak eta
  neurri zuzen tzaileak bete tze aren mende egongo dira eta horiek bete tzen ez badira
  ezeztatu ahal izango dira. Ezezta tzea erabaki tzen bada, une horretan bertan eskatuko
  zaio instalazioaren titularrari adieraziko zaion epean ken tzeko, horrela egiten
  ez badu udal-zerbi tzuek bere kontura egingo dutela ohartaraziz.\\n\\nBOSGARREN
  TITULUA\\n\\nORDENAN TZA EZ BETE TZEA: ARAU-HAUSTEAK ETA ZEHAPENAK\\n\\n18. artikulua.
  Lizen tziarik gabeko instalazioak.\\n\\nUdalaren jabari publikoko lursailetan nahitaezko
  lizen tziarik gabe jar tzen diren instalazioak berehala kenduko dituzte udalzerbi
  tzuek, interesatuari alkateak emandako jakinarazpenaz gain inolako beste abisurik
  eman gabe, eta alkateak ondasunak eta horien erabilera komun orokorra ofizioz berreskura
  tzeko ahalmena erabiliko du. Aipatutako jakinarazpena udal-zerbi - www.gipuzkoa.eus\\n\\n10\\n\\nArt\u00edculo
  16. Resoluci\u00f3n.\\n\\nFormulada la petici\u00f3n en los t\u00e9rminos exigidos
  en la presente Ordenanza, y previo informe t\u00e9cnico y jur\u00eddico, se resolver\u00e1
  por el \u00d3rgano Municipal competente en los plazos legalmente establecidos.\\n\\nEn
  el documento de la licencia se fijar\u00e1n las condiciones de la instalaci\u00f3n
  y elementos auxiliares, superficie a ocupar, n\u00famero de mesas y sillas, periodo
  de vigencia y dem\u00e1s particularidades que se estimen necesarias.\\n\\nSi no
  se considerase oportuna la concesi\u00f3n de la licencia solicitada o si la autorizaci\u00f3n
  a conceder supusiera una variaci\u00f3n con respecto a lo solicitado, el Ayuntamiento
  dar\u00e1 audiencia al/a la solicitante, a fin de que \u00e9ste/a pueda alegar lo
  que estime oportuno.\\n\\nEl impago por el/la solicitante de la tasa correspondiente
  a la ocupaci\u00f3n del dominio p\u00fablico o de las multas impuestas con arreglo
  a la presente Ordenanza motivar\u00e1 la denegaci\u00f3n de la licencia.\\n\\nLa
  licencia ser\u00e1 anual coincidiendo con el a\u00f1o natural, con independencia
  del mes del a\u00f1o en que se curse la petici\u00f3n, renov\u00e1ndose autom\u00e1ticamente
  para los ejercicios siguientes por igual per\u00edodo que el concedido inicialmente,
  previa comprobaci\u00f3n del pago de la tasa. Dicha renovaci\u00f3n tendr\u00e1
  lugar si no se produce modificaci\u00f3n alguna en la ubicaci\u00f3n y en los elementos
  instalados en la terraza, o en la titularidad del local afectado, y si ninguna de
  ambas partes, Administraci\u00f3n municipal o titular, comunica quince d\u00edas
  antes del inicio del per\u00edodo autorizado su voluntad contraria a la renovaci\u00f3n.\\n\\nLa
  Administraci\u00f3n municipal manifestar\u00e1 su voluntad contraria a la renovaci\u00f3n
  en los siguientes supuestos:\\n\u2014 Cuando se hayan iniciado procedimientos de
  los que se desprenda la existencia de graves molestias o perjuicios derivados del
  funcionamiento de la terraza.\\n\u2014 Cuando se haya apreciado un incumplimiento
  patente de las condiciones de la licencia o de la presente Ordenanza.\\n\u2014 En
  los casos de falta de pago de la tasa correspondiente del ejercicio anterior.\\n\\nEn
  la licencia se podr\u00e1 establecer la obligaci\u00f3n de que los servicios t\u00e9cnicos
  municipales delimiten la superficie m\u00e1xima de ocupaci\u00f3n autorizada. Dicha
  delimitaci\u00f3n no podr\u00e1 ser rebasada, siendo responsable de su cumplimiento
  la persona titular del establecimiento.\\n\\nArt\u00edculo 17. Revocaci\u00f3n.\\n\\nEn
  todo caso, las licencias que se otorguen para la implantaci\u00f3n de cualquier
  instalaci\u00f3n prevista en esta Ordenanza sobre suelo p\u00fablico lo ser\u00e1n
  a precario y condicionadas al cumplimiento de las prescripciones y medidas correctoras
  establecidas en la misma, pudiendo disponerse su revocaci\u00f3n en caso de incumplimiento.
  De acordarse \u00e9sta, se requerir\u00e1 en el mismo acto al titular de la instalaci\u00f3n
  para que proceda a su retirada en el plazo que se indique, con apercibimiento de
  que, en caso de incumplimiento, se dispondr\u00e1 la realizaci\u00f3n a su costa
  por los servicios municipales.\\n\\nT\u00cdTULO QUINTO\\n\\nINCUMPLIMIENTO DE LA
  ORDENANZA: INFRACCIONES Y SANCIONES\\n\\nArt\u00edculo 18. Instalaciones sin licencia.\\n\\nLas
  instalaciones sujetas a esta Ordenanza que se implanten sobre terrenos de dominio
  p\u00fablico municipal sin la preceptiva licencia ser\u00e1n retiradas de modo inmediato
  por los servicios municipales sin m\u00e1s aviso que la notificaci\u00f3n al interesado
  de la orden dictada por el Alcalde, el cual actuar\u00e1 en ejercicio de las potestades
  de recuperaci\u00f3n de oficio de los bienes y de su\\n\\nLG.:S.S.1-1958\\n\\ntzuek
  ebazpena materialki betearazten duten ekin tza berean egin ahal izango da.\\n\\n19.
  artikulua. Baimendutako elementuak edo azalera gaindi tzea.\\n\\nAurreko artikuluan
  ezarritakoa hiri-altza rien elementuei eta beste edozeini aplikatu ahal izango zaie,
  dagokion baimenean jasota ez dauden edo baimendutako baldin tzak gaindi tzen dituzten
  soinua eta/edo irudia erreproduzi tzeko ekipamenduak eta joko-makinak edo makina
  bana tzaile automatikoak barne. Hori guztia, emandako lizen tzia edo dagokion berri
  tzea ezezta tzeko aukerari kalterik egin gabe.\\n\\n20. artikulua. Arau-hausteen
  sailkapena.\\n\\nOrdenan tza honetako arau-hausteak arinak, larriak edo oso larriak
  izan daitezke.\\n\\n1) Arau-hauste arinak dira:\\na. Instalazioaren edo bere inguruaren
  apaindura- edo garbitasun-falta.\\nb. Hasierako zein amaierako ordutegia ez bete
  tzea, orduerditik beherako aldearekin.\\nc. Lizen tzia-dokumentua eta xehetasun-planoa
  ez aurkeztea eska tzen duten agintari tza-agenteei edo fun tzionario eskudunei.\\nd.
  Terrazaren zonan edo bide publikoko beste edozein espazio okupatutan produktuak,  ontziak
  edo hondakinak biltegira tzea edo pila tzea.\\ne. Ordenan tza honetan aurreikusitako
  beste edozein betebehar ez bete tzea, arau-hauste larria edo oso larria ez bada.\\n2)
  Arau-hauste larriak dira:\\na. Urtebeteko epean hiru arau-hauste arin egitea.\\nb.
  Hasierako zein amaierako ordutegia ez bete tzea, orduerdi eta ordubete arteko aldearekin.\\nc.
  Lizen tzian aurreikusten ez diren hiri-altza rien elementuak jar tzea edo  altzari
  horien baimendutako kopuruak gaindi tzea.\\nd. Baimendutakoa baino azalera handiagoa
  okupa tzea edo beste mugaketa-baldin tza  batzuk ez bete tzea.\\ne. Nahitaezko asegururik
  ez izatea.\\nf. Bizilagunei edo iragai tzazko bidariei instalazioaren fun tzionamendutik
  eratorritako eragozpen egiaztatuak sor tzea.\\ng. Baimendu gabeko musika-instrumentu
  zein -ekipamenduak edo bestelako instalazioak jar tzea.\\nh. Baimendutako elementuak
  egunero ken tzeko betebeharra ez bete tzea.\\n3) Arau-hauste oso larriak dira:\\na.
  Urtebeteko epean hiru arau-hauste larri egitea.\\nb. Terrazak, edo ordenan tza honetan
  araututako bestelako elementuak, baimenik gabe edo baimendutako epetik kanpo jar
  tzea.\\nc. Instalazioa berehala eteteko agindua ez bete tzea.\\nd. Bizilagunei edo
  iragai tzazko bidariei instalazioaren fun tzionamendutik eratorritako eragozpen
  egiaztatuak sor tzea, ordenan tza honetan ezarritako baldin tzak behin eta berriro
  eta modu larrian ez bete tze agatik.\\ne. Espresuki baimendu gabeko ikuskizun edo
  emanaldiak egitea.\\nf. Fun tzionarioei edo agintari tza-agenteei begirunerik ez
  izatea, beren karguari hala dagokiolako esku har tzen dutenean, edo beren ikuska
  tze-lanak uka tzea edo oztopa tzea.\\n\\nwww.gipuzkoa.eus\\n\\n11\\n\\nuso com\u00fan
  general. Dicha notificaci\u00f3n podr\u00e1 practicarse en el mismo acto de la ejecuci\u00f3n
  material de la resoluci\u00f3n, que se llevar\u00e1 a efecto por los servicios municipales.\\n\\nArt\u00edculo
  19. Exceso de elementos o superficie sobre lo autorizado.\\n\\nLo dispuesto en el
  art\u00edculo anterior ser\u00e1 aplicable a los elementos de mobiliario urbano
  y cualquier otro, incluidos los equipos de reproducci\u00f3n sonora y/o visual y
  maquinas de juego o expendedoras autom\u00e1ticas, que no est\u00e9n contemplados
  en la correspondiente autorizaci\u00f3n o que excedan de los t\u00e9rminos permitidos,
  ello sin perjuicio de la posible revocaci\u00f3n de la licencia otorgada o de la
  denegaci\u00f3n de la renovaci\u00f3n correspondiente.\\n\\nArt\u00edculo 20.\\n\\nClasificaci\u00f3n
  de las infracciones.\\n\\nLas infracciones de esta Ordenanza se clasifican en leves,
  graves y muy graves.\\n\\n1) Son infracciones leves:\\na. La falta de ornato o limpieza
  de la instalaci\u00f3n o de su entorno.\\nb. El incumplimiento del horario de inicio
  o de cierre en menos de media hora.\\nc. La falta de presentaci\u00f3n del documento
  de licencia y del plano de detalle a los agentes de la autoridad o funcionarios
  competentes que lo requieran.\\nd. Almacenar o apilar productos, envases o residuos
  en la zona de terraza o en cualquier otro espacio ocupado de la v\u00eda p\u00fablica.\\ne.
  El incumplimiento de cualquier otra obligaci\u00f3n prevista en esta Ordenanza que
  no sea constitutiva de infracci\u00f3n grave o muy grave.\\n2) Son infracciones
  graves:\\na. La comisi\u00f3n de tres infracciones leves en un a\u00f1o.\\nb. El
  incumplimiento del horario de inicio o de cierre en m\u00e1s de media y menos de
  una hora.\\nc. La instalaci\u00f3n de elementos de mobiliario urbano no previstos
  en la licencia o en n\u00famero mayor de los autorizados.\\nd. La ocupaci\u00f3n
  de superficie mayor a la autorizada o el incumplimiento de otras condiciones de
  la delimitaci\u00f3n.\\ne. La carencia del seguro obligatorio.\\nf. La producci\u00f3n
  de molestias acreditadas a los vecinos o transe\u00fantes derivadas del funcionamiento
  de la instalaci\u00f3n.\\ng. La instalaci\u00f3n de instrumentos o equipos musicales
  u otras instalaciones no autorizadas.\\nh. El incumplimiento de la obligaci\u00f3n
  de retirar los elementos autorizados diariamente.\\n3) Son infracciones muy graves:\\na.
  La comisi\u00f3n de tres faltas graves en un a\u00f1o.\\nb. La instalaci\u00f3n
  de terrazas, u otros elementos regulados en esta ordenanza, sin autorizaci\u00f3n
  o fuera del per\u00edodo autorizado.\\nc. El incumplimiento de la orden de suspensi\u00f3n
  inmediata de la instalaci\u00f3n.\\nd. La producci\u00f3n de molestias graves a
  los vecinos o transe\u00fantes derivadas del funcionamiento de la instalaci\u00f3n
  por incumplimiento reiterado y grave de las condiciones establecidas en esta ordenanza.\\ne.
  La celebraci\u00f3n de espect\u00e1culos o actuaciones no autorizados de forma expresa.\\nf.
  La falta de consideraci\u00f3n a los funcionarios o agentes de la autoridad, cuando
  intervengan por raz\u00f3n de su cargo, o la negativa u obstaculizaci\u00f3n a su
  labor inspectora.\\n\\nLG.:S.S.1-1958\\n\\ng. Hasierako zein amaierako ordutegia
  ez bete tzea, ordubetetik beherako aldearekin.\\n21. artikulua. Zehapenak.\\n\\nOrdenan
  tza honetan aurreikusitako arau-hausteek zehapen hauek ekarriko dituzte:\\n\\n\u2014
  Arau-hauste arinak 301 eurora arteko isunarekin zigortuko dira.\\n\u2014 Arau-hauste
  larriak 301,01 eta 902 euro arteko isunarekin zigortuko dira.\\n\u2014 Arau-hauste
  oso larriak 902,01 eta 1.803 euro arteko isunarekin zigortuko dira.\\n\\nArau-hauste
  oso larriak egiteak desgaikun tza-zehapen eran tsia ezar tzea ekar dezake, eta zehapen
  horrek mota honetako lizen tziak lor tzeko bost urtera arteko desgaikun tza esan
  nahi du.\\n\\n22. artikulua. Eran tzu kizuna alda tzen duten inguruabarrak.\\n\\nZehapenak
  modula tzeko ondorengoak hartuko dira kontuan: ea inten tzionalitaterik edo errepika
  tze rik izan den, baita sortutako kalteen izaera, urtebetean izaera bereko beste
  arauhauste bat egin izanagatiko berreror tzea (ebazpen irmo bidez horrela deklaratu
  denean) eta arau-haustea egiteagatik lortutako irabazia ere.\\n\\n23. artikulua.
  Prozedura.\\n\\nZehapenak jar tzeak dagokion espedientea instrui tzea eskatuko du,
  eta izapide tzea  otsailaren 20ko 2/1998 Legeak, Euskal Autonomia Erkidegoko Herri
  Administrazioen zigor tzeko ahalmenari buruzkoak, ezarritakoarekin bat egingo da.\\n\\nEspedienteari
  hasiera emateko erabakiak gerora eman litekeen ebazpenaren eraginkortasuna berma
  tzeko beharrezkoak izan daitezkeen behin-behineko neurriak har tzea agin dezake,
  legez kanpoko instalazioak ken tzea edo horien fun tzio na mendua etetea besteak
  beste.\\n\\nOrdenan tza ren aldaketa hau indarrean jarriko da Gipuzkoako ALDIZKARI
  OFIZIALEAN argitaratu eta 15 eguneko epean, TokiAraubidearen Oinarriak arau tzen
  dituen Legearen 65.2 artikuluaren arabera.\\n\\nwww.gipuzkoa.eus\\n\\n12\\n\\ng.
  El incumplimiento del horario de inicio o de cierre en m\u00e1s de una hora.\\n\\nArt\u00edculo
  21. Sanciones.\\n\\nLa comisi\u00f3n de las infracciones previstas en esta Ordenanza
  llevar\u00e1 aparejada la imposici\u00f3n de las siguientes sanciones:\\n\\n\u2014
  Las infracciones leves se sancionar\u00e1n con multa de hasta 301 euros.\\n\u2014
  Las infracciones graves se sancionar\u00e1n con multa entre 301,01 y 902 euros.\\n\u2014
  Las infracciones muy graves se sancionar\u00e1n con multa entre 902,01 y 1.803 euros.\\n\\nLa
  comisi\u00f3n de las infracciones muy graves podr\u00e1 llevar aparejada la imposici\u00f3n
  de la sanci\u00f3n accesoria de inhabilitaci\u00f3n para la obtenci\u00f3n de licencias
  de esta naturaleza por un per\u00edodo de hasta cinco a\u00f1os.\\n\\nArt\u00edculo
  22. Circunstancias modificativas de la responsabilidad.\\n\\nPara la modulaci\u00f3n
  de las sanciones se atender\u00e1 a la existencia de intencionalidad o reiteraci\u00f3n,
  naturaleza de los perjuicios causados, reincidencia por la comisi\u00f3n en el t\u00e9rmino
  de un a\u00f1o de otra infracci\u00f3n de la misma naturaleza cuando as\u00ed haya
  sido declarado por resoluci\u00f3n firme y al beneficio obtenido con su realizaci\u00f3n.\\n\\nArt\u00edculo
  23. Procedimiento.\\n\\nLa imposici\u00f3n de las sanciones requerir\u00e1 la instrucci\u00f3n
  del correspondiente expediente, que ser\u00e1 tramitada de conformidad con lo dispuesto
  en la Ley 2/1998 de 20 de febrero de la potestad sancionadora de las Administraciones
  P\u00fablicas de la Comunidad Aut\u00f3noma Vasca.\\n\\nEl acuerdo de iniciaci\u00f3n
  podr\u00e1 ordenar la adopci\u00f3n de medidas provisionales que resulten necesarias
  para garantizar la eficacia de la resoluci\u00f3n que pudiera recaer, tales como
  la retirada de las instalaciones ilegales o la suspensi\u00f3n de su funcionamiento.\\n\\nLa
  presente modificaci\u00f3n de la ordenanza entrar\u00e1 en vigor a los 15 d\u00edas
  de su publicaci\u00f3n en el BOLETIN OFICIAL de Gipuzkoa, tal y como refiere el
  art\u00edculo 65.2 de la Ley Reguladora de las Bases de R\u00e9gimen Local.\\n\\nLG.:S.S.1-1958\"",
  "\"XEDAPEN OROKORRAK\\n\\nENPLEGUKO ETA GIZARTE POLITIKETAKO SAILA\\n\\n5502\\n\\n168/2019
  DEKRETUA, urriaren 29koa, zeinaren bidez arautzen baitira Euskal Autonomia Erkide\u00ad
  goan desgaitasuna duten pertsonen enplegagarritasunarekin loturiko programak eta
  zerbitzuak eta enplegu zentro berezien Euskal Erregistroa.\\n\\nDesgaitasuna duten
  pertsonen eskubideei buruzko Konbentzioak \u2013Nazio Batuen Batzar Nagu\u00ad siak
  onartu zuen 2006ko abenduaren 13an\u2013 27. artikuluan jasotzen duenez, desgaitasuna
  duten pertsonek gainerako herritarren baldintza berdinetan lan egiteko eskubidea
  dute, eta horrek bere\u00ad kin dakar bizibidea ateratzeko askatasunez hautatutako
  edo onartutako lan bat lortzeko aukera izateko eskubidea, desgaitasuna duten pertsonekiko
  irekitasunez jokatzen duen lan-merkatu eta -ingurune inklusibo batean.\\n\\nAzaroaren
  29ko 1/2013 Legegintzako Errege Dekretuaren bidez onartutako Desgaitasuna duten
  pertsonen eskubideei eta haien gizarteratzeari buruzko Lege Orokorraren testu bateginak
  ezartzen du desgaitasuna duten pertsonek lanerako eskubidea dutela, tratu-berdintasunaren
  eta diskriminaziorik ezaren printzipioak oinarri dituzten baldintzetan.\\n\\nAraudi
  horrekin bat, enplegu-politikaren xedea izango da desgaitasuna duten pertsonen jar\u00ad
  duera-, enplegu- eta laneratze-tasak handitzea, bai eta haien enpleguaren kalitatea
  hobetzea eta lan-baldintza duinagoak izan ditzaten lortzea ere, haien diskriminazioaren
  aurka eginez modu akti\u00ad boan. Horretarako, administrazio publiko eskudunek
  haien enplegu-aukerak eta lanbidean gora egiteko aukerak sustatuko dituzte lan-merkatuan,
  eta orobat sustatuko dute beharrezko laguntzak izan ditzaten enplegua bilatzeko,
  lortzeko eta mantentzeko, eta utzitako enplegura itzultzeko.\\n\\nHalaber, ezartzen
  du desgaitasuna duten pertsonek beren lanerako eskubidea erabil dezake\u00ad tela
  enplegu-mota hauen bidez:\\n\\na) Enplegu arrunta, enpresetan eta administrazio
  publikoetan, barnean hartuta enplegu lagun\u00ad duko zerbitzuak.\\nb) Enplegu babestua,
  enplegu-zentro berezietan nahiz lan-enklabeetan.\\nc) Enplegu autonomoa.\\n\\nAipatutako
  testu bateginak berariaz jasotzen du desgaitasuna duten pertsonen enplegua sus\u00ad
  tatzeko beharra, haien laneratzea errazteko laguntzak ezarriz: besteak beste, kontratatzeko,
  lanpostu-egokitzeak egiteko eta lantokietan haien irisgarritasuna, mugikortasuna,
  komunikazioa edo ulermena eragozten duten oztopoak kentzeko dirulaguntzak.\\n\\nEnplegu
  babestuari dagokionez, aipatutako araudiaren 43. artikuluan enplegu-zentro bereziak
  arautzen dira, eta artikulu horretan zehazten denez, enplegu-zentro bereziak dira
  helburu dutenak ondasunak edo zerbitzuak ekoiztea, merkatuko eragiketetan erregulartasunez
  parte hartuz, eta aldi berean xede dutenak enplegu ordaindua ziurtatzea desgaitasuna
  duten pertsonei eta per\u00ad tsona horien ahalik eta kopururik handiena laneratzea
  enplegu-erregimen arruntean. Halaber, artikulu horrek ezartzen du desgaitasuna duten
  langileek egokitzapen pertsonal eta sozialerako beharrezko dituzten zerbitzuak eman
  beharko dituztela enplegu-zentro bereziek, laguntza-unita\u00ad teen bitartez.\\n\\n2019/5502
  (45/1)\\n\\nAraudi horrek enplegu-zentro bereziak sortzeko eta abian jartzeko zein
  desgaitasuna duten per\u00ad tsonentzako lanpostuak sortzea sustatzeko agindua ezartzen
  die administrazio publikoei.\\n\\nDesgaitasuna duten pertsonen laneratzeko aukera
  bermatzea xede duten xedapen horiekin bat, urriaren 23ko 3/2015 Legegintzako Errege
  Dekretuaren bidez onartutako Enplegu Legearen testu bateginean jasotzen denez, Enplegua
  Aktibatzeko Espainiako Estrategia \u2013enplegua aktibatzeko politiken helburuak
  eta enplegu-zerbitzu publikoek garatzen dituzten zerbitzuak eta programak biltzen
  ditu\u2013 artikulatzen duten ardatzetako bat 3. ardatza da: enplegu-aukerak. Horrek
  barnean hartzen ditu kontratazioa, enplegu-sorkuntza eta lanpostuen mantentzea sustatzeko
  helburua duten jarduketak, batez ere enplegua lortzeko eta mantentzeko zailtasun
  handienak dituzten tal\u00ad deentzat, eta arreta berezia jartzen da, besteak beste,
  desgaitasuna duten pertsonen egoeran.\\n\\nAutonomia-erkidegoei dagokie ardatz horiek
  gauzatzeko enplegu-politika aktiboen zerbitzuak eta programak diseinatu eta garatzea.
  Alde horretatik, Enpleguaren Legeak 38. artikuluan ezarri duenez, estatuko lurralde
  osoan aplikatzekoak diren eduki komunak kontuan hartu behar dituzte, eta, gainera,
  eduki horiek erregelamendu bidez arautuko dira. Orobat dio ezen, erregelamendu bidezko
  garapen horretan, desgaitasuna duten pertsonen laneratzea laguntzeko enplegu-politika
  aktiboen lege-esparrua arautuko da Estatuko neurriei dagokienez; lege-esparru horretan,
  Esta\u00ad tuan aplikatu beharreko gutxieneko edukiak zehaztuko dira.\\n\\nNolanahi
  ere, oraindik ez da onartu aurreikusitako programetarako erregelamendu-garapena.
  Horrekin lotuta, Enplegua Aktibatzeko Espainiako 2017-2020 Estrategian \u2013abenduaren
  15eko 1032/2017 Errege Dekretuaren bidez onartu zen\u2013 ezartzen da arau-garapen
  hori aurrera era\u00ad maten ez den bitartean garatzen diren programek Estrategian
  bertan jasotako printzipioak hartu beharko dituztela oinarri. Hala, autonomia-erkidegoek
  bi aukera dituzte: indarrean dagoen estatuko araudian estatu osorako araututako
  zerbitzuak eta programak garatzea, edota enplegu-politika aktiboen zerbitzu eta
  programa propioak garatzea, aurrekoak ez bezalakoak, nork bere lurraldeko langabeen
  egoerari eta ekoizpen-sareari egokituz.\\n\\nAzken urteetan, administrazio publikoen,
  gizarte-solaskideen eta desgaitasunaren esparruarekin loturiko elkarte- eta enpresa-sareen
  konpromiso irmoari eta baterako jardunari esker, desgaita\u00ad suna duten pertsonen
  laneratzea errazteko araudi garrantzitsuak landu dira, eta programa asko garatu
  dira, horretara bideratutako aurrekontuei esker. Jardunbide horren emaitzak itxaropentsuak
  dira, gero eta gehiago ari baitira sartzen desgaitasuna duten pertsonak lan-merkatuan.\\n\\nEuskadin,
  zalantzarik gabe, enplegu-zentro berezietako enplegu babestuaren formula funtsez\u00ad
  koa izan da Euskal Autonomia Erkidegoko desgaitasuna duten pertsonen laneratzea
  sustatzeko. Izan ere, enplegu-zentro bereziek, desgaitasuna duten pertsonak enplegatzean,
  gizarte-trebeta\u00ad sunak eta lanerakoak beregana ditzaten laguntzen dute, eta,
  horrela, haien enplegagarritasuna hobetzen dute eta ekoizpen-sistema arruntean sartzeko
  bidea errazten diete.\\n\\nBetiere gogoan izan behar dugu lortu nahi den amaierako
  helburua dela desgaitasuna duten pertsonak ahalik gehien laneratzea enplegu arruntean.
  Hori dela eta, aurrera jarraitu behar da enplegu-politika aktiboen gauzapenean,
  formula berriak garatuz, lehentasunezko helburua izanik talde hori lan-merkatu arruntean
  laneratzea.\\n\\nEuskal Herriaren Autonomia Estatutuaren 12.2 artikuluak ezartzen
  du lan-legeria betearaz\u00ad teko eskumena Euskal Autonomia Erkidegoari dagokiola,
  eta zeregin horretan saiatu behar duela lan-baldintzak gizartearen garapen- eta
  aurrerapen-mailarekin bat etor daitezen, eta langileen kualifikazioa eta prestakuntza
  integrala sustatzen.\\n\\n2019/5502 (45/2)\\n\\n2019ko azaroaren 28a, osteguna\\n\\n2011ko
  urtarrilaren 1eko ondorio-datarekin, lanaren, enpleguaren eta enplegurako lanbide-pres\u00ad
  takuntzaren esparruan ordura arte Estatuko Enplegu Zerbitzu Publikoari zegozkion
  lan-arloko legeria betearazteko eginkizunak eta zerbitzuak Euskal Autonomia Erkidegoari
  eskualdatu zitzaiz\u00ad kion, 2010eko urriaren 28ko Transferentzien Batzorde Mistoaren
  Erabakian \u2013azaroaren 9ko 289/2010 Dekretuaren bidez onartu zen\u2013 xedatutako
  moduan. Besteak beste, desgaitasuna duten pertsonen laneratzearen arloko eskumen
  betearazleak nahiz enplegu-zentro berezien kalifikazioa eta erregistroa egiteko
  eskumena eskualdatu ziren.\\n\\nLehendakariaren azaroaren 26ko 24/2016 Dekretuaren
  bidez \u2013Euskal Autonomia Erkidegoaren Administrazioko sailak sortzen, ezabatzen
  eta aldatzen ditu, eta horien egitekoak eta jardun-arloak finkatzen ditu\u2013,
  Enpleguko eta Gizarte Politiketako Sailari esleitzen zaio enplegu-politika.\\n\\nLanbide-Euskal
  Enplegu Zerbitzua erakunde autonomoa Enpleguko eta Gizarte Politiketako Sailari
  atxikita dago, eta, besteak beste, enplegu-programak, enplegurako prestakuntzakoak
  nahiz autoenplegua eta enpresa-sorkuntza sustatzekoak kudeatzea dagokio, bai eta
  gizarteratzeko zein laneratzeko zailtasun bereziak dituzten taldeentzako enplegu-programa
  espezifikoak lantzea ere. Halaber, erakunde horri dagozkio enplegu-zentro berezien
  erregistroarekin loturiko eginkizunak.\\n\\nDekretu honen xedea da, batetik, desgaitasuna
  duten pertsonek lan-jarduera egonkor eta kalita\u00ad tezkoa izan dezaten sustatzeko
  Eusko Jaurlaritzak Lanbide-Euskal Enplegu Zerbitzuaren bitartez emango dituen laguntzen
  esparru orokorra arautzea (II. Kapituluan). III. Kapituluan, desgaitasuna duten
  pertsonen enplegagarritasuna hobetzeko ekimenak arautzeko esparrua ezartzen du.
  Beste\u00ad tik, IV. Kapituluan, Enplegu Zentro Berezien Euskal Erregistroa sortzen
  eta arautzen du, eta haien kalifikazioa eta inskripzioa egiteko prozedura ezartzen
  du.\\n\\nLaguntza-programei dagokienez, 2011ko ekitalditik, Lanbide-Euskal Enplegu
  Zerbitzuak des\u00ad gaitasuna duten pertsonen enplegua sustatzeko askotariko programak
  kudeatu ditu, bai enplegu arruntaren esparruan, bai enplegu babestuaren esparruan.
  Haietako batzuk gauzatzean, hala nola enplegu-zentro berezietan laneratzeko laguntzak
  edota enpresa arruntetan kontratatzeko laguntzak, zuzenean aplikatzen zituen estatuko
  araudian ezarritako oinarri arautzaileak, eta finan\u00ad tzaketarako zuzkidura
  ekonomikoa esleitu baino ez zuen egiten. Beste programa batzuen kasuan, aldiz, hala
  nola enplegu lagunduko programetarako laguntzen kasuan, Lanbide-Euskal Enplegu Zerbitzuak
  laguntza-deialdi espezifikoak onartu ditu, eta programetarako estatuko araudian
  eza\u00ad rritako helburua eta oinarrizko edukiak mantendu baditu ere, berezitasun
  jakin batzuk txertatu ditu oinarri arautzaileetan.\\n\\nDekretu honetan, lehen aldiz,
  Euskal Autonomia Erkidegoan kudeatu beharreko askotariko pro\u00ad gramak, desgaitasuna
  duten pertsonen enplegua sustatzeko helburua dutenak, biltzen dira, tresna arauemaile
  bakar batean, hain zuzen.\\n\\nHala, dekretu honen II. Kapituluan, laguntza-programen
  oinarri arautzaileak jaso dira. Laguntza-programen deialdiak egiteko edo haiei aurrekontu-zuzkidura
  bat esleitzeko, jada inda\u00ad rrean egon beharko du urte bakoitzean programa horiei
  estaldura emango dien Euskal Autonomia Erkidegoko Aurrekontu Orokorren Legeak.\\n\\nEdonola
  ere, dekretu honetan jasotzen diren laguntza-programen tipologian eta ezartzen zaiz\u00ad
  kien baldintzetan, ez dago orain arte gauzatutakoekiko aldaketa berritzailerik dakarren
  arauketarik. Funtsean, gaur egun Lanbide-Euskal Enplegu Zerbitzuak kudeatzen dituen
  laguntza-programen oinarrizko alderdiak mantentzen dira, baina alderdi batzuk garatu
  egin dira, haien gauzapenean legaltasun-printzipioaren eta segurtasun juridikoaren
  bermea areagotzeko, eta autonomia-erki\u00ad dego honen antolakuntza- eta gizarte-berezitasunei
  egokitzeko, aldi berean programei tratamendu homogeneoa emanez eta haien arteko
  koherentzia bilatuz.\\n\\n2019/5502 (45/3)\\n\\n2019ko azaroaren 28a, osteguna\\n\\nGainera,
  laguntzak lehiakortasunari buruzko Europar Batasuneko araudiarekin bateragarriak
  izateko moduan ezarri dira. Hala, ekainaren 17ko Batzordearen 651/2014 (EB) Erregelamenduan
  \u2013 laguntza-kategoria jakin batzuk barne-merkatuarekiko bateragarriak direla
  ezartzen du\u2013 xedatutako eskakizunak eta baldintzak bete dira, bai eta 2013ko
  abenduaren 18ko Batzordearen 1407/2013 (EB) Erregelamenduan \u2013Europar Batasunaren
  Funtzionamenduari buruzko Tratatuaren 107. eta 108. artikuluen aplikazioari buruzkoa
  (de minimis laguntzak)\u2013 xedatutakoa ere. II. kapituluko 2. atalean \u2013Enplegu
  lagunduko jarduketetarako laguntzak\u2013 araututa dauden dirulaguntzen kasuan izan
  ezik; izan ere, dirulaguntza horiek ez dira estatu-laguntzatzat hartzen Europar
  Batasunaren Funtzionamenduari buruzko Tratatuaren 107.1 artikuluan xedatutakoaren
  ondorioetarako, era\u00ad kunde onuradunei ez dielako inolako abantaila ekonomikorik
  ematen.\\n\\nDesgaitasuna duten pertsonen enplegua sustatzeko, dekretu honetan araututako
  programez gain, badira hobariak ere, gizarte-segurantzako kotizazioan; estatuak
  arautzen ditu, eta Euskal Autonomia Erkidegoko aurrekontu orokorren kargura finantzatzen
  dira.\\n\\nEusko Jaurlaritzaren enplegu-politikaren esparruan, desgaitasuna duten
  pertsonei ematen zaien arretaren barnean sartzen dira, enplegua sustatzeko programekin
  batera, enplegurako orientabide- eta prestakuntza-zerbitzuak, hain zuzen ere politiken
  eta jardunbideen zeharkako\u00ad tasun-printzipioa aintzat hartuta.  Lanbide-Euskal
  Enplegu Zerbitzuari dagokio zerbitzu horiek diseinatzea eta gauzatzea, eta eginkizun
  horretan, aintzat hartzen dira talde horren premia espe\u00ad zifikoak. Horretarako,
  erakunde espezializatuekin lankidetzan jarduten du, desgaitasuna duten pertsonei
  orientabidea emateko eta laneratzeko ibilbide pertsonalizatuak diseinatzeko, eta
  per\u00ad tsona horien gaitasunak eta enplegagarritasuna hobetzea xede duten ekintza
  egokituak txertatzen ditu prestakuntza-eskaintzan. Xede horri begira sortu da III.
  kapitulua, desgaitasuna duten pertso\u00ad nei orientabidea eta enplegurako prestakuntza
  emateko jarduketak arautzen dituena.\\n\\nBestalde, dekretu honen IV. kapituluan,
  Enplegu Zentro Berezien Euskal Erregistroa sortzen eta arautzen da, eta haien kalifikazioa
  eta inskripzioa egiteko prozedura ezartzen da.\\n\\nAbenduaren 4ko 2273/1985 Errege
  Dekretuak osatzen du arlo honetako lege-esparru orokorra. Enplegu Zentro Berezien
  Erregelamendua onartzen du errege-dekretu horrek. 7. artikuluan xeda\u00ad tzen
  duenez, aipatutako zentroak sortzeko, nahitaezkoa izango da administrazioek enplegu-zentro
  bereziak hala kalifikatzea eta beren eskumeneko eremuan sortuko dituzten erregistroetan
  inskribatzea.\\n\\nEnplegu Zentro Berezien Euskal Erregistroa Lanbide-Euskal Enplegu
  Zerbitzuko Laneratzea Aktibatzeko Zuzendaritzari atxikita dago; organo horri esleitu
  zaizkio erakunde autonomoaren laneratzearen esparruko programak kudeatzeko eta laguntzeko
  eginkizunak.\\n\\nEnplegu-zentro bereziaren kalifikazioa eskuratzeko eta zentroa
  Erregistroan inskribatzeko baldintzak arautzen dira, bai eta horretarako prozedura
  ere; era berean, inskripzio-liburuaren antolamendua, jarraipen- eta kontrol-jarduketak,
  eta, azkenik, deskalifikatzearen eta erregistroan ezeztatzearen kausak eta horretarako
  prozedura arautzen dira.\\n\\nHorrenbestez, Enpleguko eta Gizarte Politiketako sailburuak
  proposatuta, eta Gobernu Kontsei\u00ad luak 2019ko urriaren 29an egindako bilkuran
  aztertu eta onartu ondoren, honako hau\\n\\n2019/5502 (45/4)\\n\\nXEDATZEN DUT:\\n\\nI.
  KAPITULUA\\n\\nXEDAPEN OROKORRAK\\n\\n1. artikulua.\u2013 Xedea.\\n\\nDekretu honen
  xedea da Eusko Jaurlaritzak Lanbide-Euskal Enplegu Zerbitzuaren bitartez emango
  dituen desgaitasuna duten pertsonen enplegagarritasunarekin loturiko laguntza-pro\u00ad
  gramak eta zerbitzuak arautzea; horien helburua da pertsona horiei laneratzen eta
  lan-jarduera egonkorra eta kalitatezkoa lortzen laguntzea, bai eta enplegua mantentzen
  ere.\\n\\nEra berean, dekretu honen xedea da Enplegu Zentro Berezien Euskal Erregistroa
  sortzea, eta zentro horien kalifikaziorako eta Erregistroan inskribatzeko baldintzak
  eta prozedura arautzea.\\n\\n2. artikulua.\u2013 Aplikazio-eremua.\\n1.\u2013 Dekretu
  hau aplikatzeko lurralde-eremua Euskal Autonomia Erkidegoa da.\\n2.\u2013 Dekretu
  honetan araututako laguntzak Euskal Autonomia Erkidegoan finkatutako lantokiekin
  lotutako jarduketei aplikatuko zaizkie, betiere 2020ko urtarrilaren 1etik aurrera
  gauzatuko diren jarduketak izanik. Enplegu-zentro bereziei emateko laguntzen kasuan,
  horiek, gainera, Enplegu Zentro Berezien Euskal Erregistroan inskribatuta egon beharko
  dute.\\n3.\u2013 Enplegu Zentro Berezien Euskal Erregistroaren araubidea egoitza
  soziala eta fiskala Euskal Autonomia Erkidegoan duten enplegu-zentro bereziei aplikatzekoa
  izango da, bai eta erregistro horretan bigarren xedapen iragankorrean xedatutakoa
  betez sartzen direnei ere.\\n3. artikulua.\u2013 Desgaitasuna duen pertsonaren definizioa,
  dekretu honen ondorioetarako.\\n1.\u2013 Dekretu honen ondorioetarako, desgaitasuna
  duten pertsonatzat hartuko dira % 33ko edo gehiagoko desgaitasun-maila aitortuta
  dutenak.\\n2.\u2013 Desgaitasuna izanik laneratzeko zailtasun bereziak dituzten
  pertsonatzat hartuko dira:\\na) Garun-paralisia, gaixotasun mentalen bat edo desgaitasun
  intelektuala duten pertsonak, bal\u00ad din eta % 33ko edo gehiagoko desgaitasun-maila
  aitortuta badute.\\nb) Desgaitasun fisikoa edo sentsoriala duten pertsonak, baldin
  eta % 65eko edo gehiagoko desgaitasun-maila aitortuta badute.\\n4. artikulua.\u2013
  Enplegagarritasuna hobetzeko prozesuen definizioa.\\n\\nKontuan hartuta desgaitasuna
  duten pertsonen egoerak bereziak izaten direla, Eusko Jaurla\u00ad ritzak, Lanbide-Euskal
  Enplegu Zerbitzuaren bitartez, enplegua lortzera bideratutako banakako ibilbide
  pertsonalizatuak diseinatuko ditu, hainbat neurri eta politika egoki ordenatuz eta
  konbina\u00ad tuz, desgaitasuna duten pertsonen lanbide-profilari eta premia espezifikoei
  egokitzeko.\\n\\nHalaber, desgaitasuna duten pertsonen gaitasunak hobetzera bideratutako
  ekintza egokituak txertatu ahal izango ditu prestakuntza-eskaintzan.\\n\\n2019/5502
  (45/5)\\n\\nII. KAPITULUA\\n\\nDESGAITASUNA DUTEN PERTSONEN ENPLEGUA SUSTATZEKO
  PROGRAMAK\\n\\n1. ATALA\\n\\nDESGAITASUNA DUTEN PERTSONEN ENPLEGUA LAN-MERKATU ARRUNTEAN
  SUSTATZEKO LAGUNTZAK\\n\\n5. artikulua.\u2013 Atal honen xedea.\\n\\nAtal honen
  xedea da desgaitasuna duten pertsonen enplegua lan-merkatu arruntean susta\u00ad
  tzeko laguntzak arautzea. Horretarako dirulaguntzak bi lerrotan sailkatu dira:\\n\\na)
  Kontratatzeko laguntzak; 1. azpiatalean xedatu dira.\\nb) Lanpostu-egokitzeak egiteko
  eta oztopoak kentzeko laguntzak; 2. azpiatalean xedatu dira.\\n6. artikulua.\u2013
  Laguntzen onuradun izan daitezkeen enpresak.\\n1.\u2013 Atal honetan xedatutako
  laguntzen onuradun izan daitezke langileen kontratazioak edota lanpostu-egokitzeak
  zein oztopoak kentzeko jarduketak egiten dituzten enpresak, hurrenez hurren 9. eta
  16. artikuluetan xedatutako moduan, betiere jarduketa horiek Euskal Autonomia Erkidegoan
  finkatutako lantokietan zerbitzuak emateko egin badira.\\n\\nKanpo geratzen dira
  administrazio publikoak, erakunde autonomoak, zuzenbide pribatuko ente publikoak
  eta sektore publikoko gainerako entitateak.\\n\\n2.\u2013 Langile autonomoak, beren
  plantillako langileekin loturiko laguntzen onuradun izateaz gain, beren lanpostuarekin
  loturiko laguntzen onuradun ere izan daitezke; 2. azpiatalean arautu dira azken
  horiek.\\n7. artikulua.\u2013 Aurrekontu-zuzkidura.\\n\\nLanbide-Euskal Enplegu
  Zerbitzuko Administrazio Kontseiluaren Erabaki baten bidez, urtero ezarriko da atal
  honetan araututako laguntzak finantzatzera bideratuko diren baliabide ekonomi\u00ad
  koen zenbatekoa.\\n\\nIndarrean dagoen legediaren araberako aurrekontu-aldaketarik
  onartzen bada, aurrekontu-eki\u00ad taldi batean emango diren laguntzen bolumen
  osoak ezin izango du gainditu ez aipatutako esleipena ez haren igoeraren ondoriozkoa.\\n\\nHasierako
  aurrekontu-zuzkiduraren eta egin litezkeen aldaketen jakinarazpenak Euskal Herriko
  Agintaritzaren Aldizkarian (EHAA) argitaratuko dira, Lanbide-Euskal Enplegu Zerbitzuko
  zuzendari nagusiaren ebazpen baten bidez.\\n\\n8. artikulua.\u2013 Dirulaguntza
  emateko prozedura. Ebazpena.\\n1.\u2013 Eskaerak aurkezten diren hurrenkeran aztertuko
  dira, kontuan hartu gabe lerro bateko edo besteko dirulaguntzetarako diren, eta
  hurrenkera horretan emango zaizkie laguntzak deialdian ezarritako eskakizunak eta
  baldintzak betetzen dituztenei, harik eta aurrekontu-zuzkidura amaitu arte.\\n\\n2019/5502
  (45/6)\\n\\n2.\u2013 Aurrekontu-kreditua agortzen bada, horren berri jakinaraziko
  da EHAAn argitaratuz, Lan\u00ad bide-Euskal Enplegu Zerbitzuko zuzendari nagusiaren
  ebazpen baten bidez.\\n\\nEkitaldi batean kreditu-faltagatik laguntza-eskaera batzuei
  ezin izan bazaie erantzun, laguntza horiek hurrengo ekitaldian eman ahal izango
  dira, ekitaldi horretako aurrekontu-kredituen kargura, beste eskabide bat aurkeztu
  behar izan gabe.\\n\\n3.\u2013 Ebazteko eta ebazpena jakinarazteko gehieneko epea
  sei hilabetekoa izango da, eskabidea aurkezten den datatik aurrera. Epe hori igarotakoan
  esanbidezko ebazpenik jakinarazi ez bada, eskaera baietsi egin dela ulertuko da.\\n\\n1.
  AZPIATALA\\n\\nDESGAITASUNA DUTEN PERTSONAK LAN-MERKATU ARRUNTEAN KONTRATATZEKO
  LAGUNTZAK\\n\\n9. artikulua.\u2013 Diruz lagun daitezkeen jarduketak.\\n1.\u2013
  Diruz lagundu ahal izango da kontratazio mugagabea, bai eta kooperatiba edo lan-sozie\u00ad
  tateetarako bazkide langileak edo lan-bazkideak hartzea ere, baldin eta hartzen
  diren pertsonak desgaitasuna izanik langabezia-egoeran daudenak badira; hau da,
  ez badaude altan Gizarte Segurantzako ezein erregimenetan eta enplegu-zerbitzu publikoetan
  enplegu-eskatzaile gisa ins\u00ad kribatuta badaude.\\n\\nEra berean, diruz lagundu
  ahal izango dira mugagabe bihurtzen diren aldi baterako kontratuak, baldin eta enplegua
  sustatzeko kontratuak edo prestakuntzarako kontratuak badira.\\n\\n2.\u2013 Aldi
  baterako kontratuak mugagabe bihurtzen diren kasuetan, ez da eskatuko pertsona lan\u00ad
  gabezia-egoeran egotearen baldintza.\\n\\nEra berean, baldintza hori ez da eskatuko
  langilea Euskal Autonomia Erkidegoko enplegu-zen\u00ad tro berezi batetik zuzenean
  enpresa onuradunera igarotzen bada kontratatuta, ez eta enpresa laguntzailera igarotzen
  bada ere, lan-enklabeen kasuan. Kasu horietan, enpresak egindako kon\u00ad tratazioak
  etenik gabea izan behar du.\\n\\n3.\u2013 Lan-enklabean desgaitasuna duten pertsonak
  kontratatzen badira, kontratazioa enklabea\u00ad ren hasieratik edota, langilea
  geroago sartu bada, langilea enklabean sartu zenetik gutxienez hiru hilabeteko epea
  igaro ondoren egin behar du enpresa laguntzaileak, eta kontratazio horrek etenik
  gabea izan behar du.\\n4.\u2013 Lanaldi osoko zein lanaldi partzialeko kontratazioak
  egin ahal izango dira. Azken kasu horre\u00ad tan, lanaldiak lanaldi osoaren % 50ekoa
  izan behar du, edota, desgaitasuna izanik laneratzeko zailtasun bereziak dituzten
  pertsonak kontratatzen badira, gutxienez % 35ekoa.\\n5.\u2013 Hauek ez dira diruz
  lagunduko:\\na) Banako enpresaburuaren ezkontidearen kontratazioa, haren aurreko
  edo ondorengo ahai\u00ad deen kontratazioa, edo odol-ahaidetasun bidezko, ezkontza
  bidezko zein adopzio bidezko alboko ahaideen kontratazioa, bigarren mailara artekoak
  barne. Halaber, ez dira diruz lagunduko izaera pertsonalistako sozietate-forma duten
  enpresetako edozein bazkideren ahaide horien kontratazioa, eta edozein motatako
  sozietate, asoziazio edo korporazio gisa eratutako enpresetako bazkideen zein gobernu-organoetako
  eta zuzendaritzako kideen ahaide horien kontratazioa.\\n\\n2019/5502 (45/7)\\n\\nb)
  Bazkideen kontratazioa, kooperatiba-sozietateetan eta lan-sozietateetan izan ezik.\\nc)
  Kontratazioaren dataren aurreko 24 hilabeteetan enpresa eskatzailean edo enpresa
  horren enpresa-talde bereko beste enpresa batean kontratu mugagabearen bidez zerbitzuak
  eman dituz\u00ad ten langileei egindako kontratazioak.\\nEnpresa-taldetzat joko
  da 1407/2013 (EB) Erregelamenduaren 2.2 artikuluan jasotako enpresa bakarraren definizioarekin
  bat datorrena edo Merkataritzako Kodearen 42. artikuluan xedatutako sozietate-taldearen
  definizioarekin bat datorrena.\\nd) Hala aitortuta edo adierazita bidegabetzat jo
  diren lan-kaleratzeen ondorioz hutsik geratutako lanpostuak betetzeko egindako kontratazioak.\\n10.
  artikulua.\u2013 Dirulaguntzaren zenbatekoa.\\n1.\u2013 Aurreko artikuluan xedatutako
  kontratazioak egiteagatiko dirulaguntzaren zenbatekoa, lanaldi osorako, 4.000 eurokoa
  da.\\n2.\u2013 Enpresa laguntzaileak lan-enklabeko pertsona bat kontratatzen duen
  kasuetarako, kon\u00ad tratatutako pertsona desgaitasuna izanik laneratzeko zailtasun
  bereziak dituena baldin bada, dirulaguntzaren zenbatekoa 8.000 eurokoa da.\\n3.\u2013
  Lan-kontratua lanaldi partzialekoa bada, aurreko apartatuetan xedatutako dirulaguntza
  hitzartutako lanaldiaren arabera murriztuko da, proportzionalki.\\n4.\u2013 Kontratatutako
  pertsona emakumea bada, dirulaguntzaren zenbatekoa % 10 handituko da.\\n5.\u2013
  Dirulaguntzaren zenbatekoak ezin izango du gainditu egindako kontratuari dagokion
  urteko soldata-kostuaren % 75, ulertzen delarik kopuru hori ordainsari gordinaren
  eta gizarte-seguran\u00ad tzako kotizazioaren batura dela.\\n11. artikulua.\u2013
  Eskabideak eta nahitaezko dokumentazioa aurkeztea.\\n1.\u2013 Kontratazioagatiko
  dirulaguntzaren eskabideak aurkezteko epea hilabetekoa izango da, kontratuaren hasieratik
  edo kontratua mugagabe bihurtu denetik zenbatzen hasita.\\n2.\u2013 Dirulaguntzaren
  eskabidea osorik bete behar da, eta, harekin batera, dokumentazio hau aurkeztu behar
  da:\\na) Egindako lan-kontratuaren kopia. Aldi baterako kontratuak mugagabe bihurtzen
  diren kasue\u00ad tan, enplegua sustatzeko kontratuaren edo prestakuntzarako kontratuaren
  kopia, eta mugagabe bihurtzearen dokumentua.\\nKooperatiben eta lan-sozietateen
  kasuan, langile bazkideekin edo lan-bazkideekin egindako sozietate-kontratuaren
  kopia.\\nb) Desgaitasun-mota eta -mailaren egiaztagiria, erakunde eskudunak egina.\\n12.
  artikulua.\u2013 Dirulaguntza ordaintzea.\\nDirulaguntza ordainketa bakarrean ordainduko
  da, ematen den unean.\\n13. artikulua.\u2013 Enplegua mantentzeko betebeharra.\\n1.\u2013
  Azpiatal honetan araututako kontratazioagatiko laguntzen onuradun diren enpresek
  bete\u00ad beharra dute kontratatutako pertsonen enpleguaren egonkortasuna bermatzeko.\\n\\n2019/5502
  (45/8)\\n\\nKontratua hasi denetik edo mugagabe bihurtu denetik hiru urte igaro
  baino lehen langileak enpresan baja hartzen badu, enpresa onuradunak, dirulaguntza
  jasotzeko eskubideari eusteko, desgaitasuna izanik langabezia-egoeran dagoen beste
  langile batez ordezkatu behar du, hilabe\u00ad teko epean, eta ordezkapen horrek
  ez dio ekarriko beste laguntza bat jasotzeko eskubiderik.\\n\\n2.\u2013 Langilea
  ordezkatzen ez bada, eta kontratuaren azkentzea enpresa onuradunari egotz dakiokeen
  kausa baten ondoriozkoa bada, enpresa onuradunak jasotako laguntza osorik itzul\u00ad
  tzeko betebeharra izango du.\\n\\nEnpresan emandako baja enpresaren borondatearekin
  zerikusirik ez duen kausa batengatik gertatu bada, enpresak dirulaguntzaren zenbatekoaren
  zati bat itzuli beharko du, langileak lana utzi duenetik hiru urte igaro bitarteko
  aldiari dagokion dirulaguntzaren zatia, hain zuzen.\\n\\n14. artikulua.\u2013 Laguntzen
  bateragarritasuna barne-merkatuarekin.\\n\\nAzpiatal honetan araututako laguntzak
  de minimis laguntzatzat hartuko dira. Laguntza horiek Batzordearen 2013ko abenduaren
  18ko 1407/2013 (EB) Erregelamenduan \u2013 Europar Batasunaren Funtzionamenduari
  buruzko Tratatuaren 107. eta 108. artikuluak aplikatzeari buruzkoa\u2013 arautzen
  dira. Kalifikazio horren ondorioz, enpresa bakarrari de minimis laguntzetan emandako
  guztizko zenbatekoa ez da izango 200.000 eurotik gorakoa hiru ekitaldi fiskalen
  barruan.\\n\\nMuga hori aplikatzeko, kontuan hartu beharko da nola definitzen den
  \u00abenpresa bakarra\u00bb Erre\u00ad gelamendu horren 2.2 artikuluan.\\n\\nLaguntza
  eskatu duen enpresak dagokion ekitaldi fiskalean eta aurreko bietan jasotako de
  minimis laguntza horien aitorpena egin beharko du, de minimis laguntza berriarekin
  aipatutako erregelamenduan ezarritako gehieneko muga ez duela gainditzen egiaztatzeko.\\n\\n15.
  artikulua.\u2013 Aldi berean beste dirulaguntza batzuk jasotzea.\\n\\nAzpiatal honetan
  xedatutako dirulaguntzak kontratazio beragatik jasotako beste laguntza batzuei batu
  ahal izango zaizkie, betiere batura horrek ez badu gainditzen urteko soldata-kostuaren
  % 75, ulertzen delarik kostu hori ordainsari gordinaren eta gizarte-segurantzako
  kotizazioaren batura dela.\\n\\n2. AZPIATALA\\n\\nLANPOSTU-EGOKITZEAK EGITEKO ETA
  OZTOPOAK KENTZEKO LAGUNTZAK\\n\\n16. artikulua.\u2013 Diruz lagun daitezkeen jarduketak.\\n1.\u2013
  Diruz lagundu ahal izango dira desgaitasuna duten pertsonek gainerako pertsonekiko
  lan-ingurunean dituzten desabantailak gainditzera bideratutako jarduketak, hala
  nola lan-inguru\u00ad nean edo ekoizpen-prozesuan irisgarritasuna hobetzeko jarduketak
  nahiz lanpostu-egokitzeak egitekoak, betiere banakoari eragiten diotenak; zehazki,
  hauek:\\na) Desgaitasuna duten pertsonek lanlekuetarako irisgarritasuna izatea eragozten
  edo zailtzen duten oztopo fisikoak kentzea, bai eta lanlekuetan haien mugikortasuna
  edo komunikazioa ozto\u00ad patzen duten hesiak kentzea ere.\\nb) Lan-ekipamenduak,
  hala nola altzariak, makinak edo ekipo informatikoak, desgaitasuna duten pertsonei
  egokitzea, bai eta lanpostuaren ingurune fisikoa nahiz ekoizpen-prozesua ere.\\n\\n2019/5502
  (45/9)\\n\\nc) Desgaitasuna duten pertsonek erabiltzeko egokiak diren programa informatikoak
  eta komu\u00ad nikazio-bitartekoak instalatzea.\\n2.\u2013 Kapitulu honetan xedatutako
  diruz lagun daitezkeen jarduketak lanpostu batean baino gehiagotan egitekoak izan
  daitezke, enpresa berean.\\n3.\u2013 Enpresek gauzatutako jarduketek lotuta egon
  behar dute kontratu mugagabe berriekin, mugagabe bihurtutako aldi baterako kontratuekin,
  edota gutxienez urtebeteko iraupena duten aldi baterako kontratu berriekin.\\n4.\u2013
  Lanbide-Euskal Enplegu Zerbitzuak txostena eskatu ahal izango dio Laneko eta Gizarte
  Segurantzako Ikuskailetzari edota erakunde eskudunari, egiaztatzeko ea diruz lagun
  daite\u00ad keen jarduketa egokia eta beharrezkoa den irisgarritasuna hobetzeko,
  edo lanpostuaren edota ekoizpen-prozesuaren egokitzea egiteko.\\n17. artikulua.\u2013
  Dirulaguntzaren zenbatekoa.\\n1.\u2013 Banakoari eragiten dioten egokitzeak egiteko
  neurriak ezartzeagatiko dirulaguntzaren zen\u00ad batekoa 1.000 eurokoa izango da
  gehienez, desgaitasuna duen langile bakoitzeko. Kategorien araberako Salbuespenen
  Erregelamendu Orokorrarekin bat (651/2014 EE Erregelamendua), gehieneko intentsitatea
  diruz lagun daitezkeen kostuen % 100erainokoa izan daiteke.\\n2.\u2013 Dirulaguntzaren
  zenbatekoak ezin izango du gainditu diruz lagundutako egokitze-jarduke\u00ad taren
  kostua.\\n18. artikulua.\u2013 Eskabideak eta nahitaezko dokumentazioa aurkeztea.\\n1.\u2013
  Dirulaguntzaren eskabideak hilabeteko epean aurkeztu beharko dira, diruz lagundutako
  jar\u00ad duketa gauzatu den datatik aurrera, ulertzen delarik data hori dela obraren
  fakturaren, erositako materialaren edo jarduketa gauzatzeko zerbitzu-ematearen data.\\n2.\u2013
  Dirulaguntzaren eskabidea osorik bete behar da, eta harekin batera, dokumentazio
  hau aurkeztu behar da nahitaez:\\na) Desgaitasuna duten pertsonen eta egokitzeen
  edo oztopo-kentzeen eraginpeko lanpostuen zerrendak.\\nb) Egokitzeak edo oztopo-kentzeak
  azaltzen dituen memoria.\\n\\nc) Egokitzeak edo oztopo-kentzeak egiteko lanak ordaindu
  direla egiaztatzen duten fakturak.\\n\\n19. artikulua.\u2013 Dirulaguntza ordaintzea.\\nDirulaguntza
  ordainketa bakarrean ordainduko da, ematen den unean.\\n20. artikulua.\u2013 Laguntzen
  bateragarritasuna barne-merkatuarekin.\\n\\nAzpiatal honetan xedatutako dirulaguntzak
  2014ko ekainaren 17ko Batzordearen 651/2014 (EB) Erregelamenduaren mende daude \u2013erregelamendu
  horren bidez, laguntza-kategoria jakin batzuk barne-merkatuarekin bateragarriak
  direla ezartzen da, Europar Batasunaren Funtziona\u00ad menduari buruzko Tratatuaren
  107. eta 108. artikuluak aplikatuz\u2013, eta, bereziki, erregelamendu horren 34.
  artikuluaren mende.\\n\\n21. artikulua.\u2013 Aldi berean beste dirulaguntza batzuk
  jasotzea.\\n\\nLanpostu-egokitzeengatiko dirulaguntzak beste laguntza batzuei batu
  ahal izango zaizkie, bar\u00ad nean hartuta diruz lagun daitezkeen kostu berberei
  dagozkien de minimis laguntzak, betiere batura horrek ez badu gainditzen diruz lagun
  daitezkeen kostuen % 100.\\n\\n2. ATALA\\n\\nENPLEGU LAGUNDUKO JARDUKETETARAKO LAGUNTZAK\\n\\n22.
  artikulua.\u2013 Diruz lagun daitezkeen jarduketak.\\n1.\u2013 Atal honetan xedatutako
  dirulaguntzak jaso ahal izango dituzte dirulaguntzak eman diren ekitaldiari dagokion
  urtearen barruan, urtarrilaren 1etik abenduaren 31ra bitartean, garatu diren enplegu
  lagunduko jarduketek.\\n\\nEnplegu lagunduko jarduketatzat hartzen dira desgaitasuna
  izanik laneratzeko zailtasun bere\u00ad ziak dituzten pertsonak lan-merkatu arruntean
  laneratzeko xedea dutenak; talde horretan sartzen dira, programa honen ondorioetarako,
  gorrak edo entzuteko desgaitasuna duten eta % 33ko edo hortik gorako desgaitasun-maila
  onartu zaien pertsonak, baldin eta Lanbide-Euskal Enplegu Zer\u00ad bitzuan enplegu-eskatzaile
  langabe gisa erregistratuta badaude, bai eta enplegu-zentro bereziek kontratatu
  dituzten langileak ere. Jarduketa horiek erakunde onuradunetako langile espezializa\u00ad
  tuek egingo dituzte \u2013Enplegu Lagunduko Unitateak\u2013, eta unitate horiek
  23. artikuluan araututako osaera eta eginkizunak izango dituzte. Eginkizun horien
  artean daude, besteak beste, desgai\u00ad tasuna duten pertsonak enpresa arruntean
  sartu baino lehen egin behar diren jarduketak eta lanpostuan bertan egin behar direnak.
  Jarduketa horiek garatzerakoan, tratu- eta aukera-berdinta\u00ad sunaren printzipioak
  eta genero-diskriminaziorik ezaren printzipioa bete beharko dira. Hauek dira aipatutako
  jarduketa horiek:\\n\\na) Lanpostuan hasi baino lehen:\\n\u2013 Enpresa arruntean
  informazioa ematea eta sentsibilizazioa sustatzea.\\n\u2013 Jarduketen xede den
  taldeari egokitutako enplegu-aukerak bilatzea eta jasotzea, banakoa oinarri hartuta.\\n\u2013
  Lanpostuak identifikatzea eta xehetasunez aztertzea, enpleguaren ezaugarriak eta
  garatze-bal\u00ad dintzak zehazteko, eta beharrezkoa eta esanguratsua den informazio
  guztia lortzeko.\\n\u2013 Desgaitasuna duten pertsonen artean, lanpostu hori betetzeko
  behar diren ezaugarriak dituz\u00ad ten pertsonak identifikatzea.\\n\u2013 Bateragarritasunaren
  azterketa: alde batetik, postuaren profila, eta, bestetik, desgaitasunen bat dutenen
  artean postu hori betetzeko hautatutako pertsona.\\n\u2013 Lanpostuaren ezaugarriak
  eta eskakizunak kontuan hartuta, horien neurrizko egokitzeak egi\u00ad tea zenbateraino
  izango litzatekeen beharrezkoa aztertzea.\\nb) Lanpostuan:\\n\u2013 Banakako prestakuntza
  lanpostuan, langileak eskatzen diren lanbide-gaitasunak lortzeko eta bere lanpostuan
  nahiz lan-ingurunean ahalik ongien integratzeko.\\n\\n2019ko azaroaren 28a, osteguna\\n\\n\u2013
  Enpresaren antolamenduan eta bereziki desgaitasuna duen langilearekin elkarrekintzan
  jarduten duten lankideen artean sentsibilizazioa sustatzea, eta horiei prestakuntza
  eta laguntza ematea.\\n\u2013 Lanpostuaren ezaugarriak eta eskakizunak kontuan hartuta,
  beharrezkotzat jo diren neurrizko egokitzeak bideratzea eta gauzatzea.\\n\u2013
  Epe luzerako laguntza pertsonalizatua eta banakako jarraipena: kontratatu den pertsona
  lane\u00ad ratu ondoren, beharrezkoa da haren eta enpresaren jarraipena egitea,
  laneratzea behar bezala garatzen dela bermatzeko, eta, lanpostuari dagokion jardunean
  edo lan-ingurunean aldaketarik gertatzen bada, horrekin batera sortutako prestakuntza-
  eta egokitze-premiei erantzuteko.\\n\u2013 Ebaluazioa. Prozesu guztia nola garatu
  den baloratu behar da, bai enpresaren bai desgaita\u00ad suna duen pertsonaren aldetik,
  eta bi aldeen gogobetetze-maila ebaluatu behar da.\\n2.\u2013 Enplegu lagunduko
  jarduketengatiko dirulaguntza eskuratzeko, ezinbestekoa da desgai\u00ad tasuna duten
  pertsonentzako enplegu-aukerak bilatzeko eta pertsona horiek enpresa arruntean laneratzeko
  konpromisoa erakustea, bai eta helburu horiek erdiestea ere, 24. artikuluan xeda\u00ad
  tutakoa betez, helburu horien lorpenak baldintzatzen baitu dirulaguntza eskuratzeko
  aukera, eta horren araberakoa baita haren zenbatekoa ere.\\n\\nLaneratze-helburuak
  lortutzat emateko, enplegu lagunduko jarduketen xede diren desgaitasuna duten pertsonak
  lan-merkatu arrunteko enpresa batek kontratatu beharko ditu, kontratu mugagabe baten
  bidez edo gutxienez 6 hilabeteko iraupena izango duen aldi baterako kontratu baten
  bidez, eta enpresaren egituraren barneko lanpostu batean enplegatu behar dira egiaz.
  Langileari lanaldi partzialeko kontratua egin bazaio, haren lanaldia lanaldi osoko
  pareko langile baten lanaldiaren % 35aren baliokidea izango da gutxienez.\\n\\nHalaber,
  laneratze-helburuak lortutzat joko dira, eta, beraz, diruz lagunduko dira, hasiera
  batean 6 hilabetetik beherako aldi baterako egin diren kontratazioak, baldin eta
  gero aldi baterako kon\u00ad tratu horren luzapena edo ondoz ondoko kontratuak egiten
  badira, eta hasierako kontratuaren eta haren luzapenaren edo ondoz ondoko kontratuen
  iraupena, guztira, sei hilabetekoa edo gehiago\u00ad koa bada, eta beste baldintza
  hauek betetzen badira:\\n\\n\u2013 Kontratuak enpresa berean eta lanpostu bererako
  egin izana.\\n\u2013 Kontratuak ondoz ondo egin izana, haien arteko etenik gabe.\\n3.\u2013
  Era berean, diruz lagundu ahal izango dira, laguntza eman deneko urtearen barruan
  garatu diren jarduketak izanik, aurreko ekitaldietan kontratatutako pertsonen jarraipena
  egitera eta haiei laguntzera bideratutako jarduketak, helburu dutenak laneratzea
  behar bezala garatzen ari dela egiaztatzea, eta, lanpostuari dagokion jardunean
  edo lan-ingurunean aldaketarik gertatzen bada, horrekin batera sortutako prestakuntza-
  eta egokitze-premiei erantzutea, bai eta langile horiei beren lanpostua mantentzen
  laguntzea ere.\\n23. artikulua.\u2013 Erakunde onuradunak.\\n\\nEnplegu lagunduko
  jarduketak garatzeko dirulaguntzen onuradun izan daitezke irabazi-asmo\u00ad rik
  gabeko elkarteak, fundazioak zein bestelako erakundeak, eta Euskal Autonomia Erkidegoan
  finkatutako enplegu-zentro bereziak \u2013kalifikazio hori dutenak eta Enplegu Zentro
  Berezien Euskal Erregistroan inskribatuta daudenak\u2013, betiere baldintza hauek
  betetzen badituzte:\\n\\n\u2013 Haien helburu soziala izatea, besteak beste, desgaitasuna
  duten pertsonak laneratzea edota haientzako enplegua sortzea.\\n\\n2019ko azaroaren
  28a, osteguna\\n\\n\u2013 Beren plantillan lan-prospekziogile eta -prestatzaile
  espezializatuak izatea; enplegu lagun\u00ad duko unitatea osatzen dute horiek, hurrengo
  artikuluan xedatutako moduan.\\n\u2013 Esperientzia egiaztatua izatea administrazio
  publikoek eta/edo Europar Batasunaren Funtsek desgaitasuna izanik zailtasun bereziak
  dituzten pertsonak laneratzeko diruz lagundutako lane\u00ad ratze-programen garapenean.\\n\u2013
  Enplegu lagunduko jarduketak doan egitea, langileei eta enpresei tarifarik kobratu
  gabe edo haiengandik inolako zenbatekorik jaso gabe.\\n24. artikulua.\u2013 Enplegu
  lagunduko unitateen osaera eta eginkizunak.\\n1.\u2013 Deialdi honetan parte hartzeko,
  enplegu lagunduko oinarrizko unitateak lan-prospekziogile bat eta lan-prestatzaile
  bat izan behar ditu gutxienez.\\n\\nPertsona horiek, enplegu lagunduko unitateko
  kidetzat har daitezen, hala beren jarduera konputagarria izan dadin eta haren kostua
  diruz lagundu dadin, gutxieneko ordu kopuru batez aritu behar dute deialdi honetan
  jasotako jarduketak egiten, dirulaguntzak eman diren ekitaldiari dagokion aldian
  \u201322.1 artikuluan jaso da hori\u2013: zehazki, lan-hitzarmenean edo aplikatzekoa
  den enpresa-hitzarmenean ezarritako urteko lanaldi osoari dagokion ordu-kopuruaren
  % 50 gutxienez eman behar dute jarduketa horiek garatzen. Jarduketa horiek garatzen
  adierazi dena baino denbora gutxiagoz jardun duten edo dedikazio gutxiagoz aritu
  diren lan-prestatzaileak edo enplegu-pros\u00ad pekziogileak ez dira aintzat hartuko.\\n\\nBenetako
  dedikazioaren denboraren zenbaketa egitean, ez dira kenduko ez opor-egunak ez ordaindutako
  baimenak. Halaber, ez dira kenduko aldi baterako ezintasunagatiko baja-aldiak, lanaldi-murrizketei
  dagozkien orduak eta lanpostua gordetzeko eskubidea ematen duten esze\u00ad dentzia-aldiak,
  betiere ordu edo aldi horiek ez badute gainditzen aurreko apartatuan adierazitako
  gutxieneko ordu-kopuruaren % 15.\\n\\n2.\u2013 Enplegu lagunduko lantaldeak osatzen
  dituzten pertsonek aukera izango dute profil bakoi\u00ad tzaren eginkizunak modu
  partekatuan eta polibalentean garatzeko, betiere artikulu honetako 4. paragrafoan
  ezarritako esperientzia- eta titulazio-baldintzak betetzen badituzte.\\n\\nLantalde
  bat bi pertsonak baino gehiagok osatzen badute, lantaldeko profesionalen erdiek
  gutxienez bete beharko dituzte artikulu honetako 4. eta 5. paragrafoetan ezarritako
  titulazio- eta esperientzia-baldintzak, eta beste erdiek, berriz, titulazioaren
  betekizunaren ordez artikulu hone\u00ad tako 4. eta 5. paragrafoetan titulaziorik
  ez dutenen kasuetarako ezartzen den lan-esperientzia egiaztatu beharko dute.\\n\\n3.\u2013
  Nolanahi ere, beharrezkoa da enplegu lagunduko unitateen osaeran bi lanbide-profil
  horien arteko oreka egotea, laneratze-helburuak lortuko direla bermatzeko.\\n4.\u2013
  Prospekzio-zereginetan jardungo duten profesionalek gutxienez gradu-mailako unibertsi\u00ad
  tate-titulua izan beharko dute, eta gutxienez urtebeteko aurretiko esperientzia
  egiaztatu beharko dute desgaitasuna duten pertsonentzat enplegu-aukerak bilatzeko
  prospekzio-zereginetan eta/ edo desgaitasuna izanik zailtasun bereziak dituzten
  pertsonei laneratzen laguntzeko prozesuetan.\\n\\nGutxienez gradu-mailako unibertsitate-titulua
  izatearen betekizun hori ez zaie eskatuko gutxienez 5 urteko lan-esperientzia egiaztatzen
  dutenei desgaitasuna duten pertsonentzat enplegu-aukerak bilatzeko prospekzio-zereginetan
  eta/edo desgaitasuna izanik zailtasun bereziak dituzten pertso\u00ad nei laneratzen
  laguntzeko prozesuetan.\\n\\nKasu batean zein bestean, lan-esperientzia egiaztatzeko,
  proposatutako pertsonaren lan-kon\u00ad tratuak aurkeztu beharko dira, bai eta betetako
  eginkizunak egiaztatzen dituen enpresaren ziurtagiria ere.\\n\\nDesgaitasuna duen
  pertsona lanpostuan hasi aurretik, honako eginkizun hauek bete behar dituzte lan-prospekziogileek:\\n\\n\u2013
  Enpresa arruntean informazioa ematea eta sentsibilizazioa sustatzea.\\n\u2013 Jarduketen
  xede den taldeari egokitutako enplegu-aukerak bilatzea eta jasotzea, banakoa oinarri
  hartuta.\\n\u2013 Lanpostuak identifikatzea eta xehetasunez aztertzea, enpleguaren
  ezaugarriak eta garatze-bal\u00ad dintzak zehazteko, eta beharrezkoa eta esanguratsua
  den informazio guztia lortzeko.\\n\u2013 Lanpostuaren ezaugarriak eta eskakizunak
  kontuan hartuta, horien neurrizko egokitzeak egi\u00ad tea zenbateraino izango litzatekeen
  beharrezkoa aztertzea.\\n5.\u2013 Gutxienez goi-mailako lanbide-heziketari dagokion
  titulazioa edo baliokidea izango dute lan-prestatzaileek, eta gutxienez urtebeteko
  aurreko esperientzia egiaztatu beharko dute des\u00ad gaitasunen bat eta zailtasun
  bereziak dituzten pertsonak prestatzen eta laneratzen laguntzeko prozesuetan.\\n\\nGoi-mailako
  lanbide-heziketako gutxieneko titulazioa edo baliokidea ez zaie eskatuko hau egiaztatzen
  dutenei: gutxienez 5 urteko esperientzia desgaitasunen bat eta zailtasun bereziak
  dituzten pertsonak prestatzen eta laneratzen laguntzeko prozesuetan.\\n\\nKasu batean
  zein bestean, lan-esperientzia egiaztatzeko, proposatutako pertsonaren lan-kon\u00ad
  tratuak aurkeztu beharko dira, bai eta betetako eginkizunak egiaztatzen dituen enpresaren
  ziurtagiria ere.\\n\\nLan-prestatzaileek honako eginkizun hauek bete behar dituzte
  lanpostuan:\\n\\n\u2013 Banakako prestakuntza lanpostuan, langileak eskatzen diren
  lanbide-gaitasunak lortzeko eta bere lanpostuan nahiz lan-ingurunean ahalik ongien
  integratzeko.\\n\u2013 Enpresaren antolamenduan eta bereziki desgaitasuna duen langilearekin
  elkarrekintzan jarduten duten lankideen artean sentsibilizazioa sustatzea, eta horiei
  prestakuntza eta laguntza ematea.\\n\u2013 Epe luzerako laguntza pertsonalizatua
  eta banakako jarraipena: kontratatu den pertsona lane\u00ad ratu ondoren, beharrezkoa
  da haren eta enpresaren jarraipena egitea, laneratzea behar bezala garatzen dela
  bermatzeko, eta, lanpostuari dagokion jardunean edo lan-ingurunean aldaketarik gertatzen
  bada, horrekin batera sortutako prestakuntza- eta egokitze-premiei erantzuteko.\\n\u2013
  Ebaluazioa. Prozesu guztia nola garatu den baloratu behar da, bai enpresaren bai
  desgaita\u00ad suna duen pertsonaren aldetik, eta bi aldeen gogobetetze-maila ebaluatu
  behar da.\\n6.\u2013 Lan-prospekziogileek eta -prestatzaileek honako eginkizun hauek
  bete behar dituzte elkarrekin:\\n\u2013 Desgaitasuna duten pertsonen artean, lanpostu
  jakin bat betetzeko behar diren gaitasunak dituzten pertsonak identifikatzea.\\n\\n2019ko
  azaroaren 28a, osteguna\\n\\n\u2013 Bateragarritasunaren azterketa: alde batetik,
  lanpostuaren profila, eta, bestetik, desgaitasu\u00ad nen bat dutenen artean lanpostu
  hori betetzeko hautatutako pertsona.\\n\u2013 Lanpostuaren ezaugarriak eta eskakizunak
  kontuan hartuta, beharrezkotzat jo diren neurrizko egokitzeak bideratzea eta gauzatzea.\\n7.\u2013
  Enplegu-zentro berezien kasuan, enplegu lagunduko jarduketak egingo dituzten profe\u00ad
  sionalak ezin daitezke izan lanbide-jardueran laguntzeko unitateak osatzen dituzten
  profesional berberak, eta erantzukizunpeko adierazpen baten bidez egiaztatu beharko
  dute hori.\\n8.\u2013 Kausa justifikatuak direla-eta jarduketak garatu bitartean
  enplegu lagunduko unitateetan lanpostu hutsak geratzen badira, langile horiek ordezkatu
  egin beharko dira, betiere artikulu hone\u00ad tan xedatutako irizpideak eta baldintzak
  betez. Eta, betiere, ordezkatu den pertsona eta haren ordezkatzailea diruz lagundutako
  jarduketetan aritutako ordu-kopurua, edo bien dedikazio-den\u00ad bora, batuta,
  artikulu honen 1. apartatuan zehaztutakoa izango da gutxienez.\\n\\nEnplegu lagunduko
  unitatea osatzen duen lantalde profesionalean aldaketarik egin nahi iza\u00ad nez
  gero, Lanbide-Euskal Enplegu Zerbitzuari jakinarazi behar zaio, eta erakunde horrek
  onartu beharko ditu aldaketak. Lan-prestatzaileak eta/edo enplegu-prospekziogileak
  ordezkatu behar direnean, aldatzeko eskaeran adierazi beharko da zer pertsona ordezkatuko
  den, eta, lanpostu horretarako proposatzen den pertsonaren curriculumaz gain, haren
  titulazioaren egiaztagiria aur\u00ad keztu beharko da, bai eta lan-esperientziaren
  egiaztagiriak ere: hau da, lan-kontratuak eta betetako eginkizunak egiaztatzen dituen
  enpresaren ziurtagiria. Lan-prestatzaileak eta/edo enplegu-pros\u00ad pekziogileak
  ordezkatzeko proposatutako pertsonak ordezkatu dituzten pertsonen lanbide- eta soldata-kategoria
  berekoak izango dira.\\n\\n25. artikulua.\u2013 Dirulaguntzaren zenbatekoa.\\n1.\u2013
  Dirulaguntzaren xedea da erakunde onuradunen enplegu lagunduko unitatea osatzen
  duten profesionalen soldata-kostuak eta gizarte-segurantzakoak finantzatzea, bai
  eta enplegu lagunduko jarduketarekin loturiko gastu orokorrak eta administrazio-,
  koordinazio- eta lekualdatze-gastuak ere, dirulaguntza eman den ekitaldiari dagokion
  urtearen barruan sortutako gastuak izanik betiere.\\n\\nGastu horiek finantzaketa
  izan dezaten, ezinbestekoa da desgaitasuna duten pertsonentzako enplegu-aukerak
  bilatzeko prospekzioak egiteko eta pertsona horiek enpresa arruntetan lanera\u00ad
  tzeko konpromisoa erakustea, eta helburu horiek erdiestea.\\n\\nGastu orokortzat
  hartuko dira lokalen erabilerari, jakinarazpenei, material suntsigarriari eta bule\u00ad
  goko materialari dagozkien gastu arruntak.\\n\\nHalaber, diruz lagun daitekeen gastutzat
  hartuko da auditorearen txostenaren kostua, bal\u00ad din eta dagokion deialdian
  txosten hori eskatzen bada dirulaguntza justifikatzeko beharrezko dokumentazioan.\\n\\n2.\u2013
  Hauek izango dira dirulaguntzen zenbatekoak, zehaztutako irizpideen arabera:\\na)
  Euskal Autonomia Erkidegoan finkatutako lantokietan enplegu lagunduko jarduketen
  xede diren langileen kopurua, baldintza hauen arabera:\\n\u2013 7.800 euro laneratze
  bakoitzeko, desgaitasun intelektualagatik, buru-gaixotasunagatik edo garuneko paralisiagatik
  % 33ko edo gehiagoko desgaitasun-maila aitortuta duten pertsonak gutxienez urtebeteko
  iraupena duen kontratu batekin laneratzea lortzen bada.\\n\\n2019ko azaroaren 28a,
  osteguna\\n\\n\u2013 6.600 euro laneratze bakoitzeko, desgaitasun intelektualagatik,
  buru-gaixotasunagatik edo garuneko paralisiagatik % 33ko edo gehiagoko desgaitasun-maila
  aitortuta duten pertsonak gutxie\u00ad nez 6 hilabeteko iraupena duen kontratu batekin
  laneratzea lortzen bada.\\n\u2013 4.700 euro laneratze bakoitzeko, desgaitasun fisikoagatik
  edo sentsorialagatik % 65eko edo gehiagoko desgaitasun-maila aitortuta duten pertsonak
  edota gortasunagatik edo entzumen-des\u00ad gaitasunagatik % 33ko edo gehiagoko
  desgaitasun-maila aitortuta duten pertsonak gutxienez urtebeteko iraupena duen kontratu
  batekin laneratzea lortzen bada.\\n\u2013 4.000 euro laneratze bakoitzeko, desgaitasun
  fisikoagatik edo sentsorialagatik % 65eko edo gehiagoko desgaitasun-maila aitortuta
  duten pertsonak edota gortasunagatik edo entzumen-des\u00ad gaitasunagatik % 33ko
  edo gehiagoko desgaitasun-maila aitortuta duten pertsonak gutxienez 6 hilabeteko
  iraupena duen kontratu batekin laneratzea lortzen bada.\\n\u2013 Kontratatu eta
  laneratu den desgaitasuna duen pertsona emakumea bada, % 10 handituko dira aurreko
  paragrafoetan xedatutako dirulaguntzen zenbatekoak.\\n\\nZenbateko horiek lanaldi
  osoko kontratuetarako ezartzen dira; zenbateko horiek proportzionalki murriztuko
  dira lanaldiaren iraupenaren arabera, baldin eta kontratua denbora partzialekoa
  bada, 22.2 artikuluan ezarritako lanaldiaren % 35eko gutxieneko mugarekin.\\n\\nb)
  Enplegu-aukerak bilatzeko eta jasotzeko prospekzio-jarduketari, osorik hartuta,
  39.100 euroko dirulaguntza emango zaio gehienez; hain zuzen, prospekziogile bakoitzak
  egindako 170 bisita finantzatuko dira gehienez, eta 230 euro emango dira bisitatutako
  enpresa bakoitzeko. Bisita guz\u00ad tiak behar bezala justifikatu beharko dira,
  eta horiei dagokien dokumentazioa aurkeztu beharko da.\\nLanaldi partzialeko dedikazioa
  bada, gehienez finantzatuko den bisita-kopurua zehazteko, pros\u00ad pekzio-jardueretarako
  dedikazioari lanaldi osoaren zer ehuneko dagokion hartuko da kontuan, eta horren
  arabera ezarriko da zenbatekoa. Dena dela, lanaldi osoan urtean egin beharreko orduen
  % 50 izango da lanaldiaren gutxieneko dedikazioa.\\nc) Dirulaguntza eman den deialdiari
  dagokion ekitaldiaren aurretiko ekitaldietan enpresa arrun\u00ad tetan kontratatu
  ziren pertsonen jarraipena egiteko eta laguntza emateko lan-prestatzaileak gauzatutako
  jarduketek 850 euroko dirulaguntza izango dute jarraipena egiten zaion pertsona
  bakoitzeko, baina egindako jarraipenei emango zaien guztizko zenbatekoak ezin izango
  du gainditu ezein kasutan deialdiari dagokion ekitaldian jarraipena egiteko eta
  laguntza emateko jarduketak egin dituen lan-prestatzaileak bete duen lanaldiari
  edota jarduketa horietarako dedikazioari dago\u00ad kion soldata-kostuaren eta gizarte-segurantzakoaren
  % 25.\\nd) Gastu orokorrak eta administrazio-, koordinazio- eta lekualdatze-gastuak
  nahiz auditorea\u00ad ren txostenari dagozkionak diruz lagun daitezkeen gastuak
  izango dira, eta dirulaguntza horren zenbatekoa enplegu lagunduko unitatea osatzen
  duten langile guztien soldata-kostuen eta gizarte-segurantzakoen baturaren % 15
  izango da, betiere enplegu lagunduko unitate horiek diruz lagun daitezkeenak badira
  eta dirulaguntza ezarritako helburuen lorpena egiaztatuz justifikatzen bada.\\n3.\u2013
  Aurreko paragrafoko a), b) eta c) letretan adierazitako kontzeptuengatik emandako
  zenbate\u00ad koak ezin izango ditu gainditu ezein kasutan enplegu lagunduko jarduketetan
  parte hartzen duten profesionalen soldata-kostuak eta gizarte-segurantzakoak.\\n\\n2019ko
  azaroaren 28a, osteguna\\n\\n26. artikulua.\u2013 Deialdia.\\n\\nAtal honetan jasotako
  dirulaguntzen deialdia Lanbide-Euskal Enplegu Zerbitzuaren Adminis\u00ad trazio
  Kontseiluaren Erabaki baten bidez egingo da, eta hartan, alderdi hauek zehaztuko
  dira gutxienez: finantzaketarako baliatuko diren baliabide ekonomikoen zenbatekoa,
  eta eskabideak aurkezteko epea, dirulaguntza justifikatzeko epea eta horretarako
  beharrezko dokumentazioa.\\n\\nDeialdiaren berri jakinaraziko da EHAAn argitaratuz,
  Lanbide-Euskal Enplegu Zerbitzuko zuzen\u00ad dari nagusiaren ebazpen baten bidez.\\n\\n27.
  artikulua.\u2013 Eskabideak eta nahitaezko dokumentazioa aurkeztea.\\n\\nDirulaguntzaren
  eskabidea osorik bete behar da, eta harekin batera, dokumentazio hau aur\u00ad keztu
  behar da nahitaez:\\n\\na) Dirulaguntzaren hartzaile izan nahi duen erakundearen
  memoria deskribatzailea, gutxienez honako hauek zehaztuko dituena:\\n\u2013 Erakundearen
  kokaleku fisikoaren xehetasuna eta jarduteko lurralde-eremua.\\n\u2013 Erakundearen
  helburu soziala, jarduketa-esparruak eta organigrama.\\n\u2013 Enplegu lagunduko
  unitatea osatzen duten lan-prestatzaileen eta -prospekziogileen zerrenda, eta horien
  curriculuma, berariaz aipatuz zer-nolako prestakuntza duten unitate hori osatzen
  duten pertsonek gizonen eta emakumeen laneratzeko aukera-berdintasunaren esparruan,
  bere\u00ad ziki desgaitasuna duten pertsonen laneratzearekin lotuta; eta honako
  hauek egiaztatzen dituen dokumentazioa: eskatutako titulazioa; eta lan-esperientzia
  eta urteko lanaldia, berariaz zehaztuz lanaldiaren zer ehuneko dagokion enplegu
  lagunduko jarduketekin loturiko prospekzio-jarduke\u00ad tetan eta/edo lanerako
  prestakuntzan aritutako denborari edo horretarako dedikazioari. Hauek aurkeztuta
  egiaztatuko da esperientzia: proposatutako pertsona bakoitzari egindako lan-kontra\u00ad
  tuak, eta enpresaren ziurtagiri bat, zer eginkizun bete dituen egiaztatzen duena.\\n\u2013
  Esparru hauetako esperientzia egiaztatzeko memoria: desgaitasuna izanik zailtasun
  bere\u00ad ziak dituzten pertsonen laneratzea, enplegu lagunduko prozesuen bidez,
  eta desgaitasuna duten pertsonak enpresa arruntean laneratzeko eta pertsona horiei
  prestakuntzan eta lanpostuan ber\u00ad tan laguntzeko programak, administrazio publikoek
  eta/edo Europar Batasuneko Funtsek diruz lagunduak.\\nb) Urteko kudeaketa-plana,
  gutxienez honako hauek zehaztuta:\\n\u2013 Gauzatzeko jarduerak eta lortu nahi den
  laneratze-helburuak, barne direla desgaitasuna duten emakumeen eta gizonen laneratzean
  dagoen genero-arrakala gutxitzera bideratutako berariazko helburuak eta jarduerak.\\n\u2013
  Desgaitasunen bat izaki, laguntza jasoko duten pertsonen tipologia eta kopurua,
  honela banakatuta: emakumeak eta gizonak, laneratze berriak eta aurreko ekitaldietan
  kontratatutako pertsonen jarraipen-prozesuak.\\n\u2013 Gauzatzeko metodologia: zehaztuko
  da laneratze-prozesuetan desgaitasuna duten emaku\u00ad meen parte-hartzea bermatzera
  bideratutako zein neurri gauzatuko den, kalteberatasun-egoera handietan dauden emakumeena,
  batez ere.\\n\u2013 Ebaluazio-sistema. Garatu beharreko ebaluazio-prozesuei buruzko
  dokumentuak zehaztu eta aurkeztu behar dira, lan-prozeduren nahiz lorturiko emaitzen
  kalitatea neurtzeko: ebaluatutako aldagaiak edo dimentsioak, tresnak, parte-hartzaileak
  eta ebaluazio-faseak edo -motak.\\n\\n2019ko azaroaren 28a, osteguna\\n\\n\u2013
  Jarduketen tenporalizazioa.\\n\u2013 Eskura dauden azpiegiturak, baliabideak eta
  bitarteko instrumentalak.\\n\u2013 Zerbitzua emateko baldintzak.\\n\u2013 Eskatutako
  dirulaguntza, kontzeptuen arabera zehaztuta: enplegu lagunduko unitatea osatzen
  duten pertsonen soldata-kostuak eta gizarte-segurantzakoak, eta pertsonal-kostu
  horien % 15, gastu orokorrak eta administrazio-, koordinazio- eta lekualdatze-gastuak
  finantzatzeko.\\nc) Eskabidea sinatzen duenaren legezko ordezkaritzaren egiaztagiria.\\nd)
  Kontratatuko diren enplegu lagunduko unitateetako langileen soldata-kostuen egiaztagiriak,
  langile bakoitzaren urteko ordainsari gordinaren kostua eta gizarte-segurantzakoa
  bereizita, horien kontrataziorako eskatzen baita dirulaguntza.\\ne) Irabazi-asmorik
  gabeko elkarteen, fundazioen eta bestelako erakundeen kasuan, haien eraketa egiaztatzen
  duen dokumentazioa eta, hala egokituz gero, estatutuak, non haien helburu soziala
  eta kokalekua azaldu behar diren.\\nf) Enplegu-zentro bereziei dagokienez, erakunde
  eskatzailearen ordezkariaren erantzukizun\u00ad peko adierazpena, non adieraziko
  baita enplegu lagunduko jarduketak egingo dituzten langileak ez direla Lanbide Jardueran
  Laguntzeko Unitateak (LJLU) osatzen dituzten profesionalak.\\ng) Erakunde eskatzailearen
  ordezkariaren erantzukizunpeko adierazpena, adieraziz zenbat langilek osatzen duten
  erakundearen plantilla, eta zehaztuz ea erakundean baduten berdin\u00ad tasun-plana.
  Erakundeari dirulaguntza ematen bazaio, edozein unetan eskatu ahal izango zaio plan
  horren kopia.\\n28. artikulua.\u2013 Dirulaguntza emateko prozedura. Ebazpena.\\n1.\u2013
  Eskabideak aurkezteko epea amaitu ondoren, dekretu honetan ezarritako baldintzak
  bete\u00ad tzen dituztenei emango zaie dirulaguntza.\\n\\nPrograma hau finantzatzera
  bideratutako baliabide ekonomikoak nahikoa ez badira eskatutako laguntza guztiak
  emateko, onartutako eskabideen artean banatuko dira funtsak, proportzionalki, baliabide
  ekonomikoen muga kontuan hartu gabe bakoitzari legokiokeen laguntzaren arabera.\\n\\n2.\u2013
  Prozeduraren ebazpena eman eta jakinarazteko gehieneko epea sei hilabetekoa izango
  da, deialdi hau EHAAn argitaratzen den egunetik aurrera. Epe hori igarotakoan esanbidezko
  ebazpe\u00ad nik jakinarazi ez bada, eskaera ezetsi egin dela ulertuko da.\\n29.
  artikulua.\u2013 Dirulaguntza ordaintzea.\\n\\nAtal honetan aurreikusitako jarduketak
  gauzatzeko emango diren laguntzak bi zatitan ordain\u00ad duko dira:\\n\\na) Lehenengo
  ordainketan, dirulaguntzaren zenbatekoaren % 50 emango da, eta ordainketa laguntza
  onartutakoan egingo da.\\nb) Bigarren ordainketan, gainerako % 50a emango da, edota
  beste zenbateko bat, benetan egindako eta justifikatutako gastuak zein laneratze-helburuen
  eta prospekzio-jarduketen helbu\u00ad ruen betetze-maila kontuan hartuta egindako
  doikuntzatik eratorria.\\n\\nBigarren ordainketa jarduketak amaitu ondoren egingo
  da, betiere jarduketa horiek egin direla eta dirulaguntza deialdian xedatutako moduan
  eta epean erabili dela justifikatu ondoren.\\n\\n30. artikulua.\u2013 Dirulaguntzaren
  aldaketen eta ez-betetzeen kasu espezifikoak.\\n1.\u2013 Dirulaguntza justifikatzeko
  amaieran aurkeztutako dokumentazioa aztertuta ondorioztatzen bada ordaindutako dirulaguntzaren
  zenbatekoa handiagoa dela enplegu lagunduko jarduketak gauzatzetik sortu diren diruz
  lagun daitezkeen gastuei dagokien kostuaren zenbatekoa baino, diru\u00ad laguntzaren
  zenbatekoa aldatuko da eta kostu horri egokituko zaio, eta horretarako aldaketa-
  edo itzulketa-prozedura izapidetuko da.\\n2.\u2013 Horrez gain, desgaitasuna duten
  pertsonen kontratuak amaitzeko data baino lehenago azken\u00ad tzen badira, edota
  laguntzaren zenbatekoa emateko oinarria izan den gutxieneko iraupen-aldia baino
  lehenago azkentzen badira, horrek kontratazio horiengatik emandako dirulaguntzarako
  eskubidea galtzea ekarriko du, eta aurretiaz horretarako aldaketa- edo itzulketa-prozedura
  izapi\u00ad detuko da.\\n\\nDena den, kontratua enpresaren nahiarekin zerikusirik
  ez duten arrazoiengatik azkendu bada, eta arrazoi horiek behar bezala egiaztatu
  badira, dirulaguntza proportzionalki murriztuko da, bene\u00ad tako kontratazio-aldiaren
  arabera.\\n\\n31. artikulua.\u2013 Aldi berean beste dirulaguntza batzuk jasotzea.\\n\\nAtal
  honetan (2. atala) araututako dirulaguntzak diruz lagun daitezkeen kostu berberei
  dagoz\u00ad kien beste laguntza batzuei batu ahal izango zaizkie, betiere batura
  horrek ez badu gainditzen diruz lagun daitezkeen kostuen % 100.\\n\\n3. ATALA\\n\\nENPLEGU-ZENTRO
  BEREZIETAKO ENPLEGURAKO LAGUNTZAK\\n\\n32. artikulua.\u2013 Atal honen xedea.\\n\\nAtal
  honen xedea da desgaitasuna duten pertsonak enplegu-zentro berezietan laneratzeko
  laguntzak arautzea. Horretarako dirulaguntzak lau lerrotan sailkatu dira:\\n\\na)
  Lanpostuak mantentzeko laguntzak; 1. azpiatalean xedatuak.\\nb) Enplegu egonkorra
  sortzeko inbertsioetarako laguntzak; 2. azpiatalean ezarriak.\\nc) Enplegu-zentro
  berezien aurrekontu-oreka eta bideragarritasuna sustatzeko laguntzak; 3. azpiatalean
  xedatuak.\\nd) Lanbide-jardueran laguntzeko unitateentzako laguntzak; 4. azpiatalean
  arautuak.\\n33. artikulua.\u2013 Laguntzen onuradunak.\\n1.\u2013 Atal honetan (3.
  atala) ezarritako laguntzen onuradun izan daitezke Euskal Autonomia Erki\u00ad degoan
  finkatutako lantokietan diruz lagun daitezkeen jarduketak egingo dituzten enplegu-zentro
  bereziak, betiere kalifikazio hori dutenak eta Enplegu Zentro Berezien Euskal Erregistroan
  inskri\u00ad batuta daudenak.\\n2.\u2013 Bigarren azpiatalean ezarritako laguntzen
  \u2013enplegu egonkorra sortzeko inbertsioetarako laguntzak\u2013 eta hirugarren
  azpiatalean ezarritakoen \u2013enplegu-zentro berezien aurrekontu-oreka eta bideragarritasuna
  sustatzeko laguntzak\u2013 onuradun izan daitezke soilik gizarte-ekimeneko zen\u00ad
  tro gisa kalifikatuta daudenak eta hala inskribatuta daudenak Erregistroan.\\n\\n34.
  artikulua.\u2013 Onuradunen betebehar espezifikoak.\\n1.\u2013 Atal honetan (3.
  atala) ezarritako laguntzak jasoko dituzten enplegu-zentro bereziek, 71. artikuluan
  araututako betebehar orokorrak betetzeaz gain, enplegu-zentro bereziaren jardue\u00ad
  raren memoria bat aurkezteko betebeharra izango dute. Ekitaldi bakoitzaren lehen
  seihilekoan, aurreko urte naturaleko jarduerari buruzko memoria aurkeztu beharko
  dute.\\n\\nMemoria horretan, hauek jaso behar dira:\\n\\n\u2013 Enplegu-zentro bereziaren
  kokalekuari eta jarduerari buruzko datuak.\\n\u2013 Jarduketa-esparruak.\\n\u2013
  Plantillaren osaera.\\n\u2013 Langileei ematen zaizkien egokitze pertsonal eta sozialerako
  zerbitzuak.\\n\u2013 Desgaitasuna duten pertsonekin aurrera eraman diren lanbide-garapenerako
  banakako plan\u00ad gintzen helburuen betetze-mailaren balorazioa.\\n\u2013 Informazio
  zehatza, azaroaren 29ko 1/2013 Legegintzako Errege Dekretuaren\u2013Desgaitasuna
  duten pertsonen eskubideei eta haien gizarteratzeari buruzko Lege Orokorraren testu
  bategina onartzen du\u2013 42. artikuluan xedatutako neurri alternatiboetan enplegu-zentro
  bereziak izan duen parte-hartzeari buruz (hornitzaile, zerbitzu-emaile edo dohaintzen
  hartzaile gisa, edota lan-enklabe bat eginez).\\n\u2013 Datu ekonomikoak: aurrekontuaren
  likidazioa, egoeraren balantzea, eta ustiapen-kontua eta helburu ekonomikoen lorpena.\\n2.\u2013
  Lanbide-garapenerako banakako plangintzak\u2013desgaitasuna duen pertsonak ere parte
  har\u00ad tuko du haren lanketan\u2013, elementu hauek izan beharko ditu:\\n\u2013
  Enplegu-zentro bereziaren barnean nahiz hartatik kanpo laneratzeko eta lanbide-garapena
  bideratzeko ibilbideen lanketa, merkatuetan zeharreko mugikortasuna sustatzeko.\\n\u2013
  Modu aktiboan esku-hartzeko eta laguntzeko neurrien ezarpena, hala nola lan-orientabidea
  eta -tutoretza, lan- eta gizarte-ingurunean ohitzeko laguntza, eta prestakuntza.\\n\\n1.
  AZPIATALA\\n\\nDESGAITASUNA DUTEN PERTSONEN LANPOSTUAK MANTENTZEKO LAGUNTZAK\\n\\n35.
  artikulua.\u2013 Diruz lagun daitekeen jarduketa.\\n1.\u2013 Azpiatal honetan ezarritako
  dirulaguntzek helburu dute enplegu-zentro berezian kontratatu dituzten eta desgaitasuna
  duten pertsonen soldata-kostuak finantzatzea, kontratu bakoitzaren indarraldian
  zehar.\\n\\nDirulaguntza hilabete natural bakoitzeko eskatuko da, eta, hala badagokio,
  emango da.\\n\\nSoldata-kostutzat hartuko dira aparteko ordainsariak eta kontratuak
  amaitzeagatiko kalte-ordai\u00ad nak, kaleratze bidegabeen kasuetan izan ezik.\\n\\n2.\u2013
  Kontratazio berriek aurreko 12 hilabeteetan batez beste zegoen enplegatu-kopuruaren
  igoera ekarri behar dute, arrazoi hauengatik lanpostua edo lanpostuak hutsik geratu
  direnean izan\\n\\n2019ko azaroaren 28a, osteguna\\n\\nezik: langilearen dimisioa,
  haren desgaitasuna, adinagatiko erretiroa, borondatezko lanaldiaren murrizketa,
  eta diziplinazko lan-kaleratze bidezkoa, ez kaleratze soila.\\n\\n36. artikulua.\u2013
  Dirulaguntzaren zenbatekoa.\\n1.\u2013 Desgaitasuna duten pertsona kontratatuen
  soldata-kostuak estaltzeko dirulaguntza une bakoitzean indarrean dagoen lanbide
  arteko gutxieneko soldataren % 50 izango da, lanaldi oso\u00ad rako kontratatutako
  langile bakoitzeko, altan egon den eta benetan enpresan zerbitzuak ematen jardun
  duen aldirako, diruz lagundutako hilabetean zehar.\\n\\nLangilea lanaldi partzialeko
  kontratuarekin ari bada eta/edo errendimendu baxuko kontratua badu, dirulaguntza
  proportzionalki murriztuko da, egindako lanaldiaren arabera edo kontratuan jasota
  dagoen errendimendu baxuaren arabera.\\n\\nBestalde, langilea ez badago hilabete
  osoan altan edo ez badu lanean jardun aldi oso horretan, dirulaguntza benetan lan
  egindako egun-kopuruarekiko proportzionala izango da, eta dirulaguntza\u00ad ren
  zenbatekoa egun-kopuruaren arabera kalkulatzeko, 30 eguneko hilabetea hartuko da
  oinarri.\\n\\n2.\u2013 Halaber, aparteko ordainsariak eta kontratua amaitzeagatiko
  kalte-ordainak estaltzeko dirulaguntzaren zenbatekoa ere lanbide arteko gutxieneko
  soldataren % 50 izango da, betiere dagokien egun-kopurua kontuan hartuta.\\n37.
  artikulua.\u2013 Aurrekontu-zuzkidura.\\n\\nLanbide-Euskal Enplegu Zerbitzuko Administrazio
  Kontseiluaren Erabaki baten bidez, urtero ezarriko da azpiatal honetan araututako
  laguntzak finantzatzera bideratuko diren baliabide ekono\u00ad mikoen zenbatekoa.\\n\\nIndarrean
  dagoen legediaren araberako aurrekontu-aldaketarik onartzen bada, aurrekontu-eki\u00ad
  taldi batean emango diren laguntzen bolumen osoak ezin izango du gainditu ez aipatutako
  esleipena ez haren igoeraren ondoriozkoa.\\n\\nHasierako aurrekontu-zuzkiduraren
  eta egin litezkeen aldaketen jakinarazpenak argitaratu egingo dira, Lanbide-Euskal
  Enplegu Zerbitzuko zuzendari nagusiaren ebazpen baten bidez.\\n\\n38. artikulua.\u2013
  Eskabideak eta nahitaezko dokumentazioa aurkeztea.\\n1.\u2013 Dirulaguntzaren xede
  den hilabetearen hurrengo hilabetea izango da dirulaguntza-eskabi\u00ad deak aurkezteko
  epea.\\n2.\u2013 Dirulaguntzaren eskabidea osorik bete behar da, eta, harekin batera,
  dokumentazio hau aurkeztu behar da:\\na) Desgaitasuna duten pertsona kontratatuen
  nominen kopia.\\nb) Desgaitasuna duten pertsona kontratatuen nominen ordainketen
  banku-egiaztagiriak.\\nc) Desgaitasuna duten pertsona gehiago kontratatu badira
  dirulaguntza-eskabidearen xede den hilabetean, aurreko a) eta b) apartatuetan aipatzen
  den dokumentazioaz gain, honako agiri hauek ere aurkeztu beharko dira:\\nc.1.\u2013
  Kontratatutako pertsona berrien lan-kontratuen kopia.\\nc.2.\u2013 Kontratatutako
  pertsona berrien desgaitasun-mota eta -mailaren egiaztagiria, erakunde eskudunak
  egina.\\n\\n2019ko azaroaren 28a, osteguna\\n\\nc.3.\u2013 Alta emanda dauden langileen
  batez besteko plantillaren txostena, Gizarte Segurantza\u00ad ren Diruzaintza Nagusiak
  egina, zeinaren bidez egiaztatuko baita desgaitasuna duten pertsonen kontratazio
  berriek gehikuntza garbia ekarri dutela aurreko hamabi hilabeteetan batez beste
  enplegu-zentro berezian zegoen enplegatu-kopuruari dagokionez.\\nc.4.\u2013 Kontratazio
  berriek ez badakarte plantillaren gehikuntza garbirik, betetzen duten lanpostua
  arrazoi hauetakoren batengatik hutsik geratu izanaren justifikazioa aurkeztu beharko
  da: langilea\u00ad ren dimisioa, haren desgaitasuna, adinagatiko erretiroa, lanaldiaren
  borondatezko murrizketa edo diziplinazko lan-kaleratze bidezkoa, eta ez kaleratze
  soila.\\n39. artikulua.\u2013 Dirulaguntza emateko prozedura. Ebazpena.\\n1.\u2013
  Eskaerak aurkezten diren hurrenkeran aztertuko dira, eta hurrenkera horretan emango
  zaiz\u00ad kie laguntzak dekretu honetan xedatutako betekizunak eta baldintzak betetzen
  dituztenei, harik eta aurrekontu-zuzkidura amaitu arte.\\n2.\u2013 Aurrekontu-kreditua
  agortzen bada, horren berri jakinaraziko da EHAAn argitaratuz, Lan\u00ad bide-Euskal
  Enplegu Zerbitzuko zuzendari nagusiaren ebazpen baten bidez.\\n\\nEkitaldi batean
  kreditu-faltagatik laguntza-eskaera batzuei ezin izan bazaie erantzun, laguntza
  horiek hurrengo ekitaldian eman ahal izango dira, ekitaldi horretako aurrekontu-kredituen
  kargura, beste eskabide bat aurkeztu behar izan gabe.\\n\\n3.\u2013 Eskabideak ebazteko
  eta jakinarazteko epea gehienez ere sei hilabetekoa izango da, eska\u00ad bidea
  Lanbide-Euskal Enplegu Zerbitzuaren erregistroan sartzen den egunetik zenbatzen
  hasita.\\n\\nEpe hori igarotakoan ebazpenik jakinarazi ez bada, dirulaguntzaren
  eskaera baietsi egin dela ulertuko da.\\n\\n40. artikulua.\u2013 Dirulaguntza ordaintzea.\\nDirulaguntza
  ordainketa bakarrean ordainduko da, ematen den unean.\\n41. artikulua.\u2013 Laguntzen
  bateragarritasuna barne-merkatuarekin.\\n\\nAzpiatal honetan xedatutako dirulaguntzak
  2014ko ekainaren 17ko Batzordearen 651/2014 (EB) Erregelamenduaren mende daude\u2013erregelamendu
  horren bidez, laguntza-kategoria jakin batzuk barne-merkatuarekin bateragarriak
  direla ezartzen da, Europar Batasunaren Funtziona\u00ad menduari buruzko Tratatuaren
  107. eta 108. artikuluak aplikatuz\u2013, eta, bereziki, erregelamendu horren 33.
  artikuluaren mende.\\n\\n42. artikulua.\u2013 Aldi berean beste dirulaguntza batzuk
  jasotzea.\\n\\nAzpiatal honetan ezarritako dirulaguntzak beste laguntza batzuei
  batu ahal izango zaizkie, bar\u00ad nean hartuta diruz lagun daitezkeen kostu berberei
  dagozkien de minimis laguntzak, betiere batura horrek ez badu gainditzen kostu horien
  % 75.\\n\\nHalaber, azpiatal honetan ezarritako dirulaguntzak 2014ko ekainaren 17ko
  Batzordearen 651/2014 (EB) Erregelamenduaren arabera salbuetsita dauden beste laguntza
  batzuei batu ahal izango zaizkie, diruz lagun daitezkeen kostu berberei dagozkienak
  izanik, betiere batura horrek ez badu gainditzen kostu horien % 100.\\n\\n2. AZPIATALA\\n\\nDESGAITASUNA
  DUTEN PERTSONENTZAT LAN EGONKORRA SORTZEKO INBERTSIORAKO LAGUNTZAK\\n\\n43. artikulua.\u2013
  Diruz lagun daitekeen jarduketa.\\n1.\u2013 Atal honetan xedatutakoarekin bat, diruz
  lagundu ahal izango dira Kontabilitate Plan Oroko\u00ad rrak ezarritako definizioaren
  arabera kategoria hauetakoak diren aktibo ez korronteetako inbertsioak (ondoren
  zehaztutako baldintzak betez, betiere): 206 Aplikazio informatikoak, 211 Eraikuntzak,
  212 Instalazio teknikoak, 213 Makineria, 214 Tresneria, 215 Beste instalazio batzuk,
  216 Altzariak, 217 Informazio-prozesuetarako ekipoak, 218 Garraio-elementuak eta
  219 Bestelako ibilgetu materia\u00ad lak; betiere, inbertsioa egin den enplegu-zentro
  berezian lanpostu egonkorrak sortu badituzte, eta desgaitasuna duten pertsonak\u2013langabezia-egoeran
  daudenak eta enplegu-zerbitzu publikoetan enplegu-eskatzaile gisa inskribatuta daudenak\u2013
  kontratu mugagabearekin kontratatzea bada\u00ad karte, edota aldi baterako edo iraupen
  jakin bateko kontratuak, barnean hartuta prestakuntzakoak, mugagabe bihurtzea badakarte.\\n2.\u2013
  Kasu guztietan, aldi baterako kontratuak mugagabe bihurtzeko kontratazioak egiteak
  enplegu-zentro berezian desgaitasuna izanik lan-kontratu finkoa duten langileen
  kopurua igotzea ekarri behar du, eta, betiere, aurreko sei hilabeteetan batez beste
  plantillan zegoen guztizko lan\u00ad gile-kopurua mantendu beharko da.\\n3.\u2013
  Langile-kontratazio horiek dirulaguntzaren eskaera eragin duen inbertsioak sortutako
  kon\u00ad tratazioak direla uler dadin, erlazio hori justifikatu beharko da, eta,
  horrez gain, inbertsio hori egin aurreko bi hilabeteetatik egin osteko bi hilabeteetara
  arteko epean eginak izan behar dute kontratazioek.\\n4.\u2013 Diruz lagun daitekeen
  gastutzat hartuko da, inbertsioa gauzatzen duen aktibo ez-korrontea\u00ad ren kostuaz
  gain, kanpoko enpresa espezializatu batek emandako laguntza teknikoaren kostua,
  betiere lotuta badago zuzenean inbertsioarekin, eta ez badu gainditzen inbertsioaren
  zenbatekoa\u00ad ren % 10aren muga. Laguntza teknikoa modalitate hauetako batekoa
  izan daiteke:\\n\u2013 Bideragarritasun-, antolakuntza- merkaturatze- eta diagnosi-azterlanak,
  eta antzeko beste batzuk.\\n\u2013 Auditoretzak eta txosten ekonomikoak.\\n\u2013
  Enpresa-kudeaketako zenbait arlotako aholkularitza.\\n5.\u2013 Enplegu-zentro bereziak,
  dirulaguntza eskuratzeko, gutxieneko inbertsio-ahalegin bat egin behar du, eta diruz
  lagun daitekeen gastuaren % 30 gutxienez baliabide propioekin finantzatu behar du.\\n6.\u2013
  Diruz lagun daitekeen gastuaren zenbatekoak sektore publikoko kontratuak arautzen
  dituen araudian kontratu txikirako ezarritako zenbatekoak gainditzen baditu, gutxienez
  hornitzaile des\u00ad berdinen hiru eskaintza eskatu beharko ditu onuradunak, zerbitzu-emate
  edo ondasun-hornitze jakin baterako konpromisoa hartu aurretik, kasu hauetan izan
  ezik: diruz lagun daitezkeen gastuen ezaugarriak direla-eta, merkatuan zerbitzu
  hori ematen duten edo ondasun horrez hornitzen duten erakundeak nahikoa ez izatea,
  edota gastua dirulaguntza eman aurretik egin izana.\\n\\nJasotako eskaintzen arteko
  hautaketa efizientzia- eta ekonomia-irizpideen arabera egin beharko da, eta, aukeratu
  den proposamena ez bada onuragarriena ikuspegi ekonomikotik, berariaz justi\u00ad
  fikatu beharko da memoria batean.\\n\\n44. artikulua.\u2013 Dirulaguntzaren zenbatekoa.\\n1.\u2013
  Dirulaguntzaren zenbatekoa inbertsioak sortutako kontratazio mugagabe bakoitzeko
  ezarriko da, kontuan hartuta desgaitasuna duten langileen ehunekoa enplegu-zentro
  bereziko plantillan, eta hauek izango dira gehieneko zenbatekoak:\\n\u2013 12.000
  euro, desgaitasuna duten langileen ehunekoa enplegu-zentro bereziko plantillan %
  90etik gorakoa bada.\\n\u2013 9.000 euro, desgaitasuna duten langileen ehunekoa
  enplegu-zentro bereziko plantillan % 70etik % 90era artekoa bada.\\n2.\u2013 Aurreko
  apartatuan ezarritako zenbatekoak lanaldi osorako egindako kontratazioei dagozkie.
  Lan-kontratua lanaldi partzialekoa bada, zenbatekoak hitzartutako lanaldiaren arabera
  murriztuko dira, proportzionalki.\\n3.\u2013 Kontratatu eta laneratu den desgaitasuna
  duen pertsona emakumea bada, % 10 handituko dira aurreko paragrafoetan xedatutako
  dirulaguntzen zenbatekoak.\\n4.\u2013 Dirulaguntzaren zenbatekoak ezin izango du
  gainditu ezein kasutan diruz lagun daitekeen gastuaren guztizko zenbatekoaren %
  70.\\n45. artikulua.\u2013 Deialdia.\\n\\nAzpiatal honetan (2. azpiatala) jasotako
  dirulaguntzen deialdia Lanbide-Euskal Enplegu Zer\u00ad bitzuaren Administrazio
  Kontseiluaren Erabaki baten bidez egingo da, eta, hartan, alderdi hauek zehaztuko
  dira: finantzaketarako baliatuko diren baliabide ekonomikoen zenbatekoa, zer alditan
  izan dezaketen dirulaguntza baliabide horien kargura diruz lagunduko diren inbertsioek,
  eskabi\u00ad deak aurkezteko epea, eta dirulaguntza justifikatzeko modua eta epea.\\n\\nIndarrean
  dagoen legediaren araberako aurrekontu-aldaketarik onartzen bada, aurrekontu-eki\u00ad
  taldi batean emango diren laguntzen bolumen osoak ezin izango du gainditu deialdian
  ezarritako aurrekontu-kredituaren zenbatekoa, ez eta haren igoeraren ondoriozkoa
  ere.\\n\\nAurrekontu-zuzkiduraren deialdiaren eta egin litezkeen aldaketen jakinarazpenak
  argitaratu egingo dira, Lanbide-Euskal Enplegu Zerbitzuko zuzendari nagusiaren ebazpen
  baten bidez.\\n\\n46. artikulua.\u2013 Eskabideak eta nahitaezko dokumentazioa aurkeztea.\\n\\nLaguntzak
  jasotzeko eskabidea osorik bete behar da, eta, harekin batera, dokumentazio hau
  aurkeztu behar da nahitaez:\\n\\na) Proiektuaren memoria deskribatzailea, enplegu
  egonkorra sortzeari begira proiektuak duen interesa justifikatzen duena.\\nb) Inbertsio
  finkoko planaren xehakapena eta haren balorazioa (fakturak edo aurrekontuak erantsita).\\nc)
  Azken bi urteetako finantza-egoera eta aurreikuspenak.\\nd) Proiektuaren bideragarritasunaren
  ekonomia- eta finantza-azterketa, finantza-plan osoa xehetasunez azalduta eta finantzaketa-iturriak
  zehaztuta.\\n\\n2019ko azaroaren 28a, osteguna\\n\\ne) Helburu bererako beste laguntza
  batzuk jaso izanaren aitortza.\\nf) 43. artikuluaren 6. apartatuan aipatu den kasuan,
  eskatutako hiru eskaintzen justifikazioa, eta, ikuspegi ekonomikotik onuragarriena
  ez den proposamena hautatu bada, egindako aukeraren jus\u00ad tifikazioa. Eskaera
  egiteko unean oraindik ez badira hornitzaileak bilatu eta hautatu, dokumentazio
  hori amaieran aurkeztu beharreko dirulaguntzaren justifikazioarekin batera aurkeztu
  beharko da.\\n47. artikulua.\u2013 Dirulaguntza emateko prozedura. Ebazpena.\\n1.\u2013
  Eskaerak aurkezten diren hurrenkeran aztertuko dira, eta hurrenkera horretan emango
  zaizkie laguntzak deialdiko betekizunak eta baldintzak betetzen dituztenei, harik
  eta aurre\u00ad kontu-zuzkidura amaitu arte.\\n\\nAurrekontu-zuzkidura agortzen
  bada, horren berri jakinaraziko da EHAAn argitaratuz, Lan\u00ad bide-Euskal Enplegu
  Zerbitzuko zuzendari nagusiaren ebazpen baten bidez, eta ebazteke geratu diren eskaerei
  dirulaguntzak ukatuko zaizkie.\\n\\n2.\u2013 Eskabideak ebazteko eta ebazpenak jakinarazteko
  gehieneko epea sei hilabetekoa da, eskabidea Lanbide-Euskal Enplegu Zerbitzuaren
  erregistroan sartzen den egunetik aurrera. Epe hori igarotakoan ebazpena jakinarazi
  ez bada, dirulaguntzaren eskaera baietsi dela ulertuko da.\\n48. artikulua.\u2013
  Dirulaguntza ordaintzea.\\n1.\u2013 Dirulaguntza bi zatitan ordainduko da, honela:\\n\u2013
  % 20 dirulaguntza ematen den unean ordainduko da.\\n\u2013 Gainerakoa, egindako
  inbertsioa eta hari dagozkion gastuak justifikatu ondoren eta sortutako lan-kontratuak
  egiaztatu ondoren, deialdian eta dirulaguntza emateko ebazpenean ezarritako bal\u00ad
  dintzetan, aurkeztutako proiektuaren arabera.\\n2.\u2013 Dirulaguntza justifikatzeko
  amaieran aurkeztutako dokumentazioa aztertuta ondorioztatzen bada ordaindutako dirulaguntzaren
  zenbatekoa handiagoa dela diruz lagun daitezkeen justifika\u00ad tutako gastuei
  dagokien kostua baino, edota lan-kontratuak ez direla egin ezarritako baldintzetan,
  kopuruari eta lanaldiari dagokionez, dirulaguntzaren zenbatekoa aldatuko da, eta,
  horretarako, aldaketa- eta itzulketa-prozedura izapidetuko da.\\n49. artikulua.\u2013
  Enplegua mantentzeko betebeharra.\\n\\nAtal honetan ezarritako laguntzen onuradun
  diren enpresek betebeharra dute diruz lagundutako inbertsioa eginda sortu diren
  kontratazioen bidez lortutako enplegu finkoaren maila mantentzeko, hiru urtez gutxienez,
  eta, halaber, betebeharra dute sortzen diren lanpostu hutsetan langileak ordezkatzeko
  eta lanpostu horiek desgaitasuna duten langileekin betetzeko, baja eman denetik
  hilabeteko epean.\\n\\nLangilea ordezkatzen ez bada, eta lanpostu hutsa enpresa
  onuradunari egotz dakiokeen kausa batengatik sortu bada, enpresa onuradunak jasotako
  laguntza osorik itzultzeko betebeha\u00ad rra izango du.\\n\\nLanpostu hutsa enpresaren
  borondatearekin zerikusirik ez duen kausa batengatik sortu bada, enpresak dirulaguntzaren
  zenbatekoaren zati bat itzuli beharko du, langileak lana utzi duenetik hiru urte
  igaro bitarteko aldiari dagokion dirulaguntzaren zatia, hain zuzen.\\n\\n2019ko
  azaroaren 28a, osteguna\\n\\n50. artikulua.\u2013 Laguntzen bateragarritasuna barne-merkatuarekin.\\n\\nAzpiatal
  honetan xedatutako dirulaguntzak 2014ko ekainaren 17ko Batzordearen 651/2014 (EB)
  Erregelamenduaren mende daude\u2013erregelamendu horren bidez, laguntza-kategoria
  jakin batzuk barne-merkatuarekin bateragarriak direla ezartzen da, Europar Batasunaren
  Funtziona\u00ad menduari buruzko Tratatuaren 107. eta 108. artikuluak aplikatuz\u2013,
  eta, bereziki, erregelamendu horren 34. artikuluaren mende.\\n\\n51. artikulua.\u2013
  Aldi berean beste dirulaguntza batzuk jasotzea.\\n\\nAzpiatal honetan ezarritako
  dirulaguntzak beste laguntza batzuei batu ahal izango zaizkie, bar\u00ad nean hartuta
  diruz lagun daitezkeen kostu berberei dagozkien de minimis laguntzak, betiere batura
  horrek ez badu gainditzen diruz lagun daitezkeen kostuen % 70.\\n\\n3. AZPIATALA\\n\\nENPLEGU-ZENTRO
  BEREZIEN AURREKONTU-OREKA ETA BIDERAGARRITASUNA SUSTATZEKO LAGUNTZAK\\n\\n52. artikulua.\u2013
  Diruz lagun daitekeen jarduketa.\\n\\nAzpiatal honetan ezarritako dirulaguntzaren
  xedea da gizarte-ekimeneko enplegu-zentro bere\u00ad zien aurrekontu-desorekak konpontzen
  laguntzea, haien bideragarritasuna bultzatzeko, eta Euskal Autonomia Erkidegoan
  finkatuta dauden lantokietan kontratatuta dauden desgaitasuna duten per\u00ad tsonek
  beren lanpostuak manten ditzaten sustatzea.\\n\\nEnplegu-zentro berezi batek aurrekontu-desoreka
  duela ulertzen da galera-irabazien kontuaren ustiapeneko emaitza edota emaitzen
  kontuaren emaitza negatiboa izan denean, eskaera egin den dataren aurretiko bi ekitaldietan
  zehar.\\n\\nDirulaguntza eskuratu ahal izateko, emaitza ekonomiko txarrek ez dute
  izan behar enplegu-zen\u00ad tro bereziaren kudeaketa kaskarraren ondorio.\\n\\nDirulaguntza
  hori behin bakarrik eman dakioke enplegu-zentro bakoitzari.\\n\\n53. artikulua.\u2013
  Dirulaguntzaren zenbatekoa.\\n\\nLaguntzaren zenbatekoa aurreko ekitaldiko aurrekontu-saldo
  negatiboaren % 50en baliokidea izango da, eta gehienez ere 60.000 eurokoa izan daiteke.\\n\\n54.
  artikulua.\u2013 Deialdia.\\n\\nAzpiatal honetan jasotako dirulaguntzen deialdia
  Lanbide-Euskal Enplegu Zerbitzuaren Admi\u00ad nistrazio Kontseiluaren Erabaki baten
  bidez egingo da, eta hartan, alderdi hauek zehaztuko dira: finantzaketarako baliatuko
  diren baliabide ekonomikoen zenbatekoa, eta eskabideak aurkezteko epea, dirulaguntza
  justifikatzeko epea eta horretarako nahitaezko dokumentazioa.\\n\\nDeialdiaren berri
  jakinaraziko da EHAAn argitaratuz, Lanbide-Euskal Enplegu Zerbitzuko zuzen\u00ad
  dari nagusiaren ebazpen baten bidez.\\n\\n55. artikulua.\u2013 Eskabideak eta nahitaezko
  dokumentazioa aurkeztea.\\n\\nLaguntzak jasotzeko eskabidea osorik bete behar da,
  eta, harekin batera, dokumentazio hau aurkeztu behar da nahitaez:\\n\\na) Finantza-desorekaren
  azalpen-memoria, barnean hartuta aurreko bi urteetako urteko galera-irabazien kontua,
  edota, hala badagokio, emaitzen kontua, kanpoko kontu-auditore batek behar bezala
  auditatuta (kontu-auditoreak enplegu-zentro bereziaz kanpokoa izan behar du, eta,
  hala dagokionean, haren enpresa-talde berekoak diren gainerako enpresez kanpokoa).\\n\\nKontu-auditorearen
  txostenak azken bi urteetako aurrekontu-desorekari buruzko informa\u00ad zio zehatza
  jaso behar du, eta ondorioztatu behar du egoera horrek arriskuan jartzen duela enplegu-zentro
  bereziaren biziraupena, bai eta Euskal Autonomia Erkidegoan finkatutako lan\u00ad
  tokietan kontratatu dituzten eta desgaitasuna duten pertsonek beren lanpostuak mantentzeko
  aukera ere.\\n\\nb) Enplegu-zentro bereziaren ekonomia- eta finantza-bideragarritasunaren
  azterketa, enplegu-zentro bereziaz kanpoko teknikari eskudunek egina, eta, hala
  dagokionean, haren enpresa-talde bereko gainerako enpresez kanpoko teknikari eskudunek,
  hartan zehaztuta dago\u00ad kion ekitaldirako eta hurrengorako aurreikusitako balantzea
  eta galera-irabazien kontua.\\n\\nAzterketa horretan, eskatutako dirulaguntza zehazki
  zer helburutarako erabiliko den adierazi beharko da.\\n\\n56. artikulua.\u2013 Dirulaguntza
  emateko prozedura. Ebazpena.\\n1.\u2013 Eskaerak aurkezten diren hurrenkeran aztertuko
  dira, eta hurrenkera horretan emango zaizkie laguntzak deialdiko betekizunak eta
  baldintzak betetzen dituztenei, harik eta aurre\u00ad kontu-zuzkidura amaitu arte.\\n\\nAurrekontu-zuzkidura
  agortzen bada, horren berri jakinaraziko da EHAAn argitaratuz, Lan\u00ad bide-Euskal
  Enplegu Zerbitzuko zuzendari nagusiaren ebazpen baten bidez, eta ebazteke geratu
  diren eskaerei dirulaguntzak ukatuko zaizkie.\\n\\n2.\u2013 Eskabideak ebazteko
  eta ebazpenak jakinarazteko gehieneko epea sei hilabetekoa da, eskabidea Lanbide-Euskal
  Enplegu Zerbitzuaren erregistroan sartzen den egunetik aurrera. Epe hori igarotakoan
  ebazpena jakinarazi ez bada, dirulaguntzaren eskaera baietsi dela ulertuko da.\\n57.
  artikulua.\u2013 Dirulaguntza ordaintzea.\\nDirulaguntza ordainketa bakarrean ordainduko
  da, ematen den unean.\\n58. artikulua.\u2013 Laguntzen bateragarritasuna barne-merkatuarekin.\\n\\nAzpiatal
  honetan araututako laguntzak de minimis laguntzatzat hartuko dira. Laguntza horiek
  Batzordearen 2013ko abenduaren 18ko 1407/2013 (EB) Erregelamenduan\u2013 Europar
  Batasunaren Funtzionamenduari buruzko Tratatuaren 107. eta 108. artikuluak aplikatzeari
  buruzkoa\u2013 arautzen dira. Kalifikazio horren ondorioz, enpresa bakarrari de
  minimis laguntzetan emandako guztizko zenbatekoa ez da izango 200.000 eurotik gorakoa
  hiru ekitaldi fiskalen barruan.\\n\\nMuga hori aplikatzeko, kontuan hartu beharko
  da nola definitzen den \u00abenpresa bakarra\u00bb Erre\u00ad gelamendu horren 2.2
  artikuluan.\\n\\nDagokion ekitaldi fiskalean eta aurreko bietan jasotako de minimis
  laguntza horiei buruzko aitor\u00ad pena egin beharko du erakunde eskatzaileak,
  egiaztatzeko de minimis laguntza berriak ez duela gainditzen aipatutako Erregelamenduan
  ezarritako gehieneko muga.\\n\\n59. artikulua.\u2013 Aldi berean beste dirulaguntza
  batzuk jasotzea.\\n\\nAzpiatal honetan araututako dirulaguntzak helburu bera duten
  beste laguntza batzuei batu ahal izango zaizkie, betiere batura horrek ez badu gainditzen
  aurreko ekitaldiko aurrekontu-saldo nega\u00ad tiboaren % 100.\\n\\n4. AZPIATALA\\n\\nLANBIDE-JARDUERAN
  LAGUNTZEKO UNITATEENTZAKO LAGUNTZAK\\n\\n60. artikulua.\u2013 Diruz lagun daitekeen
  jarduketa.\\n1.\u2013 Azpiatal honetan ezarritako laguntzen xedea da enplegu-zentro
  berezietan aldi bate\u00ad rako kontratuarekin zein kontratu mugagabearekin hurrengo
  apartatuan deskribatutako funtzioak\u2013desgaitasuna izanik laneratzeko zailtasun
  bereziak dituzten pertsonekin loturikoak\u2013 betetzeko kontratatutako lanbide-jardueran
  laguntzeko unitateetako langileen soldata-kostuak eta gizarte-segurantzakoak (dagokion
  ekitaldiko urtarrilaren 1etik abenduaren 31ra bitarteko aldikoak) finantzatzea,
  urtero, betiere unitate horiek artikulu honen 3. apartatuan deskribatutako osaera
  badute.\\n\\nLanbide-jardueran laguntzeko unitateak direla ulertzen da enplegu-zentro
  berezietako egoki\u00ad tze pertsonal eta sozialerako zerbitzuen barneko talde multiprofesionalak,
  hurrengo apartatuan zehaztutako funtzioak eta eginkizunak garatuz laguntza ematen
  dutenak zentro horietako des\u00ad gaitasuna duten langileek lanpostu bat lortzeko
  dituzten hesiak, oztopoak edo zailtasunak gaindi ditzaten, lanpostua manten dezaten,
  eta lanpostuan gora egin dezaten.\\n\\nAldi baterako kontratatutako langileek dirulaguntzari
  dagokion urte osoan egon behar dute kon\u00ad tratatuta gutxienez.\\n\\n2.\u2013
  Lanbide-jardueran laguntzeko unitateetako langileek funtzio hauek bete beharko dituzte:\\na)
  Desgaitasuna duen langile bakoitzaren gaitasunak eta lanpostuaren ezaugarriak aztertu
  ondoren, pertsona horrek bere lanbide-jarduera garatzeko zer-nolako laguntza behar
  duen haute\u00ad matea eta zehaztea.\\nb) Desgaitasuna duten langileen familia-
  eta gizarte-ingurunearekin harremanak ezartzea, ingurune hori ere lagungarri eta
  pizgarri izan dadin langile horiek laneratzeari eta lanpostuan egon\u00ad kortasuna
  lortzeari begira.\\nc) Behar adina prestakuntza-programa garatzea, desgaitasuna
  duen langilea bere lanpostura egokitu dadin ahalbidetzeko, bai eta teknologia berrietan
  nahiz ekoizpen-prozesuetan treba\u00ad tzeko ere.\\nd) Banakako laguntzak ezartzea
  lanpostuan bertan, langile bakoitzarentzat.\\ne) Desgaitasuna duten langileen autonomia
  eta independentzia erraztea eta sustatzea; batez ere, betetzen duten lanpostuan.\\nf)
  Enplegu-zentro berezian langile berrien integrazioa sustatzea, horretarako laguntza
  egokiak ezarriz.\\ng) Enplegu-zentro bereziko langileari lan-enklabeetan zein lan-merkatu
  arruntean laneratzeko prozesuan laguntzea.\\n\\nh) Desgaitasuna duten langileek
  zer-nolako bilakaera duten aztertzea, haien egoerak okerrera egin duen hautemateko
  eta beharrezkoa bada esku hartzeko, horren ondorioak eragozte edo arintze aldera.\\n3.\u2013
  Gizarteratzen eta laneratzen laguntzeko langileek gutxienez erdi-mailako edo goi-mai\u00ad
  lako lanbide-heziketako teknikariaren titulua izan beharko dute, edo gutxienez bost
  urteko lanbide-esperientzia egiaztatu beharko dute desgaitasuna izanik zailtasun
  bereziak dituzten per\u00ad tsonen prestakuntza-jardueretan eta/edo horiei laneratzen
  laguntzeko prozesuetan.\\n\\nAzpiatal honetan ezarritako laguntzak jasotzeko, enplegu-zentro
  berezietako lanbide-jardueran laguntzeko unitateek osaera hau izan beharko dute
  gutxienez (kontuan hartuta zenbat pertsona diren desgaitasuna izanik laneratzeko
  zailtasun bereziak dituztenak, zentro horietako langileen artean):\\n\\n|  |  |
  Desgaitasuna izanik laneratzeko | Gizarteratzen eta laneratzen laguntzeko langileak
  |  |  |  |  |  |  |\\n|---|---|---|---|---|---|---|---|---|---|\\n|  | zailtasun
  bereziak dituzten |  |  |  |  |  |  |  |  |\\n|  | langileen kopurua |  |  |  |  |  |  |  |  |\\n|  |  |  |  |
  Kop. |  | Lanaldia |  | Kop. | Lanaldia |\\n| 15 arte |  |  | 1 |  | % 20 |  | 1
  |  |  |\\n| 16-30 |  |  | 1 |  | % 80 |  | 2 |  |  |\\n| 31-45 |  |  | 1 |  | 100
  |  | 3 |  |  |\\n|  |  |  | 1 |  | 50 |  |  |  |  |\\n| 46-60 |  |  | 2 |  | % 100
  |  | 4 |  |  |\\n| 61-75 |  |  | 2 |  | % 100 |  | 5 |  |  |\\n|  |  |  | 1 |  |
  % 50 |  |  |  |  |\\n| 76tik aurrera |  |  |  |  |  |  |  |  |  |\\n\\nDesgaitasuna
  izanik zailtasun bereziak dituzten langileen kopurua ez badator bat modulu bakoi\u00ad
  tzari dagokion mugarekin, lanbide-jardueran laguntzeko unitateetako langileen lanaldia
  langile horien kopuruarekiko proportzionala izango da.\\n\\n4.\u2013 Unitate horiek
  osatzen dituzten langileen artean lanposturen bat hutsik geratzen bada, lan\u00ad
  postu huts horiek bete egin beharko dira, ezarritako proportzionaltasunari eusteko.\\n61.
  artikulua.\u2013 Dirulaguntzaren zenbatekoa.\\n1.\u2013 Dirulaguntzaren zenbatekoa
  kopuru finko bat da urteko, enplegu-zentro berezian kontrata\u00ad tutako pertsona
  bakoitzeko\u2013desgaitasuna izanik laneratzeko zailtasun bereziak dituen pertsona\u2013,
  kontuan hartuta kontratu-mota (kontratuaren iraupenaren arabera) eta lanaldia:\\n\u2013
  Lanaldi osoko kontratu mugagabea: 1.300 euro.\\n\u2013 Gutxienez sei hilabeteko
  aldi baterako kontratua, lanaldi osokoa: 650 euro.\\n2.\u2013 Lanbide-jardueran
  laguntzeko unitateko langileen edo laguntzaren xede diren langileen kon\u00ad tratua
  lanaldi partzialekoa bada, aurreko apartatuan ezarritako dirulaguntza lanaldiaren
  arabera murriztuko da, proportzionalki.\\n3.\u2013 Dirulaguntzaren zenbatekoak ezin
  izango du gainditu ezein kasutan lanbide-jardueran laguntzeko unitateetako langileek
  diruz lagundu den aldian sortu dituzten soldata-kostuen eta\\n\\ngizarte-segurantzakoen
  zenbatekoa, langile horiek aldi baterako kontratuarekin kontratatu badira zein kontratu
  mugagabearekin kontratatu badira.\\n\\n62. artikulua.\u2013 Deialdia.\\n\\nAzpiatal
  honetan jasotako dirulaguntzen deialdia Lanbide-Euskal Enplegu Zerbitzuaren Admi\u00ad
  nistrazio Kontseiluaren Erabaki baten bidez egingo da, eta hartan, alderdi hauek
  zehaztuko dira gutxienez: eskabideak aurkezteko epea, finantzaketarako baliatuko
  diren baliabide ekonomikoen zenbatekoa, eta dirulaguntza justifikatzeko epea eta
  horretarako beharrezko dokumentazioa.\\n\\n63. artikulua.\u2013 Eskabideak eta nahitaezko
  dokumentazioa aurkeztea.\\n\\nLaguntzak jasotzeko eskabidea osorik bete behar da,
  eta, harekin batera, dokumentazio hau aurkeztu behar da nahitaez:\\n\\na) Lanbide-jardueran
  laguntzeko unitatearen (LJLU) memoria deskribatzailea, gutxienez honako hauek zehaztuz:\\n\u2013
  Kokaleku fisikoaren xehetasunak.\\n\u2013 Jarduketa-esparrua.\\n\u2013 Unitatearen
  osaera, gizarteratzean eta laneratzean laguntzeko langileak eta ekoizpenean laguntzeko
  langileak bereiziz.\\n\u2013 Organigrama funtzionala.\\nb) Urteko kudeaketa-plana,
  gutxienez honako hauek zehaztuta:\\n\u2013 Lortu beharreko helburuak.\\n\u2013 Jarduketen
  tenporalizazioa.\\n\u2013 LJLUa osatzen duten langileen eginkizunen deskribapena.\\n\u2013
  Eskura dauden azpiegiturak, baliabideak eta bitarteko instrumentalak.\\n\u2013 Zerbitzua
  emateko baldintzak.\\nc) Eskabidea sinatzen duenaren ordezkaritzaren egiaztagiria.\\n64.
  artikulua.\u2013 Dirulaguntza emateko prozedura. Ebazpena.\\n1.\u2013 Eskabideak
  aurkezteko epea amaitu ondoren, dekretu honetan ezarritako baldintzak bete\u00ad
  tzen dituztenei emango zaie dirulaguntza.\\n\\nPrograma hau finantzatzera bideratutako
  baliabide ekonomikoak nahikoa ez badira eskatutako laguntza guztiak emateko, onartutako
  eskabideen artean banatuko dira funtsak, proportzionalki, baliabide ekonomikoen
  muga kontuan hartu gabe bakoitzari legokiokeen laguntzaren arabera.\\n\\n2.\u2013
  Prozeduraren ebazpena eman eta jakinarazteko gehieneko epea sei hilabetekoa izango
  da, deialdi hau EHAAn argitaratzen den egunetik aurrera. Epe hori igarotakoan esanbidezko
  ebazpe\u00ad nik jakinarazi ez bada, eskaera ezetsi egin dela ulertuko da.\\n\\n65.
  artikulua.\u2013 Dirulaguntza ordaintzea.\\n\\nDirulaguntza ordainketa bakarrean
  ordainduko da, ematen den unean.\\n\\nOrdainketak 180.303,63 euroko zenbatekoa edo
  une bakoitzean araudiak ezarritako zenba\u00ad tekoa gainditzen badu, aurrez banku-abal
  bat aurkeztu beharko dute, Lanbide-Euskal Enplegu Zerbitzuak ezarritako ereduari
  jarraituz eta hark emandako jarraibideak betez.\\n\\n66. artikulua.\u2013 Laguntzen
  bateragarritasuna barne-merkatuarekin.\\n\\nAzpiatal honetan xedatutako dirulaguntzak
  2014ko ekainaren 17ko Batzordearen 651/2014 (EB) Erregelamenduaren mende daude\u2013erregelamendu
  horren bidez, laguntza-kategoria jakin batzuk barne-merkatuarekin bateragarriak
  direla ezartzen da, Europar Batasunaren Funtziona\u00ad menduari buruzko Tratatuaren
  107. eta 108. artikuluak aplikatuz\u2013, eta, bereziki, erregelamendu horren 34.
  artikuluaren mende.\\n\\n67. artikulua.\u2013 Aldi berean beste dirulaguntza batzuk
  jasotzea.\\n\\nAzpiatal honetan ezarritako dirulaguntzak beste laguntza batzuei
  batu ahal izango zaizkie, bar\u00ad nean hartuta diruz lagun daitezkeen kostu berberei
  dagozkien de minimis laguntzak, betiere batura horrek ez badu gainditzen diruz lagun
  daitezkeen kostuen % 100.\\n\\n4. ATALA\\n\\nXEDAPEN KOMUNAK\\n\\n68. artikulua.\u2013
  Laguntzen erakunde onuradun izateko betekizun orokorrak.\\n\\nLaguntzen erakunde
  onuradun izateko, laguntza-programa bakoitzean ezarritako betekizun espezifikoak
  betetzeaz gain, beste betekizun hauek ere bete behar dira:\\n\\na) Zerga-betebeharrak
  eta Gizarte Segurantzakoak egunean izatea.\\n\\nOrgano kudeatzaileak automatikoki
  egiaztatuko du zerga-betebeharrak eta Gizarte Segu\u00ad rantzarekikoak bete direla,
  dirulaguntza eman aurretik eta ordainketa bakoitza egin baino lehen. Horretarako,
  ez du eskatzaileen baimenik beharko, hala xedatzen baitu azaroaren 11ko 1/1997 Legegintzako
  Dekretuaren bidez onartutako Euskadiko Ogasun Nagusiaren Antolarauei buruzko Legearen
  testu bateginaren 50.3 artikuluak, bai eta Dirulaguntzei buruzko azaroaren 17ko
  38/2003 Lege Orokorra garatzeko Erregelamenduaren 22.4 artikuluak ere (uztailaren
  21eko 887/2006 Errege Dekretuaren bidez onartu zen erregelamendu hori).\\n\\nHala
  ere, eskatzaileak berariaz aurka egin diezaioke egiaztatze horri, eta, halakorik
  egiten bal\u00ad din badu, baldintza hori betetzen duela egiaztatzen duten ziurtagiri
  eguneratuak aurkeztu beharko ditu.\\n\\nb) Dirulaguntzak itzultzeko betebeharrak
  ezarritako ordainketak eginda izatea.\\nc) Dirulaguntza edo laguntza publikoak lortzeko
  aukera galtzea dakarren zigor- edo adminis\u00ad trazio-arloko zehapenik jaso ez
  izana, eta horretarako ezgaitzen duen legezko debekurik jaso ez izana, barnean hartuta
  sexu-diskriminazioarekin loturikoak, Emakumeen eta Gizonen Berdintasu\u00ad nerako
  otsailaren 18ko 4/2005 Legean eta Emakumeen eta Gizonen Berdintasun Eragingarrirako
  martxoaren 30eko 3/2007 Lege Organikoan xedatutakoarekin bat.\\n\\nd) Europako Batzordeak
  aurretiaz hartutako erabaki baten bidez laguntza bat legearen aurka\u00ad koa eta
  merkatu erkidearekin bateraezina dela adierazi ostean ez egotea berreskuratze-agindu
  baten zain.\\ne) Enpresak ez izatea krisian dagoen enpresaren izaera, aipatutako
  651/2014 (EB) Erregela\u00ad menduaren 2.18 artikuluan jasotako definizioaren arabera.\\nf)
  Ez egotea Dirulaguntzei buruzko azaroaren 17ko 38/2003 Lege Orokorraren 13. artikuluko
  2. eta 3. apartatuetan aurreikusitako egoeren eraginpean, dirulaguntzen onuradun
  izaera lortzeari begira.\\n69. artikulua.\u2013 Eskabideak aurkeztea.\\n1.\u2013
  Dekretu honetan aurreikusitako laguntzetarako eskabideak baliabide elektronikoak
  erabiliz izapidetuko dira.\\n2.\u2013 Dirulaguntzak izapidetzean bitarteko elektronikoak
  erabiltzeko jarraibideak, prozedura, eskabide-ereduak eta dokumentazio osagarria
  hemen eskuratu ahal izango dira: Lanbide-Eus\u00ad kal Enplegu Zerbitzuaren webgunean
  (https://www.lanbide.euskadi.eus) eta Eusko Jaurlaritzaren egoitza elektronikoan
  (https://www.euskadi.eus).\\n3.\u2013 Eskabideak ez badaude behar bezala beteta
  edo horrekin batera ez bada nahitaezko doku\u00ad mentazio guztia aurkeztu, pertsona
  edo erakunde eskatzaileari hamar egun balioduneko epea emango zaio akatsa zuzen
  dezan edo nahitaezko dokumentuak aurkez ditzan. Gainera, jakina\u00ad raziko zaio
  hori egiten ez badu bere eskaerari uko egin diola ulertuko dela, eta Administrazioak
  eskaera horri buruzko esanbidezko ebazpena eman beharko du, bai eta jakinarazi ere.\\n70.
  artikulua.\u2013 Kudeaketa, ebazpena, errekurtsoak eta publikotasuna.\\n1.\u2013
  Dekretu honetan araututako laguntzak kudeatzeko eskumena duen organoa Lanbide-Eus\u00ad
  kal Enplegu Zerbitzuaren Laneratzea Aktibatzeko Zuzendaritza izango da, eta erakunde
  autonomo horretako zuzendari nagusiak izango du ebazteko eskumena.\\n2.\u2013 II.
  kapituluko 2. atalean\u2013Enplegu lagunduko jarduketetarako laguntzak\u2013 eta
  3. ataleko 4. azpiatalean\u2013Lanbide-jardueran laguntzeko unitateentzako laguntzak\u2013
  araututa dauden laguntzei dagokienez, Lanbide-Euskal Enplegu Zerbitzuaren zuzendari
  nagusiaren ebazpena jakinarazteko, Eusko Jaurlaritzaren egoitza elektronikoko iragarki-taula
  elektronikoan argitaratuko da: https:// www.euskadi.eus/iragarki-taula-elektronikoa/\\n\\nGainerako
  laguntza-programei dagozkien ebazpenak banaka jakinaraziko dira, prozedurak iza\u00ad
  pidetzeko erabiltzen diren bitarteko elektronikoen bidez.\\n\\n3.\u2013 Lanbide-Euskal
  Enplegu Zerbitzuaren zuzendari nagusiaren ebazpenak administrazio-bidea amaitzen
  du, eta, haren aurka, aukerako berraztertzeko errekurtsoa aurkez dakioke organo
  berari, hilabeteko epean, jakinarazpenaren biharamunetik aurrera, edo bestela, zuzenean
  administra\u00ad zioarekiko auzi-errekurtsoa jar daiteke Vitoria-Gasteizko Administrazioarekiko
  Auzien Epaitegian, bi hilabeteko epean, ebazpena jakinarazi eta biharamunetik aurrera.\\n4.\u2013
  Erakunde onuradunek jaso badituzte ezaugarri bereko beste laguntza edo dirulaguntza
  batzuk Euskal Autonomia Erkidegoko Administrazio Orokorraren edo haren erakunde
  autonomoen eskutik, eta laguntza horien inguruko itzulketa- edo zehapen-prozesuren
  bat izapidetzen ari bada, prozesu horrek amaituta egon behar du erakunde horiei
  dirulaguntza esleitzeko edo esleituta dute\u00ad nei dagokiena ordaintzeko.\\n\\n5.\u2013
  Publikotasun-printzipioa betetzeko, Lanbide-Euskal Enplegu Zerbitzuaren zuzendari
  nagu\u00ad siaren ebazpen baten bidez, xedapen honen babesean emandako dirulaguntzen
  onuradun diren pertsonen eta erakundeen zerrenda Euskal Herriko Agintaritzaren Aldizkarian
  argitaratuko da, bai eta jaso dituzten zenbatekoak ere, eta, erakunde bati emandako
  dirulaguntza aldatzea erabaki bada, hori ere adieraziko da.\\n6.\u2013 Administrazioak
  laguntzak ordaindu ahal izan ditzan, pertsona edo erakunde onuradunak Eusko Jaurlaritzako
  Ogasun eta Ekonomia Saileko Kontrol Ekonomikoko Bulegoaren datu-basean agertu beharko
  du.\\n\\nPertsona ez badago erregistratuta, edo Ogasun eta Ekonomia Sailaren Hirugarrenen
  Erregis\u00ad troko banku-datuak aldatu nahi baditu, inprimakia bete beharko du
  hemen adierazitako ereduari jarraituz: http://www.euskadi.eus/eusko-jaurlaritza/-/hirugarrenaren-datuen-aldaketa/.\\n\\n71.
  artikulua.\u2013 Laguntzen onuradun diren erakundeen betebehar orokorrak.\\n\\nDekretu
  honetan araututako dirulaguntzen onuradun diren erakundeek Dirulaguntzei buruzko
  azaroaren 17ko 38/2003 Lege Orokorraren 14. eta 46. artikuluetan oro har ezarritako
  betebeha\u00ad rrak bete behar dituzte, bai eta Euskadiko Ogasun Nagusiaren Antolarauei
  buruzko Legearen testu bateginak (azaroaren 11ko 1/1997 Legegintzako Dekretuaren
  bidez onartua) 50.2 artikuluan jasotakoak ere, eta, bereziki, honako hauek:\\n\\na)
  Lanbide-Euskal Enplegu Zerbitzuaren aurrean behar bezala justifikatzea betekizunak
  eta baldintzak bete dituztela, bai eta laguntza ematea edo laguntzaren onura jasotzea
  ekarri duen jarduketa egin dutela ere.\\nb) Lanbide-Euskal Enplegu Zerbitzuak, ogasun
  publikoko gaietan eskumena duen sailaren Kon\u00ad trol Ekonomikoko Bulegoak, enplegu-gaietan
  eskumena duen sailak eta Herri Kontuen Euskal Epaitegiak bideratutako egiaztapen-
  eta kontrol-jarduketen mende jartzea, bai eta, hala badago\u00ad kio, Europako Batzordearen
  eta Europako Kontuen Auzitegiaren jarduketen mende ere, Europako Gizarte Funtsak
  lagundutako finantzaketa izan den kasuetan.\\nc) Dirulaguntza emateko kontuan hartutako
  egoeraren bat, objektiboa edo subjektiboa, aldatu bada, Lanbide-Euskal Enplegu Zerbitzuari
  jakinaraztea.\\nd) Helburu bererako beste edozein administrazio edo erakunde publiko
  nahiz pribatutatik dirulaguntzak edo laguntzak, baliabideak edota diru-sarrerak
  lortu badira, horren berri ematea Lanbide-Euskal Enplegu Zerbitzuari.\\ne) Euskal
  Autonomia Erkidegoko Administrazio Orokorrak eta haren erakunde autono\u00ad moek
  emandako izaera bereko laguntzen edo dirulaguntzen esparruan hasitako itzulketa-
  edo zehapen-prozeduraren bat izapidetzen ari bada, horren berri ematea.\\nf) Lanbide-Euskal
  Enplegu Zerbitzuak diruz lagundutako jarduketen kudeaketa eta jarraipena egiteko
  erakunde onuradunen esku jarritako sistema eta erregistroetan eskatutako informazioa
  betetzea, telematikoki.\\ng) Berariaz jasotzea Lanbide-Euskal Enplegu Zerbitzuaren
  eta, hala dagokionean, Europako Gizarte Funtsaren baterako finantzaketaren bitartez
  finantzatu direla dekretu honetan arau\u00ad tutako programen babesean diruz lagundu
  diren materialak eta komunikazio-, zabaltze- edo argitaratze-ekintzak.\\n\\n72.
  artikulua.\u2013 Dirulaguntza aldatzea.\\n\\nDirulaguntza emateko kontuan hartu
  diren baldintzak aldatzen badira, edota beste administrazio edo erakunde publiko
  zein pribatu batzuetatik helburu bererako aldi berean emandako edonolako diru-sarrerak
  edo baliabideak eskuratu badira, aldatu egin daiteke dirulaguntza ematearen ebaz\u00ad
  pena, betiere laguntzaren onuradun izateko gutxieneko baldintzak betetzen jarraitzen
  baldin bada.\\n\\n73. artikulua.\u2013 Ikuskapena eta kontrola.\\n\\nLanbide-Euskal
  Enplegu Zerbitzua erakunde autonomoak beharrezkotzat jotako ikuskapen- eta kontrol-jarduerak
  egin ahal izango ditu, dekretu honetan ezarritako helburuak betetzen direla bermatzeko.\\n\\n74.
  artikulua.\u2013 Ez-betetzeak.\\n\\nDekretu honetan ezarritako laguntzen onuradun
  izango diren pertsonak edo erakundeak azaroaren 17ko Dirulaguntzei buruzko 38/2003
  Lege Orokorraren 37. artikuluan jasotako kasu\u00ad ren batean edo Euskadiko Ogasun
  Nagusiaren Antolarauei buruzko Legearen\u2013azaroaren 11ko 1/1997 Legegintzako
  Dekretuak onartua\u2013 testu bateginaren 53.1 artikuluan jasotako kasuren batean
  egongo balira, edota kapitulu honetan araututako laguntza-programetarako ezarritako
  bal\u00ad dintza espezifikoak beteko ez balituzte, Lanbide-Euskal Enplegu Zerbitzuko
  zuzendari nagusiak ebazpen bidez adieraziko lieke jaso gabe dituzten kopuruak jasotzeko
  eskubidea galdu izana, eta, hala badagokio, jasotako zenbatekoak Euskal Autonomia
  Erkidegoko Diruzaintza Nagu\u00ad siari itzultzeko betebeharra, dirulaguntza emandako
  unetik bertatik sortutako legezko interesekin batera. Horrez gain, egoki diren gainerako
  ekintzak bideratu ahal izango dira, abenduaren 17ko 698/1991 Dekretuan xedatutakoarekin
  bat.\\n\\nDiru-kopuru horiek sarrera publikotzat hartuko dira bidezko lege-ondorioetarako,
  eta erantzuki\u00ad zunen araubidea Euskadiko Ogasun Nagusiaren Antolarauei buruzko
  Legearen testu bateginaren 64. artikuluan ezarritakoa izango da.\\n\\n75. artikulua.\u2013
  Dirua itzultzeko prozedura.\\n\\nAurreko artikuluan aurreikusitako ez-betetze kasuetan
  jasotzen diren laguntzak itzultzeko pro\u00ad zedura honako hau izango da:\\n\\na)
  Lanbide-Euskal Enplegu Zerbitzuaren zuzendari nagusiak laguntzak itzultzeko prozedurari
  ekingo dio, prozedura hasi izana eta horretarako arrazoiak jakinaraziko dizkio erakunde
  interes\u00ad dunari, eta 15 eguneko epea emango dio alegazioak egiteko eta egokitzat
  jotzen dituen frogak aurkezteko. Prozedura hori hasten denean, eten egingo dira
  egiteko dauden ordainketak, halako\u00ad rik egonez gero.\\nb) Alegazioak jasotakoan,
  edo, horrelakorik aurkeztu ez bada ere, epea igarotakoan, prozedura amaituko da,
  Lanbide-Euskal Enplegu Zerbitzuaren zuzendari nagusiaren ebazpen baten bidez. Laguntzak
  itzultzeko prozedura gehienez ere 12 hilabeteko epean ebatzi beharko da. Ebazpen
  horren aurka aukerako berraztertzeko errekurtsoa jarri ahal izango da, ebazpenaren
  hurrengo egunetik hilabeteko epean.\\n\\nEbazpenak ez-betetzeren bat izan dela adierazten
  badu, dirulaguntza, osorik edo partzialki, jasotzeko eskubidea galdutzat emango
  da, eta, hala badagokio, ebazpena jakinarazten denetik hasita gehienez bi hilabeteko
  epean dagozkion zenbatekoak Euskal Autonomia Erkidegoko Diru\u00ad zaintza Nagusiari
  itzultzeko beharra ekarriko du. Epe hori borondatezko aldiaren epea izango da.\\n\\nc)
  Borondatezko aldi horretan dirulaguntza itzultzen ez bada, dirulaguntza berreskuratzeko
  pre\u00ad miamendu-bidera jotzeko izapideak hasiko dira.\\n76. artikulua.\u2013
  Europako Gizarte Funtsaren baterako finantzaketa.\\n\\nDekretu honetan araututako
  laguntzak Europako Gizarte Funtsak lagunduta finantzatu ahal izango dira. Hala bada,
  Europako Gizarte Funtsaren baterako finantzaketa duten programak arau\u00ad tzen
  dituen araudian ezarritako baldintzak eta betekizunak betetzen direla bermatuko
  da.\\n\\nLaguntzen deialdiak onartzen dituzten edo haien finantzaketarako baliabide
  ekonomikoak eslei\u00ad tzen dituzten Lanbideren Administrazio Kontseiluaren Erabakietan
  zehaztuko da zer programa operatibo den Europako Gizarte Funtsaren baterako finantzaketaren
  babesean finantzatuko dena, eta, hala badagokio, baterako finantzaketa horretatik
  eratorritako betekizunak edo baldintza espe\u00ad zifikoak ezarriko dira.\\n\\nIII.
  KAPITULUA\\n\\nENPLEGAGARRITASUNA HOBETZEKO EKIMENAK\\n\\n77. artikulua.\u2013 Finantzaketa
  jaso dezaketen jarduketak.\\n\\nFinantzaketa jaso ahal izango dute urtarrilaren
  16ko 7/2015 Errege Dekretuaren\u2013Enplegu Sis\u00ad tema Nazionaleko Zerbitzuen
  Zorro Komuna onartzekoa\u2013 7. artikuluan jasota dauden jarduketek; zerbitzu hauei
  dagozkie:\\n\\na) Lanbide-orientabideko zerbitzuak.\\nb) Enplegua emateko eta enpresei
  aholku emateko zerbitzuak.\\nc) Enplegurako prestakuntza- eta kualifikazio-zerbitzuak.\\nd)
  Autoenplegurako eta ekintzailetzarako aholku-zerbitzuak.\\n78. artikulua.\u2013
  Erakunde onuradunak.\\n\\nAtal honetan aurreikusitako finantzaketaren onuradun izan
  daitezke Euskal Autonomia Erkide\u00ad goan finkatutako lantokietan finantzaketa
  jaso dezaketen jarduketak egingo dituzten enplegu-zentro bereziak, betiere kalifikazio
  hori dutenak eta Enplegu Zentro Berezien Euskal Erregistroan inskri\u00ad batuta
  daudenak.\\n\\n77 b) artikuluaren kasuan, zehazki, Lanbide-Euskal Enplegu Zerbitzuak
  enplegu-agentziak izan daitezela exijituko du.\\n\\nEra berean, 77 c) artikuluaren
  kasuan, maiatzaren 31ko 82/2016 Dekretuan ezarritako araudia bete behar dute erakundeek\u2013Euskadiko
  enplegurako lanbide-prestakuntza arautzen du dekretu horrek\u2013.\\n\\n79. artikulua.\u2013
  Aurrekontu-zuzkidura.\\n\\nLanbide-Euskal Enplegu Zerbitzuko Administrazio Kontseiluaren
  Erabaki baten bitartez, urtero ezarriko da atal honetan araututako ekintzak finantzatzera
  bideratuko diren baliabide ekonomi\u00ad koen zenbatekoa.\\n\\n2019ko azaroaren
  28a, osteguna\\n\\nIndarrean dagoen legediaren araberako aurrekontu-aldaketarik
  onartzen bada, aurrekontu-eki\u00ad taldi batean emango diren laguntzen bolumen
  osoak ezin izango du gainditu ez aipatutako esleipena ez haren igoeraren ondoriozkoa.\\n\\nHasierako
  aurrekontu-zuzkiduraren eta egin litezkeen aldaketen jakinarazpenak EHAAn argita\u00ad
  ratuko dira, Lanbide-Euskal Enplegu Zerbitzuko zuzendari nagusiaren ebazpen baten
  bidez.\\n\\n80. artikulua.\u2013 Finantzaketa eta kudeaketa.\\n\\nZerbitzu eta programa
  hauek Eusko Jaurlaritzak Lanbide-Euskal Enplegu Zerbitzuaren bidez haietarako ezarriko
  duen zuzenbidearekin bat datorren formula juridikoaren bidez kudeatuko dira.\\n\\nKapitulu
  honetan jasotako finantzaketetarako deialdia Lanbide-Euskal Enplegu Zerbitzuaren
  Administrazio Kontseiluaren Erabaki baten bidez egingo da, eta hartan, alderdi hauek
  zehaztuko dira gutxienez: finantzaketarako baliatuko diren baliabide ekonomikoen
  zenbatekoa, eta dirula\u00ad guntza justifikatzeko epea eta horretarako nahitaezko
  dokumentazioa.\\n\\nDeialdiaren berri jakinaraziko da EHAAn argitaratuz, Lanbide-Euskal
  Enplegu Zerbitzuko zuzen\u00ad dari nagusiaren ebazpen baten bidez.\\n\\n81. artikulua.\u2013
  Finantzaketa emateko prozedura. Ebazpena eta ordainketa.\\n1.\u2013 Kapitulu honetan
  jasotako jarduketetarako finantzaketa emateko prozedura, haren ebaz\u00ad pena ematekoa,
  halakorik balego, eta hura ordaintzeko prozedura jarduketa-mota bakoitzerako ezarriko
  diren tresna juridikoetako bakoitzean ezarriko dira.\\n2.\u2013 Prozeduraren ebazpena
  eman eta jakinarazteko gehieneko epea sei hilabetekoa izango da, deialdi hau EHAAn
  argitaratzen den egunetik aurrera. Epe hori igarotakoan esanbidezko ebazpe\u00ad
  nik jakinarazi ez bada, eskaera ezetsi egin dela ulertuko da.\\n\\nIV. KAPITULUA\\n\\nENPLEGU-ZENTRO
  BEREZIEN EUSKAL ERREGISTROA\\n\\n82. artikulua.\u2013 Erregistroaren sorkuntza,
  izaera juridikoa eta adskribatzea.\\n1.\u2013 Enplegu Zentro Berezien Euskal Erregistroa
  sortzen da, izaera administratibo eta publikoa\u00ad rekin, eta egoitza soziala
  eta fiskala Euskal Autonomia Erkidegoan duten enplegu-zentro berezien erregistro
  bakar gisa eratzen da, Euskal Autonomia Erkidego osorako, erkidego horretan finkatu\u00ad
  tako enplegu-zentro horien lan-zentroetarako.\\n2.\u2013 Aipatutako Erregistroa
  Lanbide-Euskal Enplegu Zerbitzua erakunde autonomoari adskri\u00ad batzen zaio,
  laneratzearen arloan eskumena duen Zuzendaritzaren bitartez, eta hark izango du
  haren antolaketaren, kudeaketaren eta funtzionamenduaren ardura.\\n83. artikulua.\u2013
  Enplegu-zentro bereziaren kalifikazioa lortzeko betekizunak.\\n1.\u2013 Enplegu-zentro
  bereziaren kalifikazioa lortu ahal izango dute pertsona fisiko edo juridikoek osatutako
  erakunde publiko zein pribatuek, indarrean dauden xedapenekin bat enpresaburu iza\u00ad
  teko gaitasun juridikoa eta jarduteko gaitasuna izanik.\\n2.\u2013 Enplegu-zentro
  bereziaren kalifikazioa lortu nahi duten enpresek edo erakundeek betekizun hauek
  betetzen dituztela egiaztatu beharko dute:\\na) Titularraren nortasuna.\\n\\nb)
  Pertsona juridikoak izanez gero, aldez aurretik eratuta egotea eta beren estatutuetan
  jaso\u00ad tzea beren helburu sozialaren barnean xede dutela desgaitasuna duten
  pertsonak laneratzea.\\nc) Azterlan ekonomiko egoki baten bidez, zentroaren bideragarritasun
  teknikoa eta finantzarioa justifikatzea, bai eta beren xedeak betetze aldera dituzten
  bizirauteko aukerak ere. Azterlanak zehatz-mehatz zehaztu behar ditu azterlanaren
  xede diren lantokia edo lantokiak, bai eta haiei adskribatutako plantillaren tamaina
  eta banaketa ere. Izan ere, horri mugatzen zaizkio, berariaz, enplegu-zentro bereziaren
  bideragarritasunari buruzko ondorioak. Azterlana zenbait lan-zentrori buruzkoa bada,
  haren ondorioak lan-zentro bakoitzaren arabera xehakatu beharko dira.\\nd) Ekoizpen-prozesuak
  ahalbidetzen duen neurrian, desgaitasuna duten langileen kopururik handiena izatea,
  eta, betiere, gutxienez langileen % 70. Eta kalifikazioa eskatu aurretik jarduera
  hasi ez bada, plantilla horrela eratzeko konpromisoa hartzea. Ondorio horietarako,
  ez dira zen\u00ad batuko egokitze pertsonal eta sozialerako zerbitzuak ematen dituzten
  desgaitasunik gabeko langileak. Desgaitasuna duten langileek lan-kontratu idatzia
  izango dute, desgaitasuna duten per\u00ad tsonen enplegu-zentro berezietako lan-harreman
  berezia arautzen duen araudiaren babespean sinatua.\\ne) Zentroko plantillan zentroaren
  jarduerak behar dituen teknikariak eta laguntzaileak izatea edo langile horiek plantillan
  sartzeko konpromisoa hartzea. Langile horiek lanbide-titulazio egokiak eduki beharko
  dituzte.\\nf) Zentroko plantillan sartuko diren eta desgaitasuna duten pertsonei
  emango zaizkien egokitze pertsonal eta sozialerako zerbitzuak zehaztea.\\ng) Egoitza
  Euskal Autonomia Erkidegoan izatea; kalifikazioak barnean hartzen dituen lan-zen\u00ad
  troek ere EAEn kokatuta egon beharko dute.\\n3.\u2013 Erakunde sortu berriei dagokienez,
  aldez aurretik jarduera hasi ez badute, enplegu-zen\u00ad tro bereziaren kalifikazioa
  atzeratu egingo da, eta horretarako, ebazpenaren jakinarazpena egin eta hurrengo
  sei hilabeteen barruan, aurreko apartatuaren d) eta e) letretan zehaztutako konpro\u00ad
  misoak bete direla justifikatu beharko da, une horretan plantillak duen bolumena
  eta banaketa zehaztu beharko da, eta c) letran aipatutako azterlanean jasotako aurreikuspenekiko
  desbide\u00ad ratzerik izan bada, horren azalpen zehatza eman beharko da. Hala egin
  ezean, enplegu-zentro bereziaren kalifikazioa ematen dion ebazpena eraginik gabe
  geratuko da.\\n4.\u2013 Enplegu-zentro bereziaren kalifikazioa egitean, hala badagokio,
  berariaz aipa daiteke gizarte-ekimeneko enplegu-zentro berezia dela.\\n\\nGizarte-ekimeneko
  enplegu-zentro berezi gisa kalifika daitezke, eta, ondorioz, horrela erre\u00ad
  gistratu, hauetakoren bat egiaztatzen dutenak: zuzenean edo zeharka irabazi-asmorik
  gabeko erakunde batek sustatzen dituela, edo irabazi-asmorik gabeko erakundeek %
  50etik gorako par\u00ad taidetza dutela enplegu-zentroan.\\n\\nHalaber, egiaztatu
  beharko dute enplegu-zentro bereziaren mozkinak berriz inbertitzen direla enplegu-zentro
  berezian bertan edo gizarte-ekimeneko beste enplegu-zentro berezi batzue\u00ad tan,
  berariaz horrela jasota dagoelako euren estatutuetan edo ezaugarri hori berezkoa
  duelako gizarte-ekimeneko zentro gisa kalifikatu eta erregistratua izan nahi duen
  enplegu-zentro berezia\u00ad ren forma juridikoak.\\n\\n5.\u2013 Enpresa edo erakundea
  enplegu-zentro berezi gisa kalifikatuta eta erregistroan inskribatuta egonez gero,
  lan-zentro berri bat irekitzeko, kalifikazioa eta erregistroa berrikusi beharko
  dira, egiaztatzeko oraindik ere betetzen direla artikulu honen 2. apartatuan eskatutako
  betekizunak.\\n\\n6.\u2013 Kalifikazioa Enplegu Zentro Berezien Euskal Erregistroan
  inskribatu aurretik egingo da, eta prozedura bakarrean izapidetuko da.\\n84. artikulua.\u2013
  Prozeduraren hasiera.\\n1.\u2013 Kalifikazioa emateko eta Enplegu Zentro Berezien
  Erregistroan inskribatzeko prozedura Lanbide-Euskal Enplegu Zerbitzuari aurkeztutako
  eskabidearekin hasiko da.\\n2.\u2013 Eskabideak modu telematikoan soilik aurkeztu
  ahal izango dira. Prozedura hau izapide\u00ad tzean bitarteko elektronikoak erabiltzeko
  jarraibideak eta eskabide normalizatua hemen eskuratu ahal izango dira: Lanbide-Euskal
  Enplegu Zerbitzuaren webgunean (https://www.lanbide.euskadi. eus) eta Eusko Jaurlaritzaren
  egoitza elektronikoan (https://www.euskadi.eus).\\n85. artikulua.\u2013 Eskabidearekin
  batera aurkeztu beharreko dokumentazioa.\\n\\nEskabidearekin batera, honako dokumentu
  hauek aurkeztu behar dira:\\n\\na) Eskatzailea pertsona juridikoa bada, erakundearen
  IFKren fotokopia.\\nb) Kalifikazioa eskatzen duen pertsona juridikoaren estatutuak,
  eta haiekin batera eraketaren eta dagozkion erregistro publikoetan inskribatu izanaren
  frogagiriak; era berean, ordezkariaren IFZren kopia edo hura elektronikoki egiaztatzeko
  baimena, eta ordezkatzeko daukan ahalordea\u00ad ren kopia.\\nc) Enpresa edo zentroa
  irekitzeko eta haren funtzionamendurako nahiz garatu beharreko jarduera edo jarduerak
  garatzeko behar diren erakunde eskudunen baimenak eta lizentziak, eska\u00ad bideak
  aipatzen duen lan-zentroari edo, hala balitz, lan-zentroei buruzkoak.\\nd) Alta
  jarduera ekonomikoen gaineko zergan, eta kalifikazioa ematea nahi den jarduera ekono\u00ad
  mikoaren edo ekonomikoen EJSN kodea.\\ne) Gizarte Segurantzako kotizazio-kontuaren
  kodea edo kodeak.\\nf) Lan-zentroaren kokaleku zehatza, jarduera edo jarduerak zer
  higiezin, lur edo lokaletan garatzen diren edo garatuko diren zehaztuz, eta haien
  legezko titulartasunaren egiaztapena. Errentamendurik, erabileraren lagapenik, dohaintzarik
  edo higiezin, lur edo lokal horien gaineko edozein eskubide erreal egonez gero,
  hura enpresa edo erakunde eskatzailearen izenean dagoela egiaztatu beharko da betiere.\\ng)
  Zentroko langileen zerrenda, bai desgaitasuna dutenena, bai ez dutenena, eta haietako
  bakoitzarekin sinatutako lan-kontratuen kopiak.\\nh) Honako hauek jasoko dituen
  memoria:\\n1) Enpresa edo erakunde eskatzailearen aurrekariak.\\n2) Haren egungo
  egoera, ikuspuntu juridiko, sozial, ekonomiko eta finantzariotik, bereziki aipa\u00ad
  tuz ezaugarri pertsonalak eta materialak.\\n3) Garatzen duen edo garatu nahi duen
  jarduera edo jarduerak, eskuratu nahi dituen emaitzak eta errentagarritasuna adieraziz.\\n4)
  Lan-zentroaren edo, hala balitz, lan-zentroen identifikazio zehatza, kokalekua,
  ezaugarriak eta baliabideak adieraziz, eta haien titulartasunaren eta erabiltzeko
  eskubidearen egiaztapena.\\n\\n2019ko azaroaren 28a, osteguna\\n\\n5) Enpresa-proiektuaren
  bideragarritasun teknikoari eta finantzarioari buruzko azterlan ekonomi\u00ad koa,
  alderdi hauek zehaztuta: ekoizpeneko eta merkaturatzeko alderdi teknikoak, inbertsio-plana,
  finantzaketa-plana, galera-irabazien kontuak eta ondorengo hiru ekitaldietarako
  aurreikusitako egoeraren balantzeak, enplegu-zentro bereziaren programa soziala
  eta hurrengo hiru ekitaldie\u00ad tako emaitza sozialen aurreikuspena. Eskabidea
  zenbait lan-zentrori buruzkoa bada, aurrez aipatu diren alderdiak lan-zentroka xehakatuta
  zehaztu beharko dira.\\n6) Desgaitasuna duten langileei zentroak eskaintzen dizkien
  edo eskainiko dizkien egokitze pertsonal eta sozialerako zerbitzuen deskribapen
  zehatza.\\n7) Jardueraren memoria, zentroak dituen edo izango dituen langile desgaituen
  kopurua jasoz, hala badagokio lan-zentroka xehakatuta.\\ni) Enpresa edo erakunde
  eskatzaileak oraindik ez badu jarduera hasi, 83.2 artikuluko d) eta e) apartatuetan
  aipatutako konpromisoak erantsi beharko ditu.\\nj) Gizarte-ekimeneko enplegu-zentro
  berezi gisa akreditatzeko, Lanbide-Euskal Enplegu Zerbi\u00ad tzuak erakunde eskatzaileei
  eskatuko die beharrezko dokumentazio guztia aurkezteko, ezarritako betekizun guztiak
  betetzen dituztela egiaztatu ahal izateko; adibidez: enplegu-zentro berezi eska\u00ad
  tzailean zuzenean edo zeharka parte hartzen duten erakunde sustatzaileek edo sozietate
  nagusiek irabazteko asmorik ez izatea, edota irabazizko izaera duten edo ez.\\n86.
  artikulua.\u2013 Akatsak zuzentzea.\\n1.\u2013 Eskabideak ez badaude behar bezala
  beteta, edo harekin batera ez bada nahitaezko doku\u00ad mentazioa aurkezten, pertsona
  edo erakunde eskatzaileari hamar eguneko epea emango zaio akatsa zuzen dezan edo
  nahitaezko dokumentuak aurkez ditzan. Gainera, jakinaraziko zaio hori egiten ez
  badu bere eskaerari uko egin diola ulertuko dela, eta Administrazioak eskaera horri
  buruzko ebazpena eman beharko du esanbidez, bai eta jakinarazi ere.\\n2.\u2013 Aurreko
  apartatuan aurreikusitako eskakizunak berekin ekar dezake, halaber, kalifikaziorako
  ezarritako baldintzak bete direla zehazteko edo argitzeko beharrezkoa izan daitekeen
  informazio eta/edo dokumentazio osagarria aurkeztu beharra.\\n87. artikulua.\u2013
  Prozedura izapidetzea eta ebaztea.\\n1.\u2013 Lanbide-Euskal Enplegu Zerbitzuan
  laneratzearen arloko eskumena duen zuzendaritzari dagokio eskabidea izapidetzeko
  eta enplegu-zentro bereziaren kalifikazioa emateko ezarritako baldintzak betetzen
  direla egiaztatzeko beharrezko diren jarduketak egitea.\\n2.\u2013 Enplegu-zentro
  berezi gisa kalifikatzeari eta, hala badagokio, inskribatzeari buruz ebazteko eskumena
  Lanbide-Euskal Enplegu Zerbitzuko zuzendari nagusiarena izango da.\\nEbazpenak xehetasunez
  zehaztuko du zer lan-zentrori dagozkion edo dagozkien enplegu-zentro bereziaren
  kalifikazioa eta inskripzioa, eta, hala dagokionean, gizarte-ekimeneko enplegu-zentro
  bereziaren izaera.\\n3.\u2013 Kalifikazioari eta Enplegu Zentro Berezien Euskal
  Erregistroan inskribatzeari buruz ebaz\u00ad teko eta ebazpena jakinarazteko gehieneko
  epea sei hilabetekoa izango da, eskabidea organo eskudunaren erregistroan izapidetzeko
  sartu den egunetik zenbatzen hasita. Epe hori igarota esanbidezko ebazpenik eman
  eta jakinarazi ez bada, aurkeztutako eskabidea baietsi egin dela ulertuko da.\\n\\n2019ko
  azaroaren 28a, osteguna\\n\\nBetiere, ebazpenaren jakinarazpena bitarteko elektroniken
  bidez egingo da, eta pertsona interesdunak Eusko Jaurlaritzaren egoitza elektronikoan
  agertuz gauzatuko da: https://www. euskadi.eus\\n\\n4.\u2013 Lanbide-Euskal Enplegu
  Zerbitzuko zuzendari nagusiaren ebazpenak amaiera ematen dio administrazio-bideari,
  eta haren aurka aukerako berraztertzeko errekurtsoa aurkeztu ahal izango da hilabeteko
  epean, ebazpena jakinarazi eta biharamunetik hasita, edota bestela, administra\u00ad
  zioarekiko auzi-errekurtsoa jar daiteke zuzenean Vitoria-Gasteizko Administrazioarekiko
  Auzien Epaitegian, bi hilabeteko epean, ebazpena jakinarazi eta biharamunetik hasita.\\n5.\u2013
  Kalifikazioa eta inskripzioa jarduerak hasi aurretik eskatzen diren kasuetan, enplegu-zentro
  bereziak, ebazpenaren jakinarazpenaren ondorengo sei hilabeteen barruan, kalifikaziorako
  behar diren baldintzak bete dituela egiaztatu beharko du, 83.2 artikuluan xedatutakoarekin
  bat.\\n6.\u2013 Enplegu-zentro berezi gisa kalifikatzeak eta erregistroan inskribatzeak
  ez du berez dirulagun\u00ad tza, laguntza edo diru-konpentsazio publikoak jasotzeko
  eskubiderik sortuko, baina hori nahitaez bete beharreko baldintza izango da laguntza
  horiek jasotzeko eskubidea lortzeko. Edonola ere, laguntzak arautzen dituen araudian
  horretarako ezartzen diren betekizunak bete beharko dira.\\n88. artikulua.\u2013
  Inskribatzeko liburua.\\n1.\u2013 Enplegu Zentro Berezien Euskal Erregistroak enplegu-zentro
  bereziak inskribatzeko liburu bat izango du, eta, hartan, datu hauek jasoko dira:\\na)
  Enplegu-zentro bereziaren izena eta IFZ; horrez gain, hala badagokio, gizarte-ekimeneko
  zentroa izatearen aipamena, 83.4 artikuluan xedatutako moduan.\\nb) Emandako erregistro-zenbakia.\\nc)
  Kalifikazioaren eta inskripzioaren hasierako ebazpenaren data, zein hura aldatzeko
  edo ezeztatzeko ondorengo ebazpenak, haren eduki xedatzailea aipatuz.\\nd) Egoitza
  soziala eta kontakturako datuak: telefonoa, faxa eta posta elektronikoa.\\ne) Forma
  juridikoa.\\n\\nf) Helburu sozialaren deskribapena.\\n\\ng) Kalifikazioak hartzen
  duen jarduera edo jarduerak.\\nh) Kalifikazioak hartzen duen lan-zentroa edo lan-zentroak.\\ni)
  Enplegu-zentro bereziaren legezko ordezkaria.\\nj) Beste gorabehera eta datu interesgarri
  batzuk.\\n2.\u2013 Aurreko apartatuko g) eta h) letretan jasotako erregistro-datuak
  aldatzeko, enplegu-zentro bereziak berariazko eskaera egin beharko du, 84. artikuluan
  eta hurrengoetan xedatutako proze\u00ad duraren arabera.\\n3.\u2013 Erregistro-datuen
  beste edozein aldaketa Enplegu Zentro Berezien Euskal Erregistroari jakinarazi behar
  zaio, hilabeteko epean hura eragin duten gorabeherak gertatu diren egunetik zenbatuta,
  eta horretarako, erregistroan dagozkion aldaketak egiteko behar diren egiaztagiriak
  aurkeztu beharko dira. Halaber, enplegu-zentro bereziaren titulartasunari eragiten
  dioten aldake\u00ad tak jakinarazi beharko dira, bereziki gizarte-ekimeneko enplegu-zentro
  berezien kasuan.\\n\\nBetebehar hori ez betetzeak kalifikazioa galtzeko prozedura
  hastea ekar dezake.\\n\\nErregistro-datuen beste edozein aldaketa Enplegu Zentro
  Berezien Euskal Erregistroari jakina\u00ad razi behar zaio, hilabeteko epean hura
  eragin duten gorabeherak gertatu diren egunetik zenbatuta, eta horretarako, erregistroan
  dagozkion aldaketak egiteko behar diren egiaztagiriak aurkeztu beharko dira. Betebehar
  hori ez betetzeak kalifikazioa galtzeko prozedura hastea ekar dezake.\\n\\n89. artikulua.\u2013
  Jarraipena eta kontrola.\\n1.\u2013 Enplegu-zentro bereziek derrigorrez onartu behar
  dituzte erregistroa adskribatu zaion organoak ezarritako kontrol-jarduketak, egiaztatzeko
  haren funtzionamendua eta ezaugarriak kali\u00ad fikaziorako ezarritako baldintzei
  egokitzen zaizkiela.\\n2.\u2013 Halaber, urte bakoitzeko lehen seihilekoan, alderdi
  hauek biltzen dituen memoria bat aur\u00ad keztu beharko dute erregistroan:\\na)
  Enplegu-zentro bereziaren identifikazioa.\\n1) Izena.\\n2) Titulartasuna.\\n3) Lurralde-kokapena,
  egoitza soziala eta lan-zentroa edo lan-zentroak.\\n4) Jarduera nagusiak eta osagarriak,
  eta helburu ekonomikoen eta egokitze pertsonal edo sozialeko helburuen betetze-mailaren
  zehaztapena, adieraziz zer kausak edo faktorek izan duten eragin onuragarria edo
  kaltegarria zentroan.\\n5) Gizarte Segurantzako kotizazio-kontuaren edo -kontuen
  kodeak.\\n6) Zentroaren IFZ.\\nb) Plantillari buruzko inguruabarrak. Aurreko urteko
  abenduaren 31n plantillan zeuden langile guztien zerrenda. Zerrenda horretan, desgaitasuna
  duten pertsonen desgaitasun-mota\u2013fisikoa, psikikoa edo sentsoriala\u2013 eta,
  hala badagokio, -maila adieraziko da. Informazio horretan, datu guztiak sexuaren
  arabera bereizita eman behar dira.\\n\\nZerrendan, datu hauek jaso beharko dira
  urte horretan plantillan egon den langile bakoitzeko:\\n\\n1) Izena, abizenak, adina
  eta sexua.\\n2) IFZ.\\n3) Gizarte Segurantzako afiliazio-zenbakia.\\n4) Hala dagokionean,
  aitortutako desgaitasun-mailaren ehunekoa, aitorpenaren data eta berrazterketak.\\n5)
  Lanbide-kategoria.\\n6) Laneko eta Gizarte Segurantzako altaren data.\\n7) Kontratu-mota
  eta lanaldia.\\n\\nc) Enplegu-zentro berezian aurreko urtean baja eman duten langileei
  buruzko txostena, alderdi hauek zehaztuz:\\n1) Bajaren data.\\n2) Bajaren kausa.
  Baja borondatezkoa izan bada, berariaz aipatu behar da ea horren arrazoia izan den
  langilea lan-merkatu arruntean laneratu izana.\\nd) Jarduera ekonomikoaren inguruabarrak.\\n1)
  Urteko aurrekontuaren likidazioa.\\n2) Egoera-balantzea.\\n3) Emaitza ekonomikoak
  biltzen dituen ustiapen-kontua, galera-irabaziak zehaztuta.\\n4) Merkataritza Erregistroan
  edo dagozkion erregistroetan, zentroaren titularraren izaera juridikoaren arabera,
  aurrez aipatutako dokumentuak edo aplikatzekoak diren lege- eta erregela\u00ad mendu-mailako
  arauen arabera behar direnak aurkeztu izanaren egiaztagiria.\\n3.\u2013 Urteko memoria
  aurkezten ez bada, edo hura aztertu ondoren erakundeak 88.3 artikuluan horretarako
  xedatutako epean jakinarazi behar zuen daturen bat dagoela egiaztatzen bada, hori
  deskalifikatzeko eta Enplegu Zentro Berezien Erregistroan ezeztatzeko kausa izan
  ahalko da.\\n90. artikulua.\u2013 Deskalifikatzea eta erregistroan ezeztatzea.\\n1.\u2013
  Honako hauek kalifikazioa galtzeko kausak izan daitezke:\\na) 83. artikuluan jasotako
  baldintzaren bat ez betetzea.\\nb) Zentroa sei hilabetetik gora jarduerarik gabe
  egotea.\\nc) Zentroaren titularrak eskatuta jarduera borondatez uztea.\\nd) 89.
  artikuluan aurreikusitako urteko memoria aurkezteko betebeharra ez betetzea.\\ne)
  Administrazio publikoek laguntzak, dirulaguntzak edota edozein konpentsazio-mota
  eman izanak eragindako betebeharrak ez betetzea.\\nf) Dirulaguntzak itzultzearen
  arloko betebeharrak ez betetzea, salbu eta haren atzeratzea eta/ edo zatikatzea
  onartu bada, borondatezko bidearen edo betearazpen-bidearen bitartez.\\ng) Lege
  edo erregelamendu bidez ezarrita dagoen eta enplegu-zentro berezia izatetik datorren
  beste edozein betebehar ez betetzea.\\nh) Lortutako kalifikazioaren erabilera desegokia
  dakarren beste edozein kausa.\\n2.\u2013 Deskalifikazio-prozedura alde batek eskatuta
  edo ofizioz hasiko du kalifikaziorako eta ins\u00ad kripziorako eskumena duen organoak,
  Lanbide-Euskal Enplegu Zerbitzuko zuzendari nagusiak, alegia.\\n\\nDeskalifikazio-prozedura
  ofizioz hasitakoan, Lanbide-Euskal Enplegu Zerbitzuan laneratzearen arloko eskumena
  duen zuzendaritzak haren eraginpeko enplegu-zentro bereziari jakinaraziko dio, jakinarazpena
  jaso denetik 15 egun balioduneko epean, egokitzat jotzen dituen alegazioak aurkez
  ditzan.\\n\\n2019ko azaroaren 28a, osteguna\\n\\nEpe hori amaituta, eta aurkeztutako
  alegazioak baloratu ondoren, Lanbide-Euskal Enplegu Zerbitzuan laneratzearen arloko
  eskumena duen zuzendaritzak deskalifikaziorako proposamena egingo du, eta organismo
  autonomoko zuzendari nagusiari igorriko dio, ebatz dezan.\\n\\n3.\u2013 Deskalifikazio-ebazpena
  emandakoan, ezeztatu egingo da enplegu-zentro bereziak Enplegu Zentro Berezien Euskal
  Erregistroan zuen inskripzioa, eta haren erregistro-orria itxiko da, kasuan kasu
  dagokion idazpena eginez.\\n4.\u2013 Lanbide-Euskal Enplegu Zerbitzuko zuzendari
  nagusiaren ebazpenak amaiera ematen dio administrazio-bideari, eta haren aurka aukerako
  berraztertzeko errekurtsoa aurkeztu ahal izango da hilabeteko epean, ebazpena jakinarazi
  eta biharamunetik hasita, edota bestela, administra\u00ad zioarekiko auzi-errekurtsoa
  jar daiteke zuzenean Vitoria-Gasteizko Administrazioarekiko Auzien Epaitegian, bi
  hilabeteko epean, ebazpena jakinarazi eta biharamunetik hasita.\\n\\nXEDAPEN GEHIGARRIA.\u2013
  Datu pertsonalen tratamendua.\\n\\nDatu pertsonalen babesaren arloan, Lanbide-Euskal
  Enplegu Zerbitzuaren jarduera honako bi xedapen hauen mende egongo da: Datuak Babesteko
  Erregelamendu Orokorra (EB 2016/679 Erregelamendua) eta Datu Pertsonalak Babesteko
  eta Eskubide Digitalak Bermatzeko 3/2018 Lege Organikoa.\\n\\nDirulaguntzak emateko
  prozeduretan lortzen diren datu pertsonalak \u00abEnplegurako eta enpleguko prestakuntzarako
  dirulaguntzak\u00bb izeneko tratamendu-jardueraren barruan egongo dira. Jarduera
  horren arduraduna Lanbide da, eta haren helburua da Lanbideren eskumen diren enplegu-politika
  aktiboekin zerikusia duten dirulaguntzak kudeatu eta kontrolatzea, bai eta iruzurra
  jazartzea eta datuak estatistiketan erabiltzea ere.\\n\\nEnplegu Zentro Berezien
  Euskal Erregistroan inskribatzeko eta kalifikatzeko prozeduretan biltzen diren datu
  pertsonalak \u00abErakundeen erregistroa\u00bb izeneko tratamendu-jardueraren parte
  izango dira, zeinaren arduraduna Lanbide baita. Tratamendu-jarduera horren xedea
  da erakundeen altak eta bajak kudeatzea Lanbideren eskumeneko erregistro publikoetan,
  bai eta erakundeekiko komu\u00ad nikazioak kudeatzea ere.\\n\\nLortzen diren datuak
  beharrezkoak dira Lanbideri emandako botere publikoak erabiltzeko eta lege-betebeharrak
  betetzeko, eta arlo horren eskumena duten administrazio publikoei jakinarazi ahal
  izango zaizkie.\\n\\nDatuen titularrek datuak eskuratzeko, zuzentzeko eta ezabatzeko,
  datuen aurka egiteko eta datuen tratamendua mugatzeko eskubideak erabili ahal izango
  dituzte, Lanbide-Euskal Enplegu Zerbitzuari idatzizko jakinarazpen bat bidalita
  (Jose Atxotegi kalea 1, 01009, Vitoria-Gasteiz).\\n\\nDatuen babesari buruzko informazio
  gehiago hemen: http://www.lanbide.euskadi.eus/ orokorra/-/informazioa/erabiltzeko-baldintzak-eta-segurtasun-politika/\\n\\nLEHENENGO
  XEDAPEN IRAGANKORRA.\u2013 Laguntzen araubide iragankorra.\\n\\nDekretu hau indarrean
  jarri aurreko deialdietan emandako laguntzei aplikatuko zaizkie deialdi horietan
  jasotako oinarri arautzaileak edota haiek onartzeko oinarri hartu ziren araudiak,
  babesa ematen dietenak.\\n\\nHonako eskabide hauei dirulaguntzok arautzen dituzten
  estatu-araudietan xedatutakoa aplika\u00ad tuko zaie: II. kapituluko 1. atalean
  (Desgaitasuna duten pertsonen enplegua lan-merkatu arruntean sustatzeko laguntzak)
  jasotako jarduera diruz lagungarriei dagozkien laguntza-eskabideak, 3.\\n\\n2019ko
  azaroaren 28a, osteguna\\n\\nataleko 1. azpiatalean jasotakoak (Desgaitasuna duten
  pertsonen lanpostuak mantentzeko lagun\u00ad tzak), baldin eta dekretu hau indarrean
  jartzen denean ebatzi gabe badaude, eta geroago aurkeztu diren eta aurreko ekitaldiko
  jarduerei dagozkien eskabideak.\\n\\nBetiere, aurreko paragrafoan aipatzen diren
  eskabideak 2020ko otsailaren 1a baino lehen aur\u00ad keztu beharko dira.\\n\\nBIGARREN
  XEDAPEN IRAGANKORRA.\u2013 Lehendik zeuden enplegu-zentro bereziak.\\n\\n1.\u2013
  Euskal Autonomia Erkidegoan lehendik zeuden enplegu-zentro berezi guztiak, 2011ko
  urta\u00ad rrilaren 1a baino lehenago zegokien erregistroan inskribatuta zeudenak,
  Euskal Erregistro berrian sartuko dira ofizioz, eta beren sorrera-dataren arabera
  dagokien inskripzio-zenbakia esleituko zaie.\\n2.\u2013 Ez dira ofizioz inskribatuko
  gaur egun enplegu-zentro bereziaren kalifikazioa izanik sei hila\u00ad bete baino
  gehiago jarduerarik gabe egon direnak.\\n3.\u2013 Lehendik zeuden enplegu-zentro
  bereziek gizarte-ekimeneko enplegu-zentro bereziaren kalifikazioa lortu ahal izango
  dute, dekretu honen 83.4 artikuluan xedatutakoa betez, aurrez horre\u00ad tarako
  eskabidea aurkeztuta.\\n\\nAZKEN XEDAPENETAKO LEHENENGOA.\u2013 Aplikatzekoa den
  araudi osagarria.\\n\\nDekretu honetan aurreikusi ez diren kontuetarako, honako
  hauek aplikatuko dira:\\n\\na) Administrazio-prozeduraren arloan, Administrazio
  Publikoen Administrazio Prozedura Erki\u00ad dearen urriaren 1eko 39/2015 Legean
  xedatutakoa.\\nb) Dirulaguntzen araubide juridikoari dagokionez: Dirulaguntzei buruzko
  arazoaren 17ko 38/2003 Lege Orokorra eta hura garatzen duen Erregelamendua (uztailaren
  21eko 887/2006 Errege Dekretuaren bidez onartua), oinarrizko araudi gisa; azaroaren
  11ko 1/1997 Legegintzako Dekre\u00ad tuak onartutako Euskadiko Ogasun Nagusiaren
  Antolarauei buruzko Legearen testu bategineko VI. titulua eta VII. tituluko III.
  kapitulua; eta abenduaren 17ko 698/1991 Dekretua\u2013dekretu horrek arautzen ditu
  Euskal Autonomia Erkidegoaren Aurrekontu Orokorren kargura ematen diren dirula\u00ad
  guntzen bermeei eta horiek itzultzeari buruzko erregimen orokorra, eta horien kudeaketan
  parte hartzen duten erakunde laguntzaileek bete beharreko baldintzak, erregimena
  eta eginbeharrak\u2013.\\nc) Zehapen-araubideari dagokionez, aurreko horiez gain,
  Lan Arloko Arau Hauste eta Zehape\u00ad nei buruzko Legearen testu bategina onartzen
  duen abuztuaren 4ko 5/2000 Legegintzako Errege Dekretua.\\n\\nAZKEN XEDAPENETAKO
  BIGARRENA.\u2013 Dekretuaren garapena eta egikaritzea.\\n\\n1.\u2013 Enpleguaren
  arloan eskumena duen sailaren titularrari dagokio dekretu honek behar duen arau-garapena
  egitea, hala badagokio. Halaber, dirulaguntzak eskatzeko eta Enplegu Zentro Berezien
  Euskal Erregistroan inskribatzeko eta akreditatzeko eskabide normalizatuak onartuko
  ditu, zeinak EHAAn argitaratuko baitira, eta dekretu honetan jasotako dirulaguntzen
  zenbatekoak aldatu ahal izango ditu.\\n2.\u2013 Lanbide-Euskal Enplegu Zerbitzuko
  zuzendari nagusiak, bere eskumenez baliatuta, beha\u00ad rrezko diren ebazpenak
  eman ditzake dekretu honetan xedatutakoa gauzatu dadin.\\n\\n2019ko azaroaren 28a,
  osteguna\\n\\nAZKEN XEDAPENETAKO HIRUGARRENA.\u2013 Dekretua indarrean jartzea.\\n\\nDekretu
  hau 2020ko urtarrilaren 1ean jarriko da indarrean.\\n\\nVitoria-Gasteizen, 2019ko
  urriaren 29an.\\n\\nEnpleguko eta Gizarte Politiketako sailburua, BEATRIZ ARTOLAZABAL
  ALBENIZ.\\n\\n2019/5502 (45/45)\\n\\nLehendakaria, I\u00d1IGO URKULLU RENTERIA.\"",
  "\"LEGE-OHARRA ETA ERABILERA-BALDINTZAK (WEBGUNEA)\\n\\n(2023/11/09tik indarrean
  den bertsioa)\\n\\nINFORMAZIO LEGALA\\n\\nInformazio Gizartearen eta Merkataritza
  Elektronikoaren Zerbitzuei buruzko uztailaren 11ko 34/2002 Legearen 10. artikuluan
  ezartzen da informazio-gizarteko zerbitzu-emaileak eduki behar dituela baliabideak,
  bai zerbitzuaren hartzaileei bai organo eskudunei, bide elektronikoen bidez, modu
  iraunkor, erraz, zuzeneko eta doakoan, informazio hau eskura jartzeko:\\n\\nDomeinuaren
  izena: www.goe.community.bculinary.com\\n\\nHelbide elektronikoa: email@example.com\\n\\nJabea:
  BASQUE CULINARY CENTER FUNDAZIOA, egoitza Donostiako Juan Abelino Barriola pasealekuko
  101.ean duen erakundea, Euskadiko Fundazioen Erregistroan inskribatua (erregistro-zk.:
  F-253) eta IFK G-20998100 duena (aurrerantzean, \\\"BCCF\\\").\\n\\nERABILERA-BALDINTZAK\\n\\nEremua,
  helburua eta irismena\\n\\nXedapen hauek (aurrerantzean, \\\"ERABILERA-BALDINTZAK\\\")
  arautzen dituzte BCCFk www.goe.community.bculinary.com domeinuaren bidez (aurrerantzean,
  \\\"WEBGUNEA\\\") Interneteko erabiltzaileen (aurrerantzean, \\\"ERABILTZAILEA/K\\\")
  esku jarritako webguneko zerbitzura irispidea izateko eta erabiltzeko baldintzak.\\n\\nAurrez
  esandakoaren kalterik gabe, litekeena da BCCFk WEBGUNEAREN bidez ERABILTZAILEAREN
  esku jartzen dituen zenbait edukitara sartzeko edo zerbitzu jakin batzuk erabiltzeko
  baldintza berezi batzuk izatea (aurrerantzean, \\\"BALDINTZA BEREZIAK\\\"), zeinek,
  kasu bakoitzaren arabera, ERABILERA-BALDINTZA hauek ordeztu, osatu edo aldatuko
  baitituzte eta, kontraesanik balego, hauen gainetik egongo baitira. BALDINTZA BEREZI
  horiek aplikatu behar badira, ERABILTZAILEEN esku egongo dira WEGBUNEAN bertan.\\n\\nOndorioz,
  eduki horietan sartu aurretik edo zerbitzu horiek erabili aurretik, ERABILTZAILEAK
  arretaz irakurri beharko ditu sarbide eta erabilera hori gauzatzen den unean argitaratutako
  bertsioa arautzen duten BALDINTZA BEREZIAK, eta, hala badagokio, onartu egin beharko
  ditu.\\n\\nBCCFk eskumena du, edozein unetan eta aurrez jakinarazteko beharrik gabe,
  ERABILERABALDINTZA hauetan edozein aldaketa edo eguneratze egiteko. Aldaketak eta
  eguneratzeak egin ahal izango ditu, halaber, dagozkion BALDINTZA BEREZIETAN eta,
  oro har, WEBGUNEAREN diseinua eta konfigurazioa osatzen duten elementu guztietan.
  WEBGUNEAREN azken eguneratzean argitaratutako ERABILERA-BALDINTZAK bete beharko
  dira, eta bisitaldi bakoitzean, une horretan WEBGUNEAN argitaratuta daudenak izango
  dira aplikagarriak.\\n\\nERABILTZAILEAK, WEBGUNEAN sartzearekin, onartzen eta baimentzen
  ditu webgunearen erabilera-erregimena arautzen duten ERABILERA-BALDINTZA hauek,
  berariaz eta eragozpenik gabe, eta onarpen horrek izenpetutako idatzizko edozein
  kontraturen baliozkotasun eta eraginkortasun berberak izango ditu.\\n\\n. ERABILTZAILEAK
  ez baditu ERABILERA-BALDINTZA hauek osorik onartzen, ez du baimenik izango WEBGUNEAN
  sartzeko.\\n\\nERABILTZAILEaren erregistroa eta pasahitza\\n\\nWEBGUNEA erabiltzeko
  eta BCCFk horren bidez eskura jarritako eduki eta zerbitzu jakin batzuetarako sarbidea
  izateko ERABILTZAILE gisa erregistratu beharra dagoen kasuetan, horretarako informazio
  egiazkoa eta legezkoa ematearen erantzulea izango da erabiltzailea.\\n\\nERABILTZAILEAK
  modu egokian erabili beharko ditu esleitzen zaizkion identifikatzailea eta pasahitza,
  haiek zaintzearen eta isilpean gordetzearen erantzulea izango da, eta konpromisoa
  hartuko du hirugarrenei ez uzteko \u2014ez aldi baterako ez betiko\u2014, baita
  bestelako pertsonei sarbidea ez ahalbidetzeko ere.\\n\\nWEBGUNEAREN sarbideari eta
  erabilerari lotutako baldintza ekonomikoak\\n\\nBALDINTZA BEREZIETAN besterik adierazi
  ezean, WEBGUNERAKO eta bertako edukietarako sarbidea doakoa da, ERABILTZAILEAK bere
  hornitzailearekin kontratatuta daukan telekomunikazio-sarerako konexioaren kostua
  izan ezik.\\n\\nJabetza industrialeko eta intelektualeko eskubideak.\\n\\nWEBGUNEAREN
  gaineko jabetza industrialaren eta intelektualaren eskubide guztiak legez erreserbatuta
  daude, eta ERABILTZAILEAK sarbidea izateak ez du esan nahi, inola ere, BCCFren eta
  edozein hirugarrenen titulartasunekoak edo jabetzakoak diren aktiboen erabileralizentziarik
  edo eskubiderik ematen zaionik. Eskubide-erreserba hori (i) bai kanpoko itxurari
  (look and feel) eta WEBGUNEAREN nabigazioaren kode, diseinu eta egiturari (ii) bai
  WEBGUNEan dauden eta hedatu daitezkeen edozein formatutako edukiei dagokie eta,
  bereziki, BCCFk WEBGUNEAN jartzen dituen katalogo eta irudiei.\\n\\nWEBGUNEAN izen
  komertzialen, marken, logotipoen edo bestelako ikur bereizgarrien erreferentziak
  barne hartzen badira, direla BCCFren titulartasunekoak direla hirugarrenenak, debekatuta
  egongo da haiek erabiltzea BCCFren berariazko baimenik edo legezko titularraren
  baimenik eduki ezean.\\n\\nOndorioz, ERABILTZAILEAK WEBGUNEAREN bitartez bere esku
  jarri diren edukiak eta zerbitzuak modu pertsonalean eta pribatuan bakarrik bistaratu
  eta erabili ahal izango ditu, betiere aipatutako eduki eta zerbitzuekin jarduera
  komertzial edo profesionalik egiteko helbururik gabe.\\n\\nHalaber, debekatuta dago
  WEBGUNEAK funtzionatzeko, irispidea izateko eta erabili ahal izateko beharrezkoak
  diren programa informatikoak deskonpilatzea, desmuntatzea, atzeranzko ingeniaritza
  egitea, azpilizentziak ematea edo edozein modutara transmititzea, itzultzea edo
  lan eratorriak egitea. ERABILTZAILEAK inola ere ez du ezabatu, aldatu, saihestu
  edo manipulatu behar WEBGUNEAN instalatuta egon daitekeen inolako babes-gailurik
  edo segurtasunsistemarik.\\n\\nErantzukizunak eta bermeak\\n\\nWEBGUNEA erabiltzen
  duenak bere gain eta galorde erabiltzen du. WEBGUNEAN sartzean, ERABILTZAILEAK hitz
  ematen du (i) ez duela BCCFren edo hirugarrenen irudiari, interesei eta eskubideei
  kalte egin diezaiekeen ezer egingo, ezta WEBGUNEARI kalte egin, hura ezgaitu edo
  gainkargatu dezakeen ezer ere, ezta dena delako moduan hura normal erabiltzea eragotz
  dezakeen ezer ere, eta (ii) Legeekin eta trafiko komertzialeko erabilerekin guztiz
  bat datorren moduan erabiliko duela.\\n\\n.\\n\\n.\\n\\nHorren ondorioz, ERABILTZAILEA
  izango da erantzulea BCCFren edo hirugarrenen aurrean betebehar horiek ez betetzearen
  ondorioz kalte-galerarik badago.\\n\\nWEBGUNEAK behar bezala funtzionatzeko eta
  birusak eta osagai kaltegarriak hautemateko egokitzat jotzen dituen segurtasun-neurriak
  ezartzen ditu BCCFk. Hala eta guztiz ere, ERABILTZAILEAK kontuan izan behar du Interneten
  sistema informatikoen segurtasunneurriak ez direla erabat fidagarriak, eta horrenbestez,
  BCCFk ezin duela bermatu (i) WEBGUNEAN jasotako edukiak eta zerbitzuak edozein unetan
  eskuratu ahal izatea, (ii) aipatutako edukietan akatsik ez egotea, ezta gertatzen
  den edozein akats konponduko duenik ere, (iii) birusik edo ERABILTZAILEAREN sistema
  informatikoak (softwarea eta hardwarea) edo dokumentu elektronikoak eta haietan
  jasotako fitxategietan aldaketak eragin ditzakeen elementu kaltegarririk izango
  ez denik, (iv) ezta ezarritako segurtasun-neurriak hutsezinak direnik ere.\\n\\n.\\n\\nEra
  berean, BCCFk zerbitzua partzialki edo erabat, aldi baterako edo behin betiko eteteko
  eskubidea dauka, aldaketa teknikoak edo matxurak baldin badaude, aldez aurretik
  jakinarazita, posible bada, WEBGUNEAREN edo horretara zuzendutako beste edozein
  baliabideren bidez.\\n\\nESTEKAK\\n\\nEstekatutako guneak\\n\\nWEBGUNEAREN bidez,
  BCCFk ERABILTZAILEAREN eskura jartzen ditu hirugarrenen jabetzako eta hirugarrenek
  kudeatutako Interneteko beste gune edo atari batzuetara (aurrerantzean, \\\"GUNE
  ESTEKATUAK\\\") bideratuko dituzten estekak egiteko gailu teknikoak (adibidez, botoiak,
  estekak eta bannerak) eskaintzen dizkio.\\n\\nBCCFk ez ditu ESTEKATUTAKO GUNEETAN
  jasotako eduki eta zerbitzuak ez ezagutzen ez kontrolatzen, eta WEBGUNEAREN bitartez
  haietarako sarbidea emateak ez du inola ere esan nahi (i) BCCFk ESTEKATUTAKO GUNEETAN
  barne hartutako eduki eta zerbitzuak aholkatu edo onartzen dituenik eta (ii) BCCFren
  eta ESTEKATUTAKO GUNEAREN arduradunaren artean harreman, elkarlan edo mendekotasunik
  dagoenik.\\n\\nOndorioz, BCCFk ez du bere gain hartzen ESTEKATUTAKO GUNEEN gaineko
  inolako erantzukizunik, eta, beraz, ez du hartzen bere gain haien funtzionamenduaren,
  haietan jasotako eduki eta zerbitzuen eta ESTEKATUTAKO GUNE horietan barne hartutako
  esteken gaineko erantzukizunik.\\n\\nERABILTZAILEAK jakiten batu ESTEKATUTAKO GUNE
  bateko edukiak, zerbitzuak edo bestelako edozein jarduera legez kanpokoak edo desegokiak
  direla, BCCFri berehala jakinarazi beharko dio, hala badagokio, egokitzat jotzen
  dituen neurriak har ditzan.\\n\\nHiperestekak\\n\\nBeste gune edo web-orri batzuetan
  hipertestuetarako loturak (hiperestekak) egitea baimentzen da, https://goe.bculinary.com/
  webgunearen hasierako orrira zuzenduta baldin badaude, edo, hala badagokio, WEBGUNEAREN
  barruko beste edozein orritara (deep link) zuzenduta baldin badaude, eta orri horiek
  leiho oso batean agertzen baldin badira, dagozkien URL helbideekin, WEBGUNERAKO
  hiperesteka jartzearen ondoriozko edozein erantzukizun bere gain hartuta.\\n\\nHiperesteka
  agertzen den webgune edo web-orrian ezingo da inola ere adierazi BCCFk hiperesteka
  hori jartzeko baimena eman duenik, BCCFk idatzizko berariazko baimenik eman ez badu.\\n\\nBere
  webgunean edo web-orrian hiperesteka jarri duen hirugarrenak BCCFren marka, izena,
  izen komertziala, errotulua, logotipoa edo BCCFren titulartasunekoa eta WEBGUNEAREN
  ingurukoa den beste edozein elementu identifikagarri barne hartu nahi baldin badu,
  BCCFren aldez aurretiko baimena beharko du, berariazkoa eta idatzizkoa.\\n\\nAurretik
  esandako guztiaren kalterik gabe, https://goe.bculinary.com/ webguneko web-orri
  bat BCCFrena ez den beste webgune bateko leihoan framing teknikaren bidez agertzea
  erabat debekatuta dago, BCCFren berariazko baimena izan ezean.\\n\\nHalaber, https://goe.bculinary.com/
  webgunearen bidez zabaldutako edozein eduki WEBGUNEKOA ez den beste webgune edo
  web-orri batean in line linking teknikaren bidez agertzea ere guztiz debekatuta
  dago, BCCFren berariazko baimena eduki ezean.\\n\\nAurretik adierazitako baldintzak
  betez hiperesteka bat jartzeak ez du inola ere esan nahi BCCFren eta hiperesteka
  agertzen den webgunearen edo web-orriaren jabearen artean harremanik dagoenik, ezta
  BCCFk haren edukiak eta zerbitzuak onartu edo ontzat ematen dituenik ere.\\n\\nEdozein
  kasutan, BCCFk WEBGUNERAKO edozein hiperesteka edozein unetan debekatzeko edo baliogabe
  uzteko eskubidea izango du, bereziki hiperesteka agertzen den webguneko edo web-orriko
  jarduera eta edukiak legez kanpokoak baldin badira.\\n\\nPRIBATUTASUN-POLITIKA.
  DATU PERTSONALEN BABESA\\n\\nERABILTZAILEAK esteka 1 honetan dauka BCCFko datu pertsonalen
