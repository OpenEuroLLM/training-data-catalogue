  / SUGERENCIAS:\"", "\"BIZKAIKO TUTORETZA ERAKUNDEA\\nINSTITUTO TUTELAR DE BIZKAIA\\n\\nAurrekontuak
  eta Legea betetzeari buruzko Txostena\\n\\nInforme de Cumplimiento Presupuestario
  y de la Legalidad\\n\\n- 2015eko abenduaren 31 -\\n- 31 de diciembre de 2015 -\\n\\nBIZKAIAKO
  FORU ALDUNDIA\\nOgasun eta Finantza Saila\\nFinantza, Aurrekontu eta Ondarearen
  Zuzendaritza Nagusia\\n\\nGaia: BIZKAIKO TUTORETZA ERAKUNDEA\\n\\nAurrekontuen eta
  Legeen Betetzeari buruzko txostenak\\n\\nBIZKAIKO TUTORETZA ERAKUNDEA-ren urteko
  kontuak ikuskatu ditugu 2015eko abenduaren 31n. Ikuskaritza txostenak 2016ko martxoaren
  21an igorri dugu. Txosten horretan gure iritzi profesionala eman dugu urteko kontu
  honei buruz.\\n\\nAipatutako ikerketa horretan, 2015eko abenduaren 31n amaitzen
  den ekitaldian Erakundeak nola bete dituen ustiaketa, kapital eta finantzazio-zorraren
  aurrekontuak ebaluatu dugu. Hori guztia egiteko kontabilitate erregistroak eta beste
  zenbait dokumentu erabili ditugu proba gisa, bai eta egoera bakoitzean beharrezkozat
  jo oltugun ikuskaritzako gainontzeko prozedurak.\\n\\nEgindako ikuskaritzagaz ondorioztatzen
  da Erakundeak 2015eko abenduaren 31n bukatzen den urteko ekitaldian ez duela gainditu
  aurrekontu eremuan ezarritako zifrak, batez ere, aplikagarri zaion Foru Dekretu
  Arauemailea 5/2013, abenduaren 3koa, Aurrekontuei buruzko abenduaren 29ko 5/2006
  Foru Arauaren testu bategina onartzentuenaren 83.2) artikuluaren barnean.\\n\\nGure
  uste profesionalaren arabera, eta txosten honen edukian adierazi dugun moduan, ez
  dugu BIZKAIKO TUTORETZA ERAKUNDEA-ren aurrekontuei buruzko legeetan eragin nabarmena
  duen alderdirik topatu.\\n\\nJarraian BIZKAIKO TUTORETZA ERAKUNDEA-ren 2015eko ekitaldian
  ustiaketa eta kapitalaren aurrekontuak gauzatzeko mailari buruzko iradokizunak laburbiltzen
  ditugu, bai eta aurrekontuaren eremuan legeen betetze-mailari buruzkoak ere.\\n\\nAdeitasunez,\\n\\nDIPUTACI\u00d3N
  FORAL DE BIZKAIA\\nAl Departamento de Hacienda y Finanzas\\nDirecci\u00f3n General
  de Finanzas, Presupuestos y Patrimonio\\n\\nAsunto: INSTITUTO TUTELAR DE BIZKAIA\\n\\nInforme
  de Cumplimiento Presupuestario y de la legalidad\\n\\nHemos auditado las cuentas
  anuales de INSTITUTO TUTELAR DE BIZKAIA al 31 de diciembre de 2015, habiendo emitido
  nuestro informe de auditor\u00eda con fecha 21 de marzo de 2016 en el que expresamos
  nuestra opini\u00f3n profesional sobre las mencionadas cuentas anuales.\\n\\nEn
  el contexto del referido examen hemos evaluado el grado de cumplimiento de los presupuestos
  de explotaci\u00f3n, capital y endeudamiento financiero para el ejercicio anual
  terminado el 31 de diciembre de 2015, mediante las pruebas sobre registros de contabilidad
  y otros documentos, y dem\u00e1s procedimientos de auditor\u00eda que se han considerado
  necesarios en cada circunstancia.\\n\\nDel trabajo realizado se ha puesto de manifiesto
  que el Instituto ha cumplido con las limitaciones presupuestarias establecidas para
  el ejercicio anual terminado al 31 de diciembre de 2015, de conformidad con el art\u00edculo
  83.2) del Decreto Foral Normativo 5/2013, de 3 de diciembre, por el que se aprueba
  el texto refundido de la Norma Foral 5/2006 General Presupuestaria del Territorio
  Hist\u00f3rico de Bizkaia.\\n\\nEn nuestra opini\u00f3n profesional, tal y como
  se expone en el contenido de este informe no hemos detectado aspectos que afecten
  significativamente al cumplimiento de la legalidad en materia presupuestaria de
  INSTITUTO TUTELAR DE BIZKAIA.\\n\\nA continuaci\u00f3n resumimos nuestros comentarios
  acerca del grado de ejecuci\u00f3n de los presupuestos de capital y de explotaci\u00f3n
  del ejercicio 2015 de INSTITUTO TUTELAR DE BIZKAIA, as\u00ed como del cumplimiento
  de la legalidad en materia presupuestaria.\\n\\nAtentamente,\\n\\nZUBIZARRETA CONSULTING,
  S.L.\\nROAC-en S-0455 zenbakiz inskrirututako sozietatea\\nSociedad inscrita en
  el ROAC-con el n\u00ba S-0455\\n\\nIzpta. / Fdo.: Jon Andoni Legarreta Elguezabal\\n(bazkidea
  / socio)\\n\\nBilbon, 2016ko martxoaren 21ean / Bilbao, a 21 de marzo de 2016\\n\\nBIZKAIKO
  TUTORETZAKO ERAKUNDEA\\n\\nAurrekontuaren Gauzatzea\\n\\nBizkaiko Lurralde Historikoaren
  Batzar Nagusiek 2015erako onetsitako aurrekontuek (abenduaren 19ko 11/2014 Foru
