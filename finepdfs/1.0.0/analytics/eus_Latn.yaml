  Adierazleen bilakaera\\n\\nGaur egun, Jarraipen-sareak 1995.etik erabilitako adierazleen
  bilakaeraren analisia egitea zaila da, aurretiaz azaldu diren arrazoienagatik. 2013.etik
  2018ra erabili izan diren irizpideak homogeneoak dira, baina elementu batzuk neurtzeko
  metodologia aldatu egin zen aurreko urte batzuetan eta ez da atzerak begirako birkalkulurik
  egin. Hala ere, tarteko, kostaldeko eta kontinente-plataformako lagintze-puntuak
  kontuan harturik, Jarraipen-sarea hasi zenetik aldaketak ebaluatzetan saitatu gara.\\n\\n126.96.36.199.
  Uren egoera fisiko-kimikoa\\n\\nJarraipen-sareko lagintze-puntu bakoitzeko uren
  kalitate fisiko-kimikoaren bilakaera, 1995 eta 2018 bitartean, 8. irudian eta 11.
  taulan (Eranskina ikusi) azaltzen da. Gogoan izan behar da parametro fisiko-kimikoak
  (disolbatutako oxigenoa, mantenugaiak, uhertasuna, etab.) aldagai biologikoen euskarri
  direla.\\n\\n8. irudian kostaldeko lagintze-puntu guztiak ingurumen-helburuak betetzen
  dituztela ageri da. Tarteko uretan, lagintze-puntuen %90ak ingurumen-helburuak betetzen
  baditu ere, azken urteotan atzerakada gertatu dela dirudi, lagintze-puntuen %75-80ak
  betetzen baititu orain. Kalitatearen okerragotze hori oxigenoaren bilakaera negatiboari
  zor zaio, batez ere, Nerbioi (barrualdea eta kanpoaldea) eta Oka estuarioetako zenbait
  lagintze-puntutan ez baitira ingurumen-helburuak betetzen oxigenoarentzat. Gainontzeko
  lagintze-puntuek egoera ona dute. Hurrengo urteetan atzerakada hori aldaketa naturalei
  zor zaien edo beste arazo-mota bat zor zaion ikusi behar da, adibidez saneamendu
  eta arazketa-sistemei.\\n\\n8. irudia Euskal Autonomia Erkidegoko tarteko (goian)
  eta kostaldeko uren (behean) kalitate fisiko-kimikoaren bilakaera eta urteko lagintze-puntuen
  kopurua (marra beltza). Urdina: Oso Ona; Berdea: Ona; Horia: Neurrikoza; Laranja:
  Eskasa eta Gorria: Txarra.\\n\\n188.8.131.52. Fitoplanktona\\n\\n12. taulan (Eranskina
  ikusi) eta 9. irudian Jarraipen-sareko lagintze-puntu bakoitzaren eta ur-masa bakoitzaren
  fitoplankton adierazlearen bilakaera azaltzen da 2007-2018 bitarteko (horren aurretik
  klorofila bakarrik aztertzten zen eta, beraz, ezin da fitoplanktonaren egoera balioztatu,
  konposizioa ere behar baita horretarako). Oka barrualdea eta Oiartzun ur-masetan
  fitoplanktonaren egoera ona betetzen ez bada ere, orokorrean, datu-segida laburra
  izanik ere, fitoplanktonaren bilakaera positiboa izan dela ikusten da.\\n\\nGaur
  egun, bilakaera positiboa kostaldeko uretan antzematen da lagintze-puntu guztiak
  ingurumen-helburuak betetzen baitituzte 2007.az gero. Tarteko uretan, berriz, egoera
  ona betetzen duten lagintze-puntuen ehunekoa %80 inguruko da azken urteotan.\\n\\nElementu
  biologiko honek hiri- eta industria-isuriei erantzuten die, eta sistemaren egoera
  trofikoaren adierazletzat hartzen da. Hala, fitoplanktonaren kalitatearen okerragotzea
  mantentugaien isuriei zor izaten zaie; hobekuntza, berriz, saneamendu edo arazketari.\\n\\n9.
  irudia Euskal Autonomia Erkidegoko tarteko (goian) eta kostaldeko (behean) ur-masetako
  fitoplanktonaren bilakaera eta urteko lagintze-puntuen kopurua (marra beltza). Urdina:
  Oso Ona; Berdea: Ona; Horia: Neurrikoa; Laranja: Eskasa eta Gorria: Txarra.\\n\\n184.108.40.206.
  Makroalgak\\n\\n13. taulan (Eranskinak ikusi) eta 10. irudian Jarraipen-sareko makroalgen
  bilakaera erakusten da 2002-2018 bitarterako lagintze-puntu bakoitzean.\\n\\nKasu
  honetan, ezin da lagintze-puntu edo ur-masa bakoitzaren urtez-urteko bilakaera aztertu,
  lagintzeak hiru urtean behin egiten baitira eta ur-masa bakoitzean lauzpabost datu
  baino ez baitaude.\\n\\nOrokorrean tarteko ur-masetako makroalgen kalitatean ez
  da inolako bilakaerarik antzematen. 2002-2007 bitartean, lagintze-puntuen %21-22k
  makroalgen ingurumen-helburuak bete zituen; 2008-2013 bitartean, lagintze-puntuen
  %50ak; eta 2014-2016 bitartean, lagintze-puntuen %23ak soilik. 2017-2019 hirurtekoan
  lagintze-puntu bakar bat ere ez da egoera onean aurkitzen. Hala ere, aipatzeko da,
  irudian ikusten den balioa 2017 eta 2018 urteei soilik dagoekiela, eta 2019ko kanpainak
  oraindik burutu gabe dau dela.\\n\\nKostaldeko ur-masetako makroalgen egoerak hoberantz
  egin duela dirudi, batez ere 2008-2010 hirurtekotik 2017-2019 hirurtekora (nahiz
  eta, azken honetan, 2017ko eta 2018ko datuak soilik egon). Honela, %50etik %80ra
  pasatzen da makroalgen egoera ona betetzan duten lagintze-puntuen ehunekoa.\\n\\n10.
  irudia Euskal Autonomia Erkidegoko tarteko (goian) eta kostaldeko uretako (behean)
  makroalgen kalitatearen bilakaera eta urteko lagintze-puntuen kopurua (marra beltza).
  Urdina: Oso Ona; Berdea: Ona; Horia: Neurrizkoa; Laranja: Eskasa eta Gorria: Txarra.\\n\\nElementu
  biologiko honek, batez ere, hiri eta industrien isurketak bezalako presioei erantzuten
  dienez, sistemaren egoera trofikoaren adierazietzat hartzen da. Honez gain, habitaten
  galeragatik sortzen diren aldaketa morfologikoekin adierazietzat ere hartzen da.
  Horregatik, makroalgen kalitatearen okerragoetza mantentugaiengatik eta dragatze-lanengatik
  izaten da; hobekuntza berriz, saneamenduagatik, arazketagatik edo habitaten leheneratezagatik.\\n\\n220.127.116.11.
  Makroornogabe bentikoak\\n\\n11. irudian eta 14. taulan (Eranskina ikusi) Jarraipen-sareko
  lagintze-puntu bakoitzeko makroornogabe bentikoen bilakaera aztertzen da 1995-2018
  bitartekoan. Orokorrean, eta beste elementu batzuekin gertatzen den bezala, lagintze-puntu
  eta ur-masa batzuen kalitatean hobekuntza antzematen da.\\n\\nKostaldeko uretako
  lagintze-puntuen bilakaera positiboa agerikoa da, azken 10 urteotan lagintze-puntu
  guztiek ingurumen-helburuak betetzen baitituzte. Salbuespen da Getaria-Higer ur-masan
  kokatzen den L-OI20 lagintze-puntua, zeinak egora neurrizkoa baituen 2018an.\\n\\nTarteko
  uretan ere hobekuntza antzematen da: 1995ean lagintze-puntuen %50 gutxienez egora
  onean zegoen, 2007-2018 bitartean %70-80 dagoelarik. 2007an aipatu zen egora txarra
  zuten lagintze-puntuak desagertu baziren ere, berriro ere okerraldiak eman zitezkeela,
  ondorengo urteetan gertatu zen bezala. Hala ere, 2016an arinki hoberantz jo zuen
  egoerak, lagintze-puntuen %84ak ingurumen-helburuak bete zituztelarik. 2017an makroornogabe
  bentikoek egora txarra zuten lagintze-punturik ez zen hauteman eta, 2018an, oso
  aldatutako Oiartzun ur-masan bakarrik hauteman da egora txarra.\\n\\nTarteko uretan
  aipatzekoa da Nerbioi, Oria eta Urola estuarioetan eman den hobekuntza handia. Hala
  ere, badira oraindik ere hobetu behar duten lagintze-puntuak, hala nola: Artibain
  eta Oka barrualdean, besteak beste.\\n\\n11. irudia Euskal Autonomia Erkidegoko
  tarteko (goian) eta kostaldeko urreta (behean) makroomogabe bentikoen kalitatearen
  bilakaera eta urteko lagintze-puntu kopurua (marra beltza). Urdina: Oso Ona; Berdea:
  Ona; Horia: Neurrizkoa; Laranja: Eskasa eta Gorria: Txarra.\\n\\nJarraipen-sarean
  makroomogabe bentikoek hainbat presiori erantzuten diotela frogatu da, bai hiri-
  eta industria-isuriei (materia organikoa, kutsatzaileak, etab.) eta baita presio
  morfol\u00f3gikoei (dragatze-lanak, itsasoari irabazitako eremuak, etab.) ere. Era
  berean, ingurunea leheneratzeko ekintzak egin direnean (isurien desbideratzeak,
  arazketa-lanak, andeatutako habitaten leheneratzea, etab.), elementu biologiko honek
  ingurunearren hobekuntza hautameten du. Presioa oso handia eta epe luzekoa izandean,
  leheneratzeak 15 urte arte behar izan dezake. Aldiz, presioa txikia denean leheneratzea
  2-3 urtetan edo lehenago ematen da.\\n\\n18.104.22.168. Arrainak\\n\\n15. taulan
  (Eranskina ikusi) eta 12. irudian arrainen adierazleen bilakaera islatzen da 1995-2018
  bitarterako. Jarraipen-sarean, 2002an hasi ziren arrainen adierazleari buruzko lanak.
  Datu-segida luzeagoak edo datu kopuru handiagoa lantzeko asmoz, beste informazio-iturri
  batzuetako datuak ere hartu dira aintzat (Bilbao-Bizkaia Ur Partzuergoa, Gipuzkoako
  Foru Aldundia). Honen ondorioz, urteko lagintze-puntu kopurua aldakorra da (6-21).
  Aldiz, hiru urtean behin lagindutako puntuak 32-33 dira, azken hirurtekoan izan
  ezik, hau osatzeko urtebete falta baita.\\n\\n12. irudia Euskal Autonomia Erkidegoko
  tarteko uretako arrainen kalitatearen biakaera eta urteko lagintze-puntu kopurua
  (marra beltza). Urdina: Oso Ona; Berdea: Ona; Horia: Neurriazkoa; Laranja: Eskasa
  eta Gorria: Txarra. Goian, Jarraipen-sareko datuak, Bilbao-Bizkaia Ur Partzuergokoak
  eta Gipuzkoako Foru Aldundiakoak elkartuta. Azpian, Jarraipen-sareko datuak bakarrik.\\n\\nOrokorrean,
  aipatutakoa kontuan hartuz, arrainen kalitatearen bilakaeran etengabeko hobekuntza
  ikusten da. 1995ean lagintze-puntu bakar batek ere ez zuen arrainen egoera onik
  azaltzen; 2013-2018an, berriz, %75-100ek betetzen du. Hala ere, 2009-2013 bitartean
  egoera \u201cTxarra\u201d eta \u201cEskasa\u201d zuten lagintze-puntuen kopurua
  igo egin zen, laginen %20 izateraino. Egoera txarreko edo eskaseko kasu horiek dragatze-lanei
  zor izan zitzaizkien batik bat. Hala ere, kasuren batean (Lean, adibidez), ezezaguna
  da egoera okertzearen arrazoa. Beharbada, Lean uraren kalitate fisiko-kimikoaren
  hobekuntza izan liteke egoera honen eragile. Izen ere, uraren uhertasuna gutxitzeak,
  arrainek, egunez, babeslekua bilatzea eragin lezake eta, ondorioz, arrantzatzea
  zaildu lezake.\\n\\nDatu-segida luzeak daudeenak (Bilbao-Bizkaia Partzuergokoak
  dituenaren modukoak; Eranskinako 15. taula) nabarmenagoa da joera orokorra hoberanzkoa
  dela, bereziki Nerbioin eta Butroen.\\n\\n22.214.171.124. Egoera ekologikoa\\n\\nAztertutako
  elementuetan, lagintze-puntu kopuruan eta elementu batzuk ebaluatzeko metodologian
  egon diren aldaketak direla eta, 1995-2018 eperako egoera ekologiko orokorraren
  integrazioa egitea zaila da. Gogoan izan behar da 2011tik aurrera direla homogeneoak
  irizpideak.\\n\\n13. irudian eta 16. taulan (eranskinak ikusi) lagintze-puntu bakoitzeko
  egoera ekologikoaren bilakaera azaltzen da UEZak eskatzen duen BKDK printzipioa
  jarraituz. Aurreko txostenetan, 2011ra arte, Borja et al. (2004, 2009) lanetan proposatutako
  metodoaren arabera, azertutako elementuak haztatzaz egiten zen egoera ekologikoaren
  integrazioa.\\n\\n13. irudia: Euskal Autonomia Erkidegoko tarteko (goian) eta kostaldeko
  (behean) egoera ekologikoaren bilakaera \u201cbat\u201d kanpoan, denak kanpoan\u201d
  (BKDK) printzipioa aplikatuz eta urteko lagintze-puntuak kopurua (marra beltza).
  Urdina: Oso Ona (OO); Berdea: Ona (O); Horia: Neurmizkoa (N); Laranja: Eskasa (E)
  eta Gorria: Txarra (T).\\n\\nBKDK printzipioa aplikatzean ez da bilakaera argirik
  ikusten, Nerbioi kanpoaldeko edo Urumeako lagintze-puntu batzuetan ezik. Hori gertatzen
  da elementuren batek egoera ona baino okerragoa azaltzeko aukera handia dagoelako
  eta, beraz, lagintze-puntuak egoera onera heltzen ez direlako.\\n\\n1995-2018. datu-segidan
  elementu guztiak neurtu ez izanak, alderatzeak eta bilakaeraren azterketa egitea
  zaitzen du. Honek, joerak oso argiak ez izatea dakar.\\n\\n2002-2018 bitartean,
  berriz, lagintze-puntuen kopurua egonkorra denez eta aztertzen diren elementuak
  berdinak direnez hurrengoa ondoriozta daiteke: kalitate kategoria ezberdinak azaltzen
  dituzten lagintze-puntuen ehunekoa egonkorra da, bai tarteko uretan eta baita kostaldekoetan
  ere (13. irudia).\\n\\n1995-2001 bitarteko diagnosiari dagokionez, lagintze-puntuen
  kopurua handitzearekin bat, kalitate orokorra jaisten dela dirudi. Hau ez da harritzekoa,
  lagintze-puntu gehiago erabiltzean, punturen batek ingurumen-helburuak ez lortzeko
  aukera gehiago baitago; gainera, gehitu ziren lagintze-puntu gehienak tarteko uren
  barrualdean kokatzen ziren, gehienetan kalitate okerragoa zuten tokietan.\\n\\n126.96.36.199.
  Egoera kimikoa\\n\\n17. taulan (Eranskineko taula ere ikusi) Jarraipen-sareko lagintze-puntuetako
  egoera kimikoaren bilakaera aurkeztu da 2002-2018 bitarterako.\\n\\n14. irudia Euskal
  Autonomia Erkidegoko tarteko (goian) eta kostaldeko (behean) uren egoera kimikoaren
  bilakaera eta urteko lagintze-puntuen kopurua (marra beltza). Urdina: Egoera ona
  eta Gorria: Ez da ona.\\n\\nTarteko uren lagintze-puntuen %55-85ek du egoera kimiko
  ona. Aldiz, kostaldeko lagintze-puntuen %80-100ek du egoera kimiko ona, lehenago
  esan den bezala, 2011 urtean izan ezik.\\n\\nNerbioi, Oiartzun eta Bidasoan dagoen
  HCH eta TBT kutsadura kronikoa kenduta (TBTaren kasuan, mugan, IKArI dagokion kontzentrazioa
  baxua baita), gainontzeko kasuetan, modu ez errepikakorrea gainditzen du kutsatzaileren
  batek IKA (adib. kadmioak, nikelak, berunak edo PAH konposatuetako batek). Horrek
  berriro adierazten du BKDK printzipioari zor zaiola egoera txarrein handi batean,
  gehiegiz zehatzen baitu egoera.\\n\\n188.8.131.52. Egoera globala\\n\\n15. irudian
  (ikusi Eranskinean dagoen 18. taula) Jarraipen-sareko lagintze-puntu bakoitzaren
  egoera globalaren bilakaera azaltzen da 2002-2018 bitarterako.\\n\\n15. irudia:
  Euskal Autonomia Erkidegoko tarteko (goian) eta kostaldeko (behean) uren egoera
  globalaren bilakaera eta urteko lagintze-puntuen kopurua (marra beltza). Urdina:
  Egoera ona eta Gorria: Ona baino okerrago.\\n\\n2002an, tarteko ur-masen lagintze-puntuen
  %3ak besterik ez zuen egoera orokor ona. Hurrengo urteetan, %6-40ra igotzen joan
  zen ehunekoa. Hala ere, azken lau urteotan egoera ona lagintze-puntuen %34-%50ek
  duten arren, ez da inolako joera argirik antzematen.\\n\\nKostaldeko lagintze-puntuekin
  antzeko zerbait gertatzen da, baina egoera orokor ona duten kasuen kopurua handiagoa
  da: 2002an lagintze-puntuen %20ak zuen egoera ona; 2003-2009 bitartean, %75 inguruk;
  eta, 2011n ezik, azken urteotan %90ek du egoera ona.\\n\\nUr-masen kasuan esan den
  bezala, egoera ekologikoari eta egoera kimikoari aplikatzen zaien BKDK printzipioak
  azaltzen du, neurri handi batean, ona baino okerragoa izatea egoera. Kontuan izanik
  egoera ekologiko eta egoera kimikoaren artean egoerarik okerrena hartzen dela aintzat,
  ez da harritzeko egoera ona ez-betetzearren horrenbeste kasu hautematea.\\n\\nEgoera
  globala kalkulatzeko prozedura horrek EAEko tarteko eta kostaldeko ur-masen ingurumen
  baldintzak izan beharko lukeutenak baino okerragoak direla pentsaraztea dakar. Baina
  hori ez da horrela. Borja et al. (2016) lanean, Jarraipen-sarea 1995-2015 bitartean
  aztertutako aldagaien bilakaeraik ikertu ziren, matrize eta elementu bakoitzarentzat
  zenbat hoberezko edo okerreranzko joera esanguratsu\\n\\nzeuden zehazteko. Guztira
  179 aldagai aztertzen dira Jarraipen-sarean (57 uretan, 54 sedimentuetan, 50 biotan,
  2 fitoplanktonean, 4 makro-algetan, 7 makroornogabe bentikoetan eta 5 arrainetan).
  Aldagaiak aukeratzeko irizpideak ondokoak izan ziren: datu-segidak gutxiez zazpi
  urtekoak izatea eta detekzio-mugatik beherako balioak %33 baino altuagoak ez izatea.
  Baldintza horiek kontuan harturik, 83 aldagai aztertu ziren, zeinetatik: 18 uretan
  ziren; 27, sedimentuetan; 26, biotan; 2, fitoplanktonean; 0, makro-algetan; 5, makroornogabe
  bentikoetan; eta 5, arrainetan. Guztira, 3247 serie aztertu ziren (aldagaiak x lagintze-puntuak
  x marearen egoera, hala zegokionean).\\n\\nUr-laginetan aldagai guztiak kalitatearen
  joeran hobekuntza esanguratsuak (p<0,05) azaldu zituzten. Aldagai guztiak artean
  fosforoaren guztizkoa, karbono organikoaren guztizkoa, pH-a, nikela, oxigenoaren
  asetasuna, uhertasuna, nitritoa eta fosfatoa izan ziren hobekuntza handienak zituztenak
  (datu-segiden %40 baino gehiagotan).\\n\\nSedimentuetan, 25 aldagaiak zituzten hobekuntzak
  kalitatean. Hobekuntza horiek, batez ere, ondoko aldagai hauetan izan ziren nabarmenak:
  materia organikoa (datu-segiden %60 baino gehiagotan), zinka, erredox potentziala
  eta perilenoa. Hala ere, badira nolabaiteko okerragotzea azaltzen duten 20 aldagai
  ere.\\n\\nBiotan, ez dago okerragorantz jotzen duen aldagairik. Are gehiago, 16
  aldagaiak hoberanzko joera aurkezten dute, hala nola: beruna, nikela, gorotz-estreptokokoak,
  zinka eta kobrea, besteak beste, datu-segiden %40 baino gehiagotan hobekuntza dutenak.\\n\\nElementu
  biologikoetan, fitoplanktonaren bi aldagaietan, okerrarako kasu gehiago antzematen
  dira (%38-58) hobetzeak baino, hobekuntza gehien detektatzen dituen aldagaiak klorofila
  delarik. Makroornogabe bentikoetan, M-AMBI da aldaketei hoberen erantzuten dien
  aldagaiak (datu-segiden %40 baino gehiagotan), ondoren aberastasuna (%30) eta, azkenik,
  dibertsitatea doazelarik. Arrainetan, bost aldagaiak azaldu zituzten kalitatearen
  hobekuntzak (datu-segiden %28-36).\\n\\nBorja et al. (2016) lanaren arabera, denboran
  zehar kalitatea hobetzeko joera erakusten duten ur-masa gehienak saneamendua ezarri
  zaizkienak dira. Aldiz, saneamendua ez duten ur-masetan edo giza-presioaren beherakada
  arina izan dutenetan, okerragotzerako joera erakusten duten aldagaiak ingurumen-faktoreen
  edo faktore klimatikoen pean daude eta gazitasunaren aldaketei estuki lotuta daude
  (hala nola, silikatoa, esekiduran dauden solidooak edo nitrotoa).\\n\\n3.\\n\\nOndorioak\\n\\nAzpimarratzekoa
  da, 2018ko kanpainan, badirela ebaluazio-sistemak eta egoeraren jarraipen-programak,
  ebaluazioa era homogeneoan, eta azaleko uren egoeraren jarraipenerako eta ebaluaziorako
  irizpideak eta ingurumen-kalitateko arauak ezartzen dituen irailak 11ko 817/2015
  Errege-Dekretuaren irizpideak jarraituz egitea ahalbidetzen dutenak.\\n\\n2018an,
  aztertu diren 18 ur-masetatik seitan egoera ekologikoa ona baino okerragoa da (Oka
  barrualdea egoera txarrean dago, eta Barbadun, Nerbioi kanpoaldea, Lea, Artibai
  eta Oiartzun egoera neurrizkoan). Ur-masa horietan gabeziak daude saneamenduan (Oka)
  edo degradazio-maila altuak izan dituztelako eta, ez dira oraindik egoera onera
  heldu (Nerbioi, Artibai, Oiartzun, etab.). Ez-betetzearrainei, fitoplanktonari eta
  ornogabe bentikoei zor zaizkie, nagusiki.\\n\\nBestalde, 12 ur-masa daude egoera
  ekologiko onean edo oso onean 2018an (Nerbioi barrualdea, Butroe, Oka kanpoaldea,
  Deba, Urola, Oria, Urumea, Bidasoa, Kantabria-Matxitxako, Matxitxako-Getaria, Getaria-Higer
  eta Monpas-Pasaia). Ur-masa horiek iraganean ez dute arazo larririk jasan (kostaldekoak)
  edota saneamendua osatzen joan den heinean hobera egin dute.\\n\\nEbaluazio kimikoari
  dagokionez, 2018an, bi ur-masek (Nerbioi barrualdea eta kanpoaldea) ez dute egoera
  kimiko onik. Ur-masa horiek industria gehien, meatzaritza historikoa edo industrien
  arroak, portuak (hau da, zenbait metalez eta konposatu organikoz era kronikoan kutsatuak)
  dituztenak dira.\\n\\nEgoera ekologikoa eta kimikoa betetzeko edo ez betetzeko,
  \u201cbat kanpoan, denak kanpoan\u201d printzipioa jarraitzerakoan, aipatu behar
  da zenbat eta aldagai kimiko gehiago erabili, egoera okerragoa hautemateko orduan
  eta arrisku gehiago dagoela (aldagairen batek egoera ona ez lortzeko arriskua biderkatzen
  da). Hala ere, 2018an egoera kimikoa onik ez dagoen kasuetan kutsadura kroniko batengatik
  izan da eta ez zenbait substantziak ingurumen-kalitateko arauak gainditzeagatik.\\n\\nSegida
  historikoan egoera globalak izan duen bilakaerari dagokionez, 2013-2018 aldia aztertu
  da soilik, metodologian gauzatutako aldaketek jarraipen osorako ebaluazioa modu
  berean egitea ez baitute ahalbidetzen. 2018an jarraitu diren irizpideak denbora-tarte
  osora hedatu dira, ebaluazioa homogeneoa izan dadin. Denboraldi horretan jarraipen-programa
  egonkorra egin izanak, joeren analisia egitea ahalbidetu du.\\n\\n- Aztertutako
  denboraldian, kostaldeko ur-masek egoera ekologiko ona edo oso ona dute orokorrean.
  Aldiz, tarteko ur-masek ez-betetze maila handia dute, nahiz eta azpimarratzekoa
  den Butroe, Deba eta Urumeak egoera ekologiko ona dutela aztertz diren sei urteetan.\\n\\n-
  \u201cBat kanpoan, denak kanpoan\u201d printzipioa jarraitzeak, hoberanzko joera
  arin bakar bat hautematea\\n\\ndakar. Hala, egoera global ona (egoera ekologikoa
  eta kimikoaren artetik okerrena) lagintze-puntuen %3-50ean erdiesten da tarteko
  uretan, eta %17-100ena kostaldean.\\n\\nGure diagnostikoaren arabera, Euskal Herriko
  tarteko eta kostaldeko ur-masek hobekuntza nabarmena izan dute 1995 eta 2018 artean,
  eta hala erakusten dute aztertu diren aldagai, elementu biologikoa eta konposatu
  kimiko anitzek. Hobekuntza hori arroetan, estuarioetan eta kostaldean abian jarri
  diren saneamendu neurriei esker gertatu da. Hala ere, badira oraindik ur-masak saneamendua
  osaturik ez dutenak eta, batzuetan, egoera ona baino okerragoa hautematea eragiten
  du honek. Egoera onik ez duten gainontzeko ur-masetan kutsadura kronikoagatik izan
  da (adib., Nerbioi, Oiartzun), eta neurriak hartu beharko dira, edo ingurumen-helburuak
  ez dira bete.\\n\\nBorja, A., 2005. The European water framework directive: A challenge
