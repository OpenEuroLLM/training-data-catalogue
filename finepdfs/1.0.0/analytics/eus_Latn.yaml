  ordinaria, 1\u00aa convocatoria.\\n\\nTRATATZEKO GAIAK:\\n\\nASUNTOS A TRATAR:\\n\\n1.-
  AZKENEKO AKTA ONARTZEA.-\\n\\n2009ko uztailaren 23an egindako bileraren akta ikusirik,
  aho batez, ONARTU DA.\\n\\n2.- TABLAJEROBAITAN (291. LUR-ZATIAN) UDAL PLAN OROKORRA
  ALDAKETA XEHEKATUA EGITEKO HASIERAKO ONESPENA EZ ONARTZEA: PROMOCIONES TABLAJEROBAITA
  SL\\n\\nIdazkariak espediente hau azaldu ondoren, aho batez, legeak eskatutako gehiengo
  osoa beterik, honako erabakia hartu dute:\\n\\n1.- APROBACI\u00d3N ACTA  SESI\u00d3N
  ANTERIOR.-\\n\\nVista el acta de la sesi\u00f3n celebrada el d\u00eda 23 de julio
  de 2009, por unanimidad SE APRUEBA\\n\\n2.- DESESTIMACI\u00d3N APROBACI\u00d3N INICIAL
  MODIFICACI\u00d3N PORMENORIZADA DEL PLAN GENERAL MUNICIPAL EN TABLAJEROBAITA (P.
  291): PROMOCIONES TABLAJEROBAITA S.L.\\n\\nTras la explicaci\u00f3n del expediente
  por la secretaria, por unanimidad, que representa la mayor\u00eda legalmente exigida,
  se adopta el siguiente acuerdo:\\n\\nIkusirik, Tablajerobaita eraikian (291. lurzatian)
  Udal Plan Orokorraren aldaketa xehekatua egiteko eskaera, PROMOCIONES TABLAJEROBAITA
  S.L.k sustatua.\\n\\nDokumentazioa: 9 etxebizitza eta 13 garaje berritzeko proiektua
  eta Berako Udal Plan Orokorraren Aldaketa Xehekatua, Juan M. Erice Zunzarren arkitektoak
  eginak eta 2008ko irailaren 22an eta  2009ko martxoaren 11n, hurrenez hurren, Arkitektoen
  Elkargoak ikus-onetsiak.\\n\\nIkusirik, horri buruz udal arkitektoak eta Idazkaritzak
  eginiko txostenak, 2009ko abuztuaren 4 eta 11koak.\\n\\nKontuan hartuz, aldatu nahi
  den eraikia katalogatua dagoela eta Udalak ez duela egokia ikusten hori aldatu,
  edo eraikia ordezkatu eta orain dauden lerrokadurak kanbiatu.\\n\\nHirigintza eta
  Lurraldearen Antolamenduari buruzko 35/02 Foru Legearen 74. artikuluarekin bat etorriz.\\n\\nGehiengo
  osoz, ,ERABAKI DA:\\n\\n1) PROMOCIONES TABLAJEROBAITA S.L.-k aurkeztutako Tablajerobaita
  eraikian (291. lur-zatian dagoena) Udal Plan Orokorraren aldaketa xehekatuaren hasiera
  bateko onespena ez onartzea lehen emandako arrazoiengatik.\\n2) Erabaki hau interesatuari
  bidaltzea.\\n\\n3.- LUR EZ URBANIZAGARRIAN UDAL PLAN OROKORRAREN  ALDAKETA EGITURATZAILEA
  BEHIN BEHINEKOZ ONESTEA.\\n\\nIdazkariak espedientea azaldu du eta zinegotzi guztien  aldeko
  botoarekin, Alkatearena ezik abstenitu delako espedientean\\n\\nVista solicitud
  de modificaci\u00f3n pormenorizada del Plan General Municipal, en el edificio de
  Tablajerobaita (parcela 291), promovido por PROMOCIONES TABLAJEROBAITA S.L.\\n\\nDocumentaci\u00f3n:
  Proyecto de rehabilitaci\u00f3n de 9 viviendas y 13 garajes y Modificaci\u00f3n
  Pormenorizada del Plan Municipal de Bera, redactados por el arquitecto Juan M. Erice
  Zunzarren y visados por el Colegio de Arquitectos el 22 de septiembre de 2008 y
  11 de marzo de 2009, respectivamente.\\n\\nVistos informes realizados por el arquitecto
  municipal y Secretar\u00eda al respecto, de fechas 4 y 11 de agosto de 2009.\\n\\nTeniendo
  en cuenta que el edificio que se pretende modificar est\u00e1 catalogado y el Ayuntamiento
  no estima adecuada su descatalogaci\u00f3n ni su sustituci\u00f3n ni la modificaci\u00f3n
  de las alineaciones actuales.\\n\\nDe conformidad con el art\u00edculo 74 de la
  Ley Foral 35/02 de Ordenaci\u00f3n del Territorio y Urbanismo.\\n\\nPor mayor\u00eda
  absoluta, SE ACUERDA:\\n\\n1) No aprobar inicialmente la modificaci\u00f3n pormenorizada
  del Plan General Municipal en el edificio Tablajerobaita (parcela 291) presentado
  por PROMOCIONES TABLAJEROBAITA S.L., por las razones antes expresadas.\\n2) Remitir
  este acuerdo a la interesada.\\n\\nAPROBACI\u00d3N PROVISIONAL DE MODIFICACI\u00d3N
  ESTRUCTURANTE DEL PLAN GENERAL MUNICIPAL EN SUELO NO URBANIZABLE.\\n\\nLa secretaria
  explica los pormenores del expediente y con el voto a favor de todos los concejales
  salvo el del Alcalde que se abstiene interesatua baita., legeak eskatutako gehiengo
  osoa beta izanik, honako erabakia hartu dute:\\n\\nIkusirik, Lur ez urbanizagarrian
  Udal Plan Orokorraren aldaketa egituratzailea egiteko espedientea.\\n\\nProiektuak:\\n\\n-
  Hasiera batez onetsia: Jabier Lekuona Errandonea arkitektoak eta Felipe Saragueta
  Irazoki abokatuak egina, 2008ko urtarrilaren 31koa\\n- Behin behinekoz onespenerako:
  Xabier Lopez de Uralde arkitektoak egina, 2009ko otsailaren 3koa\\n\\n2008ko otsailaren
  21ean Udalbatzak espediente hau hasiera batez onartu zuen.\\n\\nHasiera bateko onespenaren
  ondoren jendaurreko epean alegazio bat aurkeztu zen.\\n\\n\\\"Confederaci\u00f3n
  Hidrogr\u00e1fica del Cant\u00e1brico (lehen, del Norte)\\\" delakoak aldeko txostena,
  (A/31/02526), eman zuen.\\n\\nNafarroako Gobernuaren Hirigintza eta Lurraldearen
  Antolamendu Zerbitzuak emandako txostenak, 2008ko maiatzaren 12koak eta horrekin
  batera bidalitakoak, Landa Garapeneko eta Ingurumenerako Departamentuaren Oihanak
  Kudeatzeko Atalarena 2008ko maiatzaren 13koak, hasiera batez onartutako proiektuari
  zenbat aldaketa egin dizkioten.\\n\\nHori dela eta, 2009ko martxoaren 24an Udalak
  egindako osoko bilkuran, aurkeztutako alegazioa onetsi eta Lur ez urbanizagarrian
  Udal Plan Orokorraren aldaketa, antolamendu egituratzaileko determinazioena,  berriro
  jendaurrean jartzea erabaki zuen.\\n\\npor ser interesado en el expediente, con
  el qu\u00f3rum de la mayor\u00eda absoluta exigido legalmente, se adopta el siguiente
  acuerdo:\\n\\nVisto proyecto de  modificaci\u00f3n de determinaciones de ordenaci\u00f3n
  estructurante en el Suelo no urbanizable del Plan General Municipal.\\n\\nProyectos:\\n\\n-
  Aprobaci\u00f3n inicial: redactado por el arquitecto Jabier Lekuona Errandonea y
  el abogado Felipe Saragueta Irazoki de fecha 31 de enero de 2008.\\n- Para aprobaci\u00f3n
  provisional: Redactado por el arquitecto Xabier L\u00f3pez de Uralde de fecha 3
  de febrero de 2009.\\n\\nCon fecha 21 de febrero de 2008 el Pleno aprob\u00f3 inicialmente
  este expediente.\\n\\nEn el plazo de exposici\u00f3n p\u00fablica posterior a la
  aprobaci\u00f3n inicial se present\u00f3 una alegaci\u00f3n.\\n\\nLa Confederaci\u00f3n
  Hidrogr\u00e1fica del Cant\u00e1brico (antes, del Norte) ha emitido informe favorable
  (A/31/02526).\\n\\nEl informe emitido por el Servicio de Ordenaci\u00f3n del Territorio
  y Urbanismo de 12 de mayo de 2008 y el que se adjunta a \u00e9ste de la Secci\u00f3n
  de Gesti\u00f3n Forestal del Departamento de Desarrollo Rural y Medio Ambiente de
  13 de mayo de 2008 han introducido diversos cambios al proyecto aprobado inicialmente.\\n\\nPor
  ello, el Pleno en sesi\u00f3n celebrada el 24 de marzo de 2009 aprob\u00f3 la alegaci\u00f3n
  presentada y acord\u00f3 exponer nuevamente al p\u00fablico el proyecto de modificaci\u00f3n
  de las determinaciones estructurantes del Suelo no Urbanizable.\\n\\nJendaurreko
  epe honetan 4 alegazio aurkeztu dira.\\n\\nIkusirik, alegazio hauei buruz udal arkitektoak
  eginiko txostena. 2009ko abuztuaren 17koa.\\n\\nLurraldearen Antolamenduari eta
  Hirigintzari buruzko 35/2002 Foru Legearen 79.2), 70., 71. eta beste artikulu batzuekin
  bat etorriz.\\n\\nGehiengo osoz, ERABAKI DA:\\n\\n1) Lehen aipatutako udal arkitektoak
  abuztuaren 17an eginiko txostena onetsi eta agertzen diren arrazoiengatik alegazioei
  erantzutea. Beraz, Luis Aguirre Aguirrek eta Julian Lekuona Marticorenak aurkeztutako
  alegazioak onartu dira eta Fernando Boan Gonzalek aurkeztutako ez, M\u00aa Concepci\u00f3n
  Ugartemendiarena aldaketa honetan sartua dagoelarik.\\n2) Lur ez urbanizagarrian
  Udal Plan Orokorraren aldaketa, antolamendu egituratzaileko determinazioena, Xabier
  Lopez de Uralde arkitektoak egina eta lehen aipatua, behin behineko onestea, lehen
  onartutako alegazioekin.\\n3) Nafarroako Gobernuko Lurraldearen Antolamendu eta
  Etxebizitza Departamentura behin-betiko onar dezan espediente osoa bidaltzea.\\n4)
  Erabaki  hau dagokien arkitektoaren txostenaren kopiarekin batera bidaltzea alegazio
  aurkeztu dutenei.\\n\\nEn este nuevo plazo de exposici\u00f3n p\u00fablica se han
  presentado 4 alegaciones.\\n\\nVisto el informe del arquitecto municipal sobre dichas
  alegaciones, de 17 de agosto de 2009.\\n\\nDe acuerdo con lo establecido en el art\u00edculo
  79.2), 70, 71 y otros de la Ley Foral 35/2002 de Ordenaci\u00f3n del Territorio
  y Urbanismo.\\n\\nPor mayor\u00eda absoluta, SE ACUERDA:\\n\\n1) Aprobar el informe
  del arquitecto municipal de 17 de agosto, antes citado, y contestar a las alegaciones
  seg\u00fan las razones expresadas en el mismo. Por lo que se aceptan las alegaciones
  presentadas por Luis Aguirre Aguirire y Julian Lekuona Marticorena y no se acepta
  la de Fernando Boan Gonzalez, siendo que la de M\u00aa Concepci\u00f3n Ugartemendia
  est\u00e1 contemplada ya en esta modificaci\u00f3n.\\n2) Aprobar provisionalmente
  la modificaci\u00f3n de las determinaciones de ordenaci\u00f3n estructurante del
  Suelo no Urbanizable del Plan General Municipal, redactada por el arquitecto Xabier
  L\u00f3pez de Uralde, antes rese\u00f1ada con la inclusi\u00f3n de las alegaciones
  aceptadas.\\n3) Remitir el expediente completo al Departamento de Ordenaci\u00f3n
  del Territorio y Vivienda del Gobierno de Navarra para su aprobaci\u00f3n definitiva.\\n4)
  Remitir a los alegantes este acuerdo junto con la copia del informe correspondiente
  del  arquitecto municipal.\\n\\n4.- \\\"SANTA BARBARA\\\", \\\"GONDENDIA- 4.- SUBASTA
  FORESTAL LOTES EN\\n\\nGA\\\" eta \\\"IBARDIN\\\"-go OHIAN-APROBETXAMENDUEN ENKANTEA.\\n\\nIdazkariak
  espedientearen berri eman du eta, aho batez, honako erabaki hartu dute:\\n\\nIkusirik,
  \\\"Santa Barbara\\\", \\\"Gondendiaga\\\" (2) eta \\\"Ibardin\\\" parajeetako oihanaprobetxamenduen
  espedientea.\\n\\n2009ko maiatzaren 20an Udal Batzarrak eginiko bileran oihan-aprobetxamendu
  hauen enkantea hutsik uztea eta % 20 merkeago bigarren enkantea egitea erabaki zen.\\n\\nIkusirik,
  joan den uztailaren 7ko Kontratazio Mahaiaren akta non enkante honetan Donato Larretxea
  eta Maderas Leonet s.l. enpresak onartzea eta behar den dokumentazio administratiboa
  ez aurkezteagatik Berdabio Basogintza s.l. eta Ohian Zerbitzuak s.l. enpresak ez
  onartzea  erabaki zituen.\\n\\nIkusirik, joan den uztailaren 16ko Kontratazio Mahaiaren
  akta, non aprobetxamendu hauen 3. eta 4. loteak Maderas Leonet s.l. enpresari behin
  behinekoz esleitzea eta nahiz 1. nahiz 2. lotea hutsik uztea erabaki zituen.\\n\\nIzanik,
  sexteo-epean ez dela hobekuntza ekonomikorik aurkeztu izan.\\n\\nIzanik, baldintza
  administratiboen pleguaren 10. oinarrian jarritako dokumentazioa Maderas Leonet
  s.l. enpresak aurkeztu duela.\\n\\nERABAKI DA:\\n\\n1) Berdabio Basogintza s.l.
  eta Ohian Zer-\\n\\n\\\"SANTA BARBARA\\\", GONDENDIAGA\\\" e \\\"IBARDIN\\\".\\n\\nLa
  Secretaria informa sobre el expediente y, por unanimidad, adoptan el siguiente acuerdo:\\n\\nVisto
  expediente de aprovechamientos forestales en los parajes de \\\"Santa B\u00e1rbara\\\",
  (2) \\\"Gondendiaga\\\" (2) e \\\"Ibardin\\\".\\n\\nEl Pleno en sesi\u00f3n celebrada
  el 20 de mayo de 2009 acord\u00f3 declarar desierta la venta en subasta p\u00fablica
  de los aprovechamientos forestales antes citados y, realizar una segunda subasta
  con el 20% de rebaja.\\n\\nVista el acta de la Mesa de Contrataci\u00f3n del pasado
  7 de julio en la que se acuerda admitir en la subasta a las empresas Donato Larretxea
  y Maderas Leonet s.l. y no admitir a las empresas Berdabio Basogintza s.l. y Ohian
  Zerbitzuak s.l. por no haber presentado la documentaci\u00f3n administrativa exigida.\\n\\nVista
  el acta de la Mesa de Contrataci\u00f3n del pasado 16 de julio en la que se acuerda
  adjudicar provisionalmente los lotes n\u00ba 3 y 4 de los aprovechamientos forestales
  de esta subasta a la empresa Maderas Leonet s.l. y dejar desiertos los lotes 1 y
  2.\\n\\nSiendo que en el plazo de sexteo no ha sido presentada mejora econ\u00f3mica
  alguna.\\n\\nTeniendo en cuenta que la empresa Maderas Leonet s.l. ha presentado
  la documentaci\u00f3n exigida en la cl\u00e1usula 10 del pliego de condiciones administrativas.\\n\\nSE
  ACUERDA:\\n\\n1) Inadmitir a las empresas Berdabio Basogintza s.l. y Ohian Zerbitzuak
  s.l. por no haber\\n\\nbitzuak s.l. enpresak behar den dokumentazio administratiboa
  ez aurkezteagatik ez onartzea\\n2) 1. eta 2. loteari  dagokionez enkantea hutsik
  uztea.\\n3) Enkante honen 3. eta 4. loteak eskainitako kopuruetan, hau da, 13.000
  eta 20.850 eurotan, (BEZ gabe), MADERAS LEONET S.L. enpresari esleitzea.\\n4) Esleipen
  hau, Nafarroako Gobernuko Biodibertsitatea Babesteko Zerbitzuaren baldintza tekniko
  eta Udalak onartutako baldintza-pleguari jarraikiz izanen da. Baldintza-plegu hauek
  akordio honekin batera bidaliko zaizkio interesatuari.\\n5) Baldintza administratiboen
  11. klausulari jarraikiz esleipen hau jasotzean eskainitako prezioaren % 25a ordaindu
  behar duela esleipendunari adieraztea.\\n6) Era berean, 4. klausularen arabera ohian
  aprobetxamendua hasi baino lehen esleipen-prezioaren %35aren abala aurkeztu behar
  dutela gogoraraztea.\\n7) Erabaki hau Nafarroako Gobernuko Ingurumen Zuzendaritza
  Nagusiko Oihanak Kudeatzeko Atalari, aurkeztutako enpresei eta esleipendunari jakinaraztea.\\n\\n5.-LANKIDETZA-HITZARMENA:
  BERAko GURE TXOKOA ELKARTEA-UDALA\\n\\nJon Abrilek azaldu du Bandarekin sinatutako
  hitzarmena bera dela, lehen sinatutakoari urteroko luzapenarena gehitu zaiola hori
  agertzen ez baizen.\\n\\nHorren ondoren, aho batez, honako erabakia hartu dute:\\n\\npresentado
  la documentaci\u00f3n administrativa exigida.\\n\\n2) Declarar desierta la subasta
  respecto a los lotes 1 y 2.\\n3) Adjudicar a MADERAS LEONET S.L., en las cantidades
  ofertadas de 13.000 y 20.850 euros (sin IVA), los lote n\u00ba 3 y 4 de los aprovechamientos
  forestales de esta subasta.\\n4) Estas adjudicaciones se hacen de acuerdo al pliego
  de condiciones t\u00e9cnicas del Servicio de Conservaci\u00f3n de la Biodiversidad
  del Gobierno de Navarra y al aprobado al efecto por el Ayuntamiento, cuyas copias
  se adjuntar\u00e1n a la notificaci\u00f3n de este acuerdo.\\n5) Comunicar a la empresa
  adjudicataria que de acuerdo con la cl\u00e1usula 11 del pliego de condiciones administrativas
  deber\u00e1 realizar el pago correspondiente al 25% del precio ofertado al recibo
  de esta adjudicaci\u00f3n.\\n6) Igualmente, recordarles que seg\u00fan la cl\u00e1usula
  4 deber\u00e1n presentar aval del 35% del precio de licitaci\u00f3n antes del inicio
  del aprovechamiento.\\n7) Notificar el presente acuerdo a la empresa adjudicataria,
  a las empresas participantes y a la Secci\u00f3n de Gesti\u00f3n Forestal de la
  Direcci\u00f3n General de Medio Ambiente del Gobierno de Navarra.\\n5.- CONVENIO
  DE COLABORACI\u00d3N: ASOCIACI\u00d3N GURE TXOKOA  DE BERAAYUNTAMIENTO\\n\\nJon
  Abril explica que es el mismo convenio que el firmado con la Banda, que se le ha
  a\u00f1adido al anterior la pr\u00f3rroga anual que no contemplaba.\\n\\nSeguidamente,
  por unanimidad, adoptan el siguiente acuerdo:\\n\\nIkusirik, Berako Gure Txokoa
  Elkartea eta Udalaren artean sinatzeko LankidetzaHitzarmenaren testua.\\n\\nERABAKI
  DA:\\n\\n1) Aipatutako komenioa onestea eta Berako Gure Txokoa Elkartearekin sinatzea.\\n2)
  Erabaki hau interesatuari jakinaraztea.\\n\\n6.-LANKIDETZA-HITZARMENA: BERAko ABESBATZA-UDALA\\n\\nHonetan
  lehengo gauza bera denez, aho batez, erabaki hau hartu dute:\\n\\nIkusirik, Berako
  Abesbatza eta Udalaren artean sinatzeko Lankidetza-Hitzarmenaren testua.\\n\\nERABAKI
  DA:\\n\\n1) Aipatutako komenioa onestea eta Berako Abesbatzarekin sinatzea.\\n2)
  Erabaki hau interesatuari jakinaraztea.\\n\\n7.- PIO BAROJAREN LIBURU BILDUMAREN
  DOHAINTZARI BURUZKO UDAL KONPROMISOA.\\n\\nPertsona bat agertu dela Pio Barojaren
  liburuen bilduma Udalari emateko asmoz Alkateak azaldu  eta, segidan,  berak prestatutako
  proposamena hori onartzeko irakurri du.\\n\\nJon Abrilek zera dio:\\n\\nHagitz interesantea
  iruditzen zaio baina konpromisoa hartu baino lehen informazio gehiago eskatu behar
  da. Liburutegian Pio\\n\\nVisto texto del Convenio de Colaboraci\u00f3n entre el
  Ayuntamiento y la Asociaci\u00f3n Gure Txokoa de Bera.\\n\\nSE ACUERDA:\\n\\n1)
  Aprobar el citado convenio y proceder a su firma con la Asociaci\u00f3n Gure Txokoa
  de Bera.\\n2) Notificar este acuerdo a la interesada.\\n\\n6.- CONVENIO DE COLABORACI\u00d3N:
  CORAL  DE BERA-AYUNTAMIENTO\\n\\nComo es el mismo caso que el anterior, por unanimidad,
  adoptan el siguiente acuerdo:\\n\\nVisto texto del Convenio de Colaboraci\u00f3n
  entre el Ayuntamiento y la Coral de Bera.\\n\\nSE ACUERDA:\\n\\n1) Aprobar el citado
  convenio y proceder a su firma con la Coral de Bera.\\n2) Notificar este acuerdo
  a la interesada.\\n\\n7.- COMPROMISO MUNICIPAL SOBRE DONACI\u00d3N DE COLECCI\u00d3N
  DE LIBROS DE PIO BAROJA.\\n\\nEl Alcalde explica que una persona ha ofrecido la
  donaci\u00f3n de una colecci\u00f3n de libros de P\u00edo Baroja y, seguidamente,
  lee la propuesta para su aceptaci\u00f3n.\\n\\nJon Abril manifiesta lo siguiente:\\n\\nLe
  parece muy interesante pero antes de comprometerse se debe pedir m\u00e1s informaci\u00f3n.
  En la biblioteca ya hay una colecci\u00f3n del\\n\\nBarojaren bilduma badago eta,
  ongi baloratzeko gastua eskaintzen duten bildumaren inbentarioa eta liburuen egoera
  jakin behar da.\\n\\nHondatutako liburuak berritze lanari buruz Nafarroako Gobernuaren
  sarean kontsultatzea merkeagoa ateratzen ahal delako.\\n\\nHori dela eta, aho batez,
  honako erabakia hartu dute:\\n\\nUdalari suposatzen ahal zaion gastua jakiteko Pio
  Barojaren liburu bildumari buruz informazio gehiago (inbentarioa, liburuen egoera,
  etabar) eskatzea.\\n\\n8.- E.T.A ERAKUNDEAK BURGOSEN ETA PALMA NOVAN EGINDAKO EKINTZEN
  AINTZINEAN, BERAKO EA, EAJ ETA ARALARREN MOZIOA.-\\n\\nJon Abrilek mozioa irakurri
  ondoren, bozke- ta egin da honako emaitza izanik:\\n\\n5 boto alde: EA, EAJ eta
  ARALAR\\n\\n4 abstentzio: Alkatea eta gainontzekoak.\\n\\nHori dela eta, mozioa
  onartu dute honako testua izan delarik:\\n\\nUztailaren 29 eta 30ean Burgosen eta
  Mallorcan ETAk egindako atentatuen aitzinean, bi hildako eragin zituztenak, EA.
  EAJ eta Aralarrek aurkeztutako mozioa:\\n\\n1.- Bi ekintza armatu horiekiko gure
  gaitzespena eta kondena osoa. Aldi berean gure elkartasuna eta babesa erahildako
  bi pertsonen familiei, hurbilekoei eta lankideei eta baita bi atentatu horietan
  kalteak izan dituzten pertsonei ere.\\n2.- Euskal herritarren zein abertzaleen gehiengoak
  berriz ere aldarrikatu egiten diogu ETAri aldebakarreko eta behinbetiko etena indarkeriaren
  erabileran, inolako baldintzarik edo ordainik gabe.\\n\\nP\u00edo Baroja y para
  valorar bien el gasto que puede suponer se deber\u00eda disponer de un inventario
  y conocer la situaci\u00f3n en que se encuentra la colecci\u00f3n.\\n\\nSobre la
  renovaci\u00f3n de los libros estropeados consultar en la Red del Gobierno de Navarra
  porque saldr\u00eda m\u00e1s econ\u00f3mico.\\n\\nAs\u00ed pues,  por unanimidad,
  adoptan el siguiente acuerdo:\\n\\nSolicitar m\u00e1s informaci\u00f3n sobre la
  colecci\u00f3n de P\u00edo Baroja ofrecida (inventario, situaci\u00f3n de los libros,
  etc.) para poder calcular el gasto que le supondr\u00eda al Ayuntamiento.\\n\\n8.-
  MOCI\u00d3N DE EA, EAJ y ARALAR DE BERA ANTES LOS ATENTADOS DE BURGOS Y PALMA NOVA
  (MALLORCA).-\\n\\nTras la lectura de la moci\u00f3n por Jon Abril se realiza la
  votaci\u00f3n con el siguiente resultado:\\n\\n5 votos a favor: EA, EAJ y ARALAR.\\n\\n4
  abstenciones: el resto de concejales y el alcalde.\\n\\nPor ello, se aprueba la
  moci\u00f3n siendo el texto el siguiente:\\n\\nAnte los dos atentados perpetrados
  por ETA los d\u00edas 29 y 30 de julio en Burgos y en Mallorca, este \u00faltimo
  con el resultado de dos personas asesinadas, moci\u00f3n presentada por los grupos
  municipales de EA, EAJ y Aralar de Bera:\\n\\n1.- Nuestra condena y reprobaci\u00f3n
  sin paliativos de los dos atentados as\u00ed  como la solidaridad y apoyo en primer
  lugar con las familias de las dos personas asesinadas,  as\u00ed como con sus allegados
  y compa\u00f1eros  y con todas las personas afectadas por ambos atentados.\\n2.-
  La mayor\u00eda social y abertzale de Euskal Herria exige una vez m\u00e1s a ETA
  el cese definitivo y unilateral de la violencia, sin ning\u00fan tipo de condicionamientos
  ni\\n\\nHauxe da zalantzarik gabe Euskal Herriko gizartearen gehiengoaren eskakizuna
  eta aldarrikapen hau egitean gogoratu nahi dugu horrelako ekintza eta hilketek ez
  dutela inolako justifikaziorik ez onespenik Euskal Herriaren izenean.\\n\\n3.- ETA
  erakundea sortu zenetik 50 urte bete direnean, gogorarazi behar dugu gizarteak helburu
  politikoetarako bide pol\u00edtiko soilen apustua egin duela. Horregatik indarkeriaren
  erabilera eta bidea eten egin behar da, bertzeak bertze herriaren aginduagatik.\\n\\n9.-
  BANDOAK ETA ALKATEAREN EBAZPENAK.-\\n\\nHonako bando eta Alkatearen ebazpen hauetaz
  jakinen gainean gelditu dira:\\n\\n1) Bandoak: B17, B18 eta B21/2009.\\n2) Ebazpenak:
  2009ko uztailaren 20ko 150. ebazpenetik 2009ko abuztuaren 11ko 165.era arte.\\n\\n\\\"Eskaera
  eta galderak\\\" puntura pasa baino lehen, gai zerrendatik kanpo 2 mozio sartu nahi
  dituela adierazi du Alkateak.\\n\\nHorrela, gai zerrendatik kanpo, premiazko bozketa
  egin ondoren, aho batez, legeak eskatutako gehiengo absolutua betea izanik, honako
  gai hauek tratatu dira:\\n\\n10.- BERAKO UDALAK JASO BERRI DITUEN AGINDU ETA PRESIO
  POLIZIALEI BURUZKO MOZIOA.\\n\\ncontraprestaci\u00f3n a cambio.\\n\\nEsta es la
  exigencia de la mayor\u00eda incontestable de la sociedad vasca, exigencia que hacemos
  para a\u00f1adir que atentados y asesinatos como estos no tienen legitimaci\u00f3n
  alguna en nombre del pueblo vasco.\\n\\n3.-Cuando se cumplen 50 a\u00f1os de la
  existencia de ETA, recordarle que la sociedad ha apostado por la v\u00eda pol\u00edtica
  para el logro de objetivos pol\u00edticos: la v\u00eda de la violencia debe, por
  lo tanto, finalizar, entre otras muchas cuestiones, tambi\u00e9n por mandato social.\\n\\n9.-
  BANDOS Y RESOLUCIONES DE ALCALD\u00cdA.-\\n\\nSe dan por enterados de los siguientes
  bandos y resoluciones de la Alcald\u00eda:\\n\\n1) Bandos: B17, B18 y B21/2009.\\n\\n2)
  Resoluciones: De la resoluci\u00f3n n\u00ba 150 de 20 de julio de 2009 a la n\u00ba
  165 de 11 agosto de 2009.\\n\\nAntes de pasar al punto de \\\"Ruegos y Preguntas\\\",
  el Alcalde indica que quiere presentar dos mociones fuera del orden del d\u00eda.\\n\\nDe
  este modo, fuera del orden del d\u00eda, previa votaci\u00f3n de urgencia, por unanimidad,
  que representa la mayor\u00eda legalmente exigida, se tratan los  siguientes asuntos:\\n\\n10.-
  MOCI\u00d3N SOBRE LA PRESI\u00d3N Y ORDENES POLICIALES RECIBIDAS RECIENTEMENTE POR
  EL AYUNTAMIENTO DE BERA.\\n\\nAlkateak mozioa irakurri du.\\n\\nAlkateak eta beste
  hiru zinegotziek aldeko botoa adierazi dute.\\n\\nJon Abrilek: Egoera kezkagarria
  da, elkartasuna beharrezkoa da eta, nabarduraz nabardura, aurkeztutako planteamenduarekin
  ados dago, beraz, aldeko botoa emanen du.\\n\\nEA eta EAJko zinegotziak abstentzioaren
  aldea gertu dira.\\n\\nEl Alcalde procede a la lectura de la moci\u00f3n.\\n\\nEl
  Alcalde y los otros 3 concejales manifiestan su voto a favor.\\n\\nJon Abril: La
  situaci\u00f3n es preocupante, hay que solidarizarse y, sin entrar en matices, en
  general est\u00e1 de acuerdo con el planteamiento presentado, por lo que vota a
  favor.\\n\\nLos concejales de EA y EAJ manifiestan su abstenci\u00f3n.\\n\\nBeraz,
  5 aldeko boto eta 4 abstentzioekin, aurkeztutako mozioa onartu dute, ondoko testua
  izanik:\\n\\nPor lo que, con 5 votos a favor y 4 abstenciones, se aprueba la moci\u00f3n,
  con el siguiente texto:\\n\\nMOZIOA\\n\\nAzkeneko hilabeteetan Estatu Espainiarrak
  Euskal Preso Politikoen Kolektiboaren aurka abiatu duen oldarraldiak ez du etenik.\\n\\nEuskal
  Herriak urte luzez pairatzen duen gatazka politikoaren isla dira euskal preso politikoak,
  gatazka bizirik dirauela adierazten duen errealitate ukaezina. Euskal Herriko herritarrek
  elkartasuna maiz adierazi diote kolektibo honi, herrietako kaleetan astero adierazpen
  honen ahotsak milaka izanik.\\n\\nAzkeneko asteotan gure herrietako jaietan eta
  tabernetan Espainiako Segurtasun Indarrak burutzen ari diren inkurtsio armatua kezka
  handiz ikusten du Udal honek. Oraingoan Udaletxeak eta alkateak daude jo-mugan.
  Fronte Konstituzionalistaren jazarpena eta bere satelite mediatikoen presioa onartezina
  da.\\n\\nBerako Udalak jaso berri dituen agindu eta presio polizialen aurrean, osoko
  bilkura honek ondorengo akordioak erdiesten ditu:\\n\\nAKORDIOAK\\n\\n1- Espainiako
  Segurtasun Indarrek zein agintari politiko eta judizialek bideratzen duten ekimen
  errepresibo berri honen aurrean gure ezadostasunik irmoena adierazi nahi dugu. Gure
  herrian oldartze honen bidegabekeria jaso duten pertsona, kolektibo zein gune fisikoei
  gure elkartasunik beroena adierazten diegularik.\\n2- Euskal Preso Politikoen Kolektiboaren
  aldeko elkartasun lana gune ofizialetatik ezabatu nahi den gatazkaren errealitate
  bat da. Aldiz, elkartasun adierazpena gatazka politikoaren konponbidearen alde egin
  daitekeen ekarpen handienetakoa delarik.\\n3- Euskal Herri osoko eragile sozial,
  sindikal eta politikoei gatazkaren konponbidearen alde bidea egiten jarraitzeko
  deia luzatzen diegu. Gatazka politikoaren ondorioen erabilera\\n\\n11\\n\\npartidista
  eta arduragabea, gatazka beraren konponbidean aurrera urratsak ematen gainditu daitekeelako
  soilik.\\n\\n4- Euskal preso politikoen senitarteko eta lagunek, haien senideekiko
  elkartasun adierazpen oro ezabatu nahian dabiltzan honetan iragaten ariko diren
  egoeragatik, Udaletxe honek bere hurbiltasuna adierazi nahi die.\\n5- Akordio hau
  zabaltzeari begira eta herritar guztiei zuzenduta, bando bat editatuko du Udaletxe
  honek. Aldi berean, akordio hau Nafar Gobernuko instantzia ezberdinei zein komunikabide
  guztiei helaraziko zaie.\\n\\n11.- ANDONI SARASOLA, ALBERTO MATXAIN ETA AITZOL ETXABURUREN  ATXILOKETEI
  BURUZKO MOZIOA.\\n\\n10.- MOCI\u00d3N SOBRE LAS DETENCIONES DE ANDONI SARASOLA,
  ALBERTO MATXAIN Y AITZOL ETXABURU.\\n\\nAlkateak ondoko mozioa  irakurri du:\\n\\nEl
  Alcalde lee la siguiente moci\u00f3n:\\n\\nAtzoko atxiloketak direla eta behean
  sinatzen dugunok zera adierazi nahi dugu:\\n\\n1.- Garbi utzi nahi dugu atxiloketa
  hauek ez dutela Euskal Herriko gatazka politikoa aterabidean jarriko, alderantziz,
  gatazka bera, areagotu eta modurik gordinenean azaleratzen dute.\\n2.- Gatazka politikoaren
  konponbidea, elkarrizketa eta euskal herritarren hitza eta erabakia errespetatzean
  datzala adierazi nahi dugu.\\n3.- Gure kezka adierazi nahi dugu, atxilotuek jasan
  dezaketen tratuaren aurrean. Ez da ahaztu behar hainbat eta hainbat euskal herritarrek
  tortura eta tratu txarrak jaso izan dituztela.\\n4.- Udal honek, atxiloketa hauek
  salatzeko egingo diren elkarretaratze guztietan parte hartzera deitzen ditu Berako
  herritar guztiak.\\n\\nJon Abrilek: Atxiloketei buruz kezka sortzen zaio jasotzen
  ahal diren tratu txarrengatik, beraz, atxilotuen giza eskubideak errespetatu eta
  bermatu behar diren aldarrikapenarekin baina guztiz ados ez dagoenez mozioaren edukiarekin
  bere aurkako botoa iragarri du.\\n\\nJon Abril: Sobre las detenciones le preocupan
  los malos tratos que puedan sufrir, por ello reclama el respeto y garant\u00eda
  de los derechos humanos de los detenidos, pero,  como no est\u00e1 completamente
  de acuerdo con el contenido de la moci\u00f3n,  anuncia su voto en contra.\\n\\nHelena
  Santesteban zinegotzia orain bertaratu da.\\n\\nEA eta EAJko zinegotziak Jon Abrilek
  eginiko adierazpenarekin bat egin dute.\\n\\nLa concejal Helena Santesteban se incorpora
  ahora a la sesi\u00f3n.\\n\\nLos concejales de EA y EAJ se adhieren a lo manifestado
  por Jon Abril.\\n\\nBozketa egina, 4 aldeko boto eta 6 aurkakoekin, mozioa ez da
  onartu.\\n\\n12.- ESKARIAK ETA GALDERAK. BESTE UDAL ORGANOEN KONTROLA.\\n\\nEz dira
  burutu.\\n\\nBesterik gabe, Alkateak bilera bukatutzat eman du  21:10etan.\\n\\nO.E.
  ALKATEA/V.B. EL ALCALDE\\n\\nJosu Iratzoki Agirre\\n\\nRealizada la votaci\u00f3n,
  con 4 votos a favor y  6 en contra, la moci\u00f3n no se aprueba.\\n\\n12.- RUEGOS
  Y PREGUNTAS. CONTROL DE LOS DEM\u00c1S \u00d3RGANOS DE LA CORPORACI\u00d3N.\\n\\nNo
  se producen.\\n\\nNo habiendo m\u00e1s asuntos, el Alcalde  levanta la sesi\u00f3n
  a las 21:10 horas.\\n\\nIDAZKARIA/LA SECRETARIA\\n\\nPilar Chueca Intxusta\"", "\"\\\"un
