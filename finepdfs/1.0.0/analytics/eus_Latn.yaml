  respecto, pueden ponerse en contacto con la Subdirecci\u00f3n de Redes Municipales
  del CABB.\\n\\nReciba un cordial saludo,\\n\\nAtentamente,\\n\\nUdal Sareen Zuzendariordea
  / Subdirector de Redes Municipales\\n\\nIz./Fdo.: Juan Luis Mozo Bikandi\\n\\nBilbao
  Bizkaia Ur Partzuergoa / Consorcio de Aguas Bilbao Bizkaia\"", "\"2016ko irailaren
  5a, astelehena\\n\\n169\\n\\nLunes, a 5 de septiembre de 2016\\n\\nTOKI ADMINISTRAZIOA\\n\\n3\\n\\nEIBARKO
  UDALA\\n\\nUdal Ordenan tza alda tzea, herriko kaleen erabilerari eta okupazioari
  buruzkoa: tabernetako mahaiak eta aulkiak, salgaiak edo beste elementu  batzuk jar
  tzea (hain zuzen ere 4., 5., 8., 9. eta 11. artikuluei dagozkien aldaketak).\\n\\nAldaketaren
  testua jendaurrean egon den bitartean, ez da inongo erreklamaziorik egin. Beraz,
  horren ondorioz, aldaketa behin-betiko onartu tzat ematen da.\\n\\nBeraz, horren
  ondorioz, eta  hitzez hitz ematen dira argitara Erregimen Lokaleko Oinarriak Arau
  tzen dituen Legearen 70.2 artikuluak dioena betez. (Orain alda tzen den Ordenan
  tza hau 2012-6-11ko Gipuzkoako ALDIZKARI OFIZIALEAN eman zen argitara, 110. alean
  eta 2013-8-2ko Gipuzkoako ALDIZKARI OFIZIALEAN, 146. alean).\\n\\nEibar, 2016ko
  abuztuaren 30a.\u2014Ana Telleria Echeverria, jarduneko alkatea. (9152)\\n\\nBide
  publikoa mahai eta aulkiekin, sal tzeko produktuekin edo elementu lagungarriekin
  okupatu eta erabil tze ari buruzko udal-ordenan tza.\\n\\nArrazoien azalpena.\\n\\nAtariko
