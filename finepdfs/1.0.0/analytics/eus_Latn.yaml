  titulua: ordenan tza ez bete tzea: arau-hausteak eta zehapenak.\\n\\nwww.gipuzkoa.eus\\n\\nADMINISTRACI\u00d3N
  LOCAL\\n\\nAYUNTAMIENTO DE EIBAR\\n\\nModificaci\u00f3n de la ordenanza municipal
  sobre el uso y ocupaci\u00f3n de la v\u00eda p\u00fablica con mesas y sillas, productos
  en venta u otros elementos auxiliares (en concreto modificaciones que afectan a
  los art\u00edculos 4, 5, 8, 9 y 11).\\n\\nNo habi\u00e9ndose presentado alegaci\u00f3n
  alguna dentro del plazo de exposici\u00f3n p\u00fablica, se considera definitivamente
  aprobada la modificaci\u00f3n.\\n\\nEn consecuencia, se hace p\u00fablico su texto
  \u00edntegro en aplicaci\u00f3n del art\u00edculo 70.2 de la Ley Reguladora de las
  Bases del R\u00e9gimen Local (la Ordenanza que ahora se modifica fue publicada en
  BOLETIN OFICIAL de Gipuzkoa n.\u00ba 110 de 11-6-2012 y n.\u00ba 146 de 2-8-2013).\\n\\nEibar,
  a 30 de agosto de 2016.\u2014La alcaldesa en funciones, Ana Telleria Echeverria.
  (9152)\\n\\nOrdenanza municipal sobre el uso y ocupaci\u00f3n de la v\u00eda p\u00fablica
