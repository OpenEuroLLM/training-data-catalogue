  2022ko mar txoaren 3an\\n\\nForu parlamentaria: Cristina Ibarrola Guill\u00e9n\\n\\nISSN:
  2254\u20131950\"", "\"REAS Euskadik, Ekonomia Solidarioko gizarte erakundeentzako
  auditoria sozialaren prozesuaren bermatzaile gisa EGIAZTATZEN du\\n\\nREAS Euskadi,
  en calidad garante valedora del proceso de Auditoria Social para Entidades Sociales
  de Econom\u00eda Solidaria, ACREDITA que\\n\\nELKARBANATUZ ELKARTEA\\n\\nerakundeak
  2010 urteko Auditoria Soziala egin duela. Informazio guzti hau emateak, Ekonomia
  Solidarioak dituen irizpideekiko konpromisoa adierazten du, eta Ekonomia Alternatibo
  eta Solidarioaren Sarearen \u201cMundu Solidario baten aldeko Agiria\u201d-n agertzen
  direla.\\n\\nha realizado la Auditoria Social correspondiente al a\u00f1o 2010 aportando
  la informaci\u00f3n relativa a su compromiso con los principios de la Econom\u00eda
  Solidaria, recogidos en la \u201cCarta Emprender por un Mundo Solidario\u201d de
  la Red de Econom\u00eda Alternativa y Solidaria.\\n\\nBilbon, 2011ko abenduaren
  26an\\n\\nEn Bilbao, a 26 de diciembre de 2011\\n\\nV\u00ba B\u00ba presidente\\n\\nJose
  Gonz\u00e1lez\\n\\nEkonomia Solidarioak, ekonomia alderdi guztietai (ekoizpena,
  finantzazioa, merkataritza eta kontsumoan) aldarrikatzen du, beti pertsona eta taldearen
  garapenaren zerbitzura, ez tartekari gisan-azkeneko helburuan baizik-. Horrela,
  gaur egungo eredu ekonomikoaren alternatiba izan nahi du, gizarte eraldaketa eta
  justizia tresna izanez eta eredu jasangarri eta partehartzalea sustatzu.\\n\\nAuditoria
  Sozialak, erakundeek euren helburuarekiko duten gizarte eraginkortasuna eta bidezko
  portaera ebaluatzeko balio du. Horrela, bere gizarte eta elkartasuneko emaitzek
  hobe ditzakete eta jardueretan diharduten pertsoneei horien berri eman.\\n\\nREAS
  Euskadik \\\"Ekonomia Solidarioarentzako Auditoria Soziala egiteko adierazleak\\\"
  aurkeztzen ditu. Horiek, Ekonomia Solidarioko \\\"Mundu solidario baten aldeko\\\"
  agirian agertzen diren irizpideetan, du oinarri:\\n\\n1. **Berdintasuna**\\n   Enpresa
  edo erakundearen jardueretan protagonista diren pertsona guztieng interesak modu
  orekatuan asetzea.\\n\\n2. **Lana**\\n   Enplegu egonkorra sortzea eta aukerarik
  gabeko edo trebakuntza gutxiko pertsonak laneratzea. Pertsona guztiel lan baldintza
  eta soldata duinak eskaintzea, euren garapen pertsonala eta erantzukizuna bultzatzue.\\n\\n3.
  **Ingurugiroa**\\n   Ingurugiroa errespetatzen duten ekintza, produktu eta produksio
  metodoak ahalbidetzea.\\n\\n4. **Lankidetza**\\n   Lehiakortasunaren ordez, lankidetza
  ahalbidetzea, bai erakundearen barruan zein kanpoan.\\n\\n5. **Irabazi asmorik gabe**\\n   Ekimen
  solidarioen helburu nagusia gizakiaren eta gizartearen sustapena da. Etekinak gizarteari
  itzuliko zaizkio, gizarte proiektuak, eximen solidario berriak edo garapenerako
  lankidetza programak babestuz, besteak beste.\\n\\n6. **Inguruarekiko konpromisoa**\\n   Ekimen
  solidarioak euren inguru sozialarekin konprometituta egongo dira. Horrek beste erakunde
  batzuekiko lankidetza eta sareko partaidetza eskatzen du, esperientzia solidario
  zehatzek eredu sozioekonomiko alternatiboa sortu dezaten.\\n\\nLa Econom\u00eda
  Solidaria es una visi\u00f3n y una pr\u00e1ctica que reivindica la econom\u00eda
  en sus diferentes facetas (producci\u00f3n, financiaci\u00f3n, comercio y consumo)
  como medio \u2013y no como final servicio del desarrollo personal y comunitario.
  De esta manera, se presenta como una alternativa al modelo econ\u00f3mico imperante,
  siendo un instrumento de transformaci\u00f3n social y justicia, que fomenta un desarrollo
  sostenible y participativo.\\n\\nLa Auditoria Social es un proceso que permite a
  una organizaci\u00f3n evaluar su eficacia social y su comportamiento \u00e9tico
  en relaci\u00f3n a sus objetivos, de manera que pueda mejorar sus resultados sociales
  y solidarios y dar cuenta de ellos a todas las personas comprometidas por su actividad.\\n\\nREAS
  Euskadi presenta su \\\"Bater\u00eda de indicadores para Auditoria Social de Econom\u00eda
  Solidaria\\\" basada en los principios caracter\u00edsticos de la Econom\u00eda
  Solidaria que aparecen recogidos en la carta \\\"Emprender por un mundo solidario\\\":\\n\\n-
  **Equidad**\\n  Satisfacer de manera equilibrada los intereses de todas las personas
  protagonistas en las actividades de la empresa o de la organizaci\u00f3n.\\n\\n-
  **Empleo**\\n  Crear empleos estables y favorecer el acceso a personas desfavorecidas
  o poco cualificadas. Asegurar a cada persona condiciones de trabajo y una remuneraci\u00f3n
  digna, estimulando su desarrollo personal y la asunci\u00f3n de responsabilidades.\\n\\n-
  **Medio Ambiente**\\n  Favorecer acciones, productos y m\u00e9todos de producci\u00f3n
  respetuosos con el medio ambiente.\\n\\n- **Cooperaci\u00f3n**\\n  Favorecer la
  cooperaci\u00f3n en lugar de la competencia dentro y fuera de la organizaci\u00f3n.\\n\\n-
  **Sin car\u00e1cter lucrativo**\\n  Las iniciativas solidarias tienen como fin principal
  la promoci\u00f3n humana y social. Los beneficios revertir\u00e1n a la sociedad
  mediante el apoyo a proyectos sociales, a nuevas iniciativas solidarias o a programas
  de cooperaci\u00f3n al desarrollo, entre otros.\\n\\n- **Compromiso con el entorno**\\n  Las
  iniciativas solidarias estar\u00e1n comprometidas con el entorno social en el que
  se desarrollan, lo que exige la cooperaci\u00f3n con otras organizaciones as\u00ed
  como la participaci\u00f3n en redes, como camino para que experiencias solidarias
  concretas puedan generar un modelo socioecon\u00f3mico alternativo.\"", "\"ARTE-BITARTEKARITZA
  MINTEGIA\\n\\nTXURRAK ETA MENINAK\\n\\nMontehermoso Kulturunea\\n\\nAntolatzaileak:\\n\\nAntolatzaileak:\\n\\nteatroparaiso.com\\n\\n#ChurrasConMeninas
  #migap\\n\\nDirulaguntzak:\\n\\nLaguntzaileak:\\n\\nLaguntzaileak:\\n\\n2\\n\\naurkezpena\\n\\n\\\"Txurrak
  eta meninak.Arte-bitartekaritza mintegia\\\"-n artearen eta hezkuntzaren arteko
  harremanari buruz hausnartuko dugu; gaur egun bi esfera horiek elkarreragiteko  dituzten
  zailtasunak aztertu, hauek gainditzeko alternatibak partekatuko, eta bien arteko
  sinergiak sendotuko ditugu.\\n\\nTestuinguru formal zein ez formaletan, lotura hau
  funtsezko gai bat da ezagutza eskuratzeko eta herritartasun kritiko bat sortzeko.
  Guzti hau, gero eta konplexuagoa eta anitzagoa den testuinguru sozial eta kultural
  batean. Hori dela eta, \\\"Txurrak eta meninak\\\"-en bitartez, bi errealitateen
  arteko elkarrizketa aktibatzea bilatzen dugu, agian gehiegitan, orbita oso ezberdinetan
  lan egiten baitute, euren errealitate eta inertzia partikularrak direla eta.\\n\\nArte-bitartekotza
  mintegi hau, Mind the Gap proiektuaren barruan garatzen da, Interreg POCTEFA programak
  finantzatutako proiektu europarra, pirineoz haraindiko 12 bazkideen ahalegina eta
  ezagutza biltzen dituena. Mind the Gap-ek elkarrizketan jartzen ditu kultura eta
  hezkuntza alorretan berritzaileak diren esperientziak, Espainian, Frantzian eta
  Andorran lan egiten duten eragile instituzionalen eta hezkuntza eta kultur eragileen
  gaitasunak hobetze aldera.\\n\\n\\\"Txurrak eta meninak\\\" Teatro Paraisok, Teklak,
  Komunikazio eta Audientzien Estudioa,-rekin batera Arabako lurraldean ezartzen ari
  den 2018-2020 ekintza planaren barruan kokatzen da, zeinetan Hezkuntza Artistikoa
  eta Alfabetatze Kulturala bultzatu nahi den. Halaber, topaketarako, eztabaidarako
  eta ezagutzarako gune bat sortu nahi du, gure testuinguru hurbilera, erreferentziazko
  ahotsak eta egungo esperientziak ekartzeko.\\n\\nnori zuzendua\\n\\n_ Irakasleak.\\n\\nizen-ematea\\n\\n_  Hezkuntza
  artistikoaren arloan interesa duten artista eta sortzaileak.\\n_  Kultura edo gizarte-erakundeetan
  lan egiten duten hezkuntza artistikoko profesionalak (bitartekariak, kudeatzaileak,
  irakasleak, pedagogoak, etab.).\\n_ Gizarte-hezitzaileak.\\n_ Erakunde publikoak.\\n_
  Hurrengo inprimakiaren bidez: https://forms.gle/SdxJaUL9aUQA4FX67\\n_ Izen-emate
