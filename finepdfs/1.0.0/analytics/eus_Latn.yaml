  Estuario atlantiko azpimareala. UMOA: , ur-masa oso aldatua.\\n\\n| Kodea       |
  Ur-masa   | UMOA | Tipologia | Erlazionaturiko lagintze-puntuak          |\\n|-------------|-----------|------|-----------|------------------------------------------|\\n|
  ES111T075010| Barbadun  | Ez   | AT-T09    | E-M5, E-M10                              |\\n|
