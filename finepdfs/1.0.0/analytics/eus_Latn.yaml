  beltza  Uroiloa  Ubarroia  Txilinporta  Kukua  Enara  Uhalde-enara\\n\\n(Beste 3
  hegaztiak Salburuan bizi dira neguan ere)\\n\\n3.3. Animalia hauetatik, zeintzuk
  **bizi dira neguan Salburuan**, baina ez ditugu ikusten?\\n\\nZikoina  Igela  Tenka  Muskerra  Suge
  biperakara  Eltxoa\\n\\n3.4. Zer egiten dute animalia hauek neguari aurre egiteko?
