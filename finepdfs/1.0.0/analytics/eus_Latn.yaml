  Kobrea                                          |\\n\\n817/2015 Errege-Dekretuaren
  IV eranskinaren arabera, azaleko ur-masa batek IKA-UB betetzen du urtean zehar egindako
  neurketen batezbesteko aritmetikoak araua gainditzen ez duenean, ur-masaren lagintze-puntu
  adierazgarri bakoitzean; eta azaleko ur-masa batek IKA-KOH betetzen du ur-masaren
  edozein lagintze-puntu adierazgarriko kontzentrazioak araua gainditzen ez duenean.\\n\\nUr-masa
  mailan, IKAak betetzea (lehentasunezko kutsatzaileentzat eta besteentzat, zein substantzia
  preferenteentzat) honela balioztatzen da:\\n\\n- Ur-masa bateko lagintze-puntu guztietan
  substantzia baten kontzentrazioa lagintze guztietan detekzio-muga baino baxuagoa
  bada, IKA-UB eta IKA-KOH ez dira gainditzen eta, beraz, ur-masak egoera kimiko ona
  erdiesten du.\\n\\n- Aurreko puntuan ezarritakoa gertatzen ez bada, lagintze-puntu
  bakoitzerako KGUB (Lagintze-puntuko Urteko Batezbestekoa) kalkulatzen da. Ur-masa
  bateko lagintze-puntuen KGUBen batezbestekoak (lagintze-puntu bakoitzaren adierazgarritasunarekiko
  haztatuz) IKA-UB gainditzen badu, ur-masak egoera kimiko ona ez du erdiesten (xehetasun
  gehiagorako ikusi txostenaren 1.4 atala, Ebaluazio orokorreko estrategia).\\n\\n-
  Beste alde batetik egoera kimiko ona erdiesteko, ez du IKA-KOH gainditu behar ur-masaren
  lagintze-puntu bakar batek.\\n\\nAzkenik, PHAren 26. artikuluaren arabera, \u201cAzaleko
  ur-masen egoera egoera ekologikoaren eta egoera kimikoaren arteko balio txarrena
  da\u201d.\\n\\n2. Emaitzak\\n\\n2.1. 2018ko egoeraren ebaluazioa\\n\\n2018ko kanpainan,
  tarteko 14 ur-masen eta kostaldeko lau ur-masen egoera ekologikoaren\\\\(^5\\\\)
  laburpen gisa ondokoak esan daiteke (4. irudia, 5. taula):\\n\\n- **Egoera edo ahalmen
  ekologiko txarra**: 2018an Oka barrualdeko tarteko ur-masa da egoera ekologiko txarra
  azaltzen duen bakarra. Kasu honetan fitoplanktonaren egoerak mugatzen du egoera
  ekologikoa.\\n\\n- **Egoera edo ahalmen ekologiko eskasa**: Ur-masa bakar batek
  ere ez du egoera ekologiko eskasik azaltzen 2018an.\\n\\n- **Egoera edo ahalmen
  ekologiko neurriazkoa**: guztira tarteko bost ur-masa daude egoera edo ahalmen ekologiko
  neurriazkoan: Barbadun, Nerbioi kanpoaldea, Lea, Artibai eta Oiartzun. Lean egoera
  neurriazkoa arrainen egoerari zor zaio; Nerbioi kanpoaldean, baldintza fisiko-kimikoei;
  Barbadun eta Artibain, makroonogabe bentikoei; eta Oiartzunen, fitoplanktonari.\\n\\n-
  **Egoera edo ahalmen ekologiko ona**: guztira 10 ur-masa sailkatzen dira egoera
  edo ahalmen ekologiko onean: tarteko sei ur-masa (Butroe, Oka kanpoaldea, Deba,
  Urola, Oria eta Bidasoa), oso aldatutako bi ur-masa (Nerbioi barrualdea eta Urumea)
  eta kostaldeko bi ur-masa (Getaria-Higer eta Monpas-Pasaia).\\n\\n- **Egoera ekologiko
  oso ona edo ahalmen ekologiko maximoa**: Egoera ekologiko oso ona azaltzen duten
  bi ur-masak kostaldeko Kantabria-Matxitxako eta Matxitxako-Getaria dira.\\n\\nGuztira
  bi ur-masek ez dute egoera kimiko onik erdiesten (4. irudia). Industria gehien (meatzaritza
  eta industrien arroak), portuak edota saneamendu osatugabea dutenak dira, hala nola:
  Nerbioi barrualdea eta kanpoaldea. Gainontzeko ur-masak, eta euskal kontinente-plataformako
  hiru lagintze-puntuak, egoera kimiko onera helten dira.\\n\\nTarteko uretan 2018an
  hauteman diren IKAen ez-betetzear ondoko substantziei zor zaizkie: hexakloroziklohexano
  (HCH) eta kadmioari Nerbioi barrualdean, eta HCHari Nerbioi kanpoaldean. Batzuetan,
  zenbait substantziak (esaterako, HCHak) eragindako kutsadurak kronikoa dirudi. Hala
  ondoriozatzen da ur-masa horietan egin diren lagintze intentsibo eta estentsiboetatik
  (Larreta et al.,\\n\\n\\\\(^5\\\\) Eranskinean tarteko eta kostaldeko ur-masetako
  lagintze-puntu bakoitzari dagozkion datuak ikus daitezke (0).\\n\\n2019a). Beste
  batzuetan (Cd), kutsadura aldizkakoa da eta ez da aldiro-aldiro errepikatzen. Bidasoan
  TBT mailak IKA gainditu izan du iraganean, ur-masa honetan egin diren azterketa
  intentsiboetan ikusi denez (Larreta et al., 2019b), baina, gaur egun, substantzia
  honi dagokion IKA betetzen da.\\n\\nHorregatik, 2018an egoera ona betetzan duten
  ur-masak Butroe, Oka kanpoaldea, Deba, Urola, Oria, Urumea eta Bidasoako tarteko
  ur-masak eta kostaldeko lau ur-masak dira (Kantabria-Matxitxako, Matxitxako-Getaria,
  Getaria-Higer eta Monpas-Pasaia). Gainontzeko ur-masek ez dute egoera onik erdiesten,
  egoera ekologiko edo/eta kimiko onik ez dutelako.\\n\\nUr-masa guztien artean, Nerbioi
  barrualdea da, egoera kimikoa ez erdiesteagatik, egoera onik ez duen ur-masa bakarra,
  egoera ekologiko ona izanik.\\n\\n4. irudia Euskal Autonomia Erkidegoko tarteko
  eta kostaldeko ur-masen egoera/ahalmen ekologikoa eta egoera kimikoa (irudian eta
  izenean azpimarratuta) 2018an.\\n\\n5. taula  Egoeraren diagnostikoa 2018an. Euskal
