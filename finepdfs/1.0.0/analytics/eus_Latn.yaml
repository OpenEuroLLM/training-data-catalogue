  |\\n\\nEguneratze-data-Fecha de actualizaci\u00f3n: 21/10/2024\"", "\"VITORIA-GASTEIZKO
  UDALA\\n\\nGIZA BALIABIDEEN SAILA\\n\\n2021eko urriaren 8an egindako ohiko bilkuran,
  Gasteizko Udaleko Udaltzaingo Zerbitzuko lehen agenterako (LANKO: 8011) barne-sustapeneko
  eskaintzan beste 4 lanpostu gehitzea onetsi zuen Tokiko Gobernu Batzarrak\\n\\nGasteizko
  Udalak agintaldi honetarako dituen helburuen artean, Aurrekontu Orokorren Legeak
  baimendutako enplegu-eskaintza publikoa deitzea proposatzen du, udal egitura sendotzeko
  neurri gisa.\\n\\nUne honetan, udaltzaingoko 5 lehen agente lanpostu betetzeko barne-sustapenerako
  eskaintza deialdia gauzatzen ari da \u2014Tokiko Gobernu Batzarrak 2020ko uztailaren
  10ean onetsi eta 2020ko uztailaren 31 ALHAOn argitaratua\u2013. Eskaintza onetsi
  zenetik orain arte hainbat lanpostu hutsik geratu dira udalaren lanpostuen zerrendan,
  erretiroak eta behin betiko bajak direla eta.\\n\\nAntolakuntza Zerbitzuaren arduradunak
  egindako txostenean, lehen agenteko lau leku huts daudela adierazi du eta barne-sustapenaren
  bidez handitzea proposatzen du.\\n\\nKontuan izan da Enplegatu Publikoaren Oinarrizko
  Estatutuaren 16. artikuluak \u2014apirilaren 13ko 7/2007 Legea\u2014 xedatzen duenez,
  karrerako funtzionarioek lanbide-sustapena izateko eskubidea dutela, eta 18. artikuluan
  ezarritakoaren arabera barne-sustapena egiteko hauta\u00adtzeprozesuetan berdintasun-,
  merezimendu- eta gaitasun-printzipio konstituzionalak errespetatuko direla, baita
  aipatutako legearen 55.2 artikuluan eta hurrengoetan aurreikusitakoak ere.\\n\\nKontuan
  izan da 6/1989 Legearen 69.2.c artikuluan jasota dagoenez funtzionarioek administrazio-karrerarako
  eta barne-sustapenerako eskubidea izango dutela. Lege beraren 46. artikuluan eta
  hurrengoetan arautzen da lanpostuak betetzeko modua, eta 48.2 artikuluak dioenez,
  behin-behineko lan-izendapena duten funtzionarioek, egoera horretan dauden bitartean,
  derrigorrez parte hartu beharko dute beren kidego edo eskaletako lanpostuak betetzeko
  deitutako lehiaketetan.\\n\\nEuskal Funtzio Publikoaren Legeak xedatzen duenez,
  hornikuntza- eta sustapen-eskaintzak dagokien lurralde historikoaren aldizkari ofizialean
  argitaratuko dira foru-aldundietarako edo toki-korporazioetarako direnean.\\n\\nBarne-sustapeneko
  deialdiaren lehen oinarrian jasota dago eskaintza handitzeko aukera (2021eko urtarrilaren
  11ko ALHAOn argitaratua).\\n\\nEra berean, Enplegatu Publikoaren Oinarrizko Estatutuaren
  37.2 artikuluak xedatutakoarekin bat etorriz, negoziazio-bilerak egin dira udaleko
  langileen batzordearekin, 2021eko irailaren 29an, egoki iritzitako alegazioak aurkezterik
  izan zezaten.\\n\\nKontu-hartzailetza Nagusiaren txostena eta txosten ekonomikoa
  ere handitzearen aldekoak dira.\\n\\nHorrenbestez, aurreko paragrafoetan adierazitakoa,
  eta Toki Jaurbidearen Oinarriak arautzen dituen 7/1985 Legeak \u2013abenduaren 16ko
  57/2003 Legeak aldatua\u2013 127. artikuluan aitortzen dizkidan eskumenez baliatuz,
  eta 2019ko ekainaren 21eko erabakiaren bitartez Giza Baliabideen arloko zinegotziaren
  esku utzitako aginpidea betez, Giza Baliabideen Arloko zinegotzi ordezkariak erabaki-proposamen
  hau aurkezten dio Tokiko Gobernu Batzarrari:\\n\\nII - ARABAKO LURRALDE HISTORIKOAREN
  TOKI ADMINISTRAZIOA\\n\\nErabaki-proposamena\\n\\nLehengoa: Onestea Gasteizko Udaleko
  Udaltzaingo Zerbitzuko lehen agenteko (LANKO 8011) barne-sustapeneko eskaintza 4
  lanpostu gehiagorekin handitzea, honela:\\n\\n| LANPOSTUAREN KODEA | LANPOSTUAREN
  DESKRIBAPENA | MATRIKULA | LANPOSTU MOTA | EHUNEKO ERREALA | PLAZA EHUNEKO | HE
  |\\n|---|---|---|---|---|---|---|\\n| 8011 | LEHEN AGENTEA | 380 | R | 100 | 100
  | 2 |\\n| 8011 | LEHEN AGENTEA | 381 | R | 100 | 100 | 2 |\\n| 8011 | LEHEN AGENTEA
  | 383 | R | 100 | 100 | 2 |\\n\\nBigarrena: ALHAOn argitaratzea barne-sustapenerako
  eskaintzaren handitze hau.\\n\\nVitoria-Gasteizen, 2021eko irailaren 30ean\\n\\nGiza
  Baliabideen Saileko zinegotzi ordezkaria\\n\\nI\u00d1AKI GURTUBAI ARTETXE\\n\\nFirmante:
  CN=ZERBITZU OROKORREN ZUZENDARITZA - DIRECCION SERVICIOS GENERALES, SERIALNUMBER=P0100000I,
  OU=SELLO ELECTRONICO, ORGANIZATIONIDENTIFIER=VATES-P0100000I, O=ARABAKO FORU ALDUNDIA
  / DIPUTACION FORAL DE ALAVA, C=ES\\n\\nN\u00famero de serie: 211865\\n\\nEmisor
  del certificado: CN=EAEko HAetako langileen CA - CA personal de AAPP vascas (2),
  OU=AZZ Ziurtagiri publikoa - Certificado publico SCA, O=IZENPE S.A., C=ES\\n\\nFecha
  de firma:  2021.10.22 05:54:41 Z\"", "\"Enare Graxi Barandiaran Imaz\\n\\nD Maila
  |  Prosa |  aipamen saria\\n\\nEnare-Graxi Barandiaran Imaz nauzue, 2009. urtean
  jaioatako Altzagatarra. Oianguren ikastetxeko ikaslea naiz duela bi urtetik. Izugarri
  gustatzen zait musika eta musika eskolara joaten naiz txikia nintzenetik. Idaztea
  ere txikitatik gustatu izan zaidan gauza da irakurtzearekin batera. Bidaiatzea ere
  izugarri gustatzen zait bereziki Ipar Europako herrialdeetara. Espero dut nire istorioa
  gustatzea.\\n\\nAbandonua\\n\\nGau erdian esnatu nintzen, izerdi tantak erortzen
  zitzaizkian kopetatik, eta arnas estuka nengoen. Estutasuna, itolarria.\\n\\nSegituan
  etorri zitzaidan Ainhoa zer gertatzen zitzaidan galdetuz, joateko eskatu nion, oso
  ondo banekien ez nintzela garrantzitsua berarentzat, handik kanpora familia zoragarri
  bat baitzuen, familia perfektua seguruenik.\\n\\nZer gertatzen zitzaidan galdetzean,
  gaixo egongo nintzela esan nion, barnean banekien zergatik nengoen horrela, data
  garrantzitsu baten urteurrena zen, gurasoek utzi nindutenekoa. Jadanik bi urte igaro
  ziren, baina oraindik ez nengoen ohituta arrera zentro batean bizitzeaz.\\n\\nLeku
  lasaia zen, handia. Bi pisu zeuzkan eta kanpotik beste edozein etxe bezain zoragarria
  ematen zuen, hainbat gela zeuzkan, gela bakoitza bi pertsonak partekatzen zuten,
  eta lorategi handi bat zeukan, udan jolasteko. Batzuetan gauetan iristean ziren
  gazteak, alkoholaren eraginpean eta nahiko kaltetuta, leku horretan bizi ziren gazteak
  arazotsuak izaten baitziren gehienetan.\\n\\nAdingabe asko leku honetara bidaltzen
  dituzte gurasoak hiltzen zaizkienean, hori bai familiakorik ez badute, edo gurasoekin
  arazoak badituzte, baina ni ez, ni hemen utzi ninduten nahiko ez luketen altzari
  bat banintz bezala, gaizki iritsi zaien pakete bat bezala.\\n\\nBeti galdetu izan
  diot nire buruari zer egin ote nien gurasoei, ez nuen arazorik ematen, eta beharrezkoa
  zenean bakarrik hitz egiten nuen. Baina nik uste, jaio nintzen egunetik nagoela
  kondenatuta, ez ninduten nahi, ez ninduten behar.\\n\\n2020ko Uztailaren 22a zen,
  udako egun eguzkitsu bat zen eta eguzki izpiak azalean islatzen zitzaizkidan, oporretako
  lasaitasuna bizi nuen, lasaitasun faltsua.\\n\\nOso ondo gogoratzen dut egun hura,
  indabak zeuden bazkaltzeko, ez da ohikoena udako egun baterako, baina aitaren gustukoenak
  ziren, eta niri gustatzen ez zitzaizkidan arren, ez nuen kexatzeko ohiturarik.\\n\\nBazkaldu
  ondoren, lagunekin geratu nintzen, beti bezala plazara joan ginen. Bertan futbolean
  pixka bat jolastu eta arratsaldeko bostak iristean etxerako bidea hartu nuen, amak
  esan bezala.\\n\\nEtxera iristean ate ondoan maleta handi batzuk ikusi nituen, harritu
  egin nintzen, gurasoek ez zidaten inongo bidaiaren berri eman, gainera nireak bakarrik
  zeuden. Segituan ama ikusi nuen sukaldeko aulki batean eserita, altxatu eta kotxean
  sartzeko agindu zidan.\\n\\nBidaia luzea izan zen, isiltasunez betea, desatsegina.
  Gurasoen aurpegietan ikusten nuen ez zeudela gustura, ez nintzen azalpenak eskatzera
  ausartu. Erlojuari etengabe begiratzen nion, bostak eta hogei, bostak eta hogeita
  bost, bostak eta\u2026 Azkenean iritsi ginen, aitak etxe handi baten aurrean utzi
  zuen kotxea, eta emakume bat atera zen etxearen atzealdetik.\\n\\nGurasoekin hitz
  egiten egon zen denbora luzez, ondoren berarekin joateko eskatu zidan. Gurasoek
  ez zidaten agurrik esan, ezta musurik eman ere, ni etxe hartan sartzean poz aurpegia
  zutela ikusi nuen, lasaitasunarena, erabaki on baten ondorioa. Inoiz ahaztuko ez
  ditudan aurpegiak.\\n\\nEmakumearekin hitz egitean, dena ulertu nuen, izugarria
  zen. Amorrua sentitu nuen, gauzak leihotik botatzeko gogoa, etsipena, dezepzioa.\\n\\nBi
  aste pasa nituen gelatik atera gabe, etengabe negarrez, ondorioak atera nahian edo
  zergatia agian. Baina oraindik ez dut zergatirik aurkitu, agian ezinezkoa da, irteerarik
  gabeko labirintoa bezala.\\n\\nBetidanik jakin izan nuen atzean utzi behar dudala
  lehengo bizia, ahaztu, aurre egin. Pixkanaka bizi berria hasten ari nintzen. Baina
  banekien egun hartako nire gurasoen aurpegiak ez ditudala inoiz ahaztuko, tatuai
  bat izango ziren niretzako.\\n\\nAtzo arratsaldean norbaitek atea jo zuen, ni nengoen
  gertuen eta atea irekitzera joan nintzen, bertan ikusi nuena ez nuen inoiz irudikatu,
  agian amestu nuen baina inoiz ez nuen pentsatuko gauzatu zitekeenik.\\n\\n-Barkatu.-esan
  zuen atearen atzeko pertsonak.\\n\\nNegar malkoa erori zitzaidan.\"", "\"ZERRENDEN
  IREKIERA\\n\\nDepartamentuak  irakasle  ezpezialisten  eta Lehen  eta  Bigarren  Hezkuntzako  nahiz
  Hizkuntza  Eskola  Ofizialeko  hainbat zerrenda ireki berri ditu.\\n\\nEra  iraunkorrean  irekita  izanen  diren
  zerrendak:\\n\\nDeialdiari lotura zuzena\\n\\nOhar  garrantzitsua:  Zerrenda  hauetan
  sartzeko  ohiko  prozedura,  bertan  izena ematea  eta  baremazio  erresoluzioa
  publikatu  arte  itxarotea  da  (apirilaren  1a arte  izena  eman  duten  pertsonak  barne),
  momentu horretan inkorporatuko zinatekete zerrenda  orokorrera  legalki,  eta  orduan
  soilik  barematuko zaizue karrerako espedienteko notaren arabera.\\n\\n*Zer gertatzen
  da Hezkuntza Departamentuak  zerrenda  batzuetan lehenago  beharra  badu  eta  inor  ez
  badute?\\n\\nZerrenda  irekiera  honetan  apuntatu zaretenok, apuntatze hurrenkeraren
  arabera  deituko  zaituztela.  Orduan, normalki  zerrenda  hauetan  apuntatu  eta
  efektibo  izateko  itxaron  beharra  badago ere, orain  eszepzio  momentu  batean
  daude,  gehienbat  haur  hezkuntza, ingelesean,  eta  Lanbide  Heziketako hainbat
  espezialitatetan. Orduan, posible da apuntatzen zareten heinean deitzea zerrenda
  batzuetatik.\\n\\nSteilas sindikatuak  zerrenda  guztiak  era iraunkorrean  irekita  egotea  eskatzen
  jarraitzen du. Era berean, zerrenda hauek ordezkogaien meritu guztiak kontuan izanda
  barematu  daitezela  exigitzen  du.  Meritu hauen artean lan-esperientzia ere kontuan
  hartu behar da; gaur egun Hezkuntzak ez baitu barematzen.\\n\\n2018ko urtarrilaren
  12a 12 de enero de 2018\\n\\nAPERTURA DE LISTAS\\n\\nEl Departamento ha abierto
  algunas listas tanto de profesorado especialista como de Primaria, Secundaria y
  Escuelas Oficiales de Idioma:\\n\\nListas permanentemente abiertas:\\n\\nEnlace
  directo a la convocatoria\\n\\nEl  procedimiento  ordinario  para  entrar  en estas
  listas es el siguiente; primero hay que inscribirse y esperar hasta que se publique
  la  resoluci\u00f3n  de  baremaci\u00f3n  (en  la  que figurar\u00e1n  las  personas  que  se  hayan
  apuntado  hasta  el  1  de  abril).  En  ese momento  os  incorporar\u00e9is  a  la  lista
  oficialmente y se os baremar\u00e1 en base a la nota  del expediente de vuestra
  titulaci\u00f3n universitaria.\\n\\n*\u00bfQu\u00e9  ocurre  si  el  Departamento  de
  Educaci\u00f3n  necesita  personal  antes  de dicha  fecha  y  no  hay  aspirantes  en
  listas?\\n\\nEntonces  os  llamar\u00e1n  por  tel\u00e9fono  en estricto orden
  de entrada de las instancias de  participaci\u00f3n.  Y  a  pesar  de  que normalmente  hay  que  esperar  hasta
  baremaci\u00f3n para empezar a trabajar, ahora mismo  nos  encontramos  en  una
  situaci\u00f3n  excepcional  de  falta  de personal, sobre todo en Infantil, Ingl\u00e9s
  y algunas especialidades de Formaci\u00f3n Profesional.  Por tanto, es posible que
  os llamen de algunas listas a los pocos d\u00edas o semanas de apuntados.\\n\\nDesde  el  sindicato
  Steilas seguimos exigiendo la apertura permanente de todas las listas y no solamente
  de algunas, tal y como est\u00e1 sucediendo. Asimismo, reclamamos  que  estas  listas  se  baremen
  teniendo en cuenta todos los m\u00e9ritos de las personas aspirantes, entre los
  que se deben incluir la experiencia docente, algo que no ocurre actualmente.\"",
  "\"MUNIBE (Antropologia - Arkeologia)\\n\\nMOTA: Harrespilak ZB: 139\\n\\nSIGLA:
  OM-Et.I.\\n\\nUDAL: Urnieta\\n\\nMAPA-ZB: 64-4.139\\n\\nKOKAPENA\\n\\n* Onyi-Mandoegiko
  megalitotegia.\\n* Urnieta.\\n* Aerreko Zabalako lepoaren erdian. Eteneta II harrespil
  multzoa 200 m. HMra kokatzen da.\\n* Orria 64 (Donostia): Long. 01\u00ba 43'' 25\\\"
  Lat. 43\u00ba 12'' 00\\\" Alt. 700 m. Orria 64-54 (Urnieta): X. 584.290 Y. 4.783.755
  Z. 700\\n\\nDESKRIBAPENA\\n\\nBi harrespildun multzoa. Bertako hareharriak.\\n1.-
  Harrespila. 4,50 m. diametrokoa. 0,20 eta 0,45 m. tarteko altuerako lekukok eratzen
  dute. Azpimarragarria da, bereziki, 2 m. altuerako lekuko bat (lur-azpian dagoen
  zatiarekin 3 m.tara iristen da). Hau, aurkitu zenean, lurrean zegoen etzanda esparruaren
  kanpo, eta geroztik izan da bi alditan berriztatua. Monumentuaren iparraldeko arkua
  harriz beterik dago, honek itxura tumulurra ematen diolarik.\\n2.- Harrespila. 2,70
  m. diametrokoa. Agerian dauden 24 lekukok osatzen dute, 0,37 eta 0,28 m. tarteko
  hiru azpimarragarriak direlarik.\\n\\nHISTORIA\\n\\nHarrespilak L. PE\u00d1Ak aurkitu
  zituen 1951ean eta monolitoa J. ALTUNA eta K. MARIEZKURRENAk 1978an. Ez dira industu.\\n\\nSEKUENTZIA
  KULTURALA\\n\\nBurdin-aroa.\\n\\n1990\\n\\nISSN 0027 - 3414\\n\\nTIPO: Cromlechs
  N.\u00ba: 139 SIGLA: OM-Et.I. T.M.: Urnieta MAPA N.\u00ba: 64-4.139\\n\\nSITUACION\\n\\n*
  Estaci\u00f3n megal\u00edtica de Onyi-Mandoegi.\\n* Urnieta.\\n* En el centro del
  amplio collado conocido como Aerreko Zabala. El conjunto de cromlechs Eteneta II
  se localiza 200 m. al SW.\\n\\n* Hoja 64 (San Sebasti\u00e1n):\\n\\nLong. 01\u00ba
  43'' 25\\\"\\n\\nLat. 43\u00ba 12'' 00\\n\\nHoja 64\\n\\n-\\n\\n54 (Urnieta):\\n\\nX.
  584.290 Y. 4.783.755 Z. 700\\n\\nDESCRIPCION\\n\\nConjunto de 2 cromlechs. Areniscas
  del terreno.\\n\\n1.- Cromlech. 4,50 m. de di\u00e1metro. Compuesto por numerosos
  testigos con una altura entre 0,20 y 0,45 m., excepto uno, que sobresale excepcionalmente,
  con 2 m. de altura (contando su parte enterrada llega a los 3 m.). Este, en el momento
  de su descubrimiento, se hallaba tendido en el suelo, al exterior del recinto, y
  ha sido posteriormente restaurado en dos ocasiones. El arco septentrional del monumento
  se encuentra relleno de piedras, lo que le da una apariencia ligeramente tumular.\\n2.-
  Cromlech. 2,70 m. de di\u00e1metro. Compuesto por 24 testigos visibles entre los
  que destacan 3 de 0,37 a 0,28 m.\\n\\nHISTORIA\\n\\nLos cromlechs fueron descubiertos
  en 1951 por L. PE\u00d1A y el monolito en 1978 por J. ALTUNA y K. MARIEZKURRENA.
  No han sido excavados.\\n\\nSECUENCIA CULTURAL\\n\\nEdad del Hierro.\\n\\nBIBLIOGRAFIA\\n\\nPE\u00d1A
  BASURTO, L. (1960)\\n\\n\\\"\\n\\nAlt. 700 m.\\n\\n7. eranskina\\n\\nDONOSTIA\\n\\nSuplemento
  n.\u00ba 7\\n\\nSAN SEBASTIAN\\n\\nETENETA I\\n\\nGIPUZKOAKO KARTA ARKEOLOGIKOA\\n\\n1.
  Megalitoak\\n\\nCARTA ARQUEOLOGICA DE GIPUZKOA\\n\\n1. Megalitos\\n\\nJ. ALTUNA,
  A. ARMENDARIZ, L. DEL BARRIO, F. ETXEBERRIA, K. MARIEZKURRENA, J. PE\u00d1ALVER,
  F. ZUMALABE\""]'
