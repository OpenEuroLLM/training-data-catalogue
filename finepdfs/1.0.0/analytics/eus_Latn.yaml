  EUROPA ERDIALDETIK SALBURUARA IRISTEN DA |\\n| KATAZURIA       | BOLA GOGOR BILAKATUTA
  PASATZEN DU NEGUA   |\\n\\n2. BISOIAK SALBURUAN\\n\\nBisoiaren ilaje leun eta lodiak
