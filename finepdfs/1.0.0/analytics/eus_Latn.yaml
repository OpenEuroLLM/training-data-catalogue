  Ur arkakusoa                                 | TG2|   |   |   |   |   |   |   |   |\\n|
  ERAKUSKETA  | Bazten behin Salburua                        | E1 |   |   |   |   |   |   |   |   |\\n|             |
  Mehatxuak Salburuan                          | E2 |   |   |   |   |   |   |   |   |\\n|
  ONDOREN     | Zergatik da garrantzitsu Salburua kontserbatzea? | O4 |   |   |   |   |   |   |   |   |\\n|             |
  Bisoia babestuz Salburua babesten dugu      | O5 |   |   |   |   |   |   |   |   |\\n\\n-
  Gaitasunen araberakoa:\\n\\n1.- Zientzia, teknologia eta osasun kulturarako gaitasuna\\n   A1,
  A2, A3, I1, I2, TG1, TG2, E1, E2, O4, O5\\n\\nBizitzaren eta giza jardueren euskarri
  den espazio fisikoa behar bezala hautematea, bai eskala handitan, bai gertuko ingurunean.\\n\\nZer-nolako
  eragina duen ingurunean pertsonen presentziak, asentamenduak eta jarduerak, pertsonek
  zer aldaketa egiten dituzten ingurunean, eta aldaketa horien ondorioz zer paisaia
  sortzen diren.\\n\\nGarrantzi handikoa dela garapenaren onurak gizaki guztiengana
  helaraztea, natura-baliabideen kontserbazioa bermatzea, eta mundu mailako elkartasunari
  eta belaunaldien arteko elkartasunari eustea.\\n\\n2.- Ikasten ikasteko gaitasuna\\n   A1,
  A2, A3, I1, I2, TG1, TG2, E1, E2, O4, O5\\n\\nIkasteari ekiteko eta gero eta eraginkortasun
  eta autonomia handiagoz ikasten jarraitzeko, betiere, ikaste-jarduera hori norberaren
  helburuei eta premiei egokitzen bada.\\n\\nInformazioa banaka edo elkarlanean lortzeko
  trebetasuna izan behar du ikasleak, eta, bereziki, informazio hori norberarentzako
  jakintza bihurtzea.\\n\\n3.- Matematikarako gaitasuna\\n   I2, TG1, TG2\\n\\nZenbakiak,
  horien oinarritzko eragiketak, matematika-sinboloak eta matematikako adierazpen
  eta arrazoitze moduak erabiltzeko eta lotzea.\\n\\nEguneroko bizitzako eta laneko
  arazoak konpontzea.\\n\\n4.- Hizkuntza komunikaziorako gaitasuna\\n\\nHizkuntzaren
  erabilera, bai ahozkoa zein idatzizkoa, bai errealitatea adierazi, interpretatu
  eta hura ulertzeko egindakoa, bai jakintza eraikitzeko eta komunikatzeko egindakoa,
  bai eta pentsamoldea, emoziok eta jarrerak antolatu eta norberak erregulatzeko egindakoa.\\n\\nInformazioa
  bilatzeko, biltzeko eta prozesatzea; hala, jarduera horiek lagundu egiten dute askotariko
  asmo komunikatibo edo sorkuntzakoak dituzten testuak behar bezala ulertzzen, sortzen
  eta erabiltzen.\\n\\n5.- Informazioa tratatzeko eta teknologia digitala erabiltzeko
  gaitasuna\\n\\nTeknologia digitala erabiltzea; eskura dauden baliabide teknologikoa
  ohikotasunez erabiltzea, eguneroko bizitzaoko arazoak modu eraginkorrean konpontzea.\\n\\nInformazioa
  bilatzea, hautatzea, erregistratzea, tratatzea eta aztertzea, eta, horren barruan,
  teknika eta estrategia egokiak erabiltzea informazio hori eskuratzeko, betiere,
  informazio-iturriari eta erabilitako informazio-euskarriari erreparatuta (ahozkoa,
  inprimatua, ikus-entzunezkoa, digitala edo multimedia).\\n\\nInformazioa eskura
  izateak ez dakar, berez, jakintza. Informazioa jakintza bihurtzeko, arrazoitzelan
  bat egin behar da.\\n\\n6.- Gizarterako eta herritarutasunerako gaitasuna\\n\\nInguruneko
  balioez jabetu, horiek ebaluatu eta modu eraginkorrean eta arrazionalean berreraiki.
  Lan horren bidez, balio-sistema propio bat sortu behar da, eta horiekiko koherentziaz
  jokatu, erabaki bat hartzeko edo gatazka bati aurre egiteko.\\n\\nAskotariko jakintzak
  eta trebetasun konplexuak biltzen dira, beharrezkoak gizartearen parte har dezan,
  erabakiak har ditzan, egoera jakinetan nola jokatu hauta dezan eta egindako hautuen
  ardura har dezan.\\n\\nHerritarutasunaren jarduera-esparrua irizpide propioz erabiltzea,
  hala, bakea eta demokrazia eraikitzen laguntzeko, eta herritarren eskubide eta betebeharrak
  jarrera eraikitzailez, elkartasunez eta arduraz erabiltzeko eta betetzeko.\\n\\n7.-
  Giza eta arte kulturarako gaitasuna\\n\\nAdierazteko eta komunikatzeko bide emango
  du, eta artearen eta kulturaren errealitateak eta ekoizpenak hautemateko, ulertzeko
  eta horiekin aberasteko bidea.\\n\\nEkimena, irudimena eta sormenaz baliatu arte-kodeen
  bidez adierazteko.\\n\\n8.- Norberaren autonomiarako eta ekimenerako gaitasuna\\n\\nElkarrekin
  lotutako zenbait balio eta jarrera pertsonalen kontzentzia izatea eta horiek aplikatzea.
  Norberaren autonomiak eta ekimenak, sarri, beste pertsona batzuen parte-hartzea
  eskatzen duenez, harremanetarako, lankidetzarako eta talde-lanerako gizarte trebetasunak
  izatea.\\n\\n## 7. EKINTZAK ETA CURRICULUMAREKIN LOTURA\\n\\n| DERRIGOREZKO BIGAREN
  HEZKUNTZA | JARDUERAK |\\n|---------------------------------|-----------|\\n| Gerriko
  naturalak eta ageriko atzealdak behatzeko irizpideak. | 11, 12, TG1, TG2 |\\n| Gerriko
  naturalak ezagutzeko jakintzaharra eta interesoa. | A1, A2, A3, 11, 12, TG1, TG2,
  E1, E2, O1, O2 |\\n| Aztertuko gaietako lotura duen laborategiko experimentuak eta
  landoa-azterketak egiteko arauak eta lehiskak. | 11, 12, TG1, TG2 |\\n| Izen espereimentala
  eta landoa-azterketak egiteko interesea eta laborategiko seguratsun- eta higienaren
  arauen erespetua. | 11, 12, TG1, TG2 |\\n| Hiribildu eskanitzen dutuak eta ideiek
  biztanleei informazio-zitikirik erabiltzeko irizpideak. | E1, O1, O2 |\\n| Taldesan
  lan egitearen adeko jariera, lanak egiteko lankeidera bultzatzea eta arduruz parte
  hartzea, eta desberdintasunak onartzea, personak errespetatuz. | A1, A2, A3, 11,
  12, TG1, TG2, E1, E2, O1, O2 |\\n| Eguneroko bizitzako balioaldiak arduruz onartzeko
  eta ingurumen oinarrizko irizpideak. | A1, A2, A3, 11, 12, TG1, TG2, E1, E2, O1,
  O2 |\\n\\n### LEHENGOK KURTSOA\\n\\n| EDUKIAK: Materiaren aniztasuna. | JARDUERAK
  |\\n|---------------------------------|-----------|\\n| Uxaren garatutako kliman,
  posizionen konfigurazioan eta izaki bizidunengan. | 11, 12 |\\n| Ux geza, baldadeko
  megania: txureko ir gezaren eriesenbok eta ur hotz zamiztuen eta neuriz erabiltzearen
  garantzia. | O1, O2 |\\n| Izaki bizidunen aniztasuna: inguruneak, komunak, formak,
  elikadura, izaki bizidunen solapera, hoste eremuek. Ardoaketa eredu nagusiek: landareek
  eta animaliek. | E1, E2 |\\n| Bioizitasunaren sarrera: Euskal Herriko espazieko
  berezietak. Bioizitasunaren galera. | 11, 12 |\\n| Izaki bizidunen ezagutzako gako
  eranzkoak erabiltzeko jarraitzeak. | TG1, TG2 |\\n| Lupa eta mikroskopio optikoa
  erabiltzeko arauak. | 11, 12, TG1, TG2 |\\n| Oinarrizko zelulabakarren, landareek
  eta animaliek behatzeko eta deskribatzeko irizpideak. | O1, O2 |\\n\\n### BIGARREN
  KURTSOA\\n\\n| EDUKIAK: Materiaren eta energiaren aldaketak | JARDUERAK |\\n|---------------------------------------------|-----------|\\n|
  Posizioa gerriko naturalen eta biziketen jardueraren interakzioetan emaitza. | E1,
  E2 |\\n| Izaki bizidunen ezagutzak eta funtzio komunikak, elikadura, ugalkera eta
  haremanoa. | 11, 12, TG1, TG2 |\\n| Animalien eta landareien bizitzakoek behatzeko
  eta deskribatzeko irizpideak. | 11, 12, TG1, TG2 |\\n| Biotsera: ekosistema eta
  ekosistema. Ekosistema baten osagaiak. Faktore abiotikoak eta biotikoak. Ekosistemaren
  duen eragina eta faktore hotzet intzelazkoak. | 11, 12, E1, E2, TG1, TG2 |\\n| Ux
  geza eta itsasoko ekosistemen urratza. Lurteko ekosistematik bronuk. Euskal Herriko
  ekosistema garatutakoak. Ekosistemen mehatxuak eta bioizitasunaren galera. Euskal
  Herriko eremu babestuak. | 11, 12, TG1, TG2, E1, E2, O1, O2 |\\n| Ekosistemategiko
  aldaketak: naturaleko -migrazioak-. | A1, A2, A3, 11, 12 |\\n| Inguruko ekosistemaren
  bali buruzko landoa-azterketak errazak egiteko arauak eta teknikak. | O1, O2 |\\n\\n8.
  EBALUAKETA\\n\\n8.1. IKASLEAREN EBALUAKETA\\n\\nEdukien eta gaitasunen barneratzearen
  ebaluaketa ondorengo ardatzak kontutan izanik egingo da:\\n\\n- Bisitako jardueren
  aurretik, ikasgelan burutuko diren ariketetan eta Ataria-ko harrera gunean egingo
  den aurkezpenean baloratuko dira ikasleriaren aurre-ezagutzak, espero dituzten jakintzak
  eta euren esperientziak.\\n\\n- Bisitaldia amaitu ondoren, galdera-erantzun metodoa
  erabiliz, landutako edukiak berrikusiko dira; era berean, laginak jaso eta prestatu,
  prismatiko, lupa binokular eta mikroskopioaren erabilera gaitasunak ere baloratuko
  dira.\\n\\n- Ondorengo ikasgelako jardueretan, ingurumenaren inguruko sentsibilizazioa
  eta kontzientziazioa, ohitura aldaketa eta konpromiso eta erantzukizunak hartzea
  ere landuko da.\\n\\nIkasleriaren jarrera aldaketa ebaluatzea zail ikusten da programak
  duen denbora motzagatik eta, azken finean, helburua epe luzerako jarrera hobekuntza
  delako. Jarduera hau hezkuntza prozesu globalerako ekarpen bat gehiago da beste
  bizipen eta jakintza esperientzien artean.\\n\\n8.2. IRAKASLEAREN ALDETIKO EBALUAKETA\\n\\nIrakasleek
  fitxa baten bidez programan zehar landutako edukiak, bisitaren antolaketa eta erabiltako
  pedagogia ebaluatzen dituzte. Hautazkoa da, baina ildo honetan irakasleriaren laguntza
  asko eskertzen da proiektuaren hobekuntzan jarraitzeko.\\n\\nIrakaslearen ebaluaketa
  fitxa III. eranskinean atxiki da\\n\\n8.3. BARNE EBALUAKETA\\n\\nPrograma burutzen
  duen hezitzaile taldeak eguneroko auto-ebaluaketa egiten du jardueren amaieran,
  betiere topa ditzaketen hobekuntzarako proposamenak aurkeztuz.\\n\\n9. INFORMAZIO
  OSAGARRIA\\n\\n9.1. SALBURUA ETA ATARIARI BURUZ\\n\\nwww.ataria.es\\nblogs.vitoria-gasteiz.org/ataria/\\nwww.vitoria-gasteiz.org/anilloWeb\\n\\n9.2.
  LOTUTAKO GAIEI BURUZ\\n\\nwww.ramsar.org\\nwww.vitoria-gasteiz.org\\nwww.vitoria-gasteiz.org/cea\\nwww.birdingeuskadi.net\\nwww.euskalnatura.net\\nwww.biodiversidadvirtual.org\\n\\n10.
  ERANSKINAK\\n\\n10.1. I. ERANSKINA: Ikaslearentzako fitxa.\\n\\nSalburuako bisita
  aurretik eta ondoren egiteko ekintzak dauzkan ikasleentzako fitxak.\\n\\n10.2. II.
  ERANSKINA: Irakaslearentzako fitxa.\\n\\nSalburuako bisita aurretik eta ondoren
  egiteko ekintzak beteta dauzkan irakasleentzako fitxak.\\n\\n10.3. III. ERANSKINA:
  Irakasleen ebaluaketa.\\n\\nEgindako ekintzei buruzko irakasleentzako ebaluaketa
  fitxoa.\\n\\nSalburua Biodibertsoa da\\n\\nDBH-ko 1go eta 2. mailak\\n\\nI. ERANSKINA\\n\\nSalburua
  Biodibertsoa da\\n\\nIkasleentzako unitate didaktikoa\\nDerrigorrezko Bigarren Hezkuntzako
  Igo eta 2. mailak\\n\\nDBH\\n\\nIgo eta 2. mailak\\n\\nBISITA AURRETIK ETA ONDOREN\\n\\nCentro
  de Estudios Ambientales\\nCEA\\nLingurriko Gaiztarrako Ikastegia\\n\\n1. ZER EZAGUTZEN
  DUZU SALBURUATIK?\\n\\n1. SALBURUARI BURUZKO ESANAK. EGIA ALA GEZURRA?\\n\\n\u2610
  Salburuan aniztasun biologiko gutxiko tokia da, izan ere, hiritik hain hurbil kokatuta
  egotean, basa espezierik ez baita hurbiltzen.\\n\\n\u2610 Salburuan Arabako landareen
  1/5a bizi da.\\n\\n\u2610 Salburuak garrantzia handia du, ekialdetik Eraztun Berdea
  ixten baitu.\\n\\n\u2610 Salburuako hezegunea lehortuta egon da mende erdiz.\\n\\n\u2610
  Iberiar Penintsulako hegazti espezie guztien %40a aurkitu daiteke Salburuan.\\n\\n2.
  ETA SALBURUAN\u2026.\\n\\n2.1. Animalia eta landare ezberdin asko bizi dira?\\n\u2610
  Bai. Zeintzuk?\\n\\n\u2610 Ez\\n\\n2.2. Ekosistema ezberdineko landare eta animaliak
  bizi al dira?\\n\u2610 Bai. Adibide bat jarri.\\n\\n\u2610 Ez\\n\\n2.3. Arriskuan
  edo mehatxupean dauden landare edo animaliak bizi al dira?. Ezagutzen al duzu baten
  bat?\\n\u2610 Bai. Adibide bat jarri.\\n\\n\u2610 Ez\\n\\n3. SALBURUARA NEGUAN!\\n\\n3.1.
  Animalia hauetatik, zeintzuk **bizi dira Salburuan neguan** soilik?\\n\\n- Kopetazuria\\n-
  Hegabera\\n- Antzara\\n- Basahatea\\n- Arabazozoa\\n- Lertxuna\\n\\n3.2. Animalia
  hauetatik, zeintzuk **ez dira Salburuan bizi neguan**, baina bai beste urte sasoietan?\\n\\n-
  Miru beltza\\n- Uroiloa\\n- Ubarroia\\n- Txilinporta\\n- Kukua\\n- Enara\\n- Uhalde-enara\\n\\n3.3.
  Animalia hauetatik, zeintzuk **bizi dira neguan Salburuan**, baina ez ditugu ikusten?\\n\\n-
  Zikoina\\n- Igela\\n- Tenka\\n- Muskerra\\n- Suge biperakara\\n- Eltxoa\\n\\n3.4.
  Zer egiten dute animalia hauek neguari aurre egiteko? Lotu ezazu animalia bakoitza
  bere estrategiarekin:\\n\\n- **BISOI EUROPARRA**\\n  - Gordelekua konpartituz beroa
  bilatzen du\\n- **TRITOIA**\\n  - Ilajea zuri kolorera aldatzen du\\n- **GALAPAGOIA**\\n  -
  Lohi artean babesten da\\n- **IGARABA**\\n  - Negurako janaria pilatzen du\\n- **TRIKUA**\\n  -
  Ilajea areagotzen du\\n- **INURRIA**\\n  - Urmael hondoetan pasatzen du negua\\n-
  **GAU SAGU-ZAHARRA**\\n  - Europa erdialdetik salburuara iristen da\\n- **KATAZURIA**\\n  -
  Bola gogor bilakatuta pasatzen du negua\\n\\n2. BISOIAK SALBURUAN\\n\\nBisoiaren
  ilaje leun eta lodiak neguko hotzari aurre egiten laguntzen dio, baina ilaje hau
  izan da mehatxatuta egotearen arrazoia ere; Europako haragijale mehatxatuenetako
  da, katamotzarekin batera. Katamotza jadanik ez dago gure artean, baina bisoia oraindik
  bai. Nola lagun diezaiokegu?\\n\\nLehenik eta behin, bera hobeto ezagutuz. 4-5nakako
  taldeetan bisoiari buruzko informazioa bila ezazue eta mural edo kartel bat prestatu,
  ikasgelan edo pasilloan jartzeko. Kartel horretan ondorengo galderari erantzuten
  saiatu behar duzue: Zergatik dago mehatxupean bisoi europarra?\\n\\nIturriak:\\n\\nhttp://www.mma.es/portal/secciones/biodiversidad/inventarios/inb/atlas_mamiferos/pdf/52_carni.pdf\\n\\nhttp://iberianature.com/natura_iberica/tag/humedales-de-salburua/\\n\\nhttp://www.elcorreo.com/alava/20081012/alava/salburua-20081012.html\\n\\nhttp://www.alava.net/cs/Satellite?c=DPA_Generico_FA&cid=1193046650221&language=es_ES&pageid=1193046487953&pagename=DiputacionAlava%2FDPA_Generico_FA%2FDP_A_generico\\n\\nSalburua
  Biodibertsoa da\\n\\nDBH-ko igo eta z. mailak\\n\\nII. ERANSKINA\\n\\nSalburua Biodibertsoa
  da\\n\\nIkasleentzako unitate didaktikoa\\nDerrigorrezko Bigarren Hezkuntzako 1go
  eta 2. mailak\\n\\nDBH\\n\\n1go eta 2. mailak\\n\\nBISITA AURRETIK ETA ONDOREN\\n\\nIRAKASLEARENTZAKO
  ALEA\\n\\nCentro de Estudios Ambientales\\nCEA\\nInurri gaitzarako Ikastegia\\n\\n1.
  ZER EZAGUTZEN DUZU SALBURUATIK?\\n\\n1. SALBURUARI BURUZKO ESANAK. EGIA ALA GEZURRA?\\n\\nG
  Salburuan aniztasun biologiko gutxiko tokia da, izan ere, hiritik hain hurbil kokatuta
  egotean, basa espezierik ez baita hurbiltzen.\\n\\nE Salburuan Arabako landareen
  1/5a bizi da.\\n\\nG Salburuak garrantzia handia du, ekialdetik Eraztun Berdea ixten
  baitu.\\n\\nE Salburuako hezegunea lehortuta egon da mende erdiz.\\n\\nE Iberiar
  Penintsulako hegazti espezie guztien %40a ikus daiteke Salburuan.\\n\\n2. ETA SALBURUAN\u2026.\\n\\n2.1.
  Animalia eta landare ezberdin asko bizi dira?\\n\\n[X] Bai. Zeintzuk? Salburuan,
  hezegunearen ekosistemara lotutako fauna eta flora aniztasun handia bizi da. Espezie
  esanguratsuenak hegazti urtarrak eta migratzailreak, bisoi europarra, oreina eta
  urmael-ingurunetako berezko landaretza dira.\\n\\n\u2610 Ez\\n\\n2.2. Ekosistema
  ezberdineko landare eta animaliak bizi al dira?\\n\\n[X] Bai. Adibide bat jarri.
  Ekosistema urtar, istildu eta lehortarren txandaketak landare eta animalia dibertsitate
  handia erakartzen du. Adibideak:\\n   Ingurune urtarra: Errutiloa, tenka, ...\\n\u2610
  Ez\\n   Ingurune istildua: Lezkadia, baso-igel jauskaria, basahatea, lertxuna, ...\\n   Ingurune
  lehorra: Hariztia, larreak, saguzarra, oreina, ...\\n\\n2.3. Arriskuan edo mehatxupean
  dauden landare edo animaliak bizi al dira?\\nEzagutzen al duzu baten bat?\\n\\n[X]
  Bai. Adibide bat jarri. Salburuan hainbat espezie mehatxatu aurkitu ditzakegu: baso-igel
  jauskaria, dortoka istilzalea, ferra-saguzarra, bisoi europarra, igaraba, eta hegaztien
  artean: txilinporta, murgil handia, lertxuna, lezkaria, mokozabala, ...\\n\u2610
  Ez\\n\\n3. SALBURUARA NEGUAN!\\n\\n3.1. Animalia hauetatik, zeintzuk **bizi dira
  Salburuan neguan** soilik?\\n\\nKopetazuria  Hegabera  Antzara  Basahatea  Arabazooza  Lertxuna\\n\\n(Beste
  3 hegaztiak Salburuan bizi dira ere, baina urte osoan zehar)\\n\\n3.2. Animalia
