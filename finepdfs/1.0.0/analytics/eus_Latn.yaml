  Ba tzordeak one tsia (9. or.).\\n\\nF SAILA:\\n\\nGalderak:\\n\\n\u2014Galdera,
  Iru\u00f1eko espe txean mediku eta erizain berariazkoek duten arreta-ordutegiari
  buruzkoa. Cristina Ibarrola Guill\u00e9n andreak egin du (10. or.).\\n\u2014Galdera,
  psikiatra batek, psikologo batek eta osasun mentaleko erizain espezialista batek
  osatutako talde bat Iru\u00f1eko espe txeko osasun arretara gehi tzeari buruzkoa.
  Cristina Ibarrola Guill\u00e9n andreak egin du (11. or.).\\n\u2014Galdera, Iru\u00f1eko
  espe txeko presoen osasun arretan izandako eta izanen diren hobekun tzei buruzkoa.
  Cris\u00ad tina Ibarrola Guill\u00e9n andreak egin du (11. or.).\\n\u2014Galdera,
  mediku erretiratuen kontratazioei buruzkoa. Cristina Ibarrola Guill\u00e9n andreak
  egin du (12. or.).\\n\u2014Galdera, bularreko eta koloneko minbizien baheketa-programetan
  izandako a tzerapenei buruzkoa. Cristina Ibarrola Guill\u00e9n andreak egin du (13.
  or.).\\n\u2014Galdera, Iru\u00f1eko Hizkun tza Eskola Ofizialaren patioan eginiko
  pintadei buruzkoa. Pedro Jos\u00e9 Gonz\u00e1lez Felipe jaunak egin du (13. or.).\\n\u2014Galdera,
  Nafarroako Gobernuaren zenbait telefonotan artatu gabeko deiei buruzkoa. Cristina
  Ibarrola Gui\u00ad ll\u00e9n andreak egin du (14. or.).\\n\u2014Galdera, eutanasia
  arau tzen duen maia tzaren 24ko 3/2021 Lege Organikoak aipa tzen duen objektoreen
  erregistroa sor tzeari buruzkoa. Cristina Ibarrola Guill\u00e9n andreak egin du
  (15. or.).\\n\\nA saila: FORU LEGE PROIEKTUAK\\n\\nForu Lege proiektua, Nafarroako
  Abereen Osasunari buruzko azaroaren 16ko 11/2000 Foru Legea alda tzekoa.\\n\\nOSOKO
  BILKURAK EZE TSI EGIN DU\\n\\nNafarroako Parlamentuko Osoko Bilkurak, 2022ko mar
  txoaren 3an egindako bileran, eze tsi egin du Nafarroako Abereen Osasunari buruzko
  azaroaren 16ko 11/2000 Foru Legea alda tzeko Foru Lege proiektua.\\n\\nLegebil tzarreko
  Erregelamenduko 114.1 artiku\u00ad luan ezarritakoa betez, erabaki hau argitara
  dadin agin tzen da.\\n\\nIru\u00f1ean, 2022ko mar txoaren 4an\\n\\nLehendakaria:
  Unai Hualde Iglesias\\n\\nForu Lege proiektua, Nafarroako Foru Ogasunei buruzko
  mar txoaren 10eko 2/1995 Foru Legea alda tzekoa.\\n\\nOSOKO BILKURAK OSOKO ZUZENKETA
  EZE TSI DU\\n\\nNafarroako Parlamentuko Osoko Bilkurak, 2022ko mar txoaren 3an egindako
  bileran, eze tsi egin du Nafarroako Foru Ogasunei buruzko mar \u00ad txoaren 10eko
  2/1995 Foru Legea alda tzeko Foru Lege proiektuari Navarra Suma talde parlamenta\u00ad
  rioak aurkeztutako osoko zuzenketa.\\n\\nHorrenbestez, Legebil tzarreko Erregelamen
  \u00ad duaren 132.5 artikuluan xedatuarekin bat, proiek\u00ad tua Lurralde Kohesiorako
  Ba tzordeari igorri zaio.\\n\\nIru\u00f1ean, 2022ko mar txoaren 4an Lehendakaria:
  Unai Hualde Iglesias\\n\\n3\\n\\nForu Lege proiektua, ezar tzen duena nola banatu
  transferen tzia arrunten bidez toki-erakundeek Nafarroako tributuetan parte har
  tzeko duten fun tsa.\\n\\nOSOKO BILKURAK OSOKO ZUZENKETA EZE TSI DU\\n\\nNafarroako
  Parlamentuko Osoko Bilkurak, 2022ko mar txoaren 3an egindako bileran, eze tsi egin
  du Navarra Suma talde parlamentarioak aur\u00ad keztutako osoko zuzenketa, toki-erakundeek
  Nafarroako tributuetan parte har tzeko duten fun tsa transferen tzia arrunten bidez
  nola banatu ezar tzen duen Foru Lege proiektuari aurkeztutakoa.\\n\\nHorrenbestez,
  Legebil tzarreko Erregelamen \u00ad duaren 132.5 artikuluan xedatuarekin bat, proiek\u00ad
  tua Lurralde Kohesiorako Ba tzordeari igorri zaio.\\n\\nIru\u00f1ean, 2022ko mar
  txoaren 4an Lehendakaria: Unai Hualde Iglesias\\n\\nB saila: FORU LEGE PROPOSAMENAK\\n\\nForu
  Lege pro po sa me na, babestutako etxebizi tza ordainerrazen parke bat Nafarroako
  Foru Komunitatean susta tzekoa.\\n\\nOSOKO BIL KU RAK AIN TZAT HAR TUA\\n\\nNafarroako
  Parlamentuko Osoko Bilkurak, 2022ko mar txoaren 3an egindako bileran, era ba ki
  zuen Babestutako etxebizi tza ordainerrazen parke bat Nafarroako Foru Komunitatean
  susta tzeko Foru Lege proposamena ain tzat har tzea. Foru Lege pro po sa men hori
  Alderdi Sozialista eta Geroa Bai talde parlamentarioek eta Podemos-\\n\\nAhal Dugu
  foru parlamentarien elkarteak aur kez tu zuten, eta 2022ko urtarrilaren 28ko 10.
  Nafa rro a \u00ad ko Par la men tu ko Aldiz ka ri Ofi zi a le an argi ta ra tu zen.\\n\\nIru
  \u00f1e an, 2022ko mar txoaren 4an\\n\\nLehen da ka ria: Unai Hualde Iglesias\\n\\nForu
  Lege pro po sa me na, babestutako etxebizi tza ordainerrazen parke bat Nafarroako
  Foru Komunitatean susta tzekoa.\\n\\nZUZENKETAK AURKEZTEKO EPEA\\n\\nNafarroako
  Parlamentuko Mahaiak, 2022ko mar txoaren 7an egindako bilkuran, Erabaki hau hartu
  zuen, besteak beste:\\n\\nLegebil tzarrak, 2022ko mar txoaren 3an egin\u00ad dako
  Osoko Bilkuran, erabaki zuen Babestutako etxebizi tza ordainerrazen parke bat Nafarroako
  Foru Komunitatean susta tzeko Foru Lege propo\u00ad samena ain tzat har tzea. Foru
  Lege pro po sa men hori Alderdi Sozialista eta Geroa Bai talde parla\u00ad mentarioek
  eta Podemos-Ahal Dugu foru parla\u00ad mentarien elkarteak aur kez tu zuten, eta
  2022ko urtarrilaren 28ko 10. Nafa rro a ko Par la men tu ko Aldiz ka ri Ofi zi a
  le an argi ta ra tu zen (10-22/PRO00001).\\n\\nHori horrela, Legebil tzarreko Erregelamenduko
  148. artikuluan ezarritakoarekin bat, Eledunen Ba \u00ad tzarrari en tzun ondoren,
  hona\\n\\nERABAKIA:\\n\\n1. Xeda tzea Babestutako etxebizi tza ordaine\u00ad rrazen
  parke bat Nafarroako Foru Komunitatean\\n\\nsusta tzeko Foru Lege proposamena prozedura
  arruntari jarraikiz izapidetu dadin.\\n\\n2. Proposamen horri buruz irizpena emateko
  ahalmena Lurralde Antolamenduko, E txebizi tzako, Paisaiako eta Proiektu Estrategikoetako
  Ba \u00ad tzordearen esku uztea.\\n3. Erabaki hau Nafarroako Parlamentuko Aldizkari
  Ofizialean argitara dadin agin tzea.\\n\\nErabaki hau argitara tzen denetik hamabost
  egun balioduneko epe bat hasiko da, 2022ko apirilaren 4ko eguerdiko hamabietan bukatuko
  dena. Epe horretan, Erregelamenduko 128. eta 148. artikuluetan ezarritakoarekin
  bat, talde parla\u00ad mentarioek, foru parlamentarien elkarteek eta foru parlamentariek
  zuzenketak aurkeztu ahalko diz\u00ad kiote proposamenari.\\n\\nIru\u00f1ean, 2022ko
  mar txoaren 7an\\n\\nLehendakaria: Unai Hualde Iglesias\\n\\nE saila:\\n\\nINTERPELAZIOAK,
  MOZIOAK ETA ADIERAZPEN POLITIKOAK\\n\\nInterpelazioa, gazteen tzako etxebizi tzen
  alorreko politikari buruzkoa.\\n\\n\u00c1NGEL ANSA ECHEGARAY JAUNAK AURKEZTU DU\\n\\nNafarroako
  Parlamentuko Mahaiak, 2022ko mar txoaren 7an egindako bilkuran, Eledunen Ba \u00ad
  tzarrari en tzun ondoren, erabaki hau hartu zuen, besteak beste:\\n\\n1. Iza pi
  de tze ko onar tzea gazteen tzako etxebizi tzen alorreko politikari buruz \u00c1ngel
  Ansa Echegaray jaunak aur kez tu ri ko interpelazioa.\\n2. Interpelazio hori Osoko
  Bil ku ran iza pi de \u00ad tzea.\\n3. Nafa rro a ko Par la men tu ko Aldiz ka ri
  Ofi zi a le \u00ad an argi ta ra dadin agin tzea.\\n\\nIru\u00f1ean, 2022ko mar
  txoaren 7an\\n\\nINTERPELAZIOAREN TES TUA\\n\\nNafarroako Gorteetako kide den eta
  Navarra Suma (NA+) talde parlamentarioari atxikita dago\u00ad en \u00c1ngel Ansa
  Echegaray jaunak, Legebil tzarreko Erregelamenduko 184. artikuluan xedatuaren babesean,
  gazteen tzako etxebizi tzei buruzko interpelazio hau aurkezten dio Nafarroako Gober\u00ad
  nuari, Osoko Bilkuran eztabaida tzeko.\\n\\nNafarroako gazteek eman tzipa tzeko
  benetako zailtasunak aurki tzen dituzte. Halatan, interesga\u00ad rria da jakitea
  zer neurri abiaraziko duen Gober\u00ad nuak gai horren inguruko gaurko egoera azter
  \u00ad tzeko eta identifika tzeko, eta hura hobetuko duten ekin tzak plantea tzeko.\\n\\nIru\u00f1ean,
  2022ko mar txoaren 1ean\\n\\nLehen da ka ria: Unai Hualde Iglesias\\n\\nForu parlamentaria:
  \u00c1ngel Ansa Echegaray\\n\\nMozioa. Horren bidez, Nafarroako Parlamentuak premia
  tzen du ez ener\u00ad gia nuklearra ez gasa ez daitezen har energia berde bezala.\\n\\nMIKEL
  ASIAIN TORRES JAUNAK AURKEZTU DU\\n\\nNafa rro a ko Par la men tu ko Mahai ak, 2022ko
  mar txoaren 7an egin da ko bil ku ran, Ele du nen Ba \u00ad tza rra ri en tzun ondo
  ren, hurren go era ba kia hartu zuen, bes te ak beste:\\n\\n1. Izapide tzeko onar
  tzea Mikel Asiain Torres jaunak aurkezturiko mozioa, zeinaren bidez Nafa\u00ad rroako
  Parlamentuak premia tzen baitu ez energia nuklearra ez gasa ez daitezen har energia
  berde bezala.\\n2. Nafarroako Parlamentuko Aldizkari Ofiziale\u00ad an argitara
  dadin agin tzea.\\n3. Mozioa Osoko Bilkuran izapide tzea, eta zuzenketak aurkezteko
  epea buka tzea eztabaidari ekiteko bilkura-egunaren aurrekoaren eguerdiko hamabietan.\\n\\nIru
  \u00f1e an, 2022ko mar txoaren 7an\\n\\nLehendakaria: Unai Hualde Iglesias\\n\\nMOZIOAREN
  TESTUA\\n\\nGeroa Bai talde parlamentarioko foru parla\u00ad mentari Mikel Asiain
  Torres jaunak, Legebil \u00ad tzarreko Erregelamenduan xedatuaren babesean, honako
  mozio hau aurkezten du, Legebil tzarreko Osoko Bilkuran eztabaida tzeko.\\n\\nGeroa
  Baik beti azpimarratu du Europa eraiki \u00ad tzeko prozesuan erregioek burutu behar
  duten papera \u2014paper aktiboa, garran tzi tsua\u2014. Ibilbide horretan Nafarroak
  egile nagusia izan behar du eta bere papera jokatu. Bere gidoirik ez duen ikus\u00ad
  le hu tsa izan gabe.\\n\\nHori izan da beti gure helburuetako bat. Euro\u00ad pazaletasun
  zin tzoa, baina parte-har tzailea, inoiz ez pasiboa.\\n\\nHalaxe frogatu genuen
  egin tzen bidez joan den legegin tzaldian, aldaketaren legegin tzaldian, gure erkidegoak
  Bruselan duen bulegoa berriro irekiz, Nafarroako benetako enbaxada izateko ikuspegia\u00ad
  rekin, eta Akitaniarekin eta Euskal Autonomia Erkidegoarekin eratutako Euroeskualdean
  sartuz.\\n\\nEz zaigu arro tz, eta ez zaigu izan behar, Euro\u00ad pako erakundeetan
  erabaki tzen diren gai ekono\u00ad miko, sozial edo politikoetatik bat bakarra ere.\\n\\nEuropako
  taxonomia dugu ingurumenaren aldetik jasangarriak diren jarduera ekonomikoak sailka
  tzeko sistema bat, halako tzat jo tzen ahal diren guztiak identifika tzen dituena,
  bai eta jo tzen ezin direnak ere. Era horretan bila tzen da inberti \u00ad tzaileek
  definizio baliagarri bat izan dezaten, jar\u00ad duera jasangarrietan inberti tzerakoan
  segurtasun handiagoa bermatuko diena.\\n\\nBaina duela gu txi Europako Ba tzordeak
  propo\u00ad samen bat aurkeztu du, taxonomian, alegia, ingu\u00ad rumenaren aldetik
  jasangarriak diren jardueretan, energia nuklearra eta gasetik datorrena sar tzeko,
  energia \\\"berde\\\" gisa. Proposamen horren a tzean Fran tzia eta Alemania bezalako
  herrialdeen intere\u00ad sak ezkuta tzen dira.\\n\\nZalan tzarik gabe, desadostasun
  osoa erakus\u00ad ten du Europako Itun Berdearekiko eta kontinente\u00ad aren deskarbonizazioranzko
  ibilbidearekiko, hel\u00ad buru argiak betez jada ezarri eta one tsi den egutegi
  batean.\\n\\nGainera, prozesu horretan a tzerapauso larria da, Batasuneko herritar
  guztiendako mezu guztiz kontraesankorra, atxikimendu eza ekar lezakeena, klima-aldaketaren
  aurkako borrokan eta, beraz, gure planetaren biziraupenean hain erabakigarria den
  gai batean.\\n\\nHori dela-eta, honako erabaki proposamen hau aurkezten dugu:\\n\\n1.
  Nafarroako Parlamentuak premia tzen du ez energia nuklearra ez gasa ez daitezen
  har energia berde bezala eta, ondorioz, ez Europako taxono\u00ad mia delakoan sar
  tzeko gai ere.\\n2. Nafarroako Parlamentuak Nafarroako Gobernua premia tzen du,
  lanean jarrai dezan energia-mix bat ezar tzeko, Nafarroan ekoiztutako energia berriztagarrietan
  oinarritua, energia-jasan\u00ad garritasuna eta prezioen egonkortasuna bermatu\u00ad
  ko dutenak.\\n3. Nafarroako Parlamentuak Nafarroako eta Espainiako Gobernuak premia
  tzen ditu, behar diren plan eta estrategiak ezar di tzaten, berma tze aldera ekonomiaren
  deskarbonizaziora eramanen gaituen energia tran tsizioa alderdi sozialetan jus\u00ad
  tua izanen dela eta etorkizuneko belaunaldiei begira ez duela ezbaian jarriko ongizate
  estatu oso bat.\\n\\nIru\u00f1ean, 2022ko otsailaren 28an\\n\\nForu parlamentaria:
  Mikel Asiain Torres\\n\\nMozioa. Horren bidez, Nafarroako Gobernua premia tzen da
  jardun iraun\u00ad korreko programa bat landu dezan, Foru Komunitateko ospitale
  publi\u00ad koetan kultur ekin tzak egitekoa, ongizate emozionalaren tzat neurri
  onuragarriak diren aldetik.\\n\\nCARLOS MENA BLASCO JAUNAK AURKEZTU DU\\n\\nNafa
  rro a ko Par la men tu ko Mahai ak, 2022ko mar txoaren 7an egin da ko bil ku ran,
  Ele du nen Ba \u00ad tza rra ri en tzun ondo ren, hurren go era ba kia hartu zuen,
  bes te ak beste:\\n\\n1. Izapide tzeko onar tzea Carlos Mena Blasco jaunak aurkezturiko
  mozioa, zeinaren bidez Nafa\u00ad rroako Gobernua premia tzen da jardun iraunko\u00ad
  rreko programa bat landu dezan, Foru Komunita\u00ad teko ospitale publikoetan kultur
  ekin tzak egitekoa, ongizate emozionalaren tzat neurri onuragarriak diren aldetik.\\n2.
  Nafarroako Parlamentuko Aldizkari Ofiziale\u00ad an argitara dadin agin tzea.\\n3.
  Mozioa Osoko Bilkuran izapide tzea, eta zuzenketak aurkezteko epea buka tzea eztabaidari
  ekiteko bilkura-egunaren aurrekoaren eguerdiko hamabietan.\\n\\nIru \u00f1e an,
  2022ko mar txoaren 7an\\n\\nLehendakaria: Unai Hualde Iglesias\\n\\nMOZIOAREN TESTUA\\n\\nNafarroako
  Alderdi Sozialista talde parlamen\u00ad tarioko Carlos Mena Blasco jaunak, Legebil
  \u00ad tzarreko Erregelamenduan ezarritakoaren babe\u00ad sean, honako mozio hau
  aurkezten du, Osoko Bilkuran eztabaida tzeko. Mozioaren bidez, Nafa\u00ad rroako
  Gobernua premia tzen da jardun iraunko\u00ad rreko programa bat landu dezan, Foru
  Komunita\u00ad teko ospitale publikoetan kultur ekin tzak egitekoa, ongizate emozionalaren
  tzat neurri onuragarriak diren aldetik.\\n\\nArtearen eta ongizate emozionalaren
  eta fisi\u00ad koaren arteko lotura ez da batere berria. Osasu\u00ad naren Mundu
  Erakundearen Europarako Eskualde Bulegoak bere azken  txostenean artea eta kultura
  osasun lagun tzan sar tzeko gomendioa egiten du. Ez da norabide horretatik doan
  jarraibide bakarra;\\n\\nNorvegiako Zien tzia eta Teknologiako Uniber \u00ad tsitateko
  iker tzaileek, 20 urtetik 80ra bitarteko 50.000tik gora helduren laginarekin, frogatu
  zuten jarduera kultural guztiek eragin positiboa dutela bizi tzarekiko gogobetetasunean,
  depresio eta an \u00ad tsietate mailetan eta osasun onean.\\n\\nAzterlanak bat datoz
  esatean jarduera kultura\u00ad lak bizialdia luzatu, gizartera tzea hobetu eta parte-har
  tze soziala areagotu ahal duela. Gainera, osasun mental eta fisikoaren egoera onaren
  adie\u00ad razlea da.\\n\\nOMEtik bertatik adierazten da arteek konpon\u00ad bide
  ba tzuk eskaini ahal dituztela, jardun mediku arruntak orain arte eraginkortasunez
  gauzatu ezin izan dituenak. Halaber, gobernuei dei egiten die jarduketa protokoloak
  ezar di tzaten, osasun siste\u00ad maren eta inguru artistikoaren arteko harremana\u00ad
  ren mesederako.\\n\\nHorregatik guztiagatik, sozialisten talde parla\u00ad mentarioak
  honako erabaki proposamen hau aur\u00ad kezten du:\\n\\n\u2013 Jardun iraunkorreko
  programa bat lan tzea, Nafarroako ospitale publikoetan kultur ekin tzak egitekoa,
  ongizate emozionalaren tzat neurri onu\u00ad ragarriak diren aldetik.\\n\u2013 Jarduera
  kulturalen plan bat presta tzea, bereziki Nafarroako ospitaletako pediatria unitate\u00ad
  etan ingresatuta dauden haurrei zuzenduak.\\n\u2013 Ospitale eta osasun arloko guneak
  jarduketa artistikoekin gai tzea, gune gizatiarragoak eta beharrizan emozionalei
  egokituagoak izan daite\u00ad zen.\\n\u2013 Oinarrizko Osasun Lagun tzatik \\\"errezeta
  kul\u00ad turala\\\" ezar tzea, jendearen oreka eta osasun mentala errazteko tresna
  gisa.\\n\\nIru\u00f1ean, 2022ko mar txoaren 1ean\\n\\nForu parlamentaria: Carlos
  Mena Blasco\\n\\nErabakia. Horren bidez, Nafarroako Gobernua premia tzen da Nafarroan
  atletismoko pista estali bat eraiki tzeko proiektua bul tza dezan.\\n\\nKULTURA
  ETA KIROL BA TZORDEAK ONE TSIA\\n\\nNafa rro a ko Par la men tu ko Kultura eta Kirol
  Ba \u00ad tzordeak, 2022ko mar txoaren 2an egin da ko bile\u00ad ran, honako era
  ba ki hau one tsi zuen: \\\"Horren bidez, Nafarroako Gobernua premia tzen da Nafa\u00ad
  rroan atletismoko pista estali bat eraiki tzeko proiektua bul tza dezan\\\".\\n\\nLege
  bil tza rre ko Erre ge la men du ko 114. arti ku \u00ad lu an eza rri ta koa betez,
  aipa tu era ba kia Nafa rro a \u00ad ko Par la men tu ko Aldiz ka ri Ofi zi a le
  an argi ta ra dadin agin tzen dut. Hona tes tua:\\n\\n\\\"Nafarroako Parlamentuak
  Nafarroako Gober\u00ad nua premia tzen du albait lasterren abiaraz di tzan Nafarroan
  atletismoko pista estali bat eraiki tzeko izapideak, hartara beteko baitira Nafarroan
  beha\u00ad rrezkoa den premia bat nahiz Nafarroako Parla\u00ad mentuak 2019ko abenduan
  adierazitako boronda\u00ad tea\\\".\\n\\nIru\u00f1ean, 2022ko mar txoaren 3an\\n\\nLehendakaria:
  Unai Hualde Iglesias\\n\\nErabakia. Horren bidez, Nafarroako Gobernua premia tzen
  da abian jar dezan, albait lasterren jarri ere, musikaren arloko profesionalendako
  lagun tza zuzenen lerro bat, eta sektorearen jarduera berma dezan.\\n\\nKULTURA
  ETA KIROL BA TZORDEAK ONE TSIA\\n\\nNafa rro a ko Par la men tu ko Kultura eta Kirol
  Ba \u00ad tzordeak, 2022ko mar txoaren 2an egin da ko bile\u00ad ran, honako era
  ba ki hau one tsi zuen: \\\"Horren bidez, Nafarroako Gobernua premia tzen da abian
  jar dezan, albait lasterren jarri ere, musikaren arloko profesionalendako lagun
  tza zuzenen lerro bat, eta sektorearen jarduera berma dezan\\\".\\n\\nLege bil tza
  rre ko Erre ge la men du ko 114. arti ku \u00ad lu an eza rri ta koa betez, aipa
  tu era ba kia Nafa rro a \u00ad ko Par la men tu ko Aldiz ka ri Ofi zi a le an argi
  ta ra dadin agin tzen dut. Hona tes tua:\\n\\n\\\"Nafarroako Parlamentuak Nafarroako
  Gober\u00ad nua premia tzen du:\\n\\n1. Albait lasterren abiaraz dezan musikaren
  arloko profesionalendako lagun tza zuzenen lerro bat, sektoreko profesional autonomoen,
  enpresen nahiz entitateen jarduera mantendu ahal izan dadin; izan ere, pandemiak
  eragindako krisitik heldu den diru-sarreren jai tsiera dela-eta kolokan ikusi dute
  beren jarduera ekonomiko profesionala\u00ad ren iraupena.\\n\\n2. Ekitaldien plangin
  tza bat taxutu dezan sek\u00ad toreko eragileekin batera, egoera epidemiologiko\u00ad
  ak izan di tzakeen eszenatoki ezberdinetara egoki\u00ad tua, halako moduan non ekitaldi
  horiek beste gune, edukiera edo baldin tza ba tzuetan egin ahal izanen baitira eta
  ekonomikoki bideragarriak iza\u00ad nen baitira susta tzaileen tzat ere\\\".\\n\\nIru\u00f1ean,
  2022ko mar txoaren 3an\\n\\nLehendakaria: Unai Hualde Iglesias\\n\\nF saila: GAL
