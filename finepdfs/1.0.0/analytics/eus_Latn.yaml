  |        |\\n\\n### I. Desbiderapenen Azterketa\\n\\nAurrekontu-zenbatekoak gauzatutako
  saldoekin alderatu ziren partida konkreten bidez. Atzemandako desbiderapenak aztertu
  ziren eta desbiderapen esanguratsuenen artean, honakoak aipa ditzakegu.\\n\\n###
  I. An\u00e1lisis de las Desviaciones\\n\\nLos comentarios a las desviaciones m\u00e1s
  significativas en la comparaci\u00f3n de los importes presupuestados con los saldos
  realizados, a nivel de partidas concretas, se detallan a continuaci\u00f3n:\\n\\n1.-
  Kapitaleko Aurrekontua\\n\\n1.1. Ekitaldi doituko emaitza negatiboak\\n\\nAurrekontu-zenbatekoa
  ekitaldirako aurreikusi zen defizitan oinarritzen da, kontuan izanda aurrekontuko
  aldaketa (50.000,00 euro), (2.589.652,00 euro), ibilgetuaren amortizazioen zifran
  (63.882,00 euro) eta ekitaldiko emaitzetara insuldatutako kapitaleko diru-laguntzen
  bidez (63.882,00 euro) zuzentzen dena oinarritzat. Hala ere, gauzatutako zenbatekoa
  ekitaldian lortutako defizitaren (2.412.029,53 euro) araberakoa da, ibilgetuaren
  amortizazioen zifran (59.729,01 euro) eta ekitaldiko emaitzetara insuldatutako kapitaleko
  diru-laguntzen bidez (59.729,01 euro) zuzentzen dena.\\n\\nNahiz eta behin-betiko
  aurrekontua eta erreal saldoaren arteko desbideraketa 177.622,47 eurokoa izan, kontabilizatutako
  itzuli beharreko kopurua galerak konpontsatzeko gehiegizko ekarpena 177.472,47 eurokoa
  da. Aldea hau sortzen da zeren nahiz eta ekitaldiko galerak konpensatzeko arlo publiko
  ekarpena 2.589.652,00 aurrekontuta zegoen, azkenik 2.589.502,00 euro eskatu egin
  dira (150,00 euro gutxiago).\\n\\nAldagai honetako desbiderapenaren zenbatekoa,
  nagusiki, hornikuntzak, langileen gastuak eta kanponko zerbitzuetako partidetan
  sortu da, partida hauek aurreikusitakoak baino txikiagoak izan baitira.\\n\\n1.2.
  Ibilgetu immateriala eta materiala\\n\\nAzterketa inbertsio osoa kontuan hartuta
  egin behar da. Azkenean egindako inbertsioak aurreikusi baino gutxiago izan dira.\\n\\n1.3.
  B.F.A.ren Ekarpenak\\n\\nB.F.A.k 2015erako onetsi zuen aurrekontu guztia erabili
  ez delako sortu da aldea. Hau dela eta, gehiegizko finantzaketa egon da eta, beraz,
  Erakundeak B.F.A.rekin duen zorrak, Ogasun sailara itzuli behar dela, 177.622,47
  eurok.\\n\\n1.4. Kapitaleko diru-laguntzak\\n\\nAldaketa hori desbideratzeko, ibilgetu
  material eta ezmaterialaren atalean izandako aldaketa desbideratu behar da lehenbizi.\\n\\n1.-
  Presupuesto de Capital\\n\\n1.1. Resultados negativos del ejercicio ajustado\\n\\nEl
  importe presupuestado, se basa en el d\u00e9ficit previsto para el ejercicio teniendo
  en cuenta la modificaci\u00f3n presupuestaria (de 50.000,00 euros), (2.589.652,00
  euros) y corregido en la cifra de las amortizaciones del inmovilizado (63.882,00
  euros) y por las subvenciones de capital transferidas a resultados del ejercicio
  (63.882,00 euros). Sin embargo, el importe realizado, se deduce por el d\u00e9ficit
  alcanzado en el ejercicio (2.412.029,53 euros) corregido en la cifra de las amortizaciones
  del inmovilizado (59.729,01 euros) y por las subvenciones de capital transferidas
  a resultados del ejercicio (59.729,01 euros).\\n\\nAunque el importe de la desviaci\u00f3n
  producida entre el presupuesto definitivo y el saldo real es 177.622,47 euros, la
  cantidad a devolver por exceso de aportaci\u00f3n para compensar p\u00e9rdidas contabilizada
  asciende a 177.472,47 euros. Esta diferencia surge debido a que aunque se presupuest\u00f3
  como aportaci\u00f3n del sector p\u00fablico para compensar p\u00e9rdidas del ejercicio
  2.589.652,00 euros, se ha solicitado finalmente 2.589.502,00 euros (150,00 euros
  menos).\\n\\nEl importe de la desviaci\u00f3n en esta variable se produce, fundamentalmente,
  en las partidas de aprovisionamientos, gastos de personal y servicios exteriores,
  que han sido finalmente menores a las previstas.\\n\\n1.2. Inmovilizado intangible
  y material\\n\\nEl an\u00e1lisis hay que hacerlo teniendo en cuenta el total de
  la inversi\u00f3n. Las inversiones finalmente realizadas han sido menores a las
  previstas.\\n\\n1.3. Aportaciones de la D.F.B.\\n\\nLa diferencia se deriva del
  hecho de no haberse materializado la totalidad del presupuesto aprobado por la D.F.B.
  para el ejercicio 2015, origin\u00e1ndose, en consecuencia, un exceso de financiaci\u00f3n
  que debe ser devuelto al departamento de Hacienda, por importe de 177.622,47 euros.\\n\\n1.4.
  Subvenciones de capital\\n\\nLa desviaci\u00f3n de esta variable est\u00e1 condicionada
  a la sufrida en el apartado referente a inmovilizado material e intangible.\\n\\nB.F.A.k
  2015erako onetsi zuen aurrekontu guztia erabili ez delako sortu da aldea, ibilgetuko
  inbertsioarako. Hau dela eta, gehiegizko finantzaketa egon da eta, beraz, Erakundeak
  B.F.A.rekin duen zorrak, Ogasun sailara itzuli behar dela, 4.523,46 eurok.\\n\\nLa
  diferencia se deriva del hecho de no haberse materializado la totalidad del presupuesto
  aprobado por la D.F.B. para el ejercicio 2015 para inversi\u00f3n en inmovilizado,
  origin\u00e1ndose, en consecuencia, un exceso de financiaci\u00f3n que debe ser
  devuelto al departamento de Hacienda, por importe de 4.523,46 euros.\\n\\n### 1.5.
  Kapital korrontearen aldaketa\\n\\n|                      | Hasierako aurrekontua
  | Aldatua | Behin betiko aurrekontua | Buruturiko saldoa | Desb. zenbatekoa | %
  Desv. |\\n|----------------------|-----------------------|---------|--------------------------|-------------------|------------------|--------|\\n|
  **Izakinak**         | ---                   | ---     | ---                      |
  10.917,32         | 10.917,32        | 100%   |\\n| **Zordunak**         | 20.288,00             |
  ---     | 20.288,00                | 116.539,01        | 96.251,01        | 474,42%|\\n|
  **Hartzekodunak**    | (24.824,00)           | ---     | (24.824,00)              |
  (145.743,34)      | (120.919,34)     | 487,11%|\\n| **Diruzaintza**      | 4.536,00              |
  ---     | 4.536,00                 | 18.287,00         | 13.751,00        | 303,15%|\\n\\n**KAPITAL
  KORRONTEAREN ALDAKETA**\\n\\n**VARIACI\u00d3N DE CAPITAL CORRIENTE**\\n\\nEkitaldian
  zehar ez dago kapital korrontearen aldaketa.\\n\\nNo se ha producido variaci\u00f3n
  en el capital corriente a lo largo del ejercicio.\\n\\n### 2.- Ustiapeneko Aurrekontua\\n\\n####
  2.1. Hornidurak\\n\\nAtal honetarako izendatutako gastuaren kreditua aurrekontuan
  jarritakoaren pixka bat behetik gauzatu da.\\n\\nEl cr\u00e9dito de gasto consignado
  para este apartado ha sido ejecutado por debajo del presupuestado.\\n\\n#### 2.2.
  Langileen gastuak\\n\\nAzkenean sortu den saldoa eta ekitaldien hasieran aurrekontuan
  jarritakoaren azpian egon da.\\n\\nEl saldo finalmente producido ha estado por debajo
  de lo presupuestado a principios del ejercicio.\\n\\n#### 2.3. Ibilgetuaren amortizazioa\\n\\nAzkenean
  ibilgetua amortizatzeko egin diren hornidurak aurrekontukoak baino txikiagoak izan
  dira, ekitaldian egin den inbertsioa ere aurrekontukoak baino txikiagoa izan delako.\\n\\nLos
  importes de dotaci\u00f3n a la amortizaci\u00f3n del inmovilizado finalmente realizados
  son inferiores a los presupuestados debido a que la inversi\u00f3n llevada a cabo
  en el ejercicio ha sido tambi\u00e9n menor que la presupuestada.\\n\\n2.4. Kanpo-zerbitzuak\\n\\nKanpo-zerbitzuek
  eragindako gastuak sartzen dira atal honetan. Azkenean, benetan egindako gastua
  aurrekontuan zegoena baino gutxiago izan da. Horren arrazoia da atal horretan ekitaldian
  zehar behar gutxiago egon dela.\\n\\n2.5. Finantza-sarrerak\\n\\nSarrera hauen artean,
  Erakundeak dituen banku-kontuetan egindako ordainketek eragin dituzten sortzapenak
  ditugu. Banku-kontu hauen baldintzak B.F.A.k berak banku-entitateeikin izandako
  negozioazioetan zehazten dira.\\n\\nAldea aurrekontuetan partida honetarako inolako
  zenbatekorik ez dagoelako sortu da.\\n\\n2.6. Kapital diru-laguntzen\\n\\nAtal honetan
  ondokoak jasotzen da: jasotako kapital-dirulaguntzengatik Erakundeak emaitzetara
  egiten duen transferentzia.\\n\\nEmaitzetara transferitutako kapitalerako diru laguntzen
  zenbatekoa aurrekontukoa baino txikiagoa izan da, ekitaldian egindako inbertsioa
  ere txikiagoa izan delako.\\n\\n2.7. Ekitaldiaren emaitza\\n\\nEkitaldian zehar
  izandako galerak aurrekontuan zehaztu zirenak baino zertxobait txikiagoak izan dira,
  nagusiki, ekitaldian zehar hornikuntzaren, langileen eta kanpoko zerbitzuen gastuak
  txikiagoak izan direlako.\\n\\n2.4. Servicios exteriores\\n\\nComprenden los gastos
  ocasionados por servicios exteriores. Finalmente se ha producido una minoraci\u00f3n
  del gasto efectivo frente al presupuestado. Surge a las menores necesidades surgidas
  en este sentido durante el ejercicio.\\n\\n2.5. Ingresos financieros\\n\\nEstos
  ingresos recogen los devengos por la remuneraci\u00f3n en cuentas bancarias que
  el Instituto mantiene abiertas. Las condiciones de las mismas se encuadran dentro
  de las negociaciones que la propia D.F.B. acuerda con las entidades bancarias.\\n\\nLa
  diferencia viene motivada al no recogerse en presupuestos ninguna cuant\u00eda para
  esta partida.\\n\\n2.6. Imputaci\u00f3n de subvenciones de capital\\n\\nSe recoge
  en esta variable la transferencia que el Instituto traspasa a resultados por las
  subvenciones de capital recibidas.\\n\\nEl importe de las subvenciones de capital
  transferidas a resultados ha resultado menor que las presupuestadas, porque la inversi\u00f3n
  realizada en el ejercicio ha sido tambi\u00e9n menor.\\n\\n2.7. Resultado del ejercicio\\n\\nLas
  p\u00e9rdidas originadas durante el periodo son inferiores a las presupuestadas,
  esto es debido, fundamentalmente, a los inferiores gastos de aprovisionamientos,
  gastos de personal y servicios exteriores devengados durante el ejercicio.\"", "\"AUTOEBALUAZIOA\\n\\nII.
  MODULUA: BIOERABILGARRITASUNA ETA BIOBALIOKIDETASUNA\\n\\n1. FDAren arabera, nola
  definitzen da bioerabilgarritasuna?\\na) Era farmazeutikotik atera ondoren, eragite-tokira
  ailegatzen den farmako edo osagai aktibo baten kantitatea eta abiadura.\\nb) Era
  farmazeutikotik atera ondoren, eragite-tokira ailegatzen den farmako edo osagai
  aktibo baten abiadura.\\nc) Era farmazeutikotik atera ondoren, eragite-tokira ailegatzen
  den farmako edo osagai aktibo baten kantitatea.\\nd) Erantzun guztiak okerrak dira.\\n\\n2.
  Bioerabilgarritasun absolutua:\\n\\na) Farmako baten bioerabilgarritasun sistemikoa
  administrazio parenteralaren ondoren\\nb) Farmako baten bioerabilgarritasun sistemikoa
  bena-barnetik administratu eta gero.\\nc) Osagai aktibo baten bioerabilgarritasuna
  dosifikazio era batean administratu eta gero, erreferentziako formulazioarekin konparatuz.\\nd)
  Erantzun guztiak okerrak dira.\\n\\n3. Bioerabilgarritasunaren zehaztapena oreka
  egonkorrean:\\na) Dosi bakarreko entseguek baino lagin gehiago behar ditu.\\nb)
  Parte-hartzaileentzat arrisku handiagoa suposatzen du dosi bakarreko saioekin konparatuz,
  kontzentrazio handiagoak lortzen direlako\\nc) Tratamendua ez betetzeko arriskua
  txikiagoa da, dosi bakarreko saioekin konparatuz\\nd) Entseguen iraupena laburragoa
  da, dosi bakarreko saioekin konparatuz.\\n4. Zein da farmakoaren odoleko kontzentrazioak
  erabiliz bioerabilgarritasuna magnitudean zehazteko erabiltzen den parametro farmakozinetikoa?\\na)
  Kurba azpiko azalera (AUC).\\nb) Cmax eta Tmax.\\nc) Cmax/AUC.\\nd) Xurgapen konstantea\\n\\n5.
  Bioerabilgarritasuna abiaduran zehazteko, zein da parametro zehatzena?\\na) Xurgapen
  abiadura konstantea.\\nb) Cmax eta Tmax.\\nc) Cmax/AUC.\\nd) Batazbesteko xurgapen
  denbora.\\n6. Sendagai generikoa:\\na) Erreferentziako sendagaiarekin konparatuz,
  osagai aktiboei dagokionez konposizio kualitatibo eta kuantitatibo berdina duena
  eta forma farmazeutiko berdina duena, beti ere bien arteko biobaliokidetasuna demostratu
  denean bioerabilgarritasun saio egokiak eginez.\\nb) Antzeko eraginkortasuna eta
  segurtasuna demostratu duten sendagaiak.\\nc) Farmako berdinaren kantitate berberak
  (gatz berdina, ester...) eta dosifikazio era berdina dituzten medikamentuak, baina
  ez da beharrezkoa eszipiente berberak izatea.\\nd) Erantzun guztiak zuzenak dira.\\n7.
  Biobaliokidetasun saio batean parte hartu behar duten pertsona kopurua, zeren menpe
  dago?\\na) Esangura estatistikoa eta saioaren potentzia.\\nb) Boluntarioak eskuratzeko
  gaitasuna.\\nc) Gizabanakoen arteko aldakortasuna.\\nd) Kontzentrazio plasmatikoak
  (kontzentrazioak baxuagoak direnean partaide gehiago behar dira).\\n8. Biobaliokidetasun
  saio batean, zer da garbiketarako aldia?\\na) Lehenengo formulazioaren administrazioaren
  (1.go tartea) eta bigarrenaren administrazioaren (2. tartea) artean igarotzen den
  denbora.\\nb) Ikerketa Klinikoetarako Batzorde Etikoaren baimena eskuratzeko behar
  den denbora.\\nc) Partaideen odol edo gernu laginak lortzeko behar den denbora.\\nd)
  Laginetan farmako kontzentrazioak kuantifikatzeko behar den denbora\\n\\n9. Zeren
  menpe dago biobaliokidetasun saio baten diseinuaren aukeraketa?\\na) Farmakoaren
  ezaugarriak eta bere ezaugarri farmakozinetikoak.\\nb) Boluntarioak lortzeko gaitasuna.\\nc)
  Gizabanakoen arteko aldakortasuna eta barne-aldakortasuna.\\nd) Erantzun guztiak
  zuzenak dira.\\n9. Biobaliokidetasun saio bat egiteko diseinu paraleloa justifikatua
  dago baldin eta:\\na) Gizabanakoen arteko aldakortasuna oso txikia denean barneko
  aldakortasunarekin konparatuz.\\nb) Farmakoaren toxikotasuna oso baxua denean.\\nc)
  Eliminazio erdibizitza oso txikia denean.\\nd) Boluntarioen kopurua handitzeak suposatzen
  duen kostua tratamendu gehigarri bat gehitzeak suposatzen duena baino askoz handiagoa
  denean\\n10. Bi formulazio biobaliokideak diren jakiteko egin beharreko froga estatistikoa::\\na)
  Bariantza analisia (ANOVA).\\nb) Konfiantza tarteak (IC90) transformatutako parametro
  farmakozinetikoentzat (log transformazioa).\\nc) Test estatistiko ez parametrikoa.\\nd)
  Erantzun guztiak zuzenak dira.\"", "\"Ezkontza zibilaren eskaera\\n\\nSolicitud
