  "\"Irailaren 1etik aurrera indarrean dauden neurri nagusiak, COVID-19aren aurrean\\n\\nMaskara.
  Nahitaez erabili behar da barnealdeetan eta jende pilaketa eta distantzia bete ezin
  den edozein hiriguneetan. Salbuespen gisa hartzen da jendea biltzen ez den naturaguneetan.\\n\\nOinarrizko
  beste neurri batzuk. Pertsonen arteko distantzia, 1,5 metrokoa. Saihestu pilaketak.
  Barrualdeen aireztapen konstantea. Txertaketa.\\n\\nIndarrean dauden itxierak.\\n\\n*Gazteentzako
  lonjak eta lokalak itxita jarraitzen dute.\\n\\n*III. eta IV. taldeetako gaueko
  aisialdiko establezimenduak itxita daude. I. eta II. taldeetakoek ostalaritzaren
  ordutegiaren eta mugen arabera jardungo dute.\\n\\nOrdutegiak. 01:00etan, establezimenduak
  ixtea eta kultura-, gizarte- eta merkataritza-jarduerak etetea. EAEko hiru Lurralde
  Historikoetako bakoitzaren eremu txikiagoko garraio publikoek, gehienez 02:00etan
  irten beharko dute.\\n\\nEdukierak. Bai merkataritzan bai oro har, %60, muga espezifiko
  bat aplikatzen denean izan ezik.\\n\\nPublikoa ekitaldietan. 1.600 pertsonatik beherako
  edukierako esparruetan, gehienez 600 pertsona barruan eta 800 kanpoaldeetan. 1.600
  eta 5.000 arteko esparruetan, 800 barruan eta 1.200 kanpoan. 5.000 baino gehiagoko
  esparruetan, gehieneko edukiera ezin izango da %30 baino handiagoa izan.\\n\\nOstalaritza.
  Itxiera 01:00etan. Barneko edukiera %50ean mantentzen da. Debekatuta dago barran
  edo zutik kontsumitzea. Mahai bakoitzean, gehienez 8 pertsona. Nahitaezkoa da maskara
  erabiltzea, irensteko unean izan ezik. Joko-lokaletan muga berberak aplikatuko dira.\\n\\nTxokoak.
  Itxiera 01:00etan. %50eko edukiera. Debekatuta dago barran edo zutik kontsumitzea.
  Mahai bakoitzean, gehienez 8 pertsona. Nahitaezkoa da maskara, irensteko unean izan
  ezik. Etengabe aireztatzeko betebeharra.\\n\\nKirola egitea. Aire zabalean, pertsona-kopuruan
  mugarik gabe; barruko instalazioetan, gehienez 10.\\n\\nOsasun-erantzukizuneko betebeharrak.\\n\\nKutsatuta
  dauden edo kontaktu zuzena diren pertsonek azkar eta egiazkotasunez lagundu behar
  diete arakatzaileei. Era berean, konfinamendu- edo berrogeialdi-betebeharra dute.\\n\\nAutoerantzukizunerako
  dei zibikoak. Gaueko mugigarritasuna borondatez mugatzea 01:00etatik 06:00etara,
  eta pertsonen bilkurak gehienez zortzi pertsonatakoak izatea. Autoisolamendua lehen
  kutsatze-sintomak izan bezain laster.\\n\\nitxaropenerako zuhurtzia\\n\\nPrincipales
  medidas en vigor frente a la COVID-19 desde el 1 de septiembre\\n\\nMascarilla.
  Su uso es obligatorio en interiores y en cualquier entorno urbano transitado sin
  distancia interpersonal. Se except\u00faa en espacios naturales sin concurrencia
  de personas.\\n\\nOtras medidas b\u00e1sicas. Distancia interpersonal de 1,5 metros.
  Evitar aglomeraciones. Ventilaci\u00f3n constante de interiores. Vacunaci\u00f3n.\\n\\nCierres
  vigentes.\\n\\n*Se mantiene el cierre de lonjas y locales juveniles.\\n\\n*Permanecen
  cerrados los establecimientos de ocio nocturno de los grupos III y IV. Los correspondientes
  a los grupos I y II se regir\u00e1n por el horario y limitaciones de la hosteler\u00eda.\\n\\nHorarios.
  Cierre de establecimientos y cese de actividades culturales, sociales y comerciales
  a las 01:00h. El transporte p\u00fablico inferior a cada uno de los Territorios
  Hist\u00f3ricos, tendr\u00e1 como horario m\u00e1ximo de salida las 02:00h.\\n\\nAforos.
  Tanto en el comercio como con car\u00e1cter general, 60%, salvo cuando se aplica
  una limitaci\u00f3n espec\u00edfica.\\n\\nP\u00fablico en eventos. En recintos con
  capacidad inferior a 1.600 personas, m\u00e1ximo en interiores de 600 y de 800 en
  exteriores. En recintos de entre 1.600 y 5.000, en interiores 800 y 1.200 en exteriores.
  En recintos de m\u00e1s de 5.000, el aforo m\u00e1ximo no podr\u00e1 superar el
  30%.\\n\\nHosteler\u00eda. Cierre a las 01:00h. Aforo en interiores del 50%. Prohibido
  consumo en barra o de pie. En cada mesa, m\u00e1ximo 8 personas. Mascarilla obligatoria
  salvo en el momento de la ingesta. En locales de juego son de aplicaci\u00f3n las
  mismas limitaciones.\\n\\nTxokos. Cierre a las 01:00h. Aforo del 50%. Prohibido
  consumo en barra o de pie. En cada mesa, m\u00e1ximo 8 personas. Mascarilla obligatoria
  salvo en el momento de la ingesta. Obligaci\u00f3n de ventilaci\u00f3n constante.\\n\\nPr\u00e1ctica
  deportiva. Al aire libre, sin limitaci\u00f3n de n\u00famero de personas; en instalaciones
  interiores, m\u00e1ximo de 10.\\n\\nObligaciones de responsabilidad sanitaria.\\n\\nLas
  personas afectadas por contagio o por ser contacto, deben colaborar con las personas
  rastreadoras con celeridad y veracidad. Deben igualmente cumplir la obligaci\u00f3n
  de confinamiento o cuarentena.\\n\\nLlamamientos c\u00edvicos para la autorresponsabilidad.
  Limitaci\u00f3n voluntaria de la movilidad nocturna de 01:00 a 06:00h. y de agrupaciones
  de personas a un m\u00e1ximo de ocho. Autoaislamiento en cuanto se experimenten
  los primeros s\u00edntomas de contagio.\\n\\nprudencia para la esperanza\"", "\"2009ko
