sample: '["\"2016ko azaroaren 9a, asteazkena  \u2022  125 zk.\\n\\nI - ARABAKO BATZAR
  NAGUSIAK ETA ARABAKO LURRALDE HISTORIKOAREN FORU ADMINISTRAZIOA\\n\\nArabako Foru
  Aldundia Iragarkiak\\n\\nNEKAZARITZA SAILA\\n\\nMENDI ZERBITZUA\\n\\nOnura publikoko
  mendia mugatu eta mugarriztatzeko espedientea jendaurrean jartzea. Iragarki honen
  bidez, \\\"Campo Mayor\\\" izeneko onura publikoko mendiak \u2013\u2013Turiso eta
  Molinilla herrien jabetzekoa\u2013\u2013, eta \\\"La Mogota\\\" izenekoak (579.
  zenbakikoa, Arreoko herriaren jabetzakoa, biak ere Erriberagoitiko udalerrian kokatuak)
  elkarrekin duten muga bereizi eta mugarriztatzeko espedientea jendaurrean jarri
  eta erreklamazioak aurkezteko epea abiarazten da, Arabako Lurralde Historikoko Mendien
  Foru Arauan eta Mendien Erregelamenduan ezarritakoaren arabera\\n\\nBehin amaiturik
  Campo Mayor izeneko mendi publikoak (Turiso eta Molinilla herrien jabetzekoa da)
  eta \\\"La Mogota\\\" izeneko onura publikoko mendiak (579. zenbakikoa, Arreoko
  herriaren jabetzekoa eta biak ere Erriberagoitiko udalerrian kokatuak) elkarrekin
  duten muga behin-behinean bereizteko eta mugarriztatzeko lanak, jakinarazten da
  jendaurrean jartzen dela mugatze eta mugarriztatze espedientea, Arabako Foru Aldundiaren
  Mendi Zerbitzuaren bulegoetan (Probintzia plaza, 4. zk., 1. solairua, 01001 Gasteiz),
  interesdunek aztertu ahal izan dezaten, iragarki hau argitaratu eta hamabost eguneko
  epean. Mendien Foru Arauak (11/2007 Foru Araua, martxoaren 26koa) ezarritakoarekin
  eta Mendien Erregelamenduak (otsailaren 22ko 485/1962 Dekretuak onartua) 120. eta
  121. artikuluetan ezarritakoarekin bat etorriz egiten da hala.\\n\\nEra berean,
  iragarki hau argitaratu ondoko hogeita hamar egunean zehar, onartu egingo dira zuzenbidearen
  araberakoak diren erreklamazioak; Arabako Foru Aldundiaren Mendi Zerbitzuari zuzendu
  behar zaizkio, Arabako Foru Aldundiaren Erregistro Orokorrean aurkeztuta (Probintzia
  plaza, 5, 01001 Gasteiz).\\n\\nMugarriztatze lanen kontra erreklamazioa aurkezteko,
  beharrezkoa da mugarriztatze lanetan bertan egon izana norbera edo norberak izendatutako
  ordezkari bat.\\n\\nJabetzari buruzko erreklamazioez den bezainbatean, erreklamazioan
  berariaz aipatu behar da administrazio bidea amaitzeko asmoz aurkezten dela, gero
  arlo zibileko epaitegietara jotzeko aldez aurreko izapide gisa.\\n\\nGasteiz, 2016ko
  urriaren 27a\\n\\nNekazaritza zuzendaria\\n\\nALFREDO SAEZ DE CASTILLO BELTRAN DE
  OTALORA\\n\\nFirmante: CN=DIRECCION DE SERVICIOS GENERALES, SERIALNUMBER=P0100000I,
  OU=sello electr\u00f3nico, OU=ZIURTAGIRI ONARTUA - CERTIFICADO RECONOCIDO, O=ARABAKO
  FORU ALDUNDIA-DIPUTACION FORAL DE ALAVA, C=ES\\n\\nN\u00famero de serie: 108817\\n\\nEmisor
  del certificado: CN=EAEko HAetako langileen CA - CA personal de AAPP vascas (2),
  OU=AZZ Ziurtagiri publikoa - Certificado publico SCA, O=IZENPE S.A., C=ES\\n\\nFecha
  de firma:  2016.11.09 06:33:28 Z\"", "\"COMISI\u00d3N DE MEDIO AMBIENTE\\n\\nSESI\u00d3N
  ORDINARIA\\n\\nFECHA: martes, 20 de octubre de 2015\\n\\nHORA: 09:00.\\n\\nLUGAR:
  Casa Consistorial.\\n\\nORDEN DEL D\u00cdA\\n\\nPARTE DE CONTROL\\n\\n1- Pregunta
  del Grupo Municipal PP, presentada el d\u00eda 13 de octubre de 2015, sobre proyectos
  vinculados a la biomasa.\\n2- Pregunta del Grupo Municipal IRABAZI-GANAR, presentada
  el d\u00eda 13 de octubre de 2015, sobre el sistema de reciclaje de aceite usado.\\n3-
  Pregunta del Grupo Municipal S U M A N D O - H E M E N  G A U D E , presentada el
  d\u00eda 13 de octubre de 2015, sobre la poblaci\u00f3n de grandes herb\u00edvoros
  de Salburua.\\n4- Pregunta del Grupo Municipal S U M A N D O - H E M E N  G A U
  D E , presentada el d\u00eda 13 de octubre de 2015, sobre el arbolado urbano.\\n5-
  Pregunta del Grupo Municipal IRABAZI-GANAR, presentada el d\u00eda 13 de octubre
  de 2015, sobre el grupo de seguimiento t\u00e9cnico-pol\u00edtico del servicio de
  limpieza y recogida de residuos.\\n\\nINGURUMENAREN BATZORDEA\\n\\nOHIKO BILKURA\\n\\nDATA:
  2015eko urriaren 20an,\\n\\nasteartea\\n\\nORDUA: 09:00.\\n\\nLEKUA: Udaletxea.\\n\\nGAI-ZERRENDA\\n\\nKONTROL
  JARDUERA\\n\\n1- PP udal taldeak 2015eko urriaren 1 3 a n  a u r k e z t u t a k
  o  g a l d e r a , biomasarekin lotutako proiektuez.\\n2- IRABAZI-GANAR udal taldeak
  2015eko urriaren 13an aurkeztutako galdera, olio erabilia birziklatzeko sistemaz.\\n3-
  SUMANDO-HEMEN GAUDE udal taldeak 2015eko urriaren 13an aurkeztutako galdera, Salburuko
  belarjale handiez.\\n4- SUMANDO-HEMEN GAUDE udal taldeak 2015eko urriaren 13an aurkeztutako
  galdera, hiriko zuhaitzez.\\n5- IRABAZI-GANAR udal taldeak 2015eko urriaren 13an
  aurkeztutako galdera, garbitu eta hondakinak biltzeko zerbitzuaren jarraipena egiteko
  talde tekniko eta politikoaz.\\n\\n6- RUEGOS Y PREGUNTAS: Turno 2. - SUMANDO-HEMEN
  GAUDE / PSEEE / EH BILDU GASTEIZ / PP / IRABAZIGANAR -\\n\\n6- GALDE-ESKEAK: 2.
  txanda.  SUMANDO-HEMEN GAUDE / PSEEE / EH BILDU GASTEIZ / PP / IRABAZIGANAR -\\n\\nVitoria-Gasteiz,
  14 de octubre de 2015 Vitoria-Gasteizen, 2015eko urriaren 14an\\n\\nEL PRESIDENTE,
  BATZORDEBURUA,\\n\\nFdo./Izp.: Miguel Garnica Azofra\"", "\"Bestelako Xedapenak\\n\\nETXEBIZITZA,
  HERRI LAN ETA GARRAIO SAILA\\n\\n3351\\n\\nAGINDUA, \u00ad2011ko ekainaren \u00ad9koa,
  Etxebizitza, Herri Lan eta Garraioetako sailburuarena, Basau\u00ad riko udalerriko
  Baskonia eremuan, \u00ad40 etxebizitza sozial esleitzeko hautaketa-\u00adprozesua
  hasten duena eta hainbat zehaztasun finkatzen dituena.\\n\\nGERTAKARIAK\\n\\n1.\u2013
  Etxebizitza eta Gizarte Gaietako sailburuaren \u00ad2008ko apirilaren \u00ad16ko
  Aginduak babes ofizialeko etxebizitzak esleitzeko prozedura arautzen du. Hori, Babes
  publikoko etxebizitzen erregimenari eta etxe\u00ad bizitzaren eta lurzoruaren inguruko
  finantza-\u00adneurriei buruzko \u00ad2008ko martxoaren \u00ad28ko \u00ad39/2008
  De\u00adkre\u00ad \u00adtuaren \u00ad12. artikuluan jasotzen da.\\n2.\u2013 \u00ad40
  etxebizitza sozialen sustapena Basauriko Baskonia eremuan kokatuta dago, Euskadiko
  Etxebi\u00ad zitza eta Lurra SA (Visesa) baltzu publikoak sustatzen du, eta aipatutako
  aginduak arautzen duen prozedura aplikatu behar zaio. Sustapen horrek \u00ad2008ko
  abendu\u00ad aren \u00ad11n eskuratu zuen behin-\u00adbehineko kalifikazioa eta
  EB2-\u00ad1666/08-\u00adEC-\u00ad000 du espediente zenbakia.\\n\\nZUZENBIDEKO OINARRIAK\\n\\n1.\u2013
  Organo honi dagokio honako zehaztasunak finkatzeko eskumena, hala xedatzen baita
  Etxebizitza, Herri Lan eta Garraio Sailaren egitura organikoa eta egitekoak ezartzen
  dituen azaroaren \u00ad24ko \u00ad607/2009 De\u00adkre\u00adtuaren \u00ad4. artikuluan
  eta baita babes ofizialeko etxebizitzak esleitzeko prozedurari buruzko \u00ad2008ko
  apirilaren \u00ad16ko Etxebizitza eta Gizarte Gaietako sail\u00ad buruaren Aginduaren
  \u00ad7. artikuluan ere.\\n2.\u2013 Sailburuaren \u00ad2008ko apirilaren \u00ad16ko
  Agindu\u00ad ak, honakoa adierazten du \u00ad7. artikuluan:\\n\u00ab1.\u2013 Hautespen-\u00adprozesua
  Etxebizitza eta Gizarte Gaietako sailburuaren Agindu bidez hasiko da. Agin\u00ad
  dua sustapenaren behin-\u00adbehineko kalifikazio-\u00adegunaren ondoren eman beharko
  da, eta Euskal Herriko Agin\u00ad taritzaren Aldizkarian argitaratuko da.\\n2.\u2013
  Prozedura hasteko Agindu horrek gutxienez honako alderdi hauek zehaztuko ditu:\\n\\nOtras
  Disposiciones\\n\\nDEPARTAMENTO DE VIVIENDA, OBRAS P\u00daBLICAS Y TRANSPORTES\\n\\n3351\\n\\nORDEN
  de \u00ad9 de junio de \u00ad2011, del Consejero de Vivienda, Obras P\u00fablicas
  y Transportes, por la que se inicia el proceso de selecci\u00f3n y se determinan
  diversas especificaciones, para la adjudicaci\u00f3n de \u00ad40 viviendas sociales
  en el \u00e1mbito de Baskonia, en el municipio de Basauri.\\n\\nHECHOS\\n\\n1.\u2013
  Mediante Orden del Consejero de Vivienda y Asuntos Sociales de \u00ad16 de abril
  de \u00ad2008, se regula el procedimiento de adjudicaci\u00f3n de las viviendas
  de protecci\u00f3n oficial, tal y como se recoge en el art\u00edcu\u00ad lo \u00ad12
  del Decreto \u00ad39/2008 sobre r\u00e9gimen jur\u00eddico de viviendas de protecci\u00f3n
  p\u00fablica y medidas financieras en materia de vivienda y suelo.\\n2.\u2013 La
  promoci\u00f3n de \u00ad40 viviendas sociales ubicada en el \u00e1mbito de Baskonia,
  en el municipio de Basau\u00ad ri y promovida por la Sociedad P\u00fablica Vivienda
  y Suelo de Euskadi, S.A. (VISESA),se encuentra some\u00ad tida al procedimiento
  regulado en la citada orden, y ha recibido la correspondiente calificaci\u00f3n
  provisional con fecha \u00ad11 de diciembre de \u00ad2008 bajo el n\u00famero de
  expediente EB2-\u00ad1666/08-\u00adEC-\u00ad000.\\n\\nFUNDAMENTOS DE DERECHO\\n\\n1.\u2013
  Este \u00f3rgano es el competente para determinar las presentes especificaciones
  en virtud de lo previsto en el art\u00edculo \u00ad4 del Decreto \u00ad607/2009,
  de \u00ad24 de no\u00ad viembre, por el que se establece la estructura org\u00e1ni\u00ad
  ca y funcional del Departamento de Vivienda, Obras P\u00fablicas y Transportes y
  en el art\u00edculo \u00ad7 de la Orden de \u00ad16 de abril de \u00ad2008, del
  Consejero de Vivienda y Asuntos Sociales, sobre procedimiento de adjudica\u00ad
  ci\u00f3n de viviendas de protecci\u00f3n oficial.\\n2.\u2013 La antedicha Orden
  del Consejero, de \u00ad16 de abril de \u00ad2008, se\u00f1ala lo siguiente en su
  art\u00edculo \u00ad7:\\n\u00ab1.\u2013 El proceso de selecci\u00f3n se iniciar\u00e1
  mediante Orden del Consejero de Vivienda y Asuntos Sociales que deber\u00e1 dictarse
  con posterioridad a la fecha de la calificaci\u00f3n provisional de la promoci\u00f3n
  y publicarse en el Bolet\u00edn Oficial del Pa\u00eds Vasco.\\n2.\u2013 Dicha Orden
  de inicio del procedimiento de selecci\u00f3n determinar\u00e1, como m\u00ednimo,
  los siguientes extremos:\\na) Esleitu beharreko etxebizitzen kopurua. Era be\u00ad
  rean, indarreko araudia aplikatuz, etxebizitzako bera\u00ad riazko beharrak asetzeko,
  birkokatze-\u00adoperazioetarako\\na) N\u00famero de viviendas a adjudicar. Se indicar\u00e1
  igualmente el n\u00famero de viviendas que han de ser detra\u00eddas para ser destinadas
  a necesidades espec\u00edficas\\n\\n2011/3351\\n\\n*\\n\\n(1/4)\\n\\nedo beste behar
  batzuk asetzeko kendu beharko diren etxebizitzen kopurua adieraziko da.\\n\\nb)
  Sustapenean interesa dutela deklaratutako uda\u00ad lerriak.\\nc) Hurrengo artikuluek
  adierazten dituzten kupoak eta kupo gehigarriak, baldin badaude.\\nd) Etxebizitzen
  lagapen-\u00aderregimena.\\ne) Etxebizitza Eskatzaileen Erregistroan izena ema\u00ad
  teko eskaerak noiz arte hartuko diren kontuan.\\nf) Lehentasun-\u00adordena, aldi
  berean kupo batean baino gehiagotan parte hartzeko baldintzak biltzen dituzten eskatzaileak
  dauden kasuetarako.\\ng) Argitalpenak egiteko komunikabidea Lurralde Ordezkaritzetako
  Iragarki Taula izango dela adieraz\u00ad tea\u00bb.\\n\\nAipatutako lege-\u00adxedapenak
  eta oro har gai honetan erabilgarri diren gainerakoak aztertu ondoren, honako hau\\n\\nEBATZI
  DUT:\\n\\nLehenengoa.\u2013 Basauriko udalerrian \u00ad40 etxebizitza sozial esleituko
  dira sustapen honetan, eta horietatik \u00ad8 kenduko dira birkokatze-\u00aderagiketak
  direla eta.\\n\\nBigarrena.\u2013 Zozketatik kanpo gelditutako etxebi\u00ad zitzak,
  Etxebizitzako Lurralde-\u00adordezkariak esleituko ditu, beharrezkoak ez izateagatik
  erabiliak izan ez badira. Kasu horretan, hautaketa-\u00adprozesuko kupo orokorreko
  itxaron-\u00adzerrenda hartuko da kontuan es\u00ad leipendunak hautatzeko.\\n\\nEtxebizitza
  horien artean mugikortasun urri iraun\u00ad korra duten elbarriei egokitutako etxebizitzak
  baleu\u00ad de, babes ofizialeko etxebizitzen prozedurei buruzko \u00ad2008ko apirilaren
  \u00ad16ko Etxebizitza eta Gizarte Gaie\u00ad tako sailburuaren Aginduko \u00ad5.
  artikuluan ezarritakoa\u00ad ren arabera esleituko dira.\\n\\nHirugarrena.\u2013
  Basauri izango da espediente hone\u00ad tan interesa duen udala.\\n\\nLaugarrena.\u2013
  Esleitu beharreko etxebizitza horie\u00ad tatik honakoak gordeko dira:\\n\\nde vivienda,
  para operaciones de realojo o para cual\u00ad quier otra necesidad en aplicaci\u00f3n
  de la normativa vigente.\\nb) Municipios declarados interesados en la promo\u00ad
  ci\u00f3n.\\nc) Cupos a que se refieren los art\u00edculos siguientes y cupos adicionales
  si los hubiere.\\nd) R\u00e9gimen de cesi\u00f3n de las viviendas.\\ne) Fecha hasta
  la cual ser\u00e1n tenidas en cuenta las solicitudes de inscripci\u00f3n en el Registro
  de Solicitan\u00ad\\ntes de Vivienda.\\nf) Orden de prelaci\u00f3n en el caso de
  que existan demandantes que re\u00fanan las condiciones necesarias para formar parte
  simult\u00e1neamente de varios de los cupos.\\ng) Indicaci\u00f3n de que el Tabl\u00f3n
  de Anuncios de las Delegaciones Territoriales ser\u00e1n el medio de comuni\u00ad
  caci\u00f3n donde se efectuar\u00e1n las sucesivas publicacio\u00ad nes.\u00bb\\n\\nA
  la vista de los preceptos legales se\u00f1alados y de\u00ad m\u00e1s de general
  y concordante aplicaci\u00f3n.\\n\\nRESUELVO:\\n\\nPrimero.\u2013 El n\u00famero
  de viviendas sociales a adju\u00ad dicar en la presente promoci\u00f3n del municipio
  de Ba\u00ad sauri es de \u00ad40, de las cuales se detraen \u00ad8 como con\u00ad
  secuencia de operaciones de realojo.\\n\\nSegundo.\u2013 El Delegado Territorial
  de Vivienda proceder\u00e1 a la adjudicaci\u00f3n de las viviendas excluidas del
  sorteo que finalmente resulten innecesarias para el destino al que fueron adscritas.
  En este supuesto, la selecci\u00f3n de los adjudicatarios se realizar\u00e1 teniendo
  en cuenta la lista de espera del cupo general resultan\u00ad te del proceso de selecci\u00f3n.\\n\\nAquellas
  viviendas que est\u00e9n adaptadas a discapa\u00ad citados con movilidad reducida
  permanente se adju\u00ad dicar\u00e1n de acuerdo con lo estipulado en el art\u00edculo
  \u00ad5 de la Orden de \u00ad16 de abril de \u00ad2008, del Consejero de Vivienda
  y Asuntos Sociales, sobre procedimientos de adjudicaci\u00f3n de viviendas de protecci\u00f3n
  oficial.\\n\\nTercero.\u2013 Se declara municipio interesado en el expediente el
  municipio de Basauri.\\n\\nCuarto.\u2013 Del total de viviendas a adjudicar, se
  re\u00ad servar\u00e1n los siguientes cupos:\\n\\na) \u00ad2 etxebizitza, mugikortasun
  urri iraunkorra du\u00ad ten elbarriei egokitutakoak. \u00ad2008ko apirilaren \u00ad16ko
  Aginduak, babes ofizialeko etxebizitzak esleitzeko prozedura arautzen duenak, \u00ad8.
  artikuluan aipatzen dituen \u00ad3 baremoetatik edozeinetan barne daudenak kupo
  honetan sartuko dira. Baremo ezberdinetan aldi berean parte hartzeko baldintzak
  betetzen badituzte, aipatu aginduan finkatutako hurrenkeran sartuko di\u00ad ra.\\na)
  \u00ad2 viviendas adaptadas para persona discapacitada con movilidad reducida de
  car\u00e1cter permanente. Se in\u00ad cluir\u00e1 en este cupo a los que formen
  parte de cualquie\u00ad ra de los \u00ad3 baremos a que se refiere el art\u00edculo
  \u00ad8 de la Orden de \u00ad16 de abril de \u00ad2008, sobre procedimientos de
  adjudicaci\u00f3n de viviendas de protecci\u00f3n oficial. En el caso de que pudieran
  formar parte simult\u00e1neamente de varios de estos baremos se les incluir\u00e1
  de acuerdo al orden dispuesto en la citada orden.\\n\\n2011/3351\\n\\n*\\n\\n(2/4)\\n\\nb)
  \u00ad12 etxebizitza babes bereziko gizarte egoerak dituztenentzat:\\n\u2013 Beren
  kargura adin txikiko seme-\u00adalabak dituzten guraso bakarreko familiak.\\n\u2013
  Genero-\u00adindarkeriaren biktimak.\\n\u2013 Bananduak.\\n\u2013 \u00ad70 urtetik
  gorakoak.\\n\u2013 Ezintasun psikikoa duten pertsonak.\\nc) \u00ad9 etxebizitza,
  izen ematearen antzinatasuna \u00ad4 urtetik gorakoa dutenentzat. Antzinatasun edo
  aldi hori honela zenbatuko da: Etxebiden izena emateko eskariaren datatik Agindu
  hau argitaratu den egunera arte.\\nd) \u00ad9 etxebizitza, gainerako eskatzaileentzat.\\n\\nEskatzaileek
  hainbat kupotan aldi berean parte hartzeko baldintzak betetzen badituzte, zenbaki
  hone\u00ad tan finkatutako lehentasun-\u00adhurrenkera jarraituko da.\\n\\nBosgarrena.\u2013
  Sustapen honetako etxebizitzak laga\u00ad tzeko araubidea alokairukoa izango da.\\n\\nSeigarrena.\u2013
  Etxebiden izena emateko \u00ad2010eko azaroaren \u00ad30era arte erregistroan sarrera
  izan duten eskabideak hartuko dira kontuan.\\n\\nZazpigarrena.\u2013 Eskatzen diren
  lagapen\u00aderregimenei eta udalerriei dagokienez, agindu hau argitaratzen den
  eguna hartuko da kontuan.\\n\\nZortzigarrena.\u2013 Onartutakoen zerrendetan, beste\u00ad
  ak beste, onartutako eskaera bakoitzari orotara dago\u00ad kion zenbaki kopurua
  agertuko da.\\n\\nBederatzigarrena.\u2013 Argitalpenak egiteko komuni\u00ad kabidea
  lurralde ordezkaritzetako iragarki taula izango da.\\n\\nHamargarrena.\u2013 \u00ad2009.
  urteko zergaldiko diru\u00adsarrera haztatuak \u00ad3.000 euro baino txikiagoak
  ez direla eta \u00ad22.000 euro baino handiagoak ez direla egiaztatzea eskatzen
  da. Mugikortasun urria duten ezgaituak edo ezgaitu psikikoak izanez gero, ez da
  eskatuko gutxieneko diru-\u00adsarrerarik egiaztatzea.\\n\\nHamaikagarrena.\u2013
  Etorkizuneko titularretakoren batek erroldaturik egon beharko du interesatutzat
  jotako edozein udalerritan, etxebizitzen esleipen\u00adprozedurari hasiera ematen
  dion agindu hau argitara\u00ad tzen den eguna baino urtebete lehenagoko antzinata\u00ad
  sunez.\\n\\nb) \u00ad12 viviendas para unidades convivenciales que se encuentren
  en situaciones sociales de especial pro\u00ad tecci\u00f3n:\\n\u2013 Familias monoparentales
  con hijos/as menores a\\nsu cargo.\\n\u2013 Mujeres v\u00edctimas de la violencia
  de g\u00e9nero.\\n\u2013 Separados/as y divorciados/as.\\n\u2013 Personas mayores
  de \u00ad70 a\u00f1os.\\n\u2013 Personas que acrediten la condici\u00f3n de discapa\u00ad
  cidad ps\u00edquica.\\nc) \u00ad9 viviendas para unidades convivenciales cuya solicitud
  tenga \u00ad4 a\u00f1os de antig\u00fcedad. Dicha antig\u00fce\u00ad dad se computar\u00e1
  desde la fecha de solicitud de ins\u00ad cripci\u00f3n en Etxebide hasta la fecha
  de publicaci\u00f3n de la Orden.\\nd) \u00ad9 viviendas para el resto de solicitantes.\\n\\nEn
  el caso de que las solicitudes re\u00fanan las condi\u00ad ciones necesarias para
  formar parte simult\u00e1neamente de varios de los cupos se seguir\u00e1 el orden
  de prela\u00ad ci\u00f3n se\u00f1alado en este n\u00famero.\\n\\nQuinto.\u2013 El
  r\u00e9gimen de cesi\u00f3n de las viviendas de la presente promoci\u00f3n ser\u00e1
  el de arrendamiento.\\n\\nSexto.\u2013 Se tendr\u00e1n en cuenta las solicitudes
  de inscripci\u00f3n en Etxebide que hayan tenido entrada en el registro hasta el
  \u00ad30 de noviembre de \u00ad2010.\\n\\nS\u00e9ptimo.\u2013 Se tendr\u00e1n en
  cuenta los reg\u00edmenes de acceso y los municipios demandados a fecha de pu\u00ad
  blicaci\u00f3n de la presente Orden de inicio.\\n\\nOctavo.\u2013 Las listas de
  admitidos contendr\u00e1n entre otros extremos, el total de n\u00fameros a asignar
  a cada una de las solicitudes admitidas.\\n\\nNoveno.\u2013 El Tabl\u00f3n de Anuncios
  de las Delega\u00ad ciones Territoriales ser\u00e1 el medio de comunicaci\u00f3n
  donde se efectuar\u00e1n las sucesivas publicaciones.\\n\\nD\u00e9cimo.\u2013 Se
  requiere acreditar ingresos anuales ponderados no inferiores a \u00ad3.000 euros
  y no superio\u00ad res a \u00ad22.000 euros en el periodo impositivo corres\u00ad
  pondiente al ejercicio de renta del a\u00f1o \u00ad2009. En el caso de personas
  discapacitadas con movilidad redu\u00ad cida o de discapacitados ps\u00edquicos,
  no se exigir\u00e1 acre\u00ad ditar ingresos m\u00ednimos.\\n\\nUnd\u00e9cimo.\u2013
  Alguna o alguno de los futuros titula\u00ad res habr\u00e1 de estar empadronado,
  con una antig\u00fcedad m\u00ednima de un a\u00f1o anterior a la fecha de publicaci\u00f3n
  de la presente Orden de inicio, en cualquiera de los municipios declarados interesados.\\n\\nHamabigarrena.\u2013
  Itxaron-\u00adzerrenda agortuz gero, esleitu gabe geratzen diren etxebizitzak, dagokion
  lurralde ordezkariak zozketa bidez esleituko ditu araudiak ezartzen dituen baldintzak
  betetzen dituzten eskabideen artean. Posible izango da Etxebiden izena emateko eskabideak
  kontuan hartuko diren azken\\n\\nDuod\u00e9cimo.\u2013 Las viviendas que queden
  sin adju\u00ad dicar una vez agotada la lista de espera se adjudicar\u00e1n por
  el Delegado Territorial de Vivienda correspon\u00ad diente mediante sorteo entre
  aquellas solicitudes que cumplan los requisitos normativamente establecidos. Se
  podr\u00e1 ampliar la fecha hasta la cual ser\u00e1n tenidas\\n\\n2011/3351\\n\\n*\\n\\n(3/4)\\n\\neguna
  atzeratzea eta sustapenean interesa dutela adie\u00ad razitako udalerriak zabaltzea.\\n\\nHala
  ere, mugikortasun urri iraunkorreko ezinduei egokitutako etxebizitzei dagokienez,
  honako hau har\u00ad tuko da kontuan: babes ofizialeko etxebizitzen eslei\u00ad
  pen prozedurei buruzko Etxebizitza eta Gizarte Gai\u00ad etako sailburuaren \u00ad2008ko
  apirilaren \u00ad16ko Aginduko \u00ad5 artikuluan jasotzen dena.\\n\\nAgindu honen
  aurka aukerako berraztertzeko erre\u00ad kurtsoa aurkez dakioke hilabeteko epean,
  Etxebizitza, Herri Lan eta Garraioetako sailburuari; edo bestela, administrazioarekiko
  auzi-\u00aderrekurtsoa hasieratik, zuze\u00ad nean, bi hilabeteko epean, Euskal
  Autonomia Erkide\u00ad goko Auzitegi Nagusiko Administrazioarekiko Auzie\u00ad tarako
  Salan. Agindua Euskal Herriko Agintaritzaren Aldizkarian argitaratzen den egunaren
  biharamunean hasiko da errekurtso biak aurkezteko epea.\\n\\nVitoria-\u00adGasteiz,
  \u00ad2011ko ekainaren \u00ad9a.\\n\\nEtxebizitza, Herri Lan eta Garraioetako sailburua,
  IGNACIO MAR\u00cdA ARRIOLA L\u00d3PEZ.\\n\\nen cuenta las solicitudes de inscripci\u00f3n
  en Etxebide as\u00ed como los municipios interesados en el expediente.\\n\\nNo obstante,
  en las viviendas adaptadas a discapa\u00ad citados con movilidad reducida permanente,
  se estar\u00e1 a lo dispuesto en el art\u00edculo \u00ad5 de la Orden de \u00ad16
  de abril de \u00ad2008, del Consejero de Vivienda y Asuntos Sociales, sobre procedimientos
  de adjudicaci\u00f3n de vi\u00ad viendas de protecci\u00f3n oficial.\\n\\nContra
  la presente Orden procede interponer re\u00ad curso potestativo de reposici\u00f3n
  ante el Consejero de Vivienda, Obras P\u00fablicas y Transportes del Gobierno Vasco
  en el plazo de un mes desde el d\u00eda siguiente al de su publicaci\u00f3n en el
  Bolet\u00edn Oficial del Pa\u00eds Vasco, o directamente recurso contencioso-\u00adadministrativo,
  ante la Sala de lo Contencioso-\u00adAdministrativo del Tribunal Superior de Justicia
  del Pa\u00eds Vasco en el pla\u00ad zo de dos meses contados a partir del d\u00eda
  siguiente al de su publicaci\u00f3n en el Bolet\u00edn Oficial del Pa\u00eds Vas\u00ad
  co.\\n\\nEn Vitoria-\u00adGasteiz, a \u00ad9 de junio de \u00ad2011. El Consejero
  de Vivienda, Obras P\u00fablicas y Transportes, IGNACIO MAR\u00cdA ARRIOLA L\u00d3PEZ.\\n\\n2011/3351\\n\\n*\\n\\n(4/4)\"",
  "\"JENDAURREALDIARI BURUZKO AZKEN TXOSTENA. NAFARROAKO HERRIEN IZENDAPEN ELEBIDUN
  OFIZIALEN ERABILERA ETA ADIERAZPEN GRAFIKOAK ARAUTZEN DITUEN FORU DEKRETUAREN PROIEKTUA.\\n\\nGardentasunari
  eta Gobernu Irekiari buruzko 11/2012 Foru Legeak, bere 13. artikuluan, xedatzen
  duenez Administrazio Publikoak, bere eskumenen eremuan, oro har, eskuragarri jarri
  behar die herritarrei informazio argia, objektiboa, eguneratua, eta erraz eskuratzeko
  moduan, hots, informazio aktiboen zerrenda bat, gehienbat orokorra, Nafarroako Gobernu
  Irekiaren Atarian dagoena:\\n\\nAipatu artikuluaren i) idatz-zatian aditzera ematen
  da argitaratu beharra dela unean-unean prestatzen ari diren arauei buruzko prozeduren
  zerrenda, argi adieraziz zein den haien xedea eta tramitazioaren egoera. Agindu
  hori betetzearren, proposatzen den foru dekretu honen zirriborroa honako webgunean
  argitaratu zen: Esteka\\n\\nForu dekretuaren proiektua jendaurrean jarri zen, herritarrek
  hasierako iradokizunak egin ziezazkioten 2017ko apirilaren 12tik maiatzaren 8ra
  bitartean. Proposatutako alegazio mekanismoa firstname.lastname@example.org, helbide
  elektronikora izan da.\\n\\nJendaurrealdiaren prozesu hau Herritarrekiko eta Erakundeekiko
  Harremanetako kontseilariak martxoaren 3ko 5/2017 Foru Aginduaren bidez hasitako
  parte-hartze prozesua osatzera heldu da.\\n\\nINFORME FINAL DE INFORMACI\u00d3N
  P\u00daBLICA. PROYECTO DE DECRETO FORAL RELATIVO AL USO Y LA EXPRESI\u00d3N GR\u00c1FICA
  DE LAS DENOMINACIONES OFICIALES BILING\u00dcES DE LOS N\u00daCLEOS DE POBLACI\u00d3N
  DE NAVARRA.\\n\\nLa Ley Foral 11/2012 de la Transparencia y del Gobierno Abierto,
  en su art\u00edculo 13 dispone que la Administraci\u00f3n P\u00fablica, en el \u00e1mbito
  de sus competencias, debe poner, con car\u00e1cter general, a disposici\u00f3n de
  la ciudadan\u00eda, de forma accesible, clara, objetiva y actualizada, un listado
  de informaci\u00f3n activa que, en su mayor parte, tiene car\u00e1cter general y
  se puede encontrar en el Portal de Gobierno Abierto de Navarra.\\n\\nEn el apartado
  i) del citado art\u00edculo, se indica la obligaci\u00f3n de publicar la relaci\u00f3n
  de los procedimientos de elaboraci\u00f3n normativa que est\u00e9n en curso, indicando
  su objeto y estado de tramitaci\u00f3n. En cumplimiento de dicho precepto, el inicio
  de la elaboraci\u00f3n de este Decreto Foral que se propone se ha publicado en la
  siguiente p\u00e1gina web: Enlace\\n\\nEl proyecto de Decreto Foral ha sido sometido
  a exposici\u00f3n p\u00fablica con el fin de que la ciudadan\u00eda formulara sugerencias
  a dicho texto en el per\u00edodo que va desde el  12 de abril al 8 de mayo de 2017.
  El mecanismo de alegaci\u00f3n propuesto ha sido el correo electr\u00f3nico dirigido
  a email@example.com.\\n\\nEste proceso de exposici\u00f3n p\u00fablica completa
  el proceso participativo de elaboraci\u00f3n iniciado con la Orden Foral 5/2017,
  de 3 de marzo, de la Consejera de Relaciones Ciudadanas e Institucionales.\\n\\nAdierazten
  da ez dela alegaziorik jaso parte hartzeko aldia irekita egon den bitartean.\\n\\nTranscurrido
  dicho plazo de exposici\u00f3n, se hace constar que se ha cerrado el proceso de
  participaci\u00f3n sin que se haya recibido ninguna alegaci\u00f3n.\\n\\nIru\u00f1ean,
  2017ko maiatzaren 15ean / Pamplona, a 15 de mayo de  2017\\n\\nEUSKARABIDEA-EUSKARAREN
  NAFAR INSTITUTUKO ZUZENDARI KUDEATZAILEA DIRECTOR GERENTE DE EUSKARABIDEA-INSTITUTO
  NAVARRO DEL EUSKERA\\n\\nARREGUI\\n\\nFirmado\\n\\nPEREZ\\n\\nMIKEL - DNI\\n\\ndigitalmente
  por\\n\\nJOSEBA\\n\\n15863774F\\n\\nJOSEBA MIKEL -\\n\\nARREGUI PEREZ\\n\\nDNI 15863774F\\n\\n16:45:02
  +02''00''\\n\\nFecha: 2017.05.15\"", "\"BAKIOKO EUSKEREA - 14\\n\\nSarritan, galdu
  artean ez gara konturatuten etxean zer daukagun. Aor, bada, bertoko euskerea. Askok
  uste leiken baino ederragoa eta aberatsagoa da. Jagon daigun!\\n\\nOarra: Era bitara
  dakarguz, esaterako,\\n\\n* zelan idatzi bear dan: \\\"barrian\\\"\\n\\n*\\n\\nBakion
  zelan esaten dan: \\\"(barridxen)\\\"\\n\\nBERBALAPIKOA\\n\\n\\\"Berbalapiko\\\"
  berbea, au da, berbadun lapikoa, esaten izan deutsogu ZERen iztegi antzera atondutako
  berba mardoari. Leengo baten egin genduan lez, oraingo onetan be, geure-geurea dan
  berbalapiko berezko orren beste zatitxu bat ekarri gura deutsuegu orriotara. Badira
  Bakioko euskeran egunean-egunean erabilten diran berba asko, zer edo agaitik, apur
  bat aaztuta edo baztertuta lotu diranak. Berbok euskera osoarenak dira izan. Eta
  euskerearenak diran ezkero. bertokoak izanda, ganera, edonoganako artuemonetan egunero
  erabilkeran, euskereari berari mesede andia egingo deutsogu. Ikasi eta zabaldu!\\n\\nOarra:
  Berbea, izena edo izenlaguna izanda, zelan idatzi bear danekoan artikulu barik agertuko
