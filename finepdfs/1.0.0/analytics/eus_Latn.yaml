  ordena errespetatuko da)\\n\u2013 Informazio gehiago Paraiso Antzerkiaren webgunean\\n\\nOSTIRALA,
  URRIAK 4\\n\\nGoiza\\n\\n10:00 Mind the Gap proiektua, hezkuntza artistikoa\\n\\nMarta
  Monfort\\n\\n. Teatro Para\u00edso\\n\\n. Gasteizko Antzoki Sarea\\n\\nMikel P\u00e9rez\\n\\nPilar
  L\u00f3pez\\n\\n. Vital Fundazioa\\n\\n10:30 Zein ondo legoke! Irakasleei zuzendutako
  formakuntza artistikoa\\n\\nIrene Intxausti,\\n\\nTeklak Komunikazio eta Audientzien
  Estudioa\\n\\nGasteizko irakasleei zuzendutako formakuntza-ibilbide bat da, eta
  hiru ikasturtetan zehar garatzen da. Bertan, Kulturaren balioa hezkuntza-tresna
  gisa lantzeko eta hiriko geletan artisten egoitzak egiteko aukera ematen da.\\n\\n11:00
  Arte biziak eta hezkuntza: irakasleentzako baliabideak\\n\\nAndrea Arrizabalaga
  Lasa.\\n\\nArtaziak\\n\\nTeatro Paraisorekin elkarlanean egindako lanetik abiatuta,
  arte biziak eta Hezkuntza hurbiltzeko sortutako material didaktikoa partekatuko
  da. Irakaslegoari arte-proposamenak gelan baliabide gisa sartzen lagunduko dieten
  dinamikak, ariketak eta erreferentziak.\\n\\n11:30 Kaferako atsedena\\n\\n12:00
  Kulturarekin hazi, familian, landa-eremuan eta hiri-eremuan\\n\\nAnder Elorza.\\n\\nTeatro
  Para\u00edso\\n\\nTeklak, Komunikazioa eta Audientzien Estudioa\\n\\nPilar L\u00f3pez.\\n\\nHazteak,
  elikatu eta garatu esan nahi du. Baina, nola aplikatu kontzeptu horiek familiaaudientziei?
  Bi esperimentazio-ildo aurkezten dira, eta horiek audientziei zuzenean hitz egin,
  Arteen bidez aurrera egin eta Kulturaren eremuan ernatzea eskatzen dute.\\n\\nArratsaldea\\n\\n18:30
  Ongi etorri instituzionala\\n\\n19:00 Art Thinking. Arteak, sistemari buelta emateko
  tresna gisa\\n\\nCarmen Oviedo.\\n\\nPedagog\u00edas invisibles\\n\\nOhiko hezkuntza-sistemak,
  zentzumenak narkotizatzen dituzten prozedura eta metodologien bidez, baliorik gabe
  uzten gaitu gure gizarteko eragile kritiko eta eraldatzaile gisa. Artea hezkuntza-sistema
  zaharkitu eta pasibo horri buelta emateko tresna gisa ulertzen duen ekintza-esparru
  bat da ''Art Thinking'', herritar aktibo eta kritikoa sortzeko helburua duena.\\n\\n20:30
  Networking gunea\\n\\negitaraua\\n\\n4\\n\\nLARUNBATA, URRIAK 5\\n\\nGoiza\\n\\n10:00
  EN RESiD\u00c8NCiA. Hemen aurkitu dugu pentsatzeko gune bat\\n\\nLlu\u00eds Vallv\u00e9.
  Bartzelonako Hezkuntza Partzuergoa \\\"Creadores En Resid\u00e8ncia\\\", Bigarren
  Hezkuntzako ikastetxe publikoetako artisten, ikasleen eta irakasleen artean partekatutako
  lan esparrua da. Ikasturte osoan zehar eta eskola-orduetan, diziplina eta belaunaldi
  ezberdinetako sortzaile garaikideek sorkuntza prozesuak garatzen dituzte, gazte
  talde batekin batera.\\n\\n10:30 La experiencia L\u00d3VA: remando juntas\\n\\nMaria
  Isabel Diego Benito. Lehen Hezkuntzako irakaslea CPI Samaniego IPI-n. Maria Cristina
  Rioja Samaniego. Haur Hezkuntza eta Lehen Hezkuntzako musika irakaslea CEIP Luis
  Dorao HLHI zentroan.\\n\\nL\u00d3VA  (Opera, hezkuntza tresna bezala) Ikastaro batean
  zehar tutoreek egindako hezkuntzaproiektua da. Gela, zerotik abiatuta, opera bat
  edo musika-antzerki pieza labur  bat sortzen duen konpainia bihurtzen da. Neska-mutilek,
  taldeetan antolaturik, libretoa idazten dute, eszenografia diseinatzen dute, argiztapena,
  musika osatzen dute, komunikazioa eta abar.\\n\\n11:00 Planters: Arteetan eta Arteetatik
  heztea\\n\\nRoger Fern\u00e0ndez Cifuentes.\\n\\nAgitart.\\n\\nMarc Francesch Camps.\\n\\nConArte
  Internacional.\\n\\n\\\"Planters\\\" Eskoletan artisten presentzia ohikoa izatea
  sustatzen du, irakasle eta ikasleekin batera ikasturtean zehar proiektu artistiko
  bat garatzeko. Hitzaldi honetan artistaren rolean sakonduko da, sorkuntza artistiko
  hutsetik harago joaz, oinarrizko gaitasunen lana bultzatzeko, errespetua, elkarrizketa,
  identitatea, ahalduntzea, talde-lana, beste alderdi batzuen artean, hain zuzen ere.\\n\\n11:30
  Kaferako atsedena\\n\\n12:00 Hemengo esperientzien mahai-ingurua:\\n\\nI will be
  everything\\n\\nJemima Cano.\\n\\nBaratza Aretoa\\n\\n7 eta 11 urte bitarteko neska-mutilekin
  audientziak eta ko-kreazioa garatzeko proiektua, Europa Creativa-k finantzatua eta
  nazioarteko zazpi kultur eragilek bultzatua. Bazkide bakoitzak, bere herrialdean,
  tailerrak egiten ditu eskoletan eta beste hezkuntza-gune batzuetan \\\"hemendik
  50 urtera\\\" gaiaren inguruan. Ia 3.500 neska-mutilen erantzunekin, herrialde ezberdinetan
  egiten den hizkuntza anitzeko ikuskizun bat eraikitzen da.\\n\\n0-6 Bizi!\\n\\nManex
  Izagirre. Tabakalera\\n\\n0-6 bizi! 0 eta 6 urte bitarteko haur eta familiei zuzendutako
  proiektua da. Bere helburuen artean daude: adin tarte honetako haurren heziketa
  eta sormena lantzea, zein gurasoen intereseko gaiak jorratzea.0-6 Gunea modu kolektiboan
  eta parte-hartzailean diseinatu, eraiki eta martxan jarri genuen.\\n\\nDantzabideak\\n\\nFernando
  S\u00e1enz de Ugarte. Dantzaz\\n\\nDantza-konpainia batek ikasgelan egiten du lan,
  sormen koreografiko berriak sortuz ikasleekin, eta, gainera, jendeari erakutsiko
  dizkio. Irakasleekin ere lan egiten da, ekoizpen horien arteko zubietan, konpainian
  eta jakintza-arlo desberdinetako programa pedagogikoetan arakatzeko. Bi munduren
  arteko topaketa bat, batasun eta bizikidetza bideak sortzeko, bien arteko hurbiltasuna
  eta egunerokotasuna erakutsiz.\\n\\nEspaciokrea\\n\\nJon Echeverria. Navarra Nuevo
  Futuro elkartea, Gizarte-hezkuntzarako Berrikuntza laborategia Hezkuntza-jardunaren
  berrikuntza gakoa da kolektibo honentzat. Espaciokrea, honen adibide da. Haur eta
  gazteen sormen-prozesua sustatzeko animazio eta partaidetza-jardueren programa honek
  ideiak eta talentua hezkuntza tresna gisa darabil. Bere egite sozioedukatiboaren
  oinarri diren printzipio metodologikoak azalduko dituzte.\\n\\n13:15 Tailerrak\\n\\n_A
  Taldea: Cosmou.\\n\\n_B Taldea:  Zer gertatzen zait niri arte sorkuntzarekin?\\n\\n14:30
  Bazkaria\\n\\nArratsaldea\\n\\n16:00  Tailerrak\\n\\n_A Taldea:  Zer gertatzen zait
  niri arte sorkuntzarekin?\\n\\n_\\n\\nB Taldea:\\n\\nCosmou.\\n\\n17:00 Mahai-ingurua:
  Hutsunea bete\\n\\nParte hartzen dute: Charo Garaigorta, Artium Museoa; Llu\u00eds
  Vallv\u00e9, Bartzelonako Hezkuntza Partzuergoa; Hannah Frances Whelan, Baratza
  aretoa; Hezkuntza alorreko Profesional bat. Moderatzailea: Pilar L\u00f3pez, Teatro
  Para\u00edso.\\n\\n18:30\\n\\nArtistak Egoitzan proiektuaren aurkezpena eta agurra.\\n\\nCOSMOU\\n\\nTAILERRAK\\n\\nGidaria:
  Roger Fern\u00e0ndez Cifuentes. Agitart.\\n\\nAsko dira landu beharreko alderdiak,
  fisikoa, espaziala, erritmikoa edota emozionala, dantzaren mundua ulertzeko. Tailer
  honen ardatzak norberaren gorputza, besteren gorputza eta espazio komunaren kontzientzia
  izango dira, erritmoaz eta musikaltasunaz ahaztu gabe. Pisuarekin, grabitatearekin,
  arintasunarekin, energiarekin eta musikaltasunarekin lotura landuko dugu. Era berean,
  musikaren eta dantzaren arteko loturaz jabetuko gara, eta musika oinarri hartuta
  dantza bizitzeko gai izateko beharrezkoak diren tresnez hornituko gara. Arropa eta
  oinetako erosoak gomendatzen dituzte.\\n\\nGidaria: Jon Echeverria. Asociaci\u00f3n
  Navarra Nuevo Futuro.\\n\\nZER GERTATZEN ZAIT NIRI ARTE SORKUNTZAREKIN?\\n\\nTaldeak
  hausnartuko du nola kokatu, zergatik eta zertarako, haurrekin edo gazteekin arte
  edo sorkuntza prozesu bati ekin nahi zaionean.\\n\\n6\\n\\nAGITART\\n\\nFigueresen
  egoitza duen dantza eta mugimenduaren dinamizatzailea. Proiektu artistikoak eta
  hezkuntza proiektuak koordinatu, antolatu eta gidatzen dituzte. Dantza eta mugimendua
  ondasun sozial, kultural eta pertsonen garapenerako tresna gisa uztartzen dituzte.
  Konpainia Planters proiektuko artista taldearen parte da, \\\"Figueres es Mou\\\"
  dantza eta mugimenduaren jaialdia koordinatzen du eta Figueraseko udalarekin batera
  el Jard\u00ed Udal Antzokiaren dantza programa kudeatzen du.\\n\\nNavarra Nuevo
  Futuro Elkartea\\n\\nHaurren eskubideen sustapenaren arloan\u00a0lan egiten duen
  erakundea, Nafarroako babes sistemen zenbait dispositibo kudeatzen dituena, Latinoamerikan
  gazteenen aldeko ekintzak bultzatuz (Nazioarteko Lankidetza proiektuak), eta gizarte
  hezkuntzaren eremuan meto-dologia berritzaileak garatuz, besteak beste. ANNFk ere
  tokiko eta mugaz haraindiko sareak dinamizatzen ditu, eta ezagutza sortu eta hedatzen
  du bere gizarte-hezkuntzarako berrikuntza laborategiaren bidez. Navarra Nuevo Futuro
  elkartea Mind the GapPOCTEFA proiektuaren bazkide da.\\n\\nHezkuntza artistikoa
  eta bitartekaritza\u00a0kulturalean aritzen den gizarte ekimeneko kooperatiba. Praktika
  eta metodologia artistikoak, ezagutzen partekatzea, eta eraikuntza eta eraldakeratako
  tresna baliagarriak diren ikasketa-prozesuak bultzatzen ditugu. Hezkuntza elkarren
  arteko hartu-eman gisa ulertzen dugu; elkarrizketaren bidez, harreman eta errealitate
  berriak sortzeko aukera duen espazio gisa. Proiektu honek izaera soziala dauka;
  aniztasun kultural eta desberdintasunetik abiatzen da, eta, aldaketa sozial, politiko
  eta kulturalak bideratzeko asmoz, pertsonon gaitasun kritikoa indartzea bilatzen
  du.\\n\\nARTAZIAK\\n\\nArgazkia: Erika Pr\u00fcfert\\n\\nConArte Internacional\\n\\nGazteen
  heziketa eta ahalduntzea du\u00a0 bere lanaren ardatz, eta arteen eta kulturaren
  bidez egiten du, hezkuntza formalean esku hartzeko proiektuak bultzatuz. Hori guztia
  osatzeko, formakuntzak emango dituztenak hekuntza metodologietan trebatzen dira,
  arteen heziketa-gaitasunaren inguruko UNESCOren ibilbideorriaren balioak oinarritzat
  hartuta betiere, arteak hezkuntzan izan dezaketen erabileraren inguruko ezagutza
  sortzeko eta gizarte-eraldaketarako beste hezkuntza-eragile eta kultura-eragile
  batzuekin sarean dauden proiektuak garatzeko. Egun, Mind the Gap proiektuaren bazkidea
  da.\\n\\nBartzelonako Hezkuntza Partzuergoa eta Kultura Institutua\\n\\nPlayground
  Scene (2017). Laia Estruch. EN RESiD\u00c8NCiA Juan Manual Zafra institutuan\\n\\nEn
  Resid\u00e8ncia kultur arloan eragile publiko nagusia den (Kultura Institutua, Bartzelonako
  Udala) eta hezkuntza arloko eragile publiko nagusiaren artean (Bartzelonako Hezkuntza
  Partzuergoa) programatutako eta abian jarritako programa bat da. En Resid\u00e8ncia
  ekintza bateratutik sortua izan zen, kultura eta hezkuntza sistemen arteko ohiko
  banaketa gaindituz, eta bi errealitate hauen arteko ohiko eredua zalantzan jarriz.
  Programa ikuspegi bateratu eta partekatu batetik abiatuta eraiki da. Elkarrekin
  eraikitzeak sendotasun handia eman dio ekimenari, urte gutxian hiri programa bihurtu
  baita.\\n\\nDANTZAZ\\n\\nEkoizpen zentroa, sormen laborategia, dantza konpainia
  eta enplegu zentroa. Horiek dira entitate aitzindari bat definitzen duten ezaugarriak,
  dantzari, koreografo eta sektoreko beste profesional batzuentzako lan aukerak sortzen
  dituen egitasmoa. Dantzaz ekoizpen zentro agortezina ere bada, tokiko eta nazioarteko
  sareetan integratua, etengabeko hedapen eta mugimenduan, dantzaren munduarentzat
  aukerak sortzea xede duena, kalitate, energia eta freskotasun zigilu batez betiere.
  Bere inguruari begira bitartekari-lan garrantzitsua egiten du, bitartekaritza eta
  sentsibilizazio proiektuak sortuz, dantzarako publikoak sortuz.\\n\\nIrabazi asmorik
  gabeko\u00a0 elkartea da, artearen eta hezkuntzaren elkargunean kokatutako proiektuak
  garatzen dituena, bere helmuga sozialismo sortzailea izanik. Hezkuntza formaleko,
  ez-formaleko eta informaleko testuinguruetan eragiten dute, hezkuntzaparadigma tradizionalei
  desafio egiten dieten proiektuen bidez. Ezagutza sortzeko erakundeekin (eskola,
  museoak) egiten dute lan, beren burua gizarte eraldaketarako eragile politiko gisa
  uler dezaten. 4 ekintza-ildoren bidez egiten dute: kultur bitartekaritza, artea
  + hezkuntzari zuzendutako ikerketa, irakasleen formakuntza eta komisariotza pedagogikoa.\\n\\nARTIUM\\n\\nPEDAGOG\u00cdAS
  INVISIBLES\\n\\nGasteizko Arte Garaikidearen Euskal Zentro-Museoko Hezkuntza eta
  Publikoentzako Sailak era guztietako publikoetara zabaltzea du helburu gaur egungo
  sorkuntzaren gakoak. Hainbat ekimenen bidez, eta metodologia egoki batekin, obra
  edo erakusketa ulertzeko eta gozatzeko erraztasunak ematea da bere asmoa, pertsona
  bakoitzari bere interes eta beharretara egokitutako esperientzia esanguratsua eskainiz.
  Hezkuntza eta kultura programa guztiak behaketaren, ikerketaren eta lankidetzaren
  ondorio dira. Besteak beste, eskolako programak eta irakasleei formakuntza emateko
  programak garatzen dituzte.\\n\\nBARATZA ARETOA\\n\\nGasteizen kokatua dagoen arte
  eszeniko garaikideetarako zentro independentea, non, bere espektro zabalenean, kultura-ezagutza,
  formakuntza, programazioa eta bitartekaritza elkartzen diren. Arrakala Kooperatibak
  kudeatzen du espazioa, eta, batez ere, bere praktika artistikoa talde profesionalean
  eta nazioartean beste lan batzuekin uztartzen duten artistek osatzen dute. Nortasun
  hori da, hain zuzen ere, sektorearen beharrei erantzuteko aukera ematen duena, espazioan
  gertatzen denaren balioa pasioz transmititu eta prozesuak, formak eta hizkuntza
  zaindu.\\n\\nTEKLAK\\n\\nTeklak sormena, ezagutza eta pentsamendu kritikoa sustatzen
  duten eragileei (kultur eragileak, gizarte eragileak, zientifikoak etab.) beren
  proiektuak martxan jartzen eta sendotzen laguntzen dien estudioa da. Nola? Tekla
  ezberdinak sakatuz: Audientzien garapenari eta komunikazioari lotutako proiektuak
  aztertuz, sortuz eta bultzatuz; proiektu hauen prozesuak ikus-entzunezkoaren bidez
  dokumentatuz; eta finantzaketa pribatua eta publikoa bilatzeko proiektuak gorpuzten
  lagunduz. Halaber, aipatutako jarduera-ildoen inguruko aholkularitzaeta formakuntza-zerbitzuak
  eskaintzen ditu.\\n\\nTEATRO PARA\u00cdSO\\n\\nDuela 40 urte martxan jarri\u00a0
  zen proiektua da. Gasteizen kokatua dagoen konpainia egonkor honek proiektu globala
  garatzen du non Antzerkia, Haurtzaroa eta Hezkuntza Artistikoa elkarrekin esku-hartzen
  duten. Gainera, publikoa erakartzeko eta hezteko lan egiten du etengabe. Arlo honetan
  dihardutenek Para\u00edso Antzerkia enpresa berritzailetzat daukate, gai, formatu
  eta lanmetodo berriak lantzen baititu. Era berean, konpromiso irmoa du publikoarekin
  eta gizartearekin. 2012an Haur eta Gazteentzako Arte Eszenikoen Sari Nazionala jaso
  zuen Hezkuntza, Kultura eta Kirol Ministerioaren eskutik.\\n\\nLaurogeita hamar
  urtez tabako fabrika izan ostean, 2015. urtean Tabakalerak berriz zabaldu zituen
  ateak hainbat erakunde eta proiektu batu eta inspiratzen dituen kultura garaikidearen
  nazioarteko zentro bilakatuta. Tabakalera osatzen duten askotariko proiektu eta
  erakundeek partekatzen duten misioa honako hau da: euskal gizartearen gaitasun sortzailea
  eta kritikoa garatzen laguntzea, aisialdi sortzaile eta parte hartzailea sustatuz.\\n\\nTABAKALERA\"",
  "\"Euskal Autonomia Erkidegoko tarteko eta kostaldeko uren egoera ekologikoaren
  jarraipen-sarea Laburpen txostena. 2018ko kanpaina.\\n\\nAZTI-Tecnalia\\n\\nMAIATZA
  2019\\n\\nDOKUMENTU-MOTA: Laburpen-txostena\\n\\nDOKUMENTUAREN IZENBURUA: Euskal
  Autonomia Erkidegoko tarteko eta kostaldeko uren egoera ekologikoaren jarraipen-sarea.
  Laburpen txostena. 2018ko kanpaina.\\n\\nNORK EGINA: AZTI-Tecnalia\\n\\nEGILEAK:
  \u00c1ngel Borja, Juan Bald, Javier Franco, Joana Larreta, Iratxe Menchaca, I\u00f1igo
  Muxika, Marta Revilla, J. Germ\u00e1n Rodr\u00edguez, Oihana Solaun, Ainhize Uriarte,
  Izaskun Zorita, Idoia Adarraga, Florencio Aguirrezabalaga, Juan Carlos Sola, Igor
  Cruz, Mikel Aitor Marquiegui, Juli\u00e1n Mart\u00ednez, Jos\u00e9 M\u00aa Ruiz,
  Mar\u00eda Cano, Aitor Laza-Mart\u00ednez eta Alberto Manzanos.\\n\\nDATA: 2019ko
  ekaina\\n\\nAurkibidea\\n\\nEuskal Autonomia Erkidegoko tarteko eta kostaldeko uren
  egoera ekologikoaren jarraipen-sarea.\\nLaburpen txostena. 2018ko kanpaina.\\n\\n1.
  Sarrera ................................................................. 4\\n   1.1.
  Aurrekariak ......................................................... 4\\n   1.2.
  Jarraipena egiteko sarearen diseinua ....................... 6\\n   1.3. Egoeraren
  azterketa ............................................. 8\\n\\n2. Emaitzak .................................................................
  12\\n   2.1. 2018ko egoeraren ebaluazioa .................................. 12\\n   2.2.
  2013-2018 aldiaren egoeraren azterketa .................... 14\\n\\n3. Ondorioak
  .............................................................. 28\\n\\n4. Erreferentziak
  .......................................................... 30\\n\\n5. Eranskinak
  .............................................................. 31\\n\\n1. Sarrera\\n\\n1.1.
  AURREKARIAK\\n\\nUraren Euskal Agentziaren Estatutuen arabera, honi dagokio uren
  analisia, eta ur-kantitate eta ur-kalitate programen helburuen jarraipena eta kontrola
  egitea. Lan hau ezinbestekoa da baliabide hidrikoen eta ustiapen hidraulikoen plangintza
  eta kudeaketarako. Are gehiago, gainontzeko sailekin elkarlanean, plangintza hidrologikoa
  aurrera eramateko ezinbestekoak diren helburuen proposamen eta jarraipenak egiteko
  ere baliogarria da.\\n\\nEuskal Autonomia Erkidegoko (EAE) Administrazio Hidraulikoa
  EAEko tarteko eta kostaldeko uren egoerari buruzko garrantzizko informazioa biltzen
  ari da 1994. urtetik. Hasieratik, sare honen kontrolaren antolamendua Uraren Esparru
  Zuzentaraauak (aurrerantzean UEZ\\\\(^1\\\\)) beranduago egindako eskakizunen antzekoa
  izan da.\\n\\nHasteko, Demarkazio bakoitzeko ingurumenaren, eta gizarte eta ekonomiaren
  ezaugarri eta egoeraren egungo diagnostia egin behar zela zehazten zuen UEZak 5.
  artikuluaren. Gainera, kontuan hartu behar zen 6. artikuluaren aurreikusten ziren
  eremu babestuen erregistroa. Guzti hori, txosten batean bildurik, Europako Erkidegoko
  administraziora bidali behar zen 2005eko martxoaren 23.a baino lehen.\\n\\nHorretarako,
  UEZaren Ezarketarako Estrategia Bateratua jarri zen abian. Honela, hainbat aditu-talderen
  lanaren ondorioz, 5. artikuluaren eskatutakoa era homogeneoan betetzeko gidak idatzi
  ziren; baita gerorako aurreikusitako beste gai batzuetarako ere.\\n\\nGida horiekin
  batera, EAEko Administrazio Hidraulikoak, 2004ko abenduan, \\\"2000/60/EE Uraren
  Esparru Zuzentarauren 5. eta 6. artikuluei buruzko txostena\\\" argitaratu zuen,
  Barne Arroen Demarkazioaren esparrurako, 1994ko uztailaren 1.an eman zen eskumenen
  eskualdatzean, urkontuetan administrazio autonomikoen eskumen eskusiboko espazioa
  lurraldetik definitu zenaren arabera.\\n\\nBestalde, UEZaren 8. artikuluaren arabera,
  5. eta 6. artikuluei buruzko txostena aintzat hartuz, estatukideek uren egoeraren
  jarraipenerako programak ezarri behar zituzten Demarkazio hidrologiko bakoitzean
  ikuspegi orokor, koherente eta osoa lortzeko. Programa horiek indarrean egon behar
  zuten 2006ko abenduaren 22.a baino lehen, eta haien berri eman behar zitzaion Batzordeari
  2007ko\\n\\n---\\n\\n\\\\(^1\\\\) 2000/60/EE Zuzentaraua, 2000ko urriaren 23koa,
  Europako Parlamentuarena eta Kontseiluarena, uren gaineko politikarako erkidegoko
  jarduera-esparrua ezartzen duena;\\n\\nmartxoaren 22.a baino lehen (15. artikulua).\\n\\nErabilgarri
  zegoen informazioarekin, eta UEZaren 8. eta 15. artikuluak betetzeko, 2006. Urte-bukaeran
  \u201cEAEko azaleko ur-masen egoeraren jarraipen-sarea\u201d birdiseinatu zen. Tarteko
  eta kostaldeko ur-masen jarraipenaren estrategia berria 2007ko kanpainan hasi zen
  eta \u201cEuskal Autonomia Erkidegoko tarteko eta kostaldeko uren egoera ekologikoaren
  jarraipen-sarea\u201d sortu zen (hemendik aurrera, Jarraipen-sarea).\\n\\nGaur egun,
  EAEko tarteko eta kostaldeko uren egoera ekologiko eta kimikoaren ebaluazioari dagokionez,
  kontuan hartu behar dira 817/2015\\\\(^2\\\\) Errege-Dekretua eta 1/2016\\\\(^3\\\\)
  Errege-Dekretua. 1/2016 Errege-Dekretuan Kantauri Ekialdeko Demarkazio Hidrografikoaren
  Plan Hidrologikoaren gai batzuk azpimarratzen dira lan honetarako garrantzitsuak
  direnak, hala nola, tarteko eta kostaldeko ur-masen identifikazioa, mugatzea eta
  tipifikazioa, jarraipen-programak eta kontrol-neurriak, metodologiak, ingurumen-kalitatearen
  helburuak... Beste aldetik 817/2015 Errege-Dekretuak ondokoak ezartzen du:\\n\\n-
  Azaleko ur-masen egoeraren jarraipen-programen diseinurako eta eremu babestuen kontrolen
  ezarpenerako oinarrizko irizpideak.\\n\\n- Azaleko uren egoera kimiko ona erdiesteko
  lehentasunezko substantzien eta beste kutsatzaileen Ingurumen-Kalitateko Arauak
  (IKAk).\\n\\n- Kutsatzaile espezifikoen IKAk ezartzea eta azaleko uren egoera ekologiko
  ona edo ahalmen ekologiko ona lortzeko kutsatzaile espezifikoen IKAk kalkulatzeko
  prozedura zehaztea.\\n\\n- Azaleko ur-masen egoera edo ahalmen ekologikoa saikatzeko
  erreferentziazko baldintzak eta kalitate biologiko, fisiko-kimiko eta hidromorfologikoen
  adierazleen egoera-klaseen arteko mugak.\\n\\n\\\\(^2\\\\) 817/2015 Errege Dekretua,
  irailaren 11koa, azaleko uren egoeraren eta ingurumen-kalitateari buruzko arauen
  jarraipena eta ebaluazioa egiteko irizpideak ezartzen dituena\\n\\n\\\\(^3\\\\)
  1/2016 Errege Dekretua, urtarrilaren 8koa, zeinaren bidez, Kantauri Mendebaldeko,
  Guadalquivirreko, Ceutako, Melillako, Segura eta Jucarreko eta Espainiako zatiko
  Kantauri Ekialdeko, Mi\u00f1o-Sileko, Dueroko, Tajoko, Guadianako eta Ebroko Demarkazio
  Hidrografikoaren Plan Hidrologikoen berrikuspena onartzen dena\\n\\n1.2. JARRAIPENA
  EGITEKO SAREAREN DISEINUA\\n\\nEAEn 1/2016 Errege-Dekretuak 14 tarteko ur-masa identifikatzen
  eta mugatzen ditu, lau ur-masa oso aldatuak direlarik (Nerbioi barrualdea eta kanpoaldea,
  Oiartzun eta Urumea), eta lau kostaldeko ur-masa natural (1. irudia, 1. taula eta
  2. taula).\\n\\nHalaber, tarteko ur-masei dagokienez, hiru tipologia identifikatu
  dira (antzeko ezauargarriak dituzten taldeak) eta tipologia bakarra kostaldeko ur-masentzat.
  Tarteko ur-masa oso aldatuen kasuan, ur-masa naturalen antzekotasunagatik esleitzen
  zaie tipologia.\\n\\nUEZaren 8. artikuluaren eskakizunei erantzunez, 2007tik jarraipen-estrategia
  egonkorra ezarri da, non lagintze-puntu eta aztertu beharreko elementuak finkatu
  baitiren (2. irudia):\\n\\n- Lagintze-puntu horietan, ur-, sedimentu-, ornogabe
  bentiko- eta fitoplankton-laginak jasotzen dira (16 kostaldeko uretan eta 32 tarteko
  uretan) (ikus eranskina).\\n\\n- Arrainen azterketarako trantsektuak tarteko uretan.
  Ikerketa honetan, urte bakoitzeko lau estuario lagintzen dira; honela, hiru urteko
  ziklo bakoitzean EAEn dauden 12 estuarioen azterketa burutzen delarik (guztira,
  14 ur-masa).\\n\\n- Makroalgen azterketarako lagintze-eremuak tarteko eta kostaldeko
  uretan, arrainekin jarraitzen den estrategia bera jarraituz, hiru urtean behin lagintzen
  direnak. Tarteko uren kasuan, ur-masa bakoitzaren azterketa estentsiboa egiten da.\\n\\n-
  Egoera kimikoaren azterketarako lagintze-puntu operatiboak bereiztu dira egoera
  kimiko ona ez lortzeko ariskua dagoen lekuetan. Honela, 2007tik aurrera, lagintze-puntu
  operatibo horietan, hilero lagintzen dira urak substantzia batzuk neurtzeko.\\n\\n-
  EAEn Europar Itsas Estrategiaren Zuzentarauari erantzuna emateko, hiru lagintze-puntu
  daude kontinente-plataforman.\\n\\n1. irudia Euskal Autonomia Erkidegoan mugatutako
  18 tarteko eta kostaldeko ur-masen banaketa erakusten duen mapa.\\n\\n2. irudia  Euskal
  Autonomia Erkidegoko tarteko eta kostaldeko uren egoera ekologikoaren jarraipen-sareko
  lagintze-puntuen kokapena azaltzen duen mapa.\\n\\n1. taula  Euskal Autonomia Erkidegoan
  identifikatu diren kostaldeko ur-masak, eta dagozkien tipologia eta kontrol-guneak.
  Tipologiaren kodea: AC-T12= Kantauri Ekiadako kostaldeko ur atlantikoak, azaleratzerik
  gabe agerian daudenak. UMOA: , ur-masa oso aldautua.\\n\\n| Kodea          | Ur-masa         |
  UMOA | Tipologia | Erlazionaturiko lagintze-puntuak |\\n|----------------|-----------------|------|-----------|----------------------------------|\\n|
  ES111C000030   | Kantabria-Matixako | Ez   | AC-T12    | L-N10, L-N20, L-B10, L-B20      |\\n|
  ES111C000020   | Matixako-Getaria | Ez   | AC-T12    | L-OK10, L-L10, L-L20, L-A10,
  L-D10, L-U10 |\\n| ES111C000010   | Getaria-Higer   | Ez   | AC-T12    | L-O10,
