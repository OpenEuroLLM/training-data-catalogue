  ES111T042010| Deba       | Ez   | AT-T08    | E-D5, E-D10                             |\\n|
  ES111T034010| Urola      | Ez   | AT-T09    | E-U5, E-U8, E-U10                       |\\n|
  ES111T028010| Oria       | Ez   | AT-T09    | E-O5, E-O10                             |\\n|
  ES111T018010| Urumea     | Bai  | AT-T08    | E-UR5, E-UR10                           |\\n|
  ES111T014010| Oiartzun   | Bai  | AT-T10    | E-OI10, E-OI15, E-OI20                  |\\n|
  ES111T012010| Bidasoa    | Ez   | AT-T10    | E-Bi5, E-Bi10, E-Bi20                   |\\n\\n1.3.
  EGOERAREN AZTERKETA\\n\\nAzaleko uren egoeraren sailkapenari dagokionez, 817/2015
  Errege-Dekretuak eguneratzen duen uztailak 6ko 907/2007 Errege-Dekretuaren 26. artikuluaren
  onartzen den Plangintza Hidrologikoaren Araudiak (PHA aurrerantzean) honela dio:\\n\\n2.
  Azaleko uren **egoera ekologikoa** oso ona, ona, neurrizko, eskas edo txar bezala
  sailkatuko da.\\n\\n3. Azaleko uretako masen **egoera ekologikoa sailkatzeko kalitate-elementu
  biologiko, kimiko eta fisiko-kimikoak eta hidromorfologikoak** erabiliko dira V
  eranskinoko araudi definizioen arabera, zeinen adierazleak, 817/2015 Errege Dekretua,
  irailaren 11koa, azaleko uren egoeraren eta ingurumen-kalitateari buruzko arauen
  jarraipena eta ebaluazioa egiteko irizpideak ezartzen dituena.\\n\\n4. Ur-masa artifizial
  eta oso aldatutakoei aplikatzeko moduko kalitate-elementuak izango dira kasuko ur
  artifizialen edo oso aldatutako masaren antza gehien duten azaleko ur naturalen
  kategoria edo motara aplikatzearren ondoriozkoak.\\n\\nPHAko 29. eta 30. artikuluek
  tarteko eta kostaldeko uren egoera ekologikoaren sailkapenerako beharrezkoak diren
  kalitate-elementuak zehazten dituzte (3. taula).\\n\\n3. taula Egoera ekologikoaren
  sailkapenerako kalitate biologikoaren adierazleak. PHAko 29. eta 30. Artikuluak.\\n\\n|
  Kategoria         | Adierazle biologikoak                                                                 |\\n|--------------------|---------------------------------------------------------------------------------------|\\n|
  Tarteko urak       | Fitoplanktonaren konposizioa, ugaritasuna eta biomasa                                |\\n|                    |
  Bestelako flora urtarraren konposizioa eta ugaritasuna                                |\\n|                    |
  Ornogabe bentikoen konposizioa eta ugaritasuna                                       |\\n|                    |
  Arrainen konposizioa eta ugaritasuna                                                  |\\n|
  Kostaldeko urak    | Fitoplanktonaren konposizioa, ugaritasuna eta biomasa                                |\\n|                    |
  Bestelako flora urtarraren konposizioa eta ugaritasuna                                |\\n|                    |
  Ornogabe bentikoen konposizioa eta ugaritasuna                                       |\\n\\nUEZaren
  arabera, egoera ekologikoaren balorazioa adierazle biologiko bakoitzaren balorazio
  txarrenak mugatzen du (\\\"bat kanpoan, denak kanpoan\\\" (BKDK) printzipioa). Hau
  da, adibidez, fitoplanktonak egoera neurrizkoa badu, eta gainontzeko elementuek
  egoera biologiko ona azaltzen badute, egoera ekologikoaren balorazioa neurrizkoa
  izango da gehienez. Egoera ekologikoaren kalkulurako, kalitate biologikoa oso ona
  edo ona denean bakarrik hartzen da kontuan kalitate fisiko-kimikoa. Bestalde, adierazle
  hidromorfologikoak egoera oso ona edo ona den bereizteko erabiltzen dira soiliak
  (ahalmen ekologikoaren balorazioan ez dira aintzat hartzen) (3. irudia).\\n\\n3.
  irudia  Uren Esparru Zuzentarauan onarritutako egoera ekologikoaren kalifikazio
  prozesua 817/2015 Errege-Dekretuaren arabera.\\n\\nEgoera ekologikoa zehazteko egoera
  biologikoaren balorazioa eta eragina daukaten adierazle fisiko-kimikoak (baldintza
  fisiko-kimiko orokorrak eta substantzia preferenteak) hartzen dira kontuan.\\n\\nUr-masak
  tipologiatan multzokatzea baliogarria da bakoitzari bere ezaugarri naturalak eta
  asaldurarik gabeko balioak zehazteko. Honela, egoera ekologikoaren baloraziorako
  hain berarrezkoak diren erreferentziazko baldintzak eta ingurumen-helburuak ezar
  daitezke tipologia bakoitzarentzat, kalitate biologikoko adierazleei eta kalitate
  fisiko-kimikoaren adierazleei dagozkienak (3. taula).\\n\\nEgoera ekologiko \\\"ona\\\"
  definizioak beragan darama aldaketa gabeko edo erreferentziazko baldintzekiko desbideratzearen
  kontzeptua. Hala, egoeraren kontrol-sistemak erabili behar dira, zeinak gai izango
  baitiren kalitate biologikoaren adierazleen balioak kalkulatu eta erreferentziazko
  baldintzekiko desbideratze-maila zenbatesteko.\\n\\nAdierazle bakoitza hainbat metriken
  edo parametroen azterketaren emaitza da eta, normalean, adierazleak indize multimetrikoetan
  integratzen dira. 2014ean, AZTIk URArentzat \\\"EAEko ur-mesen egoeraren jarraipenerako
  laginketa, laborategi eta indize eta metriken kalkulurako protokoloak\\\" prestatu
  zituen. Protokolo horiek tarteko eta kostaldeko ur-masetan aztertzen diren fitoplankton,
  makroalga eta ornogabe bentikoen azterketarako metodoak azaltzea dituzte eta baita
  tarteko ur-masetan ebaluatzaren arrainentzakoak ere. Protokolo horiek dohainik jaitsi
  daitezke URArren\\n\\nwebgunetik\\\\(^4\\\\). Uren eta sedimentuen ezaugarri fisiko-kimikoentzat
  ere prestatu dira protokoloak.\\n\\nAdierazle biologikoei dagokiez, kontrol-sistema
  optimoetan, ur-masa batean behatutako balioen eta ur-masari dagozkion erreferentziazko
  baldintzen balioen arteko proportzioa zehaztuko litzateke. Erlazio horri, EQR esaten
  zaio (Ecological Quality Ratio) eta zero eta bat arteko balioak hartuko lituzke.
  EQR horren arabera, bost egoera posible daude: oso ona, ona, neurrizkoa, eskasa
  eta txarra.\\n\\nAzaleko ur-masetako adierazle biologikoen kasuan, ur-masen egoera
  ekologikoa ona izatea da ingurumen-helburua, hau da: UEZKo adierazle biologiko bakoitzak
  EQR jakin bat betetzea. Egoera oso ona eta egoera onaren arteko mugaren balioa,
  eta egoera ona eta egoera neurrizkoa bereizten dituen balioa, Europako Batzordeak
  sustatutako interkalibrazio-ariketaren bidez zehaztu dira.\\n\\nGaur egun, Kantauri
  Ekialdeko Demarkazio Hidrografikoaren tarteko eta kostaldeko ur-masen erreferentziazko
  baldintzak eta egoera-klaseen arteko mugak Kantauri Ekialdeko Demarkazio Hidrografikoaren
  PHAren 5. artikuluan jasotzen dira (1/2016 Errege-Dekretua)\\n\\nKostaldeko uretan
  hainbat adierazle biologikorentzat ebaluazio-sistemak eta erreferentziazko baldintzak
  ezarrita daude, adibidez: *Spanish Phytoplankton Tool* (fitoplanktonarentzat); M-AMBI
  (substratu biguneko makroornogabe bentikoentzat); CFR eta RICQI (makroalgentzat).
  Bestalde, tarteko uretan, AFI (arrainentzat), M-AMBI eta *Spanish Phytoplankton
  Tool* adierazle biologikoak interkalibratuta daude. Hala ere, fitoplanktonaren kasuan,
  \u201cklorofila\u201d metrika besterik ez dago interkalibratuta.\\n\\nEuropar Batzordeak,
  2018an, interkalibrazioaren emaitzak argitaratu ditu. Kostaldeko angiospermen kasuan,
  Demarkazioko uretan era natural batean ez daudela aitortzen da. Bestalde, tarteko
  uretan, makroalgak aztertzetan diren arren, ez dira interkalibratu, Kantauriko tarteko
  urak elementu biologiko honen garapenerako egokiak ez direla onartzen baita.\\n\\nPHAren
  26. artikuluan *egoera kimikoa* sailkatzeko \u201cazaleko uren egoera kimikoa egoera
  onean edo ona baino okerrago bezala sailkatuko da\u201d esaten da, hau da: egoera
  ona erdiesten den ala ez aztertu behar da. Egoera kimikoa ezartzeko 817/2015 Errege-Dekretuan
  ezarritako IKAK hartzen dira oinarri. Horren harira, uretan, sedimentuetan edo biotan
  dagoen kutsatzaile jakin baten edo kutsatzaile jakin batzuen kontzentrazioa, ingurumena
  eta giza osasuna zaintzeko gainditu behar ez dena da IKA. Atalase horiek honela
  adieraz daitezke: kontzentrazio onargarririk handiena (IKA-KOH) edo urteko batez
  besteko kontzentrazioa (IKA-UB).\\n\\n*Jarraipen-sare* honetan egoera kimikoaen
  ebaluaziorako ez dira kontuan hartu 817/2015 Errege-Dekretuko IV eta V eranskinetan
  azaltzen diren substantzia guztiak. Neurtu direnak 4. taulan azaltzen dira. Serie
  historikoarekin jarraitzeko, analisia egiteko ahalmena dagoelako eta kutsatzaileen
  iturri posibleak ezagutzen direlako, besteak beste, aukeratu dira substantzia horiek.\\n\\n---\\n\\n\\\\(^4\\\\)
