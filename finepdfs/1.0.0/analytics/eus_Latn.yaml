  etenaldia / Interrupci\u00f3n temporal corte de agua programado\\n\\nEstimado se\u00f1or
  / se\u00f1ora,\\n\\nJaun / Andre agurgarria,\\n\\nBitartekoen lanak direla eta,
  uraren hornidura aldi baterako etengo da 2020/09/16 09:00 etatik - 13:00 etara.\\n\\nKaltetutako
  eremua:\\n\\nC/ IORGI 4, 6, 8-ED, 8-EI, 8, 10, 32, 34, 36\\n\\nNahi izanez gero,
  jarri harremanetan BBUPko Udal Sareen Zuzendariordetzarekin.\\n\\nHar ezazu agur
  bero bat,\\n\\nAdeitasunez,\\n\\nDebido a obras realizadas por terceros, se ha programado
  la interrupci\u00f3n temporal del suministro de agua potable en la red municipal
