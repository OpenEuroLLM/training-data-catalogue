  O    | O    | O    | O    | O    |\"", "\"GIPUZKOAKO FORU ALDUNDIA\\n\\nOGASUN ETA
  FINANTZA DEPARTAMENTUA\\n\\nGipuzkoako Foru Aldundiak eta Gipuzkoako udalek Ondasun
  Higiezinen gaineko Zergaren kudeaketarako izenpeturiko hitzarmenak.\\n\\n1994ko
  urriaren 18ko erabakiaren bidez Diputatuen Kontseiluak hitzarmen eredu batzuk onartu
  zituen, Gipuzkoako udalek delegazio edota lankidetza maila desberdinen artean aukeratu
  ahal izan zezaten, zergak ordaintzeko borondatezko epean nola epe exekutiboan, Jarduera
  Ekonomikoen gaineko Zerga eta Ondasun Higiezinen gaineko Zerga kudeatzeko.\\n\\nOndasun
  Higiezinen gaineko Zergari dagokionez, hauek dira onartutako hitzarmen ereduak:\\n\\n\u2014
  I. eranskina: OHZ - Lankidetza-eskuordetzea zergaren kudeaketan.\\n\u2014 II eranskina:
  OHZ - Lankidetza-eskuordetzea borondatezko bidean, eta eskuordetzea bide exekutiboan.\\n\u2014
  III eranskina: OHZ - Eskuordetzea borondatezko bidean\\n\u2014 IV eranskina: OHZ
  - Eskuordetzea zergaren kudeaketan.\\n\\n1989ko uztailaren 5eko 12/1989 Foru Arauak,
  Ondasun Higiezinen gaineko Zergarenak, bigarren xedapenean, ezartzen du aipatu zergaren
  kudeaketarako sinatutako hitzarmenak Gipuzkoako ALDIZKARI OFIZIALEAN argitaratuko
  direla.\\n\\nHorrela, Udalek eta Aldundiak hitzarmen horiek sinatu ondoren, ereduak
  oso-osorik eman ziren argitara, aukera egin zuten udalen zerrendarekin batera 1995eko
  otsailaren 28ko Gipuzkoako ALDIZKARI OFIZIALEAN.\\n\\nDIPUTACION FORAL DE GIPUZKOA\\n\\nDEPARTAMENTO
  DE HACIENDA Y FINANZAS\\n\\nConvenios para la gesti\u00f3n del Impuesto sobre Bienes
  Inmuebles entre la Diputaci\u00f3n Foral de Gipuzkoa y los Ayuntamientos guipuzcoanos.\\n\\nPor
  Acuerdo del Consejo de Diputados de fecha 18 de octubre de 1994 se aprobaron diversos
  modelos de convenio, a fin de ofrecer a los Ayuntamientos del Territorio Hist\u00f3rico
  la posibilidad de optar por distintos grados de delegaci\u00f3n y/o colaboraci\u00f3n
  tanto en periodo voluntario de pago como en v\u00eda ejecutiva, en la gesti\u00f3n
  del Impuesto sobre Actividades Econ\u00f3micas y del Impuesto sobre Bienes Inmuebles.\\n\\nEn
  relaci\u00f3n con el Impuesto sobre Bienes Inmuebles, los distintos modelos de convenio
  aprobados fueron los siguientes:\\n\\n\u2014 Anexo I: IBI - Colaboraci\u00f3n-delegaci\u00f3n
  en la gesti\u00f3n del impuesto.\\n\u2014 Anexo II: IBI - Colaboraci\u00f3n-delegaci\u00f3n
  en v\u00eda voluntaria, y delegaci\u00f3n en v\u00eda ejecutiva.\\n\u2014 Anexo
  III: IBI - Delegaci\u00f3n en v\u00eda voluntaria.\\n\u2014 Anexo IV: IBI - Delegaci\u00f3n
  en la gesti\u00f3n del Impuesto.\\n\\nLa Disposici\u00f3n Adicional Segunda de la
  Norma Foral 12/1989, de 5 de julio, del Impuesto sobre Bienes Inmuebles dispone
  que los convenios suscritos en relaci\u00f3n con la gesti\u00f3n del citado impuesto
  se publicar\u00e1n en el BOLETIN OFICIAL de Gipuzkoa.\\n\\nAs\u00ed, una vez suscritos
  dichos convenios por los Ayuntamientos y por la Diputaci\u00f3n, en el BOLETIN OFICIAL
  de Gipuzkoa de 28 de febrero de 1995, se publicaron los distintos modelos, en su
  contenido \u00edntegro, junto con la relaci\u00f3n de Ayuntamientos que optaban
  por cada uno de ellos.\\n\\nGeroztik hainbat udalek erabaki dute hasieran sinatutako
  hitzarmena bertan behera uztea eta hitzarmen eredu berri bat sinatzea. Horrela,
  2011. ekitaldian indarrean dauden hitzarmenen zerrenda osoa argitaratzen da dagozkion
  ondorioetarako eta denek jakin dezaten.\\n\\nDesde dicha fecha han sido varios los
  Ayuntamientos que han acordado suscribir un modelo de convenio distinto al originalmente
  suscrito por lo que se procede a la publicaci\u00f3n de la relaci\u00f3n integra
  de los convenios vigentes para el ejercicio 2012, a los efectos oportunos para general
  conocimiento.\\n\\nUdala\\n\\nAyuntamiento\\n\\nConvenio suscrito\\n\\nAtaun\\n\\nSinatutako
  hitzarmena\\n\\nIV. eranskina\\n\\nAtaun\\n\\nAnexo IV\\n\\nHorrela argitaratzen
  da dagozkion ondorioetarako eta denek jakin dezaten\\n\\nLo que se publica a los
  efectos oportunos para general conocimiento.\\n\\nDonostia, 2012ko urtarrilaren
  24a.\u2014Mar\u00eda Jes\u00fas P\u00e9rez Garciarena, idazkari teknikoa.\\n\\n(512)\\n\\n(796)\\n\\nDonostia-San
  Sebasti\u00e1n, a 24 de enero de 2012.\u2014La secretaria t\u00e9cnica, Mar\u00eda
  Jes\u00fas P\u00e9rez Garciarena.\\n\\n(512)\\n\\n(796)\"", "\"Salburua biodibertsoa
  da\\n\\nIrakaslearentzako gida didaktikoa\\nDerrigorrezko Bigarren Hezkuntzako 1go
  eta 2. mailak\\n\\nDBH\\n\\n1go eta 2. mailak\\n\\n# AURKIBIDEA\\n\\n| 1. AURKEZPENA
  | 2 |\\n|---------------|---|\\n| 2. HARTZAILEAK | 2 |\\n| 3. HELBURUAK | 2 |\\n|
  4. PROGRAMAREN DESKRIBAPENA | 3 |\\n|   4.1. Bisita aurretik. |   |\\n|   4.2. Bisitaren
  nondik norakoak. |   |\\n|   4.3. Bisita ondoren. |   |\\n| 5. EDUKIAK | 7 |\\n|
  6. PROGRAMAREN EGOKITZAPENA HLOra | 8 |\\n| 7. EKINTZAK ETA CURRICULUMAREKIN LOTURA
  | 11 |\\n| 8. EBALUAKETA | 13 |\\n|   8.1. Ikaslearen ebaluaketa. |   |\\n|   8.2.
  Irakaslearen aldetiko ebaluaketa. |   |\\n|   8.3. Barne ebaluaketa. |   |\\n| 9.
  INFORMAZIO GEHIGARRIA | 14 |\\n|   9.1. Salburua eta Atariari buruz. |   |\\n|   9.2.
  Erlazionatutako gaiei buruz. |   |\\n| 10. ERANSKINAK | 14 |\\n|   10.1. I. Eranskina:
  Ikaslearentzako fitxa. |   |\\n|   10.2. II. Eranskina: Irakasleentzako fitxa. |   |\\n|   10.3.
  III. Eranskina: Irakasleen ebaluaketa. |   |\\n\\n1. AURKEZPENA\\n\\nZergatik izango
  ote da horren preziatua Salburuako hezegunea? Zein da duen garrantzia? Zein ideia
  dugu hezegunearen inguruan? Dagokion bezala baloratzen al dugu? Honako galdera hauei
  erantzuna ematen saiatzen da 12-14 urte bitarteko ikasleei zuzenduriko \u201cSalburua
  biodibertsoa da\u201d izeneko programa. Ardatz nagusia Salburuako biodibertsitatea
  eta honek inguruaren hobekuntza ekologikoan zein gure ongizatean duen ekarpena da.
  Bisitan zehar ikasleek Salburuako biodibertsitatearen ezaugarri eta aspektu ezberdinak
  ezagutuko dituzte eta honek, hain garrantzitsuak den hezegune hau babestu eta zaintzeko
  beharrari buruz kontzientziatzat lagunduko die.\\n\\n2. HARTZAILEAK\\n\\nHezkuntza
  programa honen hartzailaek Derrigorrezko Bigarren Hezkuntzako 1. eta 2. mailako
  ikasleak dira. Programaren helburuak, edukiak zein ekintzak curriculumera egokituta
  daudelarik.\\n\\nGainera, bere hezkuntza osatzeko programa honetan ageri diren ekintza
  eta ariketak egiteko interesa duen beste edozein taldek (ludotekak, udalekuak\u2026)
  egiteko egokia da ere.\\n\\n3. HELBURUAK\\n\\nHonakoak dira helburu nagusiak:\\n\\n-
  Gure inguru baloratu eta babesteko ekarpenak egitea: Salburua nazioarte mailako
  garrantzia duen hezegunea da.\\n\\n- Salburua neguan ezagutzea. Natura urtaro ezberdinetara
  nola egokitzen den antzematea: erritmo naturalak.\\n\\n- Salburuak bere barnean
  duen biodibertsitatea ezagutzea, hau baita garrantzitsuak eta interesgarria izatearen
  arrazoi nagusia.\\n\\n- Giza ekintzak Salburuan duen eraginaz jabetzea.\\n\\n- Izaki
  bizidun orok duen garrantzia eta baloreez jabetzea.\\n\\n- Naturarekin eta Salburuarekin
  lotura emoziionalak indartzea.\\n\\n4. PROGRAMAREN DESKRIBAPENA\\n\\nProgramaren
  planteamendu orokorra ondorengoa da:\\n\\n4.1. BISITA AURRETIK\\n\\nIkastetxean
  bisita aurretik ikasleekin hainbat ekintza egiteko aukera eskaintzen da. Hautazkoak
  dira, baina gomendagarriak dira ikasleek bisita modu erakargarriago batean har dezaten
  eta probetxugarriagoa izan dakienean. Ekintza hauean gaia aurkezten da, aurretikako
  ezaguerak baloratzen dira, bisitarako motibazioa lantzen da eta ikasleek bisitatuko
  dutenaren oinarrizko kontzeptu batzuk bereganatzen laguntzen da.\\n\\n| EKINTZA
  MOTA | EKINTZA | EDUKIAK                                                                 |
  IRAUPENA          |\\n|--------------|---------|------------------------------------------------------------------------|-------------------|\\n|
  Sentsibilizazioa eta motibazioa | \u201cGonbidatuzaude\u201d | \u2022 Gure gertuko
  ingurunea ezagutzeak eta baloratzeak duen garrantzia.  \\n\u2022 Salburua hezegunea.  \\n\u2022
  Datak, ordutegia, eraman beharreko materiala. | 15\u2019 - powerpointa |\\n| Irteeren
  antolaketa eta informazioa | Zer ezaguten duzu Salburuak? | \u2022 Zer da Salburua  \\n\u2022
  Salburuako biodibertsitatea  \\n\u2022 Salburua neguan  \\n\u2022 Bisoi europarra,
  Salburuan bizi den espezie mehatxuta. | 20\u2019 - galdeketa  \\n1h - bisoiaren
  muraia |\\n\\nI. eranskinean ikasleen aurretik lantzeko ariketen fitxak konsulta
  daitezke (inprimatu eta fotokopiatzeko prest, txuri-beltzean). Power Pointa, formatu
  ezberdina daukanez, beste dokumento batean eransten da. II. eranskinean, irakasleari
  zuzendutako materiala (erantzunekin) dago.\\n\\nModu osagarrian, ondorengoa ere
  egin daiteke:\\n- Ondorengoari buruzko album, kartel edo power-pointa:\\n  - neguan
  Salburuan.\\n  - biodibertsitatea Salburuan\\n- Eta talde edo ikasgela ezberdinek
  sortutako materiala elkar trukatu edo aurkezteko data zehaztu.\\n- Erakusketa bat
  egin, kartelak pasilo edo geletan jarriz.\\n\\n4.2. BISITAREN NONDIK NORAKOAK\\n\\n4.2.1.
  Sekuentziazioa\\n\\n2,5 orduko iraupena duen programa hau urtarrila eta otsaila
  bitartean garatuko da, eskola ordutegian. Hamaiketakoa egiteko 20\u2019 hartuko
  dira.\\n\\nIkasle taldea 3 azpitaldetan banatuko da, eta bakoitzak ekintza berdinak
  landuko ditu, baina ordena ezberdinean, 3 zonaldeetatik errotatuz:\\n\\n- **Zumetako
  behatokiraino ibilbidea**. Ibilbidean parkeko ekosistema interesgarrienetakoak behatuko
  dira: \u201cEl Montecico\u201d irla-hariztia, Arkauteko urmaela, lizardi eta sahasti
  galeria-basoak eta lezka zeliaiak. Zona hezeak eta basoak txandakatzen dituen ingurune
  hau bisoi europarra edo baso-igel jauzkaria bezalako mehatxatutako espezieen habitata
  da. Urmaelek hegazti urtar espezie ezberdin asko jasotzen dituzte, baita neguan
  ere. Eguraldi txarra izatekotan, ekintzak Atariako hainbat gelatan egiteko aukera
  dago.\\n\\n- **Tailer-gela**, lupa binokularrak, mikroskopioak, poteak, sareak,
  matxardak,\u2026 eta makro-ornogabe urtaren laginak jaso, prestatu eta behatzeko
  behar den material guztiarekin hornituta.\\n\\n- **Erakusketa iraunkorra**, kasu
  honetan hurrengo baliabide didaktikoak erabiltzen direlarik: \u201cSalburuaren eboluzioa\u201d,
  \u201cSare trofikoa\u201d eta \u201cKuriositate galeria\u201d, azken bi atal hauetan
  bisoi europarra behatzen delarik.\\n\\n---\\n\\n**Azpitaldeen errotazio diagrama**\\n\\n|       |
  1. Azpitalde | 2. Azpitalde | 3. Azpitalde |\\n|-------|--------------|--------------|--------------|\\n|
  10:00 | SALBURUA     | TAILERRA     | ERAKUSKETA   |\\n| 11:00 | TAILERRA     |
  ERAKUSKETA   | SALBURUA     |\\n| 12:00 | ERAKUSKETA   | SALBURUA     | TAILERRA     |\\n|
  13:00 |              |              |              |\\n\\n### 4.2.2. Garatzeko ekintzak
  eta lantzeko edukiak\\n\\n| EREMUAK | EKINTZAK | EDUKIAK | METODOLOGIA |\\n|---------|----------|---------|-------------|\\n|
  **HARRERA** | Aurkezpena | Ongietorria eman, azpitaldeak antolatu, aurretiko ezagutza
  maila baloratzea. | \u00b7 Galderak - erantzunak. |\\n| **IBILBIDEA** | Landare
  bakoitzaren lekuak | Landare biodibertsitatea ezagutu Salburuan. Landare espezie
  esanguratsuenak identifikatzea. Landaretzaren eta uraren arteko harremanak ezagutzea.
  Salburuko ekosistema eta espezie interesgarriak. | \u00b7 Urmaelen eta landaretzak
  hauen ingurunean daukaten antolamenduaren in situ behaketa. Irudi, grafiko eta perfilen
  erabilera. \u00b7 Landare espezie urtar eta lurtarren identifikazioa. Identifikaziorako
  ezaugarri nagusien behaketa. |\\n| | Hegaziak Salburuan | Hegazti negutar eta sedentarioak
  ezberdintzea. Hegazti espezie nagusienak ezberdin-du eta sailkatu. Ekosistema eta
  espezie interesgarriak Salburuan. | \u00b7 Hegaztiak urrutitzen behatzeko tresnen
  erabilera: prismatikoak, teleskopiak,... \u00b7 Hegazti behaketa teknikak. |\\n|
  **TAILER-GELA** | Detektibe naturalak | Salburuko hezegunearen neguko organismo
  urtar bereizgarrienak ezagutu eta sailkatzea. Ornogabeak baloratzen ikasi. | \u00b7
  Lupa binokularrak eta mikroskopioa erabiltzen ikasi. \u00b7 Laginak jaso eta prestatzeko
  teknikak ezagutzea. |\\n| | Ur arkakusoak | Ur arkakusoa hobeto ezagutu: anatomia,
  ugalketa. Ur arkakusoak uraren kalitatearen adierazle bezala. Ornogabeak baloratzen
  ikasi. | \u00b7 Ur arkakusoa behatu eta aztertu, irudi eta benetako laginen laguntzarekin.
  |\\n| **ERAKUSKETA** | Bazen behin Salburua | Hezeguneak ekosistema oso biodibertsotsoak.
  Eremu hezeen garrantzia. Salburuko hezegunearen berriztapena. | \u00b7 Hezeguneko
  urtaro ezberdinetako ilustrazio eta irudien erabilera. |\\n| | Mehatxuak Salburuan
  | Salburuko hezegunean eta bertan bizidun flora eta faunari eragin diezaioko mehatxuez
  jabetzea. Salburuaren gozamenean, kontserbazioan eta babesean ikasleak inplikatu.
  | \u00b7 Ondorioztapen teknikak. |\\n\\n4.3. BISITA ONDOREN\\n\\nBisita ondorengo
  aukerazko ekintzetan, ebaluazioa hurrengo modu hauetan egin daiteke:\\n\\n- Ikasle
  bakoitzak bisita egin aurretik bete zuen galdetegia zuzendu dezake edo bere gelakide
  anonimo batena, Salburuan ikasitakoaz jabetzeko helburuarekin.\\n\\n- Atariara bidali
  daitekeen idazlan txiki baten bitartez hurrengo galdera hauei erantzuna emanez:
  Zergatik esaten dugu Salburua biodibertsoa dela? eta Zergatik da hain garrantzitsuak
  horrelakoa izatea?. Bidalitako idazlanak tailer-gelako panel-mural baten jartzen
  dira eta Atariako web orrian zintzilikatzen dira.\\n\\n- Bisoi europarraren eta
  Salburuaren kontserbatzeko konpromisoa hartuz, Atariara bidaltzen den konpromiso
  zerrenda baten bitartez, eta (www.ataria.es) web gunean argitaratzen dira, dinamizatzeko
  balio duelarik eta era berean tailer-gelako muralean jartzen dira.\\n\\nI. eranskinean,
  aurretiko materialak dauzkana, bisita ondorengo ekintzen fitxa erantsita doa.\\n\\n5.
  EDUKIAK\\n\\n5.1. EDUKI KONTZEPTUALAK\\n\\n- Biodibertsitatearen balioa eta garrantzia.\\n-
  Salburuako biodibertsitatea: ekosistemak, flora eta fauna espezieak, indibiduoak,\u2026\\n  Espezie
  interesgarriak kantitateagatik, mehatxu mailagatik, banaketa eremuagatik,\u2026\\n-
  Hezegunetako eta Vitoria-Gasteizko ingurunearen ekosistemekin erlazionatutako flora
  eta fauna:\\n  - Salburuako hegazti urtarrak: espezie negutarrak eta sedentarioak.\\n  -
  Salburuako landaretza: flora urtarra eta lurtarra.\\n  - Salburuako fauna ornegabea:
  makro-ornogabe urtarrak.\\n- Salburua neguan: neguko klimatologiari aurre egiteko
  faunaren estrategiak.\\n- Salburuako hezegunearen historia eta eboluzioa. Hezegunearen
  berriztapena.\\n- Mehatxuak, bai biodibertsitateari, bai flora eta fauna espezieei
  eta bai Salburuari.\\n- Bisoi europarra, espezie mehatxatu bat Salburuan.\\n\\n5.2.
  PROZEDURA EDUKIAK\\n\\n- Hegazti-faunaren eta beste fauna espezieen behaketa zuzena.
  Oinarritzko ezaugarriak: identifikazioa, ezaugarriak, ugalketa eta jokabideak.\\n-
  Salburuako Hezegunearen ekosistemarekin erlazionatuta dauden landare, zuhaixka eta
  zuhaitzen eta beren hedaduraren identifikazioa eta ezagutza.\\n- Faunaren behaketa
  teknikak eta prismatiko eta teleskopioen erabilera ezagutu eta maneiatu.\\n\\n5.3.
  JOKABIDE EDUKIAK\\n\\n- Naturaz urte osoan zehar gozatu.\\n- Gure jokabide ohiturek
  eta bizimoduak biodibertsitatearengan, gure bizi kalitate eta ongizatearengan eragina
  dutela jabetzea.\\n- Salburuako hezeguneen eta oro har naturaren errespetua eta
  babesa sustatzea.\\n- Orokorki biodibertsitatearen eta bereziki Salburuaren balioaz
  eta garrantziaz kontzientziatu.\\n\\n6. PROGRAMAREN EGOKITZAPENA HLOra\\n\\n\u201cSalburua
  biodibertsoa da\u201d proiektu independente bat da, baina era berean, gaur egungo
  hezkuntza arautuarekin bat etorriz, hau da, Hezkuntzarako Lege Organikoarekin bat
  (Maiatzaren 3ko 2/2006 Hezkuntzarako LEGE ORGANIKOA), eta Eusko Autonomia Erkidegoaren
  irakurketarekin bat etorriz.\\n\\nCurriculumak zehazten dituen edukiekin bat dator,
  hezkuntza maila bakoitzari dagokiona eta oinarrizko gaitasunak betetzeko helburuarekin.\\n\\na)
  Arlo nagusia: Natur zientziak.\\nb) Gaia: \u201cSalburua biodibertsoa da\u201d\\nc)
  Kurtsoa: Derrigorrezko Bigarren Hezkuntzako 1. eta 2. kurtsoak\\nd) Proposamenaren
  testuingurua\\n\\nSalburuko hezegunea berriztatutu egin da, bere distira guztia
  berreskuratuz, ipar penintsulako gune heze garantzitsuena bihurtuz, Nazioarteko
  Garrantzizko Hezegune bezala katalogatua izanik eta Ramsar zerrenda barnean sartuz.\\n\\nHezeguneak
  ekosistema oso emankorrak eta bereziak dira, balio ekologiko handikoak eta biodibertsitate
  altukoak eta Salburua ez da salbuespena. Irla-hariztiak, lizardiak, sahastiak, larreak
  eta lezkadiak interes handiko ekosistemak dira, kontserbatu behar direnak, horregatik
  Salburua Natura 2000 sarearen barne sartu da. Animali eta landare espezie kopuru
  handia dauka, batzuk mehatxatuak, arraroak, urriak ingurunean edo nabarmenak hartzen
  duten hedaduragatik edo eremuan aurkitu daitzekin indibiduo kopuru handiagatik.\\n\\nSalburua
  naturarekin gozatzeko, sentitzeko, ezagutzeko, bizitzeko eta hunkitzeko leku aparta
  da, zaintzen, kontserbatzen eta babesten ikasiz. Azken finean, lehenbiziko mailako
  hezkuntza baliabide bat hiri ondoan kokatua.\\n\\ne) Oinarrizko gaitasunak\\n\\n1)
  Zientzia, teknologia eta osasun kulturarako gaitasuna\\n2) Ikasten ikasteko gaitasuna\\n3)
  Matematikarako gaitasuna\\n4) Hizkuntza komunikaziorako gaitasuna\\n5) Informazioa
  tratatzeko eta teknologia digitala erabiltzeko gaitasuna\\n6) Gizarterako eta herritartasunerako
  gaitasuna\\n7) Giza eta arte kulturarako gaitasuna\\n8) Norberaren autonomiarako
  eta ekimenerako gaitasuna\\n\\nSalburua biodibertsoa da\\n\\n- Jardueren araberakoa\\n\\n|
  ARLOA       | JARDUERA                                      | ID | 1 | 2 | 3 | 4
  | 5 | 6 | 7 | 8 |\\n|-------------|-----------------------------------------------|----|---|---|---|---|---|---|---|---|\\n|
  AURRETIK    | Gonbidapena                                  | A1 |   |   |   |   |   |   |   |   |\\n|             |
  Salburua ezaguten duzu?                      | A2 |   |   |   |   |   |   |   |   |\\n|             |
  Bisoiak Salburuan                            | A3 |   |   |   |   |   |   |   |   |\\n|
