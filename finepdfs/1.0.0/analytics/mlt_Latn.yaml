  Kien ir\u010bieva email u anke kienu qalulu xi nies o\u0127ra li Nikki Dimech kien
  se jimbarazzah.\\n\\nIx-xhud sostna li huwa ma be\u017cax mill-imputat Raymond Cachia.
  Huwa kien qed jib\u017ca minn Nikki Dimech. Raymond Cachia kull ma g\u0127amel kien
  sempli\u010biment li kkomunikalu dak li kien di\u0121a sema ming\u0127and terzi
  li kien se ji\u0121rilu jekk jid\u0127ol g\u0127al laqg\u0127a. Raymond Cachia ma
  kien qallu xejn \u0121did, \u0127lief dak li kien di\u0121a sema''\\n\\nming\u0127and
  terzi. Dakinhar li kien kellmu Raymond Cachia, l-istess Raymond Cachia ma kienx
  kellmu b''rabja. Kienu tkellmu kif jitkellmu \u017cew\u0121t i\u0127bieb.\\n\\n17.
  Joseph Saliba in rappre\u017centanza ta'' Jobs Plus ippre\u017centa l-full employment
