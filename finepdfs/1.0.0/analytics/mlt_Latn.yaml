  huwiex possibbli li jipprovdi minibus bil-bieba li tinfeta\u0127 mix-xufier. Irri\u017culta
  li attwalment dan m''g\u0127andux, i\u017cda qed filpro\u010bess li jixtri \u017cew\u0121
  vetturi mg\u0127ammra b''bieba li tista'' ti\u0121i attivata mix-xufier.\\n2.3.3.
  Il-Kunsill innota t-tag\u0127rif mog\u0127ti.\\n\\n2.4.1. Xifer perikolu\u017c f''Tal-Prajjet
  (T/3/2/Vol XV)\\n\\n2.4.2. Il-Kunsillier J. Attard irrefera g\u0127all-minuta 1.3.
  tas-seduta ta'' qabel staqsa dwar jekk twa\u0127\u0127lux it-tabelli ta'' twissija
  qrib ix-xifer.\\n2.4.3. Is-Segretarju wie\u0121eb li m''g\u0127andux informazzjoni
  li dawn twa\u0127\u0127lu.\\n2.4.4. Is-Sindku qal li l-Bord tal-Park tal-Majjistral
  ser jie\u0127u \u0127sieb iwa\u0127\u0127alhom, peress li l-post jinsab fil-konfini
  tal-Park.\\n\\n2.5.1. European Maritime Day\\n\\n(T/4/6/Vol V)\\n\\n2.5.2. Il-Kunsillier
  J. Attard irrefera g\u0127all-minuta 5.6.1. tas-seduta ta'' qabel u staqsa dwar
