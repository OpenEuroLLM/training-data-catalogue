  4.3 metri biss. G\u0127aldaqstant, intalab li jsiru tabelli jew sinjali li jipprojbixxu
  l-ipparkar fit-trejqa in kwistjoni, kif ukoll li jsiru parking bays fit-toroq tal-qrib.\\n4.4.2.
  Il-Kunsill approva t-talba u qabel li g\u0127andha ssir talba lill-Transport Malta
  sabiex ji\u0121i pprojbit l-ipparkjar fit-trejqa in kwistjoni.\\n\\n4.5.1. Konkors
