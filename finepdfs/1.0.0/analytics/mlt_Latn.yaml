  li GreenPak ser tie\u0127u l-ini\u017cjattiva biex tqassam l-iskedi tal\u0121bir
  bil-lingwa Taljana u b''dik Serba. Is-Sindku kkummenta li dan isir kemm-il darba
  l-Kunsill jipprovdilu t-traduzzjoni.\\n\\n5.2.1. Rikostruzzjoni ta'' Triq il-Marfa
  (T/5/3)(T/4/7/Vol III)\\n\\n5.2.2. Is-Sur J.Buttigieg irrefera g\u0127all-kuntatti
  li kien hemm bejn il-Kunsill, Infrastructure Malta, Transport Malta, u Malta Public
  Transport, liema kuntatti kienu nvoluti flimkien mieg\u0127u, ilKunsillier E. Bartolo
  u s-Segretarju E\u017cekuttiv C. Debono. Mil-laqg\u0127at li kien hemm sar mag\u0127ruf
  li Infrastructure Malta se tkun qed twettaq xog\u0127ol infrastrutturali fi Triq
  il-Marfa, minn Triq Adenau (Maritim Hotel) sar-roundabout ta'' Dawret il-Mellie\u0127a
  (Seabank Hotel). Huwa ppjanat li x-xog\u0127ol jibda fil-25 ta'' Marzu 2019.\\n5.2.3.
  \u0120ie spjegat li min\u0127abba dawn ix-xog\u0127lijiet, Triq il-Marfa se tkun
  mag\u0127luqa g\u0127at-traffiku mill1 ta'' April ''il quddiem u g\u0127aldaqstant
  il-Kunsill intalab jipprovdi servizz ta'' minibus shuttle minn Triq Adenau sar-roundabout
  ta'' Selmun u lura. Ir-residenti fi\u017c-\u017cona tal-G\u0127adira g\u0127andhom
  jag\u0127mlu u\u017cu mill-bus stops li hemm qrib is-Seabank Hotel. Huwa mportanti
  li min ikun sejjer fid-direzzjoni tal-G\u0127adira, Ta'' Gerbulin, u \u010b-\u010airkewwa
  jag\u0127mel u\u017cu minn Triq Lewis Wettinger u Dawret il-Mellie\u0127a. Is-servizz
  tal-karozzi tal-linja ser ikun qed jg\u0127addi minn dawn it-toroq ukoll, i\u017cda
  hekk kif jasal mar-roundabout Ta'' Pennellu, ser jid\u0127ol fi Triq Qasam Barrani
  u jdur lura mar-roundabout tad-Dar tal-Anzjani. Aktar ''il quddiem jing\u0127ataw
  dettalji dwar arran\u0121amenti tat-traffiku o\u0127ra skont kif jitolbu x-xog\u0127lijiet.\\n\\n5.2.4.
  Min\u0127abba li ma ng\u0127atax \u017cmien bi\u017c\u017cejjed biex issir sej\u0127a
  g\u0127all-offerti dwar is-servizz shuttle, intalbu stimi ming\u0127and disa'' operaturi
  differenti sabiex ji\u0121i pprovdut servizz mill-5.00am sal10.00pm. Is-sej\u0127a
  saret fl-14 ta'' Marzu u tag\u0127laq fil-21 ta'' Marzu 2019.\\n5.2.5. Il-Kunsill
  approva l-azzjoni li ttie\u0127det u qabel li g\u0127andha ssir talba lill-Ministru
