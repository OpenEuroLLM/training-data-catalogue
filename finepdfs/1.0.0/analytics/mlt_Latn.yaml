  l-ewwel session, pero x-xhud tindika illi hi ma kienitx prezenti u ghalhekk ma tistax
  tistkellem fuq il-body language tal-minuri.\\n\\nIn kontro-ezami ix-xhud tikkonferma
  illi hija ghandha feedback fuq l-ewwel SAV biss peress illi l-kuntatt mal-attrici
  waqaf. Hija tikkonferma illi hija ma tafx kemm il-darba l-minuri attendiet ghall-SAVs
  u li l-feedback li hija hadet dwar l-ewwel SAV kien dak li rceviet minghand Adriana
  li hija s-social worker.\\n\\nElaine Pavia head of home Good Shepard Sisters, Dar
  Merhba Bik Foundation, xehdet nhar l-4 ta'' Frar 2021 (vide fol 205 et seq) u spjegat
  illi l-attrici flimkien mat-tlett (3) uliedha dahlu u uzaw is-servizz residenzjali
  taghhom f''Dar Merhba Bik hames (5) darbiet. Illi f''kull admission ir-referral
  giet mit-taqsima tal-Vjolenza Domestika. L-ewwel erba'' admissions ma kienux twal,
  pero'' fl-ahhar admission, l-attrici kienet damet ''l fuq minn sena fis-shelter.
  Tirrakkonta illi l-attrici ma tantx kienet tohorg barra mis-shelter minhabba l-biza
  li kellhom. Illi filfatt il-minuri HI kienet anke ghamlet home tuition gewwa s-shelter
  stess. Izzid illi lminuri kellha biza minn persuni tas-sess maskil, illi filfatt
  l-ewwel ghalliem li kien jigi ghallhome tuition kien ragel u ghamlet l-ewwel xahrejn
  ma tkelmux, u filfatt meta ntebhu b''dan, kienu talbu illi tintbaght ghalliema mara.
  Illi wara din il-bidla bdew jaraw progress minnufih.\\n\\nTixhed illi kien hemm
  diversi episodji, fosthom meta l-intimat hataf lit-tifla huma u diehlin lura s-shelter,
  illi minkejja li kienu awtorizzaw lill-missierha jigborhom millgaraxx tas-shelter,
  kif fethu l-garage l-intimat kien niezel mit-triq taghhom u waqqaf ilkarozza tieghu
  f'' nofs ta'' triq u prova jiftah il-bibien tal-karozza. L-istaff taghha gieli qalulha
  illi l-intimat kien waqqafhom u offrilhom il-flus jew anke lifts bil-karozzi u kienu
  infurmaw lill-Ghassa ta'' Birkirkara b''dan kollu.\\n\\nIlli minkejja li kien hemm
  Protection Order fil-konfront tal-attrici, l-intimat xorta wahda kien jibghatilha
  sensiela ta'' messaggi. Izzid illi kien hemm perjodu fejn kienu jircievu telefonati
  minn diversi ghasses fejn kienu jistaqsu ghal-SF. Illi saru jafu illi l-intimat
  kien qieghed jallega illi l-attrici kienet qieghda tkun f''postijiet differenti
  minghajr bintha, meta l-attrici kienet tkun qieghda flimkien mal-minuri s-shelter.\\n\\nRuth
  Cortis, psychotherapist, nhar l-4 ta'' Frar 2021 (vide fol 202 et seq) filwaqt illi
  esebiet ir-rapport taghha, ikkonfermat illi hija ghadha ssegwi lill-attrici u li
  s-sezzjonijiet huma regolari.\\n\\nSylvana Calleja xehdet nhar il- 25 ta'' Marzu
  2021 a(vide fol 49 et seq 2 ) u spjegat illi hi kienet isegwi lill-attrici u l-ewwel
  appuntament li hija kellha maghha kien fis-27 ta'' April 2018 wara li l-attrici
  kienet ghamlet kuntatt mal-Agenzija Appogg ghall-ghajnuna. L-attrici kienet spjegatilha
  illi hi kienet f''relazzjoni mal-intimat u li flimkien kellhom tifla, filwaqt li
  hi kellha zewgt itfal ohra miz-zwieg precedenti. Spjegatilha illi hi kienet qieghda
  thossha kontrollata f''din ir-relazzjoni, fejn hu kien isus il-hin kollu warajha,
  jara fejn tkun qieghda, u kien jikkontrolla fejn kienet tmur. Izzid illi hu kien
  jakkuzaha li kienet ghadha f''relazzjoni mal-ex ragel taghha u minhabba dawn l-argumenti,
  l-intimat kien ikun fizikament u emozjonalment aggressiv lejha. Ix-xhud tixhed illi
  waqt din il-laqgha, l-intimat kien filfatt cempel lill-attrici u x-xhud kienet semghat
  il-konverzazzjoni peress illi l-attrici kienet ghamlitu fuq speaker mode. Hu beda
  jistaqsiha fejn qieghda. Wara ftit minuti rega'' cempilha u hu kien qieghed jghajjat
  u juza kliem dispreggattiv lejha fosthom \\\"qahba\\\" u jistaqsiha fejn qieghda
  ghaliex wara li lattrici kienet qaltlu li qieghda meeting l-iskola tal-minuri, l-intimat
  mar ifitixxha hemmhekk u ma sabhiex. Tishaq illi sakemm damu jitkellmu, baqa'' jcempilha
  il-hin kollu. Illi waqt dan l-appuntament l-attrici bdiet tibza li s-sitwazzjoni
  ser teskala u minn hemm filfatt kienet\\n\\n2 Atti 248/2019/2 JPG\\n\\nbaqghet sejra
  s-shelter. Meta waslet is-shelter ghamlet l-arrangamenti sabiex it-tfal imorru ukoll
  fis-shelter maghha. Ix-xhud tikkonferma illi bejn is-27 ta'' April u Lulju tas-sena
  2018, l-attrici dahlet hames darbiet gos-shelter. Illi fit- 8 ta''Novemberu kien
  hemm disclosure da parti ta'' FV l-iskola, illi l-intimat kien ghamel xi avvanzi
  sesswali fuqha, fejn l-iskola informat lic-Child Protection u kienu gew infurmati
  ukoll il-Vice Squad. Tirrakonta episodju ukoll fejn waqt hand over tal-minuri, l-attrici
  kienet qaltilha illi l-intimat beda jipprova johdilha l-mobile u kien hemmhekk li
  qalilha illi mhux ser jirritorna lil HIlura, u kellha tigi involuta l-Pulizija.\\n\\nIs-sitwazzjoni
  dejjem baqghet l-istess, bl-attrici diehla u hierga fis-shelter ghaliex ma kienitx
  thossha sigura f''darha stess. Kien gie rappurtat lilha minn kollegi ohra fis-shelter
  illi ta'' sikwiet kienu jaraw lill-intimat fil-vicinanzi tas-shelter u kien icempel
  lill-attrici kontinwament, kien jibghatilha affarijiet bhal xirjiet, fjuri etc.
  Illi fit-13 ta'' Gunju 2019, l-intimat seraq lillminuri. Illi dan gara hekk kif
  l-attrici flimkien mal-minuri kienu rritornaw lura s-shelter. Huma kienu raw lill-intimat
  riesaq lejhom, dan hataf lill-minuri u baqa'' sejjer biha. L-intimat kien zammha
  24 siegha u kull ftit sieghat kien imur wara l-bieb tas-shelter juri lit-tifla fuq
  ilcamera u jerga'' jitlaq. Illi l-Pulizija kellha ovjament terga'' tigi involuta.
  Illi kien hemm episodju iehor fejn l-intimat prova jiftah il-bibien tal-karozza
  tal-attrici, u anke prova jidhol mill-but tal-karozza. Illi wara dan l-episodju
  l-attrici kienet prattikament issakkret fixshelter. Illi fiflatt ghal hafna gimghat
  ma kienitx harget xejn hlief ghal xi qadi essenzjali. Illi sussegwentement kien
  inhareg Protection Order u l-access kien twaqqaf pero'' minkejja dan it-telefonati
  baqghu ghaddejjin lejl u nhar, jibghatilha messaggi u voice messages, li kienu minn
  mobile numbers differenti.\\n\\nIx-xhud tishaq illi l-intimat kien anke isegwi lill-ex-ragel
  tal-attrici u kien anke jibghatilha li l-ex ragel taghha qieghed f''certu post ma''
  certu persuni, u li kellu ossessjoni kbira li lattrici regghet lura mal-ex ragel
  taghha. Kienet giet infurmata ukoll illi l-intimat kien qieghed jaghmel rapport
  mal-Pulizija illi l-attrici kienet qieghda thalli lill-minuri isshelter waqt li
  hija kienet tmur tipprostitwixxi ruhha l-Gzira. Kien anke sar rapport fuq l-istess
  bazi mac-Child Protection. Illi kien hemm episodju iehor fejn l-ex ragel tal-attrici
  flimkien ma'' uliedu kienu qieghdin weekend break u kien mar warajhom l-intimat,
  fejn kien hedded illi ser joqtol lill-attrici u jahrab mill-pajjiz. Illi wara dan
  l-episodju, l-intimat kien gie arrestat u f''Novembru tas-sena 2019 kien inghata
  l-bail. It-telefonati kienu waqfu hesrem hekk kif kien arrestat. Meta inheles bil-bail,
  l-attrici kienet infurmata illi kien ghadu m''ghamilx kuntatt maghha, illi pero
  l-ewwel darba illi l-attrici kienet attendiet ghall-Qorti wahida minghajr skorta,
  l-intimat avvicinaha u kien qalilha li kien ghadu jhobbha. Illi x-xhud tikkonferma
  illi hija ma baqatx inkarigata bil-kaz minn Lulju tas-sena 2020.\\n\\nVincent Farrugia,
  missier l-attrici, xehed permezz ta'' affidavit (vide fol 54 et seq.) Huwa jispjega
  illi huwa iltaqgha mal-intimat l-ewwel darba fis-sena 2018, meta l-attrici kienet
  haditu maghha d-dar tieghu. Bintu qatt ma qaltlu x''kien jigri u ghalkemm kien jaf
  li kien hemm hafna drabi fejn dahlet fis-shelter, qatt ma qaltlu ghalfejn. Illi
  filfatt kien l-ex ragel tal-attrici illi kien qallu li l-attrici dahlet fis-shelter
  f'' Gunju tas-sena 2019.\\n\\nJirrakonta illi l-attrici sussegwentement kienet qaltlu
  illi l-intimat kien qieghed jiffissa illi hi u l-ex ragel taghha kienu ghadhom flimkien.
  Illi darba minnhom kien mar ma'' wahda minn neputijiet id-dar sabiex tigbor xi kotba,
  u kienu sabu il-kmamar imsakkrin. Illi wara dakinhar, l-intimat beda jcempillu fuq
  il-mobile kontinwament, u kien jircievi madwar 14 iltelefonata kuljum izda hu qatt
  ma irrispondieh. Illi kien ukoll jibghatlu hafna messaggi fuq l-attrici, u li bintu
  hija \\\"qahba\\\" u li qieghda tmur ma'' hafna irgiel. Illi darba minnhom kif appenna
  wassal lill-attrici u t-tfal lura s-shelter, waqfet karozza ezatt ma'' tieghu, u
  nizel lintimat minn go fiha. L-intimat mar jigri fuq HI u hatafha. Sadanitant ix-xhud
  kien induna li kien hallha c-cwievet fil-karozza, u kien ha c-cwievet biex l-intimat
  ma jkunx jista'' jitlaq bit-tifla, meta ra dan, l-intimat pero'' tefa lit-tifla
  fuq spaltu u telaq jigri biha lejn San Anton. Ix-xhud jispjega illi hu ma kellux
  sahha jigri warajh ghaliex ibati minn kundizzjoni tan-nifs.\\n\\nIx-xhud jirrakonta
  illi kien hemm episodju iehor fejn wara li mar jigbor lin-neputijiet minghand l-ex
  ragel tal-attrici, kien sab lill-intimat bil-karozza u minkejja li qallu li ma jridx
  ikellmu lintimat baqa'' jsuq warajh. Illi minn hemm baqa'' sejjer l-Ghassa ta''
  Hal Qormi izda kif l-intimat rah jieqaf l-ghassa telaq l''hemm. Illi kien hemm okkazzjoni
  ohra fejn sab lill-intimat warajh meta mar jigbor lill-attrici mis-shelter. Illi
  dakinhar mar ghamel rapport fl-ewwel ghassa li sab u cioe dik ta''Hal Balzan, izda
  ma kienx sab fejn jipparkja minhabba l-festa u kellu jibqa'' sejjer. Illi l-intimat
  baqa'' jsuq warajh sakemm wasal ghand l-ex ragel tal-attrici Hal Qormi. X''hin gabar
  lit-tfal rega lemhu jsuq warajh. Illi kif appena ipparkja jilmah lill-intimat gej
  bil-pass u gie jixtarr minn kien hemm mieghu fil-karozza. Wara li ghamel dan l-intimat
  telaq jigri sa fejn is-shelter fejn kellu l-karozza, u baqa'' tiela u niezel minn
  hdejn is-shelter sa fejn ix-xhud kellu l-karozza ipparkjata. Illi t-tfal kienu mwerwrin.
  Illi dawn l-episodji kienu frekwenti\\n\\n11\\n\\nhafna. Illi l-ex ragel ta'' bintu,
  CV, kien qallu ukoll illi l-intimat kien qieghed jaqbad mieghu u li kien qieghed
  isegwih bil-karozza. Illi CV kien anke qallu li kien qieghed jaghmel irrapporti
  l-ghassa dwar dan. CV kien anke cempillu wara dak li kien gara waqt il-weekend break.
  Sostna illi l-minuri HI ma trid tmur imkien minghajr ommha, u baqghet imbezza milli
  tohrog mis-shelter. Illi filfatt huwa jwassallhom ghall-access ghaliex ghadha tibza''
  tmur wahidha.\\n\\nLouis Buhagiar, Senior Executive fi hdan Jobs Plus, xehed nhar
  it-8 ta'' Ottubru 2021 u prezenta l-Employment history tal-attrici u dik tal-intimat.\\n\\nSaviour
  Theuma, xehed nhar it- 8 ta'' Ottubru 2021 u presenta dokumentazzjoni relattiva
  ghall-beneficcji socjali percepiti mill-partijiet.\\n\\nDr Naomi Bartolo, in rapprezentanza
  tal-Housing Authority, xehdet nhar it- 8 ta'' Ottubru 2021 u spjegat illi fir-rigward
  tal-attrici instabu erba'' (4) files, tnejn minnhom jirrigwardaw postijiet differenti
  minn dak indikat fuq l-ingunzjoni, u cioe il-fond f'' Hal Qormi. Ix-xhud tikkonferma
  illi l-post f'' Hal Qormi huwa l-post fuq liema l-attrici qieghda tircievi sussidju.
  Izzid illi kien hemm zewg postijiet ohra fejn qabel kienet tiehu sussidju fuqhom
  pero kienet harget minnhom u ghalhekk jinghalaq il-file. Fir-rigward il-post ta''
  Hal Qormi, l-attrici kienet l-ewwel tibbenefika minn skema maghrufa bhala PRS, Private
  Residential Subsidy Scheme, illi sussegwentement pero'' min kien qieghed taht dik
  l-iskema gie trasferit ghall-iskema HBS, Housing Benefit Scheme li hija skema iktar
  vantaggjuza u b''hekk infetah file iehor. Izzid illi lattrici ghandha ukoll social
  housing application u gie ffirmat anke pre-availability agreement fuq post ghal
  akkomodazzjoni socjali. Il-kuntratt finali ghadu ma sarx. Ix-xhud tikkonferma illi
  l-attrici qieghda tircievi s-somma ta'' EUR 374.38 kull xahar bhala sussidju.\\n\\nKaren
  Cremona, in rapprezentanza ta'' Transport Malta xehdet nhar il- 25 ta'' Ottubru
  2021 (vide fol 237 et seq) u spjegat illi l-attrici ghandha zewg vetturi registrati
  fuq isimha, u wahda minnhom hija skrepjata. Spjegat ukoll illi l-intimat kellu wiehed
  u ghoxrin (21) vettura rregistrata fuq ismu, b''dana illi whud minnhom huma skrapjati.\\n\\nJohanna
  Bartolo, in rapprezentanza tal- Bank of Valletta xehdet nhar il-25 ta'' Ottubru
  2021 (vide fol 241 et seq) u spjegat illi rrizulta savings account f''isem l-attrici,
  u rrizulta illi hemm erba loans f''isem l-intimat u hemm ukoll legal fees account
  f''ismu ukoll. Izzid illi l-bank kien ha proceduri legali fil-konfornt tal-intimat,
  fejn kien hemm subbasta li saret fis-7 ta''Settembru\\n\\n2021 u l-propjeta giet
  liberata favur il-Bank.\\n\\nCharmaine Psaila Ragi in rapprezentanza tal- APS Bank
  xehdet nhar il-25 ta'' Ottubru 2021 (vide fol 241 et seq) u spjegat illi rrizulta
  li hemm kont intestat f''isem l-attrici flimkien ma'' terzi.\\n\\nNeil Baldacchino
  in rapprezentanza BNF bank xehed nhar il-25 ta'' Ottubru 2021 (vide fol 241 et seq)
  a fol 246 u spjega illi ma nstabu l-ebda kontijiet f''isem l-attrici izda instabu
  zewg kontijiet, b''dana illi z-zewg kontijiet jinsabu f''debitu. Ix-xhud jikkonferma
  illi hemm ukoll garnishee order kontra l-intimat.\\n\\nLorraine Attard in rapprezentanza
  tal-HSBC Bank Malta plc xehdet nhar il-25 ta'' Ottubru 2021 (vide fol 249 et seq)
  u spjegat illi hemm current account f''isem l-intimat u savings account f''isem
  l-attrici.\\n\\nL-intimat xehed nhar it-28 ta'' Frar 2022 (vide fol 281 et seq)
  u spjega illi illi huwa iltaqgha mal-attrici peress illi kellu xi xoghol mar-ragel
  taghha, CV. Illi hu kien jixtri xi ghodda minghandu u kien fthiem mar-ragel tal-attrici
  illi flok ihallsu kellu jaghmillu xi xoghol fuq ittarag. Illi filfatt iltaqgha mal-attrici
  meta kien qieghed jahdem ghandhom. Illi sakemm kien qieghed jahdem, huma kienu jitkellmu,
  u hi kienet tghidlu li l-affarijiet ma'' zewgha ma kienux sew, u li kienu anke fittxew
  l-ghajnuna ta'' professjonisti. Izid illi l-attrici kienet tghidlu illi zewgha m''ghadux
  jigi d-dar u filfatt wara ftit hija harget tqila b''HI. Illi sussegwentement huwa
  nduna illi l-attrici u zewgha kienu ghadhom flimkien. Illi imbaghad zewgha kien
  keccieha middar u kienet talbet lill-intimat isibilha dar. Huwa jinsisti illi kienu
  infethu proceduri dwar ilpaternita ta'' HI, u li l-attrici u zewgha xorta wahda
  baqa'' ikollhom rapport sahansitra fid-dar fejn huwa kien sabilha l-Hamrun. Illi
  kien biss meta t-tifla kellha tliet snin meta kienu sabu fond f''Rahal Gdid li huwa
  mar jghix mal-attrici.\\n\\nL-intimat ukoll xehed nhar id- 9 ta Mejju 2022 (vide
  fol 296 et seq) u spjega illi wara li marru Rahal Gdid, kienu marru Hal Qormi fejn
  damu madwar sentejn, izda hu ma kienx jorqod hemmhekk, u kellhom argument fuq din
  il-kwistjoni. Huwa jishaq illi dak iz-zmien kien ghadu jcempilha r-ragel taghha
  u li kienu anke gieli iltaqghu. Izid illi sakemm kienu Rahal il-Gdid, kien anke
  sab lir-ragel tal-attrici ghandhom, u dakinhar l-intimat kien qabad u telaq. Jinsisti
  illi l-attrici kien qed ikollha relazzjoni ma'' zewgha u kif ukoll mieghu fl-istess
  hin. Jinsisti illi huwa baqa f''relazzjoni maghha minhabba it-tifla ghaliex kieku
  ma kienitx thallieh jaraha. Illi sakemm huma kienu Hal Qormi, huwa kien beda jorqod
  maghhom, ghaliex l-attrici kienet qaltlu li mhux ser tkellem iktar lil zewgha izda
  hu xorta wahda kien zamm il-post tieghu u gieli kien hemm drabi fejn ma kienx jorqod
  mal-attrici f''Hal Qormi. Jixhed illi ghalkemm hu qatt ma ra jew sab lir-ragel tal-attrici
  fil-post ta'' Hal Qormi,  wahda mill-girien kienet qaltlu li zewgha gieli mar ghandha
  bil-lejl wara li jitlaq hu.\\n\\nL-intimat xehed nhar is-27 ta'' Gunju 2022 (vide
  fol 300 et seq) u ikkonferma illi hu u l-attrici kienu ghamlu skrittura li kienet
  saret ghand l-avukat precedenti tieghu. Huwa jispjega illi hu kellu jara lit-tifla
  tliet darbiet fil-gimgha. Minkejja dan, l-attrici ma kienitx thallih jara lit-tifla
  u kien spicca ghamel hmistax (15) \u2013 il rapport mal-Pulizija. Jishaq illi sad-data
  ta'' din ittestimonjanza, kien ilu tliet xhur ma jara lit-tifla. Huwa jichad li
  qatt staqsa lit-tifla dwar ommha u li ormai ghandu relazzjoni ma hadd iehor.\\n\\nL-intimat
  nhar id- 9 ta'' Novembru 2022 xehed illi qieghed isir hafna hsara fil-konfront tieghu
  ghaliex l-attrici u zewgha kienu ftehmu, b''dana illi l-attrici kienet qalet fi
  proceduri l-Qorti illi l-minuri mhux bint l-intimat u li ma tafx min hu missierha
  u dan fuq suggeriment ta'' zewgha. Izid illi zewgha baqa'' jikkmandaha f'' kollox.
  Jirrileva illi l-attrici baqghet tiftiehem ma'' zewgha u kienu marru jkellmu xi
  ufficjali sabiex l-intimat jitkecca minn Malta. Huwa jsostni illi huwa jixtieq illi
  jibqa'' jara lit-tifla. Mistoqsi mill-Qorti kemm qieghed jivversa manteniment ghall-bintu,
  huwa jishaq illi qieghed jghaddi EUR 320 fix-xahar liema somma hija hafna ghalih
  ghaliex huwa ma jahdimx. Jikkonferma illi ilu xi sitt (6) xhur ma jghaddi manteniment.
  Isostni illi huwa qieghed jikri zewgt ikmamar f''Hal Balzan u l-familja tieghu qieghda
  tibghatlu xi affarijiet biex jghinuh.  Di piu'' ghandu tfajla li qieghda tghin finanzjarjament
  ukoll.\\n\\nL-attrici prezentat affidavit ulterjuri (vide fol 255 et seq) u spjegat
  illi l-intimat ghaddha manteniment ghall-minuri HI ghax-xhur ta'' Awwissu 2020 sa
  Novembru 2020 u ghax-xahar ta'' Jannar 2021 biss. Fil-15 ta'' Novembru 2021 huwa
  ghaddha hames mitt Ewro (Eur 500) quddiem il-Magsitrat L Lanfranco fejn dakinhar
  kien akkuzat li naqas milli jhallas manteniment ghal diversi xhur u dan skont l-iskrittura
  privata li giet kkonfermata b''digriet talQorti li inghata sussegwentement. Illi
  l-arretrati ta'' manteniment jammontaw ghal sitt elef u erba'' mitt Ewro (EUR 6,400)
  sas 7 ta'' Dicembru 2021. Hija tishaq illi qieghda tinkorri diversi spejjes u qieghda
  thallas kirja ta'' sitt mija u hamsin ewro (EUR 650) fix-xahar piu hamsa u erbghin
  Ewro (EUR 45) ghall-kontijiet tad-dawl u l-ilma. Izzid illi hija qieghda tircievi
  ssomma ta'' tlett mija u sebghin ewro (EUR 370) fix-xahar bhala sussidju tal-kera
  minghand lAwtorita'' tad-Djar. Tirrileva illi hija dejjem hadet hsieb dak kollu
  li jirigwarda t-tifla u tixtieq li tibghata xi attivita extra-kurrikulari imma m\u2019ghandhiex
  bizzejjed flus sabiex taghmel dan.\\n\\nIkkonsidrat:\\n\\nIlli din hija sentenza
  wara proceduri intavolati mill-attrici omm fejn qieghda titlob illi tigi fdata bil-kura
  u kustodja esklussiva tal-minuri HI.\\n\\nKura u l-kustodja tal-ulied\\n\\nIlli
  huwa ritenut fil-gurisprudenza taghna li f''sitwazzjonijiet bhal dawn ghandu jipprevali
  fuq kollox\\n\\nl-aqwa interess tal-minuri.\\n\\n3\\n\\nFis-sentenza fl-ismijiet
  Maria Dolores sive Doris\\n\\nScicluna vs Anthony Scicluna deciza mill-Prim\u2019Awla
  tal-Qorti Civili fis-27 ta\u2019 Novembru\\n\\n2003 intqal illi:\\n\\n\\\"\\n\\napparti
  l-\u0127sieb ta'' ordni morali u dak ta'' ordni legali, li g\u0127andhom setg\u0127a
  fil- materja ta\u2019 kura u kustodja tat-tfal in \u0121enerali, il-prin\u010bipju
  dominanti \u2018in subjecta\\n\\nmateria'', li jiddetermina normalment u \u0121eneralment
  il-kwistjonijiet b\u0127al din insorta f\u2019dina l-kaw\u017ca, huwa dak tal-aktar
  utilita\u2019 u dak tal-aqwa vanta\u0121\u0121 u\\n\\nnteress tal-istess minuri
  fl- isfond ta\u010b-\u010birkostanzi personali u ''de facto'' li jkunu jirri\u017cultaw
  mill-provi tal-ka\u017c li jrid ji\u0121i ri\u017colut...\u201d\\n\\nIlli l-Qorti
  ghaldaqstant ghandha s-setgha illi jekk ikun fl-ahjar interess tal-minuri, tafda
  wiehed biss mill-genituri bil-kura u l-kustodja tal-minuri u dana ai termini tal-Artiklu
  56 tal-\\n\\n4\\n\\nKodici Civili.\\n\\nIlli kif kellha l-okkazjoni ttenni din il-Qorti
  diversi drabi, l-interess tal-minuri huwa iprem mid-drittijiet tal-genituri. Illi
  fid-decisjoni ta\u2019 din il-Qorti diversament preseduta\\n\\nfis-sentenza fl-ismijiet:
  Frances Farrugia vs. Duncan Caruana, de\u010bi\u017ca fil-31 ta'' Mejju 2017:\\n\\n5\\n\\nIl-Qorti
  tirrileva illi filwaqt li dejjem taghti piz ghad-dritijiet tal-genituri, l- interess
  supreme li zzomm quddiemha huwa dejjem dak tal-minuri kif anke\\n\\nmghallma mill-gurisprudenza  kostanti
  taghna hawn ''il fuq iccitata.\\n\\n3\\n\\nEnfazi tal-Qorti.\\n\\n4 Kap 16 tal-Ligijiet
  ta'' Malta.\\n\\n5 Vide Rikors \u0120uramentat 268/11AL.\\n\\n15\\n\\nIn tema legali
  ssir referenza ghall-kawza fl-ismijiet: Cedric Caruana vs Nicolette Mifsud 6 fejn
  il-Qorti enfasizzat li fejn jidhlu l-minuri:\\n\\n''huwa ta'' applikazzjoni assoluta
  l-Artiklu 149 tal-Kap 16 li jaghti poter lill-Qorti taghti kwalsiasi ordni fl-interess
  suprem tal-minuri. Fil-fehma tal-Qorti, lArtiklu 149 tal-Kap 16  jaghmilha cara
  illi fejn jikkoncerna l-interess suprem talminuri, idejn il-Qorti m''hiex imxekla
  b''regoli stretti ta'' procedura\u2026 fejn jidhlu d-drittijiet u l-interess suprem
  tal-minuri il-Qrati  taghna ghandhom diskrezzjoni wiesgha hafna\u2026. Addirittura
  l-Qorti tal-Familja ghandha s-setgha li tiehu kull provvediment fl-ahjar interess
  tal-minuri.'' 7\\n\\nFi kliem il-Qorti tal-Appell fis-sentenza fl-ismijiet: L Darmanin
  vs Annalise Cassar: 8\\n\\n\\\"\u2026\u2026.meta tigi biex tiddeciedi dwar kura
  u kustodja ta'' minuru, il-Qorti ma ghandhiex tkun iddettata u kondizzjonata mil-meriti
  u dimeriti tal-partijiet ''ut sic'' izda biss x''inhu l-ahhjar interess tal-minuri\\\".
  9\\n\\nDin il-Qorti taghmel referenza ghall-pronunzjament tal-Qorti tal-Appell (Sede
  Superjuri) fiddecizjoni tag\u0127ha tal-25 ta'' Novembru 1998 fl-ismijiet: Sylvia
  Melfi vs. Philip Vassallo irriteniet li:\\n\\nIn this case the Court must seek to
  do what is in the sole interest of the minor child in its decision whether the care
  and custody of the child should be given to one parent or the other the Court must
  solely be guided by what is most beneficial to the child [...] The Court should
  at all times seek the best interests of the child irrespective of the allegation,
  true or false, made against each other by the parties. Such allegations often serve
  to distance oneself from the truth and serve to render almost impossible the search
  of the Court for the truth. This is why it is the duty of the court to always look
  for the interests of the child. Exaggerated controversies between the parties often
  make one wonder how much the parents have at heart the interest of their children.
  Sometimes parents are only interested\\n\\n6 Deciza mill-Qorti tal-Appell nhar l-
  4/3/2014.\\n\\n7 Vide A sive BC vs D sive EC deciza 30/6/2015 u Joseph Micallef
  vs Lesya Micallef deciza 14/12/2018.\\n\\n8 Deciza mill-Qorti talAppell fil-31 ta''
  Ottubru 2014.\\n\\n9 Enfazi tal-Qorti.\\n\\nat getting at each other and all they
  want is to pay back the other party through their minor child.\\n\\nIlli gie ritenut
  ukoll illi meta si tratta\\n\\nta'' drittijiet tal-minuri vis-\u00e0-vis d-drittijiet
  tal-genituri l-\\n\\nQorti hija fid-dover li tqis dejjem dak li hu fl-ahjar interess
  tal-minuri u dan peress li fil-maggor parti tal-kazijiet li jitressqu ghad-decizjonijiet
  tal-Qorti tal-Familja, kull decizjoni\\n\\nimmankabilment thalli effett duratur
  fuq il-hajja tal-minuri u fuq il-hajja ta'' dawk ta'' madwar il-minuri.\\n\\nIlli
  din il-Qorti taghmel taghha b''mod partikolari l-insenjament tal-Qorti tal-Appell
  fil-kawza fl-ismijiet:\\n\\nMiriam Cauchi vs Francis Cauchi deciza fit-3 ta\u2019
  Ottubru 2008 fejn gie\\n\\nkorrettement osservat illi:\\n\\n\\\"Din il-Qorti tibda
  biex taghmilha cara li, fejn jidhlu minuri, m''hemmx dritt ghall-access, izda obbligu
  tal-genituri li t-tnejn jikkontribwixxu ghall-izvilupp\\n\\ntal-minuri li, ghal
  dan il-ghan, jehtigilha jkollha kuntatt ma'' ommha u anke ma''\\n\\nmissierha. Kwindi
  lil min jigi fdat bil-kura tal-minuri u kif jigi provdut l-access jiddependi mill-htigijiet
  tat-tifla u mhux mill-interess tal-genituri.\\n\\n10\\n\\nHuma l- genituri li jridu
  jakkomodaw lit-tfal, u mhux viceversa. L-importanti hu l-\\n\\nistabilita'' emozzjonali
  tat-tifla, u li din jkollha kuntatt mal-genituri taghha bl- anqas disturb possibbli.\u201d\\n\\nManteniment
  ghall-ulied\\n\\nIl-principju legali tal-manteniment tal-ulied huwa msejjes fuq
  l-artikolu 7(1) tal-Kodi\u010bi \u010aivili li jipprovdi:\\n\\n\\\"Il-genituri ghandhom
  l-obbligu li jiehdu hsieb, imantnu, jg\u0127allmu u jedukaw lil uliedhom bil-mod
  stabbilit fl-artikolu 3B ta\u2019 dan il-Kodici.\u201d\\n\\nKif jirrizulta mid-dispozizzjonijiet
  tal-Ligi, il-genituri ghandhom l-istess obbligu versu l-ulied\\n\\n10\\n\\nEnfazi
  tal-Qorti.\\n\\n17\\n\\ntag\u0127hom, u b''hekk iz-zewg genituri ghandhom jikkontribwixxu
  ghat-trobbija tal-ulied. Lobbligu taz-zewg genituri lejn l-ulied huwa kull wiehed
  skond il-mezzi tieghu, ikkalkulati skont il-b\u017connijiet tal-artikolu 20 tal-Kodici
  Civili.\\n\\nL-artikolu 20 tal-Kodi\u010bi \u010aivili jipprovdi illi:\\n\\n(1)
  Il-manteniment g\u0127andu jing\u0127ata skont il-b\u017conn ta'' min jitolbu u
  l-me\u017c\u017ci ta'' min g\u0127andu jag\u0127tih.\\n(2) Fl-ist\u0127arri\u0121a
  sabiex jinsab jekk min jitlob il-manteniment jistax jaqalg\u0127u xort'' o\u0127ra,
  g\u0127andu jittie\u0127ed qies ukoll tal-\u0127ila tieg\u0127u fl- e\u017cer\u010bizzju
  ta'' xi professjoni, arti jew seng\u0127a.\\n(3) Meta jitqiesu l-me\u017c\u017ci
  ta'' min hu obbligat g\u0127all-manteniment, g\u0127andu jing\u0127ad biss il-qlieg\u0127
  tieg\u0127u mix-xog\u0127ol tal-professjoni, arti jew seng\u0127a, is-salarju jew
  ilpensjoni tieg\u0127u mog\u0127tija mill-Gvern jew minn \u0127addiehor, u tal-utli
  tal-beni, sew mobbli u kemm immobbli u kull d\u0127ul li jin\u0127oloq ta\u0127t
  trust.\\n(4) Ma jitqiesx li g\u0127andu me\u017c\u017ci bi\u017c\u017cejjed biex
  jag\u0127ti l-manteniment min ma jistax jag\u0127tih \u0127lief billi jilqa'' f''daru
  l-persuna li titlob dak il- manteniment, jekk din ilpersuna ma tkunx axxendent jew
  dixxendent.\\n(5) Meta jitqiesu l-me\u017c\u017ci ta'' min jitlob il-manteniment,
  g\u0127andu jittie\u0127ed qies ukoll ta'' kemm jiswew il-beni tieghu mobbli jew
  immobbli kif ukoll ta'' kull interess beneficcju taht trust.\\n\\nKif ritenut fil-gurisprudenza:\\n\\n...........Il-Qorti
  dejjem irriteniet illi l-\u0121enituri ma jistg\u0127ux jabdikaw mirresponsabilita`
  tag\u0127hom li jmantnu lil uliedhom materjalment, hu kemm hu lintrojtu tag\u0127hom.
  Dejjem kienet tal-fehma illi kull \u0121enitur g\u0127andu l-obbligu li jmantni
  lil uliedu anke jekk il-me\u017c\u017ci tieg\u0127u huma baxxi jew jinsab di\u017cokkupat.
  IlQorti ma tista qatt ta\u010b\u010betta li persuna \u0121\u0121ib it-tfal fid-dinja
  u titlaq kull responsabbilta` tag\u0127hom fuq il-\u0121enitur l-iehor jew inkella
  fuq l-istat.\\\" (Ara Tiziana\\n\\n18\\n\\nCaruana vs Redent Muscat (272/2018) de\u010bi\u017ca
  mill-Prim'' Awla Qorti\\n\\n\u010aivili fl-24 ta'' \u0120unju 2019; Liza Spiteri
  vs Luke Farrugia (219/2018) de\u010bi\u017ca mill-\\n\\nPrim'' Awla Qorti \u010aivili
  fit-2 ta'' Ottubru 2019).\\n\\nFil-ka\u017c Portelli Jennifer pro et noe vs Portelli
  John (Rik. Nru. 2668/1996) deciz mill-Prim'' Awla Qorti \u010aivili fit-2 ta'' Ottubru
  2003, inghad hekk:\\n\\n\\\".......l-obbligu ta\u017c-\u017cewg \u0121enituri lejn
  l-ulied jibqa'' ba\u017cikament l-istess dettat kull wie\u0127ed skont il-me\u017czi
  tieg\u0127u, ikkalkulati skont id- dispozizzjonijiet tal-Artikolu 20 tal-istess
  Kap u l-b\u017connijiet tal-minuri, u fl-interess tal-istess minuri.\\\"\\n\\nRelevanti
  wkoll huwa dak li ing\u0127ad fis-sentenza fl-ismijiet Marina Galea vs Mario Galea
  de\u010bi\u017ca mill-Qorti tal-Appell fil-31 ta'' Jannar 2019:\\n\\n\\\"Il-manteniment
  tat-tfal, fil-verita` izjed milli dritt tal-\u0121enitur li qed irabbihom, huwa
  dritt tat-tfal minuri li ma jisfawx m\u010ba\u0127\u0127din minn dawk l-affarijiet
  li d- dinja tal-lum tikkunsidra b\u0127ala ne\u010bessita` g\u0127all-edukazzjoni
  u g\u0127all-i\u017cvilupp tag\u0127hom.\\\"\\n\\nIkkonsidrat:\\n\\nJirrizulta illi
  l-minuri HI twieldet f''X u llum ghandha circa X snin. Illi mill-verbal tal-udjenza
  tas- 26 ta'' Jannar 2023, jirrizulta illi minn informazzjoni li giet mghoddija lil
  din il-Qorti, lintimat x''aktarx kien mahrub mill-pajjiz. Illi minhabba dawn ic-cirkostanzi,
  l-avukat difensur tal-attrici kienet prekluza milli taghmel il-kontro-ezami tal-intimat.
  Illi fid-dawl ta'' dawn iccirkostanzi, din il-Qorti iddikjarat l-provi tal-intimat
  maghluqa u akkordat l-fakolta'' lillpartijiet li jipprezentaw nota ta'' sottomissjonijiet.
  Illi l-intimat baqa inadempjenti.\\n\\nDin il-Qorti kellha l-opportunita li tisma
  x-xhieda viva voce ta'' diversi haddiema socjali li kienu involuti fil-kaz tal-attrici
  u uliedha. Illi din il-Qorti tosserva illi x-xhieda ta'' dawn lprofessjonisti, fosthom
  Elaine Pavia, Sylvana Calleja ikkoraboraw dak kollu li xehdet l-attrici, inkluz
  dak li kien gara fid-diversi episodji indikati mill-attrici fl-affidavit taghha,
  b''mod partikolari meta l-intimat hataf lill-minuri HI minn quddiem il-bieb tas-Shelter,
  l-episodju ta'' meta fegg l-intimat hekk kif l-attrici, il-minuri u missierha hargu
  bil-karozza mill-garage tas-\\n\\n19\\n\\nShelter. Illi x-xhieda ta'' dawn il-professjonisti
  jikkorabora sal-anqas dettall, il-martirju shih li minnu ghaddew l-attrici u uliedha
  minuri. Illi l-fedina penali tal-intimat esebita in atti ukoll tikkorabora dak li
  xehdet l-attrici u cioe li l-intimat kien ghamel zmien isuq minghajr licenzja tas-sewqa
  u b''mod perikoluz. Illi r-rapporti ezebiti ukoll jaghtu konferma tal-episodji indikati
  mill-attrici fl-affidavit taghha. Infatti fl-atti procedurali hemm sensiela ta''
  rapporti ta'' stalking daparti tal-intimat fuq l-attrici u l-familjari taghha, ir-rapporti
  foloz maghmulha mill-intimat dwar il-cosidetto prostituzzjoni tal-attrici fil-Gzira
  u l-allegat negligenza tal-attrici mat-tifla taghha meta l-attrici kienet fizikament
  fis-shelter ma bintha, u dan apparti it-telefonati kontinwi lejl u nhar u t-theddid
  regolari daparti tal-intimat li ser joqtolha u li ser ihanxrilha ghonqha. Apparti
  minn dana kollu, hemm l-ombra tal-allegazzjoni tal-molestja sesswali daparti tal-intimat
  fuq it-tifla tal-attrici FVli l-istess tifla rrapportat mad-dirigenti tal-iskola
  li rrappurtaw minnufih lil Vice Squad. FV filfatt kienet tat rakkont ta'' dak li
  gara lis-social worker fi hdan il-Vice Squad. Dan l-agir wassal sabiex l-attrici
  tidhol f''shelter hames darbiet u wassal sabiex il-Qorti, diversament preseduta,
  tordna l-hrug ta'' Protection Order 11 fit-18 ta'' Lulju 2019 bi protezzjoni tal-attrici
  u tlett ulieda, missierha u l-membri tal-familja taghha. Din it-testimonjanza kollha
  ma thalli l-ebda ombra ta'' dubju f''din il-Qorti illi x-xhieda tal-attrici hija
  l-verzjoni korretta ta'' kif zvolgiet ir-relazzjoni tossika bejn il-partijiet. Illi
  din ilQorti taghraf it-trawma li ghaddew minnha l-attrici, uliedha u anke l-familjari
  taghha a kawza tal-agir ossessjonat tal-intimat, l-effetti ta'' liema ghadhom jinhassu
  b''mod palezi fuq l-attrici u uliedha. Illi dan kollu ser ikollu riperkussjonijiet
  sostanzjali fuq il-hajja tal-attrici u uliedha u kif ukoll fuq ir-rapporti taghhom
  ma'' persuni ohra. Illi tul il-proceduri, din il-Qorti rat kif lghemil tal-intimat
  kellu effett fuq il-progress akkademiku tal-minuri u anke fl-izvilupp socjali taghha
  fis-sens li l-minuri huma mahkuma minn biza u ansjeta konsiderevoli tant li kull
  darba li jirfsu mill-bieb tas-shelter ''l barra, kontinwament iharsu lura biex jaraw
  jekk l-intimat qieghedx isegwihom.\\n\\nIlli minkejja li l-intimat fit-testimonjanza
  tieghu dejjem jishaq illi huwa jrid biss li jara lit-tifla u li hu m''ghandu l-ebda
  tort ghal dak li gara, id-disinteress totali da parti tieghu lejn l-andament finali
  ta'' dawn il-proceduri jirrifletti dak rilevat mill-attrici fix-xhieda taghha u
  cioe illi lintimat huwa persuna inaffidabbli u irresponsabbli, u li fil-verita'',
  qatt ma wera'' interess versu l-edukazzjoni u l-kura tal-minuri HI. Minkejja dak
  li dejjem ttenna fit-testimonjanza tieghu, jirrizulta b''mod car illi l-intimat
  ftit li xejn impurtah mill-ezitu ta'' dawn l-istess proceduri. Illi fil-fehma konsiderata
  ta'' din il-Qorti dak li rrizulta mill-atti processwali u mix-xhieda\\n\\n11 Vide
  Fol 9 ta'' 248/2019/2 fl-ismijiet premessi\\n\\nmismugha, hija l-ossessjoni esagerata
  tal-intimat fil-konfront tal-attrici, tal-ex ragel taghha, CV missier FV u AV, tfal
  tal-attrici.\\n\\nDin il-Qorti rat illi permezz ta'' digriet pendente lite, datat
  17 ta'' Ottubru 2019, l-attrici kienet giet fdata bil-kura u l-kustodja tal-minuri
  u kienet awtorizzatha sabiex tiehu dawk iddecisjonijiet kollha relatati mas-sahha
  u l-edukazzjoni tal-istess. Illi l-intimat qatt ma kkontesta din id-decisjoni.\\n\\nIlli
  fid-dawl ta'' dan il-fatt, u fid-dawl tal-konsiderazzjonijiet maghmula aktar l''
  fuq, din ilQorti tqis illi jezistu l-estremi necessarji sabiex il-kura u kustodja
  tal-minuri tigi fdata esklussivament f''idejn ir-rikorrenti omm, li ghandha wahidha
  minghajr l-firma, kunsens jew presenza tal-intimat missier, tiehu decizjonijiet
  ordinarji jew straordinarji kollha firrigward tal-minuri HI ghal dak kollu li jirrigwarda
  l-edukazzjoni,s-sahha, is-safar u l-passaport tal-minuri u t-tigdid tieghu u dan
  fl-ahjar interess tal-istess minuri. Illi fid-dawl ta'' dan, il-Qorti tordna illi
  r-residenza primarja tal-minuri ghandha tibqa'' mal-attrici omm. Illi ghalhekk u
  flahjar interess tal-minuri HI, din il-Qorti tordna illi l-intimat ghandu jigi zvestit
  minn kull setgha u jeddijiet ta'' genitur.\\n\\nFir-rigward tal-access mal-minuri,
  il-Qorti tqis illi huwa generalment fl-ahjar interess talminuri illi tigi preservata
  r-relazzjoni taghhom maz-zewg genituri, indipendentement mill-istat tar-relazzjoni
  ta'' bejn il-genituri stess. Illi l-Artikolu 57 tal-Kap 16 jipprovdi kif segwenti:\\n\\n(1)
  Tkun min tkun il-persuna li f''idejha ji\u0121u fdati l-ulied minuri tal-mi\u017c\u017cew\u0121in,
  il-mi\u017c\u017cew\u0121in jibqg\u0127u fil-jedd li jaraw li kollox qieg\u0127ed
  isir sewwa g\u0127al dak li hu manteniment u edukazzjoni, u jibqg\u0127u obbligati
  li jo\u0127or\u0121u s-sehem li jmisshom g\u0127all-manteniment u l-edukazzjoni,
  skont il-li\u0121i.\\n(2) Hu m\u0127olli fid-dehen tal-qorti li tistabbilixxi, skont
  i\u010b- \u010birkostanzi, i\u017c-\u017cmien, il-lok, u l-mod li fihom il-mi\u017c\u017cew\u0121in
  ikollhom a\u010b\u010bess g\u0127all-ulied.\\n(3) Il-qorti tista'' tipprojbixxi
  g\u0127al kollox lill-missier jew lill-omm li jkollhom a\u010b\u010bess g\u0127all-ulied
  minuri tag\u0127hom, meta dan jista'' jkun ta'' \u0127sara g\u0127all-\u0121id ta''
  l-istess minuri.\\n\\nRik.Gur.Nru.: 248/2019 JPG\\n\\nMeta si tratta ta'' drittijiet
  tal-minuri vis-\u00e0-vis d-drittijiet tal-genituri l-Qorti hija fid-dover li tqis
  dejjem dak li hu fl-ahjar interess tal-minuri u dan peress li fil-maggor parti tal-kazijiet
  li jitressqu ghad-decizjonijiet tal-Qorti tal-Familja, kull decizjoni immankabilment
  thalli effett duratur fuq il-hajja tal-minuri u fuq il-hajja ta'' dawk ta'' madwar
  il-minuri. Illi gie rilevat millQrati illi:\\n\\n\\\"Din il-Qorti tibda biex taghmilha
  cara li, fejn jidhlu minuri, m''hemmx dritt ghall-access, izda obbligu tal-genituri
  li t-tnejn jikkontribwixxu ghall-izvilupp tal-minuri li, ghal dan il-ghan, jehtigilha
  jkollha kuntatt ma'' ommha u anke ma'' missierha. Kwindi lil min jigi fdat bil-kura
  tal-minuri u kif jigi provdut laccess, jiddependi mill-htigijiet tat-tifla u mhux
  mill-interess talgenituri\u2026Huma l-genituri li jridu jakkomodaw lit-tfal, u mhux
  vice versa. Limportanti hu l-istabbilita` emozzjonali tat-tifla, u li din ikollha
  kuntatt malgenituri taghha bl-anqas disturb possibbli. 12\\n\\nDin il-Qorti rat
  illi pendente lite, l-intimat kien inghata dritt ta'' access supervizjonat u dana
  in forza ta'' digriet datat 9 ta'' Lulju 2020 li kien moghti seduta stante. Illi
  din il-Qorti semghat ix-xhieda ta'' diversi professjonisti fejn gie rimarkat diversi
  drabi illi l-minuri HI, kif ukoll hutha l-bniet FV u AV, kienu qieghdin jimmanifestaw
  sintomi ta'' trawma emozzjonali u dan minhabba dak li garbu tul it-tfulija taghhom
  a kawza tal-intimat. Illi din il-Qorti rat ukoll illi minkejja dak li dejjem tenna
  l-intimat, l-intimat kien qieghed juza lil HI biss bhala arma sabiex jikkontrollha
  lill-attrici f''dak kollu li hija ghamlet u f''kull decisjoni li hija hadet jew
  ma haditx. Illi mit-testimonjanza tal-attrici huwa evidenti li wara dak kollu li
  garrbu, il-minuri HI konsegwentement bdiet turi riluttanza kbira li tmur ghallaccess
  ma'' missierha, jew li terga tipprova tibni xi xejra ta'' rapport jew relazzjoni
  mieghu, specjalment in segwitu tal-htief ta'' HIminn idejn ommha quddiem bieb ta''
  shelter. Din il-Qorti fic-cirkostanzi ma tqisx illi huwa fl-ahjar interess tal-minuri
  illi tigi ordnata tattendi access ma'' missierha. Din il-Qorti rat ukoll kif l-intimat
  kien juza l-access supervizjonat sabiex jiehu minn mohh it-tifla u jitkixxef fuq
  il-passi tal-attrici, tant li l-istess haddiema socjali irrakomandaw illi jsir psychological
  assessment fuq l-intimat. Illi hija l-fehma konsiderata ta'' din il-Qorti illi l-minuri
  HI hija fil-bzonn ta'' terapija konsidervoli sabiex hija tipprova tohrog minn din
  it-trawma li ghexet ghal diversi snin u certament access impost fuqha mhuwiex ser
  jghin sabiex hija tgheleb din it-trawma f''dan l-istadju.\\n\\n12 Vide decisjoni
  tal-Qorti tal-Appell datata 3 ta'' Ottubru 2008 fl-ismijiet Miriam Cauchi vs Francis
  Cauchi.\\n\\nIlli fir-rigward it-talba ghall-manteniment, din il-Qorti hija konsapevoli
  illi t-trobbija tal-ulied iggib maghha diversi spejjes illum il-gurnata, apparti
  l-fatt li l-hajja qieghda tghola b''rata pjutost rapida.  Illi kif diga ribadut,
  \\\"huwa dritt tat-tfal minuri li ma jisfawx m\u010ba\u0127\u0127din minn dawk l-affarijiet
  li d- dinja tal-lum tikkunsidra b\u0127ala ne\u010bessita` g\u0127all-edukazzjoni
  u g\u0127alli\u017cvilupp tag\u0127hom\\\" u dan l-oneru jinkombi fuq iz-zewg genituri.
  Illi pero'' u naturalment dawn il-Qrati dejjem fehmu illi huwa stat ta'' fatt li
  l-genitur li mieghu jkunu qieghdin jirrisjedu ttfal, xi ftit jew wisq dan jillimita
  l-kapacita'' ta'' dak il-genitur li jiggenera introjtu akbar minn dak li ghandu
  fil-prezent.\\n\\nIl-Qorti taghraf illi l-inaffidabilita'' da parti tal-intimat,
  wasslet lir-rikorrenti trabbi lil minuri prattikament wahedha. Ghalhekk l-oneru
  tat-trobbija tat-tifla waqa'' kollu fuq spallejn irrikorrenti. Il-Qorti taghraf
  illi hija qed taghmel kontribut non-finanzjarju sostanzjali filmanteniment tal-minuri.
  Dan ghalhekk huwa fattur li fil-fehma tal-Qorti ghandu relevanza kbira fil-kuntest
  tal-likwidazzjoni tal-manteniment li ghandu jkun dovut mill-intimat. Illi din il-Qorti
  rat illi l-attrici tippercepixxi beneficcji socjali fir-rigward tal-minuri HIu qieghda
  tahdem bhala home helper fuq bazi casual part-time, u dana kif indikat fin-nota
  ta'' sottomissjonijiet tal-istess attrici. Illi di piu, l-attrici qieghd athallas
  kera ta'' sitt mija u hamsin ewro (EUR 650) kull xahar, u qieghda tircievi sussidju
  ta'' tlett mija, erba'' u sebghin ewro u tmenin centezmu tal-Ewro (EUR 374.8) kull
  xahar mill-Awtorita tad-Djar.\\n\\nDin il-Qorti rat illi permezz ta'' skirttura
  privata datat 29 ta'' Mejju 2016, il-partijiet kienu ftehmu illi l-intimat ghandu
  jivversa s-somma ta'' hamsa u sebghin ewro (EUR 75) fil-gimgha bhala manteniment
  ghal bintu HI u cioe is-somma komplessiva ta'' tlett mitt ewro (EUR 300) kull erba''
  gimghat, liema somma tinkludi ukoll l-ispejjes kollha relattivi ghas-sahha u ledukazzjoni
  tal-minuri. Permezz ta'' digriet moghti seduta stante, fl-udjenza tad- 9 ta'' Lulju
  2020, din il-Qorti ordnat lill-intimat jivversa s-somma ta'' tlett mitt ewro (EUR
  300) kull erbgha gimghat permezz ta'' standing order.\\n\\nFil-prospett prezentat
  mill-attrici, u cioe Dok SRF 5, l-attrici indikat illi hija tinkorri l-ammont ta''
  sebgha mija erbgha u erbghin Ewro u seba'' u sittin centenzmu tal-Ewro (EUR 744.670
  ghall-minuri fix-xahar.\\n\\nIlli mill-ahhar informazzjoni li ghandha din il-Qorti,
  jidher illi l-intimat huwa mahrub millpajjiz. Illi ciononostante din il-Qorti tqis
  illi hija ghandha tikkonferma d-digriet pendente lite taghha tad- 9 ta'' Lulju 2020,
  u tordna lill-intimat jivversa s-somma ta'' tlett mitt Ewro (EUR 300) kull erba''
  gimghat bhala manteniment ghall-minuri, liema somma tinkludi sehem lintimat mill-ispejjes
  ta''sahha, edukazzjoni u attivitajiet extra-kurrikular. Illi din il-Qorti tordna
  illi l-manteniment ordnat ghandu jinqata direttament mid-dhul, u /jew mill-introjtu
  tal-intimat, u/jew mill-paga, u/jew minn kwalsiasi beneficcji socjali jew pensjoni
  li l-intimat jista jkun qieghed talvolta jircievi, b''dana illi ghandu jigi depozitat
  f'' kont bankarju indikat mill-attrici.\\n\\nIlli l-manteniment ghandu jghola skond
  l-indici tal-gholi tal-hajja.\\n\\nIlli fir-rigward it-talba ghall-arretrati ta''
  manteniment, din il-Qorti taghraf illi kif dikjarat millattrici fl-affidavit taghha
  a fol 257 tal-atti, liema xhieda mhux kontradetta, sas- 7 ta'' Dicembru 2021, l-intimat
  kellu jhallas s-somma ta'' sitt elef u erba'' mitt Ewro (EUR 6,400) rapprezentanti
  arretrati ta'' manteniment ghal diversi xhur. Illi fin-nota ta'' sottomissjonijiet
  taghha l-attrici tindika illi mit-8 ta'' Dicembru 2021 sat-28 ta'' Frar 2023, l-intimat
  ghandu arretrati ta'' manteniment f''ammont ta'' erbat elef u tmien mitt ewro (EUR
  4,800) ohra. Illi din il-Qorti rat ukoll illi fix-xhieda tieghu tad-9 ta'' Novembru
  2022, huwa stqarr illi kienu ilhu xi sitt xhur ma jivversa manteniment. Illi ghalhekk
  u fid-dawl ta'' dawn il-konsiderazzjonijiet, din il-Qorti tordna lill-intimat ihallas
  lill-attrici s-somma ta'' hdax-il ef u mitejn Ewro (EUR 11, 200) rapprezentanti
  arretrati ta'' manteniment dovuti lill-attrici ghall-htigijiet tal-minuri HI.\\n\\nIlli
  tenut kont tac-cirkostanzi imwera ta'' dan il-kaz, din il-Qorti tqis illi t-talba
  tal-attrici ghallHrug ta'' Ordni ta'' Protezzjoni versu l-persuna taghha, uliedha,
  u l-membri tal-familja taghha, hija gustifikata u ghalhekk tilqa'' din it-talba.\\n\\nGhal
  dawn il-motivi, din il-Qorti taqta'' u tiddeciedi billi:\\n\\n1. Tilqa l-ewwel talba
  u tordna illi l-intimat ghandu jigi zvestit mill-jeddijiet kollha ta'' setgha ta''
  genitor u dan fl-ahjar interess tal-minuri HI;\\n2. Tilqa'' t-tieni talba u tordna
  illi l-kura u l-kustodja tal-minuri HI ghandha tkun vestita unikament u esklussivament
  fl-attrici omm,;\\n3. Tilqa'' t-tielet talba u tordna illi l-attrici omm hija awtorizzata
  tiehu dawk iddecisjonijiet kollha relatati mas-sahha, safar, hrug ta'' passaport
  u tigdid tieghu u mal-edukazzjoni tal-istess minuri minghajr il-kunsens, il-firma
  u l-presenza\\n\\ntal-intimat;\\n\\n4. Tilqa'' r-raba talba u tordna illi r-residenza
  primarja tal-minuri HI ghandha tkun mal-omm u li d-domicilju u residenza ordinarja
  taghha ghandha tkun filGzejjer Maltin;\\n5. Tilqa'' l-hames talba limitatament u
  tordna illi l-minuri ghandha tithalla filharsien ta'' terzi persuni li huma familjari
  tal-attrici u/jew persuni li huma indikati bhala persuni affidabbli mill-attrici;\\n6.
  Tilqa'' s-sitt talba b''dana illi tordna illi l-access tal-missier versu l-minuri
  HI ghandu jibqa'' sospiz, u dana fl-ahjar interess tal-minuri HI;\\n7. Tilqa'' is-seba''
  talba, b''dana illi tordna lill-intimat jivversa lill-attrici s-somma ta'' tlett
  mitt Ewro (EUR 300) kull erba'' gimghat bhala manteniment ghallminuri, liema somm
  ghandha tigi versata f''kont bankarju indikat mill-istess attrici, liema somma tinkludi
  sehem l-intimat mill-ispejjes ta'' edukazzjoni, sahha u attivitajiet extra-kurrikulari,
  liema ammont ghandu jinqatgha direttament mid-dhul, u/jew introjtu, u/jew salarju
  tal-intimat, u/jew kwalsiasi beneficcju, u/jew pensjoni li l-intimat jista talvolta
  jippercepixxi. Illi l-manteniment ghandu jghola skond l-indici tal-gholi tal-hajja.
  Illi dana l-ammont ghandu jibqa'' hekk pagabbli sakemm il-minuri Hi taghlaq l-eta''
  ta'' tmintax (18)- il sena jekk tieqaf mill-iskola u tibda tahdem  fuq bazi full
  time, jew sa l-eta ta'' tlieta u ghoxrin (23) sena jekk il-minuri tiddeciedi li
  tkompli bl-istudji taghha fuq bazi full-time. Tordna illi l-attrici ghandha tippercepixxi
  kwalsiasi beneficcji li hija tista talvolta tkun eligibbli ghalihom minhabba l-minuri
  HI;\\n8. Tordna lill-intimat ihallas s-somma ta'' hdax-il elf u mitejn Ewro (EUR
  11,200) rapprezentanti arretrati ta'' manteniment.\\n9. Tilqa'' t-talba tal-attrici
  ghall-hrug ta'' Ordni ta'' Protezzjoni ai termini tal-Kap 16 tal-Ligijiet ta'' Malta
  u tordna s-segwenti:\\n\\nTordna l-\u0127ru\u0121 tal-Ordni ta'' Protezzjoni kontra
  II a favur SF u tal-familja immedjata tag\u0127ha li tinkludi lil uliedha AV, u
  FV ahwa V, u l-minuri HI, u membri tal-familja immedjata taghha, b''mod partikolari
  izda mhux limitatament missiera VF, u l-ex-ragel taghha CV, missier AV u FV ahwa
  V u dan ta\u0127t il-kundizzjonijiet segwenti:\\n\\n(i) Tipprojbixxi lil II milli
  javvi\u010bina jew b''xi mod isegwi l-movimenti ta'' SF, ilfamiljari taghha u l-persuni
  fuq indikati;\\n\\n(ii)\\n\\n(iii)\\n\\n(iv)\\n\\n(v)\\n\\n(vi)\\n\\n(vii)\\n\\nTipprojbixxi
  lil II milli jikkuntattja b''kull mod, inkluz bil-mezzi eletroni\u010bi, lil\\n\\nSF,
  il-familjari taghha u l-persuni fuq indikati, u tordnalu sabiex izomm distanza ta\u2019
  mhux anqas minn kilometru mill-fond fejn jirrisjedu, tal-post tax-\\n\\nxog\u0127ol
  tal-attrici u/jew l-iskola ta'' uliedha, uliedha, familjari taghha u l-persuni fuq
  indikati l-ohra, u f\u2019distanza ta\u2019 mhux anqas minn mitejn metru (200m)
  kull\\n\\nfejn tkun tinstab SF, u l-persuni fuq indikati;\\n\\nTipprojbixxi lil
  II milli b''kull mod, inkluz bil-mezzi eletroni\u010bi, jimmolesta, jivvessa, idejjaq
  jew jiffastidja lil attrici, il-familjari taghha u l-persuni fuq\\n\\nindikati;\\n\\nDin
  l-Ordni ta'' Protezzjoni qed ting\u0127ata effett immedjat u tibqa'' fis-se\u0127\u0127
  g\u0127al\\n\\n\u0127ames (5) snin, liema zmien jista'' ji\u0121i ridott jew estiz
  g\u0127al perjodi ulterjuri ai termini tal-Artikolu 412(\u010a)(9) tal-Kodi\u010bi
  Kriminali u Art 37 tal-Kodici Civili;\\n\\nJekk ming\u0127ajr ra\u0121uni valida
  II jikser xi projbizzjoni jew restrizzjoni imposta fuqu permezz ta\u2019 din l-Ordni
  ta\u2019 Protezzjoni, jista\u2019, jekk jinstab \u0127ati, je\u0127el\\n\\nmulta
  ta'' sebat elef Ewro (\u20ac7,000) jew pri\u0121unerija ta'' mhux aktar minn sentejn,
  jew it-tnejn li huma;\\n\\nKopja ta'' din l-Ordni g\u0127andha ti\u0121i notifikata
  lil II a kariku ta'' SF bil-mezz tal- purtier u jekk ikun hemm bzonn wara l-hinijiet
  legali;\\n\\nL-Ordni ta'' Protezzjoni ma\u0127ru\u0121a llum kontra II g\u0127andha
  ti\u0121i notifikata lill-\\n\\nKummissarju tal-Pulizija.\\n\\nL-ispejjes kollha
  ghandhom ikunu a karigu tal-intimat.\\n\\nMoqrija\\n\\nMhallef  Jacqueline Padovani
  Grima LL.D. LL.M. (IMLI)\\n\\n26\"", "\"PRIM''AWLA TAL-QORTI \u010aIVILI\\n\\nM\u0126ALLEF\\n\\nI\\n\\nONOR.
  CHRISTIAN FALZON SCERRI\\n\\nSeduta ta'' nhar il-\u0120img\u0127a, 17 ta'' Di\u010bembru,
  2021\\n\\nMandat ta'' Inibizzjoni Nru: 1796/2021\\n\\nAVV. DR. MICHAEL PSAILA B\u0126ALA
  MANDATARJU SPE\u010aJALI TAS-SO\u010aJET\u00c0 ESTERA TALJANA SISAL LOTTERY ITALIA
  S.P.A., ENTIT\u00c0 RE\u0120ISTRATA TA\u0126T ID-DIREZZJONI TA'' SISAL S.P.A. U
  TAS-SO\u010aJET\u00c0 ESTERA AWSTRIJAKA SCIENTIFIC GAMES INTERNATIONAL GMBH U EDEN
  LESIURE GROUP LIMITED\\n\\nVS.\\n\\nMS NANCY CARUANA B\u0126ALA SEGRETARJU PERMANENTI
  IN RAPPRE\u017bENTANZA TAL-MINISTERU TAL-EKONOMIJA U L-INDUSTRIJA, DR. EMANUEL CAMILLERI
  B\u0126ALA CHAIRPERSON TALPRIVATISATION UNIT, L-AWTORIT\u00c0 MALTIJA DWAR IL-LOG\u0126OB,
  ALFRED CAMILLERI B\u0126ALA SEGRETARJU PERMANENTI IN RAPPRE\u017bENTANZA TAL-MINISTERU
  TAL-FINANZI U NATIONAL LOTTERY PLC\\n\\nIl-Qorti:\\n\\n1. Dan huwa digriet finali
  dwar talba tar-rikorrenti sabiex jin\u0127are\u0121 mandat ta'' inibizzjoni ta\u0127t
  l-artikolu 873 tal-Kap 12 tal-Li\u0121ijiet ta'' Malta;\\n\\nDa\u0127la\\n\\n2.
  B''rikors imressaq fit-3 ta'' Di\u010bembru, 2021, ir-rikorrenti fissru li huma
  b\u0127ala grupp ta'' operaturi ekonomi\u010bi, bl-isem ta'' Sisal Malta Consortium,
  \u0127adu sehem flimkien mal-intimata National Lottery plc f''sej\u0127a g\u0127all-proposti
  ma\u0127ru\u0121a mill-Gvern, b''rabta mal-kon\u010bessjoni g\u0127ad-drittijiet
  tal-Lotterija Nazzjonali ta'' Malta. Huma jg\u0127idu li t-Taqsima tal-Privatizzazzjoni
  (Privatisation Unit), li kienet qieg\u0127da\\n\\ntmexxi s-sej\u0127a f''isem il-Gvern,
  \u0127abbret li l-a\u0127jar offerent biex jikseb il-jedd li jopera l-log\u0127ob
  tal-lotterija nazzjonali g\u0127al \u017cmien ta'' g\u0127axar snin kienet National
  Lottery plc li offriet il-prezz ta'' \u20ac105.077,77 kontra l-prezz ta'' \u20ac53,330,001
  offrut minn Sisal Malta Consortium;\\n3. Ir-rikorrenti jsostnu per\u00f2 li l-offerta
  ta'' National Lottery plc kellha ti\u0121i mwarrba ''l barra g\u0127aliex skonthom
  National Lottery plc ma kinitx tissodisfa l-kriterji talFitness and Propriety imsemmija
  fid-dokument tas-sej\u0127a g\u0127all-proposti. Flispe\u010bifiku, huma jtennu
  li l-azzjonist ewlieni ta'' National Lottery plc ma j\u0127addimx 300 ru\u0127 fl-industrija
  tal-log\u0127ob u li n-nies li jifformaw parti ma'' National Lottery plc ma \u0127alqux
  fatturat annwali ta'' mill-inqas \u20ac300,000,000, f''xi sena partikolari bejn
  l2018 u l-2020. Minbarra dan, ir-rikorrenti huma \u0127osbiena dwar l-offerta finanzjarja
  proposta minn National Lottery plc g\u0127aliex din hija g\u0127olja wisq, b''dana
  li l-kumitat tal-g\u0127a\u017cla kellu jinvestiga kif National Lottery plc waslet
  g\u0127al din i\u010b-\u010bifra;\\n4. G\u0127alhekk billi r-rikorrenti jemmnu li
  l-pro\u010bess ta'' g\u0127arbiel, li wassal g\u0127all-g\u0127a\u017cla ta'' National
  Lottery plc b\u0127ala l-a\u0127jar offerent, huwa m\u010bappas b''irregolarit\u00e0
  huma talbu lil din il-qorti sabiex i\u017c\u017comm lill-intimati milli:\\n\u00ab(i)
  Tg\u0127addu biex tattwaw u/jew tag\u0127tu [sic] effett lill-g\u0127a\u017cla talintimata
  National Lottery plc b\u0127ala \\\"Prefered Bidder\\\" fil-kuntest ta'' sej\u0127a
  g\u0127all-proposti (minn issa ''l quddiem l-\\\"RFP\\\") b''rabta malKon\u010bessjoni
  g\u0127ad-drittijiet tal-Lotterija Nazzjonali ta'' Malta (Concession for the Rights
  of the National Lottery of Malta \u2013 minn issa ''l quddiem \\\"il-Kon\u010bessjoni\\\"),
  kemm jekk permezz tal-firma talkuntratt ta'' kon\u010bessjoni relattiv, permezz
  tal-\u0127ru\u0121 jew g\u0127otja ta'' xi li\u010benza [sic] lil National plc [sic],
  jew bi kwalunkwe mod ie\u0127or;\\n(ii) Toperaw [sic] il-log\u0127ob nazzjonali
  inklu\u017c il-Lotterija Nazzjonali, Super 5 u Lottu, tramite l-imsemmija National
  Lottery plc b\u0127ala kon\u010bessjonarju u dan anke f''ka\u017c li tali firma
  tal-kuntratt ta'' kon\u010bessjoni, \u0127ru\u0121 jew g\u0127otja ta'' xi li\u010benza
  [sic] \u0121a se\u0127\u0127et.\u00bb\\n5. B''digriet ma\u0127ru\u0121 dakinhar
  stess, il-qorti laqg\u0127et din it-talba b''mod provi\u017corju skont l-artikolu
  875(2) tal-Kap 12 tal-Li\u0121ijiet ta'' Malta. Fl-istess digriet, il-qorti ordnat
  ukoll in-notifika lill-intimati, bi \u017cmien g\u0127axart ijiem g\u0127at-twe\u0121iba,
  u appuntat ir-rikors g\u0127as-smig\u0127 g\u0127as-17 ta'' Di\u010bembru, 2021;\\n\\n6.
  In-National Lottery plc wie\u0121bet fl-10 ta'' Di\u010bembru, 2021, is-Segretarji
  Permanenti ta\u017c-\u017cew\u0121 Ministeri wie\u0121bu fil-15 ta'' Di\u010bembru,
  2021, il-Privatisation Unit wie\u0121bet ukoll fil-15 ta'' Di\u010bembru, 2021 u
  l-Awtorit\u00e0 Maltija dwar il-Log\u0127ob wie\u0121bet fis-16 ta'' Di\u010bembru,
  2021. Fir-risposti rispettivi tag\u0127hom, dawn taw irra\u0121unijiet tag\u0127hom
  g\u0127aliex il-mandat ta'' inibizzjoni ma jmissux jintlaqa'';\\n7. In\u017camm
  smig\u0127 fis-17 ta'' Di\u010bembru, 2021 u dakinhar ir-rappre\u017centanti tal-intimati
  ddikjaraw fil-verbal li kieku ma kienx g\u0127al dan ir-rikors, huma kienu \u0127a
  jkomplu bil-pro\u010bess li jista'' jwassal g\u0127all-g\u0127oti tal-kuntratt tal-kon\u010bessjoni
  u tal-li\u010benzja. Dawn id-dikarazzjonijiet saru minn dawn ir-rappre\u017centanti
  skont l-artikolu 873(3) tal-Kap 12 tal-Li\u0121ijiet ta'' Malta;\\n8. Wara li semg\u0127et
  it-trattazzjoni tal-partijiet, il-qorti \u0127alliet ir-rikors sabiex jing\u0127ata
  digriet in camera;\\n\\nFatti\\n\\n9. Fit-30 ta'' Lulju, 2021, il-Privatisation
  Unit f''isem il-Ministeru tal-Ekonomija u Industrija \u0127are\u0121 dokument imsejja\u0127,
  \u00abRequest For Proposals Concession For The Rights of the National Lottery of
  Malta\u00bb, li permezz tieg\u0127u operaturi ekonomi\u010bi \u0121ew mistiedna
  biex jg\u0127idu x''kienu lesti li j\u0127allsu biex jing\u0127ataw il-jedd li joperaw
  il-log\u0127ob tal-lotterija nazzjonali g\u0127al \u017cmien ta'' g\u0127axar snin;\\n10.
  Il-ksib tal-kon\u010bessjoni hija \u0127tie\u0121a ewlenija biex dan imbag\u0127ad
  ikun jista'' japplika g\u0127all-g\u0127oti ta'' li\u010benzja tal-log\u0127ob tal-lotterija
  nazzjonali mill-Awtorit\u00e0 Maltija Dwar il-Log\u0127ob (ara artikolu 2.1.3 tad-dokument
  tas-sej\u0127a);\\n11. Din is-sej\u0127a ma \u0121ietx regolata bir-Regolamenti
  Dwar Kuntratti Ta'' Kon\u010bessjoni (Le\u0121islazzjoni Sussidjarja 601.09) min\u0127abba
  l-e\u017cenzjoni li hemm fir-regolament 5(1)(r) dwar kon\u010bessjonijiet g\u0127as-servizzi
  ta'' lotterija;\\n\\n12. Illi biex ji\u0121i meqjus mill-kumitat tal-g\u0127a\u017cla,
  l-offerent kellu jissodisfa l-kriterji taleli\u0121ibilit\u00e0 li jissemmew fid-dokument
  tas-sej\u0127a g\u0127all-proposti. Fost dawn il-kriterji msemmija fl-artikolu 188.8.131.52.6
  tad-dokument tas-sej\u0127a kien hemm li:\\n\u00ab(i) The majority shareholder of
  the Proponent shall, at a minimum, employ three hundred (300) individuals within
  the gaming industry who reside within the European Union or the European Economic
  Area;\\n\\nu\\n\\n(ii) The companies forming part of the Proponent''s corporate
  structure must have cumulatively generated an annual turnover of a minimum of three
  hundred million Euro (\u20ac300,000,000) in at least one of the previous three (3)
  financial years. Provided that for this purpose, only companies established within
  the European Union, or the European Economic Area will be taken into account, any
  turnover generated form the gaming business shall be taken into account.\u00bb\\n13.
  Wara li l-Privatisation Unit g\u0127arblet l-offerti li ntefg\u0127u, hija \u0127abbret
  li kienet ir\u010beviet \u017cew\u0121 offerti: wa\u0127da ming\u0127and National
  Lottery plc bil-prezz ta'' \u20ac105.077,777 u o\u0127ra ming\u0127and Sisal Malta
  Consortium bil-prezz ta'' \u20ac 53,330,001. Il-Privatisation Unit \u0127abbret
  li l-offerta preferuta kienet dik mix\u0127uta minn National Lottery plc;\\n14.
  Sisal Malta Consortium ma qablitx ma'' din id-de\u010bi\u017cjoni tal-Privatisation
  Unit i\u017cda skont l-artikolu 2.11 tad-dokument tas-sej\u0127a l-ebda appell ma
  seta'' jsir dwar ilpro\u010bess tal-g\u0127a\u017cla quddiem xi bord ta'' revi\u017cjoni;\\n15.
  Fit-3 ta'' Di\u010bembru, 2021, ir-rikorrenti ressqu dan ir-rikors g\u0127all-\u0127ru\u0121
  tal-mandat ta'' inibizzjoni biex l-ebda kuntratt u l-ebda li\u010benzja ma ting\u0127ata
  lil National Lottery plc. Dan min\u0127abba li huma qeg\u0127din jg\u0127idu li
  l-pro\u010bess tal-g\u0127a\u017cla ma sarx sew g\u0127aliex suppost National Lottery
  plc kellha ti\u0121i skwalifikata peress li l-offerta tag\u0127ha ma kinitx toqg\u0127od
  mal-kriterji tal-eli\u0121ibilit\u00e0 dwar in-numru ta'' \u0127addiema flindustrija
  tal-log\u0127ob u mal-fatturat minimu ta'' 300 miljun, u kif ukoll g\u0127aliex
  ilprezz offrut minnha huwa wie\u0127ed suspettu\u017c;\\n\\nKonsiderazzjonijiet\\n\\n16.
  B\u0127ala li\u0121i, insibu mni\u017c\u017cel fl-artikolu 873(1) tal-Kap 12 tal-Li\u0121ijiet
  ta'' Malta, li liskop tal-mandat ta'' inibizzjoni huwa li j\u017comm persuna milli
  tag\u0127mel kull \u0127a\u0121a li tista'' tkun ta'' pre\u0121udizzju g\u0127all-persuna
  li qed titlob il-mandat;\\n17. Skont il-li\u0121i, il-qorti g\u0127andha tawtorizza
  l-\u0127ru\u0121 ta'' mandat ta'' inibizzjoni meta:\\ni. Ir-rikorrent ikollu mad-daqqa
  t''g\u0127ajn il-jedd o\u0121\u0121ettiv u mhux so\u0121\u0121ettiv li jwaqqaf jew
  i\u017comm lill-intimat milli jag\u0127mel xi \u0127a\u0121a li tista'' tkun ta''
  \u0127sara jew li biha tista'' \u0121\u0121iblu pre\u0121udizzju. Wie\u0127ed irid
  jag\u0127raf li l-jedd li je\u0127tie\u0121 jit\u0127ares mhux bi\u017c\u017cejjed
  li jkun sempli\u010bi diffikult\u00e0, disa\u0121ju jew t\u0127assib (ara Dr. Louis
  Cassar Pulli\u010bino noe v. Joseph Caruana Curran noe et, Qorti tal-Kummer\u010b
  tas-26 ta'' Mejju, 1995);\\nii. Il-mandat ikun me\u0127tie\u0121 biex ji\u0121i
  m\u0127ares dak il-jedd. F''dan is-sens, jekk linkonvenjent jew in-nuqqas lamentat
  jista'' jitne\u0127\u0127a, imqar b''de\u010bi\u017cjoni wara li ji\u0121i mist\u0127arre\u0121
  il-ka\u017c fil-mertu, ji\u0121i nieqes it-tieni element me\u0127tie\u0121 g\u0127all-\u0127ru\u0121
  tal-Mandat (ara fost \u0127afna o\u0127rajn id-de\u010bi\u017cjoni fl-ismijiet Odette
  Tonna et v. Awtorit\u00e0 tal-Artijiet mog\u0127tija mill-Prim''Awla tal-Qorti \u010aivili
  fid-19 ta'' Lulju, 2018); u\\niii. Meta t-talba g\u0127all-\u0127ru\u0121 tal-mandat
  tkun qieg\u0127da ssir kontra l-Gvern ta'' Malta jew kontra xi persuna b''kariga
  pubblika, fil-kariga uffi\u010bjali tag\u0127ha, b''\u017cieda ma\u017c\u017cew\u0121
  elementi msemmija fil-paragrafu ta'' qabel dan, ir-rikorrenti biex jirnexxi fit-talba
  tieg\u0127u g\u0127all-\u0127ru\u0121 tal-mandat ta'' inibizzjoni jrid juri wkoll
  skont lartikolu 873(3) tal-Kap 12 tal-Li\u0121ijiet ta'' Malta: (i) li l-\u0127a\u0121a
  li huwa qed jitlob li tin\u017camm milli titwettaq fil-fatt hemm il-\u0127sieb li
  titwettaq, u (ii) li l-pre\u0121udizzju li jin\u0127oloq fuqu jkun sproporzjonat
  meta mqabbel mal-istess g\u0127amil tal-\u0127a\u0121a li qed tintalab li ti\u0121i
  mi\u017cmuma (ara d-digriet tal-15 ta'' Di\u010bembru, 2008 fl-ismijiet Supretendent
  Anzjan Raymond G. Zammit v. Il-Ministru tal-Intern u \u0120ustizzja et);\\n\\n18.
  Dawn l-elementi tal-artikolu 873 fuq imsemmija, huma kumulattivi u mhux alternattivi,
  b''dana li anke jekk wie\u0127ed minnhom ma jirri\u017cultax pruvat, il-mandat ta''
  inibizzjoni ma jistax ji\u0121i milqug\u0127 (ara V & C Contractors Limited et v.
  Direttur tal-Kuntratti maqtug\u0127 mill-Prim''Awla tal-Qorti \u010aivili fil-31
  ta'' Jannar, 2011);\\n19. Fil-ka\u017c tal-lum ma hemmx kwistjoni li l-Ministeru
  tal-Eknomija u l-Industrija, ilMinisteru tal-Finanzi, il-Privatisation Unit u l-Awtorit\u00e0
  Maltija Dwar il-Log\u0127ob huma parti mill-Gvern ta'' Malta jew entitajiet mog\u0127nija
  b''karigi pubbli\u010bi li g\u0127alihom jg\u0127odd l-artikolu 873(3) tal-Kap 12
  tal-Li\u0121ijiet ta'' Malta. Lanqas ma hemm kwistjoni li dawn l-intimati kienu
  \u0127a jkomplu bl-ippro\u010bessar tas-sej\u0127a marbuta mal-g\u0127oti tal-kuntratt
  ta'' kon\u010bessjoni u tal-li\u010benzja mertu ta'' dan il-mandat, dan hekk kif
  \u0121ie ddikjarat mir-rappre\u017centanti tag\u0127hom fis-seduta tas-17 ta'' Di\u010bembru,
  2021;\\n20. Il-qorti sejra tibda billi tqis l-ewwel element viz. jekk ir-rikorrenti
  g\u0127andhomx mad-daqqa t''g\u0127ajn jedd o\u0121\u0121ettiv li jwaqqfu lill-intimati;\\n21.
  B\u0127ala da\u0127la, jibda billi jing\u0127ad li s-sehem tar-rikorrenti f''sej\u0127a
  pubblika ma tag\u0127tihom l-ebda \u010bertezza jew dritt li l-offerta tag\u0127hom
  ti\u0121i mag\u0127\u017cula (ara f''dan issens Gafa Safeways Limited v. Dipartiment
  tal-Kuntratti et de\u010bi\u017ca millPrim''Awla tal-Qorti \u010aivili fit-13 ta''
  Lulju, 2010). Joqg\u0127od tajjeb hawnhekk  ukoll, dak li sa\u0127qet il-Prim''Awla
  tal-Qorti \u010aivili fid-digriet tag\u0127ha fil-kaw\u017ca, Diane Galea v. Andrew
  Spiteri et, mog\u0127ti fit-28 ta'' Novembru, 2008, \u00abli l-li\u0121i trid li
  min jitlob il\u0127ru\u0121 ta'' Mandat ta'' Inibizzjoni jrid jag\u0127mel dan fuq
  bi\u017cg\u0127a rejalistiku u mhux sempli\u010bement fuq suspetti infondati, jew
  kon\u0121etturi ipoteti\u010bi li jistg\u0127u jfissru kemm \u0127a\u0121a u kemm
  o\u0127ra\u00bb;\\n22. Minkejja dan kollu, xog\u0127ol il-qorti meta ti\u0121i biex
  tara jekk hija g\u0127andhiex tordna l\u0127ru\u0121 ta'' mandat ta'' inibizzjoni
  mhuwiex dak li taqta'' t-tilwima li hemm g\u0127addejja bejn il-partijiet (ara Victor
  Vassallo v. Edwin Bartolo et noe tal-Prim''Awla talQorti \u010aivili tas-27 ta''
  Marzu, 2003) jew li b''xi mod tidde\u010biedi dwar id-drittijiet rispettivi tag\u0127hom
  fil-ka\u017c. Ifisser dan, li f''dawn il-pro\u010beduri mhuwiex g\u0127al din ilqorti
  li tidde\u010biedi jekk huwiex tassew minnu li kien hemm nuqqasijiet fl-offerta
  ta'' National Lottery plc;\\n\\n23. Bil-kontra, dak li trid tara din il-qorti g\u0127all-g\u0127anijiet
  ta'' din il-pro\u010bedura huwa jekk ir-rikorrenti g\u0127andhomx bil-li\u0121i
  l-jedd li jikkontestaw il-pro\u010bess tal-g\u0127a\u017cla f''din issej\u0127a;\\n24.
  Ma jistax jing\u0127ad li dak il-jedd prima facie je\u017cisti tassew jekk kemm-il
  darba lpretensjoni dwar dak id-dritt ma tistax tissawwar f''talba spe\u010bifika
  wara l-ilqug\u0127 talmandat (ara Nutar Giuseppe Sammut noe v. Frank Scicluna et,
  Appell \u010aivili tat-2 ta'' \u0120unju, 1969, Brendaline Busuttil nomine v. Maria
  Rosaria sive Rose Grima tal-Prim''Awla tal-Qorti \u010aivili tas-26 ta'' \u0120unju,
  2007 u Jonathan Grech v. L-Awtorit\u00e0 Marittma ta'' Malta tal-Prim''Awla tal-Qorti
  \u010aivili tat-28 ta'' Lulju, 2009);\\n25. Li rridu naraw mela huwa x''tip ta''
  azzjoni \u0121udizzjarja jistg\u0127u jag\u0127mlu r-rikorrenti wara l-mandat. Huwa
  ovvju li jekk jiri\u017culta li r-rikorrenti m''g\u0127andhomx disponibbli f''idejhom
  azzjoni \u0121udizzjarja x''jistg\u0127u jressqu allura ma jistax jing\u0127ad li
  huma g\u0127andhom jedd o\u0121\u0121ettiv biex jitolbu l-\u0127ru\u0121 tal-mandat;\\n26.
  Dan kollu meqjus, b''mod \u0121enerali skont ir-Regolamenti dwar l-Akkwist Pubbliku
  (Le\u0121islazzjoni Sussidjarja 601.03) u r-Regolamenti Dwar Kuntratti Ta'' Kon\u010bessjoni
  (Le\u0121islazzjoni Sussidjarja 601.09), operaturi ekonomi\u010bi li jie\u0127du
  sehem f''sej\u0127iet pubbli\u010bi amministrati minn entitajiet tal-Gvern, g\u0127andhom
  il-jedd li jekk iridu jikkontestaw il-mod ta'' kif sej\u0127a tkun \u0121iet ippro\u010bessata
  u a\u0121\u0121udikata. Matul dan i\u017c-\u017cmien ta'' kontestazzjoni, il-pro\u010bess
  tas-sej\u0127a ji\u0121i sospi\u017c u ebda kuntratt ma'' jkun jista'' ji\u0121i
  ffirmat mal-offerent mag\u0127\u017cul;\\n27. Ifisser g\u0127alhekk li f''ka\u017cijiet
  normali ta'' xiri jew kon\u010bessjonijiet pubbli\u010bi, operaturi ekonomi\u010bi
  huma mog\u0127nija bid-dritt li jikkontestaw ir-regolarit\u00e0 u s-siwi talpro\u010bess;\\n\\n28.
  Fil-ka\u017c li g\u0127andha quddiemha l-qorti, is-sej\u0127a pubblika li tmexxiet
  millPrivatisation Unit ma kinitx regolata b''dawn i\u017c-\u017cew\u0121 li\u0121ijiet
  u g\u0127alhekk ir-rikorrenti ma setg\u0127ux jinqdew bir-rimedji msemmijin f''dawn
  i\u017c-\u017cew\u0121 li\u0121ijiet biex jikkontestaw il-pro\u010bess tal-g\u0127a\u017cla;\\n29.
  Ter\u0121a'' u tg\u0127id, fl-artikolu 2.11 tad-dokument tas-sej\u0127a hemm miktub
  li l-ebda appell ma seta'' jsir dwar il-pro\u010bess tal-g\u0127a\u017cla quddiem
  xi bord ta'' revi\u017cjoni;\\n30. Kieku ried il-Gvern skont ir-regola 87(e) tar-Regolamenti
  dwar l-Akkwist Pubbliku (Le\u0121islazzjoni Sussidjarja 601.03) seta'' jasso\u0121\u0121etta
  din is-sej\u0127a g\u0127all-\u0121urisdizzjoni tal-Bord ta'' Revi\u017cjoni Dwar
  Kuntratti Pubbli\u010bi. Din ir-regola tag\u0127ti l-jedd lill-Bord ta'' Revi\u017cjoni
  dwar Kuntrati Pubbli\u010bi li jisma'' u jiddetermina kull ka\u017c assenjat lilu
  f''sej\u0127a pubblika g\u0127all-offerti jew kwotazzjonijiet, ukoll jekk dik is-sej\u0127a
  ma tinvolvix akkwisti pubbli\u010bi. Barra minn hekk li kieku, il-Gvern g\u0127a\u017cel
  li jasso\u0121\u0121etta din is-sej\u0127a g\u0127all-jedd ta'' kontestazzjoni quddiem
  il-Bord ta'' Revi\u017cjoni dwar Kuntratti Pubbli\u010bi, kien ikun hemm jedd ukoll
  ta'' appell quddiem il-Qorti talAppell. F''ka\u017cijiet b\u0127al dawn, kemm il-Bord
  ta'' Revi\u017cjoni dwar Kuntratt Pubbli\u010bi u kif ukoll il-Qorti tal-Appell
  huma marbuta bil-li\u0121i li jidde\u010biedu l-ka\u017cijiet li jitressqu quddiemhom
  f''termini legali qosra \u0127afna;\\n31. Minkejja dan kollu, il-Gvern, permezz
  tal-Privatisation Unit, g\u0127a\u017cel li din is-sej\u0127a ma jag\u0127milhiex
  so\u0121\u0121etta g\u0127all-jedd ta'' appell jew revi\u017cjoni quddiem il-Bord
  ta'' Revi\u017cjoni dwar Kuntratti Pubbli\u010bi u l-Qorti tal-Appell;\\n32. Il-mistoqsija
  g\u0127alhekk li trid ti\u0121i mwie\u0121ba hija jekk fid-dawl ta'' din l-esklu\u017cjoni,
  irrikorrenti g\u0127andhomx jedd li jikkontestaw din is-sej\u0127a?;\\n33. It-twe\u0121iba
  tal-qorti hija wa\u0127da fl-affermattiv. Hi x''inhi u \u0127ari\u0121ha minn \u0127ari\u0121ha,
  kull de\u010bi\u017cjoni amministrattiva hija so\u0121\u0121etta g\u0127all-pro\u010beduri
  ta'' st\u0127arri\u0121 mill-qrati tag\u0127na skont l-artikolu 469A tal-Kap 12
  tal-Li\u0121ijiet ta'' Malta, jekk il-mod ta'' kontestazzjoni kontra dik id-de\u010bi\u017cjoni
  amministrattiva ma ji\u0121ix provdut dwaru f''xi\\n\\nli\u0121i o\u0127ra. Sewwasew
  f''dan il-ka\u017c, ladarba l-jedd ta'' kontestazzjoni tar-ri\u017cultat talpro\u010bess
  tas-sej\u0127a ma jinsab regolat minn ebda li\u0121i, ir-rikorrenti g\u0127andhom
  kull jedd li jitolbu lill-qrati skont l-artikolu 469A tal-Kap 12 tal-Li\u0121ijiet
  ta'' Malta, li jist\u0127arr\u0121u jekk dak ir-ri\u017cultat huwiex wie\u0127ed
  regolari jew le u li j\u0127assruh jekk jinstab li dak ir-ri\u017cultat ikun tabil\u0127aqq
  wie\u0127ed irregolari;\\n34. F''dan is-sens, huwa mag\u0127ruf fil-\u0121urisprudenza
  tag\u0127na li pro\u010bessi dwar sej\u0127iet pubbli\u010bi jaqg\u0127u fl-isfera
  tad-dritt amministrattiv u g\u0127alhekk dawn jistg\u0127u ji\u0121u mist\u0127arr\u0121a
  mil-lenti tal-artikolu 469A tal-Kap 12 tal-Li\u0121ijiet ta'' Malta jekk ma jintweriex
  li jkun hemm rimedju ie\u0127or fil-li\u0121i (ara Roberto Zamboni nomine v. Direttur
  tal-Kuntratti et de\u010bi\u017ca mill-Qorti tal-Appell fil-31 ta'' Mejju, 2002,
  Dragonara Gaming Limited v. Il-Ministru tal-Finanzi et de\u010bi\u017ca mill-Qorti
  talAppell fis-27 ta'' Ottubru, 2017, Ragonesi & Company Limited pro et noe v. Korporazzjoni
  Enemalta et de\u010bi\u017ca fl-24 ta'' Novembru, 2017 u Associated News Group Limited
  v. L-Awtorit\u00e0 Tat-Turi\u017cmu Ta'' Malta et de\u010bi\u017ca millPrim''Awla
  tal-Qorti \u010aivili fit-30 ta'' \u0120unju, 2020);\\n35. Naturalment dan kollu
  jwassal lil wie\u0127ed ja\u0127seb jekk kinitx g\u0127a\u017cla tassew tajba u
  g\u0127aqlija tal-Privatisation Unit li ma jipprovdux il-jedd ta'' kontestazzjoni
  quddiem ilBord ta'' Revi\u017cjoni dwar Kuntratti Pubbli\u010bi u l-Qorti tal-Appell,
  li bil-li\u0121i jidde\u010biedu ilmenti dwar is-siwi tal-pro\u010bess tas-sej\u0127a
  fi \u017cminijiet imqassra. Dan qed jing\u0127ad g\u0127aliex l-esklu\u017cjoni
  tal-Bord ta'' Revi\u017cjoni dwar Kuntratti Pubbli\u010bi ma jfissirx li rri\u017cultat
  ma jistax ji\u0121i kkontestat, kif donnhom jag\u0127tu x''jifhmu w\u0127ud mill-intimati
  firrisposta tag\u0127hom, i\u017cda jfisser biss li r-ri\u017cultat jistax ji\u0121i
  mist\u0127arre\u0121 mill-Prim''Awla tal-Qorti \u010aivili u l-Qorti tal-Appell
  skont l-artikolu 469A tal-Kap 12 tal-Li\u0121ijiet ta'' Malta b\u0127ala kaw\u017ca
  ordinarja li tinbeda b''rikors ma\u0127luf, fejn sfortunatament min\u0127abba n-numru
  esa\u0121erat ta'' pro\u010beduri li jinstemg\u0127u mill-Prim''Awla tal-Qorti \u010aivili
  mhuwiex possibli g\u0127al dik il-qorti li tidde\u010biedi l-kontestazzjoni tar-ri\u017cultat
  tassej\u0127a f''qasir \u017cmien b\u0127all-Bord ta'' Revi\u017cjoni dwar Kuntratti
  Pubbli\u010bi u l-Qorti talAppell;\\n\\n36. Illi lil hemm minn dan kollu, ladarba
  r-rikorrenti se\u0127\u0127ilhom juru li g\u0127andhom azzjoni f''idejhom fil-forma
  ta'' kaw\u017ca ta\u0127t l-artikolu 469A tal-Kap 12 tal-Li\u0121ijiet ta'' Malta
  biex jikkontestaw ir-ri\u017cultat tas-sej\u0127a, dan g\u0127andu  jfisser li r-rikorrenti
  g\u0127andhom jedd o\u0121\u0121ettiv mad-daqqa t''g\u0127ajn biex iressqu talba
  g\u0127all-\u0127ru\u0121 talmandat ta'' inibizzjoni. Kif ing\u0127ad mill-Prim''Awla
  tal-Qorti \u010aivili fid-digriet Dragonara Gaming Ltd v. Il-Ministeru tal-Finanzi
  et tat-28 ta'' Novembru, 2014\\n\u00abTqis li l-li\u0121i nnifisha tag\u0127ti li
  Mandat ta'' inibizzjoni jista'' jintalab u jin\u0127are\u0121 fejn parti tkun g\u0127adha
  mqar sejra tag\u0127mel azzjoni quddiem qorti (Ara art. 876(1) tal-Kap 12), u dan
  tg\u0127oddu b\u0127ala jedd bi\u017c\u017cejjed biex issir talba g\u0127all-\u0127ru\u0121
  ta'' Mandat b\u0127al dak. Il-li\u0121i tag\u0127ti wkoll rimedju g\u0127al min
  jabbu\u017ca mill-\u0127ru\u0121 ta'' atti kawtelatorji (Art. 836(9) tal-Kap 12),
  imma ma \u010b\u010ba\u0127\u0127adx minn qabel li wie\u0127ed jinqeda minnhom b''qies
  u f''\u0127arsien tal-jedd tieg\u0127u.\u00bb\\n37. Imiss issa li naraw t-tieni
  element, viz. jekk il-mandat ta'' inibizzjoni huwiex me\u0127tie\u0121 biex jit\u0127ares
  il-jedd tar-rikorrenti li jikkontestaw ir-ri\u017cultat tas-sej\u0127a;\\n38. L-element
  tal-\u0127tie\u0121a li jrid jintwera f''talba g\u0127all-\u0127ru\u0121 ta'' mandat
  ta'' inibizzjoni, ji\u0121i nieqes jekk kemm-il darba l-g\u0127emil li jrid jitwaqqaf
  jista'' ji\u0121i m\u0127assar b''sentenza \u0121udizzjarja, wara li jkun \u0121ie
  mist\u0127arre\u0121 il-mertu (ara inter alia Avukat Victor Bor\u0121 Grech v. Joseph
  Gasan et noe, Prim''Awla tal-Qorti \u010aivili tat-2 ta'' Jannar, 1993 u Airmode
  Limited v. Malta International Airport p.l.c. et, Prim''Awla talQorti \u010aivili
  tat-30 ta'' Jannar 2017);\\n39. Tassew, it-tiftix li trid tag\u0127mel il-qorti
  dwar dan it-tieni element huwa dak jekk, blg\u0127emil li minnu qieg\u0127ed jib\u017ca''
  r-rikorrent, jistax jintilef darba g\u0127al dejjem dak iljedd li l-istess rikorrent
  jidher li g\u0127andu fil-waqt li \u0127are\u0121 it-talba g\u0127all-\u0127ru\u0121
  talmandat (ara Alexander D''Agata et v. Emanuel Mallia et tal-Prim''Awla tal-Qorti
  \u010aivili tal-21 ta'' Di\u010bembru, 2009);\\n40. Hekk pere\u017cempju jonqos
  l-element tal-\u0127tie\u0121a tal-\u0127ru\u0121 tal-mandat, jekk ix-xkiel, fastidju
  jew molestja allegatament im\u0121arrba jistg\u0127u jitne\u0127\u0127ew b''sentenza
  favorevoli mill-qorti biex kollox imur lura g\u0127al li kien (ara Avukat John Buttigieg
  et v. Anthony Tabone et de\u010bi\u017c mill-Prim''Awla tal-Qorti \u010aivili fid-9
  ta'' Marzu\\n\\n10\\n\\n2007) jew jekk l-g\u0127emil li jrid iwaqqaf ir-rikorrent
  jista'' jing\u0127ata rimedju dwaru, b''kumpens fi flus (ara Silver King Limited
  v. Il-Kummissarju tal-Pulizija et de\u010bi\u017c mill-Prim''Awla tal-Qorti \u010aivili
  fit-22 t''Awwissu 2013);\\n41. Illi fil-ka\u017c tag\u0127na, jekk ir-rikorrenti
  jemmnu li huma g\u0127andhom skont il-li\u0121i, xi azzjoni ta'' st\u0127arri\u0121
  \u0121udizzjarju biex iwaqqg\u0127u r-ri\u017cultat tal-pro\u010bess tal-g\u0127a\u017cla,
  allura l-istess rikorrenti m''g\u0127andhomx b\u017conn il-\u0127ru\u0121 ta'' mandat
  ta'' inibizzjoni. Dan g\u0127aliex dik l-azzjoni \u0121udizzjarja tista'' tag\u0127tihom
  ir-rimedju li jer\u0121g\u0127u j\u0121ibu lura laffarijiet g\u0127al li kienu;\\n42.
  Fil-qasam tad-Dritt Amministrattiv huwa mg\u0127allem li, \u00abby quashing the
  court declares that some purported decision or determination is irregular or futile
  and therefore of no effect in law. The result is to establish that no one need take
  heed of it. The question at issue has not been lawfully determined, and the responsible
  authority must start again and determine it properly. The difference from a declaratory
  judgment is that quashing positively invalidates the offending decision or act,
  whereas a declaration of invalidity merely leaves it exposed to other remedies if
  required\u00bb (HWR Wade & CF Forsyth Administrative Law (9th Edit), pa\u0121. 611);\\n43.
  Ji\u0121i b''hekk, li jekk kemm-il darba xi g\u0127emil amministrattiv jit\u0127assar
  minn qorti f''azzjoni ta'' st\u0127arri\u0121 \u0121udizzjarju, dak l-g\u0127emil
  ji\u0121i daqs li kieku ma kien sar qatt u jista'' jsir mill-\u0121did b''mod legali
  u kif imiss (ara David Gatt v. Onor. Prim Ministru Dr. Lawrence Gonzi et de\u010bi\u017ca
  mill-Prim''Awla tal-Qorti \u010aivili fl-20 ta'' Ottubru, 2016);\\n44. Jg\u0127odd
  \u0127afna hawnhekk dak imtenni mill-Prim''Awla tal-Qorti \u010aivili fid-digriet
  Dragonara Gaming Ltd v. Il-Ministeru tal-Finanzi et tat-28 ta'' Novembru, 2014,
  li kellu \u010birkostanzi li jixxieb\u0127u \u0127afna mal-ka\u017c tal-lum, fejn
  ing\u0127ad hekk:\\n\\n\u00abjekk jo\u0127ro\u0121 tabil\u0127aqq li n-nuqqasijiet
  li Dragonara tilminta minnhom fil-pro\u010bess tal-g\u0127a\u017cla tassew tebbg\u0127u
  dak il-pro\u010bess, ir-rimedju li jista'' jing\u0127ata huwa t-t\u0127assir ta''
  kulma jkun sar. G\u0127alhekk ma\\n\\n11\\n\\nhuwiex me\u0127tie\u0121 li biex dak
  ir-rimedju jinkiseb, irid ikun in\u0127are\u0121 ilMandat. Dan jg\u0127odd ukoll
  g\u0127al min iqis li n-nuqqas ta'' \u0127ru\u0121 talMandat ikun tah xi assoluzzjoni
  \u0121enerali li jista'' jag\u0127mel li jog\u0127\u0121bu jew li dak li sar sa
  issa ma jistax ikun mist\u0127arre\u0121 mill-\u0121did fis-sedi u fi pro\u010bediment
  xieraq.\u00bb\\n\\n45. Sfortunatament dan kollu jista'' j\u0127alli dell ikrah fuq
  ir-ri\u017cultat tas-sej\u0127a. Dan g\u0127aliex jekk ir-rikorrenti jidde\u010biedu
  li jift\u0127u kaw\u017ca ta\u0127t l-artikolu 469A tal-Kap 12 talLi\u0121ijiet
  ta'' Malta, ir-ri\u017cultat tas-sej\u0127a \u0127a jibqa'' mdendel sakemm tinqata''
  l-kaw\u017ca, bir-riskju mi\u017cjud li dan ir-ri\u017cultat jista'' wkoll jispi\u010b\u010ba
  m\u0127assar jekk jirri\u017culta li kien hemm irregolarit\u00e0. Minbarra dan,
  kull kuntratt ta'' kon\u010bessjoni u kull li\u010benzja tallog\u0127ob li ting\u0127ata
  fuq il-ba\u017ci ta'' dan ir-ri\u017cultat ji\u0121u li jit\u0127assru wkoll fuq
  is-sa\u0127\u0127a talprin\u010bipju quod nullum est nullum producit effectum;\\n46.
  Dan kollu per\u00f2 ma jbiddilx il-fatt li teknikament l-mandat ta'' inibizzjoni
  mhux me\u0127tie\u0121 biex ir-rikorrenti j\u0127arsu l-jedd tag\u0127hom li jikkontestaw
  u j\u0127assru r-ri\u017cultat tal-pro\u010bess tas-sej\u0127a. Tali jedd jista''
  jinkiseb f''ka\u017c ta'' e\u017citu po\u017cittiv f''kaw\u017ca mibdija ta\u0127t
  l-artikolu 469A tal-Kap 12 tal-Li\u0121ijiet ta'' Malta;\\n47. F''dawn i\u010b-\u010birkostanzi
  g\u0127alhekk it-tieni element me\u0127tie\u0121 biex jin\u0127are\u0121 il-mandat
  ta'' inibizzjoni huwa nieqes, b''dana g\u0127alhekk li t-talba tar-rikorrenti biex
  jin\u0127are\u0121 ilmandat ma tistax tintlaqa'';\\n48. Il-qorti tista'' tieqaf
  hawn imma t\u0127oss li jkun a\u0127jar ukoll li hija tg\u0127id kelmtejn dwar it-tielet
  element, dak li jolqot l-aspett tal-proporzjonalit\u00e0, ji\u0121ifieri min kien
  \u0127a jbati l-iktar bejn ir-rikorrenti u l-Gvern jekk jin\u0127are\u0121 jew ma
  jin\u0127ari\u0121x il-mandat;\\n49. Qabel xejn, f''dan l-aspett, il-qorti ma tridx
  tqis il-pre\u0121udizzju li tista'' tbati National Lottery plc g\u0127aliex skont
  l-artikolu 873(3) tal-Kap 12 tal-Li\u0121ijiet ta'' Malta, ittqabbil li jrid isir
  huwa bejn ir-rikorrenti u l-Gvern biss. Il-pre\u0121udizzju finanzjarju g\u0127alhekk
  li tista'' tbati National Lottery plc jekk jintlaqa'' l-mandat ta'' inibizzjoni
  huwa superfluwu g\u0127all-g\u0127anijiet ta'' dan it-tielet element;\\n\\n12\\n\\n50.
  Dwar dan l-aspett tal-proporzjonalit\u00e0, il-qorti ma t\u0127ossx li l-Gvern kien
  \u0127a jo\u0127ro\u0121 laktar minn ta\u0127t li kieku ntlaqg\u0127et it-talba
  g\u0127all-\u0127ru\u0121 tal-mandat. Fil-fehma tal-qorti, it-tmexxija trasparenti,
  \u0121enwina u korretta ta'' sej\u0127a pubblika g\u0127andha valur aktar importanti
  mill-flus. Fi kliem ie\u0127or, kif tifhimha din il-qorti, lil hemm minn kull valur
  finanzjarju jew ekonomiku li jista'' jkun hemm involut, huwa aktar fl-interess talGvern
  li jkollu ser\u0127an tal-mo\u0127\u0127 li kon\u010bessjoni pubblika tkun ing\u0127atat
  kif suppost, milli li l-Gvern jid\u0127ol f''kuntratt ta'' kon\u010bessjoni pubblika
  li tkun imtappna bid-dellijiet tal-irregolarit\u00e0, u li dwarhom ma tkun ing\u0127atat
  l-ebda de\u010bi\u017cjoni minn awtorit\u00e0 \u0121udizzjarja;\\n51. Hekk ukoll
  mhijiex ra\u0121uni fejjieda dik mog\u0127tija mill-Awtorit\u00e0 Maltija Dwar ilLog\u0127ob
  li huwa a\u0127jar li ma jintlaqax il-mandat g\u0127aliex inkella jkun hemm log\u0127ob
  klandestin. Jekk ikunx hemm log\u0127ob klandestin ma jiddependix fuq jekk jintlaqax
  jew le dan il-mandat, i\u017cda jiddependi fuq il-kwantit\u00e0, fuq il-kwalit\u00e0
  u fuq il-\u0127e\u0121\u0121a tal-uffi\u010bjali tal-infurzar responsabbli li jra\u017c\u017cnu
  u jinvestigaw il-log\u0127ob tal-a\u017c\u017card illegali u klandestin;\\n52. B''daqshekk
  il-qorti mhijiex qieg\u0127da tg\u0127id li s-sej\u0127a f''dan il-ka\u017c tmexxiet
  irregolarment. Din hija xi \u0127a\u0121a li trid ti\u0121i de\u010bi\u017ca f''ka\u017c
  li tinfeta\u0127 kaw\u017ca ta'' st\u0127arri\u0121 \u0121udizzjarju u fil-fatt
  din il-qorti qag\u0127det b''seba'' g\u0127ajnejn milli tid\u0127ol fiha. Li qed
  tg\u0127id il-qorti huwa biss, illi li kieku ma sabitx li kien hemm nieqes it-tieni
  element tal-mandat dwar il-\u0127tie\u0121a tieg\u0127u, hija ma kinitx \u0127a
  ta\u010b\u010betta l-argument ta'' w\u0127ud mill-intimati li l-mi\u017cien tal-proporzjonalit\u00e0
  kellu jxaqleb aktar favur i\u010b-\u010ba\u0127da milli favur l-ilqug\u0127 tal-mandat
  ta'' inibizzjoni min\u0127abba l-aspett finanzjarju involut jew min\u0127abba l-bi\u017ca''
  li jfaqqas il-log\u0127ob tal-a\u017c\u017card klandestin;\\n53. B''danakollu, din
  il-qorti sabet li f''dan il-ka\u017c il-mandat ta'' inibizzjoni mhux me\u0127tie\u0121
  biex jit\u0127arsu l-jeddijiet ta'' kontestazzjoni li g\u0127andhom ir-rikorrenti
  kontra r-ri\u017cultat tas-sej\u0127a. G\u0127alhekk ming\u0127ajr mal-qorti ma
  qieg\u0127da b''xi mod tippronunzja ru\u0127ha favur jew kontra l-allegazzjonijiet
  tar-rikorrenti dwar ir-ri\u017cultat tal-pro\u010bess talg\u0127a\u017cla, hija
  qieg\u0127da ti\u010b\u0127ad it-talba tar-rikorrenti g\u0127all-\u0127ru\u0121
  tal-mandat ta'' inibizzjoni;\\n\\n13\\n\\n54.\\n\\nIl-qorti ttemm dan id-digriet
  billi tg\u0127id li ladarba li dawn il-pro\u010beduri tal-mandat tal- inibizzjoni
  u kull azzjoni futura ta\u2019 st\u0127arri\u0121 \u0121udizzjarju setg\u0127u ji\u0121u
  evitati li kieku l-\\n\\nPrivatisation Unit g\u0127a\u017clet li tasso\u0121\u0121etta
  din is-sej\u0127a g\u0127all-\u0121urisdizzjoni tal-Bord ta\u2019\\n\\nRevi\u017cjoni
  dwar Kuntratti Pubbli\u010bi skont ir- regola 87(e)\\n\\ntar-Regolamenti dwar l-\\n\\nAkkwist
  Pubbliku (Le\u0121islazzjoni Sussidjarja 601.03) , jin\u0127ass xieraq li l-ispejje\u017c\\n\\nkollha
  marbuta ma'' dawn il-pro\u010beduri tal-mandat jit\u0127allsu mill-imsemmija\\n\\nPrivatisation
  Unit;\\n\\nDe\u010bi\u017cjoni\\n\\nG\u0127aldaqstant g\u0127ar-ra\u0121unijiet
  fuq imsemmija, din il-qorti qieg\u0127da tipprovdi dwar ir-rikors tat-3 ta\u2019
  Di\u010bembru, 2021 billi\\n\\nti\u010b\u0127ad it-talba tar-rikorrenti g\u0127all-\u0127ru\u0121
  tal-mandat ta\u2019\\n\\ninibizzjoni;\\n\\nTordna li l-ispejje\u017c marbuta ma\u2019
  dawn il-pro\u010beduri jit\u0127allsu kollha kemm huma minn Dr.\\n\\nEmanuel Camilleri
  b\u0127ala\\n\\nChairperson tal-\\n\\nPrivatisation Unit.\\n\\n_____________________\\n\\nChristian
  Falzon Scerri\\n\\nIm\u0127allef\\n\\n_____________________\\n\\nMary Josephine
  Musu Deputat Re\u0121istratur\\n\\n14\"", "\"QORTI TAL-MA\u0120ISTRATI (MALTA) B\u0126ALA
  QORTI TA'' \u0120UDIKATURA KRIMINALI\\n\\nMA\u0120ISTRAT DR. SIMONE GRECH LL.D.\\n\\nDistrett
  Qormi\\n\\nIl-Pulizija vs\\n\\nPaul Borg\\n\\nIllum, 18 ta'' Frar, 2022.\\n\\nIl-Qorti;\\n\\nRat
  l-imputazzjonijiet ma\u0127ru\u0121a fil-konfront ta'' Paul Borg bil-karta tal-identit\u00e0
  tieg\u0127u 465160M, li permezz tag\u0127hom \u0121ie akku\u017cat talli fl-14 ta''
  Ottubru 2019, g\u0127al \u0127abta ta'' 17.30 hrs, fuq il-bejt tar-residenza, 17,
  Sebastianus, Triq Sag\u0127tar, Qormi:\\n\\n1) Volontarjament kiser il-bon ordni
  u l-pa\u010bi pubblika b''g\u0127ajjat u \u0121lied;\\n2) Ming\u0127ajr ma darab
  jew sawwat, hedded lil Raymond Cassar u Sarah Cassar;\\n3) Insulenta, hedded jew
  in\u0121urja bi kliem jew b'' xi mod ie\u0127or lil Raymond u Sarah Cassar;\\n4)
  U aktar talli volontarjament, \u0127assar jew g\u0127amel \u0127sara jew g\u0127arraq
  \u0127wejje\u0121 \u0127addiehor.\\n\\nIl-Qorti \u0121iet mitluba li f''ka\u017c
  ta'' \u0127tija, tapplika l-Artikolu 383 tal-Kap 9 tal-Li\u0121ijiet ta'' Malta.\\n\\n1\\n\\nRat
  id-dokumenti e\u017cebiti;\\n\\nSemg\u0127et il-provi;\\n\\nSemg\u0127et ammissjoni
  dwar it-tieni u t-tielet imputazzjonijiet, liema ammissjoni \u0121iet ikkonfermata
  mill-imputat, wara li ng\u0127ata \u017cmien biex jirrikonsidra;\\n\\nSemg\u0127et
  trattazzjoni;\\n\\nRat li din il-kaw\u017ca \u0121iet differita g\u0127as-sentenza.\\n\\nIkkunsidrat;\\n\\nProvi
  Prodotti\\n\\nCatherine Cassar spjegat li l-in\u010bident sar fl-14 ta'' Ottubru
  2019, g\u0127al \u0127abta tal\u0127amsa u nofs, f''Evergreen, Triq is-Sag\u0127tar,
  Qormi.  Spjegat li Paul Borg huwa l-\u0121ar tag\u0127hom u joqg\u0127od f''Sebastian,
  Triq is-Sag\u0127tar, Qormi.  Spjegat li hija kienet isfel u tisma'' l-g\u0127ajjat.  Qalet
  li bintha la\u0127qet telg\u0127et fil-washroom tal-bejt tag\u0127hom qabilha. Sostniet
  li Paul Borg beda jkellem lil bintha b''mod \u0127a\u017cin.  Sostniet li Paul Borg
  kisser \u0127\u0121ie\u0121a, u hija \u0127ar\u0121et tkellmu bl-edukazzjoni kollha,
  fejn talbitu jin\u017cel isfel.  Sostniet li bintha kienet qalet lil Paul Borg,
  biex joqg\u0127od attent kif ikellem lil missierha. Xehdet li  lil \u017cewgha,
  ma qaltlu xejn.  Sostniet li hi u bintha kienu \u0121ol-kamra ta'' fuq il-bejt,
  u r-ra\u0121el tag\u0127ha kien fuq il-bejt.  Paul Borg kien qieg\u0127ed fuq dik
  il-bi\u010b\u010ba li kien bena.  Ikkonfermat li bintha qatt ma marret fuq in-na\u0127a
  l-o\u0127ra.\\n\\nIkkonfermat li Paul Borg kellu sikkina f''idejh.  Ratu jkisser
  il-\u0127\u0121ie\u0121a bil-gun tassilicone li kellu f''idejh.  Sostniet li Borg
  ried jag\u0127ti lil \u017cewgha bis-sikkina.  Sostniet li Borg hedded lil \u017cewgha
  li kien ser joqtlu b''dik is-sikkina, filwaqt li beda jxejjer issikkina lejn \u017cewgha.  Ikkonfermat
  li kien hemm pre\u017centi wkoll, mart Paul Borg.\\n\\nIn kontroe\u017cami, hija
  sostniet li hija qalet lil Paul Borg biex jin\u017cel ''l isfel, i\u017cda ma qalitx
  hekk lil \u017cewgha wkoll.  Sostniet li g\u0127amlet hekk g\u0127ax kien Borg li
  kellu l-armi f''idejh.  \u010aa\u0127det li bintha g\u0127ajjret lil Borg mi\u0121nun.  Sostniet
  li bintha kienet be\u017cg\u0127ana u titrieg\u0127ed min\u0127abba dak li kien
  qed jigri.  Spjegat li s-sikkina kienet ippuntata. Ikkonfermat li Borg kien qed
  jag\u0127mel xi xog\u0127olijiet li kellhom b\u017conn is-sealer.\\n\\nRaymond Cassar
  xehed li Paul Borg huwa \u0121ar tieg\u0127u, u meta se\u0127\u0127 l-in\u010bident,
  Borg kien qieg\u0127ed jag\u0127mel xi xog\u0127ol fuq il-proprjet\u00e0 tieg\u0127u,
  u huwa dehrlu li kellu jmur ikellmu, biex i\u0127allasu ta'' dik il-bi\u010b\u010ba
  li qieg\u0127ed ju\u017ca mill-proprjet\u00e0 tieg\u0127u b\u0127ala appo\u0121\u0121.  Sostna
  li Borg saqqaf bi\u010b\u010ba fuq il-bejt tad-dar tieg\u0127u.  Sostna li huwa
  mar ikellmu minn fuq il-bejt tieg\u0127u bil-kelma t-tajba, u Paul Borg qabad jirrabja
  u jkellmu \u0127a\u017cin.  Sostna li huwa, kull ma g\u0127amel kien, li qallu li
  ser jiltaqg\u0127u l-Qorti.  Huwa e\u017cebixxa sett ta'' ritratti.  Spjega li bintu
  kienet fil-bieb tal-bejt tag\u0127hom, u qatt ma \u010b\u010baqilqet minn hemmhekk.  Sostna
  li Paul Borg beda jg\u0127id \u0127afna kliem ha\u017cin lil bintu, u kisser ukoll
  il-\u0127\u0121ie\u0121a tal-bieb tal-washroom.\\n\\nSostna li x\u0127in Borg kissirlu
  l-\u0127\u0121ie\u0121a, huwa qabad il-mobile u beda jirrekordjah. Sostna li dak
  il-\u0127in, huwa qallu biex ikompli jkisser ''ja pur\u010binell'', u f''dak il-\u0127in,
  Borg mar \u0121ab sikkina f''idejh, filwaqt li ne\u0127\u0127a l-gun tas-silicone.  Sostna
  li martu wissiet lil Borg biex joqg\u0127od attent, g\u0127ax hu kien qed je\u0127odlu
  l-video, i\u017cda Borg \u0121ab issikkina.  Sostna li meta ne\u0127\u0127a s-sikkina,
  mar i\u0121ib driller min-na\u0127a l-o\u0127ra tal-bejt biex iwaddbu lejh.  Sostna
  li Borg tella''  saqajh fuq i\u010b-\u010binta tal-bejt tieg\u0127u, biex jin\u017cel
  g\u0127alih, u qallu kemm-il darba li kien ser imiddu, fost theddid ie\u0127or.  Sostna
  li mbag\u0127ad, huwa da\u0127al ''il \u0121ewwa ma'' martu u bintu.\\n\\nIn kontroe\u017cami,
  huwa \u010bahad li tela'' fuq il-bejt biex jaqla'' \u0121lieda.  Spjega li huwa
  mar ikellem lil Borg fuq l-appo\u0121\u0121.  Sostna li Borg mar \u0121ab is-sikkina,
  g\u0127ax din kienet fuq i\u010b-\u010bint tan-na\u0127a l-o\u0127ra.  Spjega li
  dan mar g\u0127as-sikkina, wara li martu wissiet lil Borg, li huwa kien qed ji\u0121i
  ffilmjat.  Sostna li mbag\u0127ad, \u0121ab id-driller ukoll.  Spjega li mar \u0121ab
  is-sikkina biex ibe\u017c\u017cg\u0127u.  Spjega li Borg beda jxejjer is-sikkina.  Sostna
  li d-driller kien qed ja\u0127dem bih, i\u017cda dan mar g\u0127alih biex iwaddbu
  lejh.  \u010aa\u0127ad li bintu bdiet to\u0127ro\u0121 is-sebg\u0127a tan-nofs lil
  Borg.  \u010aa\u0127ad li bintu offendiet lil Borg.\\n\\nSarah Cassar e\u017cebiet
  pendrive bil-video tal-in\u010bident, li \u0121ie extracted mill-mobile ta'' missierha.,
  minnha stess.  F''seduta o\u0127ra, hija spjegat li fl-14 ta''Ottubru 2019, g\u0127al
  \u0127abta tal-\u0127amsa u nofs, kienet id-dar tag\u0127ha bl-indirizz, 13, Evergreen,
  Triq isSag\u0127tar, Qormi, meta semg\u0127et xi g\u0127ajjat bejn missierha u Paul
  Borg.  Qalet li semg\u0127et xi kliem ta'' thedid u ta'' insulti versu missierha,
  u g\u0127alhekk, telg\u0127et biex tara x''qed ji\u0121ri.  Sostniet li x\u0127in
  telg\u0127et fuq, hija indirizzat lil Paul Borg, u talbitu biex ikellem lil missierha
  b''mod sew.  Ikkonfermat li missierha kien fuq il-bejt taddar tag\u0127hom.  Paul
  Borg kien \u0121ol-proprjet\u00e0 tieg\u0127u.  Sostniet li Paul Borg offendiha.\\n\\nKompliet
  tg\u0127id li Paul Borg tela'' fuq i\u010b-\u010bint tad-dar tag\u0127hom, u bil-gun
  tas-sealer li kellu f''idejh, faqa'' l-\u0127\u0121ie\u0121a tal-bieb tal-washroom
  tag\u0127hom.\\n\\nKompliet tg\u0127id li mbag\u0127ad, missierha \u0127are\u0121
  lura fuq il-bejt, u hija baqg\u0127et fil-bieb tal-washroom.  Sostniet li beda jin\u0121ibed
  il-filmat, u fih jidher Paul Borg jhedded lil missierha b''sikkina u bi driller.  Sostniet
  li mbag\u0127ad, da\u0127lu ''l \u0121ewwa u \u010bemplu lil Pulizija.  Ikkonfermat
  li baqg\u0127et fil-kamra tal-bejt.  Sostniet li d-daqqa li ng\u0127atat minn Borg,
  kienet intenzjonata, u ma ng\u0127atatx bi \u017cball.  Sostniet li dan \u017camm
  b''id wa\u0127da ma'' \u0127adida biex ma jaqax, u bl-o\u0127ra kisser il-\u0127\u0121ie\u0121a.  Ikkonfermat
  li kien hemm rabja kbira da parti ta'' Borg.\\n\\nIn kontroe\u017cami, hija sostniet
  li telg\u0127et meta l-argument kien \u0121i\u00e0 beda.  \u010aa\u0127det li hija
  g\u0127ajret lil Paul Borg mi\u0121nun.  \u010aahdet li uriet is-seba'' tan-nofs
  lil Borg.  Sostniet li hija telg\u0127et fil-kamra ta'' fuq il-bejt biex tara x''
  kien qed jigri.  Sostniet li Borg hedded lil missierha b''sikkina u bi driller.
  Insistiet li hija dejjem fejn il-kamra tal-bejt baqg\u0127et.\\n\\nMargaret Borg
  spjegat li Paul Borg huwa \u017cewg\u0127a. Is-sinjuri Cassar huma girien u \u017cewg\u0127a
  kien qieg\u0127ed fuq it-terra\u017c\u017cin gol-proprjeta'' tag\u0127hom. Spjegat
  li semg\u0127et lil Raymond Cassar jg\u0127id xi kliem lil \u017cewg\u0127a u wara
  ftit, semg\u0127et lil bint Raymond Grech toffendi lil \u017cewg\u0127a filwaqt
  li turih is-seba'' tan-nofs.  Sostniet li bint Raymond, indirizzat lilha wkoll,
  u qaltilha li \u017cewg\u0127a ma kienx sew.  Sostniet li \u017cewg\u0127a kien
  qed ja\u0127dem bi driller, u kellu s-sealer gun.\\n\\nIn kontroe\u017cami, hija
  spjegat li telg\u0127et fuq il-bejt g\u0127ax kien hemm ir-ra\u0121el qieg\u0127ed
  ja\u0127dem.  Hija \u010ba\u0127det li ntqal xi diskors dwar xi appo\u0121\u0121.  Ikkonfermat
  li Sarah Cassar kienet fil-washroom tad-dar tal-\u0121enituri tag\u0127ha.  Sostniet
  li \u017cewgha offenda lil Sarah Cassar wara li hi bdiet toffendih.  \u010aa\u0127det
  li \u017cew\u0121ha kien hedded lil Raymond Cassar. Sostniet li s-sikkina kienet
  f''idejh g\u0127ax kien qed ju\u017caha waqt ix-xog\u0127olijiet, u g\u0127alhekk,
  waqt li kien qed jitkellem, \u017cew\u0121ha kien qed ixejjer is-sikkina.  Ikkonfermat
  li tkissret \u0127\u0121ie\u0121a, i\u017cda din ma \u0121ietx imkissra intenzjonalment.\\n\\nIn
  rie\u017cami, hija spjegat li Sarah Cassar kienet fuq il-bejt tad-dar tal-\u0121enituri
  tag\u0127ha, meta nsulentat lil \u017cew\u0121ha.\\n\\nPaul Borg xehed li dakinhar
  tal-in\u010bident, huwa kien fuq il-bejt jag\u0127mel xi xog\u0127olijiet, meta
  telg\u0127et tonxor fuq il-bejt, mart Raymond Cassar.  Spjega li mbag\u0127ad, tela''
  Raymond Cassar u beda jg\u0127idlu li t-tinda ser ti\u0121i g\u0127olja.  Spjega
  li huwa ma tax ka\u017cu.  Spjega li huwa g\u0127ajjar lil Cassar, u Cassar g\u0127ajjru
  wkoll.  Insista li Raymond Cassar tela'' fuq il-bejt b''intenzjoni, g\u0127aliex
  kien lest biex jie\u0127u filmat. Sostna li meta nda\u0127let Sarah Cassar, huwa
  kien irrispondiha li ma'' missierha kellu x''jaqsam, u mhux mag\u0127ha.  Sostna
  li din bdiet tg\u0127ajjru u toffendih, filwaqt li urietu s-seba'' tan-nofs.  Ikkonferma
  li s-sikkina li kellu kienet wa\u0127da tonda, biex taqta'' ssealer.  Huwa nsista
  li ma ta fastidju lil \u0127add.  Ikkonferma li huwa xejjer idejh, u laqat il-\u0127\u0121ie\u0121a.  Sostna
  i\u017cda, li huwa ma ridx ikissirha.  Sempli\u010biment laqat il-\u0127\u0121ie\u0121a
  b''idu.  Sostna li huwa ma jafx jekk kienx tela'' \u010b-\u010bint baxx li hemm.  Sostna
  li huwa laqat il-\u0127\u0121ie\u0121a bi \u017cball, u li din il-\u0127\u0121ie\u0121a
  kienet f''po\u017cizzjoni baxxa.\\n\\nIn kontroe\u017cami, huwa \u010ba\u0127ad
  li ta daqqa mal-\u0127\u0121ie\u0121a bl-intenzjoni li jkisser l-istess \u0127\u0121ie\u0121a.  Sostna
  li huwa kien qed itaqqab it-toqob bid-driller.  Sostna li huwa ma kellux intenzjoni
  li jwaddab id-driller.   Sostna li Sarah Cassar baqg\u0127et dejjem fuq ilbejt tal-proprjet\u00e0
  ta'' Cassar.\\n\\nIkkunsidrat;\\n\\nDwar l-ewwel imputazzjoni, g\u0127andu jing\u0127ad
  li din il-kontravenzjoni ta\u0127t l-Artikolu 338(dd) tal-Kapitolu 9 tal-Li\u0121ijiet
  ta'' Malta, hija dik li fil-Li\u0121i Ingli\u017ca hija ''a breach of public peace''.  Dan
  ifisser li persuni o\u0127ra, jkunu be\u017cg\u0127u g\u0127all-inkolumit\u00e0
  tag\u0127hom waqt l-in\u010bident.  Jirri\u017culta wkoll, li din il-kontravenzjoni
  tirri\u017culta jekk l-in\u010bident ikun se\u0127\u0127 fil-pubbliku u f''post
  pubbliku, u mhux f''proprjet\u00e0 privata (Vide Pulizija vs Rose Parnis, de\u010bi\u017ca
  fis-27 ta'' Jannar 2011, minn din il-Qorti, hekk kif diversament ippreseduta).\\n\\nIssir
  referenza g\u0127al dak li ntqal mill-Qorti tal-Appell, fil-kaw\u017ca fl-ismijiet,
  Il-Pulizija versus Maria Con\u010betta Green, de\u010bi\u017ca fid-19 ta'' Novembru
  1999; Volum LXXXIII.iv.441:\\n\\n\\\"L-artikolu 338(dd) tal-Kodici Kriminali jikkontempla
  r-reat komunement imsejja\u0127 breach of the peace''. L-elementi ta'' dan ir-reat
  gew ezaminati funditus f''diversi sentenzi u gie ritenut li, bhala regola, ikun
  hemm din ilkontravenzjoni meta jkun hemm ghemil volontarju li minnu nnifsu jew minhabba
  c-cirkostanzi li fihom dak l-ghamil isehh inissel imqar minimu ta'' nkwiet jew thassib
  f''mohh persuna (li ma tkunx l-akkuzat jew l-imputat)\\n\\ndwar l-inkolumita'' ta''
  persuna jew dwar l-inkolumita'' ta'' proprjeta'', kemm b''rizultat dirett ta'' dak
  l-ghamil jew minhabba l-possibilita'' ta'' reazzjoni ghal dak l-ghemil.\\n\\nL-iskambju
  ta'' kliem, anke jekk ingurjuz jew minaccjuz fih innifsu u minghajr ma jkun hemm
  xejn aktar x''jindika li dak l-argument jista'' jizviluppa fih, jew iwassal ghal,
  xi haga ohra u aktar serja (bhal glied blidejn jew hsara fil-propjeta'') ma jammontax
  ghall-breach of the peace fissens tal-artikolu 338(dd) tal-Kodici Kriminali.\\\"\\n\\nF''Il-Pulizija
  vs. Noel Tanti, de\u010bi\u017ca mill-Qorti tal-Appell fil-5 ta'' Mejju 2005, intqal:\\n\\nIlli
  kif gie ritenut minn din il-Qorti fl-Appell Kriminali : \\\"Il-Pulizija vs. Alfred
  Pisani\\\" [5.5.1995] irreat kontemplat fl-artikolu 338 (dd) tal-Kodici Kriminali
  javverra ruhu meta jkun hemm dak li fil- \\\"common law\\\" Ingliza kien jissejjah
  \\\"a breach of the peace.\\\" Bhala regola jkun hemm din ilkontravvenzjoni meta
  jkun hemm ghemil volontarju li minnu nnifsu jew minnhabba c-cirkostanzi li fihom
  dak l-ghemil isehh, inissel imqar minimu ta'' inkwiet jew thassib f''mohh persuna
  (li ma tkunx l-akkuzat jew l-imputat) dwar l-inkolumit\u00e0 fizika ta'' persuna
  jew dwar l-inkolumit\u00e0 ta'' proprjeta'' , kemm b'' rizultat dirett ta'' dak
  l-ghemil jew minnhabba l-possibilita'' ta'' reazzjoni ghal dak l-ghemil.\\n\\nFl-Appell
  Kriminali \\\"Il-Pulizija vs. Paul Busuttil\\\" [23.6.1994], imbag\u0127ad \u0121ie
  ritenut li din l-ekwiparazzjoni ta'' dan ir-reat mal-kun\u010bett Ingli\u017c ta''
  \\\"breach of the peace\\\", tirrisali g\u0127al \u017cmien Sir Adriano Dingli,
  li proprju f''kaw\u017ca de\u010bi\u017ca minnu fl-10 ta'' \u0120unju, 1890, fl-ismijiet:
  \\\"Ispettore Raffaele Calleja v. Paolo Bugeja et.\\\", kien qal hekk:-\\n\\n\\\"Che
  il buon ordine e la tranquillita'' pubblica sta nella sicurezza , o nella opinione
  ferma della sicurezza sociale , -- nel rispetto dei diritti e dei doveri sia degli
  individui in faccia all'' autorita'' pubblica , sia degli individui stessi fra loro,
  e ogni atto che toglie o diminuisce la opinione della sicurezza pubblica , o della
  sicurezza individuale , e'' violazione dell'' ordine pubblico , independentemente
  dalla perpetrazione di altro reato.\\\" (Kollez. Vol. XVII, p.47, 475).\\n\\nFl-istess
  sentenza ta'' Paul Busuttil, \u0121ew \u010bitati b''approvazzjoni McCall Smith
  u Sheldon, li fil-ktieb tag\u0127hom, \\\"Scots Criminal Law\\\" (Edin. Butterworths,
  1992), jg\u0127idu:-\\n\\n\\\"The essence of the offence is the causing of alarm
  in the minds of the lieges. This alarm has been variously defined by the Courts.
  In Ferguson v. Carnochan (1889) it was said not necessarily to be \\\"alarm in the
  sense of personal fear, but alarm lest if what is going on is allowed to continue
  it will lead to the breaking of the social peace\\\". Alarm may now be too strong
  a term: in Macmillan v. Normand (1989) the offence was committed when abusive language
  caused \\\"concern\\\" on the part of policemen at whom it was directed.\\\" (p.192)\\n\\nDik
  il-Qorti \u017ciedet tg\u0127id li:-\\n\\n\\\"Naturalment huwa kwazi impossibbli
  li wiehed jiddeciedi aprioristikament x'' jammonta jew x'' ma jammontax f'' kull
  kaz ghar-reat ta'' ksur volontarju tal-buon ordni u l-kwiet tal-pubbliku. Kif jghid
  awtur iehor Skocciz , Gerald H. Gordon , fit-test awtorevoli tieghu \\\"The Criminal
  Law of Scotland\\\" (Edinburgh, 1978):\\n\\n\\\"Whether or not any particular acts
  amount to such a disturbance is a question of fact depending on the circumstances
  of each case , and strictly speaking probably no case on breach of the peace can
  be regarded as an authority of general application.\\\" (p.985,para.41- 01)\u2026although
  it has been held not to be a breach of the peace merely to annoy someone such annoyance
  could amount to a criminal breach of the peace if the circumstances were such that
  it was calculated to lead actual disturbance .\\\" (p.986, para. 4104).\\n\\nIkkonsidrat;\\n\\nIssa
  li kieku kellu jirrizulta li fit-triq barra l-ghassa kien hemm xi diverbju \\\"a
  voce alta\\\" li seta'' gibed l-attenzjoni tan-nies jew li seta'' holoq certa apprensjoni
  fost dawk li kienu vicin, wiehed jifhem li setghet talvolta tirrizulta l-kontravvenzjoni
  in dizamina. Pero'' fl-istat tal-provi fejn kull ma hemm hija d-depozizzjoni ta''
  mart l-appellant kontradetta mic-cahda talistess appellant dwar jekk hu ghajjatx
  jew le meta kien qal il-kliem in kwistjoni, din il-Qorti thoss li din il-kontravvenzjoni
  ma gietx sufficjentement pruvata, fic-cirkostanzi partikolari ta'' dan il-kaz.\\\"\\n\\nFil-kawza,
  Il-Pulizija vs Pio Galea, mog\u0127tija mill-Qorti tal-Appell Kriminali, fis-17
  ta'' Ottubru 1997, de\u010bi\u017ca fis-17 ta'' Ottubru 1997, fejn intqal li biex
  jissussisti dan irreat:\\n\\n\\\"irid ikun hemm, bhala regola, ghemil voluntarju
  li minnu nnifsu jew minhabba c-cirkostanzi li fihom dak l-ghemil jsehh, jnissel
  imqar minimu ta'' inkwiet jew thassib f''mohh persuna (li ma tkunx l-akkuzat jew
  imputat) dwar l-inkolumita fizika ta'' persuna kemm b''rizultat dirett ta'' dak
  l-ghemil jew minhabba l-possibilita ta'' reazzjoni ghal dak l-ghemil.\\\"\\n\\nFid-dawl
  ta'' din il-\u0121urisprudenza, meta kkunsidrati fl-isfond tal-fatti li fihom se\u0127\u0127
  dan l-in\u010bident, din il-Qorti tqies li din l-ewwel imputazzjoni, ma \u0121itx
  ippruvata.  Dana peress li l-in\u010bident ma sarx fil-pubbliku, i\u017cda fil-proprjetajiet
  rispettivi ta'' Paul Borg u ta'' Raymond Cassar.\\n\\nDwar it-tieni u t-tielet imputazzjoni,
  dawn \u0121ew ammessi.\\n\\nDwar ir-raba'' imputazzjoni, kif sollevat mid-difi\u017ca,
  ji\u0121i sottolinjat li ma hemmx indikat, abba\u017ci ta'' liema subartikolu qed
  ji\u0121i akku\u017cat l-imputat. 8 Lanqas fis-smig\u0127 ta'' din il-kaw\u017ca,
  ma \u0121ew prodotti xi r\u010bevuti, jew ng\u0127atat xi xhieda dwar il-valur talo\u0121\u0121ett
  miksur.  In fatti, lanqas ma tirri\u017culta xi indikazzjoni tal-prova tal-valur
  tal\u0127sarat, li allegatament \u0121iet ikka\u0121unata.\\n\\nSkont is-sentenza
  fl-ismijiet, Pulizija vs Joseph Cutajar, de\u010bi\u017ca nhar it-23 ta'' Settembru
  2005, mill-Im\u0127allef Vincent Degaetano, il-Qorti tal-Appell irriteniet issegwenti:\\n\\n\\\"Meta
  qorti, bl-applikazzjoni tal-esperjenza ta'' kuljum tal-gudikant, tkun tista'' taghmel
  il-valutazzjoni taghha tal-ammont tal-hsara (jew tal-valur ta'' l-oggett misruq)
  fis-sens li tistabilixxi jekk ikunx inqabez jew le xi benchmark partikolari stabbilit
  mill-ligi (ez. jekk hux aktar minn ghaxar liri, aktar minn hamsin lira jew aktar
  minn hames mitt lira \u2013 Art. 325(1), Kap. 9), m''ghandux jitqabbad perit biex
  jaghmel stima ta'' l-oggett jew oggetti in kwistjoni proprju ghax tali valutazzjoni
  ma tkunx \\\"tinhtieg hila jew sengha specjali\\\" (Art. 650(1), Kap. 9): l-ispejjez
  ta'' tali perizja u ddewmien li din neccessarjament iggib ikunu inutili u ghalhekk
  ingustifikati.\\\" (Ara wkoll Pulizija vs Lorita Pace, de\u010bi\u017ca nhar is-7
  ta'' Di\u010bembru 2006, mill-Im\u0127allef Joe Galea Debono).\\n\\n\u0120ew identifikati
  tliet metodi kif il-\u0127sara tista ti\u0121i kkwantifikata, ai fini tal-prova
  talakku\u017ci., ta\u0127t l-Artikolu 325 tal-Kodi\u010bi Kriminal,i u \u010bio\u00e8
  billi (i) jew ti\u0121i apprezzata direttament mill-\u0121udikant, fis-sens li jekk
  il-\u0121udikant ikun jifhem bi\u017c\u017cejjed, jista'' jiddetermina huwa stess
  l-ammont tal-\u0127sara, billi je\u017camina l-o\u0121\u0121ett in kwistjoni; jew
  (ii) il-parti le\u017ca tg\u0127id kemm effettivament \u0127allset, biex issir it-tiswija
  ta'' jew fi lo\u0121\u0121ett; jew (iii) billi jitqabbad perit mill-Qorti biex jag\u0127ti
  l-fehma tieg\u0127u dwar lammont tal-\u0127sara.  Dawn il-metodi ji\u0121u utilizzati
  biss, meta ma jkunx hemm qbil bejn il-partijiet.\\n\\nF''dan il-ka\u017c, il-prova
  dwar il-valur hija kompletament nieqsa.  Per konsegwenza, din il-Qorti sejra tillibera
  lill-imputat mir-raba'' imputazzjoni.\\n\\nDecide\\n\\nG\u0127ar-ra\u0121unijiet
  hawn fuq premessi, din il-Qorti qed taqta'' u tidde\u010biedi din il-kaw\u017ca,
  billi tillibera lill-imputat mill-ewwel u r-raba'' imputazzjoni, filwaqt li fuq
  ammissjoni, u wara li rat l-Artikoli 339(1) (b) u 339(1)(e) talKap 9 tal-Li\u0121ijiet
  ta'' Malta, issib lill-imputat \u0127ati tat-tieni u tat-tielet imputazzjoni, u
  tikkundannah \u0127las ta'' ammenda ta'' \u0127amsin Ewro (\u20ac50).\\n\\nWara
  li rat l-Artikolu 383 tal-Kap 9 tal-Li\u0121ijiet ta'' Malta, qed torbot lill-\u0127ati
  li j\u017comm il-kwiet u l-bon ordni ma'' Raymond Cassar u Sarah Cassar, g\u0127al
  \u017cmien sena mil-lum, ta\u0127t penali ta'' elf Ewro (\u20ac1,000).\\n\\nMagistrat
  Dr. Simone Grech LL.D.\\n\\nJanet Calleja Deputat Re\u0121istratur\\n\\n9\"", "\"Qorti
  tal-Appell Kriminali\\n\\nOnor. Imhallef Dr. Antonio Mizzi LL.D., Mag. Juris (Eu
  Law)\\n\\nAppell Numru: 571/2013\\n\\nIl-Pulizija\\n\\n(Spettur Dennis Theuma)\\n\\nvs\\n\\nRoderick
  Castillo\\n\\niben Richard, imwieled San Giljan,  fl-4 ta'' Frar, 1980, detentur
  tal-karta ta'' l-identita'' numru 123180(M)\\n\\nIllum, 6 ta'' Novembru, 2018\\n\\nIl-Qorti,\\n\\nRat
  l-akkuzi dedotti kontra l-appellant Roderick Castillo quddiem il-Qorti tal-Magistrati
  (Malta) talli f''dawn il-Gzejjer fil-lejl ta'' bejn id-9 u l-10 ta'' Mejju, 2008,
  u matul it-tnax il-xahar ta'' qabel din id-data:\\n\\na) ittraffika, biegh, qassam
  jew offra li jittraffika, ibiegh jew iqassam medicina psikotropika u ristretta (ecstasy)
  minghajr awtorizzazzjoni specjali bil-miktub mis-Supretendent tas-Sahha Pubblika,
  bi ksur tad-disposizzjonijiet tal-Ordinanza dwar il-Professjoni Medika u lProfessjonijiet
  li ghandhom x''jaqsmu maghha, Kapitolu 31 tal-Ligijiet ta'' Malta u r-Regolamenti
  dwar il-Kontroll tal-Medicini (A.L. 22 ta'' l-1985) kif emendati;\\n\\nb) kellu
  fil-pussess tieghu medicina psikotropika u ristretta (ecstasy) minghajr awtorizazzjoni
  specjali bil-miktub mis-Supretendent tas-Sahha Pubblika, bi ksur tar-Regolament
  3 subinciz 1 tal-Avviz Legali 22 ta'' l-1985 kif sussegwentement emendat u l-artikoli
  40A u 120A u t-Tielet Skeda tal-Ordinanza dwar il-Professjoni Medika u l-Professjonijiet
  li ghandhom x''jaqsmu maghha, Kapitolu 31 tal-Ligijiet ta'' Malta u l-artikolu 16
  tal-Att V tal-1985 kif emendat.\\n\\nF''kaz ta'' htija, il-Qorti giet mitluba titratta
  mal-imputat talli huwa recidiv b''sentenza datata 15 ta'' Novembru, 2006 fejn gie
  immultat LM1000 mill-Magistrat Dr. A. Vella LL.D.\\n\\nRat is-sentenza tal-Qorti
  tal-Magistrati (Malta) tal-11 ta'' Dicembru, 2013 fejn il-Qorti wara li rat l-artikoli
  40A, 120A(1)(a), 120A(1B), 120A(2)(b)(i) u (ii) u t-Tielet Skeda tal-Kapitolu 31
  talLigijiet ta'' Malta, u r-regolamenti 3(1) tal-Avviz Legali 22 ta'' l-1985, u
  l-artikoli 49 u 50 talKapitolu 9 tal-Ligijiet ta'' Malta, sabet lill-imputat hati
  tal-imputazzjonijiet migjuba kontra tieghu, ikkundannatu ghal disa'' (9) xhur prigunerija
  effettiva, kif ukoll ikkundannatu ghal hlas ta'' multa ta'' elf u hames mitt Euro
  (\u20ac1,500.00), li bl-applikazzjoni tal-artikolu 14(2) tal-Kapitolu 9 tal-Ligijiet
  ta'' Malta tista'' tithallas b''rati mensili u konsekuttivi ta'' hamsin Euro (\u20ac50.00).
  Lewwel pagament ghandu jsir mhux akar tard minn xahar mid-data li fiha l-hati jiskonta
  l-piena karcerarcja li qed tigi b''din is-sentenza erogata, u ghal dan il-fini r-Registratur
  ghandu jivverifika mal-awtoritajiet karcerarji din id-data. Pero'' jekk il-hati
  jonqos li jhallas pagament wiehed, ilbilanc jigi dovut minnufih u jigi konvertit
  fi prigunerija bir-rata ta'' gurnata habs ghal kull hamsa u tletin Euro (\u20ac35.00)
  dovut.\\n\\nRat ir-rikors tal-appellant Roderick Castillo pprezentat fil-15 ta''
  Dicembru, 2013 fejn talab li din il-Qorti joghgobha thassar u tirrevoka s-sentenza
  appellata, fejn sabitu hati ta'' limputazzjonijiet kollha migjuba fil-konfronti
  tieghu, bl-addebitu tar-recidiva, u minflok tilliberah minn kull imputazzjoni, htija
  u piena.\\n\\nRat l-aggravji tal-appellant u cioe'':-\\n\\nJirrizulta car, illi
  l-Ewwel Qorti bbazat is-sejbien ta htija ta'' l-appellant, esklussivament fuq listqarrija
  rilaxxata minnu, fejn huwa ammetta illi l-pilloli li kellha fil-pussess taghha,
  il-girlfriend tieghu, Victoria Buhagiar, kien ghaddiehomla hu, propju biex iddahalhomlu
  l-party fejn kienu sejrin f''dik il-lejla. Filfatt jirrizulta car minn l-Atti tal-process,
  illi l-unika prova mressqa filkonfronti tieghu, in sostenn ta'' l-akkuzi migjuba
  kontrih, kienet propju din l-istqarrija illi huwa rrilaxxa lill-Pulizija waqt l-arrest
  tieghu. Fil-fatt, fis-sebgha u ghoxrin (27) ta'' Gunju tas-sena elfejn u hdax (2011),
  il-prosekuzzjoni kienet ivverbalizzat illi qed taqbel illi l-unika prova migjuba
  fil-konfront tar-rikorrenti, kienet biss l-istqarrija li huwa stess kien irilaxxa
  mal-pulizija.\\n\\nL-appellant jikkontendi, illi l-Ewwel Onorabbli Qorti ghamlet
  apprezzament zbaljat tal-provi prodotti meta bbazzat is-sejbien ta'' htija tieghu
  fuq l-unika prova migjuba kontrih, u cioe'' lisqarrija rilaxxata minnu minghajr
  assistenza legali, u dan qed jigi sottomess kemm in vista tas-sentenzi kostituzzjonali
  tal-Qrati taghna, kif ukoll dawk tal-Qorti Ewropeja ghad-Drittijiet tal-Bniedem,
  li jidher illi l-Ewwel Qorti skartat kompletament.\\n\\nFil-fatt, jekk wiehed jistudja
  bir-reqqa s-sentenzi tal-Qorti Ewropeja, jirrizulta c-car illi d-dritt ta'' smiegh
  xieraq, li huwa wiehed assolut, jinkludi d-dritt ta'' assistenza legali anke matul
  linvestigazzjoni, u allura anke qabel tigi rilaxxata l-istqarrija tieghu. Fi kliem
  iehor, skont linsenjament tal-Qorti Ewropeja, n-nuqqas ta'' assistenza legali qabel
  ir-rilaxx ta'' l-istqarrija, isarraf fi ksur tad-dritt assolut ta'' smiegh xierqa.\\n\\nF''dan
  l-istadju ma tistax ma ssirx referenza ghal-diversi kazijiet, decizi anke mill-Qorti
  Ewropeja ghad-drittijiet tal-Bniedem fejn in succinct, il-Qorti sahqet illi d-drittijiet
  sanciti permezz ta'' lartikoli 6 (3) (c) u 6 (1)  tal-Konvenzjoni, kif ukoll l-Artikolu
  39 tal-Kostituzzjoni, jinkludu ddritt ta''assistenza legali, sa mill- bidu nett
  ta'' l-investigazzjoni tal-pulizija, u cioe anke waqt illi l-persuna tirilaxxa l-istqarrija
  taghha, u li tali nuqqas ta'' jimporta ksur tad-dritt fundamentali ghal smiegh xieraq.\\n\\nSsir
  referenza ghal kazijiet ta'' Salduz vs Turkija, applikazzjoni numru 36391/02, fejn
  il-Grand Chamber tal-Qorti Ewropeja ghad-Drittijiet tal-Bniedem, filwaqt li, ghamlet
  referenza gharrapport ta''CPT European Committee for the Prevention of Torture and
  Inhuman or Degrading Treatment sahqet illi:\\n\\nall persons deprived of their liberty
  by the law enforcement agencies, including persons suspected of offences falling
  under the jurisdiction of State Security Courts, be granted as from the outset of
  their custody the right of access to a lawyer. The CPT recognizes that in order
  to protect the legitimate interests of the police investigation, it may exceptionally
  be necessary to delay for a certain period a detained person''s access to a lawyer
  of his choice; however, in such cases, access to another independent lawyer should
  be arranged.\\n\\nIl-Qorti stess sahqet ulterjorment  illi\\n\\n...Article 6 (3)
  (c), is not only restricted to assistance by a lawyer during trial in front of a
  Court of Law, but such right extends to legal assistance during the initial stage
  of police investigation...\\n\\nSsir referenza wkoll ghal-kawzijiet ohra decizi
  mill-Qorti Ewropeja u cioe, Plonka vs Polonja, u Panovits vs Cipru.\\n\\nIl-Qrati
  taghna wkoll jidher illi kienu qed qed isegwu dan il-principju, u f''kawzi fl-ismijiet
  ilPulizija vs Esron Pullicino u il-Pulizija vs Alvin Privitera u il-Pulizija vs
  Mark Lombardi, ilQorti wkoll sahqet illi n-nuqqas ta''assistenza legali matul il-perjodu
  ta''l-arrest u linvestigazzjoni, inkluz il- perjodu matul liema persuna investigata
  tirrilaxxja l- istqarrija taghha, iledu d-drittijiet fundamentali tieghu ghal smiegh
  xieraq, u dan bil-konsegwenza illi l-Qorti ma tistax tistreih fuq din l-isqarrija
  bhala prova sabiex fuqha tibbaza sejbien ta'' htija.\\n\\nFil-kawza fl-ismijiet
  il-Pulizja vs Esron Pullicino konfermata fl-Appell, u deciza mill-Qorti Kostiuzzjonali,
  permezz ta'' sentenza datata, tnax (12) ta'' April tas-sena elfejn u hdax (2011),
  il-\\n\\n4\\n\\nQorti kkonkludiet illi l-fatt wahdu li persuna ma tkunx assistita
  minn Avukat ma jwassalx ghalksur tad-drittijiet fundamentali tieghu u biex ikun
  hemm ksur ta'' l-artikolu 6 tal-konvenzjoni Ewropeja jrid jigi kkunsidrat il-process
  gudizzjarju kollu u mhux jigi kkunsidrati listqarrijiet ''in isolation''. Jekk fi
  tmiem il-gbir tal-provi l-unika prova kontra l-akkuzat tkun l-istqarrija tieghu
  allura l-Qorti trid tiddeciedi l-kaz, trid toqghod attenta ghax sejba ta'' htija
  jistghu jwasslu lill-Qorti tal-Appell biex tqis dik is-sentenza bhala ''unsafe''.\\n\\nGhalhekk,
  huwa car u manifest, skont dan l-insenjament illi d-dritt ta'' smiegh xierqa huwa
  wiehed assolut u li ghalhekk illi mhux safe li Qorti ssib htija BISS fuq stqarrija,
  rilaxxata bis ksur ta'' dan id-dritt.\\n\\nKonsegwentement, la darba anke fil-kaz
  ta'' l-appellant, l-unika prova migjuba kontra tieghu, kienet biss l-istqarrija
  li huwa rilaxxa bi ksur tad-dritt fundamentali tieghu ghal smiegh xieraq, allura
  huwa qatt ma kellu jinstab hati ta'' l-akkuzi migjuba kontrih.\\n\\nInoltre, jidher
  ukoll illi l-Ewwel Qorti, waslet ghad-decizjoni li taghti valur probatroju lillistqarrija
  rilaxxata minn l-appellant a bazi tal-fatt illi skont hi, l-appellant la kien persuna
  taht leta'', u anqas ma kien persuna li tista'' titqies vulnerabbli, u dan peress
  illi mill-fedina penali tieghu jirrizulta illi huwa kellu xi kundanni ohra, precedeneti
  ghal dan il-kaz.\\n\\nBir-rispett kollu, l-appellant ma jaqbel xejn ma dan ir-ragunament,
  u dan peress illi la darba gie determinat illi l-istqarrija tieghu giet rilaxxata
  minghajr assistenza legali, allura din tikostitwixxi ksur tad-dritt fundamentali
  assolut ghal smiegh xieraq.\\n\\nL-Ewwel Onorabbli Qorti, fil-konsiderazzjonijiet
  taghha, ghamlet referenza ampja ghas-sentenza tal-Qorti Kostituzzjonali fl-ismijiet
  ta'' Charles Steven Muscat vs Avukat Generali, deciza fittmienja (8) ta'' Ottubru
  tas-sena elfejn u tnax (2012). L-appellant umilment jissotometti illi huwa ma jaqbel
  xejn ma'' l-interpretazzjoni li l-Ewwel Onorabbli Qorti tat lil din is-sentenza.
  Fl-umli fehma ta'' l-appellant, dak illi sahqet il-Qorti Kostituzzjonali f''dan
  il-kaz hu illi persuna akkuzata ma ghandhiex tigi awtomatikament liberata, a bazi
  ta'' stqarrija rilaxxata minghajr assistenza legali, u li sabiex Qorti tasal ghal-decizjoni
  ta'' sejbien ta'' htija o meno, hija ghandha tikkonsidra\\n\\nl-isfond tal-provi
  kollha migjuba mill-prosekuzzjo ni\\n\\n. Fil-fatt f'' din l-istess sentenza, il-Qorti
  irribadiet illi\\n\\n''l-imhallef togat sejjer iwissi lill-gurati bil-perikolu illi
  joqghodu biss fuq l- istqarrija meta jiddeciedu dwar htija, BLA MA JQISU WKOLL IL-PROVI
  L-OHRA''\\n\\nF''dan il-kaz, jerga jigi ribadit illi ma jezistu ebda provi ohra
  kontra l-appellant. Konsegwentement, la darba l-prosekuzzjoni ma gabet ebda prova
  ohra fil-konfronti tieghu, allura mhux safe li Qorti toqghod BISS fuq l-istqarrija.
  Huwa x-xoghol tal-prosekuzzjoni illi tressaq ilprovi u certament mhux sewwa illi
  persuna jinstab hati ESKLUSSIVAMENT fuq dak li stqarr hu stess.\\n\\nSsir referenza
  wkoll ghas-sentenzi ricenti tal-Qorti Kriminali (Sede Inferjuri), fl-ismijiet IlPulizija
  vs Esron Pullicino u l-Pulizija vs Alvin Privitera, fejn il-Qorti ta'' l-Appell
  Kriminali, fizzewg okkazzjonijiiet diversament preseduta, ikkonfermat is-sentenzi
  tal-Prim Istanza, u cioe'' illi l-appellati ma setghux jinstabu hatja BISS a bazi
  ta'' l-isqarrija rilaxxata minnhom, minghajr assistenza legali, u dan fin-nuqqas
  ta'' provi ohra.\\n\\nRat l-atti kollha tal-kawza.\\n\\nSemghet it-trattazzjoni
  tal-partijiet.\\n\\nRat il-fedina penali aggornata tal-appellant ezebita mill-prosekuzjoni
  fuq ordni tal-Qorti.\\n\\nIkkunsidrat,\\n\\nIlli l-aggravju ewlieni tal-appellant
  hu li s-sejbien tal-htija tieghu hi bbazata fuq l-unika prova ezistenti u cioe''
  l-istqarrija rilaxxata minnu minghajr assistenza legali.\\n\\nIlli fil-verbal tas-seduta
  tas-27 ta'' Gunju, 2011 kien gie verbalizat quddiem il-Qorti tal-Magistrati li l-partijiet
  qablu li l-unika prova kontra l-imputat (illum, appellant) hija l-istqarrija li
  huwa rrilaxxa lill-ufficjal investigatur.  Ghalhekk, in vista ta'' din id-dikjarazzjoni
  l-kompitu ta'' din ilQorti hu pjuttost semplici.\\n\\nIlli l-appellant kien irilaxxa
  l-istqarrija tieghu fl-10 ta'' Mejju, 2008 meta ma kienx ghadu hemm id-dritt ta''
  l-assistenza legali.  Dan il-kuncett dahal in vigore fi Frar tas-sena 2010.\\n\\nIlli
  din il-Qorti ma ghandhiex ghalfejn tidhol aktar fil-fond fir-riformi li saru recentement
  f''dn il-qasam.  Hu bizzejjed li aghmel referenza ghas-sentenza tal-Qorti tal-Appell
  Kriminali fl-ismijiet: ''The Republic of Malta v. Chukwudi Samuel Onyeabor'' deciz
  fl-1 ta'' Dicembru, 2016.  F''dak il-kaz il-Qorti kkonfermat is-sentenza moghtija
  mill-Qorti Kriminali li ordnal l-isfilz ta'' l-istqarrija tal-akkuzat mill-atti
  ta'' guri.\\n\\nIlli a bazi ta'' din is-sentenza din il-Qorti mhiex qed taghti kaz
  ta'' l-istqarrija li l-appellant ghamel lill-ufficjal investigattiv.\\n\\nIlli ma
  hemm ebda prova ohra fl-atti ta'' dan il-kaz ghajr ghall-istqarrija.\\n\\nGhaldaqstant,
  ghal din ir-raguni din il-Qorti qed tilqa'' l-appell ta'' Roderick Castillo. Thassar
  u tirrevoka s-sentenza appellata u tehles lill-appellant minn kull htija u piena.\"",
  "\"263. Il-Prim Ministru l-Onor. Eddie Fenech Adami u l-Kap tal-Oppo\u017cizzjoni
  l-Onor. Alfred Sant jipproponu:\\n\\nIlli din il-Kamra,\\n\\nTfakkar li t-22 ta''
  Novembru 1995 ja\u0127bat il-\u0127amsin anniversarju minn mindu l-Onor Perit Dom
  Mintoff, membru ta'' din il-Kamra, sar membru parlamentari g\u0127all-ewwel darba;\\n\\nTinnota
  li l-Onor Perit Dom Mintoff, \u0127a l-\u0121urament tal-\u0127atra b\u0127ala membru
  parlamentari g\u0127allewwel darba fit-22 ta'' Novembru 1945 meta saret l-ewwel
  seduta tal-Kunsill tal-Gvern li kien iltaqa'' fis-Sala ta'' l-Arazzi, fil-Palazz,
  u minn dak inhar sal-lum baqa'' ji\u0121i elett f''kull le\u0121islatura;\\n\\nTinnota
  wkoll li matul dan i\u017c-\u017cmien kollu, l-Onor Perit Dom Mintoff ta l-kontribut
  tieg\u0127u g\u0127all\u0121id ta'' pajji\u017cna f''kull le\u0121islatura kemm
  b\u0127ala membru parlamentari, kif ukoll b\u0127ala Ministru, Kap tal-Oppo\u017cizzjoni
  u Prim Ministru, u bil-\u0127idma politika tieg\u0127u influwenza l-i\u017cviluppi
  politi\u010bi li se\u0127\u0127ew f''pajji\u017cna f''dawn l-a\u0127\u0127ar \u0127amsin
  sena;\\n\\nTirrisolvi li f''din l-okka\u017cjoni ta'' dan l-anniversarju, tifra\u0127
  u tirringrazzja lill-Onor Perit Dom Mintoff g\u0127all-kontribut siewi tieg\u0127u
  matul dawn is-snin kollha li fihom iddedika \u0127ajtu g\u0127allpolitika u g\u0127all-\u0121id
  nazzjonali, u filwaqt li tixtieqlu g\u0127omor twil u \u0127ieni, tawguralu li jkompli
  jkun ta'' servizz g\u0127al pajji\u017cna.\"", "\"QORTI  TA'' L-APPELL\\n\\nIMHALLFIN\\n\\nS.T.O.
  JOSEPH SAID PULLICINO, B.A.(HONS), LL.D. - PRESIDENT ONOR JOSEPH A. FILLETTI, B.A.,
  LL.D., A.R.Hist.S. ONOR FRANCO DEPASQUALE, LL.D.\\n\\nSeduta ta'' nhar il-Gimgha
  23 ta'' Frar, 2001\\n\\nNumru  40\\n\\nCit. Nru. 161/93 GV\\n\\nAntonia Bugeja u
  Charles Degabriele\\n\\nvs\\n\\nMaria Grima Baldacchino, Dr. Raymond Pace u l-Prokuratur
  Legali Mario Mifsud Bonnici nominati bhala Kuraturi deputati sabiex jirrapprezentaw
  lill-imsiefer Francis Grima bhala kap tal-komunjoni ta'' lakkwisti u amministratur
  tal-beni paragernali ta'' martu Maria Grima Baldacchino\\n\\nL-Att tac-Citazzjoni\\n\\nL-atturi
  pprocedew kontra l-konvenuti b''dan l-att tac-citazzjoni-\\n\\n\\\"L-atturi ppremettew
  illi l-esponenti ddepozitaw mal-konvenuta is-somma ta'' elf lira maltin (Lm1,000),
  sabiex l-istess konvenuta tkun tista'' zzid flejjes ohra ma'' l-istess flus u taghmel
  tajjeb ghal-liberta'' provizorja ta'' certu Joseph Zammit,\\n\\nsakemm il-kawza
  kriminali kontra l-istess Joseph Zammit tigi definittivament deciza;\\n\\nPremess
  illi l-kawza kriminali kontra l-istess Joseph Zammit giet definittivament deciza
  fis-sittax (16) ta'' Ottubru, 1992, u wara l-konvenuta irtirat mir-registru tal-Qorti
  d-depozitu li ghamlet;\\n\\nPremess illi ghalkemm interpellata sabiex tirrestitwixxi
  limsemmi depozitu ta'' elf liri maltin (Lm1,000) u dan anke permezz ta'' ittra ufficjali
  datata erbgha (4) ta'' Dicembru, 1992, il-konvenuta baqghet inadempjenti;\\n\\nL-atturi
  talbu li din l-Onorabbli Qorti:\\n\\n1. Tikkundanna lill-konvenuti jirrestitwixxu
  lill-atturi ssomma ta'' elf lira maltin (Lm1,000), somma ta'' flus depozitata maghhom
  ghar-raguni fuq imsemmija;\\n\\nBl-ispejjez inkluzi dawk ta'' l-ittra ufficjali
  li ggib id-data ta'' erbgha (4) ta'' Dicembru, 1992, u tal-Mandat ta'' Sekwestru
  numru 2080/1992 kif ukoll bl-imghax legali mis-sittax (16) ta'' Ottubru, 1992, sal-jum
  tal-pagament  effettiv kontra lkonvenuti\\\".\\n\\nEccezzjonijiet\\n\\nIl-kuraturi
  deputati nominati biex jirrapprezentaw lill-imsiefer Francis Grima bhala kap tal-komunjoni
  ta'' l-akkwisti, u amministratur tal-beni parafernali ta'' martu Maria Grima Baldacchino,
  hekk eccepew:-\\n\\n\\\"1. Illi t-talbiet attrici ghandhom jigu respinti bhala infondati
  fil-fatt u fid-dritt u di piu'' l-eccipjenti ghadhom mhux dedotti mill-fatti stante
  li ghadhom ma kkomunikawx ma'' Francis Grima;\\n2. Illi pero'' jinghad li l-eccipjenti
  kkomunikaw ma'' Maria Grima Baldacchino permezz ta'' ittra datata tnejn (2) ta''
  Frar, 1993, u din permezz ta'' telefonata informathom li Francis Grima huwa mejjet\\\".\\n\\nIl-konvenuta
  Maria Grima Baldacchino hekk eccepiet ghat-talbiet attrici:-\\n\\n\\\"Illi kwantu
  ghall-attrici Antonia Bugeja, t-talbiet attrici huma nfondati fil-fatt u fid-dritt
  stante li m''huwiex minnu li l-eccipjenti qatt kienet depozitarja ta'' xi  flus
  appartenenti lill-imsemmija attrici;\\n\\nIlli kwantu ghall-attur Charles Degabriele,
  t-talba tieghu hi ntempestiva u fi kwalsiasi kaz similment infondata fil-fatt u
  fiddritt stante li l-eccipjenti fl-ewwel lok lanqas  taf min hu u lanqas qatt ma
  kienet depozitarja ta'' xi flus tieghu;\\n\\nIlli sussidjarjament u bla pregudizzju,
  fi kwalunkwe kaz, leccipjenti m''ghandha qatt tbati l-ispejjez tal-kuraturi stante
  li lattrici Antonia Bugeja kienet taf li l-eccipjenti kienet separata u divorzjata
  minn Francis Grima u li dan ilu mejjet\\\".\\n\\nNoti\\n\\nGiet prezentata nota
  quddiem l-ewwel Qorti b''kopja tac-certifikat talmewt tal-konvenut Frank Grima,
  li ghalih, kif inghad, kienu qed jidhru kuraturi deputati.  Sussegwentement l-atturi,
  b''nota ohra quddiem lewwel Qorti, cedew il-pretensjonjiet taghhom limitatament
  ghallkonvenuti kuraturi deputati.  Bhala konsegwenza ta'' dawn in-noti, lazzjoni
  attrici giet limitata fil-konfront tal-konvenuta Maria Grima Baldacchino.  Konsegwentement
  it-talba attrici kellha tigi verifikata fiddawl ta'' l-eccezzjonijiet sollevati
  minn din il-konvenuta.\\n\\nDecide\\n\\nB''sentenza tat-3 ta'' Ottubru, 1996, il-Prim''Awla
  tal-Qorti Civili ddecidiet il-kawza billi kkundannat lill-konvenuta tirrestitwixxi
  lill-konvenuta Antonia Bugeja is-somma ta'' elf lira maltin, ghar-ragunjiet imsemmija
  fis-sentenza, bl-imghax u bl-ispejjez (hlief dawk tan-nomina tal-kuraturi) kontra
  l-konvenuta.\\n\\nMotivazzjoni tas-sentenza appellata\\n\\nL-ewwel Qorti hekk immotivat
  is-sentenza taghha.\\n\\n\\\"Illi mill-provi prodotti jirrizulta bla dubbju li elf
  lira (Lm1,000) minnhom hargithom l-attrici Antonia Bugeja. Dan huwa ammess anke
  mill-konvenuta.\\n\\nLi qed tghid il-konvenuta pero'' huwa li hi harget l-elf lira
  (Lm1,000) taghha bil-kondizzjoni li l-ircevuta tal-plegg tohrog fuq isimha biss,
  u li Joseph Zammit li kien qalilha li d-depozitu ta'' elfejn lira (Lm2,000) kien
  taghha kollu u setghet tirtirah.\\n\\nIlli m''hemmx dubbju li l-ircevuta ta'' elfejn
  lira (LM2,000) li gew depozitati l-Qorti bhala plegg, harget f''isem il-konvenuta
  (ara dok a fol 64);\\n\\nIl-konvenuta xehdet li kienet kellmet lil Zammit il-habs
  u dana kien qalilha li l-flus tal-plegg kienu taghha ghax l-ohrajn kienu covered
  b''deheb u karozzi.  Ghalhekk l-ghada fil-ghodu marret u gibdet ilplegg kollu.\\n\\nCharlie
  Baldacchino xehed li meta kienu ghamlu d-deposit hu ried li l-ircevuta tigi fuq
  ismu, izda l-konvenuta insistiet li ssir fuq isimha kif fil-fatt sar.  Hu kien fdaha
  ghax kien jinnegozja maghha.\\n\\nJoseph Zammit xehed li l-elf lira (Lm1,000) kienet
  hargithom ilkonvenuta u elf lira (Lm1,000) harighom Charlie Degabriele. Kemm Degabriele
  kif ukoll il-konvenuta  kkonfermawlu li kienu hargu elf lira (Lm1,000) kull wiehed.  Il-habs
  kien kellem lillkonvenuta fuq affarijiet personali u kien issemma anke l-plegg.  Ilkonvenuta
  riedet li tigbed il-pledge kollu hija, izda hu qalilha li kellhom jigbruhom it-tnejn
  ghax kienu hargu elf kull wiehed.\\n\\nIlli l-onus tal-prova qieghed fuq il-konvenuta
  li kien hemm xi qbil li hija kellha tigbed id-deposit tal-plegg kollu hi wahedha.
  F''cirkostanzi normali l-konvenuta kienet tkun intitolata li tigbed ilplegg kollu
  hija, billi l-ircevuta qeghda fuq isimha u l-Qorti kienet korretta li tirrilaxxa
  l-flus favuriha.  Izda mill-provi prodotti u anke mill-ammissjoni tal-konvenuta
  stess jirrizulta li elf lira (Lm1,000) minn dawk li gibdet ma kienux taghha.\\n\\nIt-tezi
  tal-konvenuta li kien hemm xi ftehim li l-plegg kien kollu taghha ma sabx riskontru,
  la fix-xhieda ta'' l-atturi u lanqas ta'' Joseph Zammit li suppost kien qalilha
  biex tigborhom kollha hija. Jekk kien hemm xi ftehim bejn Zammit u l-konvenuta dan
  ma kienx jorbot lill-atturi li ma kienux parti fih, izda lanqas dan ilftehim ma
  gie pruvat mill-konvenuta.  Ix-xhieda li quddiemhom suppost inghad certu diskors
  ma ftakru xejn.\\n\\nHawn wiehed jistaqsi jekk il-konvenuta fil-bidu nett kienet
  tant insistiet kif qed tghid hi, li ma kienetx ser tohrog sold jekk il-plegg ma
  jsirx kollu fuq isimha u jkun taghha, kif wara hasset il-bzonn li tmur tkellem lil
  Zammit biex tara x''ser taghmel bil-flus, jekk tohodhomx kollha hi jew taghti elf
  lira (Lm1,000) lill-atturi.\\n\\nGhalhekk il-Qorti tikkonkludi li l-konvenuta ma
  ppruvatx li kien hemm qbil li hija kellha tieghu l-elfejn lira (LM2,000) kollha
  hija.\\n\\nMin-naha l-ohra l-Qorti tikkonkludi li l-atturi ppruvaw li elf lira (Lm1,000)
  minn dawk li gew sbankati mill-konvenuta bic-cedola a fol 64 kienu ta'' l-attrici
  Antonia Bugeja u ghalhekk il-konvenuta ghandha tirrestitwixxi elf lira (Lm1,000)
  lill-attrici Antonia Bugeja\\\".\\n\\nKonsiderazzjonijiet ta'' din il-Qorti\\n\\nMinn
  din is-sentenza appellat il-konvenuta Maria Grima Baldacchino.  Lattur Charles Degabriele
  m''appellax u allura fil-konfront tieghu ssentenza appellata ghaddiet in gudikat.  L-appell
  tal-konvenuta fil-mertu jista'' jigi hekk identifikat.\\n\\n1. L-atturi appellati
  qed jibbazaw il-pretensjoni ghar-rifuzjoni talkapital fuq allegazzjoni ta'' depozitu
  ma'' l-appellanti.  Il-fatti juru li ma kien sar l-ebda depozitu ma'' l-appellanti
  imma li kien biss sar depozitu mal-Qorti bhala plegg ghal Joseph Zammit.  F''dawn
  ic-cirkostanzi ghalhekk, l-unika relazzjoni guridika li tohrog mid-depozitu  in
  kwistjoni, setghet tkun biss jew mad-depozitarju (f''dan il-kaz ir-Registratur talQorti)
  jew inkella mal-persuna li bbenefika minn tali depozitu (f''dan ilkaz Joseph Zammit).  L-appellanti
  ssostni li l-ewwel Qorti kienet marbuta li tikkonsidra t-talba ta'' l-atturi fid-dawl
  ta'' l-elementi li kienu jikkostitwixxu d-depozitu.  Qatt ma kien hemm dubju li
  originarjament lelf lira kienu ta'' l-attrici.  Il-kontestazjoni kienet biss fuq
  min ghandu jirrestitwihomlha.  L-appellanti tkompli jissottometti illi l-attrici
  kienet ben konxja li biex setghet taghmel id-depozitu bhala plegg a favur ta'' Joseph
  Zammit, l-appellanti kienet qed tinsisti li d-depozitu shih ta'' elfejn lira ikun
  kollu f''isimha, u dan peress illi hi kienet diga'' kreditrici ta'' dan Zammit f''somma
  ferm aktar minn l-elf lira in kwistjoni. Fis-sottomissjoni taghha, una volta l-attrici
  accettat li d-depozitu  l-Qorti jsir mill-appellanti wahedha, u f''isimha biss,
  kif fil-fatt sar, dan kien ifisser illi d-depozitu talplegg kollu setghet tiehdu
  hi, u cioe'' l-appellanti.  Kien jispetta lill-attrici appellata li tipprova li
  kien hemm ftehim kuntrarju.  Kienet zbaljata lewwel Qorti meta rriteniet li l-onus
  tal-prova kien qieghed fuq ilkonvenuta.\\n\\nDin il-Qorti ma taqbilx ma'' dan l-aggravju
  semplicement ghaliex ma jirrizultax sorrett mill-provi prodotti.  L-istess konvenuta
  qeghda taccetta, bhala fatt, illi elf lira mid-depozitu maghmul fir-Registru tal-Qorti
  favur Joseph Zammit biex dan ikun jista'' johrog bi plegg, kienu jappartjenu lillattrici
  Antonia Bugeja.  Ma tirrizulta assolutament l-ebda prova li din issomma kienet giet
  avanzata mill-appellata favur il-konvenuta appellanti. Tirrizulta, ghall-kuntrarju,
  l-prova li din is-somma nharget unikament flinteress ta'' dan Joseph Zammit.  Inharget
  bhala garanzija biex dan ikun jista'' jinghata l-helsien mill-arrest, u una volta
  sodisfatta u ezawrita tali garanzija, ma seta'' jkun hemm l-ebda dubbju li l-ammont  kellu
  jigi mhallas lura lil min ghamel garanti.  Garanti reali u mhux semplici presta
  nome.  Tirrizulta nfatti provata, u hi anzi ammessa mill-istess appellanti, ic-cirkostanza
  illi l-flus gew mghoddija lilha minn Antonia Bugeja bi struzzjonijiet specifici
  li jigu utilizzati ghall-fini ta'' hlas tal-plegg ta'' Joseph Zammit.  Ma jirrizulta
  mkien mill-atti li l-appellata kienet b''xi mod obbligata favur l-appellanti.  Kif
  lanqas ma  tirrizulta pruvata lkondizzjoni li l-appellata kienet qed tavanza l-flus
  lill-appellanti bilkondizzjoni li dawn il-flus kienu ser isiru taghha unikament
  bil-fatt illi lplegg kollu ta'' elfejn lira kien, ghall-konvenjenza,   ser jigi
  depozitat f''isimha.\\n\\nL-appellanti allura bl-ebda mod ma tavanza xi \\\"kawza\\\"
  li bis-sahha taghha seghet tinholoq relazzjoni gjuridika bejnha u bejn l-appellanti.
  Konsegwentement kieku kellu jigi accettat l-aggravju tal-appellanti, dan ikun ifisser
  illi l-appellanti tkun qeghda tircievi flus minghand l-appellata meta dawn ma kienu
  ghal ebda raguni fil-ligi dovuti lilha.  Zgur li ma jirrizulta l-ebda ftehim illi
  l-appellati kellhom ihallsu xi parti mid-dejn li Joseph Zammit seta'' kellu mal-appellanti.  Jekk
  kien jezisti ftehim simili bejn l-appellanti u l-istess Joseph Zammit dan kien ghall-appellata
  peress inter alias acta u bl-ebda mod ma jirrizulta li kien gie minnhom sottoskritt.\\n\\nDin
  il-Qorti allura taqbel ghal kollox mal-konkluzjoni li waslet ghaliha lewwel Qorti
  illi l-appellanti bhala depozitarja li kienet irceviet minghand l-appellata s-somma
  ta'' elf lira b''istruzzjonijiet biex tutilizzahom biss f''depozitu ghall-plegg
  ta'' Joseph Zammit,  kienet obbligata illi, appena tirtira l-istess plegg mill-Qorti,
  tirrifondi l-istess appellata dik il-parti middepozitu minnha maghmul.\\n\\nL-appellanti
  tappella wkoll sussidjarjament kontra dak li ddecidiet lewwel Qorti fir-rigward
  tal-kap tal-ispejjez.  Dana fuq zewg aggravji li lQorti ser tikkunsidra separatament.\\n\\n(a)
  L-ewwel aggravju hu illi una volta l-ewwel Qorti kkonkludiet li sid il-flus kienet
  l-attrici Antonia Bugeja u allura l-attur l-iehor, Charles Degabriele ma kellux
  locus standi fil-kawza,  kienet konsegwenzjali  ilkonkluzjoni illi l-ispejjez ta''
  dan l-attur ma setghu qatt jigu akkolati millappellant.  Dan l-aggravju huwa  teknikament
  korrett u ser jigi milqugh anke jekk materjalment ma tantx jidher li jista'' jaghmel
  differenza ghallfini tat-taxxa tal-kawza.\\n(b) It-tieni aggravju tal-appellant
  fir-rigward tal-kap tal-ispejjez hu illi, una volta kien jirrizulta car li l-atturi
  jkunu jafu bil-mewt ta'' Francis Grima sa minn qabel ipprezentaw il-kawza, u una
  volta l-istess atturi kienu filfatt cedew bla riserva l-pretensjonijiet taghhom
  kontra l-kuraturi ta'' Francis Grima fil-mori tal-kawza, l-ewwel Qorti ma setghet
  qatt takkolla lill-istess attur l-ispejjez biss tan-nomina tal-kuraturi izda kellha
  tilqa'' ttielet eccezzjoni tal-appellanti u takkolla lill-istess atturi bl-ispejjez
  kollha - u mhux biss tan-nomina \u2013 ta'' l-imsemmija kuraturi.  Anke dan laggravju
  jirrizulta korrett.  Infatti fl-ittra ufficjali tas-26 ta'' Jannar 1993, mibghuta
  mill-appellanti lill-appellata Antonia Bugeja, l-istess appellanti tikwalifika lilha
  nnifisha bhala \\\"armla minn Francis Grima\\\".  Din l-ittra ufficjali giet debitament
  notifikata lill-istess appellata fit-3 ta'' Frar 1993 u cioe'' f''data antecedenti
  ghall-prezentata tal-prezenti istanza quddiem lEwwel Qorti.  Dan ifisser illi Francis
  Grima gie malament imharrek millatturi billi dan kien diga'' miet u l-istess malament
  kienet saret it-talba\\n\\nghall-hatra ta'' kuraturi deputati biex jirraprezentaw
  lill-istess \\\"Francis Grima, (allura mejjet), imsiefer minn dawn il-Gzejjer\\\".  Minn
  naha l-ohra hi wkoll korretta s-sottomissjoni tal-appellanti li una volta l-atturi
  cedew latti fil-konfront tal-kuraturi deputati, bla ebda riserva, ma setghetx hi
  tigi akkolata bl-ispejjez taghha.  Dan l-aggravju qed jigi milqugh.\\n\\nGhal dawn
  il-motivi, l-Qorti tiddisponi mill-appell kif gej :-\\n\\n1. Tirriforma s-sentenza
  appellata billi tikkonfermaha in kwantu laqghet it-talba attrici kif dedotta fir-rigward
  tal-meritu u hlas tal-imghax.\\n2. Tirrevokaha in kwantu kkundannat lill-konvenuta
  appellanti thallas l-ispejjez kollha tal-kawza hlief dawk tan-nomina tal-kuraturi
  u minflok tirregola l-kap tal-ispejjez kif gej :-\\n(a) L-ispejjez tal-prima istanza
  kellhom jithallsu mill-konvenuta appellanti hlief ghal dawk tal-attur Charles Degabriele
  li kellu jbatihom hu stess u dawk tal-kuraturi deputati li kellhom ibatuhom l-atturi.\\n(b)
  Dawk ta'' dan l-appell kellhom jithallsu kwantu ghal terz millappellati u kwantu
  ghal zewg terzi mill-appellanti Maria Grima Baldacchino.  M''huma dovuti l-ebda
  spejjez f''din l-istanza fil-konfront\\n\\nApp.Civ. 161/93\\n\\ntal-kuraturi deputati
  billi l-atti fil-konfront taghhom gew ceduti quddiem lewwel Qorti.\\n\\nDep/Reg\\n\\nmm\"",
