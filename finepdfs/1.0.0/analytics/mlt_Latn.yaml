sample: '["\"QORTI CIVILI PRIM'' AWLA\\n\\nONOR. IMHALLEF LORRAINE SCHEMBRI ORLAND\\n\\nSeduta
  tat-30 ta'' April, 2013\\n\\nRikors Numru. 50/2007\\n\\nIl-Kummissarju tal-Artijiet\\n\\nvs\\n\\nRegistratur,
  Qrati Civili u Tribunali (Sezzjoni ta'' Gurisdizzjoni Volontarja) u b'' digriet
  tat-28 ta'' Frar 2007 l-Avukat Dr. Peter Borg Costanzi ssejjah filkawza.\\n\\nIl-Qorti,\\n\\nI.
  PRELIMINARI.\\n\\nRat ir-rikors tal-Kummissarju tal-Artijiet datat 15 ta'' Jannar
  2007 fejn espona:-\\n\\nIlli huwa gie notifikat b''ittra ufficjali (Dok. A) fejn,
  permezz taghha huwa gie interpellat biex ihallas is-somma ta'' Lm792.40, (seba''
  mija, tnejn u disghin liri Maltin u erbghin centezmu) oltre Lm17 rapprezentanti
  drittijiet u spejjez talimsemmija ittra ufficjali.\\n\\nIlli din is-somma ta'' Lm792.40
  tirrapprezenta \\\"drittijiet professjonali dovuta lill-Avukat, awtur tal-ittra
  ufficjali, kif intaxxati permezz ta'' zewg taxxi annessi mal-imsemmija ittra ufficjali
  u dawn jirrigwardjaw id-drittijiet lilu spettanti talli assista vendituri li saru
  fl-atti tan-Nutar Vincent Miceli fir-30 ta'' Mejju 2006 u fit-2 ta'' Gunju 2006;\\n\\nIlli
  z-zewg kuntratti imsemmija fl-ittra ufficjali gew ippubblikati wara decizjoni tal-Bord
  ta'' Arbitragg Dwar Artijiet Malta, wara proceduri fl-istess Bord, peress illi saret
  espropjazzjoni ta'' art, propjeta` tal-klijenti tal-avukat awtur tal-imsemmija ittra
  ufficjali, peress illi l-kumpens offert mill-esponenti kien gie kontestat ai termini
  taddispozzizzjonijiet tal-Kap 88 tal-Ligijiet ta'' Malta;\\n\\nIlli t-taxxa annessa
  mal-ittra ufficjali giet mahruga mirRegistratur tal-Qorti Civili (sezzjoni ta''
  Gurisdizzjoni Volontarja) ghall-\\\"..........Drittijiet professjonali dovuti lillAvukat
  Dottor...........ghall-prestazzjonijiet minnu resi filkonfront tal-Kummissarju tal-Artijiet..........\\\";\\n\\nIlli,
  bir-rispett kollhu, fil-kaz ta'' dawn iz-zewg kuntratti, ma kien hemm ebda relazzjoni
  bejn l-avukat imsemmi fittaxxa hawn fuq imsemmija u il-Kummissarju ta'' l-Artijiet;\\n\\nIlli
  l-avukat imsemmi fit-taxxa kien presenti waqt il-kuntratti fug talba tal-klijenti
  tieghu u ghalhekk it-taxxi fuq imsemmija kella tigi mahruga fil-konfront tal-klijenti
  tieghu u mhux fil konfront tal-Kummissarju tal-Artijiet;\\n\\nIlli ghalhekk isegwi
  illi l-prestazzjonijiet resi mill-istess avukat ma kienux fil-konfront tal-Kummissarju
  tal-Artijiet izda fil-konfront tal-istess klijenti tieghu peress illi huwa agixxa
  fuq talba tal-istess klijenti tieghu;\\n\\nIlli la l-Kap. 88 tal-Ligijiet ta'' Malta
  u lanqas id-decizjoni ta'' l-istess Bord fuq msemmi ma jikkontempla illi dawn it-tip
  ta'' drittijiet professjonali ghandu jigu ssoportati millesponenti;\\n\\nGhaldaqstant,
  I-esponenti qieghed jinterponi appell firrigward tat-taxxa kif mahruga u umiLment
  jitlob bir-rispett lil din l-Onorabbli Qorti sabiex din l-istess taxxa tigi emendata
  fis-sens illi tinhareg fil-konfront tal-klienti talAvukat illi talab il-hrug tal-istess
  taxxa, u mhux fil-konfront tal-esponenti.\\n\\nRat li dan ir-rikors gie appuntat
  ghas-smigh mill-Qorti kif diversament presjeduta ghas-seduta tat-28 ta'' Frar 2007.\\n\\nRat
  ir-risposta tad-Direttur, Qrati Civili u Tribunali datata 13 ta'' Frar 2007 (fol
  9) fejn espona illi:-\\n\\n1. Illi, preliminarjament, l-azzjoni odjerna hija monka
  u nulla fil-konfront tad-Direttur, Qrati Civili u Tribunali, stante illi l-azzjoni
  giet intavolata kontra entita`, ossija Registratur tal-Qorti, li ma huwiex aktar
  kkontemplat fil-Ligi, u ghalhekk id-Direttur, Qrati Civili u Tribunali ghandu jigi
  lliberat mill-osservanza tal-gudizzju;\\n2. Illi, minghajr pregudizzju ghas-suespost,
  l-azzjoni intavolata mir-rikorrenti ai termini tal-artikolu 64 tal-Kap 12 tal-ligijiet
  ta'' Malta hija preskritta bit-trapass tal-periodu stabbilit fil-ligi, stante illi
  l-ittra ufficjali intbaghtet lirrikorrenti fis-7 ta'' Dicembru 2006 u l-azzjoni
  odjerna tnediet fil-15 ta'' Jannar 2007;\\n3. Illi, minghajr pregudizzju ghas-suespost,
  l-azzjoni odjerna kif impostata ma hijiex kompleta, stante illi l-parti li ghaliha
  inharget tali taxxa, ossija Dr Peter Borg Costanzi, ma huwiex parti mill-kawza,
  u ghalhekk jenhtieg illi jkun kjamat fil-kawza;\\n4. Illi, minghajr pregudizzju
  ghas-suespost, l-esponent, tramite d-Deputat Registratur tieghu, mexa abbazi ta''
  digrieti mahruga mill-Qorti Civili (Sezzjoni ta'' Gurisdizzjoni Volontarja), ossija
  Digrieti 734/2006 u 735/2006, mahruga fuq talba ta'' Dr. Peter Borg Costanzi, u
  ghalhekk ma ghandux jinstab responsabbli ghal kwalsiasi spejjez illi tali azzjoni
  tista'' twassal;\\n5. Salv eccezzjonijiet ohra.\\n\\nRat il-verbal tas-seduta tat-28
  ta'' Frar 2007 mizmuma quddiem il-Qorti kif diversament presjeduta fejn il-Qorti
  ghamlet referenza ghat-tielet paragrafu tar-risposta mressqa mill-intimat u bla
  hsara ghall-ewwel zewg eccezzjonijiet mqanqlin fl-istess risposta, u wara li rat
  lArt. 961 Kap. 12 ordnat is-sejha fil-kawza ta'' Dr. Peter Borg Costanzi, u ordnat
  li l-atti tal-kawza jkunu jirriflettu din il-bidla.\\n\\nRat ir-risposta ta'' Dr
  Peter Borg Costanzi (ID 247554M) datata 21 ta'' Marzu 2007 (fol 12 ) fejn espona
  illi:-\\n\\nIlli l-esponenti kellu jkun parti ab initio u f''dak ir-rigward meta
  l-proceduri gew inizjati I-gudizzju ma kienx integru. Issa li l-esponenti jifforma
  parti mill-gudizzju, il-proceduri odjerni huma fuori termine fil-konfront tal-esponenti
  u dan stante li l-esponenti ma sarx parti entro t-terminu prefiss flArt 64 tal-Kodici
  tal-Organizzazzjoni u Procedura Civili u konsegwentement it-talba ghandha tigi respinta
  bl-ispejjez kontra r-rikorrenti.\\n\\nIlli fit-tieni lok u minghajr pregudizzju
  ghall-premess, ilkuntratti li taw lok ghall-hrug tat-taxxi de quo huma proceduri
  f''iter ta'' tehid forzat ta'' proprjeta` (esproprijazzjoni) u ghalhekk huwa naturali
  illi l-akkwirent ihallas id-drittijiet u spejjez kollha naxxenti minn tali proceduri.
  Is-sidien ghandhom dritt li jigu assistiti minn avukat waqt il-kuntratt u konsegwentement
  stante li huwa l-akkwirenti li jrid ihallas l-ispejjez tal-akkwist, huwa daqstant
  iehor logiku u naturali li l-Kummissarju tal-Artijiet ghandu jhallas tal-assistenza
  legali moghtija lil ex sidien.\\n\\nIlli sa qabel dawn il-proceduri l-Kummissarju
  tal-Artijiet dejjem hallas id-drittijiet tal-avukati li assisstew lil ex sidien
  waqt kuntratti simili u l-esponenti, di scienza proprio jista'' anke jikkonferma
  illi kemm ilu jipprattika ta'' avukat mill1980, f''kazijiet simili dejjem segwa
  l-istess procedura fissens illi wara li jsir il-kuntratt, huwa jaghmel in-nota opportuna
  fis-Sekond'' Awla tal-Qorti Civili, jigu ntaxxati ddrittijiet tieghu skont it-tariffa
  tal-Kodici tal-Organizzazzjoni u Procedura Civili li f''dan il-kaz tikkontempla
  li d-drittijiet\\n\\ntal-avukat ikunu anqas bhal li kieku l-akkwirent ikun persuna
  privata u wara li t-taxxa tintbaghat lillKummissarju tal-Artijiet, din debitament
  tithallas. Huwa jikkonferma wkoll illi meta huwa assista l-ewwel darba ghall-kuntratt
  simili, kien l-istess Kummissarju tal-Artijiet ta'' dak iz-zmien li nforma lill-avukat
  sottoskritt li seta'' jaghmel hekk u li dik kienet il-procedura normali.\\n\\nIlli
  ghalhekk anke fil-mertu, it-talba tal-Kummissarju talArtijiet ghandha tigi respinta
  bl-ispejjez.\\n\\nRat il-verbal tas-seduta tad-19 ta'' Gunju 2007 mizmuma quddiem
  din il-Qorti kif diversament presjeduta fejn irrikors  giet differit ghas-sentenza
  ghas-26 ta'' Gunju 2007; u l-verbal tas-seduta tas-26 ta'' Gunju 2007 fejn inghatat
  sentenza in parte fejn il-Qorti :\\n\\n\\\"Ti\u010b\u0127ad l-ewwel e\u010b\u010bezzjoni
  tal-intimat Re\u0121istratur, Qrati \u010aivili u Tribunali (Sezzjoni ta'' \u0120urisdizzjoni
  Volontarja) billi mhix mist\u0127oqqa fil-fatt u fid-dritt; Ti\u010b\u0127ad l-ewwel
  e\u010b\u010bezzjoni tal-imsejja\u0127 fil-kaw\u017ca l-Avukat Peter Bor\u0121 Costanzi,
  billi l-azzjoni tar-rikorrent ma waqg\u0127etx blg\u0127eluq ta\u017c-\u017cmien;
  Tordna li kull wie\u0127ed mill-intimati j\u0127allas l-ispejje\u017c relattivi
  g\u0127all-e\u010b\u010bezzjoni tieg\u0127u; u Tordna li s-smig\u0127 tal-kaw\u017ca
  jitkompla bil-\u0121bir tal-provi u bittrattazzjoni fis-smig\u0127 ta'' nhar il-\u0126amis
  1 ta'' Novembru 2007, tissejja\u0127 fis-13.00p.m.\\\"\\n\\nRat il-verbal tas-seduta
  tat-22 ta'' Mejju 2008 mizmuma quddiem il-Qorti kif diversament presjeduta fejn
  deher Joseph P Bonello u l-intervenut fil-kawza l-Avukat Peter Borg Costanzi. Issejjah
  ukoll l-Avukat Francesco Depasquale ghall-intimat Registratur tal-Qrati li ma deherx.
  Saret it-trattazzjoni tal-kawza u halliet il-kawza ghas-sentenza ghad-9 ta'' Ottubru
  2008; u l-verbali tasseduti kollha sal-31 ta'' Ottubru 2012 fejn il-kawza baqghet
  differita ghas-sentenza ghall-14 ta'' Frar 2003.\\n\\nRat is-surroga datata 16 ta''
  Jannar 2013 fejn din il-kawza giet assenjata lil din il-Qorti kif hekk presjeduta.\\n\\nRat
  il-verbal tas-seduta tal-14 ta'' Frar 2013 mizmuma quddiem din il-Qorti kif hekk
  illum presjeduta fejn meta ssejhet il-kawza dehret Dr. Mirielle Sacco ghallKummissarju
  tal-Artijiet li talbet li l-kaz jibqa'' ghassentenza. Il-Qorti laqghet it-talba.
  Il-konvenut imsejjah tliet darbiet baqa'' ma dehrex. Il-kawza baqghet differita
  ghassentenza finali ghat-30 ta'' April 2013.\\n\\nHadet konjizzjoni tal-provi prodotti.\\n\\nII.
  KONSIDERAZZJONIJIET\\n\\nIlli b''din il-kawza, ir-rikorrent Kumissarju tal-Artijiet
  qed jikkontesta zewg taxxi gudizzjarji mahruga mir-Registru tal-Qorti Civili (Gurisdizzjoni
  Volontarja) fuq talba talavukat kjamat fil-kawza dwar servizzi professjonali pprestati
  minnu meta assista lill-kiljenti tieghu f''zewg kuntratti separati ta'' esproprjazzjoni
  ippubblikati minnNutar Dottor Vincent Miceli fit-30 ta'' Mejju 2006 u fit-2 ta''
  Gunju 2006.  Id-drittijiet u spejjez gew intaxxati fl-ammont ta'' Lm792.42, oltre
  Lm17 dovut ghall-ittra ufficjali interpellatorja mibghuta mill-Avukat imsemmi.\\n\\nKontra
  dan, l-kjamat fil-kawza, l-Avukat Peter Borg Costanzi isostni li peress li l-kuntratti
  li taw lok ghall-hrug tat-taxxi de quo sehhew b''konsegwenza ta'' proceduri ta''
  tehid forzat ta'' proprjeta'' (esproprjazzjoni), is-sidien ghandhom dritt li jkunu
  assititi minn avukat waqt il-kuntratt u, daqskemm huwa l-akkwirent li jhallas l-ispejjez
  talakkwist, allura \\\"huwa daqstant logiku u naturali\\\" 1 li lKummissarju tal-Artijiet
  ghandu jhallas tal-assistenza legali moghtija lill-ex sidien.\\n\\nMix-xhieda tal-Avukat
  Peter Borg Costanzi, 2 jirrizulta li kien l-avukat ta'' Josephine Sant, zewgha u
  uliedha fi proceduri ta'' esproprjazzjoni li ittiehdu mir-rikorrent odjern. Ir-rikorrent
  istitwixxa  proceduri ta'' esproprjazzjoni quddiem il-Bord ta'' Arbitragg dwar l-Artijiet,
  kontra Josephine Sant kif ukoll, permezz ta'' proceduri separati,\\n\\n1 Kliem li
  intuzaw fir-risposta a fol.12 tal-process.\\n\\n2 Xhieda esibita a fol.27 tal-process.\\n\\nkontra
  Maurice Caruana u ohrajn. L-ezitu ta'' dawn ilproceduri kien li l-Bord ordna li
  jsiru kuntratti ta'' trasferiment u li fl-istess kuntratti jithallas il-prezz relattiv.
  Hu kien prezenti ghall-kuntratti relattivi u bhal ma dejjem ghamel, ipprezenta kopja
  tal-kuntratti lir-Registratur talQorti Civili (Gurisdizzjoni Volontarja), u talab
  li tinhareg taxxa tad-drittijiet professjonali tieghu. Baghat il-kont lidDipartiment
  tal-Artijiet, izda dan baqa'' ma thallasx, minnkejja interpellazzjoni lid-Dipartiment
  anke permezz tal-ittra ufficjali esibita in atti. Hu xehed li kellu diversi kazijiet
  fejn thallas mid-Dipartiment ghall-assistenza professjonali lil xi parti fuq kuntratti
  ta'' esproprjazzjoni, kemm meta gie nominat bhala kuratur biex jirraprezenta leventwali
  kontumaci, kif ukoll jekk kien qed jassisti xi parti fuq il-kuntratt.\\n\\n\\\"Kien
  l-istess Kummissarju ta'' l-Artijiet li dak iz-zmien kien Adriano Gouder,li ....kien...
  qalli biex naghmel taxxa u nipprezenta il-kont relattiv lid-dipartiment, minn dak
  izzmien kelli diversi kazijiet..li ghamilt l-istess procedura u dejjem thallast,
  ghalhekk jien kont sorpriz li d-dipartiment qed jghid illi ma jridx ihallas.\\\"
  Hu sostna li la darba ilGvern qed jesproprja l-art, qed jehodha forzozament, individwu
  ghandu dritt jigi assistit minn Avukat u allura bhala tali d-dipartiment li qed
  jixtri irid ihallas l-ispejjez relattivi.\\\" 3 Jghid ukoll li \\\"fiz-zewg kazijiet
  ir-relazzjoni tieghi mal-Kummissarju tal-Artijiet huwa semplici, ga la darba huwa
  il-kompratur f''proceduri specjali, huwa irid ihallas lispejjez relattivi tat-trasferiment,
  u ghalhekk irid ihallas iddrittijiet tieghi.\\\"\\n\\nJirrizulta mill-atti li nhargu
  zewg taxxi (immarkati rispettivament Dok.\\\" A\\\" u Dok.\\\"B\\\", annessi maccitazzjoni,
  fejn id-drittijiet u spejjez tal-Avukat Borg Costanzi huma ta'' LM19.16 fir-rigward
  tal-kuntratt bejn irrikorrent u Josephine Sant et., ippubblikat fit-2 ta'' Gunju
  2006, u ta'' LM773.24 fir-rigward ta'' kuntratt bejn irrikorrent u Maurice Caruana
  et., ippubblikat fit-30 ta'' Mejju 2006. Ma hemm xejn stipulat fil-kuntratti dwar
  hlas talispejjez mertu ta'' din il-kawza u il-Qorti tiddezumi li ma\\n\\n3 Xhieda
  ezebita a fol 29 u 30 tal-process.\\n\\nkien hemm ebda disposizzjoni mill-Bord ta''
  Arbitragg dwar l-Artijiet li jinkombi fuq ir-rikorrent odjern l-ispejjez ta'' assistenza
  professjonali inkorsi mill-esproprjati fuq ilkuntratti ta'' trasferiment.\\n\\nIkkonsidrat
  li bejn ir-rikorrent u l-Avukat intimat ma hemm ebda relazzjoni jew ness ta'' avukat
  u klijent jew xi relazzjoni guridika ohra. L-Avukat intimat gie assunt missidien
  esproprjati biex jipprestalhom is-servizzi tieghu, tul il-proceduri quddiem il-Bord
  kif ukoll fuq il-kuntratti ta'' trasferimenti relattivi. La gie assunt mill-Kummissarju
  talArtijiet u lanqas approvat minnu.\\n\\nMix-xhieda tal-Avukat intimat, johrog
  li qatt ma kellu problemi fir-rigward ta'' hlas mid-Dipartiment, sew jekk kien jippresta
  is-servizzi professjonali tieghu bhala rapprezentant tal-eventwali kontumaci, sew
  meta kien jagixxi ghall-privat. Izda b''danakollu baqa'' ma ressaq ebda prova ghajr
  dak minnu dikjarat. Mhux eskluz li ilKummissarju tal-Artijiet, fiz-zmien, kien ezercita
  iddiskrezzjoni tieghu bil-mod kif xehed l-Avukat Borg Costanzi, f''kazijiet partikolari,
  izda b''dan ma jfissirx, u flassenza ta'' prova konkreta u idoneja, li giet kostitwita
  xi policy interna li torbot lill-Gvern li jhallas, fuq bazi ta'' regola generali,
  spejjez professjonali purament privati u mhux konnessi mal-kuntratt tal-akkwist.
  Kif irribatta irrikorrent tramite id-difensur tieghu, it-trasferiment sehh in konsegwenza
  u b''effett ta'' sentenza u min qed jittrasferixxi ma jkollux bzonn avukat fuq il-kuntratt,
  ghalkemm, izzid ilQorti, ghandu l-ghazla li jitlob l-assistenza legali jekk irid.\\n\\nEzami
  tad-dispozizzjonijiet tal-Ordinanza dwar l-Akkwist ta'' Artijiet ghall-Skopijiet
  Pubblici (Kap 88 tal-Ligijiet ta'' Malta) ma joffri ebda ghajnuna ghar-risoluzzjoni
  talkwistjoni odjerna. Anzi l-Ordinanza, filwaqt li tirregola ilkwistjoni dwar hlas
  ta'' l-ispejjez tal-proceduri inkorsi wara li tkun saret l-offerta mill-Gvern, u
  sahansitra tiddisponi f''liema kaz jista'' l-esproprjat stess, anke  ibaghti hu
  dawn\\n\\nl-ispejjez, 4 dan l-Att hu sieket dwar l-ispejjez tal-kuntratt ta'' trasferiment.\\n\\nIn-nozzjoni
  li l-att hu assimilat ghal-kuntratt ta'' bejgh u li ghalhekk, il-Kummissarju tal-Artijiet
  bhala \\\"kumpratur fi proceduri specjali\\\" 5 ghandu ibaghti l-ispejjez kollha
  talkuntratti, ghandu certu mertu.\\n\\nIzda anke fuq dan il-binarju, it-tezi tal-intimat
  ma jreggix. Ir-regola generali hija imfissra fl-artikolu 1361(1) talKap.16 tal-Ligijiet
  ta'' Malta li jiddisponi li \\\"L-ispejje\u017c tal-atti u l-ispejje\u017c l-o\u0127ra
  li jinda\u0127lu fil-bejg\u0127,fosthom dawk li jsiru g\u0127all-\u0127elsien ta''
  immobbli minn fedekommessi jew minn ipoteki, servit\u00f9 jew pi\u017cijiet o\u0127ra
  li g\u0127alihom l-immobbli jkun su\u0121\u0121ett, skont id-disposizzjonijiet migjubin
  fit-Titolu II tatTaqsima II tat-Tieni Ktieb tal-Kodi\u010bi ta '' Organizzazzjoni
  u Pro\u010bedura \u010aivili, ibatihom ix-xerrej;\\\" (sottolinear tal-Qorti).\\n\\nIl-legislatur
  jimponi fuq l-akkwirent l-ispejjez kollha konnessi mal-liberazzjoni tal-art mill-pizijiet
  imsemmija u lakkwirent ihallas ukoll l-ispejjez notarili. Izda certament ma hemm
  ebda obbligu legali impost fuq l-akkwirent biex ihallas l-ispejjez professjonali
  tal-avukat li jista'' jigi inkarigat mill-venditur biex jassistih fuq il-kuntratt.
  Hija lghazla tal-venditur li jqabbad avukat u din l-ghazla jaghmiha a spejjez tieghu.\\n\\nBla
  dubbju, att ta'' trasferiment wara esproprjazzjoni mhuwiex kuntratt ta'' bejgh imma
  trasferiment forzat fuq issidien.Inoltre, l-kunsens taghhom mhuwiex moghti volontarjament
  imma hu sostitwit bid-decizjoni tal-Bord. Tant hu hekk li l-Bord ghandu il-jedd
  li jinnomina Avukat biex jidher fuq il-kuntratt biex jirraprezenta lis-sid li jista''
  jkun eventwalment kontumaci. Ghalhekk, lanqas hemm bzonn li jidhru s-sidien fuq
  l-att peress li t-trasferiment seta'' jigi kompletat minghajrhom, tramite l-avukat
  nominat mill-Bord. Difatti fil-kuntratt bejn ir-rikorrent u Josephine Sant u ohrajn,
  tat-2 ta'' Gunju 2006, deher Dr. Guido Pace Spadaro in rapprezentanza tal-kontumaci.\\n\\n4
  Art.31 tal-Kap.88 tal-Ligijiet ta''Malta.\\n\\n5 Xhieda tal-Avukat Borg Costanzi
  a fol.31 tal-process.\\n\\nIlli jista'' ikun li f''certi kazijiet, ikun mehtieg
  ghas-sid li jkollu l-Avukat ta'' fiducja mieghu, u ghandu kull dritt li jitlob il
  pariri u assistenza fuq il-kuntratt. Izda fl-assenza talespressjoni ta'' rieda f''dan
  is-sens mill-legislatur, din ilQorti ma tistax tohloq obbligu ghall-Gvern li jhallas
  lispejjez ta'' avukati assunti privatament bhal ma jippretendi l-avukat intimat.
  Ma hemm ebda bazi legali sabiex ilpretensjoni tieghu tigi akkolta. Kien ikun mod
  iehor li kieku il-partijiet innegozjaw bejniethom u qablu li dawn l-ispejjez jithallsu
  mill-Gvern, jew altrimenti jkun hekk imfisser filkuntratt stess, jew fid-decizjoni
  tal-Bord, izda f''dan il-kaz ma jirrizulta assolutament xejn minn dan. Il-Qorti
  ma tistax tissostitwixxi il-fehma taghha ghal dak tal-legislatur, jew tillegisla
  ex novo.\\n\\nGhaldaqstant fid-dawl ta'' dak hawn fuq premess, din ilQorti ser tilqa''
  it-talbiet tar-rikorrent.\\n\\nIII. KONKLUZJONI.\\n\\nIlli ghalhekk ghal dawn il-motivi,
  din il-Qorti, taqta'' u tiddeciedi, billi fil-waqt li tilqa'' it-talba tar-rikorrent,
  tordna lill-intimat Registratur, Qrati Civili u Tribunali (Sezzjoni ta'' Gurisdizzjoni
  Volontarja) sabiex jemmenda ittaxxi li jirrigwardaw iz-zewg kuntratti in atti tan-Nutar
  Vincent Miceli bejn ir-rikorrent u Maurice Caruana et. tat30 ta'' Mejju 2006, u
  bejn ir-rikorrent u Josephine Sant et. tat-2 ta'' Gunju 2006 skont kif mitlub.\\n\\nL-ispejjez
  jithallsu mill-Avukat Peter Borg Costanzi.\\n\\nMoqrija.\\n\\n< Sentenza Finali
  >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"S.T.O. PRIM IMHALLEF VINCENT DE GAETANO\\n\\nSeduta tad-9 ta'' Mejju, 2008\\n\\nAppell
  Kriminali Numru. 424/2007\\n\\nIl-Pulizija (Supretendent Nicholas Ciappara)\\n\\nv.\\n\\nDavid
  (David-Norbert) Schembri\\n\\nIl-Qorti:\\n\\nRat l-imputazzjonijiet migjuba mill-Pulizija
  Ezekuttiva kontra David (David-Norbert) Schembri ta'' 23 sena iben Antonio u Evangelista
  nee Micallef, imwieled Pieta` fil-15 ta'' Settembru 1977, detentur ta'' karta ta''
  l-identita` binnumru 369676(M) talli: (1) f''dawn il-Gzejjer bejn Jannar u Frar
  1999 u f''Settembru 1998 kellu fil-pussess tieghu ddroga erojina bi ksur tal-ligi;
  (2) f''dawn il-Gzejjer f''Settembru 1998 forna jew pprokura jew offra li jforni
  jew li jipprokura d-droga erojina, bi ksur tal-ligi; kif ukoll (3) talli sar ricediv
  skond l-Artikolu 49 u 50 tal-Kap 9 tal-Ligijiet ta'' Malta, b''sentenzi moghtija
  lilu mill-Qorti tal-Magistrati\\n\\n(Malta) datata 27 ta'' Lulju 1995, Awla 10 u
  mill-Qorti ta'' lAppell Kriminali datata 31 ta'' Lulju 1998;\\n\\nRat is-sentenza
  ta'' l-Qorti tal-Magistrati (Malta) tas-26 ta'' Novembru, 2007 li permezz taghha
  dik il-Qorti sabet lillimsemmi David (David-Norbert) Schembri hati skond lewwel
  kif ukoll skond it-tieni imputazzjoni (bl-ewwel imputazzjoni assorbita fit-tieni
  wahda), izda lliberatu mittielet imputazzjoni, u kkundannatu disa'' (9) xhur prigunerija  u
  multa ta'' tlett mitt lira (Lm300), pagabbli f''rati mensili ta'' Lm20 kull xahar,
  bl-ewwel pagament isir fi zmien erba'' gimghat;\\n\\nRat ir-rikors ta'' appell ta''
  David (David-Norbert) Schembri, minnu prezentat fil-5 ta'' Dicembru 2007, li permezz
  tieghu talab li din il-Qorti joghgobha tirriforma l-imsemmija sentenza;\\n\\nRat
  l-atti kollha tal-kawza; semghet lid-difensuri tal-partijiet fl-udjenza tat-28 ta''
  Marzu 2008; ikkunsidrat:\\n\\nL-aggravju ta'' l-appellant hu, bazikament, li l-ewwel
  qorti kienet skorretta meta emmnet dak li xehed Joseph Pace, u cioe` li f''okkazzjoni
  minnhom dana Pace kien xtara minghand l-appellant l-erojina.\\n\\nDin il-Qorti ezaminat
  bir-reqqa l-provi kollha, izda tara li ma hemm ebda raguni ghala ghandha tiddisurba
  lkonkluzzjoni milhuqa mill-ewwel qorti. Kif tajjeb osserva labbili difensur ta''
  l-appellant, din il-Qorti bhala regola ma tiddisturbax l-apprezzament tal-provi
  li tkun ghamlet lewwel qorti jekk ikun jirrizultalha li dak l-apprezzament, u l-konkluzjoni
  fuqu bbazata, kien wiehed li dik il-qorti setghet legalment u ragjonevolment taghmel,
  b''mod ghalhekk li l-konkluzzjoni milhuqa tkun ukoll wahda li dik il-qorti setghet
  legalment u ragjonevolment tasal ghaliha. Huwa minnu li f''dan il-kaz hemm provi
  kontrastanti \u2013 ilverzjoni ta'' Pace kontra l-verzjoni ta'' l-appellant. Pero`
  wiehed ma jridx jinsa li l-ewwel qorti kellha l-vantagg \u2013 vantagg li qorti
  ta'' appell normalment ma jkollhiex \u2013 li semghet lix-xhieda jiddeponu quddiemha,
  u ghalhekk dik il-qorti tkun f''posizzjoni ferm aktar tajba biex taghmel\\n\\napprezzament
  ta'' x''temmen u x''ma temminx. Jinghad ukoll li s-sentenza appellata hija wahda
  dettaljata hafna, u minnha hu evidenti li l-magistrat sedenti gharbel il-provi minuzjozament.
  Kollox ma'' kollox ma hemm ebda raguni ghala din il-Qorti ghandha tiddipartixxi
  mill-konkluzzjoni raggunta mill-ewwel qorti.\\n\\nGhall-motivi premessi, tichad
  l-appell u tikkonferma ssentenza appellata.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"22 ta'' Settembru, 2011 82/2011\\n\\nIL-KNISJA TOFFRI G\u0126AJNUNA LILL-VITTMI
  TA'' ABBU\u017bI\\n\\nF''laqg\u0127a kon\u0121unta li saret bejn il-Konferenza Episkopali
  Maltija u l-Konferenza tasSuperjuri Ma\u0121\u0121uri tar-Reli\u0121ju\u017ci, \u0121ie
  de\u010bi\u017c li ti\u0121i ppublikata din l-istqarrija:\\n\\nB''referenza g\u0127all-fatti
  u l-allegazzjonijiet li taw lok g\u0127as-sentenza li ng\u0127atat mill-Qorti talMa\u0121istrati
  ftit tal-\u0121img\u0127at ilu (li g\u0127adha fil-pre\u017cent pendenti quddiem
  il-Qrati u ma g\u0127andha b''ebda mod ti\u0121i ppre\u0121udikata), l-Awtoritajiet
  tal-Knisja f''Malta u f''G\u0127awdex qeg\u0127din jiddikjaraw li ng\u0127ataw parir
  legali, fis-sens li f''dan il-ka\u017c partikulari, il-Knisja, b\u0127ala istituzzjoni,
  ma g\u0127andhix responsabbilta legali g\u0127al dak li seta` se\u0127\u0127 minn
  xi individwi u ma tistax titg\u0127abba b''tali responsabbilta.\\n\\nMadanakollu
  l-Awtoritajiet tal-Knisja, ming\u0127ajr ma jid\u0127lu f''ka\u017cijiet spe\u010bifi\u010bi,
  bla pre\u0121udizzju g\u0127all-po\u017cizzjoni tal-Knisja fil-pro\u010bessi \u010bivili
  li jistg\u0127u jinqalg\u0127u u ming\u0127ajr ma jirrinunzjaw g\u0127ad-drittijiet
  ta` difi\u017ca li huma jistg\u0127u legalment jinvokaw, bdew il-passi ne\u010bessarji
  biex titwaqqaf struttura li, permezz tag\u0127ha, a spejje\u017c tal-Knisja, professjonisti
  fil-qasam psikolo\u0121iku, psikjatriku u so\u010bjali, jipprovdu l-g\u0127ajnuna
  kollha ne\u010bessarja filqasam proprju tag\u0127hom. Dan jg\u0127odd g\u0127al
  kull min ji\u0121i ppruvat li kien, b''xi mod, vittma ta` xi abbu\u017c minn funzjonarji
  pastorali ndividwali. Il-Knisja qed tag\u0127mel dan b\u0127ala parti millmissjoni
  pastorali u spiritwali tag\u0127ha.\\n\\nKurja tal-Ar\u010bisqof, Pjazza San Kal\u010bedonju,
  Floriana, FRN 1535, Malta. Tel. (356) 21241281. Url: www.maltadiocese.org\"", "\"Kopja
  Informali ta'' Sentenza\\n\\nQORTI CIVILI (SEZZJONI TAL-FAMILJA)\\n\\nONOR. IMHALLEF
  ANNA FELICE\\n\\nSeduta ta'' l-14 ta'' Lulju, 2011\\n\\nCitazzjoni Numru. 9/2009\\n\\nA
  B\\n\\n-vs-\\n\\nC D\\n\\nIl-Qorti:\\n\\nRat ir-rikors guramentat ta'' A B fejn
  dan, wara li ppremetta:\\n\\nPeress illi l-partijiet izzewgu fit-30 ta'' Marzu 1998
  skond lanness certifikat taz-zwieg hawn immarkat bhala Dokument A;\\n\\nPeress illi
  l-kunsens tal-kontendenti mill-partijiet ikun inkiseb b''qerq dwar xi kwalita''
  tal-parti l-ohra li tista'' mixxorti taghha tfixkel serjament il-hajja mizzewga;\\n\\nPagna
  1 minn 7\\n\\nPeress illi l-kunsens tal-kontendenti huwa vizzjat b''difett serju
  ta'' diskrezzjoni ta'' gudizzju fuq il-hajja mizzewga jew fuq id-drittijiet u dmirijiet
  essenzjali taghha jew b''anomalija psikologika serja li taghmilha impossibli ghall-konvenuta
  li taqdi l-obbligazzjonijiet essenzjali ghaz-zwieg;\\n\\nPeress illi l-kunsens tal-attur
  inkiseb bl-eskluzjoni pozittiva taz-zwieg innifsu jew ta'' xi wiehed jew aktar mill-elementi
  essenzjali tal-hajja mizzewga u dan stante illi hija qatt ma assumiet d-dmirijiet
  u l-obbligi tal-hajja mizzewga taghhom;\\n\\nPeress illi l-kontendenti ma kellhomx
  fiz-zmien li sar izzwieg is-setghat intelletwali jew ta'' rieda bizzejjed sabiex
  jinholoq kunsens ghaz-zwieg;\\n\\nGhalhekk kellha ssir din il-kawza, sabiex jigi
  dikjarat null iz-zwieg tal-partijiet tat-30 ta'' Marzu 1998.\\n\\nGhaldaqstant,
  il-konvenuta tghid ghalfejn din l-Onorabbli Qorti m''ghandhiex:\\n\\nTiddeciedi
  u tiddikjara li z-zwieg bejn il-partijiet fit-30 ta'' Marzu 1998 skond l-anness
  certifikat taz-zwieg huwa null u invalidu ghall-finijiet u effetti kollha tal-ligi
  a tenur tal-Att taz-Zwieg, Kapitolu 255 tal-Ligijiet ta'' Malta.\\n\\nBl-ispejjez
  u bl-ingunzjoni tal-konvenuta in subizzjoni.\\n\\nRat ir-risposta guramentata ta''
  C D fejn din eccepiet:\\n\\nIlli l-esponenti ma topponix ghat-talba sabiex iz-zwieg
  ta'' bejn il-kontendenti jigi dikjarat null ghall-finijiet u effetti kollha tal-ligi
  pero'' minhabba ragunijiet imputabbli lill-attur.\\n\\nIlli in effetti, kif ser
  jirrizulta waqt is-smiegh u t-trattazzjoni ta'' din il-kawza, l-attur izzewweg lill-esponenti
  ghall-flus u waqt iz-zwieg wera ruhu pussessiv fuqha b''mod esagerat b''tali mod
  illi wera li kien afflitt minn anomalija psikologika.\\n\\nIlli ghalhekk qieghed
  jigi umilment sottomess illi z-zwieg ghandu jigi dikjarat null minhabba dak li jiddisponu
  lartikoli 19(1)(d) tal-Kap. 255 u cioe'' illi kunsens tal-attur kien vizzjat b''difett
  serju ta'' diskrezzjoni ta'' gudizzju fuq ilhajja mizzewga, jew fuq id-drittijiet
  u d-dmirijiet essenzjali taghha, jew b''anomalija psikologika serja li taghmilha
  impossibli ghal dik il-parti li taqdi l-obbligazzjonijiet essenzjali taz-zwieg;
  jew alternattivament u minghajr pregudizzju, minhabba li l-kunsens tal-attur kien
  vizzjat bleskluzjoni pozittiva taz-zwieg innifsu kif jiddisponi l-artikolu 19(1)(f)
  tal-Kap. 255.\\n\\nIlli konsegwentement, l-esponenti m''ghandhiex tbati spejjez
  ta'' dawn il-proceduri.\\n\\nRat id-dokumenti esebiti.\\n\\nRat l-affidavit prodotti.\\n\\nRat
  l-atti kollha tal-kawza.\\n\\nRat li l-kawza thalliet ghal-lum ghas-sentenza.\\n\\nIkkunsidrat
  illi l-partijiet f''din il-kawza zzewgu ta'' eta'' pjuttost zghira wara gherusija
  ta'' hames snin. Miz-zwieg taghhom twieled iben. Illum, ir-rikorrenti qieghed f''relazzjoni
  ohra u qed jitlob dikjarazzjoni ta'' nullita'' gharragunijiet imsemmija fir-rikors
  promotur. L-intimata, li issa hija ukoll qieghda f''relazzjoni ohra, taqbel li z-zwieg
  null, pero'' ghal ragunijiet ohra. Ma ressqet ebda kontro-talba. Bhala provi f''din
  il-kawza, il-partijiet ressqu l-affidavit taghhom u tal-genituri taghhom rispettivi.\\n\\nL-ewwel
  kawzali li jressaq ir-rikorrenti hija l-qerq. Il-Qorti ma ssib ebda hjiel ta'' qerq
  fil-provi prodotti. Ir-rikorrenti donnu qed jifhem li martu qarrqet bih ghaliex
  izzewget biss biex tkun tista'' titlaq mid-dar. Dan kollu martu tichdu. Il-fatti
  ma jsostnux din l-allegazzjoni. Hu jghid li martu dejjem kellha hsieb titlaq. Il-fatti
  pero'' juru li ghexu flimkien ghal seba'' snin, kellhom tifel u l-mara telqet meta
  bdiet relazzjoni ma'' ragel iehor.\\n\\nIr-rikorrenti jinvoka ukoll is-subinciz
  1(d) tal-Art. 19 talKap. 255 li jipprovdi ghal dikjarazzjoni ta'' nullita'':\\n\\n\\\"Jekk
  il-kunsens ta'' xi wahda mill-partijiet ikun vizjat b''difett serju ta'' diskrezzjoni
  ta'' gudizzju fuq il-hajja mizzewga, jew fuq id-drittijiet u d-dmirijiet essenzjali
  taghha, jew b''anomalija psikologika serja li taghmilha impossibbli ghal dik il-parti
  li taqdi l-obbligazzjonijiet essenzjali taz-zwieg.\\\"\\n\\nDin il-kawzali giet
  estensivament studjata minn dawn ilQrati tul is-snin. Dan l-insenjament gie kristalizzat
  millQorti tal-Appell fil-kawza \\\"Janet Portelli vs Victor Portelli\\\", (deciza
  fl-14 ta'' Awissu, 1995):\\n\\n\\\"It seems that discretion of judgement or maturity
  of judgement can be lacking, if any one of the following three conditions or hypotheses
  is verified: (1) when sufficient intellectual knowledge of the object of consent
  to be given in entering marriage is lacking; (2) when the contracting party has
  not yet reached a sufficient amount of reflection that is proportionate to the conjugal
  affair, that is a critical reflection apt for nuptial; (3) or finally when either
  party contracting marriage is deprived of internal freedom, that is, that capacity
  deliberate with sufficient weighing of the motives and, on the part of the will,
  freedom (autonomia) from all force from within.\\\"\\n\\nKif ukoll mill-Prim''Awla
  tal-Qorti Civili fil-kawza \\\"Alessandra sive Sandra Mc Monagale qabel Mamo vs
  Mario Mamo\\\", (deciza fis-26 ta'' Ottubru, 2000):\\n\\n\\\"Fil-mument ta'' l-ghoti
  tal-kunsens matrimonjali, parti jew ohra tkun priva b''mod sostanzjali, ossia gravi
  minn dik ilfakolta'' kritiko-estimativa jew kritiko-valutativa dwar loggett tal-kunsens
  taz-zwieg, jew minn dik il-maturita'' affettiva li hija presuppost ghal ghazla libera
  dwar limsemmi oggett. Id-difett serju ta'' diskrezzjoni ta'' gudizzju, ghalhekk,
  ma hux semplicement nuqqas ta'' hsieb, nuqqas ta'' riflessjoni; anqas ma jfisser
  li wiehed jaghmel ghazliet jew jiehu decizjonijiet zbaljati \u2013 in fatti decizjoni
  jew ghazla zbaljata hi perfettament kompatibbli ma'' diskrezzjoni ta''\\n\\ngudizzju
  (ara, \\\"Emanuel D v. Carmen D\\\", P.A., 10/11/95). Li parti fiz-zwieg ma tkunx
  fehmet sufficjentement, fissens li ma tkunx hasbet bizzejjed jew ma tkunx irriflettiet
  bizzejjed fuq il-hajja mizzewga jew fuq id-drittijiet u ddmirijiet essenzjali tal-hajja
  mizzewga, ma jammontax necessarjament ghal difett (serju) ta'' diskrezzjoni ta''
  gudizzju (\\\"Selina-Maria Vella Haber v. A Gatt\\\", P.A., 15/4/96). Biex ikun
  hemm in-nuqqas jew difett serju ta'' diskrezzjoni ta'' gudizzju kif ravvizat fl-Artikolu
  19(1)(d) irid ikun hemm l-inkapacita'' psikika (mhux necessarjament anomalija psikologika
  fis-sens mediku/psikjatriku) jew kostituzzjonali li wiehed jaghraf u jirrifletti,
  u li jiddeciedi liberament, fuq l-oggett tal-kunsens matrimonjali (ara f''dan is-sens,
  fost ohrajn, \\\"Jacqueline Cousin v. Bernard Simler\\\", P.A., 3/6/98; \\\"Rosanne
  Cassar v. Kenneth Cassar\\\", P.A., 19/10/98; u \\\"Carmelo Grima v. Mary Andrews\\\",
  P.A., 2/11/98).\\\"\\n\\nFil-kaz in ezami, il-Qorti tqis li ma gietx pruvata mirrikorrent,
  l-ezistenza ta'' dan id-difett. Il-partijiet kienu zghar u forsi ukoll xi ftit immaturi.
  Madanakollu, kellhom bizzejjed dehen biex jahdmu sfiq ghall-ghanijiet taghhom. Xtraw
  dar. Issellfu l-flus biex ilestuha. Iddedikaw lgherusija ghal dan il-ghan. Dan wahdu
  ma jimportax essenzjalment xi difett, wisq anqas xi anomalija psikologika.\\n\\nIr-rikorrent
  jindika ukoll is-subinciz 1(f) tal-Art. 19 li jipprovdi ghal dikjarazzjoni ta''
  nullita'':\\n\\n\\\"Jekk il-kunsens ta'' xi wahda mill-partijiet ikun inkiseb bleskluzjoni
  pozittiva taz-zwieg innifsu, jew ta'' xi wiehed jew aktar mill-elementi essenzjali
  tal-hajja mizzewga, jew taddritt ghall-att taz-zwieg.\\\"\\n\\nF''dan il-kuntest,
  il-Qorti taghmel referenza ghas-sentenza tal-Qorti tal-Appell fil-kawza \\\"Raymond
  Cassar vs Anne Cassar nee'' Busuttil\\\", (deciza fil-31 ta'' Mejju, 2004):\\n\\n\\\"Biex
  l-attur jirnexxielu jipprova din l-allegazzjoni huwa necessarju ghalih li jressaq
  provi konkreti u sufficjenti, li jissodisfaw debitament il-Qorti li, fuq bilanc
  ta''\\n\\nprobabilitajiet, it-tezi tieghu tirrispekkja l-verita''. Semplici suspetti
  jew suppozizzjonijiet u kongetturi, ma humiex bizzejjed biex igibu fix-xejn il-prezunzjoni
  li l-kuntratt tazzwieg li sar bejn il-partijiet sar validament. Fi kliem iehor,
  lattur hu obbligat li jipprova sodisfacentement li fil-mument li l-konvenuta tat
  il-kunsens taghha ghaz-zwieg, hija ghamlet dan semplicement b''mod biss estern,
  apparenti u formali. Huwa obbligat li jipprova ukoll li l-konvenuta, b''att pozittiv
  tal-volonta'' taghha, fil-verita'' cahdet totalment li taghti l-kunsens taghha ghaz-zwieg
  (simulazzjoni totali) jew almenu cahdet li taghti l-kunsens matrimonjali taghha
  billi b''att pozittiv tal-volonta'' taghha eskludiet a priori xi element essenzjali
  tal-hajja mizzewga (simulazzjoni parzjali). Jekk l-attur ma jaghmilx din il-prova
  b''mod sodisfacenti fuq bilanc ta'' probabilitajiet, allura t-talba tieghu ghall-annullament
  taz-zwieg in kwistjoni ma tkunx tista'' tintlaqa'' billi actore non probante reus
  absolvitur.\\\"\\n\\nU fil-kawza \\\"Josette Spiteri nee'' Scicluna vs George Spiteri\\\",
  (deciza mill-Qorti ta'' l-Appell fid-9 ta'' Frar, 2001):\\n\\n\\\"Dana d-difett
  \u2013 is-simulazzjoni tal-kunsens \u2013 gie ezaminat f''diversi sentenzi ta''
  din il-Qorti (ara, inter alia, \\\"Anna Galea vs. John Walsh\\\", (30 ta'' Marzu,
  1995) u \\\"Dr. Stephen Muscat vs. Maria Borg Grech\\\", (14 ta'' Awissu, 1995).
  Biex jirrizulta dana d-difett irid jigi ppruvat, sal-grad li trid il-ligi f''kawzi
  civili, li fil-mument tal-ghoti tal-kunsens matrimonjali, il-parti in kwistjoni
  (jew iz-zewg partijiet jekk l-allegazzjoni tkun fil-konfront tal-kunsens tat-tnejn)
  tkun eskludiet b''att pozittiv tal-volonta'' iz-zwieg innifsu jew element essenzjali
  tal-hajja mizzewga jew id-dritt ghall-att taz-zwieg.\\\"\\n\\nImbaghad fil-kawza
  \\\"Adrian Busietta vs Eileen Busietta\\\", (deciza mill-Qorti ta'' l-Appell fit-30
  ta'' April, 2009):\\n\\n\\\"Fid-duttrina jinghad li jkun hemm simulazzjoni meta,
  filmument tal-ghoti tal-kunsens matrimonjali, parti jew ohra (jew it-tnejn) esternament
  turi li qed taghti l-kunsens matrimonjali, izda internament u b''att posittiv tal-volonta''
  taghha tkun qed tichad il-kunsens ghal dak iz-zwieg\\n\\n(simulazzjoni totali),
  jew, dejjem b''dak l-att pozittiv talvolonta'', tkun qed teskludi xi element jew
  proprjeta'' essenzjali ghaz-zwieg (simulazzjoni parzjali) \u2013 ara f''dan is-sens
  Muscat vs Borg Grech noe, deciza mill-Prim Awla tal-Qorti Civili fl-14 ta'' Awwissu,
  1995.  Kif jinghad ukoll minn O. Giacchi fil-ktieb \\\"Il consenso nel matrimonio
  canonico\\\" (Ediz. 1968 pagna 92),\\n\\n\\\"Nell''animo del nubente, perche'' si
  abbia simulazione... occorre che vi sia non un''assenza della volonta'' matrimoniale,
  ma la presenza di una positiva volonta'' di escludere.\\\" \\\"\\n\\nIl-provi prodotti
  ma jsostnu xejn mill-allegazzjoni ta'' eskluzjoni kif konsistentement interpretata
  minn dawn ilQrati.\\n\\nFl-ahharnett, ir-rikorrenti jsemmu l-vizzju ta'' kunsens
  ravvizat fl-Art. 19(1)(h). Ma ngabet ebda prova ta'' dan. Lebda wiehed mill-partijiet
  ma kellu xi mankanza ta'' setgha intellettwali, wisq u wisq anqas ta'' rieda.\\n\\nGhaldaqstant,
  il-Qorti taqta'' u tiddeciedi billi:\\n\\nTichad it-talba tar-rikorrenti.\\n\\nL-ispejjez
  jithallsu mill-istess rikorrenti.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"FIL-QORTI TAL-MA\u0120ISTRATI (MALTA) B\u0126ALA QORTI TA'' \u0120UDIKATURA KRIMINALI\\n\\nMA\u0120ISTRAT
  DR. KEVAN AZZOPARDI B.A., LL.D.\\n\\nIllum, 5 ta'' Frar 2024\\n\\nKa\u017c Numru:
  707/2011\\n\\nIL-PULIZIJA\\n\\nVs\\n\\nRaymond Cachia\\n\\n(Detentur tal-karta tal-identita''
  bin-numru 251162 (M))\\n\\nIl-Qorti:\\n\\nWara li rat l-imputazzjonijiet mi\u0121juba
  fil-konfront tal-imputat, Raymond Cachia ta'' 49 sena, iben Dominic u Dolores xebba
  nee'' Zammit, imwieled Imtarfa, nhar it-12 ta'' April 1962,\\n\\ndetentur tal-karta  tal-identita''
  bin-numru 251162 (M) u residenti Blokk F, Flat 8, Triq il-\\n\\nKaramelli, Mgarr,
  Malta:\\n\\nU akku\u017cat talli fit-3 ta'' Mejju 2010 jew fil-jiem u x-xhur ta''
  qabel, ikkorrompejt lil Nicholas sive Nikki Dimech, Sindku tal-Kunsill Lokali ta''
  Tas-Sliema;\\n\\nKif ukoll talli fit-3 ta'' Novembru 2010 \u0121ewwa Tas-Sliema,
  bil-\u0127sieb li testor\u010bi flus f''xi \u0127a\u0121a o\u0127ra, jew li tag\u0127mel
  xi qlig\u0127, jew bil-\u0127sieb li \u0121\u0121ieg\u0127el lil persuni o\u0127ra
  tesegwixxi, tiddistru\u0121\u0121i,\\n\\ntqalleb, jew tag\u0127mel testment jew
  obligazzjoni bil-miktub, titolu jew garanzija, jew tag\u0127mel jew tonqos milli
  tag\u0127mel xi \u0127a\u0121a, heddidt li tag\u0127mel denunzja jew kwerela kontra.
  Jew li\\n\\ntag\u0127mel malafama lil Patrick Pace, Kunsillier fil-Kunsill Lokali
  ta'' Tas-Sliema, b''liema theddid wasalt fil-\u0127sieb tieg\u0127ek;\\n\\nU aktar
  talli fl-istess data, lok u \u010birkostanzi u\u017cajt vjolenza sabiex i\u0121\u0121ieg\u0127el
  lil Patrick Pace Kunsillier fil-Kunsill Lokali ta'' Tas-Sliema, i\u0127alli ssir,
  jew jonqos milli jag\u0127mel xi \u0127a\u0121a, u b''liema g\u0127emil wasalt fil-\u0127sieb
  tieg\u0127ek.\\n\\nIl-Qorti \u0121iet mitluba sabiex f''ka\u017c ta'' \u0127tija
  barra li tinfli\u0121\u0121i l-piena stabbilita mill-Li\u0121i, tapplika l-provvediment
  ta'' l-Artikolu 119 tal-Li\u0121ijiet ta'' Malta.\\n\\nFilwaqt li l-Pulizija E\u017cekuttiva
  esebiet l-att ta'' twelid kif ukoll il-fedina penali tal-imputat, talbet li dan
  il-ka\u017c ji\u0121i nvestigat skond il-li\u0121i.\\n\\nRat illi fis-seduta tat-23
  ta'' Settembru 2013 il-Prosekuzzjoni e\u017centat lil Qorti mis-smieg\u0127 mil\u0121did
  tal-provi filwaqt li fis-seduta tal-4 ta'' Novembru 2013 l-imputat kif assistit
  e\u017centa lillQorti mis-smieg\u0127 mill-\u0121did tal-provi.\\n\\nRat in-nota
  tal-Avukat \u0120enerali  li permezz tag\u0127ha bag\u0127at lill-imputat Raymond
  Cachia biex ji\u0121i \u0121\u0121udikat minn din il-Qorti b\u0127ala Qorti ta''
  \u0120udikatura Kriminali ta\u0127t:\\n\\n- L-artikoli 115(1)(a) tal-Kodi\u010bi
  Kriminali, Kapitolu 9 tal-Li\u0121ijiet ta'' Malta;\\n- L-artikoli 120(1) tal-Kodi\u010bi
  Kriminali, Kapitolu 9 tal-Li\u0121ijiet ta'' Malta;\\n- L-artikoli 250(1)(2) tal-Kodi\u010bi
  Kriminali, Kapitolu 9 tal-Li\u0121ijiet ta'' Malta;\\n- L-artikoli 251(1)(2) tal-Kodi\u010bi
  Kriminali, Kapitolu 9 tal-Li\u0121ijiet ta'' Malta;\\n- L-artikoli 17, 31 u 119
  tal-Kodi\u010bi Kriminali, Kapitolu 9 tal-Li\u0121ijiet ta'' Malta;\\n\\nRat illi
  waqt is-seduta tas-16 ta'' Settembru 2019 \u0121ew moqrija l-Artikoli mibg\u0127uta
  mill-Avukat \u0120enerali;\\n\\nRat li f''dik l-istess seduta, l-imputat iddikjara
  li ma kellux o\u0121\u0121ezzjoni li l-ka\u017c tieg\u0127u ji\u0121i trattat u
  deci\u017c minn din il-Qorti bi pro\u010bedura sommarja;\\n\\nRat illi f''dik l-istess
  seduta, l-Uffi\u010bjal Prosekutur iddikjara illi ma g\u0127andux aktar provi xi
  jressaq;\\n\\nRat illi fis-seduta tad-9 ta'' Marzu 2020, l-imputat iddikjara illi
  ma g\u0127andux aktar provi xi jressaq;\\n\\nRat id-Digriet tal-Assenjazzjoni ta''
  Kaw\u017ci u Doveri datat 9 ta'' Marzu 2023 permezz ta'' liema din il-pro\u010bedura
  \u0121iet assenjata lil din il-Qorti hekk kif inhi ppreseduta, kif ukoll l-e\u017cenzjoni
  talpartijiet mis-smieg\u0127 mill-\u0121did tal-provi minn din il-Qorti kif presjeduta;\\n\\nRat
  ix-xhieda;\\n\\nRat l-atti pro\u010besswali kollha tal-ka\u017c odjern u d-dokumenti
  esebiti;\\n\\nSemg\u0127et lill-Prosekuzzjoni tiddikjara li kienet se toqg\u0127od
  fuq il-provi;\\n\\nSemg\u0127et s-sottomissjonijiet finali tal-imputat;\\n\\nIkkunsidrat\\n\\nA.
  Fatti tal-ka\u017c\\n\\nIn sostenn tal-imputazzjonijiet mi\u0121juba kontra l-imputat,
  il-Prosekuzzjoni ressqet is-segwenti xhieda u provi:\\n\\n1.\\n\\nL-Avukat Dottoressa
  Angele Vella xehdet li hija uffi\u010bjal legali fid-Dipartiment tal-\\n\\nGvern
  Lokali.\\n\\nSostniet li Nicholas Dimech detentur tal-karta tal-identita'' bin-numru
  301779(M) \u0121ie elett kunsillier fl-elezzjoni tal-11 ta'' Marzu 2006, re\u0121a
  \u0121ie elett fl-elezzjoni tas-6 ta''\\n\\n\u0120unju 2009 u \u0121ie ma\u0127tur
  Sindku fl-ewwel laqg\u0127a tal-kunsill li saret fis-6 ta'' Lulju 2009.\\n\\nServa
  b\u0127ala Sindku sat-2 ta'' Settembru 2010 u sa dakinhar li xehdet u cjoe l-11
  ta''\\n\\nNovembru 2011 kien g\u0127adu kunsillier fil-Kunsill Lokali ta'' Tas-Sliema.\\n\\nSostniet
  ukoll li Raymond Cachia detentur tal-karta tal-identita'' bin-numru 821162(M) huwa
  kunsillier, u ilu kunsillier ta'' San \u0120iljan mil-31 ta'' Mejju 2010, filwaqt
  li s-Sur\\n\\nPatrick Pace detentur tal-karta tal-identita'' bin-numru 206577(M)
  huwa kunsillier talKunsill Lokali ta'' Tas-Sliema u ilu kunsillier mis-6 ta'' \u0120unju
  2009.\\n\\nL--mputat \u0121ie elett fil-Kunsill Lokali ta'' San \u0120iljan fil-31
  ta'' Mejju 2010 u dam kunsillier sal-31 ta'' Marzu 2012.\\n\\nIs-Sur Patrick Pace
  \u0121ie elett fil-Kunsill Lokali ta'' Tas-Sliema fis-6 ta'' \u0120unju 2009 sad-9
  ta'' Frar 2012.\\n\\n2. L-Ispettur Angelo Gafa'' xehed illi waqt li kien g\u0127addej
  b''investigazzjonijiet t''allegazzjonijiet ta'' korruzzjoni li fihom kien involut
  is-Sindku ta'' Tas-Sliema Nicholas Dimech, f''Settembru u Ottubru 2010, ir\u010bieva
  \u017cew\u0121 ittri anonimi fejn dawn kienu jirrigwardjaw allegazzjonijiet ta''
  irregolaritajiet fl-istess Kunsill Lokali ta'' Tas-Sliema. L-ewwel ittra tal-11
  ta'' Settembru 2011 kienet tag\u0127mel referenza g\u0127al xi kuntratturi li kienu
  jissupplixxu servizzi lill-istess Kunsill Lokali. Fit-tieni ittra tat-13 ta'' Ottubru
  kien hemm allegat li Nicholas Dimech kien qed i\u0127allas commission lil kunsilliera
  Eve Galea Debono u Martin Pace permezz ta'' cheque.\\n\\nIl-pulizija g\u0127amlet
  investigazzjoni fuq il-kontijiet bankarji ta'' Nicholas Dimech u fost i\u010b\u010bekkijiet
  li ntra\u010b\u010baw il-pulizija sabet wie\u0127ed li da\u0127al fil-kont bankarju
  ta'' Nicholas Dimech u \u010bjoe fil-kont bankarju bin-numru 006072193001 tal-HSBC
  Bank. Dan kien jirrigwarda \u010bekk bin-numru 11147 ma\u0127ru\u0121 minn kont
  bankarju tal-BOV bin-numru 14809369022 li l-account kien jg\u0127ajjat lil Kunsill
  Lokali ta'' Tas-Sliema.\\n\\nDan i\u010b-\u010bekk kien in\u0127are\u0121 lil Raymond
  Cachia g\u0127al xog\u0127ol li kien g\u0127amel ta'' tiswija ta'' drena\u0121\u0121
  fil-fond 21, High Street, Sliema u spi\u010b\u010ba fil-kont bankarju tas-Sindku
  Nicholas Dimech.\\n\\nIx-xhud kien arresta lill-imputat. Fl-ewwel stqarrija tieg\u0127u
  l-imputat sostna li \u010b-\u010bekk g\u0127addih lis-Sur Dimech g\u0127al ammont
  ta'' flus li kien silfu. Finalment l-imputat ammetta li \u010b-\u010bekk kien g\u0127addih
  lis-Sur Dimech b\u0127ala commission wara li dan talab dan it-tip ta'' \u0127las.\\n\\nL-imputat
  stqarr max-xhud li kien hemm bzonn li jsir xi xog\u0127ol f''dar abbandunata u min\u0127abba
  li l-ammont tax-xog\u0127ol kien elf u \u0127ames mitt lira Maltin (LM1,500) u direct
  orders mill-Kunsilli Lokali ma jistg\u0127ux ja\u010b\u010bedu l-\u0127ames mitt
  lira Maltin (LM500), ixxog\u0127ol kien inqasam fi tlett quotations fejn wa\u0127da
  kienet g\u0127at-tne\u0127\u0127ija ta\u017c-\u017cibel, l-o\u0127ra kienet g\u0127al
  g\u0127eluq tal-aperturi u xi tik\u0127il u l-o\u0127ra kienet g\u0127at-tiswija
  tad-drena\u0121\u0121 u huwa ng\u0127ata dan ix-xog\u0127ol fl-a\u0127\u0127ar tas-sena
  2009.\\n\\nL-imputat stqarr max-xhud li s-Sindku Nicholas Dimech kien talbu sabiex
  l-ewwel \u0127las kellu jg\u0127addih lilu b\u0127ala apprezzament talli g\u0127addilu
  x-xog\u0127ol.\\n\\nL-imputat stqarr max-xhud li huwa g\u0127adda l-pagament lis-Sindku
  g\u0127aliex li kieku ma g\u0127amilx hekk huwa kien se jispi\u010b\u010ba ming\u0127ajr
  impjieg. I\u010b-\u010bekk kien ta\u0127ulu fl-uffi\u010b\u010bju li s-Sindku kellu
  ta'' Xbiex.\\n\\nWara li s-Sur Dimech kien tressaq il-Qorti fuq xi allegazzjonijiet
  li saru minn Stephen Buhagiar, s-Sur Dimech kien talab lill-imputat sabiex ma jg\u0127id
  xejn ma \u0127add rigward i\u010b\u010bekk li kien g\u0127addilu u g\u0127alhekk
  huwa qatt ma tkellem ma \u0127add rigward dan i\u010b-\u010bekk.\\n\\nL-imputat
  stqarr max-xhud li kien sellfu xi flus, i\u017cda dan sellifhomlu xhur wara li huwa
  kien g\u0127adda dan i\u010b-\u010bekk.\\n\\nSussegwentament \u0121ie arrestat Nicholas
  Dimech i\u017cda ma wie\u0121eb g\u0127al ebda domanda.\\n\\nFil-kors tal-investigazzjoni
  \u0121ie interrogat ukoll Patrick Pace fejn dan sostna li wara li kien ittie\u0127ed
  vot ta'' sfidu\u010bja fis-sindku Nicholas Dimech huwa beda jir\u010bievi xi theddid
  fosthom fuq facebook.\\n\\nPatrick Pace sostna li wara li Dr Joanna Gonzi kienet
  \u0121iet appuntata b\u0127ala Sindku u qabel ma dan kien se jattendi laqg\u0127a
  tal-kunsill huwa kien ir\u010bieva telefonata ming\u0127and Raymond Cachia fejn
  kien talbu sabiex jiltaqg\u0127u.\\n\\nMeta mar fuq il-post, s-Sur Cachia kien wieqaf
  ma vettura tal-g\u0127amla Peugeot u fiha kien hemm Nicholas Dimech u \u010bertu
  Jovain Hall u hemmhekk is-Sur Cachia kien qal lis-Sur Pace illi kien ikun a\u0127jar
  g\u0127alih li ma jattendix g\u0127al dik il-laqg\u0127a g\u0127aliex s-Sur Dimech\\n\\nkien
  se jikxfu ma kul\u0127add u jimmalafamah ma kul\u0127add li kien a\u010b\u010betta
  \u017cew\u0121 \u010bekkijiet ming\u0127andu.\\n\\nIx-xhud sostna li l-pulizija
  kien irri\u017cultala li fil-fatt is-Sur Pace kien ir\u010bieva xi \u0127lasijiet
  ming\u0127and is-Sur Dimech u kienu nbdew pro\u010beduri legali fil-konfront tieg\u0127u.
  L-g\u0127an tasSur Dimech kien li g\u0127al laqg\u0127a ma jkunx hemm quorum u s-Sur
  Pace ma kienx attenda g\u0127al laqg\u0127a. Il-laqg\u0127a kienet saret fit-3 ta''
  Novembru 2010.\\n\\nMin\u0127abba li s-Sur Pace kien indika li kienu sarulu \u017cew\u0121
  telefonati ming\u0127and Raymond Cachia bin-numru \u010bellulari 79262068, ix-xhud
  kien g\u0127amel request u rri\u017cultalu li dawn it-telefonati verament kienu
  saru. G\u0127alhekk ix-xhud kien arresta lill-imputat Raymond Cachia u dan ammetta
  mieg\u0127u li verament kien bleckmejla lis-Sur Pace u dan fuq struzzjonijiet ta''
  Nicholas Dimech.\\n\\nDwar dan il-fatt ix-xhud kien interroga lis-Sur Dimech, i\u017cda
  dan kien baqa'' sieket.\\n\\nIx-xhud esebixxa s-supplier history tal-Kunsill Lokali
  ta'' tas-Sliema g\u0127al dak li jirrigwarda s-Sur Raymond Cachia, payment voucher,
  purchase request form kif ukoll linvoice tas-Sur Cachia in konnessjoni ma\u010b-\u010bekk
  li sussegwentement \u0121ie ddepo\u017citat filkont bankarju ta'' Dimech, kopja
  ta'' deposit voucher, il-mandat t''arrest fil-konfront ta'' Raymond Cachia, stqarrija
  tal-imputat datata 11 ta'' Jannar 2011, stqarrija tal-imputat datata 12 ta'' Jannar
  2011, korrispondenza li l-pulizija r\u010beviet ming\u0127and GO mobile, stqarrija
