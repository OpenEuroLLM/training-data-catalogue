  Sandra Camilleri, Julian li i\u017cda ma ftakarx kunjomha, Marianne li i\u017cda
  ma ftakarx kunjomha u jista wkoll kien hemm ukoll b\u0127ala kunsillier Nikolai.\\n\\nSostna
