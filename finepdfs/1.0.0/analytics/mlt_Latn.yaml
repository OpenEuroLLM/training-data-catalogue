  Mozzjoni\\n\\nGiet ipprezentata mozzjoni Nru: Klg6/03 \u2013 Day Care Centre\\n\\n''
  Ir-residenti tal-Komunita'' G\u017cirjana llum igawdu minn servizz ta'' day care
  centre\\n\\nfil-lokalitajiet ta'' tas-Sliema u ta'' l-Imsida u d-Dipartiment kon\u010bernat
  jipprovdi servizz ta'' trasport sabiex ir-residenti tag\u0127na jkunu jistg\u0127u
  ju\u017caw dan is-servizz.\\n\\nIl-Kunsill Lokali tal-G\u017cira j\u0127oss li tkun
  sitwazzjoni aktar ideali jekk dan is-servizz jibda jing\u0127ata wkoll fil-Komunita''
  tag\u0127na stess.  Dan ikun ta'' konvenjent akbar g\u0127ar-residenti li permezz
  t''hekk ikunu aktar qrib ir-residenzi tag\u0127hom.\\n\\nIl-Kunsill Lokali tal-G\u017cira
  qed jara li dan jista'' jsir billi tintu\u017ca s-sala tal-Kunsill Lokali stess.\\n\\nHuwa
  g\u0127alhekk, li l-Kunsill Lokali tal-G\u017cira, permezz ta'' din il-mozzjoni
  jaqbel li g\u0127andu jag\u0127mel it-talba g\u0127at-tali servizz lill-Ministeru
  kon\u010bernat. ''\\n\\nDin il-mozzjoni \u0121iet proposta mis-Sindku u ssekondata
  mill-Vi\u010bi-Sindku Joe Galea u l-Kunsillier Charles Micallef St. John.\\n\\nWara
  diskussjoni qasira, l-Kunsill qabel unanimament ma'' din il-mozzjoni u g\u0127alhekk
  g\u0127andha tittie\u0127ed l-azzjoni ne\u010bessarja.\\n\\n8. Bdil ta'' Dekasteri
  tal-Kunsilliera\\n\\nRigward is-suggett sopracitat, ic-Chairman qal li l-Ambjent,
  Traffiku u Ordni Pubblika li kienu ta\u0127t ir-responsabilta'' tal-Kunsillier Joe
  Camilleri ser jaqg\u0127u ta\u0127t id-dekasteru tieg\u0127u filwaqt li l-Kunsillier
  Joe Camilleri ser ikun responsabbli mitTuri\u017cmu i\u017cda ser jibqa'' jirrappre\u017centa
  lill-Kunsill kemm fil-Kumitat Kon\u0121unt kif ukoll, fil-Kumitat tar-Re\u0121jun.\\n\\nHuwa
  kompla jg\u0127id, li apparti r-responsabbilitajiet li g\u0127andu l-Kunsillier
  Charles Micallef St. John kien ser ikun responsabbli wkoll tal-Kultura.\\n\\nIl-Kunsill
  qabel unanimament b''mozzjoni mressqa mi\u010b-Chairman, ssekondata millVi\u010bi-Sindku
  Joe Galea.\\n\\nIl-Kunsill \u0121ie nfurmat li l-Kumitat tar-Re\u0121jun kien ppropona
  li jin\u0127attru \u017cew\u0121 Avukati sabiex ja\u0121ixxu b\u0127ala debt collectors
  on a commission basis u dan min\u0127abba l-fatt li kemm il-Kumitat Kon\u0121unt
  u l-Kumitat tar-Re\u0121jun g\u0127andhom \u0127afna debituri.\\n\\nIl-Kunsillier
  Joe Camilleri nforma li kienet qed ti\u0121i diskussa l-possibilita'' li t-traffic
  signs u r-road markings kienu ser jaqg\u0127u ta\u0127t ir-responsabbilta'' tar-Re\u0121jun.\\n\\nIl-Kunsillier
  Joe Camilleri talab biex ji\u0121i sku\u017cat min\u0127abba li kellu jattendi g\u0127alllaqg\u0127a
  tal-Kumitat Kon\u0121unt li kienet fil-5.30 p.m.\\n\\nIl-Kunsill laqa'' din it-talba.\\n\\n9.
  Affarijiet O\u0127ra\\n\\n9.1 I\u010b-Chairman qal li fl-opinjoni tieg\u0127u fil-lokalita''
  hawn diversi reserved parkings li huma llegali u dan min\u0127abba l-fatt li meta
  l-persuna li g\u0127aliha tkun saret din irreserved parking ti\u0121i nieqsa, l-familjari
  jonqsu mill jirrappurtaw biex tittne\u0127\u0127a.\\n\\nG\u0127aldaqstant, huwa
  staqsa lill-Kunsillieri sabiex jirrappurtaw ir-reserved parkings li hawn fil-lokalita''
  sabiex din il-lista tintbag\u0127at lit-Transport Malta biex ti\u0121i konfermata.\\n\\n9.2
  Il-Kunsillier Victor Rutter qal li kien qed jir\u010bievi diversi lmenti dwar l-iskart
  li qed jin\u0127are\u0121 wara l-\u0127in tal-\u0121bir ta'' l-iskart spe\u010bjalment
  is-Sibt b''konsegwenza talfatt, li l-boro\u017c ji\u0121u mqatta mill-klieb u l-qtattes
  u l-kontenut jinxteret mat-triq u jibqa'' sat-Tnejn filg\u0127odu.\\n\\nHuwa kompla
  jg\u0127id, li din is-sitwazzjoni ma tag\u0127tix dehera tajba kemm g\u0127allambjent
  u lanqas g\u0127all-lokalita'' u talab li ti\u0121i nstallata tabella ta'' l-iskart
  mal-\u0127ajt tal-Collector''s items fi Triq Sliema.\\n\\n9.3 Il-Kunsillier J.M.
  Muscat informa li sewwieqa kienu qed jipparkjaw il-vetturi tag\u0127hom fuq il-bankini
  u anke fuq id-double yellow lines spe\u010bjalment fi Triq ix-Xatt.\\n\\nHuwa kompla
  jg\u0127id, li dawn mhux talli qed jiksru l-li\u0121i i\u017cda qed jikka\u0121unaw
  \u0127sarat fil-bankini.\\n\\n9.4 I\u010b-Chairman qal, li l-boundary wall ta''
  l-iskola jinsab fi stat ta'' negli\u0121enza partikularment il-fili li huma miftu\u0127in
  tant, li nstabu xi siringi fihom.  Huwa kompla jg\u0127id li kien ha l-inizjattiva
  u kien kellem lill-Ministru ta'' l-Edukazzjoni Evarist Bartolo dwar il-possibbilta
  li ssir manutenzjoni fuq dan il-\u0127ajt.\\n\\nHuwa nforma li dan ix-xog\u0127ol
  kien ser isir minn nies impjegati mal-Gvern pero'' kienu ser jag\u0127tu daqqa t''id
  ukoll in-nies li jaqg\u0127u ta\u0127t l-iskema Xog\u0127ol filKomunita''.\\n\\nIl-Kunsill
  qabel unanimament.\\n\\n9.5 Il-Vi\u010bi-Sindku qal li hemm b\u017conn li ji\u0121u
  nstallati tlett bus shelters, tnejn fi Triq ix-Xatt, \u0127dejn il-KFC , quddiem
  il-Bay View Hotel u ie\u0127or fi Triq Msida u xtaq ikun jaf jekk il-bus stop ta''
  l-Arriva li hemm fi Pjazza Meme'' Scicluna kienx g\u0127adu jintua\u017ca\\n\\nMatul
  id-diskussjoni li saret \u0121ie de\u010bi\u017c li l-Kunsill jikteb lit-Transport
  Malta dwar ilbus shelters u lid-ditta Arriva dwar il-bus stop.\\n\\n9.6 I\u010b-Chairman
  ta'' spjegazzjoni dwar il-laqg\u0127a li saret mat-Transport Malta fit-23 ta'' Mejju
  2013.  Huwa kompla jg\u0127id, li l-pjanti tal-pro\u0121ett Kappara Junction ser
  jitlestew sa l-a\u0127\u0127ar ta'' Lulju 2013, filwaqt li x-xog\u0127lijiet ser
  jibdew is-sena d-die\u0127la.\\n\\nIl-Kunsill \u0121ie nfurmat ukoll, li qabel ma
  jibdew ix-xog\u0127lijiet, it-Transport Malta ser issejja\u0127 laqg\u0127a t''informazzjoni
  g\u0127ar-residenti tal-madwar.\\n\\n10. Laqg\u0127a O\u0127ra\\n\\nPeress li ma
  kienx hemm affarijiet o\u0127ra g\u0127ad-diskussjoni, l-laqg\u0127a ntemmet fis6.30
  p.m. u \u0121iet a\u0121\u0121ornata g\u0127all-Erbg\u0127a 26 ta'' \u0120unju 2013,
  fil-5.00 p.m.\\n\\nRoberto Cristiano Sindku\\n\\nHugh Zammit A/Segretarju E\u017cekuttiv\\n\\nMOZZJONI\u00a0NRU:\u00a0Klg6/03a\\n\\nLill.\\n\\nKunsill\u00a0Lokali\u00a0G\u017cira\\n\\nMis\u2010\\n\\nSindku\\n\\nData\\n\\n20\u00a0ta''\u00a0Mejju\u00a02013\\n\\n\u0126in\\n\\n5.00\u00a0p.m.\\n\\nDay\u00a0Care\u00a0Centre\\n\\nKunsill\u00a0Lokali\u00a0ta''\u00a0\u00a0IL\u2010G\u017bIRA\\n\\nIr\u2010residenti\u00a0
  tal\u2010Komunita''\u00a0 G\u017cirjana\u00a0 llum\u00a0 igawdu\u00a0 minn\u00a0
  servizz\u00a0 ta'' Day\u00a0 Care\u00a0 Centrefil\u2010 lokalitajiet\u00a0 ta''\u00a0
  Tas\u2010Sliema\u00a0 u\u00a0 ta''\u00a0 l\u2010Imsida\u00a0 u\u00a0 d\u2010Dipartiment\u00a0
  kon\u010bernat\u00a0 jipprovdi\u00a0 servizz\u00a0 ta'' trasport\u00a0sabiex\u00a0ir\u2010residenti\u00a0tag\u0127na\u00a0jkunu\u00a0jistg\u0127u\u00a0ju\u017caw\u00a0dan\u00a0is\u2010servizz.\\n\\nIl\u2010Kunsill\u00a0Lokali\u00a0tal\u2010G\u017cira\u00a0j\u0127oss\u00a0li\u00a0tkun\u00a0sitwazzjoni\u00a0aktar\u00a0ideali\u00a0jekk\u00a0dan\u00a0is\u2010servizz\u00a0jibda\u00a0jing\u0127ata
  wkoll\u00a0fil\u2010Komunita''\u00a0tag\u0127na\u00a0stess.\u00a0\u00a0Dan\u00a0ikun\u00a0ta''\u00a0konvenjent\u00a0akbar\u00a0g\u0127ar\u2010residenti\u00a0li\u00a0permezz
  t''hekk\u00a0ikunu\u00a0aktar\u00a0qrib\u00a0ir\u2010residenti\u00a0tag\u0127hom.\\n\\nIl\u2010Kunsill\u00a0Lokali\u00a0tal\u2010G\u017cira\u00a0qed\u00a0jara\u00a0li\u00a0dan\u00a0jista''\u00a0jsir\u00a0billi\u00a0tintuza\u00a0s\u2010sala\u00a0tal\u2010Kunsill\u00a0Lokali\u00a0stess.\\n\\nHuwa\u00a0
  g\u0127alhekk,\u00a0 li\u00a0 l\u2010Kunsill\u00a0 Lokali\u00a0 tal\u2010G\u017cira\u00a0
  permezz\u00a0 ta''\u00a0 din\u00a0 il\u2010mozzjoni,\u00a0 jaqbel\u00a0 li\u00a0
  g\u0127andu jag\u0127mel\u00a0it\u2010talba\u00a0g\u0127at\u2010tali\u00a0servizz\u00a0lill\u2010Ministeru\u00a0kon\u010bernat.\\n\\nProponent:\\n\\nRoberto\u00a0Cristiano\\n\\nSindku\\n\\nSekondanti:\\n\\nCharles\u00a0Micallef\u00a0St.\u00a0John\\n\\nKunsillier\u00a0(Minority\u00a0Leader)\\n\\nJoe\u00a0Galea\\n\\nVi\u010bi\u2010Sindku\\n\\nLaqg\u0127a\u00a0Nru:\\n\\nKlg6\u00a0\u2013\u00a0kontinwazzjoni\\n\\n27.05.2013\"",
  "\"TRIBUNAL GHAL TALBIET ZGHAR\\n\\nGUDIKATUR DR. EDWINA GRIMA\\n\\nSeduta tat-13
  ta'' Ottubru, 2003\\n\\nTalba Numru. 1405/2002/1\\n\\nAgnes Cilia vs\\n\\nPaul Abela\\n\\nIt-Tribunal,\\n\\nRa
  l-Avviz fl-ismijiet premessi prezentat fit-3 ta'' Gunju, 2002, fejn intalab li l-konvenut
  jigi kkundannat ihallas lillattrici s-somma ta'' mitejn u ghoxrin lira Maltin (Lm220)
  rappresentanti hsarat sofferti fil-vettura ta''l-attrici talmarka Volkswagen Polo
  bin-numru ta'' registrazzjoni DBD 896 u dana wara illi hija xtrat unleaded petrol
  mill-pompa tal-petrol gestita mill-konvenut fi Triq Sciortino, Zebbug, liema petrol
  kien imhallat bl-ilma\\n\\nBl-ispejjez, inkluzi dawk ta''l-ittri interpellatorji
  tas-26 ta'' April 2002 u ta''l-10 ta'' Mejju 2002 kontra l-konvenut.\\n\\nRa r-risposta
  tal-konvenut ipprezentata fil-21 ta'' Gunju 2002, fejn gie ecceppit:\\n\\n1. Illi
  fl-ewwel lok mhux imfisser car ta'' x''hiex ezatt l-attrici qed tippretendi l-hlas
  ta'' Lm220, u cioe'' fl-ewwel lok jekk hux in linea ta'' danni, u fit-tieni lok,
  f''kaz li hu hekk, f''hiex ezatt jikkonsistu dawn id-danni u ghalhekk l-azzjoni
  attrici hija irritwali.\\n2. Sekondarjament, anki kieku kienet azzjoni ghad-danni
  l-attrici riedet tipprecedi it-talba taghha, b''talba ghaddikjarazzjoni tar-responsabbilta''
  ta''l-istess danni da parti tal-konvenut, u anki ghal din ir-raguni l-azzjoni hija
  irritwali.\\n3. Illi subordinatament l-ecippjent kien diga hallas lillattrici s-somma
  ta'' Lm15 ghas-saldu ta'' xi spejjez li hi inkorriet biex nehhiet xi ilma li seta
  kien hemm fil-fuel system tal-karozza taghha.\\n4. Illi kien biss wara xi erba xhur
  li l-attrici mbaghad bdiet tivvanta pretensjoni ulterjuri ghal hlas ta'' ammont
  ferm ikbar li l-eccippjent bl-ebda mod ma hu tenut li jaghmel tajjeb ghalih.\\n5.
  Illi ghalhekk it-talba attrici ghandha tigi michuda blispejjez.\\n\\nSema'' x-xhieda  ta''
  Philip Borg, Edwin Cilia, Kenneth Borg, Concetta Vella, Stefan Abela u tal-konvenut.\\n\\nHa
  konjizzjoni tac-cirkostanzi kollha tal-kaz u taddokumenti esebiti.\\n\\nIkkunsidra.\\n\\nIlli
  jirrizulta illi dwar il-fatti tal-kawza, ma hemmx wisq kontestazzjoni. L-attrici
  tallega illi sofriet danni fil-vettura taghha tal-marka Volkswagen Polo bin-numru
  ta'' registrazzjoni DBD 896, b''konsegwenza ta'' petrol imhallat bl-ilma illi hija
  hadet mill-pompa tal-petrol tal-konvenut. Ilkonvenut ma huwiex qieghed jikkontesta
  il-fatt illi filgurnata indikata mill-attrici u cioe'' fit-22 ta'' Dicembru 2001,
  huwa kien biegh ikkontaminat bl-ilma, u dana wara illi l-istess kien gie ikkonsenjat
  lilu b''dan il-mod, izda jallega illi huwa kien hallas diga ghal hsarat rapportati
  filvettura ta''l-attrici u inoltre huwa kien irrifondielha l-flus illi hija kienet
  hallset ghal petrol mibjugh lilha. Jallega ghalhekk illi l-hsara ilmentata mill-attrici
  madwar erba xhur wara li sehh dan l-incident, ma ghandha x''taqsam xejn mal-petrol
  mibjugh lilha mill-pompa tieghu.\\n\\nMhuwiex kontestat il-fatt illi hekk kif l-attrici
  imliet il-vettura taghha bil-petrol unleaded kontaminat bl-ilma, l-vettura taghha
  mal-ewwel waqqfet wara li kienet imxiet biss tul ta'' zewg vetturi. Kienet ikkuntattjat
  lil mechanic taghha Philip Borg li kien gie fuq il-post u ezamina l-karozza u b''hekk
  induna illi kien hemm l-ilma imhallat mal-petrol. Ilkonvenut ukoll mar dak il-hin
  stess fuq il-post kif sejjhitlu lattrici. Dan Borg kompla inehhi l-ilma u assigura
  lill-attrici illi hija kienet tasal sa H''Attard fejn kienet tghix, izda wara li
  saqet ftit metri ohra, l-vettura regghet waqqfet. Xi granet wara l-mechanic kien
  hadilha l-karozza ghat-tiswija u naddaf it-tank u minn fejn ighaddi l-petrol. Hija
  tghid li kien hadilha Lm15, liema ammont kien hallas l-konvenut, flimkien ma''l-Lm10
  tal-petrol li kienet hadet. F''din lokkazzjoni hija kienet avzat lil iben il-konvenut
  illi kienet qed izommhom responsabbli ghal kwalunkwe hsara ulterjuri li jista''
  ikollha fil-vettura taghha. L-attrici tikkontendi illi minn wara il-Milied il-vettura
  regghet bdiet taghtiha il-problemi, tant illi f''Jannar spiccat lanqas biss tistartja.
  Meta hija regghet haditha ghand il-mechanic huwa bidlilha ir-relay u hadilha Lm10
  ghal dan il-ghan. Fis-7 ta'' Frar 2002, l-vettura regghet waqqfet u din iddarba
  il-mechanic infurmaha illi kellha problema elettrika. Meta regghet waqqfet il-vettura
  fit-23 ta'' Marzu 2002 , hija hadet il-vettura ghand il-Continental Cars, fejn instab
  illi lpompa tal-petrol ma kenitx tajba u din kellha tinbidel. Ghal dan hija hallset
  l-ammont ta'' Lm189.78 u dana kif jirrizulta mid-Dokument AC2 esebiet a fol.26 ta''l-atti
  processwali.\\n\\nIlli din hija kwistjoni ghalhekk purament teknika u ghalhekk spetta
  lill-attrici tipprova illi hemm ness bejn il-hsara subita minnha fil-vettura taghha
  u l-agir tal-konvenut meta huwa bieghhilha il-petrol imhallat bl-ilma.\\n\\nL-attrici
  ghalhekk ipproduciet bhala xhieda lil Philip Borg, il-mechanic li kien sewwa l-vettura
  wara l-incident, u rappresentant tal-Continental Cars Limited fejn kienet inbiddlet
  il-pompa tal-petrol. Philip Borg huwa il-mechanic li kien jiehu hsieb il-vettura
  ta''l-attrici. Huwa jikkontendi illi sa dak in-nhar ta''l-incident, l-vettura ta''l-attrici
  qatt ma kellha hsarat u li dejjem ingiebet ghandu ghal service biss. Huwa ighid
  illi meta issejjah fuq il-post kien nehha madwar nofs litru ilma mill-vettura ta''l-attrici.
  Peress illi lvettura tal-attrici regghet waqqfet ftit wara huwa kien infurmaha illi
  kien hemm bzonn jinqala l-fuel tank sabiex jitbattal kompletament. Fil-fatt huwa
  hekk ghamel. Inoltre kien anke naddaf is-sistema kollha bil-filter u bil-fuel tank.
  Huwa ma kien biddel xejn mill-parts tal-vettura, izda semplicement naddafhom. Meta
  l-attrici regghet ilmentat mieghu xi gimgha wara illi l-vettura regghet waqfitilha,
  huwa kien sab illi ir-relay kien qatalha il-kurrent u ghalhekk kellu jinbidel. Din
  id-darba kien zamm Lm10 li kienet hallset l-attrici. Jikkontendi illi din il-hsara
  ma kellha xejn x''taqsam mal-kwistjoni ta''l-ilma fil-petrol u illi bilprocedura
  segwita minnu fejn kien naddaf il-filters kif ukoll it-tank tal-petrol, il-problema
  kienet giet risolta, ghalkemm ma setax jeskludi li jista'' ikun hemm problemi fil-fuel
  pump li tohrog wara ftit taz-zmien.\\n\\nIlli mid-dokument esebiet minn Edwin Cilia
  tal-MTC Towing services Limited, a fol. 27 ta''l-atti processwali jirrizulta illi
  bejn it-22 ta'' Dicembru 2001 u it-23 ta'' Frar 2002, l-vettura ta''l-attrici giet
  migbuda hames darbiet, darbtejn f''Dicembru, darba f''Jannar u darbtejn fi Frar.\\n\\nKenneth
  Borg in rappresentanza tal-Continental Cars Limited ighid illi l-vettura ta''l-attrici
  iddahlet ghat-tiswija peress illi kellha problemi fil-magna u dana peress illi din
  ma kenitx qed tistartja. Dana kien fit-28 ta'' Marzu 2002, meta kienet inbiddlet
  il-pompa tal-petrol, l-ispark plugs, ittemperature sender unit, l-fuel filter u
  low ring seal. Ixxhud spjega illi peress ili l-fuel pump, hija sealed unit, allura
  ikun impossibbli li tinfetah sabiex tigi ikkonstatata lhsara ikkagunata fl-istess.
  Huma ivverifikaw jekk kienx hemm xi ilma fil-fuel, meta jaraw hsara bhal din, izda
  ighid illi dak in-nhar fil-fuel tal-vettura, ilma ma instabx. Huwa jikkontendi illi
  l-fuel pump tieqaf tiffunzjona mhux immedjatament kif jittiehed il-petrol kontaminat,
  izda dejjem irid ighaddi ftit taz-zmien u dana madwar gimghatejn jew tlett gimghat.
  Huwa jikkontendi illi wiehed qatt ma jista'' ikun cert ghal kollox illi l-hsara
  fil-fuel pump sehhet minhabba illi kien ittiehed fuel ikkontaminat u dana ghaliex
  peress illi l-fuel pump hija sealed unit, in-natura tal-hsara ma tkunx tista tigi
  ikkonstatata. Fl-opinjoni tieghu, l-hsara fil-vettura ta''l-attrici u cioe'' fil-fuel
  pump tista'' tkun gejja mill-fatt illi ikun ghadda petrol imhallat blilma minnha,
  kif ukoll il-hsara tista'' tigi ikkagunata minhabba xi internal electrical fault.
  Rigward il-bdil talfilters, huwa ighid illi dana sar bhala prekawzjoni, filwaqt
  illi il-bdil fl-isparking plugs ma kellu xejn x''jaqsam ma'' dana il-fatt.\\n\\nL-attrici
  ipproduciet ukoll bhala xhud lil Concetta Vella, li sofriet hsara simili fil-vettura
  taghha wara li hija kienet xtrat il-petrol minn ghand l-konvenut. Din ix-xhud tikkontendi
  illi il-hsara sofferta fil-vettura taghha kienet giet ikkagunata mill-petrol imhallat
  bl-ilma illi hija kienet xtrat minn ghand il-konvenut. Dawna il-hsarat kienu gew
  imhallsa mill-konvenut, kif ukoll kien irrifondielha il-flus ghal petrol li kien
  taha. Dawna il-hsarat li hija sofriet f''Dicembru, kienet sewwiethom f''Jannar.
  Hija regghet kellha hsara fil-vettura taghha imbahgad f''Ottubru, u meta staqsiet
  lill-mechanic taghha jekk dawn kenux konnessi ma''l-incident ta'' Dicembru huwa
  qalilha li dan seta'' kien ilkas, izda ma setax ikun cert.\\n\\nIlli Stefan Abela,
  iben il-konvenut kien iktar involut f''dan lincident minn missieru. Huwa jikkonferma
  illi l-vettura ta''lattrici kienet waqqfet immedjatament kif hija xtrat il-petrol
  minn ghandhom. Hu kien mar fuq il-post meta kien gie ilmechanic Philip Borg u anke
  kien mar ghandu il-garage meta kien hemm il-vettura ta''l-attrici ghat-tiswija.
  Ighid illi huwa ra lil mechanic inehhi il-petrol kollu li kien hemm, naddafha mill-petrol
  ''il qadim u ghamel dak kollu necessarju sabiex il-vettura terga'' tahdem. Huwa
  ighid illi l-vettura kienet insaqet wara li isewwiet sahansitra kienet marret l-attrici
  stess biha ghandu sabiex huwa ihallasha lkont tal-mechanic u hu hekk ghamel. Hallasha
  ukoll ghal petrol hazin li kienet hadet. Wara dan huwa ma regax sema minn ghand
  l-attrici, izda kien biss seba xhur wara illi hija kienet regghet ressqet l-ilment
  taghha. Ighid illi wara dan l-incident missieru kien ha passi kontra lKorporazzjoni
  Enemalta minhabba dan il-fatt. Il-konvenut jikkonferma l-verzjoni moghtija mit-tifel
  tieghu. Jikkontendi illi wara li kien gie ta''l-Enemalta u issupplixxieh bil-petrol
  ikkontaminat, huwa lehaq qeda madwar tnejn jew tlett klijenti biss u kienet mara
  ohra biss illi kienet ilmentat millistess hsara ta''l-attrici. Huwa kien ha hsieb
  ihallas il-hsara ta'' din il-mara ukoll. Huwa cahad illi meta hallas lill-attrici,
  hija irriservat id-dritt illi terga'' tfittxu fil-kaz illi il-vettura taghha ikollha
  xi hsarat ulterjuri.\\n\\nIkkunsidra,\\n\\nIlli l-konvenut jissolleva zewg eccezzjonijiet
  preliminari u dana ta''l-irritwalita ta''l-azzjoni attrici, dana peress illi flewwel
  lok l-pretenzjoni ta''l-attrici ma hijiex imfissra b''mod car fl-avviz tat-talba
  u fit-tieni lok, peress illi ma tirrizultax talba dikjaratorja ta'' responsabbilta''
  tal-konvenut ghallincident mertu tal-kawza.\\n\\nIlli fir-rigward ta'' dawn iz-zewg
  eccezzjonijiet, ghandu jinghad illi l-proceduri quddiem it-Tribunal huma regolati
  b''dak li jiddisponi l-att numru V ta''l-1995. It-Tribunal ghandu il-kompetenza
  jiddeciedi kwalunkwe talba ghal hlas ta'' somma flus, liema talba hija dik illi
  qieghda taghmel l-attrici permezz ta-presenti istanza. Kwindi ma jirrizulta l-ebda
  irregolarita jew irritwalita fl-azzjoni kif proposta. Mit-talba jidher illi l-attrici
  qieghda tallega illi hija sofriet danni fil-vettura taghha meta hija xtrat il-petrol
  imhallat bl-ilma minn ghand il-konvenut. Huwa proprju dana il-fatt illi it-Tribunal
  irid jinvestiga u kwindi jekk ittalba ghal hlas ta''l-ammont tal-flus indikat fl-avviz
  huwiex wiehed gustifikat o meno. Fuq kollox it-Tribunal ma huwiex marbut strettament
  mar-regoli tal-procedura, izda ghandu jiddeciedi il-kawzi principalment fuq bazi
  ta'' ekwita, f''proceduri li ghandhom jitmexxew skond ilprincipji tal-gustizzja
  naturali. (Artikolu 7 u 9 tal-Kapitolu 308).\\n\\nIlli ghal dawn il-motivi, l-ewwel
  zewg eccezzjonijiet talkonvenut qed jigu michuda.\\n\\nL-eccezzjonijiet fil-mertu\\n\\nIlli
  l-konvenut jecepixxi inoltre illi huwa kien hallas lill-attrici is-somma ta'' Lm15
  ghas-saldu ta''l-ispejjez li inkorriet sabiex nehhiet l-ilma mill-fuel system tal-vettura
  taghha, u inoltre illi kien biss erba'' xhur wara illi hija tallbet il-hlas ta''l-ammont
  mitlub f''din il-kawza u li ghalhekk l-konvenut ma huwiex tenut jaghmel tajjeb ghalihom.\\n\\nIlli
  mill-kumpless tal-provi jirrizulta minghajr l-icken dubbju illi l-attrici sofriet
  hsara fil-vettura taghha minhabba l-petrol ikkontaminat illi hija akkwistat minn
  ghand il-konvenut. Dana l-konvenut ma jichdux tant illi kien anke hallas lillattrici
  il-Lm15 li zamm il-mechanic Philip Borg sabiex sewwa din il-hsara, kif ukoll kien
  irrifonda lill-attrici il-flus illi hija kienet hallset ghal petrol ikkontaminat
  illi hija xtrat.\\n\\nIlli madanakollu l-attrici tghid illi hija baqghet tilmenta
  illi lvettura taghha ma kenitx qieghda tistartja, minn dan lincident ''il quddiem.
  Fil-fatt mid-Dokument esebiet a fol.27 tal-process, kif ukoll mix-xhieda ta'' Edwin
  Cilia, jirrizulta illi l-vettura taghha kienet giet irmunkata f''diversi okkazzjonijiet.\\n\\nJirrizulta
  inoltre mix-xhieda prodotti illi l-vettura ta''l-attrici qatt ma kienet sofriet
  xi hsara jew breakdown u li kienet vettura piuttost gdida. Kien biss wara dan l-episodju
  illi lvettura taghha ma bdietx tistartja u li waqqfitilha diversi drabi fix-xhur
  ta'' wara, tant illi fl-ahhar kellu jinbidel il-fuel pump tal-vettura sabiex din
  regghet bdiet tiffunzjona sew mill-gdid.\\n\\nMadanakollu ma setax jigi ippruvat
  illi din il-hsara li l-attrici qieghda tirreklama permezz tal-presenti istanza hija
  strettament konnessa mal-petrol ikkontaminat illi hija hadet minn ghand l-konvenut.
  Il-mechanic Philip Borg jikkontendi illi huwa ghamel dak kollu li kien hemm bzonn
  illi isir meta l-vettura ta''l-attrici dahhlet ghandu ghat-tiswija ftit wara l-incident,
  kien qala il-fuel tank, battlu u naddaf anke il-filters. Kenneth Borg, rappresentant
  tal-Continental Cars Limited, min-naha tieghu ghalkemm ighid illi l-fuel imhallat
  bl-ilma jista'' iwassal ghal hsara fil-fuel pump bhal dik sofferta mill-attrici,
  madankollu jikkontendi illi din ilhsara setghet giet ikkagunata minn fatturi ohra
  bhal electrical fault f''xi unit tal-fuel pump. Jidher illi ma jista'' qatt ikun
  hemm konkluzjoni definittiva rigward ir-raguni li ikkaguna l-hsara f''din il-fuel
  pump peress illi din hija sealed unit u ma tinfetahx. Ix-xhud ighid ukoll illi din
  ilhsara meta gejja mill-fatt illi l-magna tkun riceviet fuel imhallat bl-ilma, ma
  tohrogx dejjem immedjatament, izda tista'' tohrog xi ftit gimghat wara.\\n\\nInoltre
  jirrizulta ukoll illi xi ftit wara illi l-mechanic Philip Borg  ghamel it-tiswijiet
  kollha necessarji, l-attrici sofriet hsara ohra fil-vettura taghha fejn gie mibdul
  ir-relay, li dana skond il-mechanic kien qata'' l-kurrent u kellu jinbidel. Din
  il-hsara ma kellha xejn x''taqsam mal-kwistjoni tal-fuel. Fil-fatt l-attrici hallset
  lill-mechanic hija personalment u ma irreklamatx dan l-ammont minn ghand l-konvenut
  f''dak iz-zmien.\\n\\nIlli ghalhekk it-Tribunal ihoss illi l-attrici ma irnexxiliex
  tipprova b''mod sodisfacenti illi l-hsara ilmentata minnha kienet konnessa ma''l-incident
  tal-fuel ikkontaminat li ghalih kien responsabbli l-konvenut u dana peress illi
  lhsara minnha rapporata fil-fuel pump tal-vettura taghha setghet giet ikkagunata
  minn fatturi ohra indipendenti.\\n\\nGhaldaqstant peress illi t-talba attrici ma
  tirrizultax soddisfacentement pruvata, it-Tribunal jaqta u jiddeciedi billi jichad
  it-talba attrici, bl-ispejjez ta'' dina l-istanza kontra taghha.\\n\\nKopja Informali
  ta'' Sentenza\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"QORTI TA'' L-APPELL KRIMINALI\\n\\nONOR. IMHALLEF MICHAEL MALLIA\\n\\nSeduta
  tat-18 ta'' Gunju, 2010\\n\\nAppell Kriminali Numru. 316/2009\\n\\nIl-Pulizija (Spt.
  Carlos Cordina) Vs Adrian Attard\\n\\nIl-Qorti,\\n\\nRat l-akkuza dedotta kontra
  l-appellant quddiem il-Qorti tal-Magistrati (Malta) bhala Qorti ta'' Gudikatura
  Kriminali talli fit-23 t''Awwissu, 2008, ghall-habta ta'' 22.45 hrs bhala persuna
  li ghandu l-licenzja tal-hanut tal-imbid jew xort spirituz bl-isem ta'' Venue Bar
  & Restaurant gewwa Blue Grotto Avenue, Zurrieq, ippermetta tlett it-tfal taht is-16
  ilsena biex jidhlu fil-post imsemmi, Kap. 10 L.S 10.40 Art. 6(2).\\n\\nRat is-sentenza
  tal-Qorti tal-Magistrati (Malta) bhala Qorti ta'' Gudikatura Kriminali tal-14 ta''
  Lulju, 2009, li biha,  wara li rat ir-regolamenti 2 u 6 tal-L.S. 10.40 (Regolamenti
  biex jinzamm il-Bon Ordni f''lokalitajiet ta'' Divertiment), sabet\\n\\nlill-appellant
  hati tal-akkuza migjuba fil-konfronti tieghu w ikkundannatu multa ta'' sitt mija
  w disgha w disghin Euro (\u20ac699).\\n\\nRat ir-rikors tal-appellant minnu pprezentat
  fl-24 ta'' Lulju, 2009, li bih talab li din il-Qorti joghgobha tirrevoka ssentenza
  appellata fejn sabet lill-appellant hati ta'' l-akkuza migjuba kontrih u minflok
  tilliberah minn kull imputazzjoni, htija w piena.\\n\\nFliet l-atti kollha processwali.\\n\\nRat
  il-fedina penali aggornata tal-appellant esebita millprosekuzzjoni fuq ordni tal-Qorti.\\n\\nRat
  illi l-aggravji tal-appellant fil-qosor, huma s-segwenti w cioe'':-\\n\\nIlli l-Ewwel
  Qorti ghamlet apprezzament hazin tal-provi prodotti, u dan peress illi minn l-atti
  processwali minn imkien ma jirrizulta illi fil-fatt, l-appellant huwa l-propjetarju
  ta'' l-istabbiliment imsemmi.  Jekk wiehed jara rregolament tal-ligi citat fis-sentenza,
  ta'' liema ksur lappellant instab hati ossia, r-regolament 6 u s-sub regolament
  5 ta'' L.S. 10.40 (Regolamenti biex jinzamm ilBon Ordni f''Lokalitajiet ta'' Divertiment),
  jirrizulta car u ampju illi r-responsabilita'' illi ma jidhlux persuni minuri flistabbiliment,
  tinkombi fuq il-propjetarju tal-fond.  F''dan ilkaz, il-prosekuzzjoni naqset milli
  tipprova illi l-appellant huwa fil-fatt il-propjetarju tal-fond imsemmi, u dan peress
  illi naqset milli tingungi xhieda jew ta'' l-anqas tipprovdi dokumentazzjoni f''dan
  is-sens.\\n\\nSolitament, f''kazijiet simili dejjem jigi ngunt rapprezentant ta''
  l-M.T.A illi jixhed dwar il-licenzja tal-fond in kwistjoni, u dwar il-kundizzjonijiet
  ta'' l-istess.  Fil-kaz in ezami, dan irrapprezentant ma tharrikx, u ghalhekk il-prosekuzzjoni
  naqset milli tipprovdi l-ahjar prova.  Din il-qorti ghalhekk ma tistax tistrieh
  fuq suppozizzjonijiet u ipotezijiet finnuqqas ta'' hard evidence li ghal xi raguni
  l-prosekuzzjoni ghazlet li ma tipproducihiex.\\n\\nLanqas ma giet esebita kopja
  tal-licenzja ta'' l-istess stabbiliment u ghalhekk ma ngabet ebda prova illi l-fond
  in\\n\\nkwistjoni m''ghandux perrmess sabiex fih jidhlu persuni minuri, hekk kif
  jipprovdu l-istess regolamenti.\\n\\nJirrizulta ghalhekk illi a bazi ta'' dawn l-aggravji,
  l-appellant qatt ma seta jinstab hati ta'' l-akkuzi migjuba fil-konfronti tieghu,
  u dan peress illi l-prosekuzzjoni naqset milli tipprova l-kaz taghha lil hinn minn
  kull dubju dettat mirraguni.\\n\\nIlli l-prosekuzzjoni naqset milli tipproduci lil
  dawn it-tlett persuni allegatament minuri bhala xhieda essenzjali meta wiehed iqis
  il-fatti speci ta'' dan il-kaz.  Fi proceduri simili, l-prosekuzzjoni dejjem tingungi
  lil dawn il-persuni quddiem il-Qorti tal-Magistrati sabiex jikkonfermaw il-presenza
  taghhom fil-lok, hin u post imsemmi.  Il-prosekuzzjoni naqset ukoll milli tipprovdi
  ta'' l-anqas id-dettalji ta'' dawn ittlett persuni.  Lanqas imqar ma ndikat isimhom
  jew kif waslet biex ikkonkludiet illi dawn il-tlett persuni kienu ghaliha minuri.  Fil-fatt
  fl-affidavit tal-Pulizija li kienu fuq ilpost ma hemm indikat ebda tip ta'' informazzjoni
  rigwardanti dawn it-tlett persuni illi allegatament kienu filpost imsemmi.  Dan
  ifisser illi l-prova illi kien hemm tlett minuti prezenti fil-fond imsemmi ma saritx.  La
  jkun safe u lanqas reasonable, illi l-Qorti tistrieh esklussivament fuq laffidavit
  tat-tlett Pulizija, meta dawn naqsu illi jgibu prova konkreta in sostenn ta'' dak
  li xehdu.  Inoltre, fin-nuqqas ta'' tali prova, din il-Qorti ma tistax tqies illi
  dawn it-tlett persuni kienu vera minorenni minn imkien ma jirrizulta. Fil-kamp penali,
  l-prosekuzzjoni obbligata illi tipprovdi lkaz taghha b''kull prova possibbli kemm
  favur u kemm kontra persuni illi tkun ghaddejja proceduri kriminali quddiem il-Qorti.\\n\\nFl-aghar
  ipotesi, anke jekk din il-Qorti jidhrilha illi lprosekuzzjoni rrnexxielha tipprova
  l-kaz taghha skond illigi, l-appellant jilmenta illi xorta ma kellux jinstab hati
  ta'' limputazzjonijiet migjuba kontra tieghu, u dan gharragunijiet suesposti.\\n\\nFil-proceduri
  odjerni xehed bhala xhud in difesa Philip Fenech, rapprezentant tal-G.R.T.U li spjega
  illi f''Malta lprassi hi illi minuri jithallew jidhlu gewwa postijiet hekk imsejha
  ta'' divertiment desiganted bhala restaurants anke jekk ikunu jbieghu inbid jew
  xorb spirituz, fil-bar taghhom kif fil-fatt fil-prattika kollha jaghmlu.  Fil-fatt
  spjega illi ghalkemm kull restaurant f''Malta jbiegh xorb ta'' dan it-tip,\\n\\nhuwa
  normali illi l-minuri jaccedi f''dawn il-postijiet (restaurants li maghhom ikollhom
  il-bar) u minghajr ma lPulizija tiehu ebda passi kriminali fil-konfront taghhom.
  Jekk din il-Qorti kellha taccetta d-definizzjoni restrittiva li tat l-Ewwel Qorti,
  ossia illi restaurant huwa post ta'' divertiment jekk ibiegh xorb spirituz u inbid,
  u ghalhekk ikollu anke bar allura ebda minuri ma jkun jista'' jaccedi go fihom fin-nuqqas
  ta'' permess specifiku.  L-appellant umilment jissottometti illi l-legislatur qatt
  ma kellu f''mohhu illi jaghti daqshekk definizzjoni restrittiva ta'' dan irregolament,
  fejn restaurant ghax ghandu l-bar jitqies post ta'' divertiment.\\n\\nIkkunsidrat
  :\\n\\nIrrizulta mill-provi illi fit-23 t''Awissu, 2008 ghall-habta ta'' 22.45 hrs,
  PC 1114 Marlon Hili, PC 1149 Aaron Debono u PS 850 Simon Buttigieg accedew fil-fond
  \\\"The Venue Bar and Restaurant\\\" illi hemm fi Vjal Blue Grotto, Zurrieq, u hemmhekk
  sabu tlett itfal taht l-eta''.\\n\\nPS 850 kellem lil Adrian Attard li ddentifika
  ruhu bhala \\\"licensee\\\" tal-fond u qallu illi kien se jiehu passi kontra tieghu
  talli ppermetta minnu fil-fond tieghu.\\n\\nL-akkuza giet ipprezentata quddiem il-Qorti
  tal-Magistrati fil-25 t''Ottubru 2008 u s-sentenza nghatat fl-14 ta'' Lulju 2009,
  fejn il-Prim''Istanza sabet lill-appellant hati.\\n\\nQuddiem dawn il-proceduri
  tela'' jixhed Philip Fenech li huwa deputat president tal-GRTU u rraprezenta l\\\"hospitality
  sector\\\".  Is-sur Fenech spjega illi huwa minnu illi fondi fejn jinbieghu xorb
  alkoholiku, tfal taht l-eta'' cioe'' taht sittax il-sena ma jidhlux pero'' fil-prattika
  din tapplika biss ghan-\\\"night clubs\\\" u \\\"wine bars\\\".  Fil-kazini u bars
  u pastizzeriji li wkoll ikollhom licenzja biex ibieghu l-ispirti tfal jidhlu.\\n\\nId-difiza
  argumentat illi l-unika prova illi kellha l-Qorti quddiemha kienu tlett affidavit
  tal-Pulizija fejn sabu tlett itfal fil-hanut.  Ma qalux min kienu dawn it-tfal u
  lanqas ma\\n\\ngiet prodotta l-licenzja tal-appellant.  B''dawn in-nuqqas ta'' provi
  l-appellant messu gie lliberat.\\n\\nIkkunsidrat :\\n\\nDin il-Qorti ma jidirlix
  illi dana huwa l-kaz.  L-affidavits huma provi permessi mill-Ligi u jekk l-appellant
  deherlu illi kellu jikkontesta tali affidavit hemm il-mezz kif seta'' jaghmel dan.\\n\\nL-appellant
  qatt ma nnega illi huwa ma kienx responsabbli ghal hanut u lanqas ma nnega illi
  kien hemm tfal taht l-eta'' fil-hanut tieghu.\\n\\nMa hemmx dubju illi l-lokalita''
  li kien qed jiggestixxi lappellant, kwalifika bhala lokalita'' ta'' divertiment
  fl-isfond tar-regolamenti 2 tal-LS 10.40 u l-prosekuzzjoni ma kienitx obbligata
  illi tipproduci l-licenzja tal-fond sakemm ma kienx hemm oggezzjoni minn naha tal-appellant
  illi l-fond imsemmi ma kienx wiehed li jirreferi ghalih ir-regolament fuq imsemmi.  Ladarba
  dan ma giex kontestat kwindi lEwwel Qorti ghamlet sew fejn qaghdet fuq ix-xhieda
  talPulizija fl-affidavit taghhom.\\n\\nIllum il-Ligi illi tkopri dawn il-fondi huma
  dawk ippubblikata permezz ta'' regolamenti biex jinzamm il-bon ordni fillokalitajiet
  tad-divertiment fil-5 ta'' Settembru 1995 LS 10.40 u l-ahhar emenda saret bl-Avviz
  Legali 93 tal-2008.\\n\\nGhalhekk il-Qorti trid tapplika din il-Ligi kif inhi u
  mhux kif ghandha tkun.  Jekk il-GRTU jidhrilha illi ghandha jkun hemm xi emendi
  dejjem tista'' taghmel il-proposti taghha f''dan ir-rigward u jekk kazini, bars
  jew pastizzeriji li jkollhom licenzja biex ibieghu lis-spirti m''ghandhomx ikunu
  kolpiti b''dawn ir-regolamenti, hija kwistjoni tal-legislatur u mhux ta'' din il-Qorti.\\n\\nHu
  x''hinu f''dan l-istadju rrizulta ampjament ippruvat illi dak inhar tal-akkuza kien
  hemm persuni taht l-eta'' fil-fond gestit mill-appellant u ma rrizultax illi ha
  xi mizuri sabiex dawn il-minuri jitkeccew mill-fond.\\n\\nKopja Informali ta'' Sentenza\\n\\nGhalhekk
  f''dak l-istadju skatta l-vot tal-Ligi fil-konfront tieghu w ghalhekk id-decizjoni
  tal-Ewwel Qorti kienet wahda korretta w setghet ragjonevolment u legalment tasal
  ghall-konkluzzjoni li waslet ghaliha fuq il-provi li kellha quddiemha.\\n\\nGhal
  dawn il-motivi l-Qorti taqta'' w tiddeciedi li tichad lappell u tikkonferma s-sentenza
  appellata.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"Kopja Informali ta'' Sentenza\\n\\nQORTI TA'' L-APPELL KRIMINALI\\n\\nONOR. IMHALLEF
  DAVID SCICLUNA\\n\\nSeduta ta'' l-4 ta'' Mejju, 2011\\n\\nAppell Kriminali Numru.
  159/2010\\n\\nApp. Nru. 159/2010 DS\\n\\nIl-Pulizija v.\\n\\nEmanuel Zahra\\n\\nIl-Qorti,\\n\\nRat
  l-imputazzjonijiet migjuba mill-Pulizija Ezekuttiva kontra Emanuel Zahra talli:\\n\\n(1)
  f''Ottubru 1999 volontarjament hassar, ghamel hsara jew gharraq hwejjeg haddiehor,
  mobbli jew immobbli, billi waqqa'' kamra li tinsab f''ghalqa maghrufa \\\"Ta'' l-Imsaqqfa\\\"
  fil-Gudja, liema kamra hija maghrufa bhala \\\"Il-Barumbara\\\", ghad-dannu tal-Ghaqda
  Muzikali Marija Assunta, Gudja, liema hsara ma teccedix il-hamsin lira Maltin (Lm50);\\n\\n(2)
  f''dawn l-ahhar xhur, bla hsieb li jisraq jew li jaghmel hsara kontra l-ligi, izda
  biss biex jezercita jedd li jippretendi li ghandu, ghalaq bil-gebel entratura li
  kien hemm minn dejjem fl-ghalqa maghrufa bhala \\\"Ta'' lImsaqqfa\\\" fil-Gudja
  ghad-dannu ta'' l-istess Ghaqda Muzikali Marija Assunta, Gudja;\\n\\nRat is-sentenza
  tal-Qorti tal-Magistrati (Malta) bhala Qorti ta'' Gudikatura Kriminali ta'' l-24
  ta'' Marzu 2010 li permezz taghha dik il-Qorti sabet lill-imsemmi Emanuel Zahra
  hati ta'' l-imputazzjonijiet dedotti kontra tieghu u, wara li rat lartikoli 85,
  28A u 325(1)(c) tal-Kap. 9 tal-Ligijiet ta'' Malta, ikkundannatu xahrejn prigunerija
  sospizi ghal sitt xhur. Dik il-Qorti inoltre ordnat li l-istess Emanuel Zahra jerga''
  jibni l-istrutturi li kien hemm ezistenti qabel id-data ta'' l-akkuza, u dan ai
  termini ta'' l-artikolu 85(2) tal-Kap. 9 tal-Ligijiet ta'' Malta, fi zmien tliet
  xhur u, fin-nuqqas, awtorizzat lillkwerelanti jergghu jibnu l-istess strutturi bl-assistenza
  talPulizija a spejjez ta'' l-appellant (allura imputat);\\n\\nRat ir-rikors ta''
  appell ta'' Emanuel Zahra pprezentat fis-6 ta'' April 2010 li permezz tieghu talab
  li din il-Qorti tirrevoka s-sentenza appellata billi tiddikjarah mhux hati ta''
  limputazzjonijiet migjuba kontra tieghu u konsegwentement tilliberah minn kull htija
  u piena skond il-ligi jew, alternattivament, f''kaz ta'' sejbien ta'' xi htija,
  billi tinfliggi piena iktar konfacenti mac-cirkostanzi tal-kaz;\\n\\nRat l-atti
  kollha tal-kawza;\\n\\nRat il-fedina penali aggornata ta'' l-imsemmi Emanuel Zahra
  esebita mill-prosekuzzjoni b''ordni tal-Qorti;\\n\\nSemghet ix-xhieda;\\n\\nSemghet
  it-trattazzjoni;\\n\\nIkkunsidrat:\\n\\nL-aggravji ta'' l-appellant huma fil-qosor
  is-segwenti: (1) li l-ewwel Qorti tat interpretazzjoni manifestament skorretta tal-fatti
  riferibbilment ghall-ewwel imputazzjoni; (2) li, sussidjarjament u bla pregudizzju,
  anke kieku kellu jigi ritenut li l-appellant ghamel xi hsara volontarja, ma jistax
  jifhem kif jista'' jigi ordnat li jerga'' jibni l-istruttura llegali li kien hemm
  qabel id-data ta'' l-akkuza, jew kif il-kwerelanti jistghu jigu awtorizzati jibnuha
  huma; (3) li t-tieni imputazzjoni ma hi sorretta minn ebda prova; (4) li l-piena
  mhijiex konfacenti mac-cirkostanzi tal-kaz.\\n\\nDwar l-ewwel aggravju l-appellant
  jghid li minn qari tassentenza appellata jirrizulta car li l-ewwel Qorti hasbet
  li dak li waqqa'' ma kinitx l-ispeci ta'' kamra originarjament mibnija minnu izda
  l-kamra tan-nar innifisha. Il-kamra tannar qatt ma ntmesset mill-appellant u dak
  li waqqa'' kienet speci ta'' kamra li kien bena hu stess u li, ad insaputa tieghu,
  kienet bdiet tintuza mill-Ghaqda Muzikali peress illi ma setghux jahdmu n-nar fl-istess
  post fejn kienu jistivawh. Skond l-appellant, din il-kamra maghrufa bhala t-\\\"Tinda\\\"
  huwa waqqaghha wara l-hrug ta'' Enforcement Notice mill-MEPA. L-appellant jaghmel
  referenza ghaxxiehda ta'' l-enforcement officer John Bonnici f''dar-rigward, u jghid
  li huwa ma ghamel xejn hlief obda ordni  moghtija minn Awtorita` legittima. Sussidjarjament,
  l-appellant jghid li anke kieku kellu jigi ritenut li huwa ghamel xi hsara volontarja
  lill-kwerelanti meta nehha l-istruttura msemmija, ma jistax jifhem kif jista'' jigi
  ordnat li jerga'' jibni l-istruttura llegali li kien hemm ezistenti qabel id-data
  ta'' l-akkuza, jew kif il-kwerelanti jistghu jigu awtorizzati jibnu tali struttura
  huma a spejjez ta'' l-appellant.\\n\\nDin il-Qorti ezaminat bir-reqqa l-provi kollha
  u tikkonkludi mill-ewwel li l-kamra mertu tal-proceduri odjerni m''ghandha x''taqsam
  xejn mal-kamra li dwarha kien inhareg enforcement notice mill-MEPA. L-enforcement
  notice nhareg in konnessjoni ma'' kamra u hajt (boundary wall) kif jirrizulta mid-dokumenti
  esibiti minn Joseph Bonnici a fol. 49 sa 54. Il-kamra mertu ta'' dawn ilproceduri,
  aktar milli kamra, kienet bazikament tinda maghmula minn pjanci jserrhu fuq tankijiet
  u serratizzi jew pajpijiet u li kienet tinsab biswit xi sigar fuq in-naha opposta
  tal-kamra li fuqha kien inhareg l-enforcement notice. Ara xiehda ta'' Anthony Agius
  u d-dokumenti a fol. 14 u 15.\\n\\nAnthony Agius xehed illi din il-\\\"kamra\\\"
  bil-pjanci kien tellaghha hu u kienet tintuza biex isir it-tahlit mehtieg ghall-manifattura
  tan-nar (fireworks). Huwa qal li gurnata minnhom l-appellant tfacca rrabjat u qallu
  jnehhi l-karti li kien hemm ghax hemm tieghu, u qabad u qaleb kollox. Dwar dan l-incident
  sar rapport lill-Pulizija, bhalma xehed P.S. 1386. Din ix-xiehda mhijiex kontradetta
  peress illi huwa ovvju li fix-xiehda tieghu l-appellant jitkellem dwar xi haga kompletament
  differenti. Ghalhekk l-ewwel imputazzjoni li l-appellant ghamel hsara volontarja
  ghaddannu ta'' l-Ghaqda Muzikali Marija Assunta tal-Gudja giet debitament ippruvata.
  Li ma sar l-ebda prova dwaru huwa l-valur tal-hsara kawzata, u ghalhekk ir-reat
  ipotizzat irid jitqieghed fil-parametri tal-paragrafu (d) tas-subartikolu (1) ta''
  l-artikolu 325 tal-Kodici Kriminali u mhux fil-paragrafu (c), cioe` fejn il-valur
  tal-hsara ma jkunx jiskorri tlieta u ghoxrin euro u disgha u ghoxrin centezmu (\u20ac23.29).\\n\\nIt-tieni
  imputazzjoni tirrigwarda r-reat ta'' ragion fattasi, izda \u2013 u dan jidher li
  sfugga lill-ewwel Qorti \u2013 dwar incident li m''ghandu x''jaqsam xejn ma'' l-incident
  kontemplat fl-ewwel imputazzjoni. Difatti l-appellant qieghed permezz tat-tieni
  imputazzjoni jigi akkuzat illi kkommetta r-reat ta'' ragion fattasi billi ghalaq
  bil-gebel entratura li kien hemm fl-ghalqa \\\"Ta'' l-Imsaqqfa\\\" ghaddannu tal-Ghaqda
  Muzikali Marija Assunta tal-Gudja, u dan \\\"f''dawn l-ahhar xhur\\\" qabel is-26
  ta'' Awissu 2000 (data li fiha nharget ic-citazzjoni), mentri l-ewwel imputazzjoni
  tirrigwarda x-xahar ta'' Ottubru 1999. Millprovi jirrizulta li hadd mir-rapprezentanti
  ta'' l-imsemmija Ghaqda Muzikali ma qal xejn dwar l-gheluq ta'' xi entratura. U
  ghalkemm Joseph Bonnici xehed dwar enforcement notice li nhareg mill-MEPA dwar hajt
  bilgebla tal-franka gholi seba'' filati mibni minghajr permess izda li sussegwentement
  inhareg permess fuqu, ma hemm l-ebda prova jekk dan il-hajt huwiex l-istess hajt
  li ghalih tirreferi t-tieni imputazzjoni. Konsegwentement ittieni imputazzjoni ma
  tirrizultax.\\n\\nFis-sentenza taghha l-ewwel Qorti ordnat lill-appellant, ai termini
  ta'' l-artikolu 85(2) tal-Kap. 9 tal-Ligijiet ta'' Malta, jerga'' jibni l-istrutturi
  li kien hemm ezistenti qabel id-data ta'' l-akkuza. Peress illi l-ewwel Qorti sabet
  htija dwar ittieni imputazzjoni, hija setghet tordna, a tenur ta'' limsemmi artikolu
  85(2), ir-ripristinar ta'' l-ispoll kontemplat f''dik it-tieni imputazzjoni, u cioe`
  billi tordna li jerga'' jiftah lentratura li allegatament ghalaq. Peress illi t-tieni
  imputazzjoni ma tirrizultax, l-ordni tal-Qorti a tenur ta'' limsemmi artikolu 85(2)
  se tigi revokata.\\n\\nKwantu ghall-piena, stante li l-appellant se jigi dikjarat
  hati ta'' l-ewwel imputazzjoni fil-parametri tal-paragrafu (d) tassubartikolu (1)
  ta'' l-artikolu 325, u stante li se jigi dikjarat mhux hati tat-tieni imputazzjoni,
  hemm lok ta'' temperament fil-piena. Din il-Qorti tixtieq tirrimarka wkoll illi
  filwaqt illi l-ewwel Qorti ssospendiet is-sentenza ta'' prigunerija ghal perijodu
  ta'' sitt xhur, l-artikolu 28A talKap. 9 tal-Ligijiet ta'' Malta jipprovdi li l-perijodu
  operattiv m''ghandux ikun inqas minn sena.\\n\\nGhal dawn il-motivi:\\n\\nTiddeciedi
  billi tirriforma s-sentenza appellata,  tirrevokaha in kwantu sabet lill-appellant
  hati li kkaguna hsara volontarja kif akkuzat u liema hsara ma teccedix il-hamsin
  liri Maltin (Lm50) u minflok issibu hati talli f''Ottubru 1999 volontarjament hassar,
  ghamel hsara jew gharraq hwejjeg haddiehor, mobbli jew immobbli, billi waqqa'' kamra
  li tinsab f''ghalqa maghrufa \\\"Ta'' l-Imsaqqfa\\\" fil-Gudja, liema kamra hija
  maghrufa bhala \\\"Il-Barumbara\\\", ghad-dannu tal-Ghaqda Muzikali Marija Assunta,
  Gudja, liema hsara ma tiskorrix tlieta u ghoxrin euro u disgha u ghoxrin centezmu
  (\u20ac23.29), tirrevokaha in kwantu sabet lillappellant hati tat-tieni imputazzjoni
  u minflok tiddikjarah mhux hati ta'' dik l-imputazzjoni u minnha tilliberah, tirrevokaha
  wkoll in kwantu kkundannat lill-appellant ghal xahrejn prigunerija sospizi ghal
  sitt xhur u in kwantu ordnat li l-appellant jerga'' jibni l-istrutturi li kien hemm
  ezistenti qabel id-data ta'' l-akkuza, u dan ai termini ta'' lartikolu 85(2) tal-Kap.
  9 tal-Ligijiet ta'' Malta, fi zmien tliet xhur u, fin-nuqqas, awtorizzat lill-kwerelanti
  jergghu jibnu l-istess strutturi bl-assistenza tal-Pulizija a spejjez ta'' lappellant,
  u minflok, a tenur ta'' l-artikolu 22 tal-Kap. 446 tal-Ligijiet ta'' Malta, tilliberah
  bil-kondizzjoni li ma jaghmilx reat iehor matul il-perijodu ta'' sitt xhur millum.
  A tenur tassubartikolu (3) ta'' l-imsemmi artikolu 22, din il-Qorti fissret lill-appellant
  bi kliem li jiftiehem sew li jekk jaghmel reat iehor matul il-perijodu ta'' liberazzjoni
  kondizzjonata, ikun jista'' jinghata sentenza ghar-reat originali.\\n\\n< Sentenza
  Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"IM\u0126ALLFIN\\n\\nS.T.O. PRIM IM\u0126ALLEF MARK CHETCUTI ONOR. IM\u0126ALLEF
  GIANNINO CARUANA DEMAJO ONOR. IM\u0126ALLEF ANTHONY ELLUL\\n\\nSeduta ta'' nhar
  it-Tnejn, 13 ta'' Lulju, 2020.\\n\\nNumru 6\\n\\nRikors numru 92/2004PC\\n\\nJeffrey
  u Annie konju\u0121i Farrugia\\n\\nv.\\n\\nSalvina Xuereb mart Carmelo Xuereb f''isimha
  u b\u0127ala mandatarja ta'' \u0127utha imsefrin Concetta Carmelo Vella; Lorenzo
  Xuereb; Giuseppa mart Nikola Xerri; u Carmela mart John Cassar; u b''digriet tat-3
  ta'' Marzu 2005 Carmelo Cauchi kien awtorizzat jintervjeni in statu et terminis;
  u b''digriet tas27 ta'' Lulju 2007 Mario Cauchi, Joseph Cauchi u Jane mart Carmel
  Vella kienu awtorizzati jintervjenu in statu et terminis\\n\\nIl-Qorti:\\n\\n1.
  L-atturi appellaw mis-sentenza tal-Qorti tal-Ma\u0121istrati (G\u0127awdex) \u0120urisdizzjoni
  Superjuri Sezzjoni \u0120enerali tal-24 ta'' Ottubru 2017, li biha laqg\u0127et
  l-e\u010b\u010bezzjoni tal-konvenuti fir-rigward ta'' art bl-isem ta'' Fonzu,\\n\\nXewkija,
  G\u0127awdex sabiex ma jbieg\u0127ux l-art lill-atturi min\u0127abba qerq, u \u010ba\u0127det
  it-talbiet tal-atturi in kwantu tirreferi g\u0127all-imsemmija art.  Fi\u010b\u010bitazzjoni
  l-atturi talbu sabiex il-Qorti:\\n\\n\\\"1. Tikkundannakom tersqu g\u0127all-pubblikazzjoni
  tal-att ta'' bejg\u0127 favur latturi tal-art hawn fuq deskritti, bil-kundizzjonijiet
  elenkati fl-istess konvenju.\\n\\n\\\"2. Ta\u0127tar kuratur sabiex jirrapre\u017centa
  lill-eventwali kontuma\u010bi fuq dan l-att, liema att g\u0127andu jsir ad opera
  tan-Nutar Pubbliku Kristen Dimech, jew Nutar ie\u0127or illi ji\u0121i sostitwit
  g\u0127alih, fil-jum, \u0127in u lok illi ji\u0121i g\u0127aldaqstant iffissat minn
  din il-Qorti\\\".\\n\\n2. Il-parti dispo\u017cittiva tas-sentenza taqra:-\\n\\n\\\"1.Filwaqt
  illi tilqa'' l-e\u010b\u010bezzjonijiet tal-konvenuta proprio et nomine firrigward
  (a) tal-art ta'' Fonzu msemmija fil-konvenju tat-23 ta'' Frar 2004, min\u0127abba
  qerq da parti tal-attur, u (b) l-ishma mir-raba'' ''ta\u010b-\u010anus ta'' San
  Gwann'' kif indikati fi\u010b-\u010bitazzjoni, min\u0127abba skorrettezza fihom,
  ti\u010b\u0127ad ittalba tal-atturi biex il-konvenuta proprio et nomine ti\u0121i
  m\u0121ieg\u0127la tersaq g\u0127all-kuntratt tal-bejg\u0127 tal-istess raba'' ''ta''
  Fonzu'', mentri tilqa'' t-talba tag\u0127hom fir-rigward tal-bejg\u0127 tar-raba''
  ''ta\u010b-\u010anus ta'' San Gwann'' imsemmija f''dan il-konvenju, b''dana li l-ishma
  tal-konvenuta proprio et nomine minn dan ir-raba'' huma kif stabbiliti f''din is-sentenza
  u mhux kif indikati fi\u010b-\u010bitazzjoni.\\n\\n\\\"2.G\u0127all-fini tal-pubblikazzjoni
  tal-kuntratt relattiv, tinnomina lin-Nutar Dr Kristen Dimech li g\u0127andu jippubblika
  dan l-att nhar is-Sibt 16 ta'' Di\u010bembru 2017 fl-uffi\u010b\u010bju tieg\u0127u
  fl-g\u0127axra u nofs ta'' filg\u0127odu (10.30a.m) u lill-Avukat Dottor Claire
  Caruana g\u0127all-eventwali kontuma\u010bi.\\n\\n\\\"Fi\u010b-\u010birkostanzi
  partikolari tal-ka\u017c, l-ispejje\u017c g\u0127andhom ikunu sopportati nterament
  mill-atturi. Dawk tal-intervenuti fil-kaw\u017ca jibqg\u0127u a karigu tag\u0127hom\\\".\\n\\n3.
  Il-parti rilevanti tas-sentenza g\u0127all-finijiet tal-appell tal-atturi hi ssegwenti:\\n\\n\\\"Illi
  permezz ta'' din il-kaw\u017ca l-atturi qed jittentaw jiksbu l-esekuzzjoni ta''
  konvenju redatt bejnhom u l-konvenuta proprio et nomine u o\u0127rajn dwar il- bejg\u0127
  lilhom ta'' \u017cew\u0121 bi\u010b\u010biet raba'' fix-Xewkija, G\u0127awdex. Ilkonvenuta
  proprio et nomine qed tirrifjuta li tersaq g\u0127all-kuntratt relattiv g\u0127ax
  allegatament dan kien ivvizzjat b''qerq u ra\u0121\u0121iri li bihom \u0121iet ingannata
  f''diversi elementi tieg\u0127u.\\n\\n\\\"G\u0307ara illi l-partijiet flimkien ma''
  o\u0127rajn, kollha werrieta ta'' \u010bertu Salvatore Spiteri, kienu ilhom sa mis-sena
  elf disa'' mija u tmienja u disg\u0127in (1998) involuti f''kaw\u017ca g\u0127ad-divi\u017cjoni
  tal-assi ereditarji tieg\u0127u. Fil-mori tassmieg\u0127 ta'' dik il-kaw\u017ca
  l-partijiet ftehmu li jipprovaw isibu l-bejg\u0127 talbeni mmobbli formanti parti
  minn dan il-wirt biex jevitaw li dawn jin\u0121iebu g\u0127all- bejg\u0127 b''li\u010bitazzjoni
  ordnata mill-Qorti. Wara li g\u0127al xi ra\u0121uni jew o\u0127ra ma rnexxilhomx
  jiltaqg\u0127u fl-uffi\u010b\u010bju ta'' xi \u0127add mill-avukati li kienu qed
  jippatro\u010binawhom f''dik il-kaw\u017ca, l-partijiet iltaqg\u0127u fil-garage
  ta'' wie\u0127ed mill-kondividendi. Fl-14 ta'' Frar 2004 \u0121iet iffirmata skrittura
  li permezz tag\u0127ha ftehmu li jipprovaw isibu l-bejg\u0127 ta'' dawn il-beni
  mmobbli g\u0127all- prezz indikat fuq l-istess skrittura. Sa \u0121img\u0127a wara
  kien instab il-bejg\u0127 g\u0127al tnejn minn dawn il-beni, u \u010bioe'' \u017c-\u017cew\u0121
  bi\u010b\u010biet raba'' mertu ta'' din il-kaw\u017ca. Minnufih fit-23 ta'' Frar
  2004 \u0121ie ffirmat ilkonvenju in kwistjoni. Skont l-istess konvenju l-att finali
  kellu jsir sa mhux aktar tard minn sitt xhur minn dik id-data. Meta kienet qed toqrob
  l-iskadenza ta'' dan il-konvenju, u peress li kien hemm suspett li lkonvenuta proprio
  et nomine ma kenitx ser tersaq g\u0127all-kuntratt, l-atturi, biex jissalvagwardjaw
  id-drittijiet tag\u0127hom skont il-li\u0121i, bag\u0127tulha ittra uffi\u010b\u010bjali
  biex jintimawha tersaq g\u0127all-pubblikazzjoni tieg\u0127u. Billi lkonvenuta baqg\u0127et
  inadempjenti, saret il-kaw\u017ca relattiva entro tterminu kon\u010bess mill-li\u0121i
  bl-artikolu 1357 tal-Kap. 16.\\n\\n\\\"Kif jirri\u017culta mill-e\u010b\u010bezzjonijiet
  mog\u0127tija mill-konvenuta proprio et nomine, hija rrifjutat li tersaq g\u0127al
  dan il-kuntratt g\u0127ax allegatament \u0121iet ingannata dwar il-valur reali ta''
  dawn il-beni u s-sehem proprju tag\u0127ha u ta'' \u0127utha mill-istess proprjeta`''.\\n\\n\\\"Fil-ka\u017c
  in e\u017cami jirri\u017culta li meta l-partijiet iltaqg\u0127u fil-garage ta''
  Carmelo Cauchi, l-intenzjoni kienet li jippruvaw isibu huma stess ilbejg\u0127 tal-beni
  in divi\u017cjoni spettanti lilhom mill-eredita'' ta'' Salvatore Spiteri, antenat
  komuni tag\u0127hom, biex jevitaw li dawn jin\u0121iebu g\u0127allbejg\u0127 in
  subbasta, b\u0127ala konsegwenza ta'' sentenza fil-kaw\u017ca g\u0127addivi\u017cjoni
  tal-istess beni li kienet g\u0127adha pendenti, u dana fuq su\u0121\u0121eriment
  li kien sar waqt is-smieg\u0127 tal- kaw\u017ca. Huwa evidenti li min assista lin-nutar
  Dimech biex jirredi\u0121i l- iskrittura tal-14 ta'' Frar 2004, kellu f''idejh ir-rapport
  tal-periti \u0121udizzjarji nominati fil-kaw\u017ca g\u0127addivi\u017cjoni . Dan
  g\u0127aliex jidher li l-prezzijiet li \u0121ew iffissati fuq dik l-iskrittura kienu
  bba\u017cati fuq l-istejjem li kien g\u0127amel il-perit Emanuel Vella b\u0127ala
  perit tekniku f''dik il-kaw\u017ca. Stranament pero'', filwaqt illi g\u0127all-beni
  mmobbli l-o\u0127ra kollha il-prezz li l-partijiet ftehmu dwaru kien xi ftit jew
  wisq og\u0127la minn dak li kien iffissa l-perit tekniku, fir-rigward tar- raba''
  \\\"ta'' Fonzu\\\", il-partijiet \u017cammew e\u017cattament il-prezz li kien stabilixxa
  lperit tekniku, u \u010bioe'' dak ta'' Lm130,000, bid-differenza kbira, pero'',
  illi g\u0127alkemm il-perit tekniku kien stabilixxa dan il-valur g\u0127an-nofs
  indivi\u017c ta'' dan ir-raba'', fl-iskrittura in kwistjoni, \u0121ie dikjarat:\\n\\n\\\"(5)
  il-bicca art ''ta'' Fonzu'', Xewkija, Ghawdex, tal-kejl ta'' circa 4495 m.k. jew
  kejl verjuri, ghall-prezz ta'' Lm130,000. ...\\\".,\\n\\n\\\"bl-intendiment g\u0127alhekk
  li l-intier tar-raba'' kollu kellu jinbieg\u0127 g\u0127al dak il- prezz, u mhux
  biss in-nofs indivi\u017c tieg\u0127u, u g\u0127alhekk il-valur ta'' din lart kien
  qed ji\u0121i dimezzat, minflok ma jing\u0127ata prezz og\u0127la b\u0127al ma sar
  g\u0127all- beni l-o\u0127ra.\\n\\n\\\"G\u0127all-eredi l-o\u0127ra ta'' Salvatore
  Spiteri, firmatarji ta'' dik l-iskrittura, dan ma kien ser jag\u0127mel ebda differenza,
  g\u0127ax b\u0127ala werrieta tieg\u0127u, huma setg\u0127u jibbenefikaw biss mir-rikavat
  tal-bejg\u0127 tan-nofs indivi\u017c ta'' dik lart, u l-prezz ta'' Lm130,000 kien
  appuntu l-valur stabilit g\u0127an-nofs indivi\u017c tag\u0127ha. Imma g\u0127all-konvenuta
  u \u0127utha, ulied Vincenza Spiteri, kien ser ifisser telf ta'' mill-inqas Lm130,000
  o\u0127ra bejniethom. Dan pero'' l-konvenuta saret taf bih wara li kkonsultat ma''
  avukat li ma kenitx illegali tag\u0127ha fil-kaw\u017ca g\u0127ad-divi\u017cjoni,
  imma sfortunatament meta kien \u0121ia \u0121ie ffirmat il-konvenju tat-23 ta''
  Frar 2004. Dakinhar saret taf li Salvatore Spiteri kellu biss in-nofs indivi\u017c
  minn dik l-art, kif wara kollox kien \u0121ia \u0121ie konfermat mill-periti \u0121udizzjarji
  fir-relazzjoni tag\u0127hom, g\u0127ax in-nofs indivi\u017c l-iehor kien jappartjeni
  lill-ommha, it-tieni mara tieg\u0127u, billi din l-art kienet inxtart waqt i\u017c-\u017cwie\u0121
  tieg\u0127u mag\u0127ha. Din irrivelazzjoni kienet g\u0127alhekk tbiddel g\u0127al
  kollox is-sitwazzjoni. Ilkonvenuta u \u0127utha l-o\u0127ra, eredi ta'' Vincenza
  Spiteri, kienu nkonxjament ser ji\u0121u m\u010ba\u0127da minn nofs il-valur sostanzjali
  li kien stabilixxa l-perit tekniku g\u0127al dik l-art.\\n\\n\\\"Sinjifikanti kif
  fuq il-konvenju in kwistjoni l-ishma tal-vendituri mill-beni li kienu ser jinbieg\u0127u
  ma \u0121ewx dikjarati u \u0121ew riservati g\u0127all-kuntratt finali. Dan meta
  fa\u010bilment seta'' sar b''sempli\u010bi referenza g\u0127ar-rapport tal-periti
  \u0121udizzjarji, minn fejn jo\u0127or\u0121u kjarament dawn l-ishma, g\u0127alkemm
  fir- rigward tal-eredita'' ta'' Salvatore Spiteri biss. Madankollu, min kellu a\u010b\u010bess
  g\u0127all-istess rapport kien jaf li Salvatore Spiteri kellu biss nofs indivi\u017c
  mill-art \\\"ta'' Fonzu\\\". \u0126a\u0121a pero'' li n\u017cammet mistura g\u0127all-konvenuta,
  kif stqarret fl-affidavit tag\u0127ha. Mhux hekk biss, talli ng\u0127atat ukoll
  l-impressjoni li din l-art kienet green area u g\u0127alhekk mhux fabbrikabbli,
  meta l-perit tekniku ddikjara li minkejja li kellha fa\u010b\u010bata xi ftit ristretta,
  seta'' jsir internal development fiha.\\n\\n\\\"Fl-iskrittura tal-14 ta'' Frar 2004
  il-partijiet kienu ddikjaraw li:\\n\\n\\\"Ahna ''l hawn fuq imsemmija proprio et
  nomine qeghdin naqblu u nobbligaw ruhna reciprokament illi l-immobbli hawn elenkati
  u li pjanta taghhom qed tigi hawn annessa mal-prezenti jinbieghu ghall-prezzijiet
  hawn indikati sabiex f''kaz li ngibu dawn il-prezzijiet ahna bla ebda mod ma noggezzjonaw
  ghat-trasferiment u anzi naghtu l-kunsens taghna b''mod immedjat u solidali u nersqu
  ghall-konvenji/atti ta'' bejgh relattivi fi zmien tlett ijiem minn meta hekk nigu
  mitluba mill-ko-vendituri u komproprjeta`rji....Dan il-ftehim jibqa'' jghodd sa
  zmien sena millum.\\\"\\n\\n\\\"Kien g\u0127alhekk li l-konvenuta \u0127assitha
  obbligata biex gimg\u0127a wara tersaq g\u0127all-konvenju in kwistjoni, inkonxja
  li Charles Farrugia, li jidher li kien id- deus ex machina wara din l-iskritura,
  forsi ma'' xi u\u0127ud o\u0127ra mill-firmatarji, kien f''kollu\u017cjoni man-neputi
  tieg\u0127u, l-attur presenti, koeredi ie\u0127or ta'' Salvatore Spiteri, u firmatarju
  ie\u0127or fuq dik l-iskrittura, biex l-art \\\"ta'' Fonzu\\\" tinbieg\u0127 lilu
  bi prezz li \u017cgur ma kienx jirrifletti l-valur proprju tag\u0127ha.\\n\\n\\\"Konsegwentement
  kellha ra\u0121un il-konvenuta u kienet \u0121ustifikata li, meta saret taf bl-ingann
  tal-attur, rrifjutat li tersaq g\u0127all-kuntratt ta'' bejg\u0127 ta'' din l-art.
  Mhux pero'' l-istess jista'' jing\u0127ad fir-rigward tal-art l-o\u0127ra milquta
  b''dan il-konvenju, u \u010bioe'' dik mag\u0127rufa b\u0127ala \\\"i\u010b-\u010aens
  ta'' San G\u0307wann\\\". Din kellha tinbieg\u0127 g\u0127all-prezz ta'' Lm60,000,
  li kien Lm10,000 i\u017cjed minn dak stabilit mill-perit tekniku. Fuq din l-art
  il-konvenuta ma qalet xejn, u anqas ma rri\u017culta li dwarha kien hemm xi qerq
  fil-konfront tag\u0127ha. Imma mbag\u0127ad kellha ra\u0121un il-konvenuta te\u010b\u010bepixxi
  li l-ishma li kellha hi u \u0127utha, rappresentati minnha, minn dan ir-raba'',
  kif indikati mill-atturi fi\u010b-\u010bitazzjoni tag\u0127hom kienu skorretti.
  Dan g\u0127aliex b\u0127ala koeredi ta'' ommhom, li wirtet wie\u0127ed minn disa''
  (1/9) partijiet ndivi\u017ci minn dan ir-raba'' ming\u0127and \u017cew\u0121ha,
  hi u dawn l-erba'' \u0127utha l-o\u0127ra, bejniethom g\u0127andhom \u0127amsa minn
  tlieta u sittin parti (5/63) ndivi\u017ci minnha u mhux kif erronjament dikjarat
  fi\u010b-\u010bitazzjoni\\\".\\n\\n4. B''rikors pre\u017centat fid-9 ta'' Novembru
  2017 l-atturi appellaw missentenza filwaqt li l-konvenuti wie\u0121bu u taw ir-ra\u0121unijiet
  g\u0127alfejn l-appell g\u0127andu jkun mi\u010b\u0127ud.\\n5. Ovvjament l-appell
  tal-atturi jitratta biss l-art ta'' Fonzu. G\u0127al dak li jikkon\u010berna l-porzjon
  art ''ta\u010b-\u010anus ta'' San Gann'', il-konvenuti m''appellawx u g\u0127alhekk
  dik il-parti tas-sentenza saret \u0121udikat g\u0127oxrin jum wara d-data tas-sentenza
  tal-ewwel Qorti.\\n\\nFatti.\\n\\nApp. \u010aiv. 92/04\\n\\n6. Fil-Qorti tal-Ma\u0121istrati
  (G\u0127awdex) \u0120urisdizzjoni Superjuri Sezzjoni \u0120enerali kien hemm kaw\u017ca
  fl-ismijiet Paul Spiteri et v. Maria Saliba (61/1998) sabiex jinqasam il-wirt ta''
  Salvatore Spiteri li kien miet fis-sena 1971.  Kaw\u017ca de\u010bi\u017ca fit-23
  ta'' Mejju 2014 (ara verbal a fol. 378).\\n7. Salvatore Spiteri kien mi\u017c\u017cewwe\u0121
  darbtejn, l-ewwel lil Marianna xebba Saliba u kellhom sebat itfal (Giovanna Farrugia,
  Paul, Maria Saliba, Giuseppa Gauchi, Salvina Xuereb, Joseph, u  Carmela Debrincat
  a\u0127wa Spiteri).  Wara \u017c\u017cewwe\u0121 lil Vincenza xebba Magro u kellu
  lit-tifel Michael Spiteri. Vincenza kellha tfal minn \u017cwie\u0121 ie\u0127or.\\n8.
  Salvatore Spiteri miet fit-8 ta'' April, 1971.\\n9. Il-wirt ta'' Salvatore Spiteri
  regolat minn testment tat-8 ta'' Ottubru, 1956 fl-atti tan-nutar John Busuttil.  Il-werrieta
  tieg\u0127u kienu t-tieni mara (Vincenza Spiteri) u t-tmint itfal f''sehem ugwali.  G\u0127alhekk
  kull werriet g\u0127andu sehem ta'' parti minn disg\u0127a (1/9) mill-wirt.\\n10.
  Id-denunzja tas-su\u010b\u010bessjoni ta'' Salvu Spiteri saret fit-3 ta'' Marzu,
  1972 minn Vincenza Spiteri li kienet it-tieni mara li \u017c\u017cewwe\u0121 (fol.
  286). Fiha jing\u0127ad li l-assi tal-wirt kienu jinkludu \\\"nofs indivi\u017c
  ta'' bi\u010b\u010ba raba'' msej\u0127a Ta'' Fonsu, Xewkija, G\u0127awdex tal-kejl
  ta'' \u010birka erbat itmiem\\\".\\n\\n11. F''rapport pre\u017centat fit-8 ta''
  Mejju, 2003  fil-kaw\u017ca 61/98 il-periti \u0121udizzjarji rrelataw li l-wirt
  ta'' Salvatore Spiteri kien jinkludi nofs indivi\u017c ta'' porzjon raba'' ta''
  Fonzu, Xewkija b''kejl ta'' 4,496 metri kwadri.  Il-perit tekniku g\u0127amel stima
  ta'' mija u tletin elf Lira Maltija (Lm130,000) g\u0127assehem ta'' nofs l-art.\\n12.
  Fl-14 ta'' Frar 2004 kienet \u0121iet iffirmata skrittura bejn il-partijiet filkaw\u017ca
  fuq imsemmija u Michael Spiteri (it-tifel mit-tieni \u017cwie\u0121 ta'' Salvatore
  Spiteri), li l-proprjeta` tinbieg\u0127 bil-prezzijiet li jissemmew fliskrittura.
  Fiha jing\u0127ad li l-prezz tal-art ta'' Fonzu g\u0127andu jkun Lm130,000. G\u0127all-attur
  Jeffrey Farrugia, li kien parti fil-kaw\u017ca g\u0127all-qsim tal-wirt ta'' Salvatore
  Spiteri, kien deher Charles Farrugia li hu zijuh.\\n13. B''konvenju iffirmat fl-24
  ta'' Frar 2004, il-konvenuti u Michael Spiteri obbligaw ru\u0127hom li jbieg\u0127u
  lill-atturi l-ishma spettanti lilhom mir-raba'' Ta'' Fonzu. Fil-konvenju jing\u0127ad
  li l-prezz tal-art s\u0127i\u0127a hu Lm130,000. Il-prezz miftiehem hu \\\"tal-intier
  inklu\u017c tal-ishma li qed ji\u0121u trasferiti fuq il-pre\u017centi\\\". F''dak
  il-konvenju \u0121ie miftiehem li, \\\"Il-prezz tal-ishma li qed jinbieg\u0127u
  fuq il-pre\u017centi g\u0127andhom ji\u0121u stabbiliti mir-ri\u010berki u l-vendituri
  ji\u0121ihom dak issehem mill-prezz spettanti lilhom skont il-kwota rispettiva\\\".  Fuq
  ilkonvenju l-attur Jeffrey Farrugia deher ukoll f''isem martu, l-attri\u010bi Annie
  Farrugia.\\n\\n14. Kien hemm sidien o\u0127ra li kienu parti wkoll fil-kaw\u017ca
  g\u0127all-qsim talwirt ta'' Salvatore Spiteri li ffirmaw konvenju simili mal-atturi.\\n15.
  Fl-20 ta'' Awissu 2004 l-atturi ppre\u017centaw ittra uffi\u010bjali li biha sej\u0127u
  lill-konvenuti sabiex jersqu g\u0127all-pubblikazzjoni tal-kuntratt ta'' bejg\u0127
  u xiri.\\n16. Fit-30 ta'' Awissu 2004 l-atturi ippre\u017centaw il-kaw\u017ca.\\n17.
  G\u0127alkemm fil-mori tal-kaw\u017ca t\u0127allew jintervjenu membri tal-familja
  Cauchi, fis-seduta tal-31 ta'' Jannar 2017 iddikjaraw li ma kienx g\u0127ad fadlilhom
  interess fil-kaw\u017ca.\\n\\nKonsiderazzjoni.\\n\\nL-ewwel aggravju \u2013 Il-konvenuti
  kellhom jippre\u017centaw kaw\u017ca sabiex jin\u0127all il-konvenju u mhux jiddependu
  fuq e\u010b\u010bezzjoni.\\n\\n18. L-atturi jsostnu li l-atturi kellhom jippre\u017centaw
  kaw\u017ca g\u0127arrexxissjoni tal-kuntratt u mhux jiddependu fuq e\u010b\u010bezzjoni.  Waqt
  ittrattazzjoni l-avukat g\u0127amel enfa\u017ci fuq dan l-aggravju.\\n19. L-e\u010b\u010bezzjonijiet
  li ippre\u017centaw il-konvenuti jinkludu s-segwenti:\\n\\n\\\"1. Illi l-konvenuta
  pro et nomine te\u010bepixxi illi hija \u0121iet indotta li tiffirma l-konvenju
  mertu ta'' din il-kaw\u017ca b''qerq u ra\u0121\u0121iri minn diversi sorsi stante
  illi hija pro et noe \u0121iet ra\u0121\u0121irata u mqarrqa f''diversi elementi
  tal-istess konvenju inklu\u017c dwar il-proprjeta` o\u0121\u0121ett tal-istess konvenju,
  dwar l-estensjoni u l-kobor tal-istess proprjeta`, kif ukoll dwar il-prezz tal-istess
  proprjeta`.....\\n6. Illi ming\u0127ajr pre\u0121udizzju g\u0127as-suespost, il-konvenuta
  pro et nomine te\u010bepxxi wkoll illi l-konvenju mertu ta'' din il-kaw\u017ca huwa
  null u bla effett g\u0127all-finijiet u effetti kollha tal-li\u0121i peress illi
  huwa vizzjat b''difett fil-kunsens stante diversi element ta'' qerq u ra\u0121\u0121iri
  kif ji\u0121i pruvat waqt is-smieg\u0127 tal-kaw\u017ca.\\n7. Illi, ming\u0127ajr
  pre\u0121udizzju g\u0127as-suespost, il-konvenuta pro et nomine te\u010bepixxi ukoll
  ill-konvenju mertu ta'' din il-kaw\u017ca huwa null u bla effett g\u0127all-finijiet
  u effetti kollha tal-li\u0121i peress illi huwa vizzjat b''difett fis-sustanza tieg\u0127u
  stante diversi elementi ta'' qerq u ra\u0121\u0121iri kif ji\u0121i pruvat waqt
  is-smieg\u0127 tal-kaw\u017ca\\\".\\n20. Paragrafi li fihom il-konvenuti tista''
  tg\u0127id li qalu l-istess \u0127a\u0121a.\\n21. L-atturi \u0127arrku lill-konvenuti
  sabiex jinfurzaw konvenju li ffirmaw fit23 ta'' Frar, 2004.  Il-konvenuti qeg\u0127din
  isostnu li l-konvenju iffirmawh min\u0127abba qerq.  Il-konvenuti m''humiex l-uni\u010bi
  persuni li ffirmaw ilkonvenju, u g\u0127andhom jedd jopponu l-e\u017cekuzzjoni tal-obbligazzjoni
  li jbieg\u0127u sehemhom mill-art lill-atturi jekk jirri\u017culta li \u0121ew ingannati.  Dan
  irrispettivament jekk g\u0127amlux kaw\u017ca g\u0127ar-rexxissjoni jew illimitaw
  ru\u0127hom biex jag\u0127tu e\u010b\u010bezzjoni li ma jistg\u0127ux ji\u0121u
  m\u0121ieg\u0127la jersqu g\u0127allkuntratt ta'' bejg\u0127 u xiri.  F''dan ir-rigward
  l-artikolu 1226(1) tal-Kodi\u010bi \u010aivili jipprovdi:-\\n\\n\\\"L-e\u010b\u010bezzjoni
  ta'' nullita'' tista'', f''kull \u017cmien, ti\u0121i mog\u0127tija minn dak li
  jkun im\u0127arrek g\u0127all-esekuzzjoni tal-kuntratt, fil-ka\u017cijiet kollha
  li fihom huwa nnifsu seta'' ja\u0121ixxi g\u0127ar-rexxissjoni\\\".\\n\\n22. Il-Qorti
  tibda biex tosserva li kien fl-istadju tal-appell li l-atturi g\u0127allewwel darba
  g\u0127amlu l-argument.  Fir-rikors tal-appell saret referenza g\u0127all-\u0121urisprudenza
  li tag\u0127mel distinzjoni bejn nullita` u annullabilita` ta'' kuntratt, u li fit-tieni
  ka\u017c tg\u0127id li ilment li jwassal g\u0127all-annullament talkuntratt ma jistax
  jitressaq permezz ta'' e\u010b\u010bezzjoni i\u017cda biss permezz ta'' azzjoni
  ad hoc.  Ma jfissirx li mhemmx \u0121urisprudenza li taddotta fehma differenti (ara
  per e\u017cempju sentenza John Camilleri et nomine v. Angelo Azzopardi proprio et
  nomine tat-3 ta'' Mejju 1966, kif ukoll sentenza ta'' din il-Qorti tat-28 ta'' Frar
  1997 fl-ismijiet George Borg nomine v. Ronald Camilleri).\\n23. Irrispettivament
  taqbel jew ma taqbilx ma'' dik il-\u0121urisprudenza, jibqa'' l-fatt li l-atturi
  \u0127arrku lill-konvenuti sabiex il-Qorti tikkundannahom iwettqu l-obbligazzjoni
  li jbieg\u0127u l-art ta'' Fonzu. Hu veru li l-konvenuti ma ppre\u017centawx kaw\u017ca
  g\u0127ar-rexxissjoni tal-konvenju. Madankollu g\u0127andhom jedd jirrifjutaw li
  jwettqu l-obbligazzjoni li jbieg\u0127u l-fond jekk \u0121ew ingannati. Obbligazzjoni
  milquta minn qerq m''g\u0127andhiex ti\u0121i e\u017cegwita.  Dik kienet il-kwistjoni
  kollha quddiem l-ewwel Qorti, u fuq hekk tressqu l-provi mill-partijiet u dwar dak
  idde\u010bidiet l-ewwel Qorti. \u0120ialadarba l-ewwel Qorti, wara li ikkunsidrat
  il-provi kollha u kienet sodisfatta li l-konvenuti \u0121ew ingannati, ma setg\u0127et
  qatt tordna li titwettaq obbligazzjoni li inkisbet bil-qerq.\\n\\n24. Dan apparti
  li l-Qorti m''g\u0127andha l-ebda dubju illi l-fatti tal-kaw\u017ca jinkwadraw ru\u0127hom
  sewwa fid-dispost tal-artikolu 1226 tal-Kodi\u010bi \u010aivili. Mhemmx dubju illi
  l-konvenuti setg\u0127u huma infushom jippro\u010bedu g\u0127arrexxissjoni tal-konvenju
  (artikolu 981(1) tal-Kodi\u010bi \u010aivili). Il-li\u0121i tag\u0127milha \u010bara
  li \\\"L-eg\u0127mil dolu\u017c huwa motiv ta'' nullita'' tal-ftehim...\\\".  Skont
  l-artikolu 1226(1) tal-Kodi\u010bi \u010aivili, l-e\u010b\u010bezzjoni ta'' nullita`
  tista'' ting\u0127ata \\\"f''kull \u017cmien\\\" u \\\"fil-ka\u017cijiet kollha
  li fihom huwa nnifsu seta'' ja\u0121ixxi g\u0127arrexxissjoni\\\".\\n\\n25.\\n\\nG\u0127aldaqstant,
  ti\u010b\u0127ad l-ewwel aggravju.\\n\\nIt-tieni aggravju - E\u010b\u010bezzjonijiet
  li huma inkompatibbli ma'' xulxin.\\n\\n26. L-atturi argumentaw li hemm inkompatibilita`
  bejn it-tielet u s-sitt e\u010b\u010bezzjoni. Isostnu li:-\\n\\n\\\"Ma tistax tallega
  li ma kinitx taf li nofs indivi\u017c tar-raba'' Ta'' Fonzu kienet tappartjeni lil
  ommha u fl-istess nifs li l-atturi qarrqu biha billi minflok bieg\u0127u in-nofs
  indivi\u017c, bieg\u0127u l-intier.  Jekk ilkonvenuta ma kinitx taf li nofs Ta''
  Fonzu kienet tappartjeni lil ommha, x''atti setg\u0127u g\u0127amlu l-atturi biex
  ja\u0127bu dan il-fatt meta xtraw l-intier minflok in-nofs\\\".\\n\\n27. Hu fatt
  li jekk kif qalet Salvina Xuereb ma kinitx taf li ommha kienet sid ta'' nofs dik
  l-art, ma kienx tort tal-atturi. Il-konvenuta setg\u0127et tag\u0127mel ri\u010berka
  sabiex tivverifika l-\u0121id li kellha ommha. Wara kollox fil-kaw\u017ca kienet
  assistita minn avukat.\\n\\n28. Madankollu g\u0127alkemm ma kinitx taf li nofs indivi\u017c
  tal-art kienet ta'' ommha, b''daqshekk ma jfissirx li ma \u0121ietx ingannata mix-xerrejja
  jew minn xi \u0127add mill-vendituri dwar in-natura tal-art u kemm kienet tiswa
  firrealta`.  Dan kif ser ji\u0121i spjegat iktar ''il quddiem fis-sentenza.\\n29.
  F''dan l-aggravju, l-atturi argumentaw ukoll li hemm kunflitt bejn ittielet u sitt
  e\u010b\u010bezzjoni u jsostnu li mhumiex alternattivi g\u0127al xulxin.  Le\u010b\u010bezzjonijiet
  jaqraw:\\n\\\"3. Illi ming\u0127ajr pre\u0121udizzju g\u0127as-suespost, il-konvenuta
  pro et noe te\u010bepixxi li hija pro et noe qatt ma kellha konnoxxenza tal-fatt
  illi nofs indivi\u017c tal-proprjeta` mag\u0127rufa ''Ta'' Fonzu'' limiti tax-Xewkija,
  G\u0127awdex, tappartjeni biss lill-konvenuta pro et noe peress illi din ilproprjeta`
  kienet inxtrat minn Salvatore Spiteri wara t-tieni \u017cwie\u0121 tieg\u0127u ma''
  omm il-konvenuta pro et noe u g\u0127alhekk nofs indivi\u017c talimsemmija proprjeta`
  tappartjeni biss lill-eredita'' ta'' Vincenza Spiteri, liema eredita qatt ma kienet
  parti mill-kaw\u017ca ta'' divi\u017cjoni fuq imsemmija.....\\n\\\"6. Illi ming\u0127ajr
  pre\u0121udizzju g\u0127as-suespost, il-konvenuta pro et nomine te\u010bepxxi wkoll
  illi l-konvenju mertu ta'' din il-kaw\u017ca huwa null u bla effett g\u0127all-finijiet
  u effetti kollha tal-li\u0121i peress illi huwa vizzjat b''difett filkunsens stante
  diversi element ta'' qerq u ra\u0121\u0121iri kif ji\u0121i pruvat waqt issmieg\u0127
  tal-kaw\u017ca\\\".\\n30. Fit-tielet e\u010b\u010bezzjoni l-konvenuti ma tawx e\u010b\u010bezzjoni
  li l-konvenju hu null min\u0127abba li l-kunsens tag\u0127hom kien vizjat min\u0127abba
  \u017cball ta'' fatt.  Ilkonvenuti g\u0127amlu dikjarazzjoni ta'' fatt.\\n\\n31.
  Inoltre mill-motivazzjoni tas-sentenza hu evidenti li l-ewwel Qorti tat ra\u0121un
  lill-konvenuti ba\u017cata fuq il-kaw\u017cali dwar qerq, u dan ma kellu x''jaqsam
  xejn mal-fatt li l-konvenuti qalu li ma kinux jafu li ommhom kellha sehem mill-art.\\n32.
  Dan apparti li l-Qorti ma teskludix li parti g\u0127all-kuntratt jista'' jkollha
  l-kunsens vizjat min\u0127abba \u017cball, li skond il-li\u0121i jrid jaqa'' fuq
  is-sustanza tal-\u0127a\u0121a, u wkoll min\u0127abba g\u0127emil dolu\u017c.  Fis-sentenza
  Emmanuele Sciberras v. Nobbli Nazareno Zimmerman Barbaro tat-13 ta'' Frar 1946 (Vol.
  XXXII.ii.223), il-Prim''Awla osservat:\\n\\\"Illi, kif josserva l-Baudrey, l-annullabilita''
  ta'' kuntratt ba\u017cata fuq g\u0127emil dolu\u017c tissoponi wkoll l-i\u017cball
  li waqa'' fih il-kontraent li jag\u0127mel l-istanza tal-annullament min\u0127abba
  g\u0127emil dolu\u017c tal-iehor; imma b''din iddifferenza, illi mentri l-i\u017cball,
  b\u0127ala motiv per se indipendentement millg\u0127emil dolu\u017c, hemm b\u017conn
  li jaqa'' fuq is-sustanza tal-\u0127a\u0121a, inve\u010bi li\u017cball effett tal-g\u0127emil
  dolu\u017c ma hemmx b\u017conn li jaqa'' fuq is-sustanza tal-\u0127a\u0121a (ara
  loc. \u010ait. Pa\u0121. 160. Para 117). L-istess ig\u0127id il-Laurent (Principi
  Dto. \u010aiv. Vol. XV, p. 463. Para. 522) bil-kliem \\\".... il dolo e'' sufficiente
  anche quando l''errore che dal medesimo risulta non e'' sostanziale\\\"\\\".\\n33.
  G\u0127aldaqstant, ti\u010b\u0127ad l-aggravju.\\n\\nIt-tielet aggravju - Apprezzament
  tal-provi.\\n\\n34. L-atturi jikkritikaw ukoll ir-ra\u0121unament tal-ewwel Qorti
  fir-rigward tal-provi. Isostnu li:\\n\\n\\\".... l-Ewwel Onorabbli Qorti injorat
  il-\u0127tie\u0121a ta'' livell ta'' prova iktar g\u0127oli minn dak solitament
  rikjest fil-kamp \u010bivili \u2013 dak ta'' prova univoka pari g\u0127al prova
  lil hinn minn kull dubju ra\u0121onevoli, karatteristika tal-kamp penali. U bir-ra\u0121un,
  g\u0127ax hawn si tratt ta'' allegazzjoni t''a\u0121ir ta'' frodi li huwa a\u0121ir
  penalment sanzjonabbli\\\".\\n35. Il-Qorti ma taqbilx li l-prova li kellhom jag\u0127mlu
  l-konvenuti kellha tkun prova ta'' qerq lil hinn minn kull dubju dettat mir-ra\u0121uni.
  Dik li waqt ittrattazzjoni l-avukat irrefera g\u0127aliha b\u0127ala l-prova li
  issir fil-kamp penali. Din hi kaw\u017ca \u010bivili u mhux pro\u010beduri kriminali,
  fejn il-prova hi wa\u0127da fuq bilan\u010b ta'' probabbilta`.\\n36. Min hu vittma
  tal-qerq ikun qieg\u0127ed jara realta` li mhijiex minnha. Mhu fa\u010bli xejn li
  persuna tag\u0127ti prova ta'' qerq. Hi l-li\u0121i stess li f''subartikolu (2)
  tal-artikolu 981 tipprovdi li l-eg\u0127mil dolu\u017c \\\"ma jistax ikun pre\u017cunt,
  imma g\u0127andu ji\u0121i ppruvat\\\". Prova li tista'' wkoll issir b''indizji
  diment li jkun konvin\u010benti. Fis-sentenza Innocenzo Galea v. M. Zammit tat-3
  ta'' Dicembru 1919 (Vol. XXIV.i.203), din il-Qorti semmiet dawn il-prin\u010bipji:-\\n\\\"(1)
  il mantenimento dei contratti e` di interesse generale purche e` principio di ordine
  pubblico; siffatto considerazione impone che nelle cause d''impugnazione di contratti
  per vizio di consenso si procede con massima circospezione perche non si abbia ad
  annulare un''atto che dovrebbe rimanere in vigore;\\n\\n(2) i principi che regolano
  il dolo si devono applicare con maggior rigore quando trattasi di un atto a titolo
  gratuito che quando trattasi di un contratto a titolo oneroso;\\n\\n(3) a provare
  il dolo bastano gli indizi e le congetture purche` siano gravi e concordanti, si
  da generare la convinzione che la liberalita` o il contratto impugnato e` stato
  l''effetto di raggiri usati dall''altra parte o da terzi\\\".\\n\\n37. Mill-provi
  rri\u017culta li:-\\n\\ni. L-art kellha kejl ta'' 4,496 metri kwadri li skont rapport
  talperiti \u0121udizzjarji fil-kaw\u017ca Paul Spiteri et v. Maria Saliba (61/98)
  pre\u017centat fit-8 ta'' Mejju, 2003:\\n(a) Kienet taqa'' f''\u017cona ta'' \u017cvilupp
  b''fa\u010b\u010bata ta'' dsataxil pied fuq it-triq;\\n(b) Skont il-Policy and Design
  Guidance 2000 talAwtorita` tal-Ippjanar l-art setg\u0127et ti\u0121i \u017cviluppata
  f''internal development;\\n(c) Nofs indivi\u017c tal-art \u0121iet stmata li g\u0127andha
  valur ta'' Lm130,000.\\nii. Fl-iskrittura tal-14 ta'' Frar, 2004 l-art ta'' Fonzu
  ing\u0127atat ilvalur ta'' Lm130,000 filwaqt li fir-rapport fil-kaw\u017ca 61/98
  giet stmata li g\u0127andha valur ta'' Lm130,000 pero` g\u0127an-nofs indivi\u017c
  tag\u0127ha.  Il-Qorti ma temminx li dik l-istess somma li tissemma fir-rapport,
  issemmiet fl-iskrittura tal-14 ta'' Frar 2004 u fil-konvenji (inklu\u017c dak meritu
  tal-kaw\u017ca) sempli\u010bement b''kumbinazzjoni.\\n\\niii. L-ewwel skrittura
  kienet iffirmata fl-14 ta'' Frar 2004, fi \u017cmien meta r-rapport fil-kaw\u017ca
  61/98 evidentement kien di\u0121a` \u0121ie pubblikat.  Fil-fatt fl-4 ta'' Novembru
  2003 il-perit tekniku kien \u0127alef ir-rapport (ara fol. 314).\\niv. Fl-iskrittura
  tal-14 ta'' Frar 2004 il-proprjetajiet kwa\u017ci kollha ing\u0127ataw prezz iktar
  mill-istima tal-perit Emanuel Vella, \u0127lief g\u0127all-art ta'' Fonzu \u010bjoe
  dik li hi meritu ta'' din il-kaw\u017ca.  Hekk per e\u017cempju porzjon art b''kejl
  ta'':\\n(a) 258mk, Triq l-Im\u0121arr, G\u0127ajnsielem, G\u0127awdex bi prezz ta''
  Lm120,000 meta l-perit tekniku g\u0127amel stima ta'' Lm42,000.\\n(b) 1365 mk, Ta\u010b-\u010aen\u010b,
  Xewkija, G\u0127awdex ing\u0127atat prezz ta'' Lm60,000 filwaqt li l-perit tekniku
  g\u0127amel stima ta'' Lm50,000.\\n(c) 1830mk, tal-Misra\u0127, G\u0127ajnsielem,
  G\u0127awdex bi prezz ta'' Lm24,000 filwaqt li l-perit tekniku g\u0127amel stima
  ta'' Lm1,868.\\nv. Il-kaw\u017ca 61/98 kienet biss dwar il-wirt ta'' Salvu Spiteri
  u mhux ukoll il-wirt ta'' omm il-konvenuti.  Carmel Farrugia stess fl-affidavit
  (fol. 46) xehed li kellha ssir laqg\u0127a g\u0127and lavukat Monica Vella sabiex
  jiddiskutu l-qsim tal-wirt ta'' nannuh Salvu Spiteri.  L-istess qal l-attur (fol.
  36):\\n\\n\\\"G\u0307ara illi madwar ix-xahar ta'' Jannar 2004 il-konvenuta flimkien
  mal-legal tag\u0127ha Dr Monica Vella, ma'' xi familjari tieg\u0127i, u flimkien
  ma'' persuni o\u0127ra li b''xi mod jew ie\u0127or g\u0127andhom xi parentela ma''
  Salvu Spiteri, marru quddiem in-Nutar Kristen Dimech sabiex jiddiskutu l-qsim tal-fondi
  kollha li \u0121ejjin mill-wirt tal-bu\u017cnannu Salvu Spiteri u dwar ilprezzijiet
  tal-istess fondi.\\n\\nFl-14 ta'' Frar 2004 kien intle\u0127aq ftehim bil-miktub
  dwar dan, li qieg\u0127ed ji\u0121i anness ma'' dan l-affidavit b\u0127ala Dok.
  JF1\\\".\\n\\nvi. Carmel Farrugia kien qieg\u0127ed jidher g\u0127alih innifsu u
  familjari o\u0127ra tieg\u0127u (ara skrittura tal-14 ta'' Frar, 2004 a fol. 38),
  fosthom l-attur Jeffrey Farrugia u \u0127utu Charlie u Anthony. Ommu kienet bint
  Salvu Spiteri u Marianna Saliba (l-ewwel mara tieg\u0127u).\\nvii. Skont Salvina
  Xuereb, kien Carmel Farrugia li waqt il-laqg\u0127a kien semma li l-art Ta'' Fonzu
  kienet barra mi\u017c-\u017cona ta'' \u017cvilupp.  Pero` mir-rapport tal-perit
  Emanuel Vella jirri\u017culta li l-art qieg\u0127da f''\u017cona ta'' \u017cvilupp.\\n38.
  Id-differenza bejn l-istima tal-valur ta'' nofs l-art u l-art kollha kien xejn inqas
  minn Lm130,000 (\u20ac302,818). Il-Qorti bl-ebda ti\u0121bid talimma\u0121inazzjoni
  ma tista'' tara li l-konvenuti kienu ser ja\u010b\u010bettaw prezz ta'' Lm130,000
  kieku kienu jafu b''dak li nkiteb fir-rapport tal-periti \u0121udizzjarji\\n\\nfil-kaw\u017ca
  61/98, \u010bjoe'' li l-art qeg\u0127da f''\u017cona ta'' \u017cvilupp, nofs l-art
  tiswa Lm130,000 u li huma u Michael Spiteri huma sidien tan-nofs l-ie\u0127or.  Hu
  veru li bil-prezz miftiehem kull bejjieg\u0127 spi\u010b\u010ba li g\u0127amel telf,
  madankollu t-telf tal-werrieta l-o\u0127ra ma jistax ji\u0121i paragunat mat-telf
  enormi ta'' Lm130,000 li irre\u0121istraw il-konvenuti u Michael Spiteri. Dan ovvjament
  g\u0127aliex il-konvenuti kellhom in-nofs indivi\u017c ta'' ommhom.\\n\\n39. L-atturi
  jsostnu li ma kien hemm l-ebda ra\u0121\u0121iri min-na\u0127a tag\u0127hom, g\u0127aliex
  kien biss wara l-iskrittura tal-14 ta'' Frar 2004 li kienu \u0121ew avvi\u010binati
  minn Carmel Farrugia sabiex jixtru l-art o\u0121\u0121ett tal-kaw\u017ca. Isostnu,
  \\\"Dawn la dehru fin-negozjati, la dehru fuq l-iskrittura, u lanqas biss \u0121ie
  ppruvat li meta saret l-iskrittura, dawn kien bi \u0127siebhom jixtru huma\\\".  Hu
  minnu li l-atturi ma ffirmawx personalment l-iskrittura u personalment ma \u0127adux
  sehem fin-negozjati.  Madankollu Carmel Farrugia deher b\u0127ala mandatarju tal-attur.  Irri\u017culta
  kif wara li ffirma liskrittura tal-14 ta'' Frar 2004 Carmel Farrugia mar dritt g\u0127and
  l-attur, inneputi tieg\u0127u, u staqsih jekk kienx interessat jixtri xi proprjeta`
  mill-wirt ta'' Salvu Spiteri li kien il-bu\u017cnannu tieg\u0127u.  Il-Qorti diffi\u010bli
  temmen li dik kienet l-ewwel darba li Carmel Farrugia tkellem mal-attur dwar xiri
  ta'' proprjeta` li tifforma parti mill-wirt ta'' Salvu Spiteri.  Dan meta tikkunsidra
  li l-attur kien parti fil-kaw\u017ca 61/1989 (fol. 281) u wkoll Carmel Farrugia
  kien deher u iffirma wkoll g\u0127an-nom tieg\u0127u l-iskrittura tal-14 ta'' Frar
  2004. Il-Qorti ssibha inverosimili li l-atturi ma kinux jafu x''kien g\u0127addej.  Sa\u0127ansitra\\n\\nMario
  Saliba, iben Maria Saliba li kienet wa\u0127da mit-tfal ta'' Salvu Spiteri u konvenuta
  fil-kaw\u017ca 61/1989, xehed li wara l-laqg\u0127a li fiha ftehmu lprezzijiet,
  \\\"... it-Tnejn filg\u0127odu stess \u010bempilli Charlie Farrugia t''G\u0127ajnsielem
  u qalli li dawk il-proprjetajiet kienu lesti, ji\u0121ifieri kien instab xerrej
  b''dawk il-prezzijiet, li kien Jeffrey Farrugia, iben wie\u0127ed millwerrieta stess\\\"
  (fol. 119).  L-istess qalet il-konvenuta Salvina Xuereb, \\\"G\u0307ara, li mil-lum
  g\u0127al g\u0127ada, wara li s-Sibt iltqajna fil-garage ta'' Carmelo Cauchi u hemmhekk
  konna ftehmna fost o\u0127rajn fuq prezzijiet u fuq kemm se tkun it-talba, u li
  kellhom jitwa\u0127\u0127lu tabelli fuq il-proprjeta`jiet involuti sabiex kul\u0127add
  ikun jaf li dawn tpo\u0121\u0121ew g\u0127all-bejg\u0127, \u0121ejt infurmata li
  kien instab xerrej\\\" (fol. 70). Kompliet li t-Tnejn filg\u0127odu binha Anthony
  Saliba kien g\u0127arrafha li \u010bempillu Carmel Farrugia u infurmah li kien di\u0121a`
  instab xerrej. Evidentement kollox sar ta'' malajr iktar u iktar meta tikkunsidra
  lkondizzjonijiet ferm vanta\u0121\u0121u\u017ci, \u010bjoe l-prezz u l-fatt li l-art
  kienet f''\u017cona ta'' \u017cvilupp.\\n\\n40. G\u0127all-Qorti hu ovvju li Carmel
  Farrugia kien jaf li n-neputi Jeffrey Farrugia kien interessat li jixtri dik il-proprjeta`.
  Fil-fatt l-attur stess xehed li g\u0127al-laqg\u0127a li fiha kienet iffirmata l-ewwel
  skrittura (14 ta'' Frar 2004), \\\"...... kien hemm pre\u017centi z-ziju tieg\u0127i,
  Carmel sive Charles Farrugia li kien qieg\u0127ed jidher fuq dina l-iskrittura f''ismi
  u f''isem \u0127uti Anthony u Charlie a\u0127wa Farrugia\\\" (fol. 45).  Fil-fatt
  l-ewwel konvenju kien iffirmat fit-23 ta'' Frar, 2004 u dak tal-konvenuti l-g\u0127ada.\\n\\n41.
  Il-Qorti rat ukoll dak li xehed Carmel Farrugia, u tistqarr li m''hijiex impressjonata
  bil-mod li beda jwie\u0121eb g\u0127ad-domandi waqt il-kontroe\u017cami meta ripetutament
  wie\u0121eb li ma jiftakarx.  Hekk per e\u017cempju, ma ftakarx:\\n* Jekk kienx
  di\u0121a` \u0121ie ppubblikat ir-rapport tal-periti \u0121udizzjarji meta iltaqg\u0127u
  u ffirmaw l-iskrittura tal-14 ta'' Frar, 2004;\\n* \u0126a\u0121a wa\u0127da dwar
  il-kaw\u017ca 61/98. Sa\u0127ansitra wasal biex ig\u0127id li m''g\u0127andux ideja
  ta'' dik il-kaw\u017ca; \\\"Qed ng\u0127idlek ma niftakar xejn fuqha. Insejtha g\u0127al
  kollox\\\" (fol. 263). Pero waqt l-istess deposizzjoni qal li r-rapport tal-periti
  kien rah (fol. 265);\\n* Jekk meta ftehmu l-prezzijiet li jissemmew fl-iskrittura
  tal-14 ta'' Frar 2004, kinux ikkunsidraw l-istimi tal-valur li jissemmew fir-rapport
  tal-periti \u0121udizzjarji fil-kaw\u017ca 61/1998.\\n42. Kien hemm affarijiet o\u0127ra
  li x-xhud ma ftakarx li g\u0127alkemm wie\u0127ed jista'' jg\u0127id li ma kinux
  dwar fatti daqstant importanti, pero` jkomplu jsa\u0127\u0127u l-fehma tal-Qorti
  dwar l-atte\u0121\u0121ament negattiv tax-xhud. Dan apparti li per e\u017cempju
  x-xhud lanqas qal is-sewwa meta xehed li l-kaw\u017ca dwar il-wirt kienet dwar \\\"Kulma
  kellu Salvu Spiteri u n-nisa tieg\u0127u\\\" (fol. 256) u baqa'' jinsisti li kien
  \u010bert minn dak li kien qieg\u0127ed ig\u0127id. Pero'' mir-rapport talperiti
  \u0121udizzjarji stess li sar fil-kaw\u017ca 61/1998 hu altru milli evidenti li
  lkaw\u017ca kienet biss dwar il-wirt ta'' Salvatore Spiteri u ta'' \u0127add iktar.
  L-istess ma qalx is-sewwa meta xehed li ma kienx qieg\u0127ed isegwi l-kaw\u017ca
  li kellha x''taqsam mal-wirt ta'' Salvatore Spiteri (fol. 262). Tant kien jaf x''inhu
  g\u0127addej li kien hu li deher fuq l-iskrittura privata iffirmata fl-14 ta'' Frar
  2004.  Sa wasal biex ig\u0127id li kaw\u017ca kontra Maria Spiteri ma kellux, \u010bjoe`
  l-kaw\u017ca 61/1998.\\n\\n43. Il-Qorti tifhem li x-xhud xehed in kontro-e\u017cami
  fit-18 ta'' Marzu 2008, i\u0121ifieri erba'' snin wara l-iskrittura tal-14 ta''
  Frar 2004 u l-konvenji. Madankollu l-mod kif beda jwie\u0121eb jag\u0127ti lill-Qorti
  x''tifhem li ''ma niftakarx'' kienet twe\u0121iba ferm komda u fa\u010bli g\u0127al
  ilsienu.  Ix-xhud lanqas spjega kif jekk kif qal id-diskussjonijiet u l-ftehim kellhom
  jikkon\u010bernaw l-wirt ta'' Salvu Spiteri (ara affidavit a fol. 45), fil-ftehim
  kien \u0121ie inklu\u017c sehem fl-art ta'' Fonzu li ma kinitx tifforma parti mill-wirt
  ta'' nannuh Salvu Spiteri. Dan apparti li meta xehed in kontro-e\u017cami enfasizza
  li l-kaw\u017ca tal-qasma talwirt kienet dwar \\\"kullma kellu Salvu Spiteri u n-nisa
  tieg\u0127u\\\".  Dan qalu g\u0127al darba darbtejn. Fatt li suppost kien jaf li
  m''g\u0127andux mis-sewwa g\u0127aliex hu stess qal li kien isegwi dak li qed ji\u0121ri
  fil-kaw\u017ca.  Min-na\u0127a lo\u0127ra fl-affidavit semma biss il-wirt ta'' nannuh
  Salvatore Spiteri.\\n44. Il-konvenuta Salvina Xuereb, bint Vincenza Spiteri li kellha
  sehem ta'' nofs indivi\u017c fl-art in kwistjoni, stess xehdet li meta saret il-laqg\u0127a
  qabel iffirmaw l-iskrittura tal-14 ta'' Frar 2004, \\\"Niftakar illi dwar ir-raba''
  ''Ta''\\n\\nFonzu'' illi kienet \u0121iet prezzata mija u tletin elf Lira Maltin
  (Lm130,000) Charlie Farrugia kien qal li din hija green area, fis-sens li ma kinitx
  tiswihom\\\" (fol. 70).\\n\\n45. Meta tqis dawn il-konsiderazzjonijiet il-Qorti
  hi tal-fehma li fil\u0121urnata li Carmel Farrugia iffirma l-iskrittura tal-14 ta''
  Frar 2004 g\u0127annom tieg\u0127u u tan-neputijiet tieg\u0127u (fosthom l-attur
  Jeffrey Farrugia), altru milli kien jaf x''ig\u0127id ir-rapport tal-periti \u0121udizzjarji.  Carmel
  Farrugia kien wie\u0127ed mill-atturi fil-kaw\u017ca 61/1998 flimkien mal-attur,
  il-konvenuti u persuni o\u0127ra. Minflok qal lill-konvenuti x''inhi l-verita`,
  ikkonvin\u010bihom li lart kienet f''area barra \u017c-\u017cona ta'' \u017cvilupp
  u ma semma xejn li s-somma ta'' Lm130,000 kien il-valur li ta l-perit tekniku g\u0127al
  nofs indivi\u017c. Mhemmx dubju li l-konvenuta Salvina Xuereb, li kienet qieg\u0127da
  tidher f''isimha u f''isem \u0127utha, setg\u0127et tirrifjuta li tiffirma qabel
  tag\u0127mel verifiki.  Madankollu l-Qorti ma tara l-ebda ra\u0121uni li kellha
  toqg\u0127od tiddubita fil-bona fede talpersuna li kien attur mag\u0127ha fil-kaw\u017ca
  61/1998 kif ukoll li kien familjari tag\u0127ha u f''dik il-kaw\u017ca kienu fuq
  l-istess na\u0127a.  F''sentenza ta'' din il-Qorti tas-17 ta'' Marzu 1958 fl-ismijiet
  Alice Cassar Torregiani v. Albert R. Manche (Vol. XLII.i.126), intqal:\\n\\n\\\"Huwa
  veru li l-kumpratur seta'' jag\u0127mel l-inda\u0121nijiet opportuni biex jitkixxef
  jekk dak li qallu l-venditur fuq il-prezz u l-eta'' tal-o\u0121\u0121ett kien minnu;
  imma jekk i\u010b-\u010birkostanzi huma tali li x-xerrej ma kellux ra\u0121unijiet
  biex jiddubita mill-assikurazzjonijiet tal-venditur, l-ingann jibqa'' li kien il-kaw\u017ca
  determinanti tal-bejg\u0127, u kwindi huwa motiv ta'' annullament tal-bejg\u0127
  ta'' dak l-o\u0121\u0121ett\\\".\\n\\n46.\\n\\nJibqa'' l-fatt li kien bl-intervent
  ta'' Carmel Farrugia, li deher ukoll f''isem l-attur, li ikkonvin\u010ba lill-konvenuti
  li l-art tinbieg\u0127 bi prezz ta''\\n\\nLm130,000 meta kien jaf li dak ma kienx
  il-valur tal-art kif stmat mill-perit tekniku fil-kaw\u017ca fuq imsemmija.  Il-Qorti
  m''g\u0127andhiex dubju li kieku l-\\n\\nkonvenuti kienu jafu x''inhi l-verita,
  ma kinux ser ja\u010b\u010bettaw li l-art tinbieg\u0127\\n\\nb''dak il-prezz.\\n\\n47.\\n\\nIl-kaw\u017ca
  kienet proprju dwar il-wirt ta'' Salvu Spiteri, u l-Qorti m''g\u0127andhiex g\u0127alfejn
  tiddubita li l-partijiet kienu ddiskutew ftehim u l-\\n\\nintenzjoni kienet li jiftehmu
  dwar il-\u0121id li kien hemm f''dak il-wirt u mhux\\n\\n\u0121id li kien f''wirt
  ta'' \u0127addie\u0127or.\\n\\n48.\\n\\nFir-rikors tal-appell l-atturi argumentaw
  li l-attri\u010bi ma kinitx iffirmat l- iskrittura tal-14 ta'' Frar 2004 g\u0127aliex
  ma kinitx wa\u0127da mill-werrieta, filwaqt\\n\\nli l-attur ma ffirmahiex g\u0127aliex
  ma kienx pre\u017centi. \u017biedu li kien biss wara l-iskrittura li kelmu zijuh
  Carmel Farrugia sabiex jixtri l-art in kwistjoni.\\n\\nStaqsew:\\n\\n\\\"x''prova
  hemm ta'' ra\u0121\u0121iri da parti tal-atturi ? Dawn la dehru finnegozjati, la
  dehru fuq l-iskrittura, u lanqas biss \u0121ie ippruvat li meta saret l-iskrittura,
  dawn kien bi \u0127siebhom jixtru huma. Anzi jirri\u017culta bilkontra. Idde\u010bidew
  li jixtru wara d-data tal-iskrittura li permezz tag\u0127ha lkonvenuta di\u0121a
  kienet qed tintrabat li tbieg\u0127 sehemha mill-intier, liema intier kien qed ji\u0121i
  stmat Lm130,000.  Il-konvenju \u2013 datat 23 ta'' Frar 2004 u 2 ta'' Marzu 2004
  \u2013 kien sempli\u010bement jirrepeti dak li kien hemm fl-iskrittura\\\".\\n\\n49.
  Ba\u017cat fuq il-konsiderazzjonijiet li saru qabel, il-Qorti temmen li fl-14 ta''
  Frar 2004 Carmel Farrugia kien a konoxxenza tal-kontenut tar-rapport pre\u017centat
  fil-kaw\u017ca 61/1998 li fih jing\u0127ad li Salvatore Spiteri kien sid ta'' nofs
  indivi\u017c tal-art ta'' Fonzu, dak is-sehem kien stmat b''valur ta'' Lm130,000
  u l-art kienet f''\u017cona ta'' \u017cvilupp. Minflok Salvina Xuereb xehdet li
  dakinhar tal-laqg\u0127a meta ffirmaw l-iskrittura, Farrugia qalilhom li l-art kienet
  f''green area u ma tiswiex dawk il-flus.  Pero` mir-rapport \u0121udizzjarju kien
  jirri\u017culta mod ie\u0127or.  Il-Qorti m''g\u0127andha l-ebda dubju li lattur
  kien jaf b''kollox li qieg\u0127ed jag\u0127mel zijuh Carmel Farrugia, u \u0127alla
  kollox f''idejh. Dak kollu li g\u0127amel Carmel Farrugia kien sa mill-bidunett
  flinteress tal-attur u martu. Il-Qorti m''g\u0127andhiex dubju li Farrugia kien
  jaf dwar l-interess li kellu l-attur li jixtri l-art ta'' Fonzu. Fil-fatt wara jumejn
  Carmel Farrugia g\u0127arraf lill-konvenuti li kien sab xerrej, \u010bjoe` l-attur
  li Carmel Farrugia deher f''ismu meta iffirma l-iskrittura. Kif zijuh irnexxielu
  jikkonvin\u010bi lis-sidien l-o\u0127ra biex ibieg\u0127u l-art b''dak il-prezz
  ferm favorevoli, da\u0127al fix-xena l-attur u kompla fejn \u0127alla zijuh.\\n50.
  G\u0127aldaqstant, ti\u010b\u0127ad it-tielet aggravju.\\n\\nIr-raba'' aggravju
  \u2013 Il-qorti dde\u010bidiet a ba\u017ci ta'' qerq minkejja li lkonvenuta innifisha
  m''g\u0127afsitx fuq dan il-punt.\\n\\n51. L-atturi ilmentaw li f''nota ta'' sottomissjonijiet
  ta'' disa'' fa\u010b\u010bati:-\\n\\n\\\".... il-konvenuta ddedikat biss 2 paragrafi;
  wie\u0127ed legali b''\u010bitazzjoni ta'' sentenzi favur, u mhux kontra, il-validita''
  tal-kuntratti u l-ie\u0127or (para 16) li jg\u0127id li,...... Il-konvenuta nnifisha
  g\u0127alhekk mhix konvinta li kien hemm qerq.  Eppure l-Qorti deherilha li kellha
  tkun hekk konvinta\\\".\\n52. Dan l-aggravju hu fierag\u0127. Fit-twe\u0121iba \u0121uramentata
  l-konvenuti altru milli enfasizzaw fuq il-qerq, irrispettivament minn dak li qalu
  fin-nota ta'' sottomissjonijiet.\\n53. G\u0127alhekk ti\u010b\u0127ad l-aggravju.\\n\\nIl-\u0127ames
  aggravju \u2013 l-e\u010b\u010bezzjoni li l-konvenuti g\u0127amlu \u017cball.\\n\\n54.
  L-atturi jsostnu li lanqas l-e\u010b\u010bezzjoni tal-i\u017cball ma tista'' tintlaqa''.\\n55.
  Dak li l-konvenuti ddikjaraw fit-tielet paragrafu m''hijiex e\u010b\u010bezzjoni
  ta'' nullita` ta'' kuntratt.  Il-Qorti tifhem dak il-paragrafu b\u0127ala sempli\u010bi
  dikjarazzjoni ta'' fatt. Fil-fatt fl-e\u010b\u010bezzjoni ma nvokawx il-vizju tal-kunsens
  min\u0127abba \u017cball ta'' fatt li jaqa'' fuq is-sustanza tal-\u0127a\u0121a.
  Tant hu hekk li finnota ta'' sottomissjonijiet il-konvenuti lanqas m''g\u0127amlu
  argumenti f''dak issens  (ara fol. 433-441).\\n56. L-e\u010b\u010bezzjoni tal-konvenuti
  kienet dwar g\u0127emil dolu\u017c, u l-ewwel Qorti dde\u010bidiet fuq hekk.\\n\\nApp.
  \u010aiv. 92/04\\n\\n57.\\n\\nTi\u010b\u0127ad l-aggravju.\\n\\nIs-sitt aggravju
  \u2013 l-attri\u010bi ma kinitx involuta.\\n\\n58.\\n\\nL-atturi jsostnu li m''hemmx
  prova li l-attri\u010bi kienet involuta fl-allegat qerq. G\u0127alhekk ma tistax
  issir dikjarazzjoni kontriha.\\n\\n59.\\n\\nIl-fatt li l-attri\u010bi personalment
  ma kinitx involuta, ma jfissirx li s- sentenza m''g\u0127andhiex tapplika fil-konfront
  tag\u0127ha wkoll. L-attur deher fl-\\n\\nisem u fl-interess tal-attri\u010bi, mela
  l-qerq tieg\u0127u jitqies daqslikieku l-qerq tag\u0127ha.\\n\\n60.\\n\\nTi\u010b\u0127ad
  l-a\u0127\u0127ar aggravju.\\n\\nG\u0127al dawn il-motivi ti\u010b\u0127ad l-appell
  u tikkonferma s-sentenza tal-ewwel Qorti, bl-ispejje\u017c kollha kontra l-appellanti.\\n\\nMark
  Chetcuti\\n\\nPrim Im\u0127allef\\n\\nGiannino Caruana Demajo Im\u0127allef\\n\\nAnthony
  Ellul Im\u0127allef\\n\\nDeputat Re\u0121istratur gr\\n\\n26\"", "\"QORTI TAL-MAGISTRATI
  (GHAWDEX) BHALA QORTI TA'' GUDIKATURA KRIMINALI\\n\\nMAGISTRAT DR.\\n\\nEDWINA GRIMA\\n\\nSeduta
  tas-7 ta'' Frar, 2013\\n\\nNumru. 578/2008\\n\\nIl-Pulizija\\n\\n(Spettur Josric
  Mifsud)\\n\\nVS\\n\\nJosephine Tabone, bint John Saliba u Francesca nee'' Buttigieg
  imwieled fid-29 ta'' Marzu 1943 u residenti Avalor, Triq il-Punici, Munxar, Ghawdex
  u detentrici tal-karta tal-identita bin-numru 31843(G)\\n\\nIl-Qorti;\\n\\nRat l-imputazzjoni
  migjuba kontra l-imputata Josephine Tabone akkuzata talli nhar id-19 ta'' Gunju
  2008 ghal habta ta'' 17:45hrs fi Triq il-Knisja, Xewkija, Ghawdex:-\\n\\n1. volontarjament
  kisret il-bon ordni u l-kwiet talpubbliku b''ghajjat u glied.\\n2. Volontarjament
  ghamlet hsara fil-bieb tar-residenza numru 22 liema hsara ma teccediex \u20ac23.29
  (Lm10).\\n3. Gabet ruhha b''mod li tat fastidju lil familja Xuereb.\\n\\nRat id-dokumenti
  esebiti.\\n\\nSemghet il-provi.\\n\\nSemghet trattazzjoni.\\n\\nIkkunsidrat:\\n\\nIlli
  dina l-kawza kienet miexja kontestwalment mal-kawza Il-Pulizija vs Francesco Xuereb
  (Kump.Nru.53/2008), deciza wkoll illum minn dina l-Qorti.  Kwindi a skans ta'' repetizzjoni,
  il-Qorti ser taghmel referenza ghal motivazzjoni migbura fl-imsemmija sentenza.\\n\\nL-ewwel
  akkuza:\\n\\nIlli l-imputata tinsab akkuzata bil-ksur tal-bon ordni u l-paci pubblika.
  Illi l-Qorti sejra taghmel referenza ghal sentenza mohtija mill-Qorti tal-Appell
  Kriminali fid-19 ta'' Novembru, 1999 fl-ismijiet ''Il-Pulizija versus Maria Concetta
  Green'' (Volum LXXXIII Part IV pa\u0121ina 441):\\n\\n''L-artikolu 338(dd) tal-Kodi\u010bi
  Kriminali jikkontempla r-reat komunement imsejja\u0127 ''breach of the peace''.  L-elementi
  ta'' dan ir-reat \u0121ew e\u017caminati funditus f''diversi sentenzi u \u0121ie
  ritenut li, b\u0127ala regola, ikun hemm din il-kontravenzjoni meta jkun hemm g\u0127emil
  volontarju li minnu nnifsu jew min\u0127abba \u010b-\u010birkostanzi li fihom dak
  l-g\u0127amil ise\u0127\u0127 inissel imqar minimu ta'' nkwiet jew t\u0127assib
  f''mo\u0127\u0127 persuna (li ma tkunx l-akku\u017cat jew l-imputat) dwar l-inkolumita''  ta''
  persuna jew dwar l-inkolumita'' ta''  proprjeta'',  kemm b''ri\u017cultat dirett
  ta'' dak l-g\u0127amil jew min\u0127abba l-possibilita'' ta'' reazzjoni g\u0127al
  dak l-g\u0127emil.\\n\\nL-iskambju ta'' kliem, anke jekk in\u0121urju\u017c jew
  mina\u010b\u010bju\u017c fih innifsu u ming\u0127ajr ma jkun hemm xejn aktar x''jindika
  li dak l-argument jista'' ji\u017cviluppa fih, jew iwassal g\u0127al, xi \u0127a\u0121a\\n\\no\u0127ra
  u aktar serja (b\u0127al \u0121lied bl-idejn jew \u0127sara filpropjeta'') ma jammontax
  g\u0127all-breach of the peace fissens tal-artikolu 338(dd) tal-Kodi\u010bi Kriminali.''\\n\\nIlli
  ma hemmx dubbju illi fil-jum ta'' dana l-incident kien hemm storbju shih ghaddej
  fit-triq, tant illi l-PC870 hass illi kellu jmur jaghmel rapport l-Ghassa minhabba
  l-fatt li gie allarmat u haseb li kienet ghaddejja xi glieda. Il-pulizija li xehdu
  wkoll ighidu illi dana l-ghajjat instema'' sahansitra mill-Ghassa tal-Pulizija.  L-ghajjat
  kien gej l-iktar minn vuci femminili u cioe'' dak tal-imputata li tigi osservata
  minn diversi nies fit-triq tghajjat u taghmel hafna storbju u dana ghax dehrilha
  li ohtha kellha tiftah il-bieb ta'' barra u tkellimha.  Kwindi l-akkuza tirrizulta
  ampjament ippruvata u l-imputata ser tinsab hatja tal-istess.\\n\\nIt-tieni akkuza
  dwar il-hsara volontarja\\n\\nIlli l-imputata tinsab akkuzata bir-reat tal-hsara
  volontarja u dana a tenur tal-artikolu 325(1)(d) tal-Kapitolu 9.  Illi sabiex tirnexxi
  dina l-azzjoni kriminali jenhtieg il-kwerela tal-parti offiza.  Illi mix-xhieda
  li jaghti l-parti leza Francesco Xuereb f''dina l-kawza jidher illi huwa ma riedx
  jiehu passi kriminali fil-konfront tal-imputata u ghalkemm mill-provi jirrizulta
  illi l- hsara fil-bieb ta'' barra tad-dar tieghu kien jammonta ghal \u20ac10, madanakollu
  jghid illi qed jirrinunzja ghal hlas tal-istess mill-imputata. Ighid:\\n\\n\\\"Lill-pulizija
  ghidtilhom ghal darba darbtejn li ma xtaqtx immexxi kontra taghha \u2026.. Nghid
  madanakollu li jiena m''jien qed nippretendi xejn ta'' dina l-hsara minghand Guza
  Tabone.\\\"\\n\\nIlli fid-dawl ta'' dawn id-dikjarazzjonijiet, il-Qorti  ma tistax
  hlief tiddikjara l-procediment ezawrit in konnessjoni ma'' dina l-akkuza.\\n\\nIt-tielet
  akkuza dwar il-fastidju\\n\\nIlli l-imputata tinsab akkuzata wkoll bir-reat tal-hekk
  imsejjah \\\"harassment\\\" kif previst fl-artikolu 251A talKapitolu 9.  Illi f''sentenza
  moghtija mill-Qorti tal-Appell Kriminali fl-ismijiet il-Pulizija vs Raymond Parnis
  (per Prim''Inhallef Vincent DeGaetano 24/04/2009), il-Qorti tat definizzjoni ezawrjenti
  ta'' dak li jikkostitwixxi l-harassment. Il-Qorti tal-Appell fis-sentenza taghha
  fil-fatt tissottolinja lfatt illi l-kelma \\\"imgieba\\\" fit-test tal-ligi timplika
  \\\"a course of conduct\\\" u mhux xi incident wiehed izolat.  Il-Qorti hemmhekk
  jikkwota lil Blackstone (Blackstone''s Criminal Practice, 2008) :\\n\\n\\\"\u2026.The
  nature of stalking, the activity which primarily created the need for the new offences,
  might mean that the occasions are likely to be on separate days, although it may
  be possible to differentiate activities on one day where they can be viewed as not
  being continuous.  The further apart the incidents, the less likely it is that they
  will be regarded as a course of conduct\u2026It was recognised, however that circumstances
  can be conceived ''where incidents, as far apart as a year, could constitute a course
  of conduct''.  The type of incidents would be those intended to occur on an annual
  event such as a religious festival or a birthday\u2026\\\"\\n\\nIlli mix-xhieda
  tal-parti leza u l-familja tieghu jidher illi limputata kellha l-vizzju illi ddejjaqhom
  kemm bit-telefon, kif ukoll permezz ta'' ittri u anke billi tmur thabbtilhom ilbieb
  ta'' barra tad-dar taghhom, kif ghamlet ukoll f''dina lokkazzjoni.  Jidher illi
  ghalkemm huma kienu wissuha biex thalliehom bi kwiethom, hija xorta wahda baqghet
  tippersisti fl-azzjonijiet taghha tant illi anke fil-mori ta'' dawn il-proceduri
  nqala'' incident iehor. Jidher illi dina limgieba minn naha tal-imputata ilha ghaddejja
  ghal snin twal.  Ghal dawn il-motivi l-Qorti ma tistax hlief issibha hatja tal-istess.\\n\\nGhaldaqstant
  il-Qorti wara li rat l-artikoli 251A u 338(dd) tal-Kapitolu 9 tal-Ligijiet ta''
  Malta, filwaqt li tiddikjara lprocediment ezawrit in konnessjoni mat-tieni akkuza,
  issibha hatja tal-kumplament, izda wara li rat l-artikolu 22 tal-Kapitolu 446 tal-Ligijiet
  ta'' Malta tillibera lill-imputata\\n\\nKopja Informali ta'' Sentenza bil-kundizzjoni
  li ma tikkomettiex reat iehor fi zmien sena mil-lum.\\n\\nIl-Qorti qed twissi lil
  hatja bil-konsegwenzi skond il-ligi jekk hija tikkometti reat iehor matul dana l-perijodu
  ta'' liberta'' kondizzjonata.\\n\\nFinalment wara li rat l-artikolu 383 tal-Kapitolu
  9 tal-Ligijiet ta'' Malta, torbot lil hatja b''obbligazzjoni taghha nnifsha taht
  penali ta'' elf  ewro (\u20ac1000) ghal zmien sena mill-lum sabiex izzomm il-paci
  ma'' Francesco Xuereb, Maria Xuereb u Josephine Dingli.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"QORTI TAL-MAGISTRATI (MALTA)\\n\\nMAGISTRAT DR. DENNIS MONTEBELLO\\n\\nSeduta
  tat-28 ta'' Ottubru, 2005\\n\\nAvviz Numru. 186/2005\\n\\nAvviz numru 186/05DM\\n\\nSelective
  Travel Limited \u2013 C 24601\\n\\nVs\\n\\nStanley Sciberras\\n\\nIl-Qorti,\\n\\nRat
  l-avviz permezz ta'' liema l-kumpanija attrici talbet ilkundanna tal- konvenut,
  ghall-hlas tas-somma kumplessiva ta'' tlett elef, mitejn u tnejn u erbghin lira
  Maltin (Lm3,242) rapprezentanti l-prezz bilancjali ghallavvjament u ''goodwill''
  tal-hanut ''Selective Travel'' f''Mimosa Street, Gwardamangia, skond skrittura privata
  tal-15 ta'' April, 2002, kif ukoll l-imghax legali dekorribbli mid-data ta'' l-istess
  skrittura sal-pagament effettiv.\\n\\nBl-ispejjez, u bil-konvenut li gie ngunt ghas-subizzjoni.\\n\\nKopja
  Informali ta'' Sentenza\\n\\nRat illi l-konvenut permezz ta'' nota guramentata pprezentata
  fir-registru fil-21 ta'' Lulju, 2005, ammetta minghajr riservi t-talba attrici.\\n\\nIt-talba
  attrici tirrizulta ampjament gustifikata.\\n\\nIl-Qorti qeghda ghalhekk  tilqa''
  it-talba attrici u tikkundanna lill-konvenut sabiex ihallas lill-atturi s-somma
  mitluba ta'' tlett''elef, mitejn, tnejn u erbghin lira Maltin (Lm3,242) ghar-ragunijiet
  indikati fl-Avviz, bl-imghaxijiet legali b''effett mill-15 ta'' April, 2002.\\n\\nBl-ispejjez
  kontra l-konvenut.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"QORTI TA'' L-APPELL KRIMINALI\\n\\nONOR. IMHALLEF JOSEPH GALEA DEBONO\\n\\nSeduta
  tat-22 ta'' Settembru, 2005\\n\\nAppell Kriminali Numru. 194/2005\\n\\nIl-Pulizija
  (Spt. A.P. Miruzzi) Vs\\n\\nFederico Vella\\n\\nIl-Qorti,\\n\\nRat l-akkuza dedotta
  kontra l-appellant quddiem ilQorti tal-Magistrati (Malta) bhala Qorti ta'' Gudikatura
  Kriminali,  talli bhala persuna registrata malKummissarju tat-Taxxa fuq il-Valur
  Mizjud skond l-Att tal-1998 dwar Taxxa fuq il-Valur Mizjud (Att nru. XXIII tal-1998)
  u regolamenti maghmula bis-sahha tal-istess Att, fis-7 t'' Ottubru 2004 fi Blata
  l-Bajda Pharmacy, Triq il-Kbira, Hamrun, naqas li jzomm kopja talircevuti mahruga
  skond it-Tlettax il-Skeda li tinsab mal-Att tal-1998 dwar Taxxa fuq il-Valur Mizjud
  u dan\\n\\nbi ksur tal-partita 1 (g) tal-Hdax il-Skeda li tinsab malistess Att u
  l-artikolu 76(b) tal-Att nru. XXIII tal-1998.\\n\\nRat is-sentenza tal-Qorti tal-Magistrati
  (Malta) bhala Qorti ta'' Gudikatura Kriminali tat-2 ta'' Gunju, 2005,  li biha,
  wara li rat l-Artikoli 76(b) u 82(2) tal-Att nru. XXIII tal-1998 u l-partita 1(g)
  tal-Hdax-il Skeda li tinsab mal-istess Att, sabet lill-appellant hati w ikkundannatu
  ghall-piena ta'' LM150 multa.\\n\\nRat ir-rikors tal-appellant minnu pprezentat
  fil-15 ta'' Gunju, 2005 li bih talab li din il-Qorti joghgobha tilqa'' lappell u
  tirrevoka s-sentenza appellata w tilliberah minn kull imputazzjoni w piena.\\n\\nFliet
  l-atti kollha processwali.\\n\\nRat il-verbal tas-seduta tal-lum li bih il-Prosekuzzjoni
  eccepixxiet preliminarjament in-nullita'' tar-rikors tal-appell in vista tal-fatt
  li fl-ewwel lok, ma ntalbitx is-sospensjoni tal-esekuzzjoni tas-sentenza w, fit-tieni
  lok, ir-rikors talappell ma fihx il-fatti fil-qosor.\\n\\nSemghet it-trattazzjoni
  dwar dawn l-eccezzjonijiet filkors tal-istess seduta.\\n\\nSemghet lill-istess appellant
  bil-gurament, bla pregudizzju ghall-istess eccezzjonijiet.\\n\\nIkkonsidrat ;\\n\\nIlli
  jirrizulta mid-deposizzjoni tal-istess appellant li wara li giet pronunzjata s-sentenza
  appellata, ilMagistrat li kien qed jippresjedi l-Qorti kien staqsa lillappellant
  jekk riedx jappella.  Dan kien wiegeb li ma jafx.  Ghalhekk jirrizulta li fid-data
  tas-sentenza ma ntalbitx is-sospensjoni tal-esekuzzjoni tas-sentenza tal-Ewwel Qorti
  w li  l-Ewwel Qorti ghalhekk ma mponietx it-termini tal-garanzija tajba li hija
  mehtiega skond l-artikolu 416 (1) fuq imsemmi biex appellant jaqla'' mill-Qorti
  Inferjuri it-twaqqif tal-esekuzzjoni tassentenza .\\n\\nIlli kif gie ritenut minn
  din il-Qorti diversament preseduta fl-Appell Kriminali \\\"Il-Pulizija vs. Mario
  Mifsud\\\"  (5.5.1994) :-\\n\\n\\\"Kwantu ghall-pregudizzjali tan-nullita'' w irritwalita''
  tal-appell minhabba il-mankanza tat-talba ghassospensjoni tal-esekuzzjoni tas-sentenza
  skond lartikolu 416 tal-Kodici Kriminali ,  jidher li lgurisprudenza pparifikat
  tali mankanza malakkwiexxenza , liema akkwiexxenza hija in  konflitt mall-volonta''
  li wiehed jappella (ara Il-Pulizija vs. Moses Bugeja u Edward Grech, App. Krim.
  28.1.94 ; Il-Pulizija vs. Frangisk Borg, 18.1.41; Vol. XXXIII.iv.391 u l-Pulizija
  vs. Alfred Ancilleri u John Cauchi.\\\"\\n\\nu aktar ''l isfel fl-istess sentenza  dik
  il-Qorti ziedet tghid :-\\n\\n\\\"wahda mill-karatteristici tal-process penali fissistema
  taghna huwa , illi kif appena tinghata sentenza , hlief jekk ikun hemm previst mod
  iehor fl-istess sentenza jew x''imkien iehor fil-ligi, dik is-sentenza ghandha tigi
  esegwita immedjetament.\\\"\\n\\nL-istess principju gie ribadit fl-appelli Kriminali
  : \\\"IlPulizija vs. Karl Gialanze\\\" (17.5.94.) u \\\"Il-Pulizija vs. Francis
  Micallef\\\" (5.7.94) , \\\"Il-Pulizija vs. Francis Scicluna\\\" (20.1.95) u \\\"l-Pulizija
  vs. Carmel Attard\\\" (30.6.95) .\\n\\nIlli fis-sentenza \\\"Il-Pulizija vs. George
  Cefai\\\" [23.4.1997] din il-Qorti diversament preseduta kienet irriteniet li ttalba
  ghas-sospensjoni tal-esekuzzjoni tas-sentenza ghandha ssir immedjetament wara li
  tinghata ssentenza. Dik il-Qorti kienet irriferiet ghall-artikolu 665 tal-Kodici
  Kriminali li jghid testwalment li :-\\n\\n\\\"Bla hsara tad-dispozizzjonijiet ta''
  l-artikolu 28A  (li jirrigwardaw sentenzi ta'' prgunerija sospizi )  u ddispozizzjonijiet
  ta'' dan il-Kodici  dwar il-hlas ta'' pieni ta'' flus, KULL DECIZJONI GHANDHA TIGI
  ESEGWITA MINNUFIEH LI TINGHATA.\\\" (Emfasi ta'' din il-Qorti)\\n\\nUmbaghad  irriferiet  ukoll
  ghall-artikolu 416 (1) talistess Kodici li  jghid testwalment li :-\\n\\n\\\"persuna
  misjuba hatja ...tista'' , meta tiddikjara imqar bilfomm, li trid tappella mis-sentenza,
  taqla  mill-Qorti nferjuri t-twaqqif tal-esekuzzjoni tas-sentenza ....\\\"\\n\\nDik
  il-Qorti  kienet  validament argumentat li dawn izzewg dispozizzjonijiet moqrijin
  flimkien , necessarjament ifissru li biex it-talba ghassospensjoni ta'' l-esekuzzjoni
  tas-sentenza tkun tista'' tigi milqugha , jehtieg li tigi maghmula mmedjetament
  kif tkun giet moghtija s-sentenza  w b''dan il-mod biss tista tigi evitata l-esekuzzjoni
  mmedjata tas-sentenza skond l-artikolu 665 citat .\\n\\nIlli din il-Qorti kif preseduta
  u kif gja rriteniet fl-Appell Kriminali \\\"Il-Pulizija vs. Victor Vella\\\" [6.1.2003]
  taqbel perfettament ma dan ir-ragunament  u tirritjeni li bilfatt li l-appellant
  odjern ,  ma deherelux li kellu jiddikjara  li jrid jappella , immedjetament wara
  li inghatat is-sentenza , kien inghata bidu effettiv ghallesekuzzjoni tas-sentenza
  mill-appellant.\\n\\nIlli dwar it-tieni pregudizzjali tal-Avukat Generali, huwa
  fatt illi r-rikors tal-appell ma jikkontjenix gabra tal-fatti fil-qosor kif preskritt
