  u g\u0127arrfu bix-xewqa tal-Kunsill li l-latrina pubblika f''Misra\u0127 i\u017c-\u017bjara
  tal-Papa \u0120wanni Pawlu II tkun ming\u0127ajr \u0127las g\u0127all-anzjani, kif
  ukoll waqt attivitajiet popolari li ji\u0121u organizzati fil-madwar.\\n2.2.2. Il-Kunsill
  innota l-azzjoni li ttie\u0127det.\\n\\n2.3.1. Servizz ta'' Trasport g\u0127all-Anzjani
  li jattendu \u010b-\u010aentru ta'' Matul il-Jum (A/1/2/Vol VII)\\n\\n2.3.2. Il-Kunsillier
  J. Attard irrefera g\u0127all-minuta 1.2. tas-seduta pre\u010bedenti u g\u0127arraf
