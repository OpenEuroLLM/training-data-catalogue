  u bdew jistennewhom barra i\u017cda x''\u0127in ixxhud mar ji\u010b\u010bekkja jekk
  kienux hemmhekk, ma sabhomx hemmhekk.\\n\\n13. Yves sive Bobby Cali xehed kif minn
