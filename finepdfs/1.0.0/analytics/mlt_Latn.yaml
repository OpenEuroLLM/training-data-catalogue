  Kien hemm qbil li l-ispi\u017ca g\u0127andu jag\u0127mel tajjeb g\u0127aliha mill-vot
  7502 talEstimi 2019, inti\u017c g\u0127all-asfaltar mill-\u0121did ta'' toroq u
  bankini \u0121odda.\\n5.2.6. Il-Kunsilliera A. Brincat Stellini, ipproponiet li
  titqassam notifika lir-residenti kollha talMellie\u0127a dwar l-arran\u0121amenti
