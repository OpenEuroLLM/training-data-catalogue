  il-pagament. I\u010b-\u010bekkijiet kienu ji\u0121u ffirmati mis-Segretarju E\u017cekuttiv
  u mis-Sindku.\\n\\n16. Patrick Pace xehed li l-pro\u010beduri kriminali fil-konfront
  tieg\u0127u huma finali\u017c\u017cati u \u0127are\u0121 liberat. Spjega li fis-sena
