  l''isfel mill-pompa tad-drena\u0121\u0121 sal-S-bend.\\n6.5. Il-Kunsill approva
  din il-proposta wkoll.\\n6.6. Saret referenza wkoll g\u0127all-imejl datat 12 ta''
  Marzu 2019 mibg\u0127ut mill-Fondazzjoni Grupp Azzjoni Majjistral, fejn il-Kunsill
  \u0121ie mistieden g\u0127at-tnedija tal-Mi\u017cura 4 tal-Fond Agrikolu Ewropew
  g\u0127all-I\u017cvilupp Rurali (EAFRD) li ser ikun orjentat lejn Green Infrastructure.
  Isseminar ser isir fil-21 ta'' Marzu 2019.\\n6.7. Il-Kunsill innota l-appuntament.\\n\\n7.1.
  Restawr tal-Batterija ta Westreme u titjib fil-Mu\u017cew tat-Tunnara (P/10/30)\\n\\n7.2.
  Is-Segretarju g\u0127arraf li mill-evalwazzjoni tat-tieni sej\u0127a g\u0127all-offerti
  li tinvolvi r-restawr talbatterija minn barra (MLC 11/2018), irri\u017culta li kien
  hemm tnejn minnhom li kienu konformi mar-rekwi\u017citi kollha stabbiliti mid-dokumenti
  tal-offerta, pero'' it-tnejn kienu ferm ''il fuq millba\u0121it ta'' \u20ac225,000
  allokat mill-Planning and Priorities Co-ordination Division (PPCD). Irri\u017culta
  li dan kien \u0121ej mill-fatt li l-istima sottomessa mal-formola tal-applikazzjoni
  g\u0127allfondi kellha inqas xog\u0127lijiet inklu\u017ci fiha meta mqabbla mal-bill
  of quantities li fuqu \u0121ew sottomessi l-offerti. Is-Sur C. Debono kompla jispjega
  li l-PPCD ma humiex lesti li japprovaw ebda tnaqqis mill-items inklu\u017ci fil-BOQ
  sabiex il-valur tax-xog\u0127ol li fil-fatt isir ikun eqreb lejn l-estimi. Irri\u017culta
  wkoll li l-BOQ kien jinkludi xog\u0127lijiet u tag\u0127mir li fil-fatt ma humiex
  koperti fil-permess ma\u0127ru\u0121 mill-Awtorit\u00e0 tal-Ippjanar.\\n7.3. Is-Sindku
  qal li f''dawn i\u010b-\u010birkostanzi huwa propost li ssir sej\u0127a \u0121did
  ta\u0127t BOQ rivedut.\\n7.4. Il-Kunsill approva l-proposta.\\n\\n8.1. Servizz dwar
  \u0121bir ta'' skart domestiku (K/6/2/Vol V)\\n\\n8.2. Is-Sindku rrefera g\u0127all-minuta
  7.1. tas-seduta pre\u010bedenti u stqarr illi l-kuntrattur responsabbli mhux obbligat
  bil-kuntratt li jag\u0127mel \u0121abriet ta'' skart differenti fl-istess \u0127in
  tal-bor\u017ca s-sewda u dik bajda, nhar ta'' Tnejn. Spjega li meta l-kuntrattur
  \u0121ie mitlub sabiex jirrendi \u017c-\u017cew\u0121 servizzi fl-istess \u0127in,
  dan qal li mhux f''po\u017cizzjoni li jag\u0127mel hekk, peress li meta tefg\u0127a
  lofferta tieg\u0127u kien ippjana li ju\u017ca r-ri\u017corsi tieg\u0127u b''tali
  mod li jo\u0127ro\u0121 bil-prezz li huwa kkwota. Kemm-il darba l-Kunsill jibqa''
  jinsisti fuq it-talba tieg\u0127u, huwa ser jid\u0127ol f''aktar spejje\u017c biex
  isib ir-ri\u017corsi me\u0127tie\u0121a li jippermettulu jiffunzjona f''inqas \u0127in.
  Ir-rata addizzjonali li qed jitlob il-kuntrattur hija ta'' \u20ac60, kull darba
  ming\u0127ajr il-VAT u l-contract management fee,.\\n8.3. Il-Kunsillier J. Azzopardi
  qal li l-bor\u017ca l-bajda qed iddum \u0127afna ma'' tin\u0121abar, filwaqt li
  qed isir t\u0121eddis ta'' skart f''diversi postijiet. Kompla jg\u0127id li din
  is-sitwazzjoni ser tiggrava matul ix-xhur tas-sajf.\\n8.4. Fid-dawl tat-tag\u0127rif
  mog\u0127ti, il-Kunsill approva varjazzjoni fil-kuntatt b''effett mill-1 ta'' April\\n2019,
  liema varjazzjoni tinvolvi nefqa annwali ta'' \u20ac60 x 52 \u0121img\u0127a = \u20ac3,681.60
  (bil-VAT inklu\u017ca).\\n\\n9.1. Kunsiderazzjoni u Approvazzjoni tal-Iskedi dwar
  l-Akkwist u tal-Pagamenti\\n\\n9.2. \u0120iet imressqa Purchase Request Form datata
  18 ta'' Marzu 2019.\\n9.3. Kien hemm qbil dwar il-\u0127ru\u0121 tal-purchase orders
  li fadal skont l-items elenkati fl-imsemmija skeda.\\n9.5. Tressqet Skeda ta'' Pagamenti
  li saru permezz tal-petty cash bejn l-10 ta'' Jannar u l-15 ta'' Marzu 2019.\\n9.6.
  Tressqet ukoll b''mod separat skeda ta'' pagamenti li tkopri bejn is-27 ta'' Jannar
  u l-15 ta'' Marzu 2019.\\n9.7. Il-Kunsill approva l-akkwist u l-pagamenti kollha
  fl-iskedi msemmija. Kien hemm qbil li lIskeda tal-Pagamenti g\u0127andha ti\u0121i
  ppubblikata permezz tas-sit elettroniku: https://localgovernmentcms.gov.mt/en/lc/Mellieha/Pages/Publications/Minutes.aspx\\n\\nA\u0120\u0120ORNAMENT\\n\\nIs-seduta
  spi\u010b\u010bat fid-9.30 pm u \u0121iet a\u0121\u0121ornata g\u0127al nhar it-Tnejn
  8 ta'' April fis-6.00 pm.\\n\\nJohn Buttigieg Sindku\\n\\nCarmel Debono Segretarju
  E\u017cekuttiv\"", "\"QORTI TAL-MAGISTRATI (GHAWDEX) BHALA QORTI TA'' GUDIKATURA
  KRIMINALI\\n\\nMAGISTRAT DR. EDWINA GRIMA\\n\\nSeduta tal-21 ta'' Marzu, 2013\\n\\nNumru.
  33/2007\\n\\nIl-Pulizija (Spettur Angelo Gafa'')\\n\\nvs\\n\\nElvin Grech ta'' 35
  sena bin Saverio u Paola nee'' Zammit, imwieled Victoria (Ghawdex) fil-5 ta'' Jannar
  1978, residenti f''60, Triq San Girgor, Kercem, Ghawdex u detentur tal-karta ta''l-identita
  2478(G)\\n\\nIl-Qorti;\\n\\nRat l-imputazzjonijiet migjuba fil-konfront tal-imputat
  Elvin Grech akkuzat talli f''dawn il-Gzejjer fl-20 ta'' Frar 2007, gewwa l-Ufficini
  tal-MEPA fir-Rabat, Ghawdex, xjentement ghamel uzu minn skrittura privata falza
  li setghet taghmel hsara lil xi persuna jew iggib utli;\\n\\nKif ukoll talli fl-istess
  data, lok u cirkostanzi sabiex tikseb xi vantagg jew beneficcju ghalih innifsu jew
  ghal haddiehor, f''xi dokument mahsub ghal xi awtorita'' pubblika, xjentement ghamel
  dikjarazzjoni jew stqarrija falza jew ta taghrif falz.\\n\\nU aktar talli fl-istess
  data, lok u cirkostanzi ghamel falsifikazzjoni ohra jew xjentement ghamel uzu minn
  xi dokument iehor falsifikat.\\n\\nSemghet il-provi.\\n\\nRat id-dokumenti esebiti.\\n\\nRat
  il-kunsens tal-Avukat Generali tad-09 ta'' April 2007 sabiex dana l-kaz jigi trattat
  u deciz bil-procedura sommarja.\\n\\nSemghet trattazzjoni.\\n\\nIkkunsidrat:\\n\\nIlli
  l-imputat huwa akkuzat bir-reat tal-falsifikazzjoni u taluzu tad-dokumenti iffalsifikati.\\n\\nKif
  gie ritenut f''diversi sentenzi moghtija mill-qrati taghna fosthom f''sentenza moghtija
  mill-Qorti tal-Appell Kriminali fl-ismijiet \\\"Il-Pulizija vs Paul Galea\\\" deciza
  17 October 1997:\\n\\n\\\"Id-differenza bejn il-falz materjali u il-falz ideologiku
  hi spjegata mill-awturi b''dan il-mod: filwaqt li fil-kaz tal-falz materjali d-dokument
  jigi iffalsifikat fl-essenza tieghu, fil-falz ideologiku d-dokument ikun iffalsifikat
  biss fis-sustanza u cioe'' fil-kontenut idejali tieghu (ara antolisei F. Manuale
  di Diritto Penali \u2013 V.VI n.2296 \u2013 829). Ikun hemm falz materjali meta
  d-dokument ikun wiehed mhux genwin (jigifieri jew meta l-awtur apparenti ma jkunx
  l-awtur rejali tad-dokument jew meta d-dokument ikun isubixxa alterazzjonijiet wara
  lformazzjoni definittiva tieghu), mentri fil-falz\\n\\nideologiku, ghalkemm id-dokument
  ikun genwin \\\"non e'' veridico, perche colui che lo ha formato gli fa dire cose
  contrarie al vero\\\". Ghall-finijiet tad-dottrina in tema ta'' falsita'' jkun hemm
  dokument kull fejn hemm kitba, attribwibbli ghal persuna identifikabbli, liema kitba
  tkun tikkontjeni esposizzjoni ta'' fatti jew ta'' volonta (Antolisei F. op.cit p594).
  S''intendi b''kitba wiehed ma jifhimx biss is-sinjali alfabetici, izda tinkludi
  dawk numerici, stenografici u anke kriptografici, basta li dik il-kitba tesprimi
  hsieb li jkun jiftiehem minn kulhadd jew minn certu numru ta'' nies. Il-kitba f''dan
  is-sens tista'' issir kemm bl-id, kif ukoll b''mezzi mekkanici, b''mezz indelibbli
  jew li jista'' jithassar u fuq kwalsiasi mezz li jista'' jiehu imqar temporanjament
  il-messagg \u2026\\\"\\n\\nIkkunsidrat:\\n\\nIlli l-Qorti qed taghmel referenza
  ghal dina l-gurisprudenza billi f''dana l-kaz il-falsita'' fid-dokument saret permezz
  ta'' mezzi elettronici u cioe'' permezz tas-sistema maghrufa bhala scanning u mhux
  b''kitba bl-idejn.\\n\\nIlli l-mertu ta'' dina l-kawza jikkoncerna ittra datata
  14 ta'' Frar 2007, li tidher iffirmata mill-Inginier Ronald Vella ghan-nom tal-Gozo
  Football Association mibghuta lillAwtorita dwar l-Ambjent u l-Ippjanar u dana in
  konnessjoni ma'' permess ghal istallazzjoni ta'' floodlights ghal grownd tal-futbol
  tax-Xewkija, Ghawdex. 1 Il-kwistjoni dwar dawn il-floodlights bdiet meta dawn id-dwal
  twahhlu fuq in-naha ta'' barra tal-istadium, minflok kif originarjament permess
  fuq in-naha ta'' gewwa.  Dina l-bidla fil-posizzjoni ta'' istallazzjoni ta'' dawn
  id-dwal sehh peress illi allegatament kien hemm reklam tal-Go Mobile li kien ser
  jitghatta bilpilastri ta'' dawn id-dwal.  Izda l-Assocjazzjoni ma kinitx giet moghtija
  permess sabiex dawn jitwahhlu fuq in-naha tat-triq.  Jidher illi dawn id-dwal, madanakollu,
  xortawahda twahhlu fuq in-naha ta'' barra u kwindi l-Assocjazzjoni kienet qed tipprova
  tikseb is-sanzjoni ghal dina l-bidla millAwtorita''.  Kien ghalhekk illi l-Inginier
  Ronald Vella, li kien\\n\\n1 Ittra esebieta Dokument EG4 a fol.15\\n\\nqed jiehu
  hsieb dana l-progett, intalab jaghmel ittra fejn huwa kellu jelenka rakkomandazzjonijiet
  minn naha tieghu''l ghala dawn id-dwal kellhom jibqghu imwahhla fuq in-naha tat-triq
  u mhux gewwa fl-istadium.  Ghalhekk intbaghtet l-ittra in kwistjoni li wasslet fl-ufficcini
  tal-MEPA f''Ghawdex fl-20 ta'' Frar 2007.  L-Awtorita'' baghtet acknowledgment lill-Inginier
  ta'' dina l-ittra li mal-ewwel innota illi fid-data indikata huwa ma kien baghat
  l-ebda ittra lill-Awtorita.  Ghalhekk  mar fl-ufficcju tal-Awtorita'' sabiex jara
  dina l-ittra u hawn mall-ewwel innota illi dina littra kienet falza ghaliex huwa
  qatt ma kien la kiteb u wisq anqas iffirma l-istess ittra.  Jghid illi huwa ma kienx
  accetta anzi li tintbaghat tali ittra billi huwa ma kienx jaqbel mal-kontenut tal-istess.  Ghalhekk
  huwa ghamel rapport lill-Pulizija u hawnwhekk skattat investigazzjoni li wasslet
  ghal proceduri odjerni.\\n\\nIlli fix-xhieda tieghu quddiem il-Qorti l-Inginier
  Ronald Vella  jikkonferma illi huwa kien gie nkarigat mill-Gozo Football Association
  sabiex jaghmel pjanta ghar-rigward tal-ground tal-futbol tax-Xewkija u l-lighting
  system ghallistess ground.  Skond id-disinji tieghu kellhom jitwahhlu zewg floodlights
  fuq in-naha ta'' gewwa tal-grownd mannaha tat-triq li tiehu lejn ir-Rabat u tnejn
  ohra fuq quddiem tal-ground.  Jghid illi kien twahhal reklam tal-Go Mobile li ha
  l-post ta'' fejn kellu jitwahhal wiehed mill-arbli ta'' dawn id-dwal.  Jghid illi
  l-Assocjazzjoni ghalhekk iddecidiet li larbli jitwahhlu fuq in-naha ta'' barra mat-triq.  Fil-fatt
  ixxoghol sar, izda wara hu kien gie nfurmat li kien hemm bzonn illi huwa jaghmel
  ittra sabiex jaghti raguni lil MEPA ''il ghala l-arbli twahhlu barra l-ground fuq
  il-bankina. Ghalhekk huwa hejja ittra fejn spjega illi dawn l-arbli saru skond ir-regolamenti
  tal-FIFA, izda meta rega'' mar Ghawdex, gie nfurmat illi dina l-ittra ma kinitx
  giet accettata mill-Awtorita u gie mitlub jaghmel dikjarazzjoni li huwa ma setax
  jaqbel maghha peress illi fil-fehma tieghu r-ragunijiet migjuba fiha ma kinux teknikament
  validi u ghalhekk dina irrifjuta li jiffirmaha.  \\\"Fiha hemm irragunijiet il ghala
  l-arbli gew fuq barra kif ghidt, liema ragunijiet jiena teknikament zgur ma nista''
  qatt naqbel maghha ghaliex dawn saru semplicement sabiex jahbu il-verita u cioe''
  ir-raguni vera li kienet illi l-arbli\\n\\ngew fuq barra minhabba illi kien hemm
  is-sign tal-Go Mobile.\\\"  Jghid illi xi zmien wara huwa rcieva acknowledgment
  minghand il-MEPA ghar-rigward ta'' ittra li huwa qatt ma kien baghat.  Huwa jinnega
  illi dina l-ittra kienet giet mghoddija lilu sabiex jiffirmaha.  Vella ighid: \\\"Nghid
  illi ghar-rigward tal-kwistjoni tal-floodlights, jiena kont niddiskuti u niddillja
  biss ma'' l-imputat Elvin Grech. \u2026 Kien is-sur Grech fil-fatt illi kien talabni
  li naghti dawn ir-ragunijiet ghaliex kif diga xehedt jiena kont niddilja mieghu
  biss \u2026 Lil President ta'' l-Assocjazzjoni jiena ma kellimtux fuq dana il-kaz,
  la qabel waqt li kien ghaddej il-progett u lanqas wara li jiena kont ghamilt dana
  ir-rapport lill-pulizija.\\\" 2\\n\\nIlli minn investigazzjonijiet li saru mill-pulizija
  irrizulta illi apparti l-imputat, li kien jokkupa l-kariga ta'' segretarju talAssocjazzjoni,
  kien impjegat certu Philip Pisani bhala assistant segretarju.  Dana Philip Pisani
  jixhed u jghid illi huwa kien jaghmel xoghol klerikali.  Jikkonferma illi huwa wkoll
  kien gie mitkellem mill-pulizija in konnessjoni ma'' dana l-kaz flimkien mal-imputat
  u li qabel ma kien gie hekk mitkellem huwa kien mar mal-imputat ikellem avukat.
  Jghid illi huma kienu l-ewwel kellmu lil Dr. Joseph Grech u wara lil Dr. Anton Refalo.  Jghid:
  \\\"Jiena sirt naf fuq dina l-kwistjoni qabel ma fil-fatt kellimni l-Ispettur Gafa''.
  Nghid illi xi ftit qabel kien cempilli Elvin Grech fuq ilpost tax-xoghol tieghi
  u kien talabni sabiex ninzel urgenti fl-ufficcju ta'' l-assocjazzjoni. \u2026 Dan
  kien infurmani illi l-Inginier Vella kien ser idahhalna f''xebgha inkwiet ghaliex
  kien qed jallega illi kien hemm xi firma falsifikata fuq ittra illi allegatament
  kien kiteb hu.  Dan Elvin Grech kien qalli li kien qed iwahhal jew fija jew fih.\\\"
  3 Huwa jghid illi l-imputat kien ghaddielu ittra li kienet parti ittajpjatha u parti
  miktuba blidejn u talbu biex jittajpjaha pulita u wara jghaddihielu u qallu li l-Inginier
  kien qallu sabiex jaghmilha hu ghax ma kellux hin jiktibha.  Jghid illi hu hekk
  ghamel.  Kif lestieha huwa ipprintja l-ittra u poggieha fuq l-iskrivanija tal-imputat
  fl-ufficcju tieghu peress illi f''dak il-hin l-imputat ma kienx\\n\\n2 Ara xhieda
  ta''l-Inginier Vella a fol.23\\n\\n3 Ara xhieda a fol.89\\n\\nhemm.  Huwa lesta
  mix-xoghol u telaq lejn id-dar u ma jafx x''sar iktar minn dina l-ittra.  Ghalkemm
  jikkonferma illi l-ittra ittajpjaha hu, izda jichad illi l-firma ghamilha hu jew
  li jaf kif saret.  Ix-xhud jikkontendi illi meta hu u Grech kienu marru ghand Dr.
  Refalo, l-avukat kien qallu biex jaghti verzjoni ohra u cioe'' illi hu kien iltaqa''
  mal-Inginier Vella u talbu biex imur jara l-ittra li kienet lesta fuq id-desk tieghu
  u wara telaq.  Izid izda illi din ma kinitx il-verita''.  In kontroezami, imbaghad,
  jichad illi l-avukat Refalo kien qallu jghid dana d-diskors. Fil-fatt juri titubanza
  shiha meta jigi biex ighid ezattament x''kien sehh meta mar fl-ufficcju taz-zewg
  avukati u wara hafna bdil fil-verzjonijiet fl-ahhar ighid illi lil dawn iz-zewg
  avukati huwa ma qalilhom xejn u kien halla kollox f''idejn l-imputat.  Illi d-difiza
  ippruvat taghmel character assasination ta'' dana x-xhud billi tohrog b''diversi
  allegazzjonijiet fosthom illi kien jircevi xi hlasijiet hu personalment ghar-rigward
  ta'' reklamar fil-magazine tal-Assocjazzjoni, illi huwa kien involut mat-tfajla
  tieghu mill-Cameroon f''xi kaz mal-pulizija gewwa Sqallija, illi huwa kellu l-vizzju
  jhassar zbalji fuq dokumenti talAssocjazzjoni bit-Tippex, kif ukoll illi kien jaghmel
  diversi telefonati mill-ufficcju tal-Assocjazzjoni fil-hin ta'' bil-lejl lejn il-Cameroon
  fejn kien hemm it-tfajla tieghu 4 .  Illi ghalkemm isiru diversi allegazzjonijiet,
  ma jidhirx madanakollu illi lAssocjazzjoni qatt ghamlet xi rapport lill-pulizija
  in konnessjoni mal-istess ghalkemm jidher illi Pisani gie mkecci mill-assocjazzjoni
  wara li inqala'' dana il-kaz.\\n\\nIlli mix-xhieda tal-PS266 Stefan Decelis addett
  mac-Cyber Crime Unit jirrizulta illi ghalkemm l-ittra ma nstabitx floriginal taghha
  fil-kompjuter elevat mill-ufficcju ta'' Philip Pisani madanakollu jidher illi dina
  giet issejvjatha fi swap file u ghalhekk il-kopja li nstabet ma kinitx tikkontjeni
  lfirma tal-Inginier Vella.\\n\\nIlli l-Qorti hatret lil-P.L. Juliana Scerri Ferrante
  bhala espert tal-kalligrafija sabiex tistabilixxi jekk il-firma li tidher fuq l-ittra
  datata 14 ta'' Frar 2007, esebita bhala Dokument EG4 hijiex il-firma awtentika tal-Inginier
  Ronald Vella u\\n\\n4 Ara Dokumenti  MM1 sa MM5 a fols.135 sa 150 tal-process. EM3
  sa EM9 a fols. 266 sa 304 tal-process. Dokument EcCa fols.177 sa 182\\n\\njekk l-istess
  firma saritx bl-idejn jew b''xi mezz elettroniku. Illi in adempiment tal-inkarigu
  lilha moghti l-espert kalligrafiku ipprezentat ir-relazzjoni taghha fis-16 ta''
  Ottubru 2007. 5 Hija ikkonkludiet:\\n\\n\\\"Illi l-karatteristici kollha (tal-kitba)
  qablu (ma dik talInginier Ronald Vella) hlief dik li hija l-iktar important \u2013
  il-pressjoni.  Il-pressjoni tal-kitba ma hiex dik talInginier Ronald Vella, infatti
  din il-firma probabbilment lanqas biss inkitbet minn awtur izda saret permezz ta''
  uzu ta'' scanner.  Dan ifisser illi fl-opinjoni tal-esperta, il-firma ta'' Ronald
  Vella giet ikkuppjata permezz ta'' uzu elettroniku, probabbilment scanner.\\\"\\n\\nIlli
  abbazi ta'' dawn il-konkluzjonijiet, il-Qorti hatret lillespert Dr. Martin Bajada
  sabiex jistabilixxi jekk il-firma li tidher fuq l-ittra mertu tal-kawza gietx skannjata.   Illi
  lespert ipprezenta r-relazzjoni tieghu fl-14 ta'' Ottubru 2008 fejn ikkonkluda:\\n\\n\\\"Illi
  l-firma li tinsab fuq id-Dokument EG4, firma fuq ilkliem Ing.R.Vella, hija risultat
  ta'' cut and paste ta'' firma mehuda minn fuq dokument iehor.  Il-firma wara li
  giet scanned minn fuq dokument iehor, giet trasferita u printed fuq Dok EG4.  Il-printing
  irrizulta li sar permezz ta'' Inkjet Printer. 6 \\\" (sottolinjar tal-Qorti)\\n\\nIlli
  l-imputat jirrilaxxja tlett stqarrijiet, meta jigi interrogat mill-pulizija. 7 Dawn
  l-istqarrijiet huwa jikkonfermhom meta mbaghad jaghti x-xhieda tieghu fil-qorti.  L-imputat
  fixxhieda tieghu jghid illi kien hu li ddraftja l-ittra u dana fuq suggerimenti
  li kienu ghaddewlu xi ufficjali tal-MEPA, imbaghad ghadda l-istess ittra lill-assistant
  segretarju Philip Pisani sabiex jittajpjaha.  Jghid illi huwa ta struzzjonijiet
  lil dana Pisani sabiex ighaddi l-ittra lillInginier li kellu jkun Ghawdex aktar
  tard fil-gurnata, sabiex l-Inginier jiffirma l-ittra.  Wara huwa mar lejn id-dar
  minhabba li martu kienet ma tiflahx hafna.  Meta dahal lura fl-ufficcju jghid illi
  l-ittra sabha lesta u ghalhekk ghamel kopja taghha sabiex din tigi mibghuta lill-Inginier
  u\\n\\n5 Ara Dokument EG19 a fol.52 et seq\\n\\n7 Ara stqarrijeit Dokumenti EG5,
  EG6 u EG7 a fols. 16 sa 21\\n\\n6 Ara rapport Dokument MB a fol.116\\n\\nl-ohra  u
  cioe'' l-original kien mar biha huwa personalment fl-ufficcju tal-MEPA. 8 Jghid
  illi xi jiem wara huwa kien ikkomunika mal-Inginier minhabba xi kwistjoni li kien
  hemm fuq kont mibghut minnu.  Hawnhekk l-Inginier kien infurmah illi kien ghamel
  rapport  lill-pulizija minhabba li kien hemm firma falza tieghu fuq dina l-ittra.  L-imputat
  ighid illi nkwieta meta sema'' b''din l-ahbar u baghat ghal Philip Pisani, li ghalkemm
  ma ammettiex mieghu li kien hu li ffalsifika l-firma, madanakollu qallu li ma kellux
  ghalfejn jinkwieta ghaliex hu u t-tfajla tieghu kienu diga ghaddew minn problema
  aghar meta gew arrestati fi Sqallija.  Limputat ighid illi huwa nforma wkoll lill-President
  ta'' dak izzmien dwar dina l-allegazzjoni.  Meta kien baghat ghalih lIspettur Gafa,
  l-imputat ighid illi qabel ma nizel ikellmu huwa ha parir legali minghand Dr. Joseph
  Grech.  Jghid illi dakinhar flimkien mieghu kien mar ukoll Philip Pisani, izda jiftakar
  illi l-avukat kien kellem lil Pisani wahdu.  Jghid madanakollu illi Pisani  qal
  lill-avukat illi l-ittra huwa kien ghaddieha lill-Inginier Vella sabiex jiffirmaha.  L-ghada
  fuq suggeriment ta'' Pisani, l-imputat ighid illi kienu iddeciedew ikellmu avukat
  iehor.  Ghalhekk ghal darb''ohra flimkien, huma kienu marru ghand Dr. Anton Refalo.  Jghid
  illi Dr. Refalo, quddiemu kien stqasieh min kien iffirma l-ittra, u Pisani baqa''
  jinsisti illi huwa kien ghaddieha lill-Inginier filground u dana iffirmaha.\\n\\nBilli
  mir-rapport tal-espert irrizulta illi l-firma tal-Inginier Ronald Vella ma kinitx
  fl-original, izda kienet scanned, limputat ighid illi fl-ufficcju tal-Gozo Football
  Association kien hemm photocopier/scanner li kienet tinsab fuq xi xkaffar wara d-desk
  ta'' Philip Pisani.  Jikkontendi, izda, illi huwa qatt ma kien juza dana l-iscanner
  u lanqas kien jaf juzaha ghaliex qatt ma kellu bzonn jaghmel dan u ghalhekk ma hax
  interess sabiex jara kif tahdem. Jichad kategorikament illi l-firma kienet giet
  scanned minnu. Jghid testwalment:\\n\\n\\\"Jiena nichad illi din il-firma li hija
  skannjata skannjajtha jien.  Jiena ma kontx naf illi kienet qed tintbaghat ittra
  li kellha firma falsifikata b''scanner.\\n\\n8 Ara xhieda ta''l-imputat a fol.154\\n\\nNghid
  li kieku ma kontx immur biha jiena personali u naghtihielhom by hand fl-ufficcju
  tal-MEPA.\\\" 9\\n\\nIn kontro-ezami huwa jibqa jichad illi kien jaf juza dina liscanner,
  ghalkemm jammetti, meta jigi mistoqsi illi huwa ghandu il-baccellerat fl-IT.\\n\\nL-imputat
  ighid illi wara dana l-incident huwa kien ircieva struzzjonijiet mill-President
  Joe Cordina sabiex ikecci lil Pisani mill-kariga ta'' assistent segretarju u ghalhekk
  huwa kien talbu jirritorna c-cwievet kollha tal-ufficcini kif ukoll ilphotocopier\\\\scanner
  li kienet fil-karozza tieghu u cioe'' listess scanner li allegatament intuzat f''dana
  l-kaz.  Wara dan huwa gie mitlub jaghmel indagini fuq l-operat ta'' dana Pisani
  u minn hawn gie skopert illi kien hemm bosta irregolaritajiet fix-xoghol ta'' Pisani.  Fost
  dawn lirregolaritajiet huwa jsemmi l-fatt illi Pisani kien jircevi hlas ghal reklamar
  fil-magazine tal-assocjazzjoni f''ismu personali fejn anke kien baghat ittra lill-benefatturi
  talassocjazzjoni fejn talabhom jindirrizzaw ic-cekkijiet f''ismu. 10 Ighid ukoll
  illi Pisani kien ammetta maghhom illi kien qed jaghmel diversi telefonati lejn il-Cameroon
  fejn tirrisjedi t-tfajla tieghu. Dawn kien jaghmilhom tard bil-lejl. Id-difiza esebiet
  ukoll kontijiet mahrugin mill-Maltacom plc li jindikaw dan. 11\\n\\nIlli l-imputat
  fix-xhieda tieghu ighid:  \\\"Fl-ufficcju tieghi niftakar jiena kelli computer normali
  u printer inkjet. Fuq il-mejda ta'' Philip Pisani niftakar li kellu computer ukoll
  u kellu printer laser fuq id-desk tieghu. Nghid li wara id-desk ta'' Philip kien
  hemm xkaffar u fuq lixkaffar kien hemm photocopier tal-kulur.  Din kienet photocopier
  scanner zghira.\\\"  Aktar tard fix-xhieda tieghu huwa jirreferi ghaliha bhala printer\\\\scanner.  Illi
  ddifiza mbaghad esebiet zewg ritratti fejn fid-Dokument EM1 jidher il-printer li
  kien hemm fl-ufficcju tal-imputat, filwaqt illi fid-Dokument EM2 jidher il-printer/scanner
  li limputat jikkontendi li kienet fuq id-desk ta'' Philip Pisani.\\n\\n9 Ara xhieda
  ta''l-imputat a fol.156\\n\\n11 Ara document esebiet a fol.180\\n\\n10 Ara ittra
  Dokument MM1 a fol.135\\n\\nIlli d-difiza, imbaghad, tressaq diversi xhieda sabiex
  jindikaw illi Pisani ma kienx bniedem li wiehed jista'' jafdah, kif ukoll rappresentant
  tal-MEPA u l-Inginier Renzo Curmi li spjegaw l-iter twil sakemm harget il-compliance
  certificate minn naha tal-Awtorita ghall-istallazzjoni talflood lights fuq in-naha
  ta'' barra tal-istadium.\\n\\nIkkunsidrat:\\n\\nIlli mill-provi akkwiziti fl-atti
  ma hemmx dubbju illi l-firma li tidher fuq l-ittra tal-14 ta'' Frar 2007 indirizzata
  lill-Awtorita ta'' Malta dwar l-Ambjent u l-Ippjanar hija firma li giet scanned
  u m''hijiex il-firma fl-original tal-Inginier Ronald Vella.  Ma hemmx dubbju lanqas
  illi l-Inginier ma kellu xejn x''jaqsam mal-kontenut ta'' dina l-ittra u fil-fatt
  ighid illi lanqas ma kien jabqel mal-kontenut tal-istess u kien irrifjuta jibghat
  tali ittra meta gie avvicinat mill-imputat.  Illi l-imputat minn naha tieghu jichad
  kategorikament mhux biss illi huwa iffalsifika l-firma jew kien l-awtur taliscanning
  taghha, izda sahansitra jichad kategorikament illi kien jaf dwar dan meta huwa ikkonsenja
  dina l-ittra lillAwtorita tal-Ippjanar.  Jikkontendi ghalhekk illi huwa kellu n-nuqqas
  ta'' xjenza dwar il-falsita'' ta'' dana d-dokument. Illi l-Qorti tistqarr illi lill-imputat
  ma tistax temmnu u dana ghas-segwenti ragunijiet:\\n\\n1. Illi l-imputat jipprova
  jgieghel lill-Qorti temmen illi dina l-makkinazzjoni saret kollha kemm hi minn Philip
  Pisani u li hu ma kellu xejn x''jaqsam ma'' dina l-kwistjoni. Dana ighidu ''il ghaliex
  l-ittra giet ittajpjatha minn Pisani, kif jammetti fuq kollox Pisani stess, u li
  l-iscanner kienet flufficcju ta'' Pisani u mhux tieghu u sahansitra huwa lanqas
  biss jaf  juza dina l-iscanner.  Illi Elvin Grech ighid illi flufficcju tieghu huwa
  kellu computer u inkjet printer filwaqt illi l-iscanner kienet fuq xkaffa wara l-iskrivanija
  ta'' Pisani u li Pisani kellu laser printer.  Illi Philip Pisani minn naha tieghu
  ighid: \\\"Kelli computer fuq id-desk u black laser printer, photocopier u machine
  cards.  Il-printer kien biss jipprintja u ma kienx jaghmel scanning.  Kien hemm
  printer li madanakollu kien jaghmel scanning. Dan kien fl-ufficcju tas-segretarju
  ta'' dak iz-zmien\\n\\nElvin Grech u cioe'' l-imputat. 12 \\\"  Illi kif diga nghad
  iddifiza tesebixxi zewg ritratti li juru l-printers li kien hemm flufficcini ta''
  dawn it-tnejn minn nies minn fejn jirrizulta illi linkjet printer kien fl-ufficcju
  tal-imputat.  Dana qed jinghad ghaliex mir-rapport tal-espert Dr. Martin Bajada
  jirrizulta illi l-firma giet ipprintjata permezz ta'' inkjet printer u mhux laser
  printer.  Illi l-mod kif jahdmu dawn iz-zewg tipi ta'' printers hija differenti:
  \\\"Inkjet printing creates a digital image by dropping spots of ink onto paper;
  laser printers produce digital images by scanning a laser beam across photoreceptors
  13 \\\".  Illi l-espert hejja zewg ingrandimenti ta'' dina l-firma mnejn johrog
  car iddifferenza bejn iz-zewg tipi ta'' printing kif imfissra hawn fuq.  Illi mbaghad
  mix-xhieda ta'' Keith Vella Muskat, prodott mid-difiza, li ddeskriva l-ambjenti
  fejn jinsabu lufficcini tal-Gozo Football Association, ighid illi l-ufficcju tas-segretarju
  u cioe'' tal-imputat kellu bieb u kien jissakkar u kienu biss l-ambjenti fejn kien
  joqghod lassistent segretarju u cioe'' Philip Pisani illi kienu accessibbli ghal
  kulhadd.  Dana x-xhud izid ighid ukoll illi l-printer scanner li jidher fir-ritratt
  Dokument EM2 kien fuq xkaffa fl-ufficcju ta'' Pisani u llum dana l-printer ighid
  li jintuza fil-ground\\\" \\\"Ta'' Sannat\\\" u jintuza in konnessjoni mal-line-up
  tal-players. 14 Dana kollu jwassal lill-Qorti ghal konkluzjoni wahda u cioe'' illi
  l-firma li tidher fuq l-ittra mertu ta'' dina l-kawza setghet giet trasferita ghal
  fuq ilkarta fejn inkitbet biss minn fuq il-printer inkjet li hemm flufficcju tal-imputat
  u mhux minn xi apparat iehor li hemm fl-ufficini tal-Assocjazzjoni u kwindi l-imputat
  ma jistax jitwemmen meta jghid illi l-iscan u l-printing sar mill-printer ta'' Pisani.  Illi
  l-Qorti hadet l-impressjoni illi dawn it-tnejn minn nies u cioe'' l-imputat u Philip
  Pisani jippruvaw iwahhlu f''xulxin sabiex jezimu rwiehom minn kull htija in konnessjoni
  ma'' dana l-kaz.  Il-Qorti ma tistax temmen la lil wiehed u lanqas lill-iehor.  Dana
  ghaliex huwa evidenti fix-xhieda taghhom illi qeghdin jitfghu l-htija fuq xulxin
  meta jippruvaw ighidu illi l-iscanner kien jintuza minn wiehed u mhux mill-iehor.
  Madanakollu huwa rilevanti mhux biss il-fatt illi l-firma kienet giet skannjata
  izda wkoll\\n\\n12 Ara xhieda in kontro-ezami ta'' Philip Pisani a fol.130\\n\\n14
  Ara xhieda ta'' Keith Vella Muskat a fol.250\\n\\n13 http://www.apartmenttherapy.com\\n\\nimportanti
  dak li jikkonkludi l-espert Bajada illi dina l-firma setghet giet ipprintjatha biss
  permezz ta'' inkjet printer u mhux laser printer, liema printer kien jinsab fl-ufficcju
  talimputat.\\n\\n2. Illi l-imputat jinnega in kontro-ezami illi huwa kien jikkomunika
  direttament mal-Inginier Vella u li hu kien jaghmel dak biss illi kienu jghidulu
  l-President jew lEzekuttiv.  Jghid illi ghalkemm huwa kien qal lill-Inginier li
  kellhom bzonn ittra ghall-MEPA izda huwa jghid illi qatt ma qallu x''kellu jkun
  il-kontenut tal-istess.  Madanakollu mbaghad huwa jghid illi kien ha l-izbriga illi
  jistaqsi x''kellu jkun fiha l-ittra sabiex l-istallazzjoni tal-arbli tigi approvata
  mill-Awtorita'' u jsemmi illi kien kellem lil certu Mark Cini mill-Awtorita li tah
  istruzzjonijiet x''kellu jkun fiha dina littra.  Dana jfisser illi ghalkemm kif
  ighid l-imputat qatt ma ddiskuta l-ittra mal-Inginier, madanakollu hass illi dina
  littra seta'' jiktibielu hu minghajr konsultazzjoni, abbazi ta'' dak li ssugerrielu
  Cini!  Illi jigi rilevat illi dana Mark Cini qatt ma jigi prodott bhala xhud mid-difiza
  sabiex jikkonferma dak li jikkontendi l-imputat.\\n3. Fil-fatt l-Inginier Vella,
  minn naha tieghu, jispjega illi huwa kien ikellem biss lil Elvin Grech fuq dina
  l-kwistjoni tal-arbli tad-dawl u lil hadd iktar mill-Assocjazzjoni.  Fil-fatt ighid
  illi lanqas lill-President ma kien kellem dwar dan. Huwa jghid illi kien Grech li
  kien qallu x''kellu jkun fiha littra, izda huwa rrifjuta li jaghmel dak illi qallu
  Grech u dana ghaliex huwa ma kienx jaqbel bhala fatt illi l-arbli tad-dawl kellhom
  jitwahhlu fuq in-naha ta'' barra talground.  Illi ghalkemm l-imputat jichad u jghid
  illi huwa qatt ma qal lil Vella x''kellu jaghmel u ghamel biss dak li dderigieh
  l-Ezekuttiv illi jaghmel, madanakollu, imbaghad, ma jressaq lil hadd mill-Ezekuttiv
  jew lill-President ta'' dak iz-zmien sabiex jikkonferma dan kollu.  Dana jfisser
  illi kien l-imputat li kellu nteress illi l-ittra bil-kontenut kif xtaq hu, kellha
  tigi pprezentata lill-Awtorita'' u hadd iktar u kwindi dana jikkonferma illi huwa
  kellu l-animus illi jahseb f''xi mezz sabiex ikun jista'' jaghmel dan minghajr ma
  jkun jenhtieg illi l-Inginier jiffirmalu l-ittra.\\n4. Illi jirrizulta illi fis-27
  ta'' Frar 2007, l-imputat kien cempel lill-Inginier Vella sabiex ikellmu dwar xi
  kont, izda dana kien pretest biss sabiex ikellmu dwar dina l-ittra, u dana ghaliex
  Vella kien diga mar ghand il-pulizija u\\n\\nrrapurtah.  Fil-fatt jirrizulta illi
  l-Inginier Vella kien ghamel rapport lill-pulizija fit-23 ta'' Frar 2007.  Meta
  jkellmu fuq ittelefon l-imputat ighid lil Vella illi kien xi hadd impjegat mal-Assocjazzjoni
  illi kien sab l-ittra fuq l-iskrivanija tieghu u hadha l-Awtorita''.  Jghid illi
  dina l-persuna kellha turi littra lilu qabel ma tehodha ghand l-Awtorita'' izda
  peress illi raha iffirmata haseb illi hu kien diga raha u ghalhekk ikkonsenjaha
  lill-MEPA.  Dana jirrizulta min-notamenti illi ha Vella a tempo vergine esebiti
  in atti.(Dokument EG10). 15 Meta jigi nterrogat, imbaghad, l-imputat jaghti verzjoni
  ohra.  Jghid illi wara li ta struzzjonijiet lil Pisani sabiex jittajpjaha l-ittra
  qallu biex ighaddieha lil Vella ghallfirma.  Jidher illi dakinhar Vella kien qieghed
  fil-ground ghaliex l-imputat ighid illi nizel ikellmu, izda haga taliskantament,
  ma jsemmielu xejn dwar dina l-ittra.  Wara dan huwa rega mar lura fl-ufficcju u
  sab lil Pisani sejjer ''l hemm ghax qallu li ried jinzel Malta.  Ghalhekk huwa tefa
  d-dwal tal-ground u telaq lejn id-dar izda ma dahalx flufficcju biex jara jekk l-ittra
  kinitx lesta 16 u jaraha biss lghada jew il-pitghada fuq il-front desk minn fejn
  gabarha u kkonsenjaha hu stess il-MEPA xi jiem wara. Meta jixhed fil-Qorti, imbaghad,  jaghti
  verzjoni ohra.  Jghid illi wara li ta struzzjonijiet lil Pisani biex jikteb l-ittra,
  huwa telaq b''urgenza lejn id-dar billi l-mara tieghu kienet ma tiflahx u ried jehodha
  ghand it-tabib.  Jghid illi dakinhar huwa ma regax mar lura hemmhekk peress illi
  kellu jiehu hsieb lil bintu minhabba li martu kienet marida. Il-Qorti, ghalhekk
  tistaqsi \u2013 liema hi l-verzjoni t-tajba.  L-imputat donnu jipprova jirfina l-verzjoni
  tieghu maz-zmien sabiex igibha aktar kredibbli!\\n\\n5. Il-Qorti wkoll tqis illi
  ma kien hemm l-ebda raguni ''l ghala l-imputat u Pisani kellhom imorru jikkonsultaw
  ma'' avukat flimkien meta l-imputat ighid illi ma kellux x''jaqsam mal-firma falsa
  fuq l-ittra.  Tant hu hekk illi l-imputat hass li kellu jcempel lill-Inginier Vella
  ghal iktar minn darba qabel ma gie interrogat mill-pulizija u sahansitra sar ftehim
  quddiem l-avukat Refalo x''kellu jinghad lill-pulizija meta jigi interrogat.  Il-Qorti
  tistaqsi allura x''kienet ir-raguni ''l ghala l-imputat kaxkar lil Pisani mieghu
  ghand l-avukat\\n\\n15 Ara notamenti a fol.28 u xhieda a fol.24\\n\\n16 Ara stqarrija
  a fol.17\\n\\ngialadarba dana kien bniedem illi wiehed ma jistax jafdah? Illi matul
  il-kors tat-trattazzjoni tal-kawza, l-imputat ipingi stampa illi Pisani kien bniedem
  li ma tistax torbot fuqu u anke jaghmel allegazzjonijiet serji fil-konfront tal-istess
  fosthom illi dana Pisani kien frodist u seraq xi flus talAssocjazzjoni. Allura x''kienet
  ir-raguni ''l ghala ma kixfux mal-pulizija u pponta subajh lejh minflok mar ghand
  lavukat mieghu bhallikieku kienu t-tnejn fl-istess borma flimkien!  Il-verita kienet
  wahda u cioe'' illi dawn it-tnejn minn nies kienu jafu ben tajjeb illi l-ittra kienet
  giet maghmula u mibghuta lill-Awtorita'' ad isaputa tal-Inginier Vella u li l-firma
  li kien hemm fuq l-ittra kienet firma skanjatha.\\n\\nIlli ghalhekk, ghalkemm dina
  l-Qorti ma tistax tasal ghallkonkluzjoni illi kien l-imputat li skannja l-firma
  tal-Inginier Vella u li kien ukoll l-imputat li ipprintjaha l-ittra, madanakollu
  abbazi ta'' dawn il-fatti hawn fuq elenkati din il-Qorti tista'' tasal ghal konvinciment
  morali illi l-imputat kien jaf illi l-firma li kien hemm fuq l-ittra mertu tal-kawza
  ma kinitx dik tal-Inginier Vella. Billi jirrizulta illi l-Inginier Vella ma kienx
  lest li jiffirma dikjarazzjoni kif xtaq l-imputat u dana sabiex tigi issanata dak
  illi l-Assocjazzjoni kienet ghamlet minghajr il-permess tal-awtoritajiet ikkoncernati,
  limputat ghalhekk indaga sabiex jara ezattament x''kellu jkun fiha l-ittra lill-Awtorita
  u mbaghad ippretenda illi lInginier Vella jiffirmahielu.  Meta dana tal-ahhar ma
  accettax li jaghmel dan, saret imbaghad l-ittra tal-14 ta'' Frar 2007 fejn il-firma
  tal-Inginier giet skannjata u ipprintjatha u wara dan l-imputat wassal dina l-ittra
  flufficcju tal-Awtorita tal-Ippjanar gewwa Ghawdex.\\n\\nGhaldaqstant ma hemmx dubbju
  illi fl-20 ta'' Frar 2007, meta l-imputat ghamel dan huwa xjentement ghamel uzu
  minn dokument falz u dana kif previst fl-artikolu 189 talKapitolu 9 tal-Ligijiet
  ta'' Malta.  Billi ma hemmx prova illi kien l-imputat illi iffalsifika l-ittra in
  kwistjoni, ghalkemm ma hemmx dubbju illi l-kontenut tal-ittra saret minnu,  limputat
  ser jigi illiberat mill-akkuzi l-ohra.\\n\\nIlli meta tigi biex tqis il-piena li
  ghandha tigi nflitta l-Qorti ser tiehu in konsiderazzjoni l-fedina penali kwazi
  nadifa\\n\\ntal-imputat u kwindi ghandu jigi ttrattat bhala first time offender
  u ghalhekk piena karcerarja effettiva ma hijiex idonja ghal dana l-kaz.\\n\\nGhaldaqstant
  il-Qorti, wara li rat l-artikolu 189 tal-Kapitolu 9 tal-Ligijiet ta'' Malta, filwaqt
  li tillibera lill-imputat millewwel zewg akkuzi migjuba fil-konfront tieghu, issibu
  hati tat-tielet akkuza, tikkundannah ghal perijodu ta'' hames xhur prigunerija,
  li b''applikazzjoni tal-artikolu 28A talKapitolu 9 tal-Ligijiet ta'' Malta, dana
  l-perijodu ta'' prigunerija qed jigi sospiz ghal zmien sentejn mill-lum.\\n\\nIl-Qorti
  twissi lil hati bil-konsegwenzi skond il-ligi jekk huwa jikkometti reat iehor matul
  il-perijodu operattiv ta'' dina s-sentenza.\\n\\nFinalment wara li rat l-artikolu
  533 tal-Kapitolu 9 tal-Ligijiet ta'' Malta tikkundanna lil hati jhallas lir-Registratur
  tal-Qorti s-somma ta'' erba mija u tmienja u erbghin ewro u sebgha u tmenin centezmu
  (\u20ac448.87).\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
