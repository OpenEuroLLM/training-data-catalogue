  f''qieg\u0127-il ba\u0127ar fil-Bajja tal-G\u0127adira fis-26 ta'' Mejju 2019.\\n2.5.3.
  Kien hemm qbil li korrispondenza fuq din il-materja ti\u0121i mg\u0127oddija lill-Kunsillier
  J. Azzopardi.\\n\\n3.0. Twe\u0121ibiet g\u0127all-Mistoqsijiet tal-Kunsillieri\\n\\n3.1.1.
  Tiswijiet fi Triq G\u0127ajn \u017bejtuna\\n\\n(D/3/1/Vol V)\\n\\n3.1.2. Il-Kunsillier
  J. Azzopardi staqsa x''inhi r-ra\u0121uni g\u0127aliex Triq G\u0127ajn \u017bejtuna
  g\u0127adha ma ssewwietx fil-parti tal-S-Bend.\\n3.1.3. Is-Sindku wie\u0121eb li
  din ma saritx peress li l-kuntrattur kon\u010bernat huwa kommess fuq xog\u0127lijiet
  o\u0127ra fdati lilu minn Infrastructure Malta.\\n\\n3.1. Tqeg\u0127id ta'' Karti\\n\\n*
  Minuti \u2013 Laqg\u0127a ma'' E-Cubed Ltd dwar il-Parke\u0121\u0121 ta\u0127t l-estensjoni
