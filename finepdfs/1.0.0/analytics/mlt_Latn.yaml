  Huwa g\u0127aldaqstant talab sabiex titressaq talba mill-Kunsill mal-Uffi\u010b\u010bju
  Kon\u0121unt sabiex jirre\u0121istra l-art in kwistjoni mar-Re\u0121istru talArt.\\n\\n4.3.3.
  Il-Kunsill ma sabx o\u0121\u0121ezzjoni.\\n\\n4.4.1. In\u0121ombru fi Trejqet il-Kamp
  ta'' G\u0127ajn Tuffie\u0127a\\n\\n(T/3/2/Vol XV)\\n\\n4.4.1. Saret referenza g\u0127al
  ittra datata 10 ta'' Marzu 2019, fejn residenta lmentat li t-trejqa msemmija spiss
