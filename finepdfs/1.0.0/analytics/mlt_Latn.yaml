  Ix-xhud sostniet li hija kienet tara lill-imputat \u0121ewwa l-Kunsill ta'' Tas-Sliema
  pero qatt ma kienet qrib tieg\u0127u. Ix-xhud ikkonfermat li c-cheque kien iffirmat
  kemm minnha u anke mis-Sindku Nicholas Dimech.\\n\\n19. Stephania Friggieri xehdet
  li lejn l-a\u0127\u0127ar tas-sena 2009 u fis-sena 2010 hija kienet tokkupa il-kariga
  ta'' assistent prin\u010bipal u kienet account officer, pero bejn Jannar tas-sena
  2010 u Awwissu tas-sena 2010 hija kienet bil-maternity leave.\\n\\nIx-xhud sostniet
  li fi\u017c-\u017cmien li kienet il-Kunsill, il-pro\u010bedura meta kien ikun hemm
  b\u017conn li jsir xi xog\u0127ol kienet li normalment jitolbu kwotazzjoni u imbag\u0127ad
  tin\u0127are\u0121 purchase order bl-approvazzjoni tas-segretarju e\u017cekuttiv.
  Wara li jkun sar ix-xog\u0127ol tin\u0127are\u0121 linvoice, din l-invoice titpo\u0121\u0121a
  fis-schedule of payments, ti\u0121i approvata waqt il-laqg\u0127a tal-Kunsill Lokali
  u eventwalment isir il-pagament.\\n\\nIx-xhud sostniet li hija kienet tara lill-imputat
  \u0121ewwa il-Kunsill Lokali ta'' tas-Sliema pero ma tafx g\u0127alfejn kien imur.
  \u0120ieli kienet tarah ikellem lis-Sindku Nikki Dimech u \u0121ieli kien imur jag\u0127mel
