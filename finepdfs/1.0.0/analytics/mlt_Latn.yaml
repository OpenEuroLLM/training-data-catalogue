  milli tara l-bzonnijiet psikologici ta'' uliedha.\\n\\nIlli sussegwentement kien
  hemm qbil illi l-minuri HI ikollha terapija ghaliha, u l-istess AV, b''dana illi
  jkollhom ukoll terapija bhala familja, u cioe l-omm u t-tfal, filwaqt I l-attrici
