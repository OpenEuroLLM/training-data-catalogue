  "\"QORTI CIVILI PRIM'' AWLA\\n\\nONOR. IMHALLEF GIANNINO CARUANA DEMAJO\\n\\nSeduta
  ta'' l-1 ta'' Frar, 2005\\n\\nCitazzjoni Numru. 2145/1998/1\\n\\nStar Industries
  Limited\\n\\nVersus\\n\\nI.D.S. Limited\\n\\nF''din il-kaw\u017ca s-so\u010bjet\u00e0
  attri\u010bi qieg\u0127da titlob il-\u0127las ta'' elf, sitt mija u erbg\u0127a
  u sebg\u0127in lira u sittin \u010bente\u017cmu (Lm1,674.60), bilan\u010b tal-prezz
  ta'' merkanzija mibjug\u0127a lisso\u010bjet\u00e0 konvenuta.  Qieg\u0127da titlob
  ukoll l-ispejje\u017c talkaw\u017ca u dawk ta'' ittra interpellatorja, ta'' ittra
  uffi\u010bjali u ta'' mandat kawtelatorju.\\n\\nIs-so\u010bjet\u00e0 attri\u010bi
  kienet talbet ukoll illi l-kaw\u017ca tinqata'' biddispensa tas-smig\u0127, ta\u0127t
  il-pro\u010bedura sommarja spe\u010bjali, i\u017cda l-qorti b''dikriet tas-27 ta''
  Novembru 1998 ordnat illi lkaw\u017ca timxi bil-pro\u010bedura normali, u l-konvenuta
  ressqet le\u010b\u010bezzjoni ta'' \u0127las.\\n\\nB''dikriet tas-27 ta'' Novembru
  1998 ukoll, il-qorti \u0127atret perit sabiex je\u017camina l-kontijiet tal-partijiet
  u jirrelata dwarhom, i\u017cda, billi l-partijiet ma wrewx interess u l-kaw\u017ca
  g\u0127alhekk ma setg\u0127etx timxi, il-qorti \u0127assret il-\u0127atra talperit
  b''dikriet tat-18 t''Ottubru 2001.  Fid-29 ta'' Jannar 2002 il-partijiet flimkien
  talbu illi jer\u0121a'' jin\u0127atar il-perit, u lqorti b''dikriet mog\u0127ti
  dakinhar laqg\u0127et it-talba u re\u0121g\u0127et \u0127atret lill-perit, illi
  eventwalment \u0127alef ir-rapport fl-4 ta'' Lulju 2003.\\n\\nMix-xhieda li n\u0121abret
  quddiem il-perit \u0127are\u0121 illi l-kwistjoni bejn il-partijiet hija dwar jekk
  sarx \u0127las g\u0127al tliet konsenji li g\u0127alihom is-so\u010bjet\u00e0 attri\u010bi
  qieg\u0127da tippretendi \u0127las ta'' elf, \u0127ames mija u wie\u0127ed u sittin
  lira u sitta u disg\u0127in \u010bente\u017cmu (Lm1,561.96).   Il-perit sab illi
  fuq id-delivery notes relativi g\u0127al dawn il-konsenji tidher il-firma ta'' min
  kien jir\u010bievi l-konsenji g\u0127all-konvenuta, u illi l-fatturi jaqblu mad-delivery
  notes \u0127lief g\u0127al item wie\u0127ed fejn hemm diskrepanza fil-prezz.  Biex
  tag\u0127mel tajjeb g\u0127al din iddiskrepanza l-attri\u010bi naqqset il-pretensjoni
  tag\u0127ha minn elf, sitt mija u erbg\u0127a u sebg\u0127in lira u sittin \u010bente\u017cmu
  (Lm1,674.60), mitluba fi\u010b-\u010bitazzjoni, g\u0127al elf, \u0127ames mija u
  wie\u0127ed u sittin lira u sitta u disg\u0127in \u010bente\u017cmu (Lm1,561.96).\\n\\nIl-qorti
  taqbel mal-perit illi l-provi juru illi tassew saru dawn il-konsenji.  Il-konvenuta,
  li fuqha issa jaqa'' l-oneru talprova tal-\u0127las, ma g\u0127amlitx dik il-prova.\\n\\nB''nota
  tal-10 ta'' Lulju 2003 il-konvenuta talbet il-\u0127atra ta'' periti addizzjonali,
  i\u017cda fis-seduta tal-21 t''Ottubru 2003 talbet illi, minflok, tag\u0127mel eskussjoni.  Il-perit
  wie\u0121eb g\u0127all-mistoqsija li l-qorti \u0127alliet illi ssirlu b''nota tal-20
  t''April 2004.  Billi l-qorti hija tal-fehma illi l-konklu\u017cjonijiet tal-perit
  huma tajba, u msa\u0127\u0127a bil-provi, ma jidhrilhiex li hemm \u0127tie\u0121a
  g\u0127all-\u0127atra ta'' periti addizzjonali u g\u0127alhekk ti\u010b\u0127ad
  it-talba mag\u0127mula bin-nota tal-10 ta'' Lulju 2003.\\n\\nG\u0127al dawn ir-ra\u0121unijiet
  il-qorti taqta'' l-kaw\u017ca billi, wara li ti\u010b\u0127ad l-e\u010b\u010bezzjoni
  ta'' \u0127las, tikkundanna lis-so\u010bjet\u00e0 konvenuta t\u0127allas lis-so\u010bjet\u00e0
  attri\u010bi elf, \u0127ames mija u wie\u0127ed u sittin lira u sitta u disg\u0127in
  \u010bente\u017cmu (Lm1,561.96), flimkien ma'' l-img\u0127axijiet fuqha u l-ispejje\u017c
  kollha mitluba fi\u010b-\u010bitazzjoni.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"Il-Qorti,\\n\\nQORTI TAL-MAGISTRATI (GHAWDEX) (GURISDIZZJONI SUPERJURI) (SEZZJONI
  GENERALI) MAGISTRAT DR. PAUL COPPINI\\n\\nSeduta tal-25 ta'' Gunju, 2014\\n\\nCitazzjoni
  Numru. 23/2014/1\\n\\nEmanuel Scerri vs\\n\\nDirettur tar-Re\u0121istru Pubbliku
  (G\u0127awdex)\\n\\nRat ir-Rikors \u0120uramentat ta'' Emanuel Scerri li permezz
  tieg\u0127u, wara li ppremetta:\\n\\n1. Illi fi\u010b-\u010bertifikat tat-twelid
  tar-rikorrenti, li j\u0121ib in-numru tlieta u sittin tas-sena elf disa'' mija u
  sebg\u0127a u tmenin (63/1987), ta\u0127t il-kolonna ''Tag\u0127rif dwar Missier
  it-tarbija \u2013 Isem u kunjom'', kunjom missier irrikorrenti \u0121ie erronjament
  imni\u017c\u017cel b\u0127ala ''Scerri'' minflok ''Xerri'' u dan hekk kif jidher
  mill-kopja ta\u010b-\u010aertifikat tat-Twelid hawn annessa u mmarkata b\u0127ala
  Dok. ''A'';\\n2. Illi fl-istess \u010bertifikat tat-twelid tar-rikorrenti, ta\u0127t
  il-kolonna ''Tag\u0127rif dwar l-Omm \u2013 Isem u kunjom'', kunjom \u017cew\u0121
  l-omm \u0121ie erronjament imni\u017c\u017cel b\u0127ala ''Scerri'' minflok ''Xerri''
  u b''hekk jaqra \u017cbaljatament ''Theresa wife of the said Emanuel Scerri'' minflok
  ''Theresa wife of the said Emanuel Xerri'', u dan kif jidher mill-istess kopja ta\u010b-\u010aertifikat
  tatTwelid hawn annessa u mmarkata b\u0127ala Dok. ''A'';\\n3. Illi wkoll fl-istess
  \u010bertifikat tat-twelid tar-rikorrenti, ta\u0127t il-kolonna ''Tag\u0127rif dwar
  Missier it-Tarbija \u2013 Isem u kunjom il-missier, u jekk hux \u0127aj jew mejjet'',
  kunjom missier il-missier tar-rikorrenti \u0121ie erronjament indikat b\u0127ala
  ''Scerri'' minflok ''Xerri'', u dan hekk kif jidher mill-istess kopja ta\u010b-\u010aertifikat
  tat-Twelid hawn annessa u mmarkata b\u0127ala Dok. ''A'';\\n4. Illi kunjom ir-rikorrenti
  kif ukoll tal-familja kollha tieg\u0127u dejjem kien ''Xerri'' miktub bl-ittra ''X''
  u mhux ''Scerri'' bl-ittri ''Sc'' kif imni\u017c\u017cel \u017cbaljatament;\\n5.
  Illi infatti kunjom il-missier fi\u010b-\u010bertifikat tat-twelid relattiv li j\u0121ib
  innumru tliet mija u erbatax tas-sena elf disa'' mija u tmienja u tletin (314/1938),
  hawn anness b\u0127ala Dok. ''B'', il-kunjom Xerri huwa dejjem indikat bl-ittra
  ''X'' u g\u0127aldaqstant in-nannu tar-rikorrenti huwa debitament imni\u017c\u017cel
  b\u0127ala ''Francis Xerri'', filwaqt illi n-nanna tarrikorrenti hija mni\u017c\u017cla
  b\u0127ala ''Josephine Xerri'' nee Falson wife of the sadi Francis Xerri'';\\n6.
  Illi barra minn hekk fi\u010b-\u010bertifikat tat-twelid relattivi tal-a\u0127wa
  tarrikorrenti Raymond Xerri, Joseph Xerri u Darren Xerri li j\u0121ibu n-numri mitejn
  u \u0127dax tas-sena elf disa'' mija u sebg\u0127a u sittin (211/197), mija u wie\u0127ed
  u tmenin tas-sena elf disa'' mija u iwe\u0127ed u sebg\u0127in (181/1971), u tliet
  mija u tlieta u tletin tas-sena elf disa'' mija u tlieta u tmenin (333/1983) rispettivament,
  isem u kunjom il-missier ta\u0127t il-kolonna Isen u Kunjom u post tat-Twelid tal-Missier
  jinsab indikat fl-istanzi kollha\\n\\nb\u0127ala Emanuel Xerri filwaqt li isen u
  kunjom l-Omm ta\u0127t il-kolonna ''Isem u Kunjom u post tat-Twelid ta'' l-Omm''
  fl-istanzi kollha huwa mni\u017c\u017cel b\u0127ala ''Theresa Xerri nee Cauci wife
  of the said Emanuel Xerri'' u dan kif jidher minn kopja ta\u010b-\u010bertifikati
  tat-twelid relattivi hawn annessi u mmarkati b\u0127ala Dok ''\u010a'', Dok. ''D'',
  u Dok ''E'' rispettivament;\\n\\n7. Illi infatti wkoll fil-parti ''Firma tal-persuna
  li tag\u0127mel id-dikjarazzjoni'', kunjom omm ir-rikorrenti huwa korrettement indikat
  b\u0127ala ''Xerri'' u dan peress illi att ori\u0121inali ta'' l-istess Att tat-Twelid
  sureferit, omm irrikorrenti ffirmat b\u0127ala ''Teresa Xerri'';\\n8. Illi dan l-i\u017cball
  mhux attribbwibbli g\u0127ar-rikorrenti u dan stante li kif indikat \u010bar il-kumplament
  ta'' l-istanzi l-o\u0127ra ta'' missier u \u0127ut irrikorrenti, il-kunjom \u0121ie
  indikat korrettement b\u0127ala ''Xerri'' u mhux ''Scerri'';\\n9. Illi r-rikorrenti
  permezz t'' l-istanti rikors \u0121uramentat irid li ssir id-debita korrezzjoni
  fi\u010b-\u010bertifikat uffi\u010b\u010bjali tat-twelid hawn fuq imsemmi u dan
  sabiex jirrifletti e\u017cattament l-istat ta'' fatt kif spjegat\\n\\nTalbet lill-konvenuti
  jg\u0127idu g\u0127aliex m''g\u0127andhiex din il-Qorti:\\n\\n1. Tordna l-korrezzjoni
  tal-att tat-twelid bin-numr tlieta u sittin tas-sena elf disa'' mija u sebg\u0127a
  u tmenin (63/1987) u dan fis-sens illi ssir id-debita korrezzjoni fil-kolonna ta\u0127t
  l-intestatura ''Tag\u0127rif dwar Missier it-tarbija \u2013 Isem u Kunjom'' sabiex
  kunjom il-missier indikat b\u0127ala ''Scerri'' ji\u0121i sostitwit u kkore\u0121ut
  b\u0127ala ''Xerri'';\\n2. Tordna l-korrezzjoni tal-att tat-twelid bin-numru tlieta
  u sittin tas-sena elf disa'' mija u sebg\u0127a u tmenin (63/1987) u dan fis-sens
  illi ssir id-debita korrezzjoni fil-kolonna ta\u0127t l-intestatura ''Tag\u0127rif
  dwar l-Omm \u2013 Isem u kunjom'' sabiex kunjom l-omm indikat b\u0127ala ''Scerri''
  ji\u0121i sostitwit u kkore\u0121ut b\u0127ala ''Xerri'';\\n3. Tordna l-korrezzjoni
  tal-att tat-twelid bin-numru tlieta u sittin tas-sena elf disa'' mija u sebg\u0127a
  u tmenin (63/1987) u dan fis-sens illi ssir id-debita korrezzjoni fil-kolonna ta\u0127t
  l-intestatura ''Tag\u0127rif dwar Missier it-Tarbija Isem u kunjom il-Missier, u
  jekk hux \u0127aj jew mejjet'' sabiex kunjom\\n\\nmissier missier ir-rikorrenti
  ndikat b\u0127ala ''Scerri'' ji\u0121i sostitwit u kkore\u0121ut b\u0127ala ''Xerri'';\\n\\nBl-ispejje\u017c
  u bl-in\u0121unzjoni tal-intimat nomine g\u0127as-subizzjoni li g\u0127aliha huwa
  minn issa qieg\u0127ed ji\u0121i n\u0121unt.\\n\\nRat ir-risposta \u0121uramentata
  tad-Direttur tal-Re\u0121istru Pubbliku li permezz tag\u0127ha e\u010b\u010bepixxa:\\n\\n1.
  Illi in linea preliminari jing\u0127ad illi huwa me\u0127tie\u0121 li tal-inqas
  \u0127mistax-il \u0121urnata qabel is-smig\u0127 tal-kaw\u017ca ssir id-debita pubblikazzjoni
  filGazzetta tal-Gvern ai termini tal-Artikolu 254 tal-Kap. 16 tal-Li\u0121ijiet
  ta'' Malta;\\n2. Illi l-esponenti ma jsibx o\u0121\u0121ezzjoni g\u0127al korrezzjoni
  tal-att tat-twelid binnumru 63/1987 fis-sens illi fil-kolonna Isem u kunjom Missier
  it-Tarbija il kunjom Sceri ji\u0121i mibdul g\u0127al \\\"Xerri\\\". L-istess jing\u0127ad
  g\u0127all-istess kolonna fir-rigward tat-Tag\u0127rif dwar l-Omm, il-kunjom Scerri
  g\u0127andu ji\u0121i mibdul g\u0127al \\\"Xerri\\\". Dan peress illi jirri\u017culta
  anke mid-dokumenti annessi mar-rikors \u0121uramentat illi kunjom missier ir-rikorrenti
  huwa \\\"Xerri\\\" u mhux Scerri. Peress illi l-wild jie\u0127u kunjom missieru,
  hemm lok illi ji\u0121i korret l-att tat-twelid tar-rikorrenti;\\n3. Illi ming\u0127ajr
  pre\u0121udizzju g\u0127as-suepost, id-Direttur Re\u0121istru Pubbliku m''g\u0127andux
  ji\u0121i allokat bl-ispejje\u017c tal-pro\u010beduri istanti, u dan peress illi
  rre\u0121istrazzjoni saret a ba\u017ci tad-dikjarazzjonijiet mag\u0127mula minn
  omm irrikorrenti illi meta marret tirre\u0121istra t-tarbija ndikat il-kunjom b\u0127ala
  Scerri flok Xerri, u fit-tieni lok, peress illi d-Direttur Pubbliku ma hux ilpersuna
  responsabbli illi tikteb l-att, i\u017cda hu responsabbli biss g\u0127arre\u0121istrazzjoni
  tal-istess att;\\n4. Salv e\u010b\u010bezzjonijiet ulterjuri.\\n\\nBl-ispejje\u017c
  kontra r-rikorrenti li qeg\u0127din ji\u0121u n\u0121unti in subizzjoni.\\n\\nSemg\u0127et
  it-trattazzjoni tad-difensuri rispettivi.\\n\\nIl-Qorti,\\n\\nBilli jirri\u017culta
  li t-talbiet attri\u010bi huma \u0121ustifikati.\\n\\nTidde\u010bidi l-kaw\u017ca
  billi tilqa'' l-istess talbiet u tordna:\\n\\n1. L-korrezzjoni tal-att tat-twelid
  bin-numr tlieta u sittin tas-sena elf disa'' mija u sebg\u0127a u tmenin (63/1987)
  u dan fis-sens illi ssir id-debita korrezzjoni fil-kolonna ta\u0127t l-intestatura
  ''Tag\u0127rif dwar Missier it-tarbija \u2013 Isem u Kunjom'' sabiex kunjom il-missier
  indikat b\u0127ala ''Scerri'' ji\u0121i sostitwit u kkore\u0121ut b\u0127ala ''Xerri'';\\n\\n2.
  L-korrezzjoni tal-att tat-twelid bin-numru tlieta u sittin tas-sena elf disa'' mija
  u sebg\u0127a u tmenin (63/1987) u dan fis-sens illi ssir id-debita korrezzjoni
  fil-kolonna ta\u0127t l-intestatura ''Tag\u0127rif dwar l-Omm \u2013 Isem u kunjom''
  sabiex kunjom l-omm indikat b\u0127ala ''Scerri'' ji\u0121i sostitwit u kkore\u0121ut
  b\u0127ala ''Xerri'';\\n\\n3. L-korrezzjoni tal-att tat-twelid bin-numru tlieta
  u sittin tas-sena elf disa'' mija u sebg\u0127a u tmenin (63/1987) u dan fis-sens
  illi ssir id-debita korrezzjoni fil-kolonna ta\u0127t l-intestatura ''Tag\u0127rif
  dwar Missier it-Tarbija Isem u kunjom il-Missier, u jekk hux \u0127aj jew mejjet''
  sabiex kunjom missier missier ir-rikorrenti ndikat b\u0127ala ''Scerri'' ji\u0121i
  sostitwit u kkore\u0121ut b\u0127ala ''Xerri'';\\n\\nMin\u0127abba n-natura tal-kaw\u017ca,
  kull parti g\u0127andha t\u0127allas l-ispejje\u017c tag\u0127ha.\\n\\n< Sentenza
  Finali >\\n\\nKopja Informali ta'' Sentenza\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"Kopja Informali ta'' Sentenza\\n\\nQORTI TA'' L-APPELL KRIMINALI\\n\\nONOR. IMHALLEF
  DAVID SCICLUNA\\n\\nSeduta tas-27 ta'' Ottubru, 2010\\n\\nAppell Kriminali Numru.
  155/2010\\n\\nIl-Pulizija v.\\n\\nRobert Camilleri\\n\\nIl-Qorti,\\n\\nRat l-imputazzjonijiet
  migjuba mill-Pulizija Esekuttiva kontra l-imsemmi Robert Camilleri talli fit-18
  ta'' April 2009 ghall-habta tat-3.00 a.m. gewwa l-Pjazza tas-Saqqajja, Rabat, saq
  vettura numru KBL-512:\\n\\n(1) b''nuqqas ta'' hsieb, bi traskuragni jew b''nuqqas
  ta'' hila fl-arti jew professjoni jew b''nuqqas ta'' tharis tarregolamenti tat-traffiku
  u habat ma'' vettura numru TAZ210 u nvolontarjament kkagunalha hsarat ghad-dannu
  ta'' Emanuel Xuereb;\\n\\n(2) b''nuqqas ta'' hsieb, bi traskuragni jew b''nuqqas
  ta'' hila fl-arti jew professjoni jew b''nuqqas ta'' tharis tarregolamenti tat-traffiku
  nvolontarjament kkaguna feriti ta'' natura gravi fuq il-persuna ta'' Emanuel Xuereb
  hekk kif ccertifika Dr. Borg MD mill-MDH.\\n\\nIl-prosekuzjoni talbet lill-Qorti
  li l-imsemmi Emanuel Xuereb tigi skwalifikata milli tiehu jew ikollha ebda licenzja
  tas-sewqan ghall-perijodu ta'' zmien li l-Qorti jidhrilha xieraq;\\n\\nRat is-sentenza
  tal-Qorti tal-Magistrati (Malta) bhala Qorti ta'' Gudikatura Kriminali tal-25 ta''
  Marzu 2010 li permezz taghha dik il-Qorti, wara li rat l- artikoli 226 u 328 tal-Kap.
  9 tal-Ligijiet ta'' Malta, sabet lill-imsemmi Robert Camilleri hati ta'' l-imputazzjonijiet
  migjuba kontra tieghu, ikkundannatu multa ta'' elf euro (\u20ac1000) u ssospendietu
  minn kull licenzja tas-sewqan ghal perijodu ta'' tliet xhur;\\n\\nRat ir-rikors
  ta'' appell ta'' Robert Camilleri pprezentat fis-7 ta'' April 2010 li permezz tieghu
  talab li din il-Qorti tirrevoka s-sentenza appellata u tilliberah minn kull piena
  u htija skond il-ligi, u f''kaz li l-Qorti tikkonferma s-sentenza appellata, timponi
  piena aktar ekwa u gusta ghall-kaz odjern;\\n\\nRat l-atti kollha tal-kawza;\\n\\nSemghet
  ix-xhieda;\\n\\nSemghet it-trattazzjoni tad-difensuri tal-partijiet;\\n\\nIkkunsidrat:\\n\\nL-aggravji
  ta'' l-appellant huma fil-qosor is-segwenti: (1) li l-ewwel Qorti ghamlet apprezzament
  hazin tal-provi; (2) li l-prosekuzzjoni ma rnexxilxhiex tissodisfa l-vot tal-ligi
  f''dak li jirrigwarda l-prova tal-htija; (3) li l-ewwel Qorti messha waslet ghal
  decizjoni inversa minn dik li waslet ghaliha; (4) li, minghajr pregudizzju ghall-aggravji
  precedenti, il-piena nflitta kienet wahda eccessiva.\\n\\nL-ewwel tliet aggravji
  jirrikjedu apprezzament mill-gdid talprovi. Din il-Qorti fil-fatt semghet mill-gdid
  lil Emanuel Xuereb, il-parti leza, u lill-appellant. Dak li xehdu jista'' jingabar
  fil-qosor hekk:\\n\\nEmanuel Xuereb xehed illi tela'' s-Saqqajja ghat-tfal u waqaf
  \\\"fejn il-Bank of Valletta\\\" u \\\"f''daqqa wahda daqqa minn wara nkredibbli
  li ntlift minn sensija.\\\" Huwa qal li filmument ta'' l-impatt kien ipparkjat,
  kellu s-seatbelt, id-dawl mixghul u wieqaf fejn il-Bank of Valletta, u minghalih
  kienet ghadha startjata. Qal li kien mal-bankina. Biddaqqa spicca n-naha l-ohra
  tat-triq u l-karroza tieghu kienet total loss. Bejn il-mument li waqaf u d-daqqa
  ghaddew biss minuta jew minuta u nofs. In kontro-ezami rega'' qal li huwa waqaf
  mal-bankina. Karozzi ma kienx hemm la quddiemu u lanqas warajh. Meta waqaf baqa''
  bid-dawl mixghul u bis-seatbelt ghax kienet tigieh aghar. Ma jiftakarx tellax il-handbrake
  izda jassumi li tellghu. Mistoqsi jekk id-dinamika ta'' l-incident kinitx differenti,
  u cioe` li meta waslet it-tifla u minflok kienet se taqsam hi, qala'' hu minn fejn
  kien ipparkjat, wiegeb li \\\"mhu veru xejn, wieqaf kont\\\". Mistoqsi kif bid-daqqa
  mexa lejn in-naha lohra tal-pjazza u mhux ''il quddiem, wiegeb li hu ntilef minn
  sensieh bid-daqqa u rega'' cahad li qala'' minn fejn kien wieqaf. Lit-tifla ma kienx
  raha qabel id-daqqa.\\n\\nL-appellant xehed illi kien spicca mix-xoghol f''xis-1.30
  a.m. u kien tiela'' d-dar. Meta dar mar-roundabout ghasSaqqajja, it-triq kienet
  vojta u f''daqqa wahda minn fejn ilBOV qasmet karozza lejn il-venda tal-linja u
  hu laqatha fuq wara fuq ix-xellug. Il-karozza kienet mal-bankina biddawl mitfi u
  indicator xejn. Huwa qal li jaqbel ma'' l-iskizz li gie esebit quddiem din il-Qorti.
  Huwa laqat dik il-karozza bin-naha tal-lemin ta'' quddiem fuq in-naha tax-xellug
  ta'' wara u spiccat n-naha l-ohra tal-pjazza. L-appellant qal li kif laqat il-karozza
  l-ohra huwa waqaf fuq il-post. Mar jigri u fetah il-bieba tal-karozza li kuien laqat.
  Ix-xufier kien bla seatbelt, kellu d-demm ma'' wiccu, mar jigri ghall-vettura tieghu
  biex igib xi tissues, tahomlu, dak il-hin tkellem u beda jimsah wiccu bihom. Dak
  il-hin giet it-tifla tieghu. Lappellant qal li huwa waqaf fil-lane tieghu u mhux
  fil-lane tal-parking. In kontro-ezami l-appellant qal li kien qieghed\\n\\nisuq
  b''xi 40 jew 45 k.f.s. Mistoqsi kif allura l-karozza ta'' Emanuel Xuereb spiccat
  in-naha l-ohra wiegeb \\\"Ghax qasmitli minn quddiemi.\\\" Qal li d-daqqa hi fuq
  wara ghax lkarozza qasmet \\\"tipo U-turn\\\". Kien wieqaf mal-bankina u qasam dak
  il-hin. Qal li nduna bil-karozza l-ohra ezatt kif qasam u ma kienx hemm cans jibbrejkja.
  \\\"Jigifieri qieghed insuq u f''daqqa wahda qabad u qasam minn quddiemi.\\\"\\n\\nIl-prosekuzzjoni
  pprezentat ukoll quddiem l-ewwel Qorti affidavit ta'' W.P.S. J. Giordmaina li marret
  fuq il-post ta'' lincident, osservat il-pozizzjoni li spiccaw fiha l-vetturi u ddeskriviet
  id-danni li sofrew il-vetturi. Hija tat il-verzjonijiet li tawha x-xufiera: \\\"Emanuel
  Xuereb, xufier ta'' vettura TAZ-210 stqarr ''jien tlajt ghat-tifla s-Saqqajja, tfajt
  fil-genb, u fid-daqqa u l-hin hassejt id-daqqa u ma nafx x''gara ghax hadt daqqa
  ma'' l-isteering''. Adam Zahra sid vettura ABG498 stqarr ''il-vettura kienet ipparkjata'';
  filwaqt li Robert Camilleri xufier ta'' vettura KBL-512 stqarr ''kont qed insuq
  normali u f''daqqa wahda rajt karozza pparkjata fin-nofs tat-triq u kif rajtha ghafast
  il-brake. Jien ghalija l-vettura ma kellhiex dawl u lanqas kien fil-lane''.\\\"\\n\\nJigi
  mill-ewwel osservat illi meta l-appellant xehed quddiem din il-Qorti, u probabbilment
  anke meta xehed quddiem l-ewwel Qorti, huwa qal illi l-incident sehh ghax il-karozza
  qabdet u qasmet lejn il-venda, filwaqt illi minn dan ma jidher li qal xejn lill-Pulizija
  u kull ma qal li kien hemm karozza pparkjata fin-nofs tat-triq. Mill-banda lohra,
  mill-pozizzjoni tal-hsara principali fuq il-vetturi \u2013 innaha tal-lemin ta''
  quddiem tal-vettura ta'' l-appellant u nnaha ta'' wara tax-xellug tal-karozza ta''
  Emanuel Xuereb \u2013 il-karozza ta'' Xuereb ma setghetx kienet fil-parking lane,
  cioe` mal-bankina. In effetti din il-Qorti osservat illi Emanuel Xuereb kien daqsxejn
  titubanti fuq il-pedana taxxhieda meta gie mistoqsi dwar il-pozizzjoni tieghu filmument
  tal-habta, u specifikatament jekk kienx malbankina. Jigifieri din il-Qorti tara
  li kien hemm nuqqas da parti ta'' Emanuel Xuereb minhabba li ma waqafx malbankina.
  Naturalment dan xorta ma jezonerax lill-appellant mir-responsabbilta'' tieghu ghall-incident
  peress li, kif gie ritenut mill-Qrati taghna, in-negligenza kontributorja ma\\n\\ntezonerax
  lis-sewwieq jekk ma tkunx il-kawza unika tassinistru 1 .\\n\\nIn effetti tara li
  primarjament l-incident gara minhabba dizattenzjoni ta'' l-appellant li ma rax what
  was in plain view. Barra minn hekk il-hsara li garrbet il-karozza ta'' Xuereb fuq
  wara tindika li qalghet \\\"daqqa soda\\\" u dalfattur huwa indikattiv ta'' certa
  velocita`. Il-fatt li l-karozza ta'' Xuereb giet imbuttata ''l quddiem izda n-naha
  l-ohra tattriq u n-natura tad-daqqa fuq wara ta'' dik il-karozza \u2013 spostament
  lejn ix-xellug \u2013 jistghu jindikaw li fil-hin taddaqqa dik il-karozza kienet
  xi ftit angolata, izda huwa fattur ukoll li jindika certa velocita`.\\n\\nFl-Appell
  Kriminali Il-Pulizija v. Roger Bugeja fit-30 ta'' Gunju 1962 (Vol. XLVI.iv.873)
  intqal hekk:\\n\\n\\\"Speed eccessiv wahdu mhux tabilfors hu speed perikoluz, imma
  jista'' jkun tali f''determinati cirkustanzi (App. Krim. ''Pul. vs. Sapiano'', 23
  ta'' Jannar 1960; ''Pul. vs. Galea'', 5 ta'' Novembru 1960); u f''dawk ic-cirkustanzi
  speed jista'' jkun eccessiv anki jekk ma jiskorrix il-limiti regolamentari, ghax
  il-limiti allura jkun impost mill-prudenza, dettata mill-fatturi ambjentali tal-mument
  (ara wkoll Crim. Law Review, Dec. 1961, pp. 835-836).\\\" 1\\n\\nGhaldaqstant l-ewwel
  tliet aggravji huma michuda.\\n\\nKwantu ghall-aggravju dwar il-piena, l-appellant
  instab hati ghall-ksur ta'' l-artikoli 226 u 328 tal-Kap. 9 tal-Ligijiet ta'' Malta.
  Skond l-artikolu 226(1)(b) il-piena hi dik ta'' prigunerija ghal zmien mhux izjed
  minn sitt xhur jew multa ta'' mhux izjed minn elfejn tliet mija disgha u ghoxrin
  euro u sebgha u tletin centezmu (\u20ac2,329.37). Il-piena skond lartikolu 328(d)
  hi ta'' prigunerija ghal mhux izjed minn tliet xhur jew il-multa jew il-pieni tal-kontravvenzjonijiet.
  Anke bl-applikazzjoni ta'' l-artikolu 17(b) tal-Kap. 9 il-piena nflitta\\n\\n1 Ara
  wkoll Appelli Kriminali: Il-Pulizija v. Neville John Psaila, 20 ta'' Marzu 2003;
  IlPulizija v. Francis W. P. G. Zarb Adami, 7 ta'' Frar 2003; Il-Pulizija v. Stephen
  Zammit, 10 ta'' Lulju 2002; Il-Pulizija v. Kenneth Borg, 18 ta'' April 2002; Il-Pulizija
  v. Anthony Chircop, 11 ta'' April 2002; Il-Pulizija v. Robert Pace, 11 ta'' Gunju
  2001.\\n\\nKopja Informali ta'' Sentenza\\n\\nmill-ewwel Qorti hi fil-parametri
  tal-ligi. L-istess jista'' jinghad ghall-iskwalifika minn kull licenzja tas-sewqan,
  u dan a tenur ta'' l-artikolu 30(b) tal-Kap. 9. Irid jinghad illi lewwel Qorti waslet
  ghall-piena wara li hadet in konsiderazzjoni negligenza kontributorja da parti ta''
  Emanuel Xuereb.\\n\\nGhal dawn il-motivi:\\n\\nTiddeciedi billi tichad l-appell
  u tikkonferma s-sentenza appellata. Il-perijodu ta'' skwalifika jibda minn nofs-il
  lejl tallum.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"A\\n\\nMINUTI\\n\\nKUNSILL LOKALI TAL-MELLIE\u0126A\\n\\nIS-SEBA'' KUNSILL\\n\\nSEDUTA
  NRU. 108\\n\\n20 ta'' Marzu 2019\\n\\nMinuti tas-seduta Nru. 108 tal-Kunsill Lokali
  tal-Mellie\u0127a li saret fl-Uffi\u010b\u010bju Amministrattiv talKunsill, f''Numru
  126, Triq il-Mit\u0127na l-\u0120dida, Mellie\u0127a, nhar l-Erbg\u0127a, 20 ta''
  Marzu 2019 fis-6.00 pm.\\n\\nAttendenza u qari ta'' ittri ta'' apolo\u0121iji\\n\\nIl-Kunsillieri
  kollha kienu pre\u017centi.\\n\\nIs-Segretarju E\u017cekuttiv C. Debono rre\u0121istra
  l-minuti, filwaqt li s-seduta \u0121iet tra\u017cmessa direttament bl-internet.\\n\\nTalba\\n\\nIt-talba
  ntqalet mis-Sindku J. Buttigieg.\\n\\n1.1. Minuti\\n\\n1.2. Il-Kunsillieri J. Attard
  u A. Brincat Stellini rreferew g\u0127all-minuta 5.5.3. (Ref: L/3/Vol III) u talbu
  li din tinqara kif \u0121ej:\\n\\\"5.5.3. Il-Kunsillier J. Attard u E. Bartolo qalu
  li huma ma jaqblux illi l-u \u017c u tal-latrini jkun bil\u0127 las g \u0127 all-anzjani
  fil-ka \u017c ta'' Misra \u0127 i \u017c \u017b jara tal-Papa \u0120 wanni Pawlu
  II, filwaqt li l-Kunsilliera A. Brincat Stellini kkummentat li g \u0127 andhom ikunu
  b''xejn ukoll meta jkun hemm attivitajiet popolari organizzati mill-Kunsill.\\\".\\n1.3.
  Il-minuti tas-seduta Nru. 107 tat-22 ta'' Frar 2019, \u0121ew approvati u ffirmati
  bl-emenda t''hawn fuq. Kien hemm qbil li dawn g\u0127andhom ji\u0121u ppubblikati
  fis-sit elettroniku https://localgovernmentcms.gov.mt/en/lc/Mellieha/Pages/Publications/Minutes.aspx\\n\\n________________________________________________________________________________________________________________________________________\\n\\n2.0.
  Materji Mqajma mill-Minuti\\n\\n2.1.1. PA 5909/17 \u2013 \u017bvilupp ta'' sit konfinanti
  minn Triq \u0126alq i\u010b-\u010aawl, Triq l-I\u017cbark tal-Fran\u010bi\u017ci,
  Triq in-Nases, u Triq il-Fortizza (P/5/8/Z)\\n\\n2.1.2. Is-Sindku a\u010b\u010benna
  g\u0127all-applikazzjoni msemmija hawn fuq u qal li fit-28 ta'' Frar 2019 din \u0121iet
  trattata fil-pubbliku u approvata b''vot ta'' disg\u0127a favur u erba'' kontra.
  Wa\u0127da mill-membri ma kinitx pre\u017centi. Is-Sur J. Buttigieg qal li l-vot
  tieg\u0127u kien kontra, skont il-fehma espressa millKunsill fis-seduta pre\u010bedenti.
  Kompla jg\u0127id li din id-de\u010bi\u017cjoni ttie\u0127det minkejja li l-policy
  talPjan Lokali NWUS3 tippermetti \\\".... new hotel beds as extensions to existing
  operating hotels...\\\" , filwaqt li l-Policy FL-GNRL\u20131 fil-Partial Review
  of Subsidiary Plans approvat f''Jannar 2013 tikklassifika l-Mellie\u0127a b\u0127ala
  \u017cona turistika u allura l-inklu\u017cjoni ta'' lukanda fli\u017cvilupp propost
  tqies b\u0127ala a\u010b\u010bettabbli. Is-Sindku qal ukoll li l-Partial Review
  jg\u0127id ukoll illi \\\"...proposed development would not create an environment
  which goes diametrically against the thrust of the local plan policy.\\\". F''dawn
  i\u010b-\u010birkostanzi huwa jara li hemm lok ta'' kontestazzjoni fil-mod li \u0121ew
  interpretati l-policies li msemmija.\\n2.1.3. Il-Kunsill innota t-tag\u0127rif mog\u0127ti
  u kien tal-fehma li g\u0127andu jkompli jiddiskuti\u0127 fid-dawl talkonsultazzjonijiet
  li je\u0127tie\u0121 isiru u l-iskadenzi li japplikaw.\\n\\n2.2.1. Pro\u0121ett
  pilota dwar l-latrini pubbli\u010bi (\\n\\nL/3/Vol III)\\n\\n2.2.1. Is-Sindku rrefera
  g\u0127all-minuti 5.5.3. u 5.5.4. tas-seduta ta'' qabel u g\u0127arraf li huwa tkellem
  mal-uffi\u010bjal fil-Foundation for Tourism Zone Management li qed jikkordina l-pro\u0121ett
  u g\u0127arrfu bix-xewqa tal-Kunsill li l-latrina pubblika f''Misra\u0127 i\u017c-\u017bjara
  tal-Papa \u0120wanni Pawlu II tkun ming\u0127ajr \u0127las g\u0127all-anzjani, kif
  ukoll waqt attivitajiet popolari li ji\u0121u organizzati fil-madwar.\\n2.2.2. Il-Kunsill
  innota l-azzjoni li ttie\u0127det.\\n\\n2.3.1. Servizz ta'' Trasport g\u0127all-Anzjani
  li jattendu \u010b-\u010aentru ta'' Matul il-Jum (A/1/2/Vol VII)\\n\\n2.3.2. Il-Kunsillier
  J. Attard irrefera g\u0127all-minuta 1.2. tas-seduta pre\u010bedenti u g\u0127arraf
  li huwa tkellem mal-kuntrattur li jipprovidi s-servizz imsemmi sabiex jara jekk
  huwiex possibbli li jipprovdi minibus bil-bieba li tinfeta\u0127 mix-xufier. Irri\u017culta
  li attwalment dan m''g\u0127andux, i\u017cda qed filpro\u010bess li jixtri \u017cew\u0121
  vetturi mg\u0127ammra b''bieba li tista'' ti\u0121i attivata mix-xufier.\\n2.3.3.
  Il-Kunsill innota t-tag\u0127rif mog\u0127ti.\\n\\n2.4.1. Xifer perikolu\u017c f''Tal-Prajjet
  (T/3/2/Vol XV)\\n\\n2.4.2. Il-Kunsillier J. Attard irrefera g\u0127all-minuta 1.3.
  tas-seduta ta'' qabel staqsa dwar jekk twa\u0127\u0127lux it-tabelli ta'' twissija
  qrib ix-xifer.\\n2.4.3. Is-Segretarju wie\u0121eb li m''g\u0127andux informazzjoni
  li dawn twa\u0127\u0127lu.\\n2.4.4. Is-Sindku qal li l-Bord tal-Park tal-Majjistral
  ser jie\u0127u \u0127sieb iwa\u0127\u0127alhom, peress li l-post jinsab fil-konfini
  tal-Park.\\n\\n2.5.1. European Maritime Day\\n\\n(T/4/6/Vol V)\\n\\n2.5.2. Il-Kunsillier
  J. Attard irrefera g\u0127all-minuta 5.6.1. tas-seduta ta'' qabel u staqsa dwar
  jekk sarx kuntatt ma'' EcoMarine Malta dwar tindif li huma jixtiequ jag\u0127mlu
  f''qieg\u0127-il ba\u0127ar fil-Bajja tal-G\u0127adira fis-26 ta'' Mejju 2019.\\n2.5.3.
  Kien hemm qbil li korrispondenza fuq din il-materja ti\u0121i mg\u0127oddija lill-Kunsillier
  J. Azzopardi.\\n\\n3.0. Twe\u0121ibiet g\u0127all-Mistoqsijiet tal-Kunsillieri\\n\\n3.1.1.
  Tiswijiet fi Triq G\u0127ajn \u017bejtuna\\n\\n(D/3/1/Vol V)\\n\\n3.1.2. Il-Kunsillier
  J. Azzopardi staqsa x''inhi r-ra\u0121uni g\u0127aliex Triq G\u0127ajn \u017bejtuna
  g\u0127adha ma ssewwietx fil-parti tal-S-Bend.\\n3.1.3. Is-Sindku wie\u0121eb li
  din ma saritx peress li l-kuntrattur kon\u010bernat huwa kommess fuq xog\u0127lijiet
  o\u0127ra fdati lilu minn Infrastructure Malta.\\n\\n3.1. Tqeg\u0127id ta'' Karti\\n\\n*
  Minuti \u2013 Laqg\u0127a ma'' E-Cubed Ltd dwar il-Parke\u0121\u0121 ta\u0127t l-estensjoni
  tal-Iskola Primarja \u2013 25/02/19;\\n* Skeda ta'' Infieq permezz tal-Petty Cash
  \u2013 10/01/19 \u2013 15/03/19;\\n* Purchase Request Form \u2013 18/03/19;\\n*
  Skeda ta'' Pagamenti \u2013 16/02/19 \u2013 19/03/19;\\n* Skeda ta'' Korrispondenza
  li ntbag\u0127tet.\\n* Skeda ta'' Korrispondenza li waslet; u\\n\\n4.0. Korrispondenza
  u komunikazzjoni mis-Sindku u l-Kunsillieri\\n\\n4.1.1. PC 0044/18 - Bdil fl-iskema
  tal-bini fi triq \u0121dida fi\u017c-\u017cona Ta'' Masrija (P/5/1/Vol IV)\\n\\n4.1.2.
  Saret referenza g\u0127all-applikazzjoni msemmija hawn fuq, li tinvolvi tibdil fil-policy
  dwar Ta'' Masrija, approvata permezz ta'' PC 0046/13. L-applikant qed jitlob sabiex
  ji\u0121u spusstjati wesg\u0127at privati bejn blokka u o\u0127ra bil-g\u0127an
  li jippermettu di\u017cinn u tqassim a\u0127jar tal-bini filqtajja'' Nru. 15, 16,
  23, 24, 25, 26, 27, 28. Essenzjalment qed jintalab li fejn l-iskema tipprova li
  jsiru \u017cew\u0121 blokki bi spa\u017cju bejniethom, issir minflok blokka wa\u0127da
  u jispi\u010b\u010ba l-ispazju kollu.\\n4.1.3. In\u0121ibdet l-attenzjoni tal-Kunsill
  li din l-applikazzjoni di\u0121a \u0121iet ikkunsidrata fis-Seduta Nru. 998 tad-9
  ta'' Lulju 2018, meta kien \u0121ie de\u010bi\u017c li m''g\u0127andhomx jin\u0127olqu
  pre\u010bedenti, fis-sens li l-iskema kif approvata permezz ta'' PC 0046/13 g\u0127andha
  tibqa'' ti\u0121i osservata, primarjament sabiex ma ti\u017cdiedx aktar id-densit\u00e0
  tal-bini.\\n4.1.4. Il-Kunsill kien tal-fehma li g\u0127andu jtenni l-po\u017cizzjoni
  tieg\u0127u espressa permezz tarrappre\u017centazzjoni tieg\u0127u datata 25 ta''
  \u0120unju 2018.\\n\\n4.2.1. Tower Crane fi Triq is-Sag\u0127tar\\n\\n(A/6/3/1 Vol
  127)\\n\\n4.2.2. Saret referenza dwar talba sabiex jitrama tower crane fit-triq
  imsemmija bejn Wesg\u0127at inNar\u010bis u Triq is-Salini l-Qodma. Qed ji\u0121i
  propost li dan jitqieg\u0127ed fuq in-na\u0127a opposta tas-sit li ser ji\u0121i
  \u017cviluppat.\\n4.2.3. Il-Kunsill approva t-talba.\\n\\nerien (T/4/7/Vol III)\\n\\n4.3.1.
  Tara\u0121 bejn Triq is-Sag\u0127tar u Triq l-G\u0127\\n\\n4.3.2. Saret referenza
  g\u0127al imejl datat 16 ta'' Mar\u017cu 2019, fejn \u0121ie osservat illi passa\u0121\u0121
  pubbliku pro\u0121ettat illi jsir bejn it-toroq imsemmija, ghalkemm huwa ndikat
  fil-pjanti tal-Awtorit\u00e0 talIppjanar, g\u0127adu mhuwiex re\u0121istrat mar-Re\u0121istru
  tal-Art. Huwa qal li sabiex dan ji\u0121i registrat mil-Uffi\u010b\u010bju Kon\u0121unt
  ukoll, il-Kurja trid tippre\u017centa lill-Uffi\u010b\u010bju Kon\u0121unt id-dokumenti
  me\u0127tiega. Kemm-il darba ssir talba formali mil-Kunsill lill-Uffi\u010b\u010bju
  Kon\u0121unt g\u0127arre\u0121istrazzjoni ta'' dan il-passa\u0121\u0121, din tkun
  ta'' ghajnuna biex jibdew il-pro\u010beduri g\u0127arre\u0121istrazzjoni tieg\u0127u.
  F''ka\u017c ta'' \u017cvilupp tal-proprjet\u00e0 biswit it-tara\u0121, jew fil-kaz
  li abbu\u017civament wie\u0127ed jokkupa dan il-passa\u0121\u0121, jew parti minnu.
  Huwa g\u0127aldaqstant talab sabiex titressaq talba mill-Kunsill mal-Uffi\u010b\u010bju
  Kon\u0121unt sabiex jirre\u0121istra l-art in kwistjoni mar-Re\u0121istru talArt.\\n\\n4.3.3.
  Il-Kunsill ma sabx o\u0121\u0121ezzjoni.\\n\\n4.4.1. In\u0121ombru fi Trejqet il-Kamp
  ta'' G\u0127ajn Tuffie\u0127a\\n\\n(T/3/2/Vol XV)\\n\\n4.4.1. Saret referenza g\u0127al
  ittra datata 10 ta'' Marzu 2019, fejn residenta lmentat li t-trejqa msemmija spiss
  qed tkun in\u0121umbrata b''vetturi pparkjati meta l-wisa'' tag\u0127ha huwa ta''
  4.3 metri biss. G\u0127aldaqstant, intalab li jsiru tabelli jew sinjali li jipprojbixxu
  l-ipparkar fit-trejqa in kwistjoni, kif ukoll li jsiru parking bays fit-toroq tal-qrib.\\n4.4.2.
  Il-Kunsill approva t-talba u qabel li g\u0127andha ssir talba lill-Transport Malta
  sabiex ji\u0121i pprojbit l-ipparkjar fit-trejqa in kwistjoni.\\n\\n4.5.1. Konkors
  ta pro\u017ca g\u0127all-anzjani (K/7)\\n\\n4.5.2. Inqara imejl datat 14 ta'' Marzu
  2019 mibg\u0127ut mis-Segretarjat Parlamentari g\u0127al Persuni b''Di\u017cabilit\u00e0
  u Anzjanit\u00e0 Attiva, fejn intqal li \u0121ie mniedi konkos ta'' pro\u017ca bil-Malti
  g\u0127allanzjani li l-iskop tieg\u0127u huwa li tit\u0127e\u0121\u0121e\u0121 l-anzjanit\u00e0
  attiva anke permezz tal-kitba tal-pro\u017ca.\\n4.5.3. Il-Kunsill laqa'' l-istedina
