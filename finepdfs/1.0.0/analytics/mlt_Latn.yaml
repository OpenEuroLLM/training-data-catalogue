  ta'' dan il-pro\u010bediment g\u0127andhom jit\u0127allsu nofs bin-nofs bejn ilpartijiet.\\n\\nDr.
  Brigitte Sultana\\n\\nMa\u0121istrat\\n\\nDorianne Cordina\\n\\nDeputat Re\u0121istratur\\n\\n6\"",
  "\"Pa\u0121na ewlenija>Drittijietek>Imputati (pro\u010beduri kriminali)\\n\\nJekk
  jog\u0127\u0121bok innota li l-ver\u017cjoni bil-lingwa ori\u0121inali ta'' din
  il-pa\u0121na \u0121iet emendata re\u010bentement. Il-ver\u017cjoni tal-lingwa li
  qed tara b\u0127alissa attwalment qed ti\u0121i ppreparata mit-tradutturi tag\u0127na.\\n\\nSwipe
  to change\\n\\nImputati (pro\u010beduri kriminali)\\n\\nLatvja\\n\\nDawn l-iskedi
  informattivi jispjegaw x''ji\u0121ri meta persuna tkun issuspettata jew akku\u017cata
  b''delitt li ji\u0121i ttrattat fil-qorti.\\n\\nMa hemm l-ebda traduzzjoni uffi\u010bjali
  tal-ver\u017cjoni tal-lingwa li qed tara.\\n\\nHawnhekk tista'' tara ver\u017cjoni
  tradotta awtomatikament ta'' dan il-kontenut. Jekk jog\u0127\u0121bok innota li
  din hi pprovduta biss g\u0127al finijiet kuntestwali. Is-sid ta'' din ilpa\u0121na
  ma ja\u010b\u010betta ebda responsabbilt\u00e0 jew obbligazzjoni fir-rigward tal-kwalit\u00e0
  ta'' dan it-test tradott b''mod awtomatiku.\\n\\n-----il-Malti-----il-Bulgarul-Ispanjoli\u010b-\u010aekid-Dani\u017cil-\u0120ermani\u017cl-Estonjanil-Griegl-Ingli\u017cil-Fran\u010bi\u017cKroatit-Taljanil-Litwanl-\\n\\nUngeri\u017cl-Olandi\u017cil-Pollakkil-Portugi\u017cir-Rumenis-Slovakkis-Slovenil-Finlandi\u017cl-Isvedi\u017c\\n\\nJekk
  inti vittma ta'' delitt tista'' ssib informazzjoni kompleta dwar id-drittijiet tieg\u0127ek
  . hawnhekk\\n\\nIl-pro\u010bess kriminali fil-qosor\\n\\nDan li \u0121ej huwa sommarju
  tal-istadji normali fil-pro\u010bess kriminali:\\n\\nL-investigazzjoni\\n\\nIl-prosekuzzjoni\\n\\nIs-smig\u0127
  tal-kaw\u017ca mill-Qorti tal-Prim''Istanza\\n\\nRevi\u017cjoni tal-kaw\u017ca mill-Qorti
  tal-Appell\\n\\nRevi\u017cjoni tal-kaw\u017ca mill-Qorti Suprema\\n\\nRevi\u017cjoni
  tad-de\u010bi\u017cjonijiet attwali tal-qorti\\n\\nFl-iskedi informattivi tista''
  ssib dettalji dwar dawn l-istadji kollha u dwar id-drittijiet tieg\u0127ek.\\n\\nDin
  l-informazzjoni m''g\u0127andhiex tie\u0127u post il-parir legali u hija ma\u0127suba
  biss biex isservi ta'' gwida.\\n\\nIr-rwol tal-Kummissjoni Ewropea\\n\\nJekk jog\u0127\u0121bok
  innota li l-Kummissjoni Ewropea m''g\u0127andhiex rwol fil-pro\u010beduri kriminali
  fl-Istati Membri u ma tistax tg\u0127inek jekk ikollok xi lment.  Dawn l-iskedi
  informattivi jipprovdu informazzjoni dwar kif g\u0127andek tag\u0127mel ilment u
  g\u0127and min trid tag\u0127mlu.\\n\\nIkklikkja fuq il-links ta'' hawn ta\u0127t
  sabiex issib it-tag\u0127rif li te\u0127tie\u0121\\n\\nId-drittijiet tieg\u0127i
  matul l-investigazzjoni\\n\\nId-drittijiet tieg\u0127i matul il-pro\u010bess\\n\\nId-drittijiet
  tieg\u0127i wara l-pro\u010bess\\n\\nLinks relatati\\n\\nIl-li\u0121i tal-pro\u010bedura
  kriminali\\n\\nIl-Li\u0121i Kriminali\\n\\nL-awtoritajiet tal-Pulizija tal-Istat\\n\\nL-Uffi\u010b\u010bju
  tal-Avukat \u0120enerali\\n\\nL-Asso\u010bjazzjoni tal-Avukati tal-Latvja\\n\\nIl-Qrati
  tal-Latvja\\n\\nL-a\u0127\u0127ar a\u0121\u0121ornament: 11/08/2023\\n\\nIl-verzjoni
  bil-lingwa nazzjonali hija \u0121estita mill-Istat Membru rispettiv. It-traduzzjonijiet
  saru mis-servizz tal-Kummissjoni Ewropea. Jista'' jkun hemm xi tibdil imda\u0127\u0127al
  fl-ori\u0121inal mill-awtorit\u00e0 nazzjonali kompetenti li jkun g\u0127adu ma
  jidhirx fit-traduzzjonijiet. Il-Kummissjoni Ewropea ma ta\u010b\u010bettax responsabbilta
  jew kwalunkwe tip ta'' tort fir-rigward ta'' kull informazzjoni jew dejta li tinsab
  jew li hemm referenza g\u0127aliha f''dan id-dokument. Jekk jog\u0127\u0121bok irreferi
  g\u0127all-avvi\u017c legali sabiex ti\u010b\u010bekkja r-regoli dwar id-drittijiet
  tal-awtur g\u0127all-Istati Membri responsabbli minn din il-pa\u0121na.\\n\\nil-Latvjan\\n\\nMT\"",
  "\"KUNSILL LOKALI TA'' XBIEX\\n\\nLill-Kunsillieri Kunsill Lokali Ta'' Xbiex\\n\\n23
  ta'' Lulju 2014\\n\\nQed [entilment ti[u nfurmati li se ssir Laqgha Seduta Nru 23
  tas-Seba'' Legislatura tal-Kunsill Lokali ta'' Ta'' Xbiex se tin\\\\amm fl-Uffi``ju
  Amministrattiv tal-Kunsill nhar  it-Tnejn 28 ta'' Lulju  2014 fis-2.00pm.\\n\\nPaul.J.
  Pace  DIP.B.A.(Bus.Mangt),M.B.A A[ent Segretarju E\\\\ekuttiv\\n\\nA{ENDA\\n\\nApprovazzjoni
  tal-Minuti\\nKommunikazzjoni mis-Sindku\\nRapport mill-Kunsilliera\\nTraffic Signs\\n{emella[[i\\nECAD\\n}wejjeg
  O]ra\\nEg]luq tal-Laqg]a\"", "\"Ref: 39/6/194/14\\n\\nMinuti tal-Laqg\u0127a Nru.
  39\\n\\nIl-Kunsill iltaqa'' fl-uffi\u010bini amministrattivi, fi \u0120nien Pawlu
  Boffa, Triq il-Knisja, Paola nhar il\u0126amis 21 ta'' Lulju 2014. Il-laqg\u0127a
  bdiet fis-5.45pm. G\u0127al-laqg\u0127a kienu pre\u017centi s-Sindku Roderick Spiteri,
  il-Vi\u010bi Sindku Dominic Grima, il-Kunsillier Bernard Sean Lynch, ilKunsilliera
  Rita Delezio, il-Kunsillier Tyrone Muscat, il-Kunsillier Renald Dalli u l-Ambaxxatur
  ta\u017c-\u017bg\u0127a\u017cag\u0127 Neil Joseph Tirchett.\\n\\nIl-Kunsilliera
  Steven Axisa kien sku\u017cat.\\n\\nKien hemm pre\u017centi wkoll is-Segretarju
  E\u017cekuttiv Kurt Scerri.\\n\\n1. \u0126atra tal-Kunsillier Sur Renald Dalli\\n\\n1.1.
  Fid-dawl tar-ri\u017cultat ta'' l-elezzjoni ka\u017cwali li se\u0127\u0127et it-Tlieta,
  8 ta'' Lulju,  2014,wara irri\u017cenja tal-Kunsillier Ing. Ray Attard, is-Sur Renald
  Dalli \u0127a il-\u0121urament tal-\u0127atra tieg\u0127u fil-bidu ta'' din il-laqg\u0127a
  quddiem il-Kummissarju tal-\u0120ustizzja Dr. Ian Micallef.\\n1.2. Hawnhekk is-Sindku
  filwaqt li irringrazzja lil Ing. Ray Attard tal-\u0127idma tieg\u0127u fi \u0127dan
  il-Kunsill Lokali Paola, awgura lis-Sur Renald Dalli \u0127afna \u0127idma siewja
  g\u0127all-\u0121id tallokalita ta'' Paola.\\n1.3. Is-Sindku qal illi s-Sur Renald
  Dalli ser ikun inkarigat mill-pro\u0121etti ta'' l-EU kif ukoll mill-Edukazzjoni.\\n\\n2.
  Minuti\\n\\n2.1.\\n\\nMinuti tal-Laqg\u0127a  Nru. 36 tas-Sitt Le\u0121islatura\\n\\nIl-Vi\u010bi
  Sindku xtaq jikkore\u0121i numru 2.10. Huwa stqarr illi ma kienx qal li l-\u0127wienet
  g\u0127andom ikollhom kuntrattur privat i\u017cda illi g\u0127alkemm il-Kunsill
  Lokali Paola qed ji\u0121bor  dan l-iskart u mhux obbligat jag\u0127mel dan, dawn
  is-sidien tal-\u0127wienet mhux jikkoperaw mas-sistemi li jopera il-Kunsill Lokali
  f''dan ir-rigward.\\n\\n2.2. Minuti tal-Laqg\u0127a  b''ur\u0121enza Nru. 37 tas-Sitt
  Le\u0121islatura\\n\\nIl-Kunsill Lokali Paola approva dawn il-minuti nem con.\\n\\n2.3.\\n\\nMinuti
  tal-Laqg\u0127a b''ur\u0121enza  Nru. 38 tas-Sitt Le\u0121islatura Il-Kunsill Lokali
  Paola approva dawn il-minuti nem con.\\n\\nKunsill Lokali Paola\\n\\n3. Korrispondenza\\n\\n3.1.
  Ittra ming\u0127and l-Avukat Michael Sciriha g\u0127an-nom tas-Sur Francis Stabile
  li jixtieq jag\u0127mel pletform fejn l-istabbiliment tieg\u0127u Taste Snack Bar
  fi triq Paola Hill. Huwa talab no objection letter ming\u0127and il-Kunsill Lokali
  Paola sabiex issir din il-pletform wara li \u0121ie mitlub dan id-dokument mill-Mepa.
  Il-Kunsill Lokali Paola qabel unanimament abba\u017ci tal-permess li in\u0127are\u0121
  minn Transport Malta nhar l-14 ta'' Jannar 2014 b''referenza 45/TM/12/18, jag\u0127ti
  din in-no objection.\\n3.2. Ittra ming\u0127and l-Avukat Victor Bugeja g\u0127an-nom
  ta'' Emanuel Spiteri sabiex jitne\u0127\u0127a minn black-listed u jkun jista''
  japplika g\u0127al tenders ma\u0127ru\u0121a mill-Kunsill Lokali Paola. Hawnhekk
  is-Sindku Roderick Spiteri \u0127are\u0121 mil-laqg\u0127a min\u0127abba konflitt
  ta'' interess u familjari fl-isfond tas-Sur Emanuel Spiteri. Il-membri l-o\u0127ra
  iddiskutew din il-materja u hawnhekk il-Vi\u010bi Sindku sostna li fil-le\u0121islatura
  pre\u010bedenti kienu i\u010b\u010bekjaw u sabu li sSur Spiteri ma kienx black-listed.
  Dan il-\u0127sieb \u0121ie ssekondat mill-Kunsillier Renald Dalli per\u00f2 g\u0127al
  dan il-Kunsilliera Delezio sostniet li wara diskussjonijiet ma'' l-istess Emanuel
  Spiteri huwa kien qalilha li hu kien ta'' l-impressjoni li kien black-listed. IlKunsill
  qabel unanimanent illi g\u0127andu jitlob lil avukat tal-kunsill sabiex jinforma
  lil avukat tas-Sur Spiteri li huwa m''huwiex black-listed mill-Kunsill Lokali Paola
  u jista'' japplika g\u0127al-kull offerta ma\u0127ru\u0121a mill-Kunsill.\\n3.3.
  Ittra mibg\u0127uta ming\u0127and is-Sur George Glanville li qed jissu\u0121\u0121erixxi
  li Triq il-Wied quddiem il-klabb tal-bo\u010b\u010bi g\u0127anda tissemma Triq il-Bi\u010b\u010berija
  l-Qadima sabiex tfakkar ilbi\u010b\u010berija li kienet hemm u ing\u0127alqet lura
  fis-snin 70. Il-Kunsill ma qabilx ma din ilproposta g\u0127aliex dan seta'' jo\u0127loq
  pre\u010bedent fejn jinbidlu diversi ismijiet ta'' toroq pre\u017centi meta dan
  kien ti\u0121a \u0121ie rrifjutat mill-awtoritajiet fis-snin ta qabel. Il-Kunsill
  sostna li huwa jag\u0127ti ismijiet ta'' toroq \u0121odda u mhux ibiddel dawk e\u017cistenti.\\n3.4.
  Ittra ming\u0127and is-Sur Francis Farrugia li joqg\u0127od fit-triq is-Sultan fejn
  qed jilmenta millperiklu li qed jin\u0127oloq mill-parke\u0121\u0121 quddiem id-dar
  tieg\u0127u. Huwa sostna li dan qed jo\u0127loq \u010bertu diffikultajiet fid-dawl
  ta'' l-anzjanit\u00e0 tieg\u0127u u tal-mara u qed jitlob li dan ilparking bay jew
  jitne\u0127\u0127a, jersaq aktar l-isfel jew issir bay g\u0127al muturi. Is-Sindku
  kompla billi is-Sur Farrugia kien tkellem mieg\u0127u personalment u fost l-o\u0127rajn
  spjega kif is-Sur Farrugia jib\u017ca mill-fatt li n-nies jistg\u0127u jin\u0127bew
  wara vannijiet li qed jipparkjaw quddiemu. Is-Sindku qal li kien g\u0127amel kuntatt
  mal-Pulizija g\u0127an-nom tas-Sinjur u lPulizija osservaw l-area g\u0127al diversi
  \u0121ranet u ma sabu l-ebda periklu. Il-Kunsill qabel mas-su\u0121\u0121eriment
  tas-Sindku li tintbag\u0127at ittra lil Transport Malta b\u0127ala l-awtorit\u00e0
  responsabbli u naraw x''possibiltajiet hemm biex g\u0127allinqas il-parking bays
  jimxu l-isfel.\\n\\nKunsill Lokali Paola\\n\\nIl-Kunsillier Lynch kompla billi qal
  li importanti ma jin\u0127oloqx pre\u010bedenti fejn dak li jkun joqg\u0127od jitlob
  li jitne\u0127\u0127ew l-parking bays minn wara l-bibien tan-nies.\\n3.5. Ilment
  ming\u0127and residenti ta'' Triq Lampuka fejn qed jitolbu li fid-dawl li triq tag\u0127hom
  \u0121iet one-way, ji\u017cdied parking bay fit-tarf tat-triq qabel ma to\u0127ro\u0121
  g\u0127al Triq \u017babbar. Apparti li ti\u017cdied din il-parking bay, il-Kunsill
  Lokali qabel ukoll li g\u0127andu isir traffic junction improvment fil-parti fejn
  Triq Stivala t''iltaqa'' ma Triq Lampuka u li tag\u0127ti g\u0127ala triq \u017babbar.\\n3.6.
  Ittra ming\u0127and is-So\u010bjet\u00e0 Filarmonika Fra Antoine De Paule Banda
  Kristu Re fejn qed tirringrazzja lil Kunsill Lokali Paola tal-koperazzjoni li kien
  hemm qabel u waqt i\u010b\u010belebrazzjoni tal-Festa ta'' Kristu Re 2014.\\n3.7.
  Mid-Year Report tal-GreenPak dwar skart ri\u010biklabbli mi\u0121bur mill-lokalita
  ta'' Paola fejn qed jidher li bejn \u0120unju 2013 u \u0120unju 2014 \u017cdied
  b''33.48 tunellati l-iskat ri\u010biklabbli mi\u0121bur mill-lokalita. Is-Segretarju
  kompla billi \u017cied illi ir-residenti qed jirrikorru g\u0127and il-Kunsill Lokali
  sabiex ji\u0121bru il-boro\u017c il-\u0127odor u dan qed jidher fl-ammont ta'' skart
  ri\u010biklabbli li qed jin\u0121abar. Il-lokalita ta'' Paola issa tinsab fis-26
  post mill-Kunsilli Lokali li qed joperaw mal-GreenPak u mhux fl-a\u0127\u0127ar
  post kif kien qed isir fis-snin ta'' qabel. IsSegretarju fakkar li dan ir-rapport
  qieg\u0127ed pre\u017centi fil-foyer tal-Kunsill ma\u0121enb it-tifkira (trophy)
  li reba\u0127 il-Kunsill Lokali Paola grazzi g\u0127all-improvment li sar tul is-sena
  2013, sabiex ir-residenti ikunu jafu b''din l-informazzjoni. Dan qed jitwassal ukoll
  fuq ilFacebook tal-Kunsill.\\n3.8. Is-Segretarju ippre\u017centa kont tat-telefon
  tal-Kunsill fejn jidher li wara l-e\u017cer\u010bizzju li sar lura g\u0127al April
  2014 fejn inbidel il-package li kellu l-Kunsill mal-kumpanija Ozone u sar aktar
  kontroll dwar l-u\u017cu ta'' telefon, hemm differenza po\u017cittiva fil-kontijiet
  kif jidher hawn ta\u0127t:\\n3.9. Ittra mibg\u0127uta ming\u0127and Sinjura Bugeja
  dwar \u0121iti ta'' \u0121urnata lejn Sqallija kif ukoll ittra ming\u0127and Heritage
  Malta dwar \u0127ar\u0121iet kultura li jistg\u0127u isiru g\u0127ar-residenti.
  Din ilkorrispondenza g\u0127addiet g\u0127and il-Kunsillier Lynch b\u0127ala il-Kunsillier
  responsabbli millattivitajiet sabiex ikun jista'' jistaqsi aktar dwarhom.  Is-Segretarju
  issu\u0121\u0121erixxa li ssir attivit\u00e0 g\u0127al Jum l-Anzjani bejn in-Nanniet
  u n-Neputijiet.\\n3.10. Ittra mibg\u0127uta ming\u0127and Sinjura Annie Cassar mill-Malta
  Dance Sport Association dwar klassijiet ta'' fitness g\u0127at-tfal. Is-Sindku tkellem
  fid-dettall dwar din ilkorrispondenza wara l-laqg\u0127a li sarg\u0127et ma'' l-istess
  asso\u010bjazzjoni. Din l-ittra titkellem dwar proposta fejn it-tfal ta'' l-iskola
  jibdew jattendu g\u0127al xi tip ta'' Fitness Classes filbini tal-Kunsill jew inkella
  fi \u0120nien Pawlu Boffa. L-idea hija li wara l-iskola dawn jieqfu g\u0127al sieg\u0127a
  ta'' e\u017cer\u010bizzju u j\u0127allsu rata \u017cg\u0127ira sabiex jag\u0127mlu
  tajjeb g\u0127all-ispi\u017ca tal-instructors. Jekk jattendu 30 tifel/tifla i\u0127allsu
  Euro12 g\u0127al tnax il-\u0121img\u0127a s\u0127a\u0127 b''\u017cew\u0121 lezzjonijiet
  fil-\u0121img\u0127a. Dwar dan il-Kunsillier Dalli \u017cied illi huwa qed jipproponi
  wkoll illi l-Kunsill Lokali Paola jer\u0121a jibda l-klassijiet tal-homework fejn
  ikun hemm g\u0127alliema fil-Kunsill jg\u0127inu lit-tfal fil-homework wara l-iskola.
  Dwar dan kollu il-Kunsill qabel li g\u0127anda issir laqg\u0127a mas-Surmast il-\u0121did
  ta'' l-iskola.\\n3.11. Tlett kwotazzjonijiet dwar l-istatwa li kienet proposta mill-Kunsillier
  Muscat. Huwa informa lil mejda li wara li kien hemm qbil f''laqg\u0127a pre\u010bedenti
  illi jin\u0121abru kwotazzjonijiet sabiex issir statwa tad-Duluri qabel ma tidhol
  fi\u010b-\u010bimiterju ta'' lAddolorata, huwa kien qed jippre\u017centa dawn il-kwotazzjonijiet:\\n-
  Alfred Camilleri Cauchi \u2013 Euro14,000\\n- Lawrence Attard \u2013 Euro 9,000\\n-
  David Brincat \u2013 Euro 3,500\\n\\nWara li ta spejga dwar dawn l-offerti, il-Kunsillier
  Muscat qal li xtaq li ssir din listatwa min\u0127abba it-talba li kellu minn diversi
  persuni li ma jid\u0127lux fi\u010b-\u010bimiterju g\u0127ax jiddejqu per\u00f2
  xtaqu li g\u0127allinqas ikun hemm din l-istatwa imsemmija fil-bieb. Il-Vi\u010bi
  Sindku \u017cied illi m''huwiex \u010bar l-art barra i\u010b-\u010bimiterju hijiex
  responsabbilt\u00e0 tal-Kunsill Lokali Paola u sostna li jekk g\u0127andu isir monument
  isir fil-qalba tar-ra\u0127al. Is-Sindku \u017cied illi filwaqt li jikkonferma li
  kien hemm il-\u0127sieb li ssir din l-istatwa qatt ma basar li l-ispi\u017ca kienet
  ser titla daqshekk u g\u0127alhekk kien tajjeb li l-Kunsillier Muscat \u0121abar
  il-kwotazzjonijiet. Is-Sindku \u017cied li filwaqt li jasal jaqbel li ssir din l-istatwa,
  sostna li hemm postijiet aktar importanti fejn jintefqu l-flus.  Il-Kunsill Lokali
  iddiskuta jekk g\u0127andiex issir din l-istatwa abba\u017ci tal-kwotazzjonijiet
  ppre\u017centati u qabel li din m''g\u0127andiex issir. Is-Sindku kompla u qal li
  ser jipprova isib mezzi o\u0127ra sabiex issir\\n\\ndin l-istatwa b\u0127all-awtoritajiet
  ta\u010b-\u010bimiterju jew l-Mcast Art & Design, sabiex jara hux possibbli li jag\u0127mlu
  din l-istatwa huma.\\n\\n3.12. Ittra mibg\u0127uta mill-Kunsilliera Rita Delezio
  u Tyrone Muscat sabiex ter\u0121a ti\u0121i diskussa il-possibilit\u00e0 li ter\u0121a
  titpo\u0121\u0121a l-ir\u0127ama li tfakkar il-ftu\u0127 ta'' \u0120nien Pawlu Boffa.
  Is-Sindku qal illi peress din il-materja kienet diskussa f''laqg\u0127a pre\u010bedenti
  fejn il-Kunsill Lokali qabel li din ma ter\u0121ax te\u0127el, ma tistax ter\u0121a
  ti\u0121i diskussa qabel sitt xhur mid-data tal-laqg\u0127a li fiha ittie\u0127det
  id-de\u010bi\u017cjoni. Is-Segretarju kompla billi ikkwota l-Ordnijiet Permanenti
  mnissla fl-Att 363 fis-Sitt Skeda u qal li sabiex ti\u0121i m\u0127assra resoluzzjoni
  talKunsill iridu jg\u0127addu sitt xhur jew inkella wara li jkun hemm resoluzzjoni
  spe\u010bjali. IsSegretarju spjega li dan ifisser li sabiex ti\u0121i ter\u0121a
  ti\u0121i diskussa din il-materja qabel is-sitt xhur, l-ewwel il-Kunsilliera iridu
  jidde\u010biedu jekk id-diskussjoni g\u0127andiex issir jew le. Jekk il-Kunsilliera
  jaqblu li din il-materja ti\u0121i diskussa umbag\u0127ad trid ti\u0121i ppre\u017centata
  mozzjoni li tistipula dan u tkun iffirmata minn \u017cew\u0121 persuni. G\u0127alhekk
  is-Segretarju innota li l-ewwel g\u0127andu jittie\u0127ed vot sabiex ji\u0121i
  de\u010bi\u017c jekk din il-materja g\u0127andiex ter\u0121a ti\u0121i diskussa
  fil-Kunsill. Il-Kunsilliera Lynch, Delezio u Muscat qablu li din il-materja g\u0127anda
  ti\u0121i diskussa, filwaqt li Grima, Dalli u s-Sindku ma qablux. Fid-dawl ta''
  dan isSindku talab g\u0127al Casting Vote u min\u0127abba l-fatt li kien hemm il-ma\u0121\u0121oranza
  talkunsilliera pre\u017centi waqt il-laqg\u0127a li talbu li ter\u0121a ti\u0121i
  diskussa, kien hemm de\u010bi\u017cjoni li din ter\u0121a ti\u0121i diskussa (wara
  li tasal g\u0127and is-segretarju il-mozzjoni dwar dan iffirmata minn \u017cew\u0121
  kunsilliera).\\n\\n4. Impjegati tal-Kunsill\\n\\n4.1. Is-Segretarju informa lil
  mejda li l-Kunsill Lokali Paola ir\u010bieva applikazzjoni wa\u0127da g\u0127all-impjegat
  fi Skala 13 ming\u0127and is-Sinjura Josephine Camilleri, wara li f''laqg\u0127a
  pre\u010bedenti kien hemm qbil li to\u0127ro\u0121 sej\u0127a interna. Il-Kunsill
  Lokali qabel li Sinjura Josephine Camilleri titla g\u0127al Skala 13 b''effett mill-1
  ta'' Settembru 2014.\\n4.2. Dwar is-sej\u0127a g\u0127al impjegat fi Skala 15, is-Segretarju
  informa lil mejda li wara li sarg\u0127et sej\u0127a fil-Kunsilli Lokali ta'' Malta
  u G\u0127awdex u \u0127add ma applika, din is-sej\u0127a g\u0127addiet g\u0127and
  l-ETC. Is-Segretarju \u017cied li ir\u010bieva diversi applikazzjonijiet u talab
  li jifforma Bord ta'' l-intervisti sabiex jiddiskuti dawn l-applikazzjonijiet u
  jag\u0127mel l-intervisti me\u0127tie\u0121a. Il-membri fuq dan il-bord ser ikunu
  is-Sindku Roderick Spiteri, il-Vi\u010bi Sindku Domnic Grima u l-Kunsilliera Steven
  Axisa u Rita Delezio.\\n\\n5. Upkeep and Maintenance of Soft Areas in an Environmentally
  Friendly Manner Tender\\n\\n5.1. Is-Sindku informa lil mejda li wara li n\u0127atar
  Bord ta'' Evalwazzjoni marbut ma dan ittender saru \u017cew\u0121 laqg\u0127at u
  sar ukoll Rapport ta'' anali\u017ci dettaljat mis-Segretarju  li ikkompara l-offerti
  kollha. Il-Bord ta'' Evalwazzjoni issu\u0121\u0121erixxa illi dan it-tender jing\u0127ata
  lil ELC ltd u l-Kunsill Lokali approva b''mod unanimu.\\n\\n6. Traffic Marking Signs\\n\\n6.1.
  Is-Sindku feta\u0127 id-diskussjoni dwar i\u017c-\u017cebg\u0127a li ssir fit-toroq
  ta'' Paola u qal li is-Sur Alfred Portelli (impjegat ta\u0127t l-iskema IPSL), li
  huwa responsabbli minn dan ix-xog\u0127ol, jo\u0127ro\u0121 bil-pensjoni is-sena
  d-die\u0127la u  g\u0127alhekk ippropona li l-Kunsill Lokali Paola jibda ja\u0127seb
  biex jo\u0127ro\u0121 tender g\u0127al dawn ix-xog\u0127olijiet.\\n6.2. Dwar dan
  il-punt il-Vi\u010bi Sindku sostna li huwa importanti li ting\u0127ata attenzjoni
  spe\u010bjali fejn jid\u0127lu stop-signs u \u017cebra crossings. Huwa importanti
  li jkun hemm skeda ta'' xog\u0127olijiet mhux kollox isir skond il-mument.\\n6.3.
  Wara diskussjoni dwar dan is-su\u0121\u0121ett il-Kunsill qabel li jibda l-pro\u010bess
  sabiex jin\u0127are\u0121 tender g\u0127all-marki ta\u017c-\u017cebg\u0127a tat-traffiku
  fil-lokalita.\\n\\n7. Indafa fil-Lokalita-Skart mi\u0121bur mill-\u0127wienet\\n\\n7.1.
  Is-Segretarju informa lil membri li wara li l-materja ta'' l-iskart \u0121iet diskussa
  fil-laqg\u0127a 36 huwa pprepara din l-ittra (annessa mal-minuti) sabiex tintbag\u0127at
  lil \u0127wienet. IlKunsill Lokali qabel mal-kontenut ta'' din l-ittra u mal-formola
  li ser tintbag\u0127at fejn qed jintalbu dettalji ming\u0127and is-sidien tal-bars,
  take-aways, kiosks u restaurants dwar kif qed jittrattaw l-iskart tag\u0127hom.
  Dawn l-ittri g\u0127andom jitqassmu by-hand u jaslu lura mimlija g\u0127and il-Kunsill
  sal-11:00am ta'' 9 ta'' Settembru 2014.\\n7.2. Is-Sindku kompla billi i\u010b\u010bara
  li g\u0127all-finijiet tal-li\u0121i, il-\u0127wienet li jipprovdu l-ikel g\u0127andom
  ikollhom kollettur privat u li jiftehmu mieg\u0127u il-frekwenza ta'' meta jin\u0121abar
  liskart minn \u0121ewwa l-premises tag\u0127hom. Kompla billi \u017cied li b\u0127ala
  Kunsill Lokali nonfqu ti\u0121a eluf ta'' Euros biex jin\u0121abar l-iskart per\u00f2
  mhux permettibli li tara l-\u0127wienet jo\u0127ro\u0121u l-iskart wara l-\u0127in
  li jin\u0121abar.\\n7.3. Rigward is-Suq is-Segretarju spjega li dawn \u0121ew mog\u0127tija
  ittra ming\u0127and il-Kunsill u iffirmaw li huma ir\u010bevewha. Dan l-ittra kienet
  qed tfakkar fl-obbligu legali li g\u0127andom\\n\\nil-bejjieg\u0127a li jnaddfu
  l-post u jie\u0127du l-iskart tag\u0127hom lura mag\u0127hom. Is-Sindku kompla billi
  informa lil membri li filwaqt li hemm diversi bejjieg\u0127a li qed jikkoperaw hemm
  u\u0127ud li mhux jikkoperaw. Is-Sindku \u017cied li sfortunatament billi is-sistema
  tal-wardens b\u0127alissa mhux qed topera b''mod tajjeb huwa diffi\u010bli li jsir
  infurzar tajjeb. Is-Sindku informa lil mejda illi jekk mhux ser isib il-koperazzjoni
  tal-bejjieg\u0127a dwar dan huwa jkun lest li jipproponi li s-suq jing\u0127alaq.\\n\\n7.4.
  Wara diskussjoni dwar il-\u0121ranet tal-ftu\u0127 kien hemm qbil unanimu bejn il-membri
  li dawk li qed jarmaw nhar ta'' Tnejn u nhar ta'' Tlieta jitwaqqfu milli jag\u0127mlu
  dan min\u0127abba li l-permess tal-monti huwa mil-Erbg\u0127a sas-Sibt. Kien hemm
  qbil ukoll li tin\u0121abar stima ta'' CCTV cameras g\u0127al fuq is-Suq.\\n7.5.
  Dwar l-iskart tar-residenti is-Segretarju informa lil mejda li huwa talab lil kuntrattur
  tal\u0121bir ta'' l-iskart sabiex jag\u0127mel e\u017cer\u010bizzju ta'' monitera\u0121\u0121
  ta'' min qed jo\u0127ro\u0121 il-bor\u017ca issewda nhar ta'' Tlieta. Il-Kunsill
  qabel illi g\u0127anda tintbag\u0127at ittra lir-residenti li mhux qed jikkoperaw
  filwaqt li aktar il-quddiem jintbag\u0127atu il-green wardens g\u0127al min jibqa''
  ma jikkoperax.\\n\\n8. Bini mill-\u0121did ta'' bankini u Rampa ta'' Lourdes\\n\\n8.1.
  Is-Sindku issu\u0121\u0121erixxa lil membri li g\u0127anda tinbena mil-\u0121did
  il-bankina fi Triq \u017babbar mis-Super Sound sas-sorijiet ta'' St. Joseph fi\u017c-\u017cew\u0121
  partijiet tat-triq min\u0127abba li din tinstab fi stadju \u0127a\u017cin \u0127afna.  Il-Vi\u010bi
  Sindku kompla billi qal li l-kurduna ta'' din ilbankina qeda g\u0127olja \u017c\u017cejjed
  ukoll per\u00f2 \u017cied li na\u0127a ta'' Salvu Bar g\u0127ada tajjeb. Il-Kunsill
  Lokali qabel li g\u0127andu jitqabbad il-Perit tal-Kunsill sabiex jag\u0127mel stima
  kompluta taxxog\u0127ol li hemm b\u017conn isir biex jinbidlu dawk il-bankini umbag\u0127ad
  il-Kunsill jidde\u010biedi liem parti minn dawn il-bankini isiru.\\n8.2. Is-Sindku
  fakkar li l-Kunsill Lokali Paola kien applika g\u0127all-pro\u0121ett A+ Accessability
  Award fejn kien hemm qbil f''laqg\u0127a pre\u010bedenti (nr. 34) li ssir rampa
  maz-zuntier talKnisja ta'' Lourdes. B''din ir-rampa il-Kunsill applika g\u0127al
  din l-iskema fejn i\u017c\u017cid la\u010b\u010bessibilita. Il-Kunsill Lokali approva
  li tin\u0121abar stima sabiex isir ix-xog\u0127ol per\u00f2 ilKunsillier Renald
  Dalli sostna li qabel isir ix-xog\u0127ol l-ewwel naraw jekk iz-zuntier hux propjet\u00e0
  tag\u0127na jew tal-Knisja. Is-Sindku a\u010b\u010berta lill-mejda li z-zuntier
  huwa responsabilt\u00e0 tal-Kunsill u qed isiru diversi talbiet mill-parro\u010b\u010ba
  relatat ma dan izzuntier.\\n\\n9. Approvazzjoni ta'' l-iskeda ta'' Pagamenti.\\n\\n9.1.
  Il-Kunsill Lokali approva l-iskeda ta'' Pagamenti Nru. 39 minbarra l-pagament nru
  109 lil Mdina Glass Ltd. min\u0127abba \u017cball li kien hemm fl-invoice.\\n\\n10.
  \u0126wejje\u0121 o\u0127ra\\n\\n10.1.Is-Sindku informa lil membri li s-Segretarjat
  Parlamentari g\u0127as-sa\u0127\u0127a talab li l-Kunsill Lokali Paola joffri spazju
  sabiex issir Breast Feeding Room. Il-Kunsill qabel b''mod unanimu li g\u0127anda
  ting\u0127ata il-kamra vojta u bla u\u017cu li hemm fit-tieni sular tal-bini talKunsill.\\n\\n11.
  A\u0121\u0121ornament\\n\\n11.1.Il-Laqg\u0127a \u0121iet mag\u0127luqa fis-7.45pm
  u \u0121iet a\u0121\u0121ornata g\u0127at-Tlieta 9 ta'' Settembru 2014.\\n\\nApprovati
  llum  9 ta'' Settembru  2014.\\n\\n________________________\\n\\n________________________\\n\\nKurt
  Scerri Segretarju E\u017cekuttiv\\n\\nRoderick Spiteri Sindku\"", "\"LECTIO DIVINA\\n\\nIT-II
  \u0126ADD TAL-AVVENT (SENA A)\\n\\nMt 3, 1-12\\n\\nIl-figura ta'' \u0120wanni l-Battista
  tidher fl-erba'' van\u0121eli, u r-rakkonti tas-sinotti\u010bi huma kwa\u017ci identi\u010bi
  f''dak li jirrakkontaw fuqu u fuq ir-relazzjoni tieg\u0127u ma'' \u0120es\u00f9.
  Milli jidher il-Battista mhux biss kien persuna\u0121\u0121 mag\u0127ruf \u0127afna
  f''\u0127ajtu, imma l-memorja tieg\u0127u baqg\u0127et qawwij a wkoll wara mewtu
  sa\u017c-\u017cmien li nktibu l-van\u0121eli (e\u017c. anki \u0120u\u017ceppi Flavju
  jitkellem dwaru). Irrabta qawwija tieg\u0127u, min-na\u0127a l-wa\u0127da mat-tradizzjoni
  Lhudija, u min-na\u0127a l-o\u0127ra rriferiment tal-predikazzjoni tieg\u0127u g\u0127all-mi\u0121ja
  tal-Messija rikonoxxut f''\u0120es\u00f9, j\u0121ieg\u0127lu lill ewwel Insara sabiex
  jistaqsu lilhom infushom dwar is-sinjifikat ta'' dan il-persuna\u0121\u0121 hekk
  qawwi u kontroversjali.\\n\\nG\u0127al Mattew, \u0120wanni l-Battista huwa dixxiplu
  ta'' \u0120es\u00f9. Allavolja kronolo\u0121ikament \u0121ie qablu, il-kliem tieg\u0127u
  u l-ispirtu li bih ja\u0121ixxi jixb\u0127u \u0127afna lil ta'' \u0120es\u00f9.
  Huwa xi \u0127add li g\u0127araf issinjali ta\u017c-\u017cminijiet u rnexxielu jimita
  minn qabel lil dak li kien qed jistenna. Din hija wkoll lisfida tal-ewwel Insara
  u tal-Knisja tul i\u017c-\u017cminijiet sat-tieni mi\u0121ja tal -Mulej: bl-im\u0121jieba
  tag\u0127ha tipprova tanti\u010bipa kif tista'' tkun it-tieni mi\u0121ja ta'' Kristu,
  b''tali mod li meta ji\u0121i, il-bnedmin ikunu qed jistennewh u ma jin\u0127asdux
  g\u0127al kollox. B\u0127alma l-predikazzjoni u l-g\u0127emejjel talMessija jmorru
  ''l hemm minn dak li qed jistenna l-Battista, hekk ukoll it-tieni mi\u0121ja tal-Mulej
  tissorprendi sa\u0127ansitra lil min ikun qed jistenniha. Imma b\u0127alma l-Battista
  fl-a\u0127\u0127ar mill-a\u0127\u0127ar jag\u0127raf f''\u0120es\u00f9 dak li kien
  qed jistenna (bid-dubji kollha li dan qajjem fih) hekk ukoll id-dixxiplu ta'' \u0120es\u00f9
  jirnexxielu jag\u0127raf lil Sidu.\\n\\nv. 1: F''dawk il-jiem, deher \u0120wanni
  l-Battista jippriedka fid-de\u017cert tal-Lhudija\\n\\nL-espressjoni \\\"f''dak
  il-jiem\\\" tintu\u017ca hawnhekk biss minn Mattew. Je\u0127odha mill-Testment ilQadim,
  spe\u010bjalment mil-letteratura profetika. Din l-espressjoni ma tindikax il-dati
  jew is -snin, u ma tirreferix g\u0127all-passat, imma hija t\u0127abbira solenni
  li minn dan il-waqt jibda'' \u017c-\u017cmien tala\u0127\u0127ar, l-era messjanika.
  \u0120wanni ''jidher'' (il-konnotazzjoni ta'' xi \u0127a\u0121a li to\u0127ro\u0121
  g\u0127ad-dawl) g\u0127ax il-mi\u0121ja tieg\u0127u hija sinjal \u010bar ta'' rivelazzjoni
  minn Alla (cf. Titu 2, 11). Jidher fid-de\u017cert, mhux fit-tempju jew f''\u0120erusalemm,
  imma f''post fejn \u0127add ma jobsor. Il-grazzja ta'' Alla li tidher fejn l-inqas
  inkun qed nistenniha.\\n\\nv. 2: u jg\u0127id: \\\"Indmu, g\u0127ax is-saltna tas-smewwiet
  waslet\\\"\\n\\nIl-predikazzjoni tal-Battista taqbel ma'' dik ta'' \u0120es\u00f9.
  Anki \u0120es\u00f9 jibda l-predikazzjoni tieg\u0127u b''dan il-messa\u0121\u0121
  (cf. 4, 17). L-indiema li qed iniedi \u0120wanni g\u0127ad m''g\u0127andhiex kontenut
  spe\u010bifiku. Tixba\u0127 lill-indiema li kienu j\u0127abbru l-profeti: distakk
  radikali minn dak li kien jg\u0127odd g\u0127alija s''issa. Imma filwaqt li l-profeti
  kienu j\u0127e\u0121\u0121u r-ritorn g\u0127all-passat (\u0121eneralment g\u0127allPatt
  u g\u0127ar-relazzjoni ori\u0121inarja ta'' I\u017crael ma'' Alla) il-Battista jorjenta
  l-indiema lejn il-futur, \\\"is-saltna tas-smewwiet\\\" li \u0121ejja. Huwa \u0120es\u00f9
  imbag\u0127ad li jag\u0127ti kontenut spe\u010bifiku lil din ilmetafora. Il-qtug\u0127
  mill-passat hu immotivat u msa\u0127\u0127a\u0127 mill-\u0127arsa lejn il-futur.\\n\\nv.
  3: G\u0127ax g\u0127alih kien ing\u0127ad permezz tal-profeta Isaija, meta qal:
  \\\"Le\u0127en ta'' wie\u0127ed jg\u0127ajjat fid-de\u017cert: \u0126ejju t-triq
  tal-Mulej, iddrittaw il-mog\u0127dijiet tieg\u0127u\\\".\\n\\nX''kienet din it-triq
  tal-Mulej fid-de\u017cert li jsemmi I\u017caija (I\u017c 40, 3). Il-profeta jordna
  l-bini ta'' triq li mill-Babilonja taqsam id-de\u017cert u twassal sa I\u017crael,
  sabiex il-poplu Lhudi jkun jista'' jer\u0121a lu ra mill-e\u017cilju. Hija t-triq
  tal-Mulej g\u0127aliex Alla ta'' I\u017crael jakkumpanja dejjem lill-poplu tieg\u0127u
  u allura din it-triq fl-a\u0127\u0127ar mill -a\u0127\u0127ar tinbena g\u0127aliha.
  Dan huwa wkoll l-g\u0127an a\u0127\u0127ari tal-konver\u017cjoni: mhijiex biss \u0121rajja
  individwali jew komunitarja imma mod kif nag\u0127mel spazju g\u0127al Alla fil-\u0127ajja
  tieg\u0127i u nifta\u0127lu triq biex permezz tieg\u0127i ikun jista'' jasal f''imkejjen
  u g\u0127and persuni o\u0127rajn.\\n\\nv. 4-5: Dan \u0120wanni kellu fuqu libsa
  tax-xag\u0127ar tal -\u0121emel, bi \u0127\u017ciem tal-\u0121ild madwar qaddu,
  u l-ikel tieg\u0127u kien \u0121radijiet u g\u0127asel selva\u0121\u0121. U kienet
  tmur g\u0127andu \u0120erusalemm u l-Lhudija kollha u l-in\u0127awi kollha ta''
  madwar il-\u0120ordan.\\n\\nMattew jie\u0127u \u0127sieb li juri r-rabta ta'' \u0120wanni
  mat-Testment il-Qadim. Jilbes b\u0127all-profeti, partikularment b\u0127al Elija
  (cf. 2 Slat 1, 8), il-profeta li skont tradizzjoni \u0121udajka kellu jer\u0121a
  ji\u0121i qabel il-Messija. L-ikel tal-\u0121radijiet kien permess min-normi lhud,
  u l-g\u0127asel kien meqjus ikel pur (kosher). Dan il-kuntest konformi mal-Li\u0121i
  u t-tradizzjoni jattira lill-Lhud u jqajjem fervur.\\n\\nv. 6: u kienu jitg\u0127ammdu
  minnu fix-xmara \u0120ordan huma u jistqarru dnubiethom.\\n\\nL-ewwel sinjal ta''
  konver\u017cjoni huwa li wie\u0127ed i\u0127alli li ji\u0121i mg\u0127ammed minn
  \u0127addie\u0127or (epabtizonto huwa fil-passiv). Kienu di\u0121a je\u017cistu
  riti fejn wie\u0127ed jin\u0127asel, imma l-mag\u0127mudija ming\u0127and \u0127addie\u0127or
  hija xi \u0127a\u0121a \u0121dida (tant li \u0120wanni ji\u0121i mlaqqam l-G\u0127ammiedi).
  Mhux\\n\\nbi\u017c\u017cejjed dak li wie\u0127ed jag\u0127mel g\u0127alih innifsu,
  imma biex jindem verament wie\u0127ed irid jag\u0127raf jintelaq f''idejn \u0127addie\u0127or.
  L-isforz biex il-persuna to\u0127ro\u0121 mill-awto-suffi\u010bjenza \\\"g\u0127ax
  kull min irid je\u0127les \u0127ajtu, jitlifha\\\" (Mt 16, 25)\\n\\nv. 7-9: Kif
  ra bosta mill-Fari\u017cej u mis-Saddu\u010bej \u0121ejjin g\u0127all-mag\u0127mudija
  tieg\u0127u, qalilhom: \\\"Ja nisel il-lifg\u0127at, min uriekom kif g\u0127andkom
  ta\u0127arbu mill-korla li \u0121ejja? Ag\u0127mlu mela frott xieraq tal-indiema,
  u ta\u0127sbux li tistg\u0127u tg\u0127idu fikom infuskom: \\\"G\u0127andna b''missier
  lil Abraham\\\". Ng\u0127idilkom li Alla, minn dan l-istess \u0121ebel, jista''
  jqajjem ulied lil Abraham.\\n\\nL-evan\u0121elista jindikalna li l-g\u0127edewwa
  ta'' \u0120es\u00f9 kienu wkoll l -g\u0127edewwa ta'' \u0120wanni, tant li dan tal-a\u0127\u0127ar
  jg\u0127idilhom l-istess kliem li kien se jg\u0127idilhom \u0120es\u00f9 (cf. 12,
  34; 23, 33). Huwa dak li ja\u0127sbu f''qalbhom u li jg\u0127idu fihom infushom
  li jindika r-re\u017cistenza u s-suppervja tag\u0127hom, anki jekk esternament qed
  jag\u0127mlu att ta'' ndiema (e\u017c. Mk 2, 6; Lq 18, 11). Huwa propju dan l-atte\u0121\u0121jament,
  flimkien mas-sigurtajiet foloz tag\u0127hom, li j\u010ba\u0127\u0127dilhom l-possibilit\u00e0
  li jilqg\u0127u bil-libert\u00e0 l-Kelma ta'' Alla u jindmu tassew. X''jurini dwari
  nnifsi l-kummentarju interjuri li nag\u0127mel fuq l-o\u0127rajn, fuq dak li ji\u0121ri,
  fuqi nnfisi? Jurini \u0127jiel ta'' suppervja?\\n\\nv. 10: Il-mannara \u0121a tressqet
  ma'' g\u0127erq is-si\u0121ra; u g\u0127alhekk, kull si\u0121ra li ma tag\u0127milx
  frott tajjeb titqa\u010b\u010bat u tinxte\u0127et fin-nar.\\n\\nHawnhekk naraw il-kontinwit\u00e0
  tal-predikazzjoni ta'' \u0120wanni ma'' dik tal-profeti. Anki g\u0127alihom, it-tqa\u010b\u010bit
  tas-si\u0121ar hija metafora tal-\u0121udizzju ta'' Alla (cf. Is 10, 33). Anki \u0120es\u00f9
  ju\u017ca din il-metafora, imma bid-differenza li hemm ukoll il-qaddej li jipperswadi
  lis-sid biex lis-si\u0121ra i\u0127alliha sena o\u0127ra (cf. Lq13, 6-9). Kuntrarju
  g\u0127al dak li kien qed jistenna \u0120wanni, il-Messija flok i\u0121ib il-\u0121udizzju
  mal-ewwel, jappella g\u0127all-pa\u010benzja tal-Missier sabiex itawwal i\u017c-\u017cmien
  tal-konver\u017cjoni.\\n\\nv. 11-12: Jien, ng\u0127id g\u0127alija, ng\u0127ammidkom
  bl -ilma g\u0127all -indiema; imma min \u0121ej warajja hu aqwa minni, u jien ma
  jist\u0127oqqlix in\u0121orr il-qorq tieg\u0127u. Hu jg\u0127ammidkom blIspirtu
  s-Santu u n-nar. Il-midra qieg\u0127da f''idu, biex iderri l-qieg\u0127a tieg\u0127u
  u ji\u0121bor ilqam\u0127 fil-ma\u0127\u017cen, imma t-tiben ja\u0127arqu b''nar
  li ma jintefiex.\\n\\nIl-kelmiet \\\"min \u0121ej warajja hu aqwa minni\\\" huma
  sinjal \u010bar li \u0120wanni nnifsu kien l-ewwel wie\u0127ed li qed jindem. Jirnexxielu
  jag\u0127raf is-saltna ta'' Alla f''xi \u0127add li \\\"\u0121ej warajh\\\" mhux
  biss f''sens kronolo\u0121iku imma wkoll, x''aktarx, f''xi \u0127add li letteralment
  miexi warajh, ji\u0121ifieri li hu dixxiplu tieg\u0127u. Huwa sinjal ta'' bidla
  ta'' mentalit\u00e0 (met\u00e0noia) g\u0127aliex umanament huwa attraenti \u0127afna
  l-\u0127sieb li min \u0121ej warajja huwa ag\u0127ar minni, l-iktar g\u0127al xi
  \u0127add b\u0127al \u0120wanni li kien fil-qu\u010b\u010bata tal-popolarit\u00e0
  tieg\u0127u. L-g\u0127arfien tal-limiti kemm ta\u017c-\u017cmien kif ukoll tan-natura
  tal-missjoni tieg\u0127u, u l-kapa\u010bit\u00e0 tieg\u0127u biex jag\u0127mel spazju
  lil \u0127addie\u0127or ji\u017cguraw l-awtenti\u010bit\u00e0 tieg\u0127u b\u0127ala
  dixxiplu ta'' Kristu. Min\u0127abba f''dan kliemu u g\u0127emilu mhumiex validi
  biss g\u0127allLhud imma g\u0127all-Insara ta'' kull \u017cmien. L-isfida ta\u010b-\u010bentralit\u00e0
  ta'' Kristu fil-missjoni tan-Nisrani hija kru\u010bjali u diffi\u010bli.\"", "\"Kopja
  Informali ta'' Sentenza\\n\\nONOR. IMHALLEF RAYMOND C. PACE\\n\\nSeduta ta'' l-20
  ta'' Ottubru, 2011\\n\\nAppell Civili Numru. 2/2011\\n\\nAvviz Numru: 004/11\\n\\nDoris
  Zammit (K.I. 259156M)\\n\\nvs\\n\\nDirettur tas-Sigurta` Socjali\\n\\nIl-Qorti,\\n\\nI.
  PRELIMINARI.\\n\\nIlli fis-26 ta'' Jannar 2011 l-Arbitru ppronunzja s-segwenti sentenza
  fl-ismijiet premessi: -\\n\\n\\\"L-Arbitru,\\n\\nMeta ssejjah l-appell dehret l-appellanti.
  Deher ukoll irrapprezentant tad-Dipartiment.\\n\\nDehret T. Belfiore, Spettur tad-Dipartiment
  tal-Frodi ta'' Beneficcji u Investigazzjoni li pprezentat ir-rapport u li gie spjegat
  lill-appellanti.\\n\\nXehdet l-appellanti.\\n\\nL-Arbitru, wara li kkunsidra c-cirkustanzi
  kollha, huwa talfehma li d-Dipartiment, anke fid-dawl li saru, ma kienx gustifikat
  fid-decizjonijiet imsemmija u ghalhekk dawn lappelli ghandhom jigu milqugha.\\n\\nRat
  ir-rikors tal-appell tad-Direttur tas-Sigurta` Socjali datat 3 ta'' Marzu 2011 fejn
  in vista tal-aggravji hemm indikati talab li din il-Qorti tirriforma u tvarja d-decizjoni
  talArbitru fl-ismijiet premessi Doris Zammit vs Direttur tasSigurta'' Socjali (004/2011)
  datata 26 ta'' Jannar 2011 u tikkonferma d-decizjoni tad-Direttur tas-27 ta'' Ottubru
  2009.\\n\\nRat li dan l-appell gie appuntat ghas-smigh ghas-seduta tal-5 ta'' Ottubru
  2011.\\n\\nRat ir-risposta tal-appell ta'' Doris Zammit datata 25 ta'' April 2011
  a fol 14 tal-process fejn issottomettiet li ddecizjoni tal-Arbitru hija gusta u
  timmerita li tigi kkonfermata.\\n\\nRat il-verbal tas-seduta mizmuma fil-5 ta''
  Ottubru 2011 fejn meta ssejjah l-appell dehret Dr. Nadya Fiott ghallappellant, rapprezentat
  minn Ivan Cilia, u Dr. Noel Camilleri ghall-appellata prezenti. Id-difensuri trattaw
  ilkaz. L-appell gie differit ghas-sentenza ghall-20 ta'' Ottubru 2011.\\n\\nRat
  l-atti kollha tal-istess kawza nkluz l-proceduri u ddecizjoni tal-Arbitru fl-ismijiet
  premessi datata 26 ta'' Jannar 2011.\\n\\nRat id-dokumenti esebiti.\\n\\nRat l-atti
  kollha l-ohra tal-kawza.\\n\\nII. KONSIDERAZZJONIJIET.\\n\\nIlli l-appellata kienet
  tiehu l-ghajnuna socjali skond applikazzjoni li saret fis-16 ta'' Marzu 2009, izda
  wara sar rapport mid-Direttorat tal-Frodi datat 9 ta'' Settembru 2009 fejn gie allegat
  li bhala benificarja m''ghadhiex titqies bhala kap tal-familja ghaliex hija kienet
  qed tghix mal-partner taghha u gie rakkomandat li jitwaqqfu b''effett immedjat ilbeneficcji
  msemmija ghaliex skond l-istess rapport kienet il-benificarja stess li ammettiet
  li kienet tghix mas-sieheb taghha.\\n\\nIlli d-Direttur informa lill-appellata b''decizjoni
  datata l-1 ta'' Ottubru 2009 li hija ma kienitx intitolata ghal tali ghajnuna supplementari
  moghija ghaliex ma rrizultax li hija kienet qed tifforma familja ghal rasha..\\n\\nIlli
  Doris Zammit appellat minn tali decizjoni fit-13 ta'' Ottubru 2009 fejn sostniet
  li hija dejjem ghexet ghal rasha u tghid li l-habib taghha qatt ma raqad id-dar
  jew ghix fiddar taghha.\\n\\nIlli jidher li saret seduta mill-Arbitru fis-26 ta''
  Jannar 2011 fejn kull ma sar kien li gie pprezentat l-istess rapport u lappellanti
  cahdet dak allegat fuqha. Wara inghatat iddecizjoni fejn gie ritenut li \\\"L-Arbitru,
  wara li kkunsidra ccirkustanzi kollha, huwa tal-fehma li d-Dipartiment, anke fid-dawl
  li saru, ma kienx gustifikat fid-decizjonijiet imsemmija u ghalhekk dawn l-appelli
  ghandhom jigu milqugha\\\".\\n\\nIlli sar appell odjern mid-Direttur tas-Servizzi
  Socjali fejn inghad li (a) d-decizjoni tal-Arbitru hija nulla ghaliex ma hijiex
  motivata; (b) fil-mertu inghad li l-versjoni talappellanti ma hijiex kredibbli anke
  ghaliex dak allegat minnha dwar l-ammont zghir ta'' hwejjeg ta'' ragel li instabu
  fil-fond taghha huwa kontradett ma'' dak indikat fl-istess rapport fejn inghad li
  kien hemm hwejjeg bizzejjed sabiex ikopru sena, u dan apparti li skond ir-rapport
  kienet lappellanti stess li ammettiet mal-investigaturi li s-sieheb taghha kien
  jghix maghha.\\n\\nIlli din il-Qorti thoss, li minkejja dak li inghad fir-risposta
  tal-appell tal-appellata, bl-ebda mod ma jista'' jinghad li ddecizjoni tal-arbitru
  hija b''xi mod motivata u certament li fiha ma jistax jinghad ghaliex id-decizjoni
  tad-Direttur ma kienitx gustifikata, u dan apparti l-fatt li jidher li d-decizjoni
  ghandha wkoll kliem nieqes. Din ma hijiex kwistjoni ta'' kemm ghandha tkun twila
  jew qasira decizjoni motivata, izda tfisser biss li decizjoni, kull decizjoni, ghandha
  tispjega b''mod semplici ghaliex il-gudikant, huwa min huwa, wasal ghad-decizjoni
  tieghu, fuq il-mertu tal-kaz quddiemu, b''mod li min jitlef ikun jaf ghaliex tilef,
  u min jirbah ikun jaf ghaliex rebah u dan fuq skorta ta'' sentenzi citati mill-appellanti
  odjern fosthom \\\"Kruger Limited vs IlKummissarju tat-Taxxa fuq il-Valur Mizjud\\\"
  A.C. \u2013 13 ta'' Lulju 2001); u \\\"Ronnie Gauci vs Direttur tas-Sigurta'' Socjali\\\"
  (A.I.C) \u2013 6 ta'' Ottubru 2010)\\n\\nIlli kif inghad fis-sentenza \\\"Maltacom
  plc vs Awtorita'' ta'' Malta dwar il-Kommunikazzjoni\\\" (A.I.C. (RCP) 26 ta'' Gunju
  2008) huwa necessarju li decizjoni jkun fiha rragunament ghaliex min iddecieda ikun
  wasal ghal tali decizjoni u din ma hijiex kwistjoni semplici li l-Arbitru naqas
  li jaghti risposta dettaljata ghal kull argument (\\\"Van de Hurk vs The Netherlands\\\"
  \u2013 Q.E, - 19 ta'' April 2004) izda li effettivament l-istess decizjoni hija
  bla motivazzjoni ghax naqset li titratta u tiddeciedi dwar dak sottomess lilha mill-partijiet.
  Anke jekk jigi kkunsidrat li certament iddecizjoni tal-Arbitru kienet tikkonsisti
  f''apprezzament ta'' provi li huwa kellu quddiemu, u din hija fid-diskrezzjoni tieghu,
  xorta wahda dan l-apprezzament ghandu jkun sostnut minn motivazzjoni kongruwa li
  turi kriterju logiku u segwit dan kif gie deciz fis-sentenzi \\\"Joseph Farrugia
  vs Direttur tas-Sigurta'' Socjali\\\" (A.I.C. \u2013 29 ta'' Jannar 2010); \\\"Anna
  Fanielli vs Direttur tas-Sigurta'' Socjali\\\" \u2013 A.I.C. \u2013 7 ta'' Frar
  2007); u \\\"Mary Bonavia vs vs Direttur tas-Sigurta'' Socjali\\\" A.I.C. (PS)  \u2013
  20  ta'' Jannar 2009).\\n\\nIlli fil-fatt fl-istess sentenza ta'' din il-Qorti kif
  presjeduta nghad li din id-decizjoni qed tittiehed fis-sens li huwa\\n\\nguridikament
  pacifiku li decizjoni ta'' tribunal amministrattiv ghandha tkun motivata sufficjentement,
  mhux biss ghax hekk tirrikjedi t-trasparenza, izda wkoll biex il-parti li titlef
  tinghata sodisfazzjon sufficjenti ghaliex it-tribunal in kwistjoni jkun wasal ghad-decizjoni
  tieghu u biex jekk ma taqbilx mad-decizjoni tieghu tista'' tappella minnha fittermini
  tal-ligi (\\\"Victor Debrincat vs Kummissjoni ghallKontroll ta'' l-Izvilupp\\\"
  \u2013 A.C. \u2013 16 ta'' Dicembru 2003).\\n\\nIlli dan ma jfissirx li decizjoni
  ghandha tindirizza kull lamentela li tkun tressqet quddiemu, izda ma hemm lebda
  dubju li f''dan il-kaz l-Arbitru ghandu d-dmir u lobbligu li jiddeciedi kwistjonijiet
  li tressqu quddiemu, kemm dawk legali u dawk fattwali b''mod li jittratta dak li
  huwa rilevanti biex il-kaz jigi gustament deciz (\\\"Avukat Pio Valletta vs il-Kummissjoni
  ghall-Kontroll ta'' lIzvilupp\\\" \u2013 A.C. \u2013 28 ta'' Gunju 2002). F''dan
  il-kuntest ma hemm l-ebda dubju li sabiex isir dan, l-istess Arbitru, u tribunal
  jew organu gudizzjarji, kwazi gudizzjarji jew amministrattivi ghandhom jikkonsidraw
  u jittrattaw il-mertu tal-kwistjoni quddiemu u dan kemm fil-kuntest tat-talba u
  lopposizzjoni li ssir kontra l-istess talba, b''dan li fil-kuntest odjern l-aggravji
  u s-sottomissjonijiet ta'' natura legali u fattwali mressqa mill-partijiet kellhom
  mhux biss jigu elenkati izda determinati u b''hekk biss jista'' jinghad li decizjoni
  f''dan il-kuntest tkun verament motivata (\\\"Dr. Alfred Sant vs Kummissarju tat-Taxxi
  Interni\\\" \u2013 A.C. \u2013 4 ta'' Marzu 2002; \\\"Agricultural Co-operative
  Limited vs Peter Axisa\\\" \u2013 A.I.C. (PS) \u2013 28 ta'' April 2004).\\n\\nIlli
  dan ghalhekk ifisser li ghalkemm ma huwiex mehtieg li jkun hemm xi motivazzjoni
  dettaljata u fil-fond, pero'' minn naha l-ohra ma jfissirx li l-mertu tal-vertenza
  ghandu jigi njorat u anke sorvolat b''deliberazzjonijiet leggeri skarsi minn motivazzjoni
  sobrija u injorar ta'' konsiderandi filprovi attenti jew tal-principji legali proposti
  (\\\"Albert Degiorgio vs Loris Bianchi et\\\" \u2013 A.I.C. (PS) \u2013 23 ta''
  Jannar 2004).\\n\\nIlli l-istess gie ritenut fis-sentenza \\\"Ronnie Gauci vs Direttur
  tas-Sigurta'' Socjali\\\" (A.I.C. (PS) \u2013 6 ta'' Ottubru 2010) fis-sens li:-\\n\\n\\\"\u2026..il-motivazzjoni
  hi ta'' essenza f''kull gudikat, mhux necessarju li din tkun wahda bilfors elaborate,
  u tista'', anzi, tkun wahda skematika, basta li minnha tkun tista'' tigi ndividwata
  r-raguni li titqieghed ghab-bazi tad-decizjoni. Ara ed ezempju d-decizjoni fl-ismijiet
  \\\"Joseph Mercieca vs Water Services Corporation\\\" Appell Inferjuri, 27 ta''
  Frar 2009. Irid jinghad illi din l-espressjoni ta'' fehma giet, sa ricentement hafna,
  abbracjata mill-Qorti tal-Appell kollegjali in re: Frank P. Borg. Limited vs Joseph
  Camilleri\\\", 28 ta'' Mejju 2010\\\".\\n\\nIlli l-istess inghad fis-sentenza \\\"Charles
  Schembri vs Direttur tas-Sigurta'' Socjali\\\" (A.I.C. (PS) \u2013 30 ta'' Jannar
  2009) fis-sens li:-\\n\\n\\\"fl-adempjiment ta'' l-obbligu tal-motivazzjoni l-gudikant
  mhux tenut li joqghod jaghmel apprezzament singolari tarrizultanzi kollha processwali
  jew punti kollha ta'' dritt izda sufficjenti li hu jindika l-elementi li fuqhom
  ikun qed jiffonda d-decizjoni tieghu\\\".\\n\\nIlli fis-sentenza \\\"Kruger Limited
  vs Il-Kummissarju tatTaxxa fuq il-Valur Mizjud\\\" (A.I.C. (PS) \u2013 13 ta'' Lulju
  2001) inghad li huwa principju bazilari li l-litigand ghandu jinghata raguni ghaliex
  il-mertu kien qed jigi deciz kif fil-fatt gie deciz. \\\"Dan mhux biss biex tigi
  assikurata ttrasparenza tal-gudizzju imam wkoll biex tkun tista'' tigi verifikata
  l-gustizzja tal-gudikat. Id-decizjoni kellha almenu tinvesti l-mertu tat-talbiet
  kif proposti u l-eccezzjonijiet ghalihom\\\".\\n\\nIlli hekk fid-decizjoni \\\"Michael
  Gatt vs l-Awtorita'' ta'' lIppjanar\\\" (A.C. \u2013 19 ta'' Novembru 2001) inghad
  li biex issir gustizzja mal-partijiet, dik it-tezi kellha tigi nvestigata sewwa
  u l-kwistjoni dibattuta bejn il-partijiet kellha tigi epurata u deciza b''motivazzjoni
  debitament studjata biex taghti sodisfazzjon anke lill-parti telliefa, u mhux tigi
  dik ittezi semplicement skartata b''zewg kelmiet. Illi dan ilprincipju jissarraf
  li l-organu li ghandu jiddeciedi huwa obbligat li mhux biss jikkonsidra l-punti
  sottomessi ghaddecizjoni tieghu, izda li jinvestigahom u jaghti decizjoni taghhom
  u mhux jisfjorahom jew jinjorahom ghaliex altrimenti dan fih innifsu jikkawza ngustizzja
  ghall-istess partijiet li ghandhom ikollhom sodisfazzjoni ghassottomissjonijiet
  taghhom u decizjoni dwar l-istess u finnuqqas ta'' l-istess l-istess decizjoni tkun
  nulla ghaliex tippekka mill-elementi ta'' smigh xieraq li jinkludi li ddecizjoni
  tkun motivata u b''hekk tkun trattat il-mertu talkaz quddiemha (\\\"Marie Louise
  Farrugia nomine vs IlKummissjoni ghall-Kontroll ta'' l-Izvilupp\\\" \u2013 A.I.C.
  (RCP) \u2013 30 ta'' Novembru 2006; \\\"Philip Micallef vs lAwtorita'' ta'' Malta
  dwar l-Ambjent u l-Ippjanar\\\" - \u2013 A.I.C. (RCP) \u2013 26 ta'' April 2007;
  \\\"Dr. Graham Busuttil vs l-Awtorita'' ta'' Malta dwar l-Ambjent u l-Ippjanar\\\"
  - \u2013 A.I.C. (RCP) \u2013 28 ta'' April 2008; \\\"Victor Borg vs lAwtorita''
  ta'' Malta dwar l-Ambjent u l-Ippjanar\\\" \u2013 A.I.C. (RCP) \u2013 31 ta'' Mejju
  2007).\\n\\nIlli sabiex jigi ccarat dak li qed jinghad f''din is-sentenza, jinghad
  li din il-Qorti qed tirritjeni li l-Arbitru u kull gudikant ghandu fl-ewwel lok
  jiehu in konsiderazzjoni l-aggravji mressqa quddiemu u jikkonsidra l-istess fid-dawl
  talargumenti migjuba mill-kontro-parti u jiddeciedi l-istess fiddiskrezzjoni tieghu
  f''dak li huma fatti, u fid-dawl tal-ligi, b''dan li jinghata additu ghal dak sottomess
  mill-partijiet quddiemu, in vista u in omagg tal-principju cerimus paribus u ta''
  smigh xieraq, li jwasslu li d-decizjoni tkun ben motivata. Dan fil-kaz odjern ma
  jidhirx li sar fiddecizjoni hawn suggetta ghal dan l-appell, u dan iktar u iktar
  meta l-aggravji kienu cari u l-eccezzjonijiet ghallistess ben impostati, li kollha
  kienu diretti lejn id-decizjoni tad-Dipartiment li rriteniet li l-appellata ma kienitx
  qed tghix fil-post li hija stess indikat li kienet qed tghix bih, punt li fid-decizjoni
  tal-Arbitru ma giex indirizzat, u dan meta tali punt kien il-mertu tal-appell kollu,
  u dan huwa iktar gravi fid-dawl tal-eccezzjonijiet imqajma mill-appellanti odjerni
  quddiemu  permezz tan-nota tal-14 ta'' Ottubru 2010 li lanqas giet indirizzata.
  Oltre minn dan din il-Qorti qed tiddeciedi, li l-Arbitru kellu jiehu in konsiderazzjoni
  il-fatti relattivi u determinanti ghall-kaz in kwistjoni, u dan jinkludi kemm dak
  favur jew kontra xi wiehed jew iktar mill-partijiet quddiemu, u dan sabiex fl-ahhar
  mill-ahhar jasal ghallkonkluzjoni tieghu, wara li jikkonsidra l-provi kollha quddiemu,
  haga li f''dan il-kaz ma saritx.\\n\\nIlli dan huwa kaz mhux ta'' kwistjoni ta''
  mankanza ta'' xi ezami profond, jew xi motivazzjoni b''mod telegrafiku, izda mankanza
  totali li l-istess Arbitru jittratta u jikkonsidra u jghati decizjoni motivata fuq
  il-punti  esposti quddiemu mill-istess partijiet b''dan li certament li bid-decizjoni
  tieghu mertu ta'' dan l-appell ma jistax jinghad li l-istess aggravi u sottomissjonijiet
  maghmula quddiemu gew b''xi mod investiti, trattati u decizi u l-konkluzjoni raggunta
  fl-istess decizjoni ma ghandha motivazzjoni jew spejgazzjoni ta'' xejn. B''hekk
  tali decizjoni tikser anke wiehed mill-principji bazilari tal-gustizzja naturali,
  u allura l-ewwel aggravju talappellanti qed jigi milqugh ghaliex il-punti in diskussjoni
  blebda mod ma jista'' jinghad li gew ezaminati u wisq inqas investiti u spjegati
  fid-decizjoni appellata b''dan li allura isegwi li l-mertu tal-appell ma giex effettivament
  ikkunsidrat u deciz. F''dan il-kaz ma hemmx wiehed x''jaghmel hlief li din il-Qorti
  tirrimanda l-atti lura lill-Arbitru ghal decizjoni motivata skond il-ligi (\\\"Philip
  Zerafa vs Direttur tas-Sigurta'' Socjali\\\" \u2013 A.I.C. (PS) \u2013 6 ta'' Ottubru
  2010); \\\"Anna Maria Cavallari vs Direttur tasSigurta'' Socjali\\\" - A.I.C. (PS)
  \u2013 6 ta'' Ottubru 2010). Dan gie kkonfermat fis-sentenzi ta'' din il-Qorti kif
  presjeduta flismijiet \\\"Natalia Aquilina vs Direttur tas-Sigurta'' Socjali\\\"
  (A.I.C. (RCP) \u2013 17 ta'' Mejju 2011.\\n\\nIII. KONKLUZJONI.\\n\\nIlli ghalhekk
  ghal dawn il-motivi, din il-Qorti, taqta'' u tiddeciedi, billi tilqa'' l-ewwel aggravju
  interpost millappellanti d-Direttur tas-Sigurta'' Socjali fir-rikors talappell tieghu
  datat 3 ta'' Marzu 2011 u ghalhekk tirrevoka u thassar id-decizjoni tal-Arbitru
  fl-ismijiet premessi datata 26 ta'' Jannar 2011 u tiddikjara l-istess bhala nulla
  u bla effett ghal kull effett u buon fini tal-ligi, u tirrinvija u tirrimanda l-atti
  lura lill-Arbitru sabiex fid-dawl tal-premess jghaddi ghad-decizjoni tieghu motivata
  skond il-ligi.\\n\\nKopja Informali ta'' Sentenza\\n\\nL-ispejjez relattivi ta\u2019
