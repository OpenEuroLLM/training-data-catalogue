  Ix-xhud xehdet kif meta kien ikun hemm bzonn li jsir xog\u0127ol minuri l-customer
  care kien jibg\u0127at g\u0127an-nies assenjati mal-Kunsill Lokali u \u010bjoe l-handyman.\\n\\nMurija
  d-dokument a fol 20, ix-xhud sostniet li qed tag\u0127raf il-firma tag\u0127ha fuqu.
  Ix-xhud sostniet li skond l-invoice kienu saru xi xog\u0127lijiet mill-imputat Raymond
  Cachia pero hija qatt ma marret tara x-xog\u0127ol. Ix-xhud sostniet li ladarba
