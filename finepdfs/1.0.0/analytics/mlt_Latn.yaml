  proposti li setg\u0127u ikunu kkunsidrati g\u0127all-pjan ta'' \u0127idma 2009-2012\\n\\n14.0
  Laqg\u0127a tal-Lokalita''\\n\\n14.1 Saret diskussjoni dwar id-data ta'' din il-laqg\u0127a.  Kien
  hemm qbil li din tkun rimandata sakemm tkun mag\u0127rufa l-allokazzjoni finanzjarja
  tal-Kunsill g\u0127assena finanzjarja 2009-2010.\\n\\n15.0 A\u0121\u0121ornament\\n\\n15.1
  Il-laqg\u0127a ntemmet fl-21.50hrs u kienet a\u0121\u0121ornata g\u0127at-tielet
  \u0126amis fix-xahar t''April 2009 fis-19.00hrs.\\n\\n___________________\\n\\n_________________\\n\\nSindku\\n\\nSegretarju\"",
  "\"QORTI TAL-MAGISTRATI (MALTA) BHALA QORTI TA'' GUDIKATURA KRIMINALI\\n\\nMAGISTRAT
  DR. AUDREY DEMICOLI\\n\\nSeduta tal-11 ta'' Novembru, 2011\\n\\nNumru. 179/2009\\n\\nPulizija\\n\\n(Spettur
  Paul Bond) vs\\n\\nHassan Ali Mohammed Abdel Raouf\\n\\nIl-Qorti;\\n\\nRat li l-imputat
  Hassan Ali Mohammed Abdel Raouf bin Ali u Fatima mwielda Risgi, mwieled Sfax it-Tunezija
  fis-27 ta'' Gunju 1982 u residenti Hal-Far limiti taz-Zurrieq (Tent Centre) li ghandu
  numru tal-karta tal-identita'' 49044(A) u gie mressaq quddiemha akkuzat talli:\\n\\nFis-27
  ta'' Frar, 2009 ghall-habta tas-2.30 ta'' fil-ghodu waqt li kien fil-post maghruf
  bhal ''The Lion Bar'' li jinsab fi Triq Efesu San Pawl il-Bahar ta daqqa ta'' ponn
  kif ukoll bi flixkun f''wicc Saviour Cassar minn Hal-Qormi u kkagunalu offizi ta''
  natura gravi cioe'' sfregju permanenti u dan skond ma'' kif iccertifika t-tabib
  Joe Scicluna MD tac-centru tassahha tal-Mosta.\\n\\nFl-istess data, hin u lok, rrezista
  bi vjolenza jew b''hebb ta'' xorta li ma'' titqiesx vjolenza pubblika, kontra PS
  935 Patrick Cassar, PC 382 Josef Paul Cardona u PC 797 Robert Tabone, li huma persuni
  nkarigati skond il-Ligi minn servizz pubbliku, fil-waqt li kienu qeghdin jagixxu
  ghall-ezekuzzjoni tal-ligi jew ta'' ordni moghti skond il-Ligi mill-Awtorita'' kompetenti.\\n\\nFl-istess
  data, hin u lok, kiser il-paci pubblika, bl-ghajjat, glied jew b''mod iehor.\\n\\nRat
  in-nota tal-Avukat Generali datata 10 ta'' Gunju 2009 (esebita a fol. 81 tal-process)
  fejn huwa deherlu li tista'' tinstab htija jew htijiet taht dak li hemm mahsub;\\n\\n(a)
  Fl-Artikoli 214, 215 u 218 tal-Kapitolu 9 tal-Ligijiet ta'' Malta ;\\n(b) Fl-Artikoli
  95 u 96 tal-Kapitolu 9 tal-Ligijiet ta'' Malta ;\\n(c) Fl-Artikolu 338(dd) tal-Kapitolu
  9 tal-Ligijiet ta'' Malta ;\\n(d) Fl-Artikoli 17, 31 u 533 tal-Kapitolu 9 tal-Ligijiet
  ta'' Malta ;\\n\\nRat li waqt l-udjenza tas-16 ta'' Novembru 2009, l-imputat ddikjara
  li huwa m''ghandux oggezzjoni li l-kaz tieghu jigi trattat bi procedura sommarja
  u deciz minn din il-Qorti filkompetenza taghha surreferita.\\n\\nSemghat il-provi;\\n\\nRat
  li d-Difiza naqset milli tipprezenta Nota ta'' Sottomissjonijiet finali entro t-terminu
  lilha koncess.\\n\\nIkkunsidrat:\\n\\nIlli l-fattispeci ta'' dan il-kaz jirrigwardaw
  glieda li sehhet fis27 ta'' Frar 2009 ghall-habta tas-2.30am, fil-fond maghruf bhala
  ''The Lion''s Bar'', fi Triq Efesu San Pawl il-Bahar fejn Saviour Cassar il-propjetarju
  tal-imsemmi bar sofra griehi ta'' natura gravi li hallew sfreggju permanenti skond
  ma'' ccertifika Dr. Joe Scicluna li xehed waqt l-udjenza tal-24\\n\\nta'' April
  2009 fejn ikkonferma l-kontenut tac-certifkat mediku minnu rilaxxjat liema certifikat
  mediku jinsab inserit a fol. 13 tal-atti processwali.   Mill-provi u senjatament
  mix-xhieda tal-vittma Saviour Cassar li xehed f''dawn il-proceduri waqt l-udjenza
  tat-12 ta'' Marzu 2009 jirrizulta li  fid-data, lok u hin in kwistjoni kien hemm
  erba'' rgiel ta'' nazzjonalita'' Gharbija qeghdin jixorbu fil-bar propjeta'' ta''
  Cassar meta f''hin minnhom wiehed minn dawn l-irgiel, li x-xhud identifika bhala
  l-imputat beda'' iwaddab il-flixken u meta huwa mar biex isiktu l-imputat xejjirlu
  daqqa ta'' flixkun u laqtu f''wiccu u tajjarlu tlett isnien. Ix-xhud indika li huwa
  rnexxielu jwaddab lill-imputat barra mill-bar u meta ghamel hekk l-istess imputat
  beda'' jaghti mal-hgiega tal-bieb u kiser l-istess hgiega ghaliex ried jerga'' jidhol
  u kompla jaghmel hekk sakemm gew ilPulizija fuq il-post u arrestaw lill-imputat.
  Saviour Cassar qal li qabel dan l-incident huwa qatt ma kien ra lill-imputat. Ix-xhieda
  ta'' Saviour Cassar giet korroborata minn Alfred Wingfield li xehed waqt l-udjenza
  tal-24 ta'' April 2009 fejn spjega li kien klijent tal-bar ta'' Cassar u li kien
  ra lillimputat ixejjer daqqa ta'' flixkun lil Saviour Cassar waqt li dan tal-ahhar
  kien qed jipprova johorgu l-barra ghaliex beda'' jaqla'' l-inkwiet. Mill-provi rrizulta
  wkoll li meta lPulizija marru fuq il-post tal-incident ghaliex kienu gew mgharrfa
  mill-Control Room li kienet inqalghet glieda filLion''s Bar, huma ltaqghu mal-imputat
  fit-triq li qalilhom li kellu argument fil-bar ghaliex hadulu l-mobile. Meta xehed
  PS 935 Patrick Cassar waqt l-udjenza tat-12 ta'' Marzu 2009 huwa kkonferma li kienu
  gew imsejha fuq il-post millControl Room u li kienu ltaqghu mal-imputat fit-triq
  waqt li kienu sejrin fuq il-post u qal li meta huma mxew wara limputat u waslu l-Lion''s
  Bar hareg sid il-bar, Saviour Cassar, li kellu griehi f''halqu u snienu neqsin u
  dan infurmahom li kien ghadu kemm gie msawwat bi flixkun mill-imputat.  Dan ix-xhud
  spjega li meta huwa prova jaghmel search fuq l-imputat dan irrezista l-arrest u
  kellu jigi mmanetjat u kien agressiv u beda'' jghajjat u jipprova jerga'' jhebb
  ghal Cassar.  Meta huwa ddahhal fil-vettura tal-Pulizija l-imputat beda'' jaghti
  bis-sieq u bir-ras malbibien u mal-hgieg tal-vettura tal-Pulizija u beda'' jipprova
  jifqa'' l-hgiega minn wara. Meta ittiehed fic-cella talGhassa tal-Qawra l-imputat
  beda'' jigri mac-cella birrankatura u jaghti b''rasu mal-bieb tac-cella fejn spicca
  sabiex qasam mohhu u l-Pulizija ghalhekk haduh ilpoliclinic tal-Mosta sabiex jigi
  kurat izda huwa rrifjuta li jinghata kura u peress li beda'' jghid quddiem it-tabib
  talpoliclinic li huwa ried joqtol lilu nnifsu l-istess tabib prepara l-karti sabiex
  l-imputat jittiehed Mount Carmel izda waqt li l-Pulizija kienu fi triqithom lejn
  Mount Carmel huwa biddel fehmtu u qal li ried  jiehu l-kura u l-Pulizija ghalhekk
  haduh l-Isptar Mater Dei sabiex isirulu l-punti f''mohhu u mbaghad haduh lura l-Ghassa
  tal-Qawra ghaliex kien lahaq ikkalma fejn imbaghad gie mressaq b''arrest il-Qorti
  l-ghada filghodu. Dan kollu gie ukoll ikkonfermat minn PS 797 Robert Tabone li xehed
  waqt l-udjenza tal-24 ta'' April 2009 u minn PC 382 Josef Cardona li xehed waqt
  ludjenza tal-11 t''Awwissu 2009. Dawn ix-xhieda qalu wkoll li l-imputat kien xurban
  u li kellhom juzaw il-pepper spray waqt li huwa kien fic-cella sabiex ma jkomplix
  iwegga lilu nnifsu.\\n\\nL-imputat ghazel li jixhed f''dawn il-proceduri waqt ludjenza
  tat-22 ta'' Lulju 2010 fejn qal li huwa kien qieghed f''bar Bugibba fejn inqalghet
  glieda u sid il-bar tefa'' lil kulhadd il-barra u meta huwa prova jkellem lis-sid
  u jispjegalu li kellu l-mobile phone ghadu gewwa l-bar ficcharger dan irrispondih
  li ma kien ser jaghtih xejn. Limputat qal li huwa beda'' miexi lejn l-Ghassa izda
  ltaqa'' mal-Pulizija fit-triq u wara li qalilhom x''gara dawn qalulu sabiex imur
  maghhom lura lejn il-Bar u wara li wiehed millPulizija hareg mill-bar wara li gablu
  l-baskett dan poggieh mal-hajt u mmanetjah u x''hin waslu l-Ghassa dahlu ficcella,
  nehhielu l-manetti, sprejjalu l-pepper spray fwiccu u tah daqqa ta'' ponn.  Huwa
  sostna li ma kienx involut filglieda li nqalghet gol-bar u cahad li kien ta daqqa
  ta'' ponn lil sid il-bar jew li beda'' jaghti bis-sieq fuq il-bibien u lhgieg tal-karozza
  tal-Pulizija jew illi rrezista l-arrest.\\n\\nIkkunsidrat:\\n\\nIlli l-Qorti tiddikjara
  mill-ewwel li m''ghandha l-ebda dubju dwar il-kredibilta'' tal-vittma Saviour Cassar
  u tal-membri tal-korp tal-Pulizija li xehdu f''dawn il-proceduri dwar l-agir tal-imputat
  fil-gurnata in dizamina. Inoltre ix-xhieda talvittma giet konfermata u korroborata
  minn xhud indipendenti li nzerta kien fil-bar u cioe'' Alfred Wingfield. Il-Qorti
  jidrilha li mix-xhieda tal-vittma kif ukoll mix-xhieda tal-membri tal-Korp tal-Pulizija
  li saret referenza ghalihom aktar il- fuq fil-korp ta'' din is-sentenza jirrizulta
  pruvat salgrad rikjest mill-ligi li l-imputat volontarjament ikkaguna griehi ta''
  natura gravi konsistenti fi sfregju pemanenti lil Saviour Cassar u li huwa rrezista
  bi vjolenza  lil Pulizija waqt li dawn kienu qed jagixxu in ezekuzzjoni tal-ligi
  kif ukoll li huwa kiser il-paci pubblika b''ghajjat u glied.\\n\\nGhal finijiet
  ta'' piena l-Qorti kkunsidrat kemm il-gravita'' tar-reati li taghhom l-imputat qed
  jinstab hati kif ukoll il-fatt li mill-atti jirrizulta li fil-mori ta'' dawn il-proceduri
  huwa rega'' kiser dufrejgh mal-gustizzja u nstab hati ta'' hsara volontarja u rezistenza
  bi vjolenza kontra Ufficjal Pubbliku u l-Qorti ghalhekk jidrilha li fic-cirkostanzi
  piena karcerarja effettiva tkun l-aktar piena idoneja.\\n\\nGhal dawn il-motivi
  u wara li rat l-Artikoli tal-ligi ndikati mill-Avukat Generali fin-nota tieghu tal-10
  ta'' Settembru 2009 u senjatament l-Artikoli 214, 215, 218, 95, 96, 338(dd),17 u
  31 tal-Kapitolu 9 tal-Ligijiet ta'' Malta l-Qorti ssib lill-imputat hati tal-imputazzjonijiet
  kollha migjuba filkonfronti tieghu u tikkundannah sentejn (2) u erba'' (4) xhur
  prigunerija.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"20 t\u2019 April 2015\\n\\nLAQG\u0126A STRAORDINARJA TAL-KUNSILL\\n\\nG\u0127a\u017ci\u017c
  Sinjur/a,\\n\\nNixtieq ninfurmak li li ha ssir Laqgha Straordinarja, li ser tin\u017camm
  ghada it-Tlieta 21 ta\u2019 April 2015 fit-5.15pm fl-Uffi\u010b\u010bju Amministrattiv
  tal-Kunsill, b\u2019din l-a\u0121enda:-\\n\\n1. Financial Statements 2014\\n\\nInti
  \u0121entilment mitlub li tkun pre\u017centi u tattendi fil-\u0127in.\\n\\nSvetlick
  Flores\\nSegretarju E\u017cekuttiv\"", "\"FIL-QORTI TAL-MA\u0120ISTRATI (MALTA)
  B\u0126ALA QORTI TA'' \u0120UDIKATURA KRIMINALI\\n\\nMA\u0120ISTRAT NATASHA GALEA
  SCIBERRAS B.A., LL.D.\\n\\nKaw\u017ca Nru: 420/2011\\n\\nIllum: 24 ta'' April, 2019\\n\\nIl-Pulizija\\n\\nvs\\n\\nAnna
  Grima (ID 598556(M))\\n\\nIl-Qorti,\\n\\nWara li rat l-imputazzjonijiet mi\u0121juba
  fil-konfront tal-imputata Anna Grima, mart Anthony, bint il-mejjet Paul u l-mejta
  Gioacchina nee\u02cb Pawney, imwielda l-Pieta\u02cb nhar is-26 ta'' Lulju 1956,
  u residenti \u0121ewwa Unit 1, Block 8, Qasam tal-Bini talGvern, (Rinella), Kalkara,
  detentri\u010bi tal-karta tal-identita` bin-numru 598556(M);\\n\\nAkku\u017cata
  talli fit-2 ta'' Ottubru 2006 \u0121ewwa l-Facilita\u02cb Korrettiva ta'' Kordin,
  Paola:\\n\\na) Kellha fil-pussess tag\u0127ha r-ra\u017ca me\u0127udha mill-pjanta
  cannabis jew xi preparazzjonijiet li jkollhom b\u0127ala ba\u017ci din ir-ra\u017ca
  u dan bi ksur tal-artikolu 8(a) tal-Kap. 101 tal-Li\u0121ijiet ta'' Malta, liema
  droga nstabet f''tali \u010birkostanzi li juru li ma kinitx g\u0127all-u\u017cu
  esklussiv tag\u0127ha;\\n\\nb) Kif ukoll talli fl-istess \u0127in, lok u \u010birkostanzi,
  ming\u0127ajr l-awtorita\u02cb le\u0121ittima, da\u0127\u0127let jew ippruvat idda\u0127\u0127al
  f''xi parti tal-konfini tal-\u0127abs medi\u010bina perikolu\u017ca skont l-Ordinanza
  Dwar il-Medi\u010bini Perikolu\u017ci, Kap. 101 talLi\u0121ijiet ta'' Malta, u dan
  bi ksur ta'' l-artikolu 7(1)(2) tal-Att Dwar il-\u0126abs;\\n\\nRat l-atti kollha
  tal-kaw\u017ca u d-dokumenti esebiti, inklu\u017c l-Ordni ta'' l-Avukat \u0120enerali
  ai termini tal-Artikolu 22(2) tal-Kapitolu 101 tal-Li\u0121ijiet ta'' Malta sabiex
  dan il-ka\u017c jinstema'' minn din il-Qorti b\u0127ala Qorti ta'' Gudikatura Kriminali;\\n\\nRat
  ukoll illi l-imputata wie\u0121bet li mhux \u0127atja tal-imputazzjonijiet mi\u0121juba
  kontra tag\u0127ha;\\n\\nSemg\u0127et lill-Prosekuzzjoni tirrimetti ru\u0127ha g\u0127all-provi
  prodotti u t-trattazzjoni finali tad-difi\u017ca.\\n\\nIkkunsidrat:\\n\\nIlli l-fatti
  fil-qosor li taw lok g\u0127al dan il-ka\u017c kienu s-segwenti: Nhar it-2 ta''
  Ottubru 2006 g\u0127all-habta tad-9.30 a.m., l-imputata marret \u0121ewwa s-sezzjoni
  tad-debituri filFa\u010bilita\u02cb Korrettiva ta'' Kordin sabiex t\u0127alli xi
  \u0127wejje\u0121 lil binha Alan Grima, li dak i\u017c-\u017cmien kien jinsab detenut
  fl-istess Fa\u010bilita\u02cb.  Waqt tfittxija li saret minn uffi\u010bjali tal-\u0127abs
  f''dawn il-\u0127wejje\u0121 u fil-presenza tal-istess imputata, instabet sustanza
  suspettata ra\u017ca tal-cannabis fil-keffa ta'' jeans li kien destinat lill-istess
  Alan Grima. L-imputata \u0121iet arrestata u rrilaxxjat \u017cew\u0121 stqarrijiet
  \u2013 wa\u0127da l-g\u0127ada fit-3 ta'' Ottubru 2006 u o\u0127ra nhar l-14 ta''
  Ottubru 2006. 1 In oltre hija xehdet ukoll quddiem l-espert tekniku, il-Prokuratur
  Legali Juliana Scerri Ferrante, ma\u0127tura mill-Ma\u0121istrat Inkwirenti fil-mori
  tal-inkjesta li saret dwar dan il-ka\u017c. 2\\n\\nFil-mori ta'' dawn il-pro\u010beduri,
  PS 1574 Renaldo Cremona xehed illi fit-2 ta'' Ottubru 2006 huwa kien assista g\u0127al
  tfittxija li kienet saret fir-residenza tal-imputata fil-Kalkara, fir-rigward ta''
  liema tfittxija, hu u l-kollegi tieg\u0127u kellhom struzzjonijiet sabiex ifittxu
  \u0127ajt ta'' kulur li kien jaqbel mal-\u0127ajt muri lilhom. Huwa jg\u0127id illi
  waqt it-tfittxija li saret fil-presenza ta'' l-imputata, kien instab min\u010bott
  \u0127ajt fuq il-bank talk\u010bina, liema \u0127ajt kien jaqbel mal-\u0127ajt lilhom
  muri u li skont hu kien ittie\u0127ed millkeffa tal-qalziet in kwistjoni.  Jg\u0127id
  ukoll illi l-min\u010bott kien \u0121ie elevat u mg\u0127oddi lill-Ispettur Investigattiv.
  3\\n\\n1 Dawn l-istqarrijiet jinsabu esebiti a fol. 13 sa 15 u a fol. 16 u 16A tal-pro\u010bess.\\n\\n2
  A fol. 61 u 62 tal-pro\u010bess.\\n\\n3 A fol. 17 sa 21 tal-pro\u010bess.\\n\\nXehdet
  ukoll WPS 237 Antonella Vella li tg\u0127id illi wara li nstabet is-sustanza \u0121ewwa
  l-qalziet fil-Fa\u010bilita\u02cb Korrettiva ta'' Kordin, hija ng\u0127atat struzzjonijiet
  ming\u0127and l-Ispettur Pierre Grech sabiex issir tfittxija g\u0127al droga fir-residenza
  ta'' Anna Grima, l-e\u017citu ta'' liema tftittxija kien fin-negattiv.  I\u017c\u017cid
  tg\u0127id illi iktar tard matul il-\u0121urnata, l-Ispettur Grech re\u0121a'' bag\u0127atha
  tag\u0127mel tfittixija o\u0127ra din id-darba ma'' PS 1574 u WPS 86,  fl-istess
  residenza, spe\u010bifikatament g\u0127all-mincott tal-\u0127ajt ta'' lewn vjola
  u dan g\u0127aliex fil-waqt illi l-jeans li fih instabet is-sustanza kien me\u0127jut
  b''\u0127ajt ta'' \u010bertu kulur, li hija ma ftakritux, il-parti fejn instabet
  id-droga kienet me\u0127juta b''kulur vjola ossia kulur differenti.  Tg\u0127id
  illi l-keffa ma kinitx kollha me\u0127juta bl-istess kulur ta'' \u0127ajt, b\u0127al
  ma lanqas ma kienet tal-istess kulur il-\u0127jata talbqija tal-qalziet.  Tg\u0127id
  illi l-affarijiet tal-\u0127jata \u0121ewwa r-residenza tal-imputata kienu mi\u017cmuma
  f''kexxun fil-bank tal-k\u010bina, fil-waqt illi WPS 86 rat min\u010bott vjola li
  kien qieg\u0127ed fuq il-bank.  Fi kliemha stess, \\\"ma kienx fil-kexxun, kien
  fuq il-bank jidher hekk\\\". 4 In kontro-e\u017cami, ix-xhud tg\u0127id illi meta
  hija u WPS 86 raw il-jeans jew ritratti tal-istess jeans innutaw illi fil-waqt illi
  l-jeans kien me\u0127jut b''\u0127ajt ta'' \u010bertu kulur, parti mill-keffa kienet
  vjola u g\u0127alhekk \u0121iethom l-idea li jer\u0121g\u0127u jfittxu firresidenza
  tal-imputata g\u0127all-\u0127ajt vjola. 5\\n\\nXehed ukoll PC 398 John Aquilina
  li jg\u0127id illi fi\u017c-\u017cmien tat-2 ta'' Ottubru 2006, huwa kien stazzjonat
  SRT \u0121ewwa l-\u0127abs, i\u017cda fil-jum in kwistjoni kien inkarigat mit-tfittxijiet
  \u0121ewwa s-sezzjoni tad-debituri, minn fejn jid\u0127lu l-effetti personali talpri\u0121unieri.
  Jg\u0127id ukoll illi g\u0127all-\u0127abta tad-9.30 a.m. tal-jum imsemmi kienet
  marret l-imputata b''xi \u0127wejje\u0121 g\u0127al binha Alan Grima, fosthom qalziet.  Jg\u0127id
  illi x''\u0127in kien qed ifittex, fil-keffa tal-istess qalziet huwa \u0127ass xi
  \u0127a\u0121a u minnha, \u0127are\u0121 pakkett \u017cg\u0127ir li sussegwentement
  g\u0127addieh lis-superjuri tieg\u0127u. 6\\n\\nPaul Borg Bonaci, gwardjan fil-Fa\u010bilita\u02cb
  Korrettiva ta'' Kordin, li xehed fil-mori talinkjesta quddiem l-espert tekniku,
  jg\u0127id illi g\u0127all-\u0127abta tad-9.15 a.m., kienet marret l-imputata bi
  \u0127wejje\u0121 g\u0127al binha Alan Grima \u0121ewwa s-sezzjoni tad-debituri.  Jg\u0127id
  li meta kien qieg\u0127ed ifittex, fil-jeans \u0127ass xi \u0121ebel fl-inforra,
  mal-qalza, u wara li ottjena awtori\u017c\u017cazzjoni ming\u0127and il-Ma\u0121\u0121ur
  Fabri, huwa \u010barrat il-keffa tal-istess qalziet, u sab bicciet u frak ta'' sustanza
  li huwa ssusspetta li kienet droga.  Jg\u0127id ukoll illi fil-frattemp, Alan Grima
  kien \u010bempel darbtejn g\u0127al jeans tieg\u0127u.  Huwa osserva wkoll illi
  s-sustanza kienet niexfa u mhux imxarrba. 7\\n\\n4 A fol. 23 tal-pro\u010bess.\\n\\n5
  A fol. 22 sa 25 tal-pro\u010bess.\\n\\n6 A fol. 29 sa 33 tal-pro\u010bess.\\n\\n7
  A fol. 59 u 60 tal-pro\u010bess.\\n\\nMir-relazzjoni tax-Xjenzat Godwin Sammut,
  ma\u0127tur fil-mori tal-inkjesta dwar dan il-ka\u017c, jirri\u017culta illi nhar
  il-15 ta'' Novembru 2006 huwa ng\u0127ata \u017cew\u0121 dokumenti minn PS 644 Evan
  Camilleri, Scene of the Crime Officer u \u010bioe\u02cb envelope kannella li fuqu
  kien hemm sticker bil-kliem ''Laboratorju Nazzjonali'' ta'' Malta Divi\u017cjoni
  Forensika Deskrizzjoni tal-Esebit Police Evidence bag bin-numru B025317 li fih envelope
  ta'' lewn kannella tal-Gvern ta'' Malta, liema envelope kien fih bi\u010b\u010biet
  \u017cg\u0127ar ta'' sustanza ta'' lewn kannella u envelope ie\u0127or \u017cg\u0127ir
  ta'' lewn kannella, flimkien  ma'' envelope ie\u0127or kannella li fuqu kien hemm
  ukoll sticker bil-kliem ''Laboratorju Nazzjonali ta'' Malta Divizjoni Forensika
  Deskrizzjoni tal-Esebit Envilop ta'' lewn kannella li fih jeans ta'' lewn blu tad-ditta
  \\\"Tom Tailor\\\".\\n\\nDwar l-ewwel dokument, ix-Xjenzat Sammut ikkonkluda illi
  mill-estratti me\u0127uda mill-bi\u010b\u010biet \u017cg\u0127ar ta'' sustanza ta''
  lewn kannella, instabet is-sustanza Tetrahydrocannabinol, sustanza li ti\u0121i
  mill-pjanta tal-cannabis. Il-pi\u017c tal-bi\u010b\u010biet \u017cg\u0127ar tas-sustanza
  kienu ta'' 0.66 grammi u l-purita\u02cb kienet ta'' \u010birka 12%.\\n\\nXehed ukoll
  fil-mori ta'' dawn il-pro\u010beduri Alan Grima, iben l-imputata, u dan fissens
  illi fi\u017c-\u017cmien in kwistjoni, huwa kien fil-Fa\u010bilita\u02cb Korrettiva
  ta'' Kordin.  Jg\u0127id illi peress illi fil-\u0127abs, kien hemm \u0127afna min
  iparla u jikxef, huwa kien ja\u0127bi d-droga fil-jeans. B''referenza g\u0127all-jeans
  li kien fil-pussess tal-imputata, huwa jg\u0127id ukoll illi bi \u017cball huwa
  kien bag\u0127tu ma'' o\u0127tu mal-\u0127wejje\u0121 ma\u0127mu\u0121in u li meta
  nduna b''dan l-i\u017cball tieg\u0127u, kien \u010bempel lill-ommu l-imputata sabiex
  ter\u0121a'' tirritornah lura.  Jg\u0127id illi lill-imputata huwa kien qalilha
  sabiex tg\u0127addihulu u te\u0127odulu lura g\u0127aliex lg\u0127ada kellu l-Qorti,
  g\u0127alkemm dan ma kienx minnu.  Jg\u0127id illi huwa kien i\u0127alli dan il-jeans
  mal-\u0127wejje\u0121 ma\u0127mu\u0121in, sabiex f''ka\u017c ta'' tfittxija ma tinstabx
  id-droga. Huwa jinsisti illi l-imputata ma kinitx taf bis-sustanza li kien hemm
  fil-qalziet u li din id-droga kien qeg\u0127da hu fil-keffa tal-qalziet.  Jg\u0127id
  illi tant dan huwa minnu, li kien \u0127alliha miftuqa u li meta l-qalziet da\u0127al
  il-\u0127abs, l-uffi\u010bjali tal-\u0127abs sabu l-keffa miftuqa.  Jg\u0127id illi
  kien huwa stess li g\u0127amel il-keffa, li kien jobromha u j\u0127itha b''labra
  u \u0127ajta \u0121ewwa l-\u0127abs.  Jer\u0121a'' jg\u0127id illi \u0121ieli kien
  jaqbad u joftoq il-keffa biex jg\u0127a\u0121\u0121el g\u0127ax mhux dejjem kien
  ikollu l-\u0127in li jag\u0127mel li jrid, u j\u0127alliha miftuqa, tant li skont
  hu, b''hekk instabet id-droga mill-uffi\u010bjali tal-\u0127abs g\u0127ax il-keffa
  kienet t\u0127alliet miftuqa minnu.  Jg\u0127id illi jaf li l-qalziet kien bil-keffa
  miftuqa x''\u0127in da\u0127al il\u0127abs g\u0127ax l-uffi\u010bjal li sab id-droga
  kien qallu b''dan.\\n\\nIkkunsidrat ukoll:\\n\\nIlli l-ewwel punt li je\u0127tie\u0121
  li tidde\u010biedi dwaru din il-Qorti huwa dwar lammissibilita\u02cb o meno ta\u017c-\u017cew\u0121
  stqarrijiet rilaxxjati mill-imputata.  G\u0127alkemm limputata ng\u0127atat is-solita
  twissija skont il-li\u0121i, dawn l-istqarrijiet \u0121ew rilaxxjati\\n\\nminnha
  fi\u017c-\u017cmien meta l-li\u0121i Maltija ma kinitx tipprovdi lill-persuna arrestata
  biddritt li tottjeni parir legali qabel l-interrogatorju tag\u0127ha u wisq inqas
  id-dritt li tkun assistita minn avukat waqt l-istess interrogatorju.  L-ewwel dritt
  \u0121ie introdott fissistema \u0121uridika Maltija permezz tal-Avvi\u017c Legali
  35/2010 li da\u0127al fis-se\u0127\u0127 fl-10 ta'' Frar 2010, fil-waqt li t-tieni
  dritt da\u0127al fis-se\u0127\u0127 fit-28 ta'' Novembru 2016, permezz tal-Avvi\u017c
  Legali 401 tal-2016.\\n\\nIl-posizzjoni legali dwar stqarrijiet rilaxxjati qabel
  id-d\u0127ul fis-se\u0127\u0127 tal-ewwel dritt fuq imsemmi llum hija wa\u0127da
  \u010bara.  Huwa suffi\u010bjenti li din il-Qorti taghmel referenza g\u0127as-sentenza
  tal-Qorti Ewropea tad-Drittijiet tal-Bniedem tat-12 ta'' Jannar 2016 fil-ka\u017c
  Mario Borg v. Malta, kif ukoll g\u0127as-sentenza tal-Qorti talAppell Kriminali
  fl-ismijiet The Republic of Malta vs Chukwudi Samuel Onyeabor tal-1 ta'' Di\u010bembru
  2016, f''liema sentenza saret referenza g\u0127al diversi sentenzi tal-Qorti Kostituzzjonali
  ossia Carmel Saliba vs Avukat Generali tas-16 ta'' Mejju 2016, Stephen Nana Owusu
  vs Avukat Generali tat-30 ta'' Mejju 2016, Malcolm Said vs Avukat Generali et tal-24
  ta'' Gunju 2016 u Aaron Cassar vs Avukat Generali et tal-11 ta'' Lulju 2016 u g\u0127addiet
  sabiex tidde\u010biedi illi \\\"the denial of the right to legal assistance at the
  pre-trial stage as a result of a systematic restriction applicable to all accused
  persons must today be held to be in violation of the conditions for the admissibility
  of an accused''s statement.\\\"\\n\\nIl-Qorti tirreferi wkoll g\u0127as-sentenza
  mog\u0127tija mill-Qorti Kostituzzjonali i\u017cjed ri\u010benti fil-5 ta'' Ottubru
  2018, fl-ismijiet Christopher Bartolo vs Avukat \u0120enerali et, f''liema ka\u017c
  fl-istqarrijiet tieg\u0127u, ir-rikorrenti minkejja li qabel irrilaxxja l-ewwel
  stqarrija, kien ing\u0127ata parir ming\u0127and l-avukat tieg\u0127u li f''dak
  l-istadju ma jg\u0127id xejn lill-pulizija, huwa xorta wa\u0127da rrisponda g\u0127ad-domandi
  waqt l-interrogatorju li sarlu, bir-ri\u017cultat li stqarr fatti li kienu inkriminanti
  g\u0127alih, in kwantu ammetta li kien jixtri d-droga kemm g\u0127all-u\u017cu personali
  tieg\u0127u, kif ukoll sabiex ibieg\u0127 minnha lil terzi. Fis-sentenza tag\u0127ha,
  il-Qorti Kostituzzjonali qalet hekk dwar l-istqarrijiet rilaxxjati mill-istess rikorrenti
  ming\u0127ajr il-jedd ta'' assistenza legali waqt linterrogatorji tieg\u0127u:\\n\\n\\\"36.
  Mill-premess jirrizulta manifest li l-istqarrijiet rilaxxjati mir-rikorrent ser
  ikollhom kif fil-fatt gja` kellhom quddiem il-Qorti Kriminali impatt fil-proceduri
  kriminali, mhux in kwantu ghall-ammissjonijiet, izda in kwantu l-kontenut taghhom
  kien ittiehed in konsiderazzjoni fil-quantum tal-piena imposta fuqu mill-Qorti Kriminali,
  u issa huwa car li anke l-Qorti tal-Appell Kriminali ser tiehu konsiderazzjoni tal-kontenut
  tal-istqarrijiet f''dan ir-rigward. Ghalhekk, ghalkemm il-proceduri kriminali ghadhom
  pendenti u ghalhekk ma jistax f''dan l-istadju jigi determinat jekk kienx hemm lezjoni
  ta'' smigh xieraq f''dawk ilproceduri, jekk listqarrijiet jithallew fil-process
  tal-proceduri kriminali, dawn wisq probabbilment ser isir uzu minnhom mill-Qorti
  tal-Appell Kriminali bi pregudizzju jew vantagg ghall-akkuzat fil-kwantifikazzjoni
  tal-piena, kemm dik karcerarja kif ukoll ghal dak li tirrigwarda l-multa li tista''
  tigi imposta.\\n\\n37. Fid-dawl tal-premess it-tehid tal-istqarrijiet zgur li ser
  ikollhom impatt fuq lezitu tal-process kriminali u, ladarba dan isir, x''aktarx
  ser isir ksur tad-dritt talrikorrent ghal smigh xieraq tenut kont tal-fatt li dawn
  gew rilaxxjati mirrikorrent flassenza ta'' avukat li jassistih. Ghalhekk huwa xieraq
  li, filwaqt li f''dan l-istadju ma jistax jinghad jekk kienx hemm lezjoni ta'' dan
  id-dritt fundamentali tar-rikorrent peress li l-proceduri kriminali ghadhom pendenti,
  dawn ma jithallewx jibqghu flinkartament tal-process kriminali.\\\" [sottolinear
  tal-Qorti]\\n\\nAllura minkejja illi r-rikorrenti f''dak il-ka\u017c, kien ing\u0127ata
  l-jedd li jikkonsulta ma'' avukat qabel l-ewwel interrogatorju tieg\u0127u u anke
  e\u017cer\u010bita dan il-jedd, il-Qorti ordnat illi l-istqarrijiet tieg\u0127u
  ma jit\u0127allewx fl-inkartament la darba kien ser ikollhom impatt fuq l-e\u017citu
  tal-pro\u010bess kriminali \u2013 f''dak il-ka\u017c, l-e\u017citu in kwantu l-piena
  u mhux in kwantu l-\u0127tija o meno tal-istess rikorrenti la darba huwa rre\u0121istra
  ammissjoni fil-pro\u010beduri \u2013 u dan stante illi ma ng\u0127atax il-jedd g\u0127all-assistenza
  legali waqt l-interrogatorji tieg\u0127u. Din kienet ukoll il-konklu\u017cjoni tal-Qorti
  tal-Appell Kriminal fis-sentenza ri\u010benti tag\u0127ha tal-20 ta'' Novembru 2018,
  fl-ismijiet Il-Pulizija vs Claire Farrugia, f''liema ka\u017c dik il-Qorti skartat
  b\u0127ala inammissibbli l-istqarrijiet tal-imputata, wa\u0127da minnhom \u0121uramentata,
  u dan g\u0127aliex g\u0127alkemm hija ng\u0127atat iddritt li tottjeni parir legali
  qabel l-istqarrijiet tag\u0127ha, madankollu hija ma ng\u0127atatx id-dritt li tkun
  assistita minn avukat waqt l-interrogatorji li sarulha u dan stante li dan id-dritt
  ma kienx g\u0127adu vi\u0121enti fi\u017c-\u017cmien in kwistjoni.\\n\\nImbag\u0127ad,
  fis-sentenza tag\u0127ha fl-ismijiet Il-Pulizija (Spettur Malcolm Bondin) vs Aldo
  Pistella tal-14 ta'' Di\u010bembru 2018, f''liema ka\u017c l-appellat kien ing\u0127ata
  l-jedd li jottjeni parir legali qabel l-interrogotarju tieg\u0127u u anke e\u017cer\u010bitah,
  i\u017cda ma ng\u0127atax il-jedd li jkun assistit minn avukat waqt dan l-interrogatorju,
  stante illi anke f''dak ilka\u017c, fi\u017c-\u017cmien in kwistjoni, dan il-jedd
  ma kienx vi\u0121enti fil-li\u0121i Maltija, il-Qorti Kostituzzjonali re\u0121g\u0127et
  irribadiet il-konklu\u017cjonijiet tag\u0127ha fis-sentenza pre\u010bedenti fl-ismijiet
  Christopher Bartolo vs Avukat \u0120enerali et:\\n\\n\\\"14.  G\u0127alkemm, b\u0127all-ewwel
  qorti, taqbel mal-appellanti illi f''dan l-istadju g\u0127adu ma se\u0127\u0127
  l-ebda ksur tal-jedd g\u0127al smig\u0127 xieraq, madankollu, kif osservat fil-ka\u017c
  ta'' Malcolm Said, il-qorti xorta hija tal-fehma li ma jkunx g\u0127aqli li l-pro\u010bess
  kriminali jit\u0127alla jitkompla bil-produzzjoni tal-istqarrija tal-akku\u017cat
  Pistella ladarba din, g\u0127allinqas f''parti minnha, ittie\u0127det ming\u0127ajr
  ma Pistella kellu l-g\u0127ajnuna ta''\\n\\navukat. G\u0127alhekk, g\u0127alkemm
  g\u0127adu ma se\u0127\u0127 ebda ksur tal-jedd g\u0127al smig\u0127 xieraq, fi\u010b-\u010birkostanzi
  huwa g\u0127aqli illi, kif qalet l-ewwel qorti, ma jsir ebda u\u017cu millistqarrija
  fil-pro\u010bess kriminali sabiex, meta l-pro\u010bess kriminali jintemm, ma jkunx
  tni\u0121\u0121es b''irregolarit\u00e0 \u2013 dik li jkun sar u\u017cu minn stqarrija
  li ttie\u0127det ming\u0127ajr ma linterrogat kellu l-g\u0127ajnuna ta'' avukat
  \u2013 li tista'' twassal g\u0127al konsegwenzi b\u0127al t\u0127assir tal-pro\u010bess
  kollu.\\\"\\n\\nF''dan il-ka\u017c, il-Qorti jidhrilha illi g\u0127alkemm l-imputata
  \u010ba\u0127det fl-istqarrijiet tag\u0127ha u fix-xhieda tag\u0127ha quddiem l-espert
  tekniku illi hija kellha x''taqsam mad-droga li nstabet fil-qalziet in kwistjoni,
  biss hija g\u0127amlet dikjarazzjonijiet li, fil-fehma talQorti, jistg\u0127u jitqiesu
  li kienu ta'' pre\u0121udizzju g\u0127aliha, b''tali mod illi kemm il-darba l-Qorti
  tie\u0127u in konsiderazzjoni tali stqarrijiet, allura dawn \u017cgur ser ikollhom
  impatt fuq l-e\u017citu ta'' dawn il-pro\u010beduri.  G\u0127alhekk il-Qorti tqis
  illi \u0121ialadarba l-imputata ma ng\u0127atatx id-dritt li tottjeni parir legali
  qabel irrilaxxjat l-istqarrijiet tag\u0127ha u qabel xehdet fil-mori tal-Inkjesta
  Ma\u0121isterjali, apparti li lanqas ma ng\u0127atat id-dritt li tkun assistita
  minn avukat waqt l-istess, tali stqarrijiet u xhieda huma inammissibbli, kif hija
  inammissibbli wkoll kwalunkwe referenza g\u0127all-istess u g\u0127aldaqstant qed
  tiskartahom.\\n\\nIkkunsidrat:\\n\\nIlli mill-assjem tal-provi prodotti ma hemmx
  dubju illi dakinhar tat-2 ta'' Ottubru 2006, l-imputata da\u0127let b''qalziet fis-sezzjoni
  tad-debituri \u0121ewwa l-Fa\u010bilita\u02cb Korrettiva ta'' Kordin, liema qalziet
  kien destinat g\u0127al binha Alan Grima, li dak i\u017c\u017cmien kien detenut
  fl-istess Fa\u010bilita\u02cb, b\u0127al ma lanqas hemm dubju illi fil-keffa talistess
  qalziet, instabet sustanza li tirri\u017culta li kienet ra\u017ca tal-cannabis.\\n\\nJirri\u017culta
  wkoll kemm mix-xhieda prodotta in dife\u017ca, kif ukoll mit-trattazzjoni finali
  tag\u0127ha, illi d-difi\u017ca m''hijiex tikkontesta s-sejbien tar-ra\u017ca tal-cannabis
  fil-qalziet in kwistjoni, i\u017cda x-xjenza tal-imputata dwar l-istess droga u
  dan fis-sens illi skont iddifi\u017ca, minkejja li hija kellha l-pussess materjali
  tal-qalziet u konsegwentement taddroga, hija ma kinitx taf illi f''dan il-qalziet,
  li ntbag\u0127at lilha minn binha g\u0127all-\u0127asil u li hija kienet qeg\u0127da
  tirritorna lura lill-istess binha, kien hemm id-droga. G\u0127aldaqstant, skont
  id-difi\u017ca, minkejja li l-element materjali jirri\u017culta, huwa nieqes fl-imputata
  l-element formali, konsistenti fl-intenzjoni tag\u0127ha li twettaq ir-reati li
  qeg\u0127din ji\u0121u lilha addebitati u li g\u0127alhekk hija ma tistax tinstab
  \u0127atja ta'' dawn irreati.\\n\\nF''dan il-ka\u017c, provi saljenti li l-Qorti
  qeg\u0127da tag\u0127tihom pi\u017c huma s-sejba u \u010b\u010birkostanzi tas-sejba
  tal-min\u010bott tal-\u0127ajt ta'' lewn vjola li, fit-tfittxija li saret firresidenza
  tal-imputata, fl-istess jum tal-arrest tag\u0127ha, instab proprju fuq il-bank talk\u010bina
  fl-istess residenza, u li l-keffa tal-qalziet in kwistjoni ukoll kienet me\u0127juta
  b''\u0127ajt ta'' lewn vjola, liema \u0127ajt in oltre jirri\u017culta li kien differenti
  mill-lewn tal-bqija tal-\u0127ajt li bih kien me\u0127jut l-istess qalziet.  Il-Qorti
  tinnota illi minkejja li ma jirri\u017cultax illi dan il-min\u010bott hekk misjub
  \u0121ie esebit fl-atti, biss kemm PS 1574, kif ukoll WPS 237 xehdu illi dan kien
  tal-istess kulur vjola b\u0127al \u0127ajt f''dik il-parti talkeffa li fiha nstabet
  id-droga.  Mhux biss i\u017cda jirri\u017culta wkoll illi fil-waqt illi laffarijiet
  tal-\u0127jata fir-residenza tal-imputata kienu jinsabu f''kexxun fil-bank talk\u010bina,
  kien proprju dan il-min\u010bott li kien qieg\u0127ed barra fuq il-bank.  Il-Qorti
  tqis illi dawn il-provi, minkejja li \u010birkostanzjali, huma skont \u0121urisprudenza
  nostrana kostanti, ammissibbli u suffi\u010bjenti g\u0127as-sejbien ta'' \u0127tija,
  kemm il-darba l-Qorti tkun sodisfatta lil hinn minn kull dubbju dettat mir-ra\u0121uni
  dwar il-\u0127tija tal-akku\u017cat, u dan in kwantu huwa ben stabbilit illi d-dubju
  g\u0127andu dejjem ji\u0121i ri\u017colt favur tieg\u0127u.\\n\\nFir-rigward ta''
  provi ta'' din il-natura, il-Qorti tal-Appell Kriminali fis-sentenza tag\u0127ha
  tal-15 ta'' Jannar 2009 fl-ismijiet Ir-Repubblika ta'' Malta v. omissis, Rida Salem
  Suleiman Shoaib, omissis qalet is-segwenti:\\n\\n\\\"Kif inhu risaput, prova indizzjarja
  fil-kamp penali tista'' tkun ferm aktar importanti minn prova diretta, izda tali
  prova ghandha dejjem tigi ezaminata bl-akbar reqqa. Il-principji li jirregolaw dan
  il-kamp tal-provi huma spjegati fi Blackstone''s Criminal Practice 2008 hekk:\\n\\n\\\"Circumstantial
  evidence is to be contrasted with direct evidence.  Direct evidence is evidence
  of facts in issue. In the case of testimonial evidence, it is evidence about facts
  in issue of which the witness claims to have personal knowledge, for example, ''I
  saw the accused strike the victim''. Circumstantial evidence is evidence of relevant
  facts, i.e. facts from which the existence or non-existence of facts in issue may
  be inferred. It does not necessarily follow that the weight to be attached to circumstantial
  evidence will be less than that to be attached to direct evidence. For example the
  tribunal of fact is likely to attach more weight to a variety of individual items
  of circumstantial evidence, all of which lead to the same conclusion, than to direct
  evidence to the contrary coming from witnesses lacking in credibility.\\n\\n\\\"Circumstantial
  evidence ''works by cumulatively, in geometrical progression, eliminating other
  possibilities'' (DPP v. Kilbourne [1973] AC 729 per Lord Simond at p. 758). Pollock
  CB, likening circumstantial evidence to a rope comprised of several cords, said:\\n\\n''One
  strand of the cord might be insufficient to sustain the weight, but three stranded
  together may be of sufficient strength. Thus it may be in circumstantial evidence
  \u2013 there may be a combination of circumstances, no one of which would raise
  a reasonable conviction, or more than a mere suspicion; but the whole, taken together,
  may create a strong conclusion of guilt, that is, with as much certainty as human
  affairs can require or admit of.'' (Exall (1866) 4 F & F 922 at p. 929). \\\"However,
  although circumstantial evidence may sometimes be conclusive, it must always be
  narrowly examined, if only because it may be fabricated to cast suspicion on another.
  For this reason, it has been said that: ''It is also necessary before drawing the
  inference of the accused''s guilt from circumstantial evidence to be sure that there
  are no other co-existing circumstances which would weaken or destroy the inference''
  (Teper v. The Queen [1952] AC 480, per Lord Normand at p. 489). Nontheless, there
  is no requirement, in cases in which the prosecution''s case is based on circumstantial
  evidence, that the judge direct the jury to acquit unless they are sure that the
  facts proved are not only consistent with guilt but also inconsistent with any other
  reasonable conclusion (McGreevy v. DPP [1973] 1 WLR 276).\\\"\\n\\nu b''referenza
  g\u0127all-mertu quddiemha esprimiet ru\u0127ha kif isegwi:\\n\\n\\\"... Din il-Qorti,
  filwaqt li hi lesta li tikkoncedi li individwalment, u cioe` jekk kull cirkostanza
  tittiehed wahedha u in izolament, kien ikun ferm difficli ghall-gurija li tasal
  ghall-konkluzjoni li waslet ghaliha, l-istess ma jistax jinghad jekk dawn iccirkostanzi
  jittiehdu fl-assjem taghhom kif ukoll flimkien ma'' xi cirkostanzi ohra li l-appellant
  ghazel li ma jirriferix ghalihom fir-rikors ta'' appell tieghu.\\\"\\n\\nFis-sentenza
  tag\u0127ha fl-ismijiet Il-Pulizija (Spettur James Grech) vs Raymond Galea tal-4
  ta'' Settembru 2018, il-Qorti tal-Appell Kriminali e\u017caminat fit-tul lammissibilita\u02cb
  u l-pi\u017c li g\u0127andu jing\u0127ata lill-provi indizzjarji u b''referenza
  g\u0127all\u0121abra ta'' sentenzi tal-qrati tag\u0127na qalet hekk:\\n\\n\\\"Illi
  jigi rilevat illi l-Qrati Maltin b''diversi sentenzi sahqu illi sabiex Qorti issib
  htija fl-imputat fuq provi indizzjarji, kull cirkostanza trid twassal ghall-istess
  konkluzjoni, u cioe'' illi l-allegat reat sar mill-imputat.\\n\\nFil-kaz Ir-Repubblika
  ta'' Malta vs Andrea Zammit moghtija nhar it-tnax (12) ta'' Jannar tas-sena elfejn
  u sittax (2016) mill-Qorti tal-Appelli Kriminali, il-Qorti kkwotat l-indirizz tal-Imhallef
  illi kien qieghed jippresjedi l-guri li tenna s-segwenti:\\n\\n\\\"Issa hemm imbag\u0127ad
  ir-raba'' tip ta'' prova li di\u0121a` ssemmiet waqt it-trattazzjoni li hija circumstantial
  evidence. [\u2026] L-importanti pero` li tibqghu tiftakru li jekk iscircumstantial
  evidence, ji\u0121ifieri serje ta'' \u010birkostanzi jistg\u0127u jwassluk g\u0127allkonklu\u017cjoni
  wa\u0127da u wa\u0127da biss allura dik hija bi\u017c\u017cejjed biex tistrie\u0127
  fuqha, anke fuqha biss biex issib il-\u0127tija. Pero` jekk is-circumstantial evidence
  ma twassalkomx g\u0127al konklu\u017cjoni wa\u0127da biss imma tista'' tag\u0127ti
  lok g\u0127al diversi konklu\u017cjonijiet, jew g\u0127all-inqas tnejn, allura ma
  tistg\u0127ux tistrie\u0127u fuqha biss biex issibu l-\u0127tija. Dik hija r-regola
  prin\u010bipali tas-circumstantial evidence. Circumstantial evidence tista'' ti\u0121i
  minn \u0127afna affarijiet.\\\"\\n\\nIlli fis-sentenza Il-Pulizija vs Joseph Buttigieg
  et moghtija nhar l-ewwel (1) ta'' Gunju tas-sena elfejn u ghaxra (2010) il-Qorti
  tal-Appelli Kriminali tenniet illi:\\n\\nDin il-Qorti kellha diversi okkazzjonijiet
  sabiex tippronuncja ruhha dwar is-sahha probattiva ta'' provi cirkostanzjali. Filwaqt
  illi dawna huma ammessi jistghu jwasslu ghall-htija jekk tirrizulta konkluzzjoni
  wahda. Jigifieri li l-provi tkun univoka.\\n\\nJohrog car mill-gurisprudenza nostrana
  illi jekk ikun hemm imqar izjed minn possibilita'' wahda illi tkun tista'' tnissel
  dubju illi l-imputat ma jkunx wettaq it-tali reat allura ma tkunx tista'' tinstab
  htija f''dak l-imputat stante'' illi il-provi cirkostanzjali iridu jwasslu ghall-konkluzzjoni
  wahda biss kif gie ritenut fil-kawza bl-ismijiet Il-Pulizija vs Michael Ellul Vincenti
  moghtija mill-Qorti tal-Appelli Kriminali nhar it-tlieta (3) ta'' Ottubru tas-sena
  elfejn u tlettax (2013):\\n\\n\\\"Hemm ukoll il-provi cirkostanzjali illi johrogu
  minn dan il-process, provi illi huma wkoll imporanti, a dirittua mpellenti ghall-prosekuzzjoni,
  li jwasslu ghal konkluzjoni wahda u wahda biss. Meta persuna tkun qieghda tikkonsidra
  sabiex taghmel reat, dina taghmel minn kollox sabiex tahbi l-operat u r-responsabilta''
  taghha ghal dak ir-reat u jista'' jkollok sitwazzjoni fejn ma jkollokx xhieda okulari
  izda jkollok diversi ndizji li kollha jwasslu ghand l-akkuzat bhala l-unika persuna
  illi seta'' kien filpozizzjoni illi jikkommetti r-reat in kwistjoni.\\\"\\n\\nDan
  gie ritenut ukoll fil-kawza bl-ismijiet The Republic of Malta vs Eduardo Navas Rios
  moghtija mill-Qorti tal-Appelli Kriminali nhar id-disgha (9) ta'' Mejju tas-sena
  elfejn u tlettax (2013):\\n\\n\\\"It has been constantly held that in order that
  circumstantial evidence may serve as a basis to convict it must first and foremost
  be narrowly examined and then in order to give weight to a circumstance or to a
  number of circumstances as proving guilt this or these must be unambiguous or unequivocal
  meaning that these must be definite or unmistakable or clearly pointing to only
  one conclusion. If circumstantial evidence may have more than one meaning then that
  circumstance or circumstances\\n\\ncannot be given any weight or consideration at
  all because although circumstances do not lie they may deceive.\\\"\\n\\nIlli kif
  kwotat il-Qorti tal-Appelli Kriminali fil-kawza Il-Pulizija vs Kyle Stone nhar l-ghoxrin
  (20) ta'' Settembru tas-sena elfejn u tlettax (2013):\\n\\n\\\"Circumstantial evidence
  \u2013 li kif qal Lord Salmon fil-kaz DPP v Kilbourne [1973] AC 729, p. 758 \\\"&
  works by cumulatively, in geometrical progression, eliminating other possibilities.\\\"\\n\\nIlli
  f''dan l-istadju wkoll issir-referenza ghall-kawza bl-ismijiet ir-Repubblika ta''
  Malta vs George Spiteri deciza mill-Qorti tal-Appell Kriminali fil-hamsa (5) ta''
  Lulju tas-sena elfejn u tnejn (2002) fejn il-Qorti sostniet is-segwenti:\\n\\n\\\"L-prova
  indizzjarja trid tkun wahda assolutament univoka, li tipponta biss minghajr dubju
  dettat mir-raguni lejn fatt jew konkluzzjoni wahda...biex prova ndizzjarja tigi
  ammessa bhala prova valida fis-sens li wiehed jista'' ragjonevolment jasal ghall-konkluzzjoni
  tieghu ta'' htija in bazi taghha bla ebda dubju dettat mirraguni, irid ikun moralment
  konvint minn dan ir-rekwizit ta'' univocita'' taghha, cioe'' li dik il-prova tfisser
  biss u xejn aktar li l-akkuzat huwa hati ta'' dak addebitat lilu w, allura, kull
  dubju ragjonevoli fir-rigward ghandu jmur favur l-akkuzat skond illigi\\\".\\n\\nInoltre
  fil-kawza bl-ismijiet Pulizija vs Paul Grech deciza mill-Qorti tal-Appell fissitta
  (6) ta'' April tas-sena elfejn u wie\u0127ed (2001) intqal illi:\\n\\n\\\"l-provi
  fil-kamp kriminali jistghu jkunu kemm diretti u kif ukoll indizjali, basta dawn
  ikunu sufficjenti biex inisslu konvinciment morali f''mohh il-gudikant lil hinn
  minn kull dubju ragjonevoli mir-reita'' ta'' l-imputat.\\\" Finalment fid-decizjoni
  talQorti tal-Appell Superjuri bl-ismijiet ir-Repubblika ta'' Malta vs Angel sive
  Angelo Bajada datata l-\u0127mistax (15) ta'' Mejju tas-sena elfejn u disg\u0127a
  (2009) gie ddikjarat illi:\\n\\n\\\"L-assjem tal-provi kien tali li a bazi tieghu
  l-gurati setghu ragonevolment u b''konvinciment morali trankwill ghall-a\u0127\u0127ar
  jaslu g\u0127all-konkluzjoni la ma jemmnux dak li qed isostni l-appellant u jsibu
  li l-provi jwasslu inekwivokabbilment ghall\u0127tija tieg\u0127u. L-indizji, biex
  jag\u0127mlu prova, je\u0127tieg li jkunu univoci\\\"...\\n\\nDwar l-evalwazzjoni
  tal-assjem tal-provi, dik l-istess Qorti rriteniet b''mod skjett illi:\\n\\n\\\"dak
  li l-gudikant irid jasal ghalih hu, li wara li jqis c-cirkostanzi u l-provi kollha,
  u b''applikazzjoni tal-buon sens tieghu, ikun moralment konvint minn dak l-fatt
  li trid tipprova l-Prosekuzzjoni.\\\"\\n\\nB''referenza g\u0127all-ka\u017c odjern,
  il-Qorti ma tqisx li kien sempli\u010biment b''koin\u010bidenza illi l-min\u010bott
  tal-istess lewn li bih kienet me\u0127juta dik il-parti tal-keffa tal-qalziet li
  fiha kien hemm id-droga, instab proprju fuq il-bank tal-k\u010bina fir-residenza
  talimputata fl-istess jum tal-arrest tag\u0127ha. G\u0127all-kuntrarju, il-Qorti
  tqis b\u0127ala determinanti g\u0127as-sejbien ta'' \u0127tija tal-imputata, il-fatt
  illi l-keffa tal-qalziet li kien fil-pussess tag\u0127ha kienet me\u0127juta proprju
  b''\u0127ajt tal-istess lewn li nstab fuq il-bank tal-k\u010bina, fil-waqt illi
  l-bqija tal-\u0127ajt tal-istess qalziet kien ta'' kulur differenti. Fi kliem ie\u0127or,
  fil-waqt li s-sejba ta'' min\u010bott vjola fir-residenza tal-imputata b\u0127ala
  fatt wa\u0127du m''huwiex determinanti, kif m''huwiex determinanti l-fatt wa\u0127du
  illi l-keffa tal-qalziet kienet me\u0127juta b''\u0127ajt ta'' lewn differenti mill-kumplament,
  dawn i\u010b\u010birkostanzi flimkien ma j\u0127allux dubju f''mo\u0127\u0127 din
  il-Qorti illi l-imputata kienet ilpersuna li po\u0121\u0121iet id-droga fl-istess
  qalziet.\\n\\nB''\u017cieda ma'' dan, il-Qorti ma tqisx ix-xhieda ta'' iben l-imputata,
  Alan Grima, b\u0127ala kredibbli jew illi din taf mis-sewwa.  Fl-ewwel lok, il-Qorti
  ma tqisx kredibbli u lanqas verosimili illi Grima kien joqg\u0127od, \u0121ewwa
  l-\u0127abs, i\u0127it il-keffa tal-qalziet sabiex fiha jqieg\u0127ed id-droga,
  imbag\u0127ad jer\u0121a'' joftoq il-keffa u jer\u0121a'' j\u0127itha, stante illi
  dan jirrikjedi \u010bertu \u0127in u anke attenzjoni g\u0127all-fatt illi huwa risaput
  illi fi\u010b-\u010belel isiru diversi tfittxijiet ta'' rutina mill-uffi\u010bjali
  tal-\u0127abs.  Fit-tieni lok, il-Qorti tiddubita wkoll kemm Grima kellu a disposizzjoni
  tieg\u0127u labar tal-\u0127jata.  In oltre il-Qorti ma tistax ma tqisx ukoll kemm
  m''huwiex lo\u0121iku dak li jg\u0127id Grima fis-sens illi huwa kien i\u0127alli
  dan il-qalziet partikolari mal-\u0127wejje\u0121 ma\u0127mu\u0121in u dan sabiex
  f''ka\u017c ta'' tfittxija b\u0127al ma ji\u0121ix innutat, meta tfittxija ssir
  f''kollox u kullimkien jew illi ''bi \u017cball'' ta lil ommu proprju l-qalziet
  li kien fih id-droga, meta skont hu, tant kien joqg\u0127od attent fejn kien iqeg\u0127du,
  apparti illi minkejja li jg\u0127id kemm il-darba illi lqalziet \u0127are\u0121
  mill-\u0127abs bil-keffa miftuqa u li da\u0127al il-\u0127abs bl-istess mod, jirri\u017culta
  \u010bar mix-xhieda ta'' Paul Borg Bonaci illi huwa kellu joftoq il-keffa tal-qalziet
  sabiex minnha jo\u0127ro\u0121 id-droga.  In oltre kemm Borg Bonaci, kif ukoll PC
  398 jg\u0127idu illi ssuspettaw li kien hemm xi \u0127a\u0121a fil-qalziet g\u0127aliex
  \u0127assew xi \u0127a\u0121a fil-keffa tieg\u0127u waqt it-tfittxija u mhux kif
  jg\u0127id Grima, g\u0127aliex il-keffa kienet di\u0121a\u02cb miftuqa.\\n\\nFid-dawl
  ta'' dawn il-kunsiderazzjonijiet, il-Qorti tqis illi la darba r-ra\u017ca tal-cannabis
  fil-qalziet kienet evidentement inti\u017ca g\u0127al Grima ossia iben l-imputata,
  isegwi ne\u010bessarjament illi l-pussess tal-istess droga da parti tal-imputata
  kien wie\u0127ed aggravat ossia ma kienx inti\u017c g\u0127all-u\u017cu tag\u0127ha
  u dan fit-termini tal-ewwel imputazzjoni.  G\u0127aldaqstant, tqis illi l-ewwel
  imputazzjoni \u0121iet sodisfa\u010bentement ippruvata fil-grad rikjest mil-li\u0121i.\\n\\nFir-rigward
  tat-tieni imputazzjoni ossia dik illi permezz tag\u0127ha, l-imputat qeg\u0127da
  ti\u0121i akku\u017cata talli da\u0127\u0127let droga \u0121ewwa l-\u0127abs ai
  termini tal-Artikoli 7(1) u (2) talKap. 260 tal-Li\u0121ijiet ta'' Malta, il-Qorti
  tqis illi l-azzjoni dwar din l-imputazzjoni kienet preskritta.  Ai termini tal-Artikolu
  7(2) tal-Kapitolu msemmi, il-piena g\u0127arreat ikkontemplat fit-tieni imputazzjoni
  hija dik ta'' pri\u0121unerija g\u0127al \u017cmien ta'' mhux inqas minn xahar u
  mhux i\u017cjed minn tmintax-il xahar u g\u0127alhekk ai termini talArtikolu 688(d)
  tal-Kap. 9, l-azzjoni kriminali dwar din l-imputazzjoni taqa'' bi preskrizzjoni
  bl-eg\u0127luq ta'' \u0127ames snin.  Jirri\u017culta mill-atti illi fil-waqt illi
  din limputazzjoni tirreferi g\u0127at-2 ta'' Ottubru 2006, i\u010b-\u010bitazzjoni
  odjerna \u0121iet ippre\u017centata fir-Re\u0121istru ta'' din il-Qorti fit-28 ta''
  Settembru 2011, u g\u0127alhekk entro t-terminu ta'' \u0127ames snin, i\u017cda
  fl-ewwel jum li fih \u0121iet appuntata l-kaw\u017ca g\u0127as-smieg\u0127 u \u010bioe\u02cb
  fit3 ta'' Frar 2012, meta allura l-perjodu ta'' \u0127ames snin kienu g\u0127adda,
  \u0121ie vverbali\u017c\u017cat illi l-imputata ma dehritx u illi l-Ispettur Pierre
  Grech nforma lill-Qorti illi ma kinitx notifikata.  Isegwi ne\u010bessarjament minn
  dan kollu, illi l-imputata ma \u0121ietx notifikata fit-terminu tal-\u0127ames snin.  G\u0127aldaqstant,
  din l-imputazzjoni tirri\u017culta preskritta.\\n\\nKunsiderazzjonijiet dwar il-Piena\\n\\nG\u0127al
  fini ta'' piena, il-Qorti kkunsidrat fl-ewwel lok, il-fedina penali tal-imputata
  fi\u017c\u017cmien tal-ka\u017c odjern, li minkejja li tikkonsisti f''numru ta''
  kundanni, biss dawn jirrisalu lkoll g\u0127as-snin sebg\u0127in.\\n\\nTqis ukoll
  in-natura u s-serjeta` tar-reat li tieg\u0127u l-imputata qed tinstab \u0127atja,
  kif ukoll i\u010b-\u010birkostanzi tal-ka\u017c, b''mod partikolari l-fatt li l-imputata
  kienet fil-pussess ta'' droga destinata g\u0127al binha meta dan kien detenut il-\u0127abs
  ossia post inti\u017c g\u0127arriforma u r-rijabilitazzjoni tal-abitanti tieg\u0127u.  Mill-banda
  l-o\u0127ra, il-Qorti qeg\u0127da tqis ukoll l-kwantita\u02cb tal-istess droga,
  li ma kinitx wa\u0127da kbira.\\n\\nTqis ukoll in oltre illi dan il-ka\u017c jirrisali
  g\u0127as-sena 2006 u li fil-ma\u0121\u0121or parti tag\u0127hom il-pro\u010beduri
  twalu g\u0127al ra\u0121unijiet imputabbli lill-Prosekuzzjoni.  Biss biss kif ing\u0127ad
  i\u017cjed il-fuq, i\u010b-\u010bitazzjoni odjerna \u0121iet intavolata kwa\u017ci
  \u0127ames snin wara li se\u0127\u0127 ilka\u017c.\\n\\nKonklu\u017cjoni\\n\\nG\u0127al
  dawn il-motivi, il-Qorti wara li rat l-Artikoli 8(a), 22(1)(a) u 22(2)(b)(i) talKap.
  101 tal-Li\u0121ijiet ta'' Malta u r-Regolament 9 tal-Le\u0121islazzjoni Sussidjarja
  101.02, qed tiddikjara l-imputazzjoni (b) preskritta u g\u0127aldaqstant qed tillibera
  lillimputata minn kull \u0127tija u piena fir-rigward tal-istess, fil-waqt illi
  qed issib lill-istess imputata \u0127atja tal-imputazzjoni (a) u tikkundannaha g\u0127all-piena
  ta'' tmien (8) xhur\\n\\npri\u0121unerija effettiva u multa ta'' tmien mija u \u0127amsin
  ewro (\u20ac850) li, bl-applikazzjoni tal-Artikolu 14(2) tal-Kap. 9 tal-Li\u0121ijiet
  ta'' Malta, tista'' tit\u0127allas mill-\u0127atja f''rati mensili u konsekuttivi
  ta'' \u0127amsin ewro (\u20ac50), bl-ewwel pagament isir fi \u017cmien xahar mil-lum,
  b''dan illi jekk il-\u0127atja tonqos milli t\u0127allas pagament wie\u0127ed il-bilan\u010b
  ji\u0121i dovut minnufih u ji\u0121i konvertit fi pri\u0121unerija skont il-li\u0121i.\\n\\nIn
  oltre ai termini tal-Artikolu 533 tal-Kap. 9 tal-Li\u0121ijiet ta'' Malta, tikkundanna
  lill\u0127atja g\u0127all-\u0127las ta'' nofs 8 l-ispejje\u017c konnessi mal-esperti
  ma\u0127tura fl-istadju talpro\u010bess verbal tal-inkjesta, u \u010bioe\u02cb nofs
  l-ispejje\u017c relatati mar-relazzjoni tal-espert ix-Xjenzat Godwin Sammut, l-ammont
  ta'' liema spejje\u017c ma jirri\u017cultax mill-atti, kif ukoll nofs l-ispejje\u017c
  konnessi mar-relazzjoni kon\u0121unta ta'' PS 36 Sergio Azzopardi u PS 644 Evan
  Camilleri, ammontanti dan in-nofs g\u0127as-somma ta'' tnax-il lira Maltin ekwivalenti
  g\u0127al sebg\u0127a u g\u0127oxrin ewro u \u0127amsa u disg\u0127in \u010bente\u017cmu
  (\u20ac27.95).\\n\\nTordna li kopja ta'' din is-sentenza tintbag\u0127at lir-Re\u0121istratur,
  Qrati u Tribunali Kriminali sabiex ji\u0121u determinati nofs l-ispejje\u017c tax-Xjenzat
  Godwin Sammut.  In oltre il-\u0127atja g\u0127andha t\u0127allas l-ispejje\u017c
  kollha fuq msemmija fi \u017cmien tliet xhur millum.\\n\\nNatasha Galea Sciberras
  Ma\u0121istrat\\n\\n8 Dan stante illi dwar is-sejba tad-droga in kwistjoni, \u0121ew
  imressqa \u017cew\u0121 persuni ossia l-imputata odjerna u binha.\""]'
