  l-Kunsilliera A. Brincat Stellini kkummentat li g \u0127 andhom ikunu b''xejn ukoll
  meta jkun hemm attivitajiet popolari organizzati mill-Kunsill.\\\".\\n1.3. Il-minuti
  tas-seduta Nru. 107 tat-22 ta'' Frar 2019, \u0121ew approvati u ffirmati bl-emenda
  t''hawn fuq. Kien hemm qbil li dawn g\u0127andhom ji\u0121u ppubblikati fis-sit
  elettroniku https://localgovernmentcms.gov.mt/en/lc/Mellieha/Pages/Publications/Minutes.aspx\\n\\n________________________________________________________________________________________________________________________________________\\n\\n2.0.
  Materji Mqajma mill-Minuti\\n\\n2.1.1. PA 5909/17 \u2013 \u017bvilupp ta'' sit konfinanti
  minn Triq \u0126alq i\u010b-\u010aawl, Triq l-I\u017cbark tal-Fran\u010bi\u017ci,
  Triq in-Nases, u Triq il-Fortizza (P/5/8/Z)\\n\\n2.1.2. Is-Sindku a\u010b\u010benna
  g\u0127all-applikazzjoni msemmija hawn fuq u qal li fit-28 ta'' Frar 2019 din \u0121iet
  trattata fil-pubbliku u approvata b''vot ta'' disg\u0127a favur u erba'' kontra.
  Wa\u0127da mill-membri ma kinitx pre\u017centi. Is-Sur J. Buttigieg qal li l-vot
  tieg\u0127u kien kontra, skont il-fehma espressa millKunsill fis-seduta pre\u010bedenti.
  Kompla jg\u0127id li din id-de\u010bi\u017cjoni ttie\u0127det minkejja li l-policy
  talPjan Lokali NWUS3 tippermetti \\\".... new hotel beds as extensions to existing
  operating hotels...\\\" , filwaqt li l-Policy FL-GNRL\u20131 fil-Partial Review
  of Subsidiary Plans approvat f''Jannar 2013 tikklassifika l-Mellie\u0127a b\u0127ala
  \u017cona turistika u allura l-inklu\u017cjoni ta'' lukanda fli\u017cvilupp propost
  tqies b\u0127ala a\u010b\u010bettabbli. Is-Sindku qal ukoll li l-Partial Review
  jg\u0127id ukoll illi \\\"...proposed development would not create an environment
  which goes diametrically against the thrust of the local plan policy.\\\". F''dawn
  i\u010b-\u010birkostanzi huwa jara li hemm lok ta'' kontestazzjoni fil-mod li \u0121ew
  interpretati l-policies li msemmija.\\n2.1.3. Il-Kunsill innota t-tag\u0127rif mog\u0127ti
  u kien tal-fehma li g\u0127andu jkompli jiddiskuti\u0127 fid-dawl talkonsultazzjonijiet
  li je\u0127tie\u0121 isiru u l-iskadenzi li japplikaw.\\n\\n2.2.1. Pro\u0121ett
  pilota dwar l-latrini pubbli\u010bi (\\n\\nL/3/Vol III)\\n\\n2.2.1. Is-Sindku rrefera
  g\u0127all-minuti 5.5.3. u 5.5.4. tas-seduta ta'' qabel u g\u0127arraf li huwa tkellem
