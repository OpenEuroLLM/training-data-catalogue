  a\u0127jar ma jid\u0127olx g\u0127al laqg\u0127a g\u0127ax jekk jag\u0127mel dan,
  Nikki Dimech kien se jmur jg\u0127id li tah il-flus. G\u0127alhekk biex jipprote\u0121i
  r-reputazzjoni tieg\u0127u x-xhud g\u0127a\u017cel li ma jattendiex g\u0127al laqg\u0127a.
  Raymond Cachia kien barra l-karozza u filkarozza kien hemm Nikki Dimech u Joven
