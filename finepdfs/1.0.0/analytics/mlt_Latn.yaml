sample: '["\"\u010aIRKULARI\\n\\nData: 13 t'' Ottubru 2020                                                                             Ref:
  DDLTS 39/2020\\n\\nG\u0127al: Kapijiet tal-Iskejjel Medji u Sekondarji tal-Istat
  u Sezzjonijiet\\n\\nMinn: Is-Sur Omar Seguna \u2013 Uffi\u010bjal Edukattiv g\u0127al-Litteri\u017cmu
  Di\u0121itali\\n\\nSu\u0121\u0121ett:  Sapport fit-tag\u0127lim permezz tat-teknolo\u0121ija\\n\\n_________________________________________________________________________________\\n\\nDin
  l-informazzjoni hija g\u0127all-attenzjoni tal-istaff.\\n\\nId-Direttorat tal-Litteri\u017cmu
  Di\u0121itali u \u0126iliet Transversali huwa kommess li jkompli jassisti lilledukaturi
  fl-u\u017cu tat-teknolo\u0121iji bil-\u0127sieb li jg\u0127innhom jindirizzaw l-isfidi
  li jkollhom.  \u0126afna edukaturi qed jistaqsu dwar l-u\u017cu tal-Microsoft Teams,
  fosthom kif to\u0127loq standard u private channels, kif tag\u0127ti xog\u0127ol
  g\u0127ad-dar permezz tal-assignment feature u kif tu\u017ca l-class notebook.\\n\\nB\u0127alissa
  qed nag\u0127tu g\u0127ajnuna b''mod di\u0121itali u l-edukaturi huma m\u0127e\u0121\u0121a
  li jibag\u0127tu ittr\u00e8 lit-tim tag\u0127na jekk isibu xi diffikulta'' jew ikunu
  jixtiequ jintegraw it-teknolo\u0121iji fit-tag\u0127lim tag\u0127hom sabiex jil\u0127qu
  a\u0127jar l-g\u0127anijiet edukattivi tag\u0127hom.\\n\\nL-istaff tag\u0127na jista''
  ji\u0121i kkuntatjat kif \u0121ej:\\n\\nG\u0127alliema tas-sapport\\n\\n- Kulle\u0121\u0121
  t''G\u0127awex u 6 th Form t''G\u0127awdex - Sa Maureen Sciberras,\\nfirstname.lastname@example.org\\n-
  Kulle\u0121\u0121 Maria Regina, 6 th Form Malta - Sur Andrew Mallia, email@example.com\\n-
  Kulle\u0121\u0121 Mikiel Anton Vassalli - Sur Andrew Mallia, firstname.lastname@example.org\\n-
  Kulle\u0121\u0121 Santa Klara - Sur Joseph Micallef, email@example.com\\n- Kulle\u0121\u0121
  San Gorg Preca - Sur Andre Bugeja, firstname.lastname@example.org\\n- Kulle\u0121\u0121
  Santa Tere\u017ca - Sur Andre Bugeja, email@example.com\\n- Kulle\u0121\u0121  San
  Nikola- Sur Jason Bugeja, firstname.lastname@example.org\\n- Kulle\u0121\u0121 Santa
  Margerita- Sur Jason Bugeja, email@example.com\\n- Kulle\u0121\u0121 Sant Injazju-
  Sur Mark Briffa, firstname.lastname@example.org\\n- Kulle\u0121\u0121 San Benedittu
  - Sa Maureen Sciberras, email@example.com\\n- Kulle\u0121\u0121 San Tumas More -
  Sur Joseph Micallef, firstname.lastname@example.org\\n\\n\u010aentru g\u0127al-Litteri\u017cmu
  Di\u0121itali (MEDE) | t: 2598 1563/4/5 | e: email@example.com | w: www.education.gov.mt\\n\\nKapijiet
  tad-Dipartiment tad- DDLTS:\\n\\n- Kulle\u0121\u0121 t''G\u0127awex u 6 th Form
  t''G\u0127awdex Sur Mario Xerri, firstname.lastname@example.org\\nKulle\u0121\u0121
  Mikiel Anton Vassalli\\n- Kulle\u0121\u0121 Maria Regina, 6 th Form Malta, u Sa
  Michelle Borg, email@example.com\\n- Kulle\u0121\u0121 Sant Injazju u Kulle\u0121\u0121
  Santa Klara Sa Graziella Brincat, firstname.lastname@example.org\\n- Kulle\u0121\u0121
  Santa Tere\u017ca u Kulle\u0121\u0121 San Gorg Preca Sa Lourdes Micallef, email@example.com\\n-
  Kulle\u0121\u0121 San Tumas More u Kulle\u0121\u0121 San Nikola Sur Stefan Scerri,
  firstname.lastname@example.org\\n- Kulle\u0121\u0121 Santa Margerita u Kulle\u0121\u0121
  San Benedittu Sur Andrew Calleja, email@example.com\\n\\n\u017bur https://digitalliteracy.skola.edu.mt/
  g\u0127al iktar tag\u0127rif.\\n\\nIs-Sur Grazio Grixti Direttur Direttorat g\u0127al-Litteri\u017cmu
  Di\u0121itali u \u0126iliet Transversali\\n\\n\u010aentru g\u0127al-Litteri\u017cmu
  Di\u0121itali (MEDE) | t: 2598 1563/4/5 | e: firstname.lastname@example.org | w:
  www.education.gov.mt\"", "\"TRIBUNAL GHAL TALBIET ZGHAR\\n\\nGUDIKATUR RAPHAEL FENECH
  ADAMI\\n\\nSeduta tat-13 ta'' Jannar, 2009\\n\\nTalba Numru. 476/2008\\n\\nGO Plc
  - C-22334\\n\\nVs\\n\\nSimone Arab Palmier\\n\\nIt-Tribunal,\\n\\nRa l-Avviz fl-ismijiet
  premessi li gie prezentat fl-24 ta` Gunju, tas-sena 2008 fejn intalab sabiex il-konvenuta
  tigi kkundannata thallas lis-socjeta` attrici s-somma ta` \u20ac1,057.12c, rapprezentanti
  ammont li ghadu dovut in konnessjoni ma` servizz tat-telefon bin-numru 21378964,
  skond ma` kif jirrizulta mid-dokumenti annessi ma` dan lavviz u mmarkati bhala Dok.
  A u Dok. B.\\n\\nBl-ispejjez u bl-imghaxijiet mid-data tal-prezentata ta` dan l-avviz
  kontra l-konvenuta ngunta in subizzjoni.\\n\\nGie notat illi l-konvenuta ghalkemm
  legalment notifikata baqghet ma pprezentat ebda risposta in kontestazzjoni ghat-talba
  attrici.\\n\\nGie notat ukoll li l-konvenuta naqset illi tidher kemm fisseduta tat-28
  ta` Novembru, 2008 u kif ukoll ghas-seduta ta` llum.\\n\\nSema` lid-Dottoressa Dr.
  Ingrid Zammit Young li bilgurament taghha kkonfermat li l-ammont mitlub f`dina lkawza
  kien ghadu dovut sa l-gurnata ta` llum peress illi filmori ta` l-istess proceduri
  ma saru ebda pagamenti.\\n\\nIt-Tribunal ghalhekk qieghed jaqta` u jiddeciedi dan
  il-kaz billi jilqa` t-talba attrici u konsegwentement jikkundanna lil konvenuta
  sabiex thallas lis-socjeta` attrici s-somma mitluba ta` \u20ac1,057.12c, bl-imghaxijiet
  legali dekorribbli mid-data tal-prezentata ta` l-odjern avviz u bl-ispejjez kollha
  ta` din l-istanza a karigu ta` l-istess konvenuta.\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"QORTI TAL-MAGISTRATI (MALTA) BHALA QORTI TA'' GUDIKATURA KRIMINALI\\n\\nMAGISTRAT
  DR. SAVIOUR DEMICOLI\\n\\nSeduta tal-21 ta'' Mejju, 2010\\n\\nNumru 112/2010\\n\\nIl-Pulizija
  (Spettur James Grech)\\n\\nvs\\n\\nBRADEN GRIXTI\\n\\nIl-Qorti,\\n\\nRat l-imputazzjonijiet
  li permezz taghhom Braden Grixti ta'' 16 \u2013il sena bin missier mhux maghruf
  u Vincenza Grixti, imwieled Pieta fis-26/02/1993, risidenti 25, Triq lArgotti, Floriana
  u detentur tal-karta ta'' l-identita binnumru 104393M\\n\\nGie akkuzat talli nhar
  l-14 ta'' Frar 2010 ghal habta tas1430hrs gewwa l-bini tal-Qorti, Valletta,\\n\\n1.
  attakka jew ghamel rezistenza bi vjolenza jew b''hebb, ta'' xorta li ma titqiesx
  vjolenza pubblika, kontra PS 1444 Kenneth Brignano u PC 432 Sandro Mamo u cioe''
  persuni inkarigati skond il-ligi minn servizz pubbliku, filwaqt li kienu jagixxu
  ghall-esekuzzjoni tal-ligi jew ta'' ordni moghti skond il-ligi mill-awtorita` kompetenti
  u kkaguna offizi ta'' natura gravi fuq PS 1444 Kenneth Brigano,\\n2. u aktar talli
  fl-istess data, hin, lok u cirkostanzi ingurja, jew hedded, jew ghamel offiza fuq
  il-persuna ta'' PS 1444 Kenneth Brigano u PC 432 Sandro Mamo u cioe, persuni inkarigati
  skond il-ligi minn servizz pubbliku, waqt li kienu jaghmel jew minhabba li jkun
  ghamel dan isservizz, jew bil-hsieb li jbezzghu jew li jinfluwixxi fuqu kontra l-ligi
  fl-esekuzzjoni ta'' dak is-servizz,\\n3. bil-hsieb li jaghmel delitt ta'' offiza
  gravi fuq ilpersuna ta'' PS 1444 Kenneth Brigano u PC 432 Sandro Mamo u cioe'' persuni
  inkarigati skond il-ligi minn servizz pubbliku, wera'' dan il-hsieb b''atti esterni
  u ta bidu ghallesekuzzjoni tad-delitt liema delitt ma giex esegwit minhabba xi haga
  accidentali u indipendenti mill-volonta tieghu.\\n4. u aktar talli fl-istess zmien
  u cirkostanzi hebb ghal Ps 1444 Kenneth Brignano u PC 432 Sandro amo sabiex jingurjhom,
  idejjaqhom u/ jew jaghmmillhom hsara,\\n5. u aktar talli fl-istess zmien u cirkostanzi
  ingurja u/ jew hedded lil PS 1444 Kenneth Brignano u PC 432 Sandro Mamo,\\n6. u
  aktar talli ghamel reat waqt perijodu operattiv ta'' Probation Order imposta fuqu
  nhar il-21 ta'' Mejju 2008 mill-Qorti tal-Magistrati kif preseduta mill-Magistrat
  Dr. A.J. Vella;\\n\\nSemghet provi.\\n\\nRat l-atti u d-dokumenti esebiti.\\n\\nRat
  l-artikoli mibghuta mill- Avukat Generali fin- Nota ta'' Rinviju tieghu datata 11
  ta'' Mejju, 2010 u nnutat li limputat Braden Grixti m''ghandux oggezzjoni li l-kaz
  tieghu jigi trattat bi procedura sommarja.\\n\\nInnutat li fis- Seduta tallum l-imputat
  iddikjara li hu hati talakkuzi kollha migjuba kontra tieghu.\\n\\nIl-Qorti wissiet
  lill-imputat bl-aktar mod solenni rigward ilkonsegwenzi tal-ammissjoni tieghu u
  taghtu ftit taz-zmien sabiex jiddeciedi jekk jikkonfermax l-ammissjoni tieghu jew
  le, u wara li gie mistoqsi jekk jikkonfermax lammissjoni tieghu jew le, l-imputat
  wiegeb li hu hati talakkuzi kollha migjuba kontra tieghu.\\n\\nInnutat li fil-Verbal
  tas-Seduta tallum l-Ufficjal Prosekutur, b''referenza ghall- linji (a) u (c) li
  jirrigwardaw artikoli mibghuta fin- Nota tar-Rinviju tal-Avukat Generali datata
  11 ta'' Mejju, 2010, iddikjara li f''din il-kawza japplika dak previst fl-artikolu
  216 tal-Kap. 9 tal-Ligijiet ta'' Malta u mhux l-artikolu 218 tal-Kapitolu 9 tal-Ligijiet
  ta'' Malta indikat fl-imsemmija Nota ta'' Rinviju tal-Avukat Generali. Inoltre l-istess
  Ufficjal Prosekutur iddikjara li l-artikoli indikati fil-linja (f) li tirrigwarda
  artikoli mibghuta flimsemmija Nota ta'' Rinviju tal-Avukat Generali ma'' japplikawx
  fil-kawza odierna.  L-istess Ufficjal Prosekutur, b''referenza ghall-linja (h) li
  tirrigwarda artikoli mibghuta flimsemmija Nota ta'' Rinviju tal-Avukat Generali
  talab li lQorti rigward tali linja (h) tal-imsemmija Nota ta'' Rinviju tal-Avukat
  Generali taghti Provvediment taht l-artikolu 383 tal-Kapitolu 9 tal- Ligijiet ta''
  Malta.  L-istess Ufficjal Prosekutur, b''referenza ghall- linja (i) li tirrigwarda
  artikoli mibghuta fin-Nota tar-Rinviju tal-Avukat Generali datata 11 ta'' Mejju,
  2010, peress illi f''din il-kawza ma gewx inkorsi spejjes a tenur tal-artikolu 533
  tal-Kapitolu 9 talLigijiet ta'' Malta u lanqas ma japplika dak previst fl-artikoli
  532A u 532B ukoll citati mill- Avukat Generali fil-linja (i) tal-imsemmija Nota
  ta'' Rinviju tal- Avukat Generali, talab li l-Qorti tastjeni milli tiehu konjizzjoni
  ulterjuri tal-imsemmija talba maghmula fl-imsemmija Nota ta'' Rinviju tal-Avukat\\n\\nGenerali
  a tenur tal-artikolu 533 tal- Kapitolu 9 tal-Ligijiet ta'' Malta u ukoll tastjeni
  millu tiehu konjizzjoni ulterjuri talartikoli 532A u 532B tal-Kapitolu 9 tal-Ligijiet
  ta'' Malta.\\n\\nSemghet trattazzjoni dwar il-piena.\\n\\nRat l-artikoli 96(a),
  214, 215, 216, 95, 41(1), 338(dd), 338(ee), 339(1)(b), (d), (e) u (i), 383, 17,
  30, 31 u 37 talKapitolu 9 tal-Ligijiet ta'' Malta u l-artikoli 7(1) u 22 talKapitolu
  446 tal-Ligijiet ta'' Malta.\\n\\nIssib lill-imputat Braden Grixti, fuq ammissjoni,
  hati talakkuzi kollha migjuba kontra tieghu u tenut kont iccirkostanzi kollha tal-kaz
  inkluzi minn naha l-wahda li filkaz tal-imsemmi imputat japplika dak previst fl-artikolu
  37 tal-Kapitolu 9 tal-Ligijiet ta'' Malta u minn naha l-ohra lgravita'' tal-kaz
  odiern u l-fedina penali tal-imputat, tikkundanna lill-imputat Braden Grixti ghall-piena
  komplessiva ta'' sitt (6) xhur prigunerija u erba'' mija sitta u sittin Euro (Euro
