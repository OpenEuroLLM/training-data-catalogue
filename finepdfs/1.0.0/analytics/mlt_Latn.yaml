  E\u017cekuttiv C. Debono rre\u0121istra l-minuti, filwaqt li s-seduta \u0121iet
  tra\u017cmessa direttament bl-internet.\\n\\nTalba\\n\\nIt-talba ntqalet mis-Sindku
  J. Buttigieg.\\n\\n1.1. Minuti\\n\\n1.2. Il-Kunsillieri J. Attard u A. Brincat Stellini
  rreferew g\u0127all-minuta 5.5.3. (Ref: L/3/Vol III) u talbu li din tinqara kif
  \u0121ej:\\n\\\"5.5.3. Il-Kunsillier J. Attard u E. Bartolo qalu li huma ma jaqblux
  illi l-u \u017c u tal-latrini jkun bil\u0127 las g \u0127 all-anzjani fil-ka \u017c
