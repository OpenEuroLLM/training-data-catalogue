  ta'' Santa Marija.\\n5.1.4. Wara aktar diskussjoni, il-Kunsill qabel mal-proposta
  mressqa minn GreenPak, i\u017cda lpo\u017cizzjoni g\u0127andha ti\u0121i riveduta
