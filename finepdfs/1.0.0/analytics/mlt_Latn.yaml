  ta'' April 2019.\\n4.6.3. Il-Kunsill approva t-talba.\\n\\n4.7.1. Speed Humps fi
  Triq il-Birwina u Triq il-Qortin (T/3/2/Vol XV)\\n\\n4.7.2. Saret referenza g\u0127al
  petizzjoni ffirmata minn seba'' firmatarji sabiex isiru speed humps fit-toroq imsemmija.\\n4.7.3.
  Il-Kunsill kien tal-fehma li g\u0127andha ssir rakkommandazzjoni sabiex issir speed
