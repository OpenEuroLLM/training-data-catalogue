  li n\u0127ar\u0121u minn Nicholas Dimech bejn Frar u \u0120unju tas-sena 2010 liema
  dokument \u0121ie mmarkat DOK RM2.\\n21. Stqarrija tal-imputat Raymond Cachia tal-11
  ta'' Jannar 2011 fejn fiha l-imputat sostna li huwa ja\u0127dem fil-construction
  u kellu Tender mal-Kunsill Lokali Sliema fi \u017cmien Robert Arrigo u Marina Arrigo.
  Huwa ikkonferma li bejn April 2009 u Marzu 2010 g\u0127amel xi xog\u0127ol ta''
  tiswijiet ta'' bankini, tne\u0127\u0127ija ta'' debris, tindif f''post fi Triq il-Kbira
  u tiswija ta'' drena\u0121\u0121 fl-istess post mill-Kunsill Lokali Sliema. Huwa
  kkonferma li g\u0127al dan ix-xog\u0127ol kien fadallu jie\u0127u l-ammont ta''
  \u20ac1091.50c\\n\\nStqarr li lil Nikki Dimech jafu g\u0127ax kien ikun ma Robert
  Arrigo. Kien ilu jafu xi sentejn u nofs u anke g\u0127enu fil-kampanja tal-Kunsill
  Lokali. Sostna li Nikki Dimech qatt ma talbu flus. Sostna wkoll li huwa qatt ma
  ta'' flus lil Nikki Dimech.\\n\\nSostna li f''Lulju 2010 Nikki Dimech kien silfu
  l-ammont ta'' \u20ac500 u f''Novembru 2010 kien silfu \u20ac850 o\u0127ra. Qabel
  il-Milied tal-2010 kien silfu \u20ac400. Il-ftehim kien li huwa j\u0127allsu meta
  jit\u0127allas mill-Kunsill Lokali Sliema.\\n\\nSostna li huwa g\u0127adda c-cheque
  li kien ir\u010bieva mill-Kunsill Lokali Sliema fl-ammont ta'' \u20ac1115.10c datat
  21 ta'' April 2010 lil Nikki Dimech g\u0127aliex huwa kellu jag\u0127tih xi \u0127a\u0121a
  mill-flus li kien silfu u kien tah id-differenza b''\u010bekk tal-APS.\\n\\n22.
  Stqarrija tal-imputat Raymond Cachia tat-12 ta'' Jannar 2011 fejn fiha sostna li
  flistqarrija tal-11 ta'' Jannar 2011 huwa ma kienx qal il-verit\u00e0 b''mod partikolari
  rigward i\u010b\u010bekk li kien ir\u010bieva mill-Kunsill Lokali Sliema fl-ammont
  ta'' \u20ac1115.10c datat 21 ta'' April 2010.\\n\\nHuwa sostna li wara li \u0121abar
  i\u010b-\u010bekk huwa kien iffirmah fuq wara u g\u0127addih lis-Sindku ta'' tas-Sliema
  Nikki Dimech. Huwa sostna li g\u0127amel hekk g\u0127aliex huwa kien spi\u010b\u010ba
  bla xog\u0127ol.\\n\\nKien jaf li tas-sanita'' kienu ilhom \u017cmien jirrapurtaw
  dwar dar antika \u0127dejn Joinwell f''TasSliema li wara li waqg\u0127alha s-saqaf
  spi\u010b\u010bat mi\u017cbla. Il-Kunsill ta'' tas-Sliema ma kienx \u0127a azzjoni
  u xi \u0127add irraporta lill-Partit Nazzjonalista dwar dan. Huwa jaf li mill-Partit
  Nazzjonalista kienu ssu\u0121\u0121erew lis-Sindku Nikki Dimech li dan ix-xog\u0127ol
  jag\u0127mlu hu u dan min\u0127abba li dak i\u017c-\u017cmien ftit li xejn kellu
  xog\u0127ol.\\n\\nDan ix-xog\u0127ol kien stmah Lm1500. Min\u0127abba li direct
  order ting\u0127ata sa massimu ta'' Lm500, huwa qasam dan ix-xog\u0127ol fi tlett
  stimi.\\n\\nJaf li dawn l-istimi \u0121ew diskussa mill-Kunsill Lokali Sliema u
  g\u0127al \u0127abta ta'' Novembru 2009 ing\u0127ata dan ix-xog\u0127ol. Huwa kien
  \u0121ej u sejjer il-Kunsill Lokali Sliema u meta beda dan ix-xog\u0127ol, Nikki
  Dimech talbu sabiex l-ewwel \u010bekk li jin\u0127ari\u0121lu fuq dan ix-xog\u0127ol
  kellu jg\u0127addih lilu b\u0127ala ringrazzjament talli g\u0127addilu dan ix-xog\u0127ol.
  Raymond Cachia a\u010b\u010betta li jag\u0127tih l-ewwel \u010bekk.\\n\\nHuwa kien
  fadallu jie\u0127u l-kumplament tal-\u0127las u g\u0127alhekk g\u0127al dan ix-xog\u0127ol
  huwa ma da\u0127\u0127al xejn. Huwa ikkonferma pero li Nikki Dimech verament kien
  silfu xi flus bla img\u0127ax u kien g\u0127adu ma tah xejn minnhom.\\n\\nHuwa sostna
  li ddispja\u010bih ta'' dak li g\u0127amel.\\n\\n23. Stqarrija ta'' Raymond Cachia
  tas-19 ta'' Jannar 2011 fejn fiha sostna li huwa kunsillier fil-Kunsill Lokali ta''
  San \u0120iljan u ja\u0127dem fil-kostruzzjoni. Sostna li huwa jaf lil Patrick Pace
  u li g\u0127andu n-numru tat-telephone \u010bellulari tieg\u0127u li huwa 79230284.
  Ikkonferma li g\u0127andu Peugeot 106 u sostna li min-number plate tag\u0127ha kulma
  jaf huma n-numru li huwa 794. Sostna li Joevin Hall huwa \u0127abib tieg\u0127u.\\n\\nMistoqsi
  jekk huwiex veru li fit-3 ta'' Novembru 2010, waqt li Patrick Pace kien die\u0127el
  g\u0127al laqg\u0127a tal-Kunsill Sliema huwa waqfu  u irrikattah li jekk kien se
  jid\u0127ol g\u0127al dik illaqg\u0127a, Nikki Dimech kien se jimmalafamah man-nies
  li kien g\u0127addielu xi \u010bekkijiet b\u0127ala commissions, l-imputat Raymond
  Cachia sostna li lil Patrick Pace huwa kien informah li Nikki kien qallu biex ma
  jid\u0127olx g\u0127al laqg\u0127a g\u0127ax kien hemm xi \u010bekkijiet u dwar
  dan ma kienx se jeg\u0127req wa\u0127du u kien se jxandru ma kul\u0127add fuq i\u010b-\u010bekkijiet.\\n\\nSostna
  li l-g\u0127an ta'' Nikki Dimech kien li g\u0127al dik il-laqg\u0127a tal-Kunsill
  Sliema tat-3 ta'' Novembru 2010 ma jkunx hemm quorum u ma ssirx, i\u017cda l-laqg\u0127a
  xorta wa\u0127da saret.\\n\\nIlli in sostenn tal-imputazzjonijiet mi\u0121juba kontra
  l-imputat, id-Difi\u017ca filwaqt li g\u0127amlet diversi kontro-e\u017camijiet
  lix-xhieda mressqa mill-prosekuzzjoni ressqet is-segwenti xhieda u provi:\\n\\n1.
  L-Imputat Raymond Cachia xehed kif qabel l-2010 huwa kien di\u0121\u00e0 ilu ja\u0127dem
  malKunsill Lokali Sliema g\u0127al xi erba'' jew \u0127ames snin permezz ta'' tender
  fejn huwa kien jag\u0127mel il-maintenance kollu li kien ikun hemm b\u017conn u
  li kien jinvolvi xog\u0127ol \u017cg\u0127ir. Xog\u0127ol kbir huwa ma kienx ja\u0127dem.\\n\\nFuq
  dan l-in\u010bident, ix-xhud isostni li kien \u010bempillu Daniel Micallef skrivan
  li kien ja\u0127dem mal-Kunsill Lokali Sliema u talbu biex jag\u0127mel bi\u010b\u010ba
  xog\u0127ol g\u0127aliex il-Kunsill Lokali kien qed ikollu \u0127afna complaints.
  Ix-xhud sostna li huwa mar jara x-xog\u0127ol. Dan ixxog\u0127ol kellu jsir \u0121o
  dar ma tintu\u017cax li kellha l-bibien u t-twieqi miftu\u0127in u kul\u0127add
  kien qieg\u0127ed jarmi \u0121o fiha fosthom anke annimali mejta. Sa\u0127ansitra
  kienu anke marru tassanita''.\\n\\nIx-xhud sostna li huwa ma kienx jaf ta'' min
  kienet dik id-dar. Uffi\u010bjali tal-Kunsill Lokali kienu sostnew mieg\u0127u li
  huma ma jafux ta'' min hi dik id-dar u g\u0127alhekk ix-xog\u0127ol kien se jsir
  minnhom. Ix-xog\u0127ol kien jikkonsisti fit-tindif tad-drena\u0121\u0121, titnaddaf
  id-dar u jing\u0127alqu kemm it-twieqi u anke l-bibien. Id-dar kienet fi stat di\u017castruz.\\n\\nIx-xhud
  kien g\u0127adda il-kwotazzjoni lil Daniel Micallef li l-ammont tag\u0127ha kien
  ta'' ftit aktar minn tlett elef euros u l-Kunsill Lokali kien a\u010b\u010betta
  li jsir ix-xog\u0127ol li kien ta'' natura ur\u0121enti bil-prezz indikat fil-kwotazzjoni.
  Meta tlesta x-xog\u0127ol huwa kien se jit\u0127allas fi tlett pagamenti u dan min\u0127abba
  l-fatt li x-xog\u0127ol ing\u0127ata b''direct order. F''direct order pagament ma
  jistax jaqbez il-\u0127ames mija Maltin.\\n\\nHuwa kien g\u0127adda tlett quotations
  lill Kunsill Lokali Sliema. Quotation kienet fuq drainage, o\u0127ra kienet fuq
  tindif u o\u0127ra kienet fuq g\u0127eluq ta'' twieqi u bibien. Globalment dawn
  il-quotations kienu jammontaw g\u0127al tlett elef euros.\\n\\nIx-xhud jinsisti
  li huwa qatt ma kellem jew avvi\u010bina lil xi \u0127add biex jing\u0127ata dan
  ixxog\u0127ol. Kienu Daniel Micallef u Anthea Borg mill-Kunsill Lokali Sliema li
  \u010bemplulu biex huwa ja\u0127dem dan ix-xog\u0127ol.\\n\\nDarba minnhom kien
  talab lil Richard Hall biex jisilfu tlett mija u l-istess Richard Hall kien bag\u0127tu
  g\u0127and Nicholas Dimech sabiex jag\u0127tih tlett mija li kellhom jo\u0127or\u0121u
  millKumpanija li Hall u Dimech kellhom bejniethom.\\n\\nG\u0127alhekk meta ir\u010bieva
  l-ewwel pagament (cheque esebit a fol 43 tal-pro\u010bess) huwa kien informa lil
  Richard Hall li kien qabad cheque li kien se jmur isarraf sabiex ikun jista anke
  jrodd dawn it-tlett mitt ewro lura. Richard Hall dakinhar kien informa lill-imputat
  sabiex i\u010b-\u010bekk jag\u0127tih lill-Dimech, u Dimech jag\u0127tih il-kumplament.
  G\u0127alhekk l-imputat kien g\u0127adda i\u010b-\u010bekk lil Dimech u Dimech kien
  g\u0127amillu cheque ta'' tmien mija u \u0127mistax ilewro (esebit a fol 549 fil-pro\u010bess).
  L-imputat kien sarraf dan i\u010b-\u010bekk l-APS.\\n\\nIx-xhud sostna li darba
  minnhom kien is-Sibt filg\u0127odu u kien \u010bempillu missier Nikki Dimech fejn
  talbu sabiex imur jirran\u0121alu l-geyser g\u0127ax ma kienx qieg\u0127ed isa\u0127\u0127an.
  Kienu marru d-dar ta'' missieru l-imputat u Richard Hall. Dakinhar lil missier Nikki
  Dimech kienu bidlulu l-geyser g\u0127ax kien marlu. Ta'' dan ix-xog\u0127ol huma
  kienu t\u0127allsu \u0127amsin euro kull wie\u0127ed permezz ta'' cheque kull wie\u0127ed.
  (\u010aekkijiet esebiti a fol 556 u 565 talpro\u010bess rispettivament).\\n\\nIx-xhud
  sostna li kemm dam Sindku Nikki Dimech huwa \u0127adem din il-bi\u010b\u010ba tax-xog\u0127ol
  biss u qatt ma ta'' flus lil \u0127add. Ta\u017c-\u017cew\u0121 invoices l-o\u0127ra
  huwa baqa qatt ma t\u0127allas.\\n\\nIn kontro-e\u017cami l-imputat sostna li huwa
  kien ja\u0127dem self employed construction. Huwa kien jag\u0127mel dan ix-xog\u0127ol
  qabel ma kien Kunsillier fil-Kunsill ta'' San \u0120wann. Wara kien waqaf g\u0127ax
  ma re\u0121ax applika g\u0127at-tender min\u0127abba li kienu applikaw tlett kuntratturi
  kbar li huwa qatt ma seta'' jikkompeti mag\u0127hom.\\n\\nIx-xhud insista li f''dik
  id-dar huwa \u0127adem tlett xog\u0127lijiet differenti u cjoe xog\u0127ol taddarinage,
  xog\u0127ol ta'' tindif u anke xog\u0127ol ta'' twieqi u bibien.\\n\\nIx-xhud sostna
  li meta huwa kien \u010bempel lil Patrick Pace biex jiltaqa mieg\u0127u, huwa kien
  flimkien ma Joven Hall u kienu sejrin jixtru xi medi\u010bini. X''\u0127in waslu
  Dingli Street, iltaqg\u0127u ma Nikki Dimech u infurmahom li kienet waqg\u0127etlu
  l-batterija tal-mobile u kellu b\u017conn i\u010bempel lil Patrick Pace.\\n\\nG\u0127alhekk
  Dimech kien ta lill-imputat in-numru ta'' Pace u talbu biex i\u010bempel lill-istess
  Pace. L-imputat hekk g\u0127amel u informah li Dimech ried ikellmu. X''\u0127in
  wasal Pace, limputat u Hall kienu barra l-karozza fejn marru jixtru l-medi\u010bina
  u Pace u Dimech da\u0127lu fil-karozza jitkellmu. X\u0127in Hall u l-imputat waslu
  lura \u0127dejn il-karozza, sabu li Dimech u Pace kienu telqu.\\n\\nDarba minnhom
  rah Patrick Pace u talbu sabiex jag\u0127millu pja\u010bir u meta jara lil Dimech
  jinfurmah li huwa xtaq ikellmu g\u0127ax ma kienx qieg\u0127ed jaqbdu fuq il-mobile.
  Meta limputat kien ra lil Dimech u informah li Pace xtaq ikellmu, Dimech talab lill-imputat
  biex jinforma lill-istess Pace li jekk Dimech kien se jeg\u0127req, Pace kien se
  jeg\u0127req mieg\u0127u. L-imputat kien g\u0127adda dak il-messa\u0121\u0121 lill-Pace.
  Minn dakinhar l-imputat ma kellmux aktar lil Pace.\\n\\n2. Richard Hall xehed li
  huwa \u0127abib tal-imputat. Sostna li kien hemm drabi li l-imputat kien talbu sabiex
  jisilfu xi \u0127a\u0121a tal-flus b''mod partikolari meta kien idum biex jit\u0127allas.\\n\\nIx-xhud
  xehed kif huwa kien bi s\u0127ab ma Nikki Dimech u kienu anke se jifforma Kumpanija
  bl-isem ta'' RNC Cartons u f''dak il-perjodu l-imputat kien talbu sabiex jisilfu
  tlett mitt euro. Ix-xhud kien bag\u0127at lill-imputat g\u0127and Nikki Dimech sabiex
  jag\u0127tih dawn it-tlett mitt euro.\\n\\nEventwalment l-imputat kien mar biex
  i\u0127alsu lura dawn it-tlett mitt ewro b''\u010bekk li l-valur tieg\u0127u kien
  ta'' aktar minn tlett mitt ewro u x-xhud talbu biex imur g\u0127and Nikki ladarba
  kien Nikki li kien tah dawn it-tlett mitt ewro. Ix-xhud sostna li huwa kien \u010bempel
  lil Nikki u Nikki informah li l-imputat kien mar i\u0127allsu.\\n\\nB. Kunsiderazzjoni
  dwar \u0127tija o meno\\n\\n1. Konsiderazzjonijiet Legali fir-rigward tal-Livell
  ta'' Prova Rikjesta\\n\\nIlli huwa l-oneru tal-prosekuzzjoni li tressaq l-a\u0127jar
  provi sabiex tikkonvin\u010bi lill-Qorti li l-imputazzjonijiet addebitati fil-konfront
  tal-imputat huma veri.\\n\\nHuwa prin\u010bipju ba\u017ciku pprattikat mill-Qrati
  tag\u0127na fil-pro\u010bediment kriminali li biex limputat ji\u0121i ddikjarat
  \u0127ati, l-imputazzjonijiet dedotti g\u0127andhom ji\u0121u ppruvati oltre kull
  dubju ra\u0121onevoli, cio\u00e9 oltre kull dubju dettat mir-ra\u0121uni.\\n\\nHawnhekk
  il-Qorti tag\u0127mel referenza g\u0127as-sentenza mog\u0127tija mill-Qorti tal-Appell
  Kriminali fis-7 ta'' Settembru 1994 fl-ismijiet Il-Pulizija vs. Philip Zammit et
  u tg\u0127id pero'' mhux kull l-i\u010bken dubju huwa bi\u017c\u017cejjed sabiex
  persuna akku\u017cata ti\u0121i ddikjarata liberata. Hemm b\u017conn li \\\"dubju
  jkun dak dettat mir-ra\u0121uni\\\".\\n\\nFil-fatt fis-sentenza mog\u0127tija mill-Qorti
  tal-Appell Kriminali nhar il-5 ta'' Di\u010bembru 1997 fl-ismijiet Il-Pulizija vs.
  Peter Ebejer, dik il-Qorti fakkret li l-grad ta'' prova li trid til\u0127aq il-Prosekuzzjoni
  hu dak il-grad li ma j\u0127alli ebda dubju dettat mir-ra\u0121uni u mhux xi grad
  ta'' prova li ma j\u0127alli ebda ombra ta'' dubju. Id-dubji ombra ma jistg\u0127ux
  jitqiesu b\u0127ala dubji dettati mir-ra\u0121uni. Fi kliem ie\u0127or, dak li l-\u0120udikant
  irid jasal g\u0127alih hu, li wara li jqis i\u010b-\u010birkostanzi u l-provi kollha,
  u b''applikazzjoni tal-bon sens tieg\u0127u, ikun moralment konvint minn dak il-fatt
  li trid tipprova l-Prosekuzzjoni.\\n\\nDik il-Qorti \u010b\u010bitat l-ispjegazzjoni
  mog\u0127tija minn Lord Denning fil-ka\u017c Miller vs. Minister of Pension - 1974
  - 2 ALL ER 372 tal-espressjoni \\\"proof beyond a reasonable doubt\\\":\\n\\n\\\"Proof
  beyond a reasonable doubt does not mean proof beyond the shadow of a doubt. The
  law would fail to protect the community if it admitted fanciful possibilities to
  deflect the course of justice. If the evidence is so strong against a man as to
  leave only a remote possibility in his favour, which can be dismissed with the sentence
  ''of course it is possible but not in the least probable'' the case is proved beyond
  reasonable doubt, but nothing shall of that will suffice\\\".\\n\\n2. L-Ewwel Imputazzjoni:
  \\\"talli fit-3 ta'' Mejju 2010 jew fil-jiem u x-xhur ta'' qabel, ikkorrompejt lil
  Nicholas sive Nikki Dimech, Sindku tal-Kunsill Lokali ta'' Tas-Sliema\\\"\\n\\nIlli
  fin-nota tieg\u0127u tar-rinviju, l-Avukat \u0120enerali jindika essenzjalment \u017cew\u0121
  disposi\u017c\u017cjonijiet tal-li\u0121i li ta\u0127thom tista'' tinstab \u0127tija
  ta'' din l-imputazzjoni fil-konfront ta'' l-imputat u cioe'' l-artiklu 120 (1) tal-Kapitolu
  9 tal-Li\u0121ijiet ta'' Malta kif marbut ma'' l-artikolu 115 (1)(a) tal-Kapitolu
  9 tal-Li\u0121ijiet ta'' Malta liema artikolu jitratta lkorruzzjoni.\\n\\nFl-artikolu
  115 (1)(a) tal-Kapitolu 9 tal-Li\u0121ijiet ta'' Malta jing\u0127ad is-segwenti:\\n\\n\\\"Kull
  uffi\u010bjal jew impjegat pubbliku li, in konnessjonimal-kariga jew impieg tieg\u0127u,
  jitlob, jir\u010bievi jew ja\u010b\u010betta g\u0127alihjew g\u0127al \u0127addie\u0127or
  xi rigal jew weg\u0127da jew offerta ta'' xi rigal fiflus jew f''utli ie\u0127or,
  jew ta'' xi vanta\u0121\u0121 ie\u0127or, li g\u0127alihom huwa majkollux jedd,
  je\u0127el, meta jinsab \u0127ati \u2013\\n\\n(a) jekk l-iskop tal-\u0127las, tal-weg\u0127da
  jew tal-offerta, ikunsabiex l-uffi\u010bjal jew impjegat jag\u0127mel dak li hu
  fid-dmir tieg\u0127u li jag\u0127mel, il-piena ta'' pri\u0121unerija minnsitt xhur
  sa tliet snin;\\\"\\n\\nFl-Artikolu 120 (1) tal-Kapitolu 9 tal-Li\u0121ijiet ta''
  Malta jing\u0127ad is-segwenti:\\n\\nFil-ka\u017cijiet imsemmija fl-artikoli 115,
  116, 117 u 118,il-persuna li tikkorrompi uffi\u010bjal jew impjegat pubbliku jewmembru
  tal-Kamra tad-Deputati jew persuna li dwarha japplika xiartikolu minn dawk imsemmija
  skont kull dispo\u017cizzjoni ta\u0127t dan il-Kodi\u010bi jew ta\u0127t kull li\u0121i
  o\u0127ra, skont il-ka\u017c, titqies li hija kompli\u010bi.\\n\\nRigwardanti l-elementi
  tar-reat kontemplat fl-artikolu 115 tal-Kapitolu 9 tal-Li\u0121ijiet ta'' Malta,
  din il-Qorti tag\u0127mel referenza g\u0127as-sentenza fl-ismijiet Il-Pulizija (Spettur
  Angelo Gafa) vs Saveria sive Saverin Sinagra de\u010bi\u017ca mill-Qorti tal-Ma\u0121istrati
  b\u0127ala Qorti ta'' \u0120udikatura Kriminali fit-30 ta'' \u0120unju 2010, fejn
  \u0121ie kkunsidrat li:\\n\\n\\\"Illi minn ezami ta''l-artikolu 115 tal-Kodici Kriminali
  li jikkontempla r-reat ta'' korruzzjoni jirrizulta illi l-elementi bazici li jridu
  jigu ippruvati huma essenzjalment erba'' u cioe:\\n\\n1. in-natura ufficjali jew
  pubblika ta''l-impieg tal-persuna ikkoncernata.\\n2. li dik il-persuna irceviet
  jew accettat flus, jew xi rigal, jew weghda jew offerta u dawn ma ikunux dovuti
  skond il- ligi.\\n3. li dana jkun in konnessjoni ma''l-istess kariga jew impieg.\\n4.
  li l-iskop ikun illi l-persuna taghmel jew ma taghmilx id-dmir tieghu/taghha.\\\"\\n\\nIlli
  Fil-Pulizija vs Nicholas Dimech de\u010bi\u017ca mill-Qorti tal-Appell tal-Qorti
  Kriminali de\u010bi\u017ca fit-23 ta'' Lulju 2019 ing\u0127ad is-segwenti:\\n\\n\\\"Fis-sentenza
  fl-ismijiet ''Il-Pulizija (Spettur Angelo Farrugia) vs Joseph Buhagiar, Joseph Muscat,
  Pacifico Sammut, Charles Vella, Vince Magro, George Vassallo u Carmelo Mifsud''
  il-Qorti f''dik is-sentenza appellata kienet ikkunsidrat li:\\n\\n''l-imputazzjoni
  principali dedotta kotnra l-imputati kollha hija dik mahsuba fl-Artikolu 114 u 118
  tal-Kodici Kriminali cioe'' dik ta'' korruzzjoni ta'' ufficjal jew impjegat pubbliku.
  Illi dan ir-reat ghandu erba elementi essenzjali u cioe'':\\n\\n1. Illi l-hati irid
  ikun ufficjal jew impjegat pubbliku.\\n2. L-accettazzjoni ta'' rigal jew weghda
  jew offerta ta'' xi rigal li ghalihom ma jkunx hemm jedd.\\n3. Ghall-fini li l-impjegat
  jew ufficjal jaghmel jew biex ma jaghmilx dak li hu fid-dmir tieghu li jaghmel.\\n4.
  L-azzjoni ta'' l-ufficjal jew impjegat pubbliku trid tkun in konnessjoni malkariga
  jew impjieg tieghu.''\\n\\nFis-sentenza fl-ismijiet ''Il-Pulizija vs Lawrence sive
  Lorry Cuschieri Andrew Schembri, Carmel sive Charles Gauci, Paul Gauci'' il-Qorti
  f''dik issentenza appellata skont ma jirrizulta mis-sentenza, ikkunsidrat li:\\n\\n''Mill-premess
  jirrizulta illi sabiex jimmatura r-reat odjern ossija sabiex tikkonfigura l-komplicita''
  f''dan ir-reat, iridu jikkonkorru s-segwenti fattur:\\n\\n1) li ufficjal jew impjejegat
  pubbliku,\\n2) jircievi jew jaccetta xi utilita'' jew vantagg,\\n3) in konnessjoni
  mal-kariga jew impjieg tieghu,\\n4) u li ghalih ma jkollux jedd.''\\n\\nKif tajjeb
  issottometta l-Avukat Generali fl-appell tieghu permezz tal-Att numru III tas-sena
  2002 il-kliem \\\"jir\u010bievi jew ja\u010b\u010betta\\\" kienu \u0121ew sostitwiti
  bil-kliem \\\"jitlob, jir\u010bievi jew ja\u010b\u010betta\\\". Ghalhekk din il-Qorti
  sejra tqis ukoll sentenzi aktar ricenti.\\n\\nFis-sentenza fl-ismijiet ''Il-Pulizija
  [Spettur Jonathan Ferris] vs Thomas John Woods'' gie kkunsidrat li:\\n\\n''Fi kliem
  il-Professur Mamo (Notes on Criminal Law (revised edition 195455 Professor A.J.
  Mamo, pagna 84):\\n\\n\\\"this crime subsists at any rate in it simple form, irrespective
  of the inherent justice or injustice of the act which the reward was intended to
  induce the public officer to do. The Justice or injustice of what the public officer
  does or engages to do in view of the reward or promise or offer or reward, is not
  an essential ingredient of the crime but only serves as a criterion to distinguish
  one form of the crime from another for the purpose of punishment.\\\"\\n\\nDin id-distinzjoni
  harget fis-sentenza fl-ismijiet il-Pulizija vs Lawrence sive Lorry Cuschieri, Andrew
  Schembri, Carmel sive Charles Gauci u Paul Galea (Qorti ta l-Appell Kriminali; 25
  ta'' Lulju 1986) fejn inghad issegwenti:\\n\\n\\\"In propositu huwa rilevanti hafna
  l-Artikolu 114 (illum 115) stante li dan jistabilixxi diversi gradi ta'' piena bazata
  fuq kriterji relattivi ghall-iskop u l-effetti tal-att kostitwenti l-korruzzjoni,
  fis-sens li l- ligi tiddistingwi principlament bejn il-kaz fejn l-iskop tar-rigal
  ikun sabiex l-ufficcjal jaghmel dak li hu fid-dmir tieghu li jaghmel; u l- kaz fejn
  l-iskop ikun sabiex ma jaghmilx dak li hu fid-dmiru \u2013 fit- tieni kaz, jekk
  l-ufficjal ''filfatt'' jonqos li jaghmel dak li kien fid-dmir li jaghmel.\\\"\\n\\nFil-kaz
  appena citat, il-Qorti riteniet li:\\n\\n\\\".... u huwa immaterjali - ghal finijiiet
  tar-responsabilita'' li nonostante dan il-vantagg l-impjegat xorta wahda ghamel
  dmiru. Ghax ir-reat odjern almenu fil-limiti tal-paragrafu (b) tal-Artikolu 114
  (illum 115(b)) huwa kkonsmat mal-accettazzjoni tal-offerta u mhux mal-effett ta''
  din fuq lezercizzju tal-funzjonijiet tal-impjegat.\\\"\\n\\nFil-fatt id-diskussjoni
  dwar il-piena ghar-reat ta'' korruzzjoni tista'' tigi sommata fi kliem tas-sentenza
  kif moghtija mill-istess Qorti:-\\n\\n\\\"L-iskop u effikacja tal-korruzzjoni huma
  fatturi rilevanti ghal quantum tal-piena, u mhux ghall-ezistenza o meno tar- responsabilita''
  kriminali. Illigi hija cara; ''kul ufficcjal.... li jircievi jew jaccetta jikkommetti
  dan irreat.\\\"\\n\\nL-elementi huma deskritti f''diversi sentenzi fosthom fis-sentenza
  il-Pulizija vs Joseph Buhagiar et. fejn gew deskritti bis-segwenti manjiera:\\n\\n1.
  Illi l-hati jrid ikun ufficcjal jew impjegat pubbliku;\\n2. L-accettazzjoni ta''
  rigal jew weghda jew offerta'' ta'' xi rigal li ghalihom ma jkunx hemm jedd;\\n3.
  L-azzjoni ta'' l-ufficcjal jew impjegat pubbliku li jaccetta r-rigal, weghda jew
  offerta trid tkun in konnessjoni mal-kariga jew impjieg tieghu;\\n4. Ghal fini li
  l-impjegat jew ufficjal jaghmel jew biex ma jaghmilx dak li hu fid- dmir tieghu
  li jaghmel. Illi dawn l-erba'' elementi jridu jikkonkorru kollha fl-istess hin sabiex
  jista'' jinghad li r-reat gie pruvat.''\\n\\nFis-sentenza fl-ismijiet ''Il-Pulizija
  Assistent Kummissarju Mario Spiteri] (Supretendent Simon Galea] vs Kenneth Sevasta''
  dwar ir-raba'' element tarreat taht l-artikolu 115 tal-Kapitolu 9 tal-Ligijiet ta''
  Malta u cioe'''' ''Ghal fini li l-impjegat jew ufficcjal jaghmel jew biex ma jaghmilx
  dak li hu fid-dmir tieghu li jaghmel'' gie kkunsidrat ukoll li:\\n\\n''Illi ghalhekk
  minnufih jigi rilevat li l-offerta jrid ikollha l-iskop li tinduci lillufficjal
  pubbliku li jaghmel haga li m''ghandux x''jaghmel. Fl-ewwel ipotesi, meta l- ufficcjal
  pubbliku jaghmel id-dover tieghu in kontro kambju ghal xi vantagg il- Professur
  Mamo jghid:\\n\\n\\\"..the law wants to protect the integrity of the public service
  and the prestige of the judiciary which are harmed in the esteem which they should
  enjoy by any imporper reward received even though it is not intended to injure materially
  the interests of the individual or the interest of Justice.\\\"\\n\\nIt-tieni ipotesi
  hija meta r-rigal jew kull haga li tinghata lill-ufficcjal pubbliku sabiex jehel
  milli jaghmel id-dover tieghu l-Professur Mamo jghid:\\n\\n\\\"that there is in
  addition to the injury to the good name of the service also the danger of actual
  injury to the right of the individuals or of justice and the law takes account of
  this for the purpose of aggravating the punishment.\\\"\\n\\nFis-sentenza fl-ismijiet
  ''Il-Pulizija v. Liliana Galea'' gie kkunsidrat:\\n\\n'' Jinghad mill-ewwel illi
  l-appellanti hija korretta meta tghid illi taht issistema legali taghna bribery
  after the fact ma jezistix. U din il-kwistjoni ma gietx trattata mill-ewwel Qorti.
  Bhalma ntqal fis-sentenza fl-ismijiet IlPulizija v. David Gatt moghtija minn din
  il-Qorti diversament presjeduta fil-11 ta'' Novembru 2011, differentement mill-
  posizzjoni fil-ligi Taljana, taht il-ligi taghna \\\"sakemm ma jkunx hemm ftehim
  qabel (enfasi tal-Qorti) il-kommissjoni ta'' l-att ma jistax ikun hemm korruzzjoni
  ta'' ufficjal pubbliku wara li dan ta'' l-ahhar ikun qeda d-dover tieghu. Il-Professur
  Mamo jghallem li ''as Section 114(a) and (b) (illum 115(a) u (b)) are worked, it
  seems that there can be the crime of corruption only where the reward promised or
  offered is made to the public officer and accepted by him in respect of an act he
  has yet to do and not also for an act he may have already done.''''\\n\\nG\u0127alhekk
  sabiex l-imputat Raymond Cachia jinstab \u0127ati, l-Prosekuzzjoni kellha tipprova
  l-elementi ba\u017ci\u010bi li jikkontempla ir-reat ta'' korruzzjoni ta'' l-artikolu
  115 tal-Kodi\u010bi Kriminali u \u010bjoe:\\n\\n1. in-natura uffi\u010bjali jew
  pubblika ta'' l-impjieg tal-persuna ikkon\u010bernata.\\n2. li dik il-persuna ir\u010beviet
  jew a\u010b\u010bettat flus, jew xi rigal, jew weg\u0127da jew offerta u dawn ma
  jkunux dovuti skond il-li\u0121i.\\n3. li dana jkun in konnessjoni ma'' l-istess
  kariga jew impjieg.\\n4. li l-iskop ikun illi l-persuna tag\u0127mel jew ma tag\u0127milx
  id-dmir tieg\u0127u/tag\u0127ha.\\n\\nFinalment il-Prosekuzzjoni kien me\u0127ti\u0121iela
  li tipprova wkoll illi jekk g\u0127addew xi flus, ilftehim li l-imputat kellu jg\u0127addi
  l-flus lil Nicholas Dimech sar propju qabel li l-imputat ing\u0127ata x-xog\u0127ol
  u mhux wara li ng\u0127ata x-xog\u0127ol u dan g\u0127aliex kif ing\u0127ad fis-sentenza
  fl-ismijiet il-Pulizija vs Liliana Galea de\u010bi\u017ca mill-Qorti tal-Appell
  Kriminali fit-28 ta'' Marzu 2012 ta\u0127t is-sistema legali tag\u0127na bribery
  after the fact ma je\u017cistix u sakemm ma jkunx hemm ftehim qabel il-kommissjoni
  ta'' l-att ma jistax ikun hemm korruzzjoni ta'' uffi\u010bjal pubbliku wara li dan
  ta'' l-a\u0127\u0127ar ikun qeg\u0127da d-dover tieg\u0127u.\\n\\nIl-Professur Mamo
  jghallem li ''as Section 114(a) and (b) (illum 115(a) u (b)) are worked, it seems
  that there can be the crime of corruption only where the reward promised or offered
  is made to the public officer and accepted by him in respect of an act he has yet
  to do and not also for an act he may have already done.''''\\n\\nL-Avukat Dottoressa
  Angele Vella xehdet li Nicholas Dimech ID card number 301779 (M) \u0121ie elett
  kunsillier fl-elezzjoni tal-11 ta'' Marzu 2006, re\u0121a'' \u0121ie elett fl-elezzjoni
  tas6 ta'' \u0120unju 2009 u \u0121ie ma\u0127tur Sindku fl-ewwel laqg\u0127a tal-kunsill
  li saret fis-6 ta'' Lulju 2009. Serva b\u0127ala Sindku sat-2 ta'' Settembru 2010
  u sa dakinhar li xehdet u \u010bjoe l-11 ta'' Novembru 2011 g\u0127adu kunsiller
  fil-Kunsill Lokali ta'' Tas-Sliema.\\n\\nL-Ispettur, illum il-Kummissarju tal-Pulizija
  Angelo Gafa'' xehed illi waqt li kien g\u0127addej b''investigazzjonijiet t''allegazzjonijiet
  ta'' korruzzjoni li fihom kien involut is-Sindku ta'' Tas-Sliema Nicholas Dimech,
  f''Settembru u Ottubru 2010, ir\u010bieva \u017cew\u0121 ittri anonimi fejn dawn
  kienu jirrigwardjaw allegazzjonijiet ta'' irregolaritajiet fl-istess Kunsill ta''
  TasSliema. L-ewwel ittra tal-11 ta'' Settembru 2011 kienet tag\u0127mel referenza
  g\u0127al xi kuntratturi li kienu jissupplixxu servizzi lill-istess Kunsill Lokali.
  Fit-tieni ittra tat-13 ta'' Ottubru kien hemm allegat li Nicholas Dimech kien qed
  i\u0127allas commission lil kunsilliera Eve Galea Debono u Martin Pace permezz ta''
  cheque.\\n\\nIl-pulizija g\u0127amlet investigazzjoni fuq il-kontijiet bankarji
  ta'' Nicholas Dimech u fost i\u010b\u010bekkijiet li ntra\u010b\u010baw il-pulizija
  sabet wie\u0127ed li da\u0127al fil-kont bankarju ta'' Nicholas Dimech u \u010bjoe
  fil-kont bankarju bin-numru 006072193001 tal-HSBC Bank. Dan kien jirrigwarda \u010bekk
  bin-numru 11147 ma\u0127ru\u0121 minn kont bankarju tal-BOV bin-numru 14809369022
  li l-account kien jg\u0127ajjat lil Kunsill Lokali ta'' Tas-Sliema. Dan i\u010b-\u010bekk
  kien in\u0127are\u0121 lil Raymond Cachia g\u0127al xog\u0127ol li kien g\u0127amel
  ta'' tiswija ta'' drena\u0121\u0121 fil-fond 21, High Street, Sliema u spi\u010b\u010ba
  fil-kont bankarju tas-Sindku Nicholas Dimech.\\n\\nAngelo Gafa kien arresta lill-imputat.
  Fl-ewwel stqarrija tieg\u0127u l-imputat sostna li \u010b-\u010bekk g\u0127addih
  lis-Sur Dimech g\u0127al ammont ta'' flus li kien silfu. Finalment l-imputat ammetta
  li \u010b-\u010bekk kien g\u0127addih lis-Sur Dimech b\u0127ala commission wara
  li dan talab dan it-tip ta'' \u0127las.\\n\\nL-imputat stqarr max-xhud li kien hemm
  bzonn li jsir xi xog\u0127ol f''dar abbandunata u min\u0127abba li l-ammont tax-xog\u0127ol
  kien Lm1,500 u direct orders mill-Kunsilli Lokali ma jistg\u0127ux je\u010b\u010bedu
  l-Lm500. Ix-xog\u0127ol kien inqasam fi tlett quotations fejn wa\u0127da kienet
  g\u0127at-tne\u0127\u0127ija ta\u017c-\u017cibel, l-o\u0127ra kienet g\u0127al g\u0127eluq
  tal-aperturi u xi tik\u0127il u l-o\u0127ra kienet g\u0127at-tiswija tad-drena\u0121\u0121
  u huwa ng\u0127ata dan ix-xog\u0127ol fl-a\u0127\u0127ar tas-sena 2009.\\n\\nL-imputat
  stqarr ma Angelo Gafa li s-Sindku Nicholas Dimech kien talbu sabiex l-ewwel \u0127las
  kellu jg\u0127addih lilu b\u0127ala apprezzament talli g\u0127addilu x-xog\u0127ol.
  L-imputat stqarr max-xhud li huwa g\u0127adda l-pagament lis-Sindku g\u0127aliex
  li kieku ma g\u0127amilx hekk huwa kien se jispi\u010b\u010ba ming\u0127ajr impjieg.
  Eventwalment fl-istqarrija tieg\u0127u tal-11 ta'' Jannar 2011 l-imputat Raymond
  sostna li huwa ja\u0127dem fil-construction u kellu Tender mal-Kunsill Lokali Sliema
  fi \u017cmien Robert Arrigo u Marina Arrigo.\\n\\nIkkonferma li bejn April 2009
  u Marzu 2010 g\u0127amel xi xog\u0127ol ta'' tiswijiet ta'' bankini, tne\u0127\u0127ija
  ta'' debris, tindif f''post fi Triq il-Kbira u tiswija ta'' drainage fl-istess post
  millKunsill Lokali Sliema. Huwa kkonferma li g\u0127al dan ix-xog\u0127ol kien fadallu
  jie\u0127u lammont ta'' \u20ac1091.50c\\n\\nStqarr li lil Nikki Dimech jafu g\u0127ax
  kien ikun ma Robert Arrigo. Kien ilu jafu xi sentejn u nofs u anke g\u0127enu fil-kampanja
  tal-Kunsill Lokali. Sostna li Nikki Dimech qatt ma talbu flus. Sostna wkoll li huwa
  qatt ma ta flus lil Nikki Dimech.\\n\\nSostna li f''Lulju 2010 Nikki Dimech kien
  silfu l-ammont ta'' \u20ac500 u f''Novembru 2010 kien silfu \u20ac850 o\u0127ra.
  Qabel il-Milied tal-2010 kien silfu \u20ac400. Il-ftehim kien li huwa j\u0127allsu
  meta jit\u0127allas mill-Kunsill Lokali Sliema. Sostna li huwa g\u0127adda c-cheque
  li kien ir\u010bieva mill-Kunsill Lokali Sliema fl-ammont ta'' \u20ac1115.10c datat
  21 ta'' April 2010 lil Nikki Dimech g\u0127aliex huwa kellu jag\u0127tih xi \u0127a\u0121a
  mill-flus li kien silfu u kien tah iddifferenza b''\u010bekk tal-APS.\\n\\nFl-istqarrija
  tieg\u0127u tat-12 ta'' Jannar 2011 l-imputat Raymond Cachia sostna li fl-istqarrija
  tal-11 ta'' Jannar 2011 huwa ma kienx qal il-verita b''mod partikolari rigward i\u010b-\u010bekk
  li kien ir\u010bieva mill-Kunsill Lokali Sliema fl-ammont ta'' \u20ac1115.10c datat
  21 ta'' April 2010. Huwa sostna li wara li \u0121abar i\u010b-\u010bekk huwa kien
  iffirmah fuq wara u g\u0127addih lis-Sindku ta'' tas-Sliema Nikki Dimech. Huwa sostna
  li g\u0127amel hekk g\u0127aliex huwa kien spi\u010b\u010ba bla xog\u0127ol.\\n\\nKien
  jaf li tas-sanita'' kienu ilhom \u017cmien jirrapurtaw dwar dar antika \u0127dejn
  Joinwell f''TasSliema li wara li waqag\u0127la s-saqaf spi\u010b\u010bat mi\u017cbla.
  Il-Kunsill ta'' tas-Sliema ma kienx \u0127a azzjoni u xi \u0127add irraporta lill-Partit
  Nazzjonalista dwar dan. Huwa jaf li mill-Partit Nazzjonalista kienu ssu\u0121\u0121erew
  lis-Sindku Nikki Dimech li dan ix-xog\u0127ol jag\u0127mlu hu u\\n\\ndan min\u0127abba
  li dak i\u017c-\u017cmien ftit li xejn kellu xog\u0127ol. Dan ix-xog\u0127ol kien
  stmah Lm1500. Min\u0127abba li direct order ting\u0127ata sa massimu ta'' Lm500,
  huwa qasam dan ixxog\u0127ol fi tlett stimi.\\n\\nJaf li dawn l-istimi \u0121ew
  diskussa mill-Kunsill Lokali Sliema u g\u0127al \u0127abta ta'' Novembru 2009 ing\u0127ata
  dan ix-xog\u0127ol. Huwa kien \u0121ej u sejjer il-Kunsill Lokali Sliema u meta
  beda dan ix-xog\u0127ol, Nikki Dimech talbu sabiex l-ewwel \u010bekk li jin\u0127ari\u0121lu
  fuq dan ix-xog\u0127ol kellu jg\u0127addih lilu b\u0127ala ringrazzjament talli
  g\u0127addilu dan ix-xog\u0127ol. Raymond Cachia a\u010b\u010betta li jag\u0127tih
  l-ewwel \u010bekk.\\n\\nHuwa kien fadallu jie\u0127u l-kumplament tal-\u0127las
  u g\u0127alhekk g\u0127al dan ix-xog\u0127ol huwa ma da\u0127\u0127al xejn. Huwa
  ikkonferma pero li Nikki Dimech verament kien silfu xi flus bla img\u0127ax u kien
  g\u0127adu ma tah xejn minnhom.\\n\\nL-Imputat Raymond Cachia g\u0127a\u017cel li
  jixhed f''dawn il-pro\u010beudri. Huwa sostna kif qabel l-2010 huwa kien di\u0121\u00e0
  ilu ja\u0127dem mal-Kunsill Lokali Sliema g\u0127al xi erba'' jew \u0127ames snin
  permezz ta'' tender fejn huwa kien jag\u0127mel il-maintenance kollu li kien ikun
  hemm b\u017conn u li kien jinvolvi xog\u0127ol \u017cg\u0127ir. Xog\u0127ol kbir
  huwa ma kienx ja\u0127dem.\\n\\nFuq dan l-in\u010bident, l-imputat isostni li kien
  \u010bempillu Daniel Micallef skrivan li kien ja\u0127dem mal-Kunsill Lokali Sliema
  u talbu biex jag\u0127mel bi\u010b\u010ba xog\u0127ol g\u0127aliex il-Kunsill Lokali
  kien qed ikollu \u0127afna complaints.\\n\\nIx-xhud sostna li huwa mar jara x-xog\u0127ol.
  Dan ix-xog\u0127ol kellu jsir \u0121o dar ma tintu\u017cax li kellha l-bibien u
  t-twieqi miftu\u0127in u kul\u0127add kien qieg\u0127ed jarmi \u0121o fiha fosthom
  anke annimali mejta. Sa\u0127ansitra kienu anke marru tas-sanita''.\\n\\nIx-xhud
  sostna li huwa ma kienx jaf ta'' min kienet dik id-dar. Uffi\u010bjali tal-Kunsill
  Lokali kienu sostnew mieg\u0127u li huma ma jafux ta'' min hi dik id-dar u g\u0127alhekk
  ix-xog\u0127ol kien se jsir minnhom.\\n\\nIx-xog\u0127ol kien jikkonsisti fit-tindif
  tad-drena\u0121\u0121, titnaddaf id-dar u jing\u0127alqu kemm ittwieqi u anke l-bibien.
  Id-dar kienet fi stat di\u017castruz.\\n\\nIx-xhud kien g\u0127adda il-kwotazzjoni
  lil Daniel Micallef li l-ammont tag\u0127ha kien ta'' ftit aktar minn tlett elef
  euros u l-Kunsill Lokali kien a\u010b\u010betta li jsir ix-xog\u0127ol li kien ta''
  natura ur\u0121enti bil-prezz indikat fil-kwotazzjoni.\\n\\nMeta tlesta x-xog\u0127ol
  huwa kien se jit\u0127allas fi tlett pagamenti u dan min\u0127abba l-fatt li xxog\u0127ol
  ing\u0127ata b''direct order. F''direct order pagament ma jistax jaqbe\u017c il-\u0127ames
  mija Maltin.\\n\\nHuwa kien g\u0127adda tlett quotations lill Kunsill Lokali Sliema.
  Quotation kienet fuq drainage, o\u0127ra kienet fuq tindif u o\u0127ra kienet fuq
  g\u0127eluq ta'' twieqi u bibien. Globalment dawn il-quotations kienu jammontaw
  g\u0127al tlett elef euros.\\n\\nIx-xhud jinsisti li huwa qatt ma kellem jew avvi\u010bina
  lil xi \u0127add biex jing\u0127ata dan ixxog\u0127ol. Kienu Daniel Micallef u Anthea
  Borg mill-Kunsill Lokali Sliema li \u010bemplulu biex huwa ja\u0127dem dan ix-xog\u0127ol.\\n\\nDarba
  minnhom kien talab lil Richard Hall biex jisilfu tlett mija u l-istess Richard Hall
  kien bag\u0127tu g\u0127and Nicholas Dimech sabiex jag\u0127tih tlett mija li kellhom
  jo\u0127or\u0121u millKumpanija li Hall u Dimech kellhom bejniethom.\\n\\nG\u0127alhekk
  meta t\u0127allas l-ewwel pagament (cheque esebit a fol 43 tal-pro\u010bess) huwa
  kien informa lil Richard Hall li kien qabad cheque li kien se jmur isarraf sabiex
  ikun jista anke jrodd dawn it-tlett mitt ewro lura. Richard Hall dakinhar kien informa
  lill-imputat sabiex ic-cheque jag\u0127tih li Dimech u Dimech jag\u0127tih il-kumplament.\\n\\nG\u0127alhekk
  l-imputat kien g\u0127adda i\u010b-\u010bekk lil Dimech u Dimech kien g\u0127amillu
  cheque ta'' tmien mija u \u0127mistax il-ewro (esebit a fol 549 fil-pro\u010bess).
  L-imputat kien sarraf dan iccheque l-APS.\\n\\nIx-xhud sostna li darba minnhom kien
  is-Sibt filg\u0127odu u kien \u010bempillu missier Nikki Dimech fejn talbu sabiex
  imur jirran\u0121alu l-geyser g\u0127ax ma kienx qieg\u0127ed isa\u0127\u0127an.
  Kienu marru d-dar ta'' missieru l-imputat u Richard Hall. Dakinhar lil missier Nikki
  Dimech kienu bidlulu l-geyser g\u0127ax kien marlu. Ta'' dan ix-xog\u0127ol huma
  kienu t\u0127allsu \u0127amsin\\n\\neuro kull wie\u0127ed permezz ta'' cheque kull
  wie\u0127ed. (\u010aekkijiet esebiti a fol 556 u 565 talpro\u010bess rispettivament).\\n\\nIx-xhud
  sostna li kemm dam Sindku Nikki Dimech huwa \u0127adem din il-bi\u010b\u010ba tax-xog\u0127ol
  biss u qatt ma ta'' flus lil \u0127add. Ta\u017c-\u017cew\u0121 invoices l-o\u0127ra
  huwa baqa qatt ma t\u0127allas.\\n\\nRichard Hall xehed li huwa \u0127abib tal-imputat.
  Sostna li kien hemm drabi li l-imputat kien talbu sabiex jisilfu xi \u0127a\u0121a
  tal-flus b''mod partikolari meta kien idum biex jit\u0127allas.\\n\\nRichard Hall
  xehed kif huwa kien bi s\u0127ab ma Nikki Dimech u kienu anke se jifforma Kumpanija
  bl-isem ta'' RNC Cartons u f''dak il-perjodu l-imputat kien talbu sabiex jisilfu
  tlett mitt euro. Ix-xhud kien bag\u0127at lill-imputat g\u0127and Nikki Dimech sabiex
  jag\u0127tih dawn it-tlett mitt euro.\\n\\nEventwalment l-imputat kien mar biex
  i\u0127allsu dawn it-tlett mitt ewro b''\u010bekk li l-valur tieg\u0127u kien ta''
  aktar minn tlett mitt ewro u x-xhud talbu biex imur g\u0127and Nikki ladarba kien
  Nikki li kien tah dawn it-tlett mitt ewro. Ix-xhud sostna li huwa kien \u010bempel
  lil Nikki u Nikki infurmah li l-imputat kien mar i\u0127allsu.\\n\\nIl-Qorti tiddikjara
  li mill-ver\u017cjonijiet kollha li ta'' l-imputat, il-Qorti temmen li lverita''
  tinsab fl-istqarrija rilaxxata minnu fit-12 ta'' Jannar 2011. Illi issa l-Qorti
  se tg\u0127addi sabiex tistabbilixxi jekk il-Prosekukazzjoni ppruvatx il-ka\u017c
  tag\u0127ha sal-grad rikjest mill-li\u0121i sabiex l-imputat Raymonnd Cachia jinstab
  \u0127ati ta'' din l-imputazzjoni.\\n\\nSabiex l-imputat Raymond Cachia jinstab
  \u0127ati l-Prosekuzzjoni kellha tipprova l-elementi ba\u017ci\u010bi li jikkontempla
  ir-reat ta'' korruzzjoni ta\u0127t l-artikolu 115 tal-Kodi\u010bi Kriminali u cjoe:\\n\\n1.
  In-natura uffi\u010bjali jew pubblika ta'' l-impjieg tal-persuna ikkon\u010bernata.\\n\\nL-ewwel
  element li jsawwar ir-reat huwa in-natura uffi\u010bjali jew pubblika tal-impjieg
  talpersuna ikkon\u010bernata. Illi ma hemmx dubju u lanqas ma huwa kkontestat li
  Nicholas Dimech kien jokkupa l-kariga ta'' Sindku tal-Kunsill Lokali ta'' Tas-Sliema
  meta se\u0127\u0127 dak allegat.\\n\\nL-artikolu 92 tal-Kapitolu 9 tal-Ligijiet
  ta'' Malta jaqra:\\n\\n''Ta\u0127t il-fra\u017ci \u0121enerali \\\"uffi\u010bjal
  pubbliku\\\" jid\u0127lu mhux biss l-awtoritajiet kostitwiti, \u010bivili u militari,
  i\u017cda wkoll dawk il-persuni kollha li huma ma\u0127tura skont il-li\u0121i sabiex
  jamministraw xi parti tas-setg\u0127a esekuttiva tal-Gvern, jew biex jesegwixxu
  xi dmir ie\u0127or pubbliku impost mil-li\u0121i, sew \u0121udizzjarju kemm amministrattiv
  kif ukoll tax-xorta l-wa\u0127da u l-o\u0127ra.''\\n\\nG\u0127alhekk ma hemmx dubju
  li Nicholas Dimech kien uffi\u010bjal pubbliku meta kien qieg\u0127ed jokkupa l-kariga
  ta'' Sindku tal-Kunsill Lokali ta'' Sliema;\\n\\n2. Li dik il-persuna ir\u010beviet
  jew a\u010b\u010bettat flus, jew xi rigal, jew weg\u0127da jew offerta u dawn ma
  jkunux dovuti skond il- li\u0121i.\\n\\nIt-tieni element huwa li f''dan il-ka\u017c
  Nicholas Dimech jrid ikun talab, ir\u010bieva jew a\u010b\u010betta g\u0127alih
  jew g\u0127al \u0127addie\u0127or rigal, weg\u0127da jew offerta ta'' xi rigal fi
  flus jew f''utli ie\u0127or, jew ta'' xi vanta\u0121\u0121 ie\u0127or li g\u0127alihom
  huwa ma jkollux jedd.\\n\\nFl-istqarrija tieg\u0127u tat-12 ta'' Jannar 2011 l-imputat
  Raymond Cachia sostna li wara li \u0121abar i\u010b-\u010bekk huwa kien iffirmah
  fuq wara u g\u0127addih lis-Sindku ta'' tas-Sliema Nikki Dimech. Huwa sostna li
  g\u0127amel hekk g\u0127aliex huwa kien spi\u010b\u010ba bla xog\u0127ol.\\n\\nKien
  jaf li tas-sanita'' kienu ilhom \u017cmien jirrapurtaw dwar dar antika \u0127dejn
  Joinwell f''TasSliema li wara li waqg\u0127a s-saqaf spi\u010b\u010bat mi\u017cbla.
  Il-Kunsill ta'' tas-Sliema ma kienx \u0127a azzjoni u xi \u0127add irraporta lill-Partit
  Nazzjonalista dwar dan. Huwa jaf li mill-Partit Nazzjonalista kienu ssu\u0121\u0121erew
  lis-Sindku Nikki Dimech li dan ix-xog\u0127ol jag\u0127mlu hu u dan min\u0127abba
  li dak i\u017c-\u017cmien ftit li xejn kellu xog\u0127ol.\\n\\nDan ix-xog\u0127ol
  kien stmah Lm1500. Min\u0127abba li direct order ting\u0127ata sa massimu ta'' Lm500,
  huwa qasam dan ix-xog\u0127ol fi tlett stimi.\\n\\nJaf li dawn l-istimi \u0121ew
  diskussa mill-Kunsill Lokali Sliema u g\u0127al \u0127abta ta'' Novembru 2009 ing\u0127ata
  dan ix-xog\u0127ol. Huwa kien \u0121ej u sejjer il-Kunsill Lokali Sliema u meta
  beda dan ix-xog\u0127ol, Nikki Dimech talbu sabiex l-ewwel \u010bekk li jin\u0127ari\u0121lu
  fuq\\n\\ndan ix-xog\u0127ol kellu jg\u0127addih lilu b\u0127ala ringrazzjament talli
  g\u0127addilu dan ix-xog\u0127ol. Limputat a\u010b\u010betta li jag\u0127tih l-ewwel
  \u010bekk.\\n\\nIlli g\u0127alhekk din il-Qorti tqis li \u0121ie ppruvat li l-imputat
  g\u0127adda l-flus lil Nicholas Dimech.\\n\\n3. Li dana jkun in konnessjoni ma''l-istess
  kariga jew impieg; u\\n\\n4. Li l-iskop ikun illi l-persuna taghmel jew ma taghmilx
  id-dmir tieghu/taghha.\\n\\nIlli fis-sentenza l-Pulizija vs Nicholas Dimech de\u010bi\u017ca
  mill-Qorti tal-Appell tal-Qorti Kriminali de\u010bi\u017ca fit-23 ta'' Lulju 2019
  ing\u0127ad is-segwenti:\\n\\n\\\"Element iehor ta'' dan ir-reat ikkontemplat fl-artikolu
  115 tal-Kapitolu 9 talLigijiet ta'' Malta huwa li dak li jkun intalab ma jkollux
  jedd ghalih u li taht is-subartikolu (a) tal-artikolu 115 l-iskop tal-hlas, weghda
  jew offerta tkun li l-ufficjal jaghmel dak li hu  fid-dmir li jaghmel.\\\"\\n\\n\\\"Il-Prosekuzzjoni
  kellha tipprova ukoll li dak allegatament mitlub kien sabiex l-imputat jaghmel dak
  li hu fid-dmir tieghu li jaghmel\\\"\\n\\n\\\"Jirrizulta ukoll li il-fatt jekk it-tender
  jinghatax lil Stephen Buhagiar jew le ma kienx jiddependi unikament fuq l-imputat.\\\"\\n\\nIl-Qorti
  tal-Appell Kriminali kienet waslet g\u0127al konklu\u017cjoni li ladarba l-fatt
  jekk it-tender jing\u0127atax lil Stephen Buhagiar jew le ma kienx jiddependi unikament
  fuq l-imputat konsegwentement il-Prosekuzzjoni ma pprovat l-elementi ba\u017ci\u010bi
  li jikkontempla ir-reat ta'' korruzzjoni ta'' l-artikolu 115 tal-Kodi\u010bi Kriminali.\\n\\nL-fatti
  ta'' dan il-ka\u017c huma identi\u010bi g\u0127al fatti tal-ka\u017c l-Pulizija
  vs Nicholas Dimech de\u010bi\u017c mill-Qorti tal-Appell Kriminali, bid-differenza
  li x-xog\u0127ol ma ng\u0127atax permezz ta'' tender i\u017cda permezz ta'' direct
  order.\\n\\nMill-provi produ\u010bibbli jirri\u017culta li l-istimi provduti mill-imputat
  Raymond Cachia taxxog\u0127ol \u0121ew diskussa mill-Kunsill Lokali Sliema u g\u0127al
  \u0127abta ta'' Novembru 2009 u eventwalment ing\u0127ata dan ix-xog\u0127ol. G\u0127alhekk
  jirri\u017culta li d-de\u010bi\u017cjoni jekk id-direct order jing\u0127atax lil
  imputat Raymond Cachia jew le, ma kienx jiddependi unikament fuq\\n\\nis-Sindku
  Nicholas Dimech. Tant kemm ma kienx jiddependi unikament fuq is-Sindku Nicholas
  Dimech sabiex ji\u0121i de\u010bi\u017c jekk ix-xog\u0127ol g\u0127andux jing\u0127ata
  lil imputat, illi fillaqg\u0127a tal-Kunsill Lokali Sliema tal-Erbg\u0127a 2 ta''
  Marzu 2011 kien \u0121ie diskuss dan ixxog\u0127ol u anke il-pagament li kien g\u0127adu
  dovut lill-imputat Raymond Cachia, liema pagament l-imputat baqa'' qatt ma t\u0127allas.\\n\\nLi
  kieku kien jiddependi biss mis-Sindku Nicholas Dimech sabiex l-imputat Raymond Cachia
  jing\u0127ata dan ix-xog\u0127ol, l-istess Sindku kien ikun jista japprova li jsir
  il-\u0127las ta'' dan l-istess xog\u0127ol wa\u0127du.\\n\\nTajjeb li jing\u0127ad
  illi mill-provi produ\u010bibbli jirri\u017culta wkoll li kien propju meta beda
  dan ix-xog\u0127ol, li Nicholas Dimech talab lill-imputat Raymond Cachia sabiex
  l-ewwel \u010bekk li jin\u0127ari\u0121lu fuq dan ix-xog\u0127ol kellu jg\u0127addih
  lilu b\u0127ala ringrazzjament talli g\u0127addilu dan ix-xog\u0127ol u mhux qabel
  ma Raymond Cachia ing\u0127ata dan ix-xog\u0127ol.\\n\\nIlli g\u0127alhekk jing\u0127ad
  li l-imputat Raymond Cachia ma seta'' qatt jinstab \u0127ati fuq din limputazzjoni
  g\u0127aliex kif ing\u0127ad fis-sentenza fl-ismijiet il-Pulizija vs Liliana Galea
  de\u010bi\u017ca mill-Qorti tal-Appell Kriminali fit-28 ta'' Marzu 2012 ta\u0127t
  is-sistema legali tag\u0127na bribery after the fact ma je\u017cistix u sakemm ma
  jkunx hemm ftehim qabel (enfasi talQorti) il-kommissjoni ta'' l-att ma jistax ikun
  hemm korruzzjoni ta'' uffi\u010bjal pubbliku wara li dan ta'' l-a\u0127\u0127ar
  ikun qeda d-dover tieg\u0127u.\\n\\nIl-Professur Mamo jg\u0127allem li \\\"as Section
  114(a) and (b) (illum 115(a) u (b)) are worked, it seems that there can be the crime
  of corruption only where the reward promised or offered is made to the public officer
  and accepted by him in respect of an act he has yet to do and not also for an act
  he may have already done.''''\\n\\nIlli g\u0127alhekk din il-Qorti  ma hijiex ha
  ssib lill-imputat \u0127ati ta'' din l-imputazzjoni stante li ma \u0121ietx ippruvata.\\n\\n3.
  It-Tieni Imputazzjoni: \\\"Kif ukoll talli fit-3 ta'' Novembru 2010 \u0121ewwa Tas-Sliema,
  bil\u0127sieb li testor\u010bi flus f''xi \u0127a\u0121a o\u0127ra, jew li tag\u0127mel
  xi qlig\u0127, jew bil-\u0127sieb li \u0121\u0121ieg\u0127el lil persuni o\u0127ra
  tesegwixxi, tiddistru\u0121\u0121i, tqalleb, jew tag\u0127mel testment jew obligazzjoni
  bilmiktub, titolu jew garanzija, jew tag\u0127mel jew tonqos milli tag\u0127mel
  xi \u0127a\u0121a, heddidt li\\n\\ntag\u0127mel denunzja jew kwerela kontra. Jew
  li tag\u0127mel malafama lil Patrick Pace, Kunsillier fil-Kunsill Lokali ta'' Tas-Sliema,
  b''liema theddid wasalt fil-\u0127sieb tieg\u0127ek\\\"\\n\\nFin-nota tieg\u0127u
  tar-rinviju, l-Avukat \u0120enerali jindika essenzjalment l-artikolu 250(1) u lartikolu
  250(2) tal-Kapitolu 9 tal-Li\u0121ijiet ta'' Malta li ta\u0127thom tista'' tinstab
  \u0127tija ta'' din limputazzjoni fil-konfront ta'' l-imputat.\\n\\nFl-artikolu
  250(1) tal-Kodi\u010bi Kriminali jing\u0127ad is-segwenti:\\n\\nKull min, bil-\u0127sieb
  li jestor\u010bi flus jew xi \u0127a\u0121''o\u0127ra,jew li jag\u0127mel xi qlig\u0127,
  jew bil-\u0127sieb li j\u0121ieg\u0127el lil persuna o\u0127ra tesegwixxi, tiddistru\u0121\u0121i,
  tqalleb, jew tbiddel testment jewobligazzjoni bil-miktub, titolu jew garanzija,
  jew tag\u0127mel jewtonqos milli tag\u0127mel xi \u0127a\u0121a, ihedded li jag\u0127mel
  denunzja jewkwerela kontra, jew li jag\u0127ti malafama lil, dik il-persuna jewpersuna
  o\u0127ra, je\u0127el, meta jinsab \u0127ati, il-piena ta'' pri\u0121unerija minnsena
  sa erba'' snin.\\n\\nFl-artikolu 250(2) tal-Kodi\u010bi Kriminali jing\u0127ad is-segwenti:\\n\\nKemm-il  darba  b''dan  it-theddid  il-\u0127ati  jasal  fil-\u0127sieb
  tieg\u0127u, huwa je\u0127el il-piena ta'' pri\u0121unerija minn tmintax-il xahar
  sa \u0127ames snin.\\n\\nFis-sentenza l-Pulizija vs George Xuereb de\u010bi\u017ca
  mill-Qorti tal-Appell Kriminali fl-20 ta'' Frar 2020 ing\u0127ad li:\\n\\n\\\"Fis-sentenza
  fl-ismijiet ''Il-Pulizija (Spettur Joseph Mercieca Spettur Frank A. Tabone) Vs Ashraf
  Elbakry ta'' 51 sena iben Mahmoud u Suhad nee'' Alfadal, imwieled l-Egittu, nhar
  it-08 ta'' Dicembru 1962, residenti filFacilita Korrettiva ta'' Kordin u detentur
  tal-karta ta''l-identita'' 20113(A)'' gie kkunsidrat:\\n\\n''Illi l-legislatur permezz
  tat-terminologija uzata sabiex issawwar dana ir-reat fassal l-elementi kostituttivi
  tieghu fejn ghamel distinzjoni bejn l-intenzjoni rikjesta fir-reat tal-estorsjoni
  ta'' flus fejn allura l-malvivent qieghed jaghmel ir-rikatt tieghu ghal skopijiet
  ta'' qliegh jew lucro u dak fejn allura l-intenzjoni tar-rikattatur huwa biex igieghel
  lill- vittma tieghu taghmel jew tonqos milli taghmel xi haga.\\n\\nIlli fil-kawza
  il-Pulizija vs Edgar Apap deciza it-13 ta'' April 1957 il-Qorti kienet studjat funditus
  l-element tal-qliegh bhala bazi ghar-reat tar-rikatt meta qalet:\\n\\n\\\"Il-kelma
  ''qliegh'' fil-materja tirreferixxi ghal xi haga li ghandha valur patrimonjali,
  u mhux kompriz is-sens ta'' dik il-kelma kwalunkwe godiment jew pjacir, jew sodisfazzjon,
  anki mhux ta'' valur patrimonjali. Jekk l-iskop ta''l-agent kien dak ta'' sodisfazzjon
  personali biss sija pure riprovevoli, jonqos l-elment kostituttiv tar-rikatt.\\\"\\n\\nIlli,
  madanakollu, dina d-disposizzjoni tal-ligi kienet giet emendata permezz ta''l-Att
  numru III tal-2002, fejn dahhlu fis-sehh diversi emendi ghal Kodici Kriminali taghna.\\n\\nIlli
  bis-sahha ta''dina l-emenda l-legislatur ried jipprovdi sanzjoni ukoll filkazijiet
  fejn l-intenzjoni tar-rikattatur ma tkunx biss dik tal-qliegh finanzjarju jew ekonomiku
  jew ta'' xi gwadann iehor personali. Illi fil-laqgha tal-Kumitat tal- Kamra tar-Rapprezentanti
  ghall-Abbozz tal-Ligi dwar dawn l-emendi lOnor. Tonio Borg ighid hekk dwar l-iskop
  ta''l-emenda ghall-artikolu 250 in dizamina:\\n\\n\\\"Qabel ir-rikatt kien ikkonsidrat
  biss b\u0127ala att kriminali jekk kien iwassal g\u0127al gwadann ekonomiku, bdil
  jew distruzzjoni ta'' provvediment kuntrattwali jew inkella ta'' testment, pero`
  bl-emenda li qed nag\u0127mlu r-rikatt se jkun ipprojbit kriminalment g\u0127al
  kwalunkwe skop u se jkun meqjus b\u0127ala att kriminali, anke jekk, per e\u017cempju,
  ikun hemm theddida ta'' in\u0121urja jew ta'' malafama fil-konfront ta'' persuna.\\\"\\n\\nIlli
  ghalhekk bl-emenda introdotta kull persuna li taghmel rikatt fil-konfront ta'' persuna
  ohra u dana sabiex iggieghel lil dik il-persuna taghmel xi haga jew tonqos milli
  taghmel xi haga hija hatja ta'' dana ir-reat.''\\n\\nFis-sentenza fl-ismijiet ''Il-Pulizija
  (Spettur Raymond Aquilina) (Spettur Fabian Fleri) vs Edgar Publius Bonnici Cachia''
  gie kkunsidrat li:\\n\\n''Illi mill-provi prodotti jirrizulta ampjament li l-imputat
  kellu skop specifiku: dak li jkun jaf ghalfejn Farrugia temmet ir-relazzjoni ta''
  bejniethom. Jirrizulta ukoll li huwa agixxa bil-mod kif agixxa fil-konfront ta''
  Farrugia biex jilhaq dan il-ghan.\\n\\nIll pero l-artikolu 250 fuq kwotat jirrikjedi
  ukoll li biex l-imputat jilhaq dak l- iskop irid ikun ghamel theddied fil-konfront
  tal-vittma, u li dan ittheddied ikun li jag\u0127mel denunzja jew kwerela kontra,
  jew li jag\u0127ti malafama lil, dik il- persuna jew persuna o\u0127ra.\\n\\nIlli
  mill-provi prodotti jirrizulta li dak li \\\"hedded\\\" bih l-imputat kien li ser
  jipprezenta ruhu quddiem it-Tribunal Ekklesjastiku biex jixhed fil-proceduri ta''
  annullament ta'' Farrugia. Hu \\\"hedded\\\" ukoll li ser ikellem li xi persuni
  \\\"influwenti\\\" fit-Tribunal Ekklesjastiku u anke li ser iwassal biex Farrugia
  ma tiehux l-annullament. X''kien ser jghid l-imputat lil dawn in-nies, jew x''kien
  ser jixhed kieku gie accettat bhala xhud quddiem it-Tribunal Ekklesjastiku ma jirrizultax;
  ghalhekk ma jistax jinghad li huwa kien ser jaghmel xi malafama fil- konfront ta''
  Farrugia. Lanqas ma jirrizulta li l-imputat kien ser jaghmel xi denunzja jew kwerela
  kontra Farrugia.\\n\\nIlli f''dawn ic-cirkostanzi huwa mankanti element essenzjali
  tar-reat in ezami li ghalhekk ma jistax jissustixxi.\\n\\nMinn dak li jirrizulta
  mix-xhieda ta'' Mario Axiaq ghalkemm l-appellant talbu LM2000 ghax qallu li wahda
  min-nisa kienet tqila u anke heddu li jaqtalu rasu, minn imkien ma jirrizulta li
  heddu li jaghmel denunzja jew kwerela ''jew li jaghtiha malafama bhala hatja ta''
  reat jew ta'' fatt li jtellef il-gieh\\\"\\n\\nIlli l-Qorti sejra tanali\u017c\u017ca
  x-xhieda mog\u0127tija minn Patrick Pace f''dawn il-pro\u010beduri.\\n\\nPatrick
  Pace xehed li l-pro\u010beduri kriminali fil-konfront tieg\u0127u huma finali\u017c\u017cati
  u \u0127are\u0121 liberat. Spjega li fis-sena 2009 kien Kunsillier tal-Kunsill Lokali
  Sliema u li Nikki Dimech kien Sindku. Il-Kunsill Lokali kien iffurmat minn Martin
  Debono, Yves Cali, Cyrus Engerer, Edward Cuschieri, Sandra Camilleri, Julian li
  i\u017cda ma ftakarx kunjomha, Marianne li i\u017cda ma ftakarx kunjomha u jista
  wkoll kien hemm ukoll b\u0127ala kunsillier Nikolai. Sostna li fil-bidu tal-le\u0121islatura
  r-relazzjoni bejn il-kunsilliera kienet tajba i\u017cda eventwalment il-Kunsill
  spi\u010b\u010ba biex \u0121ie xolt. Il-Kunsilliera kienu jiltaqg\u0127u darba fixxahar
  u kienu jie\u0127du d-de\u010bi\u017cjonijiet li kien ikun hemm b\u017conn. Ix-xhud
  sostna li huwa dejjem mexa mal-linja tal-Partit tieg\u0127u u \u010bjoe l-Partit
  Nazzjonalista. Lil Raymond Cachia sar jafu g\u0127ax kien jg\u0127inu meta kien
  jag\u0127mel il-door to door visits.\\n\\nMuri dokument inserit a fol wie\u0127ed
  u sebg\u0127in sostna li dan huwa email li kien ir\u010bieva jumejn qabel ma \u017c\u017cewwe\u0121.
  Il-facebook message suppost li ntbag\u0127at Patrick Pace minn Valentina Rea. Meta
  qara dak il-messa\u0121\u0121 ma \u0127assux komdu. Min\u0127abba li dejjem mexa
  fuq il-linja tal-Partit, meta sar il-vot ta'' sfidu\u010bja fil-konfront tas-Sindku
  ta'' Nikki Dimech huwa kien ivvota kontra Nikki Dimech. Ix-xhud sostna li huwa kien
  issellef \u0127ames t''elef ming\u0127and Nikki Dimech. Dan is-self kien sar qabel
  ma huwa kien i\u017c\u017cewwe\u0121. Il-facebook message kien ir\u010bevih jumejn
  qabel ma \u017c\u017cewwe\u0121 (on the 14th i\u017cda ma jindikax ta'' liema\\n\\nxahar
  u sena) u qrah propju dakinhar li \u017c\u017cewwe\u0121 (on the 16th i\u017cda
  ma jindikax ta'' liema xahar u sena). Eventwalment sostna li huwa kien i\u017c\u017cewwe\u0121
  fis-19 ta'' Settembru 2010.\\n\\nIx-xhud ma ftakarx in-numru tal-mobile li huwa
  kellu dak i\u017c-\u017cmien.\\n\\nSostna li f''Settembru tas-sena 2010 huwa kien
  ir\u010bieva telefonata ming\u0127and Raymond Cachia u qallu li ried ikellmu. Ix-xhud
  informah li huwa kien sejjer g\u0127al laqg\u0127a u ftehmu li jiltaqg\u0127u hemmhekk.
  Eventwalment ix-xhud sab lill-imputat f''kantuniera f''Depiro Street tas-Sliema
  u informah li a\u0127jar ma jid\u0127olx g\u0127al laqg\u0127a g\u0127ax jekk jag\u0127mel
  dan, Nikki Dimech kien se jmur jg\u0127id li tah il-flus. G\u0127alhekk biex jipprote\u0121i
  r-reputazzjoni tieg\u0127u x-xhud g\u0127a\u017cel li ma jattendiex g\u0127al laqg\u0127a.\\n\\nRaymond
  Cachia kien barra l-karozza u fil-karozza kien hemm Nikki Dimech u Joven Hall. Eventwalment
  Joven Hall \u0127are\u0121 mill-karozza u x-xhud kellem lil Nikki Dimech wa\u0127du
  fil-karozza. Dakinhar Nikki Dimech kien irrabjat u anke talbu lura l-flus li kien
  silfu.\\n\\nIn Kontro-e\u017cami x-xhud sostna li dan l-episodju se\u0127\u0127
  wara l-vote of no confidence f''Nikki Dimech. Nikki Dimech kien irrabjat \u0127afna
  g\u0127alih g\u0127ax ivvota kontrih. Dan min\u0127abba li meta kien fil-b\u017conn,
  kien Nikki Dimech li kien kien g\u0127enu finanzjarjament biex ikun jista'' jag\u0127mel
  it-tie\u0121. Ix-xhud sostna li huwa g\u0127adu ma raddx lura l-ammont ta'' \u0127ames
  t''elef lura lil Nikki Dimech.\\n\\nValentina Ria kienet it-tfajla ta'' Nikki Dimech.\\n\\nIx-xhud
  sostna li dak i\u017c-\u017cmien huwa \u0127assu inkwetat minn Nikki Dimech g\u0127ax
  beda jib\u017ca li se j\u0127asarlu r-reputazzjoni tieg\u0127u billi joqg\u0127od
  jg\u0127id lin-nies li kien silfu l-flus.\\n\\nIx-xhud sostna li minn qabel ma kien
  se jmur g\u0127al laqg\u0127a, huwa kien konxju li Nikki Dimech kien se jimbarazzah.
  Dik ma kienx qalulu l-imputat Raymond Cachia biss. Kien ir\u010bieva email u anke
  kienu qalulu xi nies o\u0127ra li Nikki Dimech kien se jimbarazzah.\\n\\nIx-xhud
  sostna li huwa ma be\u017cax mill-imputat Raymond Cachia. Huwa kien qed jib\u017ca
  minn Nikki Dimech.\\n\\nRaymond Cachia kull ma g\u0127amel kien sempli\u010biment
  li kkomunikalu dak li kien di\u0121\u00e0 sema ming\u0127and terzi li kien se ji\u0121rilu
  jekk jid\u0127ol g\u0127al laqg\u0127a. Raymond Cachia ma kien qallu xejn \u0121did,
  \u0127lief dak li kien di\u0121\u00e0 sema'' ming\u0127and terzi. Dakinhar li kien
  kellmu Raymond Cachia, l-istess Raymond Cachia ma kienx kellmu b''rabja. Kienu tkellmu
  kif jitkellmu \u017cew\u0121t i\u0127bieb.\\n\\nIl-Qorti kkunsidrat li l-artikolu
  250 tal-Kodi\u010bi Kriminali jirrikjedi li biex l-imputat jinstab \u0127ati irid
  ikun g\u0127amel theddid fil-konfront tal-vittma, u li dan it-theddid ikun li jag\u0127mel
  denunzja jew kwerela kontra, jew li jag\u0127ti malafama lil, dik il-persuna jew
  persuna o\u0127ra. Mix-xhieda ta'' Patrick Pace stess ma jirri\u017cultax li l-imputat
  Raymond Cachia heddu li se jag\u0127mel denunja jew kwerela kontrih jew inkella
  li kien se jimmalafamah.\\n\\nIlli g\u0127alhekk din il-Qorti  ma hijiex se ssib
  lill-imputat \u0127ati ta'' din l-imputazzjoni stante li ma \u0121ietx ippruvata.\\n\\n4.
  It-Tielet Imputazzjoni: \\\"U aktar talli fl-istess data, lok u \u010birkostanzi
  u\u017cajt vjolenza sabiex i\u0121\u0121ieg\u0127el lil Patrick Pace Kunsillier
  fil-Kunsill Lokali ta'' Tas-Sliema, i\u0127alli ssir, jew jonqos milli jag\u0127mel
  xi \u0127a\u0121a, u b''liema g\u0127emil wasalt fil-\u0127sieb tieg\u0127ek.\\\"\\n\\nIlli
  fin-nota tieg\u0127u tar-rinviju, l-Avukat \u0120enerali jindika essenzjalment l-artikolu
  251(1) u l-artikolu 251(2) tal-Kapitolu 9 tal-Li\u0121ijiet ta'' Malta li ta\u0127thom
  tista'' tinstab \u0127tija ta'' din l-imputazzjoni fil-konfront ta'' l-imputat.\\n\\nFl-Artiklu
  251(1) tal-Kodi\u010bi Kriminali jing\u0127ad li:\\n\\n\\\"Kull min ju\u017ca vjolenza,
  inklu\u017c vjolenza morali u, jewpsikolo\u0121ika, u, jew sfurzar, sabiex i\u0121ieg\u0127el
  li xi \u0127add jag\u0127mel, i\u0127alli ssir, jew jonqos milli jag\u0127mel, xi
  \u0127a\u0121a, jew sabiex inaqqas l-abilitajiettal-persuna jew ji\u017cola tali
  persuna jew jillimita l-a\u010b\u010bess g\u0127all-flus,edukazzjoni jew impjieg,
  je\u0127el, meta jinsab \u0127ati, il-piena msemmija fis-subartikolu (1) tal-a\u0127\u0127ar
  artikolu qabel dan.\\\"\\n\\nFl-Artiklu 251(2) tal-Kodi\u010bi Kriminali jing\u0127ad
  li:\\n\\n\\\"Jekk  il-\u0127ati  jasal  fil-\u0127sieb  tieg\u0127u,  huwa  je\u0127el  il-piena
  msemmija fissubartikolu (2) tal-a\u0127\u0127ar artikolu qabel dan.\\\"\\n\\nIlli
  fil-Pulizija vs Andrew St. John de\u010bi\u017ca fl-24 ta'' Settembru 2019 ing\u0127ad
  li:\\n\\nAntonella St. John tispjega dak li skond hi kien jikkonstitwixxi l-abbuz
  mentali \\\"kelli nissaporta sa sebgha ta'' filghaxija b''hafna puntar ta'' swaba
  li alla hares naghmilu xi rapport jew xi haga ghax nista speci infottilu xogholu
  u li jkollhi konsegwenzi hziena jekk naghmilha\\\". Imbghad tkompli tiddeskrivi
  latteggajment tal-imputat l-ghada filghodu meta rritorna mix-xoghol. Madanakollu
  din il-qorti, tenut kont ta'' kif inhi formulata l-akkuza li tispecifika l-hin tar-reat
  addebitat lill-imputat, hi prekluza milli tikkunsidraha ulterjorment.\\n\\nIn kontro-ezami
  tkompli tispjega ghaliex hassitha mwegga'' bid-diskors talimputat \\\"sakemm qed
  jiekol qed jghajjarni tindahalx ja pulcinella....l-iktar li weggajt hu li kif dak
  il-platt li kelli jiena lestejtlu, l-pulcinella inbiddlet f''demel\\\".\\n\\nM''hemmx
  dubbju li aggettivi simili mliesna mill-imputat propju fil-konfront ta'' min qed
  jaghmel hiltu biex ma jonqosx mid-doveri tieghu, kemm bhala omm ta'' zewg uliedu
  kif ukoll bhala martu, huma gratwiti u dispregattivi. Iwegghu bla bzonn u certament
  ma jaghmlux gieh li min ilisienhom.\\n\\nIzda b''daqshekk jista'' jinghad li dawn
  wasslu sabiex titwettaq vjolenza psikologika fuqha?\\n\\nL-akku\u017ca ravvizata
  bl-artikolu 251(1) titkellem car. Dak li hu sancit hu ilvjolenza morali u, jew psikologika.
  Din il-Qorti ma tqis li b''dan il-kliem, blimpuntar ta'' swaba u t-theddida sottili
  biex ma taghmilx rapport kontra limputat, imgieba li inkluz l-argument u l-battibekki
  inizjali saret f''temp ta'' 4 sighat, jista'' jitqies li jikkostitwixxi vjolenza
  morali jew psikologika, ghalkemm certament hu atteggajment deplorevoli ghall-ahhar
  specjalment meta jitqies min kien qed ilissen tali kliem, liema kliem sar fil-konfront
  propju ta'' dik li kienet qed taghmel dmira mal-istess zewgha billi rat li jmur
  ghaxxoghol b''zaqqu mimlija. Il-Qorti trid issa tiddetermina jekk l-imgieba talimputat
  tinkwadrax fir-reat prospettat bl-artikolu 251(1) tal-Kodici Kriminali.\\n\\n...hu
  necessarju li l-att kriminuz li jikkostitwixxi vjolenza psikologika ma jkunx xi
  att izolat izda \\\"a course of conduct rather than a single event. It is intended
  to capture the criminal nature of an abusive pattern of behaviour occurring over
  time.\\\"\\n\\nKif di\u0121a ng\u0127ad aktar il-fuq, fix-xhieda tieg\u0127u Patrick
  Pace sostna li dak i\u017c-\u017cmien huwa \u0127assu inkwetat minn Nikki Dimech
  g\u0127ax beda jib\u017ca li se j\u0127assarleu r-reputazzjoni tieg\u0127u billi
  joqg\u0127od jg\u0127id lin-nies li kien silfu l-flus.\\n\\nPatrick Pace sostna
  li minn qabel ma kien se jmur g\u0127al laqg\u0127a, huwa kien konxju li Nikki Dimech
  kien se jimbarazzah. Dik ma kienx qalulu l-imputat Raymond Cachia biss. Kien ir\u010bieva
  email u anke kienu qalulu xi nies o\u0127ra li Nikki Dimech kien se jimbarazzah.\\n\\nPatrick
  Pace sostna li huwa ma be\u017cax mill-imputat Raymond Cachia. Huwa kien qed jib\u017ca
  minn Nikki Dimech.\\n\\nRaymond Cachia kull ma g\u0127amel kien sempli\u010biment
  li kkomunikalu dak li kien di\u0121\u00e0 sema ming\u0127and terzi li kien se ji\u0121rilu
  jekk jid\u0127ol g\u0127al laqg\u0127a. Raymond Cachia ma kien qallu xejn \u0121did,
  \u0127lief dak li kien di\u0121\u00e0 sema'' ming\u0127and terzi. Dakinhar li kien
  kellmu Raymond Cachia, l-istess Raymond Cachia ma kienx kellmu b''rabja. Kienu tkellmu
  kif jitkellmu \u017cew\u0121t i\u0127bieb.\\n\\nG\u0127alhekk mix-xhieda ta'' Patrick
  Pace jirri\u017culta li l-imputat Raymond Cachia ma wettaq l-ebda forma ta'' vjolenza
  fuq l-istess Patrick Pace. La vjolenza fi\u017cika, la vjolenza psikolo\u0121ika
  u lanqas vjolenza morali. G\u0127alhekk din il-Qorti m''hijiex se ssib lillimputat
  \u0127ati ta'' din l-imputazzjoni stante li ma \u0121ietx ippruvata.\\n\\nC. L-Istqarrijiet
  tal-Imputat\\n\\nFit-trattazzjoni finali tieg\u0127u l-imputat sostna li l-istqarrijiet
  rilaxxati minnu lil pulizija g\u0127andhom ji\u0121u skartati u dan g\u0127aliex
  kienu se jippre\u0121udikaw il-ka\u017c tieg\u0127u u konsegwenzjalment kienu se
  jwasslu g\u0127al ksur tad-drittijiet fundamentali tieg\u0127u.\\n\\nStante l-fatt
  li l-istqarrijiet tal-imputat ma ppre\u0121udikawx il-ka\u017c tieg\u0127u, tant
  illi huwa ma huwiex se jinstab \u0127ati tal-imputazzjonijiet dedotti fil-konfront
  tieg\u0127u, din il-Qorti ssostni li dawn l-istqarrijiet ma g\u0127andhomx ji\u0121u
  skartati.\\n\\nD. Konklu\u017cjoni\\n\\nG\u0127al dawn il-motivi, il-Qorti qed issib
  lill-imputat Raymond Cachia detentur tal-karta tal-identita'' bin-numru 251162(M)
  mhux \u0127ati tal-imputazzjonijiet mi\u0121juba kontra tieg\u0127u u qieg\u0127da
  tilliberah minnhom.\\n\\nOnor. Dr. Kevan Azzopardi Ma\u0121istrat\\n\\nJosanne Gauci
  Deputat Re\u0121istratur\\n\\n< Sentenza Finali >\\n\\n---------------------------------TMIEM---------------------------------\"",
  "\"Qorti tal-Ma\u0121istrati (G\u0127awdex) \u0120urisdizzjoni Superjuri Sezzjoni
  Familja\\n\\nMa\u0121istrat Dottor Brigitte Sultana LL.D, LL.M (Cardiff) Adv. Trib.
  Eccl. Melit.\\n\\nIllum,  il-\u0120img\u0127a 28, ta'' Mejju, 2021\\n\\nRikors \u0120uramentat
  numru:- 2/2012 BS\\n\\nAA\\n\\nvs\\n\\nBB\\n\\nIl-Qorti;\\n\\nRat ir-rikors \u0121uramentat
  fejn l-attur ippremetta:\\n\\n1. Illi l-kontendenti \u017c\u017cew\u0121u fl-ewwel
  ta'' Awwissu tas-sena elfejn u tlieta u mi\u017c-\u017cwie\u0121 tag\u0127hom kellhom
  tifla wa\u0127da li jisimha CC u li twieldet fit-tletin ta'' Marzu tas-sena elfejn
  u tmienja (2008);\\n2. Illi l-\u0127ajja matrimonjali ta'' bejn il-kontendenti \u0121iet
  resa mpossibbli min\u0127abba li \u017c-\u017cwie\u0121 tag\u0127hom tkisser irrimedjabbilment
  u min\u0127abba li je\u017cistu l-elementi li trid il-li\u0121i sabiex ti\u0121i
  pronunzjata sseparazzjoni bejn il-kontendenti;\\n\\n3. Illi r-rikorrenti jixtieq
  illi l-komunjoni ta'' l-akkwisti e\u017cistenti bejniethom ti\u0121i likwidata u
  li ji\u0121u restitwiti lilu l-beni parafernali;\\n4. Illi r-rikorrenti \u0121ie
  debitament awtorizzat sabiex jippro\u010bedi bl-istanti permezz tad-digriet appositu
  ta'' dina l-Onorabbli Qorti datat lewwel ta'' Di\u010bembru tas-sena elfejn u \u0127dax
  li kopja tieg\u0127u qed ti\u0121i hawn annessa u mmarkata b\u0127ala dokument ''A'';\\n\\nTalab
  li din l-Onorabbli Qorti:\\n\\n1. Tiddikjara u tippronunzja s-separazzjoni personali
  bejn ilkontendenti u dana min\u0127abba tortijiet unikament u esklussivament imputabbli
  lill-intimat g\u0127ar-ragunijiet hawn fuq imsemmija.\\n2. Tiffissa r-retta alimentari
  pagabbli li g\u0127andha tigi prestata millintimata lir-rikorrenti.\\n3. Tikkundanna
  lill-intimata t\u0127allas tali retta alimentari kif iffissata minn din l-Onorabbli
  Qorti.\\n4. Tordna li l-kura u l-kustodja ta'' bintu l-minuri CC tkun wa\u0127da
  kon\u0121unta u subordinarjament tiffissa l-modalitajiet tal-a\u010b\u010bess illi
  rrikorrenti g\u0127andu jkollu g\u0127all-istess bintu l-minuri CC.\\n5. Tiddikjara
  illi l-partijiet iddekadew mid-drittijiet ta'' eredita'' re\u010bipro\u010bi.\\n6.
  Tiddikjara xolta l-komunjoni ta'' l-akkwisti e\u017cistenti bejn il-partjiet, tillikwida
  l-istess u tqassamha bejn il-partijiet u dan wara li ji\u0121u dentifikat l-beni
  parafernali appartenenti lir-rikorrenti.\\n7. Tapplika kontra l-intimata nterament
  jew in parti d-disposizzjonijiet ta'' l-Artikolu tmienja u erbg\u0127in sa wie\u0127ed
  u \u0127amsin tal-Kodi\u010bi \u010aivili.\\n\\nBl-ispejje\u017c u bl-in\u0121unzjoni
  tal-intimata minn issa g\u0127as-subizzjoni.\\n\\nRat ir-risposta \u0121uramentata
  tal-konvenuta fejn e\u010b\u010bepiet:\\n\\n1. Illi hija taqbel li \u017c-\u017cwie\u0121
  bejn il-kontendenti tkisser irrimedjabilment u g\u0127andha ti\u0121i pronunzjata
  s-separazzjoni personali bejniethom. B''dan pero'', li r-responsabbilta'' g\u0127at-tkissir
  ta'' dan i\u017c-\u017cwie\u0121 g\u0127andha ti\u0121i akkollata nterament lill-attur,
  g\u0127aliex kif sejjer jirri\u017culta dettaljatament fit-trattazzjoni tal-kaw\u017ca,
  kien huwa, blim\u0121ieba rra\u0121onevoli tieg\u0127u u s-sevizzi u n\u0121urji
  gravi li huwa kkommetta fil-konfront ta''martu, li ta lok g\u0127al dan it-tkisser
  ta\u017c\u017cwie\u0121.\\n2. Illi hija tissottometti bir-rispett ukoll, li l-kura
  u kustodja tal-bint minorenni g\u0127andha ti\u0121i afdata unikament u esklussivament
  f''idejn l-esponenti, g\u0127aliex l-esperjenza li minnha g\u0127addiet l-esponenti
  turi li l-attur mhuwiex persuna idonea sabiex ikollu l-kustodja ta'' bintu u g\u0127aliex
  ukoll fil-passat kull meta l-esponenti kellha b\u017conn xi tip ta'' g\u0127ajnuna
  fil-kura u l-upbringing tal-bint, hija qatt ma sabitha ming\u0127and \u017cewg\u0127a,
  u ta'' dan sejra tippre\u017centa provi ddettaljati filmori tal-kaw\u017ca.\\n3.
  Illi t-talba ta'' l-attur g\u0127all-manteniment ming\u0127and martu hija wa\u0127da
  manifestament infondata.  L-attur ja\u0127dem b\u0127ala full time teacher, u barra
  minn hekk iwettaq xog\u0127ol ta'' lezzjonijiet tal-privat li jirrendulu paga li
  kwa\u017ci kwa\u017ci ti\u017cboq il-paga tieg\u0127u uffi\u010b\u010bjali  -  anke
  jekk fil-formola tat-taxxa fuq id-d\u0127ul tieg\u0127u, l-attur ma jiddikjara xejn
  minn dan il-qlieg\u0127.  Il-fatt, minnu nnifsu, li l-attur g\u0127amel talba b\u0127al
  din, ikompli jikkonferma dak li l-esponenti llum tg\u0127almet a spejje\u017c tag\u0127ha
  dwar l-iskop li \u017cew\u0121ha kellu meta \u017c\u017cewwigha  - \u010bioe'' li
  huwa ra lill-esponenti b\u0127ala meal ticket g\u0127al \u0127ajtu kollha.  Ta''
  dan ukoll l-esponenti sejra tippre\u017centa provi ddettaljati fil-kors tal-\u0121bir
  tal-provi.\\n\\n4. L-esponenti taqbel li l-komunjoni ta'' l-akkwisti bejn il-kontendenti
  ti\u0121i likwidata u divi\u017ca skont il-li\u0121i, taqbel li kull parti g\u0127andha
  tirrinunzja g\u0127ad-drittijiet ereditarji kollha fuq is-successjoni tal-parti
  l-o\u0127ra.\\n5. Illi dwar it-tifla minorenni, l-esponenti t\u0127oss li l-manteniment
  li lattur qed jg\u0127addi lilha mhuwiex wie\u0127ed adegwat fi\u010b-\u010birkostanzi
  partikolari tal-ka\u017c.  Kont me\u0127ud tad-d\u0127ul rispettiv tal-partijiet
  u talb\u017connijiet tat-tifla, l-esponenti temmen li retta alimentari ta'' mitejn
  euro (200) fix-xahar hija wa\u0127da rri\u017corja u g\u0127all-kuntrarju, g\u0127andha
  tkun almenu d-doppju.\\n\\n6. Issottomettiet illi:\\n\\na. L-ewwel talba tal-attur
  g\u0127andha tintlaqa'' b''dan li g\u0127andu ji\u0121i ddikjarat li s-separazzjoni
  personali bejn il-partijiet hija mputabbli g\u0127al tort u nuqqasijiet esklussivament
  tal-attur u mhux vice versa.\\nb. It-tieni u t-tielet talbiet tal-attur g\u0127andhom
  ji\u0121u mi\u010b\u0127uda.\\nc. Ir-raba talba g\u0127andha ti\u0121i mi\u010b\u0127uda
  u minflok din l-Onorabbli Qorti g\u0127andha takkorda l-kura u l-kustodja tal-bint
  unikament lill-esponenti, kif ukoll tiffissa l-\u0127inijiet tal-a\u010b\u010bess
  favur il-missier u l-modalitajiet li bihom dak l-a\u010b\u010bess g\u0127andu ji\u0121i
  e\u017cer\u010bitat.\\nd. Din l-Onorabbli Qorti g\u0127andha fl-istess waqt tiffissa
  r-retta alimentarja li g\u0127andha tit\u0127allas mill-missier lill-omm fl-interess
  tal-bint minorenni, u tiffissa l-modalitajiet li bihom dik ir-retta alimentarja
  g\u0127andha tithallas mill-missier.\\ne. Il-\u0127ames u s-sitt talbiet g\u0127andhom
  ji\u0121u milqug\u0127a.\\nf. Fid-dawl tal-verbal redatt fl-udjenza tal-15 ta''
  Marzu 2012 isseba'' talba g\u0127andha ti\u0121i mi\u010b\u0127uda.\\n\\n7. Salvi
  risposti ulterjuri fid-dritt u fil-fatt.\\n\\nRat  ir-rikors tal-attur datat 5 ta''
  Ottubru 2016 fejn wara li ppremetta li lpartijiet ilhom de facto separati g\u0127al
  aktar minn erba'' (4) snin u illi lpartijiet waslu sabiex jiffirmaw il-kuntratt
  ta'' separazzjoni bejniethom, talab lill-Qorti sabiex tikkonverti l-pro\u010beduri
  minn dawk ta'' separazzjoni g\u0127al dawk ta'' divorzju ai termini tal-Artikolu
  66F tal-Kap 16 tal-Li\u0121ijiet ta'' Malta u konsegwentement tg\u0127addi sabiex
  tippronunzja d-divorzju bejn il-partijiet 1 .\\n\\nRat is-sentenza mog\u0127tija
  fis-16 ta'' Novembru 2016 minn din il-Qorti kif dak inhar presjeduta, fejn wara
  li ddikjarat bhala sodisfatti lkundizzjonijiet ma\u0127suba fl-Artikolu 66B tal-Kap
  16 tal-Li\u0121ijiet ta'' Malta, laqg\u0127et it-talba tal-attur kif dedotta fir-rikors
  tieg\u0127u tal-5 ta'' Ottubru 2016 2 .\\n\\nRat id-dokumenti u l-atti kollha.\\n\\nIkkunsidrat\\n\\nIl-Qorti
  rat l-Artikoli 66 A, 66 B, 66 C tal-Kap. 16 tal-Li\u0121ijiet ta'' Malta.\\n\\nMill-atti
  jirri\u017culta illi l-partijiet ottjenew is-separazzjoni personali in forza ta''
  kuntratt ta'' separazzjoni tas-sbatax (17) ta'' Frar tas-sena elfejn u wie\u0127ed
  u g\u0127oxrin (2021) fl-atti tan-Nutar Dottor Valerie Said.\\n\\nIlli l-partijiet
  ilhom ferm aktar minn erba'' snin separati u ma hemm l-ebda prospett ra\u0121onevoli
  li l-partijiet jirrikon\u010biljaw.\\n\\nIlli bejn il-partijiet ma te\u017cisti
  l-ebda pendenza u hlasijiet dovuti lil xulxin.\\n\\n1 A fol. 790, Vol. IV tal-process.\\n\\n2
  A fol. 792 et seq, Vol. IV tal-process.\\n\\nJirri\u017culta g\u0127alhekk illi
  \u0121ew soddisfatti l-kundizzjonijiet me\u0127tie\u0121a sabiex il-Qorti tippronunzja
  d-divorzju bejn il-partijiet.\\n\\nDecide.\\n\\nG\u0127aldaqstant, u g\u0127ar-ragunijiet
  premessi, il-Qorti filwaqt li tilqa'' t-talbiet ta\u2019 l-attur, tippronunzja d-divorzju
  bejn il-partijiet u tordna lir-Re\u0121istratur\\n\\ntal-Qorti sabiex, fi \u017cmien
  xahar millum, jav\u017ca lid-Direttur tar-Re\u0121istru\\n\\nPubbliku bid-divorzju
