  Johansens gt. 14\\n9296 TROMS\u00d8\\nTelefon: 77 75 04 00\"", "\"Suttungteatret\\n\\nSuttungteatret
  er en studiesscene p\u00e5 Tangen ved Mj\u00f8sa, og er en av virksomhetene innen
  Ingeborg Refling Hagens kulturarbeid. Dette arbeidet har til hensikt \u00e5 gi folket
  tilbake forbindelsen b\u00e5de med kulturavren og den kunst som skapes idag. I 1948
  fikk arbeidet navnet Suttung etter skaldemjoden Odin drakk. Det legges vekt p\u00e5
  studiesirkler, opplesningsgrupper og teatergrupper for voksne og barn. M\u00e5letsettingen
  er \u00e5 bevist gj\u00f8re menneskene og frigj\u00f8re uttrykksevnen.\\n\\nI 1965
  fikk Suttungteatret fast scene p\u00e5 Tangen Samfunnshus og har siden drevet kontinuerlig
  teatervirksomhet med innstuderinger og forestillinger. Mest kjent er teatret for
  sine store oppsetninger av Wergelands og Kincks dramatikk, men har ved siden av
  dette satt opp en rekke andre skuespill og p\u00e5tatt seg mange bestillingsoppdrag.\\n\\nSuttungteatret
  f\u00e5r fast st\u00f8tte fra stat, kommune og fylkeskommune, men har forel\u00f8pig
  ingen \u00f8konomisk mulighet til \u00e5 l\u00f8nne noen av sine 50 faste skuespillere.
  Teaterarbeidet foreg\u00e5r derfor i helgene, for de fleste vedkommende ved siden
  av annet l\u00f8nnet arbeid.\\n\\nN\u00e6rmere opplysninger om teatret f\u00e5s
  ved henvendelse til Suttungteatret - 2313 Tangen, tlf. (065) 82 172.\\n\\nHva om
  Norges gr\u00f8nne dalen\\ngjestmildt \u00e5pnet dem sin bunn?\\nHva om engang iblant
  dets svale blod\\nfikk litt av det orientale?\\nDa m\u00e5 kj\u00e6rlighet kun befale,\\nikke
  lovenes l\u00f8vemunn.\\n\\nH.A.W.\\n\\nHENRIK WERGELAND\\n\\nJ\u00f8dinnen\\n-elleve
  blomstrende tornekvister\\nen buket lyriske dikt, enaktere og prosa.\\n\\nSuttungteatret\\n\\nVed
  grundig \u00e5 belyse et annet folks egenart lar Wergeland oss forst\u00e5 hvilke
  verdier vi kan f\u00e5 del i ved \u00e5 \u00e5pne oss mot andre. Vi blir gang p\u00e5
  gang konfrontert med virkningene av v\u00e5rt sneversyn og f\u00e5r se hvilke virkninger
  forf\u00f8lgelse og uforstand har for det enkelte utsatte menneske. Wergeland viser
  ogs\u00e5 hvordan den forfulgte noen ganger makter \u00e5 svare med et helt motsatt
  sinnelag, og hans framtidsh\u00e5p knyttes til det sinnet som makter \u00e5 forsone
  og forst\u00e5, tross alt.\\n\\nDikterens egen kamp for at frihet og rettferdighet
  ogs\u00e5 skal gjelde for andre folkegrupper enn v\u00e5r egen, g\u00e5r som en
  r\u00f8d tr\u00e5d gjennom verket. Han kan gripes av mismot n\u00e5r han ser ondskapen
  og uforstanden rundt seg, men samtidig har han et lunt humoristisk sideblikk til
  sine landsmenn, som i den satiriske \\\"L\u00f8nnen og granen\\\".\\n\\nI en scene
  der en protestantisk, en katolsk og en j\u00f8disk kvinne m\u00f8tes p\u00e5 kirkeg\u00e5rden,
  heter det at her om ikke noe annet sted, m\u00e5 menneskene kunne innromme sin felles
  tilh\u00f8righet og avhengighet av hverandre. For oss alle er d\u00f8den en felles
  skjebne, og de fattige sekundene vi lever er for dyrebare til \u00e5 sloes bort
  i hat og intoleranse. Kirkeg\u00e5rden skulle minne oss om dette. \\\"Men skal flammene
  og sv\u00e6rdet rase utenfor gjerdet? Hva er vel den hele klode annet enn en kirkeg\u00e5rd?\\\"\\n\\n\\\"J\u00f8dinnen\\\"
  kom ut h\u00f8sten 1844, det \u00e5ret sp\u00f8rsm\u00e5let om j\u00f8denes adgang
  til Norge ble behandlet - og avvist - av Stortinget for annen gang. Den s\u00e5kalte
  \\\"jodeparagrafen\\\" i Grunnloven, som nektet j\u00f8dene adgang til landet, ble
  opphevet noen \u00e5r etter Wergelands d\u00f8d.\\n\\n**HENRIK WERGELAND:**\\n\\n**J\u00f8dinnen**\\n-
  elleve blomstrende tornekvister\\n\\n|   |   |\\n|---|---|\\n| I. | Tornekvister?
  |\\n| II. | Blodet |\\n| III. | M\u00f8drene |\\n| IV. | Den lykkelige viv |\\n|
  V. | Sjelekamp og seier |\\n| VI. | Kvinnene p\u00e5 kirkeg\u00e5rden |\\n| VII.
  | Drengen ved \\\"Bl\u00e5porten\\\" |\\n| VIII. | R\u00f8st i \u00f8rkenen |\\n|
  IX. | Jeg er nu s\u00e5dan jeg! (Stats\u00f8konomisk) |\\n| X. | F\u00f8lg kallet!
