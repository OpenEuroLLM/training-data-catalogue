  "\"Oppsummering fra novemberm\u00f8te 2019\\n\\nDSA \u00e5pnet m\u00f8tet og ga
  en oversikt over aktuelle saker seksjon medisinsk str\u00e5lebruk har jobbet med
  siste \u00e5r.\\n\\nSpesielt i \u00e5r, var at en representant fra Helse- og omsorgsdepartementet
  ogs\u00e5 deltok. Representanten presenterte hvordan departementene styrer direktoratene,
  og spesielt DSA.\\n\\nDe ulike helseregionene presenterte sine arbeidsomr\u00e5der
  siste \u00e5r. Flere aktuelle temaer engasjerte publikum, spesielt nevnes \u00abEn
  blyfri hverdag\u00bb, et prosjekt for \u00e5 konstruere god skjerming av operat\u00f8r
  ved intervensioner, som ikke hemmer operat\u00f8ren i arbeidet og er enkelt og sette
  opp, og erfaringene rundt bygging av PET-senteret ved UNN, der det ble gjort oppmerksom
  p\u00e5 at str\u00e5levernkoordinatorer m\u00e5 v\u00e6re involvert, spesielt i
  prosessen ved bygging av fordr\u00f8yningstanker. Det ble ogs\u00e5 presentert et
  arbeid med \u00e5 m\u00e5le p\u00e5 skjerming av gonader, og i den forbindelse ble
  det nevnt et nordisk statement p\u00e5 temaet. Aktuell link: https://www.dsa.no/filer/e023de5224.pdf\\n\\nP\u00e5
  programmet p\u00e5 novemberm\u00f8te 2019 var temaet \u00abKlinisk revisjon\u00bb
  satt opp spesielt. DSA presenterte kort kravet i str\u00e5levernforskriften, og
  hva som forst\u00e5s med klinisk revisjon. Metoden er beskrevet, men hva er godt
  nok? Svaret fra DSA er at det viktigste med kliniske revisjoner er kvalitetsforbedring.\\n\\nTre
  helseforetak fortalte om sitt arbeid med kliniske revisjoner, og publikum fikk beskrevet
  et par eksempler p\u00e5 hvordan kliniske revisjoner kan gjennomf\u00f8res. Ved
  h\u00e5ndsopprekning viste det seg at det er mange helseforetak som har gjennomf\u00f8rt
  minst \u00e9n klinisk revisjon, men det har v\u00e6rt vanskelig og tidkrevende \u00e5
  organisere arbeidet i helseforetakene. Til slutt informerte DSA om at HERCA vurderer
  \u00e5 lage info med eksempler for \u00e5 tydeliggj\u00f8re metodikken.\"", "\"GRUVEMINNER
  I LONGYEARBYEN OG HIORTHHAMN\\n\\nFredete taubanebukker: Tilstand og bevaring\\n\\nAnne-Cathrine
  Flyen, NIU og Johan Mattsson, Mycoteam AS\\n\\n# Sammendrag\\n\\nNorsk institutt
  for kulturminneforskning (NIKU) og Mycoteam har gjennom feltarbeid p\u00e5 Svalbard
  siden 2002 registrert at r\u00e5tesoppskader er vanlig forekommende, s\u00e6rlig
  i forbindelse med treverk som ligger i bakkekontakt. I 2010 og 2012 fikk vi takket
  v\u00e6re st\u00f8tte fra Svalbard milj\u00f8vernfund anledning til \u00e5 unders\u00f8ke
  de 9 taubanebukkene i den gamle gruvebyen Hiorthhamn og ca. 50 taubanebukker i Longyearbyen.
  Resultatet av dette arbeidet viser at det er store svekkelser i mange bukker for\u00e5rsaket
  av r\u00e5tesoppskader. Majoriteten av disse skadene er tiln\u00e6rmet umulig \u00e5
  oppdage visuelt fra utsiden. De er dessuten sv\u00e6rt vanskelige \u00e5 klarelegge
  ved hjelp av tradisjonelle unders\u00f8kelsesmetoder. Det ble derfor utviklet en
  egen unders\u00f8kelsesprosedyre ved hjelp av spesielt teknisk utstyr (r\u00e5tedrill).
  Denne unders\u00f8kelsen viste at det var stor variasjon i omfang av r\u00e5tesoppskader
  i de unders\u00f8kte bukkene, fra tiln\u00e6rmet friske materialer til meget omfattende
  r\u00e5teskader med alvorlig nedbryting. Skadene opptrer tilsynelatende tilfeldig,
  og det er umulig \u00e5 avklare tilstedev\u00e6relsen av eventuelle skader uten
  en ing\u00e5ende unders\u00f8kelse. Rapporten inneholder en oversikt over bukkenes
  tilstand og en liste med forslag til tiltak.\\n\\n# Abstract\\n\\nNorwegian Institute
  for Cultural Heritage Research (NIKU) and Mycoteam have been working in the fields
  at Svalbard registering fungal decay since 2002. During this period it has become
  obvious that fungal decay is a common problem even in the Arctic climate. Damages
  are especially occurring in wood in contact with the soil. In 2010 and 2012 NIKU
  and Mycoteam got the opportunity to examine the cable car bucks in the old mining
  city of Hiorthhamn and in Longyearbyen thanks to funding from Svalbard environmental
  protection fund. The result from this examination shows that there are large impairments
  in many of the cable car bucks due to fungal decay. Most of the damages are impossible
  to detect from the outside as the decay works inside the wooden columns. This decay
  is difficult to detect using ordinary methods, thus we used a rot detect drill.
  The inspections showed great variation of decay, and we found beams and columns
  with no traces of decay and cable car bucks severely damaged by fungal decay. The
  damages are seemingly occurring without any special pattern, and it is almost impossible
  to detect the damages without thorough inspections. This report contains a summary
  of the inspections and a list of proposed actions.\\n\\nForord\\n\\nTaubanebukkene
  i Longyearbyen er blant de mest markante kulturminnene i byen. Rekkene av bukker
  er blant de mest synlige sporene etter gruvevirksomheten, og viser med all tydelighet
  ogs\u00e5 i dag hvor kraftig preg gruvevirksomheten satte p\u00e5 byen og det n\u00e6rmeste
  omland.\\n\\nOgs\u00e5 taubanebukkene i den gamle gruvebyen i Hiorthhamn er viktige
  minnesmerker over tidligere tiders slit og strev for \u00e5 frakte kullet ut av
  gruva og frem i dagen.\\n\\nLikevel har disse kulturminnene etter v\u00e5r mening
  ikke f\u00e5tt den oppmerksomheten de fortjener. Den omfattende kulturminneplanen
  \u00abTeknisk industrielle kulturminner i Longyearbyen og omegn\u00bb sier lite
  om taubanebukkene, og syntes ogs\u00e5 \u00e5 ta for gitt at de klarer seg selv.\\n\\nMen
  tidens tann t\u00e6rer. Dette er utsatte konstruksjoner, og de trenger ogs\u00e5
  ettersyn og vedlikehold. V\u00e5re unders\u00f8kelser viser at mange av bukkene
  ikke har det s\u00e6rlig bra, og at det haster med \u00e5 finne ut av hvordan de
  virkelig har det og hva som faktisk trengs for fortsatt \u00e5 holde dem p\u00e5
  beina.\\n\\nSvalbards Milj\u00f8vernfund har gjort det mulig for Norsk Institutt
  for Kulturminneforskning og Mycoteam \u00e5 foreta unders\u00f8kelsene som er beskrevet
  i denne rapporten. Vi takker s\u00e5 mye for st\u00f8tten, og det er v\u00e5rt h\u00e5p
  at disse viktige kulturminnene kan prioriteres i tiden fremover.\\n\\nOslo, 1. juni
  2013\\n\\nAnne-Cathrine Flyen\\n\\n# Innholdsfortegnelse\\n\\n1. Sammendrag ...........................................................................................................
