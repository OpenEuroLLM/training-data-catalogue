  p\u00e5 www.lostat.no\\n\\nOmstilling i Spekter\\n\\nQuality Hotel Gardermoen\\n\\nKurset
  skal gi deltakerne forst\u00e5else for omstillingsprosesser. Temaer som belyses
  er: Hva er omstilling, hvilke lover og avtaler regulerer omstilling og medbestemmelse
  i spekter og hvordan p\u00e5virker omstilling oss tillitsvalgte og verneombudenes
  rolle i omstillingsprosessen.\\n\\nM\u00e5lgruppe: Tillitsvalgte og medlemmer i
  Spektervirksomhetene.\\n\\nInnleder: Arild Kjempekjenn, LO Stat\\n\\nP\u00e5meldingsfrist:
  17. oktober 2017\\n\\nP\u00e5melding via kurssidene p\u00e5 www.lostat.no\\n\\nP\u00e5melding
  via kurssidene p\u00e5 www.lostat.no\"", "\"Neste generasjons h\u00f8rselvern\\n\\nMed
  Safe Sounds produkter beskytter du h\u00f8rselen din i st\u00f8yende milj\u00f8er,
  samtidig som du kan snakke med andre uten \u00e5 ta h\u00f8rselvernet ut.\\n\\nMed
  formst\u00f8pt h\u00f8rselvern h\u00f8rer du bare det du skal h\u00f8re\\n\\n\u00d8rer
  er like forskjellige som fingeravtrykk. Du trenger derfor et h\u00f8rselvern som
  er spesialtilpasset til ditt bruk. Vi tar avst\u00f8pning av \u00f8ret ditt for
  \u00e5 kunne forme h\u00f8rselvernet riktig. Produktet blir dermed unikt og kan
  bare brukes av deg.\\n\\n\\\"Taleproppen\\\" ClearSound\\n\\nClearSound h\u00f8rselvern
  reduserer st\u00f8yen p\u00e5 arbeidsplassen og slipper igjennom tale og varsellyder.\\n\\nH\u00f8rselvernet
  er utstyrt med en ny og patentert st\u00f8yfilterl\u00f8sning som slipper igjennom
  tale og arbeidslyder du trenger \u00e5 h\u00f8re for \u00e5 kunne fungere p\u00e5
  arbeidsplassen din. Du m\u00e5 med andre ord ikke fjerne h\u00f8rselvernet hver
  gang noen vil snakke med deg.\\n\\nClearSound er kompakt og har sm\u00e5 h\u00e5ndtak
  som gj\u00f8r det enkelt \u00e5 sette h\u00f8rselvernet inn eller ta det ut. Det
  er utf\u00f8rt i mykt, gjennomsiktig materiale og kan leveres med snor.\\n\\nAvhengig
  av st\u00f8yniv\u00e5et, kan du velge mellom fire filtertyper.\\n\\n\\\"Kj\u00f8reproppen\\\"
  Biopact FlexComfort\\n\\nBiopact FlexComfort h\u00f8rselvern stenger ute skadelig
  st\u00f8y fra vind og motor n\u00e5r du er ute med mc-en, speedb\u00e5ten, konkurransebilen,
  go-karten eller kabrioleten.\\n\\nH\u00f8rselvernet er opprinnelig utviklet for
  \u00e5 beskytte nederlandsk trafikkpoliti p\u00e5 motorsykkel. Vinden som passerer
  hjelmen under kj\u00f8ring, gir kraftig st\u00f8y, som kan f\u00f8re til h\u00f8rselsskade
  p\u00e5 lang sikt. For eksempel er 89 dB st\u00f8y skadelig n\u00e5r du utsettes
  for det \u00e9n time i d\u00f8gnet. I 100 km/t p\u00e5 motorsykkel kan st\u00f8yniv\u00e5et
  rundt \u00f8rene n\u00e5 95 dB.\\n\\nBiopact FlexComfort er kompakt og har sm\u00e5
  h\u00e5ndtak som gj\u00f8r det enkelt \u00e5 sette h\u00f8rselvernet inn eller ta
  det ut. Det er utf\u00f8rt i mykt materiale og stikker ikke ut av \u00f8regangen.
  Derfor kommer det ikke borti hjelmen. Det kan ogs\u00e5 leveres med snor.\\n\\nAvhengig
  av st\u00f8yniv\u00e5et, kan du velge mellom to filtertyper.\\n\\nDempningsverdier  (NEN
  Norm 352-2)\\n\\nHML SNR\\n\\nML01\\n\\nMM02\\n\\n28\\n\\n27\\n\\n26\\n\\n24\\n\\n25\\n\\n22\\n\\n28\\n\\n27\\n\\n\\\"Musikkproppen\\\"
  ER FlexComfort\\n\\nER FlexComfort h\u00f8rselvern slipper igjennom godlydene fra
  konserten og stenger ute alle skadelige lyder. Denne \\\"musikkproppen\\\" kan ogs\u00e5
  f\u00e5s med h\u00f8yttalerplugg, slik at du kan h\u00f8re p\u00e5 musikk fra iPod
  e.l.\\n\\nStandard h\u00f8rselvern demper mer enn n\u00f8dvendig og forvrenger som
  regel lyden kraftig. ER FlexComfort har et revolusjonerende filter som gir jevn
  demping over hele frekvensomr\u00e5det. Dette gj\u00f8r at lyden beholder det opprinnelige
  lydbildet, uten forvrengning. Det er bare som om volumet er skrudd ned. S\u00e5nt
  er viktig for musikere og andre som arbeider i omgivelser hvor det er viktig at
  klang og taleforst\u00e5else ikke g\u00e5r tapt.\\n\\nER FlexComfort er laget av
  mykt, gjennomsiktig materiale.\\n\\nDu kan velge mellom tre filtre som demper lyden
  i forskjellig grad.\\n\\nDempningsverdier  (NEN Norm 352-2)\\n\\n\\\"Soveproppen\\\"
  Relax\\n\\nRelax h\u00f8rselvern gj\u00f8r det mulig \u00e5 v\u00e5kne uthvilt,
  fordi det stenger ute lyder som tar fra deg n\u00f8dvendig s\u00f8vn.\\n\\nH\u00f8rselvernet
  stenger for et stort frekvens-omr\u00e5de. I motsetning til bomullsdotter og vanlige
  \u00f8repropper stenger Relax ute b\u00e5de de h\u00f8yeste og dypeste tonene.\\n\\nDet
  tar vekk st\u00f8y fra gaten og andre br\u00e5kete omgivelser, og du reduserer lyden
  av snorking fra de du deler soverom med. Relax har en tilvenningsperiode p\u00e5
  cirka en uke. Deretter f\u00f8les \\\"soveproppen\\\" behagelig.\\n\\nDen leveres
  i gul utf\u00f8relse.\\n\\n\\\"Bade- og surfeproppen\\\" Swim\\n\\nSwim er en spesielt
  utviklet \u00f8repropp for sv\u00f8mmere og vannsportsaktive, men ogs\u00e5 for
  de som er jevnlig plaget av \u00f8reinfeksjoner. Proppen er ikke egnet for dykking.\\n\\n\\\"Bade-
  og surfeproppen\\\" Swim blir personlig tilpasset og leveres uten filter. Proppen
  kan f\u00e5s i sju forskjellige farger.\\n\\nSjekk ut mer om v\u00e5re produkter
  p\u00e5 v\u00e5r nettside safesound.no\\n\\n\\\"Skytterproppen\\\" Compact FlexComfort\\n\\nCompact
  FlexComfort h\u00f8rselvern beskytter den som er p\u00e5 skyte\u00ad banen og p\u00e5
  bill\u00f8p eller som arbeider i tungindustrien.\\n\\nH\u00f8rselvernet er kompakt
  og har sm\u00e5 h\u00e5ndtak som gj\u00f8r det enkelt \u00e5 sette inn og ta ut.
  Det lages av et mykt, gjennomsiktig, behagelig materiale og kan leveres med snor.\\n\\nCompact
  FlexComfort kan ogs\u00e5 leveres i fem forskjellige farger.\\n\\nAvhengig av st\u00f8yniv\u00e5
  kan du velge mellom fire filtre.\\n\\nDempningsverdier  (NEN Norm 352-2)\\n\\nMM22\\n\\n26
  20 17 24\\n\\n\\\"Offshoreproppen\\\" TwinCom (Fireman)\\n\\nMed en SNR-demping
  p\u00e5 40 dB! TwinCom er en kombinasjon av \u00f8repropp og hodesett. Dette h\u00f8r\u00ad
  selvernet demper st\u00f8y i stor grad i alle frekvenser og forebygger h\u00f8r\u00ad
  selskader i st\u00f8yende omgivelser.\\n\\nDenne norskproduserte \\\"Offshoreproppen\\\"
  tilpasses deg personlig og er moduloppbygd. Det vil si at \u00f8replugg og \u00f8reklokker
  kan skiftes ut uavhengig av hverandre, noe som gir deg \u00f8konomiske fordeler.\\n\\nDempningsverdier  (NEN
  Norm 352-2)\\n\\nTwinCom\\n\\nH 39 M 37 L 34 SNR 40\\n\\nMarkedets best tilpassede
  h\u00f8rselvern\\n\\nSafe Sound selger neste generasjon h\u00f8rselvern. Vi utvikler,
  produserer og selger produkter som gir optimal lydglede. Mennesker opplever lyd
  vidt forskjellig ut fra interesse og yrke. Derfor skal h\u00f8rselvern tilpasses
  hver enkelt person. Lyd skal oppleves slik det var ment at den skulle oppleves.\"",
  "\"Referat/protokoll fra forbundsstyrem\u00f8te nr. 01 \u2013 2016/2018 Tidspunkt:
  S\u00f8ndag 5. juni 2016 kl. 15:15-16:00\\n\\nDELTAKERE:\\n\\nFra administrasjonen:\\n\\nMeldt
  forfall:\\n\\nForbundsstyret var beslutningsdyktig med 10 stemmeberettigede tilstede.\\n\\n02/16
  Konstituering\\n\\n- Organisasjonsnormer for tingperioden ble presentert og noen
  elementer fremhevet av Presidenten i.f.t. mediah\u00e5ndtering o.a. Presidenten
  leder styrets m\u00f8ter og er den som representerer NKF. Ved internasjonale kongresser
  delegerer Presidenten fullmakt i samr\u00e5d med seksjonsleder.\\n- Evt. komiteer/utvalg
  vurderes.\\n- Seksjonsstyrene som er innstilt p\u00e5 forbundstinget oppnevnes formelt
  av forbundsstyret.\\n- M\u00f8teplan for tingperioden. Presidenten \u00f8nsker m\u00f8te
  med seksjonsledere f\u00f8r lederm\u00f8tet i september.\\n\\nForbundsstyret fattet
  f\u00f8lgende enstemmige\\n\\nVedtak 02\\n\\nForbundsstyret vedtar \u00e5 videref\u00f8re
  organisasjonsnormene og ber adm. se n\u00e6rmere p\u00e5 evt. behov for revisjon
  av denne. Seksjonsstyrene vedtas oppnevnt i tr\u00e5d med tingets innstillinger.
  Evt. komiteer/utvalg oppnevnes ved behov. Fremlagte m\u00f8teplan godkjennes men
  tas opp til ny vurdering p\u00e5 neste m\u00f8te som avholdes i.f.m. lederm\u00f8tet
  2.-3. september.\\n\\n_______________________________________\\n\\nTrond Berg\\n\\n_______________________________________\\n\\nTore
  Bigseth\\n\\n_______________________________________\\n\\nGunnar Nordahl\\n\\n_______________________________________\\n\\nRolf
  Magne Larsen\\n\\n_______________________________________\\n\\n\u00d8yvind Andreassen\\n\\n_______________________________________\\n\\nKjell
  Sivertsen\\n\\n_______________________________________\\n\\nLine Gulbrandsen\\n\\n_______________________________________\\n\\nPer
  Chr. Garn\u00e6s\\n\\n_______________________________________\\n\\nKnut Olav Brecke\\n\\n_______________________________________\\n\\nInger
  Wold\"", "\"Kultur- og kirkedepartementet Postboks 8030 Dep 0030 OSLO\\n\\nDeres
  ref 2004/368KU/KU2 ckn:pbp\\n\\nV\u00e5r ref 200400381\\n\\nDato 09.03.04\\n\\nH\u00d8RING
  \u2013 FORSLAG TIL ENDRING I SAMELOVEN KAPITTEL 3\\n\\nDet vises til brev 28.01.04
  fra Kultur- og kirkedepartementet med forslag til endringer i sameloven kapittel
  3.\\n\\nUtdannings- og forskningsdepartementet har f\u00f8lgende merknader:\\n\\nDet
  foresl\u00e5s at den gjeldende geografiske definisjonen av forvaltningsomr\u00e5det
  for samisk spr\u00e5k blir tatt ut av sameloven. I stedet vil sameloven gi hjemmel
  for \u00e5 definere det geografiske omr\u00e5det gjennom forskrift. Oppl\u00e6ringsloven
  \u00a7 6-1 sin definisjon av \\\"samisk distrikt\\\" f\u00f8lger av en henvisning
  til gjeldende \u00a7 3-1 i sameloven. Den foresl\u00e5tte endringen i sameloven
  vil derfor ha konsekvenser for forvaltningsomr\u00e5det for samisk oppl\u00e6ring.\\n\\nOppl\u00e6ringsloven
  \u00a7 6-1 lyder:\\n\\n\\\"\u00a7 6-1. Definisjonar\\n\\nI lova her tyder\\n\\n-
  same: person som kan skrivast inn i samemanntalet, jf. \u00a7 2-6 i lov 12. juni
  1987 nr. 56 om Sametinget og andre samiske rettsforhold (samelova), og barn av dei
  som kan skrivast inn\\n- samisk: nordsamisk, s\u00f8rsamisk eller lulesamisk\\n-
  samisk distrikt: 1) det samiske forvaltningsomr\u00e5det etter \u00a7 3-1 i samelova,
  2) andre\\n\\nOppl\u00e6ringsavdelingen\\n\\nkommunar eller delar av kommunar etter
  forskrifter gitt av Kongen i statsr\u00e5d etter at Sametinget og dei kommunane
  og fylkeskommunane sp\u00f8rsm\u00e5let gjeld, har f\u00e5tt uttale seg\\\".\\n\\nEn
  endring av sameloven \u00a7 3-1 slik som foresl\u00e5tt vil medf\u00f8re en tilsvarende
  utvidelse av det samiske forvaltningsomr\u00e5det i oppl\u00e6ringslovens forstand.
  Hvis forvaltningsomr\u00e5det for samisk spr\u00e5k fastsettes i forskrift og ikke
  i lovs form, vil det ogs\u00e5 bli lettere adgang til \u00e5 endre forvaltningsomr\u00e5det.
  Dette vil gi mer uforutsigbarhet enn etter dagens ordning.\\n\\nVi \u00f8nsker \u00e5
  holde fast ved dagens ordning p\u00e5 oppl\u00e6ringslovens omr\u00e5de, dvs. begrense
  v\u00e5r lovbestemmelses rekkevidde til dagens definisjon av \\\"samisk distrikt\\\".
  Dette vil kreve en lovendring i oppl\u00e6ringsloven slik at bestemmelsen f\u00e5r
  samme ordlyd som gjeldende definisjon i sameloven \u00a7 3-1 nr. 1: \\\"Med forvaltningsomr\u00e5det
  for samisk spr\u00e5k menes kommunene Karasjok, Kautokeino, Nesseby, Porsanger,
  Tana og K\u00e5fjord\\\". I motsatt fall vil forvaltningsomr\u00e5det for samisk
  oppl\u00e6ring bli utvidet og ikke minst p\u00e5 en uforutsigbar m\u00e5te gjennom
  endringsadgang gjennom forskrift.\\n\\nEndringsforslaget i sameloven ny \u00a7 3-2
  nr. 1 inneholder dessuten f\u00f8lgende definisjon for samisk spr\u00e5k: nordsamisk,
  lulesamisk, s\u00f8rsamisk og \u00f8stsamisk/skoltesamisk. Oppl\u00e6ringsloven
  \u00a7 6-1, jf. ovenfor, benytter bare nordsamisk, s\u00f8rsamisk eller lulesamisk
  i sin definisjon av samisk. Endringsforslaget vil derfor kunne medf\u00f8re en utvidelse
  av omfanget av rettighetsbestemmelsene om samisk oppl\u00e6ring etter oppl\u00e6ringsloven.\\n\\nEn
  av konsekvensene av dette vil kunne bli at skolen blir forpliktet til \u00e5 gi
  oppl\u00e6ring i skoltesamisk over hele landet.  Det er vanskelig \u00e5 ansl\u00e5
  hvor mange som aktivt bruker skoltesamisk. Selv om vi ikke har kunnskaper om hvor
  stor ettersp\u00f8rselen vil bli, kan dette kreve en utvidelse i antall l\u00e6rere
  som kan gi oppl\u00e6ring i og p\u00e5 skoltesamisk og som et minimum en utvidet
  kapasitet i fjernundervisning i og p\u00e5 skoltesamisk.\\n\\nEn slik lovendring
  som foresl\u00e5s i sameloven vil innenfor oppl\u00e6ringssektoren kunne f\u00e5
  betydelige administrative og \u00f8konomiske konsekvenser. En utvidelse innenfor
  b\u00e5de forvaltningsomr\u00e5det og spr\u00e5k vil n\u00f8dvendigvis inneb\u00e6re
  \u00f8kte kostnader. P\u00e5 det n\u00e5v\u00e6rende tidspunkt foreligger det imidlertid
  ikke beregninger p\u00e5 hva dette vil inneb\u00e6re i \u00f8kte kostnader.\\n\\nMed
  hilsen\\n\\nTove Brekke (e.f.) avdelingsdirekt\u00f8r\\n\\nHein Th. Ferre\\n\\navdelingsdirekt\u00f8r\"",
  "\"S\u00f8knad om tillatelse til utslipp av naturlig forekommende radioaktive stoffer
  fra Yme/M\u00e6rsk Inspirer\\n\\nINNHOLD\\n\\n1. S\u00d8KNADEN\\n\\nRepsol Norge
  AS s\u00f8ker med dette om tillatelse til:\\n\\n* Utslipp av NORM-nuklider fra produsert
  vann fra petroleumsproduksjonen p\u00e5 Ymefeltet.\\n* Behandling og h\u00e5ndtering
  av NORM. enkel h\u00e5ndtering og behandling av NORMsedimenter, NORM-kontaminert
  utstyr og NORM-infiserte komponenter som oppst\u00e5r p\u00e5 feltet\\n* Lagring
  av NORM. Mellomlagring av NORM-avfall og NORM-infiserte komponenter p\u00e5 installasjoner
  p\u00e5 feltet inntil avfallet kan sendes i land til lovlig mottak.\\n\\nDet forutsettes
  at NORM-avfall som produseres p\u00e5 feltet kan avhendes til sluttdisponering minst
  en gang \u00e5rlig.\\n\\nTabell 1.1: Oms\u00f8kt \u00e5rlig utslippsmengde\\n\\n2.
  OPPLYSNINGER OM FORETAKET\\n\\nNavn:\\n\\nRepsol Norge AS\\n\\nForetaksnummer:  993
  787 787\\n\\nBes\u00f8ksadresse: Verven 4, 4014 Stavanger\\n\\nPostadresse: P.b.
  649, 4003 Stavanger\\n\\nTelefon:\\n\\n+47 52 00 20 00\\n\\ne.mail:\\n\\nfirstname.lastname@example.org\\n\\nWeb:\\n\\nrepsol.no\\n\\nKontaktperson:
  Ole Bakkevold\\n\\nTelefon:\\n\\n91 84 33 64\\n\\nE-post:\\n\\nemail@example.com\\n\\n2.1.
  Beskrivelse av virksomheten\\n\\n2.1.1. Beliggenhet og lisensforhold\\n\\nYme-feltet
  ble oppdaget i 1987 og var en del av utvinningstillatelse 114. Yme ligger i Egersund-bassenget
  ca 100 km fra den norske kysten, som vist i Figur 1.1.\\n\\nFeltet inneholder to
  separate oljeb\u00e6rende hovedstrukturer, Gamma og Beta. Vanndybden er ca. 93 m
  ved Gamma og 77 m ved Beta. Reservoarene er sandstein av midtre jura alder i Sandnesformasjonen
  p\u00e5 om lag 3150 meters dyp.\\n\\nPL 316 ble tildelt i 2004 og PL 316B i 2007.
  Datidens rettighetshavere gjennomf\u00f8rte omfattende analyser av Yme-feltet og
  prospektiviteten i omr\u00e5det, noe som f\u00f8rte til innlevering og godkjenning
  av PUD (Plan for Utbygging og Drift) 2007 for gjen\u00e5pning av\\n\\nYme-feltet.
  Den underliggende dreneringsstrategien var vanninjeksjon, hjulpet av naturlig trykkst\u00f8tte
  fra akviferen. Gasseksport ble ikke ansett som \u00f8konomisk, og produsert gass
  var planlagt brukt til kraftproduksjon eller re-injisert i reservoaret. Ni br\u00f8nner
  ble boret i 2009-2010, i tillegg ble store deler av infrastrukturen installert.
  Erfaringer og datainnsamling fra denne borekampanjen i 2009-2010 har blitt brukt
  til \u00e5 oppdatere alle reservoarmodeller, og til \u00e5 justere dreneringsstrategien.\\n\\n19.
  desember 2017 overleverte Repsol endret plan for utbygging og drift av Yme-feltet
  til Olje- og energidepartementet. Planen ble godkjent 23.mars 2018.\\n\\nRettighetshavere
  er:\\n\\n* Repsol Norge AS (operat\u00f8r): 55 %\\n\\n* Lotos Exploration and Production
  Norge AS: 20 %\\n\\n* OKEA AS: 15 %\\n\\n* Kufpec Norway AS: 10 %\\n\\n2.1.2. Utbyggingsl\u00f8sning
  og produksjonsperiode\\n\\nYme-feltet er basert p\u00e5 gjenbruk av eksisterende
  br\u00f8nner, utstyr og installasjoner, s\u00e5 langt dette er mulig. P\u00e5 Gamma
  lokasjon er det installert en ny st\u00f8ttestruktur (CPS) for caissongen, en ny
  br\u00f8nnhodemodul (WHM) p\u00e5 toppen av caissongen og en innleid borerigg med
  prosessanlegg (MODPU / M\u00e6rsk Inspirer). I tillegg vil en ny havbunnsramme knyttes
  opp til eksisterende infrastruktur p\u00e5 Beta lokasjon. En total oversikt over
  feltet er vist i figur 1.2. Konseptet som er inkludert i endret PUD er ogs\u00e5
  referert til som Yme New Development (YND) konseptet. Sannsynlig produksjonsstart
  p\u00e5 Yme-feltet er p.t. ansl\u00e5tt til medio september 2021.\\n\\n2.1.3. Reserver
  og reservoar\\n\\nYme-feltet inneholder to separate hovedstrukturer: Gamma og Beta.
  Segmentet i gammastruktur best\u00e5r av Gamma West, Gamma North East og Gamma South
  East. I Betastruktur er segmentet delt inn i Beta North, Beta East og Beta West.
  Saltbevegelse i Triassic-alderen dannet strukturene og utl\u00f8ste forkastningssystem
  fra f\u00f8r og under avsetning av reservoaret. Forkastninger tolkes ikke bare fra
  seismikk, men ses ogs\u00e5 i br\u00f8nnene under boring, produksjonstest og kreves
  i simulering som bidrar til feltets kompleksitet.\\n\\nDet mest produktive reservoaret
  er Sandnes-formasjonen, som ligger rundt 3150 meter og avsatt i middeljuraalderen.
  Tykkelsen kan v\u00e6re opptil 140 m, men varierer avhengig av plasseringen i feltet.
  Sealing rocks er levert av den overliggende Egersund-formasjonen, og den prim\u00e6re
  kildebergarten er fra den h\u00f8yorganiske skifer fra Tau-formasjonen.\\n\\nSandnesformasjonen
  er delt inn i forskjellige soner: Marine Storm Dominated, Lower Marine, Estuarine
  og Upper Marine. Produksjonsintervallet er fra Lower Marine og Estuarine hvor egenskapene
  varierer fra 12-22% i por\u00f8sitet og 1-1000 md i permeabilitet. P\u00e5 grunn
  av graden av heterogenitet brukes fire forskjellige bergarter ved hjelp av por\u00f8sitet
  og permeabilitet for \u00e5 klassifisere de forskjellige bergkvaliteter.\\n\\nTidligere
  i 2017 PUD ble soneringen definert ut fra alderen p\u00e5 sanden og fra base til
  toppreservoar er Sandnes-formasjonen delt inn i 10 soner fra YS1 (eldst) til YS10
  (yngst). I den gjeldende modellen blir dette deretter revidert, og sonering blir
  plukket basert p\u00e5 litostratigrafi i stedet. Denne oppdateringen av sonering
  brukes deretter konsekvent p\u00e5 tvers av Gamma- og Beta-struktur, slik at begge
  strukturer kan modelleres sammen.\\n\\nOljekarakteristikken er 38 API, GOR fra 50-76
  Sm3 / Sm3, oljedannelsesvolumfaktor p\u00e5 1,25 rm3 / Sm3 og viskositet p\u00e5
  rundt 0,7 cp. Det aktuelle reservoartrykket forventes \u00e5 v\u00e6re rundt 300-350
  bar (trykkdata fra Talisman-borede br\u00f8nner viser generelt trykk som er ladet
  opp til n\u00e6r begynnende niv\u00e5 i segmentene som ble boret). Yme oljereservoar
  er undermettet, med et boblepunkt p\u00e5 omtrent 90 bar.\\n\\nOversikt over reserver:\\n\\n3.
  KOMPETANSE\\n\\nStr\u00e5levernorganisasjonen i Repsol Norge AS er vist i figur
  3.1.\\n\\nStr\u00e5levernkoordinator Repsol Norge AS: Ole Bakkevold, Repsol.\\n\\n4.
  SKJERMING OG SIKKERHETSUTSTYR\\n\\nS\u00f8knaden omfatter utslipp av naturlig forekommende
  radioaktive stoffer til sj\u00f8 og injeksjon av samme til grunn. Det vil ikke v\u00e6re
  behov for avskjerming eller str\u00e5levernrelatert sikkerhetsutstyr for dette.\\n\\n5.
  INTERNKONTROLL\\n\\nRepsol utf\u00f8rer str\u00e5levernrelatert internkontroll (Vedlegg
  1, kap. 4.5) i henhold til Internkontrollforskriften og Str\u00e5levernforskriften.\\n\\n6.
  RADIOAKTIV FORURENSNING OG FOREBYGGING AV FORURENSNING\\n\\n6.1. Produsert vann\\n\\nProdusertvann
  fra br\u00f8nnene p\u00e5 Yme er planlagt injisert i st\u00f8rst mulig grad, med
  en regularitet p\u00e5 vanninjeksjonsanlegget p\u00e5 93 - 95 %. Testing av injektivitet
  p\u00e5 vanninjeksjonsbr\u00f8nner i klargj\u00f8ringsfasen har imidlertid avdekket
  redusert injektivitet i forhold til det som tidligere er blitt kalkulert. Det er
  utf\u00f8rt ulike simuleringer av effektivitetsgrad for injeksjon og vurdert mulige
  tiltak for avb\u00f8tning av den reduserte injeksjonsevnen (frakturering, boring
  av sidesteg til injeksjonsbr\u00f8nner).\\n\\nDet er usikkert n\u00e5r en har nok
  produsertvann til \u00e5 kunne starte vanninjeksjon. For \u00e5 kunne operere vanninjeksjonspumpene
  optimalt kreves det en viss minimumsrate av produsertvann (4080 m 3 /d\u00f8gn).
  Et  tiltak som vil bli utf\u00f8rt for \u00e5 kunne starte med vanninjeksjon tidligst
  mulig etter oppstart, er \u00e5 montere inn nytt \u00abminiflow\u00bb-ustyr (best\u00e5ende
  av tre seriemonterte multihullsplater) p\u00e5 den ene av pumpene. Dette vil muliggj\u00f8re
  en permanent resirkulering av produsertvann p\u00e5 ca. 200 m 3 /t, slik at vann
  kan injiseres med s\u00e5 lav flow som ned mot 40 m 3 /t. Uten installasjon av \u00abminiflow\u00bb
  ville en sannsynligvis ikke kunne startet vanninjeksjon f\u00f8r ca. ett \u00e5r
  etter oppstart. Av praktiske \u00e5rsaker vil det sannsynligvis ikke bli mulig \u00e5
  starte f\u00f8r etter 2 \u2013 3 m\u00e5neders produksjon. I denne perioden forventes
  produksjon av b\u00e5de olje og produsertvann \u00e5 v\u00e6re lav.\\n\\nI den grad
  det er vanskelig \u00e5 oppn\u00e5 h\u00f8y vanninjeksjonsgrad, m\u00e5 produsertvann
  slippes til sj\u00f8. Det vil tilstrebes \u00e5 f\u00e5 oljeinnholdet i vannet s\u00e5
  lavt som mulig ved hjelp av installasjonens rensesystem for produsertvann og optimal
  dosering av separasjonskjemikalier. Etter hovedseparasjon av olje, vann og gass
  i 1. trinns separator vil produsertvannet bli renset via hydrosykloner og en Compact
  Flotation Unit (CFU). CFU-enheten best\u00e5r av en vertikal separasjonstank der
  det oljeholdige vannet renses ved hjelp av gassflotasjon. Tilsatt brenngass bidrar
  til \u00e5 samle oljedr\u00e5pene og f\u00f8re dem til toppen av v\u00e6sken, der
  oljen fjernes. Det rensede vannet fra bunn av CFU kj\u00f8les ned via to platekj\u00f8lere
  og g\u00e5r videre til en avgassingstank. Produsertvann som ikke blir injisert slippes
  til sj\u00f8 via en utslippscaisson som g\u00e5r ca. 22 meter under sj\u00f8overflaten.\\n\\nI
  forbindelse med opprenskning av br\u00f8nner ved oppstart og \u00abf\u00f8rste olje\u00bb
  vil en kunne forvente at vannets oljeinnhold i perioder er for h\u00f8yt til \u00e5
  kunne slippes til sj\u00f8. I oppstartsfasen vil derfor produsertvannet bli overf\u00f8rt
  til lagringstanken for produsert olje hvor det vil ha lang oppholdstid for ytterligere
  separasjon. Senere vil en kunne slippe vannet til sj\u00f8 hvis en klarer \u00e5
  oppn\u00e5 tilfredsstillende rensing, dvs. et maksimalt oljeinnhold p\u00e5 30 mg/l
  som et veid snitt per kalenderm\u00e5ned, i henhold til gjeldende myndighetskrav.
  Kvaliteten p\u00e5 produsertvannet vil f\u00e5 tett oppf\u00f8lging i form av regelmessige
  analyser av olje i vann p\u00e5 installasjonens laboratorie. Ved stabil drift vil
  RNAS bestrebe seg p\u00e5 \u00e5 f\u00e5 gjennomsnittlig oljekonsentrasjon mindre
  enn 10 mg/l.\\n\\nPrognose for forventet vannproduksjon for Yme-feltet fram til
  2030 er gitt i Figur 6.1 og Tabell 6.1.\\n\\nVanninjeksjonen forventes \u00e5 komme
  i gang i l\u00f8pet av 2022.\\n\\nTabell 6.1: Prognose for vannproduksjon, -utslipp
  og -injeksjon\\n\\n6.2. Utslipp av radioaktive stoffer\\n\\nDet har ikke lyktes
  \u00e5 skaffe pr\u00f8ver av formasjonsvann for m\u00e5ling av radioaktivt innhold.
  Til denne s\u00f8knaden er det derfor benyttet aktivitetskonsentrasjoner for Ra-226,
  Ra.228 og Pb210 som vist i Tabell 6.2. Verdiene representerer gjennomsnittsniv\u00e5
  for produsert vann fra norsk sokkel.\\n\\nEtter at stabil produksjon er etablert,
  vil det bli innhentet produsert vann-pr\u00f8ver for \u00e5 dokumentere de faktiske
  niv\u00e5 for Ra-226, Ra-228 og Pb-210 i produsert vann fra Yme-feltet for bruk
  i en oppdatert s\u00f8knad.\\n\\nTabell 6.2: Foresl\u00e5tt aktivitetskonsentrasjon
  i produsert vann fra Yme-feltet.\\n\\nTabellene 6.3 \u2013 6.5 viser estimater for
  henholdsvis \u00e5rlig produsert aktivitetsmengde, \u00e5rlig utsluppet aktivitetsmengde
  og \u00e5rlig injisert aktivitetsmengde for NORM i produsert vann fra Yme-feltet
  i perioden 2021-2030. Estimatene er basert p\u00e5 prognosene for vannproduksjon
  og injeksjon (Tabell 6.1) og foresl\u00e5tte aktivitetskonsentrasjoner for produsert
  vann (Tabell 6.2).\\n\\nTabell 6.3: Prognose for \u00e5rlig produsert aktivitetsmengde
  p\u00e5 Yme-feltet.\\n\\nTabell 6.4: Prognose for \u00e5rlig utsluppet aktivitetsmengde
  p\u00e5 Yme-feltet.\\n\\nTabell 6.5: Prognose for \u00e5rlig injisert aktivitetsmengde
  p\u00e5 Yme-feltet.\\n\\nTabell 6.6 viser et \u00abworst case\u00bb-estimat for
  utslipp av radioaktivitet i produsert vann basert maksimums-anslaget for produsert
  vann-mengde og det tilfellet hvor det ikke har lyktes \u00e5 injisere produksjonsvannet
  tilbake i formasjonen. Dette estimatet representerer grunnlaget for denne forel\u00f8pige
  s\u00f8knaden om utslippstillatelse.\\n\\nTabell 6.6: Estimat for maksimal \u00e5rlig
  aktivitetsmengde sluppet ut fra Yme-feltet. Estimatet representerer et \u00abworst
  case\u00bb-scenario hvor det ikke har lyktes \u00e5 injisere produsert vann tilbake
  i formasjonen.\\n\\n6.3. Forebygging av forurensning\\n\\nDet finnes per i dag ingen
  tilgjengelige tekniske l\u00f8sninger for \u00e5 fjerne radioaktivitet fra produsert
  vann. Forebygging av utslipp av produsert vann er derfor begrenset til reinjeksjon
  av produsert vann (utslipp til grunn).\\n\\nDet er planlagt \u00e5 kunne reinjisere
  opp til 93 % av produsert vannmengden etter tre \u00e5rs drift og til 2030 (tabell
  6.2). Det gj\u00f8res oppmerksom p\u00e5 at gjennomf\u00f8rbarheten av reinjiseringen
  f\u00f8rst kan vurderes fullt ut etter at produksjonen p\u00e5 feltet er godt i
  gang.\\n\\n7. H\u00c5NDTERING AV RADIOAKTIVT AVFALL\\n\\nUtslippet av produsert
  vann medf\u00f8rer ikke h\u00e5ndtering av radioaktivt materiale.\\n\\nEventuelt
  fast NORM-avfall som m\u00e5tte oppst\u00e5 p\u00e5 feltet, vil bli h\u00e5ndtert
  og sendt i land if\u00f8lge prosedyren (Vedlegg 1, kap. 4.3).\\n\\n8. ARBEIDSMILJ\u00d8\\n\\nPersonell
  p\u00e5 installasjonen vil ikke bli utsatt for negativ p\u00e5virkning av NORM i
  produsertvannet. Relevante arbeidsmilj\u00f8prosedyrer vil bli fulgt ved arbeid
  med produsertvann, som pr\u00f8vetaking etc.\\n\\n9. KONSEKVENSVURDERINGER\\n\\nProdusert
  vann som slippes til sj\u00f8 fra petroleumsvirksomheten p\u00e5 norsk sokkel inneholder
  varierende mengder med naturlig forekommende lavradioaktive isotoper. Rapporten
  \\\"Naturally radioactive material (NORM) in North Sea produced water: environmental
  consequences\\\" konkluderer med at disse utslippene ikke \u00f8ker radioaktivitetsniv\u00e5et
  i Nordsj\u00f8en verken i vann eller sedimenter og at dette heller ikke er m\u00e5lbart
  i \u00f8kosystemene. Det konkluderes ogs\u00e5 med at det er usannsynlig at utslippene
  medf\u00f8rer effekter hos marine organismer.\\n\\nP\u00e5 Yme vil produsert vann
  fortrinnsvis bli reinjisert, men en viss mengde av vannet vil slippes til sj\u00f8,
  avhengig av oppn\u00e5dd injeksjonsgrad i injeksjonsbr\u00f8nnene. Utslippet av
  produsert vann fra Yme vil utgj\u00f8re en forsvinnende liten del av naturlig forekommende
  radioaktivitet i Nordsj\u00f8en. Det produserte vannet som slippes ut vil raskt
  spres i vanns\u00f8ylen og fortynnes, konsentrasjonen av radioaktive stoffer blir
  dermed redusert til eksisterende bakgrunnsniv\u00e5 i sj\u00f8vannet. Milj\u00f8risikoen
  ved det planlagte utslippet av radioaktive stoffer med produsert vann er vurdert
  til \u00e5 v\u00e6re akseptabel.\\n\\n10. MILJ\u00d8OVERV\u00c5KNING\\n\\nMyndighetenes
  krav til m\u00e5ling av radioaktivitet i milj\u00f8et offshore har begrenset seg
  til pr\u00f8vetaking og m\u00e5linger fra utvalgte plattformer, typisk med relativt
  store utslipp av produsert vann.\\n\\nRNAS og oljeindustrien er p\u00e5lagt \u00e5
  overv\u00e5ke for radioaktivitet i vanns\u00f8ylen og eventuelt i bunnsedimenter.
  Det er \u00e5rlig kontakt med Direktorat for Str\u00e5levern og Atomsikkerhet (DSA)
  for \u00e5 bestemme pr\u00f8vetakingsprogram, men det vil ikke v\u00e6re overv\u00e5king
  rundt alle plattformer.\\n\\nUtslipp av radioaktive stoffer i produsert vann vil
  bli rapportert i henhold til DSA''s \\\"Retningslinjer for rapportering av radioaktive
  stoffer fra petroleumsvirksomheten\\\".\\n\\n11. FOREBYGGENDE TILTAK OG BEREDSKAPSTILTAK\\n\\nUtslipp
  eller injeksjon av produsert vann inneb\u00e6rer ikke fare for akutte utslipp som
  kan medf\u00f8re radioaktiv forurensning.\\n\\n12. VEDLEGG\\n\\nVedlegg 1 Prosedyre
  HSE-PRO-REN-031 H\u00e5ndtering av NORM, radioaktivt kontaminerte gjenstander og
  radioaktive kilder\"", "\"NY SMART\\nTALESTYRING\\n\\nGJ\u00d8R LUFTEN SMARTERE.\\n\\nKontroll
