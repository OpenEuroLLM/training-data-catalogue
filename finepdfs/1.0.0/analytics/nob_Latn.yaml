  2 Oppsummering av p\u00e5viste r\u00e5tesoppskader i strammestasjonen nede ved sj\u00f8en
  i Hiorthamn. Skadegrad 1= ingen skade, Skadegrad 2= moderat skade, Skadegrad 3=
  Kraftig skade Konsekvensgrad 1= Liten konsekvens, Konsekvensgrad 2= Middels alvorlig
  konsekvens, Konsekvensgrad 3= Alvorlig konsekvens.\\n\\n| Strammestasjon                  |
  Skadegrad | Konsekvensgrad | Kommentar                                                                 |\\n|---------------------------------|-----------|----------------|--------------------------------------------------------------------------|\\n|
  Nordvestre ben til strammestasjon | 1         | 1              | Ingen r\u00e5teskade
  registrert                                               |\\n| Midtre bin i nordre
  rekke til strammestasjon | 2         | 2              | R\u00e5teskade i nedre del
  inni stokken                                       |\\n| Nord\u00f8stre ben til
  strammestasjon | 1         | 1              | Ingen r\u00e5teskade registrert                                               |\\n|
  Sydvestre ben til strammestasjon | 2/3       | 2              | Til dels kraftig
  r\u00e5teskade i nedre deler inni stokken/benet              |\\n| Midtre ben i
  s\u00f8ndre rekke til strammestasjon | 2/3       | 2              | Til dels kraftig
  r\u00e5teskade i nedre deler inni stokken/benet              |\\n| Syd\u00f8stre
  ben til strammestasjon | 2         | 2              | R\u00e5teskade i nedre deler
  inni stokken/benet                               |\\n| Nordvestre skr\u00e5st\u00f8tte           |
  3         | 3              | Kraftig r\u00e5teskade i nedre deler av skr\u00e5avstiveren,
  inni stokken          |\\n| Midtre skr\u00e5st\u00f8tte               | 1         |                |
  Ingen r\u00e5teskade registrerte                                              |\\n|
  Nord\u00f8stre skr\u00e5st\u00f8tte            | 1         |                | Ingen
  r\u00e5teskade registrerte                                              |\\n| Sydvestre
  skr\u00e5st\u00f8tte            | 1         |                | Ingen r\u00e5teskade
  registrerte                                              |\\n| Syd\u00f8stre skr\u00e5st\u00f8tte             |
  1         |                | Ingen r\u00e5teskade registrerte                                              |\\n|
  Horisontal bjelke p\u00e5 topp av konstruksjon | 3         | 3              | Bjelken
  er falt ned. Vi vet ikke hvor stor konsekvens dette har for stabiliteten til hele
  konstruksjonen/strammestasjonen, men tror ikke den er s\u00e5 stor. M\u00e5 unders\u00f8kes
  n\u00e6rmere. |\\n\\nI sin helhet er situasjonen for strammestasjonen ikke kritisk
  selv om deler av treverket er sterkt svekket. Det er vanskelig \u00e5 si med n\u00f8yaktighet
  hva effekten av den skadete topppsvilen er, men det er sannsynligvis ikke avgj\u00f8rende.
  Skadene i nedre deler av den nordvestre skr\u00e5avstiveren har ikke s\u00e5 stor
  effekt, da den var viktig da man hadde kabellast og bruk av anlegget. Ettersom denne
  belastningen er borte er avstiveren ikke s\u00e5 viktig lenger. Sannsynligvis har
  denne skaden derfor ikke s\u00e5 stor konsekvens for stramme stasjonen slik den
  st\u00e5r n\u00e5. Skadene i nedre del av bena er til dels kraftige. Men ogs\u00e5
  her gjelder det at konstruksjonen st\u00e5r p\u00e5 flatmark uten de store belastningene
  den er konstruert for. Imdlertid kan strammestasjonen motta en del vindlaster som
  kan gi store belastninger. Vi anbefaler derfor at det b\u00f8r vurderes \u00e5 sette
  opp/forsterke skr\u00e5avstiver mot syd for \u00e5 f\u00e5 en ekstra stabilitet.
  Syd\u00f8stre benin og midtre benin i s\u00f8ndre rekke er ogs\u00e5 til dels kraftig
  svekket av r\u00e5te i nedre deler. Det b\u00f8r ogs\u00e5 her vurdere \u00e5 forsterke/avstive
  t\u00f8mmerbena.\\n\\nTaubanesentralen ble unders\u00f8kt ved en visuell kontroll
  og stikkpr\u00f8ver i form av r\u00e5tedrilling og materialpr\u00f8ver. Kun enkelte
  mindre r\u00e5teskader ble funnet i en av bjelkene nede mot bakken, og noen mindre
  mekaniske skader i 2. etasje. Disse har ingen konsekvens for konstruksjonens stabilitet.\\n\\nAnalyse
  av trepr\u00f8vene viste at den dominerende r\u00e5tesopparten i disse materialene
  var husnettsopp (Leucogyrophana mollis).\\n\\nLeucogyrophana mollis for\u00e5rsaker
  vanligvis skader p\u00e5 materialer som utsettes for vedvarende h\u00f8y fuktighet/lekkasjer,
  ofte i kjellere, men ogs\u00e5 i vinduer, undertak og annet eksponert trevirke.
  Soppen har liten evne til \u00e5 spre seg inn i friskt og t\u00f8rt treverk, men
  kan lokalt for\u00e5rsake omfattende skader. Utskifting av angrepsne trematerialer
  med sikkerhetssone er n\u00f8dvendig.\\n\\n4.4 Konklusjoner\\n\\nI v\u00e5re unders\u00f8kelser
  av taubanebukkene, strammestasjonen og taubanesentralen ble det p\u00e5vist r\u00e5tesoppskader
  i varierende omfang og grad. De mest omfattende skadene var i de materialer som
  st\u00e5r i jordkontakt. Generelt kan skadene oppsummeres p\u00e5 f\u00f8lgende
  m\u00e5te:\\n\\n- Det var stor variasjon i omfang av r\u00e5tesoppskader i de unders\u00f8kte
  taubanebukkene, fra tiln\u00e6rmet friske materialer til meget omfattende r\u00e5teskader
  med alvorlig nedbrytning av b\u00e6rende elementer i konstruksjonene.\\n- Skadene
  opptrer tilsynelatende tilfeldig.\\n- Det er ikke mulig \u00e5 avklare tilstedev\u00e6relsen
  av eventuelle skader uten en ing\u00e5ende unders\u00f8kelse.\\n- Majoriteten av
  disse skadene var umulig \u00e5 oppdage visuelt fra utsiden og var ogs\u00e5 sv\u00e6rt
  vanskelige \u00e5 spore ved hjelp av tradisjonelle unders\u00f8kelsesmetoder. Det
  er helt avgj\u00f8rende \u00e5 unders\u00f8ke bukkene med r\u00e5tedrilling i de
  kritiske omr\u00e5dene der treverk er i jordkontakt for at man skal kunne si noe
  om taubanebukkenes reelle tekniske tilstand.\\n\\nUnders\u00f8kelsene har vist at
  det er kraftige r\u00e5tesoppskader i deler av samtlige taubanebukker. De to bukkene
  som er mest skadet er bukk 3 og 9.\\n\\nDet er uklart hvilken effekt st\u00e5lkablene
  som fortsatt sitter fast i flere av taubanebukken har med tanke p\u00e5 muligheten
  for stabilisering/fare for belastning p\u00e5 taubanebukkene. Vi regner med at kablene
  i utgangspunktet kan stabilisere bukkene, men at de kan \u00f8ke belastningen hvis
  det er kraftig sidevind eller ising p\u00e5 kablene. En slik belastning har trolig
  liten innvirkning p\u00e5 friske bukker, men med tanke p\u00e5 de til dels kraftige
  r\u00e5tesoppskadene som er p\u00e5vist for eksempel i bukk 3 og 9, antar vi at
  en kraftig skeivbelastning kan v\u00e6re kritisk. Det er derfor en s\u00e6rlig stor
  fare for at disse to bukkene knekker hvis det oppst\u00e5r en situasjon med kraftig
  skeivbelastning. Vi ansl\u00e5r at det er fare for at bukkene 3, 9 og eventuelt
  nr. 5 kan falle i l\u00f8pet av 1 - 5 \u00e5r dersom det ikke settes inn tiltak,
  mens de \u00f8vrige trolig kan st\u00e5 i lengre tid, anslagsvis 5 - 20 \u00e5r.\\n\\nStrammestasjonen
  har ikke s\u00e5 store skader som enkelte av bukkene. Ogs\u00e5 her er det til dels
  kraftige r\u00e5teskader i nedre deler av enkelte av bena, men disse er ikke s\u00e5
  store i omfang. Uten tiltak ansl\u00e5r vi restlevetiden til 5 \u2013 10 \u00e5r.\\n\\nTaubanesentralen
  har bare mindre skader. Vi ansl\u00e5r restlevetiden p\u00e5 denne til \u00e5 v\u00e6re
  over 50 \u00e5r.\\n\\nDet er fire mulige hovedtiln\u00e6rmingar for \u00e5 h\u00e5ndtere
  denne situasjonen:\\n\\n1. La bukkene suksessivt falle overende etter hvert som
  r\u00e5tesoppskadene blir omfattande nok og/eller det skjer en kraftig skeivbelastning
  p\u00e5 grunn av v\u00e6r og vind. Dette forutsetter at man setter opp varselskilt
  slik at personer ikke beveger seg innenfor en sikkerhetssone rundt bukkene.\\n\\n2.
  Kappe vekk st\u00e5l kablene. Dette vil trolig minse farene for skjevbelastning
  og at en fallende bukk kan dra med seg andre bukker i fallet. P\u00e5 den andre
  siden mister man viktig historisk informasjon om hvordan taubanebukkene har fungert
  med kulltransport via luftstrekki i st\u00e5l kabler. Det er mulig \u00e5 regne
  p\u00e5 hvilke krefter vind og ising kan ha p\u00e5 bukkene, men dette er ikke gjort
  i dette prosjektet.\\n\\n3. Stabilisere de mest angrepede bukkene. Dette kan gj\u00f8res
  med skr\u00e5avstivere som sikrer mot skjevbelastning. Man b\u00f8r regne p\u00e5
  hvilken fremgangsm\u00e5te som er mest hensiktsmessig. Det er mulig \u00e5 benytte
  b\u00e5de treverk, st\u00e5lstag og st\u00e5l kabler. Man m\u00e5 i hvert tilfelle
  vurdere eventuell fare for at tiltak kan f\u00f8re til andre problemer, for eksempel
  strekkrefter i det r\u00e5tesoppskade treverket. De bukkene som er mest svekket
  og dermed har st\u00f8rst behov for tiltak er nr. 3, 9 og eventuelt 5. Alternativt
  kan bukkene festes til st\u00e5l kabelen og suppleres med skr\u00e5avstivere.\\n\\n4.
  De mest omfattende skadene p\u00e5 bukkene utbedres ved at man forsterker eller
  skifter ut skadet treverk med nytt. Dette gjelder f\u00f8rst og fremst bukk 3, 9
  og eventuelt 5. I tillegg anbefaler vi at den \u00f8delagte toppsvillen p\u00e5
  strammestasjonen skiftes ut. Bruk av identisk treverk er \u00e5 foretrekke av antikvariske
  grunner, mens bruk av impregnerte materialer er mest hensiktsmessig med tanke p\u00e5
  levetid. Syd\u00f8stre bein og midtre bein i s\u00f8ndre rekke er ogs\u00e5 til
  dels kraftig svekket av r\u00e5te i nedre deler. Det b\u00f8r ogs\u00e5 her vurdere
  \u00e5 forsterke/avstive t\u00f8mmerberena.\\n\\nI tillegg til akutte tiltak er
  det viktig at man har en jevnlig oppf\u00f8lging av forholdene, slik at man kan
  fange opp tegn til eventuelle nye problemer.\\n\\nGjennom v\u00e5re unders\u00f8kelser
  p\u00e5 Hiorthhamn fra sommeren 2010 ser vi at skader og skadebilde f\u00f8lger
  samme m\u00f8nster som vi tidligere har funnet p\u00e5 Svalbard i lignende konstruksjoner:
  Det er samme skadegj\u00f8rer: Husnettssopp/Laukogyrofana, og skadene optrer midt
  inne i stokken, vanskelig \u00e5 lese fra utsiden. Dette er kraftige skader som
  opptrer i treverk som tross alt ikke er eldre enn rundt 90-100 \u00e5r.\\n\\nDette
  er ogs\u00e5 tidligere rapportert til Svalbards milj\u00f8vernfond i rapport og
  gjennom vitenskapelige artikler.\\n\\n### 4.4.1 Reparasjonsguide\\n\\nVi har satt
  opp en reparasjonsguide som f\u00f8lger:\\n\\n| Konstruksjon                  |
  Tiltak                                                                 |\\n|-------------------------------|------------------------------------------------------------------------|\\n|
  Taubanebukk 1 (bukken n\u00e6rmest Sneheim) | Ingen umiddelbare tiltak n\u00f8dvendig.
  Ny kontroll om 5 \u00e5r. Ekstra kontroll etter sterk vind eller sn\u00f8ras. |\\n|
  Taubanebukk 2                 | Ingen umiddelbare tiltak n\u00f8dvendig. Ny kontroll
  om 5 \u00e5r. Ekstra kontroll etter sterk vind eller sn\u00f8ras. |\\n| Taubanebukk
  3                 | Store skader som inneb\u00e6rer en klar fare for at den kan
  falle overende i l\u00f8pet av kort tid ved kraftig vindbelastning. Om den ikke
  skal falle om relativt kort tid (1 \u2013 5 \u00e5r) b\u00f8r den stabiliseres.
  B\u00f8r i mellomtiden f\u00f8lges n\u00f8yne. |\\n| Taubanebukk 4                 |
  Har allerede falt overende, og ligger nede. Ingen tiltak.             |\\n| Taubanebukk
  5                 | Det ene benet er sterkt skadet, og dersom bukken belastes av
  sterk vind eller sn\u00f8ras kan dette ene benet knekke. Dette vil gi en skjev belastning
  som kan f\u00f8re til at hele bukken faller. Om den ikke skal falle om relativt
  kort tid (1 \u2013 10 \u00e5r) b\u00f8r den stabiliseres. B\u00f8r i mellomtiden
  f\u00f8lges n\u00f8yne. |\\n| Taubanebukk 6                 | Har allerede falt
  overende, og ligger nede. Ingen tiltak.             |\\n| Taubanebukk 7                 |
  Ikke unders\u00f8kt da bena var utilgjengelige p\u00e5 grunn av stein og sterkt
  skr\u00e5nende terreng. |\\n| Taubanebukk 8                 | Ingen umiddelbare
  tiltak n\u00f8dvendig. Ny kontroll om 5 \u00e5r. Ekstra kontroll etter sterk vind
  eller sn\u00f8ras. |\\n| Taubanebukk 9                 | Bukken er sterkt skadet
  og kan falle n\u00e5r som helst. Som et strakstiltak b\u00f8r et sikringsomr\u00e5de
  rundt bukken markeres. Om den ikke skal falle om kort tid, m\u00e5 den stabiliseres.
  B\u00f8r f\u00f8lges n\u00f8yne. |\\n| St\u00e5lkabelen mellom taubanebukkene |
  Unders\u00f8ke med en statiker om det vil l\u00f8nne seg \u00e5 kappe st\u00e5lkabelen
  mellom bukkene. Det er noe usikkert hvorvidt den st\u00f8rste effekten er positiv
  gjennom \u00e5 stabilisere/sideavstive bukkene, eller om den er negativ gjennom
  \u00e5 forsterke belastningene ved vindlast og/eller sn\u00f8last/ras. |\\n| Strammestasjonen              |
  Flere av beina og skr\u00e5avstiverne har til dels kraftig r\u00e5teskade i nedre
  deler inne i stokken. Dersom strammestasjonen ikke skal rase i l\u00f8pet av 5 \u2013
  10 \u00e5r b\u00f8r det vurderes om noen av disse b\u00f8r stives av. Dette gjelder
  f\u00f8rst og fremst sydvestre og midtre bein i s\u00f8ndre rekke og nordvestre
  skr\u00e5st\u00f8tte. Toppsvilla/bjelken er s\u00e5 sterkt skadet av r\u00e5te at
  den har brukket og delvis falt ned. Vi vet ikke hvor stor konsekvens dette har for
  stabiliteten, |\\n\\n| Taubanesentralen | Ingen umiddelbare tiltak med tanke p\u00e5
  r\u00e5teskader n\u00f8dvendig. Noen mindre mekaniske skader kan gj\u00f8re det
  n\u00f8dvendig \u00e5 vurdere sikring av golvet der taubanen gikk inn i stasjonen
  dersom stasjonens 2. etasje skal st\u00e5 \u00e5pen for publikum. Trappen opp er
  ogs\u00e5 usikker, og spesielt gelenderet er d\u00e5rlig. Ny kontroll med tanke
  p\u00e5 r\u00e5tevurdering om 10 \u00e5r. Ekstra kontroll etter sterk vind. |\\n\\n###
