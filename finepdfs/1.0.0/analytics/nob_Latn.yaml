  23.01.06\\n\\nLevanger kommune R\u00e5dmann Skolefaglig ansvarlig R\u00e5dhuset
  7600 Levanger\\n\\nBrukerunders\u00f8kelser v\u00e5ren 2006. Vi viser til skriv
  fra Utdanningsdirektoratet av 16.01.06 til skoleeiere og skoleledere om dette emnet  (
  Utdanningsdirektoratets referanse 2006/181 ).\\n\\nForeldreutvalget for grunnskolen
  i Levanger behandlet dette skrivet p\u00e5 sitt styrem\u00f8te i forrige uke. Skrivet
  omhandler fire brukerunders\u00f8kelser, hvorav en er obligatorisk og tre er frivillige.\\n\\nMed
  bakgrunn i den kvalitetsplanen som ble enstemmig vedtatt h\u00f8sten 2005 s\u00e5
  finner FGIL det veldig interessant om 3 av brukerunders\u00f8kelsene kunne bli gjennomf\u00f8rt
  i Levanger v\u00e5ren 2006.  Det gjelder elevunders\u00f8kelsen ( den obligatoriske
  ), l\u00e6rerunders\u00f8kelsen og foreldre unders\u00f8kelsen.\\n\\nSpesielt interessant
  ville det jo bli dersom unders\u00f8kelsene kunne bli gjennomf\u00f8rt p\u00e5 nytt
  om noen \u00e5r for \u00e5 se om kvalitetsplanen hadde f\u00f8rt til noen forandring
  i skolen i Levanger. Slike unders\u00f8kelser vil ogs\u00e5 v\u00e6re nyttige virkemidler
  for \u00e5 f\u00e5 i gang den dialogen mellom foreldre representanter, skoleledere  og
  det politiske milj\u00f8 som kvalitetsplanen legger slik vekt p\u00e5. Det som vi
  finner spesielt interessant ved denne unders\u00f8kelsen er at den omfatter de viktige
  partnerne i \u00e5 f\u00e5 til en god skole; elevene, l\u00e6rerne og foreldrene.\\n\\nFGIL
  er av den oppfatningen at det er viktig at skoleeier ( r\u00e5dmannen ) tar initiativ
  overfor skolene slik at disse brukerunders\u00f8kelsene kan bli gjennomf\u00f8rt.
  Informasjon om unders\u00f8kelsene finnes p\u00e5 www.udir.no/undersokelser .\\n\\nMed
  vennlig hilsen Foreldreutvalget for grunnskolen i Levanger\\n\\nLars Einar Karlsen
  Leder\\n\\nKopi: Utdanningsforbundet i Levanger\"", "\"26.-28. september\\n\\n17.-19.
