  Comfort Cloud\"", "\"HVOR KREVENDE ER SVALBARDKURSET?\\n\\nEkskursjoner: Kurset
  forutsetter normal fysisk form, og med hyppige ekskursjoner/ ilandstigninger i ulendt
  terreng, b\u00f8r man v\u00e6re st\u00f8dig til bens. Ilandstigninger skjer ved
  hjelp av sm\u00e5b\u00e5ter, og det er fint om du har med en sporty innstilling.
  Det er ikke uten grunn at Svalbardkurset kalles \\\"Leirskole for voksne\\\".\\n\\nOvernatting:
  I Longyearbyen er det overnatting p\u00e5 UNIS Guest House (enkeltrom), om bord
  i Kystvakten er det lugarer med to eller tre k\u00f8yer og i Ny-\u00c5lesund vil
  det v\u00e6re enkeltrom.\\n\\nForsikring: Deltakerne m\u00e5 selv s\u00f8rge for
  reiseforsikring for oppholdet p\u00e5 Svalbard.\\n\\nV\u00c6RFORHOLD AUGUST\\n\\n*
  Dagslys hele d\u00f8gnet\\n* Middeltemperatur ca. 5 \u00b0C\\n* Kald vind er vanlig\\n*
  Selv om det regner lite er tundraen ofte fuktig (myraktig) pga. sn\u00f8smeltingen\\n*
  Svalbard har kun 200 mm nedb\u00f8r i \u00e5ret og har sv\u00e6rt t\u00f8rt klima,
  som medf\u00f8rer at du vil trenge \u00e5 drikke mer v\u00e6ske enn normalt.\\n\\nKOMMUNIKASJON\\n\\nI
  Longyearbyen er det mobildekning, men det er det ikke om bord i b\u00e5t eller i
  Ny\u00c5lesund. Ved kursstart vil du f\u00e5 telefonnummer til Ny-\u00c5lesund (Kings
  Bay-resepsjonen) hvor familie kan f\u00e5 tak i deg skulle det v\u00e6re behov.
  Tr\u00e5dl\u00f8st internett er kun tilgjengelig i Longyearbyen. I Ny-\u00c5lesund
  er det p\u00e5bud om radiostillhet, dvs. at det ikke vil v\u00e6re mulig \u00e5
  bruke mobil, iPad etc. som krever tr\u00e5dl\u00f8st nettverk. Men p\u00e5 rommene
  vil det v\u00e6re fiberkabel som kan koble b\u00e6rbare maskiner til internett.\\n\\nUTSTYRSLISTE\\n\\n*
  Pass/ID-kort (Svalbard er utenfor Schengen og reisende blir kontrollert. Les mer
  om reglene her).\\n\\nKl\u00e6r:\\n\\n* Joggesko til \\\"by-bruk\\\"\\n* Fjellsko/tilsvarende
  st\u00f8dige sko som benyttes ved ekskursjoner (m\u00e5 t\u00e5le \u00e5 bli v\u00e5te)\\n*
  Innesko (innend\u00f8rs i Longyearbyen og i Ny-\u00c5lesund g\u00e5r man ikke med
  utesko, men i sokkelesten el. innesko)\\n* Fjellbukse (vanntett og vindtett)\\n*
  Fjelljakke (vanntett og vindtett)\\n* Tynn dunjakke eller dungenser\\n* Skjerf/hals
  (ull anbefales)\\n* Varm lue (vindtett)\\n* Votter/ hansker (vindtette)\\n* Varm
  ullgenser eller fleecegenser-/jakke\\n* Varmt undert\u00f8y (tr\u00f8ye og stillongs,
  ull anbefales)\\n* Varme ullsokker\\n* Vanlige innekl\u00e6r (ingen formelle anledninger
  som krever fint antrekk).\\n\\nAnnet utstyr:\\n\\n* Dagstursekk\\n* Vanntett ryggsekk/bag
  til personlig utstyr\\n* Bagasjevekt\\n* Termos\\n* Toalettsaker\\n* Drikkeflaske\\n*
  Fotoutstyr (inkl. lader og ekstra minnebrikke)\\n* Kikkert\\n* Sitteunderlag\\n*
  Solkrem\\n* Solbriller\\n* Leppepomade\\n* \u00d8repropper\\n* Sj\u00f8syketabletter\\n\\nEvt:\\n\\n*
  Badet\u00f8y (Svalbard har flere nydelige strender\u2026.. )\\n\\nNB! Det er vektbegrensning
  p\u00e5 flyet til Ny-\u00c5lesund. Absolutt maks bagasjevekt er 20 kg per passasjer
  (inkl. h\u00e5ndbagasje). Har man med mer s\u00e5 kan dette lagres p\u00e5 UNIS
  f\u00f8r vi drar til Ny-\u00c5lesund.\"", "\"Tilbudet av referanserenter i Norge\\n\\nI
  brev av 30.8.2013 ber Finansdepartementet om at Finanstilsynet \u2013 i samr\u00e5d
  med Norges Bank og med innspill fra blant annet finansn\u00e6ringen \u2013 utreder
  tilbudet av referanserenter i Norge. Departementet viser til mistanker om misbruk/manipulasjon
  av referanserenter i flere land og at det er p\u00e5vist betydelige svakheter i
  rammene for fastsettelse av referanserente, blant annet i form av uklare definisjoner
  og prosedyrer, manglende kontroll, interessekonflikter og frav\u00e6r av markedsforankring,
  innsyn og etterpr\u00f8vbarhet. Departementet peker ogs\u00e5 p\u00e5 at mye er
  blitt gjort for \u00e5 rette p\u00e5 dette det siste \u00e5ret, stort sett gjennom
  forbedringer i n\u00e6ringens selvregering, etter p\u00e5trykk fra sentralbanker
  og tilsynsmyndigheter.\\n\\nDepartementet viser i sitt brev til Finanstilsynet at
  det kan v\u00e6re en fordel om det utvikles nye referanserenter med andre egenskaper
  enn Nibor, s\u00e5 som referanserenter basert p\u00e5 faktiske transaksjoner. Departementet
  peker spesielt p\u00e5 at akt\u00f8rene i finansn\u00e6ringen b\u00f8r arbeide for
  \u00e5 utvikle et marked for \u00abovernight index swaps\u00bb (OIS) i Norge.\\n\\nFinanstilsynet
  og Norges Bank har blitt enige om at Norges Bank p\u00e5tar seg hovedansvaret for
  \u00e5 utrede tilbudet av referanserenter (pkt. III i brevet fra departementet til
  tilsynet). I denne sammenheng er det nyttig med innspill fra finansn\u00e6ringen.
  I dette brevet tar vi derfor opp en del sp\u00f8rsm\u00e5l som vi \u00f8nsker finansn\u00e6ringen
  skal vurdere. Vi viser i denne sammenheng ogs\u00e5 til brev fra Finans Norge til
  Norges Bank av 8.2.2013, \u00abNibor\u00bb, der det uttrykkes et \u00f8nske om dialog
  knyttet til den videre prosessen om Nibor-kvoteringen.\\n\\nVi har mottatt kopi
  av brev fra Finans Norge til Finanstilsynet av 18.11.2013, \u00abNibor \u2013 orientering
  om revisjon av regelverket 30.10.2013\u00bb, der Finans Norge redegj\u00f8r for
  endringer i Nibor-regelverket. Vi gir f\u00f8rst synspunkter p\u00e5 dette. Deretter
  kommer vi med noen betraktninger om mulige alternative referanserenter i Norge,
  herunder OIS og repo. I den sammenheng har vi en del konkrete sp\u00f8rsm\u00e5l
  som vi \u00f8nsker finansn\u00e6ringens svar p\u00e5.\\n\\nNibor\\n\\nEn referanserente
  b\u00f8r ha flere egenskaper, og vi viser her til v\u00e5rt brev til Finanstilsynet
  av 20.3.2013, \u00abFastsettelsen av Nibor\u00bb.\u00b9 I noen sammenhenger er det
  \u00f8nskelig at referanserenten reflekterer generell bankrisiko, noe som taler
  for at den b\u00f8r v\u00e6re en usikret interbankrente. Videre er det \u00f8nskelig
  at renten handles i et likvid marked med mange akt\u00f8rer. I tillegg b\u00f8r
  prosessen rundt kvoteringen v\u00e6re s\u00e5 transparent som mulig, og det b\u00f8r
  v\u00e6re rutiner knyttet til kontroll av kvoteringen som sikrer god tillit til
  referanserenten.\\n\\nDet er sv\u00e6rt liten aktivitet i det usikrede interbankmarkedet
  for l\u00f8petider utover noen f\u00e5 dager. Nibor, som er en usikret interbankrente,
  er derfor ikke basert p\u00e5 handler i markedet. Vi mener likevel at Nibor fortsatt
  vil v\u00e6re den viktigste referanserenten i Norge. Det er derfor viktig \u00e5
  etablere et regelverk rundt Nibor som sikrer god tillit til denne.\\n\\nVi registrerer
  at Nibor if\u00f8lge det nye regelverket skal beregnes som ...summen av den aktuelle
  utenlandske rente og den avkastning som oppn\u00e5s gjennom forskjellen mellom spot-
  og terminkurs, \u00abtermintillegget\u00bb...\u00b2\\n\\nSom vi gjorde rede for
  i v\u00e5rt brev til Finanstilsynet 20.3.2013, mener vi at en slik konstruksjon
  har svakheter. Vi pekte i brevet p\u00e5 at Nibor b\u00f8r kvoteres p\u00e5 en slik
  m\u00e5te at volatiliteten i termintillegget ikke sl\u00e5r rett inn referanserenten.
  Som i andre land b\u00f8r bankene kvotere referanserenten ut fra sitt beste skj\u00f8nn
  om hva de ville kreve for et utl\u00e5n som beskrevet i definisjonen. I definisjonen
  av Nibor heter det at denne skal v\u00e6re en kronerente. Bankene b\u00f8r basere
  skj\u00f8nnet p\u00e5 utviklingen i alle relevante markeder, herunder CP/CD-markedene
  for andre valutaer som dollar og euro og valutaterminmarkedene mellom kroner og
  disse valutaene. Men den mekaniske koblingen til valutaterminmarkedet b\u00f8r avskaffes.
  En slik endring vil etter v\u00e5rt syn \u00f8ke tilliten til Nibor som referanse.\\n\\nVidere
  mener vi at \u00e5penhet om kvoteringen er helt sentralt. Det er s\u00e6rlig viktig
  at de enkelte bankene kan dokumentere de vurderinger som ligger bak de daglige kvoteringene.
  I den grad bankene legger spesielle data til grunn for Nibor-kvoteringen, m\u00e5
  det v\u00e6re mulig \u00e5 etterpr\u00f8ve om disse har v\u00e6rt \u00abrimelige\u00bb
  og i tr\u00e5d med generelle markedsforhold. Dette er s\u00e6rlig viktig dersom
  bankenes data viser stor daglig variasjon. I det nye regelverket omtales dette under
  pkt. 4, \u00abPanelbanker for Nibor\u00bb, der det heter ...Panelbank for Nibor
  plikter \u00e5 loggf\u00f8re de renter som leveres, data som ligger til grunn for
  beregningen av leverte renter samt dokumentasjon av de vurderinger som ligger til
  grunn... Vi st\u00f8tter dette, men gitt at Nibor styringsgruppe har en oppfatning
  av hvordan Nibor skal beregnes (jf. punktet over), kunne en tenke seg dette punktet
  mer utfyllende og presist (hvilke typer data som skal loggf\u00f8res). Det b\u00f8r
  ogs\u00e5 vurderes om disse dataene skal publiseres, ikke bare loggf\u00f8res.\\n\\n\u00b9
  http://www.norges-bank.no/no/om/publisert/brev-og-uttalelser/2013/brev-29-mars-2013/\\n\\n\u00b2
  Dette omtales i vedlegget, \u00abN\u00e6rmere om panelbankenes rentebidrag til Nibor\u00bb.\\n\\nRegelverket
  m\u00e5 utformes med tanke p\u00e5 \u00e5 unng\u00e5 interessekonflikter som kan
  oppst\u00e5 som f\u00f8lge av at bankene selv kan ha interesser i markeder der Nibor
  benyttes som referanserente. Dette er ogs\u00e5 omtalt i avsnitt 4 i det nye regelverket.
  Som vi tidligere har pekt p\u00e5, b\u00f8r Nibor-kvoteringen v\u00e6re skjermet
  fra ansatte som har individuelle mandater til \u00e5 ta risiko, det vil si de som
  har anledning til \u00e5 ta posisjoner i instrumenter der Nibor er referanse og
  som kan ha egeninteresse (for eksempel ved bonuser) i at Nibor beveger seg i den
  ene eller andre retning. P\u00e5 dette punktet mener vi det vedtatte regelverket
  ikke g\u00e5r langt nok.\\n\\nVi ville sette pris p\u00e5 Finans Norges vurdering
  av v\u00e5re synspunkter over.\\n\\n**Alternative referanserenter**\\n\\nSom nevnt
  ser vi ingen reelle alternativ til Nibor som viktigste referanserente i Norge. Derfor
  er god tillit til Nibor-kvoteringen n\u00f8dvendig. Alternative \u2013 eller supplerende
  \u2013 referanserenter er likevel nyttig av to \u00e5rsaker. For det f\u00f8rste
  vil de kunne v\u00e6re et korrektiv \u2013 en \u00abkryss-sjekk\u00bb \u2013 til
  Nibor. Det vil kunne forbedre Nibor-kvoteringen og gi \u00f8kt tillit til denne.
  For det andre kan andre referanserenter enn Nibor i noen sammenhenger bli vurdert
  som mer egnet. Det vil s\u00e6rlig kunne v\u00e6re tilfelle i sammenhenger der det
  ikke er n\u00f8dvendig at referanserenten reflekterer generell bankrisiko.\\n\\nVi
  \u00f8nsker her \u00e5 komme med betraktninger s\u00e6rlig rundt to mulige referanserenter,
  OIS og repo. OIS finnes ikke i det hele tatt, og repomarkedet er per i dag lite
  utviklet. Sp\u00f8rsm\u00e5let er derfor om det kan v\u00e6re interesse for slike
  markeder i Norge og om det er \u00f8nskelig \u00e5 iverksette tiltak for \u00e5
  etablere slike markeder.\\\\(^3\\\\)\\n\\n**OIS som alternativ referanserente**\\n\\nI
  sitt brev til Finanstilsynet viser Finansdepartementet spesielt til \u00abOvernight
  Index Swap\u00bb (OIS) som en mulig alternativ referanserente i Norge. En OIS er
  en rentebyteavtale der overnattenrenten utgj\u00f8r det flytende benet. Denne byttes
  mot en fast rente i rentebyteavtalen (OIS-renten). OIS-renten gjenspeiler forventet
  overnattenrente i avtalens l\u00f8petid. Siden overnattenrenten normalt ligger sv\u00e6rt
  n\u00e6r styringsrenten, gir OIS et godt uttrykk for forventet gjennomsnittlig styringsrente
  i OIS-avtalens l\u00f8petid. Det betyr igjen at OIS-renter med ulik l\u00f8petid
  gir en god tiln\u00e6rming til en risikofri rentekurve.\\n\\n---\\n\\n\\\\(^3\\\\)
  En tredje mulighet er renter p\u00e5 statskasseveksler. Disse p\u00e5virkes imidlertid
  av s\u00e6rfordel i dette markedet, for eksempel h\u00f8y ettersp\u00f8rsel og lave
  renter som f\u00f8lge av akt\u00f8rers \u00f8nske om sikre plasseringer. Statsrenter
  vil kunne inneholde tidevarierende premier som gj\u00f8r dem lite egnet som referanserenter.
  Mens usikrede interbankrenter kan v\u00e6re gode referanserenter fordi de reflekterer
  generell bankrisiko, synes statsrenter, som reflekterer staters kreditverdighet
  og \u00abtrygg-havn\u00bb-vurderinger, \u00e5 v\u00e6re mindre egnet som referanserenter
  i det norske finansmarkedet.\\n\\nOIS kan brukes til \u00e5 sikre seg mot endringer
  i de helt korte pengemarkedsrentene og dermed redusere renterisikoen for akt\u00f8rer
  som er eksponert mot dette. Det har den sideeffekt at OIS i likhet med andre derivater
  ogs\u00e5 kan brukes til spekulasjonsform\u00e5l. Videre kan OIS v\u00e6re en alternativ
  referanserente, s\u00e6rlig n\u00e5r generell bankrisiko ikke n\u00f8dvendigvis
  trenger \u00e5 v\u00e6re reflektert i referanserenten. I tillegg kan OIS v\u00e6re
  en \u00abkryss-sjekk\u00bb mot Nibor. Nibor best\u00e5r i prinsippet av en risikofri
  rente pluss en risikopremie p\u00e5 usikrede l\u00e5n mellom banker. OIS-renter
  kan belyse hvilke av disse to komponentene som ligger bak endringer i Nibor. Det
  gj\u00f8r utviklingen i Nibor lettere \u00e5 forst\u00e5 for utenforst\u00e5ende,
  noe som kan gi \u00f8kt tillit til Nibor-kvoteringen.\\n\\nI motsetning til andre
  alternative referanserenter er OIS et derivat. Det er grunn til \u00e5 tro at man
  ikke n\u00f8dvendigvis trenger \u00e5 ha stor aktivitet i andre instrumenter i norske
  kroner for \u00e5 v\u00e6re prisstiller i OIS. En eventuell prisstiller m\u00e5
  ha et syn p\u00e5 utviklingen i den norske styringsrenten. For en transaksjonsbasert
  pengemarkedsrente som inneholder likviditets- og kredittpremier, er kjennskap til
  og tilstedev\u00e6relse i det lokale markedet n\u00f8dvendig. Ettersom en OIS-rente
  er beheftet med sm\u00e5 risikopremier, er slik lokal kjennskap mindre viktig. Dette
  \u00f8ker sannsynligheten for flere prisstillere, ogs\u00e5 utenlandske, og mindre
  avstand mellom kj\u00f8ps- og salgskurser og et mer likvid marked.\\n\\nOIS finnes
  i dag i alle land det kan v\u00e6re naturlig \u00e5 sammenligne Norge med, for eksempel
  for valutaene amerikanske dollar, euro, britiske pund, japanske yen, sveitsiske
  franc, australske dollar, new-zealandske dollar, kanadiske dollar og svenske kroner.
  Ogs\u00e5 i Danmark, Russland, Polen, India, Kina, Hong Kong, Colombia, Malaysia
  og Mexico har det vokst frem OIS-markeder. Mange av disse landene er sammenlignbare
  med Norge n\u00e5r det gjelder st\u00f8rrelse p\u00e5 finansmarkedet. Flere av disse
  landene kan heller ikke sies \u00e5 ha bedre utviklede finansmarkeder enn Norge.\\n\\nDet
  varierer noe mellom land hva som er det korte benet i OIS. Det normale, og s\u00e6rlig
  for de store valutaene, er at det korte benet er representert ved overnattenrenten
  i interbankmarkedet (slik navnet OIS tilsier). I noen valutaer er imidlertid styringsrenten
  det korte benet (Australia, New Zealand og Canada), mens det i enkelte land er \u00abtomorrow-next\u00bb,
  renten fra i morgen til i overmorgen (Danmark, Sverige). Dette betyr at styringsrenten,
  overnattenrenten og \u00abtomorrow-next\u00bb alle kan tenkes \u00e5 danne et utgangspunkt
  for OIS.\\\\(^4\\\\)\\n\\nSer vi n\u00e6rmere p\u00e5 Sverige, er OIS-markedet (STINA-swap,
  Stibor T/N Average) knyttet opp mot den kortslitte usikrede pengemarkedsrenten Stibor
  \u00abtomorrow-next\u00bb. Videre etablerte Nasdaq OMX i 2009 et futures-marked
  (RIBA) knyttet direkte mot Riksbankens\\n\\n\\\\(^4\\\\) For enkelhets skyld bruker
  vi alts\u00e5 begrepet OIS i alle disse tilfellene, selv om overnattenrenten ikke
  utgj\u00f8r det korte benet.\\n\\nstyringsrente. Det er 6 banker som stiller indikative
  priser med et par punkters spread i RIBA-markedet. Vi har v\u00e6rt i kontakt med
  to markedsakt\u00f8rer som opplyser at i tillegg til prisstillerne er ogs\u00e5
  sluttbrukere som hedge-fond og pensjonsfond i Norden og andre land aktive i dette
  markedet. S\u00e6rlig den ene akt\u00f8ren trekker frem at RIBA-markedet fungerer
  bra og at det verdsettes av markedsakt\u00f8rer. En annen peker p\u00e5 \u00f8nske
  om at flere akt\u00f8rer skal bli aktive i markedet, spesielt vil kommersielle akt\u00f8rer
  bidra til bedre likviditet og mer kontinuitet. Per i dag ser det ut til at det gj\u00f8res
  handler med l\u00f8petid ut til f\u00f8rste kvartal 2015, og en trader viser til
  at det gj\u00f8res handler med volum fra 500 millioner til 10 milliarder svenske
  kroner.\\n\\nI Danmark best\u00e5r OIS-markedet av de s\u00e5kalte CITA-swapper
  (Copenhagen Interbank T/N Average) for l\u00f8petider fra \u00e9n m\u00e5ned og
  opp til tolv m\u00e5neder. 7 banker stiller priser. En trader vi har v\u00e6rt i
  kontakt med, mener markedet er \u00abfint og velfungerende\u00bb, med 2 punkters
  spread for \u00abok\u00bb volum opp til 2 \u00e5r. Han viser til god omsetning opp
  til ett \u00e5r, med st\u00f8rst omsetning opp til tre m\u00e5neder. Han ansl\u00e5r
  daglig omsetning til \u00e5 ligge i leiet 25-50 milliarder kroner. Han viser ogs\u00e5
  til at st\u00f8rre danske banker, en del utenlandske banker og en del danske kunder
  er aktive i dette markedet. Nasdaq OMX st\u00e5r for den praktiske innsamlingen
  av data.\\n\\nNorges Bank har med ulike akt\u00f8rer dr\u00f8ftet deres interesse
  for et OIS-marked i Norge. Gjennomg\u00e5ende har mange stilt seg positive. Flere
  av Nibor-bankene kan i prinsippet stille seg bak opprettelsen av et norsk OIS-marked.
  Enkelte har likevel pekt p\u00e5 at den samlede ettersp\u00f8rselen fra kundemassen
  ikke vil v\u00e6re h\u00f8y nok til \u00e5 skape et likvid OIS-marked. Flere internasjonale
  banker som er aktive i det norske rentemarkedet i dag, har stilt seg positive til
  opprettelsen av et norsk OIS-marked, og noen viser ogs\u00e5 til interesse fra enkelte
  av kundene sine, hovedsakelig ulike fond. Noen utenlandske banker har uttrykt vilje
  til \u00e5 stille som prisstillerne, men mener at det f\u00f8rste initiativet b\u00f8r
  komme fra Nibor-bankene, som har det absolutt st\u00f8rste kundegrunnlaget. De ser
  for seg at et prisstiller-panel kan best\u00e5 av de fire st\u00f8rste Nibor-bankene
  pluss et par London-baserte banker.\\n\\nVi har ogs\u00e5 v\u00e6rt i kontakt med
  noen store norske kapitalforvaltere som er positive til opprettelsen av et norsk
  OIS-marked. Et hovedargument for disse synes \u00e5 v\u00e6re at FRA-markedet n\u00e5
  er mindre egnet enn tidligere til \u00e5 sikre seg mot/spekulere i uventede endringer
  i styringsrenten \u2013 p\u00e5 grunn av store og volatile risikopremier i Nibor.
  De viser ogs\u00e5 til at et slikt marked vil gj\u00f8re det mulig \u00e5 sikre
  seg mot/spekulere i endringer i risikopremiene i pengemarkedsrentene.\\n\\nUnders\u00f8kelsene
  over er av \u00abanekdotisk karakter\u00bb. Synspunktene er fremkommet i uforpliktende
  samtaler. Vi mener likevel at reaksjonene vi har mottatt fra de ulike akt\u00f8rene
  gir grunnlag for \u00e5 g\u00e5 videre med problemstillingen og unders\u00f8ke n\u00e6rmere
  interessen og behovet for OIS i Norge.\\n\\nI lys av v\u00e5re betraktninger over
  ville vi sette pris p\u00e5 finansn\u00e6ringenes vurdering av f\u00f8lgende sp\u00f8rsm\u00e5l:\\n\\n1.
  Hvordan vurderer finansn\u00e6ringen interessen og behovet for et OIS-marked i Norge?\\n   Vi
  ville sette pris p\u00e5 at Finans Norge tar dette opp s\u00e6rlig med Nibor-bankene,
  men ogs\u00e5 med andre mellomstore banker som kan tenkes \u00e5 ha synspunkter.
  Vi viser her til v\u00e5re uformelle samtaler med ulike akt\u00f8rer som har stilt
  seg positive til et slikt marked.\\n\\n2. Hvilke akt\u00f8rer kan etter finansn\u00e6ringens
  syn tenkes \u00e5 kunne bli aktive i et OIS-marked i Norge?\\n\\n3. Dersom det er
  en utbredt oppfatning blant bankene at det er for liten kundeinteresse til \u00e5
  etablere et OIS-marked i Norge: Hva slags informasjon er denne oppfatningen basert
  p\u00e5? Hvorfor eksisterer ikke OIS i Norge n\u00e5r det er noks\u00e5 utbredt
  i andre land?\\n\\n4. Gitt at OIS skal etableres, hva b\u00f8r det korte benet v\u00e6re?
  I lys av internasjonale valg dr\u00f8ftet over synes det \u00e5 v\u00e6re to muligheter,
  overnattenrenten (NOWA) og Norges Banks styringsrente (det kvoteres n\u00e5 ingen
  Nibor \u00abtomorrow-next\u00bb).\\n\\n5. Hvilke l\u00f8petider (p\u00e5 det faste
  benet) ville v\u00e6re mest realistisk \u00e5 f\u00e5 etablert i Norge?\\n\\n6.
  I hvilken grad ville OIS kunne v\u00e6re en alternativ referanserente i Norge?\\n\\n**Repo
  som alternativ referanserente**\\n\\nEn repo (gjenkj\u00f8psavtale) er l\u00e5n
  mot sikkerhet i verdipapirer. Det er lite utviklet i Norge. I Norge er pengemarkedet
  i stor grad begrenset til det usikrede interbankmarkedet med sv\u00e6rt kort l\u00f8petid
  (drevet av bankers likviditetsstyring) og valutaswapmarkedet. Valutaswapmarkedet
  kan ses p\u00e5 som et sikret marked der kroner l\u00e5nes med dollar som sikkerhet
  (og omvendt).\\n\\nEt sp\u00f8rsm\u00e5l er om noe av handelen som n\u00e5 skjer
  mellom innenlandske akt\u00f8rer via valutaswapmarkedet, kunne skjedd i et kronerepomarked.
  Et slikt marked kan tenkes \u00e5 ha flere fordeler:\\n\\n- Et repomarked i kroner
  vil trolig v\u00e6re mindre utsatt for internasjonal finansiell uro enn valutaswapmarkedet.
  Erfaringene fra finanskrisen viste at risikopremier i andre lands pengemarkeder
  slo raskt inn i p\u00e5slaget i norske pengemarkedsrenter, delvis fordi utenlandske
  renter i praksis l\u00e5 til grunn for Nibor-kvoteringen.\\\\(^5\\\\)\\n\\n- Videre
  kan en repo-rente v\u00e6re en alternativ referanserente i Norge, og i likhet med
  OIS vil den kunne v\u00e6re \u00abkryss-sjekk\u00bb mot Nibor.\\n\\n- Repoer vil
  ogs\u00e5 kunne v\u00e6re et nyttig instrument i likviditetsstyringen til banker
  og andre finansielle foretak. I andre velutviklede markeder har repoer en st\u00f8rre
  rolle som likviditetsstyringsinstrument.\\n\\n---\\n\\n\\\\(^5\\\\) Se Staff-memo
  20/2012 fra Norges Bank, \u00abRisikopremiene i Nibor og andre lands interbankrenter\u00bb,
  av Tom Bernhardsen, Arne Kloster og Olav Syrstad, [www.norges-bank.no](http://www.norges-bank.no)
  (under publikasjoner/Staff-memo).\\n\\n\u2022 I den korte enden av pengemarkedet
  kan sikrede transaksjoner overta usikrede som dominerer i dag. Det kan redusere
  konsekvensene dersom en l\u00e5ntaker ikke innfrir forpliktelser og bidra til finansiell
  stabilitet. Et sikret kronemarked i den korte enden kan ogs\u00e5 f\u00f8re til
  flere og st\u00f8rre kredittlinjer mellom norske banker.\\n\\n\u2022 Markedene for
  de verdipapirer som stilles som sikkerheter i repo-transaksjonene, for eksempel
  statspapirer og OMF, kan tenkes \u00e5 bli mer likvide.\\n\\nRepo-marked er vanlig
  internasjonalt. Markedsakt\u00f8rer vi har snakket med viser til at mesteparten
  av aktiviteten i Sverige og Danmark er med l\u00f8petid fra spot og opp til 2-3
  m\u00e5neder. Noen hevder at opp til 6 m\u00e5neder heller ikke er uvanlig.\\n\\nI
  lys av v\u00e5re betraktninger over \u00f8nsker vi finansn\u00e6ringenes vurdering
  av f\u00f8lgende sp\u00f8rsm\u00e5l:\\n\\n7. Hvordan vurderer finansn\u00e6ringen
  interessen og behovet for et repo-marked i Norge? Er det ulike interesser mellom
  Nibor-bankene, de mellomstore sparebankene og de sm\u00e5?\\n\\n8. Hvilke akt\u00f8rer
  kan etter finansn\u00e6ringens syn tenkes \u00e5 bli aktive i et repo-marked i Norge?\\n\\n9.
  Hva \u00f8nsker bankene \u00e5 bruke et eventuelt repomarked til?\\n\\n10. Gitt
  interesse for et repo-marked, hvor lange l\u00f8petider er det realistisk \u00e5
  vente handel i?\\n\\n11. I hvilken grad kan et repomarked ta over rollen valutaswapmarkedet
  har for det norske interbankmarkedet i dag?\\n\\n12. Hvor egnet er repo-renter etter
  finansn\u00e6ringens syn som alternative referanserenter?\\n\\n13. Finnes det juridiske
  forhold som i dag er til hinder for \u00e5 iverksette et repomarked?\\n\\n14. Hva
  ser finansn\u00e6ringen for seg vil kunne v\u00e6re sikkerhetsmassen i et repomarked
  i Norge?\\n\\n15. Hvordan vurderer finansn\u00e6ringen dagens tekniske infrastruktur,
  og hvilke endringer m\u00e5 eventuelt gjennomf\u00f8res?\\n\\nVi ville sette stor
  pris p\u00e5 finansn\u00e6ringens svar p\u00e5 v\u00e5re vurderinger og sp\u00f8rsm\u00e5l
  over. Vi ber om svar innen utgangen av januar 2014.\\n\\nMed hilsen\\n\\nOlav B\u00f8\\n\\nAnders
