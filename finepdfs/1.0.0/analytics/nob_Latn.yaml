sample: '["\"Ole Petter Askheim og Mette Haaland \u00d8verby:\\n\\nHvordan opplever
  medforskere og forskere samarbeidet? Erfaringer fra forskningsprosjektet \u00abBrukermedvirkning
  \u2013 fra politikk til praksis\u00bb\\n\\nNasjonal konferanse om brukermedvirkning
  i forskning 17.10. 2017\\n\\nProsjektet \u00abBrukermedvirkning \u2013 fra politikk
  til praksis\u00bb (NFR Program for helse og omsorgstjenester)\\n\\n* Unders\u00f8ke
  brukermedvirkning i forhold til tre sentrale m\u00e5lgrupper (eldre, funksjonshemmede,
  personer med psykiske lidelser)\\n* Tre moduler:\\n\u2013 Modul 1: Diskursanalyse
  av statlige policydokumenter\\n\u2013 Implementering i kommunene.\\n* Modul 2: Organisering
  og implementering av helse- og omsorgstjenestene (5 kommuner).\\n* Modul 3: Praktisering
  av brukermedvirkning i relasjonene mellom ansatte og brukere p\u00e5 \u00abbakkeniv\u00e5\u00bb
  (2 av de 5 kommunene).\\n\\nInvolvering av medforskere\\n\\n* 7 medforskere rekruttert
  gjennom brukerorganisasjonene \u2013 de fleste hadde erfaring fra tillitsverv i
  organisasjonene \u2013 flere hadde erfaring fra deltakelse i r\u00e5d/utvalg\\n*
  Medforskersamlinger (2 g. pr \u00e5r). Skolering/forberedelse av intervjuguider/analyse\\n*
  Deltakelse i gruppeintervjuer i kommunene\\n* Formidling\\n* Vi er n\u00e5 inne
  i analysefasen\\n\\nErfaringer\\n\\n* Fra intervjuene\\n\\n\u2013 Gjennomg\u00e5ende
  positive tilbakemeldinger fra b\u00e5de forskerne og medforskerne om samarbeidet
  i forberedelsene og gjennomf\u00f8ringen av intervjuene \u2013 kom med supplerende
  sp\u00f8rsm\u00e5l, perspektiver i utarbeidelsen av intervjuguidene og i intervjuene.\\n\u2013
  Viktig med god tid til forberedelser \u2013 og i etterkant av intervjuene\\n\u2013
  Viktig at intervjuguidene var sendt ut p\u00e5 forh\u00e5nd\\n\u2013 Rollefordelingen
  i intervjuene fungerte i hovedsak godt\\n\u2013 I et par tilfelle opplevde forskerne
  at medforskerne gikk ut av \u00abforskerrollen\u00bb og gikk mer inn i en \u00abr\u00e5dgiverrolle\u00bb\\n\\nRelasjonelle
  erfaringer\\n\\n* Samarbeidet beskrives godt b\u00e5de fra forskerne og medforskerne\\n*
  Medforskerne opplever \u00e5 ha blitt tatt p\u00e5 alvor, hatt en likeverdig rolle
  \u2013 ogs\u00e5 fra informantene i intervjuene.\\n* Medforskerne opplevde at forskerne
  var opptatt av \u00e5 f\u00e5 innspill fra dem og at deres synspunkter skulle komme
  fram i intervjusituasjonen.\\n* Arbeidet beskrives som l\u00e6rerikt og bevisstgj\u00f8rende.\\n\\nFra
  analysearbeidet (forel\u00f8pige erfaringer)\\n\\n* Mindre direkte involvering og
  st\u00f8rre uklarhet hos medforskerne om hva deres rolle skulle v\u00e6re i analysefasen.
  Forventningene om hva de skulle bidra med synes \u00e5 ha blitt mottatt og fortolket
  ulikt.\\n* I hovedsak tilbakemeldinger gitt reaktivt p\u00e5 forskernes oppsummeringer
  framfor at medforskerne var mer proaktive i en dynamisk prosess.\\n* Det gikk for
  lang tid mellom medforskersamlingene \u2013 gjorde at de tapte noe av eierforholdet
  til prosjektet.\\n* I sine kommentarer sier de likevel at deres inntrykk fra intervjuene
  i hovedsak korresponderer med resultatene funnene forskerne la fram.\\n* Men \u2013
  i blant kan forforst\u00e5elsen hos noen av medforskerne overstyre data!\\n\\nNoen
  oppsummerende refleksjoner\\n\\n* Medforskerne deltakelse har hatt betydning \u2013
  sitter med erfaringer og perspektiver som forskerne ikke har\\n* Prosjektenes m\u00e5l,
  hvilke ressurser som de har til r\u00e5dighet og varighet - vil ha betydning for
  graden av involvering og i hvilken form.\\n* Utfordring: Hvordan f\u00e5 til involvering
  tidligere i forskningsprosessen?\\n* Utfordring: Hvordan f\u00e5 til sterkere involvering
  i analyseprosessen (ofte tid- og ressurskrevende)\\n* Viktig: God planlegging av
  tid og ressurser til ulike aktiviteter i prosjektet \u2013 husk avl\u00f8nningsbiten\"",
  "\"Hovedtillitsvalgtes syn p\u00e5 kommunedirekt\u00f8rens budsjettfremlegg\\n\\nDa
  har vi igjen kommet til det \u00e5rlige \u00abh\u00f8stsleppet\u00bb av kommunedirekt\u00f8rens
  n\u00f8kkeltall og som vanlig leser vi hovedtillitsvalgte budsjettfremlegget med
  stor interesse. Det er mange ting \u00e5 merke seg i \u00e5rets budsjettforslag,
  ikke minst at kommunale utgifter vil stige en hel del og sl\u00e5 hardest ut for
  de som ikke har s\u00e5 mye fra f\u00f8r. Men som hovedtillitsvalgte er v\u00e5r
  jobb f\u00f8rst og fremst \u00e5 se p\u00e5 forholdene som ang\u00e5r de ansatte
  i kommunen. Viktig er l\u00f8nn, men minst like \u2013 om enn ikke enda viktigere
  - er arbeidsforholdene/arbeidsmilj\u00f8et. N\u00e5r det gjelder sistnevnte er det
  s\u00e6rlig det som g\u00e5r p\u00e5 arbeidsmengde og f\u00f8lelsen av det \u00e5
  mestre jobben man er satt i, som er viktig. For \u00e5 mestre jobben sin er det
  viktig at oppgavene st\u00e5r i forhold til hva man er i stand til \u00e5 klare
  innenfor en normalarbeidstid. Dette vil igjen v\u00e6re avhengig av en god grunnbemanning
  i bunn og nok kvalifisert personell p\u00e5 de ulike plassene. Innledningsvis vil
  vi her hevde at det i denne sammenhengen ogs\u00e5 er viktig at det avsettes nok
  midler til videre og etterutdanning innenfor de ulike enhetene.\\n\\nUDF\\n\\nI
  BHG gjelder det f\u00f8rst og fremst at man oppfyller 50 % pedagogtetthet samt nok
  voksne fordelt p\u00e5 de ulike gruppene. UDF \u00f8nsker seg ogs\u00e5 full bemanning
  i hele barnehagens \u00e5pningstid samt en styrer p\u00e5 hver avdeling. Tilsvarende
  p\u00e5 skole gjelder det at man oppfyller den lovp\u00e5lagte pedagognormen med
  1 l\u00e6rer per 14 barn i sm\u00e5skolen og 1 l\u00e6rer per 20 barn i de h\u00f8yere
  trinnene. I denne sammenhengen er det ogs\u00e5 viktig \u00e5 se p\u00e5 det viktige
  bidraget fagarbeiderne st\u00e5r for b\u00e5de i BHG og p\u00e5 skolen og en god
  bemanning hva ang\u00e5r fagarbeidere, vil ogs\u00e5 v\u00e6re sv\u00e6rt viktig
  med tanke p\u00e5 voksentettheten og det samlete tilbudet vi vil kunne gi barn og
  elever i BHG og skole. Sammen er vi et lag b\u00e5de i BHG og i skolen som utfyller
  hverandre godt. Videre gjelder det at man har kvalifiserte l\u00e6rere innenfor
  de ulike fagene. Her spiller l\u00f8nn en vesentlig rolle, men dette er en del av
  det sentrale l\u00f8nnsoppgj\u00f8ret samt de lokale forhandlingene. Det man derimot
  kan gj\u00f8re noe med, er \u00e5 opprettholde tr\u00f8kket p\u00e5 videre og etterutdanningen.
  Dessverre \u00e5pnes det n\u00e5 bare for stipendordning og ikke for vikarordning,
  da dette er rimeligere. Antall personer p\u00e5 videre og etterutdanning har ogs\u00e5
  g\u00e5tt noe ned de siste \u00e5rene.\\n\\nVidere vil midler til lovp\u00e5lagt
  kommunepsykolog i 20 % stilling v\u00e6re viktig. Likes\u00e5 den lovp\u00e5lagte
  funksjonen barnekoordinator fra og med 1.8 22. Vi leser ogs\u00e5 i lokalavisa at
  enkelte stiller sp\u00f8rsm\u00e5l ved om skolen er i stand til \u00e5 f\u00e5 elevene
  igjennom skolel\u00f8pet og i denne sammenhengen blir det spesielt viktig med en
  alternativ oppl\u00e6ringsarena for de elevene som trenger dette. Her skulle vi
  gjerne ogs\u00e5 sett at det ble avsatt midler til styrking av leseoppl\u00e6ringen
  i BHG og barneskolen, men mest av alt betyr dette fortsatt en satsning p\u00e5 FOKUS-delen
  p\u00e5 skolen i tillegg til \u00e5 kunne benytte seg av eksterne tilbud utenfor
  skolen der skolen kommer til kort.\\n\\nVidere forventer vi n\u00e5 at tidligere
  \u00e5rs diskusjoner rundt 2-spr\u00e5klig assistent n\u00e5 er lagt d\u00f8. Tospr\u00e5klig
  assistent er n\u00e5 faste stillinger, og \u00e5 g\u00e5 til oppsigelser vil v\u00e6re
  sv\u00e6rt omd\u00f8mme\u00f8deleggende for Veg\u00e5rshei kommune. Det er ogs\u00e5
  lite hensiktsmessig utfra tillitsvalgtes st\u00e5sted da ressursen er viktig for
  \u00f8vrig personell i skolen ut fra de krav som stilles til undervisning, samt
  elevenes rettigheter.\\n\\nOg ikke minst nok midler til den daglig driften hva gjelder
  vikarutgifter, innkj\u00f8p av BHG/skolemateriell og forbruksvarer til de ulike
  praktiske gj\u00f8rem\u00e5l/fagene ved BHG og skolen. De siste \u00e5rene har f.eks.
  vi sett en betydelig reduksjon i innkj\u00f8p til eks. tekstil og sl\u00f8yd og
  det b\u00f8r ikke v\u00e6re en sl\u00f8ydl\u00e6rers oppgave \u00e5 dra rundt til
  de lokale bedriftene \u00e5 tigge om materialer og maling.\\n\\nDelta\\n\\nI forbindelse
  med budsjettframlegget for 2023 vil det fra Deltas side v\u00e6re viktig \u00e5
  opprettholde/ styrke bemanningen av fagarbeidere b\u00e5de i Oppvekst og Helse.
  Det gjelder ogs\u00e5 fagarbeidere innenfor teknisk sektor. Alle b\u00f8r ogs\u00e5
  f\u00e5 muligheter til kompetanseheving innenfor sitt felt.\\n\\nN\u00e5r det gjelder
  konsulentene i Veg\u00e5rshei kommune s\u00e5 har arbeidsmengden ogs\u00e5 der \u00f8kt
  betraktelig ved at deler av andre stillinger er tillagt dem. De har heller ingen
  kolleger som kan erstatte dem ved sykdom etc. et blir mye \u00e5 ta igjen. Delta
  \u00f8nsker derfor \u00e5 utvide de aktuelle stillingene noe.\\n\\nVidere ser vi
  som n\u00f8dvendig at stillingen som tospr\u00e5klig fagassistent blir opprettholdt
  og helst utvidet.  Grunnbemanningen m\u00e5 holdes p\u00e5 et forsvarlig plan i
  alle avdelinger s\u00e5 vi slipper store utgifter til vikarer.\\n\\nBer om at v\u00e5re
  politikere vedtar et budsjett vi alle kan leve med og som er til det beste for alle
  v\u00e5re innbyggere.\\n\\nNSF\\n\\nSer at det ikke er meldt inn s\u00e6rlige behov
  fra enhetsleder til helse og mestring. Det er noe vi som jobber der ikke kjenner
  oss igjen i.\\n\\nVi trenger \u00e5 f\u00e5 \u00f8kt grunnbemanningen igjen slik
  at vi f\u00e5r gjort jobben v\u00e5r p\u00e5 en faglig forsvarlig m\u00e5te b\u00e5de
  for pasienter/brukere og oss selv.\\n\\nI arbeidsmilj\u00f8loven st\u00e5r det skrevet
  at arbeidsgiver plikter \u00e5 tilrettelegge slik at arbeidstaker ikke utsettes
  for uheldige fysiske og psykiske belastninger p\u00e5 jobb. Dette er alts\u00e5
  hjemlet i loven.\\n\\nMen vi kan se p\u00e5 et stabilt h\u00f8yt sykefrav\u00e6r
  at vi ikke oppfyller denne plikten.  Og vi har ogs\u00e5 mange sykepleiere som n\u00e6rmer
  seg pensjonsalder, og i l\u00f8pet av de neste \u00e5rene mister vi ytterligere
  5 stk. Det er ogs\u00e5 sykepleiere som bare slutter \u00e5 jobbe hos oss, og av
  oss andre er det flere som vurderer \u00e5 slutte i jobben. Finne seg noe annet
  \u00e5 jobbe med som du ikke blir syk av. For vi blir det av \u00e5 jobbe slik vi
  gj\u00f8r i dag. Det tar p\u00e5.\\n\\nVi m\u00e5 legge en plan p\u00e5; hva gj\u00f8r
  vi for \u00e5 beholde og rekruttere sykepleiere til kommunen. Pr i dag gj\u00f8r
  vi ingenting. N\u00e5r vi tar det opp med arbeidsgiver, sier de at det ikke er penger
  til det. Men n\u00e5 haster det.\\n\\nDagsenteret er fortsatt kun et halvt \u00e5rsverk.
  Det er skammelig, men ogs\u00e5 direkte u\u00f8konomisk for kommunen. I tillegg
  har vi ingen kommunepsykolog, en tjeneste som fortsatt er lovp\u00e5lagt.  Vi bryter
  loven, og det kan vi ikke fortsette med.\\n\\nS\u00e5 v\u00e5r oppsummering fra
  NSF er at vi m\u00e5 begynne \u00e5 styrke tjenestene v\u00e5re slik at vi kan gi
  v\u00e5re medbygdinger og ansatte det de har krav p\u00e5.\\n\\nOg s\u00e5 m\u00e5
  vi slutte \u00e5 bel\u00f8nne de som allerede tjener mest i denne kommunen. Det
  er trist lesing i avisa n\u00e5r vi ser at ledere fortsatt finner det dobbelte av
  det de allerede laveste l\u00f8nnsgruppene fikk i \u00e5rets l\u00f8nnsoppgj\u00f8r.
  Forskjellene bare fortsetter \u00e5 \u00f8ke, og de som holder igjen p\u00e5 de
  fattigste her i kommunen, har problemer med \u00e5 v\u00e6re restriktive til seg
  selv.\\n\\nDet er ikke ledere som er mangelvare, de har vi nok av og er ikke vanskelig
  \u00e5 rekruttere. Det er det andre yrkesgrupper som er.\\n\\nFagforbundet\\n\\nGrunnbemanningen
  er sv\u00e6rt lav p\u00e5 flere tjenestesteder, dette gjelder blant annet b\u00e5de
  i eldreomsorg i alle ledd, b\u00e5de inne og, i renhold og psykisk helse og rus.
  Til tross for at sistnevnte er styrket gjennom \u00e5ret er vi fortsatt lavest og
  ligger langt under p\u00e5 \u00e5rsverk i omkringliggende kommuner. For \u00e5 komme
  i posisjon til \u00e5 jobbe med forebyggende arbeid m\u00e5 intensjonen fremover
  v\u00e6re \u00e5 styrke forebyggingsarbeidet i alle aldersgrupper. Dette gjelder
  barn/unge, s\u00e5 vel som \u00e5 satse p\u00e5 hverdagsrehabilitering for eldre
  eller meningsfylt hverdag, og aktivitetstilbud til psykisk psyke eller rusavhengige.\\n\\nGjennom
  folkehelseinstituttet og deres folkehelseprofil, vet vi at barnefattigdom forekommer
  i Veg\u00e5rshei, dette henger sammen utenforskap i Veg\u00e5rshei kommune, andelen
  grad av uf\u00f8re og h\u00f8y andel deltidsstillinger.\\n\\n\u00c5 Forebygge kan
  v\u00e6re sv\u00e6rt besparende i et samfunnsperspektiv, og det vil alltid v\u00e6re
  helsefremmende. Det er dyrere \u00e5 \u00abreparere\u00bb en \u00e5 forebygge, men
  dette er vanskelig \u00e5 m\u00e5le. Det handler om hvor det er politisk vilje til
  \u00e5 rette innsatsen.\\n\\nSykefrav\u00e6ret er og har v\u00e6rt over landsgjennomsnittet
  for \u00f8vrig i mange \u00e5r, det er s\u00e6rskilt de kvinnedominerte yrkene som
  er h\u00f8ye, senere \u00e5r er ogs\u00e5 skole hatt samme trenden, dette kan ogs\u00e5
  henge sammen med for lav grunn bemanning. Det b\u00f8r v\u00e6re grunnlag og politisk
  vilje for \u00e5 se p\u00e5 om vi kan bruke vikarmidlene i Veg\u00e5rshei kommune
  p\u00e5 en annen m\u00e5te, det er forsket p\u00e5 at \u00e5 \u00f8ke grunnbemanningen
  kan forebygge sykefrav\u00e6r.\\n\\nSlik kan Norge spare milliarder p\u00e5 \u00e5
  redusere sykefrav\u00e6r i omsorgsyrker (forskning.no)\\n\\nHeltid b\u00f8r v\u00e6re
  hovedregelen i alles arbeidshverdag, \u00e5 sikre v\u00e5re ansattes muligheter
  for \u00e5 ha inntekt \u00e5 leve for m\u00e5 v\u00e6re hovedfokus. I tillegg vil
  man opparbeide pensjon man kan leve av i fremtiden. Det er h\u00f8y andel av deltidsstillinger
  i de kvinnedominerte yrkene- for \u00e5 v\u00e6re og bli en attraktiv arbeidsgiver
  b\u00f8r Veg\u00e5rshei kommune politisk vedta: \u00aballe utlysninger i Veg\u00e5rshei
  kommune skal i hovedsak v\u00e6re 100*%\u00bb Vi vil med dette i tillegg til \u00e5
  v\u00e6re en attraktiv bokommune, bli en attraktiv arbeidsgiver, med dette vil man
  kunne rekruttere dyktige ansatte med ny innovativ og fremtidsrettet kompetanse.\\n\\nAvslutningsvis
  ser det ut som at \u00f8kt grunnbemanning, \u00f8kt merkantilressurs, f\u00e5 p\u00e5
  plass lovp\u00e5lagte oppgaver, samt gi ansatte tilbud om videre og etterutdanning
  er noe av gjennomgangsmelodien fra oss hovedtillitsvalgte. Som vanlig m\u00e5 vi
  fremheve at det ikke er lett \u00e5 ta politiske valg og gj\u00f8re prioriteringer
  og vi har full forst\u00e5else for at dette er en vanskelig jobb. I en gammel l\u00e6rebok
  i samfunnskunnskap fra 80-tallet, st\u00e5r det at politikk handler om fordeling
  av goder og byrder i samfunnet. Noen av byrdene synes n\u00e5 \u00e5 v\u00e6re overf\u00f8rt
  til kommunens innbyggere i form av h\u00f8yere kommunale utgifter, men fordeling
  av \u00f8vrige byrder eller goder gjenst\u00e5r n\u00e5 \u00e5 se. Vi \u00f8nsker
  dere et godt budsjettarbeid ved \u00e5 ta de riktige, eller gj\u00f8re de gode prioriteringene
  som i sum vil gagne Veg\u00e5rshei Kommune. Gledelig og helt p\u00e5 tampen, f\u00e5r
  vi n\u00e5 vite at kommunene vil f\u00e5 dekket noe av de utgiftene de hadde i forbindelse
  med korona. Vi g\u00e5r ut i fra at dette ikke er regnet med s\u00e5 langt i regnskap
  eller budsjett og s\u00e5ledes vil kunne sl\u00e5 positivt inn og skape noe bedre
  stemning.\"", "\"NORSK Sammendrag\\n\\nEffekter av endringer i elbilfordeler\\n\\nT\u00d8I
  rapport 1986/2023 \u2022 Forfattere: Bj\u00f8rn Gjerde Johansen, Vegard \u00d8stli,
  Askill Harkjerr Halse \u2022 Oslo 2023 \u2022 56 sider\\n\\nVi vurderer effekten
  av gjennomf\u00f8rte og planlagte avgiftsendringer p\u00e5 klimautslipp fra kj\u00f8ring
  med personbiler i Oslo fram mot 2030. Vurderingene er basert p\u00e5 eksisterende
  empiri kombinert med nye analyser med BIG-modellen og \u00f8konometriske analyser
  av effekten av bompenger for elbiler p\u00e5 arbeidsreisen. Resultatene viser at
  avgiftsendringer som gj\u00f8r det mindre l\u00f8nnsomt \u00e5 eie og bruke elbil
  vil gj\u00f8re at utslippene i Oslo ikke g\u00e5r like raskt nedover som tidligere
  forutsatt. Utslippene \u00f8ker alts\u00e5 relativt til referansebanen. De endringene
  som sl\u00e5r mest ut er full bompengetakst for elbiler og full merverdiavgift for
  elbiler. Ettersom analysene er basert p\u00e5 historiske data og elbilmarkedet er
  i rask utvikling, er det betydelig utsikkerhet i anslagene.\\n\\nI forbindelse med
  Oslos arbeid med reduksjon av utslipp av klimagasser er det utarbeidet en referansebane
  for klimagassutslipp i Oslo fram til 2030. Veitrafikken er den st\u00f8rste kilden
  til klimagassutslipp i Oslo, og forutsetninger knyttet til utslipp fra veitrafikken
  kan ha stor betydning for referansebanen. I dette prosjektet unders\u00f8ker vi
  hvordan endringer i elbilfordelene og andre virkemidler p\u00e5virker innfasing
  av elbiler og klimagassutslipp fra kj\u00f8ring med personbiler i Oslo. Vi ser p\u00e5
  b\u00e5de gjennomf\u00f8rte og foresl\u00e5tte endringer. Studien er avgrenset til
  personbiler og til utslipp fra kj\u00f8ring innenfor Oslo.\\n\\nVi fokuserer p\u00e5
  relative endringer. Det vil si at vi legger dagens referansebane til grunn, og ansl\u00e5r
  hvordan ulike endringer vil sl\u00e5 ut i forhold til denne. \u00c5 beregne absolutte
  utslipp i b\u00e5de en referansebane og i ulike tiltaksbaner ligger utenfor dette
  prosjektet, men arbeidet vil danne et grunnlag for \u00e5 vurdere om referansebanen
  b\u00f8r oppdateres.\\n\\nVi unders\u00f8ker f\u00f8lgende effekter:\\n\\n* Effekter
  av vedtatte avgiftsendringer:\\no Innf\u00f8ring av vektkomponent i engangsavgiften
  for personbiler\\no Fjerning av momsfritak for elbiler over 500 000 kroner\\no Innf\u00f8ring
  av full omregistreringsavgift for elbiler\\no \u00d8kte bompenger for elbiler i
  bomringen i Oslo, det vil si (a) \u00f8kning 50 til 70 prosent takst for elbiler
  og (b) fjerning av differensiering mellom el og fossil\\n* Effekter av foresl\u00e5tte
  avgiftsendringer:\\no Innf\u00f8ring av veibruksavgift for elbiler i tillegg til
  bompenger\\n* Effekter av \u00f8kt CO2-avgift p\u00e5 drivstoff\\no Fjerning av
  momsfritaket for elbiler\\n\\nVi tar i analysene hensyn til at endringer i ulike
  virkemidler kan ha en effekt b\u00e5de p\u00e5 valget mellom elbil og eksosbil og
  p\u00e5 samlet bilhold og kj\u00f8ring. Det er imidlertid kun endringen i kj\u00f8ring
  med eksosbiler som har betydning for utslippene.\\n\\nStatistikken viser at innfasingen
  av elbiler i Oslo skjer raskt. Bare fra 2019 til 2022 har elbilandelen av nybilsalget
  doblet seg, fra 38 prosent til 76 prosent. N\u00e5r vi ser p\u00e5 biler eid av
  innbyggere i Oslo, \u00f8ker elbilandelen og kj\u00f8ringen med elbiler omtrent
  i takt. Utviklingen i elbilandelen i bomringene i Oslo er noks\u00e5 lik. Tall for
  nybilsalget viser at vekt og pris p\u00e5 nye elbiler har \u00f8kt over tid. \u00d8kningen
  b\u00f8r ses i sammenheng med at det har kommet flere nye elbilmodeller i det st\u00f8rre
  segmentet med lang rekkevidde, og at bilkj\u00f8perne i st\u00f8rre grad velger
  disse. N\u00e5r det gjelder samlet trafikk er utviklingen de siste \u00e5rene noks\u00e5
  flat.\\n\\nDet eksisterer ikke \u00e9n modell som kan beregne effektene av alle
  de aktuelle endringene i virkemidler p\u00e5 elbilinnfasing og klimagassutslipp.
  Vi gj\u00f8r derfor en vurdering av st\u00f8rrelsene p\u00e5 de ulike effektene
  basert p\u00e5 tilgjengelig empiri kombinert med utvalgte nye analyser. Vi har gjort
  analyser av ulike avgiftsendringer med modellen BIG og analyser av effekten av bompenger
  p\u00e5 arbeidsreisen for elbiler ved hjelp av individuelle registerdata. Effektene
  er beregnet basert p\u00e5 det vi mener er det beste tilgjengelig kunnskapsgrunnlaget,
  men det vil \u00e5penbart v\u00e6re usikkerhet knyttet til hvordan virkemidlene
  faktisk sl\u00e5r ut. Det mest p\u00e5fallende er at alle analyser n\u00f8dvendigvis
  vil v\u00e6re basert p\u00e5 historiske data. Dette er problematisk i et marked
  hvor utviklingen i b\u00e5de teknologi og markedsandeler er s\u00e5 stor.\\n\\nBeregningene
  v\u00e5re viser at gjennomf\u00f8rte og foresl\u00e5tte endringer i elbilfordelene
  som gj\u00f8r det mindre l\u00f8nnsomt \u00e5 eie og bruke elbil sammenliknet med
  eksosbil isolert sett vil gi en \u00f8kning i klimagassutslippene fra kj\u00f8ring
  med personbiler i Oslo fram mot 2030. Utslippene vil fortsatt synke, men nedgangen
  g\u00e5r noe saktere enn dersom disse endringene ikke hadde v\u00e6rt gjort. Figur
  S.1 illustrerer hvordan hvert enkelttiltak vil p\u00e5virke klimagassutslippet \u00e5r
  for \u00e5r, relativt til referansebanen. For \u00f8kt CO2-avgift p\u00e5 drivstoff
  har vi tatt utgangspunkt i en dobling (tilsvarende ti prosents \u00f8kning i utsalgspris).
  For veibruksavgift for elbiler har vi tatt utgangspunkt i 29 \u00f8re per kilometer
  \u2013 dette kommer i tillegg til dagens bomtakster. For \u00e5 gj\u00f8re det lettere
  \u00e5 sammenligne effektene, antas det her at alle enkelt-tiltak innf\u00f8res
  fra og med 2023.\\n\\n\u00c5rlig endring fra referansebanen - kombinasjoner av tiltak\\n\\nVirkemidlene
  som har st\u00f8rst betydning isolert sett er full moms p\u00e5 nye elbiler og full
  takst for elbiler i bomringen. Beregningene indikerer at full moms ville \u00f8kt
  utslippet i 2030 med om lag 25 prosent, og full takst i bomringen ville \u00f8kt
  utslippet med nesten 29 prosent. Disse utslipps\u00f8kningene stammer fra at flere
  velger bort elbilen n\u00e5r den blir dyrere \u00e5 kj\u00f8pe og eie. Selv om total
  kj\u00f8ring g\u00e5r noe ned, vil mange husholdninger velge eksosbil isteden.\\n\\nI
  tillegg til \u00e5 vurdere effekten av ulike enkeltvirkemidler, har vi ogs\u00e5
  sett p\u00e5 totaleffekten av utvalgte pakker av virkemidler. Disse er ogs\u00e5
  vist i figuren.\\n\\n* De allerede innf\u00f8rte kj\u00f8psavgiftene (MVA p\u00e5
  over 500 000, innf\u00f8ring av engangsavgift med vektkomponent og omregistreringsavgift
  for elbiler) ligger ikke inne i referansebanen. Beregningene tyder p\u00e5 at disse
  avgiftene vil f\u00f8re til at utslippet i 2030 vil v\u00e6re litt over 10 prosent
  h\u00f8yere enn referansebanen tilsier.\\n* Videre vil en veibruksavgift for elbiler
  p\u00e5 29 \u00f8re per kilometer, i tillegg til innf\u00f8rte kj\u00f8psavgifter
  og 70 prosents bompengetakst, f\u00f8re til en utslipps\u00f8kning p\u00e5 28 prosent
  i 2030.\\n* Dersom elbiltaksten i bomringen i 2023 \u00f8ker til 70 prosent av normaltakst
  i tillegg til dette, vil utslippene relativt til referansebanen \u00f8ke med n\u00e6rmere
  22 prosent i 2030.\\n\\nN\u00e5r man ser p\u00e5 den relative utslippsendringen
  over tid, er det imidlertid viktig \u00e5 huske p\u00e5 at klimagassutslippene i
  referansebanen er betydelig h\u00f8yere i 2020 enn i 2030. Det er derfor den\\n\\nrelative
  effekten i tidligere \u00e5r blir s\u00e5pass liten sammenlignet med den relative
  effekten i senere \u00e5r. Figur S.2 pr\u00f8ver \u00e5 illustrere st\u00f8rrelsesordenen
  av dette, ved \u00e5 vise hva hver enkeltavgift har \u00e5 si for niv\u00e5et p\u00e5
  \u00e5rlige utslipp mot 2030. Merk at det er niv\u00e5et for referansebanen pluss
  hvert enkelttiltak isolert sett som vises, og referansebanen vil underdrive utslippene
  fordi allerede innf\u00f8rte kj\u00f8psavgifter ikke ligger inne. Derfor b\u00f8r
  ikke Figur S.2 brukes til \u00e5 si hva vi tror utslippene faktisk vil bli.\\n\\nFiguren
  illustrerer den \u00e5rlige forskjellen i utslippsniv\u00e5 for \u00e9n og \u00e9n
  politikkendring. Den stiplede linja utgj\u00f8r referansealternativet, og alle utslippsendringene
  er relativt til denne. P\u00e5 grunn av skalaen er det vanskelig \u00e5 se forskjell
  p\u00e5 hver enkelt linje, men rekkef\u00f8lgen p\u00e5, og den relative avstanden
  mellom linjene er den samme som i Figur S.1. Figuren illustrerer at p\u00e5 tross
  av betydelige endringer i 2030-utslippet, er disse forskjellene sm\u00e5 sammenlignet
  med 2020niv\u00e5et. I referansebanen har utslippene sunket fra om lag 270 000 tonn
  per \u00e5r i 2020 til om lag 77 500 tonn per \u00e5r i 2030. Til sammenligning
  gir de mest utslagsgivende beregningene v\u00e5re utslipp p\u00e5 opp mot 100 000
  tonn i 2030.\\n\\nOslo kommunes klimam\u00e5l er en 95 prosents reduksjon i direkte
  klimagassutslipp i Oslo i 2030 sammenlignet med 2009-niv\u00e5et. For \u00e5 illustrere
  disse virkemidlenes direkte p\u00e5virkning p\u00e5 klimam\u00e5let, viser vi ogs\u00e5
  hvilken reduksjon 2030-utslippstallene fra forrige figur utgj\u00f8r relativt til
  utslippet i 2009.\\n\\nFigur S.3 illustrerer at selv i referansebanen er ikke utslippskuttene
  store nok til \u00e5 n\u00e5 klimam\u00e5let p\u00e5 95 prosents reduksjon (for
  persontransport p\u00e5 vei isolert): 77 500 tonn CO2 i 2030 som referansebanen
  tilsier utgj\u00f8r en nedgang p\u00e5 81,4 prosent sammenlignet med 2009-niv\u00e5.
  De allerede innf\u00f8rte kj\u00f8psavgiftene for elbiler vil if\u00f8lge v\u00e5re
  beregninger redusere dette ytterligere, til rundt 79,5 prosent. Dersom bomtaksten
  for elbiler hadde \u00f8kt til 70 prosent av normaltakst i 2023 havner utslippsreduksjonen
  p\u00e5 77,4 prosent. En veibruksavgift for elbiler p\u00e5 toppen av dette ville
  redusert utslippsreduksjonen til 76,2 prosent, med et utslippsniv\u00e5 i n\u00e6rheten
  av 100 000 tonn CO2 i 2030.\\n\\nDet er betydelig usikkerhet i disse resultatene.
  Noen av analysene er basert p\u00e5 data som er noen \u00e5r gamle, som betyr at
  vi ikke fullt ut tar hensyn til dagens tilbud av og ettersp\u00f8rsel etter ulike
  bilmodeller. For alle avgifter som p\u00e5virker prisen p\u00e5 nye biler har vi
  eksempelvis tatt utgangspunkt i BIG-modellen, som er estimert p\u00e5 2019-data.
  Vi har gjort skj\u00f8nnsmessige korrigeringer i beregningene for at de bedre skal
  reflektere dagens bilpark der vi mener det er grunnlag for dette. Dette gjelder
  spesielt for MVA over 500 000 kroner og engangsavgiftens vektkomponent for elbiler,
  i og med at bilene som selges i dag typisk er dyrere og tyngre enn i 2019. I mange
  tilfeller er det derimot uklart om endringene i markedet fra beregningstidspunktet
  og fram til i dag (og til 2030) vil redusere eller forsterke de beregnede effektene.\\n\\nDet
  er ogs\u00e5 verdt \u00e5 nevne at persontransport er utslippskilden fra transportsektoren
  det er knyttet st\u00f8rst usikkerhet til i selve referansebanen. I grunnlaget for
  referansebanen er det oppgitt en nedre og en \u00f8vre grense p\u00e5 utslippet
  i referansebanen i 2030 til 28 091 tonn og 137 540 tonn, respektivt, med en middelverdi
  p\u00e5 77 500 tonn. Selv om v\u00e5re beregninger tyder p\u00e5 at virkemidlene
  har en betydelig effekt p\u00e5 utslippsniv\u00e5et, inneb\u00e6rer ingen av politikkendringene
  vi har sett p\u00e5 utslipp i n\u00e6rheten av den \u00f8vre grensen av usikkerhetsintervallet
  fra referansebanen.\\n\\nVi har i denne rapporten kun sett p\u00e5 effekten p\u00e5
  klimagassutslipp, ikke andre effekter av endringer i virkemidlene og eventuelle
  m\u00e5lkonflikter. Endringene i virkemidlene som gj\u00f8r det dyrere og eie eller
  bruke elbil vil ogs\u00e5 gi en reduksjon i samlet bilhold og bilbruk. Det vil derfor
  til en viss grad v\u00e6re en avveining mellom \u00e5 kutte klimagassutslippene
  fra bilbruk og \u00e5 redusere biltrafikken generelt, men det er mulig \u00e5 utforme
  en politikk som kombinerer disse hensynene.\"", "\"Sekskantbolt helgjenget Din 933
