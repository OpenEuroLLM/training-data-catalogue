  med \u00e5 fremme medbestemmelse og demokrati p\u00e5 arbeidsplassen.\\n\\nM\u00e5lgruppe:
  Tillitsvalgte og medlemmer i Spektervirksomhetene.\\n\\nInnleder: Arild Kjempekjenn,
