  Vaskes p\u00e5        | 40\u00b0    | 40\u00b0    | 40\u00b0    | 40\u00b0    |
  40\u00b0    |\\n\\nGod beskyttelse tilpasset hver enkelt\\n\\nStarlight-hjelmene
  fra Ato From gir god beskyttelse takket v\u00e6re en anatomisk korrekt utforming
  tilpasset den enkelte. Slag og st\u00f8t reduseres ved at st\u00f8tet fordeles utover
  i hjelmen grunnet det absorberende materialet som hjelmene er produsert i.\\n\\nHjelmene
  f\u00e5s i bomull og l\u00e6r, i mange ulike farger og med et stort utvalgt tilbeh\u00f8r,
  hvilket gj\u00f8r at de kan tilpasses brukerens behov. Individuell og n\u00f8yaktig
  passform oppn\u00e5s ved at man fyller ut et m\u00e5l-/bestillingsskjema.\\n\\nAto
  Form-hjelmene finnes i ulike modeller og fasonger\\n\\n**Starlight Aqua**\\n\\nEn
  hjelm i bruk i basseng og omr\u00e5der med h\u00f8y fuktighet. Hele hodet er beskyttet
  av et elastisk og st\u00f8tabsorberende skum.\\n\\n**Starlight Base i bomull**\\n\\nStarlight
  Base er bygd opp p\u00e5 samme m\u00e5te som Starlight Secure. Hodet er sv\u00e6rt
  godt beskyttet takket v\u00e6re den anatomiske utformingen. Slag og st\u00f8t reduseres
  ved at st\u00f8tet fordeles utover i hjelmen. Tinningen og \u00f8reomr\u00e5det
  er spesielt godt polstret med et st\u00f8tabsorberende skum. Starlight Base er luftig
  og behagelig.\\n\\n**Starlight Easy i l\u00e6r**\\n\\nStarlight Easy har lav vekt.
  Den er laget i high-tech-skum som former seg etter hodet slik at passformen blir
  helt riktig, hvilket ogs\u00e5 gj\u00f8r at hjelmen beskytter sv\u00e6rt godt.\\n\\n**Starlight
  Flex i l\u00e6r**\\n\\nStarlight Flex er perfekt n\u00e5r man forventer en forandring
  av hodeomkretsen innenfor en kort tidsperiode, for eksempel ved vekst eller etter
  en operasjon. Starlight Flex er justerbar i hodeomkrets- og form og kan derfor tilpasses
  til den enkelte.\\n\\n**Starlight Generation Baseball cap / Starlight Generation
  Felt cap**\\n\\nDisse hjelmene er laget av materialet polyuretan, et skum som gir
  god, men n\u00f8ytral hodebeskyttelse.\\n\\n**Starlight Go Sport / Starlight Go
  Sport Plus, l\u00e6r**\\n\\nDisse hjelmene er konstruert etter sandwich-prinsippet,
  som s\u00f8rger for absorbering og fordeling av slag og st\u00f8t mot hodet. Bakdelen
  av hjelmen er polstret med et hardt skumskall som beskytter mot harde slag og fall.
  Starlight Go Sport har en pannebeskyttelse som er 1,5 cm tykk, mens pannebeskyttelsen
  p\u00e5 Starlight Go Plus er 4,5 cm tykk.\\n\\nAto form Starlight hjelmer\\n\\nStarlight
  Protect / Starlight Protect Plus i l\u00e6r\\n\\nStarlight Protect er konstruert
  etter sandwich-prinsippet, for god absorbering og fordeling av slag og st\u00f8t
  mot hodet. Bakdelen av hjelmen har et hardt skumskall som beskytter bakhodet mot
  fall og slag. Pannebeskyttelsen p\u00e5 Starlight Protect er 1,5 cm tykk, mens pannebeskyttelsen
  p\u00e5 Starlight Protect Plus er 4 cm tykk.\\n\\nStarlight Secure i l\u00e6r eller
  bomull\\n\\nStarlight Secure har en anatomisk utforming som beskytter hodet sv\u00e6rt
  godt. Slag og st\u00f8t reduseres ved at st\u00f8tet fordeles utover i hjelmen.
  Tinningene og \u00f8rene er spesielt godt polstret med st\u00f8tabsorberende skum.
  Hjelmen f\u00e5s i l\u00e6r eller bomull.\\n\\nStarlight Toppen\\n\\nStarlight Toppen
  er enkel, veier lite og gir god beskyttelse mot slag. Materialet og utformingen
  gj\u00f8r at hjelmen er ventilert og behagelig for hodet.\\n\\nTilbeh\u00f8r/utf\u00f8relser:\\n\\nStarlight-hjelmene
  f\u00e5s i ulike utf\u00f8relser med ulikt tilbeh\u00f8r for den beste beskyttelsen
  for den enkelte.\\n\\nSe bestillingsskjema for utfyllende informasjon.\\n\\n- \u00c5pen
  topp\\n- Lukket topp\\n- \u00c5pen caps\\n- Lukket caps\\n- \u00d8rebekytelse\\n-
  Ekstra pannebeskyttelse\\n- Ekstra bakhodebeskyttelse\\n- Kinnbeskyttelse i l\u00e6r\\n-
  Ekstra ansiktsbeskyttelse\\n- Hakebeskyttelse\\n\\nSpenneutvalg:\\n\\nStarlight
  hjelmene kan f\u00e5s med ulike spenner.\\n\\nSe bestillingsskjema for utfyllende
  informasjon.\\n\\n- Thorn-spenne\\n- Forsterket Thorn-spenne\\n- Fixlock\\n- Fixlock-spenne
  med sikkerhetsl\u00e5s\\n- Velcro\\n- Magnetl\u00e5s\\n\\nSe bestillingsskjema p\u00e5
