  StarlightToppen lukket caps str. 62 m fixlock-spenne, bl\u00e5 |\\n\\nEn lett og
  behagelig hjelm med sv\u00e6rt gode reguleringsmuligheter\\n\\nCapovario er en lett
  og behagelig hjelm med sv\u00e6rt gode reguleringsmuligheter. Den passer b\u00e5de
  barn (fra seks m\u00e5neder) og voksne, passer alle hodeformer, kan tilpasses i
  etterkant og kan f\u00e5s i spesialm\u00e5l.\\n\\nHjelmen er enkel \u00e5 tilpasse
  til den enkelte, og det er ikke n\u00f8dvendig med helt n\u00f8yaktige m\u00e5l
  ved tilpasning av hjelmen, hvilket kommer godt med dersom bruker er utagerende.\\n\\nPannebeskyttelsen
  er 4,5 cm tykk og beskytter dermed ogs\u00e5 nesen ved fall. Hjelmen har hake-,
  munn- og \u00f8rebeskyttelse, og kan leveres med polstret eller upolstret hakereim.\\n\\nPolstringen
  p\u00e5 hjelmen kan f\u00e5s hard eller myk og det kan leveres ekstra polstringer
  og innmat, visir og magnetisk spenne.\\n\\nCapovario finnes i fargene bl\u00e5tt
  og gr\u00e5tt og leveres i de to modellene Standard og Light. Standard leveres med
  utbygd pannebeskyttelse og Light leveres med flat pannebeskyttelse.\\n\\nHjelmens
  utside er laget i mikrofiber, men kan ogs\u00e5 f\u00e5s i skinn. Det kan v\u00e6re
  nyttig dersom den stadig m\u00e5 t\u00f8rkes av.\\n\\nHele innsiden av hjelmen kan
  tas ut og vaskes p\u00e5 40 \u00b0C.\\n\\n### Capovario hjelm\\n\\n| HMS nr. | Art.nr   |
