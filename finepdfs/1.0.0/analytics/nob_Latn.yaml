  39\\n\\n1 Sammendrag\\n\\nI situasjoner der de fysiske forholdene \u00e5penbart
  skulle v\u00e6re begrensende faktorer for biologisk vekst, er det naturlig \u00e5
  anta at r\u00e5tesopper ikke vil kunne overleve og at r\u00e5teskader ikke vil oppf\u00f8re
  i treverk. Dette har v\u00e6rt en \\\"opplest og vedtatt sannhet\\\" innen kulturminnevernnet
  p\u00e5 Svalbard i mange \u00e5r. Det polare klimaet p\u00e5 \u00f8ygruppa syntes
  \u00e5 utgj\u00f8re en overbevisende garantist for beskyttelse mot r\u00e5tesopp
  p\u00e5 grunn av ekstremt kj\u00f8lig og t\u00f8rt klima. Dette har likevel vist
  seg \u00e5 v\u00e6re feil; unders\u00f8kelser i felt i perioden 2002 \u2013 2005
  og 2008-2012 har vist at sv\u00e6rt mange av kulturminnene p\u00e5 Svalbard har
  r\u00e5teskader, mange av dem alvorlige.\\n\\nNIKU og Mycoteam har gjennom feltarbeid
  p\u00e5 Svalbard siden 2003 registrert at r\u00e5tesoppskader er vanlig forekommende,
  s\u00e6rlig i forbindelse med treverk som ligger i bakkekontakt. I 2010 og 2012
  fikk vi takket v\u00e6re st\u00f8tte fra Svalbards milj\u00f8vernfond anledning
  til \u00e5 unders\u00f8ke de 9 taubanebukkene i den gamle gruvebyen i Hiorthhamn
  og ca. 50 taubanebukker i Longyearbyen.\\n\\nResultatet av dette arbeidet viser
  at det er store svekkelser i mange bukker for\u00e5rsaket av r\u00e5tesoppskader.
  Majoriteten av disse skadene er tiln\u00e6rmet umulig \u00e5 oppdage visuelt fra
  utsiden. De er dessuten sv\u00e6rt vanskelige \u00e5 klarlegge ved hjelp av tradisjonelle
  unders\u00f8kelsesmetoder. Det ble derfor utviklet en egen unders\u00f8kelsesprosedyre
  ved hjelp av spesielt teknisk utstyr (r\u00e5tedrill).\\n\\nUnders\u00f8kelsene
  viste for \u00f8vrig at det var stor variasjon i omfang av r\u00e5tesoppskader i
  de unders\u00f8kte bukkene, fra tiln\u00e6rmet friske materialer til meget omfattende
  r\u00e5teskader med alvorlig nedbrytning. Skadene opptrer tilsynelatende tilfeldig,
  og det er umulig \u00e5 avklare tilstedev\u00e6relsen av eventuelle skader uten
  en ing\u00e5ende unders\u00f8kelse.\\n\\nRapporten inneholder en oversikt over bukkenes
  tilstand og en liste med forslag til tiltak.\\n\\n2 Innledning\\n\\n2.1 Bakgrunn\\n\\nGruvedriften
  i Logyearbyen og Hiorthhamn foregikk i gruver med ingang oppe i fjellsiden. Kullet
  ble fraktet ut til gruveinngangen og lastet over i \u00abkibber\u00bb p\u00e5 taubaner
  som fraktet kullet ned til utskipningshavna. Taubanebukker i tre holdt kabelen med
  kibbene oppe. Disse var plassert med jevne mellomrom langs traseene, og hver gruve
  hadde sin trase. I dag st\u00e5r fortsatt sv\u00e6rt mange av disse taubanebukkene
  igjen som ruvende vitnesbyrd etter gruvedriften. I og rundt Longyearbyen g\u00e5r
  det taubanetraseer fra fem nedlagte gruver. Disse traseene inneholder til sammen
  om lag 200 taubanebukker. P\u00e5 Hiorthhamn er det kun 9 igjen, noen st\u00e5ende
  og noen falt over ende.\\n\\nNIKU og Mycoteam har gjennom feltarbeid p\u00e5 Svalbard
  siden 2003 registrert at r\u00e5tesoppskader er vanlig forekommende, s\u00e6rlig
  i forbindelse med treverk som ligger i bakkekontakt. I 2009 registrerte vi kraftige
  r\u00e5tesoppskader ved Gruve 2B i to taubanebukker som hadde fallt overende i forbindelse
  med et sn\u00f8ras. Analyse av pr\u00f8ver fra disse skadene viste at nedbrytningen
  var for\u00e5rsaket av husnetsopp (Leucogyrophana mollis). I 2010 fikk vi takket
  v\u00e6re st\u00f8tte fra Svalbards Milj\u00f8vernfond anledning til \u00e5 unders\u00f8ke
  taubanebukkene i Hiorthhamn. Disse unders\u00f8kelsene viste at mange av bukkene
  var sterkt r\u00e5teskadet i fundamentbena. Disse skadene var for\u00e5rsaket av
  den samme r\u00e5tesoppen, husnetsopp, som vi fant i fundamentbena til de to bukkene
  i taubanen til Gruve 2B.\\n\\nFordi det var det samme skadebildet i de to unders\u00f8kte
  taubanebukkene ved Gruve 2B og i Hiorthhamn, var det det all grunn til \u00e5 anta
  at ogs\u00e5 mange av de \u00f8vrige taubanebukkene i Longyearbyen hadde tilsvarende
  skader. NIKU og Mycoteam s\u00f8kte derfor Svalbards Milj\u00f8vernfond i 2012 og
  fikk st\u00f8tte til \u00e5 unders\u00f8ke rundt 50 av de 200 bukkene i Longyearbyen.\\n\\nResultatet
  av dette arbeidet viser at det er store svekkelser i mange bukker for\u00e5rsaket
  av r\u00e5tesoppskader. Majoriteten av disse skadene er tilsynelatende umulig \u00e5
  oppdage visuelt fra utsiden. De er dessuten sv\u00e6rt vanskelige \u00e5 klarlegge
  ved hjelp av tradisjonelle unders\u00f8kelsesmetoder. Det ble derfor utviklet en
  egen unders\u00f8kelsesprosedyre ved hjelp av spesielt teknisk utstyr (r\u00e5tedrill).\\n\\nEtter
  \u00e5 ha jobbet med r\u00e5tesoppskadet treverk i bygninger og konstruksjoner gjennom
  25 \u00e5r, vet vi at det er komplisert \u00e5 oppdage innvendige skader i trematerialer
  uten at det gjennomf\u00f8res en destruktiv unders\u00f8kelse. Det er vanlig enten
  \u00e5 benytte et tilvekstbor (som lager et hull p\u00e5 minimum 1 cm i diameter)
  eller enda st\u00f8rre pr\u00f8veuttak ved at man f\u00f8r eksempel sager av en
  bit/skive av det aktuelle treverket (stokken, stenderen og lignende). Alternativt
  kan man med en metode, som vi vil definere som en tilsynelatende non-destructiv,
  meget godt kontrollere holdfastheten tvers igjennom treverket ved \u00e5 benytte
  en s.k. r\u00e5tedrill, slik vi har gjort. Dette er en sv\u00e6rt sk\u00e5nsom,
  men fremdeles meget effektiv unders\u00f8kelsesmetode for \u00e5 oppdage/unders\u00f8ke
  innvendige r\u00e5tesoppskader uten \u00e5 \u00f8delegge selve treverket. Den eneste
  effekten er at det blir et 2 millimeter stort hull i treverket. Vi vet fra oppf\u00f8lgende
  fuktm\u00e5linger at slike hull ikke p\u00e5virker vannopptak i treverket. Videre
  er hullene erfaringsmessig meget lite synlige og de trutner lett hvis treverket
  blir fuktig, slik at hullene blir enda vanskelige \u00e5 finne i ettertid. M\u00e5leverdiene
  kan avleses i form av b\u00e5de en graf som skrives direkte ut p\u00e5 en papirstrimmel
  og ved at man kan laste ned data til en PC.\\n\\nFoto 1 Taubanebukkene langs Burmaveien.
  Taubanesentralen samlet alle taubanetraseene og sendte dem videre i en trase ut
  langs Burmaveien til utskipningskaia p\u00e5 Hotellneset. Foto: AC Flyen, NIKU\\n\\nDenne
  rapporten omhandler f\u00f8rst og fremst en gjennomgang av tilstanden til de unders\u00f8kte
  taubanebukkene i Longyearbyen. Unders\u00f8kelsene som er foretatt p\u00e5 taubanebukkene
  i Hiorthhamn er allerede rapportert i en intern oppdragsrapport til Svalbards Milj\u00f8vernfond.
  Imidlertid \u00f8nsker vi med denne rapporten \u00e5 gj\u00f8re resultatene fra
  unders\u00f8kelsene i Hiorthhamn mere tilgjengelige og dessuten \u00e5 sette taubanebukkene
  i Hiorthhamn og Longyearbyen inn i en sammenheng. Rapporteringen fra unders\u00f8kelsene
  i Hiorthhamn er derfor ogs\u00e5 tatt inn i denne rapporten.\\n\\n![Photo 2](image)\\n\\n*Foto
  2 Langs de forskjellige taubanetraseene fins b\u00e5de h\u00f8ye og lave bukker.
  Denne bukken h\u00f8rer til Bane 5 og er en av de h\u00f8yeste der den st\u00e5r
  ute i Longyeardalens. Foto: AC Flyen, NIU*\\n\\n### 2.2 Forskningsfeltet\\n\\nI
  situasjoner der de fysiske forholdene \u00e5penbart skulle v\u00e6re begrensende
  faktorer for biologisk vekst, er det naturlig \u00e5 anta at r\u00e5tesopper ikke
  vil kunne overleve og at r\u00e5teskader ikke vil opptre i treverk.\\n\\nDette har
  v\u00e6rt en \u201copplest og vedtatt sannhet\u201d innen kulturminnevernet p\u00e5
  Svalbard i mange \u00e5r. Det polare klimaet p\u00e5 \u00f8ygruppa syntes \u00e5
  utgj\u00f8re en overbevisende garantist for beskyttelse mot r\u00e5tesopp p\u00e5
  grunn av ekstremt kj\u00f8lig og t\u00f8rt klima. Dette har likevel vist seg \u00e5
  v\u00e6re feil; V\u00e5re unders\u00f8kelser har vist at de fysiske forholdene for
  vekst av r\u00e5tesopp i treverk som st\u00e5r i jordkontakt kan v\u00e6re gunstige
  om sommeren (Flyen og Mattsson 2010). Dertil har v\u00e5re unders\u00f8kelser i
  felt i perioden 2002 \u2013 2005 og 2008-2012 vist at sv\u00e6rt mange av kulturminnene
  p\u00e5 Svalbard har r\u00e5teskader, mange av dem alvorlige. Disse funnene er blant
  annet rapportert i flere artikler og rapporter de siste \u00e5rene (Mattsson og
  Flyen 2008, Flyen og Mattsson 2010, Mattsson et.al., 2010, Flyen og Mattsson 2011,
  Mattsson og Flyen 2011, Flyen 2012).\\n\\nDet samme problemet med biologisk nedbrytning
  av kulturminner er p\u00e5vist i Antarktis (Blanchette & Farrell 2002, Held et.al.
  2005, Farell et. al. 2010). Og selv om det kalde og t\u00f8rre Antarktiske klimaet
  har stor innvirkning p\u00e5 nedbrytningshastigheten i forhold til mere tempererte
  omgivelser, har det ogs\u00e5 der forekommet betydelig nedbrytning av treverket
  i kulturminner i de siste \u00e5rtier.(Held et.al 2004, Blanchette et.al. 2002,
  Held et.al. 2003). Imlidertid har forskerne ikke funnet samme type r\u00e5tesopp
  i Antarktis som vi har funnet som den mest utbredde p\u00e5 Svalbard (Blanchette
  et.al. 2004, Blanchette et.al. 2008, Mattsson et.al. 2010).\\n\\nUtvikling av r\u00e5tesoppskader
  er avhengig av gunstige vekstforhold (figur 1).\\n\\nFigur 1 Forutsetninger for
  vest av r\u00e5tesopp.\\n\\nN\u00e6ringen finner soppene i cellulosen, men i t\u00f8rt
  treverk kan det ikke skje noen nedbrytning. For utvikling av r\u00e5tesoppangrep
  m\u00e5 det v\u00e6re tilstrekkelig v\u00e5tt i treverket til at de ekstracellul\u00e6re\\n\\nenzymene
  som soppen skiller ut, kan trekke ut i en vannfase og bryte ned cellulosen i vedcellene.
  Dette betyr at det trengs en trefuktighet p\u00e5 minst 20 %, gjerne opp mot fibermetningspunktet
  p\u00e5 28-30 %. De fleste r\u00e5tesoppene klarer \u00e5 vokse hvis temperaturen
  er mer enn ca. +3 \u00b0C, og de stopper \u00e5 vokse hvis temperaturen blir h\u00f8yere
  enn ca.+ 40 \u00b0C. Ved temperaturer under frysepunktet skjer det ingen vekst av
  r\u00e5tesopp, men de fleste soppene overlever en periode med nedfrysning for s\u00e5
  \u00e5 fortsette \u00e5 vokse hvis tilvekstforholdene forbedres (Mattsson 2004).\\n\\nI
  tempererte str\u00f8k er det stort sett gunstige vekstforhold b\u00e5de i treverk
  som er i bakkekontakt og over terreng. I polare str\u00f8k er det mer begrensete
  muligheter, b\u00e5de p\u00e5 grunn av lange perioder med minusgrader og fordi det
  er lite nedb\u00f8r. Dette f\u00f8rer til at det er avgrensede omr\u00e5der av treverk
  som er i risikosonen for utvikling av r\u00e5tesoppskader (figur 2).\\n\\nFigur
  2 Skisse p\u00e5 hvordan det om sommeren er tilgang p\u00e5 fritt vann og gunstig
  temperatur i treverk som st\u00e5r i bakkekontakt p\u00e5 Svalbard. Gunstige vekstforhold
  er klart avgrenset til et mindre omr\u00e5de av treverket som ligger like over og
  under bakken.\\n\\nSysselmannen p\u00e5 Svalbard og Riksantikvaren har i sin forvaltning
  av kulturminnene p\u00e5 \u00f8ygruppa v\u00e6rt n\u00f8dt til \u00e5 forholde seg
  til det faktum at det er mye r\u00e5teskader i kulturminnene b\u00e5de i forbindelser
  med vedlikehold, reparasjoner og restaureringsarbeider p\u00e5 fredete bygninger
  og strukturer. Etatene har likevel ikke hatt ressurser eller kapasitet til \u00e5
  adressere problemstillinger rundt r\u00e5teskader; skadetyper, \u00e5rsaker og l\u00f8sningsmetoder
  p\u00e5 et vitenskapelig niv\u00e5. Reparasjonsmetoder og vedlikeholdstiltak har
  v\u00e6rt valgt ut fra erfaringer fra fastlandet, der b\u00e5de klima, bruksm\u00f8nster,
  konstruksjonsm\u00e5ter og materialbruk avviker fra Svalbard. Dessuten har reparasjonsmetodene\\n\\ntidligere
  v\u00e6rt basert p\u00e5 den tro at r\u00e5teskader ikke opptrer p\u00e5 Svalbard.
  Dette har ikke n\u00f8dvendigvis gitt de beste l\u00f8sninger. Det er uklart hvilke
  metoder som faktisk er de beste under de r\u00e5dende forhold, og det er uklart
  hvordan bygninger som er \u201dsatt i stand\u201d faktisk har klart seg ettersom
  dette ikke er unders\u00f8kt i etterkant. Reparasjonsarbeider har v\u00e6rt utf\u00f8rt
  i en \u00e5rrekke \u2013 ikke minst i en tid da man mente at det ikke forekom r\u00e5teskader
  p\u00e5 Svalbard. Det er derfor trolig en god del spennende svar \u00e5 finne ved
  \u00e5 unders\u00f8ke disse tiltakene. Dette vil danne et viktig grunnlag for utviklingen
  av retningslinjer p\u00e5 optimale tiltak.\\n\\nHvis man i tillegg til denne problemstillingen
  tar med at eventuelle klimaendringer trolig vil kunne f\u00f8re til mer gunstige
  vekstmuligheter for r\u00e5tesopp, er det et \u00e5penbart behov for faglig avklaring
  av disse problemstillingene.\\n\\n2.3 Unders\u00f8kelsesmetoder\\n\\nFeltstudier
  er n\u00f8dvendig for \u00e5 innhente informasjon om skader for\u00e5rsaket av r\u00e5tesopper.
  Slik informasjon trengs b\u00e5de knyttet til selve skadetypen, til type r\u00e5tesopp,
  til omfanget av skade, til konsekvensen av skaden for konstruksjonen og omgivelsene,
  til aktuelle klimatiske forhold; b\u00e5de makro-klimaet og mikro-klimaet, til selve
  materialet og til konstruksjonstypen. V\u00e5re unders\u00f8kelser av taubanebukkene
  p\u00e5 Svalbard er derfor utf\u00f8rt i felt. Vi har benyttet f\u00f8lgende hovedmetoder:\\n\\n2.3.1
  Visuell kontroll\\n\\nAlle bukkene ble grundig unders\u00f8kt for synlige r\u00e5teskader.
  Disse unders\u00f8kelsene dannede ogs\u00e5 utgangspunkt for selve pr\u00f8vetakingen.\\n\\n2.3.2
  Pr\u00f8vetaking\\n\\nTrepr\u00f8ver ble tatt der det var klare tegn til r\u00e5teskader.
  St\u00f8rrelsen p\u00e5 pr\u00f8vene var ikke over 5 cm x 5 cm x 2 cm (lengde x
  bredde x dybde). Dette ga mulighet for en inng\u00e5ende analyse samtidig som det
  var forsvarlig ut fra at konstruksjonene er fredet og at det ikke skulle v\u00e6re
  en kosmetisk forringelse eller konstruktiv svekkelse p\u00e5 grunn av pr\u00f8vetakingen.\\n\\n2.3.3
  R\u00e5tedrilling\\n\\nI prosjektet ble det benyttet en r\u00e5tedrill (Resistograph
  E 300 eller E 400), som er et instrument som registrerer tettheten (uttrykt ved
  dreiemomentet til motoren) til materialene. R\u00e5tedrillunders\u00f8kelsen ble
  utf\u00f8rt ved at et ca. 2 mm tykt spesialbor ble f\u00f8rt gjennom materialene
  \u2013 hovedsakelig i overgangen mellom treverk og terregn. Hullene ble knapt synlig
  og erfaringsmessig trutner slike hull og det er ikke behov for \u00e5 plugge dem
  igjen etterp\u00e5. V\u00e5re tidligere unders\u00f8kelser har dessuten vist at
  slike hull ikke p\u00e5virker konstruksjonenes tekniske tilstand eller levetid.\\n\\nInstrumentets
  skriver gir en utskrift av tettheten til materialet i skala 1:1. Ved kontroll av
  treverket kan bl.a de enkelte \u00e5rringene komme frem - og eventuelle svekkelser
  i materialene (r\u00e5teskader) vil gi fall i materialenes tetthet og registreres
  som fall i kurven. Resistograph E 400 har mulighet for \u00e5 overf\u00f8re dataene
  elektronisk til en pc for videre bearbeiding/grafisk fremstilling (foto 4).\\n\\nFoto
  3 Bruk av r\u00e5tedrill gir et n\u00f8yaktig resultat av holdfastheten i treverket
  gjennom hele stokken, til tross for at det kun blir et hull p\u00e5 ca. 2 mm i diameter
  i treoverflaten. Foto: AC Flyen, NIKU\\n\\nFoto 4 Utskrift fra r\u00e5tedrillen
  ute i felt. Grafen viser holdfastheten i treverket gjennom stokken i m\u00e5lestokk
  en-til-en. Foto: J. Mattsson, Mycoteam\\n\\n2.3.4 Etterbehandling av fakta\\nAlle
  materialpr\u00f8ver av r\u00e5teskadet virke er unders\u00f8kt i laboratorium ved
  mikroskopisk analyse for p\u00e5visning av sopptype og nedbrytningsgrad. Alle r\u00e5tedrillregistreringer
  og materialpr\u00f8ver er behandlet og vurdert.\\n\\nDette inneb\u00e6rer f\u00f8lgende
  oppgaver:\\n\\n- Laboratorieunders\u00f8kelser.\\n- Behandling av r\u00e5tedrillingsdata.\\n-
  Systematisering, analysering og vurdering av felddata.\\n- Rapportskriving, der
  skadeomfang, konsekvens og anbefalte tiltak beskrives.\\n\\n3 Taubanene i Longyearbyen\\nTaubanebukkene
  i Longyearbyen er blant de mest markante kulturminnene i byen. Rekkene av bukker
  er blant de mest synlige sporene etter gruvevirksomheten, og viser med all tydelighet
  ogs\u00e5 i dag hvor kraftig preg gruvevirksomheten satte p\u00e5 byen og det n\u00e6rmeste
  omland. Bukkene fra Gruve 1B og 2B og bukkene fra Taubanesentralen og ut langs Burmaveien
  er automatisk fredet i henhold til Svalbardmilj\u00f8loven, mens bukkene fra Gruve
  5 og 6 er vedtaksfredet etter samme lovverk. Det er flere viktige milj\u00f8aspekter
  knyttet til bukkene, men vi vil hevde at de to viktigste er sikkerhet knyttet til
  menneskelig ferdsel i bukkenes n\u00e6rhet og kulturminneverdien - symbolet p\u00e5
  byens nerve og eksistensgrunnlag.\\n\\nStore Norske (SNSK) eier kulturminnene etter
  gruvevirksomheten og har gjennomf\u00f8rt en enkel visuell tilstandsvurdering av
  taubanebukkene med unders\u00f8kelse av overflater. Dette er viktig for \u00e5 vite
  den tekniske tilstanden p\u00e5 treverket over bakken. Det er imidlertid ikke foretatt
  dybdeunders\u00f8kelser av de mest r\u00e5teutsatte omr\u00e5dene; inne i materialer
  i jordkontakt og p\u00e5 oversiden av horisontale bjelker. For \u00e5 kunne f\u00e5
  en tilfredsstillende oversikt over den tekniske tilstanden p\u00e5 taubanebukkene
  i Longyearbyen m\u00e5 man derfor gjennomf\u00f8re en grundigere unders\u00f8kelse
  av disse materialene. P\u00e5 denne bakgrunn har Norsk institutt for kulturminneforskning
  (NIKU) og Mycoteam AS utviklet et prosjekt for r\u00e5tekontroll av taubanebukkene
  i Longyearbyen, og har utf\u00f8rt unders\u00f8kelser med r\u00e5tedrill, pr\u00f8vetaking
  og laboratorieanalyser. Med bakgrunn i dette materialet har vi vurdert den tekniske
  tilstanden og utarbeidet en prioriteret liste over aktuelle tiltak. Denne listen
  skal ivareta b\u00e5de sikkerhet for ferdsel ved bukkene og en optimal h\u00e5ndtering
  av de kulturhistoriske verdiene. Dette vil s\u00e5 danne grunnlag for SNSKs planlegging
  og utf\u00f8ring av tiltak p\u00e5 bukkene i henhold til fredningsbestemmelsene.\\n\\nFoto
  5 Meget kraftig r\u00e5teskade i indre deler av t\u00f8mmer har f\u00f8rt til en
  \u00f8deleggelse av taubanebukken. Skaden var ikke mulig \u00e5 se fra overflaten.
  Det er slike skader vi var p\u00e5 jakt etter i bukkene p\u00e5 Hiorthhamn og i
  Longyearbyen. Foto: J. Mattsson, Mycoteam\\n\\nFoto 6 I forbindelse med en synlig
  snittflate p\u00e5 liggende t\u00f8mmer er det mulig \u00e5 registrere tegn til
  omfattende r\u00e5tesoppskade i indre deler. Hvis stokken hadde st\u00e5tt nede
  i bakken, ville skaden v\u00e6rt usynlig. Foto: J. Mattsson, Mycoteam\\n\\nI arbeidet
  med unders\u00f8kelsene av taubanebukkene i Longyearbyen ble det satt opp f\u00f8lgende
  hovedoppgaver:\\n\\n1. Etablerer en entydig og grundig dokumentasjon av tilstanden
  til de fredete taubanebukkene i Longyearbyen.\\n2. Dokumentasjon av skadegrads og
  av konsekvensgrad.\\n3. Sette opp en prioriteret liste med oversikt over hvor det
  er behov for tiltak\\n   - strakstiltak der avsperring og/eller reparasjon er n\u00f8dvendig\\n   -
  langsiktige tiltak, der overv\u00e5kning og vedlikehold er mulig.\\n\\n3.1 Metoder
  og gjennomf\u00f8ring\\n\\n3.2 Unders\u00f8kelser\\n\\nAnne-Cathrine Flyen fra Norsk
  institutt for kulturminneforskning (NIKU) og Johan Mattsson fra Mycoteam AS gjennomf\u00f8rte
  feltarbeid i Longyearbyen i perioden 29. juli \u2013 8. august 2012. I forbindelse
  med dette arbeidet ble taubanebukkene i Taubanene fra Gruve 1A, 1B, 2B, banen fra
  Skj\u00e6ringa til Hotellneset kalt Bane 3, og banene fra Gruve 5 og 6 unders\u00f8kt.\\n\\nProsjektet
  har mottatt st\u00f8tte fra Milj\u00f8vernfondet til \u00e5 unders\u00f8ke i underkant
  av \u00bc av bukkene grundig. I l\u00f8pet av feltarbeidet har v\u00e5re unders\u00f8kelser
  vist at vi kunne differensiere unders\u00f8kelsene av bukkene. Det var for eksempel
  mulig \u00e5 g\u00e5 over mange av bukkene i traseen ut til Hotellneset, Bane 3,
  p\u00e5 en mer overordnet m\u00e5te ettersom de fleste av disse bukkene er relativt
  nye og satt opp med en del impregnerte materialer i utsatte deler av konstruksjonen.\\n\\nI
  l\u00f8pet av feltunders\u00f8kelsen har vi unders\u00f8kt 58 bukker inng\u00e5ende.
  24 av disse bukkene ble unders\u00f8kt uten noen form for pr\u00f8vetaking. I 25
  av bukkene ble det foretatt kontroll med r\u00e5tedrill (Densitomat decay detecting
  drill E-300). Totalt ble det foretatt 158 r\u00e5tedrillinger i de 25 bukkene for
  \u00e5 kontrollere holdfastheten i treverket.\\n\\nDet ble tatt ut totalt 125 sm\u00e5
  trepr\u00f8ver fra 34 av bukkene for mikroskopisk analyse av forekommende r\u00e5tesopper.
  B\u00e5de pr\u00f8vetakingen og kontrollene med r\u00e5tedrill er utf\u00f8rt i
  henhold til tillatelser fra Sysselmannen/Riksantikvaren.\\n\\nI tillegg til de bukkene
  som ble kontrollert inng\u00e5ende, har vi vurdert 21 bukker ved en generell kontroll.\\n\\n3.2.1
  S\u00f8knader om tillatelser\\n\\nF\u00f8r oppstart av feltarbeidet ble det s\u00f8kt
  om tillatelse til pr\u00f8vetaking fra Sysselmannen/Riksantikvaren. Vi hadde ogs\u00e5
  f\u00e5tt tillatelse til \u00e5 jobbe med taubanebukkene fra eieren Store Norske.\\n\\nS\u00f8knaden
  til Sysselmannen, som ble innvilget, omfattet unders\u00f8kelser i 50 taubanebukker.
  Grunnen til s\u00f8knaden var at alle disse trekonstruksjonene er fredet i medhold
  av Svalbardmilj\u00f8lovens \u00a7 39 a (automatisk fredet) og \u00a7 39 fjerde
  ledd (vedtaksfredet). Unders\u00f8kelsene omfattet f\u00f8lgende:\\n\\n- R\u00e5tedrilling
  i taubanebukkene\\n- Uttak av trepr\u00f8ver fra taubanebukkene\\n\\n3.3 Resultater\\n\\nV\u00e5re
  unders\u00f8kelser har vist at det er en stor variasjon av etablerte skader. Det
  handler b\u00e5de om rent fysiske/mekaniske skader og nedbrytning av treverket p\u00e5
  grunn av r\u00e5tesopp. I enkelte bukker var det ingen tegn til skader, mens det
  i andre var meget oppfattende angrep av r\u00e5tesopp. Dessuten har flere bukker
  klare setningsskader og noen har fallt over ende.\\n\\nI tillegg til r\u00e5tesoppskadene,
  var det i flere tilfeller klare setningsskader og knusningsskader i fundamentstokker
  som har f\u00f8rt til at bukkene st\u00e5r skeivt (foto 8 og 9).\\n\\nDe mest omfattende
  r\u00e5tesoppskadene opptrer i treverk som er i direkte jordkontakt (foto 4), s\u00e6rlig
  fundamentbein. Videre er det et generelt stort problem med r\u00e5tesoppskader i
  forbindelse med endeved p\u00e5 toppen av fundamentbein, der disse st\u00e5r eksponert
  for nedb\u00f8r (foto 10). Fordi styrken til fundamentbenene er helt avgj\u00f8rende
  for stabiliteten til taubanebukkene, inneb\u00e6rer slike svekkelser en alvorlig
  situasjon for videre levetid til bukkene.\\n\\nEnkelte horisontale materialer, slik
  som de trerammene som holder selve taubanebukken p\u00e5 plass p\u00e5 de oppstikkende
  fundamentbenene og de som stiver av andre deler av taubanebukkene, er stedvis angrepet
  av r\u00e5tesopp (foto 12 og 13).\\n\\nDet er karakteristisk at r\u00e5tesoppskadene
  er lite synlig p\u00e5 overflaten av treverket. Nedbrytningen skjer rett under overflaten
  og der kan det v\u00e6re omfattende skader (foto 14 og 15). Disse skadene kan vanskelig
  oppdages uten inng\u00e5ende, teknisk kontroll.\\n\\n3.4 Vurdering\\n\\n3.4.1 Teknisk
  tilstand - Konsekvens av skader og sikkerhet\\n\\nTaubanebukkene har helt siden
  de ble oppf\u00f8rt \u00e5penbart v\u00e6rt utsatt for slitasje og nedbrytning.
  Dette har f\u00f8rt til at det har v\u00e6rt et kontinuerlig utskiftings- og reparasjonsarbeid,
  s\u00e6rlig mens bukkene var i drift. Dessverre er det meget lite tilgjengelig informasjon
  om hvor og n\u00e5r de ulike tiltakene har v\u00e6rt utf\u00f8rt. V\u00e5re muligheter
  til \u00e5 foreta en vurdering av skadeutvikling med tanke p\u00e5 hastighet og
  omfang reduseres dermed vesentlig. Vi har imidlertid gjort ulike observasjoner av
  forholdene som betyr at vi kan gj\u00f8re et anslag p\u00e5 nedbrytningshastighet
  og videre forventet levetid.\\n\\nFlere taubanebukkene har fallt overende, og det
  er tydelig at dette i stor grad skyldes r\u00e5tesoppskader i de trematerialene
  som st\u00e5r i jordkontakt. Vi har p\u00e5vist et variert omfang og alvorlighetsgrad
  av r\u00e5tesoppskader ogs\u00e5 i de st\u00e5ende taubanebukkene. Dette viser at
  det er en klar fare for at det over tid kan oppst\u00e5 s\u00e5 kraftige r\u00e5tesoppskader
  ogs\u00e5 i andre bukker at det kan opptre ytterligere kollapsen. To av bukkene
  i Bane 2B falt overende i forbindelse med sn\u00f8skred, mens en bukk i Bane 1B
  falt ved kraftig vindbelastning. Vi antar at det dessuten kan forekomme at enkelte
  bukker har fallt p\u00e5 grunn av en kombinasjon av generell svekkelse og tyngdekraften.
  Fordi vi ikke har hatt tilgang til noe dokumentasjon om n\u00e5r og hvorfor taubanebukkene
  har kollapset, er det vanskelig \u00e5 vite hva som egentlig har skjedd. Dette inneb\u00e6rer
  at vi har basert v\u00e5re vurderinger utfra v\u00e5r generelle kunnskap om r\u00e5tesoppskader
  p\u00e5 Svalbard og fastlandet og observert skader i taubanebukkene p\u00e5 Svalbard.\\n\\nVi
  har blant annet funnet ut f\u00f8lgende:\\n\\n- Bukken i Bane 1B som r\u00f8k overende
  med vinden i 2004 ble i f\u00f8lge Bergmesteren satt opp i 1938/-39 og var s\u00e5ledes
  sneae 70 \u00e5r da den falt. Bukkene fra Bane 5/6 n\u00e6rmer seg samme alder.
  Vi ser de samme skadene i bukkene i Bane 2B og Bane 5/6 som vi ser i Bane 1B. Det
  er naturlig \u00e5 tenke at utsatte bukkere i Bane 5/6 ogs\u00e5 kan kollapse n\u00e5r
  de runder +/- 70 \u00e5r. Vi har for \u00f8vrig registrert at det allerede er falt
  en bukk i Bane 5/6 rett etter strammestasjonen \u00f8st for Longyearbyen \u2013
  noe som bekrefter denne problemstillingen.\\n- Vi har sett at r\u00e5tesoppskadene
  som n\u00e5 er registrert gjennom v\u00e5re unders\u00f8kelser i Longyearbyen er
  sv\u00e6rt like skadene i bukkene p\u00e5 Hiorthhamn (b\u00e5de de som fremdeles
  st\u00e5r og de som har falt) samt de to bukkene som falt i sn\u00f8raset i Bane
  2B.\\n\\n\u2022 Vi vet ikke n\u00e5r bukkene p\u00e5 Hiorthhamn falt, men ettersom
  bukkene ble satt opp rundt slutten av 1930-tallet og var falt f\u00f8r vi var der
  i 2009 var ogs\u00e5 disse rundt +/- 70 \u00e5r da de falt. De falne bukkene p\u00e5
  Hiorthhamn st\u00e5r ikke slik til at de kan ha blitt tatt av sn\u00f8skred. Derfor
  har disse sannsynligvis g\u00e5tt overende grunnet svekkelsen fra r\u00e5teskadene
  kombinert med vind eller rett og slett tyngdekraften. Bane 2B ble satt opp i 1936/-37
  og da de to bukkene i Bane 2B falt i sn\u00f8raset i 2009 var de med andre ord +/-
  70 \u00e5r da de gikk over ende. Bane 6 ble satt opp i 1968/-69. V\u00e5re unders\u00f8kelser
  viser at ogs\u00e5 disse bukkene har kraftige r\u00e5teskader i fundamentstokkene.
  Med hensyn til at dette er de nyeste bukkene i Longyearbyen (foruten de nyoppsatte
  bukkene i Bane 3 som er satt opp med impregnerte materialer), har disse bukkene
  faktisk mer omfattende skader enn forventet sammenlignet med de \u00f8vrige bukkene.
  Imidlertid er bukkene i Bane 6 lave og st\u00e5r p\u00e5 flatt underlag. Dette gj\u00f8r
  dem stivere enn mange av de \u00f8vrige bukkene og ikke like utsatt for hverken
  vind eller stein- eller sn\u00f8ras.\\n\\n\u2022 Bukkene i bane 2B er rundt 70 \u00e5r,
  men noen av dem er reparert s\u00e5pass kraftig at dette naturlig burde forlenge
  deres levetid. Det er dessuten benyttet trykkimpregnerte materialer i enkelte reparasjoner,
  noe som sikrer godt mot nye r\u00e5tesoppskader. Samtidig viser v\u00e5re unders\u00f8kelser
  at flere av dem er kraftig svekket i fundamentstokkene av samme type svekkelse som
  de som falt i 2009. En av disse bukkene st\u00e5r i n\u00e6rheten av skolen selv
  om den ikke truer skolen direkte, en av dem st\u00e5r helt inntil skitrekket og
  alle st\u00e5r langs en vanlig brukt tras\u00e9 opp til daganlegget av gruven.\\n\\n\u2022
  Bane 3 ble satt opp i 1936/-37. Med unntak av et par bukker er imidlertid de opprinnelige
  bukkene i Bane 3 byttet ut med nye konstruksjoner der de mest utsatte delene er
  satt opp med impregnerte materialer. Det er derfor kun to bukker der vi finner det
  samme skadem\u00f8nsteret som de \u00f8vrige bukkene i Longyearbyen og p\u00e5 Hiorthhamn.
  Dette er bukkene 12 og 13. Disse bukkene er kraftig svekket, men st\u00e5r ikke
  utsatt til med hensyn til konsekvenser for mennesker eller eiendom. Imidlertid er
  de viktige som del av helheten i Bane 3, og st\u00e5r slik til at de er sv\u00e6rt
  synlige fra innseilingen til Longyearbyen.\\n\\n\u2022 Bukkene i Bane 5/6 ble satt
  opp i 1958/-59 og n\u00e6rmer seg med andre ord 70 \u00e5r. Ogs\u00e5 disse bukkene
  har kraftige r\u00e5teskader i fundamentstokkene av samme m\u00f8nster som de falne
  bukkene p\u00e5 Hiorthhamn og i Longyearbyen. De 5 \u2013 6 f\u00f8rste bukkene
  i Bane 5/6 st\u00e5r inne i bebyggelsen i Longyearbyen og er dessuten sv\u00e6rt
  h\u00f8ye. Alle disse bukkene er svekket av r\u00e5te i fundamentstokkene p\u00e5
  samme m\u00e5te som de som har falt, noen kraftigere enn de andre. Disse bukkene
  st\u00e5r utsatt til med tanke p\u00e5 konsekvenser for mennesker og eiendom (foto
  16-19). Vi kan ikke si noe om hvor lenge disse bukkene vil st\u00e5 med de skadene
  og svekkelsene de har n\u00e5, men de er i en alvorlig svekket tilstand. Noen stormer
  kan knekke dem, enten ved at de rett og slett bl\u00e5ser overende eller ved at
  de forskyves gjennom delvis kollaps. N\u00e5r tyngdepunktet i en s\u00e5 h\u00f8y
  konstruksjon forskyves til over midten kan den falle overende.\\n\\nMange bukker
  st\u00e5r utilgjengelig og langt fra bebyggelse. Der vil konsekvenser av en taubanebukk
  som faller overende v\u00e6re liten med tanke p\u00e5 sikkerhet \u2013 selv om det
  er negativt med tanke p\u00e5 kulturminnevern. I de tilfeller taubanebukkene st\u00e5r
  tett opp mot der personer ferdes, \u00f8ker risikoen for at det kan opptre kritiske
  situasjoner med hensyn til sikkerhet.\\n\\nVi har vist at flere av de h\u00f8ye
  bukkene som st\u00e5r inne i Longyearbyen \u2013 noen av dem tett opp mot veier
  og bebyggelse, har kraftige r\u00e5tesoppskader i treverk i viktige, b\u00e6rende
  konstruksjoner. Med tanke p\u00e5 omfanget av r\u00e5tesoppskadene, anser vi det
  som trolig at enkelte taubanebukker i\\n\\nLongyearbyen kan falle overende i l\u00f8pet
  av 5-10 \u00e5r. Dette betyr at vi anbefaler et aktivt videre arbeid med \u00e5
  sikre taubanebukkene \u2013 s\u00e6rlig de som st\u00e5r sentralt i Longyearbyen.
  Aktuelle punkter er vist i avsnittet 3.5 Konklusjon og forslag til tiltak.\\n\\n**Foto
  16** Konsekvensene for en kollaps av en bukk som st\u00e5r ved en trafikkert vei
  kan v\u00e6re store. Foto: J. Mattsson, Mycoteam\\n\\n**Foto 17** Ekstra strenge
  sikkerhetskrav m\u00e5 gjelde for r\u00e5tesoppskadede taubanebukker inne i Longyearbyen.
  Foto: J. Mattsson, Mycoteam\\n\\n**Foto 18** Flere av bukkene inne i Longyearbyen
  er meget h\u00f8ye og st\u00e5r tett opp mot bebyggelse. Foto: J. Mattsson, Mycoteam\\n\\n**Foto
  19** Det er viktig at man har god kontroll p\u00e5 taubanebukker inne i Longyearbyen.
  Foto: J. Mattsson, Mycoteam\\n\\nBasert p\u00e5 resultatene fra unders\u00f8kelsene
  i en kombinasjon med vurdering av sikkerhetsmessige forhold, ser vi at det er n\u00f8dvendig
  \u00e5 fokusere p\u00e5 f\u00f8lgende bukker:\\n\\n1. Bane 5/6, bukk 3 ved sykehuset
  og bukk 1 ved Skj\u00e6ringa: aktive tiltak.\\n2. Bane 5/6, bukkene 2, 4 og 5: oppf\u00f8lging\\n3.
  Bane 2b, bukk 8 ved skitrekket: aktive tiltak\\n\\nMed aktive tiltak mener vi at
  disse bukkene b\u00f8r sikres raskt og repareres ved at man skifter ut fundamentstokkene
  som stikker opp i friluft og som danner grunnlaget for stabiliteten av selve bukkene.
  Vi mener at alternativet til slik reparasjon er kollaps innen 5 \u2013 10 \u00e5r,
  og at sterk vind eller ras kan felle bukkene tidligere. Alternative tiltak til reparasjon
  er etter v\u00e5r mening kontrollert felling\\n\\neller avsperring inntil bukken
  faller av seg selv. Med oppf\u00f8lging mener vi at disse bukkene b\u00f8r f\u00f8lges
  opp med videre vurdering og omr\u00e5det rundt disse eventuelt sperres av.\\n\\nDet
  er forel\u00f8pig ikke foretatt noen statiske beregninger av hvilke konsekvenser
  de p\u00e5viste r\u00e5tesoppskadene kan f\u00f8re til. Dette betyr at v\u00e5re
  anslag for eventuelle konsekvenser av skadene er basert p\u00e5 v\u00e5r erfaring
  av r\u00e5tesoppskader og en antakelse basert p\u00e5 fakta som vi har hatt tilgjengelig
  s\u00e5 langt. For \u00e5 oppn\u00e5 bedre kunnskap om hvor stabile bukkene er,
  anbefaler vi at det gjennomf\u00f8res statiske beregninger.\\n\\nI forbindelse med
  den nye bukken som ble satt opp i 2007 i bane 1B etter at den opprinnelige falt
  overende i en storm i 2006, er det benyttet vintermattter p\u00e5 bakken et lite
  stykke under jordoverflaten. Vi er forkart at dette ble gjort for \u00e5 unng\u00e5
  at t\u00e6len i bakken skulle tine for langt ned og at man dermed skulle kunne unng\u00e5
  en del av oppfuktningen av fundamentbena til taubanebukken. Vi foretok en logging
  av temperatur og relativ luftfuktighet inntil et av bukkebeina p\u00e5 den nye taubanebukken
  og en gammel taubanebukk ved siden av. 2 m\u00e5lesonder ble plassert inn mot treverket
  ca. 10 cm ned i bakken og en kontrollsonde ble plassert i skygge ca. 0,5m opp fra
  bakken. M\u00e5leresultatene viste at det var tiln\u00e6rmet lik relativ luftfuktighet
  ved de to sondene som l\u00e5 under jorda ved de to bukkene, mens det var en st\u00f8rre
  variasjon ved sonden som l\u00e5 i skygge ca. 0,5 meter opp fra bakken (figur 3).
  Samtidig viser m\u00e5lingene at det var en klart h\u00f8yere temperatur i bakken
  p\u00e5 oversiden av vintermattten sammenlignet med den gamle bukken som kun hadde
  vanlig jordsmonn (figur 4). Dette viser at det er klart bedre vekstforhold for r\u00e5tesopp
  i treverket p\u00e5 oversiden av vintermattene ved den nye bukken i forhold til
  treverket i den gamle. V\u00e5r anbefaling er dermed at man sterkt b\u00f8r vurdere
  \u00e5 fjerne vintermattene ved denne bukken og dessuten \u00e5 unng\u00e5 \u00e5
  legge ned tilsvarende vintermatter ved kommende reparasjoner av andre taubanebukker.\\n\\nFigur
  3 M\u00e5ling av relativ luftfuktighet i bakken ved den nye taubanebukken og en
  tilst\u00f8tende gammel i Bane 1B.\\n\\n3.4.2 Forvaltning av kulturminnene \u2013
  Konsekvenser for bevaring\\n\\nRapporten Plan for teknisk industrielle kulturminner
  i Longyearbyen og omegn (2010), utarbeidet av Store Norske og Sysselmannen setter
  blant annet opp en prioritert liste over hvilke kulturminner som skal bevares for
  ettertiden for \u00e5 vise Longyearbyen som gruveby. I denne planen l\u00f8ftes
  Taubane 3 (Taubanesentralen p\u00e5 Skj\u00e6ringa \u2013 Hotellneset) frem som
  den banen som skal bevares. Det sies ikke noe spesielt om hva som skal skje med
  de andre taubanestrekningsene. B\u00e5de Store Norske, Riksantikvaren og Sysselmannen
  har gitt uttrykk for at alle kulturminnene fra gruvedriften i Longyearbyen er viktige,
  og at det i utgangspunktet er \u00f8nskelig \u00e5 bevare alle taubanestrekningsene.
  Dette er imidlertid ikke behandlet i planen for de tekniske kulturminnene i Longyearbyen.\\n\\nDet
  er viktig \u00e5 v\u00e6re klar over at selv om taubanebukkene i Bane 3 er plukket
  ut til \u00e5 v\u00e6re de som skal bevares for ettertiden \u2013 og de som f\u00f8rst
  og fremst skal vedlikeholdes, er det likevel n\u00f8dvendig \u00e5 gj\u00f8re noe
  med flere av de \u00f8vrige bukkene. V\u00e5re vurderinger er f\u00f8rst og fremst
  foretatt p\u00e5 grunnlag av bukkenes tekniske tilstand/skadebilde, forventet levetid
  og konsekvens for omgivelsene. Imidlertid er mange av bukkene s\u00e5 viktig i forst\u00e5elsen
  av den historiske gruvedriften i Longyearbyen at det kan v\u00e6re \u00f8nskelig
  at de i hvert fall skal st\u00e5 lengst mulig selv om de ikke er prioritert i verneplanen.\\n\\nTil
  tross for at verneplanen for de teknisk industrielle kulturminnene i Longyearbyen
  er ferdig mener vi det er n\u00f8dvendig \u00e5 ta en ny diskusjon knyttet b\u00e5de
  til sikkerhetsmessige aspekter og de mer verne- og verdimenssive avgj\u00f8relsene.
  Vi har inntrykk av at akt\u00f8rene (Sysselmannen, Riksantikvaren og Store Norske)
  ikke var klar over den faktiske tilstanden p\u00e5 taubanebukkene da rapporten ble
  skrevet. Vi tror derfor at det er grunnlag for \u00e5 anta at dette er grunnen til
  at planen ikke diskuterer hva konsekvensen vil v\u00e6re for de kulturminnene (taubanebukkene)
  som ikke prioriteres i planen.\\n\\nSelv om verken kulturminnene generelt eller
  taubanebukkene spesielt ikke skulle bli prioritert av rent verne- og verdimesseige
  hensyn, tilsier teknisk tilstand og konsekvenser av eventuelle brudd og nedfall
  at det er n\u00f8dvendig \u00e5 gj\u00f8re noe. Bort-prioriteringen av taubanebukkene
  i verneplanen forankres blant annet i d\u00e5rlig teknisk tilstand, selv om den
  ikke er utformet slik at den viser detaljert teknisk tilstand eller forslag til
  tiltak. Det er ikke foretatt noen analyse av hva en slik bort- eller nedprioritering
  konkret vil bety for taubanebukkene p\u00e5 litt sikt, uklart av hvilken \u00e5rsak.
  I denne sammenhengen er vi likevel f\u00f8rst og fremst opptatt av at det er n\u00f8dvendig
  \u00e5 diskutere og avklare overordnede verne- og verdimesseige hensyn og sikkerhetsmessige
  hensyn ogs\u00e5 for de kulturminnene som er nedprioritert. Med dette mener vi at
  det m\u00e5 avklares om man med denne nedprioriteringen er klar over at man automatisk
  godtar at bukkene (som vi her er opptatt av) vil g\u00e5 over ende etter hvert,
  noen om kort tid noen om lengere tid. I tillegg m\u00e5 man ta stilling til sikkerhetsaspektene.
  Det b\u00f8r ogs\u00e5 diskuteres hvilke tiltak som kan godtas som f\u00f8lge av
  at det dreier seg om automatisk- og vedtaksfredete kulturminner. Dette er f\u00f8rst
  og fremst en vurdering som m\u00e5 tas av vernemyndighetene, men det vil v\u00e6re
  av avgj\u00f8rende betydning for eier Store Norske \u00e5 vite hvilke retningslinjer
  man kan operere innenfor. Vi mener det er viktig \u00e5 diskutere f\u00f8lgende
  (listen er ikke utt\u00f8mmende):\\n\\n- Hvilke bukker kan man akseptere skal falle,
  og er det noen man ikke \u00f8nsker skal falle?\\n- Hvordan h\u00e5ndteres sikringssonen
  rent verneteknisk n\u00e5r bukkene faller, og flere av dem kanskje er falt ut av
  vernesonen? Hva n\u00e5r alle har falt?\\n- Teknisk tilstand er p\u00e5 noen bukker
  s\u00e5 d\u00e5rlig at dersom de ikke skal repareres b\u00f8r man vurdere om de
  skal tas ned f\u00f8r de faller \u00abav seg selv\u00bb. Hvordan stiller vernemyndighetene
  seg til det? \u2013 M\u00e5 den aktuelle bukken av-fredes f\u00f8rst?\\n\\n- Aktuelle
  reparasjonstiltak kan v\u00e6re \u00e5 skifte deler av konstruksjonen med impregnerte
  materialer. Dette har v\u00e6rt gjort en rekke ganger tidligere, b\u00e5de i bane
  2B og 3. Det kan ogs\u00e5 v\u00e6re en mulighet \u00e5 ta ned og bygge kopi av
  enkelte s\u00e6rlige sentrale bukker. Dette er vurderinger som allerede er l\u00f8selig
  behandlet i saken om den nyoppsatte bukken i Bane 2B ovenfor Taubanesentralen.\\n\\n-
  Noen av bukkene er vesentlig svekket av r\u00e5tesoppskader i fundamentene. De er
  dessuten s\u00e6rlig h\u00f8ye og har en slik plassering at en eventuell kollaps
  utgj\u00f8r en s\u00e6rlig sikkerhetsrisiko for omgivelsene. Dette gjelder f\u00f8rst
  og fremst bukkene inne i sentrum. V\u00e5r vurdering av skadene er at disse bukkene
  b\u00f8r sikres i l\u00f8pet av kort tid, spesielt med tanke p\u00e5 sterk vind.
  En reparasjon av fundamentene slik at konstruksjonene blir stabile anbefales. Det
  er allerede gjort erfaringer med en slik reparasjon av den nye bukken i bane 2b.
  Det er imidlertid etter v\u00e5r kjennskap forel\u00f8pig ikke foretatt en tverrfaglig
  evaluering av hvordan dette arbeidet har fungert, heller ikke hvilken effekt de
  valgte tekniske l\u00f8sningene har (slik som bruk av vintermatte p\u00e5 grunnen,
  bruk av uimpregnert materiale, tilbakelegging av eksisterende masser med mulige
  r\u00e5tesoppsporer).\\n\\n### 3.5 Konklusjoner og forslag til tiltak\\n\\nUnders\u00f8kelsene
  viste at det var stor variasjon i omfang av r\u00e5tesoppskader i de unders\u00f8kte
  bukkene, fra tiln\u00e6rmet friske materialer til meget omfattende r\u00e5teskader
  med alvorlig nedbrytning. Skadene opptrer tilsynelatende tilfeldig, og det er umulig
  \u00e5 avklare tilstedev\u00e6relsen av eventuelle skader uten en inng\u00e5ende
  unders\u00f8kelse. Det er etter v\u00e5r mening derfor avgj\u00f8rende \u00e5 unders\u00f8ke
  bukkene med r\u00e5tedrill i de kritiske omr\u00e5dene der treverk er i jordkontakt
  for at man skal kunne si noe om taubanebukkenes reelle tekniske tilstand.\\n\\nDet
  er p\u00e5vist en rekke skader i mange av de unders\u00f8kte bukkene. Med tanke
  p\u00e5 at vi ikke har en endelig oversikt over samtlige skader ettersom vi ikke
  hadde mulighet til \u00e5 unders\u00f8ke alle de ca. 200 bukkene, har vi valgt \u00e5
  fokusere p\u00e5 de bukkene som ved en eventuell kollaps vil kunne gi store konsekvenser
  med tanke p\u00e5 sikkerhet for beboere og bes\u00f8kende i Longyearbyen.\\n\\nFlere
  av bukkene i bane 5 som st\u00e5r inne i Longyearbyen har alvorlige r\u00e5tesoppskader.
  Vi har forel\u00f8pig ikke kjennskap til hvor stor effekt disse r\u00e5tesoppskadene
  har med tanke p\u00e5 stabiliteten i bukkene, men p\u00e5 grunn av den alvorlige
  konsekvensen en eventuell kollaps i strukturen kan medf\u00f8re, anbefaler vi en
  prioritering av de bukker som har st\u00f8rst potensiell fare med hensyn til sikkerhet.
  Dette betyr at det kan v\u00e6re andre bukker som er mer skadede, men fordi disse
  st\u00e5r mindre kritisk til med tanke p\u00e5 sikkerhet, kan de etter rent tekniske
  vurderinger gis lavere prioritet.\\n\\n#### 3.5.1 Strakstiltak (< 1 \u00e5r)\\n\\n-
  **Konsekvensvurdering.** Noe av dette er allerede fors\u00f8kt belyst i denne rapporten,
  men vi anbefaler at det gj\u00f8res en mer utfyllende vurdering.\\n- **Overv\u00e5kningsplan**
  for de st\u00e5ende bukkene, statiske beregninger og eventuell reparasjon av bukker
  anbefales.\\n- Enkle, stabiliserende tiltak av eksisterende tekniske l\u00f8sninger
  kan med fordel gjennomf\u00f8res som strakstiltak p\u00e5 alle bukkene, og i hvert
  fall bukker inne i byen:\\n  - Stramme l\u00f8se st\u00e5lwire\\n  - Feste l\u00f8se
  materialer\\n\\n\u2022 Gjennomf\u00f8re eventuelt enkle reparasjoner som vurderes
  \u00e5 ha en positiv innvirkning p\u00e5 stabiliteten til taubanebukkene.\\n\\n\u2022
  M\u00e5ling av svaiaing av bukkene i kraftig vind og setninger over tid\\n  o A)
  Sidebevegelse \u2013 for eksempel med en st\u00e5lwire med m\u00e5leb\u00e5nd og
  fire fastpunkter\\n  o B) Vertikalbevegelse: tommostokk\\n  o C) Oppl\u00e6ring/organisering
  av m\u00e5learbeidet\\n\\n\u2022 En tverrfaglig planlegging av utskifting av skadede
  fundamentstokker. Det er viktig at man her tar en vurdering av b\u00e5de praktiske,
  sikkerhetsmessige og vernemessige aspekter. Samtidig m\u00e5 man s\u00f8rgje for
  at man har en faglig vurdering av hvordan ulike tiltak innvirker p\u00e5 fremtidig
  levetid av bukkene og hvordan man skal foreta oppf\u00f8lgende kontroll av de reparerte
  bukkene.\\n\\n188.8.131.52 Langsiktige tiltak (> 1 \u00e5r)\\n\\n\u2022 Utarbeide
  en manual for reparasjon av taubanebukkene i Longyearbyen basert p\u00e5 erfaringene
  med den f\u00f8rste bukken som repareres.\\n\\n\u2022 Gjennomf\u00f8re en reparasjons-
  og vedlikeholdsplan for taubanebukkene i Longyearbyen, der det inng\u00e5r arbeid
  med \u00e5 forsterke og skifte ut moderat skadede materialer, foreta st\u00f8rre
  reparasjoner og eventuelt etablere nye avstivningstiltak.\\n\\n\u2022 Overv\u00e5king
  (omg\u00e5ende, se Strakstiltak, og fortl\u00f8pende)\\n\\nFoto 21 Taubanelinjen
  fra Gruve 5, utsyn innover Adventdalen med bukker og strammestasjon. Foto: AC Flyen\\n\\n4
  Taubanen i Hiorthhamn\\n\\nNest etter Ny-\u00c5lesund utgj\u00f8r kulturmilj\u00f8et
  i Hiorthhamn den st\u00f8rste ansamlingen av fredete bygninger og konstruksjoner
  p\u00e5 Svalbard. Den gamle gruvebyen i Hiorthhamn er resultatet av ett av de mange
  fors\u00f8kene p\u00e5 \u00e5 etablere bergverksdrift p\u00e5 Svalbard, og taubanebukkene
  samt taubanestasjonen er en sentral del av dette milj\u00f8et. Med unntak av selve
  gruve\u00e5pningen langt opp i fjellskr\u00e5ningen er bukkene og stasjonen de konstruksjonene
  som tydeligst viser at Hiorthhamn har v\u00e6rt en gruveby. I dag st\u00e5r bare
  syv bukker oppreist, og deres tekniske tilstand er uklar. P\u00e5 grunn av eierforholdene
  (gruvebyen er privat eid) er det vanskelig \u00e5 finansiere en slik unders\u00f8kelse
  privat og et tilskudd fra Svalbards milj\u00f8vernfond var avgj\u00f8rende for at
  unders\u00f8kelsen kunne gjennomf\u00f8res.\\n\\nNIKU og Mycoteam mottok etter s\u00f8knad
  slikt tilskudd i 2010 som gjorde det mulig \u00e5 unders\u00f8ke taubanebukkene
  i Hiorthhamn og kartlegge deres tekniske tilstand.\\n\\nFoto 22 Taubanen i Hiorthhamn.
  Foto: AC Flyen, NIKU\\n\\nTrefundamentene til taubanebukkene i Hiorthhamn og taubanestasjonen
  st\u00e5r meget utsatt til for angrep av r\u00e5tesopp. Dette har allerede vist
  seg ved at to av bukkene er falt over ende med omfattende r\u00e5tesoppskader i
  del delene av treverket som har st\u00e5tt i bakkekontakt. Svekkelsen fra r\u00e5tesoppen
  er s\u00e5 alvorlig at det bare skulle en liten dyt til, for eksempel fra vinden,
  for at bukken skulle g\u00e5 overende.\\n\\nFor \u00e5 klarelegge den tekniske tilstanden
  p\u00e5 materialer og konstruksjoner gjennomf\u00f8rte vi grundige unders\u00f8kelser.
  Disse unders\u00f8kelsene dannet igjen grunnlag for \u00e5 kunne ansl\u00e5 restlevetid
  og gi et forslag til eventuelle sikrings- og/eller istandsettingstiltak.\\n\\n4.1
  Metoder og gjennomf\u00f8ring\\n\\n4.1.1 Unders\u00f8kelser\\nUnders\u00f8kelsene
  ble gjennomf\u00f8rt i l\u00f8pet av juli/august 2010 av Mycoteam, v/ Johan Mattsson
  og NIKU, v/ Anne-Cathrine Flyen. Prosjektarbeidet ble finansiert via \u00f8konomisk
  st\u00f8tte fra Svalbards milj\u00f8vernfond, NIKU og Mycoteam.\\n\\nP\u00e5 grunn
  av den \u00e5penbare sannsynligheten for at det kan forekomme kritiske r\u00e5tesoppskader
  i taubanebukkene vurderte vi at det i utgangspunktet burde foretas unders\u00f8kelser
  av samtlige taubanebukker, det vil si av samtlige stolper som st\u00e5r i jordkontakt.
  Vi la opp til at dette omfanget eventuelt kunne justeres underveis dersom videre
  funn viser et m\u00f8nster som inneb\u00e6rer en mulighet for generalisering, men
  i utgangspunktet antok vi at dette var lite trolig. Unders\u00f8kelsene inneholdt
  f\u00f8lgende oppgaver:\\n\\n- Planlegging inkludert innhenting av n\u00f8dvendige
  tillatelser fra Riksantikvaren/Sysselmannen\\n- Visuell kontroll av horisontale
  materialer og av materialer i bakkekontakt\\n- Materialpr\u00f8ver av skadet trevirke
  (krever dispensasjon fra Riksantikvaren/Sysselmannen)\\n- R\u00e5tedrilling i alle
  materialer som st\u00e5r i bakkekontakt (krever dispensasjon fra Riksantikvaren/Sysselmannen)\\n-
  R\u00e5tedrilling som stikkpr\u00f8ver av enkelte horisontale materialer (krever
  dispensasjon fra Riksantikvaren/Sysselmannen)\\n- Fukt- og temperaturm\u00e5linger\\n-
  Fotodokumentasjon av skadete omr\u00e5der\\n\\n4.1.2 S\u00f8knader om tillatelsers\\n\\nF\u00f8r
  oppstart av feltarbeidet ble det s\u00f8kt om tillatelse til pr\u00f8vetaking og
  r\u00e5tedrilling fra Sysselmannen/Riksantikvaren. Videre hadde vi kontakt med grunneier
  for eiendommen Austre Adventfjord gjennom deres advokat, Eeg Nielsen i advokatfirmaet
  Harris DA med tanke p\u00e5 tillatelse til unders\u00f8kelser og pr\u00f8vetaking
  p\u00e5 deres eiendom.\\n\\nS\u00f8knaden til Sysselmannen, som ble innvilget, omfattet
  blant annet: Unders\u00f8kelser i taubanebukkene, strammestasjonen, taubanestasjonen,
  direkt\u00f8rboligen, funksjon\u00e6rboligen, gamlemessa og boligbrakka i Hiorthhamn
  samt bygninger og bygningsrester oppe i fjellet ved gruveinngangen, kalt Sneheim.\\n\\nGrunnen
  til s\u00f8knaden var at alle disse trekonstruksjonene er fredet i medhold av Svalbardmilj\u00f8lovens
  \u00a7 39 a. Unders\u00f8kelsene omfattet f\u00f8lgende:\\n\\n- R\u00e5tedrilling
  i taubanebukkene, strammestasjon, direkt\u00f8rboligen, funksjon\u00e6rboligen,
  gamlemessa, boligbrakken.\\n- R\u00e5tedrilling og trepr\u00f8ver i taubanestasjonen\\n-
  Trepr\u00f8ver i bygningene p\u00e5 Sneheim.\\n\\n4.2 Resultater\\n\\nDet ble foretatt
  r\u00e5tedrilling i samtlige st\u00e5ende taubanebukker og i et utvalg av de som
  har falt. Tilsvarende unders\u00f8kelse ble ogs\u00e5 foretatt i representative
  deler av de st\u00e5ende p\u00e6lefundamentene i taubanestasjonen. Alle m\u00e5lingene
  ble tatt i overgang luft/terreng. P\u00e5 den m\u00e5ten ble forekomst og omfang
  av innvendige r\u00e5tesoppskader i trematerialene kartlagt. Basert p\u00e5 visuelle
  observasjoner og resultatene, er det mulig \u00e5 gi en oversikt over mulige tiltak.\\n\\nI
  bukkene p\u00e5 Hiorthhamn var det ytterst f\u00e5 alvorlige skader som var synlige
  i overflaten av stokkene og i \u00f8vrige materialer. Det var med andre ord f\u00e5
  funn gjennom de visuelle unders\u00f8kelsene. Ved hjelp av r\u00e5tedrill-unders\u00f8kelsene
  og vurdering av bruddflaten i de stokkene som var falt overende, var det mulig \u00e5
  danne seg et bilde av skadeproblematikken og bukkenes tilstand.\\n\\nFoto 25 Bukkene
  har mye treverk som st\u00e5r i jordkontakt. Samtlige av disse materialene kan v\u00e6re
  svekket av r\u00e5tesopp og m\u00e5 av den grunn unders\u00f8kes grundig. Foto:
  J. Mattsson, Mycoteam\\n\\nFoto 26 I mange tilfeller var det ikke noen synlige tegn
  til r\u00e5tesoppskader i overflaten av treverket. Misfargingen skyldes opptrekk
  av kullpartikler og ikke svertesopp/r\u00e5tesopp. Foto: J. Mattsson, Mycoteam\\n\\nFoto
  27 Ofte var det enkelte, svake tegn til en overflatisk nedbrytning av stokkene der
  de st\u00e5r i jordkontakt. Disse skadene var stort sett begrensete og for\u00e5rsaket
  av gr\u00e5r\u00e5tesopper. Foto: J. Mattsson, Mycoteam\\n\\nFoto 28 Resultatene
  ved bruk av kniv kan v\u00e6re vanskelig \u00e5 tolke p\u00e5 Svalbard. Dette skyldes
  blant annet at det indre av stokken kan v\u00e6re frosset ettersom permafrosten
  gj\u00f8r at bakken fryser nedenfra. Foto: AC Flyen, NIKU\\n\\n4.3 Vurdering\\n\\nTidsaspektet
  er viktig for nedbrytning av treverk. Det skjer liten skade i l\u00f8pet av uker
  og til dels m\u00e5neder, men over lengre perioder kan det skje en vesentlig svekkelse
  av treverket. De aktuelle taubanebukkene ble oppf\u00f8rt i to omganger, den f\u00f8rste
  i 1910, den andre ved oppstarten i 1937. Dette betyr at trematerialene har st\u00e5tt
  eksponert i 70-100 \u00e5r.\\n\\nR\u00e5tedrillunders\u00f8kelsene viste et sv\u00e6rt
  varierende skadebilde i de forskjellige taubanebukkene. En oppsummering av skadene
  (skadegrads, SG) og vurdering av konsekvenser (konsekvensgrad, KG) er vist i tabell
  1 for taubanebukkene og i tabell 2 for strammestasjonen.\\n\\nTabell 1 Oppsummering
  av p\u00e5viste r\u00e5tesoppskader i taubanebukkene. Bukk nummer 1 er n\u00e6rmest
  gruve\u00e5pningen oppe ved Sneheim. Skadegrads er fordelt p\u00e5 bena, NV= Nordvestre
  ben, N\u00d8=Nord\u00f8stre ben, SV=Sydvestre ben, S\u00d8= Syd\u00f8stre ben. Skadegrads
  1= ingen skade, Skadegrads 2= moderat skade, Skadegrads 3= Kraftig skade. Konsekvensgrad
  1= Liten konsekvens, Konsekvensgrad 2= Middels alvorlig konsekvens, Konsekvensgrad
  3= Alvorlig konsekvens.\\n\\n| Bukk | Skadegrads | Konsekvensgrad | Kommentar |\\n|------|------------|----------------|-----------|\\n|      |
