  i Noreg | 8 163| 7 759| 6 930| 5 201| 5 944|\\n| Talet p\u00e5 patent i kraft (norske
  patent og europeiske patent som er validerte i Noreg) | 42 137| 46 398| 48 402|
  51 086| 53 323|\\n\\nBehandlingstid for patents\u00f8knader\\n\\nFor s\u00f8kjarar
  som leverer ein f\u00f8rstes\u00f8knad (dvs. at han ikkje er levert inn i eit anna
  land), er det viktig \u00e5 f\u00e5 ei rask vurdering av om oppfinninga er patentbar,
  slik at ein f\u00e5r ein indikasjon p\u00e5 om ein b\u00f8r levere tilsvarende s\u00f8knader
  i andre land innanfor dei tidsfristane som gjeld. Patentstyret gjev normalt f\u00f8rste
  vurdering i l\u00f8pet av 7 m\u00e5nader, men ein del s\u00f8kjarar treng raskare
  avklaring. Av den grunn blei det mogleg \u00e5 f\u00e5 akselerert behandling i l\u00f8pet
  av fire m\u00e5nader. I 2023 \u00f8nskte 22 prosent av s\u00f8kjarane dette (14
  prosent i 2022).\\n\\nDei resterande s\u00f8knadene er internasjonale patents\u00f8knader
  (PCT) som blir f\u00f8rt vidare i Noreg, og s\u00f8knader som tidlegare har vore
  levert i andre land. Desse er allereie granska, og s\u00f8kjaren har derfor ikkje
  same behov for ei rask behandling i Patentstyret. Tida fram til endeleg avgjerd
  blir redusert \u00e5r for \u00e5r ogs\u00e5 for desse s\u00f8knadene.\\n\\nTalet
  p\u00e5 ferdigbehandla s\u00f8knader per \u00e5rsverk brukt p\u00e5 saksbehandling\\n\\nPatentstyret
  avgjorde gjennomsnittleg 35 patents\u00f8knader per \u00e5rsverk saksbehandling
  i 2023. Dette talet omfattar kunngjorde patent, avslag, vekklagde, endeleg vekklagde
  og trekte s\u00f8knader. Talet er omtrent p\u00e5 niv\u00e5 med dei andre nordiske
  landa.\\n\\nTabell 10: Talet p\u00e5 ferdigbehandla patents\u00f8knader per \u00e5rsverk
  brukt p\u00e5 saksbehandling\\n\\n|       | 2019 | 2020 | 2021 | 2022 | 2023 |\\n|-------|------|------|------|------|------|\\n|
  Patent| 53   | 51   | 42   | 32   | 35   |\\n\\nPatentvern i Noreg kan ein f\u00e5
  p\u00e5 to m\u00e5tar:\\n\\n\u2013 Gjennom patents\u00f8knad til Patentstyret, anten
  direkte (nasjonale s\u00f8knader) eller via PCT-s\u00f8knadsordninga (internasjonale
  s\u00f8knader). Fleirtalet av norske s\u00f8kjarar leverer patents\u00f8knadene
  sine direkte til Patentstyret, medan utanlandske s\u00f8kjarar oftast brukar PCT.\\n\\n\u2013
  Gjennom patents\u00f8knad til Det europeiske patentverket (EPO). Det europeiske
  patentet kan seinare bli gjort gyldig i Noreg (validert). Det er hovudsakleg utanlandske
  s\u00f8kjarar som nyttar denne ordninga.\\n\\nDei samla patentrettane i Noreg utgjer
  ein kombinasjon av desse. Eit patent blir halde ved lag s\u00e5 lenge det blir betalt
  \u00e5rlig avgift, men maksimalt 20 \u00e5r fr\u00e5 s\u00f8knaden blei levert inn.
  Gjennomsnittleg levetid for norske patent er om lag 15 \u00e5r.\\n\\nTalet p\u00e5
  avgjorde s\u00f8knader per \u00e5r har no stabilisert seg \u2013 overgangseffektane
  etter tilslutninga til European Patent Convention er forbi. Talet p\u00e5 s\u00f8knader
  til behandling er no avhengig av talet p\u00e5 \u00e5r til kunngjering. Det er under
  to \u00e5r for nye f\u00f8rstes\u00f8knader, men meir for vidaref\u00f8ringar. For
  begge gruppene samla er det om lag 3,8 \u00e5r.\\n\\nTalet p\u00e5 patents\u00f8knader
  fr\u00e5 norske s\u00f8kjavar ut i verda ligg p\u00e5 om lag 3500. Etter ein nedgang
  dei siste \u00e5ra var det ein auke i 2022. Dei viktigaste marknadene er USA, EU,
  Storbritannia, Kina, Canada, Australia og Japan. Tala for 2023 blir publiserte av
  WIPO i oktober/november 2024.\\n\\nAnue har utvikla eit hjelpemiddel for \u00e5
  ta vare p\u00e5 donormj\u00f8lk. Dei satsar globalt og s\u00f8rger for \u00e5 sikre
  rettar i dei marknadene dei g\u00e5r inn i.\\n\\nAnue er ei helseteknologibedrift
  fr\u00e5 Bod\u00f8 som blei etablert av barnesjukepleiar Jeanette Gr\u00f8nnslett
  i 2018. Selskapet har utvikla, patentert og lansert eit lukka system for oppsamling,
  lagring, testing og distribusjon av donormj\u00f8lk. Dette er ein teknologi som
  kan nyttast innanfor fleire ulike bransjar, og som har eit globalt marknadspotensial.
  Dei tilbyr i dag Anue Concept Kit til sjukehuskundane sine.\\n\\nRettar gjev konkurransefordelar\\n\\n\u2013
  Det har vore viktig for oss \u00e5 verne teknologien v\u00e5r for \u00e5 sikre oss
  konkurransefortrinn i marknaden og vareta dei immaterielle rettane til selskapet,
  seier administrerande direkt\u00f8r i selskapet, Jeanett Gr\u00f8nnslett. \u2013
  Teknologien er overf\u00f8rt til andre bransjar, og patenta v\u00e5re kan gje inntekter
  gjennom lisensavtalar med interessentar. Dei har i dag patent i UK, og f\u00e5r
  det truleg i EU i l\u00f8pet av hausten. Vidare har dei s\u00f8kt Canada, USA, S\u00f8r-Afrika,
  Brasil, Japan, Dei sameinte arabiske emirata, Kina, India, Australia og Israel.\\n\\nDei
  har 6 designvern i Noreg og EU. Namn og logo er verna som varemerke i fleire kategoriar
  i Noreg og er s\u00f8kt registrert i EU, Israel og USA.\\n\\n\u2013 Rettar som patent
  og varemerke er viktig for Anue. Det gjev oss ein sterk posisjon i marknaden og
  h\u00f8ve til \u00e5 styrkje og byggje merkevara v\u00e5r.\\n\\nJeanette Gr\u00f8nnslett,
  barnesjukepleiar og administrerande direkt\u00f8r i Anue\\n\\nEkstern hjelp er viktig\\n\\nAnue
  har nytta ekstern fagkompetanse til s\u00f8knadsprosessen, og Gr\u00f8nnslett seier
  dei har f\u00e5tt veldig god hjelp fr\u00e5 Dehns og Bryn Aarflot. Ho er ogs\u00e5
  godt nodd med mykje god r\u00e5dgjeving fr\u00e5 Innovasjon Noreg og Patentstyret,
  heilt fr\u00e5 idefasen.\\n\\nR\u00e5d til andre verksemder\\n\\n\u2013 Sjekk ut
  kva som finst av eksisterande l\u00f8ysingar f\u00f8r du begynner p\u00e5 ein eventuell
  patentprosess. Dette kan Patentstyret hjelpe med, seier Gr\u00f8nnslett.\\n\\n\u2013
  Ha gode konfidensialitetsavtalar n\u00e5r du samarbeider med andre, og ikkje del
  sensitiv informasjon offentleg f\u00f8r ein patents\u00f8knad er levert inn!\\n\\nAnue
  har ein medviten IP-strategi. Dei har valt \u00e5 g\u00e5 ganske breitt ut med sj\u00f8lv
  patentet, og dei vel seg ut nye marknader for varemerke etter kvart som dei skal
  inn i nye land.\\n\\nDei har s\u00e5 langt ikkje opplevd kopiering eller at nokon
  har krenkt rettane deira.\\n\\nLes meir om Anue p\u00e5 nettsidene deira \u2192\\n\\nKvalitet
  i s\u00f8knadsbehandlinga\\n\\nPatentstyret har eit system for kvalitetsstyring
  som bidreg til \u00e5 sikre rett kvalitet i s\u00f8knadsbehandlinga. Rett kvalitet
  vil seie at resultatet vi leverer til kundane v\u00e5re, er korrekt og levert til
  avtalt tid, slik at vi er f\u00f8resielege overfor kundane. Patentstyret er sertifisert
  etter den internasjonalt anerkjende standarden ISO 9001:2015.\\n\\nDei overordna
  kvalitetsm\u00e5la til Patentstyret er \u00e5 oppfylle krav til rett kvalitet i
  96 prosent av sakene. Det blei gjennomf\u00f8rt kontroll av datakvalitet p\u00e5
  varemerke. Kontrollen g\u00e5r ut p\u00e5 \u00e5 s\u00f8kje etter inkonsistente
  data i saksbehandlingssystemet, til d\u00f8mes s\u00f8knader som er under behandling,
  men st\u00e5r utan saksbehandler, s\u00f8knader som ikkje har aktive oppg\u00e5ver,
  osv. Patentstyret fann ingen systematiske feil som trong vidare oppf\u00f8lging.
  Det blei ikkje gjort ein kvalitetskontroll av faglege vurderingar p\u00e5 varemerke,
  slik Patentstyret normalt gjer i l\u00f8pet av eit \u00e5r. Dette kjem av at avdelinga
  har brukt tid p\u00e5 \u00e5 justere kvalitetsnorma si, og at rutinen for kvalitetsm\u00e5lingar
  er endra. Kvalitetskontrollar p\u00e5 varemerke vil bli gjennomf\u00f8rt i samsvar
  med den nye rutinen i 2024.\\n\\nP\u00e5 designomr\u00e5det blei seks s\u00f8knader
  kontrollerte. Alle var tilfredsstillande behandla.\\n\\nDet blei ikkje gjennomf\u00f8rt
  stikkpr\u00f8vekontroll p\u00e5 behandling av patents\u00f8knader til Noreg i 2023
  grunna ressursmangel.\\n\\nDersom vi oppdagar avvik fr\u00e5 interne retningslinjer
  og krav, eller manglar som ikkje n\u00f8dvendigvis er klare avvik, f\u00f8lgjer
  vi dei opp for \u00e5 sikre kontinuerleg forbetring av prosessane v\u00e5re.\\n\\nInterne
  revisjonar\\n\\nI l\u00f8pet av 2023 blei det gjennomf\u00f8rt tre interne revisjonar
  for \u00e5 forbetre og effektivisere interne prosessar og kvaliteten p\u00e5 tenestene
  til Patentstyret. Desse omr\u00e5da blei vurderte: innf\u00f8ring av endringar i
  varemerkelova, rekrutteringsprosessen og organisering og ansvar. Dei tre revisjonane
  resulterte i totalt 3 avvik, 27 observasjonar og 12 forbetringsforslag. Funna blir
  f\u00f8lgde opp med tiltak.\\n\\nPatentstyret innf\u00f8rte ny risikometodikk for
  verksemda i februar 2023. Same \u00e5r blei det gjennomf\u00f8rt to overordna risikojennomgangar
  p\u00e5 verksemdsniv\u00e5. Kartlegginga resulterte i to raude risikoar som blir
  f\u00f8lgde opp med spesielle tiltak for \u00e5 redusere s\u00e5rbarheita.\\n\\nVurdering
  av avgj\u00f8rer fra Patentstyret opp mot resultatet av klagebehandlinga i KFIR\\n\\nKlager
  p\u00e5 avgj\u00f8rdene til Patentstyret i patent-, varemerke- og designs\u00f8knader
  blir behandla av Klagenemnda for industrielle rettar (KFIR). Talet p\u00e5 klager
  er normalt om lag 100\u2013150 per \u00e5r og har halde seg p\u00e5 dette niv\u00e5et
  gjennom mange \u00e5r.\\n\\nI 2023 kom det inn 113 nye klagesaker. Talet er l\u00e5gt
  samanlikna med dei om lag 20 000 avgj\u00f8rdene Patentstyret tek kvart \u00e5r.
  Det er ulike grunnar til at s\u00f8kjaren klagar p\u00e5 avgj\u00f8rdene v\u00e5re,
  og talet p\u00e5 klager seier derfor ikkje automatisk noko om kvaliteten p\u00e5
  avgj\u00f8rdene til Patentstyret. Det er likevel nyttig \u00e5 sj\u00e5 p\u00e5
  vurderingane og resultatet av klagebehandlinga i KFIR.\\n\\nVaremerke: I dei 140
  varemerkesakene som KFIR avgjorde i 2023, blei avgj\u00f8rda til Patentstyret halden
  fast i 85 saker, medan avgj\u00f8rda heilt eller delvis blei oppheva i 42 av sakene.
  Dei resterande sakene blei heva eller avviste av KFIR.\\n\\nDesign: Det har vore
  ei klage p\u00e5 designomr\u00e5det i 2023.\\n\\nPatent: KFIR tok ni avgj\u00f8rder
  i 2023. Dei kom til same resultat i fire av sakene og ulikt resultat i ei sak. I
  ei av sakene blei patentet f\u00f8rt vidare med endra krav, og i tre saker blei
  det gjeve hevingsorskurd.\\n\\nPatentstyret g\u00e5r gjennom resultata av alle klagesaker
  etter kvart. Sakene der KFIR har kome til eit anna resultat enn Patentstyret, er
  ofte tvilssaker. Partane i klagesaker kan ogs\u00e5 kome med ny dokumentasjon til
  behandlinga i KFIR, og dette har i fleire tilfelle f\u00f8rt til at innhaldet i
  klagu er eit anna enn d\u00e5 s\u00f8knaden blei behandla i Patentstyret. Patentstyret
  meiner tala viser at resultata stort sett samsvaar med avgj\u00f8rdene til KFIR.\\n\\nGjennom
  \u00abConvergence Programme\u00bb samarbeider EUIPO og dei nasjonale IPR-styresmaktene
  for \u00e5 gjere saksbehandlinga meir einskapeg p\u00e5 varemerke- og designomr\u00e5det.
  Patentstyret har i 2023 teke del i to ulike program p\u00e5 varemerkeomr\u00e5det,
  som har handla om varemerke som er i strid med \u00aboffentleg orden\u00bb og \u00abmoral\u00bb,
  og varemerke som er i strid med \u00abvond tru\u00bb. Desse harmoniseringsprosjekta
  blei starta i 2021 og vil bli avslutta i 2024. I 2024 startar det to nye harmoniseringsprosjekt,
  som mellom anna gjeld harmonisering av praksis rundt klare og presise varedeklarasjonar.\\n\\nP\u00e5
  patentomr\u00e5det kontrollerer Patentstyret sin del av s\u00f8knadsbehandlinga
  i Nordisk Patentinstitutt (NPI). Kontrollen skjer ved at Patentstyret og EPO behandlar
  dei same PCT-s\u00f8knadene, og vi samanliknar resultata av saksbehandlinga hos
  begge styresmaktene i etterkant. Den \u00e5ttande av desse harmoniseringsstudiane
  blei avslutta i 2023. Hovudfunnet er ogs\u00e5 denne gongen at Patentstyret og EPO
  hovudsakleg er harmoniserte med kvarandre. N\u00e5r harmoniseringskontrollen viser
  noko avvik, blir det lagt vekt p\u00e5 dette i oppl\u00e6ringa av s\u00f8ksbehandlarane.
  Den niande harmoniseringsstudien er starta i 2023 og blir fullf\u00f8rt i 2024.\\n\\nHarmonisering
  av praksis med EUIPO og EPO\\n\\nFor det norske n\u00e6ringslivet er det viktig
  at likt regelverk for behandling av s\u00f8knader om patent, varemerke og design
  blir praktisert likt i ulike land, slik at behandlinga er f\u00f8resieleg for den
  som s\u00f8kjer om registrering i fleire land.\\n\\nI tillegg til avgj\u00f8rdene
  fr\u00e5 KFIR og domstolane f\u00f8lgjer Patentstyret med p\u00e5 europeisk praksis
  i EPO, EUIPO, EU-retten og EU-domstolen.\\n\\nKundevurdering av s\u00f8knadsbehandlinga\\n\\nPatentstyret
  har unders\u00f8kt i kva grad privatkundar og bedriftskundar som har levert s\u00f8knad
  om patent-, varemerke- eller designregistrering i l\u00f8pet av 2023, er n\u00f8gde.
  Unders\u00f8kingane er gjennomf\u00f8rte i mai 2023, september 2023 og januar 2024,
  og her viser vi samla resultat. Til saman har 262 kundar svart. Det gav ein svarprosent
  p\u00e5 14,5 prosent.\\n\\nUnders\u00f8kinga m\u00e5ler kor n\u00f8gde kundane er
  med s\u00f8knadsprosessen, og kor n\u00f8gde dei er med rettleiinga dei f\u00e5r
  gjennom kundesenteret til Patentstyret i samband med s\u00f8knaden.\\n\\nResultata
  viser at kundane stort sett er sv\u00e6rt n\u00f8gde med s\u00f8knadsbehandlinga,
  og det er sm\u00e5 skilnader mellom dei ulike s\u00f8kjargruppene.\\n\\nFigur 8:
  Kor n\u00f8gde kundane er totalt, i 2023\\n\\nGrafane viser gjennomsnittsvurdering
  p\u00e5 ein skala fr\u00e5 1 til 5, der 1 er sv\u00e6rt misn\u00f8gd og 5 er sv\u00e6rt
  n\u00f8gd.\\n\\nFigur 9: Kor n\u00f8gde kundane er med s\u00f8knadsprosessen\\n\\nGrafane
  viser gjennomsnittsvurdering p\u00e5 ein skala fr\u00e5 1 til 5, der 1 er sv\u00e6rt
  misn\u00f8gd og 5 er sv\u00e6rt n\u00f8gd.\\n\\nFigur 10: Kor n\u00f8gde kundane
  er med rettleiinga\\n\\nGrafane viser gjennomsnittsvurdering p\u00e5 ein skala fr\u00e5
  1 til 5, der 1 er sv\u00e6rt misn\u00f8gd og 5 er sv\u00e6rt n\u00f8gd.\\n\\n|                  |
  Varemerke | Patent | Design |\\n|------------------|-----------|--------|--------|\\n|
  Lett \u00e5 kontakte Patentstyret | 4,8       | 4,2    | 4,0    |\\n| God og profesjonell
  rettleiing | 4,5       | 4,2    | 4,0    |\\n| Rettleier til god hjelp | 4,3       |
  4,2    | 4,3    |\\n\\nVurdering av forunders\u00f8kingar\\n\\nPatentstyret gjennomf\u00f8rer
  ogs\u00e5 kvart \u00e5r ei unders\u00f8king blant dei som har kj\u00f8pt \u00e9i
  eller fleire forunders\u00f8kingar innanfor patent, varemerke og design. Av dei
  261 som fekk unders\u00f8kinga, har Patentstyret f\u00e5tt 59 svar (svarprosent
  p\u00e5 23 prosent). Resultata viser at kundane er sv\u00e6rt n\u00f8gde med forunders\u00f8kingane
  v\u00e5re. Dette er omtrent p\u00e5 niv\u00e5 med fjor\u00e5ret.\\n\\nDesign har
  opplevd ein auke fr\u00e5 fjor\u00e5ret, men merk at det generelt blir gjennomf\u00f8rt
  sv\u00e6rt f\u00e5 forunders\u00f8kingar p\u00e5 designomr\u00e5det, og at det derfor
  er eit relativt lite talgrunnlag.\\n\\nFigur 11:\\n\\nGrafane viser gjennomsnittsvurdering
  p\u00e5 ein skala fr\u00e5 1 til 4, der 1 er sv\u00e6rt misn\u00f8gd og 4 er sv\u00e6rt
  n\u00f8gd.\\n\\nNorske patents\u00f8kjarar vel oftast \u00e5 leverer den f\u00f8rste
  s\u00f8knaden om patent (f\u00f8rstes\u00f8knaden) i Noreg, og han blir deretter
  granska av Patentstyret. Dei som \u00f8nskjer vern i eksportmarknadene, leverer
  s\u00e5 eitt \u00e5r seinare ein internasjonal patents\u00f8knad, og dei fleste
  s\u00f8knader g\u00e5r til det globale PCT-systemet. S\u00f8knaden blir granska
  av eit PCT-organ, til d\u00f8mes NPI. Deretter kan s\u00f8kjarane f\u00f8re s\u00f8knaden
  vidare i dei landa der dei \u00f8nskjer patentvern. Andre vegar ut i verda for s\u00f8knader
  fr\u00e5 norske s\u00f8kjarar finst, og dei er ogs\u00e5 mykje brukte. Det er ikkje
  eit krav at s\u00f8knaden f\u00f8rst blir levert i eige land, og det kan av strategiske
  \u00e5rsaker vere fornuftig for enkelte s\u00f8kjarar \u00e5 levere f\u00f8rstes\u00f8knaden
  i andre land eller til EPO.\\n\\nProsentdelen av internasjonale s\u00f8knader fr\u00e5
  norske s\u00f8kjarar som blir leverte til Patentstyret, kan vere ein indikasjon
  p\u00e5 kor n\u00f8gde s\u00f8kjarane er med Patentstyret, og dette er ein st\u00f8ttande
  analyse i MRS.\\n\\nTabellen nedanfor viser at over halvparten av dei internasjonale
  patents\u00f8knadene (PCT) som norske s\u00f8kjarar leverer, f\u00f8rst blei levert
  inn til Patentstyret. Resten av dei internasjonale s\u00f8knadene fr\u00e5 norske
  s\u00f8kjarar hadde hovudsakleg prioritet fr\u00e5 USA, Storbritannia og EPO. Dei
  siste \u00e5ra har prosentdelen med norsk prioritet variert lite. Samanlikna med
  Sverige og Danmark brukar norske s\u00f8kjarar i st\u00f8rre grad f\u00f8rstes\u00f8knad
  i heimlandet enn det danske og s\u00e6rlig svenske s\u00f8kjarar gj\u00f8r. Dette
  kan kome av h\u00f8gare grad av internasjonalisering, men kan ogs\u00e5 spegle preferansar
  hos r\u00e5dgjevarane.\\n\\n| Talet p\u00e5 internasjonale s\u00f8knader (PCT) fr\u00e5
  norske s\u00f8kjarar | 2019 | 2020 | 2021 | 2022 | 2023 |\\n|----------------------------------------------------------|------|------|------|------|------|\\n|
  Prosentdel av desse som har prioritet fr\u00e5 norsk s\u00f8knad   | 52   | 55   |
  51   | 53   | 58   |\\n\\n*Kjelde: worldwide.espacenet.com*\\n\\nDelm\u00e5l 2:
  Betre bruk av immaterielle verdiar\\n\\nDet er eit m\u00e5l for Patentstyret at
  norske bedrifter har nok kunnskap og medvitt om korleis dei kan sikre l\u00f8nsemd
  gjennom rett bruk av immaterielle rettar og verdiar. Gjennom forvaltning og formidling
  av kunnskap om immaterielle rettar og verdiar er Patentstyret ein del av det norske
  innovasjonssystemet.\\n\\nPatentstyret har styringsindikatorar som m\u00e5ler kompetanseoverf\u00f8ring
  til utvalde m\u00e5lgrupper og IPR-modenskap blant norske brukarar. Dette arbeidet
  m\u00e5 tilpassast etter dei \u00f8konomiske rammene Patentstyret har, og f\u00f8ringa
  fr\u00e5 N\u00e6rings- og departementet om \u00e5 prioritere delm\u00e5l 1. Om lag
  6 prosent av ressursane til Patentstyret blei brukte p\u00e5 dette delm\u00e5let
  i 2023.\\n\\n| STYRINGSDIMENSJON | INDIKATORAR                                                                 |
  ST\u00d8TTANDE ANALYSAR                                                                 |\\n|-------------------|------------------------------------------------------------------------------|------------------------------------------------------------------------------------|\\n|
  Kompetanseoverf\u00f8ring | \u2013 Omfang av aktivitetar for kompetanseoverf\u00f8ring
  (kurs, webinar, samarbeid med ulike m\u00e5lgrupper, osv.)  \\n|                    |
  \u2013 Kor n\u00f8gde kundane er med saksbehandlinga er i Patentstyret                  |
  \u2013 Prioriteringsanalysen til Patentstyret                                           |\\n|
  IR-modenskap      | \u2013 Statistikk for bruk av tenestene til Patentstyret  \\n|                    |
  \u2013 Samla tal patent-, varemerke- og designs\u00f8knader til utlandet fr\u00e5
  norske s\u00f8kjarar | \u2013 Analyse av bruken av tenestene til Patentstyret  \\n|                    |                                                                              |
  \u2013 Utviklinga i bruken av immaterielle rettar i utvalde n\u00e6ringer  \\n|                    |                                                                              |
  \u2013 Analyse av bidraget til verdiskaping fr\u00e5 IPR-intensive n\u00e6ringer
  (rapportering til NFD skjer etter publisering av unders\u00f8kinga fr\u00e5 EUIPO/EPO2)
  |\\n\\nKompetanseoverf\u00f8ring\\n\\nOmfang av arrangements- og kurstilbod\\n\\nKurstilbodet
  til Patentstyret rettar seg b\u00e5de mot personar med lite eller ingen kunnskap
  om fagfeltet og mot profesjonelle akt\u00f8rar. Kursa skal auke kunnskapen om immaterielle
  rettar og verdiar i det norske n\u00e6ringslivet og bidra til kompetanseutvikling
  for dei profesjonelle akt\u00f8ran.\\n\\nPandemi\u00e5ra l\u00e6rte oss at vi n\u00e5r
  mange p\u00e5 nettet. Praksisen med \u00e5 str\u00f8yme dei aller fleste arrangementa
  som gratis webinar blei derfor f\u00f8rt vidare. Ved \u00e5 tilby fleire kortare,
  digitale kurs treffer Patentstyret st\u00f8rre delar av landet enn f\u00f8r.\\n\\nVerdas
  immaterialrettssdag (World IP Day) blei for f\u00f8rste gong gjennomf\u00f8rt fullt
  ut digitalt, medan IP-dagen, ein fagdag vi arrangerte saman med FONIP og NIP, blei
  gjennomf\u00f8rt fysisk. Arrangementet er skildra i n\u00e6raare detalj i kapittelet
  \u00abSamarbeid med r\u00e5dgjevarar p\u00e5 IPR-felten\u00bb nedanfor.\\n\\nPatentstyret
  gjennomf\u00f8rte totalt 23 arrangement i 2023, med om lag 2 600 p\u00e5meldde fr\u00e5
  n\u00e6ringslivet og profesjonelle IP-akt\u00f8rar som \u00f8nskte \u00e5 l\u00e6re
  meir om immaterielle verdiar og rettar. Alle p\u00e5meldde til webinarana v\u00e5re
  f\u00e5r h\u00f8ve til \u00e5 sj\u00e5 opptak av kurset i etterkant. Kursa er dermed
  tilgjengelege for fleire, og den enkelte kan sj\u00e5 opptaket eller delar av det
  n\u00e5r det passar.\\n\\nTotalt 40 opptak blei publiserte p\u00e5 nettsidene til
  Patentstyret, og i l\u00f8pet av \u00e5ret blei dei sett av over 700 personar med
  ulikt kunnskapsniv\u00e5. Det er eit l\u00e5gare tal enn \u00e5ret f\u00f8r, men
  ikkje uventa sidan nokre av opptaka er fr\u00e5 pandemi\u00e5ra. Det viser likevel
  at interessa for \u00e5 sj\u00e5 opptak framleis held seg h\u00f8g. Med nye nettsider
  og fleire korte videobar om det grunnleggjande innanfor IPR \u00f8nskjer Patentstyret
  \u00e5 treffe end\u00e5 breiare i 2024.\\n\\nKurssidene har opplevd ein markant
  auke i trafikk, med meir enn ei dobling av \u00f8kter og ein vesentleg auke i talet
  p\u00e5 brukarar som held fram til p\u00e5meldingssidene. E-postmarknadsf\u00f8ring
  har vist seg \u00e5 vere s\u00e6rlig effektivt for \u00e5 tiltrekke seg kursp\u00e5meldingar.
  Interessa for opptak av webinar stadfestar ogs\u00e5 at det digitale tilbodet v\u00e5rt
  m\u00f8ter behova og interessene til brukarane.\\n\\nPatentstyret m\u00e5ler alltid
  effekten av arrangementa gjennom korte sp\u00f8rjeunders\u00f8kingar i etterkant,
  og 95 prosent av deltakarane meinte dei var nyttege. I overkant av 86 prosent svarte
  ogs\u00e5 at dei kan gjere bruk av kunnskapen i den daglege jobben sin. M\u00e5let
  er 85 prosent. Snittvurderinga per kurs l\u00e5g p\u00e5 3,8 (p\u00e5 ein skala
  fr\u00e5 1 til 4, der 4 er h\u00f8gast) \u2013 ein vesentleg auke fr\u00e5 3,53
  fr\u00e5 \u00e5ret f\u00f8r. Dette viser at deltakarane jamt over er n\u00f8gde,
  noko som tyder p\u00e5 at Patentstyret leverer kurs, webinar og arrangement p\u00e5
  eit jamt h\u00f8gt niv\u00e5.\\n\\nNokre av temaa p\u00e5 arrangementa v\u00e5re
  i 2023\\n\\n- Patent Protection for Software-Related Inventions\\n- Endringar i
  varemerkelova\\n- Lisensiering av immaterielle rettar\\n- A fresh look at procedural
  aspects of appeal proceedings\\n- IP-vern av programvare\\n- Artificial Intelligence
  \u2013 the tipping point of a new industrial revolution \u2013 i samarbeid med Oslo
  Innovation Week 2023\\n- Varem\u00e6rke i den digitale sf\u00e6ren\\n- Starte-og-drive-dagen\\n\\nF\u00f8redrag
  og andre arrangement\\n\\nPatentstyret heldt 64 eksterne f\u00f8redrag for 2250
  deltakarar i 2023. 64 prosent av f\u00f8redraga blei haldne for og i samarbeid med
  verkemiddelapparatet, inkubatorar, n\u00e6ringshagar, katapultar, n\u00e6ringslivsorganisasjonar
  og andre akt\u00f8rar. Dei resterande f\u00f8redraga var for studentar ved norske
  universitet og h\u00f8gskular (UoH).\\n\\nPatentstyret heldt 23 f\u00f8redrag for
  360 studentar innan ingeni\u00f8rfag, innovasjon og entrepren\u00f8rskap, bioteknologi,
  design, marknadsf\u00f8ring, innovasjon og leiing. UoH-milj\u00f8a etterspurde hovudsakleg
  f\u00f8relisinigar om patent, varemerke og design. I tillegg \u00f8nskte dei f\u00f8relisinigar
  om opphavsrett, arbeidstakaropfinningar, konfidensialitetsavtalar og hemmelgehald,
  og s\u00f8k etter patentinformasjon.\\n\\nPatentstyret bidrog ogs\u00e5 til \u00e5
  auka kunnskapen om immaterielle rettar hos deltakarar vi treffe p\u00e5 ulike arrangement.
  I 2023 stod Patentstyret p\u00e5 stand p\u00e5 ti arrangement og deltok p\u00e5
  34 andre arrangement for \u00e5 informere om immaterielle rettar og bygge gode relasjoner
  til strategiske samarbeidspartnerar.\\n\\nSamarbeid med verkemiddelakt\u00f8rane\\n\\nPatentstyret
  har i 2023 samarbeidd med Innovasjon Noreg, Forskningsr\u00e5det, Siva, Design og
  arkitektur Norge (DOGA), Br\u00f8nn\u00f8ysundregistra, Altinn og Norid. M\u00e5let
  med samarbeidet er f\u00f8rst og fremst \u00e5 utvikle felles aktiviteter og tenester,
  slik at fleire bedrifter aukar kunnskapen og medvitet om korleis vern av immaterielle
  verdiar kan bidra til verdskaping og auke konkurransekraft.\\n\\n2023 markerte starten
  for ein ny programperiode i inkubator- og n\u00e6ringshageprogramma i Siva. Med
  bakgrunn i dette, og at Patentstyret og Siva fornya samarbeidsavtalen hausten 2022,
  blei det gjennomf\u00f8rt ei ny nullpunktsm\u00e5ling for \u00e5 kartlegge kunnskapen
  og medvitet om IP hos nettverket. Samtidig \u00f8nskte Patentstyret \u00e5 identifisere
  relevante emne for kurs og f\u00e5 tilbakemeldingar og l\u00e6re om moglege forbetra
  tiltak som kan setjast i verk. Samarbeidet med b\u00e5de Siva, inkubatorar, n\u00e6ringshagar
  og katapultsenter vil bli styrkt som f\u00f8lgje av dette.\\n\\nI samarbeid med
  andre akt\u00f8rar fr\u00e5 verkemiddelapparatet har Br\u00f8nn\u00f8ysundregistra,
  Patentstyret og Norid st\u00e5tt saman om \u00e5 arrangere \u00abStarte og drive
  bedrift\u00bb rundt i Noreg sidan 2013. Patentstyret arrangerte i alt fem slike
  arrangement rundt om i Noreg, og dei er popul\u00e6re og godt bes\u00f8kte.\\n\\nInkubatorar\\n\\nEin
  inkubator er eit innovasjonsselskap som skal bidra til utvikling og etablering av
  nye vekstbedrifter og skape vekst i det etablerte n\u00e6ringslivet. Inkubatoren
  tilbyr eit fagleg og sosiaalt milj\u00f8 der gr\u00fcnderar, bedrifter, akademia,
  FoU-milj\u00f8, investorar og andre blir kopla saman.\\n\\nMeir info: https://siva.no/virkemidler/inkubasjonsprogrammet/\\n\\nNorsk
  katapult\\n\\nNorsk katapult er ei ordning med nasjonale senter som tilbyr fasilitetar,
  utstyr og kompetanse. Katapultsenter gjer det enklare for innovative bedrifter \u00e5
  utvikle prototypar, teste, visualisere og simulere. Dette gjer vegna fr\u00e5 konseptstadiet
  til marknadsintroduksjon enklare for norsk industri.\\n\\nMeir info: https://siva.no/virkemidler/norsk-katapult/\\n\\nSamarbeid
  med r\u00e5dgjevarar p\u00e5 IPR-feltet\\n\\nPatentfullmektigar og advokatar er
  storbrukarar av tenestene v\u00e5re og bidreg til \u00e5 styrkje IPR-kompetansen
  i n\u00e6ringslivet i Noreg. For \u00e5 levere gode tenester til n\u00e6ringslivet
  er det viktig at Patentstyret har eit godt samarbeid med akt\u00f8ran. I 2023 arrangerte
  Patentstyret for fjerde gong ein fagdag (IP-dagen) saman med Foreiningen for norske
  IP-r\u00e5dgivere (FONIP) og Norsk foreining for Industriens Patentingeni\u00f8rar
  (NIP). Tittelen var \u00abIP skills at the tipping point\u00bb. F\u00f8rem\u00e5let
  med dagen er mellom anna \u00e5 identifisere kva behov n\u00e6ringslivet har, og
  kva felles utfordringar akt\u00f8ran p\u00e5 IPR-feltet st\u00e5r overfor. For \u00e5
  f\u00e5 innspel til vidareutvikling og brukartilpassing av tenestene v\u00e5re gjennomf\u00f8rte
  vi jamlege samarbeidsm\u00f8te med FONIP, IP-r\u00e5dgjevarar og advokatar.\\n\\nSamarbeid
  med universitet\\n\\nEit av tiltaka i oppf\u00f8lginga av strategien til Patentstyret
  er \u00e5 formalisere samarbeid om IPR-utdanning ved norske UoH-milj\u00f8. Vi har
  per 2023 samarbeidsavtalar med Universitetet i Agder (UiA), NTNUs entrepren\u00f8rskole
  og NMBU. Patentstyret tilbyr f\u00f8relesingar i ulike studieretningar og rettleiing
  av undervisningspersonell, studentar, forskarar og ph.d.-kandidatar.\\n\\nUtover
  samarbeidsavtalane har Patentstyret hatt aktivitetar med OsloMet, H\u00f8yskolen
  Kristiania, Fagskolen Kristiania, Arkitektur- og designh\u00f8gskolen i Oslo, Universitetet
  i Stavanger, Universitetet i Oslo og Nord universitet.\\n\\nI 2023 bidrog Patentstyret
  med 23 f\u00f8redrag i universitets- og h\u00f8gskulesektoren.\\n\\nForespurnader
  om IP-statistikk\\n\\nI 2023 har vi f\u00e5tt vesentleg fleire forespurnader fr\u00e5
  forskingsmilj\u00f8, analysebyr\u00e5 og andre milj\u00f8 om IP-statistikk og utvikling
  av rettar i Noreg og internasjonalt. Dei fleste forespurnadene har vore knytte til
  patentomr\u00e5det. Patentstyret har i 2023 ogs\u00e5 levert innspel og IP-statistikk
  til Nasjonalt eksportr\u00e5d, og vidareutviklinga av tenester som gjeld IP-statistikk,
  vil halde fram i 2024.\\n\\nNettsider\\n\\nPatentstyret.no er den viktigaste kommunikasjonskanalen
  v\u00e5r og skal f\u00f8rst og fremst s\u00f8rge for kompetanseoverf\u00f8ring til
  nye kundar utan s\u00e6reg kunnskap om immaterielle rettar. Patentstyret \u00f8nskjer
  \u00e5 auke kunnskapen om immaterielle rettar generelt, vise korleis s\u00f8knadsprosessane
  er bygd opp, og informere om kurs, arrangement og nytteige IPRverkt\u00f8y. Nettstaden
  er ogs\u00e5 eit viktig verkt\u00f8y for dei som har meir erfaring med fagomr\u00e5da
  v\u00e5re. M\u00e5let er \u00e5 bidra til fleire gode rettar for det norske n\u00e6ringslivet.
  I 2023 hadde Patentstyret.no 250 500 \u00f8kter. Dei mest popul\u00e6re sidene er
  tema om varem\u00e6rke. Over halvparten av trafikken kom fr\u00e5 s\u00f8kjemotorar,
  og Google er st\u00f8rst. 76 prosent g\u00e5r inn p\u00e5 sidene via datamaskin,
  medan rundt 23 prosent brukar mobil.\\n\\nI 2023 har Patentstyret arbeidd med \u00e5
  utvikle nye nettsider. Dette er eit ledd i eit st\u00f8rre prosjekt \u2013 Webl\u00f8ftet.
  Hovudm\u00e5let med dette prosjektet er \u00e5 1) f\u00e5 p\u00e5 plass ei fleksibel
  og framtidsetr\u00f8tt publisering l\u00f8ysing (CMS) og 2) forbetre innhaldsstrukturen,
  flyten og kundereisa p\u00e5 digitale flater. Dei nye nettsidene blei lanserte p\u00e5
  ny teknisk plattform i januar 2024. Dette har vore eit stort l\u00f8ft som gjev
  eit godt grunnlag for vidare arbeid med \u00e5 oppn\u00e5 ei heilskapleg digital
  kundereise. Sj\u00e5 ogs\u00e5 Utvikling av Patentstyret gjennom digitalisering.)\\n\\nI
  samband med nettsideprosjektet starta Patentstyret ei brukarunders\u00f8king p\u00e5
  den d\u00e5verande nettsida hausten 2023. Denne unders\u00f8kinga gav oss oversikt
  over kven som brukar nettsidene, kva for oppg\u00e5ver dei \u00f8nsker \u00e5 utf\u00f8re,
  og om dei f\u00e5r gjort det dei skal, eller finn den \u00f8nskte informasjonen
  p\u00e5 sidene. Dette har gjeve oss eit godt grunnlag for \u00e5 m\u00e5le kvaliteten
  p\u00e5 sidene og \u00e5 prioritere kva som blir viktig \u00e5 arbeide vidare med
  p\u00e5 nye nettsider.\\n\\n**Nyheitsbrev**\\n\\nPatentstyret sender ut m\u00e5nadlege
  nyheitsbrev for mellom anna \u00e5 promotere nyheter og artiklar fr\u00e5 nettsidene.
  Om lag 2 450 abonnerer p\u00e5 nyheitsbrevet, og ein tredjedel opnar utsendingane.
  Sidan 2022 har Patentstyret hatt eit eige nyheitsbrev retta mot dei som har ein
  del kunnskap om IPR (IP-innsikt). Dette gjer det mogleg \u00e5 gje informasjon tilpassa
  deira kunnskapsniv\u00e5.\\n\\nNyheitsbreva har bidrege til auka trafikk og engasjement
  p\u00e5 nettsidene, noko som tyder p\u00e5 at innhaldet er interessant og relevant
  for abonnentane.\\n\\n**Sosiale medium**\\n\\nPatentstyret brukar sosiale medium
  (LinkedIn, Facebook, Instagram og YouTube) for \u00e5 n\u00e5 ut til ulike m\u00e5lgrupper
  med tilpassa spr\u00e5k og bodskap \u2013 til d\u00f8mes gr\u00fcnderar, fagfolk
  i ulike innovasjonsmilj\u00f8, IPR-r\u00e5dgjevarar og mediebransjen. Totalt hadde
  Patentstyret om lag 15 000 f\u00f8lgjarar i desse kanalane ved utgangen av 2023.\\n\\nSosiale
  medium bidrog med 4 256 bes\u00f8k til Patentstyret.no og s\u00f8kjetenesta v\u00e5r,
  noko som var vesentleg l\u00e5gare enn tidlegare \u00e5r. Hovud\u00e5rsaka til nedgangen
  er redusert tidsbruk p\u00e5 sosiale medium ettersom fokuset i 2023 har vore Webl\u00f8ftet
  og andre krevjande prosjekt. Dei som fann vegen til oss fr\u00e5 sosiale plattformer,
  viste eit h\u00f8gt niv\u00e5 av engasjement, og det indikerer at innhaldet vi deler,
  treffer m\u00e5lgruppa godt.\\n\\nPatentstyret fekk 420 nye kurskundar via sosiale
  medium. Desse plattformene bidro til 5,7 prosent av alle bes\u00f8k til sidene om
  kursinnhald og stod for \u00e9in prosent av kursp\u00e5meldingane.\\n\\n**Tradisjonelle
  medium**\\n\\nI 2023 oppn\u00e5dde Patentstyret god dekning i tradisjonelle medium,
  med 346 artiklar. Omtale i redakt\u00f8rstyrte nyheitsmedium er viktig i arbeidet
  med \u00e5 synleggjere Patentstyret. Den nye bedriftsunders\u00f8kinga fr\u00e5
  hausten 2023 viser at det er eit stort behov for \u00e5 n\u00e5 ut med IPR-bodskapar
  til eit breitt publikum.\\n\\nI det f\u00f8rste kvartalet av \u00e5ret dominerte
  tala p\u00e5 kvinnelege patents\u00f8karar, med eit stort oppslag i Aftenposten
  i front. Bodskapar som dette er viktige verkemiddel for \u00e5 oppn\u00e5 auka kjennskap
  til IP generelt, men ogs\u00e5 for \u00e5 bidra til samfunnsdebatten. Patentomr\u00e5det
  fekk ogs\u00e5 merksemd etter at ein mekanikar fekk medhald i Oslo tingrett om at
  ei oppfinning han gjorde p\u00e5 fritida, ikkje er eigd av eit stort internasjonalt
  oljeselskap.\\n\\nElles har Patentstyret igjen f\u00e5tt oppleve at varemerkekonflikter
  vekkjer interesse, og det er dette brorparten av medieoppslaga dette \u00e5ret har
  handla om. I juni blei det kjent at fotballstjerna Erling Braut Haaland \u00f8nskte
  \u00e5 registrere namnet sitt som eit varemerke, men at ein annan nordmann hadde
  kome han i forkj\u00f8pet. Her var ogs\u00e5 internasjonale medium p\u00e5 banen,
  og eksperter fr\u00e5 Patentstyret blei sitert i britiske The Sun. Saka heldt fram
  med \u00e5 vekkje oppsikt d\u00e5 det i august blei kjent at rettshavaren gav fotballstjerna
  samtykke til \u00e5 s\u00f8kje om rettane til sitt eige namn.\\n\\nVi publiserte
  tre kronikkar og fire pressemeldingar i l\u00f8pet av \u00e5ret. Patentstyret har
  framleis gjennomslagskraft i riksmedium som VG, NRK, Aftenposten og Dagbladet. Dette
  er mediehus som har over ein million unike brukarar dagleg, og bodskapane v\u00e5re
  n\u00e5r derfor breitt ut. Patentstyret har ogs\u00e5 gode oppslagstal i aviser
  som er retta mot n\u00e6ringslivet, og i fagblad. Der n\u00e5r vi ei anna m\u00e5lgruppe,
  og det er st\u00f8rre spelerom for \u00e5 prate om nisjestoff som er knytt til bransjen.\\n\\nStyresmaktsnettverk
  mot inngrep i immaterialrettar og nettsida Velgekte.no\\n\\nInngrep i immaterialrettar,
  som varemerkeforsaking og piratkopiering, er eit aukande problem som p\u00e5verkar
  mange samfunnsomr\u00e5de.\\n\\nStyresmaktsnettverk mot inngrep i immaterialrettar
  blei etablert i 2015 for \u00e5 sikre koordinering p\u00e5 tvers av fagomr\u00e5da
  til ulike styresmakter for mellom anna \u00e5 auka medvit og kunnskap om temaet
  og \u00e5 ta felles initiativ til f\u00f8rebyggjande og opplysande arbeid med m\u00e5l
  om \u00e5 kjempe mot problemet.\\n\\nI 2023 blei Mattilsynet med i styresmaktsnettverket,
  og nettverket omfattar totalt elleve ulike organ. Patentstyret har sekretariatsfunksjonen
  for nettverket og samarbeider med dei andre organa om \u00e5 gjennomf\u00f8re tiltak
  for \u00e5 skape meir medvit kring piratkopiering og varemerkeforsaking, og for
  \u00e5 st\u00f8tte kvarandre og dele informasjon p\u00e5 omr\u00e5det.\\n\\nDet
  har blitt halde to heildagssamlingar i nettverket i 2023. I tillegg til deling av
  informasjon og oppdateringar har det st\u00e5tt aktuelle tema p\u00e5 agendaen,
  som bidrag til ein stor internasjonal konferanse om kampen mot varemerkeforsakingar
  og piratkopiering, og eit blikk p\u00e5 det st\u00f8rste beslaget av falske varer
  i noregshistoria i Oslo hamn. Mange fr\u00e5 nettverket deltok p\u00e5 The 16th
  International Law Enforcement IP Crime Conference, der Noreg var vertskap og Kripos
  norsk arrang\u00f8r saman med Interpol. P\u00e5 konferansen stod Patentstyret og
  Tolletaten saman p\u00e5 stand for Velgekte.no.\\n\\nPatentstyret har i 2023 f\u00f8lgd
  den internasjonale utviklinga p\u00e5 omr\u00e5det, mellom anna gjennom deltakning
  i The European Observatory on Infringements of Intellectual Property Rights (EU-observatoriet).\\n\\nNettstaden
  Velgekte.no gjev informasjon om varemerkeforsaking og piratkopiering fr\u00e5 offentlege
  styresmakter. Patentstyret har halde Velgekte.no oppdatert i 2023 og nyttja nettstaden
  aktivt som landingsside i periodane med medvitskampanjar. Patentstyret har i \u00e5r
  gjennomf\u00f8rt tre kampanjar for \u00e5 gjere forbrukarane medvitte, to av dei
  i samarbeid med Tolletaten.\\n\\nDen f\u00f8rste kampanjen dette \u00e5ret var ei
  markering av World Anti-Counterfeiting Day 2023, i samband med lanseringa av EUIPO-studien
  IP Perception Study 2023. Kampanjen gav oss god spreieing i sosiale medium og pressemerksemd
  i form av b\u00e5de radio- og nettsak i NRK. Dagen blei markert 8. juni og var derfor
  eit fint oppspel til neste kampanje, som gjekk gjennom sommarm\u00e5nadene.\\n\\nDenne
  kampanjen blei gjennomf\u00f8rt i samarbeid med Tolletaten og gjekk i sosiale medium.
  Som tidlegare bygde han p\u00e5 tre korte animasjonar med s\u00f8kjelys p\u00e5
  ulike problematiske sider ved kj\u00f8p av piratkopiar. M\u00e5lgruppa var unge
  forbrukarar og netthandlarar. Kampanjen gav omg\u00e5ande og kraftig effekt p\u00e5
  Velgekte.no og bidrog til n\u00e6r 200 prosent auka i trafikk til nettsida.\\n\\nJulekampanjen
  var i same stil, men med nytt design p\u00e5 animasjonane. I kombinasjon med eit
  auka annonsebudsjettr gav dei nye videoane sv\u00e6rt gode tal p\u00e5 b\u00e5de
  sosiale medium og nettsidene. Velgekte.no gjorde eit hopp fr\u00e5 omtrent 900 beskjande
  i oktober og november til 5 500 i desember. Totalt n\u00e5dde sommar- og julekampanjen
  1,1 millionar unike brukarar i sosiale medium.\\n\\nKundesenteret\\n\\nKundesenteret
  til Patentstyret tok i 2023 imot rett i overkant av 9 000 telefonar. Detta er ein
  nedgang p\u00e5 1000 telefonar samanlikna med \u00e5ret f\u00f8r. Samtidig har Patentstyret
  hatt ein auke p\u00e5 n\u00e6rare 5 prosent i talet p\u00e5 e-postar. Fordelinga
  er tilsvarande som tidlegare \u00e5r, med hovudvekt p\u00e5 f\u00f8respurnadar om
  varemerke, etterf\u00f8lgd av patent og design. Kundane fekk mellom anna svar p\u00e5
  sp\u00f8rsm\u00e5l om s\u00f8knadsprosessar, regelverk, internasjonale s\u00f8knadsordningar
  og kva for akt\u00f8rar som kan st\u00f8tte dei i innovasjonsprosessen.\\n\\nPatentstyret
  er stolte av \u00e5 bli k\u00e5ra til den beste kundeservicen \u00abBest i test\u00bb,
  offentleg klasse i Noreg. Denne prisen, som blir delt ut av analyse- og innsiktsbyr\u00e5et
  SeeYou, fortel oss at kundesenteret v\u00e5rt tek godt vare p\u00e5 kundane, og
  at kundane opplever \u00e5 f\u00e5 svar p\u00e5 dei mange sp\u00f8rsm\u00e5la sine.\\n\\nPatentstyret
  har eit fagleg sterkt lag som jobbar p\u00e5 kundesenteret, og medarbeidarane rettleier
  kvarandre for \u00e5 oppn\u00e5 stadig betre kundeservice. Det \u00e5 ta hand om
  kundane v\u00e5re st\u00e5r sv\u00e6rt h\u00f8gt p\u00e5 prioriteringslista, og
  vi jobbar strukturert og m\u00e5lretta for \u00e5 kontinuerleg forbetre all kommunikasjon
  og rettleieing til kundane.\\n\\nOpplevd kompetanseoverf\u00f8ring\\n\\nVi evaluerer
  alle kurs, f\u00f6redrag og arrangement i etterkant for \u00e5 sj\u00e5 om deltakarane
  er n\u00f8gd. M\u00e5let er ein sk\u00e5r p\u00e5 3,5 p\u00e5 ein skala fr\u00e5
  1 til 4, og dette n\u00e5dde vi for dei fleste arrangementa \u2013 sj\u00e5 figur
  12.\\n\\nVi m\u00e5ler ogs\u00e5 korleis kundane opplever kompetanseoverf\u00f8ringa
  ved kj\u00f8p av informasjonstjenester og i s\u00f8knadsbehandlinga. Resultata er
  viste under kundevurderingar.\\n\\nFigur 12: Opplevd kompetanseoverf\u00f8ring\\n\\n|
  Fysiske kurs og arrangement | Webinar |\\n|-----------------------------|---------|\\n|
  Kor nytig kundane opplevde det | 3,6     |\\n| Kor forn\u00f8gd kundane er       |
  3,5     |\\n\\nGrafane viser gjennomsnittsvurdering p\u00e5 ein skala fr\u00e5 1
  til 4, der 1 er sv\u00e6rt misn\u00f8gd og 4 er sv\u00e6rt n\u00f8gd.\\n\\nIPR-modenskap\\n\\nIPR-modenskap
  fortel i kva grad bedriftene brukar immaterialrettssystemet, i kva grad dei tek
  omsyn til immaterielle rettar i verksamda si, og om dei er medvitne p\u00e5 om dette
  er relevant eller ikkje for bedrifta. For mange bedrifter kan berre retten til f\u00f8retaksnamn
  og varemerke vere aktuelt, medan eigarskap til immaterielle rettar for andre kan
  vere sj\u00f8lvre forretningsideen. Mange nyttar immaterielle rettar prim\u00e6rt
  for \u00e5 verne om dei immaterielle verdiane sine, medan andre bedrifter brukar
  IPR meir aktivt i forretningsverksamda, gjerne langsiktig og strategisk.\\n\\nDet
  er viktig at dei bedriftena som immaterielle verdiar og rettar er relevant for,
  er medvitne og s\u00f8rger for \u00e5 ha ein IPR-strategi som gjev dei kontroll
  og n\u00f8dvendig sikring av verdiane sine, og at dei overvaker konkurrentar og
  moglegheitsrom.\\n\\nPatentstyret gjennomf\u00f8rte hausten 2023 ei unders\u00f8king
  blant norske verksemder om kjennskap til Patentstyret og merksemda deira rundt patent,
  varemerke og design. Unders\u00f8kinga viser at det er relativt l\u00e5g kjennskap
  til Patentstyret. Om lag 10 prosent av dei spurde svarar at dei kjenner Patentstyret
  godt. Dette er p\u00e5 niv\u00e5 med tidlegare unders\u00f8kingar.\\n\\nUnders\u00f8kinga
  m\u00e5ler ogs\u00e5 IPR-modenskap blant verksemdene. Resultata viser at f\u00e6rre
  verksemder no enn i tidlegare m\u00e5lingar har diskutert om patent,\\n\\nTalet
  p\u00e5 forunders\u00f8kingar\\n\\nPatentstyret utf\u00f8rte til saman 837 forunders\u00f8kingar
  i 2023, som er ein nedgang fr\u00e5 dei to f\u00f8reg\u00e5ande \u00e5ra, d\u00e5
  det blei gjort h\u00f8vesvis 1 088 (2022) og 997 (2021) forunders\u00f8kingar.\\n\\nTalet
  p\u00e5 utf\u00f8rte forunders\u00f8kingar har halde seg stabilt p\u00e5 design,
  med 6 forunders\u00f8kingar, og kundane var b\u00e5de privatpersonar og fullmektigar.
  I 2023 begynte saksbehandlarane som utf\u00f8rer forunders\u00f8kingane \u00e5 kontakte
  kundane i forkant av s\u00f8ket, for \u00e5 informere om kva vi kan levere, og samtidig
  avklare behova til kundane.\\n\\nDet var ein liten nedgang i talet p\u00e5 utf\u00f8rte
  forunders\u00f8kingar p\u00e5 patentomr\u00e5det fr\u00e5 197 i 2022 til 185 i 2023.
  Dialogs\u00f8k er framleis den typen forunders\u00f8king det er utf\u00f8rt mest
  av (83). Deretter f\u00f8lger nyheitsunders\u00f8king (33) og vurdering av om noko
  kan patenterast (23).\\n\\nPrivatpersonar, sm\u00e5 og mellomstore bedrifter og
  gr\u00fcnderar er ei aukande kundegruppe p\u00e5 dette fagomr\u00e5det \u2013 det
  er fleire nye kundar som har f\u00e5tt utf\u00f8rt berre ei forunders\u00f8king.
  Fullmektigar og andre byr\u00e5 er den kundegruppa som fekk utf\u00f8rt flest forunders\u00f8kingar
  per kunde.\\n\\nDen st\u00f8rste nedgangen i talet p\u00e5 utf\u00f8rte forunders\u00f8kingar
  var p\u00e5 varem\u00e6rkeomr\u00e5det med 646 forunders\u00f8kingar i 2023 i forhold
  til fjor\u00e5ret (807) og 2021 (803). P\u00e5 dette fagomr\u00e5det fekk dei fleste
  sm\u00e5 og mellomstore bedriftene og privatpersonane utf\u00f8rte berre ei forunders\u00f8king,
  medan fullmektigar og advokatfirma er den st\u00f8rste kundegruppa ved at dei f\u00e5r
  utf\u00f8rt fleire forunders\u00f8kingar per kunde. Denne kundegruppa st\u00e5r
  for omtrent 90 prosent av omsetninga av forunders\u00f8kingar p\u00e5 varem\u00e6rke.\\n\\nDet
  blei i 2023 vedteke \u00e5 auke prisane p\u00e5 alle forunders\u00f8kingar med verknad
  fr\u00e5 og med 2024.\\n\\nViking Arm stoppar internasjonale kopistar ved hjelp
  av patent- og varemerkeregistrering\\n\\nViking Arm sel verkt\u00f8y i internasjonale
  marknader og opplever mykke kopiering fr\u00e5 useri\u00f8se akt\u00f8rar. Dei reknar
  det som ei plikt overfor seg sj\u00f8lv og kundane \u00e5 gjere alt dei kan, for
  \u00e5 stoppe dette.\\n\\nViking Arm AS blei stifta for \u00e5 utvikle, produsere
  og selje unike verkt\u00f8y. Etter berre tre \u00e5r p\u00e5 marknaden blir det
  i dag selt ein Viking Arm kvart 6. minutt i 37 land. Selskapet har lykkast fordi
  gr\u00fcnderane var kompromisslause n\u00e5r det gjaldt \u00e5 f\u00e5 fram eit
  produkt av h\u00f8g kvalitet som den profesjonelle handverkaren ville bruke. Firmaet
  forventar vesentleg vekst i \u00e5ra som kjem, ettersom det er store marknader som
  framleis er nesten ur\u00f8rte.\\n\\nGlobale IP-rettar er viktig\\n\\nSj\u00f8lv
  om det er marginale skilnader rundt i verda p\u00e5 korleis ein byggjer, er ein
  Viking Arm like nytig i Japan som i USA eller Noreg. Gr\u00fcnderane visste derfor
  tildel at dei skulle g\u00e5 ut globalt, og at IP-rettar var avgjerande for \u00e5
  kunne gjere dette.\\n\\nDei sette i gang arbeidet med ein patents\u00f8knad p\u00e5
  teknologien og sikring av varemerket. Hemmeleghald meiner dei kan vere ein strategi
  om ein er Coca-Cola. Dei meiner det ikkje nyttar med hemmeleghald n\u00e5r eit teknisk
  produkt skal ut i butikkhyllene.\\n\\nI dag har firmaet to ulike tekniske patent,
  og dei har registrert varemerket i alle viktige land globalt. Dette har dei gjort
  med hjelp fr\u00e5 Zacco patentbyr\u00e5. Dei inns\u00e5g at patentering er eit
  komplekst fagfelt som krev profesjonell hjelp.\\n\\n\u00d8yvind Resch, gr\u00fcnder
  og styreformann i Viking Arm\\n\\n\u2013 Det har vore skremmande \u00e5 sj\u00e5
  i kor stor grad vi har blitt utsette for kopistar fr\u00e5 Kina. Dei har brukt bileta
  v\u00e5re og logoen v\u00e5r i marknadsf\u00f8ringa av kopiar med sv\u00e6rt d\u00e5rlig
  kvalitet.\\n\\n\u2013 Heldigvis har dei s\u00e5 langt ikkje klart \u00e5 lage kopiar
  med god kvalitet, men dei \u00f8ydelegg for oss og kundane v\u00e5re. Vi meiner
  at vi har ei plikt b\u00e5de overfor oss sj\u00f8lv og kundane v\u00e5re til \u00e5
  gjere alt vi kan for \u00e5 stoppe dette.\\n\\n**Rettar vernar, men m\u00e5 ogs\u00e5
  forsvarast**\\n\\nResch fortel vidare at dei med hjelp fr\u00e5 Zacco og andre advokatar
  i USA i stor grad har klart \u00e5 stoppe misbruket av namnet og varemerket, og
  bruken av opphavsrettsverna bilete og film. Det er dei mange mindre seri\u00f8se
  nettbutikkane som sel kopiane, og totalt har Viking Arm teke ned meir enn 4000 slike
  nettsider.\\n\\n\u2013 Vi var sikre p\u00e5 at patenta ville halde dei store, seri\u00f8se
  akt\u00f8rane i bransjen p\u00e5 avstand. Dessverre har vi oppdaga at nokre av dei
  st\u00f8rste merkevareprodusentane i verda er i ferd med \u00e5 lansere produkt
  som etter v\u00e5r meining er i konflikt med patenta v\u00e5re. Vi har sendt ut
  prosessvarsel til dei aktuelle kopistane og legg opp til rettssak i UPC (United
  Patent Court) i f\u00f8rste omgang. Vi m\u00e5 rekn med \u00e5 bruke store summar
  p\u00e5 \u00e5 forsvare oss, avsluttar Resch.\\n\\nSamla tal p\u00e5 patent-, varemerke-
  og designs\u00f8knader fr\u00e5 norske s\u00f8kjavar til utlandet\\n\\nDet samla
  talet p\u00e5 s\u00f8knadar fr\u00e5 norske s\u00f8kjavar til utlandet gjev ein
  indikasjon p\u00e5 IPR-modenskap. I tillegg til talet p\u00e5 patent-, varemerke-
  og designs\u00f8knader fr\u00e5 norske s\u00f8kjavar i Noreg er det derfor ogs\u00e5
  relevant \u00e5 sj\u00e5 p\u00e5 kor mange s\u00f8knadar norske s\u00f8kjavar leverer
  i andre land. I 2022 var talet p\u00e5 s\u00f8knadar fr\u00e5 norske s\u00f8kjavar
  til utlandet (28 714) 6,9 gonger h\u00f8gare enn talet som blei levert av norske
  s\u00f8kjavar til Noreg (4 161).\\n\\nOm vi ser p\u00e5 utviklinga dei siste ti
  \u00e5ra (2013\u20132022), har talet p\u00e5 patents\u00f8knader fr\u00e5 norske
  s\u00f8kjavar til utlandet auka med om lag 7 prosent, varemerkes\u00f8knader har
  auka med heile 82 prosent, medan designs\u00f8knader, som har hatt ein jamn auke
  fram til 2021, har falle med om lag 14 prosent det siste \u00e5ret. Merk at tala
  p\u00e5 s\u00f8knadar om EU-varemerke og EU-design er multipliserte med talet p\u00e5
  land som er omfatta av ordninga, medan europeiske patents\u00f8knader berre er talde
  \u00e9in gong.\\n\\nData for 2023 var ikkje tilgjengelege d\u00e5 \u00e5rssrapporten
  blei utarbeidd. Figuren nedenfor viser utviklinga over tid av det samla talet p\u00e5
  s\u00f8knadar om industrielle rettar til utlandet som er leverte av norske s\u00f8kjavar.
  At talet har auka over tid, tyder p\u00e5 aukande IPR-modenskap.\\n\\nKjelde: WIPO
  Statistics Data Center\\n\\nPatent \u2013 ei unik kjelde til teknisk informasjon\\n\\nN\u00e5r
  vi kj\u00f8per eit hus, sjekkar vi vanlegvis om det er hefte p\u00e5 eigedommen
  for \u00e5 sleppe ubehagelege overraskningar i etterkant. Denne typen systematiske
  kontrollar er ikkje like vanlege n\u00e5r det gjeld immaterielle verdiar. Dei som
  investerer store summar i forsking og utvikling, gl\u00f8ymer ofte \u00e5 underskje
  om teknologien dei vil utvikle, allereie finst, og om andre eig rettane til han.\\n\\nPatent
  gjev ikkje berre eit stort innblikk i eksisterande teknologi. Dei inneheld ogs\u00e5
  viktig informasjon om kven som eig ein teknologi, og kven som er dei viktigaste
  akt\u00f8ran innanfor eit bestemt teknisk fagfelt. Denne informasjonen gjer dermed
  at du kan unng\u00e5 \u00e5 \u00abfinne opp hjulet p\u00e5 nytta\u00bb, og kan i
  tillegg gje deg idear til vidareutvikling av eksisterande teknologi og til \u00e5
  finne nye samarbeidspartnarar.\\n\\nPatentdokument innehold ofte informasjon du
  ikkje finn andre stader. Desse dokumenta m\u00e5 skildre oppfinninga p\u00e5 ein
  slik m\u00e5te at fagfolk p\u00e5 omr\u00e5det kan reprodusera han. Dermed gjev
  dei detaljert informasjon du ikkje finn i klassiske vitskaplege publikasjonar.\\n\\nPatentinformasjon
  er oppdatert. Dei fleste selskap f\u00f8retrekkjer av opplagde konkurransegrunnar
  ikkje \u00e5 opplyse om forskingsresultat. Dersom nokon \u00f8nsker \u00e5 oppn\u00e5
  eksklusive rettar til oppfinninga, m\u00e5 dei likevel levere ein patents\u00f8knad
  som etter kvart blir publisert og gjord tilgjengeleg for allmenta. Dette inneber
  at patentet ofte er den f\u00f8rste publikasjonen om ei bestemt oppfinning, og dermed
  er ei oppdatert kjelde til informasjon om denne teknologien.\\n\\nPatentdokument
  er lett tilgjengelege, og i dag er mange patentdatabasar fritt tilgjengelege p\u00e5
  nettet. Gjennom s\u00f8kjetenesta til Patentstyret finn ein b\u00e5de v\u00e5re
  eigne patentdata og lenkjer til internasjonale basar.\\n\\nRapportering om andre
  f\u00f8ringer og oppdrag i tildelingsbrevet for 2023\\n\\nDesentralisert arbeid\\n\\nPatentstyret
  har mange medarbeidarar som bur i kommunar utanfor Oslo, og vi har \u00e9in medarbeidar
  i utlandet. Likevel fell ingen av dei inn under definisjonen av desentralisert arbeid.
  Vi har lyst ut stillingar med h\u00f8ve til \u00e5 jobbe fr\u00e5 heile landet,
  men det har ikkje gjeve resultat s\u00e5 langt. Patentstyret har ei fleksibel heimekontorl\u00f8ysing
  i dag (inntil 50 prosent) og er opne for \u00e5 halde fram med \u00e5 sj\u00e5 p\u00e5
  desentralisert arbeid der det er tenleg basert p\u00e5 arbeidsoppg\u00e5vene.\\n\\nS\u00f8knadsvegvisarane
  er, s\u00e6rleg p\u00e5 varemerkeomr\u00e5det, ogs\u00e5 ein viktig kanal for mindre
  og mellomstore norske verksemder. Ogs\u00e5 talet p\u00e5 utanlandske kundar aukar
  i s\u00f8knadssingangen, og vi jobbar framleis med \u00e5 gjere EIDAS-sertifisert
  p\u00e5logging og signaturhandlingar tilgjengeleg i ID-porten, slik at dette kan
  nyttast for tenester i Altinn. Sidan om lag 80 prosent av s\u00f8knadene er fr\u00e5
  utanlandske kundar, er dette viktig for vidare digitalisering og effektivisering
  av s\u00f8knadsprosessen.\\n\\nI 2023 utf\u00f8rte Patentstyret ei rekke oppdateringar
  og forbetringar i dei ulike produkta. Av st\u00f8rre ting kan vi nemne h\u00f8vet
  til \u00e5 trekke ei sak p\u00e5 Min konto og lansering av delvis fristfornyning
  i oktober. Patentstyret har ogs\u00e5 f\u00e5tt p\u00e5 plass ny p\u00e5loggingsteneste
  i Identity og innf\u00f8rt nyt CMS (Content Management System) i samband med nye
  nettsider og innf\u00f8ring av ny profil. Dette kjem i tillegg til omskriving av
  eldre applikasjonar, st\u00f8rre systemendringar i lys av ny varemerkelov og klargjering
  for ny infrastruktur f\u00f8r flyttinga til nye lokale p\u00e5 Helsfyr.\\n\\n2023
  var siste prosjekt\u00e5r for midlar fr\u00e5 Digitaliseringsdirektoratet for perioden
  2021\u20132024 for \u00e5 realisere ei st\u00f8rre satsing. I 2023 har Patentstyret
  jobba med realisering av dei resterande produkta i prosjektet, spesielt opp mot
  Nye Altinn, digitale Tidende og opne data. Prosjektet blei avslutta i 2023 og st\u00f8ttar
  opp under ambisjonane i Digital 24 og den nye verksemdsstrategien til Patentstyret.\\n\\nSj\u00e5
  ogs\u00e5 faktaboksen med overskrifta Smart tilgjenge:\\n\\nSmart tilgjenge\\n\\nProsjektet
  har levert ei ny, sikker plattform i skya for integrasjon med Altinn og tenester
  til n\u00e6ringslivet. Nye Altinn blei teken i bruk og integrert med fagsystemet
  til Patentstyret, og dette var starten p\u00e5 arbeidet v\u00e5rt med \u00e5 flytte
  skjemaa over p\u00e5 Nye Altinn. Prosjektet har laga uttrekk av hendingsdata i sanntid
  som grunnlag for opne data som kan brukast av WIPO og felles datakatalog. Ein viktig
  leveranse var ogs\u00e5 ei digital kunngjeringslosyng. Prosjektet har bidrege til
  forsking og utvikling og kompetansebygging ved bruk av ny teknologi. Losyningane
  har allereie f\u00e5tt stor merksemad. I tillegg til \u00e5 bidra til felles offentleg
  infrastruktur og effektivisering for kundar har prosjektet bidrege til at norske
  IPR-data blir meir eksponerte og synlege nasjonalt og internasjonalt.\\n\\nI l\u00f8pet
  av 2023 styrkte vi posisjonen til tenesta \u00abS\u00f8k\u00bb, der akt\u00f8rar
  kan gjere oppslag i rettar. Dette er ein sentral ressurs for informasjon om rettar
  om patent, varemerke og design. Eit brukarengasjement p\u00e5 meir enn 2,7 millionar
  sidevisingar, 335 000 \u00f8kter og 95 000 brukarar viser at tenesta har stor verdi
  for n\u00e6ringslivet. Dette gjeld b\u00e5de for mindre verksemder, sm\u00e5 og
  mellomstore bedrifter og proffkundar som fullmektigar og advokatar. Brukarane av
  tenestene kjem hovudsakleg fr\u00e5 direktetrafikk og organiske s\u00f8k, noko som
  indikerer at mange allereie er kjende med tjenesta eller finn henne gjennom s\u00f8kjemotorar.
  Det ligg eit ytterlegare potensial for bruk ved \u00e5 gjere tenesta kjend for fleire
  akt\u00f8rar i form av opne datasett.\\n\\nSer ein samla sett p\u00e5 tenestene
  v\u00e5re, er s\u00f8k ei prioritera oppg\u00e5ve for kundane v\u00e5re, og det
  er tydeleg at det har stor verdi i dei daglege interaksjonane deira. For \u00e5
  vidareutvikle og forbetre den digitale brukaropplevinga blir det gjennomf\u00f8rt
  kontinuerlege m\u00e5lingar av kor forn\u00f8gde kundane er.\\n\\nPatentlandskapsanalysar\\n\\nPatentstyret
  publiserte patentlandskapsanalysen \u00abHavbruk \u2013 globale trender og muligheter
  for norsk n\u00e6ringsliv\u00bb i 2023 \u2013 sj\u00e5 samandraget nedanfor.\\n\\nHavbruk
  er eit vidt omgrep som kan omfatte mange fagomr\u00e5de, og for \u00e5 avgrense
  omfanget har vi i denne rapporten sett s\u00f8kjelyset p\u00e5 oppdrett av fisk,
  prim\u00e6rt dei artane som er av st\u00f8rst kommersiell interesse for norske akt\u00f8rar.\\n\\nI
  desember 2022 publiserte vi ein patentlandskapsanalyse om karbonfangst, \u00abCarbon
  Capture Technology \u2013 A patent landscape analysis\u00bb, saman med Gassnova.
  Dette samarbeidet blei f\u00f8rt vidare i 2023. Resultata av analysen blei presenterte
  for Gassnova, og Patentstyret heldt fleire kurs for dei om immaterielle rettar og
  god bruk av dei.\\n\\nSamandrag av havbruksanalysen\\n\\nHavbruksn\u00e6ringa har
  tradisjonelt sett ikkje vore veldig opptekne av \u00e5 verne dei immaterielle verdiane
  sine gjennom bruk av patentsystemet. Gjennom \u00e5ra har teknologien i havbruksn\u00e6ringa
  s\u00e5 vel som anlegg og prosessar, f\u00f8r og fiskehelse utvikla seg, og alt
  dette utgjer store verdiar. Samtidig har mange akt\u00f8rar begynt \u00e5 sj\u00e5
  utover eigen heimemarknad og \u00f8nskjer \u00e5 f\u00f8re vidare teknologien sin
  internasjonalt. Dette er faktorar som aukar behovet for kunnskap om immaterielle
  verdiar innanfor havbruksn\u00e6ringa og korleis dei kan vernast, til d\u00f8mes
  gjennom patentsystemet. Dei siste 15 \u00e5ra har talet p\u00e5 patents\u00f8knader
  p\u00e5 havbruksomr\u00e5det auka fr\u00e5 nokre hundreitals til om lag 5 000 \u00e5relag.\\n\\nTil
  liks med dei fleste andre fagomr\u00e5de er patenteringsintensitetten til kinesiske
  akt\u00f8rar langt h\u00f8gare enn for akt\u00f8rar fr\u00e5 andre land. Tala viser
  at berre ein minimal del av desse patenta blir f\u00f8rt vidare utover dei kinesiske
  grensene. Dette vil seie at det berre er eit f\u00e5tal av dei kinesiske patenta
  som er av kommersiell interesse for internasjonale akt\u00f8rar. Vi har i denne
  analysen derfor hovudsakleg sett p\u00e5 trendane til patent med internasjonale
  familiemedlemmer, alts\u00e5 patent som er f\u00f8rt vidare til minst eitt land
  utover opphavslandet, for \u00e5 synleggjere dei kommersielt sett viktigaste patenta.\\n\\nRapporten
  viser at s\u00f8knader med europeisk eller amerikansk opphav er meir internasjonalt
  fokuserte enn s\u00f8knader av asiatisk opphav. N\u00e5r vi ser p\u00e5 talet p\u00e5
  patent med internasjonale familiemedlemmer i havbruksn\u00e6ringa, er det berre
  USA og S\u00f8r-Korea som f\u00e5r inn fleire patents\u00f8knader enn Noreg.\\n\\nFordi
  Noreg er den st\u00f8rste oppdrettsprodusenten og eksport\u00f8ren av atlantisk
  laks og regnbogeaure i verda, er det viktig at akt\u00f8rane i n\u00e6ringa ogs\u00e5
  tek vare p\u00e5 dei immaterielle verdiane sine, b\u00e5de i Noreg og internasjonalt.
  Ei rekke akt\u00f8rar har innsett verdien av dette, men det er framleis stort potensial
  for \u00e5 auke medvitet hos mange av akt\u00f8rane i norsk havbruksn\u00e6ring
  slik at ogs\u00e5 dei blir betre rusta n\u00e5r dei skal ut p\u00e5 den globale
  marknaden med produkta og prosessane sine. Med ein gjennomarbeidd strategi rundt
  hantering av immaterielle verdiar vil ei bedrift kunne oppn\u00e5 viktige og varige
  konkurransefordelar, og korrekt bruk av desse rettane vil d\u00e5 vere like viktig
  for kommersiell suksess som finansiering, marknadsf\u00f8ring og sal.\\n\\nAnalysen
  var spesielt retta mot fiskevelferd, milj\u00f8 og kunstig intelligens. Heile rapporten
  blir presentert for bransjen utover i 2024, og han blir gjord offentleg tilgjengeleg.\\n\\nAndre
  omr\u00e5de Patentstyret har ansvar for\\n\\nKlager p\u00e5 f\u00f8retaksnamn\\n\\nDersom
  nokon meiner at eit f\u00f8retak som er registrert i F\u00f8retaksregisteret i Br\u00f8nn\u00f8ysund,
  krenkjer rettane deira etter f\u00f8retaksnamnelova, kan dei krevje at registreringa
  blir oppheva ved administrativ overpr\u00f8ving. Dei fleste av krava g\u00e5r ut
  p\u00e5 at nokon meiner at eit registrert f\u00f8retaksnamn er eigna til forveksling
  med ein eldre rett til eit varemerke eller f\u00f8retaksnamn, og at f\u00f8retaksnamnet
  derfor er registrert i strid med f\u00f8retaksnamnelova. Patentstyret fekk inn 25
  krav om administrativ overpr\u00f8ving av registrerte f\u00f8retaksnamn i 2023.
  I 2023 blei 30 krav avgjorde.\\n\\nRepresentere Noreg i internasjonale m\u00f8te
  p\u00e5 immaterialrettsomr\u00e5det\\n\\nPatentstyret representerer Noreg i fleire
  internasjonale m\u00f8te p\u00e5 omr\u00e5det immaterialrett. I forkant blir norske
  posisjonar avklarte med dei ansvarlege departementa.\\n\\nPatentstyret rapporterer
  til departementa i vesentlege saker.\\n\\nPatentstyret bidreg i regelverksarbeid
  innanfor industrielle rettar og st\u00f8ttar ulike departement i sp\u00f8rsm\u00e5l
  om IPR.\\n\\nWorld Intellectual Property Organization (WIPO)\\nPatentstyret representerte
  i 2023 Noreg p\u00e5 generalforsamlingane i WIPO og i underliggjande komitear i
  organisasjonen p\u00e5 omr\u00e5det for industrielt rettsvern. Patentstyret deltek
  jamleg i fleire faste komitear: system for klassifisering av oppfinningar for atfinning
  i seinare gransking av nye oppfinningar, klassifisering av varer og tenester for
  s\u00f8knader om varemerkevern, patentlovlomiteen, varemerke- og designkomiteen
  og komiteane for dei internasjonale s\u00f8knadsordningane for patent, varemerke
  og design.\\n\\nEuropean Patent Organisation (EPO)\\nPatentstyret representerer
  Noreg i forvaltningsr\u00e5det for Den europeiske patentorganisasjonen (EPO) og
  i underliggjande komitear. I 2023 deltok Patentstyret p\u00e5 m\u00f8te i forvaltningsr\u00e5det,
  m\u00f8te i budsjett- og finanskomiteen, patentlovlomiteen og i teknisk/operasjonell
  komit\u00e9.\\n\\nSamarbeidet mellom EPO og medlemslanda i dei faste komiteane er
  supplert av eit omfattande samarbeid i det s\u00e5kalla europeiske patentnettverket
  (European Patent Network, EPN).\\n\\nEuropean Union Intellectual Property Office
  (EUIPO)\\nDet er viktig for n\u00e6ringslivet at dette rettsomr\u00e5det er f\u00f8reseileg.
  For \u00e5 oppn\u00e5 dette m\u00e5 ein bruke det same regelverket og praktisere
  det p\u00e5 same m\u00e5ten i dei ulike landa. P\u00e5 design- og varemerkeomr\u00e5det
  tek derfor Patentstyret aktivt del i m\u00f8te i EUIPO og tilpassingsprogrammet
  i EUIPO. Gjennom dette programmet samarbeider landa for \u00e5 gjere saksbehandlingspraksis
  i EUIPO og i dei europeiske varemerke- og designstyresmaktene meir heilskapleg.
  EUIPO er ogs\u00e5 ansvarleg for observatoriet mot inngrep i immaterielle rettar.
  Patentstyret tek del i m\u00f8te i observatoriet og deler informasjon i styresmaktsnettverket
  og p\u00e5 nettstaden Velgekte.no.\\n\\nEU og EFTA\\nPatentstyret har ogs\u00e5
  i 2023 teke del i EFTA/E\u00d8S-arbeidet innanfor industrielt rettsvern. Patentstyret
  har delteke p\u00e5 m\u00f8te i spesialutvalet for immaterialrett og i arbeidsgruppa
  for immaterialrett i Brussel, som m\u00f8ter EU-kommisjonen. I enkelte tilfelle
  har Patentstyret\\n\\nogs\u00e5 delteke i arbeidsgruppa for IPR-regelverk i EU-kommisjonen
  (GIPP). Etter oppmoding fr\u00e5 N\u00e6rings- og fiskeridepartementet har Patentstyret
  teke del b\u00e5de i f\u00f8rebuingane til og i delegasjonen ved ei rekke frihandelsforhandlingsrundar
  i EFTA-regi om s\u00e6rskilde vedlegg om vern av immaterialrett (Chile, Kosovo,
  Malaysia, Mercosur, Moldova, Thailand og Vietnam).\\n\\nNordisk Patentinstitutt
  (NPI)\\nNoreg er partnar i Nordisk Patentinstitutt saman med Danmark og Island.
  NPI har to hovudaktivitetar:\\n\\n\u2022 behandling av PCT-s\u00f8knader som eit
  av PCT-organa i WIPO\\n\u2022 oppdrag med s\u00f8k i patentlitteratur og annan litteratur
  for det internasjonale n\u00e6ringslivet\\n\\nNPI har ein eigen stab med ansvar
  for administrasjon, sal og kontakt med WIPO. Saksbehandlarar i Patent- og Varem\u00e6rkestyrelsen
  (PVS) i Danmark og Patentstyret i Noreg utf\u00f8rer oppdrag, gransking og IPR-fagleg
  harmonisering og kvalitetssikring p\u00e5 vegner av NPI.\\n\\nNPI behandlar PCT-s\u00f8knader
  fr\u00e5 norske, danske og islandske s\u00f8karar. Dei fleste PCT-s\u00f8knader
  som Patentstyret behandlar, er fr\u00e5 norske firma som vil sikre teknologien sin
  i eksportmarknadenene. NPI fungerer dermed etter f\u00f8rem\u00e5let, som er \u00e5
  levera tenester av god kvalitet som eit \u00ablokalt\u00bb PCT-organ.\\n\\nNPI utf\u00f8rer
  ogs\u00e5 timebetalte oppdrag med s\u00f8k i patentlitteratur og annan litteratur
  for det internasjonale n\u00e6ringslivet. Dette liknar p\u00e5 forunders\u00f8kingane
  som Patentstyret utf\u00f8rer for norske og utanlandske kundar. Den st\u00f8rste
  kunde gruppa er europeiske advokatfirma, men NPI leverer ogs\u00e5 mykje til europeiske
  konsern. Det er ogs\u00e5 store leveransar til advokatfirma og konsern i USA. NPI
  er internasjonalt kjent som ein leverand\u00f8r med h\u00f8g kvalitet.\\n\\nBehandlinga
  av PCT-s\u00f8knader og NPI-oppdrag er fagleg sv\u00e6rt lik behandlinga av nasjonale
  patent s\u00f8knader. Det er derfor stor synergieffekt mellom desse aktivitetane
  og oppg\u00e5ver vi utf\u00f8rer som nasjonal styresmakt. Vi utf\u00f8rer internasjonale
  oppdrag p\u00e5 tekniske fagomr\u00e5de med mindre norsk aktivitet. Patentstyret
  skal etter lova kunne behandle patents\u00f8knader til Noreg p\u00e5 alle tekniske
  fagfelt, s\u00e5 dei internasjonale oppdraga bidreg etter f\u00f8rem\u00e5let til
  \u00e5 sikre fagleg kvalitet p\u00e5 alle fagfelt. Arbeidet med det internasjonale
  n\u00e6ringslivet gjev i tillegg Patentstyret viktig erfaring og kunnskap b\u00e5de
  om s\u00f8kjestrategi, kundeoppf\u00f8lging og korleis det internasjonale n\u00e6ringslivet
  brukar patent og patentinformasjon i forretningsstrategien sin. Denne erfaringa
  kjem igjen det norske n\u00e6ringslivet til gode gjennom informasjonsarbeidet v\u00e5rt
  til dei.\\n\\nPCT-s\u00f8knader \u2013 internasjonal fase\\nI 2023 fekk Patentstyret
  inn gjennom NPI 126 PCT-s\u00f8knader, mot 189 i 2022. \u00c5rsaka til nedgangen
  er f\u00f8rebels ukjend, fordi han skjedde utover hausten 2023.\\n\\nBehandling
  av PCT-s\u00f8knader for NPI er ein del av oppg\u00e5vene til Patentstyret. I motsetnad
  til behandlinga av nasjonale patentsaker er behandlinga av PCT-s\u00f8knader underfinansiert
  fordi s\u00f8knadsgebyra, som blir fastsette av WIPO, ikkje dekkjer dei faktiske
  kostnadene for s\u00f8knadsbehandlinga. Det \u00f8konomiske resultatet for PCT viser
  derfor eit underskot p\u00e5 2 562 824 kroner for 2023.\\n\\nS\u00f8kjeoppdrag for
  internasjonale kundar\\nI 2023 fekk Patentstyret 7 254 978 kroner i inntekt for
  NPI-oppdrag, ein auke p\u00e5 3 612 662 kroner fr\u00e5 2022. Det \u00f8konomiske
  resultatet for NPI-oppdrag viser eit overskot p\u00e5 1 148 409 kroner for 2023.
  Dette er i tr\u00e5d med intensjonen v\u00e5r om \u00e5 auke arbeidet med internasjonale
  oppdrag. Den store auken skriv seg dels fr\u00e5 auka aktivitet i NPI og dels fr\u00e5
  kronekursen, fordi oppdraga blir fakturete i EUR/USD. Vi forventar eit h\u00f8gt
  aktivitetsniv\u00e5 ogs\u00e5 i 2024, men historisk har omsetnaden i NPI variert
  mykje over tid.\\n\\n| Resultat per produkt | 2023       |\\n|----------------------|------------|\\n|
  **NPI**              |            |\\n| Inntekt              | 7 254 978  |\\n|
  Saksbehandlarkostnader| 3 972 372  |\\n| Databasekostnader    | 963 570    |\\n|
  Administrative kostnader | 2 926     |\\n| Overhead             | 1 167 700  |\\n|
  **Resultat BS**      | 1 148 409  |\\n| **PCT**              |            |\\n|
  Inntekt              | 1 154 626  |\\n| Saksbehandlarkostnader| 3 513 089  |\\n|
  Databasekostnader    | 201 436    |\\n| Administrative kostnader | 2 926     |\\n|
  **Resultat PCT**     | -2 562 824 |\\n\\nTilsynsstyresmakt for kollektiv forvaltning
  av rettar / godkjenning av avtalelisensutl\u00f8ysande organisasjonar\\n\\nEtter
  *lov om kollektiv forvaltning av opphavsrett og n\u00e6rst\u00e5ende retth\u00f8gder*
  er Patentstyret *tilsynsstyresmakt* for organisasjonar og einingar som kollektivt
  forvaltar opphavsrett og n\u00e6rst\u00e5ende rettar, inkludert medlemsorganisasjonar
  av ein kollektiv forvaltningsorganisasjon som fordeler og betalar ut vederlag for
  rettar.\\n\\nPatentstyret er ogs\u00e5 *godkjenningsorgan* for organisasjonar som
  s\u00f8kjer om \u00e5 inng\u00e5 avtale med avtalelisensverknad etter \u00e5ndsverklova.\\n\\n*Lov
  om kollektiv forvaltning av opphavsrett og n\u00e6rst\u00e5ende retth\u00f8gder*
  gjennomf\u00f8rer EU-direktiv om kollektiv forvaltning av rettar i norsk rett og
  skal styrke stillinga til rettshavarane der dei har overlate forvaltninga av rettane
  sine til ein kollektiv forvaltningsorganisasjon, sikre brukarar av opphavsrettar
  og forenkle lisensiering av musikkrettar for fleire territorium. Organisasjonar
  som driv aktivitet som er omfatta av tilsynet, har plikt til \u00e5 registrere seg
  hos Patentstyret. Per 31. desember 2023 omfatta registeret til Patentstyret av 38
  registrerte organisasjonar og einingar, og 5 av dei blei registrerte i l\u00f8pet
  av \u00e5ret.\\n\\nGjennom tilsynsrolla skal Patentstyret f\u00f8re tilsyn med at
  f\u00f8resegnene i lova blir haldne, og at rettar blir forvalta p\u00e5 ein effektiv,
  tryggaande og open m\u00e5te. Patentstyret kan gje organisasjonar p\u00e5legg om
  \u00e5 rette forhold, skrive ut gebyr for brot og p\u00e5leggje tvangsmulkt, men
  prioriterer sj\u00f8lv arbeidet sitt og er ikkje pliktige til \u00e5 gripe inn ved
  alle tilfelle av brot. Klagenemnda for mediesaker (Medieklagenemnda) er klageinstans
  for avgjerder fr\u00e5 Patentstyret.\\n\\nPatentstyret fekk ingen formelle klager
  fr\u00e5 retts-havarar eller andre i 2023, men svarte p\u00e5 andre f\u00f8respurnader
  og gjennomf\u00f8rte m\u00f8te med Medieklagenemnda, Kulturdepartementet og andre
  nordiske tilsynsstyresmakter. Patentstyret deltok p\u00e5 bransjearenaer som det
  \u00e5rlege opphavsrettskurset og BY: LARM.\\n\\nP\u00e5 avtalelisensomr\u00e5det
  fekk Patentstyret inn fire s\u00f8knader i 2023, og behandle to av dei.\\n\\nPatentstyret
  leverte i 2023 to klagesaker til Medieklagenemnda.\\n\\nDel 4\\nStyring og kontroll\\n\\nReg.nr.
  087272\\n\\nVurdering av styring og kontroll\\n\\nPatentstyret nyttar m\u00e5l-
  og resultatstyring som grunnleggjande styringsprinsipp. Vi meiner at Patentstyret
  har god styring og kontroll, og at den samla m\u00e5loppn\u00e5inga er god. P\u00e5
  bakgrunn av eksterne og interne kontrollar har Patentstyret i 2023 utarbeidd forbetringstiltak
  p\u00e5 ulike omr\u00e5de av verksemda og f\u00f8lgjer opp dette som ein integrert
  del av verksemdsstyringa. Patentstyret brukar kundeunders\u00f8kinga og brukardialog
  jamleg for \u00e5 betre og tilpasse tenestene v\u00e5re ut fr\u00e5 behova til dei
  ulike kundegruppene.\\n\\nGod internkontroll og risikostyring er ein integrert del
  av verksemdsstyringa for \u00e5 sikre m\u00e5loppn\u00e5ing, effektiv drift og p\u00e5litleg
  \u00f8konomiforvaltning, og at Patentstyret held lover og reglar. Kontrollen av
  korleis Patentstyret s\u00f8rger for behandling av patent-, varemerke- og designs\u00f8knader,
  kursverksemd, forunders\u00f8kingar og kundesenter, skjer gjennom eit kvalitetstyringssystem,
  og Patentstyret er sertifiserte etter ISO 9001:2015. I tillegg er det etablert internkontroll
  for innkj\u00f8p og \u00f8konomi, tryggleik, graderte patent og HMS-omr\u00e5det.\\n\\nTryggleik
  og beredskap\\n\\nI l\u00f8pet av 2023 f\u00f8rte Patentstyret vidare arbeidet med
  \u00e5 styrke cybertryggleiken. I \u00abNasjonalt digitalt riskobilde 2023\u00bb
  peikar Nasjonalt tryggingssorgan (NSM) p\u00e5 at det digitale cyberriskobiletet
  er meir usikkert enn nokon gong tidlegare. Dette skriv seg fr\u00e5 aukande profesjonalisering
  av cyberangrep, den raske utviklinga innanfor kunstig intelligens og den tryggingspolitisk
  forverra situasjonen. Som offentleg forvaltningsorgan i ein spesielt utsett sektor
  merka Patentstyret ogs\u00e5 i fjor ein auke i talet p\u00e5 fors\u00f8k p\u00e5
  kompromitteringar og m\u00e5lretta angrep.\\n\\nArbeidet med \u00e5 styrke tryggleiken
  er forankra i tryggingsforumet til leiinga (LSF), som er sentralt i tryggleiksstyringa
  i Patentstyret, i tillegg til jamlege orienteringar i leiargruppa. LSF har ogs\u00e5
  ansvaret for kontinuitetsplanen til Patentstyret og kontinuerlege vurderingar om
  risiko ved h\u00f8gt personellfr\u00e5v\u00e6r. Det er ikkje blitt avdekt spesielt
  urovekkjande forhold i 2023 som har f\u00f8rt til at Patentstyret har m\u00e5tta
  omdisponere personell for \u00e5 ta hand om kritiske funksjonar.\\n\\nEtter penetrasjonstesten
  som blei gjennomf\u00f8rt i 2023, identifiserte Patentstyret enkelte tryggleiksutfordringar
  som kravde spesifikk merksemd innanfor IT-milj\u00f8et v\u00e5rt. Vidare blei det
  gjennomf\u00f8rt skanningar av s\u00e5rbare punkt i systema v\u00e5re, og mange
  slike punkt er tetta.\\n\\nI tillegg til \u00e5 lukke tryggleiksh\u00f8l har Patentstyret
  gjennomf\u00f8rt tiltak basert p\u00e5 det overordna tryggingsrammeverket v\u00e5rt
  fr\u00e5 NSM. Dette tryggingsrammeverket s\u00f8rjer for ei strategisk og risikobasert
  styring av informasjonstryggleiken. Operasjonelle tiltak som er spesielt verde \u00e5
  nemne, er aukande bruk av tryggleikstenester i skya, som innf\u00f8ring av Defender
  for Identity og aukande bruk av Defender for Cloud. Det er etablert ny plan for
  hendingsrespons, vi jobbar med utskifting av proxyserverane v\u00e5re, og vi skal
  kj\u00f8pe inn programvare som kartlegg einingar og programvare. I samband med flytting
  til nye lokale byter vi ut all nettverksinfrastruktur til nye produkt. Dette vil
  auke tryggleiken p\u00e5 grunn av betre administrativ oversikt, oppdaterte produkt
  og full gjennomgang av heile nettverksoppsettet.\\n\\nOppl\u00e6ring av tilsette
  og tiltak for \u00e5 auka medvitet deira om problemstillingane har vore og vil framleis
  vere h\u00f8gt prioritera. Arbeidet har omfatta ei l\u00e6ringstreise gjennom NanoLearning,
  phishing-simulering, presentasjonar p\u00e5 alle niv\u00e5 i organisasjonen og utforming
  av bruksrettleiingar, i tillegg til l\u00e6ringstreiser i samarbeid med Digital
  Norway. I 2023 blei det ogs\u00e5 tilsett ein ny tryggleiksr\u00e5dgjevar som s\u00f8rger
  for \u00e5 drive tryggleksarbeidet framover. Hovuddelen av informasjonen Patentstyret
  handterer i s\u00f8knadsbehandlinga, er offentleg og digitalt s\u00f8kbar, med nokre
  unntak. Hovudsakleg gjeld det innhald i f\u00f8rstes\u00f8knader om patent. Det
  same gjeld forunders\u00f8kingar vi utf\u00f8rer for norske kundar, og NPI-oppdrag
  for utanlandske kundar. Etter v\u00e5r vurdering er framleis den st\u00f8rste risikoen
  for Patentstyret at konfidensiell informasjon om utf\u00f8ringa av desse tenestene
  kjem p\u00e5 avvegar, eller at informasjonen i registera v\u00e5re g\u00e5r tapt.
  Tryggingstiltaka v\u00e5re tek omsyn til dette trusselbiletet.\\n\\nPatentstyret
  vurderer tryggleiken p\u00e5 IKT-omr\u00e5det som god, trass i eit stadig endra
  trusselbilete med aukande omfang av cyberangrep med ein tryggingspolitisk situasjon
  i endring.\\n\\nGraderte patent\\n\\nPatentstyret fell inn under tryggingslova gjennom
  at vi handterer graderte patent. Det er ikkje rapportert om u\u00f8nskte hendingar
  i 2023. Aktiviteten er p\u00e5 eit l\u00e5gt niv\u00e5. Det har i 2023 vore nokre
  justeringar i arbeidet opp mot fullmektiig.\\n\\nPersonvern\\n\\nM\u00e5let i 2023
  har vore \u00e5 heve den organisatoriske modenskapen p\u00e5 personvernfeltet, ved
  \u00e5 g\u00e5 gjennom behandlingsoversikta, organiseringa, rutinar og dokumentasjon.
  Oppl\u00e6ring og auka medvitt om temaet har vi prim\u00e6rt oppn\u00e5dd gjennom
  internt arbeid med dokumentasjon.\\n\\nBerekraftsm\u00e5la til FN\\n\\nKlima- og
  berekraftsarbeidet til Patentstyret er forankra i strategien til verksemda og dei
  overordna m\u00e5la v\u00e5re om \u00e5 skape verdi for kundane, samfunnet og medarbeidarane.\\n\\nDet
  var eit av dei prioriterte omr\u00e5da til Patentstyret i 2023 \u00e5 kartlegge
  og setje i verk tiltak for \u00e5 bidra ytterlegare til auka berekraft og gr\u00f8n
  omstilling i Patentstyret som verksemd og i det norske n\u00e6ringslivet.\\n\\nFigur
  14 viser dei berekraftsm\u00e5la der IPR og Patentstyret kan yte st\u00f8rst bidrag.
  I tillegg kan IPR, tenestene Patentstyret tilbyr, og drifta v\u00e5r ogs\u00e5 yte
  eit bidrag til mange av dei andre berekraftsm\u00e5la.\\n\\nOmlegging til gr\u00f8nare
  teknologi og milj\u00f8venlege produkt er avhengig av l\u00f8nsemd. Innovasjon kan
  vere b\u00e5de milj\u00f8venleg og milj\u00f8skadeleg, og her er det internasjonale
  IPR-regelverket p\u00e5 mange m\u00e5tar kliman\u00f8ytralt. Sj\u00f8lv om Patentstyret
  tildeler rettar til alle typar teknologi, er interessa for milj\u00f8venleg produkt
  og teknologi helt ned p\u00e5 konsumentniv\u00e5 s\u00e5 sterk at ho p\u00e5virkar
  innovasjonsretninga p\u00e5 viktige omr\u00e5de. Her er IPR-systemet ein motivasjonsfaktor,
  og Patentstyret er ein tilretteleggjar for milj\u00f8venleg teknologi.\\n\\nI 2023
  blei det gjennomf\u00f8rt ei kartlegging av arbeidet til andre IP-styresmakter innanfor
  gr\u00f8n omstilling og berekraft, for \u00e5 hente inspirasjon og l\u00e6ring.
  Hausten 2023 heldt vi fram arbeidet med \u00e5 finne nye omr\u00e5de og aktivitetar
  der Patentstyret kan bidra til gr\u00f8n omstilling og berekraft i n\u00e6ringslivet.
  Rapporten fr\u00e5 Milj\u00f8direktoratet av 6. februar 2023 om \u00abKlimatiltak
  i Norge mot 2030\u00bb var eit viktig underlag i dette arbeidet. Rapporten gav eit
  betre kunnskapsgrunnlag for \u00e5 rette inn tiltak mot dei omr\u00e5da som ein
  reknar med at vil ha st\u00f8rst positiv effekt p\u00e5 milj\u00f8et.\\n\\nI 2023
  la Patentstyret s\u00e6rlig vekt p\u00e5 f\u00f8rebuingar og innkj\u00f8p i samband
  med flyttinga til nye lokale, med mellom anna eit meir klimavenleg bygg, vesentleg
  gjenbruksgrad av m\u00f8blar og inventar, og fjerning av parkeringsplassar. Dette
  vil vere eit viktig bidrag n\u00e5r det gjeld interne klimatiltak som st\u00f8ttar
  opp under berekraftsm\u00e5l nr. 12, og det vil ha heil\u00e5rseffekt fr\u00e5 2025.\\n\\nP\u00e5
  kursomr\u00e5det blei det i 2023 vedteke \u00e5 digitalisere kursopplegg og f\u00f8redrag.
  Dette vil gradvis gjere dei meir tilgjengelege og bidra til mindre reising for f\u00f8redragshaldarane
  og kursdeltakarane til Patentstyret.\\n\\nI tillegg til dette gjekk vi gjennom alle
  tenester for \u00e5 starte kartlegginga av berekraftspotensialet i dei. Patentstyret
  \u00f8nskjer \u00e5 gjennomf\u00f8re aktivitetar med sikte p\u00e5 \u00e5 auke bidraget
  til gr\u00f8n omstilling og berekraft i n\u00e6ringslivet. Med utgangspunkt i klima-
  og berekraftsarbeidet i 2023 skal det gjennomf\u00f8rast ein dobbel analyse av kva
  som er vesentleg for oss, med p\u00e5f\u00f8lgjande tiltak p\u00e5 dei aktuelle
  tenesteomr\u00e5da.\\n\\nMilj\u00f8fyrt\u00e5rn\\n\\nPatentstyret er sertifisert
  som Milj\u00f8fyrt\u00e5rn-bedrift, blei resertifisert s\u00e5 seint som hausten
  2023 og har m\u00e5lt eigne klimagassutslepp sidan 2010.\\n\\nSamla sett har klimagassutsleppa
  til Patentstyret falle med 26 prosent sidan 2010. M\u00e5let om eit kutt i klimagassutsleppa
  p\u00e5 55 prosent innan 2030 gj\u00f8r at vi m\u00e5 redusere utslippet med ytterlegare
  29 prosentpoeng, til 115 tonn. Dette arbeidet st\u00f8ttar opp under berekraftsm\u00e5l
  nr. 13 om \u00e5 stoppe klimaendringane.\\n\\nArbeidslivskriminalitet\\n\\nSom innkj\u00f8par
  f\u00f8lgjer Patentstyret sertifiseringsordninga for offentlege innkj\u00f8p (SOA
  B\u00e6rekraft). Det bidreg til \u00e5 motverke arbeidslivskriminalitet og er eit
  bidrag til b\u00e5de berekraftsm\u00e5l nr. 8 om anstendig arbeid og \u00f8konomisk
  vekst og nr. 12 om ansvarleg forbruk og produksjon. Patentstyret har definert ansvaret
  gjennom skriftlege rutinar som den innkj\u00f8psansvarlege og avtaleeigaren kj\u00e4nner
  til. Ved innkj\u00f8p av tenester vurderer vi om innkj\u00f8pet involverer bransjar
  med h\u00f8g risiko for arbeidslivskriminalitet.\\n\\nRutinane for \u00e5 motverke
  arbeidskriminalitet omfattar alle fasar av innkj\u00f8psprosessen, b\u00e5de planlegging,
  sj\u00f8lv\u00e9 konkurranse og oppf\u00f8lginga med den valde leverand\u00f8ren.
  I kontraktperioden gjennomf\u00f8rer vi forskriftsmessig kontroll av relevant dokumentasjon
  fr\u00e5 leverand\u00f8rene. I 2023 blei spesielt l\u00f8n, arbeidsavtalar og arbeidstid
  kontrollert ut fr\u00e5 eigne rutinar. Patentstyret avdekte ikkje nokon forhold
  som var relaterte til arbeidslivskriminalitet i 2023, og krava v\u00e5re til underleverand\u00f8rene
  var eit bidrag til \u00e5 n\u00e5 berekraftsm\u00e5l nr. 8 og 12.\\n\\nLikestilling,
  mangfald og inkluderingsdugnaden til regjeringa\\n\\nPatentstyret har f\u00f8rt
  vidare arbeidet med mangfald og likestilling i 2023. M\u00e5let er \u00e5 fremje
  likestilling og hindre diskriminering p\u00e5 grunn av etnisitet, kj\u00f8nn, alder
  eller nedsett funksjonsevne. Arbeidsmilj\u00f8et blir unders\u00f8kt \u00e5rleg,
  og unders\u00f8kinga i 2023 gav ingen indikasjon p\u00e5 at det skjer diskriminering
  i Patentstyret.\\n\\n56,5 prosent av dei tilsette i Patentstyret er kvinner, og
  st\u00f8rst kvinneverrepresentasjon har vi blant seniorkonsulentar, r\u00e5dgjevarar,
  seniorr\u00e5dgjevarar og seksjonssjefar. Kvinnedelen blant leirarar er 56 prosent,
  og Patentstyret innfriir dermed kravet fr\u00e5 staten om minimum 40 prosent.\\n\\nGjennomsnittleg
  l\u00f8n for menn er noko h\u00f8gare enn for kvinner i dei fleste stillingskodane.
  Patentstyret er spesielt merksamme p\u00e5 dette forholdet i lokale l\u00f8nsforhandlingar
  og ber leiaran\u0435 spesielt vurdere om eventuelle skeive tal kan knyttast til
  kj\u00f8nn.\\n\\nEtiske retningslinjer\\n\\nFor \u00e5 bidra til at Patentstyret
  blir drive i samsvar med dei lovene og reglane som gjeld, inkludert krav til god
  forvaltningskikk, habilitet og etisk \u00e5tferd, blir tema som gjeld dei etiske
  retningslinjene for statstenesta, stadig diskuterte i ulike forum. Dei etiske retningslinjene
  er ogs\u00e5 ein integrert del av introduksjonsprogrammet for nytilsette i Patentstyret.\\n\\n|
