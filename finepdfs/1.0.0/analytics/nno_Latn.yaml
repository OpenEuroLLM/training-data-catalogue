  210 865                            |\\n\\n### Forklaring til bruk av budsjettfullmakter\\n\\n**Mottekne
  belastningsfullmakter (gjeld for b\u00e5de utgiftskapittel og inntektskapittel)**\\n\\nKlagenemnda
  for industrielle rettar skal inntektsf\u00f8re klagegebyr p\u00e5 kapittel/post
  3936.01. Patentstyret har fullmakt til \u00e5 fakturere og drive inn klagegebyra
  i samband med mottak av klage ved direkte inntektsf\u00f8ring p\u00e5 kapittel/post
  3936.01.\\n\\nPatentstyret har f\u00e5tt ei belastningsfullmakt fr\u00e5 Digitaliseringsdirektoratet
  (Digdir) for kapittel/post 0540.25 p\u00e5 5 070 505 kroner i 2023. Belastningsfullmakta
  gjeld medfinansieringsordning for digitaliseringsprosjekt: Smart tilgjenge, datadeling
  og sj\u00f8lvbetening i Altinn 3.0. Belastningsfullmakta gjeld for \u00e5ra 2021,
  2022 og 2023.\\n\\n**Fullmakt til \u00e5 overskride driftsl\u00f8yvingar mot tilsvarande
  meirinntekter**\\n\\nPatentstyret har fullmakt til \u00e5 overskride l\u00f8yvingar
  under kapittel/post 093501 mot tilsvarande meirinntekter under kapittel/post 3935.04.
  Meirinntekter og eventuelle mindreinntekter blir tekne med i utrekninga av overf\u00f8ring
  av ubrukt l\u00f8yving neste \u00e5r.\\n\\n**Fullmakt til \u00e5 overskride driftsl\u00f8yvingar
  til investeringsf\u00f8rem\u00e5l mot tilsvarande innsparing i dei fem f\u00f8lgjande
  budsjett\u00e5ra**\\n\\nPatentstyret har i 2023 ikkje brukt investeringsfullmakta.\\n\\n**Mogleg
  overf\u00f8rbart bel\u00f8p**\\n\\nPatentstyret har ubrukt l\u00f8yving p\u00e5
