  |\\n| Talet p\u00e5 registrerte varemerke og fellesmerke som er i kraft   | 224
  082| 231 574| 236 535| 240 469| 245 970|\\n\\nBehandlingstid for varemerke\\n\\nVi
  m\u00e5ler gjennomsnittleg saksbehandlingstid fr\u00e5 s\u00f8knaden blir levert,
  til s\u00f8kjaren f\u00e5r eit svarbrev eller ei registrering fr\u00e5 Patentstyret.
  I 2023 hadde Patentstyret som m\u00e5l \u00e5 starte behandlinga av ein nasjonal
  varemerkes\u00f8knad, eller registrere merket, i l\u00f8pet av gjennomsnittleg fem
  m\u00e5nader. Vi fekk inn om lag 6 000 nasjonale varemerkes\u00f8knader, som blei
  behandla i l\u00f8pet av gjennomsnittleg 2,6 m\u00e5nader (2,1 m\u00e5nader i 2022).
  Av desse s\u00f8knadene blei 31 prosent (39 prosent i 2022) behandla i l\u00f8pet
  av tre veker og 37 prosent (56 prosent i 2022) i l\u00f8pet av seks veker.\\n\\nVi
  har samanlikna behandlingstidene til Patentstyret med tilsvarande organ i dei nordiske
  og baltiske landa i 2023. Samanlikninga viser at dei nordiske og baltiske landa
  hadde ei gjennomsnittleg behandlingstid i nasjonale s\u00f8knader p\u00e5 mellom
  4 og 8 veker, medan Patentstyret d\u00e5 hadde ei gjennomsnittleg behandlingstid
  p\u00e5 om lag 20 veker.\\n\\nI dei internasjonale utpeikingane som Patentstyret
  f\u00e5r fr\u00e5 WIPO (Madridprotokollen), var det eit m\u00e5l \u00e5 starte behandlinga
  i l\u00f8pet av 10 m\u00e5nader. Desse sakene blei behandla i l\u00f8pet av gjennomsnittleg
  8,3 m\u00e5nader (7,9 m\u00e5nader i 2022). Her varierte dei nordisk-baltiske behandlingstidene
  fr\u00e5 \u00e9in til elleve m\u00e5nader i 2023. Vi minner om at medan alle EU-landa
  hadde ein inngang p\u00e5 mellom 700 og 1500 utpeikningar i 2021, hadde Patentstyret
  ein inngang p\u00e5 10 000 utpeikningar.\\n\\nLengre behandlingstid p\u00e5 varemerke
  kjem av at vi hadde stor gjennomtrekk i 2022 og ikkje tilsette nokon i 2023. Det
  f\u00f8rte til at vi hadde underkapasitet til \u00e5 handle den h\u00f8ge inngangen
  av s\u00f8knader fr\u00e5 2022.\\n\\nEi varemerkeregistrering i Noreg kan skje p\u00e5
  to m\u00e5tar:\\n\\n- Gjennom s\u00f8knad om registrering direkte til Patentstyret.
  Fleirtalet av norske s\u00f8kjavar leverer varemerkes\u00f8knadene p\u00e5 denne
  m\u00e5ten.\\n- Gjennom internasjonal s\u00f8knad om registrering direkte til WIPO
  (eller via Patentstyret til WIPO), der s\u00f8kjaren kan peike ut Noreg. Over halvparten
  av varemerkes\u00f8knadene til Patentstyret er i dag slike utpeikningar fr\u00e5
  WIPO og kjem i hovudsak fr\u00e5 utanlandske s\u00f8kjavar.\\n\\nDei samla varemerkerettane
  i Noreg utgjer ein kombinasjon av desse. Ei varemerkeregistrering gjeld for ti \u00e5r
  og kan fornyast for ti \u00e5r om gongen.\\n\\nOm lag 62 prosent (61 prosent i 2022)
  av s\u00f8knadene blei registrerte utan skriftleg kommunikasjon mellom s\u00f8kjaren
  og Patentstyret. Vi f\u00f8lgjer med p\u00e5 denne prosentdelen fordi han fortel
  oss i kva grad kundane leverer s\u00f8knader utan formelle feil eller manglar. Utviklinga
  over tid p\u00e5verkar tida vi brukar per sak, og viser om vi lykkast med \u00e5
  informere og rettleie kundane f\u00f8r dei leverer inn s\u00f8knader.\\n\\nTabell
  6: Talet p\u00e5 ferdigbehandla varemerkes\u00f8knader per \u00e5rsverk brukt p\u00e5
  saksbehandling\\n\\n|                | 2019 | 2020 | 2021 | 2022 | 2023 |\\n|----------------|------|------|------|------|------|\\n|
  Varemerke      | 459  | 492  | 530  | 465  | 520  |\\n\\nI 2023 avgjorde Patentstyret
  gjennomsnittleg 520 s\u00f8knader per \u00e5rswerk. S\u00f8knadene har d\u00e5 blitt
  registrerte, nekt\u00e5 registrerte, lagde vekk av Patentstyret eller er trekte
  av s\u00f8kn\u00e6ren. Tala viser at saksbehandlinga var 12 prosent meir effektiv
  dette \u00e5ret, og dermed p\u00e5 niv\u00e5 med topp\u00e5ret 2021. Dette kjem
  hovudsakleg av at dei nytilsette fr\u00e5 2022 blei meir produktive, samtidig som
  vi brukte mindre ressursar p\u00e5 oppl\u00e6ring enn \u00e5ret f\u00f8r.\\n\\nPatentstyret
  har samanlikna gjennomsnittleg tidsbruk per s\u00f8knad med dei nordiske og baltiske
  landa for saker som blei behandla i 2023. Denne analysen er framleis i ein tidleg
  fase fordi landa brukar ulik metodikk for \u00e5 rekne p\u00e5 tidsbruka, og fordi
  ein ogs\u00e5 har ulikt omfang p\u00e5 behandlinga av sakene. Derfor b\u00f8r ein
  inntil vidare bruke tala med noko varsemd. I dei nasjonale varemerkes\u00f8knadene
  varierte gjennomsnittleg tidsbruk i dei nordiske og baltiske landa fr\u00e5 om lag
  2,3 timar til 6 timar, og tidsbruka i Patentstyret var p\u00e5 om lag 4 timar i
  2021 (og om lag 4,3 timar i 2023). I internasjonale utpekingar varierte gjennomsnittleg
  tidsbruk i dei nordiske og baltiske landa mellom 1,8 og 2,7 timar, der tidsbruka
  i Patentstyret var 2,3 timar i 2023. Desse tala viser at Patentstyret l\u00e5g p\u00e5
  gjennomsnittet med omsyn til tidsbruk i internasjonale s\u00f8knader og noko over
  gjennomsnittet i nasjonale s\u00f8knader. Her m\u00e5 ein ta omsyn til at ikkje
  alle landa granskar b\u00e5de absolutte og relative hinder, og at ikkje alle landa
  nekta registrering p\u00e5 grunn av eit relativt hinder sj\u00f8lv om de gjer ei
  gransking \u2013 slik vi gjer i Noreg.\\n\\nFigur 4: Varemerke \u2013 s\u00f8knader,
  avgjorde og til behandling\\n\\nGrafen viser s\u00f8knadsinngang, avgjorde saker
  og s\u00f8knader under behandling ved \u00e5rsslutt. S\u00f8knadene kan bli avgjorde
  for s\u00e5 \u00e5 bli tekne opp att p\u00e5 eit seinare tidspunkt og f\u00e5 ei
  ny avgj\u00f8relse. Dermed vil ikkje n\u00f8dvendigvis talet p\u00e5 s\u00f8knader
  under behandling vere lik s\u00f8knadsinngang minus avgjorde s\u00f8knader.\\n\\nAnsvarsmerke\\n\\nEit
  ansvarsmerke er eit stempelmerke for gull-, s\u00f8lv- og platinavare. Patentstyret
  administrerer registeret over ansvarsmerke i Noreg. Ei gull-, s\u00f8lv- eller platinavare
  som blir stempla med finleiksmerke, skal samtidig stemplast med eit ansvarsmerke.
  Eit ansvarsmerke fortel kven som har f\u00f8rt vara ut i marknaden (kven som er
  produsent eller import\u00f8r). Det gjer det mogleg \u00e5 identifisere kven som
  har laga vara, til d\u00f8mes kva for ein gullsmed det er snakk om. Ansvarsmerke
  m\u00e5 fornyast kvart tiande \u00e5r etter registrering. I 2023 blei det registrert
  72 nye ansvarsmerke. Dette er ein liten nedgang fr\u00e5 2022. 18 merke blei fornya.
  Dette er om lag som tidlegare \u00e5r. Ved sluttien av 2022 var det 1404 ansvarsmerke
  i kraft i Noreg.\\n\\nDesign \u2013 utviklinga p\u00e5 omr\u00e5det\\n\\nPatentstyret
  fekk 14 prosent fleire design s\u00f8knader i 2023 enn \u00e5ret f\u00f8r, nemleg
  1 365 s\u00f8knader. Talet p\u00e5 design s\u00f8knader fr\u00e5 norske s\u00f8kjavar
  var 19 prosent h\u00f8gare enn \u00e5ret f\u00f8r, medan talet p\u00e5 design s\u00f8knader
  fr\u00e5 utanlandske s\u00f8kjavar auka med 13 prosent. Ein design s\u00f8knad kan
  innehalde fleire design, s\u00e5 ein b\u00f8r ogs\u00e5 sj\u00e5 p\u00e5 kor mange
  design det er snakk om samla. Dei 1365 s\u00f8knadene som Patentstyret fekk fr\u00e5
  norske og utanlandske s\u00f8kjavar totalt, inneholdt om lag 4600 design, som er
  7 prosent h\u00f8gare enn \u00e5ret f\u00f8r. B\u00e5de talet p\u00e5 design s\u00f8knader
  og talet p\u00e5 design er h\u00f8gare enn rekord\u00e5ret 2017 (1253 s\u00f8knader
  og 4488 design).\\n\\nTalet p\u00e5 design s\u00f8knader er framleis l\u00e5gt,
  s\u00e6rlig n\u00e5r det gjeld norske s\u00f8kjavar. Det same gjeld talet p\u00e5
  design s\u00f8knader ut i verda fr\u00e5 norske s\u00f8kjavar. Marknadene med flest
  design s\u00f8knader fr\u00e5 norsk n\u00e6ringsliv i tillegg til Noreg, var i 2022
  EU, USA, Storbritannia, Kina og India. Tal for 2023 blir oppdaterte av WIPO Statistics
  Database f\u00f8rst i oktober/november 2024.\\n\\nFigur 5: Talet p\u00e5 design
  s\u00f8knader fr\u00e5 norske s\u00f8kjavar til land utanom Noreg\\n\\nNasjonale
  design s\u00f8knader og utpeikningar i internasjonale design registreringar med
  norsk s\u00f8kjavar som er leverte til land utanfor Noreg. For regionale ordningar
  som EU-design (EUIPO) tel vi talet p\u00e5 s\u00f8knader multiplisert med talet
  p\u00e5 land som er med i ordninga p\u00e5 tidspunktet for innlevering av s\u00f8knaden.
  Kjelde: WIPO IP Statistics Database\\n\\nTil skilnad fr\u00e5 patent- og varemerkes\u00f8knader
  granskar ikkje Patentstyret designsoknadene med mindre s\u00f8kjaren eksplisitt
  ber om det. Dei fleste designsoknadene blir derfor godkjende raskt etter at dei
  er leverte inn (om lag 98 prosent). S\u00f8kjaren har sj\u00f8lv ansvar for ikkje
  \u00e5 krenkje rettane til andre, men kan be Patentstyret om \u00e5 gjere ei nyheitsvurdering.\\n\\nI
  2023 avgjorde Patentstyret 1257 s\u00f8knader, om lag 90 f\u00e6rre enn vi fekk
  inn.\\n\\n### Behandlingstid for design\\n\\nDet er eit m\u00e5l at den som s\u00f8kjer
  Patentstyret om registrering av design, skal f\u00e5 avgjort s\u00f8knaden i l\u00f8pet
  av to til tre m\u00e5nader. Den gjennomsnittlege behandlingstida var 1,9 m\u00e5nader
  (2,5 m\u00e5nader i 2022), og m\u00e5let blei dermed n\u00e5dd.\\n\\nI 2023 avgjorde
  Patentstyret gjennomsnittleg 665 s\u00f8knader per \u00e5rsvirk. S\u00f8knadene
  har d\u00e5 blitt registrerte, nekta registrerte, lagde vekk av Patentstyret eller
  er trekte av s\u00f8kjaren. Tala viser at saksbehandlinga var ti prosent meir effektiv
  i 2023 enn \u00e5ret f\u00f8r.\\n\\nPatentstyret har inga samanlikning av behandlingstid
  og effektivitet med dei nordiske og baltiske landa p\u00e5 designomr\u00e5det. I
  alle landa er det sm\u00e5 tal og for lite bruk av ressursar til at det er rekningsvarande
  \u00e5 gjere ein tilsvarande analyse som p\u00e5 varemerke- og patentomr\u00e5det.\\n\\n|
