  Direkt\u00f8r er ikkje medrekna i gjennomsnittleg m\u00e5nadsloon.\\n\\n** Det er
  berre \u00e9i kvinne som er avdelingsingeni\u00f8r, s\u00e5 derfor er ikkje l\u00f8na
  vist i oversikta.\\n\\n*** Tall i hele tusen\\n\\nInkluderingsdugnad\\n\\nPatentstyret
  har eit stort etnisk mangfald, og ved utgangen av 2023 hadde 14,7 prosent av dei
  tilsette eit anna etnisk opphav enn norsk. Dette vil seie at dei er innvandrarar
  f\u00f8dde i utlandet eller norskf\u00f8dde med innvandrarforeldre. I 2022 var prosentdelen
  15,7 prosent.\\n\\nPatentstyret nytta moderat kvotering for s\u00f8kjarar med ikkje-vestleg
  etnisk bakgrunn eller med nedsett funksjonsevne i avdelingar som ikkje oppfyller
  m\u00e5lkrava. Alle stillingar blir lyste ut p\u00e5 nettstaden www.inkludi.no,
  som rettar seg spesielt mot s\u00f8kjarar med annan etnisk bakgrunn enn norsk. I
  rekrutteringssystemet f\u00e5r alle s\u00f8kjarar h\u00f8ve til \u00e5 opplyse om
  dei har innvandrarbakgrunn, nedsett funksjonsevne eller h\u00f2l i CV-en. Leiaren
  og rekrutteringsgruppa f\u00e5r d\u00e5 ei oversikt i systemet over kva for s\u00f8kjarar
  som har opplyst dette, og dei kan d\u00e5 kalle inn minst \u00e9in kvalifisert s\u00f8kjar
  i kvar kategori.\\n\\nI utlyste stillingar der det er s\u00f8kjarar med innvandrarbakgrunn,
  nedsett funksjonsevne eller h\u00f2l i CV-en, som oppfyller krava i utlysinga, blir
  minst \u00e9in i kvar kategori kalla inn til intervju. Leiaren m\u00e5 alltid gjere
  greie for kor mange personar med innvandrarbakgrunn, nedsett funksjonsevne eller
  h\u00f2l i CV-en som har s\u00f8kt p\u00e5 stillinga, kor mange av dei som er kalla
  inn til intervju, og eventuelt om nokon av dei er innstilte.\\n\\nDet var ti nye
  medarbeidarar som blei rekrutterte i 2023. Det var totalt 567 s\u00f8kjarar til
  stillingane. I alle kunngjeringar blei mangfaldsformuleringa brukt.\\n\\n**Utanlandsk
  opphav**\\nDet var 65 s\u00f8kjarar som har kryssa av for utanlandsk opphav, alts\u00e5
  11,5 prosent totalt av alle s\u00f8kjarar. Av desse var det seks s\u00f8kjarar som
  blei kalla inn til intervju. Det var \u00e9in som blei vurdert som kvalifisert for
  stillingane og innstilt som nummer \u00e9in, og fekk stillinga.\\n\\n**Nedsett funksjonsevne**\\n1,4
  prosent av alle s\u00f8kjarar kryssa av for nedsett funksjonsevne. Av desse var
  det ingen som blei vurderte som kvalifiserte.\\n\\n**H\u00f2l i CV-en**\\n2,6 prosent
  totalt av alle s\u00f8kjarar. Av desse var det \u00e9in som blei kalla inn til intervju.
  S\u00f8kjaren blei vurdert som ikkje kvalifisert for stillinga.\\n\\n**Sjukefr\u00e5v\u00e6r**\\nPatentstyret
  har som m\u00e5l at medarbeidarane v\u00e5re skal vere til stades 98 prosent av
  tida. Patentstyret hadde eit sjukefr\u00e5v\u00e6r p\u00e5 6,6 prosent i 2023, mot
  6,8 prosent i 2022. Det legemelde fr\u00e5v\u00e6ret var p\u00e5 4,5 prosent, mot
  5,0 prosent i 2022. Det eigenmelde fr\u00e5v\u00e6ret var p\u00e5 2,0 prosent, mot
  1,7 prosent i 2022.\\n\\nTalet p\u00e5 tilsette i sentralforvaltninga\\n\\nVed utgangen
  av 2023 var det totalt 248 medarbeidarar i Patentstyret, og dei utgjer 241,3 \u00e5rsv\u00e6rk
  (jf. definisjonen av utforte \u00e5rsv\u00e6rk i PM-2019-13). Patentstyret har i
  tillegg ein l\u00e6rling som ikkje er rekna med, verken i talet p\u00e5 medarbeidarar
  eller \u00e5rsv\u00e6rk. Direkt\u00f8r og ein mellombels tilsett inng\u00e5r i totalt
  tilsette og \u00e5rsv\u00e6rk. I tillegg er det \u00e9in medarbeidar som er i permisjon
  utan l\u00f8n, som inng\u00e5r i det totale talet p\u00e5 tilsette, men ikkje er
  medrekna i \u00e5rsv\u00e6rka.\\n\\nL\u00e6rlingar\\n\\nPatentstyret har to l\u00e6rlingar
  som er knytte til kommunikasjon og kunnskap \u2013 \u00e9in innanfor mediedesignfaget
  og \u00e9in innanfor innhaldsproduksjonsfaget. Dei er knytte til OK Stat.\\n\\nPatentstyret
  tek sikte p\u00e5 \u00e5 ta inn to nye mediel\u00e6rlingar innanfor same fagomr\u00e5de
  fr\u00e5 hausten 2024 n\u00e5r dei l\u00e6rlingane vi har i dag, er ferdige med
  l\u00e6retida si.\\n\\nPatentstyret har ogs\u00e5 nytta arbeidsevnevurdering gjennom
  Nav i 2023.\\n\\nTabell 16: Kj\u00f8nn, arbeidstid og fr\u00e5v\u00e6r\\n\\n| Totalt/stillingskodar
