  Bestemmelsesomr\u00e5de #1-#7 (midlertidig)\\n\\n2.0 Rekkef\u00f8lgekrav\\n\\n2.1
  V1-V5 med GS1-GS5, med tilh\u00f8yrande anna veggrunn, skal opparbeidast samstundes
  som det vert gjeve byggjel\u00f8yve p\u00e5 Rota, og vegareala skal vere ferdigstilt
