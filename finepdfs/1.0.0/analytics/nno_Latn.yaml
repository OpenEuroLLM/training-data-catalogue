  "\"FOLKETALSUTVIKLING I REGION VEST -  PER 1. JAN. 2018.\\n\\nKjelde: Statistisk
  Sentralbyr\u00e5  (SSB)            Tabellen:  utarbeida av Jarle K\u00e5re Oen\\n\\nKOMMENTARAR:\\n\\n*
  \u00d8ygarden: folketalet er redusert med 36 personar i 2017\\n* \u00d8ygarden:
  64  f\u00f8dde og 29 d\u00f8de gjennom \u00e5ret\\n* \u00d8ygarden: f\u00f8dselsoverskotet
  i 35\\n* \u00d8ygarden: netto utflytting  gjennom \u00e5ret :  71 personar\\n\\n*\\n\\n\u00d8ygarden:
  prosentvis reduksjon i folketalet for heile \u00e5ret er 0,73 %\\n\\n* \u00d8ygarden:
  tala for siste kvartal 2017 syner berre ein nedgang p\u00e5 1 person, s\u00e5 trenden
  snur kanskje i 2018?\\n* KONKLUSJON \u00d8YGARDEN: Tala syner nedgang i folketalet
  samanhengande over 5 kvartal (- 36) der hovud\u00e5rsaka er netto utflytting\\n*
  Fjell er kommunen med h\u00f8gast vekst p\u00e5 2,1%\\n* Region Vest (inkl. Ask\u00f8y)
  har vakse med 762 personar (0,9 % vekst)\\n* Ser me p\u00e5 Fjell, Sund og \u00d8ygarden
  er innbyggjartalet 37.687 som er ein auke p\u00e5 512 for heile 2017. Lite realistisk
  med 40.000 i 2020.\\n* I volum og prosent har Fjell vakse mest i 2017 (521 og 2,1
  %) , \u00d8ygarden har reduksjon (-36). Alle kommunane har f\u00f8dselsoverskot\\n*
  Fjell er den kommunen med h\u00f8gast netto tilflytting i 2017 (332) medan Sund
  og \u00d8ygarden har netto fr\u00e5flytting\\n* KONKLUSJON REGION VEST: Folkeveksten
  har teke seg godt oppatt i Fjell, Sund har ein liten auke, \u00d8ygarden har hatt
  samanhengande nedgang i folketalet sidan 4. kvartal 2016 (5. kvartal p\u00e5 rad)\"",
  "\"S\u00d8KNAD OM TILSKOT TIL ALVER KYRKJELEGE FELLESR\u00c5D FOR 2021\\n\\nVi viser
  til s\u00f8knad om tilskot til drift og investeringar fr\u00e5 30.06.20, m\u00f8te
  med formannskapet 20.08.20 og tilbakemeldingar fr\u00e5 ass.r\u00e5dmann Martin
  Kulild.\\n\\nAlver KF sender her ei revidert s\u00f8knad om tilskot til drift og
  investeringar for 2021. Samanlikna med s\u00f8knaden fr\u00e5 30.06 er det endringar
  i s\u00f8knad om tilskot til vedlikehald av bygningar, og investeringar i bilar
  og utstyr.\\n\\n- Etter \u00f8nskje fr\u00e5 kommunen har vi tatt med behova for
  utstyr til drift av Meland gravplass  det har vore eit avklarande m\u00f8te med
  tilsette i teknisk i kommunen. Kyrkja har \u00f3g gjort og ei vurdering av dei bilane
  og det utstyret som dei tidlegare fellesr\u00e5da hadde fr\u00e5 f\u00f8r.\\n- Det
  er laga oversikt over behov for vedlikehald i kyrkjene Lind\u00e5s og Ostereidet,
  og noko for Meland, som ein f\u00f8rste del av ein plan for alle bygga. I denne
  s\u00f8knaden er det med tal for dei kyrkjene.\\n\\nDrift 2021\\n\\nS\u00f8knad
  om driftstilskot er vedtatt av Alver kyrkjelege fellesr\u00e5d.  S\u00f8knaden og
  budsjettet for 2021 byggjer p\u00e5 Alver-kyrkja sitt budsjett for 2020, som ei
  samansl\u00e5ing av budsjetta fr\u00e5 dei tre fellesr\u00e5da i tidlegare Meland,
  Rad\u00f8y og Lind\u00e5s kommunar.\\n\\nHeimelen for kommunen sine forpliktningar
  finn ein i Kyrkjelova \u00a7 15, som sl\u00e5r fast at kommunen utreder ei rekkje
  utgifter etter budsjettforslag fr\u00e5 kyrkjeleg fellesr\u00e5d (https://lovdata.no/lov/19960607-31/\u00a715).\\n\\nAlver
  kyrkjelege fellesr\u00e5d og dei 5 sokner\u00e5da har stor motivasjon i \u00e5 vidareutvikle
  sin desentraliserte organisasjon med 5 sokn, 6 kontorstader, 14 kyrkjer og 25 gravplassasar
  spreitt ut over heile kommunen. Vi er om lag 35 tilsette i fellesr\u00e5det, 9 prestar
  (finansiert av staten via Bisped\u00f8met), 5 sokner\u00e5d, eitt fellesr\u00e5d,
  hundrevis av friviljuge og mange deltakarer p\u00e5 alt det som skjer i kyrkjene
  i kommunen. Det er viktig \u00e5 understreka at sj\u00f8lv om gudstenester er viktige
  \u2013 og ofte f\u00e5r stor merksemd, s\u00e5 er det mykje anna som skjer med utgangspunkt
  i kyrkjene. Gravferder, d\u00e5p, vigsel, konfirmasjonar, konsertar, vaksenkor,
  barnekor og diakonalt arbeid blant vanskelegstilte, for \u00e5 nemne noko. Vi har
  ogs\u00e5 ein aktiv gjeng som arbeider ute heile \u00e5ret med \u00e5 ordne til
  gravferdene og ta vare p\u00e5 uteomr\u00e5da og bygga v\u00e5re. Denne store bredda
  krev mykje ressursar \u00e5 drifte og utvikle.\\n\\nFor 2020 har Alver kommune gitt\\n\\nTilskotet
  i samband med 1.tertial 2020 var grunngjeve med meirkostnader n\u00e5r kyrkja slo
  seg saman i 2019 - dette er kostnader kyrkja ogs\u00e5 f\u00e5r i 2021. Pengar til
  s\u00e5kalla \u00abverdibevarande vedlikehaldplan\u00bb kjem p\u00e5 inititativ
  fr\u00e5 kommunen. Vi skal utarbeide ein samla plan for alle kyrkjene.\\n\\nFor
  2021 s\u00f8kjer Alver KF om driftstilskot p\u00e5 kr 28,7 mill (i tillegg kjem
  kostnadsindeksering):\\n\\nI tillegg til drifta i dag minner kyrkja om at det framleis
  er fleire behov, ma. stillingar i driftsavdelinga. Dersom kyrkja skal kunne overta
  drifta av Meland gravplass m\u00e5 bemanninga i driftsavdelinga auka (og kommunen
  stille med utstyr). Det kan bli mulig dersom kyrkja blir kompensert for meirkostnadene
  i samband med samansl\u00e5inga. Fellesr\u00e5det minner ogs\u00e5 om at det etter
  samansl\u00e5inga framleis er for lite ressursar i fellesr\u00e5dsadministrasjonen,
  det gjer det krevjande \u00e5 f\u00e5 til god drift.\\n\\nPengar i 2020 til utarbeiding
  av vedlikehaldsplan skal gje ein samla plan for alle kyrkjene, som grunnlag for
  seinare s\u00f8knad til kommunen. Sj\u00f8lv om planen ikkje er ferdig s\u00f8kjer
  vi her om 2,5 mill kr til vedlikehald av kyrkjene Lind\u00e5s, Ostereidet og Meland.  Dette
  er begrunna i tilstandsrapportar fr\u00e5 Ing. Taule AS for Lind\u00e5s og Ostereidet,
  som er vedlagt, og Multiconsult (Meland).\\n\\nLind\u00e5s kyrkje:\\n\\nkr 0,8 mill\\n\\nOstereidet
  kyrkje: kr 1.2 mill\\n\\nMeland kyrkje:\\n\\nkr 0,5 mill\\n\\nVi kan ikkje ta alt
  som er nemnd i rapportane, men kan ta det som er kritisk av skader og r\u00e5te,
  og maling av Lind\u00e5s og Ostereidet. Oppdraga vil bli sendt p\u00e5 anbod.\\n\\nI
  tillegg til dette har vi f\u00e5tt p\u00e5legg fr\u00e5 BKK for en del av bygga,
  men vi vil fors\u00f8kje \u00e5 gjere mykje av dette sj\u00f8lve, og eindel anna
  vedlikehald.\\n\\nInntekter:\\n\\nSum\\n\\n34,2 mill kr\\n\\nUtgifter:\\n\\n-\\n\\nL\u00f8nskapitlet\\n\\n22,4\\n\\n-
  L\u00e5nekostnader\\n\\n3,3\\n\\nSum\\n\\n34,3 mill kr\\n\\nInvesteringar 2021\\n\\nFor
  2021 s\u00f8kjer Alver kyrkjelege fellesr\u00e5d om nye investeringsmidlar til driftsavdelinga,
  og at tidlegera bevilgningar blir vidaref\u00f8rt.\\n\\nN\u00e5r det gjeld utstyr
  til driftsavdelinga, er det b\u00e5de slitt utstyr som b\u00f8r bli erstatta, og
  nytt utstyr til Meland gravplass (der har vi ikkje noko i dag).  Basert p\u00e5
  v\u00e5r gjennomgang er behova slik:\\n\\n- Utstyr driftsavdelinga\\nFor Meland:
  kr 0,471 mill.\\n- Utstyr driftsavdelinga\\n\\nErstatning for slitt utstyr: kr 1,534
  mill\\n\\nDet er lagt ved ei detaljert liste over bilar og utstyr som vi b\u00f8r
  ha.\\n\\nVi ber om at bevilgningene til desse oppg\u00e5vene blir vidaref\u00f8rt:\\n\\n-
  Gravplass Lind\u00e5s Alver kommune, 4,7 mill + 0,5 mill (+ 2021-23)\\n- Gravplass
  Meland\\n\\nAlver kommune, 1,0 mill (+ 2021-23)\\n\\n- Kyrkjetomt Meland\\n\\nAlver
  kommune, 5 mill\\n\\nKabelanlegg Meland kyrkje Alver kommune, 2,9 mill\\n\\nKyrkjeinvesteringar
  blir vurdert i samband med vedlikehaldsplan for kyrkjene.\\n\\nTa gjerne kontakt
  for meir informasjon.\\n\\nMed helsing\\n\\nJohn Fredrik Wallace\\n\\nKyrkjeverje\\n\\nClick
  here to enter text.\"", "\"OPPL\u00c6RINGSAVDELINGA\\n\\nArkivnr:\\n\\n2019/2185-1\\n\\nSaksbehandlar:
  Birthe Andersen Haugen\\n\\nSaksgang\\n\\nUtval\\n\\nSaknr.\\n\\nSaksframlegg\\n\\nM\u00f8tedato\\n\\nUtval
  for oppl\u00e6ring og helse\\n\\n12.03.2019\\n\\nUttale - H\u00f8yring forslag til
  endring i organisering av skule\u00e5ret i vidareg\u00e5ande oppl\u00e6ring\\n\\nSamandrag\\n\\nUtdanningsdirektoratet
  har sendt p\u00e5 h\u00f8yring forslag til endring i organisering av skule\u00e5ret
  i vidareg\u00e5ande oppl\u00e6ring. H\u00f8yringa er open slik at alle som \u00f8nskjer
  det, kan levere uttale. Fylkesdirekt\u00f8r oppl\u00e6ring har oppfordra dei vidareg\u00e5ande
  skulane til \u00e5 levere eigne h\u00f8yringsuttalar. H\u00f8yringsuttalen som det
  vert fatta vedtak om i denne saka, vert levert som uttale fr\u00e5 skuleeigar.\\n\\nFrist
  for \u00e5 sende h\u00f8yringsuttale er sett til 21. mars 2019.\\n\\nI oktober 2016
  vart det sett ned ei partssamansett arbeidsgruppe som fekk i oppdrag \u00e5 vurdere
  organiseringa av skule\u00e5ret i lys av utfordringar knytt til undervisningstid,
  eksamen og eksamensf\u00f8rebuingar. Bakgrunnen for oppdraget var at NIFU har funne
  at eksamensperioden er den enkelt\u00e5rsaka som f\u00f8rer til at flest undervisningstimar
  fell bort. I dag vert i overkant av 2 veker av skule\u00e5ret sett av til sentralt
  gitt skriftleg eksamen. I tillegg kjem ein periode p\u00e5 om lag 2 veker som vert
  disponert til munnleg og munnleg-praktisk eksamen. I praksis betyr det at eksamensperioden
  startar like etter 17. mai og vert avslutta ved slutten av skule\u00e5ret. Elevar
  som ikkje er trekt ut til eksamen, skal ha ordin\u00e6r oppl\u00e6ring, jf. forskrift
  til oppl\u00e6ringslova (forskrifta) \u00a7 1-4, men dette kan by p\u00e5 utfordringar
  slik det vart peika p\u00e5 av NIFU.\\n\\nP\u00e5 bakgrunn av arbeidsgruppa sine
  tilr\u00e5dingar har departementet bestemt \u00e5 sende fire framlegg til endring
  i organiseringa av skule\u00e5ret p\u00e5 h\u00f8yring.\\n\\nForslaga g\u00e5r ut
  p\u00e5:\\n\\n- Avkorting av eksamensperioden ved at eksamen p\u00e5 studief\u00f8rebuande
  kan gjennomf\u00f8rast p\u00e5 fem dagar ved \u00e5 ha to alternative eksamensdagar
  for alle trekkfag som elevane normalt tek p\u00e5 Vg3.\\n- Offentleggjeringa av
  eksamenstrekket vert flytta, slik at elevane/deltakarane blir kjent med trekket
  tidlegare, t.d. to eller tre veker f\u00f8r f\u00f8rste eksamen.\\n- Standpunktkarakterar
  vert ikkje lenger sett f\u00f8r lokalt gitt eksamen er gjennomf\u00f8rt. Det er
  gjort forslag om fleire alternative endringar, m.a. at standpunktkarakterar skal
  setjast seinast dagen f\u00f8r fellessensurm\u00f8tet, samstundes som eksamenskarakterane
  ved lokalt gitt eksamen ikkje kan offentleggjerast f\u00f8r etter fellessensurm\u00f8te.\\n-
  Det ikkje er naudsynt at skule\u00e5ret varer i 38 veker, s\u00e5 lenge all oppl\u00e6ring
  vert gjennomf\u00f8rt. Det er gjort forslag om fleire alternativ  endring.\\n\\n\u00d8konomi:
  \u00d8konomisk effekt skal utgreiast n\u00e6rare av utdanningsdirektoratet.\\n\\nKlima:
  Ingen effekt\\n\\nFolkehelse: Ingen effekt\\n\\nRegional planstrategi: Ingen effekt\\n\\nForslag
  til vedtak\\n\\nHordaland fylkeskommune gjev slik uttale:\\n\\n1. Eksamensperioden
  vert avkorta ved at eksamen p\u00e5 studief\u00f8rebuande utdanningsprogram kan
  gjennomf\u00f8rast p\u00e5 fem dagar ved \u00e5 ha to alternative eksamensdagar
  for alle trekkfag som elevane normalt tek p\u00e5 Vg3.\\na. Meiner de at eksamensperioden
  b\u00f8r komprimerast til fem dagar ved \u00e5 halde alle sentralt gitte eksamenar
  p\u00e5 Vg3 (studief\u00f8rebuande) i l\u00f8pet av to dagar? Svar: Ja\\nb. Vil
  eit slikt forslag gjere det lettare for skulane \u00e5 planlegge og gjennomf\u00f8re
  oppl\u00e6ringa i tr\u00e5d med \u00e5rstimetalet? Svar: Ja\\nc. Ser de andre \u00f8konomiske
  eller administrative konsekvensar av framlegget? Svar: Veit ikkje\\nKommentar: I
  h\u00f8yringsbrevet skriv Utdanningsdirektoratet at dei \u00f8konomiske og administrative
  konsekvensane for fylkeskommunane skal ytterlegare utgreiast.\\n\\nHordaland fylkeskommune
  har sv\u00e6rt mange privatistar. Ved ei komprimering av eksamensperioden kan det
  vere utfordrande \u00e5 finne tilstrekkeleg lokale til avvikling av eksamen. Det
  kan medf\u00f8re auka leigekostnader og auka kostnader til vakthald m.m. Det er
  viktig at ogs\u00e5 dette vert vurdert som ein del dei \u00f8konomiske og administrative
  konsekvensane.\\n\\n2. Offentleggjeringa av eksamenstrekket vert flytta, slik at
  elevane/deltakarane blir kjent med trekket tidlegare, t.d. to eller tre veker f\u00f8r
  f\u00f8rste eksamen.\\na. Vil ei endring av offentleggjering av trekket gjere det
  enklare \u00e5 planlegge undervisninga?\\n\\nSvar: Ja\\n\\nb. Dersom de \u00f8nskjer
  ei endring, kva alternativ f\u00f8retrekkjer de? Svar: Alt. 1, 10 yrkedagar f\u00f8r
  eksamen\\nc. Meiner de tidspunktet for offentleggjering av trekk b\u00f8r gjelde
  b\u00e5de sentralt gitt og lokalt gitt eksamen? Svar: Ja\\nd. Meiner de trekket
  skal offentleggjerast felles for alle fag, eller meiner de det framleis skal vere
  skilje mellom sentralt gitte og lokalt gitte eksamenar? Svar: Felles for alle\\ne.
  Vil forlaget f\u00f8re til andre \u00f8konomiske eller administrative konsekvensar?
  Svar: Nei\\n3. Standpunktkarakterar vert ikkje lenger sett f\u00f8r lokalt gitt
  eksamen er gjennomf\u00f8rt. Det er gjort forslag om fleire alternative endringar,
  m.a. at standpunktkarakterar skal setjast seinast dagen f\u00f8r fellessensurm\u00f8tet,
  samstundes som eksamenskarakterane ved lokalt gitt eksamen ikkje kan offentleggjerast
  f\u00f8r etter fellessensurm\u00f8te.\\na. Vil ei endring i f\u00f8resegna i forskrift
  til oppl\u00e6ringslova \u00a7 3-18 om fastsetting av standpunktkarakterar i fag
  med lokalt gitt eksamen bidra til at \u00e5rstimetalet i st\u00f8rre\\n\\n5. Iverksetting\\n6.
  Anna\\n\\ngrad vert oppfylt?\\n\\nSvar: Ja\\n\\nb. Vil det vere ei god l\u00f8ysing
  at eksamenskarakterane ved lokalt gitt eksamen ikkje kan offentleggjerast f\u00f8r
  etter fellessensurm\u00f8tet og at standpunktkarakterar i alle fag skal fastsetjast
  f\u00f8r dette m\u00f8tet?\\n\\nSvar: Ja\\n\\nc. Vil forslaget f\u00f8re med seg
  andre \u00f8konomiske eller administrative konsekvensar? Svar: Ja\\n\\nKommentarar:  Endringane
  kan f\u00f8re til komprimert tidsrom for klagebehandling. Det kan gje auka arbeidspress
  p\u00e5 dei fylkeskommunale klagenemndene i ein periode. N\u00e5r eksamens- og standpunktkarakterar
  f\u00e5r om lag same offentleggjeringsdato, vil det vere enklare \u00e5 kommunisere
  ut tidspunkt for offentleggjering.\\n\\n4. Det er ikkje naudsynt at skule\u00e5ret
  varer i 38 veker, s\u00e5 lenge all oppl\u00e6ring vert gjennomf\u00f8rt. Det er
  gjort framlegg om fleire alternativ til endring.\\na. Vil ei endring av f\u00f8resegna
  til oppl\u00e6ringslova \u00a7 3-2 om lengda p\u00e5 skule\u00e5ret i st\u00f8rre
  grad gjere det mogeleg \u00e5 oppfylle \u00e5rstimetalet f\u00f8r eksamenstida begynner?
  Svar: Ja\\nb. Dersom ja, kva for alternativ f\u00f8retrekkjer de? Svar: Alt. 3,
  Skule\u00e5ret skal strekkje seg over minst 180 dagar. Elevane skal ha minst 7 veker
  samanhengande ferie.\\na. St\u00f8ttar de v\u00e5r vurdering av n\u00e5r endringane
  kan tre i kraft? Svar: Ja\\na. Har de innspel til andre endringar som kan bidra
  til at \u00e5rstimetalet i st\u00f8rre grad vert oppfylt?\\n\\nSvar: Nei\\n\\nIngrid
  Kristine Holm Svendsen kst. fylkesr\u00e5dmann\\n\\nSaksframlegget er godkjent elektronisk
  og har derfor inga underskrift.\\n\\nBj\u00f8rn Lyngedal fylkesdirekt\u00f8r oppl\u00e6ring\\n\\nFylkesr\u00e5dmannen,
  25.02.2019\\n\\nUtdanningsdirektoratet har sendt p\u00e5 h\u00f8yring forslag til
  endring i organisering av skule\u00e5ret i vidareg\u00e5ande oppl\u00e6ring. H\u00f8yringa
  er open, slik at alle som \u00f8nskjer det kan levere uttale. Fylkesdirekt\u00f8r
  oppl\u00e6ring har oppmoda dei vidareg\u00e5ande skulane om \u00e5 levere eigne
  h\u00f8yringsuttalar. H\u00f8yringsuttalen som det vert fatta vedtak om i denne
  saka, vert levert som uttale fr\u00e5 skuleeigar.\\n\\nFrist for \u00e5 sende h\u00f8yringsuttale
  er sett til 21. mars 2019.\\n\\nI oktober 2016 vart det sett ned ei partssamansett
  arbeidsgruppe som fekk i oppdrag \u00e5 vurdere organiseringa av skule\u00e5ret
  i lys av utfordringar knytt til undervisningstid, eksamen og eksamensf\u00f8rebuingar.
  Bakgrunnen for oppdraget var at NIFU har funne at eksamensperioden er den enkelt\u00e5rsaka
  som f\u00f8rer til at flest undervisningstimar fell bort. I dag vert i overkant
  av 2 veker av skule\u00e5ret sett av til sentralt gitt skriftleg eksamen. I tillegg
  kjem ein periode p\u00e5 om lag 2 veker som blir disponert til munnleg og munnleg-praktisk
  eksamen. I praksis betyr det at eksamensperioden startar like etter 17. mai og vert
  avslutta ved slutten av skule\u00e5ret. Elevar som ikkje er trekte ut til eksamen,
  skal ha ordin\u00e6r oppl\u00e6ring, jf. forskrift til oppl\u00e6ringslova (forskrifta)
  \u00a7 1-4, men dette kan by p\u00e5 utfordringar slik det vart peika p\u00e5 av
  NIFU.\\n\\nP\u00e5 bakgrunn av arbeidsgruppa sine tilr\u00e5dingar har departementet
  vedteke \u00e5 sende fire framlegg til endring i organiseringa av skule\u00e5ret
  p\u00e5 h\u00f8yring.\\n\\nForslaga g\u00e5r ut p\u00e5:\\n\\n1. Avkorting av eksamensperioden
  ved at eksamen p\u00e5 studief\u00f8rebuande utdanningsprogram kan gjennomf\u00f8rast
  p\u00e5 fem dagar ved \u00e5 ha to alternative eksamensdagar for alle trekkfag som
  elevane normalt tek p\u00e5 Vg3.\\n2. Offentleggjeringa av eksamenstrekket vert
  flytta, slik at elevane/deltakarane blir kjende med trekket tidlegare, t.d. to eller
  tre veker f\u00f8r f\u00f8rste eksamen.\\n3. Standpunktkarakterar vert ikkje lenger
  sette f\u00f8r lokalt gitt eksamen er gjennomf\u00f8rt. Det er gjort framlegg om
  fleire alternative endringar, m.a. at standpunktkarakterar skal setjast seinast
  dagen f\u00f8r fellessensurm\u00f8tet, samstundes som eksamenskarakterane ved lokalt
  gitt eksamen ikkje kan offentleggjerast f\u00f8r etter fellessensurm\u00f8te.\\n4.
  Det er ikkje naudsynt at skule\u00e5ret varer i 38 veker, s\u00e5 lenge all oppl\u00e6ring
  vert gjennomf\u00f8rt. Det er gjort framlegg om fleire alternativ til endring.\\n\\nUtdanningsdirektoratet
  har stilt eitt eller fleire sp\u00f8rsm\u00e5l til dei fire hovudutfordringane.
  Sp\u00f8rsm\u00e5la skal svarast p\u00e5 med ja, nei eller veit ikkje og eventuelle
  kommentarar. Nedanfor f\u00f8lgjer fylkesr\u00e5dmannen sitt forslag til h\u00f8yringsuttale
  fr\u00e5 skuleeigar med kommentarar.\\n\\n1) Avkorting av eksamensperioden ved at
  eksamen p\u00e5 studief\u00f8rebuande kan gjennomf\u00f8rast p\u00e5 fem dagar ved
  \u00e5 ha to alternative eksamensdagar for alle trekkfag som elevane normalt tek
  p\u00e5 Vg3:\\n\\nSvar: JA\\n\\nKommentar:\\n\\nKortare eksamensperiode vil gje
  rom for lengre periode med ordin\u00e6r undervisning i slutten av skule\u00e5ret.
  Skulane kan planlegge betre, slik at f\u00e6rre undervisningstimar fell bort.\\n\\nFor
  \u00e5 opne for alle kombinasjonar av programfag p\u00e5 fem dagar m\u00e5 det vere
  to alternative eksamensdagar for trekkfaga, og det m\u00e5 utarbeidast to alternative
  oppg\u00e5vesett. Det kan medf\u00f8re at elevar kan oppfatte oppg\u00e5vene som
  urettferdige basert p\u00e5 eigen kompetanse eller at oppg\u00e5vene har ulik vanskegrad.
  Det kan igjen f\u00f8re til debatt om kor p\u00e5litelege eksamensresultata er og
  om oppg\u00e5vesetta m\u00e5ler elevane sin kompetanse p\u00e5 same m\u00e5te. Det
  vil difor vere viktig \u00e5 legge ned mykje ressursar i kvalitetssikring av oppg\u00e5vene.\\n\\nForslaget
  kan skape praktiske utfordringar i samband med avvikling av skriftleg eksamen for
  privatistar. N\u00e5r det er mange fagkodar p\u00e5 same dag, kan talet p\u00e5
  kandidatar bli sv\u00e6rt h\u00f8gt, noko som kan gjere det utfordrande \u00e5 finne
  eigna lokale.\\n\\nI innleiinga skriv Utdanningsdirektoratet at det skal m\u00e5
  lagast to alternative oppg\u00e5vesett i dei sentrale programfaga. Sidan det er
  relativt f\u00e5 elevar som tek programfag i framandspr\u00e5k p\u00e5 niv\u00e5
  III, reknar vi med at desse faga ikkje er rekna som sentrale programfag og at det
  difor ikkje er naturleg at det blir laga to alternative oppg\u00e5vesett i desse
  faga.\\n\\nTalet p\u00e5 privatistar som tek programfag i framandspr\u00e5k p\u00e5
  niv\u00e5 III, er relativt h\u00f8gt, og fleirtalet av desse kandidatane tek berre
  denne eine skriftlege eksamenen.\\n\\nForslaget legg opp til at den st\u00f8rste
  eksamensdagen for elevar vil blir fredagen. Dette gjeld truleg ogs\u00e5 for privatistar,
  og vi reknar med at det vil vere ekstra utfordrande \u00e5 finne store nok lokale
  denne dagen.\\n\\nVi reknar med at det med \u00absentrale programfag\u00bb er meint
  dei programfaga det er vanlegast at elevar tek. Medan det er relativt f\u00e5 elevar
  som tek programfag i framandspr\u00e5k p\u00e5 niv\u00e5 III, er dette fag med mange
  privatistar. Vi foresl\u00e5r at eksamen i programfag p\u00e5 niv\u00e5 III og andre
  \u00abikkje sentrale programfag\u00bb, der det ikkje er naturleg \u00e5 laga alternative
  oppg\u00e5vesett, blir lagt til onsdag. Dette vil redusere presset p\u00e5 fredagen
  og kan bidra til at det blir enklare \u00e5 avvikle privatisteksamen. Sidan det
  er f\u00e5 elevar som tek desse faga, vil dette truleg ikkje ha s\u00e6rleg innverknad
  p\u00e5 eleveksamen.\\n\\nKommentar:\\n\\nKortare eksamensperiode vil gje rom for
  lengre periode med ordin\u00e6r undervisning i slutten av skule\u00e5ret. Skulane
  kan planlegge betre, slik at f\u00e6rre undervisningstimar fell bort.\\n\\nSvar:
  Veit ikkje\\n\\nKommentar:\\n\\nI h\u00f8yringsbrevet skriv Utdanningsdirektoratet
  at dei \u00f8konomiske og administrative konsekvensane for fylkeskommunane skal
  ytterlegare utgreiast.\\n\\nHordaland fylkeskommune har sv\u00e6rt mange privatistar.
  Ved ei komprimering av eksamensperioden kan det vere utfordrande \u00e5 finne tilstrekkeleg
  lokale til avvikling av eksamen. Det kan medf\u00f8re auka leigekostnader og auka
  kostnader til vakthald m.m. Det er viktig at ogs\u00e5 dette vert vurdert som ein
  del av dei \u00f8konomiske og administrative konsekvensane.\\n\\n2) Offentleggjeringa
  av eksamenstrekket vert flytta, slik at elevane/deltakarane blir kjent med trekket
  tidlegare, t.d. to eller tre veker f\u00f8r f\u00f8rste eksamen.\\n\\nKommentar:\\n\\nTidlegare
  offentleggjering av trekket vil gjere det enklare for skulane \u00e5 planlegge siste
  del av skule\u00e5ret.\\n\\nKommentar:\\n\\nEksamensperioden i mai fell ofte saman
  med mange heilagdagar. Fylkesr\u00e5dmannen meiner difor at offentleggjering av
  trekket b\u00f8r gjerast 10 yrkedagar f\u00f8r perioden for skriftleg eksamen startar.\\n\\nFlytting
  av eksamenstrekket vil gje elevane betre tid til \u00e5 f\u00f8rebu seg til eksamen.
  I dagens ordning er det sv\u00e6rt ulik tid til f\u00f8rebuing avhengig av om eksamen
  som eleven vert trekt ut til, kjem tidleg eller seint i eksamensperioden.\\n\\nI
  h\u00f8yringsskrivet vert det diskutert om tidlegare offentleggjering av trekket
  vil f\u00f8re til at elevane rettar fokuset sitt mot trekkfaget og nedprioriterer
  andre fag. Samstundes vil godt arbeid med vurdering for l\u00e6ring, oppf\u00f8lging
  av l\u00e6ringsprosessar og god kvalitetssikring av standpunktvurderingane motivere
  elevane til \u00e5 arbeide jamt med faga. I neste hovudpunkt vert tidspunkt for
  fastsetting av standpunktkarakterar diskutert.\\n\\nDersom standpunktkarakterar
  vert sette seinare p\u00e5 skule\u00e5ret, er det ogs\u00e5 ein motivasjon for elevane
  til \u00e5 jobbe vidare med faga som ikkje er trekt ut til eksamen.\\n\\nSvar :
  Ja\\n\\nSvar: Felles for alle\\n\\nKommentar: Skiljet mellom lokalt gitt og sentralt
  gitt eksamen er ikkje noko som elevar og privatistar er kjende med. Elevar har fokus
  p\u00e5 om det er ein skriftleg eller ein ikkje-skriftleg eksamen det er snakk om.
  Det er ogs\u00e5 enklare for elevane \u00e5 halde seg til ein dato for offentleggjering
  av trekk.\\n\\nSvar: Nei\\n\\n3) Standpunktkarakterar vert ikkje lenger sett f\u00f8r
  lokalt gitt eksamen er gjennomf\u00f8rt. Det er forslag om fleire alternative endringar,
  m.a. at standpunktkarakterar skal setjast seinast dagen f\u00f8r fellessensurm\u00f8tet,
  samstundes som eksamenskarakterane ved lokalt gitt eksamen ikkje kan offentleggjerast
  f\u00f8r etter fellessensurm\u00f8te.\\n\\nKommentar:\\n\\nDersom standpunktkarakterar
  ikkje vert sett f\u00f8r lokalt gitt eksamen er gjennomf\u00f8rt, vil det bidra
  \u00e5 halde oppe elevane sin motivasjon for \u00e5 gjere ein innsats i faga ogs\u00e5
  i siste del av skule\u00e5ret.\\n\\nMed denne endringa vil i praksis lokalt gitt
  skriftleg eksamen ogs\u00e5 f\u00e5 fellessensur.\\n\\nDet er viktig med god grunngjeving,
  for standpunktkarakter kan bli p\u00e5verka av eksamenskarakter. Karakter for lokalt
  gitt eksamen vert gjort offentleg etter fellessensur.\\n\\nAlle skriftlege eksamenar,
  b\u00e5de lokale og sentrale, blir arrangerte i Utdanningsdirektoratet si eksamensteneste
  PAS. I PAS er det  same fristar for offentleggjering av sensur for b\u00e5de lokal
  og sentral eksamen. Sidan skiljet mellom lokal og sentral skriftleg eksamen ikkje
  er noko som har praktisk meining for elevar og privatistar, vil det vere f\u00f8rem\u00e5lstenleg
  at sensuren blir kunngjort samstundes. N\u00e5r det gjeld ikkjeskriftleg lokal eksamen
  er det truleg best at sensuren blir kunngjort til kandidaten n\u00e5r eksamen rett
  etter at eksamen er gjennomf\u00f8rt.\\n\\nKommentarar:\\n\\nEndringane kan f\u00f8re
  til komprimert tidsrom for klagebehandling. Det kan gje auka arbeidspress p\u00e5
  dei fylkeskommunale klagenemndene i ein periode.\\n\\nN\u00e5r eksamens- og standpunktkarakterar
  f\u00e5r om lag same offentleggjeringsdato, vil det vere enklare \u00e5 kommunisere
  ut tidspunkt for offentleggjering.\\n\\n4) Det er ikkje naudsynt at skule\u00e5ret
  varer i 38 veker, s\u00e5 lenge all oppl\u00e6ring vert gjennomf\u00f8rt. Det er
  gjort framlegg om fleire alternativ til endring.\\n\\nKommentar:\\n\\nFylkesr\u00e5dmannen
  er positiv til ei meir fleksibel l\u00f8ysing med omsyn til lengda p\u00e5 skule\u00e5ret,
  fordi det gjer det mogeleg \u00e5 gjennomf\u00f8re undervisninga i ein komprimert
  periode.\\n\\nKommentar: Dette vil gje skulane st\u00f8rre handlingsrom og gode
  vilk\u00e5r for lokale tilpassingar, men det er viktig at skuleeigar sikrar at ein
  slik fleksibilitet vert forvalta p\u00e5 ein god m\u00e5te p\u00e5 skulane.\\n\\nIverksetting\\n\\nSvar:
