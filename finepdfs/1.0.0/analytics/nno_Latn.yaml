sample: '["\"Saksprotokoll i Hordaland fagskulestyre - 27.01.2015\\n\\nForslag til
  vedtak\\n\\nHordaland fagskulestyre gjev sin tilslutnad til at Fagskolane i Hordaland
  vert omfatta av dei nye retningslinene for avsetjing av frie fond. Dei nye retningslinene
  for avsetjing av frie fond inneber at ein skule ikkje vil kunne ha meir enn 5 %
  av sitt reviderte \u00e5rsbudsjett i frie fond. Administrasjonen ved Oppl\u00e6ringsavdelinga
  vil tilr\u00e5 at Hordaland fagskulestyre gjev sin tilslutnad til ordninga, av di
  fagskulane vil vere tent med \u00e5 vere innlemma i denne.\\n\\nSaksprotokoll i
  Hordaland fagskulestyre - 27.01.2015\\n\\nStyreleiar Roald Stenseide sette fram
  f\u00f8lgjande forslag:\\n\\n1. Hordaland fagskulestyre gjev sin tilslutnad til
  at Fagskolane i Hordaland vert omfatta av dei nye retningslinene for avsetjing av
  frie fond. Dei nye retningslinene for avsetjing av frie fond inneber at ein skule
  ikkje vil kunne ha meir enn 5 % av sitt reviderte \u00e5rsbudsjett i frie fond.\\n2.
  F\u00f8r sak fremmes ang. fondsbruk og disponeringer om investeringsmidler for oppl\u00e6rings-
  og\\nhelseutvalget, skal styret i fagskolene ha saken til uttale.\\n3. Styret fremlegger
  investeringsbehov i fagskolen for administrasjonen, f\u00f8r det fremmes politisk
  sak.\\n4. Fondsavsettinga ved fagskulane per 31.12.2014 ser fagskolestyret p\u00e5
  som disponert.\\n\\nR\u00f8ysting\\n\\nStyreleiar sitt forslag vart samr\u00f8ystes
  vedteke. Administrasjonen sitt forslag fekk ingen r\u00f8yster.\\n\\nVedtak\\n\\n1.
  Hordaland fagskulestyre gjev sin tilslutnad til at Fagskolane i Hordaland vert omfatta
  av dei nye retningslinene for avsetjing av frie fond. Dei nye retningslinene for
  avsetjing av frie fond inneber at ein skule ikkje vil kunne ha meir enn 5 % av sitt
  reviderte \u00e5rsbudsjett i frie fond.\\n2. F\u00f8r sak fremmes ang. fondsbruk
  og disponeringer om investeringsmidler for oppl\u00e6rings- og helseutvalget, skal
  styret i fagskolene ha saken til uttale.\\n3. Styret fremlegger investeringsbehov
  i fagskolen for administrasjonen, f\u00f8r det fremmes politisk sak.\\n4. Fondsavsettinga
  ved fagskulane per 31.12.2014 ser fagskolestyret p\u00e5 som disponert.\"", "\"V\u00e5r
  ref\\n\\n20/651-4\\n\\nDykkar ref\\n\\nSaksbehandlar\\n\\nVigdis Randine R\u00f8rstad
  Lobenz 16.04.2020\\n\\nDato\\n\\nVedtak av detaljregulering fv. 601 Angedalsvegen
  del 1, varsel\\n\\nFormannskapet 1 i Sunnfjord kommune har i samsvar med plan- og
  bygningslova \u00a7 12-12 vedteke Detaljregulering fv. 601 Angedalsvegen i sak 0060/20
  den 26.03.2020\\n\\nFormannskapet hadde planlagt synfaring 19. mars, men pga koronautbrotet
  blei synfaringa avlyst. I standen blei denne saka handsama p\u00e5 vanleg m\u00e5te.
  Planen vart vedteke slik den var lagt.\\n\\nDetaljreguleringsplan for del av fv.
  601 Angedalsvegen legg til rette for \u00e5 etablere sykkelveg med fortau langs
  Angedalsvegen. Omr\u00e5det i planen har ei lengd p\u00e5 om lag 400 meter. Planen
  viser fortau med separat sykkelveg og k\u00f8yreveg p\u00e5 oppsida av Angedalsvegen.
  Veglinja vert om lag slik den er i dag, men veganlegget vert heva inntil 0,5 meter
  for \u00e5 kome klar 200 \u00e5rs flaum med klimap\u00e5slag. Bygging av denne l\u00f8ysinga
  gjer at ein m\u00e5 l\u00f8yse inn 3 eigedommar og rive tilh\u00f8yrande bustadhus.
  Fleire eigedommar og bygningar f\u00e5r fortau og sykkelveg mykje n\u00e6rmare seg
  enn slik tilh\u00f8va er i dag. Krysset med Kyrkjevegen er flytta litt lengre s\u00f8r.\\n\\nPlanen
  er endra noko etter h\u00f8yring og offentleg ettersyn. Endringane er lista opp
  i saksutgreiinga som de finn her: www.sunnfjord.kommune.no under kunngjeringar.\\n\\nDet
  er utarbeidd ein eigen plan for Angedalsvegen fr\u00e5 Presteholten til Sl\u00e5tten
  skule. Angedalsvegen skal byggast ut samla som eitt\\n\\nBes\u00f8k: Hafstadvegen
  42, 6802 F\u00f8rde\\n\\nPost: Postboks 338, 6802 F\u00f8rde\\n\\nOrg.nr: 921244207\\n\\nemail@example.com
  www.sunnfjordkommune.no\\n\\nprosjekt. I anleggstida skal det til rette leggast
  for og visast spesielt omsyn til at det er mange g\u00e5ande og syklande. Berekna
  oppstart av anleggsarbeid er f\u00f8rste halvdel av 2022.\\n\\nPlanen vil erstatte
  delar av desse planane:\\n\\nKyrkjevegen aust, vedteken 13.07.2000, Presteholten,
  vedteken 25.09.1974, Presteholten, endring gbnr 21 \u2013 139, vedteken 09.07.1986,
  Prestebakken terrasse, vedteken 21.01.1997.\\n\\nVedtaket vert kunngjort i avisa
  Firda og www.sunnfjord.kommune.no under kunngjeringar. Grunneigarar, naboar og offentlege
  mynde vert s\u00e5 vidt mogeleg varsla direkte med dette brevet.\\n\\nMed helsing\\n\\nVigdis
  Randine R\u00f8rstad Lobenz r\u00e5dgjevar tlf: 57 82 87 80 mob: 975 17 380 firstname.lastname@example.org\\n\\nDette
  brevet er elektronisk godkjent om det ikkje er signert.\\n\\nVedlegg:\\n\\nPlan
  21 Rettsverknad reguleringsplan pbl 2017 Plan 22 Klagerett\\n\\nSide 2 av 2\"",
  "\"Byggerettleiar for SVR\\n\\nFramlegget til byggerettleiar tek utgangspunkt i  gjeldande
  vernef\u00f8reskrifter og forvaltningsplanar, samt f\u00f8ringar som er gjeve i
  Kongelege resolusjonar, Kronprinsregentens resolusjonar og klageavgjerder. Definisjonar,
  konkrete arealgrenser og formuleringar er i mange h\u00f8ve henta fr\u00e5 siste
  utg\u00e5ve av Heiplanen (Regional plan for Setesdal Vesthei, Ryfylkeheiane og Setesdal
  Austhei), eller ein tilsvarande byggerettleiar for Hardangervidda. Verneomr\u00e5destyret
  tek derfor atterhald i h\u00f8ve til eventuelle endringar i den endeleg godkjente
  utg\u00e5va av Heiplanen.\\n\\nVerneomr\u00e5destyret \u00f8nskjer \u00e5 leggje
  byggerettleiaren til grunn for forvaltningspraksisen fram til ny forvaltningsplan
  er godkjent. Det m\u00e5 understrekast at sj\u00f8lv om meir presise byggereglar
  kjem p\u00e5 plass, vil det framleis bli gjort ei konkret vurdering av behovet for
  det oms\u00f8kte byggetiltaket i kvar einskilt byggesak, samt ei konkret vurdering
  av forholdet til verneverdiane (jf. naturmangfaldlova \u00a77).\\n\\nVurdering etter
  naturmangfaldlova\\n\\nEtter \u00a7 7 i Naturmangfaldlova skal dei milj\u00f8rettslege
  prinsippa i \u00a7 8 til 12 leggast til grunn som retningslinjer ved ut\u00f8ving
  av offentleg myndigheit. Forvaltingsmyndigheita m\u00e5 vurdere alle tiltak som
  vedkjem naturmangfaldet etter desse paragrafane.\\n\\nMange av sidene ved naturmangfaldet
  i dei ulike verneomr\u00e5da i SVR, er relativt godt dokumentert gjennom ulike naturfaglege
  kartleggingar og unders\u00f8kingar. For villrein som er ein del av vernef\u00f8rem\u00e5let
  i fleire av verneomr\u00e5da, har ein mellom anna f\u00e5tt dokumentert omr\u00e5debruken
  gjennom to st\u00f8rre dokumentasjonsprosjekt. Dette dreier seg om sluttrapporten
  fr\u00e5 GPSmerkeprosjektet. Villreinens bruk av Setesdalsheiene (NINA rapport 694/2011)
  , og Norsk Villreinsenters rapport: Kartlegging av villreinens arealbruk i Setesdal
  Vesthei - Ryfylkeheiene og Setesdal Austhei (NVS rapport 6/2010).\\n\\nOpplysningar
  om andre sider ved naturmangfaldet kan hentast fr\u00e5 Artsdatabanken sitt Artskart,
  Direktoratet for naturforvaltning sin Naturbase, samt andre kartleggingar av biologisk
  mangfald. Her vil ein mellom anna finne opplysningar om prioriterte arter, trua
  eller n\u00e6r trua arter p\u00e5 Norsk r\u00f8dliste for arter 2010. Ein vil og
  finne opplysningar om utvalte naturtypar, trua eller n\u00e6r trua naturtypar p\u00e5
  Norsk r\u00f8dliste for naturtypar 2011.\\n\\nOpplysningar om ulike former for kulturminne
  vi verneomr\u00e5da vil ein finne i SEFRAK registera, databasen Askeladden, og ei
  lang rekke registreringar av kulturminne fr\u00e5 Arkeologisk museum Stavanger.
  Samt ein rapport fr\u00e5 Telemark fylkeskommune fr\u00e5 2011.\\n\\nDet ligg ikkje
  f\u00f8re ei n\u00f8yaktig oversikt over talet p\u00e5 eksisterande bygningar i
  dei ulike verneomr\u00e5da. Det finns heller ikkje ei oversikt over korleis desse
  bygningane fordelar seg p\u00e5 dei ulike bygningstypane ein opererer med i byggerettleiaren.
  Ei viss oversikt over talet p\u00e5 bygningar har ein gjennom forarbeida i samband
  med Regional plan for Setesdal Vesthei, Ryfylkeheiane og Setesdal Austhei. Mange
  av verneomr\u00e5da er og s\u00e5pass sm\u00e5 at vernestyresmakta har god oversikt
  over talet p\u00e5 bygningar. N\u00e5r det gjeld det totale talet p\u00e5 bygningar
  i verneomr\u00e5da og korleis dei fordelar seg p\u00e5 ulike bygningstypa, er det
  behov for meir kunnskap. Derfor vil det fr\u00e5 sommaren 2013 bli sett i gang ei
  slik registrering.\\n\\nKunnskapsgrunnlaget (\u00a78) som ligg f\u00f8re for \u00e5
  vurdere dei oms\u00f8kte tiltaka si innverknad p\u00e5 verneverdiar og vernef\u00f8rem\u00e5l,
  m\u00e5 derfor vurderast som tilstrekkeleg til at forvaltningsstyresmakta kan fatte
  vedtak i saka. \u00a79 om \\\"F\u00f8re var prinsippet\\\" vil derfor bli tillagt
  mindre vekt i dei f\u00f8lgjande vurderingane.\\n\\nDet totale belastninga (\u00a710)
  blir i liten grad p\u00e5verka av byggerettleiaren. Byggerettleiaren vil ikkje f\u00f8re
  til fleire nybygg eller til at fleire eksisterande bygg kan restaurerast eller byggast
  om. Byggerettleiaren vi derimot f\u00f8re til at fleire bygningar kan utvidast.
  Byggerettleiaren endrar den \u00f8vre arealgrensa for bygningar Setesdal Vesthei-Ryfylkeheiane
  landskapsvernomr\u00e5de fr\u00e5 30m\u00b2 til 45m\u00b2. Dette kan medf\u00f8re
  at ein del bygningar som tidlegare var for store til \u00e5 kunne utvidast, n\u00e5
  kan utvidast. Desse endringane vil og f\u00f8re til at kvar utviding kan bli noko
  meir omfattande enn dei kunne tidlegare. Det auka talet p\u00e5 utvidingar og den
  auka storleiken p\u00e5 utvidingane, kan og f\u00f8re med seg fleire s\u00f8knadar
  om motorisert ferdsle i samband med desse byggeprosjekta.\\n\\nSamstundes vil ikkje
  talet p\u00e5 slike byggeprosjekt bli s\u00e6rleg stort. Mange eksisterande bygg
  er allereie over eller tett oppunder den \u00f8vre arealgrensa. Motorferdsla i samband
  med slike byggeprosjekt vil og bli avgrensa. Det store fleirtalet av bygningane
  i verneomr\u00e5da er lokalisert like p\u00e5 innsida av vernegrensa, og vil derfor
  ikkje gje motorferdsle i s\u00e5rbare omr\u00e5de. Faren for milj\u00f8 forringing
  blir derfor vurdert som liten(\u00a711).\\n\\nSj\u00f8lv om byggerettleiaren si
  harmonisering av forvaltningspraksisen i dei ulike verneomr\u00e5da medf\u00f8rer
  auka arealgrenser nokre stader. Vurderer likevel verneomr\u00e5destyret ei slik
  l\u00f8ysing som det beste alternativet \u00a7(12). Med innf\u00f8ringa av den nye
  forvaltningsordninga, kom og forventningane om felles byggereglar og likebehandling.
  Samstundes er vernef\u00f8reskriftene for dei ulike verneomr\u00e5da forskjellige
  n\u00e5r det gjeld ulike byggetiltak. Byggerettleiaren er derfor eit viktig reiskap
  for \u00e5 finne den rette balansen mellom forventningane om likebehandling, og
  f\u00f8ringane som er gjevne i dei ulike vernef\u00f8reskriftene.\\n\\nS\u00f8knads-
  og sakshandsamingsreglar\\n\\nForvaltningsstyresmakt og lovverk\\n\\nVerneomr\u00e5destyret
  for Setesdal Vesthei, Ryfylkeheiane og Frafjordheiane har forvaltningsmynde for
  Kvanndalen, Dyraheio, Vormedalsheia, Lusaheia, Frafjordheiane og Setsdal Vesthei/Ryfylkeheiane
  landskapsvernomr\u00e5der, samt Holmevass\u00e5no og Steinbuskardet-Hisdal biotopvernomr\u00e5der.
  Verneomr\u00e5destyret handsamar byggjes\u00f8knadar etter vernef\u00f8reskriftene
  for dei ulike verneomr\u00e5da og naturmangfaldlova. Alle byggjes\u00f8knader skal
  og handsamast av kommunane etter plan og bygningslova. Verneomr\u00e5destyret og
  kommunane skal likevel samordne si sakshandsaming, slik at den samla sakshandsamingstida
  ikkje blir lenger enn naudsynt.\\n\\nSaksgang i bygges\u00f8knadar\\n\\nAlle (privatpersonar,
  lag og organisasjonar, offentlege etatar) som har planar om s\u00f8knadspliktige
  tiltak i eit av verneomr\u00e5da, skal sende s\u00f8knad om dispensasjon til verneomr\u00e5destyret
  (firstname.lastname@example.org), samt til den kommunen der tiltaket er planlagt.
  S\u00f8knaden skal normalt handsamast etter det strengaste regelverket f\u00f8rst.
  Dette inneber som regel at saka f\u00f8rst skal handsamast av verneomr\u00e5destyret
  etter verneforskrifta, s\u00e5 av kommunen etter plan- og bygningslova. I byggesaker
  i landskapsvernomr\u00e5de vil plan- og bygningslova kunne ha strengare krav. I
  slike tilfelle vil det vere naturlig at kommunen handsamar saka f\u00f8rst, etter
  samtykke fr\u00e5 forvaltningsstyresmakta.\\n\\nEin anbefaler alle s\u00f8karar
  \u00e5 ha eit avklaringsm\u00f8te med forvaltningssekretariatet, s\u00e5 tidleg
  som r\u00e5d i prosessen, f\u00f8r full s\u00f8knad og byggeteikningar blir laga.\\n\\nEtter
  at s\u00f8knaden er motteken i forvaltingssekretariatet, blir det sendt eit f\u00f8rebels
  svar til s\u00f8kjar dersom saka ikkje kan handsamast innan av 4 veker.\\n\\nVerneomr\u00e5destyret
  har delegert til eit arbeidsutval \u00e5 handsame mindre omfattande byggjesaker,
  samt \u00e5 vurdere n\u00e5r ein byggjesak m\u00e5 opp i eit samla styre. Arbeidsutvalet
  har m\u00f8te ein gong kvar m\u00e5nad. Eit samla Verneomr\u00e5destyret handsamar
  alle sakar som omfattar nybygg og andre store byggjesaker. Verneomr\u00e5destyret
  har m\u00f8te tre gonger i \u00e5ret. S\u00f8knadar om st\u00f8rre byggjetiltak
  m\u00e5 derfor sendast inn i god tid.\\n\\nInnhald i bygges\u00f8knadar\\n\\nAlle
  bygges\u00f8knadar skal innehalde:\\n\\nDefinisjon av viktige omgrep\\n\\nLandbruksdrift\\n\\nEttersom
  bygg i tilknyting til landbruksdrift kjem i ei s\u00e6rstilling b\u00e5de i h\u00f8ve
  til arealgrenser og moglegheit for nybygg, er det viktig med ei klar forst\u00e5ing
  av kva for verksemd som fell innunder dette omgrepet.\\n\\nI Byggerettleiaren for
  SVR tek ein utgangspunkt i definisjonane som er gjevne i Milj\u00f8verndepartementets
  og Landbruks- og Matdepartementet sin vegleiar T-1443, Plan og bygningsloven og
  Landbruk Pluss, fr\u00e5 2005. I vegleiar T-1443 dreg ein desse grensene for kva
  for bygningar og verksemder som ein del av landbruksomgrepet:\\n\\nBygningar for
  seterdrift og skogsdrift\\n\\n(st\u00f8lar, seterhus, driftshytter, skogskoier m.v.)\\n\\nSlike
  bygningar fell inn under landbruksomgrepet, dersom bruken er knytt til tradisjonell
  seterdrift, sauesanking, gjeting/ettersyn av dyr p\u00e5 utmarksbeite, hogst m.v.
  Bruk til andre form\u00e5l, slik som utleie, er tillete i avgrensa deler av \u00e5ret.\\n\\nSlike
  bygningar fell ikkje inn under landbruksomgrepet, dersom bygningen i hovudsak\\n\\n-
  namn p\u00e5 s\u00f8ker, gards og bruksnummer\\n- at det s\u00f8kes om dispensasjon
  fr\u00e5 vernef\u00f8reskrifta\\n- kort beskriving av tiltaket\\n- grunngjeving
  for tiltaket, beskriving av behov for tiltaket -naudsynt dokumentasjon av tiltaket
  si verknad p\u00e5 verneverdiane\\n- kva for transportmiddel som skal nyttast til
  transport av byggematerialar, og om lag kor mange transportar som er naudsynt\\n-
  korleis transport og gjennomf\u00f8ring kan gjerast mest mogleg sk\u00e5nsamt\\n-
  oversiktskart som viser plassering i landskapet\\n- situasjonskart (ca 1:1000) som
  viser plassering i terrenget\\n- byggeteikningar over plan, snitt og fasade\\n-
  bilde som viser bygningens sin plassering i terrenget, og bilde av eventuelle eksisterande
  bygningar p\u00e5 staden\\n\\nbrukast til fritidsbustad eller annen verksemd utan
  n\u00e6ringsmessig tilknyting til garden.\\n\\nNaust, rorbuer, jakt- og fiskebuer,
  jaktt\u00e5rn m.v.\\n\\n(I SVR gjeld dette i hovudsak naust og jakt- og fiskebuer)\\n\\nSlike
  bygningar fell inn under landbruksomgrepet, dersom bygningen er naudsynt i samband
  med ut\u00f8ving av landbruksn\u00e6ring. Utleige i deler av \u00e5ret er tillete.\\n\\nSlike
  bygningar fell ikkje inn under landbruksomgrepet, dersom bygningen i hovudsak er
  knytt til turisme, frilufts- eller fritidsaktivitet og b\u00e6rplukking, jakt eller
  fritidsfiske som berre utgjer\\n\\neit naturaltilskott til eige hushald.\\n\\nNedfalne
  st\u00f8lshus og h\u00f8ybuer\\n\\nN\u00e5r det ikkje er i strid med vernef\u00f8rem\u00e5let,
  og det kan dokumenterast tilstrekkeleg behov for tiltaket, \u00f8nskjer verneomr\u00e5destyret
  \u00e5 opne for oppattbygging av nedfalne st\u00f8lshus og h\u00f8ybuer. Dette er
  eit tiltak som kan bidra til \u00e5 oppretthalde st\u00f8lslandskapet. Ei slik oppattbygging
  av nedfalne bygningar er og i tr\u00e5d med retningslinene for Nasjonalt Villreinomr\u00e5de
  i Heiplanen. Retningslinjer for denne type byggeprosjekt vil bli utarbeida i samr\u00e5d
  med kulturminnestyresmakta.\\n\\nNedfalne st\u00f8lshus og h\u00f8ybuer definerast
  som: \\\"tidlegare bygningar kor storleik og plassering er klart definert av eksisterande
  murar, og bygninganes funksjon og utsj\u00e5nad er godt dokumentert gjennom foto
  eller kulturhistoriske registreringar. H\u00f8ybuer er uisolerte mindre bygg for
  lagring av turrh\u00f8y\\\".\\n\\nGenerelle byggeregler\\n\\nInnvendig vedlikehald
  og normalt utvendig vedlikehald, som skifte av kledning, vindauge og anna som ikkje
  f\u00f8rer til endring av storleik og fasade, er tillate utan s\u00f8knad. 1 Som
  endring av fasade reknast til d\u00f8mes, skifte til anna type kledning, anna type
  glas og d\u00f8r, og anna taktekking. Slike tiltak reknast ikkje som vedlikehald,
  og er derfor s\u00f8knadspliktig.\\n\\nFor alle s\u00f8knadspliktige byggjetiltak
  m\u00e5 s\u00f8kar gjere greie for behovet for tiltaket.\\n\\nAlle formar for nybygg,
  samt utvidingar og ombygging av eksisterande bygningar er s\u00f8knadspliktig. Dette
  gjeld og mindre byggetiltak som fasadeendring og overbygg.\\n\\nDet blir ikkje gjeve
  l\u00f8yve til bygging av nye fritidshus. Unntaka er 3-6 hytter i Grydalen hytteomr\u00e5de  i
  SVR og eksisterande hytteomr\u00e5de i Vormedalsheia. 2 Det kan gjevast l\u00f8yve
  til utviding av eksisterande fritidshus dersom det ikkje er i strid med vernef\u00f8rem\u00e5let
  og tilstrekkeleg behov kan dokumenterast.\\n\\nOm det ikkje er i strid med vernef\u00f8rem\u00e5let,
  og det kan dokumenterast tilstrekkeleg behov for tiltaket, kan det gjevast l\u00f8yve
  til nybygg, og utviding av eksisterande bygningar, i samband med landbruksdrift.\\n\\nDet
  er normalt ikkje h\u00f8ve til bruksendring av uthus, utl\u00f8er, naust ol\\n\\n1
  At alminneleg vedlikehald ikkje er s\u00f8knadspliktig, er heimla p\u00e5 desse
  stadene i dei ulike vernef\u00f8reskriftene; Dyraheio og Kvanndalen kapittel IV,
  punkt 1.2, bokstav a. Holmevass\u00e5no kapittel V, punkt 4. Vormedalsheia og Lusaheia
  kapittel V, punkt 2. Frafjordheiane \u00a73, punkt 1.2, bokstav c. SVR og Steinbuskaret-Hisdal
  kapittel IV, punkt 1.2, bokstav c.\\n\\n2 I Grydalen hytteomr\u00e5de i SVR opnar
  forvaltningsplanen (jf. Punkt 5.3.3) for at det kan s\u00f8kast om dispensasjon
  for 6 ubebygde hyttepunkt som var fr\u00e5delt og inngjekk i Kommuneplan for Sirdal
  ved vernetidspunktet. I Vormedalsheia opnar vernef\u00f8reskrifta sitt kapittel
  VI, punkt 3, for \\\"Oppf\u00f8ring av enkelte hytter i omr\u00e5de der det er hytter
  fr\u00e5 f\u00f8r\\\".\\n\\nL\u00f8yve til gjenreising av bygg, etter heimelen om
  gjenreising av bygg med kulturhistorisk verdi, kan berre gis n\u00e5r form\u00e5let
  med bygget er kulturhistorisk. Slike l\u00f8yve kan berre gis n\u00e5r det ligg
  f\u00f8re ein plan som er utarbeida i samr\u00e5d med kulturminnestyresmakta.\\n\\nKulturminnestyresmakta
  skal ha s\u00f8knadar p\u00e5 h\u00f8yring n\u00e5r dei omfattar bygningar som er
  med i SEFRAK registeret, som er eit landsdekkande register over eldre bygningar
  og andre kulturminne.\\n\\nKrav til dokumentasjon\\n\\nFor s\u00f8knadar om st\u00f8lshus,
  driftshytter, sankehytter og andre bygg i samband med landbruksdrift, m\u00e5 f\u00f8lgjande
  kunne dokumenterast:\\n\\nAt s\u00f8ker er grunneigar eller rettigheitshavar.\\n\\nAt
  bygget er ein del av ei viktig driftsform ved bruket. Denne driftsforma m\u00e5
  inng\u00e5 som ein viktig del av driftsgrunnlaget for bruket\\n\\nAt eigedommen
  er st\u00f8rre enn 3000 dekar\\n\\nAt avstanden fr\u00e5 veg eller anna egna husv\u00e6re
  p\u00e5 eigedommen er over om lag 3 km / 1 times gange\\n\\nDokumentasjonen skal
  bekreftast av kommunen eller lokal landbruksmyndigheit\\n\\nRegler for ulike bygningstypar\\n\\nFor
  at byggereglane skal bli mest mogleg presise, blir dei i det f\u00f8lgjande avsnitta
  relatert  til dei byggesakane som er mest aktuelle i verneomr\u00e5da. Dei omtale
  bygningstypane er anten nemnt i vernef\u00f8reskriftene eller er ein vanleg bygningstype
  i verneomr\u00e5da.\\n\\nSt\u00f8lshus 3\\n\\nGjeld husv\u00e6re knytt til st\u00f8ling
  og beitebruk for dei einskilte bruka. St\u00f8lshus er lokalisert p\u00e5 st\u00f8lsvollar,
  og omfattar b\u00e5de enkeltst\u00e5ande st\u00f8lar og st\u00f8lar som g\u00e5r
  inn i eit st\u00f8rre st\u00f8lsmilj\u00f8.\\n\\n3 I Dyraheio og Kvanndalen er nybygg
  i samband med landbruksdrift heimla i vernef\u00f8reskrifta sitt kapittel IV, punkt
  1.3, bokstav b. Endring og utviding av eksisterande bygningar er heimla i vernef\u00f8reskrifta
  sitt kapittel IV, punkt 1.3, bokstav a.\\n\\nI Holmevass\u00e5no er endring og utviding
  av eksisterande bygningar er heimla i vernef\u00f8reskrifta sitt kapittel VI, punkt
  1.\\n\\nI Vormedalsheia er nybygg i samband med landbruksdrift heimla i vernef\u00f8reskrifta
  sitt kapittel VI, punkt 2. I Frafjordheiane er nybygg i samband med landbruksdrift
  heimla i vernef\u00f8reskrifta sin \u00a73, punkt 1.3, bokstav e. Endring og utviding
  av eksisterande bygningar er heimla i vernef\u00f8reskrifta sin \u00a73, punkt 1.3,
  bokstav a. Oppattbygging av bygningar som er g\u00e5tt tapt ved brann eller naturskade
  er heimla i vernef\u00f8reskrifta sin \u00a73,\\n\\npunkt 1.3, bokstav b.\\n\\nI
  SVR og Steinbuskaret-Hisdal er endring og utviding av eksisterande bygningar er
  heimla i vernef\u00f8reskrifta sitt kapittel IV, punkt 1.3, bokstav c.  Oppattbygging
  av bygningar som er g\u00e5tt tapt ved brann eller naturskade  er heimla i vernef\u00f8reskrifta
  sitt kapittel IV, punkt 1.3, bokstav c.\\n\\nNormalt lokaliset i st\u00f8lsomr\u00e5de
  i utkanten av verneomr\u00e5da. Storleik p\u00e5 eksisterande bygg ligg mellom 20m\u00b2
  og 50m\u00b2 med eit gjennomsnitt mellom 30-35m\u00b2\\n\\nN\u00e5r det ikkje strid
  mot vernef\u00f8rem\u00e5let kan vernestyresmakta etter s\u00f8knad gje l\u00f8yve
  til f\u00f8lgjande byggetiltak:\\n\\n* Restaurering/ombygging innanfor eksisterande
  areal, samt oppattsetting av hus som er skadd av brann eller naturskade.\\n* Utviding
  av eksisterande bygningar opptil ein samla storleik p\u00e5 50 m\u00b2 (BYA)\\n*
  Nybygg inntil 50 m\u00b2 (BYA)\\n* Oppattbygging av nedfalne st\u00f8lshus p\u00e5
  eksisterande murar. Opphavleg plassering, storleik, funksjon og utsj\u00e5nad m\u00e5
  dokumenterast gjennom foto eller kulturhistoriske registreringar.\\n* Restaurering
  av tilh\u00f8rande uthus og fj\u00f8s innanfor eksisterande areal, samt oppattsetting
  av uthus som er skadd av brann eller naturskade.\\n\\nBygg knytt til landbruksdrift
  kan f\u00e5 auka areal dersom s\u00e6rlege behov blir dokumentert.\\n\\nAndre driftshusv\u00e6re
  4\\n\\nGjeld enkeltst\u00e5ande husv\u00e6re som brukast i samband med tilsyn og
  sanking av beitedyr. Dette vil oftast dreie seg om driftshytter for st\u00f8rre
  driftseiningar som beitelag og sankelag.\\n\\nSlike hytter er normalt lokaliset
  i l\u00e5gareliggande beiteomr\u00e5de inne i verneomr\u00e5da eller i  st\u00f8lsomr\u00e5de
  i utkanten av verneomr\u00e5da. Storleik p\u00e5 eksisterande bygg  ligg mellom
  30m\u00b2 og 45m\u00b2 med eit gjennomsnitt p\u00e5 om lag 35-40m\u00b2\\n\\nN\u00e5r
  det ikkje strid mot vernef\u00f8rem\u00e5let kan vernestyresmakta etter s\u00f8knad
  gje l\u00f8yve til f\u00f8lgjande byggetiltak:\\n\\n* Restaurering/ombygging innanfor
  eksisterande areal, samt oppattsetting av hus som er skadd av brann eller naturskade.\\n*
  Utviding av til eksisterande bygningar opp til eit samla storleik p\u00e5 45 m\u00b2
  (BYA), inkludert eventuelle eksisterande uthus\\n* Nybygg opp til eit samla storleik
  p\u00e5 45 m\u00b2 (BYA), inkludert eventuelle uthus.\\n* Restaurering av tilh\u00f8rande
  uthus og fj\u00f8s innanfor eksisterande areal, samt oppattsetting av uthus som
  er skadd av brann eller naturskade.\\n\\nBygg knytt til landbruksdrift kan f\u00e5
  auka areal dersom s\u00e6rlege behov blir dokumentert.\\n\\nI Kongeleg resolusjon
  for Lusaheia fr\u00e5 19.04.1991, refererast det til at Fylkesmannen i Rogaland
  i samr\u00e5d med grunneigarane, har komme fram til at det kan byggjast inntil 8
  nye hytter i Lusaheia\\n\\n4 Heimlane er dei same som for st\u00f8lshus bortsett
  fr\u00e5 i Lusaheia, kor det i den Kongelege resolusjonen fr\u00e5 19.04.1991 refererast
  til at Fylkesmannen i Rogaland i samr\u00e5d med grunneigarane har komme fram til
  at det kan byggjast inntil 8 nye hytter i Lusaheia. Pr. 12.03.2013 er to av desse
  hyttene bygd.\\n\\nSankehytter 5\\n\\nGjeld enkeltst\u00e5ande mindre husv\u00e6re
  i samband tilsyn og sanking av beitedyr. Dette dreier seg ofte om mindre driftshytter
  knytt til dei enkelte gardsbruka.\\n\\nNormalt lokaliset i sentrale og h\u00f8gareliggande
  deler av verneomr\u00e5da. Storleik p\u00e5 eksisterande bygg ligg mellom 15m\u00b2
  og 25m\u00b2.\\n\\nN\u00e5r det ikkje strid mot vernef\u00f8rem\u00e5let, og tilstrekkeleg
  behov kan dokumenterast, kan vernestyresmakta etter s\u00f8knad gje l\u00f8yve til
  f\u00f8lgjande byggetiltak:\\n\\n* Restaurering/ombygging innanfor eksisterande
  areal, samt oppattsetting av hus som er skadd av brann eller naturskade.\\n* Utviding
  av og tilbygg til eksisterande bygningar opp til ein samla storleik p\u00e5 25 m\u00b2
  (BYA), inkludert eventuelle eksisterande uthus\\n* Nybygg opp til ein samla storleik
  p\u00e5 25 m\u00b2 (BYA), inkludert eventuelle uthus\\n\\nL\u00f8er , naust o.l.
  6\\n\\nGjeld enkeltst\u00e5ande mindre bygningar i samband med landbruksdrift, som
  ikkje skal nyttast til husv\u00e6re. Lokalisert i utmarka og som regel utanom eksisterande
  st\u00f8lsvollar. Dette kan mellom anna dreie seg om utl\u00f8er, naust og andre
  hus nytta i samband med lagring turrh\u00f8y, b\u00e5tar og materialar.\\n\\nNormalt
  lokaliset i  st\u00f8lsomr\u00e5de i utkanten av verneomr\u00e5da eller ved vatn
  i l\u00e5gareliggande delane av verneomr\u00e5da\\n\\nN\u00e5r det ikkje strid mot
  vernef\u00f8rem\u00e5let kan vernestyresmakta etter s\u00f8knad gje l\u00f8yve til
  f\u00f8lgjande byggetiltak:\\n\\n* Restaurering innanfor eksisterande areal, samt
  oppattsetting av bygningar som er skadd av brann eller naturskade.\\n* Nye naust
  inntil 12m\u00b2 (BYA)\\n* Oppattbygging av nedfalne h\u00f8yl\u00f8er p\u00e5 eksisterande
  murar. Opphavleg plassering, storleik, funksjon og utsj\u00e5nad m\u00e5 dokumenterast
  gjennom foto eller kulturhistoriske registreringar.\\n\\n5 Heimlane er dei same
  som for st\u00f8lshus bortsett fr\u00e5 Dyraheio, Kvanndalen og Holmevass\u00e5no
  som har eigne heimlar for jakt, fiske og gjetarbuer. I Dyraheio og Kvanndalen er
  bygging av jakt, fiske og gjetarbuer heimla i vernef\u00f8reskrifta sitt kapittel
  IV, punkt 1.3, bokstav e.\\n\\nI Holmevass\u00e5no er bygging av jakt, fiske og
  gjetarbuer heimla i vernef\u00f8reskrifta sitt kapittel VI, punkt 2.\\n\\n6 Heimlane
  for restaurering av l\u00f8er og naust innanfor eksisterande areal, samt oppattsetting
  av bygningar som er skadd av brann eller naturskade, er dei same som for st\u00f8lshus.
  Nye naust er ikkje heimla i nokon av vernef\u00f8reskriftene s\u00e5 sant dei ikkje
  kan definerast som bygg til landbruksdrift.\\n\\nFor Dyraheio og Kvanndalen er oppattbygging
  av nedfalne h\u00f8yl\u00f8er p\u00e5 eksisterande murar heimla er heimla i vernef\u00f8reskrifta
  sitt kapittel IV, punkt 1.3, bokstav a. I Holmevass\u00e5no er dette heimla i kapittel
  VI, punkt 1. For Frafjordheiane er oppattbygging av nedfalne h\u00f8yl\u00f8er p\u00e5
  eksisterande murar heimla i vernef\u00f8reskrifta sin \u00a73, punkt 1.3, bokstav
  b.\\n\\nI SVR og Steinbuskaret-Hisdal er oppattbygging av nedfalne h\u00f8yl\u00f8er
  p\u00e5 eksisterande murar heimla i vernef\u00f8reskrifta sitt kapittel IV, punkt
  1.3, bokstav a.\\n\\n7\\n\\nEksisterande fritidshus/hytter\\n\\nGjeld enkeltst\u00e5ande
  fritidshus, lokalisert b\u00e5de p\u00e5 og utanom eksisterande st\u00f8lsvollar.
  Dette kan dreie seg om hytter og tidlegare st\u00f8lshus til bruk kor det ikkje
  lengre er landbruksdrift\\n\\nNormalt lokalisert i st\u00f8lsomr\u00e5de og andre
  l\u00e5gareliggande omr\u00e5de i utkanten av verneomr\u00e5da. Storleik p\u00e5
  eksisterande bygg  ligg mellom 25m\u00b2 og 90m\u00b2, med eit gjennomsnitt p\u00e5
  om lag 40m\u00b2.\\n\\nN\u00e5r det ikkje strid mot vernef\u00f8rem\u00e5let kan
  vernestyresmakta etter s\u00f8knad gje l\u00f8yve til f\u00f8lgjande byggetiltak:\\n\\n*
  Restaurering/ombygging innanfor eksisterande areal, samt oppattsetting av hus som
  er skadd av brann eller naturskade.\\n* Utviding av eksisterande hytter opp til
  ein samla storleik p\u00e5 45 m\u00b2 (BYA), inkludert eventuelle eksisterande uthus,
  terrassar og plattingar\\n* Restaurering av tilh\u00f8rande uthus innanfor eksisterande
  areal, samt oppattsetting av uthus som er skadd av brann eller naturskade.\\n* For
  Grytdalen hytteomr\u00e5de i SVR gjeld det egne reglar fastsett i kommuneplan for
  Sirdal.\\n\\nTuristhytter,  fjellstyrehytter,  statskoghytter, ol 8\\n\\nDei opne
  hyttene til turistforeiningane, fjellstyra, Statsskog  og friluftsr\u00e5d er eit
  fellesgode for allmenta. Dei har og i nokre h\u00f8ve ein kanaliserande effekt som
  har ein positiv innverknad p\u00e5 verneverdiane. I andre h\u00f8ve kan dei v\u00e6re
  plassert slik at dei kan ha ein negativ effekt p\u00e5 villreinens omr\u00e5debruk\\n\\nUtvidingar,
  ombyggingar, flytting, samt oppsetting av tilbygg, uthus og sikringsbuer kan v\u00e6re
  aktuelle byggetiltak i samband med desse anlegga. I nokre sv\u00e6rt sjeldne h\u00f8ve
  kan det og v\u00e6re aktuelt med oppsetting av nye hytter.\\n\\nEttersom desse hyttene
  er sv\u00e6rt ulike i h\u00f8ve til lokalisering, alder, st\u00f8rrelse, standard
  og bruksintensitet, er det ur\u00e5d \u00e5 gje generelle regler for korleis dispensasjonss\u00f8knader
  skal handsamast. Verneomr\u00e5destyret m\u00e5 derfor handsame slike dispensasjonss\u00f8knader
  kvar for seg.\\n\\n7 Heimlane for restaurering/ombygging av fritidshus innanfor
  eksisterande areal, samt oppattsetting av bygningar som er skadd av brann eller
  naturskade, er dei same som for st\u00f8lshus.\\n\\nI Dyraheio og Kvanndalen er
  endring og utviding av eksisterande bygningar er heimla i vernef\u00f8reskrifta
  sitt kapittel IV, punkt 1.3, bokstav a.  I Holmevass\u00e5no er dette heimla i vernef\u00f8reskrifta
  sitt kapittel VI, punkt 1. I Frafjordheiane er endring og utviding av eksisterande
  bygningar er heimla i vernef\u00f8reskrifta sin \u00a73, punkt 1.3, bokstav a.\\n\\nI
  SVR og Steinbuskaret-Hisdal er endring og utviding av eksisterande bygningar er
  heimla i vernef\u00f8reskrifta sitt kapittel IV, punkt 1.3, bokstav c.\\n\\n8 Nybygg
  av turisthytter er for Dyraheio og Kvanndalen heimla i vernef\u00f8reskrifta sitt
  kapittel VI, punkt 1.3, bokstav e. For Frafjordheiane er bygg til friluftsf\u00f8rem\u00e5l
  heimla i vernef\u00f8reskrifta sin \u00a73, punkt 1.3, bokstav f Heimlane for endring
  og utviding av eksisterande bygningar, er dei same som for fritidshus. Heimlane
  for restaurering/ombygging av fritidshus innanfor eksisterande areal, samt oppattsetting
  av bygningar som er skadd av brann eller naturskade, er dei same som for st\u00f8lshus.\\n\\nBygningar
  og anlegg knytt til kraftproduksjon\\n\\nKraftselskapa vil i noko grad ha behov
  vedlikehald og utviding av eksisterande bygningar og anlegg. I nokre h\u00f8ve kan
  det og v\u00e6re behov for nybygg.\\n\\nEttersom slike bygg vil ha ulik storleik
  og funksjon, og er ulikt omtala i dei ulike vernef\u00f8reskriftene, er det ur\u00e5d
  \u00e5 gje generelle regler for korleis dispensasjonss\u00f8knader skal handsamast.\\n\\nVerneomr\u00e5destyret
  m\u00e5 derfor handsame slike dispensasjonss\u00f8knader kvar for seg.\\n\\nSpesielle
  regler\\n\\nGjenreising av bygg med kulturhistorisk verdi\\n\\nFor gjenreising av
  bygg med kulturhistorisk verdi skal det utarbeidast ein plan som mellom anna dokumenterar;
  plassering og bruk av tidlegare bygningar p\u00e5 staden, samt utforming, materialbruk
  og byggeteknikk for det nye bygget. Utarbeidinga av planen skal skje i samr\u00e5d
  med kulturminnestyresmakta.\\n\\nReglar for plassering og utforming av bygg\\n\\nOverordna
  retningsliner\\n\\nAlle bygg skal tilpassas terrenget og eksisterande bygningsmilj\u00f8
  p\u00e5 staden\\n\\nKonkret retningsliner\\n\\nByggingar skal ikkje plasserast eller
  utformast slikt at dei verkar ruvande og dominerande i landskapet, eller blir st\u00e5ande
  i silhuett mot himmelranda\\n\\nAll byggeverksemd skal utf\u00f8rast slik at det
  blir minst mogleg skade p\u00e5 terrenget. Planering av byggetomta er ikkje tillate\\n\\nHytter
  skal ikkje gjerdast inn og det skal ikkje etablerast plen\\n\\nSt\u00f8lshus skal
  ikkje ha veranda eller platting\\n\\nBygg skal ikkje ha meir enn 1 etasje (gjeld
  ikkje st\u00f8rre turisthytter)\\n\\nBygg skal ikkje ha full kjellar med nyttbare
  rom. Krypkjellar er tillate\\n\\nFundamentering skal best\u00e5 av murar av naturstein
  eller st\u00f8ypte p\u00e5lar\\n\\nAlle hus skal ha saltak (gjeld ikkje for mindre
  naust)\\n\\nM\u00f8neretninga skal f\u00f8lgje lengderetninga p\u00e5 bygget\\n\\nFasadane
  skal visa lafta t\u00f8mmer, st\u00e5ande eller liggande trekledning\\n\\nTakvinkel
  og takutstikk skal v\u00e6re i samsvar med tradisjonell byggeskikk i fjellet\\n\\nTaket
  skal tekkes med torv, stein eller tre. P\u00e5 v\u00earharde stader i h\u00f8gheia,
  eller andre stader der tilh\u00f8va eller utforminga av bygget tilseier det, kan
  andre tekkingsmateriale godtakast\\n\\nVedlegg\\n\\nForvaltningspraksis\\n\\nDet
  f\u00f8lgjande er eit fors\u00f8k p\u00e5 \u00e5 konkretisere kva dei nye byggereglane
  vil ha \u00e5 seie for forvaltningspraksisen i ulike typar byggesaker. Avsnittet
  inneheld og ei oversikt over kva for byggetiltak som er direkte heimla i dei ulike
  vernef\u00f8reskriftene.\\n\\n* Det vil ikkje bli gjeve l\u00f8yve til byggetiltak
  kor s\u00f8kar ikkje kan dokumentere eit reelt behov for det oms\u00f8kte tiltaket\\n*
  Det blir normalt gjeve l\u00f8yve til restaurering / ombygging av eksisterande husv\u00e6re
  innanfor eksisterande areal. Dette gjeld og oppattsetting av bygningar som er skadd
  av brann eller naturskade p\u00e5 eksisterande murar. Unnataket er tiltak som har
  negativ innverknad p\u00e5 verneverdiane\\n\\nOppattbygging av bygningar som er
  skadd av brann eller naturskade er berre heimla i f\u00f8reskriftene for Frafjordheiane,
  SVR og Steinbuskaret. I dei eldre vernef\u00f8reskriftene for dei andre verneomr\u00e5da
  er ikkje dette punktet teke med. Ettersom dette normalt er mindre inngrep som vil
  v\u00e6re av stor betyding for s\u00f8kar, kan det vurderast om \u00a748 i naturmangfaldlova
  kan brukast i slike sakar. For Kvanndalen, Dyraheio og Vormedalsheia kan og heimelen
  for nybygg nyttast.\\n\\nVedlikehald og ombygging innanfor eksisterande areal er
  heimla i alle f\u00f8reskriftene.\\n\\n* I st\u00f8lsomr\u00e5de og andre l\u00e5gareliggande
  omr\u00e5de i utkanten av verneomr\u00e5da, kan det inntil gjeldande arealgrenser,
  gjevast l\u00f8yve til utviding av og tilbygg til eksisterande bygg. Det blir ikkje
  gjeve l\u00f8yve til tiltak som har negativ innverknad p\u00e5 verneverdiane. Det
  kan og gjevast l\u00f8yve til slike tiltak i meir sentrale delar av verneomr\u00e5da,
  men her vil dispensasjonspraksisen v\u00e6re strengare.\\n\\nTilbygg til og utviding
  av eksisterande bygg er direkte heimla i f\u00f8reskriftene for Dyraheio, Kvanndalen,
  Holmevass\u00e5no og Frafjordheiane. I f\u00f8reskriftene for SVR og Steinbuskaret
  er formuleringa \\\"mindre tilbygg\\\". I dei ei dei eldre vernef\u00f8reskriftene
  for Vormedalsheia og Lusaheia er ikkje dette punktet teke med. Ettersom dette normalt
  er sm\u00e5 inngrep som vil v\u00e6re av stor betyding for s\u00f8kar, kan det vurderast
  om \u00a748 i naturmangfaldlova kan brukast i slike sakar.\\n\\n* Det kan vurderast
  \u00e5 gje l\u00f8yve til nybygg i samband med landbruksdrift i st\u00f8lsomr\u00e5de
  i utkanten av verneomr\u00e5da, dersom s\u00f8kar oppfyllar gjeldande krav, og tiltaket
  ikkje har negativ innverknad p\u00e5 verneverdiane. Storleiken blir avgrensa av
  gjeldande arealgrenser for ulike typar bygg. I s\u00e6rskilte h\u00f8ve kan det
  og vurderast \u00e5 gje l\u00f8yve til nybygg i samband med landbruksdrift i meir
  sentrale delar av verneomr\u00e5da. Dette gjeld og turisthytter, fjellstyrehytter
  og andre bygg som er opne for allmenta.\\n\\nI Dyraheio, Kvanndalen, Vormedalsheia
  og Frafjordheiane er nye bygg til landbruksdrift direkte heimla i f\u00f8reskriftene.
  I Holmevass\u00e5no er berre sankehytter direkte heimla i f\u00f8reskrifta. I Lusaheio
  er nye hytter til sauedrift ikkje heimla i f\u00f8reskrifta, men i den Kongelege
  resolusjonen g\u00e5r det fram at det kan opnast for 8 slike driftshytter. I SVR
  og Steinbuskaret er nybygg til landbruksdrift ikkje er direkte heimla i vernef\u00f8reskriftene,
  men er omtalt i Kronprinsregentens resolusjon. Her blir behovet vurdert som lite,
  og det visast til unntaksf\u00f8resegna dersom det skulle oppst\u00e5 eit behov.
  I SVR og Steinbuskaret m\u00e5 ein vurdere om \u00a7 48 i naturmangfaldlova kan
  brukast i slike sakar. Dette kan medf\u00f8re ein strengare dispensasjonspraksis
  enn i dei andre verneomr\u00e5da. I Dyraheio og Kvanndalen er bygging av nye turisthytter
  direkte heimla i f\u00f8reskriftene. I Frafjordheiane er formuleringa \\\"mindre
  bygg til allmenne friluftsf\u00f8rem\u00e5l\\\". I dei andre verneomr\u00e5da m\u00e5
  ein vurdere om \u00a7 48 i naturmangfaldlova kan brukast i slike sakar\\n\\n* Det
  opnast for \u00e5 gje l\u00f8yve til gjenreising av bygg med kulturhistorisk verdi
  i st\u00f8lsomr\u00e5de i utkanten av verneomr\u00e5da. L\u00f8yve kan ikkje gjevast
  utan at tiltaket er ein del av ein plan og at tiltaket er vurdert og/eller godkjent
  av kulturminnestyresmakta. I s\u00e6rskilte h\u00f8ve kan det og gjevast l\u00f8yve
  til slike tiltak i andre delar av verneomr\u00e5da. I Dyraheio, Kvanndalen, Holmevass\u00e5no,
  Frafjordheiane, SVR og Steinbuskaret er slike bygg direkte heimla i f\u00f8reskriftane.
  I Vormedalsheia og Lusaheia m\u00e5 ein vurdere om \u00a748 i Naturmangfaldslova
  kan brukast i slike sakar.\"", "\"\u00c5RSMELDING\\n\\nSogn og Fjordane Folkemusikklag
  2005\\n\\n\u00c5RSM\u00d8TET 2005\\n\\n\u00c5rsm\u00f8tet i 2005 var lagt til same
  helga som Fylkeskappleiken vart avvikla i Dale. Ein trudde d\u00e5 at ein skulle
  f\u00e5 fleire av medlemane i tale, men det slo ikkje til. Det vart ikkje fleire
  utsendingar av den grunn.\\n\\n\u00c5rsm\u00f8tet var p\u00e5 kommunehuset i Dale,
  s\u00f8ndag 3. april\\n\\nDet m\u00f8tte 10 lag med 13 representantar + 4 styremedlemar
  og ein varamedlem. I tillegg var Dagrun Hesjevoll fr\u00e5 kontoret og to observat\u00f8rar
  til stades.\\n\\nTil saman 20 personar.\\n\\nI meldings\u00e5ret har styret vore
  samansett slik:\\n\\nLeiar: Eva Kristin Svidal\\n\\nNestleiar: Jens Brekke\\n\\nStyremedlem:
  Berit Anne Knutsen\\n\\nStyremedlem: Aslak Johnsen\\n\\nStyremedlem: Johannes Rotihaug\\n\\n1.varamedlem:
  Arve B. R\u00f8neid\\n\\n2. varamedlem: Per Lien, 3. varamedlem Anne Grethe Hukseth\\n\\nRevisor:
  Kjell Sverre Sn\u00f8tun\\n\\nValnemd: Reidar Johannesen, Einar Eimhjellen og Nils
  Solheim.\\n\\nDet har vore halde 9 styrem\u00f8te, av desse var 6  telefonm\u00f8te.\\n\\nDet
  er handsama 40 saker i 2005.\\n\\nMEDLEMAR\\n\\nMedlemstalet har auka noko, fr\u00e5
  622 til 664 medlemar. Pr. 31. 12. 2005 har laget ca 90 born og 565 vaksne medlemar.
  9 medlemar er ikkje knytt til noko lokallag, men st\u00e5r direkte tilslutta fylkeslaget.
  Totalt har fylkeslaget 20 lag som alle er medlem av LfS.\\n\\nKONTORET\\n\\nDagrun
  Hesjevoll er tilsett i 50 % stilling.\\n\\nHeimeside p\u00e5 Internett.\\n\\nPeder
  Kj\u00e6rvik i Jostedalen har sett opp heimesida v\u00e5r. Eva Kristin Svidal og
  Dagrun Hesjevoll har hatt oppdateringa.\\n\\nAdresser: www.folkemusikklaget.no\\n\\nwww.mokurset.no\\n\\ne-postadresse:
  email@example.com\\n\\nI januar 2006 er sidene v\u00e5re flytta over til April studios
  som er det selskapet der LfS har sine sider.\\n\\nMedlemsblad:\\n\\nDet vart sendt
  ut medlemsskriv i juni til alle medlemane. Det var tanken \u00e5 gje ut to, men
  \u00f8konomien tillet ikkje det. Nokre f\u00e5 tilbakemeldingar har me f\u00e5tt
  p\u00e5 skrivet.\\n\\nKAPPLEIKAR\\n\\nFylkeskappleiken vart skipa til av Dalsfjorden
  spelemannslag og vart skipa til i Dale  1.og 2. april. Deltakinga held seg l\u00e5g,
  men det var mange gode prestasjonar og det var ein triveleg og fin kappleik.\\n\\nVestlandskappleiken
  gjekk av stabelen p\u00e5 Sande 14.-16.oktober med Gaular spelemannslag som tilskiparar.
  Det var litt fleire deltakarar enn i 2004, men det hadde vore god plass til fleire.
  Det var eit godt arrangement, og folk kosa seg p\u00e5 kappleik.\\n\\nStyret takkar
  tilskiparane for godt arbeid og gode arrangement.\\n\\nSjokoladekappleik\\n\\nDette
  var nytt av \u00e5ret. Det er ei vidaref\u00f8ring av Juniortreffet som har vore
  arrangert i 17 \u00e5r. Eva Kristin Svidal, Aslak Johnsen og Arngunn T. Bell saman
  med dagleg leiar sto for forarbeidet. Under treffet hadde ein med gode medhjelparar
  fr\u00e5 kappleiksomr\u00e5det. Kappleiken vart halden p\u00e5 Mo. Det var nok lurt
  fordi mange av ungane er kjende der og dermed \\\"f\u00f8lte seg heime\\\" Me tinga
  mat p\u00e5 skulen og treffet vart vellukka og godt. Ca 90 ungar var p\u00e5 treffet,
  i tillegg ein god del vaksne.\\n\\nStyret og dagleg leiar hadde dugnad med \u00e5  tigge
  sjokolade til premiar, noko som ikkje var like enkelt alle stadar.\\n\\nTakk til
  alle som hjelpte til slik at dette vart s\u00e5 vellukka.\\n\\nKURSVERKSEMD\\n\\nMokurset  31.juli
  \u2013 5.august.\\n\\nSommarkurset hadde fullt belegg. Me fyller opp det som skulen
  kan ta i mot.\\n\\nKurset fungerte godt, ogs\u00e5 sosialt, noko som er sv\u00e6rt
  viktig. Alderen p\u00e5 deltakarane ligg no fr\u00e5 10 \u2013 16 \u00e5r og jentene
  er i stort fleirtal. Likevel kan me sj\u00e5 ein liten auke i talet p\u00e5 gutar.\\n\\nL\u00e6rarkrefter
  i \u00e5r var: Gro Marie Svidal, Britt Pernille Fr\u00f8holm, Sigmund Eik\u00e5s,
  S\u00f8lvi Lien, Arngunn Timenes Bell, Terje Furenes og Leif Rygg p\u00e5  hardingfele.
  Aslak Johnsen og Erlend Viken p\u00e5 vanleg fele. Rikke van Ommeren hadde toradar
  og Solbj\u00f8rg Tveiten song-undervisninga. Linda Fluge l\u00e6rde elevane \u00e5
  danse saman med Aslak Johnsen og Tor Egil Gjelsvik. Jens Brekke tok f\u00f8re seg
  bukkehorn og trekkspel. Dagrun Hesjevoll var kursleiar.\\n\\nSom vanleg s\u00e5
  fekk me god mat og god service p\u00e5 skulen.\\n\\nArrang\u00f8rgruppe for Mokurset.\\n\\nStyret
  vedtok \u00e5 gjere om referansegruppa for Mo-kurset til ei arrang\u00f8rgruppe.
  Eva Kristin Svidal, Aslak Johnsen, Gro Marie Svidal og Jofrid Nedreb\u00f8 set i
  denne gruppa og har sett p\u00e5 sider av kurset og komme med innspel og framlegg
  til ting som skal gjere kurset betre. I samr\u00e5d med dagleg leiar legg ein opp
  til litt endringar  i arbeidsoppg\u00e5ver / ansvarsfordeling. Dei tek no ein del
  av arbeidet med kurset slik at dagleg leiar f\u00e5r frigjeve litt tid til andre
  oppg\u00e5ver.\\n\\nTakk til gruppa for godt og inspirerande arbeid.\\n\\nKurs for
  vidarekomne i spel og song: 30.september \u2013 2. oktober.\\n\\nEin lyste ut nye
  kurs i Naustdal i samband med \\\"Gamaldansgallaen\\\" til Nauste- dalen spelemannslag.
  Det var berre kurset med Arve B. R\u00f8neid p\u00e5 toradar som vart avvikla. Songkurset
  vart avlyst grunna liten p\u00e5melding. Felekurs og dans vart ikkje lyst ut sidan
  LfS same helga hadde tilbod om tradisjonskurs i spel og ein ikkje ville konkurrere
  om deltakarane. Dessverre s\u00e5 vart og LfS sine kurs avlyst grunna lita p\u00e5melding,
  men d\u00e5 var det for seint \u00e5 gjere nye framst\u00f8yt for oss.\\n\\nSongkurset
  i Ragnar Vigdal sin songtradisjon: under arr. \\\"Bl\u00e5e tonar under breen\\\"
  m\u00e5tta avlysast i \u00e5r. Det vart for lite p\u00e5melde.\\n\\nROLF MYKLEBUST
  SITT MINNEFOND\\n\\nFondet er bygt opp av salet av \\\"Sl\u00e5ttar i Nordfjordtradisjon
  \\\" og overskotsmidlar fr\u00e5 gode \u00f8konomiske \u00e5r i laget. Med renter
  og sal av nokre hefter  i \u00e5r, s\u00e5 er fondet komme opp i 108676kr. Det er
  ikkje brukt av fondet til prosjekt dette \u00e5ret, men det er gjort vedtak om tilskot
  til Vidar Underset sitt prosjekt: Oppl\u00e6ring p\u00e5 video. Dette skal utbetalast
  n\u00e5r produktet ligg f\u00f8re.\\n\\n\u00d8KONOMI\\n\\nI \u00e5r har me f\u00e5tt
  midlar fr\u00e5:\\n\\nSogn og Fjordane Fylkeskommune kr. 180000.\\n\\nSt\u00f8naden
  er heilt avgjerande for \u00e5 ha ein tilsett i organisasjonen og halde oppe aktiviteten.\\n\\nMe
  fekk og nytta oss av \\\"fylkeskvoten\\\" til Mokurset.\\n\\nVerkstadordninga: kr
  50000.- til Mokurset,\\n\\nJuniortreffet.kr:5000.-\\n\\nRanglenatt: kr.5000.og spelkurs
  kr. 3500.-\\n\\nAv verkstadmidlane  har me f\u00e5tt omdisponere ubrukte midlar
  til Mokurset.\\n\\nFr\u00e5 LfS kr. 5000.- til Mokurset.\\n\\nLuster Sparebank gav
  kr. 1000.- til arbeidet v\u00e5rt.\\n\\nRasmus og Agnes Pettersens fond kr. 2000.-\\n\\nMe
  er sv\u00e6rt glad for at v\u00e5re eigne medlemar har sponsa oss.\\n\\nE. M. Budbil
  har gjeve  5000kr  til Mokurset og Anders Eik\u00e5s sag og h\u00f8vleri kr. 1500.-
  til medlemsskriv / andre tiltak.\\n\\nDrifta av laget har g\u00e5tt med underskot.
  Det syner seg at ein kan klare \u00e5 halde kursa stort sett i balanse, med unntak
  av Mokurset. Men p.g.a. omdisponerte midlar, sponsing og fylkeskvoteordinga s\u00e5
  kjem ein i hamn der og.\\n\\nDen daglege drifta blir st\u00f8tta av fylkeskommunen,
  men n\u00e5r ein ikkje f\u00e5r st\u00f8tte til drift av andre, s\u00e5 vert det
  for lite midlar. Sj\u00f8lv om ein er sv\u00e6rt n\u00f8ktern klarar ein ikkje \u00e5
  halde budsjettet.\\n\\nStyret takkar hjarteleg alle som har gjeve laget s\u00e5rt
  tiltrengde  midlar .\\n\\nSAMARBEID MED ANDRE\\n\\nFolkemusikklaget har samarbeid
  / kontakt med desse organisasjonane og institusjonane:\\n\\nSogn og Fjordane Fylkeskommune:\\n\\n-
  kulturavdelinga\\n- musikkarkivet\\n\\nSogn og Fjordane Musikkr\u00e5d  / Sogn og
  Fjordane kulturnettverk\\n\\nNorsk Musikkr\u00e5d\\n\\nMusikkverkstadordninga\\n\\nLandslaget
  for Spelemenn\\n\\nHordaland Folkemusikklag\\n\\nF\u00f8rde Internasjonale folkemuskkfestival\\n\\nDet
  var hektisk m\u00f8teverksemd i samband med F\u00f8rdefestivalen p\u00e5 v\u00e5rparten.\\n\\nDette
  vart det orientert om p\u00e5 \u00e5rsm\u00f8tet i 2005.\\n\\nKnutepunktfestivalen
  er p\u00e5 plass med nytt styre og representantskap. \u00c5rets festival gjekk av
  stabelen fr\u00e5 7. \u2013 10. juli. Med litt mindre publikum enn dei siste \u00e5ra,
  men med mange flotte musikkopplevingar.\\n\\nNy nettverksorganisasjon.\\n\\nSogn
  og Fjordane Musikkr\u00e5d var i ei omstillingsfase og det var ein del m\u00f8teverksemd.
  Den nye organisasjonen vart skipa p\u00e5\\n\\nSkei i oktober og fekk namnet Sogn
  og Fjordane Kulturnettverk.\\n\\nI praksis er det Sogn og Fj. Musikkkr\u00e5d med
  nytt namn. Organisasjonen skal etterkvart gjelde alle kulturelle uttrykk, men f\u00f8rebels
  er det starta med musikken.\\n\\nDet er innf\u00f8rt medlemskontingent og folkemusikklaget
  er med.\\n\\nSeminar, m\u00f8te og anna representasjon.\\n\\nFleire m\u00f8te i
  F\u00f8rde, saman med andre org. tilknytt F\u00f8rdefestivalen: Berit Anne Knudsen,
  Eva Kristin Svidal, Johannes Rotihaug\\n\\nGeneralforsamling  i F\u00f8rdefestivalen:
  Johannes Rotihaug og Jens Brekke\\n\\nM\u00f8te om ny nettverksorg i S.og Fj.  p\u00e5
  Skei: J\u00f8rgen Erviks\u00e6ter (Johannes Rotihaug.\\n\\n\u00c5rsm\u00f8te i S.
  og Fj. Musikkr\u00e5d: Aslak Johnsen og Eva Kristin Svidal\\n\\nM\u00f8te p\u00e5
  Skei i Monemnda: Eva Kristin Svidal, Aslak Johnsen, Jofrid Nedreb\u00f8 og Gro Marie
  Svidal\\n\\nEva Kristin Svidal m\u00f8tte Lene Fureli om danseprosjekt p\u00e5 F\u00f8rdefestivalen
  .\\n\\nJens Brekke, Berit Anne Knutsen og Mari Andrea Ness har hatt tlf. m\u00f8te
  om ungdomssatsing i F\u00f8rdefestivalen.\\n\\nJens Brekke og Mari Andrea Ness har
  hatt m\u00f8te med Lene Fureli i same sak.\\n\\nLeiarm\u00f8te Vestlandskappleiken:
  Eva Kristin Svidal\\n\\nFolkelarm: Jens Brekke og medhjelpar Gro Marie Svidal.\\n\\n\u00c5rsm\u00f8te
  i LfS. Eva Kristin Svidal  og  Dagrun Hesjevoll\\n\\nLaget er representert i:\\n\\nRagnar
  Vigdals minnefond : Dagrun Hesjevoll\\n\\nSogn og Fjordane Kulturnettverk: Magnus
  Hope,   Johannes Rotihaug (vara)\\n\\nFolkelarm\\n\\nFolkelarm vart avvikla i Oslo
  21.- 23.oktober som eit nytt tiltak innan folkemusikken. Det vart sv\u00e6rt vellukka
  og er komme for \u00e5 bli. Det var mykje gode artistar \u00e5 sj\u00e5, h\u00f8yre
  og kj\u00f8pe for dei som var ute i det \u00e6rend. Folkemusikklaget var til stades
  med stand, der ein presenterte Mokurset. Jens Brekke og Gro Marie Svidal hadde ansvaret
  for denne. Dagleg leiar var der som observat\u00f8r (privat) og Eva Kristin Svidal
  i sin jobb.\\n\\nSeminaret p\u00e5 s\u00f8ndag : Kultur som n\u00e6ring deltok ein
  og p\u00e5.\\n\\nANDRE FOLKEMUSIKKTILTAK I FYLKET.\\n\\nHer tek me med andre tiltak
  i fylket som ikkje vert drivne av Folkemusikklaget. Me har med dei tiltak som me
  har informasjon om og som me trur kan ha interesse for medlemane.\\n\\nF\u00f8rde
  internasjonale folkemusikkfestival:\\n\\nFestivalen er no \\\"knutepunktfestival\\\".
  Det inneber endringar i finansieringa som gjer at ein er sikra meir midlar fr\u00e5
  stat, fylke og kommune.\\n\\nI representantskapet set Johannes Rotihaug med Dagrun
  Hesjevoll som vara.\\n\\nFolkemusikkarane i S. og Fjordane.\\n\\nAnsvarleg for gruppa
  er Fylkeskommunen v/ \u00d8yvind Lyslo som er fylkesmusikkleiar. Det er ingen endring
  i samansetjinga av gruppa. Sigmund Eik\u00e5s, Elin Grytting, Harald Hesjevoll,
  Oddbj\u00f8rn Ramstad og Vidar Underseth er tilsette. Elin og Vidar er inne att
  etter permisjon, s\u00e5 gruppa er no fullstendig.\\n\\nFr\u00e5 seinhausten s\u00e5
  har dei jobba med \u00e5 lage ein turne saman med folkemusikkarane i Hordaland.
  Dei skal p\u00e5 turne p\u00e5 \\\"b\u00f8ljan bl\u00e5\\\" med seglskuta \\\"Mathilde\\\".
  Turneen startar i mars.\\n\\nSogn og Fjordane Teater.\\n\\nTeateret har for tredje
  \u00e5r p\u00e5 rad sett opp eit stykke med folkemusikk og \u2013 folkedans i samarbeid
  med F\u00f8rdefestivalen. I \u00e5r var det 1905, unionsoppl\u00f8ysinga som vart
  markert med stykket \\\"Hundre \u00e5r og like stri\\\". Gro Marie Svidal spela
  \\\"Mor Noreg\\\" og elles var Synn\u00f8ve S. Bj\u00f8rset, \u00d8yvind Lyslo og
  dansarar fr\u00e5 J\u00f8lster med fr\u00e5 v\u00e5rt fylke. I oppsetjinga var det
  og med folkemusikarar fr\u00e5 Hordaland.\\n\\nDen kulturelle skulesekken.\\n\\nDen
  kulturelle skulesekken er ei nasjonal satsing som vert finansiert gjennom overskotet
  fr\u00e5 Norsk Tipping. Sogn og Fjordane Fylkeskommune, Kulturavdelinga, administrerar
  turnear som g\u00e5r til alle grunnskulane i fylket.\\n\\nSkule\u00e5ret 2005/ 2006
  har Elin Grytting saman med Hanne Oftedal  vore p\u00e5 turne med \\\"Primstaven\\\"
  og Britt Pernille Fr\u00f8holm og Siren Thorsheim med programmet \\\"S\u00e5 rart
  \u00e5 vere flaggermus\\\"\\n\\nDen kulturelle skulesekken har og ei lokal satsing
  i kommunane. Kommunane f\u00e5r overf\u00f8rt  midlar fr\u00e5 Fylkeskommunen til
  \u00e5 drive denne satsinga i tilegg til midlar dei legg inn sj\u00f8lv. Ogs\u00e5
  lokalt er folkemusikk representert i tilboda.\\n\\nDiverse\\n\\nDesse har komme
  med plate i 2005:\\n\\n- Gruppa \\\" Gamaltnymalt \\\" som best\u00e5r av Sigrid
  Moldestad, H\u00e5kon H\u00f8gemo og Einar Mj\u00f8lsnes med plata \\\"Gamaltnymalt\\\"\\n-
  Arne S\u00f8lvberg: med \\\"Solo\\\"\\n- Gamaldansgruppa \\\"Labakkalaget\\\"  med:
  \\\"Aoret rundt i Luster\\\"\\n- \\\"Spindel\\\" med: \\\"Aminje\\\"\\n- Unni L\u00f8vlid:
  med \\\"Vita \\\"og  \\\"Brigdes- Live in China\\\" Den siste saman med norske og
  kinesiske musikarar.\\n- Magne Drages\u00e6t: \\\"Stryns skj\u00f8nnhet\\\" \u2013
  speledugnad i Nordfjord-\\n* Synn\u00f8ve S. Bj\u00f8rset vann saman med gruppa
  \\\"Majorstuen\\\" den fyrste\\n\\n\\\"Introfolk- finalen\\\". Dei fekk og \\\"Hilmarprisen\\\"\\n\\n*
  Synn\u00f8ve var produsent for plata\\\" Hardingfelespel fr\u00e5 Sunnfjord\\\"
  som vart slept p\u00e5 Vestlandskappleiken.\\n- Dansegruppa \\\"Botavon\\\" fekk
  Sparebanken Sogn og Fjordane sitt ungdomsstipend under F\u00f8rdefestivalen. Dei
  mottok og J\u00f8lster Kommune sitt ungdomsstipend.\\n\\nSLUTTORD.\\n\\n2005 er
  over og det er tid for eit tilbakeblikk. Me har  gjennomf\u00f8rt det meste av det
  me hadde ambisjonar om, og som er vedteke i den tre\u00e5rige strategiplanen.\\n\\nDet
  syner seg at kurs er ikkje s\u00e5 enkelt \u00e5 f\u00e5 avvikla lenger. Det er
  mange tilbod p\u00e5 marknaden \u00e5 velje i, for dei unge ut\u00f8varane v\u00e5re.
  Men kappleikane , sjokoladekappleiken og Mokurset vart godt avvikla og er tiltak
  som ein m\u00e5 halde fram med, og vidareutvikle.\\n\\nUngdomssatsing p\u00e5 F\u00f8rdefestivalen
  vert det arbeida med og me vonar \u00e5 ha eit samarbeidsprosjekt p\u00e5 skinner
  til sommaren.\\n\\nMe takkar lokallaga og enkeltmedlemar som st\u00e5r p\u00e5 og
  yter ein stor innsats i arbeidet for \u00e5 ta vare p\u00e5 og vidaref\u00f8re folkemusikk
  og -dansetradisjonane i fylket.\\n\\nEva Kristin Svidal  (s)   Jens Brekke (s)        Berit
  Anne Knudsen(s)\\n\\n-leiar-                                 -nestleiar-                    -styremedlem-\\n\\nAslak
  Johnsen (s)          Johannes Rotihaug (s)       Arve B. R\u00f8neid\\n\\n-styremedlem-                     -styremedlem-                -1.varamedlemDagrun
  Hesjevoll\\n\\n-dagleg leiar-\"", "\"Helse- og omsorgsplan\\n\\nKommunedelplan 2013-2040\\n\\nUlvik
  herad\\n\\nEIT ORD\\n\\nEit ord\\n\\n- ein stein i ei kald elv.\\n\\nEin stein til
  \u2013\\n\\nEg lyt ha fleire steinar skal eg koma yver.\\n\\n(Fr\u00e5 Dropar i
  Austavind, 1966, Olav H. Hauge)\\n\\nInnhald\\n\\n1 Samandrag\\n\\nHelse- og omsorgsplanen
  2013-2040 er ein kommunedelplan, som er forankra i verdigrunnlaget, m\u00e5l og
  strategiar i kommuneplanen  (samfunnsdelen) for 2009-2020, vedteken 17.02.2010.\\n\\nRO
  (Ressurssenter for omstilling i kommunene) har hjelpt Ulvik herad med utarbeiding
  av helse- og omsorgsplanen gjennom leiing av ei arbeidsgruppe og gjennomf\u00f8ring
  av to forankringsseminar, i tillegg til \u00e5 ha  f\u00f8rt planen i \u00abpenn\u00bb.\\n\\nGrunnlaget
  for helse- og omsorgsplanen er nye f\u00f8ringar og oppg\u00e5ver som heradet har
  f\u00e5tt gjennom samhandlingsreforma og utvikling av framtidige helse- og omsorgstenester,
  \u00f8konomisk, demografisk og kvalitativt. Ny lovgiving, kommunal medfinansiering
  av spesialisthelsetenesta og st\u00f8rre grad av samhandling internt og eksternt
  gir signal om \u00e5 tenkja nytt om innhald og utforming av tenestene. Brukarmedverknaden
  er og styrkt i den nye lovgivinga. Gjennom Folkehelselova har heradet f\u00e5tt
  ansvar for f\u00f8rebyggjande og helsefremjande arbeid, noko som inneber at heile
  heradet  har eit felles ansvar for \u00e5 fremja  folkehelse. Det ligg og ei forventning
  her om at kvar og ein tek ansvar for helsa si.\\n\\nUlvik herad samarbeider med
  andre herad i Hardangeregionen. Vidare er Voss kommune ein viktig samarbeidspart
  gjennom etablering av \u00f8yeblikkeleg-hjelp \u2013 plassar for Ulvik. Eit herad
  p\u00e5 Ulvik sin storleik har behov for gode samarbeidsrelasjonar til naboherad
  med omsyn til \u00e5 kunna etablera robuste tenester innan ulike fagomr\u00e5de.
  Eitt eksempel er arbeidet med utgreiing av legetenester, legevakt og samarbeid om
  kommuneoverlege.\\n\\nEit anna viktig omr\u00e5de for samarbeid og samhandling er
  utvikling av kompetanse. Plassar for behandling f\u00f8r, i staden for og etter
  sjukehusopphald treng h\u00f8g fagleg kompetanse. Utviklinga innan demens gir og
  utfordringar med omsyn til kompetanse.\\n\\nDen st\u00f8rste utfordringa som Ulvik
  herad st\u00e5r overfor er sp\u00f8rsm\u00e5let om kva som skal gjerast med noverande
  sjukeheim.  Sjukeheimen er bygd i 1974 og er ikkje tilpassa standardkrav til areal
  og utforming av rom for tenestemottakarar og st\u00f8ttefunksjonar ved institusjonen,
  korkje  i dag eller for framtida.\\n\\nHusbanken administrerer investeringstilskot
  til omsorgsbustader og sjukeheimar  og kan gi hjelp til kommunane og andre akt\u00f8rar
  med \u00e5 f\u00e5 god kvalitet p\u00e5 prosjekta. Det b\u00f8r gjennomf\u00f8rast
  ei vurdering av kostnader, framtidig funksjonalitet og kapasitet ved behov for heild\u00f8gns
  plassar fr\u00e5 2025/40. Utgreiinga b\u00f8r visa konsekvensar for heile helse-
  og omsorgstenesta.\\n\\nVidare b\u00f8r det utgreiast kostnader, funksjonalitet
  og kapasitet ved \u00e5 samlokalisera  heile helse- og omsorgstenesta i eit helsesenter
  p\u00e5 den tomta der det var planlagt eit rehabiliteringssenter. I denne utgreiinga
  ligg og vurdering av lokala i Semtrumsbygget med tanke p\u00e5 framtidige behov
  for helsetenester.\\n\\nFram til 2025 vil det ikkje vera auke i talet p\u00e5 personar
  over 80 \u00e5r i Ulvik. Dette gir heradet tid  til \u00e5 planleggja  for \u00e5
  m\u00f8ta utfordringane etter 2025. Det er likevel n\u00f8dvendig \u00e5 erkjenna  at
  sjukeheimen i dag ikkje svarer til dei krava som gjeld, med omsyn til areal og utforming.\\n\\nUansett
  om heradet skal byggja nytt eller om sjukeheimen skal byggjast om til den standarden
  som gjeld i 2013, m\u00e5 det vurderast kva som er den beste l\u00f8ysinga for \u00e5
  m\u00f8ta framtidige behov for\\n\\ntidsmessig utforming og behov for heild\u00f8gns
  plassar. Vurderinga m\u00e5 ogs\u00e5 sj\u00e5ast i samanheng med den totale utviklinga
  i heradet, b\u00e5de n\u00e5r det gjeld utvikling i folketal, \u00f8konomisk berekraft
  i heradet og helse og omsorg si rolle og funksjon som ein utviklande og spanande
  arbeidsplass som trekkjer til seg kompetanse og arbeidskraft, b\u00e5de til Ulvik
  og til Hardangerregionen.\\n\\nSom ei vidaref\u00f8ring av helse- og omsorgsplanen
  slik den her ligg f\u00f8re, m\u00e5 det difor setjast ned ei eiga hurtigarbeidande
  plangruppe som skal greia ut sp\u00f8rsm\u00e5la over.\\n\\n2 Grunnlaget for planen\\n\\nSamhandlingsreforma
  er sett i verk og gir nye f\u00f8ringar og oppg\u00e5ver for helse- og omsorgstenesta.
  Helse- og omsorgsplanen er ein delplan av kommuneplanen (samfunnsdelen) for 2009-2020,
  vedteken 17.02.2010.\\n\\nHeradsstyret i Ulvik vedtok samr\u00f8ystes i sak HST-010/13,
  den 17.04.2013 fylgjande:\\n\\n1) Under f\u00f8resetnad av at RO opprettheld sitt
  tilbod p\u00e5 utarbeiding av helse- og omsorgsplan for Ulvik, jf tilbod dagsett
  08.03.2013, evt med utsett frist for ferdigstilling, vert det l\u00f8yvd kr. 270
  00 inkl. mva. dekka av disposisjonsfondet.\\n2) I ljos av samhandlingsreforma skal
  planen ta opp sp\u00f8rsm\u00e5l kring investeringar/nybygg i h\u00f8ve til framtidig
  behov hj\u00e5 pasientgrupper ved institusjon. Vidare skal planen seia noko om samlokalisering
  med\\n- Fysioterapi\\n- Legestasjon\\n- Helsestasjon\\n- m.m.\\n\\nDet er arbeidd
  med planen p\u00e5 to frontar. Arbeidsgruppa har arbeidd med innhaldet i planen,
  under leiing av r\u00e5dgivarane fr\u00e5 RO, og det er arrangert to forankringsseminar
  med tilsette og inviterte eksterne samarbeidspartar. Planarbeidet i arbeidsgruppa
  er gjennomf\u00f8rt i tre fasar:\\n\\ni) Skildring av status/forst\u00e5ing av situasjon
  og utfordringar\\nii) Effektive gruppeprosessar\\niii) Grunnlag for politisk vedtak\\n\\nArbeidsgruppa
  som har arbeidd med utforminga av helse- og omsorgsplanen, er f\u00f8lgjande:\\n\\n-
  Jon Oppedal, r\u00e5dmann\\n- Harald Johnsen, helse- og sosialleiar\\n- Karin Fleten,
  pleie- og omsorgsleiar\\n- Unni Solem, kommuneoverlege\\n- Kjartan Fjelde, leiar
  i r\u00e5d for funksjonshemma\\n- Ragnvald Fleten, leiar i kommunalt eldrer\u00e5d\\n-
  Gry Vik\u00f8r, tillitsvald NSF\\n- Annlaug Brandstveit, tillitsvald Fagforbundet\\n\\nUndervegs
  i arbeidet vart det klart at helse- og omsorgsplanen m\u00e5 ha eit lengre perspektiv
  enn 2020 (7 \u00e5r) av omsyn til den demografiske utviklinga for \u00e5 kunne seia
  noko om investeringsbehov/nybygg n\u00e5r det gjeld behov hj\u00e5 den delen av
  innbyggjarane som aukar mest (80 \u00e5r og eldre). I den samanheng er utviklinga
  innan den delen av innbyggjarane som utgjer arbeidskrafta avgjerande for orleis
  heradet  skal m\u00f8ta utfordringane innan helse og omsorg. I planen ser arbeidsgruppa
  med st\u00f8tte fr\u00e5 forankringsseminaret den 30.05.2013, utviklingstrekka fram
  mot 2040.\\n\\n2.1 Nasjonale f\u00f8ringar\\n\\nLover og forskrifter\\n\\nLover
  og forskrifter legg f\u00f8ringar og set rammer for helse- og omsorgstenestene i
  kommunane. I tillegg kjem utgreiingar (NOU) og meldingar til Stortinget som skildrar
  verdigrunnlaget og retninga for utvikling  av tenestene.\\n\\nSamhandlingsreforma
  og samhandling i praksis\\n\\nI juni i 2009 la regjeringa fram St. meld. nr. 47
  (2008 \u2013 2009): \\\"Samhandlingsreformen, Rett behandling \u2013 p\u00e5 rett
  sted \u2013 til rett tid\\\".\\n\\nSamhandlingsreforma gir kommunane ei ny rolle
  gjennom eit auka fokus p\u00e5 f\u00f8rebygging og helsefremjande arbeid. Dette
  skal dempa vekst i bruken av sjukehustenester ved at ein st\u00f8rre del av helsetenestene
  vert ytt av kommunehelsetenesta med f\u00f8resetnad om like  god eller betre kvalitet,
  samt kostnadseffektivitet.\\n\\nGjennom dei \u00f8konomiske verkemidlane i samhandlingsreforma
  har kommunane f\u00e5tt ansvar for kommunal medfinansiering av 20 pst. av utgiftene
  til sjukehusopphald og poliklinisk behandling, Kommunane har f\u00e5tt overf\u00f8rt
  20% av tilskotet til sjukehusdrift og skal betale tilbake til sjukehusa 20% av kostnadene
  knytt til behandling i sjukehus  etter n\u00e6rare definerte kriterie. Vidare har
  kommunane f\u00e5tt betalingsplikt for utskrivingsklare pasientar som kommunane
  ikkje har kapasitet til eller av andre grunnar ikkje kan ta imot.  Ansvaret for
  behandling og finansiering av kirurgi, f\u00f8dslar, nyf\u00f8ddmedisin, psykisk
  helsevern og rus ligg f\u00f8rebels til spesialisthelsetenesta. Ansvaret for rus
  og psykiatri skal seinare overf\u00f8rast til kommunane.  Fr\u00e5 2016 skal alle
  kommunar ha etablert eit \u00f8yeblikkeleg-hjelp d\u00f8gntilbod. Dette gjeld dei
  tenestene det er forsvarleg at kommunane gir, i hovudsak forverring av kjente lidingar
  der behandlinga er kjent p\u00e5 f\u00f8rehand.  For Ulvik sin del vil dette tilbodet
  verta gjennomf\u00f8rt hausten 2013 etter ein vertskommunemodell med Voss som vertskommune
  og elles i samarbeid med Voss lokalsjukehus.\\n\\nDei overordna m\u00e5l og verdigrunnlaget
  fr\u00e5 Opptrappingsplanane for psykisk helse og rus vert framleis lagt til grunn
  for regjeringa sin politikk overfor kommunane innan tenesteomr\u00e5de psykisk helse
  og rus (Meld.St.30 (2011-2012) \\\"Se meg!\\\")\\n\\nFr\u00e5 og med 2013 er st\u00f8rsteparten
  av dei \u00f8yremerka tilskota til kommunalt rusarbeid innlemma i rammetilskotet
  til kommunane.  Det vert forventa at kommunane  opprettheld og vidaref\u00f8rer
  kompetansen som er opparbeidd gjennom tiltaka i Opptrappingsplanane, og sikrar vidare
  drift av tiltak som har vist seg effektive. Dette er s\u00e6rs viktig med bakgrunn
  i gradvis innf\u00f8ring av kommunal medfinansiering innan psykisk helse- og rusfeltet.
  (IS-1/2013 rundskriv: Nasjonale m\u00e5l og prioriteringar)\\n\\nKommunane og helsef\u00f8retaka
  er pliktige til \u00e5 samarbeida og det er inng\u00e5tt lovp\u00e5lagte samarbeidsavtalar
  p\u00e5 viktige samarbeidsomr\u00e5de. Nye avtalar er under utarbeiding.  Eit heilskapleg
  pasientforl\u00f8p er eitt av m\u00e5la med samhandlingsreforma. Denne samhandlinga
  gjeld samhandling med tenestemottakar, mellom tenesteniv\u00e5, mellom tenester
  innan kommunane og med andre aktuelle samarbeidspartar. Lova om pasient- og brukarrettar
  inneber sterkare brukarmedverknad/brukarstyring i tildeling og utforming av tenestetilbodet.\\n\\nFolkehelselova
  \u2013 samhandling mellom kommune og lokalsamfunn\\n\\nFolkehelsearbeid handlar
  om \u00e5 skapa gode oppvekstvilk\u00e5r for barn og unge, f\u00f8rebyggja sjukdom
  og skadar  og \u00e5 utvikla eit samfunn som skal stimulera til fellesskap, gi trygge
  rammer, inkludering og deltaking for alle innbyggjarane i kommunane. Dette krev
  systematisk og langsiktig innsats b\u00e5de i og utanfor helsetenesta, p\u00e5 tvers
  av sektorar og forvaltningsniv\u00e5. Ny folkehelselov f\u00f8reset at heradet skal
  bruka alle sine sektorar for \u00e5 fremja folkehelse, ikkje berre helsesektoren.
  Heradet skal gjennom sitt f\u00f8rebyggjande arbeid freista \u00e5 jamna ut og fjerna
  dei \u00f8konomiske og sosiale  faktorane som f\u00f8rer til ulik fordeling av helse
  i folket.\\n\\nGjennom Stortingsmelding om folkehelse: \\\"God helse \u2013 fellesansvar\\\"
  ynskjer regjeringa \u00e5 styrka helsestasjon - og skulehelsetenesta, meir fysisk
  aktivitet og betre merking av mat. (Meld. 34 \\\"Folkehelsemeldinga\\\" (2012-2013))\\n\\nInnovasjon
  i helse og omsorgstenestene\\n\\nTiltaka og l\u00f8ysingane som vert brukt i dag,
  kan ikkje utan vidare nyttast i framtida. Kvar tid har sine utfordringar og krev
  sine l\u00f8ysingar. \u00c5 produsera god omsorg skjer i ein samspelsituasjon og
  kvaliteten vert skapt der og d\u00e5. Dette inneber ein strategi som gjer alle relevante
  akt\u00f8rar til medprodusentar  i utviklinga av helse og omsorgstenester. Dette
  krev eit mangfald av arenaer for samarbeid og samhandling der dialogen skapar drivkraft
  og l\u00e6ring.\\n\\nI St.meld. nr. 25 (2005 \u2013 2006) \\\"Mestring, muligheter
  og mening\\\" vert det peika p\u00e5 langsiktige strategiar for \u00e5 m\u00f8ta
  utfordringane i framtida innan omsorg; blant anna aktiv omsorg med vekt p\u00e5
  kultur og sosiale tilh\u00f8ve og partnarskap med familie og lokalsamfunn. P\u00e5
  grunnlag av denne meldinga vart Nasjonal helse- og omsorgsplan 2011\u2013 2015 med
  delplanane: Demensplan 2015, Nevroplan 2015 og Kompetansel\u00f8ftet 2015, utarbeidd.\\n\\n\\\"Morgendagens
  omsorg\\\" Meld.St.29 (2012-2013) set tidlegare utgreiingar og meldingar inn i ein
  framtidig samanheng, m.a. \\\"Innovasjon i omsorg\\\": NOU 2011:11 og NOU 2011:
  17 \\\"N\u00e5r sant skal sies om p\u00e5r\u00f8rendeomsorg\\\".\\n\\nAnna grunnlagsmateriale
  for meldinga er fagrapporten om implementering av velferdsteknologi i dei kommunale
  helse- og omsorgstenestene fram mot 2030 (Helsedirektoratet 2012). Vidare kan Informasjons-
  og kommunikasjonsteknologi (IKT) og velferdsteknologi gjera ein skilnad for helse-
  og omsorgstenestene i framtida, Meld.St. 23 (2012-2013) \\\"Digital agenda for Norge
  (IKT) for vekst og verdiskaping\\\" og Meld.St. 9 (2012-2013) \\\"\u00c9in innbyggjar
  og \u00e9in journal\\\".\\n\\n\\\"God kvalitet \u2013 trygge tjenester, om kvalitet
  og pasientsikkerhet i helse- og omsorgstjenesten\\\" handlar om eit meir brukarorientert
  helse- og omsorgstilbod, ein meir aktiv pasient- og brukarrolle, meir systematisk
  utpr\u00f8ving av nye metodar for behandling og betre kvalitet gjennom kunnskap
  og innovasjon, Meld.St. 10 (2012-2013).\\n\\nOmsorg i framtida handlar om \u00e5
  tenkja annleis om det me ser. Meldinga til Stortinget er ei melding om \u00e5 kunne
  bruka ressursane p\u00e5 nye m\u00e5tar, og \u00e5 sj\u00e5 kva som er mogeleg  gjennom
  nye metodar og arbeidsformer.\\n\\nViktige tiltak i meldinga er:\\n\\n- Eit innovasjonsprogram
  fram mot 2020\\n- Eit program for ein aktiv og framtidsretta p\u00e5r\u00f8randepolitikk
  2014-2020\\n\\n- Ein nasjonal strategi for frivillig arbeid i helse- og omsorgssektoren\\n-
  Fagleg omlegging med st\u00f8rre vekt p\u00e5 kvardagsrehabilitering, aktivitet
  og milj\u00f8terapi\\n- Eit nasjonalt program for velferdsteknologi\\n- Fornya og
  byggja ut sjukeheimar og omsorgsbustader, m.a. ved \u00e5 vidaref\u00f8ra investeringsordninga
  etter 2015\\n\\n2.2 Helse og omsorg i framtida\\n\\nMottakarar av helse- og omsorgstenester
  i framtida\\n\\nHelse- og omsorgstenesta skal ha eit heilskapleg syn p\u00e5 tenestemottakarane.
  Dei har ikkje berre sjukdom og problem, men og ressursar dei skal bruka til \u00e5
  meistra eige liv og ta del i fellesskapet. Viktige omr\u00e5de for nytenking er
  former for organisasjon, kommunikasjon og arbeidsmetodar, i tillegg til ny teknologi
  og universell utforming.\\n\\nHelse- og omsorgsfellesskap i framtida\\n\\nMed dei
  demografiske utfordringane som Noreg ventar fr\u00e5 2025/2030, kan det verta n\u00f8dvendig  \u00e5
  mobilisera samfunnet sine samla omsorgsressursar, ressursar hj\u00e5 brukarane sj\u00f8lve,
  deira familie og sosiale nettverk, n\u00e6rmilj\u00f8et og lokalsamfunnet, i ideelle
  verksemder og n\u00e6ringsliv.\\n\\nHelse- og omsorgstenesta i framtida\\n\\nKultur,
  m\u00e5ltid, aktivitet og trivsel er grunnleggjande element i eit heilskapleg tenestetilbod.
  Stikkord som aktiv omsorg og kvardagsrehabilitering er sentrale i helse- og omsorgstenestene,
  som prosjekt i dag og som praksis i framtida. Den faglege omstillinga i helse- og
  omsorgstenesta er knytt til at ein legg end\u00e5 sterkare vekt p\u00e5 rehabilitering,
  tidleg innsats, aktivisering, nettverksarbeid, milj\u00f8behandling, rettleiing
  av p\u00e5r\u00f8rande og frivillige, og til innf\u00f8ring av velferdsteknologi.
  For \u00e5 skapa denne omstillinga trengst st\u00f8rre fagleg breidde  med fleire  faggrupper
  og auka vekt p\u00e5 tverrfagleg arbeid og samhandling.\\n\\nArena for helse- og
  omsorgstenester i framtida\\n\\nBruk av velferdsteknologi og universell tilpassing
  gjer det enklare  \u00e5 ta i mot omsorgstenester i eigen heim og \u00e5 delta i
  samfunnet. Utforminga av sjukeheimar og omsorgsbustader set ogs\u00e5 rammer for
  tenesteytinga. Regjeringa signaliserer at dei vil vidaref\u00f8ra tilskotsordninga
  i Husbanken til bustader for tenesteyting ogs\u00e5 etter 2015. Dette gjeld b\u00e5de
  sjukeheimsplassar og omsorgsbustader (Meld.St. (2012-2013).\\n\\nDet skal utgreiast
  om ordninga ogs\u00e5 kan tilpassast og gi rom for utbygging av Tryggleiksbustader.
  Tryggleiksbustader er bustader med smarthusteknologi, resepsjon og hotellservice,
  der leigetakarane kan f\u00e5 dekka ulike behov for praktisk tilrettelegging. Ved
  bygging av omsorgsbustader kan smarthusteknologi  vurderast.\\n\\n2.3 Samanheng
  med anna planverk\\n\\nHelse- og omsorgsplanen er ein delplan av kommuneplanen for
  2009-2020. Dei strategiar, m\u00e5l og rammeverk for styring som vert lagt fram
  i kommuneplanen, gjeld for leiing, utforming og gjennomf\u00f8ring av tenestene
  i helse- og omsorgsomr\u00e5det. Ulvik vedtok i samband med kommuneplanen for 2009-2020
  ein overordna visjon for heradet, etter ein omfattande prosess med m a ein eigen
  \\\"visjonsverkstad\\\" med heradstyret og administrasjonen:\\n\\n\\\"Ulvik herad
  skal vera ein stad for mangfald, opplevingar og utvikling\\\".\\n\\nDen verdimessige
  samanhengen mellom visjon og m\u00e5lsetjing skal takast omsyn til i den nye helse-
  og omsorgsplanen. I praksis betyr det at helse- og omsorgstenester skal ytast med
  eit mangfald som gir opplevingar og utvikling for brukarar av tenestene i heradet.
  Det er ei overordna m\u00e5lsetjing \u00e5 gi eit tilpassa og framtidsretta tilbod
  om helse og omsorgstenester som skal styrka den enkelte si evne til eigenomsorg.
  Tenestetilbodet skal vera fleksibelt og robust nok til \u00e5 m\u00f8ta framtidige
  behov. Det heiter vidare i kommuneplanen for 2009-2020:\\n\\n\u00ab\u2026Ulvik herad
  skal  yta god service og vera ein moderne, effektiv og utviklingsorientert kommune
  med evne til endring og vilje til utpr\u00f8ving av nye modellar og metodar i takt
  med skiftande utfordringar.\u00bb\\n\\n2.4 Tilgjenge og brukarmedverknad\\n\\nI
  eit lite lokalsamfunn vil det alltid vera b\u00e5de fordelar og ulemper ved sj\u00f8lve
  storleiken; det som i den eine samanhengen vert opplevd som eit n\u00e6rt og lett
  tilgjengeleg tenesteapparat, vil i andre samanhengar verta opplevd som utilstrekkeleg
  eller lite kompetent, ha lite mangfald eller er avgrensa i omfang. Det som den eine
  dagen verkar oversiktleg og innan trygg kontroll i helse- og omsorgstenesta, kan
  den neste dagen opplevast som eit problem fordi det t d krev hjelp  fr\u00e5 utanforst\u00e5ande
  eller er ei ny problemstilling som krev ei ny teneste som m\u00e5 byggast opp fr\u00e5
  grunnen av. Det grunnleggjande i ideen om \\\"tilgjenge\\\" som grunnprinsipp er
  likevel at Ulvik skal kunne handtera sin eigen storleik, b\u00e5de innbyggjartal,
  talet p\u00e5 tilsette, omfanget av tenestetilbodet, sentral busetnad av tenestemottakarane
  m m, og sj\u00e5 p\u00e5 det som ein fordel ved b\u00e5de \u00e5 reindyrka det positive
  med \u00e5 vera liten, men samstundes vera medviten om dei utfordringar som fylgjer
  med situasjonen. Helse- og omsorgstenesta skal arbeida kontinuerleg med skulering
  av tilsette, synleggjering av tenestetilbod og rammer, dynamisk organisering av
  tilbodet og ha fokus p\u00e5  dei grunnleggjande verdiane om tilgjenge.\\n\\nI eit
  notat fr\u00e5 Rokkansenteret, 2011 (Dag Arne Christensen) vert det omtala kva som
  p\u00e5verkar kor n\u00f8gd ein er med kommunen sitt velferdstilbod. Det sentrale
  der er at kvaliteten har st\u00f8rre verdi enn omfanget av tenester. Fellesnemnaren
  som kan nyttast om desse kvalitetane er tilgjenge.\\n\\nI arbeidsgruppa har det
  kome fram ei rekkje moment fr\u00e5 m\u00e5ten helse- og omsorgstenesta i Ulvik
  vert drifta, og som kan seiast \u00e5 ha \\\"tilgjenge\\\" som fellestrekk. Ulvik
  er ein kommune med vel 1100 innbyggjarar og dei aller fleste bur relativt n\u00e6rt
  sentrum og dermed ogs\u00e5 til det tenestetilbodet som finst i heradet. Omgrepet
  tilgjenge kan definerast p\u00e5 fleire m\u00e5tar og setjast i n\u00e6r samanheng
  med m\u00e5ten tenestene i Ulvik er organisert:\\n\\nTilgjenge som geografisk storleik:\\n\\nSentralisert
  busetnad i heradet gjer helse- og omsorgstenestene lett tilgjengelege og gjer det
  lettare \u00e5 arbeida med f\u00f8rebyggjande tiltak.\\n\\nTilgjenge som verdi:\\n\\nBrukarane
  og deira representantar skal m\u00f8tast p\u00e5 ein venleg, raus og  respektfull
  m\u00e5te. Tilgjenge i denne samanhengen er at innbyggjarane opps\u00f8kjer tenesta
  fordi ho er im\u00f8tekomande.\\n\\nTilgjenge som kompetanse:\\n\\nDet er eit h\u00f8gt
  kompetanseniv\u00e5 (spesialiseringsniv\u00e5) i Ulvik og det skal vera eit sterkt
  fokus p\u00e5 mobilisering av tilgjengeleg kompetanse for dei som treng helse- og
  omsorgstenester. Det \u00e5 gjera kompetanse tilgjengeleg for alle vil ogs\u00e5
  vera viktig for samarbeid med andre tenesteomr\u00e5de i heradet og med eksterne
  instansar.\\n\\nTilgjenge som evne til konstruktiv tilpassing:\\n\\nHelse- og omsorgstenesta
  i Ulvik skal vera dynamisk og tilpassa seg endringar i behovet  hj\u00e5 innbyggjarane  og
  hj\u00e5 tenestemottakarane. Evne og vilje til omstilling og nytenking skal prega
  organiseringa og kvaliteten i tenestene. Evne til konstruktiv tilpassing handlar
  ogs\u00e5 om samhandling i Hardangerregionen for felles l\u00f8ysingar og utvikling
  b\u00e5de i Ulvik herad og i Hardangerregionen.\\n\\nBrukarmedverknad\\n\\nRegjeringa
  legg vekt p\u00e5 aktivitet, deltaking og meistring som heilt sentrale element i
  helse- og omsorgstenesta i dag og i framtida. Det er difor viktig \u00e5 styrka
  og synleggjera  brukarane sitt medborgar- og medverknadsansvar og den enkelte sine
  ressursar til sj\u00f8lve \u00e5 p\u00e5verka eige liv og eiga helse. Berre sterk
  brukarmedverknad kan utl\u00f8ysa verdiar som deltaking, sj\u00f8lvstende og normalisering.
  Meld.St.29 (2012-2013). Brukarmedverknad er ein rett som skal sikra at tenestene
  vert utforma i samarbeid mellom den det gjeld og heradet. Kjernen i brukarmedverknad
  er at den enkelte kjenner sin eigen situasjon best og veit kva som skal til for
  ein betre livssituasjon. Prinsippet er lovfesta og gjeld p\u00e5 alle trinna i tenesteutforminga
  og tenesteytinga.\\n\\n3  Helse- og omsorgstenesta i Ulvik mai 2013\\n\\n3.1 Tenestetilbodet\\n\\nDen
  samla helse- og omsorgstenesta sitt overordna m\u00e5l er \u00e5 tilby tenester
  i det omfang og til den kvalitet som g\u00e5r fram av krava i lovverk og nasjonale
  f\u00f8ringar, til den kostnad og etter dei rammer som heradstyret har vedteke.
  Helse- og omsorgstenesta i Ulvik yter eit breitt spekter av tenester til innbyggjarane
  i heradet og omfattar alle helse-, sosiale- og omsorgstenester for barn og vaksne.
  Den samla helse- og omsorgstenesta i Ulvik omfattar fylgjande tenester:\\n\\nHelse-
  og sosialavdelinga\\n\\nAdministrativ leiing av eining helse og sosial med fylgjande
  avdelingar:\\n\\n- Legekontor\\n- Helsestasjon/jordmorteneste\\n- Dag- og aktivitetstilbod/psykiatrisk
  sjukepleie\\n- Barne- og ungdomsmedarbeidar (40 % stilling)\\n- Kommunalt tilplikta
  fysioterapiteneste (14,2 timar pr. veke)\\n- Bust\u00f8nad/husbanken sine st\u00f8tteordningar.\\n\\nKontoret
  har ansvar for\\n\\n- alle tenester etter Helse- og omsorgstenestelova som etter
  avtale ikkje er overf\u00f8rt til lokalt NAV-kontor eller som ligg til eining pleie
  og omsorg \u2013 m.a. st\u00f8ttekontakt, omsorgsl\u00f8n og BPA.\\n- for saker
  etter serveringslova og alkohollova og er\\n- sekretariat for R\u00e5det for funksjonshemma
  i Ulvik og\\n- koordinator for psykososialt kriseteam\\n\\nTotalt 7,85 stillingar
  fordelt p\u00e5 10 tilsette.\\n\\nAdministrasjonen ligg sentralt plassert b\u00e5de
  for brukarane av tenestene og i h\u00f8ve til dei andre tenesteomr\u00e5de i eininga
  og heradet si sentrale leiing.\\n\\nPleie- og omsorgstenesta\\n\\nAvdeling pleie
  og omsorg har fylgjande tenester:\\n\\n-\\nInntaksnemnd\\n-\\nTverrfagleg gruppe\\n-
  Ulvik sjukeheim og  Institusjonskj\u00f8kken, utk\u00f8yring av middag\\n- Dag-/Nattopphald\\n-
  Heimesjukepleie\\n- Heimehjelp\\n- Dagavdeling for personar med demens\\n- Dagsenteret  Arbeidsstova\\n-
  Tryggleiksalarm\\n- Ergoterapi.\\n- Fysioterapi\\n- Omsorgsbustad i Brakanestunet/Trygdebustad
  i Prestegarden:\\n- Kommunalt hjelpemiddellager:\\n- H\u00f8yrseltekniske hjelpemiddel:\\n-
  Synstekniske hjelpemiddel:\\n\\nAvdelinga har m.a. ansvar for\\n\\n- Tildeling av  tenester
  etter helse- og omsorgstenestelova knytt til  behovet for n\u00f8dvendig helsehjelp\\n-
  Tildeling  og omfang av hjelpebehov vert vurdert ut i fr\u00e5 s\u00f8kjar sitt
  funksjonsniv\u00e5, eigne ressursar og helsetilstand.\\n- Tiltaka vert vurdert under
  vegs med tanke p\u00e5 \u00e5 avslutta, vidaref\u00f8ra eller auka opp  tiltak.\\n-
  Samarbeid med spesialisthelsetenesta f\u00f8r, under og etter sjukehusopphald\\n\\nAvdeling
  pleie og omsorg  har 34,75 stillingar, inkludert pleie- og omsorgsleiar, og har
  omsorgsbasen sin lokalisert ved kommunal institusjon, Ulvik sjukeheim.\\n\\nSamarbeidsl\u00f8ysingar\\n\\nBarnevern.\\n\\nUlvik
  herad har overf\u00f8rt alt barnevernsfagleg arbeid til Hardanger Barnevernstjeneste  gjennom
  ein vertskommuneavtale. Hardanger Barnevernstjeneste er eit interkommunalt barnevern
  med fylgjande herad som medlemer: Odda (vertskommune), Jondal, Ullensvang, Eidfjord
  og Ulvik.\\n\\nDet er oppretta faste samarbeidsorgan mellom heradet og barnevernstenesta
  \u2013 gjennom tverrfaglege samarbeidsm\u00f8te og styringsgruppe p\u00e5 r\u00e5dmannsniv\u00e5.
  Det er p t ikkje aktuelt \u00e5 vurdera endringar i denne ordninga.\\n\\nNAV.\\n\\nLokalt
  NAV-kontor har m.a. fylgjande ansvar:\\n\\n- \u00d8konomisk sosialhjelp\\n- \u00d8konomisk
  rettleiing/gjeldsrettleiing og gjeldstingingar\\n- Flyktningearbeid\\n- Rusarbeid
  (individuelle hjelpetiltak)\\n- Bustad for vanskelegstilte/skaffe mellombels husv\u00e6re.\\n\\nNAV-kontoret
  ligg sentralt plassert saman med resten av helse- og sosialtenester og heradet sin
  administrasjon.\\n\\n3.2 Utgiftsbehov\\n\\nInntektssystemet for kommunane som vert
  omtala i \\\"Gr\u00f8nt hefte\\\", viser statlege overf\u00f8ringar til kvar enkelt
  kommune. Som grunnlag for statlege overf\u00f8ringar, ligg utrekningar av dei ressursane
  ein kommune treng for \u00e5 utf\u00f8ra lovp\u00e5lagte oppg\u00e5ver. Dette vert
  kalla kommunen sitt utgiftsbehov. Utgiftsbehovet vert utrekna i prosent av landet
  sitt utgiftsbehov, som alltid er 100 eller 1 i tabellane.\\n\\nEit anna omgrep i
  inntektssystemet er justert innbyggjar. Justert innbyggjar betyr at tala er justert
  i h\u00f8ve til ulike faktorar, som alderssamansetjing, levek\u00e5r, avstandar
  og ei rekkje andre kjenneteikn. P\u00e5 denne m\u00e5ten vert innbyggjartalet justert,
  slik at det kan samanliknast med andre kommunar og kommunegruppa.\\n\\nTabell 3.2.1\\n\\nKommentar
  til figur 3.2.1 og tabell 3.2.1:\\n\\nUtgiftsbehovet til kommunehelsa i Ulvik er
  utrekna til 155. Det vil sei at Ulvik herad sitt utgiftsbehov ligg 55 prosent over
  landet sitt gjennomsnittlege utgiftsbehov. Kommunegruppe 6 sitt utgiftsbehov ligg
  69 prosent over landsgjennomsnittet, som er h\u00f8gare enn Ulvik sitt behov.\\n\\nTabell
  3.2.2\\n\\nKommentar til figur 3.2.2 og tabell 3.2.2:\\n\\nUtgiftsbehovet i Ulvik
  herad til sosialtenesta er utrekna til 54 prosent av gjennomsnittet for landet.
  KOSTRA-gruppe 6 har eit utgiftsbehov p\u00e5 68, som er h\u00f8gare enn Ulvik sitt
  behov.\\n\\nTabell 3.2.3\\n\\nKommentar til figur 3.2.3 og tabell 3.2.3.\\n\\nUtgiftsbehovet
  til pleie- og omsorg i Ulvik herad er utrekna  til 158 (1,58) \u2013 det vil sei
  at Ulvik herad sitt utgiftsbehov ligg 58 prosent over landet sitt (gjennomsnittlige)
  utgiftsbehov. Kommunegruppe 6 sitt utgiftsbehov ligg 51 prosent over landsgjennomsnittet.
  Ulvik ligg her litt h\u00f8gare enn snittet for kommunegruppa.\\n\\nDersom ein kommune
  har h\u00f8gt utgiftsbehov i ein sektor, kan ein venta at kommunen brukar ein st\u00f8rre
  del av sine ressursar til denne sektoren. For Ulvik herad er det ein viss samanheng,
  men ikkje n\u00e5r det gjeld tal for kommunegruppe 6.  Av andre opplysningar i KOSTRA
  (ureviderte tal per 26.03.2013) g\u00e5r det fram at Ulvik herad i 2012 brukte 32,9
  % av sine samla netto driftsutgifter til pleie og omsorg. Tilsvarande tal for landsgjennomsnittet
  var 31,5 % og for kommunegruppa 37,4 %\\n\\n3.3 Framskriving av folketalet\\n\\nKommentar:
  Dersom prognosen sl\u00e5r til, vil folketalet totalt sett g\u00e5 ned. Prognosen
  for innbyggjarar 20-66 \u00e5r viser same tendens, men med st\u00f8rre prosentvis
  nedgang fr\u00e5 2030 til 2040.\\n\\nKommentar: Prognosen for utviklinga av folketalet
  viser at talet p\u00e5 personar over 80 \u00e5r vil vera det same i 2030 som det
  er i 2013. Fram mot 2025 vil talet p\u00e5 personar over 80 \u00e5r og eldre ha
  ein reduksjon fr\u00e5 99 til 84 personar, som er ein reduksjon p\u00e5 15 personar.\\n\\nFigur
  3.2.4 Utrekning  av aldersbereevne og familiekoeffisient for Ulvik herad, tal vist
  for 5- \u00e5rs periodar fr\u00e5 2013 til 2040, framskrive med alternativ middels
  nasjonal vekst\\n\\nKommentar: Aldersbereevna viser forholdet mellom dei yrkesaktive
  (16-66 \u00e5r) og den eldre delen av innbyggjarane (67 \u00e5r og eldre). Aldersbereevna
  er t d  av interesse for finansiering av pensjonar, velferdstilbod og helse- og
  omsorgstenester. Aldersbereevna tek ikkje omsyn til omfanget av personar i yrkesaktiv
  alder som av ulike \u00e5rsaker st\u00e5r utanfor arbeidsmarknaden.\\n\\nFamilieomsorgskoeffisienten
  seier kor mange eldre personar (85 \u00e5r og eldre) det er per 100 personar i aldersgruppa
  50 \u2013 66 \u00e5r. N\u00e5r ein har valt desse to aldersgruppene, er det fordi
  ein meiner at  eldre over 85 \u00e5r vil ha dei st\u00f8rste omsorgsbehova, medan
  aldersgruppa 50-66 \u00e5r omfattar dei eldste sine barn og desse er dermed dei
  n\u00e6raste p\u00e5r\u00f8rande. Endringar i alderssamansetjinga i folket er avgjerande
  for kor mange familieomsorgsgivarar dei aller eldste kan st\u00f8tta seg p\u00e5.\\n\\n3.4
  Behov for plassar med heild\u00f8gns bemanning\\n\\nUlvik herad har pr mai 2013
  ikkje omsorgsbustader med heild\u00f8gns bemanning  og sjukeheimen stettar korkje
  krava til areal og utforming av pasientromma eller utforming av rom til st\u00f8ttefunksjonar
  etter dagens krav. Dei er likevel ikkje ulovlege i bruk.\\n\\nUlvik sjukeheim vart
  bygd i 1974. Av 21 rom har 8 av romma eigne bad. Ei utbetring med bad til alle pasientrom
  til dagens standard med areal og utforming vil f\u00f8ra til reduksjon i talet p\u00e5
  pasientrom.\\n\\nI 2013 er alle 21 plassane med heild\u00f8gns teneste, institusjonsplassar.   I
  mai 2013 har kommunen 17 omsorgsbustader. Bustadene er bygd av og eigd av Ulvik
  Bustadstifting. Ulvik herad har avtale med Ulvik bustadstifting om bruk og tildeling
  av bustadene. Dei som har f\u00e5tt tildelt omsorgsbustad m\u00e5 s\u00f8kja  hjelp
  gjennom  ordin\u00e6re heimetenester  p\u00e5 lik line med andre heimebuande. Omsorgsbustad
  i seg sj\u00f8lv gir ikkje rettskrav p\u00e5 tenester. I tillegg eig kommunen 4
  trygdebustader lokalisert ved sida av sjukeheimen.  Som framtidig omsorgsarena b\u00f8r
  heradet kunne tilby omsorgsbustader med heild\u00f8gns bemanning, anten med felles
  areal eller som bufellesskap. Kor mange av det totale talet p\u00e5 plassar med
  heild\u00f8gns bemanning som skal driftast som institusjonsplassar eller som skal
  driftast som omsorgsbustader, er ei vurdering som b\u00f8r gjerast i samband med
  utgreiing av investeringsbehov og framtidig lokalisering av omsorgsarenaene. Desse
  to buformene har ulik betalingsordning for pasient/brukar.\\n\\nUlvik herad har
  god styring og bruk av sine korttidsplassar. Dette syner ogs\u00e5 at det er godt
  samarbeid mellom institusjonstenesta og open omsorg.  Ulvik herad bruker 3 plassar
  av 21 institusjonsplassar til korttidsplassar. Dei 18 andre plassane vert brukt
  til langtidsopphald.\\n\\nBruken av korttidsplassar og grad av tilgjengelege korttidsplassar
  er ein n\u00f8kkelfaktor for \u00e5 f\u00e5 god samanheng i tenestetrappa i helse
  og omsorg. Mangel p\u00e5 sirkulasjon i korttidsplassane f\u00f8rer til k\u00f8-danning
  mellom dei ulike niv\u00e5a i tenestekjeda. Mangel p\u00e5 korttidstilbod kan ogs\u00e5
  f\u00f8ra til at heradet kjem seint i gang med rehabilitering. Det er ikkje talet
  p\u00e5 korttidsplassar \u00e5leine som er avgjerande, men korleis desse plassane
  vert brukt og at dei vert sett i samanheng med resten av det tilbodet heradet har.\\n\\nUtskrivingsklare
  pasientar fr\u00e5 sjukehus i 2012 var 45 personar og Ulvik herad har teke i mot
  alle. Pr 13. mai 2013 er 28 pasientar melde til kommunen fr\u00e5 sjukehus. N\u00e5r
  det gjeld \u00f8yeblikkeleg-hjelpplassar, vert dei drifta i samarbeid med Voss kommune
  i ein vertskommunemodell f o m september 2013.\\n\\nTabell 3.4.1 viser framskriving
  av behovet for plassar med heild\u00f8gns bemanning med grunnlag i prognose for
  utviklinga av talet p\u00e5 innbyggjarar 80 \u00e5r og eldre fr\u00e5 2013 til 2040.
  Utrekninga er gjort for tre alternativ: Dekningsgraden som Ulvik har i dag, 22,1
  % av 80+, dekningsgraden 25 % av 80+ som vart brukt i samband med sentrale f\u00f8ringar
  p\u00e5 1990-talet og landsgjennomsnittet for 2012 i KOSTRA (29 % av 80+).\\n\\nTabell
  3.4.1 Behov for plassar med heild\u00f8gns bemanning, dvs institusjonsplassar og
  omsorgsbustader med heild\u00f8gns bemanning\\n\\n|  | 2013 | 2020 | 2025 | 2030
  | 2040 |\\n|---|---|---|---|---|---|\\n| 80+ | 99 | 68 | 84 | 99 | 115 |\\n| Plassar
  22,1 % av 80+ | 21 | 16 | 19 | 21 | 26 |\\n| Plassar 25 % av 80+ | 25 | 17 | 21
  | 25 | 29 |\\n| Plassar 29 % av 80+ | 29 | 20 | 25 | 29 | 34 |\\n\\nUlvik herad
  vil fram til 2020 greia seg med 21 plassar med heild\u00f8gns bemanning etter alle
  tre alternativa. Med same dekningsgrad som i 2013 vil heradet ha nok plassar fram
  til 2025/2030. Dersom heradet skulle ha same dekningsgrad som landsgjennomsnittet,
  ville heradet ha bruk for 8 fleire plassar i 2013 og 13 fleire plassar i 2040, under
  f\u00f8resetnad av at prognosen for folketalet 80 \u00e5r og eldre sl\u00e5r til.
  Med 25 % av 80+ ville heradet trenge 4 fleire plassar i 2013 og 8 fleire plassar
  i 2040.\\n\\nN\u00e5r me ser framskriving av folketalet i samanheng med talet p\u00e5
  heild\u00f8gns plassar og Ulvik herad sin praksis i bruken av korttidsplassar, inneber
  dette at Ulvik herad vil ha nok plassar for heild\u00f8gns teneste med 21 plassar
  fram til 2025. Dersom prognosen sl\u00e5r til, vil heradet f\u00f8rst etter 2025
  ha behov for fleire plassar med heild\u00f8gns teneste ut fr\u00e5 dei erfaringane
  som heradet har med kapasiteten i 2012.Dette kan l\u00f8ysast t d med d\u00f8gnbemanna
  omsorgsbustader. Her har ein ikkje teke h\u00f8gde for ei s\u00e6rskilt tilflytting
  til Ulvik av eldre personar som s\u00f8kjer eit omsorgstilbod.\\n\\n4 M\u00e5lomr\u00e5de
  for tenesteutvikling\\n\\nDet vert lagt vekt p\u00e5 endringskompetanse som strategi  for
  at Ulvik herad skal klara \u00e5 m\u00f8ta utfordringane i framtida med fleksible
  og m\u00e5lretta tenester for innbyggjarane. Dette vert nemnd spesifikt i kommuneplanen
  for 2009-2020:\\n\\n\\\"Ulvik herad skal yta god service og vera ein moderne, effektiv
  og utviklingsorientert kommune med evne til endring og vilje til utpr\u00f8ving
  av nye modellar og metodar i takt med skiftande utfordringar.\\\"\\n\\nN\u00e5r
  det gjeld folkehelseprofilen 2013 for Ulvik , viser den at heradet  ligg  om lag  p\u00e5
  same niv\u00e5 som landet. Med omsyn til omfanget av psykiske symptom og lidingar,
  ligg  heradet  under landsniv\u00e5et. I tillegg forvaltar Ulvik herad  ein st\u00f8rre
  erfaringsressurs, eldre over 80 \u00e5r, enn elles i landet.\\n\\nDei fire m\u00e5lomr\u00e5da
  for  tenesteutvikling innan helse og omsorg er:\\n\\n- Bygningsmessige forhold -
  investering, nybygg, samlokalisering\\n- Samhandlingsreforma \u2013 kompetanse og
  samhandling\\n- Utvikling av tenestene\\n- Organisasjon og leiing\\n\\n4.1  Bygningsmessige
  forhold - investering, nybygg, samlokalisering\\n\\nInterkommunalt legekontor \u2013
  arealbehov\\n\\nMed bakgrunn i eit fellesprosjekt i regi av Hardangerr\u00e5det
  er det planlagt interkommunalt samarbeid og ny organisering av b\u00e5de folkehelsearbeidet,
  legevakta og allmennlegetenesta. M\u00e5let er \u00e5 f\u00e5 meir robuste tenester
  i herada i Hardanger og Voss kommune. Ulvik har delteke i dette arbeidet og vedteke
  politisk ei nyordning av legevakta. Eit arbeid er i gang med \u00e5 vurdera korleis
  eit tett samarbeid mellom legekontora i Ulvik, Granvin og Eidfjord kan etablerast
  og driftast. Ein del av samarbeidet inneber ogs\u00e5 felles kommuneoverlege for
  dei tre herada.\\n\\nDersom basekontoret for legetenesta i Ulvik og Granvin vert
  lagt til Ulvik, vil det verta  behov for utviding av kontorlokala. Noverande lokale
  i Sentrumsbygget er ueigna for slik utviding. P\u00e5 sikt vil det vera behov for
  \u00e5 finna nye lokale til legekontor. Eit anna alternativ er helsesenter for b\u00e5de
  lege, helsestasjon, fysioterapi m fl.\\n\\nInstitusjon og omsorgsbustader \u2013
  utbetring og/eller nybygg\\n\\nDen st\u00f8rste utfordringa som Ulvik herad st\u00e5r
  overfor, er sp\u00f8rsm\u00e5let om kva som skal gjerast med noverande sjukeheimsbygg.
  Sjukeheimen er bygd i 1974 og er ikkje tilpassa krava til areal og utforming av
  rom for tenestemottakarar ved institusjonen, korkje i dag eller for framtida. I
  rettleiar for omsorgsbustader og sjukeheim \\\"Rom for trygghet og omsorg\\\" skriv
  Husbanken fylgjande om generelle krav til omsorgsbustader. I teksten g\u00e5r det
  fram at dette ogs\u00e5 gjeld sjukeheimar:\\n\\n\u00abUavhengig av boligtype og
  brukergruppe anbefaler Husbanken at byggene generelt skal v\u00e6re planlagt med
  tanke p\u00e5 bevegelseshemmede, orienterings- og milj\u00f8hemmede. De skal ha
  en bygningsmessig standard som gj\u00f8r at de bruker lite energi til oppvarming.
  Omsorgsplan 2015 legger spesiell vekt p\u00e5 tilrettelegging for personer med demens.
  Samtidig m\u00e5 det s\u00f8rges for n\u00f8dvendig tilpasning til de ulike brukergruppene.
  Det m\u00e5 ogs\u00e5 tas h\u00f8yde for at boligene og sykehjemmene skal v\u00e6re
  arena for omfattende tjenesteyting. Derfor er hensynet til arbeidsmilj\u00f8 for
  eventuelt personale viktig. For \u00e5 forhindre brann skal alle bygninger plasseres
  i risikoklasse 6 og dessuten utstyres med boligsprinkling.\\n\\nHusbanken administrerer
  investeringstilskotet til omsorgsbustader og sjukeheimar. Investeringstilskot fr\u00e5
  Husbanken kan gjevast til bygging/utbetring av plass i institusjon, omsorgsbustad,
  fellesareal i eksisterande omsorgsbustader og d\u00f8gnomsorgsplassar for \u00f8yeblikkeleghjelp.
  N\u00e5r heradet skal st\u00e5 som eigar, vert det gitt tilskot p\u00e5:\\n\\n-
  30 % av godkjende anleggskostnader til omsorgsbustad med fellesareal, avgrensa oppover
  til 840 000,- kr pr bustad\\n- 40 % av godkjende anleggskostnader for plass i institusjon,
  m a i ordin\u00e6re eller palliative einingar p\u00e5 sjukeheim og d\u00f8gnomsorgsplassar
  for \u00f8yeblikkeleg-hjelp, avgrensa oppover til 1 120 000,- kr pr plass\\n- Inntil
  40 % av godkjende anleggskostnader til fellesareal for eksisterande omsorgsbustader
  for \u00e5 oppn\u00e5 heild\u00f8gns teneste og lokale  for tilbod om dagaktivitet\\n\\nFor
  2013 vert tilskotet gitt ut fr\u00e5 ein anleggskostnad p\u00e5 maksimalt 2,8 mill
  kroner per sjukeheimsplass eller omsorgsbustad.\\n\\nHusbanken hjelper ogs\u00e5
  kommunane og andre akt\u00f8rar med \u00e5 f\u00e5 god kvalitet p\u00e5 prosjekta.\\n\\nHelse-
  og omsorgssenter \u2013 samlokalisering\\n\\nVed \u00e5 etablera ulike tenester
  i eit felles helse- og omsorgssenter  kan fylgjande  omr\u00e5de for mogeleg synergieffekt  skildrast
  slik:\\n\\nKompetanse: Med ulike faggrupper samla kan det gjera det lettare \u00e5
  arbeida tverrfagleg og \u00e5 bruka kompetansen der slik kompetanse trengst, meir
  m\u00e5lretta. Tverrfagleg samarbeid aukar kvaliteten for pasientar/brukarar med
  samansette behov. Eit st\u00f8rre fagmilj\u00f8 aukar b\u00e5de kunnskapsgrunnlaget
  og erfaringsgrunnlaget innan aktuelle fagomr\u00e5de.\\n\\nFleksibilitet: Med fleire
  medarbeidarar i ei samlokalisert helse- og omsorgsteneste kan fleksibiliteten verta
  st\u00f8rre. Gjennom samarbeid vil medarbeidarane f\u00e5 kjennskap til kvarandre
  sine arbeidsomr\u00e5de og -oppg\u00e5ver. Dette kan opna opp for nytenking og nye
  arbeidsm\u00e5tar/samarbeidsformer som kan inspirera til felles probleml\u00f8ysing.\\n\\nKoordinering:
  Koordinering av ulike oppg\u00e5ver kan gi st\u00f8rre h\u00f8ve til \u00e5 styra
  ressursbruken b\u00e5de n\u00e5r det gjeld bruk av ressursar og utnytting av felles
  ressursar. Koordinering av fleire funksjonar kan gi synergieffekt med omsyn til
  rasjonell oppg\u00e5vel\u00f8ysing, og bruk av rett kompetanse p\u00e5 rett stad.
  Nybygg vil kunne f\u00f8ra til meir \u00f8konomisk drift, reduserte vedlikehaldsutgifter
  og utgifter til straum/oppvarming.\\n\\nUtgreiing\\n\\nDet b\u00f8r gjennomf\u00f8rast
  ei vurdering av kostnader, framtidig  funksjonalitet og kapasitet ved sjukeheimen
  med utgangspunkt i behovet for heild\u00f8gns plassar fr\u00e5 2025/40. Utgreiinga
  b\u00f8r visa konsekvensar for heile helse- og omsorgstenesta.\\n\\nVidare b\u00f8r
  det utgreiast kostnader, funksjonalitet og kapasitet ved \u00e5 samlokalisera  heile  helse-
  og omsorgstenesta i eit helsesenter p\u00e5 den tomta der det var planlagt eit rehabiliteringssenter.
  I denne utgreiinga ligg og vurdering av lokala i Sentrumbygget med tanke p\u00e5
  framtidige behov.\\n\\nFram til 2025 vil det ikkje vere auke i talet p\u00e5 personar
  over 80 \u00e5r i Ulvik. Dette gir heradet tid til \u00e5 planleggja for \u00e5
  m\u00f8ta utfordringane etter 2025. Det er likevel n\u00f8dvendig  \u00e5 erkjenna
  at sjukeheimen i dag ikkje svarer til dei krava som gjeld i 2013, med omsyn til
  areal og utforming,\\n\\nArbeidsgruppa og forankringsseminara har identifisert fylgjande
  utviklingsbehov:\\n\\nNybygg eller rehabilitering av sjukeheimen \u2013 samlokalisering
  av helsetenestene i Ulvik \u2013 sentral, god tomt til sjukeheim \u2013 helsesenter
  og sjukeheim i lag \u2013  trivelegare uteplass p\u00e5 skulen \u2013 gang- og sykkelsti
  \u2013 sjukeheim som stettar framtidige krav \u2013 utbygd institusjon med alle
  fasilitetar/\\\"avdelingar\\\" \u2013 avklaring institusjon \u2013 plan for gjennomgangsbustader
  \u2013 helseog omsorgssenter\\n\\n4.2  Samhandlingsreforma, kompetanse og samhandling\\n\\nDet
  er h\u00f8g fagleg kompetanse i Ulvik. Dette betyr at b\u00e5de den formelle og
  uformelle kompetansen dekker mange ulike omr\u00e5de og samtidig er \\\"spesialisert\\\"
  ved at det er mange helsefagutdanna b\u00e5de p\u00e5 universitets,- h\u00f8gskule-
  og fagarbeidarniv\u00e5 i tillegg til vidareutdanningar.  Dette gjeld innan b\u00e5de
  helse-, pleie- og omsorgsomr\u00e5det. Arbeidsgruppa og forankringsseminara har
  identifisert mange deltenester som i dag anten ikkje finst eller det er behov for
  \u00e5 utvikla vidare framover. Det er sentralt at ein slik oversikt finst i helse-
  og omsorgstenesta og at denne vert lagt til grunn n\u00e5r det skal setjast konkrete
  m\u00e5l for arbeidet i tenesta. Det er ein f\u00f8resetnad for eit herad p\u00e5
  Ulvik sin storleik at behovet for nye tenester vert sett i samanheng med prinsippa
  i samhandlingsreforma  og at potensielle  tenestesamarbeid med andre n\u00e6rliggande
  herad vert vurdert f\u00f8r ei evt lokal satsing med tilh\u00f8yrande investeringar.\\n\\nSamhandlingsreforma
  med tilh\u00f8yrande lovverk legg eit ansvar p\u00e5 Ulvik herad  om vilje og evne
  til \u00e5 samarbeida med spesialisthelsetenesta, i f\u00f8rste omgang for somatisk
  helseteneste  og  i neste omgang ogs\u00e5 for psykisk helsevern- og rustenesta.
  Den viktigaste kompetansen som kan mobiliserast i eit herad p\u00e5 Ulvik sin storleik,
  er nettopp samhandlings- og samarbeidskompetansen \u2013 b\u00e5de som tankesett
  og som praktisk handling.\\n\\nNy interkommunal legevakt p\u00e5 Voss skal innf\u00f8rast
  fr\u00e5 januar 2014 (kl. 1600 til kl. 0800). Dette kan medf\u00f8ra endringar for
  sjukeheimen/pleie- og omsorgstenesta som ikkje vil ha lege like  tilgjengeleg utanom
  arbeidstid som i tidlegare  lokal  legevakt. For \u00e5 sikra sjukepleiarane r\u00e5d
  fr\u00e5 lege som kjenner pasientane, dei legetenestene dei treng, er det sett i
  gang arbeid med klargjering av nye rutinar (t d rutinar ved d\u00f8dsfall, lokal
  lege tilgjengeleg p\u00e5 telefon for sjukepleiarane). Akuttilbodet vert sikra gjennom
  ambulansetenesta og akuttf\u00f8rstehjelpar i brannvernet i tillegg til at vaktlege
  p\u00e5 Voss skal rykkja ut til st\u00f8rre hendingar. Kommunane i Hardanger og
  Voss er og i dialog med helsef\u00f8retaka (Helse Bergen og Helse Fonna) for ROS-analysar
  med omsyn til akuttberedskapen gjennom ei arbeidsgruppe som skal konkludera f\u00f8r
  Hardangerbrua opnar i august 2013.\\n\\nArbeidsgruppa og forankringsseminara har
  identifisert fylgjande utviklingsbehov:\\n\\nTannhelsetenesta \u2013 aktivit\u00f8r
  p\u00e5 sjukeheimen \u2013 psykiatritenesta \u2013 legevakt/ambulanseteneste \u2013
  utbygging/meir satsing p\u00e5 heimetenester (moglegheit til \u00e5 bu heime lenger
  og utbygging av omsorgsbustader) \u2013 differensiering av tenestene i institusjon
  (\\\"fleirbrukssenger\\\"; demens,\\n\\nrehabilitering, yngre osb.)- utbygging av
  frivilligsentralen \u2013 bes\u00f8ksteneste \u2013 m\u00f8teplassar for b\u00e5de
  unge og eldre saman med fokus p\u00e5 helse, trivsel og trening - d\u00f8gnbemanna
  omsorgsbustader \u2013 aktivitetstilbod til dei som har falle ut av arbeidslivet
  \u2013 rus/psykiatri \u2013 butilbodet til psykisk utviklingshemma (ansvarsavklaringar)\\n\\n4.3  Utvikling
  av tenestene\\n\\nArbeidsgruppa og forankringsseminara har hatt eit sterkt fokus
  p\u00e5 folkehelse- og f\u00f8rebyggingsperspektiv. Ein plan for utviklinga av helse-
  og omsorgstenesta m\u00e5 ha n\u00e6r tilknyting til samfunnet rundt og n\u00e6rmilj\u00f8et
  sin innverknad p\u00e5 det samla tenestetilbodet. Helse- og omsorgstenesta i Ulvik
  skal difor leggjast til rette som ein naturleg del av heradet sin samla folkehelseprofil
  og sj\u00e5ast i samanheng med kommuneplanen sin samfunnsdel. Helse- og omsorgstenesta
  er underlagt dei same overordna m\u00e5lsetjingar og strategiar som dei andre tenesteomr\u00e5da
  i heradet og det er i seg sj\u00f8lv eit s\u00e6rskilt behov for tenesteutvikling
  som nettopp tek inn over seg dette.\\n\\nN\u00e5r det gjeld folk si helse og livskvalitet
  utgjer helse og omsorgstenesta om lag 10% her.\\n\\nDet ovannemde  \\\"tilgjenge-prinsippet\\\"
  (del 2.4) skal difor gjelda som verdi for utviklinga av helse- og omsorgstenesta  og
  leggjast til grunn for utviklingsarbeidet i planperioden. \u00c5 mobilisera kompetanse
  for samarbeid er i seg sj\u00f8lv helsefremjande.\\n\\nArbeidsgruppa og forankringsseminara
  har identifisert fylgjande utviklingsbehov: Ungdomsarbeid (m\u00f8teplassar, aktivitet,
  samarbeid med andre offentlege institusjonar o l) \u2013 sentrumsutvikling (tilgjengelegheit,
  universell utforming o l) \u2013 trafikksikringsarbeid (gang- og sykkelsti) \u2013
  frivillegheitsmobilisering og samarbeid med lag og organisasjonar (Haugesenteret,
  idrettslag/idrettshallutbygging, Hjeltnes vidareg\u00e5ande skule) \u2013 f\u00f8rebyggjande
  perspektiv p\u00e5 rus/psykiatritenesta \u2013 aktivt samarbeid med NAV (arbeidstilbod,
  rettleiing ol)\\n\\n4.4  Organisasjon og leiing\\n\\nUtvikling er alltid eit sp\u00f8rsm\u00e5l
  om leiing, og dette gjeld i h\u00f8gste grad utvikling av kommunale tenester. Det
  er ein tett og bindande samanheng mellom organisering, administrasjon og tenesteutf\u00f8ring
  i praksis. Kommunale tenester har tradisjon for endring og omstilling og det er
  eit kontinuerleg behov for endringsvilje og -evne ogs\u00e5 i helse- og omsorgstenesta
  i Ulvik. Dette betyr at det m\u00e5 setjast fokus p\u00e5 \u00e5 skapa ein s\u00e5
  god struktur som mogeleg som vert administrert etter eit planverk som er kjent for
  alle akt\u00f8rane og der den direkte tenesteut\u00f8vinga er f\u00f8rem\u00e5lstenleg  og
  ynskt av innbyggjarane i heradet.\\n\\nKompetanse i vid forstand er \u00e5 utl\u00f8ysa  \u00e5tferds-
  og handlingspotensiale  hj\u00e5 medarbeidarane. Leiarane si evne til \u00e5 mobilisera
  den kompetansen som finst i organisasjonen  er viktig for \u00e5 skapa resultat
  og kvalitet i helse- og omsorgstenesta.\\n\\nDokumentasjon og kvalitetssikring b\u00f8r
  utviklast som god styringsreiskap for effektiv ressursutnytting og styring, b\u00e5de
  n\u00e5r det gjeld \u00f8konomi og personell.\\n\\nUtarbeiding av kompetanseplan
  \u2013 rutinebeskriving/kvalitetssystem \u2013 utvikle beskriving av\\n\\nArbeidsgruppa
  og forankringsseminara har identifisert fylgjande utviklingsbehov: leiingsfunksjonane
  (avdelingsleiarane)\\n\\n5 Tiltak og strategiar\\n\\n5.1 Bygningsmessige forhold
  - investeringar, nybygg, samlokalisering\\n\\n5.1.1 Investering i bygg  - utgreiing
  som grunnlag  for avgjerd  i heradstyret\\n\\nMed utgangspunkt i framskriving av
  folketalet og behov for plassar med heild\u00f8gns bemanning i tillegg til standard
  og areal for institusjon, omsorgsbustader  og legekontor, skal det utgreiast eit
  grunnlag for avgjerd i heradstyret.\\n\\nUtgreiinga m\u00e5 innehalda:\\n\\n- Tilstandsrapport
  over dei aktuelle bygningane til helse og omsorgsf\u00f8rem\u00e5l. Utgreiinga skal
  visa \u00e5rlege driftskostnader (FDV-kostnader) og  kostnad per kvm for full renovering/ombygging
  og tilpassing til standard i 2013.\\n- Utgreiing av investeringskostnad ved \u00e5
  byggja nytt samlokalisert  helse- og omsorgssenter i Ulvik. Det skal leggjast vekt
  p\u00e5 sambruk og god utnytting av areal.\\n- Husbanken sin rettleiar for tilskot
  til investeringar til sjukeheimsplassar og omsorgsbustader skal liggja til grunn
  for utarbeiding av dei ulike alternativa\\n- Utgreiinga skal vurdera konsekvensane
  for heradet sin \u00f8konomi og tenestekapasitet i tidsrommet 2013- 2040.\\n- Utgreiinga
  skal ta omsyn til den totale utviklinga i heradet, b\u00e5de n\u00e5r det gjeld
  \u00f8konomisk berekraft i heradet og utviklinga av helse- og omsorgstenesta i Ulvik
  og i Hardangerregionen.\\n\\nUtgreiinga skal dr\u00f8fta helse og omsorg si rolle
  og funksjon som ein utviklande og spanande arbeidsplass, som trekkjer til seg  kompetanse
  og arbeidskraft, b\u00e5de til Ulvik og til Hardangerregionen.\\n\\n5.1.2 Institusjonskj\u00f8kkenet
  ved sjukeheimen\\n\\nInstitusjonskj\u00f8kkenet yter i dag service til sjukeheimen
  og matombringinga med ern\u00e6ringsrik  mat. Kunnskap om ern\u00e6ring og maten
  sin plass i helse- og omsorgstenesta er viktig kompetanse i tenesta og utviklinga
  av tenestene.\\n\\nI Ulvik er det fleire kj\u00f8kken med profesjonelle som lagar
  mat. Det b\u00f8r vurderast om eit samarbeid kan gi n\u00e6ringsutvikling i heradet
  og/eller Hardangerregionen.\\n\\n5.2 Samhandlingsreforma, kompetanseutvikling og
  samhandling\\n\\nKompetanseomgrepet har i seg to perspektiv; som formell og fagspesifikk
  (f eks sjukepleiar, ergoterapeut o l) og som eit tankesett for handlingar (f eks
  evne til samarbeid, tilgjenge, o l). Utvikling av kompetanse vil alltid handla om
  \u00e5 kombinera perspektiva  og den viktigaste kompetansen ein liten kommune har,
  er evna til \u00e5 s\u00f8kja samarbeid (og vera tilgjengeleg for samarbeid) om
  utfordringar som ikkje kan l\u00f8ysast p\u00e5 kommunalt niv\u00e5. I Ulvik er
  det sentralt at alle tilsette handlar etter denne grunnleggjande haldninga. Utvikling
  av kompetanse handlar difor meir om \u00e5 mobilisera samhandling og samarbeid enn
  om \u00e5 kompensera akutte problemstillingar med vidareutdanning og kursing. Kompetanseutvikling
  i Ulvik handlar om utvikling av det \u00e5 vera tilgjengeleg, fleksibilitet, samarbeidsevne
  \u2013 og vera medviten  om status i heile helse- og omsorgstenesta for \u00e5 skapa
  l\u00f8ysingsorienterte endringar og tilpassingar.\\n\\n5.2.1 Medarbeidarskap og
  kompetanseutvikling\\n\\nLeiinga i helse- og omsorgstenesta skal syta for eit utviklande
  medarbeidarskap og at haldninga til kompetanseutvikling fokuserer p\u00e5 samarbeid
  og samhandling som grunnleggjande tankesett og  som kan konkretiserast i praktisk
  handling.\\n\\n5.2.2 Nettverk og dialog\\n\\nDet er ei leiaroppg\u00e5ve \u00e5
  oppretthalda og utvikla nettverk og utviklande dialog med samarbeidspartane i Hardangerregionen,
  b\u00e5de med andre herad og spesialisthelsetenesta, for \u00e5 leggja til rette
  for at Ulvik har tilgang til n\u00f8dvendig  fagkompetanse.\\n\\n5.2.3 Ny kompetanse
  og mobilisering av taus kompetanse\\n\\nLeiinga skal arbeida med \u00e5 skaffa Ulvik
  den kompetansen som er n\u00f8dvendig  og som finst i nettverket av tilgjengelege
  samarbeidsinstansar; i andre herad i Hardangerregionen eller i spesialisthelsetenesta.
  For strategisk kompetansestyring skal det utarbeidast ein strategisk kompetanseplan
  for Ulvik, kanskje i samarbeid med dei andre herada i Hardangerregionen.\\n\\n5.3
  Utvikling av tenestene\\n\\nDet generelle m\u00e5let for alt arbeid i helse- og
  omsorgssektoren er at det skal verka helsefremjande for alle innbyggjarane i Ulvik.
  Dette krev god oversikt over behov for tenester for \u00e5 kunne verka konkret f\u00f8rebyggjande
  i arbeidet. Kravet er at personar med sjukdom eller funksjonsnedsetjing, skal f\u00e5
  tenester av god fagleg kvalitet. I dette ligg at Ulvik skal kunne tilby heilskaplege
  helse- og omsorgstenester (legeteneste, institusjonsplassar, tilpassa butilbod og
  meiningsfulle aktivitetar) til dei innbyggjarane som har eit rettskrav p\u00e5 tenester.\\n\\n5.3.1
  Samarbeid med frivillige og andre tenester \u2013 helsefremjande samarbeid\\n\\nFrivilligsentralen
  i Ulvik skal utviklast, b\u00e5de n\u00e5r det gjeld kapasitet og det \u00e5 vera
  tilgjengeleg.\\n\\nHelse- og omsorgstenesta skal ta initiativ til eit utvida samarbeid
  med skule og barnehage for \u00e5 utvikla eksisterande eller utvikla nye arenaer
  der fleire generasjonar kan m\u00f8tast. Tiltaka for dette m\u00e5let kan vera informasjonsarbeid
  og konkrete, praktiske handlingar for at samhandling/samv\u00e6r p\u00e5 tvers av
  generasjonane  finn stad.\\n\\nUlvik er open for \u00e5 samarbeida med NAV. NAV
  er ein sentral instans i alt f\u00f8rebyggjande  og helsefremjande arbeid. Spesielt
  gjeld dette utvikling av arbeids- og aktivitetstilbod til utsette grupper.\\n\\nUniversell
  utforming skal sikra at bygningar og m\u00f8teplassar er tilgjengelege for personar
  med nedsett funksjonsevne. Dette gjeld i planlegging og praktisk utforming av bygg
  og m\u00f8teplassar, samt utvikling av l\u00e5gterskeltilbod  i tenesta. Alle tenester
  og offentlege utbetringar/tilvekst skal ha universell utforming og gjerast tilgjengelege
  for alle innbyggjarane uavhengig av sjukdom eller funksjonsvanskar.\\n\\n5.3.2.
  Brukarmedverknad og organisering av tenestetilbod\\n\\nOrganisering av tildelte
  tenester som brukarstyrt personleg assistanse (BPA) der tenestemottakaren er arbeidsleiar
  og kvalitetssikrar for sin eigen assistanse, har gitt tenestetottakarar innhald
  og styring i eigen kvardag med auka livskvalitet som resultat. Helsedirektoratet
  utlyser ressursar til oppl\u00e6ring av arbeidsleiarar og assistentar i ei BPA-ordning.\\n\\nDet
  skal utgreiast om nye omsorgstiltak etter modell av Gr\u00f8n omsorg (Inn p\u00e5
  tunet) er aktuelle for Ulvik herad. Dette kan vera gjennom kontakt med aktuelle  gardsbruk
  eller andre friluftsarenaer for \u00e5 leggja  til rette for utviklande og/eller
  opplevingsbaserte aktivitetar for ulike brukargrupper, t d samv\u00e6r med dyr for
  menneske med demens eller andre funksjonsvanskar.\\n\\n5.4 Organisasjon og leiing\\n\\nOrganisasjonsutvikling
  og leiing heng n\u00f8ye saman. Strukturering, administrering og leiing av helse-
  og omsorgstenesta skal utviklast og st\u00f8tta opp om dei endringar og evt omstillingar
  som m\u00e5 gjennomf\u00f8rast i tr\u00e5d med endringar i behovet for tenester.
  Det ligg i den grunnleggjande \\\"tilgjengeverdien\\\" i helse- og omsorgstenesta
  at leiar driv n\u00e6rt medarbeidarskap og har oversikt over behov og ynskje, b\u00e5de
  hj\u00e5  tilsette og i befolkninga  generelt. Det er sentralt at struktur og system
  underst\u00f8ttar denne verdien og at leiarane f\u00e5r h\u00f8ve   til aktivt \u00e5
  vidareutvikla tenesta gjennom praktisk handling i samarbeid med tilsette.\\n\\nN\u00e5r
  det gjeld \u00f8konomistyring, er det s\u00e6rleg to faktorar som er viktig i tenesta.
  Den eine faktoren er terskelen for tildeling av tenester og den andre er organisering
  av arbeidstid (turnus).\\n\\n5.4.1 Tildeling av tenester - sakshandsaming\\n\\nTerskel
  for tildeling av tenester er viktig for \u00f8konomistyringa. Kvaliteten p\u00e5
  tildeling av helse- og omsorgstenester skal kontinuerleg utviklast. Dette inneber
  at terskelen for tildeling av tenester skal definerast, og at b\u00e5de dei faglege
  og dei \u00f8konomiske kriteria vert gjennomg\u00e5tt og gjort gjeldande.\\n\\nFor
  god \u00f8konomistyring trengst det tenlege styringsdata. IPLOS- og KOSTRA-registrering
  skal utviklast og kvalitetssikrast gjennom rutinar for b\u00e5de tildelingspraksis,
  tenesteyting og avviksrapportering. Dette skal samla sett syta for betre samanheng
  mellom \u00f8konomiske og faglege variablar.\\n\\nOrganisering av arbeidstida m\u00e5
  vurderast av omsyn til flest mogelege  heile stillingar  og arbeidstid tilpassa
  brukarbehov og tilsette sitt ansvar p\u00e5 andre arenaer. Tenestene treng tilsette
  som meistrar b\u00e5de jobb og privatliv.\\n\\n5.4.2 Leiarutvikling\\n\\nDet vert
  stilt store krav til leiarane i helse- og omsorgstenesta for \u00e5 m\u00f8ta utfordringane
  i framtida, som tverrfagleg kompetanseheving, kommunal planleggjing og utvikling
  av kvalitativt gode tenester og rett ressursutnytting i verksemda. Leiarane  treng  kompetanse
  for \u00e5 leia komplekse organisasjonar med krav til tverrfagleg samarbeid, medarbeidarskap
  og samspel mellom herad og spesialisthelsetenesta. Leiarar b\u00f8r f\u00e5 tilbod
  om leiarutviklingsprogram/-kurs.\\n\\n6 Underordna planar og implementering\\n\\nDet  generelle
  strategiske grunnlaget for implementering  av planen skal vera mobilisering av kompetanse,
  og det skal leggjast vekt p\u00e5 involvering av og deltaking fr\u00e5 alle tilsette.
  Helse- og omsorgsplanen er bygd opp gjennom ei delt forst\u00e5ing av status og
  dei m\u00e5lomr\u00e5da og strategiane som kom fram under arbeidet i arbeidsgruppa
  og forankringsseminara. Dette samarbeidet skal dyrkast vidare i arbeidet med \u00e5
  implementera og konkretisera tiltak i verksemdsplanar i framtida. M\u00e5lomr\u00e5da
  og strategiane i helse og omsorgsplanen skal vere grunnlaget for leiing, tenesteyting
  og resultat av tenesteyting. Strategiane som er nedfelt i helse- og omsorgsplanen,
  er i fleire samanhengar langsiktige med eit tidperspektiv fram mot 2040.\\n\\nReferanseliste\\n\\n-
  LOV-2011-06-24-29 Folkehelseloven. Folkehelsearbeid (folkehelseloven) Lov om folkehelsearbeid
  (folkehelseloven)\\n- LOV-2011-06-24-30 Helse- og omsorgstjenesteloven. Kommunale
  helse- og omsorgstjenester m.m. (helse- og omsorgstjenesteloven)\\n- LOV-2006-06-16-20
  Lov om arbeids- og velferdsforvaltningen (arbeids- og velferdsforvaltningsloven)
  [NAV-loven]\\n- LOV-1999-07-02-63 Pasient- og brukerrettighetsloven \u2013 pasrl.
  Pasient- og brukerrettighetsloven\\n- LOV-2013-06-07-29 Endringslov til pasient-
  og brukerrettighetsloven mv. Pasient- og brukerrettighetsloven mv. (styrking av
  pasienters, brukeres og p\u00e5r\u00f8rendes stilling m.m.) (endringslov)\\n- LOV-1999-02-07-64
  Helsepersonelloven\\n- St.meld. nr 47 (2008-2009) Samhandlingsreformen\\n- Meld.St.30
  (2011-2012) Se meg! En helhetlig rusmiddelpolitikk\\n- Meld.St. 29 (2012-2013) Morgendagens
  omsorg\\n- Meld.St.16 (2011-2015) Nasjonal helse- og omsorgsplan med Demensplan
  2015 og Nevroplan 2015\\n- St.meld. nr 25 (2005-2006) Mestring, muligheter og mening\\n-
  Helsedirektoratet: Nasjonale m\u00e5l og prioriterte omr\u00e5der for 2013 (Rundskriv
  til kommunene, fylkeskommunene,de regionale helseforetak og fylkesmennene fr\u00e5
  Helsedirektoratet)\\n- Statistisk sentralbyr\u00e5: Befolkningsstatestikk  og KOSTRA-statistikk\\n-
  Folkehelseinstituttet: Folkehelseprofiler for kommunene\\n- Husbanken: Veileder
  for utforming av omsorgsboliger og sykehjem\"", "\"\u00abMottakernavn\u00bb\\n\\n\u00abAdresse\u00bb\\n\\n\u00abPostnr\u00bb
  \u00abPoststed\u00bb\\n\\n\u00abKontakt\u00bb\\n\\nLandbruksoppg\u00e5ver i kommunane
  2023 . forventningar, fullmakter og tiltaksmidlar\\n\\nStatsforvaltaren vil med
  dette orientere kommunen om:\\n\\n* Kommunen si rolle som landbruksstyresmakt\\n*
  Statsforvaltaren som kompetansesenter p\u00e5 landbruksomr\u00e5det\\n* Delegert
  statleg mynde p\u00e5 landbruksomr\u00e5det\\n* Forvaltning av tilskotsordningar
  med kommunal ramme\\n* \u00d8konomisk ramme 2023 for tilskot som kommunen forvaltar\\n*
  Oppf\u00f8lging og kontroll for \u00e5 sikre rett tilskotforvaltning\\n* Rapportering\\n\\nKommunen
  sine oppg\u00e5ver p\u00e5 landbruksomr\u00e5det er b\u00e5de omfattande og viktige.
  Difor er ogs\u00e5 dette brevet tilsvarande langt. Vi gir her ei mest mogleg samla
  oversikt med tilvising til kvar ein finn regelverk og trur dette ogs\u00e5 vert
  til hjelp i den kommunale forvaltninga.\\n\\n1. Kommunen som landbruksstyresmakt\\n\\nKommunane
  er landbruksstyresmakt p\u00e5 ei rekke oppg\u00e5ver innan jordbruk, skogbruk og
  hagebruk med tilh\u00f8yrande n\u00e6ringar, samla kalla landbruk. Dette omfattar
  forvaltningsoppg\u00e5ver der kommunane med heimel i lov og forskrift er f\u00f8rsteinstans
  for vedtak og f\u00f8rebuing av saker som skal avgjerast av andre organ p\u00e5
  h\u00f8gare niv\u00e5. Dette er ogs\u00e5 oppg\u00e5ver som kommunen har som planstyresmakt,
  og utviklings- oppg\u00e5ver som delvis er lovheimla og delvis ligg til den generelle
  utviklingsrolla som kommunen har.\\n\\nUtviklingsrolla er i liten grad p\u00e5lagd
  gjennom lover og regelverk, men er desto viktigare for \u00e5 bidra til ei positiv
  utvikling i landbruket og for bygdene. Vi har erfaring med at kommunar som arbeider
  aktivt med utvikling f\u00e5r ein st\u00f8rre del av ulike utviklingsmidlar for
  landbruket, til d\u00f8mes gjennom god informasjon, offensivt motivasjonsarbeid
  og rettleiing.\\n\\nOrg.nr. 974 760 665\\n\\nV\u00e5r dato:\\n\\nV\u00e5r ref:\\n\\n02.02.2023\\n\\n2023/1904\\n\\nDykkar
  dato:\\n\\nDykkar ref:\\n\\n\u00abRefDato\u00bb\\n\\n\u00abRef\u00bb\\n\\nSaksbehandlar,
  innvalstelefon\\n\\nBj\u00f8rn Harald Haugsv\u00e6r, 5764 3071\\n\\n2. Statsforvaltaren
  som kompetansesenter p\u00e5 forvaltning og n\u00e6ringsutvikling\\n\\nLandbruksavdelinga
  hos Statsforvaltaren skal vere eit kompetansesenter innan landbruksforvaltning og
  landbruksrelatert mobilisering og n\u00e6ringsutvikling . Vi oppmodar kommunane
  om \u00e5 ta kontakt og bruke v\u00e5r kompetanse til beste for heile Vestland.
  Vi kan til d\u00f8mes bidra med r\u00e5d og rettleiing, deltaking og organisering
  av m\u00f8te og deltaking i utviklingsprosessar. Oversikten over tilsette og fagomr\u00e5de
  er lagt ut p\u00e5 nettsida v\u00e5r.\\n\\nVestland fylkeskommune tok fr\u00e5 2020
  over ansvaret for utviklingsmidlar til utgreiing og tilrettelegging. Dette vert
  no forvalta gjennom www.regionalforvaltning.no. Samstundes er Statsforvaltaren si
  rolle som kompetansesenter for landbruksforvaltning og utvikling styrka. Med bakgrunn
  i Vestland fylke sin nye Temaplan for landbruk vil vi medverke til n\u00e6ringsutvikling
  i samarbeid med fylkeskommunen og Innovasjon Noreg. Rolla som forvaltnings- og kontrollorgan
  gir oss god innsikt og kontakt med landbruksn\u00e6ringa b\u00e5de regionalt og
  nasjonalt. Dette er ein viktig kunnskapsbase for n\u00e6ringsutvikling.\\n\\n3.
  Delegert statleg mynde p\u00e5 landbruksomr\u00e5det\\n\\nKommunen forvaltar \u00f8konomiske
  verkemiddel p\u00e5 vegner av staten p\u00e5 landbruksomr\u00e5det. Forvaltninga
  av desse midlane er difor underlagt reglar for statlege midlar. Statleg tilskotsforvaltning
  er regulert gjennom \u00d8konomireglementet for staten (\u00a7 2 b og c) og underlagt
  statleg styringsrett. Difor har ikkje kommunen det same sj\u00f8lvstendige mynde
  eller lokalpolitisk skj\u00f8nn som det kommunen elles har. Kommunen m\u00e5 forvalte
  tilskotsordningane i samsvar med krava i regelverket for kvar enkelt ordning slik
  det kjem fram i forskrift, rundskriv og rettleiarar fr\u00e5 landbruksstyresmaktene.\\n\\nLandbruks-
  og matdepartementet har instruksjonsmynde for korleis dei statlege midlane skal
  forvaltast. I dette ligg ogs\u00e5 ein rett til \u00e5 kontrollere at oppg\u00e5vene
  og mynde er utf\u00f8rt slik det er f\u00f8resett. For mange av forvaltningsoppg\u00e5vene
  p\u00e5 landbruksomr\u00e5det er mynde delt mellom Landbruksdirektoratet, statsforvaltar
  og kommune. Statsforvaltaren i Vestland har eit s\u00e6rleg ansvar for \u00e5 rettleie
  og f\u00f8re kontroll med forvaltninga som er delegert til kommunane i v\u00e5rt
  fylke.\\n\\n4. Forvalting av tilskotsordningar med kommunal ramme\\n\\nKommunen
  forvaltar desse statlege ordningane med tildeling av eigne midlar:\\n\\n- Tilskot
  til skogsvegar\\n- Tilskot til skogsdrift i vanskeleg terreng\\n- Tilskot til skogkultur
  m.m. (NMSK)\\n- Tilskot til tiltak i utvalde kulturlandskap i jordbruket (UKL) og
  verdsarvomr\u00e5da\\n- Tilskot til tiltak i beiteomr\u00e5de\\n- Tilskot til spesielle
  milj\u00f8tiltak i landbruket (SMIL)\\n- Tilskot til drenering av jordbruksjord\\n\\nFelles
  for desse ordningane er at kommunen f\u00e5r tildelt ei tilskotsramme ut fr\u00e5
  innmeldt behov, objektive grunnlag og p\u00e5rekneleg aktivitet. Tilskotsrammene
  kjem fram av eige vedlegg til dette brevet.\\n\\nOrdningane vert forvalta gjennom
  fagsystema Agros og \u00d8KS. Dersom det er endringar i kven som skal ha tilgang
  i fagsystema m\u00e5 de gje melding om dette p\u00e5 e-post til email@example.com
  . Dette gjeld ogs\u00e5 n\u00e5r personar ikkje lenger skal ha tilgang.\\n\\nGjennom
  fagsystemet Agros har kommunen b\u00e5de rolle som sakshandsamar og rolla for godkjenning
  av utbetaling. For ordningane i \u00d8KS legg kommunen inn l\u00f8yvingane, men
  det er Statsforvaltaren som godkjenner for utbetaling.\\n\\n5. Lokalt handlingsrom
  gjennom kommunale retningslinjer\\n\\nKommunen har eit stort lokalt handlingsrom
  i forvaltning av SMIL-midlar, Tilskot til tiltak i beiteomr\u00e5de og NMSK. Dette
  krev at kommunen har eigne retningslinjer eller strategidokument. Vi forventar at
  alle kommunane no har f\u00e5tt p\u00e5 plass eigne retningslinjer, og at dei vert
  revidert med jamne mellomrom.\\n\\nDei kommunale retningslinjene skal ta omsyn til
  lokale forhold, og ved utarbeidinga b\u00f8r det vere ein god prosess med innspel
  fr\u00e5 n\u00e6ringa og Statsforvaltaren. Dette kan med fordel vere ein felles
  prosess med felles retningslinjer for alle tre ordningane. Retningslinjene b\u00f8r
  utformast slik at kommunen kan nytte dei som grunnlag for sine prioriteringar i
  sakshandsaminga, og slik at tildelingane kan kontrollerast. Vi viser ogs\u00e5 til
  v\u00e5r rettleiing til kommunane for utarbeiding av overordna retningslinjer.  Vi
  vil be om \u00e5 f\u00e5 tilsendt retningslinjer for desse tre ordningane fr\u00e5
  alle kommunane i 2023.\\n\\n6. Rettleiande satsar for eigeninnsats\\n\\nVi har samr\u00e5dd
  oss med Innovasjon Norge og r\u00e5r til at kommunen nyttar desse satsane n\u00e5r
  de godkjenner kostnadsoverslag for eige arbeid som grunnlag for tilskot i ulike
  ordningar:\\n\\n* Manuelt utf\u00f8rt eige arbeid (inkl. motorsag o.l.): 350 kr/time\\n*
  Bruk av eigen traktor/gravemaskin: 800 kr/time\\n\\n7. Oppg\u00e5ver i kommunen
  \u2013 forvalting av statlege tilskot i jordbruket\\n\\nHer er ei opplisting av
  kommunale landbruksoppg\u00e5ver. Lista er ikkje fullstendig d\u00e5 det er ein
  del mindre oppg\u00e5ver som kan kome i tillegg. Det er dessutan opp til kommunen
  kor mykje ein vil gjere utover desse minimumsforventningane.\\n\\n7.1 Forvaltning
  av produksjonstilskot i jordbruket\\n\\nKommunen har ansvar som f\u00f8rsteinstans
  for produksjonstilskot og avl\u00f8ysartilskot til jordbruksf\u00f8retak. Dette
  er ei omfattande oppg\u00e5ve med store utbetalingar og eit detaljert nasjonalt
  regelverk. Kommunen handsamar s\u00f8knadene gjennom det elektroniske fagsystemet
  eStil PT. Som ein del av dette arbeidet skal kommunen ogs\u00e5 f\u00f8re kontroll
  med at s\u00f8knadene er korrekte og at s\u00f8kjarane oppfyller vilk\u00e5ra for
  tilskot. Nasjonalt vert dette f\u00f8lgd opp av Landbruksdirektoratet.\\n\\n7.2
  Forvaltning av regionale milj\u00f8tilskot i jordbruket (RMP)\\n\\nKommunen er f\u00f8rsteinstans
  i forvaltning av Regionale milj\u00f8tilskot (RMP) der dei regionale milj\u00f8tilskota
  er hovudverkemiddelet. Programmet for Vestland skal stimulere til \u00e5 oppretthalde
  og utvikle eit ope og variert kulturlandskap. S\u00e6rskilde verdiar i kulturlandskapet
  skal takast vare p\u00e5 og\\n\\nskj\u00f8ttast, god agronomi skal fremjast, og
  ureining og tap av n\u00e6ringsstoff fr\u00e5 jordbruket skal bli redusert. Dei
  regionale milj\u00f8tilskota vert forvalta gjennom fagsystemet eStil.\\n\\n7.3 Avl\u00f8ysing
  ved sjukdom\\n\\nKommunen er f\u00f8rsteinstans i handsaming av Tilskot til avl\u00f8ysing
  under sjukdom og f\u00f8dsel m.v. Ordninga skal bidra til \u00e5 dekke utgifter
  til avl\u00f8ysing n\u00e5r bonden ikkje kan delta i gardsdrifta p\u00e5 grunn av
  sjukdom, graviditet, f\u00f8dselspermisjon eller sjukt barn. Kommunen fattar vedtak
  og betalar ut via fagsystemet Agros. Vi gjev med dette kommune fullmakt til \u00e5
  betale ut tilskot gjennom fagsystemet Agros.\\n\\n7.4 Tidlegpensjon for jordbrukarar\\n\\nOrdning
  med tidlegpensjon for jordbrukarar gjeld for jordbrukarar som har fylt 62 \u00e5r.
  S\u00f8knaden skal sendast direkte til Statsforvaltaren som fattar avgjerd. Kommunen
  b\u00f8r ha kunnskap om ordninga slik at de kan gje informasjon til aktuelle s\u00f8kjarar.\\n\\n7.5
  Tilskot ved produksjonssvikt - klimabetinga skader p\u00e5 avlingar\\n\\nKommunen
  mottek s\u00f8knadene om Tilskot ved produksjonssvikt p\u00e5 grunn av klimatiske
  \u00e5rsaker, kontrollerer opplysningane og sender sakene vidare til Statsforvaltaren
  for avgjerd. Dette er ei oppg\u00e5ve som varierer mykje fr\u00e5 \u00e5r til \u00e5r,
  men det er viktig at kommunen har nok kapasitet til \u00e5 handsame denne ordninga
  n\u00e5r det oppst\u00e5r klimabetinga skade.\\n\\n7.6 Spesielle milj\u00f8tiltak
  i jordbruket (SMIL)\\n\\nKommunen forvaltar SMIL-ordninga etter forskrift om spesielle
  milj\u00f8tiltak i jordbruket, nasjonale f\u00f8ringar og kommunale retningslinjer.
  Form\u00e5let med ordninga er \u00e5 fremje natur- og kulturminneverdiane i kulturlandskapet
  og redusere forureining fr\u00e5 jordbruket ut over det som er venta av vanleg jordbruksdrift.
  Ordninga blir forvalta gjennom fagsystemet Agros.\\n\\nForskrifta \u00a7 8, seier
  at kommunen skal fastsetje overordna retningslinjer for prioritering av s\u00f8knadar.
  Sj\u00e5 meir om dette i punkt 5.\\n\\nPrioriteringar for 2023\\n\\nMilj\u00f8-
  og klimasatsinga over jordbruksavtalen skal medverke til \u00e5 ivareta kulturlandskapet
  og redusere milj\u00f8belastninga fr\u00e5 landbruket. I fleire vassf\u00f8rekomstar
  er det behov for tiltak for \u00e5 redusere avrenning og risiko for avrenning fr\u00e5
  jordbruksdrifta. Det er viktig at kommunen tek tak i desse utfordringane av omsyn
  til vasskvalitet, klimatilpassing og ressursbevaring. Der behova er store b\u00f8r
  kommunane prioritere klimatilpassing, herunder hydrotekniske tiltak.\\n\\nVi minner
  om at tilskot til tak over eksisterande gj\u00f8dsellager er gode milj\u00f8tiltak
  som medverkar til redusert ammoniakkutslepp til luft. Som tilleggseffekt vil slike
  tiltak auke lagerkapasiteten slik at husdyrgj\u00f8dsla kan bli spreidd til rett
  tid i vekstsesongen, og medverke til redusert fare for avrenning til vatn.\\n\\nI
  neste revisjon av dei kommunale overordna retningslinjene vil vi oppmode kommunar
  som ikkje allereie har gjort dette om \u00e5 ta inn desse tiltaksgruppene som prioriterte
  tiltak. Vi \u00f8nskjer \u00f2g at kommunane gjer s\u00f8kjarane s\u00e6rskilt merksame
  p\u00e5 at dei kan s\u00f8kje om tilskot til slike tiltak. Vi minner samstundes
  om v\u00e5r nettsak p\u00e5 dette temaet.\\n\\nVi ber \u00f2g kommunane om \u00e5
  vektlegge tiltak for ville pollinerande insekt og truga natur.\\n\\n\u00d8konomisk
  ramme\\n\\nKommunen f\u00e5r tildelt ei \u00f8konomisk ramme fr\u00e5 Statsforvaltaren
  til lokal forvaltning (sj\u00e5 tabell). Vestland har ei ramme p\u00e5 til saman
  15 mill. kronar til SMIL i 2023. Med unntak av ein mindre pott til s\u00e6rskilte
  saker og klager har vi fordelt heile denne ramma til kommunane.\\n\\nRamma til kvar
  kommune er rekna ut med utgangspunkt i dekar jordbruksareal i drift, tal s\u00f8kjarar
  p\u00e5 produksjonstilskot og milj\u00f8verdiar i kommunane. Rammene er i tillegg
  justert i tr\u00e5d med innmeldte behov, tidlegare \u00e5rs forbruk og prioriteringar
  i lokale retningslinjer.\\n\\nMidlar som kommunen dreg inn i l\u00f8pet av \u00e5ret
  vert lagt til kommunen si ramme slik at kommunen kan disponere dei p\u00e5 nytt
  fram til fagsystemet Agros stenger i midten av desember. Ved \u00e5rsskiftet vil
  ubrukte midlar hos kommunane bli trekt tilbake til Statsforvaltaren si ramme.\\n\\nVi
  vil gjennomf\u00f8re ei omfordeling av midlar mellom kommunar mot slutten av \u00e5ret
  dersom vi ser at midlane ikkje vert brukte i enkelte kommunar, medan andre har for
  lite midlar til \u00e5 dekke gode s\u00f8knader. Omfordelinga vil finne stad i dialog
  med dei aktuelle kommunane og etter rapportering for ordninga 1. november.\\n\\nDe
  finn meir om SMIL-ordninga hos Landbruksdirektoratet. Frist for rapportering er
  1. november. Sj\u00e5 punkt 16.\\n\\n7.7 Tilskot til drenering av jordbruksjord\\n\\nKommunen
  forvaltar ordninga ut fr\u00e5 forskrift om tilskudd til drenering av jordbruksjord
  og tilh\u00f8yrande kommentarar til forskrifta. Form\u00e5let med ordninga er \u00e5
  auke kvaliteten p\u00e5 tidlegare gr\u00f8fta jordbruksjord med potensiale for auka
  jordbruksproduksjon, redusert fare for erosjon og redusert overflateavrenning av
  n\u00e6ringsstoff til vassdrag. Ordninga blir forvalta gjennom fagsystemet Agros.\\n\\nVestland
  har ei ramme p\u00e5 6,9 mill. kroner i 2023. Ramma til kvar kommune er rekna ut
  med utgangspunkt i innmeldte behov og jordbruksareal i drift med vekt p\u00e5 korn,
  potet og gr\u00f8nsaksareal. Statsforvaltaren har helde att noko av ramma til s\u00e6rskilde
  saker og til fortl\u00f8pande tildeling til kommunar som melder inn behov p\u00e5
  e-post firstname.lastname@example.org. Det skal vere l\u00e5g terskel for \u00e5
  melde inn auka behov grunna konkrete s\u00f8knader. Kommunane kan s\u00e5leis rekne
  med \u00e5 f\u00e5 fortl\u00f8pande ekstra ramme i samsvar med behovet.\\n\\nMidlar
  som kommunen dreg inn i l\u00f8pet av \u00e5ret vert lagt til kommunen si ramme
  slik at kommunen kan disponere dei p\u00e5 nytt fram til s\u00f8knadssystemet Agros
  stenger i midten av desember. Ved \u00e5rsskiftet vil ubrukte midlar hos kommunane
  bli trekt tilbake til Statsforvaltaren si ramme. Mot slutten av \u00e5ret vil vi
  ogs\u00e5 i dreneringsordninga be om rapportar fr\u00e5 kommunane og gjere ei omfordeling
  av midlar mellom kommunar ved behov.\\n\\nDe finn meir informasjon om tilskot til
  drenering hos Landbruksdirektoratet. Frist for rapportering er 1. november. Sj\u00e5
  punkt 16.\\n\\n7.8 Tilskot til tiltak i beiteomr\u00e5de\\n\\nDenne ordninga vart
  overf\u00f8rt til kommunane i 2020. Form\u00e5let med ordninga er \u00e5 legget
  til rette for best mogleg utnytting av beite i utmark, redusere tap av dyr p\u00e5
  utmarksbeite og fremme fellestiltak i beiteomr\u00e5da. Ordninga skal bidra til
  god beitebruk gjennom infrastrukturtiltak i utmark. Kommunen har ansvar for \u00e5
  kunngjere tilskotsordninga, fastsetje s\u00f8knadsfrist, handsame s\u00f8knader
  og betale ut tilskot gjennom fagsystemet Agros.\\n\\nDet er fleire tilskotsordningar
  som skal fremme beiting og bruk av utmarka: st\u00f8tte per beitedyr gjennom produksjonstilskot,
  driftstilskot til beitelaga gjennom organisert beitebruk (RMP) og investeringsst\u00f8tte
  til tiltak i beiteomr\u00e5de. I tillegg har Statsforvaltaren midlar for tiltak
  i beiteomr\u00e5de som har konflikt med freda rovvilt (FKT-midlar). Det er viktig
  at kommunen bidreg aktiv med kunnskap i omr\u00e5de med freda rovvilt og at kommunen
  ogs\u00e5 vurderer bruk av interkommunale jaktlag som etter l\u00f8yve kan ta p\u00e5
  seg felling.\\n\\nFor dei beitelaga som beiter i CWD-omr\u00e5det er det ei eiga
  ordning med midlar for ekstraordin\u00e6re tiltak knytt til soneforskrifta. Denne
  gjeld for Nordfjella og Hardangervidda, og midlane vert forvalta av Statsforvaltaren
  i Oslo og Viken i samarbeid med oss.\\n\\nFor beitelag som har tap til freda rovvilt
  kan det vere aktuelt \u00e5 s\u00f8ke om FKT-midlar, til d\u00f8mes til elektroniske
  bj\u00f8ller. S\u00f8knadsfristen er 15. februar.\\n\\nLokal retningslinjer for
  tilskot til tiltak i beiteomr\u00e5de\\n\\nI rundskrivet fr\u00e5 Landbruksdirektoratet
  st\u00e5r det at kommunane skal fastsetje lokale retningslinjer, og at ein gjerne
  kan sj\u00e5 desse i samanheng med retningslinjene for SMIL.\\n\\nDet er viktig
  \u00e5 f\u00e5 lyst ut midlane i god tid f\u00f8r beitesesongen, og vi r\u00e5r
  til \u00e5 bruke s\u00f8knadsfrist 1. mars. Beitelaga b\u00f8r f\u00e5r svar p\u00e5
  s\u00f8knaden f\u00f8r 1. juni slik at tiltaka kjem til nytte i \u00e5rets beitesesong.
  Fr\u00e5 2020 har driftstilskotet gjennom RMP til beitelaga auka, og beitelaga kan
  difor sj\u00f8lv ta ansvar for mindre tiltak. Vi r\u00e5r til at de prioriterer
  investeringar i faste installasjonar, teknologi knytt til beitebruk og beitebruksplan.
  Mindre tiltak og lett omsettelege varer b\u00f8r ikkje st\u00f8ttast.\\n\\nD\u00f8me
  p\u00e5 aktuelle tiltak er:\\n\\n* Sanke- og skiljeanlegg\\n* Bruer dimensjonert
  for dyr og folk\\n* Sperregjerde for \u00e5 sikre at dyr ikkje kjem inn i farleg
  omr\u00e5de\\n* Gjetarhytter/sankehytter\\n* Elektronisk overvakingsutstyr\\n* Beitebruksplan\\n\\nHugs
  \u00e5 be om naudsynte vedlegg til s\u00f8knaden slik som kart og aktuelle avtalar.\\n\\nBeitebruksplanar\\n\\nSlike
  planar er eit godt verkt\u00f8y for \u00e5 dokumentere verdien av utmarksbeite og
  styrke beiten\u00e6ringa sine interesser i den langsiktige planlegginga i kommunen.
  Vi ynskjer at kommunen lagar beitebruksplanar for omr\u00e5de som de ser p\u00e5
  som spesielt viktige for beitebruken. Dette kan med fordel gjerast i samarbeid mellom
  kommunen, beitelaga og Nibio. I Vestland har Nibio utf\u00f8rt vegetasjonskartlegging
  i nokre referanseomr\u00e5de, og det kan kartleggast nye omr\u00e5de som grunnlag
  for ein beitebruksplan.\\n\\n\u00d8konomisk ramme\\n\\n\u00c5rets ramme per kommune
  er rekna ut fr\u00e5 tal dyr p\u00e5 utmarksbeite i 2022 (OBB), \u00e5rsrapportar
  fr\u00e5 kommunane med innmeldte behov, f\u00f8ringar fr\u00e5 Landbruksdirektoratet
  og kommunar med god gjennomf\u00f8ringsevne. Vestland har ei totalramme p\u00e5
  3,44 mill. kroner i 2023, og heile ramma er no fordelt. I l\u00f8pet av \u00e5ret
  kan Statsforvaltaren omfordele midlar mellom kommunar om det er behov og rom for
  det.\\n\\nMidlar som i l\u00f8pet av \u00e5ret vert inndregne vert lagt til kommunen
  si ramme slik at kommunen kan disponere dei p\u00e5 nytt fram til s\u00f8knadssystemet
  Agros stengjer i midten av desember. Ved \u00e5rsskiftet vil ubrukte midlar hos
  kommunane bli trekt tilbake til Statsforvaltaren.\\n\\nDe finn meir om ordninga
  hos Landbruksdirektoratet. Rapportering innan 1. november. Sj\u00e5 punkt 16.\\n\\n7.9
  Utvalde kulturlandskap i jordbruket og verdsarvomr\u00e5det Vestnorsk fjordlandskap\\n\\nOrdninga
  gjeld for dei sju utvalde kulturlandskapa Gjuvslandslia, Havr\u00e5, Ullensvang,
  L\u00e6rdal, Grinde og Engjasete, Ormelid og Stadlandet og for verdsarvomr\u00e5det
  Vestnorsk fjordlandskap N\u00e6r\u00f8yfjorden. Dei sju kommunane med utvalde kulturlandskap
  (UKL) og verdsarvkommunane forvaltar ordninga p\u00e5 bakgrunn av forskrift om tilskudd
  til tiltak i Utvalgte kulturlandskap i jordbruket og verdensarvomr\u00e5dene Vega\u00f8yan
  og Vestnorsk fjordlandskap og planar for omr\u00e5da. Form\u00e5let med tilskot
  til tiltak i verdsarvomr\u00e5da er \u00e5 styrke landbruket i verdsarvomr\u00e5da.
  Form\u00e5let med tilskot til tiltak i Utvalde kulturlandskap er \u00e5 sikre verdiar
  knytt til landskap, biologisk mangfald, kulturminne og kulturmilj\u00f8, medrekna
  langsiktig skj\u00f8tsel og drift. Ordninga blir forvalta gjennom fagsystemet Agros.\\n\\n\u00d8konomisk
  ramme - utvalde kulturlandskap i jordbruket\\n\\nDei aktuelle kommunane f\u00e5r
  tildelt ei \u00f8konomisk ramme fr\u00e5 Statsforvaltaren til forvaltning av UKLomr\u00e5da
  (sj\u00e5 tabell). Ordninga er i \u00e5r redusert med 3 mill. kroner, som betyr
  at alle fylka har f\u00e5tt reduserte rammer. Vestland har ei totalramme p\u00e5
  3,7 mill. kroner i kroner i 2023. Av denne ramma har vi sett av i overkant av 80
  000 kroner til eit felles fagleg arrangement for alle UKL-omr\u00e5da i fylket.\\n\\nRamma
  til kvart omr\u00e5de er rekna ut p\u00e5 grunnlag av dialog med kommunane i samband
  med \u00e5rsrapporteringa i november 2022, og vurderingar av f\u00f8lgjande moment:\\n\\n*
  gjennomf\u00f8ringsevne, framdrift og oppn\u00e5dde resultat i omr\u00e5da\\n* arealet
  p\u00e5 omr\u00e5da, omfanget av tiltak og tal eigarar/drivarar\\n* variasjonar
  i behova fr\u00e5 \u00e5r til \u00e5r\\n* omsynet til f\u00f8reseieleg \u00f8konomi
  og kontinuitet\\n* planar i omr\u00e5da\\n* innmeldte behov fr\u00e5 dei aktuelle
  kommunane\\n\\nVi vil f\u00f8lgje med p\u00e5 forbruket av midlar i kommunane gjennom
  \u00e5ret for \u00e5 sikre at forvaltninga av midlane fremjar aktivitet. I dialog
  med kommunane kan vi, i l\u00f8pet av \u00e5ret, omfordele udisponerte midlar mellom
  kommunane.\\n\\n\u00d8konomisk ramme - verdsarv\\n\\nStatsforvaltaren har f\u00e5tt
  tildelt 3 mill. kroner i ramme til Vestnorsk fjordlandskap - N\u00e6r\u00f8yfjorden
  fr\u00e5 LMD. Medrekna midlar som er inndregne er ramma for 2023 p\u00e5 totalt
  3 022 760 kroner. Vi reknar med at vi seinare i \u00e5r vil kunne overf\u00f8re
  midlar til verdsarvordninga fr\u00e5 Klima- og milj\u00f8departementet, slik vi
  har gjort tidlegare \u00e5r.\\n\\nI tr\u00e5d med tildelingsbrevet fr\u00e5 departementet
  skal Statsforvaltaren sikre ei aktivitetsfremjande forvaltning av verdsarvmidlane,
  og kan i samarbeid med Landbruksdirektoratet omfordele udisponerte midlar mellom
  delomr\u00e5da i verdsarvomr\u00e5det (N\u00e6r\u00f8yfjorden og Geirangerfjorden)
  i l\u00f8pet av \u00e5ret, ved behov. Ei slik omfordeling vil g\u00e5 f\u00f8re
  seg i dialog med Statsforvaltaren i M\u00f8re og\\n\\nRomsdal og dei to verdsarvkommunane
  Stranda og Fjord, og i tr\u00e5d med felles retningslinjer for omfordeling av verdsarvmidlar.\\n\\n7.10
  Autorisasjonsbevis for bruk av plantevernmiddel og gnagarmiddel.\\n\\nFor \u00e5
  kunne bruke plantevernmiddel og gnagarmiddel m\u00e5 brukar ha gjennomf\u00f8rt
  kurs med best\u00e5tt eksamen. Det er eitt kurs for kvar ordning med kvar sin eksamen.
  Her er det ei ansvarsdeling mellom kommunen, Statsforvaltaren og eksterne kurshaldarar
  (NLR Vest og VGS Naturbruk). Dei som f\u00e5r autorisasjon skal registrerast i ein
  nasjonal base og f\u00e5r utskrive bevis fr\u00e5 Mattilsynet. Arbeidsmengda med
  dette varierer fr\u00e5 \u00e5r til \u00e5r alt etter kor mange som m\u00e5 ha nytt
  bevis.\\n\\nNokre kommunar vert kontakta for \u00e5 halde eksamen. Kommunar som
  held eksamen kan f\u00e5 godtgjort kr 65 per deltakar p\u00e5 planteverneksamen
  og kr 75 per deltakar p\u00e5 gnagarmiddeleksamen. Kommunen m\u00e5 sj\u00f8lv sende
  rekning for dette til Statsforvaltaren i Vestland innan 1. desember.\\n\\nMeir informasjon:\\n\\n*
  Instruks til kommune og statsforvalter om ut\u00f8velse av delegert myndighet etter
  plantevernmiddelforskriften\\n* Dokument for kommunane\\n* Info p\u00e5 nettsida
  v\u00e5r\\n\\n7.11 Arbeid med vasskvalitet, vassrammedirektivet m.m.\\n\\nArbeidet
  med vasskvalitet er delt mellom kommunen, fylkeskommunen og Statsforvaltaren. Kommunen
  er lokal ureiningsstyresmakt, og p\u00e5 landbruksomr\u00e5det skal kommunen sjekke
  om regelverket for til d\u00f8mes silopressaft og husdyrgj\u00f8dsel vert etterlevd.
  I arbeidet med oppf\u00f8lging av vassrammedirektivet m\u00e5 dette arbeidet utvidast
  til ogs\u00e5 \u00e5 sj\u00e5 p\u00e5 belastninga fr\u00e5 andre ureiningskjelder,
  til d\u00f8mes punktutslepp av hushaldningskloakk i spreiddbygde omr\u00e5de. For
  \u00e5 sikre god vasskvalitet, r\u00e5r vi til at kommunen ikkje lagar lokale forskrifter
  med generell utsett spreiefrist for husdyrgj\u00f8dsel.\\n\\nMange stader er det
  trong for auka innsats mot forureining fr\u00e5 jordbruk for \u00e5 n\u00e5 m\u00e5let
  om god tilstand i alle landbruksp\u00e5verka vassf\u00f8rekomstar. I omr\u00e5de
  der tiltaka ikkje har vore tilstrekkeleg, m\u00e5 kommunen innf\u00f8re meir forpliktande
  krav. Etter forskrift om gj\u00f8dselvarer mv. av organisk opphav har kommunen heimel
  til \u00e5 stille meir restriktive eller lempelege krav til spreietidspunkt for
  husdyrgj\u00f8dsel ut fr\u00e5 situasjonen lokalt. Kommunen kan d\u00e5 stille meir
  restriktive krav til spreiearealog spreiemengde. Fleire kommunar har lokale forskrifter
  som gir utvida tidsfrist for spreiing utan nedmolding om hausten. Det er ikkje h\u00f8ve
  til \u00e5 setje strammare frist for haustspreiing med nedmolding enn 1. september.\\n\\nDe
  finn meir informasjon om arbeidet med vasskvalitet i vassforvaltingsplanar i Vestland
  vassregion.\\n\\n7.12 Veterin\u00e6re tenester\\n\\nKommunen skal i f\u00f8lgje
  dyrehelsepersonellova s\u00f8rge for tilfredsstillande tilgang p\u00e5 veterin\u00e6re
  tenester, inkludert veterin\u00e6rvakt utanom vanleg arbeidstid. Dette er ei ordning
  der vaktdistrikta (vanlegvis fleire kommunar) f\u00e5r eit \u00e5rleg tilskot til
  vakt utanom arbeidstid og eit mindre administrasjonstilskot for \u00e5 organisere
  dette. Dette vert betalt ut til vertskommunen.\\n\\nI tillegg kan kommunar s\u00f8kje
  om stimuleringstilskot som skal medverke til stabil tilgang p\u00e5 veterin\u00e6rtenester
  p\u00e5 dagtid. Nokre kommunar nyttar ogs\u00e5 eigne midlar inn i dei veterin\u00e6re
  tenestene. Det m\u00e5 p\u00e5reknast ein viss administrasjon for \u00e5 sikre desse
  tenestene. For tilskots\u00e5ra 2021\\n\\nog 2022 er det innf\u00f8rt ei pr\u00f8veordning
  for stimuleringstilskotet til kommunar. Denne ordninga vert vidaref\u00f8rt i tilskots\u00e5ret
  2023, slik at kommunar som har utfordringar med \u00e5 f\u00e5 nok veterin\u00e6rar
  til \u00e5 delta i klinisk veterin\u00e6rvakt, kan ogs\u00e5 for 2023, stille krav
  om vaktdeltaking for at veterin\u00e6rane skal f\u00e5 stimuleringstilskot.\\n\\nFrist
  for \u00e5 s\u00f8kje statsforvaltarane om midlar er 17. februar. De skal samstundes
  rapportere om bruken av midlar f\u00f8rre \u00e5r. Detaljar om ordninga er sendt
  i eige brev til kommunane. De finn meir om dette p\u00e5 nettsida v\u00e5r.\\n\\n8.
  Skogbruksoppg\u00e5ver i kommunen\\n\\nKommunen er skogbruksstyresmakt etter skogbrukslova
  med tilh\u00f8yrande forskrifter og har ei rekke oppg\u00e5ver p\u00e5 skogomr\u00e5det.
  F\u00f8rem\u00e5let med skogbrukslova er \u00e5 fremme ei berekraftig forvaltning
  av skogressursane i landet med sikte p\u00e5 aktiv lokal og nasjonal verdiskaping,
  og \u00e5 sikre det biologiske mangfaldet, omsyn til landskapet, friluftslivet og
  kulturverdiane i skogen.\\n\\nHer nemner vi nokre av oppg\u00e5vene:\\n\\n* Vere
  ein p\u00e5drivar og jobbe aktivt for n\u00e6ringsutvikling i skogbruket ved \u00e5
  motivere og f\u00f8lgje opp skogkulturtiltak, bygging av skogsvegar, drift i vanskeleg
  terreng, bruk av skogfond, lokal vidareforedling, nabosamarbeid og andre emne som
  bidreg til verdiskaping i skogbruket.\\n* Forvalte tilskot til n\u00e6rings- og
  milj\u00f8tilskot i skogbruket (NMSK), som omfattar tilskot til skogkultur, skj\u00f8tsel
  og kvalitetstiltak, milj\u00f8tilskot samt tilskot til skogsvegar og drift i vanskeleg
  terreng. Statsforvaltaren fordeler ei \u00e5rleg tilskotsramme til kommunane.\\n*
  Kommunane m\u00e5 fortl\u00f8pande kartleggje behovet for nye skogsvegar og ombygging
  av gamle vegar. Dei skal vere initiativtakar til skogsvegsamarbeid og informere
  skogeigarane om l\u00f8nsemda i \u00e5 byggje felles veganlegg samt dei gunstige
  finansieringsordningane (tilskot og skogfond). Kommunen f\u00e5r tildelt ei tilskotsramme
  tilpassa det behovet dei melder inn i november \u00e5ret f\u00f8r.\\n* Tilskot til
  drift i vanskeleg terreng vert fordelt etter behov, og i prinsippet er det fri ramme
  inntil midlane er brukt opp.\\n* Kontrollere forynging av skogen etter hogst (NMSK-kontroll,
  foryngingskontroll og resultatkartlegging). Dette er den viktigaste milj\u00f8oppg\u00e5va
  i skogbruket b\u00e5de med tanke p\u00e5 skogen si rolle med \u00e5 binde karbon
  og som framtidig skogressurs.\\n* Kommunane m\u00e5 legge vekt p\u00e5 og synleggjere
  skogen sitt verdiskapingspotensiale. Kommunen kan gjere det tydeleg ved \u00e5 initiere
  og ta del i skogdagar og andre fagarrangement, b\u00e5de retta mot skogeigarar og
  \u00e5lmenta.\\n* Forvalte og informere om skogfondordninga. Gje l\u00f8pande r\u00e5d
  til einskilde skogeigarar med bakgrunn i innest\u00e5ande bel\u00f8p, udekka investeringar
  og hogstaktivitet. Aktiv bruk av skogfond gjev \u00f8konomisk utteljing for skogeigarane.\\n*
  Kontrollere at tiltak i skogen er i samsvar med regelverket, og bidra til \u00e5
  overvake tilstanden i skogen.\\n* Bidra med kunnskap om skogen i forhold til andre
  samfunnsinteresser og oppg\u00e5ver, skogen si rolle i klimapolitikken, skogen si
  rolle som vern mot naturskade og skogen sin verdi for friluftsliv, viltforvaltning
  m.m.\\n* Kommunen vert oppmoda om \u00e5 lage ein oversikt med dei mest verdfulle
  skogbruksomr\u00e5da i kommunen (kjerneomr\u00e5de skogbruk). Sj\u00e5 d\u00f8me
  p\u00e5 Fylkesatlas! Karta er laga med utgangspunkt i dei kommunale tiltaksplanane
  for skogbruk. Slik er det mogleg \u00e5 synleggjere\\n\\nskogen si samfunnsrolle
  (n\u00e6ring, i plansamanheng og arealbrukssp\u00f8rsm\u00e5l, klima, naturskade,
  friluftsliv, viltforvaltning).\\n* Vi oppmodar ogs\u00e5 kommunane til \u00e5 g\u00e5
  gjennom og oppdatere hovudplanane for skogsvegar.\\n\\nVi har tidlegare oppmoda
  kommunane om \u00e5 auke satsen p\u00e5 tilskot til skogsdrift med taubane til kr
  240,- per m\u00b3 (pluss eventuelt tillegg for framk\u00f8yring med lastetraktor).
  30 % av grana i Vestland m\u00e5 drivast med taubane og vi ser det difor som ei
  viktig oppg\u00e5ve \u00e5 styrke \u00f8konomien til taubanedrivarane i Norge. Det
  er store \u00f8konomiske utfordringar i bransjen, b\u00e5de n\u00e5r det gjeld mangel
  p\u00e5 kvalifisert arbeidskraft og p\u00e5 den generelle kostnadssida. Vi har difor
  halde att eit relativt stort bel\u00f8p berekna p\u00e5 tilskot til taubanedrift
  i \u00e5r.\\n\\nI tillegg held vi att midlar til overordna skogsvegplanlegging (omr\u00e5deplanlegging/transportplanlegging).
  Slik planlegging vert utf\u00f8rt av Skogselskapet i Sogn og Fjordane og Fanagro.
  Dette skal vere gratis for skogeigarane.\\n\\nVi har brukt kommunane sine prioriterte
  \u00f8nskje og sett p\u00e5 historisk fordeling av midlar n\u00e5r vi fordelte skogsvegmidlane
  i \u00e5r, sj\u00e5 figur 1 og eige vedlegg for tildeling av midlar.\\n\\n9. Landbruksrelatert
  n\u00e6rings- og bygdeutvikling\\n\\nDet er store variasjonar i kommunane sine ambisjonar
  p\u00e5 landbruksomr\u00e5det. Dette er m.a. avhengig av kommunen sine eigne politiske
  ambisjonar og vedtak. Kommunen avgjer i stor grad sj\u00f8lv kor aktive dei vil
  vere, men det er eit minstekrav at kommunen handsamar s\u00f8knader og sp\u00f8rsm\u00e5l
  innan n\u00e6ringsutvikling. Vi viser her til forskrift for kommunens saksbehandling
  av s\u00f8knadar til Innovasjon Norge.\\n\\nKommunen sin innsats kan utgjere ein
  stor skilnad lokalt. Vi oppmodar kommunen om \u00e5 ta initiativ til samhandling
  lokalt t.d. gjennom \u00e5rlege m\u00f8te med faglaga, opne fagm\u00f8te eller at
  det vert s\u00f8kt om prosjektmidlar fr\u00e5 fylkeskommunen. Utfordringar b\u00e5de
  innan landbruk, landbruksrelaterte n\u00e6ringar og klima krev samhandling, og her
  har kommunen eit ansvar. Statsforvaltaren er open for \u00e5 kunne medverke p\u00e5
  slike m\u00f8te eller initiativ.\\n\\n10. Forvaltning av regelverket for fast eigedom\\n\\nKommunane
  skal fatte vedtak etter jord- og konsesjonslova. Det gjeld til d\u00f8mes saker
  om deling av landbrukseigedom, omdisponering av dyrka jord, driveplikt, konsesjon
  for kj\u00f8p av fast eigedom, buplikt m.m. Dette er saker som ofte er innom politiske
  handsaming i kommunen, avhengig av kommunens delegeringsreglementet.\\n\\nKravet
  om driveplikt for jordbruksareal gjeld for alle som eig ein landbrukseigedom, og
  for heile eigartida. Dersom andre skal drive eigedommen er eigar ansvarleg for \u00e5
  f\u00e5 p\u00e5 plass ein skriftleg avtale p\u00e5 minst 10 \u00e5r. Kommunen skal
  ha kopi av avtalen og kontrollere at den oppfyller krava i lova. I 2023 vil vi arbeide
  vidare med \u00e5 gje kommunane lister over areal som truleg er ute av drift, og
  malar for varselbrev og p\u00e5legg. Vi tilbyr fagleg hjelp p\u00e5 dette fagomr\u00e5det
  og forventar at kommunane set av ressursar til oppf\u00f8lging.\\n\\n11. Forskrift
  for godkjenning av landbruksvegar, dyrking og planering\\n\\nDet finst eigne forskrifter
  med heimel i jordlova og skogbrukslova for bygging av landbruksvegar (oftast skogsvegar),
  for nydyrking og for bakkeplanering (forurensingslova). Dei viktigaste omsynet i
  desse forskriftene er \u00e5 vege landbruksinteressene mot andre viktige samfunnsinteresser,
  til d\u00f8mes natur, kulturlandskap og forureining. Det er ogs\u00e5 krav om at
  tiltaket skal gjennomf\u00f8rast p\u00e5 ein landbruksfagleg god m\u00e5te. Til
  desse avvegingane trengst det landbruksfagleg og skogfagleg kunnskap. Vi viser til
  ordninga med fylkesdekkane skogsvegplanleggarar som skal vere tilgjengelege for
  alle.\\n\\nStatsforvaltaren skal ha h\u00f8ve til \u00e5 uttale seg i saker som
  gjeld bilvegar og kommunen skal sende desse p\u00e5 h\u00f8yring til oss. Ogs\u00e5
  traktorvegar kan sendast p\u00e5 h\u00f8yring til oss dersom kommunen ynskjer fr\u00e5segn
  fr\u00e5 oss f\u00f8r dei fattar vedtak. Vi har ei eiga temaside om handsaming av
  landbruksvegar.\\n\\nBruk av overskotsmassar kan vere positivt b\u00e5de for vegbygging
  og forbetring av jordbruksareal. Kommunen m\u00e5 f\u00f8lgje dette opp b\u00e5de
  med l\u00f8yve i forkant og kontroll i etterkant.\\n\\nI saker om nydyrking skal
  Statsforvaltaren ha h\u00f8ve til \u00e5 uttale seg i saker som ber\u00f8rer vesentlege
  natur- eller kulturverdiar.\\n\\nDu finn meir informasjon p\u00e5 desse lenkene:\\n\\n*
  Landbruksvegar\\n* Nydyrking\\n* Bakkeplanering\\n\\n12. Jordvern\\n\\nStortinget
  har vedteke ambisi\u00f8se m\u00e5l for \u00e5 redusere omdisponering av dyrka jord
  fr\u00e5 maksimalt 4000 ned til 3000 dekar per \u00e5r. Dette er ein nedgang fr\u00e5
  340 dekar til 255 dekar per \u00e5r for heile Vestland fylke. Kommunane sitt arbeid
  med plansaker og enkeltsaker etter jordlova er sv\u00e6rt viktig i denne samanheng.\\n\\nTil
  dette trengst det god kunnskap om dei arealressursane som finst i kommunen, kva
  kvalitet jorda har og eventuelt ogs\u00e5 kva alternative areal og l\u00f8ysingar
  som finst for utbygging m.m. Eit verkemiddel her er \u00e5 lage ein tematisk plan
  for kjerneomr\u00e5de landbruk der ein plukker ut dei mest verdifulle areala for
  landbruksproduksjon og kulturlandskap, som deretter vert brukt i den kommunale arealforvaltninga.
  Det er viktig at kommunen bruker sine eigne fagfok p\u00e5 landbruk i samband med
  kommunale arealplanar. Kommunen skal rapportere det \u00e5relege omfanget av omdisponering
  via KOSTRA.\\n\\n13. Vedlikehald av kartgrunnlaget \u2013 gardskart AR5\\n\\nDette
  er ei oppg\u00e5ve som b\u00f8r utf\u00f8rast i samarbeid med andre med kartoppg\u00e5ver
  i kommunen. Kartgrunnlag med innteikna grenser for til d\u00f8mes fulldyrka jord,
  overflatedyrka jord og innmarksbeite, og med andre oppdaterte eigedomsopplysningar,
  er sv\u00e6rt viktig for forvaltning av b\u00e5de st\u00f8tteordningar og arealregelverk
  i landbruket. Kommunen skal halde desse karta med landbruksregister ved like. Viss
  det ikkje skjer m\u00e5 t.d. enkelts\u00f8knadar om produksjonstilskot i praksis
  handterast manuelt, til mykje ekstraarbeid og auka feilmargin for b\u00e5de gardbrukar,
  kommune og Statsforvaltaren. Slike gode kart er ogs\u00e5 til stor hjelp i andre
  type saker i kommunen, til d\u00f8mes planog bygg og viltforvaltning.\\n\\nAvtale
  om kommunen sitt ansvar for vedlikehald av kartgrunnlaget\\n\\n14. Oppf\u00f8lging
  og kontroll for \u00e5 sikre rett tilskotsforvaltning\\n\\nFor \u00e5 sikre rett
  sakshandsaming skal kommunen ha etablert system for internkontroll med rutinar og
  tiltak som skal f\u00f8rebygge, avdekke og korrigere feil og manglar. For \u00e5
  sikre rett forvaltning er vi avhengig av eit godt samarbeid mellom kommune og Statsforvaltar,
  og at kommunen set av tilstrekkeleg med ressursar til arbeidet. Gjennom den statlege
  rammel\u00f8yvinga har kvart kommune f\u00e5tt ein sum som skal dekke kostnaden
  kommunen har med forvaltninga av saker som er heimla i jordlova og skogbrukslova.\\n\\nP\u00e5
  landbruksomr\u00e5det skal Statsforvaltaren i Vestland kvart \u00e5r gjennomf\u00f8re
  forvaltningskontroll av minst ni kommunar. Dei kommunane som vert trekte ut vil
  f\u00e5 n\u00e6rare varsel om dette.\\n\\n15. Statsforvaltaren si rolle\\n\\nStatsforvaltaren
  har fleire ulike roller innan landbruk i forhold til kommunane:\\n\\n* Vi handsamar
  klager p\u00e5 dei fleste landbrukssakene der kommunane fattar enkeltvedtak\\n*
  Vi skal drive forvaltningskontroll med kommunane sin praksis\\n\\n* Vi skal vere
  eit kompetansesenter p\u00e5 forvaltning og r\u00e5dgje kommunane om oppg\u00e5vene
  innan landbruk, b\u00e5de regelforst\u00e5ing, praksis og saksgang.\\n\\nVi skal
  tilby kommunane oppl\u00e6ring, b\u00e5de korte kurs i ulike regionar i fylket eller
  p\u00e5 nettet, og st\u00f8rre arrangement. Ogs\u00e5 i 2023 tek vi sikte p\u00e5
  \u00e5 arrangere ei fellessamling i september over to dagar for kommunane innan
  landbruk og tilgrensande tema. Vi kjem ogs\u00e5 til \u00e5 satse p\u00e5 korte
  webinar med ulike fagtema. Kom gjerne med forslag til tema p\u00e5 desse m\u00f8ta
  og samlingane.\\n\\n16. Rapportering undervegs og omfordeling av midlar\\n\\nVi
  kjem i 2023 til \u00e5 f\u00f8lgje med p\u00e5 forbruket undervegs i \u00e5ret.
  Det er ei klar forventning om at midlane skal kome i aktiv drift s\u00e5 snart som
  det er fagleg forsvarleg. Det kan vere aktuelt med omfordeling mellom kommunar gjennom
  \u00e5ret dersom vi ser at midlane ikkje vert brukte i enkelte kommunar, medan andre
  har for lite midlar.\\n\\nVi har som tidlegare ei \u00e5rsrapportering per 1. november
  for desse ordningane:\\n\\n* SMIL\\n* Drenering\\n* Utvalde kulturlandskap i jordbruket\\n*
  Tiltak i beiteomr\u00e5de\\n* Skogkultur\\n* Skogsvegar\\n\\nI samband med at vi
  ber Landbruksdirektoratet om ny \u00e5rsramme treng vi informasjon om forbruk i
  2023 og trong for midlar i 2024. Her treng vi informasjon om:\\n\\n* L\u00f8yving
  per 1.11 i fagsystemet\\n* L\u00f8yving som vil bli gjort f\u00f8r 15.12 i fagsystemet\\n*
  Restmidlar 2023 som kan omfordelast til andre kommunar\\n* Trong for midlar i 2024\\n\\nStatsforvaltaren
  vil sende ut n\u00e6rare informasjon om rapporteringa i god tid i forkant av fristen.\\n\\nTil
  slutt viser vi til nettsida v\u00e5r med meir informasjon om landbruksoppg\u00e5vene,
  og ogs\u00e5 til Landbruksdirektoratet si nettside.\\n\\nMed helsing\\n\\nChristian
  Rekkedal landbruksdirekt\u00f8r\\n\\nDokumentet er elektronisk godkjent\\n\\nVedlegg:\\n\\n1\\n\\nTildeling
  av fagmidlar til kommunane 2023\\n\\nBj\u00f8rn Harald Haugsv\u00e6r ass. landbruksdirekt\u00f8r\"",
  "\"Eksamensoppg\u00e5ve i TMA4115 Matematikk 3\\n\\nFagleg kontakt under eksamen:
  Antoine Julien, Eugenia Malinnikova\\nTlf: 73597782, 73550257\\n\\nEksamensdato:
  26. mai, 2015\\nEksamenstid (fr\u00e5\u2013til): 09:00-13:00\\nHjelpemiddelkode/Tillatne
  hjelpemiddel: C: Enkel kalkulator (Casio fx-82ES PLUS, Citizen SR-270X eller Citizen
  SR-270X College, Hewlett Packard HP30S), Rottmann: Matematisk formelsamling\\n\\nAnnan
  informasjon:\\nAlla svara skal grunngjevast og det skal g\u00e5 kl\u00e5rt fram
  korleis svara er oppn\u00e5dd. Kvar av dei 12 punkta tel likt ved sensur.\\n\\nM\u00e5lform/spr\u00e5k:
  nynorsk\\nSidetal: 2\\nSidetal vedlegg: 0\\n\\nKontrollert av:\\n\\nMerk! Studentane
  finn sensur i Studentweb. Har du sp\u00f8rsm\u00e5l om sensuren m\u00e5 du kontakte
  instituttet ditt. Eksamenskontoret vil ikkje kunne svare p\u00e5 slike sp\u00f8rsm\u00e5l.\\n\\nOppgave
  1 L\u00f8ys den kvadratiske likninga $z^2 + (4 + 2i)z + 3 = 0$, skriv l\u00f8ysingane
  p\u00e5 normalforma.\\n\\nOppgave 2\\n\\na) L\u00f8ys initialverdiproblemet\\n\\n$$x''''
  + 6x'' + 8x = 0, \\\\quad x(0) = 0, \\\\quad x''(0) = 8.$$ \\n\\nKva er den st\u00f8rste
  verdien til l\u00f8ysinga $x(t)$ n\u00e5r $t > 0$?\\n\\nb) Finn den stasjon\u00e6re
  l\u00f8ysinga av likninga\\n\\n$$x'''' + 6x'' + 8x = 4\\\\cos 2t.$$\\n\\nOppgave
  3 Finn generell l\u00f8ysing til likninga\\n\\n$$y'''' + y = 3x + \\\\tan(x).$$\\n\\n(Hint
  $\\\\int (\\\\cos x)^{-1}dx = \\\\ln |\\\\sec x + \\\\tan x|$. )\\n\\nOppgave 4
  Lat\\n\\n$$A = \\\\begin{bmatrix} 1 & t \\\\\\\\ t & 2 \\\\end{bmatrix}.$$\\n\\na)
  For kva for verdiar av $t$ har likninga $Ax = b$ ei l\u00f8ysing for alle $b$ i
  $\\\\mathbb{R}^2$?\\n\\nb) Finn ein LU-dekomposisjon av $A$ (svaret skal vere avhengig
  av $t$).\\n\\nOppgave 5 Gjeve dei f\u00f8lgjande vektorane i $\\\\mathbb{R}^4$\\n\\n$$v_1
  = \\\\begin{pmatrix} 1 \\\\\\\\ 0 \\\\\\\\ 2 \\\\\\\\ 0 \\\\end{pmatrix}, \\\\quad
  v_2 = \\\\begin{pmatrix} 0 \\\\\\\\ 0 \\\\\\\\ 1 \\\\\\\\ -1 \\\\end{pmatrix}, \\\\quad
  v_3 = \\\\begin{pmatrix} 4 \\\\\\\\ -3 \\\\\\\\ -2 \\\\\\\\ 4 \\\\end{pmatrix},
  \\\\quad v_4 = \\\\begin{pmatrix} 3 \\\\\\\\ -2 \\\\\\\\ 1 \\\\\\\\ 1 \\\\end{pmatrix},$$\\n\\nlat
  $V = \\\\text{Span}\\\\{v_1, v_2, v_3, v_4\\\\}$.\\n\\na) Er vektorane $\\\\{v_1,
  v_2, v_3, v_4\\\\}$ line\u00e6rt uavhengige? Finn ein basis for $V$.\\n\\nb) Finn
  ein ortogonal basis for $V$.\\n\\nc) Finnast det ein vektor $u \\\\neq 0$ i $\\\\mathbb{R}^4$
  som er ortogonal til $v_1, v_2, v_3, v_4$?\\n\\nOppgave 6\\n\\na) Finn (komplekse)
  egenverdiar og (komplekse) egenvektorar til matrisa\\n\\n\\\\[\\n\\\\begin{bmatrix}\\n1
  & -2 \\\\\\\\\\n1 & 3\\n\\\\end{bmatrix}\\n\\\\]\\n\\nb) Finn l\u00f8ysinga til
  likningssystemet\\n\\n\\\\[\\n\\\\begin{align*}\\nx_1'' &= x_1 - 2x_2 \\\\\\\\\\nx_2''
  &= x_1 + 3x_2\\n\\\\end{align*}\\n\\\\]\\n\\nsom oppfyller startvilk\u00e5ra \\\\(x_1(0)
  = 1\\\\) og \\\\(x_2(0) = 1\\\\). Skriv svaret med reelle funksjonar.\\n\\nOppgave
  7 Anta at \\\\(A\\\\) er ei \\\\(m \\\\times n\\\\)-matrise med reelle element.
  Vis at \\\\(x \\\\cdot A^T Ax \\\\geq 0\\\\) for kvar \\\\(x\\\\) i \\\\(\\\\mathbb{R}^n\\\\),
  og difor er kvar reell egenverdi til \\\\(A^T A\\\\) ikkje-negativ.\"", "\"SAKSLISTE
  \u00c5RSM\u00d8TE 20. MARS 2024\\n\\n1. Opning\\n2. Godkjenning av innkalling\\n3.
  Val av m\u00f8teleiar\\n4. Val av referent\\n5. Val av to personar til signering
  av protokoll\\n6. \u00c5rsmeldingar\\na. Hovudlaget\\nb. Ski\\nc. Handball\\nd.
  Fotball\\ne. Barneidrett\\nf. Turn\\ng. Trim\\n7. Reknskap\\na. Same rekkef\u00f8lge
  som under pk. 6.\\n8. Saker til handsaming\\na. Val av p\u00e5tale for 2024\\ni.
  Forslag fr\u00e5 styret: leiar og nestleiar\\nb. Kontingent 2024-2025\\ni. Forslag
  fr\u00e5 styret: ingen endringar i satsar (fam.medlemskap 400kr, enkeltmedlemsskap
