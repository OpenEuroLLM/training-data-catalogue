  5,8                  |\\n\\n*Deltid menn:* Av 108 menn jobbar fire redusert. Av
  desse har to f\u00e5tt innvilga ein viss prosentdel uf\u00f8repensjon og er ikkje
  med i utrekningsa. Og \u00e9in er i studiepermisjon og jobbar deltid. Det er to
  som er medrekna i deltid.\\n\\n*Deltid kvinner:* Av 140 kvinner jobbar 17 redusert,
  men av desse har \u00e5tte f\u00e5tt innvilga ein viss prosentdel uf\u00f8repensjon,
  som vil seie at 9 er medrekna i deltid.\\n\\nPatentstyret tilbyr praksisplass for
  studentar etter f\u00f8respurnad fr\u00e5 Det juridiske fakultetet ved Universitetet
  i Oslo. Vi har tilbydd plass b\u00e5de v\u00e5ren og hausten 2023, men fekk ikkje
  nokon studentar via ordninga.\\n\\nKonsulentbruk\\n\\nPatentstyret kj\u00f8per i
  hovudsak konsulentst\u00f8tte innanfor IKT-utvikling og vedlikehald, og vi nyttar
  i nokon grad konsulenttenester i samband med rekruttering, st\u00f8tte til komplekse
  juridiske sp\u00f8rsm\u00e5l og st\u00f8tte til enkelte innkj\u00f8p.\\n\\nDet er
  ein auke i kj\u00f8p av konsulenttenester for 2023 samanlikna med 2022. Dette gjeld
  i hovudsak konsulenttenester til utvikling av programvare og IKT-l\u00f8ysingar
  i siste prosjekt\u00e5r for prosjektet Smart tilgjenge, og konsulenttenester innanfor
  \u00f8konomi og juss. Ei anna \u00e5rsak er at arbeidsmarknaden er pressa for ressursar.
  Patentstyret har komplekse IKT-system som krev spesialkompetanse, slik at det ikkje
  n\u00f8dvendigvis er tenleg \u00e5 ha denne kompetansen intern.\\n\\nSer ein dette
  i samanheng med eit \u00f8nske om at Patentstyret skal halde tritt innanfor digitalisering,
  er dette ei naturleg utvikling. Bruken av konsulenttenester innanfor IKT og programvare
  bidreg til \u00e5 sikre ein vellykka, effektiv og heilskapleg transformasjon av
  tenestene til organisasjonen i samsvar med prinzippa som er nemnde i rundskrivet
  om digitalisering av offentleg sektor.\\n\\nI 2023 blei det gjennomf\u00f8rt rekrutteringstiltak
  for \u00e5 redusere bruken av ekstern konsulentst\u00f8tte innanfor omr\u00e5da
  IKT-utvikling og -vedlikehald. Det blei ogs\u00e5 innf\u00f8rt m\u00e5ltal p\u00e5
  konsulentutgifter for kvar avdeling. Dette blei gjort for \u00e5 sikre at Patentstyret
  avgrensar kostnaden til konsulenttenester mest mogleg, og for \u00e5 rette merkesm\u00f8d
  mot bruk av interne ressursar der det er mogleg.\\n\\nKj\u00f8p av konsulenttenester
  til organisasjonsutvikling og kommunikasjonsr\u00e5dgjeving i 2022 var p\u00e5 2
  365 253,62 kroner. I 2023 blei dette redusert til 1 554 901 kroner. Dette utgjer
  ein nedgang p\u00e5 34 prosent. Utgiftene er i hovudsak knyttte til st\u00f8tte
  til rekruttering av sentrale stillingar.\\n\\nPatentstyret nytta ekstern st\u00f8tte
  fr\u00e5 kommunikasjonsbransjen til desse prosessane:\\n\\n- rapport Kundeservicepris\\n-
  ny profil\\n- s\u00f8keordsanalyse\\n- logoanimasjon\\n- varemerkekampanje\\n- prioriteringsanalyse\\n-
  r\u00e5dgivning produktteam\\n\\nSamla bel\u00f8p for desse tenestene i 2023 var
  525 873 kroner.\\n\\nDel 5\\nVurdering av framtidsutsikter\\n\\nReg.nr. DM/220819\\n\\nFramtidsutsikter\\n\\nImmaterielle
  verdiar og rettar\\n\\nPatentstyret vil i 2024 jobbe for \u00e5 bidra til fleire
  gode rettar og betre bruk av immaterielle verdiar i det norske samfunns- og n\u00e6ringslivet.
  Vi vil saman med n\u00e6ringslivet skape st\u00f8rre l\u00f8nsemd fr\u00e5 immaterielle
  verdiar for b\u00e5de bedrifter og samfunnet.\\n\\nAuka verdi for kunden\\n\\nI
  2024 vil Patentstyret skape auka verdi for kunden ved \u00e5 jobbe med \u00e5 redusere
  saksbehandlingstida mellom anna p\u00e5 varemerkesaker. Vi vil jobbe systematisk
  med \u00e5 forbetre og effektivisere dei kunderetta tenestene v\u00e5re og \u00e5
  styrke kunnskapsformidlinga til n\u00e6ringslivet nasjonalt. Som ledd i dette arbeidet
  lanserte vi ny logo, ny profil og nye, brukarvenlege nettsider i januar 2024.\\n\\nPrioriterte
  m\u00e5lgrupper i den utoverretta verksemda v\u00e5r\\n\\nTala og trendar fr\u00e5
  2023 viser at det er dei store norske bedriftene som patenterer mest og aktivt sikrar
  eierrett til dei immaterielle verdiane sine. Med bakgrunn i prioriteringsanalysen
  fr\u00e5 2023 vil Patentstyret i 2024 jobbe m\u00e5lmedvite for \u00e5 gje ogs\u00e5
  dei sm\u00e5 og mellomstore verksemdene auka kunnskap om immaterielle verdiar og
  fortelje korleis dei kan gjere IP til ein naturleg del av forretningsstrategien
  sin. Vi vil prioritere innsatsen v\u00e5r ut fr\u00e5 kor medvite n\u00e6ringslivet
  er om IP, og i kva grad dei tek IP i bruk. Vi \u00f8nskjer at dei umedvitne skal
  f\u00e5 meir kunnskap om IP og st\u00f8rre kjennskap til Patentstyret. Vi vil utvikle
  nye tenester for dei uerfarne, utvide samarbeidet med dei og p\u00e5 den m\u00e5ten
  auke kunnskapen om IP i denne m\u00e5lgruppa. Overfor dei erfarne \u00f8nskjer Patentstyret
  \u00e5 vere ein attraktiv samarbeidspartner og f\u00f8rstvaltet ved innlevering
  av s\u00f8knader om industrielle rettar.\\n\\nDei prioriterte m\u00e5lgruppene i
  den utoverretta verksemda til Patentstyret vil i 2024 vere eksportretta n\u00e6ringer,
  kunnskapsbaserete n\u00e6ringer som jobbar aktivt med FoU, n\u00e6ringer som utviklar
  nye industrielle l\u00f8ysingar, til d\u00f8mes innanfor gr\u00f8n og fornybar energi,
  og n\u00e6ringer som jobbar med utvikling av ny teknologi og digitale l\u00f8ysingar,
  til d\u00f8mes helse.\\n\\nVerdi for samfunnet \u2013 berekraft og det gr\u00f8ne
  skiftet\\n\\nEin vesentleg f\u00f8resetnad for at Noreg skal lykkast med gr\u00f8n
  omstilling og auke eksporten fr\u00e5 Fastlands-Noreg med 50 prosent innan 2030,
  er at norske selskap\\n\\nsikrar dei immaterielle rettane sine. P\u00e5 patentomr\u00e5det
  i Noreg er det framleis dominans av s\u00f8knader innanfor olje og gass. Dette viser
  at det framleis er stor innovasjonsaktivitet p\u00e5 dette omr\u00e5det. Patentstyret
  vil i 2024 halde fram med \u00e5 synleggjere verdiien av innovasjon og einerett
  til immaterielle verdiar innanfor alle industriomr\u00e5de. Vi vil samtidig ha eit
  ekstra blikk for innovasjon som kan bidra til \u00e5 st\u00f8tte opp under det gr\u00f8ne
  skiftet.\\n\\nSom organisasjon vil Patentstyret setje berekraft h\u00f8gt p\u00e5
  agendaen i 2024. Vi flyttar til nye lokale sommeren 2024, til eit bygg som er sertifisert
  som BREEAM Excellent, og som tilfredsstiller nokre av dei h\u00f8gaste krava som
  blir stilt gjennom BREEAM-sertifiseringa. Bygget er sv\u00e6rt arealefektivt, og
  det gjer at vi reduserer talet p\u00e5 kvadratmeter med over 50 prosent. Vi kuttar
  ogs\u00e5 eigne parkeringsplassar, og dei tilsette vil prim\u00e6rt reise kollektivt.\\n\\n**Digitale
  brukartenester og tryggleik og beredskap**\\n\\nPatentstyret jobbar kontinuerleg
  med digital fornying for \u00e5 forenkle og effektivisere arbeidet for b\u00e5de
  kundar og medarbeidarar. I 2024 skal vi g\u00e5 over til ny Altinn-plattform og
  bidra til auka datadeling. Vi skal digitalisere papirarkivet og styrke og effektivisere
  den utoverretta verksemda ved \u00e5 satse p\u00e5 digital kommunikasjon. Vi tek
  ogs\u00e5 i bruk nye, digitale s\u00f8kjeverkt\u00f8y i saksbehandlinga og held
  fram det internasjonale samarbeidet v\u00e5rt p\u00e5 det digitale omr\u00e5det
  med WIPO, EPO og EUIPO.\\n\\nTryggingssituasjonen i Noreg blir stadig meir krevjande
  og uf\u00f8reseieleg, og dette p\u00e5verkar ogs\u00e5 verksemda til Patentstyret.
  I 2024 vil vi framleis arbeide mykje med cybertryggleik og beredskap, styrke arbeidet
  v\u00e5rt med risikostyring og gjennomf\u00f8re tiltak for \u00e5 gjere oss mindre
  s\u00e5rbare.\\n\\n**Verdi for medarbeidarane**\\n\\nVi flyttar til nye lokale p\u00e5
  Helsfyr i Oslo til sommaren. For \u00e5 skape ein attraktiv arbeidsplass vil vi
  stimulere til auka kompetansebygging, samarbeid og utvikling, og vi vil skape ein
  motiverande arbeidskvardag i nye, flotte lokale. Vi vil framleis jobbe for \u00e5
  vere ein inkluderande arbeidsplass, auke arbeidsn\u00e6rv\u00e6ret, forenkle arbeidsprosessane
  og kutte tidstjuvar.\\n\\nDel 6\\nKommentarar fr\u00e5 leiinga\\n\\nPat.nr. 123456\\n\\nDei
  samla inntektene til Patentstyret i 2023 utgjorde totalt kr 292 223 665, som er
  omtrent 5 prosent h\u00f8gare enn den samla salderte inntektsl\u00f8vinga p\u00e5
  kr 277 235 000. Resultatet ligg innanfor normalavviket for prognosemodellen v\u00e5r.\\n\\n2023
  er ikkje \u00e5 rekne som eit normal\u00e5r. Inntektene v\u00e5re blir p\u00e5verka
  av mellom anna geopolitisk uro, valutakursar og inflasjon, og det gjer inntektsprognosen
  usikker.\\n\\nInntekter av informasjonstenester, kr 3 541 535 (kap. 3935, post 01)
  er tiln\u00e6rma lik inntektsl\u00f8vinga p\u00e5 kr 3 500 000.\\n\\nInntektene
  som gjaldt Nordisk Patentinstitutt, kr 8 409 604 (kap. 3935, post 02), er h\u00f8gare
  enn inntektsl\u00f8vinga p\u00e5 kr 8 000 000. Grunnen til dette er at Patentstyret
  har behandla nokre fleire oppdrag enn venta. Vi viser ogs\u00e5 til eiga rapportering
  om NPI i del 3.\\n\\nInntekter fr\u00e5 gebyr for immaterielle rettar, kr 113 837
  520 (kap. 3935, post 03), er h\u00f8gare enn inntektsl\u00f8vinga p\u00e5 kr 105
  735 000, og dette svarar til eit positivt avvik p\u00e5 om lag 8 prosent. Vi ser
  at det er ein stor auke i talet p\u00e5 valideringar av europeiske patent i 2023,
  som f\u00f8rer til om lag 20 prosent auke i inntektene samanlikna med prognosen.
  Det er nedgang i talet p\u00e5 internasjonale varem\u00f8rkes\u00f8knader samanlikna
  med prognosen (559 f\u00e6rre s\u00f8knader), men trass i dette har inntektene auka
  med om lag 15 prosent samanlikna med prognosen. At inntektene aukar trass i nedgangen
  i talet p\u00e5 s\u00f8knader, kjem dels av at kundane har betalt for fleire klassar
  i kvar s\u00f8knad enn ein gjekk ut fr\u00e5 i prognosen, og dels av at valutakursen
  for sveitsiske franc (CHF) blei vesentleg h\u00f8gare enn ein gjekk ut fr\u00e5
  i prognosen.\\n\\nAvgifter til immaterielle rettar, kr 166 224 141 (kap. 5574, post
  71), er h\u00f8gare enn inntektsl\u00f8vinga p\u00e5 kr 160 000 000. Dette svarar
  til eit positivt avvik p\u00e5 om lag 4 prosent, som er innanfor normalavviket for
  prognosemodellen.\\n\\nDei samla utgiftene til Patentstyret (post 01\u201325) i
  2023 utgjorde totalt kr 323 791 893. Samanlikna med tilgjengelege midlar p\u00e5
  post 01\u201325 p\u00e5 kr 325 924 000 gjev dette ei mindreutgift p\u00e5 kr 2 132
  107. Til kap. 3935, post 04 Ymse inntekter f\u00f8lgjer ei meirinntektsfullmakt.
  I 2023 fekk Patentstyret kr 210 865 i meirinntekter, og det auka dei tilgjengelege
  midlane p\u00e5 kap. 0935, post 01. Dette gjev ei samanlagd mindreutgift for 2023
  p\u00e5 kr 2 342 972, som vi har s\u00f8kt om \u00e5 f\u00e5 overf\u00f8rt til 2024.\\n\\nSjukepengar
  og andre refusjonar utgjorde kr 6 542 850 i 2023.\\n\\nEg stadfestar med dette at
  \u00e5rsrekneskapen til Patentstyret er levert i samsvar med bestemmelser om \u00f8konomistyring
  i staten, rundskriv R-115 av 15. desember 2022 fr\u00e5 Finansdepartementet og krav
  fr\u00e5 NFD. Riksrevisjonen er eksternrevisor og stadfestar \u00e5rsrekneskapen
  for Patentstyret. \u00c5rsrekneskapen er ikkje ferdig revidert per dags dato. Revisjonsmeldinga
  er venta \u00e5 vere klar innan 15. mai 2024, og ho blir publisert n\u00e5r ho ligg
  f\u00f8re.\\n\\nEg meiner rekneskapen gjev eit dekkjande bilete av disponible l\u00f8yingar,
  rekneskapsf\u00f8rte utgifter, eigedelar og gjeld for Patentstyret.\\n\\nOslo, 15.
