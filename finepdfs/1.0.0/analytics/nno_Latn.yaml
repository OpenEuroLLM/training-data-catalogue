  DZ med eit straffekast.\\n\\n18 Par 3\\n\\nOB-\u00f8y.\\nDisk m\u00e5 ligge god
  p\u00e5 \u00f8y.\\nVed bom, kast fr\u00e5 DZ med eit straffekast.\"", "\"Velkomen
  som student p\u00e5 \u00e5rsstudium i musikk ved HVL campus Stord!\\n\\nDet er ei
  glede for oss \u00e5 ynskje deg velkomen til musikkstudier ved HVL, studiestad Stord,
  studie\u00e5ret 2425. \u00c5rsstudium i musikk er eit innhaldsrikt og praktisk studium,
  og vi vonar at du vil trivast og utvikle deg slik du h\u00e5par p\u00e5.\\n\\nHer
  kjem litt generell informasjon som er greitt for deg \u00e5 vite p\u00e5 f\u00f8rehand,
  og har du sp\u00f8rsm\u00e5l til andre ting er det berre \u00e5 ta kontakt p\u00e5
  epost s\u00e5 skal vi svare s\u00e5 snart vi kan. Sj\u00e5 kontaktinfo nederst i
  dokumentet.\\n\\nPraktisk informasjon:\\n\\nM\u00e5ndag 12.august m\u00f8ter du
  l\u00e6rarar og medstudentar p\u00e5 kunstfagbygget p\u00e5 rom FOR121 (Konsertsalen)
  kl 10.00. Den f\u00f8rste studieveka er sett av til informasjon, kartlegging, bli
  kjent med klassen gjennom samspel, og oppstart av dei to 15 stp- emna MUS101- Ut\u00f8ve
  musikk og MUS201 \u2013 Lage musikk. I tillegg til fagleg opplegg er det ein del
  fadderprogram og anna fellesprogram for alle nye studentar. Det er lagt opp til
  fagleg opplegg kvar dag den veka. Du f\u00e5r detaljane for det faglege opplegget
  n\u00e5r du kjem.\\n\\nUtstyr:\\n\\nAlle studentane m\u00e5 i l\u00f8pet av hausten
  skaffe seg studioheadset og dynamisk mikrofon med kabel. Det er ogs\u00e5 veldig
  nyttig \u00e5 ha eit eige lydkort dersom du vil gjere opptak andre stader enn p\u00e5
  skulen. Du f\u00e5r tips om dette ved studiestart \u2013 det er ikkje krise om du
  ikkje har alt p\u00e5 plass n\u00e5r du kjem. Instrumentalistar m\u00e5 ha eige
  instrument (vi har trommesett p\u00e5 campus) og eventuelt tilh\u00f8yrande kablar.
  Vokalistar m\u00e5 ha eigen mikrofon og kabel. HVL har generelt krav om at studentar
  m\u00e5 ha eigen laptop. Du f\u00e5r tilgang til Mac-lab med stasjon\u00e6re maskinar
  og Logic studioprogram. Musikkavdelinga har felles lagerrom med kode for dei som
  treng \u00e5 lagre utstyret sitt p\u00e5 campus.\\n\\nVal av hovudinstrument (evt
  omr\u00e5de)\\n\\nI l\u00f8pet av f\u00f8rste veka skal du velge eit hovudinstrument
  (eventuelt omr\u00e5de) som du skal f\u00e5 individuell oppf\u00f8lging i. Med hovudomr\u00e5de
  meiner vi at dei som har erfaring med t.d. laptop/ musikkproduksjon/ l\u00e5tskriving/
  arrangering kan f\u00e5 tilbod om oppf\u00f8lging i dette i staden for eit s\u00e6rskilt
  hovudinstrument (gjeld kun vidarekomne). Dersom du ikkje har noko erfaring med instrument
  fr\u00e5 f\u00f8r vert det tilbudt anten song, piano, gitar eller bass. Dersom ein
  ynskjer litt breidde kan ein ev. gjere ein kombinasjon av to instrument, MEN det
  vil d\u00e5 verte f\u00e6rre timar per instrument. Breiddefokus kan t.d. vere aktuelt
  for dei som tenkjer seg \u00e5 bli l\u00e6rar i musikk i grunnskulen og ynskjer
  litt kunnskap om fleire instrument. Tenk gjerne igjennom kva ditt valg skal vere
  slik at vi f\u00e5r oversikt over dette s\u00e5 snart som r\u00e5d ved studiestart.\\n\\nMusikkteori/
  notekunnskap\\n\\nDet er ingen krav om forkunnskapar for \u00e5rsstudium musikk.
  Vi kjem til \u00e5 starte med grunnleggande musikkteori, men det kjem til \u00e5
  g\u00e5 fort framover. Dersom du ikkje har nokon erfaring med dette fr\u00e5 f\u00f8r
  vi vil anbefale deg \u00e5 bruke litt tid i sommar p\u00e5 \u00e5 f\u00e5 litt oversikt
  over kva det handlar om. Det finst mykje p\u00e5 nettet som er bra, og det finst
  fleire gratis appar. Pr\u00f8v gjerne ut og leit etter ein app for musikkteori/geh\u00f8rtrening
  som fungerer for deg. Nokre tips til innf\u00f8ring i musikkteori:\\n\\nhttps://www.youtube.com/watch?v=rgaTLrZGlk0\\n\\nhttps://www.musikkteori.net/start-her/\\n\\nhttps://www.notelyst.no/\\n\\nStudietur
  og ekskursjonar\\n\\nHausten 2024 er det lagt opp til studietur i veke 37, til Ole
  Bull Akademiet p\u00e5 Voss. Dette kostar 800 kroner (for mat) + utgifter til reise.
  Resten (overnatting og undervisning/kurs) er fullfinansiert. Det er obligatorisk
  undervisning heile den veka. Dersom ein ikkje har h\u00f8ve til \u00e5 reise pga
  \u00f8konomi eller andre ting vil det bli gitt ei erstatningsoppg\u00e5ve. Turen
  brukar \u00e5 vere veldig samansveisande og kjekk for b\u00e5de l\u00e6rarar og
  studentar! Turen er knytt til emnet MUS201 \u2013 Lage musikk.\\n\\nI tillegg legg
  vi opp til \u00e5 bruke lokalmilj\u00f8et og g\u00e5 p\u00e5 konsert saman \u2013
  som ein del av undervisninga, studentane m\u00e5 betale dette sj\u00f8lv.\\n\\nTips:
  Stord jazzklubb er veldig aktiv og har mykje spanande p\u00e5 programmet. Kun 50
  kroner for studentar! Bakeriet Frug\u00e5rd (Arena) er ein annan utestad med mykje
  forskjellig live-musikk igjennom \u00e5ret. \u00c5tgaum bistro og bar arrangerer
  jam ein gong i m\u00e5naden.\\n\\nTimeplan \u2013 NB Her kan det kome endringar
  fram mot studiestart!\\n\\nUndervisningsdagane er hovudsakleg tysdag (MUS101), onsdag
  (MUS101) og torsdag (MUS201) kvar veke. Veke 40 og 45 er satt av til undervisning
  heile veka. Veke 41 er det studieveke og ingen undervisning, men det vil kome oppg\u00e5ver.
  Individuell undervisning avtalast direkte med l\u00e6rar, og m\u00e5 leggast p\u00e5
  tider som passar for den aktuelle l\u00e6raren (kan t.d. bli p\u00e5 studiedagar
  eller ettermiddagstid).\\n\\nHar du fleire sp\u00f8rsm\u00e5l? Kontakt oss gjerne!\\n\\nGunhild
  Aadland Rolfsnes E-post: email@example.com\"", "\"Gjer idear til verdiar\\n\\n\u00c5rsrapport
  2023\\n\\n| Del                        | Side |\\n|----------------------------|------|\\n|
  Del 1 \u2013 Leiaren har ordet  | 03   |\\n| Del 2 \u2013 Introduksjon til verksemda
  og hovudtal | 06   |\\n| Del 3 \u2013 Aktivitetar og resultat     | 17   |\\n| Del
  4 \u2013 Styring og kontroll         | 57   |\\n| Del 5 \u2013 Vurdering av framtidsutsikter
  | 66   |\\n| Del 6 \u2013 \u00c5rsrekneskap                | 69   |\\n\\nDel 1\\nLeiaren
  har ordet\\n\\nReg.nr. 087413\\n\\nLeiaren har ordet\\n\\n**Immaterielle verdiar
  og rettar**\\n\\nI 2023 har m\u00e5lretta arbeid for fleire gode rettar og betre
  bruk av immaterielle verdiar st\u00e5tt sentralt i arbeidet til Patentstyret. Samla
  fekk vi inn 18 700 s\u00f8knadar om immaterielle rettar. Heile 76 prosent av s\u00f8knadene
  kom fr\u00e5 utanlandske s\u00f8kjarar som \u00f8nskjer rettar i Noreg. Dette representerer
  ein samla nedgang i talet p\u00e5 s\u00f8knader p\u00e5 7,8 prosent fr\u00e5 \u00e5ret
  f\u00f8r. Nedgangen skriv seg f\u00f8rst og fremst fr\u00e5 f\u00e6rre s\u00f8knadar
  p\u00e5 varemerekomr\u00e5det fr\u00e5 internasjonale s\u00f8kjarar. Utviklinga
  i talet p\u00e5 s\u00f8knadar fr\u00e5 norske s\u00f8kjarar i den same perioden
  er stabilt p\u00e5 patentomr\u00e5det, varemerek s\u00f8knadar auka med 6 prosent,
  og talet p\u00e5 designs\u00f8knadar auka med 14 prosent. Vi tildelte 17 100 varemerek-,
  design- og patentrettar i 2023 \u2013 3 prosent fleire enn i 2022. Vi ser ogs\u00e5
  at det norske n\u00e6ringslivet i stadig st\u00f8rre grad sikrar einerett til dei
  immaterielle verdiane sine internasjonalt. Dette er ein positiv trend for det norske
  n\u00e6ringslivet.\\n\\nDet er ogs\u00e5 gledeleg at vi i 2023 s\u00e5g ein liten
  auke i prosentdelen kvinnelege oppfinnarar i norske patents\u00f8knadar \u2013 opp
  1,8 prosent fr\u00e5 \u00e5ret f\u00f8r. Kvinnedelen er likevel p\u00e5 berre 6,7
  prosent \u2013 til samanlikning er han p\u00e5 verdsbasis om lag 16 prosent.\\n\\n5600
  europeiske patent blei gjorde gjeldande i Noreg i 2023, mot 5200 i 2022. Heile 85
  prosent av rettane som er i kraft i Noreg, er eigde av internasjonale rettshavarar.
  Dette er eit uttrykk for at den norske marknaden er attraktiv for det internasjonale
  n\u00e6ringslivet, samtidig som det gjev auka konkurranse.\\n\\n**Forunders\u00f8kingar
  og \u00abfreedom to operate\u00bb-analysar**\\n\\nPatentstyret har tilgang til databasar
  med IP-data fr\u00e5 heile verda. Saksbehandlarane v\u00e5re har fagkompetanse innanfor
  ulike industriomr\u00e5de og kan s\u00f8kje og setje saman desse dataa til verdifull
  informasjon for n\u00e6ringslivet. I 2023 har vi levert data og kunnskap rundt dette
  til b\u00e5de norske og kjende store internasjonale n\u00e6ringsakt\u00f8rar. P\u00e5
  denne m\u00e5ten st\u00f8ttar vi n\u00e6ringslivet med \u00e5 spisse IP-strategiane
  deira og \u00e5 auke den globale konkurransekrafta.\\n\\n**Kunnskapsgap om IP i
  det norske n\u00e6ringslivet?**\\n\\nHausten 2023 gjennomf\u00f8rte Opinion ei bedriftsunders\u00f8king
  for Patentstyret. F\u00f8re m\u00e5let var \u00e5 forst\u00e5 meir om kva kunnskap
  det norske n\u00e6ringslivet har om immaterielle verdiar, og unders\u00f8kinga viser
  at kjennskapen til Patentstyret og IP-milj\u00f8et i Noreg er l\u00e5g. Rapporten
  gjev grunn til uro og peikar p\u00e5 eit sv\u00e6rt stort behov for auka kunnskap
  om immaterielle verdiar og rettar i det norske n\u00e6ringslivet.\\n\\nKunderetta
  aktivitet\\nPatentstyret har i 2023 hatt eit h\u00f8gt aktivitetsniv\u00e5 med mange
  kunderetta aktivitetar. Vi har bidrege til \u00e5 auka kunnskapen om verdien av
  IP-strategi og einerett til innovasjon gjennom tradisjonelle kurs og f\u00f6redrag,
  og samtidig har vi auka den digitale kunnskapsoverf\u00f8ringa. Vi har ogs\u00e5
  sett auka interesse for \u00e5 f\u00f8lgje Patentstyret i sosiale medium, og vi
  brukar desse kanalane meir strategisk enn tidlegare for \u00e5 n\u00e5 prioriterte
  m\u00e5lgrupper. Prioriteringsanalysen som blei gjennomf\u00f8rt i slutten av 2023,
  gjev eit godt grunnlag for \u00e5 prioritere m\u00e5lgruppane for aktivitetar i
  2024. Vi er ogs\u00e5 sv\u00e6rt godt n\u00f8gde med \u00e5 bli k\u00e5ra til det
  beste offentlege kundesenteret i landet for femte \u00e5r p\u00e5 rad i 2023.\\n\\nDigitale
  brukartenester og tryggleik og beredskap\\nPatentstyret har i 2023 jobba med \u00e5
  utvikle digitale system for auka sjolvbetening for kundane og meir effektiv og god
  saksbehandling. Nye nettsider skal gjere det enklare for n\u00e6ringslivet \u00e5
  f\u00e5 svar p\u00e5 dei IP-relaterte sp\u00f8rsm\u00e5la sine, og prosjektet \u00abSmart
  tilgjengelighet\u00bb har bidrege til \u00e5 gjere det enklare for n\u00e6ringslivet
  \u00e5 levere s\u00f8knader til Patentstyret gjennom Nye Altinn. Patentstyret er
  ogs\u00e5 det f\u00f8rste patentverket i verda som har utvikla og lansert digital
  tidend. Som f\u00f8lgje av ein stadig meir uf\u00f8reseieleg og krevjande tryggleikssituasjon
  har Patentstyret i 2023 ogs\u00e5 hatt stor merksemd p\u00e5 cybertryggleik og beredskap.\\n\\nBerekraft
  og det gr\u00f8ne skiftet\\nPatentstyret blei i 2023 resertifisert som milj\u00f8fyrt\u00e5rn.
  Vi har jobba m\u00e5lmedvite med korleis vi gjennom eigne val og prioriteringar
  kan gje v\u00e5rt bidrag til at Noreg skal n\u00e5 klima- og berekraftsm\u00e5l,
  b\u00e5de som verkmiddelakt\u00f8r som st\u00f8ttar det norske og internasjonale
  n\u00e6ringslivet, og som offentleg etat.\\n\\nOslo, 15. mars 2024\\n\\nKathrine
  Myhre, direkt\u00f8r\\n\\nDel 2\\nVerksemda og hovudtal\\n\\nPat.nr. NO/EP3810060\\n\\nPatentstyret
  er eit nasjonalt forvaltningsorgan og kompetansesenter for immaterielle rettar og
  verdiar, og er underlagt N\u00e6rings- og fiskeridepartementet (NFD). Vi hjelper
  n\u00e6ringsliv og samfunnsinstitusjonar med \u00e5 skape, sikre og handtere immaterielle
  verdiar og rettar p\u00e5 ein god og profesjonell m\u00e5te. S\u00f8knadene kjem
  b\u00e5de fr\u00e5 norsk og internasjonalt n\u00e6ringsliv.\\n\\nPatentstyret arbeider
  for \u00e5 auke medvitet og kompetansen om korleis slike rettar kan brukast i innovasjon
  og forretningsutvikling. Ein viktig del av rolla som styresmakt er \u00e5 gjere
  informasjon om patent-, varemerke- og designrettar enkelt tilgjengeleg. Denne informasjonen
  er ikkje berre viktig for \u00e5 unng\u00e5 \u00e5 gjere inngrep i rettane til andre,
  men er ei unik kjelde til informasjon i innovasjonsprosessar.\\n\\nSaksbehandlinga
  i Patentstyret f\u00f8lgjer forvaltningslova, vanlege forvaltningsrettslege prinsipp
  og lov om Patentstyret og Klagenemnda for industrielle rettar (patentstyrelova).
  S\u00f8knader om industrielle rettar blir behandla etter patentlova, varemerkelova
  og designlova. Noreg har slutta seg til ei rekke internasjonale konvensjonar p\u00e5
  omr\u00e5det som ogs\u00e5 p\u00e5verkar rammene for Patentstyret. Patentstyret
  er partnar i Nordisk Patentinstitutt (NPI), som er ei av granskinsstyresmaktena
  for internasjonale patents\u00f8knader i WIPO. Oppg\u00e5vene Patentstyret utf\u00f8rer
  for NPI, bidreg til \u00e5 halde ved like og vidareutvikle n\u00f8dvendig kompetanse
  og tenestekvalitet p\u00e5 patentomr\u00e5det, til beste for det norske samfunns-
  og n\u00e6ringslivet.\\n\\nI tillegg representerer Patentstyret Noreg i internasjonale
  forum p\u00e5 immaterialrettsomr\u00e5det. Patentstyret bidreg i regelverksarbeid
  som er knytt til industrielle rettar og st\u00f8ttar ulike departement i sp\u00f8rsm\u00e5l
  om immaterielle rettar.\\n\\nPatentstyret er lokalisert p\u00e5 Sandaker i Oslo
  og tek over nye lokale p\u00e5 Helsfyr sommaren 2024.\\n\\nPatentstyret samarbeider
  med andre verkemiddelakt\u00f8rar som Innovasjon Noreg, Noregs forskingsr\u00e5d,
  DOGA og Siva. Som kompetansesenter for immaterielle rettar bidreg Patentstyret til
  at norsk og internasjonalt n\u00e6ringsliv, oppfinnerar, designarar og merkevarebyggjarar
  realiserer potensialet i ideane sine ved at dei gjer rette val n\u00e5r det gjeld
  bruk av industrielle rettar. Dette blir reflektert i visjonen, samfunnssoppdraget,
  verdiane og m\u00e5lbileta.\\n\\nVisjon\\n\\nGjer idear til verdiar\\n\\nSamfunnsoppdrag\\n\\nImmaterialie
  verdiar kan utgjere opptil 90 prosent av verdiane i ein organisasjon\\\\(^1\\\\).
  For \u00e5 sikre og utvikle desse verdiane, slik at dei veks, m\u00e5 ein forvalte
  dei p\u00e5 ein klok og god m\u00e5te.\\n\\nN\u00e5r dei immaterielle verdiane i
  ein organisasjon eller ei bedrift blir forvalta godt, aukar sannsynet for at ein
  lykkast med verdiskaping.\\n\\nSamfunnsoppdraget til Patentstyret handlar derfor
  om \u00e5 vere ein medspelar som legg til rette for god forvaltning av dei immaterielle
  verdiane, slik at l\u00f8nsernd og verdiskaping aukar hos bedrifter og generelt
  i det norske samfunnet.\\n\\nVerdiar\\n\\nKjerneverdiane driv oss framover. Verdiane
  viser korleis Patentstyret skal vere. Dei pregar det daglege arbeidet og vala vi
  gjer. Dette er verdiane v\u00e5re:\\n\\n**Truverdig**\\n- Vi opptrer kompetent,
  etterretteleg og med h\u00f8g integritet.\\n- Vi leverer IPR-tjenester av h\u00f8g
  kvalitet og til rett tid.\\n\\n**Kunderetta**\\n- Vi lyttar til kundane og forst\u00e5r
  behova deira.\\n- Vi er tiljengelige og snakkar og skriv slik at kundane forst\u00e5r
  oss.\\n\\nEngasjert\\n- Vi tek initiativ og er proaktive.\\n- Vi samarbeider og
  hjelper kvarandre.\\n\\nL\u00f8ysingsorientert\\n- Vi s\u00f8kjer og utnyttar moglegheiter
  for forbetring.\\n- Vi tilpassar oss endringar.\\n\\n---\\n\\n\\\\(^1\\\\) [www.visualcapitalist.com/the-soaring-value-of-intangible-assets-in-the-sp-500](http://www.visualcapitalist.com/the-soaring-value-of-intangible-assets-in-the-sp-500)\\n\\nM\u00e5lbileta
  v\u00e5re\\n\\nBanebrytande oppfinningar endrar kvar dagen v\u00e5r. Innovative
  behandlingar reddar liv. Ny teknologi bidreg til ei berekraftig framtid. Og godt
  design l\u00f8ysar store og sm\u00e5 problem. Sikringsutstyret som vernar deg, merka
  du vel i butikken, og seriane du elskar \u00e5 sj\u00e5 p\u00e5 \u2013 alt dette
  er d\u00f8me p\u00e5 idear som er blitt til verdiar b\u00e5de for n\u00e6ringslivet
  og samfunnet, og som vi alle nyt godt av. Dette er verdiar vi m\u00e5 ta vare p\u00e5
  og forvalte godt.\\n\\nPatentstyret bidreg til \u00e5 gjere idear til verdiar.\\n\\nStrategien
  til Patentstyret er skildra gjennom tre m\u00e5lbilete som handlar om \u00e5 skape
  verdiar. Desse tre m\u00e5la gjev oss retning og hjelper oss med \u00e5 prioritere.
  Kvart \u00e5r evaluerer vi korleis vi blir oppfatta av kundar, samfunn, eigarar
  og medarbeidarar. Denne innsikta brukar vi til \u00e5 stadig utvikle og forbetre
  oss.\\n\\nVerdi for kundane \u2013 eit kunden\u00e6rt kompetansesenter\\n\\nDette
  inneber at\\n\u2022 vi forst\u00e5r behova til n\u00e6ringslivet og leverer tenester
  som hjelper kundane i marknadene deira\\n\u2022 vi behandler saker med h\u00f8g
  kvalitet, service og effektivitet\\n\u2022 vi formidlar p\u00e5 ein effektiv og
  god m\u00e5te den innverknaden immaterielle rettar har p\u00e5 verdiskaping\\n\\nVerdi
  for samfunnet \u2013 ein engasjert medspelar i innovasjon og verdiskaping\\n\\nDette
  inneber at\\n\u2022 vi jobbar for at immaterielle rettar er godt kjent og brukt
  i innovasjon og n\u00e6ringsutvikling\\n\u2022 vi er kjende som eit kompetansesenter
  som jobbar for betre bruk av immaterielle verdiar\\n\u2022 vi bidreg til berekraftig
  utvikling i n\u00e6rings- og samfunnslivet\\n\\nVerdi for medarbeidarane \u2013
  ein attraktiv organisasjon og arbeidsplass\\n\\nDette inneber at\\n\u2022 vi styrker
  det inkluderande arbeidsmilj\u00f8et v\u00e5rt og tilbyr ein fleksibel og variert
  arbeidskvardag med utviklingsmoglegheiter til alle\\n\u2022 vi forsterkar kulturen
  v\u00e5r, som er prega av openheit, l\u00e6ring og deling internt og eksternt\\n\u2022
  vi jobbar medvite med \u00e5 bruke ressursane v\u00e5re meir effektivt og berekraftig\\n\\nSentrale
  utviklingstrekk formar oss\\n\\nDet er s\u00e6rleg fire utviklingstrekk som p\u00e5verkar
  korleis Patentstyret skal oppfylle samfunnssopdraget.\\n\\nAuka forventningar\\n\\nPatentstyret
  m\u00e5 utvikle seg i tr\u00e5d med samfunnet, forst\u00e5 behova til kunden og
  responsere stadig raskare. Det vi gjer i dag, er ikkje n\u00f8dvendigvis godt nok
  i morgon. For \u00e5 m\u00f8te auka forventningar fr\u00e5 eigarar, kundar, medarbeidarar
  og samfunnet m\u00e5 Patentstyret utvikle seg som organisasjon.\\n\\nDigitalisering\\n\\nDigitaliseringa
  i samfunnet har enorm p\u00e5verknad p\u00e5 oss. N\u00e5r omverda tek i bruk ny
  teknologi og utviklar nye tenester i h\u00f8gt tempo, skaper det ogs\u00e5 forventningar
  til oss. Patentstyret skal tilby relevante og sikre tenester som effektivt l\u00f8ysar
  problemet til kundane. For \u00e5 skape meir verdi til kundar, samfunn og medarbeidarar
  vil Patentstyret investere vesentleg meir i digital teneste- og kompetanseutvikling.
  Samtidig vil Patentstyret jobbe med \u00e5 gjere norsk data om rettar tilgjengelege
  regionalt og internasjonalt, og s\u00f8rgje for at dei kan distribuerast som opne
  data som alle akt\u00f8rar kan skape verdi fr\u00e5.\\n\\nEksport\\n\\nRegjeringa
  har sett som m\u00e5l \u00e5 auka eksporten utanom olje og gass med 50 prosent innan
  2030. Patentstyret skal vere gode p\u00e5 \u00e5 forst\u00e5 behovet til n\u00e6ringslivet
  og levere tenester som hjelper norsk n\u00e6ringsliv med \u00e5 lykkast i eksportmarknaden
  og med innovasjon som gir styrke til ei meir berekraftig utvikling.\\n\\nGr\u00f8n
  omstilling\\n\\nNoreg er i gr\u00f8n omstilling, og vi m\u00e5 utvikle det n\u00e6ringslivet
  vi har, og skape nye vekstn\u00e6ringar som vi kan leve av framover. Patentstyret
  skal redusere klimagassutsleppet med minst 55 prosent innan 2030. Patentstyret skal
  bli opplevde som ein kompetent medspelar i det gr\u00f8ne skiftet.\\n\\nFigur 1:
  Leiargruppa i Patentstyret\\n\\nVed \u00e5rsslutt omfatta leiargruppa i Patentstyret
  seks avdelingsdirekt\u00f8rar i tillegg til direkt\u00f8ren. Patentstyret hadde
  248 tilsette som var fordelt p\u00e5 241,3 \u00e5rsverk innanfor fagomr\u00e5de
  som juss, teknologi, verksemdsstyring, kommunikasjon og marknadsf\u00f8ring.\\n\\nDirekt\u00f8r\\nKathrine
