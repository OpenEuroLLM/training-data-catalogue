  skal regulerast i same plan.\\n- \u00c5tkomst til dei ulike byggeomr\u00e5da er
  synt i plankartet og kan ved detaljregulering flyttast.\\n- F\u00f8rekomstar av
  r\u00f8dlisteartar skal vurderast og tas omsyn til ved detaljregulering.\\n\\n\u00a7
  3.2 Rekkef\u00f8lgjekrav\\n\\n1) Krav i samband med utbyggingsrekkjef\u00f8lge:\\n\\n1.
  BSA 1 skal vere opparbeidd med heis og nedfart innan igangsettingsl\u00f8yve vert
  gjeven for fritidseining nr. 100.\\n2) Krav i samband med vegar, vann- og avlaupsleidningar
  og teknisk infrastruktur\\n1. Omlegging av veg forbi Heimoen bustadfelt, og breddeutviding
  av vegen mellom FV. 203 og jernbaneundergang, skal vere ferdigstilt f\u00f8r anleggsarbeid
  i omr\u00e5deplan Turufjell eller H29 \u2013 Veneliskogen i arealdelen vert sett
  i gang.\\n2. Gangveg langs Fv. 203 fr\u00e5 Fl\u00e5 stasjon til kryss Heivegen
  og fr\u00e5 kryss Heivegen til byggefelt p\u00e5 Heimoen skal vere bygd f\u00f8r
  igangsettingsl\u00f8yve for fritidseining nr. 100 vert given innan omr\u00e5dereguleringsplanen
  eller H29 \u2013 Veneliskogen i arealdelen.\\n3. Teknisk infrastruktur skal vere
  graven til omr\u00e5det f\u00f8r utbygging\\n4. Renovasjonspunkt BRE skal vere opparbeidd
  med n\u00f8dvendig utstyr f\u00f8r det vert gjeven bruksl\u00f8yve for 1. eining
  i byggesteg 1.\\n5. Veg SKV 22 til Skarsdalen skal vere opparbeidd innan igangsettingsl\u00f8yve
  vert gjeve for fritidseining nr. 100.\\n6. F\u00f8r det vert gjeven IG p\u00e5 eining
  nr. 420 (byggetrinn 1) skal det f\u00f8religge ny trafikkvurdering for trafikkbelastninga
  omr\u00e5det har p\u00e5 rv.7.\\n\\n\u00a7 3.3 Utbyggingsrekkjef\u00f8lge:\\n\\nUtbygging
  av kvart byggeomr\u00e5de kan vurderast ut fr\u00e5 marknaden, men utbygginga innanfor
  omr\u00e5det skal i hovudsak f\u00f8lgje oppsett synt nedanfor. Omr\u00e5da BFR33,
  34 og 40-45 er tidlegare godkjente omr\u00e5de som er teke inn i planen og er ikkje
  med i oppstillinga for byggetrinn.\\n\\n- Byggetrinn 1:   H1-H210, BSA1, BKB-BFT/BFK,
  BKB-BSM/BVA/BL, BRE, SPA1-SPA2 og SPA5\\n- Byggetrinn 2:  BFR1\u20137, BFR14\u201319,
  BFR 24, BFR26-27 og BFR35-38\\n- Byggetrinn 3:  BFR8\u201313, BFR30-32 og SPA4\\n-
  Byggetrinn 4:  BFR20\u201323, BFR25, BFR28-29, BSA2 og SPA3\\n\\n\u00a7 3.4 Kulturminner\\n\\nOm
  det under anleggsarbeid eller annan verksemd i omr\u00e5det dukkar opp automatisk
  freda kulturminne, m\u00e5 arbeidet stoppast ratt, og regional mynde varslast, j.f
  kulturminneloven \u00a7 8. 2.ledd.\\n\\n\u00a7 3.5 Landskapstilpassing og terrenginngrep\\n\\n:.
  .: 2:\\n\\n1. Ved utbygging skal det leggjast vekt p\u00e5 god tilpassing til landskapet
  og terreng. Omr\u00e5de med snaufjell skal haldast fri for hytter.\\n2. Ved tilrettelegging
  av fritidseiningar i terreng brattare enn 1:6 m\u00e5 det settast krav til behandling
  av tomta og utforming av bygnaden for \u00e5 innpasse seg terrenget.\\n3. Skj\u00f8tsel
  av areal som ikkje er byggjeomr\u00e5de skal skje etter skoglova\\n4. Det skal ikkje
  gjerast endringar i terrenget ut over det som er naudsynt for grunn- og terrengarbeid
  for infrastruktur, alpinanlegg, bygd del av tomt, tilkomst og parkering\\n5. Det
  skal leggast vekt p\u00e5 best mogleg terrengtilpassing ved plassering av bygg innanfor
  byggegrensa\\n6. Terrenginngrep i samband med opparbeiding av veg, teknisk infrastruktur
  og parkering skal utf\u00f8rast s\u00e5 sk\u00e5nsamt som mogleg. Vegar skal f\u00f8lgje
  og tilpassast terrenget. Teknisk infrastruktur skal i hovudsak leggjast i k\u00f8yreveg
  for \u00e5 redusere terrenginngrep.\\n7. Masseuttak skal leggjast slik at terrenginngrep
  vert redusert.\\n\\n\u00a7 3.6 Gr\u00f8ne og bl\u00e5 strukturar\\n\\n1. Samanhengande
  gr\u00f8nstruktur skal sikrast ved etablering av korridorar gjennom omr\u00e5de
  og ut til dei st\u00f8rre samanhengande naturomr\u00e5da. Bekkar, tjern og myrdrag
  skal sikrast i desse korridorane. Byggegrense til Olaseterbekken er 50 m. Byggeavstand
  til andre vassdrag med \u00e5rsikker vassf\u00f8ring er 20 meter.\\n2. Naturlege
  flaumvegar skal i st\u00f8rst mogleg grad bevarast, ved behov m\u00e5 areal settast
  av til etablering av nye flaumvegar.\\n3. \u00d8kologisk tilstand i tjern, bekkar
  og elver skal ikkje forringast jf.milj\u00f8m\u00e5l for desse \\\"Regional plan
  for vannforvaltning i vannregion Vest-Viken 2016-2021\\\"\\n4. Trua artar og omr\u00e5der
  med rikt biologisk mangfald skal ikkje byggjast ned.\\n\\n\u00a7 3.7 Utredingskrav\\n\\n1.
  Forhold som f\u00f8rar til endring av v\u00e5tmarker og naturleg drenering.\\n\\n\u00a7
  3.8 Parkering\\n\\n1) Fritids- og turistform\u00e5l/fritidsbyggnad-konsentrert (BKB-BFT/BFK):\\n\\nF\u00f8lgande
  tal skal nyttast for utrekning av parkering i utleigebygg:\\n\\n- 1,5 p-plass for
  einingar mellom 65 m 2 og 85 m 2 .\\n- 1 p-plass for eining under 65 m 2 BRA.\\n-
  2 p-plass for einingar over 85 m 2 .\\n\\nOm det vert bygd felles parkeringsanlegg
  for fleire enn 10 einingar kan krav over reduserast med inntil 25%, dog skal kvar
  eining ha minst 1 biloppstillingsplass.\\n\\n2) Frittliggande fritidsbustader(H1-210
  og BRF1-45):\\n\\nDet skal opparbeidast 2 biloppstillingsplassar \u00e1 18m2 kvar
  pr. eining.\\n\\n3) Skianlegg og aktivitetsomr\u00e5de:\\n\\n- For BSA1 og aktivitetsomr\u00e5de
  G1 skal det opparbeidast minimum 300 p-plassar for dagsparkering p\u00e5 SPA1, SPA2
  og BKB-BFT/BFK\\n- For BSA2 skal det opparbeidast minimum 150 p-plassar for dagsparkering
  p\u00e5 SPA 4\\n- P\u00e5 SAP3 skal det opparbeidast minimum 150 p-plassar for dagsparkering\\n\\n\u00a7
  3.9 Energi og milj\u00f8\\n\\nEN\u00d8K-tiltak og alternative energikjelder skal
  vere ivaretatt if. gjeldande forskriftskrav. Utand\u00f8rs kabel for elektrisitet
  og informasjonsteknologi skal i hovudsak gravast ned.\\n\\n\u00a7 3.10 Universell
  utforming\\n\\nFor alle deler av planen skal det jobbast med tilpassing til universell
  utforming. Det skal vere tilrettelagt mellom hovudinngang(er) og alle plan med inngang
  til bueiningar, til parkeringsetasjar og elles til areal med publikumsretta funksjonar
  og daglege arbeidsoppg\u00e5ver. Gr\u00f8ntomr\u00e5de skal fungere som likeverdig
  rekreasjonsomr\u00e5de for alle brukarar s\u00e5 langt det let seg gjere terrengmessig.
  Det skal leggast vekt p\u00e5 universell utforming i omr\u00e5de som skal kunne
  nyttast av s\u00e5 mange som mogleg p\u00e5 like vilk\u00e5r.\\n\\n\u00a7 3.11 Vatn-
  og avl\u00f8psanlegg\\n\\n1. Det skal lagast leidningsnett for vatn- og avl\u00f8p
  fram til tomtegrense. Ny bygnad skal kople seg til kommunal vassforsyning og avl\u00f8psanlegg
  for planomr\u00e5det. Eksisterande hytter har ogs\u00e5 tilkoplingsplikt dersom
  det skal leggast inn vatn.\\n2. Alle tekniske anlegg som skal overtakast av kommuna
  skal byggast etter Fl\u00e5 kommune sin standard.\\n\\n\u00a7 3.12 Vegar\\n\\n1.
  Stikkrenner og gr\u00f8fter m\u00e5 sikrast tilstrekkeleg dimensjon for noverande
  og framtidige tilh\u00f8ve.\\n\\n:. .: 3\\n\\n2. Kryssing av Olaseterbekken skal
  gjerast med bru. For andre vassdrag i omr\u00e5det m\u00e5 type kryssing vurderast
  ut fr\u00e5 vassf\u00f8ring og flaumsituasjon p\u00e5 staden.\\n3. Der hovudskil\u00f8yper
  kryssar hovudvegar skal dette skje planfritt med kultvert eller bru.\\n\\n\u00a7
  3.13 Flaumfare\\n\\n1. For omr\u00e5da der det er planlagt bygnad og som er dekka
  av faresoner for flaum, eller ligg l\u00e5gare en 0,5 meter over faresonen, skal
  det gjennomf\u00f8rast risikoreduserande tiltak.\\n2. For sidebekkar til Olas\u00e6terbekken
  anbefaler ein \u00e5 nytte sikkerheitsmargin p\u00e5 1 meter mot planlagt bygnad
  over regulert vegetasjonsbelte.\\n3. Bruer og kulvertar som kryssar vassdrag internt
  i planomr\u00e5det skal dimensjonerast for en 200-\u00e5rsflom. Det skal ogs\u00e5
  sikres trygge flaumvegar.\\n4. Mindre bekkar i forbindelse med planomr\u00e5det
  som ikkje er omfatta av rapporten m\u00e5 handsamast tilstrekkeleg med tanke p\u00e5
  flaum. Det skal utarbeidast ein felles flomvurdering for \u00f8vre del av \u00d8stre
  Sl\u00e5ttemyrbekk. Denne skal v\u00e6re p\u00e5 plass f\u00f8r byggesaksbehandling
  av tomter langs vassdraget.\\n5. Ved detaljregulering av skal flaumfaren vurderast
  og det skal visas korleis sikkerhet mot flom er ivareteke.\\n6. Overvatn m\u00e5
  hansamast p\u00e5 ein hensiktsmessig m\u00e5te internt i planomr\u00e5det som ikkje
  gjer auka risiko for flaum og skred for nedstraums bygnad. Opparbeiding av tette
  flater og endring av drensvegar kan potensielt auke flaumvassf\u00f8ringa i bekkane.
  Overvasshandtering skal derfor inng\u00e5 i samband med byggeplan for kvart enkelt
  felt.\\n7. Det er vurdert at fastsatt vegetasjonsbelte langs bekkel\u00f8pa gjev
  tilstrekkeleg sikkerheit mot erosjon mot planlagt bygnad. Om bygnad vert lagt n\u00e6rare
  bekkekant enn 20 meter b\u00f8r erosjonssikring vurderast p\u00e5 byggeplanniv\u00e5.\\n\\nAktuelle
  tiltak er omtala i rapport nummer 17085-01-1 fr\u00e5 Skred As, \\\"Fl\u00e5, Turufjell
  \u2013 flomvurdering\\\".\\n\\n\u00a7 3.15 Andre felles h\u00f8ver\\n\\n1. Det skal
  ikkje nyttast raudt lys i slal\u00e5mbakkar, gatelys og bygningar grunna lysforureining
  som vil vere synleg i fleire mils omkrets.\\n2. Ved etablering av sn\u00f8produksjonsanlegg
  skal det s\u00f8kast om l\u00f8yve. Med s\u00f8knaden skal det f\u00f8lgje ei vurdering
  rundt uttak av vatn.\\n\\n\u00a7 4. BYGG OG ANLEGGSF\u00d8REM\u00c5L\\n\\n\u00a74.1
  BRE - Renovasjonsanlegg\\n\\nRenovasjonsanlegget er felles for fritidsbygnad innanfor
  omr\u00e5deplan. Omr\u00e5det skal til ei kvar tid vere opparbeidd med nok utstyr
  til \u00e5 betene dei einingane som er ferdigstilt innan planomr\u00e5det. Det er
  lov \u00e5 etablere trafo-stasjon og kommunalteknisk anlegg/bygg for vatn i omr\u00e5det.\\n\\n\u00a7
  4.2 BKT \u2013 Kommunalteknisk anlegg\\n\\nDet kan lagast kommunalteknisk anlegg
  og bygg for handtering av vatn og avl\u00f8p.\\n\\n\u00a7 4.3 BSA - Skianlegg\\n\\nOmr\u00e5de
  for skiheis/gondol, l\u00f8yper, turstiar, sykkelstigar, sykkelpark, aktivitetsomr\u00e5de,
  skianlegg, hoppanlegg, friluftsomr\u00e5de, anlegg for kommunalteknikk og andre
  trasear.\\n\\nVegetasjon kan ryddast i alpintrasear og terrengarbeid kan utf\u00f8rast
  for \u00e5 oppn\u00e5 ynskt l\u00f8ypekvalitet. Etter terrengarbeid skal det s\u00e5ast
  for \u00e5 sikre et godt visuelt uttrykk.\\n\\nDet kan setjast opp:\\n\\n- Skiheisar
  med tilh\u00f8yrande bygningar.\\n- Servicebygg med bevertning i samband med heisanlegga\\n-
  Lysanlegg for l\u00f8yper.\\n- Sikringstiltak for alpinl\u00f8yper i form av gjerde
  eller anna stengsle.\\n- Sn\u00f8- og vindskjermar.\\n- Anlegg for sn\u00f8produksjon.
  St\u00f8y fr\u00e5 sn\u00f8produksjon og drift av anlegga er ikkje grunnlag for
  st\u00f8ydempande tiltak mot bygnad og opphaldsareal.\\n\\nEin m\u00e5 ta omsyn
  til bekkar og flauml\u00f8p innanfor omr\u00e5da ved opparbeiding av nedfartar for
  \u00e5 sikre avrenning av overflatevatn. Stikkrenner og gr\u00f8fter m\u00e5 sikrast
  tilstrekkeleg dimensjon for noverande og framtidige tilh\u00f8ve.\\n\\n\u00a74.4
  BKB \u2013 BFT/BFK \u2013 Fritids og turistf\u00f8rem\u00e5l/ fritidsbyggnad-konsentrert\\n\\n1)
  Utnytting og plassering\\n\\n- Det kan oppf\u00f8rast bygg for forretning, n\u00e6ring,
  service, bevertning og einingar til fritidsf\u00f8rem\u00e5l.\\n\\n:. .: 4\\n\\nDato:
  30.03.2017Revidert\\n\\nFl\u00e5 kommune- Plan ID: 2016004\\n\\n:._____________________________________________________________________________________________.:\\n\\n-
  Utnyttingsgrad BYA=50% av tomtas areal, utvendig trafikk- og parkeringsareal skal
  ikkje reknast med i %BYA.\\n- Bygg skal plasserast innanfor byggegrensa.\\n- Bygg
  skal plasserast med omsyn til terreng, og ligge mest mogleg i balanse mellom skjering
  og fylling.\\n\\n2) Utforming og materialbruk i bygg.\\n\\n- Bygnad kan ha flatt
  tak, pulttak eller saltak. Maksimal gesimsh\u00f8gde ved flatt tak 15 meter, pulttak
  16 meter og saltak 12 meter. Maksimal m\u00f8neh\u00f8gde for saltak er 16 meter.
  Alle m\u00e5l er m\u00e5lt over gjennomsnittsniv\u00e5 p\u00e5 terreng.\\n- I fasaden
  p\u00e5 bygningane skal det, i tillegg til konstruksjonsmaterialet (for eksempel
  betong, st\u00e5l) nyttast materiale som tre, glas og/eller stein.\\n- Taktekking
  skal vere torv, tre, skifer eller andre byggjemateriale i matt svart eller gr\u00e5tonar.\\n\\n3)
  Andre h\u00f8ve.\\n\\n- Renovasjon for n\u00e6ringsverksemd skal l\u00f8ysast p\u00e5
  eige tomt.\\n- Parkering skal l\u00f8ysast p\u00e5 eigen tomt, eller i samband med
  parkeringsform\u00e5l i samsvar med f\u00f8resegnenes \u00a7 3.8.\\n\\n\u00a7 4.5
  BFR \u2013 Fritidsbygnad\\n\\nOmr\u00e5da BFR1-BFR45 kan byggjast ut til fritidsbygnad.
  Heile eller delar av eit omr\u00e5de kan detaljerast. Fleire av omr\u00e5da kan
  deltaljerast under eitt. Prinsipp lagt i denne omr\u00e5deplan skal i hovudsak vidaref\u00f8rast
  i detaljplanane, samt at:\\n\\n- Vegar mellom dei ulike utbyggingsf\u00f8rem\u00e5la
  kan etablerast i LNF-omr\u00e5de i samband med detaljreguleringar.\\n- Bygnad skal
  utformast i samsvar med st\u00f8yretningslinje T-1442 (2005).\\n- Det skal utarbeidast
  VA-planar for delomr\u00e5da\\n- I omr\u00e5da BFR32- BFR34 skal hytter som vert
  lagt i terreng over 855 moh. gjeld f\u00f8lgjande:\\n\\n* Lengderetninga p\u00e5
  hytta f\u00f8lgje h\u00f8gdekotene\\n\\n* Bygningar skal ha saltak, max m\u00f8neh\u00f8gde
  er 5,5 meter over planert terreng\\n* M\u00f8ner skal ligge i hytta si lengderetning,
  tverrm\u00f8ne er berre tillate som mindre tak over inngangsparti.\\nI omr\u00e5de
  BFR30 gjeld f\u00f8lgjande:\\n* Lengderetninga p\u00e5 hytta f\u00f8lgje h\u00f8gdekotene.\\n*
  M\u00f8ner skal ligge i hytta si lengderetning, tverrm\u00f8ne er berre tillate
  som mindre tak over inngangsparti.\\n\\n\u00a7 4.6 H \u2013 Fritidstomter\\n\\n1)
  Utnytting og plassering\\n\\n- Kvar tomt kan ha inntil tre bygg, dvs. eit fritidshus,
  eit anneks og eit uthus/garasje\\n\\nBygg skal plasserast med omsyn til terreng,
  og ligge mest mogleg i balanse mellom skjering og fylling.\\n\\n- P\u00e5 tomter
  med gjennomsnittleg stigning over 1:6 skal lengderetninga p\u00e5 hytta f\u00f8lgje
  h\u00f8gdekotene.\\n\\n- P\u00e5 tomter med gjennomsnittleg stigning mellom 1:6-1:4
  skal hytta trappast i terrenget, eller ikkje vere breiare enn 6 meter.\\n- P\u00e5
  tomter med gjennomsnittleg stigning over 1:4 skal hytta trappast i terrenget, eller
  ikkje vere breiare enn 5 meter. Ved pulttak p\u00e5 tomter med stigning over 1:4
  skal tak falle i same retning som terrenget\\n- Utnyttingsgrad for kvar tomt kan
  vere maksimalt 236 m2 BYA pr. tomt. Innanfor dette arealet kan summen av fritidshus
  og anneks vere p\u00e5 inntil 150 m2. Annekset kan ikkje vere st\u00f8rre enn 50
  m2. Uthus/garasje kan vere p\u00e5 inntil 50 m2. Det er krav om to parkeringsplassar
  \u00e1 18 m2 pr. fritidsbustad som vert rekna med i utnyttingsgraden for tomta.\\n\\n2)
  Utforming og materialbruk i bygg.\\n\\n- Fritidshus kan ha flatt tak, pulttak eller
  saltak. Maksimal gesimsh\u00f8ge ved flatt tak er 4 meter og ved pulttak 6 meter.
  Maksimal m\u00f8neh\u00f8gde for saltak er 6 meter. Alle m\u00e5l er m\u00e5lt over
  gjennomsnittsniv\u00e5 p\u00e5 terreng.\\n- I fasaden p\u00e5 bygningane skal det
  nyttast materiale som tre, glas og/eller stein, bortsett i fr\u00e5 grunnmur.\\n-
  Taktekking skal vere jord/torvtak, tre, skifer eller papp i svart/gr\u00e5tonar.\\n\\n:.
  .: 5\\n\\nDato: 30.03.2017 Revidert\\n\\n-\\n\\nFl\u00e5 kommune- Plan ID: 2016004\\n\\n:._____________________________________________________________________________________________.:\\n\\n-
  Anneks og uthus/garasje kan ha flatt tak, pulttak eller saltak. Maksimal gesimsh\u00f8ge
  ved flatt tak 3,5 meter og pulttak 5 meter. Maksimal m\u00f8neh\u00f8gde for saltak
  er 5 meter. Alle m\u00e5l er m\u00e5lt over gjennomsnittsniv\u00e5 p\u00e5 terreng.\\n-
  Anneks og uthus/garasje skal vere tilpassa hovudeininga.\\n\\n3) Andre h\u00f8ve.\\n\\n-
  Etter s\u00f8knad til kommuna er det tillate \u00e5 gjerde inn inntil 200 m2 av
  tomta, under f\u00f8resetnad av at det vert nytta sauesikkert gjerde av naturmateriale.
  Grind skal svinge utover.\\n- Parabolantenne skal ikkje monterast over takflata,
  farga skal vere lik hytta.\\n- Vindskier skal ha same farge som hovudfarga p\u00e5
  hytta.\\n- Vegfyllingar og skjeringar kan ligger innover tomtene. Ved opparbeiding
  av tomtene m\u00e5 ein ta omsyn til eventuelle fyllingar og skjeringar. Bratte skjeringar
  og fyllingar skal sikrast med gjerde. Fyllingar skal s\u00e5ast til og plantas,
  eventuelt lagast som st\u00f8ttemur.\\n- Lyskjelde utvendig skal vere skjerma, for
  \u00e5 minimere lysforureining og blending.\\n- Flaggstang er ikkje tillate\\n-
  Badestamp/jacuzzi er det kun tillate \u00e5 sette opp etter s\u00f8knad/utsleppsl\u00f8yve
  fr\u00e5 kommuna.\\n- H210 er ei eksisterande tomt.\\n\\n\u00a7 4.7 BKB-BSM/BVA/BL\\n\\nVed
  uttak av massar over 10000m3 fastmasse m\u00e5 det utarbeidast detaljreguleringsplan
  for omr\u00e5det.\\n\\n1) Masseuttak BSM:\\n\\n- I omr\u00e5det sett av til steinbrot
  og masseuttak kan det gjerast uttak, knusing, transport og lagring av steinmassar.\\n-
  Sprenging og knusing av steinmasser skal konsentrerast til maks 3 gonger i \u00e5ret
  og ha ei varighet p\u00e5 maks 30 dagar pr gong.\\n\\n- Driftstida for knuseverk
  er 7-19 p\u00e5 kvardagar. Graving, lasting og transport av masser kan skje p\u00e5\\n\\nkvardagar
  heile \u00e5ret.\\n\\n- St\u00f8y fr\u00e5 verksemda skal ligge innanfor rammer
  omtala i \\\"Retningslinje for st\u00f8y i arealplanlegging\\\"(T1442).\\n- Samla
  uttak av mineralforekomstar over 10 000m3 krev driftskonsesjon fr\u00e5 Direktoratet
  for mineralforvaltning. S\u00f8knad om konsesjon skal innehalde driftsplan.\\n-
  Driftsplanen skal fastsette utforming og rekkef\u00f8lge for gjennomf\u00f8ring
  av uttaket.\\n- Uttaksomr\u00e5det skal vere sikra slik at det er utilgjengelig
  for allmenta med gjerder og skilt.\\n- F\u00f8r utsprenging tar til skal avdekkingsmasse
  gravast av.\\n- Etter at uttaket er avslutta skal omr\u00e5det ha ei trygg terrengmessig
  utforming som er s\u00e5 lik eksisterande omkringliggjande terreng som mogleg. Det
  vil seie at brotkantar m.m. ikkje m\u00e5 ha brattare helling enn 1:2. Alle skr\u00e5ningar
  skal revegeterast.\\n- Dei midlertidige veggane skal formast slik at dei passar
  s\u00e5 godt inn i terrenget som mogleg og ha skr\u00e5ningar/fyllingar som er s\u00e5
  slakke at en unng\u00e5r erosjon og problem for beitedyr.\\n- N\u00e5r masseuttaket
  er avslutta skal heile omr\u00e5det ha f\u00f8rem\u00e5l renovasjonsanlegg.\\n-
  Masseuttaket skal v\u00e6re avslutta og omr\u00e5de ferdig opparbeidd innan 60 \u00e5r
  etter at reguleringsplanen er godkjent.\\n\\n2) Avl\u00f8psanlegg BVA:\\n\\n- Det
  kan etablerast n\u00f8dvendige bygg og anlegg for behandling av avl\u00f8p.\\n\\n3)
  Lager BL:\\n\\n- Det kan etablerast n\u00f8dvendige bygg/lager og uteomr\u00e5de
  for verksemd innanfor planen.\\n\\n\u00a7 4.8 LNF2_26 \u2013 Omr\u00e5de for spreidd
  fritidsbygnad\\n\\n- Det kan byggjast ei bueining (eitt kj\u00f8kken) pr. tomt.
  Kvar tomt kan ha tre bygg, dvs. Eitt fritidshus, eitt anneks og eitt uthus/garasje\\n-
  Utnyttingsgraden er 186 m2 BYA pr. tomt. Innanfor dette arealet kan summen av fritidsbustad
  og anneks vere p\u00e5 inntil 120 m2. Fritidsbustaden kan maks vera 100 m2, annekset
  kan ikkje vere st\u00f8rre enn 30 m2. Uthus kan vere p\u00e5 inntil 30 m2. Om det
  er veg fram til tomta, er det krav om to parkeringsplassar \u00e0 18 m2 pr. fritidsbustad.
  Avstand mellom fritidshus og anneks skal vera maks. 3 meter.\\n- Bygningar skal
  leggjast i balanse mellom skjering og fylling. Fylling skal ikkje overstige 1,0
  meter og kan ikkje strekkje seg lenger enn 3 meter fr\u00e5 yttervegg.\\n- M\u00f8neh\u00f8gde,
  form og materialbruk skal samsvare med omkringliggande bygg. Som regel skal det
  nyttast naturmateriale og m\u00f8rke jordfarger i fasadar.\\n- Det er ikkje tillate
  med flaggstong, spir eller klokket\u00e5rn.\\n\\n:. .: 6\\n\\n- Det er tillate \u00e5
  gjerde inn inntil 400 m2 av tomta, inklusiv bygg, under f\u00f8resetnad av at det
  vert nytta sauesikkert gjerde. Grind skal svinge utover.\\n- Det kan f\u00f8rast
  fram infrastruktur som veg, straum, breiband, vatn, avl\u00f8p osb. Det er ei f\u00f8rutsetting
  at dette vert planlagt og utf\u00f8rt med tanke p\u00e5 minst mogleg terrenginngrep
  pg hogst av skog\\n\\n\u00a7 5. GR\u00d8NSTRUKTUR\\n\\n\u00a7 5.1 G - Gr\u00f8nstruktur\\n\\nOmr\u00e5de
  for gr\u00f8nstruktur. Innanfor omr\u00e5det kan det lagas l\u00f8yper/stigar for
  tur-, sykkel- og ski. Det kan f\u00f8rast opp tilh\u00f8yrande bygg for desse aktivitetane.
  Det kan ogs\u00e5 lagast gr\u00f8fter til \u00e5 grave ned teknisk infrastruktur,
  samt etablerast n\u00f8dvendige bygg for vatn og avl\u00f8p. Det skal ikkje gjerast
  tiltak som hindrar framkomme.\\n\\n\u00a7 5.2  GKG \u2013 Kombinerte gr\u00f8ntstrukturform\u00e5l\\n\\nGKG1
  og 4 er sklitrase for alpin. Omr\u00e5de GKG 2 og 3 er trase langrennsl\u00f8ype.
  Innanfor omr\u00e5det kan det lagas l\u00f8yper/stigar for tur-, sykkel- og ski.
  Det kan ogs\u00e5 lagast gr\u00f8fter til \u00e5 grave ned teknisk infrastruktur.\\n\\n\u00a7
  6. SAMFERDSLE OG TEKNISK INFRASTRUKTUR\\n\\n\u00a7 6.1 Generelt\\n\\nFyllingar og
  skjeringar skal revegeterast/s\u00e5ast, dette m\u00e5 skje seinast f\u00f8rste
  vekstsesong . Ny botnvegetasjon skal harmonere med eksisterande vegetasjon. St\u00f8rre
  fyllingar kan lagast som st\u00f8ttemur for \u00e5 ta opp h\u00f8gdeforskjellar.
  Alle nye vegar skal halde seg innanfor stigningskravet i skogsbilvegklasse III p\u00e5
  1:10.\\n\\nInnan frisiktline markert i plankartet er det ikkje tillate med bygg,
  konstruksjon, terreng eller vegetasjon som stikk meir enn 0,5 m over vegarealet
  som frisiktlina gjeld for.\\n\\n\u00a7 6.2 SKV - K\u00f8yrevegar\\n\\nHovudvegar:
  Veg SKV 1 og 3. Regulert breidde 12 meter. Vegbreidda er 6 meter inkl. 0,5 meter
  skulder p\u00e5 kvar side. Teknisk areal er 3,0 meter p\u00e5 kvar side.\\n\\nInternvegar:
  Veg SKV 2, 4-48. Regulert breidde 10 meter. Vegbreidda er 5 meter inkl. 0,25 meter
  skulder p\u00e5 kvar side. Teknisk areal er 2,5 meter p\u00e5 kvar side.\\n\\n\u00a7
  6.3 SVG - Annan veggrunn \u2013 tekniske anlegg\\n\\nOmr\u00e5de for skjering/fylling,
  samt tekniske anlegg i samband med vegen\\n\\n\u00a7 6.4 SV - Veg\\n\\nFellesvegar:
  Veg SV1-5. Regulert breidde 5 meter. Vegbreidda er 5 meter inkl. 0,5 meter skulder
  p\u00e5 kvar side.\\n\\n- SV1 er felles for tomt H77-H78\\n- SV2 er felles veg for
  tomt H87-H90\\n- SV3 er felles veg for tomt H142-H145\\n- SV4 er felles veg for
  tomt H157-H158\\n- SV5 er veg for tomt H209\\n- SV6 er veg for tomt H210\\n\\n\u00a7
  7. LANDBRUKS, NATUR- OG FRILUFTSF\u00d8REM\u00c5L\\n\\n\u00a7 7.1 L - Landbruksform\u00e5l\\n\\n-
  Det skal ikkje gjerast tiltak som hindrar framkomme.\\n- Tekniske anlegg som trafoar,
  fordelingsskap, brunnar, fangdammar, leidningstrasear osv. kan lagast innanfor omr\u00e5det.
  Bygningar i samband med tekniske anlegg skal skjermast med vegetasjon.\\n- Innanfor
  omr\u00e5det kan det lagast l\u00f8yper for tur-, sykkel- og ski. Det kan f\u00f8rast
  opp tilh\u00f8yrande bygg og anlegg for desse aktivitetane.\\n\\n:. .: 7\\n\\nDato:
  30.03.2017Revidert: 21.08.2017\\n\\n- Vegar mellom dei ulike utbyggingsf\u00f8rem\u00e5la
  kan etablerast i LNF-omr\u00e5de i samband med detaljreguleringar.\\n\\nSkj\u00f8tsel
  av areal som ikkje er byggjeomr\u00e5de skal skje etter skoglova. Elles gjeld dei
  generelle reglane for bygging i LNF-omr\u00e5de.\\n\\n\u00a7 8. HENSYNSONE I REGULERINGSPLAN\\n\\n\u00a7
  8.1 H110 - Sikringssone\\n\\nH110 Nedslagsfelt drikkevatn: Sikringsone for drikkevasskjelde\\n\\n\u00a7
  8.2 H120 - Sikringssone\\n\\nH120 Omr\u00e5de for grunnvassforsyning: Sikringsone
  for boring etter grunnvatn. Det er konsesjons- og utgreiingsplikt for denne type
  aktivitet etter vassressurslova, det m\u00e5 derfor s\u00f8kast om l\u00f8yve.\\n\\n\u00a7
  8.3 H140 - Sikringssone\\n\\nH140 Frisikt: I frisiktsona er det ikkje tillate med
  bygg, konstruksjon, terreng eller vegetasjon som stikk meir enn 0,5 m over vegarealet
  som frisiktsona gjeld for.\\n\\n\u00a7 8.4 H320 - Faresone\\n\\nH_320 Flaumfare:
  Faresone for flaum. Tiltak som omfattar flaumsona er list opp i \u00a7 3.16 Flaumfare.\\n\\n\u00a7
  8.5 H370 - Faresone\\n\\nH_370 H\u00f8gspenningsanlegg: Faresone for h\u00f8gspent
  gjennom planomr\u00e5det. Innan omr\u00e5det merka hensynsone H_370, m\u00e5 utbygging
  etablerast med avstand til kraftleidning slik at krav etter regelverk under el-tilsynlova
  (LOV-2009-06-19-103) forvalta av Direktoratet for samfunnsikkerheit og beredskap
  vert overhalde.\\n\\n\u00a7 8.6 H560 - Angitt hensynsone\\n\\nH560_1 Bevaring naturmilj\u00f8:
  Regulert for naturtypelokalitet Sl\u00e5ttemyrtjern. Det skal ikkje gjerast tekniske
  inngrep eller hogst innanfor omr\u00e5det. I samband med anleggverksend skal omr\u00e5det
  merkast godt, og det skal ikkje settast maskiner eller utstyr p\u00e5 eller i n\u00e6rleiken
  av hensynsona.\\n\\nH560_2 Bevaring naturmilj\u00f8: Regulert for tjern og eit belte
  p\u00e5 20 m fr\u00e5 kant p\u00e5 tjern i tillegg. All oppf\u00f8ring av byggverk
  innan sona er forbode.\\n\\nH560_7 \u2013 H560_8 Bevaring naturmilj\u00f8: Regulert
  for bekkekl\u00f8ft i eit belte p\u00e5 20 m til kvar side av bekk. Det er lov \u00e5
  krysse bekkekl\u00f8ft med veg, kryssing skal forg\u00e5 med bru. All annan oppf\u00f8ring
  av byggverk innan sona er forbode.\\n\\nH560_9 Bevaring naturmilj\u00f8: Regulert
  som buffersone for naturtypelokalitet Sl\u00e5ttemyr i eit belte p\u00e5 20 m rundt
  lokaliteten.\\n\\n\u00a7 8.7 H570 - Angitt hensynsone\\n\\nH570_1- H570_2 Bevaring
  kulturmilj\u00f8: \\\"Hensynsonene omfatter et bufferareal for det automatisk fredete
  kulturminnet ved Olasetra og et sammenhengende omr\u00e5de omkring de 11 automatisk
  fredete kulturminnene ved G\u00f8ffeputten. Innenfor H570_1 og H570_2 er det ikke
  lov \u00e5 kj\u00f8re med tunge kj\u00f8ret\u00f8y, lagre anleggsutstyr eller byggematerialer,
  eller gj\u00f8re inngrep i grunnen. Skogsdrift skal utf\u00f8res sk\u00e5nsomt,
  slik at markdekket og grunnen ikke tar skade.\\\"\\n\\n\u00a7 8.8 H730 - B\u00e5ndleggingsone\\n\\nH730_1-
  H730_14 B\u00e5ndlagt etter kulturminneloven: \\\"Hensynsoner for automatisk fredete
  kulturminner - et jernvinneanlegg ved Olasetra og et jernvinneanlegg samt 9 kullgroper
  ved G\u00f8ffeputten fra yngre jernaldermiddelalder {700-1400 e.kr.)- b\u00e5ndlagt
  etter kulturminneloven. Det er ikke tillatt \u00e5 sette i gang tiltak som er egnet
  til \u00e5 skade, \u00f8delegge, grave ut, flytte, forandre, tildekke, skjule eller
  p\u00e5 annen m\u00e5te utilb\u00f8rlig skjemme det automatisk fredete kulturminnet
  eller framkalle fare for at dette kan skje. Dette gjelder kulturminnet og en sikringssone
  p\u00e5 5 meter utenfor kulturminnets synlige yttergrense.\\\"\\n\\n:. .: 8\"",
  "\"Saksprotokoll i fellesnemnda - 18.09.2019\\n\\nM\u00f8teprotokoll fr\u00e5 m\u00f8te
  i fellesnemnda 18.juni 2019 vart godkjend utan merknader.\"", "\"SAKSLISTE\\n\\na)
  Godkjenning av innkalling\\n\\nInnkallinga vart samr\u00f8ystes godkjent. Det var
  registrert 56 r\u00f8ystef\u00f8re medlemmar blant dei 59 framm\u00f8tte.\\n\\na)
  Godkjenning av sakslista\\n\\nP\u00e5 den andre sida kom det fram argument om at
  \u00e5rsm\u00f8tet i 2017 ga styret fullmakt til \u00e5 bestemme, og difor er saka
  behandla rett i forhald til vedtektene.\\n\\nDet kom inn kommentar om sak 3 i sakslista,
  Kinn Skulehus burde komme p\u00e5 eit ekstraordin\u00e6rt \u00e5rsm\u00f8te, d\u00e5
  det er ei for omfattande sak og ta p\u00e5 eit vanleg \u00e5rsm\u00f8te.\\n\\nVed
  avstemming blei det stemt 4 mot og resterande for. Sakslista godkjent.\\n\\nb) Val
  av m\u00f8teleiar\\n\\nPer \u00d8yvind S\u00f8rb\u00f8 vart samr\u00f8ystes valt
  som m\u00f8teleiar.\\n\\nc) Val av to m\u00f8tesekret\u00e6rar\\n\\nAnders Myklebust
  og Karen Nilsen vart samr\u00f8ystes valt som m\u00f8tesekret\u00e6rar.\\n\\nd)
  Val av to til \u00e5 skrive under protokollen\\n\\nBengt Solheim-Olsen og Elisabeth
  Solheim vart samr\u00f8ystes valde til \u00e5 skrive under m\u00f8teprotokollen.\\n\\ne)
  Godkjenning av \u00c5rsmelding 2019, saksvedlegg 1\\n\\nDet blei forklart om at
  det ikkje vert teikna nokon ny avtale om Grytadalsbu og at denne hytta no vert stengt
  og tatt ut av FT sin portef\u00f8lje av hytter.\\n\\nDet kom frem ei endring til
  \u00e5rsmeldinga: styret har i \u00e5r hatt 8 styrem\u00f8te, og ikkje 7 som det
  st\u00e5r. Det vart retta ei stor takk til styret fr\u00e5 styreleiar, og at \u00e5ret
  hadde vert krevjande og at Kinn hytta hadde medf\u00f8rt mykje arbeid.\\n\\nDet
  vart og fortalt om den store dugnadsinnsatsen som vart nedlagt p\u00e5 hyttene Bl\u00e5brebu
  og Gjengnabu i sommar. Ei stor takk til alle som deltok p\u00e5 dette.\\n\\nAstrid
  Eliassen retta ei takk til turleiarane og drog fram nokre eldskjeler som har leia
  over 30 turar. Det kom sp\u00f8rsm\u00e5l om det vil bli mogleg \u00e5 f\u00e5 opp
  eit bookingssytem gjennom DNT. Fleire lokale turlag gjer dette, og det gjer det
  enklare \u00e5 planlegge. Styret tar med innspelet vidare.\\n\\n\u00c5rsmeldinga
  vart samr\u00f8ystes vedtatt.\\n\\nf) Godkjenning av \u00c5rsrekneskap 2019, saksvedlegg
  2\\n\\nDet kom sp\u00f8rsm\u00e5l om kva som ligg i \u00abbundne midlar\u00bb. Sunniva
  forklarer at dette er ein 17 \u00e5r gammal formel, og at midlane berre kan nyttast
  til hyttene.\\n\\n\u00c5rsrekneskapen vart samr\u00f8ystes vedtatt.\\n\\ng) Godkjenning
  av budsjett og handlingsplan for 2020, saksvedlegg 3 og 4\\n\\nBudsjettet blei samr\u00f8ystast
  vedtatt.\\n\\nVi stemte over budsjettet etter gjennomgang av Kinn saka.\\n\\nDet
  kom innspel om at feiring av Gjegnabu 30 \u00e5r m\u00e5 leggast til i handlingsplanen.\\n\\nDet
  kom ogs\u00e5 sp\u00f8rsm\u00e5l om merking i Gr\u00f8ndalen. Dette er med i dugnadsprogrammet
  til Bl\u00e5brebu\\n\\nHandlingsplanen blei samr\u00f8ystes vedtatt med dei kommentarar
  som nemnast over.\\n\\nREFERAT \u00c5RSM\u00d8TE 2019\\n\\nTorsdag 28. november
  kl. 18.00 \u2013 20.00\\n\\nh) Fastsetting av losjiprisar for 2020, saksvedlegg
  5\\n\\nForslag til vedtak:\\n\\nFlora Turlag f\u00f8lgjer DNT sine prisar og reglar
  p\u00e5 hyttene.\\n\\nStyret sitt framlegg til vedtak vart samr\u00f8ystes vedtatt.\\n\\ni)
  Fastsetting av turavgift for 2020\\n\\nFlora Turlag f\u00f8lgjer dei prisar som
  har vore tidlegare.\\n\\nForslag til vedtak:\\n\\nHeildagsturar: Medlemmar gratis
  og ikkje-medlemar kr. 100.\\n\\nBarn under 15 \u00e5r gratis.\\n\\nTysdags- og onsdagsturar:
  Inga avgift utover faktiske transportkostnadar.\\n\\nTransport kr. 30 til sj\u00e5f\u00f8r
  ved fellesk\u00f8yring. Over 20 km kr. 40\\n\\nStyret sitt framlegg til vedtak vart
  samr\u00f8ystes vedtatt.\\n\\nj) Kinn Skulehus, saksvedlegg 6 og 7\\n\\nFlora Turlag
  kj\u00f8per Kinn skulehus med tomt for sum p\u00e5lydande kr. 700 000,-. \u00c5rsm\u00f8tet
  gjev styret mandat til \u00e5 signere kj\u00f8psavtale med Kinn Sokner\u00e5d gjeldande
  Kinn skulehus.\\n\\nForslag til vedtak:\\n\\nEtter ein god diskusjon blei styret
  sitt framlegg til vedtak samr\u00f8ystes vedtatt. Under har vi oppsummert kva for
  argumentasjon og sp\u00f8rsm\u00e5l som kom fram.\\n\\nDet kom sp\u00f8rsm\u00e5l
  om Flora Turlag m\u00e5 betale eigedomsskatt p\u00e5 Skulehuset p\u00e5 Kinn? Det
  m\u00e5 betalast kring 7-8000 kr i \u00e5ret i eigedomsskatt. Det skal ogs\u00e5  betalast
  kommunale avgifter. Sokner\u00e5det har hatt kring kr 20000 i \u00e5ret i utgifter
  som og inkluderer forsikring. Hytta har gitt inntekt p\u00e5 46000 kr i 2019.\\n\\nS\u00f8knad
  om st\u00f8nad fr\u00e5 Thonstiftinga er avsl\u00e5tt. Vi ventar p\u00e5 svar fr\u00e5
  Gjensidigestiftelsen. p\u00e5 st\u00f8tte s\u00f8knad. Vi har f\u00e5tt 380000 kr
  i st\u00f8tte fr\u00e5 andre. Kj\u00f8pesummen er 700000 kr (sj\u00e5 sakspapir
  som var vedlagt innkallinga).\\n\\no Dag Eliassen:\\n\\nDet er vanskeleg \u00e5
  forst\u00e5 at Flora Turlag m\u00e5 kj\u00f8pe hytta til en s\u00e5 h\u00f8g pris
  av Sokner\u00e5det som i si tid har f\u00e5tt den gratis.\\n\\nSp\u00f8r om kva
  for aktivitetar hytta p\u00e5 Kinn skal dekke? Han f\u00e5r svar at det blant anna
  kan vere temahelger der ute, med yoga, mat, turar p\u00e5 \u00f8ya, aktivitetar
  av ulikt slag og anna.\\n\\nDet er ogs\u00e5 problem med kloakk og drikkevatn og
  mykje vedlikehaldsarbeid som m\u00e5 gjerast. Hytta har ingen utsikt til sj\u00f8,
  og den er heller ikkje spektakul\u00e6r nok til \u00e5 v\u00e6re spesielt attraktiv.
  I tillegg driver finns Kinn Gjestehus der ute og det blir feil \u00e5 v\u00e6re
  direkte konkurrent til dei. Han synes ogs\u00e5 at aktivitetane som nemnast kan
  ein f\u00e5 til andre plassar.\\n\\nDet er mange uavklarte sp\u00f8rsm\u00e5l ved
  saka. Er det ikkje andre fornuftige m\u00e5tar \u00e5 bruke pengane p\u00e5? Kinn
  Skulehus skulle vore diskutert p\u00e5 et ekstraordin\u00e6rt styrem\u00f8te, det
  hadde gitt betre tid og meir informasjon om saka kunne komet fram.\\n\\nFT f\u00e5r
  no eit oppussingsprosjekt som og m\u00e5 omregulerast til overnatting. Det kan gje
  ekstra kostnader.\\n\\nVi kan gjerne vore til stades p\u00e5 Kinn, men det finns
  betre alternativ enn \u00e5 kj\u00f8pe skulehuset. Vi m\u00e5 konkurrere med Kinn
  Gjestehus og viser til kommentaren Gjestehuset la igjen p\u00e5 innlegget han skreiv
  p\u00e5 Facebook.\\n\\no Eivind Hauge:\\n\\nEin fordel med skulehuset er at det
  ligger langs vegen. Han har sm\u00e5 born og det er den einaste hytta som er lett
  tilgjengeleg. Alle m\u00e5lgrupper skal kunne bruke hytta, ogs\u00e5 r\u00f8rslehemma.
  Den passar for b\u00e5de dagstur/helgetur/midtveketurar.\\n\\nHytta er ogs\u00e5
  lett tilgjengeleg for turistar / andre med svak \u00f8konomi.\\n\\nKinn blir ein
  stor turistattraksjon og det b\u00f8r vere plass til b\u00e5de Kinn Gjestehus og
  Skulehuset. Det er stor dugnadsvilje p\u00e5 lang sikt. Hytta kan ogs\u00e5 brukast
  som tilfluktsstad/matpakke/kvile stad. Vedr\u00f8rande kostnader trur han nokon
  ting m\u00e5 betalast for, men man kan s\u00f8ke fleire stiftingar. Han trur vi
  klarer alle prosjekta turlaget har p\u00e5 agendaen, utan at det g\u00e5r utover
  noko anna. Det kan ogs\u00e5 v\u00e6re lettare \u00e5 f\u00e5 med n\u00e6ringslivet
  n\u00e5r hytta ligger lett tilgjengeleg. FT har inntekter p\u00e5 overnatting utan
  s\u00e6rleg profilering i dag. Kinn kjem til \u00e5 g\u00e5 opp og fram, og han
  trur ingen av hyttene kjem til \u00e5 ha problem med bes\u00f8kstal.\\n\\no Siv
  Merete Stadheim:\\n\\nDet er og gjort sponsoravtale med Sparebaken Vest som vil
  st\u00f8tte prosjekt p\u00e5 kysten.\\n\\nI forhold til \u00f8konomien: Det har
  vore fellessamling p\u00e5 Sandane der generalsekret\u00e6r i DNT fortalte at det
  no satsast p\u00e5 kysten i DNT nasjonalt.\\n\\nDet er og inng\u00e5tt avtale med
  XXL Bygg kor ein kan f\u00e5 gode rabattar p\u00e5 materiell. Det gjev\\n\\nDet
  er ogs\u00e5 gjort analyse av hytteturar b\u00e5de p\u00e5 sosiale medium og p\u00e5
  internett. Det f\u00f8rste s\u00f8keordet er DNT. Noko som seier at det er ein enorm
  merkevare.\\n\\nl\u00e5gare vedlikehaldskostnader.\\n\\nEin m\u00e5 skape turomr\u00e5de
  der turfolk ferdast.\\n\\no \u00d8yvind Kleiven:\\n\\nDet viktige her er l\u00e5gterskeltilbodet
  for folk med sm\u00e5 born og som er d\u00e5rleg til beins. Fjellhyttene har h\u00f8gare
  terskel. P\u00e5 Kinn er det greitt turterreng. Han er, tross motf\u00f8restillingane
  i dag for Kinn Skulehus.\\n\\no Knut Magne Nesse\\n\\nKyst-pilegrimsleden har gjort
  utgreiing om kvar den beste staden p\u00e5 kysten er. Kinn kom best ut i Sogn og
  Fjordane, her var eit tilbod om overnatting viktig, b\u00e5truter og kyrkje med
  vertskap + butikk. Det vil vere mange steg tilbake om ein g\u00e5r bort fr\u00e5
  prosjektet med Kinn skulehus no. F T f\u00e5r kj\u00f8pt ei bra hytte til god pris.
  Det er viktig \u00e5 eige for \u00e5 f\u00e5 til ei god drift i tida som kjem.\\n\\nDet
  er 10 \u00e5r sidan dei starta arbeid med pilegrimsled fr\u00e5 Kinn til Selje.
  Halvparten av brukarane kjem fr\u00e5 Tyskland.\\n\\no Siri Solbakken\\n\\nI tillegg
  er det milj\u00f8perspektivet rundt problemstillinga: Kva vil skje med skulehuset
  om nokon andre tar over? Det er i alle h\u00f8ve sikkert at. og det er milj\u00f8messig
  positivt.\\n\\nDet finnast eit strategidokument nasjonalt som seier at ein b\u00f8r
  fokusere p\u00e5 l\u00e5gterskelturar og bevaring av kultur. Vi burde bevare skulehuset
  som noko historisk. Historikken til skulehuset er ein positiv faktor som Flora Turlag
  kan spele p\u00e5. Eit anna moment er milj\u00f8perspektivet, det er meir milj\u00f8venleg
  \u00e5 renovere eit gamalt bygg enn \u00e5 bygge ei ny hytte p\u00e5 Kinn. Flora
  Turlag vil oppgradere huset n\u00f8kternt.\\n\\no Kjetil Tveranger\\n\\nHar styret
  r\u00e5d til alle de sakene dei legger fram i budsjettet? (slik som sikringsbu,
  kj\u00f8p av Kinn og kajakknaust). Viktig \u00e5 sj\u00e5 alt i samanheng. Kva vil
  ei sikrings bu p\u00e5 Gjegnabu koste?\\n\\no Siri Solbakken\\n\\nDet er kjempeinteresse
  for Kinn. Men kyrkja har vore stengt s\u00e5 det har vore vanskeleg med marknadf\u00f8ring
  for Fjord Kysten. Gjestehuset er noko heilt anna. Skulehuset er ein tryggheit, om
  ein til d\u00f8me skulle m\u00f8te d\u00e5rleg v\u00e6r, er det ein plass \u00e5
  komme i le og \u00e5 ete nista si. Det er to forskjellige tilbod, og ein n\u00e5r
  ulike m\u00e5lgrupper. Trur ikkje det er noko problem \u00e5 fylle begge stadene
  n\u00e5r ein f\u00e5r opp meir marknadsf\u00f8ring.\\n\\no Anne Leversund\\n\\nEin
  b\u00f8r v\u00e6re i dialog med Gry p\u00e5 Kinn Gjestehus. Ein har felles m\u00e5l
  om \u00e5 utvikle Kinn som turm\u00e5l. Ser p\u00e5 hyttetilbodet med Gjegnabu og
  Bl\u00e5brebu som toppidrett, medan Skulehuset er breiddeidrett.\\n\\no Heidi Humlest\u00f8l
  Aasen\\n\\n- Saksopplysing fr\u00e5 Dag: I hyttestrategidokumentet fr\u00e5 2017
  stod det at sikringsbu p\u00e5 Gjegnabu kunne koste opp mot 2 millionar.\\n\\nTrur
  ikkje det er n\u00f8dvendig med 2 millionar til sikringsbu. Ei sikringsbu er eit
  tilflukt ved ein n\u00f8dssituasjon, og einaste kravet er at det m\u00e5 v\u00e6re
  vedomn.\\n\\n- Dag kommenterte her at sikringsbu var diskutert av \u00ab\u00c5lfoten
  Landskapsvernomr\u00e5de\u00bb og her vart det sagt at sikringsbua skal kunne huse
  like mange menneskjer som det er soveplassar i hovedhytta.\\n\\no Karl Petter Myklebust\\n\\nDet
  er kjekt med positivitet rundt Kinn. Det er alle typar folk som dreg ut dit. Er
  sj\u00f8lv ofte der ute og g\u00e5r og det er spesielt der ute. Hytta har mogelegheiter,
  samt \u00f8konomi og driftige folk. Det eine alternativet utelukkar ikkje det andre.
  Vi m\u00e5 klinke til no, det er ein god moglegheit vi ikkje m\u00e5 kaste vekk.\\n\\nk)
  Lagerplass for utstyr til kajakkgruppa\\n\\n\u00c5rsm\u00f8tet gjev tyret mandat
  til \u00e5 oppnemne ein komit\u00e9 som skal utarbeide planar for etablering/bygging
  av kajakknaust. Styret skal utarbeide planer for etablering/bygging av kajakknaust.
  Forslaget skal leggjast fram p\u00e5 \u00e5rsm\u00f8te 2020.\\n\\nForslag til vedtak:\\n\\nKjetil
  Tveranger kommenterte at vi b\u00f8r v\u00e6re i dialog med Kystmuseet om dei har
  ledig areal som kan leigast.\\n\\nStyret dsitt framlegg til vedtak blei samr\u00f8ystast
  vedtatt med kommentaren som nemnast over.\\n\\nl) Referat fr\u00e5 styrem\u00f8ta\\n\\n\u00c5rsm\u00f8tet
  gjev styret mandat til \u00e5 avgjere korleis handsame denne saka. D\u00e5 styremedlemmar
  opplev oppg\u00e5ver og ansvar som tidkrevjande vil det vere avgjerande at sittande
  styre til ei kvar tid f\u00e5r avgjere om det skal brukast tid p\u00e5 offentleggjering
  av referata.\\n\\nForslag til vedtak:\\n\\nDag Eliassen kommenterer at ein ikkje
  er ute etter heile referatet, men vedtaket og at det nemnast kva som er dr\u00f8fta.
  Dette er for \u00e5 f\u00e5 innsikt i kva som er diskutert i styrem\u00f8ta.\\n\\nStyret
  sitt framlegg til vedtak blei samr\u00f8ystes vedtatt.\\n\\nm) Val av\\n\\n- To
  styremedlem\\n- Leiar\\n- To varamedlem\\n- Eit medlem til valnemnda\\n- Revisor\\n\\nValnemnda
  si innstilling:\\n\\nVal av styre:\\n\\n\u00d8vrige styremedlem og revisor var samr\u00f8ystes
  valt.\\n\\nBengt Solheim-Olsen vart samr\u00f8ystes valt som styreleiar.\\n\\nVal
  av valnemnd:\\n\\nDag Eliassen\\n\\nikkje p\u00e5 val\\n\\nSiv Merete Stadheim\\n\\nikkje
  p\u00e5 val\\n\\nHeidi Humlest\u00f8l Aasen\\n\\nnyval for to \u00e5r\\n\\nn) Val
  av to utsendingar til Sogn og Fjordane Turlag sitt \u00e5rsm\u00f8te\\n\\nDet nye
  styret f\u00e5r fullmakt til \u00e5 utpeike nokon fr\u00e5 styret n\u00e5r dette
  er konstituert.\\n\\nEtter \u00e5rsm\u00f8te takka Anders Myklebust av Heidi Humlest\u00f8l
  Aasen styreleiar i Flora Turlag med ei overnatting p\u00e5 ei av v\u00e5re hytter.
  Arnfrid Bergheim g\u00e5r ut av styret og vart takka av, ogs\u00e5 med ei overnatting
  p\u00e5 ei av v\u00e5re hytter. Jens Batt Jansen g\u00e5r ut av styret som varamedlem
  og f\u00e5r ogs\u00e5 overnatting som takk fort sitt bidrag i styret.\\n\\nArnfrid
  las namna p\u00e5 vinnarane fr\u00e5 trekking av turb\u00f8ker og Turtrimmen 2018.
  Resultata og namnelista vert lagt ut p\u00e5 heimesida til turlaget, samt delt p\u00e5
  Facebook.\\n\\nArnfrid orienterte om Turtrimmen 2019 som har hatt stor auke i deltakarar
  med totalt 59 i 2019.  og heile 12 har tatt alle 15 postane. Liste over vinnarar
  vert lagt ut p\u00e5 nettsida. Neste \u00e5rs Turtrim er snart klar.\\n\\nKveldens
  f\u00f8redragshaldar var H\u00e5kon \u00c5svang. Han har nyleg vore ein av f\u00e5
  nordmenn p\u00e5 eit av verdas farlegaste fjell, Annapurna. Han heldt eit spennande
  innlegg om den vellukka turen p\u00e5 Annapurna,  og tidlegare turar.\\n\\nFlor\u00f8,
  16. desember 2019\\n\\nKaren S. Nilsen -m\u00f8tesekret\u00e6r-\\n\\nAnders Myklebust
  -m\u00f8tesekret\u00e6r-\\n\\nBengt Solheim-Olsen -signatur m\u00f8teprotokoll-\\n\\nElisabeth
  Solheim -signatur m\u00f8teprotokoll-\"", "\"Informasjon til elevar og f\u00f8resette  -
  stenging av skular i VLFK\\n\\nAlle vidareg\u00e5ande skular i Vestland vert stengde
  fr\u00e5 og med fredag 13. mars. Dette gjeld i f\u00f8rste omgang for to veker.
  Elevane vil f\u00e5 nettbasert undervisning i denne perioden. M\u00e5let er \u00e5
  halde oppe den faglege progresjonen til elevane.\\n\\nDette er eit sv\u00e6rt omfattande
  og inngripande tiltak. Samstundes veit vi at det er stor forst\u00e5ing for at vi
  m\u00e5 ta v\u00e5r del av samfunnsdugnaden i denne ekstraordin\u00e6re situasjonen
  for \u00e5 hindre smitte.\\n\\nFylkesdirekt\u00f8ren vil oppmode til ein felles
  innsats der vi utfordrar oss sj\u00f8lve med nye m\u00e5tar \u00e5 gjennomf\u00f8re
  oppl\u00e6ringa p\u00e5.\\n\\nNettundervisning.\\n\\n* Skulen vil gjere prioritering
  i fag med sikte p\u00e5 best mogleg undervisning, vurdering  og gjennomf\u00f8ring.
  Mellom anna vil avsluttande fag ha h\u00f8g prioritet. Det vil bli gjennomf\u00f8rt
  vurdering i faga.\\n* Skulen vil legge til rette for nettundervisning fr\u00e5 m\u00e5ndag
  av. Skulen vil legge ut n\u00e6rmare informasjon p\u00e5 ITSL (tidlegare Hordaland)
  eller TEAMS (tidlegare Sogn og Fjordane)\\n* Deler av undervisninga kan verte lagt
  opp som sj\u00f8lvstendig studiearbeid\\n* Vi ber alle om \u00e5 f\u00f8lge med
  p\u00e5 informasjon om \u00abKorona\u00bb og smittevernr\u00e5d p\u00e5 folkehelseinstituttet
  si side fhi.no\\n* Alle m\u00e5 syte for at ein har b\u00f8ker og pc (lader)  for
  \u00e5 kunne gjennomf\u00f8re skulearbeidet heimefr\u00e5 og vere tilgjengeleg for
  undervisning. Det er tilr\u00e5deleg med headset og mikrofon til nettundervisninga.\\n*
  Det er ogs\u00e5 viktig \u00e5 f\u00f8lge med p\u00e5 informasjon p\u00e5 skulen
  sine informasjonskanaler\\n\\nYFF / programfag i bedrift  -  utplassering.\\n\\n*
  Denne oppl\u00e6ringa kan halde fram der det er i orden for b\u00e5de bedrift/praksisstad
  og elev.\\n\\nElevar med s\u00e6rskilte behov i eigne tilbod/tilrettelagte grupper\\n\\nFor
  desse gruppene vert det fortl\u00f8pende vurdert om ein kan halde fram med oppl\u00e6ringa
  p\u00e5 skulen. Dette vil skulane komme tilbake med informasjon om direkte til f\u00f8resette.\\n\\nBj\u00f8rn
  Lyngedal Fylkesdirekt\u00f8r oppl\u00e6ring og kompetanse\"", "\"REGLAR FOR BRANNTRYGGLEIK
  V\u00c5RMARKNADEN\\n\\nAVSTANDAR CAMPING\\n\\nAv omsyn til smittefaren ved brann
  m\u00e5 ingen del av campingeininga (campingbil, campingvogn, telt) plasserast n\u00e6rare
  annan eining enn 4 meter. Personbil som ikkje kjem i f\u00f8lgje med kj\u00f8pt
  campingplass, skal parkerast p\u00e5 gjesteparkering.\\n\\nFor kvar 1200 m2 med
  campingeiningar, skal det vere eit seksjonerings-belte p\u00e5 minst 8 meter. Dette
  beltet skal hindre ein brann i \u00e5 smitte over, samt at det skal gje sl\u00f8kkjemannskap
  fri veg.\\n\\nCampingvogner skal plasserast med draget tilgjengeleg for rask tilkopling
  til bil ved evt. evakuering.\\n\\nR\u00d8YK-/GASSVARSLAR OG SL\u00d8KKJEUTSTYR\\n\\nAlle
  utstillarar og campingeiningar skal vere utstyrt med r\u00f8yk-/gassvarslar og eit
  pulverapparat (min. 6 kg ABE). Dette er f\u00f8rst og fremst for din eigen tryggleik.  Ein
  r\u00f8ykvarslar vil varsle deg tidsnok til at du har moglegheit til \u00e5 komme
  deg i sikkerheit. Kontroll kan bli gjennomf\u00f8rt.\\n\\nBRENNBART AVFALL/PAPP
  OG PAPIR\\n\\nDet er viktig at det ikkje blir lagra brennbart avfall, spesielt papp
  og papir, inne p\u00e5 eller rundt stand- og campingplass. Vi har kjeldesortering
  og milj\u00f8stasjonar, desse skal nyttast til \u00e5 halde standplass og campingplass
  ryddig til ei kvar tid.\\n\\nVED BRANNTILL\u00d8P\\n\\nAlle till\u00f8p til brann
  skal straks meldast p\u00e5 tlf. 110. Opplys namnet ditt, kvar du er og kva som
  har hendt. Varsle dei som er truga av brann og evakuer dei. Iverksett slokkingstiltak.\\n\\nBRUK
  AV OPEN ELD\\n\\nDet er ikkje tillate med open eld p\u00e5 plassen utan godkjenning.
  Grilling kan berre skje ute og etter at marknaden er stengt for kvelden. Det skal
  vere minst 1 meter avstand fr\u00e5 telt-/campingvogn til grill. Forlat aldri ein
  gl\u00f8dande grill. Eingongsgrill er ikkje lovleg p\u00e5 Dyrskuplassen. Bring
  restane av grillkolet til eigen avfallsdunk merka \u00abAvfall fr\u00e5 grill\u00bb
  eller \u00abBrannfarleg avfall\u00bb.\\n\\nPROPANLEKKASJE.\\n\\nDersom du oppdagar
  propanlekkasje, skal hovudkrana straks stengast og reguleringsventilen koplast fr\u00e5
  flaska. Stans all bruk av open eld. Lokaliser lekkasjen; er den fr\u00e5 flaska,
  transporter den vekk fr\u00e5 campingplassen. Varsle brannvesenet.\\n\\nBrann\\n\\n110\\n\\nLegevakt
  - akutt / ambulanse 113 / 116117 Politi 112 /02800\\n\\nKontakt under arrangementet:\\n\\nAlle
  sp\u00f8rsm\u00e5l i samband med reglane rettast til Utstillaransvarleg eller Vakt-
  og beredskapsleiar\"", "\"Minneord: \u00abMen Jesus svara: \u00abEg seier deg, Peter:
  Hanen skal ikkje gala i natt f\u00f8r du tre gonger har nekta at du kjenner meg.\u00bb
  Luk 22,32.\"", "\"\u00c5 Vestland, Vestland\\n\\n\u00c5 Vestland, Vestland!  n\u00e5r
  eg ser deg slik med fagre fjell og fjord og tronge vik, det stig i all sin venleik
  stort og vilt og atter m\u00f8ter meg so mjukt og mildt.\\n\\nOg gleda str\u00f8ymer
  i meg still og stor med glans av bj\u00f8rkeli og bl\u00e5e fjord Og i meg sj\u00f8lv
  eg kjenner dypter av den stille skogen og det store hav.\\n\\nMin lette b\u00e5t
  ein solblank kveld eg ror, sj\u00e5 fjell og himmel sym p\u00e5 stille fjord og
  djupe dalen med sitt gr\u00f8ne fang, som skin av lauv og blom fr\u00e5 li og vang.\\n\\nSj\u00e5
  skuggane som kliv dei kvasse fjell lik dagsens timar t\u00f8yer seg mot kveld Det
  sveiper seg om tind og tronge dal eit draumesl\u00f8r av sommarnatti sval.\\n\\nTekst:
  Tore \u00d8rjas\u00e6ter\\n\\nMelodi: Sigurd F\u00f8rsund\"", "\"Styre\u00e5rsmelding
  2018\\n\\nGudbrandsdalsmusea AS har som form\u00e5l \u00e5 drive museumsverksemd
  i samsvar med selskapet sine vedteker og andre styringsdokument.\\n\\nSelskapet
  si selskapsadresse er i Sel kommune med fylgjande avdelingar\\n\\n- Lesja avd. 3a/Lesja
  bygdemuseum, marknadsansvarleg og avd. 9/bygningsvern\u00e5dgjevar\\n- Dovre avd.
  3b/Einbustugu og 5b/Opplandsarkivet\\n- V\u00e5g\u00e5 avd. 4/jutulheimen, Sc-d/Opplandsarkivet
  inkl. folkemusikkarkivet for norddalen\\n- Lom avd. 2a/Lom bygdemuseum, 2b/Stavkyrkjesenter,
  10/Norsk Fjellmuseum og samlingsansvarleg\\n- Skj\u00e5k avd. 5a/Opplandsarkivet\\n-
  Sel avd. 1b/bergverksutstilling, industriregistrator\\n- Nord-Fron avd. 5e/Folkemusikkarkivet
  for midt- og s\u00f8rdalen/Opplandsarkivet og 7/Gudbrandsdal Krigsminnesamling\\n-
  S\u00f8r-Fron avd. 1a/adm, 1d/Tusen\u00e5rsstad, 8/Pilegrimsenter og 11/gardsbutikk\\n-
  Ringebu avd. 5f/Midtdalsarkivet/Opplandsarkivet og 6/Stavkyrkjeutstillinga\\n\\nStyret
  hadde i 2018 5 styrem\u00f8te (2017: 6) og handsama 39 saker (44). Det var ordin\u00e6r
  generalforsamling 24. mai i Ullinsvin, V\u00e5g\u00e5.\\n\\nMuseet hadde i 2018
  71 325 (73 744) registrerte bes\u00f8k.\\n\\n\u00c5rsresultatet for 2018 var kr.
  -305 305 (-281 328). \u00c5rsresultatet dekkast av annan eigenkapital.\\n\\nBankinnskott
  var pr. 31.12.18 kr. 4 820 150 (5 244 230). Selskapet har ein eigenkapital pr. 31.12.2018
  p\u00e5 kr. 1 880 914 (2 186 119).\\n\\nStyret meiner at \u00e5rsrekneskapen gjev
  eit rettvist bilete av eigedelar og gjeld, finansielle stilling og resultat for
  selskapet. I samsvar med rekneskapslova \u00a7 3-3 stadfestar vi at forutsetting
  for fortsatt drift er lagt til grunn ved utarbeiding av rekneskapen.\\n\\nAv 13
  (13) fast tilsette pr. 31.12.2018 er det 9 menn og 4 kvinner (tilsvarende i \u00e5rsverk
  5,7 og 4). Av desse er 7 i 100 % stilling: 3 menn og 4 kvinner. Det er ikkje sett
  i gang s\u00e6rskilte likestillingstiltak gjennom \u00e5ret.\\n\\nStyret har 4 menn
  og 3 kvinner (jf. 1. personleg vara: 3 menn og 4 kvinner).\\n\\nDei tilsette har
  ein framm\u00f8teprosent p\u00e5 98,9 % (95,3). Det har ikkje vore uhell med personskade
  i 2018. Arbeidsmilj\u00f8et er godt. Museet er medlem i Gudbrandsdal Bedriftshelsesteneste/Frisk
  og er IA-bedrift (avslutta ordning i 2018).\\n\\nStyret kjenner ikkje til at selskapet
  forureinar det ytre milj\u00f8. Det er innf\u00f8rt kjeldesortering der det er mogeleg.
  Det er oppfordra til samk\u00f8yring til m\u00f8te og bruk av off. kommunikasjon.\\n\\nLesja
  21. februar 2019\\n\\nStyret for Gudbrandsdalsmusea AS\\n\\nJan Reinert Rasmussen\\nLars
  Tungen\\nSigne Thoresen Rolstad\\nTorveig Dahl\\ndirekt\u00f8r/sekr. styret\\nBerit
  E Meiningen\\nTrond Ole Haug\\nBard Hanem\\nBenedicte F Furulund\"", "\"Fitjar kommune\\n\\nM\u00f8teprotokoll\\n\\nUtval:\\n\\nFormannskapet\\n\\nM\u00f8testad:
