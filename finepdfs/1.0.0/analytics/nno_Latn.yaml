  ei ramme p\u00e5 omlag kr. 200 000,- av eigenkapital.\\nd. El-innebandy-gruppa m\u00e5
  leggast ned grunna manglande aktivitet. Det st\u00e5r att midlar p\u00e5 konto i
  bank.\\ni. Forslag fr\u00e5 styret: kr. 50 000,- vert overf\u00f8rt til \u00c5rdal
  FTU.\\n9. Vedta budsjett\\n10. Utdeling av utmerkingar\\n11. Val\"", "\"Fortun-Granfasta
  konsesjonen og p\u00e5verknaden p\u00e5 friluftslivet i og rundt Hurrungane.\\n\\nHurrungane
  er eit mytisk fjellomr\u00e5de som med sine spisse tindar, har vore ein viktig arena
  for norsk fjellsport. \u00abTindesportens vugge\u00bb blir omr\u00e5det her ofte
  kalla fordi nettopp  den alpine klatringa her til lands starta her. Dette ved dei
  store bestigningane som blei gjort her p\u00e5 slutten av 1800 talet, med bestigninga
  av Store Skagast\u00f8lstind gjort av W.C. Slingsby (1876) som den st\u00f8rste
  bragden, men der ogs\u00e5 Nordmenn ogs\u00e5 etter kvart gjorde store bestigningar
  b\u00e5de av tindar og ulike ruter.  Klatringa her har alltid satt folk p\u00e5
  pr\u00f8ver grunna fjellas bratte karakter og veirets lunefulle svingningara. Hurrungane
  blei ogs\u00e5 nytta til trenings arena for st\u00f8rre ekspedisjonar til b\u00e5de
  Alpane og jamvel Himalaya.\\n\\nHurrungane`s flotte utsj\u00e5ande tiltrekker seg,
  ikkje berre tinderanglarara og friluftsfolk, men jamvel ogs\u00e5 den generelle
  turist. Dette fordi fjella her er unike i nordisk samanheng n\u00e5r det kjem til
  utsj\u00e5ande og den alpine karakteren. Bratte sider, hengande brear og ville fossar
  bere omr\u00e5der preg av, eller ivertfall gjorde det det. Mange av elvane som kjem
  ut fr\u00e5 dalf\u00f8ra som vender mor nord, Styggedalen, Helgedalen, Skagadalen
  og Ringsdalen er alle p\u00e5verka av kraftutbygginga Fortun-Granfasta. Her er self\u00f8lgeligt
  merker i naturen fr\u00e5 utbygginga, men det det mest visuelle er nok alikavel
  mangelen p\u00e5 fritt rennande vatn i elvane. Dette er synlegt for den \u00abvanlege\u00bb
  turist langs vegen (riksveg 55), samt turistane som velger \u00e5 bu p\u00e5 dei
  ulike overnattingsstadane langs vegen. Men st\u00f8rst p\u00e5verknad er det nok
  for den delen av folket som aktivt brukar Hurrungane som rekreasjon. Dette gjelder
  spesielt i dalf\u00f8ret Skagadalen, der det er ei (i dag, sommarstid) minimal vassf\u00f8ring
  i elva. Skagadalen er den mest brukte dalf\u00f8re d\u00e5 den f\u00f8rer inn til
  foten av Store Skagast\u00f8lstinden, som er eit gjevt m\u00e5l for mange. Dalf\u00f8re
  er og attraktivt for vanlege fotturistar. Dette inntrykket av manglande vatn i elva
  i starten av dalen (og turen innover Skagadalen) blir styrka idet ein kjem til bekkinntaket
  til elva, og ser og h\u00f8yrer elvas krefter. F\u00f8leslen av \u00e5 vere i fri
  natur blir d\u00e5 ber\u00f8va. Dette gjev ogs\u00e5 seg utslag i kvaliteten for
  den enkelte brukaren av dette dalf\u00f8re. Ein opps\u00f8ker naturen for og p\u00e5
  naturens premissar, men blir m\u00f8tt av storsamfunnets umettelege krav.\\n\\nMange
  f\u00f8ringsbedrifter har arbeid i Hurrungane sommarstid. Nordesguidene, Breogfjell
  samt Fjellsentralen er dei st\u00f8rste akt\u00f8rane med rundt 3-400 gjester i
  Hurrungane sommarstid. Dei her bedriftene lever av \u00e5 tilby turar i fri natur.
  Forrutan dei, er det ogs\u00e5 ein rekke andre akt\u00f8rar som opererar i omr\u00e5det
  (Dnt, m.fl). I tillegg her er det ogs\u00e5 eit stort antall som kjem p\u00e5 eigenhand
  for \u00e5 bedrive friluftsliv i omr\u00e5de. S\u00f8ken etter det ur\u00f8rte er
  ein viktig faktor for denne gruppa og. Trenden er at denne formen for aktivitet
  vil auke i framtida og.\\n\\nEin auke av minstevassf\u00f8ringa av vatn sommarstid
  i  elvane i og rundt Hurrungane vil dempe noko av den visuelle skaden som er gjort
  her i omr\u00e5det, gje meir liv i i naturen og dempe inntrykket av bortf\u00f8ring
  av vatnet i bekkeinntaka. Dette vil ikkje f\u00f8re elvane tilbake i sin opprinnelege
  stand, men vil vere med p\u00e5 \u00e5 rette opp igjen noko av f\u00f8lelsen til
  \u00e5 vere ute i fri natur igjen for dei mange brukarane av omr\u00e5det\\n\\nMvh\\n\\nSigurd
  Felde\\n\\nForum for natur og friluftsliv\"", "\"RV 13 Utfordringar\\n\\nM\u00f8te
