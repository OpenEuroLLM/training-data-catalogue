  straffekeast.\\n\\nMANDATORY\\n\\nOB p\u00e5 og over sti til h\u00f8gre.\\nKast
  vidare med eit straffekast der disk gjekk ut.\\n\\n10 Par 3\\n\\nOB i vatn. Kast
