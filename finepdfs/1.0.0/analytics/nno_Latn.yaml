  av V10 skal det etablerast utvida vegskulder som skal nyttast som gangsone og utformast
  i samsvar med f\u00f8resegnsomr\u00e5de #7.\\n\\n2.6 F\u00f8r det blir gitt bruksl\u00f8yve
  for omr\u00e5de I17, skal badeomr\u00e5de BA1 oppgraderast og parkeringsplass P2
  vere ferdigstilt. Det skal utarbeidast plan for omr\u00e5det BA1 som skal godkjennast
  av kommunen.\\n2.7 F\u00f8r iverksetjing av tiltak i omr\u00e5de VEST (I1 og I2)
  skal det gjennomf\u00f8rast ei arkeologisk utgraving av det automatisk freda kulturminna,
  id 161145 (#1).  F\u00f8r iverksetjing av tiltak i omr\u00e5de SB1 og F1 og F2 skal
  det gjennomf\u00f8rast ei arkeologisk utgraving av dei automatiske freda  kulturminna
  id 170156 (#2), 170158 (#3) og 170160 (#4). F\u00f8r iversetjing av tiltak aust
  for SPB 1 i omr\u00e5de BASIS skal det gjennomf\u00f8rast ei arkeologisk utgraving
  av dei automatisk freda kulturminna id 161163 (#5), 161199 (#6).\\n2.6 F\u00f8r
  det blir gitt bruksl\u00f8yve for Traformatorstasjon innanfor I5, skal barriere
  mot veg innanfor AVT vere ferdigstilt.\\n\\n3.0 Bygningar og anlegg (pbl \u00a7
  12\u20135\u20131)\\n\\n3.1 Generelt\\n\\n3.1.1 H\u00f8ge skjeringar/fyllingar i
  planomr\u00e5det som kan vere til fare for trafikantar eller andre som ferdast i
  omr\u00e5det, skal av utbyggar sikrast med rekkverk eller sikringsgjerder. Gjerder
  h\u00f8gre enn 2 m skal godkjennast av kommunen.\\n3.1.2 Det er ikkje h\u00f8ve
  til \u00e5 etablere tiltak eller verksemd som kan kome i konflikt med dei kommunale
  hovudvassleidningane som er vist p\u00e5 plankartet. Sj\u00e5 punkt 9.4.1.\\n3.1.3
  Bygningane i planomr\u00e5det skal gjevast funksjonell form og fasade, og skal plasserast
  i h\u00f8ve til kvarandre p\u00e5 ei slik m\u00e5te at bygningsmassen p\u00e5 kvart
  delomr\u00e5de gir eit heilskapleg inntrykk.\\n3.1.4 Ubebygd areal p\u00e5 dei einskilde
  eigedomane skal gjevast ei heilskapleg utforming. Opplagsplassar/lagerareal vert
  tillate innanfor oppmerka omr\u00e5de.\\n3.1.5 Trafokioskar eller andre mindre bygg
  for tekniske anlegg kan oppf\u00f8rast i byggeomr\u00e5da.\\n3.1.6 Ved s\u00f8knad
  om tiltak skal det dokumenterast at det p\u00e5 tomta er sikra plass til f\u00f8lgjande
  tal oppstillingsplassar for bil og sykkel pr. 100 m2 BRA: Industri og verkstad:
  1 biloppstillingsplass, 0,2 sykkelplass Lager: 0,5 biloppstillingsplass, 0,2 sykkelplass\\n3.1.7
  Bygningsvoluma i byggeomr\u00e5da skal prim\u00e6rt ha line\u00e6r retning mot sj\u00f8en.
  Ved oppf\u00f8ring av store bygningsvolum med samanhengande fasadeflater i byggeomr\u00e5da,
  skal desse fasadeflatene oppdelast i seksjonar som tek i vare dei prinsippa for
  m\u00e5lestokk og volum som er lagt til grunn i retningsliner for utbygging av omr\u00e5det.\\n\\n3.1.8
  Alle bygg skal plasserast innanfor byggegrensene som er vist p\u00e5 planen. Det
  kan tillatast at areal mellom byggegrenser og offentleg trafikkf\u00f8rem\u00e5l
  vert nytta til parkeringsplass, mindre bygg for tekniske anlegg o.l. dersom dette
  ikkje medf\u00f8rer trafikkfarlege tilh\u00f8ve. Der byggegrense ikkje er vist,
  ligg byggegrense i form\u00e5lsgrense.\\n3.1.9 Alle utfyllingar i sj\u00f8en skal
  avsluttast som ordna steinmur eller plastra fylling.\\n3.1.10 All sprenging under
  vatn skal skje med tildekking av boblegardin for \u00e5 redusere trykkb\u00f8lger.\\n3.1.11
  Ved utfylling i sj\u00f8 skal enten brukast oppsamlingskj\u00f8rt/lenser eller vaska
  steinmassar for \u00e5 redusere spreiing av finpartiklar. Behov for siltgardin skal
  vurderast.\\n3.1.12 I byggeomr\u00e5da skal st\u00f8yproduksjon fr\u00e5 verksemd
  og aktivitetar ikkje medf\u00f8re at grensene for utand\u00f8rs st\u00f8y etter
  retningslinjer i T-1442 fr\u00e5 Milj\u00f8verndepartementet i eksisterande og planlagte
  bustadomr\u00e5de vert overskridne.\\nF\u00f8lgjande grenseverdiar for utand\u00f8rs
  st\u00f8y i bustadomr\u00e5da vert lagt til grunn:\\n* Gjennomsnittleg d\u00f8gnaktivitet
  dag, Lden = 55 dB p\u00e5 dagtid kl. 07-19\\n* Gjennomsnittleg d\u00f8gnaktivitet
  natt, Lnight = 45 dB p\u00e5 natt kl. 19-07\\n3.1.13 Lysmaster skal plasserast slik
  at dei gjev minst mogeleg blendingseffekt for omkringliggande bustadomr\u00e5der.\\n3.1.14
  Omfattande sprengingsarbeid i randsonene skal ikkje skje i perioden mars-juli, av
  omsyn til yngletid for raudlista fugleartar.\\n\\n3.2 Industri (I1 \u2013 I20)\\n\\n3.2.1
  For omr\u00e5de I1-I2 og I5-I20 kan det oppf\u00f8rast bygningar for industri-,
  lager- og/ eller handverksverksemder med tilh\u00f8yrande anlegg. Kontorbygningar
  med tilknytning til verksemda i omr\u00e5det kan tillatast. Tillate tomteutnytting
  er fastsett i prosent bebygd areal, slik: BYA=60%.\\n3.2.2 I omr\u00e5de I5 skal
  det ikkje oppf\u00f8rast bygningar s\u00f8r for byggegrense.\\n3.2.3 Bygningar kan
  oppf\u00f8rast med maksimal gesimsh\u00f8gd over ferdig planert terreng slik: For
  omr\u00e5de I1-I2, I6, I19, I20: 15 meter For omr\u00e5de I7, I8 , I11 og I13 :
  9 meter For omr\u00e5de I5, I9 og I10: 12 meter For omr\u00e5de I12, I14-I18: 17,5
  meter\\n3.2.4 For omr\u00e5da I13, I14 og I18 er det tillate med uttak av stein.
  For I13 skal planeringsniv\u00e5 etter ferdig masseuttak ikkje vere l\u00e5gare
  enn kote +19. For I14 og I18 skal planeringsniv\u00e5 etter ferdig masseuttak ikkje
  vere l\u00e5gare enn kote + 22 meter (same niv\u00e5 som Rv5). Etter avslutta masseuttak,
  kan det oppf\u00f8rast bygningar for industri-, lager- eller handverksverksemd.
  Kontorbygningar med tilknyting til verksemda i omr\u00e5det kan tillatast. Tillate
  tomteutnytting, fastsett i prosent bebygd areal, er BYA=40%. Bygningar kan oppf\u00f8rast
  med maksimal gesimsh\u00f8gd kote + 28 for omr\u00e5de I13 og + 34 for I14 og I18.
  Takform skal tilpassast bygningsvolum, og skal sj\u00e5ast i samanheng med nabobygningar.\\n3.2.5
  I omr\u00e5da er det ikkje tillate \u00e5 f\u00f8re opp bustadbygg. Kommunen kan
  gjere unntak for vaktmesterbustad o.l med tilknytning til verksemder i omr\u00e5det.\\n3.2.6
  Innanfor omr\u00e5da kan areala delast etter samla plan for kvart delomr\u00e5de,
  tilpassa behovet til den einskilde verksemd. Parsellane skal ha mest mogeleg regelmessig
  form. Det vert i denne samanheng vist til prinsippa for tomtedeling/-seksjonering
  i retningslinene til planen. Kommunen skal godkjenne planane for deling av delomr\u00e5da..\\n3.2.7
  I byggeomr\u00e5da som vender mot sj\u00f8, kan areala mot sj\u00f8en nyttast til
  private kaier under\\n\\nf\u00f8resetnad av at dette vert godkjent av lokale hamnestyresmakter/
  kommunen. Mindre justeringar utanom form\u00e5lsgrensa kan tillatast for bygging
  av kaier.\\n3.2.8 Tillate planeringsniv\u00e5 for kvart delomr\u00e5de er slik:
  For omr\u00e5de I1-I2, I17, I19, I20: Minimum kote + 3,0 For omr\u00e5de I5, I15-
  I16: Minimum kote + 2,22. For omr\u00e5de I6-I12: Mellom kote +2,22 og + 20 Planeringsniv\u00e5
  skal tilpassast toppdekke for regulert offentleg k\u00f8yreveg, slik at gode overgangar
  og tilstrekkeleg fall sikrast. Mot veg skal planeringsniv\u00e5 ikkje vere h\u00f8gare
  enn toppdekke for k\u00f8yrevegen.\\n3.2.9 For omr\u00e5de I1, I17, I19 og I20 skal
  det kunne byggast kai mot nord.\\n3.2.10 Fylling i sj\u00f8 og bygging av kaianlegg
  krev l\u00f8yve fr\u00e5 kommunen.\\n3.2.11 Alle nye kaier skal tilpassast planeringsniv\u00e5
  p\u00e5 tilst\u00f8ytande areal, jfr punkt 4.2.10\\n3.2.12 For omr\u00e5de I14 og
  I18 skal det utarbeidast samla plan for kvart delomr\u00e5de. Omr\u00e5da ligg skredutsett
  til. Omsynssoner for skredfare er utarbeidd p\u00e5 bakgrunn av NGIrapportar 2006
  og 2009, samt vurdering av Russenes geologi 2012, jfr Omsynsone Ras og skred, punkt
  9.2. F\u00f8r det kan gjevast l\u00f8yve til tiltak, skal det dokumenterast at skred-
  og rasproblematikk er ivaretatt, og korleis sikringstiltak er tenkt l\u00f8yst.
  Dokumentasjon skal utf\u00f8rast av fagkunnig geolog. Byggegrensa p\u00e5 25 meter
  mot riksvegen markerer ogs\u00e5 inngrepsfri sone, jfr kap 10 Byggegrense.\\n3.2.13
  I omr\u00e5de I14 skal det sikrast tilfredstillande vegtilkomst for traktor og hengar
  for grunneigar av gbnr. 26/2 opp til omr\u00e5de F4. Grunneigaren skal kunne ta
  ut virke av eigen skog i F4.\\n3.2.14 For omr\u00e5de I1-I4, skal det ved s\u00f8knad
  om tiltak framleggast dokumentasjon p\u00e5 lyssetting som gir minst mogeleg konsekvensar
  for Flor\u00f8 sentrum og andre omkringliggande bustadomr\u00e5der, jfr lysrapport
  Sweco 2013.  Det skal prim\u00e6rt brukast asymmetrisk lys, lyskastarar skal ikkje
  vinklast opp fr\u00e5 horisontalplanet eller retta mot s\u00f8r, og lysmaster skal
  ikkje overstige kote 35 meter.\\n3.2.15 Bygningar i I1-I2 som ikkje har direkte
  kaitilknytta funksjon skal plasserast mot byggelinje mot veg. Det skal stillast
  h\u00f8ge estetiske krav til utforming av fasader synlege fr\u00e5 sentrum.\\n3.2.16
  For omr\u00e5de I1 og I2 skal det f\u00f8religge ei heilskapleg skisse for utnytting
  av heile omr\u00e5det f\u00f8r f\u00f8rste bruksl\u00f8yve og byggel\u00f8yve blir
  gitt. Denne skissa skal vise siluett og fjernverknad fr\u00e5 minst 3 aktuelle utsiktspunkt.\\n3.2.17
  F\u00f8r det blir gitt bruksl\u00f8yve for omr\u00e5de I1,I2 og I20 krevast opparbeidd
  tilstrekkeleg infrastruktur til \u00e5 levere landstraum.\\n3.2.18 For areala I1-I2
  skal det stillast krav om gjenbruksplan for alle nye tiltak f\u00f8r bruksl\u00f8yve
  og byggel\u00f8yve blir gitt.\\n3.2.19 I omr\u00e5de I 17, I 19 og I20 skal sprenging
  og fylling foreg\u00e5 i periodane novemberjanuar og mai pga omsyn til gytande torsk
  og sild, jfr KU (2013).\\n3.2.20 I omr\u00e5det I19 kan det ikkje etablerast industri
  s\u00e5 lenge hestesportsenteret ligg der.\\n3.2.21 I tilknyting til omr\u00e5de
  I17, I19 og I20 kan det disponerast areal til forsknings- og utviklingsprosjekt
  med flytande, lukka oppdrettsverksemd i sj\u00f8. N\u00f8dvendige l\u00f8yve fr\u00e5
  Fylkesmannen og Kystverket m\u00e5 foreligge f\u00f8r tiltak kan iverksettast.\\n\\n3.3
  Sm\u00e5b\u00e5tanlegg(SB1)\\n\\n3.3.1 I omr\u00e5de SB1 skal det etablerast sm\u00e5b\u00e5tanlegg.
  Detaljert utforming av anlegget p\u00e5 land og i sj\u00f8 (SH1) vert fastsett ved
  s\u00f8knad om tiltak.\\n3.3.2 Det er krav om 0,3 parkeringsplassar per b\u00e5tplass.
  Desse kan ogs\u00e5 nyttast til sesonglagring av b\u00e5t.\\n\\n3.4  Golfbane (GB1)\\n\\n3.4.1
  Omr\u00e5de GB1 skal brukast til golfbane og tilh\u00f8yrande aktivitet.\\n3.4.2
  Det skal ikkje gjerast terrenginngrep/tiltak i omsynssone H730_2  som markerer Brands\u00f8y
  kyrkjestad.\\n3.4.3 Det skal bevarast/etablerast ei buffersone med skog i ytterkant
  av golfbana mot nord og vest.\\n\\n3.5 N\u00e6ringsbygg (N1-N2)\\n\\n3.5.1 Omr\u00e5de
  N1 skal brukast til lettare lager, verkstad- og kontorbygg med tilh\u00f8yrande
  utand\u00f8rs lageromr\u00e5de. Verksemd som genererer st\u00f8yande aktivitet om
  natta skal avvisast.\\n3.5.2 Omr\u00e5de N2a og N2b skal brukast til planteskule
  med tilh\u00f8yrande aktivitet.\\n\\n3.6 Uthus/naust/badehus (UNB1)\\n\\n3.6.1 Omr\u00e5de
  UNB1 skal brukast, som i dag, til naust for fritidsb\u00e5tar.\\n\\n4.0 Samferdselsanlegg
  og teknisk infrastruktur (pbl \u00a712\u20135-2)\\n\\n4.1 K\u00f8yreveg (V1 \u2013
  V20 og SKV1-SKV2), veg (V10)\\n\\n4.1.1 Veg V1-V5 skal opparbeidast trinnvis slik
  skissert i kap 3: Rekkef\u00f8lgekrav.\\n4.1.2 Detaljert utforming av vegareal for
  nye vegar V1-V6, V9-V11, V13-V14, V16-V19 V20 vert fastsett ved detaljprosjektering
  av vegsystemet. Mindre forskyving av form\u00e5lsgrense mellom k\u00f8yreveg og
  anna veggrunn er tillate. Dersom det ved opparbeiding av k\u00f8yreveg viser seg
  naudsynt med mindre vegareal enn regulert, kan form\u00e5lsgrense mot utbyggingsareal
  forskyvast etter avtale med kommunen.\\n4.1.3 a) V10 utformast med prioritering
  for syklande og med utvida vegskulder med prioritering for g\u00e5ande.\\nV10 malast
  med sharrows (delesymbol for sykkel) p\u00e5 asfalt i tillegg til skilting for syklande
  kvar 50 meter.\\nb) Veg V10 kan leggast n\u00e6rare riksvegen enn plankartet viser,
  dersom det ved detaljprosjektering kan dokumenterast at dette gir tilfredsstillande
  l\u00f8ysing i h\u00f8ve til riksvegen. Form\u00e5lsgrense mellom veg V10 og utbyggingsareala
  I16-I17 vert d\u00e5 forskyve tilsvarande mot s\u00f8r.\\n4.1.4 Veg V4 skal brukast
  til \u00e5 etablere bru. Den skal vere minimum 50 meter lang og ha fri seglingsh\u00f8gde
  p\u00e5 minimum 7 meter. For brukryssing skal s\u00f8kast l\u00f8yve av Kystverket
  etter Hamne- og farvasslova.\\n4.1.5 I omr\u00e5de veg V18 skal etablerast bru.
  Det skal vere minimum opning p\u00e5 200 m for \u00e5 sikre vassgjennomstr\u00f8yming
  i sundet, jfr rapport naturmilj\u00f8 sj\u00f8 2013, og minimum seglingsh\u00f8gde
  7 meter. For brukryssing skal s\u00f8kast l\u00f8yve av Kystverket etter Hamneog
  farvasslova.\\n4.1.6 Terrenginngrepa i samband med veganlegga skal skje slik at
  vegareal forheld seg til planert utbyggingsareal p\u00e5 mest mogeleg heilskapeleg
  m\u00e5te. Vegfyllingar/-skj\u00e6ringar i det regulerte trafikkomr\u00e5det skal
  tils\u00e5ast. Murar i naturstein kan tillatast der tilh\u00f8va ligg til rette
  for dette.\\n4.1.7 Der veg V6 kryssar kommunale vassleidningar, skal minimumsh\u00f8gde
  for overdekning over leidningane godkjennast av kommunen, jfr omsynsone H410_1.\\n4.1.8
  Alle skj\u00e6ringar/fyllingar med ei h\u00f8gde som kan vere farleg for trafikkantar
  eller andre\\n\\nsom ferdast i omr\u00e5det, skal av utbyggar sikrast med n\u00f8dvendige
  trafikkrekkverk og sikringsgjerde. Utforming skal godkjennast av vegstyresmaktene.\\n4.1.9
  For alle nye vegar skal avklarast med kommunen og SFE om etablering av n\u00f8dvending
  infrastruktur; vatn, avl\u00f8p, h\u00f8gspent, l\u00e5gspent, fiber.\\n4.1.10 Mellom
  V5 og GS5 i b\u00e5thamna SB1 si utstrekning skal etablerast eit skjermingsgjerde.\\n4.1.11
  Vegar V7, V8 (Rv 5) og V15 er etablerte.\\n4.1.12 K\u00f8yreveg SKV1 og SKV2 skal
  utformast som kryss fr\u00e5 offentleg veg til Industriomr\u00e5da I1 og I5. Detaljert
  utforming av k\u00f8yreveg-/kryssl\u00f8ysing vert fastsett i detaljprosjektering.
  Dersom det skal nyttast uregistrerte k\u00f8yret\u00f8y i omr\u00e5det s\u00e5 m\u00e5
  det utformast trafikkregulering mellom kryssa og over bru, med trafikklys/bom. Lokalisering
  av kryss/veg SKV1 og SKV2 kan justerast, dersom ein ved detaljprosjektering finn
  at dette gir betre trafikal l\u00f8ysing. SKV1 kan maksimalt justerast 5 meter kvar
  veg.\\n4.1.13 Avk\u00f8yrslene V20A-B skal ved etablering av offentleg gang-/sykkelveg,
  GS5, utformast for normaltrafikk med kantstein, med kantvis tilpassa overk\u00f8yring,
  slik at det er mogleg for modulvogntog \u00e5 k\u00f8yre over ved behov.\\n\\n4.2
  Anna veggrunn  (AVG/AVT)\\n\\n4.2.1 Anna veggrunn \u2013 gr\u00f8ntareal (AVG) omfattar
  gr\u00f8fter, skj\u00e6ringar og fyllingar tilknytt veganlegga. Areala skal gjevast
  ei tiltalande utforming som skal godkjennast av kommunen.\\n4.2.2 Anna veggrunn
  \u2013 teknisk (AVT) omfattar barriere i tilknytning til transformatorstasjon. Barrieren
  detaljprosjekteres og utformast i henhold til Statens Vegvesen handbok N101.\\n\\n4.3
  Gang- /sykkelveg(GS1-GS11 og fortau (FO7)\\n\\n4.3.1 Gang- og sykkelveg  GS1-GS5
  og fortau FO7 skal opparbeidast trinnvis slik skissert i kap 3: Rekkef\u00f8lgekrav.\\n\\n4.4
  Hamn (H1-H3)\\n\\n4.4.1 Hamneareal og planert areal i hamneomr\u00e5det, skal ligge
  p\u00e5 min. kote +2,22.\\n4.4.2 I omr\u00e5de H1 kan det byggast ro-ro-anlegg.
  Form\u00e5lsgrense mellom H1 og I15 kan justerast i h\u00f8ve til endeleg prosjektering
  av ro-ro-anlegget.\\n4.4.3 I omr\u00e5de H2 og H3 skal det byggast kaier med tilh\u00f8yrande
  anlegg. Bygningar og anlegg som er naudsynt for drift av kai og hamneomr\u00e5de
  og anlegg for lagring i tilknytning til dette f\u00f8rem\u00e5let kan tillatast.\\n\\n4.5
  Hamnelager (HL1-HL2)\\n\\n4.5.1 I omr\u00e5de HL1 og HL2 kan det oppf\u00f8rast
  anlegg og bygningar for offentleg hamneomr\u00e5de, industri-, lager- eller handverksverksemd.
  Kontorbygningar med tilknyting til verksemda i omr\u00e5det kan tillatast. Tillate
  tomteutnytting, fastsett i prosent bebygd areal, er BYA=40%.\\n4.5.2 Bygningar kan
  oppf\u00f8rast med maksimal gesimsh\u00f8gd p\u00e5 15 meter over ferdig planert
  terreng. Takform skal tilpassast bygningsvolum, og skal sj\u00e5ast i samanheng
  med nabobygningar.\\n4.5.3 Tillate planeringsniv\u00e5 for omr\u00e5det er min kote
  + 2,22. Planeringsniv\u00e5 skal tilpassast tilgrensande hamneomr\u00e5de H1-H2
  og toppdekke for k\u00f8yreveg V9.\\n\\n4.6  Kai (K1)\\n\\n4.6.1 Omr\u00e5de K1
  skal brukast til kai for fritidsb\u00e5tar.\\n\\n4.7 Vassforsyningsnett (VA1-VA2)\\n\\n4.7.1
  Omr\u00e5de VA1 og VA2 skal nyttast til pumpestasjon/behandlingsanlegg og vassleidningar
  for hovudvassforsyninga. Det kan oppf\u00f8rast bygningar/anlegg i omr\u00e5de VA1,
  samt at det kan oppf\u00f8rast mindre kai p\u00e5 omr\u00e5det med tilknyting til
  dette f\u00f8rem\u00e5let.\\n4.7.2 I omr\u00e5de VA2 ligg eksisterande vassleidningar.
  Ved vegkryssing over dette omr\u00e5det, skal det takast s\u00e6rskilde omsyn til
  vassleidningane, og det m\u00e5 sikrast tilstrekkeleg overdekning over leidningane.  Tiltak
  skal avklarast og godkjennast  av kommunen\\n4.7.3 Flora kommune skal sikrast tenleg
  k\u00f8yretilkomst til omr\u00e5de VA1 og VA2.\\n\\n4.8  Parkering (P1- P2a/b)\\n\\n4.8.1
  Omr\u00e5de P1 skal nyttast til ventesone for tunge k\u00f8yret\u00f8y som skal
  levere last inn i baseomr\u00e5det.\\n4.8.2 Omr\u00e5de P2a og P2b skal vere offentleg
  og \u00e5lment tilgjengeleg parkeringsplassar. Dei er prim\u00e6rt tenkt som parkeringsplass
  for gjestar til friomr\u00e5det/badeomr\u00e5det BA1.\\n\\n5. 0 Gr\u00f8ntstruktur
  (pbl \u00a7 12\u20135-3)\\n\\n5.1 Vegetasjonsskjerm (VE1-VE6)\\n\\n5.1.1 I omr\u00e5de
  VE1 skal det oppf\u00f8rast skjermingsvoll med minimum h\u00f8gde p\u00e5 5 m over
  tilst\u00f8ytande planert niv\u00e5 for industriareal I1. \u00d8vre deler av skjermingsvoll
  skal vere jordsl\u00e5tt og det skal tilplantast med furuskog for \u00e5 reetablere
  eksisterande milj\u00f8. Eksisterande terreng/svaberg i strandsona skal i st\u00f8rst
  mogeleg grad takast i vare. Der tiltaket krev utfylling i sj\u00f8 skal det kunne
  etablerast ordna steinmur med tiltalande utsj\u00e5nad og tilpassa tilst\u00f8ytande
  strandsone. Skjermingsvoll skal detaljplanleggast av fagkunnig, fortrinnsvis landskapsarkitekt.
  Tiltaket skal meldast til og godkjennast av kommunen.\\n5.1.2 I omr\u00e5de VE2
  og VE3 skal skjermingsvoll med minimum h\u00f8gde p\u00e5 5.0 m over tilst\u00f8ytande
  planert niv\u00e5 for industriareal I5 behaldast.\\n5.1.3 I omr\u00e5de VE5, skal
  naturleg vegetasjon i st\u00f8rst mogeleg grad bevarast for \u00e5 fungere som ein
  gr\u00f8n skjerm mot innmark/tun p\u00e5 eigedomen gbnr. 26/2.\\n5.1.4 I omr\u00e5de
  VE6 skal terrenget takast vare p\u00e5 der det gir ein naturleg skjerming. For resten
  av omr\u00e5det skal det etablerast ein skjermingsvoll med ei h\u00f8gd p\u00e5
  mellom 2,5 og 4 meter over vegbana og best mogeleg tilpassa terreng. Vollen skal
  tils\u00e5ast p\u00e5 den delen som vender bort fr\u00e5 k\u00f8yrebana. Ved tiltak
  i omr\u00e5de VE6 skal terrengh\u00f8gd mot s\u00f8raust i st\u00f8rst mogeleg grad
  behaldast. Det skal s\u00f8kast om byggel\u00f8yve samstundes med veganlegget for
  alle tiltak og terrenginngrep i omr\u00e5da VE5 og VE6.\\n\\n5.2 Naturomr\u00e5de
  (NA1-NA3)\\n\\n5.2.1 I omr\u00e5de NA2 Langholmen skal kunne etablerast fort\u00f8yningspunkt
  til maritime konstruksjonar og/eller oppgraderast gamle fort\u00f8yningspunkt. For
  slike tiltak skal s\u00f8kast l\u00f8yve av Kystverket etter Hamne- og farvasslova
  og av kommunen etter Planog bygningslova.\\n\\n5.3  Badeplass/-omr\u00e5de (BA1)\\n\\n5.3.1
  Omr\u00e5de BA1 skal nyttast som bade- og friluftsomr\u00e5de. Det skal i omr\u00e5det
  gjennomf\u00f8rast tiltak som gjer omr\u00e5det meir brukarvennleg og attraktivt.
  Det skal utarbeidast ein handlingsplan for omr\u00e5det som skal godkjennast av
  kommunen, jfr kap 2 Rekkef\u00f8lgekrav. Ein m\u00e5 sj\u00e5 utvikling av dette
  omr\u00e5det i samanheng med opparbeiding av parkeringsplass P2. Automatisk freda
  arkeologisk kulturminne merka med omsynssone H730_5 skal ikkje bli ber\u00f8rt av
  tiltak.\\n\\n6.0 Landbruks-, natur-, og friluftsform\u00e5l samt reindrift (LNFR)  (pbl
  \u00a7 12\u20135\u20135)\\n\\n6.1  Generelt (LNF1- LNF5)\\n\\n6.1.1 For omr\u00e5da
  LNF1-LNF2 skal vidaref\u00f8rast/ikkje endrast den bruken som er der i dag\\n6.1.2
  I LNF1 i omr\u00e5det mellom golfbana og I19 skal bevarast skog som skjerming.\\n6.1.3
  I omr\u00e5de LNF3 ligg 3 synlege gravr\u00f8yser. Desse skal bevarast, og ligg
  under bandleggingssone H70_1. Sj\u00e5 f\u00f8resegner for bandleggingssoner under
  punkt 9.0\\n6.1.4 Eigar av gbnr. 26/2, skal sikrast tilkomst fr\u00e5 land til omr\u00e5da
  LNF4 og LNF5. Kvaliteten p\u00e5 tilkomstvegen skal vere tilfredstillande for tilkomst
  med traktor med hengar. Flora kommune skal sikrast tilkomst til Omr\u00e5de for
  kommunalteknisk anlegg VA1.\\n6.1.5 I omr\u00e5de LNF5 kan kommunen tillate at det
  vert oppf\u00f8rt b\u00e5thus/naust for gbnr. 26/2.\\n6.1.6 Omr\u00e5de LNF4 kan
  omdisponerast til omr\u00e5de for kommunalteknisk anlegg, dersom naudsynt utbygging
  ikkje kan l\u00f8ysast innafor regulert areal til kommunalteknisk anlegg.\\n\\n6.2
  LNFR-areal for spreidd bustad, fritids eller n\u00e6ringsbusetnad (SPB1)\\n\\n6.2.1
  Omr\u00e5de SPB1 er eit omr\u00e5de som inneheld b\u00e5de dyrka jordbruksland og
  bustader.\\n\\n6.3 Friluftsform\u00e5l (F1-F4)\\n\\n6.3.1 Omr\u00e5da F1-F4 skal
  bevarast som gr\u00f8ne friomr\u00e5der.\\n6.3.2 I omr\u00e5de F4 skal det kunne
  etablerast sikringstiltak mot skred for \u00e5 sikre industriomr\u00e5da I14 og
  I18. Det er skissert i rapportane til Russenes (2012) og NGI (2009) kva slike sikringstiltak
  kan vere. Desse m\u00e5 imidlertid dokumenterast av fagkunnig geolog ved planlegging
  og s\u00f8knad om tiltak i omr\u00e5de I14 og I18.\\n6.3.3 Omr\u00e5de F4 skal vere
  tilgjengeleg for grunneigar av gbnr 26/2 fr\u00e5 omr\u00e5de I14 for uttak av skog.\\n\\n7.0
  Bruk og vern av sj\u00f8 og vassdrag (PBL 12-5-6)\\n\\n7.1 Generelt\\n\\n7.1.1 Planen
  gjeld i heile vertikalsnittet, og alle f\u00f8resegner gjeld b\u00e5de botn, vass\u00f8yle
  og vassflata.\\n7.1.2 Omr\u00e5da skal vere tilgjengeleg for \u00e5lmenn ferdsel.\\n\\n7.2
  Bruk og vern av sj\u00f8 og vassdrag med tilh\u00f8yrande strandsone (BV1)\\n\\n7.2.1
  I omr\u00e5de BV1 skal kunne etablerast kryssande f\u00f8rt\u00f8yningar for maritime
  konstruksjonar. For slike tiltak skal s\u00f8kast l\u00f8yve av Kystverket etter
  Hamne- og farvasslova.\\n7.2.2 Omr\u00e5de BV1 skal kunne brukast til midlertidig
  oppankring av maritime konstruksjonar.\\n7.2.3 Tiltaka i punkta over skal ikkje
  hindre fri ferdsel gjennom omr\u00e5det.\\n\\n7.3 Farlei (FA)\\n\\n7.3.1 Omr\u00e5de
  for farlei er hovudlei og bilei der tiltak krev l\u00f8yve fr\u00e5 Kystverket i
  henhold til farledsforskriften og hamne- og farvasslova \u00a7 28. Dette er viktig
  areal for sj\u00f8trafikken til og fr\u00e5 hamna p\u00e5 Botnaneset, og bruken
  av omr\u00e5det m\u00e5 ikkje vere i konflikt med sikker og effektiv trafikk i farleia\\\"\\n\\n7.4
  Ferdsel (FE1-FE2)\\n\\n7.4.1 Omr\u00e5de FE2 skal kunne disponerast til forsknings-
  og utviklingsprosjekt med flytande, lukka oppdrettsverksemd i sj\u00f8. Oppankring
  av flytande konstruksjonar i tilknytning til denne verksemda skal kunne tillatast.
  N\u00f8dvendige l\u00f8yve fr\u00e5 Fylkesmannen og Kystverket m\u00e5 foreligge
  f\u00f8r tiltak kan iverksettast.\\n\\n7.5 Sm\u00e5b\u00e5thamn (SH1)\\n\\n7.5.1
  Omr\u00e5de SH1 er sj\u00f8omr\u00e5de forbeholdt sm\u00e5b\u00e5thamn. Innanfor
  dette omr\u00e5det er det ikkje tillatt med andre tiltak enn flytande konstruksjonar
  for sm\u00e5b\u00e5thamn.\\n7.5.2 Detaljert utforming av anlegg p\u00e5 land (SA1)
  og i sj\u00f8 (SH1) skal godkjennast av kommunen.\\n\\n7.6 Friluftsomr\u00e5de i
  sj\u00f8 (FS)\\n\\n7.6.1 Omr\u00e5det skal vere tilgjengeleg for allmenn ferdsel\\n\\n8.0
  Omsynssoner (pbl \u00a7 12 \u2013 6 jmf. \u00a711 - 8)\\n\\n8.1 Frisikt\\n\\n8.1.1
  Frisiktsoner er markert i plankartet i vegkryssingar. I frisiktsonene er det forbod
  mot fyllingar, bygningsmessige arbeid og planting o.a. som er til hinder for fri
  sikt i ei h\u00f8gd av 0,5 m over vegplanet.\\n\\n8.2 Ras- og skredfare (H310_1-H310_2)\\n\\n8.2.1
  Omsynssoner for skred framg\u00e5r av plankartet. Det kan innanfor omsynsone H310_1-
  H310_2 ikkje gjevast l\u00f8yve til bygningsmessige tiltak, med unntak for skredsikring,
  f\u00f8r omr\u00e5det er tilstrekkeleg sikra i tr\u00e5d med geologirapportar av
  Russenes (2012) og NGI (2006 og 2009).\\n8.2.2 Sone H310_1 angir faresone S2, jfr
  Tek 10 og Russenes 2012. Sone H310_2 angir faresone S1.\\n\\n8.3 Brann- og eksplosjonsfare
  (H350_1-H350_3)\\n\\n8.3.1 H350_1 markerer restriksjonsomr\u00e5de p\u00e5 30 m
  rundt LNG-anlegg. Innanfor sona gjeld strenge restriksjonar p\u00e5 type aktivitet,
  arbeid og oppbevaring av gods og materiell. Trafikk- og hastighetsbegrensing.\\n8.3.2
  H350_2 markerer restriksjonssone p\u00e5 18 m rundt oljetankar, der nye bygg ikkje
  kan etablerast innanfor sona. Innanfor ein radius p\u00e5 p\u00e5 50 m skal t\u00e5last
  brann p\u00e5 5 kW/m.\\n8.3.3 H350_3 markerer restriksjonssoner p\u00e5 2 x 19 m
  og sikringssone p\u00e5 2 x 40 m rundt kjemikalieanlegg. Omr\u00e5det er fysisk
  avstengt. Omsynssona omfattar dei to sikringssonene p\u00e5 40 m.\\n\\n8.4 S\u00e6rlege
  krav til infrastruktur (H410_1 \u2013 H410_2)\\n\\n8.4.1 I sone H410_1 ligg hovedvassleidingsnettet
  til kommunen. Det skal takast s\u00e6rleg omsyn til dette n\u00e5r det gjeld all
  aktivitet og trafikk i omr\u00e5det. Planlagde tiltak m\u00e5 avklarast med kommunen
  f\u00f8rst.\\n8.4.2 I sone H410_2 ligg el-tras\u00e8 med 22kV-linje. Desse m\u00e5
  takast omsyn til ved all planlegging av tiltak. Planlagde tiltak m\u00e5 avklarast
  med kommunen og SFE f\u00f8rst.\\n\\n8.5    Bandlegging etter lov om kulturminner
  (H730_1-H730_6)\\n\\n8.5.1 I sonene H730_1-H730_6 er automatisk freda kulturminner
  som skal takast vare p\u00e5. Alle inngrep i grunnen eller andre tiltak som kan
  virke inn p\u00e5 dei automatisk freda kulturminna er ikkje tillete utan etter dispensasjon
  fr\u00e5 kulturminnelova.\\n8.5.2 I sone H730_1 skal det settast opp sikringsgjerde
  i samr\u00e5d med kulturminneavdelinga hos Sogn og Fjordane Fylkeskommune.\\n8.5.3
  Eventuell s\u00f8knad om l\u00f8yve til inngrep i automatisk freda kulturminne innanfor
  bandleggingssonene skal sendast rette antikvariske myndigheit, Riksantikvaren, i
  god tid f\u00f8r arbeidet er planlagd igangsatt. Kostnadar knytt til n\u00f8dvendige
  unders\u00f8kingar og eventuelle arkeologiske utgravingar vert belasta tiltakshavar.\\n\\n8.6
  H\u00f8yspenningsanlegg (H370)\\n\\n8.6.1 H370 omfattar omsynssone for transformatorstasjon
  og 25 m rundt anlegget. Ved etablering av transformatorstasjon skal denne etablerast
  p\u00e5 min kote +4. Tiltak er ikkje tillat innafor omr\u00e5de utan avklaring med
  Linja AS.\\n\\n8.7 Bandlegging etter andre lover (H740)\\n\\n8.7.1 H740 omfattar
  areal for transformatorstasjon. Energianlegg som har f\u00e5tt eller har s\u00f8kt
  om konsesjon (til NVE) etter energilova, er unnateke handsaming etter pbl.\\n\\n9.0  Bestemmelsesomr\u00e5de
  (Pbl. \u00a7 12-7, nr. 6)\\n\\n9.1 F\u00f8r iverksetjing av tiltak i omr\u00e5de
  VEST (I1 og I2) i medhald av omr\u00e5dereguleringsplanen skal det gjennomf\u00f8rast
  ei arkeologisk utgraving av det automatisk freda kulturminna, id 161145 (#1. F\u00f8r
  iverksetjing av tiltak i omr\u00e5de SB1 og F1 og F2 skal det gjennomf\u00f8rast
  ei arkeologisk utgraving av dei automatisk freda kulturminna id 170156 (#2), 170158
  (#3) og 170160 (#4). F\u00f8r iversetjing av tiltak aust for SPB 1 i omr\u00e5de
  BASIS i medhald av omr\u00e5dereguleringsplanen skal det gjennomf\u00f8rast ei arkeologisk
  utgraving av dei automatisk freda kulturminna id 161163 (#5), 161199 (#6).\\n\\nTala
  i parantes viser til bestemmelsessoner i plankartet.\\n\\nDei automatisk freda kulturminna,
  id 170082, 170155, 170157, 170159, 170161 og 171932, som blir r\u00e5ka av tiltak
  i planen, kan bli fjerna utan vilk\u00e5r om arkeologisk gransking.\\n9.2 Tiltakshavar
  skal ta kontakt med Sogn og Fjordane fylkeskommune i god tid f\u00f8r tiltaket skal
  gjennomf\u00f8rast, slik at omfanget av den arkeologiske granskinga kan fastsetjast.\\n9.3
  N\u00e5r kulturminnene er gravd ut skal bestemmelsesomr\u00e5dene fjernast fr\u00e5
  plankartet.\\n9.4 #7 Utformast med 1,5 meter bredde kun for g\u00e5ande. Gangsone
  skal merkast tydeleg for \u00e5 skilje det fr\u00e5 k\u00f8yrefeltet, ved t.d. markering
  i asfalt og rumlefelt (merksemds signal i dekke).\\n\\n10.0  Byggegrense\\n\\nByggegrense
  p\u00e5 25 meter p\u00e5 s\u00f8rsida av veg V8 (Rv 5) markerer og tiltaksfri sone.\\n\\n11.0
  Felles retningslinjer\\n\\n11.1 Det er ikkje tillate \u00e5 inng\u00e5 privatrettslege
  avtaler i strid med planen og f\u00f8resegnene.\\n11.2 Ved innsending av rammes\u00f8knad
  for bygg skal det leggast ved detaljerte etasjeplanar, snitt, fasadar og perspektiv
  som illustrerer byggas form og volum, h\u00f8gder, materialbruk, detaljar og samanheng
  med omgjevnadane. Det skal leggast ved ein situasjonsplan i m\u00e5lestokk 1:500
  som viser avkj\u00f8rsel, renovasjonsl\u00f8ysing, ev. utand\u00f8rs m\u00f8blering,
  planting og belysning.\\n11.3 Det skal utarbeidast detaljerte planar for opparbeiding
  av offentleg veggrunn/plassar. Planane skal m.a. vise materialbruk, planting og
  m\u00f8blering. Universell utforming skal leggast til grunn for utforming av offentleg
  veggrunn. Detaljplan skal godkjennast av Flora kommune.\\n11.4 Ved s\u00f8knad om
  tiltak skal det lagast prognosar for bygge- og anleggsst\u00f8y som gjer greie for
  naudsynte avgrensingar i driftstid. Grenser for bygge- og anleggsst\u00f8y, gitt
  i st\u00f8yretningslinje T-1442 fr\u00e5 Milj\u00f8verndepartementet (2005), skal
  overhaldast fullt ut p\u00e5 natt/kveld og p\u00e5 dag i den grad det er praktisk
  mulig. I anleggsperiode kan st\u00f8ytilh\u00f8va vurderast s\u00e6rskilt. Kommunen
  kan nekte \u00e5 tillate etablering av verksemder n\u00e5r det kan dokumentarast
  at dette vil kunne medf\u00f8re s\u00e6rlege ulemper i form av st\u00f8veller st\u00f8yplager
  for omgjevnadane, i og utanfor planomr\u00e5det.\\n11.5 Verksemdtype og plassering
  skal kunne godkjennast av kommunen, som kan fastsette at spesielle verksemder som
  kan medf\u00f8re ulemper for omgjevnadane, skal visast til s\u00e6rskilte deler
  av industriomr\u00e5det. Kommunen kan dessutan nekte \u00e5 tillate etablering av
  verksemder som vil kunne medf\u00f8re s\u00e6rlege ulemper for omgjevnadane i og
  utanfor planomr\u00e5det.\\n11.6 Ved s\u00f8knad om tiltak skal det dokumenterast
  heilskaplege l\u00f8ysingar for tomta. Det skal utarbeidast prinsippskisse som viser
  l\u00f8ysingar for utbygging av det aktuelle delomr\u00e5det. Prinsippskissa skal
  vise terrengmessig handsaming med h\u00f8gdefastsetting, omr\u00e5dar der det kan
  vere aktuelt med forst\u00f8tningsmurar og gjerde, tilkomstpunkt for delomr\u00e5det/tomta,
  areal for av- og p\u00e5lessing, lagerareal p\u00e5 tomtane, og plassering av bygningar
  i h\u00f8ve til kvarandre med h\u00f8gder, type takform og evt. oppdeling. Prinsippskissa
  skal forhalde seg til b\u00e5de utbygd og ikkje utbygd del av delomr\u00e5det.\\n11.7
  For alle nye tiltak i sj\u00f8 skal avklarast med Fylkesmannens milj\u00f8vernavdeling
  om der er forureina grunn, og kva tiltak som skal iverksettast.\\n\\n11.8 F\u00f8r
  nyetablering av bedrifter/tiltak som handterer farleg gods og farleg avfall i omr\u00e5det
  skal det foreligge ein risikoanalyse, der det er vurdert risiko for enkelttiltaket
  og samla risiko. S\u00e6rleg m\u00e5 dette vurderast i/ved faresoner for eksplosjonsfare,
  sj\u00e5 9.3 Brann- og eksplosjonsfare.\\n11.9 Krav for tryggleiksklassar i gjeldande
  teknisk forskrift m\u00e5 f\u00f8lgjast ved nye tiltak. Tryggleikskrava kan ein
  oppn\u00e5 anten ved \u00e5:\\n- plassere byggverk utanfor flaumutsett omr\u00e5de
  (over gitt koteh\u00f8gde)\\n- sikre byggverk mot overfl\u00f8yming\\n- dimensjonere
  og konstruere byggverket slik at det det toler belastningane og ein unng\u00e5r
  skadar.\\n\\nVed planvedtak gjeld f\u00f8lgjande koteh\u00f8gder for flaum (med
  b\u00f8lgjep\u00e5verknad) i h\u00f8ve TEK17\\n\\n| Tryggleiksklasse F2 (kontor,
  industribygg, bustad osv.) | 200-\u00e5rs flaum | Kote +2,9 |\\n|---|---|---|\\n|
  Tryggleiksklasse F3 (s\u00e5rbare samfunnsfunksjonar) | 1000-\u00e5rs flaum | Kote
  +3,0 |\\n\\nDersom det blir utf\u00f8rt konkret analyse for b\u00f8lgje- og stormflop\u00e5verknad
  for konkrete omr\u00e5de/tiltak kan h\u00f8gdene vist til i tabellen ovanfor fr\u00e5vikast,
  dersom analysa viser det. Analyse m\u00e5 utf\u00f8rast av fagkunnige.\\n\\nByggverk
  som i kraft av sin funksjonen m\u00e5 liggje i flaumutsette omr\u00e5de, til d\u00f8mes
  kaiar, m\u00e5 konstruerast og oppf\u00f8rast slik at dei er i stand til \u00e5
  tole belastningane under flaum. Installasjonar som ikkje vil tole h\u00f8g vasstand
  og b\u00f8lgjep\u00e5verknad, m\u00e5 plasserast utanfor flaumutsett omr\u00e5de.
  Planerte flater/golv b\u00f8r etablerast p\u00e5 ein slik m\u00e5te at toppniv\u00e5
  kan hevast i takt med niv\u00e5 for havstigning.\\n\\n11.10 F\u00f8r det blir gitt
  bruksl\u00f8yve for nye n\u00e6ringsareal, skal det framleggast ein arealoversikt
  over dagens baseomr\u00e5de og tenkt situasjon for ein framtidig st\u00f8rre base.\\n11.11
  F\u00f8r iverksetting av tiltak i I17, I19 og I20 skal det lagast eit overvakingsprogram
  for omfang av spreiing av suspenderte stoff og nitrogenstoff fr\u00e5 sprengstoffrestar,
  for \u00e5 sj\u00e5 at dei avb\u00f8tande tiltaka (pkt 3.2.20) har \u00f8nska effekt.\"",
  "\"Kapteinhagen\\n\\nAv Knut Raastad, skrivi i 2004\\n\\nDette er uttala Kaftinh\u00e5gein
  og ligg vest for Vetlberget i Nordherad statsalmenning.   I 1865 er nemnd Erlend
  Svendsen f. ca. 1824 som husfar med litt jordveg i Kapteinhaugen.   I 1851 budde
  han p\u00e5 Storvikseie.  Erlend kunne vera fr\u00e5 Simonneset, son til Sven Knutsen
  Storvikseie 1794-1871 og Ingebj\u00f8r Erlandsdotter Storvikseie.  Erland Svendsen
  flytte til Amerika i 1878 med heile familien, men han er ikkje nemnd i folketellinga
  i V\u00e5g\u00e5 i 1875.  Han vart i 1850 gift med Anne Kristensdotter L\u00f8yften
  f. 1825 fr\u00e5 Lom, og dei hadde s\u00f8nnene\\n\\nHans f. 1847, vegarbeidar i
  1865 Svend f. 1849 John f. 1851\\n\\nEllandlykkja ligg nede ved vatnet, og Kapteinhagen
  ligg ovanfor. Dette har kanskje ikkje vore to bruk, Ellandlykkja kan ha namn etter
  Erland i Kapteinhagen.  Oversikt over almenninga i 1853 nemner at Erland N\u00e6ssets
  innlagte plass skal utleggjast att, dette var av dei plassane som var innlagt siste
  20 \u00e5ra.  Folketellinga 1875 og Gudbrandsdalskommisjonen nokre \u00e5r seinare
  nemner ikkje Kapteinhagen, s\u00e5 da var det truleg fr\u00e5fl\u00f8tt.  Det kan
  sj\u00e5 ut til at Kapteinhagen var busett berre i 1850- og 60-\u00e5ra.\\n\\nI
  1865 var det i Kapteinhagen 6 sauer og 5 geit, medan dei s\u00e5dde \u00bd t\u00f8nne
  bygg og 1 t\u00f8nne poteter.\\n\\nKjelder:  Folketelling 1865\\n\\nJ.Kolden 2002:  Bygdabok
  for Lom 2, s. 69\\n\\nOversikt almenninga 1853\\n\\nAnna Randen: munnleg fortalt\""]'
