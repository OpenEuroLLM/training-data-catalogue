  "\"Arbeids og Administrasjons Departementet                                           Stavanger,
  12. juli 2004 Arbeids og Sikkerheitsavd. Postboks 8004 Dep. 0030 OSLO\\n\\nINNSPEL
  FR\u00c5 LEDERNE  TIL  H\u00d8YRING AV ARBEIDSLIVSLOVA I H\u00d8VE TIL INNSTILLING
  NOU 2004:5\\n\\nINNLEIING\\n\\nLederne takkar for tilliten me har f\u00e5tt ved
  \u00e5 verta invitert til \u00e5 koma med innspel til ny arbeidslivslov. Og skulle
  ynskja at h\u00f8yringsfristen hadde vore lenger. Nokre av v\u00e5re innspel vil
  koma til utrykk her medan andre tilbakemeldingar kjem under den enkelte paragraf.\\n\\nLederne
  stiller sp\u00f8rsm\u00e5l om arbeidsmilj\u00f8lova av 1977 har g\u00e5tt ut p\u00e5
  dato og at det i det heile er n\u00f8dvendig med ei heilt ny lov. N\u00e5r det er
  p\u00e5 tale med eventuelle revideringar burde ein heller ha h\u00f8yring p\u00e5
  dette. Ei ny lov vil nok heller ikkje vera mogleg \u00e5 laga med sikte p\u00e5
  \u00e5 skulle gjelda lang tid framover. P\u00e5 grunnlag av dette b\u00f8r ein kanskje
  venta med \u00e5 laga ei ny lov p\u00e5 dette omr\u00e5det. I tillegg burde det
  vore mykje lenger h\u00f8yringsfrist i til denne viktige lova.\\n\\nVidare er det
  viktig at AML. /ALLU. viser betre enn det som er tilfelle i dag til HMS forskriftene
  i Petroleumsregelverket: Rammeforskrift (RF), Internforskrift (IF), Opplysningsforskrift
  (OF), Aktivitetsforskrift (AF) og Styringsforskrift, slik at det ogs\u00e5 vert
  lettare for dei som h\u00f8yrer til dette regelverket \u00e5 sj\u00e5 samanhengen
  med AML.\\n\\nGENERELT:\\n\\nBAKGRUNN I H\u00d8VE TIL MANGEL P\u00c5 ARBEIDSKRAFT
  :\\n\\nLederne har sett p\u00e5 fleire sider ved utkastet til ny arbeidslivslovutval.
  Det vil i framtida vera brukt for mange fleire til \u00e5 delta i det aktiva arbeidslivet.\\n\\nFr\u00e5
  enkelte hald har det vorte hevda at me i Noreg vil f\u00e5 for liten arbeidskraft
  og at ein av den grunn \u00e5 ty til arbeidskraft fr\u00e5 andre land. I tillegg
  har me ogs\u00e5 ei fantastisk ubrukt arbeidsreserve i personar som berre arbeidar
  deltid. Heile 41 % av dei som t.d. arbeidar i kommunesektoren er deltidstilsette.\\n\\nMange
  som arbeidar deltid ynskjer \u00e5 arbeida p\u00e5 heiltid, men har ikkje  tilbod
  om heiltidsjobb. Dette er ofte tilfelle i helsesektoren i stat og kommune sektoren,
  men ogs\u00e5 i privatsektoren.\\n\\nInnspel til ny Arbeidslivslov  NOU 2004:5  12.07
  fr\u00e5 Lederne: Wenche I. Sola, 2004 side 1 av 16\\n\\nLederne vil her hevda at
  dersom ein her i landet tek i bruk den ubrukte arbeidskrafta som me alt har fr\u00e5
  f\u00f8r vil dette problemet verta l\u00f8yst av seg sj\u00f8lv. For \u00e5 f\u00e5
  dette til m\u00e5 ein alt no planleggja ulike tiltak for \u00e5 leggja forhalda
  til rette \u00e5 ta i bruk arbeidskraft som ein i dag ikkje har vore flink nok til
  \u00e5 ta i bruk. Dette kan vera yrkes hemma/ kronisk sjuke/ handikapa/ heime- verande/
  pensjonistar/ fortidspensjonistar/arbeidsledige, utst\u00f8ytte fr\u00e5 arbeidslivet/
  nyutdanna/ deltids- arbeidarar m.a. Dette medf\u00f8rer at ein f\u00e5 til eit inkluderande
  samfunn som har brukt for alle og som ynskjer \u00e5 satsa p\u00e5 verdien av \u00e5
  f\u00e5 flest mogleg ut i arbeids livet.\\n\\nArbeidstakarar vil som oftast best
  nytte verdi av oppl\u00e6ring i verksemder der dei skal arbeida. Staten b\u00f8r
  gje tilskot/ skattelette verksemder som l\u00e6rer opp nytilsette som f\u00f8r ikkje
  hadde s\u00e5 lett for \u00e5 koma inn p\u00e5 arbeidsmarknaden. Det vert viktig
  i \u00e5ra som kjem \u00e5 har ein stor vilje som g\u00e5r p\u00e5 at det skal vera
  brukt for alle og at alle s\u00e5 og seie alle kan vera gode nok til \u00e5 kunna
  gjera eit eller anna arbeid p\u00e5 deltid eller fulltid. Kanskje kan her dugnads-
  l\u00f8ftet ein hadde under sist verdskrig vera ein ide. I mange land m\u00e5tte
  kvinnene gjera arbeidet som mennene f\u00f8r hadde gjort i fabrikkar, landbruk,
  handel osv. Dette klarte dei fint og denne modellen kan kanskje b\u00f8rstast litt
  st\u00f8v av i tida framover.\\n\\nFor at arbeidsgjevarar skal kunna satsa p\u00e5
  t.d. yrkeshemma, eldre arbeidstakarar, tilsette som har vorte utst\u00f8tte fr\u00e5
  arbeidslivet og fleire andre grupper som til no ikkje har f\u00e5tt noko s\u00e6rleg
  tjangs til \u00e5 vera i arbeidslivet. Staten m\u00e5 p\u00e5 si sida leggjast mykje
  betre til rette for \u00e5 f\u00e5 til eit mykje meir inkluderande arbeidsliv, der
  alle er viktige. Det er viktig \u00e5 f\u00e5 ned totalkostnadane til arbeidsgjevarane.\\n\\nTiltak
  som her kan vera aktuelle er at arbeidsgjevaravgifta vert sterkt redusert eller
  fell vekk ved at dei tilset t.d. yrkeshemma, eldre arbeidstakarar og    personar
  som av ein eller annan grunn har falla ut av arbeidsmarknaden. Redusert moms p\u00e5
  varer, tenestar, transport vil auka verdiskapinga m.a.\\n\\nHelsesektoren m.a. vil
  krevja mykje arbeidskraft. Viktig at staten g\u00e5r inn med tiltak \u00e5 utdannar
  vaksne personar  som t.d. ikkje er i arbeid eller som ynskjer \u00e5  koma ut i
  arbeid og tilby dei kombinert arbeid og gratis utdanning i helse sektoren. Her m\u00e5
  ein ogs\u00e5 leggja til rette for gratis  barnehage /barnepass/ skule fritidsordning
  m.a.\\n\\nDet er ogs\u00e5 viktig her at ein utdannar mange fleire enn det ein reknar
  med at ein treng. I og med at ein del av desse vil falla fr\u00e5 og finna seg andre
  yrker etter nokre \u00e5r. Det er ogs\u00e5 viktig \u00e5 redusera skjemavelde og
  papirflyten til styresmakter/etatar. Mange sm\u00e5 og  mellomstore selskap/arbeidsgjevarar
  tykkjer at det er for tungt \u00e5 driva eit selskap og at dette er alt for byr\u00e5kratisk
  og un\u00f8dvendig tungt.\\n\\nBAKGRUNN UTST\u00d8YTING:\\n\\nStoppa utst\u00f8ytinga
  fr\u00e5 arbeidslivet ved \u00e5 la arbeidsgjevar sleppa \u00e5 betala arbeidsgjevar
  avgift for arbeidstakarar over t.d. 50 \u00e5r. Bonusordningar kan ogs\u00e5 hjelpa
  til for \u00e5 f\u00e5 tilsette til \u00e5 st\u00e5 lenger i arbeidslivet. Leggja
  forhalda til rette slik at pensjonistar, f\u00f8rtidspensjonistar m.a. kan tena
  meir utan \u00e5 mista pensjonen. Det m\u00e5l vera ei gulrot for folk til \u00e5
  f\u00f8retrekka \u00e5 arbeida framfor \u00e5 ta i mot trygd, sosialhjelp, pensjon.
  Dette gjeld b\u00e5de dei som st\u00e5r til og etter oppn\u00e5dd pensjonsalder.
  Det m\u00e5 svara seg \u00e5 arbeida framfor \u00e5 ta i mot trygd/sosialhjelp/
  pensjon m.a.\\n\\nKunnskapsheving og kursendring\\n\\nKursendring fr\u00e5 toppleiinga
  og leiinga nedover i rekkene. Betre leiing og oppl\u00e6ring i korleis ein skal
  handsama tilsette, verdsetjing, leggja forhalda betre til rette slik at ein f\u00e5r
  meir glede att i arbeidet og at ein dermed oppn\u00e5r ein god verdiskaping  som
  alle partar har gleda av. Leiinga b\u00f8r ogs\u00e5 satsa meir p\u00e5 t.d. coaching
  som eit nyttig verkt\u00f8y, gje oppl\u00e6ring og bruka dette aktivt.\\n\\nMANDAT:\\n\\nForenkling
  m\u00e5 ikkje vera synonymt med det \u00e5 svekka arbeidstakar sine rettar og vern,
  slik det g\u00e5r fram fleire stader i framlegget til arbeidslivslova d\u00e5rlegare
  vern. Der lova er god og klar nok fr\u00e5 f\u00f8r, b\u00f8r ikkje form\u00e5let
  vera ei svekking av arbeidstakar sine rettar. Me har i dag gode moglegheiter til
  \u00e5 s\u00f8kja alternative m\u00e5tar i den noverande lova.\\n\\nDet er viktig
  med eit godt arbeidsmilj\u00f8 for \u00e5 sikra den enkelte sin motivasjon og moglegheiter
  til \u00e5 st\u00e5 lengst mogleg i arbeid. Dette vil ein ikkje n\u00e5 s\u00e5
  langt med ved \u00e5 laga til ei rammelov der mykje skal vera opp til partane \u00e5
  fastsetja. Lederne ser p\u00e5 dette som vegen til st\u00f8rre utst\u00f8yting av
  eldre arbeids- takarar og andre utsette grupper. I AML har ein alt i dag ein utvida
  rett til \u00e5 avtala mellom partane og me ser ikkje nokon grunn til \u00e5 utvida
  dette ytterlegare.\\n\\nFleire stader legg ein vidare opp til eit svakare vern for
  arbeidstakar, noko Lederne ser sv\u00e6rt negativt p\u00e5. Me trur at i tida framover
  vil me f\u00e5 eit mykje t\u00f8ffare arbeidsliv, der arbeidstakarar lettare vil
  verta utsletne  p\u00e5 grunn av dei store omstillingane, nedbemanning og det stadige
  maset om auka inntening og kor ein skal redusera for \u00e5 mest utbytte til eigarane
  .\\n\\nARBEIDSTID:\\n\\nLederne ynskjer ikkje \u00e5 svekka lova p\u00e5 dette omr\u00e5det
  og er b\u00e5de  kritisk til at det kom endringar her f\u00f8r den nye Arbeidslivslova
  kjem og i mot \u00e5 utvida opninga for overtid. Lederne ynskjer ikkje \u00e5 f\u00e5
  ei meir rammeprega lov. Lederne ynskjer ikkje st\u00f8rre avtalefridom lokalt, noko
  me ser som ei svekking av noverande lov. Dette er godt nok fr\u00e5 f\u00f8r. Likes\u00e5
  ynskjer heller ikkje Lederne st\u00f8rre fleksibilitet for den enkelte arbeidstakar
  og verksemda, som me ser p\u00e5 som ei svekking av noverande lov og arbeidstakar
  lett kan verta utnytta. Reglane me har i dag er godt nok i vareteke fr\u00e5 f\u00f8r
  p\u00e5 dette omr\u00e5det.\\n\\nLike s\u00e5 er Lederne imot at tillitsvalte ikkje
  lenger skal godkjenna overtid slik som f\u00f8r, men at dette kan skje som avtale
  mellom arbeids gjevar og arbeidstakar. Me tykkjer ikkje at det er noko god ordning
  med den enkelte skal til- passa arbeidstida utover det som alt galt f\u00f8r siste
  endring. Lova var god nok p\u00e5 dette omr\u00e5det fr\u00e5 f\u00f8r og har f\u00f8rt
  til ei svekking.\\n\\nP\u00c5LAGT OVERTID:\\n\\nLederne er uroa for det store overtidsbruken
  som er i sv\u00e6rt mange verksemder. For \u00e5 b\u00f8ta p\u00e5 bruken av un\u00f8dvendig  mykje
  bruk av overtid, skal dette ogs\u00e5 kosta verksemda litt ekstra og vil foresl\u00e5
  at satsane vert heva til 100 %. Mange verksemder nedbemannar i stor skala og spekulerar
  i staden i overdreven overtidsbruk. Dette f\u00f8rer til at f\u00e6rre tilsette
  skal uf\u00f8ra arbeid ogs\u00e5 for dei som har m\u00e5tta slutta. I staden for
  \u00e5 tilsetja fleire tilsette, tyr arbeids gjevar ofte til overtid for dei som
  er att. Me ynskjer ikkje \u00e5 f\u00e5 svekka lovreglar p\u00e5 dette omr\u00e5det.\\n\\nFLEKSITID:\\n\\nLederne
  ser positivt p\u00e5 lovframlegget om at arbeidstakar har rett til fleksibel arbeidstid,
  dersom dette kan gjennomf\u00f8rast utan vesentleg ulempe for verksemda.\\n\\nSTILLINGSVERN:\\n\\nLederne
  er samd i at det er viktig med ei lovregulering som skal vera robust og varig over
  tid b\u00e5de i h\u00f8ve til forhaldet til utvikling i samfunnet og i arbeidslivet.
  Det same gjeld i h\u00f8ve til endringar i den politiske samsetning i Stortinget
  og til ei kvar tid sitjande regjering. Men samfunnet vil endra seg raskt og ein
  veit ikkje alltid heilt kva som vil skje i framtida, slik at sj\u00f8lv om lova
  er tenkt til \u00e5 gjelda ogs\u00e5 i lang tid framover, m\u00e5 ein likevel ta
  h\u00f8gde for at lova vil n\u00f8dvendigvis m\u00e5tta endrast i takt med utviklinga
  i samfunnet og arbeidslivet generelt ogs\u00e5 seinare.\\n\\nLederne ynskjer ikkje
  at reglande om stillingsvern skal svekkast ved \u00e5 setja dette opp i rammevilk\u00e5r.
  Er tanken om \u00e5 setja dette opp for \u00e5 f\u00e5 eit betre oversyn stiller
  sj\u00f8lvsagt ikkje Lederne seg i mot dette, men me ynskjer ikkje noko svekka stillingsvern
  eller d\u00e5rlegare vern p\u00e5 andre omr\u00e5der for arbeidstakar p\u00e5 grunn
  av at ein ynskjer \u00e5 samla reglar for stillingsvern og verksemdoverdraging under
  eitt kapittel. Vidare er me samd i at reglane om kravet for sakleg grunn for oppseiing
  skal vidaref\u00f8rast og at kravet til fast tilsetjing skal vera hovudregelen.\\n\\nARBEIDSTAKARMEDVERKNAD
  OG SAMARBEID\\n\\nGod samhandling med ein aktiv og reell arbeidstakarmedverknad
  p\u00e5 alle stadier er viktig i alle ledd og er ogs\u00e5 med p\u00e5 \u00e5 gje
  ei betre verdiskaping for selskapet. Det er viktig at blir innarbeida arbeidstakarmedverknad
  fr\u00e5 byrjinga av, slik at ein f\u00e5r ein reel arbeidstakar medverknad og at
  ein unng\u00e5r at tilsette kjem inn i seinfase n\u00e5r alt er lagt p\u00e5 plass
  og tilsette vert sitjande att som gissel. Det er ogs\u00e5 her viktig med god kunnskapsheving
  fr\u00e5 toppleiinga og nedover, b\u00e5de n\u00e5r det gjeld regelverkforst\u00e5ing
  og heving av leiingskompetanse.\\n\\nPSYKOSOSIALT/ORGANISATORISK ARBEIDSMILJ\u00d8:\\n\\nLederne
  meinar at reglar i AML. som rettar seg mot forebyggjing og systematisk HMS arbeid
  som g\u00e5r p\u00e5 klargjerning og presisering av arbeidstakar og arbeidsgjevar
  sine pliktar er gode nok slik dei er i dag og b\u00f8r vidaref\u00f8rast i den nye
  arbeidslivslova. Lederne ynskjer ikkje noko svekking av lova p\u00e5 dette omr\u00e5det.\\n\\nVidare
  ynskjer Lederne \u00e5 styrkja reglane me har i dag som g\u00e5r p\u00e5 informasjon,
  involvering, tilretteleggjing ,oppl\u00e6ring og ved omstillingssituasjonar og nedbemanning.
  Det er her viktig \u00e5 ha gode reglar som ivaretek arbeidstakar sin integritet
  og verdigheit. Dessutan er det viktig at tilsette kan avslutta arbeidslivet med
  verdigheit og at ein ikkje legg opp til ei forverring og d\u00e5rlegare vern for
  arbeidstakar som medf\u00f8rer at mange vert utst\u00f8ytt fr\u00e5 arbeidslivet
  lenge f\u00f8r pensjonsalder, slik me ser trenden er i dag. Det er ogs\u00e5 viktig
  \u00e5  hindra trakkasering og anna utilb\u00f8rleg opptreden, vern mot vold, truslar
  m.a og Lederne ynskjer ogs\u00e5 eit sterkare vern p\u00e5 dette omr\u00e5det.\\n\\nREGULERING
  VED LOV OG AVTALE:\\n\\nN\u00e5r det gjeld forholdet mellom lovregulering og avtaleregulering
  p\u00e5 arbeidslivomr\u00e5det, ser ikkje Lederne det som n\u00f8dvendig \u00e5
  gjera endringar her. I den gjeldande AML. har ein alt i dag gode reglar her og moglegheiter
  for \u00e5 inng\u00e5 avtale mellom arbeidsgjevar og arbeidstakar. Me ynskjer ikkje
  noko svekking av noverande lovreglar p\u00e5 dette omr\u00e5det. Samtidig vil me
  ogs\u00e5\\n\\noppretthalda at tillitsvalte representanten skal vera med \u00e5
  avtala avtaleforhald og elles vera kontaktperson. Me ser ikkje p\u00e5 det som noko
  god ide at VO/HVO skal g\u00e5 inn her. Dersom den enkelte skal avgjerda forhald
  i st\u00f8rre grad direkte med arbeidsgjevar ser med dette som ei stor svekking
  av HMS forhald. Ein ser ofte at det kan vera lett \u00e5 inng\u00e5 avtale med meir
  eller mindre \\\"svake sjeler\\\" som ikkje alltid heilt veit kva avtalen inneber.
  Eller at det kan vera \u00f8konomiske forhold som g\u00e5r f\u00f8re HMS forhold.
  T.d. lysten til \u00e5 arbeida mykje overtid og tena meir pengar, kan i enkelte
  tilfeller g\u00e5 f\u00f8r HMS forhold.\\n\\nVERNEOMBOD:\\n\\nLederne ynskjer at
  krava til kva for verksemder som skal ha verneomboda skal vera dei same som i dag
  og halda p\u00e5 lovteksten som me har i dag. Vidare ynskjer Lederne at verneomboda
  sine oppg\u00e5ver og makt skal vera uendra i h\u00f8ve til forholda i noverande
  lovgjeving. Lederne ynskjer ikkje noko utviding av verneombodrolla t.d. at dei skal
  g\u00e5 inn i rolla til tillitsvalte ved omorganisering, nedbemanning m.a. Lik s\u00e5
  ynskjer me heller ikkje noko svekka vern for VO/HVO utifr\u00e5 reglane me har i
  dag p\u00e5 dette omr\u00e5det.\\n\\nDet er i alt i dag godt innarbeida praksis
  p\u00e5 kven som har dei ulike rollane. Tillitsvalte er som oftast ogs\u00e5 best
  egna til \u00e5 g\u00e5 inn i dei rollane dei har etter AML, der utvalet no ynskjer
  \u00e5 ha ei pulvertisering av tillitsvalsrolla og representanten p\u00e5 dette
  omr\u00e5det. Dette vil i praksis berre f\u00f8ra til stor forvirring over innar-
  beida praksis og vil ikkje gje noko betre vern for dei som treng informasjon, st\u00f8tte
  og hjelp.\\n\\nBEDRIFTSHELSETENESTA:\\n\\nLederne ynskjer \u00e5 ha eit godt utbygt
  bedriftshelsetenesta. Det b\u00f8r setjast opp eit felles standardkrav til alle
  bedriftslegar som kva ein lege skal utf\u00f8ra. Arbeidstakar b\u00f8r s\u00e5 deretter
  f\u00e5 utlevert at skjema som viser helsestanden for kvar gong.\\n\\nDet b\u00f8r
  g\u00e5 fram i Arbeidslivslova at dette skal vera lovfesta og at legen skal grundig
  unders\u00f8kja arbeidstakar etter gjeldande reglar. Slik f\u00e5r ein ogs\u00e5
  same reglar for alle tilsette. Lederne st\u00f8ttar framlegget til Andersen, Bjergene,
  Haaland og Sunndnes (\u00a73-3, punkt 1-5 ,der det g\u00e5r m.a. fram at det skal
  vera bedriftshelseteneste ved kvar verksemd som g\u00e5r inn under lova. Jfr. dei
  andre punkta.\\n\\nIKKJE \u2013DISKRIMINERING:\\n\\nLederne ser positivt p\u00e5
  at ein skal inkludera alle i arbeidslivet. Her kan mykje gjerast med \u00e5 leggja
  forhalde betre til rette for kronisk sjuke/handikapa/eldre arbeidstakarar/ pensjonistar/
  f\u00f8rtidspensjonistar/nyutdanna/arbeidstakarar som av ein eller anna grunn har
  falle ut av arbeidslivet m.a.\\n\\nTiltak her kan vera l\u00e5gare arbeidsavgift/bortfall
  av arbeidsgjevar avgift /skatte lette/ st\u00f8tte til arbeidsgjevarar som tek desse
  personane inn og l\u00e6rer dei opp for kortare (minst eitt \u00e5r) eller lenger
  periodar. Slik kan desse f\u00e5 arbeidspraksis og ha betre tjangs \u00e5 s\u00f8kja
  ogs\u00e5 anna arbeid.\\n\\nI dag ser ein at ein del av desse grupper havnar p\u00e5  diverse
  kurs til AETAT som dei ikkje f\u00e5r noko s\u00e6rleg brukt for. For ein del av
  desse gruppene som ikkje har arbeids r\u00f8ynsla kunne det vera meir nyttig \u00e5
  vera p\u00e5 ein arbeidsplass \u00e5 f\u00e5 direkte oppl\u00e6ring i ei verksemd.\\n\\nARBEIDSGJEVAR
  OG ARBEIDSTAKAROMGREP:\\n\\nN\u00e5r det gjeld arbeidstakar og arbeidsgjevaromgrepet
  er dette stort sett godt nok slik det er i noverande lov. Lederne ynskjer ikkje
  noko svekking av desse omgrepa og vil halda p\u00e5 desse omgrepa slik dei er i
  dag.\\n\\nKONTROLL OG OVERVAKING:\\n\\nLederne er prinsipielt  imot at arbeidsgjever  skal
  kunna iverksetja kontrolltiltak ovanfor arbeidstakar og stiller seg kritisk til
  dette vert innf\u00f8rt. Dersom det skulle verta innf\u00f8rt kontrolltiltak er
  det viktig at samtykkje fr\u00e5 arbeidstakar ligg f\u00f8re.\\n\\nVERKSEMDSOVERDRAGING:\\n\\nLederne
  ser positivt p\u00e5 framlegget om \u00e5 styrkja reglane om verksemdsoverdraging
  p\u00e5 dette omr\u00e5det. Det er viktig at s\u00e6ravtalar, tariffavtalar, pensjons-
  rettar, reservasjon og valrett m.a. f\u00e5r same status som l\u00f8nns og arbeidsvilk\u00e5r
  elles. Me st\u00f8ttar framlegget om arbeidstakar sin rett til opptening av pensjon.\\n\\nVidare
  ser me ogs\u00e5 positivt p\u00e5 og st\u00f8ttar framlegget som g\u00e5r p\u00e5
  n\u00e5r ny arbeidsgjevar har ein pensjonsordning, s\u00e5 kan denne gjerast gjeldande
  for dei overf\u00f8rte arbeidstakarane. Lederne ynskjer ogs\u00e5 at det vert lovfesta
  at arbeidstakar kan motsetja seg \u00e5 verta overf\u00f8rt til ny arbeidsgjevar.
  I tillegg ynskjer me ogs\u00e5 at det skal g\u00e5 fram av lova korleis ein skal
  forhalda seg til ulike avtalar t.d. s\u00e6ravtalar, tariffavtalar m.a. og godar,
  som oftast kjem p\u00e5 kollisjonskurs.\\n\\nFramlegget v\u00e5rt er at arbeidsgjevar
  skal tilstreba seg p\u00e5 \u00e5 ta det beste ut av dei ulike avtalane og godane
  og laga ein ny felles avtale og ordningar som er til felles beste for alle arbeidstakarane
  b\u00f8r ta.\\n\\nHALDNINGSENDRING, NEDBEMANNING OG OMORGANISERINGAR:\\n\\nDet m\u00e5
  til heilt nye haldningar hj\u00e5 mange arbeidsgjevarar, der ein i praksis viser
  at ein verdset og set pris p\u00e5 arbeidstakarane. I dag er det store omorganiseringar
  p\u00e5 gang heile tida som slit sv\u00e6rt p\u00e5 arbeidstakarane.\\n\\nMange
  har ei kjensla av at dei ikkje er s\u00e5 mykje verd lenger og at arbeidslivet berre
  handlar om \u00e5 tena mest mogleg pengar for arbeidsgjevaren. Andre verdiar er
  ikkje lenger s\u00e5 mykje verd. Dette medf\u00f8rer at arbeidstakarar g\u00e5r
  \u00e5 gledar seg til at dei kan slutta f\u00f8r tida p\u00e5 arbeidet, enten dette
  er ved f\u00f8rtidspensjon eller at dei av helse messige grunnar ikkje held ut i
  det t\u00f8ffe\\n\\nk\u00f8yret lenger som er p\u00e5  mange arbeidsplassar.Ein
  del arbeidsgjevar ser p\u00e5 dei kostbare tilsette 50 \u00e5ringane som ein ekstra
  byrde t.d. i h\u00f8ve til pensjonsinnbetaling og som av den grunn vert utst\u00f8ytt
  av arbeidslivet. Andre ynskjer \u00e5 ha yngre rimelegare arbeidskraft.\\n\\nEit
  godt arbeidsmilj\u00f8 og ein sikker arbeidsplass er viktig for den enkelte sin
  motivasjon og mogleigheiter for \u00e5 vera i arbeid fram til pensjonsalder. Greier
  ikkje arbeidsgjevar \u00e5 skapa eit godt arbeidsmilj\u00f8, verdsetja tilsette
  og skapa ein god og sikker arbeidsplass, vil ein har eit stort problem i framtida
  med \u00e5 f\u00e5 folk til \u00e5 st\u00e5 lenger i arbeidslivet. Det er viktig
  at ein no byrjar \u00e5 setja menneskjer framfor berre \u00f8konomisk vinst. I framtida
  vil det nemleg verta kamp om \u00e5 f\u00e5 gode arbeidstakarar og d\u00e5 er det
  viktig \u00e5 tenkja utradisjonelt og satsa p\u00e5 andre verdiar enn berre \u00e5
  tena mest mogleg.\\n\\nPUNKT .2.2 KAPITTEL 10  ULIKE ORGANISASJONSFORMER OG NYE
  TILKNYTNINGSFORMER TIL ARBEIDSLIVET:\\n\\nLederne ynskjer ikkje noko svekking i
  h\u00f8ve til arbeidsgjevaromgrep og arbeids- takaromgrep omgrepa, men stiller seg
  positiv til \u00e5 ta inn meir utfyllande tekst her.\\n\\nARBEIDSGJVEVAR SITT ANSVAR
  FOR ANDRE ENN EIGNE ARBEIDSTAKARAR:\\n\\nLederne meinar at det er arbeidsgjevar
  sin plikt \u00e5 syta for at eiga verksemd er innretta slik at den ikkje representerar
  noko uakseptabel risiko for andre enn sine eigen arbeidstakarar som utf\u00f8rar
  arbeid i h\u00f8ve til verksemda. Dette uavhengig av om dei er rekna som arbeidstakarar
  eller har anna status.  Her kan ein ogs\u00e5 st\u00f8tta seg til forarbeida, rettspraksis,
  teori, m.a.\\n\\nLederne st\u00f8ttar framlegget om ei utviding av den personkrins
  som arbeidsgjevar skal ha ansvar for i desse situasjonar, ved \u00e5 inkludera sj\u00f8lvstendige
  og andre som utf\u00f8rar arbeid utan \u00e5 vera arbeidstakarar.\\n\\nPUNKT 2.3.
  KAPITTEL 11  HELSE, MILJ\u00d8 OG SIKKERHEIT:\\n\\nLederne meinar at det er viktig
  at den nye lova fastheld HMS forholda  som ein no har i lova. Lederne ser positivt
  p\u00e5 at ein ynskjer \u00e5 tydeleggjerda  til rette- leggjing under omstillingar,
  nedbemanning m.a. Det b\u00f8r i den samanheng vera ei eiga overskrift som g\u00e5r
  p\u00e5 Omstillings prosessar og Nedbemanning, som gir eit klart og greitt oversyn
  over korleis ein skal forhalda seg t.d. ved \u00e5 ta kontakt med tillitsvalt, informasjonsplikt,
  forhandlingsm\u00f8tar, fristar, osv.\\n\\nTillitsvalte og forbundsrepresentantar
  spelar ein viktig roller her og det er av den grunn ogs\u00e5 viktig \u00e5 presisera
  i lova at tilsette tek omg\u00e5ande kontakt  med tillitsvalte for \u00e5 f\u00e5
  informasjon og r\u00e5degjerning der.\\n\\nBEDRIFTSHELSETENESTA:\\n\\nN\u00e5r det
  gjeld omgrepet  \\\"verne og helsepersonale\\\" som AML brukar om bedriftshelsetenesteordningane,
  st\u00f8ttar Lederne at dette omgrepet vert bytta ut med omgrepet\\n\\n\\\"bedriftshelsetjeneste\\\".
  Lederne meinar ogs\u00e5 at alle legar som skal yta teneste i h\u00f8ve til bedriftshelsetenesta
  b\u00f8r bruka same praksis og kryssa av i eit helseskjema at alle pr\u00f8var og
  unders\u00f8kjingar reelt har skjedd og at dei gir i fr\u00e5 seg dette skjemaet
  til arbeidstakar. Slik vil ein kvalitetssikra alle legar og sleppa at lege berre
  sp\u00f8r korleis det st\u00e5r til og n\u00f8yer deg med dette svaret f\u00f8r
  dei slepp inn neste pasient. Kostnadane med \u00e5 la tilsette g\u00e5 til bedriftslege
  er ikkje s\u00e5 store og dette b\u00f8r alle arbeidsgjevarar ha r\u00e5d til \u00e5
  yta.\\n\\nDette inneber at Lederne st\u00f8ttar at ein skal g\u00e5 inn for ein
  fullverdig utbyggjing av bedriftshelseteneste for alle og at dette ogs\u00e5 vert
  ratifisert av ratifikasjon av ILOkonvensjonen nr. 161.\\n\\nPUNKT 2.4 KAPITTEL 12
  MEDVERKNAD OG SAMARBEID:\\n\\nLederne ynskjer  \u00e5 oppretthalda reglane me i
  dag har i h\u00f8ve verneombod og ynskjer ikkje noko utviding eller endring her
  av rollane til verneomboda.\\n\\nENDRING AV ABEIDSMILJ\u00d8UTVAL OG VERNEOMBODS
  ROLLANE:\\n\\nVidare ynskjer ikkje Lederne endring av arbeidsmilj\u00f8utvala og
  ynskjer \u00e5 halda modellen p\u00e5 dette omr\u00e5det slik det er i dag. Me ser
  ikkje noko vinst i at lova i st\u00f8rre grad skal gi arbeids takar og arbeidsgjevar
  st\u00f8rre fridom til \u00e5 sj\u00f8lv fastleggja korleis dei skal organisera
  samarbeidet. Denne fridommen har ein alt i dag p\u00e5 dei fleste omr\u00e5det og
  me tykkjer ikkje at det er noko grunn til \u00e5 utvida denne retten noko meir.\\n\\nLederne
  ser derimot at dette kan med f\u00f8ra ei svekking av HMS forhald og at dette ikkje
  gagnar den tilsette. Det vil lett kunna verta eit stort misforhald der ein har ein
  sterk arbeidsgjevar som har ein heilt anna bakgrunn og kompetanse og ein svak arbeidstakar
  som ikkje er s\u00e5 godt inne i reglar og konsekvensar for det som vert avtala.
  I ein pressa arbeidsmarknad kan svake sjeler lett inng\u00e5 avtalar dei ikkje burde.\\n\\nLederne
  ynskjer \u00e5 halda fast p\u00e5 reglane me har p\u00e5 dette omr\u00e5det og ynskjer
  ikkje noko svekking her. Lederne er av den grunn imot framlegget som g\u00e5r p\u00e5
  at partane i den enkelte verksemd i utgangspunktet sj\u00f8lv avtalar i kva grad
  organisatoriske samanhengar partane skal m\u00f8tast og korleis HMS, helse, milj\u00f8
  og best skal utformast. Etter Lederne sitt syn kan ein lett her f\u00e5r svekka
  HMS forhald, som ikkje vil tena arbeidstakara i lengda. Det ogs\u00e5 h\u00f8ve
  til i dag i ein viss utstrekning \u00e5 avtale mellom partane og me ynskjer ikkje
  noko endring her.\\n\\nYTRE MILJ\u00d8:\\n\\nLederne ynskjer at lova skal p\u00e5by
  at saker som inng\u00e5r i ytre milj\u00f8 og at desse skal inkluderast og at dette
  skal liggja innanfor Sikkerheitsleiar sitt arbeidsomr\u00e5de. Vidare at denne samarbeidar
  ogs\u00e5 med verneomboda, slik som tilfellet ogs\u00e5 er i dag. Det er arbeidsgjevar
  som har ansvaret for at verksemda har eit fullt forsvarleg arbeidsmilj\u00f8.\\n\\nLederne
  legg vekt p\u00e5 at  leiinga elles har tilstrekkeleg med kunnskap om arbeidsmilj\u00f8krav
  og arbeidsmilj\u00f8. I praksis ser me her at Sikkerheitsleiar er den personen som
  har best kunnskap\\n\\nog kompetanse p\u00e5 dette omr\u00e5det og har eit godt
  grunnlag for \u00e5 ha den beste oversynet p\u00e5 HMS forhold b\u00e5de n\u00e5r
  det gjeld ytre og indre forhold. Sikkerheitsleiarane har ogs\u00e5 eit godt samarbeid
  med vernetenesta.\\n\\nDet er viktig at arbeidsgjevar ogs\u00e5 hevar HMS kunnskapen.
  Lederne st\u00f8ttar av den grunn framlegget om at det vert stilla krav om at arbeidsgjevar
  gjennomg\u00e5r oppl\u00e6ring i helse, milj\u00f8 og sikkerheitsarbeid.\\n\\nINFORMASJON
  OG DR\u00d8FTING:\\n\\nDet er alt gode reglar p\u00e5 dette omr\u00e5det i dag og
  Lederne ynskjer ikkje nok svekking p\u00e5 dette omr\u00e5det, men stiller seg positiv
  til at det vert eit eige kapittel som g\u00e5r p\u00e5 dette og korleis partane
  skal forhalda seg i h\u00f8ve til informasjon, dr\u00f8fting mellom arbeidsgjevar
  og arbeidstakar med  tillitsvalt, forbundsrepresentant, anna representant m.a.\\n\\nLederne
  st\u00f8ttar ikkje framlegget om reglane skal gjelda for verksemder som jevnleg
  sysselsetter minst 50 tilsette. Lederne ynskjer ikkje at det skal setjast opp noko
  grensa for kor mange sysselsette verksemder skal ha her. Noreg er eit lite land
  og det er mange verksemder her i landet som har under 50 tilsette. Lederne ser p\u00e5
  dette framlegget som ei svekking av arbeidstakar sitt vern etter lova.\\n\\nLike
  s\u00e5 at det elles vert opna for at arbeidslivets partar kan inng\u00e5 avtalar
  om andre prosedyrar enn det som fylgjer av lova, for korleis tilsette skal informerast
  og konkluderast. Reglane ein har p\u00e5 dette omr\u00e5det fr\u00e5 f\u00f8r er
  betre og me treng ikkje \u00e5 forverra desse  innarbeida reglane ytterlegare.\\n\\nPUNKT
  2.5 KAPITTEL 13  ARBEIDSTID:\\n\\nLederne er usamd i at kapittelet om arbeidstid
  skal f\u00e5 ei meir rammeprega utforming og ser p\u00e5 dette som ei svekking av
  arbeidstakar sitt vern, slik det g\u00e5r fram av AML. i dag. Derimot er me samde
  i at ein kan laga til ein betre struktur i dette kapittelet. Lederne ynskjer heller
  ikkje at lova skal endrast til kompenserande kvile som vilk\u00e5r for \u00e5 fr\u00e5vika
  kravet om dagleg og vekeleg kvile.\\n\\nN\u00e5r det gjeld endringa i lova om at
  arbeidstakar kan arbeida  400 timar overtid, er Lederne sv\u00e6rt usamd i at lova
  vart endra her. Dette har medf\u00f8rt eit d\u00e5rlegare vern for arbeidstakar.
  Lederne ser heller ikkje positivt p\u00e5 at den maksimale arbeidstida kan verta
  p\u00e5 13 timar. Lederne er ogs\u00e5 i mot at nye ordningar gjer det mogleg for
  arbeidstakarane \u00e5 arbeida 78 timar i veka i ni samanhengande veker.\\n\\nSlik
  det g\u00e5r fram av framlegget til fleirtalet er, kan ein arbeidstakar kunna  arbeida
  48 tima i veka i snitt over ein periode p\u00e5 16 veker, totalt 768 timar. Dette
  inneber at det vert mogleg \u00e5 arbeida i 78 timar i veka i ni veker samanhengande
  veker. Dei siste 66 timane kan s\u00e5 fordelast p\u00e5 dei sju resterande vekene.\\n\\nDette
  ser Lederne p\u00e5 som ei sv\u00e6rt d\u00e5rleg ordning som arbeidsgjevar lett
  kan utnytta og d\u00e5 s\u00e6rleg i eit pressa arbeidsmarknad av utsette gruppe
  som t.d. eldre arbeidstakarar og  kan vera eit verkemiddel p\u00e5 utst\u00f8yting
  av arbeidslivet. I  verste fall kan det vera slik at dei som ikkje\\n\\ngreier dette
  k\u00f8yret og halde p\u00e5 med overtidsbruken i lengda f\u00e5r melding om at
  ein ikkje er s\u00e5 ynskja p\u00e5 arbeidsplassen lenger. Dette er ogs\u00e5 signal
  ein ser i dag fleire stader der det er \\\"vinn eller forsvinn\\\"  (arbeidsovertid
  eller finn deg noko anna \u00e5 gjer). Arbeidsgjevar at mange andre st\u00e5r i
  k\u00f8 til \u00e5 f\u00e5 arbeid.\\n\\nLederne er ogs\u00e5 sterkt i mot framlegget
  om at verksemdene ikkje skal ha plikt til \u00e5 leggja fram overtidslister som
  viser eit oversyn over den enkelte si overtid.\\n\\nLederne st\u00f8ttar framlegget
  som g\u00e5r p\u00e5 at arbeidstidreglane skal omfatta breiast mogleg verksemdomr\u00e5de
  og er samd i at alle grupper som vert omfatta av lova i utgangspunktet ogs\u00e5
  skal omfattast av arbeidstidsreglane.\\n\\nMe ynskjer ikkje noko utviding i \u00e5
  fr\u00e5vika overtids reglane utover det som er tilfelle i dag. Dette er ogs\u00e5
  p\u00e5peika tidlegare, der me har gjeve uttrykk for at me ikkje er samde i den
  siste utvidinga av overtidsbruk. Lederne stiller seg kritisk til at denne endringa
  vart teken inn i AML. f\u00f8r denne h\u00f8yringa var ferdig. Me ynskjer at den
  siste endringa om overtid ut g\u00e5r fr\u00e5 lova. Liks\u00e5  endringa der ein
  no kan avtala dette mellom partane vert teken vekk i lova. Endringa her har f\u00f8rt
  til eit svekka vern for arbeidsgjevar ved denne endringa.\\n\\nLederne st\u00f8ttar
  fleksibel arbeidstid der dette kan gjennomf\u00f8rast utan vesentleg. I tillegg
  st\u00f8ttar ogs\u00e5 framlegget om h\u00f8ve til \u00e5 avtala at overtidstillegget
  kan avspaserast. Lederne er ikkje samd i framlegget om \u00e5 endra p\u00e5 overtidstida
  til 22.00 \u2013 06.00, men ynskjer derimot \u00e5 halda fast 21.00-06.00 som st\u00e5r
  i lova fr\u00e5 f\u00f8r. Liks\u00e5 ynskje heller ikkje Lederne \u00e5 st\u00f8tta
  framlegget om utvida arbeid p\u00e5 sundagar. Me ynskjer ikkje \u00e5 la arbeidstakar
  f\u00e5 eit d\u00e5rlegare vern her. Reglane p\u00e5 dette omr\u00e5det er gode
  nok fr\u00e5 f\u00f8r.\\n\\nPUNKT. 2.6. KAPITTEL 14 LIKEHANDSAMING I ARBEIDSLIVET/
  IKKJE-DISKRIMINERING\\n\\nLederne  st\u00f8ttar framlegget om likehandsaming  i
  arbeidslivet som t.d. gjeld deltidstilsette og midlartidleg tilsette. Her b\u00f8r
  det kanskje ogs\u00e5 takast inn litt om arbeidstakarar som \\\"er p\u00e5 gratis
  pr\u00f8ve \\\" ved \u00e5 stilla si arbeidskraft for \u00e5 sj\u00e5 om dei passar
  til arbeidet . Dette vert gjort t.d. i restaurantbransjen der ein kanskje arbeidar
  i fleire veker utan l\u00f8nn, for s\u00e5 \u00e5 verta bytta ut me nye personar
  som igjen arbeidar p\u00e5 pr\u00f8ve gratis.\\n\\nKanskje b\u00f8r det vera nokre
  reglar p\u00e5 kor lenge ein kan vera gratis p\u00e5 pr\u00f8ve for \u00e5 sj\u00e5
  om ein passar til arbeidet. Likevel b\u00f8r det vera rom for t.d. nyutdanna eller
  andre som tilbyr seg frivillig \u00e5 arbeida gratis ein periode for \u00e5 visa
  kva dei kan, samtidig som dei f\u00e5r arbeidspraksis. Her er det ofta tale hjelp
  til sj\u00f8lvhjelp, der ein om kanskje ikkje hadde f\u00e5tt arbeid og praksis
  fr\u00e5 arbeidslivet, ville ha ein tjangs til \u00e5 f\u00e5 ein fot inn i arbeidslivet.
  I tillegg ville vedkomande ha lettar for \u00e5 verta tilsett i selskapet vedkomande
  byr p\u00e5 sin pr\u00f8vekompetanse. Her er det vanleg at ein tilbyr \u00e5 arbeida
  gratis t.d. fr\u00e5 tre til seks m\u00e5nadar.\\n\\nPUNKT 2.7. KAPITTEL 15 STILLINGSVERN:\\n\\nLederne
  er samd i at det er viktig med ei lovregulering som skal vera robust og varig over
  tid b\u00e5de i h\u00f8ve til forhaldet til utvikling i samfunnet og i arbeidslivet.
  Det same gjeld i h\u00f8ve til endringar i den politiske samsetning i Stortinget
  og til ei kvar tid sitjande regjering. Men samfunnet vil endra seg raskt og ein
  veit ikkje alltid heilt kva som vil skje i framtida, slik at\\n\\nInnspel til ny
  Arbeidslivslov NOU 2004:5  fr\u00e5 Lederne: Wenche I. Sola, 12.07.2004 side 10
  av 16\\n\\nsj\u00f8lv om lova er tenkt til \u00e5 gjelda ogs\u00e5 i lang tid framover,
  m\u00e5 ein likevel ta h\u00f8gde for at lova vil n\u00f8dvendigvis m\u00e5tta endrast
  i takt med utviklinga i samfunnet og arbeidslivet generelt ogs\u00e5 seinare.\\n\\nLederne
  ynskjer ikkje at reglande om stillingsvern skal svekkast ved \u00e5 setja dette
  opp i rammevilk\u00e5r. Er tanken om \u00e5 setja dette opp for \u00e5 f\u00e5 eit
  betre oversyn stiller sj\u00f8lvsagt ikkje Lederne seg i mot dette, men me ynskjer
  ikkje noko svekka stillingsvern eller d\u00e5rlegare vern p\u00e5 andre omr\u00e5der
  for arbeidstakar p\u00e5 grunn av at ein ynskjer \u00e5 samla reglar for stillingsvern
  og verksemdoverdraging under eitt kapittel. Vidare er me samd i at reglane om kravet
  for sakleg grunn for oppseiing skal vidaref\u00f8rast og at kravet til fast tilsetjing
  skal vera hovudregelen.\\n\\nMIDLARTIDEG TILSETJING:\\n\\nDet er viktig her \u00e5
  halda fast at fast tilsetning skal vera hovudregelen, men at ein i nokre tilfeller
  kan tilsetja personar midlartidlig. Dette er ogs\u00e5 fullt mogleg i dag. Lederne
  ynskjer ikkje noko endring p\u00e5 dette omr\u00e5det og st\u00f8ttar ikkje framlegget
  om ein st\u00f8rre tilgang til \u00e5 nytta midlartidlig tilsetjing enn det som
  er tilfelle i dag. Lederne ynskjer \u00e5 strama inn p\u00e5 bruken av midlartidlige
  tilsetjing.\\n\\nLederne opplevar at arbeidsgjevar ofte spekulerar i midlar tidig
  tilsetjing og at folk g\u00e5r som midlartidig tilsette i mange \u00e5r. Her meinar
  me at dert b\u00f8r setjast opp ein frist kor lenge ein kan vera midlartidlig tilsett.\\n\\nMe
  st\u00f8ttar her opp om  s\u00e6rsregel framlegget om rett til fast tilsetjing for
  arbeidstakar som har vore  midlartidleg tilsett etter den \\\"generelle seks m\u00e5neders\\\"
  regelen i til saman tolv m\u00e5nadar i l\u00f8pet av tre \u00e5r. Dette inneber
  at ei verksemd kan utvida perioden for midlartidige arbeidsavtale i inntil eitt
  \u00e5r. Lederne ynskjer ikkje noko d\u00e5rlegare vern her.\\n\\nLedenre har her
  framlegg om at det ikkje skal vera mogleg \u00e5 kalla noko for fast midlartidig
  tilsetjing n\u00e5r dei eigentleg er \\\"faste i praksis\\\". Her b\u00f8r ein setja
  inn ei to\u00e5rsgrensa. Lederne ynskjer ogs\u00e5 \u00e5 vidaref\u00f8ra reglane
  p\u00e5 dette omr\u00e5det og ynskjer at dette ogs\u00e5 skal gjelda for \u00f8verste
  leiar i verksemda.\\n\\nOPPSEIINGSVERNET VED UTSKILLING AV VERKSEMD:\\n\\nLederne
  ynskjer \u00e5 ha eit godt og sikkert oppseiingsvern som g\u00e5r p\u00e5 reglar
  ved utskilling av verksemd. Her st\u00f8ttar me at det kjem inn s\u00e6rsreglar
  som g\u00e5r p\u00e5 oppseiingsvernet ved utskilling av verksemd.\\n\\nFramlegget
  om presiseringar som g\u00e5r p\u00e5 at regelen berre skal gjelda oppseiingar som
  skuldast utskilling av verksemder  si drift der oppdraget vert sett ut til personar
  som er sj\u00f8lvstendige. Her ynskjer me at det i tillegg til sj\u00f8lvstendig
  personar ogs\u00e5 vert teke inn: \\\"verksemder og sj\u00f8lvstendige personar\\\".
  Me ynskjer at oppseiingsvernet vert utvida til \u00e5 gjelda alle grupper arbeidstakarar,
  uavhengig av kva for del av verksemda dei er knytta til. Dette til motsetnad til
  gjeldande reglar i dag som berre omfattar arbeidstakarar knytta til drifta til verksemda
  si ordin\u00e6re drift.\\n\\nInnspel til ny Arbeidslivslov NOU 2004:5  fr\u00e5
  Lederne: Wenche I. Sola, 12.07.2004 side 11 av 16\\n\\nOPPSEIING VED SJUKDOM:\\n\\nLederne
  ser det som viktig \u00e5 fasthalda dei reglane  som g\u00e5r p\u00e5 eit s\u00e6rskilt
  vern mot oppseiing ved sjukdomsfr\u00e5v\u00e6r. Lederne st\u00f8ttar framlegget
  her om \u00e5 gjera lova meir brukarvenleg ved \u00e5 berre forhalda seg til ein
  verneperiode. Me ser ogs\u00e5 at utifr\u00e5 b\u00e5de rimelegheitsomsynet og omsynet
  til meir brukarvenleg regel gjer det meir praktisk \u00e5 operera med ein verneperiode
  p\u00e5 12 m\u00e5nadar.\\n\\nLOVREGULERING AV SUSPENSJON:\\n\\nLederne st\u00f8ttar
  ikkje framlegget om \u00e5 regulera rett for arbeidsgjevar til suspensjonera arbeidstakarar
  i ein tidavgrensa periode. Dette ser me p\u00e5 som ei svekkinga av noverande lovgjeving.\\n\\nRETTEN
  TIL \u00c5 HALDA FRAM I STILLING:\\n\\nLederne g\u00e5r imot framlegget om at regelen
  om \u00e5 st\u00e5 i stilling \\\"snus\\\" dersom oppseiinga vert kjent  gyldig
  og vert p\u00e5anka. Problemet her er at arbeidstakar som ynskjer \u00e5 p\u00e5anka
  ein slik dom m\u00e5 be om ein \\\"kjennelse\\\"  fr\u00e5 retten om \u00e5 st\u00e5
  i stilling. Dersom retten ikkje svarar positivt p\u00e5 dette, vil dette medf\u00f8ra
  ein ekstra stor byrd for arbeidstakaren. Lederne ynskjer \u00e5 halda fast ved reglane
  me har i dag som g\u00e5r retten til \u00e5 halda fram i stilling.\\n\\nFORTRINNSRETT:\\n\\nLederne
  st\u00f8ttar framlegget om \u00e5 vidaref\u00f8ra dagens reglar om fortrinnsrett
  til ny stilling ved ny tilsetjing og er samd i endringa med \u00e5 bytta ut \\\"arbeidsmangel
  \\\" med \\\"virksomhetens forhold\\\".\\n\\nHARMONISERING I H\u00d8VE STILLINGSVERNSREGLAR
  MED TENSESTEMANNSLOVA:\\n\\nLederne st\u00f8ttar framlegget om at stillingsvernet
  i prinsippet b\u00f8r vera det same for privat, kommunal og statleg sektor.Vidare
  st\u00f8ttar Lederne framlegget om at s\u00e6rskilte stillingsverns reglar for arbeidstakarar
  i staten i tenestemannslova vert oppheva og kjem inn under AML. (ALLU) sine reglar.
  Like s\u00e5 st\u00f8ttar Lederne ogs\u00e5 at tenestemannslova si s\u00e6rskilte
  ordning med ekstern fortrinnsrett i staten og reglane om bruk av \u00e5rem\u00e5l
  i staten vert vidaref\u00f8rt i AML. (ALLU).\\n\\nPUNKT 2.8 KAPITTEL 16 ARBEIDSTAKARANE
  SINE RETTAR VED VERKSEMDSOVERDRAGING:\\n\\nLederne ynskjer \u00e5 vidaref\u00f8ra
  reglane me har i dag p\u00e5 dette omr\u00e5der, men ynskjer i tillegg \u00e5 forbetra
  lova p\u00e5 enkelte omr\u00e5der her. Vidare ser Lederne positivt p\u00e5 framlegget
  om \u00e5 styrkja reglane om verksemdsoverdraging p\u00e5 dette omr\u00e5det. Det
  er viktig at s\u00e6ravtalar, tariffavtalar, pensjonsrettar, reservasjon og valrett
  m.a. f\u00e5r same status som l\u00f8nns og arbeidsvilk\u00e5r elles.\\n\\nMe st\u00f8ttar
  framlegget om arbeidstakar sin rett til opptening av pensjon. Vidare ser me ogs\u00e5
  positivt p\u00e5 og st\u00f8ttar framlegget som g\u00e5r p\u00e5 n\u00e5r ny arbeidsgjevar
  har ein pensjonsordning, s\u00e5 kan denne gjerast gjeldande for dei overf\u00f8rte
  arbeidstakarane.\\n\\nInnspel til ny Arbeidslivslov NOU 2004:5  fr\u00e5 Lederne:
  Wenche I. Sola, 12.07.2004 side 12 av 16\\n\\nLederne ynskjer ogs\u00e5 at det vert
  lovfesta at arbeidstakar kan motsetja seg \u00e5 verta overf\u00f8rt til ny arbeids
  gjevar. I tillegg ynskjer me ogs\u00e5 at det skal g\u00e5 fram av lova korleis
  ein skal forhalda seg til ulike avtalar t.d. s\u00e6ravtalar, tariffavtalar m.a.
  og godar, som oftast kjem p\u00e5 kollisjonskurs.\\n\\nFramlegget fr\u00e5 Lederne
  er at arbeidsgjevar skal tilstreba seg p\u00e5 \u00e5 ta det beste ut av dei ulike
  kollektive og individuelle avtalane og godane og laga ein ny felles avtale og ordningar
  som er til felles beste for alle arbeidstakarane b\u00f8r ta. Slik unng\u00e5r ein
  at ein f\u00e5r noko stort svekka vern av tidlegare avtale og godar og at arbeidsgjevar
  spekulerar i dette.\\n\\nPRESISERING AV BRUKSOMR\u00c5DE:\\n\\nVidare er Lederne
  ogs\u00e5 positiv til at uttrykket \\\"innehavar\\\" skal  vert bytta ut og Lederne
  foresl\u00e5r her at fylgjande kjem inn i staden: \\\"skifte av arbeidsgivar og
  overdragelse til ny virksomhet\\\".  I tillegg er ogs\u00e5 Lederne av den meining
  at det kan koma fram i lovteksten at reglane gjeld for samansl\u00e5ing av selskap
  (fusjon) og offentlege verksemder. (Det er ikkje alle personar som les lova som
  veit dette fr\u00e5 f\u00f8r og dette kan vera med \u00e5 gjera dette litt meir
  forst\u00e5leg og enklare).\\n\\nOVERF\u00d8RING AV KOLLEKTIVE PENSJONSORDNINGAR:\\n\\nLederne
  ynskjer \u00e5 vidaref\u00f8ra reglane me har i dag p\u00e5 dette omr\u00e5der,
  men ynskjer i tillegg \u00e5 forbetra lova p\u00e5 enkelte omr\u00e5der her. Vidare
  ser Lederne positivt p\u00e5 framlegget om \u00e5 styrkja reglane om verksemdsoverdraging
  p\u00e5 dette omr\u00e5det der det m.a. ikkje skal vera noko unnatak for pensjonsrettar.
  Det er viktig at s\u00e6ravtalar, tariffavtalar, pensjonsrettar, reservasjon og
  valrett m.a. f\u00e5r same status som l\u00f8nns og arbeidsvilk\u00e5r elles.\\n\\nMe
  st\u00f8ttar framlegget om arbeidstakar sin rett til opptening av pensjon. Vidare
  ser me ogs\u00e5 positivt p\u00e5 og st\u00f8ttar framlegget som g\u00e5r p\u00e5
  n\u00e5r ny arbeidsgjevar har ein pensjonsordning, s\u00e5 kan denne gjerast gjeldande
  for dei overf\u00f8rte arbeidstakarane.\\n\\nLederne ynskjer ogs\u00e5 at det vert
  lovfesta at arbeidstakar kan motsetja seg \u00e5 verta overf\u00f8rt til ny arbeids
  gjevar. I tillegg ynskjer me ogs\u00e5 at det skal g\u00e5 fram av lova korleis
  ein skal forhalda seg til ulike avtalar: s\u00e6ravtalar, tariffavtalar m.a. og
  godar, som oftast kjem p\u00e5 kollisjonskurs. Slik unng\u00e5r ein at ein ikkje
  f\u00e5r noko svekka vern av tidlegare avtale og godar og at arbeidsgjevar spekulerar
  i dette.\\n\\nFramlegget fr\u00e5 Lederne er at arbeidsgjevar skal tilstreba seg
  p\u00e5 \u00e5 ta det beste ut av dei ulike kollektive og individuelle avtalane
  og godane og laga ein ny felles avtale og ordningar som er til felles beste for
  alle arbeidstakarane b\u00f8r ta.\\n\\nRESERVASJONS OG VALRETT:\\n\\nN\u00e5r det
  gjeld retten til \u00e5 motsetja seg \u00e5 verta med over til ny arbeidsgjevar
  og fasthalda arbeidsavtalen med tidlegare arbeidsgjevar. Lederne er samd i at reglane
  p\u00e5 dette omr\u00e5det b\u00f8r lovfestast og g\u00e5 klarare fram i lova.Vidare
  viser  Lederne til framlegget der det vert lagt til grunn at arbeidstakar etter
  gjeldande rett har ein reservasjonsrett her. Her er Lederne samd i at denne retten
  b\u00f8r lovfestast og at det b\u00f8r vera ein frist p\u00e5 14 dagar for \u00e5
  gjera denne reservasjonsretten gjeldande.\\n\\nInnspel til ny Arbeidslivslov NOU
  2004:5  fr\u00e5 Lederne: Wenche I. Sola, 12.07.2004 side 13 av 16\\n\\nLike s\u00e5
  er Lederne ogs\u00e5 samd i framlegget som g\u00e5r ut p\u00e5 \u00e5 lovfesta ein
  fortrinnsrett til ny tilsetjing hj\u00e5 tidlegare arbeidsgjevar for arbeidstakar
  som ut\u00f8var reservasjonsrett. Dette medf\u00f8rer ogs\u00e5 at Lederne ynskjer
  \u00e5 vidaref\u00f8ra valretten i s\u00e6rskilte situasjonar, slik som det g\u00e5r
  fram av rettspraksis. I tillegg st\u00f8ttar ogs\u00e5 Lederne mindretalet som foresl\u00e5r
  at arbeidstakar kan velja \u00e5 halda seg til tidlegare arbeidsgjevar for oppfylling
  av arbeidsavtalen.\\n\\nTARIFFAVTALE INDIVIDUELLE RETTAR:\\n\\nVed verksemdsoverdraging
  vert individuelle rettar og pliktar i arbeidsforhaldet etter tariffavtale  overf\u00f8rt
  til den nye innehavaren. Lederne ynskjer \u00e5 opprett halda denne retten og ynskjer
  ikkje noko svekka vern p\u00e5 dette omr\u00e5det. P\u00e5 bak grunn av dette st\u00f8ttar
  Lederne at det b\u00f8r presiserast i lova at det skal krevjast ei form for aktivitet  fr\u00e5
  partane si sida for at arbeidsgjevar sin avtale skal koma til bruk.\\n\\nLederne
  er st\u00f8ttar ein del av framlegget, men meinar at rettar etter tariffavtalen
  gjeld til tariffavtalen utl\u00f8p. Her ynskjer me ikkje at vilk\u00e5ret   \\\"
  inntil\\\" tariffavtalen sin utl\u00f8p skal vera med, men at tariffavtalen skal
  gjelda ut fristen og til partane aktivt endrar p\u00e5 dette.\\n\\nLederne st\u00f8ttar
  ogs\u00e5 framlegget om at  rettar etter tariffavtalen er i hevd til det vert inng\u00e5tt
  ny tariffavtale som er bindande for den nye arbeidsgjevar og ovanfor dei overf\u00f8rte
  arbeidstakarane. I tillegg ynskjer Lederne at det vert teke med i lovteksten at
  den nye innehavaren skal tilstreba seg p\u00e5 \u00e5 at det beste fr\u00e5 dei
  ulike avtalane inn i ein fellesavtale, n\u00e5r ein skal laga nye avtala. Dette
  gjeld b\u00e5de for individuelle og kollektive avtalar.\\n\\nTARIFFAVTALEN SI STILLING:\\n\\nN\u00e5r
  det gjelder tariffavtalen sin stilling ved verksemdsoverdraging er som tidlegare
  nemnt eit omr\u00e5de der Lederne ynskjer \u00e5 styrkja vernet til arbeidstakar.
  Lederne har hatt mange saker der det har vore konfliktar og stor usemje i h\u00f8ve
  forholda i h\u00f8ve til verksemdsoverdraging. Dette gjeld b\u00e5de i oljerelatert
  verksemd og elles landverksemd. Me ser av den grunn at det er n\u00f8dvendig med
  ei styrking av arbeidstakar sitt vern her.\\n\\nR\u00f8ynsla v\u00e5r p\u00e5 dette
  omr\u00e5det er at det stadig vert ei forverring p\u00e5 dette omr\u00e5det der
  verksemder underbyr kvarandre i h\u00f8ve kontraktar og at dette s\u00e5 skal takast
  att ved redusera l\u00f8nn, sosiale gode, reduksjon av inng\u00e5tt avtalar, l\u00e5gare
  pensjonsavtale og innarbeida gode.\\n\\nGrunnen til at ei verksemd bytter verksemd
  er oftast at eit anna verksemd har skore s\u00e5 til beinet at dei ikkje har forteneste
  p\u00e5 kontrakten sin og av den grunn m\u00e5 skj\u00e6ra ned p\u00e5 sv\u00e6rt
  mykje av opparbeida l\u00f8nner og godar som arbeidarane har fr\u00e5 f\u00f8r.
  Ved verksemdsoverdraging st\u00e5r mange att med eit d\u00e5rlegare vern.\\n\\nLederne
  st\u00f8ttar her framlegget til mindretalet og foresl\u00e5r at hovudregelen vert
  at den nye arbeidsgjevaren vert bunden av tariffavtalen som var gjeldande for den
  opprinnelege arbeidsgjevar ved overf\u00f8ringstidspunktet.\\n\\nINFORMASJON OG
  DR\u00d8FTING:\\n\\nLederne ynskjer ikkje nok svekka vern p\u00e5 dette omr\u00e5det.
  Me ser det som sv\u00e6rt viktig at tidlegare og ny innehavar pliktar s\u00e5 tidleg
  som mogleg \u00e5 dr\u00f8fta overf\u00f8ringa som nemnd i\\n\\nInnspel til ny Arbeidslivslov
  NOU 2004:5  fr\u00e5 Lederne: Wenche I. Sola, 12.07.2004 side 14 av 16\\n\\nAML.
  \u00a7 73 A med dei tillitsvalte. Vidare vil me presisera at me ikkje ynskjer at
  informasjon og dr\u00f8fting skal g\u00e5 om andre enn tillitsvalte. Framlegg om
  at t.d. vernetenesta skal kunna g\u00e5 inn her ser me ikkje p\u00e5 som noko forbetring,
  men tvert i mot ei forverring.\\n\\nDet er viktig at ein held p\u00e5 at det er
  tillitsvalte som skal vera rette vedkomande her. Dette er ogs\u00e5 innarbeida og
  tillitsvalte har som oftast ein god innarbeida praksis korleis dette skal gjerast.
  Lederne ynskjer ikkje at det p\u00e5 dette omr\u00e5det skal skje ei pulverisering
  av ansvarsforhold og kven som skal vera informasjons og dr\u00f8ftingspartar her.\\n\\nLederne
  st\u00f8ttar heller ikkje framlegget om  at det skal stillast noko vilk\u00e5r for
  at verksemda skal ha minst 50 tilsette og at det er fyrst d\u00e5 arbeidsgjevar
  skal informera og dr\u00f8fta med arbeidstakarane sine representantar. Dette er
  eit svekka vern, i h\u00f8ve til det me har i dag.\\n\\nHer vil me p\u00e5peika
  at det er viktig \u00e5 ha med: grunnen til overf\u00f8ringa. Rettslege, \u00f8konomiske
  og sosiale fylgjer av overf\u00f8ringa for arbeidstakarane, planlagde tiltak ovanfor
  arbeidstakarane, fastsett eller foresl\u00e5tt dato for overf\u00f8ringa, i tillegg
  til framlegget til utvalet. Lederne tykkjer at denne paragrafen, AML. \u00a7 73
  E,  er tydeleg og fungerar greitt i praksis og b\u00f8r av den grunn vidaref\u00f8rast
  slik den er. Skal det vera tillegg her b\u00f8r det i s\u00e5 fall vera til gunst
  til arbeidstakarane.\\n\\nLederne opplever i praksis at verksemdoverdraging vil
  auka p\u00e5 i \u00e5ra som kjem og det vil d\u00e5 verta kniving om \u00f8konomiske
  forhald. Mange selskap er interesserte i \u00e5 koma til landet v\u00e5rt og p\u00e5
  norsk Sokkel og p\u00e5 land basert verksemd. Her kan ein lett f\u00e5 sosial dumping
  dersom me ikkje har godt nok regelverk p\u00e5 dette omr\u00e5det. Ein del av dei
  interesserte verksemdene fell vekk n\u00e5r dei forst\u00e5r at dei m\u00e5 fylgja
  norsk regelverk.\\n\\nPUNKT 2.9 KAPITTEL 17 KONTROLL OG OVERVAKING:\\n\\nHer viser
  me til direkte merkander  som me har kommentert i lova.\\n\\nOUTSOURCING:\\n\\nLederne
  ser det som viktig at det ogs\u00e5 kjem lovfestareglar som g\u00e5r p\u00e5 outsourcing.
  Det er viktig at ein brukar norsk ord p\u00e5 dette, men at ein har ordet outsourcing
  i parantes.\\n\\n2.10 KAPITTEL 18 VARSLARE\\n\\nLederne ser positivt p\u00e5 at
  det kjem inn lovfesta reglar som g\u00e5r p\u00e5 varslarar (wistleblowing), der
  arbeidstakar kan f\u00e5 eit vern n\u00e5r vedkomande kjem med kritikkverdige forhold
  ved arbeidsplassen. Dette kan g\u00e5 p\u00e5 kritikkverdige forhold slik som  korrupsjon,
  skadeleg aktivitet, ukultur, ulovlege eg elles etiske tilstandar m.a.\\n\\nLederne
  st\u00f8ttar utvalet sitt framlegg om at det vert lovfesta eit generelt vern mot
  gjengjeldingar av lojalvarsling. Vidare at dette vernet b\u00f8r gjelda alle former
  for gjengjeldingar, dvs. trakkasering, diskriminering, oppseiing, avskjed m.a. Lik
  s\u00e5 at den lovfesta regelen skal gjelda informasjon om kritikkverdige forhold
  i verksemda. Ogs\u00e5 dei som ikkje gjeld arbeidsforholdet.\\n\\nInnspel til ny
  Arbeidslivslov NOU 2004:5  fr\u00e5 Lederne: Wenche I. Sola, 12.07.2004 side 15
  av 16\\n\\nLederne ynskjer i tillegg \u00e5 g\u00e5 litt vidare \u00e5 gje varslarane
  eit sterkare vern ved m.a.\u00e5 ta med ogs\u00e5 andre forhold slik som  korrupsjon,
  skadeleg aktivitet, ukultur, ulovlege eg elles etiske tilstandar m.a.,\\n\\n2.11
  KAPITTEL 19 FORENKLING AV PROSESSREGLAR\\n\\nLederne stiller seg positiv til dette,
  men ein m\u00e5 ogs\u00e5 her hugsa p\u00e5 \u00e5 ta med Petroleumstilsynet der
  dei skal vera med.\\n\\n2.12. KAPITTEL 20 TILSYN , TVISTEL\u00d8YSING OG STRAFF\\n\\nLederne
  ynskjer prim\u00e6rt \u00e5 halda fast p\u00e5 dei reglane me har p\u00e5 dette
  omr\u00e5det fr\u00e5 f\u00f8r. Her m\u00e5 ein hugsa p\u00e5 \u00e5 ta med Petroleumstilsynet
  der det er aktuelt som tilsyn.\\n\\n2.13 KAPITTEL 21 FORENKLING OG IKKJE \u2013MATERIELLE
  ENDRINGAR\\n\\nLederne st\u00f8ttar dette.\\n\\nVenleg helsing Lederne\\n\\nWenche
  I. Sola                 Leif Tore Skaalerud              Leif Sundstr\u00f8m\\n\\nLederne
  Postboks 2523, Solli 0202 OSLO\"", "\"Ulstein tensinG KFUK-KFUM\\n\\nDeira gode
