  R\u00e5dgjevargruppa\\n\\nTerje Kallekleiv\\n\\nAvgjerslemynde:\\n\\nArkivnr.: 14/140\\n\\nKlassering:\\n\\nKulturminneplan
  2019\\n\\nFormannskapet legg utkastet til kulturminneplan ut p\u00e5 h\u00f8yring
  i 6 veker \u2013 i samsvar med plan- og bygningslova \u00a711-14 - for \u00e5 f\u00e5
  innspel til planen - og evt. f\u00e5 nye innspel om aktuelle kulturminne som b\u00f8r
  inng\u00e5 i planen. Innspel til m\u00e5 vera levert innan 14.10.2019\\n\\nSaksopplysningar:\\n\\nBakgrunn/
  Fakta\\n\\nKommunestyret vedtok 13.12.2016, sak 90/2016 - \u00e5 starta opp arbeidet
  med ny kulturminneplan i medhald av plan- og bygningslova \u00a711-12. Eit utkast
  til kulturminneplan er no klar til politisk handsaming.\\n\\nVedtaket i kommunestyre
  var berre dels i samsvar med kommunen sin planstrategi som vart vedteken i kommunestyre
  28.09.2016. I planstrategien er kulturminneplanen definert som ein temaplan \u2013
  d.v.s. utan lovheimla krav til prosess. I oppstart-vedtaket vart planarbeidet derimot
  heimla i plan- og bygningslova som ein kommunedelplan \u2013 med kl\u00e5re krav
  til prosess.\\n\\nFormannskapet vedtok planprogrammet for arbeidet 16.01.2018. I
  den st\u00e5r det m.a. f\u00f8lgjande:\\n\\n\u00abDen kommunale planstrategien seier
  at kulturminneplanen skal vera ein temaplan. For at flest mogeleg skal f\u00e5 h\u00f8ve
  til \u00e5 uttala seg undervegs i prosessen og sikra breiast mogeleg deltaking,
  vil planarbeidet likevel f\u00f8lgje prosesskrava i plan- og bygningslova.\u00bb\\n\\nSamla
  sett vurderer r\u00e5dmannen at planarbeidet m\u00e5 f\u00f8lgje ein formell prosess
  som kommunedelplan.\\n\\nAt planframlegget blir sendt p\u00e5 h\u00f8yring ein periode
  har den fordel at kommunen f\u00e5r innspel til arbeidet \u2013 samtidig som det
  opnar for registrering av kulturminne som til no ikkje er registrert. Ut over dette
  kan ein formell prosess etter plan- og bygningslova synast noko omfattande. Kulturminneplanen
  vil uansett ikkje representera noko direkte juridisk styrkingsverkt\u00f8y. Det
  m\u00e5 i s\u00e5 fall konkretiserast i arealdelen til kommuneplanen eller i reguleringsplan.\\n\\nR\u00e5dmann
  si vurdering er difor at formannskapet evt. kan leggje saksprosessen i saka fram
  for kommunestyre p\u00e5 nytt slik at dette f\u00e5r ei djupare utgreiing, dersom
  det er \u00f8nskjeleg. Slik saka st\u00e5r no er r\u00e5dmannen si vurdering at
  administrasjonen legg opp til ein prosess i samsvar med Plan- og bygningslova fordi
  dette er r\u00e5dmannen si oppfatning av kommunestyret si bestilling. Det betyr
  at planutkastet skal ut p\u00e5 h\u00f8yring i minst 6 veker. I etterkant av h\u00f8yringa
  skal det utarbeidast ein handlingsplan til kulturminneplanen slik at vi f\u00e5r
  ei prioritering av kulturminne og tiltak. Gjennom h\u00f8yringa opnar vi for \u00e5
  gje tilbakemelding om korleis kommunen skal handtere forvaltninga av kulturminne
  framover, og vi tenkjer dette kan vera ein tenleg framgangsm\u00e5te.\\n\\nVurdering/
  Konklusjon\\n\\nFormannskapet legg framlegget til kulturminneplan ut p\u00e5 h\u00f8yring
  i 6 veker \u2013 i samsvar med plan- og bygningslova \u00a711-14 - for \u00e5 f\u00e5
  innspel til planen - og f\u00e5 nye innspel om aktuelle kulturminne som b\u00f8r
  inng\u00e5 i planen. Innspel til m\u00e5 vera levert innan 14.10.2019.\\n\\nIkkje
  vedlagte saksdokument:\\n\\nDoknr Type Dato\\n\\nTittel p\u00e5 saksdokumentet\\n\\nDoknr
  Type Dato\\n\\nTittel p\u00e5 journalpost\\n\\nVedlagte saksdokument:\"", "\"Nordfjordrittet
  2015\\n\\nSandane Sykkelklubb vil takke syklistar, funksjon\u00e6rar og v\u00e5re
  samarbeidspartnarar for at 2015-utg\u00e5va av Nordfjordrittet vart ein suksess!\\n\\nResultat
  og bilde er lagt ut under flikane \\\"Resultat\\\" og \\\"Galleri\\\".\\n\\nSFE
  er hovudsamarbeidspartnar for Nordfjordrittet. Sandane Sykkelklubb vil takke for
  det gode samarbeidet med alle v\u00e5re partnarar, og SFE spesielt! Bidraga fr\u00e5
  desse, samt dugnadsviljen i idrettslaga i Nordfjord, ER N\u00f8tter\u00f8y, Fjell
  og Hyllestad.\"", "\"Innovasjon og n\u00e6ringsutvikling INN - Naturressursar, landbruk
  og reiseliv\\n\\nV\u00e5r referanse\\n\\nDato\\n\\n2021/5715-2\\n\\n19.04.2021\\n\\nKOMMUNAL-
  OG MODERNISERINGSDEPARTEMENTET Postboks 8112 DEP 0032 OSLO\\n\\nInnspel - omstillingsutfordringar
  som f\u00f8lgje av akutte endringar i arbeidsmarknaden - statsbudsjettet 2022 -
  kap. 553 - post 65\\n\\nVi syner til dykkar brev der det vert orientert om h\u00f8vet
  til \u00e5 melde inn omstillingsutfordringar som f\u00f8lgje av akutte endringar
  i arbeidsmarknaden.\\n\\nM\u00e5let med omstillingsordninga er at ho skal styrke
  n\u00e6ringsgrunnlaget og bidra til \u00e5 etablere nye arbeidsplassar i kommunar
  eller regionar som opplever vesentleg reduksjon i sysselsettinga.\\n\\nVi melder
  med dette inn:\\n\\n- Hyllestad kommune der ei hj\u00f8rnesteinsbedrift st\u00e5r
  framfor ei omfattande nedskalering av arbeidsstokken.\\n- Ein reiselivsregion i
  Vestland med kommunane Aurland, Ulvik og Eidfjord, der pandemien har f\u00f8rt til
  stor arbeidsl\u00f8yse innan reiselivet.\\n\\nFelles for desse kommunane er at dei
  er sm\u00e5, har einsidig n\u00e6ringsgrunnlag og at h\u00f8g arbeidsl\u00f8yse
  kan f\u00e5 store og negative konsekvensar for innbyggartalet. Dei har ogs\u00e5
  det til felles at pendling i mindre grad vil vere ei l\u00f8ysing p\u00e5 utfordringane
  dei st\u00e5r i, eller st\u00e5r framfor.\\n\\n| Omstillingsomr\u00e5de | Hj\u00f8rnesteinsbedrift/-
  n\u00e6ring | Omstillingsperiode | Mill. kr 2022 KMD |\\n|---|---|---|---|\\n| Hyllestad
  | New Havyard Ship Technology | 6 \u00e5r | 4 |\\n| Aurland, Eidfjord, Ulvik | Reiseliv
  | 4 \u00e5r | 5 |\\n\\nHyllestad\\n\\nHyllestad har per i dag ikkje h\u00f8g arbeidsl\u00f8yse,
  men varsla oppseiingar innan verftsindustrien kan endre p\u00e5 dette i l\u00f8pet
  av 2021. Kommunen har starta omstillingsarbeid som skal bidra til ny sysselsetjing
  for dei som misser arbeidet sitt. Omstillingsmidlar kan bidra til \u00e5 vidaref\u00f8re
  dette viktige arbeidet og gjere at ein kan halde fram med \u00e5 l\u00f8yse utfordringane
  f\u00f8r dei f\u00e5r vekse seg store.\\n\\nN\u00e6ringsstruktur\\n\\nI Hyllestad
  kommune var det 4. kvartal 2021 1294 innbyggarar. Kommunen er ein av kommunane med
  mest einsidig n\u00e6ringsstruktur i Vestland, b\u00e5de i privat sektor og samla.
  Utdanningsniv\u00e5et er mellom dei l\u00e5gaste i fylket og kommunen er ein av
  dei i fylket med h\u00f8gast fors\u00f8rgjarbyrde for eldre.\\n\\nKommunen har ogs\u00e5
  den nest h\u00f8gaste delen av sysselsetting innan konkurranseutsette n\u00e6ringar
  i fylket. 33 % var sysselsett i industrien i 2019, som er den 12. h\u00f8gaste sysselsettingsdelen
  i industrien i landet. 22 % jobba i helse og sosial. 1 Ved sida av kommunen, er
  verftet Havyard New Ship Technology den klart st\u00f8rste arbeidsgjevaren.\\n\\nHistorisk
  har Hyllestad hatt ei arbeidsl\u00f8yse som har svinga med konjunkturane til verftsn\u00e6ringa.
  Arbeidsl\u00f8ysa var relativt h\u00f8g etter finanskrisa, f\u00f8r den tidleg p\u00e5
  2010-talet var langt l\u00e5gare enn fylkessnittet. I samband med oljekrisa i 2015
  var arbeidsl\u00f8ysa igjen relativt h\u00f8g, f\u00f8r den var l\u00e5g dei siste
  tre-fire \u00e5ra f\u00f8r pandemien.\\n\\nHavyard New Ship Technology er eit dotterselskap
  i Havyard Group. Marknaden for \u00e5 bygge nye skip og h\u00f8ve til byggfinansiering
  vart utfordrande i 2020 og er venta \u00e5 vere det framover. Havyard Group har
  difor gjort eit strategisk val om \u00e5 legge ned bygging av skip i Hyllestad.
  Havyard New Ship Technology skal i l\u00f8pet av 2021i staden omstillast til \u00e5
  bli eit service- og reperasjonsverft. Omlegginga til eit verft for reparasjon, vedlikehald
  og ombygging gjer at verftet no er inne i ein prosess for \u00e5 redusere tal fast
  tilsette med 110 \u00e5rsverk i l\u00f8pet av 2021. Av desse er omlag 70% busette
  i Hyllestad kommune, 20% i H\u00f8yanger kommune og 10% i Fjaler kommune.\\n\\nI
  desember 2020 sette Hyllestad kommune i gang eit prosjekt med avb\u00f8tande tiltak
  i samarbeid med Aksello, nabokommunar og fylkeskommunen. Per mars 2021 melder prosjektet
  at 65 av dei 110 som misser jobben, har f\u00e5tt avklara sin situasjon. Desse har
  anten f\u00e5tt tilbod fr\u00e5 ny arbeidsgjevar, vil ta utdanning eller vil g\u00e5r
  av med pensjon n\u00e5r verftet ikkje har bruk for dei lenger. Per no er situasjonen
  s\u00e5leis uavklara for 45 personar. Havyard New Ship Technology har seks nybygg
  som skal ferdigstillast i 2021. Nedbemanninga vil skje i takt med at nybygga blir
  ferdige. Dei som misser arbeidet sitt ved verftet vil difor ikkje kome fram i statistikken
  som syner utvikling i tal arbeidss\u00f8karar fr\u00e5 mars 2020 til mars 2021:\\n\\nUtvikling
  i tal arbeidss\u00f8karar\\n\\n1 Sysselsetting etter arbeidsstad, registerbasert.
  SSB tabell 12539.\\n\\nTal arbeidss\u00f8kjarar i Hyllestad var relativt stabilt
  det siste \u00e5ret f\u00f8r koronapandemien, og l\u00e5g p\u00e5 15-18 personar
  (2,3%). D\u00e5 pandemien slo til, auka tal arbeidss\u00f8kjarar mykje. Toppunktet
  var p\u00e5 152 (21,6%) arbeidss\u00f8kjarar i april 2020. Dette hadde samanheng
  med omfattande permetteringar i verftsn\u00e6ringa og tilst\u00f8ytane verksemder.
  Situasjonen betra seg over sommaren. Sidan september 2020 har talet vore stabilt
  p\u00e5 35-38 personar (5-5,5%). Samanlikna med situasjonen f\u00f8r pandemien er
  dette omlag ei dobling. I mars 2021 er delen arbeidss\u00f8kande nede i 4,8 %. Omlag  halvparten
  av desse har vore arbeidss\u00f8kjarar i meir enn 26 veker.\\n\\nKommentar om konsekvensberekningar
  i Omstillingsmodulen\\n\\nVi har k\u00f8yrt konsekvensberekningar i Omstillingsmodulen
  i modellsystemet Panda, men resultata gir etter v\u00e5r meining ikkje eit rett
  bilete av kva konsekvensar eit bortfall av vel 40 arbeidsplassar vil ha for Hyllestad.
  Modellen syner at uansett tilpassing til ledigheit, vil bortfallet generere tiln\u00e6rma
  eller lik ingen indirekte konsekvensar (ringverknader). V\u00e5r klare meining og
  forst\u00e5ing etter dialog med styret i Panda analyse, er at Omstillingsmodulen
  ikkje fungerer etter hensikta for Hyllestad sin del. Grafar og prosjektdata for
  k\u00f8yringane er tilgjengelege om \u00f8nskeleg.\\n\\nAurland, Ulvik og Eidfjord\\n\\nDette
  er tre sm\u00e5 kommunar med relativt einsidig n\u00e6ringsliv og med mange arbeidsplassar
  knytt til reiseliv. B\u00e5de Aurland og Eidfjord har hamner for cruiseskip. Cruise-n\u00e6ringa
  er viktig for reiselivet b\u00e5de i vertskommunane, men og i nabokommunane. I Ulvik
  er det gruppereisande turistar fr\u00e5 Asia og Europa som har utgjort storparten
  av dei bes\u00f8kande i sommarhalv\u00e5ret. I vinterhalv\u00e5ret har hotella teke
  imot kurs og konferansegjester.\\n\\nRegionen som kommunane ligg i er tung innan
  reiseliv, og kommunane utfyller kvarandre p\u00e5 ein god m\u00e5te. Til d\u00f8mes
  har Aurland som er ein typisk sommardestinasjon, gjennom samarbeid med vinterdestinasjonen
  Voss sikra heil\u00e5rs arbeidsplassar innan reiselivet. Nabokommunane er ogs\u00e5
  reiselivskommunar og pendling er difor i mindre grad ei l\u00f8ysing p\u00e5 utfordringane
  som dei tre kommunane st\u00e5r i.\\n\\nDet er uvisst om turistn\u00e6ringa nokon
  gong vil bli som f\u00f8r pandemien, og om det skjer vil det ta tid. Reiselivet
  m\u00e5 omstille seg til nye marknader og ta i bruk ny teknologi. Elektrifisering
  er til d\u00f8mes aktuelt p\u00e5 fleire omr\u00e5de, b\u00e5de p\u00e5 land og
  sj\u00f8. Omstillingsmidlar vil vere med \u00e5 bidra til \u00e5 utvikle ei \u00abgr\u00f8nare\u00bb
  reiselivsn\u00e6ring, men ogs\u00e5 kunne bidra til \u00e5 skape andre former for
  ny n\u00e6ringsaktivitet i regionen \u2013 der ein strekkjer seg etter visjonen
  attraktivitet gjennom berekraft.\\n\\nVedtak om 0-utslepp i verdsarvfjordane fr\u00e5
  2026 er venta \u00e5 gje konsekvensar for cruisetrafikken til Fl\u00e5m i Aurland.
  For Aurland vil omstillingsmidlar vere viktig for \u00e5 gjere kommunen mindre avhengig
  av cruiseturisme og halde oppe arbeidsplassar p\u00e5 kort sikt, og for \u00e5 legge
  til rette for meir klimavenleg cruisetrafikk p\u00e5 lenger sikt. Vedtak om 0utslepp
  i verdsarvfjordane er ei utfordring som vi har til felles med M\u00f8re og Romsdal
  fylkeskommune. Vi ynskjer \u00e5 arbeide saman med M\u00f8re og Romsdal for \u00e5
  ta tak i denne utfordringa, og dette vil vi kome tilbake til ved eit seinare h\u00f8ve.\\n\\nDei
  tre reiselivskommunane Aurland, Ulvik og Eidfjord har mange felles utfordringar,
  men kommunane ser ogs\u00e5 stort potensial til \u00e5 utvikle nye reiselivsprodukt,
  rette seg mot nye marknader og ta i bruk ny teknologi. Dei ynskjer \u00e5 utvikle
  samarbeidet seg i mellom, for \u00e5 ta ut dette potensialet. Kapasitet og \u00f8konomi
  er viktige hinder. Omstillingsmidlar vil vere viktig for \u00e5 lukkast.\\n\\nN\u00e6ringsstruktur\\n\\nAurland
  har ein relativt einsidig n\u00e6ringsstruktur. 12 % av dei sysselsette i Aurland
  i 2019 jobba innan overnatting- og serveringsverksemd, noko som er sjette mest i
  landet. Dei har ogs\u00e5 h\u00f8gast del sysselsette innan forretningsmessig tenesteyting
  i landet med 13 %. Dei fleste verksemdene innan denne n\u00e6ringskoden i Aurland
  er knytt til reiseliv. Elles jobbar 22 % innan helse og sosial. 2\\n\\nUlvik er
  mellom kommunane med mest einsidig n\u00e6ringsstruktur i Vestland, b\u00e5de i
  privat sektor og samla. 16 % av dei sysselsette jobba innan overnattings- og serveringsverksemd.
  Det er nest mest i landet. Elles jobbar 16 % i undervisning og 25 % innan helse
  og sosial, slik at kommunen har ein relativt h\u00f8g del offentlege arbeidsplassar.
  Med 3 % av dei sysselsette innan jordbruk, skogbruk og fiske har kommunen ogs\u00e5
  relativt h\u00f8g del av si sysselsetting innan naturbaserte n\u00e6ringar. Ulvik
  er ogs\u00e5 ein av kommunane i fylket med h\u00f8gast fors\u00f8rgjarbyrde i fylket.\\n\\nEidfjord
  er mellom kommunane med mest einsidig n\u00e6ringsstruktur i Vestland, b\u00e5de
  i privat sektor og samla. 8 % jobbar i elektrisitet, vatn og renovasjon, som er
  \u00e5ttande mest i landet. Dette er i all hovudsak knytt til vasskraft. I tillegg
  har dei 8 % som jobbar innan overnattings- og serveringsverksemd og 7 % innan forretningsmessig
  tenesteyting. Dette er h\u00f8vesvis 17. og 20. mest i landet, og begge n\u00e6ringane
  er tett knytt til reiseliv. Dei har ogs\u00e5 ein h\u00f8g del offentlege arbeidsplassar
  med 24 % som jobbar innan helse og sosial, 10 % innan undervisning og 8 % i offentleg
  administrasjon.\\n\\nHistorisk har dei utvalde kommunane har hatt ei arbeidsl\u00f8yse
  som har vore l\u00e5gare enn b\u00e5de fylkes- og landssnittet. Dei siste \u00e5ra
  har spesielt ungdom hatt l\u00e5gare arbeidsl\u00f8yse enn andre kommunar i fylket.\\n\\nUtvikling
  i tal arbeidss\u00f8karar Aurland, Eidfjord og Ulvik\\n\\n2 Sysselsetting etter
  arbeidsstad, registerbasert. SSB tabell 12539.\\n\\nTal arbeidss\u00f8kjarar i dei
  utvalde kommunane var relativt stabilt det siste \u00e5ret f\u00f8r koronapandemien
  slo til, om enn med ein viss grad av sesongvariasjon med l\u00e5gast ledigheit p\u00e5
  sommaren. Da pandemien slo til, auka tal arbeidss\u00f8kjarar sterkt i alle tre
  kommunane, men klart mest i Aurland. Situasjonen betra seg over sommaren, men arbeidsl\u00f8ysa
  har vore stigande sidan hausten 2020, spesielt i Aurland. Samanlikna med mars 2019
  er tal arbeidss\u00f8kjarar i mars 2021 rundt dobbelt s\u00e5 h\u00f8gt i Eidfjord
  og Ulvik. I Aurland er tal arbeidss\u00f8kjarar nesten 10 gongar s\u00e5 h\u00f8g!\\n\\nArbeidss\u00f8kjarar
  som del av arbeidsstyrken har den same sesongvariasjonen som i reine tal, med klart
  l\u00e5gast ledigheit i turistsesongen. Dei 12 m\u00e5nadene f\u00f8r pandemien
  slo til for fullt var snitt arbeidss\u00f8kjarar som del av arbeidsstyrken 3,2 %
  i Eidfjord, 4,4 % i Ulvik og 2,3 % i Aurland. Etter at pandemien kom for fullt auka
  ogs\u00e5 desse tala mykje i alle tre kommunane. Ulvik hadde ein forel\u00f8pig
  topp i mars 2020, da 17,6 % av arbeidsstyrken var arbeidss\u00f8kjarar, medan Eidfjord
  og Aurland hadde sine toppar i april 2020 med h\u00f8vesvis 15,3 % og 28,6 %. Dei
  12 m\u00e5nadene fr\u00e5 mars 2020 til februar 2021 var i snitt 9,7 % av arbeidsstyrken
  i Eidfjord arbeidss\u00f8kjande, medan tilsvarande i Ulvik var 11,5 % og Aurland
  16,8 %.\\n\\nPer mars 2021 var 9,8 % av arbeidsstyrken i Eidfjord, 10,5 % i Ulvik
  og 16,6 % i Aurland, arbeidss\u00f8kjande. 5,6 % av arbeidsstyrken i Ulvik, 5,1
  % i Eidfjord og 5,8 % i Aurland har vore arbeidss\u00f8kjande i meir enn 26 veker.\\n\\nKommentar
  om konsekvensberekningar i Omstillingsmodulen\\n\\nVi har k\u00f8yrt konsekvensberekningar
  i Omstillingsmodulen i modellsystemet Panda, men resultata gir etter v\u00e5r meining
  ikkje eit rett bilete av kva konsekvensar eit bortfall av om lag 150 arbeidsplassar
  vil ha for Eidfjord, Ulvik og Aurland. Modellen syner at uansett tilpassing til
  ledigheit, vil bortfallet generere veldig sm\u00e5 indirekte konsekvensar (ringverknader).
  V\u00e5r klare meining og forst\u00e5ing etter dialog med styret i Panda analyse,
  er at Omstillingsmodulen ikkje fungerer etter hensikta for desse kommunane. Grafar
  og prosjektdata for k\u00f8yringane er tilgjengelege om \u00f8nskeleg.\\n\\nAvsluttande
  merknader\\n\\nVi har hatt samtaler med dei nemnde kommunane, og vi ser at dei vil
  ha nytte av ein omstillings- og utviklingsinnsats. Ta gjerne kontakt om de treng
  ytterlegare opplysningar.\\n\\nMed helsing\\n\\nB\u00e5rd Sandal fylkesdirekt\u00f8r\\n\\nEndre
  H\u00f8galmen seksjonssjef naturressurs, landbruk og reiseliv\\n\\nBrevet er elektronisk
  godkjent og har difor inga handskriven underskrift\"", "\"Vik skule og barnehage
  5568 Vikebygd Vikevegen 1266\\n\\nTlf.  Skule:  53655730\\n\\nBarnehage: 53655739\\n\\nDato:  29.09.20\\n\\nReferat
  fr\u00e5 m\u00f8te i samarbeidsutvalet Vik skule og barnehage 29.09.20\\n\\nDesse
  m\u00f8tte:\\n\\n2 elevrepresentantar: Eirik Andersen S\u00e6tre og S\u00f8lve H\u00e5land
  Gjerde\\n\\nFr\u00e5  FAU p\u00e5 skulen: Elin S\u00e6tre og Elisabeth Winterhus
  Julsrud\\n\\nFr\u00e5 andre tilsette p\u00e5 skulen: Berit Skartland\\n\\nFr\u00e5
  tilsette i barnehagen: Ellen Skretteberg og Anne Byrkja\\n\\nFr\u00e5 foreldrer\u00e5det
  i barnehagen:  Tonje Strand Alne og Sandra Marie B. S\u00e6lemyr\\n\\nFr\u00e5 undervisningspersonalet:
  Ingrid L. Sandvik\\n\\nFor kommunen : Anne Marte W. Tveit og Tormod Sandsg\u00e5rd\\n\\nSak
  1 Orientering om arbeidet i samarbeidsutvalet\\n\\nVed kvar skule skal det vere
  eit samarbeidsutval med representantar fr\u00e5 tilsette, foreldre, elevar og kommunen.
  Ved Vik skule og barnehage er det felles samarbeidsutval for skulen og barnehagen.
  Anne Marte orienterte om arbeidet i samarbeidsutvalet (SU). SU har rett til \u00e5
  uttala seg om alle saker som gjeld skulen eller barnehagen. Det er til vanleg SU
  som er h\u00f8yringsinnstans for saker fr\u00e5 kommunen.\\n\\nSak 2 Konstituering
  Val av leiar og nestleiar.\\n\\nElisabeth Winterhus Julsrud  blei valt til leiar
  Sandra Marie B. S\u00e6lemyr  blei valt til nestleiar\\n\\nSak 3 Godkjenning av
  \u00e5rsplan for barnehagen\\n\\nAnne gjekk gjennom \u00e5rsplanen for barnehagen.
  \u00c5rsplanen er skriven med utgangspunkt i ein kommunal mal. Anne orienterte mellom
  anna om satsingsomr\u00e5da dette barnehage\u00e5ret som er BTI og ReKom. BTI, Betre
  Tverrfagleg Innsats, er ein samhandlingsmodell for tverrfagleg samarbeid for barn
  og unge. Fr\u00e5 01.08.20 skal denne brukast fullt ut  i heile kommunen. ReKom
  st\u00e5r for Regional kompetanseutvikling.  Alle dei kommunale barnehagane i kommunen
  er med p\u00e5 dette, og  me samarbeidar med H\u00f8gskulen p\u00e5 Vestlandet.
  I arbeidet er det b\u00e5de samarbeid mellom barnehagane og arbeid med eigne problemstillingar.
  Me i Vikebygd barnehage har valt problemsitllingen; \u00abKorleis gjennomf\u00f8re
  eit harmonisk m\u00e5ltid for barn og tilsette i barnehagen\u00bb.\\n\\nDet blei
  gjort ei lita endring med ei ekstra underoverskrift i avsnittet om Sjukdom og Covid19.
  Etter dette blei \u00e5rsplanen godkjent.\\n\\nSak 4 Diverse orienteringssaker\\n\\n*
  Covid -19\\n\\nMe f\u00f8lger heile tida smittevernreglane som er gjeldande. Barnehage
  og skulekvardagen har n\u00e5 i haust ikkje vore mykje annleis enn f\u00f8r koronaen.
  Barnehagen fungerer som ein kohort, 1.-4. klasse som ein og 5.-7. klasse som ein.
  Alle skuleelevane kan likevel vere i lag ute i friminutta.     Me kan f\u00f8rebels
  ikkje ha morgon-SFO saman med  barnehagen slik me pleier, og har difor bestillings-SFO
  fr\u00e5 dag til dag om morgonen.\\n\\n* Skulen sine satsingsomr\u00e5de\\n\\nNye
  l\u00e6replanar\\n\\nHovudsatsingsomr\u00e5det v\u00e5rt i \u00e5r er \u00e5 innf\u00f8ra
  og bruka  ny l\u00e6replan for grunnskulen som blei igjort gjeldande fr\u00e5 01.08.2020.  Me
  erfarer at mykje er likt som f\u00f8r i norsk og matte i begynnaroppl\u00e6ringa.
  I andre fag kjem meir tverrfaglege tema og  tverrfagleg arbeid inn heilt fr\u00e5
  1. trinn. Meir tverrfagleg arbeid gjer at me f\u00e5r meir tid til \u00e5 bil i
  stoffet og kan f\u00e5 tid til \u00e5 gjere meir kjekke ting / andre ting. Elevane
  skal dr\u00f8fte, utforske, reflektere og sj\u00e5 samanhengar. Dei skal ikkje berre
  tilegne seg kunnskap, men og kunne bruke den. Tverrfaglege tema: Skulen jobbar n\u00e5
  med \u00e5 leggje til rette for god l\u00e6ring innanfor dei tre tverrfaglige tema:
  folkehelse og livsmestring, demokrati og medborgarskap, og b\u00e6rekraftig utvikling.
  Dette er ikkje eigne fag, men tema som skal komme inn i alle fag. Temaa tar utgangspunkt
  i aktuelle samfunnsutfordringar som krev engasjement og innsats fr\u00e5 kvar enkelt
  og fellesskapet  b\u00e5de i lokalsamfunnet, nasjonalt og globalt.\\n\\nElevrepresentantane
  S\u00f8lve og Eirik viste og fortalde om noko av det dei n\u00e5 jobbar med p\u00e5
  skulen, og som har utgangspunkt i dei nye l\u00e6replanane. Dei hadde jobba mykje
  med nettvett og hadde laga ein artig film om nettvettreglane. Dei fortalte og om
  bruk av nytt digitalt l\u00e6reverk i matematilkk, Campus Matte, og om Super:bit
  opplegget i programmering som dei hadde hatt denne veka.  Tusen takk til Eirik og
  S\u00f8lve.\\n\\n* Barnehagen sine satsingsomr\u00e5de\\n\\nDesse blei tatt opp
  under behandling av \u00e5rsplanen for barnehagen.\\n\\n* Vedtatt rulleringsplan
  for lokale tema p\u00e5 skulen.\\n\\nTema i \u00e5r: \u00ab\u00c5lfjorden\u00bb.
  Kulturettermiddagen blir 8.juni. Dette blir det 14. \u00e5ret me brukar temaplanen
  for lokale tema. Me jobbar med tema i ca. 3 veker og avsluttar alltid med kulturettermiddag
  i samarbeid med FAU. Me h\u00e5par det kan bli mogleg dette skule\u00e5ret og.\\n\\nSak
  5\\n\\nBudsjettsituasjonen ved eininga er OK og me reknar med \u00e5 halde budsjettramma.\\n\\nSak
  6 Barnehage og skulebruksplan\\n\\nSU skal ikkje vere direkte h\u00f8yringsinstans
  for barnehage og skulebruksplanen. Foreldrerepresentantane som er med i SU tar dette
  arbeidet vidare til foreldrer\u00e5da i skulen og barnehagen. Dei vel sj\u00f8lv
  om dei vil samarbeide om ein felles uttale fr\u00e5 barnehage og skule p\u00e5 eininga,  eller
  om dei vil sende h\u00f8yringsuttale kvar for seg.  Kvar enkelt person kan og sende
  inn eigen h\u00f8yringsuttale.\\n\\nElevr\u00e5det kan sende ein eigen h\u00f8yringsuttale.
  Skulen ser til at dei f\u00e5r h\u00f8ve til det. Tilsette  skal ikkje skrive uttale  saman
  med f\u00f8resette og elevar. Dei skriv eigne h\u00f8yringsuttaler, gjerne saman
  med fagorganisasjonane.\\n\\nMe har ikkje f\u00e5tt datoar for prosessen vidare,
  og datoar for h\u00f8yringsfrist og kontordagar ute i bygdene er ikkje sett.\\n\\nInfo
  om skulebruksplanen finn ein p\u00e5 Vindafjord kommune si heimeside under: Oppvekst,
  skule og familie - Nytt fr\u00e5 oppvekst. https://www.vindafjord.kommune.no/oppvekst-skuleog-familie/nytt-fra-oppvekst/\\n\\nAnne
  Marte W. Tveit\\n\\nSkrivar\"", "\"F\u00f8resegner og retningslinjer\\n\\nPlan:\\n\\nPlanid:     140120110106\\n\\nOMR\u00c5DEREGULERING
