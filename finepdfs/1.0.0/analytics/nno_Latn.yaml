sample: '["\"V\u00earvarsel for Indre Nore\\n\\nMeteogrammet for Indre Nore onsdag
  kl 19 til fredag kl 19\\n\\nLangtidsvarsel for Indre Nore\\n\\n| I morgon 27.06.2019
  | Fredag 28.06.2019 | Laurdag 29.06.2019 | Sundag 30.06.2019 | M\u00e5ndag 01.07.2019
  | Tysdag 02.07.2019 | Onsdag 03.07.2019 | Torsdag 04.07.2019 |\\n|---|---|---|---|---|---|---|---|\\n|
  14\u00b0 | 12\u00b0 | 15\u00b0 | 15\u00b0 | 12\u00b0 | 9\u00b0 | 10\u00b0 | 11\u00b0
  |\\n| Delvis skya. Svak vind, 3 m/s fr\u00e5 vest- nordvest. 0 mm nedb\u00f8r. |
  Skodde. Lett bris, 4 m/s fr\u00e5 s\u00f8rvest. 0 mm nedb\u00f8r. | Regnbyer. Lett
  bris, 4 m/s fr\u00e5 s\u00f8rvest. 2,3 mm nedb\u00f8r. | Regn. Svak vind, 3 m/s
  fr\u00e5 s\u00f8r-s\u00f8rvest. 3,8 mm nedb\u00f8r. | Regn. Lett bris, 5 m/s fr\u00e5
  nordvest. 2,7 mm nedb\u00f8r. | Regn. Laber bris, 6 m/s fr\u00e5 nord-nordvest.
  3,1 mm nedb\u00f8r. | Regn. Laber bris, 6 m/s fr\u00e5 nordvest. 3,5 mm nedb\u00f8r.
  | Skya. Lett bris, 4 m/s fr\u00e5 nord-nordvest. 0 mm nedb\u00f8r. |\\n\\nLangtidsvarselet
  viser venta v\u00ear p\u00e5 dagtid. Temperatur- og vindvarselet gjeld for kl 12,
  symbolet og nedb\u00f8rvarselet for kl 12-18. Prognosekvaliteten er sv\u00e6rt god
  dei fyrste dagane, men blir d\u00e5rlegare utover i perioden.\\n\\nwww.yr.no/stad/Noreg/Sogn_og_Fjordane/V\u00e5gs\u00f8y/Indre_Nore~2837754/\"",
  "\"Protokoll Norsk kulturskoler\u00e5d Vestland\\n\\n\u00c5rsm\u00f8te: 2021\\n\\nTid:
  28.10 2021 kl.13:30\\n\\nStad: Bergen, Grand Hotel Terminus\\n\\nKulturskulekalenderen
  2021: Collage av visuelle kunstuttrykk fr\u00e5 elevar i kulturskular fr\u00e5 Vestland
  fylke.\\n\\nINNHALDSLISTE\\n\\nInnleiande kommentarar til protokollen\\n\\n1. Protokollen
  sitt innhald er i tr\u00e5d med forretningsorden for Norsk kulturskoler\u00e5d pkt.
  9: \u00abI protokollen vert berre f\u00f8rt framsette framlegg, avstemmingsresultat
  og vedtak.\u00bb\\n\\n\u00c5rsm\u00f8tedokumenta med sakskart og styremeldinga er
  \u00e5 finne her: https://www.kulturskoleradet.no/lokale-sider/vestland#arsmoterelatertedokument\\n\\nSAK
  1 \u2013 KONSTITUERING\\n\\n1.1. Godkjenning av fullmaktene\\n\\nVedtak:\\n\\n\u00c5rsm\u00f8tet
  godkjenner at Kjetil H\u00f8gseth Felde, Fjaler, stiller med fullmakt og r\u00f8ysterett
  for Gry Buer, Solund.\\n\\nVed m\u00f8testart var det p\u00e5 \u00e5rsm\u00f8tet
  i alt 54 delegatar med i alt 55 godkjende fullmakter.\\n\\nSaksdokument: delegat-
  og observat\u00f8rliste sj\u00e5 neste side.\\n\\nOpprop under \u00e5rsm\u00f8tet\\n\\nDelegat
  fr\u00e5 Solund, Gry Buer, vart p\u00e5meldt seint, og kunne ikkje delta personleg.
  Ho har gjeve fullmakt til delegat nr 23, Kjetil H\u00f8gseth Felde, Fjaler.\\n\\n1.
  opprop ved start kl 13.30: 54 delegatar som representerte 55 fullmakter.\\n2. opprop
  kl 15.00 etter sak 6: delegatar 2, 5 og 7 forl\u00e9t m\u00f8tet og delegat 27 kom
  inn; 53 fullmakter.\\n\\nSiste revidering av denne protokollen vart gjort 28.10.2021
  av referentane med protokollunderskrivarane til stades.\\n\\nDELEGAT- OG OBSERVAT\u00d8RLISTE\\n\\n|  |
