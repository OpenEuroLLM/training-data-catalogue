  per \u00e5rsvirk brukt p\u00e5 saksbehandling |\\n|-------------------------------------------------------------------------------------|\\n|
  2019 | 2020 | 2021 | 2022 | 2023 |\\n|------|------|------|------|------|\\n| Design
  | 476  | 639  | 730  | 603  | 665  |\\n\\nTalet p\u00e5 patents\u00f8knader som
  blei levert til Patentstyret i 2023, var 1 398, s\u00e5 godt som likt som i 2022.
  Oppgangen i s\u00f8knader fr\u00e5 utanlandske s\u00f8kjavar er p\u00e5 om lag 6
  prosent, medan talet p\u00e5 s\u00f8knader fr\u00e5 norske s\u00f8kjavar gjekk ned
  med om lag fem prosent. Prosentdelen fr\u00e5 norske s\u00f8kjavar er om lag som
  \u00e5ret f\u00f8r: 59 prosent mot 61 prosent i 2022.\\n\\nEin del av dei patenta
  som Det europeiske patentverket (EPO) gjev \u00e5rlig, pleier s\u00f8kjavarane \u00e5
  gjere gjeldande ogs\u00e5 i Noreg. 1. juni 2023 blei ordninga med einskapspatent
  sett i gang i Europa, og hausten 2023 auka talet p\u00e5 EP-saker mottatt for validering.
  Det blei ein auka p\u00e5 om lag p\u00e5 14 prosent fr\u00e5 2022 til 2023.\\n\\nS\u00f8knadsbehandlinga
  kan bli avslutta p\u00e5 ulike m\u00e5tar. Patentstyret godkjende om lag like mange
  s\u00f8knader i 2023 som i 2022. S\u00f8knader kan ogs\u00e5 bli lagde vekk om s\u00f8kjaren
  ikkje held fristar eller vel \u00e5 trekke s\u00f8knaden. Dei fleste s\u00f8knadene
  som blir lagde vekk, gjeld oppfinningar som ikkje er nye eller ikkje skil seg vesentleg
  fr\u00e5 kjend teknikk, og som derfor ikkje ville f\u00f8rt til patent. Basert p\u00e5
  vurderingane fr\u00e5 Patentstyret vel nokre s\u00f8kjavarar \u00e5 avslutta behandlinga
  av s\u00f8knaden. I 2023 auka talet patents\u00f8knader som blei lagde vekk, og
  n\u00e6rma seg eit meir vanleg niv\u00e5.\\n\\n| Tabell 9: Utviklinga p\u00e5 patentomr\u00e5det
