  med kartlegginga er \u00e5 f\u00e5 oversikt over aktivitetar og aktivitetsniv\u00e5et
  til skulane, og dessutan motivasjonen bak og eventuelle hindringar for det internasjonale
  arbeidet. Kartlegginga er viktig for p\u00e5 best mogleg vis \u00e5 kunne f\u00f8lgje
  opp skulane p\u00e5 ein systematisk m\u00e5te i arbeidet med internasjonalisering
  i oppl\u00e6ringa.\\n\\nVedlagt er rapport om den internasjonale aktiviteten i dei
  vidareg\u00e5ande skulane for 2018.\"", "\"Akebrettstafett\\n\\nAkebrettstafett\\n\\nHensikt\\nI
  Akebrettstafett leikar barna med h\u00f8g intensitet i intervallar ved at dei skal
  springe i motbakke. Aktiviteten krev konsentrasjon og sj\u00f8lvregulering, ved
  at barna m\u00e5 vere klare n\u00e5r det er deira tur, samt klare \u00e5 vente p\u00e5
  sin tur.\\n\\nUtstyr\\nRumpeakebrett\\nLiten bakke\\n\\nForklaring\\n1. Finn ein
  motbakke som er passe bratt og lang for barnegruppa som er med.\\n2. Del barna inn
  i lag.\\n3. Det fyrste barnet p\u00e5 kvart lag f\u00e5r eit akebrett.\\n4. Det
  fyrste barnet skli ned bakken, spring s\u00e5 opp bakken og leverer akebrettet til
  det neste barnet p\u00e5 sitt lag.\\n5. No skli nestemann og leiken fortsett til
  alle har aka eller til alle har aka eit visst tal gonger.\\n\\nTips\\n\u2022 Bli
  einige p\u00e5 f\u00f8rehand om kvar barna skal skli og kvar dei skal springe opp
  for \u00e5 unng\u00e5 at det blir kollisjonar. Pass ogs\u00e5 p\u00e5 at avstanden
