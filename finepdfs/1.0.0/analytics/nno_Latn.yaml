  validering                                    | 5 944    | 5 606    |\\n\\nImmaterielle
  rettar\\n\\nIndustrielle rettar\\n\\nPatent\\nEit patent vernar ei konkretn l\u00f8ysing
  p\u00e5 eit teknisk problem. Du kan f\u00e5 patent p\u00e5 ei oppfinning.\\n\\nVarem\u00e6rke\\nEit
  varem\u00e6rke er eit kjenneteikn du kan bruke for \u00e5 skilje dine varer og tenester
  fr\u00e5 andre sine.\\n\\nDesign\\nDesignregistrering gjev einerett til utsj\u00e5naden
  og forma p\u00e5 eit produkt \u2013 det dekorative eller estetiske aspektet.\\n\\nAndre
  immaterielle rettar\\n\\nOphavsrett, copyright\\nRetten til litter\u00e6re og kunstarlege
  \u00e5ndsverk, til d\u00f8mes eit musikkstykke, ei bok, eit m\u00e5leri, brukskunst
  eller ein film.\\n\\nForretningshemmelegheiter\\nFortrulege opplysningar om drifts-
  og forretningsforholda til verksemda, spesifikk kunnskap og teknologiske opplysningar.\\n\\nGeografiske
  nemningar\\nGjev h\u00f8ve til \u00e5 verne produktnemningar p\u00e5 mat og drikke
  ut fr\u00e5 opphav, geografi og tradisjonelt s\u00e6rpreg. Dette blir administrert
  av Matmerk.\\n\\nOrganisasjonar\\n\\nWorld Intellectual Property Organization (WIPO)\\nVerdsorganisasjonen
  for immaterialrett er ein av spesialorganisasjonane til FN og har som oppg\u00e5ve
  \u00e5 fremje utvikling av immaterielle rettar globalt. WIPO har 193 medlemsland
  og har hovudsete i Gen\u00e8ve. Dei viktigaste s\u00f8knadsordningane for industrielle
  rettar som WIPO administrerer, er desse:\\n\\nMadridprotokollen\\ner ein internasjonal
  avtale som gjer det enklare og billegare \u00e5 s\u00f8kje internasjonal varemerkeregistrering
  i fleire land samtidig. Dekkjer 129 land.\\n\\nHaag-overeinskomsten\\ner ei internasjonal
  ordning som gjer at ein ved hjelp av ein s\u00f8knad kan f\u00e5 vern for designet
  sitt i dei landa som er medlem av ordninga. Dekkjer 90 land.\\n\\nPatent Cooperation
  Treaty (PCT)\\ner ei internasjonal s\u00f8knads-ordning for patent. Ordninga forenklar
  innlevering og gransking dersom du skal s\u00f8kje patent i fleire land. Dekkjer
  157 land.\\n\\nEuropean Union Intellectual Property Office (EUIPO)\\ner varemerke-
  og designstyresmakt for EU. EU-varemerke og EU-design gjeld i alle land som er medlem
  av EU, og derfor ikkje i Noreg. Norske personar og bedrifter kan likevel s\u00f8kje
  om EU-varemerke-/design, b\u00e5de direkte og gjennom Madridprotokollen.\\n\\nDet
  europeiske patentverket, European Patent Office (EPO)\\ntek imot, behandler og avgjer
  europeiske patents\u00f8knader p\u00e5 grunnlag av reglane i Den europeiske patentkonvensjonen,
  som Noreg er tilslutta. Det er 38 medlemsland i Den europeiske patentorganisasjonen.\\n\\nNordisk
  Patentinstitutt (NPI)\\nbehandlar internasjonale patents\u00f8knader (PCT) for WIPO
  og utf\u00f8rer oppdrag som mellom anna nyheitsunders\u00f8kingar for utanlandske
  kundar. Noreg er partnar i NPI saman med Danmark og Island.\\n\\nDel 3\\nAktivitetar
  og resultat\\n\\nSamla vurdering av resultat, m\u00e5loppn\u00e5ing og ressursbruk\\n\\nS\u00f8knadsinngang
  og tildelte rettar\\n\\nI 2023 fekk Patentstyret inn om lag 18 700 s\u00f8knader,
  7,8 prosent f\u00e6rre enn i 2022. Om lag 76 prosent av s\u00f8knadene kom fr\u00e5
  utanlandske s\u00f8kjavar som \u00f8nskjer rettar i Noreg. Talet p\u00e5 patents\u00f8knader
  var stabilt samanlikna med 2022, medan varemerkes\u00f8knadene fall med 9,8 prosent
  og designs\u00f8knadene auka med 14 prosent.\\n\\nPatentstyret tildelte om lag 17
  100 varemerke-, design- og patentrettar i 2023, som er 3 prosent fleire enn i 2022.
  I tillegg blei om lag 5 600 europeiske patent gjorde gjeldande i Noreg, mot 5 950
  i 2022.\\n\\nF\u00f8ringar i tildelingsbrevet\\n\\nPatentstyret brukar hovuddelen
  av ressursane sine p\u00e5 behandling av s\u00f8knader og andre lovp\u00e5lagde
  styresmaktsoppg\u00e5ver. Patentstyret er bedne om \u00e5 vidareutvikle samarbeidet
  med andre styresmakter og verkemiddel nasjonalt og internasjonalt for \u00e5 effektivisere
  saksbehandlinga, med m\u00e5l om \u00e5 leggje til rette for betre bruk av immaterielle
  rettar og verdiar i n\u00e6ringslivet.\\n\\nPatentstyret er ogs\u00e5 blitt bedne
  om \u00e5 vurdere korleis kunnskap og data om immaterielle verdiar kan bidra til
  \u00e5 fremja n\u00e6ringsutvikling og auka verdiskaping fr\u00e5 mellom anna eksport.
  Betre kunnskap om immaterielle verdiar og vern av dei er heilt avgjerande for at
  det norske n\u00e6ringslivet skal overleve og lykkast i ein internasjonal marknad.\\n\\nResultat
  og m\u00e5loppn\u00e5ing 2023\\n\\nHovudm\u00e5l\\n\\nHovudm\u00e5let er st\u00f8rre
  bedrifts- og samfunns\u00f8konomisk l\u00f8nsemd fr\u00e5 immaterielle verdiar.
  Patentstyret har ogs\u00e5 to delm\u00e5l:\\n\\nDelm\u00e5l 1: Fleire gode rettar\\n\\nDet
  er eit m\u00e5l for Patentstyret at vi tildeler fleire gode rettar. Med dette meiner
  vi rettar som har rett kvalitet, som kan handhevast, og som l\u00e8t seg utnytte
  p\u00e5 ein god m\u00e5te. Dette oppn\u00e5r vi i f\u00f8rste rekke gjennom at s\u00f8knadsbehandlinga
  og rettleiinga v\u00e5r oppfyller krava til effektivitet, kvalitet og n\u00f6gde
  kundar.\\n\\nEffektivitet i saksbehandlinga\\n\\nVidare gjev vi ei oversikt over
  korleis talet p\u00e5 leverte og avgjorde s\u00f8knader \u2013 og dermed talet p\u00e5
  s\u00f8knader som er til behandling \u2013 har utvikla seg over tid. Oversikta viser
  ogs\u00e5 behandlingstider og talet p\u00e5 ferdigbehandla s\u00f8knader per \u00e5rsvirk
  innanfor kvart av omr\u00e5da varemerke, design og patent.\\n\\nVaremerke \u2013
  utviklinga p\u00e5 omr\u00e5det\\n\\nI 2023 fall det samla talet p\u00e5 varemerkes\u00f8knader
  med 9,8 prosent fr\u00e5 \u00e5ret f\u00f8r, fr\u00e5 17 696 til 15 959 s\u00f8knader.
  Det er det l\u00e5gaste talet sidan 2016 (15 702), og det skriv seg fr\u00e5 f\u00e6rre
  s\u00f8knader fr\u00e5 utanlandske s\u00f8kjavar. Fr\u00e5 norske s\u00f8kjavar
  kom det inn 3 309 s\u00f8knader direkte til Patentstyret. Dette er 6 prosent fleire
  enn \u00e5ret f\u00f8r (3 111). Etter fleire \u00e5r med fall i s\u00f8knader fr\u00e5
  norske s\u00f8kjavar er det positivt \u00e5 sj\u00e5 ein auke her.\\n\\nSamtidig
  har talet p\u00e5 varemerkes\u00f8knader fr\u00e5 norske s\u00f8kjavar ut i verda
  hatt ein aukande trend i mange \u00e5r. I \u00e5rsrapporten for 2022 blei det kommentert
  at det blei spennande \u00e5 sj\u00e5 om den auka eksporten i Noreg i 2022 ville
  bidra til end\u00e5 h\u00f8gare tal for 2022. Statistikk fr\u00e5 WIPO viser likevel
  at tala for norske varemerkes\u00f8knader ut i verda fall med 14 prosent, fr\u00e5
  om lag 24 800 s\u00f8knader til om lag 21 400 s\u00f8knader. Noko av \u00e5rsaka
  til fallet kan vere den l\u00e5gare inngangen av s\u00f8knader i Noreg dei siste
  \u00e5ra. Marknadene med flest varemerkes\u00f8knader fr\u00e5 det norske n\u00e6ringslivet
  i 2022 var \u2013 i tillegg til Noreg \u2013 EU, Storbritannia, USA, Canada, Brasil,
  Sveits og Kina. Tala for 2023 blir publiserte av WIPO i oktober/november 2024.\\n\\nFigur
  3: Talet p\u00e5 varemerkes\u00f8knader fr\u00e5 norske s\u00f8kjavar til land utanom
  noreg\\n\\nTalet p\u00e5 nasjonale varemerkes\u00f8knader og utpeikningar i internasjonale
  varemerkeregistreringar med norsk s\u00f8kjavar utanlands. For regionale ordningar
  som EU-varemerke (EUIPO) reknar ein talet p\u00e5 s\u00f8knader multiplisert med
  talet p\u00e5 land som er med i ordninga p\u00e5 tidspunktet for innlevering av
  s\u00f8knaden. Kjelde: WIPO IP Statistics Database\\n\\nPatentstyret avgjorde 17
  650 varemerkes\u00f8knader (varemerke og fellesmerke) i 2023. Det er om lag 3 prosent
  fleire enn i 2022. Rundt 86 prosent av dei avgjorde s\u00f8knadene blei godkjende
  og registrerte.\\n\\nPatentstyret avgjorde dermed om lag 550 fleire s\u00f8knader
  enn \u00e5ret f\u00f8r. Talet p\u00e5 varemerkes\u00f8knader under behandling blei
  redusert med nesten 1700 i 2023, til 11 335 s\u00f8knader. Dette skriv seg fr\u00e5
  den l\u00e5ge ingangen av varemerkes\u00f8knader og at fleire saker blei ferdigbehandla
  enn i 2022.\\n\\n### Tabell 5: Utviklinga p\u00e5 varemerkeomr\u00e5det\\n\\n|                                                                 |
