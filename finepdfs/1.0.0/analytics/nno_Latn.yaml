  i Ulsteinvik.\\n\\nalle med Facebook-konto kan stemme kvar dag i perioden 11. -
  29. september\\n\\nTussa deler ut kr 100 000 fordelt p\u00e5 10 gode gjerningar.
  Det er talet p\u00e5 stemmer/kraft som avgjer fordelinga p\u00e5 kvart prosjekt.\\n\\nDu
  kan stemme p\u00e5 www.krafttaket.no eller via www.facebook.com/tussa\"", "\"REGULERINGSF\u00d8RESEGN
  OMR\u00c5DEPLAN TURUFJELL\\n\\nPlan- og bygningsloven \u00a7 12-7 gjer heimel til
  \u00e5 lage reguleringsf\u00f8resegn. Saman med plankartet er f\u00f8resegnene eit
  juridisk dokument. F\u00f8resegnene utfyller og utdjupar arealbruken sett i plankartet.\\n\\n\u00a7
  1. AVGRENSING\\n\\nDet regulerte omr\u00e5det er vist med reguleringsgrense p\u00e5
  plankartet, dagsett 21.07.2017.\\n\\n\u00a7 2. REGULERINGSFORM\u00c5L\\n\\nInnanfor
  plangrensa gjeld f\u00f8ljande reguleringsform\u00e5l:\\n\\nBebyggelse og anlegg
  (PBL \u00a7 12-5, nr 1)\\n\\n- Fritidsbebyggelse\\n- Fritidsbebyggelse \u2013 frittliggende\\n-
  Skianlegg\\n- Vatn- og avl\u00f8psanlegg\\n- Renovasjonsanlegg\\n- Kombinerte byggeform\u00e5l\\n\\nSamferdselsanlegg
  og teknisk infrastruktur (PBL \u00a7 12-5, nr 2)\\n\\n- Veg\\n- K\u00f8yreveg\\n-
  Annen veggrunn \u2013 gr\u00f8ntareal\\n- Parkering\\n\\nGr\u00f8nnstruktur (PBL
  \u00a7 12-5, nr 3)\\n\\n- Turveg\\n- Gr\u00f8nnstruktur\\n- Kombinerte gr\u00f8nnstrukturform\u00e5l\\n\\nLandbruks-,
  natur- og fritidsform\u00e5l samt reindrift (PBL \u00a712-5, nr 5)\\n\\n- Landbruksform\u00e5l\\n\\nHensynsoner
  (PBL \u00a712-6)\\n\\n- Bevaring naturmilj\u00f8\\n- H\u00f8gspenningsanlegg (inkl.
  H\u00f8yspentkabler)\\n- Nedslagsfelt drikkevann\\n- Andre sikringsoner\\n\\n\u00a7
  3. FELLESF\u00d8RESEGN\\n\\n\u00a73.1 Plankrav\\n\\nOmr\u00e5da H1-H210, BSA1, BKB-BFT/BFK,
  BRE, SPA1\u2013SPA5 kan byggast ut etter f\u00f8resegna i denne planen.\\n\\nDet
  er krav om utarbeiding av detaljplan for omr\u00e5da BFR1-BFR45, BSA2 og BKB-BSM/BVA/BL
