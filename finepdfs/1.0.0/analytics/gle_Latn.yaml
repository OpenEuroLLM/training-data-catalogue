  idir na f\u00f3rsa\u00ed aomthacha seo agus air\u00edonna fisiceacha, amhail le\u00e1phointe,
  fiuchphointe agus intuaslagthacht, de shubstaint\u00ed m\u00f3il\u00edneacha comhfhi\u00fasacha.\\n\\nF\u00f3rsa\u00ed
  idirmh\u00f3il\u00edneacha\\n\\nB\u00edonn f\u00f3rsa\u00ed idirmh\u00f3il\u00edneacha
  idir m\u00f3il\u00edn\u00ed in aice lena ch\u00e9ile (i gcodarsnacht le f\u00f3rsa\u00ed
  ionmh\u00f3il\u00edneacha).\\n\\nT\u00e1 f\u00f3rsa\u00ed idirmh\u00f3il\u00edneacha
  ann idir m\u00f3il\u00edn\u00ed comhfhi\u00fasacha. T\u00e1 tr\u00ed phr\u00edomhchine\u00e1l
  ann.\\n\\nF\u00f3rsa\u00ed van der Waals \u2013 Is iad seo an t-aomach\u00e1n idir
  d\u00e9phoil mheandracha agus d\u00e9phoil ionduchtaithe ar mh\u00f3il\u00edn\u00ed
  in aice lena ch\u00e9ile.\\n\\nDe r\u00e9ir mar a bhogann leictreoin go gasta i
  bhfithise\u00e1in, b\u00edonn a su\u00edomh ag athr\u00fa de sh\u00edor; ag aon
  mheandar ar leith, thiocfadh leo bheith \u00e1it ar bith in adamh. Beidh an fh\u00e9idearthacht
  ann go mbeidh n\u00edos m\u00f3 leictreon ag taobh amh\u00e1in den adamh n\u00e1
  ag an taobh eile. Mar gheall air seo, b\u00edonn d\u00e9phol ann a ionduchta\u00edonn
  d\u00e9phoil ar adaimh in aice leis. T\u00e1 na hadaimh aomtha i dtreo a ch\u00e9ile
  anois ag f\u00f3rsa lag.\\n\\nD\u00e1 mh\u00e9ad \u00e9 l\u00edon na leictreon san
  adamh n\u00f3 sa mh\u00f3il\u00edn, is amhlaidh is m\u00f3 na d\u00e9phoil ionduchtaithe
  agus is l\u00e1idre f\u00f3rsa\u00ed van der Waals. T\u00e1 s\u00e9 seo soil\u00e9ir
  nuair a chuirtear fiuchphoint\u00ed na dtriathgh\u00e1s i gcompar\u00e1id lena ch\u00e9ile:\\n\\n|
  H\u00e9iliam | -269 |\\n|---|---|\\n| Neon | -246 |\\n| Arg\u00f3n | -186 |\\n|
  Criopt\u00f3n | -152 |\\n| Xean\u00f3n | -108 |\\n| Rad\u00f3n | -62 |\\n\\nAomach\u00e1in
  bhuana d\u00e9phol-d\u00e9phol\\n\\nIs \u00e9 is aomach\u00e1n d\u00e9phol-d\u00e9phol
  ann n\u00e1 an t-aomach\u00e1n idir an ceann deimhneach, \u03b4+, den d\u00e9phol
  bhuan ar mh\u00f3il\u00edn leis an cheann dhi\u00faltach, \u03b4-, den d\u00e9phol
  bhuan de mh\u00f3il\u00edn in aice leis.\\n\\nT\u00e1 nasc polach comhfhi\u00fasach
  ag m\u00f3il\u00edn ar n\u00f3s HCl; t\u00e1 na leictreoin nasctha ina lu\u00ed
  n\u00edos c\u00f3ngara\u00ed don adamh cl\u00f3ir\u00edn, agus mar gheall air sin,
  forbra\u00edtear p\u00e1irtluchtanna ar an hidrigin agus ar an chl\u00f3ir\u00edn
  araon. Na p\u00e1irtluchtanna ar mh\u00f3il\u00edn polach, aomann siad d\u00e9phoil
  at\u00e1 luchtaithe go hurchomhaireach ar mh\u00f3il\u00edn polach eile. B\u00edonn
  f\u00f3rsa idirmh\u00f3il\u00edneach ann mar gheall air seo, ar a dtugtar idirghn\u00edomh\u00fa
  buan d\u00e9phol-d\u00e9phol:\\n\\n1\\n\\nH \u2014 Cl -------H \u2014 Cl\\n\\nT\u00e1
  idirghn\u00edomhuithe buana d\u00e9phol-d\u00e9phol ann le cois f\u00f3rsa\u00ed
  van der Waals agus t\u00e1 siad n\u00edos l\u00e1idre n\u00e1 f\u00f3rsa\u00ed van
  der Waals.\\n\\nNascadh hidrigine\\n\\nIs \u00e9 is nasc hidrigine ann n\u00e1 an
  t-aomach\u00e1n idir d\u00eds aonair de leictreoin ar adamh at\u00e1 an-leictridhi\u00faltach
  (m.sh N, O, F) in aon mh\u00f3il\u00edn agus adamh hidrigine i m\u00f3il\u00edn
  in aice leis, ina bhfuil an t-adamh hidrigine nasctha go comhfhi\u00fasach le hadamh
  at\u00e1 an-leictridhi\u00faltach (N,O,F).\\n\\nIs cine\u00e1l speisialta idirghn\u00edomh\u00fa
  buan d\u00e9phol-d\u00e9phol \u00e9 nascadh hidrigine a tharla\u00edonn idir m\u00f3il\u00edn\u00ed
  ina bhfuil adamh hidrigine nasctha le n\u00edtrigin, ocsaigin n\u00f3 fluair\u00edn.
  Is f\u00f3rsa idirmh\u00f3il\u00edneach \u00e9 nasc hidrigine at\u00e1 measartha
  l\u00e1idir i gcompar\u00e1id le cinn eile, f\u00f3rsa idir:\\n\\n* Adamh hidrigine
  at\u00e1 leictreonuireasach, H\u03b4+, ar aon mh\u00f3il\u00edn agus\\n* D\u00eds
  aonair leictreon ar adamh at\u00e1 anleictridhi\u00faltach de N, O n\u00f3 F ar
  mh\u00f3il\u00edn eile.\\n\\nNasc hidrigine\\n\\nNaisc hidrigine idir m\u00f3il\u00edn\u00ed
  uisce\\n\\nNasc hidrigine\\n\\nNaisc hidrigine idir m\u00f3il\u00edn\u00ed uisce
  agus pr\u00f3p\u00e1n\u00f3in\\n\\nF\u00f3rsa\u00ed idirmh\u00f3il\u00edneacha ag
  dul i bhfeidhm air\u00edonna fisiceacha\\n\\nNuair a dh\u00e9antar substaint\u00ed
  m\u00f3il\u00edneacha a fhiuchadh n\u00f3 a le\u00e1, is iad na f\u00f3rsa\u00ed
  idirmh\u00f3il\u00edneacha idir na m\u00f3il\u00edn\u00ed at\u00e1 briste, n\u00ed
  na naisc chomhfhi\u00fasacha taobh istigh de na m\u00f3il\u00edn\u00ed. Agus ceisteanna
  \u00e1 bhfreagairt ar le\u00e1phointe n\u00f3 ar fhiuchphointe, n\u00ed m\u00f3r
  duit i gc\u00f3na\u00ed a chinnti\u00fa c\u00e9n cine\u00e1l f\u00f3rsa(\u00ed)
  idirmh\u00f3il\u00edneach(a) at\u00e1 i l\u00e1thair.\\n\\nMar shampla, t\u00e1
  fiuchphointe n\u00edos airde ag eat\u00e1n\u00f3l n\u00e1 mar at\u00e1 ag pr\u00f3p\u00e1n,
  a bhfuil mais mh\u00f3il\u00edneach choibhneasta cos\u00fail le heat\u00e1n\u00f3l
  aige, cionn is nach bhfuil ach f\u00f3rsa\u00ed van der Waals at\u00e1 measartha
  lag ag an phr\u00f3p\u00e1n idir na m\u00f3il\u00edn\u00ed. T\u00e1 naisc l\u00e1idre
  hidrigine idir m\u00f3il\u00edn\u00ed eat\u00e1n\u00f3il (de bhreis ar fh\u00f3rsa\u00ed
  van der Waals) agus t\u00f3gann s\u00e9 m\u00e9id m\u00f3r fuinnimh lena mbriseadh.\\n\\nT\u00e1
  fiuchphointe n\u00edos airde ag an iaid\u00edn n\u00e1 ag an bhr\u00f3im\u00edn
  mar go bhfuil mais mh\u00f3il\u00edneach choibhneasta n\u00edos airde aige agus
  mar sin de n\u00edos m\u00f3 leictreon n\u00e1 Br2, mar sin de t\u00e1 f\u00f3rsa\u00ed
  aomtha van der Waals n\u00edos l\u00e1idre idir na m\u00f3il\u00edn\u00ed. T\u00e1
  n\u00edos m\u00f3 fuinnimh de dh\u00edth le hiad seo a bhriseadh agus mar sin de,
  t\u00e1 fiuchphointe n\u00edos airde ag iaid\u00edn n\u00e1 ag br\u00f3im\u00edn.\\n\\nT\u00e1
  a l\u00e1n m\u00f3il\u00edn\u00ed ar n\u00f3s eat\u00e1n\u00f3il intuaslagtha in
  uisce mar is f\u00e9idir leo naisc hidrigine a fhoirmi\u00fa le huisce \u2013 is
  f\u00e9idir naisc hidrigine a fhoirmi\u00fa idir d\u00eds aonair na leictreon ar
