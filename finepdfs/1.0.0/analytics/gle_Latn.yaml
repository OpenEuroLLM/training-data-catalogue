  an raon reatha.\\n\\n(ii) M\u00e1 t\u00e1 gach l\u00e1n\u00e1 1 m ar leithead, r\u00edomh
  fad gach l\u00e1n\u00e1 eile (2, 3, 4 & 5).\\n\\n(iii) Uaidh sin, oibr\u00edgh amach
  fad th\u00fas c\u00e9imnithe gach l\u00e1n\u00e1 a fh\u00e1gfaidh go mbeidh an t-achar
  c\u00e9anna rite ag gach l\u00fathchleasa\u00ed tar \u00e9is 1 chuairt den raon.\\n\\n(iv)
  C\u00e9 mh\u00e9ad cuairt den raon a bheadh le d\u00e9anamh ag l\u00fathchleasa\u00ed
  i r\u00e1s 10 000 m\u00e9adar?\\n\\n(63 m tomhaiste go dt\u00ed l\u00e1r an ch\u00e9ad
  l\u00e1n\u00e1)\\n\\n12. Ag glacadh le $\\\\pi = 3.14$, faigh\\n\\n(i) iml\u00edne\\n\\n(ii)
  achar na fiorach daite ar dheis.\\n\\nTabhair gach freagra ceart go dt\u00ed ionad
  deach\u00falach amh\u00e1in.\\n\\n13. Tugtar achar gach ciorcail thios i dt\u00e9arma\u00ed
  $\\\\pi$.\\n\\nFaigh fad gha gach ciorcail.\\n\\n(i) ![Diagram](image4.png)\\n\\n(ii)
  ![Diagram](image5.png)\\n\\n(iii) ![Diagram](image6.png)\\n\\n14. Is \u00e9 154
  cm$^2$ achar ciorcail. Ag glacadh le $\\\\pi = \\\\frac{22}{7}$, faigh\\n\\n(i)
  fad an gha\\n\\n(ii) fad na himl\u00edne.\\n\\n15. T\u00e1 \u00e1iritheoir ag Se\u00e1n
  ar a rothar.\\n\\nComhaireann s\u00e9 l\u00edon na n-imrothluithe a dh\u00e9anann
  a roth.\\nTrastomhas 40 cm at\u00e1 sna rotha\u00ed.\\n\\n(i) Rotha\u00edonn Se\u00e1n
  go teach a sheanmh\u00e1thar.\\n    1989 an uimhir a l\u00e9itear ar an \u00e1iritheoir.\\n    C\u00e1
  fhad as baile a ch\u00f3na\u00edonn an tseanmh\u00e1thair?\\n(ii) C\u00e9 mh\u00e9ad
  imrothl\u00fa a dh\u00e9anfadh a roth i bhfad 1 km?\\n\\nTabhair gach freagra ceart
  go dt\u00ed an tsl\u00e1nuimhir is gaire.\\n\\n16. C\u00e9 acu cos\u00e1n is gaire
  \u00f3 A go B\\n\\n(i) an cos\u00e1n ar feadh na 4 leathchiorcal, n\u00f3\\n(ii)
  an cos\u00e1n ar feadh an leathchiorcail is m\u00f3?\\n\\n17. Ag glacadh le $\\\\pi
  = \\\\frac{22}{7}$, faigh achar an chuid sc\u00e1thaithe den fh\u00edor ar dheis.\\n\\n18.
  Gearradh an ceathr\u00fa ciorcail ar dheis as ciorcal ar l\u00e1rphointe d\u00f3
  O.\\n\\n(i) Faigh achar $\\\\triangle OAB$.\\n(ii) Faigh achar na coda sc\u00e1thaithe,\\n    ag
  glacadh le $\\\\pi = \\\\frac{22}{7}$.\\n\\n19. Chun an gort dronuilleogach seo
  a uisc\u00ed\u00fa,\\n    \u00fas\u00e1ideann garra\u00edod\u00f3ir aon a\u00edsr\u00e9ad\u00f3ir
  d\u00e9ag\\n    chomhionanna. Cl\u00fada\u00edonn siad na codanna gorma sa l\u00e9ar\u00e1id.
  Cl\u00fada\u00edonn na tr\u00ed a\u00edsr\u00e9ad\u00f3ir\\n    i l\u00e1r an ghoirt
  achair chiorclacha; cl\u00fada\u00edonn na\\n    ceithre a\u00edsr\u00e9ad\u00f3ir
  ar na taobhanna achair\\n    leathchiorclacha; cl\u00fada\u00edonn na ceithre a\u00edsr\u00e9ad\u00f3ir\\n    ag
  na c\u00fainn\u00ed achair cheathr\u00fa ciorcail.\\n\\n(i) Cad \u00e9 ga gach ciorcail?\\n(ii)
  Cad \u00e9 an t-achar ioml\u00e1n (gorm) a uisc\u00edonn na haisr\u00e9ad\u00f3ir\u00ed?\\n(iii)
  Faigh, ceart go dt\u00ed an tsl\u00e1nuimhir is gaire, c\u00e9atad\u00e1n an ghoirt
  a uisc\u00edtear.\\n\\n20. T\u00e1 gaothsc\u00e1th c\u00fail dronuilleogach (160
  cm ar fad agus 80 cm ar leithead) ar charr. T\u00e1 cuimilteoir m\u00f3r amh\u00e1in,
  at\u00e1 75 cm ar fad, ar an ngaothsc\u00e1th. Cl\u00fada\u00edonn an cuimilteoir
  an chuid sc\u00e1ithaithe sa l\u00e9ar\u00e1id ar dheis. C\u00e9n c\u00e9atad\u00e1n
  d\u2019achar an ghaothsc\u00e1tha nach nglanann an cuimilteoir?\\n\\nTabhair an
  freagra ceart go dt\u00ed an tsl\u00e1nuimhir is gaire.\\n\\n21. Rith Ail\u00edn
  agus Liam in aghaidh a ch\u00e9ile thart ar an raon reatha seo. Rith Ail\u00edn
  ar an iml\u00edne lasmuigh agus rith Liam ar an iml\u00edne laistigh. Tar \u00e9is
  d\u00f3ibh cuairt amh\u00e1in den raon a rith, c\u00e9 aige a raibh an fad ba mh\u00f3
  rite, agus c\u00e9 mh\u00e9ad n\u00edos faide a bh\u00ed s\u00e9?\\n\\nTabhair an
  freagra ceart go dt\u00ed an m\u00e9adar is gaire.\\n\\nM\u00edr 6.4 Solaid dhronuilleogacha\\n\\nSeo
  mar a thugtar toirt solaid dhronuilleogaigh ar bith;\\n\\n\\\\[ \\\\text{Toirt}
  = \\\\text{Fad} \\\\times \\\\text{Leithead} \\\\times \\\\text{Airde}. \\\\]\\n\\nDe
  r\u00e9ir na l\u00e9ar\u00e1ide is f\u00e9idir a fheice\u00e1il go bhfuil\\n\\n\\\\[
  \\\\text{Fad} \\\\times \\\\text{Leithead} = \\\\text{Achar an bhoinn}. \\\\]\\n\\n\\\\[
  \\\\therefore \\\\text{Toirt} = \\\\text{Achar an bhoinn} \\\\times \\\\text{Airde}
  \\\\]\\n\\nIs iad na haona\u00edd toirte n\u00e1; \\\\( m \\\\times m \\\\times
  m = m^3 \\\\) (m\u00e9adar ci\u00fabach)\\n\\ne.g. mar a \u00fas\u00e1idtear i gc\u00e1s
  coime\u00e1d\u00e1in ar longa,\\n\\nn\u00f3 \\\\( cm \\\\times cm \\\\times cm =
  cm^3 \\\\) (ceintim\u00e9adar ci\u00fabach) e.g. mar a \u00fas\u00e1idtear i gc\u00e1s
  pac\u00e1ist\u00edocht le haghaidh bia,\\n\\nn\u00f3 \\\\( mm \\\\times mm \\\\times
  mm = mm^3 \\\\) (millim\u00e9adar ci\u00fabach) e.g. mar a \u00fas\u00e1idtear i
  gc\u00e1s piollai, c\u00f3gais.\\n\\nAchar an dromchla ar sholad dronuilleogach\\n\\nB\u00edonn
  tr\u00ed ph\u00e9ire d\u2019aghaidheanna dronuilleogacha ar gach solad dronuilleogach\\n\\n\\\\[
  \\\\therefore \\\\text{Achar an dromchla} = 2fI + 2al + 2fa \\\\]\\n\\\\[ = 2(fI
  + al + fa) \\\\]\\n\\n**Caibidil 6** Iml\u00edne \u2013 Achar \u2013 Toirt\\n\\n**Toirt
  solaid dhronuilleogaigh**\\n\\\\[ = f \\\\times l \\\\times a \\\\]\\n\\n**Achar
  an dromchla ar sholad dronuilleogach**\\n\\\\[ = 2(fl + al + fa) \\\\]\\n\\\\[ f
  = \\\\text{fad}, l = \\\\text{leithead}, a = \\\\text{airde} \\\\]\\n\\n**Toirt
  ci\u00faib**\\n\\\\[ = f \\\\times f \\\\times f = f^3 \\\\]\\n\\n**Achar an dromchla
  ar chi\u00fab**\\n\\\\[ = 6(f \\\\times f) = 6f^2 \\\\]\\ni gc\u00e1s ci\u00fab
  ar bith; \\\\( f = l = a \\\\)\\n\\n---\\n\\n**Sampla 1**\\n\\nTaispe\u00e1ntar
  tois\u00ed pain\u00e9il inslithe anseo:\\n\\\\[ 1.5 \\\\, m \\\\times 1.2 \\\\,
  m \\\\times 10 \\\\, cm. \\\\]\\n\\nFaigh toirt an phain\u00e9il seo.\\n\\nToirt
  an phain\u00e9il = Fad \u00d7 Leithead \u00d7 Airde\\n\\\\[ = 1.5 \\\\, m \\\\times
  1.2 \\\\, m \\\\times 0.1 \\\\, m \\\\]\\n\\\\[ = 0.18 \\\\, m^3 \\\\]\\n\\n\\\\[
  10 \\\\, cm = \\\\frac{10}{100} \\\\, m = 0.1 \\\\, m \\\\]\\n\\n---\\n\\n**Sampla
  2**\\n\\nIs \u00e9 73.5 cm\\\\(^2\\\\) achar dromchla an chi\u00faib seo.\\n\\nFaigh
  toirt an chi\u00faib.\\n\\nAchar an dromchla ar chi\u00fab = \\\\(6f^2\\\\), \\\\(f\\\\)
  is \u00e9 \\\\(f\\\\) fad aon chiumhais amh\u00e1in.\\n\\n\\\\[ \\\\therefore 6f^2
  = 73.5 \\\\, cm^2 \\\\]\\n\\n\\\\[ \\\\therefore f^2 = \\\\frac{73.5}{6} \\\\, cm^2
  = 12.25 \\\\, cm^2 \\\\]\\n\\n\\\\[ \\\\therefore f = \\\\sqrt{12.25 \\\\, cm^2}
  = 3.5 \\\\, cm \\\\]\\n\\n\\\\[ \\\\therefore \\\\text{Toirt} = f^3 = (3.5 \\\\,
  cm)^3 = 42.875 \\\\, cm^3 \\\\]\\n\\n---\\n\\n**Eangacha solad**\\n\\nBaintear \u00fas\u00e1id
  as eangacha solaid chun achar dromchla an tsolaid sin a scr\u00fad\u00fa.\\n\\nTaispe\u00e1ntar
  eangach ci\u00faib thuais. Is f\u00e9idir 11 eangach \u00e9ags\u00fala a \u00fas\u00e1id
  chun ci\u00fab a dh\u00e9anamh.\\n\\nT\u00e9acs & Trialacha 2  Ardleibh\u00e9al\\n\\nTh\u00edos
  ar chl\u00e9 t\u00e1 eangach bosca dronuilleogach d\u00fanta.\\nAr dheis t\u00e1
  eangach bosca dronuilleogach oscailte.\\n\\nFiosr\u00fa:\\n\\nBain \u00fas\u00e1id
  as bileog mh\u00f3r p\u00e1ip\u00e9ir chearn\u00f3gaigh chun na 3 eangach th\u00edos
  a ch\u00f3ipe\u00e1il agus an chuid eile den 11 eangach \u00e9ags\u00fala de chuid
  ci\u00faib a tharraingt.\\n\\nSampla 3\\n\\nSeo eangach bosca oscailte.\\nM\u00e1
  fhilltear an t-eangach ar na l\u00ednte briste chun bosca a dh\u00e9anamh, faigh\\n(i)
  toirt an bhosca\\n(ii) achar an dromchla ar an taobh amuigh den bhosca.\\n\\n(i)
  Seo \u00e9 an bosca a dh\u00e9antar \u00f3n eangach.\\n   Toirt = $14 \\\\times
  8 \\\\times 3$\\n   = $336 \\\\text{ cm}^3$\\n\\n(ii) Achar dromchla = $2(14 \\\\times
  3) + 2(8 \\\\times 3) + (14 \\\\times 8)$ \u2026 n\u00edl aon bharr ar an mbosca\\n   =
  $84 + 48 + 112 = 244 \\\\text{ cm}^2$\\n\\nToilleadh \u2013 an l\u00edtear\\n\\nCialla\u00edonn
  toilleadh coime\u00e1d\u00e1n an m\u00e9id leachta a choime\u00e1dann s\u00e9.\\n\\nIs
  \u00e9 an l\u00edtear an tomhas m\u00e9adrach is coitianta.\\n\\nAon l\u00edtear
  amh\u00e1in a choime\u00e1dann ci\u00fab arb \u00e9 10 cm fad a chiumhaise.\\n\\n\\\\[
  \\\\therefore \\\\quad 1000 \\\\text{ cm}^3 = 1 \\\\text{ litre} \\\\]\\n\\nCuimhnigh
  Chun ceintim\u00e9adair chi\u00fabacha (cm$^3$) a thiont\u00fa go l\u00edtr, roinn
  ar 1000.\\n\\nCleachtadh 6.4\\n\\n1. Faigh toirt gach ceann de na solaid dhronuilleogacha
  seo:\\n\\n   (i)\\n\\n   ![Diagram](image1)\\n\\n   (ii)\\n\\n   ![Diagram](image2)\\n\\n2.
  Faigh achar an dromchla ar gach ceann de na solaid i gCeist 1. thuas.\\n\\n3. Faigh
  (a) toirt na gci\u00fab\u00f3ideach soladach seo agus (b) achar an dromchla orthu:\\n\\n   (i)\\n\\n   ![Diagram](image3)\\n\\n   (ii)\\n\\n   ![Diagram](image4)\\n\\n   (iii)\\n\\n   ![Diagram](image5)\\n\\n4.
  Taispe\u00e1nann an l\u00e9ar\u00e1id bosca dronuilleogach ina bhfuil ci\u00fabanna
  a bhfuil slios 1 cm orthu.\\n\\n   C\u00e9 mh\u00e9ad eile de na ci\u00fabanna seo
  is g\u00e1 a \u00fas\u00e1id chun an bosca a li\u00f3nadh?\\n\\n5. Rinneadh an solad
  ar dheis as seacht gci\u00fab a bhfuil slios 3 cm ar gach ceann acu.\\n\\nFaigh
  achar dromchla an tsolaid\\n\\n6. Is f\u00e9idir gach ceann de na cruthanna soladacha
  th\u00edos a bhriseadh ina dh\u00e1 sholad dhronuilleogacha n\u00f3 i n\u00edos
  m\u00f3 n\u00e1 dh\u00e1 sholad dhronuilleogacha.\\n\\nTaispe\u00e1nann na l\u00ednte
  briste conas is f\u00e9idir na fioracha a roinnt.\\n\\nAnois, faigh toirt ioml\u00e1n
  gach ceann de na cruthanna seo:\\n\\n(i) \\\\[ \\\\begin{array}{c}\\n\\\\text{14cm}
  \\\\\\\\\\n\\\\text{9cm} \\\\\\\\\\n\\\\text{5cm} \\\\\\\\\\n\\\\text{6cm} \\\\\\\\\\n\\\\end{array}
  \\\\]\\n\\n(ii) \\\\[ \\\\begin{array}{c}\\n\\\\text{14cm} \\\\\\\\\\n\\\\text{8cm}
  \\\\\\\\\\n\\\\text{4cm} \\\\\\\\\\n\\\\text{6cm} \\\\\\\\\\n\\\\text{3cm} \\\\\\\\\\n\\\\text{4cm}
  \\\\\\\\\\n\\\\end{array} \\\\]\\n\\n(iii) \\\\[ \\\\begin{array}{c}\\n\\\\text{7cm}
  \\\\\\\\\\n\\\\text{9cm} \\\\\\\\\\n\\\\text{4cm} \\\\\\\\\\n\\\\text{10cm} \\\\\\\\\\n\\\\text{2cm}
  \\\\\\\\\\n\\\\text{4cm} \\\\\\\\\\n\\\\end{array} \\\\]\\n\\n7. \u00das\u00e1idtear
  fead\u00e1inra sincithe cearn\u00f3gach chun fr\u00e1ma seide a dh\u00e9anamh. Cosna\u00edonn
  an fead\u00e1inra \u20ac12.80 an m\u00e9adar.\\n\\nFaigh costas ioml\u00e1n an fhead\u00e1inra
  is g\u00e1 a \u00fas\u00e1id chun fr\u00e1ma na seide ar dheis a dh\u00e9anamh.\\n\\n8.
  Taispe\u00e1nann an fh\u00edor ar dheis cruach ci\u00fabanna a bhfuil slios 2 cm
  orthu.\\n\\nFaigh (i) toirt na cruache ina cm$^3$\\n\\n(ii) achar an dromchla ar
  an gcruach ina cm$^2$.\\n\\n9. Tugtar toirt gach ceann de na solaid dhronuilleogacha
  ar dheis.\\n\\nFaigh fad an tsleasa a bhfuil litir air.\\n\\n(i) \\\\[ \\\\begin{array}{c}\\n\\\\text{Toirt
  = 120 cm}^3 \\\\\\\\\\n\\\\text{a} \\\\quad \\\\text{8 cm} \\\\quad \\\\text{3 cm}
  \\\\\\\\\\n\\\\end{array} \\\\]\\n\\n(ii) \\\\[ \\\\begin{array}{c}\\n\\\\text{Toirt
  = 420 m}^3 \\\\\\\\\\n\\\\text{6 m}^2 \\\\quad \\\\text{10 m} \\\\quad \\\\text{b}
  \\\\\\\\\\n\\\\end{array} \\\\]\\n\\n(iii) \\\\[ \\\\begin{array}{c}\\n\\\\text{Toirt
  = 2240 cm}^3 \\\\\\\\\\n\\\\text{14 cm} \\\\quad \\\\text{c} \\\\quad \\\\text{8
  cm} \\\\\\\\\\n\\\\end{array} \\\\]\\n\\n10. Mas \u00e9 216 cm$^2$ achar an dromchla
  ar chi\u00fab, taispe\u00e1in gurb \u00e9 216 cm$^3$ toirt an chi\u00faib ch\u00e9anna.\\n\\n11.
  Shocraigh an tUasal \u00d3 Seana\u00ednn gar\u00e1iste scoite a th\u00f3g\u00e1il
  in aice lena theach.\\n   Ba iad 6 m $\\\\times$ 4 m $\\\\times$ 2.5 m (ar airde)
  na tois\u00ed a bh\u00ed i gceist aige don ghar\u00e1iste.\\n   Ba iad 22 cm $\\\\times$
  10 cm $\\\\times$ 7 cm tois\u00ed na mbr\u00edci a roghnaigh s\u00e9 agus mheas
  s\u00e9 go mbeadh\\n   4 000 br\u00edce ag teast\u00e1il uaidh. An raibh dealramh
  lena mheastach\u00e1n?\\n   Minigh do fhreagra. (N\u00f3ta: bh\u00ed 3 bhalla ag
  teast\u00e1il.)\\n\\n12. Is \u00e9 64 cm$^3$ toirt ci\u00faib.\\n   Faigh (i) fad
  shlios an chi\u00faib\\n   (ii) achar an dromchla ar an gci\u00faib.\\n\\n13. Tar
  \u00e9is d\u00f3 na deisi\u00fach\u00e1in ar fad a dh\u00e9anamh\\n   ar bhun na
  linne sn\u00e1mha seo faoina 5 a chlog\\n   D\u00e9 Luain, thosaigh P\u00e1draic
  ag l\u00edonadh na\\n   linne ar\u00eds ar r\u00e1ta 1 m$^3$ gach 10 n\u00f3im\u00e9ad.\\n   \\n   M\u00e1
  bh\u00edonn an linn l\u00e1n nuair a bh\u00edonn uisce\\n   inti suas go dt\u00ed
  20 cm \u00f3n imeall, cathain a oscl\u00f3far \u00ed ar\u00eds?\\n\\n   If the pool
  is full 20 cm from the rim, when\\n   will the pool reopen?\\n\\n14. C\u00e9 mh\u00e9ad
  bosca beag arb iad 20 cm $\\\\times$ 10 cm $\\\\times$ 5 cm a dtois\u00ed is f\u00e9idir
  a chur isteach\\n   i mbosca m\u00f3r arb iad 1 m $\\\\times$ 1 m $\\\\times$ 1
  m a thoisi?\\n\\n15. Filltear an eangach ar dheis chun bosca dronuilleogach a chruth\u00fa.\\n   Is
  \u00ed an dronuilleog ghorm bonn an bhosca.\\n   \\n   (i) Cad \u00e9 airde an bhosca?\\n   (ii)
  Is \u00e9 84 cm$^3$ toirt an bhosca seo.\\n       Faigh luach x.\\n   (iii) Faigh
  achar an dromchla ar an mbosca.\\n\\n16. Filltear an eangach ar dheis chun ci\u00fab
  a chruth\u00fa.\\n   (i) C\u00e9 acu rinn a cheangl\u00e1idh le N?\\n   (ii) C\u00e9
  acu l\u00edne a cheangl\u00e1idh le [CD]?\\n   (iii) C\u00e9 acu l\u00edne a cheangl\u00e1idh
  le [IH]?\\n\\n17. Is iad 4 cm $\\\\times$ 15 cm $\\\\times$ 20 cm tois\u00ed bosca
  gr\u00e1naigh oscailte.\\n   (i) Tarraing eangach den bhosca oscailte agus uaidh
  sin\\n       faigh achar an dromchla ar an taobh amuigh den bhosca.\\n   (ii) M\u00e1
  t\u00e1 an bosca seo 80% l\u00e1n gr\u00e1naigh, faigh toirt an sp\u00e1is\\n       fholaimh
  ag barr an bhosca.\\n\\n18. Seo th\u00edos eangacha ci\u00faib.\\n\\nA\\n\\n| 1
  |   |\\n|---|---|\\n| 2 | 3 | 4 |\\n| 5 |   |   |\\n| 6 |   |   |\\n\\nB\\n\\n|
  5 |   |\\n|---|---|\\n| 4 | 1 | 2 | 3 |\\n| 6 |   |   |\\n\\nC\\n\\n| 1 |   |\\n|---|---|\\n|
  2 | 3 | 4 | 5 |\\n| 6 |   |   |\\n\\nSamhlaigh go bhfilltear gach ceann de na heangacha
  seo chun ci\u00fab a dh\u00e9anamh. I gc\u00e1s gach eanga\u00ed, c\u00e9 acu aghaidh
  a bheadh os comhair aghaidh 1 nuair a fhilltear an eangach?\\n\\n19. Seo eangach
  ci\u00faib a bhfuil slios x cm air. T\u00e1 toirt an chi\u00faib cothrom go huimhri\u00fail
  le hachar an dromchla ar an gci\u00faib. Scr\u00edobh cothrom\u00f3id in x agus
  r\u00e9itigh \u00ed chun fad shlios an chi\u00faib a aimsi\u00fa.\\n\\n![Diagram](image)\\n\\n20.
  M\u00e1 t\u00e1 1 l\u00edtear = 1000 cm\u00b3, faigh toilleadh na gcoime\u00e1d\u00e1n
  dronuilleogach seo ina l\u00edtr.\\n\\n(i) ![Diagram](image)\\n(ii) ![Diagram](image)\\n(iii)
  ![Diagram](image)\\n\\n21. T\u00e1 toilleadh 4.8 l\u00edtear sa choime\u00e1d\u00e1n
  dronuilleogach ar dheis.\\n\\n(i) Scr\u00edobh s\u00edos toirt an choime\u00e1d\u00e1in
  ina cm\u00b3.\\n(ii) Faigh \\\\( h \\\\), airde an choime\u00e1d\u00e1in, ina cm.\\n\\n![Diagram](image)\\n\\n22.
  C\u00e9 mh\u00e9ad l\u00edtear ab fh\u00e9idir a dhoirteadh isteach i gcoime\u00e1d\u00e1n
  arb iad \\\\( 1 \\\\text{ m} \\\\times 1 \\\\text{ m} \\\\times 1 \\\\text{ m} \\\\)
  a thois\u00ed?\\n\\n23. Deartar bosca m\u00f3ir cairtchl\u00e1r le go mbeidh sp\u00e1s
  ann le haghaidh 20 bosca n\u00edos l\u00fa arb iad \\\\( 5 \\\\text{ cm} \\\\times
  15 \\\\text{ cm} \\\\times 20 \\\\text{ cm} \\\\) a dtois\u00ed. Cad \u00e9 toilleadh
  an bhosca mh\u00f3ir i l\u00edtr\u00ed?\\n\\nDear dh\u00e1 bhosca \u00e9ags\u00fala
  a mbeadh sp\u00e1s i ngach ceann acu don 20 bosca n\u00edos l\u00fa. Tabhair tois\u00ed
  an d\u00e1 bhosca mh\u00f3ra. (N\u00e1 b\u00edodh aon sp\u00e1s folamh sa d\u00e1
  bhosca mh\u00f3ra.)\\n\\nFiosr\u00fa:\\n\\nC\u00f3ipe\u00e1il agus comhl\u00e1naigh
  an t\u00e1bla th\u00e1is chun an ceangal idir achar dromchla agus toirt ci\u00faib
  a fhiosr\u00fa.\\n\\nScr\u00fadaigh conas is f\u00e9idir an t-aigl\u00e9abar (l\u00edne
  8) a \u00fas\u00e1id chun l\u00edne 6 a thuar.\\n\\n| Slios | Achar dromchla | Toirt
  |\\n|-------|----------------|-------|\\n| 1 cm  |                |       |\\n|
  2 cm  |                |       |\\n| 3 cm  |                |       |\\n| 4 cm  |                |       |\\n|
  5 cm  |                |       |\\n| 6 cm  |                |       |\\n| 7 cm  |                |       |\\n|
  x cm  |                |       |\\n\\nM\u00edr 6.5 Priosma\u00ed\\n\\nSa solad dronuilleogach
  ar dheis, beidh na slisne ingearacha, at\u00e1 comhthroomhar leis an aghaidh thosaigh,
  ar fad ar comhchruth agus ar c\u00f3imh\u00e9id.\\n\\nDeirimid gur solaid de thrasghearradh
  aonfhoirmeach iad solaid mar seo. Sa ch\u00e1s seo, is triant\u00e1n \u00e9 an trasghearradh.\\n\\nPriosma
  a thugtar ar fh\u00edor sholadach a mb\u00edonn an trasghearradh mar a ch\u00e9ile
  inti ar feadh a faid.\\n\\nIs priosma\u00ed iad na solaid seo a leanas. T\u00e1
  na trasghearrthacha sc\u00e1thaithe.\\n\\nN\u00ed priosma \u00e9 an solad ar dheis
  mar nach bhfuil na trasghearrthacha aonfhoirmeach.\\n\\n**Fiosr\u00fa:**\\n\\nTar
  \u00e9is d\u00f3 an l\u00e9ar\u00e1id thusa a scr\u00fad\u00fa, tharraing Ail\u00edn
  an l\u00e9ar\u00e1id seo de sholad agus d\u00fairt gur phriosma \u00ed. An bhfuil
  an ceart aige n\u00f3 nach bhfuil? Fiosraigh! Tabhair c\u00faiseanna le do fhreagra.\\n\\n**Toirt
  priosma**\\n\\n\\\\[ \\\\text{Toirt priosma} = \\\\text{achar an trasghearrtha}
  \\\\times \\\\text{an fad} \\\\]\\n\\\\[ = A \\\\times \\\\ell \\\\]\\n\\n**Sampla
  1**\\n\\nFaigh achar thrasghearradh triant\u00e1nach an phriosma seo. Uaidh sin,
  faigh toirt an phriosma.\\n\\nAchar an trasghearrtha \\\\(= \\\\frac{1}{2}bh\\\\)\\n\\\\[=
  \\\\frac{1}{2} \\\\times 8 \\\\times 6 = 24 \\\\text{ cm}^2\\\\]\\n\\nToirt \\\\(=
  \\\\text{achar an trasghearrtha} \\\\times \\\\text{an fad}\\\\)\\n\\\\[= 24 \\\\text{
  cm}^2 \\\\times 10 \\\\text{ cm}\\\\]\\n\\nToirt \\\\(= 240 \\\\text{ cm}^3\\\\)\\n\\nAchar
  an dromchla ar phriosma\\n\\nIs ionann achar an dromchla ar phriosma agus suim achair
  na n-aghaidheanna.\\n\\n**Sampla 2**\\n\\nFaigh an t-achar dromchla ioml\u00e1n
  ar an gcruth soladach seo.\\n\\nT\u00e1 5 dhromchla ar eangach an tsolaid seo.\\n\\nAn
  t-achar dromchla = $5 \\\\text{ cm} \\\\times 6 \\\\text{ cm} = 30 \\\\text{ cm}^2$\\n\\nioml\u00e1n
  = $3 \\\\text{ cm} \\\\times 6 \\\\text{ cm} = 18 \\\\text{ cm}^2$\\n\\n+ $4 \\\\text{
  cm} \\\\times 6 \\\\text{ cm} = 24 \\\\text{ cm}^2$\\n\\n+ $2\\\\left(\\\\frac{1}{2}
  \\\\times 3 \\\\text{ cm} \\\\times 4 \\\\text{ cm}\\\\right) = 12 \\\\text{ cm}^2$\\n\\nioml\u00e1n
  = $84 \\\\text{ cm}^2$\\n\\nTaispe\u00e1ntar ar dheis eangach an phriosma thriant\u00e1naigh.\\n\\n**Cleachtadh
  6.5**\\n\\n1. Tugtar achar thrasghearradh gach priosma d\u00edobh seo. Faigh toirt
  gach priosma d\u00edobh.\\n\\n   (i) ![Diagram](image1)\\n\\n   (ii) ![Diagram](image2)\\n\\n   (iii)
  ![Diagram](image3)\\n\\n2. (i) Cad \u00e9 achar thrasghearradh sc\u00e1thaithe an
  phriosma thriant\u00e1naigh seo?\\n\\n   (ii) Cad \u00e9 toirt an phriosma?\\n\\n3.
  Is triant\u00e1n dronuilleach \u00e9 trasghearradh an phriosma seo. Aimsigh toirt
  an phriosma.\\n\\n4. Aimsigh toirt gach ceann de na priosma\u00ed seo:\\n\\n(i)
  ![Diagram](image1.png)\\n\\n(ii) ![Diagram](image2.png)\\n\\n(iii) ![Diagram](image3.png)\\n\\n(iv)
  ![Diagram](image4.png)\\n\\n(v) ![Diagram](image5.png)\\n\\n(vi) ![Diagram](image6.png)\\n\\n5.
  (i) C\u00e9 mh\u00e9ad aghaidh at\u00e1 ar an bpriosma seo?\\n\\n(ii) C\u00e9 mh\u00e9ad
  aghaidh d\u00edobh a bhfuil cruth triant\u00e1nach orthu?\\n\\n(iii) Aimsigh achar
  ioml\u00e1n an dromchla ar an bpriosma seo.\\n\\n![Diagram](image7.png)\\n\\n6.
  Faigh achar ioml\u00e1n an dromchla ar gach ceann de na priosma\u00ed seo.\\n\\n(i)
  ![Diagram](image8.png)\\n\\n(ii) ![Diagram](image9.png)\\n\\n(iii) ![Diagram](image10.png)\\n\\n7.
  Faigh achar ioml\u00e1n an dromchla ar na priosma\u00ed seo.\\n\\n(i) ![Diagram](image11.png)\\n\\n(ii)
  ![Diagram](image12.png)\\n\\n(iii) ![Diagram](image13.png)\\n\\n8. Faigh (a) toirt
  agus (b) achar an dromchla ar gach ceann de na priosma\u00ed seo.\\n\\n(i) \\\\[
  \\\\begin{array}{c}\\n12m \\\\\\\\\\n5m \\\\\\\\\\n\\\\hline\\n16m \\\\\\\\\\n20m\\n\\\\end{array}
  \\\\]\\n\\n(ii) \\\\[ \\\\begin{array}{c}\\n12m \\\\\\\\\\n5m \\\\\\\\\\n\\\\hline\\n9m
  \\\\\\\\\\n13m\\n\\\\end{array} \\\\]\\n\\n(iii) \\\\[ \\\\begin{array}{c}\\n15.5m
  \\\\\\\\\\n15m \\\\\\\\\\n\\\\hline\\n9m \\\\\\\\\\n5m \\\\\\\\\\n15.5m\\n\\\\end{array}
  \\\\]\\n\\n9. R\u00edomh achar an dromchla ar gach ceann de na priosma\u00ed seo
  a leanas..\\n\\n(i) \\\\[ \\\\begin{array}{c}\\n3cm \\\\\\\\\\n4cm \\\\\\\\\\n\\\\hline\\n6cm
  \\\\\\\\\\nxcm\\n\\\\end{array} \\\\]\\n\\n(ii) \\\\[ \\\\begin{array}{c}\\n13cm
  \\\\\\\\\\n5cm \\\\\\\\\\n\\\\hline\\n10cm \\\\\\\\\\nxcm\\n\\\\end{array} \\\\]\\n\\n10.
  D\u00e9anann Cl\u00edona pubail, mar a l\u00e9ir\u00edtear ar dheis.\\n\\n(i) Faigh
  achar an dromchla ar an bpuball, an t-url\u00e1r san \u00e1ireamh.\\n\\n(ii) Ceanna\u00edonn
  Cl\u00edona \u00e9adach ar \u20ac20 an m\u00e9adar cearnaithe. C\u00e9 mh\u00e9ad
  a chosna\u00edonn an t-\u00e9adach chun puball amh\u00e1in a dh\u00e9anamh? Tabhair
  do fhreagra ceart go dt\u00ed an \u20ac10 is gaire.\\n\\n11. Seo eangach priosma
  triant\u00e1nach.\\n\\nFaigh (i) toirt an phriosma\\n\\n(ii) achar an dromchla ar
  an bpriosma.\\n\\n12. Is priosma triant\u00e1nach \u00e9 seo.\\n\\nIs triant\u00e1in
  chomhshleasacha iad boinn an phriosma.\\n\\n(i) Tarraing dronuilleog 7 cm X 4 cm
  i l\u00e1r p\u00edosa p\u00e1ip\u00e9ir.\\n\\n(ii) \u00das\u00e1id an dronuilleog
  seo chun eangach chr\u00fainn a dh\u00e9anamh don phriosma seo.\\n\\n13. Seo ceithre
  phicti\u00far den chi\u00fab c\u00e9anna.\\n\\nC\u00e9 acu cruthanna at\u00e1 os
  comhair a ch\u00e9ile?\\n\\n14. Is \u00e9 seo an eangach ag r\u00e9ad 3-T.\\n\\n(i)
  D\u00e9an cur sios ar an bhf\u00edor a gheofar nuair a fhilltear an eangach.\\n\\n(ii)
  M\u00e1s \u00e9 $378 \\\\text{ cm}^3$ toirt na f\u00edorach, faigh luach $x$.\\n\\nM\u00edr
  6.6 L\u00edn\u00edocht de r\u00e9ir sc\u00e1la\\n\\nSa ghn\u00e1thshaol, d\u00e9anann
  daoine ar n\u00f3s ailtir\u00ed agus innealt\u00f3ir\u00ed l\u00edn\u00edochta\u00ed
  de r\u00e9ir sc\u00e1la d\u2019fhoirgnimh agus de dhroichid. Is g\u00e1 go mbeadh
  t\u00f3g\u00e1laithe in ann iad a l\u00e9amh agus a thuiscint chun na strucht\u00fair
  a th\u00f3g\u00e1il i gceart.\\n\\n\u00bb Bionn an cruth c\u00e9anna ar l\u00edn\u00edocht
  de r\u00e9ir sc\u00e1la agus ar an r\u00e9ad f\u00e9in ach n\u00ed bhionn siad ar
  c\u00f3imh\u00e9id.\\n\\n\u00bb Is \u00e9 sc\u00e1la l\u00edn\u00edochta fad na
  l\u00edn\u00edochta : fad iarbh\u00edr.\\n\\nCialla\u00edonn sc\u00e1la 1:100 go
  bhfuil an m\u00e9id iarbh\u00edr 100 uaire n\u00edos m\u00f3 n\u00e1 m\u00e9id na
  l\u00edn\u00edochta.\\n\\n\u00bb Cinnt\u00edonn an sc\u00e1la m\u00e9id na l\u00edn\u00edochta.\\n\\nBheadh
  l\u00edn\u00edocht de r\u00e9ir sc\u00e1la 1:10 n\u00edos m\u00f3 n\u00e1 l\u00edn\u00edocht
  den r\u00e9ad c\u00e9anna de r\u00e9ir sc\u00e1la 1:100.\\n\\nSeo l\u00edn\u00edocht
  de r\u00e9ir sc\u00e1la de chlog.\\n\\nIs \u00e9 1 : 6 an sc\u00e1la.\\n\\nT\u00e1
  an l\u00e9ar\u00e1id 5 cm faoi 5 cm.\\n\\nIs \u00e9 $5 \\\\text{ cm} \\\\times 6
  \\\\text{ cm} = 30 \\\\text{ cm}$ fad iarbh\u00edr an chloig.\\n\\nMar sin, is iad
  $30 \\\\text{ cm} \\\\times 30 \\\\text{ cm}$ tois\u00ed iarbh\u00edr an chloig.\\n\\nSampla
  1\\n\\nTaispe\u00e1ntar cuid de phlean t\u00ed a tarraingi\u00f3dh ar sc\u00e1la
  1:100.\\n\\nTomhas $5 \\\\text{ cm} \\\\times 5 \\\\text{ cm}$ at\u00e1 ar sheomra
  leapa 1 ar an bplean.\\n\\n(i) Faigh fad iarbh\u00edr an tseomra ina mh\u00e9adair.\\n\\n(ii)
  T\u00e1 cistin an t\u00ed $6.5 \\\\text{ m} \\\\times 4.8 \\\\text{ m}$.\\n\\nCad
  iad tois\u00ed na cistine sa l\u00e9ar\u00e1id?\\n\\n(i) Ar an bplean, $1 \\\\text{
  cm} = 100 \\\\text{ cm}$ ... sc\u00e1la 1:100\\n\\n$$5 \\\\text{ cm} = 500 \\\\text{
  cm}$$\\n\\n$$= 5 \\\\text{ mh\u00e9adar}.$$ \\n\\nIs \u00e9 5 mh\u00e9adar fad an
  tseomra leapa.\\n\\n(ii) T\u00e1 an chistin $6.5 \\\\text{ m} \\\\times 4.8 \\\\text{
  m}$ n\u00f3 $650 \\\\text{ cm} \\\\times 480 \\\\text{ cm}$.\\n\\n\u00d3s \u00e9
  1:100 an sc\u00e1la, roinnimid $650 \\\\text{ cm}$ agus $480 \\\\text{ cm}$ ar 100
  chun na tois\u00ed sa phlean a fh\u00e1il.\\n\\nTois\u00ed sa phlean\\n\\n$$= \\\\frac{650}{100}
  \\\\text{ cm} \\\\text{ faoi } \\\\frac{480}{100} \\\\text{ cm}$$\\n\\n$$= 6.5 \\\\text{
  cm} \\\\text{ faoi } 4.8 \\\\text{ cm}$$\\n\\nSampla 2\\n\\nIs \u00e9 1:100000 an
  sc\u00e1la ar l\u00e9arsc\u00e1il.\\n\\n(i) Faigh amach an fad sl\u00ed ina chilim\u00e9adair
  idir dh\u00e1 bhaile at\u00e1 7 cm \u00f3na ch\u00e9ile ar an l\u00e9arsc\u00e1il.\\n\\n(ii)
  T\u00e1 dh\u00e1 st\u00e1isi\u00fan traenach 25 km \u00f3na ch\u00e9ile.\\n\\nC\u00e9
  mh\u00e9ad ceintim\u00e9adar \u00f3na ch\u00e9ile at\u00e1 siad ar an l\u00e9arsc\u00e1il?\\n\\n(i)
  Sc\u00e1la = 1:100000\\n\\n\u2234 $1 \\\\text{ cm} = 100000 \\\\text{ cm}$\\n\\n$7
  \\\\text{ cm} = 700000 \\\\text{ cm}$\\n\\n$$= \\\\frac{700000}{100} \\\\text{ m\u00e9adar}
  = 7000 \\\\text{ m} = 7 \\\\text{ km}$$\\n\\nT\u00e1 na bailte 7 km \u00f3na ch\u00e9ile.\\n\\n(ii)
  $25 \\\\text{ km} = \\\\frac{25}{100000} \\\\text{ km}$ ar an l\u00e9arsc\u00e1il\\n\\n$$=
  \\\\frac{25 \\\\times 1000}{100000} \\\\text{ m\u00e9adar}$$\\n\\n$$= \\\\frac{25}{100}
  \\\\text{ m} = 0.25 \\\\text{ m} = 25 \\\\text{ cm}$$\\n\\nT\u00e1 na st\u00e1isi\u00fain
  traenach 25 cm \u00f3na ch\u00e9ile ar an l\u00e9arsc\u00e1il.\\n\\n1. Sloinn gach
  ceann di\u00f3bh seo san fhoirm $1 : n$, \u00e1it a bhfuil $n \\\\in N$.\\n\\n   (i)
  1 cm le 40 cm  \\n   (ii) 1 cm le 1 mh\u00e9adar  \\n   (iii) 1 cm le 600 m  \\n   (iv)
  5 cm le 100 m  \\n   (v) 10 cm le 1 km  \\n   (vi) 1 mm le 10 m\\n\\n2. \u00das\u00e1id
  na sc\u00e1la\u00ed a thugtar chun aird\u00ed l\u00e9irithe na n-ainmhithe th\u00edos
  a fh\u00e1il:\\n\\n3. Is \u00e9 1:100 an sc\u00e1la ar phlean t\u00f3g\u00e1la.\\n\\n   Faigh
  na faid iarbh\u00edr san fhoirgneamh a l\u00e9ir\u00edtear ar an bplean le\\n\\n   (i)
  5 cm  \\n   (ii) 11 cm  \\n   (iii) 8.5 cm  \\n   (iv) 14.8 cm\\n\\n4. Faigh faid
  iarbh\u00edr na l\u00ednte seo a leanas ar phlean t\u00f3g\u00e1la ar a dtugtar
  na sc\u00e1la\u00ed:\\n\\n   (i) 2 cm, 1:300 an sc\u00e1la  \\n   (ii) 8 cm, 1:500
  an sc\u00e1la  \\n   (iii) 3.6 cm, 1:800 an sc\u00e1la  \\n   (iv) $5\\\\frac{3}{4}$
  cm, 1:250 an sc\u00e1la\\n\\n5. Is l\u00edn\u00edochta de r\u00e9ir sc\u00e1la de
  leora\u00ed \u00e9 seo.\\n\\n   Is \u00e9 1:100 an sc\u00e1la.\\n\\n   Tomhais fad
  na l\u00edn\u00edochta seo agus uaidh sin, scr\u00edobh sios fad iarbh\u00edr an
  leora\u00ed.\\n\\n   Freisin, faigh uasairde an leora\u00ed.\\n\\n6. T\u00e1 sc\u00e1la
  1:25 000 ar l\u00e9arsc\u00e1il si\u00fal\u00f3ide.\\n\\n   (i) Faigh an fad sl\u00ed
  iarbh\u00edr i gc\u00e1s gach ceann de na faid sc\u00e1la\u00edthe seo:\\n\\n       (a)
  2 cm  \\n       (b) 5 cm  \\n       (c) 8.5 cm  \\n       (d) 6.75 cm\\n\\n   (ii)
  Faigh na faid ar an l\u00e9arsc\u00e1il do na faid iarbh\u00edr seo:\\n\\n       (a)
  10 km  \\n       (b) 4 km  \\n       (c) 6.5 km  \\n       (d) 12.75 km\\n\\n7.
  T\u00e1 sc\u00e1la 1 : 500 000 ar l\u00e9arsc\u00e1il.\\n\\n(i) Is \u00e9 3.4 cm
  an fad ar an l\u00e9arsc\u00e1il idir dh\u00e1 st\u00e1isi\u00fan peitril. Cad \u00e9
  an fad iarbh\u00edr?\\n\\n(ii) T\u00e1 an ch\u00e9ad fh\u00f3n \u00e9igeand\u00e1la
  eile 22 km ar shi\u00fal. C\u00e9 mh\u00e9ad ceantim\u00e9adar a bheadh i gceist
  ar an l\u00e9arsc\u00e1il?\\n\\n8. T\u00e1 ar shuirbh\u00e9ir ple\u00e1n cruinn
  den ghort neamhrialta seo a tharraingt. \u00das\u00e1idfidh s\u00e9 sc\u00e1la 1
  cm = 10 m.\\n\\n(i) C\u00e9n fad a bheidh ag na l\u00ednte seo ar an bple\u00e1n?\\n   (a)
  [AB]  \\n   (b) [BC]\\n\\n(ii) Tarraing l\u00ednl\u00edocht chr\u00fainn de r\u00e9ir
  sc\u00e1la den ghort seo, ag \u00fas\u00e1id an sc\u00e1la thugtha.\\n\\n9. Is \u00e9
  5 cm le 2 km an sc\u00e1la ar l\u00e9arsc\u00e1il \u00e1irithe. Sloinn \u00e9 seo
  san fhoirm $1:n$. Freisin, faigh an fad sl\u00ed ina cm ar an l\u00e9arsc\u00e1il
  idir dh\u00e1 bhaile, A agus B, at\u00e1 30 km \u00f3na ch\u00e9ile d\u00e1ir\u00edre.\\n\\n10.
  Rinne cail\u00edn an l\u00ednl\u00edocht seo de r\u00e9ir sc\u00e1la chun $|AB|$,
  airde balla triant\u00e1nach, a fh\u00e1il.\\n\\n(i) Tomhais an fad $|CB|$ ar an
  l\u00ednl\u00edocht sc\u00e1la agus r\u00edomh sc\u00e1la na l\u00ednl\u00edochta.\\n\\n(ii)
  Faigh an airde iarbh\u00edr $|AB|$ tr\u00ed thomhas agus r\u00edomhaireacht.\\n\\n(iii)
  Faigh achar an bhalla thriant\u00e1naigh seo.\\n\\n1. Faigh (i) toirt an phriosma
  thriant\u00e1naigh ar dheis\\n   (ii) achar ioml\u00e1n an dromchla air.\\n\\n2.
  Ag glacadh le 3.14 do $\\\\pi$, faigh achar na coda l\u00e9irithe.\\n\\n3. Faigh
  achar an chomhthreomhar\u00e1in ar dheis.\\n   Uaidh sin, faigh luach $h$.\\n\\n4.
  Is f\u00e9idir an ci\u00fab\u00f3ideach seo a dh\u00e9anamh as p\u00edosa c\u00e1rta
  a bhfuil an cruth seo air.\\n\\n   M\u00e1 sheasann gach cearn\u00f3g ar ghreille
  na heanga\u00ed d\u2019fhad 3 cm, faigh\\n   (i) toirt an chi\u00fab\u00f3b\u00eddigh\\n   (ii)
  achar ioml\u00e1n an dromchla ar an gci\u00fab\u00f3ideach.\\n\\n5. Cearn\u00f3g
  agus leathchiorcal \u00ed an fh\u00edor ar dheis.\\n   Ag glacadh le $\\\\pi = 3.14$,
  faigh, ceart go hionad deach\u00falach amh\u00e1in,\\n   (i) achar na f\u00edorach\\n   (ii)
  iml\u00edne na f\u00edorach.\\n\\n6. (i) T\u00e1 samhail de luamh le t\u00f3g\u00e1il,
  ar sc\u00e1la 1:50.\\n\\nM\u00e1 t\u00e1 an luamh 25 m ar fad, c\u00e9n fad a bheidh
  sa tsamhail?\\n\\n(ii) M\u00e1 t\u00e1 carr 6.25 m ar fad agus m\u00e1 t\u00e1 an
  tsamhail 25 cm ar fad, c\u00e9n sc\u00e1la a \u00fas\u00e1idtear?\\n\\n7. (i) Taispe\u00e1in
  go bhfuil an toirt ch\u00e9anna i bpriosma A agus i bpriosma B.\\n\\n(ii) Faigh
  achar an dromchla ar gach priosma d\u00edobh.\\n\\nAn bhfuil an d\u00e1 achar mar
  an gc\u00e9anna?\\n\\n(iii) Seasann priosma B do phuball m\u00f3r (le hurl\u00e1r)
  d\u00e9anta de chanbh\u00e1s.\\n\\nFaigh costas an chanbh\u00e1is a \u00fas\u00e1ideadh
  m\u00e1 chosna\u00edonn gach m\u00e9adar canbh\u00e1is \u20ac24.50.\\n\\n8. Feictear
  sa l\u00e9ar\u00e1id AOB, ceathr\u00fa de chiorcal a bhfuil ga 14 cm aici.\\n\\nAg
  glacadh le $\\\\pi = \\\\frac{22}{7}$, faigh achar an chuid sc\u00e1thaithe den
  fh\u00edor.\\n\\n9. Rinneadh an fh\u00edor ar dheis as dh\u00e1 dronuilleog chomhionanna
  at\u00e1 ina lu\u00ed thar chiumhais a ch\u00e9ile.\\n\\nT\u00e1 na dronuilleoga
  20 cm ar fad agus 15 cm ar leithead.\\n\\nR\u00edomh achar na f\u00edorach.\\n\\n10.
  Nuair a ghluaiseann sn\u00e1thaid bheag an chloig tr\u00ed uillinn 75\u00b0, cl\u00fada\u00edonn
  s\u00ed achar 88 cm\u00b2. C\u00e9n fad at\u00e1 sa tsn\u00e1thaid bheag? Tabhair
  do fhreagra ceart go dt\u00ed dh\u00e1 ionad dheach\u00falacha agus \u00fas\u00e1id
  an eochair $\\\\pi$ ar d\u2019\u00e1ireamh\u00e1n.\\n\\n11. (i) Faigh achar dromchla
  bhalla\u00ed na linne sn\u00e1mha seo.\\n\\n(ii) Faigh an costas a bhainfeadh le
  t\u00edleana a chur ar na balla\u00ed m\u00e1 chosna\u00edonn na tileanna \u20ac40
  per m\u00b2 (CBL san \u00e1ireamh). Cuir 2 m\u00b2 breise san \u00e1ireamh le haghaidh
  gearrth\u00e1n agus t\u00edleana briste.\\n\\n12. T\u00e1 sc\u00e1la 1 : 25 000
  ar l\u00e9arsc\u00e1il.\\n\\n(i) Cad \u00e9 an fad iarbh\u00edr m\u00e1s \u00e9
  4 cm an fad sc\u00e1laithe?\\n(ii) Cad \u00e9 an fad sc\u00e1laithe m\u00e1s \u00e9
  3.5 km an fad iarbh\u00edr?\\n\\n13. 245 cm$^3$ toirt an phriosma seo.\\nFaigh luach
  $k$.\\n\\n14. (a) Is mian le feirmeoir p\u00e1irc a dh\u00edol. T\u00e1 s\u00fail
  aige n\u00edos m\u00f3 n\u00e1 \u20ac24 an m\u00e9adar cearnaithe a fh\u00e1il.\\nTairgeann
  an tUasal \u00d3 Duinn suim \u20ac90 000 ar an bp\u00e1irc.\\nAn ceart don fheirmeoir
  glacadh leis an tairiscint seo? M\u00ednigh do fhreagra.\\n\\n15. Is f\u00e9idir
  an eangach a l\u00e9ir\u00edtear a fhilleadh chun priosma a chruth\u00fa.\\nD\u00e9an
  cur s\u00edos go mion ar an bpriosma a chruth\u00f3idh s\u00e9.\\nAnois faigh\\n(i)
  toirt an phriosma\\n(ii) achar an dromchla ar an bpriosma.\\n\\n16. T\u00e1 achar
  129 cm$^2$ sa chiorcal m\u00f3r.\\nCad \u00e9 achar na coda sc\u00e1thaithe?\\nB\u00edodh
  do fhreagra ceart go dt\u00ed ionad deach\u00falach amh\u00e1in.\\n\\n17. (i) Tarraing
  eangach den phriosma triant\u00e1nach seo agus uaidh sin faigh an t-achar dromchla
  ioml\u00e1n.\\n(ii) M\u00e1 ghli\u00fa\u00e1iltear dh\u00e1 phriosma den chine\u00e1l
  seo d\u00e1 ch\u00e9ile, faigh:\\n(a) an t-achar dromchla ioml\u00e1n is l\u00fa,\\n(b)
  an t-achar dromchla ioml\u00e1n is m\u00f3 is f\u00e9idir a chruth\u00fa \u00f3n
  gcur le ch\u00e9ile nua.\\n\\nTasc:\\n\\nA:\\nTarraing plean iml\u00edneach de do
  halla corpoideachais.\\n\\nBain \u00fas\u00e1id as sc\u00e1la oiri\u00fanach agus
  scr\u00edobh isteach marcanna ar an bplean chun na sp\u00f3irt \u00e9ags\u00fala
  a imr\u00edtear sa halla a thaispe\u00e1int.\\n\\nComhl\u00e1naigh an t\u00e1bla
  th\u00edos lena thaispe\u00e1int an l\u00edon m\u00e9adar at\u00e1 ag teast\u00e1il
  chun gach c\u00fairt a iml\u00edni\u00fa.\\n\\n| Sp\u00f3rt | Fad na c\u00fairte
  |\\n|-------|---------------|\\n| 1     |               |\\n| 2     |               |\\n|
  3     |               |\\n\\nB:\\nBain \u00fas\u00e1id as rannad\u00f3ir agus l\u00e9arsc\u00e1il
  d''\u00c9irinn agus den Bhreatain Mh\u00f3r chun compar\u00e1id a dh\u00e9anamh
  idir fad ch\u00f3sta gach oil\u00e9ain. Sloinn do fhreagra mar ch\u00f3imheas, ceart
  go dt\u00ed an tsl\u00e1nuimhir is gaire.\"", "\"COISTE EACNAMA\u00cdOCH AGUS S\u00d3ISIALTA
  NA HEORPA\\n\\nIs comhlacht comhairleach de chuid an Aontais Eorpaigh \u00e9 Coiste
  Eacnama\u00edoch agus S\u00f3isialta na hEorpa (CESE). T\u00e1 s\u00e9 comhdh\u00e9anta
  de 350 comhalta. T\u00e1 a chuid tuairim\u00ed ag teast\u00e1il ar bhonn comhairli\u00fach\u00e1n
  \u00e9igeantach sna r\u00e9ims\u00ed at\u00e1 leagtha s\u00edos leis na Conartha\u00ed
  n\u00f3 ar bhonn comhairli\u00fach\u00e1n deonach arna dh\u00e9anamh ag an gCoimisi\u00fan,
  ag an gComhairle n\u00f3 ag an bParlaimint. F\u00e9adfaidh s\u00e9 tuairim\u00ed
  a eisi\u00faint freisin as a stuaim f\u00e9in. N\u00edl a chomhalta\u00ed faoi cheangal
  ag aon treoracha. Beidh siad go hioml\u00e1n neamhsple\u00e1ch i bhfeidhmi\u00fa
  a ndualgas, ar mhaithe le leas coiteann an Aontais.\\n\\nAN BUN\u00daS DL\u00cd\\n\\nAirteagal
  13(4) CAE; Airteagail 301-304 CFAE; agus Cinneadh (AE 2015/1157 \u00f3n gComhairle
  lena gcinntear comhdh\u00e9anamh Choiste Eacnama\u00edoch agus S\u00f3isialta na
  hEorpa.\\n\\nCOMHDH\u00c9ANAMH\\n\\nA. L\u00edon agus leithroinnt n\u00e1isi\u00fanta
  na su\u00edoch\u00e1n (Airteagal 301 CFAE)\\n\\nT\u00e1 350 comhalta ar Choiste
  Eacnama\u00edoch agus S\u00f3isialta na hEorpa (CESE) faoi l\u00e1thair, roinnte
  idir na Ballst\u00e1it mar seo a leanas:\\n\\n\u2014 24 an ceann don Fhrainc, don
  Ghearm\u00e1in, don Iod\u00e1il agus don R\u00edocht Aontaithe;\\n\u2014 21 an ceann
  don Pholainn agus don Sp\u00e1inn;\\n\u2014 15 don R\u00f3m\u00e1in;\\n\u2014 12
  an ceann don Bheilg, don Bhulg\u00e1ir, don Ghr\u00e9ig, don \u00cdsilt\u00edr,
  don Ostair, do Phoblacht na Seice, don Phortaing\u00e9il, don tSualainn agus don
  Ung\u00e1ir;\\n\u2014 9 an ceann don Chr\u00f3it, don Danmhairg, d''\u00c9irinn,
  don Fhionlainn, don Liotu\u00e1in agus don tSl\u00f3vaic;\\n\u2014 7 an ceann don
  Laitvia agus don tSl\u00f3iv\u00e9in;\\n\u2014 6 don East\u00f3in;\\n\u2014 5 an
  ceann don Chipir, do Lucsamburg agus do Mh\u00e1lta.\\n\\nI m\u00ed na Bealtaine
  2019, ghlac an Chomhairle cinneadh lenar cinneadh comhdh\u00e9anamh Choiste Eacnama\u00edoch
  agus S\u00f3isialta na hEorpa amhail \u00f3n 21 Me\u00e1n F\u00f3mhair 2020. Leis
  an gcinneadh, athra\u00edtear an l\u00edon su\u00edoch\u00e1n i gc\u00e1s ina bhf\u00e1gfaidh
  an R\u00edocht Aontaithe\\n\\nAE, a mbeadh mar thoradh air go dtiocfadh 24 shu\u00edoch\u00e1n
  chun bheith folamh. Leis na rialacha nua, tugtar su\u00edoch\u00e1n breise amh\u00e1in
  don East\u00f3in, don Chipir agus do Lucsamburg, \u00f3s rud \u00e9 gur chaill na
  Ballst\u00e1it sin su\u00edoch\u00e1n mar thoradh ar an gcinneadh deireanach a rinneadh
  ar chomhdh\u00e9anamh na gCoist\u00ed, mar gheall ar aontachas na Cr\u00f3ite. Na
  su\u00edoch\u00e1in uile eile a thiocfaidh chun bheith folamh, cuirfear ar leataobh
  iad do mh\u00e9aduithe a d''fh\u00e9adfa\u00ed a dh\u00e9anamh amach anseo. Ar an
  ioml\u00e1n, laghd\u00f3far comhdh\u00e9anamh an Choiste \u00f3 350 comhalta go
  329 comhalta m\u00e1 fh\u00e1gann an R\u00edocht Aontaithe AE.\\n\\nB. An bealach
  le haghaidh ceapach\u00e1n a dh\u00e9anamh (Airteagal 302 CFAE)\\n\\nD\u00e9antar
  comhalta\u00ed an Choiste a cheapadh tr\u00ed thromlach c\u00e1ilithe, ar bhonn
  molta\u00ed \u00f3 na Ballst\u00e1it. T\u00e9ann an Comhairle i gcomhairle leis
  an gCoimisi\u00fan maidir leis na hainmni\u00fach\u00e1in sin (Airteagal 302(2)
  CFAE). N\u00ed m\u00f3r do na Ballst\u00e1it a \u00e1irithi\u00fa go mbeidh ionada\u00ed
  ann do na catag\u00f3ir\u00ed \u00e9ags\u00fala de ghn\u00edomha\u00edocht eacnama\u00edoch
  agus sh\u00f3isialta. Sa chleachtas, b\u00edonn aon trian de na su\u00edoch\u00e1in
  ag fost\u00f3ir\u00ed, b\u00edonn aon trian acu ag fostaithe agus b\u00edonn aon
  trian acu ag ionadaithe do chatag\u00f3ir\u00ed eile (feirmeoir\u00ed, miond\u00edolt\u00f3ir\u00ed,
  gairmeacha beatha liobr\u00e1lacha, tomhalt\u00f3ir\u00ed, etc.).\\n\\nIs \u00e9
  350 uasl\u00edon chomhalta\u00ed CESE a cheada\u00edtear faoi Chonradh Liosp\u00f3in
  (Airteagal 301 CFAE). Bh\u00ed an l\u00edon n\u00edos airde n\u00e1 sin ar feadh
  tamall gairid idir I\u00fail 2013 agus Me\u00e1n F\u00f3mhair 2015 mar gheall ar
  aontachas na Cr\u00f3ite an 1 I\u00fail 2013. Nuair a cuireadh naoi su\u00edoch\u00e1n
  nua don Bhallst\u00e1t nua le CESE, mh\u00e9adaigh l\u00edon ioml\u00e1n na gcomhalta\u00ed
  go 353 (\u00f3 344). D\u00e1 bhr\u00ed sin, le cinneadh 2015/1600 \u00f3n gComhairle
  an 18 Me\u00e1n F\u00f3mhair 2015 lena gceaptar comhalta\u00ed Choiste Eacnama\u00edoch
  agus S\u00f3isialta na hEorpa don tr\u00e9imhse \u00f3n 21 Me\u00e1n F\u00f3mhair
  2015 go 20 Me\u00e1n F\u00f3mhair 2020, rinneadh laghd\u00fa ar l\u00edon na gcomhalta\u00ed
  do Lucsamburg agus don Chipir \u00f3 sheisear an ceann go c\u00faig an ceann, agus
  rinneadh laghd\u00fa ar l\u00edon na gcomhalta\u00ed don East\u00f3in \u00f3 sheachtar
  go seisear, i gcomhr\u00e9ir le leithdh\u00e1ileadh na su\u00edoch\u00e1n ar Choiste
  na R\u00e9igi\u00fan, ar a bhfuil 350 comhalta freisin.\\n\\nC. An cine\u00e1l t\u00e9arma
  oifige (Airteagal 301 CFAE)\\n\\nD\u00e9anann rialtais n\u00e1isi\u00fanta comhalta\u00ed
  an Choiste a ainmni\u00fa agus d\u00e9anann an Chomhairle iad a cheapadh le haghaidh
  t\u00e9arma inathnuaite c\u00faig bliana (Airteagal 302 CFAE). Roghna\u00edtear
  na comhalta\u00ed \u00f3 ghr\u00fapa\u00ed leasmhara eacnama\u00edocha agus s\u00f3isialta
  san Eoraip. Ba i m\u00ed Dheireadh F\u00f3mhair 2010 a rinneadh an t-athnuachan
  deiridh, don t\u00e9arma oifige 2015-2015.\\n\\nIs de cheann amh\u00e1in de thr\u00ed
  ghr\u00fapa iad:\\n\\n\u2014 Fost\u00f3ir\u00ed (Gr\u00fapa I); \u2014 Oibrithe
  (Gr\u00fapa II); \u2014 \u00c9ags\u00falacht Eoraip (Gr\u00fapa III).\\n\\nN\u00ed
  m\u00f3r do na comhalta\u00ed a bheith go hioml\u00e1n neamhsple\u00e1ch agus a
  gcuid dualgas \u00e1 gcomhl\u00edonadh acu, chun leasa ginear\u00e1lta AE (Airteagal
  300(4) CFAE). Gach uair a thiocfaidh su\u00edoch\u00e1n comhalta n\u00f3 comhalta
  ionaid chun bheith folamh tar \u00e9is deireadh a theacht lena dt\u00e9arma oifig,
  n\u00ed m\u00f3r don Chomhairle cinneadh ar leith a dh\u00e9anamh chun comhalta
  nua a cheapadh.\\n\\nEAGR\u00da AGUS N\u00d3SANNA IMEACHTA\\n\\nN\u00edl an Coiste
  luaite i measc na n-institi\u00faid\u00ed at\u00e1 liostaithe in Airteagal 13(1)
  CAE (c\u00e9 go bhfuil s\u00e9 luaite in Airteagal 13(4) go gcuid\u00edonn s\u00e9
  leis an bParlaimint, leis an gComhairle agus leis an gCoimisi\u00fan tr\u00ed ghn\u00edomha\u00edochta\u00ed
  comhairli\u00fach\u00e1in a fheidhmi\u00fa), ach t\u00e1 s\u00e9 an-neamhsple\u00e1ch
  \u00f3 thaobh eagraithe agus feidhmithe de.\\n\\n\u2014 An tUachtar\u00e1n agus
  an Bi\u00far\u00f3, a bhfuil t\u00e9arma oifige dh\u00e1 bhliain go leith ag gach
  ceann acu, d\u00e9anann an Coiste iad a cheapadh as measc a chomhalta\u00ed f\u00e9in.\\n\u2014
  Glacann an Coiste a rialacha n\u00f3s imeachta f\u00e9in.\\n\u2014 F\u00e9adfaidh
  s\u00e9 teacht le ch\u00e9ile as a stuaim f\u00e9in, ach de ghn\u00e1th tagann s\u00e9
  le ch\u00e9ile arna iarraidh sin ag an gComhairle n\u00f3 ag an gCoimisi\u00fan.\\n\u2014
  Chun cuidi\u00fa lena thuairim\u00ed a ullmh\u00fa, t\u00e1 s\u00e9 cinn de ranna
  speisialaithe aige le haghaidh r\u00e9ims\u00ed \u00e9ags\u00fala de ghn\u00edomha\u00edocht
  AE agus f\u00e9adann s\u00e9 fochoist\u00ed a bhun\u00fa chun d\u00e9ile\u00e1il
  le h\u00e1bhair ar leith.\\n\u2014 Talmha\u00edocht, Forbairt Tuaithe agus an Comhshaol
  (NAT);\\n\u2014 Aontas Eacnama\u00edoch agus Airgeada\u00edochta agus Comhth\u00e1th\u00fa
  Eacnama\u00edoch agus S\u00f3isialta (ECO);\\n\u2014 Fosta\u00edocht, Gn\u00f3tha\u00ed
  S\u00f3isialta agus Saor\u00e1nacht (SOC);\\n\u2014 Caidreamh Seachtrach (REX);\\n\u2014
  An Margadh Aonair, T\u00e1irgeacht agus Tomhaltas (INT);\\n\u2014 Iompar, Fuinneamh,
  Bonneagar agus an tSocha\u00ed Faisn\u00e9ise (TEN);\\n\u2014 Ar mhaithe le h\u00e9ifeachta\u00ed
  sineirge, d\u00e9anann s\u00e9 seirbh\u00eds\u00ed a bhuanr\u00fana\u00edochta sa
  Bhruis\u00e9il a roinnt le r\u00fana\u00edocht Choiste na R\u00e9igi\u00fan (i dtaca
  lena shu\u00edomh sa Bhruis\u00e9il, f\u00e9ach Pr\u00f3tacal Uimh. 6 a ghabhann
  le Conradh Liosp\u00f3in i dtaca leis an \u00e1it a bhfuil su\u00edomh na n-institi\u00faid\u00ed
  lonnaithe). Ina theannta sin, t\u00e1 Bi\u00far\u00f3 na Parlaiminte tar \u00e9is
  comhaont\u00fa a thabhairt i gcr\u00edch leis an gCoiste, faoi chuimsi\u00fa n\u00f3s
  imeachta buis\u00e9adach 2014, chun gn\u00f3thachan \u00e9ifeacht\u00falachta i
  r\u00e9imse an aistri\u00fach\u00e1in a bhaint amach le ch\u00e9ile. T\u00e1 buis\u00e9ad
  riarach\u00e1in bliant\u00fail de EUR 131 milli\u00fan (2014) ag an gCoiste, at\u00e1
  ar \u00e1ireamh i roinn VI de bhuis\u00e9ad AE.\\n\\nCUMHACHTA\u00cd\\n\\nBuna\u00edodh
  an Coiste le Conartha\u00ed na R\u00f3imhe 1957 chun go mbeadh gr\u00fapa\u00ed
  leasmhara eacnama\u00edocha agus s\u00f3isialta p\u00e1irteach i gc\u00f3mhargadh
  a bhun\u00fa agus chun s\u00e1sra\u00ed idirinstiti\u00faideacha a chur ar f\u00e1il
  chun faisn\u00e9isi\u00fa faoi shaincheisteanna Eorpacha a thabhairt don Choimisi\u00fan
  agus do Chomhairle na nAir\u00ed. Leis an Ionstraim Eorpach Aonair (1986) agus le
  Conradh Maastricht (1992), th\u00e1inig m\u00e9ad\u00fa ar an r\u00e9imse saincheisteanna
  nach fol\u00e1ir a tharchur chuig an gCoiste. Le Conradh Amstardam, leathna\u00edodh
  tuilleadh raon na r\u00e9ims\u00ed ba gh\u00e1 a tharchur chuig an gCoiste, agus
  ceada\u00edodh go rachadh Parlaimint na hEorpa i gcomhairle leis. Ar an me\u00e1n,
  d\u00e9anann Coiste Eacnama\u00edoch agus S\u00f3isialta na hEorpa 170 doicim\u00e9ad
  agus tuairim chomhairleach a eisi\u00faint gach bliana (a nd\u00e9anann s\u00e9
  tuairim is 15% d\u00edobh a eisi\u00faint\\n\\nas a stuaim f\u00e9in). Foils\u00edtear
  na tuairim\u00ed san Iris Oifigi\u00fail. T\u00e1 feidhm chomhairli\u00fach\u00e1in
  ag an gCoiste (Airteagal 300 CFAE). Is \u00e9 an cusp\u00f3ir at\u00e1 aige n\u00e1
  na hinstiti\u00faid\u00ed at\u00e1 freagrach as cinnteoireacht AE a chur ar an eolas
  faoi thuairim\u00ed na n-ionadaithe i dtaobh gn\u00edomha\u00edocht eacnama\u00edoch
  agus sh\u00f3isialta.\\n\\nA. Tuairim\u00ed a eis\u00edtear arna iarraidh sin ag
  institi\u00faid\u00ed AE\\n\\n1. Comhairli\u00fach\u00e1in \u00e9igeantach\\n\\nI
  roinnt r\u00e9ims\u00ed a luaitear go sonrach, sonra\u00edonn CFAE nach bhf\u00e9adfar
  cinneadh a dh\u00e9anamh ach amh\u00e1in tar \u00e9is don Chomhairle n\u00f3 don
  Choimisi\u00fan dul i gcomhairle leis an gCoiste. Is iad na r\u00e9ims\u00ed sin:\\n\\n\u2014
  an beartas talmha\u00edochta (Airteagal 43);\\n\u2014 saorghluaiseacht daoine agus
  seirbh\u00eds\u00ed (Airteagal 46, Airteagal 50 agus Airteagal 59);\\n\u2014 an
  beartas iompair (Airteagal 91, Airteagal 95 agus Airteagal 100);\\n\u2014 c\u00e1nachas
  ind\u00edreach a chomhchuibhi\u00fa (Airteagal 113);\\n\u2014 comhfhogas\u00fa a
  dh\u00e9anamh ar dhl\u00edthe maidir leis an margadh inmhe\u00e1nach (Airteagal
  114 agus Airteagal 115);\\n\u2014 an beartas fosta\u00edochta (Airteagal 148, Airteagal
  149 agus Airteagal 153);\\n\u2014 an beartas s\u00f3isialta, oideachas, gairmoili\u00faint
  agus an \u00f3ige (Airteagal 156, Airteagal 165 agus Airteagal 166);\\n\\n\u2014\\n\\nsl\u00e1inte
  phoibl\u00ed (Airteagal 168);\\n\\n\u2014 cosaint an tomhalt\u00f3ra (Airteagal
  169);\\n\u2014 gr\u00e9as\u00e1in thras-Eorpacha (Airteagal 172);\\n\\n\u2014\\n\\nan
  beartas tionscla\u00edochta (Airteagal 173);\\n\\n\u2014 comhth\u00e1th\u00fa eacnama\u00edoch,
  s\u00f3isialta agus cr\u00edochach (Airteagal 175);\\n\u2014 taighde agus forbairt
  theicneola\u00edoch agus an sp\u00e1s (Airteagal 182 agus Airteagal 188);\\n\u2014
  an comhshaol (Airteagal 192).\\n\\n2.\\n\\nComhairli\u00fach\u00e1n deonach\\n\\nF\u00e9adfaidh
  an Pharlaimint, an Coimisi\u00fan n\u00f3 an Chomhairle dul i gcomhairle leis an
  gCoiste freisin maidir le haon \u00e1bhar eile de r\u00e9ir mar is cu\u00ed leo.
  Aon uair a rachaidh na hinstiti\u00faid\u00ed sin i gcomhairle leis an gCoiste,
  cib\u00e9 acu ar bhonn \u00e9igeantach n\u00f3 ar bhonn deonach, f\u00e9adfaidh
  siad teorainn ama a shocr\u00fa (aon mh\u00ed amh\u00e1in ar a laghad) agus n\u00ed
  f\u00e9idir cosc a chur orthu bearta breise a dh\u00e9anamh ina dhiaidh sin mar
  gheall ar easpa tuairime uathu (Airteagal 304 CFAE).\\n\\nB. Tuairim a eisi\u00faint
  as a stuaim f\u00e9in\\n\\nF\u00e9adfaidh an Coiste a chinneadh tuairim a eisi\u00faint
  aon uair a mheasann s\u00e9 go mbeadh s\u00e9 iomchu\u00ed d\u00e9anamh amhlaidh.\\n\\nUdo
  Bux 05/2019\"", "\"ITL 2020\\n\\nITL F\u00eds agus Strait\u00e9is go dt\u00ed 2020\\n\\nCeannaireacht
  Ghn\u00edomhach san Oideachas, sa bhFiontra\u00edocht agus sa Rannph\u00e1irt\u00edocht.\\n\\nFaofa
  ag Bord Rialaithe ITL i m\u00ed Mh\u00e1rta 2011\\n\\nCl\u00e1r\\n\\nCUID 1 R\u00c1ITEAS
  F\u00cdSE ITL\\n\\nCeannaireacht Ghn\u00edomhach san Oideachas, sa bhFiontra\u00edocht
  agus sa Rannph\u00e1irt\u00edocht ar fud Chathair agus Chontae Luimnigh, Thiobrad
  \u00c1rann agus an Chl\u00e1ir\\n\\nTugann an ch\u00e1ip\u00e9is seo forl\u00e9argas
  ar fhorbairt Institi\u00faid Teicneola\u00edochta Luimnigh sna blianta go 2020.
  Is sol\u00e1thr\u00f3ir ardoideachais \u00ed Institi\u00faid Teicneola\u00edochta
  Luimnigh faoi Acht na nInstiti\u00faid\u00ed Teicneola\u00edochta 2006, agus \u00fadar\u00e1s
  tarmligthe againn \u00e1r nd\u00e1mhachtain\u00ed f\u00e9in a dh\u00e9anamh suas
  go leibh\u00e9al 9 (m\u00fainte) agus is sol\u00e1thr\u00f3ir faofa leibh\u00e9al
  9/10 (taighde) muid chomh maith. T\u00e1 an r\u00e1iteas f\u00edse agus spriocanna
  strait\u00e9iseacha a chuirtear i l\u00e1thair anseo \u00e1 dh\u00e9anamh tar \u00e9is
  tr\u00e9imhse f\u00edor-rath\u00fail f\u00e1is faoin bPlean Strait\u00e9iseach a
  chuaigh roimhe 2006 go 2010. Chr\u00edochnaigh an tr\u00e9imhse le hAthbhreithni\u00fa
  Insiti\u00faide faoi Chomhairle na nD\u00e1mhachtain\u00ed Breisoideachais agus
  Oili\u00fana nuair a mhol pain\u00e9al idirn\u00e1isi\u00fanta \u00e1r gc\u00f3rais
  ard\u00e9ifeacht\u00fala dearbh\u00fa c\u00e1il\u00edochta, \u00e1r bhfeals\u00fanacht
  oideachas\u00fail a chuirtear ar f\u00e1il go d\u00e1ir\u00edre i gcleachtas, \u00e1r
  rannph\u00e1irt\u00edocht chumhachtach le tionscal agus pobal, agus na modheola\u00edochta\u00ed
  aib\u00ed at\u00e1 againn chun strait\u00e9is a fhorbairt agus athbhreithnithe a
  dh\u00e9anamh.\\n\\nAgus an tr\u00e9imhse deireanach strait\u00e9iseach plean\u00e1la
  ag teacht chun deiridh t\u00e1 t\u00fas \u00e1 chur le LIT m\u00e9adaithe agus Institi\u00faid
  Forbartha Tuaithe agus Gn\u00f3 Thiobrad \u00c1rann (TI) ag teacht isteach linn
  go h\u00e9ifeacht\u00fail \u00f3 mh\u00ed Mhe\u00e1n F\u00f3mhair 2011. Is m\u00f3r
  an m\u00e9ad\u00fa \u00e9 seo ar mh\u00e9id agus ar r\u00e9imse na heagra\u00edochta,
  agus beidh muid freagrach anois as foireann agus mic l\u00e9inn i gc\u00faig champas
  agus i dtr\u00ed ionad for-rochtana eile.   Beidh n\u00edos m\u00f3 n\u00e1 7,000
  mac l\u00e9inn l\u00e1naimseartha san ITL m\u00e9adaithe agus tuileadh cumas f\u00e1is
  ann, chomh maith le timpeall 550 ball foirne.  Beidh muid ag freastal ar \u00e1r
  gceantar mar a bhfuil campais n\u00f3 gn\u00edomha\u00edocht fhor-rochtana againn,
  Cathair agus Contae Luimnigh, Tiobrad \u00c1rann agus an Cl\u00e1r.  Chomh maith
  leis sin, beidh muid ag freastal ar chontaetha m\u00e1guaird, lena n-\u00e1ir\u00edtear
  m\u00f3rbhailte agus c\u00falchr\u00edoch m\u00f3r tuaithe.   T\u00e1 ITL bunaithe
  go daingean anois mar cheann de na gn\u00edomhair\u00ed is m\u00f3 san earn\u00e1il
  seo agus t\u00e1 s\u00e9 seo r\u00edth\u00e1bhachach sa chomhth\u00e9acs nua ardoideachais.  Ach
  tuigimid go maith na d\u00fashl\u00e1in a bhainfidh leis an gcomhth\u00e1th\u00fa
  le TI agus leis an oibr\u00edocht ilchampais a bheidh ann d\u00e1 bharr thar r\u00e9igi\u00fan
  leathan t\u00edreola\u00edoch.  Ina chruth nua beidh ar ITL d\u00edri\u00fa ar a
  mhisean ar son foghlaimeoir\u00ed agus p\u00e1irtithe leasmhara eile, ag eascairt
  as f\u00eds agus cusp\u00f3ir aontaithe l\u00e1nchomhth\u00e1ite a thuigeann agus
  a mhotha\u00edonn an fhoireann agus gach dream a bh\u00edonn ag obair i gcomhar
  linn. N\u00ed m\u00f3r acmhainn\u00ed d\u00f3thanacha a beith mar bhonn don bhf\u00eds
  seo fi\u00fa m\u00e1 t\u00e1 siad srianta, agus n\u00ed m\u00f3r c\u00f3rais a bheidh
  oiri\u00fanach d\u00e1 bhfeidhm agus pr\u00f3isis r\u00e9idhe a bheith ann.\\n\\nT\u00e1
  cruth \u00e1 chur ag ITL ar \u00e1r bhf\u00eds agus \u00e1r dtreo strait\u00e9iseach
  do na deich mbliana at\u00e1 romhainn agus sinn ag t\u00f3g\u00e1il ar an neart
  agus ar na forbairt\u00ed san eagra\u00edocht f\u00e9in agus ar ch\u00e1il \u00e1r
  gc\u00e9imithe.  T\u00e1 s\u00e9 seo ar bun agus d\u00fashl\u00e1in fh\u00edordheacra
  ann do St\u00e1t na h\u00c9ireann, don earn\u00e1il ardoideachais agus d\u00e1r
  r\u00e9igi\u00fan.  Is d\u00f3cha go mairfidh na d\u00fashl\u00e1in seo ar aghaidh
  ar feadh formh\u00f3r na ndeich mbliana, rud a leagann freagracht ollmh\u00f3r ar
  \u00e1r ngluailne mar lucht oideachais agus mar ionad fosta\u00edochta.  Beidh cionroinnt
  th\u00f3g\u00e1lach \u00e1 dh\u00e9anamh ag ITL ar son t\u00e9arnaimh inmharthana
  agus ar son athnuachana, ag eascairt as an r\u00e1iteas misin agus na luachanna
  a leagtar s\u00edos in\u00e1r gCairt.\\n\\nUllmha\u00edonn ITL foghlaimeoir\u00ed
  do shaol s\u00e1s\u00fail d\u00fashl\u00e1nach, agus cotha\u00edonn s\u00ed forbairt
  ghairmi\u00fail, intleacht\u00fail, sh\u00f3isialta, chult\u00fartha agus phearsanta
  an duine aonair.  Is \u00ed an fhoghlaim ghn\u00edomhach le cumasc\u00fa de theoiric
  agus de chleachtas  sainmharc \u00e1r bhfeals\u00fanacht oideachais.   Cuirimid
  oideachas tri\u00fa agus ceathr\u00fa leibh\u00e9il ar f\u00e1il, chomh maith le
  hoili\u00faint agus taighde, agus t\u00e1 r\u00f3l l\u00e1rnach againn i bhforbairt
  eacnama\u00edoch agus shocha-chult\u00fartha \u00e1r r\u00e9igi\u00fain.\\n\\nBeidh
  ceannaireacht ghn\u00edomhach \u00e1 l\u00e9iri\u00fa ag ITL agus \u00e1r misean
  \u00e1 sheachadadh againn ar son foghlaimeoir\u00ed agus gach p\u00e1irt\u00ed leasmhar
  eile, lena n-\u00e1ir\u00edtear an fhoireann, sna pr\u00edomhsn\u00e1itheanna seo
  a leanas:\\n\\nCeannaireacht ghn\u00edomhach san oideachas agus san oili\u00faint:
  T\u00e1 caighde\u00e1in ch\u00e1il\u00edochta den scoth ag ITL mar aon le cur chuige
  comhlean\u00fanach gn\u00edomhach foghlama a chuireann eispearais fh\u00edr\u00e9anta
  agus timpeallacht foghlama spreag\u00fail ar f\u00e1il at\u00e1 bunaithe ar luachanna
  do r\u00e9imse ilghn\u00e9itheach foghlaimeoir\u00ed.\\nCeannaireacht ghn\u00edomhach
  i bhforbairt fiontra\u00edochta agus in aistri\u00fa eolais: beidh beala\u00ed nu\u00e1lacha
  \u00e1 thairiscint ag Dr\u00e9imire Fiontra\u00edocht ITL d''fhoghlaimeoir\u00ed
  ITL, cuideachta\u00ed campais agus mac-chuideachta\u00ed chomh maith le cliaint\u00ed
  seachtracha chun a bheith rannph\u00e1irteach i dtaca\u00ed fiontra\u00edochta agus
  i dtaighde fheidhmeach, d''fhonn eolas agus fosta\u00edocht nua a chruth\u00fa.\\nCeannaireacht
  ghn\u00edomhach rannph\u00e1irteach sa phobal: Beidh ITL ag lean\u00faint ar aghaidh
  ag cruth\u00fa naisc l\u00e1idre leis an tionscla\u00edocht agus leis an phobal
  i gcoitinne, le taca\u00edcocht \u00f3 mhaoini\u00fa m\u00f3rshruthach, \u00f3 shruthanna
  malartacha ioncaim agus \u00f3 shocruithe deonacha ar mhaithe le seirbhis a shol\u00e1thar
  don tionscla\u00edocht agus don phobal ar leibh\u00e9al na hinstiti\u00faide na
  foirne agus na mac l\u00e9inn.\\nCeannaireacht Ghn\u00edomhach i gcruth\u00fa t\u00edrdhreach
  an ardoideachais. Beidh ITL onnghn\u00edomhach in\u00e1r bhfreagairt do bheartas
  nua an rialtais \u00f3 foils\u00edodh an Strait\u00e9is N\u00e1isi\u00fanta don
  Ardoideachais go dt\u00ed 2030, tr\u00ed chruth\u00fa Chomhghualla\u00edocht nua
  Ardoideachais Tras-\u00c9ireann le comhph\u00e1irtithe in earn\u00e1il na nInstiti\u00faid\u00ed
  Teicneola\u00edochta agus tr\u00ed neart\u00fa a dh\u00e9anamh ar an gcomhghualla\u00edocht
  tras-earn\u00e1la at\u00e1 againn cheana f\u00e9in (Consortiam na Sionnaine, faoi
  sti\u00far Ollscoil Luimnigh).  Leanfar ar aghaidh leis an bhfeidhm\u00edocht den
  scoth sa cheannaireacht ghn\u00edomhach seo in aghaidh thagarmharcanna \u00e9ifeacht\u00falachta
  agus \u00e9ifeachtachta.\\n\\nTr\u00edd an cheannaireacht ghn\u00edomhach seo, beidh
  tionchar agus feidhm ag ITL ar rath an r\u00e9igi\u00fain, agus beidh p\u00e1irt
  mh\u00f3r againn san earn\u00e1il oideachais go n\u00e1isi\u00fanta. Agus sin \u00e1
  dh\u00e9anamh againn, t\u00e1 ITL muin\u00edneach go s\u00e1s\u00f3idh muid na crit\u00e9ir
  at\u00e1 molta sa Strait\u00e9is N\u00e1isi\u00fanta don Ardoideachas go dt\u00ed
  2030 d''Instiiti\u00faid\u00ed Teicneola\u00edochta nua-aimseartha. Ar ball, d''fh\u00e9adfadh
  s\u00e9 go nd\u00e9anfa\u00ed iarratas ar athaimnni\u00fa ITL mar Ollscoil Teicneola\u00edoch
  i gcomhar le comhph\u00e1irt\u00ed n\u00f3 comhph\u00e1irtithe comhghualla\u00edochta,
  faoi r\u00e9ir ag beartas rialtais agus reachta\u00edocht chumas\u00fach\u00e1in.\\n\\nN\u00ed
  m\u00f3r a mheabhr\u00fa go mbeidh na n\u00f3smhaireachta\u00ed iarratais dian agus
  fad\u00e1lach, agus go mbainfidh crit\u00e9ir dhiana leo. M\u00e1 t\u00e1 athaimni\u00fa
  le d\u00e9anamh n\u00ed m\u00f3r go mbainfidh mic l\u00e9inn agus c\u00e9imithe
  leas as. Cuirfear taifead br\u00f3d\u00fail ITL mar insiti\u00faid neamhsple\u00e1ch
  le c\u00e9annacht mar mh\u00f3rphol oideachais i Me\u00e1n-Iarthar na h\u00c9ireann
  san \u00e1ireamh, agus misean soil\u00e9ir nach nd\u00e9anfar aon mhaol\u00fa air
  seo.\\n\\nSna fiontair cheannaireachta seo, t\u00e1 comhph\u00e1irtithe againn \u00f3n
  tionscla\u00edocht, \u00f3n oideachas dara leibh\u00e9il agus iar-Ardteiste, \u00f3
  na gn\u00edomhaireachta\u00ed \u00e1bhartha agus \u00f3n bpobal i gcoitinne. D\u00e9anfaidh
  ITl forbairt freisin ar an l\u00edonra idirn\u00e1isi\u00fanta comhph\u00e1irtithe
  at\u00e1 againn, le toise iln\u00e1isi\u00fanta ilchult\u00fartha a chur le timpeallacht
  foghlama na bhfoghlaimeoir\u00ed a bheidh againn amach anseo. N\u00ed m\u00f3r d\u00e1r
  gc\u00e9imithe a bheith oilte i bhfios gn\u00f3 agus in inni\u00falachta\u00ed don
  mhargadh domhanda. T\u00e1 c\u00e1il ar ch\u00e9imithe na h\u00c9ireann as a bheith
  infhostaithe le cuideachta\u00ed idirn\u00e1isi\u00fanta agus as a gcumas oiri\u00fanaithe
  sa bhaile agus thar lear, agus as cumas m\u00e9adaithe chun fiontair dh\u00fachasacha
  a chruth\u00fa a bh\u00edonn ag tr\u00e1d\u00e1il go hidirn\u00e1isi\u00fanta.  Beidh
  c\u00e9imithe ITL ar th\u00fas cadhna\u00edochta sna treochta\u00ed seo agus cuirfear
  ar a gcumas breathn\u00fa amach thar an l\u00e9asl\u00edne \u00e1iti\u00fail.\\n\\nBeidh
  crainn taca seo cheannaireacht ITL (foghlaim ghn\u00edomhach, an dr\u00e9imire fiontra\u00edochta,
  rannph\u00e1irt\u00edocht sa phobal agus cruth\u00fa na timpeallachta ardoideachais)
  mar dh\u00fashraith do na tr\u00ed sprioc d\u00e9ag strait\u00e9iseacha at\u00e1
  leagtha amach sa ch\u00e1ip\u00e9is seo. Ar son na soil\u00e9ireachta sa bhfeidhmi\u00fa
  agus ar mhaith le h\u00fain\u00e9ireacht a shannadh d''fheidhmeanna ar leith san
  eagra\u00edocht, t\u00e1 na tr\u00ed sprioc strait\u00e9iseacha d\u00e9ag curtha
  isteach i dtr\u00ed fhearann leathan. Cl\u00fada\u00edonn an earn\u00e1il pr\u00f3if\u00edl
  acad\u00fail na cro\u00edsheirbh\u00eds\u00ed don phobal: teagasc agus foghlaim,
  taca\u00ed d''fhoghlaimeoir\u00ed agus aistri\u00fa teicneola\u00edochta (forbairt
  fiontra\u00edochta agus taighde feidhmeach). Sa roinn inmharthanacht na hinstiti\u00faide
  l\u00e9ir\u00edtear conas a chabhr\u00f3idh r\u00e9imse leathan feidhmeanna taca\u00edochta
  agus acmhainn\u00ed le ITL an pr\u00f3if\u00edl at\u00e1 uainn a sheachadadh. Agus
  sa roinn dheireannach, an timpeallacht, t\u00e1 creatlach \u00e1 thairiscint againn
  le hainil\u00eds lean\u00fanach a dh\u00e9anamh ar \u00e1r dtimpeallacht oibri\u00fach\u00e1in
  agus ar an gcaoi a mbeidh \u00e1r bp\u00e1irt f\u00e9in \u00e1 imirt againn.\\n\\nCuirtear
  mianta agus spriocanna leathana in i\u00fal sa r\u00e1iteas f\u00edse agus strait\u00e9ise
  seo go dt\u00ed 2020. Bainfear timthriallacha strait\u00e9iseacha plean\u00e1la
  n\u00edos giorra as an gc\u00e1ip\u00e9is seo a fhorbr\u00f3far ar bhonn rothlaithe
  i dtr\u00e9imhs\u00ed bliana agus dh\u00e1 bhliana mar is cu\u00ed. Leagfear amach
  cusp\u00f3ir\u00ed sna pleananna gearrth\u00e9armacha seo a bheidh nasctha le pr\u00edomhth\u00e1scair\u00ed
  feidhm\u00edochta (PTF) i bhfearainn leathana na spriocanna strait\u00e9iseacha,
  agus d\u00e9anfar iad a fhorbairt agus a fhaire ag leibh\u00e9al na hInstiti\u00faide
  agus an cheantair. Beidh gach ceantar ar leith freagrach as pleananna comhph\u00e1irte
  a fhorbairt de r\u00e9ir strucht\u00far uileghabh\u00e1lach eagr\u00fach\u00e1in
  ITL, agus is iad seo iad faoi l\u00e1thair:\\n\\nScoil Eala\u00edne agus Deartha
  Luimnigh An Scoil Eola\u00edochta, Innealt\u00f3ireachta agus TF An Scoil Gn\u00f3
  agus Daonnachta\u00ed Scoil na Timpeallachta T\u00f3gtha Scoil Thiobrad \u00c1rann
  ITL R\u00e9imse an R\u00fana\u00ed/Rialt\u00f3ir Airgeadais\\n\\nR\u00e9imse an
  Chl\u00e1raitheora\\n\\nR\u00e9imse na Forbartha\\n\\nBraitheann f\u00edor\u00fa
  aon fh\u00edse strait\u00e9is\u00ed ar dhaoine.  Bh\u00ed inchur suntasach ag an
  mbord rialaithe, ag p\u00e1irtithe leasmhara seachtracha, ag ceardchumainn na foirne,
  ag comhalta na comhairle acad\u00fala agus ag mic l\u00e9inn ar fud eagra\u00edocht
  mh\u00e9adaithe ITL i bhforbairt na c\u00e1ip\u00e9ise seo.  Thar saolr\u00e9 an
  phlean strait\u00e9isigh seo, is cinnte go dtiocfaidh athr\u00fa ar strucht\u00far
  agus ar chomhdh\u00e9anamhm na n-eagra\u00edocht agus na ndaoine at\u00e1 rannph\u00e1irteach.  Mairfidh
  an fh\u00eds shoil\u00e9ir agus an treoir strait\u00e9iseach \u00e1fach, agus gach
  duine a bhfuil baint acu le ITL ag glacadh go br\u00f3d\u00fail leo.\\n\\nM\u00e1rta
  2011\\n\\nAn tUasal John Clifford, Cathaoirleach,\\n\\nAn Dr. Maria Hinfelaar, Uachtar\u00e1n\\n\\nCUID
  II SPRIOCANNA STRAIT\u00c9ISEACHA\\n\\nSna ranna th\u00edos cuirtear tr\u00ed sprioc
  strait\u00e9iseach d\u00e9ag i l\u00e1thair faoi na cinnteidil seo a leanas:\\n\\nFearann
  A - Pr\u00f3if\u00edl Acad\u00fail\\n\\n1. Foghlaimeoir\u00ed\\n2. Teagasc\u00f3ir\u00ed\\n3.
  Taca\u00ed d''Fhoghlaimeoir\u00ed\\n4. Aistri\u00fa Eolais - Taighde\\n5. Aistri\u00fa
  Eolais - Forbairt Fiontra\u00edochta\\n\\nFearann B - Inmharthanacht Institi\u00faideach\\n\\n6.
  Pobal\\n7. Cumars\u00e1id\\n8. \u00c1iteanna\\n9. C\u00f3rais\\n10. Cist\u00ed\\n\\nFearann
  C - an Timpeallacht\\n\\n11. An R\u00e9igi\u00fan - Tionscla\u00edocht agus an Pobal\\n12.
  An Earn\u00e1il - Oideachas agus Comhlachta\u00ed N\u00e1isi\u00fanta\\n13. An M\u00f3rthimpeall
  (Macra-l\u00e9abh\u00e9al )\\n\\nT\u00e1 gach sprioc miondealaithe de r\u00e9ir
  mianta agus cusp\u00f3ir\u00ed \u00e9ags\u00fala i bhform\u00e1id insinte. Beidh
  na cusp\u00f3ir\u00ed seo ina gcn\u00e1mh droma do na pleananna comhph\u00e1irteacha
  a bheidh \u00e1 ndr\u00e9achtadh laistigh de gach r\u00e9imse \u00e1bhartha freagrachta,
  .i. na ranna acad\u00fala agus na r\u00e9ims\u00ed feidhmi\u00fach\u00e1in. Nuair
  ba fh\u00e9idir \u00e9, rinneadh pr\u00edomhth\u00e1scair\u00ed feidhm\u00edochta
  inchainn\u00edocht\u00fala (PTF - Aguis\u00edn 3) a fhorbairt mar chomhartha\u00ed
  eolais soil\u00e9ire do thuarasc\u00e1la agus athbhreithnithe lean\u00fanacha, chomh
  maith le faisn\u00e9is ch\u00e1il\u00edochtach a bheidh ag coth\u00fa na n-athbhreithnithe
  sin. T\u00e1 na PTF\u00ed seo bunaithe ar an modheola\u00edocht a glacadh faoin
  bPlean Strait\u00e9iseach roimhe seo, agus t\u00e1 tuilleadh feabhs\u00fa d\u00e9anta
  orthu in\u00e1r bhfeidhm inmhe\u00e1nach ini\u00fach\u00f3ireachta a bh\u00ed ar
  a sheal faoi threoir ag tortha\u00ed Athbhreithni\u00fa Institi\u00faideach ITL,
  na cleachtais n\u00e1isi\u00fanta is fearr agus treoirl\u00ednte an \u00dadar\u00e1s
  Ard-Oideachais.\\n\\nAr fud chorp an t\u00e9acs agus suite leis na spriocanna \u00e1bhartha
  strait\u00e9iseacha, d\u00e9antar tagairt do na pr\u00edomh-mholta\u00ed at\u00e1
  sa Strait\u00e9is N\u00e1isi\u00fanta don Ardoideachas go 2030 a sheoil an tAire
  Oideachais agus Scileanna i m\u00ed Ean\u00e1ir 2011. N\u00ed m\u00f3r a mheabhr\u00fa
  nach nd\u00e9anann na tagairt\u00ed sin ach a l\u00e9iri\u00fa chomh d\u00edlis
  is at\u00e1 an smaointeoireacht in ITL do na molta\u00ed strait\u00e9iseacha n\u00e1isi\u00fanta
  agus do na beartais at\u00e1 ag teacht chun cinn: n\u00ed forl\u00e9argas cuimsitheach
  at\u00e1 iontu.\\n\\nFearann A - Pr\u00f3if\u00edl Acad\u00fail\\n\\nUaillmhian
  go 2020: Timthriallacha Plean\u00e1la n\u00edos Giorra:\\n\\nCad a bheidh mar eisint
  ch\u00e9annachta againn \u00e1r gcro\u00ed-ghn\u00f3?\\n\\nConas a roghn\u00f3far
  tosa\u00edochta\u00ed agus conas a thomhaisimid f\u00e9in na PTF\u00ed? C\u00e9n
  \u00edomh\u00e1 at\u00e1 againn?\\n\\n\\\"\\n\\n-\\n\\n.\\\" (An Strait\u00e9is
  N\u00e1isi\u00fanta Ard-Oideachais go dt\u00ed\\n\\n2030, Moladh 4)\\n\\n1. Foghlaimeoir\u00ed\\n\\nT\u00e1
  an foghlaimeoir i gcro\u00edl\u00e1r gach a nd\u00e9anaimid agus is \u00ed \u00e1r
  gcro\u00ed-fheidhm eispeireas oideachas\u00fail den scoth a shol\u00e1thar don fhoghlaimeoir
  a bhainfidh amach misean na hInstiti\u00faide - forbairt ghairmi\u00fail, intleacht\u00fail,
  sh\u00f3isialta, chult\u00fartha agus phearsanta an duine a choth\u00fa.  Cuirtear
  in i\u00fal sna spriocanna agus na cusp\u00f3ir\u00ed at\u00e1 sa phlean strait\u00e9iseach
  seo conas at\u00e1 s\u00e9 i gceist ag ITL seachadadh a dh\u00e9anamh ar an misean
  seo.\\n\\nLeanfaidh ITL ar aghaidh mar shol\u00e1thr\u00f3ir m\u00f3r CAO do ch\u00f3h\u00f3irt
  f\u00e1g\u00e1il scoile a bheidh ag dul isteach i gcl\u00e1ir leibh\u00e9al 6, 7
  agus 8, agus is iad sin an t-iont\u00f3g\u00e1il is m\u00f3 a bheidh againn.  Meallfaimid
  chugainn mic l\u00e9inn cumasacha spreagtha.  Beidh an sprioc seo \u00e1 l\u00e9iri\u00fa
  i m\u00e9adraigh a bheidh miondealaithe de r\u00e9ir r\u00e9imse acad\u00fail, ar
  n\u00f3s c\u00f3imheasa c\u00e9ad rogha agus glacadh, mar aon le naisc le scoieanna
  dara leibh\u00e9il agus comhaontaithe comhalt\u00fach\u00e1in le col\u00e1ist\u00ed
  iar-Ardteiste.\\n\u00d3 thaobh m\u00e9ide, beidh ITL, agus Institi\u00faid Thiobrad
  \u00c1rann, mar a bh\u00ed, c\u00f3nasctha l\u00e9i, ar cheann de na hInstiti\u00faid\u00ed
  Teicneola\u00edochta is m\u00f3 sa t\u00edr \u00f3 thaobh l\u00edon na mac l\u00e9inn.  Beidh
  cumas \u00e9ags\u00fala f\u00e1is i ngach campas, ag brath ar an m\u00e9id foirne
  agus acmhainn\u00ed fisici\u00fala a bheidh ar f\u00e1il, ar \u00e9ileamh na mac
  l\u00e9inn ar ch\u00farsa\u00ed agus ar an t\u00edrdhreach m\u00f3rthimpeall. D\u00e9anfar
  coigeart\u00fa bliant\u00fail ar dhearbhspriocanna, ag brath ar r\u00e9imse c\u00fains\u00ed
  doshrianta ar n\u00f3s leithdh\u00e1ileadh maoin\u00fa, cionroinnt na mac l\u00e9inn,
  cu\u00f3ta foirne agus riocht eacnama\u00edoch na t\u00edre.\\nBeidh ITL ina mh\u00f3rshol\u00e1thr\u00f3ir
  i gc\u00f3na\u00ed ar son gr\u00fapa\u00ed neamhthraidisi\u00fanta nach bhfuil ionada\u00edocht
  l\u00edonmhar acu san oideachas l\u00e1naimseartha, s\u00e1s\u00f3idh s\u00ed n\u00f3
  s\u00e1r\u00f3idh s\u00ed na tairg\u00e9id\u00ed at\u00e1 leagtha s\u00edos ag an
  HEA at\u00e1 nasctha le samhail maoinithe na hearn\u00e1la. Spreagfar modhanna malartacha
  iontr\u00e1la ar n\u00f3s iontr\u00e1il dh\u00edreach, iontr\u00e1il ar ch\u00e9im
  chun cinn, agus aistri\u00fa.\\nM\u00e9ad\u00f3idh ITL an sol\u00e1thar le haghaidh
  deiseanna oideachais ar feadh an tsaoil mar \u00e1is d''fhoghlaimeoir\u00ed ar mian
  leo tabhairt faoin oideachas ar bhonn p\u00e1irt-aimseartha n\u00f3 sol\u00fabtha.
  Cuirfear cl\u00e1ir o\u00edche, d\u00e1mhachtanna speisialta, cl\u00e1ir fhor-rochtana,
  seachadadh ar l\u00edne, cl\u00e1ir ghn\u00edomhaithe sa mhargadh saothair, foghlaim
  obairbhunaithe agus\\n\\n\\\"\\n\\nsamhlacha cros-s\u00edolracha ar f\u00e1il le
  taca\u00edocht na teicneola\u00edochta. Cuirfear na deiseanna foghlama ar feadh
  an tsaoil seo ar f\u00e1il d''fhoghlaimeoir\u00ed aonair, don tionscla\u00edocht,
  do chomhlachta\u00ed poibl\u00ed, do phobail agus d''fhorais ghairmi\u00fala.\\nCuirfidh
  ITL go m\u00f3r lena phunann deiseanna iarch\u00e9ime, i gcl\u00e1ir mh\u00fainte
  agus taighde araon ar mhaithe le cos\u00e1in nua a chruth\u00fa do mhic l\u00e9inn
  tr\u00ed leibh\u00e9il ch\u00e1il\u00edochta 9 agus 10. D\u00edreofar sna cl\u00e1ir
  mh\u00fainte agus taighde seo chomh maith ar fhoghlaimeoir\u00ed l\u00e1nfh\u00e1sta
  agus f\u00e9adfar iad a thairiscint ar bhonn mod\u00falacht agus sol\u00fabtha,
  ar n\u00f3s diopl\u00f3ma\u00ed speisialta a sheachadfar don tionscla\u00edochta.
  Beidh cumas ITL an sprioc seo a sheachadadh faoi r\u00e9ir ag srianta maoinithe
  ar an institi\u00faid f\u00e9in agus ar an fhoghlaimeoir araon.\\nM\u00e9ad\u00f3idh
  ITL l\u00edon na bhfoghlaimeoir\u00ed idirn\u00e1isi\u00fanta, de r\u00e9ir bheartas
  an Rialtais (AE agus neamh-AE, ar sc\u00e9imeanna \u00edoc t\u00e1ill\u00ed chomh
  maith le sc\u00e9imeanna malartaithe). D\u00e9anfar na foghlaimeoir\u00ed sin a
  earc\u00fa ar bhealach spriocdh\u00edrithe sa \u00e1it a bhfuil cumas cheana agus
  inar f\u00e9idir naisc a dh\u00e9anamh le comhph\u00e1irtithe idirn\u00e1isi\u00fanta.
  Beidh cl\u00e1ir taca\u00edochta foch\u00e9ime, iarch\u00e9ime agus taca\u00edocht
  do ghorlanna fiontra\u00edochta i measc na gcl\u00e1r a bheidh \u00e1 dtairiscint
  d''fhoghlameoir\u00ed idirn\u00e1isi\u00fanta. Mar fhoras a th\u00e1inig go measartha
  d\u00e9anach ar strait\u00e9is earca\u00edochta idirn\u00e1isi\u00fanta, beidh aird
  ag ITL ar cheachtanna at\u00e1 foghlamtha san earn\u00e1il cheana.\\nTabharfar taca\u00edocht
  dh\u00f3thanach d''fhoghlaimeoir\u00ed idirn\u00e1isi\u00fanta agus iad ag teacht
  isteach, tr\u00ed naisc le teaghlaigh \u00e1iti\u00fala mar shampla agus tr\u00ed
  ch\u00f3ras p\u00e1irt\u00edochta nua faoi sc\u00e1th Aontas na Mac L\u00e9inn.
  Spreagfar foghlaimeoir\u00ed ITL freisin le taith\u00ed idirn\u00e1isi\u00fanta
  a fh\u00e1il, m.sh. tr\u00ed shocr\u00fach\u00e1in oibre n\u00f3 staid\u00e9ir thar
  lear. D\u00e9anfar comhph\u00e1irt\u00edochta\u00ed n\u00f3 l\u00edonra\u00ed at\u00e1
  againn cheana f\u00e9in le forais san AE agus i Florida, SAM a choth\u00fa agus
  a dhoimhni\u00fa; d\u00e9anfaidh ITL iarracht chomh maith a dteagmh\u00e1lacha domhanda
  a leathn\u00fa amach le comhph\u00e1irt\u00edochta\u00ed sa tS\u00edn agus san India.\\nD\u00e9anfaidh
  ITL a sc\u00f3ip idirn\u00e1isi\u00fanaithe a uasmh\u00e9ad\u00fa le sol\u00e1thar
  comhoibr\u00edoch trasn\u00e1isi\u00fanta ar chl\u00e1ir c\u00e9ime le comhph\u00e1irtithe
  roghnaithe idirn\u00e1isi\u00fanta mar at\u00e1 sainmh\u00ednithe faoi bheartas
  n\u00e1isi\u00fanta.\\n\\n-\\n\\n-\\n\\n-\\n\\n(An Strait\u00e9is N\u00e1isi\u00fanta
  Ard-Oideachais go dt\u00ed 2030, Molta\u00ed 4 agus 16)\\n\\n2. Teagasc\\n\\nT\u00e1
  glactha ag ITL le feals\u00fanacht shaini\u00fail acla\u00ed oideachas\u00fail,
  a aithn\u00edonn go mbeidh ar \u00e1r gc\u00e9imithe feidhmi\u00fa sa l\u00e1thair
  oibre r\u00e9igi\u00fanach chomh maith leis an l\u00e1thair oibre idirn\u00e1isi\u00fanta
  agus sa phobal i gcoitinne.\\n\\n.\\\"\\n\\n.\\\"\\n\\nT\u00e1 feals\u00fanacht
  i leith na foghlama gn\u00edomha\u00ed ag ITL a thuairisc\u00edtear ina ch\u00e1ip\u00e9is
  Strait\u00e9is Teagaisc, Foghlama agus Meas\u00fanaithe (TFM) agus at\u00e1 luaite
  i gCoimre Strait\u00e9is\u00ed don Fhoghlaim Ghn\u00edomhach at\u00e1 ar f\u00e1il
  do gach balll foirne. Beidh an strait\u00e9is seo \u00e1 nead\u00fa agus \u00e1
  feidhmi\u00fa go lean\u00fanach ag ITL i seachadadh agus i bhforbairt an chl\u00e1ir
  acad\u00fail ar fud na heagra\u00edochta i gcoitinne. Cotha\u00edonn ITL smaointeoireacht
  chruthaitheach, nu\u00e1lach neamhsple\u00e1ch agus breis\u00edtear ionchais fosta\u00edochta
  tr\u00ed scileanna inaistrithe a thabhairt don fhoghlaimeoir chomh maith le heolas
  agus inni\u00falachta\u00ed den scoth ina ngairm f\u00e9in.\\nTugtar taca\u00edocht
  don strait\u00e9is foghlama l\u00e1nghn\u00edomhach TFM seo le h\u00e1iseanna agus
  le teicneola\u00edocht chu\u00ed agus le trealamh \u00farscothach agus comh\u00e1bhair
  sa seomra ranga agus lasmuigh de, ar n\u00f3s an Ionad R\u00edomhaireachta agus
  na Leabharlainne agus Ionad na nAcmhainn\u00ed Faisn\u00e9ise. Is f\u00e9idir leis
  an fhoghlaim ghn\u00edomhach dul ar aghaidh in aon su\u00edomh, sa saotharlann,
  i sti\u00faideo, i socr\u00fach\u00e1n oibre, i ngr\u00fapa f\u00e9insti\u00fartha
  n\u00f3 ar thasc aonair cianrochtana, n\u00f3 i l\u00e9acht idirghn\u00edomhach.
  F\u00e9adfaidh Timpeallacht Foghlama Fh\u00edor\u00fail (TFF) n\u00f3 ard\u00e1in
  l\u00edonraithe n\u00f3 gairmi\u00fala sh\u00f3isialta a bheith i measc na n\u00e1iseanna
  agus na dteicneola\u00edochta seo. T\u00e1 forbairt foirne (ar n\u00f3s c\u00e1il\u00edochta\u00ed
  breise) i gcur chuige oideola\u00edoch agus \u00e9ags\u00falacht i st\u00edleanna
  foghlama mar bhun don bhfeals\u00fanacht TFM.\\n\\n\\\"\\n\\n2030, Molta\u00ed 5/6)\\n\\n-
  -\\n\\n-oideacha\\n\\n. (An Strait\u00e9is N\u00e1isi\u00fanta Ard-Oideachais go
  dt\u00ed\\n\\n. (An Strait\u00e9is N\u00e1isi\u00fanta Ard-Oideachais go dt\u00ed
  2030,\\n\\nMoladh 8)\\n\\nT\u00e1 s\u00e9 d''aidhm ag ITL punann chothromaithe de
  chl\u00e1ir mod\u00falaithe foch\u00e9ime a chothabh\u00e1il agus a th\u00f3g\u00e1il
  a uasmh\u00e9ada\u00edonn deiseanna do mhic l\u00e9inn agus a thaca\u00edonn le
  pr\u00f3if\u00edl agus le hinmharthanacht gach campas i Luimneach agus i dTiobrad
  \u00c1rann. F\u00e9adfar forbairt nua a dh\u00e9anamh ar chl\u00e1ir fhoch\u00e9ime
  i ndiscipl\u00edn\u00ed gaolmhara sna fearainn at\u00e1 againn cheana, n\u00f3 i
  bhfearainn neamhghaolmhara n\u00f3 nideoige nua faoi r\u00e9ir ag cumas an mhargaidh
  agus saineolas na foirne agus na hacmhainn\u00ed fisici\u00fala a bheidh ar f\u00e1il.
  Ba cheart go bhfeidhmeodh an phunann seo mar chatala\u00edoch agus mar thiom\u00e1na\u00ed
  don fhorbairt inmharthanach eacnama\u00edoch, sh\u00f3siailta agus chult\u00fartha
  in\u00e1r r\u00e9igi\u00fan.\\nCinnteoidh ITL \u00e1bharthacht lean\u00fanach na
  gcl\u00e1r i leith riachtanais n\u00e1isi\u00fanta agus r\u00e9igi\u00fanacha ar
  bhealach nu\u00e1lach, tr\u00ed chomhairli\u00fach\u00e1n agus idirbhearta\u00edocht
  le tionscla\u00edocht agus leis an phobal, agus beidh anail\u00eds riachtanais agus
  taighde margaidh ag coth\u00fa fhorbairt agus athbhreithni\u00fa \u00e1r gcl\u00e1r.\\n\\n\\\"\\n\\n-\\n\\nBeidh
  cuideachta\u00ed iln\u00e1isi\u00fanta, cuideachta\u00ed d\u00fachasacha beaga agus
  me\u00e1nmh\u00e9ide, an eacnama\u00edocht tuaithe, an earn\u00e1il phobail agus
  dheonach, agus na gn\u00edomhaireachta\u00ed \u00e1bhartha rannph\u00e1irteach san
  idirbhearta\u00edocht. Beidh p\u00e1irt ghn\u00edomhach ag c\u00e9imithe san anail\u00eds
  seo, m.sh. i ngr\u00fapa\u00ed f\u00f3cais agus i suirbh\u00e9anna.\\nD\u00e9anfaidh
  ITL cothabh\u00e1il agus feabhs\u00fach\u00e1n lean\u00fanach ar a idirghabh\u00e1il
  le tionscla\u00edocht agus leis an tsocha\u00ed le cl\u00e1ir a sheachadadh, tr\u00ed
  aoi-l\u00e9acht\u00f3ireachta\u00ed agus f\u00f3raim idirchaidrimh poibl\u00ed mar
  shampla\u00ed. B\u00edonn teastas\u00fa seachtrach suntasach \u00e1 thairiscint
  freisin ag ITL m.sh tr\u00ed eagra\u00edochta\u00ed gairmi\u00fala, d''fhonn luach
  na gc\u00e1il\u00edochta\u00ed a fhaigheann na c\u00e9imithe a bhreisi\u00fa.\\nMar
  gheall ar athruithe san ionchas eacnama\u00edoch, agus \u00e9abhl\u00f3id an mhargadh
  saothair domhanda, n\u00ed m\u00f3r do ITL tuilleadh idirn\u00e1isi\u00fan\u00fa
  a dh\u00e9anamh ar an gcuraclam. Is g\u00e1 do ch\u00e9imithe a bheith in ann amharc
  thar na teorainneacha agus beidh s\u00e9 seo \u00e1 l\u00e9iri\u00fa sna cl\u00e1ir
  acad\u00fala.\\n\\n-\\n\\n-\\n\\n-\\n\\nspreagfaidh sin\\\".\\n\\n\\\"\\n\\n- idir.\\\"\\n\\n-\\n\\n2030,
  Moladh 15)\\n\\nI gcomhl\u00edonadh an bheartais n\u00e1isi\u00fanta i leith Rochtain,
  Aistri\u00fa agus Dul chun Cinn, beidh cos\u00e1in fhor\u00e1sacha \u00e1 dtairiscint
  ag ITL d''fhoghlaimeoir\u00ed isteach sa Chreatlach N\u00e1isi\u00fanta C\u00e1il\u00edochta
  ag leibh\u00e9il 6-9 + 10. Beidh roghanna sol\u00fabtha mod\u00falacha ar f\u00e1il
  sna cos\u00e1in seo d''fhoghlaimeoir\u00ed, ar n\u00f3s point\u00ed iontr\u00e1la
  ionracha, mod\u00fail thoghchacha agus mod\u00fail ph\u00e1ir-aimseartha.\\nBun\u00f3far
  c\u00f3ras feabhsaithe Aitheantas do R\u00e9amhthaith\u00ed agus do R\u00e9amhfhoghlaim
  (ARR), maraon le treoir don fhoghlaimeoir ionchasach. A oiread is f\u00e9idir, d\u00e9anfar
  cl\u00e1ir a fhorbairt le haird ar ARR mar \u00e1is d''fhoghlaimeoir\u00ed aib\u00ed
  neamhchaighde\u00e1nacha. Is g\u00e1 tabhairt faoi na himpleachta\u00ed \u00e9ags\u00fala
  a eascra\u00edonn as aitheantas a thabhairt do r\u00e9amhfhoghlaim fhoirmi\u00fail
  agus do r\u00e9amhfhoghlaim \u00f3 thaith\u00ed; baineann t\u00e1bhacht ar leith
  leis seo nuair a thagann foghlaimeoir\u00ed aib\u00ed go ITl agus iad i ng\u00e9argh\u00e1
  a scileanna a fheabhs\u00fa d''fhonn a n-ionchais fosta\u00edochta a fheabhs\u00fa.\\nT\u00e1
  cur chuig \u00e9ifeacht\u00fail sofaistici\u00fail ag ITL i leith c\u00f3rais agus
  pr\u00f3isis dearbh\u00fa c\u00e1il\u00edochta. T\u00e1 \u00e1r nDearbh\u00fa C\u00e1il\u00edochta
  de r\u00e9ir na gcaighde\u00e1n agus na dtreoirl\u00ednte do Limist\u00e9ar ArdOideachais
  na hEorpa, agus de r\u00e9ir na dtreoirl\u00ednte agus na gcrit\u00e9ir n\u00e1isi\u00fanta
  le haghaidh n\u00f3sanna imeachta\u00ed DC a bheidh faoi mhaoirseacht ag an ngn\u00edomhaireacht
  chomhth\u00e1ite Qualifications and Quality Assurance Ireland (QQAI). T\u00e1 an
  fhoireann eolach ar an gcleachtas n\u00e1isi\u00fanta agus idirn\u00e1isi\u00fanta
  is fearr sa saol acad\u00fail agus sa ghairm. Sa ch\u00e9ad\\n\\n-\\n\\n-\\n\\n,
  agus a\\n\\n2030, Moladh 14)\\n\\n\\\"\\n\\nch\u00e9im eile d''fhorbairt DC, tabhairfimid
  faoi thagarmharc\u00e1il fhorasach le ceann n\u00f3 n\u00edos m\u00f3 d\u00e1r gcomhph\u00e1irtithe
  idirn\u00e1isi\u00fanta.\\nFeabhs\u00f3idh ITL an l\u00fab aischothaithe, ag baili\u00fa
  sonra\u00ed faoi l\u00e9argas an fhoghlam\u00f3ra agus a luach\u00e1lacha le s\u00fail
  le gn\u00edomh\u00fa de r\u00e9ir na faisn\u00e9ise seo agus cumars\u00e1id a dh\u00e9anamh
  ar ais leis na foghlaimeoir\u00ed. Bainfear \u00fas\u00e1id as strucht\u00fair fhoirmi\u00fala
  ar n\u00f3s gr\u00fapa\u00ed idirchaidrimh foirne agus mac l\u00e9in, boird cl\u00e1ir
  agus Fochoiste den Chomhairle Acad\u00fail. \u00das\u00e1idfear chomh maith c\u00f3rais
  thagarmharc\u00e1la le leibh\u00e9il seirbh\u00edse a thomhas sa timpeallacht foghlama
  mar at\u00e1 curtha ar bun in Leabharlann ITL. D\u00e9anfar suirbh\u00e9anna \u00e1iti\u00fala
  agus / n\u00f3 idirn\u00e1isi\u00fanta agus cuirfear gr\u00fapa\u00ed f\u00f3cais
  tiomnaithe ar bun le haghaidh t\u00e9ama\u00ed ar leith. Is \u00ed an phr\u00edomhaidhm
  at\u00e1 le haiseolas oib\u00edocht\u00fail c\u00e1il\u00edochtach d\u00e1 leith\u00e9id
  a bhaini\u00fal a fh\u00e1il amach an bhfuil an l\u00e9argas c\u00e9anna de luachanna,
  d''fheidhm\u00edocht DC, de phr\u00f3if\u00edl agus d''fheals\u00fanacht oideachais
  na hInstiti\u00faide \u00e1 roinnt agus \u00e1 dhearbh\u00fa ag na foghlameoir\u00ed.\\nB\u00edonn
  pr\u00f3if\u00edl\u00ed saini\u00fala c\u00e9imithe mar thoradh ar chur chuige ITL
  i leith tortha\u00ed teagaisc agus foghlama; t\u00e1 c\u00e1il ar na c\u00e9imithe
  ar son a ndearcadh pragmatach, d\u00edrithe ar thortha\u00ed, eitici\u00fail agus
  fiontra\u00edoch. B\u00edonn ITL ag cur le cruth\u00fa an eolais sa r\u00e9igi\u00fan
  len\u00e1r gc\u00e9imithe. Is f\u00e9idir le ITL na pr\u00f3if\u00edl\u00ed c\u00e9imithe
  seo a chur in i\u00fal d''fhost\u00f3ir\u00ed agus do ph\u00e1irtithe leasmhara
  eile, agus iad miondealaithe de r\u00e9ir r\u00e9imse discipl\u00edne. Faightear
  deimhni\u00fa go rialta air seo tr\u00ed aiseolas a fhaightear \u00f3n tionscla\u00edocht
  agus \u00f3n phobal i gcoitinne, agus \u00f3 l\u00edonra\u00ed alumni.\\n\\n-\\n\\n-\\n\\n.\\\"\\n\\n-\\n\\n2030,
  Moladh 2)\\n\\n\\\"Is strait\u00e9is \u00ed an Fhoghlaim Ghn\u00edomhach a spreagann
  mic l\u00e9inn le bheith ina rannph\u00e1irtithe gn\u00edomhacha sa phr\u00f3iseas
  foghlama, agus a ligeann d\u00f3ibh seilbh a ghlacadh ar a gcuid oideachais f\u00e9in.
  Ag nascadh teoiric agus cleachtas le ch\u00e9ile, cuireann mic l\u00e9inn a gcuid
  foghlama i bhfeidhm agus forbra\u00edonn siad a gcuid eolais tr\u00ed chleachta\u00ed
  r\u00e9itheach faidhbhe, staid\u00e9ir ar ch\u00e1sanna, smaoineamh agus gn\u00edomha\u00edochta\u00ed
  eile. D\u00e1 thoradh sin b\u00edonn c\u00e9imithe oilte le forbairt lean\u00fanach
  phearsanta agus ghairmi\u00fail a dh\u00e9anamh.\\\"\\n\\nT\u00e1 feals\u00fanacht
  oideachas\u00fail ITL d\u00edrithe d\u00e1 bhr\u00ed sin ar thuiscint agus ar inni\u00falacht
  n\u00edos doimhne a fh\u00e1il ar na cro\u00ed-r\u00e9ims\u00ed staid\u00e9ir, agus
  ar scileanna cine\u00e1lacha a fh\u00e1il ionas go mbeidh c\u00e9imithe l\u00e1nchumasacha
  \u00e1 gcur amach againn\\\" (Strait\u00e9is Teagaisc, Foghlama agus Meast\u00f3ireachta
  ITL)\\n\\n3. Taca\u00ed d''Fhoghlaimeoir\u00ed\\n\\nT\u00e1 s\u00e9 d''aidhm ag
  ITL timpeallacht foghlama d''ardchaighde\u00e1n a thairiscint a thabharfadh taca\u00edocht
  do gach cine\u00e1l foghlameora (l\u00e1naimseartha, p\u00e1irtaimseartha, idirn\u00e1isi\u00fanta,
  gr\u00fapa\u00ed tosa\u00edochta - ag gach leibh\u00e9al den Chreatlach N\u00e1isi\u00fanta
  C\u00e1il\u00edochta\u00ed \u00f3 phrint\u00edsigh go foch\u00e9imithe agus iarch\u00e9imithe).\\n\\nI
  measc na seirbh\u00eds\u00ed taca\u00edochta at\u00e1 ar f\u00e1il do mhic l\u00e9inn
  ITL t\u00e1 ionducht\u00fa agus meant\u00f3ireacht ar f\u00e1il do gach mac l\u00e9inn
  le linn a gc\u00e9ad bhliana in ITL; teagasc feabhais (faoi r\u00e9ir acmhainn\u00ed
  foirne); c\u00f3itse\u00e1il; comhairleoireacht; rochtain; leigheas; s\u00e9ipl\u00edneach/c\u00faram
  tr\u00e9ad\u00fail; comhairle gairme; l\u00edonra mic l\u00e9inn aib\u00ed; oifig
  idirn\u00e1isi\u00fanta agus taca\u00edocht teanga; clubanna sp\u00f3irt agus cumainn.
  Thar saolr\u00e9 an plean is mian le ITL seirbh\u00eds\u00ed taca\u00edochta d''ardch\u00e1il\u00edocht
  a shol\u00e1thar i ngach su\u00edomh ar fud \u00e1r r\u00e9igi\u00fan, ar laethanta
  sonraithe ar a laghad. D\u00e9antar athbhreithni\u00fa go bliant\u00fail ar \u00e9ifeacht\u00falacht,
  leibh\u00e9al \u00fas\u00e1id agus br\u00faphoint\u00ed ar fud l\u00e1nspeictream
  seirbh\u00eds\u00ed na mac l\u00e9inn agus d\u00e9antar coigeart\u00fa riachtanach
  orthu de r\u00e9ir mar is f\u00e9idir.\\nT\u00e1 Creatlach Litearthachta Faisn\u00e9ise
  forbartha ag ITL le tr\u00ed chomhph\u00e1irt ionas go mbeidh foghlaimeoir\u00ed
  eolach, taith\u00edoch agus inni\u00fail chun faisn\u00e9is at\u00e1 ar f\u00e1il
  tr\u00ed acmhainn\u00ed na leabharlainne a fh\u00e1il, a thuiscint agus a chur in
  i\u00fal.\\nT\u00e1 aird ag ITL ar athruithe i bpr\u00f3if\u00edl dheimeagrafadh
  n\u00f3 sh\u00f3isialta na bhfoghlaimeoir\u00ed agus ar aon gh\u00e1 at\u00e1 le
  taca\u00ed spriocdh\u00edrithe a d''fh\u00e9adfadh a bheith ag m\u00e9ad\u00fa agus
  c\u00fains\u00ed n\u00edos deacra ann don tsocha\u00ed. D\u00e9antar cinnte go mb\u00edonn
  na mic l\u00e9inn eolas ar na taca\u00ed seo tr\u00ed fhoilseach\u00e1in inmhe\u00e1nacha,
  ionducht\u00fa agus na me\u00e1in sh\u00f3isialta chu\u00ed.  Aithn\u00edonn ITL
  an m\u00edchothromas stairi\u00fail a bhain le leithroinnt acmhainn\u00ed taca\u00edochta
  do mhic l\u00e9inn idir foghlaimeoir\u00ed l\u00e1naimseartha agus p\u00e1irtaimseartha
  ar chl\u00e1ir chreidi\u00fanaithe agus beidh siad ag tac\u00fa le beartas an rialtais
  ina leith seo. Aithn\u00edmid \u00e1fach an d\u00fashl\u00e1n at\u00e1 roimh r\u00e9imse
  ioml\u00e1n na seirbh\u00eds\u00ed taca\u00edochta a thairiscint do gach cine\u00e1l
  foghlaimeora agus n\u00ed m\u00f3r d\u00fainn na himpleachta\u00ed a athbhreithni\u00fa.\\nT\u00e1
  c\u00e1il ar fhoireann ITL i bhfoilseach\u00e1in dheimhnithe ar n\u00f3s Bairim\u00e9adar
  Mac L\u00e9inn an AE ar son a gcur chuige pearsanta i leith foghlaimeoir\u00ed sa
  sc\u00e9im fhoirmi\u00fail meant\u00f3ireachta, i bhfeals\u00fanacht oideachas\u00fail
  na foghlama gn\u00edomha\u00ed agus a sainmheon ginear\u00e1lta. Thar saolr\u00e9
  an phlean strait\u00e9is\u00ed seo, cuirfear bearta ar bun sna campais go l\u00e9ir
  le tac\u00fa leis seo tr\u00ed shaor\u00e1id\u00ed agus sp\u00e1sanna at\u00e1 oiri\u00fanach
  d\u00e1 gcusp\u00f3ir, lena n-\u00e1ir\u00edtear leabharlanna, ionad r\u00edomhaireachta
  le rochtain oscailte chomh maith le sp\u00e1sanna teagaisc le cl\u00e1r ama.\\nAithn\u00edonn
  ITL go gcuireann an chomhthimpeallacht ghinear\u00e1lta agus rannph\u00e1irt\u00edocht
  an fhoghlaimeora in imeachta\u00ed s\u00f3isialta, cult\u00fartha n\u00f3 sp\u00f3irt
  lena n-\u00e1ir\u00edtear obair dheonach, toise r\u00edth\u00e1bhachtach leis an
  timpeallacht foghlama. C\u00e9 gur minic a bh\u00edonn na mic l\u00e9inn f\u00e9in
  i mbun na ngn\u00edomha\u00edochta\u00ed seo, beidh \u00e1isi\u00fa agus taca\u00edocht
  na foirne ar f\u00e1il d\u00f3ibh d''fhonn lean\u00fanachas a spreagadh. D''fh\u00e9adfadh
  gn\u00edomha\u00edocht a bheith ar bun ar an gcampas n\u00f3 as, chomh leis an timpeallacht
  fh\u00edor\u00fail agus na me\u00e1in sh\u00f3isialta.\\n\\n\\\"\\n\\n\\\"\\n\\nD\u00e9antar
  monat\u00f3ireacht ar fheidhm\u00edocht coinne\u00e1la agus cr\u00edochnaithe ITL
  ar fud na Scoileanna agus d\u00e9antar beart m\u00e1 l\u00e9ir\u00edonn an anail\u00eds
  seo aon r\u00e9ims\u00ed ina bhfuil fadhbanna.  D\u00e9anfar idirghabh\u00e1il nu\u00e1lach
  le foghlaimeoir\u00ed ITL a spreagadh lena gcumas a bhaint amach agus a bheith rannph\u00e1irteach
  go hioml\u00e1n ina gcuid oideachais.\\n\\n-\\n\\n2030, Moladh 4).\\n\\n-\\n\\n2030,
  Moladh 5)\\n\\n4. Aistri\u00fa Eolais - Taighde\\n\\nBeidh ITL rannph\u00e1irteach
  i dtaighde fheidhmeach nu\u00e1lach i gcomhph\u00e1irt\u00edocht le tionscla\u00edocht,
  ag tac\u00fa le oibritheoir\u00ed idirn\u00e1isi\u00fanta chomh maith le hoibritheoir\u00ed
  d\u00fachasacha. D\u00edr\u00edtear sa taighde fheidhmeach seo ar r\u00e9ims\u00ed
  saineolais acad\u00fail at\u00e1 ann cheana n\u00f3 at\u00e1 ag teacht chun cinn
  in\u00e1r n-eagra\u00edocht, agus a bheidh feabhsaithe ag na taighdeoir\u00ed cumasacha
  at\u00e1imid in ann a mhealladh chugainn.\\n\\nT\u00e1 \u00e1r neart faoi l\u00e1thair
  i dtaighde feidhmeach: biteiceola\u00edocht, forbairt inmharthanach tuaithe, cinnteoireacht
  phobalbhunaithe, fuinneamh inathnuachana, monat\u00f3ireacht agus bainist\u00edocht
  chochshaoil, na me\u00e1in chruthaitheacha agus sl\u00e1nd\u00e1il dhigiteach, cleachtas
  coime\u00e1da\u00edochta in eala\u00edn agus dearadh at\u00e1 tar \u00e9is go leor
  airgid a mhealladh \u00f3n taobh amuigh agus foilseach\u00e1in n\u00f3 aschuir tionscla\u00edocha
  a spreagadh. Tabharfar faoi athbhreithni\u00fa lean\u00fanach ar \u00e1r r\u00e9ims\u00ed
  nideoige reatha agus ar nideoga nua n\u00f3 gaolmhara a d''fh\u00e9adfa\u00ed a
  roghn\u00fa le haghaidh taighde feidhmeach.\\nT\u00e1 s\u00e9 d''aidhm ag ITL na
  m\u00e9aduithe suntasacha i l\u00edon na bhfoghlaimeoir\u00ed iarch\u00e9ime at\u00e1
  cl\u00e1raithe ar chl\u00e1ir in\u00e1r r\u00e9ims\u00ed taighde nideoige a bhuan\u00fa.\\nB\u00edonn
  curaclam ITL faoi threoir ag taighde tr\u00edd na naisc at\u00e1 idir \u00e1r dtionscadail
  taighde feidhmeacha agus na cl\u00e1ir fhoch\u00e9ime. Beidh feidhmi\u00fa praitici\u00fail
  agus cur chuige bunaithe ar fhiosr\u00fa ag an leibh\u00e9al foch\u00e9ime ann leis
  seo a threisi\u00fa go lean\u00fanach.\\nTac\u00f3idh ITL leis an iarracht taighde,
  tr\u00ed shaor\u00e1id\u00ed agus trealamh ar n\u00f3s c\u00farsa\u00ed ar l\u00edne
  i litearthacht faisn\u00e9ise agus i modhanna taighde don oideachas ceathr\u00fa
  leibh\u00e9al. Beidh a sh\u00edolchiste \u00e1 oibri\u00fa i gc\u00f3na\u00ed ag
  ITL chomh maith d''fhonn taighde gn\u00edomhach a spreagadh i measc mic l\u00e9inn
  agus lucht foirne, agus d''fhonn tuilleadh neart\u00fa a dh\u00e9anamh ar \u00e1r
  r\u00e9ims\u00ed nideoige.\\nCuirfimid len\u00e1r gcumas maoirseoireachta taighde
  tr\u00ed fhorbairt foirne go leibh\u00e9il ch\u00e1ili\u00fach\u00e1in 8 agus 9.\\n\\n.\\\"\\n\\n-\\n\\nBeidh
  oili\u00faint chine\u00e1lach scileanna do fhoghlaimeoir\u00ed iarch\u00e9ime \u00e1
  dtairiscint againn i gcomhar len\u00e1r gcomhghuallaithe, le h\u00e9ifeacht\u00falachta\u00ed
  sc\u00e1la agus sin\u00e9irgeachta\u00ed eile a fhorbairt.\\nBeidh ITL a lean\u00faint
  ar aghaidh le tairiscint\u00ed ioma\u00edocha le haghaidh maoini\u00fa taighde in
  \u00c9irinn agus san AE agus n\u00edos faide \u00f3 bhaile, i gcomhar leis an tionscla\u00edocht
  \u00e1iti\u00fail (idir iln\u00e1isi\u00fanta agus ghn\u00f3thais bheaga agus mhe\u00e1nmh\u00e9ide),
  comhlachta\u00ed poibl\u00ed agus pobail agus comhph\u00e1irtithe agus consortiaim
  n\u00e1isi\u00fanta agus idirn\u00e1isi\u00fanta. Tuigtear d\u00fainn gur r\u00e9amhchoinn\u00edoll
  \u00e9 an comhoibi\u00fa le cumas taighde a fhorbairt.\\nAg t\u00f3g\u00e1il ar
  st\u00e1das ITL mar fhoras faofa a chuireann cl\u00e1ir taighde ar f\u00e1il, beidh
  st\u00e1das \u00fadar\u00e1is tarmligthe \u00e1 lorg againn ionas go mbeidh s\u00e9
  ar \u00e1r gcumas \u00e1r nd\u00e1mhachtain\u00ed taighde leibh\u00e9al 9 agus 10
  f\u00e9in a dh\u00e9anamh sna r\u00e9ims\u00ed roghnaithe ina bhfuilimid l\u00e1idir.\\nLeanfaimid
  ar aghaidh ag \u00fas\u00e1id m\u00e9adrachta\u00ed aschuir mar phr\u00edomhth\u00e1scair\u00ed
  feidhm\u00edochta len\u00e1r bhfeidhm\u00edocht taighde a rian\u00fa agus tagarmharc\u00e1il
  a dh\u00e9anamh orainn f\u00e9in i gcoinne institi\u00faid\u00ed oideachais eile,
  ar n\u00f3s: foilseach\u00e1in, comhdh\u00e1lacha, taispe\u00e1ntais, paitinn, cearta
  Maoine Intleacht\u00fail, forbairt nuath\u00e1irg\u00ed, comhph\u00e1irt\u00edochta\u00ed
  idirghn\u00edomha\u00edochta\u00ed tionscla\u00edochta/nu\u00e1la, comhairli\u00fach\u00e1in
  pobail agus comhlachta\u00ed san earn\u00e1il phoibl\u00ed, maoini\u00fa tionscadail
  aimsithe \u00f3n AE agus \u00f3 fhoins\u00ed lasmuigh den St\u00e1tchiste.\\n\\n-\\n\\n2030,
  Moladh 3)\\n\\nla.\\\"\\n\\n-\\n\\n.\\\"\\n\\n2030, Molta\u00ed 9 agus 12)\\n\\n5.
  Aistri\u00fa Eolais - Forbairt na Fiontra\u00edochta\\n\\nT\u00e1 ''Dr\u00e9imire
  Fiontra\u00edochta ITL'' ag ITL le taca\u00edocht ar leith a thabhairt d''fhiontra\u00edocht
  nua, ina gcuims\u00edtear speictream ioml\u00e1n na bpr\u00f3if\u00edl\u00ed luach
  saothair in\u00e1r r\u00e9ims\u00ed saineolais acad\u00fala agus taca\u00edochta
  gn\u00f3. T\u00e1 s\u00e9 d''aidhm againn Dr\u00e9imire Fiontra\u00edochta ITL a
  leathn\u00fa amach ar fud na gcampas sna r\u00e9igi\u00fain ina bhfuilimid ag oibri\u00fa,
  i gcomhar le comhph\u00e1irt\u00edochta\u00ed \u00e9ags\u00fala le gn\u00edomhaireachta\u00ed
  agus \u00fadar\u00e1is \u00e1bhartha St\u00e1it chomh maith leis an bhfiontra\u00edocht
  phr\u00edobh\u00e1ideach.\\n\\nTr\u00edd an sol\u00e1thar c\u00e9imithe agus int\u00e9irnigh,
  t\u00e1 cion m\u00f3r \u00e1 dh\u00e9anamh ag ITL ar son bonn eolais agus nu\u00e1la
  in\u00e1r r\u00e9igi\u00fan agus lasmuigh de. Beidh monat\u00f3ireacht rialta \u00e1
  dh\u00e9anamh againn air seo tr\u00edn\u00e1r suirbh\u00e9anna ar ch\u00e9imithe
  agus tr\u00edd an idirghabh\u00e1il le tionscla\u00edocht ar fud \u00e1r gceantair.\\nBeidh
  raon cl\u00e1r taca\u00edochta agus forbartha gn\u00f3 \u00e1 ofr\u00e1il go lean\u00fanach
  againn le fiontra\u00edocht dh\u00fachasach a choth\u00fa: cl\u00e1ir bunaigh do
  ghn\u00f3 f\u00e9in i gcomhar le Boird Fiontra\u00edochta; oili\u00faint le haghaidh
  sainchead\u00fanaithe agus sainchead\u00fan\u00f3ir\u00ed ionchasacha; Cl\u00e1r
  l\u00e1naimseartha Brost\u00fa Fiontra\u00edochta do chuideachta\u00ed campais agus
  macchuideachta\u00ed a d''fh\u00e9adfa\u00ed a leathn\u00fa amach go Tiobrad \u00c1rann
  (ach acmhainn\u00ed a bheith ar f\u00e1il); gorlann do ghn\u00f3lachta\u00ed cliant
  Archumais Nuathionscanta le cumas easport\u00e1la i gcomhar le Fiontra\u00edocht
  \u00c9ireann.\\nD\u00e9anfar tuilleadh forbartha ar shaor\u00e1id\u00ed agus ar
  chl\u00e1ir Dhr\u00e9imire Fiontra\u00edochta ITL do champais \u00e9ags\u00fala
  de r\u00e9ir mar a bh\u00edonn siad \u00e1bhartha agus ind\u00e9anta sa chomhth\u00e9acs
  \u00e1iti\u00fail agus i gcomhar le comhph\u00e1irtithe \u00e1iti\u00fala. I Luimneach
  t\u00e1 siad seo lonnaithe san Ionad Brost\u00fa Fiontra\u00edochta agus in ionaid
  i l\u00e1r na cathrach; i dTiobrad \u00c1rann beifear \u00e1 dtairiscint tr\u00ed
  Ionad Fiontra\u00edochta Pobail Dh\u00farlas agus tr\u00ed shaor\u00e1id nua i gCluain
  Meala (su\u00edomh Bhaile an Gharr\u00e1in).\\nTar \u00e9is cabhr\u00fa le 150 post
  a chruth\u00fa sa cheithre bliana tosaigh d''Ionad Brost\u00fa Fiontra\u00edochta
  ITL, beidh tionchar intomhaiste againn go lean\u00fanach ar fhoirmi\u00fa cuideachta\u00ed
  nua, ar chruth\u00fa fosta\u00edochta agus ar nu\u00e1il tr\u00edd na cuideachta\u00ed
  at\u00e1 againn mar chliaint\u00ed agus tr\u00ed fheidhmeanna taighde feidhmeacha.\\nD\u00e9anfaimid
  tr\u00e1cht\u00e1l\u00fa ar mhaoin intleacht\u00fail tr\u00ed chomhph\u00e1irt\u00edochta\u00ed
  nu\u00e1la agus foirmeacha eile comhairli\u00fach\u00e1in ina mbeadh mic l\u00e9inn
  foch\u00e9ime c\u00e9ad bliana mar shampla ag tabhairt faoi thionscadail thar ceann
  eagra\u00edochta\u00ed seachracha.\\nSpreagfar foghlaimeoir\u00ed ITL le smaoineamh
  ar fhiontra\u00edocht mar rogha gairme tr\u00ed fheasacht seachchuraclaim agus tr\u00ed
  chl\u00e1ir shamplacha, maraon le mod\u00fail neadaithe, sannach\u00e1n n\u00f3
  cl\u00e1ir shainithe c\u00e9ime laistigh d''fhoireann curaclam ITL.\\nCoth\u00f3imid
  naisc n\u00edos l\u00e1idre idir lucht acad\u00fail agus foghlaimeoir\u00ed i nDr\u00e9imire
  Fiontra\u00edochta ITL lena chl\u00e1ir agus a shaor\u00e1id\u00ed, tr\u00ed aoil\u00e9achtanna,
  tascanna praiciti\u00fala ina mbeidh mic l\u00e9inn n\u00f3 c\u00e9imithe ag cuidi\u00fa
  le cuideachta\u00ed nuathionscanta, n\u00f3 naisc n\u00edos strucht\u00fartha le
  ranna acad\u00fala.\\n\\n\\\"Ba ch\u00f3ir d''Institi\u00faid\u00ed Teicneola\u00edochta
  d\u00edri\u00fa n\u00edos m\u00f3 ar thaighde fheidhmeach agus ar thaca\u00edocht
  forbartha n\u00edos gaire don mhargadh agus ar thaca\u00edocht fiontra\u00edochta,
  le toise\\n\\n-\\n\\nFearann B - Inmharthanacht Institi\u00faideach\\n\\nUaillmhian
  i dtreo 2020: Timthriallacha Plean\u00e1la n\u00edos giorra:\\n\\nConas is f\u00e9idir
  linn \u00e1r bpr\u00f3if\u00edl a chumas\u00fa leis na hacmhainn\u00ed at\u00e1
  againn?\\n\\nCad at\u00e1 ag teast\u00e1il go sonrach uainn - Cad at\u00e1 againn
  cheana f\u00e9in, cad iad na bearna\u00ed at\u00e1 ann agus conas is f\u00e9idir
  linn tabhairt f\u00fathu?\\n\\n\\\"\\n\\n-\\n\\n.\\n\\nMoladh 25)\\n\\n6. Pobal\\n\\nIs
  iad na c\u00fa\u00edns\u00ed spreagtha is m\u00f3 d''fhoireann ITL an cult\u00fair
  br\u00f3id agus d\u00edlseachta i leith na bhfoghlaimeoir\u00ed, na gc\u00e9imithe
  agus chliaint\u00ed eile ITL, agus cult\u00far br\u00f3id agus d\u00edlseachta i
  leith ITL mar eagra\u00edocht uileghabh\u00e1lach agus i leith a chonar forbartha
  sna laethanta athruithe agus trasdula seo.\\n\\nT\u00e1imid tiomanta do eagra\u00edocht
  chomht\u00e1ite a th\u00f3g\u00e1il tar \u00e9is an c\u00f3nascadh le hInstiti\u00fait
  Thiobrad \u00c1rann, mar a moth\u00f3idh an fhoireann go l\u00e9ir go bhfuil meas
  orthu agus gur cuid de ''theaghlach ITL'' at\u00e1 iontu.\\nL\u00e9ir\u00edonn an
  fhoireann a mbr\u00f3d agus a nd\u00edlseacht do na foghlaimeoir\u00ed, do ch\u00e9imithe
  agus don eagra\u00edocht i gcoitinne, n\u00ed hamh\u00e1in ina ndualgais rialta
  ach tr\u00ed chomhoibri\u00fa agus rannph\u00e1irt\u00edocht le m\u00f3rimeachta\u00ed
  ar n\u00f3s searmanais bhronnadh c\u00e9ime, taispe\u00e1ntais deireadh bliana,
  imeachta\u00ed gairme, marga\u00edocht agus f\u00f3gra\u00edocht sheachtra\u00edocht.\\nCuirfear
  beartais agus cleachtais aonfhoirmeacha AD i bhfeidhm ar fud na heagra\u00edochta,
  de r\u00e9ir treoracha agus comhaontuithe n\u00e1isi\u00fanta le haird ar an gcleachtas
  is fearr san earn\u00e1il.\\nI ndl\u00fathchomhr\u00e1 le Scoileanna agus r\u00e9ims\u00ed
  feidhme beith feidhm AD ITL ag d\u00e9anamh monat\u00f3ireachta ar fhaisn\u00e9is
  th\u00e1bhachtach, ar n\u00f3s sonra\u00ed pr\u00f3if\u00edle foirne, earc\u00fa
  agus imscaradh foirne, aistrithe inmhe\u00e1nacha, asl\u00e1itheachas agus caiteachas
  ar fhorbairt agus oili\u00faint foirne.\\n\\n.,\\\"(\\n\\n-u\\n\\n-\\n\\n2030,\\n\\nBeidh
  meicn\u00edochta\u00ed \u00e9ifeacht\u00fala faisn\u00e9ise agus comhairli\u00fach\u00e1in
  \u00e1 gcur i bhfeidhm go lean\u00fanach againn ar fud an ITL m\u00e9adaithe, agus
  cain\u00e9il strucht\u00fartha cumars\u00e1ide mar bhonn d\u00f3ibh.\\nCoth\u00f3imid
  timpeallacht oibre ina mbeidh daoine ag tac\u00fa le ch\u00e9ile (idir piaranna
  ar fud na gcampas; idir caidrimh fheidhmi\u00fala agus ordlathacha). Eascr\u00f3idh
  an timpeallacht comhthac\u00fail seo as sainmheon a bheidh d\u00edrithe ar an fhoghlaimeoir
  agus ar chliaint\u00ed eile.\\nBeidh pleananna forbartha pearsanta agus pleananna
  forbairt foirne \u00e1 gcur i bhfeidhm go lean\u00fanach againn faoi na C\u00f3rais
  Bainisti\u00fa Feidhm\u00edochta agus Forbartha don earn\u00e1il, de r\u00e9ir na
  dtosa\u00edochta\u00ed strait\u00e9iseacha agus oibri\u00fach\u00e1in. Cuirfear
  na pleananna seo in oiri\u00faint do shol\u00e1thar \u00e1r gcl\u00e1r acad\u00fail,
  do na huaillmhianta taighde agus foghlama agus do na riachtanais maidir le riarach\u00e1n
  agus taca\u00edocht. Faoi Bheartas Forbairt Foirne ITL tabharfar taca\u00edocht
  do phleananna aonair, m.sh. c\u00e1il\u00edochta\u00ed n\u00edos airde a bhaint
  amach, agus do thogra\u00ed forbairt foirne ar fud na hInstiti\u00faide ar n\u00f3s
  seimine\u00e1ir teagaisc agus foghlama agus soghluaisteacht idirn\u00e1isi\u00fanta
  lucht foirne.\\nBh\u00ed cuid mhaith d''fh\u00f3cas na bpleananna roimhe seo d\u00edrithe
  ar ch\u00f3rais TCF a fheabhs\u00fa le ITL a chur ar th\u00fas cadhna\u00edocht
  i sol\u00e1thar na teicneola\u00edochta. D''\u00e9irigh go measartha maith leis
  an strait\u00e9is seo agus le cothabh\u00e1il lean\u00fanach ar na caighde\u00e1in
  TCF a baineadh amach is f\u00e9idir le ITL an teicneola\u00edocht a thabhairt isteach
  n\u00edos m\u00f3 sa timpeallacht teagaisc agus foghlama agus an fhoireann acad\u00fail
  a chur \u00e1 h\u00fas\u00e1id sa seomra ranga agus go ginear\u00e1la, tr\u00ed
  oili\u00faint lean\u00fanach spriocdh\u00edrithe.\\nBeidh ITL ag oibri\u00fa le
  strucht\u00far eagr\u00fach\u00e1in comhth\u00e1ite sol\u00fabtha a oiri\u00fan\u00f3idh
  an strait\u00e9is at\u00e1 glactha don eagra\u00edocht agus a thuigeann na castachta\u00ed
  a bhaineann le su\u00edomhanna iarg\u00falta a bhainisti\u00fa.\\nTaispe\u00e1nfaimid
  rialachas agus ceannaireacht \u00e9ifeacht\u00fail de r\u00e9ir na gc\u00f3danna
  rialachais agus na gc\u00f3danna iompar n\u00e1isi\u00fanta at\u00e1 bunaithe, cib\u00e9
  acu le linn amanna ina mb\u00edonn athr\u00fa n\u00f3 amanna ina mb\u00edonn cobhsa\u00edocht.\\nBeidh
  comhaontuithe n\u00e1isi\u00fanta \u00e1 bhforfheidhmi\u00fa ag ITL i gcomhth\u00e9acs
  bheartais n\u00e1isi\u00fanta agus athch\u00f3iri\u00fa na hearn\u00e1la poibl\u00ed,
  i gcomhairle le ceardchumainn na foirne.\\n\\n\\\"\\n\\n2030, leathanach 13)\\n\\n7.
  Cumars\u00e1id\\n\\nD\u00e9anfaidh ITL cumars\u00e1id \u00e9ifeacht\u00fail \u00e9ifeachtach
  le foghlaimeoir\u00ed, alumni, fost\u00f3ir\u00ed, lucht foirne, p\u00e1irtithe
  leasmhara agus leis an daonra i gcoitinne a baint \u00fas\u00e1ide as na me\u00e1in
  is oiri\u00fana\u00ed. L\u00e9ir\u00edonn s\u00e9 seo tiomantas ITL i leith faisn\u00e9is
  chruinn inrochtana a shol\u00e1thar i dtaobh for\u00e1il, n\u00f3sanna imeachta
  agus feidhm\u00edocht; agus \u00e1r dtiomantas i leith \u00e1r bpr\u00f3if\u00edl
  r\u00e9igi\u00fanach, n\u00e1isi\u00fanta agus idirn\u00e1isi\u00fanta a ard\u00fa.\\n\\n-\\n\\n-\\n\\n-\\n\\n,
  innealto , eal\\n\\n-\\n\\nBainfimid \u00fas\u00e1id as strait\u00e9is marga\u00edochta
  a l\u00e9ireoidh an su\u00edomh ilchampais agus r\u00e9imse leathan na gcl\u00e1r
  at\u00e1 \u00e1 dtairiscint. Roghn\u00f3far me\u00e1in do bhloghanna sonracha den
  mhargadh de r\u00e9ir na strait\u00e9ise seo agus bainfear \u00fas\u00e1id ag uirlis\u00ed
  ar n\u00f3s C\u00f3rais Bhainisti\u00fa Caidreamh Custaim\u00e9ir\u00ed leis an
  bhf\u00f3cas a chinnti\u00fa.\\nBeidh \u00e1r neart agus \u00e1r rath \u00e1 gceili\u00faradh
  againn, le taca nuachtlitreacha agus beartas caidreamh poibl\u00ed r\u00e9iteoidh
  le misean, f\u00eds agus luachanna na hInstiti\u00faide. Neart\u00f3far muin\u00edn
  an phobail in ITL leis seo agus cuirfidh s\u00e9 bonn le moth\u00fach\u00e1n br\u00f3id
  agus c\u00e9annachta i measc mic l\u00e9inn agus lucht foirne, agus spreagfar iad
  le creidi\u00faint a ghlacadh ar son a gcuid gn\u00f3thachan.\\nD\u00e9anfaimid
  c\u00e9annacht bhranda uileghabh\u00e1lach ITL a fhorbairt agus a neart\u00fa tuilleadh
  maraon leis na fo-bhranda\u00ed l\u00e1idre at\u00e1 laistigh de, go h\u00e1irithe
  c\u00faig scoil ITL, a hIonaid Taighde agus a hIonaid Fiontra\u00edochta.\\nBun\u00f3far
  gr\u00fapa\u00ed f\u00f3cais de na pr\u00edomhph\u00e1irtithe leasmhara (m.sh. Institi\u00faid
  na gComhairleoir\u00ed Gairme, f\u00f3raim \u00e1iti\u00fala gn\u00f3 n\u00f3 pobail)
  le cinnti\u00fa go mbeidh \u00e9ifeacht len\u00e1r gcl\u00e1ir, \u00e1r seirbh\u00eds\u00ed
  agus \u00e1r gcumars\u00e1id).\\nBeidh ITL rannph\u00e1irteach i dtogra\u00ed n\u00e1isi\u00fanta
  a chuireann an tr\u00ed\u00fa leibh\u00e9al chun cinn mar rogha (m.sh. Seachtain
  na bhFoghlaimeoir\u00ed Aosacha).\\nNuair is infheidhme, glacfaidh ITL le ballra\u00edocht
  i gcomhph\u00e1irt\u00edochta\u00ed d''fhonn an r\u00e9igi\u00fan a chur chun cinn
  mar \u00e1it tharraingteach c\u00f3naithe, oibre agus sh\u00f3isialta.\\nGlacann
  foireann ITL le cumars\u00e1id agus t\u00e1 siad tiomanta do chumars\u00e1id \u00e9isteachta
  agus tuisceana chomh maith le teachtaireachta\u00ed cruinni\u00fa, b\u00e9asacha
  tr\u00e1th\u00fala a chur amach.\\nD\u00e9anfar ard\u00e1in dhinimici\u00fala idirghn\u00edomhacha
  de shu\u00edomh idirl\u00edn agus de thairsigh gr\u00e9as\u00e1in ITL, mar rogha
  ar fhaisn\u00e9is a chur i l\u00e1thair ar an mbealach traidi\u00fanta aontoiseach.
  Bainfear n\u00edos m\u00f3 \u00fas\u00e1ide as ilmhe\u00e1in agus is iad a bheidh
  mar phr\u00edomhfheithicl\u00ed le misean, obair agus idirghabh\u00e1il ITL lena
  phobail inmhe\u00e1nacha agus seachtracha a chraobhscaoileadh.\\nD\u00e9anfaimid
  forbairt lean\u00fanach ar an Timpeallacht Fh\u00edor\u00fail Foghlama mar bhonn
  d\u00e1r strais\u00e9is\u00ed oideola\u00edocha agus \u00e1r dtaca\u00ed d''fhoghlaimeoir\u00ed.
  Beidh s\u00e9 seo ag cur leis an tairseach at\u00e1 ann cheana do mhic l\u00e9inn
  agus go chl\u00e1ir faisn\u00e9ise litearthachta.\\n\\n8. \u00c1iteanna\\n\\nSti\u00far\u00f3idh
  timpeallacht fhisici\u00fail foghlama ITL an fheals\u00fanacht teagaisc agus foghlama
  at\u00e1 glactha ag an Institi\u00faid agus d\u00e9anfaidh s\u00ed freastal s\u00e1s\u00fail
  ar riachtanas gach \u00fas\u00e1ideora: foghlaimeoir\u00ed, foireann agus cuairteoir\u00ed.\\n\\nL\u00e9ir\u00edonn
  An M\u00e1istirphlean d''Fhorbairt an Champais go dt\u00ed 2025 don phr\u00edomhchampas
  ag Maigh Lise ceithre chrann taca strait\u00e9iseacha ITL i leith an oideachais,
  na fiontra\u00edochta agus na rannph\u00e1irt\u00edochta\u00ed agus i leith caighde\u00e1in
  ch\u00e1il\u00edochta ITL.\\n\\nForbr\u00f3far m\u00e1istirphleananna le haghaidh
  fhorbairt chaipiti\u00fail i gcampais eile, lena n\u00e1ir\u00edtear Sr\u00e1id
  an Chl\u00e1ir, C\u00e9 Sheoirse, D\u00farlas agus Cluain Meala (l\u00e1thair Bhaile
  an Gharr\u00e1in) mar a bhfuil l\u00edon na mac l\u00e9inn agus saor\u00e1id\u00ed
  fiontra\u00edochta n\u00f3 T & F \u00e1 leathn\u00fa.\\nTugann caighde\u00e1in ITL
  le haghaidh bonneagar agus saor\u00e1id\u00ed d''fhoghlaimeoir\u00ed buntaca d\u00e1r
  gcl\u00e1ir agus d\u00e1r seirbh\u00eds\u00ed acad\u00fala.  Ar mhaithe le timpeallacht
  foghlama ioml\u00e1na\u00edoch, cl\u00fada\u00edtear sp\u00e1sanna teagaisc, leabharlainne
  agus TF agus seirbh\u00eds\u00ed ginear\u00e1lta do mhic l\u00e9inn, sna caighde\u00e1in
  seo.  N\u00ed m\u00f3r saor\u00e1id\u00ed agus c\u00f3ire\u00e1il nua-aimseartha
  sp\u00f3irt a chur ar f\u00e1il chomh, i gcomhar le comhph\u00e1irtithe b''fh\u00e9idir.\\nT\u00e1
  l\u00e1n\u00fain\u00e9ireacht agus l\u00e1nfhreagracht as tr\u00ed champas ag ITL
  i gCathair Luimnigh (Maigh Lise, Sr\u00e1id an Chl\u00e1ir agus C\u00e9 Sheoirse)
  agus dh\u00e1 champas i dTiobrad \u00c1rann (D\u00farlas agus Cluain Meala).  Cuireann
  ITL raon beag cl\u00e1r ar f\u00e1il chomh maith ar l\u00e1itheacha forrochtana
  nach bhfuil in\u00e1r seilbh (Inis, P\u00e1l\u00e1s Chaonra\u00ed, l\u00e1r Chathair
  Luimnigh). Sa phunann east\u00e1it at\u00e1 i seilbh ioml\u00e1n againn, tugaimid
  aitheantas agus coth\u00fa do charachtar agus do r\u00f3l gach campais ar leith,
  a oireann d\u00e1 shol\u00e1thar cl\u00e1r agus a nascann \u00e9 leis an r\u00e9igi\u00fan
  agus leis an bpobal. Beidh an carachtar saini\u00fail ag eascairt as an bhfoirgneamh
  agus a \u00e1iseanna agus neart\u00f3far \u00e9 le pr\u00f3if\u00edl na bhfoghlaimeoir\u00ed,
  \u00e1iseanna d\u00edlsithe do mhic l\u00e9inn agus taispe\u00e1ntais d\u00e1 gcuid
  oibre.\\nBeidh anail\u00eds sp\u00e1s\u00fail \u00e1 d\u00e9anamh go lean\u00fanach
  ag ITL chomh maith ar r\u00e1ta\u00ed seal\u00fachas faoi fheidhm na nEast\u00e1t.
  Mar chuid de na hathbhreithnithe breathn\u00f3far ar \u00fas\u00e1id n\u00edos strait\u00e9is\u00ed
  agus n\u00edos sol\u00fabtha sp\u00e1is agus ama, mar shampla i seomra ilchusp\u00f3ra
  agus \u00fas\u00e1id n\u00edos fearr a bhaint as bliain an fh\u00e9ilire.\\nD\u00e9anfar
  leathn\u00fa n\u00f3 athch\u00f3ire\u00e1il mar is g\u00e1 agus mar is ind\u00e9anta,
  mar thaca d''fhorbairt na gcl\u00e1r agus don bhf\u00e1s i l\u00edon na mac l\u00e9inn.
  Sa chomhth\u00e9acs seo t\u00e1 riachtanas le haghaidh n\u00edos m\u00f3 sp\u00e1is
  teagaisc \u00e1 fhortheilgean do champais Thiobrad \u00c1rann de r\u00e9ir mar a
  bheidh l\u00edon na mac l\u00e9inn ag m\u00e9ad\u00fa agus mar a \u00fas\u00e1idfear
  an cumas foirne at\u00e1 ann cheana faoi phlean inmharthanachta. Beidh sp\u00e1s
  breise \u00e1 shaoradh i Luimneach nuair a bheidh Ionad Acmhainn\u00ed na Leabharlaine
  agus na Faisn\u00e9ise cr\u00edochnaithe (LIRC). D\u00e9anfar athbhreithni\u00fa
  gn\u00edomhach ar athmh\u00fanl\u00fa an sp\u00e1is seo sa Mh\u00e1istirphlean at\u00e1
  \u00e1 fhorbairt.\\nGlacfaidh ITL leis an gcleachtas is fearr d''fhonn a inmharthanacht
  a chinnti\u00fa i mbainisti\u00fa east\u00e1t \u00f3 thaobh an chomhshaoil. T\u00e1
  oibleag\u00e1id ar an Institi\u00faid tuairisci\u00fa chuid an Roinn Cumars\u00e1ide,
  Fuinnimh agus Acmhainn\u00ed N\u00e1d\u00fartha faoina thomhaltacht bhliant\u00fail
  fuinnimh, agus go h\u00e1irithe faoi na bearta at\u00e1 \u00e1 bhfeidhmi\u00fa chun
  \u00ed a laghd\u00fa tuillleadh. Le m\u00e9ad\u00fa ar rial\u00fa agus \u00fas\u00e1id
  teicneola\u00edochta\u00ed n\u00edos fearr laghd\u00f3far an t-\u00e9ileamh fuinnimh.\\nT\u00e1
  an Institi\u00faid l\u00e1ntiomanta do Phlean Bainisti\u00fa Soghluaisteachta at\u00e1
  \u00e1 fhorbairt faoi l\u00e1thair do Champas Maigh Lise agus do na campais eile
  n\u00edos d\u00e9ana\u00ed. Is \u00e9 cusp\u00f3ir an Phlean Bainisti\u00fa Soghluaisteachta
  taisteal inmharthanach a chur chun cinn chuig an gcampas agus uaidh agus obair i
  gcomhph\u00e1irt\u00edocht leis an \u00fadar\u00e1s \u00e1iti\u00fail, le lucht
  foirne agus le mic l\u00e9inn leis seo a bhaint amach.\\nGlacfar le cleachtais r\u00edomhaireachta
  at\u00e1 inmharthanach \u00f3 thaobh comhshaoil (TF Glas) le timpeallachta\u00ed
  campais ITL a bhreisi\u00fa tr\u00ed r\u00edomhair\u00ed, seirbhe\u00e1laithe, agus
  na foch\u00f3rais a ghabhann leo a fh\u00e1il, a \u00fas\u00e1id agus a dhi\u00fascairt,
  agus d\u00edreofar go h\u00e1irithe ar thomhaltacht fuinnimh agus ar athch\u00fars\u00e1il.\\n\\nD\u00e9anfar
  cothabh\u00e1il agus forbairt lean\u00fanach ar an mbonneagar Teicneola\u00edocht
  Cumars\u00e1ide agus Faisn\u00e9ise le ITL a choinne\u00e1il ar th\u00fas cadhna\u00edochta
  i sol\u00e1thar seirbh\u00edse TCF mar \u00e1isi\u00fa theagasc agus foghlaim, agus
  ar thaighde, le b\u00e9im ar leith ar l\u00edonra\u00ed breithithe, m\u00f3rchumas
  st\u00f3r\u00e1la sonra\u00ed agus teicneola\u00edocht an tseomra ranga.\\nCinnteoidh
  ITL go nd\u00e9anfar cothabh\u00e1il ar chaighde\u00e1in inrochtana d''fhoghlaimeoir\u00ed
  agus do bhaill foirne a bhfuil a soghluaisteacht laghdaithe ar fud na gcampas.\\n\\n-oideachais\\n\\n2030,
  Moladh 1)\\n\\n-\\n\\n9. C\u00f3rais\\n\\nT\u00e1 gn\u00e9ithe teicni\u00fala agus
  daonna ag c\u00f3rais a mb\u00edonn orthu tac\u00fa le hoibri\u00fa r\u00e9idh na
  hInstiti\u00faide.  Beidh na c\u00f3rais seo ag forbairt agus ag feabhs\u00fa go
  lean\u00fanach, de r\u00e9ir na dtuiscint\u00ed agus na dteicneola\u00edochta\u00ed
  is d\u00e9ana\u00ed agus f\u00e9adfaidh siad a bheith faoi r\u00e9ir ag athbhreithnithe
  ar a bpr\u00f3iseas gn\u00f3 \u00f3 am go ham.\\n\\nBeidh pr\u00f3isis agus n\u00f3sanna
  imeachta riarach\u00e1in bh\u00e1\u00fala agus inrochtana ann don fhoghlaimeoir.\\nBeidh
  ITL gn\u00edomhach i bhfoirmi\u00fa ionaid chomhroinnte seirbh\u00eds\u00ed don
  earn\u00e1il, de r\u00e9ir bheartas an rialtais. Is sampla \u00e9 L\u00edonra Sol\u00e1thair
  Chonsoirtiam na Sionnaine de sheirbh\u00eds chomhroinnte.\\nI gcomhth\u00e9acs chuimsi\u00fa
  Institi\u00faid Thiobrad \u00c1rann in ITL, d\u00e9anfar l\u00e1rn\u00fa f\u00edor\u00fail
  seirbh\u00eds\u00ed agus c\u00f3ras a fhordheidhmi\u00fa ar bhealach a \u00fas\u00e1idfidh
  acmhainn\u00ed foirne, a roinnfidh an tualach oibre amach ar bhonn chothrom agus
  a shol\u00e1thr\u00f3idh leibh\u00e9il seirbh\u00edse den scoth.\\nBeidh feidhmeanna
  ini\u00fach\u00f3ireachta inmhe\u00e1nacha agus seachtracha ITL g\u00e9illi\u00fail
  do na c\u00f3id rialachais agus na c\u00f3id iompair is d\u00e9ana\u00ed.\\nD\u00e9anfar
  forbairt ar na c\u00f3rais bhainisti\u00fa faisn\u00e9ise mar bhonn do bhainisti\u00fa
  \u00e9ifeacht\u00fail faisn\u00e9ise riarach\u00e1in agus ar an gcumas chun an fhaisn\u00e9is
  sin a iomp\u00fa ina \u00e9irim inghn\u00edomhaithe rialachais le b\u00e9im ar leith
  ar ollst\u00f3r\u00e1il sonra\u00ed agus ar \u00e9irim ghn\u00f3.\\n\u00das\u00e1idfear
  seifteanna \u00c9irim Ghn\u00f3 le monat\u00f3ireacht a dh\u00e9anamh ar Phr\u00edomhth\u00e1scair\u00ed
  Feidhm\u00edochta (PTF) at\u00e1 nasctha le Plean Strait\u00e9iseach ITL agus le
  cusp\u00f3ir\u00ed at\u00e1 leagtha s\u00edos ag an Rialtas n\u00f3 ag gn\u00edomhaireachta\u00ed
  maoinithe tr\u00ed \u00fas\u00e1id a bhaint as gl\u00e9asra m\u00e9adraithe sainch\u00f3rithe
  agus tuairisc\u00ed beachta.  Beidh cothroma\u00edocht ann idir PTF\u00ed intomhaiste
  a bheidh dirithe ar inchur agus ar aschur.\\nCuirfear timthriallacha strait\u00e9iseacha
  plean\u00e1la agus PTF\u00ed go caomh le timthriallacha tagarmharc\u00e1la dearbh\u00fa
  c\u00e1il\u00edochta seachtracha ar n\u00f3s an tAthbhreithni\u00fa Institi\u00faide
  gach c\u00faigi\u00fa bliain.\\nBeidh samhlacha bainisti\u00fa riosca neadaithe
  i mbainist\u00edocht rialachais, strait\u00e9iseach agus oibri\u00fach\u00e1in,
  leis an discipl\u00edn le iad a chur i bhfeidhm nuair a bh\u00edonn cinnt\u00ed
  t\u00e1bhachtacha le d\u00e9anamh.\\n\\n-\\n\\n2030, Moladh 17)\\n\\n10. Cist\u00ed\\n\\nAg
  t\u00f3g\u00e1il \u00e1r an seasamh foll\u00e1in airgeadais at\u00e1 againn, is
  g\u00e1 do ITL strait\u00e9is bainist\u00ed\u00fa airgeadais a fhorbairt a chuirfidh
  r\u00e9as\u00fana\u00edocht uileghabh\u00e1lach ar f\u00e1il le haghaidh beartas,
  cinnteoireachta agus freagairt do dh\u00fashl\u00e1in sa timpeallacht oibri\u00fach\u00e1in
  ina bhfuilimid.\\n\\nD\u00e9anfar athbhreithni\u00fa go lean\u00fanach ar impleachta\u00ed
  na spriocanna agus na nuaillmhianta ar acmhainn\u00ed at\u00e1 luaite sa ch\u00e1ip\u00e9is
  seo agus d\u00e9anfar iad a les\u00fa sna pleananna forfheidhmithe.\\nBeidh samhlacha
  leithdh\u00e1ilithe a \u00fas\u00e1idtear go hinmhe\u00e1nach ina sc\u00e1th\u00e1n
  ar na c\u00f3rais maoinithe a \u00fas\u00e1idtear san earn\u00e1il nuair is f\u00e9idir,
  ach iad maolaithe de r\u00e9ir chusp\u00f3ir\u00ed an Phlean Strait\u00e9isigh.\\nD\u00e9anfaimid
  uasmh\u00e9ad\u00fa ar mhaoini\u00fa atr\u00e9imhseach St\u00e1it de r\u00e9ir fhorfheidhmi\u00fa
  chost\u00e1il aonaid don (sean)aonad ITL, agus coinneoimid an bonn maoinithe don
  (sean)aonad IT sa tr\u00e9imhse imfh\u00e1laithe 5 bliana at\u00e1 aontaithe leis
  an DES agus an HEA  Nuair a bheidh an tr\u00e9imhse imfh\u00e1laithe thart, beidh
  oibr\u00edochta\u00ed ar fud an ITL m\u00e9adaithe ag teacht leis na gn\u00e1thpharam\u00e9adair
  san earn\u00e1il.\\nD\u00e9anfaidh ITL a bheartais agus a n\u00f3sanna imeachta\u00ed
  a choigeart\u00fa mar is g\u00e1 faoi aon athruithe i r\u00e9imeas chionroinnt na
  mac l\u00e9inn, mar shampla de bharr ail\u00edni\u00fa strucht\u00fair t\u00e1ill\u00ed
  do chl\u00e1ir chreidi\u00fanaithe l\u00e1naimseartha agus p\u00e1irtaimseartha.\\nM\u00e9ad\u00f3far
  sruthanna ioncaim neamh-St\u00e1tchiste tr\u00ed sheirbh\u00eds\u00ed oideachas\u00fala
  agus neamhoideachas\u00fala a thairiscint, d''fhonn \u00e1r dtuilleama\u00ed ar
  an deontas St\u00e1it a laghd\u00fa agus d''fhonn tac\u00fa len\u00e1r gcro\u00ed-oibri\u00fach\u00e1in.
  D''fh\u00e9adfadh foins\u00ed \u00c9ireannacha agus idirn\u00e1isi\u00fanta san
  earn\u00e1il phr\u00edobh\u00e1ideach a bheith san \u00e1ireamh sna sruthanna ioncaim
  seo.\\nCuirfidh ITL go leor cist\u00ed ar leataobh do chothabh\u00e1il, athnuachan
  trealaimh (ath)fhorbairt agus nu\u00e1il, mar a l\u00e9ir\u00edtear i gc\u00f3ibh\u00e9iseanna
  airgeadais i mbuis\u00e9id\u00ed agus i gcuntais.\\nIarrfar cist\u00ed forbartha
  caipitil \u00f3n St\u00e1t agus \u00f3 fhoins\u00ed malartacha, tr\u00ed ghn\u00edomha\u00edochta\u00ed
  tiomsaithe airgid mar shampla.\\nBun\u00f3idh ITL bord comhairleach seachtrach le
  breathn\u00fa ar iarrachta\u00ed tiomsaithe airgid, a d''fh\u00e9adfadh a bheith
  i bhfoirm rann\u00edoca\u00edochta\u00ed daonchairdi\u00fala comhchine\u00e1il n\u00f3
  i bhfoirm airgid.  Beidh na rann\u00edoca\u00edochta\u00ed seo d\u00edrithe ar ghn\u00edomha\u00edochta
  tosa\u00edochta agus ar thionscadail de r\u00e9ir \u00e1r bpleananna faofa strait\u00e9iseacha.\\nBeidh
  feidhm\u00edocht lean\u00fanach \u00e9ifeacht\u00fail \u00e1 l\u00e9iri\u00fa ag
  ITL i gcomhth\u00e9acs na dtagarmharcanna agus na samhlacha maoiithe don earn\u00e1il,
  rud a neart\u00f3idh \u00e1r gcumas chun \u00e1r gcuid seirbh\u00eds\u00ed a sheachadadh.\\n\\n-\\n\\n-\\n\\n\\\"\\n\\n.\\n\\n-\\n\\n2030,
  Moladh 26)\\n\\n\\\"N\u00ed m\u00f3r an chuid den chostas ioml\u00e1n a fhaightear
  tr\u00ed infheist\u00edocht neamh-St\u00e1tchiste a mh\u00e9d\u00fa go norm idirn\u00e1isi\u00fanta
  - 2030, lch. 111)\\n\\nFearann C - an Comhshaol\\n\\nUaillmhianta i dtreo 2020:
  Timthriall Plean n\u00edos Giorra go dt\u00ed Me\u00e1n F\u00f3mhair 2012:\\n\\nCad
  \u00e9 an dearcadh leathan faoi c\u00e9n chuma a bheidh ar an t\u00edrdhreach?\\n\\nCad
  iad na riosca\u00ed gearrth\u00e9armacha agus me\u00e1nt\u00e9armacha agus na deiseanna?\\n\\nIs
  f\u00e9idir creatlaigh agus uirlis\u00ed \u00e1bhartha a \u00fas\u00e1id le faire
  lean\u00fanach a dh\u00e9anamh ar \u00e1r dtimpeallacht oibri\u00fach\u00e1in.  B\u00edonn
  s\u00e9 deacair a leith\u00e9id d''anail\u00eds a dh\u00e9anamh mar gheall ar neamhchinnteachta\u00ed
  sa bhaile agus thar lear.  N\u00ed m\u00f3r d\u00fainn \u00e1fach oibri\u00fa de
  r\u00e9ir na tuisceana at\u00e1 againn f\u00e9in ar \u00e1r misean, \u00e1r bhf\u00eds
  agus \u00e1r gcumas chun \u00e1r gcion a dh\u00e9anamh go t\u00f3g\u00e1lach. Cuireann
  an roinn seo den ch\u00e1ip\u00e9is idirghn\u00edomha\u00edocht ITL leis an gcomhshaol
  in i\u00fal, agus conas mar a chuid\u00edonn s\u00e9 le m\u00fanl\u00fa an chomhshaoil,
  go h\u00e1irithe san earn\u00e1il ardoideachais agus in\u00e1r r\u00e9igi\u00fan.\\n\\n\u00c1r
  r\u00e9igi\u00fan - Tionscla\u00edocht agus an Pobal\\n\\nT\u00e1 guth t\u00e9agartha
  ag ITL sa r\u00e9igi\u00fan agus is maith an t-\u00e9isteoir \u00e9 chomh maith.
  Is \u00ed aidhm ITL a pr\u00f3if\u00edl ceannaireachta a bhreisi\u00fa tr\u00ed
  fhreagairt do riachtanais sa r\u00e9igi\u00fan, chomh maith le tionchar a imirt
  mar thiom\u00e1na\u00ed ar rath an r\u00e9igi\u00fain fi\u00fa in amanna m\u00f3rdheacrachta\u00ed.\\n\\nT\u00e1
  sc\u00f3ip agus pr\u00edomhcheantar leathan t\u00edreola\u00edoch ag ITL mar at\u00e1
  sainmh\u00ednithe ag l\u00e1ithreacha campais i Luimneach, i dTiobrad \u00c1rann
  agus sna contaethe m\u00e1guaird.   Is f\u00e9idir iad seo a fheice\u00e1il ar l\u00e9arsc\u00e1il
  na h\u00c9ireann agus iad a cheangal le sonra\u00ed iarbh\u00edr deimeagrafacha
  agus le tr\u00e9ithe r\u00e9igi\u00fanacha eile de r\u00e9ir mar a thagann siad
  chun cinn. T\u00e1 s\u00e9 d''aidhm againn ar a laghad \u00e1r l\u00e1itheacht sna
  ceantair seo a bhuan\u00fa agus a mh\u00e9ad\u00fa i gc\u00e1sanna \u00e1irithe.\\nFreastala\u00edonn
  an sol\u00e1thar oideachais, oili\u00fana, taighde agus comhairli\u00fach\u00e1in
  at\u00e1 \u00e1 thairiscint ag ITL ar mheasc\u00e1n leathan clianta\u00ed.  T\u00e1
  eagra\u00edochta\u00ed iln\u00e1isi\u00fanta in earn\u00e1lacha \u00e9ags\u00fala
  \u00e1irithe sa mheasc\u00e1n seo; roinnt eagra\u00edochta\u00ed d\u00fachasacha;
  r\u00e9imse leathan fiontar beaga agus Me\u00e1nmh\u00e9ide at\u00e1 bunaithe sa
  chathair agus faoin tuathl eagra\u00edochta\u00ed san earn\u00e1il phoibl\u00ed
  agus eagra\u00edochta\u00ed pobail agus deonacha.  Is f\u00e9idir na tionscail agus
  na hearn\u00e1lacha agus na heagra\u00edochta\u00ed eile seo a mhap\u00e1il de r\u00e9ir
  Scoile agus r\u00e9imse Taighde agus Forbartha. D\u00e9anfaidh ITL tuilleadh forbartha
  ar a chaidreamh leis na p\u00e1irtithe gn\u00edomhacha seo agus beidh s\u00e9 seo
  le feice\u00e1il i mbeartais idirghabh\u00e1la\\n\\ntionscla\u00edocha agus i bpleananna
  i leibh\u00e9il \u00e9ags\u00fala d\u00e1r n-eagra\u00edocht.  T\u00e1 s\u00e9 seo
  faoi r\u00e9ir ag anail\u00eds bhreise na bp\u00e1irtithe leasmhara agus ar thosa\u00edocht
  a thabhairt do chaidreamh.\\nD\u00e9anann ITL freisin feabhs\u00fa ar shaol s\u00f3isialta
  agus eacnama\u00edoch an r\u00e9igi\u00fain tr\u00ed \u00fas\u00e1id a bhaint as
  a l\u00edonra\u00ed eolais idirn\u00e1isi\u00fanta d''fhonn deiseanna a chruth\u00fa
  d''fhiontair \u00e1iti\u00fala, do chomhlachta\u00ed poibl\u00ed agus d''eagra\u00edochta\u00ed
  pobail agus deonacha a bheith rannph\u00e1irteach i dtionscadail idirn\u00e1isi\u00fanta,
  agus a mbonn eolais, a l\u00edonra\u00ed tr\u00e1d\u00e1la agus a n-\u00e9ifeacht\u00falacht
  a bhreisi\u00fa d\u00e1 r\u00e9ir.\\nBeidh ITL ag lean\u00faint ar aghaidh le hidirghn\u00edomha\u00edochta\u00ed
  leis na pr\u00edomh\u00fadar\u00e1is, ard\u00e1in agus gn\u00edomhaireachta sa r\u00e9igi\u00fan
  agus ar fud na tire mar is cu\u00ed: Comhairl\u00ed Cathrach agus Contae, Boird
  Fiontra\u00edochta Cathrach agus Contae, CGO, Fiontra\u00edocht \u00c9ireann sa
  Mhe\u00e1n-iarthar agus san Oirdheisceart, IDA thiar agus IDA an Oirdheiscirt, \u00dadar\u00e1is
  R\u00e9igi\u00fanacha an Mhe\u00e1n-Iarthair agus an Oirdheiscirt, Conair an Atlantaigh,
  Cumainn Tr\u00e1cht\u00e1la \u00e9ags\u00fala agus mar sin de (ach faoi r\u00e9ir
  ag tosa\u00edocht\u00fa).\\nB\u00edonn ITL rannph\u00e1irteach le tionscla\u00edocht
  agus leis an bpobal i gcoitinne tr\u00ed thogra\u00ed \u00e9ags\u00fala. B\u00edmid
  rannph\u00e1irteach le gr\u00fapa\u00ed \u00e9ags\u00fala at\u00e1 faoi dh\u00fashl\u00e1n
  eacnama\u00edoch sa r\u00e9igi\u00fan, ar n\u00f3s ceantair athnuachana Luimnigh.  B\u00edtear
  rannph\u00e1irteach le pobail tuaithe, eala\u00edne, sp\u00f3irt agus go leor eile,
  tr\u00ed shocr\u00fach\u00e1in oibre (r\u00e9igi\u00fanach, n\u00e1isi\u00fanta
  n\u00f3 idirn\u00e1isi\u00fanta), sannadh foghlaimeoir\u00ed agus an cl\u00e1r creidi\u00fanaithe
  deont\u00f3ra do mhic l\u00e9inn GIVE.  B\u00edonn lucht foirne p\u00e1irteach i
  nd\u00edosp\u00f3ireacht phoibl\u00ed agus b\u00edonn siad ar f\u00e1il le freastal
  ar Bhoird eagra\u00edochta\u00ed deonacha.\\nLe beartas Freagracht Chorpar\u00e1ideach
  S\u00f3isialta mar thaca, beidh ITL ag lean\u00faint ar aghaidh lena rannph\u00e1irt\u00edocht
  leis an phobal ar leibh\u00e9al institi\u00faideach, foirne agus mac l\u00e9inn
  agus tabharfar taca\u00edocht d\u00f3 seo tr\u00ed shruthanna malartacha ioncaim
  agus socruithe oibre deonacha.\\n\\n\u00c1r nEarn\u00e1il: Oideachas agus Comhlachta\u00ed
  N\u00e1isi\u00fanta\\n\\nMar cheannair\u00ed gn\u00edomhacha sa r\u00e9imse, t\u00e1
  s\u00e9 d''aidhm ag ITL a bheith ar th\u00fas cadhna\u00edochta le strucht\u00fair
  nua forbartha agus le comhoibri\u00fa san ardoideachas; t\u00e1 idirbhearta\u00edocht
  dhl\u00fath le pr\u00edomhph\u00e1irtithe leasmhara na hearn\u00e1la i gceist leis
  seo.\\n\\n- 2030  - T\u00e1 ITL ag freagairt go honnghn\u00edomhach agus t\u00fas
  \u00e1 chur leis an r\u00e9 nua seo mar eagra\u00edocht chomhth\u00e1ite a chuims\u00edonn
  Institi\u00faid Thiobrad \u00c1rann mar a bh\u00ed.  Mar eagra\u00edocht bhreisithe
  le taith\u00ed shuntasach luachmhar sa chomhoibri\u00fa, cuirfimid f\u00e1ilte roimh
  chomhoibri\u00fa eile ar bhonn comhch\u00e9ime, a thabharfaidh meas d\u00e1r st\u00e1das,
  d\u00e1r gc\u00e9annacht agus d\u00e1 bpr\u00f3if\u00edl neamhsple\u00e1ch agus
  a neart\u00f3idh iad.\\n\u00c9abhl\u00f3id na hEarn\u00e1la IT - t\u00e1 ITL ag
  tac\u00fa leis na molta\u00ed beartais n\u00e1isi\u00fanta i leith st\u00e1das Ollscoil
  Teicneola\u00edoch (OT) na hearn\u00e1la agus faoi r\u00e9ir ag beartais an rialtais
  d\u00e9anfar iarracht an st\u00e1das sin a bhaint amach as a phoint\u00ed nirt f\u00e9in.
  Beidh comhph\u00e1irt\u00edochta\u00ed n\u00f3 comhghualla\u00edochta\u00ed \u00e1bhartha
  rannph\u00e1irteach sa phr\u00f3iseas org\u00e1nach seo, agus cosn\u00f3idh siad
  ITL amach anseo i aghaidh a bheith f\u00e1gtha ar gc\u00fal agus piar-eagra\u00edochta\u00ed
  ag dul chun cinn i dtreo st\u00e1das OT. Ba cheart do na comhghuallachta\u00ed a
  bheith domhain agus leathan, ag tabhairt t\u00e1irg\u00ed inseachadta chuig foghlaimeoir\u00ed
  agus lucht foirne, ar n\u00f3s comhfhorbairt agus comhshol\u00e1thar cl\u00e1r,
  idirn\u00e1isi\u00fan\u00fa, taighde feidhmeach, forbairt foirne agus sin\u00e9irgeachta\u00ed
  ag leibh\u00e9al na gc\u00f3ras. T\u00e1 na gn\u00edomha\u00edochta\u00ed seo ag
  teacht leis na beartais n\u00e1isi\u00fanta d''Institi\u00faid\u00ed Teicneola\u00edochta
  mar at\u00e1 siad comhdh\u00e9anta faoi l\u00e1thair, chomh maith leis na crit\u00e9ir
  le dul i dtreo st\u00e1das Ollscoil Teicneola\u00edochta ( faoi r\u00e9ir ag reachta\u00edocht
  agus pr\u00f3iseas d\u00fashl\u00e1nach dh\u00e1 ch\u00e9ime).\\n\\nT\u00e1 ITL
  tiomanta do lean\u00faint ar aghaidh le caidrimh chomhoibr\u00edocha le sol\u00e1thr\u00f3ir\u00ed
  eile ardoideachais sa r\u00e9igi\u00fan, go h\u00e1irithe leis an earn\u00e1il ollscola\u00edochta
  tr\u00ed Chonsortiam na Sionnaine. Cl\u00fada\u00edonn an Consortiam comhthionscadail
  nu\u00e1lacha rochtana, teagaisc agus foghlama agus \u00e9ifeacht\u00falachta\u00ed
  tr\u00ed shol\u00e1thar i gcomhar. Neart\u00f3far \u00e1r seasamh sa r\u00e9igi\u00fan
  le naisc lean\u00fanacha comhoibr\u00edocha agus idircheangailte le scoileanna dara
  leibh\u00e9il agus le col\u00e1ist\u00ed iar-ardteiste agus cuirfear cos\u00e1in
  oiri\u00fanacha oideachais ar f\u00e1il leis. N\u00ed m\u00f3r do ITL agus do shol\u00e1thr\u00f3ir\u00ed
  m\u00f3rshrutha eile dearcadh feabhsaithe i leith comhoibi\u00fa a fhorbairt, n\u00ed
  hamh\u00e1in le freastal ar dh\u00fashl\u00e1in bheartas nua an rialtais ach chun
  freagairt don ioma\u00edocht at\u00e1 ag teacht chun cinn \u00f3 shol\u00e1thr\u00f3ir\u00ed
  (pr\u00edobh\u00e1ideacha) nach mbaineann leis an m\u00f3rshruth.\\nCaidreamh le
  comhlachta\u00ed agus gn\u00edomhaireachta\u00ed rial\u00e1la na hearn\u00e1la -
  beidh ITL ag pl\u00e9 go dearfach leis na comhlachta\u00ed seo agus d\u00e9anfar
  gach iarracht a chl\u00fa mar eagra\u00edoch ionraic, iontaofa d''ardchaighde\u00e1n
  a chaomhn\u00fa. Is mian le ITL a fheidhm\u00edocht den scoth de r\u00e9ir mar a
  thomhaistear \u00ed le tagarmharcanna a chothabh\u00e1il, agus a ionad iontaoibh
  a choinne\u00e1il a l\u00e9ir\u00edtear \u00ed i gomhord\u00fa na m\u00f3rthionscadal
  agus na gcl\u00e1r n\u00e1isi\u00fanta, ar n\u00f3s an Ciste Strait\u00e9iseach
  Nu\u00e1la.\\nCaidrimh le forais ghairmi\u00fala - is t\u00e1bhachtach do ITL a
  naisc l\u00e1idre le comhlachta\u00ed \u00e1bhartha gairmi\u00fala, naisc a chotha\u00edtear
  tr\u00ed ranna acad\u00fala agus ar leibh\u00e9al na gcl\u00e1r. D\u00e9anfar na
  naisc seo a chothabh\u00e1il agus a neart\u00fa, de r\u00e9ir mar at\u00e1 siad
  ag clo\u00ed len\u00e1r bhfeals\u00fanacht oideachas\u00fail agus len\u00e1r gcur
  chuige oideola\u00edoch agus mar a dh\u00e9anfaidh siad leas na bhfoghlaimeoir\u00ed
  agus na gc\u00e9imithe.\\n\\n\\\"T\u00e1 r\u00f3lanna \u00e9ags\u00fala agus comhl\u00e1ntacha
  ag institi\u00faid\u00ed teicneola\u00edochta agus ag ollsco\\n\\n-\\n\\n2030, leathanach
  98)\\n\\n\\\"Ba ch\u00f3ir creatlach a fhorbairt d''fhonn comhoibri\u00fa a \u00e1isi\u00fa
  ar fud an ch\u00f3rais idir institi\u00faid\u00ed \u00e9ags\u00fala le braisl\u00ed
  r\u00e9igi\u00fanacha a chruth\u00fa.\\\"\\n\\n-\\n\\n-\\n\\nagus an acmhainneacht
  iomchui mar ollscoileanna teicneola\u00edochta.\\\"\\n\\n-\\n\\nAn Domhan m\u00f3rthimpeall
  orainn (Macra-leibh\u00e9al)\\n\\nAg leibh\u00e9al Institi\u00faide agus ag leibh\u00e9al
  Scoile n\u00f3 r\u00e9imse feidhme, beidh anail\u00eds lean\u00fanach ar si\u00fal
  againn ar an macra-thimpeallacht ina mb\u00edmid ag oibri\u00fa.  Aithn\u00edmid
  nach f\u00e9idir an macrathimpeallacht a rial\u00fa den chuid is m\u00f3 ag aon
  eagra\u00edocht aonair amh\u00e1in, ach n\u00ed m\u00f3r d\u00fainn monat\u00f3ireacht
  a dh\u00e9anamh uirthi.\\n\\nIonchais eacnama\u00edochta int\u00edre - ar an ioml\u00e1n
  t\u00e1 deichbhliain dheacair ag \u00c9irinn faoi l\u00e1thair agus beidh tionchar
  aige seo ar na hearn\u00e1lacha \u00e9ags\u00fala den eacnama\u00edocht a bhfuilimid
  ag freastal orthu. Beidh deiseanna ann chomh maith \u00e1fach ar f\u00e9idir iad
  a uasmh\u00e9ad\u00fa tr\u00ed na hacmhainn\u00ed agus na buanna \u00e9ags\u00fala
  at\u00e1 ag an t\u00edr agus ag na daoine. Faoir threoir lean\u00fanach ag tuiscint\u00ed
  faoi ionchair infhosta\u00edochta agus riachtanais scileanna, beidh ITL ag d\u00e9anamh
  a cion ar son an t\u00e9arnaimh agus ar son todhcha\u00ed n\u00edos d\u00f3chasa\u00ed
  tr\u00ed oideachas, oili\u00faint agus taighde. N\u00ed m\u00f3r d\u00e1r sol\u00e1thar
  oideachais agus oili\u00fana \u00e1fach dul n\u00edos sia n\u00e1 freagairt do riachtanais
  thimthriallacha l\u00e1ithreacha an mhargadh saothair.\\nTreochta\u00ed idirn\u00e1isi\u00fanta
  - agus l\u00edon na bhfoghlaimeoir\u00ed idirn\u00e1isi\u00fanta ar an rolla ag
  m\u00e9ad\u00fa in ITL agus cion \u00e1r gcl\u00e1r ag leathn\u00fa amach, n\u00ed
  m\u00f3r d\u00fainn a bheith eolasach ar ch\u00faiseanna imn\u00ed \u00e1iti\u00fala
  agus domhanda araon.\\nC\u00fains\u00ed socha\u00edocha - t\u00e1 r\u00f3l r\u00edth\u00e1bhachtach
  ag an ardoideachas, \u00f3 thaobh sainmheopn agus c\u00f3rais a fhorbairt do shocha\u00ed
  n\u00edos \u00e9irimi\u00fala agus d\u00f3chas a thabhairt do dhaoine ina n-iarrachta\u00ed
  le c\u00e1il\u00edochta\u00ed a bhaint amach, n\u00f3 tabhairt faoi thaighde, obair
  fhorbartha n\u00f3 iarrachta\u00ed fiontra\u00edocha. Is \u00e9 r\u00f3l ITL ionchais
  infhosta\u00edochta agus s\u00e1stacht phearsanta a bhreisi\u00fa do na codanna
  \u00e9ags\u00fala den daonra a \u00fas\u00e1ideann \u00e1r gcuid seirbh\u00eds\u00ed.
  B\u00edonn s\u00e9 i gceist chomh maith na foghlaimeoir\u00ed a ullmh\u00fa mar
  shaor\u00e1naigh sa tsocha\u00ed go ginear\u00e1lta. T\u00e1 ITL eolach ar na r\u00e9amhfhaisn\u00e9is\u00ed
  faoin m\u00e9ad\u00fa ar \u00e9ileamh ar ardoideachas agus d\u00e9anfaimid \u00e1r
  nd\u00edcheall freastal ar an \u00e9ileamh seo.\\nLe cl\u00e1r oibre achch\u00f3iri\u00fa
  na hearn\u00e1la poibl\u00ed t\u00e1thar ag iarraidh \u00e9ifeacht\u00falacht agus
  sol\u00fabthacht in \u00fas\u00e1id acmhainn\u00ed a fheabhs\u00fa. T\u00e1 ITL
  tiomanta do sheachadadh a dh\u00e9anamh ar an gcl\u00e1r oibre seo ar mhaithe leis
  na mic l\u00e9inn agus p\u00e1irtithe leasmhara eile a \u00fas\u00e1ideann \u00e1r
  seirbh\u00eds\u00ed. D''fh\u00e9adfadh s\u00e9 nach mbeidh na paraid\u00edm\u00ed
  seachadta agus oibri\u00fach\u00e1in at\u00e1 seanbhunaithe inmharthanach feasta
  agus n\u00ed m\u00f3r d\u00fainn beala\u00ed a fh\u00e1il chun \u00e1r seirbh\u00eds\u00ed
  do ghr\u00fapa\u00ed n\u00edos m\u00f3 d''fhoghlaimeoir\u00ed a shol\u00e1thar,
  le laghd\u00fa sna hacmhainn\u00ed ach gan aon chailli\u00faint sa ch\u00e1il\u00edocht.
  Braitheann an t-athch\u00f3iri\u00fa ar chomhaontuithe n\u00e1isi\u00fanta, ach
  is go h\u00e1iti\u00fail a chuirfear i bhfeidhm \u00e9 i gcomhairli\u00fach\u00e1n
  le bainistiocht, ceardchumainn agus lucht foirne.\\n\\n\\\"\\n\\n-\\n\\n2030, leathanach
