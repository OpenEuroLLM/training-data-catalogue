  ![Diagram](image2.png)\\n\\n(iii) ![Diagram](image3.png)\\n\\nTabhair gach freagra
  ceart go dt\u00ed ionad deach\u00falach amh\u00e1in.\\n\\n11. Cruth dronuilleoige
