  a eascra\u00edonn as an bpr\u00f3iseas c\u00f3nascaithe: beidh s\u00e9 seo riachtanach
  ar mhaithe leis an ilghn\u00e9itheacht at\u00e1 mar neart in ardoicheasas na h\u00c9ireann
  a chaomhn\u00fa.\\n\\nT\u00e1 pr\u00f3iseas dh\u00e1 ch\u00e9im beartaithe le haghaidh
  aon iarratas ar athainmni\u00fa:\\n\\nBheadh an t-iarratas \u00e1 mheas ag pain\u00e9al
  saineonaithe a bheadh ceaptha ag an Aire Oideachas agus Scileanna ar chomhairle
  an HEA Dh\u00e9anfadh an pain\u00e9al seo meas\u00fan\u00fa ar an iarratas i dt\u00e9arma\u00ed
  fheidhm\u00edocht institi\u00faideach agus i dt\u00e9arma\u00ed na n-impleachta\u00ed
  ginear\u00e1lta don ch\u00f3ras d\u00e1 nglacfa\u00ed leis an iarratas. Ba cheart
  don phain\u00e9al seo a bheith neamhsple\u00e1ch agus saineolach, agus \u00e9 sin
  a bheith le feice\u00e1il go soil\u00e9ir.\\n\\nBheadh an dara hathbhreithni\u00fa
  comhdh\u00e9anta de shaineolaithe idirn\u00e1isi\u00fanta a dh\u00e9anfadh meas\u00fan\u00fa
  ar ch\u00e1il\u00edocht feidhm\u00edochta na hinstiti\u00faide, le breithni\u00fa
  an s\u00e1sa\u00edonn s\u00e9 na caighde\u00e1in a mbeif\u00ed ag s\u00fail leo
  \u00f3 ollscoil teicneola\u00edochta.\\n\\nBa cheart do na crit\u00e9ir a \u00fas\u00e1idtear
  le f\u00e1il amach cib\u00e9 acu a nglacfar le hiarratas d\u00edri\u00fa ar ardfheidhm\u00edocht
  laistigh den mhisean. Le foilseach\u00e1n luath na gcrit\u00e9ar seo beidh r\u00e9amhfh\u00f3gra
  ag na hinstiti\u00faid\u00ed faoi na h\u00e9ilimh dhiana a bhainfeadh leis an bpr\u00f3iseas
  ainmni\u00fach\u00e1in agus cuirfidh s\u00e9 ar a gcumas r\u00e9amhphlean\u00e1il
  a dh\u00e9anamh le haghaidh aon athr\u00fa st\u00e1dais.\\n\\nIs \u00ed an intinn
  at\u00e1 ann maidir leis na crit\u00e9ir a leagan amach cosaint bhun\u00fasach do
  chro\u00edmhisean agus do threocht na n-institi\u00faid\u00ed agus d\u00fashl\u00e1n
  a thabhairt ag an am c\u00e9anna do na hinstiti\u00faid\u00ed ar mian leo a bheith
  athainmnithe a thaispe\u00e1int go bhfuil na leibh\u00e9il nua feidhm\u00edochta
  bainte amach acu sna crit\u00e9ir seo.\\n\\nCrit\u00e9ir c\u00e9adch\u00e9ime\\n\\nD''\u00e1ireofa\u00ed
  i measc na gcit\u00e9ir a chuirf\u00ed i bhfeidhm sa ch\u00e9ad ch\u00e9im den phr\u00f3iseas
  athbhreithnithe:\\n\\nTionchar an athainmni\u00fach\u00e1in ar an r\u00e9igi\u00fan
  agus ar na pr\u00edomhph\u00e1irtithe leasmhara a bhfuil baint acu leis an institi\u00faid,
  le cinnti\u00fa nach gcuirf\u00ed aon chion t\u00e1bhachtach reatha de chuid na
  hinstiti\u00faide i mbaol mar gheall ar an athainmni\u00fa.\\n\\nAn caidreamh agus
  an comhoibri\u00fa le sol\u00e1thr\u00f3ir\u00ed eile ardoideachais, rath na hinstiti\u00faide
  ina rannph\u00e1irt\u00edocht i mbraisl\u00ed r\u00e9igi\u00fanacha, agus aon togra
  d''fhonn tac\u00fa le comhdhl\u00fath\u00fa laistigh den earn\u00e1il.\\n\\nTaifead
  na hinstiti\u00faide c\u00f3nasctha \u00f3 thaobh \u00e9ifeacht\u00falacht agus
  \u00e9ifeachtacht na nacmhainn\u00ed bainist\u00edochta a fheabhs\u00fa.\\n\\nNa
  tionchair airgeadais agus oibri\u00fach\u00e1in eile a d''fh\u00e9adfadh eascairt
  as an athainmni\u00fa\\n\\nagus an plean gn\u00f3 at\u00e1 mar bhun do na hathruithe
  sin; agus Cumas phr\u00f3isis ceannaireachta, rialachais agus bainist\u00edochta
  na hInstiti\u00faide.\\n\\nCrit\u00e9ir dara c\u00e9ime\\n\\nD''\u00e1ireofa\u00ed
  i measc na gcrit\u00e9ir sa dara ch\u00e9im den phr\u00f3iseas athbhreithnithe:\\n\\nF\u00eds
  strait\u00e9iseach na hInstiti\u00faide d''fhorbairt a r\u00f3l mar ollscoil teicneola\u00edochta
  agus conas is f\u00e9idir leis breisluach substainti\u00fail uath\u00fail a thabhairt
  chuig cumas nu\u00e1la an r\u00e9igi\u00fain agus na t\u00edre.\\n\\nAn taifead
  rannph\u00e1irt\u00edochta le gn\u00f3 \u00e1iti\u00fail agus n\u00e1isi\u00fant
  agus leis an earn\u00e1il phoibl\u00ed ag tabhairt taca\u00edochta r\u00e9itithe
  fadhbanna ar leibh\u00e9al ard teicni\u00fail.\\n\\nAn taifead i malart\u00fa foirne
  isteach agus amach as tionscail \u00e1bhartha agus eagra\u00edochta\u00ed san earn\u00e1il
  phoibl\u00ed.\\n\\nFianaise faoi rannph\u00e1irt\u00edocht shuntasach gn\u00f3 i
  bhforbairt an churaclam.\\n\\nAn chuid de na mic l\u00e9inn at\u00e1 rannph\u00e1irt\u00edocht
  i bhfeabhs\u00fa scileanna agus i socruithe staid\u00e9ir neamhthraidisi\u00fanta
  (p\u00e1irtaimseartha, r\u00edomhfhoghlaim, srl).\\n\\nAn chuid den mhaoini\u00fa
  a fhaightear \u00f3 chonartha\u00ed taighde n\u00f3 oili\u00fana leis an earn\u00e1il
  gn\u00f3 agus\\n\\nAn taifead maidir le comhoibri\u00fa idirn\u00e1isi\u00fanta
  le hinstiti\u00faid\u00ed a bhfuil misin chos\u00fala acu tionscadail chomhoibr\u00edocha,
  malart\u00fa foirne/ mic l\u00e9inn, srl.\\n\\nRiachtanais cine\u00e1lacha eile\\n\\nChomh
  maith leis na crit\u00e9ir seo, bheadh ar na hinstiti\u00faid\u00ed riachtanais
  cine\u00e1lacha eile a sh\u00e1s\u00fa, lena n-\u00e1ir\u00edtear:\\n\\nCult\u00far
  de scol\u00e1ireacht mharthanach a threor\u00f3dh teagasc agus foghlai i ngach r\u00e9imse
  ina bhfuil c\u00farsa\u00ed \u00e1 dtairiscin;\\n\\nSc\u00e1la agus mais chritici\u00fail
  a bheadh d\u00f3thanach le gn\u00edomha\u00edocht na hinstidi\u00faide a bhuan\u00fa;\\n\\nCumas
  institi\u00faideach \u00f3 thaobh an r\u00e9imse scileanna a bheadh riachatnach
  le bainisti\u00fa agus cuntasacht ghairmi\u00fail inmhe\u00e1nach agus sheachtrach
  a chinnti\u00fa.\\n\\nN\u00f3sanna imeachta rialachais, strucht\u00fair eagr\u00fach\u00e1in,
  beartais iontr\u00e1la, rochtana agus dul chun cinn, socruithe airgeadais, agus
  pr\u00f3isis deimhni\u00fa c\u00e1il\u00edochta, iad go l\u00e9ir bunaithe ar luachanna
  agus ar spriocanna na n-ollscoileanna teicneola\u00edochta agus iad iontaofacht
  a chl\u00e1ir acad\u00fala \u00e1 chinnti\u00fa acu.\\n\\nAGUIS\u00cdN 3 - S\u00c1R
  - PTF\u00cd MOLTA LE HAGHAIDH STRAIT\u00c9IS ITL GO DT\u00cd 2020\\n\\n(\u00d3:
  Athbhreithni\u00fa ITL ar Phr\u00edomhth\u00e1scair\u00ed Feidhm\u00edochta, Tuarasc\u00e1il
  Inmhe\u00e1nach Ini\u00fach\u00f3ireachta le Deloitte a ghlac an Bord Rialaithe,
  Feabhra 2011, Caibidil 3)\\n\\n3. S\u00e1r - PTF\u00ed Molta le haghaidh Strait\u00e9is
  ITL go dt\u00ed 2020\\n\\nBUNAITHE AR DH\u00cdOSP\u00d3IREACHT LEIS AN UACHTAR\u00c1N
  AGUS LEIS AN BHFEIDHMEANNAS\\n\\n3.1 R\u00e9amhr\u00e1\\n\\nIs \\\"r\u00e1iteas
  misin\\\" \u00e9 Strait\u00e9is ITL go dt\u00ed 2020 (uaillmhianta agus spriocanna
  leathana) a bheidh \u00e1 fhorl\u00edonadh ag timthriallacha plean\u00e1la strait\u00e9iseacha
  n\u00edos giorra.  T\u00e1 ''S\u00e1r PTF\u00ed'' f\u00e9ideartha molta bunaithe
  ar Dhr\u00e9achtstrait\u00e9is ITL go dt\u00ed 2020, agus iad ar f\u00e1il \u00f3
  mh\u00ed Ean\u00e1ir 2011.\\n\\n3.2 Sainmh\u00ednithe\\n\\nSula bhf\u00e9adfa\u00ed
  dul ar aghaidh le ''S\u00e1r PTF\u00ed'' a aithint, ba gh\u00e1 m\u00e9adraigh \u00e9ags\u00fala
  a shainmh\u00edni\u00fa go soil\u00e9ir.  Tugtar t\u00e1bla sainmh\u00ednithe th\u00edos
  mar a mhol an Feidhmeannas sa cheardlann ar an 14 Ean\u00e1ir, 2011.\\n\\n1 Uasfhad
  c\u00e9imeanna M\u00e1istir agus Docht\u00fara a fhaightear as Rialach\u00e1in Chl\u00e1r
  C\u00e9ime Taighde ITL, faofa ag an mBord Rialaithe, Meitheamh 2009.\\n\\n3.3 ''S\u00e1r
  PTF\u00ed'' Molta le haghaidh Strait\u00e9is an ITL go dt\u00ed 2020\\n\\nRinneadh
