  molt\u00f3ir\u00ed\\n\\nCeist 6 Pl\u00e9igh na cine\u00e1lacha cl\u00e1r seo th\u00edos
  leis an duine in aice leat n\u00f3 le do ghr\u00fapa. C\u00e9n cur amach at\u00e1
  agat ar na cl\u00e1ir seo? An dtaitn\u00edonn siad leat? C\u00e9n f\u00e1th? An
  bhfuil aon chine\u00e1l cl\u00e1r eile a bhfuil d\u00fail agat ann nach bhfuil ar
  an liosta seo?\\n\\ncl\u00e1r grinn\\ncl\u00e1r c\u00f3caireachta\\ncl\u00e1r d\u00falra\\ncl\u00e1r
  diosp\u00f3ireachta\\ncl\u00e1r cainte\\n\\nTreoracha agus Freagra\u00ed\\n\\nCeist
  1\\nT\u00e1 an cheist seo le d\u00e9anamh sula seinntear an tuairisc.\\n\\niomaitheoir\u00ed
  \u2013 competitors\\ncl\u00e1r faisn\u00e9ise \u2013 documentary\\ngl\u00f3r bre\u00e1
  l\u00e1idir \u2013 a good strong voice\\nthaifead s\u00ed \u2013 she recorded\\nbabhta
  ceannais \u2013 final\\n\u00e9isteacht \u2013 audition\\nfaiteach \u2013 shy\\nmisneach
  \u2013 courage\\nmolt\u00f3ir\u00ed \u2013 adjudicators\\n\\nCeist 2\\n1. Dh\u00e1
  bhliain \u00f3 shin fuair Mary Byrne an ch\u00e9ad \u00e1it ar an gcl\u00e1r ceoil
  Nollaig No.1 ar TG4.\\n2. Is duine de na iomaitheoir\u00ed sa gcl\u00e1r X Factor
  \u00ed.\\n3. Is as Baile Formaid, Baile \u00c1tha Cliath di agus t\u00e1 s\u00ed
  ag obair le Tesco Ireland.\\n4. Ba \u00e9 an ch\u00e9ad singil a d''eisigh s\u00ed
  n\u00e1 \u2018Si\u00fail leat\u2019 \u2013 leagan d\u00e1theangach den amhr\u00e1n
  \u2018You\u2019ll never walk alone\u2019.\\n5. Ocht gcl\u00e1r.\\n6. Beidh molt\u00f3ir\u00ed
  an chl\u00e1r Nollaig No.1, a clann agus a cairde faoi agallamh sa chl\u00e1r.\\n\\nCeist
  3\\n(a)\\n\\n|   |   |   |   |   |   |   |   |   |\\n|---|---|---|---|---|---|---|---|---|\\n|
  h | c | a | e | f | g | i | d | b |\\n\\n(b) Ceacht cainte \u00e9 seo.\\n\\nCeist
  4\\n(a)\\nm\u00e9 mise\\nt\u00fa tusa\\ns\u00e9 / \u00e9 seisean / eisean\\ns\u00ed
  / \u00ed sise / ise\\nmuid muidne / sinne\\nsibh sibhse\\nsiad /iad siadsan / iadsan\\n\\n(b)
  Iarr ar na foghlaimeoir\u00ed na forainmneacha a chur in abairt\u00ed.\\n\\nCeist
  5\\nIarr orthu na focail a chur in abairt\u00ed.\\n\\nCeist 6\\nIs f\u00e9idir gach
  beirt a chur ag d\u00e9anamh an phl\u00e9 seo agus ansin na ceisteanna a phl\u00e9
  leis an rang ioml\u00e1n.\\n\\n\u00c9imear N\u00ed Chonaola\\n\\nDh\u00e1 bhliain
  \u00f3 shin fuair Mary Byrne, an bhean as Baile \u00c1tha Cliath at\u00e1 ar dhuine
  de na hiomaitheoir\u00ed sa gcl\u00e1r X Factor, an ch\u00e9ad \u00e1it ar an gcl\u00e1r
  ceoil Nollaig No.1 ar TG4. T\u00e1 an st\u00e1isi\u00fan anois le cl\u00e1r faisn\u00e9ise
  speisialta \u2018A Star is Byrne \u2013 Sc\u00e9al Mary Byrne\u2019 a chr\u00e1oladh
  an mh\u00ed seo chuga\u00ednn agus ar an gcl\u00e1r beidh \u00e1bhair nach bhfachtas
  riamh cheana.\\n\\nEibhl\u00edn N\u00ed Choistealbha\\n\\nMary Byrne, bean as Baile
  \u00c1tha Cliath a bhfuil gl\u00f3r bre\u00e1 l\u00e1dir aici. Aithn\u00edonn an-chuid
  daoine \u00ed anois \u00f3n gcl\u00e1r X Factor ach bhain Mary, oibr\u00ed Tesco
  as Baile Formaid, c\u00e1il amach roimhe seo nuair a bhuaigh s\u00ed an ch\u00e9ad
  \u00e1it ar an gcl\u00e1r ceoil Nollaig No.1 ar TG4, dh\u00e1 mhile is a hocht.\\n\\n\u2018Chuir
  t\u00fa do chro\u00ed agus d\u2019anam isteach sa gour i l\u00e1thair sin.\u2019\\n\\nMar
  thoradh, th\u00e1ifead s\u00ed a c\u00e9ad singil \u2018Si\u00fail leat\u2019 \u2013
  leagan d\u00e1theangach\u00b9 den amhr\u00e1n \u2018You\u2019ll never walk alone\u2019.
  Anois t\u00e1 TG4 le cl\u00e1r faisn\u00e9ise \u2018A Star is Byrne \u2013 Sc\u00e9al
  Mary Byrne\u2019 a chr\u00e1oladh, cl\u00e1r a bheas faoi na himeachtai a bhain
  id go dt\u00ed gur bhuaigh s\u00ed babhta ceannais Nollaig No.1.\\n\\nM\u00e1ire
  N\u00ed Chonl\u00e1n, Eagarth\u00f3ir Coimisi\u00fanaithe\\n\\nOcht gcl\u00e1r ar
  fad a bh\u00ed sa tsraith\u00b2 ina raibh s\u00ed ann, sa bhliain 2008. T\u00e1
  go leor p\u00edosa\u00ed breise nach bhfachtas riamh cheana. Ise, fi\u00fa amh\u00e1in,
  ag teacht isteach don ch\u00e9ad uair riamh, \u00ed chomh imn\u00edoch, chomh faiteach,
  ag teacht isteach an doras don ch\u00e9ad \u00e9isteacht a rinne\u00b3 s\u00ed riamh
  cheana. Feicfidh t\u00fa an dul chun cinn a rinne s\u00ed, feicfidh t\u00fa na hamhr\u00e1in
  agus feicfidh t\u00fa an misneach a thug an tsraith seo di.\\n\\nEibhl\u00edn N\u00ed
  Choistealbha\\n\\nBeidh agallaimh le molt\u00f3ir\u00ed Nollaig No.1, le clann agus
  le caird\u00e9 Mary ar \u2018A Star is Byrne \u2013 Sc\u00e9al Mary Byrne\u2019
  a chr\u00e1olfar ar TG4, ar an nao\u00fa l\u00e1 de mh\u00ed na Nollag. Eibhl\u00edn
  N\u00ed Choistealbha, Nuacht TG4.\\n\\n\u00b9 leagan dh\u00e1theangach a deirtear\\n\u00b2
  an sr\u00e1ith a deirtear\\n\u00b3 a ndearn\u00e1 s\u00ed a deirtear\"", "\"Gheofar
  breis eolais ar sh\u00e1bh\u00e1ilteacht \u00f3 dh\u00f3ite\u00e1in \u00f3n Oifigeach
  Coiscthe D\u00f3ite\u00e1in i do cheantar\\n\\nAn Sti\u00farth\u00f3ireacht N\u00e1isi\u00fanta
  um Bainist\u00edocht D\u00f3ite\u00e1n agus \u00c9igeand\u00e1lai\\nAn Roinn Comhshaoil,
  Pobail agus Rialtais \u00c1iti\u00fail\\nTeach an Chustaim\\nBaile \u00c1tha Cliath
  1.\\nwww.environ.ie/en/LocalGovernment/FireSafety\\n\\nI gc\u00e1s d\u00f3ite\u00e1in:\\n\\n1.
  Amach as an teach!\\n2. Cuir fios ar an mbriog\u00e1id d\u00faite\u00e1in...\\n3.
  Fan taobh amuigh!\\n\\nS\u00e1bh\u00e1iteacht \u00f3 Dh\u00f3ite\u00e1in ag baile\\n\\nM\u00daCH\\n\\nAit
  Choinne\\nPlean Ealaithe \u00f3 Dh\u00f3ite\u00e1in\\n\\nFeidhmeannacht na Seirbh\u00edse
  Sl\u00e1inte\\nHealth Service Executive\\n\\nIn \u00e9igeand\u00e1il diailih 999
  n\u00f3 112\\n\\nN\u00e1 d\u00e9an moill, d\u00e9an beart inniu!\\nCeithre riail
  \u00f3ir le bheith s\u00e1bh\u00e1ilte \u00f3 dh\u00f3ite\u00e1in ag baile\\n\\n1.
  Biodh al\u00e1ram deataigh agat. Seice\u00e1il \u00e9 go tr\u00e1thrialta le bheith
  cinnte go bhfuil s\u00e9 ag obair.\\n\\n2. Ceap plean \u00e9alaithe \u00f3 dh\u00f3ite\u00e1in
  agus cuir an plean i ngn\u00edomh go tr\u00e1thrialta.\\n\\n3. F\u00e9ach an bhfuil
  aon bhaol d\u00f3ite\u00e1in sa teach agus m\u00e1 t\u00e1, cuir ina cheart \u00e9.\\n\\n4.
  Biodh gn\u00e1thamh agat de \u2018ruda\u00ed le seice\u00e1il roimh dhul a lu\u00ed\u2019.\\n\\n1
  S\u00e1bh\u00e1iteacht \u00f3 Dh\u00f3ite\u00e1in ag baile\\n\\nB\u00edodh al\u00e1ram
  deataigh agat. Seice\u00e1il \u00e9 go tr\u00e1thrialta le bheith cinnte go bhfuil
  s\u00e9 ag obair\\n\\n\u2022 Feistigh al\u00e1raim dheataigh inniu agus d\u00e9an
  deimhin de go bhfuil siad ag obair agus nach bhfuil aon locht orthu. Gheobhaidh
  t\u00fa rabhadh \u00f3 al\u00e1ram deataigh m\u00e1 bhonn d\u00f3ite\u00e1n ann.\\n\\nCuimhnigh:
  N\u00ed bhfaighidh t\u00fa boladh d\u00f3ite\u00e1in agus t\u00fa i do chodladh
  agus coime\u00e1dfaidh an deatach i do chodladh thu.\\n\\n\u2022 M\u00e1 t\u00e1
  bodhar sa teach, n\u00f3 duine a bhfuil deacrachtai \u00e9isteachta aici/aige, seans
  nach gcloisfidh siad an rabhadh \u00f3n al\u00e1ram deataigh, m.sh. m\u00e1s amhlaidh
  nach gcaitheann s\u00ed/s\u00e9 \u00e1is \u00e9isteachta isto\u00edche. T\u00e1
  al\u00e1raim dheataigh le ceannach a \u00fas\u00e1ideann str\u00f3ibshoilse n\u00f3
  pill\u00edn\u00ed creathacha chun rabhadh a thabhairt i gc\u00e1s d\u00f3ite\u00e1in.
  Is fearr na hal\u00e1raim sin do dhaoinne a bhf\u00e9adfadh s\u00e9 bheith deacair
  orthu gn\u00e1thal\u00e1ram deataigh a chloiste\u00e1il.\\n\\n\u2022 Is f\u00e9idir
  al\u00e1ram deataigh a th\u00e1sta\u00edl tr\u00edd an gcnaipe t\u00e1st\u00e1la
  a bhr\u00fa le barr hanla na scuaibe.\\n\\nCuir batair\u00ed nua i gc\u00e1s gn\u00e1thal\u00e1raim,
  uair sa bhliain, n\u00f3 a luaite a chloiseann t\u00fa an b\u00edb rabhaidh.\\n\\n\u2022
  M\u00e1 t\u00e1 al\u00e1ram deataigh 10 mbliana agat n\u00ed m\u00f3r al\u00e1ram
  nua a cheannach gach 10 mbliana.\\n\\n\u2022 B\u00edodh ar a laghad al\u00e1ram
  deataigh amh\u00e1in agat ar gach url\u00e1r sa teach. Feistigh iad idir na h\u00e1iteanna
  codlata agus an chistin agus na seomr\u00e1\u00ed teaghlaigh \u2013 ceann sa halla
  ar an mbunurl\u00e1r, agus ceann ar gach leibh\u00e9al os a chionn sin, ar an gceann
  staighre. Chun an chosaint a mh\u00e9ad\u00fa, d\u2019fh\u00e9adfa\u00ed al\u00e1ram
  a fheisti\u00fa chomh maith sa seomra suite agus sa chistin, i seomra\u00ed leapa
  ina gcodla\u00edonn daoine leochaileacha, n\u00f3 mar a bhfuil teilif\u00eds\u00e9an
  n\u00f3 gl\u00e9as m\u00f3r leictreach (r\u00edomhaire, mar shampla). (Bheadh al\u00e1raim
  theasa n\u00edos fearr in \u00e1iteanna mar a bhf\u00e9adfadh deatach \u00f3 ch\u00f3caireacht
  n\u00f3 \u00f3 thoit\u00edn\u00ed n\u00f3 \u00f3 thine oscailte an t-al\u00e1ram
  a ghn\u00edomhacht\u00fa gan chu\u00eds.)\\n\\n\u2022 B\u00edodh al\u00e1raim dheataigh
  feistithe den ts\u00edle\u00e1il de r\u00e9ir threoracha an d\u00e9ant\u00f3ra.\\n\\n\u2022
  Glan an t-al\u00e1ram go rialta leis an bhfol\u00fasghlant\u00f3ir agus cuimil an
  cl\u00fadach. M\u00e1 bhonn an iomarca deannaigh in al\u00e1ram cuireann s\u00e9
  as feidhm \u00e9.\\n\\nIn \u00e9igeand\u00e1il dial\u00edgh 999 n\u00f3 112\\n\\nCeap
  plean \u00e9alaithe \u00f3 dh\u00f3ite\u00e1n agus cuir an plean i ngn\u00edomh
  go tr\u00e1thrialta\\n\\nPlean \u00e9alaithe \u00f3 dh\u00f3ite\u00e1n:\\nSeo na
  ruda\u00ed ba ch\u00f3ir a dh\u00e9anamh i gc\u00e1s d\u00f3ite\u00e1in\\n\\n\u2022
  B\u00edodh an tsl\u00ed isteach agus amach as an teach glan i gc\u00f3na\u00ed.\\n\\n\u2022
  Is cuma cib\u00e9 an t\u00fa f\u00e9in a thugann an d\u00faite\u00e1n faoi deara
  n\u00f3 al\u00e1ram deataigh a thugann rabhadh duit, n\u00e1 b\u00edodh eagla ort
  ach cuir do phlean \u00e9alaithe \u00f3 dh\u00f3ite\u00e1n i bhfeidhm.\\n\\n\u2022
  Tabhair an gh\u00e1ir dh\u00f3ite\u00e1in. D\u00faisigh gach duine agus f\u00e1gaig\u00ed
  an teach ar an tsl\u00ed is tap\u00fala. Cabhr\u00e1igh leis na daoine is \u00f3ige
  agus le duine ar bith at\u00e1 leochaileach.\\n\\n\u2022 Seice\u00e1il na doirse
  le c\u00fal do l\u00e1imhe n\u00e1 hoscaill iad m\u00e1 bhraitheann t\u00fa teas
  uathu. Cialla\u00edonn an teas go bhfuil tine ar an taobh thall den doras. N\u00e1
  hoscaill ach na doirse sin is g\u00e1 chun gach duine a ligean amach as an teach.\\n\\n\u2022
  M\u00e1 t\u00e1 deatach ann t\u00e9igh s\u00edos ar an url\u00e1r agus sn\u00e1mh
  amach as an teach in aice an url\u00e1ir mar is ansin is glaine a bheas an t-aer.\\n\\n\u2022
  N\u00e1 t\u00e9igh ag fiosr\u00fa c\u00fais an d\u00faite\u00e1in.\\n\\n\u2022 Cruinnigh
  le ch\u00e9ile ag \u00e1it choinne lasmuigh den teach agus b\u00ed cinnte go bhfuil
  gach duine amuigh.\\n\\n\u2022 Glaoigh ar an tSeirbh\u00eds D\u00f3ite\u00e1in ag
  999 n\u00f3 112 \u00f3 bhosca f\u00f3in, \u00f3 fh\u00f3n p\u00f3ca n\u00f3 \u00f3
  theach comharsan.\\n\\n\u2022 N\u00e1 t\u00e9igh isteach sa teach ar\u00eds go dt\u00ed
  go ndeir an tSeirbh\u00eds D\u00f3ite\u00e1in leat go bhfuil s\u00e9 s\u00e1bh\u00e1lte.\\n\\nI
  gc\u00e1s d\u00f3ite\u00e1in:\\n\\n1. Amach as an teach!\\n2. Cuir fios ar an mbriog\u00e1id
  d\u00faite\u00e1in...\\n3. Fan taobh amuigh!\\n\\nS\u00e1bh\u00e1iteacht \u00f3
  Dh\u00f3ite\u00e1in ag baile\\n\\n3 F\u00e9ach an bhfuil aon bhaol d\u00f3ite\u00e1in
  sa teach agus m\u00e1 t\u00e1, cuir ina cheart \u00e9\\n\\nIs fearr i bhfad d\u00f3ite\u00e1n
  a chosc n\u00e1 a throid\\n\\n\u2022 Seice\u00e1il d\u2019\u00e1it ch\u00f3naithe
  seomra i ndiaidh seomra f\u00e9achaint an bhfuil aon bhaol d\u00f3ite\u00e1in iontu
  agus cuir ina cheart \u00e9 m\u00e1 t\u00e1.\\n\\nCuimhnigh: is sa seomra su\u00ed,
  i seomra codlata n\u00f3 sa chistin fad a bh\u00edonn daoine ina gcodladh a thosa\u00edonn
  formh\u00f3r na nd\u00f3ite\u00e1n.\\n\\n\u2022 An Chistin\\n\\n\u2022 Cuir blainc\u00e9ad
  d\u00f3ite\u00e1in agus m\u00facht\u00f3ir d\u00f3ite\u00e1in in aice l\u00e1imhe
  sa chistin agus b\u00ed in ann iad a \u00fas\u00e1id.\\n\\nAgus t\u00fa ag c\u00f3caireacht,
  \u00fas\u00e1id na f\u00e1inn\u00ed c\u00fail ar an sorn ar dt\u00fas. Iompaigh
  hanla\u00ed na s\u00e1span timpeall ionas nach mbeidh siad suite os cionn f\u00e1inn\u00ed
  eile.\\n\\n\u2022 Coime\u00e1d an sorn glan \u2013 baol d\u00f3ite\u00e1in is ea
  gr\u00e9isc.\\n\\n\u2022 M\u00fach an sorn mura bhfuil s\u00e9 in \u00fas\u00e1id.\\n\\n\u2022
  N\u00e1 h\u00fas\u00e1id sorn riamh chun \u00e9ada\u00ed a thriom\u00fa.\\n\\n\u2022
  Seice\u00e1il go bhfuil an sorn m\u00fachta i gceart sula dt\u00e9ann t\u00fa don
  leaba.\\n\\n\u2022 Glan an scagaire sa bhfean eastarraingthe go rialta agus cuir
  scagaire nua isteach ann nuair is g\u00e1.\\n\\n\u2022 N\u00e1 h\u00fas\u00e1id
  panna sceall\u00f3g; is baol m\u00f3r d\u00f3ite\u00e1in iad.\\n\\nIn \u00e9igeand\u00e1il
  dial\u00edgh 999 n\u00f3 112\\n\\nN\u00e1 h\u00fas\u00e1id panna sceall\u00f3g;
  is m\u00f3r an baol d\u00f3ite\u00e1in iad. M\u00e1 \u00fas\u00e1ideann t\u00fa
  panna sceall\u00f3g, b\u00ed f\u00edor-ch\u00faramach leis.\\n\\n\u2022 N\u00e1
  b\u00edodh n\u00edos m\u00f3 n\u00e1 aon trian den phanna l\u00e1n d\u2019ola n\u00f3
  de shaill.\\n\u2022 T\u00e1st\u00e1il teocht na hola tr\u00ed ph\u00edosa beag ar\u00e1in
  a chur sa phanna. M\u00e1 bhriosca\u00edonn s\u00e9 go tapa, t\u00e1 an ola r\u00e9idh
  le h\u00fas\u00e1id.\\n\u2022 M\u00e1 thagann deatach amach as an ola, cialla\u00edonn
  sin go bhfuil s\u00ed r\u00f3-the. M\u00fach an teas agus lig don ola fuar\u00fa
  sula dtosa\u00edonn t\u00fa ar\u00eds.\\n\u2022 N\u00e1 f\u00e1g an seomra riamh
  fad a bh\u00edonn an panna sceall\u00f3g in \u00fas\u00e1id.\\n\u2022 N\u00e1 corraigh
  panna sceall\u00f3g riamh fad a bh\u00edonn s\u00e9 te.\\n\u2022 M\u00e1 t\u00e1
  domhainfhriocht\u00f3ir in \u00fas\u00e1id agat, folmhaigh \u00e9 agus st\u00f3r\u00e1il
  \u00e9 tar \u00e9is an phloc\u00f3id a bhaint amach agus ligean don ghl\u00e9as
  fuar\u00fa.\\n\\nFearais leictreacha \u2013 b\u00ed c\u00faramach agus t\u00fa \u00e1
  n-\u00fas\u00e1id agus st\u00f3r\u00e1il i gceart iad nuair nach bhfuil siad in
  \u00fas\u00e1id.\\n\\n\u2022 N\u00e1 cuir l\u00edon m\u00f3r ploc\u00f3id\u00ed
  isteach san aon soic\u00e9ad amh\u00e1in. Baol m\u00f3r d\u00f3ite\u00e1in \u00e9
  sin.\\n\u2022 N\u00e1 b\u00edodh c\u00e1bla n\u00f3 sreang leictreach ag trasn\u00fa
  os cionn an tsoirn.\\n\u2022 M\u00fach aon ghl\u00e9as leictreach agus tarraing
  amach an phloc\u00f3id nuair nach bhfuil s\u00e9 in \u00fas\u00e1id.\\n\u2022 M\u00e1
  t\u00e1 c\u00e1bla\u00ed n\u00f3 ploc\u00f3id\u00ed dam\u00e1istithe, caite n\u00f3
  ag sceitheadh, n\u00e1 h\u00fas\u00e1id an fearas ach cuir glao ar leictreoir c\u00e1ilithe.\\n\\nTine
  oscailte sa seomra su\u00ed\\n\\n\u2022 B\u00edodh sciath thine ceart agat os comhair
  na tine m\u00e1s tine oscailte \u00ed.\\n\u2022 N\u00e1 cuir rud ar bith riamh ar
  an sciath thine.\\n\\nS\u00e1bh\u00e1iteacht \u00f3 Dh\u00f3ite\u00e1in ag baile\\n\\n-
  N\u00e1 f\u00e1g rud ar bith at\u00e1 ind\u00f3ite, leith\u00e9id\u00ed p\u00e1ip\u00e9in,
  iris\u00ed n\u00f3 \u00e9ada\u00ed, in aice tine.\\n- N\u00e1 triomaigh \u00e9ada\u00ed
  riamh os comhair tine oscailte. Baol m\u00f3r d\u00f3ite\u00e1in \u00e9 sin.\\n\\nCoime\u00e1d
  an siml\u00e9ar glan\\n\\n- Cuir an siml\u00e9ar \u00e1 ghlanadh go rialta \u2013
  lean an treoir seo:\\n  - Tinte d\u00faite adhmaid: ceithre uair sa bhliain nuair
  a bh\u00edonn siad in \u00fas\u00e1id.\\n  - Tinte breosla solada\u00ed: uair sa
  bhliain m\u00e1 t\u00e1 breosla gan toit in \u00fas\u00e1id agat.\\n  - Tinte breosla
  solada\u00ed: faoi dh\u00f3 sa bhliain m\u00e1 t\u00e1 gual in \u00fas\u00e1id agat.\\n  -
  Tinte ola: uair sa bhliain.\\n  - Tinte g\u00e1is: uair sa bhliain m\u00e1s tinte
  iad a mb\u00edonn scuabadh de dh\u00edth orthu.\\n\\nT\u00e9itheoir\u00ed iniompartha\\n\\n-
  B\u00ed an-ch\u00faramach agus t\u00e9itheoir iniompartha in \u00fas\u00e1id agat.\\n-
  B\u00edodh t\u00e9itheoir\u00ed i bhfad amach \u00f3 throsc\u00e1n, \u00f3 chuirt\u00edn\u00ed
  agus \u00f3 ruda\u00ed ind\u00f3ite.\\n- N\u00e1 corraigh t\u00e9itheoir nuair a
  bh\u00edonn s\u00e9 ar si\u00fal/lasta.\\n- M\u00fach t\u00e9itheoir agus bain amach
  an phloc\u00f3id sula bhf\u00e1gann t\u00fa an teach, n\u00f3 sula dt\u00e9ann t\u00fa
  a lu\u00ed.\\n\\nCoinnle\\n\\n- B\u00edodh an coinneal i seast\u00e1n ceart i gc\u00f3na\u00ed.\\n-
  N\u00e1 cuir coinnle gar do ruda\u00ed ind\u00f3ite, leith\u00e9id\u00ed cuirt\u00edn\u00ed,
  \u00e9ada\u00ed n\u00f3 \u00e9ada\u00ed leapa.\\n- N\u00e1 t\u00e9igh amach as an
  seomra fad a bh\u00edonn coinneal ar lasadh agat.\\n- N\u00e1 b\u00edodh coinneal
  gar do sh\u00e9ide\u00e1n.\\n- N\u00e1 corraigh coinneal agus \u00ed ar lasadh.\\n-
  B\u00ed cinnte go m\u00fachta\u00edr gach coinneal i gceart sula bhf\u00e1gann t\u00fa
  an teach n\u00f3 sula dt\u00e9ann t\u00fa a lu\u00ed.\\n\\nIn \u00e9igeand\u00e1il
  diailigh 999 n\u00f3 112\\n\\nCaitheamh Tobac\\n\\n\u2022 N\u00e1 caith riamh nuair
  a bh\u00edonn fonn codlata ort, b\u00edodh s\u00e9 sa leaba n\u00f3 i gcathaoir.\\n\\n\u2022
  Baol m\u00f3r d\u00f3ite\u00e1in is ea caitheamh nuair a bh\u00edonn tuirse ort.
  Cuimhnigh gur f\u00e9idir le halc\u00f3l n\u00f3 c\u00f3gais fonn codlata a chur
  ort. Cuimhnigh: is f\u00e9idir le halc\u00f3l n\u00f3 c\u00f3gais fonn codlata a
  chur ort.\\n\\n\u2022 Bain \u00fas\u00e1id as luaithread\u00e1n i gc\u00f3na\u00ed
  nuair a chaitheann t\u00fa.\\n\\n\u2022 Caith amach a bhfuil sna luaithread\u00e1in
  roimh dhul a lu\u00ed duit. Cuir an luaithread\u00e1n faoin sconna uisce ar dt\u00fas
  le bheith cinnte go bhfuil gach rud ann m\u00fachta.\\n\\nSeomra leapa\\n\\n\u2022
  N\u00e1 caith riamh sa seomra codlata.\\n\\n\u2022 B\u00edodh t\u00f3irse in aice
  na leapa agat mar sholas \u00e9igeand\u00e1la.\\n\\n\u2022 B\u00edodh an f\u00f3n
  p\u00f3ca sa seomra codlata ar eagla \u00e9igeand\u00e1la.\\n\\n\u2022 B\u00ed an-ch\u00faramach
  agus gl\u00e9asanna leictreacha, leith\u00e9id\u00ed luchtair\u00ed f\u00f3n p\u00f3ca
  agus triomad\u00f3ir\u00ed gruaige, in \u00fas\u00e1id agat. Bain amach an phlocc\u00f3id
  nuair a bh\u00edonn t\u00fa r\u00e9idh leo agus lig d\u00faibh fuar\u00fa sula gcuireann
  t\u00fa as bealach iad.\\n\\nCuimhnigh: n\u00e1 f\u00e1g aon trealamh leictreach
  plug\u00e1ilte isteach n\u00f3 ag lucht\u00fa agus t\u00fa sa leaba n\u00f3 as an
  teach. I gceist anseo t\u00e1 f\u00f3n ph\u00f3ca, c\u00e1bla\u00ed f\u00f3n p\u00f3ca,
  d\u00edritheoir\u00ed gruaige agus mar sin de.\\n\\nBlainc\u00e9ad Leictreach\\n\\n-
  L\u00e9igh treoracha an d\u00e9ant\u00f3ra agus \u00fas\u00e1id an blainc\u00e9ad
  d\u00e1 r\u00e9ir.\\n- F\u00e9ach c\u00fapla uair sa bhliain an bhfuil an blainc\u00e9ad
  caite n\u00f3 dam\u00e1istithe.\\n- Rollaigh blainc\u00e9ad leictreach agus t\u00fa
  \u00e1 st\u00f3r\u00e1il, n\u00e1 fill \u00e9.\\n- Iarr ar leictreoir n\u00f3 siopa
  leictreora go tr\u00e1thrialta an blainc\u00e9ad a sheice\u00e1il duit.\\n\\nAn
  mbeadh a fhios agat \u00e9 d\u00e1 mbeadh an blainc\u00e9ad leictreach dains\u00e9arach?\\n\\nCeannaigh
  blainc\u00e9ad nua m\u00e1s amhlaidh:\\n\\n- go bhfuil an fhabrac\u00ed n\u00f3
  an fhleisc caite n\u00f3 sceite\\n- go bhfuil marcanna d\u00f3ite in \u00e1it ar
  bith air\\n- go bhfuil na t\u00e9ipeanna ceangail (m\u00e1s ann d\u00f3ibh) dam\u00e1istithe
  n\u00f3 ar iarraidh\\n- go bhfuil aon cheangal scaoilte\\n- go bhfuil amhras ar
  bith ort!\\n\\n- Deisigh an phloc\u00f3id n\u00f3 an seol\u00e1n srutha m\u00e1
  t\u00e1 s\u00e9 dam\u00e1istithe.\\n- B\u00ed cinnte go m\u00fachann t\u00fa agus
  go mbaineann t\u00fa amach ploc\u00f3id an bhlainc\u00e9id leictrigh sula dt\u00e9ann
  t\u00fa a chodladh.\\n\\nS\u00e1bh\u00e1iteacht \u00f3 Dh\u00f3ite\u00e1in ag baile\\n\\n4
  B\u00edodh gn\u00e1thamh agat de \u2018ruda\u00ed le seice\u00e1il roimh dhul a
  lu\u00ed\u2019\\n\\n\u2022 Sula dt\u00e9ann t\u00fa a lu\u00ed isto\u00edche:\\n  \u2022
  Seice\u00e1il go bhfuil an sorn m\u00fachta i gceart sula dt\u00e9ann t\u00fa don
  leaba.\\n  \u2022 M\u00e1s g\u00e1 eochair chun an pr\u00edomhdhoras n\u00f3 an
  c\u00faldoras a oscailt, b\u00edodh na heochracha gar do na doirse, in \u00e1it
  is eol don uile dhuine sa teach.\\n  \u2022 B\u00ed cinnte go bhfuil an tine ag
  dul i l\u00e9ig agus cuir sciath thine os comhair tinte oscailte\\n  \u2022 N\u00e1
  f\u00e1g teilif\u00eds, raidi\u00f3 n\u00f3 c\u00f3ras ceoil ar fuireachas. Fearais
  at\u00e1 ceaptha d\u2019\u00fas\u00e1id 24 uair sa l\u00e1, leith\u00e9id\u00ed
  cuisneoir\u00ed agus reoiteoir\u00ed, agus iad sin amh\u00e1in a ba cheart a bheith
  plug\u00e1ilte isteach isto\u00edche.\\n  \u2022 D\u00edphlug\u00e1il an luchtaire
  f\u00f3n p\u00f3ca mura bhfuil s\u00e9 in \u00fas\u00e1id agat, gach uair d\u00e1
  bhf\u00e1gann t\u00fa an teach n\u00f3 d\u00e1 dt\u00e9ann t\u00fa a lu\u00ed.\\n  \u2022
  B\u00ed cinnte go m\u00fachann t\u00fa agus go mbaineann t\u00fa amach ploc\u00f3id
  an bhlainc\u00e9id leictrigh sula dt\u00e9ann t\u00fa a chodladh.\\n  \u2022 Caith
  amach a bhfuil sna luaithread\u00e1in roimh dhul a lu\u00ed duit.\\n\\nS\u00e1bh\u00e1ilteacht
  \u00f3 Aonocsa\u00edd Charb\u00f3in\\n\\nCad is Aonocsa\u00edd Charb\u00f3in (CO)
  ann?\\n\\nG\u00e1s gan dath gan bholadh is ea aonocsa\u00edd charb\u00f3in (ar a
  dtugtar CO, leis). Tuairim is leath de na daoine a fhagheann b\u00e1s de nimhi\u00fa
  CO neamhbheartaithe, is de dheatach \u00f3 thine a anal\u00fa a fhagheann siad b\u00e1s.
  Ach munar leor an t-aer chun an breosla a dh\u00f3, n\u00f3 m\u00e1 t\u00e1 locht
  ar an bhfearas t\u00e9imh, d\u2019fh\u00e9adf\u00e1\u00ed aonocsa\u00edd charb\u00f3in
  a th\u00e1irgeadh.\\n\\n1. Comhartha\u00ed d\u2019aonocsa\u00edd charb\u00f3in:
  D\u2019fh\u00e9adfadh na comhartha\u00ed seo a leanas d\u2019aonocsa\u00edd charb\u00f3in
  a bheith le sonr\u00fa timpeall an t\u00ed agus i seomra\u00ed mar a bhfuil fearas
  t\u00e9imh n\u00f3 c\u00f3caireachta.\\n\\n- Sm\u00e1l\u00fa, s\u00faiche n\u00f3
  d\u00eddhath\u00fa in aice an fhearas t\u00e9imh agus gar do ghaothair\u00ed.\\n-
  Comhdhl\u00fath\u00fa ar bhalla\u00ed agus ar fhuinneoga, agus boladh aisteach nuair
  a bh\u00edonn an fearas in \u00fas\u00e1id.\\n- Lasair bhu\u00ed n\u00f3 or\u00e1iste
  nuair is lasair ghorm a bh\u00edonn ann de ghn\u00e1th i gc\u00e1s fearas g\u00e1is.\\n-
  Bloc\u00e1il i siml\u00e9ar n\u00f3 i m\u00fach\u00e1n.\\n- Dam\u00e1iste ar bith
  d\u2019fhearas n\u00f3 do mh\u00fach\u00e1n n\u00f3 in aice leo.\\n\\n2. Seirbh\u00eds\u00ed\u00fa
  agus cothabh\u00e1il rialta: An ch\u00fais is coitianta le haonocsa\u00edd charb\u00f3in
  a bheith \u00e1 th\u00e1irgeadh n\u00e1 fearais lochtacha, fearais nach gcothabh\u00e1ltear
  go tr\u00e1thrialta agus gaothair\u00ed, m\u00fach\u00e1in agus siml\u00e9ara bloc\u00e1ilte.
  T\u00e1 s\u00e9 t\u00e1bhachtach go nd\u00e9anfadh Suite\u00e1la\u00ed Cl\u00e1raithe
  seirbh\u00eds\u00ed\u00fa bliant\u00fail ar choir\u00ed ola agus g\u00e1is. Larr
  ar do theicneoir seirbh\u00edse gach gaothaire aer\u00ed, siml\u00e9ar agus m\u00fach\u00e1n
  a sheice\u00e1il f\u00e9achaint an bhfuil siad saor \u00f3 bhoc\u00e1il, istigh
  agus amuigh, agus chun an m\u00e9id aer\u00ed \u00fas \u00e1ta ar c\u00farsa\u00edocht
  sna seomra\u00ed a mh\u00e9ad\u00fa.\\n\\n3. Al\u00e1raim Aonocsa\u00edd Charb\u00f3in:
  Ba cheart al\u00e1raim aonocsa\u00edde charb\u00f3in a shuite\u00e1il de r\u00e9ir
  threoracha an d\u00e9ant\u00f3ra maidir le suite\u00e1il agus su\u00edomh. Fearais
  rabhaidh is ea al\u00e1raim CO agus n\u00ed ruaigeann siad CO. Ceannaigh al\u00e1ram
  CO nua nuair a bh\u00edonn an tr\u00e9imhse fheidhme istigh, gheofar an d\u00e1ta
  c\u00fa\u00ed ar an t\u00e1irge.\\n\\nGheofar eolas breise ar sh\u00e1bh\u00e1ilteacht
  ar aonocsa\u00edd charb\u00f3in ar www.carbonmonoxide.ie n\u00f3 Glaoigh ar: 1850
  79 79 79.\\nL\u00ednte ar oscailt: 8am go 8pm Luan go hAoine. 9am go 5.30pm D\u00e9
  Sathairn\\n\\nGo raibh maith agat as an t-am a chaitheamh ag l\u00e9amh an leabhr\u00e1in
  seo mar gheall ar sh\u00e1bh\u00e1ilteacht \u00f3 dh\u00f3ite\u00e1in ag baile.
  T\u00e1 s\u00fail againn go bhfuil t\u00fa n\u00edos eol\u00e1\u00ed ar sh\u00e1bh\u00e1ilteacht
  \u00f3 dh\u00f3ite\u00e1in d\u00e1 bharr.\\n\\nN\u00e1 d\u00e9an moill, d\u00e9an
  beart inniu!\\n\\nIartrar ort s\u00e1bh\u00e1ilteacht \u00f3 dh\u00f3ite\u00e1in
  a chur chun cinn anois ag baile leis an eolas seo ar do shon f\u00e9n agus ar son
  do theaghl\u00e1igh.\\n\\nSeicliosta s\u00e1bh\u00e1ilteacht \u00f3 dh\u00f3ite\u00e1in\\n\\nBa
  cheart go mbeife\u00e1 in ann T\u00c1 a thice\u00e1il i gc\u00e1s gach ceann de
  na r\u00e1itis s\u00e1bh\u00e1ilteachta seo a leanas.\\n\\nMuna bhfuil, d\u00e9an
  beart agus tice\u00e1il an bosca cu\u00ed nuair a bheidh an beart d\u00e9anta agat.\\n\\nMuna
  bhfuil t\u00fa cinnte cad ba cheart a dh\u00e9anamh, f\u00e9ach an leabhr\u00e1n.\\n\\n|
