  l\u00e9inn\\n14. Coibhneas luach trealamh TF/Oideachais > 3 bliana: < 3 bliana\\n15.
  % sp\u00e1s praitici\u00fail teagaisc\\n\\n16. Infheist\u00edocht i mBonneagar\\n\\nBuis\u00e9ad
  bliant\u00fail caipiti\u00fail\\n\\nBuis\u00e9ad bliant\u00fail cothabh\u00e1la\\n\\n17.
