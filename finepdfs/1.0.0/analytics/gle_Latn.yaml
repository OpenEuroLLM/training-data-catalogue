  Sin a d\u00fairt John Boyne faoina leabhar c\u00e1ili\u00fail, *The Boy in the Striped
  Pyjamas*. Thosaigh s\u00e9 ag scriobh maidin D\u00e9 C\u00e9adaoin agus bh\u00ed
  s\u00e9 criocnaithe ag am l\u00f3in D\u00e9 hAoine!\\n\\n2. Taitn\u00edonn an leabhar
  go m\u00f3r le daoine \u00f3ga agus le daoine f\u00e1sta. T\u00e1 n\u00edos m\u00f3
  n\u00e1 c\u00faig mbhilli\u00fan c\u00f3ip den leabhar seo diolta cheana f\u00e9in.
  T\u00e1 s\u00e9 ar f\u00e1il ina l\u00e1n teangacha eile freisin. Rinneadh scann\u00e1n
  de a bhuaigh an-chuid gradam.\\n\\n3. Chaith John Boyne seachtain san ospid\u00e9al
  nuair a bh\u00ed s\u00e9 deich mbliana d\u2019aois. Thug a mh\u00e1thair *The Magician\u2019s
  Nephew* le C.S. Lewis d\u00f3 le l\u00e9amh. Sular fh\u00e1g s\u00e9 an t-ospid\u00e9al
  bh\u00ed na leabhair go l\u00e9ir faoi Narnia l\u00e9ite aige!\\n\\n4. Bh\u00edodh
  s\u00e9 i gc\u00f3nai ag scriobh nuair a bh\u00ed s\u00e9 \u00f3g. Theastaigh uaidh
  a bheith ina scribhneoir. Is bre\u00e1 leis anois a bheith ag caint le p\u00e1ist\u00ed
  scoile faoin leabhar *The Boy in the Striped Pyjamas*, agus faoin l\u00e9itheoireacht
  agus faoin scribhneoireacht.\\n\\n5. Rugadh John Boyne i mBaile \u00c1tha Cliath
  i 1971. Rinne s\u00e9 st\u00e1id\u00e9ar ar litriocht an Bh\u00e9arla i gCol\u00e1iste
  na Trion\u00f3ide. Foilsiodh a ch\u00e9ad \u00farsc\u00e9al, *The Thief of Time*,
  sa bhliain 2000. T\u00e1 seacht n-\u00farsc\u00e9al agus seacht\u00f3 gearrsc\u00e9al
  scr\u00edofa aige go dt\u00ed seo.\\n\\n(i) C\u00e1 fhad a th\u00f3g s\u00e9 ar
  John Boyne an leabhar *The Boy in the Striped Pyjamas* a scriobh? (Alt 1)\\n\\n(ii)
