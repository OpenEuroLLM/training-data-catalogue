  &= 60 \\\\text{ m}^2\\n\\\\end{align*}\\n\\\\]\\n\\n14. Tarraingi\u00f3dh an cruth
  ar dheis ar ph\u00e1ip\u00e9ar poncaithe aon cheintim\u00e9adar.\\n\\nAimsigh achar
  an chrutha sc\u00e1thaithe.\\n\\n15. T\u00e1 seacht dt\u00edil ag Gear\u00f3id.\\n\\nIs
