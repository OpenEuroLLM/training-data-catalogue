  CEIMIC GCE\\n\\nF\u00d3RSA\u00cd IDIRMH\u00d3IL\u00cdNEACHA\\n\\nF\u00f3rsa\u00ed
  Idirmh\u00f3il\u00edneacha\\n\\nBa ch\u00f3ir do dhalta\u00ed a bheith \u00e1balta:\\n\\n1.4.1
  cur s\u00edos ar fh\u00f3rsa\u00ed idirmh\u00f3il\u00edneacha mar fh\u00f3rsa\u00ed
  van der Waals (amharctar orthu mar aomach\u00e1in idir d\u00e9phoil ionduchtaithe),
  mar aomach\u00e1in bhuana d\u00e9phol-d\u00e9phol agus mar nascadh hidrigine (idir
