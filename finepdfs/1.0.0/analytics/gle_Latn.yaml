  gach freagra ceart go dt\u00ed ionad deach\u00falach amh\u00e1in.\\n\\n(i) \\\\[8\\\\text{cm}\\\\]  \\n(ii)
  \\\\[21\\\\text{cm}\\\\]  \\n(iii) \\\\[11\\\\text{cm}\\\\]  \\n(iv) \\\\[18\\\\text{cm}\\\\]\\n\\n4.
  Ag \u00fas\u00e1id 3.14 mar gharluach ar $\\\\pi$, r\u00edomh fad iml\u00ednte na
