  Athnuachan na spar\u00e1nachta\u00ed\\n\\n9. Easaontais a Shocr\u00fa\\n\\n1. R\u00e9amhr\u00e1\\n\\nBuna\u00edodh
  an Sc\u00e9im Spar\u00e1nachta\u00ed seo do scol\u00e1ir\u00ed a n-\u00e9ir\u00edonn
  thar cionn leo san Ardteistim\u00e9ireacht a thagann as c\u00falra\u00ed faoi mh\u00edbhunt\u00e1iste.\\n\\nGlaofar
  Spar\u00e1nacht an Ollaimh William C Campbell ar an spar\u00e1nacht. Bronnfar an
  spar\u00e1nacht seo ar scol\u00e1ire inch\u00e1ilithe a rinne staid\u00e9ar ar dh\u00e1
  \u00e1bhar eola\u00edochta ar a laghad san Ardteistim\u00e9ireacht agus a rinne
  iarratas ar staid\u00e9ar a dh\u00e9anamh ar ch\u00farsa faofa ina mbeidh bunch\u00e9im
  sa Z\u00f3-eola\u00edocht, Leigheas, Fiseola\u00edocht n\u00f3 sna hEola\u00edochta\u00ed
  Bithleighis ag an leibh\u00e9al foch\u00e9ime in Institi\u00faid Ardoideachais faofa.\\n\\nT\u00e1
  na c\u00farsa\u00ed tr\u00ed\u00fa leibh\u00e9al at\u00e1 faofa chun cr\u00edche
  na sc\u00e9ime spar\u00e1nachta\u00ed seo leagtha amach in Aguis\u00edn I\\n\\n2.
  Riachtanais Ch\u00e1ilitheachta\\n\\nSc\u00e9im Spar\u00e1nachta\u00ed Tr\u00ed\u00fa
  Leibh\u00e9al\\n\\nIs g\u00e1 iarratais a dh\u00e9anamh le bheith curtha san \u00e1ireamh
  sa Sc\u00e9im Spar\u00e1nachta\u00ed. Le bheith inch\u00e1ilithe n\u00ed m\u00f3r
  d''iarrth\u00f3ir tar \u00e9is a bheith ag freastal ar scoil DEIS agus bheith rannph\u00e1irteach
  i gcl\u00e1r na hArdteistim\u00e9ireachta sa scoil sin, tar \u00e9is staid\u00e9ar
  a dh\u00e9anamh in dh\u00e1 \u00e1bhar eola\u00edochta at\u00e1 comhairthe chun
  cr\u00edche CAO, agus n\u00ed m\u00f3r bitheola\u00edocht a bheith mar \u00e1bhar
  amh\u00e1in agus n\u00ed m\u00f3 d\u00f3/di a bheith aitheanta mar dhuine as c\u00falra
  faoi mh\u00edbhunt\u00e1iste ar bhonn eacnama\u00edoch. Mar fhianaise d\u00e1 leith\u00e9id,
  n\u00ed m\u00f3r d\u00edol\u00faine a bheith aige/aici \u00f3 th\u00e1ille scr\u00fad\u00fa
  na hArdteistim\u00e9ireachta a \u00edoc. Measfar iarrth\u00f3ir inch\u00e1ilithe
  a chomhl\u00edonann na crit\u00e9ir seo a leanas a bheith inch\u00e1ilithe don sc\u00e9im
  Spar\u00e1nachta\u00ed seo. Iarrth\u00f3ir\u00ed den ch\u00e9ad uair i mbun Ardteistim\u00e9ireacht
  2019, a fhaigheann Gr\u00e1d GL6 (O6) n\u00f3 gr\u00e1d n\u00edos airde i gc\u00faig
  \u00e1bhar ar a laghad den liosta faofa d''\u00e1bhair, (mar at\u00e1 leagtha amach
  sna Rialacha agus sa Chl\u00e1r d''Iarbhunscoileanna).\\n\\nChomh maith leis na
  riachtanais ch\u00e1ilitheachta at\u00e1 leagtha amach thuas n\u00ed m\u00f3r go
  mbeadh glactha le scol\u00e1ire ar ch\u00farsa faofa sna r\u00e9ims\u00ed Z\u00f3-eola\u00edochta,
  Leighis, Fiseola\u00edochta n\u00f3 Eola\u00edochta\u00ed Leighis.\\n\\nN\u00ed
  m\u00f3r do gach iarrth\u00f3ir foirm iarratais chomhl\u00e1naithe a chur isteach
  agus fianaise a chur ar f\u00e1il \u00f3n CAO gur chuir s\u00e9/s\u00ed iarratas
  isteach ar ch\u00farsa Z\u00f3eola\u00edochta, Leighis, Fiseola\u00edochta n\u00f3
  Eola\u00edochta\u00ed Bithleighis mar a c(h)\u00e9ad rogha.\\n\\nD\u00e9anfar c\u00farsa\u00ed
  tr\u00ed\u00fa leibh\u00e9al de thr\u00e9imhse ama ceithre bliana n\u00f3 n\u00edos
  m\u00f3 a mheas, at\u00e1 ar an liosta mar Z\u00f3-eola\u00edocht, Leigheas, Fiseola\u00edocht
  n\u00f3 Eola\u00edochta\u00ed Bithleighis ar nasc thairseach na ngairmeacha agus
  at\u00e1 \u00e1 nd\u00e9anamh ag Institi\u00faid Ardoideachais a fhaigheann maoini\u00fa
  poibl\u00ed.\\n\\nLe spar\u00e1nacht a fh\u00e1il n\u00ed m\u00f3r go mbeadh glactha
  le scol\u00e1ire ar ch\u00farsa n\u00f3 go mbeadh scol\u00e1ire ag freastal ar ch\u00farsa
  a chomhl\u00edonann na crit\u00e9ir seo.\\n\\n3. An tOrd Fi\u00fantais\\n\\nBronnfar
  spar\u00e1nachta\u00ed an Ollaimh William C Campbell ar an iarrth\u00f3ir inch\u00e1ilithe
  a rinne iarratas a chomhl\u00edonann crit\u00e9ir an ch\u00farsa fhaofa mar at\u00e1
  leagtha amach thuas, agus a bhfuil l\u00edon na marcanna is airde acu ina bp\u00e1ip\u00e9ir
  scr\u00fadaithe in dh\u00e1 cheann d''\u00e1bhair eola\u00edochta a dh\u00e9antar
  a chomhaireamh chun cr\u00edche CAO, agus n\u00ed m\u00f3r go mbeadh bitheola\u00edocht
  mar cheann amh\u00e1in d\u00edobh. Sa ch\u00e1s go bhfuil beirt iarrth\u00f3ir\u00ed
  n\u00f3 n\u00edos m\u00f3 \u00e1 meas a bhfuil ag an gcaighde\u00e1n c\u00e9anna
  d\u00e9anfar an t-ord fi\u00fantais a shocr\u00fa ach breathn\u00fa ar conas a d''\u00e9irigh
  leis an iarrth\u00f3ir sna s\u00e9 h\u00e1bhar is fearr. M\u00e1 bh\u00edonn ioml\u00e1n
  na marcanna a bhaineann beirt iarrth\u00f3ir\u00ed n\u00f3 n\u00edos m\u00f3 amach
  f\u00f3s mar an gc\u00e9anna, d\u00e9anfar an t-ord fi\u00fantais a shocr\u00fa
  ach breathn\u00fa ar conas a d''\u00e9irigh leis na hiarrth\u00f3ir\u00ed ina n-\u00e1bhar
  is fearr.\\n\\n4.   Tairiscint\u00ed Spar\u00e1nachta\\n\\nCuirfear buaiteoir na
  Spar\u00e1nachta ar an eolas a luaithe agus is f\u00e9idir tar \u00e9is tortha\u00ed
  Ardteistim\u00e9ireacht 2019 a eisi\u00faint.\\n\\nN\u00ed m\u00f3r don iarrth\u00f3ir
  a n-\u00e9ir\u00edonn leis/l\u00e9i glacadh leis an tairiscint spar\u00e1nachta
  i dtaca leis an gc\u00farsa faofa don bhliain acad\u00fail 2019/2020 n\u00f3 rachaidh
  an tairiscint in \u00e9ag. Is f\u00e9idir an spar\u00e1nacht a chur siar ar feadh
  bliain acad\u00fail amh\u00e1in agus ar feadh na tr\u00e9imhse sin amh\u00e1in agus
  cead i scr\u00edbhinn a bheith faighte \u00f3n Aire Oideachais agus Scileanna. N\u00ed
  m\u00f3r iarratas a dh\u00e9anamh leis an spar\u00e1nacht a chur siar nuair a ghlactar
  leis an tairiscint spar\u00e1nachta.\\n\\nBraitheann aon tairiscint spar\u00e1nachta
  ar an eolas a bheith ionraic agus cruinn agus ar an iarrth\u00f3ir ag comhl\u00edonadh
  choinn\u00edollacha na sc\u00e9ime. Forchoime\u00e1dtar an ceart tairiscint a tharraingt
  siar, mar thoradh ar aon earr\u00e1id a bheith san eolas a thugann an t-iarrth\u00f3ir.\\n\\n5.
  Coinn\u00edollacha a bhaineann le Tairiscint\u00ed spar\u00e1nachta\\n\\nN\u00ed
  bhronnfar an spar\u00e1nacht ach amh\u00e1in i dtaca le freastal ar ch\u00farsa
  faofa in institi\u00faid fhaofa, agus ar feadh gn\u00e1th-thr\u00e9imhse de ch\u00farsa
  foch\u00e9ime faofa amh\u00e1in suas go dt\u00ed tr\u00e9imhse c\u00faig bliana
  ar a mh\u00e9ad.\\n\\nBeifear ag s\u00fail go gcomhl\u00edonfaidh daoine a mb\u00edonn
  spar\u00e1nachta\u00ed acu na rialach\u00e1in a bhaineann lena gcol\u00e1iste/institi\u00faid
  agus le dul i mbun scr\u00fadaithe gach t\u00e9arma n\u00f3 aon scr\u00fad\u00fa
  eile a bh\u00edonn socraithe ag na h\u00fadar\u00e1is d\u00e1 gcol\u00e1iste/institi\u00faid
  d\u00e1 gc\u00farsa.\\n\\nBeidh scol\u00e1ire a mbronntar spar\u00e1nachta\u00ed
  orthu i dteideal iarratas a dh\u00e9anamh ar dheontais mhic l\u00e9inn freisin i
  dtreo chostas na cothabh\u00e1la agus ionchur n\u00f3 t\u00e1ill\u00ed na mac l\u00e9inn.\\n\\nN\u00ed
  bheidh cead ag duine a bhfuil spar\u00e1nacht aige/aici\\n\\n(ii) aon d\u00e1mhachtain
  eile in\u00edoctha ag comhlacht poibl\u00ed a bheith aige/aici; n\u00f3\\n(i) deontas/scol\u00e1ireacht
  bronnta \u00f3n Roinn Oideachais agus Scileanna a bheith aige/aici;\\n(iii) a chomhionann
  i mBallst\u00e1t eile de chuid an AE a bheith aige/aici.\\n(iv) D\u00e1mhachtain
  Scol\u00e1ireachta Uile-\u00c9ireann a bheith aige/aici\\n\\nSa treoir thuas n\u00ed
  chl\u00fada\u00edtear d\u00e1mhachtain\u00ed ar n\u00f3s scol\u00e1ireachta\u00ed,
  duaiseanna n\u00f3 spar\u00e1nachta\u00ed a bhronnann an institi\u00faid a bhfuiltear
  ag freastal uirthi n\u00e1 d\u00e1mhachtain\u00ed faoi\\n\\nScol\u00e1ireachta\u00ed
  Rialtas na h\u00c9ireann sna Daonnachta\u00ed agus sna hEola\u00edochta\u00ed S\u00f3isialta
  n\u00f3 deontais iarch\u00e9ime um thaighde, \u00e1it nach dt\u00e9ann an deontas
  thar m\u00e9id \u00e1irithe, at\u00e1 sonraithe mar \u20ac16,000 don bhliain 2019/2020.\\n\\nSa
  treoir thuas n\u00ed chl\u00fada\u00edtear d\u00e1mhachtain\u00ed ar iarrth\u00f3ir\u00ed
  faoin gCiste Ch\u00fanamh do Mhic L\u00e9inn n\u00e1 faoin gCiste do Mhic L\u00e9inn
  faoi Mh\u00edchumas.\\n\\nBeidh s\u00e9 mar choinn\u00edoll le spar\u00e1nacht a
  bheith bronnta faoin sc\u00e9im seo go dtugann an t-iarrth\u00f3ir \u00fadar\u00e1s
  don Roinn Oideachais agus Scileanna eolas maidir le d\u00e1mhachtain na spar\u00e1nachta
  a aistri\u00fa go dt\u00ed bunachar sonra\u00ed l\u00e1rnach de dhaoine a bhfuil
  deontais acu ar f\u00e9idir rochtain a dh\u00e9anamh air tr\u00edd seo a leanas
  \u2013 Taca\u00edocht Chomhchoiteann do Mhic L\u00e9inn in \u00c9irinn (SUSI), an
  t-aonad \u00edoca\u00edochta ainmnithe laistigh de BOO Chathair Bhaile \u00c1tha
  Cliath, na Coimisin\u00e9ir\u00ed Ioncaim agus an Roinn Coimirce S\u00f3isiala\u00ed.\\n\\n6.
  Luach na spar\u00e1nachta\u00ed\\n\\nB\u00edonn luach bliant\u00fail na spar\u00e1nachta
  i gcomhr\u00e9ir leis na r\u00e1ta\u00ed a shonra\u00edonn an tAire Oideachais agus
  Scileanna. Is \u00e9 an tsuim do Spar\u00e1nacht an Ollaimh William C Campbell don
  bhliain acad\u00fail 2019/20 n\u00e1 \u20ac5,000.\\n\\n7.  \u00cdoca\u00edocht na
  spar\u00e1nachta\u00ed\\n\\n\u00cdocfar an spar\u00e1nacht mar \u00edoca\u00edocht
  amh\u00e1in a luaithe agus a fhaigheann an col\u00e1iste/institi\u00faid deimhni\u00fa
  go bhfuil na mic l\u00e9inn cl\u00e1raithe agus go bhfuil siad ag freastal ar ch\u00farsa
  faofa.\\n\\nD\u00e9anfar an \u00edoca\u00edocht isteach i gcuntas bainc de chuid
  na h\u00c9ireann an mhic l\u00e9inn.\\n\\n8.  Athnuachan na spar\u00e1nachta\u00ed\\n\\nD\u00e9anfar
  athnuachan ar spar\u00e1nachta\u00ed nuair a fhaightear foirm athnuachana \u00f3n
  iarrth\u00f3ir agus nuair a dheimhn\u00edonn an col\u00e1iste go ndearna an duine
  a bhfuil an spar\u00e1nacht aige/aici dul chun cinn go dt\u00ed an ch\u00e9ad bhliain
  eile den ch\u00farsa, faoi r\u00e9ir gn\u00e1th-thr\u00e9imhse ama an ch\u00farsa
  fhaofa.\\n\\nF\u00e9adfaidh an tAire Oideachais agus Scileanna deireadh a chur le
  luach spar\u00e1nachta n\u00f3 \u00e9 a \u00edsli\u00fa, ag am ar bith gan aon fh\u00f3gra,
  \u00e1it a bhfaightear tuairisc neamhfhabhrach faoin duine a bhfuil spar\u00e1nacht
  aige/aici \u00f3 \u00fadar\u00e1is an chol\u00e1iste/na hinstiti\u00faide iomchu\u00ed.\\n\\nN\u00ed
  f\u00e9idir spar\u00e1nachta\u00ed a \u00edoc i dtaca leis an dara tr\u00e9imhse
  de bheith ag freastal ar ch\u00farsa ag an leibh\u00e9al c\u00e9anna de ch\u00farsa
  at\u00e1 faofa chun cr\u00edche na sc\u00e9ime spar\u00e1nachta seo. F\u00e9adfaidh
  an tAire Oideachais agus Scileanna an riail seo a leagan ar leataobh i gc\u00e1sanna
  eisceacht\u00fala ar n\u00f3s drochthinneas deimhnithe.\\n\\nN\u00ed m\u00f3r duine
  a bhfuil spar\u00e1nacht aige/aici, ar mian leis/l\u00e9i le linn a c(h)uid staid\u00e9ar,
  c\u00farsa n\u00f3 d\u00e1mh a athr\u00fa n\u00f3 a spar\u00e1nacht a chur siar
  ar feadh bliain acad\u00fail amh\u00e1in agus don tr\u00e9imhse sin amh\u00e1in,
  cead i scr\u00edbhinn a fh\u00e1il roimh r\u00e9 \u00f3n Aire Oideachais agus Scileanna.\\n\\n9.  Easaontais
  a Shocr\u00fa\\n\\nD\u00e9anfaidh an tAire Oideachais agus Scileanna cinneadh a
  dh\u00e9anamh maidir le haon cheist n\u00f3 easaontas a thagann an\u00edos maidir
  le tuiscint n\u00f3 l\u00e9amh na sc\u00e9ime seo agus is aige/aici a bheidh an
  cinneadh deiridh.\\n\\nAguis\u00edn I\\n\\nC\u00farsa\u00ed Faofa \u2013 Sc\u00e9im
  Spar\u00e1nachta\u00ed 2019\\n\\nFoch\u00e9im\\n\\nC\u00farsa foch\u00e9ime l\u00e1naimseartha:-\\n\\n(b)
  ina mbronntar d\u00e1mhachtain mh\u00f3r ardoideachais agus oili\u00fana ar mhac
  l\u00e9inn nuair a chuireann s\u00e9/s\u00ed a c(h)\u00farsa i gcr\u00edch, at\u00e1
  mar ch\u00e1il\u00edocht aitheanta de bhun chreatlach na gc\u00e1il\u00edochta\u00ed,
  agus\\n(a) a ghlacann nach l\u00fa n\u00e1 ceithre bliana le cur i gcr\u00edch.\\n(c)
  at\u00e1 curtha ar f\u00e1il ag ceann amh\u00e1in de na hinstiti\u00faid\u00ed faofa
  at\u00e1 ar an liosta i gcuid A den Sceideal a ghabhann leis an Aguis\u00edn seo,
  agus\\n\\nn\u00f3\\n\\nC\u00farsa foch\u00e9ime:-\\n\\n(b) ina mbronntar d\u00e1mhachtain
  mh\u00f3r ardoideachais agus oili\u00fana ar mhac l\u00e9inn nuair a chuireann s\u00e9/s\u00ed
  a c(h)\u00farsa i gcr\u00edch, at\u00e1 mar ch\u00e1il\u00edocht aitheanta de bhun
  chreatlach na gc\u00e1il\u00edochta\u00ed, agus\\n(a) a ghlacann nach l\u00fa n\u00e1
  ceithre bliana le cur i gcr\u00edch.\\n(c) at\u00e1 ar an liosta i gcuid B den Sceideal
  a ghabhann leis an Aguis\u00edn seo, in \u00e9ineacht leis an institi\u00faid fhaofa
  a gcuireann \u00e9 ar f\u00e1il, n\u00f3 at\u00e1 curtha ar f\u00e1il ag institi\u00faid
  oideachais a chuireann ardoideachas agus oili\u00faint ar f\u00e1il at\u00e1 lonnaithe
  i mballst\u00e1t seachas an St\u00e1t at\u00e1 \u00e1 gcothabh\u00e1il n\u00f3 a
  fhaigheann c\u00fanamh de bharr deontas a fhaightear ar\u00eds is ar\u00eds eile
  \u00f3 chist\u00ed poibl\u00ed an St\u00e1it sin n\u00f3 d''aon Ballst\u00e1t eile,
  an St\u00e1t san \u00e1ireamh.\\n\\nSceideal\\n\\nCuid A\\n\\nOllscoil na h\u00c9ireann,
  Baile \u00c1tha Cliath Ollscoil na h\u00c9ireann, Corcaigh Ollscoil na h\u00c9ireann,
  Gaillimh Col\u00e1iste na Tr\u00edon\u00f3ide, Baile \u00c1tha Cliath Ollscoil Luimnigh\\n\\nCuid
  B\\n\\nCol\u00e1iste R\u00edoga na M\u00e1inle\u00e1 in \u00c9irinn\\n\\n- C\u00e9im
  NUI de MB(On\u00f3racha), BCH, BAO, LRCP, SI [5 bliana]\\n\\nI dtaca le na c\u00farsa\u00ed
  foch\u00e9ime seo a leanas:\\n\\n- C\u00e9im NUI de MB (On\u00f3racha), BCH, BAO,
  LRCP, SI [6 bliana]\"", "\"Coimisi\u00fan na Scr\u00faduithe St\u00e1it\\n\\nSCR\u00daD\u00da
  AN TEASTAIS SH\u00d3ISEARAIGH, 2010\\n\\nGAEILGE \u2013 GN\u00c1THLEIBH\u00c9AL\\n\\n(240
  marc)\\n\\nD\u00c9ARDAOIN, 10 MEITHEAMH \u2013 MAIDIN, 9.30 go dt\u00ed 11.30\\n\\nDON
  SCR\u00daDAITHEOIR\\n\\n1. M\u00f3rioml\u00e1n na n-ioml\u00e1n bun leathanaigh.\\n\\nN\u00f3ta:\\nN\u00ed
  m\u00f3r don mharc ag 1 thuas a bheith mar an gc\u00e9anna leis an IOML\u00c1N sa
  ghreille ar dheis.\\n\\nROINN I - CLUASTUISCINT\\n\\n| Ceist | CUID A | CUID B |
  CUID C |\\n|-------|--------|--------|--------|\\n| Marc  |        |        |        |\\n\\nDON
  SCR\u00daDAITHEOIR\\n\\n| ROINN | CEIST | MARC |\\n|-------|-------|------|\\n|
  II    | 1     |      |\\n|       | 2     |      |\\n|       | 3     |      |\\n|
  III   | 4     |      |\\n|       | 5     |      |\\n|       | 6     |      |\\n\\nIOML\u00c1N\\n\\nCLUASTUISCINT\\n\\nM\u00d3RIOML\u00c1N\\n\\nGR\u00c1D\\n\\nCUID
  A\\n\\nCloisfidh t\u00fa giota cainte \u00f3 bheirt daoine \u00f3ga sa chuid seo.
  Cloisfidh t\u00fa gach giota di\u00f3bh faoi dh\u00f3. \u00c9ist go c\u00faramach
