  beag\u00e1n im.\\n\\nCopyright \u00a9 Agri Aware 2022 | Charity Number CHY12014\"",
  "\"R\u00e9amhr\u00e1\\nMaireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. \u00c1is phraitici\u00fail\\nle
  tac\u00fa leis an R\u00e9imse nua Foghlama: Forbairt\\nPhearsanta agus Comhthuiscint
  i gCuraclam\\nThuaisceart \u00c9ireann don Bhunscola\u00edocht.\\n\\nMaireacht\u00e1il.
  Foghlaim. Le Ch\u00e9ile. \u00c1is phraitici\u00fail\\n\\nle tac\u00fa leis an R\u00e9imse
  nua Foghlama: Forbairt\\n\\nPhearsanta agus Comhthuiscint i gCuraclam\\n\\nThuaisceart
  \u00c9ireann don Bhunscola\u00edocht.\\n\\nCad \u00e9 Maireacht\u00e1il. Foghlaim.
  Le Ch\u00e9ile.?\\n\\nD\u00edrithe ar dhalta\u00ed idir 5-11 bliain d''aois, is
  cl\u00e1r plean\u00e1ilte c\u00e9imnitheach i bhForbairt Phearsanta agus Comhthuiscint
  (FP&CT) \u00e9 Maireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. Cuideoidh s\u00e9 le
  scoileanna riachtanais phearsanta, mhoth\u00fach\u00e1nacha, sh\u00f3isialta agus
  sl\u00e1inte na bp\u00e1ist\u00ed a fhorbairt, agus lena n-ullmh\u00fa lena gcion
  f\u00e9in a dh\u00e9anamh d\u00e1 bpobal ar dh\u00f3igheanna a mbeidh tionchar dearfach
  buan acu.\\n\\nCuirfidh Maireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. go m\u00f3r
  le sol\u00e1thar FP&CT tr\u00edd an scoil ar fad. N\u00edor cheart \u00e9 a mheas,
  \u00e1fach, mar \u00e1is chr\u00edochnaitheach; moltar do mh\u00fainteoir\u00ed
  scoile cur leis an \u00e1is seo de r\u00e9ir mar is cu\u00ed do riachtanais agus
  do sp\u00e9iseanna a ndalta\u00ed f\u00e9in; mar shampla, le h\u00e1iseanna cu\u00ed
  \u00f3 \u00e1is\u00edneachta\u00ed seachtracha, le ceisteanna reatha \u00f3n phobal
  agus \u00f3 na me\u00e1in agus leis an phlean\u00e1il at\u00e1 d\u00e9anta cheana
  f\u00e9in acu.\\n\\nC\u00e9 air a bhfuil s\u00e9 d\u00edrithe?\\n\\nT\u00e1 an \u00e1is
  seo d\u00edrithe ar phobal uile na scoile. Is d\u00f3cha go nd\u00e9anfaidh an Pr\u00edomhoide
  n\u00f3 Bainisteoir Sinsearach \u00ed a phlean\u00e1il i gcomhph\u00e1irt leis an
  chomhordaitheoir FP&CT; m\u00fainteoir\u00ed is m\u00f3 a shaothr\u00f3idh an \u00e1is
  sa seomra ranga. Beidh gn\u00e9ithe den \u00e1is \u00fas\u00e1ideach ag daoine f\u00e1sta
  eile a bh\u00edonn i dteagmh\u00e1il leis na dalta\u00ed. Is f\u00e9idir gur g\u00e1
  m\u00fainteoir\u00ed c\u00fanta, an fhoireann l\u00f3in agus foirne eile taca\u00edochta
  a chur ar an eolas faoi na cro\u00ed-choincheapa agus faoin st\u00f3r focal a chuirfear
  i l\u00e1thair na ndalta\u00ed.\\n\\nR\u00e9amhr\u00e1\\n\\nD\u00edr\u00edonn Forbairt
  Phearsanta agus Comhthuiscint ar gach dalta a spreagadh lena bheith \u00e9ifeachtach
  go pearsanta, go moth\u00fach\u00e1nach, go s\u00f3isialta agus go fisici\u00fail;
  le saol sl\u00e1inti\u00fail, s\u00e1bh\u00e1ilte, s\u00e1sta a chaitheamh; agus
  le f\u00e1s an\u00edos ina shaor\u00e1nach muin\u00edneach, neamhsple\u00e1ch, freagrach
  a dh\u00e9anfaidh, le linn a shaoil, roghanna agus cinnt\u00ed at\u00e1 eolasach
  agus freagrach.\\n\\nSeo a leanas is br\u00ed le FP&CT a bheith mar R\u00e9imse
  Foghlama ann f\u00e9in sa churaclam bunscola\u00edochta: deis a shol\u00e1thar aird
  ar leith a thabhairt ar fhorbairt phearsanta agus mhoth\u00fach\u00e1nach, ar shl\u00e1inte
  agus s\u00e1bh\u00e1ilteacht, ar chaidreamh le daoine eile, agus ar fhorbairt tuiscint
  n\u00edos leithne sa dalta ar a \u00e1it sa phobal agus ar n\u00e1d\u00far idirsple\u00e1ch
  na h\u00e1ite sin.\\n\\nAn Cl\u00e1r\\n\\nTh\u00e1inig an chuid is m\u00f3 de na
  h\u00e1bhair \u00f3n chl\u00e1r Walk Talk a chuir an Roinn Oideachais agus Eola\u00edochta
  i bPoblacht na h\u00c9ireann amach. T\u00e1st\u00e1ladh agus rinneadh p\u00edol\u00f3ta\u00edocht
  go fairsing ar an chl\u00e1r seo i l\u00edon m\u00f3r scoileanna thar roinnt blianta.\\n\\nAg
  t\u00fas an athbhreithnithe curaclaim, cuireadh cl\u00e1r p\u00edol\u00f3tach FP&CT
  sa tsi\u00fal i roinnt scoileanna ar fud Thuaisceart \u00c9ireann. Sa bhreithmheas
  ar an chl\u00e1r ph\u00edol\u00f3tach seo, cuireadh b\u00e9im ar an gh\u00e1 le
  cl\u00e1r cuimsitheach c\u00e9imnitheach in FP&CT. Cuireadh cl\u00e1r p\u00edol\u00f3tach
  n\u00edos m\u00f3 sa tsi\u00fal ina dhiaidh sin inar t\u00e1st\u00e1ladh an cl\u00e1r
  ''Walk Tall Together'' i scoileanna. Chruthaigh an breithmheas ar an chl\u00e1r
  ph\u00edol\u00f3ta seo gur g\u00e1 na h\u00e1bhair a chur i gcomhth\u00e9acs le
  riachtanais m\u00fainteoir\u00ed agus p\u00e1ist\u00ed i dTuaisceart \u00c9ireann
  a sh\u00e1samh. T\u00e1 teacht ar an tuairisc bhreithmheasa seo agus ar achoimre
  fheidhmeach ag www.nicurriculum.org.uk istigh sa rann\u00e1n FP&CT.\\n\\nAn Pr\u00f3iseas\\n\\nDearadh
  Maireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. le tac\u00fa le pr\u00f3iseas feidhmithe
  Churaclam Thuaisceart \u00c9ireann don Bhunscola\u00edocht. T\u00e1irgeadh na h\u00e1bhair
  a bhaineann le Forbairt Ghairmi\u00fail Lean\u00fanach (FGL) at\u00e1 iniata sa
  Bhosca Taca\u00edocht agus Feidhmi\u00fa Curaclaim le taca\u00edocht a thabhairt
  do scoileanna le Forbairt Phearsanta agus Comhthuiscint. I measc na n-\u00e1bhar
  FGL seo t\u00e1:\\n\\n- C\u00falra agus forbhreathn\u00fa;\\n- Timpeallacht agus
  modheola\u00edochta\u00ed na foghlama.\\n- R\u00e1itis \u00edosriachtanais; agus\\n\\nMoltar
  do riarth\u00f3ir\u00ed scoile tos\u00fa ar dt\u00fas leis an treoir agus leis na
  h\u00e1bhair Oideachais agus Traen\u00e1la Inseirbh\u00edse, agus dul i ngleic leis
  an phr\u00f3iseas f\u00e9inmheast\u00f3ireachta. Sainaithneoidh tortha\u00ed an
  phr\u00f3isis seo an staid reatha sa scoil maidir le taca\u00edocht \u00e9iteas
  na scoile do FP&CT, le tuiscint na riarth\u00f3ir\u00ed ar cad \u00e9 at\u00e1 i
  gceist le FP&CT, lena tionchar ar phobal na scoile; agus cuirfidh an pr\u00f3iseas
  chun suntais na l\u00e1idreachta\u00ed agus na r\u00e9ims\u00ed le forbairt sa scoil
  maidir le FP&CT.\\n\\nTr\u00edd an phr\u00f3iseas seo, beidh riarth\u00f3ir\u00ed
  scoile i riocht n\u00edos fearr gn\u00e9ithe den \u00e1is seo, n\u00f3 \u00ed uile,
  a imeascadh agus, d\u00e1 r\u00e9ir, monat\u00f3ireacht agus breithmheas a dh\u00e9anamh
  ar a dul chun cinn. T\u00e1 teacht ar na h\u00e1bhair seo ag www.nicurriculum.org.uk
  istigh sa rann\u00e1n FP&CT.\\n\\nComhth\u00e9acsanna Foghlama\\n\\nSol\u00e1thra\u00edonn
  Forbairt Phearsanta agus Comhthuiscint comhth\u00e9acsanna t\u00e1bhachtacha \u00e1bhartha
  d''fhorbairt na scileanna agus na n-inni\u00falachta\u00ed i gCuraclam Thuaisceart
  \u00c9ireann, mar shampla,\\n\\nScileanna Traschuraclaim:\\n\\n- Cumars\u00e1id:
  iad f\u00e9in a chur in i\u00fal ar bhonn s\u00f3isialta agus moth\u00fach\u00e1nach
  le cuidi\u00fa leo forbairt mar dhaoine aonair, le dul i dteagmh\u00e1il le daoine
  eile agus le bheith rannph\u00e1irteach mar bhaill den tsocha\u00ed.\\n- \u00das\u00e1id
  na Matamaitice: tuiscint agus teanga na matamaitice a \u00fas\u00e1id le ceisteanna
  a chur agus a fhreagairt, le smaointe a phl\u00e9 agus a chaibidil. Faisn\u00e9is
  a l\u00e9amh, a eagr\u00fa, a chur i l\u00e1thair agus ciall a bhaint aisti; agus\\n-
  \u00das\u00e1id Theicneola\u00edocht na Faisn\u00e9ise agus na Cumars\u00e1ide:
  sonra\u00ed a rochtain agus a bhainisti\u00fa, r\u00e9imse foins\u00ed leictreonacha
  in \u00fas\u00e1id. Taighde a dh\u00e9anamh ar fhaisn\u00e9is a thaca\u00edonn le
  FP&CT, an fhaisn\u00e9is a roghn\u00fa agus a \u00fas\u00e1id. A bhfoghlaim a chur
  i l\u00e1thair agus a chur in i\u00fal ar dh\u00f3igh a bhfuil ciall l\u00e9i do
  dhaoine eile.\\n\\nScileanna Smaointeoireachta:\\n\\n- Bheith Cruthaitheach: bheith
  oscailte agus toilteanach a smaointe f\u00e9in agus smaointe daoine eile a th\u00e1st\u00e1il;\\n-
  Bainisti\u00fa Eolais: faisn\u00e9is a chur i gcompar\u00e1id agus a bhreithmheas
  le smaointeoireacht n\u00edos doimhne agus n\u00edos leithne a chumas\u00fa ar a
  luachanna agus ar a gcuid dearcadh; agus\\n- Smaointeoireacht, Fadhbr\u00e9iteach
  agus Cinnteoireacht: strait\u00e9is\u00ed a fhorbairt le cinnt\u00ed agus roghanna
  freagracha a dh\u00e9anamh.\\n\\n\u00c1baltachta\u00ed Pearsanta:\\n\\n- F\u00e9inbhainisti\u00fa:
  bheith in ann moth\u00fach\u00e1in, am agus foghlaim a bhainisti\u00fa. Muin\u00edn
  ina gcumas bheith ag oibri\u00fa go neamhsple\u00e1ch agus i ngr\u00fapa a fhorbairt;
  agus\\n- Ag Obair le Daoine Eile: leis na scileanna s\u00f3isialta agus idirphearsanta
  at\u00e1 de dh\u00edth le hobair \u00e9ifeachtach ghr\u00fapa a fhorbairt.\\n\\nT\u00e1
  s\u00e9 aitheanta san \u00e1is seo go bhfoghlaim\u00edonn p\u00e1ist\u00ed faoi
  FP&CT le linn an lae scoile agus go bhfuil atmaisf\u00e9ar agus timpeallacht na
  scoile agus an tseomra ranga r\u00edth\u00e1bhachtach don fhoghlaim chr\u00edochn\u00fail.
  Ag an am c\u00e9anna, t\u00e1 s\u00e9 t\u00e1bhachtach fosta tr\u00e9imhs\u00ed
  ar leith a chur i leataobh ina mbeidh d\u00edri\u00fa intinne faoi leith ar ghn\u00edomha\u00edochta\u00ed
  foghlama FP&CT.\\n\\n4\\n\\nLeagan Amach na h\u00c1ise\\n\\nLeagadh amach an \u00e1is
  seo ina seacht n-aonad ar dhathanna \u00e9ags\u00fala - dearg, or\u00e1iste, bu\u00ed,
  glas, gorm, indeag\u00f3, vialait. T\u00e1 an t-\u00e1bhar bunriachtanach leagtha
  amach i gcl\u00f3 trom i ngach aonad, mar aon le molta\u00ed neamhreacht\u00fala.
  Forleathna\u00edodh an t-\u00e1bhar bunriachtanach tr\u00ed ghn\u00edomha\u00edochta\u00ed
  foghlama molta a chur leis. N\u00edl na h\u00e1bhair a cuireadh ar f\u00e1il saintreorach;
  t\u00e1 siad ina roghchl\u00e1r de ghn\u00edomha\u00edochta\u00ed foghlama molta
  agus de mhodheola\u00edochta\u00ed molta foghlama a d''fh\u00e9adfadh a bheith \u00fas\u00e1ideach
  agus an t-\u00e1bhar bunriachtanach \u00e1 fhorleathn\u00fa.\\n\\nBa cheart do mh\u00fainteoir\u00ed
  taith\u00ed a thabhairt d\u00f3ibh f\u00e9in ar na gn\u00edomha\u00edochta\u00ed
  foghlama molta, iad a chur in oiri\u00faint d\u00e1 bplean\u00e1il f\u00e9in agus
  iad a imeascadh lena dt\u00e9ama\u00ed f\u00e9in le riar ar riachtanais a seomra
  ranga agus a gc\u00fains\u00ed f\u00e9in. T\u00e1 na gn\u00edomha\u00edochta\u00ed
  foghlama inathraithe agus gaolta; mar sin, ceada\u00edonn siad iomad st\u00edleanna
  \u00e9ags\u00fala foghlama agus teagaisc.\\n\\nT\u00e1 cusp\u00f3ir ioml\u00e1n
  foghlama ag gach aonad. Is f\u00e9idir le m\u00fainteoir\u00ed \u00ed a imeascadh
  mar chuid d\u00e1 bplean\u00e1il. Beidh an pr\u00f3iseas seo ina fhoinse faisn\u00e9ise
  ar fhorbairt na ngn\u00edomha\u00edochta\u00ed foghlama agus cuideoidh s\u00e9 le
  m\u00fainteoir\u00ed agus iad i mbun meas\u00fanaithe. T\u00e1 ''crit\u00e9ir ratha
  mholta'' ag na gn\u00edomha\u00edochta\u00ed foghlama agus is f\u00e9idir le m\u00fainteoir\u00ed
  iad a \u00fas\u00e1id mar phreabchl\u00e1r lena gcrit\u00e9ir ratha f\u00e9in a
  chumadh agus a roinnt leis na dalta\u00ed.\\n\\nSn\u00e1ithe 1: Tuiscint Phearsanta
  agus Sl\u00e1inte\\n\\nA bhF\u00e9inmheas agus a bhF\u00e9inmhuin\u00edn Cusp\u00f3ir
  Foghlama: Uath\u00falacht a aithint agus fi\u00fantas a thabhairt ar thr\u00e9ithe
  agus ar \u00e1baltachta\u00ed pearsanta.\\n\\nBainisti\u00fa a Moth\u00fach\u00e1n
  agus a mBraistint\u00ed Cusp\u00f3ir Foghlama: Braistint\u00ed agus moth\u00fach\u00e1in
  \u00e9ags\u00fala a aithint agus an f\u00e1th a gcaithfimid iad a bhainisti\u00fa
  ar dh\u00f3igh dhearfach sh\u00e1bh\u00e1ilte a thuiscint.\\n\\nMaireacht\u00e1il
  Shl\u00e1inti\u00fail agus Sh\u00e1bh\u00e1ilte\\n\\nCusp\u00f3ir Foghlama: Na gn\u00e9ithe
  a chuireann le st\u00edl sh\u00e1bh\u00e1ilte shl\u00e1inti\u00fail mhaireacht\u00e1la
  a thuiscint agus a luach a thabhairt d\u00f3ibh.\\n\\nSn\u00e1ithe 2: Comhthuiscint
  sa Phobal \u00c1iti\u00fail agus sa Phobal Mh\u00f3r\\n\\nCaidreamh leis an Teaghlach
  agus le Cairde Cusp\u00f3ir Foghlama: Tosca a chuireann le caidreamh comhsh\u00e1s\u00fail
  a thuiscint.\\n\\nFreagrachta\u00ed agus C\u00e1sanna Coimhlinte\\n\\nCusp\u00f3ir\u00ed
  Foghlama: An g\u00e1 le d\u00f3igheanna aontaithe idirghn\u00edomhaithe a thuiscint.
  Eolas a bheith acu ar r\u00e9imse strait\u00e9is\u00ed le coimhlint a bhainisti\u00fa,
  agus iad a \u00fas\u00e1id.\\n\\nCos\u00falachta\u00ed agus \u00c9ags\u00falachta\u00ed\\n\\nCusp\u00f3ir
  Foghlama: Ilchine\u00e1lacht i ndaoine a aithint agus a luach a thabhairt di.\\n\\nAn
  D\u00f3igh le Maireacht\u00e1il mar Bhall Pobail a Fhoghlaim Cusp\u00f3ir Foghlama:
  Na scileanna cinnteoireachta a chuireann le r\u00f3il dhearfacha sa bhaile, ar scoil
  agus sa phobal \u00e1iti\u00fail a thuiscint.\\n\\nMeas\u00fan\u00fa\\n\\n''Is ioma\u00ed
  pr\u00f3iseas a b\u00edonn ar si\u00fal san \u00f3c\u00e1id foghlama - an r\u00e9ad\u00falacht
  lean\u00fanach de dhalta\u00ed ag idirghn\u00edomh\u00fa le smaointe, lena ch\u00e9ile,
  leis an mh\u00fainteoir agus leis an timpeallacht fhisici\u00fail, ag taispe\u00e1int,
  agus iad ina bhun, c\u00f3ras feidhmithe a n-intinne agus a spioraid sna d\u00f3igheanna
  a sainmh\u00edn\u00edonn agus a bhfreagra\u00edonn siad an \u00f3c\u00e1id tr\u00edna
  bhfuil siad ag maireacht\u00e1il. Thiocfadh le cuid de seo a bheith mar mhacalla
  lag in cib\u00e9 t\u00e1irg\u00ed a thugann siad leo ag an deireadh. Ach is f\u00e9idir
  linn i bhfad n\u00edos m\u00f3 a fhoghlaim faoi dhalta\u00ed m\u00e1 bhreathna\u00edm\u00edd
  ar an d\u00f3igh a bhfoghlaim\u00edonn agus a dt\u00e1irgeann siad.''\\n\\nDerek
  Rowntree\\n\\nBreathn\u00fa Forbartha Pearsanta agus Comhthuisceana\\n\\nNa himeachta\u00ed
  foghlama agus na gn\u00edomha\u00edochta\u00ed foghlama at\u00e1 ar f\u00e1il in
  Maireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. is imeachta\u00ed praitici\u00fala
  bunaithe ar thaith\u00ed phearsanta iad a l\u00e9ir\u00edonn \u00e9iteas an teagaisc
  agus na foghlama i gCuraclam T\u00c9 don Bhunscola\u00edocht. Ar an d\u00f3igh ch\u00e9anna,
  is ceart go bhfuil an mhodheola\u00edocht a mholtar le FP&CT a mheas\u00fan\u00fa
  bunaithe ar an taith\u00ed phearsanta phraitici\u00fail.\\n\\nD\u00e9anann m\u00fainteoir\u00ed
  breithi\u00fanais neamhfhoirmi\u00fala i dt\u00f3lamh faoi na p\u00e1ist\u00ed acu
  \u00f3na mbreathna\u00edonn siad ar bhonn laeth\u00fail. Mar sin f\u00e9in, breathn\u00f3ireacht
  FP&CT at\u00e1 dea-phlean\u00e1ilte, rialta agus c\u00f3rasach, cuideoidh s\u00ed
  le m\u00fainteoir\u00ed picti\u00far n\u00edos beaichte a fh\u00e1il agus cuideoidh
  s\u00ed leo bar\u00falacha eolasacha a thabhairt ar dhul chun cinn gach dalta. Is
  f\u00e9idir go mbeidh an fhaisn\u00e9is a gheofar \u00f3n bhreathn\u00f3ireacht
  ina foinse eolais i ndearadh na gc\u00e9ad ch\u00e9imeanna eile foghlama agus teagaisc.\\n\\nPlean\u00e1il
  don bhreathn\u00f3ireacht\\n\\nI seomra ranga gn\u00f3thach, t\u00e1 s\u00e9 barrth\u00e1bhachtach
  an dalta n\u00f3 an ghn\u00e9 at\u00e1 t\u00fa ag iarraidh a bhreathn\u00fa ag am
  ar leith a phlean\u00e1il. T\u00e1 s\u00e9 r\u00edth\u00e1bhachtach fosta c\u00f3ras
  socraithe a bheith curtha ar bun, n\u00f3 beidh an chuma air go mb\u00e1faidh an
  iliomad f\u00e9idearthachta\u00ed agus deiseanna th\u00fa. Os a choinne sin, ba
  cheart deis a bheith ann fosta freagairt\u00ed spont\u00e1ineacha na ndalta\u00ed
  a thaifeadadh, m\u00e1 t\u00e1 siad suntasach. Mar sin, b\u00edonn deiseanna ann
  don mh\u00fainteoir breathn\u00f3ireacht phlean\u00e1ilte, mar aon le breathn\u00f3ireacht
  spont\u00e1ineach, a thaifeadadh i m\u00f3rchuid na modhanna \u00e9ifeachtacha breathn\u00f3ireachta.\\n\\nT\u00e1
  t\u00e1bhacht na breathn\u00f3ireachta agus an aithint dhearfach seo le sonr\u00fa
  san \u00e1is. Tugann t\u00e1scair\u00ed ''Forbairt san Fhoghlaim'' taca\u00edocht
  do gach aonad, t\u00e1scair\u00ed a thac\u00f3idh le breathn\u00f3ireacht an aosaigh
  ar ph\u00e1ist\u00ed agus a fh\u00f3gr\u00f3idh d\u00f3 m\u00e1 t\u00e1 an dalta
  ag l\u00e9iri\u00fa comhartha\u00ed dul chun cinn. Sol\u00e1thra\u00edonn na t\u00e1scair\u00ed
  ''Forbairt san Fhoghlaim'' measc\u00e1n d''eolas, de scileanna agus d''\u00e1baltachta\u00ed
  is f\u00e9idir a bhreacadh chun tac\u00fa le breathn\u00f3ireacht. San ioml\u00e1n,
  ba cheart do mh\u00fainteoir\u00ed r\u00e9imse iompra\u00edochta\u00ed a lorg seachas
  ''ticliosta'' c\u00f3rasach.\\n\\nMoltar go mbeidh measc\u00e1n den bhreathn\u00f3ireacht
  phlean\u00e1ilte agus den bhreathn\u00f3ireacht spont\u00e1ineach, den bhreathn\u00f3ireacht
  fhoirmi\u00fail agus neamhfhoirmi\u00fail a dh\u00e9anfar thar r\u00e9imse leathan
  comhth\u00e9acsanna, i ngn\u00edomha\u00edochta\u00ed foghlama gr\u00fapa agus aonair
  araon, ag amanna \u00e9ags\u00fala den l\u00e1 agus den bhliain scoile.\\n\\nAdmh\u00e1lacha\\n\\nT\u00e1
  CCEA faoi chomaoin ag gach duine a chuidigh le forbairt na h\u00e1ise seo; ba mhaith
  linn bu\u00edochas ar leith a ghabh\u00e1il le:\\n\\n- Marian Hamill agus Kathryn
  Edgar;\\n- An Roinn Oideachais agus Eola\u00edochta as cead\u00fa cearta an chl\u00e1ir
