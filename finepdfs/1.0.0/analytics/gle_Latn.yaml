  focal\\n\\nluch  lon dubh  gr\u00e1inneog  caor\\n\\nCr\u00edochnaigh na l\u00edn\u00edochta\u00ed
  seo.\\n\\nCuir lip\u00e9id ar na l\u00edn\u00edochta\u00ed agus dathaigh iad.\\n\\nBanc
  Focal\\n\\nluch lon dubh gr\u00e1inneog sm\u00f3lach\\n\\nBeidh na ruda\u00ed seo
  ag teast\u00e1il uait:\\n\\nTr\u00ed phlanda pr\u00e1ta\u00ed shl\u00e1inti\u00fala\\nM\u00e1la
  plaisteach dubh\\nBosca cairtchl\u00e1ir le poll i dtaobh amh\u00e1in\\nLip\u00e9id\\n\\nSeo
  \u00e9 at\u00e1 le d\u00e9anamh agat\\n\\n* Cuir planda amh\u00e1in isteach sa mh\u00e1la
  plaisteach agus ceangail go daingean \u00e9. Cuir lip\u00e9ad uimhir a haon air.\\n\\n*
  Cuir an bosca cairtchl\u00e1ir thar an dara planda. Cuir lip\u00e9ad uimhir a 2
  air.\\n\\n* F\u00e1g an tr\u00ed\u00fa planda ar leac na fuinneoige. Cuir lip\u00e9ad
  uimhir a tr\u00ed air. Cuir usice air mar is g\u00e1.\\n\\nTar \u00e9is tr\u00ed
  seachtaine... Scr\u00fadaigh na planda\u00ed.\\n\\nCuir taobh le taobh iad. Cad
  a thugan t\u00fa faoi dearra.\\n\\nAn planda sa mh\u00e1la ____________________________\\n\\nC\u00e9n
  f\u00e1th? ____________________________\\n\\nAn planda sa bhosca ____________________________\\n\\nC\u00e9n
  f\u00e1th? ____________________________\\n\\nAn planda ar leac na fuinneoige ____________________________\\n\\nC\u00e9n
  f\u00e1th? ____________________________\\n\\nTuras D\u00falra\\n\\nTasc 1\\nSeasaig\u00ed
  i gciorcal m\u00f3r timpeall an chrair\\n\\nAn m\u00f3 p\u00e1iste le greim l\u00e1imhe
  ar a ch\u00e9ile ar f\u00e9idir a chur timpeall stoc an chrainn?\\n\\nTasc 2\\nSeasaig\u00ed
  faoi imeall na gcraobh is faide \u00f3n gcrann.\\n\\nBeir greim l\u00e1imhe ar a
  ch\u00e9ile. T\u00e1 sibh anois i bhur seasamh os cionn imeall na bhfre\u00e1mhacha
  is faide \u00f3n gcrann..\\n\\nAn m\u00f3 dalta a bhfuil greim l\u00e1imhe ar a
  ch\u00e9ile?\\n\\nIs obair i seo don rang go l\u00e9ir.\\n\\nAr dt\u00fas caithfidh
  t\u00fa duilleoga a bhaili\u00fa. Duilleoga m\u00f3ra mar seiceamar, crann cn\u00f3
  capaill n\u00f3 teile sea is fearr. Ba ch\u00f3ir duilleog agus i deas, m\u00f3r
  a bheith ag gach duine sa rang.\\n\\nIna dhiaidh sin, t\u00e1 t\u00fa chun cuimilte\u00e1n
  de dhuilleog a dh\u00e9anamh. Chuige seo, bionn giota b\u00e1n de phiaip\u00e9ar
  agus \u00e9 n\u00edos m\u00f3 n\u00e1 an duilleog agus criain ag teast\u00e1il.
  Ba ch\u00f3ir measc\u00e1n de chri\u00e1in dhaite a bheith ag an rang.\\n\\nCuir
  do dhuilleog faoin leathanach agus cuimil go cru\u00e1 thar an leathanach. Iompaigh
  an leathanagh thart agus d\u00e9an an dara cuimilte\u00e1n. Ba ch\u00f3ir go mbeadh
  dh\u00e1 chuimilt\u00e9\u00e1n de do dhuilleog agat anois ar an leathanach.\\n\\nAnois
  n\u00ed m\u00f3r duit an cuimilte\u00e1n a ghearradh amach. Go c\u00faramach, gearr
  le sios\u00far thar timpeall an taobh amuigh de chuirnhas an chuimilte\u00e1in.
  Nuair a bheidh seo d\u00e9anta ag an rang go l\u00e9ir ba ch\u00f3ir go mbeadh baill\u00fach\u00e1n
  ann de dhuilleoga ildaite agus iad ar ch\u00f3imh\u00e9id leis na duilleoga cearta.
  Bainfear \u00fas\u00e1id astu seo anois don dealbh chrainn.\\n\\nChun dealbh chrainn
  d\u00e9thoimhseach a d\u00e9anamh, is g\u00e1 duit cruth de chorpa crainn le craobhacha,
  a ghearradh amach as paip\u00e9ar donn. Is f\u00e9idir na duilleoga a ghream\u00fa
  de na craobhacha ansin agus an crann at\u00e1 cr\u00edochnaithe a chur suas ar bhalla
  an tseomra scoile. Is f\u00e9idir cuspa tr\u00ed-thoimhseach a dh\u00e9anamh tr\u00ed
  chorpa crainn a chruth\u00fa as rolla fada de chairtchiar agus craobhacha as r\u00e9iteoir\u00ed
  piopa. Is f\u00e9idir na duilleoga a shocr\u00fa ar na craobhacha ansin agus an
  t-ioml\u00e1n a thaispe\u00e1int ar bhord.\\n\\nChun m\u00f3ibil de chrann a dh\u00e9anamh,
  n\u00ed m\u00f3r gach cuimilte\u00e1n de dhuilleog a cheangal de chorpa (bain feidhm
  as \u00e9ags\u00falacht fad) agus d\u00e9an iad a chrochadh \u00f3 \u00e1it ard
  \u2013 ar teadh faid chrochaire sreinge b\u2019fh\u00e9idir.\\n\\nT\u00e1 t\u00e1bhacht
  ar leith ag baint leis an tionscadal seo m\u00e1 bhaintear feidhm as crann i gclois
  na scoile. Muna bhfuil aon saghsanna crann le duilleoga at\u00e1 s\u00e1bh m\u00f3r
  (muna bhfuil agat ach beith n\u00f3 an sceach gheal) b\u00ed ag machnamh ar roinnt
  eile a chur. Beidh seiceamar a chuirtear \u00f3 \u201ch\u00e9ileacaptair\u201d m\u00f3r
  go leor chun feidhm a bhaint as tar \u00e9is dh\u00e1 bhliain.\\n\\nIs obair i seo
  don rang go l\u00e9ir.\\n\\nAr dt\u00fas caithfidh t\u00fa duilleoga a bhaili\u00fa.
