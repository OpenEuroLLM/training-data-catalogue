  B\u00eddh sa Bhogach\\n\\nIs \u00e1it ghn\u00f3thach \u00e9 an bogach, le go leor
  planda\u00ed agus ainmhithe ina gc\u00f3na\u00ed ann. T\u00e1 siad go l\u00e9ir
  mar chuid de ghr\u00e9as\u00e1n b\u00eddh a chabhra\u00edonn leis an \u00e1it feidhmi\u00fa.
  Tarraing nasc idir gach rud beo agus an rud a itheann \u00e9 agus beidh an gr\u00e9as\u00e1n
  b\u00eddh bogaigh le feice\u00e1il!\\n\\nF\u00e1inleog\\nM\u00edolt\u00f3ga\\nFabhc\u00fan
