  Ba ch\u00f3ir a thabhairt faoi deara gurb \u00e9 an riosca i gcomhth\u00e9acs an
  mheas\u00fanaithe riosca seo n\u00e1 an riosca \\\"d\u00edobh\u00e1la\\\" mar at\u00e1
