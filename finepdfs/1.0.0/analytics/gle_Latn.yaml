  sa phicti\u00far.\\n7. Ceangail t\u00e9ad n\u00f3 sn\u00e1th ar do \u00c9igrit Bheag
  chun an m\u00f3ib\u00edl a chr\u00edochn\u00fa.\\n\\nBogaigh Oile\u00e1n an Harp\u00faraigh\\n\\nInis
  an Sc\u00e9al\\n\\nThug Moira agus Allan cuairt ar bhogaigh Oile\u00e1n an Harp\u00faraigh.
