  20\\n\u00a9Jim Wilson 2020\\n\\nD\u00e9an m\u00f3ib\u00edl den \u00c9igrit Bheag\\n\\nIs
  \u00e9an beag b\u00e1n \u00e9 an \u00c9igrit Bheag a bh\u00edonn ag eitilt go Bogaigh
  Oile\u00e1n an Harp\u00faraigh chun fiach le haghaidh \u00e9isc bheaga agus ribi
  r\u00f3ib\u00e9is amuigh ar na bogaigh.\\n\\n1. Fill bileog p\u00e1ip\u00e9ir b\u00e1n
  ina dh\u00e1 leath.\\n2. Tarraing an \u00c9igrit Bheag ar thaobh amh\u00e1in de.\\n3.
  Dathaigh na cosa.\\n\\nC\u00e9im a 1 agus 2\\n\\nDath bu\u00ed\\nDath dubh\\n\\n\u00c9igrit
