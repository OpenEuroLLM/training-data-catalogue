  Caitr Aitheantais | 33 |\\n\\nGn\u00edomha\u00edochta\u00ed le d\u00e9anamh sa bhaile
  n\u00f3 sa rang\\n\\nR\u00e9amhr\u00e1\\nT\u00e1 s\u00fail againn go gcabhr\u00f3idh
  an leabhar gn\u00edomha\u00edochta seo le p\u00e1ist\u00ed chun foghlama faoina
  dtimpeallacht n\u00e1d\u00fartha i sl\u00ed cleacht\u00fail agus idirghn\u00edomhach.
  T\u00e1 na gn\u00edomha\u00edochta\u00ed go l\u00e9ir sa leabhar seo d\u00edrithe
  ar an bhfiadh\u00falra at\u00e1 le f\u00e1il ag Tearmann D\u00falra Bogach Oile\u00e1n
  an Harp\u00faraigh. T\u00e1 siad oiri\u00fanach do leanai bunscoile. Is gn\u00edomha\u00edochta\u00ed
  cuid acu at\u00e1 le d\u00e9anamh sa seomra ranga n\u00f3 sa bhaile agus t\u00e1
  cuid eile acu oiri\u00fanach le d\u00e9anamh le linn cuairte ar an Tearmann.\\n\\nC\u00e1
  bhfuil Bogaigh Oile\u00e1n an Harp\u00faraigh?\\nT\u00e1 Bogaigh Oile\u00e1n an
  Harp\u00faraigh suite ocht gcilim\u00e9adar soir \u00f3 Chathair Chorca\u00ed d\u00edreach
  \u00f3 thuaidh den N25 in aice le Carraig Thuathail. T\u00e1 an ts\u00edl isteach
  ar Sheanbh\u00f3thar Chorca\u00ed agus t\u00e1 f\u00f3gra\u00ed ag na beala\u00ed
  amach go dt\u00ed an t-Oile\u00e1n Beag (2) agus go dt\u00ed An C\u00f3bh (3). T\u00e1
  an tearmann 10 n\u00f3im\u00e9ad si\u00fal\u00f3ide soir \u00f3 st\u00e1isi\u00fan
  iarnr\u00f3id An Ghleannt\u00e1in, \u00e1it \u00f3nar f\u00e9idir Corcaigh, C\u00f3bh
  agus Mainistir na Corann a bhaint amach, agus t\u00e1 s\u00e9 ar busbhealach 261
  Bus Eireann, 30 n\u00f3im\u00e9ad \u00f3 Chathair Chorca\u00ed. Google Maps Pin
  - https://goo.gl/maps/B7j9iatPn1LSk44f8\\n\\nC\u00fara Bhogaigh Oile\u00e1n an Harp\u00faraigh\\nOscl\u00e1iodh
  an Tearmann D\u00falra ag Bogaigh Oile\u00e1n an Harp\u00faraigh don phobal sa bhliain
  2017. Th\u00e1inig s\u00e9 chun cinn tr\u00ed chomhoibri\u00fa idir Chomhairle Contae
  Chorca\u00ed, \u00fain\u00e9ir\u00ed an oile\u00e1in, Birdwatch Ireland agus pobal
  An Ghleannt\u00e1in.\\n\\nIs limist\u00e9ar de thalamh is\u00e9al \u00e9 Oile\u00e1n
  an Harp\u00faraigh at\u00e1 suite i measc cuid de na gn\u00e1th\u00f3ga is tabhacht\u00e1il
  a aimsitear in inbhe\u00e1r Chontae Chorca\u00ed. T\u00e1 daoine, tionscal agus
  beala\u00ed impair ghn\u00f3thacha m\u00f3rtimpeall air, agus ina l\u00e1r t\u00e1
  bogaigh le feiscint, chomh maith le \u00e9in speisialta agus gn\u00e1th\u00f3ga
  bogaigh leochaileacha, cuid acu de dh\u00e9ant\u00fas an duine. T\u00e1 ceantair
  at\u00e1 saor \u00f3 shuaiteadh laistigh de Chuan Chorca\u00ed ag \u00e9ir\u00ed
  gann do \u00e9in agus do fiadh\u00falra eile; d\u00e1 bhri sin t\u00e1 Bogaigh Oile\u00e1n
  an Harp\u00faraigh ina thearmann d\u00e1r n-oidhreacht n\u00e1d\u00fartha.\\n\\nIs
  sampla iontach de ch\u00f3ras inbhir \u00e9 Cuan Chorca\u00ed, le gach saghas gn\u00e1th\u00f3g
  tipici\u00fail le feiscint ann, Riasc Goirt agus L\u00e1ibe san \u00e1ireamh, agus
  iad cosanta faoi Threoir maidir le gn\u00e1thoga \u00f3n Aontas Eorpach. D\u00e1
  bhri sin t\u00e1 an timpeallacht an-oiri\u00fanach do inveriteabragh mhuiri, at\u00e1
  mar fhoinse bia r\u00edthabhachtach i gc\u00f3ir breis is 18,000 \u00e9an uisce
  a chaithteann an geimhreadh ann. Mar sin, t\u00e1 s\u00e9 ar cheann de na deich
  l\u00e1thair gheimhr\u00eddh is tabhachtai d''\u00e9in uisce in \u00c9irinn agus
  t\u00e1 s\u00e9 t\u00e1bhactach go hidirm\u00e1isi\u00fanta. C\u00e9 nach bhfuil
  in Oile\u00e1n an Harp\u00faraigh ach ceantar beag laistigh de Chuan Chorca\u00ed,
  t\u00e1 an t-oile\u00e1n agus an timpeallacht l\u00e1ibe maguaird an-t\u00e1bhachtach
  chun tearmann s\u00e1bh\u00e1ilte a shol\u00e1thar d''\u00e9in i rith an gheimhr\u00eddh.\\n\\n\u00d3s
  rud \u00e9 go bhfuil r\u00e9imse leathan gn\u00e1th\u00f3ga sa tearmann d\u00falra,
  mar sin t\u00e1 r\u00e9imse na n-\u00e9an leathan chomh maith, mar aon le h-\u00e9ags\u00falacht
  an fiadh\u00falra.\\n\\nTacaitonn an beatha mara sna bl\u00e1ir le l\u00edon ard
  na n-\u00e9an (m.sh. an Cosdearg\u00e1n, an Guilbneach Earddhubh, an Roilleach,
  an Lacha Bhreach agus speicis eile) agus nuair a bh\u00edonn leibh\u00e9al an taoide
  i gceart, bionn go leor de na h\u00e9n seo le feice\u00e1il go h\u00e9asca \u00f3
  na fol\u00fach\u00e1in ar an oile\u00e1n ag amanta \u00e1irithe i rith na bliana.\\n\\nC\u00e1
  as a dtagann na h-\u00e9in ag Bogaigh Oile\u00e1n an Harp\u00faraigh?\\n\\nTagann
  na h-\u00e9in ag Oile\u00e1n an Harp\u00faraigh \u00f3 go leor \u00e1iteanna ar
  fud an domhain. Rugadh cuid acu anseo in \u00c9irinn, tagann cuid eile don gheimhreadh
  \u00f3na l\u00e1ithreacha p\u00f3r\u00fach\u00e1in san Eoraip agus n\u00edos faide
  \u00f3 bhaile agus bionn cuid eile ar\u00eds ag dul ar imirce fhada idir a l\u00e1ithreacha
  p\u00f3r\u00fach\u00e1in san Antach agus a l\u00e1ithreacha gheimhr\u00eddh san
  Afr\u00e1ic. Chomh maith le sin, bionn \u00e9in ag teacht \u00f3 thailte geimhr\u00eddh
  i bhfad i gc\u00e9in chun p\u00f3ir\u00ed anseo i rith an tsamhraidh. \u00das\u00e1ideann
  suas le 4% de na Guilbrigh Earrdhubha ar domhan an teamann d\u00falra seo i rith
  na bliana. Taca\u00edonn Bogaigh Oile\u00e1n an Harp\u00faraigh freisin le dh\u00e1
  speiceas \u00e9in fi\u00e1in agus dh\u00e1 speiceas lapaire go bhfuil t\u00e1bhacht
  n\u00e1isi\u00fanta ag baint leo. Tugann s\u00e9 taca\u00edocht leis le deich speiceas
  eile go bhfuil t\u00e1bhacht r\u00e9igi\u00fanach ag baint leo, iad uile ar liosta
  na n-\u00e9an glomhnaithe sa t\u00edr seo. Toisc go meallann s\u00e9 na h-\u00e9in
  taistil seo go l\u00e9ir, l\u00e1thair th\u00e1bhachtach n\u00e1isi\u00fanta agus
  idirm\u00e1isi\u00fanta is ea Oile\u00e1n an Harp\u00faraigh.\\n\\nCad \u00e9 a
  d\u2019fh\u00e9adfaimis a fheice\u00e1il ar chuairt ar Bhogaigh Oile\u00e1n an Harp\u00faraigh?\\n\\nT\u00e1
  bith\u00e9ags\u00falacht saibhir in Oile\u00e1n an Harp\u00faraigh. Mar shampla,
  t\u00e1 127 speiceas \u00e9an cl\u00e1raithe go dt\u00ed seo. T\u00e1 17 speiceas
  f\u00e9ileac\u00e1n ann, \u00f3s cionn 120 speiceas leamhan, chomh maith le r\u00e9imse
  leathan feithidi agus mionainmhithe eile, go leor pland\u00e1\u00ed agus roinnt
  crainn.\\n\\nCad iad na gn\u00e1th\u00f3ga gur f\u00e9idir linn a ini\u00fachadh?\\n\\nIs
  f\u00e9idir gn\u00e1th\u00f3ga bogaigh agus uisce a fhiosr\u00fa \u00f3 na foluch\u00e1in,
  t\u00e1 f\u00e1lta le feiscint in aice leis an gconair d\u00falra, chomh maith le
  gn\u00e1th\u00f3ga f\u00e9araigh/m\u00f3in\u00e9ir agus gn\u00e1th\u00f3ga riaisc
  fionnuisce. Is sampla\u00ed maithe iadsan go l\u00e9ir de na gh\u00e1thoga at\u00e1
  le f\u00e1il timpeall ar Chuan Chorca\u00ed.\\n\\nCad \u00e9 an t-am is fearr le
  cuairt a thabhairt air?\\n\\nN\u00ed z\u00fa n\u00f3 p\u00e1irc fiadh\u00fala \u00e9
  Bogaigh Oile\u00e1n an Harp\u00faraigh, mar sin n\u00ed f\u00e9idir linn gealltan\u00e1s
  a thabhairt go bhfeicfidh t\u00fa aon fhiadh\u00fala ar leith. Sin r\u00e1ite, bionn
  rud \u00e9igin le feice\u00e1il i gc\u00f3na\u00ed agus d\u00e1 mhini\u00fac a thabharfaidh
  t\u00fa cuairt, \u2018s\u00e9 is m\u00f3 a feicfidh t\u00fa. Le linn an earraigh
  agus an tsamhraidh b\u00ed ag faire amach do bhl\u00e1thanna agus d\u2019fheithidi
  in aice leis na cos\u00e1in d\u00falra agus b\u00ed ag faire amach ar an bhf\u00e1inleog,
  ar an gcaisil\u00edn dearg agus ar an ploib\u00e1n m\u00f3in\u00e9ir a bhionn ag
  nead\u00fa ag an am sin den bhliain. Chun an seans is fearr a bheith agat na h-\u00e9in
  uisce a feiscint, t\u00e9ir go dt\u00ed na foluch\u00e1in uair an chloig roimh n\u00f3
  i ndiaidh an l\u00e1in mara - mar sin is fi\u00fa s\u00fail a choime\u00e1d ar an
  taoide! Is iontach an m\u00e9id \u00e9an a bhionn le feiscint nuair a bhionn rabharta
  ann. I rith an gheimhr\u00eddh, bionn fuilleach \u00e9an le feiscint am ar bith
  an l\u00e1ib. M\u00e1 bhionn t\u00fa anseo nuair a bhionn an Seabhac Seilge ag fiach,
  seans go mbeidh na h-\u00e9in scanraithe as an \u00e1it, ach n\u00e1 b\u00ed buartha,
  tiocfaidh siad ar ais go luath!\\n\\n* T\u00e1bla\u00ed Taoide Chuan Chorca\u00ed
  - https://www.sailing.ie/Tides/Cork-Harbour\\n\\nBogaigh Oile\u00e1n an Harp\u00faraigh
  agus an Curaclam Bunscoile\\n\\nIs seomra ranga amuigh faoin aer \u00e9 Bogaigh
  Oile\u00e1n an Harp\u00faraigh, \u00e1it inar f\u00e9idir gach \u00e1bhar ar an
  gcuraclam scoile a mh\u00faineadh i sl\u00ed fheidhmeach agus spreag\u00fail. Mar
  shampla, is f\u00e9idir ealain, dr\u00e1ma agus ceol a chruth\u00fa \u00f3n inspior\u00e1id
  at\u00e1 le f\u00e1il \u00f3n domhan n\u00e1d\u00fartha. Is f\u00e9idir mata a mh\u00faineadh
  tr\u00ed imirce na n-\u00e9an agus baineann forbairt na mbogach leis an gcuraclam
  SESE agus staire. Gan dabhdt t\u00e1 go leor bainte ag imirce na n-\u00e9an le t\u00edreolas,
  ag ceangailt leis na tiortha go l\u00e9ir go dt\u00e9ann na h-\u00e9in difr\u00edula
  ann, agus is scileanna ola\u00edochta iad an anal\u00eds agus an bhreathn\u00f3ireacht.\\n\\nNuair
  a bh\u00edmid ag cur s\u00edos ar fhuaim na n-\u00e9an, t\u00e1imid ag d\u00e9ile\u00e1il
  le cumars\u00e1id agus teanga agus is corpoideachas \u00e9 aon obair a bh\u00edonn
  \u00e1 dh\u00e9anamh amuigh san aer. Nios t\u00e1bhachta\u00ed f\u00f3s, t\u00e1
  go leor fianaise go bhfuil ceangal idir an domhan n\u00e1d\u00fartha agus \u00e1r
  sl\u00e1inte intinne agus fisici\u00fail agus d\u00e1 bhri sin, is f\u00e9idir teacht
  ar an curaclam SPHE tri chuairt a thabhairt orainn.\\n\\nBa iad caomhn\u00fa an
  d\u00falra agus oideachas an d\u00e1 sprioc ba mh\u00f3 a bh\u00ed againn agus sinn
  ag forbairt an tearmainn seo. N\u00edl aon sl\u00ed n\u00edos fearr chun meas a
  forbairt ar an oidhreacht n\u00e1d\u00fartha at\u00e1 ar leac an dorais againn n\u00e1
  an t-oideachas seo a chur ar f\u00e1il i sl\u00ed idirghn\u00edomhach amuigh faoin
  aer. T\u00e1imid ag s\u00fail go gcabhr\u00f3idh an leabhr\u00e1n seo le leanai
  chun taiscealadh a dh\u00e9anamh agus iad ag foghlaim faoi na h-iontais n\u00e1d\u00fartha
  at\u00e1 againn anseo i mBogaigh Oile\u00e1n an Harp\u00faraigh.\\n\\nT\u00e1 gach
  eolas faoi Bhogaigh Oile\u00e1n an Harp\u00faraigh agus an fiadh\u00falra at\u00e1
  ann ar \u00e1r su\u00edomh idirl\u00edn ag www.harpersislandwetlands.ie. T\u00e1
  gach eolas ann maidir le h-amanta oscailte, conas teacht orainn agus eolas insroichteachta.\\n\\nSeoladh
  r\u00edomhphost: email@example.com\\n\\nFacebook - https://www.facebook.com/harpersislandwetland\\n\\nTwitter
  - @IslandWetlands\\n\\nBuiochas\\n\\nBa mhaith le Gr\u00fapa Sti\u00fartha Bhogaigh
  Oile\u00e1n an Harp\u00faraigh buiochas a ghabh\u00e1il le Riana Parsons agus Jim
  Wilson mar gheall ar an leabhr\u00e1n seo a chur le ch\u00e9ile. Ba mhaith linn
  buiochas a ghabh\u00e1il le na m\u00fainteoir\u00ed seo a leanas:\\n\\n\u00c1ine
  de Ris, Dave O\u2019Leary, Margaret O\u2019Leary, Paul Carmody, Emma McCarthy agus
  Willie McSweeney as ucht a gcuid saineolais a roinnt linn. Buiochas speisialta le
  Conor O\u2019Brien, Allan Farrell, Tom Gittings and Paul Moore mar gheall ar an
  gcabhair a thug siad d\u00fainn. Buiochas m\u00f3r leis an RSPB toisc cead a thabhairt
  d\u00fainn achmhainn\u00ed oideachais a bhaineann leo a \u00fas\u00e1id sna cluich\u00ed
  timpeallachta sa leabhr\u00e1n seo. Emma Verling agus Micha\u00ebl \u00d3 Fearghail
  a d\u2019aistrigh go Gaeilge.\\n\\n\u00das\u00e1id an comp\u00e1s lena thaispe\u00e1int
  an bhfuil rud \u00e9igin \u00f3 thuaidh, \u00f3 dheas, soir n\u00f3 siar.\\n\\nT\u00e1
  na f\u00e9ileac\u00e1in\\n\\n\u00d3 ...........................................\\n\\nT\u00e1
  an geata\\n\\n\u00d3 ............................................\\n\\nT\u00e1 an
  faireoir \u00e9an\\n\\n\u00d3 ............................................\\n\\nT\u00e1
  na lachain\\n\\n\u00d3 ............................................\\n\\nBogaigh
  Oile\u00e1n an Harp\u00faraigh\\n\\nF\u00e1ilte go Saol Ghaeil!\\n\\nT\u00e1 cl\u00e1r
  gn\u00edomhaiochtai curtha le ch\u00e9ile againn chun cabhr\u00fa le cuairteoir\u00ed
  \u00f3ga, a gcaire, a gcomhdhalta\u00ed ranga agus a dteaghlaigh an chuid is m\u00f3
  a dh\u00e9anamh de Bhogaigh Oile\u00e1n an Harp\u00faraigh. Spreagann \u00e1r son\u00f3ig
  \u201cGael an Guilbneach Earrdhubbh\u201d p\u00e1ist\u00ed chun imeachta agus cleachtadh
  a bheith acu ag f\u00e9achaint, ag cruth\u00fa agus ag ini\u00fachadh.\\n\\nGael
  is ainm dom agus is Guilbneach Earrdhubbh m\u00e9.\\n\\nT\u00e1 fada agus fada agam.
  Rugadh me i agus eitl\u00edm go gach L\u00fanasa agus fanaim ann go dt\u00ed Mi
  Aibre\u00e1in. Is maith liom a bheith anseo mar n\u00edl s\u00e9 r\u00f3 n\u00e1
  r\u00f3 riabh agus t\u00e1 go leor agus beaga le f\u00e1il agam sa l\u00e1ib agus
  sna p\u00e1irceanna timpeall ar Chuan Chorca\u00ed. Is liom Bogaigh Oile\u00e1n
  an Harp\u00faraigh. Is iontach an \u00e1it \u00ed seo nuair a bh\u00edonn an taoide
  ard. T\u00e1 s\u00e9 an-s\u00e1bh\u00e1ilte anseo agus fanaim le go leor de mo chairde
  go dt\u00ed go dt\u00e9ann an taoide amach, nuair is f\u00e9idir liom filleadh ar
  an bhfiach ar\u00eds sa l\u00e1ib. \u00c1gus m\u00e9 ag fanacht leis an taoide,
  glanaim mo agus t\u00f3gaim.\\n\\nAg Bogaigh Oile\u00e1n an Harp\u00faraigh is f\u00e9idir
  leat spraoi a bheith agat ag ini\u00fachadh an fhiadh\u00falra a ch\u00f3na\u00edonn
  ann. T\u00e1 feicithe agam anseo. Is f\u00e9idir ar an fhiadh\u00falra, leis na
  h-\u00e9in, na bl\u00e1thanna a picti\u00fair a tharraingt, grianghraif a th\u00f3gaint
  agus go leor eile. T\u00e1 s\u00fail agam go mbainfidh t\u00fa taitneamh as na gn\u00edomhaiochtai
  spraoi seo. Agus n\u00e1 dearmad, is \u00e9 an rud is t\u00e1bhachta\u00ed n\u00e1
  go leor spraoi a bheith agat nuair a thugann t\u00fa cuairt ar Bogaigh Oile\u00e1n
  an Harp\u00faraigh!\\n\\nCos\u00e1n D\u00falra Ghaeil\\n\\nCabhraigh le Gael an
  Cruid\u00edn a aimsi\u00fa.\\n\\nAn m\u00f3 feithid at\u00e1 le feice\u00e1il sa
  phicti\u00far?\\n\\nBogaigh Oile\u00e1n an Harp\u00faraigh\\n\\nC\u00e9 a ch\u00f3na\u00edonn
  sna bogaigh?\\n\\nScr\u00edobh na hainmneacha. Ansin dathaigh an picti\u00far.\\n\\nFEITHID\\nLACHA\\nIASC\\nSEILIDE\\nR\u00c9AD\u00d3\\nPORTA\\n\\nAimsigh
  na difr\u00edochta\u00ed!\\n\\nT\u00e1 na freagra\u00ed bun os cionn ag bun an leathanaigh.\\n\\nT\u00e1
  Gael an Guilbneach Earrdhubh an-s\u00e1sta inniu agus \u00e9 amuigh ag faire ar
  dhaoine.\\n\\nAn f\u00e9idir leat 15 dhifr\u00edocht a aimsi\u00fa idir an d\u00e1
  chart\u00fan? T\u00e1 cuid acu \u00e9asca. T\u00e1 cuid eile acu nach bhfuil!\\n\\n\u00c1ireamh
  \u00e9an na mbogach\\n\\nCaithfidh t\u00fa na h\u00e9in go l\u00e9ir ar an mbogach
  a chomhaireamh sula mbaill\u00edonn siad leo! Is \u00e9 an bealach is fearr chun
  \u00e9 seo a dh\u00e9anamh n\u00e1 speiceas amh\u00e1in a chomhaireamh ag an am.
  Ins\u00edonn na huimhreacha th\u00edos duit c\u00e9 mh\u00e9ad de gach speiceas
  at\u00e1 amuigh ansin inniu. C\u00e9 chomh tapa agus is f\u00e9idir leat iad go
  l\u00e9ir a aimsi\u00fa?\\n\\nAn f\u00e9idir leat na h\u00e9in bogaigh a aithint?
  F\u00e9ach ar na pain\u00e9il aitheanta\u00ed sna folach\u00e1in.\\n\\n\u00a9 Jim
  Wilson/Mark Carmody 2020\\n\\nAimsigh na Feithid\u00ed\\n\\nT\u00e1 iliomad mionainmhithe
  ina gc\u00f3na\u00ed ar Bhogaigh Oile\u00e1n an Harp\u00faraigh, le go leor feithid\u00ed
  ina measc. B\u00edonn s\u00e9 cinn de chosa ag feithid\u00ed. An m\u00f3 feithid
  is f\u00e9idir leat a aimsi\u00fa ar an leathanach seo? (Freagra\u00ed ag bun an
  leathanaigh)\\n\\nCl\u00e1irseach\\n\\nLeamhan\\n\\nF\u00e9ileac\u00e1n\\n\\nB\u00f3in
