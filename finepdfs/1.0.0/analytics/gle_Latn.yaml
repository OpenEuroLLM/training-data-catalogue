  A  \\nB  \\n\\\\[28\\\\text{cm}\\\\]\\n\\n7. B\u00edodh $\\\\pi = 3.14$. Faigh achar
  gach teasc\u00f3ige i gCeist 6 thusa. B\u00edodh do fhreagra ceart go dt\u00ed 2
