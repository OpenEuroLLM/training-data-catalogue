  an 23 Samhain 1992 in Nashville, Tennessee.\\n\\n2. Bh\u00ed \u00e1thas ar aos \u00f3g
  na t\u00edre seo nuair a th\u00e1inig Miley Cyrus go Baile \u00c1tha Cliath i m\u00ed
  na Nollag. Bh\u00ed dh\u00e1 cheolchoirm aici in O2 Bhaile \u00c1tha Cliath. Bhuail
  si lena lucht lean\u00fana nuair a chuaigh s\u00ed amach ag siopad\u00f3ireacht.
  Labhair s\u00ed le Ryan Tubridy ar an *Late Late Show*.\\n\\n3. L\u00e9irigh Miley
  Cyrus suim san aisteoireacht agus i an-\u00f3g. Thug a tuimseitheoir\u00ed gach
  cabhair di. Thosaigh s\u00ed le r\u00f3ilanna beaga ach n\u00edorbh fhada gur bhain
  s\u00ed cl\u00fa agus c\u00e1il amach leis an bpr\u00edomhr\u00f3l sa tsraith teilifise
  *Hannah Montana* in 2006.\\n\\n4. Sa tsraith teilifise seo is gn\u00e1thdh\u00e9ag\u00f3ir
  \u00ed Miley Cyrus. Miley Stewart an t-ainm at\u00e1 uirthi sa chl\u00e1r. Ach n\u00ed
  mar a sh\u00edltear a bhitear. T\u00e1 saol eile ag Miley Stewart. Is popr\u00e9alta
  domhanda i freisin faoin ainm Hannah Montana. N\u00edl a fhios ag aon duine faoi
  seo ach a hathair, a dearth\u00e1ir agus c\u00fapla cara.\\n\\n5. T\u00e1 tr\u00ed
  albam curtha amach ag Miley Cyrus, *Meet Miley Cyrus*, *Breakout* agus *The Time
