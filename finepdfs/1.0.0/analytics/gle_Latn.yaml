  www.ihrec.ie\\nTwitter/@_ihrec\"", "\"6.9.\u00a0Na\u00a0Me\u00e1in\u00a0Chumars\u00e1ide\\n\\nNa\u00a0me\u00e1in\u00a0chumars\u00e1ide\u00a0agus\u00a0an\u00a0phlean\u00e1il\u00a0teanga\\n\\nT\u00e1
  l\u00e1ithreacht na Gaelainne sna me\u00e1in chumars\u00e1ide r\u00edth\u00e1bhachtach
  mar r\u00e9imse taca\u00edochta don teanga. T\u00e1 an taca\u00edocht/seirbh\u00eds
  at\u00e1 ar f\u00e1il sna me\u00e1in chumars\u00e1ide don mhionteangach chomh t\u00e1bhachtach
  c\u00e9anna leis an sol\u00e1thar oideachais agus na taca\u00edochta\u00ed rialtais
  at\u00e1 ar f\u00e1il don\u00a0mhionteanga\u00a0dar\u00a0le\u00a0Fishman,\u00a01991:357.\\n\\nNa\u00a0me\u00e1in\u00a0chumars\u00e1ide\u00a0i\u00a0gCorca\u00a0Dhuibhne\\n\\nT\u00e1
  iriseoir amh\u00e1in fostaithe ag TG4 i gCorca Dhuibhne agus t\u00e1 comhlacht neamhsple\u00e1ch
  teilif\u00edse lonnaithe sa Daingean ag d\u00e9anamh cl\u00e1racha ceoil agus faisn\u00e9ise
  do TG4. T\u00e1 sti\u00faideo ag\u00a0Raidi\u00f3\u00a0na\u00a0Gaeltachta\u00a0i\u00a0mBaile\u00a0na\u00a0Gall\u00a0agus\u00a012\u00a0fostaithe\u00a0ann.\\n\\nT\u00e1
  an Ghaelainn tar \u00e9is deis a thabhairt do roinnt d''\u00f3ige Chorca Dhuibhne
  postanna ar ardchaighde\u00e1n a bhaint amach sna me\u00e1in chumars\u00e1ide Ghaeilge
  agus Bh\u00e9arla sa Ghaillimh agus\u00a0i\u00a0mBaile\u00a0\u00c1tha\u00a0Cliath\u00a0\u2013\u00a0le\u00a0TG4,\u00a0Raidi\u00f3\u00a0na\u00a0Gaeltachta,\u00a0Tuairisc.ie\u00a0agus\u00a0RT\u00c9.\\n\\nT\u00e1
  Bord Oideachais agus Oili\u00fana Chiarra\u00ed tosnaithe ag forbairt campa\u00ed
  samhraidh cumars\u00e1ide do\u00a0dh\u00e9ag\u00f3ir\u00ed\u00a0\u00f3ga\u00a0sa\u00a0d\u00fathaigh.\\n\\nBail\u00edodh
  bearta na r\u00e9imse seo tr\u00ed chruinnithe a re\u00e1cht\u00e1il leis na p\u00e1irtithe
  leasmhara thuas. Baineann beart 6.9.1 le traen\u00e1il \u00f3ige sa chumars\u00e1id/caitheamh
  aimsire don \u00f3ige a fhorbairt i gCorca Dhuibhne agus baineann beart 6.9.2 le
  togra saibhrithe teanga idir Raidi\u00f3 na Gaeltachta agus dalta\u00ed bunscoile/iarbhunscoile.
  \u200bT\u00e1 beart 6.9.2 ag brath go hioml\u00e1n ar an bpr\u00f3iseas\u00a0plean\u00e1la\u00a0teanga\u00a0chun\u00a0\u00e9\u00a0a\u00a0chur\u00a0i\u00a0bhfeidhm.\\n\\nBeart\u00a06.9.1\u00a0Campa\u00ed\u00a0Cumars\u00e1ide\u00a0d''\u00d3ige\u00a0an\u00a0Cheantair\u00a0a\u00a0fhorbairt\\n\\nBeart\u00a06.9.2\u00a0RnaG\u00a0\u2013\u00a0Freastal\u00a0ar\u00a0an\u00a0\u00d3ige\u00a0tr\u00ed\u00a0chom\u00f3rtais\u00a0Raidi\u00f3\u00a0idir\u00a0bunscoileanna\u00a0a\u00a0fhorbairt\"",
  "\"1\\n\\nIntroduction to the Dublin Lockout\\n\\nIreland in 1913 was a country
  in turmoil, divided by the issue of Home Rule: self-government for Ireland. Nationalists
  saw their goal within reach whereas Ulster Unionists, led by Dublin MP Edward Carson,
  prepared for resistance by force. It was against this backdrop that a violent industrial
  con\ufb02ict was to take centre stage: the Dublin Lockout.\\n\\nTramways Company
  (DUTC), who had sacked hundreds of staff suspected of Irish Transport and General
  Workers Union (ITGWU) membership in the preceding weeks. He aimed to stamp out the
  in\ufb02uence of ITGWU leader Jim Larkin, who had organised Dublin''s unskilled
  and semi-skilled workforce and given voice to their pent-up anger.\\n\\nAt 9.40am
  on 26 August, drivers and conductors  left their trams on O''Connell Street and
  began the strike that would become the Dublin Lockout.\\n\\nThe tramworkers'' protest
  was by way of a response to William Martin Murphy, owner of the Dublin United\\n\\nFrithdh\u00fanadh
  Bhaile \u00c1tha Cliath\\n\\nT\u00edr ina c\u00edor thuathail ba ea \u00c9ire i
  1913, \u00ed roinnte ag ceist an Rialtais D\u00fachais \u2013 is \u00e9 sin, f\u00e9inrialtas
  d''\u00c9irinn. Chreid n\u00e1isi\u00fanaithe nach raibh a sprioc i bhfad uathu.
  Ag an am c\u00e9anna, bh\u00ed Aontachtaithe Uladh, faoi cheannas Edward Carson,
  MP Bhaile \u00c1tha Cliath, ag ullmh\u00fa chun cur ina aghaidh sin tr\u00ed fhor\u00e9igean.
  In aghaidh an ch\u00falra sin, bh\u00ed coinbhleacht fhor\u00e9igneach thionscla\u00edoch
  ar t\u00ed teacht chun cinn agus aird an phobail a tharraingt; ba \u00ed an choinbhleacht
  sin Frithdh\u00fanadh Bhaile \u00c1tha Cliath.\\n\\nAg 9.40am ar an 26 L\u00fanasa,
  d''imigh tiom\u00e1naithe agus sti\u00farth\u00f3ir\u00ed \u00f3na gcuid tramanna
  ar Sr\u00e1id U\u00ed Chonaill agus thosaigh siad an stailc ar a dtabharfa\u00ed
  Frithdh\u00fanadh Bhaile \u00c1tha Cliath uirthi.\\n\\nFollowing the tram workers''
  actions, Murphy ''locked out'' strikers and installed non-union workers, called
  ''scabs'' by trade unionists. Disputes spread across Dublin until, ultimately, some
  20,000 workers were involved in strikes and lockouts. Violence also spread quickly.
  The \ufb01nal \ufb01ve days of\\n\\nRinneadh ag\u00f3id na n-oibrithe tram mar fhreagairt
  do William Martin Murphy, \u00fain\u00e9ir Chomhlacht Trambheala\u00ed Aontaithe
  Bhaile \u00c1tha Cliath (DUTC), a bh\u00ed tar \u00e9is an b\u00f3thar a thabhairt
  do na c\u00e9adta ball foirne a measadh a bheith p\u00e1irteach i gCeardchumann
  Oibrithe Iompair agus Ilsaothair na h\u00c9ireann (ITGWU) sna seachtain\u00ed roimhe.
  Bh\u00ed s\u00e9 mar aidhm aige deireadh a chur leis an tionchar a bh\u00ed ag Jim
  Larkin, ceannaire ITGWU, a d''eagraigh lucht saothair neamhoilte agus leathoilte
  Bhaile \u00c1tha Cliath agus a chuir in i\u00fal a gcuid feirge a bh\u00ed br\u00faite
  faoi chois.\\n\\nTar \u00e9is ghn\u00edomhartha na dtiom\u00e1naithe tram, ''d''fhrithdh\u00fan''
  Murphy na stailceoir\u00ed agus thug s\u00e9 a gcuid post d''oibrithe nach raibh
  p\u00e1irteach i gceardchumainn, n\u00f3 ''s\u00e1raitheoir\u00ed stailce''. Leath
  na d\u00edosp\u00f3id\u00ed ar fud Bhaile \u00c1tha Cliath go dt\u00ed go raibh
  20,000 oibr\u00ed\\n\\nDUBLIN\\nTHE\\nLOCKOUT\\n\\nAugust saw an increasing sense
  of disorder in Dublin, culminating in the events of ''Bloody Sunday'' (31 August
  1913).This led the British Trades Union Congress (TUC) to support the strikers and
  transformed a local dispute into a major industrial battle. Undeterred, Murphy persuaded
  400 Dublin employers to adopt his ''lock out'' strategy and up to 25,000 workers
  were laid off.\\n\\nThe dispute continued until early 1914. It was unprecedented
  in scale and ferocity and remains the largest industrial con\ufb02ict in Irish history.\\n\\np\u00e1irteach
  i stailceanna agus i bhfrithdh\u00fanta\u00ed. Leath an for\u00e9igean go gasta
  freisin. Th\u00e1inig m\u00e9ad\u00fa ar an ainriail i mBaile \u00c1tha Cliath le
  linn na c\u00faig l\u00e1 dheireanacha de mh\u00ed L\u00fanasa, a th\u00e1inig chun
  buaice le heachtra\u00ed ''Dhomhnach na Fola'' (an 31 L\u00fanasa 1913).\\n\\nIs
  \u00e9 an toradh a bh\u00ed aige sin gur thug Comhdh\u00e1il Ceardchumann na Breataine
  taca\u00edocht do na stailceoir\u00ed agus go ndearnadh m\u00f3rchomhrac tionscla\u00edoch
  de dh\u00edosp\u00f3id \u00e1iti\u00fail. \u00c9 diongbh\u00e1ilte, chuir Murphy
  ina lu\u00ed ar 400 fost\u00f3ir i mBaile \u00c1tha Cliath glacadh lena strait\u00e9is
  ''frithdh\u00fanta'' agus leagadh suas le 25,000 oibr\u00ed as.\\n\\nBh\u00ed an
  d\u00edosp\u00f3id ar si\u00fal go dt\u00ed go luath sa bhliain 1914. Bh\u00ed s\u00ed
  gan fasach \u00f3 thaobh sc\u00e1la agus f\u00edochmhaire de agus t\u00e1 s\u00ed
  f\u00f3s ar an gcoinbhleacht thionscla\u00edoch is m\u00f3 i stair na h\u00c9ireann.\\n\\n2\\n\\nDublin
  1913: a divided city. The city centre contained tenements and small dwellings where
  a third of the population lived, often in abject poverty. Unskilled labourers earned
  between 15 shillings and \u00a31 for working 60 hours a week.\\n\\nOf the 25,882
  families living in tenements, 80% lived in one room and 1560 families lived in cellars.\\n\\nDeath
  rates were much higher than in other British cities, including Belfast. The infant
  mortality rate was especially high at 160 per 1000 live births, compared with 153
  in Belfast and 96 in Bristol.\\n\\nBaile \u00c1tha Cliath 1913: Cathair Roinnte\\n\\nBaile
  \u00c1tha Cliath 1913: cathair roinnte. Is \u00e9 a bh\u00ed i l\u00e1r na cathrach
  n\u00e1 tion\u00f3nt\u00e1in agus teach\u00edn\u00ed inar mhair aon trian den daonra,
  agus mhair siad go f\u00edorbhocht go minic. Fuair oibrithe neamhoilte idir 15s
  agus \u00a31 ar son 60 uair oibre in aghaidh na seachtaine.\\n\\nI gc\u00e1s na
  25,882 teaghlach a ch\u00f3naigh sna tion\u00f3nt\u00e1in, ch\u00f3naigh 80% d\u00edobh
  i seomra amh\u00e1in agus ch\u00f3naigh 1560 teaghlach i sil\u00e9ir.\\n\\nBh\u00ed
  r\u00e1ta\u00ed b\u00e1is i bhfad n\u00edos airde i mBaile \u00c1tha Cliath n\u00e1
  mar a bh\u00ed siad i gcathracha na Breataine n\u00f3 i mB\u00e9al Feirste. Bh\u00ed
  r\u00e1ta mortla\u00edochta na na\u00edon\u00e1n go h\u00e1irithe ard, agus \u00e9
  cothrom le 160 b\u00e1s in aghaidh 1000 breith beo, i gcompar\u00e1id le 153 b\u00e1s
  i mB\u00e9al Feirste agus le 96 b\u00e1s in Bristol.\\n\\nYet, the Irish capital
  also had gracious suburbs with clean air, modern sanitation and access to the surrounding
  mountains and sea. A child born into an upper-middleclass professional family was
  22 times more likely to celebrate its \ufb01rst birthday than a child who was born
  in the slums.\\n\\nHousing and health were the responsibility of local government.
  However, almost a quarter of slum landlords were city councillors. Con\ufb02icts
  of interest, complacency and corruption were commonplace. Inevitably, the authorities''
  failure to address these issues led to increasingly vocal discontent and organised
  protest.\\n\\nAch bh\u00ed bruachbhailte bre\u00e1tha i bpr\u00edomhchathair na
  h\u00c9ireann freisin \u2013 \u00e1it ina raibh aer glan, sl\u00e1int\u00edocht
  nua-aimseartha agus rochtain ar na sl\u00e9ibhte agus ar an tr\u00e1 m\u00e1guaird.
  Bh\u00ed leanbh a t\u00f3gadh i dteaghlach gairmi\u00fail uachtarach a 22 oiread
  n\u00edos d\u00f3ch\u00fala a ch\u00e9ad bhreithl\u00e1 a cheili\u00faradh n\u00e1
  mar a bh\u00ed leanbh a t\u00f3gadh sna pl\u00f3dcheantair.\\n\\nBh\u00ed an rialtas
  \u00e1iti\u00fail freagrach as tith\u00edocht agus as sl\u00e1inte. Mar sin f\u00e9in,
  bh\u00ed beagnach aon cheathr\u00fa de na tiarna\u00ed tal\u00fan sna pl\u00f3dcheantair
  ina gComhairleoir\u00ed Cathrach freisin. Coitianta a bh\u00ed coinbhleachta\u00ed
  leasa, bolg\u00e1s agus \u00e9illi\u00fa. \u00d3s rud \u00e9 gur theip ar na h\u00fadar\u00e1is
  \u00e1iti\u00fala dul i ngleic leis na ceisteanna sin, bh\u00ed s\u00e9 dosheachanta
  go dtiocfadh m\u00e9ad\u00fa ar an m\u00edsh\u00e1samh agus ar an ag\u00f3id eagraithe.\\n\\nDUBLIN\\nTHE\\nLOCKOUT\"",
  "\"R\u00e9amhr\u00e1\\n\\n\u00c1ine N\u00ed Chonghaile https://doi.org/10.13025/3vjy-nz35
  https://doi.org/10.13025/3vjy-nz35\\n\\nSeo \u00e9 an t-aon\u00fa heagr\u00e1n d\u00e9ag
  de An Reivi\u00fa, iris \u00f3 na mic l\u00e9inn at\u00e1 ag dul don MA (L\u00e9ann
  Teanga). \u00dadar r\u00edm\u00e9id a leith\u00e9id d''fhoilseach\u00e1n a bheith
  ar f\u00e1il, \u00e9 a bheith piarmheas\u00fanaithe agus \u00e1bhar ar f\u00e1il
  ann \u00f3 raon discipl\u00edn\u00ed a thagann faoi chl\u00f3ca an l\u00e9inn teanga.
  Is bre\u00e1 a fheice\u00e1il freisin go bhfuil f\u00e1ilte san iris roimh \u00fadair
  \u00f3 na hinstiti\u00faid\u00ed tr\u00ed\u00fa leibh\u00e9al ar fud na t\u00edre.\\n\\nAg
  breathn\u00fa ar an raon leathan discipl\u00edn\u00ed a chl\u00fada\u00edtear san
  iris, n\u00ed f\u00e9idir gan suntas a thabhairt don fhor\u00e1s at\u00e1 tagtha
  ar shaothr\u00fa ''chuile ghn\u00e9 acu \u00f3n uair a buna\u00edodh Institi\u00faid
  Teangeola\u00edochta \u00c9ireann sna seacht\u00f3\u00edd\u00ed. Sna blianta tosaigh
  sin, agus ceobhr\u00e1n na polait\u00edochta ag lu\u00ed ar shaol\u00fa na hinstiti\u00faide
  agus ar obair an cheannr\u00f3da\u00ed, Colm\u00e1n \u00d3 hUallach\u00e1in, chaithfeadh
  gurbh \u00e9igean d\u00f3ibh si\u00fad a th\u00e1inig ina dhiaidh cos\u00e1n c\u00faramach
  a threabhadh. Ach d''\u00e9irigh le foireann chumasach scol\u00e1ir\u00ed a bh\u00ed
  ansin bunsraith ghairmi\u00fail oilte a chur faoi thaighde i r\u00e9ims\u00ed \u00e9ags\u00fala
  den teangeola\u00edocht agus foils\u00edodh an taighde sin i dtuarasc\u00e1lacha
  suntasacha chomh maith le hiris\u00ed rialta. An tr\u00e1th c\u00e9anna bh\u00ed
  scol\u00e1ir\u00ed eile sna col\u00e1ist\u00ed tr\u00ed\u00fa leibh\u00e9al ag tarraingt
  r\u00e9ims\u00ed den teangeola\u00edocht chucu f\u00e9in agus ag foilsi\u00fa in
  iris\u00ed \u00e9ags\u00fala. N\u00ed raibh discipl\u00edn na teangeola\u00edochta,
  mar a thuigtear sin anois, fairsing, m\u00e1 bh\u00ed s\u00e9 bunaithe ar chor ar
  bith, sa gcuid is m\u00f3 de na hinstiti\u00faid\u00ed tr\u00ed\u00fa leibh\u00e9al
  anseo. Bh\u00ed obair mh\u00f3r ar si\u00fal i dteangacha na hEorpa ag an am, go
  h\u00e1irithe sa bhFraincis, agus de r\u00e9ir a ch\u00e9ile tosa\u00edodh ag baint
  leasa as an taighde a bh\u00ed d\u00e9anta maidir le teagasc teangacha Eorpacha
  \u00f3 thaobh sainmh\u00edni\u00fa siollabas agus modheola\u00edocht theagasc na
  Gaeilge. Bh\u00ed borradh ag teacht faoi bhun\u00fa Ghaelscoileanna freisin. An
  d\u00e1 chloch ba mh\u00f3 ar an bpaidr\u00edn n\u00e1 staid na Gaeilge, a th\u00e1inig
  faoi bhrat na sochtheangeola\u00edochta, agus teagasc na teanga. T\u00e1 ailt agus
  l\u00e9irmheasanna bre\u00e1tha san iris seo ag c\u00edoradh mhodhanna teagaisc
  agus chur chuig\u00ed a bhfuil saothar na mblianta mar bhunsraith leo. N\u00ed luafaidh
  m\u00e9 na hailt n\u00e1 na l\u00e9irmheasanna ina gceann is ina gceann ach tr\u00e9asla\u00edm
  leis na h\u00fadair chumasacha a rinne an bhunobair agus leis an bhfoireann dh\u00edograiseach
  a chuir an iris ar f\u00e1il.\\n\\nAmach sna n\u00f3chaid\u00ed agus an t\u00edr
  ag teacht ar a cosa th\u00e1inig borradh cinni\u00fanach faoi staid na Gaeilge.
  Buna\u00edodh Teilif\u00eds na Gaeilge (TG4 anois), forbairt a chothaigh an tionscal
  f\u00edse ba bhonn leis na comhlachta\u00ed l\u00e9iri\u00fach\u00e1in agus as ar
  lean an d\u00e1 r\u00e9imse eile a chl\u00fada\u00edonn An Reivi\u00fa \u2013 cumars\u00e1id
  agus teicneola\u00edocht. Bh\u00ed beala\u00ed craolt\u00f3ireachta beo eile agus
  foilseach\u00e1in chl\u00f3ite th\u00e1bhachtacha, mar thaca roimh an teilif\u00eds.
  Chuir bun\u00fa Foinse tuilleadh bealaidh faoin roth. Tugadh c\u00e9im mh\u00f3r
  chun cinn le hacht\u00fa Acht na dTeangacha Oifigi\u00fala, 2003 agus leis an st\u00e1das
  a bhain an Ghaeilge amach san Aontas Eorpach \u00f3 2007 ar aghaidh. T\u00e1 cur
  s\u00edos san eagr\u00e1n seo den iris ar an obair mh\u00f3r a bh\u00edothas \u00e1
  d\u00e9anamh leis an st\u00e1das san Eoraip a bhaint amach. Leis an st\u00e1das
  sin, th\u00e1inig ceann eile de na fodhiscipl\u00edn\u00ed at\u00e1 comhartha ag
  An Reivi\u00fa chun cinn go m\u00f3r \u2013 an t-aistri\u00fach\u00e1n. T\u00e1
  alt bre\u00e1 san eagr\u00e1n seo faoin aistri\u00fach\u00e1n i bhfad siar. Nuair
  a buna\u00edodh an stat, dh\u00edrigh daoine aonair agus An G\u00fam ar th\u00e9acsanna
  scoile, ar aistri\u00fach\u00e1in chruthaitheacha agus ar shaothair chruthaitheacha
  a chur ar f\u00e1il, rud a d''fh\u00e1g scoth na saothar againn \u00f3 scoth na
  scr\u00edbhneoir\u00ed cruthaitheacha. Sna n\u00f3chaid\u00ed agus an reachta\u00edocht
  nua i bhfeidhm, th\u00e1inig \u00e9ileamh m\u00f3r \u00f3 institi\u00faid\u00ed
  st\u00e1it in \u00c9irinn agus \u00f3 na hinstiti\u00faid\u00ed Eorpacha ar aistri\u00fach\u00e1in
  ar ch\u00e1ip\u00e9is\u00ed oifigi\u00fala st\u00e1it, riarach\u00e1in, institi\u00fa\u00eddeacha
  agus dl\u00ed. B''\u00e9igean m\u00f3rfhorbairt bheacht a dh\u00e9anamh ar th\u00e9arma\u00edocht,
  ar fhasaigh teanga, ar chruinneas caighde\u00e1n agus ar bhogearra\u00edocht teicneola\u00edochta
  le t\u00e1irg\u00ed teanga a sheachadadh laistigh de spriocdh\u00e1ta\u00ed daingne
  c\u00fanga le freastal ar an \u00e9ileamh sin. Taobh le taobh leis sin, t\u00e1
  cos eile faoin st\u00f3l ag An Reivi\u00fa, an phlean\u00e1il teanga, raon a leathnaigh
  le foilsi\u00fa an pholasa\u00ed Rialtais Strait\u00e9is Fiche Bliain don Ghaeilge,
  2010. Cruth\u00fanas ar an bhfuirse sin ar fad na hailt agus na l\u00e9irmheasanna
  bre\u00e1tha sna discipl\u00edn\u00ed \u00e9ags\u00fala at\u00e1 san iris seo.\\n\\nAgus
  ina theannta sin uilig t\u00e1 na scr\u00edbhneoir\u00ed ag tabhairt faoi ghn\u00e9
  a mb\u00edodh drogall tabhairt faoi ar feadh scaithimh \u2013 an nasc n\u00e1d\u00fartha
  docheilte sin idir litr\u00edocht na Gaeilge agus litr\u00edocht an Bh\u00e9arla
  in \u00c9irinn. Sampla maith de sin an t-alt bre\u00e1 ar chompar\u00e1id idir obair
  Heaney agus saothar Chathail U\u00ed Shearcaigh. Nuair a tosa\u00edodh ag caint
  ar dt\u00fas ar an n\u00ed ar a tugadh An L\u00e9ann D\u00fachais, bh\u00edodh imn\u00ed
  ar dhaoine gurbh \u00ed an litr\u00edocht i nGaeilge a bheadh th\u00edos leis. Is
  l\u00e9ir anois gur minic gurb \u00e9 an chaoi a mhealltar tuilleadh l\u00e9itheoir\u00ed
  chuig an nGaeilge.\\n\\nCl\u00fada\u00edtear san iris seo \u00e1bhar \u00f3 theagasc
  na Gaeilge sa seomra ranga sa nGaeltacht agus lasmuigh den Ghaeltacht, an teagasc
  i measc an phobail go ginear\u00e1lta agus cur chuige ceardlann mar mhodh teagaisc,
  cleachtais teanga i gcumann mar an CLG, r\u00f3l na litr\u00edochta, aistri\u00fach\u00e1n
  \u00f3n nGaeilge agus an litr\u00edocht chompar\u00e1ideach chomh maith le hailt
  eolasacha ar ghn\u00e9ithe d\u00fachasacha mar an curach. Teist ar aon fhoilseach\u00e1n
  n\u00e1 an mbaineann an l\u00e9itheoir taithneamh as an l\u00e9itheoireacht agus
  an gcuirtear leis an eolas. D\u00e9antar amhlaidh anseo agus go raibh fada buan
  an iris agus mic l\u00e9inn a chotha\u00edonn an l\u00e9ann teanga seo. Tr\u00e9asla\u00edm
  leo.\"", "\"Tr\u00e1chtanna Oscailte le Claire Loftus, An Sti\u00farth\u00f3ir Ionch\u00faiseamh
  Poibl\u00ed\\n\\n18\u00fa Comhdh\u00e1il Bhliant\u00fail na nIonch\u00faistheoir\u00ed
  N\u00e1si\u00fanta\\n\\n25 Samhain 2017, Ionad Comhdh\u00e1la Chaisle\u00e1n Bhaile
  \u00c1tha Cliath\\n\\n___________________________________________________________\\n\\nA
  bhreithi\u00fana, a bhaill an Gharda S\u00edoch\u00e1na, a ionch\u00faisitheoir\u00ed
  agus a dhaoine uaisle. Is m\u00f3r an pl\u00e9isi\u00far dom f\u00e1ilte a chur
  romhaibh chuig 18\u00fa Comhdh\u00e1il Bhliant\u00fail na nIonch\u00faistheoir\u00ed
  N\u00e1si\u00fanta.\\n\\nBh\u00ed an t-\u00e1dh linn ar\u00eds aoi-chainteoir\u00ed
  an suimi\u00fala a fh\u00e1il agus d\u00edreoidh m\u00e9 orthu ar ball.\\n\\nMar
  th\u00fas, ba mhaith liom b\u00e1s br\u00f3nach an ch\u00e9ad Sti\u00farth\u00f3ir
  Ionch\u00faiseamh Poibl\u00ed Eamon Barnes a lua, a tharla n\u00edba luaithe an
  mh\u00ed seo. Ba mhaith linn \u00e1r gcomhbhr\u00f3n a ghabh\u00e1il do chlann Eamon
  agus d\u00e1 theaghlach s\u00ednte agus d\u00e1r gcomhghleaca\u00ed freisin, Joe
  Barnes BL, a mhac.\\n\\nM\u00e1s eol daoibh bh\u00ed Eamon i seilbh oifig an Sti\u00farth\u00f3ra
  Ionch\u00faiseamh Poibl\u00ed \u00f3 1975 go dt\u00ed go ndeachaigh s\u00e9 ar scor
  i 1999. Ba mh\u00f3r an taith\u00ed a chomhroinn s\u00e9 agus \u00e9 rannph\u00e1irteach
  i mbun\u00fa Chumann Idirn\u00e1isi\u00fanta na nIonch\u00faisitheoir\u00ed i 1995.
  Ba mh\u00f3r an on\u00f3ir d''\u00c9irinn agus \u00e9 ina uachtar\u00e1n den Chumann
  idir 1996 agus 1999. D''oibrigh s\u00e9 go dian chun misean an IAP a chomhl\u00edonadh
  d''fhonn na caighde\u00e1in is airde d''eitic agus de chleachtas ionch\u00faisimh
  a chur chun cinn agus bh\u00ed r\u00f3l r\u00edth\u00e1bhachtach aige maidir lena
  fhorbairt ina eagra\u00edocht dhomhanda. \u00d3 fuair s\u00e9 b\u00e1s fuaireamar
  an oiread \u00f3m\u00f3s \u00f3 ionch\u00faisitheoir\u00ed agus \u00f3 iar-ionch\u00faistheoir\u00ed
  \u00f3 ar fud an domhain a spreagadh ag a chur chuige ar bhonn prionsabail maidir
  le coireacht a ionch\u00faiseamh.\\n\\nMar a d\u00fairt m\u00e9 nuair a fuair s\u00e9
  b\u00e1s ba mh\u00f3r an meas bh\u00ed agam air. Mar shaor\u00e1naigh an st\u00e1it
  seo t\u00e1imid faoi chomaoin aige as an mbealach a bhunaigh s\u00e9 r\u00f3l an
  DPP, as a neamhsple\u00e1chas reacht\u00fail a dhearbh\u00fa agus as na caighde\u00e1in
  ionch\u00faisimh is airde a bhun\u00fa at\u00e1 f\u00f3s ina dtreoir d\u00fainn
  sa l\u00e1 ata inniu ann.\\n\\nGo luath ina thionacht labhair Eamon faoin d\u00fashl\u00e1n
  m\u00f3r de bheith ina ch\u00e9ad DPP. D\u00fairt s\u00e9 \\\"Nuair is ionann tusa
  agus an ch\u00e9ad duine i r\u00f3l ar bith n\u00ed m\u00f3r duit caighde\u00e1in
  chinnteoireachta a leagan s\u00edos, agus caighde\u00e1in cheartais, go d\u00f3chasach,
  ionas nach mbeidh ar do chomharba caighde\u00e1in a bhun\u00fa a ndearna tusa faill\u00ed
  ina leith\\\". T\u00e1 me cinnte gur f\u00e9idir liom a lua gur chomhl\u00edon se
  an d\u00fashl\u00e1n sin go tofa agus t\u00e1 na caighde\u00e1in a bhunaigh s\u00e9
  chomh \u00e1bhartha inniu agus a bh\u00ed siad riamh.\\n\\nBh\u00ed Eamon an-chomhfhiosach
  as \\\"dualgas d\u00fabailte\\\" an ionch\u00faisitheora mar a thagair s\u00e9 d\u00f3.
  N\u00ed amh\u00e1in nach m\u00f3r don ionch\u00faisitheoir a chinnti\u00fa go nd\u00e9antar
  gach duine ar cheart \u00e9 a ionch\u00faiseamh a ionch\u00faiseamh ach leis an
  d\u00edograis ch\u00e9anna n\u00ed m\u00f3r don ionch\u00faisitheoir a chinnti\u00fa
  nach nd\u00e9antar aon duine a ionch\u00faiseamh n\u00e1r cheart \u00e9 ionch\u00faiseamh.
  Ba ghn\u00e9 bhun\u00fasach \u00e9 seo den cheartas ina bhar\u00fail.\\n\\nBh\u00ed
  s\u00e9 an-chomhfhiosach freisin as a chinnti\u00fa nach nd\u00e9anfa\u00ed \u00e9igeart
  tromch\u00faiseach d''\u00edospartach coire mar thoradh ar chinneadh m\u00edcheart.
  I 1999 labhair s\u00e9 faoi \u00edospartaigh na\\n\\nTr\u00e1chtanna Oscailte le
  Claire Loftus, An Sti\u00farth\u00f3ir Ionch\u00faiseamh Poibl\u00ed\\n\\n18\u00fa
  Comhdh\u00e1il Bhliant\u00fail na nIonch\u00faistheoir\u00ed N\u00e1si\u00fanta\\n\\n25
  Samhain 2017, Ionad Comhdh\u00e1la Chaisle\u00e1n Bhaile \u00c1tha Cliath\\n\\n___________________________________________________________\\n\\ncoireachta
  agus an deacracht ina leith a bh\u00ed os comhair ionch\u00faisitheoir coinsiasach,
  idir na ceapa tuisle d''\u00e9igeart f\u00e9ideartha d''\u00edospartaigh, do dhaoine
  ionch\u00faisithe agus don phobal, agus na tortha\u00ed troma agus buana d\u00f3ibh
  si\u00fad ar a mb\u00edonn tionchar ag cinneadh ionch\u00faisitheora.\\n\\nT\u00e1
  s\u00e9 c\u00f3ir agus ceart chun smaoineamh ar chomh comhfhiosach agus a bh\u00ed
  Eamon Barnes maidir le leasanna \u00edospartaigh na coireachta, d\u00edreach roimh
  thos\u00fa Acht an Cheartais Choiri\u00fail (\u00cdospartaigh na Coireachta) 2017.
  Cuirim f\u00e1ilte roimh an Acht mar thrashu\u00ed threoir an AE maidir le cearta
  \u00edospartaigh na coireachta i ndl\u00ed na h\u00c9ireann, agus mar is eol daoibh,
  t\u00e1 iarmhairt infheicthe ina leith le d\u00e1 bhliain anois.\\n\\n\u00d3n Luan
  27 Samhain tiocfaidh an tAcht sin i bhfeidhm, gan dh\u00e1 fhor\u00e1il n\u00f3s
  imeachta san \u00e1ireamh \u2013 Alt 19 (2) agus Alt 30 lena leasa\u00edtear an
  tAcht um Fhianaise Choiri\u00fail 1992. Pl\u00e9ann na hailt sin leis na bearta
  speisialta \u00e9ags\u00fala at\u00e1 le glacadh i seomra\u00ed c\u00fairte \u00ed
  rith trialacha agus don chuid is m\u00f3 t\u00e1 na bearta \u00e1 gcur i bhfeidhm
  cheana f\u00e9in c\u00e9 go nd\u00e9antar iad a oibri\u00fa ar bhonn teoranta i
  gc\u00e1sanna \u00e1irithe.\\n\\nT\u00e1 s\u00fail agam go nd\u00e9anfar feasacht
  a mh\u00fascailt i measc an phobail i gcoitinne maidir leis an oiread ceart agus
  cosaint at\u00e1 ar f\u00e1il d''\u00edospartaigh \u00f3 ghn\u00edomhaireachta\u00ed
  \u00e9ags\u00fala a oibr\u00edonn laistigh den ch\u00f3ras dl\u00ed choiri\u00fail.\\n\\nBa
  mhaith liom \u00edospartaigh cionta gn\u00e9asacha a lua go h\u00e1irithe. Mar is
  eol daoibh le haghaidh an d\u00e1 bhliain seo a chuaigh thart thugamar c\u00faiseanna
  as \u00e1r gcinnt\u00ed gan ionch\u00faiseamh a dh\u00e9anamh, nuair is f\u00e9idir,
  maidir le gach catag\u00f3ir de chion. Thugamar faoi deara gur th\u00e1inig an chuid
  is m\u00f3 de na hiarratais ar ch\u00faiseanna \u2013 38% - \u00f3 ghear\u00e1naithe
  maidir le cionta gn\u00e9asacha. Is ionann l\u00edon na ngear\u00e1naithe i gcionta
  gn\u00e9asacha a iarrann athbhreithnithe agus cuid fi\u00fa n\u00edos airde de na
  hathbhreithnithe uile agus \u00e9 coibh\u00e9iseach le 42% de na hiarratais ar athbhreithni\u00fa
  a fuarthas. Nuair is ionann c\u00e1sanna um chionta gn\u00e9asacha agus timpeall
  ar 17% d\u00e1r gcomhaid ioml\u00e1na a fhaightear gach bliain t\u00e1 s\u00e9 dlisteanach
  an cheist a chur ''cad is c\u00fais leis an l\u00edon d\u00edr\u00e9ireach ard d''iarratais
  ar ch\u00faiseanna agus athbhreithni\u00fa ar ch\u00e1sanna?\\n\\nIs \u00e9 mo bhar\u00fail
  f\u00e9in go mbaineann c\u00faiseanna casta leis seo agus mar th\u00fasphointe n\u00ed
  m\u00f3r a admh\u00e1il gurb ionann cionta gn\u00e9asacha, tar \u00e9is c\u00e1sanna
  marfacha, agus an cine\u00e1l ciona is tromch\u00fais\u00ed. T\u00e1thar ag s\u00fail
  go mbeidh an-sp\u00e9is phearsanta ag gear\u00e1naithe le f\u00e1il amach c\u00e9n
  f\u00e1th nach ndearnadh ionch\u00faiseamh.\\n\\nAr an dara dul s\u00edos, t\u00e1
  an r\u00e1ta ionch\u00faisimh maidir le gear\u00e1in um chionta gn\u00e9asacha \u00edseal
  go compar\u00e1ideach. Uaireanta, is ionann c\u00e1sanna cionta gn\u00e9asacha agus
  roinnt de na c\u00e1sanna is casta agus d''fh\u00e9adfadh an cinneadh sna c\u00e1sanna
  maidir le neamh-ionch\u00faiseamh a bheith bunaithe ar roinnt facht\u00f3ir\u00ed.
  I mbeagnach gach c\u00e1s n\u00ed bh\u00edonn aon fhinn\u00e9 ann maidir leis an\\n\\nTr\u00e1chtanna
  Oscailte le Claire Loftus, An Sti\u00farth\u00f3ir Ionch\u00faiseamh Poibl\u00ed\\n\\n18\u00fa
  Comhdh\u00e1il Bhliant\u00fail na nIonch\u00faistheoir\u00ed N\u00e1si\u00fanta\\n\\n25
  Samhain 2017, Ionad Comhdh\u00e1la Chaisle\u00e1n Bhaile \u00c1tha Cliath\\n\\n___________________________________________________________\\n\\ngcion
  seachas an gear\u00e1na\u00ed. Nuair a bh\u00edonn aosaigh i gceist is f\u00e9idir
  nach mb\u00edonn aon d\u00edosp\u00f3id ann gur tharla gn\u00edomha\u00edocht ghn\u00e9asach
  de chine\u00e1l \u00e9igin ach is \u00e9 an cheist n\u00e1 cib\u00e9 an bhfuil fianaise
  imleor ann go raibh easpa comhthola ann ar thaobh an ghear\u00e1na\u00ed.\\n\\nI
  gc\u00e1sanna a bhaineann le gn\u00edomha\u00edocht ghn\u00e9asach le leanbh faoi
  aois 17 d''fh\u00e9adfadh go leor saincheisteanna a bheith i gceist lena n-\u00e1ir\u00edtear
  an d\u00fashl\u00e1n a bhaineann le fianaise a ghlacadh \u00f3 leana\u00ed an-\u00f3ga.
  I gc\u00e1sanna eile ina mb\u00edonn leana\u00ed i gceist d''fh\u00e9adfadh facht\u00f3ir\u00ed
  leasa phoibl\u00ed a bheith i gceist agus sna himthosca \u00e1irithe sin n\u00ed
  bh\u00edonn ionch\u00faiseamh de dh\u00edth i leith an ph\u00e1irt\u00ed eile at\u00e1
  ina leanbh freisin ar mhaithe le leas poibl\u00ed. Go minic is cinnt\u00ed s\u00e1r-chothromaithe
  na cinnt\u00ed sin agus teasta\u00edonn an-mhachnamh c\u00faramach uathu.\\n\\nSan
  am c\u00e9anna is f\u00e9idir linn agus d\u00e9anaimid cinneadh chun ionch\u00faisimh
  a fhreaschur i gc\u00e1sanna i dtaca le cionta gn\u00e9asacha nuair a tharla\u00edonn
  s\u00e9, tar \u00e9is athbhreithni\u00fa a dh\u00e9anamh, smaoin\u00edonn dl\u00edod\u00f3ir
  go bhfuil ionch\u00faiseamh inbhuanaithe agus go bhfuil s\u00e9 chun leasa phoibl\u00ed
  e a dh\u00e9anamh. Is beag an lion cinnt\u00ed a cuireadh ar ceal - 2% de na hiarratais
  ioml\u00e1na ar athbhreithni\u00fa i ngach catag\u00f3ir de chion. L\u00e9ir\u00edonn
  s\u00e9, \u00e1fach, t\u00e1 s\u00fail agam, go mbaineann br\u00ed leis an gceart
  athbhreithnithe at\u00e1 cumhdaithe anois sa reachta\u00edocht n\u00e1isi\u00fanta.\\n\\nCuirtear
  f\u00f3cas athnuaite le hacht\u00fa na reachta\u00edochta ar cheart \u00edospartach
  agus ar an d\u00f3igh a nd\u00e9antar c\u00e1sanna a phl\u00e9 go speisialta maidir
  le r\u00e9imse na coireachta gn\u00e9is. N\u00edos d\u00e9ana\u00ed an mhaidin seo
  cluinfimid \u00f3n saineola\u00ed dl\u00ed oirirc acad\u00fail an tOllamh Tom O''Malley
  faoin oiread cionta a tugadh isteach ag an Acht Dl\u00ed Coiri\u00fail (Cionta Gn\u00e9asacha)
  2017.\\n\\nT\u00e1imid bu\u00edoch as Tom as a chuid eolais a chomhroinnt linne
  ar\u00eds. T\u00e1 m\u00e9 ag s\u00fail lena bhfuil s\u00e9 le r\u00e1 d\u00fainn.\\n\\nIs
  \u00e9 mo bhar\u00fail go bhfuil deis ann anois d\u00fainn mar chleacht\u00f3ir\u00ed
  dl\u00ed agus mar ionch\u00faisitheoir\u00ed fuinneamh a chur in\u00e1r n-iarrachta\u00ed
  chun a chinnti\u00fa go mb\u00edonn an t-eisp\u00e9ireas is l\u00fa tr\u00e1ma is
  f\u00e9idir ag \u00edospartaigh na coireachta sa ch\u00f3ras dl\u00ed choiri\u00fail.\\n\\nD\u00e1
  bhr\u00ed sin cuirim f\u00e1ilte roimh an bhf\u00f3gra \u00f3n Rialtas maidir leis
  an mBille um N\u00f3s Imeachta Coiri\u00fail a chur in ord tosa\u00edochta don d\u00e9ile\u00e1il,
  i measc nithe eile, le n\u00f3sanna imeachta roimh thrialacha coiri\u00fala. D''fh\u00e9adfadh
  iarmhairt dhomhan a bheith ag \u00e9isteachta\u00ed athchurtha, m\u00e1 dh\u00e9antar
  iad ar dh\u00f3igh \u00e9ifeachtach, ar \u00e9ifeacht\u00falacht agus ar chostas
  an phr\u00f3isis thrialaigh. Dh\u00e9anfa\u00ed eisp\u00e9ireas na n-\u00edospartach
  a fheabhs\u00fa le h\u00e9isteachta\u00ed athchurtha a thugtar ar t\u00ed fianaise
  a thabhairt go dt\u00ed go bhfaigheann siad amach go nd\u00e9anfar an triail a cur
  siar, fi\u00fa le haghaidh roinnt laethanta, mar gheall ar shaincheisteanna dl\u00ed
  \u00e9ags\u00fala.\\n\\nC\u00e9 go bhf\u00e9adadh an coigilteas maidir le ham agus
  airgead a bheith soil\u00e9ir go leor i dtaca le c\u00e1sanna fada agus casta, t\u00e1
  ga ann freisin saincheisteanna a chur de l\u00e1imh ar bhonn\\n\\nTr\u00e1chtanna
  Oscailte le Claire Loftus, An Sti\u00farth\u00f3ir Ionch\u00faiseamh Poibl\u00ed\\n\\n18\u00fa
  Comhdh\u00e1il Bhliant\u00fail na nIonch\u00faistheoir\u00ed N\u00e1si\u00fanta\\n\\n25
  Samhain 2017, Ionad Comhdh\u00e1la Chaisle\u00e1n Bhaile \u00c1tha Cliath\\n\\n___________________________________________________________\\n\\n\u00e9ifeachtach
  lena n-\u00e1ir\u00edtear nochtadh roimh an triail i gc\u00e1sanna nach bhfuil chomh
  casta, ach a d''fh\u00e9adfadh a bheith n\u00edos tromch\u00fais\u00ed. Baineann
  t\u00e1bhacht ar leith leis na c\u00e1sanna sin do rannph\u00e1irtithe uile i dtriail
  choiri\u00fail ach d''fh\u00e9adfadh tr\u00e1ma ar leith a bheith i gceist le haghaidh
  \u00edospartach, m\u00e1 tharla\u00edonn moilleanna agus atr\u00e1thanna.\\n\\nT\u00e1
  foirm dheiridh na for\u00e1la maidir le h\u00e9isteachta\u00ed athchurtha f\u00f3s
  le feice\u00e1il ach t\u00e1 s\u00fail agam go mbeidh st\u00f3inseacht imleor inti
  chun difr\u00edocht bhr\u00edomhar a dh\u00e9anamh do phr\u00f3ise\u00e1il na gc\u00e1sanna
  ind\u00edot\u00e1ilte tr\u00edd na c\u00fairteanna.\\n\\nI bp\u00e1ip\u00e9ar amh\u00e1in
  le Anne-Marie Lawlor ar maidin seo tagr\u00f3far d''fhoirm choitianta d''iarratas
  athchurtha \u2013 iarratas chun an d\u00edot\u00e1il a scor. De r\u00e9ir mar a
  thuigim, mar a thagr\u00f3idh Anne-Maire, t\u00e1 an dl\u00ed mar a leagtar s\u00edos
  sa Ch\u00fairt Achomhairc an-soil\u00e9ir nuair nach dteasta\u00edonn scoradh d\u00edot\u00e1il
  o leasanna an cheartais. Mar ionch\u00faisitheoir\u00ed, n\u00ed m\u00f3r d\u00fainn
  a bheith feasach ar an dl\u00ed d''fhonn a chinnti\u00fa gur f\u00e9idir c\u00e1sanna
  le gear\u00e1naithe iolracha ar f\u00e9idir iad a \u00e9isteacht go c\u00f3ir le
  ch\u00e9ile a thriail le ch\u00e9ile.\\n\\nIs \u00e9 an mhalairt air sin an re\u00e1cht\u00e1il
  neamhriachtanach agus costasach go hionchasach a bhaineann le trialacha iolracha
  i gcoinne an ch\u00fais\u00ed ch\u00e9anna agus moilleanna do ghear\u00e1naithe
  maidir le h\u00e9isteacht na ngear\u00e1n d\u00e1 gcuid.\\n\\nBa mhaith liom fearadh
  na f\u00e1ilte a chur roimh an aoi-chainteoir eile at\u00e1 linn: an tOllamh Alex
  Biederman \u00f3 Scoil an Cheartais Choiri\u00fail ag Ollscoil Lausanne san Eilv\u00e9is.
  Labhr\u00f3idh s\u00e9 faoi Fhabhr\u00fa Thuairisci\u00fa na hEola\u00edochta F\u00f3ir\u00e9ins\u00ed
  agus an todhcha\u00ed at\u00e1 roimpi. T\u00e1 m\u00e9 thar a bheith bu\u00edoch
  as \u00e9 a thaisteal anseo chun a chuid saineolais a chomhroinnt linn.\\n\\nAgus
  t\u00e1 an Dr. Se\u00e1n Redmond linn, oibr\u00ed s\u00f3isialta agus Ollamh Taca
  um Cheartas na h\u00d3ige faoi l\u00e1thair ag Ollscoil Luimnigh a rinne staid\u00e9ar,
  i gcomhar leis an Roinn Leana\u00ed agus Gn\u00f3tha\u00ed \u00d3ige, ar \u00c9ifeachta\u00ed
  na L\u00edonra\u00ed Coireachta ar Leana\u00ed. Is \u00e9 mo thuairim go l\u00e9ireoidh
  a l\u00e1ithreoireacht c\u00e9 chomh cumhachtach agus at\u00e1 tionchar l\u00edonra\u00ed
  coireachta agus c\u00e9 chomh fada agus a athra\u00edtear saoil leana\u00ed leo,
  leana\u00ed at\u00e1 leochaileach n\u00f3 a nd\u00e9antar faill\u00ed ina leith
  cheana, b''fh\u00e9idir. Is c\u00faiseanna casta iad na c\u00faiseanna le coireacht
  na n-\u00f3g\u00e1nach ach mar a thabharfaidh s\u00e9 chun suntais, is d\u00fashl\u00e1n
  n\u00edos m\u00f3 \u00e9 leana\u00ed a tharraingt amach as st\u00edl mhaireacht\u00e1la
  na coireachta.\\n\\nMar fhocal scoir, mo \\\"Bhu\u00edochas\\\" \u2013 Ba mhaith
  liom Michael Murray a lua, Iar-Dhl\u00edod\u00f3ir St\u00e1it do Chathair Luimnigh
  a d''\u00e9irigh as an r\u00f3l sin tar \u00e9is sheirbh\u00eds 37 mbliana i M\u00ed
  na Bealtaine an bhliain seo. Is eol d\u00fainn go l\u00e9ir a rannchuidi\u00fa ollmh\u00f3r
  leis an gc\u00f3ras ceartais choiri\u00fail agus n\u00ed g\u00e1 sin a fhormh\u00edni\u00fa.
  Ba mhaith liom mo bhu\u00edochas a ghabh\u00e1il leis as a chuid seirbh\u00edse
  poibl\u00ed don ionch\u00faiseamh agus gu\u00edm gach dea-ghu\u00ed d\u00f3. Cuirim
  f\u00e1ilte freisin roimh a chomharba, P\u00e1draig Mawe, mar Dl\u00edod\u00f3ir
  St\u00e1it. C\u00e9 go bhfuil r\u00f3l m\u00f3r le glacadh aige t\u00e1 m\u00e9
  muin\u00edneach go nd\u00e9anfar Cathair Luimnigh a sheirbhe\u00e1il go maith f\u00f3s.
  Ba mhaith liom mo bhu\u00edochas a\\n\\nTr\u00e1chtanna Oscailte le Claire Loftus,
