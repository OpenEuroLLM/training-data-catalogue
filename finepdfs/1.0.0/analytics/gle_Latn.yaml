  th\u00edleac\u00f3ideacha ar a dtugtar gr\u00e1nam. T\u00e1 na l\u00edocha cl\u00f3raifille
  sna scann\u00e1in th\u00edleac\u00f3ideacha (crutha\u00edtear \u00e9 seo \u00f3
  mhaign\u00e9isiam a fhaigheann planda\u00ed \u00f3n ithir). Eagra\u00edtear na l\u00edocha
  anseo ina mbraisl\u00ed ar a dtugtar f\u00f3tach\u00f3rais.\\n* F\u00f3tal\u00fa
  - scoilteadh H2O ina leictreoin, iain Hidrigine (pr\u00f3t\u00f3in) agus ocsaigin.\\n*
  Glacann m\u00f3il\u00edn\u00ed cl\u00f3raifille fuinneamh sholas na gr\u00e9ine
  isteach, agus scaoiltear leictreoin \u00f3 na m\u00f3il\u00edn\u00ed cl\u00f3raifille
  d\u00e1 bharr sin. T\u00e9ann na leictreoin a th\u00e1irgtear le f\u00f3tal\u00fa
  in ionad na leictreon a chailltear nuair a ghlacann m\u00f3il\u00edn\u00ed cl\u00f3raifille
  fuinneamh isteach. St\u00f3r\u00e1iltear iain hidrigine i linn pr\u00f3t\u00f3n
  agus scaoiltear ocsaigin isteach san atmaisf\u00e9ar n\u00f3 \u00fas\u00e1idtear
  \u00ed i riospr\u00e1id laistigh den duilleog. Tagann na leictreoin (\u00f3n m\u00f3il\u00edn
  cl\u00f3raifille), na pr\u00f3t\u00f3in (\u00f3n linn pr\u00f3t\u00f3n) agus CO2
  \u00f3n atmaisf\u00e9ar go l\u00e9ir isteach le ch\u00e9ile chun carbaihiodr\u00e1it\u00ed
  a dh\u00e9anamh (ar dt\u00fas d''fh\u00e9adfa\u00ed gl\u00fac\u00f3s a thiont\u00fa
  ina mh\u00f3il\u00edn\u00ed eile a theasta\u00edonn \u00f3 chealla, n\u00f3 \u00e9
  a st\u00f3r\u00e1il mar st\u00e1irse).\"", "\"Beidh a fhios agat \u00f3n gC\u00e9ad
  Bhliain c\u00e9n chaoi le:\\n\\n- tiont\u00fa idir aonaid \u00e9ags\u00fala tomhais,\\n-
  iml\u00edne cruthanna a bhfuil ciumhaiseanna d\u00edreacha orthu a aimsi\u00fa,\\n-
  achar dronuilleog, triant\u00e1n agus cruthanna cumais a aimsi\u00fa\\n- achar dromchla
  agus toirt solad dronuilleogach a r\u00edomh.\\n\\nSa chaibidil seo, foghlaimeoidh
  t\u00fa c\u00e9n chaoi le:\\n\\n- achar comhthreomhar\u00e1in a fh\u00e1il,\\n-
  an uimhir \u00e9ag\u00f3imheasta, $\\\\pi$, a \u00fas\u00e1id\\n- achar agus iml\u00edne
  ciorcail n\u00f3 teasc\u00f3ige a fh\u00e1il,\\n- fadhbanna lena mbaineann cruthanna
  ciorclacha a r\u00e9iteach,\\n- eangach solaid dhronuilleogaigh a tharraingt,\\n-
  achar dromchla agus toirt priosma \u00e1irithe a r\u00edomh,\\n- l\u00e9ar\u00e1idi
  sc\u00e1ilaithe a tharraingt agus a l\u00e9irmhini\u00fa.\\n\\nM\u00edr 6.1 S\u00fail
  siar ar iml\u00edne agus ar achar\\n\\nIn T\u00e9acs & Trialacha 1, d\u2019aimsigh
  t\u00fa iml\u00edne agus achar cearn\u00f3g, dronuilleog agus triant\u00e1n.\\n\\nTugann
  an bosca th\u00edos achoimre ar ar fhoghlaim t\u00fa.\\n\\n| Ceann\u00f3g | Dronuilleog
  | Triant\u00e1n |\\n|---------|-------------|----------|\\n| Iml\u00edne = $4\\\\ell$
  | Iml\u00edne = $2(\\\\ell + b)$ | Iml\u00edne = fad na dtr\u00ed shlios |\\n| Achar
  = $\\\\ell^2$ | Achar = $\\\\ell b$ | Achar = $\\\\frac{1}{2}bh$ |\\n\\nSeo th\u00edos
  tr\u00ed triant\u00e1n a bhfuil cruth \u00e9ags\u00fail ar gach ceann acu.\\n\\nI
  ngach triant\u00e1n, taispe\u00e1ntar an bonn \\\\((b)\\\\) agus an airde ingearach
  \\\\((h)\\\\).\\n\\nI gc\u00e1s gach triant\u00e1in, t\u00e1 an t-achar \\\\(= \\\\frac{1}{2}bh\\\\).\\n\\n**Sampla
  1**\\n\\nFaigh achar an r\u00e9igi\u00fan sc\u00e1thaithe san fh\u00edor seo.\\n\\nR\u00e9igi\u00fan
  sc\u00e1thaithe = achar na dronuilleoige \u2013 achar an triant\u00e1in.\\n\\n\\\\[\\n=
  20 \\\\times 16 - \\\\frac{1}{2} \\\\times 12 \\\\times 9 \\\\\\\\\\n= 320 - 54
  \\\\\\\\\\n= 266 \\\\text{ cm}^2\\n\\\\]\\n\\n**Sampla 2**\\n\\n56 cm\\\\(^2\\\\)
  achar an triant\u00e1in ar dheis.\\n\\nFaigh \\\\(h\\\\), an airde ingearach.\\n\\n\\\\[\\n\\\\text{Achar}
  = \\\\frac{1}{2} \\\\times 14 \\\\times h \\\\\\\\\\n\\\\therefore \\\\quad \\\\frac{1}{2}
  \\\\times 14 \\\\times h = 56 \\\\\\\\\\n7h = 56 \\\\\\\\\\nh = 8 \\\\text{ cm}\\n\\\\]\\n\\n**Cleachtadh
