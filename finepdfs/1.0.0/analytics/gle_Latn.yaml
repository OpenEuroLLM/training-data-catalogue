  s\u00ed na faid seo a leanas:\\n\\n\\\\[|KL| = 35 \\\\text{ m}, |MN| = 32.5 \\\\text{
  m}, |IJ| = 25 \\\\text{ m}.\\\\]\\n\\nBh\u00ed an fr\u00e1ma ag an mbarr agus ag
  an mbun 1 m ar airde.\\n\\nFaigh (i) an m\u00e9id gloine a bh\u00ed ag teast\u00e1il\\n\\n(ii)
  an % den taobh seo a bh\u00ed cl\u00fadaithe le gloine.\\n\\nM\u00edr 6.3 Achar
  agus iml\u00edne ciorcail\\n\\nTarraing\u00edodh an ciorcal ar dheis ach pointe
  an chomp\u00e1is a chur ar O.\\n\\nL\u00e1rphointe an ciorcail a thugtar ar an bpointe
  O.\\n\\nAn iml\u00edne a thugtar ar an l\u00edne a ghabhann timpeall an ciorcail.\\n\\nSna
  l\u00e9ar\u00e1id\u00ed th\u00edos, tugtar na t\u00e9arma\u00ed a \u00fas\u00e1idfimid
  agus muid ag pl\u00e9 le ciorcail:\\n\\nFad iml\u00edne ciorcail\\n\\n- Cuir marc
  ar phointe ar iml\u00edne bhonn 20 cent.\\n- Cuir an bonn ar rial\u00f3ir.\\n  Cuir
  an marc ar an sc\u00e1la.\\n- Roll an bonn ar an rial\u00f3ir go mbuaileann an marc
  an sc\u00e1la ar\u00eds.\\n- L\u00e9igh fad na himl\u00edne \u00f3n rial\u00f3ir;
  feicfidh t\u00fa go bhfuil fad na himl\u00edne beag\u00e1in\u00edn n\u00edos m\u00f3
  n\u00e1 tr\u00ed oiread thrastomhas an bhoinn.\\n\\nOs cionn tr\u00ed oiread an
  trastomhas at\u00e1 fad na himl\u00edne.\\n\\nSeasann an litir Ghr\u00e9igise $\\\\pi$
  don uimhir faoina n-iolra\u00edmid an trastomhas (\u2018p\u00ed\u2019 a deirtear
  sa Ghaeilge, agus \u2018pie\u2019 sa Bh\u00e9arla.)\\n\\nNil luach beacht mar dheach\u00fail
  n\u00e1 mar chod\u00e1n ag $\\\\pi$.\\n\\nAch, nuair a \u00fas\u00e1idimid deach\u00falacha,
  \u00fas\u00e1idimid 3.14 de ghn\u00e1th mar gharluach.\\n\\nNuair a \u00fas\u00e1idimid
  cod\u00e1in, \u00fas\u00e1idimid $\\\\frac{22}{7}$ mar gharluach.\\n\\n**Garluachanna
  ar $\\\\pi$**\\n\\n$\\\\pi = 3.14 \\\\quad \\\\text{n\u00f3} \\\\quad \\\\pi = \\\\frac{22}{7}$\\n\\n**Iml\u00edne
  ciorcail**\\n\\nIs \u00e9 $2\\\\pi r$ n\u00f3 $\\\\pi d$ fad iml\u00edne ciorcail,
  \u00e1it arb \u00e9 $r$ an ga agus $d$ an trastomhas.\\n\\nTugann an eochair $\\\\pi$
  ar d\u2019\u00e1ireamh\u00e1n luach n\u00edos beaichte n\u00e1 3.14 n\u00f3 $\\\\frac{22}{7}$.\\n\\nAgus
  t\u00fa ag \u00fas\u00e1id \u00e1ireamh\u00e1in, ba ch\u00f3ir an eochair seo a
  \u00fas\u00e1id mura ndeirtear a mhala\u00edrt leat.\\n\\n**Iml\u00edne teasc\u00f3ige**\\n\\nIs
  teasc\u00f3g \u00ed cuid de chiorcal at\u00e1 gafa ag dh\u00e1 gha agus stua.\\n\\nChun
  $\\\\ell$, fad stua teasc\u00f3ige, a fh\u00e1il, roinnimid an uillinn sa teasc\u00f3g
  ar $360^\\\\circ$ chun cod\u00e1n a fh\u00e1il.\\n\\nAnsin, faighimid an cod\u00e1n
  seo den iml\u00edne.\\n\\n**Sampla 1**\\n\\nFaigh fad iml\u00edne an chiorcail seo,
  ag \u00fas\u00e1id 3.14 mar gharluach ar $\\\\pi$.\\n\\nIml\u00edne $= 2\\\\pi r$\\n\\n$=
  2 \\\\times 3.14 \\\\times 12$\\n\\n$= 75.36 \\\\text{ cm}$\\n\\n$= 75.4 \\\\text{
  cm}$, ceart go dt\u00ed ionad deach\u00falach amh\u00e1in.\\n\\n**Sampla 2**\\n\\nSa
  l\u00e9ar\u00e1id ar dheis, feictear teasc\u00f3g ciorcail arb \u00e9 21 cm a gha.\\n\\nFaigh
  fad iml\u00edne na f\u00edorach seo.\\n\\n\u00das\u00e1id $\\\\frac{22}{7}$ mar
  gharluach ar $\\\\pi$.\\n\\nSan iml\u00edne, t\u00e1 an stua AB agus dh\u00e1 gha.\\n\\n$60^\\\\circ
  = \\\\frac{1}{6}$ de $360^\\\\circ$, mar sin is \u00e9 $\\\\frac{1}{6}$ den iml\u00edne
  an stua AB.\\n\\nFad an stua AB\\n\\n$$= \\\\frac{1}{6} \\\\times 2\\\\pi r$$\\n\\n$$=
  \\\\frac{1}{6} \\\\times \\\\frac{2}{1} \\\\times \\\\frac{22}{7} \\\\times \\\\frac{21}{1}$$\\n\\n$$=
  22 \\\\text{ cm}$$\\n\\nAn iml\u00edne ioml\u00e1n $= 22 + 21 + 21 = 64 \\\\text{
  cm}$\\n\\n---\\n\\n**Sampla 3**\\n\\nIs \u00e9 120 cm fad iml\u00edne ciorcail.\\n\\nFaigh
  fad gha an chiorcail, ceart go dt\u00ed ionad deach\u00falach amh\u00e1in.\\n\\n$$\\\\text{Iml\u00edne}
  = 2\\\\pi r$$\\n\\n$$\\\\therefore \\\\quad 2\\\\pi r = 120$$\\n\\n$$r = \\\\frac{120}{2\\\\pi}
  = \\\\frac{120}{2 \\\\times \\\\pi}$$\\n\\n$$r = 19.099 \\\\text{ cm} \\\\quad \\\\ldots
  \\\\text{\u00fas\u00e1id an eochair } \\\\pi \\\\text{ ar an \u00e1ireamh\u00e1n}$$\\n\\nga
  $= 19.1 \\\\text{ cm}$\\n\\n---\\n\\n**Nod maidir leis an \u00e1ireamh\u00e1n:**\\n\\nAg
  \u00fas\u00e1id d\u2019\u00e1ireamh\u00e1in chun luach $\\\\frac{120}{2 \\\\times
  \\\\pi}$ a fh\u00e1il,\\n\\nb\u00ed cinnte go bhfuil an tsuim ar taispe\u00e1int
  i gceart ar sc\u00e1ile\u00e1n an \u00e1ireamh\u00e1in sula mbr\u00fann t\u00fa
  \u2018=\u2019.\\n\\n---\\n\\n**Achar ciorcail**\\n\\nM\u00e1 ghearrtar 12 theasc\u00f3g
  an chiorcail th\u00edos go n\u00e9ata, is f\u00e9idir \u2018dronuilleog\u2019 a
  chruth\u00fa astu, mar a l\u00e9ir\u00edtear.\\n\\nM\u00ednigh an f\u00e1th gurb
  \u00e9 \\\\( \\\\pi r \\\\) fad na dronuilleoige agus \\\\( r \\\\) a hairde.\\n\\nCad
  \u00e9 achar na dronuilleoige?\\n\\nM\u00ednigh an f\u00e1th gurb \u00e9 \\\\( \\\\pi
  r^2 \\\\) achar an chiorcail.\\n\\n\\\\[\\n\\\\text{Achar an chiorcail} = \\\\pi
  r^2\\n\\\\]\\n\\n\\\\[\\n\\\\text{Achar na teasc\u00f3ige} = \\\\frac{\\\\theta}{360}
  \\\\times \\\\pi r^2\\n\\\\]\\n\\n**Fiosr\u00fa:**\\n\\nT\u00e1 foirm\u00ed chun
  achar agus toirt cruthanna \u00e9ags\u00fala (mar aon le neart foirm\u00ed \u00fas\u00e1ideacha
  eile) le f\u00e1il sa leabhr\u00e1n Foirm\u00ed agus T\u00e1bla\u00ed, a fhoils\u00edonn
  Coimisi\u00fan na Scr\u00faduithe St\u00e1it.\\n\\nFaigh amach uimhreacha na leathanach
  ar a bhf\u00e9adfa teacht ar na foirm\u00ed seo a leanas:\\n\\n| Foirmle | Uimhir
  leathanaigh |\\n|---------|-------------------|\\n| Ciorcal: \\\\( \\\\ell = 2\\\\pi
  r \\\\) | |\\n| Sf\u00e9ar: \\\\( A = 4\\\\pi r^2 \\\\) | |\\n| An tAilg\u00e9abar:
  \\\\( x = \\\\frac{-b \\\\pm \\\\sqrt{b^2 - 4ac}}{2a} \\\\) | |\\n| Aonaid Sl: \\\\(
  \\\\text{am}(t) \\\\) | |\\n\\n| Foirmle | Uimhir leathanaigh |\\n|---------|-------------------|\\n|
  Comhthreomhar\u00e1n: \\\\( A = ah \\\\) | |\\n| C\u00e9imseata: \\\\( |AB| \\\\)
  | |\\n| Tacair: \\\\( \\\\cap, \\\\cup, \\\\emptyset \\\\) etc. | |\\n| R\u00e9im\u00edreanna:
  cilea- | |\\n\\nSampla 4\\n\\n(i) Faigh achar ciorcail arb \u00e9 14 cm a gha. (Glac
  le $\\\\pi = \\\\frac{22}{7}$)\\n\\n(ii) Faigh achar ciorcail arb \u00e9 1386 cm$^2$
  a achar.\\n\\n\u00das\u00e1id an eochair $\\\\pi$ ar d\u2019\u00e1ireamh\u00e1n
  agus tabhair do fhreagra ceart go dt\u00ed an tsl\u00e1nuimhir is gaire.\\n\\n(i)
  Achar $= \\\\pi r^2$\\n\\n$$= \\\\frac{22}{7} \\\\times 14^2$$\\n\\n$$= \\\\frac{22}{7}
  \\\\times 14 \\\\times 14$$\\n\\n$$= 616 \\\\text{ cm}^2$$\\n\\n(ii) $\\\\pi r^2
  = 1386$\\n\\n$$r^2 = \\\\frac{1386}{\\\\pi}$$\\n\\n$$r^2 = 441.178$$\\n\\n$$r =
  \\\\sqrt{441.178} = 21.004$$\\n\\n$$r = 21 \\\\text{ cm}$$\\n\\nCleachtadh 6.3\\n\\n1.
  Ainmnigh an ghn\u00e9 a l\u00e9ir\u00edtear i nd\u00fach dearg, ar gach ciorcal.\\n\\n   (i)
  O\\n\\n   (ii)\\n\\n   (iii) O\\n\\n   (iv)\\n\\n   (v) O\\n\\n   (vi) O\\n\\n   (vii)\\n\\n   (viii)\\n\\n2.
  R\u00edomh iml\u00edne gach ceann de na ciorcail seo, ag \u00fas\u00e1id $\\\\pi
  = 3.14$.\\n\\n   (i) 10 cm\\n\\n   (ii) 4 cm\\n\\n   (iii) 12 cm\\n\\n   (iv) 9
  cm\\n\\n3. \u00das\u00e1id an eochair $\\\\pi$ ar d\u2019\u00e1ireamh\u00e1n chun
