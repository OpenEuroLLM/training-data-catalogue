  dh\u00e9anamh aige nuair a bh\u00ed s\u00e9 \u00f3g? (Alt 4)\\n\\n(v) Cad a rinne
  s\u00e9 i gCol\u00e1iste na Trion\u00f3ide? (Alt 5)\\n\\nT\u00e9igh ar aghaidh go
