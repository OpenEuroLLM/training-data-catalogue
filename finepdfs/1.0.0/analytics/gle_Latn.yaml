sample: '["\"PREASEISI\u00daINT Uimh. 188/22\\n\\nLucsamburg, an 22 Samhain 2022\\n\\nBreithi\u00fanas
  na C\u00fairte Breithi\u00fanais i gC\u00e1sanna Uamtha C-37/20 | Luxembourg Business
  Registers agus C-601/20 | Sovim\\n\\nAn Treoir maidir le sci\u00faradh airgid a
  chomhrac: t\u00e1 an fhor\u00e1il lena leagtar s\u00edos go mbeidh faisn\u00e9is
  faoi \u00fain\u00e9ir\u00ed tairbhi\u00fala na gcuideachta\u00ed arna nionchorpr\u00fa
  ar chr\u00edoch na mBallst\u00e1t inrochtana i ngach g\u00e1s d''aon duine den phobal
  i gcoitinne neamhbhail\u00ed.\\n\\nN\u00edl an cur isteach ar na cearta a r\u00e1tha\u00edtear
  leis an gCairt leis an mbeart sin teoranta don mh\u00e9id a bhfuil f\u00edorgh\u00e1
  leis n\u00e1 i gcomhr\u00e9ir leis an gcusp\u00f3ir at\u00e1 \u00e1 shaothr\u00fa.\\n\\nI
  gcomhr\u00e9ir leis an Treoir maidir le sci\u00faradh airgid a chomhrac 1 , buna\u00edodh
  le Dl\u00ed Lucsamburgach a glacadh in 2019 2 Cl\u00e1r na n\u00dain\u00e9ir\u00ed
  Tairbhi\u00fala agus for\u00e1iltear ann go gcaithfear sraith faisn\u00e9ise ar
  \u00fain\u00e9ir\u00ed tairbhi\u00fala na n-eintiteas cl\u00e1raithe a iontr\u00e1il
  agus a st\u00f3r\u00e1il ann. T\u00e1 cuid den fhaisn\u00e9is sin ar f\u00e1il don
  phobal i gcoitinne, go h\u00e1irithe ar an idirl\u00edon. For\u00e1iltear sa Dl\u00ed
  sin freisin go bhf\u00e9adfaidh \u00fain\u00e9ir tairbhi\u00fail a iarraidh ar Luxembourg
  Business Registers (LBR), arb \u00e9 bainisteoir an Chl\u00e1ir, rochtain ar an
  bhfaisn\u00e9is sin a theorann\u00fa i gc\u00e1sanna \u00e1irithe.\\n\\nSa comhth\u00e9acs
  sin, thug cuideachta Lucsamburgach agus \u00fain\u00e9ir tairbhi\u00fail cuideachta
  den s\u00f3rt sin dh\u00e1 chaingean os comhair an tribunal d''arrondissement de
  Luxembourg (C\u00fairt D\u00faiche, Lucsamburg), a raibh iarrtha acu, gan rath,
  ar LBR an rochtain at\u00e1 ag an bpobal i gcoitinne ar an bhfaisn\u00e9is a bhaineann
  leo a theorann\u00fa. Agus \u00ed den tuairim go bhf\u00e9adfadh riosca d\u00edr\u00e9ireach
  i nd\u00e1il le s\u00e1r\u00fa ar chearta bun\u00fasacha na n-\u00fain\u00e9ir\u00ed
  tairbhi\u00fala lena mbaineann a bheith ann d\u00e1 nochtfa\u00ed faisn\u00e9is
  den s\u00f3rt sin, chuir an ch\u00fairt sin sraith ceisteanna le haghaidh r\u00e9amhrial\u00fa
  ar an gC\u00fairt Bhreithi\u00fanais a bhaineann le l\u00e9iri\u00fa for\u00e1lacha
  \u00e1bhartha den Treoir maidir le sci\u00faradh airgid a chomhrac agus bail\u00edocht
  na bhfor\u00e1lacha sin i bhfianaise na Cairte um Chearta Bun\u00fasacha an Aontais
  Eorpaigh (\\\"an Chairt\\\").\\n\\nSa bhreithi\u00fanas a thug s\u00ed inniu, chinn
  an Ch\u00fairt Bhreithi\u00fanais, agus \u00ed ag su\u00ed mar Mh\u00f3r-Dhl\u00edsheomra,
  go bhfuil an fhor\u00e1il den Treoir maidir le sci\u00faradh airgid a chomhrac lena
  bhfor\u00e1iltear nach m\u00f3r do na Ballst\u00e1it a \u00e1irithi\u00fa go mbeidh
  an fhaisn\u00e9is ar \u00fain\u00e9ir\u00ed tairbhi\u00fala na n-eintiteas corpar\u00e1ideach
  agus na n-eintiteas dl\u00edthi\u00fail at\u00e1 corpraithe ina gcr\u00edoch ar
  f\u00e1il i ngach c\u00e1s d''aon duine den phobal i gcoitinne neamhbhail\u00ed.\\n\\nDar
  leis an gC\u00fairt, is ionann rochtain don phobal i gcoitinne ar fhaisn\u00e9is
  maidir le h\u00fain\u00e9ir\u00ed tairbhi\u00fala agus cur isteach tromch\u00faiseach
  ar na cearta bun\u00fasacha chun pr\u00edobh\u00e1ideachais agus sonra\u00ed pearsanta
  a chosaint a chumhda\u00edtear in Airteagail 7 agus 8 den Chairt, faoi seach. Leis
  an bhfaisn\u00e9is a nochtar, cuirtear ar chumas l\u00edon daoine a d''fh\u00e9adfadh
  a bheith neamhtheoranta faisn\u00e9is a fh\u00e1il faoi staid \u00e1bhartha agus
  airgeadais \u00fain\u00e9ara thairbhi\u00fail. Ina theannta sin, is treise na hiarmhairt\u00ed
  a d''fh\u00e9adfadh a bheith ann do na daoine is \u00e1bhar do na sonra\u00ed\\n\\n1
  Treoir (AE) 2015/849 \u00f3 Pharlaimint na hEorpa agus \u00f3n gComhairle an 20
  Bealtaine 2015 maidir le h\u00fas\u00e1id an ch\u00f3rais airgeadais chun sci\u00faradh
  airgid n\u00f3 maoini\u00fa sceimhlitheoireachta a chosc, lena leasa\u00edtear Rialach\u00e1n
  (AE) Uimh 648/2012 \u00f3 Pharlaimint na hEorpa agus \u00f3n gComhairle, agus lena
  naisghairtear Treoir 2005/60/CE \u00f3 Pharlaimint na hEorpa agus \u00f3n gComhairle
  agus Treoir 2006/70/CE \u00f3n gCoimisi\u00fan (IO 2015 L 141 lch. 73), arna leas\u00fa
  le Treoir (AE) 2018/843 \u00f3 Pharlaimint na hEorpa agus \u00f3n gComhairle an
  30 Bealtaine 2018 (IO 2018, L 156, lch. 43).\\n\\n2 Dl\u00ed an 13 Ean\u00e1ir 2019
  lena mbuna\u00edtear Cl\u00e1r na n-\u00dain\u00e9ir\u00ed Tairbhi\u00fala (m\u00e9morial
  A 15).\\n\\nmar thoradh ar mh\u00ed-\u00fas\u00e1id fh\u00e9ideartha a sonra\u00ed
  pearsanta toisc, n\u00ed hamh\u00e1in go bhf\u00e9adfar na sonra\u00ed sin a rochtain
  a luaithe a chuirfear ar f\u00e1il don phobal i gcoitinne iad, ach go bhf\u00e9adfar
  iad a st\u00f3r\u00e1il agus a scaipeadh freisin.\\n\\nB\u00edodh sin mar at\u00e1,
  tugann an Ch\u00fairt d\u00e1 haire, leis an mbeart at\u00e1 faoi thr\u00e1cht,
  t\u00e1 s\u00e9 beartaithe ag reacht\u00f3ir an Aontais sci\u00faradh airgid agus
  maoini\u00fa sceimhlitheoireachta a chosc tr\u00ed thimpeallacht a fhorbairt, tr\u00ed
  thr\u00e9dhearcacht mh\u00e9adaithe a chur ar f\u00e1il, ar timpeallacht \u00ed
  ar l\u00fa an d\u00f3ch\u00falacht go n-\u00fas\u00e1idfear \u00ed chun na gcr\u00edoch
  sin. Measann s\u00ed go bhfuil cusp\u00f3ir an leasa ghinear\u00e1lta \u00e1 shaothr\u00fa
  ag an reacht\u00f3ir, a d''fh\u00e9adfadh \u00fadar a thabhairt do chur isteach,
  tromch\u00faiseach fi\u00fa, ar na cearta bun\u00fasacha a chumhda\u00edtear in
  Airteagail 7 agus 8 den Chairt, agus go bhfuil rochtain an phobail i gcoitinne ar
  fhaisn\u00e9is maidir le h\u00fain\u00e9ir\u00ed tairbhi\u00fala oiri\u00fanach
  chun rannchuidi\u00fa leis an gcusp\u00f3ir sin a bhaint amach.\\n\\nCinneann an
  Ch\u00fairt, \u00e1fach, nach bhfuil an cur isteach a bhaineann leis an mbeart sin
  teoranta don mh\u00e9id a bhfuil f\u00edor-gh\u00e1 leis n\u00e1 i gcomhr\u00e9ir
  leis an gcusp\u00f3ir at\u00e1 \u00e1 shaothr\u00fa. Chomh maith lena bheith \u00fadaraithe
  leis na for\u00e1lacha sin sonra\u00ed nach bhfuil sainithe n\u00f3 inaitheanta
  go leordh\u00f3thanach a chur ar f\u00e1il don phobal, agus is ionann an c\u00f3ras
  a tugadh isteach leis an Treoir maidir le sci\u00faradh airgid a chomhrac agus cur
  isteach i bhfad n\u00edos tromch\u00fais\u00ed ar na cearta bun\u00fasacha a r\u00e1tha\u00edtear
  le hAirteagail 7 agus 8 den Chairt, i gcompar\u00e1id leis na rialacha a bh\u00ed
  ann roimhe sin (inar for\u00e1ladh, sa bhreis ar rochtain a bheith ag na h\u00fadar\u00e1is
  inni\u00fala agus ag eintitis \u00e1irithe, go mbeadh aon duine n\u00f3 eagra\u00edocht
  in ann leas dlisteanach a l\u00e9iri\u00fa), gan an cur isteach sin a bheith c\u00faitithe
  ag na bunt\u00e1ist\u00ed f\u00e9ideartha, a d''fh\u00e9adfadh a bheith ag gabh\u00e1il
  leis an gc\u00f3ras nua, i nd\u00e1il leis an gc\u00f3ras a bh\u00ed ann roimhe,
  maidir le sci\u00faradh airgid agus maoini\u00fa sceimhlitheoireachta a chomhrac.
  Go h\u00e1irithe, n\u00ed f\u00e9idir leis na deacrachta\u00ed a d''fh\u00e9adfadh
  a bheith ann maidir leis na c\u00e1sanna agus na coinn\u00edollacha ina bhfuil leas
  dlisteanach a shaini\u00fa go beacht bonn cirt a thabhairt d\u00f3 go nd\u00e9anfadh
  reachtas an Aontais for\u00e1il go mbeidh rochtain ag an bpobal ar an bhfaisn\u00e9is
  lena mbaineann. Luann an Ch\u00fairt freisin, maidir leis na for\u00e1lacha roghnacha
  lena gceada\u00edtear do na Ballst\u00e1it, faoi seach, cur ar f\u00e1il na faisn\u00e9ise
  maidir le h\u00fain\u00e9ir\u00ed tairbhi\u00fala a chur faoi choinn\u00edoll cl\u00e1r\u00fa
  ar l\u00edne agus for\u00e1il a dh\u00e9anamh, in imthosca eisceacht\u00fala, maidir
  le maoluithe ar rochtain an phobail i gcoitinne ar an bhfaisn\u00e9is sin, n\u00edl
  siad in ann iontu f\u00e9in cothroma\u00edocht a l\u00e9iri\u00fa idir cusp\u00f3ir
  an leasa ghinear\u00e1lta at\u00e1 \u00e1 shaothr\u00fa agus na cearta bun\u00fasacha
  a chumhda\u00edtear in Airteagail 7 agus 8 den Chairt, n\u00f3 r\u00e1tha\u00edochta\u00ed
  leordh\u00f3thanacha a bheith ann lena gcumasa\u00edtear do dhaoine is \u00e1bhar
  do na sonra\u00ed a sonra\u00ed pearsanta a chosaint go h\u00e9ifeachtach ar an
  mbaol go mbainf\u00ed m\u00ed-\u00fas\u00e1id astu.\\n\\nN\u00d3TA: Leis an tarchur
  chun r\u00e9amhrial\u00fa, cuirtear ar chumas do ch\u00fairteanna agus bins\u00ed
  na mBallst\u00e1t, i gcomhth\u00e9acs d\u00edosp\u00f3id os a gcomhair, ceisteanna
  maidir le l\u00e9irmh\u00edni\u00fa ar dhl\u00ed an Aontais Eorpaigh n\u00f3 bail\u00edocht
  gn\u00edmh de chuid na Aontais a tharchur chun na C\u00fairte Breithi\u00fanais.
  N\u00ed chinneann an Ch\u00fairt Bhreithi\u00fanais an d\u00edosp\u00f3id n\u00e1isi\u00fanta.
  Is faoin gc\u00fairt n\u00f3 binse n\u00e1isi\u00fanta at\u00e1 s\u00e9 an c\u00e1s
  a chinneadh i gcomhr\u00e9ir leis an mbreith \u00f3n gC\u00fairt Bhreithi\u00fanais.
  T\u00e1 an bhreith sin ina ceangal, ar an gcaoi ch\u00e9anna, ar ch\u00fairteanna
  agus bins\u00ed n\u00e1isi\u00fanta eile a n-arda\u00edtear saincheist chomhchos\u00fail
  os a gcomhair.\\n\\nDoicim\u00e9ad neamhoifigi\u00fail le h\u00fas\u00e1id ag na
  me\u00e1in, nach bhfuil ina cheangal ar an gC\u00fairt Bhreithi\u00fanais.\\n\\nFoils\u00edtear
  t\u00e9acs ioml\u00e1n agus r\u00e9sum\u00e9 an bhreithi\u00fanais ar shu\u00edomh
  CURIA l\u00e1 an fh\u00f3gartha.\\n\\nTeagmh\u00e1la\u00ed preasa: Jacques Zammit  (+352)
  4303 3555\\n\\nIs f\u00e9idir \u00edomhanna d''fh\u00f3gairt an bhreithi\u00fanais
  a fh\u00e1il \u00f3 \\\"Europe by Satellite\\\"  (+32) 2 2964106.\\n\\nB\u00edg\u00ed
  nasctha!\"", "\"R\u00e1iteas Strait\u00e9ise 2022\u20132024\\n\\nCoimisi\u00fan
  na h\u00c9ireann um Chearta an Duine agus Comhionannas\\nIrish Human Rights and
  Equality Commission\\n\\n| Section                                      | Page |\\n|----------------------------------------------|------|\\n|
  An Brollach                                 | 3    |\\n| Eolas F\u00fainne                                 |
  4    |\\n| \u00c1r bhF\u00eds, \u00c1r Misean agus \u00c1r gCuid Luachanna  | 6    |\\n|
