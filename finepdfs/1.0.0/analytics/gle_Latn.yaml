  TG4.  Taca\u00edonn TG4 le daoine faoi mh\u00edchumas a fhost\u00fa.\"", "\"Athraithe
  ceimiceach tasc litearthachta\\n\\nAthra\u00edonn gach rud \u2013 ach c\u00e9n f\u00e1th?\\n\\nLe
  ceimice\u00e1in tarla\u00edonn athraithe de bharr teocht n\u00f3 an bhfuacht. De
  bharr seo d''fh\u00e9adadh athraithe a tarl\u00faint gan aon rabhadh n\u00f3 plean\u00e1\u00edl.\\n\\nAr
  thug t\u00fa faoi deara riamh go bhfuil roinnt \u00e1bhair sol\u00e1dach cortha
  agus \u00e1bhair eile sol\u00e1dacha righin? Seo \u00e9 an c\u00fais:\\n\\nI ngach
  \u00e1bhair sol\u00e1dach t\u00e1 na hadamh nasctha le ch\u00e9ile ach b\u00edonn
  na hadamh socraithe i sl\u00edeanna difri\u00fala.\\n\\nM\u00e1s i l\u00ednte s\u00ednte
  sreangach iad beidh an \u00e1bhar s\u00ednte sreangach freisin, ar n\u00f3s banda
  leaisteacha. Cialla\u00edonn s\u00e9 seo go bhfuil t\u00fa in ann iad a scuais le
  ch\u00e9ile go h\u00e9asca.\\n\\nIn \u00e1bhair at\u00e1 f\u00edor crua ar n\u00f3s
  muileata, t\u00e1 na hadamh socraithe i bhfr\u00e1ma an \u2013 teann.\\n\\nIn \u00e1bhair
  n\u00edos boige ar n\u00f3s graif\u00edt \u2013 at\u00e1 \u00fas\u00e1idte chun
  peann luaidhe a dh\u00e9anamh \u2013 t\u00e1 na hadamh socraithe i sraitheanna scaoilte
  a thagann as a ch\u00e9ile go h\u00e9asca nuair at\u00e1 t\u00fa \u00e1 scr\u00edobh.\\n\\nI
  bpoirceall\u00e1n t\u00e1 na hadamh an \u2013 c\u00f3ngarach le ch\u00e9ile agus
  br\u00faite isteach. M\u00e1 briseann ach ceann amh\u00e1\u00edn des na nascanna
  idir na hadamh, brisfidh an porceall\u00e1n ioml\u00e1n.\\n\\nI miotail, t\u00e1
  roinnt leictreoin ag bogadh timpeall an adamh. Coim\u00e9adann an f\u00f3rsa leictreacha
  \u00f3n leictreoin, na hadamh in a n-\u00e1it. Ach is f\u00e9idir le gach adamh
  bogadh beag\u00e1\u00edn\u00edn agus seo \u00e9 an c\u00fais go bhfuilimid in ann
  casadh a cur i miotal \u2013 m\u00e1 t\u00e1\u00edmid f\u00edor l\u00e1idir!\\n\\nSeo
  chughat 5 f\u00edric\u00ed faoi m\u00f3il\u00edn\u00ed uisce:\\n\\nTagann sneachta
  agus cloichshneachta \u00f3 pros\u00e9as a cuireann m\u00f3il\u00edn\u00ed uisce
  at\u00e1 reoite le ch\u00e9ile sa sp\u00e9ir. Crutha\u00edtear cloichshneachta nuair
  a bogann p\u00edosa\u00ed m\u00f3ra d''oighear timpeall ar a ch\u00e9ile ag \u00e9ir\u00ed
  n\u00edos m\u00f3 agus n\u00edos m\u00f3. An cloichshneachta is m\u00f3 a taifeadadh,
  bh\u00ed s\u00e9 an m\u00e9ad c\u00e9anna le liathr\u00f3id peile.\\nIn \u00e1iteanna
  at\u00e1 an- fhuar reoann na locha. Tos\u00e1ionn an reo seo le criostal oighear
  amha\u00edn agus f\u00e1sann s\u00e9 go dt\u00ed go bhfuil criostal m\u00f3r ioml\u00e1n
  ann.\\nForbra\u00edonn uisce agus \u00e9 ag reo agus br\u00faigheann s\u00e9 aon
  rud at\u00e1 in a shl\u00ed ag f\u00f3rsa 140 kg s\u00e1r cm cearn\u00f3gach. Sin
  go leor chun duine a mhar\u00fa! 3\\n\\n01/2018\\n\\nIs f\u00e9idir leat liathr\u00f3id\u00ed
  sneachta a cruth\u00fa mar go bhfuil an oighear roinnt l\u00e9aite. San Antarctach
  n\u00ed f\u00e9idir leat liathr\u00f3id\u00ed sneachta a cruth\u00fa mar go bhfuil
  an sneachta r\u00f3 crua. 4\\nAgus oighear ag l\u00e9a t\u00f3gann na hadamh isteach
  an teocht fuinneamh chun bogadh n\u00edos m\u00f3. Faoi dheireadh scaoileann said
  chun bogadh timpeall leo f\u00e9\u00edn. Sin leacht. 5\\n\\nCeisteanna\\n\\nCruthaigh
  bileog eolais ag taisp\u00e9aint na sl\u00edeanna difri\u00fala go bhfuil na hadamh
  in ann iad f\u00e9in a shocr\u00fa agus c\u00e9n \u00e9ifeacht a bhfuil aige ar
  na dtr\u00e9ithe at\u00e1 ag na h\u00e1bhair.\\nD\u00e9an compar\u00e1id idir na
  hadamh i ngraif\u00edt agus i mbana leasteacha.\\nConas a crutha\u00edtear cloichshneachta?
  3\\nC\u00e9n \u00e9ifeacht at\u00e1 ag teocht ar caithn\u00edn\u00ed in aon \u00e1bhair?
  4\\n\\nDo thasc\\n\\nTh\u00edos t\u00e1 treoir ar d\u00fail t\u00e1bhachtach. Samhlaigh
  gur eola\u00ed th\u00fa agus t\u00e1 tr\u00ed dh\u00fail nua curtha in aithne agat,
  sol\u00e1d, leacht agus g\u00e1s. Lean an treoir ar aghaidh leis na dh\u00fail seo.\\n\\n01/2018\"",
  "\"C\u00e1ca\u00ed Phr\u00e1ta Ph\u00e1draig\\n\\nBealach iontach chun leana\u00ed
