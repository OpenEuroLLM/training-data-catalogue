  go leor chun feidhm a bhaint as tar \u00e9is dh\u00e1 bhliain.\"", "\"01/10/2020\\n\\nA
  Thuist\u00ed,\\n\\nGabhaimid bu\u00edochas le gach duine at\u00e1 ag clo\u00ed le
  rialacha nua na scoile faoi l\u00e1thair. Iarrfaimid oraibh lean\u00faint leis.\\n\\nOur
  thanks to everyone who is following the new school rules due to Covid-19. We encourage
  you to keep up this good work to keep our school community safe.\\n\\nComhghairdeas
  le dalta\u00ed Rang 6 na bliana seo caite a fuair a gC\u00f3ineart\u00fa le d\u00e9ana\u00ed.\\n\\nCongratulations
  to the pupils of last year''s 6th class who recently made their Confirmation.\\n\\nComhghairdeas
  le dalta\u00ed Rang 3 a fuair a gC\u00e9ad Chomaoineach an tseachtain seo agus le
  M\u00fainteoir Niall a d''ullmhaigh iad don \u00f3c\u00e1id.\\n\\nCongratulations
  to the pupils of 3rd class who received their First Holy Communion on Wednesday.
  Well done to M\u00fainteoir Niall who prepared them so well for the occasion.\\n\\nM\u00edle
  bu\u00edochas le gach clann a d''\u00edoc na costais\u00ed scoile le d\u00e9ana\u00ed.
  Bheim\u00eds bu\u00edoch as \u00edoca\u00edochta\u00ed eile a fh\u00e1il go luath.\\n\\nMany
  thanks to those who have paid school costs through the epayment system recently.
  We would appreciate if anyone who has not yet made the payments does so at their
  convenience. (24 hour pupil insurance, book scheme, arts/ crafts/ photocopying).\\n\\nGabhaimid
  bu\u00edochas \u00f3 chro\u00ed le Cumnor Construction a rinne urra\u00edocht ar
  gheansaithe nua CLG don scoil. T\u00e1imid ag tn\u00fath go m\u00f3r leo a chaitheamh.
  Is f\u00e9idir grianghraif a fheiscint ar shu\u00edomh na scoile.\\n\\nOur sincere
  thanks to Cumnor Construction for sponsoring new GAA jerseys for the school. We
  look forward to wearing them proudly when school matches recommence. Photos can
  be viewed on our website.\\n\\nTiocfaidh an banaltra scoile ar an 7\u00fa & 14\u00fa
  Deireadh F\u00f3mhair chuig Na\u00edon\u00e1in Mh\u00f3ra agus Rang 1. Is f\u00e9idir
  teagmh\u00e1il a dh\u00e9anamh go d\u00edreach lena oifig air 021-4225651.\\n\\nThe
  school nurse will carry out vision and hearing tests for Senior Infants & First
  Class on October 7th & 14th. These classes missed their tests at the end of last
  year when schools closed. Any queries, contact the nurse''s office on 021-4225651.\\n\\nTabharfaidh
  Garda Se\u00e1n cuairt ar Na\u00edon\u00e1in Bheaga & Na\u00edon\u00e1in Mh\u00f3ra
  ar an D\u00e9ardaoin chun labhairt leo faoi sh\u00e1bh\u00e1ilteacht ar na b\u00f3ithre.\\n\\nGarda
  Se\u00e1n will visit Junior & Senior Infants this Thursday to chat about road safety.\\n\\nTabharfaidh
  Garda Se\u00e1n cuairt ar Rang 4, 5, 6 ar an 9\u00fa Deireadh F\u00f3mhair chun
  labhairt leo faoi ch\u00farsa\u00ed s\u00e1bh\u00e1ilteachta arl\u00edne. Beidh
  an chaint seo ar si\u00fal taobh amuigh.\\n\\nGarda Se\u00e1n will visit 4th, 5th,
  6th class on October 9th to speak to the classes on internet safety. These talks
  will take place on a class by class basis outdoors.\\n\\nT\u00e1 an t-\u00e1dh linn
  le d\u00e9ana\u00ed go bhfuil mac l\u00e9inn \u00f3 Chol\u00e1iste Mhuire gan Sm\u00e1l
  ag cabhr\u00fa i seomra\u00ed Rang 2, 3, 4 ar feadh ceithre secahtaine. Beidh M\u00fainteoir
  Marie ag cabhr\u00fa leis na na\u00edon\u00e1in t''r\u00e9is an briseadh l\u00e1r-t\u00e9arma.\\n\\nWe
  are very lucky to have a student teacher on placement from Mary Immaculate College
  helping to team teach in 2nd, 3rd, 4th class for four weeks. M\u00fainteoir Marie
  will then help with infants after midterm.\\n\\nBeidh l\u00e1 dearg agus b\u00e1n
  againn ar an Aoine 2\u00fa toisc go mbeidh An Bhl\u00e1rna i gcraobh an chontae
  ar an Satharn.\\n\\nWe will hold a red & white dress-up day this Friday 2nd to show
  our support for the Blarney hurlers, who play in the county final on Saturday.\\n\\nGo
  raibh maith agaibh, M\u00fainteoir C\u00e1it.\"", "\"GCSE\\n\\nSonra\u00edocht GCSE
  CCEA\\n\\nMatamaitic Ardch\u00e9ime\\n\\nLeagan 2: 26 Meitheamh 2017\\n\\nLe teagasc
  den ch\u00e9ad uair \u00f3 Mhe\u00e1n F\u00f3mhair 2017 Le meas\u00fan\u00fa den
  ch\u00e9ad uair Samhradh 2018 Le bronnadh den ch\u00e9ad uair Samhradh 2019 C\u00f3d
  \u00c1bhair: 2330\\n\\nIs \u00e9 at\u00e1 sa doicim\u00e9ad seo, aistri\u00fach\u00e1n
  ar Chaibidil 3, Inneachar \u00c1bhair, den tSonra\u00edocht.\\n\\n3 Inneachar \u00c1bhair\\n\\nT\u00e1
  an c\u00farsa seo roinnte againn ina cheithre aonad. Tugtar anseo th\u00edos an
  t-inneachar at\u00e1 i ngach aonad agus na tortha\u00ed foghlama a bhaineann leo.\\n\\n3.1
  Aonad 1: An Ghlanmhatamaitic\\n\\nSan aonad seo, d\u00e9anann dalta\u00ed imscr\u00fad\u00fa
  ar an ailg\u00e9abar, ar an triant\u00e1nacht, ar an difre\u00e1il, ar an tsuime\u00e1il,
  ar logartaim, ar mhaitr\u00eds\u00ed agus ar \u00e9agothroim\u00ed cearnacha.\\n\\n3\\n\\n3.2
  Aonad 2: Meicnic\\n\\nSan aonad seo, fiosra\u00edonn dalta\u00ed cin\u00e9imitic,
  veicteoir\u00ed, f\u00f3rsa\u00ed, Dl\u00edthe Gluaisne Newton agus m\u00f3imint\u00ed.\\n\\n3.3
  Aonad 3: Staitistic\u00ed\\n\\nSan aonad seo, fiosra\u00edonn dalta\u00ed claonadh
  l\u00e1rnach agus scaipeadh, d\u00f3ch\u00falacht, na d\u00e1ileach\u00e1in dh\u00e9th\u00e9armacha
  agus normalacha agus anail\u00eds dh\u00e9-athr\u00e1ideach.\\n\\n3.4 Aonad 4: Matamaitic
  Scoite agus Cinnteoireachta\\n\\nSan aonad seo, fiosra\u00edonn dalta\u00ed an comhaireamh,
  loighic, r\u00edomhchl\u00e1r\u00fa l\u00edneach, amshraith agus anail\u00eds r\u00e9bhealaigh.\\n\\n\u00a9
