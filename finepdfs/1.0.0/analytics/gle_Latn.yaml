  rann\u00f3g leis an dath cu\u00ed.\\n\\n1. B\u00e1n\\n2. Or\u00e1iste (measc bu\u00ed
  agus dearg)\\n3. Gorm\\n4. Gorm geal (measc gorm agus b\u00e1n)\\n5. Liath (measc
  b\u00e1n agus dubh)\\n6. Donn (measc glas agus gorm)\\n7. Donn geal (measc donn
  agus b\u00e1n)\\n\\nDathaigh an Lacha Bhreac. Is \u00e9 an Lacha Bhreac an lacha
  is m\u00f3 ar na bogaigh. Itheann s\u00e9 seilid\u00ed beaga agus cr\u00e9at\u00fair
  eile sa l\u00e1ib timpeall ar Oile\u00e1n an Harp\u00faraigh. F\u00e9ach ar na huimhreacha
  sa bhosca th\u00edos agus dathaigh gach rann\u00f3g leis an dath cu\u00ed.\\n\\n1.
  Dearg\\n2. Glas (measc bu\u00ed agus gorm)\\n3. Dornn (measc glas agus dearg)\\n4.
  B\u00e1ndearg (measc dearg agus b\u00e1n)\\n5. Donn geal (measc donn agus b\u00e1n)\\n6.
  Dubh\\n7. Liath (measc dubh agus b\u00e1n)\\n8. B\u00e1n\\n\\nBogaigh Oile\u00e1n
  an Harp\u00faraigh\\n\\nDathaigh an Roilleach\\n\\nLena ghob fada, itheann an Roilleach
  sliog\u00e9isc agus p\u00e9isteanna a fhraigheann s\u00e9 sa l\u00e1ib n\u00f3 ar
  an gcladach. T\u00e1 dath dubh agus b\u00e1n air, le gob or\u00e1iste agus cosa
  b\u00e1ndearga - n\u00edl aon \u00e9an eile ar an mbogach amhlaidh. Chun \u00e9
  a aimsi\u00fa, f\u00e9ach ar na huimhreacha sa bhosca th\u00edos agus dathaigh gach
  rann\u00f3g leis an dath cu\u00ed.\\n\\n1. Dubh\\n2. B\u00e1n\\n3. B\u00e1ndearg
  (measc dearg agus b\u00e1n)\\n4. Or\u00e1iste (measc dearg agus bu\u00ed)\\n5. Dearg\\n6.
  Liath (measc dubh agus b\u00e1n)\\n7. Gorm\\n8. Bu\u00ed\\n\\nDathaigh an Faoile\u00e1n\\n\\nIs
  \u00e9 an Droimneach M\u00f3r an faoile\u00e1n is m\u00f3 in \u00c9irinn.\\n\\nD\u00e9an
