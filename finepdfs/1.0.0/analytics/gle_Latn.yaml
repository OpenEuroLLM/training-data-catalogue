  uisce \u00f3 na fr\u00e9amhacha suas an stoc go dt\u00ed na duilleoga.\\n\\nIs \u00ed
  an choirt craiceann an chrainn. T\u00e9ann s\u00ed timpeall ar an stoc ar fad.\\n\\nIs
  \u00e9 an stoc an chuid is l\u00e1idre den chran. Coinn\u00edonn s\u00e9 na craobha
  in airde.\\n\\nFaigheann cranna a chuid uisce \u00f3na fhr\u00e9amhacha.\\n\\nTagann
  bia \u00f3 na duilleoga s\u00edos tr\u00edd an gcoirt go dt\u00ed na fr\u00e9amhacha.\\n\\nCoinn\u00edonn
  fr\u00e9amhacha an crann sa talmh le nach f\u00e9idir leis an ghaoth an crann a
  leagan.\\n\\nCuir lip\u00e9ad leis an bpicti\u00far agus dathaigh \u00e9.\\n\\nTortha\u00ed
  agus S\u00edolta\\n\\nFaighte\u00e1r s\u00edolta laistigh tortha\u00ed.\\n\\nCaor
  Cuilinn\\n\\n\u00dall\\n\\nCast\u00e1n\\n\\nSceach\u00f3ir\\n\\nIs bia do na hainmhithe
  allta na tortha\u00ed seo.\\n\\nL\u00edon isteach gach picti\u00far le dathanna.\\n\\n-
  Itheann an lon dubh sceach\u00f3ir\u00ed.\\n- Itheann an sm\u00f3lach caora cuilinn.\\n-
  Is bia iad \u00falla do na gr\u00e1inneoga.\\n- Itheann an luch dearcain.\\n\\nCuir
  Lip\u00e9ad ar gach picti\u00far leis an mbia ceart.\\n\\nBain \u00fas\u00e1id as
  leabhar tagartha n\u00f3 postaer chun deimhin a dh\u00e9anamh de go bhfuil do chuid
  dathanna ceart.\\n\\nAg F\u00e1s S\u00edolta\\n\\nD\u00e9an \u00e9 seo san Fh\u00f3mhar\\n\\nBeidh
  na ruda\u00ed seo ag teast\u00e1il uait:\\n\\n- Pr\u00f3ca bl\u00e1thanna n\u00f3
  cart\u00e1n glan bainne\\n- M\u00fair\u00edn potaithe (gan aon mh\u00f3in iontu
  m\u00e1s f\u00e9idir chun \u00e1r bportaigh a shabh\u00e1il)\\n- Gaineamh gairneoireach.\\n\\nBeidh
  s\u00edolta ag teast\u00e1il uait chun iad a chur.\\nRoghnaigh na cinn at\u00e1
  easca a fh\u00e1s.\\n\\ncast\u00e1n  dearc\u00e1n  an coll  cn\u00f3 fe\u00e1\\n\\nTreoracha\\n\\n-
  D\u00e9an poill i mbun an chart\u00e1in le peann luaidhe.\\n- Cuir l\u00edpe\u00e1d
  ar an gcart\u00e1n le d\u2019ainm, ainm an ts\u00edl agus an d\u00e1ta.\\n- Cuir
  roinnt gainimh sa chart\u00e1n.\\n- L\u00edon suas an cart\u00e1n le m\u00fair\u00edn.
  D\u00e9an \u00e9 a mheascadh go maith.\\n- Cuir an s\u00edol isteach sa m\u00fair\u00edn.
  Br\u00faigh s\u00edos \u00e9 go dt\u00ed a dhoimhneacht f\u00e9n.\\n- Cuir roinnt
  bheag uisce ar an ithir.\\n\\nF\u00e1g an soitheach ar leac fuinneoghe. Cuir uisce
  air mar is g\u00e1. Ba ch\u00f3ir go dtosn\u00f3dh an crann ag f\u00e1s i m\u00ed
  M\u00e1rta.\\n\\nScaipeadh S\u00edolta\\n\\nTeasta\u00edonn solas \u00f3 sh\u00edolta
  chun go bhf\u00e1sfaidh siad suas mar chrainn nua.\\n\\nN\u00edl go leor solais
  faoin gcrann, \u00e1it inar crutha\u00edodh iad, chun go bhf\u00e1sfaidh siad ann.\\n\\nTeasta\u00edonn
  \u00f3 sh\u00edolta \u00e9al\u00fa \u00f3n gerann bunaidh chuinn go bhf\u00e1sfaidh
  siad suas.\\n\\nConas is f\u00e9idir leis na s\u00edolta \u00e9al\u00fa \u00f3n
  gerann bunaidh.\\n\\nTeasta\u00edonn s\u00edolta \u00f3 na h\u00e9in agus na hainmhithe
  mar bhia.\\n\\nBeireann siad leo iad chun iad a ithe.\\n\\nBeirtear roinnt de na
  s\u00edolta as ach n\u00ed itear iad. F\u00e1sann siad suas mar chrainn nua.\\n\\nBiashlabhra\u00ed\\n\\nL\u00edon
  isteach na bearna\u00ed sna biashlabhra\u00ed.\\n\\ncrann  \u00fall\\n\\ncrann cn\u00f3
