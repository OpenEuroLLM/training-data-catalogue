  anseo\\nFill anseo\\n\\nC\u00e9im a 5 agus 6\\n\\nGreamaigh an ceann agus an gob\\n\\nGreamaigh
  na cosa\\n\\n4. Gearr go c\u00faramach timpeall ar an gcruth le sios\u00far. N\u00e1
