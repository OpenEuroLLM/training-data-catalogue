  corpraithe n\u00f3ta a fiche haon\\n\\nSti\u00farth\u00f3ir mhalairte\\n\\nn\u00f3ta
  a naoi d\u00e9ag\\n\\nN\u00d3TA\u00cd COMHL\u00c1N\u00daCH\u00c1IN FHOIRM B1\\n\\nBa
  ch\u00f3ir na n\u00f3ta\u00ed seo a l\u00e9amh i gcomhar leis an reachta\u00edocht
  \u00e1bhartha.\\n\\nGinear\u00e1lta\\n\\nN\u00ed m\u00f3r an fhoirm seo a chomhl\u00e1n\u00fa
  i gceart, ina hioml\u00e1ine agus de r\u00e9ir na n\u00f3ta\u00ed seo a leanas.  N\u00ed
  m\u00f3r gach m\u00edr den fhoirm a chomhl\u00e1n\u00fa.  Cuir isteach ''N\u00ed
  bhaineann le h\u00e1bhar'', ''n\u00edl'' n\u00f3 ''n\u00edl aon cheann'' nuair is
  cu\u00ed sin.  I gc\u00e1sanna a bhfuil \u02dc/__ priont\u00e1ilte, cuir isteach/scrios
  de r\u00e9ir mar is cu\u00ed.  Sa ch\u00e1s go bhfuil /_ i gceist, tabhair an t-airgeadra
  \u00e1bhartha, sa ch\u00e1s nach euro at\u00e1 i gceist.  M\u00e1 mheastar nach
  leor an sp\u00e1s at\u00e1 ar f\u00e1il ar Fhoirm B1, ba ch\u00f3ir an fhaisn\u00e9is
  a thabhairt ar bhileog leantach san fhorm\u00e1id ch\u00e9anna agus at\u00e1 sa
  mh\u00edr \u00e1bhartha den fhoirm.  M\u00e1 bhaintear \u00fas\u00e1id as bileog
  leantach, n\u00ed m\u00f3r \u00e9 sin a chur in i\u00fal sa mh\u00edr \u00e1bhartha.
  N\u00ed fol\u00e1ir nach ionann don R\u00fana\u00ed agus don Sti\u00farth\u00f3ir
  a sh\u00edn\u00edonn an Fhoirm.\\n\\nn\u00f3ta a haon\\n\\n\u00c9il\u00edtear ar
  chuideacha aon tuairisce\u00e1n a bheadh neamhthuairiscithe do bhlianta roimhe seo
  a thuairisci\u00fa leis an tuairisce\u00e1n seo.  N\u00ed bheidh aon bhearna idir
  d\u00e1ta \u00e9ifeachta thuairisce\u00e1n blaint\u00fail na bliana roimhe seo (m\u00e1
  bhaineann le h\u00e1bhar) agus an tr\u00e9imhse a chumhda\u00edonn an tuairisce\u00e1n
  seo. De bhun alt 127 d''Acht na gCuideachta\u00ed 1963, n\u00ed m\u00f3r tuairisce\u00e1n
  bliant\u00fail cuideachta a dh\u00e9anamh cothrom le d\u00e1ta tr\u00e1th nach d\u00e9ana\u00ed
  n\u00e1 a d\u00e1ta tuairisce\u00e1in bhliant\u00fail (ARD). Mar sin f\u00e9in,
  caithfidh cuideachta nua ag comhd\u00fa a c\u00e9ad aischur i ndiaidh corpraithe
  an aischur sin a dh\u00e9anamh suas go dt\u00ed a ARD. N\u00ed m\u00f3r an tuairisce\u00e1n
  a dh\u00e9anamh leis an gCl\u00e1raitheoir laistigh de 28 l\u00e1 \u00f3 ARD na
  cuideachta, n\u00f3, sa ch\u00e1s go ndearnadh tuairisce\u00e1n suas le d\u00e1ta
  n\u00edos luaithe n\u00e1 ARD na cuideachta, laistigh de 28 l\u00e1 \u00f3n d\u00e1ta
  n\u00edos luaithe sin.  Leagann alt 127 amach an bealach ina gcinntear ARD na cuideachta
  agus inar f\u00e9idir \u00e9 a athr\u00fa.  Baineann pion\u00f3is dhiana le tuairisce\u00e1n
  bliant\u00fail a thuairisci\u00fa d\u00e9anach. Is f\u00e9idir ARD reatha chuideachta
  \u00e9igin a sheice\u00e1il ar l\u00edne saor in aisce ag www.cro.ie. Tuairisce\u00e1in
  a dh\u00e9antar roimh an 1 M\u00e1rta 2002: M\u00e1 t\u00e1thar ag \u00fas\u00e1id
  na foirme seo chun tuairisce\u00e1n a dh\u00e9anamh, ba ch\u00f3ir an tuairisce\u00e1n
  a dh\u00e9anamh suas go dt\u00ed an d\u00e1ta a thagann 14 l\u00e1 tar \u00e9is
  AGM na cuideachta don bhliain at\u00e1 i gceist agus a sheachadadh chuig an CRO
  laistigh de 60 l\u00e1 \u00f3n AGM.  Baineann gach n\u00f3ta eile le tuairisce\u00e1in
  den chine\u00e1l sin freisin.  Gearrfar an pion\u00f3is i leith tuairisce\u00e1n
  d\u00e9anach i gc\u00e1s aon tuairisce\u00e1in m\u00e1r sin de.\\n\\nn\u00f3ta a
  d\u00f3\\n\\nCaithfear an chuid seo a chomhl\u00e1n\u00fa m\u00e1 t\u00e1thar ag
  d\u00e9anamh an tuairisce\u00e1in seo chuig d\u00e1ta \u00e9igin ar luaithe \u00e9
  n\u00e1 ARD reatha na cuideachta. Ba cheart go dtice\u00e1lfa\u00ed an bosca \u00e1bhartha
  sa ch\u00e1s gur mian leis an gcuideachta d\u00e1ta c\u00e9anna an ARD at\u00e1
  aici a choinne\u00e1il don ch\u00e9ad bhliain eile.  Ba cheart go dtice\u00e1lfa\u00ed
  an bosca cu\u00ed m\u00e1s mian leis an gcuideachta a hARD don ch\u00e9ad bhliain
  eile a athr\u00fa go dt\u00ed cothrom an d\u00e1ta chuig a ndearnadh an tuairisce\u00e1n
  i mbliana. (Cialla\u00edonn \\\"an ch\u00e9ad bhliain eile\\\" an bhliain de r\u00e9ir
  an fh\u00e9ilire tar \u00e9is na bliana ina dtarla\u00edonn an d\u00e1ta chuig a
  ndearnadh an tuairisce\u00e1n reatha). Caithfear an fhoirm a thabhairt ar ais don
  CRO lena comhl\u00e1n\u00fa d\u00e1 mba rud \u00e9 n\u00e1r tice\u00e1ladh ceachtar
  de na bosca\u00ed agus go ndearna an chuideachta a tuairisce\u00e1n chuig d\u00e1ta
  \u00e9igin ar luaiahte n\u00e1 a hARD \u00e9. N\u00edl aon fheidhm ag an gcuid seo
  do chuideachta nua \u00e9igin at\u00e1 ag comhd\u00fa a c\u00e9ad tuairisce\u00e1in
  bhliant\u00fail tar \u00e9is a corpraithe.\\n\\nSa ch\u00e1s go nd\u00e9antar an
  tuairisce\u00e1n le Foirm B73, n\u00f3 sa ch\u00e1s gurb \u00e9 an ch\u00e9ad tuairisce\u00e1n
  bliant\u00fail \u00e9 de chuideachta a corpra\u00edodh \u00f3n 1 M\u00e1rta 2002,
  n\u00ed g\u00e1 aon chuntais a chur faoi iamh agus n\u00ed \u00e9il\u00edtear mionsonra\u00ed
  na bliana airgeadais. Seachas sin, tabhair d\u00e1ta tosaithe agus cr\u00edochnaithe
  na bliana airgeadais a chumhda\u00edonn na cuntais a chuirtear i l\u00e1thair n\u00f3
  a bheidh le cur i l\u00e1thair ag AGM na cuideachta don bhliain sin.  De bhun alt
  7(1A) d''Acht na gCuideachta\u00ed (Leas\u00fa) 1986 (arna ions\u00fa ag alt 64
  den Acht um Fhorfheidhmi\u00fa Dl\u00ed Cuideachta\u00ed 2001), n\u00ed m\u00f3r
  na cuntais a dh\u00e9anamh suas go d\u00e1ta tr\u00e1th nach luaithe n\u00e1 naoi
  m\u00ed \u00f3n d\u00e1ta d\u00e1 nd\u00e9antar an tuairisce\u00e1n bliant\u00fail.  I
  gc\u00e1s an ch\u00e9ad tuairisce\u00e1n bliant\u00fail ioml\u00e1n (.i. ocht m\u00ed
  dh\u00e9ag tar \u00e9is a corpraithe de ghn\u00e1th), \u00e9il\u00edtear go gcumhd\u00f3idh
  na cuntais an tr\u00e9imhse sin \u00f3n gcorpr\u00fa. I gc\u00e1s ar bith eile,
  \u00e9il\u00edtear go gcumhd\u00f3idh na cuntais an tr\u00e9imhse \u00f3n tacar
  deireanach cuntas a tuairisc\u00edodh don CRO. n\u00f3ta a tr\u00ed (i)\\nC\u00e9
  go bhfuil cuideachta\u00ed neamhtheoranta pr\u00edobh\u00e1ideacha, cuideachta\u00ed
  gan beann ar bhrab\u00fas pr\u00edobh\u00e1ideacha agus cuideachta\u00ed \u00e1irithe
  le cusp\u00f3ir\u00ed carthanacha, d\u00edolmhaithe \u00f3 chuntais a dh\u00e9anamh
  ar Fhoirm B1, t\u00e1 siad ceangailte le halt 128(6B) Acht na gCuideachta\u00ed
  1963 tuarasc\u00e1il speisialta ini\u00fach\u00f3ra a dh\u00e9anamh ar Fhoirm B1.
  (iii)\\n\\nn\u00f3ta a ceathair n\u00f3ta a c\u00faig\\n\\nn\u00f3ta a s\u00e9\\n\\nn\u00f3ta
  a seacht n\u00f3ta a hocht\\n\\n\u00c9il\u00edtear ar chuideachta\u00ed neamhtheoranta
  \u00e1irithe cuntais a ullmh\u00fa agus iad a chur mar aguis\u00edn le Foirm B1:
  Comhph\u00e1irt\u00edochta\u00ed agus cuideachta\u00ed neamhtheoranta ar cuideachta\u00ed
  teoranta le scaireanna n\u00f3 le hurr\u00fas, n\u00f3 a gcomhionann mura gcumhda\u00edtear
  faoi dhl\u00edthe an st\u00e1it, n\u00f3 measc\u00e1n de na gn\u00f3thais sin, iad
  gach comhalta, nach bhfuil teorainn acu lena gcuid dliteanas; comhph\u00e1irt\u00edochta\u00ed
  agus cuideachta\u00ed neamhtheoranta ar comhph\u00e1irt\u00edochta\u00ed n\u00f3
  cuideachta\u00ed neamhtheoranta den chine\u00e1l a luadh roimhe seo arna rial\u00fa
  ag dl\u00edthe an St\u00e1it, n\u00f3 comhlachta\u00ed iontamail arna rial\u00fa
  ag dl\u00edthe Bhallst\u00e1t an AE n\u00f3 measc\u00e1n de na gn\u00f3thais sin
  iad gach comhalta, nach bhfuil teorainn acu lena gcuid dliteanas. Cuideachta\u00ed
  neamhtheoranta nach dtagann faoi aon cheann de na catag\u00f3ir\u00ed sin, nach
  dtuairisc\u00edonn cuntais n\u00e1 nach dtugann mionsonra\u00ed a mbliana airgeadais.
  (ii)\\n\\nCaithfidh an chuideachta coinn\u00edollacha reacht\u00fala \u00e1irithe
  a sh\u00e1samh, de bhun Chuid III d''Acht na gCuideachta\u00ed (Leas\u00fa) (Uimh.2)
  1999, chun d\u00edol\u00faine ini\u00fachta a fh\u00e1il. N\u00edl aon chumhacht
  ag an CRO an ceangaltas reacht\u00fail go gceangla\u00edtear cuntais ini\u00fachta
  le tuairisce\u00e1n bliant\u00fail a tharscaoileadh, sa ch\u00e1s nach bhfuil cuideachta
  \u00e9igin i dteideal na d\u00edol\u00faine ini\u00fachta a \u00e9ileamh. N\u00ed
  r\u00e1iteas cuimsitheach at\u00e1 ar leathanach 1 den Fhoirm seo ar na facht\u00f3ir\u00ed
  a bhaineann teidl\u00edocht de chuideachta \u00f3 dh\u00edol\u00faine ini\u00fachta
  a \u00e9ileamh. F\u00e9ach bileog eolais an CRO Uimh. 10 n\u00f3 www.cro.ie i gcomhair
  a thuilleadh eolais faoin d\u00edol\u00faine ini\u00fachta.\\n\\nTabhair an seoladh
  amhail dh\u00e1ta an tuairisce\u00e1in seo. N\u00ed m\u00f3r aon athr\u00fa ar oifig
  chl\u00e1raithe a chur in i\u00fal don CRO. Ba ch\u00f3ir Foirm B2 a \u00fas\u00e1id
  chuige sin. T\u00e1 an CRO ag plean\u00e1il tuairisce\u00e1n bliant\u00fail agus
  meabhr\u00fach\u00e1in riarach\u00e1in eile a eisi\u00faint do chuideachta\u00ed
  tr\u00ed r\u00edomhphost. Sol\u00e1thair seoladh r\u00edomhphoist \u00e1bhartha
  chun na cr\u00edche sin d\u00e1 mba mhian leat go bhfaighfeadh do chuideachta na
  meabhr\u00fach\u00e1in \u00fad. Gheobhaidh t\u00fa f\u00f3gra leictreonach freisin
  leis an seoladh r\u00edomhphoist d''eolas eile \u00f3n CRO a d''fh\u00e9adfadh bheith
  chun leasa do chuideachta.\\n\\nMura gcoinn\u00edtear ag an oifig chl\u00e1raithe
  iad, tabhair an seoladh/na seolta\u00ed ag a gcoinn\u00edtear cl\u00e1r na gcomhalta\u00ed,
  cl\u00e1r na sealbh\u00f3ir\u00ed binti\u00fair, agus cl\u00e1r leasanna na sti\u00farth\u00f3ir\u00ed
  agus an r\u00fana\u00ed i scaireanna agus binti\u00fair, agus conartha\u00ed seirbh\u00edse
  sti\u00farth\u00f3ir\u00ed/meamraim f\u00fathu sin. Sa ch\u00e1s go gcoinn\u00edtear
  na taifid ar l\u00e1ithre\u00e1n gr\u00e9as\u00e1in inrochtana, ba ch\u00f3ir an
  CRO a chur ar an eolas faoi sheoladh an l\u00e1ithre\u00e1in ghr\u00e9as\u00e1in
  chu\u00ed.\\n\\nCuir isteach an t-ainm ioml\u00e1n (n\u00ed leor ceannlitreacha)
  agus an gn\u00e1thsheoladh c\u00f3naithe. Sa ch\u00e1s gur comhlacht corpar\u00e1ideach
  \u00e9 an r\u00fana\u00ed, n\u00ed m\u00f3r ainm agus oifig chl\u00e1raithe na cuideachta
  a thabhairt. Glacfar le hainm agus pr\u00edomhoifig na cuideachta in ionad ainmneacha
  agus seolta\u00ed gach aon chomhph\u00e1irt\u00ed sa ch\u00e1s gur cuideachta at\u00e1
  sna r\u00fanaithe agus gur comhr\u00fanaithe na cuideachta at\u00e1 i ngach aon
  chomhph\u00e1irt\u00ed.\\n\\nN\u00ed m\u00f3r aon ch\u00e9adainm agus slounne roimhe
  seo a thabhairt. N\u00ed \u00e1ir\u00edtear air sin (a) i gc\u00e1s duine a aithn\u00edtear
  le teideal at\u00e1 difri\u00fail \u00f3na shloinne, an t-ainm lenar aithn\u00edodh
  \u00e9 sular ghlac s\u00e9 an teideal air f\u00e9in n\u00f3 sular thit an teideal
  air; n\u00f3 (b) i gc\u00e1s duine ar bith, c\u00e9adainm n\u00f3 sloinne roimhe
  seo sa ch\u00e1s gur athra\u00edodh an t-ainm n\u00f3 an sloinne sin n\u00f3 n\u00e1r
  \u00fas\u00e1ideach iad n\u00f3ta a naoi\\n\\nn\u00f3ta a deich n\u00f3ta a haon
  d\u00e9ag\\n\\nn\u00f3ta a d\u00f3 dh\u00e9ag n\u00f3ta a tr\u00ed d\u00e9ag\\n\\nn\u00f3ta
  a ceathair d\u00e9ag n\u00f3ta a c\u00faig d\u00e9ag\\n\\nn\u00f3ta a s\u00e9\\n\\nd\u00e9ag
  n\u00f3ta a\\n\\nseacht d\u00e9ag n\u00f3ta a hocht d\u00e9ag\\n\\nn\u00f3ta a naoi
  d\u00e9ag n\u00f3ta a fiche\\n\\nn\u00f3ta a fiche haon\\n\\nn\u00f3ta a fiche d\u00f3\\n\\nn\u00f3ta
  a fiche tr\u00ed\\n\\nsular bhain an duine ar a bhfuil an t-ainm 18 mbliana d''aois
  amach n\u00f3 gur athra\u00edodh n\u00f3 n\u00e1r \u00fas\u00e1ideadh iad ar feadh
  tr\u00e9imhse nach l\u00fa n\u00e1 20 bliain; n\u00f3 (c) sa ch\u00e1s gur bean
  ph\u00f3sta at\u00e1 i gceist, an t-ainm n\u00f3 an sloinne lenar aithn\u00edodh
  \u00ed sular ph\u00f3s s\u00ed.\\n\\n\u00c9il\u00edonn Alt 26 den Acht Toghch\u00e1in
  1997, go nochtfar mionsonra\u00ed faoi rann\u00edoca\u00edochta\u00ed chun ch\u00edche
  cusp\u00f3ir\u00ed polaiti\u00fala, a th\u00e9ann n\u00edos m\u00f3 n\u00e1 \u20ac5,079
  san ioml\u00e1n, le haon ph\u00e1irt\u00ed polaiti\u00fail, comhalta den D\u00e1il
  n\u00f3 den Seanad, MEP n\u00f3 iarrth\u00f3ir i dtoghch\u00e1n D\u00e1la, Seanaid
  n\u00f3 Eorpach, arna nd\u00e9anamh ag an gcuideachta sa bhliain lena mbaineann
  an tuairisce\u00e1n bliant\u00fail (i.e. an tr\u00e9imhse \u00f3 dh\u00e1ta \u00e9ifeachta
  thuairisce\u00e1n na bliana roimhe sin, comh fada le d\u00e1ta \u00e9ifeachta an
  tuairisce\u00e1in reatha agus an d\u00e1ta sin san \u00e1ireamh), sa tuairisce\u00e1n
  bliant\u00fail agus i dtuarasc\u00e1il sti\u00farth\u00f3ir\u00ed na cuideachta
  i leith na bliana sin. N\u00ed m\u00f3r na mionsonra\u00ed a bheith leordh\u00f3thanach
  chun luach gach deon\u00fach\u00e1in agus an duine d\u00e1r tugadh an deon\u00fach\u00e1n
  a aithint. T\u00e1 sainmh\u00edni\u00fa leathan ar dheon\u00fach\u00e1n leagtha
  amach in alt 22/alt 46 den Acht 1997, agus \u00e1ir\u00edtear air seirbh\u00eds\u00ed
  nach ngearrtar muirear ina leith, deon\u00fach\u00e1n maoine n\u00f3 earra\u00ed,
  n\u00f3 a saor\u00fas\u00e1id.\\n\\nTice\u00e1il an bosca le \\\"Ceann ar bith\\\"
  a th\u00e1scadh mura ndearnadh aon s\u00ednti\u00fas d\u00e1 leith\u00e9id le linn
  na tr\u00e9imhse a chl\u00fada\u00edtear leis an tuairisce\u00e1n bliant\u00fail
  seo. Ceangail na mionsonra\u00ed ar bhileog leantach mura sol\u00e1thra\u00edtear
  d\u00f3thain spais.\\n\\nSa ch\u00e1s go bhfuil scaireanna tiontaithe go stoc ag
  cuideachta, measfar, ansin, nuair is cu\u00ed, go dtagra\u00edonn tagairt\u00ed
  do scaireanna do stoc agus go dtagra\u00edonn tagairt\u00ed do roinnt scaireanna
  do l\u00edon stoic. N\u00ed bhaineann an dara leathanach le cuideachta r\u00e1tha\u00edochta
  gan scairchaipiteal.\\n\\nCuir isteach, nuair is cu\u00ed. (Sa chas gur athainmn\u00edodh
  an scairchaipiteal de bhun alt 26 den Acht um Aontas Eacnama\u00edoch agus Airgeada\u00edochta
  1998 agus gur th\u00e1inig laghd\u00fa ar an scairchaipiteal \u00fadaraithe agus
  eisithe n\u00f3 in aicme scaireanna san ioml\u00e1n n\u00f3 i bp\u00e1irt de bharr
  an athainmn\u00edochais (alt 26(4)(a).)\\n\\nMionsonra\u00ed scaireanna a forgh\u00e9illeadh,
  scaireanna/binti\u00fair a eis\u00edodh ar lascaine, n\u00f3 ar ar \u00edocadh coimisi\u00fan
  lena n-\u00e1ir\u00edtear aicme na scaire, l\u00edon na scaireanna agus m\u00e9ideanna
  i ngach c\u00e1s.\\n\\n\u00c9il\u00edtear liosta ioml\u00e1n le gach tuairisce\u00e1n.
  N\u00ed bhaineann an ceanglas sin, \u00e1fach, le cuideachta r\u00e1tha\u00edochta
  gan scairchaipiteal. Sa ch\u00e1s go bhfuil comh-scairshealbh\u00f3ir\u00ed ann,
  ainmnigh na comh-scairshealbh\u00f3ir\u00ed ar fad n\u00f3 an ch\u00e9ad scairshealbh\u00f3ir\u00ed
  agus ''Eile''.\\n\\nSa ch\u00e1s go bhfuil n\u00edos m\u00f3 n\u00e1 seacht scairshealbh\u00f3ir\u00ed
  ann, ba ch\u00f3ir liosta a thabhairt ar leathanach leantach in ord aib\u00edtreach.\\n\\nTabhair
  an l\u00edon ioml\u00e1n scaireanna at\u00e1 i seilbh gach comhalta\\n\\nN\u00ed
  bhaineann ach le cuideachta\u00ed pr\u00edobh\u00e1ideacha amh\u00e1in. Tabhair
  mionsonra\u00ed faoi scaireanna a aithr\u00edodh, d\u00e1ta cl\u00e1r\u00fach\u00e1in
  gach aistrithe agus an l\u00edon scaireanna a aistr\u00edodh gach d\u00e1ta \u00f3
  dh\u00e1ta an tuairisce\u00e1in deiridh, n\u00f3 sa ch\u00e1s gurb \u00e9 seo an
  ch\u00e9ad tuairisce\u00e1n, \u00f3 dh\u00e1ta corpraithe na cuideachta, ag daoine
  ar comhalta\u00ed f\u00f3s iad agus ag daoine nach comhalta\u00ed a thuilleadh iad.\\n\\nCaithfidh
  ar a laghad sti\u00farth\u00f3ir c\u00f3naitheach amh\u00e1in Limiste\u00e1r Europach
  Eacnama\u00edoch (LEE) l\u00e1naimseartha a bheith ag gach cuideachta n\u00f3 banna
  n\u00f3 deimhni\u00fa i bhfeidhm de bhun a43(3) agus a44 Acht na gCuideachta\u00ed
  (Leas\u00fa) (Uimh.2) 1999. Tabhair faoi deara nach leor sti\u00farth\u00f3ir c\u00f3naitheach
  LEE malairte chun cr\u00edocha a43.  Cuir tic sa bhosca ''C\u00f3naitheoir LEE''
  sa ch\u00e1s go gc\u00f3na\u00edonn an sti\u00farth\u00f3ir\u00ed sa St\u00e1t de
  r\u00e9ir alt 43 den Acht 1999 arna shainmh\u00edni\u00fa le halt 44(8) agus (9).
  Sa ch\u00e1s nach bhfuil aon sti\u00farth\u00f3ir\u00ed l\u00e1naimseartha faoi
  ch\u00f3na\u00ed den chine\u00e1l sin agus n\u00e1r bronnadh aon teastas, n\u00ed
  m\u00f3r banna bail\u00ed a shol\u00e1thar leis an tuairisce\u00e1n bliant\u00fail,
  murar seachadadh ceann cheana f\u00e9in ar an CRO thar ceann na cuideachta. F\u00e9ach
  Bileog Faisn\u00e9ise Uimh. 17 de chuid an CRO chun tuilleadh faisn\u00e9ise a fh\u00e1il.\\n\\nTice\u00e1il
  an bosca le do thoil m\u00e1s sti\u00farth\u00f3ir malairte (ionadach) an sti\u00farth\u00f3ir.  M\u00e1
  cheada\u00edonn airteagail na cuideachta agus faoi r\u00e9ir na n-airteagal sin
  a chomhl\u00edonadh, f\u00e9adfaidh sti\u00farth\u00f3ir duine a ainmni\u00fa mar
  sti\u00farth\u00f3ir malairte ar a shon n\u00f3 ar a son. Caithfidh cuideachta a
  chur in i\u00fal don CRO m\u00e1 ainmneofar aon duine chun gn\u00edomh\u00fa mar
  sti\u00farth\u00f3ir, is cuma c\u00e9n chaoi a gcuirtear s\u00edos ar an ainmni\u00fach\u00e1n.
  T\u00e1 oibleag\u00e1id reacht\u00fail ar an gcuideachta a chur in i\u00fal don
  CRO m\u00e1 chuirtear aon duine lena chl\u00e1r n\u00f3 ma th\u00f3gtar aon duine
  de.  M\u00e1 tharla\u00edonn s\u00e9 go scoirfidh sti\u00farth\u00f3ir l\u00e1naimseartha
  a d''ainmnigh sti\u00farth\u00f3ir malairte de ghn\u00edomh\u00fa mar sti\u00farth\u00f3ir,
  t\u00e1 dualgas ar an gcuideachta a chur in i\u00fal don CRO gur th\u00e1inig deireadh
  le ceapach\u00e1n an sti\u00farth\u00f3ra l\u00e1naimseartha agus a mhalairt n\u00f3
  a malairt. N\u00f3ta: N\u00edl aon fhreagracht ar an CRO maidir leis an nasc idir
  an sti\u00farth\u00f3ir l\u00e1naimseartha agus a mhalairt n\u00f3 a malairt a choth\u00fa.\\n\\nAinm
  na cuideachta agus l\u00edon na gcomhlachta\u00ed corpar\u00e1ideacha, b\u00edd\u00eds
  corpraithe sa St\u00e1t n\u00f3 in \u00e1it eile, seachas i gc\u00e1s comhlachta\u00ed
  (a) nach raibh an duine ina sti\u00farth\u00f3ir orthu tr\u00e1th ar bith i rith
  na ndeich mbliana at\u00e1 caite; (b) ar fochuideachta faoi \u00fain\u00e9ireacht
  ioml\u00e1n \u00ed an chuideachta (n\u00f3 gurbh amhlaidh a bh\u00ed ag an am \u00e1bhartha)
  n\u00f3 (c) ar fochuideachta\u00ed faoi \u00fain\u00e9ireacht ioml\u00e1n de chuid
  na cuideachta iad (n\u00f3 gurbh amhlaidh a bh\u00ed ag an am \u00e1bhartha).  De
  bhun alt 45(1) d''Acht na gCuideachta\u00ed (Leas\u00fa)(Uimh. 2), 1999, n\u00ed
  bheidh duine ag am \u00e1bhartha ina sti\u00farth\u00f3ir ar l\u00edon n\u00edos
  m\u00f3 n\u00e1 25 chuideachta. Faoi alt 45(3), \u00e1fach, n\u00ed \u00e1ir\u00edtear
  sti\u00farth\u00f3ireachta\u00ed \u00e1irithe chun cr\u00edche alt 45(1).\\n\\nAn
  t-ionad corpraithe m\u00e1s lasmuigh den St\u00e1t \u00e9.\\n\\nCuir tic sa bhosca/sna
  bosca\u00ed cu\u00ed le do thoil.\\n\\nCaithfear an r\u00e9imse Uimhir Chl\u00e1r\u00fach\u00e1in
  Ini\u00fach\u00f3ra (ARN) a chomhl\u00e1n\u00fa:\\n\\n(b) ag cuideachta\u00ed pr\u00edobh\u00e1ideacha
  neamhtheoranta, cuideachta\u00ed pr\u00edobh\u00e1ideacha neamhbhrab\u00fasacha
  agus cuideachta\u00ed \u00e1irithe le nithe carthan\u00fala -\\n\\n(a) ag cuideachta
  ar bith nach fol\u00e1ir di cuntais a chomhd\u00fa lena tuairisce\u00e1n bliant\u00fail
  agus nach bhfuil i dteideal agus nach n-\u00e9il\u00edonn an d\u00edol\u00faine
  ini\u00fachta. Ba ch\u00f3ir go bhf\u00e1gfa\u00ed an r\u00e9imse ARN b\u00e1n sa
  ch\u00e1s nach m\u00f3r do chuideachta \u00e9igin cuntais a chomhd\u00fa ach at\u00e1
  i dteideal agus a \u00e9il\u00edonn an d\u00edol\u00faine ini\u00fachta.\\n\\nn\u00ed
  m\u00f3r do na cine\u00e1lacha cuideachta seo faoi chuid 128(6B) d''Acht na gCuideachta\u00ed
  1963 tuairisc ini\u00fach\u00f3ra (saintuairisc ini\u00fach\u00f3ra) a cheangal
  lena dtuairisce\u00e1n bliant\u00fail c\u00e9 go nd\u00edolmha\u00edtear iad \u00f3na
  gceangaltas a gcuntas a cheangal lena dtuairisce\u00e1n bliant\u00fail. Ba ch\u00f3ir
  go gcuirf\u00ed ARN an ini\u00fach\u00f3ra lena mbaineann isteach sa B1. (leanann
  an n\u00f3ta ar aghaidh lastall)\\n\\nn\u00f3ta a fiche tr\u00ed (ar aghaidh)\\n\\nIs
  amhlaidh d\u00e1 r\u00e9ir nach fol\u00e1ir an r\u00e9imse ARN ar an B1 a chomhl\u00e1n\u00fa,
  seachas i gc\u00e1s cuideachta nua at\u00e1 ag comhd\u00fa a c\u00e9ad tuairisce\u00e1n
  bliant\u00fail, agus i gc\u00e1s cuideachta at\u00e1 ag comhd\u00fa cuntas agus
  at\u00e1 i dteideal do dh\u00edol\u00faine ini\u00fachta agus \u00e9il\u00edonn
  an d\u00edol\u00faine sin.\\n\\nI gc\u00e1s cuideachta nua at\u00e1 ag comhd\u00fa
  a c\u00e9ad tuairisce\u00e1n bliant\u00fail d\u00e9anta chuig an d\u00e1ta at\u00e1
  6 mh\u00ed tar \u00e9is an d\u00e1ta chorpraithe, is f\u00e9idir an r\u00e9imse
  ARN a fh\u00e1g\u00e1il b\u00e1n \u00f3ir nach g\u00e1 aon chuntas a cheangal leis
  an gc\u00e9ad tuairisce\u00e1n bliant\u00fail.\\n\\nN\u00ed fheidhmeoidh duine mar
  ini\u00fach\u00f3ir murar iontr\u00e1ladh \u00e9 n\u00e1 \u00ed i gCl\u00e1r Poibl\u00ed
  na nIni\u00fach\u00f3ir\u00ed, de bhun I.R. Uimh. 220 de 2010, Rialach\u00e1in an
  CE(Ini\u00fachta\u00ed Reacht\u00fala)(Treoir 2006/43/CE) 2010. Is iad oifigigh
  chuideachta \u00e9igin at\u00e1 freagrach as a chinnti\u00fa go bhfuil an t\u00e9
  a fhosta\u00edonn siad le cuntais na cuideachta a ini\u00fachadh, agus a sh\u00edn\u00edonn
  tuairisc an ini\u00fach\u00f3ra, ar Chl\u00e1r Poibl\u00ed na nIni\u00fach\u00f3ir\u00ed.
  Is f\u00e9idir st\u00e1das cl\u00e1r\u00fach\u00e1in ini\u00fach\u00f3ra agus a
  RAN a sheice\u00e1il ar Chl\u00e1r Poibl\u00ed na nIni\u00fach\u00f3ir\u00ed ar
  l\u00e1ithre\u00e1n gr\u00e9as\u00e1in an CRO - www.cro.ie\\n\\nCl\u00e1r Comhardaithe
  A128 d''Acht na gCuideachta\u00ed 1963 (AC 63); A7 & A18 d''Acht na gCuideachta\u00ed
  (Leas\u00fa) 1986 (ACL 86)\\n\\nCuntas Brab\u00fais agus Caillteanais A7 agus A18
  ACL 86\\n\\nN\u00f3ta\u00ed a ghabhann leis na Cuntais Sceideal ACL 86 (d\u00e9an
  tagairt go sonrach d''alt 12 le haghaidh n\u00f3ta\u00ed a \u00e9il\u00edtear i
  gc\u00e1s gn\u00f3nna beaga/me\u00e1nacha)\\n\\nTuarasc\u00e1il na Sti\u00farth\u00f3ir\u00ed
  A128 AC 63; A7 & A18 ACL 86\\n\\nTuarasc\u00e1il an Ini\u00fach\u00f3ra A128 AC
  63; A7 & A18 ACL 86\\n\\nTuarasc\u00e1il speisialta an ini\u00fach\u00f3ra deimhnithe
  go cu\u00ed ag sti\u00farth\u00f3ir agus r\u00fana\u00ed mar ch\u00f3ip dh\u00e1ir\u00edre
  den tuarasc\u00e1il.\\n\\nDeimhni\u00fa Ioml\u00e1n \u00c9il\u00edonn na hAchtanna
  gur c\u00f3ip at\u00e1 f\u00edor iad an cl\u00e1r comhardaithe, an cuntas brab\u00fais
  agus caillteanais, tuarasc\u00e1il na sti\u00farth\u00f3ir\u00ed agus an ini\u00fach\u00f3ra
  arna ndeimhni\u00fa ag sti\u00farth\u00f3ir agus r\u00fana\u00ed faoi mar a cuireadh
  n\u00f3 a chuirfear faoi bhr\u00e1id an A.G.M. iad n\u00f3 faoi mar a seoladh n\u00f3
  a sheolfar chuig an gcomhalta aonair iad de r\u00e9ir na rialach\u00e1n um chuideachta\u00ed
  teoranta pr\u00edobh\u00e1ideacha aonchomhalta. I gc\u00e1s cuntas ioml\u00e1n,
  is leor deimhni\u00fa ioml\u00e1n.\\n\\nR\u00e1tha\u00edocht ag gn\u00f3thas m\u00e1thairchuideachta
  i leith dhliteanais ghn\u00f3thas na fochuideachta A17 ACL 86 arnaleas\u00fa\\n\\nDeimhni\u00fa
  toili\u00fach\u00e1in ag scairshealbh\u00f3ir\u00ed fochuideachta maidir le d\u00edol\u00faine
  A17 ACL 86 arna leas\u00fa\\n\\nF\u00f3gra faoi R\u00e1tha\u00edocht do scairshealbh\u00f3ir\u00ed
  A17 ACG 86 arna leas\u00fa\\n\\nN\u00f3ta a luann gur bhain an chuideachta sochar
  as d\u00edol\u00faint\u00ed in alt 17 d''Acht na gCuideachta\u00ed (Leas\u00fa)
  1986, arna leas\u00fa\\n\\nC\u00e1ip\u00e9is\u00ed Cuntasa\u00edochta\\n\\nRialach\u00e1n
  39 \u00f3n EC (Cuideachta\u00ed:  Gr\u00fapchuntais)\\n\\nRialach\u00e1in 1992 Rialach\u00e1n
  7 \u00f3n CE (Forais Chreidmheasa: Cuntais)\\n\\nRialach\u00e1in 1992 Rialach\u00e1n
  7 \u00f3n CE (Cuntais) ) Rialach\u00e1in 1993\\n\\nRialach\u00e1n 5, 17 \u00f3n
  CE (Gn\u00f3thais \u00c1rachais: Cuntais) Rialach\u00e1in 1996\\n\\nAlt 42 - banna
  f\u00e9ach n\u00f3ta a hocht d\u00e9ag thall.\\n\\nFoirm B73 D\u00e1ta nua a ainmni\u00fa
  don tuairisce\u00e1n bliant\u00fail\\n\\nSeicliosta do ch\u00e1ip\u00e9is\u00ed
  at\u00e1 faoi iamh\\n\\nTuilleadh faisn\u00e9ise\\n\\nM\u00e1 bh\u00edonn deacracht
  agat leis an tuairisce\u00e1n bliant\u00fail seo a chomhl\u00e1n\u00fa, agus go
  h\u00e1irithe m\u00e1 bh\u00edonn t\u00fa doil\u00e9ir faoi na ceanglais a bhaineann
  le d\u00e1ta thuairisce\u00e1n bliant\u00fail na cuideachta, ba ch\u00f3ir duit
  teagmh\u00e1il a dh\u00e9anamh le do chomhairleoir gairmi\u00fail. Faisn\u00e9is
  ghairmi\u00fail\\n\\nSa ch\u00e1s go mbaineann le h\u00e1bhar, n\u00ed m\u00f3r
  go dtiocfaidh na mionsonra\u00ed a thugtar ar Fhoirm B1 leis na mionsonra\u00ed
  at\u00e1 sa ch\u00e1ip\u00e9is\u00edocht a seachadadh ar an CRO cheana f\u00e9in.
  Is iad na foirmeacha is gn\u00e1tha\u00ed a \u00fas\u00e1idtear chun an CRO a chur
  ar an eolas faoi athruithe ar mhionsonra\u00ed na cuideachta n\u00e1: Athr\u00fa
  ar mhionsonra\u00ed\\n\\nB3\\n\\nB2 F\u00f3gra faoi athr\u00fa ar ionad na hoifige
  cl\u00e1raithe sti\u00farth\u00f3ir\u00ed agus r\u00fanaithe i scaireanna agus binti\u00fair,
  agus conartha\u00ed seirbh\u00eds\u00ed sti\u00farth\u00f3ir\u00ed/meamraim\\n\\nF\u00f3gra
  faoi ionaid ina gcoinn\u00edtear cl\u00e1r na gcomhalta\u00ed, cl\u00e1r na sealbh\u00f3ir\u00ed
  binti\u00fair, cl\u00e1r leasanna\\n\\nB4/G1 F\u00f3gra faoi mh\u00e9ad\u00fa ar
  chaipiteal \u00fadaraithe\\n\\nB10 F\u00f3gra faoi athr\u00fa sti\u00farth\u00f3ir\u00ed
  n\u00f3 r\u00fanaithe n\u00f3 a gcuid mionsonra\u00ed\\n\\nB5 Aischur leithrannta
  (m\u00e9ad\u00fa ar scairchaipiteal eisithe)\\n\\nOifig Poibl\u00ed: Teach Pharnell,
  14 Cearn\u00f3g Pharnell, Baile \u00c1tha Cliath 1. Seoladh DX - 145001. Nuair a
  bheidh an fhoirm comhl\u00e1naithe agus s\u00ednithe agat, seol ar aghaidh \u00ed
  le do thoil leis an t\u00e1ille forordaithe chuig Cl\u00e1raitheoir na gCuideachta\u00ed
  ag: Seoladh CRO\\n\\nAn Oifig um Chl\u00e1r\u00fa Cuideachta\u00ed, B\u00f3thar
  U\u00ed Bhriain, Ceatharlach\\n\\nL\u00e9igh go c\u00faramach le do thoil na n\u00f3ta\u00ed
  m\u00edni\u00fach\u00e1in thall. Is d\u00f3igh do ndi\u00falt\u00f3faidh an CRO
  d''Fhoirm B1 nach bhfuil comhl\u00e1naithe i gceart n\u00f3 nach bhfuil na c\u00e1ip\u00e9is\u00ed
  cearta n\u00f3 an t\u00e1ille cu\u00ed ag gabh\u00e1il l\u00e9i agus go seolfar
  ar ais ag an t\u00e9 a sheol isteach \u00ed de bhun alt 249A d''Acht na gCuideachta\u00ed
  1990 (arna ions\u00fa ag alt 107 den Acht um Fhorfheidhmi\u00fa Dl\u00ed Cuideachta\u00ed,
  2001). Mura gcuirfear an ch\u00e1ip\u00e9is seo ar ais ar\u00eds chuig an CRO laistigh
  de 14 l\u00e1, measfar n\u00e1r seachadadh ar an CRO ar chor ar bith \u00ed.\"",
  "\"R\u00c1ITEAS UM CHOSAINT LEANA\u00cd\\n\\nAithn\u00edonn Roinn Oideachais agus
  Scileanna (ROS) cl\u00e1r \u00d3gtheagmh\u00e1la na Pri\u00f3ireachta mar Ionaid
  Oideachais a shol\u00e1thra\u00edonn cl\u00e1r oideachais agus oili\u00fana dh\u00e1
  bhliain.\\n\\nT\u00e1 an R\u00e1iteas um Chosaint Leana\u00ed at\u00e1 leagtha amach
  sa doicim\u00e9ad seo aontaithe ag Coiste Bainist\u00edochta \u00d3gtheagmh\u00e1la
  na Pri\u00f3ireachta, de r\u00e9ir na gceanglas seo a leanas: an tAcht um Th\u00fas
  \u00c1ite do Leana\u00ed 2015, T\u00fas \u00c1ite do Leana\u00ed: An Treoir N\u00e1isi\u00fanta
  um Chosaint agus Leas Leana\u00ed 2017, an t-Iarth\u00e9acs a ghabhann le T\u00fas
  \u00c1ite do Leana\u00ed (2019), na N\u00f3sanna Imeachta um Chosaint Leana\u00ed
  do Bhunscoileanna agus Iar-bhunscoileanna 2017 agus Treoir Tusla maidir le R\u00e1itis
  um Chosaint Leana\u00ed a ullmh\u00fa.\\n\\n1 T\u00e1 glactha ag an gCoiste Bainist\u00edochta
  le N\u00f3sanna Imeachta na Roinne um Chosaint Leana\u00ed 2017 agus cuirfidh s\u00e9
  iad i bhfeidhm go hioml\u00e1n agus gan mhionathr\u00fa mar chuid den R\u00e1iteas
  um Chosaint Leana\u00ed forioml\u00e1n seo.\\n\\nIs \u00e9 Paul Curtis, Comhordaitheoir
  an Teagmh\u00e1la\u00ed Ainmnithe (TA) Is iad Celia Jones & Sandra Bagnall, Duine
  Acmhainne, na Leasteagmh\u00e1laithe Ainmnithe (LTA)\\n\\n2 Aithn\u00edonn an Coiste
  Bainist\u00edochta go bhfuil gn\u00e9ithe um chosaint agus leas leana\u00ed i ngach
  gn\u00e9 d''\u00d3gtheagmh\u00e1il agus nach m\u00f3r iad a l\u00e9iri\u00fa i mbeartais,
  i n\u00f3sanna imeachta, i gcleachtais agus i ngn\u00edomha\u00edochta\u00ed uile
  \u00d3gtheagmh\u00e1la. Ina bheartais, a n\u00f3sanna imeachta, a chleachtais agus
  a ghn\u00edomha\u00edochta\u00ed, clo\u00edfidh \u00d3gtheagmh\u00e1il leis na prionsabail
  seo a leanas a bhaineann le deachleachtas maidir le cosaint agus leas leana\u00ed.\\n\\nD\u00e9anfaidh
  \u00d3gtheagmh\u00e1il na Pri\u00f3ireachta na nithe seo a leanas\\n\\n* Aithin
  go bhfuil cosaint agus leas leana\u00ed thar a bheith t\u00e1bhachtach, beag beann
  ar gach breithni\u00fa eile.\\n* Clo\u00ed go hioml\u00e1n lena oibleag\u00e1id\u00ed
  reacht\u00fala faoin Acht um Th\u00fas \u00c1ite do Leana\u00ed 2015 agus reachta\u00edocht
  \u00e1bhartha eile a bhaineann le cosaint agus leas leana\u00ed.\\n* Comhoibri\u00fa
  go hioml\u00e1n leis na h\u00fadar\u00e1is reacht\u00fala \u00e1bhartha maidir le
  c\u00farsa\u00ed cosanta agus leasa leana\u00ed.\\n* Cleachtais sh\u00e1bh\u00e1ilte
  a ghlacadh chun an fh\u00e9idearthacht go dtarl\u00f3dh d\u00edobh\u00e1il n\u00f3
  timpist\u00ed do leana\u00ed a \u00edoslaghd\u00fa agus chun oibrithe a chosaint
  \u00f3n ng\u00e1 le riosca\u00ed neamhriachtanacha a ghlacadh a d''fh\u00e9adfadh
  go mbeid\u00eds faoi r\u00e9ir l\u00edomhaint\u00ed m\u00ed-\u00fas\u00e1ide n\u00f3
  faill\u00ed d\u00e1 bharr.\\n* Cleachtas oscailteachta a fhorbairt le tuismitheoir\u00ed
  agus rannph\u00e1irt\u00edocht tuismitheoir\u00ed a spreagadh in oideachas a gcuid
  leana\u00ed.\\n* Meas ioml\u00e1n a bheith aige ar riachtanais r\u00fandachta agus
  \u00e9 ag d\u00e9ile\u00e1il le c\u00farsa\u00ed cosanta leana\u00ed.\\n\\nClo\u00edfidh
  an t-ionad freisin leis na prionsabail thuas maidir le haon mhac l\u00e9inn f\u00e1sta
  a bhfuil leochaileacht speisialta aige/aici.\\n\\n3 T\u00e1 na n\u00f3sanna imeachta/bearta
  seo a leanas i bhfeidhm\\n* Maidir le haon bhall foirne at\u00e1 ina (h)\u00e1bhar
  d''aon fhiosr\u00fach\u00e1n (cib\u00e9 a gcuirtear s\u00edos air) maidir le haon
  ghn\u00edomh, neamhghn\u00edomh n\u00f3 imthosca i leith linbh at\u00e1 ag freastal
  ar \u00d3gtheagmh\u00e1il, clo\u00edonn \u00d3gtheagmh\u00e1il leis na n\u00f3sanna
  imeachta \u00e1bhartha at\u00e1 leagtha amach i gCaibidil 7 de na N\u00f3sanna Imeachta
  um Chosaint Leana\u00ed do Bhunscoileanna, Iar-Bhunscoileanna agus \u00d3gtheagmh\u00e1il
  2017 agus leis na n\u00f3sanna imeachta smachta comhaontaithe \u00e1bhartha d''fhoireann
  BOO a fhoils\u00edtear ar shu\u00edomh gr\u00e9as\u00e1in ROS.\\n\\n1\\n\\n* Maidir
  le roghn\u00fa n\u00f3 earc\u00fa foirne agus a n-oiri\u00fanacht chun oibri\u00fa
  le leana\u00ed, clo\u00edonn \u00d3gtheagmh\u00e1il le ceanglais ghrinnfhiosr\u00fach\u00e1in
  reacht\u00fala na nAchtanna um an mBi\u00far\u00f3 N\u00e1isi\u00fanta Grinnfhiosr\u00fach\u00e1in
  (Leana\u00ed agus Daoine Soghonta) 2012 go 2016 agus leis an treoir um dhualgas
  c\u00faraim n\u00edos leithne at\u00e1 leagtha amach i gciorcl\u00e1in \u00e1bhartha
  ghrinnfhiosr\u00fach\u00e1in agus earca\u00edochta an Gharda S\u00edoch\u00e1na
  arna bhfoilsi\u00fa ag ROS agus at\u00e1 ar f\u00e1il ar shu\u00edomh gr\u00e9as\u00e1in
  ROS.\\n* Maidir le sol\u00e1thar faisn\u00e9ise agus, nuair is g\u00e1, treoir agus
  oili\u00faint, don fhoireann maidir le sainaithint an d\u00edobh\u00e1la a tharla
  (mar at\u00e1 sainmh\u00ednithe in Acht 2015), t\u00e1 na nithe seo a leanas d\u00e9anta/\u00e1
  dh\u00e9anamh ag \u00d3gtheagmh\u00e1il\\n- Cinnt\u00edonn s\u00e9 go gcuirtear
  c\u00f3ip de R\u00e1iteas um Chosaint Leana\u00ed \u00d3gtheagmh\u00e1la ar f\u00e1il
  do gach ball foirne nua\\n- Chuir s\u00e9 c\u00f3ip de R\u00e1iteas um Chosaint
  Leana\u00ed \u00d3gtheagmh\u00e1la ar f\u00e1il do gach ball foirne\\n- Spreagann
  s\u00e9 an fhoireann chun leas a bhaint as oili\u00faint \u00e1bhartha\\n- Coinn\u00edonn
  an Coiste Bainist\u00edochta taifid oili\u00faint foirne agus chomhalta\u00ed an
  Choiste ar fad\\n- Spreagann s\u00e9 baill an Choiste Bainist\u00edochta leas a
  bhaint as oili\u00faint \u00e1bhartha\\n* Maidir le tuairisci\u00fa imn\u00ed faoi
  chosaint leana\u00ed do Tusla, ceangla\u00edtear ar gach pearsanra \u00d3gtheagmh\u00e1la
  clo\u00ed leis na n\u00f3sanna imeachta at\u00e1 leagtha amach sna N\u00f3sanna
  Imeachta um Chosaint Leana\u00ed do Bhunscoileanna, Iar-Bhunscoileanna agus \u00d3gtheagmh\u00e1il
  2017, lena n-\u00e1ir\u00edtear i gc\u00e1s m\u00fainteoir\u00ed cl\u00e1raithe,
  iad si\u00fad a bhaineann le tuairisci\u00fa faoi shainord\u00fa faoin Acht um Th\u00fas
  \u00c1ite do Leana\u00ed 2015.\\n* T\u00e1 an TA thuasluaite ceaptha ag an gCoiste
  mar an \\\"duine iomchu\u00ed\\\" (mar at\u00e1 sainmh\u00ednithe san Acht um Th\u00fas
  \u00c1ite do Leana\u00ed 2015) d''\u00d3gtheagmh\u00e1il le bheith mar an ch\u00e9ad
  phointe teagmh\u00e1la i dtaobh an R\u00e1itis um Chosaint Leana\u00ed.\\n* Is daoine
  sainordaithe iad gach m\u00fainteoir cl\u00e1raithe at\u00e1 fostaithe ag \u00d3gtheagmh\u00e1il
  faoin Acht um Th\u00fas \u00c1ite do Leana\u00ed 2015.\\n* I gcomhr\u00e9ir leis
  an Acht um Th\u00fas \u00c1ite do Leana\u00ed 2015, t\u00e1 meas\u00fan\u00fa d\u00e9anta
  ag an gCoiste ar aon fh\u00e9idearthacht d\u00edobh\u00e1la a dh\u00e9anamh do leanbh
  agus \u00e9/\u00ed ag freastal ar \u00d3gtheagmh\u00e1il n\u00f3 ag glacadh p\u00e1irte
  i ngn\u00edomha\u00edochta\u00ed \u00d3gtheagmh\u00e1la. T\u00e1 meas\u00fan\u00fa
  scr\u00edofa ina leagtar amach na r\u00e9ims\u00ed riosca a aithn\u00edodh agus
  n\u00f3sanna imeachta \u00d3gtheagmh\u00e1la chun na riosca\u00ed sin a bhainisti\u00fa
  ceangailte mar aguis\u00edn leis na n\u00f3sanna imeachta seo.\\n* Is f\u00e9idir
  teacht ar na n\u00f3sanna imeachta \u00e9ags\u00fala d\u00e1 dtagra\u00edtear sa
  R\u00e1iteas seo ar shu\u00edomh gr\u00e9as\u00e1in Bhord Oideachais Oili\u00fana
  \u00c1tha Cliath agus Dh\u00fan Laoghaire (DDLETB), ar shu\u00edomh gr\u00e9as\u00e1in
  ROS n\u00f3 cuirfear ar f\u00e1il iad ar iarratas \u00f3 \u00d3gtheagmh\u00e1il
  DDLETB.\\n4 Foils\u00edodh an r\u00e1iteas seo ar shu\u00edomh gr\u00e9as\u00e1in
  \u00d3gtheagmh\u00e1la DDLETB agus cuireadh ar f\u00e1il \u00e9 do chomhalta\u00ed
  uile phearsanra na n-ionad oideachais. T\u00e1 rochtain \u00e9asca ag tuismitheoir\u00ed
  agus caomhn\u00f3ir\u00ed air ach \u00e9 a iarraidh. Cuirfear c\u00f3ip den R\u00e1iteas
  seo ar f\u00e1il do Tusla agus don Roinn m\u00e1 iarrtar sin.\\n5 D\u00e9anfar athbhreithni\u00fa
  bliant\u00fail ar an R\u00e1iteas um Chosaint Leana\u00ed seo n\u00f3 chomh luath
  agus is f\u00e9idir tar \u00e9is athr\u00fa \u00e1bhartha a bheith tagtha ar aon
  \u00e1bhar d\u00e1 dtagra\u00edonn an r\u00e1iteas seo.\\n\\nGhlac an Coiste Bainist\u00edochta
  leis an R\u00e1iteas um Chosaint Leana\u00ed seo __ Nollaig 2022\\n\\nS\u00ednithe\\n\\nCathaoirleach
  an Choiste Bainist\u00edochta\\n\\nD\u00e1ta:\\n\\nS\u00ednithe\\n\\nR\u00fana\u00ed
  don Choiste Bainist\u00edochta\\n\\nD\u00e1ta:\\n\\nDe r\u00e9ir an R\u00e1itis
  um Chosaint Leana\u00ed \u00d3gtheagmh\u00e1la, aithn\u00edmid go bhfuil cosaint
  agus leas leana\u00ed f\u00edorth\u00e1bhachtach. T\u00e1imid tiomanta a chinnti\u00fa
  go gcoime\u00e1dtar na mic l\u00e9inn at\u00e1 faoin\u00e1r gc\u00faram s\u00e1bh\u00e1ilte,
  i gc\u00f3na\u00ed. D\u00e1 r\u00e9ir sin, maidir le go leor gn\u00e9ithe de shaol
  agus de ghn\u00edomha\u00edochta\u00ed \u00d3gtheagmh\u00e1la t\u00e1 n\u00f3sanna
  imeachta agus cleachtais glactha againn a thugann aird chu\u00ed ar an bhfreagracht
  seo.\\n\\nMaoirseacht\\n\\n*\\n\\nD\u00e9anfar gach iarracht a chinnti\u00fa go
  mbeidh maoirseacht chuimsitheach ar na mic l\u00e9inn ar maidin \u00f3 8:30am agus
  ag am l\u00f3in.\\n\\n* Taispe\u00e1ntar uainchl\u00e1r na foirne at\u00e1 ar dualgas
  in oifig an chomhordaitheora.\\n* Cinnteoidh baill foirne/m\u00fainteoir\u00ed go
  nd\u00e9antar maoirseacht i gc\u00f3na\u00ed ar mhic l\u00e9inn ar ghn\u00edomha\u00edochta\u00ed
  amuigh faoin aer agus n\u00ed fh\u00e1gann na mic l\u00e9inn maoirseacht na foirne
  n\u00f3 n\u00ed th\u00e9ann siad i dteagmh\u00e1il le haon duine f\u00e1sta eile
  ag an am seo.\\n* N\u00edl cead ag mic l\u00e9inn l\u00f3n/sosanna a chaitheamh
  sna seomra\u00ed ranga n\u00f3 in aon \u00e1it san ionad gan mhaoirseacht agus/n\u00f3
  gan chead.\\n\\nCuairteoir\u00ed\\n\\n* N\u00ed m\u00f3r do gach cuairteoir neamhsceidealta
  chuig an ionad seice\u00e1il isteach ag an bhf\u00e1ilti\u00fa agus logleabhar an
  chuairteora a sh\u00edni\u00fa.\\n* Beidh baill foirne/m\u00fainteoir\u00ed at\u00e1
  ar dualgas taobh amuigh n\u00f3 taobh istigh ar an eolas faoi chuairteoir\u00ed
  a thagann isteach san ionad agus gheobhaidh siad amach l\u00e1ithreach a bhfuil
  ar intinn acu.\\n* N\u00edl cead ag mic l\u00e9inn cead a thabhairt do chuairteoir\u00ed
  teacht ar an \u00e1itreabh gan cead \u00f3n bhfoireann.\\n* N\u00ed m\u00f3r maoirsi\u00fa
  a dh\u00e9anamh ar gach cuairteoir a \u00fas\u00e1ideann \u00e1iseanna an ionaid.\\n\\nBula\u00edocht\\n\\n*
  Tabharfar aghaidh ar iompra\u00edocht bula\u00edochta faoin\u00e1r mBeartas Frithbhula\u00edochta.
  M\u00e1s rud \u00e9 gur iompra\u00edocht gn\u00e9asach at\u00e1 i gceist n\u00f3
  m\u00e1 bhreathna\u00edtear uirthi a bheith maslach ar leith, cuirfear an cheist
  ar aghaidh chuig an TA.\\n\\nIompra\u00edocht\\n\\n* Spreagfar mic l\u00e9inn cas
  ar a ch\u00e9ile go comhoibritheach agus chun meas a l\u00e9iri\u00fa orthu f\u00e9in
  agus ar dhaoine eile; Cuireann \u00d3gtheagmh\u00e1il iompra\u00edocht dhearfach
  chun cinn go gn\u00edomhach. D\u00e9antar tagairt do threoirl\u00ednte iompra\u00edochta
  an ionaid ar bhonn rialta, t\u00e1 siad ar f\u00e1il sa Leabhr\u00e1n Beartais \u00d3gtheagmh\u00e1la
  i ngach ionad.\\n\\nAg dul go dt\u00ed an leithreas\\n\\n* Is \u00e9 polasa\u00ed
  an ionaid nach gceada\u00edtear ach do mhac l\u00e9inn amh\u00e1in dul isteach i
  gcubhachail leithris ag am amh\u00e1in. N\u00ed m\u00f3r do mhic l\u00e9inn a bhfuil
  g\u00e1 acu leis an leithreas a \u00fas\u00e1id cead a fh\u00e1il \u00f3n bhfoireann/m\u00fainteoir.\\n*
  Le linn am l\u00f3in beidh an m\u00fainteoir at\u00e1 ar dualgas taobh istigh in
  aice l\u00e1imhe chun maoirsi\u00fa a dh\u00e9anamh nach bhfuil aon \\\"phleidhc\u00edocht
  sna leithris\\\".\\n* Aithn\u00edonn \u00d3gtheagmh\u00e1il DDLETB go dteasta\u00edonn
  \u00edogaireacht ar leith le maoirsi\u00fa na mac l\u00e9inn i seomra\u00ed gl\u00e9asta
  agus i limist\u00e9ir chithfholctha.\\n* M\u00e1s rud \u00e9 go gcaithfidh mic l\u00e9inn
  athr\u00fa ar ch\u00fais \u00e9igin, n\u00ed fh\u00e9adfaidh ach baill foirne bhaineanna
  dul isteach san \u00e1it athraithe na mban nuair at\u00e1 s\u00e9 in \u00fas\u00e1id
  ag mic l\u00e9inn bhaineanna. N\u00ed fh\u00e9adfaidh ach baill foirne fireanna
  dul isteach san \u00e1it chun athraithe na bhfear nuair a bh\u00edonn s\u00e9 in
  \u00fas\u00e1id ag mic l\u00e9inn.\\n* Go ginear\u00e1lta, fanfaidh an fhoireann
  lasmuigh den \u00e1it chun athraithe, agus l\u00e1ithreacht mhaoirseachta \u00e1
  coinne\u00e1il ag an am c\u00e9anna.\\n* N\u00ed rachaidh baill foirne isteach in
  \u00e1iteanna chun athraithe ach amh\u00e1in ar ch\u00faiseanna \u00e9igeand\u00e1la.\\n\\nCarranna
  foirne\\n\\n* De ghn\u00e1th, n\u00ed iompr\u00f3far mic l\u00e9inn i ngluaiste\u00e1in
  na foirne.\\n* I gc\u00fains\u00ed foircneacha (arna chinneadh ag an gcomhordaitheoir)
  nuair is g\u00e1 mac l\u00e9inn a iompar i gcarr foirne, n\u00ed bheidh mac l\u00e9inn
  ina (h)aonar leis an mball foirne sin riamh.\\n* Beidh ball foirne/m\u00fainteoir
  i gc\u00f3na\u00ed in \u00e9ineacht le ball foirne eile (e.g., comhordaitheoir,
  m\u00fainteoir acmhainne, duine riarach\u00e1in, feighl\u00ed).\\n* Ba ch\u00f3ir
  go mbeadh duine den fhoireann den inscne ch\u00e9anna leis an mac l\u00e9inn, nuair
  is f\u00e9idir.\\n* I gc\u00e1s nach bhfuil duine f\u00e1sta ar f\u00e1il, beidh
  beirt mhac l\u00e9inn eile in \u00e9ineacht leis an m\u00fainteoir, chomh maith
  leis an mac l\u00e9inn a bhfuil iompar de dh\u00edth air/uirthi.\\n\\nIonducht\u00fa
  Foirne/M\u00fainteoir\u00ed\\n\\n* T\u00e1 freagracht ar chomhordaitheoir an ionaid
  gach m\u00fainteoir agus foireann nua a chur ar an eolas faoi na N\u00f3sanna Imeachta
  nua um Chosaint Leana\u00ed.\\n\\nTinreamh\\n\\n* D\u00e9antar monat\u00f3ireacht
  ch\u00faramach ar thinreamh an ionaid. Nuair a bh\u00edonn imn\u00ed ar Chomhordaitheoir/m\u00fainteoir/Acmhainne
  faoi thinreamh, cuirfear na tuismitheoir\u00ed ar an eolas n\u00f3 glaofar chuig
  an ionad iad.\\n* D\u00e9anfaimid monat\u00f3ireacht freisin ar neamhthinreamh i
  gcomhghaol le comhartha\u00ed faill\u00ed/m\u00ed-\u00fas\u00e1id fhisici\u00fail/mhoth\u00fach\u00e1nach.
  Cuirfear an Coiste Leasa Oideachais (CLO) ar an eolas faoi aon imn\u00ed a bhaineann
  le tinreamh linbh. D\u00e9anfar leana\u00ed a chailleann 20 l\u00e1 n\u00f3 n\u00edos
  m\u00f3 a thuairisci\u00fa don CLO de r\u00e9ir na reachta\u00edochta.\\n\\nTeagasc
  Duine le Duine\\n\\n* Tabharfaidh tuismitheoir(\u00ed) agus caomhn\u00f3ir(\u00ed)
  toili\u00fa s\u00ednithe chun ligean d\u00e1 leanbh teagasc duine le duine a fh\u00e1il
  ar bhonn riachtanas.\\n* I gc\u00fains\u00ed ina m\u00faintear mac l\u00e9inn i
  su\u00edomh duine le duine, beidh s\u00e9 mar pholasa\u00ed ag \u00d3gtheagmh\u00e1il
  DDLETB, go mbeidh an mac l\u00e9inn sofheicthe ag daoine eile i gc\u00f3na\u00ed.\\n*
  M\u00fainfear na mic l\u00e9inn i seomra\u00ed ina mbeidh an ball foirne agus an
  mac l\u00e9inn le feice\u00e1il tr\u00ed dhoras pain\u00e9il ghloine agus fanfaidh
  an doras oscailte agus gan bhac.\\n* Is f\u00e9idir pr\u00edobh\u00e1ideacht a shol\u00e1thar
  ach ba ch\u00f3ir go mbeadh an duine f\u00e1sta le feice\u00e1il i gc\u00f3na\u00ed.\\n*
  N\u00edor ch\u00f3ir pain\u00e9il ghloine a chl\u00fadach riamh.\\n* N\u00edor cheart
  doirse a dh\u00fanadh agus/n\u00f3 a chur faoi ghlas riamh.\\n* Cuirfear tuismitheoir(\u00ed)
  agus caomhn\u00f3ir(\u00ed) ar an eolas faoi n\u00f3sanna imeachta an ionaid maidir
  le cosaint leana\u00ed mar a bhaineann s\u00e9 le teagasc duine le duine.\\n* Tabharfar
  c\u00f3ip de chl\u00e1r ama an teagaisc 1:1 do chomhordaitheoir an ionaid agus beidh
  s\u00e9 ar taispe\u00e1int i seomra foirne/in oifig an chomhordaitheora.\\n* Is
  faoi sti\u00fair an mh\u00fainteora ranga a dh\u00e9anfar an obair at\u00e1 \u00e1
  d\u00e9anamh ag m\u00fainteoir faoi oili\u00faint/oibr\u00ed deonach chun tac\u00fa
  le mac l\u00e9inn. M\u00e1 t\u00e1 siad chun an seomra ranga a fh\u00e1g\u00e1il,
  d\u00e9anfar an obair seo i dtimpeallacht oscailte e.g., do mhic l\u00e9inn a bhf\u00e9adfadh
  imn\u00ed mh\u00f3r a bheith orthu.\\n* N\u00e1 coinnigh mac l\u00e9inn ina (h)aonar
  riamh i gcuid iarg\u00falta den ionad; m\u00e1 t\u00e1 ceist smachta ann tabhair
  \u00e9/\u00ed go dt\u00ed limist\u00e9ar l\u00e1rnach. Cruinnithe Duine le Duine\\n*
  Re\u00e1cht\u00e1lfar cruinnithe duine le duine de ghn\u00e1thamh in \u00e1iteanna
  poibl\u00ed (e.g., pas\u00e1ist\u00ed, limist\u00e9ar f\u00f3ill\u00edochta), \u00e1it
  a mbeidh an mac l\u00e9inn infheicthe ag daoine eile, i gc\u00f3na\u00ed.\\n* M\u00e1s
  g\u00e1 pr\u00edobh\u00e1ideacht a bheith ag cruinni\u00fa duine le duine, beidh
  cruinni\u00fa den s\u00f3rt sin ar si\u00fal i seomra nach bhfuil aon bhac ar an
  bhfuinneog. N\u00ed chuirfear bac ar bhealach amach an mac l\u00e9inn \u00f3n seomra
  riamh agus n\u00ed bheidh an doras faoi ghlas riamh.\\n\\nAoichainteoir\u00ed\\n\\n*
  Tuairisceoidh na haoichainteoir\u00ed go l\u00e9ir chuig an l\u00e1roifig agus buailfidh
  an m\u00fainteoir/mac l\u00e9inn a thug an cuireadh d\u00f3/di leo anseo.\\n* N\u00ed
  fh\u00e1gfar aoichainteoir ina (h)aonar le gr\u00fapa mac l\u00e9inn cho\u00edche.
  Le haghaidh gach cur i l\u00e1thair, caint, ceardlann, fanfaidh an m\u00fainteoir
  at\u00e1 ar an tr\u00e1thchl\u00e1r n\u00f3 an m\u00fainteoir maoirseachta sannta
  i l\u00e1thair agus n\u00ed fh\u00e1gfaidh s\u00e9/s\u00ed an seomra go dt\u00ed
  go dtiocfaidh an ch\u00e9ad mh\u00fainteoir eile at\u00e1 ar an tr\u00e1thchl\u00e1r
  i l\u00e1thair n\u00f3 go dtiocfaidh an m\u00fainteoir maoirseachta.\\n\\nCleachtais
  agus N\u00f3sanna Imeachta a Bhaineann le Turais Thar O\u00edche\\n\\n1. Beidh cead
  \u00f3 Phr\u00edomhfheidhmeannach DDLETB ag teast\u00e1il sula n-eagr\u00f3far aon
  turas thar o\u00edche thar lear.\\n2. Beidh cead an Chomhordaitheora R\u00e9igi\u00fanaigh
  ag teast\u00e1il sula n-eagr\u00f3far aon turas thar o\u00edche laistigh de Phoblacht
  na h\u00c9ireann.\\n\\n3.\\n\\nBeidh cead scr\u00edofa \u00f3 thuismitheoir(\u00ed)
  agus \u00f3 chaomhn\u00f3ir(\u00ed) ag teast\u00e1il roimh r\u00e9 \u00f3n bhfoireann/m\u00fainteoir
  at\u00e1 ag eagr\u00fa gach turas thar o\u00edche.\\n\\n4. Iarrfar ar thuismitheoir(\u00ed)
  agus ar chaomhn\u00f3ir(\u00ed) aon fhaisn\u00e9is \u00e1bhartha a bhaineann le
  st\u00e1das leighis an mhic l\u00e9inn a chur ar f\u00e1il roimh thuras thar o\u00edche
  at\u00e1 beartaithe.\\n5. Cuirfidh tuismitheoir(\u00ed) agus caomhn\u00f3ir(\u00ed)
  sonra\u00ed teagmh\u00e1la \u00e9igeand\u00e1la an tuismitheora/na dtuismitheoir\u00ed
  agus an chaomhn\u00f3ra/na gcaomhn\u00f3ir\u00ed ar f\u00e1il don fhoireann/m\u00fainteoir
  eagraithe roimh an turas thar o\u00edche.\\n6. Tabharfaidh an fhoireann/m\u00fainteoir
  eagr\u00fach\u00e1in c\u00f3ip d\u00e1 leith\u00e9id de shonra\u00ed an turais do
  chomhordaitheoir an ionaid.\\n7. Maidir le l\u00f3ist\u00edn thar o\u00edche, n\u00ed
  roinnfidh daoine f\u00e1sta, i.e. aon duine at\u00e1 18 mbliana d''aois n\u00f3
  n\u00edos sine, seomra\u00ed le leana\u00ed i.e. aon mhac\\nl\u00e9inn faoi bhun
  18 mbliana d''aois.\\n8. M\u00e1 \u00e9il\u00edonn c\u00fains\u00ed eisceacht\u00fala
  n\u00f3 \u00e9igeand\u00e1la go mbeadh duine f\u00e1sta i seomra leapa ina bhfuil
  mic l\u00e9inn, caithfidh n\u00edos m\u00f3 n\u00e1 mac l\u00e9inn amh\u00e1in a
  bheith sa seomra i gc\u00f3na\u00ed. Nuair a chomhaonta\u00edtear n\u00f3sanna imeachta
  den s\u00f3rt sin cuirfear in i\u00fal do na p\u00e1irtithe go l\u00e9ir iad agus
  d\u00e9anfar iad a thaifeadadh .i.e. (gach ball foirne eile ar an turas, comhordaitheoir
  an ionaid/duine acmhainne at\u00e1 i gceannas ar ais san ionad agus an Comhordaitheoir
  R\u00e9igi\u00fanach).\\n\\nMeas\u00fan\u00fa Riosca Scr\u00edofa ar \u00d3gtheagmh\u00e1il
  na Pri\u00f3ireachta\\n\\nDe r\u00e9ir alt 11 den Acht um Th\u00fas \u00c1ite do
  Leana\u00ed 2015 agus an ceanglas i gCaibidil 8 de na N\u00f3sanna Imeachta um Chaomhn\u00fa
  Leana\u00ed do Bhunscoileanna, Iar-bhunscoileanna 2017, is \u00e9 seo a leanas an
  Meas\u00fan\u00fa Riosca Scr\u00edofa \u00d3gtheagmh\u00e1il na Pri\u00f3ireachta.\\n\\nIs
  \u00e9ard at\u00e1 i riosca i gcomhth\u00e9acs an mheas\u00fanaithe riosca seo n\u00e1
  an riosca D\u00cdOBH\u00c1LA mar at\u00e1 sainmh\u00ednithe san Acht um Th\u00fas
  \u00c1ite do Leana\u00ed, 2015 agus n\u00ed riosca ginear\u00e1lta sl\u00e1inte
  agus s\u00e1bh\u00e1ilteachta.\\n\\na) Ionsa\u00ed, drochch\u00f3ire\u00e1il n\u00f3
  faill\u00ed ar an leanbh ar bhealach a th\u00e9ann i bhfeidhm go tromch\u00faiseach,
  n\u00f3 ar d\u00f3igh d\u00f3 cur isteach go tromch\u00faiseach ar shl\u00e1inte,
  ar fhorbairt n\u00f3 ar leas an linbh, n\u00f3\\n\\nCialla\u00edonn d\u00edobh\u00e1il
  i nd\u00e1il le leanbh\\n\\nb) Droch\u00fas\u00e1id ghn\u00e9asach an linbh\\n\\n1.
  Liosta de ghn\u00edomha\u00edochta\u00ed an ionaid\\n\\n* Teacht agus f\u00e1g\u00e1il
  mac l\u00e9inn laeth\u00fail.\\n* Mic l\u00e9inn ag teacht go d\u00e9anach/ag f\u00e1g\u00e1il
  go luath, ag teacht isteach/ag f\u00e1g\u00e1il tr\u00ed bheala\u00ed isteach/amach
  ionaid eile.\\n* Sosanna caitheamh aimsire do mhic l\u00e9inn e.g., l\u00f3n.\\n*
  Teagasc sa seomra ranga.\\n* Mic l\u00e9inn a mbaint \u00f3n rang.\\n* Druileanna
  d\u00f3ite\u00e1in.\\n* Teagasc duine le duine/taca\u00edocht foghlama le mic l\u00e9inn.\\n*
  Meant\u00f3ireacht duine le duine/pl\u00e9 le mic l\u00e9inn.\\n* Gn\u00edomha\u00edochta\u00ed
  teagaisc taobh amuigh.\\n* Gn\u00edomha\u00edochta\u00ed sp\u00f3irt - san ionad
  agus seach-churaclaim le gn\u00edomhaireachta\u00ed seachtracha.\\n* Turais ionaid.\\n*
  Turais ionaid lena mbaineann iompar.\\n* Turais ionaid lena mbaineann fanacht thar
  o\u00edche.\\n* Turais ionaid lena mbaineann taisteal thar lear.\\n* \u00das\u00e1id
  leithris san ionad.\\n* L\u00e1 sp\u00f3irt / com\u00f3rtas peile bliant\u00fail.\\n*
  L\u00e1/tr\u00e1thn\u00f3na oscailte an ionaid agus l\u00e1/tr\u00e1thn\u00f3na
  na ngradam.\\n* Imeachta\u00ed tiomsaithe airgid a bhaineann le mic l\u00e9inn agus
  le gn\u00edomhaireachta\u00ed seachtracha.\\n* \u00das\u00e1id \u00e1iseanna lasmuigh
  den l\u00e1thair le haghaidh gn\u00edomha\u00edochta\u00ed an ionaid.\\n* C\u00faram
  leana\u00ed a bhfuil riachtanais speisialta oideachais acu.\\n* Bainist\u00edocht
  ar iompra\u00edocht dh\u00fashl\u00e1nach i measc na mac l\u00e9inn.\\n* Leigheas
  ordaithe a riaradh.\\n* Garchabhair a riaradh.\\n* Cruinnithe tuismitheoir\u00ed-m\u00fainteoir\u00ed-mac
  l\u00e9inn.\\n* Sol\u00e1thar curaclaim maidir le OSPS/OCG.\\n* Bula\u00edocht i
  measc mic l\u00e9inn a chosc agus d\u00e9ile\u00e1il l\u00e9i.\\n* Oili\u00faint
  a chur ar phearsanra an ionaid i gc\u00farsa\u00ed cosanta leana\u00ed.\\n* Pearsanra
  seachtrach a \u00fas\u00e1id chun cur leis an gcuraclam.\\n* Pearsanra seachtrach
