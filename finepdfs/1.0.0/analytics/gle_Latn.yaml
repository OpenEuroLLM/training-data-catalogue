  a laghd\u00fa chomh fada agus is f\u00e9idir. T\u00e1 an meas\u00fan\u00fa riosca
  seo cr\u00edochnaithe ag an gCoiste Bainist\u00edochta ar. D\u00e9anfar \u00e9 a
  athbhreithni\u00fa mar chuid d''athbhreithni\u00fa bliant\u00fail \u00d3gtheagmh\u00e1la
  ar a R\u00e1iteas um Chosaint Leana\u00ed.\\n\\nGhlac an Coiste Bainist\u00edochta
  leis an R\u00e1iteas um Chosaint Leana\u00ed seo_\\n\\nNollaig 2022\\n\\nS\u00ednithe\\n\\nCathaoirleach
  an Choiste Bainist\u00edochta\\n\\nD\u00e1ta:\\n\\nS\u00ednithe\\n\\nR\u00fana\u00ed
  don Choiste Bainist\u00edochta\\n\\nD\u00e1ta:\"", "\"Comhordaitheoir Rann\u00f3ige
  Sceidil\\n\\nConradh Buan\\n\\nDe bharr athr\u00fa ar strucht\u00far na foirne is
  mian le TG4 Comhordaitheoir Rann\u00f3ige Sceidil a earc\u00fa a bheidh lonnaithe
  sa gCeann\u00e1ras i nGaeltacht na Gaillimhe. Ag freagairt don Bhainisteoir Sceidil,
  beidh an Comhordaitheoir Rann\u00f3ige Sceidil i gceannas ar shruthanna oibre agus
  ar uainchl\u00e1ir oibre agus saoir\u00ed a chomhord\u00fa.\\n\\nR\u00f3l Nua\\n\\nBeidh
  an t\u00e9 a cheapfar freagrach as ceannasa\u00edocht a ghlacadh ar chomhord\u00fa
  a dh\u00e9anamh ar chl\u00e1r na Rann\u00f3ige Sceidil. I measc na gc\u00faraim\u00ed
  a bheidh i gceist, beidh:\\n\\n* Sceidil l\u00edneacha a chur le ch\u00e9ile & iad
  a chur i bhfeidhm\\n* Comhord\u00fa a dh\u00e9anamh ar chl\u00e1r oibre na gComhordaitheor\u00ed
  Sceidil\\n* Cl\u00fadach saoire/tinnis srl a chomhord\u00fa sa rann\u00f3g. Ionada\u00edocht
  a dh\u00e9anamh ar bhaill na rann\u00f3ige agus ar an mBainisteoir de r\u00e9ir
  mar a oireann, cl\u00fadach saoire, oili\u00fana srl.\\n* Comhord\u00fa a dh\u00e9anamh
  ar an obair fotheidealaithe\\n* Craolta\u00ed Sp\u00f3irt/beochraolta\u00ed ar \u00f3c\u00e1id\u00ed
  beo a shocr\u00fa agus a bheith ar an bpointe teagmh\u00e1la idir comhlachta\u00ed
