  (i) Faigh fad iml\u00edne an tslisne p\u00edotsa seo, ag glacadh le $\\\\pi = 3.14$.\\n\\n(ii)
  M\u00e1 th\u00e9ann an p\u00edotsa seo go paiteanta isteach i mbosca, faigh achar
