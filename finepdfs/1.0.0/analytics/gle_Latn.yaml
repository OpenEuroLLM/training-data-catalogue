  ar dh\u00edobh\u00e1il leagtha amach i gCaibidil 4 de na N\u00f3sanna Imeachta um
  Chosaint Leana\u00ed do Bhunscoileanna agus Iar-bhunscoileanna 2017\\n\\nAgus an
  meas\u00fan\u00fa riosca seo \u00e1 dh\u00e9anamh aige, rinne an Coiste Bainist\u00edochta
  a dh\u00edcheall na riosca\u00ed d\u00edobh\u00e1la a bhaineann le h\u00d3gtheagmh\u00e1il
