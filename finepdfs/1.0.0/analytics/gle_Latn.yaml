  Ciara Cox, Baile an tSl\u00e9ibhe, Co. na Gaillimhe\"", "\"Iris Oifigi\u00fail\\nna
  gComhphobal Eorpach\\n\\nEagr\u00e1n Speisialta *\\n1 Feabhra 1985\\n\\nAn t-eagr\u00e1n
  Gaeilge\\n\\nAcht\u00fa\\n\\nCl\u00e1r\\n\\nConradh ag leas\u00fa, maidir leis an
  nGraonlainn, na gConartha\u00ed ag bun\u00fa na gComhphobal Eorpach ..................................................
  1\\n\\nPr\u00f3tacal ar shocruiithe speisialta don Ghraonlainn .................................................
  7\\n\\nFaisn\u00e9is faoi dh\u00e1t\u00e1 theacht i bhfeidhm an Chonartha ag leas\u00fa,
  maidir leis an nGraonlainn, na gConartha\u00ed ag bun\u00fa na gComhphobal Eorpach
  ....................... 8\\n\\nPraghas: \u00a3 Irl 1,60\\n\\n* Is \u00ed L 29 an
  uimhir a thugtar ar an eagr\u00e1n speisialta seo in eagr\u00e1n den Iris Oifigi\u00fail
  san Ghearm\u00e1inis, san Ghr\u00e9igis, san Fhraincis, san Iod\u00e1ilis, san Ollannais,
  san Danmh\u00e1irgis agus san mB\u00e9arla.\\n\\nCONRADH\\n\\nAg leas\u00fa, maidir
  leis an nGraonlainn, na gConartha\u00ed ag bun\u00fa na gComhphobal Eorpach\\n\\nA
  SHOILSE R\u00cd NA mBEILGEACH,\\n\\nA SOILSE BANR\u00cdON NA DANMHAIRGE,\\n\\nUACHTAR\u00c1N
  PHOBLACHT CH\u00d3NAIDHME NA GEARM.\\n\\nUACHTAR\u00c1N NA POBLACHTA HEILL\u00c9ANA\u00cd,\\n\\nUACHTAR\u00c1N
  PHOBLACHT NA FRAINCE,\\n\\nUACHTAR\u00c1N NA h\u00c9IREANN,\\n\\nUACHTAR\u00c1N
  PHOBLACHT NA hIOD\u00c1ILE,\\n\\nA MH\u00d3RGACHT R\u00cdOGA ARD-DI\u00daC LUCSAMBURG,\\n\\nA
  SOISLE BANR\u00cdON NA h\u00cdSILT\u00cdRE,\\n\\nA SOILSE BANR\u00cdON R\u00cdOCHT
  AONTAITHE NA BREATAINE M\u00d3IRE AGUS THUAISCEART \u00c9IREANN,\\n\\nAG F\u00c9ACHAINT
  d''Airteagal 96 den Chonradh ag bun\u00fa an Chomhphobail Eorpaigh do Ghual agus
  Cruach,\\n\\nAG F\u00c9ACHAINT d''Airteagal 236 den Chonradh ag bun\u00fa Chomhphobal
  Eacnama\u00edochta na hEorpa,\\n\\nAG F\u00c9ACHAINT d''Airteagal 204 den Chonradh
  ag bun\u00fa an Chomhphobail Eorpaigh do Fhuinneamh Adamhach,\\n\\nDE BHR\u00cd
  go bhfuil togra curtha faoi bhr\u00e1id na Comhairle ag R\u00edocht na Danmhairge
  d''honn na Conartha\u00ed ag bun\u00fa na gComhphobal Eorpach a athch\u00f3iri\u00fa
  chun deireadh a chur lena bhfeidhm i leith na Graonlainne agus chun socruithe nua
  ag rial\u00fa an chaidrimh idir na Comhphobail agus an Ghraonlainn a thabhairt isteach;\\n\\nDE
  BHR\u00cd gur choir, i bhf\u00edanaise shainghn\u00e9ithe na Graonlainne, glacad
  leis an togra sin tr\u00ed socruithe a thabhairt isteach a choth\u00f3idh d\u00falthcheangail
  bhuna\u00ed idir an Comhphobal agus an Ghraonlainn agus a thabharfaidh aird ar a
  gcomhleas, agus go h\u00e1irithe ar riachtanais fh\u00f3rbr\u00e1fochta na Graonlainne;\\n\\nDE
  BHR\u00cd gurb iad na socruithe a bhaineann leis na tiortha agus na cr\u00edocha
  thar lear, arna leagan sios i gCuid a Ceathair den Chonradh ag bun\u00fa Chomhphobal
  Eacnama\u00edochta na hEorpa, an fr\u00e1ma ionchu\u00ed don chaidreamh sin, c\u00e9
  gur g\u00e1 breisfh\u00f3r\u00e1lacha sonracha don Ghraonlainn,\\n\\nTAR \u00c9IS
  cinneadh socruithe nua a bhainfidh leis an nGraonlainn a leagan sios de thoil a
  ch\u00e9ile agus, chun na cr\u00edche sin, tar \u00e9is na daoine seo a leanas a
  cheapadh mar L\u00e1nchumhachtaigh:\\n\\nA SHOISLE R\u00ed na mBEILGEACH:\\n\\nLeo
  TINDEMANS,\\nAire Caidrimh Eachtraigh\\nR\u00edocht na Beilge\\n\\nA SOILSE BANRION
  NA DANMHAIRGE:\\n\\nUffe ELLEMANN-JENSEN,\\nAire Gn\u00f3thai Eachtracha\\nna Danmhairge\\n\\nGunnar
  RIBERHOLDT,\\nAmbasad\u00f3ir Urghnach agus L\u00e1nchumhachtach\\nBuan-Ionada\u00ed
  na Danmhairge\\n\\nUACHTAR\u00c1N PHOBLACHT CH\u00d3NAIDHME NA GEARM\u00c1INE:\\n\\nHans-Dietrich
  GENSCHER,\\nAire Gn\u00f3thai Eachtracha\\nPhoblacht Ch\u00f3naidhme na Gearm\u00e1ine\\n\\nUACHTAR\u00c1N
  NA POBLACHTA HEILL\u00c9ANA\u00cd:\\n\\nTheodoros PANGALOS,\\nSt\u00e1t-R\u00fanai
  Gn\u00f3thai Eachtracha\\nna Poblachta Heill\u00e9ana\u00ed\\n\\nUACHTAR\u00c1N
  PHOBLACHT NA FRAINCE:\\n\\nRoland DUMAS,\\nAire Gn\u00f3thai Eorpacha\\nPhoblacht
  na Fraince\\n\\nUACHTAR\u00c1N NA h\u00c9IREANN:\\n\\nPeter BARRY,\\nAire Gn\u00f3thai
  Eachtracha,\\nna h\u00c9ireann\\n\\nUACHTAR\u00c1N PHOBLACHT NA hIOD\u00c1ILE:\\n\\nGiulio
  ANDREOTTI,\\nAire Gn\u00f3thai Eachtracha,\\nPhoblacht na hIod\u00e1ile\\n\\nA MH\u00d3RGACHT
  R\u00cdOGA ARD-DI\u00daC LUCSAMBURG:\\n\\nColette FLESCH,\\nAire Gn\u00f3thai Eachtracha
  Rialtas\\nArd-Di\u00faiceacht Lucsamburg\\n\\nA SOILSE BANRION NA hISILT\u00cdRE:\\n\\nW.
  F. van EEKELEN,\\nSt\u00e1t-R\u00fanai Gn\u00f3thai Eachtracha\\nna Poblachta Heill\u00e9ana\u00ed\\n\\nH.
  J. Ch. RUTTEN,\\nAmbasad\u00f3ir Urghnach agus L\u00e1nchumhachtach,\\nBuan-Ionada\u00ed
  na hIsilt\u00edre\\n\\nA SOILSE BANRION R\u00cdOCHT AONTAITHE NA BREATAINE M\u00d3IRE
  AGUS THUAISCEART \u00c9IREANN:\\n\\nThe Right Honourable Sir Geoffrey Howe Q.C.,
  M.P.,\\nR\u00fanai St\u00e1it do Ghn\u00f3thai Eachtracha agus Gn\u00f3thai Comhlathais\\n\\nNOCH
  A RINNE, tar \u00e9is d\u00f3ibh a L\u00e1nchumhachta\u00ed, agus iad i bhfoirm
  cheart chu\u00ed, a thabhairt ar aird a ch\u00e9ile, COMHAONT\u00da mar a leanas:\\n\\n**Airteagal
  1**\\n\\nCuirfear an fhomh\u00edr seo a leanas le pointe (a) den dara mhir d''Airteagal
  79 den Chonradh ag bun\u00fa an Chomhphobail Eorp\u00e1igh do Ghual agus Cruach:\\n\\n''Ni
  bha\u00ednfidh an Conradh seo leis an nGraonlainn.''\\n\\n**Airteagal 2**\\n\\nCuirfear
  an Danmhaig leis na Ballst\u00e1it a ainmn\u00edtear sa ch\u00e9ad abairt den ch\u00e9ad
  mhir d''Airteagal 131 den Chonradh ag bun\u00fa Chomhphobail Eacnama\u00edochta
  na hEorpa.\\n\\n**Airteagal 3**\\n\\n1. Cuirfear Airteagal 136a mar a leanas le
  Cuid a Ceathair den Chonradh ag bun\u00fa Chomhphobail Eacnama\u00edochta na hEorpa:\\n\\n''Airteagal
  136a\\n\\nBeidh feidhm ag Airteagal 131 go 136 i leith na Graonlainne, faoi r\u00e9ir
  na bhfor\u00e1lacha sonracha don Ghraonlainn arna leagan amach sa Phr\u00f3tacal
  ar shocruithe speisialta don Ghraonlainn at\u00e1 i gceangal leis an gConradh seo.''\\n\\n2.
  Cuirfear an Phr\u00f3tacal ar shocruithe speisialta don Ghraonlainn at\u00e1 ag
  gabh\u00e1il leis an gConradh seo i gceangal leis an gConradh ag bun\u00fa Comhphobail
  Eacnama\u00edochta na hEorpa. Aisghairtear leis seo Phr\u00f3tacal Uimh. 4 ar an
  nGraonlainn at\u00e1 i gceangal le hAcht Aontachais an 22 Ean\u00e1ir 1972.\\n\\n**Airteagal
  4**\\n\\nCuirfear an Ghraonlainn leis an liosta in Iarscr\u00edbhinn IV den Chonradh
  ag bun\u00fa Comhphobail Eacnam\u00e1iochta na hEorpa.\\n\\n**Airteagal 5**\\n\\nCuirfear
  an fhomh\u00edr seo a leanas le pointe (a) den tr\u00ed\u00fa mhir d''Airteagal
  198 den Chonradh ag bun\u00fa an Chomhphobail Eorp\u00e1igh do Fhuinneamh Adamhach:\\n\\n''Ni
  bha\u00ednfidh an Conradh seo leis an nGraonlainn.''\\n\\n**Airteagal 6**\\n\\n1.
  D\u00e9anfaidh na hArdph\u00e1irtithe Conarthaacha daingni\u00fa ar an gConradh
  seo de r\u00e9ir a rialacha bunreacht\u00fala faoi seach. Taiscfear na hionstraim\u00ed
  daingni\u00fach\u00e1in le Rialtas Phoblacht na hIod\u00e1ile.\\n\\n2. Tiocfaidh
  an Conradh seo i bhfeidhm an 1 Ean\u00e1ir 1985. M\u00e1s rud \u00e9 nach mbeidh
  na hionstraim\u00ed daingni\u00fach\u00e1in go l\u00e9ir taiscthe faoin d\u00e1ta
  sin, tiocfaidh an Conradh seo i bhfeidhm an ch\u00e9ad l\u00e1 den mhi i ndiaidh
  taisceadh na hionstraim\u00e9 daingni\u00fach\u00e1in ag an gceann is d\u00e9anna\u00ed
  de St\u00e1it a sh\u00ednithe a dh\u00e9anfaidh an taisceadh sin.\\n\\nAireagal
  7\\n\\nTarraingi\u00f3dh an Conradh seo suas i scr\u00edbhinn bhunaidh amh\u00e1in
  sa Bh\u00e9arla, sa Danmhairg\u00eds, sa Fhraincis, sa Ghaeilge, sa Ghearm\u00e1inis,
  sa Ghr\u00e9igis, san Iod\u00e1ilis agus san Ollainnis, agus comh\u00fadar\u00e1s
  ag gach ceann de na hocht dt\u00e9acs; taiscfe\u00e1r \u00e9 i gc\u00e1rtlann Rialtas
  Phoblacht na h\u00c9rod\u00e1ile, agus cuirfidh an Rialtas sin c\u00f3ip dheimhnithe
  chuig Rialtas gach ceann eile de St\u00e1t a sh\u00ednithe.\\n\\nTil bekraftelse
  heraf har undertegnede befuldm\u00e6gtigede underskrevet denne Traktat.\\n\\nZu
  Urkund dessen haben die unterzeichneten Bevollm\u00e4chtigten ihre Unterschriften
  unter diesen Vertrag gesetzt.\\n\\n\u03a3\u03b5 \u03c0\u03af\u03c3\u03c4\u03c9\u03c3\u03b7
  \u03c4\u03c9\u03bd \u03b1\u03bd\u03c9\u03c4\u03ad\u03c1\u03c9 \u03bf\u03b9 \u03c5\u03c0\u03bf\u03b3\u03b5\u03b3\u03c1\u03b1\u03bc\u03bc\u03ad\u03bd\u03bf\u03b9
  \u03c0\u03bb\u03b7\u03c1\u03b5\u03be\u03bf\u03c5\u03c3\u03af\u03b1\u03b9 \u03c5\u03c0\u03ad\u03b3\u03c1\u03b1\u03c8\u03b1\u03bd
  \u03c4\u03b7\u03bd \u03c0\u03b1\u03c1\u03cc\u03bd\u03c4\u03b1 \u03c3\u03c5\u03bd\u03b8\u03ae\u03ba\u03b7.\\n\\nIn
  witness whereof, the undersigned Plenipotentiaries have affixed their signatures
  below this Treaty.\\n\\nEn foi de quoi, les pl\u00e9nipotentiaires soussign\u00e9s
  ont appos\u00e9 leur signature au bas du pr\u00e9sent trait\u00e9.\\n\\nD\u00e1
  fhian\u00fa sin, chuir na L\u00e1nchumhachtaigh th\u00edos-s\u00ednithe a l\u00e1mh
  leis an gConradh seo.\\n\\nIn fede di che, in plenipotenziari sottoscritti hanno
  apposto le loro firme in calce al presente trattato.\\n\\nTen blijk van waarvan
  de ondergetekende gevolmachtigden hun handtekening onder dit Verdrag hebben gesteld.\\n\\nUdf\u00e6rdiget
  i Bruxelles, den trettende marts nitten hundrede og fireogfirs.\\n\\nGeschehen zu
  Br\u00fcssel am dreizehnten M\u00e4rz neunzehnhundertvierundachtzig.\\n\\n\u0388\u03b3\u03bd\u03b5
  \u03c3\u03c4\u03b9\u03c2 \u0392\u03c1\u03c5\u03be\u03ad\u03bb\u03bb\u03b5\u03c2,
  \u03c3\u03c4\u03b9\u03c2 \u03b4\u03b5\u03ba\u03b1\u03c4\u03c1\u03b5\u03af\u03c2
  \u039c\u03b1\u03c1\u03c4\u03af\u03bf\u03c5 \u03c7\u03af\u03bb\u03b9\u03b1 \u03b5\u03bd\u03bd\u03b9\u03b1\u03ba\u03cc\u03c3\u03b9\u03b1
  \u03bf\u03b3\u03b4\u03cc\u03bd\u03c4\u03b1 \u03c4\u03ad\u03c3\u03c3\u03b5\u03c1\u03b1.\\n\\nDone
  at Brussels on the thirteenth day of March in the year one thousand nine hundred
  and eighty-four.\\n\\nFait \u00e0 Bruxelles, le treize mars mil neuf cent quatre-vingt-quatre.\\n\\nArna
  dh\u00e9anamh sa Bruis\u00e9il an tr\u00ed\u00fa l\u00e1 d\u00e9ag de mh\u00ed M\u00e1rta
  sa bhliain mile naoi gc\u00e9ad ocht\u00f3 a ceathair.\\n\\nFatto a Bruxelles, add\u00ec
  tredici marzo millenovecentottantaquattro.\\n\\nGedaan te Brussel, de dertiende
  maart negentienhonderd vierentachtig.\\n\\nHumphreys\\nPittendrigh\\n\\nMr. Mr.
  Pitt\\n\\nD. B.\\n\\nR. D. Harris\\n\\nLisbon\\n\\nGlasgow\\n\\nBrussels\\n\\nLondon\\n\\nGlasgow\\n\\nGlasgow\\n\\nPR\u00d3TACAL\\n\\nar
  shocruithe speisialta don Ghraonlainn\\n\\nAirteagal 1\\n\\n1. An ch\u00f3ir a thugtar,
  ar a n-allmhairi\u00fa isteach sa Comhphobal, do th\u00e1irg\u00ed at\u00e1 faoi
  r\u00e9ir ag comheagra\u00edocht an mhargaidh do th\u00e1irg\u00ed iascaireachta
  agus ar de thionscnamh na Graonlainne iad, beidh ar \u00e1ireamh inti, gan dochar
  do sh\u00e1sra chomhegra\u00edochta an mhargaidh, diol\u00faine \u00f3 dhleachtanna
  custaim agus \u00f3 mhuirir chomh\u00e9ifeachta agus saoirse \u00f3 shrianta cainn\u00edochtula
  agus bearta comh\u00e9ifeachta, m\u00e1s s\u00e1s\u00fail don Chomhphobal na deiseanna
  rochtana ar limit\u00e9ir iascaireachta na Graonlainne a dheon\u00f3far don Chomhphobal
  de bhun chomhaont\u00fa idir an Comhphobal agus an t-\u00fadar\u00e1s is freagrach
  as an nGraonlainn.\\n\\n2. Na bearta uilig a bhaineann leis na socruithe d''allmhairi\u00fach\u00e1n
  na dt\u00e1irg\u00ed sin, ar a n-\u00e1iritear iad si\u00fad a bhaineann le glacadh
  na mbeart sin, glacfar iad de r\u00e9ir an n\u00f3s imeachta at\u00e1 leagtha sios
  in Airteagal 43 den Chonradh ag bun\u00fa Chomhphobal Eacnamaiochta na hEorpa.\\n\\nAirteagal
  2\\n\\nCuirfidh an Coimisi\u00fan tograi faoi bhr\u00e1id na Comhairle, a ghn\u00edomh\u00f3idh
  tr\u00ed thromlach c\u00e1ilithe, maidir leis na bearta id\u00edtrhreimhseacha a
  mheasann s\u00e9 is riachtanach, de bharrr theacht i bhfeidhm na socruithe nua,
  i dtaca le caomhn\u00fa ceart a bh\u00ed sealbhaithe ag daoine idir n\u00e1d\u00fartha
  agus dl\u00edtheanach sa tr\u00e9imhse nuair a bh\u00ed an Ghraonlainn ina cuid
  den Chomhphobal agus le r\u00e9iteach a dh\u00e9anamh maidir le c\u00fanamh airgid
  a dheonaigh an Comhphobal don Ghraonlainn sa tr\u00e9imhse sin.\\n\\nAirteagal 3\\n\\nCuirfear
  an t\u00e9acs seo a leanas le hIarscribhinn I a ghabhann le Cinneadh na Comhairle
  den 16 Nollaig 1980 maidir le comhlach\u00fa na dt\u00edortha agus na gc\u00e9iroch
  thar lear le Comhphobal Eacnamaiochta na hEorpa:\\n\\n\u20186. Pobal ar leith de
  chuid R\u00edocht na Danmhairge:\\n\u2014 an Ghraonlainn.\u2019\\n\\nFaisn\u00e9is
  faoi dh\u00e1t\u00e1 theacht i bhfeidhm an Chonartha ag leas\u00fa, maidir leis
  an nGraonlainn, na gConarthai ag bun\u00fa na gComhphobal Eorpach\\n\\n\u00d3 t\u00e1
  na n\u00f3sanna imeachta is g\u00e1 do theacht a bhfeidhm an Chonartha ag leas\u00fa,
  maidir leis an nGraonlainn, na gConarthai ag bun\u00fa na gComhphobal Eorpach curtha
  i gcr\u00edch, tiocf\u00e1idh an Conradh i bhfeidhm, de r\u00e9ir Airteagal 6 (2)
  d\u00e1 th\u00e9acs, ar 1 Feabhra 1985.\\n\\n| Oifig\u00ed D\u00edolach\u00e1in
