  \\\\\\\\\\n60 \\\\text{ m} \\\\\\\\\\n\\\\end{array}\\n\\\\]\\n\\n(ii)\\n\\\\[\\n\\\\begin{array}{c}\\n22
  \\\\text{ m} \\\\\\\\\\n\\\\downarrow \\\\\\\\\\n38 \\\\text{ m} \\\\\\\\\\n\\\\end{array}\\n\\\\]\\n\\n10.
  Aimsigh achar sc\u00e1thaithe na dronuilleoige ar dheis, \u00e1it a gcuireann saigheada
  l\u00ednte comhthreomhara in i\u00fal.\\n\\n11. Rinne \u00c1ine meastach\u00e1n
  ar an m\u00e9id gloine a bh\u00ed ag teast\u00e1il le haghaidh taobh amh\u00e1in
