  Patrick''s Primary School, Machaire R\u00e1tha\\n\\nSt Peter and St Paul Primary
  School, D\u00fan Geimhin\\nSt Theresa''s Primary School, B\u00e9al Feirste Tonagh
  Primary School, Lios na gCearrbhach Victoria Preparatory School, B\u00e9al Feirste\\n\\nS\u00e9anadh\\nN\u00ed
  hionann tagairt a bheith in Maireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. d''\u00e1bhar
  tr\u00ed\u00fa p\u00e1irt\u00ed go bhformhuin\u00edonn CCEA foilsitheoir\u00ed an
  \u00e1bhair seo n\u00e1 a dt\u00e1irg\u00ed. D\u00e9anfar tagairt d''\u00e1bhar
  tr\u00ed\u00fa p\u00e1irt\u00ed ar ch\u00faiseanna comhth\u00e9acs agus praitici\u00fala
  amh\u00e1in.\\nB''ann do shu\u00edmh Ghr\u00e9as\u00e1in a dtagra\u00edtear d\u00f3ibh
  in Maireacht\u00e1il. Foghlaim. Le Ch\u00e9ile. ag am a fhoilsithe. N\u00edl CCEA
  freagrach as a bhfuil ar na su\u00edmh Ghr\u00e9as\u00e1in seo. Caithfidh l\u00e9itheoir\u00ed
  seoladh na su\u00edmh Ghr\u00e9as\u00e1in seo a scr\u00fad\u00fa go c\u00faramach
  le f\u00e9achaint ar athraigh siad agus aon athr\u00fa a bhreacadh m\u00e1s cu\u00ed.\\nRinneadh
  gach iarracht c\u00f3ipcheart na n-\u00e1bhar a \u00fas\u00e1ideadh sa chl\u00e1r
  seo a lorg. I gc\u00e1sanna nach raibh seo ind\u00e9anta, beidh CCEA s\u00e1sta
  na gn\u00e1thshocruithe a dh\u00e9anamh amach anseo.\"", "\"Tuarasc\u00e1il ar Nochtuithe
  Cosanta, 2021\\n\\nFaoi Alt 22 den Acht um Nochtadh Cosanta, 2014, iarrtar ar gach
  comhlacht poibl\u00ed tuarasc\u00e1il bhliant\u00fail a fhoilsi\u00fa ina leagtar
  amach l\u00edon na nochtuithe cosanta a fuarthas sa bhliain roimhe agus an gn\u00edomh
  a rinneadh (m\u00e1s ann). N\u00ed m\u00f3r nach bhf\u00e9adfa\u00ed daoine a dh\u00e9anann
  nochtuithe a aithint mar gheall ar an tuarasc\u00e1il seo.\\n\\nCuireann na Coimisin\u00e9ir\u00ed
  Ioncaim timpeallacht thac\u00fail chun cinn d\u00e1r mbaill foirne imn\u00ed a ard\u00fa
  i dtaca le h\u00e9ag\u00f3ir n\u00f3 \u00e9ag\u00f3ir a d''fh\u00e9adfadh tarl\u00fa
  sa l\u00e1thair oibre agus sol\u00e1thra\u00edmid an taca\u00edocht riachtanach
  d''oibrithe a thugann f\u00edorch\u00faiseanna imn\u00ed chun solais.\\n\\nCl\u00fada\u00edonn
  an tuarasc\u00e1il seo an tr\u00e9imhse an 1 Ean\u00e1ir go dt\u00ed an 31 Nollaig
  2021.\\n\\nIn 2021, arda\u00edodh dh\u00e1 \u00e1bhar imn\u00ed faoi ''Polasa\u00ed
  na gCoimisin\u00e9ir\u00ed Ioncaim i leith Nochtadh Cosanta a thuairisci\u00fa san
  Ionad Oibre''. Rinne Gr\u00fapa Nochtuithe Cosanta na gCoimisin\u00e9ir\u00ed Ioncaim
  meas\u00fan\u00fa ar na h\u00e1bhair imn\u00ed seo agus rinneadh beart leantach
  cu\u00ed.\\n\\nIs duine forordaithe faoin Ord\u00fa um an Acht Nochtuithe Cosanta
  2014 (Nochtadh do Dhaoine Forordaithe) \u00e9 Sti\u00farth\u00f3ir Ini\u00fachta\u00ed
  Inmhe\u00e1nacha na gCoimisin\u00e9ir\u00ed Ioncaim i nd\u00e1il leis na h\u00e1bhair
  uile a bhaineann le meas\u00fan\u00fa, baili\u00fa agus bainisti\u00fa c\u00e1nacha
  agus dleachtanna. In 2021, rinneadh aon nochtadh dh\u00e9ag leis an Sti\u00farth\u00f3ir
  Ini\u00fachta\u00ed Inmhe\u00e1nacha. Bh\u00ed gach nochtadh faoi r\u00e9ir meas\u00fanaithe
  agus imscr\u00faduithe n\u00f3 oscla\u00edodh idirghabh\u00e1lacha de r\u00e9ir
  mar is cu\u00ed.\\n\\nT\u00e1 na Coimisin\u00e9ir\u00ed Ioncaim mar bhall den chl\u00e1r
  Integrity at Work, tionscnamh de chuid Transparency International Ireland agus t\u00e1imid
  tiomanta d''ionad oibre eitici\u00fail a choth\u00fa. In 2021, fuair 30 ball foirne
  oili\u00faint ar dhea-chleachtais maidir le d\u00e9ile\u00e1il le sceithireacht
  agus nochtuithe cosanta.\"", "\"Lucsamburg, 24/03/2020\\n\\nTAG.:\\n\\nCDT-AD5-2020/02
  SPEISIALT\u00d3IR MEAIS\u00cdNFHOGHLAMA\\n\\nGR\u00c1D:\\n\\nAD5\\n\\nROINN:\\n\\nAN
  ROINN TACA\u00cdOCHTA AISTRI\u00daCH\u00c1IN LUCSAMBURG\\n\\n\u00c1IT FOSTA\u00cdOCHTA:\\n\\nBuna\u00edodh
  Ionad Aistri\u00fach\u00e1in Chomhlachta\u00ed an Aontais Eorpaigh sa bhliain 1994
  chun seirbh\u00eds\u00ed aistri\u00fach\u00e1in a chur ar f\u00e1il do na comhlachta\u00ed
  \u00e9ags\u00fala de chuid an Aontais Eorpaigh. T\u00e1 s\u00e9 lonnaithe i Lucsamburg.
  T\u00e1 m\u00e9ad\u00fa suntasach tagtha ar ualach oibre an Ionaid \u00f3 buna\u00edodh
  \u00e9 agus t\u00e1 thart ar 200 ball foirne fostaithe ann anois.\\n\\nChun freastal
  ar riachtanais na Roinne Taca\u00edochta Aistri\u00fach\u00e1in, go h\u00e1irithe
  ar riachtanais na Rann\u00f3ige Taca\u00edochta um Fhorbairt Gn\u00f3 agus Sreabhadh
  Oibre, t\u00e1 n\u00f3s imeachta roghn\u00fach\u00e1in \u00e1 eagr\u00fa ag an Ionad
  Aistri\u00fach\u00e1in chun liosta c\u00faltaca a dh\u00e9anamh le baill foirne
  sealadacha a earc\u00fa faoi Airteagal 2(f) de Choinn\u00edollacha Fosta\u00edochta
  Sheirbh\u00edsigh Eile an Aontais Eorpaigh 1 do na gn\u00edomha\u00edochta\u00ed
  seo a leanas:\\n\\nCINE\u00c1L NA DTASCANNA\\n\\nAgus \u00e9/\u00ed ag tuairisci\u00fa
  go d\u00edreach do Cheann na Rann\u00f3ige Taca\u00edochta um Fhorbairt Gn\u00f3
  agus Sreabhadh Oibre, beidh an t-iarrth\u00f3ir a roghn\u00f3far freagrach as na
  tascanna seo a leanas a chomhl\u00edonadh:\\n\\n[x] Innill saincheaptha de mheais\u00ednaistri\u00fach\u00e1in
  n\u00e9araigh (NMT) at\u00e1 bunaithe ar uirlis\u00ed foinse oscailte at\u00e1 ann
  a chur i bhfeidhm, a fheabhs\u00fa agus a choth\u00fa.\\n[x] P\u00edbl\u00ednt\u00ed
  pr\u00f3ise\u00e1la sonra\u00ed a fhorbairt, a fheabhs\u00fa agus a choth\u00fa
  lena n-\u00fas\u00e1id in ailtireachta\u00ed l\u00edonra\u00ed n\u00e9aracha agus
  foins\u00ed sonra\u00ed at\u00e1 ann a ghlanadh, a trasfhoirmi\u00fa agus a mhap\u00e1il
  san \u00e1ireamh.\\n[x] Pr\u00f3isis a bhaineann le NMT a chomhl\u00edonadh agus
  monat\u00f3ireacht a dh\u00e9anamh orthu, ti\u00fanadh innill, traen\u00e1il, meast\u00f3ireacht
  agus imscaradh san \u00e1ireamh.\\n[x] Gn\u00edomha\u00edochta\u00ed forbartha a
  riaradh chun na cumais reatha maidir le meais\u00ednaistri\u00fach\u00e1n agus c\u00f3rais
  n\u00e9ara\u00ed eile a leathn\u00fa agus a bharrfheabhs\u00fa agus oiri\u00fan\u00fa
  fearainn san \u00e1ireamh ach gan a bheith teoranta d\u00f3.\\n[x] Dr\u00e9acht-shonra\u00edochta\u00ed
  agus molta\u00ed maidir le comhph\u00e1irteanna saincheaptha a bhaineann le mais\u00ednaistri\u00fach\u00e1n
  agus sreafa\u00ed oibre de thras-scr\u00edobh meais\u00edn.\\n[x] Doicim\u00e9ad\u00fa
  teicni\u00fail agus n\u00f3sanna imeachta a dhr\u00e9acht\u00fa maidir le cothabh\u00e1il,
  imscaradh agus \u00fas\u00e1id na gcomhph\u00e1irteanna agus maidir le c\u00f3rais
  a d''fhorbair an fhoireann.\\n[x] Gn\u00edomha\u00edochta\u00ed faire teicneola\u00edochta
  i r\u00e9imse na hintleachta saorga (AI) a chuirtear i bhfeidhm ar mheais\u00ednaistri\u00fach\u00e1n,
  aithint cainte agus pr\u00f3se\u00e1il teanga n\u00e1d\u00fartha (NLP).\\n\\n1 D''fh\u00e9adfa\u00ed
  an liosta c\u00faltaca c\u00e9anna a \u00fas\u00e1id chun baill foirne shealadacha
  a earc\u00fa faoi Airteagal 2(b) de Choinn\u00edollacha Fosta\u00edochta Sheirbh\u00edsigh
  Eile an Aontais Eorpaigh.\\n\\n[x] Sonra\u00ed a anail\u00edsi\u00fa, a phr\u00f3ise\u00e1il
  agus a \u00fas\u00e1id tr\u00ed theicn\u00edc\u00ed gan mhaoirsi\u00fa agus faoi
  mhaoirseacht.\\n[x] Foins\u00ed sonra\u00ed a fh\u00e1il agus a bhainisti\u00fa
  ar leibh\u00e9il ard uathoibrithe chun na c\u00f3rais at\u00e1 ann a fheabhs\u00fa.\\n[x]
  Taca\u00edocht a shol\u00e1thar don Roinn TF agus don Roinn Taca\u00edochta Aistri\u00fach\u00e1in
  maidir leis na comhth\u00e1thaithe at\u00e1 ann i r\u00e9imse na foghlama meais\u00edn.\\n[x]
  Na coinbhinsi\u00fain agus na caighde\u00e1in at\u00e1 ann i r\u00e9imse an aistri\u00fach\u00e1in
  mheais\u00edn agus na mianad\u00f3ireachta sonra\u00ed a chur i bhfeidhm agus a
  lean\u00faint.\\n[x] Tascanna eile a dh\u00e9anamh a bhaineann le NMT agus NLP de
  r\u00e9ir mar a iarrtar.\\n\\n1. CRIT\u00c9IR ROGHN\u00daCH\u00c1IN:\\n\\nChun a
  bheith inch\u00e1ilithe chun p\u00e1irt a ghlacadh sa n\u00f3s imeachta roghn\u00fach\u00e1in
  seo, n\u00ed m\u00f3r don iarratas\u00f3ir 27/04/2020 na ceanglais seo a leanas
  a chomhl\u00edonadh ar an d\u00e1ta deiridh le hiarratais a chur isteach:\\n\\na)
  CRIT\u00c9AR INCH\u00c1ILITHEACHTA:\\n\\n[x] a bheith ina n\u00e1isi\u00fanach de
  ceann de Bhallst\u00e1it an Aontais Eorpaigh;\\n[x] leibh\u00e9al oideachais is
  comhionann le c\u00farsa ioml\u00e1n Ollscoile tr\u00ed bliana ar a laghad arna
  fhian\u00fa le diopl\u00f3ma a bheith acu 2 ;\\n[x] scileanna teanga: eolas cuimsitheach
  a bheith acu ar cheann amh\u00e1in de theangacha oifigi\u00fala an Aontais Eorpaigh
  agus eolas s\u00e1s\u00fail a bheith acu ar theanga oifigi\u00fail eile de chuid
  an Aontais Eorpaigh, a mh\u00e9id is g\u00e1 chun na dualgais a bhaineann leis an
  bpost a chomhl\u00edonadh.\\n\\nb) INNI\u00daLACHTA\u00cd TEICNI\u00daLA RIACHTANACHA:\\n\\n[x]
  Bliain amh\u00e1in ar a laghad de thaith\u00ed ghairmi\u00fail chruthaithe i bhfoghlaim
  meais\u00edn n\u00f3 i bpr\u00f3ise\u00e1il teanga n\u00e1d\u00fartha;\\n[x] Eolas
  maith ar l\u00edonra\u00ed n\u00e9aracha, teicn\u00edc\u00ed agus uirlis\u00ed foghlama
  meais\u00edn, agus samhlacha tuairisci\u00fala agus tuarthacha, leabharlanna caighde\u00e1nacha
  agus ard\u00e1in san \u00e1ireamh;\\n[x] Taith\u00ed l\u00e1idir ar obair le teangacha
  scriptithe (Python, Bash);\\n[x] Eolas maith ar mhodhanna pac\u00e1istithe agus
  ar chleachtais maidir le comhaid inrite (scripteanna agus/n\u00f3 comhaid dh\u00e9n\u00e1rtha)
  chun in-atrialltacht agus lean\u00fanachas oibr\u00edochta\u00ed ar thimpeallachta\u00ed
  t\u00e1irgeachta a chinnti\u00fa;\\n[x] Eolas maith ar Unix (Ubuntu, Red Hat).\\n[x]
  Eolas maith ar chleachtais sl\u00e1nd\u00e1la an ch\u00f3rais faisn\u00e9ise.\\n\\nc)
  INNI\u00daLACHTA\u00cd INMHIANAITHE:\\n\\n[x] Taith\u00ed ar mheais\u00ednaistri\u00fach\u00e1n
  n\u00e9arach a chur i bhfeidhm;\\n[x] Taith\u00ed ar ph\u00edbl\u00ednte chun sonra\u00ed
  t\u00e9acs a phr\u00f3ise\u00e1il;\\n\\n2 N\u00ed chuirtear san \u00e1ireamh ach
  diopl\u00f3ma\u00ed agus teastais a bronnadh i mBallst\u00e1it AE n\u00f3 lena mbaineann
  teastais chomhionannais arna n-eisi\u00faint ag \u00fadar\u00e1is sna Ballst\u00e1it
  sin.\\n\\n[x] Taiti ar leabharlanna foghlama meais\u00edn bunaithe ar fhoinse oscailte
  (Tensorflow/Keras, Pytorch);\\n[x] Eolais n\u00f3 taith\u00ed ar theicn\u00edc\u00ed
  pr\u00f3ise\u00e1la teanga n\u00e1d\u00fartha;\\n[x] Eolas n\u00f3 taith\u00ed ar
  fheidhmeanna aitheanta cainte;\\n[x] Eolas ar aon teanga r\u00edomhchl\u00e1r\u00fach\u00e1in
  eile (Java, C#, C++, R, Matlab, Javascript);\\n[x] Eolas n\u00f3 taith\u00ed ar
  ch\u00f3rais rialaithe a bhainist\u00edonn athruithe ar an gc\u00f3d foinseach (m.sh.
  GIT);\\n[x] Taith\u00ed n\u00f3 teastais ar r\u00edomh scamall-bhunaithe agus seirbh\u00eds\u00ed
  st\u00f3r\u00e1la (AWS, Azure);\\n[x] Eolas n\u00f3 taith\u00ed ar phr\u00f3isis
  chaighde\u00e1nacha maidir le mianad\u00f3ireacht sonra\u00ed (CRISP-DM, ASUM-DM);\\n[x]
  Taith\u00ed ghairmi\u00fail 6 mh\u00ed ar a laghad ar obair a dh\u00e9anamh in institi\u00faid,
  gn\u00edomhaireacht n\u00f3 comhlacht AE n\u00f3 in institi\u00faid idirn\u00e1isi\u00fanta
  sa r\u00e9imse saineolais (i.e. teicneola\u00edocht aistri\u00fach\u00e1in n\u00f3
  log\u00e1n\u00fa);\\n[x] Eolas ar chaighde\u00e1in aistri\u00fach\u00e1in (XLIFF,
  TMX);\\n[x] Foilseach\u00e1in eola\u00edochta sna r\u00e9ims\u00ed Faisn\u00e9ise
  Saorga n\u00f3 Pr\u00f3ise\u00e1il Teanga N\u00e1d\u00fartha.\\n\\nd) INNI\u00daLACHTA\u00cd
  NEAMHTHEICNI\u00daLA RIACHTANACHA:\\n\\n[x] Cumars\u00e1id i scr\u00edbhinn agus
  \u00f3 bh\u00e9al: dea-scileanna dr\u00e9achtaithe agus achoimrithe; an cumas dea-chumars\u00e1id
  a dh\u00e9anamh le daoine ar gach leibh\u00e9al (inmhe\u00e1nach agus seachtrach)
  agus i dtimpeallacht ilteangach.\\n[x] Scileanna idirphearsanta: an cumas a bheith
  ag obair ina n-aonair agus i dteannta a ch\u00e9ile i bhfoireann agus i dtimpeallacht
  theicni\u00fail chaighde\u00e1naithe.\\n[x] An moth\u00fa freagrachta: discr\u00e9id,
  r\u00fandacht, beachtas, \u00e9ifeacht\u00falacht, infhaighteacht agus ponc\u00falacht,
  meas ar rialacha sl\u00e1nd\u00e1la agus srianta teicni\u00fala.\\n[x] Scileanna
  eagr\u00fach\u00e1in: an cumas c\u00faraim\u00ed \u00e9ags\u00fala a bhainisti\u00fa
  agus chun tosa\u00edochta\u00ed a leagan s\u00edos; cur chuige cr\u00edochn\u00fail;
  an cumas dul ar aghaidh leat f\u00e9in agus obair a dh\u00e9anamh; sol\u00fabthacht.\\n[x]
  Inoiri\u00fanaitheacht: an cumas cabhr\u00fa le daoine eile agus chun obair go maith
  faoi bhr\u00fa; an cumas scileanna nua a fhoghlaim agus dul in oiri\u00faint d''fhorbairt\u00ed
  sa timpeallacht TF.\\n\\nD\u00e9anfar na scileanna sin a mheas\u00fan\u00fa sa triail
  scr\u00edofa agus san agallamh (f\u00e9ach pointe 2(b)(i) agus (ii) th\u00edos).\\n\\n2.
  AN N\u00d3S IMEACHTA ROGHN\u00daCH\u00c1IN:\\n\\na) AN CH\u00c9IM R\u00c9AMHROGHN\u00daCH\u00c1IN:\\n\\nCuirfear
  an ch\u00e9im r\u00e9amhroghn\u00fach\u00e1in i gcr\u00edch ina dh\u00e1 cuid:\\n\\n[x]
  beidh an ch\u00e9ad chuid bunaithe ar na crit\u00e9ir inch\u00e1ilitheachta thuasluaite
  (pointe 1(a)) agus is \u00e9 an aidhm at\u00e1 l\u00e9i a dhearbh\u00fa c\u00e9
  acu an gcomhl\u00edonann n\u00f3 nach gcomhl\u00edonann an tiarratas\u00f3ir na
  crit\u00e9ir inch\u00e1ilitheachta \u00e9igeantacha go l\u00e9ir agus na ceanglais
  fhoirmi\u00fala go\\n\\nl\u00e9ir at\u00e1 leagtha s\u00edos sa n\u00f3s imeachta
  iarratais. Di\u00falt\u00f3far d''iarratas\u00f3ir\u00ed nach gcomhl\u00edonann
  na ceanglais sin;\\n\\n[x] cuirfear taith\u00ed ghairmi\u00fail agus point\u00ed
  eile at\u00e1 luaite faoi ''Inni\u00falachta\u00ed teicni\u00fala riachtanacha''
  (pointe 1(b), (c)) san \u00e1ireamh sa dara cuid. D\u00e9anfar an chuid seo a mharc\u00e1il
  ar sc\u00e1la \u00f3 0 go 20 (pasmharc: 12).\\n\\nTabharfaidh an Coiste Roghn\u00fach\u00e1in
  cuireadh don deichni\u00far iarratas\u00f3ir\u00ed a n-\u00e9ir\u00edonn leo sa
  ch\u00e9im r\u00e9amhroghn\u00fach\u00e1in agus a ghn\u00f3tha\u00edonn na marcanna
  is airde chun triail scr\u00edofa agus chun agallamh a dh\u00e9anamh.\\n\\nb) AN
  CH\u00c9IM ROGHN\u00daCH\u00c1IN:\\n\\nLeanann an ch\u00e9im roghn\u00fach\u00e1in
  an n\u00f3s imeachta a nd\u00e9antar cur s\u00edos air th\u00edos. Cuirfear an ch\u00e9im
  seo i gcr\u00edch ina dh\u00e1 cuid:\\n\\n(i) Triail scr\u00edofa (i mB\u00e9arla
  n\u00f3 i bhFraincis) ina bhfuil na nithe seo a leanas:\\n* triail phraitici\u00fail
  bunaithe ar r\u00edomhaire-chun meas\u00fan\u00fa a dh\u00e9anamh ar an eolas at\u00e1
  ag iarratas\u00f3ir\u00ed ar shainr\u00e9ims\u00ed sonra\u00ed agus ar bhainist\u00edocht
  faisn\u00e9ise agus eolais.\\n\\nAn t-am a cheada\u00edtear: 2 uair.\\n\\nD\u00e9anfar
  an triail scr\u00edofa a mharc\u00e1il as 20 marc (pasmharc: 12).\\n\\nF\u00e9adfaidh
  na hiarratas\u00f3ir\u00ed an triail scr\u00edofa a dh\u00e9anamh i mB\u00e9arla
  n\u00f3 i bhFraincis. Tabhair do d''aire le do thoil nach m\u00f3r d''iarratas\u00f3ir\u00ed
  a bhfuil Fraincis mar phr\u00edomhtheanga acu na trialacha a dh\u00e9anamh i mB\u00e9arla
  agus nach m\u00f3r d\u00f3ibh si\u00fad a bhfuil B\u00e9arla mar phr\u00edomhtheanga
  acu Fraincis a roghn\u00fa.\\n\\n(ii) Agallamh leis an gCoiste Roghn\u00fach\u00e1in
  chun meas\u00fan\u00fa a dh\u00e9anamh ar chumas na n-iarratas\u00f3ir\u00ed na
  dualgais at\u00e1 sonraithe thuas a chomhl\u00edonadh. D\u00edreofar san agallamh
  freisin ar shaineolas na niarratas\u00f3ir\u00ed agus ar na hinni\u00falachta\u00ed
  at\u00e1 liostaithe faoi phoint\u00ed 1(b), 1(c) agus 1(d). D\u00e9anfar an t-agallamh
  ar an l\u00e1 a dh\u00e9anfar an triail scr\u00edofa n\u00f3 ar an l\u00e1 (na laethanta)
  ina dhiaidh.\\n\\nAn t-am a cheada\u00edtear: thart ar 40 n\u00f3im\u00e9ad.\\n\\nD\u00e9anfar
  an t-agallamh a mharc\u00e1il as 20 (pasmharc: 12)\\n\\nD\u00e9anfar an triail scr\u00edofa
  agus an t-agallamh i Lucsamburg.\\n\\nA luaithe is a bheidh an triail scr\u00edofa
  agus an t-agallamh marc\u00e1ilte, dr\u00e9acht\u00f3idh an Coiste Roghn\u00fach\u00e1in
  liosta ionadaithe ina gcuimseofar na hiarratas\u00f3ir\u00ed a n-\u00e9ireoidh leo
  in ord aib\u00edtre. Is iad na hiarratas\u00f3ir\u00ed rath\u00fala na hiarratas\u00f3ir\u00ed
  sin a ghn\u00f3tha\u00edonn pasmharc sa triail scr\u00edofa mar aon le pasmharc
  san agallamh (f\u00e9ach pointe 2(b) (i) agus 2(b) (ii)). Ba cheart d''iarratas\u00f3ir\u00ed
  a thabhairt d\u00e1 n-aire nach gcinnt\u00edtear tairiscint poist tr\u00ed \u00e1it
  a bheith acu ar liosta ionadaithe.\\n\\nMaidir leis na hiarratas\u00f3ir\u00ed sin
  a dtugtar cuireadh d\u00f3ibh na trialacha a dh\u00e9anamh, n\u00ed m\u00f3r d\u00f3ibh
  na doicim\u00e9id taca\u00edochta \u00e1bhartha a chomhfhreagra\u00edonn don fhaisn\u00e9is
  a cuireadh ar an bhfoirm iarratais a shol\u00e1thar ar l\u00e1 an agallaimh. \u00c1ir\u00edtear
  leis na doicim\u00e9id sin c\u00f3ipeanna de dhiopl\u00f3ma\u00ed, teastais agus
  doicim\u00e9id taca\u00edochta eile lena gcrutha\u00edtear a gc\u00e1il\u00edochta\u00ed
  agus a dtaith\u00ed ghairmi\u00fail agus ina dtaispe\u00e1ntar go soil\u00e9ir d\u00e1ta\u00ed
  tosaigh agus d\u00e1ta\u00ed deiridh, an post agus cine\u00e1l beacht a ndualgas,
  etc.\\n\\nMar sin f\u00e9in, sula bhf\u00e9adfar conradh a thabhairt i gcr\u00edch,
  beidh ar na hiarratas\u00f3ir\u00ed roghnaithe na bunch\u00f3ipeanna agus c\u00f3ipeanna
  deimhnithe de gach doicim\u00e9ad \u00e1bhartha ina gcrutha\u00edtear crit\u00e9ir
  inch\u00e1ilitheachta a chur ar f\u00e1il.\\n\\nBeidh an liosta ionadaithe bail\u00ed
  go ceann 12 mh\u00ed \u00f3 dh\u00e1ta a bhunaithe agus f\u00e9adfar an tr\u00e9imhse
  sin a sh\u00edneadh faoi rogha \u00dadar\u00e1s an Ionaid Aistri\u00fach\u00e1in
  at\u00e1 cumhachtaithe chun conartha\u00ed fosta\u00edochta a thabhairt i gcr\u00edch.\\n\\n3.
  EARCA\u00cdOCHT:\\n\\nAg brath ar an staid bhuis\u00e9adach, d''fh\u00e9adfa\u00ed
  conradh tr\u00ed bliana (a bhf\u00e9adfar \u00e9 a athnuachan) a thairiscint d''iarratas\u00f3ir\u00ed
  rath\u00fala de r\u00e9ir Choinn\u00edollacha Fosta\u00edochta Sheirbh\u00edsigh
  Eile an Aontais Eorpaigh. Faoi r\u00e9ir leibh\u00e9al r\u00fandachta na hoibre
  a dh\u00e9anfar, d''fh\u00e9adfa\u00ed ceangal a chur ar an iarratas\u00f3ir roghnaithe
  iarratas ar imr\u00e9iteach sl\u00e1nd\u00e1la a dh\u00e9anamh.\\n\\nEarc\u00f3far
  na hiarratas\u00f3ir\u00ed roghnaithe san fheidhmghr\u00fapa/gr\u00e1d AD5. Is ionann
  an buntuarastal m\u00edos\u00fail don ghr\u00e1d AD5 (c\u00e9im 1) agus EUR 4 883.11.
  Mar aon leis an mbuntuarastal, d''fh\u00e9adfadh go mbeadh baill foirne i dteideal
  li\u00fantais \u00e9ags\u00fala a fh\u00e1il, mar shampla li\u00fantas teaghlaigh,
  li\u00fantas easaor\u00e1nachta (16% den bhuntuarastal), etc.\\n\\nLena chois sin,
  le bheith inch\u00e1ilithe agus sula gceapfar \u00e9/\u00ed, n\u00ed m\u00f3r don
  iarratas\u00f3ir roghnaithe:\\n\\n[x] aon oibleag\u00e1id\u00ed a fhorchuirtear
  air/uirthi de r\u00e9ir an dl\u00ed a bhaineann le seirbh\u00eds mh\u00edleata a
  bheith comhl\u00edonta aige/aici;\\n[x] na riachtanais charachtair le haghaidh na
  ndualgas at\u00e1 i gceist a chomhl\u00edonadh (cearta ioml\u00e1na mar shaor\u00e1nach
  a bheith aige/aici) 3 ;\\n[x] dul faoi scr\u00fad\u00fa leighis at\u00e1 eagraithe
  ag an Ionaid Aistri\u00fach\u00e1in d''fhonn ceanglais Airteagal 12 (2) de Choinn\u00edollacha
  Fosta\u00edochta Sheirbh\u00edsigh Eile an Aontais Eorpaigh a chomhl\u00edonadh.\\n\\n4.
  AN N\u00d3S IMEACHTA IARRATAIS:\\n\\nBa cheart d''iarratas\u00f3ir\u00ed a bhfuil
  sp\u00e9is acu sa phost a n-iarratas ar l\u00edne a chomhl\u00e1n\u00fa faoin d\u00e1ta
  deiridh le hiarratais a chur isteach.\\n\\nMolaimid go m\u00f3r d''iarratas\u00f3ir\u00ed
  gan fanacht go dt\u00ed na laethanta deiridh chun iarratas a dh\u00e9anamh. De r\u00e9ir
  na taith\u00ed at\u00e1 againn, d''fh\u00e9adfadh r\u00f3-ualach a bheith ar an
  gc\u00f3ras sna laethanta roimh an d\u00e1ta deiridh le hiarratais a chur isteach.
  D\u00e1 bhr\u00ed sin, b''fh\u00e9idir go mbeadh s\u00e9 deacair iarratas a dh\u00e9anamh
  in am.\\n\\nCOMHDHEISEANNA\\n\\nIs fost\u00f3ir comhdheiseanna \u00e9 an tIonad
  Aistri\u00fach\u00e1in agus earca\u00edonn s\u00e9 iarratas\u00f3ir\u00ed beag beann
  ar aois, cine, creideamh polaiti\u00fail, creideamh feals\u00fanach n\u00f3 creideamh
  reiligi\u00fanach, inscne n\u00f3 gn\u00e9aschlaonadh, m\u00edchumas, st\u00e1das
  p\u00f3sta n\u00f3 staid teaghlaigh.\\n\\n3 N\u00ed m\u00f3r d''iarratas\u00f3ir\u00ed
  deimhni\u00fa oifigi\u00fail a chur ar f\u00e1il ina ndearbha\u00edtear nach bhfuil
  taifead coiri\u00fail acu.\\n\\nNEAMHSPLE\u00c1CHAS AGUS DEARBH\u00da LEASA\\n\\nBeidh
  ceanglas ar an sealbh\u00f3ir poist dearbh\u00fa tiomantais a dh\u00e9anamh chun
  feidhmi\u00fa go neamhsple\u00e1ch ar mhaithe le leas an phobail agus dearbh\u00fa
  a dh\u00e9anamh maidir le haon leasanna a d''fh\u00e9adfadh a bheith measta mar
  dhochrach d\u00e1 neamhsple\u00e1chas.\\n\\n5. FAISN\u00c9IS GHINEAR\u00c1LTA:\\n\\nATHBHREITHNI\u00da
  \u2013 ACHOMHARC \u2013 GEAR\u00c1IN\\n\\nI gc\u00e1s iarratas\u00f3ir\u00ed a mheasann
  go bhfuil forais acu le gear\u00e1n a dh\u00e9anamh faoi chinneadh ar leith - f\u00e9adfaidh
  siad, ag c\u00e9im ar bith den n\u00f3s imeachta roghn\u00fach\u00e1in, iarraidh
  ar Chathaoirleach an Choiste Roghn\u00fach\u00e1in tuilleadh sonra\u00ed a thabhairt
  faoin gcinneadh sin, n\u00f3s imeachta achomhairc a thionscnamh n\u00f3 gear\u00e1n
  a chur faoi bhr\u00e1id an Ombudsman Eorpaigh (f\u00e9ach Iarscr\u00edbhinn I).\\n\\nIARRATA\u00cd
  \u00d3 IARRTH\u00d3IR\u00cd AR ROCHTAIN A FH\u00c1IL AR FHAISN\u00c9IS A BHAINEANN
  LEO\\n\\nT\u00e1 an ceart sonrach ag iarratas\u00f3ir\u00ed at\u00e1 p\u00e1irteach
  i n\u00f3s imeachta roghn\u00fach\u00e1in chun rochtain a fh\u00e1il ar fhaisn\u00e9is
  \u00e1irithe a bhaineann leo go d\u00edreach agus go leithleach. D''fh\u00e9adfa\u00ed
  faisn\u00e9is bhreise a bhaineann lena rannph\u00e1irt\u00edocht sa n\u00f3s imeachta
  roghn\u00fach\u00e1in a shol\u00e1thar d''iarratas\u00f3ir\u00ed a dh\u00e9anann
  an iarraidh sin. N\u00ed m\u00f3r d''iarratas\u00f3ir\u00ed iarrata\u00ed den chine\u00e1l
  sin a sheoladh i scr\u00edbhinn chuig Cathaoirleach an Choiste Roghn\u00fach\u00e1in
  laistigh de mh\u00ed amh\u00e1in \u00f3n uair a chuirtear a gcuid tortha\u00ed sa
  n\u00f3s imeachta roghn\u00fach\u00e1in in i\u00fal d\u00f3ibh. Seolfar an freagra
  laistigh de mh\u00ed amh\u00e1in. Pl\u00e9ifear le hiarrata\u00ed agus aird \u00e1
  tabhairt ar an r\u00fandacht a bhaineann le himeachta\u00ed an Choiste Roghn\u00fach\u00e1in
  faoi na Rialach\u00e1in Foirne.\\n\\nSONRA\u00cd PEARSANTA A CHOSAINT\\n\\n\u00c1iritheoidh
  an tIonad Aistri\u00fach\u00e1in (mar an comhlacht at\u00e1 freagrach as an n\u00f3s
  imeachta roghn\u00fach\u00e1in a eagr\u00fa) go nd\u00e9antar sonra\u00ed pearsanta
  iarratas\u00f3ir\u00ed a phr\u00f3ise\u00e1il mar at\u00e1 \u00e9ilithe le Rialach\u00e1n
  (CE) 2018/1725 \u00f3 Pharlaimint na hEorpa agus \u00f3n gComhairle an 23 Deireadh
  F\u00f3mhair 2018 ar chosaint dhaoine n\u00e1d\u00fartha maidir le pr\u00f3ise\u00e1il
  sonra\u00ed pearsanta ag institi\u00faid\u00ed, comhlachta\u00ed, oifig\u00ed agus
  gn\u00edomhaireachta\u00ed an Aontais agus ar shaorghluaiseacht sonra\u00ed den
  chine\u00e1l sin, agus lena n-aisghairtear Rialach\u00e1n (CE) Uimh 45/2001 agus
  Cinneadh Uimh 1247/2002/CE (IO L 295, 21.11.2018, lch 39). Baineann s\u00e9 seo
  go h\u00e1irithe le r\u00fandacht agus s\u00e1bh\u00e1ilteacht sonra\u00ed den s\u00f3rt
  sin.\\n\\nT\u00e1 s\u00e9 de cheart ag iarrth\u00f3ir\u00ed dul i muin\u00edn an
  Mhaoirseora Eorpaigh ar Chosaint Sonra\u00ed (email@example.com) am ar bith.\\n\\nF\u00e9ach
  an f\u00f3gra pr\u00edobh\u00e1ideachais saini\u00fail.\\n\\nIARSCR\u00cdBHINN 1
  IARRATA\u00cd AR ATHBHREITHNI\u00da \u2013 N\u00d3SANNA IMEACHTA ACHOMHAIRC \u2013
  GEAR\u00c1IN LEIS AN OMBUDSMAN EORPACH\\n\\n\u00d3s rud \u00e9 go bhfuil feidhm
  ag na Rialach\u00e1in Foirne maidir leis na n\u00f3sanna imeachta roghn\u00fach\u00e1in,
  tabhair do d''aire go bhfuil na himeachta\u00ed go l\u00e9ir faoi r\u00fan. M\u00e1
  mheasann iarratas\u00f3ir\u00ed, ag c\u00e9im ar bith den n\u00f3s imeachta roghn\u00fach\u00e1in
  seo, go ndearna cinneadh ar leith dochar d\u00e1 leasanna, f\u00e9adfaidh siad tabhairt
  faoin ngn\u00edomh seo a leanas:\\n\\nI. IARRATA\u00cd AR A THUILLEADH FAISN\u00c9ISE
  N\u00d3 AR ATHBHREITHNI\u00da\\n\\n Seol litir ina n-iarrtar faisn\u00e9is bhreise
  n\u00f3 athbhreithni\u00fa agus ina sonra\u00edtear do ch\u00e1s, chuig:\\n\\nLe
  cur faoi bhr\u00e1id: Cathaoirleach an Choiste Roghn\u00fach\u00e1in CDT-AD5-2020/02\\n\\nAn
  tIonad Aistri\u00fach\u00e1in B\u00e2timent Drosbach Oifig 3076 12 E, rue Guillaume
  Kroll L-1882 Lucsamburg laistigh de 10 l\u00e1 f\u00e9ilire \u00f3n d\u00e1ta a
  seoladh an litir inar cuireadh an cinneadh in i\u00fal d\u00f3ibh. Seolfaidh an
  Coiste Roghn\u00fach\u00e1in freagra chomh luath agus is f\u00e9idir.\\n\\nII. N\u00d3SANNA
  IMEACHTA ACHOMHAIRC\\n\\n F\u00e9adfar gear\u00e1n a thaisceadh faoi Airteagal 90(2)
  de Rialach\u00e1in Foirne Oifigigh an Aontais Eorpaigh, ag an seoladh seo a leanas:\\n\\nFaoi
  bhr\u00e1id: An t\u00dadar\u00e1s at\u00e1 cumhachtaithe chun conartha\u00ed fosta\u00edochta
  a thabhairt i gcr\u00edch CDT-AD5-2020/02\\n\\nAn tIonad Aistri\u00fach\u00e1in
  B\u00e2timent Drosbach Oifig 3076\\n\\n12 E, rue Guillaume Kroll\\n\\nL-1882 Lucsamburg\\n\\nNa
  teorainneacha ama chun an d\u00e1 chine\u00e1l seo de n\u00f3s imeachta a thionscnamh
  (f\u00e9ach na Rialach\u00e1in Foirne arna leas\u00fa le Rialach\u00e1n (AE, Euratom)
  Uimh. 1023/2013 \u00f3 Pharlaimint na hEorpa agus \u00f3n gComhairle (IO L 287 an
  29.10.2013, lch. 15 - https://eur-lex.europa.eu/legalcontent/GA/TXT/?qid=1584607571171&uri=CELEX%3A32013R1023),
  tosa\u00edonn siad \u00f3n uair a thugtar f\u00f3gra don iarratas\u00f3ir faoin
  ngn\u00edomh a l\u00edomhna\u00edtear go ndearna s\u00e9 dochar d\u00e1 leasanna.\\n\\nTabhair
  do d''aire nach bhfuil s\u00e9 de chumhacht ag an \u00dadar\u00e1s at\u00e1 cumhachtaithe
  chun conartha\u00ed a thabhairt i gcr\u00edch aon chinneadh \u00f3 Choiste Roghn\u00fach\u00e1in
  a leas\u00fa. Is \u00e9 tuairim sheasta na C\u00fairte nach bhfuil an l\u00e1nrogha
  leathan at\u00e1 ag Coist\u00ed Roghn\u00fach\u00e1in faoi r\u00e9ir a hathbhreithnithe
  ag an gC\u00fairt ach amh\u00e1in sa ch\u00e1s go ndearnadh s\u00e1r\u00fa soil\u00e9ir
  ar na rialacha lena riala\u00edtear n\u00f3sanna imeachta na gCoist\u00ed Roghn\u00fach\u00e1in.\\n\\nIII.
  GEAR\u00c1IN LEIS AN OMBUDSMAN EORPACH\\n\\n F\u00e9adfaidh iarratas\u00f3ir\u00ed
  gear\u00e1n a dh\u00e9anamh leis an duine seo a leanas:\\n\\n1 avenue du Pr\u00e9sident-Robert-Schuman
  \u2013 BP 403\\n\\nAn tOmbudsman Eorpach\\n\\nF-67001 Strasbourg Cedex de bhun Airteagal
  228(1) den Chonradh ar Fheidhmi\u00fa an Aontais Eorpaigh agus de r\u00e9ir na gcoinn\u00edollacha
  a leagtar s\u00edos i gCinneadh 94/262/ECSC, CE, Euratom \u00f3 Pharlaimint na hEorpa
  an 9 M\u00e1rta 1994 maidir leis na rialach\u00e1in agus na coinn\u00edollacha ginear\u00e1lta
  lena riala\u00edtear comhl\u00edonadh dhualgais an Ombudsman (IO L 113 an 4 Bealtaine
  1994, lch. 15).\\n\\nTabhair do d''aire nach mb\u00edonn aon \u00e9ifeacht fionra\u00edochta
  ag gear\u00e1in a dh\u00e9antar leis an Ombudsman ar an tr\u00e9imhse a leagtar
  s\u00edos in Airteagail 90(2) agus 91 de na Rialach\u00e1in Foirne maidir le gear\u00e1n
  a dh\u00e9anamh le C\u00fairt Bhreithi\u00fanais an Aontais Eorpaigh n\u00e1 maidir
  le hachomhairc a chur faoina br\u00e1id de r\u00e9ir Airteagal 270 den Chonradh
  ar Fheidhmi\u00fa an Aontais Eorpaigh. Tabhair do d''aire freisin nach m\u00f3r
  go ndearnadh na cine\u00e1lacha cur chuige iomchu\u00ed leis na hinstiti\u00faid\u00ed
  agus na comhlachta\u00ed lena mbaineann sula nd\u00e9antar gear\u00e1n ar bith leis
  an Ombudsman de r\u00e9ir Airteagal 2(4) de Chinneadh 94/262/ECSC, CE, Euratom \u00f3
  Pharlaimint na hEorpa an 9 M\u00e1rta 1994 maidir leis na rialach\u00e1in agus na
  coinn\u00edollacha ginear\u00e1lta lena riala\u00edtear comhl\u00edonadh dhualgais
  an Ombudsman.\"", "\"Cad iad na me\u00e1in a d''\u00fas\u00e1idfe\u00e1 chun do
