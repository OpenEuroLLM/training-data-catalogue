  Conas is f\u00e9idir le Gear\u00f3id na seacht dt\u00edil a chur s\u00edos sa chaoi
  go mbeidh an iml\u00edne is m\u00f3 is f\u00e9idir ag an gcroth?\\n\\n(ii) Conas
  is f\u00e9idir le Gear\u00f3id na seacht dt\u00edil a chur s\u00edos sa chaoi go
  mbeidh an iml\u00edne is l\u00fa is f\u00e9idir ag an gcroth?\\n\\nM\u00edr 6.2
  Achar comhthreomhar\u00e1in\\n\\nIs comhthreomhar\u00e1n \u00ed fior ina bhfuil
  na sleasa urchomhaireacha ar comhfhad agus iad comhthreomhar.\\n\\nM\u00e1 ghearrtar
  an comhthreomhar\u00e1n thuas ar chl\u00e9 ar an l\u00edne phoncaithe agus m\u00e1
  chuirtear an triant\u00e1n gorm ar an taobh eile ansin, cruth\u00f3far dronuilleog.\\n\\nAchar
  na dronuilleoige = 6 cm \u00d7 3 cm = 18 cm\u00b2\\n\\n\u2234 is \u00e9 18 cm\u00b2
  achar na dronuilleoige, i.e. 6 cm X 3 cm\\n\\nIs \u00e9 bonn \u00d7 airde ingearach
  achar dronuilleoige\\n\\n\\\\[ \\\\text{Achar} = b \\\\times h \\\\]\\n\\nAchar
  na dronuilleoige seo\\n\\n\\\\[ = \\\\text{bonn} \\\\times \\\\text{airde ingearach}
  \\\\]\\n\\\\[ = 12 \\\\, \\\\text{cm} \\\\times 8 \\\\, \\\\text{cm} \\\\]\\n\\\\[
  = 96 \\\\, \\\\text{cm}^2 \\\\]\\n\\n**Cleachtadh 6.2**\\n\\n1. Faigh achar gach
  ceann de na comhthreomhar\u00e1in seo:\\n\\n   (i) ![Diagram](image1.png)\\n\\n   (ii)
