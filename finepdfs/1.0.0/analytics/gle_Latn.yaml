  ![Diagram](image5.png)\\n\\n   (iii) ![Diagram](image6.png)\\n\\n3. Scr\u00edobh
  s\u00edos luach \\\\( h \\\\) i ngach ceann de na comhthreomhar\u00e1in seo:\\n\\n   (i)
  ![Diagram](image7.png)\\n\\n   (ii) ![Diagram](image8.png)\\n\\n   (iii) ![Diagram](image9.png)\\n\\n4.
