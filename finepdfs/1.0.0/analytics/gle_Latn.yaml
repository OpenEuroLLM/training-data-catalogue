  Strait\u00e9iseacha                  | 8    |\\n| Buanna                                       |
  20   |\\n| R\u00e1iteas Alt 42                               | 21   |\\n\\nArna
  fhoils\u00ed\u00fa den ch\u00e9ad uair i m\u00ed na Nollag 2021 ag Comisi\u00fan
  na h\u00c9ireann um Chearta an Duine agus Comhionannas.\\n\\nBunaitheadh Comisi\u00fan
  na h\u00c9ireann um Chearta an Duine agus Comhionannas faoi rochtaithe ar an 1 Samhain
  2014 chun cearta an duine agus an comhionannas in \u00c9irinn a chosaint agus a
  chur chun cinn, chun cult\u00far measa ar chearta an duine, ar an gc\u00f3imhionannas
  agus ar thuisceint idirchult\u00fartha a chur chun cinn, chun tuiscint agus feasacht
  ar thabhairt chearta an duine agus ar thabhairt chearta ar chur chun cinn, agus
  chun cionn \u00e9ireachta m\u00f3r a dh\u00e9anamh chearta an duine agus idirtheachta
  a dh\u00edbirt.\\n\\nISBN 978-1-913492-08-3\\n\\n\u00c1r dtosa\u00edochta\u00ed
  strait\u00e9iseacha le haghaidh 2022 go 2024\\n\\nComhionannas geilleagr\u00e1ch\\n\\nF\u00e9achfaimid
  le comhionannas geilleagr\u00e1ch n\u00edos fearr a bhaint amach i dt\u00edthiocht,
  fostaiocht, ioncam agus le haghaidh c\u00faram\u00f3iri.\\n\\nCeartas\\n\\nCosn\u00f3imid
  rochtain ar cheartas agus forl\u00e1mhas an dl\u00ed sa ch\u00f3r\u00e1s cosanta
  idirn\u00e1isi\u00fanta, sna c\u00fairteanna agus in \u00fas\u00e1id na gcumhacht\u00e1\u00ed
  poibl\u00ed.\\n\\nMeas agus aitheantas\\n\\nCuirfidim chun cinn deireadh a chur
  le cin\u00edochas, cumasachas, aoiseachas agus gn\u00e9asachas tr\u00ed thuiscint
  an phobail agus gn\u00edomh an St\u00e1it.\\n\\nSeasmhacht i leith na todhcha\u00ed\\n\\nFreagr\u00f3imid
  do gh\u00e9arch\u00e9imeanna a bhagra\u00edonn ar chearta agus comhionannas, paind\u00e9m
  COVID-19 agus an t-athr\u00fa aer\u00e1ide ina measc.\\n\\nDualgas na hEarn\u00e1la
  Poibl\u00ed\\n\\nSpreagfaimid comhl\u00edonadh comhlachta\u00ed poibl\u00ed, tuairisceoimid
  air agus cuirfidim i bhfeidhm \u00e9.\\n\\nAn Brollach\\n\\nChuir m\u00e9 t\u00fais
  le mo r\u00f3 mar an Pr\u00edomh-Choinisin\u00e9ir i m\u00ed L\u00fanasa 2020, agus
  is m\u00f3r an on\u00f3ir dom anois as tri\u00fa r\u00e1iteas strait\u00e9ise de
  chuid Choinisin\u00ed na h\u00c9ireann um Chearta an Duine agus Comhionannas a chur
  i l\u00e1thair, r\u00e1iteas a chuirimsionn an tr\u00e9imhse 2022 go 2024.\\n\\nT\u00e1im
  f\u00e9in agus mo chomh-Choinsin\u00e9iri \u00e9 ais oibr\u00edoch chun a chinni\u00fati\u00fa,
  agus an r\u00e1iteas seo a chur i dt\u00f3il a ch\u00e9ile, go cuirimid san \u00e1ireamh
  dearcaith i bhpairt\u00e1id leasmartha agus go dtagaimid ar shraith tsoisialta\u00ed
  a chomhchlonann \u00e1r sainord\u00fa chun cearta an duine agus an comhionannas
  in \u00c9irinn a chosaint agus a chur chun cinn agus cult\u00far measa ar chearta
  an duine, ar an gcomhionannas agus ar thuiscint idirlucht\u00fairtha a chur chun
  cinn sa St\u00e1t.\\n\\nTugann an sainord\u00fa reacht\u00fail sin, at\u00e1 chomh
  leathan, d\u00fashl\u00e1n lean\u00fanach d\u00fanin mar eagra\u00edocht. T\u00e1
  go leor deacracht\u00ed sa tsocha\u00ed a imionn tionchar i measc an phobail ar
  chearta an duine agus ar chomhionannas. Teann siad sin i bhfeidhm ar ghr\u00fapai
  difr\u00edula inar bpobal ar bheala\u00ed difr\u00edula, cuid acu n\u00edos measa
  n\u00e1 a ch\u00e9ile. Agus mar sin, oibr\u00edodh le d\u00fathracht chun a chinni\u00fati\u00fa
  go nd\u00e9anaimid an cinneadh ceart i gc\u00f3nai faoi c\u00e1ir cheart d\u00fainn
  \u00e1r n-acmhainn\u00ed teoranta a \u00fas\u00e1id chun an tionchar is m\u00f3
  a imirt. Treor\u00e1onn guth na ndaoine is m\u00f3 a n-imritear tionchar orthu muid
  san iarracht sin i gc\u00f3nai.\\n\\nIs \u00e9 sin an chu\u00e1s a bhfuil s\u00e9
  chomh t\u00e1bhachtach d\u00fainn an tr\u00e9imhse pleana\u00edle strait\u00e9ise
  a \u00fas\u00e1id mar am chun macnamh a dheanamh, smaoineamh ar na deacracht\u00ed
  sin, ionchur na ghr\u00fapai difr\u00edula agus mar a bhfuilimid mar thir, mar shochai
  agus mar eagra\u00edocht.\\n\\nT\u00e1 IHREC ar an bhfoi le seacht mbliana anuas
  anois, agus \u00e9 bunaithe go math mar an Institi\u00faid N\u00e1isi\u00fanta um
  Chearta an Duine agus an Cornhl\u00edonadh N\u00e1isi\u00fanta um an GComhionannas,
  agus t\u00e1 corpas suntasach oibre aige le h\u00fas\u00e1id mar thagairt agus mar
  bhunchloch. T\u00e1imid muine\u00e1inche agus soil\u00e9ir faoinn n-obl\u00e9ag\u00e1id
  s\u00e1rsa riachtanach a shol\u00e1thar chun an St\u00e1t a thabhairt chun cuntais
  chomh maith le s\u00f3cmhainn\u00ed l\u00e1idir don St\u00e1t i bhfoirm saineolas
  chearta an duine agus comhionannais at\u00e1 in ann bonn eolais a chur faoi cheapadh
  beartas agus \u00e9 a theor\u00fai.\\n\\nI gcomhth\u00e9acs n\u00edos leithne shochai
  na h\u00c9ireann, t\u00e1 roinnt de na d\u00fashl\u00e1in is m\u00f3 le tamall anuas
  \u00f3 thadhbh chearta an duine agus comhionannais os ar gcomhair. Chuaign an phaindeim
  i bhfeidhm orainn ar fad, agus bhi s\u00ed an-chrua go h\u00e1irithe ar ghr\u00fapai
  bhfoinn ar an imeach saona f\u00e9in. Ni fhachtsach forthionchar an Bhreatimeachta
  ar chursa\u00ed ceart agus comhionannais go foill, agus t\u00e1 an gh\u00e9arch\u00e9im
  aer\u00e1ide dhomhanda agus an gh\u00e9arch\u00e9im n\u00e1isi\u00fanta titliochta
  agus easpa didine f\u00f3s fochinnar agus tubaisteach.\\n\\nSainitheartas sa r\u00e1iteas
  strait\u00e9ise seana r\u00e9ims\u00ed seo a leanas a chreidimid ba cheart t\u00fais
  \u00e1ite a thabhairt d\u00f3ibh laistigh de chomhth\u00e9acs ar gcuid obre.\\n\\n\u00bb
  Comhionannas geilleagr\u00e1ch: F\u00e9achfaimid le comhionannas geilleagr\u00e1ch
  n\u00edos fearr a bhaint amach i dt\u00edthiocht, fostaiocht, ioncam agus le haghaidh
  c\u00faram\u00f3iri\\n\\n\u00bb Ceartas: Cosn\u00f3imid rochtain ar cheartas agus
  forl\u00e1mhas an dl\u00ed sa ch\u00f3r\u00e1s cosanta idirn\u00e1isi\u00fanta,
  sna c\u00fairteanna agus in \u00fas\u00e1id na gcumhacht\u00e1\u00ed poibl\u00ed\\n\\n\u00bb
  Meas agus aitheantas: Cuirfidim chun cinn deireadh a chur le cin\u00edochas, cumasachas,
  aoiseachas agus gn\u00e9asachas tr\u00ed thuiscint an phobail agus gn\u00edomh an
  St\u00e1it\\n\\n\u00bb Seasmhacht i leith na todhcha\u00ed: Freagr\u00f3imid do
  gh\u00e9arch\u00e9imeanna a bhagra\u00edonn ar chearta agus comhionannas, paind\u00e9m
  COVID-19 agus an t-athr\u00fa aer\u00e1ide ina measc\\n\\n\u00bb Dualgas na hEarn\u00e1la
  Poibl\u00ed: Spreagfaimid comhl\u00edonadh comhlachta\u00ed poibl\u00ed, tuairisceoimid
  air agus cuirfidim i bhfeidhm \u00e9.\\n\\nGabhaim mo mhile builochas leo si\u00fad
  ar fad a chabhairgh leis an r\u00e1iteas seo a chur i dt\u00f3il a ch\u00e9ile.
  Agus leo si\u00fad ar fad a thacaionn i gc\u00f3nai le Coimisi\u00fan na h\u00c9ireann
  um Chearta an Duine agus Comhionannas agus len\u00e1r n-obair lean\u00fanach chun
  cearta an duine agus an comhionannas a chosaint agus a chur chun cinn in.\\n\\nS\u00ednead
  Gilbrey\\nAn Pr\u00edomh-Choinsin\u00e9ir\\n\\nEolas F\u00fainne\\n\\nCuimsionn
  \u00e1r bhfoireann daonna at\u00e1 paiseanta faoi chearta an duine agus comhionannas,
  agus an chaoi ar f\u00e9idir lea a bheith inna gceann feadhna ar shochair ionchuimhisteach
  agus ch\u00f3r a mh\u00faln\u00ed. Th\u00e1inig siad chuig IHREC \u00f3 fud fad
  na hearn\u00e1la poibl\u00ed, \u00f3n tsoch\u00e1il shibhialta agus \u00f3 na hearn\u00e1lacha
  d\u00edl agus corpar\u00e1ideachta. T\u00e1 roinnt diobh linn \u00f3 bunainiodh
  muid in 2014. Amhail an 1 Ean\u00e1r 2022, fostaimid 72 ball foireann ar chu\u00edg
  fhoinreann dhifr\u00edula; Cursai Dl\u00ed, Beartas agus Taighde, Rannph\u00e1irt\u00edocht
  Strait\u00e9iseach, Seirbh\u00eds Corpar\u00e1ideachas agus G\u00e1inn\u00e9\u00e1il
  ar Dhaoine a Chosc.\\n\\nSti\u00farann ar Sti\u00farth\u00f3ir, Laurence Bond, an
  fhoinreann, agus cuitear cl\u00e1r d\u00fashl\u00e1inach agus dian gn\u00edomhachiocht
  i gcirch. T\u00e1 an Sti\u00farth\u00f3ir freagrach as cur i bhfeidhm na strait\u00e9is\u00ed
  nuair a cheadaonn an Coimisi\u00fan \u00e9. Is \u00e9 an tOifigeach Cuntasla\u00edochta
  \u00e9 freisin do V\u00f3ta IHREC bilant\u00fail.\\n\\nCeapann an tUachtar\u00e1n
  Miche\u00e1l D. \u00d3 hUig\u00ednn 15 chomhalta ar gcoimisi\u00fan, agus d\u2019fh\u00f3in
  siad ar an gCoimisi\u00fan uar feadh tr\u00e9imhsi eagais\u00ed. Tugann siad raon
  saineolais riachtanach leo, taith\u00ed sp\u00f3il ina measc, agus treorailion siad
  obair IHREC tr\u00ed three strait\u00e9iseach a chinneadh agus maoiri\u00fa a dheana\u00edomh
  ar an gcl\u00e1r gn\u00edomhachiochtai a fhreagra\u00edonn d\u00f3.\\n\\nIs ian
  Priomh-Choimisi\u00fain\u00e9ir, Sin\u00e9ad Gibney, an t-aon chomhalta l\u00e1naimseartha
  den Choimisi\u00fan. Bionn s\u00ed ina cathaoirleach ar chr\u00fainnithe ioml\u00e1nacha
  an Choimisi\u00fain, tacailm agus maoirionn si an Sti\u00farth\u00f3ir, agus feidhmionn
  s\u00ed mar phr\u00edomhurlabhra\u00edl IHREC.\\n\\nBionn strucht\u00far casta ag
  leagan amach rialachais comhlachta dar leith\u00e9id, trina gcumasaitear ardleibh\u00e9al
  neamhsple\u00e1chais, rud at\u00e1 riachtanach d\u2019\u00edifeachtacht \u00e1r
  gcuid oibre. Oibr\u00edonn an Priomh-Choimisi\u00fain\u00e9ir agus an Sti\u00farth\u00f3ir
  le ch\u00e9ile chun droich\u00e9ad a shol\u00e1thar idir an fhoinreann agus an Coimisi\u00fan,
  agus chun an neamhsple\u00e1chas agus an \u00edifeachtacht sin a choth\u00fa.\\n\\n\u00c1r
  bhF\u00eds\\n\\n\u00c9ire ionchuimsitheach ina l\u00e9irithear measc ar chearta
  an duine agus ar an gcomhionannas.\\n\\n\u00c1r Misean\\n\\nCearta an duine agus
  an comhionannas a ch\u00f3saint agus a chur chun cinn in \u00c9irinn\\n\\n\u00c1r
  gCuid Luachanna\\n\\nSainmhinnionn ar luachanna an chaoi a dtugaimid faoin\u00e1r
  gcuid oibre, an chaoi a n-olbr\u00edmid mar Choinmis\u00edn agus an chaoi a bpl\u00e9imid
  le daoine a ch\u00f3naionn sa st\u00e1t seo. Creidimid go bhfuil \u00e1r gcuid luachanna
  an-t\u00e1bhachtach d\u00e1r gcult\u00far, agus riachtanach d\u00e1r bhfeidhmiocht
  mar eagra\u00edocht.\\n\\nNeamh-idirdheal\u00fa agus Comhionannas\\n\\nT\u00e1imid
  tiomanta do th\u00e1cu leis na daoine a mb\u00edonn na consaic\u00ed is m\u00f3
  ina mb\u00e9alach chun ceartas a bhaint amach mar chuid de ch\u00f3saint chearta
  an duine agus comhionannais do ch\u00e1ch.\\n\\nMeas\\n\\nTogaimid meas agus iontao\u00edth
  tr\u00e1na aithint chomh luachmhar agus ata an meid a chuireann gach duine in\u00e1r
  n-eagra\u00edocht agus gach duine lena n-olbr\u00edmid len\u00e1r gcuid oibre chomh
  maith lena dtionchnaiocht. Agus meas againn ar an iontaobh at\u00e1 asann, tugaimid
  faoin\u00e1r gcuid oibre ar na caighde\u00e1in ghairmh\u00edla is aird\u00e9.\\n\\nNeamhsple\u00e1chas\\n\\nIs
  m\u00f3r aga\u00ednn ar neamhsple\u00e1chas agus gn\u00edomhaimid, nuair nach f\u00e9idir
  le daoine eile \u00e9 a dh\u00e9anamh i gc\u00f3irn, chun cearta an duine, comhionannas
  agus tuiscint idirchult\u00fartha a chur chun cinn. Gn\u00edomhaimid bunaithe ar
  fhianaise den chaighde\u00e1n is aird\u00e9 agus ar chinntheoir\u00e9acht fhont\u00e1.\\n\\nCuntasacht\\n\\nT\u00e1imid
  go hioml\u00e1n tiomanta do luachanna na hoscailteachta, na tr\u00e9idearachta agus
  na cuntasachta don phobal agus don Oireachtas.\\n\\nRannph\u00e1irteachas\\n\\nAithn\u00edmid
  neamhsple\u00e1chas pearanta agus f\u00e9inchn\u00edntt\u00fach\u00e1in na ndaoine
  uile a bhfuil cearta acu agus lad si\u00fad ar a bhfuil dualgais. T\u00e1imid tiomanta
  do dhearchta\u00ed daoine eile a chloiste\u00e1il agus phoibl\u00edghaimid.\\n\\nFreagr\u00fail\\n\\nT\u00e1imid
  freagr\u00fail ar dheiseanna chun \u00e1r misean a chur chun cinn, agus cinnimid
  go dtaca\u00edonn ar rialachas, ar n-acmhainn agus \u00e1r mb\u00e9alai oibre leis
  an gcur chuige sin.\\n\\nComhoibrioch\\n\\nComhoibr\u00edmid ar fud na heagra\u00edochta
  agus taobh ar muigh ina gnicn go gn\u00edomh\u00edod mid go prap agus go hifeachtacht.\\n\\n\u00c1r
  gCro\u00ed-Obair\\n\\nIs Institi\u00faid N\u00e1isi\u00fanta um Chearta an Duine
  agus Comhlacht N\u00e1isi\u00fanta um an gComhionannas \u00e9 IHREC, agus sti\u00farann
  raon foins\u00ed rialachais an chaoi an-olbr\u00edmid \u2013 an Tacht f\u00e1n a
  Gcoimisi\u00fan, 2014 tr\u00ednar bunaidh\u00edod muid, Priosaball Ph\u00e1ras de
  chuid na N\u00e1isi\u00fan Aontaithe, reachtaithe agus caighde\u00e1in an Aontais
  Eorpach le haghaidh comhlachtait comhionannais, rialachas intire agus idirn\u00e1isi\u00fanta
  agus caighde\u00e1in chomhlionta. Chomh maith leis sin, seacht mbliana tar \u00e9is
  ar mbunaithe, t\u00e1imid ag leathn\u00fa ar sainordaithe agus ag glacadh le r\u00f3il
  agus freagraithe\u00e1il rua a thiteann go n\u00e1durt\u00e1ra ar chomhlacht cos\u00fail
  linne.\\n\\nD\u00e1 bharr sin, bionn raon l\u00e1rnach oibre ar bun i gc\u00f3irn
  chun a chint\u00fati\u00fa go comhionannaimid na hobl\u00e9ag\u00e1idi sin. Sonraitear
  iad sin in\u00e1r dtuarascl\u00e1cha bliant\u00fala, ach tugtar breac-chuntas orthu
  anseo chun cabhr\u00fa le comhth\u00e9acs an timitriall\u00e1 seo de thosaiochtai
  strait\u00e9is\u00edseacha a mh\u00edn\u00ed.\\n\\nBaineann \u00e1r n-obair dh\u00edthi\u00fail
  le raon oibre: eolas a thabhairt do dhaoine faoina gcearta ar leith, c\u00fanamh
  dh\u00edthi\u00fail a thabhairt do dhaoine ar leith, dul i ngleic le f\u00f3gra\u00edocht
  idirthealaitheach agus feidhm\u00edod mar amicus curiae agus mar idirgr\u00e1it
  tr\u00fap p\u00e1irt\u00ed. T\u00e1 raon feidhmmeanna forfheidhm\u00edthe agus comhionta
  againn, tr\u00e1na nd\u00e9anaimid athbheithreann\u00fa ar phleananna gn\u00edmh
  agus tr\u00e1na socrainmid iad chun aghaidh a thabhairt ar easnamh eagra\u00edochta\u00ed,
  idir phoblit agus phr\u00edobh\u00e1ideach, ina n-obl\u00e9ag\u00e1idi fiadn d\u00edl
  um comhionannanas. Is s\u00e9 de chumhnacht againn freisin c\u00e1sanna a thionscnamh
  in\u00e1r n-ainm f\u00e9in agus tabhairt faoi filiosr\u00fach\u00e1in ar cheisteanna
  tromch\u00faiseacha chearta an duine agus comhionannais.\\n\\n\u00c1iritear len\u00e1r
  gn\u00edomhlochtait bearta\u00ed tuairisc\u00edod do chomhlachtait monat\u00f3ireachta
  conartha idirn\u00e1isi\u00fanta ar mar a chlo\u00edonn \u00c9ire leis na conartha\u00ed
  \u00e9ags\u00fala sin cearta an duine a sh\u00ednigh agus a dhaingn\u00edoch an
  St\u00e1t. Agus sa bhaille, d\u00e9anaimid monat\u00f3ireacht ar reachtaitoacht
  agus cuirimid breathn\u00faithe faoi bhraid ar Oireachtais ar imploiteacht chearta
  an duine agus comhionannais reachtaitoichta at\u00e1 a forbairt agus at\u00e1 i
  bhfeidhm faoi l\u00e1thair. Cuireann ar gcl\u00e1r thraighe\u00e1il leis an eolas
  agus an tuiscint reatha a chearta an duine agus comhionnasan, agus sain\u00edthn\u00edttear
  fadhbanna at\u00e1 ag teacht chun cinn leo.\\n\\nLaistigh d\u00e1ir n-obair rannph\u00e1irtiochta
  strait\u00e9is\u00ed, eisimid deimid chun tac\u00fa leis an tschaih shibhialta agus
  le daoine a bhfuil cearta acu, m\u00e9ada\u00edod feasaacht an phobail ar fhadhbanna
  chearta an duine agus comhionannais tr\u00ed chumasard leana\u00fanach, feachtas
  agus imeachta\u00ed, agus pl\u00e9imid le raon priomhph\u00e1irtithe leasmhara chun
  tionchar a imirt ar cheapt\u00e1id beartas agus ar chinteoir\u00e9acht sa St\u00e1t.
  Tugaimid faoi ghn\u00edomhiochtai freisin chun tac\u00fa le cur i bhfeidhm ioml\u00e1n
  Dhuaglas na h\u00c9arn\u00e1la Poibl\u00ed um Chomhionannas agus Cearta an Duine,
  mar th\u00e1cha, oideachas agus treoir do na comhlachtait \u00e1bhartha go pr\u00edomh,
  ach ag dul i dtreo an fhorrfh\u00e9idhmithe.\\n\\nOibrimid i dt\u00e9antna Choimisi\u00fan
  Thuaisceart \u00c9ireann um Chearta an Duine ar an gComhchoiste, mar a leagtar amach
  i gComhaont\u00fa Bh\u00e9al Feirste/Aoine an Ch\u00e9asta. I bhfianaise imeachta
  na R\u00edocht\u00e1 Aontaithe \u00f3n Aontas Eorpach, cumsim\u00edd aims\u00ed
  freisin Meitheal Aireagal 2(1) den S\u00e1rs\u00e1 Tiomnaithe, i dt\u00e9antna Choimisi\u00fan
  Thuaisceart Eireann um Chearta an Duine agus Choinmis\u00edn Comhionannais Thuaisceart
  \u00c9ireann. Pl\u00e9ann an gr\u00fapa sin le haon cheiste uile-oile\u00e1in a
  thagann chun cinn, mar a leagtar amach in Aireagal 2 de Phr\u00f3tacal na h\u00c9ireann/Thuaisceart
  \u00c9ireann.\\n\\nCeapadh muid le d\u00e9anamh mar an Rap\u00f3rt\u00e9ir N\u00e1isi\u00fanta
  Neamhsple\u00e1ch um Gh\u00e1innse\u00e1il ar Dhaoine a Chosc agus, sa chl\u00e1ir
  sin, d\u00e9anaimid monat\u00f3ireacht agus tuairisc\u00edod ar ghn\u00edomhiochtait
  ar St\u00e1it sa r\u00e9ims\u00e9 sin. T\u00e1 r\u00f3il mhonat\u00f3ireachta ainmnithe
  againn freisin le haghaidh an Choinbhli\u00fast\u00edun ar Chearta Da\u00f3ine at\u00e1
  faoi Mh\u00edchumhas agus an Choinbhli\u00fast\u00edun i gc\u00f3inne C\u00e9asadh.
  Deanann ar biot\u00f3ireann agus na Coimhisneiri ionada\u00edocht ar IHREC ar raon
  meitheleachta agus coisti monat\u00f3ireachta in \u00c9irinn, san Eoraip agus go
  domhanda.\\n\\nCinnimid go ritear \u00e1r n-eagra\u00edocht go maith, le raon feidhmmeanna
  seirbh\u00eds\u00ed corpar\u00e1ideacha lena n-\u00e1iritear s\u00f3lah\u00e1r,
  achna\u00edmi daonna, mai\u00f3imi agus bainistiocht airgeadais, agus teicneol\u00e1iocht
  f\u00e1ns\u00e9ise. C\u00e9 nach mb\u00edonn na feidhmmeanna sin le feice\u00e1il
  ag an bpobal r\u00f3mh\u00e1nach, is iad cn\u00e1mh droma na heagra\u00edochta seo
  iad, eagra\u00edocht at\u00e1 ag f\u00e1s agus ag forbairt, agus t\u00e1 siad riachtanach
  d\u00e1r neamhsple\u00e1chas agus d\u00e1r n-\u00e9ifeachtacht.\\n\\nTOSA\u00cdOCHTA\u00cd
  STRAIT\u00c9ISEACHA:\\n\\n- **Comhionannas geilleagach**\\n  F\u00e9achfaimid le
  comhionannas geilleagach n\u00edos fearr a bhaint amach i dtith\u00edocht, fosta\u00edocht,
  ioncam agus le haghaidh c\u00faram\u00f3iri\\n\\n- **Ceartas**\\n  Cosn\u00f3imid
  rochtain ar cheartas agus forl\u00e1mhas an dli sa ch\u00f3r\u00e1s cosanta idirn\u00e1isi\u00fanta,
  sna c\u00fairteanna agus in \u00fas\u00e1id na gcumhacht\u00e1\u00ed poibl\u00ed\\n\\n-
  **Meas agus aitheantas**\\n  Cuirfimid chun cinn deireadh a chur le cin\u00edochas,
  cumasachas, aoiseachas agus gn\u00e9asachas tr\u00ed thuaiscint an phobail agus
  gniomh an St\u00e1it\\n\\n- **Seasmhacht i leith na todhcha\u00ed**\\n  Freagr\u00f3imid
  do gh\u00e9arch\u00e9imeanna a bhagra\u00edonn ar chearta agus comhionannas, paind\u00e9im
  COVID-19 agus an t-athr\u00fa aer\u00e1ide ina measc\\n\\n- **Dualgas na hEarn\u00e1la
  Poibl\u00ed**\\n  Spreagfaimid comhl\u00edonadh comhlachta\u00ed poibl\u00ed, tuairisceoimid
  air agus cuirfimid i bhfeidhm \u00e9\\n\\nIn go leor r\u00e9ims\u00ed \u00e9ags\u00fala,
  treis\u00edonn na tosa\u00edochta\u00ed a ch\u00e9ile agus cuireann siad \u00e1r
  spriocanna fadt\u00e9armacha chun cinn. D\u00e1 r\u00e9ir, t\u00e1 gn\u00edomhartha
  faoi thosa\u00edocht amh\u00e1in a measaimid a l\u00e9ireoidh luach m\u00f3r chun
  cusp\u00f3ir\u00ed tosa\u00edochta\u00ed eile a bhaint amach. Forbr\u00f3imid pleannana
  oibre ilbhliant\u00fala do gach tosa\u00edocht, agus tuairisceoimid ar \u00e1r ndul
  chun cinn in\u00e1r d\u2019Tuarasc\u00e1lacha Bliant\u00fala.\\n\\nComhionannas
  geilleagrach\\n\\nT\u00e9ann neamhionannas geilleagrach i bhfeidhm ar gach gr\u00fapa
  imeallaithe agus cuireann s\u00e9 bac ar go leor cearta bun\u00fasacha a bhaint
  amach. T\u00e1 an bhearna sin a laghd\u00fa riachtanach le haghaidh comhth\u00e1th\u00fa
  s\u00f3isialta, ionchuimsi\u00fa s\u00f3isialta agus chun an caighde\u00e1n saoil
  a fheabhs\u00fa d\u00f3ibh si\u00fad at\u00e1 th\u00edos le bochtaineacht, n\u00f3
  i mbaoil bochtaineachta. Go h\u00e1irithe, t\u00e1 an gh\u00e9arch\u00e9im fhada
  thithiociotha, easpa d\u00eddine agus ch\u00f3iriochta ag imirt tionchar anois ar
  gach duine i socha\u00ed na h\u00c9ireann.\\n\\nAr mhaithe le cur le comhionannas
  geilleagrach n\u00edos fearr agus chun dul chun cinn a dh\u00e9anamh ar thithiocioth
  a bhaint amach mar cheart daonna, is iad \u00e1r gcusp\u00f3iri:\\n\\n\u00bb Cosaint
  fheabhsaithe do na daoine is boichte agus d\u00f3ibh si\u00fad at\u00e1 leochailteach
  ionas gur f\u00e9idir leo maireachtail le dinit agus i sl\u00e1ndail ghilleaghrach,
  bid\u00eds ag obair n\u00f3 ag f\u00e1il localoicht leasa n\u00f3 pinsin\\n\\n\u00bb
  Aitheantas n\u00edos fearr do luach geilleaghrach agus s\u00f3isialta ar chuiraim
  mar chine\u00e1l oibre, c\u00faram teaghl\u00e1igh agus pobail ina measc, agus cinnti\u00fa
  nach bhfuilanginnn curam\u00f3iri teaghl\u00e1igh caillteanas airgeadais de bharr
  a n-oibre c\u00faram teaghl\u00e1igh\\n\\n\u00bb Comhionannas rochtana feabhsaithe
  ar thithiocioth agus ar ch\u00f3iriocht chu\u00ed agus leordh\u00f3thanach, go h\u00e1irithe
  le haghaidh gr\u00fapai a mb\u00edonn bac\u00e1inni arda n\u00f3 c\u00f3rasacha
  le s\u00e1r\u00fa acu\\n\\n\u00bb Comhionannas rochtana feabhsaithe ar obair chuibhi\u00fail,
  go h\u00e1irithe le haghaidh gr\u00fapai a mb\u00edonn idirdh\u00e9al\u00fa agus
  bac\u00e1inni arda n\u00f3 c\u00f3rasacha le s\u00e1r\u00fa acu sa mhargadh saothair\\n\\nBainfimid
  \u00e1r gcusp\u00f3iri amach ach iad seo a leanas a dh\u00e9anamh:\\n\\nRannph\u00e1irtiocht
  agus cumars\u00e1id a tharraingionn aird ar sh\u00e1r\u00faithe agus neamhionannas
  agus a imrionn tionchar ar fhorbairt beartais\\n\\n\u00bb Prionsabal agus cleachtas
  p\u00e1 maireacht\u00e1la agus ioncaim leasa leordh\u00f3thanacha a chur chun cinn\\n\\n\u00bb
  F\u00e9achaint le Plean N\u00e1isi\u00fanta Gn\u00edomh le haghaidh C\u00faraim
  a fhorbairt, agus tac\u00fa leis sin tr\u00ed aitheantas don ch\u00faram, idir s\u00f3isialta
  agus ghilleaghrach, a chur chun cinn mar luach l\u00e1rnach i socha\u00ed na h\u00c9ireann\\n\\n\u00bb
  Tionchar ar imirt ar bheartas agus caiteachas ar thithiocioth chu\u00ed agus leordh\u00f3thanach
  a fhreagra\u00edonn do riachtanais gr\u00fapai sonracha, agus c\u00e1sanna d\u00edli
  a thionscramh a chosna\u00edonn an ceart chun thithiociotha\\n\\nD\u00fashl\u00e1n
  beartas agus d\u00edthe a thabhairt, agus iad a athr\u00fa, nuair a gh\u00e9ara\u00edtear
  neamhionannas ioncaim agus saibhris in \u00c9irinn d\u00e1 mbarr\\n\\n\u00bb Aghaidh
  a thabhairt ar bhearta\u00ed reachtaiochta agus beartais chun P\u00e1 Maireacht\u00e1la
  a bhun\u00fa\\n\\n\u00bb Inn\u00e9acsnascadh ar gach l\u00f3caiocht leasa\\n\\n\u00bb
  F\u00e9achaint leis an gceart chun c\u00f3mharg\u00e1la a chumdhach sa d\u00edi\\n\\n\u00bb
  Foras nua st\u00e1das shocheacnama\u00edoch a thabhairt isteach i reachtaioctham
  um chomhionannas\\n\\n\u00bb Infeicheatacht sonra\u00ed a fheabhs\u00fa chun monat\u00f3ireacht
  a dh\u00e9anamh ar an dul chun cinn ar bochtaineacht a laghd\u00fa, agus difr\u00e9\u00e1ilagh
  shalbhris agus ioncaim\\n\\nReachtaiocth a neart\u00fa agus aghaidh a thabhairt
  ar bhearta\u00ed\\n\\n\u00bb Reachtaiocth um chomhionannas a neart\u00fa, lena n-\u00e1ire\u00e1itir
  tr\u00ed tr\u00e1np\u00e1irt\u00edochas i bpr\u00f3iseas athbheirtheithe na Rialtais,
  agus feasacht a mh\u00e9ad\u00fa ar chearta faoin d\u00edli um chomhionannas\\n\\n\u00bb
  A chur ar chumas daoine aonair a gcearta a chosaint n\u00edos fearr faoin d\u00edli
  um chomhionannas\\n\\nCeartas\\n\\nBa cheart go mbeadh gach duine agus gach \u00fadar\u00e1s
  sa st\u00e1t faoi cheangal ag na dl\u00edthe a dh\u00e9antar go poibl\u00ed agus
  a riartar sna c\u00fairteanna, agus i dteideal thairbhe a bhaint as na dl\u00edthe
  sin chomh maith. T\u00e1 cearta an duine, an daonlathas, rochtain ar cheartas agus
  forl\u00e1mhas an dli ag tac\u00fa agus ag teacht le ch\u00e9ile agus bionn Institi\u00faidi
  N\u00e1isi\u00fanta um Chearta an Duine ina bpriomh-chomhph\u00e1irtithe chun iad
  a choth\u00fa. De bharr na g\u00e9arch\u00e9ime imirce domhanda, go h\u00e1irithe,
  teasta\u00edonn aird intire ar chosa\u00ednt idirn\u00e1isi\u00fanta, viosai, agus
  saor\u00e1nacht.\\n\\nAr mhaith le rochtain ar cheartas agus forl\u00e1mhas an dli
  a chosaint, is iad ar gcusp\u00f3iri:\\n\\n\u00bb Easnaimh a laghd\u00fa sa rochtain
  ar cheartas tri ch\u00fannamh m\u00e9adaithe chun cearta a chosaint, le Leighis
  \u00e9ifeachtacha os conhair na gC\u00fairteanna, an Chomhisi\u00fan um Chaidreamh
  san Ailt Oibre agus an ch\u00f3rcais imirce\\n\\n\u00bb Deireadh a chur le moilleanna
  riarch\u00e1in seasta sa ch\u00f3r\u00e1s cosanta idirn\u00e1isi\u00fanta, i gcinn\u00edteoireacht
  saor\u00e1nachta agus viosa agus deireadh a chur le Sol\u00e1thar Direach\\n\\n\u00bb
  Cumhachtai poibl\u00ed i mbun gn\u00edmh laistigh de na siartha a leagtar amach
  sa dli agus de r\u00e9ir luachanna an daonlathais agus na gceart bun\u00fasach;
  agus comhl\u00edonadh phr\u00edosabail na cuntas\u00e1laochta, athbhreithni\u00fathe
  bhreithni\u00fanaigh \u00e9ifeacht\u00e1laigh, agus nach br\u00edfeidhm\u00edtear
  cumhacht feidhm\u00edochlain gan bhun\u00fas\\n\\nBainimid ar gcusp\u00f3iri amach
  ach iad seo a leanas a dh\u00e9anamh:\\n\\nMonat\u00f3ireacht agus tuairisci\u00fa\\n\\n\u00bb
  Freagairt COVID-19 an st\u00e1it a choinn\u00e9il faoi athbhreithn\u00edn\u00ed
  gn\u00edomhach\\n\\n\u00bb Tr\u00edr\u00edn n-obair le Comisi\u00fan Comhoirnannais
  Thuaisceart \u00c9ireann agus Comisi\u00fan Thuaisceart \u00c9ireann um Chearta
  an Duine, monat\u00f3ireacht a dh\u00e9anamh ar thionchar an Bheartimeachta ar chearta
  an duine agus comhoirnannas ar oile\u00e1n na h\u00c9ireann\\n\\n\u00bb Monat\u00f3ireacht
  a dh\u00e9anamh ar chur i bhfeidhm an Ph\u00e1ipeir Bh\u00e1in le Shol\u00e1thar
  Direach\\n\\n\u00bb Monat\u00f3ireacht a dh\u00e9anamh ar fheidhm\u00ed\u00fa cumhachtai
  poill\u00edneachta, agus gach cine\u00e1l coinn\u00e9ala feidhm\u00edochlain n\u00f3
  siartha ar shaor\u00edse agus dli c\u00f3irn\u00e9ara, agus aird ar oileag\u00e1id
  dilthi\u00fala an St\u00e1t, oileag\u00e1id faoin gCoinbhinsi\u00fan Eorpach um
  Chearta an Duine ina measc\\n\\nReachtaiocht a neart\u00fa agus aghaidh a thabhairt
  ar bhearnai\\n\\n\u00bb Aghaidh a thabhairt ar bhearnai reachtaiochta ar n\u00f3s
  coireacht fuatha, ciontu\u00edthe spionta agus pr\u00f3if\u00edilli\u00fa cinioch\\n\\n\u00bb
  Athruithe a mholadh ar an reachtaiocht um Chosa\u00ednt Idirn\u00e1isi\u00fanta
  a bhaineann le hathaont\u00fa teaghlaigh\\n\\n\u00bb Athruithe a mholadh ar an gcreat
  reachtaiochta at\u00e1 mar bhonn agus taca ag imscr\u00fad\u00faithe ar \u00e9ag\u00f3ir
  an st\u00e1it\\n\\nA chur ar chumas daoine aonair a gcearta a chosa\u00ednt nios
  fearr\\n\\n\u00bb Cabhr\u00fa le daoine agus a chur ar a gcumas a chearta a chosaint
  sa Chomhisi\u00fan um Chaidreamh san Ailt Oibre agus sna C\u00fairteanna\\n\\n\u00bb
  Feachaint le meas\u00fan\u00faithe leochaileachta a thabhairt isteach le haghaidh
  lucht iarrtha tearmainn\\n\\n\u00bb Rochtain ar ch\u00fannamh dilthi\u00fail a leathn\u00fa\\n\\n\u00bb
  F\u00e9achaint le Leighis agus aohchaimh \u00e9ifeachtacha a bhaint amach i gcinn\u00ed
  imirce agus saor\u00e1nachta\\n\\n\u00bb Cl\u00e1ir athlonnaithe agus c\u00fanaimh
  dhaonn\u00fail a spreagadh\\n\\nMeas agus aitheantas\\n\\nN\u00ed f\u00e9idir le
  soch\u00e1in a bheith ionchuimsitheach n\u00e1 c\u00f3ir gan aghaidh a thabhairt
  ar na socr\u00faithe, na cleachtais, na beartais agus na noirm chult\u00fartha strucht\u00fartha
  agus institi\u00faide a mbionn d\u2019\u00e9ifeacht acu daoine aonair n\u00f3 gr\u00fapai
  a fh\u00e1g\u00e1il ar l\u00e1r n\u00f3 idirdheal\u00fa a dh\u00e9anamh orthu bunaithe
  ar a bhfeiniulachta\u00ed. Caithfimid an trasnachas idir f\u00e9iniulachta\u00ed
  \u00e9ags\u00fala a admh\u00e1il freisin.\\n\\nAr mhaithe le cur cinn deireadh a
  chur le ciniochas, cumasachas, aoiseachas agus gn\u00e9asachas, is iad \u00e1r gcusp\u00f3iri:\\n\\n\u00bb
  Tuiscint phoibl\u00ed fheabhsaithe ar chomh forleathan agus a bh\u00edonn ciniochas,
  cumasachas, aoiseachas agus gn\u00e9asachas in \u00c9irinn agus ar a dtionchar\\n\\n\u00bb
  M\u00f3iminteam a chruth\u00fa le haghaidh gn\u00edomh m\u00e9ada\u00edthe i measc
  comhlachta\u00ed poibl\u00ed agus dreamanna eile chun aghaidh a thabhairt ar chiniochas,
  cumasachas, aoiseachas agus gn\u00e9asachas\\n\\n\u00bb Cur i bhfeidhm imi\u00fal\u00e1n
  an Phlean Gn\u00edmh N\u00e1isi\u00fanta in aghaidh an Chinoichais, le cuantaacht
  l\u00e1idir go h\u00e1irithe\\n\\nBainfidir \u00e1r gcusp\u00f3iri amach ach iad
  seo a leanas a dh\u00e9anamh:\\n\\nRannph\u00e1irtiocht agus cumars\u00e1id a mh\u00e9ada\u00edonn
  feasaacht an phobail ar chiniochas, cumasachas, aoiseachas agus gn\u00e9asachas,
  ar l\u00edne ina measc\\n\\n\u00bb Comhn\u00e1irtiocht le comhlachta\u00ed socha\u00ed
  s\u00edbhl\u00edalta chun c\u00e1s-staid\u00e9ir faoi chiniochas, cumasachas, aoiseachas
  agus gn\u00e9asachas in \u00e1iteanna oibre, oideachas agus suiomhanna eile a chur
  in i\u00fal\\n\\n\u00bb Tabhairt faoi scr\u00fad\u00fa mionsonraithe ar chiniochas
  in aghaidh an Lucht Si\u00fail agus na Romach, agus \u00e9 a fholsi\u00fa\\n\\nMonat\u00f3ireacht
  agus tuairisc\u00ed\u00f9\\n\\n\u00bb Pr\u00f3isis dli agus beartais a chur chun
  cinn chun ciniochas, cumasachas, aoiseachas agus gn\u00e9asachas institi\u00faide
  i measc comhlachta\u00ed poibl\u00ed agus priobh\u00e1ideacha a scr\u00fad\u00fa,
  agus aghaidh a thabhairt orthu\\n\\n\u00bb F\u00e9achaint le baili\u00fa agus scapaidh
  sonrai imdeala\u00edthe ag an St\u00e1t a theabhs\u00fa\\n\\n\u00bb Creat a mholadh
  chun ciniochas institi\u00faide i gcomhlacht poibl\u00ed a scr\u00fad\u00fa\\n\\nReachtaiocht
  a neart\u00fa agus aghaidh a thabhairt ar bhearnai\\n\\n\u00bb Glacadh an Phr\u00f3taicil
  Roghnaigh a ghabhann le Coinbhinsi\u00fan na N\u00e1isi\u00fan Aontaithe ar Chearta
  Daoine at\u00e1 faoi Mhichumais a dhaingni\u00fa, go neamhsple\u00e1ch ar sceidil
  reachtaiochta eile\\n\\n\u00bb Athch\u00f3iri\u00fa reachtaiochta a chomhlionann
  an Coinbhinsi\u00fan ar Chearta Daoine at\u00e1 faoi Mhichumais a chur chun cinn\\n\\nSeasmhacht
  i leith na todhcha\u00ed\\n\\nT\u00e1 tionchar dir\u00e9ireach ag paind\u00e9im
  COVID-19 agus an t-athr\u00fa aer\u00e1ide ar ghr\u00fapai \u00e1irithe. Is g\u00e1
  an tionchar a mheas\u00fan\u00fa agus na sonra\u00ed at\u00e1 ar f\u00e1il a fheabhs\u00fa,
  c\u00fanamh direach a shol\u00e1thar, agus iallach a chur ar an St\u00e1 bearta
  cosanta feabhaisaithe a chur i bhfeidhm. Bagraionn an gh\u00e9arch\u00e9im aer\u00e1ide
  tionchar neamhionann ar an tsocha\u00ed freisin.\\n\\nAr mhaith le freagra\u00edocht
  do gh\u00e9arch\u00e9imeanna a bhagraionn ar chearta agus le c\u00fanamh comhionannais
  agus chearta an duine a thabhairt d\u00f3ibh si\u00fad is m\u00f3 a mb\u00edonn
  tionchar orthu, agus le bearta cosanta a shainainntheach chun teacht roimh sh\u00e1r\u00faithe
  ar chomhionannas agus cearta an duine i gc\u00e1s g\u00e9arch\u00e9imeanna amach
  anseo, is iad ar gcusp\u00f3ir\u00ed:\\n\\n\u00bb Meas\u00fan\u00fa ar thionchar
  na paind\u00e9ime ar ghr\u00fapai leochailleacha, go h\u00e1irithe iad si\u00fad
  a ch\u00f3naionn i suiomhanna cruinithe, iad si\u00fad a ch\u00f3naionn i gc\u00f3iriocth
  faoi bhun caighde\u00e1in/i gc\u00f3iriocth mhichu\u00ed, agus daoin a fh\u00e1gatar
  ar l\u00e1r go digiteach\\n\\n\u00bb Aistr\u00ed\u00fa c\u00f3ir chuig todhch\u00e1il
  gheilleagach inbhuanaithe\\n\\n\u00bb C\u00fanamh a thabhairt d\u00f3ibh si\u00fad
  is m\u00f3 a ndeachaigh an phaind\u00e9im i bhfeidhm orthu chun a chur ar a gcumas
  a gcearta daonna a chosaint agus le go dtartharfa\u00ed aghaidh go c\u00f3rasach
  ar an neamhionannas a fulaingioth mar gheall ar an bpaind\u00e9im\\n\\n\u00bb Glacadh
  le bearta ullmh\u00fach\u00e1in ag an St\u00e1t chun gr\u00fapai leochailleacha
  a chosaint i rith g\u00e9arch\u00e9imeanna amach anseo\\n\\nBainimid ar gcusp\u00f3ir\u00ed
  amach ach iad seo a leanas a dh\u00e9anamh:\\n\\nRanph\u00e1irt\u00edocht agus cumars\u00e1id
  le gr\u00fapai agus daoin aonair leochailleacha n\u00f3 gan ghuth\\n\\n\u00bb S\u00e1rsrai
  a bhun\u00fa chun guth a thabhairt d\u00f3ibh si\u00fad a bhi gan ghuth in rith
  na paind\u00e9ime\\n\\n\u00bb An pl\u00e9 a dhoimhni\u00fa idir IHREC agus na gr\u00fapai
  sin is m\u00f3 a ndeachaigh an phaind\u00e9im i bhfeidhm go dona orthu, agus tuiscint
  a fh\u00e1il ar a riachtanais i gc\u00e1s g\u00e9arch\u00e9imeanna sa todhchai\\n\\nMonat\u00f3ireacht
  agus tuairisci\u00fa\\n\\n\u00bb Monat\u00f3ireacht agus tr\u00e1cht a dh\u00e9anamh
  ar lion na ndaoine a ch\u00f3naionn i suiomhanna institi\u00faide, lion na ndaoine
  a ch\u00f3naionn i gc\u00f3iriocth faoi bhun caighde\u00e1in n\u00f3 i gc\u00f3iriocth
  mhichu\u00ed, agus lion na ndaoine a fh\u00e1gatar ar l\u00e1r go digiteach\\n\\nBeartais
  agus cl\u00e1ir a fhorbairt\\n\\n\u00bb Sainmhini\u00fa a thabhairt ar an gcaoi
  ar cheart don St\u00e1t ullmh\u00fa chun gr\u00fapai leochailleacha a chosaint sna
  blianta amach romhainn, i rith paind\u00e9ime sa todhchai n\u00f3 i gcasanna den
  chine\u00e1l c\u00e9anna\\n\\nDualgas na hEarn\u00e1la Poibl\u00ed um Chomhionannas
  agus Cearta an Duine\\n\\nT\u00e1 cur i bhfeidhm Dhualgas na hEarn\u00e1la Poibl\u00ed
  f\u00f3s teoranta agus ilroinnte. Chun aghaidh a thabhairt ar thaith\u00ed go leor
  daoine ar an gcaoi ar chaith na comhlachta\u00ed poibl\u00ed leo t\u00e1 g\u00e1
  le gn\u00edomha\u00edochta\u00ed dearfacha a chur chun cinn chun freagrachta\u00ed
  a chomhl\u00edonadh, chomh maith le gn\u00edomh\u00fa i gc\u00e1s neamhchomhl\u00edonadh.\\n\\nChun
  r\u00f3l Dhualgas na hEarn\u00e1la Poibl\u00ed a fheabhs\u00fa i impar comhlachta\u00ed
  poibl\u00ed agus i bhforghniomh\u00fa a bhfeidhmeanna, is iad \u00e1r gcusp\u00f3ir\u00ed:\\n\\n\u00bb
  Dualgas na hEarn\u00e1la Poibl\u00ed n\u00edos l\u00e1idre le s\u00e1sra\u00ed forfheidhmithe
  \u00e9ifeachtacha\\n\u00bb Tuiscint agus glacadh n\u00edos treise i measc Ranna
  Rialtais agus Comhlachta\u00ed Earn\u00e1la Poibl\u00ed maidir lena bhfreagrachta\u00ed
  i dtaoibh an Dualga\u00eds\\n\u00bb Feasacht n\u00edos m\u00f3 i measc na sochail
  s\u00edbhialta, agus i measc an phobail i gc\u00f3itinne, ar fh\u00e9idhm an Dualga\u00eds
  agus an chaoi a bhf\u00e9adfaidh s\u00e9 rochtain agus taitth\u00ed ar sheirbh\u00eds\u00ed
  poibl\u00ed a fheabhs\u00fa\\n\\nBainimid \u00e1r gcusp\u00f3ir\u00ed amach ach
  iad seo a leanas a dh\u00e9anamh:\\n\\nMonat\u00f3ireacht, tuairisciu agus forfheidhmi\u00fa\\n\\n\u00bb
  Molta\u00ed a chur fad bhr\u00e1id ar Rialtais maidir le s\u00e1sra\u00ed forfheidhmithe
  agus taicaiocht don chur i bhfeidhm\\n\u00bb Monat\u00f3ireacht ch\u00f3r\u00e1sach
  agus r\u00e9amhghniomhach ar Chomh\u00edacthait Poibl\u00ed a fhorbairt agus statistici
  comhlinta a fhoils\u00ed\u00fa\\n\u00bb Tabhairt faoi athbhreithn\u00edu faoi Alt
  43(7) den Acht f\u00e1n gCoimisi\u00fan agus nuair is cuil molta\u00ed a chur fad
  bhr\u00e1id ar Rialtais maidir le leasuithe ar an Acht f\u00e1n gCoimisi\u00fan
  chun s\u00e1sra\u00ed forfheidhmithe a air\u00edonn\\n\\nBeartais agus cl\u00e1ir
  a fhorbairt\\n\\n\u00bb Beartais n\u00f3sanna imeachta a bhun\u00fa laistigh de
  IHREC chun na cumhachtai maidir le neamh-chomhl\u00edonadh a fheidhmi\u00fa\\n\u00bb
  \u2018C\u00f3id Cleachtais\u2019 le haghaidh Comhlachta\u00ed Poibl\u00ed a fhorbairt
  chun treoir a thabhairt do ghniomhartha chun cloi leis an dualgas, go h\u00e1irithe
  i sol\u00e1thar seirbh\u00eds\u00ed poibl\u00ed agus i gcead\u00e1in agus rial\u00e1il
  gn\u00edomh\u00e1lochtai sa St\u00e1t\\n\\nRannph\u00e1irt\u00edocht agus cumars\u00e1id\\n\\n\u00bb
  Iarraidh ar an Rialtas sain-aonad a bhun\u00fa do Dhualgas na hEarn\u00e1la Poibl\u00ed
  chun comhairle a chur ar ranna ar chur i bhfeidhm agus forfheidhmi\u00fa agus chun
  oideachas gairmi\u00fail faoin Dualgas a chomhord\u00fa ar fud an rialtais\\n\u00bb
  Iarraidh ar an Rialtas sain-aonad a bhun\u00fa do Dhualgas na hEarn\u00e1la Poibl\u00ed
  chun comhairle a chur ar ranna ar chur i bhfeidhm agus forfheidhmi\u00fa agus chun
  oideachas gairmi\u00fail faoin Dualgas a chomhord\u00fa ar fud an rialtais\\n\\nBuanna\\n\\nT\u00e1
  raon in\u00edoll\u00fachta\u00ed agus l\u00e1idreachtait ar leith ag Comisi\u00fan
  na h\u00c9ireann um Chearta an Duine agus Comhionannas ar a dt\u00f3gfaidim agus
  muid ag cur an Strait\u00e9is seo i bhfeidhm.\\n\\nComhoibrithe agus ranph\u00e1irt\u00e9eachas\\n\\nIs
  mantra \u00e9 \u201cdada f\u00fainne gan sinne\u201d a rheaibhraoinn duinn \u00e9isteacht
  i gc\u00f3na\u00ed agus go brioch leo si\u00fad is m\u00f3 a dt\u00e9ann na ceisteanna
  a dtugaimid aghaidh orthu i bhfeidhm orthu. I rith shaolr\u00e9 na strait\u00e9is\u00edse
  seo, d\u00e9anfaimid an m\u00e9id seo a leanas:\\n\\n\u00bb Taithi saoil a lorg
  agus a chuir\u00edms\u00fa, agus luach a l\u00e9ir\u00edu air, mar shaineois r\u00edachtanach
  a chuireann bonn eolas faoin n-obair\\n\\n\u00bb Oibr\u00ed\u00fa ar bhealach ionchuimsitheach
  agus cumhacht ionrach a chur i bhfeidhm. T\u00e1 c\u00e1idrimh fhuintacha againn
  le raon p\u00e1irt\u00edthe leasmhara, go nsi\u00fanta agus go hidirm\u00e1is\u00fanta.
  Cabhr\u00e1onn na c\u00e1idrimh sin le cur chuige comhoirneointe i leith d\u00fashl\u00e1n
  agus deiseanna a fhorbairt agus dul chun cinn a dh\u00e9anamh air\\n\\n\u00c1r ndaoine,
  \u00e1r gcultr agus \u00e1r gcumars\u00e1id\\n\\nIs f\u00e9idir le cultr eagraiochtach
  tac\u00fa leana strait\u00e9is\u00edse n\u00f3 oibr\u00ed\u00fa ina coinne. T\u00e1
  \u00e1r ndaoine ag cro\u00edl\u00e1r rath IHREC agus na hiarachta\u00ed a misean
  a bhaint amach. I rith shaolr\u00e9 na strait\u00e9is\u00edse seo, d\u00e9anfaimid
  an m\u00e9id seo a leanas:\\n\\n\u00bb Tus \u00e1ite a thabhairt go h\u00e1irithe
  d\u2019fhorbairt lean\u00fanach \u00e1r ndaoine de r\u00e9ir riachtanais \u00e1r
  n-eagraiochta\\n\\n\u00bb Am a chur ar leataobh chun tuiscint a fh\u00e1il ar riachtanais
  \u00e1r bp\u00e1irt\u00edthe leasmhara agus ar dteachtairteacht a chur in iul doibh
  ar an mbealach is \u00e9ifeachtail is f\u00e9idir\\n\\n\u00bb Tac\u00fa le baint
  amach na dtortha\u00ed inmhainnaithe trin\u00e1r dteachtairteacht a chur in iul
  do na daoine cearta ar an mbealach ceart agus ag an am ceart\\n\\n\u00bb Fiafra\u00ed
  dinn fein i gc\u00f3na\u00ed, \u201cc\u00e9n chaoi a bhf\u00e9adfa\u00edmis \u00e9
  seo a fh\u00e9abhs\u00fa?\u201d\\n\\nAcmhainn\u00ed agus rialachas cu\u00ed\\n\\nI
  rith shaolr\u00e9 na strait\u00e9is\u00edse seo, d\u00e9anfaimid an m\u00e9id seo
  a leanas:\\n\\n\u00bb Socr\u00fa fise fadte\u00e1irmail a bhun\u00fa mar ghn\u00edomhlaocth
  lean\u00fanach in IHREC\\n\\n\u00bb Oibr\u00ed\u00fa chun a chinni\u00fa go mbionn
  na hacmhainn\u00ed agus na c\u00f3rais chui i bhfeidhm chun \u00e1r roil agus \u00e1r
  bhfreaghracht a bhaint amach agus tac\u00fa le f\u00e1s eagraiochta, lena n-\u00e1ir\u00edtear
  na r\u00e9ims\u00ed sin ina dteastal\u00f3inn s\u00e1ineolas breise\\n\\n\u00bb
  Lucht saothair eolach a fhorbairt, chomh maith le smachlaigh airgeadais agus caip\u00edt\u00edl
  a chomhlionann riachtanais \u00e1r n-eagraiochta agus a gcu athr\u00fa agus a chinni\u00fan
  go bhfuil doibh acmhainn\u00ed againn chun \u00e1r bhfeidhm meann\u00e1 a chur i
  gcr\u00edch\\n\\n\u00bb Cinni\u00fa go dtacailonn strucht\u00far \u00e1r n-eagraiochta
  le cur i gcr\u00edch ar gcusp\u00f3ir\u00ed strait\u00e9is\u00edseacha agus \u00e1r
  bhfeidhm meann\u00e1 react\u00failta\\n\\nR\u00e1iteas Alt 42\\n\\nFor\u00e1lta\u00edtear
  le hAilt 42(1) den Acht a Chomisi\u00fan na h\u00c9ireann um Chearta an Duine agus
  Comhionannas, 2014:\\n\\nLe linn do chomhl\u00edocht poibl\u00ed a fhheidhm\u00e9anna
  a chomhlionadh, beidh aird aige ar an ng\u00e1 at\u00e1 leis na nithe seo a leanas:\\n\\n1.
  idirthe\u00e1il a dhibhit;\\n2. comhionannas i deiseanna a fhoirne agus na ndaoine
  a gcuireann s\u00e9 seirbh\u00eds\u00ed ar f\u00e1il doibh agus sa chaoi a gcaitear
  leo a chur chun cinn; agus\\n3. cearta daonna a chomhaltai, a fhoirne agus na ndaoine
  a gcuireann s\u00e9 seirbh\u00eds\u00ed ar f\u00e1il doibh a chosa\u00ednt, a chur
  chun cinn agus a chomhlionadh.\\n\\nFaoi Dhuilgas reacht\u00fail na h\u00c9arn\u00e1la
  Poibl\u00ed um Chomhionannas agus Cearta an Duine, ceanglaitear a gach comhl\u00edocht
  poibl\u00ed go leagfa\u00ed amach ina phlean strait\u00e9is\u00edseach meas\u00fan\u00fa
  ar na ceisteanne um chearta an duine agus um an gcomhionannas a cheirdeann s\u00e9
  at\u00e1 \u00e1bhartha d\u00e1 fh\u00e9idhm\u00e9anna agus d\u00e1 chusp\u00f3ir,
  agus na gn\u00edomhlaortha at\u00e1 ar bun n\u00f3 a bheartaitear a chur ar bun
  chun aghaidh a thabhairt ar na ceisteanne sin.\\n\\nI gc\u00e1s Chomisi\u00fan na
  h\u00c9ireann um Chearta an Duine agus Comhionannas, t\u00e1 cos\u00e1nt agus cur
  chun cinn chearta an duine agus comhionannais, agus idirthe\u00e1il a dhibhit, ag
  crolair ar bhfeidhm meann\u00e1 agus \u00e1r gcusp\u00f3ir, agus leagtar amach sa
  r\u00e1iteas strait\u00e9is\u00edse seo ina ioml\u00e1ine an-chaoi a molann an Comisi\u00fan
  sin a saind\u00far\u00fa sin a chur i gcr\u00edch, de r\u00e9ir an Dualga\u00eds.
  Is t\u00e1bhachtach go mbionn feidhm ag Dualga\u00eds na h\u00c9arn\u00e1la Poibl\u00ed
  um Chomhionannas agus Cearta an Duine ar an gcaoi a dtugann comhl\u00edocht poibl\u00ed
  facina aobair chomh maith. Le haghaidh threimhse an R\u00e1itis Strait\u00e9is\u00edse
  seo mar sin, \u00f3 2022 go 2024, saindh\u00e1in an Comisi\u00fan r\u00edonnt tosalc\u00f3itil
  breise chun a oblag\u00e1ilte\u00e1il faoi Alt 42 a chomhlionadh maidir lena chur
  chuige i leith shol\u00e1thar a sheirbh\u00eds\u00ed agus maidir lena fhoireann
  agus a r\u00f3il mar fhost\u00f3ir.\\n\\nBeidh infaighteacht \u00e1r seirbh\u00eds\u00ed
  a mh\u00e9ad\u00fa de r\u00e9ir a ch\u00e9ile ina thosala\u00edocht larnach \u00e1rs\u00ed
  don Chomisi\u00fan i rith an ch\u00e9ad timrimhalla strait\u00e9is\u00edseach elle,
  chomh maith le gn\u00edomh dearfach chun pl\u00e9 le gr\u00fapai \u00e9ags\u00fala
  mionlaigh a d\u2019fh\u00e9adfadh tarbh\u00e9 a bhaint as \u00e1r gcuid seirbh\u00eds\u00ed.
  Chun dul chun cinn a dh\u00e9anamh ar an spr\u00edc sin, tabharfaidh an Chomisi\u00fan
  t\u00faa s\u00edte do chur chun cinn agus cumars\u00e1id r\u00e9amhghn\u00edomhach
  eolas faoin gComisi\u00fan agus faoi chomhionannas agus cearta an duine leis na
  gr\u00fapa\u00ed sin is m\u00f3 at\u00e1 i mbaoil go s\u00e1orfa\u00ed a gcearta.
  \u00c1ireofar leis na sin gcumars\u00e1id faoi eolas ar chearta i dTeanga Chomhartha\u00edochta
  na h\u00c9ireann a leathan\u00fa, chomh maith le raon n\u00edos leithne teangacha
  elle, anuas ar an nGaeilge agus an B\u00e9arla. Forbr\u00f3imid freisin \u00e1r
  n-eolas faoi chearta i bhforbr\u00f3imid inle\u00e1ite do dhaoine faoi mhichumas
  intleacht\u00fail agus c\u00fairfimid tionscnaimh shaincheaptha bhireise i bhfeidhm
  go r\u00e9amhghn\u00edomhach chun a chinni\u00fa go gcuirear \u00e1r n-eolas faoi
  chearta ar f\u00e1il do ghr\u00fapa\u00ed elle a bh\u00edonn i mbaoil ar leith.
  Go ginear\u00e1lta, chun cumars\u00e1id n\u00edos fearr a chinni\u00fa le gr\u00fapai
  imeachta\u00edle, forbr\u00f3imid agus c\u00fairfimid i bhfeidhm beartas gn\u00e1th-Ghaeilge
  na h\u00c9ireann a leathan\u00fa, chomh maith le raon n\u00edos leithne teangacha
  elle, anuas ar an nGaeilge agus an B\u00e9arla. Forbr\u00f3imid freisin \u00e1r
  n-eolas faoi chearta i bhforbr\u00f3imid inle\u00e1ite do dhaoine faoi mhichumas
  intleacht\u00fail agus c\u00fairfimid tionscnaimh shaincheaptha bhireise i bhfeidhm
  go r\u00e9amhghn\u00edomhach chun a chinni\u00fa go gcuirear \u00e1r n-eolas faoi
  chearta ar f\u00e1il do ghr\u00fapa\u00ed elle a bh\u00edonn i mbaoil ar leith.
  Go ginear\u00e1lta, chun cumars\u00e1id n\u00edos fearr a chinni\u00fa le gr\u00fapai
  imeachta\u00edle, forbr\u00f3imid agus c\u00fairfimid i bhfeidhm beartas gn\u00e1th-Ghaeilge
  agus gn\u00e1th-Bh\u00e9arla don eagraiocht tr\u00ed cheille. Beartas lena d''acafar
  tr\u00ed bhreis\u00edoll\u00faint ch\u00f3rachas don fhoireann chun a n-inni\u00falacht
  agus a muin\u00edn sa r\u00e9ims\u00ed sin a fhorbairt.\\n\\nT\u00e1 pand\u00e9im
  COVID-19 tar \u00e9is aistr\u00ed\u00fa a chruth\u00fa agus cuirear \u00e1r ngn\u00edomhlaocht
  i bhfeidhm ar line n\u00edos m\u00f3 anois \u2013 i r\u00e9ims\u00ed ar n\u00f3s
  s\u00f3lath\u00e1n eolas chomh maith le cruinnthe, comhairl\u00fach\u00e1n agus
  imeacht\u00e1\u00ed \u2013 agus meastar go mbeidh r\u00f3il breise ag an s\u00f3lathar
  ar line sin i gcaitheamh na paind\u00e9ime agus ainn diaidh. C\u00e9 go bhf\u00e9adfadh
  an Aistritr sin taibh\u00eds a chruth\u00fa d\u00e1r n-obair agus do na daoine ar
  a bhfreastalaithe, d\u2019fh\u00e9adfadh s\u00e9 m\u00e9ad\u00fa ar an mbaoil go
  bhf\u00e1gair f\u00e1il go digiteach daoine agus gr\u00fapai \u2013 go h\u00e1irithe
  i measc ag\u00f3isghr\u00e1p\u00fail n\u00edos sine agus i measc daoine a fuilagainn
  eisiamh s\u00f3isialta carnaich \u2013 a mbionn f\u00e1il n\u00edos l\u00fa acu
  ar theicneola\u00edochta\u00ed agus scileanna digiteacha. Da bhri sin, forbr\u00f3imid
  go r\u00e9amhghn\u00edomhach beartais agus tionscnaimh chun aghaidh a thabhairt
  ar an d\u00fashl\u00e1n sin agus \u00e9 ag teacht chun cinn seans ar fud shol\u00e1thar\\n\\n\u00e1r
  seirbhisi agus \u00e1r gn\u00edomh\u00e1iochtai. I gc\u00e1s ceist ghaolmhara eile,
  tabharfa\u00edmid t\u00fas \u00e1ite do ghniomhartha eile chun a chinni\u00fa go
  bhfuil rochtain ag daoine faoi mh\u00edchumas ar \u00e1r gn\u00edomh\u00e1iochtai
  digiticeacha ar fad. \u00c1ir\u00edtear leis sin a chinni\u00fa go gcomhlionnann
  \u00e1r suiom greas\u00e1n go hioml\u00e1n na caighde\u00e1n inrochtaineachta agus
  go bhforbr\u00f3imi\u00fa pr\u00f3taicil inrochtaineachta shonracha le haghaidh
  \u00e1r gcr\u00fainnithe agus \u00e1r n-imeachtal ar line agus don \u00fas\u00e1id
  a bhainimid as na me\u00e1in sh\u00f3isialta.\\n\\nCuirfidh an Coimisi\u00fan t\u00fas
  le tuairisci\u00fa ar na gn\u00edomhartha a dh\u00e9anfar chun aghaidh a thabhairt
  ar na cursa\u00ed a sain\u00e1ithinni\u00f3dh sa mheas\u00fan\u00fa seo ina Thuarasc\u00e1il
  Bhliant\u00fail le haghaidh 2019. Mar sin f\u00e9in, is oibleag\u00e1id bhuain agus
  lean\u00fanach \u00e9 Dualgas na h\u00c9arn\u00e1la Poibl\u00ed um Chomhionannas
  agus Cearta an Duine, agus leanfaidh an Coimisi\u00fan ar aghaidh ag d\u00e9anamh
  monat\u00f3ireachta agus tuairisci\u00fa ar a ghniomh\u00e1iochtai chuige sin.\\n\\nMar
  an Institi\u00fad N\u00e1isi\u00fanta um Chearta an Duine agus an Comhlacht N\u00e1isi\u00fanta
  um an gComhionannas in \u00c9irinn, t\u00e1 thabhdhacht faoi leith leis go l\u00e9ir\u00edonn
  \u00e1r n-eagra\u00edocht an tsochail \u00e9ags\u00fail ar a bhfreastalaimid, chomh
  fada agus is f\u00e9idir is sin a bhaint amach in eagra\u00edocht ar an m\u00e9id
  \u00e9 seo. Leanfaidh an Coimisi\u00fan ag dini\u00fa ar infhaighteacht ar dt\u00edmpaeallachta
  oibre do dhaoine faoi mh\u00edchumas; breithni\u00fa ar chealaichte oibre chun ceisteanna
  a bhaineann le st\u00e1das teaghl\u00e1igh agus forais chomhionannais eile a chur
  san \u00e1ireamh; agus cumas an lucht bainist\u00edochta agus na foirme a th\u00f3g\u00e1il
  chun ceisteanna chearta an duine agus comhionannais a bhainisti\u00fa san \u00e1it
  oibre. Ag tog\u00e1il air sin, sa tr\u00e9imhse strait\u00e9iseach \u00f3 2022 go
  2024, doimhneoirid \u00e1r gcur chuige i leith Chomhionannas, \u00c9ags\u00falacht
  agus Cuims\u00ed\u00fa an lucht saothair tr\u00edd an tSamhail Alblocht\u00e1 maidir
  le Comhionannas. \u00c9ags\u00falacht agus Cuims\u00ed\u00fa le haghaidh Eagra\u00edochta\u00ed
  Earr\u00e1la Poibl\u00ed a chur i bhfeidhm, samhail a forbairtoidh faoi Ghn\u00edomh
  16 de \u00c1r Seirbh\u00eds Phoibl\u00ed 2020. Leagtar amach cur chuige cuimsitheach
  sa tSamhail Alblocht\u00e1, lena n-\u00e1ir\u00edtear: Ceannaireacht Ionchulainsmh\u00edtheach;
  Sonrai \u00c9ags\u00falachta; Earcalocht agus Roghnu; Oili\u00faint agus Forbairt
  Ghairmi\u00fail; agus Struchtuir agus Cult\u00far.\\n\\nAgus breithni\u00fa ar bun
  ag an gCoimisi\u00fan ar a oibleag\u00e1id chun idirfheali\u00fa a dh\u00edbirt,
  agus chun cearta daonna agus comhionannas a fh\u00f3irme ar fad a chosaint agus
  a chur chun cinn, shainnaith an Coimisi\u00fan tr\u00ed r\u00e9imse th\u00e9amhacha
  a ndreoifear orthu. Is iad sin: infhaighteacht ar dt\u00edmpaeallachta oibre do
  dhaoine faoi mh\u00edchumas; breithni\u00fa ar chealaichte oibre chun ceisteanna
  a bhaineann le st\u00e1das teaghl\u00e1igh agus forais chomhionannais eile a chur
  san \u00e1ireamh; agus cumas an lucht bainist\u00edochta agus na foirme a th\u00f3g\u00e1il
  chun ceisteanna chearta an duine agus comhionannais a bhainisti\u00fa sa l\u00e1thair
  oibre.\\n\\nCoimisi\u00fan na h\u00c9ireann um Chearta an Duine agus Comhionannas\\n\\nIrish
  Human Rights and Equality Commission\\n\\n16 \u2013 22 Sr\u00e1id na Faiche,\\nBaile
