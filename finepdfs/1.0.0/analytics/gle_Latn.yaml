  Ioncam\\n\\nC\u00falchiste Ioncaim/Cumas infheist\u00edochta %\\n\\nFearann C -
  Timpeallacht\\n\\n- cl\u00fada\u00edtear an fearann seo ag na t\u00e1scair\u00ed
  i bhFearainn A agus B\\n- Nuair at\u00e1 spriocanna do ''Sh\u00e1r PTF\u00ed'' Fhearann
  A agus B ba cheart tagarmharcanna n\u00e1isi\u00fanta agus idirn\u00e1isi\u00fanta
  a chur san \u00e1ireamh.\\n- Chomh maith leis sin nuair a bh\u00edonn anail\u00eds
  \u00e1 dh\u00e9anamh ar na figi\u00fair\u00ed iarbh\u00edr le haghaidh gach ''S\u00e1r
  PTF'' ba ch\u00f3ir an anail\u00eds a dh\u00e9anamh i gcomhth\u00e9acs na ''timpeallachta''
  - i.e. treochta\u00ed n\u00e1isi\u00fanta agus idirn\u00e1isi\u00fanta mar is infheidhme.\\n\\n3.4
  Breithnithe ''S\u00e1r PTF''\\n\\nN\u00ed f\u00e9idir monat\u00f3ireacht a dh\u00e9anamh
  ar dhul chun cinn \u00f3 thaobh spriocanna a bhaint amach mar at\u00e1 leagtha amach
  sna pleananna strait\u00e9iseacha tr\u00ed na S\u00e1r PTF\u00ed amh\u00e1in, mar
  nach bhfuil m\u00e9adrach inchainn\u00edocht gaolmhar ag gach sprioc.  N\u00ed m\u00f3r
  do thuarasc\u00e1lacha ar Sh\u00e1r PTF\u00ed a bheith comhl\u00e1naithe ag tr\u00e1chtairacht
  bhreise d''fhonn gn\u00f3thachain de chuid na hInstiti\u00faide nach f\u00e9idir
  a thomhas go h\u00e9asca a ghabh\u00e1il agus a admh\u00e1il, aischoth\u00fa dearfach
  \u00f3 fhost\u00f3ir\u00ed ch\u00e9imithe ITL mar smampla.\\n\\nNuair a bh\u00edonn
  na ''S\u00e1r PTF\u00ed'' \u00e1 gcur i gcr\u00edch, b''fh\u00e9idir gur mhian le
  Feidhmeannas ITL na nithe seo a leanas a bhreithni\u00fa:\\n\\n Cinnt\u00edtear
  go nd\u00e9antar monat\u00f3ireacht sh\u00e1s\u00fail ar dhul chun cinn na ''S\u00e1r
  PTF\u00ed'' \u00f3 thaobh na spriocanna at\u00e1 leagtha amach i Strait\u00e9is
  ITL go dt\u00ed 2020 a bhaint amach.\\n Go mb\u00edonn cothroma\u00edocht ann idir
  inchur agus aschur na ''S\u00e1r PTF\u00ed''\\n\\n3.5 Breithni\u00fa Oibri\u00fach\u00e1in
  ''S\u00e1r PTF\u00ed''\\n\\n N\u00ed m\u00f3r \u00fain\u00e9ir\u00ed a ainmni\u00fa
  do gach ''S\u00e1r PTF''.\\n N\u00ed m\u00f3r tairg\u00e9id\u00ed a leagan amach
  le haghaidh gach ceann de na ''S\u00e1r PTF\u00ed'' a roghna\u00edtear. Nuair a
  bh\u00edonn tairg\u00e9id\u00ed \u00e1 leagan s\u00edos do ''S\u00e1r PTF\u00ed''
  n\u00ed m\u00f3r tagarmharcanna n\u00e1isi\u00fanta agus idirn\u00e1isi\u00fanta
  a chur san \u00e1ireamh.\\n N\u00ed m\u00f3r minic\u00edocht r\u00edomh gach ''S\u00e1r
  PTF'' a aont\u00fa, m.sh. bliant\u00fail, d\u00e9bhliant\u00fail.\\n N\u00ed m\u00f3r
  uaini\u00fa r\u00edomh gach ''S\u00e1r PTF'' a shocr\u00fa, go h\u00e1irithe nuair
  a bh\u00edonn lion na mac l\u00e9inn san \u00e1ireamh i r\u00edomh an ''S\u00e1r
  PTF''.\\n\\n3.6 Breithnithe Tuairisceoireachta ''S\u00e1r PTF''\\n\\n Breithnigh
  tuairisceoireacht bhlian reatha v bliain roimhe agus ''S\u00e1r PTF'' tairg\u00e9id
  v iarbh\u00edr chuig an mBord Rialaithe ar bhonn bhliant\u00fail.\\n M\u00e1 \u00e9ir\u00edonn
  difr\u00edochta\u00ed m\u00f3ra idir spriocanna iarbh\u00edr agus tairg\u00e9id
  breithnigh doicim\u00e9ad\u00fa a dh\u00e9anamh ar ghn\u00edomhartha agus ainmnigh
  duine le bheith freagrach as gn\u00edomhartha.\\n Ba cheart na ''S\u00e1r PTF\u00ed''
  a aithn\u00edtear a athbhreithni\u00fa go bliant\u00fail le cinnti\u00fa go bhfuil
  siad oiri\u00fanach go f\u00f3ill do na spriocanna mar at\u00e1 siad leagtha amach
  sa phlean strait\u00e9iseach.\"", "\"Cad is dea-fhoghlaimteoir teanga ann?\\n\\nCad
  iad na bacanna ar an bhfoghlaim teanga?\"", "\"Treoir maidir le comhl\u00e1n\u00fa
  do Phas Teangacha Europass\\n\\nSula dtosa\u00edonn t\u00fa: Molta\u00ed ginear\u00e1lta\\n\\nIs
  teimpl\u00e9ad caighde\u00e1naithe \u00e9 Pas Teangacha Europass ina gcuirtear do
  scileanna teanga i l\u00e1thair; t\u00e1 s\u00e9 bunaithe ar Chomhchreat Tagartha
  na hEorpa um Theangacha. Is uirlis f\u00e9inmheast\u00f3ireachta \u00e9, inar f\u00e9idir
  leat d''eolas agus do thaith\u00ed ar theangacha a dhoicim\u00e9ad\u00fa, agus n\u00ed
  g\u00e1 \u00e9 a bhail\u00edocht\u00fa. N\u00ed m\u00f3r dul i dteagmh\u00e1il le
  hionad meas\u00fanaithe teanga m\u00e1s mian leat do leibh\u00e9al teanga a mheas\u00fan\u00fa
  agus a dheimhni\u00fa go hoifigi\u00fail.\\n\\n1. Clo\u00edgh le strucht\u00far
  an teimpl\u00e9id\\n\\n* Tugann an Pas Teangacha deis duit do chuid inni\u00falachta\u00ed
  agus c\u00e1il\u00edochta\u00ed teanga a chur i l\u00e1thair in ord loighci\u00fail:\\n-
  eolas pearsanta: sloinne/sloinnte, t\u00fasainm/neacha, m\u00e1thairtheanga(cha),
  teanga(cha) eile;\\n- i gach gach teanga lena mbaineann:\\n* f\u00e9inmheas\u00fan\u00fa
  ar scileanna teanga;\\n* teastais agus diopl\u00f3ma\u00ed;\\n* taith\u00ed theangeola\u00edoch
  agus idirchult\u00fartha.\\n* N\u00e1 hathraigh an fhocla\u00edocht sna ceannteidil.\\n\\n2.
  B\u00ed soil\u00e9ir agus gonta\\n\\n* Ba cheart go mbeadh ar chumas an l\u00e9itheora
  tuairim a fh\u00e1il faoi do phr\u00f3if\u00edl tar \u00e9is c\u00fapla n\u00f3im\u00e9ad
  l\u00e9itheoireachta. Ba cheart duit, mar sin:\\n- a bheith gonta;\\n- gan ach m\u00edreanna
  a bhaineann le d''oideachas agus le do thaith\u00ed a chuimsi\u00fa ann.\\n* Scrios
  aon l\u00edne n\u00f3 ranna nach mian leat a chomhl\u00e1n\u00fa. Chun roinn a scrios,
  \u00fas\u00e1id roghchl\u00e1r orduithe an ''T\u00e1bla'' i do bhogearra\u00ed pr\u00f3ise\u00e1la
  focal.\\n\\n3. B\u00ed r\u00e9ala\u00edoch agus t\u00fa ag d\u00e9anamh f\u00e9inmheas\u00fan\u00fa\\n\\n*
  A T\u00e1 gach dealramh ann go dtabharfar chun solais le linn agallaimh n\u00f3
  tr\u00e9imhse probhaidh aon r\u00f3mheast\u00f3ireacht ar do scileanna.\\n* Nuair
  a sheolann t\u00fa an Pas Teangacha comhl\u00e1naithe chuig duine \u00e9igin, n\u00e1
  dearmad c\u00f3ip den ghreille f\u00e9inmheas\u00fanaithe a chur leis. D''fh\u00e9adfadh
  s\u00e9 nach mbeadh cur amach cruinn ag an t\u00e9 a l\u00e9ifidh do Phas Teangacha
  ar na leibh\u00e9il Eorpacha.\\n\\n4. B\u00ed c\u00faramach faoin tsl\u00ed ina
  gcuirtear do Phas Teangacha i l\u00e1thair\\n\\n* Clo\u00edgh leis an gcl\u00f3fhoireann
  agus an leagan amach molta.\\n* N\u00e1 cuir l\u00ednte faoi agus n\u00e1 scr\u00edobh
  abairt\u00ed ioml\u00e1na i gceannlitreacha n\u00f3 i gcl\u00f3 dubh: d''fh\u00e9adfadh
  s\u00e9 an doicim\u00e9ad a dh\u00e9anamh n\u00edos dol\u00e9ite.\\n* Priont\u00e1il
  do Phas Teangacha ar ph\u00e1ip\u00e9ar b\u00e1n.\\n\\n5. Seice\u00e1il do Phas
  Teangacha ar a chr\u00edoch duit\\n\\n* Correct any spelling mistakes, and ensure
  the wording is clear and logical.\\n* Iarr ar dhuine \u00e9igin eile \u00e9 a l\u00e9amh
  le bheith cinnte go bhfuil an t-\u00e1bhar soil\u00e9ir agus sothuigthe.\\n\\nM\u00edrchinn
  roghanacha is ea iad seo ar fad. Scrios aon m\u00edrcheann folamh.\\n\\nScrios agus
  cuir isteach c\u00e9adainm(neacha), sloinne/sloinnte, sampla:\\n\\nM\u00e1ire N\u00ed
  Cheallaigh\\n\\nM\u00e1thairtheanga(cha)\\n\\nScrios agus cuir isteach m\u00e1thairtheanga(cha),
  m.sh.:\\n\\nTeanga(cha) eile\\n\\nScrios agus cuir isteach teangacha eile, m.sh.:\\n\\nB\u00e9arla\\n\\nSp\u00e1innis,
  Fraincis, Seicis\\n\\nScrios agus cuir isteach teanga:\\n\\nSp\u00e1innis\\n\\n\u00das\u00e1id
  t\u00e1bla amh\u00e1in i gc\u00e1s gach teanga at\u00e1 liostaithe thuas in ''Teanga(cha)
  eile''. Chun t\u00e1bla a chur leis, \u00fas\u00e1id an t-ord\u00fa ''c\u00f3ipe\u00e1il/greamaigh''
  i do bhogearra\u00ed pr\u00f3ise\u00e1la focal.\\n\\nF\u00e9inmheas\u00fan\u00fa
  ar scileanna teanga\\n\\nI gc\u00e1s gach ceann de na ceannteidil th\u00edos (\u00e9isteach,
  l\u00e9itheoireacht, idirghn\u00edomha\u00edocht labhartha, ginchumas \u00f3 bh\u00e9al,
  scr\u00edbhneoireacht), sonraigh do leibh\u00e9al ag baint \u00fas\u00e1ide as an
  ngreille f\u00e9inmheas\u00fanaithe a shol\u00e1thra\u00edtear th\u00edos san aguis\u00edn.\\n\\n\u00c9isteacht\\n\\nTreoir
  maidir le comhl\u00e1n\u00fa do Phas Teangacha Europass\\n\\nTeastais agus diopl\u00f3ma\u00ed\\n\\nSonraigh
  aon teastas/teastais agus/n\u00f3 diopl\u00f3ma(\u00ed) \u00e1bhartha teanga at\u00e1
  faighte agat. Tabhair an comhlacht d\u00e1mhachtana (an eagra\u00edocht a bhronn
  an diopl\u00f3ma n\u00f3 an teastas), d\u00e1ta na d\u00e1mhachtana agus an leibh\u00e9al
  Eorpach m\u00e1 t\u00e1 s\u00e9 luaite ar an teastas n\u00f3 an diopl\u00f3ma bunaidh.
  N\u00edl gach deimhni\u00fa teanga ail\u00ednithe leis an gComhchreat Eorpach, mar
  sin mura mb\u00edonn an leibh\u00e9al teanga scr\u00edofa ar an deimhni\u00fa n\u00f3
  ar an diopl\u00f3ma, t\u00e9igh i dteagmh\u00e1il leis an gcomhlacht d\u00e1mhachtana.\\n\\nTaith\u00ed
  theangeola\u00edoch agus idirchult\u00fartha\\n\\nBa cheart duit na cine\u00e1lacha
  taith\u00ed shotheangeola\u00edocha agus idirchult\u00fartha is t\u00e1bhachta\u00ed
  a bh\u00ed agat a liost\u00fa anseo. Ba cheart go gcabhr\u00f3dh an taith\u00ed
  chun an leibh\u00e9al at\u00e1 sroichte agat a mh\u00edni\u00fa. D''fh\u00e9adfadh
  s\u00e9 a bheith laistigh de do theaghlach f\u00e9in (teagmh\u00e1lacha le gaolta
  a labhra\u00edonn Sp\u00e1innis, mar shampla), gairmi\u00fail (teagmh\u00e1il le
  custaim\u00e9ir\u00ed a labhra\u00edonn Sp\u00e1innis, n\u00f3 c\u00farsa oili\u00fana
  i gcomhlacht ina labhra\u00edtear Sp\u00e1innis), n\u00f3 bainteach le scoil, srl.\\n\\nComhchreat
  Tagartha na hEorpa um Theangacha \u2013 Greille F\u00e9inmheas\u00fanaithe\"", "\"Achoimre
  ar Bhearta Bhuis\u00e9ad 2014\\n\\nAthruithe Beartais\\n\\nA.2\\n\\nAchoimre ar
  Bhearta Bhuis\u00e9ad 2014\\n\\nAthruithe Beartais\\n\\n\u00c1bhar\\n\\nBearta C\u00e1nachais
  lena dtabhairt isteach in 2014\\n\\nC\u00e1in Ioncaim Eile\\n\\nLi\u00fantais Chaipiti\u00fala
  agus Sc\u00e9imeanna\\n\\ndi\u00fascairt d\u00e1 \u00e9is sin do dhuine seachas
  leanbh leis an t\u00e9\"", "\"Cairt um Sheirbh\u00eds do Chustaim\u00e9ir\u00ed
  & N\u00f3sanna Imeachta Aiseolais agus Gear\u00e1n\\n\\nCl\u00e1r \u00c1bhar\\n\\n1.
  R\u00e9amhr\u00e1\\n\\nIs \u00ed an Chomhairle Mh\u00fainteoireachta comhlacht rial\u00e1la
  ghairm na m\u00fainteoireachta in \u00c9irinn, agus mar chuid den r\u00f3l sin,
  d\u00e9anann s\u00ed an mh\u00fainteoireacht a rial\u00e1il agus an ghairmi\u00falacht
  a chur chun cinn ar mhaithe le leas an phobail. Mar a leagadh amach i bPlean Strait\u00e9iseach
  2012-2014 - R\u00e9 Nua don Ghairmi\u00falacht:\\n\\n- Cabhra\u00edmid le m\u00fainteoir\u00ed
  dul isteach sa ghairm tr\u00edna gcl\u00e1r\u00fa.\\n- Socra\u00edmid caighde\u00e1in
  i nd\u00e1il le hoideachas m\u00fainteoir\u00ed ag gach c\u00e9im de ghairmr\u00e9im
  an mh\u00fainteora.\\n- Leagaimid s\u00edos caighde\u00e1in i nd\u00e1il le hinni\u00falacht
  ghairmi\u00fail agus iompar gairmi\u00fail.\\n- D\u00e9anaimid imscr\u00fad\u00fa
  ar ghear\u00e1in a dh\u00e9antar faoi mh\u00fainteoir\u00ed cl\u00e1raithe.\\n(An
  Chomhairle Mh\u00fainteoireachta, Plean Strait\u00e9iseach 2012-2014)\\n\\nT\u00e1imid
  tiomanta do sheirbh\u00eds ardchaighde\u00e1in a chur ar f\u00e1il i gcomhr\u00e9ir
  leis na tionscnaimh um Sheirbh\u00eds Ardchaighde\u00e1in do Chustaim\u00e9ir\u00ed
  a cheadaigh an Rialtas. T\u00e9ann a bhfuil sa doicim\u00e9ad seo leis na prionsabail
  a bhaineann le dea-sheirbh\u00eds do chustaim\u00e9ir\u00ed agus leis na n\u00f3sanna
  imeachta chun gear\u00e1in a dh\u00e9anamh a leagtar amach sa Treoir \u00f3n Ombudsman
  maidir le Riarach\u00e1n Poibl\u00ed Maith.\\n\\nCuirtear faisn\u00e9is ar f\u00e1il
  anseo faoin\u00e1r gcaighde\u00e1in seirbh\u00edse, faoin n\u00f3s imeachta a \u00fas\u00e1idtear
  chun gear\u00e1in a dh\u00e9anamh agus faoin gcaoi inar f\u00e9idir gear\u00e1n
  a chur faoi bhr\u00e1id Oifig an Ombudsman.\\n\\n2. R\u00e1iteas faoi Ch\u00f3imheas\\n\\nT\u00e1
  foireann na Comhairle tiomanta do chaidreamh gairmi\u00fail, meas\u00fail a choth\u00fa
  lena cuid cliant. D\u00e1 r\u00e9ir sin, b\u00edonn an Chomhairle ag dr\u00e9im
  leis go mbeidh t\u00fa meas\u00fail agus c\u00fairt\u00e9iseach agus t\u00fa ag
  d\u00e9ile\u00e1il le comhalta\u00ed \u00e1r bhfoirne.\\n\\n3. An Gealltanas a Thugaimid
  Duit\\n\\n3.1. Teagmh\u00e1il a dh\u00e9anamh linn ar an nguth\u00e1n\\n\\nM\u00e1
  dh\u00e9anann t\u00fa teagmh\u00e1il linn ar an nguth\u00e1n, d\u00e9anfaimid iarracht:\\n\\n-
  freagra a thabhairt ar do ghlao guth\u00e1in a luaithe agus is f\u00e9idir le linn
  na n-uaireanta oscailte guth\u00e1in at\u00e1 f\u00f3gartha\\n- ainm agus r\u00e9imse
  oibre an duine a fhreagr\u00f3idh an guth\u00e1n a insint duit\\n- freagra a thabhairt
  ar theachtaireachta\u00ed gl\u00f3rphoist a luaithe agus is f\u00e9idir\\n- cib\u00e9
  faisn\u00e9is at\u00e1 ag teast\u00e1il uait a shol\u00e1thar duit (tabhair faoi
  deara, le do thoil, chun ceanglais a bhaineann le cosaint sonra\u00ed a chomhl\u00edonadh,
  n\u00ed m\u00f3r d\u00fainn c\u00e9annacht m\u00fainteoir\u00ed cl\u00e1raithe agus
  daoine at\u00e1 ag iarraidh cl\u00e1r\u00fa a dhearbh\u00fa tr\u00ed thr\u00ed ph\u00edosa
  d''fhaisn\u00e9is phearsanta a iarraidh sular f\u00e9idir linn mionsonra\u00ed cl\u00e1r\u00fach\u00e1in
  a phl\u00e9.)\\n- glaoch ar ais ort mura bhfuilimid in ann d\u00e9ile\u00e1il le
  do cheist ar an toirt\\n- a chinnti\u00fa go bhfuil s\u00e9 \u00e9asca teagmh\u00e1il
  a dh\u00e9anamh linn tr\u00ed uimhir \u00cdosghlao a chur ar f\u00e1il, 1890 224
  224.\\n\\n3.2. Cumars\u00e1id i scr\u00edbhinn\\n\\nM\u00e1 dh\u00e9anann t\u00fa
  teagmh\u00e1il linn tr\u00ed r\u00edomhphost, tr\u00ed fhacs n\u00f3 tr\u00edd an
  bpost, d\u00e9anfaimid iarracht:\\n\\n- freagra i scr\u00edbhinn agus/n\u00f3 ar
  an nguth\u00e1n a thabhairt ort laistigh de ch\u00faig l\u00e1 oibre\\n- i gc\u00e1s
  go bhfuil \u00e9ileamh m\u00f3r ar \u00e1r gcuid seirbh\u00eds\u00ed, n\u00f3 i
  gc\u00e1s ceisteanna casta, freagra i scr\u00edbhinn agus/n\u00f3 ar an nguth\u00e1n
  a thabhairt ort laistigh de 20 l\u00e1 oibre\\n- i gc\u00e1s nach bhfuilimid in
  ann freagra a thabhairt ar do cheist ar an toirt, freagra a eisi\u00faint duit,
  de r\u00e9ir mar is cu\u00ed, chun a r\u00e1 go bhfuilimid ag d\u00e9ile\u00e1il
  le d''fhiosr\u00fach\u00e1n\\n- a chinnti\u00fa go bhfuil ainm teagmh\u00e1la, uimhir
  ghuth\u00e1in, seoladh r\u00edomhphoist agus uimhir facs san \u00e1ireamh i ngach
  p\u00edosa cumars\u00e1ide i scr\u00edbhinn a chuirtear ar f\u00e1il.\\n\\n3.3.
  Cuairt a thabhairt ar oifig na Comhairle M\u00fainteoireachta (seirbh\u00eds coinn\u00ed)\\n\\nGo
  hiond\u00fail, beidh an pobal i gcoitinne, m\u00fainteoir\u00ed, iarratas\u00f3ir\u00ed
  etc. in ann gn\u00f3 a dh\u00e9anamh linn ar an nguth\u00e1n, tr\u00ed r\u00edomhphost,
  tr\u00ed fhacs agus tr\u00edd an bpost, n\u00f3 tr\u00edd an su\u00edomh gr\u00e9as\u00e1in
  www.teachingcouncil.ie. D\u00e1 mba rud \u00e9 gur bhre\u00e1 leat cuairt a thabhairt
  ar an oifig, \u00e1fach, tabhair faoi deara go bhfuil seirbh\u00eds coinn\u00ed
  in \u00fas\u00e1id.  Mar thoradh ar an tseirbh\u00eds sin, is f\u00e9idir linn a
  chinnti\u00fa:\\n\\n- go mbeidh comhalta foirne \u00f3n rann\u00f3g chu\u00ed ar
  f\u00e1il chun bualadh leat\\n- go dtuigfidh an comhalta foirne sin do cheist agus
  go mbeidh s\u00e9 n\u00f3 s\u00ed in ann d\u00e9ile\u00e1il l\u00e9i go pras\\n-
  go mbuailfear leat in am agus nach mbeidh tr\u00e9imhs\u00ed fada feithimh i gceist.\\n\\nChun
  coinne a dh\u00e9anamh:\\n\\n- cuir glao orainn ar \u00cdosghlao 1890 224 224 n\u00f3
  ar 01 6517900, n\u00f3\\n- seol r\u00edomhphost chuig email@example.com\\n\\n3.4.
  Seirbh\u00eds tr\u00ed mhe\u00e1n na Gaeilge\\n\\nD\u00e9anann an Chomhairle socruithe
  ar leith chun seirbh\u00eds\u00ed a chur ar f\u00e1il tr\u00ed mhe\u00e1n na Gaeilge.
  T\u00e1 an obair sin faoi threoir fhor\u00e1lacha Acht na dTeangacha Oifigi\u00fala,
  2003.  T\u00e1 an Chomhairle tiomanta do chinnti\u00fa go dtabharfaidh duine le
  Gaeilge freagra ar chumars\u00e1id Gaeilge a gheofar tr\u00ed r\u00edomhphost, tr\u00edd
  an bpost n\u00f3 ar an nguth\u00e1n nuair is f\u00e9idir sin.\\n\\n3.5. Comhionannas/\u00c9ags\u00falacht\\n\\nT\u00e1imid
  tiomanta do sheirbh\u00eds a chur ar f\u00e1il a thugann cosaint do cheart an duine
  caitheamh comhionann a fh\u00e1il, mar at\u00e1 socraithe ag reachta\u00edocht ar
  chomhionannas.\\n\\nD\u00e9anfaimid iarracht a chinnti\u00fa go mbeidh \u00e1r seirbh\u00eds\u00ed
  agus \u00e1r saor\u00e1id\u00ed inrochtana ag \u00e1r gcliaint uile, lena n-\u00e1ir\u00edtear
  na daoine sin a bhfuil riachtanais speisialta acu.\\n\\n4. N\u00f3sanna Imeachta
  chun Aiseolas a Thabhairt agus chun Gear\u00e1in a Dh\u00e9anamh faoi Chaighde\u00e1in
  Seirbh\u00edse\\n\\nT\u00e1 an Chomhairle Mh\u00fainteoireachta tiomanta do sheirbh\u00eds
  ardchaighde\u00e1in a chur ar f\u00e1il ar bhonn lean\u00fanach. D''fh\u00e9adfadh
  s\u00e9 tarl\u00fa, \u00e1fach, go gcuirfear seirbh\u00eds ar f\u00e1il duit agus
  nach mbeidh s\u00ed ar an gcaighde\u00e1n ard a mb\u00edonn tusa ag tn\u00fath leis
  agus is mian linn a shol\u00e1thar. Beimid l\u00e1n-s\u00e1sta imscr\u00fad\u00fa
  a dh\u00e9anamh ar an sc\u00e9al in aon ch\u00e1s den s\u00f3rt sin d''fhonn teacht
  ar r\u00e9iteach.\\n\\n4.1. Cine\u00e1lacha Gear\u00e1n\\n\\nIs iad na n\u00f3sanna
  imeachta aiseolais agus gear\u00e1n at\u00e1 leagtha amach sa doicim\u00e9ad seo
  na n\u00f3sanna at\u00e1 le h\u00fas\u00e1id i gc\u00e1s go mbraitheann t\u00fa
  gur cuireadh seirbh\u00eds mh\u00edsh\u00e1s\u00fail ar f\u00e1il duit. F\u00e9ach
  ar ailt 4.3 agus 4.4, le do thoil, chun a fh\u00e1il amach conas is f\u00e9idir
  leat gear\u00e1n a dh\u00e9anamh i gc\u00e1s den s\u00f3rt sin.\\n\\nM\u00e1 t\u00e1
  duine at\u00e1 ag iarraidh cl\u00e1r\u00fa linn m\u00edsh\u00e1sta le cinneadh cl\u00e1r\u00fach\u00e1in
  at\u00e1 d\u00e9anta ag an gComhairle, f\u00e9adfaidh s\u00e9 n\u00f3 s\u00ed a
  iarraidh go nd\u00e9anfar athbhreithni\u00fa ar an gcinneadh n\u00f3 go nd\u00e9anfar
  an cinneadh a neamhni\u00fa. F\u00e9ach (i) th\u00edos, le do thoil. Ar an d\u00f3igh
  ch\u00e9anna, b\u00edonn pr\u00f3iseas ar leith in \u00fas\u00e1id i gc\u00e1s gear\u00e1in
  a dh\u00e9antar faoi fheidhmi\u00falacht chun m\u00faineadh m\u00fainteoir\u00ed
  cl\u00e1raithe. F\u00e9ach (ii) th\u00edos chun tuilleadh eolais a fh\u00e1il.\\n\\n(i)
  Gear\u00e1in faoi chinnt\u00ed a dh\u00e9antar i nd\u00e1il le cl\u00e1r\u00fa\\n\\nD\u00e9ile\u00e1iltear
  le gear\u00e1in faoi chinnt\u00ed maidir le cl\u00e1r\u00fa m\u00fainteoir\u00ed,
  i.e. nuair a dh\u00e9antar cinneadh gan m\u00fainteoir a chl\u00e1r\u00fa, n\u00f3
  m\u00fainteoir a chl\u00e1r\u00fa faoi r\u00e9ir coinn\u00edollacha, tr\u00ed phr\u00f3iseas
  na Comhairle M\u00fainteoireachta um Athbhreithni\u00fa a dh\u00e9anamh ar Chinnt\u00ed
  (f\u00e9ach an leathanach a bhaineann le Cl\u00e1r\u00fa ar www.teachingcouncil.ie).
  T\u00e1 for\u00e1il ar leith in alt 31(8) de na hAchtanna um Chomhairle Mh\u00fainteoireachta,
  2001-2012 a cheada\u00edonn d''iarratas\u00f3ir\u00ed iarratas a dh\u00e9anamh chun
  na hArdCh\u00fairte go nd\u00e9anfar cinneadh na Comhairle i nd\u00e1il le cl\u00e1r\u00fa
  a neamhni\u00fa.\\n\\n(ii) Gear\u00e1in faoi mh\u00fainteoir\u00ed cl\u00e1raithe\\n\\nBeidh
  s\u00e9 mar cheann de phr\u00edomhfheidhmeanna na Comhairle M\u00fainteoireachta
  imscr\u00fad\u00fa a dh\u00e9anamh ar ghear\u00e1in i nd\u00e1il le feidhmi\u00falacht
  chun m\u00faineadh m\u00fainteoir\u00ed cl\u00e1raithe. I gc\u00e1s go nd\u00e9anfar
  gear\u00e1n maidir le m\u00fainteoir cl\u00e1raithe, beidh s\u00e9 d''\u00fadar\u00e1s
  ag an gComhairle an gear\u00e1n a imscr\u00fad\u00fa, a socruithe ara\u00edonachta
  a \u00fas\u00e1id chun d\u00e9ile\u00e1il leis agus, m\u00e1s cu\u00ed, pion\u00f3is
  a ghearradh ar an m\u00fainteoir lena mbaineann.\\n\\nN\u00edor tugadh \u00e9ifeacht
  d''fheidhmeanna imscr\u00fad\u00fach\u00e1in agus ara\u00edonachta na Comhairle
  go f\u00f3ill. Cuirfear raon \u00e1bhar treorach ar f\u00e1il don phobal agus do
  mh\u00fainteoir\u00ed cl\u00e1raithe nuair a acht\u00f3far na for\u00e1lacha dl\u00edthi\u00fala
  iomchu\u00ed.\\n\\nIdir an d\u00e1 linn, n\u00ed f\u00e9idir leis an gComhairle
  d\u00e9ile\u00e1il le gear\u00e1in a bhaineann le caighde\u00e1in ghairmi\u00fala
  mh\u00fainteoir\u00ed cl\u00e1raithe.\\n\\n4.2. Aiseolas\\n\\nIs maith linn aiseolas
  i scr\u00edbhinn a fh\u00e1il chun gur f\u00e9idir linn foghlaim \u00f3n taith\u00ed
  a bh\u00ed agat ar na seirbh\u00eds\u00ed a chuirimid ar f\u00e1il agus feabhas
  a chur ar \u00e1r gc\u00f3rais de r\u00e9ir mar is cu\u00ed. D\u00e9an litir a sheoladh
  chuig:\\n\\nAn tOifigeach um Chaidreamh le Custaim\u00e9ir\u00ed\\n\\nAn Chomhairle
  Mh\u00fainteoireachta Bloc A, Campas Gn\u00f3 Mhaigh Nuad, Maigh Nuad,\\n\\nR-phost:\\n\\nfirstname.lastname@example.org\\n\\nGuth\u00e1n:
  +353 (0)1 651 7900, n\u00f3 \u00cdosghlao 1890 224 224\\n\\nFacs: +353 (0)1 651
  7901\\n\\nCo. Chill Dara.\\n\\n4.3. Gear\u00e1n a chur faoi bhr\u00e1id na Comhairle
  M\u00fainteoireachta\\n\\nT\u00e1imid tiomanta do sheirbh\u00eds ardchaighde\u00e1in
  a chur ar f\u00e1il agus feidhmeanna reacht\u00fala na Comhairle M\u00fainteoireachta
  \u00e1 gcomhl\u00edonadh againn. Cuireann an Chomhairle f\u00e1ilte roimh gach p\u00edosa
  aiseolais agus t\u00e1imid an-d\u00e1ir\u00edre faoi dh\u00e9ile\u00e1il mar is
  cu\u00ed le gear\u00e1in faoi chaighde\u00e1in seirbh\u00edse.\\n\\nMura bhfuil
  t\u00fa s\u00e1sta le caighde\u00e1n na seirbh\u00edse a cuireadh ar f\u00e1il duit,
  ba bhre\u00e1 linn \u00e9 d\u00e1 nd\u00e9anf\u00e1 teagmh\u00e1il linn chun \u00e9
  sin a insint d\u00fainn ionas go mbeimid in ann imscr\u00fad\u00fa ioml\u00e1n a
  dh\u00e9anamh ar an gceist agus fadhb ar bith lena mbaineann a r\u00e9iteach. Bainfimid
  leas as do thuairim\u00ed agus as aiseolas uait chun feabhas a chur ar an tseirbh\u00eds.\\n\\nC\u00e9im
  1\\n\\nAgus t\u00fa ag iarraidh gear\u00e1n a dh\u00e9anamh faoi chaighde\u00e1n
  na seirbh\u00edse a cuireadh ar f\u00e1il duit, moltar duit teagmh\u00e1il a dh\u00e9anamh
  ar dt\u00fas leis an rann\u00f3g den Chomhairle M\u00fainteoireachta a bh\u00ed
  ag d\u00e9ile\u00e1il le d''iarratas n\u00f3 le do cheist. Go hiond\u00fail is f\u00e9idir
  an gear\u00e1n a r\u00e9iteach ag an gc\u00e9im sin. F\u00e9ach ar an leathanach
  Sonra\u00ed Teagmh\u00e1la ar www.teachingcouncil.ie n\u00f3 ar an gcuid dheireanach
  den doicim\u00e9ad seo.\\n\\nC\u00e9im 2\\n\\nI gc\u00e1s nach bhfuil t\u00fa s\u00e1sta
