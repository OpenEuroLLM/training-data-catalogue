  Riosca ''d\u00edobh\u00e1la'' gan a bheith aitheanta ag pearsanra an ionaid.\\n*
  Riosca ''d\u00edobh\u00e1la'' gan a bheith \u00e1 thuairisci\u00fa i gceart agus
  go pras ag pearsanra an ionaid. Riosca go nd\u00e9anfadh ball d''fhoireann an ionaid
  ''d\u00edobh\u00e1il'' don leanbh san ionad. Riosca go nd\u00e9anfaidh oibr\u00ed
  deonach n\u00f3 cuairteoir chuig an ionad ''d\u00edobh\u00e1il'' don leanbh san
  ionad.\\n* Riosca go nd\u00e9anfa\u00ed ''d\u00edobh\u00e1il'' don leanbh ag ball
  de phearsanra an ionaid, ag ball foirne eagra\u00edochta eile n\u00f3 ag duine eile
  fad a bh\u00edonn an leanbh ag glacadh p\u00e1irte i ngn\u00edomha\u00edochta\u00ed
  lasmuigh den ionad e.g., turas ionaid, ceachtanna sn\u00e1mha etc.\\n* Riosca ''d\u00edobh\u00e1la''
  de bharr bula\u00edocht ar leana\u00ed.\\n* Riosca ''d\u00edobh\u00e1la'' de bharr
  maoirseacht neamhleor ar leana\u00ed san ionad \u2013 sa rang agus ag amanna scaipthe/amanna
  sosa.\\n* Riosca ''d\u00edobh\u00e1la'' de bharr maoirseachta neamhleor ar leana\u00ed
  agus iad ag freastal ar ghn\u00edomha\u00edochta\u00ed lasmuigh den ionad/turais
  ionaid.\\n* Riosca ''d\u00edobh\u00e1la'' de bharr caidreamh/cumars\u00e1id mh\u00edchu\u00ed
  idir leanbh agus leanbh n\u00f3\\n* duine f\u00e1sta eile.\\n* Riosca ''d\u00edobh\u00e1la''
  de bharr leana\u00ed ag baint \u00fas\u00e1ide m\u00edchu\u00ed as r\u00edomhair\u00ed,
