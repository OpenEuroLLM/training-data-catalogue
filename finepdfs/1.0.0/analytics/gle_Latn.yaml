sample: '["\"C\u00f3d Cleachtais\\n\\nar Inrochtaineacht Seirbh\u00eds\u00ed Poibl\u00ed
  agus Faisn\u00e9ise a chuireann Comhlachta\u00ed Poibl\u00ed ar F\u00e1il\\n\\nC\u00f3d
  Cleachtais ar Inrochtaineacht Seirbh\u00eds\u00ed Poibl\u00ed agus Faisn\u00e9ise
  a chuireann Comhlachta\u00ed Poibl\u00ed ar F\u00e1il\\n\\n1\\n\\n2\\n\\nISBN 1
  870499 17 4\\n\\nDearbha\u00edodh tr\u00ed ord\u00fa an C\u00f3d Cleachtais seo
  mar ch\u00f3d cleachtais formheasta chun cr\u00edche an Achta um M\u00edchumas,
  2005. Tagra\u00edonn I.R. Uimh 163 de 2006 d''Ord\u00fa Achta um M\u00edchumas 2005
  (C\u00f3d Cleachtais)(Dearbh\u00fa) 2006 agus is \u00e9 sin is teideal d\u00f3.\\n\\nBrollach\\n\\nBuna\u00edodh
  an t\u00dadar\u00e1s N\u00e1isi\u00fanta M\u00edchumais i Meitheamh na bliana 2000
  mar chomhlacht reacht\u00fail neamhsple\u00e1ch faoin Acht um \u00dadar\u00e1s N\u00e1isi\u00fanta
  M\u00edchumais1999. Ceann d''fheidhmeanna an \u00dadar\u00e1is, mar at\u00e1 leagtha
  amach san Acht um \u00dadar\u00e1s N\u00e1isi\u00fanta M\u00edchumais,1999, is ea
  ''cuidi\u00fa a thabhairt i dtaca le dea-chaighde\u00e1n agus dea-ch\u00e1il\u00edocht
  a bhaint amach maidir le cl\u00e1ir agus seirbh\u00eds\u00ed a shol\u00e1thra\u00edtear
  n\u00f3 at\u00e1 le sol\u00e1thar do dhaoine faoi mh\u00edchumas'' (f\u00e9ach Cuid
  II, alt 8(2) (c), (d) agus (f) agus 10 (1)).\\n\\nIs \u00e9 an t\u00dadar\u00e1s
  N\u00e1isi\u00fanta M\u00edchumais a d''ullmhaigh an c\u00f3d cleachtais seo maidir
  le hinrochtaineacht seirbh\u00eds\u00ed agus faisn\u00e9ise a chuireann comhlachta\u00ed
  poibl\u00ed ar f\u00e1il, ar iarratas an Aire Dl\u00ed agus Cirt, Comhionannais
  agus Athch\u00f3irithe Dl\u00ed, faoi r\u00e9ir fhor\u00e1lacha an Achta um M\u00edchumas
  2005 (an tAcht)(Cuid 3, Alt 30).\\n\\nI m\u00ed L\u00fanasa 2005, d''iarr an tAire
  ar an NDA dr\u00e9achtch\u00f3d cleachtais maidir leis na h\u00e1bhair a dtagra\u00edtear
  d\u00f3ibh i ranna 26, 27 agus 28 den Acht a ullmh\u00fa agus a chur faoina bhr\u00e1id.
  Chuir an NDA dr\u00e9acht tosaigh faoi bhr\u00e1id gach Roinn Rialtais i Me\u00e1n
  F\u00f3mhair 2005. Fuarthas l\u00edon m\u00f3r aighneachta\u00ed \u00f3n gcomhairle
  thosaigh seo agus, mar thoradh ar na haighneachta\u00ed seo, d''ullmhaigh an NDA
  an dara dr\u00e9acht.\\n\\nAg teacht le halt 30(2) den Acht, a chumhachta\u00edonn
  an NDA chun dul i gcomhairle lena leith\u00e9id de dhuine n\u00f3 de chomhlacht
  is a mheasann s\u00e9 a bheith cu\u00ed, chuir an NDA t\u00fas le Pr\u00f3iseas
  N\u00e1isi\u00fanta Comhairli\u00fach\u00e1in i nDeireadh F\u00f3mhair/Samhain 2005
  i nd\u00e1il leis an dara dr\u00e9acht seo. Fuair an NDA n\u00edos m\u00f3 n\u00e1
  70 aighneacht agus rinneadh tuilleadh leasuithe don ch\u00e1ip\u00e9is.\\n\\nAg
  lean\u00faint ar an bPr\u00f3iseas N\u00e1isi\u00fanta Comhairli\u00fach\u00e1in
  seo, fuair gach Roinn Rialtais deis dheireannach tr\u00e1chtaireacht a dh\u00e9anamh
  ar an tr\u00ed\u00fa dr\u00e9acht, sular cuireadh an t-athbhreithni\u00fa deireannach
  den Ch\u00f3d faoi bhr\u00e1id \u00dadar\u00e1s an NDA i gc\u00f3ir a mheas\u00fanaithe.\\n\\nT\u00e1
  an tAcht comhl\u00e1ntach leis na hAchtanna um St\u00e1das Comhionann, 2000 go 2004,
  a bhaineann freisin le sol\u00e1thar earra\u00ed agus seirbh\u00eds\u00ed.\\n\\nBa
  cheart do chomhlachta\u00ed poibl\u00ed, mar shol\u00e1thr\u00f3ir\u00ed seirbh\u00eds\u00ed,
  ceanglais na nAchtanna seo i nd\u00e1il le sol\u00e1thar faisn\u00e9ise agus seirbh\u00eds\u00ed
  do dhaoine le m\u00edchumais a thabhairt faoi deara. N\u00ed c\u00f3d cleachtais
  an doicim\u00e9ad seo i nd\u00e1il leis na hAchtanna um St\u00e1das Comhionann,
  ach moltar do chomhlachta\u00ed poibl\u00ed cur chuige comhth\u00e1ite a fhorbairt
  d\u00e1 n-oibleag\u00e1id\u00ed de r\u00e9ir an Achta um M\u00edchumais 2005 agus
  na nAchtanna um St\u00e1das Comhionann i nd\u00e1il le daoine le m\u00edchumais.\\n\\n3\\n\\n4\\n\\nLeagann
  Cuid a 3 den Acht um M\u00edchumas 2005 (an tAcht) freagrachta\u00ed suntasacha
  ar chomhlachta\u00ed poibl\u00ed a chinnti\u00fa go bhfuil rochtain ag daoine le
  m\u00edchumais ar a seirbh\u00eds\u00ed, eadhon:\\n\\n* Ceangla\u00edtear ar chomhlachta\u00ed
  poibl\u00ed faoi alt 26 a chinnti\u00fa go bhfuil rochtain ag daoine le m\u00edchumais
  ar a seirbh\u00eds\u00ed tr\u00ed rochtain chomhth\u00e1ite ar sheirbh\u00eds\u00ed
  pr\u00edomhsrutha a chur ar f\u00e1il sa ch\u00e1s go bhfuil sin ind\u00e9anta agus
  cu\u00ed.\\n* Ceangla\u00edtear ar chomhlachta\u00ed poibl\u00ed faoi alt 27 a chinnti\u00fa
  go mbeidh rochtain ar na hearra\u00ed n\u00f3 ar na seirbh\u00eds\u00ed a cheanna\u00edonn
  siad, ach amh\u00e1in d\u00e1 mba rud \u00e9 nach mbeadh s\u00e9 ind\u00e9anta n\u00f3
  inchosanta ar bhonn costais n\u00f3 d\u00e1 mbeadh moill mh\u00edr\u00e9as\u00fanach
  d\u00e1 bharr.\\n* Is g\u00e1 faoi alt 28, tar \u00e9is a hiarrata, cumars\u00e1id
  \u00f3 chomhlacht poibl\u00ed a chur ar f\u00e1il chuig duine a bhfuil lag\u00fa
  \u00e9isteachta n\u00f3 amhairc aige n\u00f3 aici, a mh\u00e9id is ind\u00e9anta,
  i bhform\u00e1id at\u00e1 inrochtana. Is g\u00e1 go mbeadh faisn\u00e9is a chuirtear
  ar f\u00e1il go leictreonach comhoiri\u00fanach le teicneola\u00edocht oiri\u00fanaitheach,
  a mh\u00e9id is ind\u00e9anta. Is g\u00e1 faisn\u00e9is fhoilsithe, at\u00e1 \u00e1bhartha
  do dhaoine faoi mh\u00edchumas intleacht\u00fail, a chur ar f\u00e1il i bhform\u00e1id\u00ed
  at\u00e1 so-l\u00e9ite, sa mh\u00e9id is at\u00e1 s\u00e9 sin ind\u00e9anta.\\n\\nLeagann
  an c\u00f3d cleachtais seo amach tuiscint an \u00dadar\u00e1is ar na ceanglais at\u00e1
  ann faoi na hailt sin den Acht  agus t\u00e1 s\u00e9 mar aidhm aige treoir a thabhairt
  do chomhlachta\u00ed poibl\u00ed chun na hoibleag\u00e1id\u00ed reacht\u00fala at\u00e1
  orthu a chomhl\u00edonadh tr\u00ed chomhairle phraitici\u00fail agus tr\u00ed shampla\u00ed
  a shol\u00e1thar. Creidim gur f\u00e9idir \u00e9 seo a bhaint amach tr\u00ed phlean\u00e1il
  at\u00e1 ciallmhar agus c\u00faramach, agus at\u00e1 freagr\u00fail do riachtanais
  na ndaoine faoi mh\u00edchumas. Tugtar spreagadh do chomhlachta\u00ed poibl\u00ed
  gn\u00edomh\u00fa chun na caighde\u00e1in inrochtaineachta is airde is f\u00e9idir
  a bhaint amach maidir le rochtain ar an eolas agus na seirbh\u00eds\u00ed a shol\u00e1thra\u00edonn
  siad don phobal.\\n\\nMolann an t\u00dadar\u00e1s N\u00e1isi\u00fanta M\u00edchumais
  gurb \u00e9 an mios\u00far is fearr a bheidh ann n\u00e1 go dtabharfaidh na daoine
  faoi mh\u00edchumas faoi deara go bhfuil athr\u00fa dearfach ag tarl\u00fa i nd\u00e1ir\u00edre
  ar mhaithe le rochtain ar sheirbh\u00eds\u00ed agus ar fhaisn\u00e9is.\\n\\nAingeal
  U\u00ed Ciar\u00e1in, Cathaoirleach, An t\u00dadar\u00e1s N\u00e1isi\u00fanta M\u00edchumais\\n\\n\u00c1bhar\\n\\n5\\n\\n6\\n\\n1  R\u00e9amhr\u00e1\\n\\nIs
  \u00e9ard at\u00e1 san Acht um M\u00edchumas 2005 (an tAcht) n\u00e1 beart gn\u00edmh
  dearfach a leagann s\u00edos bonn reacht\u00fail chun go mbeidh seirbh\u00eds\u00ed
  poibl\u00ed inrochtaineach. Leagann alt 26, 27 agus 28 den Acht oibleag\u00e1id\u00ed
  ar chomhlachta\u00ed poibl\u00ed go mbeidh rochtain ar a gcuid seirbh\u00eds\u00ed
  agus a gcuid faisn\u00e9ise ag daoine faoi mh\u00edchumas. Ullmha\u00edodh an C\u00f3d
  Cleachtais seo ar iarratas \u00f3n Aire Dl\u00ed agus Cirt, Comhionannais agus Athch\u00f3irithe
  Dl\u00ed faoi alt 30 den Acht chun treoir a thabhairt do chomhlachta\u00ed poibl\u00ed
  na hoibleag\u00e1id\u00ed sin a chomhl\u00edonadh.\\n\\nBa ch\u00f3ir a thabhairt
  faoi deara, c\u00e9 go bhfuil for\u00e1lacha breise san Acht d''inrochtaineacht
  maidir le foirgnimh agus l\u00e1ithreacha oidhreachta, nach dtagann siad seo laistigh
  den c\u00f3d cleachtais seo agus d\u00e9ile\u00e1lfar leo astu f\u00e9in.\\n\\nM\u00edn\u00edtear
  na hoibleag\u00e1id\u00ed a thagann faoi alt 26, 27 agus 28 sa Ch\u00f3d. N\u00ed
  chuims\u00edonn an C\u00f3d an pr\u00f3iseas gear\u00e1n gaolmhar a mbeidh feidhm
  aige faoi alt 38, 39 agus 40. D\u00e9anann na hailt seo for\u00e1il gur f\u00e9idir
  le duine faoi mh\u00edchumas gear\u00e1n a dh\u00e9anamh le hoifigeach fiosr\u00fach\u00e1in
  at\u00e1 ceaptha ag an gcomhlacht faoi alt 39 maidir le haon mhainneachtain de chuid
  comhlacht poibl\u00ed rochtain a shol\u00e1thar mar a cheangla\u00edtear faoi alt
  26, 27 agus 28. Mura bhfuil an gear\u00e1nach s\u00e1sta le toradh a ngear\u00e1in
  is f\u00e9idir leis n\u00f3 l\u00e9i achomharc a dh\u00e9anamh leis an Ombudsman
  mar a fhor\u00e1iltear faoi alt 40.\\n\\nC\u00e9 a bhainfidh tairbhe as na for\u00e1lacha
  seo?\\n\\nT\u00e1 s\u00e9 mar aidhm ag an Acht rochtain ar sheirbh\u00eds\u00ed
  poibl\u00ed a fheabhs\u00fa do dhaoine faoi mh\u00edchumas. Chun cr\u00edocha ailt
  26, 27 agus 29 den Acht, sainmh\u00edn\u00edtear an t\u00e9arma m\u00edchumas in
  alt 2 den Acht .i.: \\\"i nd\u00e1il le duine, cialla\u00edonn s\u00e9 srian\u00fa
  substainti\u00fail ar chumas an duine dul i mbun ceirde, ghn\u00f3 n\u00f3 gairm
  beatha sa St\u00e1t n\u00f3 chun p\u00e1irt a ghlacadh i saol s\u00f3isialta n\u00f3
  cult\u00fartha an St\u00e1it mar thoradh ar lag\u00fa fadbhunaithe fisici\u00fail,
  c\u00e9adfa\u00edoch, sl\u00e1inte meabhrach n\u00f3 intleacht\u00fail\\\".\\n\\nC\u00e9ard
  iad na seirbh\u00eds\u00ed a chuims\u00edtear?\\n\\nBaineann an c\u00f3d le seirbh\u00eds
  a thagann faoin sainmh\u00edni\u00fa ar sheirbh\u00eds\u00ed in alt 2 den Acht.
  Cuims\u00edonn s\u00e9 raon leathan seirbh\u00eds\u00ed agus \u00e1iseanna a shol\u00e1thra\u00edonn
  comhlachta\u00ed poibl\u00ed at\u00e1 ar f\u00e1il don phobal i gcoitinne n\u00f3
  d''earn\u00e1il ar leith den phobal.\\n\\n\u00c1ir\u00edtear orthu sin:\\n\\n(a)
  \u00fas\u00e1id \u00e1ite n\u00f3 saor\u00e1ide ar bith at\u00e1 faoi \u00fain\u00e9ireacht,
  faoi bhainist\u00edocht n\u00f3 faoi rial\u00fa comhlachta phoibl\u00ed;\\n(b) sol\u00e1thar
  faisn\u00e9ise n\u00f3 acmhainn faisn\u00e9ise n\u00f3 sc\u00e9im n\u00f3 li\u00fantas
  n\u00f3 tairbhe eile at\u00e1 \u00e1 riar ag comhlacht poibl\u00ed;\\n(c) seirbh\u00eds
  chult\u00fartha n\u00f3 oidhreachta ar bith at\u00e1 \u00e1 sol\u00e1thar ag comhlacht
  den s\u00f3rt sin; agus\\n(d) seirbh\u00eds ar bith \u00e1 sol\u00e1thar ag c\u00fairt
  n\u00f3 binse eile.\\n\\nC\u00e9ard iad na comhlachta\u00ed poibl\u00ed at\u00e1
  cuimsithe faoin gC\u00f3d?\\n\\nBaineann an c\u00f3d le raon leathan comhlachta\u00ed
  poibl\u00ed, agus iad \u00e9ags\u00fail \u00f3 thaobh an chine\u00e1l oibre a dh\u00e9anann
  siad agus \u00f3 thaobh a m\u00e9id. Sainmh\u00edn\u00edtear na comhlachta\u00ed
  poibl\u00ed a chuims\u00edtear faoin gc\u00f3d in alt 2 den Acht chun na comhlachta\u00ed
  seo a leanas a chuimsi\u00fa:\\n\\n(a) Roinn St\u00e1it;\\n\\n(b) Oifig an Uachtar\u00e1in;\\n\\n(c)
  Oifig an Ard-Aighne;\\n\\n(d) Oifig an Ard-Reachtaire Cuntas agus Ciste;\\n\\n(e)
  Oifig Thithe an Oireachtais;\\n\\n(f) \u00fadar\u00e1s \u00e1iti\u00fail;\\n\\n(g)
  Feidhmeannacht na Seirbh\u00edse Sl\u00e1inte;\\n\\n(h) duine, comhlacht n\u00f3
  eagra\u00edocht (seachas \u00d3glaigh na h\u00c9ireann) bunaithe\\n\\n(i) le haon
  achtach\u00e1n n\u00f3 faoi aon achtach\u00e1n (seachas Achtanna na gCuideachta\u00ed
  1963 go 2003) - d\u2019\u00e1ireofa\u00ed anseo, mar shampla, Coimisi\u00fan Craolach\u00e1in
  na h\u00c9ireann a buna\u00edodh faoin Acht Raidi\u00f3 agus Teilif\u00edse 1988,
  An Phr\u00edomh-Oifig Staidrimh, a buna\u00edodh faoin Acht Staidrimh 1993, an t\u00dadar\u00e1s
  N\u00e1isi\u00fanta M\u00edchumais a buna\u00edodh faoin Acht um \u00dadar\u00e1s
  N\u00e1isi\u00fanta M\u00edchumais 1999, an\\n\\n7\\n\\n8\\n\\ntSeirbh\u00eds C\u00fairteanna
  a buna\u00edodh faoin Acht um Sheirbh\u00eds C\u00fairteanna 1998, An Bord um Ch\u00fanamh
  Dl\u00edthi\u00fail a buna\u00edodh faoin Acht um Ch\u00fanamh Dl\u00edthi\u00fail
  Sibhialta 1995, n\u00f3\\n\\n(ii) faoi Achtanna na gCuideachta\u00ed, 1963 go 2003,
  de bhun cumhachta\u00ed a thugtar le hachtach\u00e1n eile n\u00f3 faoi achtach\u00e1n
  eile, agus a mhaoin\u00edtear go hioml\u00e1n n\u00f3 go p\u00e1irteach, cib\u00e9
  acu go d\u00edreach n\u00f3 go hind\u00edreach, tr\u00ed bh\u00edthin airgid arna
  shol\u00e1thar, n\u00f3 le hiasachta\u00ed arna nd\u00e9anamh n\u00f3 arna r\u00e1th\u00fa,
  ag Aire Rialtais n\u00f3 le heisi\u00faint scaireanna arna sealbh\u00fa ag Aire
  Rialtais n\u00f3 thar ceann Aire Rialtais. Mar shampla, bheadh Bus \u00c1tha Cliath,
  Bus \u00c9ireann agus Iarnr\u00f3d \u00c9ireann san \u00e1ireamh anseo.\\n\\nAg
  Tabhairt Aghaidh ar Shaincheisteanna Inrochtaineachta\\n\\nD''fhonn a chinnti\u00fa
  go mbeidh rochtain ar sheirbh\u00eds\u00ed n\u00ed m\u00f3r d\u00fainn a bheith
  ar an eolas faoi na baic a bh\u00edonn roimh dhaoine at\u00e1 faoi lag\u00fa fisici\u00fail,
  c\u00e9adfa\u00edoch n\u00f3 intleacht\u00fail. B\u00edonn difr\u00edocht sna riachtanais
  a bh\u00edonn acu agus is as sin a thiocfaidh an cine\u00e1l gn\u00edmh at\u00e1
  cu\u00ed agus gur f\u00e9idir \u00e9 a sheachadadh, \u00e1it a bhfuil sin ind\u00e9anta.\\n\\nT\u00e1
  raon leathan gn\u00e9ithe follasacha agus caolch\u00faiseacha araon a bh\u00edonn
  mar bhac ar inrochtaineacht do dhaoine faoi mh\u00edchumas agus orthu sin t\u00e1,
  mar shampla:\\n\\n* cumars\u00e1id, nuair a chuirtear i l\u00e1thair i bhform\u00e1id\u00ed
  dorochtana \u00ed;\\n* easpa feasachta maidir le riachtanais na ndaoine faoi mh\u00edchumas;\\n*
  an comhshaol fisici\u00fail m.sh. dearadh, leagan amach, comhartha\u00edocht, soilsi\u00fa
  agus araile;\\n* dearadh seirbh\u00edse m.sh. nuair a d''fh\u00e9adfadh c\u00f3rais,
  n\u00f3sanna imeachta agus cleachtais a bheith ina mbaic.\\n\\nIs f\u00e9idir rochtain
  ar fhaisn\u00e9is agus ar sheirbh\u00eds\u00ed a chur ar f\u00e1il nuair a shol\u00e1thra\u00edtear
  iad ar bhealach at\u00e1 i gcomhr\u00e9ir le riachtanais na ndaoine sin d\u00e1
  bhfuil siad beartaithe.\\n\\nGo ginear\u00e1lta is f\u00e9idir \u00e9 seo a \u00e9asc\u00fa
  tr\u00ed ghlacadh le cur chuige gn\u00edomhach agus comhairleach i leith eolais
  agus i leith dearaidh agus seachadadh seirbh\u00eds\u00ed.\\n\\n2 Fairsinge, Aidhm
  agus Cur i bhFeidhm an Ch\u00f3id Chleachtais\\n\\nFairsinge\\n\\nIs ar Chuid 3,
  Alt 26, 27 agus 28 den Acht um M\u00edchumas 2005 (an tAcht) at\u00e1 an c\u00f3d
  cleachtais seo d\u00edrithe.\\n\\nLeagann na hAilt amach ceanglais shonracha maidir
  le  faisn\u00e9is agus seirbh\u00eds\u00ed, lena n\u00e1ir\u00edtear seirbh\u00eds\u00ed
  agus earra\u00ed a cheanna\u00edonn comhlachta\u00ed poibl\u00ed ionas go mbeidh
  rochtain ag daoine faoi mh\u00edchumas orthu sa ch\u00e1s go bhfuil sin ind\u00e9anta.\\n\\nAidhm\\n\\nForbra\u00edodh
  an C\u00f3d seo d''fhonn tac\u00fa le comhlachta\u00ed poibl\u00ed a ndualgais reacht\u00fala
  a chomhl\u00edonadh faoi alt 26, 27 agus 28, den Acht um M\u00edchumas 2005 (an
  tAcht) (f\u00e9ach Aguis\u00edn a hAon).\\n\\nCur i bhFeidhm\\n\\nBa ch\u00f3ir
  go mbeadh an doicim\u00e9ad seo \u00fas\u00e1ideach do chomhlachta\u00ed poibl\u00ed
  tr\u00ed threoir phraitici\u00fail a chur ar f\u00e1il maidir leis na gn\u00e9ithe
  \u00e9ags\u00fala at\u00e1 i gceist agus sampla\u00ed maidir le cur chuige agus
  modhanna a d''fh\u00e9adfa\u00ed a \u00fas\u00e1id chun a chinnti\u00fa go mbeadh
  rochtain ag daoine faoi mh\u00edchumas ar a seirbh\u00eds\u00ed sa ch\u00e1s go
  bhfuil sin ind\u00e9anta agus cu\u00ed. Foinse \u00fas\u00e1ideach faisn\u00e9ise
  a bheidh ann freisin do dhaoine faoi mh\u00edchumas at\u00e1 ag \u00fas\u00e1id
  na seirbh\u00eds\u00ed seo, d\u00e1 bpl\u00e9ad\u00e1laithe, agus d''eagra\u00edochta\u00ed
  a dh\u00e9anann ionada\u00edocht ar son daoine faoi mh\u00edchumas.\\n\\nAidhmeanna
  Sonracha an Ch\u00f3id seo\\n\\nIs iad aidhmeanna sonracha an ch\u00f3id:\\n\\n1.
  tac\u00fa le comhlachta\u00ed poibl\u00ed tr\u00ed l\u00e9irmh\u00edni\u00fa praitici\u00fail
  a chur ar f\u00e1il maidir le ceanglais ailt 26, 27 agus 28, den Acht um M\u00edchumas
  2005 (an tAcht);\\n2. comhairle phraitici\u00fail a thabhairt maidir leis an gcaoi
  ina bhf\u00e9adfa\u00ed na ceanglais seo a chomhl\u00edonadh i bhfianaise raon agus
  \u00e9ags\u00falacht na gcomhlachta\u00ed poibl\u00ed agus na seirbh\u00eds\u00ed
  at\u00e1 i gceist.\\n\\n9\\n\\n3  St\u00e1das an Ch\u00f3id Chleachtais seo\\n\\nGinear\u00e1lta\\n\\nBaineann
  an C\u00f3d  go d\u00edreach leis na h\u00e1bhair a dtagra\u00edtear d\u00f3ibh
  in alt 26, 27 agus 28 den Acht um M\u00edchumas 2005 (an tAcht). Gearrann na hailt
  seo den Acht dualgais shuntasacha reacht\u00fala ar chomhlachta\u00ed poibl\u00ed
  a th\u00e1inig i bhfeidhm an 31 Nollaig 2005.\\n\\nMeastar go mbeidh eagra\u00edochta\u00ed
  poibl\u00ed at\u00e1 ag comhl\u00edonadh leis an gc\u00f3d seo g\u00e9illi\u00fail
  don reachta\u00edocht. Deimhn\u00edonn Alt 30(6) go \\\"measfar go mbeidh comhlacht
  poibl\u00ed at\u00e1 ag comhl\u00edonadh le c\u00f3d cleachtais at\u00e1 aontaithe
  ag comhl\u00edonadh le for\u00e1il \u00e1bhartha an Achta seo\\\".\\n\\nAnuas air
  sin, for\u00e1lann an tAcht um \u00dadar\u00e1s N\u00e1isi\u00fanta M\u00edchumais,
  1999, do r\u00f3l monat\u00f3ireachta don \u00dadar\u00e1s, i nd\u00e1il le cur
  i bhfeidhm na gC\u00f3d Cleachtais forbartha ag an \u00dadar\u00e1s agus a dhearbha\u00edtear
  a bheith faofa ag an Aire. \u00c1ir\u00edtear leis seo c\u00f3id cos\u00fail leis
  an gceann seo. Sonra\u00edonn Cuid II, Alt 8 (2) (d) den Acht um \u00dadar\u00e1s
  N\u00e1isi\u00fanta M\u00edchumais, 1999, feidhmeanna monat\u00f3ireachta an \u00dadar\u00e1is
  mar: \\\"faireach\u00e1n a dh\u00e9anamh ar fhorfheidhmi\u00fa caighde\u00e1n agus
  c\u00f3d cleachtais i gcl\u00e1ir agus seirbh\u00eds\u00ed a shol\u00e1thra\u00edtear
  do dhaoine faoi mh\u00edchumas agus tuarasc\u00e1il a thabhairt don Aire d\u00e1
  r\u00e9ir.\\\"\\n\\nOibleag\u00e1id\u00ed i nd\u00e1il leis an Acht um M\u00edchumas,
  2005\\n\\nT\u00e1 feidhm leis na hailt seo den Acht um M\u00edchumas 2005 (an tAcht),
  a ghearrann dualgais shuntasacha reacht\u00fala ar chomhlachta\u00ed poibl\u00ed
  rochtain a bheith ag daoine faoi mh\u00edchumas ar a seirbh\u00eds\u00ed agus ar
  a bhfaisn\u00e9is sa ch\u00e1s go bhfuil sin ind\u00e9anta agus oiri\u00fanach,
  \u00f3n 31 Nollaig 2005. D''fh\u00e9adfa\u00ed cinnt\u00ed a dh\u00e9anamh \u00f3
  thaobh praitici\u00falachta agus oiri\u00fanachta ar bhonn, mar shampla, leibh\u00e9al
  smachta agus costais.\\n\\nMaidir le seirbh\u00eds\u00ed iompair phoibl\u00ed \u00e1irithe,
  b''fh\u00e9idir go sonr\u00f3idh an plean earn\u00e1la at\u00e1 le hullmh\u00fa
  ag an Roinn Iompair, faoi alt 31 agus 34, an creatlach ama/na creatlaigh ama chun
  go mbeadh inrochtaineacht ar sheirbh\u00eds\u00ed iompair phoibl\u00ed (f\u00e9ach
  alt 31(5) den Acht).\\n\\nFreagrachta\u00ed agus Freagracht\\n\\nLeagann alt 26,
  27 agus 28 den Acht  oibleag\u00e1id\u00ed ar cheann comhlachta phoibl\u00ed a shainmh\u00edn\u00edtear
  in alt 2 mar \\\"an duine at\u00e1 ina p(h)r\u00edomhoifigeach feidhmeannach (cib\u00e9
  ainm a dtugtar air) ar an gcomhlacht, n\u00f3 an duine a chomhl\u00edonann feidhmeanna
  na hoifige sin\\\". Sa ch\u00e1il sin, \u00e9il\u00edtear orthu a chinnti\u00fa
  go gcomhl\u00edonann an comhlacht na hoibleag\u00e1id\u00ed mar at\u00e1 leagtha
  s\u00edos sna hailt sin.\\n\\nT\u00e1 s\u00e9 mar aidhm ag an gc\u00f3d seo taca\u00edocht
  a thabhairt do chomhlachta\u00ed poibl\u00ed i dtreo a noibleag\u00e1id\u00ed san
  Acht a chomhl\u00edonadh.\\n\\nD''fhonn cib\u00e9 gn\u00edomhartha at\u00e1 riachtanach
  a bheart\u00fa, moltar do cheann gach comhlachta phoibl\u00ed \u00e1bhartha:\\n\\n*
  Cinneadh a dh\u00e9anamh ar a mh\u00e9id a bhaineann for\u00e1lacha an Achta lena
  n-eagra\u00edocht i gcomhth\u00e9acs r\u00e9imse na seirbh\u00eds\u00ed agus na
  faisn\u00e9ise a shol\u00e1thra\u00edonn s\u00ed;\\n* Na polasaithe, na n\u00f3sanna
  imeachta agus na gn\u00edomhartha at\u00e1 riachtanach do chomhl\u00edonadh a (h)oibleag\u00e1id\u00ed
  a mheas, a bheart\u00fa agus a athbhreithni\u00fa;\\n* Scr\u00fad\u00fa a dh\u00e9anamh
  ar a ind\u00e9anta agus a chu\u00ed is at\u00e1 na bearta at\u00e1 plean\u00e1ilte
  chun a chinnti\u00fa go gcomhl\u00edontar riachtanais an Achta.\\n\\n12\\n\\n4.
  Bunghn\u00e9ithe an Ch\u00f3id\\n\\nAlt 26 Rochtain ar Sheirbh\u00eds\u00ed, agus
  araile. Alt 26 (1)(a) Rochtain Comhth\u00e1ite ar Sheirbh\u00eds\u00ed\\n\\nCeangla\u00edtear
  ar chomhlachta\u00ed poibl\u00ed a chinnti\u00fa go mb\u00edonn rochtain ag daoine
  faoi mh\u00edchumas ar na seirbh\u00eds\u00ed a chuireann siad ar f\u00e1il don
  phobal i gcoitinne, sa ch\u00e1s go bhfuil sin ind\u00e9anta agus cu\u00ed. Is iad
  na seirbh\u00eds\u00ed at\u00e1 i gceist n\u00e1 iad si\u00fad a thagann laistigh
  den sainmh\u00edni\u00fa at\u00e1 ar sheirbh\u00eds\u00ed faoi alt 2 den Acht um
  M\u00edchumas (an tAcht).\\n\\nCialla\u00edonn sin, go praitici\u00fail, gur f\u00e9idir
  le daoine faoi mh\u00edchumas, \u00fas\u00e1id a bhaint as seirbh\u00eds a chuireann
  comhlacht poibl\u00ed ar f\u00e1il ag an bpointe c\u00e9anna teagmh\u00e1la n\u00f3
  ionaid, ag an am c\u00e9anna le gach duine eile, a mh\u00e9id is ind\u00e9anta agus
  is cu\u00ed.\\n\\nIs f\u00e9idir le comhlacht poibl\u00ed rochtain comhth\u00e1ite
  a bhaint amach tr\u00ed:\\n\\n* Anail\u00eds a dh\u00e9anamh ar: (i) c\u00e9 chomh
  comhth\u00e1ite is at\u00e1 an tseirbh\u00eds phoibl\u00ed a shol\u00e1thra\u00edonn
  siad chun a fh\u00e1il amach an bhfuil aon \u00e9ags\u00falacht idir an bealach
  ina mb\u00edonn rochtain ag daoine faoi mh\u00edchumas ar sheirbh\u00eds\u00ed a
  shol\u00e1thra\u00edtear  agus (ii) inrochtaineacht na seirbh\u00eds\u00ed sin do
  dhaoine le m\u00edchumas;\\n* Plean gn\u00edmh praitici\u00fail agus cu\u00ed a
  chur i dtoll a ch\u00e9ile chun d\u00e9ile\u00e1il le saincheisteanna comhth\u00e1ite
  agus rochtaineachta at\u00e1 aitheanta, i gcomhairle le p\u00e1irtithe leasmhara,
  a mh\u00e9id is ind\u00e9anta agus is cu\u00ed;\\n* Beartais ar glacadh leo a chur
  chun cinn sa chaoi is go mbeidh an pobal go ginear\u00e1lta ar an eolas f\u00fathu.\\n\\nB''fh\u00e9idir
  go mbeadh s\u00e9 seo a leanas \u00fas\u00e1ideach do chomhlachta\u00ed poibl\u00ed
  agus a bhfuil le d\u00e9anamh \u00e1 mheas acu:\\n\\n* Teagmh\u00e1il a dh\u00e9anamh
  leis an \u00dadar\u00e1s N\u00e1isi\u00fanta M\u00edchumais maidir le comhairle
  faoi fhoilseach\u00e1in \u00fas\u00e1ideacha agus cur chuige a bhf\u00e9adfa\u00ed
  \u00fas\u00e1id a bhaint as chun athbhreithni\u00fa a dh\u00e9anamh ar inrochtaineacht
  seirbh\u00eds\u00ed agus chun pleananna gn\u00edmh a fhorbairt;\\n* Gr\u00fapa comhairleach
  a bhun\u00fa, \u00e1it nach bhfuil gr\u00fapa tomhalt\u00f3ra ann cheana f\u00e9in,
  chun maoirseacht a dh\u00e9anamh ar athbhreithni\u00fa ar c\u00e9 chomh comhth\u00e1ite
  agus inrochtana is at\u00e1 seirbh\u00eds\u00ed. T\u00e1 Coiste Comhairleach N\u00e1isi\u00fanta
  ar Mh\u00edchumas bunaithe ag F\u00c1S, mar shampla, chun, i measc nithe eile, \\\"cuidi\u00fa
  agus comhairle a thabhairt maidir leis na c\u00f3rais agus/n\u00f3 an sol\u00e1thar
  at\u00e1 riachtanach do chuimsi\u00fa n\u00edos leithne do dhaoine faoi mh\u00edchumas
  i gcl\u00e1ir agus i seirbh\u00eds\u00ed F\u00c1S agus cabhair a chur ar f\u00e1il
  do F\u00c1S chun\\n\\nbearna\u00ed agus d\u00eddhreasachta\u00ed reatha a aithint
  maidir le cl\u00e1ir agus seirbh\u00eds\u00ed F\u00c1S, agus comhairle a thabhairt
  faoin gcaoi ina bhf\u00e9adfa\u00ed iad seo a sh\u00e1r\u00fa\\\". F\u00e9ach freisin:
  http://www.fas.ie ;\\n\\n* Ini\u00fachadh rochtaineachta ar l\u00e1ithreacha agus
  forbairt strait\u00e9iseach seachtrach. T\u00e1 ini\u00fachadh rochtaineachta d\u00e9anta
  ag Oifig na nOibreacha Poibl\u00ed, mar shampla, ar a l\u00e1ithreacha agus t\u00e1
  plean gn\u00edmh curtha i dtoll a ch\u00e9ile aici chun rochtain a fheabhs\u00fa.
  Ar na sampla\u00ed gn\u00edomhartha at\u00e1 d\u00e9anta ag an OPW t\u00e1 c\u00f3ras
  c\u00e1rta gaireachta a th\u00f3gfaidh \u00e1it ch\u00f3ras an ch\u00e1rta fl\u00edpe\u00e1la
  at\u00e1 ann faoi l\u00e1thair maraon leis na lasca soilse laistigh d''fhoirgnimh
  a \u00edsli\u00fa;\\n* Cleachtas agus Polasa\u00ed Ch\u00faram Custaim\u00e9ara
  reatha a mh\u00e9ad\u00fa. T\u00e1 Bord Sol\u00e1thair Leictreachais, mar shampla,
  tar \u00e9is Cl\u00e1r Custaim\u00e9ara le Trealamh Leighis Baile a thabhairt isteach
  chun a chinnti\u00fa go bhfuil sol\u00e1thar lean\u00fanach leictreachais acu;\\n*
  Faisn\u00e9is a shol\u00e1thar i bhform\u00e1id inrochtana do sheimine\u00e1ir phoibl\u00ed,
  l\u00e9achta\u00ed, cruinnithe poibl\u00ed agus cl\u00e1ir oili\u00fana phr\u00edomhshrutha
  sa ch\u00e1s go bhfuil sin praitici\u00fail.\\n\\nAlt 26 (1)(b) Cabhair a chur ar
  f\u00e1il\\n\\nCeangla\u00edtear ar chomhlachta\u00ed poibl\u00ed, nuair at\u00e1
  sin ind\u00e9anta agus cu\u00ed, cabhair a chur ar f\u00e1il chun cur ar chumas
  duine faoi mh\u00edchumas teacht ar sheirbh\u00eds phr\u00edomhshrutha, m\u00e1
  bh\u00edonn sin \u00e1 \u00e9ileamh ag an duine sin. T\u00e1 feidhm leis seo nuair
  at\u00e1 an comhlacht poibl\u00ed s\u00e1sta go bhfuil cabhair den s\u00f3rt sin
  riachtanach.\\n\\nB''fh\u00e9idir go mbeadh \u00e9ags\u00falacht ag baint leis na
  cine\u00e1lacha cabhrach a bheidh riachtanach ag brath ar an gcine\u00e1l seirbh\u00edse
  a bhfuiltear \u00e1 sol\u00e1thar agus an saghas m\u00edchumais at\u00e1 i gceist.
  B''fh\u00e9idir go mbeadh bearta simpl\u00ed i gceist maidir leis an ngn\u00edomh
  at\u00e1 ag teast\u00e1il, mar shampla am a chaitheamh ag cur comhairle ar dhuine
  faoi mh\u00edchumas faoi na roghanna seirbh\u00edse n\u00f3 b''fh\u00e9idir go mbeadh
  cabhair n\u00edos speisialaithe ag teast\u00e1il cos\u00fail le teangaireacht teanga
  comhartha\u00edochta.\\n\\nIs f\u00e9idir le comhlacht poibl\u00ed \u00e9 seo a
  bhaint amach tr\u00ed:\\n\\n* Meas\u00fan\u00fa a dh\u00e9anamh ar an gcine\u00e1l
  cabhrach gur dh\u00f3igh a theast\u00f3dh. D''fh\u00e9adfadh go mbeadh comhairli\u00fach\u00e1n
  le gr\u00fapa\u00ed ionada\u00edocha i gceist leis seo, agus comhairle a fh\u00e1il
  faoi chine\u00e1lacha iomchu\u00ed cabhrach;\\n* An t-\u00e9ileamh d\u00f3ch\u00fail
  ar chabhair ar iarratas a thriail agus a mheas;\\n* Scr\u00fad\u00fa a dh\u00e9anamh
  ar phraitici\u00falacht agus oiri\u00fanacht choibhneasta na roghanna \u00e9ags\u00fala
  at\u00e1 ar f\u00e1il chun freagairt don \u00e9ileamh seo;\\n\\n* Socruithe a dh\u00e9anamh
  chun a chinnti\u00fa gur f\u00e9idir an chabhair at\u00e1 aitheanta a bheith riachtanach,
  a fh\u00e1il n\u00f3 a fhorbairt agus \u00ed a chur ar f\u00e1il, a mh\u00e9id is
  ind\u00e9anta agus is cu\u00ed;\\n* N\u00f3sanna imeachta a fhorbairt chun freagra
  a thabhairt ar iarratais ar chabhair, lena n\u00e1ir\u00edtear deis a chur ar f\u00e1il
  cumars\u00e1id a dh\u00e9anamh leis an gcustaim\u00e9ir nuair at\u00e1 sin praitici\u00fail
  agus cu\u00ed agus a chinnti\u00fa go bhfuil an fhoireann iomchu\u00ed feasach i
  dtaobh na n\u00f3sanna imeachta seo;\\n* Foins\u00ed iomchu\u00ed a aithint chun
  cine\u00e1lacha \u00e9ags\u00fala cabhrach a d''fh\u00e9adfadh a bheith i gceist
  a shol\u00e1thar n\u00f3 foireann a spreagadh chun na scileanna breise a bheadh
  i gceist a fhoghlaim, a mh\u00e9id is ind\u00e9anta agus is cu\u00ed;\\n* Bearta
  ar glacadh leo a chur chun cinn sa chaoi is go bhfuil an pobal i gcoitinne ar an
  eolas f\u00fathu.\\n\\nB''fh\u00e9idir go mbeadh s\u00e9 seo a leanas \u00fas\u00e1ideach
  do chomhlachta\u00ed poibl\u00ed agus a bhfuil le d\u00e9anamh \u00e1 mheas acu:\\n\\n*
  \u00c1it nach bhfuil pain\u00e9il de thomhalt\u00f3ir\u00ed cheana f\u00e9in, d''fh\u00e9adfa\u00ed
  a leith\u00e9id\u00ed a bhun\u00fa mar threoir d''fhorbairt. T\u00e1 Pain\u00e9al
  Tomhalt\u00f3ir\u00ed bunaithe, mar shampla, ag Ionad Springfield de chuid Fheidhmeannacht
  na Seirbh\u00edse Sl\u00e1inte \u2013 Ionad Limist\u00e9ar L\u00e1r na T\u00edre,
  an Muileann gCearr, cuimsithe as gr\u00fapa beag daoine a roghna\u00edodh ar bhonn
  randamach a chasann le ch\u00e9ile chun saincheisteanna at\u00e1 \u00e1bharach d\u00e1
  seirbh\u00eds\u00ed sl\u00e1inte a phl\u00e9. B\u00edonn ball den phobal, at\u00e1
  neamhsple\u00e1ch ar an HSE/FSS ina c(h)athaoirleach ar an bpain\u00e9al. D\u00e9anann
  na seirbh\u00eds\u00ed \u00e1bhartha laistigh den HSE/FSS L\u00e1rt\u00edre an pain\u00e9al
  a chomhord\u00fa, a riaradh agus a mhaoini\u00fa. Is \u00e9 seo an cur s\u00edos
  a dh\u00e9antar ar na pain\u00e9il thomhalt\u00f3ir\u00ed in \u00e1bhar f\u00f3gra\u00edochta
  an Phain\u00e9il: ''go gcinn\u00edtear go bhfuil l\u00e1mh agatsa san fheabhas at\u00e1
  le cur ar an tseirbh\u00eds a mbaineann tusa \u00fas\u00e1id aisti'';\\n* For\u00e1il
  maidir le hoili\u00faint i bhfeasacht mh\u00edchumais do bhaill foirne \u00e1bhartha.
  Cuireann Col\u00e1iste Mhuire gan Sm\u00e1l de chuid Ollscoil Luimnigh, mar shampla,
  oili\u00faint i bhfeasacht mh\u00edchumais ar f\u00e1il d''fhoirne riarach\u00e1in,
  acad\u00fala agus taca\u00edochta;\\n* Forbairt agus cur chun cinn n\u00f3sanna
  imeachta soil\u00e9ire maidir le cabhair a chur ar f\u00e1il, mar shampla i gc\u00e1s
  creatlaigh ama, r\u00f3lanna agus freagrachta\u00ed. Nuair a bheidh teangaire le
  teanga comhartha\u00edochta na Gaeilge ag teast\u00e1il, \u00f3 am go ham, mar shampla,
  beidh f\u00f3gra at\u00e1 leordh\u00f3thain ag teast\u00e1il. I gc\u00e1s gn\u00edomhaireachta
  do theangair\u00ed teanga comhartha\u00edochta a chuireann teangair\u00ed cl\u00e1raithe
  ar f\u00e1il, mar shampla, b\u00edonn f\u00f3gra coic\u00edse ag teast\u00e1il de
  ghn\u00e1th m\u00e1s f\u00e9idir, c\u00e9 go nd\u00e9anfar gach iarracht freastal
  ar iarratais a bhfuil pr\u00e1inn leo le f\u00f3gra n\u00edos giorra. N\u00edor
  mh\u00f3r do chomhlachta\u00ed poibl\u00ed a chinnti\u00fa go gcuirf\u00ed daoine,
  gur dh\u00f3igh go mbeadh an cine\u00e1l sin taca\u00edochta \u00e1 iarraidh acu,
  ar an eolas, chomh maith c\u00e9anna, maidir leis na riachtanais a ghabhann leis
  an bhf\u00f3gra.\\n\\nAlt 26 (1)(c) Comhairle Shaineola\u00edoch\\n\\nN\u00ed m\u00f3r
  do chomhlacht poibl\u00ed, nuair is cu\u00ed, a chinnti\u00fa go bhfuil an saineolas
  agus na scileanna cu\u00ed ar f\u00e1il chun comhairle a chur air chun go mbeidh
  rochtain ar a sheirbh\u00eds\u00ed. Is f\u00e9idir go gcuirf\u00ed an saineolas
  sin ar f\u00e1il laistigh den eagra\u00edocht, n\u00f3, nuair is cu\u00ed, go bhfaighf\u00ed
  go seachtrach \u00e9.\\n\\nIs f\u00e9idir le comhlacht poibl\u00ed seo a bhaint
  amach tr\u00ed:\\n\\n* Am a ghlacadh chun na seirbh\u00eds\u00ed \u00e9ags\u00fala
  at\u00e1 \u00e1 sol\u00e1thar ar d\u00f3igh go mbeidh comhairle ag teast\u00e1il
  maidir le conas is f\u00e9idir rochtain a bheith ag daoine faoi mh\u00edchumas orthu,
  a aithint, d''fhonn an cine\u00e1l sonrach shaineolais at\u00e1 de dh\u00edth a
  aithint;\\n* A chinnti\u00fa cib\u00e9 an bhfuil n\u00f3 nach bhfuil an s\u00f3rt
  sin saineolais ar f\u00e1il go hinmhe\u00e1nach n\u00f3 an g\u00e1 \u00e9 a lorg
  go seachtrach;\\n* Tionscnaimh oili\u00fana foirne a aithint agus a chur i bhfeidhm
  chun acmhainn int\u00ed a chur le ch\u00e9ile chun comhairle shaineola\u00edoch
  a chur ar f\u00e1il;\\n* Foins\u00ed iomchu\u00ed a aithint, m\u00e1 t\u00e1 comhairle
  sheachtrach de dh\u00edth;\\n* Am a thabhairt chun meas\u00fan\u00fa a dh\u00e9anamh
  ar aon chomhairle a thugtar, agus na gn\u00edomhartha cu\u00ed agus ind\u00e9anta
  a thiocfadh aisti;\\n* An chomhairle a chur faoi ndeara don phearsanra iomchu\u00ed;\\n*
  Bearta ar glacadh leo a chur chun cinn sa chaoi is go mbeidh an pobal i gcoitinne
  ar an eolas f\u00fathu.\\n\\nB''fh\u00e9idir go mbeadh s\u00e9 seo a leanas \u00fas\u00e1ideach
  do chomhlachta\u00ed poibl\u00ed agus a bhfuil le d\u00e9anamh \u00e1 mheas acu:\\n\\n*
  Creatlach chomhairli\u00fach\u00e1in a bhun\u00fa chun comhairle a thabhairt ar
  \u00e1bhair ar n\u00f3s comhairle shaineola\u00edoch riachtanach a aithint agus
  a chur ar f\u00e1il. Buna\u00edodh an Coiste ar Inrochtaineacht Iompair Phoibl\u00ed
  i m\u00ed I\u00fail 2000 mar ghr\u00fapa saineola\u00edoch chun comhairle a chur
  ar an Aire Iompair maidir le gn\u00e9ithe molta inrochtaineachta a bhaineann le
  tionscadail infheist\u00edochta iompair agus le saincheisteanna at\u00e1 ann cheana
  f\u00e9in a bhaineann le hinrochtaineacht iompair phoibl\u00ed.\\n\\nAlt 26 (2)
  Oifigigh Rochtana\\n\\nCeangla\u00edtear ar gach comhlacht poibl\u00ed oifigeach
  amh\u00e1in ar a laghad, a bheith \u00fadaraithe chun gn\u00edomh\u00fa i gcumas
  \\\"oifigigh rochtana\\\". T\u00e1 an t-oifigeach sin, nuair is cu\u00ed, freagrach\\n\\n16\\n\\nas
  cabhair agus treoir a chur ar f\u00e1il, a shocr\u00fa agus a chomhord\u00fa do
  dhaoine faoi mh\u00edchumas at\u00e1 ag lorg rochtana ar sheirbh\u00eds\u00ed a
  chuireann an comhlacht sin ar f\u00e1il.\\n\\nIs f\u00e9idir le comhlacht poibl\u00ed
  seo a bhaint amach tr\u00ed:\\n\\n* Na scileanna a bheadh riachtanach do r\u00f3l
  an oifigigh rochtana a mheas;\\n* An l\u00edon oifigeach a theast\u00f3dh i nd\u00e1il
  leis na seirbh\u00eds\u00ed at\u00e1 \u00e1 sol\u00e1thar ag an gcomhlacht, a mheas
  (is ceanglas de chuid an Achta go mbeadh oifigeach amh\u00e1in ar a laghad ann);\\n*
  Oifigeach amh\u00e1in ar a laghad a \u00fadar\u00fa chun r\u00f3l an oifigigh rochtana
  mar a shainmh\u00edn\u00edtear san Acht, a chomhl\u00edonadh;\\n* A chinnti\u00fa
  go bhfuil oili\u00faint mar is cu\u00ed ar an oifigeach seo agus breithmheas tugtha
  d\u00f3/di d\u00e1 d(h)ualgais agus d\u00e1 f(h)reagrachta\u00ed (t\u00e1 s\u00e9
  t\u00e1bhachtach go bhf\u00e1gfadh an oili\u00faint go mbeadh an tOifigeach Rochtana
  in ann (a) d\u00e9ile\u00e1il le comhth\u00e1th\u00fa agus rochtain sa l\u00e1thair
  shaini\u00fail ina bhfuil s\u00e9 n\u00f3 s\u00ed ceaptha (b) cur i bhfeidhm strait\u00e9is\u00ed
  a dhearadh agus a chur chun cinn n\u00f3 tac\u00fa leo, chun aghaidh a thabhairt
  ar na h\u00e1bhair seo, \u00e1it a bhfuil s\u00e9 sin praitici\u00fail agus cu\u00ed);\\n*
  A chinnti\u00fa gur f\u00e9idir le daoine faoi mh\u00edchumas teacht go h\u00e9asca
  ar an Oifigeach seo, ar mian leo rochtain a fh\u00e1il ar sheirbh\u00eds\u00ed a
  chuireann an comhlacht poibl\u00ed ar f\u00e1il, agus go mbeidh baill foirne a bhfuil
  a c(h)omhairle agus a t(h)aca\u00edocht ag teast\u00e1il uathu in ann teacht air/uirthi
  go h\u00e9asca freisin;\\n* A chinnti\u00fa go bhfuil teagmh\u00e1il rialta ag an
  Oifigeach seo leis an mbainist\u00edocht shinsearach agus go bhfuil acmhainn\u00ed
  agus taca\u00edocht chu\u00ed aige n\u00f3 aici ina r\u00f3l;\\n* A chur chun cinn
  go gceapfa\u00ed agus go mbeadh f\u00e1il ar Oifigeach/Oifigigh Rochtana agus an
  chaoi le teagmh\u00e1il a dh\u00e9anamh leo, sa chaoi is go mbeidh an pobal i gcoitinne
  ar an eolas f\u00fathu agus in ann leas a bhaint as a gcabhair.\\n\\nAlt 27 Inrochtaineacht
  seirbh\u00eds\u00ed a chuirtear ar f\u00e1il do chomhlachta\u00ed poibl\u00ed\\n\\nT\u00e1
  s\u00e9 mar cheanglas ar gach comhlacht poibl\u00ed \u00f3n 31 Nollaig 2005 a chinnti\u00fa
  go mbeidh rochtain ar na hearra\u00ed n\u00f3 ar na seirbh\u00eds\u00ed at\u00e1
  \u00e1 sol\u00e1thar d\u00f3ibh ag daoine faoi mh\u00edchumas ach amh\u00e1in d\u00e1
  mba rud \u00e9 nach mbeadh s\u00e9 ind\u00e9anta n\u00f3 inchosanta ar bhonn costais
  n\u00f3 d\u00e1 mbeadh moill mh\u00edr\u00e9as\u00fanach d\u00e1 bharr. Bainfidh
  s\u00e9 seo le raon leathan earra\u00ed n\u00f3 seirbh\u00eds\u00ed lena n-\u00e1ir\u00edtear
  trealamh, \u00e1bhair, teicneola\u00edocht na faisn\u00e9ise agus araile.\\n\\nIs
  f\u00e9idir le comhlacht poibl\u00ed seo a bhaint amach tr\u00ed:\\n\\n* Athbhreithni\u00fa
  a dh\u00e9anamh ar pholasa\u00ed reatha sol\u00e1thair, n\u00f3sanna imeachta, cleachtais,
  treoirl\u00ednte n\u00f3 teimpl\u00e9id a \u00fas\u00e1ideann n\u00f3 a d''fhorbair
  an comhlacht poibl\u00ed, lena fh\u00e1il\\n\\namach conas is f\u00e9idir leo athbhreithni\u00fa
  a dh\u00e9anamh orthu chun inrochtaineacht a fh\u00ed isteach sa phr\u00f3iseas
  tairisceana mar chrit\u00e9ar (bheadh s\u00e9 t\u00e1bhachtach mar shampla seice\u00e1il
  an nd\u00e9anann polasaithe tairisceana r\u00e1iteas follasach ar inrochtaineacht);\\n\\n*
  F\u00e9achaint chuige i ngach prois\u00e9as tairisceana poibl\u00ed go gcuirtear
  inrochtaineacht san \u00e1ireamh mar chrit\u00e9ar le linn an phr\u00f3isis tairisceana
  ioml\u00e1in, idir com\u00f3rtais tairisceana a bhun\u00fa agus a re\u00e1cht\u00e1il,
  tairiscint\u00ed a mheas agus an conradh a chur ar aghaidh, agus n\u00f3sanna imeachta
  agus athbhreithni\u00fa a thabhairt chun cr\u00edche;\\n* An ceanglas seo a chur
  in i\u00fal do gach ball pearsanra iomchu\u00ed a bheidh p\u00e1irteach sa phr\u00f3iseas
  tairisceana agus treoir a thabhairt d\u00f3\u00edbh i nd\u00e1il leis na c\u00fains\u00ed
  nuair nach mbeidh an ceanglas feili\u00fanach ar fhorais at\u00e1 sainmh\u00ednithe
  i m\u00edr (a), (b) agus (c) in alt 27(2) (f\u00e9ach th\u00edos).\\n\\nEisceachta\u00ed\\n\\nAithn\u00edtear
  go mb''fh\u00e9idir nach mbeif\u00ed i gc\u00f3na\u00ed \u00e1balta a chinnti\u00fa
  go mbeidh rochtain ar na hearra\u00ed n\u00f3 ar na seirbh\u00eds\u00ed a cheanna\u00edonn
  an comhlacht ach n\u00edor ch\u00f3ir eisceachta\u00ed a thabhairt san \u00e1ireamh
  ach amh\u00e1in de r\u00e9ir na gc\u00fains\u00ed a shain\u00edtear i m\u00edr (a),
  (b) agus (c) in alt 27(2) den Acht. For\u00e1lann siad nach mbeidh feidhm leis an
  gceanglas maidir leo seo:\\n\\n* Nuair nach mbeadh s\u00e9 ind\u00e9anta (mar shampla:
  nuair nach bhfuil an teicneola\u00edocht a theasta\u00edonn ar f\u00e1il go h\u00e9asca);
  n\u00f3\\n* Nuair nach mbeadh s\u00e9 inchosanta \u00e9 a dh\u00e9anamh \u00f3 thaobh
  costais de; n\u00f3\\n* Nuair a bheadh moill mh\u00edr\u00e9as\u00fanach ar shol\u00e1thar
  na n-earra\u00ed n\u00f3 na seirbh\u00eds\u00ed do dhaoine eile (mar shampla: nuair
  a bh\u00edonn earra\u00ed n\u00f3 seirbh\u00eds\u00ed n\u00f3 an d\u00e1 rud araon
  ar f\u00e1il agus de dh\u00edth ar dhaoine eile agus go mbeadh an mhoill shuntasach
  a bhainfeadh lena sol\u00e1thar m\u00edch\u00f3ir do na daoine eile sin).\\n\\nAlt
  28 Rochtain ar Fhaisn\u00e9is\\n\\nBaineann an t-alt seo le comhlachta\u00ed poibl\u00ed
  a chuireann faisn\u00e9is ar f\u00e1il don phobal i gcoitinne.\\n\\nAlt 28 (1)(a)\\n\\nCeangla\u00edtear
  ar gach comhlacht poibl\u00ed, a mh\u00e9id is ind\u00e9anta, a chinnti\u00fa go
  bhfuil an faisn\u00e9is a chuirtear ar f\u00e1il \u00f3 bh\u00e9al don phobal ar
  f\u00e1il i bhform\u00e1id inrochtana, m\u00e1 iarrann daoine le lag\u00fa \u00e9isteachta
  \u00e9.\\n\\nT\u00e1 r\u00e9imse i gceist le deacrachta\u00ed \u00e9isteachta, \u00f3
  mhiondeacrachta\u00ed le gn\u00e1thchaint n\u00f3 minic\u00edochta\u00ed fuaime
  a chloiste\u00e1il go hollbhodhaire. Is f\u00e9idir le go leor daoine le lag\u00fa
  \u00e9isteachta beola a l\u00e9amh; \u00fas\u00e1ideann daoine ar leith \u00e1iseanna
  \u00e9isteachta agus daoine eile taca\u00edocht amhairc (cos\u00fail le t\u00e9acsf\u00f3in
  n\u00f3 seirbh\u00eds\u00ed fortheideal\u00fa f\u00edor-ama n\u00f3 seirbh\u00eds\u00ed
  iompair f\u00edst\u00e9ipe); b''fh\u00e9idir go mbeadh teangair\u00ed teanga comhartha\u00edochta
  ag teast\u00e1il \u00f3 dhaoine eile.\\n\\nIs f\u00e9idir le comhlacht poibl\u00ed
  sin a bhaint amach tr\u00ed:\\n\\n* Triail a bhaint as an raon form\u00e1id\u00ed
  is f\u00e9idir a \u00fas\u00e1id ionas go mbeadh rochtain ag daoine faoi lag\u00fa
  \u00e9isteachta ar chumars\u00e1id \u00f3 bh\u00e9al (f\u00e9ach sampla\u00ed th\u00edos);\\n*
  N\u00f3sanna imeachta a bhun\u00fa chun iarratais a phr\u00f3ise\u00e1il d''fhorm\u00e1id\u00ed
  inrochtana is f\u00e9idir a chur ar f\u00e1il chomh fada is at\u00e1 sin ind\u00e9anta,
  lena n-\u00e1ir\u00edtear deis cumars\u00e1ide leis an tomhalt\u00f3ir a chur ar
  f\u00e1il (ba cheart go mbeadh baill foirne \u00e1bhartha ar an eolas faoi na n\u00f3sanna
  imeachta sin);\\n* N\u00f3sanna imeachta a bhun\u00fa chun form\u00e1id\u00ed inrochtana
  a fh\u00e1il n\u00f3 a chur ar f\u00e1il;\\n* An fhorm\u00e1id at\u00e1 ag teast\u00e1il
  \u00f3n duine, a bhfuil lag\u00fa \u00e9isteachta aige n\u00f3 aici agus at\u00e1
  ag d\u00e9anamh an iarratais, a fh\u00e1il amach;\\n* Cinneadh a dh\u00e9anamh ar
  an bpraitici\u00falacht a bhaineann leis an bhfoirm taca\u00edochta a iarrtar a
  chur ar f\u00e1il, laistigh de chomhth\u00e9acsanna agus creatlaigh ama cumars\u00e1ide
  ar leith.\\n\\nBa ch\u00f3ir do chomhlachta\u00ed poibl\u00ed na nithe seo a leanas
  a mheas freisin:\\n\\n* Iad f\u00e9in a chur ar an eolas faoi na riachtanais a bh\u00edonn
  ag daoine le lag\u00fa \u00e9isteachta;\\n* Forbairt ar leaganacha scr\u00edofa
  cumars\u00e1ide \u00f3 bh\u00e9al, cos\u00fail le treoirl\u00ednte n\u00f3 Ceisteanna
  Coitianta;\\n* Cumars\u00e1id leictreonach aon-treo n\u00f3 dh\u00e1-threo le baill
  den phobal a shol\u00e1thar tr\u00ed r\u00edomhphost, t\u00e9acs SMS n\u00f3 teicneola\u00edochta\u00ed
  eile teachtaireachta;\\n* T\u00e9acsf\u00f3in n\u00f3 f\u00f3in f\u00edse a shol\u00e1thar;\\n*
  L\u00faba ionducht\u00fach\u00e1in a shuite\u00e1il i seomra\u00ed f\u00e1iltithe
  n\u00f3 seomra\u00ed feithimh agus i seomra cruinnithe amh\u00e1in ar a laghad;\\n*
  Teangair\u00ed teanga comhartha\u00edochta na h\u00c9ireann a shol\u00e1thar agus,
  n\u00f3 fortheideal\u00fa f\u00edorama d''ollchomhairli\u00fach\u00e1in phoibl\u00ed;\\n*
  \u00das\u00e1id a bhaint as t\u00e9acs tuairisci\u00fail le haghaidh f\u00edst\u00e9ipeanna
  f\u00f3gra\u00edochta agus cur i l\u00e1thair scann\u00e1na\u00edochta;\\n\\n* Foirmeacha
  eile taca\u00edochta a thairiscint murar f\u00e9idir an fhoirm iarrtha a shol\u00e1thar,
  \u00e1it ar f\u00e9idir sin a dh\u00e9anamh n\u00f3 a bhfuil sin praitici\u00fail;\\n*
  Monat\u00f3ireacht a dh\u00e9anamh ar iarratais maidir le form\u00e1id\u00ed a bhfuil
  rochtain orthu d''fhonn bun\u00fas a thabhairt do phlean\u00e1il rochtana sa todhcha\u00ed.\\n\\nAlt
  28 (1)(b)\\n\\nCeangla\u00edtear ar gach comhlacht poibl\u00ed, a mh\u00e9id is
  ind\u00e9anta, a chinnti\u00fa go bhfuil faisn\u00e9is agus cumars\u00e1id scr\u00edofa
  a chuireann s\u00e9 ar f\u00e1il don phobal curtha in i\u00fal i bhform\u00e1id
  inrochtana, nuair a iarrann daoine faoi lag\u00fa amhairc a leith\u00e9id.\\n\\nIs
  f\u00e9idir go mbainfeadh lag\u00fa amhairc le radharc doil\u00e9ir n\u00f3 g\u00e9ar-\u00e9agumasach
  chun an difr\u00edocht idir solas agus dorchadas a aithint. Is f\u00e9idir go mbainfeadh
  daoine faoi lag\u00fa amhairc \u00fas\u00e1id uaireanta as cl\u00f3 m\u00f3r, codarsnacht
  ard, clost\u00e9ip n\u00f3 doicim\u00e9id i bhform\u00e1id\u00ed Braille.\\n\\nIs
  f\u00e9idir nach dt\u00f3gfadh s\u00e9 r\u00f3fhada form\u00e1id\u00ed inrochtana
  a chur ar f\u00e1il int\u00ed, agus go mbeadh s\u00e9 s\u00e1ch \u00e9asca \u00e9
  a dh\u00e9anamh, m.sh. leagan de dhoicim\u00e9id \u00e1irithe i gcl\u00f3 m\u00f3r
  n\u00f3 b''fh\u00e9idir t\u00e9acs a at\u00e1irgeadh i mBraille. Sa dara ch\u00e1s,
  mura bhfuil aon \u00e1iseanna n\u00f3 saineolas le f\u00e1il int\u00ed, is f\u00e9idir
  go gcaithf\u00ed an tseirbh\u00eds a fh\u00e1il ar conradh \u00f3n bhfoinse iomchu\u00ed
  agus am a chead\u00fa chun \u00e9 a chur ar f\u00e1il.\\n\\nIs f\u00e9idir le comhlacht
  poibl\u00ed \u00e9 sin a bhaint amach tr\u00ed:\\n\\n* Triail a bhaint as an raon
  form\u00e1id\u00ed is f\u00e9idir a \u00fas\u00e1id chomh fada is at\u00e1 s\u00e9
  sin ind\u00e9anta ionas go mbeadh cumars\u00e1id scr\u00edofa inrochtana do dhaoine
  faoi lag\u00fa amhairc (f\u00e9ach sampla\u00ed th\u00edos);\\n* N\u00f3sanna imeachta
  a bhun\u00fa chun form\u00e1id\u00ed inrochtana a fh\u00e1il n\u00f3 a chur ar f\u00e1il;\\n*
  N\u00f3sanna imeachta a bhun\u00fa chun iarratais a phr\u00f3ise\u00e1il d''fhorm\u00e1id\u00ed
  inrochtana is f\u00e9idir a chur ar f\u00e1il chomh fada is at\u00e1 sin ind\u00e9anta  lena
  n-\u00e1ir\u00edtear deis cumars\u00e1ide leis an tomhalt\u00f3ir a chur ar f\u00e1il.
  Ba cheart go mbeadh baill foirne \u00e1bhartha ar an eolas faoi na n\u00f3sanna
  imeachta sin;\\n* An fhorm\u00e1id at\u00e1 ag teast\u00e1il \u00f3n duine a bhfuil
  lag\u00fa amhairc aige n\u00f3 aici agus at\u00e1 ag d\u00e9anamh an iarratais a
  fh\u00e1il amach;\\n* Cinneadh a dh\u00e9anamh ar an bpraitici\u00falacht a bhaineann
  le sol\u00e1thar na foirme taca\u00edochta a iarrtar, laistigh de chomhth\u00e9acsanna
  agus creatlaigh ama cumars\u00e1ide ar leith.\\n\\nBa ch\u00f3ir do chomhlachta\u00ed
  poibl\u00ed na nithe seo a leanas a mheas freisin:\\n\\n* Faisn\u00e9is a shol\u00e1thar
  i bhform\u00e1id\u00ed inrochtana, cos\u00fail le:\\n\\n- Cl\u00f3 M\u00f3r;\\n\\n-
  Braille;\\n\\n- Cumars\u00e1id leictreonach ar f\u00e9idir rochtain a fh\u00e1il
  uirthi le teicneola\u00edocht oiri\u00fanaitheach;\\n\\n- Clost\u00e9ipeanna\\n\\n(Tabhair
  faoi deara: Sol\u00e1thar clost\u00e9ipeanna do dhaoine a bhfuil lag\u00fa amhairc
  orthu. Nuair at\u00e1 cinneadh \u00e1 dh\u00e9anamh ar an bpraitici\u00falacht a
  bhaineann le form\u00e1id clost\u00e9ipe dhoicim\u00e9id ar leith a chur le ch\u00e9ile,
  \u00e1fach, t\u00e1 s\u00e9 t\u00e1bhachtach na nithe seo a leanas a chur san \u00e1ireamh:
  (a) go bhfuil teorann leis an gcumas at\u00e1 ag duine chun faisn\u00e9is chluastuisceana
  a sh\u00fa agus (b) nach n-oibr\u00edonn faisn\u00e9is ar leith ar t\u00e9ip (eolair\u00ed
  m\u00f3ra n\u00f3 doicim\u00e9id theicni\u00fala ina bhfuil go leor crostagairt\u00ed,
  mar shampla). I gc\u00e1s doicim\u00e9id at\u00e1 n\u00edos m\u00f3 agus n\u00edos
  casta, d''fh\u00e9adfa\u00ed smaoineamh ar th\u00e9ipeanna achoimreacha n\u00f3
  comhairli\u00fach\u00e1n duine ar dhuine n\u00f3 comhairli\u00fach\u00e1n ar an
  bhf\u00f3n.);\\n\\n* M\u00e1s f\u00e9idir n\u00f3 m\u00e1s ind\u00e9anta, foirmeacha
  malartacha taca\u00edochta a thairiscint murar f\u00e9idir an fhoirm a iarrtar a
  chur ar f\u00e1il;\\n* Monat\u00f3ireacht a dh\u00e9anamh ar iarratais ar fhorm\u00e1id\u00ed
  inrochtana chun bun\u00fas a thabhairt do phlean\u00e1il rochtana sa todhcha\u00ed.\\n\\nAlt
  28 (2)\\n\\nNuair a dh\u00e9anann comhlacht poibl\u00ed cumars\u00e1id leis an bpobal
  tr\u00ed fhorm\u00e1id leictreonach n\u00ed m\u00f3r d\u00f3 a chinnti\u00fa, a
  mh\u00e9id is ind\u00e9anta, go bhfuil rochtain ag duine faoi lag\u00fa amhairc
  at\u00e1 ag baint \u00fas\u00e1ide as teicneola\u00edocht oiri\u00fanaitheach ar
  \u00e1bhair na gcumars\u00e1id\u00ed. I measc na teicneola\u00edochta sin \u00e1ir\u00edtear
  l\u00e9itheoir\u00ed sc\u00e1ile\u00e1in, gl\u00e9asanna aschuir Braille agus bogearra
  formh\u00e9adaithe sc\u00e1ile\u00e1in. Tugtar sainmh\u00edni\u00fa ar lag\u00fa
  amhairc faoi alt 28(1)(b) thuas.\\n\\nTugtar sainmh\u00edni\u00fa ar lag\u00fa amhairc
  faoi alt 28(1)(b) thuas.\\n\\nIs f\u00e9idir le comhlacht poibl\u00ed \u00e9 sin
  a bhaint amach tr\u00ed:\\n\\n* An m\u00e9id at\u00e1 i gceist le rochtain ar chumars\u00e1id
  leictreonach a fh\u00e1il amach agus tuiscint a fh\u00e1il ar riachtanais na ndaoine
  a \u00fas\u00e1ideann teicneola\u00edocht oiri\u00fanaitheach;\\n* Athbhreithni\u00fa
  a dh\u00e9anamh ar chleachtais reatha do chumars\u00e1id leictreonach i dt\u00e9arma\u00ed
  inrochtaineachta i gcomhth\u00e9acs treoirl\u00ednte agus caighde\u00e1in iomchu\u00ed,
  m.sh.\\n\\n* Treoirl\u00ednte Inrochtaineachta Theicneola\u00edocht na Faisn\u00e9ise
  an \u00dadar\u00e1is N\u00e1isi\u00fanta Mh\u00edchumais do gach r\u00edomhaire,
  bothanna eolais, seirbh\u00eds\u00ed idirghn\u00edomhach le tosach Theicneola\u00edocht
  Faisn\u00e9ise Chumars\u00e1ide (mar shampla foirmeacha gr\u00e9as\u00e1in de chuid
  seirbh\u00edse ar-l\u00edne na gCoimisn\u00e9ir\u00ed Ioncaim, innill do v\u00f3t\u00e1il
  leictreonach), r\u00edomhphost agus bogearra\u00ed eile feidhme agus Teirmin\u00e9il
  Rochtana Phoibl\u00ed eile a \u00fas\u00e1ideann an pobal (t\u00e9igh i gcomhairle
  le http://accessit.nda.ie);\\n* Comhfhoirmeacht dh\u00fabailte leibh\u00e9il A le
  Treoirl\u00ednte Inrochtaineachta \u00c1bhair Ghr\u00e9as\u00e1in (WCAG) de chuid
  an Tionscnamh um Inrochtaineacht Gr\u00e9as\u00e1in (WAI), t\u00e9igh i gcomhairle
  le http://w3.org/WAI; 1\\n* Plean\u00e1il lena chinnti\u00fa go gcuirtear gach cumars\u00e1id
  den s\u00f3rt sin ar f\u00e1il, a mh\u00e9id is ind\u00e9anta, i bhform\u00e1id
  a bhfuil rochtain uirthi ag daoine faoi lag\u00fa amhairc a \u00fas\u00e1ideann
  teicneola\u00edocht oiri\u00fanaitheach cos\u00fail le, m.sh., l\u00e9itheoir\u00ed
  sc\u00e1ile\u00e1in n\u00f3 brabhs\u00e1laithe labhartha, agus araile, de r\u00e9ir
  mar is cu\u00ed.\\n\\nB''fh\u00e9idir go mbeadh s\u00e9 seo a leanas \u00fas\u00e1ideach
  do chomhlachta\u00ed poibl\u00ed agus a bhfuil le d\u00e9anamh \u00e1 mheas acu:\\n\\n*
  Is sampla \u00fas\u00e1ideach \u00e9 l\u00e1ithre\u00e1n gr\u00e9as\u00e1in Oasis
  (Online Access to Services, Information and Support), www.oasis.gov.ie, a d''fhorbair
  Comhairle, maidir leis an gcaoi ar f\u00e9idir rochtain a chur ar f\u00e1il d''\u00e1bhair
  chumars\u00e1id\u00ed leictreonacha do dhuine faoi lag\u00fa amhairc a bhfuil f\u00e1il
  aige n\u00f3 aici ar theicneola\u00edocht oiri\u00fanaitheach;\\n* A bheith ar an
  airdeall faoi theicneola\u00edochta\u00ed nua agus f\u00fathu si\u00fad at\u00e1
  ag teacht chun cinn (cos\u00fail le teicneola\u00edocht ch\u00e1rta cliste agus
  \u00fas\u00e1id cur s\u00edos cluas\u00e9isteachta do Theilif\u00eds Dhigiteach)
  agus an cumas at\u00e1 acu bealach cumars\u00e1ide inrochtana a chur ar f\u00e1il
  do dhuine le m\u00edchumas amhairc.\\n\\nAlt 28 (3)\\n\\nN\u00ed m\u00f3r do gach
  comhlacht poibl\u00ed a chinnti\u00fa, a mh\u00e9id is ind\u00e9anta, go gcuirtear
  an faisn\u00e9is a fhoils\u00edonn s\u00e9, a bhaineann go d\u00edreach le daoine
  faoi mh\u00edchumas intleacht\u00fail, ar f\u00e1il d\u00f3ibh i dteanga shoil\u00e9ir
  a thuigeann siad gan str\u00f3.\\n\\nIs minic a thagra\u00edtear d\u00f3 seo mar
  fhorm\u00e1id at\u00e1 \\\"\u00e9asca le l\u00e9amh\\\", ach go ginear\u00e1lta\\n\\n1
  Deir ''New Connections - A Strategy to realise the potential of the Information
  Society'' de chuid Roinn an Taoisigh go ''n-\u00e9ileofar ar ghach l\u00e1ithre\u00e1n
  gr\u00e9as\u00e1in phoibl\u00ed a bheith ag aont\u00fa le WAI (leibh\u00e9al 2)
  roimh dheireadh 2001''.\\n\\n22\\n\\nbaineann s\u00e9 le faisn\u00e9is a th\u00e1irgeadh
  ar na beala\u00ed seo a leanas:\\n\\n* Form\u00e1id i mb\u00e9arla simpl\u00ed (teanga
  shoil\u00e9ir shimpl\u00ed);\\n* Abairt\u00ed gearra, ag seachaint b\u00e9arlagair,
  leaganacha cainte agus focail chasta; agus, n\u00f3\\n* Achoimr\u00ed at\u00e1 \u00e9asca
  le l\u00e9amh a bhaineann leas as l\u00e9ar\u00e1id\u00ed chun tuiscint a \u00e9asc\u00fa.\\n\\nIs
  f\u00e9idir le comhlacht poibl\u00ed sin a bhaint amach tr\u00ed:\\n\\n* Dul i gcomhairle
  le comhlachta\u00ed iomchu\u00ed maidir le c\u00e9ard at\u00e1 i gceist le faisn\u00e9is
  foilsithe a th\u00e1irgeadh i bhform\u00e1id\u00ed den s\u00f3rt sin;\\n* Athbhreithni\u00fa
  a dh\u00e9anamh ar an raon faisn\u00e9ise foilsithe ag an gcomhlacht chun na foilseach\u00e1in
  a thagann laistigh den chatag\u00f3ir \u00e1bhartha a aithint;\\n* \u00c9ileamh
  d\u00f3ch\u00fail ar fhaisn\u00e9is den s\u00f3rt sin a mheas i gcomhairli\u00fach\u00e1n
  nuair is cu\u00ed;\\n* N\u00f3sanna imeachta agus socruithe inmhe\u00e1nacha le
  gn\u00edomhaireachta\u00ed seachtracha a bhun\u00fa, nuair at\u00e1 s\u00e9 sin
  riachtanach, chun foilseach\u00e1in iomchu\u00ed a athr\u00fa go dt\u00ed form\u00e1id\u00ed
  at\u00e1 \u00e9asca le l\u00e9amh;\\n* N\u00f3sanna imeachta a bhun\u00fa chun freagairt
  ar iarratais ar fhorm\u00e1id\u00ed den s\u00f3rt sin lena n-\u00e1ir\u00edtear
  deiseanna chun cumars\u00e1id a dh\u00e9anamh leis an tomhalt\u00f3ir. Ba cheart
  go mbeadh baill foirne \u00e1bhartha ar an eolas faoi na n\u00f3sanna imeachta seo;\\n*
  Monat\u00f3ireacht a dh\u00e9anamh ar \u00e9ileamh ar fhorm\u00e1id\u00ed den s\u00f3rt
  sin chun bun\u00fas a thabhairt do phlean\u00e1il amach anseo.\\n\\nB''fh\u00e9idir
  go mbeadh s\u00e9 seo a leanas \u00fas\u00e1ideach do chomhlachta\u00ed poibl\u00ed
  agus a bhfuil le d\u00e9anamh \u00e1 mheas acu:\\n\\n* Is sampla \u00e9 an tEagr\u00e1n
  \u00c9asca le L\u00e9amh de Phlean Strait\u00e9iseach an \u00dadar\u00e1is N\u00e1isi\u00fanta
  Mh\u00edchumais 2003-2006 de leagan doicim\u00e9id oifigi\u00fail at\u00e1 \u00c9asca
  le L\u00e9amh;\\n* An foilseach\u00e1n de chuid an NDA ''First Steps in Producing
  Accessible Publications''.\\n\\nAguis\u00edn a hAon: Ailt i gCuid 3 den Acht um
  M\u00edchumas 2005\\n\\nRochtain ar sheirbh\u00eds\u00ed, etc.\\n\\n26 (1) I gc\u00e1s
  go sol\u00e1thra\u00edonn comhlacht poibl\u00ed seirbh\u00eds, d\u00e9anfaidh ceann
  an chomhlachta -\\n(a) m\u00e1s ind\u00e9anta agus m\u00e1s cu\u00ed, a chinnti\u00fa
  go nd\u00e9antar sol\u00e1thar na rochtana ar an tseirbh\u00eds ag daoine at\u00e1,
  agus daoine nach bhfuil, faoi mh\u00edchumas a chomhth\u00e1th\u00fa,\\n(b) m\u00e1s
  ind\u00e9anta agus m\u00e1s cu\u00ed, socr\u00fa le haghaidh c\u00fanaimh, m\u00e1
  iarrtar \u00e9, do dhaoine at\u00e1 faoi mh\u00edchumas le linn d\u00f3ibh rochtain
  a fh\u00e1il ar an tseirbh\u00eds m\u00e1s deimhin leis an gceann gur g\u00e1 an
  socr\u00fa sin chun a chinnti\u00fa go gcomhl\u00edontar m\u00edr (a), agus\\n(c)
  m\u00e1s cu\u00ed, a chinnti\u00fa go bhfuil daoine ar f\u00e1il a bhfuil saineolas
  agus scileanna cu\u00ed acu chun comhairle a thabhairt don chomhlacht maidir leis
  an modh chun a chinnti\u00fa go bhfuil an tseirbh\u00eds a shol\u00e1thra\u00edonn
