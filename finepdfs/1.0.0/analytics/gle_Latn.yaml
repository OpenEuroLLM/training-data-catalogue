  i gc\u00e1s(anna) teagaisc duine le duine, meant\u00f3ireachta, c\u00f3itse\u00e1la.\\n\\n*
  Riosca ''d\u00edobh\u00e1la'' de bharr ball foirne an ionaid ag d\u00e9anamh cumars\u00e1ide
