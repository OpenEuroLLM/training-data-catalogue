  psychick\u00fa identitu, ment\u00e1lnu identitu, ekonomick\u00fa identitu, kult\u00farnu
  identitu alebo soci\u00e1lnu identitu. Pokia\u013e jedna zmluvn\u00e1 strana zdie\u013ea
  ak\u00e9ko\u013evek osobn\u00e9 \u00fadaje s druhou zmluvnou stranou, t\u00e1to
  druh\u00e1 zmluvn\u00e1 strana je povinn\u00e1 tieto osobn\u00e9 \u00fadaje spracova\u0165
  v s\u00falade s pr\u00edslu\u0161n\u00fdmi pr\u00e1vnymi predpismi, vr\u00e1tane
  V\u0161eobecn\u00e9ho nariadenia na ochranu osobn\u00fdch \u00fadajov (Nariadenie
  E\u00da 2016/679), z\u00e1konn\u00edmi, nariadeniami, pokynmi a \u0161tandardmi,
  a to vzdy v ich aktu\u00e1lnom znen\u00ed. Zmluvn\u00e1 strana je povinn\u00e1 zabezpe\u010di\u0165,
