  nov\u00fd proces priamo s\u00favis\u00ed so zmenami na z\u00e1pise o stretnut\u00ed.
  Od nov\u00e9ho s\u00fa\u0165a\u017en\u00e9ho ro\u010dn\u00edku bude mo\u017en\u00e9
