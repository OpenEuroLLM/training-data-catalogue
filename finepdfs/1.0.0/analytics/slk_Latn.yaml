  osobn\u00fdch \u00fadajov, ktor\u00e9 s\u00fa s\u00fa\u010das\u0165ou zmluvy.\\n\\n12.
  Z\u00e1vere\u010dn\u00e9 ustanovenia\\n\\n12.1. Zmluva nadob\u00fada platnos\u0165
  d\u0148om jej podpisu opr\u00e1vnen\u00fdmi z\u00e1stupcami oboch zmluvn\u00fdch
  str\u00e1n a v pr\u00edpade, ak ide o zmluvu, ktor\u00e1 je povinne zverej\u0148ovanou
  zmluvou\\n\\nv zmysle ustanoven\u00ed \u00a7 5a ods. 1 z\u00e1kona \u010d. 211/2000
