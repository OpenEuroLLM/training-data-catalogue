sample: '["\"Stredisko slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam
  Petr\u017ealka Bohrova 1, 851 01 Bratislava\\n\\nMateri\u00e1l na rokovanie miestnej
  rady d\u0148a 18.septembra 2012\\n\\nMateri\u00e1l \u010d. 194/2012\\n\\nRozvojov\u00fd
  pl\u00e1n Strediska slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam
  Petr\u017ealka\\n\\nPredkladate\u013e:\\n\\nMateri\u00e1l obsahuje:\\n\\nIng. Milan
  Lezo riadite\u013e SS\u0160a\u0160ZP\\n\\nZodpovedn\u00fd:\\n\\nIng. Milan Lezo
  riadite\u013e SS\u0160a\u0160ZP\\n\\nSpracovate\u013e:\\n\\nIng. Milan Lezo, riadite\u013e
  SS\u0160a\u0160ZP p. Ladislav L\u00e1nyi, ved. T\u00da, SS\u0160a\u0160ZP\\n\\n1.
  N\u00e1vrh uznesenia\\n2. D\u00f4vodov\u00e1 spr\u00e1va\\n3. Vlastn\u00fd materi\u00e1l\\n\\nI.
  N\u00e1vrh uznesenia:\\n\\nMiestna rada mestskej \u010dasti Bratislava-Petr\u017ealka
  o d p o r \u00fa \u010d a\\n\\nMiestnemu zastupite\u013estvu mestskej \u010dasti
  Bratislava-Petr\u017ealka zobra\u0165 na vedomie Rozvojov\u00fd pl\u00e1n Strediska
  slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam Petr\u017ealka.\\n\\nII.
  D\u00f4vodov\u00e1 spr\u00e1va\\n\\nMateri\u00e1l: Rozvojov\u00fd pl\u00e1n Strediska
  slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam Petr\u017ealka sa
  predklad\u00e1 na rokovanie Miestnej rady mestskej \u010dasti Bratislava-Petr\u017ealka
  v zmysle po\u017eiadaviek poslancov, predlo\u017een\u00fd na rokovan\u00ed miestneho
  zastupite\u013estva d\u0148a 26.6.2012 v s\u00favislosti s prerokovan\u00edm z\u00e1vere\u010dn\u00e9ho
  \u00fa\u010dtu.\\n\\nIII. Rozvojov\u00fd pl\u00e1n Strediska slu\u017eieb \u0161kol\u00e1m
  a \u0161kolsk\u00fdm zariadeniam Petr\u017ealka\\n\\n1. \u00davod\\n\\nStredisko
  slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam Petr\u017ealka bolo
  zriaden\u00e9 Miestnym zastupite\u013estvom mestskej \u010dasti Bratislava - Petr\u017ealka
  d\u0148om 1.7.2002 pod\u013ea \u00a7 15 ods. 2 p\u00edsm. ch) z\u00e1kona \u010d.
  377/1990 Zb. o hlavnom meste SR Bratislave v znen\u00ed neskor\u0161\u00edch predpisov,
  Stredisko slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam Petr\u017ealka
  (\u010falej len \u201eSS\u0160a\u0160ZP\\\") ako stredisko pre poskytovanie odbornej,
  technickej a materi\u00e1lnej pomoci \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam.
  \u0160tat\u00fatom SS\u0160a\u0160ZP s\u00fa ur\u010den\u00e9 jeho kompetencie,
  organiz\u00e1cia, p\u00f4sobnos\u0165, predmet a z\u00e1sady jeho \u010dinnosti.\\n\\nStredisko
  slu\u017eieb \u0161kol\u00e1m a \u0161kolsk\u00fdm zariadeniam Petr\u017ealka je
  rozpo\u010dtovou organiz\u00e1ciou, ktor\u00e1 je napojen\u00e1 svojimi pr\u00edjmami
  a v\u00fddavkami na rozpo\u010det zria\u010fovate\u013ea, Mestskej \u010dasti Bratislava
  \u2013 Petr\u017ealka. Hlavnou \u00falohou SS\u0160a\u0160ZP je zabezpe\u010dova\u0165
  opravy a \u00fadr\u017ebu pre \u0161koly a \u0161kolsk\u00e9 zariadenia v zria\u010fovate\u013eskej
  p\u00f4sobnosti Mestskej \u010dasti Bratislava\u2013Petr\u017ealka pracovn\u00edkmi
  \u00faseku \u00fadr\u017eby, pr\u00edpadne dod\u00e1vate\u013esk\u00fdm sp\u00f4sobom.
  Organiza\u010dnou s\u00fa\u010das\u0165ou SS\u0160a\u0160ZP je t. \u010d. 19 matersk\u00fdch
  \u0161k\u00f4l a 19 \u0161kolsk\u00fdch jed\u00e1ln\u00ed pri matersk\u00fdch \u0161kol\u00e1ch,
  ktor\u00e9 s\u00fa preddavkov\u00fdmi zariadeniami a hospod\u00e1ria s pridelen\u00fdm
  preddavkom. Pre tieto \u0161koly a \u0161kolsk\u00e9 zariadenia zabezpe\u010duje
  SS\u0160a\u0160ZP kompletn\u00fa person\u00e1lnu a mzdov\u00fa agendu, v\u0161etky
  ekonomick\u00e9 \u010dinnosti, obstar\u00e1vanie tovarov, slu\u017eieb a pr\u00e1c,
  energetick\u00e9 a vodn\u00e9 hospod\u00e1rstvo, agendu BOZP a PO, slu\u017eby registrat\u00farneho
  strediska, komplexn\u00fa bytov\u00fa agendu slu\u017eobn\u00fdch bytov a komplexn\u00e9
  technick\u00e9 \u010dinnosti vr\u00e1tane technick\u00e9ho dozoru nad realizovan\u00fdmi
  pr\u00e1cami a dod\u00e1vkami na objektoch matersk\u00fdch aj z\u00e1kladn\u00fdch
  \u0161k\u00f4l .\\n\\n2. Zhodnotenie predch\u00e1dzaj\u00faceho stavu\\n\\n2.1 Vecn\u00e9
  plnenie \u00faloh za predch\u00e1dzaj\u00face obdobie\\n\\nV obdob\u00ed rokov 2005
  a\u017e 2011 bolo prvoradou \u00falohou SS\u0160a\u0160ZP realizova\u0165 postupn\u00fdmi
  opatreniami zni\u017eovanie energetick\u00fdch n\u00e1kladov na \u00fastredn\u00e9
  vykurovanie objektov matersk\u00fdch \u0161k\u00f4l. V roku 2005 bol vo v\u0161etk\u00fdch
  M\u0160 realizovan\u00fd \u00fatlmov\u00fd re\u017eim vykurovania s cie\u013eom
  regulova\u0165 teplotu M\u0160 v \u010dase ke\u010f nie je M\u0160 v prev\u00e1dzke
  (sobota, nede\u013ea a pr\u00e1zdniny). T\u00fdmto opatren\u00edm sa s\u00edce dosiahla
  \u00faspora ( v roku 2006 8,8 % a v roku 2007 a\u017e 13,6 % oproti roku 2005) av\u0161ak
  na optim\u00e1lne vyu\u017eitie \u00fatlmov\u00fdch re\u017eimov bolo nutn\u00e9
  zrealizova\u0165 osamostatnenie vykurovania \u0161koln\u00edckych bytov od vykurovania
  objektu M\u0160. K osamostatneniu vykurovania \u0161koln\u00edckych bytov od vykurovania
  objektu M\u0160 do\u0161lo v rokoch 2008 a\u017e 2010 (v roku 2008 4 byty, 2009
  a 2010 po 7 bytov) \u010do prinieslo \u010fal\u0161iu \u00fasporu cca 15 %. V rokoch
  2009 a 2010 boli na v\u0161etk\u00fdch M\u0160 vymenen\u00e9 okn\u00e1 s n\u00e1slednou
  \u00fasporou tepelnej energie cca 27 %. Na z\u00e1klade v\u0161etk\u00fdch t\u00fdchto
  opatren\u00ed bola v roku 2011 dosiahnut\u00e1 celkov\u00e1 \u00faspora tepelnej
  energie na \u00fastredn\u00e9 vykurovanie vy\u0161e 47,1 %  oproti roku 2005.\\n\\nZ
  oh\u013eadom na vy\u0161\u0161ie uveden\u00fa \u00fasporu, sa v roku 2011 aj pri
  kr\u00e1ten\u00ed rozpo\u010dtu be\u017en\u00fdch v\u00fddavkov oproti roku 2010
  s  oh\u013eadom na predpokladan\u00e9 \u00faspory,  vytvorili podmienky na realiz\u00e1ciu
  nasledovn\u00fdch be\u017en\u00fdch opr\u00e1v a \u00fadr\u017eby.\\n\\n1. Obnova
  malieb vybran\u00fdch priestorov v M\u0160 Rovniankova, M\u0160 Pifflova, M\u0160
  \u0160ustekova, M\u0160 Lachova, M\u0160 Macharova, M\u0160 Hol\u00ed\u010dska,
  M\u0160 \u0160ev\u010denkova a M\u0160 Jankolova v celkovej hodnote  14 995,04 \u20ac.\\n2.
  Obnova podlahov\u00fdch kryt\u00edn PVC vybran\u00fdch priestorov v M\u0160 Pifflova,
  M\u0160 Rovniankova, M\u0160 Haanova a M\u0160 Ilju\u0161inova v celkovej hodnote  11
  222,17 \u20ac\\n3. Oprava schodov vonkaj\u0161ej terasy v M\u0160 Gessayova v hodnote  120
  \u20ac.\\n\\n4. Oprava vonkaj\u0161ieho chodn\u00edka v are\u00e1li M\u0160 Bohrova
  v hodnote 355 \u20ac.\\n5. Oprava terasy v M\u0160 Lietavsk\u00e1 v hodnote 1 049,10
  \u20ac.\\n6. Obnova hygienick\u00fdch zariaden\u00ed v M\u0160 Pifflova a M\u0160
  Hol\u00ed\u010dska v celkovej hodnote 2 774,50 \u20ac.\\n7. Oprava \u0161t\u00edtovej
  steny na M\u0160 R\u00f6ntgenova v hodnote 3 480 \u20ac.\\n\\n2.2 Finan\u010dn\u00e9
  hodnotenie za predch\u00e1dzaj\u00face obdobie vr\u00e1tane v\u00fdchodiskovej finan\u010dnej
  situ\u00e1cie\\n\\n- Mzdov\u00e9 n\u00e1klady na platy zamestnancov v minulom obdob\u00ed
  ako i v s\u00fa\u010dasnosti pokr\u00fdvaj\u00fa z\u00e1kladn\u00e9 platov\u00e9
  n\u00e1roky v zmysle platn\u00fdch predpisov. Tento stav v\u0161ak nezoh\u013ead\u0148uje
  adekv\u00e1tne finan\u010dn\u00e9 ocenenie realizovan\u00fdch aktiv\u00edt a prezent\u00e1ciu
  matersk\u00fdch \u0161k\u00f4l. Platov\u00e9 n\u00e1le\u017eitosti nepedagogick\u00fdch
  zamestnancov s\u00fa podhodnoten\u00e9 a postupne nast\u00e1va probl\u00e9m obsadzovania
  t\u00fdchto pracovn\u00fdch poz\u00edcii.\\n- Be\u017en\u00e9 v\u00fddavky v minulom
  obdob\u00ed ako i v s\u00fa\u010dasnosti pokr\u00fdvaj\u00fa potrebn\u00e9 n\u00e1klady
  na \u00fahradu energii, vodn\u00e9 a sto\u010dn\u00e9 a zr\u00e1\u017ekov\u00e1
  voda. Tieto n\u00e1klady sa ro\u010dne pohybuj\u00fa vo v\u00fd\u0161ke cca 60 %
  be\u017en\u00e9ho rozpo\u010dtu matersk\u00fdch \u0161k\u00f4l na tovary a slu\u017eby.
  Okrem toho sa z be\u017en\u00fdch n\u00e1kladov zabezpe\u010duj\u00fa ostatn\u00e9
  slu\u017eby ako napr. deratiz\u00e1cie a dezinsekcie, odborn\u00e9 prehliadky elektroin\u0161tal\u00e1cii,
  bleskozvodov, plynoin\u0161tal\u00e1cii, hydrantov a hasiacich pr\u00edstrojov,
  po\u0161tovn\u00e9 a telekomunika\u010dn\u00e9 slu\u017eby a OLO. Tieto n\u00e1klady
  na slu\u017eby predstavuj\u00fa cca 20 % be\u017en\u00e9ho rozpo\u010dtu. N\u00e1klady
  na zabezpe\u010dovanie be\u017enej \u00fadr\u017eby a opr\u00e1v dod\u00e1vate\u013esk\u00fdm
  sp\u00f4sobom sa pohybuj\u00fa na \u00farovni cca 5 % be\u017en\u00e9ho rozpo\u010dtu  a
  n\u00e1kup in\u0161tala\u010dn\u00e9ho a stavebn\u00e9ho materi\u00e1lu pre zabezpe\u010dovanie
  \u00fadr\u017eby objektov vlastn\u00fdmi \u00fadr\u017eb\u00e1rmi vo v\u00fd\u0161ke
  cca 3 %.\\nZ h\u013eadiska v\u00fdchodiskovej finan\u010dnej situ\u00e1cie pre obdobie
  roku 2012 je stav na \u00farovni roku 2011 so zoh\u013eadnen\u00edm mzdov\u00fdch
  postupov a n\u00e1rastu po\u010dtu u\u010diteliek v novootvoren\u00fdch dvoch triedach,
  nezoh\u013ead\u0148uje v\u0161ak n\u00e1rast mzdov\u00fdch prostriedkov za z\u00edskan\u00e9
  kreditov\u00e9 pr\u00edplatky pedagogick\u00fdch zamestnancov v priebehu roka v
  zmysle z\u00e1kona a n\u00e1klady na odchodn\u00e9 \u010do predstavuje schodok na
  osobn\u00fdch v\u00fddavkoch cca 18 000 \u20ac. Rozpo\u010det na be\u017en\u00e9
  v\u00fddavky v programe 5.1.1 Matersk\u00e9 \u0161koly bol v roku 2011 vo v\u00fd\u0161ke
  3 762 330 z toho na tovary a slu\u017eby 694 606 \u20ac a pre rok 2012  je vo v\u00fd\u0161ke
  3 797 434 \u20ac z toho na tovary a slu\u017eby 687 010 \u20ac.\\n\\n3. N\u00e1vrh
  predkladan\u00fdch opatren\u00ed\\n\\nNov\u00e9 rozvojov\u00e9 aktivity vr\u00e1tane
  \u010dasov\u00e9ho harmonogramu\\n\\n1. V priebehu rokov 2012 a\u017e 2014 sa podie\u013ea\u0165
  na zabezpe\u010den\u00ed interakt\u00edvnych tab\u00fal pre 16 matersk\u00fdch \u0161k\u00f4l
  v triede pred\u0161kol\u00e1kov s mo\u017enos\u0165ou vyu\u017eitia ich vo v\u00fdchovnovzdel\u00e1vacom
  procese. Je to modern\u00e1 pom\u00f4cka na zefekt\u00edvnenie v\u00fdchovnovzdel\u00e1vacieho
  procesu a prezent\u00e1ci\u00ed s d\u00f4kladn\u00fdm vyu\u017eit\u00edm IKT. Realiz\u00e1cia
  n\u00e1kupu je pl\u00e1novan\u00e1 ka\u017edoro\u010dne v   druhom \u0161tvr\u0165roku.
  V roku 2012 je pl\u00e1novan\u00fd n\u00e1kup 3 interakt\u00edvnych tab\u00fal,
  v roku 2013 6 interakt\u00edvnych tab\u00fal a v roku 2014 7 interakt\u00edvnych
  tab\u00fal.\\n2. Zabezpe\u010di\u0165 priebe\u017ene ka\u017ed\u00fd rok min. v
  2 matersk\u00fdch \u0161kol\u00e1ch zn\u00ed\u017eenie energetickej n\u00e1ro\u010dnosti
  pri spotrebe tepelnej energie, mont\u00e1\u017eou termoventilov na radi\u00e1tory
  materskej \u0161koly z d\u00f4vodu dosiahnutia rovnomern\u00e9ho vykurovania objektu.
  Term\u00edn realiz\u00e1cie je pl\u00e1novan\u00fd ka\u017edoro\u010dne v mesiaci
  j\u00fal a august.\\n3. Zabezpe\u010di\u0165 priebe\u017ene ka\u017ed\u00fd rok
  min. pre 3 \u0161kolsk\u00e9 jed\u00e1lne drvi\u010dky odpadu, z d\u00f4vodu zabezpe\u010denia
  dodr\u017eiavania hygienick\u00fdch predpisov pri likvid\u00e1cii potravin\u00e1rskeho
  odpadu stravovac\u00edch zariaden\u00ed. Realiz\u00e1cia n\u00e1kupu je predpokladan\u00e1
  ka\u017edoro\u010dne v tre\u0165om \u0161tvr\u0165roku.\\n\\n4. Vykona\u0165 pravideln\u00e9
  ro\u010dne v mesiaci december, anal\u00fdzu  previerok BOZP a hygienick\u00fdch
  kontrol. Na z\u00e1klade zisten\u00ed priebe\u017ene realizova\u0165 odstr\u00e1nenie
  nedostatkov vlastnou \u00fadr\u017ebou, resp. pl\u00e1nova\u0165 ich odstr\u00e1nenie
  v n\u00e1vrhoch rozpo\u010dtu.\\n5. Ro\u010dne vo dvoch \u0161kolsk\u00fdch jed\u00e1l\u0148ach
  zabezpe\u010di\u0165 obnovu v\u00fdpo\u010dtovej techniky s pripojen\u00edm na internet.
  V\u00fdpo\u010dtov\u00e1 technika je zastaran\u00e1 s pou\u017e\u00edvan\u00edm
  vy\u0161e 10 rokov a nesp\u013a\u0148a podmienky potrieb \u0160J ako i s\u00fa\u010dasnej
  nemo\u017enosti pripojenia na internet. Realiz\u00e1cia n\u00e1kupu je predpokladan\u00e1
  ka\u017edoro\u010dne v tre\u0165om \u0161tvr\u0165roku.\\n6. Zabezpe\u010di\u0165
  zjednodu\u0161enie vedenia \u0161kolskej agendy v\u0161etk\u00fdch matersk\u00fdch
  \u0161k\u00f4l zak\u00fapen\u00edm licencie \u0161pecializovan\u00e9ho programu
  e\u0160kola+eTla\u010div\u00e1. Tento program zjednodu\u0161uje evidenciu det\u00ed
  s priamym v\u00fdstupom na spracovanie a tla\u010denie ostatnej dokument\u00e1cie
  o die\u0165ati. Term\u00edn realiz\u00e1cie v druhom \u0161tvr\u0165roku 2012 a
  n\u00e1sledne ka\u017ed\u00fd rok obnova licencie..\\n7. Podporova\u0165 spolupr\u00e1cu
  a spolufinancovanie obnovy invent\u00e1ru, hern\u00fdch prvkov, obnovy hygienick\u00fdch
  zariaden\u00ed a \u00fapravy are\u00e1lov financovan\u00fdch z mimorozpo\u010dtov\u00fdch
  prostriedkov (z 2 % dan\u00ed, rodi\u010dovsk\u00e9ho zdru\u017eenia, projektov,
  grantov at\u010f.). Cie\u013eom je podpora aktiv\u00edt matersk\u00fdch \u0161k\u00f4l
  pri zve\u013ea\u010fovan\u00ed prostredia M\u0160 a obnove zastaran\u00e9ho invent\u00e1ru.\\n8.
  Postupn\u00e1 \u00faprava are\u00e1lov M\u0160 v oblasti opravy dreven\u00fdch posedov
  lavi\u010diek, opravy chodn\u00edkov, oplotenia, hern\u00fdch prvkov a dop\u013a\u0148ania
  pieskov\u00edsk. Viacer\u00e9 dreven\u00e9 posedy lavi\u010diek s\u00fa znehodnoten\u00e9
  a nefunk\u010dn\u00e9 \u010d\u00edm sa st\u00e1vaj\u00fa pre deti nebezpe\u010dn\u00e9,
  chodn\u00edky s\u00fa poru\u0161en\u00e9 \u010d\u00edm hroz\u00ed nebezpe\u010die
  \u00farazu, v pieskovisk\u00e1ch ch\u00fdba piesok \u010do je v rozpore s hygienick\u00fdmi
  opatreniami. Predpokladan\u00fd term\u00edn realiz\u00e1cie je pl\u00e1novan\u00fd
  ka\u017edoro\u010dne v mesiaci j\u00fan a\u017e august.\\n9. Zefekt\u00edvni\u0165
  spolupr\u00e1cu so z\u00e1kladn\u00fdmi \u0161kolami hlavne v oblasti pl\u00e1novania
  opr\u00e1v a rekon\u0161trukcii objektov pri spracov\u00e1van\u00ed n\u00e1vrhu
  rozpo\u010dtov z\u00e1kladn\u00fdch \u0161k\u00f4l. Term\u00edn plnenia je priebe\u017ene
  a hlavne pred pr\u00edpravou n\u00e1vrhu rozpo\u010dtu.\\n\\nFinan\u010dn\u00e9
  dopady uplatnenia nov\u00fdch aktiv\u00edt\\n\\n4. V\u00fdh\u013ead hospod\u00e1renia
  na nasleduj\u00face obdobie\\n\\nBe\u017en\u00e9 v\u00fddavky\\n\\nBe\u017en\u00fd
  rozpo\u010det SS\u0160a\u0160ZP na rok 2012 je vo v\u00fd\u0161ke 4 185 477 \u20ac,
  z toho na program 5.1.1 matersk\u00e9 \u0161koly 3 797 434 \u20ac. V\u00fddavky
  rozpo\u010dtu na tovary a slu\u017eby pre rok 2012 v programe 5.1.1 matersk\u00e9
  \u0161koly je vo v\u00fd\u0161ke 687 010 \u20ac.\\n\\nV\u00fdh\u013ead hospod\u00e1renia
  v nasleduj\u00facom obdob\u00ed vych\u00e1dza u\u017e z pop\u00edsan\u00e9ho stavu
  v bode 2.3 predmetn\u00e9ho materi\u00e1lu. V s\u00falade so z\u00e1konom \u010d.
  317/2009 Z. z. o pedagogick\u00fdch zamestnancoch a odborn\u00fdch zamestnancoch
  a o zmene doplnen\u00ed niektor\u00fdch z\u00e1konov v znen\u00ed z\u00e1konom \u010d.
  390/2011 Z. z. a v s\u00falade s vyhl\u00e1\u0161kou M\u0160 SR \u010d. 445/2009
  Z. z. o kontinu\u00e1lnom vzdel\u00e1van\u00ed, kreditoch a atest\u00e1ci\u00e1ch
  pedagogick\u00fdch a odborn\u00fdch zamestnancov sa predpoklad\u00e1 n\u00e1rast
  finan\u010dn\u00fdch n\u00e1kladov na osobn\u00e9 v\u00fddavky. \u010eal\u0161\u00ed
  n\u00e1rast v tejto oblasti sa predpoklad\u00e1 na vypl\u00e1canie odchodn\u00e9ho
  v s\u00favislosti s odchodom zamestnancov  do  d\u00f4chodku.    Rozhoduj\u00face   n\u00e1klady  na  tovaroch   a
  slu\u017eb\u00e1ch   sa predpokladaj\u00fa na financovanie energi\u00ed a slu\u017eieb
  s predpokladom pre rok 2012 a \u010fal\u0161ie obdobia vo v\u00fd\u0161ke cca 80
  % be\u017en\u00e9ho rozpo\u010dtu. Tieto n\u00e1klady z\u00e1visia od poveternostn\u00fdch
  podmienok a individu\u00e1lnych potrieb matersk\u00fdch \u0161k\u00f4l a \u0161kolsk\u00fdch
  jed\u00e1lni, napr. po\u010det det\u00ed, potreba uskuto\u010dnenia odborn\u00fdch
  prehliadok, odstra\u0148ovanie por\u00fach a hav\u00e1rii at\u010f.. \u010eal\u0161\u00edch
  cca 15 % be\u017en\u00e9ho rozpo\u010dtu predstavuj\u00fa materi\u00e1lov\u00e9
  n\u00e1klady, jedn\u00e1 sa hlavne o n\u00e1kup in\u0161tala\u010dn\u00e9ho a stavebn\u00e9ho
  materi\u00e1lu, kancel\u00e1rskych potrieb, hygienick\u00fdch potrieb a invent\u00e1ru.
  Z ost\u00e1vaj\u00facich cca 10 % be\u017en\u00e9ho rozpo\u010dtu, \u010do predstavuje
  cca 65 000 \u20ac sa realizuje be\u017en\u00e1 oprava a \u00fadr\u017eba, napr.
  obnova malieb a podlahov\u00fdch kryt\u00edn, mur\u00e1rske pr\u00e1ce obnova obkladov
  a dla\u017eieb. Vr\u00e1tane opr\u00e1v a \u00fadr\u017eby je realizovan\u00fd aj
  servis v\u00fdpo\u010dtovej techniky a opravy ve\u013ekokuchynsk\u00fdch zariaden\u00ed.
  V roku 2013 s oh\u013eadom na ekonomick\u00fa situ\u00e1ciu sa predpoklad\u00e1
  v\u00fd\u0161ka rozpo\u010dtu na \u00farovni roku 2012 resp. s mo\u017enos\u0165ou
  nav\u00fd\u0161enia rozpo\u010dtu o nav\u00fd\u0161en\u00e9 pr\u00edjmy \u010do
  by ur\u010dite pomohlo postupne rie\u0161i\u0165 probl\u00e9mov\u00e9 oblasti.\\n\\nPr\u00edjmy\\n\\nRozpo\u010det
  pr\u00edjmov na rok 2012 je 237 527 \u20ac a s\u00fa tvoren\u00e9 hlavne z pren\u00e1jmov
  bytov\u00fdch a nebytov\u00fdch priestorov vo v\u00fd\u0161ke  34 225 \u20ac a poplatkov
  za M\u0160 vo v\u00fd\u0161ke 188 875 \u20ac. Ostatn\u00e9 pr\u00edjmy s\u00fa vo
  v\u00fd\u0161ke 14 427 \u20ac. V druhom polroku je predpoklad zv\u00fd\u0161enia
  pr\u00edjmov o pren\u00e1jom \u010dasti priestorov objektu Fedinova 7 a poplatky
  za re\u017eijn\u00e9 n\u00e1klady za pr\u00edpravu stravy v celkovej v\u00fd\u0161ke
  cca 16 600 \u20ac. V roku 2013 je predpoklad celkov\u00fdch pr\u00edjmov vo v\u00fd\u0161ke
  284 920 \u20ac.\\n\\nZ\u00e1vere\u010dn\u00e9 zhodnotenie v\u00fdh\u013eadu hospod\u00e1renia\\n\\nZ
  oh\u013eadom na v\u00fdvoj v pr\u00edjmovej oblasti je predpoklad mo\u017en\u00e9ho
  n\u00e1rastu finan\u010dn\u00fdch prostriedkov do oblasti mzdov\u00fdch n\u00e1kladov
  a tie\u017e k zv\u00fd\u0161eniu rozpo\u010dtu na be\u017en\u00e9 v\u00fddavky,
  hlavne do oblasti opr\u00e1v a \u00fadr\u017eby objektov M\u0160, kde pri s\u00fa\u010dasnom
  stave s\u00fa rezervy v plnen\u00ed opr\u00e1vnen\u00fdch po\u017eiadaviek M\u0160.\\n\\nProbl\u00e9mov\u00e9
  oblasti\\n\\n- V oblasti osobn\u00fdch n\u00e1kladov je probl\u00e9m so mzdov\u00fdm
  ohodnoten\u00edm nepedagogick\u00fdch pracovn\u00edkov (kuch\u00e1rky, upratova\u010dky
  a \u00fadr\u017eb\u00e1ri). Ako u\u017e bolo vy\u0161\u0161ie spom\u00ednan\u00e9,
  je za s\u00fa\u010dasn\u00fdch platov\u00fdch pomerov probl\u00e9m obsadi\u0165
  uvo\u013enen\u00e9 pracovn\u00e9 miesta. Obdobn\u00fd probl\u00e9m sa o\u010dak\u00e1va
  aj u pedagogick\u00fdch zamestnancov s oh\u013eadom na narastaj\u00faci po\u010det
  odchodu s\u00fa\u010dasn\u00fdch pedagogick\u00fdch zamestnancov do d\u00f4chodku
  \u010do vyvol\u00e1va n\u00e1rast finan\u010dn\u00fdch prostriedkov na osobn\u00fdch
  v\u00fddavkoch. V nasleduj\u00facom obdob\u00ed sa predpoklad\u00e1 tie\u017e postupn\u00fd
  finan\u010dn\u00fd n\u00e1rast na vypl\u00e1canie kreditov\u00fdch pr\u00edplatkov
  pedagogick\u00fdm zamestnancom.\\n- V oblasti tovarov a slu\u017eieb s\u00fa\u010dasn\u00fd
  rozpo\u010det pokr\u00fdva z\u00e1kladn\u00e9 po\u017eiadavky na zabezpe\u010denie
  prev\u00e1dzky M\u0160 a  hygienick\u00fdch opatren\u00ed. Mo\u017en\u00e9 rizik\u00e1
  s\u00fa v pr\u00edpade vzniku nepredv\u00eddan\u00fdch udalost\u00ed, napr. hav\u00e1rie
  rozvodov vody, elektriny, odpadov at\u010f.. Jedn\u00fdm z \u010fal\u0161\u00edch
  probl\u00e9mov je zabezpe\u010dovanie \u00fadr\u017eby are\u00e1lov, nerovnosti
  chodn\u00edkov, po\u0161koden\u00e9 oplotenia, obruby pieskov\u00edsk, dop\u013a\u0148anie
  pieskov\u00edsk pieskom, obnova hern\u00fdch prvkov a lavi\u010diek.\\n\\n5. Z\u00e1ver\\n\\nPredlo\u017een\u00fd
  materi\u00e1l stru\u010dne zhodnocuje hospod\u00e1renie SS\u0160a\u0160ZP v predch\u00e1dzaj\u00facom
  obdob\u00ed a predpokladan\u00fd v\u00fdvoj v nasleduj\u00facom obdob\u00ed na z\u00e1klade
  financovania SS\u0160a\u0160ZP z pridelen\u00fdch finan\u010dn\u00fdch prostriedkov
  z Mestskej \u010dasti Bratislava Petr\u017ealka. Nov\u00e9 rozvojov\u00e9 aktivity
  vych\u00e1dzaj\u00fa z finan\u010dn\u00fdch mo\u017enost\u00ed SS\u0160a\u0160ZP,
  s cie\u013eom rie\u0161i\u0165 zlep\u0161enie bezpe\u010dnostn\u00fdch a hygienick\u00fdch
  predpisov, zlep\u0161i\u0165 pracovn\u00e9 a prev\u00e1dzkov\u00e9 podmienky, ako
  i rie\u0161i\u0165 \u010fal\u0161ie mo\u017enosti \u00faspory energi\u00ed.\"",
