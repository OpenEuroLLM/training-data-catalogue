  d\u0148om jeho p\u00edsomn\u00e9ho doru\u010denia druhej zmluvnej strane.\\n\\n12.4.
  Zmluvn\u00e9 strany sa dohodli, \u017ee zmluvu m\u00f4\u017ee objedn\u00e1vate\u013e
  vypoveda\u0165 aj bez udania d\u00f4vodu zasielan\u00edm p\u00edsomnej v\u00fdpovede
  zhotovite\u013eovi na adresu uveden\u00fa v \u010cl\u00e1nku 10. odseku 10.4. zmluvy,
  pri\u010dom v\u00fdpovedn\u00e1 lehota je jeden (1) mesiac a za\u010d\u00edna plyn\u00fa\u0165
  prv\u00fdm (1.) dnom mesiaca nasleduj\u00faceho po mesiaci, v ktorom bola vypoved
  doru\u010den\u00e1 zhotovite\u013eovi.\\n\\n12.5. V pr\u00edpade, \u017ee sa niektor\u00e9
  z ustanoven\u00ed tejto zmluvy vzhladom na neskor\u0161iu legislat\u00edvnu zmene
  alebo z ak\u00e9hoko\u013evek in\u00e9ho d\u00f4vodu stane pr\u00e1vne ne\u00fa\u010dinn\u00e9
  alebo neplatn\u00e9, uveden\u00e9 nem\u00e1 za n\u00e1sledok neplatnos\u0165 celej
  zmluvy.\\n\\n12.6. \u010eal\u0161ie vz\u0165ahy v tejto zmluve neupraven\u00e9 sa
  riadia ustanoveniami Obchodn\u00e9ho z\u00e1konn\u00edka.\\n\\n12.7. T\u00e1to zmluva
  je vypracovan\u00e1 v troch (3) vyhotoveniach, z ktor\u00fdch dve (2) vyhotovenia
  si ponech\u00e1 objedn\u00e1vate\u013e a jedno (1) vyhotovenie si ponech\u00e1 zhotovite\u013e.\\n\\n12.8.
  Zmluvn\u00e9 strany vyhlasuj\u00fa, \u017ee zmluvu uzavreli slobodne, v\u00e1\u017ene
  a bez omylu, nebola uzavret\u00e1 v tieni za n\u00e1padne nev\u00fdhodn\u00fdch
  podmienok, zmluvu si pre\u010d\u00edtali, jej obsahu porozumeli a na znak s\u00fahlasu
  zmluvu podpisuj\u00fa.\\n\\n12.9. Neoddelite\u013enou s\u00fa\u010das\u0165ou tejto
  zmluvy je pr\u00edloha \u010d. 1 \u2013 Zoznam objektov BVS, a. s. pre pos\u00fadenie
  stavu fyzickej a objektovej bezpe\u010dnosti.\\n\\nV Bratislave, d\u0148a: 27. 02.
  2020\\n\\nZa objedn\u00e1vate\u013ea:\\nBratislavsk\u00e1 vod\u00e1rensk\u00e1 spolo\u010dnos\u0165,
