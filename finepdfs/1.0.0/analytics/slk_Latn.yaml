  pri v\u00fdkone ak\u00fdchko\u013evek opatren\u00ed s cie\u013eom zmierni\u0165
  n\u00e1sledky straty alebo neopr\u00e1vnen\u00e9ho pr\u00edstupu k osobn\u00fdm
  \u00fadajom. V stanoven\u00fdch pr\u00edpadoch je zmluvn\u00e1 strana povinn\u00e1
  vykona\u0165 v\u0161etky pr\u00edslu\u0161n\u00e9 opatrenia na zabezpe\u010denie,
