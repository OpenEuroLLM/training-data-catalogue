  j.:\\n\\n267/2016\\n\\n\u010cl. I Zmluvn\u00e9 strany\\n\\nPrenaj\u00edmate\u013e:\\n\\nObec
  Lendak\\n\\nv\\n\\nzast\u00fapen\u00ed Pavlom Hud\u00e1\u010dekom, starostom obce\\n\\nKostoln\u00e1
  194/14, 059 07  Lendak\\n\\n\u010d. \u00fa.: 1641786001/5600, Prima banka Slovensko,
  Ke\u017emarok\\n\\nI\u010cO: 00321326\\n\\nDI\u010c: 2020697206\\n\\nN\u00e1jomca:\\n\\nJozef
  Porada Z\u00e1hradn\u00e1 133/48, 059 39  \u0160u\u0148ava\\n\\nI\u010cO: 41008502\\n\\nDI\u010c:
  11044394780\\n\\nsa d\u0148a 30. 12. 2016 dohodli na uzavret\u00ed tejto z m l u
  v y :\\n\\nPrenaj\u00edmate\u013e je v\u00fdlu\u010dn\u00fdm vlastn\u00edkom budovy
  \u2013 Obecn\u00e9ho \u00faradu v obci Lendak, Kostoln\u00e1 194/14, parc. \u010d.
  v k. \u00fa. Lendak evidovanej na LV \u010d. 1.\\n\\n\u010cl. II Predmet a \u00fa\u010del
  n\u00e1jmu\\n\\n1. Prenaj\u00edmate\u013e prenech\u00e1va n\u00e1jomcovi do u\u017e\u00edvania
  nebytov\u00e9 priestory \u2013 miestnos\u0165 \u010d. 15 \u2013 v objekte obecn\u00e9ho
  \u00faradu s\u00fap. \u010d\u00edslo 194, parc. \u010d. 1039 v k. \u00fa. Lendak.
  Prenaj\u00edmate\u013e d\u00e1va n\u00e1jomcovi do n\u00e1jmu uveden\u00e9 priestory
  za \u00fa\u010delom vyu\u017e\u00edvania na podnikate\u013esk\u00fa \u010dinnos\u0165
  uveden\u00fa v \u017eivnostenskom liste n\u00e1jomcu. N\u00e1jomca sa zav\u00e4zuje,
  \u017ee bude prenaj\u00edman\u00e9 priestory u\u017e\u00edva\u0165 predov\u0161etk\u00fdm
  na poskytovanie slu\u017eieb Slovenskej pois\u0165ovne, a.s. Zmena \u00fa\u010delu
  m\u00f4\u017ee by\u0165 realizovan\u00e1 v\u00fdlu\u010dne p\u00edsomne, formou
  dodatku k zmluve. N\u00e1jomca sa zav\u00e4zuje \u010dinnos\u0165 vykon\u00e1va\u0165
  za podmienok dodr\u017eiavania platn\u00fdch pr\u00e1vnych predpisov a v s\u00falade
  s pravidlami ob\u010dianskeho spoluna\u017e\u00edvania.\\n2. Celkov\u00e1 v\u00fdmera
  podlahovej plochy nebytov\u00e9ho priestoru je 39 m 2 .\\n\\n\u010cl. III Doba n\u00e1jmu\\n\\nNebytov\u00e9
  priestory pre \u00fa\u010del u\u017e\u00edvania sa prenaj\u00edmaj\u00fa na dobu
  neur\u010dit\u00fa ka\u017ed\u00fd pracovn\u00fa stredu 14.00 h do 16.00 h. (2 hodiny)\\n\\nV
  pr\u00edpade, \u017ee prenaj\u00edmate\u013e bude uveden\u00e9 priestory potrebova\u0165
  pre svoju \u010dinnos\u0165 zabezpe\u010d\u00ed n\u00e1jomcovi n\u00e1hradn\u00e9
  za dodr\u017eania tak\u00fdch ist\u00fdch podmienok.\\n\\nN\u00c1JOMN\u00c1 ZMLUVA\\n\\n\u010cl.
  IV N\u00e1jomn\u00e9 a \u00fahrada za slu\u017eby\\n\\n1. D\u0148om vzniku n\u00e1jmu
  je n\u00e1jomca povinn\u00fd plati\u0165 \u00fahradu za slu\u017eby, ktor\u00fdch
  poskytovanie je spojen\u00e9 s n\u00e1jmom nebytov\u00e9ho priestoru (\u010falej
  len slu\u017eby).\\n2. Zmluvn\u00e9 strany sa dohodli na n\u00e1jomnom vo v\u00fd\u0161ke\\n\\nrok
  2017, sadzba 15 \u20ac/m 2 ro\u010dne pod\u013ea Z\u00e1sad hospod\u00e1renia s
  majetkom obce Lendak:\\n\\n52 kr\u00e1t streda (2 hodiny) = n\u00e1jomne 7,28 \u20ac
  pozn.: (ka\u017edoro\u010dne sa uprav\u00ed v\u00fd\u0161ka n\u00e1jomn\u00e9ho
  pod\u013ea po\u010dtu vyu\u017e\u00edvan\u00fdch hod\u00edn \u2013 fakt\u00fara
  resp. dodatok)\\n3. Za slu\u017eby vo v\u00fd\u0161ke \u20ac 1,60 mesa\u010dne *12
  = 19,20 \u20ac\\n4. \u00dahrada za slu\u017eby a n\u00e1jom sa plat\u00ed \u00fa\u010det
  prenaj\u00edmate\u013ea a je splatn\u00e1 do 15.02.2017\\n\\n(\u00dahrada za n\u00e1jom
  a slu\u017eby predstavuje na rok 2016 sumu vo v\u00fd\u0161ke 26,48 \u20ac )\\n\\n5.
  Ak n\u00e1jomca neuhrad\u00ed \u00fahradu za slu\u017eby v stanovenej v\u00fd\u0161ke
  a v lehote uvedenej v odseku 4, je povinn\u00fd plati\u0165 \u00farok z ome\u0161kania
  vo v\u00fd\u0161ke 0,1 % z dl\u017enej sumy za ka\u017ed\u00fd za\u010dat\u00fd
  de\u0148.\\n6. Prenaj\u00edmate\u013e je opr\u00e1vnen\u00fd zmeni\u0165 v\u00fd\u0161ku
  mesa\u010dn\u00fdch \u00fahrad za slu\u017eby, ak je pre to d\u00f4vod vypl\u00fdvaj\u00faci
  zo zmeny danej osobitn\u00fdm v\u0161eobecne z\u00e1v\u00e4zn\u00fdm pr\u00e1vnym
  predpisom alebo z rozhodnut\u00ed cenov\u00fdch org\u00e1nov, alebo ak  sa zmen\u00ed
  rozsah alebo kvalita poskytovan\u00fdch slu\u017eieb.\\n7. Nedoplatky alebo preplatky
  vypl\u00fdvaj\u00face z vy\u00fa\u010dtovania s\u00fa splatn\u00e9 do 15 dn\u00ed
  odo d\u0148a doru\u010denia vy\u00fa\u010dtovania n\u00e1jomcovi. Zmluvn\u00e1 strana,
  ktor\u00e1 je v ome\u0161kan\u00ed s platbou vypl\u00fdvaj\u00facou z vy\u00fa\u010dtovania,
  je povinn\u00e1 zaplati\u0165 druhej zmluvnej strane \u00farok z ome\u0161kania
  vo v\u00fd\u0161ke 0,1 % z dl\u017enej sumy za ka\u017ed\u00fd za\u010dat\u00fd
  de\u0148 ome\u0161kania.\\n\\n\u010cl. V\\n\\nPr\u00e1va a povinnosti prenaj\u00edmate\u013ea\\n\\n1.
  Prenaj\u00edmate\u013e sa zav\u00e4zuje odovzda\u0165 n\u00e1jomcovi nebytov\u00fd
  priestor v stave sp\u00f4sobilom na riadne u\u017e\u00edvanie a v tomto stave ho
  na svoje n\u00e1klady udr\u017eiava\u0165.\\n2. Prenaj\u00edmate\u013e je povinn\u00fd
  umo\u017eni\u0165 n\u00e1jomcovi u\u017e\u00edva\u0165 nebytov\u00fd priestor za
  podmienok dohodnut\u00fdch touto zmluvou a zabezpe\u010di\u0165 mu pln\u00fd a neru\u0161en\u00fd
  v\u00fdkon pr\u00e1v spojen\u00fdch s n\u00e1jmom.\\n3. Prenaj\u00edmate\u013e je
  povinn\u00fd riadne a v\u010das poskytova\u0165 n\u00e1jomcovi slu\u017eby, na ktor\u00e9
  sa zaviazal, pr\u00edpadne zabezpe\u010di\u0165 ich poskytovanie.\\n\\n\u010cl.
  VI\\n\\nPr\u00e1va a povinnosti n\u00e1jomcu\\n\\n1. N\u00e1jomca je povinn\u00fd
  u\u017e\u00edva\u0165 nebytov\u00fd priestor len na \u00fa\u010del dohodnut\u00fd
  touto zmluvou a len pre svoje potreby. Popri n\u00e1jomcovi s\u00fa opr\u00e1vnen\u00ed
  nebytov\u00fd priestor u\u017e\u00edva\u0165 zamestnanci n\u00e1jomcu, ktor\u00ed
  v nebytov\u00fdch priestoroch vykon\u00e1vaj\u00fa pr\u00e1cu.\\n3. N\u00e1jomca
  je povinn\u00fd na vlastn\u00e9 n\u00e1klady zabezpe\u010di\u0165 upratovanie prenajat\u00e9ho
  priestoru, dodr\u017eiava\u0165 predpisy o bezpe\u010dnosti pri pr\u00e1ci, protipo\u017eiarne
  predpisy, z\u00e1kon o faj\u010diaroch.\\n2. N\u00e1jomca je povinn\u00fd u\u017e\u00edva\u0165
  nebytov\u00fd priestor riadne a zabezpe\u010di\u0165, aby prev\u00e1dzkovan\u00edm
  \u010dinnosti, na ktor\u00fa si nebytov\u00fd priestor prenajal, nebol ru\u0161en\u00fd
  pokoj a poriadok v okol\u00ed budovy.\\n4. N\u00e1jomca zodpoved\u00e1 za hmotn\u00fa
  \u010di in\u00fa \u0161kodu sp\u00f4soben\u00fa zavinen\u00fdm konan\u00edm n\u00e1jomcu,
  jeho zamestnancov, \u010di \u010fal\u0161\u00edch os\u00f4b zdr\u017euj\u00facich
  sa v prenajatom priestore so s\u00fahlasom n\u00e1jomcu.\\n6. N\u00e1jomca je povinn\u00fd
  zn\u00e1\u0161a\u0165 obmedzenie v u\u017e\u00edvan\u00ed nebytov\u00e9ho priestoru
  v rozsahu potrebnom na vykonanie opr\u00e1v.\\n5. N\u00e1jomca je povinn\u00fd bez
  zbyto\u010dn\u00e9ho odkladu ozn\u00e1mi\u0165 prenaj\u00edmate\u013eovi potrebu
  t\u00fdch opr\u00e1v a pr\u00e1c, ktor\u00e9 m\u00e1 urobi\u0165 prenaj\u00edmate\u013e
  a umo\u017eni\u0165 ich vykonanie; inak zodpoved\u00e1 za \u0161kodu, ktor\u00e1
  nesplnen\u00edm tejto povinnosti vznikla.\\n7. N\u00e1jomca hrad\u00ed a vykon\u00e1va
  alebo zabezpe\u010duje vykonanie pr\u00e1c v zmysle Nariadenia vl\u00e1dy Slovenskej
  republiky \u010d. 87/1995 Z. z., ktor\u00fdm sa vykon\u00e1vaj\u00fa niektor\u00e9
  ustanovenia Ob\u010dianskeho z\u00e1konn\u00edka.\\n9. Prenecha\u0165 nebytov\u00fd
  priestor do n\u00e1jmu tret\u00edm osob\u00e1m m\u00f4\u017ee n\u00e1jomca len s
  predch\u00e1dzaj\u00facim p\u00edsomn\u00fdm s\u00fahlasom prenaj\u00edmate\u013ea.\\n8.
  N\u00e1jomca nesmie vykon\u00e1va\u0165 stavebn\u00e9 \u00fapravy a in\u00e9 podstatn\u00e9
  zmeny v nebytovom priestore bez s\u00fahlasu prenaj\u00edmate\u013ea, a to ani na
  svoj n\u00e1klad.\\n10. N\u00e1jomca je povinn\u00fd riadne a v\u010das plati\u0165
  \u00fahradu za slu\u017eby.\\n\\n\u010cl. VII Skon\u010denie n\u00e1jmu\\n\\n1.
  N\u00e1jomn\u00fd pomer kon\u010d\u00ed uplynut\u00edm doby n\u00e1jmu.\\n- n\u00e1jomca
  u\u017e\u00edva nebytov\u00fd priestor v rozpore s touto zmluvou,\\n2. N\u00e1jomn\u00fd
  pomer pred uplynut\u00edm dohodnutej doby m\u00f4\u017ee prenaj\u00edmate\u013e
  vypoveda\u0165 p\u00edsomnou v\u00fdpove\u010fou, ak:\\n- n\u00e1jomca o viac ako
  jeden mesiac me\u0161k\u00e1 s platen\u00edm \u00fahrady za slu\u017eby,\\n- bolo
  rozhodnut\u00e9 o odstr\u00e1nen\u00ed stavby alebo o zmen\u00e1ch stavby, \u010do
  br\u00e1ni u\u017e\u00edva\u0165 nebytov\u00fd priestor,\\n- n\u00e1jomca alebo
  in\u00e9 osoby, ktor\u00e9 u\u017e\u00edvaj\u00fa nebytov\u00fd priestor, napriek
  p\u00edsomn\u00e9mu upozorneniu hrubo poru\u0161uj\u00fa pokoj alebo poriadok,\\n-
  n\u00e1jomca prenech\u00e1 nebytov\u00fd priestor do podn\u00e1jmu bez predch\u00e1dzaj\u00faceho
  s\u00fahlasu prenaj\u00edmate\u013ea.\\n- zanikne pr\u00e1vo n\u00e1jomcu prev\u00e1dzkova\u0165
  \u010dinnos\u0165, na ktor\u00fa si nebytov\u00fd priestor prenajal,\\n3. N\u00e1jomca
  m\u00f4\u017ee poda\u0165 v\u00fdpove\u010f z n\u00e1jmu pred uplynut\u00edm dojednanej
  doby n\u00e1jmu p\u00edsomnou v\u00fdpove\u010fou, ak:\\n\\n- nebytov\u00fd priestor
  sa stane bez zavinenia n\u00e1jomcu nesp\u00f4sobil\u00fd na dohodnut\u00e9 u\u017e\u00edvanie,\\n5.
  O skon\u010den\u00ed n\u00e1jmu pred uplynut\u00edm dohodnutej doby sa m\u00f4\u017eu
  dohodn\u00fa\u0165 prenaj\u00edmate\u013e a n\u00e1jomca p\u00edsomnou dohodou.\\n4.
  V\u00fdpovedn\u00fa lehotu si prenaj\u00edmate\u013e a n\u00e1jomca dojednali 1-mesa\u010dn\u00fa,
  ktor\u00e1 sa po\u010d\u00edta od prv\u00e9ho d\u0148a mesiaca nasleduj\u00faceho
  po doru\u010den\u00ed v\u00fdpovede.\\n\\n\u010cl. VIII\\n\\nN\u00e1jomca je opr\u00e1vnen\u00fd
  da\u0165 si poisti\u0165 prenajat\u00fd priestor a vlastn\u00fd majetok v \u0148om
  na vlastn\u00e9 n\u00e1klady. N\u00e1jomca m\u00e1 n\u00e1rok umiestni\u0165 si
  reklamu, schv\u00e1len\u00fa prenaj\u00edmate\u013eom, nad vchodom do predajne po
  dohode s prenaj\u00edmate\u013eom o mieste a sp\u00f4sobe uchytenia na budovu.\\n\\n\u010cl.
  IX\\n\\nN\u00e1jomca m\u00f4\u017ee vykon\u00e1va\u0165 stavebn\u00e9, \u010di in\u00e9
  \u00fapravy v prenajatom priestore na vlastn\u00e9 n\u00e1klady len po predch\u00e1dzaj\u00facom
  p\u00edsomnom s\u00fahlase prenaj\u00edmate\u013ea.\\n\\n\u010cl. X\\n\\nOkrem d\u00f4vodov
  uveden\u00fdch v \u00a7 14 z\u00e1kona \u010d. 116/1990 Zb. n\u00e1jom zanik\u00e1
  aj v pr\u00edpade, ak technick\u00fd stav budovy, kde sa nach\u00e1dza predmet n\u00e1jmu,
  bude vy\u017eadova\u0165 rekon\u0161trukciu alebo v\u00e4\u010d\u0161iu opravu.\\n\\n\u010cl.
  XI\\n\\nZmluva je vyhotoven\u00e1 v dvoch origin\u00e1loch, 1 x obdr\u017e\u00ed
  n\u00e1jomca a 1 x prenaj\u00edmate\u013e.\\n\\nV Lendaku 30. 12. 2016\\n\\nPavel
  Hud\u00e1\u010dek starosta obce\\n\\nJozef Porada\"", "\"MORAVSKO - SLOVENSK\u00dd
  BE\u017dECK\u00dd POH\u00c1R, GRAND PRIX Z\u00c1HORIA, GRAND PRIX SLOV\u00c1CKA\\n\\nV
  Gbeloch sme spoznali najlep\u0161\u00edch za rok 2014\\n\\nPORT\u00c1\u0160IKOV\u00c1
  PREKAZILA JABLONICK\u00dd HETRIK\\n\\nV Kult\u00farnom dome v Gbeloch sa v sobotu
  24. janu\u00e1ra konalo sl\u00e1vnostn\u00e9 vyhodnotenie be\u017eeck\u00e9ho seri\u00e1lu
  Moravsko-Slovensk\u00e9ho be\u017eeck\u00e9ho poh\u00e1ra (MSBP) pre rok 2014.\\n\\nPodujatie
  organizovala be\u017eeck\u00e1 partia Gbelsk\u00fdch str\u00fdcov a mo\u017eno poveda\u0165,
  \u017ee to zvl\u00e1dli op\u00e4\u0165 nad o\u010dak\u00e1vanie - vynikaj\u00faco.\\n\\nNajlep\u0161\u00ed
  be\u017eci sa vyhlasovali v deviatich be\u017eeck\u00fdch kateg\u00f3ri\u00e1ch
  (\u0161es\u0165 mu\u017esk\u00fdch a tri \u017eensk\u00e9). Spoznali sme najlep\u0161\u00edch,
  ktor\u00ed si svoje postavenie vybojovali v 35 pretekoch po\u010das minul\u00e9ho
  roka, 22 ich bolo na moravskej strane, 12 na slovenskej a spolo\u010dn\u00fd bol
  pretek Skalica - Hol\u00ed\u010d - Hodon\u00edn.\\n\\nDo absol\u00fatneho poradia
  MSBP sa pretek\u00e1rom zapo\u010d\u00edtavalo 26 najlep\u0161\u00edch v\u00fdsledkov,
  do GP Z\u00e1horia a GP Slov\u00e1cka zase 22 najlep\u0161\u00edch v\u00fdsledkov.
  Aj preto sa niekedy celkov\u00e9 v\u00fdsledky MSBP od GP Z\u00e1horia (GPZ) \u010di
  GP Slov\u00e1cka (GPS) odli\u0161ovali.\\n\\nCelkovo bolo vo v\u00fdsledkov\u00fdch
  listin\u00e1ch zaevidovan\u00fdch 12143 be\u017ecov, \u010do je fantastick\u00e9
  \u010d\u00edslo. Najvy\u0161\u0161iu \u00fa\u010das\u0165 mali u\u017e tradi\u010dne
  preteky v Jehniciach u Brna, kde \u0161tartovalo 1094 be\u017ecov. Priemer na jedny
  preteky d\u00e1va \u00factyhodn\u00fdch 347 pretek\u00e1rov. D\u013a\u017eka jednotliv\u00fdch
  pretekov bola od jednej m\u00edle do 21 km, ktor\u00e9 mal Senick\u00fd polmarat\u00f3n.\\n\\nS\u00fa\u010das\u0165ou
  MSBP je aj s\u00fa\u0165a\u017e JUNDOR, \u010do s\u00fa preteky juniorov a dorastu.
  T\u00e1to m\u00e1 17 pretekov, be\u017ecom sa do absol\u00fatneho poradia po\u010d\u00edtalo
  desa\u0165 najlep\u0161\u00edch pretekov.\\n\\nPo ofici\u00e1lnom programe vyhlasovania
  v\u00fdsledkov odp\u00e1lil \u0161tartovacou pi\u0161to\u013eou \u0161tart\u00e9r
  Josef Sovek za pomoci Marty Durnovej ofici\u00e1lny Be\u017eeck\u00fd ples. A potom
  sa u\u017e tane\u010dn\u00fd parket nevypr\u00e1zdnil a\u017e do rann\u00fdch hod\u00edn.
  Nasledovala vo\u013en\u00e1 z\u00e1bava pod taktovkou hudobnej skupiny Vesel\u00e1
  trojka z Petrovej Vsi a veru tane\u010dn\u00fd parket neostal ani na chv\u00ed\u013eu
  pr\u00e1zdny.\\n\\n\u017ee sa beh\u00e1, aby sa vyhralo, no to m\u00f4\u017ee iba
  jeden a ak sa mu to podar\u00ed, treba mu to dopria\u0165 a o t\u00fd\u017ede\u0148
  sa mu to sna\u017ei\u0165 vr\u00e1ti\u0165,\\\" povedal jednu ve\u013ek\u00fa pravdu
  veter\u00e1n nad 65 rokov Michal Janota, ktor\u00fd sa prezentoval aj b\u00e1s\u0148ou
  z vlastnej tvorby.\\n\\nstr\u00fdci, 7995, 6. \u0160tefan Rybansk\u00fd, Jablonica,
