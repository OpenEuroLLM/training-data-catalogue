  m\u00f4\u017ee ovplyvni\u0165 ich vstreb\u00e1vanie a vyu\u017eitie v organizme.\\n\\n**Vitam\u00edny
  rozpustn\u00e9 v tukoch**\\n(A, D, E, K) a Omega 3 potrebuj\u00fa tuk, aby sa vstrebali.
  Preto ich u\u017e\u00edvajte s hlavn\u00fdm jedlom alebo desiatou, ktor\u00e9 ho
