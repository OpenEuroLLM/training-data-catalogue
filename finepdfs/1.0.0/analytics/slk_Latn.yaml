  Prievidza\\nZast\u00fapen\u00e1: Milan Petr\u00e1s, riadite\u013e\\nI\u010cO: 45735301\\nBankov\u00e9
  spojenie: Tatra banka, a.s. pobo\u010dka Prievidza\\n\u010c. \u00fa\u010dtu: 2928851485/1100\\n\u010falej
  len objedn\u00e1vate\u013e soci\u00e1lnej slu\u017eby\\n\\nPod\u013ea \u010dl. V.
  bodu 2. Zmluvy o poskytovan\u00ed finan\u010dn\u00e9ho pr\u00edspevku na prev\u00e1dzku
  poskytovanej soci\u00e1lnej slu\u017eby neverejn\u00e9mu poskytovate\u013eovi soci\u00e1lnej
  slu\u017eby \u010d. 92/2011/TZ/2.3.1 (\u010falej len ZoPFPPP zo d\u0148a 16.3.2011)
