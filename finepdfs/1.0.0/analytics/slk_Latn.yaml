  Rady starostov: Materi\u00e1l pre\u0161iel bez pripomienok. T\u00fdmto skon\u010dili
  z\u00e1kladn\u00e9 body rokovania, navrhol prija\u0165 uznesenie v znen\u00ed: Rada
  starostov berie na vedomie predlo\u017een\u00e9 materi\u00e1ly, ktor\u00e9 bud\u00fa
  zaraden\u00e9 na rokovanie mestsk\u00e9ho zastupite\u013estva.\\n\\nHlasovanie \u010d.
  3 \u2013 za: 16, proti: -, zdr\u017eali sa:,-\\n\\n*  *  *\\n\\n15. R\u00f4zne\\n\\nElektronick\u00e9
  aukcie\\n\\np. Re\u0161tei, predseda Rady starostov: Boli tu navrhnut\u00e9 na zaradenie
  rie\u0161enie elektronick\u00fdch aukci\u00ed v r\u00e1mci mesta. Aj v zmysle uznesenia
  z 2. Rady starostov, kde povedali, \u017ee po\u017eiadaj\u00fa mesto Ko\u0161ice
  o mo\u017enos\u0165 vyu\u017e\u00edvania elektronick\u00fdch aukci\u00ed alebo programu,
  ktor\u00fd mesto Ko\u0161ice m\u00e1, v tom \u010dase aj p\u00e1n starosta Saxa
  z Kr\u00e1snej navrhol vyu\u017ei\u0165 ich program, je tu \u010das, aj novela z\u00e1kona
  hovor\u00ed o vyu\u017e\u00edvan\u00ed tejto formy, treba sa spolo\u010dne zamyslie\u0165
  ako \u010falej, \u010di p\u00f4jde individu\u00e1lne ka\u017ed\u00e1 M\u010c alebo
  je mo\u017en\u00e9 spoji\u0165 sily a vytvori\u0165 jeden projekt, ktor\u00fd by
  bol oso\u017en\u00fd pre v\u0161etky M\u010c.\\np. Petrvalsk\u00fd, starosta M\u010c
  Ko\u0161ice \u2013 S\u00eddlisko \u0164ahanovce: Nevie, pre\u010do z elektronick\u00fdch
  aukci\u00ed robia stra\u0161iaka, oni maj\u00fa jednu firmu, ktorej povedia, \u017ee
  potrebuj\u00fa nak\u00fapi\u0165 notebooky, oni im zo\u017een\u00fa dod\u00e1vate\u013eov,
  povedia im, ak\u00fa najni\u017e\u0161iu ponuku si\\n\\npredstavuj\u00fa. Firma
  si z toho, \u010do u\u0161etr\u00ed,  zoberie 10% a ich to nestoj\u00ed ani cent.
  Pr\u00eddu, v\u0161etko urobia, je to dobr\u00fd mechanizmus, s ktor\u00fdm s\u00fa
  spokojn\u00ed.\\np. Jen\u010dov\u00e1, starostka M\u010c Ko\u0161ice \u2013 Nad
  jazerom: Ke\u010f firma Datalan je schopn\u00e1 a ochotn\u00e1 to urobi\u0165 za
  nad\u0161tandardn\u00fdch podmienok, nech im po\u0161le mailom ponuku a ka\u017ed\u00fd
  starosta sa rozhodne, \u010di si k\u00fapi softv\u00e9r, tak ako m\u00e1 Kr\u00e1sna,
  alebo vyu\u017eij\u00fa ponuku Datalanu, ak bude v\u00fdhodnej\u0161ia ako ostatn\u00e9.
  Firmy, ktor\u00e9 to robia dod\u00e1vate\u013esky si ber\u00fa nejak\u00e9 percento
  z u\u0161etren\u00fdch pe\u0148az\u00ed, nech daj\u00fa ponuku, pod\u013ea toho,
  ko\u013eko bude mestsk\u00fdch \u010dast\u00ed, kto sa do toho zapoj\u00ed, nech\u00e1
  sa na individu\u00e1lne zv\u00e1\u017eenie. Ak to bude v\u00fdhodn\u00e9, zapoja
  sa do toho v\u0161etci.\\np. Petrenka, starosta M\u010c Ko\u0161ice \u2013 Ko\u0161ick\u00e1
  Nov\u00e1 Ves: Svojho \u010dasu sa robila s\u00fa\u0165a\u017e verejn\u00e9ho obstar\u00e1vania
  na zber a likvid\u00e1ciu tuh\u00e9ho komun\u00e1lneho odpadu, v\u0161etky mal\u00e9
  M\u010c mali mo\u017enos\u0165 podp\u00edsa\u0165 zmluvu a spolupracova\u0165 s
  v\u00ed\u0165azom s\u00fa\u0165a\u017ee. Nevid\u00ed d\u00f4vod, pre\u010do by sa
  nie\u010do tak\u00e9 nemohlo teraz urobi\u0165 pre M\u010c v oblasti elektronick\u00e9ho
  verejn\u00e9ho obstar\u00e1vania. Navrhuje, aby vyp\u00edsali s\u00fa\u0165a\u017e
  pre v\u0161etky M\u010c s t\u00fdm, \u017ee by sa na\u0161la jedna spolo\u010dnos\u0165,
  ktor\u00e1 by zabezpe\u010dovala za ur\u010dit\u00fdch pevn\u00fdch podmienok toto
  obstar\u00e1vanie.\\np. Re\u0161tei, predseda Rady starostov: Spolo\u010dnos\u0165
  Datalan zabezpe\u010duje \u00fa\u010dtovn\u00edctvo pre 12 M\u010c, m\u00e1 inform\u00e1cie
  od p\u00e1na Dugasa, ktor\u00fd rob\u00ed servis pre \u00fa\u010dtovn\u00edctvo,
  ak bude z\u00e1ujem M\u010c o tak\u00e9to elektronick\u00e9 aukcie, mohli by to
  spolu rie\u0161i\u0165. Tak ako rie\u0161ili spolu mal\u00e9 M\u010c poistenie,
  \u017ee zl\u00fa\u010dili v\u0161etok majetok, vy\u0161iel dobr\u00fd bonus, mali
  ide\u00e1lne podmienky na poistenie, n\u00e1klady sa im tak v\u00fdrazne zn\u00ed\u017eili.
  V projekte elektronick\u00fdch aukci\u00ed navrhuj\u00fa, ak sa d\u00e1 8-9 M\u010c
  dokopy, bude to len za mesa\u010dn\u00fd poplatok bez oh\u013eadu na to, ko\u013eko
  u\u0161etria, nebud\u00fa si u\u017e n\u00e1rokova\u0165 \u017eiadnu odmenu. Bude
  to len mesa\u010dn\u00e1 platba. Bez oh\u013eadu \u010di maj\u00fa el. aukcie alebo
  nie, bude to mesa\u010dne 18 a\u017e 20 eur na jednu M\u010c a bud\u00fa ma\u0165
  celoro\u010dne zabezpe\u010den\u00fd servis pre el. aukcie. Je to n\u00e1vrh. Ak
  sa rozhodn\u00fa, \u017ee id\u00fa individu\u00e1lne, podmienky s\u00fa u\u017e
  in\u00e9. Po\u017eiada p. Dugasa, aby oslovil mailom v\u0161etky M\u010c v Ko\u0161iciach,
  ktor\u00e9 by mali z\u00e1ujem. Bezplatn\u00fd servis vych\u00e1dza na 180 a\u017e
  360 eur na mesiac pod\u013ea ve\u013ekosti M\u010c bez oh\u013eadu na ak\u00fdko\u013evek
  po\u010det aukci\u00ed.\\np. Bauer, starosta M\u010c Ko\u0161ice \u2013 Z\u00e1pad:
  Nech daj\u00fa ponuku tak\u00fa, \u017ee ke\u010f chce urobi\u0165 jednu aukciu,
  ko\u013eko by to st\u00e1lo. Pau\u0161\u00e1lne platby s\u00fa v\u00fdhodn\u00e9
  pre firmu, lebo m\u00e1 st\u00e1ly pr\u00edjem bez oh\u013eadu na to \u010di rob\u00ed,
  alebo nerob\u00ed, ale pre M\u010c je v\u00fdhodnej\u0161ie, ko\u013eko by ho st\u00e1la
  el. aukcia, ke\u010f ju potrebuje. S\u00fahlas\u00ed, \u017ee je to lacnej\u0161ie,
  ke\u010f sa spoja. Vie, \u017ee mesto k\u00fapilo drah\u00fd softv\u00e9r za 30
  tis\u00edc eur na el. obstar\u00e1vanie. Hovorili o tom minule, treba preveri\u0165
  mo\u017enos\u0165, \u010di je mo\u017en\u00e9, aby cez tento softv\u00e9r robili
  aj M\u010c, vtedy ke\u010f maj\u00fa o to z\u00e1ujem. To m\u00f4\u017ee by\u0165
  najlacnej\u0161ie, navrhuje to preveri\u0165, ak\u00e1 je licencia, mo\u017eno sa
  d\u00e1 roz\u0161\u00edri\u0165, nie len pre mesto ale aj pre M\u010c.\\np. Saxa,
  starosta M\u010c Ko\u0161ice \u2013 Kr\u00e1sna: Oni tak\u00fdto softv\u00e9r maj\u00fa,
  stoj\u00ed ich to 800 eur ro\u010dne. Vie, \u017ee mesto Ko\u0161ice tak\u00fd softv\u00e9r
  m\u00e1, disponuje aj \u013eu\u010fmi \u2013 odborn\u00edkmi, ktor\u00ed to robi\u0165
  vedia, \u010di\u017ee mohli kapacitne to zvl\u00e1dnu\u0165. Nie na v\u0161etko
  je potrebn\u00e9 robi\u0165 el. aukciu, napr. ich M\u010c potrebuje ro\u010dne 3
  \u2013 4 aukcie. Pon\u00fakol u\u017e minule t\u00fato mo\u017enos\u0165, nedo\u010d\u00edtal
  sa nikde, \u017ee nem\u00f4\u017eu urobi\u0165 v\u00fdberov\u00e9 konanie pre in\u00fa
  M\u010c, s\u00fa mesto Ko\u0161ice, M\u010c s\u00fa s\u00fa\u010das\u0165ou Ko\u0161\u00edc,
  nevid\u00ed s t\u00fdm probl\u00e9m. Netreba op\u00e4\u0165 kupova\u0165 nov\u00fd
  softv\u00e9r, r\u00e1d by sa svojho zbavil, lebo okrem 800 eur, ke\u010f chce robi\u0165
  poriadne aukcie, 1200 eur ro\u010dne stoja asisten\u010dn\u00e9 slu\u017eby. Preto
  navrhuje rie\u0161i\u0165 el. aukcie na magistr\u00e1te, s\u00fa tu odborn\u00edci,
  ktor\u00ed vedia poradi\u0165 aj ako sa men\u00ed z\u00e1kon o verejnom obstar\u00e1van\u00ed.
  R\u00e1d by sa zbavil t\u00fdch poplatkov, ktor\u00e9 teraz m\u00e1 za el. aukcie,
  zbavil.  Pr\u00edpadne navrhuje, aby si sadli s firmou\\n\\nProebis, a presunuli
  t\u00fato licenciu na Magistr\u00e1t mesta Ko\u0161ice, tak by boli v\u0161etci
  spokojn\u00ed. Nem\u00e1 v\u00fdznam robi\u0165 el. aukciu napr. na kosenie, na
  zimn\u00fa \u00fadr\u017ebu, ke\u010f \u013eudia, ktor\u00ed to vykon\u00e1vaj\u00fa,
  nemaj\u00fa ani mobil, nie to internet.\\np. Re\u0161tei, predseda Rady starostov:
  Doplnil inform\u00e1cie \u2013 ponuku, ktor\u00e1 tu z RS bola, tlmo\u010dili s
  p. podpredsedom vedeniu mesta, kde bol pr\u00edtomn\u00fd p. prim\u00e1tor, n\u00e1mestn\u00edk
  a riadite\u013e. S\u00fa naklonen\u00ed tejto my\u0161lienke s t\u00fdm, \u017ee
  bud\u00fa to zabezpe\u010dova\u0165 v ich r\u00e9\u017eii a mesto Ko\u0161ice bude
  robi\u0165 pre M\u010c. Ka\u017ed\u00e1 M\u010c m\u00e1 stanoven\u00e9 in\u00e9
  podmienky, in\u00fd n\u00e1zor, nevie, \u010di je to spr\u00e1vne, detailne by to
  mohli rozobra\u0165 na bud\u00faci t\u00fd\u017ede\u0148 na stretnut\u00ed.\\np.
  Kupec, starosta M\u010c Ko\u0161ice \u2013 Kave\u010dany: Ke\u010f vedenie mesta
  je tomu naklonen\u00e9 a je to pris\u013e\u00faben\u00e9, navrhol aby prijali k
  tomu uznesenie.\\np. Re\u0161tei, predseda Rady starostov: Uznesenie k tomu u\u017e
  bolo prijat\u00e9, predbe\u017en\u00fd s\u00fahlas vedenia mesta k tomu je dan\u00fd,
  ale ide aj o ochranu v\u00fdstupn\u00fdch d\u00e1t, nie je to tak\u00e9 jednoduch\u00e9
  pou\u017ei\u0165 to, treba to technicky dorie\u0161i\u0165. Hovorili tu o alternat\u00edvach
  \u2013 nie\u010do m\u00e1 mesto, nie\u010do p. starosta Saxa, s\u00fa tu in\u00e9
  firmy, ide o to, \u010di sa dohodn\u00fa, \u017ee id\u00fa do toho spolu, alebo
  ka\u017ed\u00fd s\u00e1m. Teda dohodli sa, \u017ee id\u00fa spolo\u010dne do projektu
  cez mesto Ko\u0161ice, bud\u00fa o tom rokova\u0165 na bud\u00faci t\u00fd\u017ede\u0148,
  ale oslovia aj firmy, ktor\u00e9 spom\u00ednali, nech im po\u0161l\u00fa ponuky.\\n\\nPotravinov\u00e1
  pomoc\\n\\np. Re\u0161tei, predseda Rady starostov: Po\u017eiadal p. starostku Biro\u0161ov\u00fa,
  ktor\u00e1 v \u00favode rokovania spom\u00ednala list, ktor\u00fd on nedostal. Inform\u00e1cie
  o potravinovej pomoci m\u00e1 len sprostredkovane. Mestsk\u00e1 \u010das\u0165 Juh
  to za\u010dala realizova\u0165, aj p\u00e1n starosta by ich mohol o tom informova\u0165.\\np.
  Biro\u0161ov\u00e1, starostka M\u010c Ko\u0161ice \u2013 Po\u013eov: Spomenula aj
  list, ktor\u00fd dostala v\u010dera, nem\u00e1 ho zatia\u013e vytla\u010den\u00fd
  aj od p. Bajusovej z \u00faradu pr\u00e1ce. Prv\u00fd je od Po\u013enohospod\u00e1rskej
  platobnej agent\u00fary, kde s\u00fa ur\u010den\u00e9 organiz\u00e1cie, ktor\u00e9
  maj\u00fa potravinov\u00fa pomoc zveren\u00fa. Je to Potravinov\u00e1 banka Slovensko
  a Slu\u017eby Bo\u017eieho milosrdenstva, teda charitat\u00edvne organiz\u00e1cie
  \u010ealej sa p\u00ed\u0161e, \u017ee nie ka\u017ed\u00fd m\u00f4\u017ee prija\u0165
  t\u00fdch 20 k\u00edl m\u00faky a 20 k\u00edl cestov\u00edn, m\u00f4\u017ee poveda\u0165,
  \u017ee mu sta\u010d\u00ed desa\u0165. Nevie, kto bude robi\u0165 t\u00fa evidenciu,
  ako sa to bude usklad\u0148ova\u0165. D\u00f4chodcovia im u\u017e nosia v\u00fdpisy
  o d\u00f4chodku, ktor\u00fd m\u00e1 by\u0165 ni\u017e\u0161\u00ed ako 305 eur. U\u017e
  rie\u0161ili aj paradox \u2013 jeden d\u00f4chodok bol 305 eur a druh\u00fd d\u00f4chodok
  305,4 eur, kde u\u017e m\u00faku nem\u00f4\u017eu vyda\u0165, oni s\u00fa potom
  t\u00ed zl\u00ed.  Ide aj o uskladnenie, aj ke\u010f na Po\u013eove to nebud\u00fa
  tak\u00e9 ve\u013ek\u00e9 mno\u017estv\u00e1 ako napr. na Lun\u00edku IX, kde m\u00f4\u017ee
  pripadn\u00fa\u0165 na rodinu aj sto k\u00edl m\u00faky a cestov\u00edn, m\u00e1
  sa to spotrebova\u0165 do nejak\u00e9ho term\u00ednu. V tabu\u013eke treba ur\u010di\u0165
  po\u017eadovan\u00fdch jednotlivcov, potvrdenia z \u00faradu pr\u00e1ce, \u013eudia,
  ktor\u00ed s\u00fa odk\u00e1zan\u00ed na soci\u00e1lne slu\u017eby. Nevie, ako to
  vykona\u0165.\\np. Petrvalsk\u00fd, starosta M\u010c Ko\u0161ice \u2013 S\u00eddlisko
  \u0164ahanovce: Upozornil, \u017ee tret\u00ed sektor si z nich urobil trhac\u00ed
  kalend\u00e1r. Tret\u00ed sektor organizuje 20 rokov dost\u00e1va peniaze z Eur\u00f3pskej
  \u00fanie na rie\u0161enie r\u00f3mskeho probl\u00e9mu. Za 20 rokov neposunul tento
  probl\u00e9m tret\u00ed sektor ani o centimeter dopredu a tento probl\u00e9m sa
  v\u017edy rozp\u013easne na samospr\u00e1ve. Teraz vybavili peniaze z Eur\u00f3pskej
  \u00fanie, zabezpe\u010dili potraviny, zrealizovali to cez r\u00f4zne potravinov\u00e9
  banky, dostali m\u00faku, dostali ju do skladov, \u010do nie je \u0165a\u017ek\u00e9
  urobi\u0165 a teraz za\u010d\u00edna mraven\u010dia pr\u00e1ca, ako to dosta\u0165
  k \u013eu\u010fom. Tak samospr\u00e1va to m\u00e1 vyrie\u0161i\u0165 a ke\u010f
  to vyrie\u0161i, tret\u00ed sektor si urob\u00ed fajku \u2013 zabezpe\u010dili sme,
  rozdali sme \u013eu\u010fom. P\u00e1n starosta Hlinka urobil medvediu slu\u017ebu,
  lebo ako prv\u00fd za\u010dal rozd\u00e1va\u0165 potravinov\u00fa pomoc\\n\\na okam\u017eite
  sa v novin\u00e1ch objavilo, \u017ee Ko\u0161i\u010dania u\u017e maj\u00fa potravinov\u00fa
  podporu. Aj k nemu pri\u0161li \u013eudia, lebo vraj v novin\u00e1ch p\u00edsali,
  \u017ee im m\u00e1 da\u0165 20 k\u00edl m\u00faky a 20 k\u00edl cestov\u00edn. Maj\u00fa
  \u010das do konca decembra, osobne si po\u010dk\u00e1 ako sa to vykry\u0161talizuje
  a ak\u00e9 bud\u00fa k tomu pokyny a a\u017e potom za\u010dne rozd\u00e1va\u0165
  potraviny. Netreba sa za\u010da\u0165 myka\u0165, lebo m\u00f4\u017eu t\u00fdm niekomu
  ubl\u00ed\u017ei\u0165.\\np. Re\u0161tei, predseda Rady starostov: Boli dobehnut\u00ed
  jedn\u00fdm z\u00e1konom z roku 2008, ke\u010f sa schv\u00e1lil z\u00e1kon o s\u010d\u00edtan\u00ed
  \u013eudu, domov a bytov. Tento \u0161t\u00e1t hodil na samospr\u00e1vu neskuto\u010dn\u00e9
  \u00falohy. U neho 5 \u013eud\u00ed u\u017e tret\u00ed t\u00fd\u017ede\u0148 sa
  venuje len s\u010d\u00edtaniu \u013eudu, domov a bytov. Ak sa dotazoval u pani riadite\u013eky
  \u0161tatistick\u00e9ho \u00faradu, \u017ee ako t\u00fdchto \u013eud\u00ed \u0161t\u00e1t
  zaplat\u00ed, tak mu povedala, nech si pre\u010d\u00edta z\u00e1kon z roku 2008,
  s\u00fa tak ur\u010den\u00e9 \u00falohy pre samospr\u00e1vu. Odmieta \u010fal\u0161ie
  dohovory, z ktor\u00fdch vypl\u00fdvaj\u00fa \u010fal\u0161ie povinnosti pre samospr\u00e1vu.
  Aj k nemu u\u017e chodia \u013eudia na \u00farad sa p\u00fdta\u0165, povedal im,
  \u017ee zatia\u013e t\u00fato podporu nedostan\u00fa, k\u00fdm sa nedohodn\u00fa
  alebo nedostan\u00fa vysvetlenie \u010di je to ich povinnos\u0165. Nebr\u00e1nia
  sa tomu,  len si vie predstavi\u0165, ke\u010f d\u00e1 do jednej rodiny 200 k\u00edl
  m\u00faky a 200 potrav\u00edn, \u017ee t\u00e1to pomoc skon\u010d\u00ed o tri dni
  v dedinskej \u010dasti na k\u0155menie \u017eivo\u010d\u00edchov. Netreba to rozd\u00e1va\u0165
  celoplo\u0161ne, treba  zavies\u0165 in\u00fd syst\u00e9m, \u010diastkove, po etap\u00e1ch.
  Chce vedie\u0165, ak\u00e1 je povinnos\u0165 samospr\u00e1vy v tomto smere kona\u0165.
  Nevie si predstavi\u0165, ke\u010f m\u00e1 720 odk\u00e1zan\u00fdch \u013eud\u00ed,
  \u017ee by 14 ton m\u00faky mal niekde uskladni\u0165. Preto by si mali vz\u00e1jomne
  vysvetli\u0165, ako postupova\u0165 vo vz\u0165ahu k tejto potravinovej pomoci.\\np.
  Hlinka, starosta M\u010c Ko\u0161ice \u2013 Juh: To nie je prv\u00fd pr\u00edpad,
  \u010do hovoril p\u00e1n predseda, lebo dostali aj \u010fal\u0161ie \u00falohy,
  ktor\u00e9 neboli finan\u010dne ani person\u00e1lne zabezpe\u010den\u00e9, napr.
  digit\u00e1lna byrokracia, to \u010do musia od nov\u00e9ho roka povinne zverej\u0148ova\u0165
  na svojich str\u00e1nkach, \u010do sa t\u00fdka \u00fa\u010dtovn\u00fdch dokladov,
  zml\u00fav a podobne. \u0160t\u00e1t prij\u00edma r\u00f4zne  nariadenia a z\u00e1kony,
  ktor\u00e9 nie s\u00fa v\u017edy dostato\u010dne domyslen\u00e9, na konci je realiza\u010dn\u00e1
  f\u00e1za a starostovia a prim\u00e1tori s\u00fa povinn\u00ed, pokia\u013e chc\u00fa
  obst\u00e1\u0165, \u00falohy zabezpe\u010di\u0165 tak, aby sa nedostali do rozporu
  so z\u00e1konom. \u010co sa t\u00fdka potravinovej pomoci, nie je povinnos\u0165
  explicitne v tej smernici Po\u013enohospod\u00e1rskej platobnej agent\u00fary nikde
  nap\u00edsan\u00e1. Predpoklad\u00e1 sa, \u017ee pod\u013ea z\u00e1ujmu a pod\u013ea
  miestnych podmienok obce, ktor\u00e9 maj\u00fa o to z\u00e1ujem, m\u00f4\u017eu
  sa tejto pomoci uja\u0165. Je to pod\u013ea neho na b\u00e1ze vlastn\u00e9ho uv\u00e1\u017eenia,
  mo\u017enost\u00ed a potrieb. Pomoc nie je ur\u010den\u00e1 hocikomu, je to nap\u00edsan\u00e9,
  teda pre t\u00fdch \u010do s\u00fa poberatelia d\u00e1vok v hmotnej n\u00fadzi alebo
  poberate\u013emi d\u00e1vok soci\u00e1lneho poistenia, t.j. d\u00f4chodkov do 305
  eur, alebo osoby, ktor\u00fdm s\u00fa deti zveren\u00e9 do n\u00e1hradnej starostlivosti
  rozhodnut\u00edm s\u00fadu. Oni u\u017e v minulosti zriadili v r\u00e1mci jed\u00e1lne
  pre d\u00f4chodcov na Vojvodskej ulici v\u00fddaj\u0148u Potravinovej banky minul\u00fd
  rok, teda s t\u00fdmto zdru\u017een\u00edm spolupracuj\u00fa u\u017e sk\u00f4r ,
  nielen pri tejto potravinovej pomoci. U nich s\u00fa vytvoren\u00e9 priestorov\u00e9
  podmienky, ke\u010f ich oslovili s ponukou, sk\u00fasili to realizova\u0165, v Ko\u0161iciach
  boli s\u00edce prv\u00ed, ale v r\u00e1mci Slovenska sa t\u00e1to pomoc u\u017e
  rozde\u013euje v niektor\u00fdch obciach. Pomoc sa ned\u00e1va len jednotliv\u00fdm
  fyzick\u00fdm osob\u00e1m, ale pomoc bola u\u017e rozdan\u00e1 aj do domovov pre
  star\u00fdch \u013eud\u00ed a detsk\u00fdch domovov. \u010co sa t\u00fdka objemu,
  m\u00f4\u017eu si myslie\u0165 \u010do chc\u00fa, jemu sa zd\u00e1 tie\u017e ve\u013ea
  na osobu, ale je nap\u00edsan\u00e9, \u017ee je to maxim\u00e1lna pomoc, ktor\u00fa
  m\u00f4\u017ee dosta\u0165. Obec m\u00f4\u017ee zv\u00e1\u017ei\u0165, \u017ee bude
  rozd\u00e1va\u0165 len po 10 k\u00edl, aby to ne\u0161lo mimo. T\u00e1 pomoc nie
  je jednorazov\u00e1, niekto si to rozdel\u00ed na dve alebo tri etapy, tak t\u00e1
  pomoc by mu mala by\u0165 poskytnut\u00e1 do konca roka op\u00e4tovne. Raz si zoberie
  10 k\u00edl, potom len p\u00e4\u0165 a e\u0161te raz pr\u00edde pre p\u00e4\u0165
  k\u00edl. Vedie sa o tom evidencia, treba to zdokladova\u0165, kto prevzal a ko\u013eko,
  z ak\u00e9ho pr\u00e1vneho titulu to bolo niekomu dan\u00e9. Ak maj\u00fa na to
  podmienky, treba to robi\u0165, ak nie, je to in\u00e1 ot\u00e1zka. Mysl\u00ed si,
  \u017ee to ni\u010d v podstate nerie\u0161i, bolo by sk\u00f4r treba, aby sa zv\u00fd\u0161ila
  zamestnanos\u0165 a aby sa zv\u00fd\u0161ili d\u00f4chodky, aby si \u013eudia mali
  z \u010doho nak\u00fapi\u0165, preto\u017ee po tejto jednorazovej pomoci sa na\u0161a
  najslab\u0161ia soci\u00e1lna skupina nebude ma\u0165 lep\u0161ie. Podpisuj\u00fa
  vyhl\u00e1senie, \u017ee sa zav\u00e4zuj\u00fa po prevzat\u00ed pomoci, \u017ee
  ju nepou\u017eij\u00fa na \u010fal\u0161\u00ed biznis, je to na nich. Ak by sa tak\u00e9
  pr\u00edpady uk\u00e1zali, \u017ee niekto v rodine zoberie na  viac os\u00f4b, m\u00f4\u017ee
  to by\u0165 nieko\u013eko sto k\u00edl, m\u00f4\u017ee by\u0165 z toho probl\u00e9m.
  Je to potom na rie\u0161enie org\u00e1nmi \u010dinn\u00fdch v trestnom konan\u00ed,
  o tom bli\u017e\u0161ie u\u017e nevie. Smernice nie s\u00fa pre nich z\u00e1v\u00e4zn\u00e9,
  lebo po\u013enohospod\u00e1rska agent\u00fara  nie je org\u00e1n, ktor\u00fd by
  im bol opr\u00e1vnen\u00fd nie\u010do naria\u010fova\u0165, ako \u00fazemnej samospr\u00e1ve.
  Je to na individu\u00e1lnych mo\u017enostiach a pos\u00faden\u00ed tej ktorej obce.\\n\\np.
  Balogov\u00e1, starostka M\u010c Ko\u0161ice \u2013 D\u017eung\u013ea: V M\u010c
  D\u017eung\u013ea to za\u010dalo fungova\u0165 hne\u010f na druh\u00fd de\u0148,
  ako v M\u010c Juh. Vyzvala ob\u010danov, aby doniesli v\u00fdmery alebo potvrdenia.
  Je to tak, \u017ee je to na poberate\u013ea d\u00e1vky v hmotnej n\u00fadzi, do
  jednej rodiny s 12-timi de\u0165mi ide 20 k\u00edl m\u00faky, 20 k\u00edl cestov\u00edn.
  Vyzbierala, dohodla sa v p. Urdz\u00edkom, kedy sa donesie tovar, \u013eudom to
  dala vedie\u0165, pri\u0161li, prevzali si. D\u00f4chodcom, ktor\u00ed s\u00fa bezvl\u00e1dni,
  odniesli to aktiva\u010dn\u00ed pracovn\u00edci, nebol s t\u00fdm \u017eiaden probl\u00e9m.
  Rozdali u\u017e 2,5 tony.\\np. Biro\u0161ov\u00e1, starostka M\u010c Ko\u0161ice
  \u2013 Po\u013eov: S\u00fa tu pre \u013eud\u00ed, samospr\u00e1va je najbli\u017e\u0161ie
  k ob\u010danovi, nechc\u00fa sa chova\u0165 tak, \u017ee to nebud\u00fa robi\u0165,
  lebo je to pre \u013eud\u00ed. Len ke\u010f tieto dve organiz\u00e1cie dostan\u00fa
  nejak\u00e9 finan\u010dn\u00e9 prostriedky, bolo by na mieste, keby dali ka\u017edej
  M\u010c napr. 100 eur. Nem\u00e1 ka\u017ed\u00fd aktiva\u010dn\u00fdch pracovn\u00edkov,
  m\u00e1 posla\u0165 \u013eud\u00ed z \u00faradu nosi\u0165? Treba zv\u00e1\u017ei\u0165,
  aby sa jeden nechoval maco\u0161sky, druh\u00fd pomp\u00e9zne, ale pre\u010do gr\u00e1tis,
  ke\u010f v Plus sedem dn\u00ed sa do\u010d\u00edtali, \u017ee s\u00fa zlatokopovia.
  M\u00f4\u017eu ich potom sp\u00e1ja\u0165 so starostom Mi\u017eig\u00e1rom zo  \u017dehry,
  ju to uraz\u00ed. Ke\u010f na tom niekto ry\u017eoval, mali by dosta\u0165 aspo\u0148
  omrvinky. Ka\u017ed\u00fd starosta chce pom\u00f4c\u0165, chce to rozd\u00e1va\u0165
  \u013eu\u010fom, len ak\u00fdm sp\u00f4sobom.\\np. Jen\u010dov\u00e1, starostka
  M\u010c Ko\u0161ice \u2013 Nad jazerom: poznamenala, \u017ee poberate\u013eom d\u00e1vky
  je len jeden \u010dlen dom\u00e1cnosti. To nem\u00e1 jasn\u00e9 ani \u00farad pr\u00e1ce,
  ani na \u0161kolen\u00ed to jasne nebolo povedan\u00e9. D\u00f4chodca je jasn\u00fd,
  ale kto sa mysl\u00ed pod poberate\u013eom  d\u00e1vky s 12-timi de\u0165mi, nemaj\u00fa
  to jasn\u00e9. Netreba rozd\u00e1va\u0165 sk\u00f4r, aby to nemuseli potom nahradi\u0165.\\np.
  Re\u0161tei, predseda Rady starostov: Sp\u00fdtal sa p. starostky Balogovej, \u010di
  to nie poru\u0161enie zmluvy s \u00faradom pr\u00e1ce, ke\u010f aktiva\u010dn\u00ed
  pracovn\u00edci vypom\u00e1haj\u00fa pri rozd\u00e1van\u00ed potrav\u00edn, \u010di
  to nie s\u00fa in\u00e9 \u010dinnosti, ako s\u00fa nap\u00edsan\u00e9 v projekte.\\np.
  Balogov\u00e1, starostka M\u010c Ko\u0161ice \u2013 D\u017eung\u013ea: V zmluve
  maj\u00fa nap\u00edsan\u00e9 aj pomocn\u00e9 pr\u00e1ce, m\u00f4\u017ee sa to teda
  za ne poklada\u0165.\\np. Bauer, starosta M\u010c Ko\u0161ice \u2013 Z\u00e1pad:
  V prvom let\u00e1ku bolo nap\u00edsan\u00e9, \u017ee pomoc bude distribuovan\u00e1
  charitat\u00edvnymi organiz\u00e1cia, d\u00e1 sa z toho dedukova\u0165, \u017ee
  za to zobrali naozaj peniaze. Teraz ten presun tej \u010dinnosti na samospr\u00e1vu
  je nekorektn\u00fd. Tie\u017e je za to, \u017ee treba pom\u00f4c\u0165 a ke\u010f
  maj\u00fa soci\u00e1lne veci, \u017ee to zorganizuj\u00fa. Mo\u017eno s nimi treba
  rokova\u0165 ofici\u00e1lne z \u00farovne ZMOSu, aby ak je mo\u017enos\u0165 z\u00edska\u0165
  nejak\u00e9 eur\u00f3pske peniaze, aby to pri\u0161lo. V mal\u00fdch M\u010c nie
  je tak\u00fd probl\u00e9m, ke\u010f je to 25 ton, ale vo ve\u013ek\u00fdch M\u010c
  by  to u\u017e mohlo by\u0165 250 ton, je to n\u00e1ro\u010dn\u00e9 na logistiku,
  kde to skladova\u0165, str\u00e1\u017ei\u0165,  vyd\u00e1va\u0165 \u2013 nie je
  to tak\u00e9 jednoduch\u00e9 zorganizova\u0165.\\np. Hlinka, starosta M\u010c Ko\u0161ice
  \u2013 Juh: Doposia\u013e vydali iba pre 100 os\u00f4b, v\u00e1ha je okolo 2000
  kg materi\u00e1lu. Nechodia naraz, lebo musia ma\u0165 potvrdenia z \u00faradu pr\u00e1ce
  alebo soci\u00e1lnej pois\u0165ovne o aktu\u00e1lnej v\u00fd\u0161ke d\u00f4chodku.
  Mnoh\u00ed sa sk\u00f4r chodia p\u00fdta\u0165, \u010do potrebuj\u00fa a dost\u00e1vaj\u00fa
  usmernenia, k\u00fdm to dones\u00fa, ubehn\u00fa 2-3 dni a tak sa to postupne rozklad\u00e1.\\n\\np.
  Kupec, starosta M\u010c Ko\u0161ice \u2013 Kave\u010dany: Pod\u013ea neho teraz
  toho nie je ve\u013ea, nie je n\u00e1val, lebo sa to rozbieha. V M\u010c Juh maj\u00fa
  d\u00f4chodcov,  bud\u00fa sa t\u00fdm zaobera\u0165 cel\u00fd rok, lebo je to mno\u017estvo.
  Chce poveda\u0165 to, \u017ee ho pri tom vyru\u0161uje to, \u017ee p. Urdz\u00edk
  ur\u010duje cez m\u00e9di\u00e1, \u010do maj\u00fa obce robi\u0165, nech sa \u013eudia
  id\u00fa informova\u0165 na obce, obce nevedia ni\u010d. Ktosi nie\u010do vymyslel,
  nie\u010do d\u00e1 a realizova\u0165 to maj\u00fa obce. Pova\u017euje to za neseri\u00f3zny
  pr\u00edstup. Pokia\u013e ide o Ko\u0161ice, ke\u010f sa nie\u010do t\u00fdka obce,
  obec je to mesto Ko\u0161ice, ale teraz \u2013 automaticky robte M\u010c, ale peniaze
  v\u00e1m netreba.\\np. Jen\u010dov\u00e1, starostka M\u010c Ko\u0161ice \u2013 Nad
  jazerom: Ke\u010f\u017ee je z toho chaos, navrhuje, aby p\u00e1novi Urdz\u00edkovi
  a t\u00fdm, ktor\u00ed to vymysleli, nap\u00edsali jeden otvoren\u00fd list a poslali
  ho do m\u00e9di\u00ed, aby \u013eudia nevinili ich, \u017ee nechc\u00fa. Nap\u00ed\u0161u,
  \u017ee to bolo nepripraven\u00e9, obce neboli informovan\u00e9, ako ko\u0161ick\u00ed
  starostovia maj\u00fa z\u00e1ujem, chc\u00fa \u2013 teda v tom duchu. Chodia za
  \u0148ou \u013eudia a nevie \u010do m\u00e1 robi\u0165. Ke\u010f sa to za\u010dalo
  distribuova\u0165, pred mesiacom malo by\u0165 jasn\u00e9, \u010do, ako, za \u010do,
  ak\u00e9 s\u00fa mo\u017enosti a potom to zverejni\u0165. Upozorni\u0165 na to,
  aby to nevyznelo tak, \u017ee starostovia nechc\u00fa.\\np. Re\u0161tei, predseda
  Rady starostov: Pod\u013ea neho pani starostka chcela pouk\u00e1za\u0165 na stav,
  \u017ee sa nebr\u00e1nia tomu, ale tak\u00fdto sp\u00f4sob prenosu t\u00fdchto kompetenci\u00ed
  sa im nep\u00e1\u010di, hodil sa probl\u00e9m  obciam bez toho, aby to bolo vysvetlen\u00e9.
  Ani na poslednej rade ZMOSu o tom nebolo hovoren\u00e9. Bol tu teda n\u00e1vrh,
  aby spracovali tak\u00fdto otvoren\u00fd list, chc\u00fa teda tak\u00fd list posla\u0165
  p. Urdz\u00edkovi aj do m\u00e9di\u00ed \u2013 pod\u013ea  reakci\u00ed starostov
  us\u00fadil, \u017ee nie je zhoda. Ke\u010f\u017ee je \u010dasov\u00fd priestor
  do 31.12.2011, zatia\u013e ich nem\u00f4\u017eu kritizova\u0165, lebo s\u00fa v
  term\u00edne. Nik \u010fal\u0161\u00ed u\u017e k tomu v diskusii nevyst\u00fapil,
  neprij\u00edmali k tomu ani uznesenie, len zobrali na vedomie, \u017ee je tak\u00fdto
  probl\u00e9m.\\n\\n*  *  *\\n\\n16. Z\u00e1ver\\n\\np. Re\u0161tei, predseda Rady
  starostov: Skon\u0161tatoval, \u017ee program rokovania vy\u010derpali. Poprosil
  \u010dlenov komisie schv\u00e1lenej na druhom rokovan\u00ed RS, \u017ee na bud\u00faci
  t\u00fd\u017ede\u0148 po doladen\u00ed term\u00ednu s p. prim\u00e1torom, by tak\u00e9to
  stretnutie urobili na magistr\u00e1te, alebo ak chce niekto pon\u00faknu\u0165 priestor
  \u00faradu, je mo\u017en\u00e9 aj tam. Ve\u013emi r\u00e1d by ich priv\u00edtal
  v \u0160aci na prvom takom stretnut\u00ed, ale prisp\u00f4sob\u00ed sa n\u00e1vrhu
  p. prim\u00e1tora. Mailom prepo\u0161le term\u00edn aj obsah rokovania. Po\u010fakoval
  pr\u00edtomn\u00fdm za \u00fa\u010das\u0165 a poprial im pekn\u00fd de\u0148.\\n\\nRudolf
  Re\u0161tei predseda Rady starostov\\n\\nZ\u00e1pisnica vyhotoven\u00e1 d\u0148a
  28.06.2011 Zapisovate\u013eka: Ing. Katar\u00edna Nov\u00e1kov\u00e1\\n\\nOverovatelia
