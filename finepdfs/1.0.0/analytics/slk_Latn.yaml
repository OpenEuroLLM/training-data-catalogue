  sp\u00f4sobom participuj\u00fa vo futbale ako takom. Od teraz v\u0161etci klubov\u00ed
  mana\u0163\u00e9ri a tie\u0163 sekret\u00e1ri v\u0161etk\u00fdch region\u00e1lnych
