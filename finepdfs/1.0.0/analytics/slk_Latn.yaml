sample: '["\"Zdru\u017eenie z\u00e1kladn\u00fdch \u0161k\u00f4l Slovenska\\n\\nV\u00e1\u017een\u00fd
  p\u00e1n Mgr. Branislav Gr\u00f6hling minister \u0161kolstva, vedy, v\u00fdskumu
  a \u0161portu SR M\u0160VVa\u0160 SR Stromov\u00e1 1 813 30 Bratislava\\n\\nV Bratislave
  11. 6. 2020\\n\\nV\u00e1\u017een\u00fd p\u00e1n minister, obraciame sa na v\u00e1s
  s po\u017eiadavkou o promtn\u00e9 a bezodkladn\u00e9  rie\u0161enie probl\u00e9mu,
  ktor\u00fd sa t\u00fdka e-Govermentu a vykonate\u013enosti z\u00e1konov \u010d.
  305/2013 Z. z. o elektronickej podobe v\u00fdkonu p\u00f4sobnosti org\u00e1nov verejnej
  moci \u010di \u00a7 5 ods. 3 a 4 z\u00e1kona \u010d. 596/2003 Z. z. o \u0161t\u00e1tnej
  spr\u00e1ve v \u0161kolstve. Pod\u013ea neho je riadite\u013e \u0161koly (z\u00e1kladnej
  i strednej) povinn\u00fd vyd\u00e1va\u0165 rozhodnutia v zmysle spr\u00e1vneho konania
  ako elektronick\u00e9 \u00faradn\u00e9 dokumenty. V s\u00fa\u010dasnosti s\u00fa
  v\u0161ak tieto akty pr\u00e1vne nevykonate\u013en\u00e9, nako\u013eko:\\n\\nNa
  Slovensku ch\u00fdba syst\u00e9m elektronickej registrat\u00fary integrovan\u00fd
  na e-gov infra\u0161trukt\u00faru UPVS a prepojen\u00fd s agendov\u00fdm syst\u00e9mom
  \u0161k\u00f4l (aSc Agenda alebo e\u0160kola); Z\u0160 i S\u0160 by taktie\u017e
  potrebovali, aby elektronick\u00fd syst\u00e9m \u0161kole umo\u017e\u0148oval dlhodobo
  uklada\u0165  dokumenty s elektronick\u00fdm  podpisom (napr. aj  triedne knihy,
  triedne v\u00fdkazy a pod.) \u2013 aj z toho d\u00f4vodu je nutn\u00e9 prepojenie
  syst\u00e9mov, k vyd\u00e1vaniu rozhodnut\u00ed v zmysle spr\u00e1vneho konania
  by \u0161koly potrebovali ma\u0165 vytvoren\u00e9 elektronick\u00e9 formul\u00e1re
  (tie malo vytvori\u0165 M\u0160VVa\u0160 SR k 31.1.2018).\\n\\nV s\u00fa\u010dasnosti
  tak\u00fdto syst\u00e9m ch\u00fdba. Ak \u0161kola chce dodr\u017ea\u0165 z\u00e1kon,
  mus\u00ed rozhodnutia vyd\u00e1va\u0165 po  jednom ako elektronick\u00e9 \u00faradn\u00e9
  dokumenty cez port\u00e1l slovensko.sk, \u010do je proces mimoriadne zd\u013ahav\u00fd
  a pr\u00e1cny. Port\u00e1l nem\u00e1 funkcionality, ktor\u00e9 by \u0161kola pri
  vytv\u00e1ran\u00ed rozhodnut\u00ed elektronicky potrebovala, ako napr. dolo\u017eku
  autoriz\u00e1cie, sl\u00fa\u017eiacu na vytv\u00e1ranie listinnej podoby pre ob\u010danov
  maj\u00facich schr\u00e1nku aktivovan\u00fa. Na problematiku ch\u00fdbaj\u00facich
  n\u00e1strojov port\u00e1lu slovensko.sk upozor\u0148ovala pred rokom aj starostka
  obce Kynce\u013eov\u00e1, Ing. Martina Kubi\u0161ov\u00e1, probl\u00e9m nie je nov\u00fd,
  no zatia\u013e bez efekt\u00edvneho rie\u0161enia.\\n\\nNavy\u0161e len minimum
  z\u00e1konn\u00fdch z\u00e1stupcov m\u00e1 aktivovan\u00fa schr\u00e1nku na doru\u010dovanie;
  Do m\u00e1ja 2020 je aktivovan\u00fdch len 113.000 schr\u00e1nok, pri\u010dom \u0161t\u00e1t
  ich vytvoril okolo 5 mili\u00f3nov.\\n\\n\u010co to znamen\u00e1 pre \u0161kolu?\\n\\nDrviv\u00fa
  v\u00e4\u010d\u0161inu rozhodnut\u00ed by mala vyr\u00e1ba\u0165 mimoriadne komplikovane
  -  najprv ako elektronick\u00fd origin\u00e1l, n\u00e1sledne je potrebn\u00e9 z
  neho vytla\u010di\u0165 listinn\u00fd rovnopis v predp\u00edsanej forme.\\n\\ntelef\u00f3n:
  0904 765 188, 0905 279 259  mail:\\n\\nfirstname.lastname@example.org\\n\\nZdru\u017eenie
  z\u00e1kladn\u00fdch \u0161k\u00f4l Slovenska\\n\\nJe potrebn\u00e9 naraz pracova\u0165
  v troch navz\u00e1jom neprepojen\u00fdch syst\u00e9moch \u2013 agendovom syst\u00e9me
  s d\u00e1tami det\u00ed (aSc Agenda alebo e\u0160kola), registrat\u00fare a aj slovensko.sk.
  Ve\u013ea \u0161k\u00f4l ani elektronick\u00fa registrat\u00faru nem\u00e1 a do\u0161l\u00fa
  a odoslan\u00fa po\u0161tu zapisuje len do kn\u00edh.\\n\\nDnes existuje mo\u017enos\u0165
  doplni\u0165 do elektronick\u00fdch schr\u00e1nok \u0161k\u00f4l (ale aj obc\u00ed
  a in\u00fdch OVM) ch\u00fdbaj\u00facu dolo\u017eku autoriz\u00e1cie. Vie tak v\u0161ak
  vykona\u0165 v\u00fdlu\u010dne prev\u00e1dzkovate\u013e port\u00e1lu slovensko.sk,
  a t\u00fdm je N\u00e1rodn\u00e1 agent\u00fara pre sie\u0165ov\u00e9 a elektronick\u00e9
  slu\u017eby (NASES). T\u00e1to organiz\u00e1cia spad\u00e1 pod UPVII, teda pod \u00darad
  podpredsedn\u00ed\u010dky vl\u00e1dy SR pre invest\u00edcie a informatiz\u00e1ciu.\\n\\nProblematiku
  roky so \u0161kolami i obcami rie\u0161i pani Ing. Erika Kusyov\u00e1 ( kontakt:
  Erika Kusyov\u00e1,   email@example.com; 0908 907 915).  Mysl\u00edme si, \u017ee
  je t\u00fdm odborn\u00edkom, ktor\u00fd by v spolupr\u00e1ci s Ministerstvom \u0161kolstva,
  vedy, v\u00fdskumu a \u0161portu SR,  pr\u00edpadne s Ministerstvom pre invest\u00edcie
  a region\u00e1lny rozvoj vedel pom\u00f4c\u0165 vyrie\u0161i\u0165 tento probl\u00e9m
  a  umo\u017enil \u0161kol\u00e1m dodnes pr\u00e1vne nevykon\u00e1vate\u013en\u00e9
  akty zre\u00e1lni\u0165.\\n\\nZ\u00e1konn\u00e9 povinnosti v elektronickej podobe
  prib\u00fadaj\u00fa a je nevyhnutn\u00e9 aby sa za\u010dalo systematicky pracova\u0165
  na tom, aby \u0161koly na splnenie povinnost\u00ed mali primeran\u00e9 n\u00e1stroje.
  Ide\u00e1lne by bolo rie\u0161enie centralizovan\u00e9, aby \u0161koly neh\u013eadali
  \u010diastkov\u00e9 rie\u0161enia u r\u00f4znych dod\u00e1vate\u013eov. Potrebujeme
  elektronick\u00fd syst\u00e9m, ktor\u00fd by zoh\u013ead\u0148oval v\u0161etky normy,
  ktor\u00fdmi sa \u0161kola mus\u00ed riadi\u0165: \u0161kolsk\u00fd z\u00e1kon,
  z\u00e1kon o egovernmente, o arch\u00edvoch a registrat\u00farach, o informa\u010dn\u00fdch
  technol\u00f3gi\u00e1ch vo verejnej spr\u00e1ve, o ochrane osobn\u00fdch \u00fadajov,
  o kybernetickej bezpe\u010dnosti a in\u00e9 s\u00favisiace technick\u00e9 normy.\\n\\nDnes
  si ka\u017ed\u00e1 \u0161kola mus\u00ed inform\u00e1cie zis\u0165ova\u0165 sama
  a sama \u201estava\u0165\\\" rie\u0161enia, \u010do je neefekt\u00edvne, n\u00e1kladn\u00e9
  a vznik\u00e1 riziko, \u017ee \u0161kola nevie pos\u00fadi\u0165, \u010di dod\u00e1van\u00e9
  rie\u0161enie je v s\u00falade s normami.\\n\\nPriv\u00edtali by sme, keby sme mohli
  u\u017e od nov\u00e9ho \u0161kolsk\u00e9ho roka vyd\u00e1va\u0165 rozhodnutia a
  \u010fal\u0161ie elektronick\u00e9 dokumenty v zmysle platnej legislat\u00edvy a  pre
  prij\u00edmacie konanie v tomto \u0161kolskom roku v mimoriadnej situ\u00e1cii  oslobodenie
  \u0161k\u00f4l od tejto povinnosti.  (mo\u017eno aj pod\u013ea \u00a7 150 ods. 8
  a \u00a7 161k z\u00e1kona \u010d. 245/2008 Z. z. o v\u00fdchove a vzdel\u00e1van\u00ed
  (\u0161kolsk\u00fd z\u00e1kon) a o zmene a doplnen\u00ed niektor\u00fdch z\u00e1konov
  v znen\u00ed neskor\u0161\u00edch predpisov.)\\n\\nZ\u00e1rove\u0148, by sme chceli
  po\u017eiada\u0165, aby pri rie\u0161en\u00ed tejto problematiky pre \u0161koly
  a pri jej finaliz\u00e1cii, bol prizvan\u00fd aj odborn\u00edk z praxe (napr. riadite\u013e
  \u0161koly), aby aplik\u00e1cia bola pou\u017e\u00edvate\u013esky pr\u00edstupn\u00e1
  a pr\u00e1ca s \u0148ou \u010dasovo nen\u00e1ro\u010dn\u00e1.\\n\\nS pozdravom,\\n\\nMgr.
  Alena Pet\u00e1kov\u00e1 prezidentka ZZ\u0160S\"", "\"Sudcovsk\u00e1 rada Najvy\u0161\u0161ieho
  s\u00fadu Slovenskej republiky\\n\\nV Bratislave 1. febru\u00e1ra  2012 SRns  1/2012\\n\\nV
  zmysle \u010dl\u00e1nku IV ods.2 bod a/, b/, d/  Rokovacieho poriadku Sudcovskej
  rady Najvy\u0161\u0161ieho s\u00fadu Slovenskej republiky\\n\\nZVOL\u00c1VAM\\n\\nriadne
  zasadnutie sudcovskej rady d\u0148a  6. febru\u00e1ra  2012 o 13.00. hod v miestnosti
  \u010d. 402 budova Najvy\u0161\u0161ieho s\u00fadu Slovenskej republiky\\n\\nProgram:\\n\\n1/
  Prerokovanie \u0161tatistick\u00fdch v\u00fdkazov jednotliv\u00fdch kol\u00e9gi\u00ed
  NS SR za rok 2011 ( referuj\u00fa \u010dlenovia sudcovskej rady za jednotliv\u00e9
  kol\u00e9gi\u00e1, v ktor\u00fdch p\u00f4sobia).\\n2/ Prerokovanie stavu person\u00e1lneho
  obsadenia jednotliv\u00fdch kol\u00e9gi\u00ed NS SR sudcami  ( referuj\u00fa \u010dlenovia
  sudcovskej rady za jednotliv\u00e9 kol\u00e9gi\u00e1, v ktor\u00fdch p\u00f4sobia).\\n3/
  N\u00e1vrh noveliz\u00e1cie  Rokovacieho poriadku Sudcovskej rady NS SR- vi\u010f
  uznesenie \u010d. 5/2012 z 9. janu\u00e1ra 2012 ( SRns 106/2011).\\n4/R\u00f4zne
  \u2013 \u0161tatistick\u00e9 v\u00fdkazy za janu\u00e1r 2012\\n\\nJUDr. Vladim\u00edr
  Magura predseda sudcovskej rady\"", "\"Sprievodca u\u017e\u00edvan\u00edm v\u00fd\u017eivov\u00fdch
  doplnkov\\n\\nKomunik\u00e1cia s rodi\u010dmi n\u00e1s priviedla k my\u0161lienke
  vytvori\u0165 preh\u013eadn\u00fd manu\u00e1l, ktor\u00fd V\u00e1m ulah\u010d\u00ed
  starostlivos\u0165 o seba aj Va\u0161u rodinu. Vytv\u00e1jali sme to s t\u00edmom
  odborn\u00edkov pod veden\u00edm sk\u00fasen\u00e9ho v\u00fd\u017eivov\u00e9ho \u0161pecialistu,
  v s\u00falade s postrehami rodi\u010dov. Vysvetl\u00ed V\u00e1m, pre\u010do s\u00fa
  vitam\u00edny a miner\u00e1ly d\u00f4le\u017eitou s\u00fa\u010das\u0165ou stravovania,
  kedy v\u00fd\u017eivov\u00e9 doplnky zaradi\u0165 do ka\u017edodennej rutiny, ak\u00fdm
  sp\u00f4sobom pristupova\u0165 k ich v\u00fdberu a d\u00e1vkovaniu, a ako zostavi\u0165
  vlastn\u00fd mix vitam\u00ednov a miner\u00e1lov.\\n\\nVer\u00edme, \u017ee v\u00fd\u017eivov\u00e9
  doplnky Beggs si obl\u00fab\u00edte a stan\u00fa sa prirodzenou s\u00fa\u010das\u0165ou
  V\u00e1\u0161ho \u017eivotn\u00e9ho \u0161t\u00fdlu.\\n\\nS \u00fasmievmom\\n\\nBeggs\\n\\nKEDY
  ZARADI\u0164 V\u00dd\u017dIVOV\u00c9 DOPLNKY AKO DOPLOK K VYV\u00c1\u017dENEJ A
  PESTREJ STRAVE\\n\\nPrim\u00e1rnym zdrojom v\u00fd\u017eivy je pr\u00edrodn\u00e1
  strava. Aj ke\u010f sa sna\u017e\u00edte konzumova\u0165 pestr\u00e9 a vyv\u00e1\u017een\u00e9
  jedl\u00e1, nikdy neviete, \u010di \u017eiviny, ktor\u00e9 z nich z\u00edskavate,
  pokr\u00fdvaj\u00fa skuto\u010dn\u00e9 v\u00fd\u017eivov\u00e9 potreby V\u00e1\u0161ho
  tela. Vedeck\u00e9 \u0161t\u00fadie uverejnen\u00e9 v lek\u00e1rskom magaz\u00edne
  Science Daily odhalili, \u017ee jed\u00e1lni\u010dek mnoh\u00fdch \u013eud\u00ed
  obsahuje niekedy len polovicu odpor\u00fa\u010dan\u00e9ho mno\u017estva hor\u010d\u00edka
  a kyseliny listovej. Asi 50 % dospel\u00fdch \u017eien a viac ne\u017e 70 % dospevaj\u00facich
  diev\u010dat m\u00e1 v potrave menej v\u00e1pnika, ako s\u00fa odpor\u00fa\u010dan\u00e9
  d\u00e1vky. Taktie\u017e vitam\u00ednov A, B6, B12, C, D, rovnako aj j\u00f3du,
  \u017eeleza a zinku je v be\u017enej strave zretelne menej ako m\u00e1 by\u0165.\\n\\nTehotenstvo,
  zv\u00fd\u0161en\u00e1 fyzick\u00e1 aktivita, vek, zdravotn\u00fd stav, r\u00f4zne
  typy por\u00fach, konzum\u00e1cia liekov, stres, pracovn\u00e1 z\u00e1taza, faj\u010denie,
  vegetari\u00e1nstvo \u010di niektor\u00e9 \u017eivotn\u00e9 udalosti, menia denn\u00fa
  potrebu \u017eiv\u00edn. Napr\u00edklad v obdob\u00ed tehotenstva a doj\u010denia
  sa zvy\u0161uje potreba ur\u010dit\u00fdch vitam\u00ednov a miner\u00e1lov a\u017e
  o 50%.\\n\\nDoplnky v\u00fd\u017eivy Beggs m\u00f4\u017eu optimalizova\u0165 medzery
  vo Va\u0161om stravovan\u00ed. Z\u00e1rove\u0148 ako doplnok k vyv\u00e1\u017eenej
  a pestrej strave dop\u013ania pr\u00edjem v\u00e4\u010d\u0161ieho mno\u017estva
  niektor\u00fdch \u017eiv\u00edn, ktor\u00e9 V\u00e1s organizmus m\u00f4\u017ee potrebova\u0165.\\n\\nV\u00ddHODY
  V\u00dd\u017dIVOV\u00ddCH DOPLNKOV\\n\\nMo\u017eno aj Vy patr\u00edte k pravideln\u00fdm
  u\u017e\u00edvate\u013eom v\u00fd\u017eivov\u00fdch doplnkov a presne neviete, z
  \u010doho s\u00fa zlo\u017een\u00e9 a ak\u00e9 s\u00fa ich \u00fa\u010dinky.\\n\\nVitam\u00edny\\nS\u00fa
  organick\u00e9 zl\u00fa\u010deniny, ktor\u00e9 sa z\u00fa\u010dast\u0148uj\u00fa
  regul\u00e1cie metabolick\u00fdch funkci\u00ed v bunk\u00e1ch a procesov uvo\u013e\u0148uj\u00facich
  energiu z potrav\u00edn.\\n\\nPozn\u00e1me celkom 13 vitam\u00ednov. Delia sa na
  vitam\u00edny rozpustn\u00e9 v tukoch (A,D,E,K) alebo vo vode (vitam\u00edny skupiny
  B a vitam\u00edn C). Rozl\u00ed\u0161enie medzi vitam\u00ednmi rozpustn\u00fdmi
  v tuku a vo vode je d\u00f4le\u017eit\u00e9, preto\u017ee vitam\u00edny rozpustn\u00e9
  v tukoch sa ukladaj\u00fa na relat\u00edvne dlh\u00fa dobu - mesiace alebo dokonca
  roky. Vitam\u00edny rozpustn\u00e9 vo vode, s v\u00fdnimkou vitam\u00ednu B12, zost\u00e1vaj\u00fa
  v organizme kr\u00e1tko. Preto je vhodn\u00e9 tieto vitam\u00edny dop\u013a\u0148a\u0165.\\n\\nOkrem
  nieko\u013ek\u00fdch v\u00fdnimiek - najm\u00e4 vitam\u00ednov D a K - si telo nedok\u00e1\u017ee
  vitam\u00edny vytv\u00e1ra\u0165 sam\u00e9. Ich pr\u00edjem je mo\u017en\u00e9 zabezpe\u010di\u0165
  pestrou stravou, ktor\u00fa je mo\u017en\u00e9 doplni\u0165 o v\u00fd\u017eivov\u00e9
  doplnky.\\n\\n---\\n\\n1 https://www.sciencedaily.com/releases/2013/10/131031090348.htm\\n2
  https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7926714/\\n\\nMiner\u00e1ly\\nS\u00fa
  v tele obsiahnut\u00e9 v mal\u00fdch mno\u017estv\u00e1ch. Celkovo predstavuj\u00fa
  asi 4 % telesnej v\u00e1hy. Tieto anorganick\u00e9 l\u00e1tky sa z\u00fa\u010dast\u0148uj\u00fa
  cel\u00e9ho radu \u017eivotn\u00fdch procesov.\\n\\nViac ako 60 r\u00f4znych miner\u00e1lov
  v tele sa sklad\u00e1 len z 22 nevyhnutn\u00fdch prvkov. Z nich sedem - v\u00e1pnik,
  chl\u00f3r, hor\u010d\u00edk, drasl\u00edk a s\u00edra - sa obvykle pova\u017euj\u00fa
  za hlavn\u00e9 prvky. \u010eal\u0161\u00edch 15 s\u00fa stopov\u00e9 prvky, preto\u017ee
  ich mno\u017estvo, ktor\u00e9 \u010dlovek denne potrebuje je nepatrn\u00e9.\\n\\nRastlinn\u00e9
  v\u00fdta\u017eky\\nMnoh\u00e9 rastliny obsahuj\u00fa nieko\u013eko aktivn\u00fdch
  l\u00e1tok, ktor\u00e9 na seba p\u00f4sobia. Rastlinn\u00e9 doplnky sa pripravuj\u00fa
  hlavne z ich listov, kvetov, v\u00fdate, kore\u0148ov alebo k\u00f4ry.\\n\\n\u010eal\u0161ie
  skupiny l\u00e1tok\\nS\u00fa rastlinn\u00e9ho alebo \u017eivo\u010di\u0161n\u00e9ho
  p\u00f4vodu, niektor\u00e9 sa pripravuj\u00fa v laborat\u00f3ri\u00e1ch. Medzi tieto
  skupiny l\u00e1tok patria ryb\u00ed tuk, rastlinn\u00e9 oleje, zlu\u010deniny, ako
  s\u00fa flavonoidy, s\u00f3jov\u00e9 izoflav\u00f3ny a karotenoidy, nach\u00e1dzaj\u00face
  sa v ovoc\u00ed a zelenine, riasy, v\u010delie produkty, koenz\u00fdm Q10, probiotik\u00e1,
  prebiotik\u00e1, vl\u00e1kna, lecit\u00edn, chol\u00edn, glukoza-m\u00edn, v\u00fdta\u017eok
  z hroznov\u00fdch jadierok, bromela\u00edn, kyselina alfa-lipoov\u00e1, aminokyseliny
  a mnnoho \u010fal\u0161\u00edch.\\n\\nVitam\u00edny, miner\u00e1ly, rastlinn\u00e9
  v\u00fdta\u017eky a \u010fal\u0161ie skupiny l\u00e1tok, z ktor\u00fdch sa pripravuj\u00fa
  formuly doplnkov v\u00fd\u017eivy maj\u00fa cel\u00fd rad funkci\u00ed:\\n\\n- Prispievaj\u00fa
  k norm\u00e1lnej \u010dinnosti imunitn\u00e9ho syst\u00e9mu, ako napr\u00edklad
  vitam\u00edn C, fol\u00e1t alebo zinok\\n- Prispievaj\u00fa k norm\u00e1lnej \u010dinnosti
  mozgu a nervovej s\u00fastavy, ako napr\u00edklad vitam\u00edn B6, biot\u00edn alebo
  nia\u010din\\n- Prispievaj\u00fa k norm\u00e1lnemu stavu zraku, ako napr\u00edklad
  zinok alebo riboflavin\\n- Prispievaj\u00fa k norm\u00e1lnej \u010dinnosti srdca,
  ako napr\u00edklad kyselina eikozapenta\u00e9nov\u00e1, kyselina dokozahexa\u00e9nov\u00e1
  alebo tiam\u00edn\\n- Prispievaj\u00fa k udr\u017eaniu norm\u00e1lneho krvn\u00e9ho
  tlaku, ako napr\u00edklad kyselina eikozapenta\u00e9nov\u00e1 a kyselina dokozahexa\u00e9nov\u00e1\\n-
  Prispievaj\u00fa k norm\u00e1lnej psychickej \u010dinnosti, ako napr\u00edklad vitam\u00edn
  C, vitam\u00edn B6 alebo hor\u010d\u00edk\\n- Prispievaj\u00fa k norm\u00e1lnej
  tvorbe \u010derven\u00fdch krvniek, ako napr\u00edklad riboflavin, \u017eelezo alebo
  vitam\u00edn B12\\n- Prispievaj\u00fa k zn\u00ed\u017eeniu miery \u00fanavy a vy\u010derpania,
  ako napr\u00edklad hor\u010d\u00edk, nia\u010din alebo vitam\u00edn C\\n- Prispievaj\u00fa
  k regul\u00e1cii hormon\u00e1lnej aktivity, ako napr\u00edklad zinok, fol\u00e1t
  alebo j\u00f3d\\n- Prispievaj\u00fa k norm\u00e1lnej \u010dinnosti svalov, ako napr\u00edklad
  v\u00e1pnik alebo vitam\u00edn D\\n- Prispievaj\u00fa k udr\u017eaniu norm\u00e1lneho
  stavu kost\u00ed, ako napr\u00edklad hor\u010d\u00edk, mang\u00e1n alebo vitam\u00edn
  D\\n- Prispievaj\u00fa k udr\u017eaniu norm\u00e1lneho stavu zubov, ako napr\u00edklad
  vitam\u00edn D alebo hor\u010d\u00edk\\n- Prispievaj\u00fa k norm\u00e1lnej synt\u00e9ze
  DNA, ako napr\u00edklad zinok, fol\u00e1t alebo \u017eelezo\\n- Prispievaj\u00fa
  k norm\u00e1lnej plodnosti a reprodukcii, ako napr\u00edklad sel\u00e9n, vitam\u00edn
  B12 alebo vitam\u00edn D\\n- Prispievaj\u00fa k udr\u017eaniu norm\u00e1lneho stavu
  kost\u00ed, vlasov, nechtov a poko\u017eky, ako napr\u00edklad v\u00e1pnik, riboflavin
  alebo biot\u00edn\\n- Prispievaj\u00fa k ochrane buniek pred oxida\u010dn\u00fdm
  stresom, ako napr\u00edklad vitam\u00edn E, vitam\u00edn C alebo mang\u00e1n\\n-
  Prispievaj\u00fa k udr\u017eaniu norm\u00e1lneho stavu kost\u00ed, ako napr\u00edklad
  vitam\u00edn D alebo zinok\\n- Podielaj\u00fa sa na procese delenia buniek, ako
  napr\u00edklad \u017eelezo, fol\u00e1t alebo hor\u010d\u00edk\\n\\n---\\n\\n1 Priazniv\u00e9
  \u00fa\u010dinky je mo\u017en\u00e9 dosiahnu\u0165 pri pr\u00edjme 250 mg EPA a
  DHA denne.\\n4 Priazniv\u00e9 \u00fa\u010dinky je mo\u017en\u00e9 dosiahnu\u0165
  pri pr\u00edjme 3 g EPA a DHA denne. Doplnkov\u00fd pr\u00edjem nesmie prekro\u010di\u0165
  5 g denne kombin\u00e1ciou EPA a DHA.\\n\\nDobre vyv\u00e1\u017een\u00e1 strava
  poskytuje telu \u017eiviny k optim\u00e1lnemu fungovaniu. Jej nedostatok men\u00ed
  telesn\u00e9 funkcie a procesy na najz\u00e1kladnej\u0161ej bunkovej \u00farovni.
  To, \u017ee Va\u0161mu organizmu ch\u00fdbaj\u00fa niektor\u00e9 vitam\u00edny a
  miner\u00e1ly zistite na z\u00e1klade telesn\u00fdch pr\u00edznakov, ak\u00fdmi
  m\u00f4\u017eu by\u0165:\\n\\n- Ospalost\\n- \u00danava, vy\u010derpanie\\n- Studen\u00e9
  ruky\\n- Stres\\n- Nervozita\\n- Podr\u00e1\u017edenos\u0165\\n- Bledos\u0165\\n-
  Neobvykl\u00e1 t\u00fa\u017eba po jedle\\n- Probl\u00e9my s koncentr\u00e1ciou\\n-
  Neprijemn\u00e9 pocit\u00ed v doln\u00fdch kon\u010datin\u00e1ch\\n- Zl\u00e1 kvalita
  vlasov\\n- L\u00e1mavost nechtov\\n- V\u00fdskyt k\u00fatikov \u010di praskl\u00edn
  v \u00fastach a okolo \u00fast\\n\\nAKO NA V\u00ddBER V\u00dd\u017dIVOV\u00ddCH
  DOPLNKOV\\nZISTITE, \u010cO VA\u0160E T\u011aLO POTREBUJE\\n\\nVa\u0161e nutri\u010dn\u00e9
  po\u017eiadavky sa st\u00e1le menia. Vek, stres, choroba, stravovacie obmedzenia,
  \u0161portov\u00fd v\u00fdkon, \u00fanava, tehotenstvo, doj\u010denie \u010di menopauza
  m\u00f4\u017eu zvy\u0161ova\u0165 potrebu niektor\u00fdch \u017eiv\u00edn. Napr\u00edklad
  pred po\u010dat\u00edm, po\u010das tehotenstva a v obdob\u00ed doj\u010denia je
  vhodn\u00e9 jed\u00e1lni\u010dek pravidelne dop\u013a\u0148a\u0165 o kyselinu listov\u00fa,
  \u017eelezo, v\u00e1pnik, hor\u010d\u00edk a \u010fal\u0161ie vitam\u00edny. \u017deny
  v menopauze by zase mali dba\u0165 na dostato\u010dn\u00fd pr\u00edjem v\u00e1pnika,
  vitam\u00ednov D, E a skupiny B.\\n\\nVek\\nKa\u017ed\u00e1 vekov\u00e1 skupina
  vy\u017eaduje in\u00e9 mno\u017estvo vitam\u00ednov a miner\u00e1lov. S prib\u00fadaj\u00facim
  vekom sa zvy\u0161uje napr\u00edklad riziko nedostatku v\u00e1pnika, vitam\u00ednu
  D a \u201edobr\u00fdch bakt\u00e9ri\u00ed\u201c, ktor\u00e9 \u010delia zmen\u00e1m
  \u010drevnej mikrofl\u00f3ry.\\n\\nU\u017e\u00edvanie liekov\\nK\u00fdm za\u010dnete
  u\u017e\u00edva\u0165 ak\u00fdko\u013evek v\u00fd\u017eivov\u00fd doplnok, porozpr\u00e1vajte
  sa so svoj\u00edm lek\u00e1rom. Niektor\u00e9 doplnky v\u00fd\u017eivy m\u00f4\u017eu
  ma\u0165 interakcie s liekmi alebo ma\u0165 ved\u013eaj\u0161ie \u00fa\u010dinky,
  o ktor\u00fdch by ste mali vedie\u0165.\\n\\nTyp stravy\\nMajte preh\u013ead o tom,
  \u010do jete a ak\u00fdm potravin\u00e1m sa vyh\u00fdbate. Pokia\u013e napr\u00edklad
  nekonzumujete ryby, ch\u00fdbaj\u00facu nutri\u010dn\u00fa medzeru m\u00f4\u017eete
  vyplni\u0165 doplnkom v\u00fd\u017eivy s obsahom Omega 3. V pr\u00edpade veg\u00e1nskej
  stravy doch\u00e1dza s najv\u00e4\u010d\u0161ou pravdepodobnos\u0165ou k nedostatku
  vitam\u00ednu B12.\\n\\nPohlavie\\nMu\u017ei a \u017eeny maj\u00fa r\u00f4zne nutri\u010dn\u00e9
  potreby. U \u017eien s\u00fa rozdiely najdramatickej\u0161ie po\u010das tehotenstva,
  doj\u010denia, pred a po menopauze.\\n\\nAktu\u00e1lny stav\\nNechajte sa diagnostikova\u0165
  a zistite, ak\u00e9 druhy a mno\u017estvo vitam\u00ednov a miner\u00e1lov potrebujete.
  Napr\u00edklad pr\u00edli\u0161 ve\u013ea vitam\u00ednu A m\u00f4\u017ee sp\u00f4sobi\u0165
  bolesti hlavy, po\u0161kodenie pe\u010dene, zn\u00ed\u017ei\u0165 pevnos\u0165 kost\u00ed
  a sp\u00f4sobi\u0165 vrodene vady.\\n\\nTehotenstvo\\nV\u00fd\u017eiva matky pred
  tehotenstvom a po\u010das neho je d\u00f4le\u017eit\u00e1 pre spr\u00e1vny v\u00fdvoj
  a rast die\u0165ata. Pravideln\u00e9 dop\u013a\u0148anie kyseliny listovej zvy\u0161uje
  u tehotn\u00fdch \u017eien hladinu fol\u00e1tu. N\u00edzka hladina fol\u00e1tu u
  tehotn\u00fdch \u017eien je rizikov\u00fdm faktorom pre vznik v\u00e1d neur\u00e1lnej
  trubice u vyv\u00edjaj\u00faceho sa plodu.\\n\\nVYTVORITE PL\u00c1N\\n\\nPri v\u00fdbere
  doplnkov v\u00fd\u017eivy zva\u017ete svoje prim\u00e1rne ciele a oblasti, ktor\u00e9
  chcete podpori\u0165. Mal\u00ed by ste ma\u0165 jasno v tom, k \u010domu suplementy
  potrebujete a ak\u00e9 s\u00fa Va\u0161e konkr\u00e9tne ciele, ktor\u00e9 chcete
  dosiahnu\u0165. M\u00f4\u017eete si vybra\u0165 z r\u00f4znych cielen\u00fdch doplnkov
  v\u00fd\u017eivy pre optimaliz\u00e1ciu fungovania V\u00e1\u0161ho tela a podporu
  celkovej pohody.\\n\\nSTAROSTLIVOS\u0164 O MAMI\u010cKU A DIE\u0164A\\n\\nPr\u00edjem
  dostato\u010dn\u00e9ho mno\u017estva spr\u00e1vnych \u017eiv\u00edn je d\u00f4le\u017eit\u00fd
  v ka\u017edej f\u00e1ze \u017eivota. V tehotenstve je v\u0161ak obzvl\u00e1\u0161\u0165
  d\u00f4le\u017eit\u00e9, preto\u017ee potrebujete vy\u017eivova\u0165 seba aj svoje
  rast\u00face die\u0165a. V tomto obdob\u00ed je potrebn\u00e9 venova\u0165 zvl\u00e1\u0161tnu
  pozornos\u0165 zdrav\u00e9mu \u017eivotn\u00e9mu \u0161t\u00fdlu a jed\u00e1lni\u010dke.
  Prenat\u00e1lne a postratn\u00e9 v\u00fd\u017eivov\u00e9 doplnky s na\u0161im \u00fasmievom,
  sme vyvinuli tak, aby ako doplnok k pestrej a vyv\u00e1\u017eenej strave o V\u00e1s
  dbali v ka\u017edej f\u00e1ze tehotenstva.\\n\\nPrenat\u00e1lne suplementy\\n\\nS\u00fa
  ur\u010den\u00e9 pre \u017eeny, ktor\u00e9 pl\u00e1nuj\u00fa otehotnenie, alebo
  s\u00fa u\u017e tehotn\u00e9. Komplex vitam\u00ednov a miner\u00e1lov v t\u00fdchto
  doplnkoch je navrhnut\u00fd tak, aby ako doplnok k pestrej strave optimalizoval
  nutri\u010dn\u00e9 potreby V\u00e1\u0161ho tela, ktor\u00e9 zdie\u013eate s rast\u00facim
  dietatkom.\\n\\nD\u00d4LE\u017dIT\u00c9 \u017dIVINY V TEHOTENSTVE\\n\\nKyselina
  listov\u00e1 (fol\u00e1t, vitam\u00edn B9)\\nprispieva k rastu z\u00e1rodo\u010dn\u00fdch
  tkan\u00edv po\u010das\\ntehotenstva vr\u00e1tane placenty, podie\u013ea sa na\\nprocese
  delenia buniek a prispieva\\nk norm\u00e1lnej krvotvorbe.\\n\\n\u017delezo\\nsa
  tak tie\u017e podie\u013ea na procese delenia\\nbuniek. Pom\u00e1ha telu k norm\u00e1lnej
