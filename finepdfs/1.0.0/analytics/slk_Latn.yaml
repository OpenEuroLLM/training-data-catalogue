  po telefonickom dohovore na tel. \u010d\u00edsle: 0908547920 alebo u navrhovate\u013eov.\\n\\nVyjadri\u0165
  sa k podkladom je mo\u017en\u00e9 v lehote do 7 pracovn\u00fdch dn\u00ed odo d\u0148a
  doru\u010denia tohto ozn\u00e1menia.\\n\\nV rovnakej lehote pod\u013ea \u00a7 36
