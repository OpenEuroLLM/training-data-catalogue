  va\u0161e podnikov\u00e9 \u00fadaje a \u00fadaje zamestnancov sa nedostan\u00fa
  do nespr\u00e1vnych r\u00fak.\\n\\nProduktivita nebude obmedzen\u00e1 s trval\u00fdm
