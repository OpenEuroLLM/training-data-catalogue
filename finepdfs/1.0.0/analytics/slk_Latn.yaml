  2,90 \u20ac\"", "\"Rada starostov v Ko\u0161iciach\\n\\nZ\u00e1pisnica\\n\\nzo 6.
  rokovania Rady starostov v Ko\u0161iciach zo d\u0148a 14.6.2011\\n\\nPr\u00edtomn\u00ed:
  pod\u013ea prezen\u010dnej listiny\\n\\nRokovanie otvoril a viedol predseda Rady
  starostov v Ko\u0161iciach Rudolf Re\u0161tei. V \u00favode rokovania bolo pr\u00edtomn\u00fdch
  14 starostov a rada bola uzn\u00e1\u0161ania schopn\u00e1.\\n\\n\u00davod rokovania\\n\\np.
  Re\u0161tei, predseda Rady starostov - priv\u00edtal pr\u00edtomn\u00fdch starostov
  a uviedol, \u017ee rokovanie bolo zvolan\u00e9 v s\u00falade s rokovac\u00edm poriadkom
  RS, program dostali v pozv\u00e1nke, z rokovania sa ospravedlnili starostovia: p.
  Karabin, p. Kijevsk\u00e1 a p. Kri\u0161tof. Vyzval pr\u00edtomn\u00fdch na doplnenie
  programu. Navrhol v bode r\u00f4zne prerokova\u0165 n\u00e1vrh na spolo\u010dn\u00e9
  rie\u0161enie elektronick\u00fdch aukci\u00ed, kde bude informova\u0165 o mo\u017enosti
  spolo\u010dnosti Datalan, ktor\u00e1 u\u017e zabezpe\u010duje syst\u00e9m \u00fa\u010dtovn\u00edctva.
  \u010ealej v bode r\u00f4zne navrhol zaobera\u0165 sa ot\u00e1zkou potravinovej
  pomoci, ktor\u00e1 sa u\u017e za\u010dala v r\u00e1mci mesta realizova\u0165 a s\u00fa
  okolo toho nejasnosti.\\np. Biro\u0161ov\u00e1, starostka M\u010c Ko\u0161ice \u2013
  Po\u013eov: Podporila n\u00e1vrh predsedu RS na prerokovanie problematiky potravinovej
  pomoci, nako\u013eko dostali pokyn od Po\u013enohospod\u00e1rskej platobnej agent\u00fary
  a nie je jasn\u00e9, ako to bud\u00fa vykon\u00e1va\u0165, preto\u017ee to bud\u00fa
  ve\u013ek\u00e9 mno\u017estv\u00e1 potrav\u00edn.\\np. Kupec, starosta M\u010c Ko\u0161ice
  \u2013 Kave\u010dany: Sp\u00fdtal sa predsedu RS, \u010di ich bude informova\u0165
  oh\u013eadom ich vetovania rozpo\u010dtu, nako\u013eko v programe najbli\u017e\u0161ieho
  rokovania MZ to nie je zaraden\u00e9.\\np. Re\u0161tei, predseda Rady starostov
  \u2013 skon\u0161tatoval, \u017ee nie s\u00fa \u010fal\u0161ie n\u00e1vrhy na doplnenie
  programu. Dal hlasova\u0165 o programe rokovania aj s navrhnut\u00fdmi t\u00e9mami
  v bode r\u00f4zne.\\n\\nHlasovanie \u010d. 1 \u2013 za: 14, proti: -, zdr\u017eali
  sa: 1\\n\\np. Re\u0161tei, predseda Rady starostov - program rokovania bol schv\u00e1len\u00fd.
  Pred prerokovan\u00edm samotn\u00fdch bodov programu e\u0161te informoval o v\u00fdstupoch,
  ktor\u00e9 boli prijat\u00e9 na V. rokovan\u00ed RS 21.4.2011, kde prijali uznesenia
  v s\u00favislosti so schv\u00e1len\u00fdm rozpo\u010dtom mesta. E\u0161te v ten
  de\u0148 doru\u010dil uznesenia p. prim\u00e1torovi, ktor\u00fd sa rozhodol aj napriek
  ich stanovisku rozpo\u010det podp\u00edsa\u0165, ich argumenty neboli prijat\u00e9.
  P\u00e1n prim\u00e1tor s riadite\u013eom MMK boli pozvan\u00ed aj na toto rokovanie,
  no nie s\u00fa pr\u00edtomn\u00ed. Je potrebn\u00e9 do bud\u00facna rie\u0161i\u0165
  \u010fal\u0161ie kroky, preto\u017ee RS si neur\u010dila \u010fal\u0161\u00ed postup.
  Po\u017eiadali o znovu prerokovanie v MZ, no v programe rokovania to nie je zaraden\u00e9.
  Bolo povedan\u00e9, \u017ee finan\u010dn\u00fd obnos na transfer je na z\u00e1klade
  individu\u00e1lnych po\u017eiadaviek jednotliv\u00fdch mestsk\u00fdch \u010dast\u00ed.\\np.
  Kupec, starosta M\u010c Ko\u0161ice \u2013 Kave\u010dany: Pod\u013ea jeho n\u00e1zoru,
  ke\u010f\u017ee po\u017eiadali p. prim\u00e1tora aj zastupite\u013estvo o znovu
  prerokovanie, mal by predseda RS na rokovan\u00ed MZ vyst\u00fapi\u0165 a informova\u0165
  zastupite\u013estvo o tom, nech sa k tomu vyjadr\u00ed.\\n\\np. Petrvalsk\u00fd,
  starosta M\u010c Ko\u0161ice \u2013 S\u00eddlisko \u0164ahanovce: Z\u00fa\u010dastnil
  sa na  zasadnut\u00ed predsedn\u00edctva Rady starostov SDK\u00da Slovenska v Bratislave,
  kde \u0161t\u00e1tny tajomn\u00edk Ministerstva financi\u00ed ozn\u00e1mil, \u017ee
  za prv\u00fdch 6 mesiacov tohto roku samospr\u00e1vam bolo poslan\u00e9 o 23% pe\u0148az\u00ed
  viac ako v minulom roku. Vyhliadka do bud\u00faceho roku je \u010fal\u0161\u00ed
  n\u00e1rast o 15 a\u017e 17%, samospr\u00e1vy dostali v tomto roku pridan\u00e9
  o 23%. P\u00fdtal sa, pre\u010do sa oni na t\u00fdchto 23%-t\u00e1ch nepodie\u013eaj\u00fa.\\np.
  Kupec, starosta M\u010c Ko\u0161ice \u2013 Kave\u010dany: Na z\u00e1klade schv\u00e1lenia
  rozpo\u010dtu a platieb za prv\u00e9 mesiace,  mali by dosta\u0165 za prv\u00e9
  mesiace nejak\u00fd doplatok lebo dostali v ozdravnom re\u017eime menej, ale zatia\u013e
  ich nedost\u00e1vaj\u00fa. M\u00e1 inform\u00e1cie od kolegu starostu, \u017ee dostan\u00fa
  tie peniaze postupne ka\u017ed\u00fd mesiac do konca roka. Zadr\u017eiavaj\u00fa
  ich peniaze, ktor\u00e9 potrebuj\u00fa teraz, na konci roka ich nebude potrebova\u0165.
  Mali by po\u017eadova\u0165, aby im tieto peniaze dali teraz.\\np. Re\u0161tei,
  predseda Rady starostov \u2013 Navrhol, aby k tomu naformulovali a prijali uznesenie.\\np.
  Beca, starosta M\u010c Ko\u0161ice \u2013 Vy\u0161n\u00e9 Op\u00e1tske: Navrhol,
  aby sa zamysleli nad nejak\u00fdm syst\u00e9mom, lebo takto nem\u00f4\u017eu 4 roky
  fungova\u0165, mali by dohodn\u00fa\u0165 nejak\u00e9 pravidl\u00e1. Po\u017eiadal
  predsedu RS, aby navrhol prim\u00e1torovi, nech  sa s n\u00edm stretn\u00fa 2-3
  starostovia, nech si povedia z\u00e1kladn\u00e9 pravidl\u00e1, lebo stav \u2013
  aspo\u0148 u neho - je ve\u013emi kritick\u00fd.\\np. Bauer, starosta M\u010c Ko\u0161ice
  \u2013 Z\u00e1pad: Tie\u017e navrhol, aby predseda RS vyst\u00fapil na rokovan\u00ed
  MZ, preto\u017ee ich stanovisko nebolo akceptovan\u00e9. Veto, ktor\u00e9 je v z\u00e1kone,
  je ne\u00fa\u010dinn\u00e9. Syst\u00e9mov\u00e9 rie\u0161enie by bolo, keby sa v
  \u0160tat\u00fate mesta zadefinoval mechanizmus, \u017ee ke\u010f st\u00fapa podiel
  tejto dane meste, automaticky st\u00fapa aj mestsk\u00fdm \u010dastiam. Avizova\u0165
  toto poslancom, lebo sa pripravuje zmena \u0161tat\u00fatu a chceli by ma\u0165
  od bud\u00faceho roku jasn\u00e9 pravidl\u00e1 \u2013 minim\u00e1lny  podiel M\u010c
  na dani z pr\u00edjmu fyzick\u00fdch os\u00f4b a takisto mechanizmu n\u00e1rastu
  ako st\u00fapaj\u00fa pr\u00edjmy mesta.\\np. Re\u0161tei, predseda Rady starostov:
  Bola ustanoven\u00e1 7-\u010dlenn\u00e1 komisia, ktor\u00e1 by mala pripravova\u0165
  podnety na zmenu \u0160tat\u00fatu mesta Ko\u0161ice. T\u00e1to pracovn\u00e1 skupina
  by sa mala stretn\u00fa\u0165 s p. prim\u00e1torom a n\u00e1mestn\u00edkmi prim\u00e1tora
  a doladi\u0165 si \u010dinnos\u0165 tejto komisie. Tam by bol aj priestor  s p.
  prim\u00e1torom si tieto veci vydiskutova\u0165, chce zvola\u0165 tak\u00e9to stretnutie
  na bud\u00faci t\u00fd\u017ede\u0148. Je to skupina 7 starostov, ktor\u00e1 bola
  schv\u00e1len\u00e1 na \u0161tvrtom rokovan\u00ed RS. Tam by mali za\u010da\u0165
  robi\u0165 prv\u00e9 kroky aj k naplneniu rozpo\u010dtu.\\np. Hlinka, starosta M\u010c
  Ko\u0161ice \u2013 Juh: Na MZ bude teraz predlo\u017een\u00e1 mal\u00e1 novela \u0161tat\u00fatu
  a pl\u00e1nuje sa ve\u013ek\u00e1 novela, kde by sa mali prehodnoti\u0165 kompetencie
  medzi mestom a mestsk\u00fdmi \u010das\u0165ami, ale v z\u00e1vislosti na tom aj
  model prerozde\u013eovania financi\u00ed pre M\u010c pod\u013ea vzorca, ktor\u00fd
  by sa mal ka\u017edoro\u010dne realizova\u0165. Ve\u013ek\u00e1 novela \u0161tat\u00fatu
  by mala by\u0165 spracovan\u00e1 do konca tohto roku a mala by plati\u0165 od bud\u00faceho
  roku. Starostovia sa bud\u00fa sna\u017ei\u0165, aby do toho procesu pr\u00edpravy
  boli vtiahnut\u00ed \u010d\u00edm sk\u00f4r, aby to nerobili len odborn\u00ed zamestnanci
  magistr\u00e1tu.\\np. Kupec, starosta M\u010c Ko\u0161ice \u2013 Kave\u010dany:
  Predniesol n\u00e1vrh na uznesenie: Rada starostov \u017eiada prim\u00e1tora mesta
  o doplatenie nedoplatku podielov\u00fdch dan\u00ed pre mestsk\u00e9 \u010dasti za
  obdobie proviz\u00f3ria v r. 2011 v mesiaci j\u00fani.\\n\\nHlasovanie \u010d. 2
  \u2013 za: 16, proti: -, zdr\u017eali sa: ,-\\n\\np. Re\u0161tei, predseda Rady
  starostov: Za overovate\u013eov z\u00e1pisnice ur\u010dil starostov Adrianu Balogov\u00fa
  a JUDr. Jaroslava Hlinku. Otvoril 1. bod rokovania pod\u013ea schv\u00e1len\u00e9ho
  programu.\\n\\n*  *  *\\n\\n1. Vyhl\u00e1senie k pl\u00e1novanej privatiz\u00e1cii
  spolo\u010dnosti Tepl\u00e1re\u0148 Ko\u0161ice, a.s.\\n\\np. Bauer, starosta M\u010c
  Ko\u0161ice \u2013 Z\u00e1pad: Tie\u017e je za to, aby mesto vlastnilo v\u00e4\u010d\u0161\u00ed
  podiel z Tepl\u00e1rne ako 5% , duch vyhl\u00e1senia je dobr\u00fd.  Len v upozornen\u00ed
  sa mu nezd\u00e1 by\u0165 presn\u00e9, \u017ee automaticky by malo d\u00f4js\u0165
  k nav\u00fd\u0161eniu ceny tepla minim\u00e1lne o 25%, v dohode sa to d\u00e1 ur\u010dite
  regulova\u0165 tak, \u017ee k tomu ned\u00f4jde.\\np. Re\u0161tei, predseda Rady
  starostov: Navrhol, aby nehlasovali o ka\u017edom bode jednotlivo, ale v z\u00e1vere
  o v\u0161etk\u00fdch bodoch spolu.\\n\\n*  *  *\\n\\n2. Spr\u00e1va o v\u00fdsledku
  kontroly \u00fa\u010dtovn\u00fdch a finan\u010dn\u00fdch v\u00fdkazov vo vz\u0165ahu
  k vyk\u00e1zan\u00fdm v\u00fdsledkom hospod\u00e1renia Mesta Ko\u0161ice za rok
  2010 vykonanej NK\u00da Slovenskej republiky.\\np. Re\u0161tei, predseda Rady starostov:
  Kon\u0161tatoval, \u017ee materi\u00e1l pre\u0161iel bez pripomienok.\\n\\n*  *  *\\n\\n3.
  Spr\u00e1va o odpovediach na interpel\u00e1cie a dopyty poslancov mestsk\u00e9ho
  zastupite\u013estva, ktor\u00e9 boli prednesen\u00e9 na IV. rokovan\u00ed MZ d\u0148a
  19.4.2011.\\np. Re\u0161tei, predseda Rady starostov: Materi\u00e1l pre\u0161iel
  bez pripomienok.\\n\\n*  *  *\\n\\n4. Informat\u00edvna spr\u00e1va o pr\u00ednosoch
  \u010dlenstva pre mesto Ko\u0161ice v dom\u00e1cich a zahrani\u010dn\u00fdch zdru\u017eeniach
  za obdobie roka 2010.\\np. Re\u0161tei, predseda Rady starostov: Materi\u00e1l pre\u0161iel
  bez pripomienok.\\n\\n*  *  *\\n\\n5. N\u00e1vrh zmeny a doplnenia \u0160tat\u00fatu
  mesta Ko\u0161ice.\\n\\np. Bauer, starosta M\u010c Ko\u0161ice \u2013 Z\u00e1pad:
  V d\u00f4vodovej spr\u00e1ve je uveden\u00e9, \u017ee sa pripravuje rekodifik\u00e1cia
  \u0161tat\u00fatu, ktor\u00e1 by mala po d\u00f4slednej anal\u00fdze a prerokovan\u00ed
  s pr\u00edslu\u0161n\u00fdmi odborn\u00fdmi \u00fatvarmi  mesta   a \u010fal\u0161\u00edmi
  zainteresovan\u00fdmi osobami, nie s\u00fa tam explicitne menovan\u00e9 mestsk\u00e9
  \u010dasti. Chce, aby aj v tom duchu rokovali, aby nov\u00fd \u0161tat\u00fat bol
  pripraven\u00fd aj s nimi.\\np. Re\u0161tei, predseda Rady starostov: V zmysle \u0160tat\u00fatu
  Rady starostov a v zmysle z\u00e1kona o meste Ko\u0161ice, maj\u00fa pr\u00e1vo
  sa vyjadri\u0165 k novele \u0160tat\u00fatu mesta Ko\u0161ice.\\n\\n*  *  *\\n\\n6.
