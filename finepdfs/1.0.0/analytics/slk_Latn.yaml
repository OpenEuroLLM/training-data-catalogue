  24.7 na str\u00e1nke OBFZ v sekcii rozhodcov.\\n\\nOspravedlnenie:\\n\\nVarga od
  23.7 na  jesenn\u00fa \u010das\u0165 s\u00fa\u0165a\u0163n\u00e9ho ro\u010dn\u00edka,
  Vasilenko 23.7.,Matta 23.7.,Seman 23.7.,Prokop\u010d\u00e1k 23.8 Gro\u0161ko od
  1.8 do 21.8\\n\\nZasadnutie KR ObFZ sa uskuto\u010dn\u00ed  27.7.2017 o 16,30 hod
  .v zasada\u010dke ObFZ .\\n\\nR\u00d4ZNE\\n\\nV\u00fdklad k jednotliv\u00fdm rozhodnutiam
  poskytuje predseda pr\u00edslu\u0161nej odbornej komisie\\n\\n\u00daradn\u00e1 spr\u00e1va
  ObFZ Humenn\u00e9 uverejnen\u00e1 v t\u00fd\u0163denn\u00edku Podvihorlatsk\u00e9
  noviny m\u00e1 informat\u00edvny charakter a nemus\u00ed obsahova\u0165 v\u0161etky
  inform\u00e1cie. Kompletn\u00e1 a pre v\u0161etky v  \u00daS uv\u00e1dzan\u00e9
  osoby a subjekty z\u00e1v\u00e4zn\u00e1, je \u00daradn\u00e1 spr\u00e1va ObFZ Humenn\u00e9,
  zverej\u0148ovan\u00e1 na str\u00e1nke www.obfzhumenne.sk\"", "\"N\u00e1vod na pou\u017e\u00edvanie
  ELEKTRONICKEJ \u017dIACKEJ KNI\u017dKY v mobile\\n\\nN\u00e1vod na vyu\u017e\u00edvanie
  ELEKTRONICKEJ \u017dIACKEJ KNI\u017dKY (pre \u017eiakov aj rodi\u010dov). N\u00e1vod
  na in\u0161tal\u00e1ciu aplik\u00e1cie do mobilu alebo tabletu (pre Android):\\n\\n1.
  V mobilnom telef\u00f3ne \u0165uknete na ikonku Google Play (obchod).\\n2. Po spusten\u00ed
  aplik\u00e1cie si d\u00e1te hore vyh\u013eada\u0165 \\\"EduPage\\\".\\n3. Kliknete
  - In\u0161talova\u0165 a dovol\u00edte mobilu, aby t\u00fato aplik\u00e1ciu nain\u0161taloval.\\n4.
  Potom ju m\u00f4\u017eete spusti\u0165.\\n5. \u0164uknete na \\\"prihl\u00e1si\u0165
  sa\\\" a zad\u00e1te prihlasovacie \u00fadaje (prihlasovacie meno a heslo).\\n6.
  Potom dokon\u010d\u00edte prihl\u00e1senie dop\u00edsan\u00edm \\\"zsvinbarg\\\"
  do adresy \\\"zsvinbarg.edupage.org\\\"\\n7. Aplik\u00e1cia v\u00e1s prihl\u00e1si
  a m\u00f4\u017eete ju vyu\u017e\u00edva\u0165 (prihlasovanie je jednor\u00e1zov\u00e1
  z\u00e1le\u017eitos\u0165, u\u017e ho nebude potrebn\u00e9 opakova\u0165 pri \u010fal\u0161om
  spusten\u00ed aplik\u00e1cie).\\n8. Podobne postupujete aj pri AppStore a nain\u0161talujete
  aplik\u00e1ciu EduPage do mobilu iPhone.\\n\\nSpr\u00e1vy, zn\u00e1mky a jed\u00e1lny
  l\u00edstok - pou\u017e\u00edvanie aplik\u00e1cie\\n\\n1. Ke\u010f u\u017e m\u00e1te
  v mobile alebo tablete nain\u0161talovan\u00fa aplik\u00e1ciu EduPage a podarilo
  sa v\u00e1m prihl\u00e1si\u0165, pozrieme sa na funkcie, ktor\u00e9 budeme na za\u010diatok
  vyu\u017e\u00edva\u0165.\\n\\n2. V \u010dasti \\\"spr\u00e1vy\\\" \u2013 \u017elt\u00e1
  ikonka ob\u00e1lky \u2013 sa zobrazuj\u00fa spr\u00e1vy poslan\u00e9 napr. triednym
  u\u010dite\u013eom (bu\u010f iba \u017eiakom alebo iba rodi\u010dom resp. aj \u017eiakom
  aj rodi\u010dom). Tu budete informovan\u00ed o rodi\u010dovsk\u00fdch zdru\u017eeniach,
  exkurzi\u00e1ch, divadeln\u00fdch predstaveniach, v\u00fdchovn\u00fdch koncertoch
  a podobne. Sta\u010d\u00ed \u0165ukn\u00fa\u0165 a spr\u00e1vu si pre\u010d\u00edta\u0165.
  V zozname spr\u00e1v m\u00f4\u017eete konkr\u00e9tnu spr\u00e1vu vymaza\u0165 jej
  posunut\u00edm vpravo alebo v\u013eavo. U\u010dite\u013e, ktor\u00fd spr\u00e1vu
  rozposlal vid\u00ed vo svojej aplik\u00e1cii, kto si spr\u00e1vu u\u017e pre\u010d\u00edtal.
  Oznamy vy\u017eaduj\u00face podpis rodi\u010da bud\u00fa posielan\u00e9 v papierovej
  podobe ako doteraz. O spr\u00e1ve budete informovan\u00fd v notifika\u010dnej li\u0161te
  v\u00e1\u0161ho mobilu aj vtedy, ak je aplik\u00e1cia vypnut\u00e1 (nepr\u00eddete
  o \u017eiadne d\u00f4le\u017eit\u00e9 inform\u00e1cie a nemus\u00edte aplik\u00e1ciu
  sp\u00fa\u0161\u0165a\u0165 ka\u017ed\u00fd de\u0148, aby ste si skontrolovali spr\u00e1vy).\\n\\n3.
  V \u010dasti \\\"zn\u00e1mky\\\" \u2013 \u010derven\u00e1 ikonka notesu \u2013 v\u00e1m
  umo\u017e\u0148uje (\u017eiakom aj rodi\u010dom) prehliada\u0165 si zn\u00e1mky
  z jednotliv\u00fdch predmetov. Zn\u00e1mky m\u00f4\u017eete aj podp\u00edsa\u0165
  vpravo dole \u0165uknut\u00edm na \\\"podp\u00edsa\u0165\\\". U\u010dite\u013e samozrejme
  vid\u00ed, \u010di rodi\u010d zn\u00e1mku podp\u00edsal a je tak informovan\u00fd
  o prospechu svojho die\u0165a\u0165a. O udelen\u00ed zn\u00e1mky budete informovan\u00fd
  v notifika\u010dnej li\u0161te svojho telef\u00f3nu aj vtedy, ak je aplik\u00e1cia
  vypnut\u00e1.\\n\\n4. V \u010dasti \u201ejed\u00e1lny l\u00edstok\\\" uvid\u00edte,
  \u010do sa var\u00ed v \u0161kolskej jed\u00e1lni v dan\u00fd de\u0148 .\\n\\n\u010eal\u0161ie
  mo\u017enosti, ktor\u00e9 aplik\u00e1cia pon\u00faka (doch\u00e1dzka, suplovanie
  a pod.) zatia\u013e nebudeme akt\u00edvne vyu\u017e\u00edva\u0165.\"", "\"Dodatok
  \u010d. 1\\n\\nZmluv\u00e9 o poskytovan\u00ed finan\u010dn\u00e9ho pr\u00edspevku
