  zmluvnej strany stan\u00fa dostupn\u00fdmi pre neopr\u00e1vnen\u00fa osobu alebo
  ich tak\u00e1to osoba z\u00edsk\u00e1, druh\u00e1 zmluvn\u00e1 strana je povinn\u00e1
