  Marekovsk\u00e1 (Pongr\u00e1covsk\u00e1) k\u00faria o 10:00 hodine:\\n\\nValn\u00e9
  zhroma\u017edenie (VZ):\\n\\nSchva\u013euje mand\u00e1tov\u00fa komisiu, volebn\u00fa
