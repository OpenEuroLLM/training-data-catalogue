  predpisov, inak d\u0148om jej podpisu opr\u00e1vnen\u00fdmi z\u00e1stupcami oboch
  zmluvn\u00fdch str\u00e1n.\\n\\n12.2. Meni\u0165 a dop\u013a\u0148a\u0165 text tejto
  zmluvy je mo\u017en\u00e9 len formou p\u00edsomn\u00fdch dodatkov, ktor\u00e9 bud\u00fa
  vz\u00e1jomne ods\u00fahlasen\u00e9 a podp\u00edsan\u00e9 opr\u00e1vnen\u00fdmi
  z\u00e1stupcami oboch zmluvn\u00fdch str\u00e1n. Pre platnos\u0165 dodatkov k tejto
  zmluve sa vy\u017eaduje dohoda o celom texte dodatku.\\n\\n12.3. Odst\u00fapi\u0165
  od zmluvy m\u00f4\u017ee ktor\u00e1ko\u013evek zo zmluvn\u00fdch str\u00e1n v pr\u00edpade
  nedodr\u017eania zmluvn\u00fdch povinnost\u00ed a po predch\u00e1dzaj\u00facom p\u00edsomnom
