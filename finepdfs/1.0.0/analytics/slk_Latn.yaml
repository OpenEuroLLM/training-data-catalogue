  HZS |  |  |  | hod | 20,01 EUR |\"", "\"VITAJTE NA CHATE AQUALAND\\n\\nSme radi,
  \u017ee ste sa vybrali str\u00e1vi\u0165 Va\u0161u dovolenku na chate Aqualand.  Je
  na\u0161\u00edm prian\u00edm, aby ste boli s Va\u0161\u00edm pobytom spokojn\u00ed
  a v\u017edy sa k n\u00e1m s rados\u0165ou vr\u00e1tili ako k star\u00fdm dobr\u00fdm
  priate\u013eom.  V pr\u00edpade ak\u00fdchko\u013evek ot\u00e1zok sa m\u00f4\u017eete
  kedyko\u013evek obr\u00e1ti\u0165 na n\u00e1\u0161 person\u00e1l , ktor\u00fd  V\u00e1m
  v\u017edy  ochotne pom\u00f4\u017ee. Pred Va\u0161\u00edm pr\u00edchodom by mali
  by\u0165 izby \u010dist\u00e9 a pripraven\u00e9 pre V\u00e1s. Pros\u00edme V\u00e1s,  aby
  ste si prezreli izbu. Budeme radi, ak n\u00e1m d\u00e1te vedie\u0165, \u010do by
  sme v bud\u00facnosti na chate mohli vylep\u0161i\u0165 a \u010do by V\u00e1m v
  bud\u00facnosti  urobilo rados\u0165.\\n\\nPo\u010das V\u00e1\u0161ho pobytu V\u00e1s
  chceme poprosi\u0165, aby ste re\u0161pektovali na\u0161e pravidl\u00e1 na chate,
  ktor\u00fdmi V\u00e1m chceme zjednodu\u0161i\u0165 pobyt.\\n\\nPO\u010cAS POBYTU:\\n\\n[x]
  Faj\u010denie vo vn\u00fatri chaty nie je povolen\u00e9. Faj\u010di\u0165 m\u00f4\u017eete
  vonku na terase a ohorky d\u00e1vajte do popoln\u00edkov.\\n[x] Chr\u00e1\u0148te
  pr\u00edrodu a u\u017e\u00edvajte \u017eivot okolo V\u00e1s v harm\u00f3nii.  \u0160etrite
  elektrick\u00fa energiu, pitn\u00fa vodu a recyklujte odpad, ktor\u00fd vytvor\u00edte.\\n[x]
  Dom\u00e1ci mil\u00e1\u010dikovia  s\u00fa dovolen\u00ed len so schv\u00e1len\u00edm
  mana\u017ementu chaty.\\n[x] Bu\u010fte oh\u013eadupln\u00ed k druh\u00fdm hos\u0165om.
  V \u010dase od  23:00 hod. do 7:00 hod.  dodr\u017eiavajte no\u010dn\u00fd k\u013eud.
  Chata je ve\u013emi hlu\u010dn\u00e1, najm\u00e4  podlahy na poschodiach.   Pros\u00edme
  V\u00e1s, aby  ste mali na mysli, \u017ee ka\u017ed\u00fd m\u00e1 pr\u00e1vo dobre
  sa vyspa\u0165,  tak ako aj vy.\\n[x] D\u00e1vajte si pozor na Va\u0161e veci. Mana\u017ement
  nezodpoved\u00e1 za straten\u00e9 alebo ukradnut\u00e9 veci.\\n\\nPRED ODCHODOM:\\n\\n[x]
  Odubytova\u0165 sa mus\u00edte pred 11. hod.\\n[x] Pros\u00edme V\u00e1s, pred odchodom
  vyzlie\u010dte oblie\u010dky a prineste n\u00e1m ich k baru.\\n[x] Odstr\u00e1\u0148te
  v\u0161etky odpadky a pr\u00e1zdne f\u013ea\u0161e pred Va\u0161\u00edm odchodom
  z izby.\\n\\nPRAVIDL\u00c1 KUCHYNE:\\n\\nKuchy\u0148a je k dispoz\u00edci\u00ed
  V\u0160ETK\u00ddM ubytovan\u00fdm hos\u0165om, preto je d\u00f4le\u017eit\u00e9
  dodr\u017eiava\u0165 nasleduj\u00face pravidl\u00e1:\\n\\n[x] Va\u0161a mama tu
  nepr\u00edde za vami poprata\u0165. Ak si nie\u010do za\u0161pinil, tak to po sebe
  uprac. Ak si nie\u010do vzal, tak to vr\u00e1\u0165 na miesto.\\n[x] Pred odchodom
  vezmi so sebou v\u0161etky r\u00fdchlo sa kaziace potraviny z chladni\u010dky.  Ozna\u010d
  potraviny fixkou, ktor\u00e9 chce\u0161 darova\u0165 chate ako \\\"darovan\u00e9\\\".\\n\\nD\u00fafame,
  \u017ee za\u017eijete na chate n\u00e1dhern\u00fd pobyt a  re\u0161pektovanie t\u00fdchto
  pravidiel n\u00e1m pom\u00f4\u017eu odb\u00fara\u0165 v\u0161etky nejasnosti.  V\u00e1\u017eime
  si V\u00e1\u0161 n\u00e1zor a preto ver\u00edme, \u017ee n\u00e1m d\u00e1te otvorene
  vedie\u0165, \u010do V\u00e1m do bud\u00facna m\u00f4\u017ee V\u00e1\u0161 pobyt
  vylep\u0161i\u0165.\\n\\nS \u00factou,\\n\\nAqualand prev\u00e1dzkovate\u013e\"",
