  - -\"", "\"informa\u010dn\u00fd list projektu\\n\\n3/2002\\n\\nPILOTN\u00dd PROJEKT
  ODSTR\u00c1NENIA POR\u00daCH OBVODOV\u00c9HO PL\u00c1\u0160\u0164A P 1.14 A PS-82\\n\\nNa
  realiz\u00e1ciu pilotn\u00e9ho projektu odstr\u00e1nenia syst\u00e9movej poruchy
  obvodov\u00e9ho pl\u00e1\u0161\u0165a s vrstven\u00fdmi obvodov\u00fdmi dielcami
  stavebnej s\u00fastavy P 1.14 v r\u00e1mci VTP 2811001900/2001 Pilotn\u00fd projekt
  obnovy celopanelovej budovy P 1.14, P 1.15, PS-82 a ZT bol vybrat\u00fd bytov\u00fd
  dom na Gercenovej ulici, z neho na realiz\u00e1ciu dve sekcie a to \u010d. 15 a
  17 s po\u010dtom bytov 64. Spr\u00e1vcom domu je Bytov\u00e9 dru\u017estvo Petr\u017ealka,
  Budat\u00ednska 1, 851 01 Bratislava. Byty so vo v\u00e4\u010d\u0161ine vo vlastn\u00edctve
  obyvate\u013eov. Pilotn\u00fd projekt bol realizovan\u00fd od m\u00e1ja 2001 do
  j\u00fana 2001.\\n\\nBytov\u00fd dom sa nach\u00e1dza v rovinatom \u00fazem\u00ed
  Petr\u017ealky. Postaven\u00fd bol v roku 1983 v stavebnej s\u00fastave P 1.14 \u2013
  objemov\u00e9 rie\u0161enie 7.5RP, t.j. s vrstven\u00fdmi obvodov\u00fdmi dielcami
  s tepelnoizola\u010dnou vrstvou z penov\u00e9ho polystyr\u00e9nu hr\u00fabky 80
  mm a otvoren\u00fdmi stykmi, ktor\u00e9 boli v priebehu u\u017e\u00edvania bytov\u00e9ho
  domu zatmelen\u00e9. Jedn\u00e1 sa o 2 - sekciov\u00fd dom s 9 nadzemn\u00fdmi podla\u017eiami.
  Z toho je 8 obytn\u00fdch podla\u017e\u00ed a jedno podla\u017eie technick\u00e9
  - vstupn\u00e9. Dom je orientovan\u00fd pozd\u013a\u017enou osou pribli\u017ene
  z\u00e1pad-v\u00fdchod, so vstupmi od juhu. Komunika\u010dn\u00e9 jadro tvor\u00ed
  schodisko. Z podesty je pr\u00edstupn\u00fd jeden osobn\u00fd v\u00fd\u0165ah. Vstup
  do budovy je cez uzatv\u00e1rate\u013en\u00e9 z\u00e1dverie. Bytov\u00fd dom m\u00e1
  zapusten\u00e9 lod\u017eie.\\n\\nFor the pilot project realization aimed at system
  failures removal of overall walls composed from peripheral parts of P 1.14 structural
  system within the VTP 2811001900/2001 \\\" The Pilot project of the dwelling house
  upgrading of P1.14, P 1.15, PS-82 and ZT structural systems \\\" has been chosen
  a building built on the Gercenova Str. For the project has been realised 2 sections
  of the house and there are No. 15 and No. 17 with a total number of flats 64. A
  building manager is The Housing Cooperative Petrzalka, Budatinska 1, 851 01 Bratislava.
  Owners are dwelling occupants in many cases. The pilot project was realized from
  May 2001 to June 2001.\\n\\nPoh\u013ead na obvodov\u00fd pl\u00e1\u0161\u0165 v
  p\u00f4vodnom stave so \u0161k\u00e1rami vyplnen\u00fdmi tmelom\\n\\nThe view on
  the overall wall with overlaying joints by silicone strips\\n\\nStavebn\u00e9 s\u00fastavy
  P1.14, SpM P1.14 a PS \u2013 82 s\u00fa priestorov\u00e9 nosn\u00e9 s\u00fastavy
  s predsaden\u00fdm obvodov\u00fdm pl\u00e1\u0161\u0165om z vrstven\u00fdch obvodov\u00fdch
  dielcov hr\u00fabky 300 mm. Obvodov\u00e9 dielce sa skladaj\u00fa z vn\u00fatornej
  nosnej bet\u00f3novej vrstvy hrubej 150 mm, z vrstvy tepelnej izol\u00e1cie a vonkaj\u0161ej
  vrstvy bet\u00f3nu (\u017eelezobet\u00f3novej membr\u00e1ny) hr\u00fabky 70 mm.
  Tepelnoizola\u010dn\u00e1 vrstva je na rozdiel od v\u0161etk\u00fdch obvodov\u00fdch
  kon\u0161trukci\u00ed uplat\u0148ovan\u00fdch v predch\u00e1dzaj\u00facom obdob\u00ed
  hr\u00fabky 80 mm (BA-BC 50 mm, B-70 60 mm, BA NKS 70 mm). Vytvoren\u00e1 je z dvoch
  vrstiev dosiek penov\u00e9ho polystyr\u00e9nu hr\u00fabky 40 mm.\\n\\nMembr\u00e1na
  je zavesen\u00e1 na nosn\u00fa \u017eelezobet\u00f3nov\u00fa vn\u00fatorn\u00fa
  stenu pomocou kotiev z antikor\u00f3znej ocele 8 mm tvaru p\u00edsmena Z, ktor\u00e9
  sa umiest\u0148ovali pri okenn\u00fdch otvoroch. V dielcoch    P 1.14 objemov\u00e9ho
  rie\u0161enia 6.5 RP sa pou\u017e\u00edvali kotvy tvaru p\u00edsmena M, ktor\u00e9
  sa pri otvorov\u00fdch dielcoch umiest\u0148ovali do stredu parapetu. Proti p\u00f4sobeniu
  sania vetrom boli \u017eelezobet\u00f3nov\u00e9 vrstvy spojen\u00e9 ihli\u010dkami
  z nehrdzavej\u00facej ocele 2 mm pribli\u017ene vo vzdialenosti 500 mm.\\n\\nOtvoren\u00e9
  \u0161k\u00e1ry zvisl\u00fdch stykov medzi panelmi mali projektovan\u00fa \u0161\u00edrku
  24 8mm. Pre 6. 5RP boli \u0161k\u00e1ry navrhnut\u00e9 ako uzatvoren\u00e9. Da\u017e\u010fov\u00fa
  prek\u00e1\u017eku tvoril gumov\u00fd tesniaci  p\u00e1sik. Vodorovn\u00fd styk
  sa realizoval ako otvoren\u00fd \u0161\u00edrky  30  mm  so  stanoven\u00fdm toleran\u010dn\u00fdm
  po\u013eom  s  tepelnou   izol\u00e1ciou  vkladanou  pri  mont\u00e1\u017ei panelov
  v \u00farovni\\n\\nThe dwelling house is located on a flat area of Petrzalka, Bratislava.
  The house was built in 1983 in P 1.14-7.5 RP structural system. External walls are
  layered with thermal insulation made by foam polystyrene in width 80 mm and they
  create open joints that were binding during the house using. It is a two-sectional
  house with 9 storeys. Eight storeys are for dwelling aim and 1 storey is technicalentrance.
  The house is orientated by longitudinal line to the west-east side with entrances
  orientated to the south side. The stairway is communication way. The personal elevator
  is accessible from stair quarter-space. The main building entrance passes across
  the closing door space. The dwelling house has imbedded loggias.\\n\\nPoh\u013ead
  na obvodov\u00fd pl\u00e1\u0161\u0165 so \u0161k\u00e1rami prekryt\u00fdmi silik\u00f3nov\u00fdmi
  p\u00e1sikmi The view on the overall wall in original shape with binding joints\\n\\nP
  1.14, SpM P 1.14 and PS-82 \u2013 structural systems are space load bearing systems
  with overall walls composed from layered peripheral parts in width 300 mm. Overall
  wall compounds from load bearing reinforce-concrete interior wall in width 150 mm,
  thermal insulation of foam polystyrene in width 80 mm and external reinforce-concrete
  walls in width 70 mm (reinforce \u2013 concrete membranes). Thermal insulation layer
  is in width 80 mm unlike of other all overall structures asserted in the same built
  time (BA-BC structural system \u2013 50 mm, B-70 structural system \u2013 60 mm,
  BA NKS structural system \u2013 70 mm). Thermal insulation layer is composed from
  two layers of foam polystyrene boards in width 40 mm.\\n\\nMembrane is hung at load
  bearing reinforce-concrete interior wall by anchors from anticorrosive steel  8
  mm (in a shape letter Z) that are inserted close the window openings. (Anchors from
  anticorrosive steel in a shape letter M inserted in the middle of window parapet
  are used for overall parts in P 1.14 \u2013 6.5 RP structural system.) Reinforce-concrete
  walls were united in the span 500 mm by needles from anticorrosive steel  2 mm because
  an effect of back wind pressures.\\n\\nVertical joints between panels were designed
  in width 24  8 mm. Vertical joints of P 1.14 \u2013 6.5 RP - structural system was
  designed as closed. Rubber binding strips create the rain obstructions. Horizontal
  joints were designed as opened in width 30 mm with specified departure\\n\\ninforma\u010dn\u00fd
  list projektu 3/2002\\n\\ntepelnej izol\u00e1cie strednej vrstvy panela.\\n\\nPre
  v\u00fdstavbu 7. 5RP a neskor\u0161om obdob\u00ed bol okrem roz\u0161\u00edrenia
  po\u010dtu modulov a skr\u00e1tenia horn\u00e9ho a doln\u00e9ho ozubu panelov prepracovan\u00fd
  i sp\u00f4sob tesnenia a tvaru \u0161k\u00e1ry. \u0160k\u00e1ry boli navrhnut\u00e9
  ako otvoren\u00e9 s da\u017e\u010fovou prek\u00e1\u017ekou a profilovan\u00edm dielcov.
  Do priestoru spoja sa  vkladala v \u00farovni tepelnej izol\u00e1cie dielcov tepelnoizola\u010dn\u00e1
  vlo\u017eka z penov\u00e9ho polystyr\u00e9nu opatren\u00e1 vrstvou hydroizol\u00e1cie
  z vonkaj\u0161ej strany. Bytov\u00fd dom pilotn\u00e9ho projektu bol postaven\u00fd
  z dielcov a s rie\u0161en\u00edm stykov pod\u013ea objemov\u00e9ho rie\u0161enia
  pre 7.5RP.\\n\\ndetermined by inbuilt thermal insulation during the panel assembly
  in the middle panel layer in a place of thermal insulation.\\n\\nCharakteristick\u00e9
  poruchy obvodov\u00fdch pl\u00e1\u0161\u0165ov stavebnej s\u00fastavy P 1.14 a ostatn\u00fdch
  s\u00fastav s uplatnen\u00edm rovnak\u00fdch dielcov s tepelnoizola\u010dnou vrstvou
  hr\u00fabky 80 mm s\u00fa v d\u00f4sledku v\u00fdroby a mont\u00e1\u017ee dielcov.
  Prejavuj\u00fa sa hlavne v oblasti stykov dielcov zatekan\u00edm da\u017e\u010fovej
  vody. Zatekaj\u00faca da\u017e\u010fov\u00e1 voda m\u00f4\u017ee sp\u00f4sobova\u0165
  kor\u00f3ziu v\u00fdstu\u017ee spojov. Jestvuj\u00faci stav poznatkov neumo\u017e\u0148uje
  diagnostikova\u0165 nepriazniv\u00fd vplyv zatekania na kor\u00f3ziu spojov. Nedostato\u010dn\u00e9
  vytvorenie tepelnoizola\u010dnej vrstvy sp\u00f4sobilo vznik tepelnoizola\u010dnej
  nehomogenity. Tepelnoizola\u010dn\u00e1 nehomogenita vznikla po celej ploche dielca
  v d\u00f4sledku sp\u00f4sobu vytv\u00e1rania tepelnoizola\u010dnej vrstvy, zatekania
  bet\u00f3nu do \u0161k\u00e1r medzi  doskami  z penov\u00e9ho polystyr\u00e9nu a
  v okrajov\u00fdch \u010dastiach medzi tepeln\u00fa izol\u00e1ciu a bo\u010dnice
  formy pri horizont\u00e1lnej v\u00fdrobe dielcov, sublim\u00e1cie penov\u00e9ho
  polystyr\u00e9nu najm\u00e4 v okrajov\u00fdch \u010dastiach dielcov po\u010das procesu
  ur\u00fdch\u013eovania tvrdnutia bet\u00f3nu ohrevom (vplyv teploty a chemizmu odformovac\u00edch
  prostriedkov). N\u00edzka tepelnoizola\u010dn\u00e1 schopnos\u0165 v oblasti stykov
  sp\u00f4sobuje vznik hygienick\u00fdch nedostatkov prejavuj\u00facich sa ples\u0148ami.\\n\\nTepelnoizola\u010dn\u00e1
  nehomogenita v oblasti stykov na z\u00e1padnom \u0161t\u00edte Thermoinsulation
  inhomogenity in the place of joints on the west\\n\\nPredmetom pilotn\u00e9ho projektu
  bol komplexn\u00fd n\u00e1vrh odstr\u00e1nenia nedostatkov v oblasti stykov, zlep\u0161enie
  tepelnoizola\u010dnej homogenity a zamedzenie zatekania, overenie sp\u00f4sobu opravy,
  n\u00e1kladov na obnovu ako aj sp\u00f4sob financovania opravy s vyu\u017eit\u00edm
  \u0161t\u00e1tneho pr\u00edspevku na odstr\u00e1nenie syst\u00e9movej poruchy.\\n\\nCie\u013eom
  overenia technol\u00f3gie opravy \u0161k\u00e1r lepen\u00edm silik\u00f3nov\u00fdch
  p\u00e1sikov bolo overenie v\u0161etk\u00fdch s\u00favisiacich \u010dinnost\u00ed.
  Overoval sa sp\u00f4sob vyt\u00fd\u010denia os\u00ed \u0161k\u00e1r, stanovenie
  pomocn\u00fdch \u010diar, premeranie rozmerov hlavne   zvisl\u00fdch  \u0161k\u00e1r  a  ich  odch\u00fdlok.
  Pri lepen\u00ed  p\u00e1sikov sa overovala\\n\\nFor building in the P 1.14 \u2013
  7.5 RP - structural system was remade a number of structural modules (enlarging),
  shortening bottom and top cogs of panel as well as the type of binding and joint
  shape. The joints were designed as opened with rain obstructions and profiled by
  overall panel parts. A thermo-insulation pad made of the foam polystyrene with hydroinsulation
  layer on the external side was inserted to the space of joint in the place of panel
  thermal insulation. The dwelling house chosen for pilot project realization has
  been built in the P 1.14 \u2013 7.5 RP - structural system because of overall parts
  and designed joints.\\n\\nCharacteristic failures of overall layered panels of P
  1.14 structural system and others structural systems with using same layered panels
  consisted from thermal insulation layer in width 80 mm arise in consequence of a
  production and assembling of panels. Arisen failures from penetrating rainwater
  appear mainly in the place of panel part joints. Leaking rainwater can cause the
  corrosion of the joint reinforce. Contemporary knowledge does not allow diagnosing
  the negative effect of leaking rainwater to the corrosion of the joint reinforce.
  Insufficient thermal insulation in all panel area cause a rise of thermoinsulation
  inhomogenity  in consequence of the making thermal insulation, the leaking concrete
  mass to joints between foam polystyrene boards or to edge parts between thermal
  insulation, the leaking concrete mass to side parts of panel shuttering, the sublimation
  of foam polystyrene especially at the edge panel parts appeared during the speed
  up of concrete set by heating (the effect of temperature and chemical process of
  release materials). Low thermalinsulation ability gives a rise to hygienic faults
  demonstrative by mould.\\n\\nTepelnoizola\u010dn\u00e1 nehomogenita stykov v prie\u010del\u00ed
  Thermal insulation inhomogenity in the place of joints in facade wall\\n\\nThe pilot
  project purposes were the complex design of failure removal in the place of joints,
  improvement of homogenity of thermal insulation and leaking prevent, to verify the
  possible upgrading, costs to upgrading as well as the way of support by using state
  grant for the system failures removal.\\n\\nThe verification aim of technology steps
  for joints upgrading by pasting the silicone strips were the adjusting the all-relative
  works. Staking of joint lines, determination of extension lines, measuring of vertical
  joints and their tolerance were table of contents of the verification.\\n\\ninforma\u010dn\u00fd
  list projektu e\\n\\nr\u00fdchlos\u0165 schnutia penetra\u010dn\u00e9ho n\u00e1teru,
  \u0161\u00edrka nanesen\u00e9ho tmelu, vzdialenos\u0165 nanesenia od osi \u0161k\u00e1ry,
  \u0161\u00edrka a hr\u00fabka nanesenej vrstvy, sp\u00f4sob prikladania a pritl\u00e1\u010dania
  p\u00e1sika, ukon\u010denie styku, sp\u00f4sob lepenia v kr\u00ed\u017eovom styku
  a rohoch.\\n\\nOprava \u0161k\u00e1r je podmienen\u00e1 odstr\u00e1nen\u00edm uvo\u013enen\u00fdch
  a nefunk\u010dn\u00fdch v\u00fdpln\u00ed \u0161k\u00e1r. Do zvislej \u0161k\u00e1ry
  sa zas\u00fava podkladov\u00fd gumen\u00fd profil kruhov\u00e9ho prierezu. Pri bytov\u00fdch
  domoch s rie\u0161en\u00edm stykov pod\u013ea objemov\u00e9ho rie\u0161enia 7.5RP
  podklad pre tepelnoizola\u010dn\u00fa homogeniz\u00e1ciu vytv\u00e1ran\u00fa PUR
  penou tvor\u00ed  p\u00f4vodn\u00e1 tepelnoizola\u010dn\u00e1 vlo\u017eka. Horizont\u00e1lna
  \u0161k\u00e1ra nie je pr\u00edstupn\u00e1, tak\u017ee doplnenie tepelnej izol\u00e1cie
  v \u00farovni tepelnoizola\u010dnej vrstvy obvodov\u00fdch dielcov nie je mo\u017en\u00e9.
  Zlep\u0161enie vlastnost\u00ed a zamedzenie zatekania sa dosahuje nalepen\u00edm
  silik\u00f3nov\u00e9ho p\u00e1sika v obidvoch na seba kolm\u00fdch smeroch.\\n\\nSilik\u00f3nov\u00e9
  p\u00e1siky sa vyr\u00e1baj\u00fa v celej \u0161k\u00e1le farieb. Dosiahnu\u0165
  nov\u00fd  vzh\u013ead budovy je mo\u017en\u00e9 uplatnen\u00edm r\u00f4znych farieb
  p\u00e1sikov a farebn\u00fdm n\u00e1terom povrchu panelov po ich predch\u00e1dzaj\u00facej
  oprave.\\n\\nPodmienkou \u00faspe\u0161nej realiz\u00e1cie je dodr\u017eanie technologick\u00e9ho
  postupu, hlavne vykonanie penetr\u00e1cie podkladu, ale i dodr\u017eanie \u010fal\u0161\u00edch
  postupov pri zhotovovan\u00ed (teplota okolia a podkladu, pritla\u010denie k podkladu,
  \u010distota a drsnos\u0165 podkladu). Spotreba relat\u00edvne drah\u00e9ho tmelu
  je \u00famern\u00e1 drsnosti podkladu. Odpor\u00fa\u010da sa preto podklad dokonale
  vyrovna\u0165. \u00daspory n\u00e1kladov na tmel v\u00fdrazne prev\u00fd\u0161ia
  n\u00e1klady na jeho d\u00f4kladn\u00e9 vyrovnanie.\\n\\nPred\u013a\u017eenie \u0161k\u00e1ry
  medzi vrstven\u00fdmi panelmi bolo vypo\u010d\u00edtan\u00e9 pre modulov\u00fa d\u013a\u017eku
  do 4,8 m. Hodnota vypo\u010d\u00edtan\u00e9ho pred\u013a\u017eenia je maxim\u00e1lne
  4 mm. Sk\u00fa\u0161obn\u00e9 zariadenie umo\u017enilo sk\u00fa\u0161a\u0165 s\u00fadr\u017enos\u0165
  pri pred\u013a\u017een\u00ed \u0161k\u00e1ry maxim\u00e1lne 30 mm, \u010do je 7,5
  n\u00e1sobok maxim\u00e1lneho mo\u017en\u00e9ho pred\u013a\u017eenia \u0161k\u00e1ry.
  Pri pred\u013a\u017een\u00ed \u0161k\u00e1ry - teda vz\u00e1jomnom posune vzoriek
  o 30 mm - sa neuvo\u013enila ani jedna vzorka tesniaceho p\u00e1sika Silpro.\\n\\n3/2002\\n\\nDrying
  speed of penetration paint, the width of spread mastic, distance from the joint
  central line, the width and depth spread mastic, the way of touching and pushing
  silicone strips, the joint finishing, the way of pasting in crossing joints and
  corners were verified during the pasting technology of silicone strips.\\n\\nVodorovn\u00fd
  styk obvodov\u00fdch dielcov stavebnej s\u00fastavy P1.14-7.5RP Horizontal joint
  of overall panel parts of P 1.14 \u2013 7.5RP structural system\\n\\nThe joint upgrading
  relatives to the removal of released and nonfunctional joint filling. Base rubber
  profile in circular section applies into the vertical joint. The base for thermo-insulation
  homogenisation created by PUR foam makes the original thermal insulation in dwelling
  houses with joint design as in P 1.14 \u2013 7.5RP structural system. Horizontal
  joint is not assessable therefore thermal insulation completing in a place of thermal
  insulation of overall panel is not possible.  Improving of characteristics and preventing
  of rainwater leaking is possible to achieve by pasting silicone strips in both perpendicular
  directions.\\n\\nThe silicone strips are produced in variable colour. New building
  view is obtained by application of variable color silicone strips and by colour
  paint of upgraded panel surfaces.\\n\\nThe conditions of sufficient realization
  have to be fulfilling technological descriptions, especially following the application
  of underlay penetration, and others important steps in the application (temperature
  of air and the underlay, pushing silicone strips at the underlay, cleanness and
  abrasiveness). Consumption of relatively expensive mastic is commensurable to the
  underlay abrasiveness. The underlay balance is the basic recommendation of the silicone
  strips application. Cost savings of mastic markedly exceed cost for the balancing
  of underlies.\\n\\nExtension of joints between sandwich panels was calculated for
  panel module up to 4,8 m. The value of the calculated extension is 4 mm maximally.  Testing
  machine allowed to test silicone strips coherence within joint extension 30 mm maximally,
  that is 7,5 times more than maximal allowed joint extension. Not even one sample
  of silicone strip Silpro does release at the test of joint extension \u2013 a mutual
  movement of samples about 30 mm.\\n\\nv\u00fdsledky v\u00fdskumu a v\u00fdvoja podporovan\u00e9ho
  \u0161t\u00e1tom\\n\\ninforma\u010dn\u00fd list projektu 3/2002\\n\\nPr\u00eddr\u017enos\u0165
  p\u00e1sikov SILPRO na bet\u00f3novom podklade je minim\u00e1lne o 50 % vy\u0161\u0161ia
  ako pr\u00eddr\u017enos\u0165 porovn\u00e1van\u00fdch p\u00e1sikov Lukot\u011bs.
  Rozdiel v pr\u00eddr\u017enosti nie je sp\u00f4soben\u00fd materi\u00e1lom p\u00e1sika.
  Z\u00e1kladn\u00fd materi\u00e1l p\u00e1sikov je rovnak\u00fd, technol\u00f3gia
  spracovania tie\u017e. Rozdiel je sp\u00f4soben\u00fd pou\u017eit\u00edm r\u00f4znych
  lepiacich tmelov s r\u00f4znymi vlastnos\u0165ami.\\n\\nV\u00fdsledn\u00e1 hodnota
  pr\u00eddr\u017enosti p\u00e1sika Silpro na bet\u00f3novom podklade je v skuto\u010dnosti
  vy\u0161\u0161ia ako nameran\u00e1, preto\u017ee pri sk\u00fa\u0161ke sa poru\u0161ila
  s\u00fadr\u017enos\u0165 medzi ter\u010dom a tesniacim p\u00e1sikom a nie medzi
  nalepen\u00fdm p\u00e1sikom a povrchom bet\u00f3nu.\\n\\nCelkov\u00fd poh\u013ead
  na bytov\u00fd dom P 1.14; Bratislava\u2013 Petr\u017ealka, Gercenova ul. \u010d.15,
  17 \u2013 vstupn\u00e9 prie\u010delie s lod\u017eiami\\n\\nGeneral view on the dwelling
  house P 1.14 - structural system; BratislavaPetrzalka, Gercenova Str. No 15,17.
  Entrance facade with loggias\\n\\nNa pilotnom projekte sa pou\u017eili silik\u00f3nov\u00e9
  p\u00e1siky \u0161\u00edrky 100 mm firmy SILPRO s.r.o. \u017dilina. Cena p\u00e1sikov
  je 90,- Sk/m (bez DPH). \u017divotnos\u0165 p\u00e1sikov sa predpoklad\u00e1 25
  rokov. Dosia\u013e pou\u017e\u00edvan\u00fd sp\u00f4sob opravy \u0161k\u00e1r tmelom
  m\u00e1 \u017eivotnos\u0165 maxim\u00e1lne 10 rokov.\\n\\nN\u00e1klady na realiz\u00e1ciu
  odstr\u00e1nenia syst\u00e9movej poruchy na pilotnom projekte boli 1 106 000,- Sk
  s DPH. Celkov\u00e1 d\u013a\u017eka \u0161k\u00e1r bola 2 008 m a poh\u013eadov\u00e1
  plocha obvodov\u00e9ho pl\u00e1\u0161\u0165a 3 292 m 3 . Na 1 m 2 poh\u013eadovej
  plochy pripad\u00e1 0,61 m \u0161k\u00e1r. N\u00e1klady na odstr\u00e1nenie syst\u00e9movej
  poruchy boli 500,- Sk/m \u0161k\u00e1ry alebo 305,- Sk/m 2 poh\u013eadovej  plochy.\\n\\nObnova
  obvodov\u00e9ho pl\u00e1\u0161\u0165a a \u0161k\u00e1r  sa vykon\u00e1va zo z\u00e1vesn\u00fdch
  l\u00e1vok. Odstr\u00e1nenie syst\u00e9movej poruchy obvodov\u00e9ho pl\u00e1\u0161\u0165a
  s vrstven\u00fdmi dielcami stavebnej s\u00fastavy P 1.14 je mo\u017en\u00e9 dosiahnu\u0165
  aj zateplen\u00edm, pri\u010dom sa zlep\u0161ia tepelnoizola\u010dn\u00e9 vlastnosti
  obvodov\u00e9ho pl\u00e1\u0161\u0165a po celej ploche a odstr\u00e1nia sa aj lok\u00e1lne
  tepeln\u00e9 mosty najm\u00e4 v oblasti vz\u00e1jomn\u00e9ho ukotvenia vrstiev obvodov\u00fdch
  dielcov.\\n\\nVydalo:\\n\\nMINISTERSTVO V\u00ddSTAVBY A REGION\u00c1LNEHO ROZVOJA\\n\\nSLOVENSKEJ
  REPUBLIKY\\n\\n\u0160pit\u00e1lska 8, 816 44 Bratislava\\n\\nE-mail: firstname.lastname@example.org\\n\\nhttp:
  www.build.gov.sk\\n\\nHolding ability of SILPRO strips at concrete surface is minimal
  about 50 % higher then holding ability of other tested strips \u2013 LUKOTES. Difference
  of the holding ability is not made by material of strips. The main strip material
  is equal as well as technological processing. Using variable paste mastics with
  different characteristics make the difference among the strips.\\n\\nResulted holding
  ability value of SILPRO strip at concrete surface is higher then tested value, in
  reality. The reason of it is that the cohesion between testing target and strip
  spoil and the cohesion between pasted strip and concrete surface does not unsettled
  during testing process.\\n\\nPoh\u013ead na zadn\u00e9 prie\u010delie bytov\u00e9ho
  domu P 1.14; Bratislava-Petr\u017eal- ka, Gercenova ul. \u010d. 15, 17 Poh\u013ead
  na zadn\u00e9 prie\u010delie bytov\u00e9ho domu P 1.14; Bratislava\u2013 Petr\u017ealka,
  Gercenova ul. \u010d.15, 17\\n\\nGeneral view on the back facade of dwelling house
  P 1.14 - structural system; Bratislava-Petrzalka, Gercenova Str. No 15,17.\\n\\nSilicone
  strips in width 100 mm produced by SILPRO LtD. Zilina were applied at the pilot
  project. The strip price is 90,- Sk/m (without TAX). Assumed lifetime of the silicone
  strips is 25 years. Joint upgrading used till present by applying of mastic has
  lifetime 10 years maximally.\\n\\nCosts for the pilot project realization of system
  failures removal were 1 106 000,-SK including Tax. Total length of the joints was
  2008 m and the facade area of overall walls was 3 293 m 2 . 0.6 m of joint appertains
  to 1 m 2 of facade area. Costs for system failures removal were 500,- Sk/m of joint
  or 305 ,- Sk/m 2 of facade area.\\n\\nUpgrading of overall walls and joints was
  carried out from assembly hung bench. The system failures removal of overall walls
  with sandwich panels of P 1.14 \u2013 structural system is possible to attain by
  additional thermal protection. It can cause improving of thermoinsulation characteristics
  of overall walls in all their area and local thermal bridges can be eliminated in
  the field of mutual anchoring of panel layers.\\n\\nSpracovate\u013e:\\n\\nVV\u00daPS
  - NOVA, v\u00fdskumno - v\u00fdvojov\u00fd \u00fastav  pozemn\u00fdch stavieb s.r.o.\\n\\nStuden\u00e1
  3, 820 02 Bratislava 22, P.O. Box 44\\n\\nTel.: (++421 7) 492 28 220, 492 28 557\\n\\nFax:
  (++421 7) 492 28 223\\n\\nE-mail: email@example.com\"", "\"* Dnes o 15.00 hod. bude
