  a k norm\u00e1lnej \u010dinnosti svalov. Je vhodn\u00e9 ho u\u017e\u00edva\u0165
  s ve\u010derou.\\n\\n**Pri vitam\u00ednoch rozpustn\u00fdch vo vode**\\n(C a v\u0161etky
