  Materi\u00e1ly pre\u0161li bez pripomienok.\\n\\n*  *  *\\n\\n11. Od\u0148atie nehnute\u013en\u00e9ho
  majetku mesta zo spr\u00e1vy Strediska slu\u017eieb \u0161kole a n\u00e1sledn\u00fd
  v\u00fdkon  spr\u00e1vy tohto majetku Bytov\u00fdm podnikom mesta Ko\u0161ice, s.r.o.\\np.
  Beca, starosta M\u010c Ko\u0161ice \u2013 Vy\u0161n\u00e9 Op\u00e1tske: Chce upozorni\u0165,
  ke\u010f doch\u00e1dza k zru\u0161eniu Strediska slu\u017eieb \u0161kole a majetok
  prech\u00e1dza  pod BPMK, aby si mesto dalo pozor, lebo s\u00fa \u0161koly, kde
  nie je \u00faplne jasn\u00e9 kde s\u00fa rozvody kanaliz\u00e1cie a in\u00fdch,
  ale s\u00fa tam pracovn\u00edci, ktor\u00ed tieto inform\u00e1cie maj\u00fa. Ak
  ich prepustia, BPMK nebude ma\u0165 inform\u00e1cie, kde ak\u00e9 z\u00e1sahy boli
  roben\u00e9 a kde ak\u00e9 rozvody s\u00fa upraven\u00e9.\\np. Petrvalsk\u00fd,
  starosta M\u010c Ko\u0161ice \u2013 S\u00eddlisko \u0164ahanovce: Tento bol ho zaradil,
  lebo u\u017e \u0161kolstvu zobrali 2 mili\u00f3ny eur \u2013 \u0161kolstvo sa za\u010d\u00edna
  rozpada\u0165, odch\u00e1dza p\u00e1n Hvozdovi\u010d. Doch\u00e1dza k hrub\u00e9mu
  poru\u0161ovaniu pr\u00e1vnych vz\u0165ahov, vymysleli si napr. to, \u017ee ke\u010f
  sa do \u0161k\u00f4l prij\u00edmaj\u00fa zamestnancov, mus\u00ed riadite\u013e donies\u0165
  jeho \u017eivotopis na magistr\u00e1t, tu sa pos\u00fadi, \u010di je vhodn\u00fd,
  aby pracoval v \u0161kolstve, a\u017e potom ho riadite\u013e m\u00f4\u017ee prija\u0165.
  Nako\u013eko \u0161koly maj\u00fa pr\u00e1vnu subjektivitu, je to hrub\u00e9 poru\u0161enie
  z\u00e1kona zamestnancami Magistr\u00e1tu mesta Ko\u0161ice. Ak sa zru\u0161\u00ed
  Stredisko slu\u017eieb \u0161kole a prejde pod BPMK, bytov\u00fd podnik je s.r.o-\u010dka,
  mysl\u00ed si, \u017ee oprava \u0161k\u00f4l je ve\u013emi dobr\u00fd k\u0161eft
  a nebud\u00fa m\u00f4c\u0165 to kontrolova\u0165. Je to zlat\u00e1 ba\u0148a pre
  ur\u010dit\u00fdch \u013eud\u00ed. S\u00fa poslanci, ktor\u00ed vyhl\u00e1sili,
  \u017ee investovali do predvolebn\u00e9ho boja a chc\u00fa, aby sa im trojn\u00e1sobok
  vr\u00e1til nasp\u00e4\u0165. Ob\u00e1va sa, \u017ee toto je jeden z t\u00fdch krokov,
  ktor\u00fd ich taktiku podpor\u00ed. Nebude hlasova\u0165 za tento bod, hoci nevie,
  pre\u010do sa n\u00edm zaoberaj\u00fa, starostovia s t\u00fdm ni\u010d nemaj\u00fa,
  je to v kompetencii mesta.\\np. Jen\u010dov\u00e1, starostka M\u010c Ko\u0161ice
  \u2013 Nad jazerom: Bytov\u00fd podnik mesta Ko\u0161ice je zriaden\u00fd mestom
  Ko\u0161ice, mesto tam m\u00e1 svoju \u010das\u0165 kontroly, je tam v dozornej
  rade a preto vie, \u017ee BPMK m\u00e1 nevyu\u017eit\u00e9 kapacity, \u010do sa
  t\u00fdka \u00fadr\u017eby, oprav\u00e1renstva a \u013eud\u00ed. Ide o to, aby tieto
  ich kapacity boli vyu\u017eit\u00e9 aj na \u0161koly, preto\u017ee gro vec\u00ed
  na bytovom fonde vykon\u00e1vaj\u00fa vlastn\u00fdmi silami, a s t\u00fdm, \u017ee
  v\u00e4\u010d\u0161ina pracovn\u00edkov zo strediska slu\u017eieb prejde pod bytov\u00fd
  podnik, tak\u017ee vyu\u017eij\u00fa aj t\u00fdch star\u00fdch pracovn\u00edkov,
  o ktor\u00fdch rozpr\u00e1val p\u00e1n starosta Beca. Nevid\u00ed v tom probl\u00e9m,
  p\u00f4jde to pod jedn\u00e9ho gazdu a \u010di p\u00f4jde opravova\u0165 blok alebo
  \u0161kolu, je to v podstate jedno. Mesto Ko\u0161ice je zria\u010fovate\u013e bytov\u00e9ho
  podniku, nie je to samostatn\u00e1 s.r.o.-\u010dka, \u017ee si m\u00f4\u017ee robi\u0165
  \u010do chce.\\np. Hlinka, starosta M\u010c Ko\u0161ice \u2013 Juh: Ide o to, \u010di
  m\u00e1 podnik vo svojej zria\u010fovate\u013eskej listine, zap\u00edsan\u00fa aj
  tak\u00fato \u010dinnos\u0165. Ak \u00e1no, je na zv\u00e1\u017eenie mestsk\u00e9ho
  zastupite\u013estva, ako zria\u010fovate\u013ea, \u010di t\u00fato vec schv\u00e1li,
  \u010di nie. Ak m\u00e1 \u2013 pani kolegy\u0148a to vie, \u017ee m\u00e1, tak to
  treba zriadi\u0165.\\n\\np. Re\u0161tei, predseda Rady starostov: Reagoval na p.
  Petrvalsk\u00e9ho, \u017ee to nepatr\u00ed na ich rokovanie, ale je toho n\u00e1zoru,
  \u017ee je mo\u017eno pripravova\u0165 pozv\u00e1nku na RS oklie\u0161tene. Ale
  je tu priestor, aby aspo\u0148 tie inform\u00e1cie mali, aby vedeli, \u010do sa
  v meste deje, aj ke\u010f to neovplyvnia, ale preto s\u00fa aj tak\u00e9to body
  zaraden\u00e9, aby mali preh\u013ead o \u010dom bude zastupite\u013estvo rokova\u0165,
  ak\u00fd je stav majetku mesta a podobne.\\n\\n*  *  *\\n\\n12. Bezodplatn\u00fd
