  Celkov\u00e1 v\u00fd\u0161ka poskytnut\u00e9ho finan\u010dn\u00e9ho pr\u00edspevku
  je vo v\u00fd\u0161ke 6 000,00 \u20ac, slovom \u0161est tis\u00edc eur.\\n\\n3.
  V \u010dl. III. sa bod 2. dop\u013a\u0148a za prvou vetou nasledovn\u00e9 znenie:\\n   Zv\u00fd\u0161en\u00fd
  finan\u010dn\u00fd pr\u00edspevok v sume 1000,00 \u20ac bude poskytnut\u00fd poskytovate\u013eovi
  soci\u00e1lnej slu\u017eby a pouk\u00e1zan\u00fd na \u00fa\u010det poskytovate\u013ea
  soci\u00e1lnej slu\u017eby v term\u00edne najnesk\u00f4r do 30.10.2011.\\n\\n4.
  V \u010dl. IV. sa bod 1. dop\u013a\u0148a za prvou vetou nasledovn\u00e9 znenie:\\n   Objedn\u00e1vate\u013e
  soci\u00e1lnej slu\u017eby sa zav\u00e4zuje pouk\u00e1za\u0165 zv\u00fd\u0161en\u00fd
  finan\u010dn\u00fd pr\u00edspevok na \u00fa\u010det poskytovate\u013ea do 15 dn\u00ed
  po podpise zmluvy obidvomi zmluvn\u00fdmi stranami, najneskor\u0161ie\\n\\nv\u0161ak
  do 30.10.2011 na \u00fa\u010det poskytovate\u013ea veden\u00fd v Tatrabanke, a.s.
  pobo\u010dka Prievidza, \u010d. \u00fa\u010dtu 2928851485/1100.\\n\\n5. Ostatn\u00e9
  ustanovenia zmluvy zo d\u0148a 16.3.2011 ost\u00e1vaj\u00fa nezmenen\u00e9.\\n\\n6.
  Tento Dodatok \u010d. 1 nadob\u00fada platnos\u0165 d\u0148om podpisu oboch str\u00e1n.
  Zmluva je \u00fa\u010dinn\u00e1 d\u0148om nasleduj\u00facim po dni zverejnenia na
  webovom s\u00eddle mesta Prievidza.\\n\\n7. Dodatok \u010d. 1 je vyhotoven\u00fd
