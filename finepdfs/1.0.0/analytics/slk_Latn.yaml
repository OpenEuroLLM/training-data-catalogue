  ich budete u\u017e\u00edva\u0165 r\u00e1no nala\u010dno s poh\u00e1rom \u010distej
  vody.\\n\\n**Zinok**\\nneu\u017e\u00edvajte s\u00fa\u010dasne doplnky obsahuj\u00face
  med, \u017eelezo alebo fosfor. Namiesto toho ich u\u017e\u00edvajte s odstupom nieko\u013ek\u00fdch
  hod\u00edn. V\u0161eobecne plat\u00ed, \u017ee ve\u013ek\u00e9 mno\u017estvo miner\u00e1lov
  u\u017e\u00edvan\u00fdch s\u00fa\u010dasne s in\u00fdmi miner\u00e1lmi zni\u017euje
  vz\u00e1jomn\u00fa absorpciu.\\\\(^{24}\\\\)\\n\\n**Prenat\u00e1lne a postnat\u00e1lne
  doplnky**\\nobsahuj\u00fa vitam\u00edny rozpustn\u00e9 v tukoch aj vo vode. Aby
  ste predi\u0161li \u017eal\u00fado\u010dnej nevo\u013enosti, u\u017e\u00edvajte
  ich spolu s jedlom alebo malou desiatou, obsahuj\u00facou spr\u00e1vne tuky.\\n\\nDoplnky
  nezapijajte **k\u00e1vou ani \u010dajom**. Nar\u00fa\u0161aj\u00fa vstreb\u00e1vanie
  mnoh\u00fdch vitam\u00ednov a miner\u00e1lov, najm\u00e4 \u017eeleza. Z\u00e1rove\u0148
  zni\u017euj\u00fa koncentr\u00e1ciu vitam\u00ednov rozpustn\u00fdch vo vode.\\n\\n---\\n\\n\\\\(^{24}\\\\)https://www.pharmanews.cz/clanek/zelezo-a-jeho-uloha-v-lidskem-organizmu-v-cetne-sportovcu-rekreaclnich-i-vrcholovych/\\n\\\\(^{25}\\\\)https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8377299/\\n\\nSPR\u00c1VNA
  D\u00c1VKA\\n\\nV\u00fd\u017eivov\u00e9 doplnky s\u00fa bezpe\u010dn\u00e9, ak ich
  u\u017e\u00edvate v spr\u00e1vnych odpor\u00fa\u010dan\u00fdch d\u00e1vkach. Rozhodne
  \u201eviac\u201c neznamen\u00e1 nevyhnutne \u201elep\u0161ie\u201c - niekedy to
  m\u00f4\u017ee by\u0165 dokonca \u201ehor\u0161ie\u201c. Pri u\u017e\u00edvan\u00ed
  vitam\u00ednov a miner\u00e1lov sa vyh\u00fdbajte vysok\u00fdm d\u00e1vkam, ktor\u00e9
  sa ozna\u010duj\u00fa ako \u201emegad\u00e1vky\u201c. Ak\u00e1ko\u013evek zlo\u017eka
  vo v\u00fd\u017eivov\u00fdch doplnkoch m\u00f4\u017ee by\u0165 vo ve\u013ekom mno\u017estve
  toxick\u00e1. Najz\u00e1va\u017enej\u0161ie riziko predstavuje \u017eelezo. \u0164a\u017ek\u00e9
  pred\u00e1vkovanie m\u00f4\u017ee sp\u00f4sobi\u0165 k\u00f3mu, n\u00edzky krvn\u00fd
  tlak, zlyh\u00e1vanie pe\u010de\u0148e, po\u0161kodenie pl\u00fac a smrt. \u010eal\u0161ie
  rizik\u00e1 s\u00fa spojen\u00e9 s megad\u00e1vkami v\u00e1pnika, vitam\u00ednu
  D a vitam\u00ednu A. Pred\u00e1vkovanie v\u00e1pn\u00edkom m\u00f4\u017ee naru\u0161i\u0165
  funkciu obli\u010diek, zv\u00fd\u0161i\u0165 Ph krvi, sp\u00f4sobi\u0165 nevo\u013enos\u0165,
  zvracanie, zm\u00e4tenos\u0165, zmeny spr\u00e1vania, svrbenie a v krajnom pr\u00edpade
  nepravideln\u00fd tep srca. Vysok\u00e9 d\u00e1vky vitam\u00ednu D m\u00f4\u017eu
  zv\u00fd\u0161i\u0165 hladinu v\u00e1pn\u00edka v krvi. Pred\u00e1vkovanie vitam\u00ednom
  A m\u00f4\u017ee vyvol\u00e1\u0165 nevo\u013enos\u0165, zvracanie, z\u00e1vrate
  a rozmazan\u00e9 videnie. V pr\u00edpade zhor\u0161enia V\u00e1s\u0161ho zdravotn\u00e9ho
  stavu, okam\u017eite kontaktujte svojho lek\u00e1ra.\\n\\nVYTVORITE RUTINU\\n\\nDoplnky
  nem\u00f4\u017eu optim\u00e1lne fungova\u0165, ak ich zabudnete vzia\u0165 alebo
  ich u\u017e\u00edvate ned\u00f4sledne. \u010ci u\u017e si svoje vitam\u00edny a
  miner\u00e1ly d\u00e1te pred ra\u0148ajkami, s obedom alebo po ve\u010deri, d\u00f4le\u017eit\u00e9
  je ich d\u00f4sledn\u00e9 u\u017e\u00edvanie ka\u017ed\u00fd de\u0148.\\n\\nUROBTE
  SI PORIADOK A Z\u00c1SOBY\\n\\nVy\u010dle\u0148te pre svoje v\u00fd\u017eivov\u00e9
  doplnky vhodn\u00e9 miesto. Skladujte pod\u013ea pokynov uveden\u00fdch na obale.
  Zva\u017ete pou\u017eitie policov\u00fdch organiz\u00e9rov, \u00falo\u017en\u00fdch
  kontajnerov a liekoviek, ktor\u00e9 V\u00e1m ulah\u010dia a ur\u00fdch\u013eia aplik\u00e1ciu
  suplementov. Aby ste predi\u0161li medzer\u00e1m v pr\u00edjme potrebn\u00fdch d\u00e1vok
  vitam\u00ednov a miner\u00e1lov, urobte si ich z\u00e1soby. V\u017edy prevorte d\u00e1tum
  minim\u00e1lnej trv\u00e1cnosti.\\n\\nNa\u0161e odpor\u00fa\u010danie: Budte trpezliv\u00ed.
