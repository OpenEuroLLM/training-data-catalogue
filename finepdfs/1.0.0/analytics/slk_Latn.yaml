  pr\u00edpadne zmenen\u00e9.\"", "\"1\\n\\n\u00dastav soci\u00e1lneho lek\u00e1rstva
  a lek\u00e1rskej etiky LF UK\\n\\na In\u0161tit\u00fat medic\u00ednskeho pr\u00e1va\\n\\nMedzin\u00e1rodn\u00e1
  vedeck\u00e1 konferencia na t\u00e9mu:\\n\\nPOSKYTOVANIE ZDRAVOTNEJ STAROSTLIVOSTI
  PRI OBMEDZEN\u00cd OSOBNEJ SLOBODY A OSOB\u00c1M SO ZN\u00cd\u017dENOU SCHOPNOS\u0164OU
  PR\u00c1VNE KONA\u0164\\n\\nMedic\u00edna je jedn\u00fdm z najr\u00fdchlej\u0161ie
  sa rozv\u00edjaj\u00facich odborov ako z poh\u013eadu vedy, tak z poh\u013eadu pr\u00e1vnych
  a ostatn\u00fdch spolo\u010densk\u00fdch s\u00favislost\u00ed. Nielen lek\u00e1r,
  ale ka\u017ed\u00fd jeden zdravotn\u00edcky pracovn\u00edk sa v s\u00fa\u010dasnosti
  ka\u017edodenne stret\u00e1va s probl\u00e9mami, ktor\u00e9 mnohokr\u00e1t nevypl\u00fdvaj\u00fa
  len zo samotn\u00e9ho realizovania diagnostick\u00fdch, terapeutick\u00fdch, pr\u00edp.
  prevent\u00edvnych medic\u00ednskych \u00fakonov, ale maj\u00fa omnoho \u0161ir\u0161iu
  dimenziu. Medic\u00ednske pr\u00e1vo je typick\u00e9 t\u00fdm, \u017ee mnoh\u00e9
  jeho in\u0161tit\u00faty neboli doposia\u013e vylo\u017een\u00e9 na\u0161ou judikat\u00farou,
  pr\u00edp. mnoh\u00e9 pr\u00e1vne probl\u00e9my, s ktor\u00fdmi sa ka\u017ed\u00fd
  de\u0148 zdravotn\u00edcki pracovn\u00edci stret\u00e1vaj\u00fa, nie s\u00fa rie\u0161en\u00e9
  ani v s\u00fa\u010dasnosti platn\u00fdmi a \u00fa\u010dinn\u00fdmi pr\u00e1vnymi
  predpismi. Pr\u00e1vo bezpochyby vstupuje aj do oblasti poskytovania zdravotnej
  starostlivosti a v\u00fdkonu jednotliv\u00fdch medic\u00ednskych \u00fakonov.\\n\\nMedzin\u00e1rodn\u00e1
  vedeck\u00e1 konferencia s n\u00e1zvom \u201ePoskytovanie zdravotnej starostlivosti
  pri obmedzen\u00ed osobnej slobody a osob\u00e1m so zn\u00ed\u017eenou schopnos\u0165ou
  pr\u00e1vne kona\u0165\\\" m\u00e1 napom\u00f4c\u0165 tomu, aby prebehla vecn\u00e1
  diskusia medzi jednotliv\u00fdmi odborn\u00edkmi z oblasti pr\u00e1va a medic\u00edny,
  a pon\u00fakli sa tak efekt\u00edvne rie\u0161enia na pr\u00edpadn\u00fa de lege
  ferenda \u00fapravu konkr\u00e9tnych medic\u00ednsko-pr\u00e1vnych in\u0161tit\u00fatov,
  ako aj vedecky od\u00f4vodnen\u00e9 legislat\u00edvne n\u00e1vrhy a odpor\u00fa\u010dania
  v oblasti zdravotn\u00edckej legislat\u00edvy.\\n\\nLek\u00e1rska fakulta UK chce
  svojou vedeckou autoritou prispie\u0165 k h\u013eadaniu v\u00fdchod\u00edsk pre
  rie\u0161enie tohto aktu\u00e1lneho probl\u00e9mu. Re\u00e1lnym krokom k splneniu
  stanoven\u00e9ho cie\u013ea bude usporiadanie medzin\u00e1rodnej vedeckej konferencie
  na t\u00e9mu:\\n\\n\u201ePOSKYTOVANIE ZDRAVOTNEJ STAROSTLIVOSTI PRI OBMEDZEN\u00cd
  OSOBNEJ SLOBODY A OSOB\u00c1M SO ZN\u00cd\u017dENOU SCHOPNOS\u0164OU PR\u00c1VNE
  KONA\u0164\\\"\\n\\nktor\u00e1 sa uskuto\u010dn\u00ed v d\u0148och 10.12. \u2013
  11.12. 2018\\n\\nPr\u00edspevky prezentovan\u00e9 \u00fa\u010dastn\u00edkmi konferencie
