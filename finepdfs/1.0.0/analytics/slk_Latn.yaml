  Ltd\"", "\"\u0160TAT\u00daT\\nOBECNEJ KNI\u017dNICE V MACHULINCIACH\\n\\nObecn\u00e9
  zastupite\u013estvo v Machulinciach na z\u00e1klade z\u00e1kona SNR \u010d. 369/1990
  Zb. o obecnom zriaden\u00ed v znen\u00ed neskor\u0161\u00edch zmien a doplnkov a
  \u00a74 ods. 2 p\u00edsm. a) z\u00e1kona NR SR \u010d. 126/2015 Z. z. o kni\u017eniciach
  vyd\u00e1va tento \u0161tat\u00fat Obecnej kni\u017enice v Machulinciach.\\n\\n\u00a7
  1\\nPr\u00e1vne postavenie kni\u017enice\\n\\n1. Zria\u010fovate\u013eom Obecnej
  kni\u017enice v Machulinciach (\u010falej len kni\u017enica) je Obec Machulince.
  Kni\u017enica nem\u00e1 pr\u00e1vnu subjektivitu, teda nem\u00e1 ani pr\u00e1vo
  vystupova\u0165 v pr\u00e1vnych vz\u0165ahoch. V\u0161etky rozhodnutia prin\u00e1le\u017eia
  zria\u010fovate\u013eovi.\\n2. P\u00f4sobnos\u0165 kni\u017enice je zhodn\u00e1
  s \u00fazem\u00edm Obce Machulince.\\n3. Metodick\u00fa pomoc a poradensk\u00fa
  slu\u017ebu poskytuje Obecnej kni\u017enici v Machulinciach Krajsk\u00e1 kni\u017enica
  Karola Kme\u0165ka v Nitre, ktor\u00e1 pln\u00ed \u00falohu metodick\u00e9ho centra
  pre verejn\u00e9 kni\u017enice v okresoch Nitra, \u0160a\u013ea a Zlat\u00e9 Moravce.\\n\\n\u00a7
  2\\nPoslanie kni\u017enice\\n\\n1. Z\u00e1kladn\u00fdm poslan\u00edm kni\u017enice
  je budova\u0165, ochra\u0148ova\u0165 a spr\u00edstup\u0148ova\u0165 univerz\u00e1lny
  kni\u017eni\u010dn\u00fd fond vr\u00e1tane dokumentov miestneho a region\u00e1lneho
  v\u00fdznamu. Kni\u017enica prostredn\u00edctvom kni\u017eni\u010dno-informa\u010dn\u00fdch
  slu\u017eieb a informa\u010dn\u00fdch technol\u00f3gi\u00ed zabezpe\u010duje slobodn\u00fd
  pr\u00edstup k inform\u00e1ci\u00e1m a tak spr\u00edstup\u0148uje kult\u00farne
  hodnoty a inform\u00e1cie a prispeva k uspokojovaniu potrieb pou\u017e\u00edvate\u013eov
  a k zlep\u0161ovaniu ich kult\u00farnej \u00farovne a vzdelanosti.\\n2. Kni\u017enica
  organizuje a zabezpe\u010duje tie\u017e \u010fal\u0161ie kult\u00farne, vzdel\u00e1vacie
  a spolo\u010densk\u00e9 podujatia, ktor\u00e9 s\u00favisia s jej hlavnou \u010dinnos\u0165ou
  (liter\u00e1rne stretnutia, besedy, exkurzie,...).\\n\\n\u00a7 3\\nSpr\u00edstupnenie
  kni\u017eni\u010dn\u00fdch fondov\\n\\n1. Kni\u017eni\u010dn\u00e9 fondy s\u00fa
  spr\u00edstup\u0148ovan\u00e9 vo\u013en\u00fdm v\u00fdberom. Dokumenty, ktor\u00e9
  kni\u017enica nem\u00e1 vo svojom fonde, m\u00f4\u017ee zabezpe\u010di\u0165 svojim
  pou\u017e\u00edvate\u013eom z inej kni\u017enice prostredn\u00edctvom medzikni\u017eni\u010dnej
  v\u00fdpo\u017ei\u010dnej slu\u017eby.\\n2. Kni\u017enica poskytuje svoje slu\u017eby
  pou\u017e\u00edvate\u013eom bez rozdielu ich politickej orient\u00e1cie, n\u00e1bo\u017eensk\u00e9ho
  presved\u010denia, bez rozdielu r\u00e1s, n\u00e1rodnost\u00ed, spolo\u010densk\u00e9ho
  alebo soci\u00e1lneho postavenia.\\n3. Kni\u017enica nesmie uchov\u00e1va\u0165,
  propagova\u0165 a po\u017ei\u010diava\u0165 diela, ktor\u00e9 s\u00fa v rozporu
  s \u00dastavou Slovenskej republiky a s Listinou \u013eudsk\u00fdch pr\u00e1v a
  slob\u00f4d.\\n\\n\u00a7 4\\nSpr\u00e1va kni\u017enice\\n\\n1. Za \u010dinnos\u0165
  kni\u017enice, hospod\u00e1renie so zveren\u00fdmi finan\u010dn\u00fdmi prostriedkami
  a s majetkom obce zodpoved\u00e1 zria\u010fovate\u013eovi pod\u013ea platn\u00fdch
  pr\u00e1vnych noriem a pod\u013ea pokynov zria\u010fovate\u013ea knihovn\u00edk.\\n\\n2.
  Zria\u010fovate\u013e m\u00f4\u017ee ustanovi\u0165 ako svoj poradn\u00fd org\u00e1n
  pre \u010dinnos\u0165 kni\u017enice kni\u017eni\u010dn\u00fa radu. \u010clenmi kni\u017eni\u010dnej
  rady s\u00fa obyvatelia obce, ktor\u00ed m\u00f4\u017eu svojimi n\u00e1zormi a sk\u00fasenos\u0165ami
  pr\u00edaznivo ovplyvni\u0165 \u010dinnos\u0165 kni\u017enice a z\u00e1rove\u0148
  sprostredkova\u0165 po\u017eiadavky verejnosti na v\u00fdber kn\u00edh do kni\u017eni\u010dn\u00e9ho
  fondu. Na \u010dele kni\u017eni\u010dnej rady je spravidla \u010dlen obecn\u00e9ho
  zastupite\u013estva. Knihovn\u00edk je \u010dlenom kni\u017eni\u010dnej rady.\\n\\n\u00a7
  5\\nHospod\u00e1renie kni\u017enice\\n\\n1. Hospod\u00e1renie kni\u017enice je s\u00fa\u010das\u0165ou
  hospod\u00e1renia obce a je viazan\u00e9 na jej rozpo\u010det. V rozpo\u010dte obce
  sa ka\u017edoro\u010dne stanovuje finan\u010dn\u00e1 \u010diastka na zabezpe\u010denie
  \u010dinnosti kni\u017enice a na n\u00e1kup kn\u00edh. O jej v\u00fd\u0161ke je
  knihovn\u00edk informovan\u00fd.\\n2. Kni\u017eni\u010dn\u00fd fond a majetok, ktor\u00fd
  kni\u017enica vyu\u017e\u00edva pri svojej \u010dinnosti, je majetkom obce. Knihovn\u00edk
  organizuje a spravuje zveren\u00fd majetok pod\u013ea v\u0161eobecne z\u00e1v\u00e4zn\u00fdch
  pr\u00e1vnych predpisov a z\u00e1sad hospod\u00e1renia s majetkom obce.\\n3. Knihovn\u00edk
  je povinn\u00fd zaobch\u00e1dza\u0165 so zveren\u00fdmi finan\u010dn\u00fdmi prostriedkami
  pod\u013ea pokynov zria\u010fovate\u013ea a v stanoven\u00fdch term\u00ednoch predklada\u0165
  vy\u00fa\u010dtovanie. Z\u00edskan\u00e9 finan\u010dn\u00e9 prostriedky je povinn\u00fd
  odovzda\u0165 1-kr\u00e1t mesa\u010dne na Obecn\u00fd \u00farad v Machulinciach.\\n4.
  Finan\u010dn\u00e9 zdroje kni\u017enice s\u00fa:\\n   a) rozpo\u010det obce,\\n   b)
  pr\u00edjmy z poplatkov vyinkasovan\u00fdch v kni\u017enici pod\u013ea kni\u017eni\u010dn\u00e9ho
  poriadku (z\u00e1pisn\u00e9, upomienky, n\u00e1hrada za straten\u00e9 knihy),\\n   c)
  sponzorsk\u00e9 pr\u00edspevky,\\n   d) pr\u00edjmy z in\u00fdch aktiv\u00edt kult\u00farneho
  charakteru (napr. burza kn\u00edh),\\n   e) finan\u010dn\u00e9 prostriedky z\u00edskan\u00e9
  z dot\u00e1ci\u00ed.\\n5. Sponzorsk\u00e9 pr\u00edspevky \u00fa\u010delovo ur\u010den\u00e9
  pre kni\u017enicu musia by\u0165 z\u00fa\u010dtovan\u00e9 tak, aby bolo preuk\u00e1zate\u013en\u00e9
  ich vyu\u017eitie.\\n\\n\u00a7 6\\nZ\u00e1vere\u010dn\u00e9 ustanovenie\\n\\n1.
  Poskytovanie kni\u017eni\u010dno-informa\u010dn\u00fdch slu\u017eieb upravuje kni\u017eni\u010dn\u00fd
  a v\u00fdpo\u017ei\u010dn\u00fd poriadok.\\n2. Zmeny a doplnky tohto \u0161tat\u00fatu
  schva\u013euje obecn\u00e9 zastupite\u013estvo.\\n3. Obecn\u00e9 zastupite\u013estvo
  Obce Machulince sa na tomto \u0161tat\u00fate obecnej kni\u017enice uznieslo na
  svojom 6. zasadnut\u00ed, d\u0148a 13.12.2019, uznesen\u00edm \u010d. 2019/6-16.\\n4.
  D\u0148om \u00fa\u010dinnosti tohto \u0161tat\u00fatu obecnej kni\u017enice sa ru\u0161\u00ed
  \u0160tat\u00fat obecnej kni\u017enice v Machulinciach, ktor\u00fd bol schv\u00e1len\u00fd
  na 10. riadnom zasadnut\u00ed Obecn\u00e9ho zastupite\u013estva v Machulinciach
  d\u0148a 12.06.2012.\\n5. Tento \u0161tat\u00fat obecnej kni\u017enice nadob\u00fada
  \u00fa\u010dinnos\u0165 1.janu\u00e1ra 2020.\\n\\nV Machulinciach, d\u0148a 13.12.2019\\n\\nBohumil
  Bielik\\nstarosta obce\\n\\n- N\u00e1vrh \u0160tat\u00fatu Obecnej kni\u017enice
