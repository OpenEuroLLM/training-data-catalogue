  s obmedzenou roz\u0161\u00edrite\u013enos\u0165ou. S kapacitou pevn\u00e9ho disku
  do 750 GB m\u00e1te dostatok miesta na s\u00fabory a programy. R\u00fdchlo pripojte
  a preneste \u00fadaje do a z extern\u00fdch zariaden\u00ed s \u010d\u00edta\u010dkou
  digit\u00e1lnych m\u00e9di\u00ed 6-v-1 a \u0161iestimi vysokor\u00fdchlostn\u00fdmi
  portami USB 2.0 s jednoduch\u00fdm pr\u00edstupom. M\u00f4\u017eete okam\u017eite
  a bezpe\u010dne komunikova\u0165 so zamestnancami, klientmi a potenci\u00e1lnymi
  klientmi, pri\u010dom softv\u00e9r McAfee Antivirus chr\u00e1ni v\u00e1\u0161 podnik
  pred nebezpe\u010dn\u00fdmi webov\u00fdmi lokalitami a v\u00edrusmi. So svojou schopnos\u0165ou
  inovova\u0165 a prida\u0165 \u0161tandardn\u00e9 telev\u00edzne tunery, grafick\u00e9
  karty alebo WiFi rie\u0161enia poskytuje po\u010d\u00edta\u010d 315eu MT kvalitu
  a v\u00fdkon, ktor\u00fd bude sp\u013a\u0148a\u0165 va\u0161e ka\u017edodenn\u00e9
  potreby, ako aj flexibilitu na prisp\u00f4sobenie sa rastu v\u00e1\u0161ho podniku.\\n\\nPrijate\u013en\u00fd
  pre \u017eivotn\u00e9 prostredie\\n\\nPo\u010d\u00edta\u010d 315eu MT je navrhnut\u00fd
  pre efektivitu a je vyroben\u00fd s oh\u013eadom na \u017eivotn\u00e9 prostredie.
  S programom HP Total Care m\u00f4\u017eete odpreda\u0165, recyklova\u0165 alebo
