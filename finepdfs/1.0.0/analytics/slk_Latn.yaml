  V \u010dl. II. sa bod 2. nahr\u00e1dza znen\u00edm:\\n   Soci\u00e1lnu slu\u017ebu
  \u2013 n\u00edzkoprahov\u00e9 denn\u00e9 centrum bude poskytovate\u013e soci\u00e1lnej
  slu\u017eby poskytova\u0165 vo svojej prev\u00e1dzke na Ul. A. Sl\u00e1dkovi\u010da
  \u010d. 5 a Ko\u0161ovsk\u00e1 cesta \u010d. 19 v Prievidzi.\\n\\n2. V \u010dl.
  III. sa bod 1. dop\u013a\u0148a za prvou vetou nasledovn\u00e9 znenie:\\n   Finan\u010dn\u00fd
