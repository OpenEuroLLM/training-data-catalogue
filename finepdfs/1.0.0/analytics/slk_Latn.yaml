  03  ZO D\u0147A  19.07.2017\\n\\nSEKRETARI\u00c1T ObFZ HUMENN\u00c9\\n\\nV ISSF
  pribudol nov\u00fd typ \u017eiadosti. Jedn\u00e1 sa o proces registr\u00e1cie \u0161portov\u00fdch
