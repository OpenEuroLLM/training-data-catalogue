  VZ schva\u013euje:\\n\\n1. Spr\u00e1vu v\u00fdboru o \u010dinnosti PSKO za rok 2016.\\n2.
  Spr\u00e1vu o hospod\u00e1ren\u00ed za rok 2016.\\n3. Spr\u00e1vu dozornej rady
  za rok 2016.\\n4. Splnomocnenie \u0161tatut\u00e1rov PSKO na v\u0161etky pr\u00e1vne
