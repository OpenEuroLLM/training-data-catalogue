  "\"strana 12\\n\\nRastlinn\u00e1 v\u00fdroba bez glyfos\u00e1tu\\n\\nGlyfos\u00e1t
  je bezpochyby verejne najdiskutovanej\u0161ou a z\u00e1rove\u0148 najkritizovanej\u0161ou
  l\u00e1tkou vyu\u017e\u00edvanou v po\u013enohospod\u00e1rstve. V s\u00fa\u010dasnosti
  je jeho pou\u017e\u00edvanie v E\u00da povolen\u00e9 do roku 2022. O tom, ak\u00fd
  m\u00f4\u017ee ma\u0165 vplyv na rastlinn\u00fa v\u00fdrobu obmedzenie, \u010di
  z\u00e1kaz pou\u017e\u00edvania tejto l\u00e1tky sme diskutovali s troma odborn\u00edkmi.\\n\\nstrana
  16\\n\\nProduk\u010dn\u00fd v\u00fdznam p\u00f4dnej organickej hmoty\\n\\nOrganick\u00e1
  hmota v p\u00f4de je zlo\u017een\u00e1 z nerozlo\u017een\u00fdch rastlinn\u00fdch
  zvy\u0161kov, mikrobi\u00e1lnych a \u017eivo\u010d\u00ed\u0161nych l\u00e1tok a
  produktov ich rozkladu - r\u00f4zneho stup\u0148a humifik\u00e1cie i kondenz\u00e1cie.
  Podiel nehumifikovanej \u010dasti z celkov\u00e9ho mno\u017estva organick\u00fdch
  l\u00e1tok v p\u00f4de predstavuje 10 \u2013 15 %.\\n\\nstrana 36\\n\\nProdukcia
  fytomasy pri minimaliza\u010dn\u00fdch technol\u00f3gi\u00e1ch\\n\\nD\u00f4vodom
  uplatnenia minimaliza\u010dn\u00fdch technol\u00f3gi\u00ed je dlhoro\u010dn\u00e9
  nevyu\u017e\u00edvanie tr\u00e1vnych porastov alebo len nieko\u013ekoro\u010dn\u00e9
  mul\u010dovanie. Nahromaden\u00e1 fytomasa zhor\u0161uje druhov\u00e9 zlo\u017eenie,
  preto je potrebn\u00e9 tieto porasty vertikutova\u0165 a n\u00e1sledne zlep\u0161ova\u0165
  pr\u00edsevmi.\\n\\nstrana 42\\n\\nVyu\u017eitie lignocelul\u00f3zov\u00fdch energetick\u00fdch
  rastl\u00edn\\n\\nCelkov\u00fd v\u00fdvoj potenci\u00e1lneho vyu\u017eitia biopal\u00edv
  a zdrojov pre ich v\u00fdrobu prech\u00e1dza v s\u00fa\u010dasnej dobe inova\u010dn\u00fdm
  a\u017e b\u00farliv\u00fdm procesom. V r\u00e1mci RED II (Renewable Energy Directive)
  a v r\u00e1mci plnenia Eur\u00f3pskej emisnej politiky bude potrebn\u00e9 od roku
  2020 primie\u0161ava\u0165 k fos\u00edlnym paliv\u00e1m pokro\u010dil\u00e9 biopaliv\u00e1
  ako napr. lignocelul\u00f3zov\u00fd bioetanol II. gener\u00e1cie.\\n\\nOdborn\u00fd
  recenzovan\u00fd mesa\u010dn\u00edk pre pestovate\u013eov rastl\u00edn \u2022 7/2019
