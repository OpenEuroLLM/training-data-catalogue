  odborn\u00edkov. Pod\u013ea z\u00e1konu o \u0161porte je povinn\u00e9, aby ka\u0163d\u00e1
  registrovan\u00e1 osoba mala pr\u00edslu\u0161nos\u0165 zv\u00e4zov\u00fa, alebo
  klubov\u00fa.\\n\\nV menu Elektronick\u00e1 podate\u013e\u0148a pribudol nov\u00fd
