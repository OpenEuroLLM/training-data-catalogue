  a zhotovite\u013e \u010falej spolu len ako \u201ezmluvn\u00e9 strany\u201c alebo
  jednotlivo \u201ezmluvn\u00e1 strana\u201c)\\n\\n2. Predmet zmluvy\\n\\n2.1 Predmetom
  zmluvy je vytvorenie diela \u201eBezpe\u010dnostn\u00e1 anal\u00fdza - pos\u00fadenie
  optim\u00e1lnosti formy a sp\u00f4sobu ochrany majetku BVS, a.s.\u201c (\u010falej
  len \u201edie\u013eo\u201c).\\n\\n2.2 Obsahovou n\u00e1pl\u0148ou diela je vykonanie
  anal\u00fdzy aktu\u00e1lneho stavu fyzickej a objektovej bezpe\u010dnosti pre celkov\u00fd
  po\u010det 540 objektov objedn\u00e1vate\u013ea, pri\u010dom zoznam objektov je
  uveden\u00fd v Pr\u00edlohe \u010d. 1 tejto zmluvy. V\u00fdstupom anal\u00fdzy bude
  dokument, ktor\u00fd bude obsahova\u0165:\\n\\na) Opis zisten\u00ed pre ka\u017ed\u00fd
  z analyzovan\u00fdch objektov:\\n   - stru\u010dn\u00fd opis a charakteristika akt\u00edv
  objektu,\\n   - identifik\u00e1cia a ohodnotenie hrozieb pre dan\u00fd objekt,\\n   -
  identifik\u00e1cia zranite\u013enost\u00ed a pos\u00fadenie vhodnosti a \u00fa\u010dinnosti
  v s\u00fa\u010dasnosti implementovan\u00fdch bezpe\u010dnostn\u00fdch opatren\u00ed
  pre dan\u00fd objekt,\\n   - vyhodnotenie riz\u00edk a n\u00e1vrh sp\u00f4sobu ich
  riadenia,\\n   - n\u00e1vrh zmien v sp\u00f4sobe zabezpe\u010denia ochrany objektu.\\n\\nb)
  N\u00e1vrh syst\u00e9mov\u00fdch opatren\u00ed, ktor\u00e9 prispej\u00fa k optimaliz\u00e1cii
  vynakladan\u00fdch n\u00e1kladov na ochranu majetku objedn\u00e1vate\u013ea.\\n\\nc)
  Ekonomick\u00e1 anal\u00fdza preukazuj\u00faca celkov\u00e9 n\u00e1klady na implement\u00e1ciu
  a prev\u00e1dzku navrhovan\u00e9ho rie\u0161enia (TCO \u2013 total cost of ownership)
  v strednodobom horizonte (5 rokov - investi\u010dn\u00e9 aj prev\u00e1dzkov\u00e9
  n\u00e1klady).\\n\\n2.3 V\u00fdstupy diela bud\u00fa vyhotoven\u00e9 v s\u00falade
  s po\u017eiadavkami \u00a710 z\u00e1kona \u010d. 45/2011 Z. z. o kritickej infra\u0161trukt\u00fare
  a ustanoveniami z\u00e1kona \u010d. 473/2005 Z. z. o poskytovan\u00ed slu\u017eieb
  v oblasti s\u00fakromnej bezpe\u010dnosti.\\n\\n2.4 Zhotovite\u013e vykon\u00e1
  dielo na svoje n\u00e1klady a na svoje nebezpe\u010denstvo v stanovenom \u010dase.
  Okrem ceny zhotovite\u013e nem\u00e1 n\u00e1rok na n\u00e1hradu ak\u00fdchko\u013evek
  n\u00e1kladov spojen\u00fdch s jeho vykon\u00e1van\u00edm.\\n\\n3. Doba trvania
  zmluvy a miesto jej plnenia\\n\\n3.1 Doba plnenia tejto zmluvy sa stanovuje na tri
  (3) mesiace odo d\u0148a nadobudnutia \u00fa\u010dinnosti tejto zmluvy.\\n\\n3.2
  Miestom plnenia predmetu zmluvy s\u00fa pracovisk\u00e1 zhotovite\u013ea a objedn\u00e1vate\u013ea.\\n\\n4.
  Podmienky plnenia a akcept\u00e1cia v\u00fdstupov\\n\\n4.1 Objedn\u00e1vate\u013e
  na po\u017eiadanie zhotovite\u013ea poskytne zhotovite\u013eovi potrebn\u00e9 inform\u00e1cie
  a s\u00fa\u010dinnos\u0165, ktor\u00e9 bude zhotovite\u013e potrebova\u0165 pri
  plnen\u00ed tejto zmluvy na \u00fa\u010dely riadneho vykonania \u010dinnosti pod\u013ea
  tejto zmluvy. Po dobu neposkytnutia potrebn\u00fdch inform\u00e1ci\u00ed a s\u00fa\u010dinnosti
  zo strany objedn\u00e1vate\u013ea zhotovite\u013e nie je v ome\u0161kan\u00ed s
  plnen\u00edm tejto zmluvy.\\n\\n4.2 Plnenie predmetu zmluvy pod\u013ea \u010cl\u00e1nku
  2 bod 2.2 je schv\u00e1len\u00e9 podpisom akcepta\u010dn\u00e9ho protokolu opr\u00e1vnenou
  osobou objedn\u00e1vate\u013ea a zhotovite\u013ea.\\n\\n4.3 Ak sa vyskytn\u00fa
  v\u00fdhrady zo strany objedn\u00e1vate\u013ea, je tento povinn\u00fd ich ozn\u00e1mit
  p\u00edsomnou formou zhotovite\u013eovi. Ak objedn\u00e1vate\u013e do 15 dn\u00ed
  nedoru\u010d\u00ed zhotovite\u013eovi v\u00fdhrady k predmetu plnenia, pova\u017euje
  sa predmet plnenia za prevzat\u00fd bez v\u00fdhrad.\\n\\n5. Cena a sp\u00f4sob
  platby\\n\\n5.1 Cena sa stanovuje dohodou pod\u013ea z\u00e1k. \u010d. 18/1996 Z.
  z. o cen\u00e1ch v znen\u00ed neskor\u0161\u00edch predpisov. Cena za dielo v rozsahu
  pod\u013ea \u010dl\u00e1nku 1. tejto zmluvy je vo v\u00fd\u0161ke 119 900,- EUR
  bez DPH (slovom stodev\u00e4tn\u00e1stis\u00edc dev\u00e4\u0165sto eur). K cene
  za dielo bude uplatnen\u00fd re\u017eim DPH pod\u013ea aktu\u00e1lne platn\u00fdch
  pr\u00e1vnych predpisov.\\n\\n5.2 Zmluvn\u00e1 cena je pevn\u00e1 a fixn\u00e1 a
  nepodlieha eskal\u00e1cii po cel\u00fa dobu platnosti zmluvy a zahr\u0148uje v\u0161etky
  s\u00favisiace n\u00e1klady a poplatky spojen\u00e9 s dodan\u00edm predmetu zmluvy.\\n\\n5.3
  Cena za dielo bude jednorazovo uhraden\u00e1 na z\u00e1klade fakt\u00fary vystavenej
  zhotovite\u013eom po podp\u00edsan\u00ed akcepta\u010dn\u00e9ho protokolu oboma
  zmluvn\u00fdmi stranami.\\n\\n5.4 Fakt\u00fara \u2013 da\u0148ov\u00fd doklad bude
  obsahova\u0165 n\u00e1le\u017eitosti v s\u00falade so z\u00e1konom \u010d. 222/2004
  Z. z. o dani z pridan\u00e9 hodnoty v znen\u00ed neskor\u0161\u00edch predpisov
  vr\u00e1tane rozdelenia predmetu faktur\u00e1cie na jednotliv\u00e9 druhy dodan\u00fdch
  tovarov a slu\u017eieb v zmysle ustanoven\u00ed \u00a7 74 odseku 1 p\u00edsmeno
  f) tohto z\u00e1kona. Prilohou fakt\u00fary mus\u00ed by\u0165 akcepta\u010dn\u00fd
  protokol podp\u00edsan\u00fd zodpovedn\u00fdmi osobami oboch zmluvn\u00fdch str\u00e1n
  a potvrden\u00e1 k\u00f3pia objedn\u00e1vky zaslanej objedn\u00e1vate\u013eom alebo
  vo fakt\u00fare bude \u010d\u00edslo objedn\u00e1vky, pod ktor\u00fdm ju objedn\u00e1vate\u013e
  eviduje.\\n\\n5.5 V pr\u00edpade, \u017ee fakt\u00fara nebude obsahova\u0165 n\u00e1le\u017eitosti
  uveden\u00e9 v bode 5.4 tohto \u010dl\u00e1nku zmluvy, objedn\u00e1vate\u013e je
  opr\u00e1vnen\u00fd vr\u00e1ti\u0165 ju zhotovite\u013eovi na prepracovanie, resp.
  doplnenie. V takom pr\u00edpade sa zastavi plynutie lehoty splatnosti a nov\u00e1
  lehota splatnosti za\u010dne plyn\u00fa\u0165 d\u0148om doru\u010denia a prevzatia
  opravenej fakt\u00fary podate\u013e\u0148ou v s\u00eddle objedn\u00e1vate\u013ea.\\n\\n5.6
  Za spr\u00e1vne vy\u010d\u00edslenie sadzby dane z pridan\u00e9 hodnoty pod\u013ea
  z\u00e1kona \u010d. 222/2004 Z. z. o dani z pridan\u00e9 hodnoty v znen\u00ed neskor\u0161\u00edch
  predpisov zodpoved\u00e1 zhotovite\u013e v plnom rozsahu.\\n\\n5.7 Splatnos\u0165
  fakt\u00fary je 30 dn\u00ed odo d\u0148a jej doru\u010denia do podate\u013ene v
  s\u00eddle objedn\u00e1vate\u013ea. Fakt\u00fara sa pova\u017euje za uhraden\u00fa
  d\u0148om prip\u00edsania fakturovanej \u010diastky na \u00fa\u010det zhotovite\u013ea.\\n\\n5.8
  Objedn\u00e1vate\u013e neposkytuje z\u00e1lohu na financovanie vykonania diela.\\n\\n6.
  Z\u00e1ru\u010dn\u00e1 doba - zodpovednos\u0165 za vady a \u0161kodu\\n\\n6.1. Zhotovite\u013e
  poskytuje z\u00e1ruku, \u017ee dielo bude vykonan\u00e9 pod\u013ea podmienok zmluvy
  a \u017ee bude ma\u0165 vlastnosti dohodnut\u00e9 v tejto zmluve.\\n\\n6.2. Z\u00e1ruka
  na dielo sa poskytuje v trvani dvadsa\u0165\u0161tyri (24) mesiacov. Z\u00e1ru\u010dn\u00e1
  doba za\u010d\u00edna plyn\u00fa\u0165 d\u0148om riadneho odovzdania diela objedn\u00e1vate\u013eovi.
  Zhotovite\u013e zodpoved\u00e1 za vady diela, ktor\u00e9 dielo preuk\u00e1za\u0165e\u013ene
  m\u00e1 v \u010dase jeho odovzdania a za vady, ktor\u00e9 sa vyskytn\u00fa po\u010das
  plynutia z\u00e1ru\u010dnej doby.\\n\\n6.3. Po\u010das plynutia z\u00e1ru\u010dnej
  doby m\u00e1 objedn\u00e1vate\u013e pr\u00e1vo po\u017eadova\u0165 bezodplatne a
  bezodkladne odstr\u00e1nenie v\u00e1d a zhotovite\u013e je povinn\u00fd zisten\u00e9
  vady bezodplatne a bezodkladne odstr\u00e1ni\u0165.\\n\\n6.4. Objedn\u00e1vate\u013e
  je povinn\u00fd zisten\u00e9 vady diela u zhotovite\u013ea uplatni\u0165 bezodkladne
  po ich zisten\u00ed p\u00edsomnou formou.\\n\\n6.5. Zmluvn\u00e1 strana zodpoved\u00e1
  za \u0161kodu, ktor\u00fa sp\u00f4sob\u00ed druhej zmluvnej strane poru\u0161en\u00edm
  svojej povinnosti zo zmluvy a je povinn\u00e1 ju nahradit, okrem pr\u00edpadov,
  kedy preuk\u00e1\u017ee,\\n\\n\u017ee poru\u0161enie povinnosti bolo sp\u00f4soben\u00e9
  okolnostami vylu\u010duj\u00facimi zodpovednos\u0165. Pri uplatnen\u00ed a \u00fahrade
  \u0161k\u00f4d a n\u00e1kladov sa zmluvn\u00e9 strany bud\u00fa riadi\u0165 ustanoveniami
  \u00a7 373 a nasl. Obchodn\u00e9ho z\u00e1konnika.\\n\\n6.6. Zmluvn\u00e9 strany
  sa dohodli, \u017ee \u017eiadna zo zmluvn\u00fdch str\u00e1n nezodpoved\u00e1 za
  \u0161kodu, ktor\u00e1 vznikla v d\u00f4sledku vecne nespr\u00e1vneho alebo inak
  chybn\u00e9ho zadania druhej zmluvnej strany. Zmluvn\u00e9 strany sa tie\u017e dohodli,
  \u017ee \u017eiadna zo zmluvn\u00fdch str\u00e1n nie je zodpovedn\u00e1 za nesplnenie
  svojho z\u00e1v\u00e4zku v d\u00f4sledku ome\u0161kania druhej zmluvnej strany.\\n\\n7.
  Zmluvn\u00e9 pokuty\\n\\n7.1. Ak zhotovite\u013e odovzd\u00e1 dokon\u010den\u00e9
  dielo uveden\u00e9 v \u010cl\u00e1nku 2. zmluvy po term\u00edne uvedenom v \u010cl\u00e1nku
  3. odseku 3.1. zmluvy, m\u00e1 objedn\u00e1vate\u013e pr\u00e1vo uplatni\u0165 si
  u zhotovite\u013ea n\u00e1rok na zaplatenie zmluvnej pokuty vo v\u00fd\u0161ke 50,00
  EUR (slovom: p\u00e4\u0165desiat eur) za ka\u017ed\u00fd aj za\u010dat\u00fd de\u0148
  ome\u0161kania.\\n\\n7.2. Ak zhotovite\u013e neodstr\u00e1ni vady v dohodnutom term\u00edne
  v zmysle \u010cl\u00e1nku 6. odseku 6.3. tejto zmluvy, m\u00e1 objedn\u00e1vate\u013e
  pr\u00e1vo uplatni\u0165 si u zhotovite\u013ea n\u00e1rok na zaplatenie zmluvnej
  pokuty vo v\u00fd\u0161ke 50,00 EUR (slovom p\u00e4\u0165desiat eur) za ka\u017ed\u00fd
  aj za\u010dat\u00fd de\u0148 ome\u0161kania a\u017e do doby odstr\u00e1nenia reklamovan\u00fdch
  v\u00e1d.\\n\\n7.3. Ak objedn\u00e1vate\u013e neuhrad\u00ed fakt\u00faru v stanovenom
  term\u00edne v zmysle \u010cl\u00e1nku 5. odseku 5.7. tejto zmluvy, m\u00e1 zhotovite\u013e
  pr\u00e1vo uplatni\u0165 si u objedn\u00e1vate\u013ea n\u00e1rok na zaplatenie \u00faroku
  z ome\u0161kania vo v\u00fd\u0161ke 0,022 % z dl\u017enej \u010diastky za ka\u017ed\u00fd
  de\u0148 ome\u0161kania. Zhotovite\u013e sa zav\u00e4zuje, \u017ee \u017eiadne in\u00e9
  sankcie vo\u010di objedn\u00e1vate\u013eovi v pr\u00edpade ome\u0161kania objedn\u00e1vate\u013ea
  pod\u013ea predch\u00e1dzaj\u00facej vety tohto odseku zmluvy neuplatn\u00ed.\\n\\n8.
  Vy\u0161\u0161ia moc\\n\\n8.1. Zmluvn\u00e9 strany nezodpovedaj\u00fa za \u0161kody,
  ktor\u00e9 by mohli sp\u00f4sobi\u0165, resp. sp\u00f4sobili druhej zmluvnej strane
  poru\u0161en\u00edm povinnosti pod\u013ea zmluvy v pr\u00edpade, ak toto bolo sp\u00f4soben\u00e9
  d\u00f4vodmi, za ktor\u00e9 dan\u00e1 zmluvn\u00e1 strana nenesie zodpovednos\u0165,
  a ktor\u00e9 ani pri vynalo\u017een\u00ed dostupnej starostlivosti nemohla ovplyvn\u00ed\u0165,
  najm\u00e4 z d\u00f4vodu vojny, \u0161trajku, mobiliz\u00e1cie, povstania, \u017eiveln\u00fdch
  pohr\u00f4m, preru\u0161enia dod\u00e1vok energii, materi\u00e1lov.\\n\\n8.2 V pr\u00edpade,
  ke\u010f niektor\u00e1 zmluvn\u00e1 strana zist\u00ed, \u017ee z d\u00f4vodu vy\u0161\u0161ej
  moci nebude schopn\u00e1 plni\u0165 si svoje povinnosti pod\u013ea zmluvy, je povinn\u00e1
  o tom bezodkladne informova\u0165 druh\u00fa zmluvn\u00fa stranu. Toto ozn\u00e1menie
  mus\u00ed by\u0165 p\u00edsomn\u00e9 a mus\u00ed obsahova\u0165 \u00fadaje o vzniku
  a povahe okolnost\u00ed a ich mo\u017en\u00fdch d\u00f4sledkoch pre vykonanie diela.
  V pr\u00edpade, \u017ee tieto d\u00f4vody pom\u00edn\u00fa, bude dotknut\u00e1 zmluvn\u00e1
  strana op\u00e4tovne p\u00edsomne informova\u0165 druh\u00fa zmluvn\u00fa stranu
  a z\u00e1rove\u0148 bude pokra\u010dova\u0165 v plnen\u00ed povinnosti pod\u013ea
  zmluvy.\\n\\n8.3. Ak splnenie tejto zmluvy sa stane nemo\u017en\u00fdm do \u0161iestich
  (6) mesiacov od vyskytnutia sa vy\u0161\u0161ej moci, zmluvn\u00e1 strana, ktor\u00e1
  sa bude chcie\u0165 odvolat'' na vy\u0161\u0161iu moc, po\u017eiada druh\u00fa zmluvn\u00fa
  stranu o \u00fapravu zmluvy vo vztahu k predmetu, cene za dielo a \u010dasu plnenia.
  Ak nedojde k dohode, m\u00e1 zmluvn\u00e1 strana, ktor\u00e1 sa odvolala na vy\u0161\u0161iu
  moc, pr\u00e1vo odst\u00fapi\u0165 od zmluvy. U\u010dinky odst\u00fapenia nastan\u00fa
  d\u0148om doru\u010denia ozn\u00e1menia druhej zmluvnej strane.\\n\\n9. Ostatn\u00e9
  ustanovenia\\n\\nZhotovite\u013e vyhlasuje, \u017ee vlastn\u00ed doklad o opr\u00e1vnen\u00ed
  podnika\u0165 v rozsahu \u010cl\u00e1nku 2. tejto zmluvy. Zhotovite\u013e zodpoved\u00e1
  za \u0161kodu sp\u00f4soben\u00fa objedn\u00e1vate\u013eovi v pr\u00edpade, \u017ee
  sa toto vyhl\u00e1senie uk\u00e1\u017ee ako nepravdiv\u00e9.\\n\\n10. Doru\u010dovanie\\n\\n10.1.
  V\u0161etky ozn\u00e1menia a \u017eiados\u0165 pod\u013ea zmluvy bud\u00fa uroben\u00e9
  v p\u00edsomnej forme a bud\u00fa doru\u010den\u00e9 osobne, kuri\u00e9rom, faxom
  alebo doporu\u010denou po\u0161tou pr\u00edslu\u0161nej zmluvnej strane.\\n\\n10.2.
  Tak\u00e9to ozn\u00e1menia, \u017eiadosti a zasielan\u00e9 dokumenty sa bud\u00fa
  pova\u017eova\u0165 za doru\u010den\u00e9:\\n   a) momentom odovzdania na pr\u00edslu\u0161nej
  adrese alebo momentom odmietnutia prevzatia (v pr\u00edpade osobn\u00e9ho doru\u010denia
  a doru\u010denia kuri\u00e9rom) alebo\\n   b) uplynut\u00edm piateho (5.) kalend\u00e1rneho
