  malu kolicinu u tegli od 2 litra. Nije kasno, imacete kiseli kupus za novogodi\u0161nji
  docek. Kupus *narendajte* na secku ili no\u017eem ako ste ve\u0161ti. U vecoj posudi
  kupus posolite i dobro prome\u0161ajte da se podjednako osoli.\\n\\nPrekrijte posudu
  i ostavite bar 1/2 sata da odstoji i otpusti sokove. Povremeno prome\u0161ajte.
  Pripremite teglu ili neku plasticnu kanticu koju ste prethodno dobro oprali U pripremljenu
  teglu ka\u0161ikom dodajte kupus, pritiskajuci da \u0161to vi\u0161e kupusa stane
  u tegli. Postupak ponavljajte dok do vrha napunite teglu. Pritisnite plasticnom
  re\u0161etkom da kupus oblije sok, kao na slici.\\n\\nTeglu pove\u017eite gazom
  ili platnenom salvetom, stavite je u dublji tanjir, kako bi prilikom vrenja sok
  mogao da se sacedi u tanjir. Ostavite uz neki izvor toplote, pec ili radijator.
  ?im pocne da vri, to cete znati kad sok pocne da se sliva u tanjir, pomerite teglu
  na hladnije mesto.\\n\\nTreceg dana kupus jo\u0161 *vri*, ali je vec dobar za jelo.
  Probajte, sve\u017eeg kupusa ima preko cele godine.\\n\\nSavet\"", "\"SVETLOST SIJA
  UTAMI\\n\\n3. pouka za 20. april 2024.\\n\\n\u201eIsus im re\u010de: Jo\u0161 je
  malo vremena svetlost sa vama; idite dok svetlost imate da vas tama ne obuzme; a
  ko ide po tami ne zna kuda ide.\u201c (Jovan 12,35)\\n\\nRat se dobija ili gubi
  od bitke do bitke.\\n\\nKada je sotona izgubio bitku progonstva, smislio je novi
  plan: kompromis. Me\u0161avina istine i la\u017ei odvukla je milione da prihvate
  krivotvorenu, be\u017eivotnu istinu.\\n\\nNa\u0161a jedina za\u0161tita u ovoj borbi
  je prionuti uz Isusa koji je Istina i \u017divot i Njegovu svetu Re\u010d.\\n\\nBitka
  za istinu:\\n- Istina protiv la\u017ei.\\n- Kompromis crkve.\\n\\nBitka za Re\u010d
  Bo\u017eiju:\\n- Sigurnost u Bibliji.\\n- Ljudsko razmi\u0161ljanje.\\n\\nBitka
  za um.\\n\\nBITKA ZA ISTINU\\n\\n\u201eIsus odgovori: Ja sam put i istina i \u017eivot.
  Niko ne dolazi k Ocu osim kroz mene.\u201c (Jovan 14,6)\\n\\nIsus je Istina i time
  otac svake istine (Jovan 14,6). Sva istina, sve pouzdano, sve \u0161to je istinito,
  dolazi od Njega. A Njegova istina proizvodi \u017eivot u nama.\\n\\nNasuprot Njemu,
  sotona je otac la\u017ei (Jn. 8,44). Sve prevare, sve zlonamerne suptilnosti, sve
  krivotvorene istine, dolaze od njega. A njegove la\u017ei proizvode smrt u nama.\\n\\nU
  svojim sukobima s neprijateljem Isus je koristio Bibliju kao izvor svake istine:\\n\u201ePisano
  je\u201c (Mt 4,4; 21,13).\\n\\nZato je \u0111avo radio na tome da uni\u0161ti Bibliju,
  bilo sakrivaju\u0107i je ili iskrivljuju\u0107i je. I to je postigao (iako ne u
  potpunosti) kroz Rimsku crkvu, tokom srednjeg veka (zvanog i \u201emra\u010dni vek\u201c).\\n\\nKOMPROMIS
  CRKVE\\n\\n\u201eJer ja ovo znam da \u0107e po odlasku mom u\u0107i me\u0111u vas
  te\u0161ki vuci koji ne\u0107e \u0161tedeti stada; I izme\u0111u vas samih posta\u0107e
  ljudi koji \u0107e govoriti izvrnutu nauku da odvra\u0107aju u\u010denike za sobom.\u201d
  (Dela 20,29-30).\\n\\nOpra\u0161taju\u0107i se od efeskih stare\u0161ina, Pavle
  je izrazio svoju zabrinutost zbog spolja\u0161njih i unutra\u0161njih problema s
  kojima \u0107e se Crkva suo\u010diti u budu\u0107nosti (Dela 20,29-30).\\n\\n1.
  **Grabe\u017eljivi vukovi**. Od 64. do 313. godine (Milanski edikt tolerancije)
  Crkva je trpela \u017eestoke progone od strane Rimskog Carstva.\\n\\n2. **Pokvareni
  ljudi**. Po\u010dev\u0161i od 4. veka, u Crkvu su u\u0161li neobra\u0107eni ljudi
  koji su pome\u0161ali paganstvo s istinom.\\n\\nSotona je koristio svoju \u201eunutra\u0161nju\u201c
  strategiju da iskvari istinu i uvede idolopoklonstvo i svetkovanje nedelje u\\n\\nKao
  \u0161to je Pavle prorekao, te su zablude prihva\u0107ene i ostaje do kraja me\u0111u
  onima koji ne \u017eele da znaju istinu (2. Solunjanima 2,7-12). Kona\u010dna bitka
  \u0107e se temeljiti na kompromisu po pitanju\\n\\nBITKA ZA RE\u010c BO\u017dIJU\\n\\nSIGURNOST
  U BIBLIJI\\n\\n\u201ePosveti ih istinom; Tvoja je Re\u010d istina.\u201d (Jovan
  17,17)\\n\\nBiblija je nepogre\u0161ivo otkrivenje Bo\u017eije volje. Predstavlja
  nebeski plan za spasenje \u010dove\u010danstva. Zato se na\u0161a sigurnost nalazi
  samo u Bibliji, u svakoj njenoj knjizi, poglavlju i stihu (2. Tim 3,16).\\n\\nU
  njoj nalazimo sve va\u017ene teme: planove \u0111avola, stvaranje, ro\u0111enje,
  \u017eivot, smrt, vaskrsenje i Isusovo posredovanje, opro\u0161tenje greha, Isusov
  povratak, ve\u010dni \u017eivot na Novoj Zemlji...\\n\\nAko odbacimo deo toga (na
  primer, izve\u0161taj o stvaranju u Postanju 1 i 2), mogli bismo odbaciti bilo koje
  u\u010denje koju Biblija podu\u010dava. I onda... kakvu sigurnost mo\u017eemo imati
  da verujemo ostatku Biblije?\\n\\n\u201eRe\u010d je tvoja svetiljka nozi mojoj,
  svetlost stazi mojoj.\u201c (Ps. 119,105)\\n\\n\u201eRazmatranje tvojih re\u010di
  daje svetlo; daje razum prostim.\u201c (Ps. 119,130)\\n\\nLJUDSKO RAZMI\u0160LJANJE\\n\\n\u201ePostoji
  put koji se \u010dini ispravnim, ali na kraju vodi u smrt.\u201c (Pri\u010de 16,25)\\n\\nAko
  je Bog taj koji je nadahnuo Bibliju, ko je mo\u017ee protuma\u010diti (2. Pt. 1,20;
  Jovan 14,26)?\\n\\nOsoba bez Duha ne prihvata ono \u0161to dolazi od Bo\u017eijeg
  Duha, ve\u0107 to smatra ludo\u0161\u0107u i ne mo\u017ee ni\u0161ta pravilno razumeti
  jer se Biblija mo\u017ee razumeti samo Duhom (1. Kor 2,14).\\n\\nPrimer ljudskog
  razmi\u0161ljanja su vi\u0161a i ni\u017ea kritika koje je od 18. stolje\u0107a
  predlagalo \u201eakademsko\u201c tuma\u010denje Biblije.\\n\\nNjihov temeljni pristup
  je poricanje \u010duda i nemogu\u0107nost predvi\u0111anja budu\u0107nosti. Prema
  ovom pristupu, kakvu korist mo\u017eemo izvu\u0107i iz Bo\u017eije Re\u010di ako
  pori\u010demo njenu mo\u0107 ili sposobnost da saznamo budu\u0107nost koja nas \u010deka?\\n\\nBez
  sumnje, neprijatelj smi\u0161lja puteve koji nam se \u010dine ispravnim, ali njihov
  je kraj smrt (Pri\u010de 16,25).\\n\\n\u201eDuhovni mrak prekrio je Zemlju, a tama
  narode. U mnogim crkvama postoji skepticizam i neverstvo u tuma\u010denju Svetoga
  pisma. Veoma mnogo njih dovodi u pitanje verodostojnost i istinitost Svetoga pisma.
  Ljudsko razmi\u0161ljanje i ma\u0161ta ljudskog srca potkopavaju nadahnu\u0107e
  Re\u010di Bo\u017eije...\\n\\nOva Sveta knjiga izdr\u017eala je napade sotone, koji
  se udru\u017eio sa zlim ljudima kako bi sve \u0161to je bo\u017eanskog karaktera
  obavio u oblake i tamu. Ali Gospod je svojom \u010dudesnom mo\u0107i sa\u010duvao
  ovu Svetu knjigu u njenom sada\u0161njem obliku \u2013 mapu ili vodi\u010d za ljudsku
  porodicu kako bi im pokazao put do Neba.\u201c\\n\\nBITKA ZA UM\\n\\n\\\"Bog ovoga
  doba zaslijepio je umove nevjernika, tako da ne mogu vidjeti svjetlo evan\u0111elja
  koje pokazuje slavu Krista, koji je slika Bo\u017eja\\\" (2. Korin\u0107anima 4:4
  NIV)\\n\\n\u0160panska izreka ka\u017ee: \u201eNema goreg slepca od onoga koji ne
  \u017eeli da vidi.\u201c Odnosno, beskorisno je uveravati nekoga da vidi ono \u0161to
  ne \u017eeli da vidi. Tako je i s onima koje je \u201ebog ovoga sveta\u201c zaslepio
  (2.Kor. 4,4).\\n\\nNedostatak znanja kod onih koji su izgubljeni nije zato \u0161to
  nemaju sposobnost da znaju. To je zato \u0161to ne \u017eele znati. \u0110avo je
  zaokupio njihov um mnogim stvarima koje ih spre\u010davaju da razmi\u0161ljaju o
  onome \u0161to je zaista va\u017eno: o svom spasenju.\\n\\nAli niko ne mora ostati
  u ovakovom stanju. Kada je um u duhovnoj tami, postoji svetlo koje mo\u017ee i ho\u0107e
  sjati u njemu: \u201eSvetlost (Isus) svetli u tami i tama ga ne obuze\u201c (Ivan
  1,5).\\n\\nOni od nas koji prihvataju ovo svetlo mogu poni\u0161titi delo neprijatelja
  i u\u010diniti da Isusovo svetlo zasija kroz tamu.\\n\\n\u201eSvi koji putuju putem
  prema Nebu trebaju sigurnog vodi\u010da. Ne smemo hoditi u ljudskoj mudrosti. Na\u0161a
  je prednost da slu\u0161amo Hristov glas koji nam govori dok putujemo \u017eivotnim
  putovanjem, a Njegove su re\u010di uvek re\u010di mudrosti...\\n\\nNa\u0161a jedina
  sigurnost le\u017ei u tome da sledimo Hrista i da mu budemo veoma blizu, hode\u0107i
  u Njegovoj mudrosti i praktikovanju Njegove istine. Ne mo\u017eemo uvek lako otkriti
  sotonino delovanje. Ne znamo gde postavlja svoje zamke. Ali Isus razume suptilne
  ve\u0161tine neprijatelja i On mo\u017ee dr\u017eati na\u0161e noge na sigurnim
  stazama.\u201c\\n\\nElen Vajt, Na\u0161e uzvii\u0161eno zvanje, 10. januar\"", "\"\\n\\nSimpati\u010dna
  naivnost tog trgova\u010dkog sveta prote\u017ee se i na reklamu. \u010citam letak
  jednog oranskog bioskopa, koji najavljuje neki tre\u0107erazredni \ufb01 lm. Zapa\u017eam
  prideve \u201erasko\u0161an\\\", \u201evelelepan\\\", \u201eizvanredan\\\", \u201epresti\u017ean\\\",
  \u201epotresan\\\" i \u201ezapanjuju\u0107i\\\". Na kraju, uprava obave\u0161tava
  publiku o \u017ertvama koje je morala da podnese da bi joj prikazala to izuzetno
  \u201eostvarenje\\\". Me\u0111utim, cena karata ne\u0107e biti pove\u0107ana. Bilo
  bi pogre\u0161no misliti da je to odraz ju\u017enja\u010dkog smisla za preuveli\u010davanje.
  Autori te divne reklame pru\u017eaju dokaze o svom psiholo\u0161kom daru. Treba
  pobediti ravnodu\u0161nost i duboku apatiju koji se u ovoj zemlji osete \u010dim
  treba izabrati izme\u0111u dve predstave, dva posla i, \u010desto, izme\u0111u dve
  \u017eene. Ljudi se odlu\u010duju samo kada su na to prisiljeni. A reklama to dobro
  zna. I ona \u0107e poprimiti ameri\u010dke razmere, zato \u0161to, i Ulice Orana
  nam najzad otkrivaju dva bitna zadovoljstva ovda\u0161nje omladine: \u010di\u0161\u0107enje
  cipela i \u0161etanje tih istih cipela po bulevarima. Da bi se stekla jasna predstava
  o prvom od ta dva zadovoljstva, treba poveriti svoje cipele u deset izjutra \u010dista\u010dima
  cipela na bulevaru Galijeni. Kada se posadi na visoku stolicu, \u010dovek mo\u017ee
  da oseti posebno u\u017eivanje koje, \u010dak i za profanog, pru\u017ea prizor ljudi
  zaljubljenih svoj posao, kao \u0161to su to oranski \u010dista\u010di cipela. Sve
  se radi do u detalje. Nekoliko \u010detki, tri vrste krpa, imalin pome\u0161an s
  benzinom: neko bi pomislio da se ceo zahvat zavr\u0161ava s prvim savr\u0161enim
  sjajem koji se pojavi ispod meke \u010detke. Ali, ista uporna ruka ponovo ma\u017ee
  blistavu povr\u0161inu, trlja je, gasi joj sjaj, utiskuje imalin do sr\u017ei ko\u017ee,
  da bi onda, pod istom \u010detkom, iz\\n\\n13 me\u0111u njima prvi put penju u ring
  i da se, prema tome, mo\u017ee ra\u010dunati ako ne na ve\u0161tinu, onda makar
  na sr\u010danost rivala. Po\u0161to me je jedan Oranac naelektrisao sve\u010danim
  obe\u0107anjem \u201eda \u0107e biti krvi\\\" i ja sam se te\\n\\nmoramo da odbacimo
  protivre\u010dnost i u\u010dinimo sve \u0161to je potrebno da bismo je smanjili.
  Na\u0161 ljudski zadatak jeste da prona\u0111emo onih nekoliko formula koje \u0107e
  umiriti beskrajnu zebnju slobodnih du\u0161a. Treba da okrpimo ono \u0161to je pocepano,
  da u\u010dinimo pravdu pojmljivom u jednom svetu tako o\u010devidno nepravednom,
  da vratimo veru u postojanje sre\u0107e narodima zatrovanim nesre\u0107om veka.
  Prirodno, to je nat\u010dove\u010danski zadatak. Ali, nat\u010dove\u010danskim se
  nazivaju zadaci za koje je ljudima potrebno mnogo vremena da ih ispune, to je sve.
  Znajmo, dakle, \u0161ta ho\u0107emo, ostanimo \u010dvrsto pri duhu, \u010dak i ako
  sila, da bi nas osvojila, preuzme lik neke ideje ili udobnosti. Pre svega ne treba
  o\u010dajavati. Ne obra\u0107ajmo previ\u0161e pa\u017enje na one koji predskazuju
  kraj sveta. Civilizacije ne umiru tako lako, a \u010dak i ako se ovaj svet sru\u0161i,
  to \u0107e biti posle tolikih drugih. Istina je da \u017eivimo u tragi\u010dnom
  dobu. Ali, mnogi brkaju tragi\u010dnost i o\u010dajavanje. \u201eU nesre\u0107i\\\",
  govorio je Lorens (D. H. Lawrence), \u201etragedija bi morala da bude kao dobar
  udarac nogom.\\\" Evo jedne zdrave smisli, odmah primenljive. Danas ima mnogo stvari
  koje zaslu\u017euju takav udarac. Dok sam \u017eiveo u Al\u017eiru, strpljivo sam
  provodio zimu, jer sam znao da \u0107e se preko no\u0107i, jedne jedine februarske
  no\u0107i, hladne i \u010diste, bademi u Dolini Konzula 4 prekriti belim cvetovima.
  I bivao sam zadivljen kako taj ne\u017eni sneg zatim odoleva svim ki\u0161ama i
  vetru s mora. Uporno se dr\u017eao, svake godine, upravo koliko je bilo potrebno
  da zametne plod. To nije simbol. Svoju sre\u0107u ne\u0107emo osvojiti simbolima.
  Za tako ne\u0161to potrebno je vi\u0161e ozbiljnosti. Ho\u0107u samo da ka\u017eem
  da se ponekad, kada teret \u017eivota, u ovoj Evropi jo\u0161 prepunoj svoje nesre\u0107e,
  postane\\n\\npogled velikih \u017eivotinja. U tom pogledu, pla\u017ee Orana su najlep\u0161e,
  jer su priroda i \u017eene tamo najdivljije. \u0160to se ti\u010de \u017eivopisnosti,
  Al\u017eir nudi arapski grad, Oran crna\u010dko selo i \u0161pansku \u010detvrt,
  a Konstantin jevrejsku \u010detvrt. Al\u017eir ima duga\u010dku ogrlicu bulevara
  prema moru; tuda se treba pro\u0161etati no\u0107u. Oran ima malo drve\u0107a, ali
  i najlep\u0161e kamenje na svetu. Konstantin ima vise\u0107i most, na kojem se treba
  fotogra\ufb01 sati. U dane jakog vetra, most se ljulja iznad duboke klisure Rumela
  i to izaziva ose\u0107aj opasnosti. Prijem\u010divom putniku do\u0111e li u Al\u017eir,
  preporu\u010dujem da popije liker od anisa pod svodovima pristani\u0161ta; da izjutra
  u Ribanici jede sve\u017ee ulovljenu ribu, pe\u010denu na ro\u0161tilju s ugljem;
  da slu\u0161a arapsku muziku u jednoj kafanici u ulici Lire, \u010dije sam ime zaboravio;
  a sedne n azemlju u podno\u017eju kipa vojvode Orleanskog u \u0161est sati uve\u010de,
  na trgu Vlad (ne zbog vojvode ve\u0107 zato \u0161to tuda prolazi set i \u0161to
  je prijatno); da ru\u010da u restoranu Padovani, nekoj vrsti terase za ples, na
  stubovima iznad mora, gde je \u017eivot uvek lak; da poseti arapska groblja, pre
  svega da bi prona\u0161ao mir i lepotu, a zatim da bi ocenio pravu vrednost onih
  odvratnih gradova u koje mi sklanjamo svoje mrtve; da popu\u0161i jednu cigaretu
  u ulici Mesara u Kazbi, usred slezina, d\u017eigerica, trbu\u0161nih maramica i
  krvavih plu\u0107a, koja kaplju na sve strane (cigareta je potrebna, \u0160to se
  ti\u010de ostalog, treba znati govoriti ru\u017eno o Al\u017eiru kada ste u Oranu
  (podvu\u0107i nadmo\u0107 oranske luke), zbijati \u0161ale na ra\u010dun Orana kada
  ste u Al\u017eiru (prihvatiti bez ustezanja mi\u0161ljenje da Oranci \u201ene znamit,
  na\u0161i \ufb01 lozo\ufb01  znaju ili samo za besmisao ili samo za razum, zato
  \u0161to su zatvorili o\u010di pred ostalim. Krtica razmi\u0161lja. Hri\u0161\u0107anstvo
  je bilo to koje je po\u010delo da zamenjuje posmatranje sveta tragedijom du\u0161e.
  Ali, ono se makar pozivalo na duhovnu prirodu i pomo\u0107 nje je odr\u017eavalo
  neku stalnost. Po\u0161to je Bog umro, ostali su samo istorija i sila. Ve\u0107
  dugo vremena svi napori na\u0161ih \ufb01 lozofa imaju za cilj da pojam ljudske
  prirode zamene pojmom situacije, a staru harmoniju stihijskim ispadima slu\u010daja
  ili nemilosrdnim hodom razuma. Dok su Grci volju ograni\u010davali razumom, mi smo
  impuls volje na kraju stavili usred razuma, a on je time postao ubila\u010dki. Vrednosti
  su za Grke prethodile svakoj akciji, kojoj su i iscrtavale jasne granice. Moderna
  \ufb01 lozo\ufb01 ja postavlja svoje vrednosti na kraju akcije. One ne postoje,
  ali nastaju, i mi \u0107emo ih u celini saznati tek na zavr\u0161etku istorije.
  S njima nestaje i granica, a kako se mi\u0161ljenja o tome kako bi trebalo da izgledaju
  te vrednosti razlikuju i po\u0161to nema borbe koja se, ako se ne obuzdava tim istim
  vrednostima, ne produ\u017eava u beskraj, dana\u0161nji mesijanizmi se sukobljavaju
  i njihovi krici zamiru u sudarima carstava. Neumerenost je po\u017ear. Po\u017ear
  se \u0161iri. Ni\u010de je prevazi\u0111en. Evropa vi\u0161e ne \ufb01 lozo\ufb01
  ra uz Ali, priroda je i dalje tu. Ona suprotstavlja svoja mirna neba i svoje razloge
  ludilu ljudi; sve dok se i atom ne zapali, a istorija ne zavr\u0161i u trijumfu
  razuma i agoniji vrste. Ali, Grci nikada nisu rekli da se granica ne mo\u017ee prekora\u010diti.
  Rekli su da ona postoji i da onaj ko se usudi da je prekora\u010di biva nemilosrdno
  ka\u017enjen. Ni\u0161ta u dana\u0161njoj istoriji to ne bi\\n\\nOdrastao sam na
  moru i siroma\u0161tvo mi je izgledalo tako rasko\u0161no; onda sam ostao bez mora
  i otkrio da je rasko\u0161 sumorna, a siroma\u0161tvo nepodno\u0161ljivo. Od tada
  \u010dekam. \u010cekam la\u0111e koje se vra\u0107aju, dom na vodi, prozra\u010dan
  dan. Strpljiv sam, u\u010dtiv, iz sve snage. Vi\u0111aju me kako prolazim lepim,
  otmenim ulicama, kako se divim pejza\u017eima, tap\u0161em kao i svi ostali, rukujem
  se, ali nisam ja taj koji govori. Hvale me, pomalo sanjarim, vre\u0111aju me, jedva
  da se \u010dudim. Onda zaboravljam i osmehujem se onome ko me vre\u0111a ili suvi\u0161e
