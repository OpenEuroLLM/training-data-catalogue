  77   |\\n\\nPREDGOVOR\\n\\nOvo je veoma potresna knjiga, jer u dana\u0161njem svetu
  tinejd\u017eerima tokom adolescencije nije lako pomo\u0107i. Ova knjiga se u celosti
  bavi stvarnim problemima roditeljstva.\\n\\nRoditelji nisu obu\u010deni za roditeljsku
  ulogu, pa tinejd\u017eere \u010desto odgajaju nasumce. \u010cak se i \u201euspe\u0161i\u201c
  \u010dine slu\u010dajnim. Ova knjiga predstavlja za roditelje pouzdan vodi\u010d,
  primeren dana\u0161njem na\u010dinu \u017eivota.\\n\\nO tinejd\u017eerskoj depresiji
  i o tome kako tinejd\u017eeri mogu da izraze svoj gnev na primeren na\u010din, autor
  knjige, doktor Kembel, pi\u0161e sa puno ose\u0107anja, a ipak jasno. Podse\u0107a
  nas na stvari kao \u0161to su \u201ebezuslovna ljubav\u201c i da li je dovoljno
  pru\u017eamo na\u0161oj deci, kao i na kvalitetno vreme i pa\u017enju koje im pru\u017eamo.
  Sve je sme\u0161teno u hri\u0161\u0107anske okvire, ali ne tako da pru\u017ea gotove
  odgovore, ve\u0107 u vidu pomo\u0107i da se pronade pravi na\u010din produblivanja
  odnosa roditelja sa svojom decom u njihovim te\u0161kim tinejd\u017eerskim godinama.\\n\\nOno
  \u0161to nam se naro\u010dito svidelo jeste autorova iskrenost i izno\u0161enje
  ne samo zdravih na\u010dela, ve\u0107 i na\u010dina na koji su ta na\u010dela delovala
  u njegovoj porodici. On ne izbegava probleme ve\u0107 nudi njihovo re\u0161enje,
  istovremeno daju\u0107i nam primere, kako za uspehe, tako i za neusphe. Knjiga nema
  za cilj osudivanje na\u0161ih neuspheha, nego ukazivanje na bolje na\u010dine re\u0161enja
  problema. Ono \u0161to sna\u017eno uti\u010de na \u010ditaoca je, kako radost roditeljstva,
  tako i odgovornosti koje ono nosi.\\n\\nDoktor Kembel pi\u0161e kao psihijatar,
  izbegava \u017eargon i nije optere\u0107en stru\u010dnim izrazima. Predla\u017eemo
  da pro\u010ditate ovu knjigu pre nego \u0161to va\u0161a deca postanu tinejd\u017eeri.
  To je prakti\u010dna knjiga koju \u0107ete \u010ditati ponovo i ponovo dok budete
  prolazili kroz tinejd\u017eerske godine va\u0161e dece.\\n\\nRoj i Fiona Kasl\\n\\nUvod\\n\\nVoditi
  dete tokom tinejd\u017eerskih godina slo\u017een je i opasan poduhvat i mnogi roditelji
  imaju mnogo pote\u0161ko\u0107a s tim. U svakom pogledu, polo\u017eaj dece ovog
  uzrasta pogor\u0161ava se iz godine u godinu. Samoubistva tinejd\u017eera su u tolikom
  porastu da je to trenutno drugi najva\u017eniji uzrok smrti u populaciji izme\u0111u
  \u010detrnaest i dvadeset godina. Uspeh u \u0161koli i kriterijumi tokom \u0161kolovanja
  zna\u010dajno su opali u poslednjih nekoliko godina. Statisti\u010dki gledano, sve
  su rasprostranj\u0435\u043d\u0438ji zloupotreba droga, maloletni\u010dka delinkvencija,
  trudno\u0107a u tinejd\u017eerskim godinama, seksualno prenosive bolesti i ose\u0107anje
  o\u010dajanja.\\n\\n\u0160ta nije u redu? Osnovni problem je obi\u010dno u roditeljima
  koji nemaju uravnote\u017eeno vi\u0111enje svog odnosa prema tinejd\u017eerima.
  Ve\u0107ina roditelja ima pogre\u0161nu predstavu o tome \u0161to je to mladala\u010dki
  uzrast i \u0161to mogu da o\u010dekuju od tih mladih ljudi.\\n\\nIako ve\u0107ina
  roditelja istinski voli svoje tinejd\u017eere, oni ne znaju kako da im tu ljubav
  iska\u017eu na taj na\u010din da se deca ose\u0107aju voljenom i prihva\u0107enom.
  Ipak, roditelji koji stvarno \u017eele da pru\u017ee svojoj deci tinejd\u017eerima
  ono \u0161to im je potrebno, mogu da nau\u010de kako da to urade.\\n\\nZaklju\u010dio
  sam da roditelji koji primenjuju principe iz ove knjige uspe\u0161nije poma\u017eu
  tinejd\u017eerima da se pravilno razviju i postanu odgovorni, zreli i savesni ljudi.\\n\\nOsnovno
  gradivo za ovu knjigu uzeo sam iz moje prve knjige Kako stvarno voleti svoje dete
  (How to Really Love Your Child). Po\u0161to su potrebe tinejd\u017eera mnogo slo\u017eenije
  od onih kod mla\u0111e dece, neophodno je informacije primeniti na drugi na\u010din.\\n\\nKada
  ideje iz ove knjige usvojite i kada va\u0161 odnos s va\u0161im nara\u0161tajcem
  postane \u010dvrst i uravnote\u017een, bi\u0107ete prijatno iznenadeni saznanjem
  koliko uzbudljiva mo\u017ee da bude va\u0161a ljubav prema va\u0161em detetu i koliko
  sve to mo\u017ee da vas ispuni sre\u0107om.\\n\\nKao ilustracije koristio sam mnoge
  studije iz sopstvene prakse i se\u0107anja. Nisu kori\u0161tena stvarna imena, a
  okolnosti su dovoljno izmenjene da bi se za\u0161titio identitet mojih pacijenata.\\n\\n1.
  TINEJD\u017dERI: DECA U PRELAZNOM PERIODU\\n\\n\u201eNe mogu da verujem da je to
  uradila\u201c, rekla je gospoda Baten, kad su ona i gospodin Baten u mojoj ordinaciji
  po\u010deli da mi otkrivaju svoju bolnu pri\u010du. \u201eBila je tako dobra devoj\u010dica,
  uvek zadovoljna, nikad nam nije pravila probleme. Mislila sam da svojoj \u010der\u0107i
  Debi pru\u017eamo sve \u0161to joj je potrebno \u2013 ode\u0107u, odlazak u crkvu,
  dobar dom.\\n\\nZa\u0161to bi ikada po\u017eelela da se ubije? Kako je mogla da
  popije sve one pilule? Da li ona stvarno \u017eeli da umre, ili samo \u017eeli da
  skrene pa\u017enju na sebe? Zbunjena sam. A postala je tako mrzovoljna i sumorna.
  Ne mogu da razgovaram s njom, a ona ne \u017eeli da razgovara sa mnom. Stalno \u017eeli
  da bude sama u svojoj sobi. A i ocene su joj uzasne.\u201c Gospoda Baten je sela,
  snu\u017edila se, nije bilo sjaja u njenim ina\u010de svetlim o\u010dima. \u0160to
  mi je vi\u0161e pri\u010dala o problemima svoje \u010derke, znao sam da je i ona
  zbunjena i usamljena kao i Debi. Bio je to tipi\u010dan primer nedovoljnog razumevanja
  kako treba voleti tinejd\u017eera.\\n\\n\u201eKada ste primetili ove promene kod
  Debi?\u201c, upitao sam.\\n\\n\u201ePre otprilike dve ili tri godine\u201c, odgovorila
  je gospoda Baten. \u201eSve se doga\u0111alo tako postepeno da nismo mislili da
  je ne\u0161to ozbiljno, sve do nedavno. Evo, vidite, ona sad ima petnaest godina.
  Tokom poslednjih meseci prvog razreda srednje \u0161kole, primetili smo da joj je
  dosadno \u2013 pre svega u \u0161koli. Dobijala je slabije ocene. Profesorka se
  \u017ealila na njeno sanjarenje i odsutnost na \u010dasovima. Bila je vrlo zabrinuta
  za Debi. Volela bih da smo pa\u017eljivije slu\u0161ali gospodu Kolins. Ona je ba\u0161
  dobar profesor.\\n\\nPostepeno, Debi je bilo sve dosadnije u \u017eivotu. Polako
  je odustajala od svojih omiljenih aktivnosti i izgledalo je kao da je izgubila interesovanje
  za sve, \u010dak i za crkvu. Po\u010dela je da izbegava svoje dobre prijatelje i
  sve vi\u0161e vremena je provodila sama. Govorila je sve manje i manje.\\n\\nSve
  se pogor\u0161alo slede\u0107e godine. Potpuno se otudila od svojih starih prijatelja
  i po\u010dela da se vida s decom koja su stalno bila u nekoj nevolji. Njeno stanje
  se pogor\u0161alo od kad se zbli\u017eila sa svojim novim prijateljima. Oni su je
  \u010desto uvla\u010dili u nevolje \u2013 velike nevolje.\\n\\n\u201ePoku\u0161ali
  smo skoro sve\u201c, nastavila je gospoda Baten. \u201ePrvo smo je tukli. Zatim
  smo joj smanjivali povlastice i slobodu, ka\u017enjavali je. Poku\u0161ali smo i
  da je nagradimo za dobro pona\u0161anje. Razgovarali smo sa svima za koje smo mislili
  da mogu da nam pomognu. Stvarno verujem da smo poku\u0161ali sve. Ima li joj pomo\u0107i?\\n\\n\u201eO\u010dajni
  smo\u201c, ubacio se gospodin Baten. \u201eDa li smo se lo\u0161e poneli kao roditelji?
  Mislim da smo se dovoljno trudili. Da li je to ne\u0161to nasledno? Ili mo\u017eda
  neki fizi\u010dki nedostatak? Treba li da proverimo nivo \u0161e\u0107era ili da
  uradimo EEG? Da li bi pomogli vitamini i minerali? Doktore Kembel, mi volimo Debi.
  \u0160ta mo\u017ee da se uradi? Ima li nade?\\n\\nVideo sam Debi posle odlaska njenih
  roditelja. Bila je lepa, simpati\u010dna devoj\u010dica. Iako je nesumnjivo bila
  inteligentna, bilo joj je te\u0161ko da razgovara jasno i glasno. Komunicirala je
  uglavnom gundaju\u0107i, \u010desto odgovaraju\u0107i samo sa \u201emhm\u201c. Nije
  imala prirodnu spontanost i entuzijazam koje obi\u010dno vidamo kod petnaestogodi\u0161njakinja.
  Bilo je o\u010digledno da je nesre\u0107na i bilo je vrlo te\u0161ko razgovarati
  s njom.\\n\\nIpak, kad joj je bilo malo prijatnije, po\u010dela je da razgovara
  slobodnije, a i vi\u0161e me gledala u o\u010di. Svojim pona\u0161anjem i re\u010dima
  pokazivala je da je izgubila interesovanje za sve do \u010dega joj je nekad bilo
  stalo. Na kraju je rekla: \u201eNi\u0161ta nije va\u017eno. Nikome nije stalo do
  mene, a ni meni nije stalo ni do \u010dega. Ionako nije va\u017eno.\u201c\\n\\nDok
  smo dalje razgovarali, postalo je o\u010digledno da Debi pati od sve \u010de\u0161\u0107eg
  ozbiljnog mladala\u010dkog problema \u2013 depresije. Retko kad je bila zadovoljna
  sobom i svojim \u017eivotom. Godinama je \u017eudela za bliskim, toplim odnosom
  s roditeljima, ali je u proteklih nekoliko meseci polako odustala od tog sna. Sve
  vi\u0161e se okretala vr\u0161njacima za koje je mislila da \u0107e je prihvatiti
  s vi\u0161e ljubavi; ali njena tuga se samo jo\u0161 vi\u0161e produbljivala.\\n\\nTu\u017eno
  je re\u0107i, ali Debi je tipi\u010dan predstavnik ve\u0107ine devoj\u010dica u
  tom uzrastu. Debi je ranije izgledala sre\u0107no i zadovoljno. Bila je zadovoljno
  dete koje je tek pone\u0161to zahtevalo od svojih roditelja, nastavnika i drugih.
  Zbog toga niko nije sumnjao da ona ne ose\u0107a da je roditelji iskreno vole i
  prihva\u0107aju. Iako je imala roditelje koji je iskreno vole i brinu se za nju,
  Debi nije ose\u0107ala da je iskreno voljena. Da, razumski, Debi je znala da je
  roditelji vole i brinu za nju i nikad vam ne bi rekla da je ne vole. Ali, nije imala
  onaj dragoceni i presudan ose\u0107aj potpune i bezuslovne ljubavi i prihva\u0107enosti.\\n\\nOvu
  situaciju je te\u0161ko razumeti jer su nju roditelji voleli i brinuli se za njene
  potrebe kako su najbolje mogli i umeli. Gospodin i gospoda Baten poku\u0161ali su
  sve \u0161to su znali, a sledili su i neke savete stru\u010dnjaka. Njihov brak bio
  je stvarno dobar. Imali su stabilan odnos i voleli su se. Po\u0161tovali su jedno
  drugo.\\n\\nDa, Batenovi su, kao i mnogi roditelji danas, iskusili pote\u0161ko\u0107e
  u odgajanju tinejd\u017eera i imali nedoumice o tome kako da ih pravilno vode kroz
  \u017eivot. Uz svakodnevnu napetost u porodicu, lako je obeshrabriti se, postati
  zbunjen ili pesimisti\u010dan. Pove\u0107ana stopa razvoda, ekonomske i finansijske
  krize, slabiji kvalitet obrazovanja i gubitak poverenja u vodstvo \u2013 sve to
  dovodi do emocionalnih pote\u0161ko\u0107a u svakome. I dok smo mi roditelji pod
  stalnim fizi\u010dkim, emocionalnim i duhovnim pritiskom, postaje nam sve te\u017ee
  da brinemo o na\u0161im tinejd\u017eerima. Verujem da dete, a naro\u010dito tinejd\u017eer,
  pla\u0107a najvi\u0161u cenu te\u0161kih vremena. Tinejd\u017eer je najranjivija
  osoba u na\u0161em dru\u0161tvu, a njegova najdublja potreba je ljubav.\\n\\nDebini
  roditelji su je odgajali dav\u0161i sve od sebe \u2013 ali ne\u0161to nije bilo
  kako treba. Kao \u0161to smo ve\u0107 rekli, Debi se nije ose\u0107ala iskreno voljenom.
  Je li to bila gre\u0161ka njenih roditelja? Treba li da krivimo njih? Mislim da
  ne treba. Gospodin i gospoda Baten oduvek su voleli Debi, ali nikad nisu znali kako
  da iska\u017eu svoju ljubav. Kao mnogi roditelji, i oni su imali maglovitu predstavu
  o potrebama svoje dece \u2013 za\u0161titi, uto\u010di\u0161tu, hrani, ode\u0107i,
  obrazovanju, vodstvu, ljubavi i tako dalje. Oni su u su\u0161tini zadovoljili sve
  ove potrebe, osim one za bezuslovnom ljubavlju.\\n\\n**TINEJD\u017dERI SU JO\u0160
  DECA**\\n\\nTinejd\u017eeri su deca u prelaznom periodu. Oni nisu odrasle mlade
  osobe. Njihove potrebe, uklju\u010duju\u0107i emocionalne, su de\u010dije. Jedna
  od naj\u010de\u0161\u0107ih gre\u0161aka koju prave roditelji, nastavnici i ostali,
  a odnosi se na nara\u0161tajce, je ta \u0161to ih smatraju odraslim mladim osobama.
  Mnoge osobe od autoriteta previdele su njihove de\u010dije potrebe za ose\u0107anjem
  ljubavi i prihva\u0107enosti, potrebu da se neko za njih brine, kao i potrebu da
  nekome treba zaista da je stalo do njih.\\n\\nVeliki broj tinejd\u017eera danas
  ose\u0107a da nikome nije zaista stalo do njih. Kao rezultat toga, mnogi od njih
  se ose\u0107aju beskorisnima, bespomo\u0107nima, imaju malo samopo\u0161tovanja
  i smatraju se bezvrednima.\\n\\nDana\u0161nje tinejd\u017eere \u010desto opisuju
  kao \u201eravnodu\u0161nu generaciju\u201c. Ta ravnodu\u0161nost je samo na povr\u0161ini.
  Ispod su skriveni gnev i zbunjenost.\\n\\nZa\u0161to? Zato \u0161to mnogi tinejd\u017eeri
  sami sebe vide u negativnom svetu, kao bezvredne i beskorisne. Ovakva slika o sebi
  je normalna za dete koje misli da se za njega niko ne brine i koje se ne ose\u0107a
  iskreno voljenim.\\n\\nDve najstra\u0161nije stvari koje proizilaze iz ove ravnodu\u0161nosti
  su depresija i revolt koji ose\u0107aju prema osobama od autoriteta. Ravnodu\u0161ni
  tinejd\u017eeri lako postaju \u017ertve beskrupuloznih osoba koje ih koriste za
  ispunjenje svojih ciljeva. Oni su osetljivi i lako ih mogu pridobiti osobe koje
  tra\u017ee poslu\u0161nost bez pogovora, a sami su protiv legitimnog autoriteta.
  Zbog toga je na\u0161e dru\u0161tvo sve vi\u0161e ogor\u010deno na autoritet i predstavnike
  autoriteta. Ovo je ozbiljna pretinja za demokratsko dru\u0161tvo u kome bezbednost
  po\u010diva na poverenju i li\u010dnoj odgovornosti. Postoje na\u010dini pomo\u0107u
  kojih mo\u017eemo da spre\u010dimo ovu ravnodu\u0161nost kod tinejd\u017eera, da
  im pomognemo da imaju zdrave, energi\u010dne, produktivne i kreativne stavove, ali
  o njima \u0107emo razgovarati kasnije.\\n\\n**UTICAJ DOMA**\\n\\nDanas je te\u0161ko
  biti roditelj tinejd\u017eera. Jedan od glavnih razloga za to je taj \u0161to oni
  ve\u0107inu svog vremena provode pod uticajem nekog drugog \u2013 profesora u \u0161koli,
  vr\u0161njaka, suseda i televizije. Ve\u0107ina ljudi ose\u0107a da, uprkos njihovom
  trudu, malo uti\u0107u na tinejd\u017eere. Istina je potpuno suprotna, o\u010digledno
  je da dom i dalje ima najve\u0107i uticaj. Dom vi\u0161e od svega odre\u0111uje
  koliko \u0107e tinejd\u017eer biti sre\u0107an, siguran i stabilan; kako \u0107e
  se odnositi prema odraslima, vr\u0161njacima i deci; kako \u0107e reagovati na nove
  ili nepoznate situacije. Bez obzira na mnoge pometnje u \u017eivotu tinejd\u017eera,
  dom ima najve\u0107i uticaj na njegov \u017eivot.\\n\\nTinejd\u017eer mo\u017ee
  da bude ve\u0107i, pametniji, ja\u010di ili na neki drugi na\u010din superiorniji
  od svojih roditelja, ali emocionalno je jo\u0161 dete. I dalje mu je potrebno da
  ose\u0107a da ga roditelji vole i da ga prihva\u0107aju. Ukoliko tinejd\u017eer
  to ne ose\u0107a, ne\u0107e mo\u0107i da se poka\u017ee u najboljem svetu, niti
  da ne\u0161to uradi na najbolji na\u010din. Ne mo\u017ee da dostigne svoj vrhunac.\\n\\nRelativno
  mali broj tinejd\u017eera ima sre\u0107e da ose\u0107a istinsku ljubav i prihva\u0107enost
  kakvu zaista zasluguje. Istina je da ve\u0107ina roditelja gaji najdublja ose\u0107anja
  prema svojim tinejd\u017eerima. Me\u0111utim, oni pretpostavljaju da do iskazivanja
  te ljubavi dolazi prirodno i spontano. Ovo je stvarno najve\u0107a gre\u0161ka koju
  roditelji danas prave, jer mnogi od njih se zbog toga jednostavno ne trude da iska\u017eu
  iskrenu ljubav svojim tinejd\u017eerima. To je zbog toga \u0161to ne znaju kako
  to da urade.\\n\\nDok sam radio s tinejd\u017eerima koji su dolazili k meni s raznim
  problemima, shvatio sam da je naj\u010de\u0161\u0107a nit koja je stalno prisutna
  u tim problemima, bilo kao uzrok, bilo kao ote\u017eavaju\u0107a okolnost, u stvari
  ose\u0107aj da nisu voljeni i da se roditelji za njih ne brinu.\\n\\nO tome govori
  ova knjiga. Ovo je vodi\u010d za pomo\u0107 roditeljima koji \u017eele da znaju
  kako da vole svoje tinejd\u017eere da bi oni postali najbolji, pona\u0161ali se
  i odrasli na najbolji na\u010din. Molim se da ovo ne bude samo knjiga s odgovorima
  za umorne, zburnjene roditelje, ve\u0107 i knjiga nade.\\n\\nJa veoma volim tinejd\u017eere.
  Oni su najdra\u017ei ljudi koje znam. Kada su im zadovoljene emocionalne potrebe,
  mogu da reaguju na tako zdrav i prijatan na\u010din da ponekad pomislim da \u0107e
  mi srce pu\u0107i od miline.\\n\\nIstina, oni definitivno mogu da nas dovedu do
  krajnijih granica tolerancije i strpljenja. Ponekad izgubimo smirenost i razljutimo
  se, pa jednostavno mislimo da mi nemamo ono \u0161to je potrebno za zadovoljenje
  njihovih potreba. Mo\u017eemo \u010dak i da po\u017eelimo da pobegnemo ili odustanemo.\\n\\nAli,
  dragi roditelji, izdr\u017eimo! Zaista je vredno istra\u017eati. Od neprocenjivog
  je zna\u010daja videti na\u0161e tinejd\u017eere kako se razvijaju u prijatne i
  vredne odrasle osobe. Ali, moramo biti realni \u2013 to se ne doga\u0111a tako jednostavno.
  Moramo da platimo cenu.\\n\\nStvarno \u017eelim da ova knjiga bude izvor nade za
  sve vas. Poslednje \u0161to \u017eelim je da kod vas izazovem ose\u0107aj krivice.
  Svi gre\u0161imo. Ba\u0161 kao \u0161to ne postoje savr\u0161ena deca, tako ne postoje
  ni savr\u0161eni roditelji. Ne dozvolite da krivica zbog nekih ranijih gre\u0161aka
  ugrozi va\u0161e napore da pravilno odgajite va\u0161eg tinejd\u017eera.\\n\\nVe\u0107inu
  mladala\u010dkih problema mo\u017eemo ubla\u017eiti ili ispraviti smanjivanjem napetosti
  u odnosima izme\u0111u roditelja i tinejd\u017eera. Me\u0111utim, postoje neki problemi
  tinejd\u017eera koje izazivaju ili ih ote\u017eavaju razne neurolo\u0161ke bolesti
  ili fiziolo\u0161ka depresija. Ove medicinske probleme treba ubla\u017eiti pre nego
  \u0161to pristupimo ispravljanju odnosa izme\u0111u roditelja i tinejd\u017eera.\\n\\nVe\u0107ina
  tinejd\u017eerskih problema ne zahteva profesionalnu pomo\u0107. Odnos se mo\u017ee
  pobolj\u0161ati kad roditelji nau\u010de kako da iskreno i na pravi na\u010din prenesu
  ljubav svojim tinejd\u017eerima. A o tome govori ova knjiga.\\n\\n2. DOM\\n\\nPrva
  odgovornost roditelja je da obezbede sre\u0107an dom pun ljubavi. A najva\u017eniji
  odnos u jednom domu je veza izme\u0111u supru\u017enika, va\u017enija i od odnosa
  izme\u0111u roditelja i dece. Koliko \u0107e tinejd\u017eer biti siguran i koliko
  \u0107e njegov odnos s roditeljem biti \u010dvrst, umnogome zavisi od kvaliteta
  veze me\u0111u supru\u017enicima. Vidite koliko je va\u017eno ostvariti najbolji
  mogu\u0107i odnos sa supru\u017enikom, jer on predstavlja osnovu za najpozitivniji
  odnos s tinejd\u017eerom.\\n\\n\u010cAK\\n\\nRoditelji su doveli \u010caka k meni
  jer je izostajao iz \u0161kole, krao i bio neposlu\u0161an. Gospodin i gospoda Hargrejv
  su puni gneva i razo\u010daranja pri\u010dali o svom sinu tinejd\u017eeru. Zabrinuo
  me intenzitet negativnih ose\u0107anja koja su oni ose\u0107ali prema de\u010daku.\\n\\n\u010cak
  nije rekao ni\u0161ta, nego je oborenih o\u010diju uko\u010deno sedeo i slu\u0161ao
  optu\u017ebe svojih roditelja. Kad je kona\u010dno progovorio, govorio je ne\u017enim,
  blagim glasom, \u010de\u0161\u0107e koriste\u0107i kratke fraze nego re\u010denice.\\n\\nNeko
  vreme sam bio sam sa \u010cakom u ordinaciji. Bio je ljut, ali nije mogao ta\u010dno
  da mi objasni zbog \u010dega. Uskoro sam shvatio da je \u010cak bio veoma zbunjen
  de\u010dak. Bio je zbunjen samim sobom kao i odnosom me\u0111u njegovim roditeljima.
  Bio je u nedoumici i zbog svog lo\u0161eg pona\u0161anja, jer je bio bistar de\u010dak
  koji nije imao problema sa \u0161kolom. Vr\u0161njaci su ga voleli, a nije imao
  ve\u0107ih problema ni s profesorima. Zbunjivala ga je i njegova krada, jer mu te
  stvari koje je krao, uop\u0161te nisu bile potrebne. Bilo je o\u010digledno da je
  htelo da ga uhvate.\\n\\n\u010cakov slu\u010daj nije neobi\u010dan. Iako su mu roditelji
  \u017eeleli dobro, napravili su nekoliko gre\u0161aka u odgoju. Brak im je bio u
  krizi, uglavnom jer nisu nau\u010dili da jedno s drugim dele ose\u0107anja i mi\u0161ljenja.
  Gospoda Hargrejv nikad nije mogla da izrazi svoj gnev prema mu\u017eu na otvoreni,
  zdrav i direktni na\u010din; zbog toga ga je ispoljavala na suptilan i indirektn
  na\u010din \u2013 prekomernim tro\u0161enjem novca. Gospodin Hargrejv, koji nije
  mogao da bude potpuno iskren sa svojom suprugom, ispoljavao je svoj gnev tako \u0161to
  je stalno bio \u010dutljiv, izbegavao da je gleda u o\u010di, kao i da ispunjava
  svoje ku\u0107ne obaveze.\\n\\n\u010cak je svoju lekciju dobro nau\u010dio. Po\u0161to
  otvoreni, iskreni razgovor i ispoljavanje ose\u0107anja nisu postojali u ku\u0107i
  Hargrejvovih, i \u010cak je svoj gnev izra\u017eavao rade\u0107i ono \u0161to je
  zbunjivalo i uznemiravalo njegove roditelje.\\n\\nZbog nedostatka normalne komunikacije,
  gospodin i gospoda Hargrejv nikad nisu razumeli \u0161ta drugi supru\u017enik ose\u0107a
  prema \u010caku i \u0161ta o\u010dekuje od njega. Zbog toga se nikad nisu slo\u017eili
  oko granica pona\u0161anja ili odgovaraju\u0107eg disciplinovanja svog deteta.\\n\\nOvo
  je zbunjivalo \u010caka, jer nikad nije znao \u0161ta roditelji o\u010dekuju od
  njega. Bio je de\u010dak koji je prirodno \u017eeleo da udovolji. Ali, kako je mogao?
  Odustao je od poku\u0161aja da \u017eivi po roditeljskim standardima, jer nikad
  nije ta\u010dno znao koji su to standardi.\\n\\nSvi ovi problemi su se pojavili
  jer roditelji nikad nisu mogli da razgovaraju otvoreno i da donesu zajedni\u010dke
  odluke.\\n\\nROD\u017dER\\n\\nEvo jo\u0161 jednog primera koji pokazuje koliki zna\u010daj
  ima odnos izme\u0111u mu\u017ea i \u017eene u odgajanju tinejd\u017eera. \u010cetrnaestogodi\u0161nji
  Rod\u017eer uhva\u0107en je kako krade stvari iz ne\u010dije ku\u0107e. Roditelji
  su ga doveli k meni jer je popustio u \u0161koli, inatio se i \u010desto bio mrzovoljan.
  Ispostavilo se da roditelji imaju\\n\\nproblema s njim ve\u0107 nekoliko godina.
  Uglavnom je bio neposlu\u0161an, izazivao njihov autoritet i manipulisanjem poku\u0161avao
  da istera svoje. Koristio se kriti\u010dkim komentarima koje su roditelji upu\u0107ivali
  na ra\u010dun jedan drugoga. Svojom taktikom izazivao je sukob me\u0111u roditeljima.
  Dok su se mama i tata svadali oko toga kako da izadu na kraj s Rod\u017eerom, on
  je radio \u0161to je htio.\\n\\nPsiholo\u0161ko testiranje pokazalo je da je Rod\u017eer
  imao perceptivnih problema, bio duboko depresivan i pokazivao pasivno-agresivne
  crte u pona\u0161anju (videti sedmo poglavlje). Kada sam posavetovao roditelje,
  oni su se, na njima svojstven na\u010din posvadali oko toga \u0161to treba da urade.
  \u010cak i uz profesionalne savete, ovi nesre\u010dni roditelji nisu mogli da donesu
  logi\u010dne i razumne odluke u vezi sa svojim detetom.\\n\\nNaravno, moj osnovni
  cilj bio je da pomognem roditeljima da pobolj\u0161aju me\u0111usobne odnose, da
  bi bili ujedinjeni u provo\u0111enju discipline. Tek tada bi ih de\u010dak po\u0161tovao,
  prestao da ih okre\u0107e jedno protiv drugog i nau\u010dio da kontroli\u0161e svoje
  pona\u0161anje.\\n\\n**POTREBA ZA KOMUNIKACIJOM**\\n\\nOvi primjeri su nam pokazali
  kako nezdrav bra\u010dni odnos mo\u017ee da prouzrokuje probleme kod na\u0161ih
  tinejd\u017eera. Svakom tinejd\u017eeru su potrebni roditelji koji imaju stabilan
  odnos, pun po\u0161tovanja, ljubavi i dobre komunikacije.\\n\\nSposobnost ispoljavanja
  ose\u0107anja, a naro\u010dito onih neprijatnih, ima presudnu va\u017enost za bra\u010dnu
  vezu. Ovaj iskreni, otvoreni razgovor je naro\u010dito bitan u kriznim trenucima
  i mo\u017ee da odredi da li \u0107e ta kriza osna\u017eiti ili slomiti brak.\\n\\nU
  svom braku sam, obi\u010dno na te\u017eak na\u010din, uvek iznova otkriva\u043e
  koliko je va\u017ena ova vrsta komunikacije. Najte\u017ei period u na\u0161em braku
  bio je neposredno po ro\u0111enju na\u0161e druge \u010derke Keti, koja je ro\u0111ena
  s nekoliko fizi\u010dkih nedostataka. Ve\u0107 smo zbog toga imali dovoljno pote\u0161ko\u0107a.
  Kad je imala oko godinu dana, polako je postalo o\u010digledno da je Keti potpuno
  mentalno retardirana i da ima cerebralnu paralizu, pra\u0107enu \u017eestokim napadima.
  Kao dvadeset\u010detverogodi\u0161nji mu\u017e i otac, iskusio sam ose\u0107anja
  za koja nisam znao da su mogu\u0107a. Ose\u0107ao sam gnev, bes, ogromnu bol, krivicu,
  i nisam ose\u0107ao da sam pravi mu\u0161karac, otac i mu\u017e. Jedva sam se nosio
  s tim. Uglavnom sam \u017eeleo da pobegnem, naro\u010dito kad smo videli da se Ketino
  stanje ne pobolj\u0161ava. Nije razvijala nikakve samostalne ve\u0161tine ili fizi\u010dke
  sposobnosti.\\n\\nBriga o Keti bila je kao no\u0107na mora. Kad je kona\u010dno
  nau\u010dila da hoda, odmah je upadala u nevolju; poku\u0161avala je da pojede dubre
  ili bilo \u0161to drugo \u0161to je mogla da strpa u usta. Jedva da je ose\u0107ala
  bol i \u010desto je poku\u0161avala da dodirne vru\u0107u ringlu. Morali smo da
  je pazimo svake sekunde, jer je stalno stremila da radi stvari koje su vrlo opasne
  po nju.\\n\\nSve ovo de\u0161avalo se dok sam ja bio na prvoj godini medicine. Uz
  Ketine tro\u0161kove i pritisak s fakulteta, na\u0161a finansijska situacija bila
  je prili\u010dno sumorna. Se\u0107am se da sam se mnogo puta pitao kako na\u0161
  brak uop\u0161te mo\u017ee da opstane.\\n\\nPet je oduvek bila emocionalno zrelija
  u na\u0161em braku. Bol zbog Keti i na\u0161a neodr\u017eiva situacija te\u0161ko
  su joj padali, kao i meni, ali je njena reakcija bila suprotna od moje. Iako je
  bila u konstantnoj tuzi, Pet je pa\u017eljivo brinula o Ketinoj svakoj potrebi s
  ogromnim strpljenjem, negom i posve\u0107eno\u0161\u0107u. Retko je zapadala u mu\u010dne
  situacije koje su mene \u010desto izludivale. Njena unutra\u0161nja lepota, ljubav,
  ne\u017enost i strpljenje bili su iznad mog razumevanja. \u0160to je najgore od
  svega, nisam cenio kvalitete koje je imala, a trebalo je da ih imam i ja, jer su
  se razlikovali od moje nesposobnosti da izadem na kraj sa situacijom. Ose\u0107ao
  sam da ta njena zrelost \u010dini da ja izgledam jo\u0161 lo\u0161ije kao mu\u017e
  i otac. Zbog toga sam je na razne na\u010dine vredao i kad god mi se pru\u017eila
  prilika, poku\u0161avao sam da se udaljim od nje i Keti.\\n\\nDa, iskreno sam voleo
  Pet, i shvatio da sam, umesto da joj poma\u017eem, jo\u0161 vi\u0161e pove\u0107avao
  njen te\u0161ko breme. Ose\u0107ao sam se krivim i potpuno bespomo\u0107nim. Od
  nekoliko ljudi tra\u017eio sam savete o tome kako da izadem na kraj s ovom agonijom,
  ali niko nije znao o \u010demu govorim.\\n\\nMislim da stvari postaju najgore kad
  postane moderno tretirati decu kao \u0161to je Keti po nekakvom \u0161ablonu. Petoro
  ljudi pokretalo je njene ruke, noge i glavu, simuliraju\u0107i puzanje. To je zahtevalo
  ogroman napor cele porodice i vi\u0161e\u010dasovno svakodnevno posve\u0107ivanje.
  Ogromno vreme i trud koje smo ulagali, doveli su nas do toga da je jo\u0161 samo
  kap bila dovoljna da se \u010da\u0161a prelije.\\n\\nKona\u010dno smo shvatili,
  kao i mnogi drugi, da je slaba vajda od postupanja po \u0161ablonu. Ispostavilo
  se da je to bilo potpuno gubljenje vremena. Ali, pre nego \u0161to smo do\u0161li
  do ovog zaklju\u010dka, na\u0161a porodica je bila pred raspadom.\\n\\n\u010cak
  i u ovom trenutku totalnog mraka, Pet se o Keti i dalje brinula ne\u017eno, s ljubavlju
  i neverovatnim strpljenjem. Nije izgubila svoj unutra\u0161nji mir i neverovatnu
  unutra\u0161nju lepotu.\\n\\nA ja? Ja sam se jedva snalazio. Od jutra do mraka izgarao
  sam iznutra zbog Keti. Bilo mi je te\u0161ko da se skoncentri\u0161em na u\u010denje
  i stalno sam razmi\u0161ljao o tome kako \u0107emo finansijski iza\u0107i na kraj
  sa svim. Jednom re\u010du, ose\u0107ao sam se bedno i pla\u0161io se da ne\u0107e\u0107emo
  izdr\u017eati jo\u0161 dugo. Pitao sam se: \u201eKoliko stresa mo\u017ee da podnese
  jedan brak? Da li \u0107e pu\u0107i ili jednostavno umruti?\u201c\\n\\nDo tada je
  Keti ve\u0107 imala pet godina. Stanje je bilo skoro isto, ali njeni napadi su se
  pogor\u0161ali i sve slabije je reagovala na lekove. Na kraju je i najmanja promena
  sredine dovodila do novog napada. Posle napada ne bi jela tri dana. Kada nije jela
  i po nekoliko dana, morali smo prisilno da je hranimo. Postalo je o\u010digledno
  da Keti ne mo\u017ee da \u017eivi van bolnice. Tada smo morali da donesemo najte\u017eu
  i najmu\u010dniju odluku u na\u0161em \u017eivotu \u2013 morali smo za stalno da
  je smestimo u bolnicu za mentalno retardirane. Zamislite \u2013 trebalo je da na\u0161u
  dragu petogodi\u0161nju \u010derku predamo u ruke nekim nepoznatim ljudima. Uop\u0161te
  nisam bio siguran da s tim mogu da izadem na kraj. Ali, opet, video sam moju dragu
  \u017eenu Pet. Bore\u0107i se s isto onoliko bola i agonije kao i ja, ona je znala
  \u0161ta treba da uradimo, donela odluku, smogla hrabrosti da to prihvati, i nikad
  nije izgubila unutra\u0161nji mir i lepotu.\\n\\nNa\u017ealost, ja sam u\u010dio
  mnogo sporije. Ali, ovog puta, umesto da se do zadnjeg daha borim protiv nepromenljive
  situacije (i zameram mojoj \u017eeni \u0161to tako predivno podnosi najnepodno\u0161ljivije
  \u017eivotne tegobe), odlu\u010dio sam da od nje ne\u0161to nau\u010dim. Ona me
  u\u010dila, onako kako to samo \u017eena mo\u017ee, kako da pre\u017eivim nepodno\u0161ljive
  \u017eivotne situacije.\\n\\nSvaki tip li\u010dnosti ima svoje prednosti i nedostatke.
  U ovoj situaciji s Keti, ona je bila ja\u010da i ja sam u\u010dio od nje, a ponekad
  se i oslanjao na nju. U nekim drugim situacijama, ja sam se bolje snalazio i mogao
  sam da joj pomognem.\\n\\nGlavno u svemu ovome je da shvatite da \u0107e svaki brak
  da do\u017eivi neki stres. Da li \u0107e stres da oslabi ili uni\u0161ti brak, ili
  da ga oja\u010da, zavisi od toga kako mu\u017e i \u017eena individualno reaguju
  na stres. Moja prva reakcija na okrutnu porodi\u010dnu tragediju bila je destruktivna.
  Poku\u0161avao sam da ih izbegavam, ostavljaju\u0107i Pet celo breme da sama izlazi
  na kraj s njim. Svojim primerom mi je pokazala, kako da ispunim svoje obaveze mu\u017ea
  i oca i kako da preuzmem odgovornost. Kad sam to uradio, ubrzao sam po\u010deo da
  je volim i cenim. Kad sam nau\u010dio da je bolje da savladam unutra\u0161nji bol,
  nego da be\u017eim od njega, Pet i ja smo se godinama uspe\u0161no nosili s ovim
  problemima koji izazivaju emocionalni bol.\\n\\nDragi roditelji, ako istrajemo u
  problemima koji su stresni za na\u0161 brak, posta\u0107emo bolji supru\u017enici.
  Ako svoje bra\u010dne obaveze shvatimo kao do\u017eivotno predanje, zajedno \u0107emo
  biti ja\u010di, u ljubavi, zahvalnosti i po\u0161tovanju. Moramo da \u017eivimo
  i da mislimo kao da ne postoje druge mogu\u0107nosti osim da uradimo da ovaj brak
  funkcioni\u0161e. Da, to jeste posao. Te\u017eak posao. I zahteva\\n\\ndo\u017eivotnu
  predanost oba supru\u017enika. Mnogi dana\u0161nji brakovi su zasnovani na stavu
  \u201e\u0161ta bude bi\u0107e\u201c \u2013 \u201ePoku\u0161a\u0107emo, ali ako ne
  uspe, razi\u0107i \u0107emo se.\u201c Nijedan brak zasnovan na ovome ne mo\u017ee
  stvarno da uspe. Postoji li danas i\u0161ta re\u0111e od potpune, do\u017eivotne
  predanosti braku? Na\u0161i \u017eivoti su bazirani na integritetu porodice. Ako
  se ne obnovi i o\u017eivi, institucija braka mo\u017ee biti uni\u0161tena.\\n\\n**OSVRT
  NA PORODICE SAMOHRANIH RODITELJA**\\n\\nU istra\u017eivanju sprovedenom u Sjedinjenim
  Ameri\u010dkim Dr\u017eavama 1989. godine, dvadeset \u0161est odsto dece mlade od
  osamnaest godina \u017eivelo je s jednim roditeljem, a ta brojka se stalno uve\u0107avala.
  Preko pedeset odsto danas ro\u0111ene dece prove\u0161e bar neki deo svoje mladosti
  u domu s jednim roditeljem.\\n\\nMnogi ljudi danas misle da samohrani roditelj ne
  mo\u017ee da bude tako dobar u odgajanju kao \u0161to mogu dva roditelja koji zajedno
  odgajaju decu. Dejvid Klevind\u017eer (David Clevenger) u \u010dlanku \u201eRoditeljstvo
  u devedesetim\u201c, objavljenom u \u010dasopisu Aspekti Favets Ameri\u010dke lekarske
  asocijacije (septembar 1992.), isti\u010de da ljudi koji tako misle gre\u0161e.
  Decenije istra\u017eivanja pokazuju, kao \u0161to tvrdi Klevind\u017eer, da \u201eto
  \u0161to je neko samohrani roditelj, nikog ne spre\u010dava da bude dobar roditelj.
  Li\u010dni i dru\u0161tveni pritisci donekle umanjuju sposobnost mnogih ljudi da
  budu dobri roditelji. Ti pritisci smanjuju mogu\u0107nosti samohranog roditelja,
  koji poku\u0161ava sam da odgoji svoju decu.\u201c\\n\\nU Klevind\u017eerovom \u010dlanku
  navode se re\u010di T. Beri Brazeltona (Berry Brazelton), jednog od najpoznatijih
  i najpo\u0161tovanih pedijatara u Sjedinjenim Ameri\u010dkim Dr\u017eavama: \u201eVeoma
  je va\u017eno da li ste samohrani roditelj ili ne, ali i dalje mislim da mo\u017eete
  uspeti. Te\u017ee je, jer ste verovatno siroma\u0161ni. Vrlo te\u0161ko je biti
  samohrani roditelj, jer morate dete da disciplinujete, ali i da budete neko ko se
  o njemu brine.\u201c\\n\\nTako\u0111e, samohrani roditelj obi\u010dno mora da zaraduje
  za \u017eivot i da vodi doma\u0107instvo. Alvin Pusen (Alvin Poussaint), psihijatar
  sa Harvarda ka\u017ee: \u201eMajka doma\u0107ica brine o mnogim stvarima koje su
  va\u017ene za porodicu. Ona je tu kad deca dodu ku\u0107i. Ona sprema decu za \u0161kolu.
  Ona ide na roditeljske sastanke. Ona vodi decu k lekaru ili zubaru. Ako ste samohrani
  roditelj i radite, ko onda radi sve ove stvari? Jednostavno ste pod stalnim pritiskom.\u201c\\n\\nDejvid
  Klevind\u017eer u svom \u010dlanku tako\u0111e isti\u010de:\\n\\nU stvari, najve\u0107i
  razlog zbog kog se umanjuje roditeljska energija i sposobnost je siroma\u0161tvo,
  faktor koji najvi\u0161e pogada samohrane majke. Oko osamdeset posto ameri\u010dkih
  porodica s oba roditelja danas \u017eivi siroma\u0161no. Kakva je tek situacija
  u porodicama s jednim roditeljem, u porodicama o kojima brigu vode uglavnom samohrane
  majke; oko \u010detrdeset pet posto takvih porodica \u017eivi ispod granice siroma\u0161tva.\\n\\nZa\u0161to
  siroma\u0161tvo i drugi pritisci umanjuju efektnost samohranog roditelja vi\u0161e
  nego tradicionalnog roditelja? Majke i o\u010devi u tradicionalnim porodicama imaju
  jedno drugo. Obi\u010dno jedno drugom pru\u017eaju va\u017enu emocionalnu, psiholo\u0161ku,
  fizi\u010dku i finansijsku podr\u0161ku, koju samohrani roditelj nema, ve\u0107
  mora potpuno sam da odgaja svoje dete.\\n\\nOdsustvo ove podr\u0161ke mo\u017ee
  biti dobar razlog za raspravu o tome koliko porodice sa samohranim roditeljem nisu
  prikladne porodi\u010dne strukture za podizanje dece. Ali, oni koji ovo tvrde zaboravili
  su veoma va\u017enu stvar \u2013 i samohrani roditelj mo\u017ee da dobije podr\u0161ku.
  Po\u0161to ne mo\u017ee da se osloni na supru\u017enika, oslanja se na druge osobe
  s kojima je u nekoj vezi \u2013 na \u010dlanove \u0161ire porodice, na prijatelje,
  profesionalne organizacije i neke dru\u0161tvene grupe.\\n\\nOva podr\u0161ka, kad
  god da je dobiju, jako je bitna za prevazila\u017eenje pritisaka koji umanjuju efikasno
  roditeljstvo. U stvari, najuspe\u0161niji samohrani roditelji su oni koji su nau\u010dili
  kako da dobiju odgovaraju\u0107u podr\u0161ku, i kako da je iskoriste da bi prevazi\u0161li
  pritiske koji ih spre\u010davaju da pozitivno odgajaju dete. Prevazilaze\u0107i
  ih, postaju dobri roditelji.\\n\\n**ZAMENA ULOGA**\\n\\nSituacija koja je danas
  vrlo \u010desta je zamena uloga, u kojoj roditelj od deteta zahteva da u potpunosti
  zadovoljava roditeljeve emocionalne potrebe. Iako se ovo mo\u017ee desiti u bilo
  kojoj porodici, obi\u010dno se de\u0161ava u porodici sa samohranim roditeljem.\\n\\nNeki
  samohrani roditelji su u isku\u0161enju da svoje tinejd\u017eere koriste kao kolege
  ili prisne prijatelje. Ovo je vrlo te\u0161ko za njih jer nemaju supru\u017enike
  s kojima bi delili stvari koje se ti\u010du odraslih u ku\u0107i.\\n\\nZbog usamljenosti,
  ose\u0107anja nesposobnosti, depresije ili zbog ne\u010deg drugog, samohranim roditeljima
  je te\u0161ko da izbegnu taj odnos s tinejd\u017eerima kao s vr\u0161njacima. Ovi
  roditelji mogu da im ispri\u010daju intimne li\u010dne pojedinosti, s kojima tinejd\u017eeri
  jednostavno nisu spremni da se nose. Takvi roditelji poku\u0161avaju sa svojom decom
  da budu \u201enajbolji prijatelji\u201c, umesto da odr\u017eavaju zdrav odnos.\\n\\nVidao
  sam ekstremne primere. D\u017eim je bio \u0161esnaestogodi\u0161njak koji je \u010desto
  pio s ocem u baru. Iako se ovo de\u0161avalo jer se otac ose\u0107ao usamljenim
  i nije imao prijatelje, otac to nije shvatao, ve\u0107 je mislio da tako \u201epravi
  \u010doveka\u201c od sina.\\n\\nSe\u0107am se i D\u017euli \u010dija majka je od
  \u010doveka s kojim je izlazila tra\u017eila da dovede prijatelja za D\u017euli,
  da bi mogli da izadu svi zajedno. Iako su ovo o\u010digledno ekstremni primeri,
  zamena uloga nije retka. Manje ekstremni oblici zloupotrebe tinejd\u017eera tako\u0111e
  su \u010desti. Na primer, roditelj koji se \u017eali tinejd\u017eeru kako je usamljen,
  depresivan, nesre\u0107an ili iskori\u0161\u0107en. Ovo nije roditeljstvo. Roditelj
  mora da zadovoljava emocionalne potrebe deteta ili tinejd\u017eera. Ako tinejd\u017eer
  ispunjava emocionalne potrebe roditelja, to je \u201ezamena uloga\u201c i nije uop\u0161te
  zdravo. Tinejd\u017eer prema kome se pona\u0161aju na ovakav na\u010din, ne mo\u017ee
  normalno da se razvije.\\n\\nBez obzira da li smo samohrani roditelj ili ne, moramo
  uvek da odr\u017eimo na\u0161u poziciju majke ili oca u ku\u0107i. Moramo da zadovoljimo
  emocionalne potrebe na\u0161ih tinejd\u017eera. Ako zamenimo uloge ili o\u010dekujemo
  od njih da emocionalno brinu o nama, povredi\u0107emo ih \u2013 i uni\u0161titi
  na\u0161 odnos s njima. Emocionalno zadovoljenje moramo da dobijemo negde drugde
  \u2013 a ne od na\u0161ih tinejd\u017eera.\\n\\nNikad nisam posebno u\u017eivao
  da budem autoritet bilo kome, naro\u010dito mojoj deci. Kad su moja deca prolazila
  kroz tinejd\u017eerski period, bio sam u isku\u0161enju da ih tretiram kao prisne
  prijatelje, ali se nisam usudio. Da, bio sam prijatelj s njima i u\u017eivao sam
  smeju\u0107i se i zabavljaju\u0107i se. Povremeno bih s njima podelio primerene
  intimne informacije, ali samo da bi ih ne\u010demu nau\u010dio \u2013 ne zbog moje
  emocionalne koristi. Nisam zaboravio da sam ja njihov otac i da im je potreban moj
  autoritet i usmeravanje. Da sam se ja odrekao ili zanemario svoju odgovornost da
  budem autoritet u ku\u0107i \u2013 zajedno s Pet, jer je i ona morala da uspostavi
  svoj autoritet \u2013 moja deca ne bi bila sre\u0107na. Ose\u0107ala bi se nesigurno,
  i verovatno bi razvila lo\u0161e obrasce pona\u0161anja.\\n\\nKao roditelji, prema
  tinejd\u017eerima ne smemo da se pona\u0161amo kao prema savetodavcima, ramenima
  za plakanje, prema nekomo ko nam daje emocionalnu podr\u0161ku ili kao prema kolegama.
  Naravno, mo\u017eemo ponekad da tra\u017eimo njihovo mi\u0161ljenje ili savet, ako
  to ne radimo na na\u010din na koji mo\u017eemo da ih podstaknemo da zadovolje na\u0161e
  emocionalne potrebe. Ne mo\u017eemo od njih da tra\u017eimo da u\u010dine da se
  ose\u0107amo bolje. Ne mo\u017eemo da budemo \u010dvrsti i dosledni prema na\u0161im
  tinejd\u017eerima ako na\u0161a emocionalna podr\u0161ka zavisi od njih.\\n\\nNa\u0161a
  prva du\u017enost kao roditelja je da u\u010dinimo da se na\u0161a deca ose\u0107aju
  iskreno voljenim. Druga obaveza je da budemo osobe od autoriteta i da ih disciplinujemo
  s ljubavlju.\\n\\n3. BEZUSLOVNA LJUBAV\\n\\nOsnovni temelj za zdrav odnos s tinejd\u017eerom
  je bezuslovna ljubav. Samo ona mo\u017ee da spre\u010di probleme kao \u0161to su
  ozlojenost, ose\u0107aj krivice, strah ili nesigurnost zbog ose\u0107aja ne\u017eeljenosti.\\n\\nSamo
  kad je va\u0161 odnos s tinejd\u017eerom zasnovan na bezuslovnoj ljubavi, mo\u017eete
  biti sigurni u svoje roditeljstvo. Bez tog temelja nemogu\u0107e je stvarno shvatiti
  ili voditi tinejd\u017eera, kao i znati \u0161ta preduzeti u vezi s njegovim pona\u0161anjem.\\n\\nBez
  bezuslove ljubavi roditeljstvo je teret koji dovodi do zburnenosti i uznemirenja.
  Ova ljubav je zvezda vodilja, koja vam pokazuje dokle ste do\u0161li s va\u0161im
  tinejd\u017eerom i \u0161ta slede\u0107e da uradite. Kad po\u010dnete s bezuslovnom
  ljubavlju, mo\u017eete da nadogradite znanje, izvesnite se u vodenju tinejd\u017eera,
  i svakodnevno ispunjavate njegove potrebe. Tako\u0111e \u0107ete znati gde ste uspe\u0161no
  postupili kao roditelj, a gde niste.\\n\\n\u017delite da se ose\u0107ate dobro kao
  roditelj. Mnogi ljudi se pitaju da li je to mogu\u0107e. Dozvolite mi da vas uverim
  da je definitivno mogu\u0107e biti dobar roditelj i istovremeno ose\u0107ati da
  to stvarno jeste.\\n\\n\u0160TA JE TO BEZUSLOVNA LJUBAV?\\n\\nBezuslovna ljubav
  je kad volite svog tinejd\u017eera, bez obzira na sve.\\n\\n- Bez obzira na njegov
  fizi\u010dki izgled.\\n- Bez obzira na njegov talenat, mogu\u0107nosti ili nedostatke.\\n-
  Bez obzira na to kako se pona\u0161a.\\n\\nTo ne zna\u010di da \u0107e vam se uvek
  svidati njegovo pona\u0161anje. Bezuslovna ljubav je kad volite tinejd\u017eera,
  \u010dak i kad vam se ne svida njegovo ili njeno pona\u0161anje.\\n\\nBezuslovna
  ljubav je idealna. Ne mo\u017eete ose\u0107ati ljubav prema tinejd\u017eeru \u2013
  ili prema bilo kome drugom \u2013 ba\u0161 u svakom trenutku. Ali, \u0161to ste
  bli\u017ei tom standardu, bi\u0107ete zadovoljniji i sigurniji i va\u0161 tinejd\u017eer
  \u0107e se ose\u0107ati prijatnije i zadovoljnije.\\n\\nKad se prisetim vremena
  u kom su moja deca bila tinejd\u017eeri, setim se da se de\u0161avalo da se nisam
  ose\u0107ao kao otac pun ljubavi. Ali, trudio sam se da to postignem i da ih bezuslovno
  volim. Sebi sam pomagao tako \u0161to sam stalno imao na umu slede\u0107e \u010dinjenice,
  koje \u0107ete i vi uzeti u obzir grade\u0107i va\u0161 odnos s tinejd\u017eerom:\\n\\n-
  Tinejd\u017eeri su deca.\\n- Tinejd\u017eeri se obi\u010dno pona\u0161aju kao tinejd\u017eeri.\\n-
  Pona\u0161anje tinejd\u017eera je uglavnom neprijatno.\\n- Ako volite tinejd\u017eera
  samo kad vam udovoljava (uslovna ljubav) i samo tada mu pokazujete svoju ljubav,
  on se ne\u0107e ose\u0107ati iskrenoj voljenim. Ose\u0107a\u0107e se nesigurnim,
  ima\u0107e lo\u0161u sliku o sebi, a mo\u017eda \u0107ete ga spre\u010diti da razvije
  zrelo pona\u0161anje. Zbog toga su roditelji, bez sumnje delimi\u010dno odgovorni
  za razvoj tinejd\u017eerovog pona\u0161anja.\\n- Ako bezuslovno volite tinejd\u017eera,
  ima\u0107e dobru sliku o sebi i bi\u0107e zadovoljan sobom. Mo\u0107i \u0107e da
  kontroli\u0161e svoju teskobu, i svoje pona\u0161anje, dok bude sazrevao.\\n- Ako
  volite tinejd\u017eera samo kad ispunjava va\u0161e zahteve ili o\u010dekivanja,
  ose\u0107a\u0107e se nesposobnim. Misli\u0107e da nema svrhe da daje sve od sebe,
  jer nikad nije dovoljno. Mu\u010di\u0107e ga nesigurnost, teskoba i nedostatak samopouzdanja.
  U emocionalnom razvoju, kao i u razvoju njegovog pona\u0161anja stalno \u0107e biti
  nekih smetnji. Opet, potpuni razvoj tinejd\u017eera umnogome zavisi od roditelja.\\n\\nPet
  i ja smo se trudili da sagledamo ove \u010dinjenice i molili se da na\u0161a ljubav
  prema tinejd\u017eerima bude \u0161to je mogu\u0107e vi\u0161e bezuslovna. Shvatili
  smo da budu\u0107nost na\u0161e dece zavisi od ovog biblijskog temelja.\\n\\n\u201eVOLI\u0160
  LI ME?\u201c\\n\\nZnate li o kom pitanju naj\u010de\u0161\u0107e razmi\u0161ljaju
  va\u0161i tinejd\u017eeri? Iako to ne shvataju, oni vas stalno pitaju: \u201eVoli\u0161
  li me?\u201c To je najva\u017enije pitanje u \u017eivotu jednog tinejd\u017eera.
  To pitanje on postavlja pona\u0161anjem, radije nego re\u010dima.\\n\\n\u201eVoli\u0161
  li me?\u201c Odgovor koji vi dajete svojim pona\u0161anjem je apsolutno presudan.
  Ako odgovorite negativno, va\u0161 tinejd\u017eer ne\u0107e dati sve od sebe. Morate
  da odgovorite potvr\u0111no, ali to radi malo roditelja. To ne zna\u010di da roditelji
  ne vole svoje tinejd\u017eere. Problem je u tome \u0161to mnogi roditelji ne znaju
  kako da odgovore potvr\u0111no; ne znaju kako da iska\u017eu ljubav svojim tinejd\u017eerima.\\n\\nAko
  svog tinejd\u017eera volite bezuslovno, on \u0107e ose\u0107ati da ste odgovorili
  potvr\u0111no. Ako ga volite uslovno, bi\u0107e nesiguran i sklon teskobi. Va\u0161
  odgovor na to klju\u010dno pitanje vrlo dobro odre\u0111uje kakav \u0107e biti stav
  va\u0161eg tinejd\u017eera u \u017eivotu. Zamislite kako je to bitno!\\n\\nJedan
  od glavnih razloga zbog kojih mnogi roditelji ne znaju da iska\u017eu ljubav svojim
  tinejd\u017eerima je taj \u0161to su tinejd\u017eeri, kao i mala deca, usmereni
  na pona\u0161anje. Odrasli su vi\u0161e verbalno usmereni.\\n\\nNa primer, \u010dovek
  koji je negde otputovao, mo\u017ee da usre\u0107i svoju \u017eenu tako \u0161to
  \u0107e je pozvati i re\u0107i: \u201eDraga, volim te.\u201c Ona \u0107e biti na
  sedmom nebu. Me\u0111utim ako mu se javi njegov \u010detraestogodi\u0161nji sin,
  a on mu ka\u017ee: \u201eNazvao sam samo da ti ka\u017eem da te volim\u201c, tinejd\u017eer
  \u0107e verovatno samo sle\u0107i ramenima i pitati: \u201eDobro, tata, ali za\u0161to
  si stvarno zvao?\u201c\\n\\nVidite li razliku? Tinejd\u017eer je vi\u0161e usmeren
  na pona\u0161anje, dok su odrasli uglavnom verbalno usmereni.\\n\\nDivno je u srcu
  ose\u0107ati ljubav prema svom tinejd\u017eeru \u2013 ali ne i dovoljno! Divno je
  kad tinejd\u017eeru ka\u017eete: \u201eVolim te\u201c, i treba to da radite, ali
  to nije dovoljno. Da bi va\u0161 tinejd\u017eer znao i ose\u0107ao da ga volite,
  morate to da mu pokazivate svojim pona\u0161anjem, jer je on, jo\u0161 uvek uglavnom
  usmeren na pona\u0161anje. Samo tada mo\u017ee da oseti da ste potvr\u0111no odgovorili
  na klju\u010dno pitanje koje postavlja njegovo srce: \u201eVoli\u0161 li me?\u201c
  Tinejd\u017eer vidi va\u0161u ljubav putem onoga \u0161to ka\u017eete ili uradite.
  Mnogo je va\u017enije ono \u0161to uradite. Na njega mnogo vi\u0161e uti\u010du
  va\u0161a dela nego re\u010di.\\n\\nVa\u017eno je tako\u0111e znati da va\u0161
  tinejd\u017eer ima emocionalno spremi\u0161te. Ono je, naravno, figurativno, ali
  je koncept vrlo stvaran. Tinejd\u017eer ima odre\u0111ene emocionalne potrebe, a
  njihovo zadovoljenje (putem ljubavi, razumevanja, discipline i tako dalje) odre\u0111uje
  kako \u0107e se ose\u0107ati \u2013 da li \u0107e biti zadovoljan, ljut, depresivan
  ili radostan. Takode, to sna\u017eno uti\u010de i na njegovo pona\u0161anje \u2013
  da li \u0107e biti poslu\u0161an ili ne, da li \u0107e biti gundalo, \u017eivahan,
  nesta\u0161an ili povu\u010den. Naravno, \u0161to je spremi\u0161te punije, i ose\u0107anja
  \u0107e biti pozitivnija i pona\u0161anje \u0107e biti bolje.\\n\\nSad malo zastanite
  i razmislite o jednoj od najva\u017enijih stavki iz ove knjige: OD TINEJD\u017dERA
  MO\u017dEMO DA O\u010cEKUJEMO DA BUDE NAJBOLJI I DA DAJE SVE OD SEBE SAMO KAD JE
  NJEGOVO EMOCIONALNO SPREMI\u0160TE PUNO. Vi kao roditelj imate tu obavezu da date
  sve od sebe i to spremi\u0161te odr\u017eavate punim.\\n\\nODRAZI LJUBAVI\\n\\nTinejd\u017eere
  mo\u017eemo da zamislimo kao ogledala. Oni uglavnom odra\u017eavaju ljubav, ne pru\u017eaju
  je prvii. Ako im pru\u017eite ljubav, oni vam je uzvra\u0107aju. Ako im ne pru\u017eite
  ni\u0161ta, oni nemaju \u0161ta da vam uzvrate. Bezuslovnu ljubav uzvra\u0107aju
  bezuslovno, a uslovnu uslovno.\\n\\nKako stvarno voleti svog tinejd\u017eera \u2013
  Ros Kembel \u2013 3. Bezuslovna ljubav\\n\\nKao primer za ovo, prisetimo se Debi,
  koju smo spominjali u prvom poglavlju. Ljubav izme\u0111u nje i njenih roditelja
  bila je primer uslovnih veza. Najbolje, njeni roditelji su mislili da treba stalno
  da je podsti\u010du da bude najbolja, suzdr\u017eavanjem od pohvale, ne\u017enosti
  i ose\u0107anja, osim za izvanredno pona\u0161anje (na koje su oni bili ponosni).
  U suprotnom su se suzdr\u017eavali od pokazivanja ljubavi, misle\u0107i da \u0107e
  je previ\u0161e odobravanja ili ose\u0107anja razmaziti i umanjiti njenu te\u017enju
  da bude bolja. Kako je Debi odrastala, sve vi\u0161e je ose\u0107ala da je roditelji
  stvarno ne vole i ne cene njena prava, ve\u0107 da samo brinu o svom roditeljskom
  ugledu.\\n\\nKad je Debi bila tinejd\u017eer, dobro je nau\u010dila od svojih roditelja
  kako da voli uslovno. Pona\u0161ala se onako kako su roditelji hteli, samo kad bi
  oni uradili ne\u0161to posebno za nju. Naravno, dok su se i Debi i roditelji pona\u0161ali
  ovako, nisu mogli da iska\u017eu ljubav onom drugom, jer su uvek \u010dekali da
  druga strana preduzme prvi korak.\\n\\nOvo je tipi\u010dna posledica uslovnog ljubavi.
  Pru\u017eanje ljubavi se prekida sve dok druga osoba ne uradi ne\u0161to zaista
  prijatno. Svi postaju sve vi\u0161e razo\u010darani, zbujeni i izgubljeni. Na kraju
  dolazi do depresije, gneva i ozlojedenosti. To je Batenove nateralo da potra\u017ee
  pomo\u0107.\\n\\nEmocionalna spremi\u0161ta\\n\\nKao \u0161to sam pomenuo ranije,
  tinejd\u017eeri su emocionalno deca. Razmotrite samo koliko je tinejd\u017eer sli\u010dan
  dvogodi\u0161njaku. I tinejd\u017eer i dvogodi\u0161njak tra\u017ee nezavisnost
  i imaju emocionalno spremi\u0161te. Obojica \u0107e da te\u017ee nezavisnosti, koriste\u0107i
  energiju iz emocionalnog spremi\u0161ta. Kad emocionalno spremi\u0161te presu\u0161i,
  i tinejd\u017eer i dvogodi\u0161njak \u0107e da reaguju na isti na\u010din \u2013
  obrati\u0107e se roditeljima da im ga napune da bi opet mogli da te\u017ee nezavisnosti.\\n\\nNa
  primer, razmotrimo podr\u0161ku majke koja je dovela dvogodi\u0161njaka na neko
  novo mesto, recimo na roditeljski sastanak. U po\u010detku, dete \u0107e se dr\u017eati
  majke da bi dobilo emocionalnu podr\u0161ku. S punim emocionalnim spremi\u0161tem,
  po\u010de\u0107e da se pona\u0161a nezavisno i da istra\u017euje. U po\u010detku
  mo\u017ee jednostavno samo da stoji pored majke i razgleda. Kad mu se isprazni emocionalno
  spremi\u0161te, opet \u0107e da potra\u017ei majku da bi ga napunilo, gledanjem
  u o\u010di, fizi\u010dkim dodirom ili usredsrednom pa\u017enjom. Sad je dete opet
  spremno da ispitava svoju nezavisnost. Ovog puta mo\u017ee da dode i do kraja reda
  stolova pre nego \u0161to mu se isprazni emocionalno spremi\u0161te. Ili mo\u017ee
  da stupi u kontakt s drugom osobom koja sedi pored njih, pre nego \u0161to spremi\u0161te
  presu\u0161i.\\n\\nVidite li obrazac? Dete mora iznova da se vra\u0107a roditelju
  da bi dopunilo svoje emocionalno spremi\u0161te i tako nastavilo da ispituje svoju
  nezavisnost. Ovo isto se de\u0161ava i s tinejd\u017eerom, naro\u010dito u ranoj
  adolescenciji. On mo\u017ee na razli\u010dite na\u010dine ispitivati svoju nezavisnost
  (a ti na\u010dini nas ponekad mogu uznemiriti i iznervirati). Da bi to uradio potrebna
  mu je energija iz emocionalnog spremi\u0161ta. A gde da napuni svoje emocionalno
  spremi\u0161te? Tako je! Kod roditelja. Tinejd\u017eer te\u017ee nezavisnosti na
  tipi\u010dne mladala\u010dke na\u010dine \u2013 rade\u0107i sam neke stvari, izlaze\u0107i
  negde bez porodice, isku\u0161avaju\u0107i roditeljska pravila. Ali, na kraju, njegovo
  emocionalno spremi\u0161te \u0107e da presu\u0161i i mora\u0107e da se vrati roditeljima
  da bi ga oni napunili. To je ono \u0161to \u017eelimo kao roditelji tinejd\u017eera.
  \u017delimo da na\u0161i deca budu sposobna da do\u0111u k nama kad im je potrebno
  punjenje emocionalnog spremi\u0161ta.\\n\\nPostoji nekoliko razloga zbog kojih je
  ovo punjenje jako va\u017eno.\\n\\nTinejd\u017eerima je potrebno obilje emocionalne
  hrane da bi postali najbolji i da bi funkcionisali najbolje \u0161to mogu.\\n\\nO\u010dajni\u010dki
  im je potrebno puno emocionalno spremi\u0161te da bi se ose\u0107ali sigurnim i
  imali dovoljno samopouzdanja da se nose s pritiskom vr\u0161njaka i drugim zahtevima
  dru\u0161tva. Bez tog pouzdanja tinejd\u017eeri mogu da podlegnu pritisku vr\u0161njaka
  i da imaju pote\u0161ko\u0107e u potvr\u0111ivanju zdravih, eti\u010dkih vrednosti.\\n\\nEmocionalno
  punjenje je bitno, jer dok ono traje mogu\u0107e je otvoreno komunicirati s tinejd\u017eerom.
  Kad je tinejd\u017eerovo emocionalno spremi\u0161te prazno i on/ona tra\u017ee roditeljsku
  ljubav, komunikacija je mnogo lak\u0161a.\\n\\nVe\u0107ina roditelja ne shvata koliko
  je za njihove tinejd\u017eere va\u017eno da mogu slobodno da dodu k njima da bi
  napunili to spremi\u0161te. Period kada tinejd\u017eer te\u017ei nezavisnosti mo\u017ee
  do te mere da uznemiri roditelje, da oni reaguju preterano emocionalno, i obi\u010dno
  uz dosta gneva. Ovo emocionalno preterivanje, ako je \u017eu\u010dno ili u\u010destalo,
  ote\u017eava tinejd\u017eeru povratak roditeljima da bi napunio svoje emocionalno
  spremi\u0161te, a verovatno mu se \u010dini i nemogu\u0107im. Zatim, ako je komunikacija
  izme\u0111u roditelja i tinejd\u017eera slaba, on se mo\u017ee okrenuti svojim vr\u0161njacima
  da bi dobio emocionalnu hranu. Koliko je to samo opasno, a \u010desto i katastrofalno!
  Tinejd\u017eer \u0107e tada biti podlo\u017ean pritisku vr\u0161njaka, uticaju religioznih
  kultova i beskrupuloznih osoba koji iskori\u0161tavaju mlade ljude.\\n\\nKada vas
  tinejd\u017eer isku\u0161ava trude\u0107i se da svojim neprikladnim pona\u0161anjem
  stekne nezavisnost, morate biti pa\u017eljivi i ne smete da reagujete preterano
  emocionalno. To ne zna\u010di da treba da opra\u0161tate lo\u0161e pona\u0161anje.
  Morate iskreno, ali primereno da izrazite svoja ose\u0107anja; to jest, bez preteranog
  gneva, vikanja, vredanja deteta, verbalnog napada na njega, ili nekog drugog na\u010dina
  gubljenja samokontrole. Gledajte na to ovako. Ako neko koga poznajete reaguje preterano
  besno prema vama, kako \u0107e to da uti\u010de na va\u0161a ose\u0107anja prema
  njemu? Manje \u0107ete da po\u0161tujete tu osobu, naro\u010dito ako \u010desto
  gubi kontrolu.\\n\\n\u0160to \u010de\u0161\u010de roditelji gube kontrolu u prisustvu
  tinejd\u017eera, on \u0107e ih manje po\u0161tovati. Morate da se trudite da se
  kontroli\u0161ete, bez obzira na to kako tinejd\u017eer izra\u017eava te\u017enju
  za nezavisno\u0161\u0107u. Morate uvek da dr\u017eite otvorena vrata kroz koja \u0107e
  va\u0161i tinejd\u017eeri da u\u0111u da bi napunili svoja emocionalna spremi\u0161ta.
  Ovo je veoma va\u017eno da bi tinejd\u017eer u zrelo doba u\u0161ao kao kompletna
  osoba.\\n\\n4. USREDSREDENA PA\u017dNJA\\n\\nPru\u017eanje usredsredene pa\u017enje
  va\u0161em tinejd\u017eeru podrazumeva mnogo vi\u0161e od gledanja u o\u010di ili
  fizi\u010dkog dodira. Gledanje u o\u010di i fizi\u010dki dodir, o kojima \u0107emo
  govoriti u petom poglavlju, retko zahtevaju pravu po\u017ertvovanost kod roditelja.
  Usredsredena pa\u017enja zahteva. Potrebno joj je vreme, a ponekad i prili\u010dno
  mnogo vremena. To mo\u017ee da zna\u010di da \u0107ete morati da pru\u017eite usredsredenu
  pa\u017enju onda kad biste radile radili ne\u0161to drugo. Mo\u017ee se desiti da
  tinejd\u017eer o\u010dajni\u010dki \u017eeli usredsredenu pa\u017enju ba\u0161 onda
  kad roditelj ponajmanje ose\u0107a da mo\u017ee da je pru\u017ei.\\n\\nUsredsredena
  pa\u017enja zna\u010di pru\u017eanje potpune, nepodeljene pa\u017enje, da bi se
  tinejd\u017eer ose\u0107ao iskreno voljenim, da bi znao da je vredan i da opravdava
  va\u0161u brigu, razumevanje i beskompromisno po\u0161tovanje. Usredsredena pa\u017enja
  poma\u017ee va\u0161em tinejd\u017eeru da ose\u0107a da vam je on najva\u017enija
  osoba na svetu.\\n\\nU Svetom pismu vidimo veliko po\u0161tovanje prema deci. Car
  David ih je nazvao dar od Gospoda. Isus je rekao da niko ne treba da spre\u010dava
  decu da dodu k njemu, i upozorio da bi za one koji vredaju decu bilo bolje da su
  mrtvi. Rekao je da, ako ne postanemo kao deca pre nego \u0161to pristupimo njemu,
  ne\u0107emo u\u0107i u carstvo Bo\u017eije (vidi Psalam 127:3-5; Evandelje po Mateju
  18:1-10; Evandelje po Marku 10:13-16).\\n\\nTinejd\u017eeri treba da ose\u0107aju
  da su posebni. Malo tinejd\u017eera se ovako ose\u0107a, ali, ogromna je razlika
  kad znaju da su posebni. Samo usredsredena pa\u017enja im to mo\u017ee pokazati.
  Zna\u010dajna je za razvoj njihovog samopouzdanja i sna\u017eno uti\u010de na njihovu
  sposobnost da uspostavljaju odnose s drugima i da ih vole.\\n\\nMislim da je usredsredena
  pa\u017enja najve\u0107a potreba tinejd\u017eera. Mnogi roditelji imaju pote\u0161ko\u0107e
  da prepoznaju ovu potrebu, i da je zadovolje. Postoji vi\u0161e razloga za to. Na
  primer, druge stvari koje \u010dine za svoje tinejd\u017eere \u2013 usluge, pokloni
  i ispunjavanje neobi\u010dnih zahteva \u2013 jedno vreme izgledaju kao dobra zamena
  za usredsredenu pa\u017enju. Ove stvari mogu da budu dobre, ali je velika gre\u0161ka
  ako ih stalno koristimo umesto iskrne usredsredene pa\u017enje. Ova zamena dovodi
  roditelje u isku\u0161enje, jer lak\u0161e je pru\u017eati usluge i poklone, a i
  zahteva mnogo manje vremena. Ali, tinejd\u017eeri ne\u0107e davati sve od sebe,
  ne\u0107e se ose\u0107ati najbolje i ne\u0107e se pona\u0161ati na najbolji na\u010din,
  ukoliko ne dobiju tu dragocenost \u2013 usredsredenu pa\u017enju od svojih roditelja.\\n\\nPRIORITETI\\n\\nNe
  mogu svaku obavezu i odgovornost u mom \u017eivotu da obavljam na na\u010din na
  koji bih \u017eeleo. Jednostavno nemam dovoljno vremena. \u0160ta mogu da uradim
  povodom toga? Postoji samo jedan odgovor i on nije nimalo jednostavan \u2013 moram
  da odredim prioritete, postavim ciljeve i isplaniram vreme da bi ih ispunio. Moram
  da kontroli\u0161em moje vreme da bih se prvo pobrinuo o va\u017enim stvarima.\\n\\nKoji
  su va\u0161i prioriteti? Kako se va\u0161a deca uklapaju u njih? Da li su oni na
  prvom mestu? Drugom? Tre\u0107em? To morate da odredite. U suprotnom, oni \u0107e
  biti nisko na listi prioriteta i pati\u0107e zbog va\u0161eg zanemarivanja. Niko
  ne mo\u017ee umesto vas da odlu\u010di \u0161ta vam je u \u017eivotu va\u017eno.\\n\\nPo\u0161to
  je \u017eivot nepredvidiv, ne mo\u017eete da ra\u010dunate na neograni\u010dene
  mogu\u0107nosti za emocionalnu negu va\u0161e dece. Zbog toga morate dati prednost
  onome \u0161to ste isplanirali, ili onim stvarima koje proisti\u010du iz potreba
  va\u0161ih tinejd\u017eera. Njih \u0107e biti manje nego \u0161to mislite, jer va\u0161a
  deca su tinejd\u017eeri veoma kratko vreme.\\n\\nPOTREBA ZA USREDSRE\u0110ENOM PA\u017dNJOM\\n\\nUsredsredena
  pa\u017enja nije neki zgodan poklon, koji mo\u017eete da date tinejd\u017eeru ako
  to prilike dozvoljavaju. To je klju\u010dna potreba svakog tinejd\u017eera. Od na\u010dina
  na koji je zadovoljena ova potreba zavisi kako \u0107e on videti sebe i kako \u0107e
  ga prihvatiti svet. Bez usredsredene pa\u017enje pove\u0107ava se tinejd\u017eerova
  teskoba, jer ose\u0107a da je njegovim roditeljima sve drugo va\u017enije od njega.
  Zbog toga postaje nesiguran, a njegov emocionalni i psiholo\u0161ki razvoj vrlo
  o\u0161te\u0107en.\\n\\nLako je prepoznati ovakvog tinejd\u017eera. Uop\u0161teno,
  on je manje zreo i siguran u sebe od tinejd\u017eera \u010diji roditelji zadovoljavaju
  njihovu potrebu za usredsre\u0111enom pa\u017enjom. Ovaj nesre\u0107ni tinejd\u017eer
  obi\u010dno je povu\u010den u sebe i ima pote\u0161ko\u0107e u komunikaciji s vr\u0161njacima.
  Te\u0161ko mu je da izade na kraj s ne\u010dim i obi\u010dno reaguje lo\u0161e prilikom
  nekog sukoba. Previ\u0161e zavisi od drugih, uklju\u010duju\u0107i i vr\u0161njake,
  i podlo\u017ean je njihovom pritisku.\\n\\nMe\u0111utim, neki mla\u0111i tinejd\u017eeri,
  naro\u010dito devoj\u010dice, koje ne dobijaju usredsredenu pa\u017enju od o\u010deva,
  reaguju na potpuno suprotan na\u010din. One su pri\u010dljive, manipulativne, sklone
  da stvari dramatizuju, a \u010desto i zavodljive. \u010cesto se smatraju prerano
  razvijenim i preterano zrelim za svoj uzrast. Kad odrastu, ovaj obrazac pona\u0161anja
  se ne menja, ne postaje zreliji, ve\u0107 postepeno postaje neprimereniji. Stariji
  tinejd\u017eeri koji ne dobijaju usredsredenu pa\u017enju, obi\u010dno su nesnosni,
  kako vr\u0161njacima tako i odraslima. Me\u0111utim, \u010dak i tada, usredsredena
  pa\u017enja, naro\u010dito ako je pru\u017eaju o\u010devi, mo\u017ee umnogome umanjiti
  samoodbrambeno pona\u0161anje i teskobu, i osloboditi ih da nastave da se zrelo
  razvijaju.\\n\\nKAKO PRU\u017dITI USREDSRE\u0110ENU PA\u017dNJU?\\n\\nOtkrio sam
  da je najbolji na\u010din za pru\u017eanje usredsredene pa\u017enje tinejd\u017eeru
  tako \u0161to \u0107ete da se s njim negde odvojite i provedete neko vreme sami.
  Verovatno ve\u0107 razmi\u0161ljate koliko je to te\u0161ko. I u pravu ste. Za mene
  je najte\u017ei deo roditeljstva pronaala\u017eenje vremena koje \u0107emo provesti
  nasamo s tinejd\u017eerom, bez ikakvih uticaja sa strane. Ali, suo\u010dimo se s
  tim \u2013 dobro roditeljstvo zahteva vreme. Te\u0161ko je prona\u0107i vreme u
  dana\u0161njem u\u017eurbanom dru\u0161tvu, naro\u010dito kad tinejd\u017eeri imaju
  takva interesovanja, s kojima se mi roditelji slabo snalazimo. Me\u0111utim, to,
  vi\u0161e od svega drugog, ukazuje koliko je usredsredena pa\u017enja bitna. Mnogo
  vi\u0161e nego ikad u istoriji, danas na tinejd\u017eere uti\u0107u neke spolja\u0161nje
  stvari, a ne porodica.\\n\\nPotreban je ogroman napor da bismo prona\u0161li neko
  vreme u prezauzetim rasporedima aktivnosti; ali kad to uradimo, nagrada je ogromna.
  Predivno je videti svog tinejd\u017eera sre\u0107nog, sigurnog, omiljenog me\u0111u
  vr\u0161njacima i odraslima, i kako dobro u\u010di i pona\u0161a se kako najbolje
  mo\u017ee. Ovakvo ispunjenje ne dolazi samo od sebe. Kao roditelji morate da platite
  cenu za to. Morate da pronadete vreme koje \u0107ete da provedete sa svakim detetom
  nasamo.\\n\\nTe\u0161ko je planirati vreme. Poku\u0161ao sam da odvojim najvi\u0161e
  vremena koliko sam mogao za moju decu dok su odrastala. Na primer, kad je moja \u010derka
  Keri, isla u muzi\u010dku \u0161kolu ponedeljkom popodne blizu moje ordinacije,
  ja sam zakazivao sastanke tako da bih mogao da se \u201epokupim\u201c. Zatim bismo
  svratali u restoran i ve\u0107erali zajedno. Tada sam joj poklanjao punu pa\u017enju
  i razgovarao s njom o \u010demu god je htela, bez straha da \u0107e nas ne\u0161to
  prekinuti.\\n\\nSamo na taj na\u010din, bez spolja\u0161njih pritisaka, roditelj
  i dete mogu da razviju taj poseban, neizbrisiv odnos, koji svako dete ocajni\u010dki
  \u017eeli, da bi moglo da se suo\u010di sa stvarnim \u017eivotom. Dete \u010duva
  ovakve trenutke i se\u0107a ih se kad mu je te\u0161ko, naro\u010dito u burnim godinama
  mladala\u010dkih sukoba.\\n\\nDok pru\u017eaju usredsredenu pa\u017enju, roditelji
  mogu da gledaju u o\u010di tinejd\u017eera, ili da koriste fizi\u010dki dodir. Kad
  im se poklanja usredsredena pa\u017enja, gledanje u o\u010di i fizi\u010dki dodir
  imaju ve\u0107i zna\u010daj i uticaj na \u017eivot tinejd\u017eera.\\n\\nVa\u017eno
  je da iskoristite neo\u010dekivane prilike i provedete dodatno vreme s tinejd\u017eerom.
  Na primer, mo\u017eda \u0107ete se neplanirano na\u0107i nasamo s njim. To mo\u017ee
  biti jo\u0161 jedna prilika za punjenje njegovog emocionalnog spremi\u0161ta i spre\u010davanje
  problema koji nastaju ako je ono prazno. Ovo vreme usredsredene pa\u017enje mo\u017ee
  da bude jako kratko \u2013 ali samo trenutak ili dva mo\u017ee da u\u010dini \u010duda.\\n\\nSvaki
  trenutak se ra\u010duna, jer su ulozi veliki. \u0160ta je gore od svojevoljnog mladi\u0107a
  ili devojke? I obratno, ima li i\u0161ta divnije od uravnote\u017eenog tinejd\u017eera?\\n\\nDa,
  usredsredena pa\u017enja zahteva vreme. Te\u0161ko je, a \u010desto i naporno za
  ve\u0107 iscrpljene roditelje, pru\u017eati je dosledno. Me\u0111utim, usredsredena
  pa\u017enja je najmo\u0107niji na\u010din odr\u017eavanja emocionalnog spremi\u0161ta
  punim i ulaganja u budu\u0107nost.\\n\\nKako deca rastu, ovo vreme treba da se produ\u017eava.
  Starijoj deci treba vi\u0161e vremena da se zagreju, da spuste odbrambene zidove
  i da ose\u0107aju da mogu slobodno da podele najdublje misli, naro\u010dito one
  koje ih uzneniruju.\\n\\nKad deca u\u0111u u adolescentsko doba, treba im vi\u0161e
  vremena koje \u0107e da provode s porodicom, ne manje. Lako je pretpostaviti da
  s tinejd\u017eerima treba provoditi sve manje vremena jer naglo postaju sve nezavisniji
  i izgledaju kao da \u017eele da sve vi\u0161e vremena provode van porodice. Ovo
  je jedna od naj\u0161tetnijih gre\u0161aka koju roditelji danas prave. Kad njihova
  dece u\u0111u u adolescentski period, roditelji obi\u010dno svoje slobodno vreme
  koriste za zadovoljenje vlastitih potreba. Svaki tinejd\u017eer kog poznajem do\u017eivljava
  to kao odbacivanje, ose\u0107aju\u0107i da se roditelji sve manje brinu za njega.\\n\\nTinejd\u017eerima
  je potrebno roditeljsko vreme i pa\u017enja kao nikad do tada. Svakodnevno se susre\u0107u
  s jakim silama, od kojih su mnoge, nazo\u010dnost, nezdrave, gadne, a ponekad i
  zle. Ako \u017eelite da va\u0161 tinejd\u017eer uspe\u0161no izlazi na kraj s dana\u0161njim
  svetom, morate s njim da provodite konstruktivno vreme; naro\u010dito u periodu
  adolescentskih nemira. Ako zadovoljite ove njegove potrebe, on \u0107e imati samopouzdanje
  i li\u010dni integritet i razmi\u0161lja\u010de o vrednostima po kojima \u0107e
  \u017eiveti. Ima\u0107e snagu da se boriti protiv \u0161tetnih uticaja ljudi koji
  ga malo ili nimalo ne cene, ve\u0107 jednostavno \u017eele da ga iskoriste.\\n\\nMo\u017eda
  vam izgleda da je ovo nemogu\u0107e posti\u0107i, naro\u010dito kad va\u0161e dete
  \u010desto nije raspolo\u017eeno za komunikaciju, kao \u0161to se de\u0161ava u
  ranom ili srednjem adolescentskom periodu. Treba da zapamite jednu stvar, a to je
  da su psiholo\u0161ki odbrambeni mehanizmi \u010dudljivog tinejd\u017eera vrlo visoki,
  i da je potrebno vreme, da bi ih on polako spustio i mogao iskreno da komunicira
  i podeli s vama ono \u0161to ga zaista mu\u010di. Da li ste iz ovog izvukli magi\u010dnu
  re\u010d? VREME.\\n\\nSe\u0107am se kad je na\u0161a draga Keri imala \u010detrnaest
  godina. Koje godine! Prolazila je kroz tipi\u010dnu adolescentsku fazu i \u010desto
  je razgovarala samo gundaju\u0107i, \u0161to je zvu\u010dalo otprikljike kao \u201emhmm\u201c,
  \u201ehmm\u201c ili \u201eha\u201c.\\n\\nU tom periodu otkrio sam dve va\u017ene
  stvari. Prvo, beskorisno i \u0161tetno je terati dete da se otvori i razgovara.
  Iako sam bio u isku\u0161enju da je gnjavim pitanjima, shvatio sam da je to pogre\u0161no
  i da \u0107e samo pogor\u0161ati situaciju. Drugo, ako bih proveo barem dvadeset
  ili trideset minuta s njom na opu\u0161ten na\u010din, ne teraju\u0107i je da razgovaramo,
  polako bi spustila odbrambene mehanizme i tada bi zaista mogla da podeli svoje misli
  i ose\u0107anja sa mnom.\\n\\nJedan od najdelotvornijih na\u010dina da to postignete
  je da tinejd\u017eera odvedete u restoran. Izabrao bih restoran s najsporijom uslugom
  u gradu i trudio bih se da dodemo u vreme najve\u0107e gu\u017eve, da bismo mogli
  dugo da \u010dekamo. Nekoliko puta bih zamolio konobara da dode ponovo rekav\u0161i:
  \u201eJo\u0161 nismo odlu\u010dili \u0161ta \u0107emo da naru\u010dimo\u201c. Dugo
  bih jeo, a zatim naru\u010dio desert, koji ina\u010de izbegavam, pa bih le\u017eerno
  popio \u0161olju kafe.\\n\\nVidite, svrha svega ovoga bila je da obezbiedim dovoljno
  vremena koje \u0107u provesti s Keri, koja nije bila pod pritiskom da ba\u0161 mora
  da razgovara, ve\u0107 joj je bilo prijatno sa mnom. I \u010dekanje u redu\\n\\nna
  javnom mestu zadovoljava te uslove. Ostale mogu\u0107nosti su ribolov, lov, pe\u0161a\u010denje,
  putovanje (kratko ili dugo), igranje, gledanje predstave, slu\u0161anje orkestra.
  Kad je tinejd\u017eer s roditeljima, a nije pod pritiskom, postepeno \u0107e da
  spusti odbrambene mehanizme i po\u010de\u0107e da razgovara \u2013 u po\u010detku
  povr\u0161no, a kasnije o mnogo zna\u010dajnijim stvarima.\\n\\nDok bismo zavr\u0161ili
  s jelom, Keri bi razgovarala prili\u010dno slobodno i delila bi sa mnom ose\u0107anja
  \u2013 ali uglavnom povr\u0161no \u2013 o sportu, nastavnicima, \u0161kolskim obavezama.
  Zatim bih platio ra\u010dun i oti\u0161li bismo u kola.\\n\\nDozvolite mi da ovde
  ubacim zanimljivu digresiju. Kad vozite svog tinejd\u017eera kolima, naro\u010dito
  ako su tu i drugi tinejd\u017eeri, jednostavno nekako gubite svoj identitet i ose\u0107ate
  se kao deo automobila \u2013 kao nastavak volana. Moja \u017eena i ja bili smo zahvalni
  na toj adolescentskoj osobini \u2013 zapanjuju\u0107e je koliko je lak\u0161e razgovarati
  s adolescentom dok se vozite nasamo s njim ili s njom. Isto tako je zapanjuju\u0107e
  koliko smo mi nau\u010dili za to vreme.\\n\\nIpak, vratimo se Keri i meni. U\u0161li
  bismo u kola i obi\u010dno, oko kilometar-dva pre nego \u0161to bismo stigli ku\u0107i,
  ona bi kona\u010dno po\u010dela da pri\u010da o stvarima koje joj zaista zna\u010de.
  Na primer o odnosima s vr\u0161njacima, odnosima u porodici, pritisku vr\u0161njaka
  da uzima drogu. Naravno, nismo mogli da zavr\u0161imo razgovor do ku\u0107e, \u0161to
  je tipi\u010dno za tinejd\u017eere. To je zbog toga \u0161to oni moraju da ose\u0107aju
  da mogu da \u201epobegnu\u201c kad nekome pru\u017ee tako va\u017ene informacije
  o sebi. Moraju da ose\u0107aju da mogu da odu, ukoliko roditelji ne reaguju primereno
  na njihova najdublja ose\u0107anja. Ono \u010dega se oni najvi\u0161e pla\u0161e
  nije neslaganje, ve\u0107 gnev, podsmeh, osuda ili odbacivanje njih samih.\\n\\nMoraju
  da ose\u0107aju da oni vladaju situacijom da bi, ako im postane neprijatno, mogli
  da se povuku.\\n\\nZbog toga je Keri \u010dekala da se pribli\u017eimo ku\u0107i
  da bi mi rekla ono \u0161to joj je stvarno va\u017eno. Tada sam najopu\u0161tenije
  razgovarao s Keri. Ponekad bi prikrivala vlastite konflikte, pri\u010daju\u0107i
  kao da se to desilo nekom drugom tinejd\u017eeru. Na ovaj na\u010din mnogi tinejd\u017eeri
  pri\u010daju o neprijatnim, zbunjuju\u0107im situacijama s kojima te\u0161ko izlaze
  na kraj.\\n\\nPonekad je tinejd\u017eerima potrebno da s roditeljima razgovaraju
  o problemima, a ponekad im je vrlo te\u0161ko da zapo\u010dnu razgovor. Tada \u0107e
  jednostavno praviti aluzije na ne\u0161to. Te aluzije mogu da budu razli\u010dite.
  Tinejd\u017eer kome je potreban razgovor, a koji nije raspolo\u017een za pri\u010danje,
  mo\u017ee nagovestiti ne\u0161to drugo od onoga o \u010demu mu se stvarno pri\u010da.
  Na primer, mo\u017ee da postavlja pitanja o doma\u0107em zadatku, ili mo\u017eda
  pitanja o tome kako je roditelj proveo dan. Mo\u017ee i da komentari\u0161e kako
  je njemu pro\u0161ao dan.\\n\\nRoditelji moraju biti svesni ovoga, a ponekad i zagonetnih
  gestova koje kolebljivi tinejd\u017eer koristi da bi tra\u017eio vreme i usredsre\u0111enu
  pa\u017enju. On nas tako \u201eispituje\u201c, testiraju\u0107i nas da bi video
  kako smo raspolo\u017eeni \u2013 da vidi da li je bezbedno da nam pride i razgovara
  o ne\u010demu za njega neprijatnom.\\n\\nTinejd\u017eeri mogu da isku\u0161avaju
  i na\u0161u predusretljivost, na\u0161e raspolo\u017eenje, stavljaju\u0107i pred
  nas neki \u201emamac\u201c, ili podi\u017eu\u0107i \u201edimnu zavesu\u201c. To
  su samo par\u010di\u0107i informacija da bi nas njima iritirali \u2013 odli\u010dan
  na\u010din da vide da li mogu da nam povere ono \u0161to im je zaista na umu. Ako
  preteramo, posebno s gnevom ili kritikom, tinejd\u017eer \u0107e da pretpostavi
  da \u0107emo i na to va\u017eno pitanje reagovati na isti na\u010din. Ali, ako pokazemo
  vi\u0161e samokontrole i mirno\u0107e, tinejd\u017eer \u0107e se otvoriti i podeliti
  svoja ose\u0107anja.\\n\\nOvakve prilike su dragocene. Ako ih ne primetimo i zatvorimo
  vrata na\u0161em tinejd\u017eeru, on \u0107e se ose\u0107ati odba\u010denim. Me\u0111utim,
  ako smo oprezni i prepoznamo ove suptilne znakove, mo\u017eemo da reagujemo na pravi
  na\u010din i pomognemo na\u0161em tinejd\u017eeru, i kona\u010dno mu poka\u017eemo
  da ga volimo i da smo osetljivi na njegove potrebe.\\n\\nPamtim mnogo takvih situacija
  dok je Keri bila tinejd\u017eer. Vrlo \u010desto je birala vreme kad je znala da
  je mala verovatno\u0107a da \u0107e mene ili njenu majku da prekine u tome \u0161to
  radimo. Mo\u017eete da pretpostavite kad je to bilo \u2013 ba\u0161 kad smo se Pet
  i ja spremali da ugasimo svetlo i legnemo da spavamo. Njena mlada bra\u0107a su
  ve\u0107 spavala, pa nije imala konkurenciju. Prvo bismo videli kako se vrata polako
  otvaraju i Keri bi u\u0161la da pita majku mo\u017ee li da uzme ne\u0161to iz na\u0161eg
  kupatila. Kad bi uzela to \u0161to je tra\u017eila i po\u0161la da izade, okrenula
  bi se prema nama i rekla: \u201eOvaj, htela sam da ka\u017eem...\u201c\\n\\nNe mogu
  da prenaglasim zna\u010daj prepoznavanja ili pam\u0107enja ovih porodi\u010dnih
  re\u010di: \u201eOvaj, htela sam da ka\u017eem\u201c ili njima sli\u010dnih re\u010di.
  Da li znate \u0161ta one stvarno zna\u010de, kad ih izgovori tinejd\u017eer u toj
  situaciji? Prevod je obi\u010dno ovakav: \u201ePravi razlog zbog kog sam ovde i
  ono o \u010demu \u017eelim da razgovaram, upravo sledi, ali prvo \u017eelim da znam
  \u2013 da li ste raspolo\u017eeni za to? M\u043e\u0433\u0443 \u043b\u0438 \u0434\u0430
  \u0432\u0430\u043c \u0432\u0435\u0440ujem u vezi s ovim izuzetno osetljivom delom
  mog \u017eivota? Ho\u0107ete li mi pomo\u0107i ili \u0107ete to upotrebiti protiv
  mene? M\u043e\u0433\u0443 \u043b\u0438 da \u0432\u0430\u043c \u0432\u0435\u0440ujem?\u201c\\n\\nAko
  im tada ne pru\u017eimo usredsredenu pa\u017enju, tinejd\u017eeri \u0107e to shvatiti
  kao negativan odgovor. Ali, ako na\u0161u pa\u017enju usmerimo direktno na dete,
  i saslu\u0161amo ga pa\u017eljivo i mirno, dopu\u0161taju\u0107i mu da ono kontroli\u0161e
  tok razgovora, tinejd\u017eer \u0107e se ose\u0107ati sigurnim i otkri\u0107e nam
  problem koji ga mu\u010di. Usput, budite spremani za ovih \u010duvenih pet re\u010di,
  ubrzano posle \u201emamca\u201c ili \u201edimne zavesu\u201c.\\n\\nSe\u0107am se
  da sam ponekad gre\u0161io i govorio Keri da proveri da li je ugasila sva svetla.
  Ali, tada bih osetio brz udarac ispod pokriva\u010da, jer bi moja \u017eena prepoznala
  o \u010demu Keri govori i znala bi da joj je potrebna ta dragocenost \u2013 usredsredena
  pa\u017enja. Kad god bismo se poneli kako valja, Keri bi nastavljala razgovor na
  svoj na\u010din, u po\u010detku govore\u0107i o povr\u0161nim stvarima, postepeno
  dolaze\u0107i do njoj va\u017enih stvari. Posle nekog vremena sedela bi na dnu na\u0161eg
  kreveta. Uskoro bi le\u017eala preko na\u0161ih nogu, nastavljaju\u0107i da pri\u010da.
  Kona\u010dno bi do\u0161la do problema koji je mu\u010di. Se\u0107am se kad je jednom
  rekla: \u201eNe znam da li me D\u017eim jo\u0161 uv\u0435\u043a voli. Tako se promenio.\u201c
  Bilo joj je vrlo te\u0161ko da nam to ka\u017ee. Prvo je morala da se uveri da je
  potpuno bezbedno da to podeli s nama. Prvo je morala da koristi \u201emamac\u201c
  i \u201edimnu zavesu\u201c, pre nego \u0161to nam je otkrila problem.\\n\\nKad se
  iznese tako osetljiva tema, roditelji stoje pred stvarnim isku\u0161enjem da je
  olako shvate kao neva\u017enu i proprate le\u017eernim, brzopletim odgovorom, kao
  da je to trivijalan problem. Moramo ozbiljno da shvatimo na\u0161e tinejd\u017eere,
  pa\u017eljivo s njima da prou\u010dimo probleme, i pomognemo im da dodu do logi\u010dnog
  i razumnog re\u0161enja. Na taj na\u010din im ne\u0107emo samo pomo\u0107i u re\u0161avanju
  problema, nego \u0107emo u\u010dvrstiti na\u0161u ljubav i odnos s njima, \u0161to
  je mnogo va\u017enije.\\n\\nDok im poma\u017eemo da re\u0161avaju probleme, mo\u017eemo
  da ih u\u010dimo da logi\u010dno, racionalno i odgovorno razmi\u0161ljaju. Samo
  ako nau\u010de da jasno razmi\u0161ljaju, tinejd\u017eeri mogu da razviju sposobnost
  da razlikuju dobro od lo\u0161eg i da razviju odre\u0111eni vrednosni sistem.\\n\\n**KRIVICA
  I ZAVIST**\\n\\nDa bismo razumeli pozadinu tinejd\u017eerskih problema, treba da
  budemo svesni njihovog okru\u017eenja. Tinejd\u017eersko dru\u0161tvo je sli\u010dno
  pili\u0107ima \u2013 u oba dru\u0161tva postoji hijerarhija. Adolescentsko dru\u0161tvo
  je kompleksno, ali je uglavnom zasnovano na popularnosti i prihva\u0107enosti. Va\u017eno
  je da otriplike znate gde je va\u0161e dete u toj mre\u017ei odnosa, jer su najboljnici
  problemi adolescenata vezani za odnose s vr\u0161njacima, i obuhvataju jedno ili
  vi\u0161e ose\u0107anja \u2013 zavist, krivicu, gnev i depresiju. Kasnije \u0107emo
  detaljno opisati gnev i depresiju, a sad \u0107emo da razmotrimo zavist i krivicu.\\n\\nU
  ophodenju s vr\u0161njacima, tinejd\u017eeri \u010desto imaju probleme, zbog kojih
  ose\u0107aju krivicu ili zavist. Na\u017ealost, mnogi tinejd\u017eeri ne umeju da
  prepoznaju krivicu ili zavist u sebi samima, pa ih ose\u0107aju kao bol (ogor\u010denost)
  i/ili zbunjenost.\\n\\nAko tinejd\u017eer ima problem s vr\u0161njakom koji se nalazi
  ni\u017ee na lestvici tog adolescentskog dru\u0161tva, verovatno \u0107e ose\u0107ati
  krivicu. Ako ima pote\u0161ko\u0107e s nekim ko je iznad njega, uglavnom \u0107e
  ose\u0107ati zavist. Kad do\u0111e do sukoba interesa ili pozicija, tinejd\u017eer
  na ni\u017eoj lestvici, podstaknut zavi\u0161\u0107u, poku\u0161a\u0107e kod vr\u0161njaka
  na vi\u0161oj lestvici da izazove ose\u0107aj krvice.\\n\\nZa roditelje je va\u017eno
  da vide poziciju tinejd\u017eera u sukobu i da prepoznaju ose\u0107anja s kojima
  se bori. Obja\u0161njava\u045ae situacije pomo\u0107i \u0107e tinejd\u017eeru na
  nekoliko na\u010dina.\\n\\n- Omogu\u0107i\u0107e mu da ta\u010dno razume \u0161to
  se de\u0161ava i za\u0161to.\\n- Pomo\u0107i \u0107e mu da shvati da li je u\u010dinio
  ne\u0161to pogre\u0161no.\\n- Pomo\u0107i \u0107e mu da se izbori s ovom situacijom,
  kao i s drugim, sli\u010dnim.\\n\\nNa primer, ako va\u0161 tinejd\u017eer ose\u0107a
  krivicu, razja\u0161njava\u045ae situacije \u0107e mu uglavnom pokazati da nije
  kriv i da je stvarni problem u tome \u0161to drugi tinejd\u017eer ose\u0107a zavist.\\n\\nAko
  je va\u0161 tinejd\u017eer ljubomoran, treba mu pomo\u0107i da to prepozna u sebi
  i da razume za\u0161to se tako ose\u0107a. Tada \u0107ete biti u mogu\u0107nosti
  da mu pomognete da ukloni problem \u2013 tako \u0161to \u0107ete mu objasniti da
  ne postoji pravi razlog za ljubomoru, ako stvarno ne postoji, ili tako \u0161to
  \u0107ete ga u\u010diti kako da prevazide zavist, ako postoji razlog za nju.\\n\\nKad
  je Keri osvojila prvo mesto na takmi\u010denju za najlep\u0161u tinejd\u017eerku,
  skoro svi njeni vr\u0161njaci bili su uzbu\u0111eni i stvarno ponosni zbog nje.
  Ali, jedne ve\u010deri, nedugo posle toga, izgledalo je kao da Keri ima problem.
  Ispostavilo se da ju je njena ljubomorna vr\u0161njakinja naterala da ose\u0107a
  krivicu \u0161to je pobedila na takmi\u010denju. Izjava koja je izazvala krivicu
  bila je otpriklike ovakva: \u201ePogledajte veliku zvezdu! Sigurno misli da je ona
  ne\u0161to naro\u010dito!\u201c\\n\\nKeri se ose\u0107ala bedno, tipi\u010dno za
  tinejd\u017eerku u takvim okolnostima, i nije mogla da se re\u0161i tog ose\u0107aja.
  Majka joj je pomogla da razume taj ose\u0107aj krvice \u2013 da ona u stvari nije
  u\u010dinila ni\u0161ta lo\u0161e, i da jednostavno ose\u0107a la\u017enu krivicu
  za koju nema osnova.\\n\\nOvo Kerino iskustvo opisuje \u010dest problem u dana\u0161njem
  svetu tinejd\u017eera. Za emocionalni razvoj tinejd\u017eera od velikog zna\u010daja
  je da ih nau\u010dimo da prepoznaju i razumeju zavist i krivicu u sebi i da se primereno
  odnose prema ovim emocijama. Ako to ne mogu, verovatno \u0107e biti izmanipulisani
  krivicom.\\n\\n**MANIPULACIJA KRIVICOM**\\n\\nOvo je veliki problem me\u0111u dana\u0161njim
  omladinom. \u0160to je tinejd\u017eer osetljiviji, to je podlo\u017eniji manipulaciji
  krivicom. S druge strane, \u0161to je manje osetljiv, tinejd\u017eer \u0107e biti
  skloniji manipulaciji drugima.\\n\\nManevar je prili\u010dno jednostavan. Manipulant
  pronalazi na\u010din da kod manipulisanog izazove krivicu, ako on ne uradi ono \u0161to
  manipulant \u017eeli. Naravno, klasi\u010dan primer za ovo \u2013 i naj\u0161tetniji
  \u2013 je de\u010dak koji poku\u0161ava da podstakne devoj\u010dicu da ima seksualni
  odnos s njim, uz primedbe kao \u0161to su: \u201eAko me stvarno voli\u0161, uradi\u010de\u0161
  to.\u201c\\n\\nRoditelji osetljivog tinejd\u017eera su u odli\u010dnoj poziciji
  da nau\u010de dete o ovoj \u0161tetnoj stvari. Tinejd\u017eeri treba da razumeju
  tri stvari:\\n\\n- Kako da prepoznaju manipulaciju krivicom.\\n- Da je to nemoralno,
  nezdravo i neeti\u010dki \u2013 da je pogre\u0161no.\\n- Da je normalna i opravdana
  reakcija na manipulaciju gnev.\\n\\nU biblijskom izve\u0161taju o sukobu Isusa i
  menja\u010da novca u hramu, kao jedan od elemenata koji je izazvao Isusov gnev,
  vidim manipulaciju. Ljudi koji su dolazili u hram morali su ne\u0161to da \u017ertvuju
  da bi ispunili svoje religiozne du\u017enosti. Ose\u0107ali bi krivicu \u0161to
  nisu prineli \u017eivotinjsku \u017ertvu. U sceni u\\n\\nkojoj Isus opisuje hram
  kao hajdu\u010dku pe\u0107inu, postojala je manipulacija krivicom. I Isusov gnev
  je bio primerena reakcija (vidi Evandelje po Mateju 21; Evandelje po Luki 19; Evandelje
  po Jovanu 2.).\\n\\nSe\u0107am se divne \u0161esnaestogodi\u0161nje devojke Klaudije
  koja je bila kod mene na savetovanju. Bila je izuzetno ose\u0107ajna devojka u dubokoj
  depresiji. U toku razgovora saznao sam da je njen de\u010dko na razli\u010dite na\u010dine
  koristio krivicu da bi njome manipulisao. Kao mnogi tinejd\u017eeri, ni Klaudija
  nije bila potpuno svesna svoje osetljivosti, depresije i toga da njome manipuli\u0161e
  de\u010dko pomo\u0107u krivice. Prvo sam joj objasnio koliko je ona ose\u0107ajna
  \u2013 koliko je lako povrediti je i u\u010diniti da se ose\u0107a krivom. Zatim
  sam joj objasnio kako drugi, a naro\u010dito njen de\u010dko, upravljaju njome \u010dine\u0107i
  da ose\u0107a krivicu ako ne uradi ono \u0161to oni \u017eele.\\n\\nPo\u0161to Klaudija
  nije razumela odmah o \u010demu joj govorim, naveo sam joj primer koji nije toliko
  povezan s njom. Rekao sam: \u201eJa sam tako\u0111e osetljiva osoba, i do pre par
  godina nisam uo\u010dio kako neki ljudi manipuli\u0161u mnome uz pomo\u0107 krivice.
  Kad sam zavr\u0161io medicinu, htio sam da prodam ku\u0107u. Bilo mi je te\u0161ko
  da je prodajem sam, pa sam sklopio ugovor s agentom da je on proda umesto mene.
  Posle nekoliko dana, moj kolega s fakulteta, koji je nameravao da u gradu ostane
  radi sta\u017eiranja, ponudio mi je izvesnu sumu za ku\u0107u, ali je \u017eeleo
  da izbegne agenta i tako u\u0161tedi ne\u0161to novca. Rekao sam mu da to ne mogu
  da uradim \u2013 i da mora da ide preko agenta. Kasnije tog dana, agent je do\u0161ao
  k meni s ponudom nekog drugog kupca i ja sam je prihvatio. Kad je moj kolega shvatio
  da sam prodao ku\u0107u, bio je besan i poku\u0161avao da me nagovori da je prodam
  njemu. Svojim argumentima me je stalno podse\u0107ao da smo mi kolege, da \u0107u
  na radnom mestu zaradivati vi\u0161e od njega, da je ku\u0107a iznajmljivana pet
  godina i da ne vredi toliko koliko je ponudio drugi kupac.\u201c\\n\\nZatim sam
  rekao: \u201eVidi\u0161 li kako je ovaj \u010dovek poku\u0161ao da manipuli\u0161e
  mnome da mu prodam ku\u0107u, izazivaju\u0107i kod mene ose\u0107aj krivice?\u201c\\n\\nKlaudijine
  o\u010di su zasijale. Shvatila je za\u0161to ima tako slabu kontrolu nad vlastitim
  \u017eivotom. Kad sam je slede\u0107i put video, nije vi\u0161e bila depresivna
  i video sam sjaj u njenim o\u010dima. Nau\u010dila je kako da razmi\u0161lja o sebi
  i da sama odlu\u010di kako \u0107e da se pona\u0161a, a ne da dozvoli da njome manipuli\u0161u.\\n\\nRoditelji
  moraju biti oprezni i ne smeju da manipuli\u0161u tinejd\u017eerima uz pomo\u0107
  krivice. Veoma je lako upasti u ovu zamku, naro\u010dito ako imaju izuzetno osetljivu
  decu. Ako roditelji manipuli\u0161u tinejd\u017eerom, uz pomo\u0107 krivice, i ostalima
  \u0107e to biti veoma lako.\\n\\nKoji je najbolji na\u010din za\u0161tite tinejd\u017eera
  od manipulacije krivicom? Uz bezuslovnu ljubav i usredsredenu pa\u017enju, roditelji
  mogu da nau\u010de tinejd\u017eere da prepoznaju manipulativno pona\u0161anje drugih,
  i da se paze da ne upadnu u tu zamku.\\n\\n5. GLEDANJE U O\u010cI I FIZI\u010cKI
  DODIR\\n\\n\u017divimo u vremenu u kome postoji veliki broj spolja\u0161njih uticaja
  koji uti\u010du na tinejd\u017eere, a mnogi od njih su nezdravi, neki \u010dak i
  zli i \u0161tetni. Tinejd\u017eer koji se ne ose\u0107a iskreno voljenim je izuzetno
  podlo\u017ean tim uticajima. Mnogi beskrupulozni ljudi koji iskori\u0161tavaju mlade
  ljude su namamili tinejd\u017eere \u017eeljne ljubavi poklanjaju\u0107i im vreme,
  pa\u017enju i ljubav.\\n\\nVremena je malo. Kao roditelj, imate ograni\u010deno
  vreme i prilike da u\u010dinite da se va\u0161 tinejd\u017eer ose\u0107a bezuslovno
  voljenim. Morate svakodnevno biti dosledni u odr\u017eavanju njegovog emocionalnog
  spremi\u0161ta punim. To \u0107e mu pomo\u0107i da izraste u osobu koja \u0107e
  potpuno i jasno razmi\u0161ljati o sebi, i razviti dob\u0440\u0443 samokontrolu.
  Samo kad bude ose\u0107ao da ga iskreno volite, mo\u0107i \u0107ete da uti\u010dete
  na njega onako kako bi trebalo. Da, mo\u017eete da mu ka\u017eete, ali vi isto tako
  \u017eelite da mu pokazete ljubav va\u0161im pona\u0161anjem, kao \u0161to smo ranije
  pomenuli.\\n\\nGledanje u o\u010di i fizi\u010dki dodir bi trebalo da budu sastavni
  deo svakodnevnog ophodenja s decom. Treba da budu prirodni, prijatni i ne preterani.
  Dete ili tinejd\u017eer koji odrasta u ku\u0107i s roditeljima koji ga gledaju u
  o\u010di i dodiruju, bi\u0107e zadovoljno sobom i bi\u0107e mu prijatno u dru\u0161tvu
  drugih ljudi. Bi\u0107e mu lak\u0161e da zapo\u010dne komunikaciju s drugima, a
  zbog toga \u0107e biti omiljen i ima\u0107e ogromno samopouzdanje.\\n\\nPrimereno
  i \u010desto gledanje u o\u010di i fizi\u010dki dodir su dva najdragocenija poklona
  koje mo\u017eete dati va\u0161em tinejd\u017eeru. Oni su, zajedno s usredsredenom
  pa\u017enjom, najdelotvorniji na\u010dini za punjenje emocionalnog spremi\u0161ta
  tinejd\u017eera i omogu\u0107avanja da bude \u0161to bolji.\\n\\nGLE\u0110ANJE U
  O\u010cI\\n\\nJedan od glavnih razloga zbog kog roditelji puni ljubavi ne uspevaju
  da iska\u017eu bezuslovnu ljubav svojim tinejd\u017eerima je nedostatak gledanja
  u o\u010di. Stalno gledanje u o\u010di ispunjeno ljubavlju je presudno, ne samo
  za ostvarivanje dobre komunikacije, ve\u0107 i za zadovoljavanje emocionalnih potreba.
  Iako to ne shvatate, vi koristite gledanje u o\u010di da bi izrazili mnoga ose\u0107anja
  \u2013 tugu, gnev, mr\u017enju, bes i ljubav. U nekim porodicama tinejd\u017eeri
  i roditelji se za\u010duduju\u0107e malo gledaju u o\u010di. I ako postoje, ti pogledi
  su obi\u010dno negativni, na primer kad roditelji grde tinejd\u017eera ili mu daju
  neke posebne savete. \u0160to ste sposobniji da gledate va\u0161eg tinejd\u017eera
  u o\u010di i tako mu izrazite ljubav, to \u0107e i on biti vi\u0161e emocionalno
  nahranjen ljubavlju.\\n\\nVa\u0161 tinejd\u017eer ne\u0107e uvek biti jednako sposoban
  za gledanje u o\u010di. U jednom trenutku \u0107e to o\u010dajni\u010dki da tra\u017ei.
  Slede\u0107eg trenutka mo\u017ee da izbegava va\u0161 pogled. U ovoj neujedna\u010denosti,
  on ili ona u\u010di kako da gleda u o\u010di, uglavnom putem onog \u0161to vidi
  od drugih \u010dlanova porodice u svom domu.\\n\\nPre nekog vremena, video sam sedamnaestogodi\u0161njeg
  Brusa. Visok, dobro graden, dobrog izgleda, odli\u010dan student i sportista; uop\u0161te,
  vrlo prijatna li\u010dnost. Bilo je \u010dudno \u0161to je imao manjak samopouzdanja
  i sebe smatrao nesposobnim. Bilo je lako uo\u010diti njegovo nisko mi\u0161ljenje
  o sebi, jednostavno ga posmatraju\u0107i kako gleda u o\u010di. Skoro uvek gledao
  je ispred sebe. Kad bi me pogledao u o\u010di, to bi bilo samo na deli\u0107 sekunde.
  Objasnio sam mu da na\u010din na koji on gleda u o\u010di sna\u017eno uti\u010de
  na njegov odnos s drugim ljudima. Njegov lo\u0161 obrazac gledanja u o\u010di je,
  u stvari, samo pogor\u0161ao njegovu sliku o sebi. Ljudima je bilo neprijatno sa
  Brusom \u2013 mislili su da ih ne voli ili da ih ignori\u0161e. U stvari, odahnuli
  bi kad bi mogli da zavr\u0161e razgovor i da odu od njega. Brus je ovo, naravno,
  smatrao odbacivanjem i ose\u0107ao se gore nego ikad. Nije ni \u010dudo da je Brus,
  s ovakvim\\n\\ndugogodi\u0161njim obrazcem pona\u0161anja, razvio potpuno pogre\u0161nu,
  u\u017easnu, sliku o sebi. Na sre\u0107u, nije bilo te\u0161ko pomo\u0107i mu da
  ispravi ovaj obrazac gledanja u o\u010di.\\n\\nAko va\u0161 tinejd\u017eer razvije
  lo\u0161u naviku da ne gleda ljude u o\u010di, vi mo\u017eete da mu skrenete pa\u017enju
  na to i pomognete mu da ih ispravi. Dobar na\u010din gledanja u o\u010di mo\u017ee
  da napravi razliku izme\u0111u uspeha i neuspeha u skoro svim \u017eivotnim situacijama.\\n\\nGledanje
  u o\u010di s puno ljubavi mo\u017ee da bude jako te\u0161ko, naro\u010dito u periodu
  kad tinejd\u017eer nije raspolo\u017een za komuniciranje. Mo\u017ee biti veoma te\u0161ko
  razgovarati s njim, naro\u010dito kad, uglavnom, odgovara na pitanja sa \u201eaha\u201c,
  \u201emhm\u201c, \u201ehmm\u201c i sli\u010dnim gundanjem.\\n\\nOvo neprijatno vreme
  komunikacije obi\u010dno se javlja u jednom od slede\u0107a tri slu\u010daja:\\n\\n-
  Prvi je zaostajanje u psihoseksualnom razvoju, o kome \u0107e biti re\u010di u \u0161estom
  poglavlju. Tinejd\u017eer re\u0161ava konflikte koji su se pojavili u pro\u0161losti.\\n-
  Drugi je kad je \u017eelja za nezavisno\u0161\u0107u toliko jaka i tinejd\u017eer
  ose\u0107a da treba da se odvoji od roditelja.\\n- Tre\u0107i je kad je tinejd\u017eer
  imao neprijatno iskustvo s vr\u0161njacima i ose\u0107a se povredenim.\\n\\nOvi
  periodi mrzovolje, povu\u010denosti i mirno\u0107e, tako\u0111e su pra\u0107eni
  suprotstavljanjem roditeljskoj ljubavi i ne\u017enosti.\\n\\nU tom periodu pogre\u0161no
  je prisiljavati ili podsticati tinejd\u017eera pitanjima. Roditelji su obi\u010dno
  razdra\u017eeni, zabrinuti, pa \u010dak i o\u010dajni, i poku\u0161avaju da zapo\u010dnu
  razgovor stalnim pitanjima kao \u0161to su: \u201eKako si proveo dan?\u201c, \u201e\u0160ta
  ti se danas desilo?\u201c, \u201eJesi li se lepo proveo?\u201c, \u201eKo je jo\u0161
  bio \u0442\u0430\u043c\u043e?\u201c. To prili\u010dno iritira svakoga ko nije raspolo\u017een
  za razgovor.\\n\\nTajna je u tome da uvek budete na raspolaganju. To zna\u010di,
  umesto da ga prisiljavate na komunikaciju, budite mu uvek na raspolaganju, tako
  da tinejd\u017eer mo\u017ee da razgovara s vama kad mu to bude prijalo.\\n\\nKad
  va\u0161e dete ulazi u adolescentski uzrast, ono dobija neodoljivu \u017eelju za
  nezavisno\u0161\u0107u, seksualnim izra\u017eavanjem i prihvatanjem od strane vr\u0161njaka.
  Mora da razvije odbrambeni sistem protiv ovih pritisaka da ne bi do\u017eiveo neuspeh.
  Na\u017ealost, ono povremeno koristi primitivne i neprijatne odbrambene mehanizme
  kao \u0161to su povu\u010denost, gubitak \u017eelje za komunikacijom i mrzovolja.\\n\\nOvi
  primitivni odbrambeni mehanizmi ne mogu se primeniti a da se ne naru\u0161i va\u0161
  odnos s detetom. Jedini ose\u0107ajan, razuman i konstruktivan na\u010din da se
  izborite s ovom situacijom jeste da sa\u010dekate da odbrambeni mehanizmi padnu.
  Morate ostati na raspolaganju va\u0161em tinejd\u017eeru da bi mogao da dode do
  vas kad bude spreman.\\n\\nMe\u0111utim, postoje odre\u0111ene stvari koje mo\u017eemo
  da uradimo da bismo pobolj\u0161ali spu\u0161tanje ovih odbrambenih mehanizama,
  i o tome \u0107emo razgovarati kasnije. Ali, sada je va\u017eno da shvatite da nije
  preporu\u010dljivo da ru\u0161ite ove izuzetno jake odbrambene mehanizme.\\n\\nTinejd\u017eerova
  sposobnost gledanja u o\u010di varira u zavisnosti od toga koliko je sna\u017ean
  njegov odbrambeni mehanizam. Kad je dete mla\u0111e, skoro neprekidno mo\u017ee
  da prima pogled, ali kad u\u0111e u period adolescencije, postoje neprijatni trenuci
  u kojima izbegava gledanje u o\u010di.\\n\\nNe dozvolite da vas njegova povremena
  tendencija, da izbegava va\u0161 pogled, iritira. Poku\u0161ajte jednostavno to
  da prihvatite, shva\u0107aju\u0107i da \u0107e on, ako ostanete na raspolaganju,
  do\u0107i kod vas kad mu se isprazni emocionalno spremi\u0161te. Tada \u0107e biti
  komunikativan i mo\u0107i \u0107e da vas gleda u o\u010di. Za njegovo samopouzdanje
  i psiholo\u0161ki razvoj jako je bitno da zna da ste mu na raspolaganju kad god
  ste mu potrebni.\\n\\nFIZI\u010cKI DODIR\\n\\nKad dete postane adolescent, potrebno
  mu je stalno uveravanje roditelja da je voljeno i prihva\u0107eno. Mnogi roditelji
  su zbunjeni i ne znaju kako da zadovolje tu potrebu.\\n\\nNeki roditelji to poku\u0161avaju
  postaju\u0107i previ\u0161e popustljivi, obezbeduju\u0107i tinejd\u017eerima stvari
  kao \u0161to su kola, najsavremeniji stereo-uredaji ili sportska oprema, da ne bi
  zaostajali za vr\u0161njacima. Ove materijalne stvari mogu da budu dobre same po
  sebi, ali ne mogu biti zamena za ono \u0161to je tinejd\u017eeru najpotrebnije \u2013
  bezuslovnu ljubav. Neki roditelji previ\u0161e dopu\u0161taju svojim tinejd\u017eerima,
  ponekad ih \u010dak i podsti\u010du da idu na mesta i da rade stvari koje nisu zdrave
  za njih. Na primer, znam mnoge roditelje koji su dopu\u0161tali, ili \u010dak ohrabrivali
  tinejd\u017eere da idu na \u017eurke, koje se prave da bi pobudile seksualne \u017eelje,
  i na kojima se slu\u017ee alkoholna pi\u0107a i droge. Malo tinejd\u017eera mo\u017ee
  da odoli isku\u0161enju u tim situacijama, ali ovaj pritisak na omladinu je sve
  ve\u0107i. Veoma mali broj roditelja poma\u017ee svojim tinejd\u017eerima. Za\u0161to?
  Jer su propustili da svojim tinejd\u017eerima ka\u017eu koliko ih vole, prihvataju
  i koliko im je stalo do njih.\\n\\nPrimeren i stalan fizi\u010dki dodir je bitan,
  jer \u0107ete tako ubediti tinejd\u017eera da vam je zaista stalo do njega. Ovo
  je naro\u010dito va\u017eno ako va\u0161 tinejd\u017eer nije raspolo\u017een za
  razgovor, mrzovoljan, \u010dudljiv, ili odbojan. Tada je vrlo te\u0161ko, ili \u010dak
  nemogu\u0107e gledati ga u o\u010di. Me\u0111utim, fizi\u010dki dodir skoro uvek
  mo\u017ee da bude delotvoran. Adolescent retko reaguje negativno na blagi, kratak
  dodir po ramenu, ledima ili ruci. Na primer, pretpostavimo da va\u0161 tinejd\u017eer
  sedi u fotelji i gleda televiziju. Nema ni\u0161ta jednostavnije od toga da ga kratko
  dodirnete po ramenu dok prolazite. Obi\u010dno to ne\u0107e ni primetiti, ali \u0107e
  registrisati u mislima. Tako mu mo\u017eete stalno pokazivati ljubav putem kratkih
  dodira. Povremeno mo\u017eete da ga grlite du\u017ee i intenzivnije.\\n\\n\u010cak
  i kad tinejd\u017eer nije raspolo\u017een za razgovor, mo\u017eete mu iskazati ljubav
  putem fizi\u010dkog dodira. Sve dok je okupiran ne\u010dim drugim, mo\u017eete dugo
  da ga grlite, bez obzira na njegovo raspolo\u017eenje. Na primer, pretpostavimo
  da je va\u0161 tinejd\u017eer u nekom stanju koje vas zabrinjava. Prona\u0107i \u0107ete
  priliku da s njim razgovarate o ne\u010demu \u0161to \u0107e mu odvratiti pa\u017enju
  sa njega samog, o nekoj slici ili fotografiji. Mo\u017eete da iskoristite prednost
  situacije stavljaju\u0107i mu ruku na ruku, rame ili leda. Treba dobro da poznajete
  svog tinejd\u017eera da biste znali kako \u0107e da prihvati fizi\u010dki dodir
  u odre\u0111enom trenutku.\\n\\nNekada \u0107e ga prihvatiti, ali nekada ne\u0107e
  biti svestan da samo toleri\u0161e va\u0161 dodir. U trenucima neprihvatanja, mo\u017eete
  da primenite fizi\u010dki dodir kad je njegova pa\u017enja usmerena negde drugde,
  tako da je nesvestan dodira. \u010cak i kad nije svestan va\u0161eg dodira, on ga
  registruje. Poma\u017ee mu da ose\u0107a slede\u0107e: \u201eMama i tata me vole
  i brinu za mene \u010dak i kad mi je te\u0161ko da pri\u010dam s njima.\u201c\\n\\nPostoje
  i drugi na\u010dini na koje mo\u017eete da obezbedite fizi\u010dki dodir s tinejd\u017eerom.
  Na\u0161 trinaestogodi\u0161nji sin Dejvid \u010desto je istezao mi\u0161i\u0107i
  bave\u0107i se sportom. Nije oklevao da od mene tra\u017ei masazu mi\u0161i\u0107a.
  Bio sam veoma zahvalan, jer mi je to pru\u017ealo divnu priliku da koristim fizi\u010dki
  dodir.\\n\\nNa\u0161a \u010derka Keri je jednom pala na pogre\u0161nu stranu na
  trambolini i bila joj je potrebna masa\u017ea vratnih mi\u0161i\u0107a. To je bila
  jo\u0161 jedan dobra prilika za fizi\u010dki dodir.\\n\\nNa svu sre\u0107u, sva
  na\u0161a deca su volela da ih \u010de\u0161kamo po ledima. Za nas je to bilo pravo
  zadovoljstvo. To je imalo zapanjuju\u0107i efekat na njihove psiholo\u0161ke odbrambene
  mehanizme, i mnogo nam pomagalo pri punjenju njihovih emocionalnih spremi\u0161ta.
  Jednog leta, kad se Dejvid vratio iz letnjeg kampa, \u0161ta mislite \u0161ta je
  prvo tra\u017eio? Tra\u017eio je da ga \u010de\u0161kamo i da mu njegova majka i
  ja \u010ditamo, i da pri\u010damo s njim.\\n\\nIako neki roditelji nerado obezbeduju
  emocionalnu hranu svojim tinejd\u017eerima, naro\u010dito fizi\u010dkim dodirom,
  ja sam veoma zahvalan ve\u0107ini roditelja koji dovoljno vole svoju decu da bi
  im to pru\u017eili. To je tako jednostavno uraditi, a tako je delotvorno.\\n\\nU
  izvesnim situacijama, dobro je grliti i ljubiti svog tinejd\u017eera. Iako ne \u017eelite
  to da radite tako \u010desto, da mu ne bi bilo neprijatno, postoje trenuci u kojima
  je to primereno: kad odlaze ili se vra\u0107aju s puta, ili kad tinejd\u017eer uradi
  ne\u0161to na \u0161to su on ili ona naro\u010dito ponosni \u2013 kad, recimo, dobiju
  neku nagradu. Ili kad dodu k vama duboko povre\u0111eni, kad se kaju ili imaju neki
  drugi problem i izgleda da im je to potrebno. Naravno, postoje trenutci, za koje
  nije potreban neki vidljiv razlog zbog kojega je va\u0161em tinejd\u017eeru jednostavno
  potrebna ne\u017enost. Ako ste u stanju da mu to obezbedite, ima\u0107ete predivne
  trenutke s va\u0161im detetom. Ali, morate budno paziti na takve prilike, jer je
  ponekad te\u0161ko videti da va\u0161 tinejd\u017eer \u017eeli ne\u017enost.\\n\\nMnogo
  puta \u0107e vrlo ve\u0161to nagove\u0161tavati da \u017eeli va\u0161u pa\u017enju
  i ne\u017enost. Mo\u017ee vam pri\u0107i i razgovarati o povr\u0161nim i bezna\u010dajnim
  temama. Obi\u010dno je to klju\u010d. U tom trenutku, mo\u017ee da izgleda duboko
  zainteresovan i ozbiljan, razmatraju\u0107i temu razgovora. Tada je va\u017eno da
  budete strpljivi. Tinejd\u017eer kupuje vreme, dok njegovi odbrambeni mehanizmi
  ne padnu, da bi mogao da razgovara o va\u017enim i zna\u010dajnim stvarima. Budite
  pa\u017eljivi i nemojte da \u017eurite da zavr\u0161ite razgovor. On \u0107e to
  smatrati odbacivanjem i va\u0161 odnos s njim ili s njom mo\u017ee da bude naru\u0161en.
  Ako budete strpljivi i pru\u017eite mu vreme koje mu je potrebno, njegov povr\u0161ni
  razgovor \u0107e vremenom pre\u0107i u ozbiljniji. Morate aktivno da ga slu\u0161tate,
  a to zahteva strpljenje.\\n\\nNa porodi\u010dnim sastancima, jedno od naj\u010de\u0161\u0107e
  postavljanih pitanja je: \u201eKako mogu da nadoknadim mom tinejd\u017eeru, ako
  ga nisam dovoljno gledao u o\u010di ili mu nisam davao dovoljno fizi\u010dkog dodira?\u201c
  To je vrlo dobro pitanje. Ovaki roditelji ne bi trebalo da preteraju i iznenada
  pru\u017eaju velike koli\u010dine fizi\u010dkog dodira i gledanja u o\u010di. Prvo
  treba da otkriju osnovnu nit \u2013 ideju o tome koliko fizi\u010dkog dodira i gledanja
  u o\u010di mo\u017ee da prihvati njihov tinejd\u017eer. Po\u010dinju\u0107i od atle,
  postepeno mogu da pove\u0107avaju taj kontakt u narednim nedeljama ili mesecima.
  \u0160to manje pove\u0107avaju taj kontakt, to bolje, i bi\u0107e prijatnije za
  tinejd\u017eera.\\n\\nNeko je rekao: \u201eHvala Bogu \u0161to je adolescencija
  vremenski ograni\u010dena bolest.\u201c Mi roditelji moramo da izdr\u017eimo to
  razdoblje tegobne i intenzivne promene. \u0160to je bolja na\u0161a samokontrola,
  to vreme bi\u0107e mirnije i manje traumati\u010dno. Na\u0161a deca \u0107e iz tinejd\u017eerskih
  godina iza\u0107i zrelija, i na\u0161 odnos s njima bi\u0107e bolji kad udu u zrelo
  doba.\\n\\nKad smo na raspolaganju na\u0161im tinejd\u017eerima i pru\u017eamo im
  ljubav kad god im je potrebna, pokazujemo na\u010din na koji se Bog pona\u0161a
  prema nama. On je uvek tu da nas hrani i pomogne nam, ako smo zaista pravi \u010dlanovi
  njegove porodice, \u010dak i kad ga odbacujemo. \u201eAko smo neverni, on ostaje
  veran, jer ne mo\u017ee da se odrekle samoga sebe\u201c (Druga poslanica Timoteju
  2:13).\\n\\n6. RODITELJSKA SAMOKONTROLA\\n\\nGospodin i gospoda Oliver su se zbunjeno
  gledali i vrteli glavom. Samo deset minuta pre toga, njihova \u0161esnaestogodi\u0161nja
  \u010derka Ejmi detaljno im je opisivala kako je uspela da dobije \u017eeljeni posao,
  zadiviv\u0161i poslodavca svojom zrelo\u0161\u0107u. Sad je nekontrolisano plakala,
  jer je brat koristio njen \u0161ampon.\\n\\nRoditelji tinejd\u017eera znaju da je
  adolescencija buran period u kome se njihovo dete mo\u017ee izmeniti od dete\u0161\u010deta
  do odrasle osobe, od slatkog do kiselog, od logi\u010dnog do nelogi\u010dnog, i
  vratiti se nazad, a sve u istom danu ili satu. Ove promene mogu da budu intenzivne
  i \u010deste, a suvi\u0161e malo roditelja zna ta\u010dno za\u0161to do njih dolazi.\\n\\nU
  tinejd\u017eerskoj dobi, mla\u0111i ljudi poku\u0161avaju da razre\u0161e sve probleme
  koje su imali u \u017eivotu, naro\u010dito sukobe s roditeljima. Iako nisu svesni
  ove \u017eelje, nagon u njima je toliko jak da ljudima sa strane izgleda kao da
  su se za razre\u0161avanje odlu\u010dili svojevoljno.\\n\\nOsoba u ranoj adolescenciji
  izme\u0111u dvanaeste i petnaeste godine, ima\u0107e zbog toga, \u010deste i neo\u010dekivane
  promene raspolo\u017eenja. U jednom trenutku izgleda\u0107e veoma zrelo, dok \u0107e
  se u drugom pona\u0161ati kao malo dete. Pre nego \u0161to napusti svoje roditelje
  i postane odgovorno nezavisan, tinejd\u017eer mora da ra\u0161\u010disti svoju pro\u0161lost,
  to jest, probleme i sukobe koje je imao s drugim ljudima, naro\u010dito s roditeljima.\\n\\nKad
  je Keri imala trinaest godina, primetio sam da prema meni ima razdra\u017eljiv i
  donekle odbojan stav. Pitao sam je: \u201eMolim te, reci mi, da li sam ja uradio
  ne\u0161to \u0161to te je uznemirilo ili povredilo?\u201c Bez oklevanja spomenula
  je doga\u0111aj koji se zbio \u0161est godina ranije! Vozili smo se u na\u0161em
  karavanu, \u017eena i ja smo sedeli napred, ostala deca na srednjem sedi\u0161tu,
  a Keri s prijateljicom pozadi. Sva deca su se gadala kokicama. Po\u0161to mi je
  to smetalo, viknuo sam na njih da prestanu. Keri je povikala da sam je doveo u neprikladu
  \u201evi\u010du\u0107i na njenu prijateljicu\u201c. Da, setio sam se toga, ali nisam
  znao da je to tako sna\u017eno uticalo na nju.\\n\\nU tom trenutku, Keri se psiholo\u0161ki
  vratila u to vreme da bi razre\u0161ila odre\u0111eni sukob. Po\u0161to mi je to
  ispri\u010dala (a primetio sam i gnev u njenom glasu), rekao sam joj da stvarno
  nisam shvatao kakav bol i sramotu sam joj nano\u010de. Izvinio sam joj se i zamolio
  je da mi oprosti, a ona je ponovo postala trinaestogodi\u0161nja devoj\u010dica.\\n\\nOvo
  vra\u0107anje unazad i napredovanje u psiholo\u0161koj zrelosti, je razlog zbog
  kog su tinejd\u017eeri tako nepredvidivi i ponekad ih je te\u0161ko razumeti. Roditelji
  treba da reaguju u skladu s godinama koje oni tada pokazuju. Na primer, recimo da
  vam do\u0111e va\u0161 mla\u0111i adolescent s prili\u010dno sofisticiranim stavom,
  kao \u0161to je: \u201eTata, \u0161ta misli\u0161 o krizi na Bliskom istoku? Pitam
  se da li bi prognane palestinske porodice trebalo vratiti njihovim ku\u0107ama,
  i dozvoliti im da budu normalan deo izraelske nacije.\u201c Kad progutate knedlu,
  mo\u0107i \u0107ete da razgovarate s njim na tom nivou i da razmatrate temu.\\n\\nMe\u0111utim,
  posle pola sata, isti tinejd\u017eer mo\u017ee da ispolji bes jednog dvogodi\u0161njaka.
  \u0160ta da uradite? Tako je! Pona\u0161ajte se prema njemu kao prema dvogodi\u0161njaku
  koji je besan. Kao \u0161to vidite, morate biti spremni da brzo menjate nivo komuniciranja.
  Evo zbog \u010dega dobar, mla\u0111i terapeut, koji u toku dana razgovara s nekoliko
  mladih adolescenata, mo\u017ee da bude iscrpljen na kraju dana.\\n\\nJako je va\u017eno
  da vi kao roditelj sa\u010duvate emocionalnu samokontrolu. Preterano emocionalno
  reagovanje poremeti\u0107e va\u0161 odnos s tinejd\u017eerom na nekoliko na\u010dina.\\n\\n-
  Prekomerni i nekontrolisani gnev ometa\u010de va\u0161eg tinejd\u017eera u nameri
  da do\u0111e k vama kad mu se isprazni emocionalno spremi\u0161te.\\n\\n\u2022 Preterano
  emocionalno reagovanje izazva\u0107e kod va\u0161eg tinejd\u017eera nedostatak po\u0161tovanja
  prema vama \u2013 prili\u010dno normalna reakcija prema nekomu ko nema dovoljno
  samokontrole.\\n\\n\u2022 Ako izgubite pribranost, va\u0161 tinejd\u017eer \u0107e
  potpasti pod uticaj drugih, a naro\u010dito vr\u0161njaka.\\n\\n**KAKO DA SA\u010cUVAMO
  SAMOKONTROLU?**\\n\\nKako odr\u017eavate va\u0161e emocionalno stanje? Kako \u010duvate
  samokontrolu? Naj\u010de\u0161\u0107i problemi koji negativno uti\u010du na sposobnost
  odraslih da kontroli\u0161u gnev su depresija, umor i teskoba. Mnogi ljudi ne shvataju
  da je spre\u010davanje depresije blisko povezano s time koliko vremena provode s
  drugim ludima, a koliko sami. Drugim re\u010dima, radi se o vremenskoj ravnote\u017ei.
  Svaka osoba u pogledu ovoga, ima druga\u010dije potrebe. Nekima je vi\u0161e potrebno
  da budu s drugima, dok drugi vi\u0161e vremena provode sami. Na\u017ealost, ne mogu
  da se setim osobe koja je bila svesna ove \u010dinjenice. Mnogi prate slede\u0107i
  obrazac: provode sve vi\u0161e vremena s drugima, dok ih to ne zasiti. Postaju skloni
  depresiji jer su emocionalno iscrpljeni i umorni od prekomernog dru\u017eenja. Zbog
  depresije mnogi ljudi se povla\u010de u sebe i postaju usamljeni. Zbog toga, i zbog
  umora nastalog od dru\u017eenja s ljudima, previ\u0161e vremena provode sami. Ali,
  kada su usamljeni, \u010deznu da budu s drugima, tra\u017ee ih i krug se nastavlja.
  To je jedan od razloga zbog kojeg malo ljudi ima uravnote\u017een \u017eivot.\\n\\nNaravno,
  neki nesre\u010dni ljudi nemaju dovoljno kontrole nad svojim \u017eivotima da bi
  postigli ovu uravnote\u017eenost. Mo\u017eda su prisiljeni da provode previ\u0161e
  vremena s drugima, jer nemaju svoju privatnost. Drugi provode previ\u0161e vremena
  sami, jer su stari, ili ne mogu da se vidaju s prijateljima. U svakom slu\u010daju,
  depresija je prisutna.\\n\\nZbog va\u0161eg li\u010dnog mentalnog zdravlja i zdravlja
  va\u0161eg tinejd\u017eera, morate da odredite koliko \u0107ete vremena provoditi
  sami, a koliko s drugima. Svaka osoba ima druga\u010dije potrebe, i od va\u0161eg
  zdravog razuma zavisi kako \u0107ete menjati to vreme pod odre\u0111enim uslovima.\\n\\nKvalitet
  vremena je tako\u0111e veoma va\u017ean, naro\u010dito onog koje provodimo sami,
  i koje treba da bude emocionalno osve\u017eavaju\u0107e. To mo\u017ee da bude \u010ditanje
  dobre knjige, pe\u0161a\u010denje, \u0161etanje, ve\u017ebanje, molitva ili razmi\u0161ljanje.
  Gledanje televizije retko zadovoljava potrebe. U stvari, izgleda da televizija mnoge
  ljude samo jo\u0161 vi\u0161e emocionalno iscrpljuje.\\n\\nEmocionalna stabilnost
  i samokontrola ne dolaze same od sebe. Morate da se pripremite za hvatanje u ko\u0161ta\u010d
  s emocionalnim pritiskom i frustracijom. Normalan tinejd\u017eer \u0107e izazvati
  oba stanja. Da biste sa\u010duvali zdrav odnos i otvorenu komunikaciju s tinejd\u017eerom,
  morate da kontroli\u0161ete naro\u010dito svoj gnev. Preterano emocionalno reagovanje
  je \u0161tetno, naro\u010dito ako se de\u0161ava \u010desto i ako se emocije stalno
  potiskuju. Svi ponekad reagujemo preterano, ali ako to ne radimo \u010desto, mogu\u0107e
  je da to izazove pre pozitivnu nego negativnu situaciju. Mo\u017eemo da se izvinimo
  sinu ili \u010derki zbog takvog reagovanja i tra\u017eimo opro\u0161taj: \u201eIzvini,
  \u017eao mi je \u0161to sam ju\u010de tako reagoval i vikao. Ono \u0161to si uradila
  bilo je pogre\u0161no, ali nije trebalo da reagujem na taj na\u010din. Ho\u010de\u0161
  li da mi oprosti\u0161?\u201c Ovakav pristup ne samo da spre\u010dava mnoge neugodnosti,
  ve\u0107 i ja\u010da i uskladuje odnos s tinejd\u017eerom. Me\u0111utim, ako pre\u010desto
  reagujete preterano ili idete u krajnosti, jednostavno izvinjavanje i tra\u017eenje
  opro\u0161taja ne\u0107e imati svrhe; tinejd\u017eer mo\u017ee \u010dak da stekne
  lo\u0161ije mi\u0161ljenje o vama.\\n\\n\u0160to ste prijatniji prema tinejd\u017eeru,
  mo\u017eete biti odlu\u010dniji u postavljanju granica i disciplinovanju. I obrnuto,
  \u0161to ste manje prijatni prema njemu ili njoj, ima\u0107ete manji autoritet.
  Za\u0161to? Pre svega, kao \u0161to smo ve\u0107 rekli, \u0161to ste neprijatniji,
  tinejd\u017eer \u0107e vas manje po\u0161tovati, i te\u017ei\u0107e da radi suprotno
  od onoga \u0161to od njega tra\u017eite. Drugo, \u0161to ste neprijatniji, gubite
  roditeljski autoritet, pokazuju\u0107i gnev i razo\u010daranje. \u0160to ste prijatniji,
  ima\u0107ete vi\u0161e autoriteta da kontroli\u0161ete njegovo pona\u0161anje. A
  to je ono \u0161to \u017eelite, kontrolu pona\u0161anja! Kako da o\u010dekujete
  dob\u0440\u0443 samokontrolu va\u0161eg tinejd\u017eera, ako je vi sami nemate?
  Energija, priprema, samodisciplina i\\n\\nsamokontrola su vam potrebni ako \u017eelite
  da budete prijatni usred neprijatnih, ali normalnih tinejd\u017eerskih te\u017enji.\\n\\nAko
  nemate zdrav duhovni \u017eivot, bi\u0107e vam te\u0161ko da kontroli\u0161ete gnev.
  Nezdrav duhovni \u017eivot mo\u017ee da izazove depresiju i teskobu. Tako\u0111e
  mo\u017ee i da uti\u010de na va\u0161e misli, tako da donesete pogre\u0161nu odluku
  ili zaklju\u010dak \u2013 uklju\u010duju\u0107i va\u0161e ideje koje se odnose na
  motive drugih ljudi. Bilo koji od ovih problema mo\u017ee da dovede do gubitka duhovne
  perspektive, i mo\u017ee vas spre\u010diti u kontrolisanju gneva.\\n\\nMislim da
  je zdrav duhovni \u017eivot onaj u kome postoji otvorena komunikacija izme\u0111u
  vas i Boga. Kako se to posti\u017ee? Prvo, morate se uveriti da vam je srce \u010disto,
  tra\u017ee\u0107i od Boga da ispita va\u0161e srce i osudi vas za bilo \u0161ta
  lo\u0161e \u0161to u njemu pronade. Zatim, priznajte gre\u0161ke, tra\u017eite opro\u0161taj
  i o\u010di\u0161\u0107enje, i dobicete ih. Ovo pro\u010di\u0161\u0107ava komunikaciju
  izme\u0111u vas i Boga. Tek tada ste spremni da mu pride\u0107ete i da on pride
  vama. Tada Bog mo\u017ee da vam napuni emocionalno i duhovno spremi\u0161te. On
  to radi tako \u0161to je s vama, slu\u0161a vas, vodi vas, te\u0161i vas i pomo\u0107u
  svojih obe\u0107anja uverava vas u svoju ljubav.\\n\\nPotrebno je vreme da biste
  stvarno upoznali Boga i da bi on zadovoljio va\u0161e potrebe i pripremio vas za
  roditeljske odgovornosti.\\n\\nMislim da je vrlo te\u0161ko bez ometanja provoditi
  vreme s Bogom. Moje vreme za emocionalno i duhovno osve\u017eenje s Nebeskim Ocem
  je obi\u010dno kad su sva deca u krevetu, izme\u0111u devet i pola deset no\u0107u.
  Da bih izbegao ometanja, obi\u010dno bih pro\u0161etao ili samo sedeo napolju, ako
  bi mi vreme dozvoljavalo, ili bio u tijeho sobi. Obi\u010dno mi je potrebno da provedem
  u samo\u0107i izme\u0111u deset i dvadeset minuta, da bih se ose\u0107ao bli\u017ee
  Bogu, i da se smirim posle uzbudljivog dana. Bog nigde ne \u017euri. On je miran,
  i govori tihim glasom.\\n\\nNa va\u0161u sposobnost kontrolisanja gneva uti\u0107u
  mnoge stvari, od kojih mnoge nemaju ba\u0161 nikakve veze s va\u0161im tinejd\u017eerom.
  Jedna od njih je fizi\u010dka kondicija. Da li jedete hranu koja \u0107e vam pomo\u0107i
  da se ose\u0107ate dobro? Vidao sam ljude koji su verovali da su njihove dijete
  zdrave, a u stvari nisu bile. Mnogi smatraju doru\u010dak najva\u017enijim obrokom
  u toku dana. Ono \u0161to pojedete za doru\u010dak, U velikoj meri odre\u0111uje
  kako \u0107ete se ose\u0107ati tokom celog dana. Mnogi ljudi za doru\u010dak uzimaju
  previ\u0161e ugljenih hidrata, a premalo proteina. To izaziva nedostatak energije,
  i podsti\u010de ljude da tra\u017ee stimulanse kao \u0161to su kafa ili gazirana
  pi\u0107a (mnoga gazirana pi\u0107a imaju sadr\u017ee kofein). Kofein razli\u010dito
  deluje na ljude, ali ne poma\u017ee emocionalnoj stabilnosti i mirno\u0107i koja
  vam je potrebna s va\u0161im tinejd\u017eerom. Zbog toga, zdrav doru\u010dak s malo
  ugljenih hidrata i mnogo proteina, i izbegavanje kofeina dobar je po\u010detak za
  postizanje samokontrole.\\n\\nMnogi ljudi misle da sebi \u010dine uslugu ako presko\u010de
  doru\u010dak, ili \u010dak ru\u010dak. Preskakanje obroka ne poma\u017ee smanjenju
  telesne te\u017eine, niti poma\u017ee da se ose\u0107amo bolje. Bitno je da za ru\u010dak
  ne jedemo previ\u0161e ugljenih hidrata i da izbegavamo kofein. Premalo uno\u0161enja
  ugljenih hidrata oslabi\u0107e energiju. Kofein \u0107e pove\u0107ati razdra\u017eljivost.
  Zadivljuju\u0107e je koliko se bolje ose\u0107am ako izmedu ru\u010dka i ve\u010dere
  pojedem zelenu salatu, umesto sendvi\u010da ili hamburgera.\\n\\nMnogi ljudi preterano
  mnogo jedu za ve\u010deru. Ovo je jedan od razloga zbog kog su zdrav doru\u010dak
  i ru\u010dak jako va\u017eni. Ako ste uneli previ\u0161e ugljenih hidrata, ili ste
  presko\u010dili doru\u010dak ili ru\u010dak, ne\u0107ete mo\u0107i kasnije u toku
  dana da kontroli\u0161ete unos hrane, naro\u010dito ako ste depresivni ili upla\u0161eni.
  I, naravno, ako jedete nekontrolisano u to vreme, ne\u0107ete se najbolje ose\u0107ati
  tokom ve\u010deri.\\n\\nU spre\u010davanju depresije zna\u010dajnu ulogu imaju redovne
  ve\u017ebe, dobra dijeta, rekreacija i odr\u017eavanje zdravog duhovnog \u017eivota.
  Na\u017ealost, ne mo\u017ee se spre\u010diti svaka depresija. Mnogi ljudi su biohemijski
  ili nasledno skloni depresiji. Ako je osoba u\u010dinila sve \u0161to je u njoj
  mo\u0107i da bi spre\u010dila depresiju, a i dalje je depresivna, treba da potrazi
  pomo\u0107 \u2013 ne samo zbog sebe, ve\u0107 i zbog svoje\\n\\nporodice. Umereno
  do sna\u017eno depresivni roditelji ne mogu da omogu\u0107e normalnom tinejd\u017eeru
  da se ose\u0107a dobro. Odnos izme\u0111u roditelja i tinejd\u017eera bi\u0107e
  ugro\u017een, kao i sam tinejd\u017eer.\\n\\n**LJUTITI OTAC**\\n\\nBob je bio sedamnaestogodi\u0161nji
  de\u010dak, koji je kod mene bio zbog uzimanja droge, lo\u0161ih ocena i prkosnog
  stava. Kada smo ostali sami, bio je miran, u\u010ditiv de\u010dak, s kojim je bilo
  izuzetno lako razgovarati. Osetio sam da govori istinu kad je rekao da mu se ne
  svi\u0111a njegovo pona\u0161anje i da \u017eeli da ga promeni. Rekao je da je ve\u0107
  poku\u0161ao da promeni svoje pona\u0161anje, ali posle svakodnevnih sukoba i svada
  s ocem, postajao je toliko ljut da je jedino mogao opet da radi one stvari koje
  se nisu svidale njegovom ocu (a ni Bobu). Naravno, \u017eeleo sam da proverim da
  li je to ta\u010dno, pa sam pozvao njegove roditelje da nam se pridru\u017ee.\\n\\nBobov
  otac je bio izuzetno ljutit \u010dovek. Odmah je grubo i neprijateljski prokomentarisao
  Bobovo \u201eu\u017easno i neprihvatljivo pona\u0161anje\u201c. Njegov gnev i surovost
  su se nastavili, pa \u010dak i pove\u0107ali. Bob nije reagovao, ali duboki, bolni
  gnev je o\u010digledno izvirao iz njega. Kona\u010dno je Bobova majka poku\u0161ala
  da ubla\u017ei stvar, govore\u0107i ocu da se Bob u poslednje vreme dobro pona\u0161ao
  i da ona ne razume za\u0161to je on toliko ljut. Takode sam primetio da to pona\u0161anje
  na koje se \u017ealio otac, nije moglo da opravda tako \u017eestoku osudu. Ota\u010d
  je ignorisao maj\u010dine molbe i Bobovo pona\u0161anje koristio kao izgovor za
  osloba\u0111anje svog prekomernog gneva. Kad sam nasamo razgovarao s ocem, shvatio
  sam koji je pravi razlog njegove frustracije. Imao je ozbiljne probleme na poslu,
  bio je izuzetno depresivan, nije mogao dobro da spava, slabo je jelo, brzo se umarao
  i ose\u0107ao se kao da nije vredan \u017eivljenja. Bob je bio jedino \u201ebezbedno
  mesto\u201c na kome je mogao da da odu\u0161ka svojoj bedi. Ne znam ko me je vi\u0161e
  dirnuo \u2013 Bob, majka ili otac.\\n\\nVrlo \u010desto se de\u0161ava da roditelji
  istresaju svoj potisnuti gnev na tinejd\u017eere. Tinejd\u017eeri \u010desto poku\u0161avaju
  da vr\u0161e pritisak na nas, \u010dine nas napetim, zabrinutim i ljutim. Zbog toga
  nam ponekad izgleda pravedno da na njih svalimo na\u0161 nakupljeni gnev. To je
  veoma opasno! Prekomerni gnev je neprijatelj roditelja koji poku\u0161avaju da ostvare
  dobar odnos s tinejd\u017eerima. Ni\u0161ta ne prekida komunikaciju izme\u0111u
  njih kao slab\u043e kontrolisani gnev.\\n\\nMnogi roditelji pretpostavljaju da njihovim
  tinejd\u017eerima vi\u0161e nije potrebno onoliko ljubavi i ne\u017enosti kao kad
  su bili mali. To prosto nije istina. Tinejd\u017eerima je potrebna ljubav, ne\u017enost,
  pouzdanje i briga kao nikad do tada, iako se oni, te\u017ee\u0107i nezavisnosti,
  ponekad pona\u0161aju kao da im to nije potrebno.\\n\\nTakvu gre\u0161ku sam napravio
  s Keri. Otpriklike u isto vreme napunila je osamnaest godina i zavr\u0161ila srednju
  \u0161kolu. U mojim mislima nesvesno sam je smatrao odras\u043b\u043e\u043c, nezavisnom
  osobom. Na svu sre\u0107u, moja \u017eena Pet je to primetila. Nisam joj poklanjao
  toliko ljubavi i brige kao ranije; ovo ju je povredivalo jer je mislila da je uradila
  ne\u0161to lo\u0161e. Bogu hvala pa mi je Pet ukazala na to, i ja sam se ponovo
  prema njoj odnosio kao prema \u010derki \u2013 kao prema detetu.\\n\\nMi zapravo
  nikada ne prerastemo potrebu da budemo voljeni. Ove potrebe mogu postepeno da preuzmu
  drugi ljudi u na\u0161im \u017eivotima. Ali, dok na\u0161a deca zavise od nas, mi
  roditelji moramo im uvek biti na raspolaganju, spremni da ih volimo i brinemo o
  njima kad god im je to potrebno, naro\u010dito u toku tinejd\u017eerskih godina.\\n\\n7.
  TINEJD\u017dERSKI GNEV\\n\\nMnogi roditelji prepostavljaju da je tinejd\u017eerski
  gnev lo\u0161 ili nenormalan, i da ga treba ugu\u0161iti i ne dozvoljavati. Ovo
  je stra\u0161na gre\u0161ka. Svetlo pismo nas u\u010di \u201eda u\u010dimo dete
  prema putu kojim \u0107e i\u0107i\u201c, da ga obrazujemo \u201eu skladu sa \u017eivotnim
  zahtevima\u201c (Pri\u010de Solomonove 22:6). Najva\u017enija oblast u kojoj je
  tinejd\u017eeru potrebno usmeravanje je kontrolisanje gneva.\\n\\nOse\u0107anje
  gneva samo po sebi nije ni dobro ni lo\u0161e. Gnev je normalan i svako \u017eivo
  bi\u0107e ga ose\u0107a. Problem nije sam gnev, ve\u0107 upravljanje gnevom, i u
  tome mnogi gre\u0161e. Mislim da je potrebno shvatiti da postoje razli\u010diti
  na\u010dini upravljanja gnevom i znati koji je najbolji.\\n\\nPASIVNO-AGRESIVNO
  PONA\u0160ANJE\\n\\nPo\u010dnimo od ne\u010dega \u0161to smatram najgorim mogu\u0107im
  na\u010dinom izla\u017eenja na kraj s gnevom, a to je pasivno-agresivno pona\u0161anje.
  Ovo je stru\u010dni naziv i treba da ga dodate va\u0161em re\u010dniku. Pasivno-agresivno
  (PA) pona\u0161anje je suprotno od otvorenog, iskrenog, direktnog i verbalnog izra\u017eavanja
  gneva. Pasivno-agresivno pona\u0161anje je ispoljavanje gneva koji se indirektno
  vra\u0107a toj osobi. Blagi primjeri za ovo su odugovla\u010denje, tra\u010denje
  vremena, tvrdoglavost, namerna neefikasnost i \u201ezaboravnost\u201c. Podsvesna
  svrha pasivno-agresivnog pona\u0161anja jeste da uznemiri roditelje ili da ih naljuti.
  Pasivno-agresivno pona\u0161anje je odbijanje preuzimanja odgovornosti za vlastito
  pona\u0161anje.\\n\\nPasivno-agresivne tehnike dr\u017eanja gneva pod kontrolom
  su indirektne, lukave, samoodbrambene i \u0161tetne. Na\u017ealost, pasivno-agresivno
  pona\u0161anje je podsvesno motivisano; to jest, dete nije svesno da koristi ovo
  odbojno pona\u0161anje da bi se oslobodilo nagomilanog gneva i uznemirilo roditelje.\\n\\nPasivno-agresivno
  pona\u0161anje izaziva mnoge probleme, od slabih ocena do droge ili samoubistva.
  Me\u0111utim, iako postoje i drugi uzro\u010dnici adolescentskih problema, va\u017eno
  je jasno prepoznati PA pona\u0161anje kada se pojavi. Prema njemu se obi\u010dno
  postupa potpuno druga\u010dije nego prema ostalim vrstama tinejd\u017eerskog lo\u0161eg
  vladanja.\\n\\nPre svega, \u010dinjenica da je pasivno-agresivno pona\u0161anje
  iracionalno \u2013 ne zvu\u010di ba\u0161 logi\u010dno. Dobar primer za ovo je student
  koji mo\u017ee da ima dobre ocene, \u017eeli da ih ima, poku\u0161ava da ih dobije,
  ali ne uspeva u tome. Nema nikakve logike.\\n\\nDrugo, odre\u0111eno pona\u0161anje
  mo\u017eete da ozna\u010dite kao pasivno-agresivno, kad ne deluje ni\u0161ta, ma
  \u0161ta uradila osoba od autoriteta. Ovo je zbog toga \u0161to je osnovni, podsvesni
  motiv da se uzinemire roditelji ili druge osobe od autoriteta. U primeru sa studentom
  koji bi trebalo da ima dobre ocene, ali ih nema, bilo \u0161to rade roditelji ili
  profesori, ne deluje; menjanje nastavnog plana ili \u010dak i profesora ne rezultira
  boljim ocenama. Po\u0161to je pravi motiv uznemiravanje roditelja ili profesora,
  student \u0107e se podsvesno potruditi da, bez obzira na sve, ni\u0161ta ne deluje.\\n\\nVeoma
  je va\u017eno utvrditi pasivno-agresivno pona\u0161anje. Na primer, PA student koji
  mo\u017ee da ima dobre ocene, ali ih nema, uti\u010de na svoju vlastitu budu\u0107nost.
  Ako tinejd\u017eer ne nau\u010di zrelo da upravlja gnevom i ne preraste PA stadijum
  do \u0161esnaeste ili sedamnaeste godine, ove PA osobine \u0107e se pogor\u0161ati
  i ostati trajne. On ili ona \u0107e koristiti PA pona\u0161anje protiv budu\u0107ih
  predava\u010da, poslodavaca, supru\u017enika, dece i ostalih. To mo\u017ee da dovede
  do problema s kojima osoba mora da iza\u0111e na kraj i mo\u017ee da rezultira beskona\u010dnom
  bedom za one koji imaju veze s njim ili s njom.\\n\\nVeoma mali broj ljudi pravilno
  kontroli\u0161e gnev, a mnogi od nas se prema gnevu pona\u0161aju s istom zrelo\u0161\u0107u
  s kojom smo se pona\u0161ali u periodu adolescencije i zbog toga imamo vlastite
  PA\\n\\nosobine kojih, uglavnom, nismo svesni. Dobro bi nam do\u0161la pomo\u0107
  u ovoj oblasti, zar ne? Pitajte va\u0161eg supru\u017enika ili najboljeg prijatelja.\\n\\nJedan
  od najranijih na\u010dina na koji dete mo\u017ee da ispolji pasivno-agresivne tendencije
  je mokrenje u ga\u0107ice, nakon \u0161to je nau\u010dilo da koristi toalet. U mnogim
  takvim slu\u010dajevima roditelji zabranjuju detetu da ispoljava gnev, naro\u010dito
  verbalno. Zatim, ako roditelji preteraju i postanu izuzetno ljuti, ili ga \u010dak
  kazne svaki put kad otvoreno ispolji gnev, \u0161ta dete mo\u017ee da uradi sa svojim
  gnevom?\\n\\nU ovakvoj situaciji ono mo\u017ee da koristi pasivno-agresivno pona\u0161anje
  da v\u0440\u0430\u0442\u0438 roditeljima na na\u010din koji \u0107e ih uznemiriti,
  kao \u0161to je vr\u0161enje nu\u017ede u ga\u0107ice \u2013 vrlo delotvoran, ali
  nezdrav na\u010din ispoljavanja gneva. U takvoj situaciji roditelji mogu jako malo
  da urade. Zbog toga \u0161to odbijaju da dozvole detetu da ispolji gnev otvoreno
  i direktno, dete je primorano da koristi indirektni, \u0161tetni na\u010din ispoljavanja
  gneva, a sami roditelji su saterani u \u010do\u0161ak. \u0160to vi\u0161e ga ka\u017enjavaju,
  ono \u0107e sve \u010de\u0161\u0107e da vr\u0161i nu\u017edu u ga\u0107ice. Za\u0161to?
  Jer je podsvesna svrha pasivno-agresivnog pona\u0161anja uzinemiravanje roditelja.
  Kakva dilema! Nek se Bog smiluje tim roditeljima i toj deci.\\n\\nMnoga starija
  deca koja koriste pasivno-agresivne na\u010dine ispoljavanja gneva veoma su lo\u0161a
  u \u0161koli. Njihov stav je: \u201eMo\u017ee\u0161 dovesti konja do vode, ali ga
  ne mo\u017ee\u0161 naterati da pije. Mo\u017ee\u0161 me naterati da idem u \u0161kolu,
  ali me ne mo\u017ee\u0161 naterati da imam dobre ocene.\u201c De\u010diji gnev je
  van kontrole, i roditelji su potpuno bespomo\u0107ni. \u0160to su roditelji uzrujaniji
  \u2013 \u0161to i jeste podsvesna svrha svega ovoga \u2013 situacija postaje sve
  gora.\\n\\nVa\u017eno je znati da pasivno-agresivno dete ne radi svesno ili namerno
  ove stvari. One su deo nesvesnog procesa u koji su ga uvukli njegovi roditelji.\\n\\nPasivno-agresivno
  pona\u0161anje kod mlade dece je veoma lo\u0161e, a pasivno-agresivno pona\u0161anje
  kod tinejd\u017eera mo\u017ee biti totalno katastrofalno. Vidao sam kako je ovaj
  nezdravi na\u010din kontrolisanja gneva \u010dinio da tinejd\u017eeri idu do kraja
  skale \u2013 od padanja na ispitima do uzimanja droge, ostajanja u drugom stanju,
  \u010dinjenja zlo\u010dina i poku\u0161aja samoubistva. Naravno, postoje i drugi
  uzroci za ovu vrstu pona\u0161anja. Me\u0111utim, pasivno-agresivne sklonosti su
  najozbiljniji uzrok i sve su \u010de\u0161\u0107e me\u0111u tinejd\u017eerima.\\n\\nVidao
  sam mnoge tinejd\u017eere koji imaju lo\u0161e ocene jer su im roditelji nepristupa\u010dni,
  ili zbog preteranog emocionalnog reagovanja, ili zbog netolerancije i nedozvoljavanja
  tinejd\u017eerima da izraze negativna ili neprijatna ose\u0107anja. Vidao sam tinejd\u017eere
  koji su kr\u0161ili roditeljska pravila, dolaze\u0107i kasno, ne zbog normalne te\u017enje
  ka nezavisnosti, ve\u0107 da bi uznemirili roditelje i indirektno izrazili gnev.
  Vidao sam devojke koje su ostajale u drugom stanju da bi ispoljile gnev prema roditeljima,
  jer im nikad nisu dozvoljavali da izraze neprijatna ose\u0107anja, naro\u010dito
  gnev. Vidao sam tinejd\u017eere koji su razvili nedru\u0161tveni stav i stav usmeren
  protiv autoriteta, samo da bi izrazili gnev.\\n\\nMnogo slo\u017eenije, vidoa sam
  i tinejd\u017eere koji su potisnuti gnev oslobadali i usmeravali ga k sebi samima
  i izazivali psihosomatske probleme kao \u0161to su glavobolja, \u010direvi i ko\u017eni
  problemi. I \u0161to je najtragi\u010dnije, vidoa sam tinejd\u017eere s toliko ukorenjenim
  pasivno-agresivnim pona\u0161anjem da im je ono postalo osnovni na\u010din kontrolisanja
  situacija izazvanih gnevom, toliko da su \u010dak bili spremni da izvr\u0161e samoubistvo,
  kao na\u010din da ispolje gnev.\\n\\nJednom sam video \u0161esnaestogodi\u0161nju
  devojku, \u010diji su roditelji pogre\u0161no mislili da je pravilno vaspitavaju,
  tako \u0161to su joj zabranjivali da ispoljava bilo kakva neprijatna ose\u0107anja,
  naro\u010dito gnev. Mislili su da \u0107e je nau\u010diti da bude sre\u010dna osoba
  ako je budu u\u010dili da ispoljava samo prijatna ose\u0107anja. Nau\u010dila je
  da izbegava otvoreno izra\u017eavanje gneva kao izvora razo\u010daranosti; obi\u010dno
  bi ispoljavala gnev na na\u010din koji bi posredno povredio osobu koja je izazvala
  taj gnev. To joj je pre\u0161lo u naviku i njeno pona\u0161anje se jedino moglo
  razumeti ako se uzme u obzir da je htela posredno da nekog\\n\\npovredi. \u0160esti
  poku\u0161aj samoubistva je kona\u010dno naterao da potra\u017ei pomo\u0107. Svaki
  poku\u0161aj je planirala tako da bi se odre\u0111ena osoba ose\u010dala krivom,
  uzbudenom i povredenom. Prvih pet poku\u0161aja bili su neodlu\u010dni i nisu predstavljali
  ozbiljniju pretnju po njen \u017eivot. Me\u0111utim, \u0161esti je doveo do toga
  da je pala u komu i nekoliko dana se borila za \u017eivot. Kada sam razgovarao s
  njom po\u0161to se oporavila, video sam da je definitivno zbumjena svojim pona\u0161anjem.
  Nije shvatala da je njeno pona\u0161anje posledica obrasca koji se u njoj formirao
  tokom dugog vremenskog perioda, po kome ona gnev ispoljava na nezdrav, samoodbrambeni,
  destruktivni, posredni i poreme\u0107eni na\u010din.\\n\\nPasivno-agresivno pona\u0161anje
  je \u010desta pojava. Za\u0161to? Zato \u0161to ve\u0107ina ljudi ne razume gnev
  ili ne znaju \u0161ta da rade s njim. Ose\u0107aju da je gnev nekako pogre\u0161an
  ili gre\u0161an i misle da ga disciplinom mogu \u201eizbaciti\u201c iz deteta. Ovo
  je ozbiljna gre\u0161ka, jer je normalno ose\u010dati gnev, i svi su ga osetili
  jo\u0161 od Adama i Eve. Kada je va\u0161 tinejd\u017eer ljut i vi viknete na njega:
  \u201ePrestani da se tako izra\u017eava\u0161. Ne\u0107u ti to dozvoliti!\u201c,
  \u0161ta on mo\u017ee da uradi? Samo dve stvari \u2013 mo\u017ee biti neposlu\u0161an
  i nastaviti da se \u201etako izra\u017eava\u201c, ili vas poslu\u0161ati i \u201eprestati
  da se tako izra\u017eava\u201c. Ako izabere drugi na\u010din i prestane da ispoljava
  svoj gnev, gnev ne\u0107e nestati. On \u0107e ga jednostavno potisnuti u podsvest,
  gde \u0107e ostati nere\u0161en, \u010dekaju\u0107i da kasnije bude ispoljen putem
  neprimerenog i/ili pasivno-agresivnog pona\u0161anja.\\n\\nDruga gre\u0161ka koju
  prave neki roditelji, a odnosi se na ispoljavanje gneva, je neprimerena upotreba
  humora. Kad god situacija postane napeta, naro\u010dito kad je neko ljut, mnogi
  roditelji koriste humor da bi smanjili napetost. Naravno, humor je dragocen za svaku
  porodicu. Ali, ako se stalno koristi da bi se izbeglo primereno ophodenje prema
  gnevu, tinejd\u017eeri jednostavno ne mogu da nau\u010de kako da se pravilno nose
  s gnevom.\\n\\nJednom sam posetio dom u kom je otac imao neobi\u010dan smisao za
  humor. Kad god bi \u017eena ili jedan od tinejd\u017eera ispoljili neprijatno ose\u0107anje,
  on bi izjavljivao ne\u0161to sme\u0161no. Zbog toga nijedan tinejd\u017eer iz te
  porodice nije mogao da se nosi s gnevom i pribegavao je pasivno-agresivnom na\u010dinu
  posrednog izra\u017eavanja gneva. Kad god bi de\u010dak bio razo\u010daran ili u
  situaciji izazvanoj gnevom, imao bi jake glavobolje. Devoj\u010dica je posredno
  ispoljavala svoj gnev tako \u0161to je dob\u0440\u043e\u0432oljno pomagala majci
  u ku\u0107nim poslovima, ali je to radila toliko lo\u0161e da je majka \u010desto
  radila vi\u0161e nego \u0161to bi radila da joj ona nije pomagala.\\n\\nPasivno-agresivno
  pona\u0161anje lako postaje ukorenjeni, uobi\u010dajeni obrazac koji mo\u017ee da
  traje celog \u017eivota. Ako tinejd\u017eer izbegava iskreno i otvoreno ophodenje
  s gnevom na primeren na\u010din, mo\u017ee da koristi pasivno-agresivne tehnike
  u svim odnosima u \u017eivotu. Ovo kasnije mo\u017ee da uti\u010de na njegov odnos
  sa supru\u017enikom, decom, kolegama i prijateljima. Kakva tragedija! Ve\u0107ina
  ovih nesre\u0107nih ljudi nije u potpunosti svesna svojih samoodbrambenih obrazaca
  pona\u0161anja niti svojih problema u ophodenju s gnevom.\\n\\nJedan od naj\u010de\u0161\u0107ih
  i najopasnijih tipova pasivno-agresivnog pona\u0161anja vida se u voza\u010dkim
  navikama. Da li ste nekad primetili kako neki ljudi ubrzaju kad poku\u0161ate da
  ih obidete? Ili voza\u010da na autoputu koji vas obide i tada naglo skrene ispred
  vas, primoravaju\u0107i vas da ko\u010dite da ga ne biste udarili? Ovo mogu biti
  najo\u010digledniji primjeri pasivno-agresivnog pona\u0161anja. Nije potrebno re\u0107i
  da je te\u0161ko razumeti pasivno-agresivnu osobu.\\n\\nOvo me podsetilo na tridesetdevetogodi\u0161nju
  \u017eenu Margaret. Rodena je i odrasla u hri\u0161\u0107anskoj porodici. Na\u017ealost,
  njeni roditelji su verovali da dete ne sme da ispoljava gnev. Zbog toga ona nikad
  nije nau\u010dila kako da se pravilno nosi s njim ili da ga se oslobodi. Tako je
  postala osoba koja je svojim pona\u0161anjem uglavnom htela da uznemiri svoje roditelje.
  Celog \u017eivota te\u017eila je da radi potpuno suprotne stvari od onih koje su
  roditelji od nje o\u010dekivali. Nije bila svesna da se tako pona\u0161a. Zbog toga
  je sebe smatrala dobrom hri\u0161\u0107ankom koja ozbiljno \u017eeli da \u017eivi
  dobar \u017eivot. Me\u0111utim, stalno je imala afere s o\u017eenjenim mu\u0161karcima.
  Optu\u017eena je za proneveru i prevaru. Margaret je zagonetka za\\n\\nsamu sebe.
  Dok nije po\u010dela da ide na terapiju, nije mogla da razume za\u0161to su njeni
  na\u010din \u017eivota i obrazac pona\u0161anja potpuno nedosledni njenoj veri.
  Njen \u017eivot je bio uzaludan i pun samoponi\u017eenja i samouni\u0161tenja, jer
  je osnovna svrha njenog \u017eivota bila da se pona\u0161a suprotno onome \u0161to
  su roditelji od nje o\u010dekivali. Tragi\u010dno!\\n\\nPasivno-agresivno pona\u0161anje
  je apsolutno najgori oblik izra\u017eavanja gneva iz vi\u0161e razloga:\\n\\n- Lako
  mo\u017ee da postane ukorenjeni, trajni obrazac pona\u0161anja.\\n- Mo\u017ee da
  iskrivi ne\u010diju li\u010dnost i tu osobu u\u010dini potpuno neprijatnom.\\n-
  Mo\u017ee da uti\u010de na sve budu\u0107e odnose tinejd\u017eera.\\n- To je jedan
  od poreme\u0107aja pona\u0161anja koji se te\u0161ko le\u010di.\\n\\nSveto pismo
  nas u\u010di kako da vaspitavamo decu na pravi na\u010din. Ako primoravamo dete
  da potiskuje gnev i da prema njemu ne postupa pravilno, ne vaspitavamo ga na pravi
  na\u010din. Vrlo je va\u017eno da u\u010dimo dete da pravilno postupa s gnevom,
  da se gneva oslobada, a ne da ga potiskuje.\\n\\n**LESTVICE GNEVA**\\n\\nPostoji
  mnogo na\u010dina izra\u017eavanja gneva, ali ne na pasivno-agresivni na\u010din.
  \u0160to je osoba nezrelija, nezrelije \u0107e da ispoljava gnev. \u0160to je zrelija,
  zrelije \u0107e ga ispoljavati. Ne\u0161to \u0161to mnogi odrasli nikada ne nau\u010de,
  a \u0161to je najva\u017enija lekcija odrastanja i sticanja zrelosti, jeste izlaze\u045ae
  na kraj s gnevom na primeren i zreo na\u010din.\\n\\nDeca \u0107e nastojati da nezrelo
  ispoljavaju gnev sve dok im neko ne poka\u017ee druga\u010dije. Ne mo\u017eemo o\u010dekivati
  od tinejd\u017eera da gnev izra\u017eavaju automatski na najbolji i najzrelijiji
  na\u010din. Ali, to je ono \u0161to o\u010dekuju roditelji kada svojim tinejd\u017eerima
  ka\u017eu da se ne nerviraju. Roditelji moraju da u\u010de tinejd\u017eere da idu
  korak po korak u savladavanju gneva.\\n\\nDa bi se ilustrovali razli\u010diti koraci
  ili nivoi zrelosti u izra\u017eavanju gneva, i da bi se pomoglo roditeljima da uvide
  da moraju da u\u010de tinejd\u017eere da napreduju od jednog nivoa zrelosti do drugog,
  dok ne po\u010dnu da ispoljavaju gnev na sve primereniji na\u010din, napravljene
  su lestvice gneva.\\n\\n1. Kao \u0161to smo rekli, pasivno-agresivno pona\u0161anje
  je najgori na\u010din izra\u017eavanja gneva. (Neki slu\u010dajevi sociopatskog
  pona\u0161anja, koji uklju\u010duju ubistvo s predumi\u0161ljajem, mogu biti gori;
  ali to se retko de\u0161ava u ranom periodu adolescencije, potpuno je nenormalno
  i ne spada u domen ovog poglavlja.)\\n\\n2. Malo bolji na\u010din ispoljavanja gneva
  je potpuno nekontrolisano pona\u0161anje kada osoba ima napade besa, uni\u0161tava
  imovinu, ili/ili je nasilna prema nekoj drugoj osobi. Koliko god ovo zvu\u010dalo
  lo\u0161e, pasivno-agresivno pona\u0161anje je gore. Za\u0161to? Zato \u0161to je
  ovakvo pona\u0161anje lak\u0161e ispraviti i spre\u010diti nego pasivno-agresivno.\\n\\n3.
  Ne\u0161to bolji na\u010din izra\u017eavanja gneva je reakcija izlivu besa, ali
  s dovoljno samokontrole da ne dode do uni\u0161tavanja imovine i nasilja nad drugima.
  Izliv besa je ograni\u010den na vikanje, vri\u0161tanje ili psovanje da bi nekoga
  verbalno povredili, obi\u010dno davanjem pogrdnih imena ili optu\u017euju\u0107im
  primedbama. Gnev nije usmeren samo na osobu na koju smo ljuti, nego na bilo koga
  ko se nalazi u blizini. Koliko god bile jadne i nezrele ove metode, daleko su bolje
  od pasivno-agresivnog pona\u0161anja ili drugih pomenutih na\u010dina ispoljavanja
  gneva.\\n\\n4. Slede\u0107i bolji na\u010din ispoljavanja gneva je nekontrolisano
  verbalno izra\u017eavanje, ali bez vredanja, prozivanja ili kritikovanja nekog konkretnog.
  U ovom slu\u010daju gnev nije usmeren samo na onoga na koga smo ljuti, ve\u0107
  na bilo koga ko se tu nalazi. Koliko god lo\u0161a i primitivna bila ova metoda,
  bolja je od bilo koje pomenute.\\n\\n5. Slede\u0107i na\u010din izra\u017eavanja
  gneva je neprijatno ispoljavanje, verovatno vikanjem ili vri\u0161tanjem, ali ograni\u010davaju\u0107i
  se na temu koja nas je isprovocirala, i, ako je mogu\u0107e, na osobu koja je izazvala\\n\\ngnev.
  Naravno, od situacije zavisi da li \u0107e ispoljavanje gneva prema osobi koja ga
  je izazvala biti primereno.\\n\\n6. Najbolji na\u010din ispoljavanja gneva je ispoljavanje
  na prijatan i razuman na\u010din, ako je mogu\u0107e, i to prema osobi koja ga je
  izazvala. Nadajte se da \u0107e osoba kojoj ste uputili va\u0161 gnev reagovati
  na jednako zreo na\u010din, poku\u0161avaju\u0107i da shvati va\u0161u poziciju,
  i da \u0107ete zajedno mo\u0107i da re\u0161ite sukob. Re\u0161avanje sukoba za
  obe strane zna\u010di razumno i logi\u010dno razmatranje problema, razgovaranje
  o njemu, razumevanje i jedne i druge strane, i slaganje oko toga \u0161to \u0107e
  se uraditi. Za ovo je potrebna zrelost obe strane. Vrlo malo ljudi dostigne u \u017eivotu
  ovaj stepen zrelosti.\\n\\nShvatio sam da je opisivanje razli\u010ditih nivoa zrelosti
  u ispoljavanju gneva vrlo slo\u017eeno i te\u0161ko za razumevanje. Da bih ga uprostio
  koliko god je mogu\u0107e, a ipak vam pru\u017eio odre\u0111eno znanje, stvorio
  sam lestvici gneva.\\n\\nPetnaest na\u010dina gnevnog pona\u0161anja kombinuju se
  na razli\u010dite na\u010dine na lestvici gneva. Primeti\u0107ete da je ispoljavanje
  gneva prvenstveno negativno. Na lestvici su samo prva dva na\u010dina potpuno pozitivna.\\n\\n1.
  Ljubazno pona\u0161anje\\n2. Tra\u017eenje re\u0161enja\\n3. Usmeravanje gneva na
  onoga ko ga je izazvao\\n4. Ostajanje pri prvoj \u017ealbi\\n5. Logi\u010dno i konstruktivno
  razmi\u0161ljanje\\n6. Neprijatno i bu\u010dno pona\u0161anje\\n7. Psovanje\\n8.
  Usmeravanje gneva ka onima koji ga nisu izazvali\\n9. Izra\u017eavanje \u017ealbi
  koje nisu direktno povezane\\n10. Bacanje predmeta\\n11. Uni\u0161tavanje imovine\\n12.
  Verbalno zlostavljanje\\n13. Emocionalno destruk\u0442\u0438\u0432\u043d\u043e pona\u0161anje\\n\\nPOZITIVNO\\n\\n1.
  LJUBAZNO PONA\u0160ANJE \u2022 TRA\u017dENJE RE\u0160ENJA \u2022 USMERAVANJE GNEVA
  NA ONOGA KO GA JE IZAZVAO \u2022 OSTAJANJE PRI PRVOJ \u017dALBI \u2022 LOGI\u010cNO
  RAZMI\u0160LJANJE\\n2. LJUBAZNO PONA\u0160ANJE \u2022 USMERAVANJE GNEVA NA ONOGA
  KO GA JE IZAZVAO \u2022 OSTAJANJE PRI PRVOJ \u017dALBI \u2022 LOGI\u010cNO RAZMI\u0160LJANJE\\n\\nPOZITIVNO
  I NEGATIVNO\\n\\n3. USMERAVANJE GNEVA NA ONOGA KO GA JE IZAZVAO \u2022 OSTAJANJE
  PRI PRVOJ \u017dALBI \u2022 LOGI\u010cNO RAZMI\u0160LJANJE \u2022 neljubazno, bu\u010dno\\n4.
  OSTAJANJE PRI PRVOJ \u017dALBI \u2022 LOGI\u010cNO RAZMI\u0160LJANJE \u2022 neljubazno,
  bu\u010dno \u2022 usmeravanje gneva ka onima koji ga nisu izazvali\\n5. USMERAVANJE
  GNEVA NA ONOGA KO GA JE IZAZVAO \u2022 OSTAJANJE PRI PRVOJ \u017dALBI \u2022 LOGI\u010cNO
  RAZMI\u0160LJANJE \u2022 neljubazno, bu\u010dno \u2022 verbalno zlostavljanje\\n6.
  LOGI\u010cNO RAZMI\u0160LJANJE \u2022 neljubazno, bu\u010dno \u2022 usmeravanje
  gneva ka onima koji ga nisu izazvali \u2022 izra\u017eavanje nepovezanih \u017ealbi\\n\\nUGLAVNOM
  NEGATIVNO\\n\\n7. neljubazno, bu\u010dno pona\u0161anje \u2022 usmeravanje gneva
  ka onima koji ga nisu izazvali \u2022 izra\u017eavanje nepovezanih \u017ealbi \u2022
  emocionalno destruktivno pona\u0161anje\\n8. neljubazno, bu\u010dno pona\u0161anje
  \u2022 usmeravanje gneva ka onima koji ga nisu izazvali \u2022 izra\u017eavanje
  nepovezanih \u017ealbi \u2022 verbalno zlostavljanje \u2022 emocionalno destruktivno
  pona\u0161anje\\n9. neljubazno, bu\u010dno pona\u0161anje \u2022 psovanje \u2022
  usmeravanje gneva ka onima koji ga nisu izazvali \u2022 izra\u017eavanje nepovezanih
  \u017ealbi \u2022 verbalno zlostavljanje \u2022 emocionalno destruktivno pona\u0161anje\\n10.
  USMERAVANJE GNEVA KA OSOBI KOJA GA JE IZAZVALA \u2022 neljubazno, bu\u010dno pona\u0161anje
  \u2022 psovanje \u2022 usmeravanje gneva ka onima koji ga nisu izazvali \u2022 bacanje
  stvari \u2022 emocionalno destruktivno pona\u0161anje\\n11. neljubazno, bu\u010dno
  pona\u0161anje \u2022 psovanje \u2022 usmeravanje gneva ka onima koji ga nisu izazvali
  \u2022 bacanje stvari \u2022 emocionalno destruktivno pona\u0161anje\\n\\nNEGATIVNO\\n\\n12.
  USMERAVANJE GNEVA KA ONIMA KOJI SU GA IZAZVALI \u2022 neljubazno, bu\u010dno pona\u0161anje
  \u2022 psovanje \u2022 uni\u0161tavanje imovine \u2022 verbalno zlostavljanje \u2022
  emocionalno destruktivno pona\u0161anje\\n13. neljubazno, bu\u010dno pona\u0161anje
  \u2022 psovanje \u2022 usmeravanje gneva ka onima koji ga nisu izazvali \u2022 uni\u0161tavanje
  imovine \u2022 verbalno zlostavljanje \u2022 emocionalno destruktivno pona\u0161anje\\n14.
  neljubazno, bu\u010dno pona\u0161anje \u2022 psovanje \u2022 usmeravanje gneva ka
  onima koji ga nisu izazvali \u2022 uni\u0161tavanje imovine \u2022 verbalno zlostavljanje
  \u2022 fizi\u010dko zlostavljanje \u2022 emocionalno destruktivno pona\u0161anje\\n15.
  pasivno-agresivno pona\u0161anje\\n\\n14. Fizi\u010dko zlostavljanje\\n15. Pasivno-agresivno
  pona\u0161anje\\n\\nSvaki stepenik na lesvici gneva predstavlja napredovanje u izra\u017eavanju
  gneva. Vi \u017eelite da nau\u010dite svog tinejd\u017eera da ide korak po korak,
  stepenik po stepenik. Kako to da uradite?\\n\\nKao roditelji, morate biti dobar
  primer pravilnog ispoljavanja gneva. Takode mo\u017eete da o\u010dekujete da va\u0161
  tinejd\u017eer bude ljut s vremena na vreme. Umesto da mu zabranite da bude ljut
  ili preterano reagujete na njegov gnev, treba da vidite dokle je stigao u savladavanju
  gneva i pomognete mu da nastavi dalje. Na primer, jedan tinejd\u017eer je na \u0161estom
  stepeniku lesvice gneva. To zna\u010di da je neljubazan, ispoljava ga prema nedu\u017enim
  ljudima (na primer, prema svom mladem bratu umesto prema osobi koja ga je razljutila),
  dr\u017ei se primarne \u017ealbe (to jest, onoga \u0161to ga stvarno mu\u010di),
  i razmi\u0161lja logi\u010dno i konstruktivno (poku\u0161ava stvari da u\u010dini
  boljim, ne gorim).\\n\\nZatim odre\u0111ujete kakvo pobolj\u0161anje mo\u017eete
  da u\u010dinite za va\u0161eg tinejd\u017eera. U ovom primeru \u017eele\u0107ete
  da on nau\u010di da usmeri gnev prema pravoj osobi, a ne da ga ispoljava ka mladem
  bratu.\\n\\nDa biste ga tome nau\u010dili, morate to da uradite uskoro po\u0161to
  ste se oboje smirili i kad atmosfera postane prijatna. U ovim najboljim mogu\u0107im
  trenucima, pohvalite va\u0161eg tinejd\u017eera za trenutke u kojima je izrazio
  gnev na pravi na\u010din. Zatim ga zamolite da ispravi odre\u0111eni na\u010din
  pona\u0161anja koji vi \u017eelite da promeni \u2013 u ovom slu\u010daju da ne usmerava
  gnev na svog mladeg brata.\\n\\nSvi mi moramo da razvijemo vlastite na\u010dine
  na koje \u0107emo da u\u010dimo na\u0161e tinejd\u017eera da zrelo savladavaju gnev.
  Razmotrimo na\u010dine na koje sam ja nekada radio. Kada je jedan od mojih\\n\\ntinejd\u017eera
  verbalizovao svoj gnev, a ja sam video ne\u0161to \u0161to je trebalo ispraviti,
  \u0161to je mogu\u0107e br\u017ee pronalazio sam vreme za razgovor kad smo oboje
  bili smireni i opu\u0161teni. Prvo, stavljao sam mom tinejd\u017eeru do znanja da
  je u redu \u0161to je verbalno ispoljio gnev prema meni, da se ne bi ose\u0107ao
  kao da je uradio ne\u0161to lo\u0161e i nerado opet verbalno ispoljio gnev. Rekao
  bih ne\u0161to kao: \u201eDrago mi je da si mi pokazao da si ljut na mene. Kad si
  sre\u0107an, tvoja mama i ja \u017eelimo da znamo da si sre\u0107an. Kad si tu\u017ean,
  mi to \u017eelimo da znamo. Kad si ljut, \u017eelimo da znamo da si ljut.\u201c\\n\\nDrugo,
  poku\u0161avao sam da utvrdim ono \u0161to su tinejd\u017eeri, izra\u017eavaju\u0107i
  gnev dobro uradili i davao im pohvale za to. Zapamtite, kada tinejd\u017eer ispoljava
  gnev verbalno mnogo stvari radi kako treba. Tada bih rekao ne\u0161to ovako: \u201ePonosan
  sam na tebe zbog toga kako izlazi\u0161 na kraju s gnevom. Nisi ga iskalio na mladem
  bratu ili psu, nisi ni\u0161ta bacao, ili iznosio nepovezane \u010dinjenice. Jasno
  si mi dao do znanja \u0161ta misli\u0161 o ovom problemu. To je dobro.\u201c\\n\\nTada
  sam bio spreman da mu pomognem da pre\u0111e na slede\u0107i nivo na lestvici gneva.
  Molim vas da zapamtite da ovo traje pet ili \u0161est godina i da tinejd\u017eeri
  mogu praviti samo korak po korak. Ja bih odredivao koji \u0107e to korak biti, i
  zamolio tinejd\u017eera, ne naredio, da taj korak i u\u010dini. Na primer, rekao
  bih mu: \u201eJedino gde si pogre\u0161io, sine, je, kad si me nazvao tim imenom.
  Kad si ljut, molim te zovi me jednostavno \u2018tata\u2019\u201c. Roditelji, ovo
  je presudno. Nisam mogao odmah da o\u010dekujem da \u0107e slede\u0107i put kada
  bude verbalizovao gnev, moj tinejd\u017eer napraviti taj slede\u0107i korak. Gre\u0161ka
  mo\u017ee da se desi i nekoliko narednih puta. Zapamtite, sazrevanje je sporo, postepeno,
  te\u0161ko i \u010desto bolno. Ali, vremenom \u0107e va\u0161 tinejd\u017eer (nadajmo
  se oko \u0161esnaeste ili sedamnaeste godine) postati odgovorna zrela osoba spremana
  na saradnju. \u201eBez muke nema ni nauke\u201c.\\n\\nOvo me podsetilo na ne\u0161to
  \u0161to je rekao Mark Tven (Mark Twain); ako mogu da parafraziram: \u201eKada sam
  imao petnaest godina, moj otac je za mene bio najve\u0107a neznalica koju sam znao.
  Zapanjuju\u0107e je koliko je nau\u010dio u slede\u0107ih pet godina.\u201c To je
  adolescencija!\\n\\nDozvolite mi da razjasnim zabunu do koje mo\u017ee do\u0107i.
  Treba da podu\u010davate va\u0161eg tinejd\u017eera verbalnom ispoljavanju gneva
  da bi mogao bolje da se nosi s njim. Ja ne podsti\u010dem popustljivost u pona\u0161anju.
  Morate ostati \u010dvrsti i ne dozvoliti mu da se pona\u0161a neprimereno. Ograni\u010denja
  koja se odnose na pona\u0161anje moraju da budu \u010dvrsta i dosledna. Ova razlika
  izme\u0111u verbalnog izra\u017eavanja gneva i izra\u017eavanja putem pona\u0161anja
  je presudna.\\n\\n**DEJVID**\\n\\nKao i mnogi ljudi, i ja sam bio u situacijama
  kad mi je gnev predstavljao problem, kako moj vlastiti gnev, tako i gnev drugih
  ljudi. Me\u0111utim, evo jednog primera u kome sam, verujem, pravilno postupio.
  \u0160to je najbolje, do\u0161ao sam do izvanrednog zaklju\u010dka u polju de\u010dijeg
  gneva. Jednoga dana, kad je na\u0161 sin Dejvid imao trinaest godina, bio je preoptere\u0107en
  doma\u0107im zadacima. Tog popodneva do\u0161ao je ku\u0107i oko tri sata i trideset
  minuta. Za deset minuta je ve\u0107erao, a onda je radio doma\u010de zadatke iz
  lektire do jedanaest i trideset uve\u010de. Zadatke je trebalo da preda za par dana.
  U jedanaest i trideset sam mu rekao: \u201eDejvide, ne zanima me koliko jo\u0161
  ima\u0161 doma\u0107ih zadataka, potreban ti je san i ho\u0107u da sad ode\u0161
  u krevet.\u201c On je odgovorio: \u201eTata, molim te, jo\u0161 samo pet minuta,
  skoro sam zavr\u0161io.\u201c\\n\\nRekao sam: \u201eU redu, jo\u0161 pet minuta
  i to je sve.\u201c Zatim smo \u017eena i ja oti\u0161li na spavanje. Posle nekoliko
  minuta Dejvid je u\u0161ao u sobu s knjigom, pri\u0161ao majci i rekao: \u201eMama,
  mislim da \u0107u da uzmem ovu knjigu za lektiru.\u201c\\n\\nMajka je pogledala
  knjigu i rekla: \u201eNe, Dejvide, ne mo\u017ee\u0161 uzeti tu knjigu jer si o njoj
  pisao i pro\u0161le godine.\u201c\\n\\nDejvid je rekao: \u201eZnam, ali mogu da
  napi\u0161em drugi sastav o njoj i ne moram da \u010ditam drugu knjigu.\u201c\\n\\n\u201e\u017dao
  mi je Dejvide\u201c, odgovorila je majka, \u201eto ne bi bilo u redu. Mora\u0161
  da pro\u010dita\u0161 drugu knjigu.\u201c\\n\\nDejvid se naljutio i grubo joj odgovorio.
  \u201eU redu, pro\u010dita\u0107u. Samo mi pomozi da pronadem drugu knjigu i ja
  \u0107u je pro\u010ditat\u0438. U redu, pro\u010dita\u0107u tu drugu knjigu!\u201c\\n\\nMoja
  prva reakcija bila je tipi\u010dna, usmerena na dete koje je verbalno ispoljavalo
  gnev na neprijatan, bu\u010dan na\u010din \u2013 osetio sam kako gnev raste u meni.
  Prvo sam pomislio: \u201eKako se usuduje da tako razgovara s majkom! Pokaza\u0107u
  mu da se ne mo\u017ee tek tako izvu\u0107i s takvim pona\u0161anjem.\u201c\\n\\nAli
  na svu sre\u0107u, setio sam se prethodnog doga\u0111aja. Tri dana pre toga, bio
  sam toliko ljut na nekog \u010doveka (i to u crkvi zamislite!) da sam ga nazvao
  la\u017eovom. Ko se bolje nosio s gnevom? Dejvid ili ja? Zatim sam shvatio da je
  to Dejvid bolje uradio i da je on bio na tre\u0107em stepeniku lestvice gneva. Ja
  sam bio blizu petog. On je usmerio svoj gnev ka njegovom uzroku \u2013 majci. Nije
  se iskalio na mladem bratu, nije udario psa, nije uni\u0161tavao imovinu, nije poku\u0161ao
  da povredi majku nazivaju\u0107i je raznim imenima ili kritikuju\u0107i je, i nije
  koristio pasivno-agresivno pona\u0161anje. Nije iznosio neprijatne \u010dinjenice
  niti ranije \u017ealbe. Jednostavno je izjavio da \u0107e da pro\u010dita drugu
  knjigu. Ko mo\u017ee bolje od toga? Jedino gde je Dejvid pogre\u0161io je kad je
  podviknuo na majku. Tako ne\u0161to ne mo\u017ee da uradi mnogo ljudi, uklju\u010duju\u0107i
  i zrele odrasle osobe.\\n\\n\u0160ta bi se desilo da sam napao Dejvida i kaznio
  ga? Re\u0107i \u0107u vam \u0161ta: po\u0161to je bio na tre\u0107em stepeniku lestvice
  gneva, kad bi se slede\u0107i put razljutio, bio bi primoran da upotrebi jo\u0161
  nezreliji na\u010din izra\u017eavanja gneva na ni\u017eem stepeniku lestvice gneva.\\n\\n\u0160ta
  je trebalo da uradim? Mislio sam da je u tom trenutku najbolje da ne reagujem. Ako
  ne reagujem, ne zna\u010di da opra\u0161tam. Po izrazima na\u0161ih lica znao je
  da nam se ne svida ono \u0161to radi. Ne reaguju\u0107i mi smo mu govorili: \u201eNe
  svida nam se to \u0161to radi\u0161, ali ako si tako izabrao, samo izvoli. Nije
  toliko lo\u0161e da bi trebalo da prestane\u0161, ali nama se ne svida.\u201c\\n\\nPo\u0161to
  smo se svi smirili, Dejvid je oti\u0161ao u krevet. Pre toga obavili smo na\u0161u
  uobi\u010dajenu molitvu pre spavanja (ovo je dobar primer u kome se ta molitva posebno
  isplati) i po\u0161to smo se zajedno pomolili, rekao sam Dejvidu: \u201eVeoma sam
  ponosan na na\u010din na koji si ve\u010deras ispoljio svoj gnev. Nisi se iskalio
  na bratu ili psu. Nisi ni\u0161ta bacao, niti si se durio, nisi rekao ni\u0161ta
  ru\u017eno. Govorio si otvoreno s majkom, ne poku\u0161avaju\u0107i da je povredi\u0161
  raznim imenima ili kritikom. Jednostavno si rekao da \u0107e\u0161 da pro\u010dita\u0161
  drugu knjigu. Odli\u010dno! Jedino gde si pogre\u0161io je kad si vikao na majku.\u201c
  U\u010dinak je bio ogroman. Dejvidu je bilo lak\u0161e, jer nisam bio ljut na njega,
  ali je istovremeno ose\u0107ao krivicu jer je vikao na majku. Sutradan joj se izvinio.\\n\\n**U\u010cITE
  VA\u0160EG TINEJD\u017dERA**\\n\\nKada va\u0161 tinejd\u017eer ispoljava gnev otvoreno,
  re\u010dima, budite zadovoljni. \u0160to vi\u0161e koristi re\u010di za izra\u017eavanje
  gneva, to bolje. Zatim odredite gde je on na lesvici gneva. Odredite \u0161ta je
  primereno u ispoljavanju gneva, a \u0161ta neprimereno.\\n\\nVrlo je lako pome\u0161ati
  verbalno ispoljavanje gneva s nepo\u0161tovanjem. To je kamen spoticanja za mnoge
  roditelje. Da biste re\u0161ili ovu dilemu, postavite sebi pitanje: \u201eKakav
  stav prema meni ima moj tinejd\u017eer? Da li je to po\u0161tovanje ili nepo\u0161tovanje?\u201c
  U ogromnom broju slu\u010dajeva, odgovor je \u2013 po\u0161tovanje. Mnogi tinejd\u017eeri
  imaju osnovni stav pun po\u0161tovanja prema svojim roditeljima. Ako je ovo slu\u010daj
  i s va\u0161im tinejd\u017eerom, molim vas, opustite se malo i uo\u010dite da li
  on ili ona gnev verbalizuje \u2013 naro\u010dito gnev vezan za pojedine probleme
  \u2013 jer to je ono \u0161to \u017eelite. Tada \u0107ete mo\u0107i da pou\u010dite
  svog tinejd\u017eera kako da bude zreliji u toj oblasti i da se zrelije nosi s gnevom.
  S druge strane,\\n\\nako vas tinejd\u017eer uglavnom ne po\u0161tuje, to je sasvim
  drugi problem. To zna\u010di da imate ozbiljan problem u odnosu s njim i savetujem
  vam da \u0161to pre potra\u017eite profesionalnu pomo\u0107.\\n\\nDrugi na\u010din
  kako da u ovoj situaciji postupimo jeste da pogledamo u o\u010di tinejd\u017eera
  koji iz nekog razloga ne mo\u017ee verbalno da ispolji gnev. Nekad je te\u0161ko,
  a ponekad i nemogu\u0107e uve\u017ebati ga da gnev zrelo iska\u017ee. U stvari,
  jedan od prvih problema bi\u0107e taj kako da ga osposobimo da verbalizuje svoj
  gnev. Ovo je veoma te\u0161ko. Sad vidite, dragi roditelji, koliko treba da budete
  sre\u010dni ako va\u0161e dete mo\u017ee verbalno da ispolji gnev; tada mo\u017eete
  da ga pou\u010davanjem dovedete do zrelosti.\\n\\nAko \u017eelite da va\u0161eg
  tinejd\u017eera nau\u010dite na\u010dinu na koji treba da se pona\u0161a, prvo ga
  pohvalite kad na primeren na\u010din izrazi gnev. Tek nakon toga mo\u017eete da
  razgovarate s njim o jednom od neprimerenih na\u010dina ispoljavanja gneva (npr.
  nazivanje pogrdnim imenom), i da ga zamolite da to ispravi. Izaberite najbolji mogu\u0107i
  trenutak za to, a zatim razgovarajte s njim o ispravljanju odre\u0111ene gre\u0161ke;
  neka to bude samo jedna stvar, a o ostalima \u0107ete neki drugi put. Tako u\u010dite
  dete da se postepeno penje lestvicom gneva.\\n\\nIzvesna doza pasivno-agresivnog
  pona\u0161anja je normalna u ranom periodu adolescencije \u2013 sve dok takvo pona\u0161anje
  nikome ne \u0161kodi, uklju\u010duju\u0107i i tinejd\u017eera i \u010dlanove porodice.
  Normalno adolescentsko pasivno-agresivno pona\u0161anje obi\u010dno po\u010dinje
  od jedanaeste godine. Zapamtite da \u017eelimo da tinejd\u017eer odbaci ovo PA pona\u0161anje
  pre \u0161esnaeste ili sedamnaeste godine. Zbog toga, postaje o\u010digledno da
  je ovo dugotrajan proces. Govorimo o periodu koji traje pet ili \u0161est godina.
  To moramo da shvatimo, jer moramo biti strpljivi i o\u010dekivati postepeni uspeh
  \u2013 otrpilike tri koraka napred, dva nazad. To je zbog toga \u0161to je savladavanje
  gneva proces sazrevanja, a mi sazrevamo vrlo sporo. Zato vas molim, nemojte biti
  nestrpljivi s napretkom va\u0161eg tinejd\u017eera. U protivnom on \u0107e vas prili\u010dno
  razo\u010darati i nesvesno \u0107ete uni\u0161titi ceo proces. Budite strpljivi!\\n\\nMnogi
  roditelji od dece o\u010dekuju da se zrelo nose s gnevom, na najvi\u0161em nivou,
  bez pou\u010davanja. To je kao da nekome ko ho\u010de da trenira tenis, pre prvog
  \u010dasa ka\u017eete: \u201eVerujem da si sada spreman za Vimbldon.\u201c\\n\\nU
  nekim slu\u010dajevima nemogu\u0107e je osloboditi se gneva, kao na primer, kada
  je osoba koja ga je izazvala nepristupa\u010dna. U tom slu\u010daju tinejd\u017eer
  treba da nau\u010di da se oslobodi gneva na druge na\u010dine, ve\u017ebaju\u0107i,
  razgovaraju\u0107i o tome sa zrelom osobom, bave\u0107i se nekom prijatnom aktivno\u0161\u0107u,
  ili provode\u0107i vreme nasamo i odmaraju\u0107i se.\\n\\nDrugi na\u010din na koji
  mo\u017eemo da u\u010dimo tinejd\u017eera savladavanju gneva je da ga nau\u010dimo
  umetnosti misaoanog spre\u010davanja odre\u0111enih tipova gneva. To zna\u010di
  da koristiti aktivno intelektualno rasudivanje da bi smanjio gnev. Na primer, kod
  Dejvida sam primetio predivnu promenu u kontrolisanju gneva u ranim tinejd\u017eerskim
  godinama. Umesto da reaguje isklju\u010divo emocionalno, on je nau\u010dio da vi\u0161e
  razmi\u0161lja.\\n\\nU ranim tinejd\u017eerskim godinama Dejvid bi povremeno izgubio
  strpljenje kad bi igrao bejzbol, ako bi drugi igra\u010d uradio ne\u0161to o\u010digledno
  pogre\u0161no, a naro\u010dito ako bi to povredilo Dejvida. Ali, jedne letnje ve\u010deri
  primetio sam napredak. Tokom igre, Dejvid je tr\u010dao do baze kad je hvata\u010d
  uhvatio loptu uba\u010denu iz vanjskog polja. Bio je spreman da uhvati Dejvida,
  ali ga je ovaj iznenadio preska\u010du\u0107i njegovu rukavicu. Na\u017ealost, presko\u010dio
  je i bazu. Bacio se na stomak da bi dohvatio bazu, kad je hvata\u010d, besan zbog
  toga \u0161to je prevaren, udario Dejvida u lice dok ga je lovio. Ja sam bio \u0161okiran
  i pla\u0161io sam se da \u0107e Dejvid, s obzirom da je bio vi\u0161i de\u010dak,
  reagovati nasilno. Laknulo mi je i bio sam zadivljen kad je samo stresao pra\u0161inu
  i mirno po\u0161ao ka klupi za igra\u010de. Shvativ\u0161i da ovaj igra\u010d ima
  pote\u0161ko\u0107a sa savladavanjem gneva i da ga je zbog toga ispoljio na neprimeren
  na\u010din, Dejvid je nau\u010dio kako da intelektualno ugu\u0161i gnev u korenu.
  Ukratko, on je znao da hvata\u010d nije imao ni\u0161ta li\u010dno protiv njega
  i da je na ovaj na\u010din reagovao zbog vlastitih problema s pona\u0161anjem.\\n\\nMnogi
  odrasli postupaju prema gnevu na neprimeren na\u010din. Mogu da izgube kontrolu
  i usmere gnev prema pogre\u0161noj osobi. Mogu da povrede ljude na koje su ljuti
  iza njihovih leda, koriste\u0107i pasivno-agresivno pona\u0161anje na indirektn
  i nezreo na\u010din. Za\u0161to? Zato \u0161to ih niko nije u\u010dio kako da savladavaju
  gnev na bolji na\u010din. Ko je kriv za to? Njihovi roditelji.\\n\\nMe\u0111utim,
  moramo biti svesni da neka deca prirodno imaju vi\u0161e pote\u0161ko\u0107ama u
  savladavanju gneva od druge dece \u2013 bez obzira na tip roditeljstva koji su imali.
  Na primer, deca i tinejd\u017eeri s izvesnim neurolo\u0161kim problemima veoma su
  skloni savladavanju gneva na pasivno-agresivni na\u010din. Ovo je prili\u010dno
  \u010desta pojava ako su u pro\u0161losti imali problema sa shvatanjem ili s u\u010denjem.
  Ova deca i tinejd\u017eeri (kasnije odrasli) skloni su pasivno-agresivnom pona\u0161anju
  i depresiji.\\n\\nSvakodnevno vidamo nezrele na\u010dine savladavanja gneva. Vidamo
  mu\u017ea i \u017eenu kako vi\u010du, vri\u0161te i psuju jedno drugo. Vidamo \u017eenu
  ili mu\u017ea koji se upu\u0161taju u aferu kako bi se osvetili bra\u010dnom drugu.
  Vidamo slu\u017ebenike koji lo\u0161e rade da bi ugrozili interes poslodavca. Vidamo
  direktore \u0161kola koji zloupotrebljavaju nastavnike. Vidamo nastavnike koji lukavo
  rade protiv direktora. Vidamo odre\u0111ene grupe ljudi s posebnim interesovanjima
  koji poku\u0161avaju materijalno da o\u0161tete one s druga\u010dijim interesovanjima
  Nezrelo savladavanje gneva je svuda oko nas. To je jedan od najve\u0107ih problema
  dana\u0161njice, i rezultira lo\u0161im stavovima i kod zaposlenih i kod poslodavaca.
  Od \u0161ezdeset do osamdeset posto problema u bilo kojoj organizaciji vezano je
  za meduljudske odnose, jer mali broj ljudi zna kako da zrelo postupi s gnevom. Mnogi
  ga dobro povr\u0161no skrivaju u li\u010dnim susretima s drugima; ali on kasnije
  izade na povr\u0161inu, na neprimeren na\u010din.\\n\\nJedna od najva\u017enijih
  stvari o gnevu koju treba da shvatimo, bez obzira da li se radi o zaposlenima, supru\u017enicima,
  politi\u010darima ili tinejd\u017eerima, jeste da se on mora pojaviti. Mo\u017ee
  pote\u0107i iz bilo kog meduljudskog odnosa. Slede\u0107a va\u017ena \u010dinjenica
  je da \u0107e nastojati da poraste i postane sve te\u017ei za kontrolisanje, \u010dak
  i eksplozivan, ako ne\u0161to s njim ne uradimo. \u0160to ga te\u017ee kontroli\u0161emo,
  to mo\u017ee da postane sve \u0161tetniji. Zbog toga moramo na\u0107i na\u010dine
  da ga \u201eugu\u0161imo u korenu\u201d ako je baziran na nesporazumu, ili da se
  trudimo da ga polako ispoljimo i na kraju razre\u0161imo, ako je opravdan. Ovakva
  kontrola nikom ne dolazi sama od sebe. Zrelost koja je potrebna za primereno ophodenje
  s gnevom, vremenom se mora nau\u010diti kroz praksu.\\n\\n8. OD RODITELJSKE KONTROLE
  DO SAMOKONTROLE\\n\\nKako dete ulazi u tinejd\u017eerske godine, te\u017ei\u0161te
  discipline i u\u010denja mora se postepeno prebaciti s roditeljskog nadzora na odnos
  poverenja u kome privilegije i sloboda zavise od poverenja. Kad je dete mlado i
  slabo rasuduje o svojim delima, za odre\u0111ivanje njegovog pona\u0161anja odgovorni
  su uglavnom roditelji. Kad dete ulazi u predadolescentski period, i \u017eeli da
  bude nezavisno, ono \u0107e poku\u0161ati da preuzme sve vi\u0161e kontrole nad
  odlukama koje se odnose na njegovo pona\u0161anje. Roditelji treba da u\u010dine
  ovaj prelaz \u0161to je mogu\u0107e mirnijim i \u0161to manje traumati\u010dnim.\\n\\nDa
  biste uspeli u ovome, prvo morate da prihvatite \u010dinjenicu da je \u017eelja
  za nezavisno\u0161\u0107u normalna. Jednog dana, va\u0161e dete \u0107e postati
  potpuno nezavisno o vama, svidelo se to vama ili ne. Ono \u0161to mo\u017eete da
  uradite je da kontroli\u0161ete brzinu napredovanja ovog osamostaljivanja, upore\u0111uju\u0107i
  je s brzinom va\u0161eg napredovanja u tinejd\u017eerskim danima. Najbolji pokazatelj
  za ovo je stepen do kog mo\u017eete da verujete va\u0161em detetu i njegovoj sposobnosti
  da kontroli\u0161e svoje pona\u0161anje.\\n\\nVa\u0161 tinejd\u017eer \u0107e verovatno
  poku\u0161ati da testira granice va\u0161e kontrole kao i va\u0161u ljubav prema
  njemu. Prirodno, va\u0161a glavna briga je gde da postavite granice. Da li da budu
  pravedne, jasne i razumne? Ili treba da budete vrlo strogi? Va\u017eno je da zapamtite
  da \u0107e normalan tinejd\u017eer testirati \u2013 a ponekad i kr\u0161iti \u2013
  granice i pravila, bez obzira gde su postavljene. Ako postavite krajnje ograni\u010davaju\u0107a
  pravila, va\u0161 tinejd\u017eer \u0107e ih sigurno testirati, a verovatno i kr\u0161iti.
  Ako budu jasna, va\u0161 tinejd\u017eer \u0107e opet nekako na\u0107i na\u010dina
  da ih izazove ili prekr\u0161i. Zdrav razum ukazuje da, otkad je u prirodi ve\u0107ine
  tinejd\u017eera da izazivaju i/ili kr\u0161e pravila, bez obzira koliko stroga ili
  jasna ona bila, razumno je ta pravila u po\u010detku u\u010diniti stro\u017eijim
  i restriktivnijim. Zatim, ako dete koje polako sazreva pokazuje da mu se mo\u017ee
  verovati da \u0107e se pristojno pona\u0161ati, mo\u017eete mu postepeno dozvoliti
  sve ve\u0107e privilegije sa sve manje roditeljske kontrole. Drugim re\u010dima,
  dobija\u010de povlastice ako doka\u017ee da mo\u017eete imati poverenja u njega.
  Ako poka\u017ee da mo\u017eete imati jo\u0161 vi\u0161e poverenja u njega, vi\u0161e
  \u0107ete mu verovati. Ako se pona\u0161a primerno, pove\u0107a\u010dete mu privilegije.
  Ali, da biste do ovoga do\u0161li, morate po\u010deti od restriktivne pozicije.\\n\\nPostoji
  mnogo prednosti u kori\u0161\u0107enju ovog pristupa. Prvo, mudro je biti u poziciji
  da mo\u017eete da dozvolite vi\u0161e privilegija, a ne manje. Va\u0161 odnos s
  tinejd\u017eerom je bolji ako mo\u017eete da budete pozitivni; manje je prijatno
  kad morate biti negativni. Kada va\u0161 tinejd\u017eer tek ulazi u period adolescencije,
  naro\u010dito kad zapo\u010dinje svoj dru\u0161tveni \u017eivot, ako podete od restriktivnijeg
  stava, a zatim budete pozitivni i dopustite vi\u0161e privilegija \u2013 va\u0161
  nastup prema tinejd\u017eeru bi\u0107e pozitivan. Me\u0111utim, ako po\u010dnete
  kao \u201eslobodoumni, umereni i razumni\u201c, dozvoljavaju\u0107i va\u0161em tinejd\u017eeru
  po\u010detniku previ\u0161e privilegija i postavljaju\u0107i premao zabrana, mo\u017eete
  i\u0107i samo prema pove\u0107anju zabrana i postati \u201enegativac\u201c. Tako\u0111e,
  ako su va\u0161e granice pre\u0161iroke ili popustljive, i va\u0161 tinejd\u017eer
  ih kr\u0161i, verovatno je da \u0107e na\u0161koditi sebi ili osramotiti sebe ili
  porodicu.\\n\\nNe mogu da preteram u nagla\u0161avanju va\u017enosti postavljanja
  pravila koja vam dozvoljavaju da budete koliko je mogu\u0107e pozitivniji. Po\u010dnite
  restriktivnije tako da kasnije imate prostora da pove\u0107avate privilegije. Ako
  dopustite sve privilegije na po\u010detku, ne\u0107ete imati s \u010dime da radite.
  Ne\u0107ete imati mogu\u0107nosti da nagra\u0111ite tinejd\u017eera za preuzimanje
  sve ve\u0107e odgovornosti. \u0160to je jo\u0161 gore, ne mo\u017eete da ga nau\u010dite
  da postane dostojan poverenja i va\u017enosti da bude odgovoran.\\n\\nVa\u0161 cilj
  u kretanju od zabrane do privilegije je da va\u0161 tinejd\u017eer ve\u0107 od \u0161esnaeste
  godine reaguje kao odgovorna, nezavisna osoba, dostojna poverenja.\\n\\nOvo nije
  lako. Potrebni su hrabrost i odlu\u010dnost da u\u010dinite da privilegije zavise
  samo od njegove sposobnosti da kontroli\u0161e svoje pona\u0161anje. Treba vam snaga
  da se borite protiv pritiska nezaslu\u017eenih ustupaka, ne samo od strane va\u0161eg
  tinejd\u017eera, ve\u0107 i od drugih tinejd\u017eera, drugih roditelja, \u010dak
  i od dru\u0161tva.\\n\\nAli, zapamtite ovo: svi tinejd\u017eeri na nekom nivou svesti
  shvataju da im je potrebno vodstvo i kontrola njihovih roditelja. Oni to \u017eele.
  \u010cuo sam brojne tinejd\u017eere koji ka\u017eu da ih roditelji ne vole, jer
  nisu dovoljno strogi ili odlu\u010dni. Mnogi tinejd\u017eeri izra\u017eavaju zahvalnost
  i ljubav roditeljima koji pokazuju brigu i interes za vodstvo i kontrolu.\\n\\n**DO\u017dIVLJAVANJE
  POSLEDICA**\\n\\nDrugi faktor koji treba da razmotrimo je slede\u0107i: da bi va\u0161
  tinejd\u017eer mogao da nastavi da razvija normalnu savest i da nau\u010di da se
  pona\u0161a odgovorno kao odrasla osoba, mora da iskusi posledice svog pona\u0161anja
  \u2013 pozitivne za primereno, odgovorno pona\u0161anje, i negativne za neprimereno,
  neodgovorno pona\u0161anje. Ove posledice moraju biti dosledne, nepristrasne i zasnovane
  na pona\u0161anju, a ne na va\u0161em ose\u0107anju u tom trenutku. Opet se vra\u0107amo
  zna\u010daju roditeljske samokontrole i dono\u0161enju odluka zasnovanih na jasnom,
  logi\u010dnom razmi\u0161ljanju, a ne na na\u0161im impulsivnim ose\u0107anjima.\\n\\nKako
  to da postignete?\\n\\nMislim da pravilo ili odluka koju donosite zaslu\u017euju
  tuma\u010denje. Tinejd\u017eeri imaju pravo da znaju za\u0161to, a roditelji moraju
  da budu sigurni da je razlog prakti\u010dan, a ne jednostavno moralisti\u010dki.
  Naravno, mora da postoji moralan razlog iza pravila, ali tako\u0111e mora da postoji
  i prakti\u010dan razlog. Tinejd\u017eeri u ranom periodu adolescencije nalaze se
  usred preispitivanja roditeljskih pravila i vrednosti. Ovi tinejd\u017eeri se mnogo
  bolje odnose prema prakti\u010dnim pravilima nego prema moralisti\u010dkim. Jedan
  od razloga zbog kojega se mnogi tinejd\u017eeri okre\u0107u protiv duhovnih vrednosti
  jeste taj \u0161to su dobijali previ\u0161e moralisti\u010dkih razloga za pravila
  i ograni\u010denja. Za vreme ovog buntovnog, prkosnog i verovatno neprijatnog perioda,
  roditelji postupaju mudro ako im daju prakti\u010dne razloge za odluke. Me\u0111utim,
  dovoljno je da iznesete razlog, ne morate da ga branite kao doktorsku tezu. Svada\u045ae
  s tinejd\u017eerom oko primerenosti i legitimnosti razloga retko je opravdano. Sve
  dok je odgovor razuman, obi\u010dno je dovoljno prosto ga kazati. Ako poka\u017eete
  sklonost ka svadi, to \u0107e kasnije, uglavnom, dovesti do neslaganja i gneva.\\n\\nKada
  je na\u0161a \u010derka Keri u dvanaestoj godini htela da izlazi s de\u010dkom,
  rekli smo joj da ne mo\u017ee dok ne bude spremna \u2013 procenili smo da \u0107e
  to biti otpriklize za \u010detiri godine. Ostavili smo sebi mnogo manevarskog prostora.
  Zapamtite, mnogo je bolje biti u mogu\u0107nosti da smanjite ograni\u010denje nego
  biti primoran da budete jo\u0161 restriktivniji.\\n\\nKeri je pitala: \u201eZa\u0161to
  ne mogu?\u201c Objasnili smo joj da je u dana\u0161njem svetu jako va\u017eno znati
  dobro se pona\u0161ati u dru\u0161tvu, i da to u\u010dimo dok smo u periodu rane
  adolescencije. Ima mnogo odraslih koji nisu nau\u010dili da se primerno pona\u0161aju
  u dru\u0161tvu kad su imali dvanaest ili \u010detrnaest godina, i koji su zbog toga
  \u201edru\u0161tveno neprilago\u0111eni\u201c. Zatim sam dramati\u010dno uzviknuo:
  \u201eA moja \u010derka ne\u0107e biti dru\u0161tveno neprilago\u0111ena!\u201c
  Rekli smo joj da \u0107emo razgovarati o drugim dru\u0161tvenim privilegijama, kad
  nau\u010di dobro da se pona\u0161a u dru\u0161tvu.\\n\\nTo je delovalo oko godinu
  dana. Zatim je do\u0161la k nama i izjavila da je nau\u010dila da se pona\u0161a
  u dru\u0161tvu. Rekli smo joj da je zaista dosta napredovala, ali da primerno pona\u0161anje
  u dru\u0161tvu ne zna\u010di jednostavno sa svakim mo\u0107i iza\u0107i na kraj.
  To tako\u0111e zna\u010di ponuditi pozitivan, konstruktivan\\n\\ndoprinos grupi.
  Ne zna\u010di samo biti pod uticajem grupe, nego i uticati na grupu. Istakli smo
  da je veoma dobro napredovala, ali da jo\u0161 uvek nije voda \u2013 da druga deca
  vi\u0161e uti\u0107u na nju nego ona na njih. Sre\u0107an sam \u0161to mogu da ka\u017eem
  da je Keri pove\u0107ala svoje sposobnosti vode i nau\u010dila da \u0161iri topao,
  zdrav, ne\u017ean, ali sna\u017ean uticaj ne samo na svoje dru\u0161tvo u \u0161koli,
  nego i u crkvi i u drugim ustanovama.\\n\\n**ZA\u0160TITA TINEJD\u017dERA**\\n\\nRoditelji
  tinejd\u017eera treba da imaju dobru komunikaciju s roditeljima drugih tinejd\u017eera
  \u2013 treba, da tako ka\u017eemo, \u201ebiti na ti\u201c naro\u010dito s roditeljima
  tinejd\u017eera koji se dru\u017ee s njihovom decom. U dragocenoj ste prednosti
  ako mo\u017eete s drugim roditeljima da podelite informacije i brige i radite s
  njima na osiguravanju vo\u0111stva i kontrole mladim ljudima.\\n\\nSe\u0107am se
  mnogih doga\u0111aja kada je Keri bila pozivana na neke \u017eurke, a mi nismo znali
  ni\u0161ta o tome. Bili smo zahvalni \u0161to smo mogli da nazovemo druge roditelje
  koji su isto bili zabrinuti, pa su proverili primerenost zabave.\\n\\nKako roditelji
  mogu da znaju da li je izvesni doga\u0111aj primeren ili ne? Roditelji ne treba
  da oklevaju s podizanjem slu\u0161alice i postavljanjem pitanja, bez obzira na to
  ko organizuje doga\u0111aj. Na\u017ealost, moram da ka\u017eem da mnogi roditelji
  danas ne samo da opravdavaju nemoralne i \u0161tetne uticaje na mla\u0111e, nego
  ih i aktivno ohrabruju.\\n\\nNe treba da se pla\u0161ite da nazovete roditelje ili
  odraslu osobu koja je organizator i raspitate se za planirane aktivnosti. Kako druga\u010dije
  da kontroli\u0161ete i za\u0161titite va\u0161eg ranjivog tinejd\u017eera? A kada
  nazovete, obratite pa\u017enju na stav ili ton kojim vam ta osoba govori, jer je
  to obi\u010dno re\u010ditije od izgovorenih re\u010di. Na primer, kada roditelj
  ili organizator zvu\u010di prijatno ili \u010dak zahvalno \u0161to ste nazvali da
  se raspitate za va\u0161eg tinejd\u017eera, to je dobar znak. Divna stvar je kad
  vam neko ka\u017ee da je zahvalan \u0161to roditelj dovoljno brine o svom detetu
  i \u017eeli da zna \u0161ta se de\u0161ava. Kada to \u010dujem zahvalan sam Bogu
  \u0161to jo\u0161 uvek postoje pristojni roditelji ispunjeni ljubavlju i spremini
  za vo\u0111stvo.\\n\\nNa\u017ealost, mo\u017eete dobiti i druga\u010diji odgovor.
  Se\u0107am se kad sam pozvao majku koja je pravila zabavu, na koju je bila pozvana
  i Keri, koja je tada imala petnaest godina. Majka je na moje raspitivanje reagovala
  neprijateljski. Rekla je: \u201eOvo je privatna zabava. Va\u0161a \u010derka je
  pozvana i mo\u017ee da dode ili ne. To zavisi od nje, a \u0161to ja radim u sopstvenoj
  ku\u0107i, to je moja privatna stvar!\u201c Iz samog tona odgovora znao sam da njena
  ku\u0107a nije mesto ni za jednog tinejd\u017eera.\\n\\nMe\u0111utim, ja sam insistirao
  na pojedinostima. Rekao sam: \u201eShvatam. Ali ja se brinem za \u010derku i bio
  bih vam zahvalan kada biste mi dali podrobnije informacije o va\u0161oj zabavi.\u201c
  Do tada se majka ve\u0107 razljutila, ali sam svojom uporno\u0161\u0107u uspeo da
  saznam da \u0107e se tinejd\u017eerima poslu\u017eivati vino i alkoholna pi\u0107a
  u provokativnoj atmosferi ispunjenoj niskim emocijama.\\n\\nTo je danas ubo\u010dajeno.
  Ne mo\u017eete samo sedeti i pretpostaviti da \u0107e va\u0161 tinejd\u017eer biti
  pod zdravim uticajem samo zato \u0161to su aktivnosti \u201epod nadzorom\u201c.
  Morate da saradujete s drugim roditeljima da biste obezbedili zdrave aktivnosti,
  i da razgovarate o tome \u0161to se de\u0161ava s va\u0161om decom. Niko drugi to
  ne\u0107e uraditi za vas. Danas postoji mnogo uticaja za koje ne biste \u017eeleli
  da dosegnu va\u0161eg tinejd\u017eera.\\n\\n**PRIMERENOST I POVERENJE**\\n\\nDa
  biste kontrolisali i u\u010dili va\u0161eg tinejd\u017eera, morate imati na umu
  dve stvari. Prvo, dopustite mu privilegije zasnovane na poverenju. Drugo, poku\u0161ajte
  da se uverite da va\u0161 tinejd\u017eer mo\u017ee da se nosi s odre\u0111enom situacijom,
  pre nego \u0161to mu dozvolite da u\u0111e u nju.\\n\\nIako ovi saveti mogu da deluju
  protivure\u010dno, oni to nisu. Previ\u0161e roditelja se pri tome zbuni. Lak\u0161e
  im je da odrede privilegije na osnovu toga koliko imaju poverenja u tinejd\u017eera,
  a te\u017ee da provere okolnosti i primerenost nekog doga\u0111aja. Ako proveravate
  primerenost neke situacije ne zna\u010di da ne verujete va\u0161em tinejd\u017eeru.
  \u010cak i ako imate poverenje u tinejd\u017eera, ako je dobromeran i ima ispravne
  namere, ipak postoje situacije s kojima on ili ona ne mogu zrelo da se nose. U takvim
  slu\u010dajevima morate da za\u0161titi va\u0161eg tinejd\u017eera.\\n\\n\u0160to
  se ti\u010de one zabave na koju je bila pozvana Keri, mogao sam u nju da imam puno
  poverenje \u2013 iskreno je nameravala da se pona\u0161a primereno. Ali, tada je
  bila premlada i nezrela da se nosi s tako zahtevnom situacijom.\\n\\nKada sam joj
  rekao da ne mo\u017ee da ide na tu zabavu, njena prirodna reakcija je bila: \u201eZa\u0161to
  ne mogu?\u201c Pa\u017eljivo je istakla da se ranije pona\u0161ala uzorno i da zna
  kako da se primerno pona\u0161a, da \u0107e se definitivno tako pona\u0161ati i
  da mogu da joj verujem. Odgovorio sam joj da je potpuno u pravu. Bio sam ponosan
  na nju i znao sam da mogu da joj verujem. Me\u0111utim, znao sam da jo\u0161 nije
  spremna za tako te\u0161ku situaciju kao \u0161to je bila ta zabava. Ispri\u010dao
  sam joj svoje iskustvo iz mladosti i rekao da, iako sam imao uzorno pona\u0161anje
  kome se moglo verovati, ipak sam, kao svaka normalna osoba, bio izlo\u017een isku\u0161enjima.
  Verovatno bih bio u stanju da se nosim s bilo kakvim lo\u0161im dru\u0161tvenim
  okolnostima. Kao primer mogao sam da ispri\u010dam doga\u0111aj koji se zbio u mornarici,
  kada je trebalo da nadgledam podredene mornare za vreme njihovih \u201eveselih sati\u201c
  u striptiz i toples barovima. Ali, \u010dak i tada me \u0161titilo nekoliko spolja\u0161njih
  ograni\u010denja \u2013 uniforma mornari\u010dkog oficira i \u010dinjenica da odgovaram
  za sigurnost mojih vojnika.\\n\\nRekao sam joj da i pored polo\u017eenih ovih te\u0161kih
  ispita karaktera, ako ne budem trezven i ne budem pazio na svoj \u017eivot, bi\u0107u
  izlo\u017een isku\u0161enju iznad svojih snaga. Dakle, za\u0161to bih rizikovao
  da upropastim svoj integritet, karakter, brak, duhovno zajedni\u0161tvo, dobrobit
  moje dece i vlastiti \u017eivot? Istakao sam Keri da je to jedan od razloga za\u0161to
  ne idem u barove i diskoteke. Imam poverenja u sebe, ali nemam apsolutne garancije
  da mogu da se oduprem svakom isku\u0161enju. Ispri\u010dao sam joj za dobro poznatog
  sve\u0161tenika koji se ose\u0107ao pozvanim da deluje me\u0111u stalnim posetiocima
  barova. Nisam se iznenadio kad sam saznao da je promenio stil \u017eivota, koji
  je od njegove slu\u017ebe i braka napravio lakrdiju.\\n\\nMogao sam da ka\u017eem
  Keri da joj zaista verujem zbog ranijeg dobrog pona\u0161anja, ali da postoje izvesne
  situacije za koje jo\u0161 nije spremna \u2013 i neke koje svaka osoba koja ispravno
  razmi\u0161lja mora da izbegava.\\n\\n**Odlaganje**\\n\\nRecimo da tinejd\u017eeru
  dopustite neke privilegije na temelju poverenja koje u njega imate i da dobro ocenite
  primerenost situacije u kojoj \u0107e se na\u0107i. Detaljno mu objasnite ove kriterijume
  da bi mogao da zna za\u0161to ste doneli neku odluku, i da ne pomisli da ste naprosto
  svojevoljni. Ipak, to nije sasvim dovoljno. \u010cesto \u0107e vam biti te\u0161ko
  da donesete pravu odluku.\\n\\nSe\u0107am se kad je Keri imala petnaest godina;
  bila je pozvana na plivanje i da prove\u0111e dan na velikoj jahti. Zatim bi uve\u010de
  bila zabava na brodu. Moja \u017eena i ja smo zbog toga imali neke neprijatne misli.
  Dnevne aktivnosti su izgledale sasvim u redu, ali pomisao na tu zabavu nas je nekako
  uznemiravala. Znali smo da su roditelji koji \u0107e nadgledati zabavu bili razumni
  ljudi.\\n\\nDopustite mi da u ovom trenutku zastanem i dam dobar savet: ako ikada
  budete u situaciji da se ne ose\u0107ate prijatno zbog nastupaju\u0107eg doga\u0111aja
  na koji va\u0161 tinejd\u017eer \u017eeli da ide \u2013 a ipak ne mo\u017eete ta\u010dno
  re\u0107i za\u0161to \u2013 najbolji odgovor je da tada odluku odlo\u017eite.\\n\\nU
  takvoj situaciji obi\u010dno ka\u017eem: \u201eSlu\u0161aj, \u010deri ili sine,
  ovo nije tako jednostavno, dopusti mi da malo razmislim.\u201c U tinejd\u017eerskom
  svetu dogadaji i situacije se tako brzo smenjuju da se ovakva vrsta problema obi\u010dno
  re\u0161i sama od sebe. Mogu da se setim samo jedne ili dve situacije kad se problem
  nije re\u0161io sam od sebe. Druga prednost odlaganja je \u0161to \u0107e va\u0161
  tinejd\u017eer imati vremena da razmisli ponovo i mo\u017eda \u0107e da donese neke
  zrelije odluke. U slu\u010daju kad je Keri bila pozvana na zabavu na toj jahti,
  rekao sam: \u201ePusti me da razmislim.\u201c Keri je rekla: \u201eU redu, ali po\u017euri;
  moram da znam do \u010detvrtka.\u201c\\n\\nNa moju veliku \u017ealost, situacija
  se nije re\u0161ila sama od sebe. Diskutabilan doga\u0111aj je i dalje bio na dnevnom
  redu, vremenska prognoza je bila odli\u010dna i ve\u0107 je bio \u010detvrtak uve\u010de
  kada je Keri razdra\u017eljivim glasom pitala: \u201eKoji je tvoj odgovor, tata?
  Greg mora da zna ve\u010deras.\u201c\\n\\nImao sam uzasan ose\u0107aj u stomaku,
  jer nisam mogao da mislim nijedan opravdan razlog da ka\u017eem ne. Keri se pona\u0161ala
  uzorno. Ba\u0161 kad sam se spremao da je pustim, rekla je: \u201eTata, htela sam
  ne\u0161to da ti ka\u017eem.\u201c (Se\u0107ate li se tih presudnih re\u010di?)
  \u201eGreg ne mo\u017ee da dobije auto svojih roditelja da nas poveze na zabavu;
  treba da idemo njegovim starim autom s otvorenim krovom \u2013 zna\u0161 onaj \u0161to
  nema za\u0161titne pojaseve \u2013 a treba da predemo most za vreme gu\u017eve u
  pet sati.\u201c\\n\\nDrago mi je \u0161to sam je u tom trenutku pa\u017eljivo slu\u0161ao,
  jer sam odmah odgovorio: \u201e\u017dao mi je, ali ne mo\u017ee\u0161 na tu zabavu.\u201c\\n\\nKeri
  nije \u010dak ni pitala za\u0161to, nego je odmah telefonirala Gregu i rekla: \u201e\u017dao
  mi je, ne mogu da dodem na zabavu. Ota\u010d mi ne da.\u201c\\n\\nTinejd\u017eeri
  \u0107e sami mnogo puta da ponude razloge kada \u017eele da \u010duju negativan
  odgovor. Morate pa\u017eljivo da oslu\u0161kujete te razloge, jer se obi\u010dno
  pojavljuju kad je va\u0161em tinejd\u017eeru potreban izlaz iz te\u0161ke situacije
  s vr\u0161njacima. Kad vas upotreb\u00ed kao odbranu ili alibi u takvoj situaciji,
  stvori\u0107e se divan ose\u0107aj drugarstva izme\u0111u vas i va\u0161eg tinejd\u017eera.
  Treba da mu dozvolite da vas koristi na taj na\u010din. Naravno, treba da pazite
  da ne la\u017eete ili da mu ne dopustite da bude neiskren.\\n\\nKao \u0161to ste
  videli u Kerinoj situaciji, ona je nekako osetila da ne\u0107e mo\u0107i da se nosi
  sa situacijom na jahti i bio joj je potreban izgovor. Mo\u017eda sam se zbog te
  njene nelagodnosti i ja ose\u0107ao nelagodno. Ne znam. U svakom slu\u010daju jako
  sam zahvalan \u0161to je iskoristila na\u0161 roditeljski autoritet i izvukla se
  iz potencijalno nezdrave situacije.\\n\\n**GLE\u0110ANJE UNAPRED**\\n\\nPostoji
  jo\u0161 jedna dragocena strategija u vezi s tinejd\u017eerskom te\u017enjom za
  nezavisno\u0161\u0107u i pritiskom za dobijanje vi\u0161e slobode i povlastica.
  Stav roditelja prema razvoju njihovog deteta u nezavisnu li\u010dnost sna\u017eno
  uti\u010de na to kako \u0107e tinejd\u017eer reagovati na nadzor i autoritet.\\n\\nAko
  tinejd\u017eeru pridete poku\u0161avaju\u0107i da ga zadr\u017eite da zavisi od
  vas, mo\u017eda iz straha, i poku\u0161ate da ugu\u0161ite njegovu samostalnost
  u razvoju prema nezavisnosti, on \u0107e reagovati lo\u0161e. Ako se tinejd\u017eer
  prepusti isklju\u010divo va\u0161em stavu, to \u0107e ga ometati da se razvije u
  normalnu odraslu osobu i mo\u017eda \u0107e zauvek ostati pasivna, zavisna osoba.
  Ako odbije ovakav preterano za\u0161titni\u010dki stav, njegov odnos prema vama
  \u0107e se, naravno, pogor\u0161ati i rezultira\u0107e mnogim sukobima.\\n\\nKakvi
  onda treba da budu va\u0161 stav i va\u0161a filozofija? Najzdraviji stav je da
  taj put odrastanja u odgovornu, nezavisnu osobu do punoletstva, prolazite zajedni\u010dki
  s va\u0161im tinejd\u017eerom. Ako mu ovo jasno naglasite, da vi, u stvari, \u017eelite
  da on u datom roku postane nezavisan, i kako se trudite da mu u tome pomognete,
  razume\u0107e da ste na njegovoj strani, a ne protiv njega.\\n\\nTinejd\u017eera
  treba povremeno podsetiti na ovaj zajedni\u010dki trud, naro\u010dito kad \u017eeli
  da ide na neko mesto koje smatrate neprimerenim. Recimo da \u017eeli da ide na zabavu
  za koju ste se raspitali i ocenili da je neprimerena za njega. Pretpostavimo da
  ste mu zaista bili na raspolaganju i da ste njegovo\\n\\nemocionalno spremi\u0161te
  odr\u017eavali punim. Takode ste pri odlu\u010divanju o davanju povlastica imali
  na umu koliko poverenja mo\u017eete imati u njega. Primenili ste i na\u010delo odlaganja,
  ali se problem nije re\u0161io sam od sebe. Shvatate da sada morate re\u0107i ne.
  Shvatate da to tinejd\u017eer jednostavno ne\u0107e ili ne mo\u017ee da prihvati.\\n\\nOvo
  je pravo vreme za upotrebu strategije koju sam upravo opisao. Otkrio sam da je vrlo
  delotvorna u pomaganju tinejd\u017eeru da pravilno razmi\u0161lja, da razume da
  roditelji rade u njegovu korist i da ne poku\u0161avaju da ga spre\u010de u postizanju
  nezavisnosti. Prema mom iskustvu \u010dini se da se to te\u0161ko razdoblje naj\u010de\u0161\u0107e
  pojavljuje u \u0161esnaestoj godini. Tinejd\u017eer ima jak nagon za novim iskustvima.
  Koliko energi\u010dni treba da budete s ovom strategijom, zavisi od okolnosti.\\n\\nSe\u0107am
  se roditelja \u0161esnaestogodi\u0161njeg Rendija koji su bili kod mene na savetovanju
  jer je on bio krajnje odlu\u010dan da ide na o\u010digledno \u0161tetan koncert.
  Do tog trenutka oni su mogli prili\u010dno dobro da kontroli\u0161u njegovo pona\u0161anje
  i dru\u0161tveni razvoj, koriste\u0107i na\u010dela odlaganja i poverenja. Ali,
  sada je situacija bila druga\u010dija. Roditelji su skoro pristali da ga puste.
  Naravno, to bi bila velika gre\u0161ka. Treba da upamtimo da su tinejd\u017eeru
  potrebni roditelji koji \u0107e da ga kontroli\u0161u sve vreme. Dobro je da roditelji
  iz opravdanog razloga promene mi\u0161ljenje, ali ne da se predaju pred tinejd\u017eerovim
  zahtevima.\\n\\nPosavetovao sam ove prijatne roditelje da budu ne\u017eni ali odlu\u010dni
  kad Rendiju budu obja\u0161njavali da \u017eele da on postane nezavisan i sposoban
  da sam donosi odluke \u010dim to bude mogao. On je imao \u0161esnaest i po godina
  i imali su samo osamnaest meseci (svakako vreme prera\u010dunajte u mesece, tako
  izgleda da \u0107e to biti skorije), da od Rendija naprave potpuno nezavisnu osobu.
  Za samo osamnaest meseci on \u0107e po zakonu biti punoletna osoba i posle tog datuma
  mo\u017ee (pazite: recite mo\u017ee a ne da \u0107e \u2013 da ne biste sebe saterali
  u \u010do\u0161ak) se sam brinuti o sebi, zaradivati za \u017eivot, prona\u0107i
  mesto gde \u0107e \u017eiveti, sam prati ve\u0161, kuvati i tako dalje.\\n\\nAko
  ni ove \u010dinjenice ne pomognu tinejd\u017eeru da vas razume (uglavnom pomognu),
  i on nastavi da se protivi, mo\u017eete i\u0107i korak dalje i izjaviti da nemate
  zakonsku odgovornost za njega posle njegove osamnaeste godine \u2013 da nameravate
  da uradite sve \u0161to je u va\u0161oj mo\u0107i da ga pripremite za \u017eivot
  odraslih u narednih osamnaest meseci, jer se va\u0161a zakonska du\u017enost tada
  zavr\u0161ava. Budite sigurni da ste rekli \u201ezakonska\u201c da ne biste kasnije
  \u017ealili zbog svojih re\u010di, jer, naravno, roditelji imaju i druge odgovornosti
  prema deci (ne samo zakonske) i posle njihove osamnaeste godine.\\n\\nTa strategija
  je vrlo gruba prema tinejd\u017eerima i treba je upotrebljavati samo kao poslednju
  nadu u te\u0161kim okolnostima. Me\u0111utim, tinejd\u017eeri treba da budu svesni
  da je glavni cilj roditelja da ih pripreme da budu odgovorne i nezavisne odrasle
  osobe, a ne da ih spre\u010davaju u tome.\\n\\nTakov stav mo\u017ee se ista\u0107i
  na nekoliko na\u010dina. Na primer, otvaraju\u0107i mu teku\u0107i ra\u010dun i
  upla\u0107uju\u0107i mese\u010dni d\u017eeparac na njega. U\u010de\u0107i ga odgovornosti
  raspola\u017eanja novcem, na odli\u010dan na\u010din unapre\u0111ujete me\u0111usobnu
  saradnju, rade\u0107i tako na njegovoj nezavisnosti. U po\u010detku treba da bude
  odgovoran za kupovinu malog broja stvari. Kad postane odgovorniji treba mu postepeno
  dodati jo\u0161 neke stvari za koje \u0107e odgovarati, uz zamisao da do osamnaeste
  godine bude potpuno finansijski odgovoran.\\n\\nDrugi na\u010din unapredivanja ovog
  zajedni\u010dkog rada na razvijanju nezavisnosti va\u0161eg tinejd\u017eera je putem
  dobre komunikacije, razgovora o budu\u0107nosti, o tome \u0161to \u017eeli da radi
  posle \u0161kole, o kom pozivu razmi\u0161lja, da li \u017eeli da ide na fakultet
  i koji. Razgledanje fakulteta je vrlo delotvoran na\u010din podsticanja ose\u0107aja
  saradnje. Napretku poma\u017ee i omogu\u0107avanje nekog novog iskustva, kao \u0161to
  je novi sport ili hobi.\\n\\nPOSTAVLJANJE GRANICA\\n\\nPitanje koje roditelji \u010desto
  postavljaju glasi: koliko ograni\u010denja nametnuti tinejd\u017eeru za lo\u0161e
  pona\u0161anje. Tinejd\u017eeri, kao i deca, imaju nagla\u0161en ose\u0107aj pravednosti.
  Oni znaju kad su roditelji popustljivi, a kada su previ\u0161e grubi ili nerazumnii.
  Vidoa sam roditelje s oba kraja spektra. Neki su imali pote\u0161ko\u0107a u postavljanju
  \u010dvrstih granica i tinejd\u017eeri su lako manipulisali njima. Drugi roditelji
  su imali druga\u010diju taktiku i bili vrlo grubi. Znam tinejd\u017eerku koja godinu
  dana nije smela da izade iz ku\u0107e za kaznu \u0161to je oti\u0161la u kafi\u0107.
  Roditelji moraju da znaju da kazna treba da odgovara prekr\u0161aju. Zdrav razum
  mora da prevlada! Manja gre\u0161ka, kao \u0161to je petnaestominutno ka\u0161njenje
  posle sastanka opravdava zabranu kra\u0107u od nedelju dana. Ako se to ponovi, zabrana
  treba da bude produ\u017eena. Zabrane du\u017ee od dve nedelje su retko opravdane,
  a mesec dana je krajnja granica. Ako su zabrane \u010deste, a naro\u010dito ako
  traju du\u017ee od jedne nedelje, ne\u0161to nije u redu \u2013 verovatno roditeljska
  o\u010dekivanja, odnos izme\u0111u roditelja i tinejd\u017eera, ili druge mogu\u0107nosti
  o kojima \u0107emo razgovarati kasnije.\\n\\nIznad svega, zapamtite da je mnogo
  lak\u0161e disciplinovati i kontrolisati tinejd\u017eere koji se vole na ispravan
  na\u010din nego one koji nisu tako voljeni. Njihova emocionalna spremi\u0161ta moramo
  da odr\u017eavamo punim.\\n\\nRODITELJSKA SUSRETLJIVOST\\n\\nSlede\u0107e \u010dega
  treba da budemo svesni jeste veliki zna\u010daj obzirnosti i ljubaznosti prema njihovim
  vr\u0161njacima. Treba da budete srda\u010dni bez obzira \u0161ta mislite o njima.
  Mnogi bespotrebbni problemi javljaju se kao neposredan rezultat roditeljskog neprijateljstva
  prema tinejd\u017eerovim vr\u0161njacima. Zapamtite, roditelji su osobe od autoriteta.
  Mnogi tinejd\u017eeri \u0107e postepeno sa\u017ealjevati vr\u0161njaka prema kome
  je roditelj lo\u0161e postupio i stati na njegovu stranu bez obzira na okolnosti.\\n\\nJedan
  od najtragi\u010dnijih primera dogodio se u porodici Dempsi. D\u017eejn je izlazila
  s de\u010dkom koji je nervirao njene roditelje. Bio je nekoliko godina stariji od
  nje i znalo se da prodaje drogu. Bio je takode nabusit i nije po\u0161tovao autoritete.\\n\\nZbog
  nekoliko razloga, od kojih je najva\u017eniji bio taj \u0161to su njeni roditelji
  bili izuzetno neprijateljski nastrojeni prema de\u010dku, D\u017eejn se upilitala
  u vezu s njim sve dublje i dublje. To je, naravno, roditeljima slamalo srce.\\n\\nAko
  ste prijatni prema svakome, uklju\u010duju\u0107i vr\u0161njake va\u0161eg tinejd\u017eera,
  to vam se na kraju isplati. Pre svega va\u0161 tinejd\u017eer \u0107e umeti to da
  ceni i ima\u0107e slobodu da i ostale drugare dovede ku\u0107i. Drugi tinejd\u017eeri
  \u010desto imaju problema u komunikaciji s roditeljima. Oni vrlo \u010desto tra\u017ee
  druge odrasle s kojima bi uspostavili odnos. Predivno je iskazati prijateljstvo
  prijateljima va\u0161eg tinejd\u017eera. Ne samo da time poma\u017eete njima, ve\u0107
  postajete bliskiji s va\u0161im tinejdzerom.\\n\\nNa kraju, kad se prijatno odnosite
  prema \u201e\u0161tetnim\u201d vr\u0161njacima, ne\u0107ete va\u0161eg tinejd\u017eera
  gurnuti prema njima, kao \u0161to su u\u010dinili Dempsijevi.\\n\\nU stvari, obi\u010dno
  se dogada to da vam tinejd\u017eer posle pride s pitanjima koja se odnose na njegove
  vr\u0161njake. On \u0107e \u017eeleti da \u010duje va\u0161e mi\u0161ljenje o njima.
  Zatim \u0107e ga saslu\u0161ati. Ali, ako ste neprijateljski nastrojeni prema njegovim
  vr\u0161njacima, on \u0107e izbegavati da razgovara o tome s vama, a time \u0107e
  se umanjiti i va\u0161 uticaj na njega.\\n\\nNENORMALNE OKOLNOSTI\\n\\nOno o \u010demu
  smo dosad govorili odnosi se na normalne okolnosti. Me\u0111utim, roditelji se ponekad
  suo\u010davaju s problemima koji nisu normalni.\\n\\nAko je s tinejd\u017eerom,
  uprkos bezuslovnoj ljubavi i pozivima na razboritost, te\u0161ko iza\u0107i na kraj,
  verovatno ima ozbiljnijih problema i potrebna mu je pomo\u0107 van porodice.\\n\\nPostoji
  nekoliko problema u pona\u0161anju tinejd\u017eera s kojima roditelji ne mogu da
  izadu na kraj. Jedan od njih je depresija, koja u tinejd\u017eerskom uzrastu mo\u017ee
  da bude slo\u017eena i podmukla. Drugi problem s kojim se sve \u010de\u0161\u0107e
  susre\u0107emo su poreme\u0107aji mi\u0161ljenja ili te\u0161ko\u0107e s kontrolisanjem
  misli. Jo\u0161 jedan problem koji zahteva profesionalnu pomo\u0107 su neurolo\u0161ki
  poreme\u0107aji koji rezultiraju emocionalnim te\u0161ko\u0107ama.\\n\\nLekar treba
  da bude svestan mogu\u0107ih poreme\u0107aja li\u010dnosti. Pokazatelj mo\u017ee
  da bude nesposobnost tinejd\u017eera da primereno kontroli\u0161e gnev. Tako\u0111e
  mo\u017ee biti te\u0161ko nadzirati tinejd\u017eerovo pona\u0161anje zbog problema
  u dinamici porodi\u010dnih odnosa. U stvari, probleme pona\u0161anja mo\u017ee izazvati
  ili pogor\u0161ati bilo koja kombinacija ovih faktora. S obzirom na to da su problemi
  tinejd\u017eera skloni umno\u017eavanju i komplikovanju, mudar roditelj \u0107e
  potra\u017eiti pomo\u0107 pre nego \u0161to oni postanu ozbiljni. Ve\u0107inu problema
  uz roditeljsku saradnju mogu re\u0161iti iskusni terapeuti.\\n\\nProteklih godina
  stru\u010dnjaci iz podru\u010dja obrazovanja, medicine i mentalnog zdravlja krupnim
  koracima napreduju u razumevanju slo\u017eenog problema poznatog kao manjak ili
  nedostatak pa\u017enje \u2013 hiperaktivni poreme\u0107aj. Ovdje imamo prostora
  samo da nazna\u010dimo nekoliko presudnih ta\u010daka.\\n\\nPre svega, \u017eao
  mi je \u0161to tu nesre\u0107nu decu smatraju nenormalnom. Video sam na stotine
  ovakve dece i oni nisu \u201enenormalni\u201c. Skoro svi imaju jedinstvene darove,
  ali retko mogu da ih otkriju zbog problema u \u0161koli, problema sa samopouzdanjem,
  depresijom i/ili pasivno-agresivnim pona\u0161anjem. Ta deca su rodena sa dva osnovna
  \u201eproblema\u201c. Jedan je \u201ehiperaktivnost\u201c, koji ozna\u010dava kratku
  usredsredenost. Oni imaju problema da se usredsrede na teme koje bi trebalo da savladaju
  u skladu sa svojim intelektualnim mogu\u0107nostima.\\n\\nDrugo, ova mlada dece
  i tinejd\u017eeri imaju \u201eperceptualne probleme\u201c, \u0161to ne zna\u010di
  da postoji ne\u0161to nenormalno s njihovim o\u010dima ili usima. Mozak prima informacije,
  ali ih za vreme procesuiranja iskrivi. Dok dopre do detetove svesti, promeni se
  u odnosu na ono \u0161to je videlo ili \u010dulo (iskriviljenost je razli\u010dita
  kod svakog deteta).\\n\\nOvdje nemamo ni vremena ni prostora da dublje proniknemo
  u razloge, ali va\u017eno je znati da iskriviljeno opa\u017eanje uzrokuje da se
  svako dete s pomanjkanjem pa\u017enje ose\u0107a nevoljenim i ne\u017eeljenim. Mlada
  dece i tinejd\u017eeri s perceptualnim problemima pogre\u0161no percipiraju ose\u0107anja
  drugih, kao \u0161to pogre\u0161no percipiraju podatke iz \u0161kolskog gradiva.
  Na\u017ealost, dece s nedostatkom pa\u017enje percipiraju na\u0161a ose\u0107anja
  prema njima kao negativna. Zbog toga je te\u0161ko u\u010diniti da se takvo dete
  ose\u0107a iskreno voljenim i zbrinutim. To opet, kako dete raste, uzrokuje sve
  ve\u0107u depresiju i gnev. Kona\u010dno, depresija i gnev (koji se obi\u010dno
  manifestuju pasivnoagresivnom pona\u0161anjem), postaju toliko jaki da postaju najve\u0107i
  problemi deteta (i roditelja). To se mo\u017ee desiti u bilo kom uzrastu, ali depresija
  postaje ozbiljan problem oko desete godine, a pasivno-agresivno pona\u0161anje se
  pogor\u0161ava kad dete u\u0111e u adolescenciju. U tom razdoblju normalno pasivno-agresivno
  pona\u0161anje tinejd\u017eera se dodaje pasivno-agresivnom pona\u0161anju proizilalom
  iz nedostatka pa\u017enje i takvi tinejd\u017eeri su skloni te\u0161koj adolescenciji.
  Bo\u017ee, pomozi toj deci i njihovim roditeljima.\\n\\nNadam se da iz navedenog
  mo\u017eete da uvidite koliko je va\u017eno da shvatite da su dece s manjom pa\u017enjom
  normalna, ali sklona depresiji i pasivnoagresivnom pona\u0161anju, a u poredenju
  s tim, manje su va\u017eni hiperaktivnost i te\u0161ko\u0107e u u\u010denju. Na
  \u017ealost, ve\u0107ina dece s nedostatkom pa\u017enje kao pomo\u0107 prima samo
  posebno obrazovanje i lekove. Primerno i pa\u017eljivo vo\u0111eno specijalno obrazovanje
  i lekovi mogu biti od pomo\u0107i, ali mnogo va\u017enija i potencijalno razornija
  depresija i pasivno-agresivno pona\u0161anje se uveliko zanemaruju.\\n\\nDragi roditelji
  dece s nedostatkom pa\u017enje, molim vas budite uvereni da, ako va\u0161 tinejd\u017eer
  dobija sve \u0161to mu je potrebno, na kraju \u0107e biti sve u redu. Zapamtite,
  ovo je dugotrajan proces, jer je re\u010d o razvojnom procesu. Nastavite da mu obezbijedujete
  sve \u0161to mu je potrebno svakog dana. Uop\u0161teno, evo \u0161ta treba da uradite:\\n\\n1.
  Prou\u010davajte, u\u010dite o nedostatku pa\u017enje koliko god mo\u017eete. Shvatite
  koliko god mo\u017eete.\\n\\n2. Shvatite da va\u0161e dete s nedostatkom pa\u017enje
  nije nenormalno, ve\u0107 je sklono problemima u nekim podru\u010djima. Zapamtite,
  nijedno dete nije savr\u0161eno.\\n\\n3. Molim vas \u010ditajte ponovo i ponovo
  \u2013 \u010dak ga nau\u010dite napamet! \u2013 deveto poglavlje o tinejd\u017eerskoj
  depresiji. U suprotnom ne\u0107ete uo\u010diti trenutak kad va\u0161e dete postane
  depresivno i kad mu zatreba pomo\u0107. Ako depresija poprimi umereni stepen, potra\u017eite
  stru\u010dnu pomo\u0107 \u0161to je pre mogu\u0107e.\\n\\n4. Ovo mo\u017ee zvu\u010dati
  preterano, ali molim vas pa\u017eljivo \u010ditajte \u0161esto i sedmo poglavlje
  nedelju dana neposredno pre spavanja. Upravljanje tinejd\u017eerovim gnevom je po
  mom mi\u0161ljenju najte\u017ei deo odgajanja. Ako ta dva poglavlja pro\u010ditate
  samo jednom, verovatno \u0107ete dobro postupati nekoliko dana, ali \u0107ete se
  postepeno vratiti neprimerenim reakcijama na detetov gnev. Zato vas molim da ih
  \u010ditate no\u0107ima, odlu\u010dni da zadr\u017eite ispravan \u201estav uma\u201c
  u svih dvadeset \u010detiri sata. Morate da budete dosledni.\\n\\n5. Zapamtite da
  je vrlo te\u0161ko u\u010diniti da se dete s manjkom pa\u017enje ose\u0107a iskreno
  voljenim. Moramo vrlo marljivo da primenimo osnovne na\u010dine izra\u017eavanja
  ljubavi detetu (gledanje u o\u010di, fizi\u010dki dodir, usredsredenu pa\u017enju
  i disciplinovanje ispunjeno ljubavlju). Takode treba da zapamtite da takvo dete
  mo\u017ee pogre\u0161no da razume fizi\u010dku kaznu i da je smatra nasiljem, koje
  \u0107e zatim opravdavati kao vlastito nasilje.\\n\\n9. MLADALA\u010cKA DEPRESIJA\\n\\nMladala\u010dka
  depresija je slo\u017een, podmukao i opasan fenomen. Slo\u017een je zbog brojnih
  komplikovanih uzroka i posledica. Podmukao je jer skoro uvek pro\u0111e neopa\u017eeno,
  \u010dak i od tinejd\u017eera koji ga pro\u017eivljava, sve dok ne dode do tragedije.
  Opasan je jer depresija mo\u017ee da rezultira najgorim pojavama \u2013 od neuspeha
  u \u0161koli do samoubistva.\\n\\nTokom godina video sam mnoge tinejd\u017eere koji
  su poku\u0161ali da se povrede ili ubiju. Obi\u010dno su njihovi roditelji ili prijatelji
  o\u0161amu\u0107eni ili \u0161okirani u neverici zbog tog \u010dina. Ti nesre\u010dni
  ljudi su verovali da je s njihovim tinejd\u017eerom sve u redu, nikada i ne pomi\u0161ljaju\u0107i
  da je on toliko nesre\u0107an.\\n\\nTinejd\u017eersku depresiju je te\u0161ko prepoznati,
  jer se njeni simptomi razlikuju od klasi\u010dnih simptoma depresije odraslih. Na
  primer, blago depresivni tinejd\u017eer pona\u0161a se i govori normalno. Ne postoje
  spolja\u0161nji znaci depresije. Blaga tinejd\u017eerska depresija manifestuje se
  putem tmurnih fantazija, sanjanja ili mra\u010dnih snova. Blagu depresiju mo\u017ee
  da prepozna samo neko ko poznaje na\u010din razmi\u0161ljanja tinejd\u017eera i
  sadr\u017eaj njegovih misli. Samo mali broj profesionalaca mogu da otkriju depresiju
  u tom stadijumu.\\n\\nUmereno depresivni tinejd\u017eer se tako\u0111e pona\u0161a
  i govori normalno. Me\u0111utim, umerna depresija uti\u010de na teme o kojima \u0107e
  tinejd\u017eer razgovarati. Uglavnom su to depresivne teme kao \u0161to su smrt,
  morbidni problemi i krize. S obzirom na to da danas mnogi odrasli razmi\u0161ljaju
  na pesimisti\u010dan na\u010din, tinejd\u017eerova depresija mo\u017ee da pro\u0111e
  neopa\u017eeno.\\n\\nPre nekoliko godina zabrinuta majka me je nazvala zbog svog
  \u010detrnaestogodi\u0161njeg sina. Nije bila sigurna da li mu je potrebna pomo\u0107.
  Ta majka, puna ljubavi, mi je rekla da se on pona\u0161a normalno, izgleda normalno
  i pri\u010da normalno \u2013 da sve izgleda dobro \u2013 osim \u0161to posle gledanja
  vesti ka\u017ee ne\u0161to sli\u010dno ovome: \u201eStvari postaju sve gore u svetu,
  pitam se da li bi bilo bolje biti mrtav.\u201c Pokazalo se da je taj pristojni de\u010dko
  umerno depresivan.\\n\\nUmerena depresija mo\u017ee ozbiljno da onesposobi odrasle.
  Mo\u017ee da izazove ozbiljne poreme\u0107aje spavanja i hranjenja, i onesposobi
  za obavljanje raznih du\u017enosti, od roditeljskih do profesionalnih. Mo\u017ee
  da dovede do ozbiljnih posledica, \u010dak i do samoubistva.\\n\\nUmerena depresija
  tinejd\u017eera je jednako ozbiljna kao i depresija odraslih. Biohemijski i neurohormonski
  su iste. Ali, prime\u0107uje se koliko se razli\u010dito manifestuju i imaju razli\u010dite
  simptome. Umereno depresivna odrasla osoba obi\u010dno izgleda lo\u0161e, ose\u0107a
  se bedno i nesposobna je za ve\u0107inu svakodnevnih obaveza, ali tinejd\u017eer
  izgleda depresivno uglavnom samo u te\u0161koj depresiji. Kada mo\u017eemo da ka\u017eemo:
  \u201e\u010cove\u010de, kako ovo dete izgleda depresivno!\u201c tada se s pravom
  treba pretpostaviti da je taj tinejd\u017eer te\u0161ko depresivan i verovatno sklon
  samoubistvu.\\n\\nMe\u0111utim, i ovde postoje izuzeci. Tinejd\u017eersku depresiju
  je te\u0161ko prepoznati, jer su tinejd\u017eeri dobri u \u201emaskiranju\u201c;
  to jest, mogu je sakriti pona\u0161aju\u0107i se kao da su dobro, \u010dak i onda
  kad se ose\u0107aju sasvim jadno. To se \u010desto zove depresija s osmehom. Tinejd\u017eeri
  nesvesno stavljaju tu masku. Skrivaju depresiju pre svega kad su prisutni drugi
  ljudi. Kad je depresivni tinejd\u017eer sam, opusti se i bar donekle skine tu masku.\\n\\nTo
  poma\u017ee roditeljima. Ako posmatramo na\u0161e tinejd\u017eere kad oni misle
  da ih niko ne gleda, mo\u017eemo da prepoznamo depresiju. Zapanjuju\u0107e je videti
  transformaciju na licu. Kad su sami, izgledaju u\u017easno tu\u017eno i jadno. \u010cim
  pomisle da ih neko gleda, smesta se pojavljuje nasme\u0161ena maska kao da je sve
  u redu. Ovo je jedan od na\u010dina prepoznavanja depresije, mada ne i najbolji.\\n\\nOTKRIVANJE
  DEPRESIJE\\n\\nKako onda mo\u017eemo da otkrijemo tinejd\u017eerovu depresiju i
  preduzmemo ne\u0161to u vezi s njom pre nego \u0161to dode do tragedije? Najva\u017enije
  je da je prepoznamo \u0161to pre, jer ona danas mo\u017ee da na\u0161kodi deci na
  mnogobrojne na\u010dine. Depresivni tinejd\u017eer je podlo\u017ean \u0161tetnom
  pritisku vr\u0161njaka, potencijalna je \u017ertva droge, alkohola, neprikla\u0111nih
  seksualnih iskustava, mo\u017ee se upustiti u kriminalne radnje i druge antisocijalne
  oblike pona\u0161anja, uklju\u010duju\u0107i i samoubistvo.\\n\\nNajbolji na\u010din
  prepoznavanja depresije kod tinejd\u017eera je da nau\u010dite koji su razli\u010diti
  simptomi depresije i kako se razvijaju. Va\u017eno je shvatiti celu i detaljnu sliku
  simptoma, jer jedan ili dva simptoma mogu, a i ne moraju da ozna\u010davaju istinsku
  depresiju. Istinska depresija je biohemijski i neurohormonski proces koji se kod
  tinejd\u017eera obi\u010dno razvija polako, tokom nekoliko nedelja ili meseci.\\n\\nPre
  nego \u0161to razmotrimo pojedina\u010dne simptome adolescentske depresije, treba
  da razumemo da depresivni adolescent mo\u017ee da ima jedan ili vi\u0161e klasi\u010dnih
  simptoma depresije odraslih, uklju\u010duju\u0107i ose\u0107aj bespomo\u0107nosti,
  beznade\u017enosti, malodu\u0161nosti i o\u010daja; probleme sa spavanjem (ili previ\u0161e
  ili premalo sna); probleme sa ishranom (prekomerna ili nedovoljna, gojenje ili mr\u0161avljenje),
  nedostatak energije, nedostatak samopo\u0161tovanja, probleme s obuzdavanjem gneva.\\n\\nRazmotrimo
  sada specifi\u010dne simptome adolescentske depresije:\\n\\n1. **Problemi sa usredsre\u0111ivanjem.**
  Prvi simptom blage tinejd\u017eerske depresije je skra\u0107ivanje trajanja pa\u017enje.
  Tinejd\u017eer ne mo\u017ee dugo da se usredsredi na jednu temu. Misli mu be\u017ee
  od onoga na \u0161to \u017eeli da se usredsredi i postaje sve rastreseniji. Sve
  \u010de\u0161\u0107e uhvati sam sebe kako sanjari. Ovaj problem sa skra\u0107enom
  pa\u017enjom obi\u010dno postaje o\u010digledan kad tinejd\u017eer poku\u0161a da
  uradi doma\u0107i zadatak. Sve mu je te\u017ee da misli na to \u0161to radi. I \u010dini
  mu se da sve manje posti\u017ee \u0161to se vi\u0161e trudi. To naravno dovodi do
  frustracije, i tinejd\u017eer tada sebe krivi \u0161to je \u201eglup\u201c i \u201etup\u201c.
  Zato pretpostavlja da je intelektualno nesposoban da uradi doma\u0107i zadatak.
  Zamislite kako to deluje na njegovo samopo\u0161tovanje.\\n\\n2. **Sanjarenje.**
  Skra\u0107ivanje pa\u017enje pogada tinejd\u017eera i u \u0161koli. U po\u010detku
  \u0107e mo\u017eda mo\u0107i da ve\u0107i deo vremena posveti zadacima, a ostatak
  \u010dasa da prove\u0111e sanjare\u0107i. Kako se depresija produbljuje i pa\u017enja
  postaje sve kra\u0107a, tinejd\u017eer pridaje sve manje pa\u017enje zadacima, a
  sve vi\u0161e sanjari. U toj fazi, u\u010ditelj mo\u017ee najlak\u0161e da prepozna
  depresiju. Na\u017ealost, sanjarenje se obi\u010dno protuma\u010di kao lenjost ili
  lo\u0161e pona\u0161anje. Me\u0111utim, samo jedan ili dva simptoma ponaosob, kao
  \u0161to su sanjarenje ili skra\u0107enja pa\u017enja, nisu dovoljni da se postavi
  dijagnoza istinske adolescentske depresije. Treba da razmotrimo postepeni razvoj
  sklopa simptoma.\\n\\n3. **Slab uspeh u \u0161koli.** Kad se tinejd\u017eerova pa\u017enja
  skra\u0111uje, a sanjarenje produ\u017euje, prirodno je da \u0107e imati slabije
  ocene. Na\u017ealost, to slabljenje ocena je toliko postepeno da ga je te\u0161ko
  primetiti. Zbog toga ga retko povezuju s depresijom. U stvari, tinejd\u017eeri,
  roditelji i u\u010ditelji obi\u010dno pretpostave da je sam rad za tinejd\u017eera
  previ\u0161e te\u017eak ili da ga vi\u0161e interesuju druge stvari. Pomoglo bi
  kad bi se ocene naglo i drasti\u010dno pokvarile. To bi izazvalo primerenu zabrinutost.
  Me\u0111utim, ovakva promena uglavnom nije uo\u010dljiva. Zbog toga se depresija
  retko uzima u obzir.\\n\\n4. **Dosadivanje.** Kada tinejd\u017eer sve vi\u0161e
  i vi\u0161e sanjari, postepeno zapada u stanje dosade. Dosadivanje je normalno za
  tinejd\u017eere, naro\u010dito u ranoj adolescenciji, ali samo u kratkom vremenskom
  periodu. Normalno dosadivanje obi\u010dno traje sat ili dva, ponekad cele ve\u010deri
  ili dana, a povremeno \u010dak i dva dana. Ali, dosadivanje koje traje nekoliko
  dana ili vi\u0161e, nije normalno i treba da nam bude upozorenje da ne\u0161to nije
  u redu. Malo stvari me zabrinjavaju kao pro\u017eu\u0111eno dosadivanje, naro\u010dito
  u ranoj adolescenciji. Dosadivanje se kod tinejd\u017eera manifestuje tako \u0161to
  on \u017eeli sve vi\u0161e vremena da provodi sam u svojoj sobi. On tada samo le\u017ei
  na krevetu, sanjare\u0107i i slu\u0161aju\u0107i muziku.\\n\\nTinejd\u017eer koji
  se dosaduje gubi interesovanje za sve one stvari u kojima je nekad u\u017eivao,
  na primer \u2013 sport, ode\u0107u, automobile, hobi, crkvu, dru\u0161tvene aktivnosti
  i izlazke.\\n\\n5. **Somatska depresija.** Kako se dosadivanje nastavlja i produbljuje,
  tinejd\u017eer postepeno upada u umerenu depresiju. Tada po\u010dinje da pati od
  ne\u010dega \u0161to ja zovem somatskom depresijom. Koristim ovaj izraz jer, iako
  je svaka depresija fiziolo\u0161ka, ili ima biohemijsku-neurohormonsku osnovu, kod
  deteta po\u010dinju da se javljaju jasni telesni simptomi. Na primer, umereno depresivni
  tinejd\u017eer po\u010dinje da ose\u0107a fizi\u010dki bol. Ta bol se pojavljuje
  na mnogim mestima, ali naj\u010de\u0161\u0107e u grudima ili kao glavobolja. Mnogi
  tinejd\u017eeri uz depresiju trpe bol u grudima i/ili u glavi.\\n\\n6. **Povla\u010denje.**
  U takvom jadnom stanju, tinejd\u017eer mo\u017ee da se povu\u010de od vr\u0161njaka.
  Da bi stvari bile jo\u0161 gore, on ih ne\u0107e jednostavno izbegavati, nego se
  mo\u017ee otuditi od njih, iskazuju\u0107i neprijateljstvo, ratobornost, neljubaznost.
  Kao rezultat, tinejd\u017eer postaje veoma usamljen, a s obzirom na to da je odbacio
  stare prijatelje, radije se dru\u017ei s polupoznatim vr\u0161njacima koji mogu
  da uzimaju drogu i/ili su \u010desto u nevolji. Situacija postaje jo\u0161 vi\u0161e
  zastra\u0161uju\u0107a.\\n\\nKada se dosadivanje pojavi jednom tokom du\u017eeg
  vremena, mo\u017ee se razviti mnogo toga. Mentalni i fizi\u010dki bol u toj fazi
  mogu biti veoma mu\u010dni, a povremeno i nepodno\u0161ljivi. Tinejd\u017eer u toj
  fazi ne mo\u017ee beskona\u010dno da podnosi svoju bedu. Kona\u010dno postaje toliko
  o\u010dajan da ho\u0107e da uradi ne\u0161to u vezi sa svojom bedom. Zapanjuju\u0107e
  je da je i tada tinejd\u017eer jedva svestan svoje depresije. Tinejd\u017eerova
  sposobnost da se skriva iza poricanja je potpuno neverovatna. Zbog toga se retko
  sumnja na depresiju dok ne dode do tragedije.\\n\\n**IZRA\u017dAVANJE DEPRESIJE**\\n\\nKad
  je tinejd\u017eer umereno do te\u0161ko depresivan, do te mere da vi\u0161e ne mo\u017ee
  da izdr\u017ei, poku\u0161a\u0107e ne\u0161to da uradi da bi ubla\u017eio svoju
  bedu i bol. Tinejd\u017eerova dela koja proizilaze iz depresije nazivaju se \u201eizra\u017eavanjem
  depresije\u201c. Postoji mnogo na\u010dina da tinejd\u017eer izrazi svoju depresiju.\\n\\nMladi\u0107i
  su skloniji nasilju od devojaka. Oni poku\u0161avaju da ubla\u017ee simptome depresije
  kradom, laganjem, tu\u0107om, brzom vo\u017enjom, ili drugim oblicima dru\u0161tveno
  neprihvatljivog pona\u0161anja. Jedna od naj\u010de\u0161\u0107ih vrsta kriminalnog
  pona\u0161anja koja se danas vida me\u0111u mladi\u0107ima je provaljivanje. Raditi
  ne\u0161to uzbudljivo i opasno izgleda ka da nekako ubla\u017eava bol depresije.
  Provaljivanje u ku\u0107e donosi da\u0161ak uzbudjenja i zbog toga to uglavnom rade
  depresivni mladi\u0107i.\\n\\nNaravno postoje i drugi razlozi zbog kojih mladi\u0107i
  provaljuju u ku\u0107e. Zbog toga, kad mi dode tinejd\u017eer zbog provaljivanja,
  moja prva briga je da otkrijem koliku je ulogu u njegovom pona\u0161anju imala depresija.
  To je va\u017eno jer depresivni tinejd\u017eer uglavnom ne odgovara dobro na pomo\u0107,
  ako se istovremeno ne le\u010di i depresija. Potpuno je nemarno prevideti depresiju
  kod ovih mladih ljudi. Na\u017ealost, ve\u0107ina ustanova koja se bavi tinejd\u017eerima
  usredstvuje se na pona\u0161anje i nisu svesni depresivne komponente u problemu
  tog deteta.\\n\\nDevojke ispoljavaju svoju depresiju na manje nasilan na\u010din.
  Me\u0111utim, zbog nezdravih uzora u medijima, okrenutih ka nasilju, ovaj trend
  se menja. Devojke \u010desto svoju depresiju izra\u017eavaju seksualnim promiskuitetom.
  One ubla\u017eavaju depresivni bol u toku bliskog fizi\u010dkog odnosa. Me\u0111utim,
  te nesre\u0107ne devojke se obi\u010dno posle odnosa ose\u0107aju jo\u0161 gore
  \u2013 jo\u0161 depresivnije nego \u0161to su bile ranije, zbog samoponi\u017eenja.
  Depresija i nedostatak samopo\u0161tovanja uglavnom su osnova devoja\u010dkog promiskuiteta.
  Zapanjuju\u0107e je koliko mo\u017eemo da pomognemo devojci s ovom vrstom problema,
  samo ako se pobrinemo za njenu depresiju. Isto tako, malo joj mo\u017eemo pomo\u0107i
  ako zanemarimo depresiju.\\n\\nDepresivni tinejd\u017eer, tako\u0111e, mo\u017ee
  da izrazi svoju depresiju drogiraju\u0107i se. Marihuana i depresija su vrlo opasna
  kombinacija, jer marihuana \u010dini da se depresivni tinejd\u017eer ose\u0107a
  bolje.\\n\\nMarihuana nije antidepresiv. Ona blokira bol depresije. Na\u017ealost,
  tinejd\u017eer se ose\u0107a bolje samo zato \u0161to slabije ose\u0107a bol. Naravno,
  kad marihuana prestane da deluje, depresivna bol se vra\u0107a. Da bi zatim mogao
  da postigne isti stepen olak\u0161anja boli, tinejd\u017eer mora posle da uzme ve\u0107u
  koli\u010dinu. To je uobi\u010dajen na\u010din navikavanja na marihuanu, a tinejd\u017eer
  tada postaje \u201epu\u0161a\u010d trave\u201c. Druge droge mogu da deluju na njega
  na isti na\u010din. Kad poku\u0161avamo da pomognemo tinejd\u017eeru koji se drogira,
  moramo da ustanovimo koliku ulogu u tom drogiranju ima depresija. Ja sam iskreno
  uznemiren koliko mnogi profesionalci i ustanove koje se bave problemima tinejd\u017eera
  s drogom, zanemaruju i umanjuju zna\u010daj depresije.\\n\\nDrugi na\u010din na
  koji depresivni tinejd\u017eer mo\u017ee da izrazi depresiju je poku\u0161aj samoubistva.
  Ponekad je poku\u0161aj samoubistva samo gest u kome tinejd\u017eer ne \u017eeli
  stvarno da umre, ve\u0107 \u017eeli da privu\u010de pa\u017enju. Me\u0111utim, postoje
  i iskrene namere da se umre. Devojke mnogo \u010de\u0161\u0107e poku\u0161avaju
  da se ubiju od mladi\u0107a, ali mladi\u0107i su mnogo uspe\u0161niji u tome. Devojke
  uop\u0161teno poku\u0161avaju da se ubiju na manje nasilan na\u010din, kao \u0161to
  je recimo trovanje tabletama. Mladi\u0107i, s druge strane, to rade na nasilan na\u010din.
  To naravno omogu\u0107ava lak\u0161e spa\u0161avanje devojaka pri njihovim poku\u0161ajima.
  Me\u0111utim, video sam i mnogo devojaka koje su bile vrlo blizu smrti ili su zaista
  umrle. Kakva tragedija!\\n\\n**LEK ZA BLAGU DEPRESIJU**\\n\\n\u0160ta mo\u017eemo
  da uradimo da bismo pomogli na\u0161im depresivnim tinejd\u017eerima? Pre svega,
  moramo na vreme da otkrijemo depresiju da bismo spre\u010dili tragediju. To zna\u010di
  da moramo biti upoznati sa simptomima adolescentske depresije. Ljudi kojima je ova
  informacija najpotrebnija su roditelji i ljudi koji rade s tinejd\u017eerima, u\u010ditelji,
  \u0161kolski savetnici i ostali koji rade s mladima. Kada je depresija blaga, relativno
  lako je zastaviti taj podmukli proces i ubla\u017eiti je.\\n\\nIako ve\u0107i deo
  mladala\u010dke depresije ima slo\u017eene uzroke, \u010desto postoji poseban faktor
  ili doga\u0111aj koji na kraju slomi tinejd\u017eera i pokrene celokupni sklop simptoma.
  To na primer, mo\u017ee da bude smrt ili bolest, ili odlazak neke osobe koja dosta
  zna\u010di tinejd\u017eeru, razo\u010daranje kao \u0161to je razvod ili svada roditelja,
  ili selidba na ne\u017eeljeno mesto. U takvim situacijama, tinejd\u017eer se ose\u0107a
  usamljeno, napu\u0161teno i nevoljeno. Pre svega, va\u017eno je da mu poka\u017eemo
  da nam je stalo do njega i da ga volimo. To radimo provode\u0107i dovoljno vremena
  s njim da bi njegov psiholo\u0161ki odbrambeni mehanizam popustio i da s nama mo\u017ee
  da razgovara razumno. Tada \u0107e nam u iskazivanju ljubavi pomo\u0107i, pre svega
  gledanje u o\u010di, fizi\u010dki dodir i usredsredena pa\u017enja.\\n\\nAko je
  problem sukob unutar porodice, na primer razvod, tinejd\u017eeru je potrebna pomo\u0107
  da se izbori sa ose\u0107anjima. Naro\u010dito mu je potrebno da shvati da nije
  on kriv za razvod \u2013 i da nije mogao ni\u0161ta da uradi da bi spre\u010dio
  da do njega do\u0111e.\\n\\nTinejd\u017eeri su izuzetno osjetljivi na probleme izme\u0111u
  njihovih roditelja. Na\u017ealost, ve\u0107ina ljudi veruje da tinejd\u017eera koji
  je zavr\u0161io \u0161kolu i oti\u0161ao od ku\u0107e, ne pogada ono \u0161to se
  de\u0161ava izme\u0111u roditelja. To je potpuno pogre\u0161no.\\n\\nSe\u0107am
  se kad smo prvi put posetili Keri, po\u0161to je oti\u0161la na studije. Jedne ve\u010deri
  smo sa grupom njenih prijatelja oti\u0161li u restoran. Svi su bili su bruco\u0161i
  i po prvi put daleko od ku\u0107e. Svi su izjavljivali koliko vole studije, nove
  prijatelje i \u017eivot na fakultetu, ali su, tako\u0111e, rekli i da su tu\u017eni
  zbog slabe komunikacije s roditeljima; tek nekoliko telefonskih poziva, pisama ili
  poseta.\\n\\nMnogi roditelji jednostavno ne shvataju koliko je to traumati\u010dan
  period u \u017eivotu jedne mlade osobe, i koliko je va\u017eno da i dalje neguju
  \u010dvrst, stabilan porodi\u010dni temelj. Najgore vreme za razvod roditelja je
  vreme kad tinejd\u017eer napu\u0161ta dom. Odlazak od ku\u0107e, naro\u010dito u
  po\u010detku, je jedan od onih perioda u bilo \u010dijem \u017eivotu koji najvi\u0161e
  uznemiruju, zbunjuju i unose najvi\u0161e nespokoja. U to vreme,\\n\\ntinejd\u017eerov
  temelj ose\u0107aja sigurnosti su roditelji i dom. Razvod u tom trenutku potpuno
  lomi ove izvore tinejd\u017eerove stabilnosti. Zapanjuju\u0107e je koliko su ljudi
  naivni, i koliko njih se razvelo odmah po\u0161to su im deca oti\u0161la na studije.
  To znatno uti\u010de na tinejd\u017eerov sistem vrednosti, potkopava njegovu veru
  u svetost braka. To \u0161to se dogodilo s njegovim roditeljima ostavlja mu malo
  mogu\u0107nosti da prevlada ose\u0107anja frustracije, gneva, uznemirenosti, odba\u010denosti
  i straha pre nego \u0161to sam razmotri pitanje braka. Neki od ovih nere\u0161enih
  unutra\u0161njih sukoba mogu da uti\u0107u na njegov brak i da izazovu sukobe sa
  supru\u017enikom.\\n\\n**UMERENA I TE\u0160KA DEPRESIJA**\\n\\nKad se tinejd\u017eerova
  depresija pogor\u0161ava, pojavljuju se sve ozbiljnije posledice. Ona uti\u010de
  na proces razmi\u0161ljanja. Kod umerene i te\u0161ke depresije tinejd\u017eer postepeno
  gubi sposobnost da razmi\u0161lja jasno, logi\u010dno i racionalno. Njegovo rasudivanje
  se pogor\u0161ava s gubljenjem sposobnosti odr\u017eavanja zdrave perspektive, i
  on ili ona se sve vi\u0161e usredsre\u0111uje na morbidne i depresivne detalje.
  Njihovo opa\u017eanje stvarnosti se iskrivljuje, a naro\u010dito pogre\u0161no tuma\u010de
  mi\u0161ljenje drugih o sebi. Sve vi\u0161e i vi\u0161e veruju da je sve mra\u010dno,
  ni\u0161ta nije vredno utro\u0161enog vremena i da u stvari ne vredi \u017eiveti.\\n\\nU
  njima nastaje poreme\u0107aj razmi\u0161ljanja. Kad tinejd\u017eer sve vi\u0161e
  i vi\u0161e gubi sposobnost da razmi\u0161lja i komunicira na jasan i racionalan
  na\u010din, savetovanje je sve manje delotvorno. To stanje je zastra\u0161uju\u0107e.
  Kako mo\u017eete tinejd\u017eera da savetujete kad ne mo\u017eete s njim da razgovarate?
  Kada dode do ovakve situacije, medicinska pomo\u0107 je obavezna. Jer, kad tinejd\u017eer
  izgubi sposobnost racionalnog, razumnog i logi\u010dnog mi\u0161ljenja, depresija
  obi\u010dno po\u010dinje da se ispoljava na samorazaraju\u0107i na\u010din.\\n\\nMladala\u010dka
  depresija nije samo prolanza faza. Ta podmukla bolest \u0107e se sve vi\u0161e pogor\u0161avati
  ako se ne prepozna i ne po\u010dne da se le\u010di.\\n\\n**DEPRESIJA I DROGE**\\n\\nKao
  \u0161to sam ve\u0107 rekao, depresivni tinejd\u017eer je veoma sklon uzimanju droga,
  jer mnoge droge, naro\u010dito marihuana, zaustavljaju (ili ubla\u017eavaju) bol
  depresije. Takode je zapanjuju\u0107e koliki broj tinejd\u017eera i odraslih misli
  da je marihuana ne\u0161kodljiva. Svakog dana vidamo u\u010dinke te podmukle, opasne
  droge.\\n\\nSe\u0107am se kako sam petnaestogodi\u0161njeg de\u010daka primio na
  bolni\u010dko le\u010denje zbog zloupotrebe droge, te\u0161ke depresije i problema
  s pona\u0161anjem. Dijagnosti\u010dki pregled je, naravno, obuhvatao lekarski pregled
  i nalaz krvi. Otkrio sam da je dete izuzetno malokrvno. Njegovo telo je postepeno
  gubilo sposobnost proizvodnje krvi zbog upotrebe droga. Pre le\u010denja njegovih
  psiholo\u0161kih problema, morao sam da ga po\u0161aljem na univerzitetski medicinski
  centar zbog presadivanja ko\u0161tane sr\u017ei. Imao je slabe izglede.\\n\\nSve
  ovo nas vodi natrag do roditeljske kontrole tinejd\u017eerove slobode, putem privilegija
  zasnovanih na poverenju i pouzdanju, te primerene aktivnosti. Ako tinejd\u017eer
  iskreno ose\u0107a da ga volite i brinite za njega, verovatno \u0107e vas slu\u0161ati
  i voditi ra\u010duna o savetima koje mu dajete radi njegove sigurnosti. Zbog toga
  njegovo emocionalno spremi\u0161te morate odr\u017eavati punim. Tada \u0107ete mo\u0107i
  da mu pomognete da izbegne \u0161tetne posledice ako podlegne pritisku vr\u0161njaka
  da uzme drogu. Treba stalno da ga podse\u0107ate da ne sme da jede ili pije ne\u0161to
  bez razmi\u0161ljanja, i ako nije siguran da neko nije ubacio drogu u pi\u0107e
  ili u hranu. Na nekoj sumnjivoj zabavi razumno je izbegavati otvorene posude s pun\u010dem,
  ili izbegavati uzimanje hrane ili pi\u0107a od nekoga koga ne poznaje dovoljno dobro.
  Ovo mo\u017ee zvu\u010dati preterano sumnji\u010davo, ali li\u010dno sam video kako
  jednokratno uzimanje droge mo\u017ee da na\u0161kodi tinejd\u017eerskom umu u razvoju.\\n\\nNajvi\u0161e
  zastra\u0161uje na\u010din na koji droge uti\u010du na tinejd\u017eerov misaoni
  proces. Video sam mnogo tinejd\u017eera koji nisu mogli pravilno analiti\u010dki
  ili logi\u010dno da misle, \u010dak i posle samo jednog uzimanja droge. Poreme\u0107aj
  misaonog procesa je \u010desto toliko podmukao da ga niko i ne prepozna, ali rezultati
  su pora\u017eavaju\u0107i. Tinejd\u017eerova sposobnost da se pozitivno odnosi prema
  ljudima se smanjuje. On umisli pogre\u0161ne i \u010desto bizarre ideje o ljudima,
  vrednostima, autoritetima, dru\u0161tvu i o sebi samom. Pogre\u0161no razume ljude
  i njihove motivacije. Najgore od svega, po\u0161to ne mo\u017ee jasno da razmi\u0161lja,
  postaje zbunjen i lako se povede za grupom vr\u0161njaka, kultovima, ili drugim
  ljudima kojima je cilj samo da ga iskoriste.\\n\\nIma li i\u0161ta stra\u0161nije
  od ljudi koji ne mogu jasno da razmi\u0161ljaju i imaju poreme\u0107ene zamisli,
  poglede i vrednosti? Da li ste voljni da obezbedite da va\u0161 tinejd\u017eer pro\u0111e
  kroz adolescenciju, a da njegovi intelektualni, dru\u0161tveni i psiholo\u0161ki
  potencijali ne budu o\u0161te\u0107eni ili uni\u0161teni? Ako jeste, vole\u0107ete
  ga i br\u0e34\u017e\u043d\u043e paziti da ga primereno nadgledate. To je te\u0161ko,
  ali nagrada je vredna truda. Jedna od najve\u0107ih \u017eivotnih nagrada je kad
  vidite svog tinejd\u017eera kako se razvija u zrelu, ose\u0107ajnu, nezavisnu odraslu
  osobu koja ispravno razmi\u0161lja i doprinosi svetu oko sebe.\\n\\n10. KAKO TINEJD\u017dERU
  PRU\u017dITI INTELEKTUALNU POMO\u0106\\n\\nDa biste pripremili svog tinejd\u017eera
  za budu\u0107nost u ovom nerazumnom svetu, morate da ga nau\u010dite da jasno razmi\u0161lja.
  Za to postoji pet osnovnih razloga. Prvo, jasno razmi\u0161ljanje je potrebno zbog
  temeljnog razumevanja sveta takvog kakav jeste. Adolescenti nemaju istorijsku perspektivu
  i ne mogu da razumeju svakodnevne doga\u0111aje bez logi\u010dnog razmi\u0161ljanja.\\n\\nDrugo,
  tinejd\u017eeri moraju da nau\u010de da razmi\u0161ljaju logi\u010dno da bi mogli
  da shvate razliku izme\u0111u ispravnog i pogre\u0161nog. Bez zdravog, racionalnog
  shvatanja etike, tinejd\u017eer je lak plen anarhisti\u010dkih, destruktivnih stavova
  koji danas prevladavaju. Pogledate samo kakvi su moralni i eti\u010dki stavovi uticajnih
  li\u010dnosti u zabavnom, politi\u010dkom i verskom \u017eivotu dana\u0161njice.
  Moramo da naoru\u017eamo tinejd\u017eere protiv destruktivnih uticaja. To nije lako,
  jer su i odrasli sve svi\u0161e zbunjeni i smeteni. Neprimerno, neeti\u010dko pona\u0161anje
  brzo postaje norma u na\u0161em dru\u0161tvu.\\n\\nTre\u0107e, moramo da nau\u010dimo
  tinejd\u017eere da jasno razmi\u0161ljaju i donose logi\u010dne, racionalne odluke.
  \u017delimo da se njihovo pona\u0161anje bazira na ispravnom dono\u0161enju odluka
  i zdravom razumu. Pona\u0161anje u dana\u0161njem dru\u0161tvu uglavnom nije bazirano
  na pa\u017eljivom, racionalnom mi\u0161ljenju nego na iracionalnim, impulsivnim
  hirovima.\\n\\n\u017divimo u dru\u0161tvu u kome vlada suprotstavljanje svakom autoritetu
  zbog nezrelog ispoljavanja gneva (vidi sedmo poglavlje), a stanje se i pogor\u0161ava.
  Osoba koja ispravno razmi\u0161lja u velikoj je prednosti.\\n\\n\u010cetvrto, jasno
  razmi\u0161ljanje je potrebno da bi se tinejd\u017eer pravilno razvio i postao dru\u0161tveno
  zrela i odrasla osoba. Racionalna osoba koja je sposobna da logi\u010dno razmi\u0161lja
  u opho\u0111enju s razli\u010ditim tipovima ljudi i stilovima pona\u0161anja, je
  retka pojava, ali su to uvek sre\u0107ne i jake li\u010dnosti. Prirodno, taj dar
  sna\u017eno \u0107e uticati na tinejd\u017eera da razvije pristojan, pozitivan i
  \u010dvrst karakter.\\n\\nPeto, bez logi\u010dnog, jasnog razmi\u0161ljanja tinejd\u017eer
  ne mo\u017ee da ima jaku, stalnu i dugotrajnu veru ili sistem moralnih vrednosti.
  \u010cvrsta i postojana vera koja obezbe\u0111uje temelj za smisao \u017eivota ne
  mo\u017ee biti slepa vera. Mora da se temelji na racionalnom, logi\u010dnom razmi\u0161ljanju.
  Mora da bude u skladu sa stvarnim svetom i da pru\u017ea razumne odgovore na najdublja
  \u017eivotna pitanja.\\n\\nVeoma je va\u017eno da tinejd\u017eera nau\u010dite da
  razmi\u0161lja racionalno, logi\u010dno i analiti\u010dki (da zna da poreda \u010dinjenice).
  Jedan od najboljih delova naoru\u017eanja koji mu mo\u017eete dati je sposobnost
  procenjivanja vlastitih misli, tako da ima poverenja u njih, i da ih mo\u017ee promeniti
  u svetlu novih saznanja. Uz to, treba da nau\u010di da uvida gre\u0161ke pogre\u0161nog
  razmi\u0161ljanja i da razume kako su nastale. Kako da pomognete va\u0161em tinejd\u017eeru
  da to postigne?\\n\\nINTELEKTUALNI RAZVOJ\\n\\nVa\u017eno je shvatiti da se dete
  intelektualno razvija idu\u0107i iz jedne faze u drugu. Faktor koji najvi\u0161e
  odre\u0111uje koliko \u0107e dete ovladati svakom fazom misaonog procesa je koli\u010dina
  emocionalne hrane koju dobija. \u0160to ste uspe\u0161niji u iskazivanju bezuslovne
  i iskrene ljubavi tinejd\u017eeru, on \u0107e biti sposobniji da se intelektualno
  razvije. \u0160to se vi\u0161e bude ose\u0107ao voljenim, to \u0107e biti sposobniji
  da nau\u010di da razmi\u0161lja jasno i logi\u010dno. \u0160to se tinejd\u017eer
  ose\u0107a manje voljenim i zbrinutim, njegov um \u0107e biti slabiji.\\n\\nDa bi
  se njegov um sna\u017eno i zdravo razvijao, tinejd\u017eer pre svega mora da se
  ose\u0107a dobro u svojoj ko\u017ei. Tada \u0107e mo\u0107i da sazri u mudru i razboritu
  osobu, koja mo\u017ee jasno da prosuduje o svetu.\\n\\noko sebe, naro\u010dito o
  vlastitim emocijama. Mlada osoba koja nije dobro emocionalno nahranjena, mo\u017ee
  imati slabu kontrolu misli, ose\u0107anja mogu da je savladaju i njome da upravljaju.
  Pre svega morate da zadovoljite emocionalne potrebe va\u0161eg tinejd\u017eera.\\n\\nPre
  nekoliko godina video sam lepo razvijenog \u010detrnaestogodi\u0161njaka koji je
  palicom udario svog trenera bejzbola. De\u010dak je bio potpuno uveren u opravdanost
  tog \u010dina. Tvrdio je da je s pravom napao trenera, jer su se on i sin njegovog
  trenera borili za istu poziciju i da zbog toga nisu imali jednake \u0161anse.\\n\\nSlabo
  zaklju\u010divanje koje je taj de\u010dak pokazao zove se racionalizacija. Koriste\u0107i
  se njome u misaonom procesu osoba mo\u017ee da nade opravdanje skoro za sve. Takvo
  zbrkano razmi\u0161ljanje je nelogi\u010dno i opasno. Ono postaje sve \u010de\u0161\u0107e
  i \u010de\u0161\u0107e me\u0111u tinejd\u017eerima. Na\u017ealost, ovaj pogre\u0161ni
  misaoni proces je te\u0161ko prepoznati u svakodnevnim odnosima. Ali, to je jedan
  od osnovnih razloga zbog kog ve\u0107ina na\u0161ih tinejd\u017eera nije spremna
  za zreli \u017eivot odraslih.\\n\\nMorate neprekidno da vrebate prilike da nau\u010dite
  tinejd\u017eera da u razmi\u0161ljanju ispravno povezuje \u010dinjenice. Tipi\u010dan
  adolescent ne mo\u017ee da razmi\u0161lja apstraktno do nekog zna\u010dajnog stepena
  sve do otrpilike petnaeste godine, a posle tek po\u010dinje da u\u010di. Zbog toga
  je tinejd\u017eer u toku rane ili srednje adolescencije siguran da su roditelji
  u krivu ili u neznanju; kasnije, kad misaoni proces sazri i postane sposoban za
  apstraktno razmi\u0161ljanje, po\u010dinje da razume svoje roditelje i po\u0161tuje
  njihovo mi\u0161ljenje.\\n\\nMorate da budete strpljivi i puni ljubavi za vreme
  ovog te\u0161kog perioda i da ne\u017eno u\u010dite va\u0161eg tinejd\u017eera da
  jasno razmi\u0161lja. Jedan od na\u010dina na koji to mo\u017eete da uradite je
  da prepoznate pogre\u0161no povezivanje misli i da ga ispravite.\\n\\n**INTELEKTUALNO
  POTVR\u0110IVANJE**\\n\\nTinejd\u017eeru je potrebno intelektualno potvr\u0111ivanje
  da bi nau\u010dio pravilno da razmi\u0161lja. Da bi mogla kreativno da razmi\u0161lja,
  osoba mora da po\u0161tuje sebe, ne samo emocionalno i fizi\u010dki, nego i intelektualno.
  Mora da oseti odobravanje u pogledu njegove sposobnosti da razmi\u0161lja. To ne
  zna\u010di da treba da joj pru\u017eite utisak da verujete da je uvek u pravu. Treba
  da je ohrabrujete da sti\u010de sve vi\u0161e samopouzdanja, uzdaju\u0107i se u
  vlastitu sposobnost prosudivanja i re\u0161avanja problema.\\n\\nMnogi tinejd\u017eeri
  ne mogu da osete samopouzdanje i samoodobravanje ako nisu dobili ohrabrenje i odobravanje
  roditelja ili roditeljskih autoriteta. Mnogi roditelji gre\u0161e tako \u0161to
  samo ispravljavaju tinejd\u017eerove gre\u0161ke. Ali tinejd\u017eer \u0107e se
  ose\u0107ati sposobnim samo ako uz ispravke dobija odobravanje, potvr\u0111ivanje
  i pohvale.\\n\\nSvom tinejd\u017eeru mo\u017eete da date to neprocenjivo blago samo
  ako ga ohrabrijete intelektualno. To zna\u010di da ste voljni da razgovarate s njim
  o \u010demu god on ho\u0107e, kao i da ste voljni da saslu\u0161ate njegove ideje
  i to do kraja, bez obzira \u0161ta o njima mislili. Zatim, umesto da direktno isti\u010dete
  gre\u0161ke ili da se s njim svadate, mo\u017eete razgovarati o tom pitanju s po\u0161tovanjem,
  ozbiljno razmatraju\u0107i njegov stav i mirno izra\u017eavaju\u0107i svoj. Takav
  razgovor treba da li\u010di na razgovor dobrih drugara. Rade\u0107i to, vi ne odustajete
  od roditeljskog autoriteta. Vi jednostavno pokazujujete po\u0161tovanje prema mi\u0161ljenju
  va\u0161eg tinejd\u017eera. Deci tako dajete do znanja da su njihove misli i ideje
  vredni i dragoceni. Ako tinejd\u017eer ose\u0107a da ga volite i po\u0161tujete,
  postepeno \u0107e da usvoji neka va\u0161a razmi\u0161ljanja i vrednosti.\\n\\nNa\u017ealost,
  preveliki broj roditelja odbija da razmenjuje mi\u0161ljenje s tinejd\u017eerima.
  Umesto toga, oni istraju u tome da s njima razgovaraju kao da su mala deca. Zbog
  toga tinejd\u017eeri ose\u0107aju da njihovo mi\u0161ljenje nije va\u017eno. Nisu
  dobili intelektualnu potvrdu. Ne ose\u0107aju da ih njihovi roditelji iskreno vole.
  Ne ose\u0107aju se cenjenima, pa su povre\u0111eni i ljuti.\\n\\nDodajte tome \u010dinjenicu
  da nisu nau\u010dili da prosude da li je njihovo mi\u0161ljenje ispravno ili ne,
  logi\u010dno ili iracionalno. Od roditelja nisu primili povratnu informaciju o tome
  da li njihove ideje imaju smisla.\\n\\nVe\u0107ina tinejd\u017eera ne zna da li
  su u pravu ili gre\u0161ke u vezi s onim o \u010demu razmi\u0161ljaju. Zbog toga
  prihva\u0107aju mi\u0161ljenje drugih, kojima mo\u017eda nije na srcu njihova dobrobit.
  Kada se dovoljno otude od porodice da ne prihvate mi\u0161ljenja i vrednosti roditelja
  i drugih zakonitih autoriteta, po\u010dinju da slu\u0161aju ljude koji \u017eele
  da ih povrede mentalno, emocionalno, fizi\u010dki ili duhovno.\\n\\nPobrinite se
  da se va\u0161 tinejd\u017eer ose\u0107a iskreno voljenim, slu\u017ee\u0107i se
  gledanjem u o\u010di, fizi\u010dkim dodirom i usredsredenom pa\u017enjom. Pru\u017eite
  mu intelektualnu potvrdu slu\u0161aju\u0107i ga, i bril\u017eljivo zapazajte kako
  razmi\u0161lja i dolazi do zaklju\u010daka. Po\u0161tujte ga iznoseci svoje mi\u0161ljenje,
  bez kritikovanja ili osudivanja njegovog stava.\\n\\nSamo kada vidi da ste voljni
  da se prema njemu odnosite kao prema odgovornoj osobi, koja ima vlastito mi\u0161ljenje,
  va\u0161 tinejd\u017eer \u0107e ose\u0107ati uravnote\u017eeno poverenje u svoju
  sposobnost da nau\u010di da misli jasno i da razvija intelektualnu zrelost.\\n\\nKada
  kritikujete mi\u0161ljenje va\u0161eg tinejd\u017eera, on \u0107e verovatno biti
  ljut, ozloje\u0111en, \u010dak i ogor\u010den. Mo\u017ee da postane jo\u0161 prkosniji
  i da se sve vi\u0161e opire bilo kakvoj promeni. Ako se to desi, on \u0107e se dr\u017eati
  sebi\u010dnih, nezrelih i pogre\u0161nih mi\u0161ljenja, i pone\u0107e ih sa sobom
  u odraslo doba. Svi poznajemo odrasle osobe koje su pune pogre\u0161nih i \u010dudnih
  ideja. Ovi nesre\u010dni ljudi imaju pote\u0161ko\u0107a u razumevanju dru\u0161tvenih,
  duhovnih ili emocionalnih odnosa. Skloni su priklju\u010divanju strani koja je trenutno
  pobedni\u010dka i \u010desto imaju nerealna i neprijateljska uverenja.\\n\\nPOU\u010cAVAJTE
  PRIMEROM\\n\\nI ja sam gre\u0161io kao roditelj. Svakako ima prednosti biti pisac
  ove knjige, jer mogu da izaberem primere koje \u017eelim da podelim s \u010ditaocima.
  Dopustite mi da s vama podelim primer intelektualnog odgajanja na\u0161eg sina Dejvida.
  Mislim da sam ispravno postupio kada sam poku\u0161ao da mu bez kritikovanja poka\u017eem
  u \u010demu je njegovo razmi\u0161ljanje nelogi\u010dno i pojednostavljen, i zatim
  da ga nau\u010dim zrelijim na\u010dinima razmi\u0161ljanja.\\n\\nDejvid je znao
  koje televizijske kanale njegova majka i ja odobravamo, a koje ne. Obi\u010dno je
  bio prili\u010dno dobar u po\u0161tovanju na\u0161ih \u017eelja u vezi s gledanjem
  televizije. Me\u0111utim, jedne ve\u010deri je gledao program koji se nama nije
  dopadao \u2013 Brod ljubavi. Kada sam ga podsetio da ne \u017eelim da to gleda,
  upitao me je: \u201eZa\u0161to ne?\u201c i zatim dodao da ne vidi ni\u0161ta lo\u0161e
  u tome, jer \u201eniko nikoga ne vreda.\u201c\\n\\nDa li vam ovakvo razmi\u0161ljanje
  zvu\u010di poznato? Iako je to rekao veoma davno, Dejvidova izjava pokazuje sada\u0161nje
  stanje moralnosti u na\u0161em dru\u0161tvu: \u201eMogu da radim \u0161ta ho\u0107u,
  sve dok time nikoga ne povredujem.\u201c\\n\\nBio sam u velikom isku\u0161enju da
  sko\u010dim na Dejvida i kritikujem ga zbog tako plitkog i nezrelog na\u010dina
  razmi\u0161ljanja. Televizijski programi su tada, a jo\u0161 vi\u0161e danas, izlagali
  mlade ljude podmuklim i opasnim filozofijama. Me\u0111utim, drago mi je \u0161to
  mogu da ka\u017eem da sam se setio da je Dejvidu potrebna intelektualna potvrda
  i podu\u010davanje da bi mogao zrelo da razmi\u0161lja.\\n\\nRekao sam: \u201eJasno
  mi je \u0161ta misli\u0161, Dejvide, ali ja mislim da je Brod ljubavi hedonisti\u010dka
  i narcisti\u010dka emisija. (To mu je privuklo pa\u017enju.)\\n\\n\u201e\u0160ta
  to zna\u010di?\u201c upitao je.\\n\\nRekao sam: \u201eEvo \u0161ta \u0107emo, Dejvide.
  Uze\u0107emo re\u010dnik i potra\u017ei\u0107emo te re\u010di.\u201c (Usput, re\u010dnik
  mi je bio od ogromne pomo\u0107i prilikom u\u010denja dece te\u0161kim pojmovima.)\\n\\nPotra\u017eili
  smo zajedno te re\u010di. Zatim smo razgovarali o zna\u010denju re\u010di hedonisti\u010dki
  i narcisti\u010dki, sve dok nisam bio siguran da ih je razumeo. Ali, kao tipi\u010dno
  dete u ranoj adolescenciji, posle\\n\\nrazumevanja ovih re\u010di, Dejvid jo\u0161
  nije shvatao u kakvom su one odnosu sa stvarnim \u017eivotom. Rekao sam: \u201eDejvide,
  da li misli\u0161 da hedonista i narcist mo\u017ee da bude dobar mu\u017e, \u017eena,
  majka ili otac? Kakva je tvoja majka? Je li ona sebi\u010dna? Brine li se samo za
  sebe, a malo po\u0161tovanja pridaje drugima? Zanima li je samo vlastito u\u017eivanje
  i vlastita dob\u0440\u043e\u0431\u0438\u0442?\u201c Ovo je sigurno upalilo lampicu
  u Dejvidovoj glavi. Pomislio je na sve maj\u010dine postupke ispunjene ljubavlju,
  koje je u\u010dinila tog dana, iako se \u010dak nije ose\u0107ala dobro.\\n\\nBio
  sam presre\u0107an kad je Dejvid kona\u010dno izjavio: \u201eTo zna\u010di da je
  sebi\u010dna osoba zainteresovana samo za svoje zadovoljstvo umesto da se brine
  i za druge.\u201c\\n\\nZatim smo razgovarali o tome koliko Brod ljubavi prikazuje
  ljude sebi\u010d\u043d\u0438\u043c\u0430 i zastupa stavove koji te\u017ee da udovolje
  samo sebi, s malo ili nimalo zanimanja i po\u0161tovanja za dob\u0440\u043e\u0431\u0438\u0442
  drugih.\\n\\nU\u010diti tinejd\u017eera da jasno razmi\u0161lja je te\u017eak i
  zamoran posao koji oduzima vreme. Me\u0111utim, ako ne razjasnite primere, poput
  ovih upravo opisanih, ti stavovi \u0107e podmuklo uticati na va\u0161eg tinejd\u017eera.\\n\\n**BUDITE
  DOSLEDNI**\\n\\nJedan od razloga zbog kojih su tinejd\u017eeri zbunjeni po pitanju
  morala jeste taj \u0161to mnogi roditelji nisu preuzeli odgovornost za preno\u0161enje
  sopstvenih uverenja svojoj deci. Drugi roditelji ka\u017eu da veruju u duhovne vrednosti,
  ali ne \u017eive po njima. Mnogi roditelji \u2013 uklju\u010duju\u0107i i hri\u0161\u0107ane
  \u2013 imaju pote\u0161ko\u0107a sa sopstvenim pona\u0161anjem. Alarmantan je porast
  broja preljuba, zlostavljanja dece i prevara.\\n\\nNi\u0161ta tako ne zbunuje tinejd\u017eera
  kao nedoslednost u \u017eivotu roditelja \u2013 naro\u010dito u pogledu stvari za
  koje roditelji ka\u017eu da ih vrlo po\u0161tuju, a zatim se prema njima odnose
  kao da ne vrede ni\u0161ta. Kako roditelji mogu da pou\u010de decu da jasno razmi\u0161ljaju
  o moralnim i duhovnim vrednostima kada njihovi \u017eivoti ne pokazuju rezultate
  jasnog razmi\u0161ljanja?\\n\\nVerujem da moramo da se pozabavimo nedisciplinovanim
  pona\u0161anjem koje uni\u0161tava moralno tkivo na\u0161eg dru\u0161tva. Bog \u0107e
  naravno suditi zbog nedostatka discipline i samokontrole u \u017eivotima mnogih
  ljudi koji sebe nazivaju hri\u0161\u0107anima.\\n\\nDragi roditelji, sredimo na\u0161e
  \u017eivote, pona\u0161ajmo se dosledno, onako kako bi Bog \u017eeleo da se pona\u0161amo.
  Tada mo\u017eemo da zatra\u017eimo ispunjenje Bo\u017eijih obe\u0107anja za na\u0161u
  decu.\\n\\n11. KAKO TINEJD\u017dERU PRU\u017dITI DUHOVNU POMO\u0106\\n\\nKao \u0161to
  sam ranije pomenuo, dana\u0161nje generacije tinejd\u017eera \u010desto nazivaju
  \u201eapati\u010dnom generacijom\u201c. Va\u017eno je zapamtiti da ova apatija prikriva
  sna\u017ean gnev i bes, naro\u010dito prema zakonitim autoritetima. Na\u017ealost,
  mnogi na\u0161i tinejd\u017eeri su apati\u010dni, naro\u010dito u pogledu budu\u0107nosti.
  Mnogima od tih mladih ljudi koji su nada budu\u0107nosti na\u0161e zemlje po pitanju
  na\u010dina \u017eivota, nedostaje \u017eivahnosti, razigranosti i odlu\u010dnosti
  koje volimo da vidimo.\\n\\nZa\u0161to je tako mnogo na\u0161ih tinejd\u017eera
  apati\u010dno? Za\u0161to im nedostaje inicijative i podstrek? Zato \u0161to imaju
  malo nade u budu\u0107nost. Takvo beznade je mnogo ozbiljnije od agresivnih i nasilnih
  protesta iz kasnih \u0161ezdesetih. Tih godina mla\u0111i ljudi su imali za \u0161ta
  da se bore, iako ponekad u pogre\u0161nom smjeru i na pogre\u0161an na\u010din,
  ali barem su odr\u017eavali nadu \u2013 nadu u njihovu zemlju, njihov na\u010din
  \u017eivota i \u0161to je najva\u017enije u njih same.\\n\\nTo danas ne vidamo.
  Preovladuju\u0107e raspolo\u017eenje kod na\u0161e omladine su bespomo\u0107nost,
  beznade i o\u010daj. Kao roditelji pitamo se kako ova \u017ealosna situacija mo\u017ee
  uop\u0161te biti mogu\u0107a. \u010cini se kao da je neko is\u010dupao srce i du\u0161u
  mnogim na\u0161im tinejd\u017eerima. Za\u0161to tako malo nade polazu u budu\u0107nost?\\n\\nLako
  je ukazati na obeshrabruju\u0107i svet i globalne probleme poput nezaposlenosti,
  nesre\u0107a, side, gladi i zagadenja u svetu. Ali, ovo nisu razlozi tinejd\u017eerskog
  beznada i o\u010daja.\\n\\nNa\u0161i preci su se u pro\u0161losti suo\u010davali
  s jednako te\u0161kim, opasnim i frustriraju\u0107im vremenima, \u010dak su \u017eiveli
  i mnogo nesigurnije. Suo\u010dili su se s nevoljama poput velike depresije, holokausta
  i drugim strahotama Drugog svetskog rata. Ali, mla\u0111i ljudi toga perioda nisu
  ose\u0107ali ovakvo beznade i o\u010daj koje danas vidamo.\\n\\nStavovi i raspolo\u017eenja
  mladih u nekoj zemlji su odraz stavova i raspolo\u017eenja odraslih. Ponekad se
  mla\u0111i okupe iza starijih, naro\u010dito kad je ugro\u017eena nacionalna sigurnost.
  U drugim vremenima mla\u0111i nastupaju protiv status-a quo, naro\u010dito kad prepoznaju
  licemerje. Danas pak ne vidimo stavove ni za ni protiv, nego neku zloslutnu inerciju.
  Koje osobine odraslih odra\u017eavaju na\u0161i tinejd\u017eeri? Odra\u017eavaju
  depresiju, sumornost, beznade i o\u010daj. Kako tinejd\u017eer mo\u017ee da reaguje
  pozitivno u takvoj atmosferi? On mora videti ne\u0161to pozitivno i vredno u \u017eivotu
  iza \u010dega \u0107e stati.\\n\\nNa\u017ealost, tinejd\u017eeri imaju ograni\u010denu
  istorijsku perspektivu da bi mogli da se osvrnu i u\u010de iz iskustva predaka.
  Ograni\u010deni su na sada\u0161njost i budu\u0107nost. Zbog toga svoje stavove
  i pona\u0161anja formiraju iz trenutno preovladaju\u0107e atmosfere sada\u0161njosti,
  i trenutno preovladuju\u0107ih stavova o budu\u0107nosti.\\n\\nJedan od glavnih
  razloga zbog kojih na\u0161i tinejd\u017eeri imaju problema s formiranjem pozitivnih
  stavova, je taj \u0161to mi odrasli nismo na njih preneli odlu\u010dnost, nadu i
  hrabrost, preko potrebne za suo\u010davanje s budu\u0107no\u0161\u0107u. \u010cini
  se da mi iz starijeg nara\u0161taja nudimo mladima neke \u010dudne i nezdrave stavove
  koji su uveliko neistiniti i svakako nisu biblijski. Gotovo bez razmi\u0161ljanja
  mi odrasli brzo razvijamo sklonost ka nezdravom, nestvarala\u010dkom, kukavi\u010dkom
  i pasivnom \u017eivotu. Dopu\u0161tamo drugim ludima da odre\u0111uju na\u0161 sistem
  vrednosti i \u017eivotnu perspektivu. Mnogi od nas veruju:\\n\\n- da smo prva generacija
  koja se suo\u010dava s krizom;\\n- da je svet nekako bio lep\u0161i, bolje i sigurnije
  mesto za \u017eivot pre nego \u0161to su se razvili dana\u0161nji problemi;\\n-
  da svet propada tako brzo da je beznade\u017eno i suludo planirati budu\u0107nost
  i pripremati se za nju, jer budu\u0107nosti mo\u017eda uop\u0161te ne\u0107e biti.\\n\\nMo\u017eete
  s pravom da o\u010dekujete da \u0107e tinejd\u017eer koji zna malo o istoriji \u010dove\u010danstva,
  a jo\u0161 manje o velikim Bo\u017eijim obe\u0107anjima, podle\u0107i tom zagu\u015fuju\u0107em
  pesimizmu koji li\u0161ava nade. Postali smo ljudi na \u010dije stavove i sisteme
  vrednovanja lako mogu da uti\u010du drugi ljudi. O\u010dajni smo kad ne\u0161to
  nije onako dobro kao \u0161to je bilo, zanemarjujemo ono \u0161to jeste dobro. Zaboravljam\u043e
  da zahvalimo za blagoslove koje smo dobili. Vidi\u043e sam ljude koji su bili o\u010dajni
  zbog neva\u017enih stvari. S druge strane, preterano se veselimo jednako neva\u017enim
  stvarima, kao \u0161to je novi auto ili nova ode\u0107a. Zar je \u010dudno \u0161to
  pop grupe i kultovi tako lako uti\u010du na na\u0161e mlade kad smo mi podjednako
  pod uticajem televizije i posebnih interesnih grupa?\\n\\nMogu da razumem da je
  \u010dovek bez vere dezorijentisan, zbunjen i o\u010dajan. Me\u0111utim, te\u0161ko
  mi je da razumem da hri\u0161\u0107ani upadaju u ovu zamku beznada; video sam toliko
  mnogo hri\u0161\u0107ana koji lako prihvataju pesimisti\u010dke uticaje. Video sam
  i njihove tinejd\u017eere koji ne uspevaju da pronadu presudno sidro nade i mir\u0430
  koje je Hristos namenio svome narodu.\\n\\n\u017deleo bih da na\u0161i tinejd\u017eeri
  prime poruku nade, ohrabrenja i izazova. Ali, uop\u0161teno govore\u0107i, na\u0161a
  generacija je izgubila duhovnu dimenziju, to jest odnos s Bogom. Da, imamo problema,
  neki od njih su potpuno novi \u2013 ali i mnoge na\u0161e deke i bake su ih imali.
  Za\u0161to ne mo\u017eemo da se suo\u010dimo s krizama i te\u0161ko\u0107ama bez
  crnih slutnji i depresije, bez ose\u0107aja beznada i zle kobi?\\n\\n**SUDNJI DAN?**\\n\\nU
  vremenima nevolje neke religiozne grupe i u\u010ditelji poku\u0161avaju da pobegnu
  od odgovornosti povla\u010de\u0107i se i \u010dekaju\u0107i sudnji dan. Umesto da
  se koriste biblijskim odlomcima onako kako ih je Bog namenio \u2013 kao re\u010dima
  nade i obe\u0107anja \u2013 ti samozvani proroci koriste Sveto pismo da nagoveste
  smak sveta koji samo \u0161to nije do\u0161ao. Njihova poruka je poruka beznada:
  dolazi kraj i nema smisla re\u0161avati probleme i obezbeditivati deci bolji \u017eivot.
  To dovodi do stanja duhovne i emocionalne paralize. To takode podsti\u010de stav:
  \u201eJedimo, pijmo i veselimo se jer \u0107emo sutra umr\u0435\u0442\u0438.\u201c\\n\\nZamislite
  kako je biti tinejd\u017eer u takvoj atmosferi. U vreme kada bi tinejd\u017eer trebalo
  da se priprema za ispunjen \u017eivot kojim \u0107e doprineti dru\u0161tvu, on ili
  ona se dr\u017ee preovladuju\u0107\u0435\u0433 stava \u2013 u\u017eivaj \u0161to
  vi\u0161e mo\u017ee\u0161 danas, jer sutra, \u010dak i ako ga bude, mo\u017eda ne\u0107e
  biti vredno \u017eivljenja.\\n\\nTakve predrasude lome okosnicu odgovornosti i kod
  tinejd\u017eera i kod odraslih. Posle \u010ditanja knjige o \u201ekraju vremena\u201c,
  koja je nedavno ponu\u0111ena na televiziji, jedna majka je priznala: \u201eNe mogu
  a da se ne zapitam za\u0161to bih odgajala decu ili poku\u0161avala da ih pripremim
  za nepostoje\u0107u budu\u0107nost.\u201c \u010covek koji je pro\u010ditao drugu
  knjigu o sudnjem danu je izjavio: \u201eOse\u0107\u0430\u043c da bi trebalo da odustanem
  od posla i jednostavno dignem ruke. Zbog \u010dega da idem dalje?\u201c\\n\\nU ovakvoj
  atmosferi rastu\u0107e eshatolo\u0161ke uzaludnosti, ljudima je te\u0161ko da se
  bore protiv cinizma, da izbegnu droge ili da preuzmu odgovornost. Kad se sudnji
  dan najavljuje bez odgovaraju\u0107e ravnote\u017ee nade i vere u Bo\u017eija obe\u0107anja
  i Hristovu ljubav, \u010dudi li \u0161to hri\u0161\u0107ani otkrivaju da je sve
  te\u017ee \u017eiveti odgovornim, hrabrim i delotvornim \u017eivotom?\\n\\nRazdoblja
  nezdravog prenagla\u0161avanja proro\u010danstava i kraja vremena pojavljuju se
  svakih pet do deset godina. Obi\u010dno ih pospe\u0161uju dobro prodavane knjige
  o toj temi koje trenutne okolnosti upore\u0111uju s biblijskim proro\u010danstvima.
  Mi roditelji shvatamo koliko to razorno mo\u017ee uticati na tinejd\u017eera Ako
  i kada se to dogodi, budite spremni da objasnite tinejd\u017eeru istoriju tog fenomena
  i odr\u017eite ravnote\u017eu sa zdravim shvatanjem biblijskog proro\u010danstva.
  U suprotnom, tinejd\u017eer mo\u017ee da postane ne samo pesimisti\u010dan i depresivan
  u pogledu svog postojanja, nego mo\u017ee lako da sklizne u astrologiju i padne
  pod rastu\u0107i uticaj raznih duhovnjaka, vidovnjaka i proricatelja sudbine.\\n\\nHristovo
  u\u010denje nije pesimisti\u010dno. Njegova poruka je poruka nade i radosti. Govore\u0107i
  o poslednjim vremenima, Hristos je rekao: \u201eA o onom danu ili \u010dasu niko
  ne zna, ni an\u0111eli na nebu ni\\n\\nSin, nego samo Otac. Pazite, bdite; jer ne
  znate kad je vreme.\u201c (Evan\u0111elje po Marku 13:32-33). Treba da \u010dekamo
  njegov dolazak i da se molimo. Ne treba da odustajemo ili da budemo pesimisti\u010dni
  u pogledu budu\u0107nosti. Ne treba da pobegnemo od moralne odgovornosti da \u017eivimo
  pobo\u017enim \u017eivotom i da te vrednosti prenesemo na na\u0161u decu. Biblija
  nas ohrabruje da budemo radosni, optimisti\u010dni, puni nade i da o\u010dekujemo
  najbolje.\\n\\nAko mi kao roditelji mo\u017eemo da sagledamo sveukupnu sliku istorije,
  vide\u0107emo i na\u0161e mesto u njoj \u2013 mesto koje je izuzetno va\u017eno
  i uzbudljivo. Na nas se odnosi samo jedno poglavlje u Bo\u017eijim planovima i istorijskim
  knjigama. A Bo\u017eiji planovi i istorija nemaju kraja. Na kraju na\u0161eg poglavlja,
  ja bih voleo da se osvrnem i vidim da smo kao njegov narod ispunili njegovu volju,
  da smo \u010dvrsto ustrajali u veri u njega i njegovu dobrotu. \u017delim da se
  ose\u0107am dobro zbog toga \u0161to nisam podlegao svetovnim pritiscima da svoje
  potencijale potro\u0161im na sticanje dana\u0161njeg \u201eiskustva\u201c, \u017ertvuju\u0107i
  pritom Bogom danu povlasticu \u017eiviljenja pravednim pobo\u017enim \u017eivotom.\\n\\n\u017deleo
  bih da mogu re\u0107i kao apostol Pavle: \u201eDobru sam borbu izborio, trku sam
  svr\u0161io, veru sam sa\u010duvao.\u201c (Druga poslanica Timoteju 4:7).\\n\\nNeka
  nam Bog pomogne da dovr\u0161imo put i sa\u010duvamo veru. Budemo li to \u010dinili
  najbolje \u0161to umemo, doprine\u0107emo napretku na\u0161ih tinejd\u017eera vi\u0161e
  nego na bilo koji drugi na\u010din. Ali, da bismo im pru\u017eili nadu, veru i optimizam,
  moramo i sami tako da \u017eivimo.\\n\\n\u201ePOKA\u017dI MI KAKO DA \u017dIVIM\u201c\\n\\nJedan
  od najglasnijih vapaja dana\u0161njih tinejd\u017eera je da im roditelji obezbede
  eti\u010dke i moralne sisteme vrednosti koji \u0107e ih voditi. Tinejd\u017eeri
  to ispoljavaju na razli\u010dite na\u010dine. Jedno dete je izjavilo da \u017eeli
  \u201emerila po kojima \u0107e da \u017eivi.\u201c Drugom tinejd\u017eeru je potreban
  \u201esmisao \u017eivota.\u201c Tre\u0107i o\u010dajni tinejd\u017eer \u017eudi
  za \u201ene\u010dim \u0161to \u0107e mu pokazati kako da \u017eivi\u201c ili za
  \u201ene\u010dim na \u0161ta se mo\u017ee osloniti\u201c ili \u201evi\u0161im vodstvom\u201c.\\n\\nOve
  o\u010dajni\u010dke \u017eudnje ne pokazuje samo nekolicina nezadovoljnih, nesre\u0107nih
  mladih ljudi. Ve\u0107ina tinejd\u017eera ose\u0107a tu potrebu i zbunjeni su tim
  tako va\u017enim podru\u010djima svojih \u017eivota. Na\u017ealost, potpuno je neobi\u010dno
  prona\u0107i tinejd\u017eera koji zna smisao i svrhu svog \u017eivota, koji je u
  miru sa samim sobom, i koji ima zdravu perspektivu o \u017eivotu u ovom zbunjuju\u0107em,
  zastra\u0161uju\u0107em svetu koji se brzo menja.\\n\\nU po\u010detku dete od roditelja
  tra\u017ei vodstvo. Da li \u0107e u tome uspeti, zavisi od dve stvari: da li su
  njegovi roditelji prona\u0161li svoj pravac i da li dete mo\u017ee da prihvati roditeljske
  vrednosti. Dete koje ne ose\u0107a da ga roditelji iskreno vole, te\u0161ko \u0107e
  to mo\u0107i.\\n\\nIstra\u017eimo prvi zahtev za otkrivanjem smisla \u017eivota
  koji je toliko potreban mladoj osobi. Nama roditeljima potreban je temelj na kome
  \u0107emo graditi na\u0161e \u017eivote i koji mo\u017ee da izdr\u017ei ispit vremena.
  Temelj koji \u0107e nam biti pouzdana osnova u svakom razdoblju \u017eivota, u bra\u010dnim
  potrebama, nov\u010danim krizama, problemima s decom, nedostatku energije, sukobima
  u dru\u0161tvenim previranjima u kojima duhovni standardi ubrzano propadaju. Mi
  roditelji moramo imati temelj koji \u0107emo da ponudimo na\u0161oj deci.\\n\\nOvo
  neprocenjivo blago koje osigurava utehu i daje mir, i koje je potrebno svakom srcu
  je \u2013 Osoba; ali to je takva Osoba koja mo\u017ee da se podeli s drugim osobama.
  Ona nam daje snagu u stresnim vremenima, i nudi utehu u danima \u017ealosti. Daruje
  nam mudrost kad smo zbunjeni i ispravlja nas kad gre\u0161imo. Poma\u017ee nam kad
  nam je potrebna pomo\u0107, i toj pomo\u0107i nema kraja. Ta Osoba nas neprekidno
  vodi i \u201ebli\u017ea nam je od brata.\u201c\\n\\nDaje nam zapovesti koje treba
  da izvr\u0161imo, ali obe\u0107ava divnu nagradu za poslu\u0161nost. Ponekad dopu\u0161ta
  gubitak, tugu i bol, ali nam uvek daje ne\u0161to bolje. On nam se ne name\u0107e,
  nego strpljivo \u010deka\\n\\nda ga pozovemo u svoj \u017eivot. Ne prisiljava nas
  da po\u0161tujemo njegovu volju, ve\u0107 je bolno razo\u010daran kad uradimo ne\u0161to
  pogre\u0161no. \u017deli da ga volimo jer je on prvi voleo nas, ali nam ostavlja
  slobodnu volju da li \u0107emo da ga prihvatimo ili odbacimo. \u017deli da se brine
  o nama, ali odbija da nam se name\u0107e. Njegova najve\u0107a \u017eelja je da
  nam bude Otac, ali samo na na\u0161 poziv. Ako \u017eelimo ono \u0161to on \u017eeli
  \u2013 da s nama uspostavi odnos Oca i deteta, ispunjen ljubavlju i brigom \u2013
  treba da prihvatimo njegovu ponudu. Previ\u0161e nas uva\u017eava da bi se nametao.
  Njegovo dete se postaje primanjem Hrista kao Spasitelja i Gospoda, a to je upravo
  ono na \u0161ta on \u010deka. Naravno, kao \u0161to pretpostavljate, radi se o Bogu
  koji \u017eeli da bude na\u0161 li\u010dni Bog.\\n\\nOvaj li\u010dni i prisni odnos
  s Bogom posredstvom njegovog sina, Isusa Hrista, je najva\u017eniji u \u017eivotu.
  To je ono \u201ene\u0161to\u201c za \u010dim \u017eude na\u0161i mladi: \u201esmisao
  \u017eivota\u201c, \u201ene\u0161to na \u0161ta se mogu osloniti\u201c, \u201ene\u0161to
  \u0161to donosi utehu kad se \u010dini da se sve raspada\u201c. Sve je to u njemu.\\n\\nDa
  li imate sve to? Ako nemate, zatra\u017eite pomo\u0107 od sve\u0161tenika ili prijatelja
  hri\u0161\u0107anina.\\n\\nDrugi zahtev je da se dete poistoveti sa svojim roditeljima
  da bi moglo da prihvati i usvoji njihove vrednosti.\\n\\nKao \u0161to se se\u0107ate,
  ako se tinejd\u017eer ne ose\u0107a voljenim i prihva\u0107enim, on ili ona \u0107e
  imati pote\u0161ko\u0107a da se poistoveti s roditeljima, i bi\u0107e sklon da na
  roditeljsko vo\u0111stvo reaguje gnevno, ozlojedeno i neprijateljski. Svaki roditeljski
  zahtev (ili zapovest) vide\u0107e kao nametanje i tra\u017ei\u0107e na\u010dina
  kako da mu se odupre. U te\u017eim slu\u010dajevima, tinejd\u017eer stekne naviku
  da zamera svakom roditeljskom zahtevu, i prema roditeljskom autoritetu (a kasnije
  i bilo kom drugom, pa i Bo\u017eijem) odnosi se tako da uvek \u010dini suprotno
  od onoga \u0161to se od njega o\u010dekuje. Kada dode do tog stepena otudenja, skoro
  je nemogu\u0107e da roditelji prenesu tinejd\u017eeru moralni i eti\u010dki sistem
  vrednosti.\\n\\nDa bi se tinejd\u017eer poistovetio s roditeljima, stvorio blizak
  odnos s njima, i mogao da prihvati njihove standarde, mora da ose\u0107a da ga oni
  iskrreno vole i prihvataju. Da bi tinejd\u017eera doveli do bliskog odnosa s Bogom,
  kakav i sami imaju, roditelji moraju da budu sigurni da se dete ose\u0107a bezuslovno
  voljenim, \u0161to je tema koju smo ve\u0107 razmotrili. Tinejd\u017eeru koji ne
  ose\u0107a da ga roditelji iskrreno vole izuzetno je te\u0161ko da oseti da ga Bog
  voli.\\n\\n**VERSKO VASPITANJE**\\n\\nVrlo va\u017ena \u010dinjenica koju treba
  znati o tinejd\u017eeru je kako funkcioni\u0161e njegovo pam\u0107enje. Ne zaboravite
  da je tinejd\u017eer emocionalno dete, i da fuckcioni\u0161e vi\u0161e emocionalno
  nego kognitivno. Zbog toga lak\u0161e pamti ose\u0107anja nego \u010dinjenice. Dete
  mo\u017ee lak\u0161e da zapami\u021bi kako se ose\u0107alo u odre\u0111enoj situaciji,
  nego detalje koji su doveli do nje. Na primer, dete ili tinejd\u017eer koji je bio
  u crkvi na \u010dasu veronauke, dugo \u0107e se i ta\u010dno se\u0107ati kako se
  tom prilikom ose\u0107ao, \u010dak i kad zaboravi o \u010demu se tamo govorilo ili
  u\u010dilo.\\n\\nZbog toga je, na neki na\u010din, va\u017enije da li je de\u010dije
  iskustvo bilo prijatno ili neprijatno, nego pojedinosti gradiva. Kada ka\u017eem
  prijatno ne mislim da u\u010ditelj treba da udovoljava detetovoj \u017eelji za zabavom
  i veseljem. Mislim da u\u010ditelj treba prema detetu da se odnosi s po\u0161tovanjem,
  ljubazno i bri\u017eno, i doprine se da ono bude zadovoljno sobom. Dete ne treba
  kritikovati, poni\u017eavati ili omalova\u017eavati.\\n\\nAko je na veronauci mlada
  osoba bila poni\u017eavana ili se dosadivala, verovatno \u0107e odbiti \u010dak
  i najbolje u\u010denje, naro\u010dito ako ono obuhvata moral i etiku. Iz takvog
  iskustva tinejd\u017eeri razvijaju predrasude o religijskim temama, a ljude koji
  idu u crkvu smatraju licemerima. Ovakav stav se te\u0161ko ispravlja i mo\u017ee
  se zadr\u017eati celog \u017eivota.\\n\\nS druge strane, ako je iskustvo u\u010denja
  pozitivno, se\u0107anje tinejd\u017eera na verske teme bi\u0107e prijatno i on \u0107e
  ga lako ugraditi u svoju li\u010dnost. Emocionalnost i duhovnost nisu potpuno odvojeni\\n\\nfenomeni.
  Povezani su i me\u0111usobno zavisni. Zbog toga, ako roditelji \u017eele da tinejd\u017eeru
  pomognu duhovno, treba da se za njega pobrinu emocionalno. Po\u0161to dete mnogo
  lak\u0161e pamti ose\u0107anja nego \u010dinjenice, mora da postoji niz prijatnih
  ose\u0107anja unutar kojih treba da sakuplja \u010dinjenice \u2013 naro\u010dito
  duhovne.\\n\\n**PRISTUP \u201e\u010cEKAJ I IZABERI\u201c**\\n\\nIstra\u017eimo sada
  popularnu zabludu koja glasi otrplike ovako: \u201e\u017delim da moje dete nau\u010di
  da samo donosi odluke, nakon \u0161to se upozna sa svim onim \u0161to se nudi. Ne
  sme da misli da treba da veruje u ono u \u0161ta ja verujem. \u017delim da se upozna
  s razli\u010ditim religijama i filozofijama; zatim kada odraste mo\u0107i \u0107e
  samo da odlu\u010di.\u201c\\n\\nTakav roditelj, ili se izvla\u010di od odgovornosti,
  ili je u velikom neznanju o svetu u kom \u017eivimo. Treba \u017ealiti dete odgajano
  na ovaj na\u010din. Bez neprekidnog vodstva i obja\u0161njavanja eti\u010dkih, moralnih
  i duhovnih kategorija, sve slabije \u0107e se snalaziti u odnosu prema svetu. Postoje
  razumni odgovori na mnoge \u017eivotne sukobe i prividna protivre\u010dja. Jedan
  od najboljih poklona koji roditelji mogu da daju detetu je jasno razumevanje sveta
  i njegovih zbunjuju\u0107ih problema. Bez tog stabilnog temelja znanja i razumevanja,
  je li ikakvo \u010dudo \u0161to mnoga deca vape svojim roditeljima: \u201eZa\u0161to
  mi niste objasnili smisao svega ovoga? O \u010demu se radi?\\n\\nDrugi razlog zbog
  kog je ovakav pristup nemaran, je taj \u0161to postoji sve vi\u0161e organizacija
  i kultova koji nude destruktivne, porobljavaju\u0107e i pogre\u0161ne odgovore na
  \u017eivotna pitanja. Ti ljudi \u017eele da pronadu osobu koja je odgajana na naizgled
  slobodouman na\u010din. Ona je laka \u017ertva za bilo koju grupu koja nudi konkretne
  odgovore, bez obzira na to koliko su oni pogre\u0161ni ili porobljavaju\u0107i.\\n\\nNeverovatno
  je kako neki roditelji mogu da potro\u0161e ogromno bogatstvo i \u010dak manipuli\u0161u
  u svetu politike, samo da bi njihovo dete dobilo kvalitetno obrazovanje. Ipak, za
  najva\u017eniju od svih priprema, za \u017eivotne duhovne bitke i pronala\u017eenje
  stvarnog smisla \u017eivota, dete je prepu\u0161teno samo sebi, i to ga \u010dini
  lakim plenom za pripadnike raznih kultova.\\n\\n**DUHOVNA PRIPREMA TINEJD\u017dERA**\\n\\nKako
  roditelji duhovno pripremaju tinejd\u017eere? Za razvoj tinejd\u017eera izuzetno
  su va\u017eni organizovana verska pouka i aktivnosti. Me\u0111utim, ni\u0161ta ne
  uti\u010de na tinejd\u017eera kao njegova porodica i ono \u010demu je izlo\u017een
  u njoj. Roditelji treba aktivno da uti\u0107u na tinejd\u017eerov duhovni razvoj.
  Ne smeju sebi da dopuste da to prepuste drugima, \u010dak ni najboljim verou\u010diteljima.\\n\\n1.
  **Roditelji moraju da u\u010de tinejd\u017eera duhovnim stvarima.** Ne samo da treba
  da ga u\u010de duhovnim \u010dinjenicama, nego i kako da ih primene u svakodnevnom
  \u017eivotu. To nije lako. Potpuno je jednostavno pru\u017eiti tinejd\u017eeru osnovne
  biblijske \u010dinjenice; ko su bile razli\u010dite osobe iz Biblije i \u0161ta
  su one radile. Ali, to nije ono \u0161to na kraju treba da uradimo. Treba da pomognete
  va\u0161em tinejd\u017eeru da shvati kakvo zna\u010denje za njega imaju biblijski
  likovi i na\u010dela. Mo\u017eete to da uradite samo uz dosta po\u017ertvovanosti,
  sli\u010dno kao i sa usredsredenom pa\u017enjom. Morate biti voljni da provedete
  neko vreme nasamo s tinejd\u017eerom da biste zadovoljili njegove emocionalne i
  duhovne potrebe.\\n\\n2. **Roditelji moraju da podele svoja li\u010dna iskustva.**
  Uz \u010dinjeni\u010dno znanje dobijeno u crkvi, putem verske pouke, i kod ku\u0107e,
  tinejd\u017eer ima samo sirov materijal za duhovni razvoj. Da bi postao duhovno
  zrela osoba, mora da nau\u010di da efektivno i ispravno koristi to znanje. Da bi
  to uradio, tinejd\u017eer mora da iskusi svakodnevno hodanje s Bogom i li\u010dno
  oslanjanje na njega.\\n\\nNajbolji na\u010din na koji u tome mo\u017eete da pomognete
  tinejd\u017eeru, jeste da s njim razgovarate o tome \u0161to je Bog u\u010dinio
  u va\u0161em \u017eivotu. Kako va\u0161 tinejd\u017eer sazreva, posve\u0107ujte
  sve vi\u0161e vremena da s njim razgovorate o tome kako vi do\u017eivljavate Boga,
  kako mu iskazujuete ljubav, kako se oslanjate na\\n\\nnjega u svakodnevnom \u017eivotu,
  kakvo je va\u0161e pouzdanje u njega, kako tra\u017eite njegovo vodstvo i pomo\u0107,
  kako mu zahvaljujete za ljubav, brigu, darove i usli\u0161ene molitve.\\n\\nRazgovarajte
  o ovim stvarima sa svojim tinejd\u017eerom naro\u010dito onda kad vam se de\u0161avaju,
  a ne posle. Jedino na taj na\u010din on ili ona mo\u017ee da stekne prakti\u010dno
  iskustvo. Pri\u010danje o iskustvima iz pro\u0161losti je jednostavno dodavanje
  \u010dinjenica, koje tinejd\u017eeru ne\u0107e omogu\u0107iti da u\u010di putem
  li\u010dnog iskustva. Puno je istine u staroj izreci: \u201eIskustvo je najbolji
  u\u010ditelj.\u201c Dajte mu deo va\u0161eg iskustva. \u0160to stekne vi\u0161e
  poverenja u Boga, bi\u0107e sna\u017enija li\u010dnost.\\n\\nVa\u0161 tinejd\u017eer
  mora da nau\u010di da Bog zadovoljava sve li\u010dne i porodi\u010dne potrebe, uklju\u010duju\u0107i
  i finansijske. Mora da zna za \u0161ta se mole njegovi roditelji. Na primer, mora
  da zna kad se molite za potrebe drugih. Kada je to prikladno, mora da zna za koje
  probleme tra\u017eite pomo\u0107 od Boga. Ne zaboravite da ga obave\u0161tite kako
  Bog deluje u va\u0161em \u017eivotu i kako vas upotrebljava da slu\u017eite nekom
  drugom. I, naravno, on treba da zna da se molite za njega i za njegove potrebe.\\n\\n3.
  Roditelji treba da budu primer pra\u0161tanja. Tinejd\u017eere moramo putem primera
  da u\u010dimo kako da pra\u0161taju i kako da tra\u017ee opro\u0161taj, i od Boga
  i od ljudi. U\u010dinite to pre svega pra\u0161taju\u0107i drugima. Zatim, kada
  uradite ne\u0161to \u0161to je povredilo va\u0161eg tinejd\u017eera, priznajte gre\u0161ku,
  izvinite se i tra\u017eite opro\u0161taj. Ne mogu da naglasim koliko je to va\u017eno.
  Danas se mnogi ljudi bore s krivicom. Oni ne mogu da oproste, niti mogu da osete
  da je njima opro\u0161teno. \u0160ta mo\u017ee biti jadnije od toga? Me\u0111utim,
  osoba koja je nau\u010dila kako da oprosti onima koji je uvrede, i koja mo\u017ee
  da tra\u017ei i primi opro\u0161taj, je sre\u0107na i jasno pokazuje znak mentalnog
  zdravlja.\\n\\n4. Roditelji treba da nau\u010de svoje tinejd\u017eere kako da se
  zrelo ophode s gnevom. Kao \u0161to smo rekli u sedmom poglavlju, normalno je da
  tinejd\u017eer do izvesne granice iskazuje gnev na pasivno-agresivni na\u010din.
  Taj antiautoritativni stav i motivacija, ako se ne zaustave i ne preusmere, uzrokuje
  da tinejd\u017eer izabere vrednosni sistem (uklju\u010duju\u0107i duhovne vrednosti)
  koji se ne podudara s roditeljskim, nego mu je obi\u010dno i suprotan. Kao \u0161to
  je ranije spomenuto, normalne pasivno-agresivne tendencije treba da se razre\u0161e
  i nestanu do \u0161esnaeste ili sedamaestne godine. Kada se to dogodi, tinejd\u017eerov
  osnovni stav prema legitimnom autoritetu (naro\u010dito roditeljskom) bi\u0107e
  pozitivan. Zatim, kako mlada osoba bira svoj \u017eivotni, eti\u010dki i duhovni,
  sistem vrednosti, obi\u010dno izme\u0111u osamnaestce i dvadeset pete godine, mo\u0107i
  \u0107e pritom racionalno, logi\u010dki i jasno da zaklju\u010duje i ne\u0107e biti
  pod uticajem samopora\u017eavaju\u0107eg, pasivno-agresivnog gneva. Zbog toga mi
  roditelji moramo marljivo da u\u010dimo na\u0161e tinejd\u017eere kako da se ophode
  s gnevom.\\n\\n\\\"LJUDI NADE\\\"\\n\\nMoj biv\u0161i pastor, Monkrif D\u017eordan
  (Moncrief Jordan), ispri\u010dao mi je pri\u010du o prijatelju. \u017delim da vam
  je ispri\u010dam jer je povezana s temom odnosa s tinejd\u017eerima. Prijatelj pastora
  D\u017eordana je rekao da, kad je poku\u0161ao da se bori protiv svoje sklonosti
  ka obeshrabrenju i o\u010daju, dopu\u0161tao je svojim \u201eljudima nade\u201c
  da govore njegovim \u201eglasovima s dna\u201c.\\n\\nTi glasovi u svima nama dolaze
  s dna na\u0161eg \u017eivota. Ponekad su to nagoni i pobude koje obi\u010dno povezujemo
  sa \u017eivotinjskim \u2013 navala besa, uzavreli gnev i \u017eelja za osvetom.\\n\\nAli,
  glasovi s dna idu preko emocionalnih i fizi\u010dkih reakcija. Proizilaze iz na\u0161e
  tamne strane \u2013 koju ve\u0107ina ljudi retko kad uo\u010di. Na dnu se oblikuju
  na\u0161i scenariji mr\u017enje, pohlepe, ponosa, oholosti i destrukcije. Te\u0161ko
  onom ko ne prepozn\u00e1 snagu tog podru\u010dja!\\n\\nGlasovi s dna tako\u0111e
  dolaze od ljudi koji nas, usled nedostatka samopo\u0161tovanja, krivice, frustracije
  ili suzdr\u017eanog neprijateljstva, saseku, govore nam kako je svet lo\u0161 i
  kako smo mi lo\u0161i. Ako im dopustimo, ovi glasovi mogu da nas odvedu u o\u010daj
  i bezna\u0111e.\\n\\nMe\u0111utim, na svu sre\u0107u, prijatelj pastora D\u017eordanu
  mu je tako\u0111e ispri\u010dao i o ljudima nade. To su ljudi, \u017eivi ili mrtvi,
  koji su nas podigli svojom ljubavlju, verom, nadom i hrabro\u0161\u0107u.\\n\\nSvima
  nama potrebni su ljudi koji \u0107e nam pokazati da mo\u017eemo da \u017eivimo iznad
  sitnih i paradoksalnih okolnosti \u017eivota, da ne treba da se valjamo u negativizmu
  i o\u010daju, da ne treba da dopustimo na\u0161im unutra\u0161njim sukobima da nam
  opusto\u0161e \u017eivot, da mo\u017eemo da \u017eivimo pobedonosno. Ljudi nade
  nam govore i re\u010dima i delima.\\n\\nNeki od ljudi nade u Bibliji su predivno
  opisani u Poslanici Jevrejima; ljudi koji dokazuju da je vera delotvrorna i da \u017eivot
  ima smisao i svrhu u bilo kom istorijskom razdoblju.\\n\\nMnogi od nas mogu da u\u010de
  iz sopstvenog iskustva. Ali, treba biti mudar i u\u010diti i iz iskustava drugih.
  Na\u0161a privilegija je \u0161to mo\u017eemo da dopustimo ljudima nade da nas spasu
  od nepotrebnih gre\u0161aka i sukoba i da nam oja\u010daju nadu.\\n\\nVerovatno
  treba da razmotrimo pisanje sopstvenog \u201eJedanaestog poglavlja Poslanice Jevrejima\u201c,
  prave\u0107i vlastitu listu ljudi nade. Da li shvatate da mi, kao hri\u0161\u0107ani,
  imamo vi\u0161e ljudi nade nego \u0161to je iko ikada imao u pro\u0161losti?\\n\\nS
  na\u0161e liste trebalo bi izabrati nekoliko danas \u017eivih ljudi s kojima s vremena
  na vreme mo\u017eemo da podelimo sve \u0161to nam je na srcu i du\u0161i. To su
  ljudi kojima potpuno verujemo i koje cenimo, i kojima mo\u017eemo da otkrijemo svoje
  tamne strane, sigurni da \u0107e nas voleti i moliti se za nas. Zato i postoji Hristova
  crkva.\\n\\nNa\u0161im tinejd\u017eerima su potrebni ljudi nade da bi im ulili nadu.
  Oni \u010duju i vi\u0161e nego dovoljno glasova s dna. Mi moramo biti ljudi nade
  na\u0161oj dragocenoj omladini. Ali, moramo da radimo na tome \u2013 ne treba da
  \u0161irimo sumornost i osudu. O, kako su na\u0161i tinejd\u017eeri osjetljivi na
  pesimizam, naro\u010dito roditeljski. Ne treba da upadnemo u o\u010daj dana\u0161njice.
  Treba verovati Bogu i gledati u ljude nade. Da li ste ve\u0107 pro\u010ditali jedanaesto
  poglavlje Poslanice Jevrejima? Ne! Po\u017eurite! Ono donosi neuni\u0161tivu nadu.\\n\\nBog
  nam daje nadu. Nada nije samo mi\u0161ljenje puno \u017eelja. Nada je znanje da
  su predivna Bo\u017eija obe\u0107ana istinita. Postoje mnoga Bo\u017eija obe\u0107anja
  koja nam je dao. Pro\u010ditajte ih sami. Po\u010dnite s Poslanicom Rimljanima 8:28:
  \u201eA znamo da Bog sve poma\u017ee na dobro onima koji ga ljube.\u201c\\n\\nIli,
  Knjiga proroka Jeremije 29:11: \u201eJer ja znam misli koje mislim za vas, govori
  Gospod, misli dobre a ne zle, da vam dam po\u0161ljedak kakav \u010dekate.\u201c
  Ili, razmotrite Knjigu proroka Isaije 41:10: \u201eNe boj se, jer sam ja s tobom;
  ne pla\u0161i se, jer sam ja Bog tvoj; ukrepi\u0107u te i pomo\u0107i\u0107u ti,
  i podupre\u0107u te desnicom pravde svoje.\u201c\\n\\nIli, pogledajte Psalam 34:19:
  \u201eMnoge nevolje ima pravednik, ali ga od svih izbavlja Gospod.\u201c\\n\\n**HRI\u0160\u0106ANSKA
  NADA**\\n\\nNada u na\u0161oj zemlji mora da o\u017eivi. Na\u0161oj omladini je
  potrebna nada da bi se suo\u010dili s neizvesnom budu\u0107no\u0161\u0107u. Znam
  da situacija sada ne izgleda ba\u0161 dobro. Ali, kao i u pro\u0161lim generacijama,
  ako na\u0161im mladima damo ono \u0161to im je potrebno da se suo\u010de s budu\u0107no\u0161\u0107u,
  bi\u0107e pripremljeni i \u010dinite dobro. Moramo da im pru\u017eimo pouzdanje,
  hrabrost, moralnu snagu i ose\u0107aj odgovornosti. Ali, bez nade im ne mo\u017eemo
  pru\u017eiti pouzdane dokaze da Bog postoji, da nas voli i da su njegova obe\u0107anja
  istinita.\\n\\nMonkrif D\u017eordan mi je pri\u010dao o \u010doveku kog je redovno
  pose\u0107ivao. Taj \u010dovek je bio veoma bolestan i na kraju su morali da mu
  amputiraju obe noge. Pastor D\u017eordan je mislio da \u0107e to verovatno uni\u0161titi
  radostan i optimisti\u010dan pogled na \u017eivot koji je taj \u010dovek imao. Ali
  nije. Taj \u010dovek bi se uz pomo\u0107 ortopedskog pomagala sam prebacio iz kreveta
  u invalidska kolica i odvezao se do sobe za posete u vrlo depresivnom stara\u010dkom
  domu u kom je \u017eiveo. Tamo bi svirao klavir i pevao\\n\\nsve dok i drugi ne
  bi zapevali s njim. Tokom svojih poslednjih godina bio je izvor nade i radosti za
  mnoge ljude.\\n\\nHri\u0161\u0107anska nada ne zavisi od toga \u0161to nam svet
  radi. Zavisi od toga \u0161to mi radimo u tom svetu, \u017eive\u0107i tako da uzvra\u0107amo
  na veliku Bo\u017eiju ljubav prema nama.\\n\\nDragi roditelji, ohrabrujmo svoje
  tinejd\u017eere i pru\u017eimo im nadu koja im je tako o\u010dajni\u010dki potrebna
  \u2013 budimo \u201eljudi nade\u201d, kao \u0161to neki nazivaju one koji brinu
  o drugima da bi im s ljubavlju pomagali tokom \u017eivota. To je te\u0161ko ostvariti,
  ali tvrdim da se isplati, jer je to kao zalivanje isu\u0161enog par\u010deta zemlje.
  I \u0161to je najbolje, na\u0161im tinejd\u017eerima dajemo ono \u0161to im je potrebno
  da postanu ljudi nade.\\n\\nPo prirodi nisam toliko \u010dovek nade kao moja supruga
  Pet. Bila mi je \u010dista radost tokom godina gledati na\u0161u \u0107erku kako
  ide maminim stopama.\\n\\nOna je tako\u0111e \u010dovek nade. Divim se tome i poku\u0161avam
  da budem takav!\\n\\nOdrastimo zajedno, dragi roditelji. Rade\u0107i na tome svakodnevno,
  postepeno \u0107emo postati sve vi\u0161e i vi\u0161e kao Hristos \u2013 prvobitna
  Osoba nade.\\n\\n12. STARIJI ADOLESCENT\\n\\nDok se tinejd\u017eeri pribli\u017eavaju
  vremenu normalnog odvajanja od ku\u0107e, i dalje su im potrebni roditelji da im
  pomognu da ostvare taj nesiguran prelaz u zrelo doba. Suprotno pretpostavci ve\u0107ine
  roditelja, taj prelaz se ne de\u0161ava odmah posle zavr\u0161etka \u0161kole ili
  iseljenja iz ku\u0107e.\\n\\nPrelaz u zrelo doba treba da bude postepen proces odvikavanja
  za koji su se pripremali i roditelji i tinejd\u017eer.\\n\\nVi se pripremate za
  tu promenu tako \u0161to omogu\u0107avate tinejd\u017eeru da nau\u010di da \u017eivi
  nezavisnim \u017eivotom. Dok va\u0161e dete odrasta, mo\u017eete da mu pru\u017eite
  iskustva \u017eivljenja van roditeljskog doma, kao \u0161to su letnji kampovi i
  poseta rodbini. Zatim treba da pove\u0107ate njegove obaveze da biste se uverili
  da stvarno mo\u017ee da se brine o sebi. Mo\u017ee li sam da opere svoj ve\u0161?
  Mo\u017ee li da pripremi ceo obrok? Mo\u017ee li da upravlja svim ostalim potrebnim
  za nezavisan \u017eivot? Te potrebe se \u010desto previde, naro\u010dito kod de\u010daka.
  Nije neobi\u010dno za mladi\u0107a ili devojku koji prvi put \u017eive sami, da
  uvek pripremaju iste nezdrave obroke pun\u0435 skroba, sve dok im ne ponestane vitamina
  i postanu podlo\u017eni bolestima.\\n\\nDo vremena kada va\u0161 tinejd\u017eer
  postane nezavisan, trebalo bi da mo\u017ee da upravlja svojim finansijama. To zna\u010di
  da predvida prihode i da pazi na svoj teku\u0107i ra\u010dun. Takve pojedinitosti
  mogu da izgledaju trivijalne i kao da se podrazumevaju, ali ni mnogi odrasli ne
  uspevaju da upravljaju svojim teku\u0107im ra\u010dunom, a jo\u0161 manje da se
  disciplinuju da u\u0161tede novac.\\n\\nPotrebno je vreme da nau\u010dite tinejd\u017eera
  da upravlja svojim poslovima; to se ne doga\u0111a samo od sebe. Zapanjen sam, na
  primer, koliko mnogo studenata ne mo\u017ee \u010dak ni da ustane ujutro da bi na
  vreme stigli na predavanja. Samodisciplina se najbolje u\u010di pre napu\u0161tanja
  dom\u0430. Retko kad se nau\u010di posle.\\n\\nDo\u017eivotne navike se obi\u010dno
  oblikuju u kasnoj adolescenciji. Iako je ve\u0107ina tinejd\u017eerovih osobina
  delimi\u010dno formirana, one se jo\u0161 uvek mogu menjati. I roditelj i tinejd\u017eer
  treba da iskoriste to vreme za ja\u010danje pozitivnih osobina i, nadamo se, ubla\u017eavanje
  onih manje po\u017eeljnih.\\n\\nUSMERENOST KA CILJU\\n\\nJedan od najva\u017enijih
  aspekata li\u010dnosti tinejd\u017eera je stepen njegove usmerenosti ka cilju. Niko,
  naro\u010dito ne tinejd\u017eer, nije savr\u0161eno uravnote\u017een u tom podru\u010dju.
  Neki ljudi su previ\u0161e usmereni ka cilju, ula\u017eu skoro sve svoje snage da
  bi dostigli ono \u0161to \u017eele \u2013 dobre rezultate na ispit\u0443, diplom\u0443,
  novac \u2013 sve do \u017ertvovanja jednako va\u017enih stvari kao \u0161to je zabava,
  odmor i li\u010dni odnosi. Osoba koja je previ\u0161e usmerena ka cilju sklona je
  perfekcionizmu, osudivanju, rigidnosti u mi\u0161ljenju, nepopustljivosti, napetosti
  i zabrinutosti. Sve prihvata previ\u0161e li\u010dno i ozbiljno. Mnogi ljudi koji
  \u010ditaju ovu knjigu \u0107e se uklopiti u tu sliku, ba\u0161 kao i ja.\\n\\nDobro
  je biti savestan i usmeren ka cilju. Me\u0111utim, ljudi koji u tome preteruju skloni
  su da \u017eivot smatraju mu\u010denjem s mal\u043e u\u017eivanja. Tako\u0111e su
  skloni depresiji, kad postaju stariji, naro\u010dito u srednjim godinama. Smisa\u043e
  njihov\u043e\u0433 \u017eivota \u0458\u0435 postizanje ciljeva. Kada ostvare jedan
  cilj, pitaju se koji im \u0458\u0435 jo\u0161 preostao. Ako ne ostvare sve ciljeve,
  nalaze mal\u043e sm\u0438\u0441\u043b\u0430. Ako va\u0161 stariji tinejd\u017eer
  ima ovakve osobine, mo\u017eete mu biti od ogromne pomo\u0107i u\u010de\u0107i ga
  da prona\u0111e zna\u010daj u prijatnim hobijima i drugim na\u010dinima opu\u0161tanja,
  a naro\u010dito da nau\u010di koliko \u0458\u0435 neizmerna vrednost prijateljstva
  \u0438 li\u010dnih odnosa. Jo\u0161 uvek \u0458\u0435 relativno lako promeniti starij\u0435\u0433
  tinejd\u017eera. Me\u0111utim, \u0161to \u0458\u0435 osoba starija, sve \u0458\u0443
  \u0458\u0435 te\u017ee promeniti. \u0160to \u0458\u0435 odrasla osoba vi\u0161e
  perfekcionista \u0438 usmerena ka cilju, \u0442\u043e \u0458\u0435 \u0441\u043a\u043b\u043e\u043dija
  da postane poti\u0161tena, depresivna, kruta \u0438 neprijatna u starosti.\\n\\nSe\u0107am
  se dvoje ljudi koji predstavljaju potpuni kontrast u tom pogledu. Jednom sam sreo
  \u0161ezdesetsedmogodi\u0161njaka koji je mnogo radio, posvetiv\u0161i skoro svu
  svoju energiju poslu. Imao je malo vremena za porodicu, odr\u017eavao je tek nekoliko
  prijateljstava i bio potpuni perfekcionista. Njegov \u017eivot je bio potpuno zadovoljavaju\u0107i,
  dok nije oti\u0161ao u penziju. Ostav\u0161i bez cilja (te\u0161kog posla), izgubio
  je skoro sav smisao \u017eivota i ubrzano pao u duboku depresiju. Kad sam ga video,
  buljio je ispred sebe, kao da je u katatoni\u010dkom transu. Jedva se pomerao, samo
  je sedeo nepomi\u010dno iz dana u dan, dok ga porodica nije dovela na le\u010denje.\\n\\nPotpuna
  suprotnost je na\u0161a draga kom\u0161inica, udovica. Bila je uspe\u0161na \u017eena,
  i jo\u0161 radi na mnogim projektima. Ipak, uvek je volela ljude i odr\u017eavala
  bliske odnose s njima. Ljudima je bilo divno samo da budu pored nje.\\n\\nKakva
  razlika! Onaj \u010dovek je bio preveliki perfekcionista i previ\u0161e usmeren
  ka cilju; na\u0161a kom\u0161inica je postigla predivnu ravnote\u017eu. Va\u017eno
  je zapamtiti da su te njihove li\u010dne karakteristike postojele ve\u0107 u kasnoj
  adolescenciji, a kasnije su se jednostavno intenzivirale tokom godina.\\n\\n\u0160to
  je tinejd\u017eer svesniji zna\u010denja i vrednosti ljudskih odnosa, razvi\u0107e
  se u prijatnu, simpati\u010dnu osobu koja mo\u017ee da se nosi sa \u017eivotnim
  udarcima bez onesposobljuju\u0107e depresije. Klju\u010d je u ravnote\u017ei. Ono
  \u0161to \u017eelite jeste da va\u0161 stariji tinejd\u017eer ima zadovoljavaju\u0107i
  stepen usmerenja ka cilju koji \u0107e mu omogu\u0107iti da mu \u017eivot bude ispunjen
  odgovaraju\u0107im uspesima. Me\u0111utim, takode \u017eelite da bude usmeren na
  ljude, tako da mo\u017ee da ostvari istinski va\u017ene li\u010dne odnose, kao supru\u017enik,
  roditelj i prijatelj.\\n\\nMoja draga \u010derka Keri i ja smo dugo razgovarali
  o ovome pre nego \u0161to je oti\u0161la na studije. Naglasio sam joj zna\u010daj
  prijateljstava ste\u010denih u srednjoj i na visoj \u0161koli. Ovo su stvarno posebna
  prijateljstva koja treba da traju godinama, ako je to mogu\u0107e. Predlo\u017eio
  sam joj da u adresar upi\u0161e imena i adrese svakog zna\u010dajnog prijatelja
  kog stekne, tako da mo\u017ee da ostane s njim u kontaktu tokom godina.\\n\\nIako
  sklapamo bliska prijateljstva posle \u0161kole, postoji ne\u0161to posebno u prijateljima
  iz \u0161kole i sa studija. To su ljudi koje mo\u017eemo da nazovemo i nakon mnogo
  godina i skoro uvek da naidemo na neposredan odziv. To je kao da se konverzacija
  jednostavno nastavlja tamo gde je prekinuta \u2013 u \u201estarim dobrim danima\u201c.
  Po\u0161tovanje prijatelja je veoma va\u017eno za starijeg tinejd\u017eera, koji
  je toliko usmeren ka cilju da je zbog toga sklon da obezvredi prijateljstvo.\\n\\nMe\u0111utim,
  va\u0161 tinejd\u017eer mo\u017ee da bude potpuno druga\u010diji. Mo\u017ee se potpuno
  usmeriti na opu\u0161tanje, zabavu, u\u017eivanje u \u017eivotu i odlaganje obaveza
  koliko god je to mogu\u0107e. Kao \u0161to vam nala\u017ee zdrav razum, treba da
  prepoznate ove osobine i da radite na njima jo\u0161 od rane adolescencije.\\n\\nMo\u017eete
  imati tinejd\u017eera koji bi mogao da bude dobar u \u0161koli, ali se previ\u0161e
  zabavlja s hobijama i s prijateljima, ne pridaje dovoljno vremena i napora \u0161kolskim
  obavezama. Prikladno je re\u0161iti ovaj problem direktno, ako va\u0161e dete nije
  izuzetno pasivno-agresivno. Ako tinejd\u017eer nema problema s gnevom, mo\u0107i
  \u0107ete mu pomo\u0107i da uravnote\u017ei svoj pristup odgovornosti. Ako, kao
  roditelj, va\u0161 posao radite dobro, obezbe\u0111uju\u0107i tinejd\u017eeru da
  se ose\u0107a iskreno voljenim, imate svako pravo i odgovornost da ga direktno podstaknete
  da preuzme izvesni stepen odgovornosti i posveti se postizanju cilja.\\n\\nOvo me
  podse\u0107a na iskustvo s na\u0161im sinom Dejvidom, kad je imao trinaest godina.
  Mogao je da ima dobre ocene, i imao ih je dok nije napunio dvanaest godina i postao
  toliko obuzet fudbalom i prijateljima, da je njegova knji\u017eica bila puna trojki.
  Znaju\u0107i da je to daleko ispod njegovih mogu\u0107nosti, i videv\u0161i njegovu
  sna\u017enu sklonost ka zabavi, veselju i prekomernom dru\u017eenju, Pet i ja smo
  znali da moramo ne\u0161to da preduzmemo. Dogovorili smo se sa svakim od njegovih
  u\u010ditelja da nam jednom nedeljno u narednih \u0161est nedelja, \u0161alju obave\u0161tenja
  o ocenama. Rekli smo Dejvidu da\\n\\nse, kad god dobije ocenu manju od \u010detvorke,
  slede\u0107e nedelje ne\u0107e mo\u0107i baviti sportom. Smernice za dobre navike
  u\u010denja bile su postavljene i nagla\u0161ene potencijalnom zabranom. Ne samo
  da je slede\u0107e nastavni\u010dko obave\u0161tenje pokazalo da ima sve petice,
  nego se promenio i njegov stav prema u\u010denju. Ose\u0107ao se stvarno dobro zbog
  uspeha i vi\u0161e mu nije trebalo na\u0161e usmeravanje.\\n\\nS vremena na vreme,
  kako se budu pribli\u017eavali ispiti, stariji tinejd\u017eer \u0107e imati negativan
  stav prema u\u010denju. To se obi\u010dno de\u0161ava onima koji su i ranije imali
  pote\u0161ko\u0107a s u\u010denjem ili problema s opa\u017eanjem. To mo\u017ee dovesti
  do sukoba s roditeljima koji imaju visoka o\u010dekivanja od njegovog \u0161kolovanja
  u budu\u0107nosti. Svaki slu\u010daj treba razmotriti odvojeno. Video sam mnoge
  slu\u010dajeve te vrste re\u0161ene podsticanjem tinejd\u017eera da na godinu ili
  dve prekine studiranje kako bi radio ili volontirao. Takav postupak adolescentu
  daje vremena i iskustvo koje mu je potrebno da sazri, da se sredi i da se usmeri
  ka postizanju cilja, s obzirom na poziv i o\u010dekivanje dru\u0161tva.\\n\\n**PRIPREMA
  ZA STVARAN SVET**\\n\\nJedna od najte\u017eih dilema s kojima se suo\u010davamo
  mi roditelji jeste priprema na\u0161ih mladih da se izbore sa stvarnim svetom, alkoholom
  i drugim drogama, seksualnom razuzdano\u0161\u0107u, raspadom duhovnih vrednosti,
  i uop\u0161tenom zaokupljenos\u0107u sobom ili sebi\u010dno\u0161\u0107u. Te\u0161ko
  je \u010dak i pisati o ovoj temi, jer je kontroverzna. Verujem da je okrutna zabluda
  da treba potpuno izolovati dete i tinejd\u017eera od sveta kakav jeste, ali video
  sam mnogo roditelja koji to rade. Na kraju, naravno, moramo da pustimo na\u0161e
  sinove i \u010derke da odu. Ako nisu jo\u0161 kod ku\u0107e nau\u010dili kako da
  se nose s tim pritiscima, kako mogu da se suo\u010de sa \u017eivotom kad se osamostale?\\n\\nDok
  tinejd\u017eer \u017eivi u sigurnom okru\u017eenju svog doma, treba ga pomalo izlo\u017eiti
  ovim podru\u010djima, ali na kontrolisan na\u010din. Naravno, ne mislim na ohrabrivanje
  ili dozvolu da sve iskusi na svojoj ko\u017ei. Mislim na uve\u017ebavanje kako da
  se uhvati u ko\u0161ta\u010d sa stvarnim \u017eivotom, i na davanje povlastica zasnovanih
  na poverenju, njegovom pona\u0161anju i primerenosti okolnosti. Povlastice treba
  da uvodite postepeno da bi mu pomogle da se snade u razli\u010ditim okolnostima
  kako budu nailazile. Treba ga dobro uve\u017ebati da se izbori s ve\u0107inom \u017eivotnih
  situacija. Naravno, to ne zna\u010di da treba da u\u010destvuje u \u0161tetnim aktivnostima.
  Treba da nau\u010di kako da se zrelo kontroli\u0161e i da odlu\u010di da ostane
  \u010dist i neokalan \u0161tetnim aktivnostima dana\u0161njeg dru\u0161tva. Da biste
  kod tinejd\u017eera postigli taj stepen zrelosti, potrebno je vreme, priprema, uve\u017ebavanje,
  uverenost i samokontrola s va\u0161e strane.\\n\\nJedna od najozbiljnijih gre\u0161aka
  koju mo\u017eete da napravite je da pretpostavite da \u0107e se \u0161kola, crkva
  ili neka druga ustanova pozabaviti tim delom detetovog razvoja umesto vas. Roditelji
  imaju najve\u0107i uticaj na svoje dete, naro\u010dito u pogledu eti\u010dkih vrednosti
  ili stila \u017eivota. \u0160kole i crkve mogu da pomognu, ali bez primarnog u\u010de\u0161\u0107a
  roditelja, tinejd\u017eer obi\u010dno ne uspeva. Poslati ga na studije bez pripreme
  za \u017eivot je izbegavanje roditeljske odgovornosti. Video sam mnoge tinejd\u017eere
  koji su se kod ku\u0107e pona\u0161ali naizgled dobro, a podivljali bi \u010dim
  bi bili daleko od roditeljske kontrole. Nisu nau\u010dili da je samokontrola potrebna
  da bi mogli da se nose sa nezavisno\u0161\u0107u i slobodom.\\n\\nDa biste spre\u010dili
  tu katastrofu, radite s tinejd\u017eerom dok postaje nezavisan. \u017delite da on
  shvati da radite za njegovo dobro, a ne protiv njega, u korist njegove nezavisnosti
  i slobode. Pri tome pazite da koli\u010dina slobode koju mu dajete bude neposredna
  posledica toga u kojoj je meri opravdao va\u0161e poverenje. Tokom poslednjih meseci
  pre napu\u0161tanja doma, mo\u017eete postepeno da izjedna\u010davate njegove povlastice
  s onima koje \u0107e imati u novom prostoru \u2013 studentskom domu ili stanu. U\u010di\u0107ete
  ga da se uhvati u ko\u0161ta\u010d sa stvarima, koriste\u0107i samokontrolu i preuzimaju\u0107i
  odgovornost, kad nema nimalo ili ima malo roditeljske kontrole.\\n\\nTakvo uve\u017ebavanje
  je te\u0161ko za roditelje. Posle godina uve\u017ebavanja i nadziranja na\u0161e
  dece, moramo da nau\u010dimo da na\u0161e najdra\u017ee pustimo da odu, a to je
  zastra\u0161uju\u0107e iskustvo. Ali, to je\\n\\nmnogo lak\u0161e i konstruktivnije
  uraditi u ku\u0107i, na pa\u017eljivo planiran i postepen na\u010din, rade\u0107i
  zajedno s tinejd\u017eerom. To zna\u010di postepeno ukidanje \u0161to je mogu\u0107e
  vi\u0161e pravila, kako bismo tinejd\u017eeru omogu\u0107ili nekoliko nedelja ili
  meseci iskustva nezavisnosti, primerene za adolescente spremljen da ode od ku\u0107e.
  Moramo da budemo pa\u017eljivi. Ako tinejd\u017eere dobro uve\u017ebamo, oni \u0107e
  se dobro i pona\u0161ati.\\n\\nMe\u0111utim, postoji nekoliko vrlo \u010destih sukoba
  koji mogu biti uznamiruju\u0107i za ostatak porodice \u2013 dolazak u sitne sate
  i uznamiravanje ostalih uku\u0107ana. Ili neobzirno uskra\u0107ivanje porodice od
  saznanja gde \u0107e biti, naro\u010dito za vreme obroka. Ili izbegavanje obavljanja
  o\u010dekivanih ku\u0107nih poslova ili naloga. Ili nepojavljivanje gde i kada se
  o\u010dekuje. Ako ovakvo pona\u0161anje traje, roditelji treba da uskrate povlastice
  zasnovane na poverenju i posledicama pona\u0161anja, jer tinejd\u017eer jo\u0161
  nije spreman za potpuno preuzimanje odgovornosti.\\n\\nSIGURNOST\\n\\nIako se tinejd\u017eeri
  pribli\u017eavaju odraslosti, njihove emocionalne potrebe su se malo promenile od
  detinjstva. \u010cak i tom stadijumu im je potrebno da znaju da ih iskreno volimo,
  da smo im na raspolaganju, i da \u0107emo im pomo\u0107i kako god mo\u017eemo, za
  njihovo dobro. Sve dok ose\u0107aju da nam je zaista stalno do njih i da im poma\u017eemo
  da steknu nezavisnost, mo\u017eemo konstruktivno da uti\u010demo na njih.\\n\\nProblem
  za mnoge roditelje je stari neprijatelj \u2013 gnev. Neki roditelji koji su dobro
  kontrolisali gnev dok su njihovi adolescenti bili mladi, imaju ozbiljan problem
  s kontrolisanjem gneva na toj va\u017enoj prekretnici. Moramo da zapamtimo da je
  kona\u010dno odvajanje veoma te\u0161ko za tinejd\u017eere. To je dug proces odvikavanja
  tokom kog moramo ostati na raspolaganju za podr\u0161ku i pomo\u0107. Da li ste
  videli majku pticu koja gura svoje ptice iz gnezda kad za to dode vreme? Nedavno
  sam posmatrao nekoliko lastavi\u010dijih gnezda u kojima su se majke pripremale
  za ovaj te\u017eak zadatak. Neki od ptica su poleteli bez problema. Neki su imali
  pote\u0161ko\u0107a da nau\u010de da lete, i majka i otac su bili na raspolaganju
  da im pomognu kad je to bilo potrebno. I tada se desilo. Jedan pti\u0107 je besomu\u010dno
  poku\u0161avao da poleti, ali je stalno padao. Ru\u017eni mukli udarac nam je posvedo\u010dio
  tragediju \u2013 pti\u0107 nije bio spreman za odlazak i roditelji nisu mogli da
  mu pomognu u toj poslednjoj fazi.\\n\\n\u010cak i kada na\u0161i mladi odu od ku\u0107e,
  i dalje smo im potrebni. Potrebno im je da znaju da smo tu, na raspolaganju i spremni
  da im pomognemo kad im je to potrebno. U devetom poglavlju sam pomenuo kako smo
  Pet i ja, zajedno s Kerinim prijateljima posetili njen koled\u017e, kad je ona bila
  na prvoj godini. Svi ti divni, mladi ljudi bili su sre\u0107ni na koled\u017eu i
  s novim prijateljima. Ali, svi su se \u017ealili na isto \u2013 retko su se \u010duli
  s roditeljima. Nedovoljno poziva, pisama ili poseta.\\n\\nKada smo to kasnije ispri\u010dali
  Keri, priznala je da je i ona ose\u0107ala isto, \u0161to me je zaista iznenadilo.
  Ali, po\u0161to sam dobro razmislio i setio se mojih prvih dana van ku\u0107e, po\u010deo
  sam da shvatam. Odvajanje u dobrom odnosu roditelj-dete je sporo, i \u010desto bolno.
  Posle tog vikenda Pet i ja smo \u0440\u0435\u0448\u0438\u043b\u0438 da zovemo Keri
  svake nedelje uve\u010de da bismo je uverili da mislimo na nju, molimo se za nju
  i da smo spremni da joj pomognemo ako mo\u017eemo.\\n\\nJo\u0161 jedna karakteristika
  vezana za udaljavanje na\u0161ih mladih je njihova potreba da sve ostane isto kao
  \u0161to je bilo \u2013 ba\u0161 kao \u0161to su ostavili. To im poma\u017ee da
  se ose\u0107aju sigurnim. Dobra ideja je ostaviti stvari koliko je mogu\u0107e istim
  \u2013 naro\u010dito sobe i li\u010dne predmete. Tinejd\u017eer mo\u017ee da se
  ose\u0107a izuzetno povedenim ako ste njegovu sobu prepustili mladem bratu ili sestri.
  Nemojte da \u017eurite s prodajom ku\u0107e i selidbom u druge krajeve grada. \u010cuo
  sam nekoliko tinejd\u017eera kako ka\u017eu: \u201eNadam se da moji roditelji nikada
  ne\u0107e prodati na\u0161u ku\u0107u. \u017delim da uvek mogu da se vratim ku\u0107i.\u201c\\n\\nMe\u0111utim,
  najva\u017enije sidro sigurnosti, koje tinejd\u017eer ostavlja za sobom, je bra\u010dni
  odnos njegovih roditelja. Jedna od najrazornijih stvari koje mogu da se dese adolescentu
  ubrzo posle napu\u0161tanja doma je razdvajanje ili razvod roditelja. To je kao
  da se raspada temelj celog njegovog sveta. Ipak, zapanjuju\u0107e je koliko mnogo
  roditelja planira da \u201eostanu zajedno zbog dece, ali \u010dim oni napuste dom,
  razve\u0161\u0107emo se.\u201c\\n\\nTo je neobi\u010dno nerazumno. Ne samo da je
  time sru\u0161en tinejd\u017eerov osnovni oslonac, nego se udarac desio ba\u0161
  u vreme kad mu je podr\u0161ka najpotrebnija \u2013 kad o\u010dajni\u010dki poku\u0161ava
  da se prilagodi novom \u017eivotu, novim prijateljima i tako dalje. U ve\u0107ini
  slu\u010dajeva mlada osoba \u0107e biti optere\u0107ena teretom te\u0161ke krivice.
  Bez obzira na to koliko to nerazumno zvu\u010dalo, mlada osoba ose\u0107a da je
  ona nekako odgovorna, ili za lo\u0161 brak ili za razvod. Ako je razvod neizbe\u017ean,
  bolje je da se desi puno pre nego \u0161to tinejd\u017eer napusti dom, tako da prirodni
  ose\u0107aj gubitka i \u017ealjenja mo\u017ee da oseti uz pomo\u0107 roditelja,
  prijatelja, sve\u0161tenika, pre nego \u0161to krene na te\u017eak zadatak i napusti
  dom prvi put.\\n\\nPoznajem mladog mu\u0161karca koji se zove D\u017eon i koji je,
  u trenutku odlaska na koled\u017e, verovao da njegovi roditelji imaju sre\u0107an
  brak. Posle tri meseca oni su se razveli. Majka se ubrzo ponovo udala i prodala
  porodi\u010dnu ku\u0107u. D\u017eon je retko isao ku\u0107i, jer je to bilo previ\u0161e
  depresivno za njega. Njegov temelj sigurnosti je bio razoren. Mo\u017eete zamisliti
  \u0161ta je to uradilo njegovom unutra\u0161njem miru.\\n\\nDrugi va\u017ean faktor
  koji treba uzeti u obzir kad deca odlaze od ku\u0107e je povezanost s izvorima sigurnosti,
  stabilnosti i sazrevanja. Jedan od njih je crkva. Va\u017eno je da ne idemo samo
  redovno u crkvu s decom i tinejd\u017eerima, nego da preduzmemo sve da im to iskustvo
  u\u010dinimo prijatnim. Dobro organizovana grupa mladih je presudna, naro\u010dito
  u tinejd\u017eerskim godinama. Dok na\u0161a deca odlaze na studije ili se zapo\u0161ljavaju,
  trebamo da ih ohrabrimo da se uklju\u010de u crkvu i njene aktivnosti.\\n\\n**IZBOR
  SUPRU\u017dNIKA**\\n\\nJedan od prioriteta nas roditelja je da kod dece razvijemo
  sposobnost da sa sigurno\u0161\u0107u prepoznaju po\u017eeljne kvalitete budu\u0107eg
  supru\u017enika. Tinejd\u017eeru nije lako da prepozna osobine koje kod vr\u0161njaka
  upu\u0107uju na sposobnost da bude dobar suprug ili roditelj. Po\u0161to je izlazak
  donekle izve\u0161tacena situacija, tinejd\u017eer nema mnogo toga na \u0161ta se
  mo\u017ee osloniti, osim na \u010dinjenicu koliko se \u201edobro\u201c ose\u0107a
  s tom osobom. Naravno, mo\u017ee biti katastrofalno pouzdati se u tako povr\u0161na
  ose\u0107anja. Redovno savetujem mlade ljude koji su napravili tu tragi\u010dnu
  gre\u0161ku. Prilikom odlu\u010divanja da se upuste u vezu ili ven\u010daju, uzeli
  su u obzir samo svoja ose\u0107anja, umesto da su razmotrili druge, mnogo va\u017enije
  faktore.\\n\\nPrvo \u0161to smo Pet i ja nau\u010dili Keri o ovome je da vidi kakav
  je karakter mladi\u0107a, i da razmotri ose\u0107anja koja u njoj pobuduje. Objasnili
  smo joj da je najbolji pokazatelj toga kako \u0107e se on pona\u0161ati prema budu\u0107oj
  supruzi posle ven\u010danja, na\u010din na koji se trenutno pona\u0161a prema ljudima
  prema kojima ne mora da bude obziran \u2013 prema starijima, neprijatnim ili bespomo\u0107nim.
  Rekli smo joj da posmatra kako se pona\u0161a prema ljudima koji ga poslu\u017euju,
  kao \u0161to su konobari i konobarice.\\n\\nTre\u0107e o \u010demu treba da razmisli,
  a \u0161to je Keri dosta zaintrigiralo, je kako se pona\u0161a i odnosi prema deci,
  naro\u010dito maloj. Jer vidite, Keri ima dva mlada brata, koji mogu da poslu\u017ee
  kao savr\u0161en test. Pre nego \u0161to smo joj to rekli, trudila se da Dejvid
  i Dejl ne budu na vidiku pre sastanka. Posle na\u0161eg razgovora, Keri je zamolila
  Dejvida i Dejla da otvore vrata i popri\u010daju s njenim prijateljem dok ona ne
  bude \u201espremina\u201c. Bilo je interesantno gledati Keri kako sa strane posmatra
  kako se on pona\u0161a prema njenoj bra\u0107i. Na\u0161 razgovor je zaista pomogao
  Keri da stekne dragocen uvid u karakter mladi\u0107a s kojima je izazila.\\n\\nKeri
  je naravno primenila vredne metode koje je nau\u010dila od nas. Udala se pre nekoliko
  godina. Njen mu\u017e, Kris je jedan od najdivnijih mladih ljudi koje smo Pet i
  ja upoznali. Iskreno zahvaljujemo Bogu za Krisa. (Usput budi re\u010deno, on i Keri
  su nam podarili divnu unuku, Kemi.)\\n\\nSlede\u0107a karakteristika osobe koja
  \u0107e biti dobar supru\u017enik i roditelj je sposobnost prosudivanja. Ovo je
  klju\u010dno za bra\u010dni odnos i odnos roditelj-dete; da bi bio razborit, \u010dovek
  mora da zna da razmi\u0161lja. Ako osoba mo\u017ee da prosuduje, obi\u010dno je
  sposobna da postigne sporazum ili kompromis u roditeljskim sukobima. Drugim re\u010dima,
  osoba mo\u017ee da razmatra stvari i pojave sa svoje ta\u010dke gledi\u0161ta, ali
  mo\u017ee i voljna je da prizna da gre\u0161i ili da pristane na kompromis, pa je
  mogu\u0107 obostrano zadovoljavaju\u0107i dogovor sa supru\u017enikom ili detetom.
  S druge strane, osoba koja ne mo\u017ee da prosuduje, skoro uvek \u0107e da postupi
  nerazumno. Ne\u0107e mo\u0107i da raspravlja o problemu, to jest da objasni svoj
  stav u sukobu, i verovatno \u0107e da zahteva da sve bude po njenom.\\n\\nAko se
  potra\u017ee, te karakterne osobine mogu da se identifikuju ve\u0107 posle kratkog
  vremena, naro\u010dito u situacijama u kojima je osoba ljuta. U osobu koja se nikad
  ne ljuti treba sumnjati. Ona je verovatno pasivno-agresivna ili mo\u017eda nema
  sposobnost da sa bilo kim razvije stvarnu emocionalnu vezu. S oba tipa karaktera
  je te\u0161ko \u017eiveti. Me\u0111utim, moramo re\u0107i da postoje bri\u017ene
  osobe koje su jednostavno toliko suzdr\u017eane, da se retko kad mogu isprovocirati
  na gnev. Ja im zavidim. Retki su.\\n\\nDrugi pokazatelj, koji je izuzetno va\u017ean
  ali ga je te\u0161ko razaznati, je sposobnost osobe da se nosi s ambivalencijom.
  Ambivalencija ozna\u010dava suprotna ose\u0107anja prema istoj osobi. Iako je ambivalenciju
  te\u0161ko prepoznati, mislim da je najbolji na\u010din za to da posmatramo toleranciju
  te osobe prema razli\u010ditim tipovima ljudi. Na primer, posmatrajte osobu koja
  ima sna\u017ena i beskompromisna ose\u0107anja o svemu. Za nju ne postoji sivo podru\u010dje,
  nema mesta za kompromis. Ona vidi ljude kao ispravne ili pogre\u0161ne, kao dobre
  i lo\u0161e. Ova osoba ne mo\u017ee da vidi da u svakome postoji i dobro i lo\u0161e,
  prijatno i neprijatno. Svi imamo ambivalentna ose\u0107anja. Izla\u017eenje na kraj
  s njima, na svesnom nivou, je pokazatelj zrelosti. (Pogledate drugo poglavlje knjige
  Kako zaista voleti svoje dete radi podrobnije razrade pitanja ambivalencije.)\\n\\nDrugi
  na\u010din za procenjivanje kakav \u0107e neko biti supru\u017enik ili roditelj,
  je posmatranje kako se sla\u017ee sa svojim roditeljima, bra\u0107om, sestrama,
  bakama, dedama, drugom rodbinom, i dugogodi\u0161njim prijateljima. To je odli\u010dan
  pokazatelj kako \u0107e se on ili ona pona\u0161ati prema supru\u017eniku ili deci
  u budu\u0107nosti.\\n\\nAko mlada osoba previ\u0161e prepusti ose\u0107anjima da
  uti\u0107u na izbor supru\u017enika, ne\u0107e uspe\u0161no odrediti istinski karakter
  budu\u0107eg bra\u010dnog druga. Karakter nije lako definisati, niti ga je lako
  otkriti u osobi. Karakter je stav koji pojedinac ima prema samome sebi, a u odnosu
  prema drugima i njihovim na\u010dinima pona\u0161anja.\\n\\nMnogi ljudi prirodno
  pokazuju svoje najbolje lice da bi ostavili dobar utisak, naro\u010dito tokom udvaranja.
  Kasnije \u0107e se, me\u0111utim pojaviti njihov pravi karakter sa svim dobrim i
  lo\u0161im stranama. Presudno je va\u017eno da osoba zna sve \u0161to god mo\u017ee
  o karakteru budu\u0107eg supru\u017enika. Nazalost, potrebno je mnogo vremena da
  pravi karakter osobe izade na videlo \u2013 naro\u010dito negativne osobine. Jedna
  od najva\u017enijih istina koju sam poku\u0161ao da prenesem svojoj deci je da neku
  osobu morate poznavati najmanje dve godine pre nego \u0161to shvatite njegov ili
  njen pravi karakter. To je jedan od klju\u010dnih razloga zbog kojih je stopa razvoda
  tako visoka. Ve\u0107ina ljudi stupa u brak uglavnom na osnovu ose\u0107anja, ne
  razumevaju\u0107i karakter supru\u017enika, i zbog toga se ven\u010daju prerano.\\n\\n**BUDITE
  OPTIMISTI\u010cNI**\\n\\nU na\u0161oj raspravi o mladim ludima govorili smo o nekim
  bolnim stvarima. Ali, tako\u0111e smo razgovarali i o tome kako mo\u017eemo i treba
  da budemo optimisti\u010dni i puni nade u pogledu na\u0161ih\\n\\ntinejd\u017eera
  i njihove budu\u0107nosti. Da, mnogi mladi imaju problema \u2013 neki od njih su
  te\u0161ki. Ali, mnogi divno napreduju i zaista me ohrabruju. Mnogo puta su nas,
  radi dru\u017eenja, posetili studenti iz na\u0161e crkve. Vreme prove\u0111eno s
  tim toplim, zdravim, zrelim, \u017eivahnim i ljubaznim ljudima bilo je okrepljuju\u0107e.
  Ti susreti su me ponovo u\u010dvrstili u uverenju da su na\u0161i napori vredni.\\n\\nDragi
  roditelji, ovu knjigu o tinejd\u017eerima napisao je jedan roditelj, ba\u0161 za
  vas. Moja \u017earka \u017eelja je bila da vidim svoju decu kako odrastaju u sna\u017ene,
  zdrave, sre\u0107ne i nezavisne odrasle osobe \u2013 i oni sada jesu takvi, Bogu
  hvala. \u017delim isto i va\u0161em tinejd\u017eeru. Mo\u017eda je te\u0161ko potpuno
  shvatiti neke odlomke iz prethodnih poglavlja posle prvog \u010ditanja. Toplo vam
  preporu\u010dujem da sada ponovo pro\u010ditate knjigu, i da dopustite da vam ona
  govori u konkretnim okolnostima. Treba neprekidno da se podse\u0107amo na to kako
  stvarno da volimo svoje tinejd\u017eere.\"", "\"OD VASINE DO SLAVIJE\\n\\nNa stanici
  kod muzeja u Vasinoj u\u0111oh u autobus 31 \u2013 guranjem potisnut slu\u010dajno
  do nje: ta\u010dnije nad njom dok sedela je otvarala se njena letnja majica na \u201eV\\\"
  izrez gde bujali su njeni mladi vrtovi mamili su sve: nametljivo, pa i moj umoran
  pogled sit preteranosti oprobane vrste. Sva zaneta nad prizvanom SMS porukom ve\u0107
  se svim \u010dulima predavala nekom bilmezu kom je sasvim ravnodu\u0161no ostavih
  na milost i nemilost; a ja si\u0111oh na Slaviji dragoj od renoviranja propaloj.\\n\\n1.
  jun 2018.\\n\\nKO VOLJEN JE VOLI\\n\\nKo voljen je, voli Ko odba\u010den je, odbacuje;
  Zakon je to k\u00f4 jutro \u0161to svi\u0107e. No\u0107 se gusne u ti\u0161ini Lave\u017e
  pasa zavija u daljini. Svako sa svojom save\u0161\u0107u Ostavljen je Pred neizvesnim.\\n\\nMirko
  Magara\u0161evi\u0107\\n\\n31\\n\\nGDE JE ATLANTIDA?\\n\\nO\u010di su na pu\u010dini
  netremice. Glasine pod oblacima je prate. Jata riba sjaj trzaja srebrnih Ka njoj
  bacaju. Ve\u010dno streme.\\n\\nPo siroma\u0161nim lukama pri\u010de Ostareli mornari
  zapodevaju I tvrde da o Njoj sve ve\u0107 znaju Preko uzdaha daju sebi maha.\\n\\nNjihove
  povesti o lutanju Sli\u010dne zaludnom tra\u017eenju. Ponekad, kroz prasak smeha
  Slute je u pijanstvu bez daha.\\n\\nNastavlja\u0161 ka daljinama neznanim smerokazima,
  stremi\u0161 bezdanim. Li\u010di\u0161 na prekaljenog istra\u017eiva\u010da U \u017eudnji
  gladan za izmaklim dokazima.\\n\\nZarad Nje sve ostavlja\u0161 za sobom. Bezglavo
  \u010dezne\u0161 za njom Kao da lepotica grljena pod nebom Ve\u0107 osvojena nije
  s tobom.\\n\\nIako te zla slutnja sustopice goni, Ne\u0107e\u0161 da poveruje\u0161
  kao ni svi oni Koji pre tebe poku\u0161avahu da tra\u017ee, Jer da Ona ne postoji,
  ko sme da ka\u017ee?\\n\\n32\\n\\nSA DNA DUGA\u010cKOG BOLNI\u010cKOG HODNIKA\\n\\nSa
  dna duga\u010dkog bolni\u010dkog hodnika Sa strane probadanog Letnje osun\u010danim
  prozorima Iskrsavala je zanosno Siluetom Boti\u010delijevog \u201eProle\u0107a\\\"
  \u010cas kroz polutame zev Pa kroz snop sun\u010deve svetlosti.\\n\\nGibala se mo\u0107no
  plavokosa Pod bluzom pomorand\u017eine boje Njihaj zrelih latica ru\u017ee Sve bli\u017ee
  i bli\u017ee Korakom boginje I\u0161tar Pristizala je spremno Na prvi ljubavni sastanak.\\n\\n7.
  avgust 2009.\\n\\n33\"", "\"Jesenji dan\\n\\nGospode, \u00e8as je. Ljeto bje\u0161e
  dugo.\\n\\nSpusti sad sjenu na sun\u00e8ane ure,\\n\\nA vjetre pusti da polijima
  jure.\\n\\nZapovjedi jedrinu zadnjem vo\u00e6u;\\n\\nUdijeli mu jo\u0161 dva ju\u017enija
  dana,\\n\\nNek ispod ploda savine se grana,\\n\\nA vinu podaj posljednju slatko\u00e6u.\\n\\nTko
  sada nema ku\u00e6e, taj je vi\u0161e\\n\\nSagradit ne\u00e6e. Tko je sada sam,\\n\\nOstat
  \u00e6e sam, da slu\u0161a romon ki\u0161e,\\n\\nDa bdije, \u00e8ita, duga pisma
  pi\u0161\u0107e,\\n\\nI luta po alejama, gdje dah\\n\\nJesenjeg vjetra suho li\u0161\u0107e
  njih.\\n\\nRainer Maria Rilke\\n\\nPreveo Dobri\u0161a Cesari\u00e6\\n\\n/* Style
  Definitions */\\np.MsoNormal, li.MsoNormal, div.MsoNormal\\n{mso-style-parent:\\\"\\\";\\nmargin:0cm;\\nmargin-bottom:.0001pt;\\nmso-pagination:widow-orphan;\\nfont-size:12.0pt;\\nfont-family:\\\"Times
  New Roman\\\";\\nmso-fareast-font-family:\\\"Times New Roman\\\";}\\np\\n{mso-margin-top-alt:auto;\\nmargin-right:0cm;\\nmso-margin-bottom-alt:auto;\\nmargin-left:0cm;\\nmso-pagination:widow-orphan;\\nfont-size:12.0pt;\\nfont-family:\\\"Times
  New Roman\\\";\\nmso-fareast-font-family:\\\"Times New Roman\\\";}\\n@page Section1\\n{size:595.3pt
  841.9pt;\\nmargin:70.85pt 70.85pt 70.85pt 70.85pt;\\nmso-header-margin:35.4pt;\\nmso-footer-margin:35.4pt;\\nmso-paper-source:0;}\\ndiv.Section1\\n{page:Section1;}\"",
  "\"Igrice poverenja\\n\\nPobogu, shvata\u0161 li ti uop\u0161te \u0161ta je to usamljenost?
  Povr\u0161no, u skladu sa svojim \u017eivotom, prebire\u0161 po registru situacija
  u kojima si se nalazio, u kojima bi se jednog dana, ko zna kog, mogao na\u0107i,
  ali ne nalazi\u0161 pravovaljan i adekvatan odgovor. Samo sle\u017ee\u0161 rame\u00ad
  nima.\\n\\n\u0160ta da se ka\u017ee, osim da to be\u0161e samo\u0107a koja, poput
  nekog lukavog i bezobzirnog ubice, potiho ali sigurno ubija.\\n\\nBe\u0161e li to
  ono stanje u kojem se, do pre koju go\u00ad dinicu, nalazio nekada\u0161nji \u0161ef
  pogona za preradu vo\u0107a u Kulpinu, prehrambeni tehni\u010dar Aleksandar Pavlo\u00ad
  vi\u0107? Ba\u0161 onda kada je ostao, kako ka\u017eu, sam na svetu i kada su ga
  samo gledali zidovi soba u trosobnom sta\u00ad nu sme\u0161tenom na dvanaestom spratu
  zgrade koja tako uporno i tako stameno stra\u017eari nad promenljivo\u0161\u0107u
  boja \u010desto problemati\u010dnog Dunava.\\n\\nUbija te samo\u0107a. Koliko li
  je samo puta do sada \u010duo tu dobronamernu ali prete\u0107u re\u010denicu? Ni
  pre\u00ad brojati ne bi mogao \u010dak i da je savr\u0161eni bo\u017eanski ra\u00ad
  \u010dunovo\u0111a i da su pred njim bar jo\u0161 dva \u017eivota, jedan pro\u0161li
  i jedan budu\u0107i. Zalud.\\n\\nKoliko je samo puta morao poslednjih godina da
  slu\u0161a tu tako gorku i ubita\u010dnu istinu, od koje se tako te\u0161ko i neuspe\u0161no
  branio bez obzira na svoj opravdan i sasvim razumljiv otpor. Naravno da nije vredelo,
  naravno da nema odbrane od dobronamerne i ubita\u010d\u00ad ne istine. A takva istina
  je, ako \u0107emo pravo za pravo, najgora, ubistvena dozlaboga.\\n\\nZaista, ne
  postoji odbrana od svih tih sentimen\u00ad talnih proseravanja o zlatnoj jeseni
  \u017eivota, o najlep\u0161im godinama koje ga blagorodno susti\u017eu, o nasu\u0161noj
  po\u00ad trebi da \u010dovek, u tim najlep\u0161im godinama, da li je tako ili nije,
  ima nekog pored sebe, nekog ko \u0107e mu se uvek na\u0107i pri ruci u trenutku
  kada mu, nedajbo\u017ee i daleko bilo, \u0161to\u0161ta, iz ko zna kojih razloga,
  krene naopako i po zlu.\\n\\nI jo\u0161: ne postoji i nemogu\u0107a je odbrana od
  dobro\u00ad namernih i sau\u010desni\u010dkih saveta prijatelja, kafanskih poznanika,
  zainteresovanih du\u0161ebri\u017eni\u010dkih \u017eenica, koje su bezrezervno skrbile
  nad njegovom budu\u0107no\u00ad \u0161\u0107u, ne postoji odbrana od korisnih saveta
  \u0161armantnih voditeljki ranih jutarnjih televizijskih programa, kao \u0161to
  uop\u0161te ne postoji odbrana od nasrtljivih poli\u00ad ti\u010dara, histeri\u010dnih
  psihologa, namrgo\u0111enih psihijatara i klimakteri\u010dnih socijalnih radnica.\\n\\nEto,
  nije naodmet da odmah shvati\u0161, uverava ga predsednik ku\u0107nog saveta, horovo\u0111a
  zbora stanara, lakonogi i dosti\u017eni ku\u0107epazitelj, nije naodmet da zna\u0161
  da su kom\u0161ije uvek tu, kom\u0161ije su ti najbolji prijatelji, bar njih sve
  poznaje\u0161, sve dobri, vredni i po\u0161teni ljudi. \u0160ta ka\u017ee\u0161,
  je li tako ili nije? Pa, naravno, i kom\u0161inice.\\n\\nJeste, u pravu si, ponekad
  prljaju ulaz u zgradu, pljuju u liftu, ponekad bacaju sme\u0107e kroz prozor, na\u00ad
  ro\u010dito oni sa vi\u0161ih spratova, ponekad galame, sva\u0111aju se, pevaju,
  slave ro\u0111endane, \u0161ta \u0107e\u0161, ljudi smo, ali sve u svemu to su dobre
  kom\u0161ije, na njih treba sada da se osloni\u0161, slu\u0161aj \u0161ta ti ka\u017eem,
  oni \u0107e sigurno biti uz tebe i u najte\u017eem \u010dasu.\\n\\nBa\u0161 me briga,
  ba\u0161 me briga ako tebe ne bude, tako je odgovarao dok je slu\u0161ao te njene
  svakida\u0161nje pouke.\\n\\nMora\u0161 s kom\u0161ijama uvek da bude\u0161 ljubazan
  i pa\u00ad \u017eljiv, govorila je i njegova pokojna \u017eena, ko \u0107e ti se
  drugi na\u0107i pri ruci kada mene jednog dana ne bude.\\n\\nNemoj tako, nemoj tako.\\n\\nNemoj
  tako, nemoj tako.\\n\\nKao da je va\u017eno, kada tebe ne bude, kako \u0107e to
  meni biti.\\n\\nI toga se naslu\u0161ao bar za dva \u017eivota.\\n\\nDa, od svega
  toga \u0161to se dogodilo uglavnom mu je muka, kao da mu i ovako, sveukupno, nije
  muka od svega i sva\u010dega.\\n\\nOsim nepodno\u0161ljive mu\u010dnine, sve \u0161to
  bi sada mogao da ka\u017ee, na obali uvek hirovitog i prevrtljivog Dunava, o dobronamernim
  savetima i seratorima iz kom\u0161iluka, izazvalo bi u njemu neko \u010dudno, neodre\u00ad
  \u0111eno i podeljeno ose\u0107anje: od besa i \u017eelje za osvetom do nemo\u0107i
  i zbunjenosti.\\n\\nSto mu muka do\u0111e kao dobro jutro, a hiljadu kao laku no\u0107.\\n\\nDakle,
  kako ono zbore: izuzeci postoje da bi se potvrdilo pravilo. Iako, uostalom, te\u0161ko
  shvata tu neoborivu formulu po kojoj slu\u010dajni izlazak sunca na za\u00ad\\n\\nUostalom,
  kada bi imao kome, vi\u0161e bi voleo da pri\u010da o poverenju i izuzecima. O izuzecima
  iz kom\u0161i\u00ad luka i igricama poverenja, \u010dime je sve po\u010delo i \u010dime
  se sve izgleda zavr\u0161ava.\\n\\npadnoj strani potvr\u0111uje \u010dinjenicu da
  se sunce uvek pomalja na istoku.\\n\\nMe\u0111utim, eto, ko bi rekao da kom\u0161iluk,
  prosto naprosto, vrvi i klju\u010da od, manje-vi\u0161e, brojnih ljuba\u00ad znih
  kom\u0161inica.\\n\\nOlako tvrdi da nema pojma. Valjda samo zato \u0161to je sada
  tek \u010dangrizavi, nepoverljivi, bolesni i prevareni starac koji se, bogu hvala,
  naslu\u0161ao saveta, preporuka, pravila i uputstava. I koji, kao i svi oprezni
  i nepover\u00ad ljivi starci, jednom nije uspeo da se odupre, pre svega zato \u0161to
  postoje u \u017eivotu jedinstvene prilike u kojima nekim stvarima i doga\u0111ajima
  otpor postaje besmislen. U svim drugim slu\u010dajevima, zna pouzdano, sa\u010duvao
  bi oprez.\\n\\nDobrodr\u017ee\u0107ih.\\n\\nVrlo brzo je taj bri\u017eni i dobri
  duh zgradurine, prakti\u010dni i uvek korisni virtuoz i upravlja\u010d zborom savesnih
  stanara, potvrdio svoju posve\u0107enost op\u0161toj\\n\\nI tako je to i bilo, ba\u0161
  jedna takva dobrodr\u017ee\u0107a, ljubazna, kulturna dobro\u010diniteljka iz kom\u0161iluka
  u\u0161la je u njegov \u017eivot, ta\u010dno pre godinu dana, a da nije sti\u00ad
  gao da se zapita kako je uspeo da je ne primeti ranije. Zar samo zato \u0161to je
  ona takva, draga i mila, dozlabo\u00ad ga ljubazna, nahrupiv\u0161i poput tornada,
  jedina uspela da na brzinu poru\u0161i sve sigurnosne mere opreza u nje\u00ad govom
  pre\u0111a\u0161njem, postojanom \u017eivotu? Naravno, pa to je bar jasno kao dan
  beli, nikako nije trebalo gubiti dragoceno vreme, odga\u0111ati stvari unedogled
  i tako samo krnjiti preostale dane koje on i dobrodr\u017ee\u0107a i ljubazna dobro\u010diniteljka
  treba da provedu sjedinjeni u neraskidivu zajednicu.\\n\\ndobrobiti, prvo kao nezamenjivi
  svedok na njihovom neponovljivom ven\u010danju, a potom kao nenadma\u0161ni za\u010din
  vesele atmosfere, uporno ple\u0161u\u0107i ponaosob sa svim \u010dlanovima tog prpo\u0161nog
  i mnogobrojnog ku\u0107\u00ad nog saveta.\\n\\nSada si u pravim rukama, sada zauvek
  ima\u0161 nekog da o tebi brine, ponavljao je, poput rastrojenog papa\u00ad gaja,
  posle svakog popijenog piva i uspe\u0161no zavr\u0161enog plesa.\\n\\nValjda tako
  be\u0161e i valjda sve to tako izgleda\u0161e.\\n\\nElem, uprkos svemu, uprkos svim
  o\u010dekivanjima, penzionisani prehrambeni tehni\u010dar Aleksandar Pavlovi\u0107
  plesao je samo jedno leto.\\n\\nPrvog dana te prevrtljive jeseni, po zakonima ovozemaljske
  pravde i po meri usuda, zavr\u0161io je u Ge\u00ad rontolo\u0161kom centru, u bla\u017eenoj
  oazi, na obali Duna\u00ad va. Jednostavno, iscrpljene su sve mogu\u0107nosti da
  se ona, uprkos svojim naporima i \u017eeljama, dalje o njemu kvalitetno brine i
  stara.\\n\\nBar tako tvrdi dobrodr\u017ee\u0107a dobro\u010diniteljka, \u010dije
  ime bi da \u0161to pre zaboravi. Sa svim \u010dinjenicama se u potpunosti sla\u017ee
  i veseli svedok, onaj du\u0161ebri\u017eni ho\u00ad rovo\u0111a zbora stanara. I
  dodaje kako pouzdano zna da je svaki \u010dovek dru\u0161tveno bi\u0107e, u to nema
  sumnje, ali samo dok ne ostari.\\n\\nNapre\u010dac se tako zavr\u0161i igra poverenja
  i iznevera\u00ad vanja, nestado\u0161e blagonakloni prijatelji, dobro\u0107udne
  kom\u0161ije, nestado\u0161e saveti i uputstva, pojavi\u0161e se nova pravila, a
  dani se pretvori\u0161e u propitivanje nemogu\u0107\u00ad nosti spoznavanja kona\u010dne
  istine.\\n\\n\u010cesto odmahuje rukom kao da pozdravlja nekog samo njemu vidljivog
  ili kao da ho\u0107e da ka\u017ee kako sve treba pustiti da odnese mutna dunavska
  voda.\\n\\nUostalom, sada mo\u017ee da, ni od koga neuznemi\u00ad ravan, gaji cve\u0107e,
  razgovara sa zidovima i \u0161alje samo njemu razumljive poruke Dunavom.\"", "\"Preveo
  s engleskog Branko Vu\u010di\u0107evi\u0107\\n\\nNaslov originala\\n\\nKurt Vonnegut.
  Jr. Slaughterhouse-Five, or The Children''s Crusade\\n\\nCopyright \u00a9 Copyright
  \u00a9 1969 by Kurt Vonnegut, Jr. / Copyright renewed 1997 by Kurt Vonnegut, Jr.
  All rights reserved. Translation copyright \u00a9 2022 za srpsko izdanje, LAGUNA\\n\\nZa
  Meri O''Her i Gerharda Milera\\n\\nSadr\u017eaj\\n\\nKravica mu\u010de, Probudi
  se lu\u010de, Ali Isus, boga mali, Nikad da se pla\u010dem javi.\\n\\nJedan\\n\\nSve
  se ovo odista dogodilo. Manje-vi\u0161e. U svakom slu\u010daju, delovi o ratu prili\u010dno
  su istiniti. Jedan momak koga sam poznavao stvarno je streljan u Drezdenu zato \u0161to
  je uzeo \u010dajnik koji mu nije pripadao. Drugi momak koga sam poznavao stvarno
  je pretio da \u0107e posle rata unajmiti revolvera\u0161e da poubijaju njegove li\u010dne
  neprijatelje. I tako dalje. Izmenio sam sva imena.\\n\\nVratio sam se onamo sa jednim
  starim ratnim drugom, Bernardom V. O''Herom, pa smo se sprijateljili sa \u0161oferom
  taksija koji nas je odvezao do klanice gde su nas, kao ratne zarobljenike, zaklju\u010davali
  preko no\u0107i. \u0160ofer se zvao Gerhard Miler. Rekao nam je da je neko vreme
  bio ameri\u010dki zarobljenik. Mi smo ga pitali kakav je \u017eivot u\\n\\nJa sam
  se stvarno vratio u Drezden 1967, zahvaljuju\u0107i parama Gugenhajmove zadu\u017ebine
  (bog je po\u017eiveo). Mnogo je li\u010dio na Dejton, Ohajo, samo sa vi\u0161e praznih
  placeva. Mora biti da tlo sadr\u017ei tone i tone bra\u0161na od ljudskih kostiju.\\n\\nkomunisti\u010dkom
  re\u017eimu, a on re\u010de da je isprva bilo grozno, jer su svi morali tako naporno
  da rade, a nije bilo krova nad glavom ni hrane ni ode\u0107e. Ali sada je mnogo
  bolje. Ima prijatan stan\u010di\u0107, a njegova k\u0107i dobija izvrsno obrazovanje.
  Njegova majka je spaljena u drezdenskoj ognjenoj oluji. Tako mu je to.\\n\\n\u201eVama
  i va\u0161oj porodici, kao i onom va\u0161em prijatelju, \u017eelim sre\u0107an
  Bo\u017ei\u0107 i Novu godinu i nadam se da \u0107emo se ponovo sresti u svetu mira
  i slobode, u taksiju, ako slu\u010daj bude hteo.\\\"\\n\\nZa Bo\u017ei\u0107 je
  poslao O''Heru dopisnicu i evo \u0161ta je na njoj pisalo:\\n\\nTo mi se veoma dopada:
  \u201eAko slu\u010daj bude hteo\\\".\\n\\nAli iz mog duha tada nije iza\u0161lo
  mnogo re\u010di o Drezdenu \u2013 ili bar ne dovoljno da se od njih napravi knjiga.
  Pa ne dolaze mnoge re\u010di ni sad, kad sam postao stari kenjac sa uspomenama,
  sa pal-mal cigaretama, sa odraslim sinovima.\\n\\nBilo bi mi odvratno da vam pri\u010dam
  koliko me je ova drljava knji\u017eica stajala novca i anksioznosti i vremena. Kad
  sam se, pre dvadeset tri godine, vratio ku\u0107i iz Drugog svetskog rata, mislio
  sam da \u0107e mi biti lako da pi\u0161em o uni\u0161tenju Drezdena, jer \u0107u
  imati samo da saop\u0161tim ono \u0161to sam video. A mislio sam, tako\u0111e, da
  \u0107e to biti remek-delo, ili da \u0107u bar zaraditi grdne pare, po\u0161to je
  tema tako velika.\\n\\nRazmi\u0161ljam koliko je drezdenski deo mojih se\u0107anja
  bio neupotrebljiv, a koliko je Drezden mamio da se o njemu pi\u0161e, pa me to podse\u0107a
  na onaj slavni limerik:\\n\\nBio jednom mladi\u0107 iz Stambola, Koji se ovako obra\u0107ao
  svome udu: \u201eUzeo si mi sve bogatstvo I upropastio zdravlje, A sad ne\u0107e\u0161
  ni da pi\u0161ki\u0161, ti, matora ludo.\\\"\\n\\nA prise\u0107am se i pesme koja
  ovako ide:\\n\\nZovem se Jon Jonson, Radim u Viskonsinu, Radim tamo u pilani. Ljudi
  koje sre\u0107em ulicom Pitaju: \u201eKako se zoves?\\\" A ja velim: \u201eZovem
  se Jon Jonson, Radim u Viskonsinu\u2026\\\"\\n\\nI tako dalje u beskona\u010dnost.\\n\\nstvar
  knjiga o Drezdenu.\\n\\nTokom godina ljudi koje sam susretao \u010desto su pitali
  na \u010demu radim, a ja sam obi\u010dno odgovarao da je glavna\\n\\nJednom sam
  to rekao H\u0430risonu Staru, filmskom reditelju, a on podi\u017ee obrve i upita:
  \u201eDa li je to antiratna knjiga?\\\" \u201eJeste\\\", rekoh. \u201eValjda.\\\"\\n\\n\u201eNe.
  \u0160ta im to ka\u017eete, H\u0430risone Staru?\\\"\\n\\n\u201eZnate li \u0161ta
  ja ka\u017eem ljudima kad \u010dujem da pi\u0161u antiratne knjige?\\\"\\n\\n\u201eKa\u017eem:
  ''Za\u0161to umesto toga ne napi\u0161ete antiledni\u010dku knjigu?''\\\"\\n\\nOn
  je, naravno, time mislio da \u0107e uvek biti ratova, da ih je isto toliko lako
  zaustaviti kao lednike. I ja tako mislim.\\n\\nA \u010dak i kad ratovi ne bi neprestano
  dolazili, poput lednika, i dalje bi ostala obi\u010dna stara smrt.\\n\\nKad sam
  bio ne\u0161to mla\u0111i, dok sam radio na svojoj slavnoj knjizi o Drezdenu, upitao
  sam jednog starog ratnog druga, koji se zvao Bernard V. O''Her, da li mogu da ga
  posetim. On je bio okru\u017eni tu\u017eilac u Pensilvaniji. Ja sam bio pisac na
  Kejp Kodu. U ratu smo bili redovi, pe\u0161adijski izvi\u0111a\u010di. Nikad nismo
  o\u010dekivali da \u0107emo posle rata zaraditi pare, ali nam je obojici sasvim
  lepo i\u0161lo.\\n\\nNa taj na\u010din sam dobio vezu sa O''Herom. On je mali, a
  ja sam visok. U ratu smo bili Pat i Pata\u0161on. U ratu smo zajedno pali u zarobljeni\u0161tvo.
  Na telefonu sam mu rekao ko sam. Uop\u0161te mu nije bilo te\u0161ko da poveruje.
  Bio je budan. \u010citao je. Svi ostali u njegovoj ku\u0107i su spavali.\\n\\nPoverio
  sam Belovoj telefonskoj kompaniji da ga prona\u0111e. Oni su po tom pitanju divni.
  Ponekad me u kasne no\u0107ne sate spopadne jedna bolest, u vezi sa alkoholom i
  telefonom. Napijem se, a \u017eenu oteram od sebe dahom koji smrdi na iperit i ru\u017ee.
  A onda, govore\u0107i ozbiljno i elegantno u telefon, tra\u017eim od telefonistkinja
  da me pove\u017eu sa ovim ili onim prijateljem za koga godinama nisam \u010duo.\\n\\n\u201e\u010cuj\\\",
  rekoh, \u201eja pi\u0161em tu knjigu o Drezdenu. Treba mi pomo\u0107 da se setim
  raznih stvari. Pitam se da li bih mogao da do\u0111em da te vidim, pa da pijemo
  i pri\u010damo i da se prise\u0107amo.\\\"\\n\\nNije bio odu\u0161evljen. Kazao
  je da ne mo\u017ee bogzna \u010dega da se seti. Ali, ipak, re\u010de da do\u0111em.\\n\\n\u201eMislim
  da \u0107e vrhunac knjige biti pogubljenje jadnog starog Edgara Derbija\\\", rekoh.
  \u201eTa ironija je tako ogromna. Ceo jedan grad biva spaljen, a hiljade i hiljade
  ljudi pobijene. I onda tog ameri\u010dkog pe\u0161adinca hapse u ru\u0161evinama
  zato \u0161to je uzeo \u010dajnik. Pa mu sude na propisan na\u010din i onda ga strelja
  vod za streljanje.\\\"\\n\\n\u201eZar ne misli\u0161 da je to pravo mesto gde treba
  da do\u0111e vrhunac?\\\"\\n\\n\u201eAha\\\", re\u010de O''Her.\\n\\n\u201eJa se
  u to ne razumem\\\", re\u010de on. \u201eTo je tvoj zanat, a ne moj.\\\"\\n\\nKao
  maloprodavac vrhunaca i uzbu\u0111enja i ocrtavanja likova i divnog dijaloga i napetosti
  i sukoba, ja sam mnogo puta skicirao drezdensku pri\u010du. Najbolji nacrt koji
  sam ikad napravio, ili bar najlep\u0161i, be\u0161e na pole\u0111ini rolne tapeta.\\n\\nKraj,
  gde su se prekidale sve linije, beja\u0161e repi\u0161te na obali Elbe, nadomak
  Halea. Padala je ki\u0161a. Rat u Evropi je ve\u0107 nekoliko nedelja bio zavr\u0161en.
  Stajali smo u redovima, pod stra\u017eom ruskih vojnika \u2013 Englezi, Amerikanci,
  Holan\u0111ani, Belgijanci, Francuzi, Kana\u0111ani, Ju\u017enoafrikanci,\\n\\nUpotrebio
  sam bojice svoje k\u0107eri, za svaku glavnu li\u010dnost drugu boju. Na jednom
  kraju tapeta bio je po\u010detak pri\u010de, a drugi kraj je bio zavr\u0161etak,
  a tu je zatim bio srednji deo koji je \u010dinio sredinu. A plava linija se spajala
  sa crvenom, pa sa \u017eutom, a \u017euta linija se onda prekidala, jer je li\u010dnost
  predstavljena \u017eutom linijom umrla. I tako dalje. Uni\u0161tenje Drezdena prikazano
  je vertikalnim pojasom narand\u017eastih krsti\u0107a, a sve linije koje su jo\u0161
  bile u \u017eivotu prolazile su kroz nju i izlazile na drugu stranu.\\n\\nNovozelan\u0111ani,
  Australijanci, hiljade nas koji \u0107emo prestati da budemo ratni zarobljenici.\\n\\nJedan
  idiotski Englez, koji je negde izgubio sve zube, \u010duvao je svoj suvenir u platnenoj
  torbi. Torba je po\u010divala na mojim risovima. Ovda-onda bi zavirio u torbu i
  kolutao o\u010dima i krivio svoj usukani vrat, poku\u0161avaju\u0107i da ulovi da
  li ljudi \u017eudno gledaju njegovu torbu. Pa bi drmao torbom po mojim risovima.
  Mislio sam da je to drmanje slu\u010dajno. Ali nisam bio u pravu. On je nekome morao
  da poka\u017ee \u0161ta je u torbi, a be\u0161e dokonao da se u mene mo\u017ee pouzdati.
  Uhvatio je moj pogled, namignuo, otvorio torbu. Unutra se nalazio gipsani model
  Ajfelove kule. Obojen u zlatno. U model je bio ugra\u0111en sat.\\n\\nA na drugoj
  strani poljane bile su hiljade Rusa i Poljaka i Jugoslovena i tako dalje, pod stra\u017eom
  ameri\u010dkih vojnika. Tamo, na ki\u0161i, obavljena je razmena \u2013 jedan prema
  jedan. O''Her i ja smo se, s mnogo drugih, uspentrali u ameri\u010dki kamion. O''Her
  nije imao nikakve suvenire. Skoro svi ostali jesu. Ja sam imao sve\u010danu sablju
  Luftvafe, jo\u0161 je imam. Onaj ostrvljeni mali Amerikanac, koga u ovoj knjizi
  zovem Pol Lazaro, imao je otprilike kilo dijamanata i smaragda i rubina i tako dalje.
  Skinuo ih je sa mrtvih u podrumima Drezdena. Tako mu je to.\\n\\n\u201eStraobalna
  stvar\\\", re\u010de.\\n\\nI dobili smo bebe.\\n\\nPrebacili su nas avionom u logor
  za oporavak u Francuskoj, gde su nas kljukali \u010dokoladnim mlekom i drugom bogatom
  hranom dok svi nismo bili pokriveni salom kao u bebe. Onda su nas poslali ku\u0107i
  i ja sam se o\u017eenio zgodnom devojkom koja je, tako\u0111e, bila pokrivena salom
  kao u bebe.\\n\\nA one su sad odrasle, a ja sam stari kenjac sa uspomenama i pal-mal
  cigaretama. Zovem se Jon Jonson, radim u Viskonsinu, radim tamo u pilani.\\n\\n\u201e\u017dao
  mi je, gospodine. Takav pretplatnik ne postoji u imeniku.\\\"\\n\\nPonekad, kasno
  no\u0107u, po\u0161to moja \u017eena ode u postelju, poku\u0161avam da pozovem telefonom
  stare prijateljice. \u201eCentrala, da li biste mogli da mi date broj gospo\u0111e
  Te i Te. Mislim da \u017eivi Tu i Tu.\\\"\\n\\n\u201eHvala, centralo. Veliko hvala.\\\"\\n\\n\u201eTi
  si na mestu, Beljo\\\", velim psu. \u201eJe l'' zna\u0161, Beljo? Ti si na mestu.\\\"\\n\\nOnda
  pustim psa napolje, ili unutra, pa malo pri\u010damo. Dajem mu na znanje da ga volim
  i on meni daje na znanje da me voli. Njemu ne smeta smrad na iperit i ru\u017ee.\\n\\nPonekad
  uklju\u010dim radio i slu\u0161am neku govornu emisiju iz Bostona ili Njujorka.
  Kad puno popijem, ne podnosim muziku sa plo\u010da.\\n\\nPonekad razmi\u0161ljam
  o svome \u0161kolovanju. Nakon Drugog svetskog rata izvesno vreme sam poha\u0111ao
  Univerzitet u \u010cikagu. Studirao sam na Odseku za antropologiju. U ono vreme
  su predavali da me\u0111u ljudima ne postoji ama ba\u0161 nikakva razlika. Mo\u017eda
  to jo\u0161 predaju.\\n\\nPre ili kasnije odlazim u postelju, a \u017eena me pita
  koliko je sati. Ona uvek mora da zna koliko je sati. Katkad ne znam i ka\u017eem:
  \u201ePojma nemam.\\\"\\n\\nDruga stvar kojoj su nas u\u010dili bila je da niko
  nije sme\u0161an ili r\u0111av ili odvratan. Nekoliko dana pre no \u0161to \u0107e
  umreti, re\u010de mi otac: \u201eZna\u0161, nikad nisi napisao pri\u010du u kojoj
  postoji zlodej.\\\"\\n\\nRekao sam mu da je to jedna od stvari koje sam posle rata
  nau\u010dio na koled\u017eu.\\n\\nDok sam studirao za antropologa, ujedno sam radio
  kao policijski reporter slavnog \u010cika\u0161kog biroa za gradske vesti, sa platom
  od dvadeset osam dolara nedeljno. Jednom su me prebacili iz no\u0107ne smene u dnevnu,
  tako da sam radio \u0161esnaest sati bez prekida. Izdr\u017eavali su nas svi listovi
  u gradu i agencije i celo to dru\u0161tvo. A mi smo pokrivali sudove i policijske
  stanice i vatrogasce i obalsku stra\u017eu, \u010dak tamo na jezeru Mi\u010digen,
  i sve to. Sa ustanovama koje su nas izdr\u017eavale bili smo povezani pneumatskim
  cevima \u0161to su i\u0161le ispod ulica \u010cikaga.\\n\\nI svoj prvi izve\u0161taj
  morao sam da diktiram telefonom jednoj od tih poganih devojaka. Ticao se mladog
  veterana koji se zaposlio kao liftboj starinskog lifta u jednoj poslovnoj zgradi.
  Na prvom spratu vrata lifta su bila od ukrasnog izuvijanog \u017eeleza. \u017delezni
  br\u0161ljan je zmijuljio u otvore i iz njih. Tu je bila gvozdena gran\u010dica
  sa dve na\u010dvorene gugutke.\\n\\nReporteri su telefonom javljali izve\u0161taje
  piscima koji su sedeli sa slu\u0161alicama na u\u0161ima, a pisci bi kucali izve\u0161taje
  na matrice. Izve\u0161taji su umno\u017eavani i trpani u \u010daure od mesinga i
  somota koje su pneumatske cevi potom pro\u017edirale. Najokoreliji reporteri i pisci
  bile su \u017eene \u0161to su preuzele poslove mu\u0161karaca koji su oti\u0161li
  u rat.\\n\\nTaj veteran je odlu\u010dio da odveze lift u podrum, pa je zatvorio
  vrata i krenuo nani\u017ee, ali mu se burma zaka\u010dila za sve one ukrase. Tako
  je podignut u vazduh, pod lifta se spustio, izmakao mu ispod nogu, a vrh kabine
  ga je zgnje\u010dio. Tako mu je to.\\n\\n\u201eJo\u0161 ne znam\\\", rekoh. \u201eTek
  se dogodilo.\\\"\\n\\nI tako sam ovo javio, a \u017eena koja je trebalo da otkuca
  matricu upita: \u201e\u0160ta je kazala njegova supruga?\\\"\\n\\n\u201ePozovi je
  i izvuci joj izjavu.\\\"\\n\\n\u201ePredstavi se kao kapetan Fin iz policije. Ka\u017ei
  da ima\u0161 tu\u017enu vest. Saop\u0161ti joj novost i vidi \u0161ta \u0107e re\u0107i.\\\"\\n\\n\u201e\u0160ta?\\\"\\n\\nTako
  sam u\u010dinio. Kazala je ono \u0161to biste o\u010dekivali da ka\u017ee. Bilo
  je tu i odoj\u010de. I tako dalje.\\n\\nRekoh joj.\\n\\nKad sam se vratio u kancelariju,
  ona \u017eena-pisac me upita, za svoju li\u010dnu informaciju, kako je zgnje\u010deni
  momak izgledao kad je zgnje\u010den.\\n\\n\u201eDa li ti je to smetalo?\\\", re\u010de
  ona. Jela je filovanu \u010dokoladu \u201etri musketara\\\".\\n\\n\u201e\u0160to
  bi mi, kog \u0111avola, smetalo, Nensi?\\\", rekoh. \u201eU ratu sam video mnogo
  gore stvari.\\\"\\n\\n\u010cak i tada sam kao pisao knjigu o Drezdenu. U ono vreme
  to u Americi nije bio slavan vazdu\u0161ni napad. Nije bilo mnogo Amerikanaca koji
  su znali koliko je bio gori, recimo, od Hiro\u0161ime. Ni ja to nisam znao. Nije
  bilo velikog publiciteta.\\n\\nDesilo mi se da na jednom koktelu ispri\u010dam o
  napadu, kako sam ga ja video, o knjizi koju \u0107u napisati, jednom profesoru \u010cika\u0161kog
  univerziteta. Bio je \u010dlan ne\u010deg \u0161to se zvalo Komitet za dru\u0161tvenu
  misao. A on je meni pri\u010dao o koncentracionim logorima i o tome kako su Nemci
  pravili sapun i sve\u0107e od sala mrtvih Jevreja i tako dalje.\\n\\nSve \u0161to
  sam mogao da ka\u017eem bilo je: \u201eZnam, znam. Znam.\\\"\\n\\nDrugi svetski
  rat je, nepobitno, sve na\u010dinio veoma okorelim. A ja sam po\u010deo da radim
  u sektoru za odnose s javno\u0161\u0107u kompanije D\u017eeneral elektrik u \u0160enektadiju,
  dr\u017eava Njujork, i dobrovoljni vatrogasac u selu Elplos, gde sam kupio svoju
  prvu ku\u0107u. \u0160ef mi je bio jedan od najokorelijih momaka koje \u0107u ikad
  upoznati. Za vreme rata je bio potpukovnik u boltimorskom sektoru za odnose s javno\u0161\u0107u.
  Dok sam bio u \u0160enektadiju, stupio je u Holandsku reformisti\u010dku crkvu,
  koja je vaistinu veoma okorela crkva.\\n\\nMoja \u017eena i ja izgubili smo svoje
  salo kao u bebe. Bile su to na\u0161e mr\u0161ave godine. Prijatelji su nam bili
  silesija mr\u0161avih veterana i njihovih mr\u0161avih supruga. Najfiniji veterani
  u \u0160enektadiju, smatrao sam, najljubazniji i najzabavniji, koji su najvi\u0161e
  mrzeli rat, behu oni koji su se odista borili.\\n\\nPonekad bi me podsme\u0161ljivo
  upitao za\u0161to nisam bio oficir, kao da sam ne\u0161to lo\u0161e u\u010dinio.\\n\\nTada
  sam otpisao Vazduhoplovstvu, mole\u0107i za pojedinosti o napadu na Drezden, o tome
  ko je izdao nare\u0111enje za napad, koliko je aviona obavilo napad, za\u0161to
  su to u\u010dinili, kakvi su po\u017eeljni rezultati postignuti i tako dalje. Odgovorio
  mi je \u010dovek, koji je, poput mene, radio u sektoru za odnose s javno\u0161\u0107u.
  Kazao je da mu je \u017eao, ali da su ti podaci jo\u0161 uvek strogo poverljivi.\"",
  "\"Na osnovu \u010dlana 7. stav 2. Zakona o bezbednosti i zdravlju na radu (,,Slu\u017ebeni
  glasnik RS\\\", br. 101/05 i 91/15),\\n\\nMinistar za rad, zapo\u0161ljavanje, bora\u010dka
  i socijalna pitanja donosi\\n\\nPRAVILNIK\\n\\no izmenama i dopunama Pravilnika
  o obezbe\u0111ivanju oznaka za bezbednost i zdravlje na radu\\n\\n(Slu\u017ebeni
  glasnik RS, broj 108/2017)\\n\\n\u010clan 1.\\n\\nU Pravilniku o obezbe\u0111ivanju
  oznaka za bezbednost i zdravlje na radu (\u201eSlu\u017ebeni glasnik RS\u201d, broj
  95/10), naziv Pravilnika menja se i glasi:\\n\\n\u201ePravilnik o obezbe\u0111ivanju
  oznaka za bezbednost i/ili zdravlje na radu\\\".\\n\\n\u010clan 2.\\n\\nU \u010dlanu
  2. ta\u010dka 1) re\u010di: \u201ematerija, preparata\\\" zamenjuju se re\u010dima:
  \u201esupstanci i sme\u0161a\\\".\\n\\n\u010clan 3.\\n\\n\u010clan 6. menja se i
  glasi:\\n\\n\u201e\u010clan 6.\\n\\nPoslodavac je du\u017ean da zaposlenima i/ili
  njihovim predstavnicima za bezbednost i zdravlje na radu obezbedi sve informacije
  koje se odnose na bezbednost i/ili zdravlje na radu, a naro\u010dito o merama koje
  se preduzimaju u vezi sa obezbe\u0111ivanjem oznaka za bezbednost i/ili zdravlje
  na radu.\u201d\\n\\n\u010clan 4.\\n\\nU \u010dlanu 7. re\u010d: \u201epismenoj\\\"
  zamenjuje se re\u010dju: \u201episanoj\\\".\\n\\n\u010clan 5.\\n\\nU \u010dlanu
  8. re\u010di: \u201epredstavnici za bezbednost i/ili zdravlje na radu na radu\u201d
  zamenjuju se re\u010dima: \u201epredstavnici za bezbednost i zdravlje na radu\u201d.\\n\\n\u010clan
  6.\\n\\nU Prilogu 1. \u2013 Op\u0161ti zahtevi za oznake za bezbednost i/ili zdravlje
  na radu, u ta\u010d. 2.2, 3.1, 4, 5, 6, 7, 8. i 11. posle re\u010di: \u201ebezbednost
  i/ili zdravlje na radu\u201d re\u010di: \u201ena radu\u201d bri\u0161u se.\\n\\nU
  ta\u010dki 3.2. re\u010di: \u201ebezbedan i zdrav rad\\\" zamenjuju se re\u010dima:
  \u201ebezbednost i/ili zdravlje na radu\\\".\\n\\nU ta\u010dki 9. re\u010d: \u201esvo\\\"
  zamenjuje se re\u010dju: \u201esve\\\".\\n\\nTa\u010dka 12. menja se i glasi:\\n\\n\u201ePodru\u010dja,
  prostorije ili zatvoreni prostori koji se koriste za skladi\u0161tenje znatnih koli\u010dina
  opasnih supstanci ili sme\u0161a moraju da budu obele\u017eeni odgovaraju\u0107im
  oznakama za bezbednost i/ili zdravlje na radu u skladu sa\\n\\nPrilogom 2. ta\u010dka
  3.2. ili Prilogom 3. ta\u010dka 1. ovog pravilnika, osim u slu\u010daju kada je
  svaka ambala\u017ea propisno obele\u017eena.\\\"\\n\\nDodaje se stav 2. koji glasi:\\n\\n\u201eAko
  ne postoji odgovaraju\u0107a oznaka upozorenja u Prilogu 2. ta\u010dka 3.2. radi
  upozoravanja na opasne hemijske supstance ili sme\u0161e, mora se koristiti odgovaraju\u0107i
  piktogram opasnosti u skladu sa propisom kojim se ure\u0111uje klasifikacija, pakovanje,
  obele\u017eavanje i ogla\u0161avanje hemikalije i odre\u0111enog proizvoda u skladu
  sa Globalno harmonizovanim sistemom za klasifikaciju i obele\u017eavanje UN.\\\"\\n\\n\u010clan
  7.\\n\\nU Prilogu 2. \u2013 Zahtevi za oznake na tablama, u ta\u010dki 3.2.2. dodaju
  se st. 2. i 3. koji glase:\\n\\n\u201ePiktogram za biolo\u0161ke \u0161tetnosti
  koristi se u smislu Pravilnika o preventivnim merama za bezbedan i zdrav rad pri
  izlaganju biolo\u0161kim \u0161tetnostima.\\n\\nOznaka za op\u0161tu opasnost ne
  koristi se radi upozoravanja na opasne hemijske supstance i sme\u0161e, osim u slu\u010daju
  kada se koristi u skladu sa Prilogom 3. ta\u010dka 5.1. ovog pravilnika za obele\u017eavanje
  skladi\u0161ta opasnih supstanci ili sme\u0161a\\\".\\n\\nOznaka \u201e\u0161tetan
  ili iritiraju\u0107i materijal\\\" bri\u0161e se.\\n\\nTa\u010dka 3.2.3. bri\u0161e
  se.\\n\\nU ta\u010dki 3.2.4. re\u010d: \u201eizlo\u017een\\\" zamenjuje se re\u010dju:
  \u201eizlo\u017eeni\\\".\\n\\nU ta\u010dki 3.2.5. re\u010d: \u201eobavljanje\\\"
  zamenjuje se re\u010dju: \u201eobavljanja\\\".\\n\\n\u010clan 8.\\n\\nU Prilogu
  3. \u2013 Zahtevi za obele\u017eavanje posuda i cevovoda, u ta\u010dki 1.1. posle
  re\u010di: \u201ebezbednost i/ili zdravlje na radu\\\" re\u010di: \u201ena radu\\\"
  bri\u0161u se.\\n\\nTa\u010dka 1.2. alineja tre\u0107a menja se i glasi: \u201eu
  slu\u010daju transporta posuda, zamenjene ili dopunjene oznakama koje se odnose
  na transport opasnih supstanci ili sme\u0161a\\\".\\n\\nU ta\u010dki 3. re\u010d:
  \u201enavede\\\" zamenjuje se re\u010dju: \u201enavedene\\\", a re\u010d: \u201eprloga\\\"
  zamenjuje se re\u010dju \u201epriloga\\\".\\n\\nU ta\u010dki 5. re\u010d: \u201ezna\u010dajnih\\\"
  zamenjuje se re\u010dju: \u201eznatnih\\\", a re\u010d: \u201epojedina\u010dni\\\"
  zamenjuje se re\u010dju:\\n\\n\u201epojedina\u010dna\\\".\\n\\n\u010clan 9.\\n\\nU
  nazivu Priloga 5. \u2013 Zahtevi za oznake za bezbednost i/ili zdravlje na radu
  na radu za obele\u017eavanje prepreka, opasnih zona i saobra\u0107ajnih povr\u0161ina,
  u ta\u010d. 1. i 1.2. posle re\u010di: \u201ebezbednost i/ili zdravlje na radu\\\"
  re\u010di: \u201ena radu\\\" bri\u0161u se.\\n\\n\u010clan 10.\\n\\nOvaj pravilnik
  stupa na snagu osmog dana od dana objavljivanja u ,,Slu\u017ebenom glasniku Republike
  Srbije\\\".\\n\\n```\\nU Beogradu, 22. novembra 2017. godine Ministar, Zoran \u0110or\u0111evi\u0107,
  s.r.\\n```\"", "\"U Srbiji boravio predsednik Rusije\\n\\nVladimir Putin\\n\\nVideo
  prilog\\n\\n1 / 3\\n\\nPredsednik Rusije Vladimir Putin boravio je u jednodnevnoj
  poseti Srbiji. Na beogradskom aerodromu do\u010dekao ga je predsednik Republike
  Srbije Aleksandar Vu\u010di\u0107.\\n\\nZa predsednika Rusije pripremljen je i sve\u010dani
  do\u010dek ispred Palate Srbije, uz 10 po\u010dasnih plotuna kao i intoniranje himne
  dve dr\u017eave i smotru po\u010dasne garde.\\n\\nPotom je usledio sastanak delegacija
  Rusije i Srbije na kojem je potpisano vi\u0161e od 20 sporazuma, \u010dija vrednost
  iznosi 230 miliona evra, a prema Vu\u010di\u0107evim re\u010dima njihova vrednost
  kada budu realizovani iznosi\u0107e 660 miliona evra.\\n\\nOdr\u017ean je i plenarni
  sastanak delegacija Srbije i Rusije. Odmah nakon toga Putin je uru\u010dio orden
  \\\"Aleksandra Nevskog\\\" srpskom predsedniku.\\n\\nVladimir Putin je od srpskog
  predsednika Aleksandra Vu\u010di\u0107a dobio specijalan poklon - tromese\u010dno
  \u0161tene \u0161arplaninca koji se zove Pa\u0161a.\\n\\n2 / 3\\n\\nUsledila je
  jednoipo\u010dasovna \u0161etnja od Palate \\\"Albanije\\\" do Kara\u0111or\u0111evog
  parka, dok su se ispred Hrama Svetog Save polako\u00a0 po\u010deli okupljati ljudi.
  Prema procenama Ministarstva unutra\u0161njih poslova na ulicama u blizini Hrama
  Svetog Save kao i na samom platou nalazilo se izme\u0111u 120. i 125 hiljada gra\u0111ana.\\n\\nPrilikom
  obilaska Hrama Vu\u010di\u0107 i Putin su zajedno utisnuli kockicu mozaika u malter
  na zidu Hrama Svetog Save, a tim gestom zvani\u010dno je po\u010dela druga faza
  radova na ure\u0111enju enterijera ove zavetne crkve srpskog naroda.\\n\\n3 / 3\"",
  "\"Bo\u017eji Arsenal Za\u0161tite\\n\\nPo\u010dnite svoj dan sa ovim molitvama
  i va\u0161 \u017eivot c\u0301e se zauvijek promeniti!\\n\\nPismo: \u010citajte i
  meditirajte na Epeficijima 6: 10-18\\n\\nMolitva: O\u010de, u Isusovom imenu, molitvom
  i vekom, stavio sam \u010ditav va\u0161 arklon kako bih mogla stati protiv vilovih
  \u0111avola. Stavio sam svoju kacigu spasenja. . . neka isti um bic\u0301e u meni
  koji je u Hristu Isusu. Stavio sam tvoju ruku pravi\u010dnosti. . . Pravednost Hrista.
  Stavio sam pokaj istine. . . Isusa je Put, Istina i \u017divot (Jovan 14: 6), Istina,
  Integritet i Svetost Bo\u017eija. Stavio sam svoje Sandale evangelija mira.  Pomozite
  nam da stojimo na \u010dvrsto tlu Isusa. Iznad svega, stavljam na svoj \u0161tit
  vjeroispovest da ugasim svaku vatrenu pikado, strelicu, kljove i rakete koji su
  neprijatelja puce na put. . . i Gospod, stavio sam sebe na va\u0161 dragi ma\u010d
  Duha, Va\u0161a Sveta Re\u010d, koja je \u017eiva i moc\u0301na, o\u010distila od
  svake ma\u010devosti sa dva oka (Jevrejima 4:12) na\u0161a ulaganja i odbrambena
  oru\u017eja.\\n\\nSveto pismo: JOB 1:10: \\\"Zar niste napravili ogradu oko njege,
  o\u010du svoje domac\u0301e, i oko svega onoga \u0161to ima na sva\u010dijim stranama?
  Blagoslovi si radnji svojih ruka i d\u017eengova imanja su vec\u0301a u zemlji\u0161tima\\\"
  (NKJV).\\n\\nMolitva: O\u010de, u Ime Isusu, tra\u017eim od tebe da zadr\u017eite
  istu za\u0161titu od mene, rodice, mogao je uma, srca i emocija, kako je napisano
  u Job 1:10.\\n\\nSveto pismo: PSALM 34: 7: \\\"An\u0111el Jahvin se okru\u017euje
  oko onih koji su se pla\u0161ili i izvla\u010di ih.\\\" PSALM 91: 11,12: \\\"Jer
  On c\u0301e dati svojim an\u0111elima da te nadaju, da te dr\u017ei u svom sopstvenom
  na\u010dinu. Oni c\u0301e te nositi u svom rukama, da ne baci\u0161 nogu kamenu\\\"
  (KJV).\\n\\nMolitva: O\u010de, u Isusovom imenu, tra\u017eim od vas da zadr\u017eite
  tabor va\u0161ih mognih anela oko mene 24 sata dnevno.\\n\\nSveto pismo: Jevrejima
  1:14 \\\"Zar niste slu\u017ebenici duhovi poslani da slu\u017ee za one koji c\u0301e
  naslediti spasenje?\\\" (NKJV).\\n\\nMolitva: O\u010de, u Isusovom imenu, molimo
  vas da po\u0161aljete mno\u0161tvo an\u0111ela koji slu\u017ee (pored onih koji
  imaju svake vernike), da slu\u017ee na\u0161im bolovinom, potrebama, bolovinom i
  slabostima, oja\u010davajuc\u0301i nas u svemkom pogledu.\\n\\nSveto pismo: Zaharija
  2: 5 \\\"Jeremija je\\\", re\u010de Gospod, \\\"c\u0301e biti zid vatre svuda oko
  nje, i bic\u0301e mu glava u sredinama\\\". (NKJV).\\n\\nMolitva: O\u010de, samo
  te slavim i zahvaljujem ti, da je tvoja glava moja stra\u017enja gazda (Isaija 52:12
  i 58: 8). U Isusovom imenu, tra\u017eim od vas da me okru\u017eite svojim supernaturalnim
  zidom vatre, kako bi me izbavio od bilo kakvih napada c\u0301avola.\\n\\nSveto pismo:
  Prva Knjiga Mojcijeva 15: 1 \\\"Nakon ovoga A\u0152ireh Ahvina je do\u0161la do
  Abrama u viziji i rekla:\\\" Ne boj se, Abram. Ja sam tvoj \u0161tit, tvoja izuzetno
  velika nagrada. \\\"(NKJV) (Takodje, Psalm 3: 3).\\n\\nMolitva: O\u010de, u Isusovom
  imenu, vijerom, tvr dim tvom obra\u017eanju da je moj \u0161tit i za\u0161titnik.\\n\\nBo\u017eji
  Arsenal Za\u0161tite\\n\\nPismo: (Um je sotonsko igrali\u0161te Bitka za va\u0161
  um je u stihu 5 od 2 Korinc\u0301anima 10: 3-5: \\\"Jer iako hodamo po mesu, mi
  se ne borimo s mesom. Na\u0161 rat nije fizi\u010dki, vec\u0301 sna\u017ean u Bog
  baca argumente i svaku visoku stvar koja podi\u017ee znanje o Bogu, \u010dinec\u0301i
  svaku misao u uhvate u poslu\u0161nost Hrista. \\\"(NKJV).\\n\\nMolitva: U Jakovom
  Isusovom Jastuku, komandujem svojim mislima da do\u0111em pod poslu\u0161nost i
  uhvate Isusu Hrist, kako je napisano u 2. Korinc\u0301anima 10: 5.\\n\\nSveto pismo:
  MATAJ 16:19 \\\"I dacu vam kljucevine nebe\u0161ko kraljevstvo, i sve koje se vezuju
  na zemlju ce biti vezane na nebu, i na onome sto ste izgubili na zemlji ce se razbiti
  na nebu.\\\" (NKJV) (Vidjeti MATAJ 18:18).\\n\\nMolitva: U Ime Isusa, Ime koje je
  iznad svako ime i svih stvari (Filipians 2: 9,10 i Epeficima 1: 20-23), vezuj svake
  ne\u010dije duh i zadatak koji dolaze protiv mene (moja kuc\u0301a i rodica) od,
  preko ili preko nekoga ili bilo \u010dega, nazvanog ili neimenovanog, poznatog ili
  nepoznatog, sedam generacija unazad. U Ime Isusa, povezujem nad glavom, vlastima,
  vladarima mrainine ovoga svijeta, duhovnim zlocinima i domacinima na visokom mestima,
  i knez mozi vazduha. U Isusovom imenu, ve\u017eajem snajgo, starca, svako kneze
