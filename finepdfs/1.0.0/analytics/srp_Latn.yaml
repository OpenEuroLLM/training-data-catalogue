sample: '["\"Domaci vi\u0161nja kolac\\n\\nte\u017eina:\\n\\nlako\\n\\nza: 0 osoba\\n\\nvreme
  pripreme: 40 min\\n\\nSastojci\\n\\nZa testo:\\n\\n4jajeta\\n1 vanil \u0161ecer\\n200
  gr\u0161ecera\\n2 \u0161oljiceulja\\n250 grmekog bra\u0161na\\n50 grcokolade za
  kuvanje\\nza posipanje:\u0161ecer u prahu i kakao\\n\\nJo\u0161:\\n\\n300-400 grvi\u0161anja\\n\\nPriprema\\n\\nUmutiti
  belanca sa \u0161ecerom i vanil \u0161ecerom u cvrst sneg pa dodati \u017eumanca,
  ulje i bra\u0161no i mutiti dok se ne dobije gusta masa.\\n\\nU pouljen i podmazan
  pleh sipati pola smese pa narendati cokoladu i preliti ostatkom smese.\\n\\nOdozgo
  pore?ati oci\u0161cene vi\u0161nje (ako koristite iz zamrzivaca predhodno ih odmrznite
  i ocedite). Peci na 200220 stepeni 30 minuta. Posuti \u0161ecerom i kakaom pre slu\u017eenja.\\n\\nSavet\\n\\nJednostavan
  i meni veoma drag kola? koji sam prvi put spremila jo\u0161 kao devoj?ica kako bih
  iznenadila uku?ane :)\"", "\"Treba proveriti u tom sve\u017enju hartija \u0161to
  ih \u010duva njegova jo\u0161 uvek lepa i dare\u017eljiva \u017eena ima li tamo
  nekih stranica od stvarne vrednosti \u2014 tako je govorio predsednik op\u0161tine,
  koji je ljubitelj svega estetskog, ili bi, bar, tako mogao da govori.\\n\\nNa radiju
  su po\u010deli da sviraju ruske i engleske pesme jednog jutra, i po tome se moglo
  zaklju\u010diti da treba kretati na put. Kuda? Pa svakako ispred vojske koja je
  dolazila, pucaju\u0107i, pa dakle i opasna, nekud gde je nema ili gde \u0107e se
  njeno dejanje rasplinuti. Na neki od vozova. Digao je \u017eenu, koja je volela
  da spava; i ona je \u010dula pesme sa radija, i zgrazala se i cikala ujedno od rado\u0161i,
  ali je zato ostajala da le\u017ei. Me\u0111utim, on se u poslednje vreme ose\u0107ao
  pred njom nelagodno: ovo ratno prometanje dovelo joj je u blizu nu razne ljudi,
  koji su joj davali savete, kojih se ona pridr\u017eavala. Jedan, bubulji\u010dav
  i po imenu Emil, preporu\u010dio joj je da obrije dlake pod pazuhom, i ona je to
  u\u010dinila. Verovatno je da je to bila jedina ta\u010dka Emilovog ostvarenog uticaja,
  ali kada bi se zamislilo, nije ni bio ba\u0161 tako siguran u to.\\n\\nObukao se,
  dakle, za put i po\u0161ao na ulicu da izvidi mogu\u0107nosti. Po\u0161to putnog
  odela nije imao, uzeo je naprosto svezanj like, koji je visio bez potrebe za jednim
  vratima, i njime omotao, dijagonalno pa u obratnom pravcu opet dijagonalno, nogavice
  od cipela do kolena, tako da je dobio kariranu \u0161aru i ujedno omota\u010d sli\u010dan
  kama\u0161nama. U jednu od tih kama\u0161na stavio je i debe\u0142u plavo ukori\u010denu
  svesku, u koju je \u017eeleo da upi\u0161e svoje uliske i do\u017eivljaje.\\n\\nI\u0161ao
  je ulicom, nad kojom su kru\u017eili avioni. Gledao je uporno uvis, znaju\u0107i
  da se mo\u017ee videti kad avion baci bombu. Odlu\u010dio je, ako to vidi, da sko\u010di
  u prvu kapiju. Me\u0111utim, samo jedan avion, koji je leteo nisko, po\u010deo je
  da baca teret, ali ne bombe, ve\u0107 ljudi koji su padali na krobove i odadle se
  kotrljali skupljaju\u0107i padobrane. On je posmatrao radoznalo kako se od padobranaca
  stvara sve gu\u0161\u0107a grupa mladih ljudi u civilnim odelima. Cim bi dotakli
  zemlju, to jest asfalt ulice, ljudi su se hvatali u kordon koji je prepre\u010davao
  ulicu. Kada je stigao do njih, na\u0161ao se, u dru\u0161tvu s jo\u0161 nekolikinom
  prolaznika, zarobljen. Civili po\u010de\u0161e da ih rasporeduju u dvojne redove.
  Bila je to kao neka prola\u017ena munjevita mobilizacija za rad, verovatno.\\n\\nNjemu
  dostojanstvo i nepripremljenost nisu dozvoljavali da se povini\u0161e tim mla\u0111im
  ludima, ali se to nije imalo kome re\u0107i, jer su oni prosto vr\u0161ili svoj
  posao, rasporeduju\u0107i ljude u redove i po\u017euruju\u0107i ih. Najzad je, barem,
  izvukao iz improvizovane kama\u0161ne svoju svesku, i smotao je u kaput koji je
  dr\u017eao preba\u010den preko ruke. To je bio poslednji moment, jer ve\u0107 u
  slede\u0107em mla\u0111i ljudi su zahtevali da se kaputi odlo\u017ee i da se krene
  napred.\\n\\nSad je nastalo kome\u0161anje. Neki su po\u010deli da se izvla\u010de
  iz redova uz zidove ku\u0107a, pretvaraju\u0107i se da su gledaoci cele ove scene.
  Mladi ljudi su ih gonili nazad u redove, ali su ponekog i izostavljal, poverovav\u0161i
  da onamo ne spada ili prosto, valjda, iz simpatije. I on poku\u0161a u nekoliko
  mahova da se izvu\u010de iz svog reda i da slane na plo\u010dnik, ali se svaki put
  nako na\u0161ao da ga vrate. Me\u0111utim, jedan od mladi\u0107a koji su sa\u010dinjavali
  prvi red povorke, zapevao je jednu rusku pesmu, ali, po\u0161to ga je slu\u0161
  izdao, pa nije mogao da je pogodi, re\u010de: \u201eAla su ru\u017ene ove ruske
  pesme\u201c. Niko se ne pobuni, jedini je on shvatio pozadinu \u010dovekove izjave.
  U tom istom trenutku bio je re\u0161en da ipak po svaku cenu izostane iz reda. Ako
  ga upitaju, on \u0107e jednostavno re\u0107i da ne mo\u017ee da se primi nikakvog
  fizi\u010dkog posla i pri tome \u0107e ostati. To valjda nije ka\u017enivo.\\n\\nMe\u0111utim
  se odjednom selio da je u kaputu, smotanu, oslavio i svoju plavo ukori\u010denu
  svesku. Oselio je potrebu da sme\u0161ta proveri je li o\u010duvana, pa je, umesto
  da prosto izade iz svog reda i slane uza zid, odakle su posmatrali mnogi ravnodu\u0161ni
  ljudi, \u2014 okrenuo leda redovima i po\u0161ao niz ulicu u pravcu suprotnom od
  njih, ka gomili odela. Ve\u0107 je iz kapije, gde su odela bila poslagana, isko\u010dio
  jedan mlad \u010dovek sa brkovima plavim kao lan i uzmenireno ga pitao \u0161ta
  tu tra\u017ei. Ali utoj je i iz redova jedan mlad \u010dovek po\u010deo da vi\u0161e
  za njim neka se vra\u0107i, i po\u0161to se on nije vra\u0107ao, ve\u0107 pognut
  tra\u017eio smotuljak kaputa, mladi \u010dovek koji je vikao digao je pu\u0161ku
  i opalio u njega. Na mestu ga je ubio.\"", "\"Predmet: Mark Ka\u0161njeti/Mark Kashnjeti
  \u2013 Prizren\\n\\nApelacioni sud u Beogradu \u2013 Odeljenje za ratne zlo\u010dine\\n\\nBroj
  predmeta: K\u017ePo2 br. 7/13\\n\\nGlavni pretres pred drugostepenim ve\u0107em
  06.03.2015.\\n\\nIzve\u0161taj: Marina Kljai\u0107, posmatra\u010d FHP-a\\n\\nOptu\u017eeni
  Mark Ka\u0161njeti/Mark Kashnjeti\\n\\nOptu\u017eeni je u celosti ostao pri ranije
  iznetim odbranama datim tokom prvostepenog postupka, isti\u010du\u0107i da nikada
  nije bio pripadnik OVK, da nije imao oru\u017eje, da \u010dak nije ni slu\u017eio
  vojsku, da nikoga nije hapsio i da on nije osoba na fotografiji koja je objavljena
  u dnevnom \u010dasopisu Kurir.\\n\\ndr Mirjana \u0110uri\u0107, sudski ve\u0161tak\u2013antropolog\\n\\nSudski
  ve\u0161tak dr Marija \u0110uri\u0107 je u svemu ostala pri nalazu i iskazu datom
  tokom prvostepenog postupka. Istakla je da je tokom ve\u0161ta\u010denja utvr\u0111eno
  da postoji veliki stepen verovatno\u0107e da je lice sa fotografije objavljene u
  dnevnom \u010dasopisu Kurir optu\u017eeni. Do ovakvog zaklju\u010dka do\u0161lo
  se upore\u0111ivanjem ve\u0107eg broja karakteristika lica optu\u017eenog i lica
  sa fotografije. U odnosu na mogu\u0107i raspon godina lica sa fotografije - od 25
  do 50 - obja\u0161njava da ni jedna morfolo\u0161ka karakteristika koja je prilikom
  ve\u0161ta\u010denja posmatrana, nije isklju\u010dila mogu\u0107nost da je osoba
  na fotografiji stara i do 50 godina. Prilikom ve\u0161ta\u010denja primenjene su
  metode posmatranja i upore\u0111ivanja, a nisu vr\u0161ena nikakva merenja, jer
  to u konkretnom slu\u010daju nije bilo ni mogu\u0107e. Na ovaj navod ve\u0161taka
  branilac je prigovorio da je u konkretnom slu\u010daju, prilikom ve\u0161ta\u010denja,
  fotografisanje optu\u017eenog trebao da izvr\u0161i prefesionalni fotograf, a ne
  ve\u0161tak, da je optu\u017eeni trebao biti fotografisan u istom polo\u017eaju
  glave kao i osoba na fotografiji, odnosno iz profila, pa tek onda da se vr\u0161i
  upore\u0111ivanje. Ovo posebno iz razloga \u0161to se osobi na fotografiji vidi
  samo profil, na kojem je jasno vidljivo uho, koje je za svakog \u010doveka jedinstvenih
  karakteristika kao i otisak prsta, pa bi upore\u0111ivanje u\u0161ne \u0161koljke
  dalo jasnije rezultate. Odgovaraju\u0107i na primedbu branioca, ve\u0161tak je naveo
  da je vr\u0161eno upore\u0111ivanje u\u0161ne \u0161koljke, i da tom prilikom nisu
  utvr\u0111ene nikakve karakteristike na osnovu kojih bi se moglo isklju\u010diti
  da je osoba na fotografiji optu\u017eeni.\\n\\nU nastavku dokaznog postupka, zamenik
  TRZ odustao je od ranijeg predloga da se postoje\u0107a pismena dokumentacija koja
  se odnosi na postojanje oru\u017eanog sukoba dostavi sudskom ve\u0161taku, kako
  bi se ve\u0161ta\u010denjem utvrdilo da li je u kriti\u010dnom periodu postojao
  oru\u017eani sukob, te da se od VBA zatra\u017ee podaci da li su o\u0161te\u0107eni
  u istom periodu bili mobilisani. Predlo\u017eio je sudskom ve\u0107u da u nejavnom
  delu sednice pro\u010dita transkript sa prvostepenog su\u0111enja od 17. maja 2013.
  godine, i to strane od 23 zaklju\u010dno sa 25. Ovim je dokazni postupak zavr\u0161en.\\n\\nZavr\u0161na
  re\u010d tu\u017eioca\\n\\nU zavr\u0161noj re\u010di, tu\u017eilac je u svemu ostao
  pri preciziranoj optu\u017enici, zavr\u0161nim re\u010dima datim tokom prvostepenog
  postupka i \u017ealbenim navodima. Predlo\u017eio je sudu da optu\u017eenog oglasi
  krivim i da mu izrekne kaznu \u010dija \u0107e visina biti adekvatna te\u017eini
  izvr\u0161enog dela.\\n\\nZavr\u0161na re\u010d branioca\\n\\nU zavr\u0161noj re\u010di,
  branilac optu\u017eenog ostao je pri navodima iz zavr\u0161ne re\u010di date tokom
  prvostepenog postupka i svim \u017ealbenim navodima. Posebno je istakao da je u
  konkretnom slu\u010daju pogre\u0161na pravna kvalifikacija krivi\u010dnog dela za
  koje se optu\u017eeni tereti, odnosno da u vreme izvr\u0161enja nije postojao oru\u017eani
  sukob, te da o\u0161te\u0107eni nisu imali status civila ve\u0107 boraca, obzirom
  da su kod sebe imali oru\u017eje. Posebno iz razloga \u0161to u spisima predmeta
  postoji dokument \u2013 izve\u0161taj vojne komande \u2013 iz kojeg je vidljivo
  da je kriti\u010dnog dana u Prizrenu bio samo jedan incident u kojem su zarobljena
  dva vojnika, pa je o\u010dito da se radi upravo o o\u0161te\u0107enima. Osporava
  nalaz ve\u0161taka-antropologa, navode\u0107i da je isti nestru\u010dno ura\u0111en.
  Kona\u010dno, kao dokaz nevinosti istakao je da se optu\u017eeni, koji \u017eivi
  u Prizrenu i koji se brani sa slobode, uredno pojavljuje na glavnom pretresu, iako
  bi u suprotnom bio potpuno nedostupan dr\u017eavnim organima. Takvo pona\u0161anje
  ne ukazuje na osobu koja je izvr\u0161ilac krivi\u010dnog dela ratnog zlo\u010dina,
  ve\u0107 na osobu kojoj je stalo da doka\u017ee da nije kriva. Predlo\u017eio je
  sudu dono\u0161enje osloba\u0111aju\u0107e presude.\\n\\nZavr\u0161na re\u010d optu\u017eenog\\n\\nOptu\u017eeni
  je u svojoj zavr\u0161noj re\u010di naveo da prihvata zavr\u0161nu re\u010d svog
  branioca i ponovio da nije kriv.\"", "\"Uru\u010dene potvrde o\\n\\nzavr\u0161enom
  osnovnom kursu\\n\\nbezbedne vo\u017enje\\n\\nza motocikliste\\n\\nVideo prilog\\n\\n1
  / 3\\n\\nMoto klub \u201eBezbednost\u201c iz Beograda organizovao je trening bezbedne
  vo\u017enje za motocikliste.\\n\\nOvaj trening odr\u017ean je u trajanju od dva
  dana i sastojao se iz teorijskog i prakti\u010dnog dela obuke.Vi\u0161e o tome \u0161ta
  \u0107e u\u010desnici imati priliku da vide i nau\u010de, za televiziju \u201eSre\u0107e\u201c
  rekao je predsednik moto kluba \u201eBezbednost\u201c Vitomir Golu\u0161in.\\n\\nNa
  ideju da se u Somboru odr\u017ei ovakav trening bezbedne vo\u017enje, do\u0161ao
  je somborac Zlatko Krempati\u0107, koji je i sam \u010dlan moto kluba \u201eBezbednost\u201c.\\n\\nDrugog
  dana edukacije u Gradini je bio postavljen poligon, koji je vodio instruktor Vitomir
  Golu\u0161in, i jo\u0161 dva pomo\u0107na instruktora Aleksandar Jankovi\u0107 i
  Goran Vu\u010dkovi\u0107.\\n\\n2 / 3\\n\\nTreningu su prisustvovali ispred Saveta
  za bezbednost Grada Sombora Antonio Ratkovi\u0107 i na\u010delnik odeljenja saobra\u0107ajne
  policije PU Sombor Milan Glumac.\\n\\nCilj ovog treninga bezbedne vo\u017enje je
  da motociklisti unaprede svoje voza\u010dke sposobnosti, ali i da nau\u010de kako
  pravilno da reaguju u kriti\u010dnim situacijama.\\n\\n3 / 3\"", "\"Koga se ti\u010de
  kako \u017eive pri\u010de\\n\\nDejan Aleksi\u0107\\n\\nU knjizi \u201eKoga se ti\u010de
  kako \u017eive pri\u010de\\\" Dejan Aleksi\u0107 je opisao \u017eivot pri\u010da
  kada se zatvore korice knjige. Pri\u010de nastavljaju da \u017eive svoj \u017eivot.\\n\\n\u201eUvodna
  pri\u010da\\\" nije htela da bude uvodna pri\u010da, nego je \u017eelela da bude
  pri\u010da o lepotici, koja je spavala sto godina, dok nije do\u0161ao princ da
  je poljubi. \u010cak je jedna pri\u010da pobegla iz knjige, jer joj je bilo tesno
  i dosadno. Ima pri\u010da koja ne ume da zavr\u0161i samu sebe. U knjizi je i jedna
  pri\u010da u kojoj se radi o promaji, koja je u\u0161la u ku\u0107icu jednog pu\u017ea.
  Postoji i jedna razma\u017eena pri\u010da, koja nije htela da u njoj bude vuk sa
  buvama. \u010cak je tra\u017eila da se iz nje uklone sve ta\u010dka i zarezi, jer
  su joj li\u010dile na buve. Posle toga je pri\u010da tra\u017eila da joj se vuk
  vrati. On je pristao, ali pod uslovom da pri\u010da bude dosadna.\\n\\nU pri\u010di
  o rupu, pisac je stavio rupu u pri\u010du, kroz koju se \u010dita druga pri\u010da.
  Postoji i pri\u010da koja je alergi\u010dna, koja koja kada je neko \u010dita. Ona
  je alergi\u010dna na svoje \u010ditaoce. \u010cak ima i pri\u010da od koje se zeva.
  Tu je pisac opisao de\u010daka Zevomira, koji kad zeva ne stavlja ruku na usta.
  Na kraju knjige smo saznali kraj pri\u010de koja nije mogla da se zavr\u0161i. Pu\u017e
  se vratio svojoj ku\u0107i i objasnio promaji da je to njegova ku\u0107a i da je
  unutra tesno i samom pu\u017eu, ali promaja nije htela da ode i zato je pu\u017e
  izmislio ne\u0161to kako bi je oterao.\\n\\nI tako \u017eive pri\u010de, ako se
  nekog ti\u010de.\\n\\nTara Milanovi\u0107, III/2 Prof. raz. nast. Branka Grandi\u0107
  O\u0160 \u201e\u0110uro Strugar\\\", Bulevar M. Milankovi\u0107a 142, 11070 Novi
  Beograd\"", "\"\\n\\nNaslov ori gin ala:\\n\\nTHE BODY ARTIST Don De Lillo\\n\\nBODI
  ARTIST DON DELILO\\n\\nPreveo s engleskog: Zoran Paun ovi\u0107\\n\\nPOGLAVLJE 1\\n\\nNaizgled,
  vreme prolazi. Svet se doga\u0111a, odmo tava se u tren utke, i tek pokatkad za
  stane\u0161 da baci\u0161 pogled na pauka pripijenog uz mre\u017eu. Svetlost je
  hitra, a stvari naoko imaju jasne obrise, dok po zalivu \u0161araju pruge nemir
  nog sjaja. U lako mo\u0107nom, jarkom danu posle oluje, kada je i na j manji list
  u padu obodren sam o pouzdan jem, sa mnogo ve\u0107om izves no\u0161\u0107u zna\u0161
  ko si. Vetar huji u borovima i svet se ra\u0111a, nepov ratno, a pauk jezdi mre\u017eom
  koju nji\u0161e vetar.\\n\\nTog posled njeg jutra, slu\u010da jno su se oboje istovre
  meno zatekli tu, u kuh inji, pa su se gegali jedno kraj drugog dok su vadili stvari
  iz komoda i fioka, a onda \u010dekali jedno drugo kraj sudopere ili fri\u017eid
  era, jo\u0161 uvek pomalo uron jeni u rastvor snova, i ona je pust ila vodu iz slav
  ine preko borovn ica koje je dr\u017eala u \u0161aci, za t voriv\u0161i o\u010di
  da bi osetila kako im navire miris.\\n\\nOn je sedeo s nov i n ama, i me\u0161ao
  kafu. Bila je to njegova kafa i njegova \u0161olja. Novine su bile za jed ni\u010dke
  ali su zapravo, pre\u0107utno, bile njene.\\n\\n\u201eZna\u0161, hteo bih ne\u0161to
  da ti ka\u017eem.\\\"\\n\\nOna je pust ila vodu iz slav ine i u\u010dinilo se da
  je ne\u0161to primetila. Nikada do tada u \u017eivotu nije to primetila.\\n\\n\u201eTi\u010de
  se ku\u0107e. Eto o \u010demu je re\u010d\\\", rekao je. \u201eNe\u0161to sam hteo
  da ti ka\u017eem.\\\"\\n\\nPrimetila je kako je voda iz slav ine za neko liko sekundi
  postala neprozirna. Najpre je tekla srebrnasta i bistra a onda je za neko liko sekundi
  postala neprozirna i \u010dinilo joj se da je izuz etno \u010dudno to \u0161to tokom
  svih tih meseci dok je pu\u0161tala vodu iz kuh injske slav ine nikada nije primetila
  da voda najpre te\u010de bistra a onda postaje ne ba\u0161 mutna ali neprozirna,
  ili joj se mo\u017eda to de\u0161avalo i ranije, mo\u017eda je primetila, pa za
  boravila.\\n\\nSa vla\u017enim borovn icama u \u0161aci, pri\u0161la je komodi i
  uzela \u017eit arice i odnela kutiju do pulta, kutija je bila prete\u017eno sme\u0111e
  i bele boje, a onda je na tosteru \u0161kl jocnula ona stvar\u010dica i ona ju je
  vrat ila natrag zbog toga \u0161to je tre balo dva puta da \u0161kl jocne da bi
  se hleb pre pekao i on je odsutno klim nuo glavom u znak odo bravanja po\u0161to
  je to bio njegov tost i njegov buter a onda je uklju\u010dio radio da \u010duje
  vre mensku pro gnozu.\\n\\nVrapci su se tiskali po hrani lici, le petali krilima,
  vodili bitku za prostor na za voji tim stalcima.\\n\\nZa vukla je ruku u bli\u017eu
  komodu da bi uzela zdelu i potom is tresla malo \u017eit ar ica iz kutije a onda
  ih posula borovn icama. Obris ala je ruku o farm erke, odnekud os et iv\u0161i plavu
  vla\u017enu i izbledelu boju.\\n\\nKako se ovo zove, poluga. Prit is nula je polugu
  da bi mu pre pekla hleb.\\n\\nBio je to njegov tost, bila je to njena vre menska
  pro gnoza. Slu\u0161ala je izve\u0161taje o vre menu i \u010desto pozivala tele
  fon ski broj za vre mensku pro gnozu a ponekad sta jala pred ku\u0107om i gledala
  nebo uz obalu, isprobavala ukus povetarca ne bi li u njemu otkrila skrivene nagove\u0161taje.\\n\\n\u201eDa,
  ta\u010dno tako. Znam \u0161ta je to\\\", kazao je.\\n\\nPri\u0161la je fri\u017ei
  deru i ot vor ila vrata. Sta jala je tamo prise\u0107aju\u0107i se ne\u010dega.\\n\\nRekla
  je: \u201e\u0160ta?\\\" Time je htela da ka\u017ee \u0161ta si to rekao, a ne \u0161ta
  si to \u017eeleo da mi ka\u017ee\u0161.\\n\\nSetila se soje u gran u lama. Pri\u0161la
  je komodi i izvadila kutiju a onda uhvat ila vrata fri\u017eid era pre no \u0161to
  su stigla da se zalupe. Za vukla je ruku da uzme mleko, shvat iv\u0161i \u0161ta
  je to pre ot pri like osam sekundi on rekao, a da ona nije \u010dula.\\n\\nSvaki
  put kada je morala da se savije da ne\u0161to dohvati, u ni\u017eim i ud aljen ijim
  de lovima fri\u017eid era, is pust ila bi jauk, mada ne ba\u0161 svaki put, koji
  je li\u010dio na jadikovku nad \u017eivo tom. Bila je odvi\u0161e vitka i gipka
  da bi joj to pred stavl jalo napor, pa je time samo opona\u0161ala Reja, primetno,
  jaukala njegovim jaukom, ali na na\u010din tako posto jan i dubok da je od toga
  i njoj samoj posta jalo nela godno.\\n\\nSada kada se setio \u0161ta je to nam eravao
  da joj ka\u017ee, u\u010dinilo se kao da je to pre stalo da ga zanima. Nije morala
  da mu vidi lice da bi to shvat ila. To se os e\u0107alo u vazduhu. Os e\u0107alo
  se u pauzi koja se otegla od tren utka njegove primedbe izre\u010dene pre osam,
  deset, dvan aest sekundi. Ne\u0161to sasvim bezn a\u010da jno. On bi to shva tio
  kao \u010din sam onipoda\u0161tavanja, pokretanje jednog tako obi\u010dnog pit anja.\\n\\nPri\u0161la
  je pultu i sipala soju preko \u017eit ar ica i vo\u0107a. Poluga je odsko\u010dila
  ili ot sko\u010dila a on je ustao i odneo svoj tost natrag do stola a onda po\u0161ao
  da uzme buter pa je ona, s kar ton skim pakovan jem mleka u ruci, morala da se izvije
  un atrag od pulta kada se on prib li\u017eio, da bi mogao da otvori fioku i izvadi
  no\u017e za buter.\\n\\nSa radija su se \u010duli glasovi na jeziku nalik na hindu.\\n\\nSipala
  je mleko u zdelu. On je seo, pa ustao. Oti\u0161ao je do fri\u017eid era i uzeo
  sok od po mor and\u017ee pa zastao nasred sobe tre su\u0107i tet rapak da bi uskovit
  lao pulpu i sok u\u010dinio gu\u0161\u0107im. Nikada se ne bi setio soka pre no
  \u0161to bi tost bio gotov. Tek potom bi pro mu\u0107kao tet rapak. Tek potom bi
  sipao sok i pos mat rao kako se pri vrhu \u010da\u0161e stvara obod \u0161u\u0161tave
  pene.\\n\\nOna izvadi dlaku iz usta. Za stala je kraj pulta i pogledala je, tu kratku
  bledu vlas koja nije bila ni njena ni njegova.\\n\\nOn je stajao i mu\u0107kao tet
  rapak. Mu\u0107kao ga je du\u017ee no \u0161to je tre balo zato \u0161to nije obra\u0107ao
  pa\u017enju, pom is lila je, i zato \u0161to mu je to pri jalo na neki glupav i
  beza zlen na\u010din, zbog njegove det in jaste naravi, zbog tresenja i mu\u0107kanja
  i kar ton skog mirisa narand\u017ee.\\n\\nUpitao je: \u201eHo\u0107e\u0161 ti malo?\\\"\\n\\nOna
  je pos mat rala dlaku.\\n\\n\u201eReci mi, po\u0161to nisam sig uran. Pije\u0161
  li sok?\\\" re\u010de on, i dalje mu\u0107kaju\u0107i tu prok letu stvar\u010dicu,
  ste\u017eu\u0107i s dva prsta plasti\u010dni grli\u0107.\\n\\nOna pre\u0111e gornjim
  zubima preko jezika, da bi iz svog sis tema izbacila slo\u017eeno \u010dulno se\u0107anje
  na ne\u010diju dlaku.\\n\\nRe\u010de mu: \u201eMolim? Ja to ne pijem. Ti to zna\u0161.
  Koliko dugo ve\u0107 \u017eivimo za jedno?\\\"\\n\\n\u201eNe dugo\\\", rekao je.\\n\\nUzeo
  je \u010da\u0161u, sipao sok i gledao kako se po javljuje pena. Zatim se nekako
  kao s bolom odvukao do fotelje.\\n\\n\u201eNe dovoljno dugo da bih po\u010deo da
  za pa\u017eam de talje\\\", dodao je.\\n\\n\u201eOduvek sam ver ovala da to ne mo\u017ee
  da se dogodi ovde. Bilo gde, ali ne ovde.\\\"\\n\\nOn upita: \u201e\u0160ta to?\\\"\\n\\n\u201eDlaka
  u ustima. S ne\u010dije tu\u0111e glave.\\\"\\n\\nPremazao je tost buterom.\\n\\n\u201eMisli\u0161
  da se to doga\u0111a samo u ve likim gradovima s me\u0161ovitom popu la ci jom?\\\"\\n\\n\u201eBilo
  gde, ali ne ovde.\\\" Dr\u017eala je tu vlas kose izme\u0111u palca i ka\u017eiprsta,
  i gledala je s karikir anom odv rat no\u0161\u0107u, ili sa stvarnom odv ratno\u0161\u0107u
  nategnutom do gran ica umet ni\u010dke ek s presije, usana iskrivljenih u gr\u010du.
  \u201eEto \u0161ta mislim.\\\"\\n\\n\u201eMo\u017eda je nosi\u0161 jo\u0161 od det
  injstva.\\\" Vratio se svojim nov i n ama. \u201eJesi li imala psa?\\\"\\n\\n\u201e\u0415\u0458.
  \u0160ta je to tebe probudilo?\\\", up it ala je.\\n\\nNovine su bile njene. Tele
  fon je bio njegov, izuzev kada je ona zvala da \u010duje vre menski izve\u0161taj.
  Ra\u010dunar su kor istili oboje, ali je u duhovnom smislu pri padao njoj.\\n\\nSta
  jala je kraj pulta i pos mat rala dlaku. A onda je pucnula prstima da bi je stresla
  na pod. Okrenula se ka sudoperi i oprala \u0161aku toplom vodom a potom odnela zdelu
  sa \u017eit ar icama do stola. Kada je pro\u0161la pored pro zora, ptice prhnu\u0161e
  u vazduh.\\n\\n\u201eVi\u0111ao sam te kako is pi ja\u0161 litre soka, strava, \u0161ta
  da ti ka\u017eem?\\\"\\n\\nUsta su joj jo\u0161 bila iskrivljena od do\u017eivl
  jaja u kome se sus rela sa \u017eivo tom nekog nezn anog rukovaoca hranom ili od
  neke stvarnosti jo\u0161 \u010dud nije i za k u\u010dastije, tog duboko in tim nog
  pren o\u0161enja kose od jedne do druge osobe i nekako od jednih usta do drugih,
  kroz godine i gradove i bole\u0161t ine i ne\u010distu hranu i nebro jene \u0161tetne
  telesne te\u010dnosti.\\n\\n\u201eMolim? Mislim da nisi u pravu\\\", rekla je.\\n\\nNo
  dobro, spust ila je zdelu na sto. Oti\u0161la je do \u0161ted njaka, uzela \u010dajnik
  i na pun ila ga vodom iz slav ine. On je pro menio stan icu na radiju i na po menuo
  joj da je ne\u0161to propust ila. Odnela je \u010dajnik natrag do \u0161ted njaka
  jer tako se \u017eivi \u017eivot \u010dak i kad toga nisi svestan a onda je ponovo
  pre vukla zubima preko jezika, kao da ne\u0161to nagla\u0161ava, gledaju\u0107i
  pri tom plavi\u010dasti plamen sa grejne plo\u010de.\\n\\nMorala je hitro da odsko\u010di
  un atrag od pulta kad je on pri\u0161ao da uzme no\u017e za buter.\\n\\nOti\u0161la
  je do stola, dok su ptice nastavl jale da se tiskaju oko hranilice. Iz letale su
  iz senke pod stre hom i doletale u sun \u010devu svetlost i ti\u0161inu, \u0161to
  je ona samo jednim delom mogla da is prati pogle dom, taj pre lepi nemi beg, u kome
  su ptice bivale izlo\u017eene tako silovitom naletu sunca da ih je svetlost naprosto
  pro\u017edir ala, li\u0161avala ih teles nosti, pretvarala u ne\u0161to prozra\u010dno
  i hitro i sjajno kao prah.\\n\\nSela je i po\u010dela da lista novine, a onda shvat
  ila da nije ponela ka\u0161iku. Nije ponela ka\u0161iku. Pogledala je u njega i
  primetila da na jednoj strani vilice ima flaster.\\n\\nKor istila je stari ulubljeni
  \u010dajnik umesto novog koji je ne davno kupila jer - nije znala za\u0161to. Bila
  je to stara drvena ku\u0107a sa puno soba i pravih kamina i sa \u017eivot in jama
  u zidovima i vlagom pos vuda, boravi\u0161te koje su izna jmili na nevi\u0111eno,
  relikt iz godina procvata drvne in dus trije i bro do grad nje, ne sum njivo prev
  e lika, a behu tu i \u0161kri pave podne daske i mno\u0161tvo prastarih iskrivljenih
  alatki.\\n\\nNa\u010dinila je sam o pods me\u0161ljiv pokret od koga umalo nije
  pala sa stolice, i oti\u0161la do pulta da uzme ka\u0161iku. Usput je ponela i gran
  ule soje. Soja je imala nekakav miris za koji se \u010dinilo da ne pri pada toj
  peskovitoj tvari u kutiji. Bio je to slaba\u0161ni miris \u017eita pome\u0161an
  sa zadahom nogu. Os e\u0107ala ga je svaki put kada bi uzela soju. Os etila ga je
  dva ili tri puta.\\n\\n\u201eOpet si se posekao.\\\"\\n\\n\u201eMolim?\\\" Stavio
  je ruku na vilicu, za roniv\u0161i glavu u novine. \u201eMalo sam se recnuo.\\\"\\n\\nOna
  po\u010de da \u010dita pri\u010du iz svog dela novina. Bile su to stare novine,
  nedeljne, kupljene u gradu, zbog toga \u0161to ovde nije bilo raznosa\u010da.\\n\\n\u201eU
  posled nje vreme, kako da ti ka\u017eem, mo\u017eda ne bi tre balo da se brije\u0161
  \u010dim us tane\u0161. Treba najpre da se probudi\u0161. Za\u0161to se uop\u0161te
  i brije\u0161? Pusti ponovo brkove. Pusti bradu.\\\"\\n\\n\u201eZa\u0161to se brijem?
  Mora da postoji neki razlog\\\", rekao je. \u201eHo\u0107u da mi Bog vidi lice.\\\"\\n\\nPod
  igao je pogled s novina i nas me jao se na onaj prazan na\u010din koji ona nije
  volela. Ona uze za logaj \u017eit ar ica i po\u010de da \u010dita novu pri\u010du.
  U posled nje vreme, imala je obi\u010daj da tra\u017ei sebi mesto u po jedinim pri\u010dama
  iz novina, da se ubacuje u njih. Neka vrsta san jar enja. U\u010dinila bi to a onda
  bi postala svesna da to \u010dini a onda bi katkad samo koji minut kas nije to ponovila
  sa istom ili nekom drugom pri\u010dom da bi potom ponovo postala svesna.\\n\\nPose
  gnula je za kuti jom soje ne di\u017eu\u0107i pogled s novina i dodala u zdelu malo
  gran ula a na radiju su pri\u010dali o sao bra\u0107aju i jo\u0161 nekim stvar ima.\\n\\nBi\u0107e
  da je imala nameru da do kraja po tro\u0161i stari \u010dajnik, da ga koristi i
  kor isti sve dok se na njemu ne stvore gro muljice r\u0111e tako da bi tada i tek
  tada bila spremna da ga zameni \u010da jnikom koji je ne davno kupila.\\n\\n\u201e\u0408\u0435
  l'' ti ba\u0161 mora\u0161 da slu\u0161a\u0161 radio?\\\"\\n\\n\u201eNe\\\", rekla
  je \u010ditaju\u0107i novine. \u201e\u0410 \u0161to?\\\"\\n\\n\u201e\u0422\u043e
  je takvo sranje, da ne pover uje\u0161.\\\"\\n\\nKako je samo nagla sio to nj u
  re\u010di sranje, da joj time podari dostojan stvo.\\n\\n\u201eNisam ja uklju\u010dila
  radio. Ti si uklju\u010dio radio\\\", rekla je.\\n\\nOn ode do fri\u017eid era i
  vrati se s jednom krupnom tamnom smok vom i isklju\u010di radio.\\n\\n\u201eDaj
  malo toga\\\", rece ona, \u010ditaju\u0107i novine.\\n\\n\u201eNisam ja nikoga ni
  za \u0161ta okrivio. Ko ga je uklju\u010dio, ko isklju\u010dio, nema veze. Samo
  je neko od jutros malo nad rndan. Ja sam taj, kako da ka\u017eem, ko bi tre balo
  da bude rato boran. A ne mlada \u017eena koja jede i spava i \u017eivi ve\u010dno.\\\"\\n\\n\u201eKako?
  Hej, Rej. Za\u010depi gubicu.\\\"\\n\\nOn odgrize peteljku i baci je prema sudoperi.
  Zatim pal\u010devima rascepi smokvu pa joj uze ka\u0161iku iz ruke i oliza je a
  onda za hvati malo pur pur nog mesa iz razjapljene ko\u017ee smokve. Zatim is trese
  to na svoj komad tosta - meso, ka\u0161u, pulpu - pa ga razmaza donjim delom ka\u0161ike,
  tu krvavo-buter astu masu u kojoj je bujao \u017eivot se menki.\\n\\n\u201eJa sam
  taj ko bi tre balo da bude preosetljiv ujutro. Ja sam taj ko bi tre balo da bogoradi.
  U\u017eas jo\u0161 jednog obi\u010dnog dana\\\", rekao je nekako man gupski. \u201eNe
  zna\u0161 ti jo\u0161 kako je to.\\\"\\n\\n\u201eOlabavi malo\\\", re\u010de mu
  ona.\\n\\nOna se na\u017ee napred, on pru\u017ei hleb. Na granama drve\u0107a u
  bliz ini ku\u0107e, vrane su se bu\u010dno dozi vale. Ona odgrize za logaj i za
  t vori o\u010di da bi mogla da razmisli o ukusu.\\n\\nVratio joj je ka\u0161iku.
  Potom je uklju\u010dio radio pa se setio da ga je upravo bio isklju\u010dio i onda
  ga ponovo isklju\u010di. Nasula je gran ule u zdelu. Miris soje zaista je bio ne\u0161to
  izme\u0111u zadaha tela, da, i to tamo negde iz donjih delova, i mirisa nekak vog
  stvar nog \u017eivota klica iz dubine zemlje, bogate se menom. No to i nije bio
  ba\u0161 pravi opis. U nov i n ama je pro\u010dit ala pri\u010du o nekom detetu
  napu\u0161tenom i ostavljenom negde u nekoj vuko jebini. Ni\u010dim se to nije moglo
  opisati.\\n\\nBio je to jed nostavno miris. Taj miris bio je ono \u0161to jeste,
  neza v isan od svih drugih izvora. Kao da je - umalo nije rekla ne\u0161to za \u0161ta
  je pret postavila da bi mu to moglo biti zan im ljivo ali se ipak pre dom is lila
  - kao da je neki, mo\u017eda, sred n jovekovni u\u010den jak pok u\u0161ao da razvrsta
  sve posto je\u0107e mirise i prona\u0161ao ne\u0161to \u0161to se nije uk lap alo
  u njegov sistem i nadenuo mu ime soja, \u0161to je lako moglo biti deo neke vi soko
  parne lat in ske re\u010di, ali zapravo nije, i tako je ona nastavila da razmi\u0161lja
  o ne\u010demu, ne znaju\u0107i ta\u010dno o \u010demu, s ka\u0161ikom zaustavljenom
  na dva-tri cen ti metra od usta.\\n\\nOn re\u010de: \u201eMolim?\\\"\\n\\n\u201eNi\u0161ta
  nisam rekla.\\\"\\n\\nUstala je da uzme ne\u0161to. Pogledala je \u010dajnik i shvat
  ila da nije ustala zbog njega. Znala je da \u0107e joj on ionako pristi\u0107i po\u0161to
  je uvek bilo tako pa je tako bilo i ovog puta. Ustala je da uzme med za \u010daj
  iako voda jo\u0161 nije klju\u010dala. Bila je sklona tom hiper pri pre manju, ili
  hiperhaosu, ili hiperakt ivnosti, i Rej je to uvek go vorio, ili je to jednom rekao,
  a ona je u glavi nosila i glas koji je pri padao njoj i bio je to dija log ili mono
  log i oti\u0161la je do komode gde je uzela med i kesice \u010daja - glas koji je
  pot i cao iz neke pri\u010de pro\u010ditane u nov i n ama.\\n\\n\u201eJesi li ti
  to hteo ne\u0161to da mi ka\u017ee\u0161?\\\"\\n\\nOn re\u010de: \u201eMolim?\\\"\\n\\nDotakla
  mu je rukom rame i pre\u0161la na svoju stranu stola. Ptice su uz letele s hranilice
  uz lepet krila koji je zvu\u010dao kao gomila p i t, za slovom p sledilo je mekano
  t. Samo \u0161to uop\u0161te nije zvu\u010dalo tako. Ni slu\u010da jno nije tako
  zvu\u010dalo.\\n\\n\u201eNe znam, ne\u0161to si spo menuo. Ne\u0161to o ovoj ku\u0107i.\\\"\\n\\n\u201eNi\u0161ta
  zan im ljivo. Za boravi.\\\"\\n\u201eNe\u0107u da za boravim.\\\"\\n\u201eNije zan
  im ljivo. Ili, da ka\u017eemo ovako. Dosadno je.\\\"\\n\u201eSve jedno, is pri\u010daj
  mi.\\\"\\n\u201eSuvi\u0161e je rano. To je na porno. I dosadno.\\\"\\n\u201eEto,
  sedi\u0161 tu i pri\u010da\u0161. Is pri\u010daj mi\\\", re\u010de.\\n\\nUzela je
  za logaj \u017eit ar ica i nastavila da \u010dita novine.\\n\\n\u201eNa porno je.
  Zna\u0161 kako je na porno. Kao da gura\u0161 veliki kamen.\\\"\\n\u201eEto, sedi\u0161
  tu i pri\u010da\u0161.\\\"\\n\u201eOvde\\\", re\u010de on.\\n\u201eSpo menuo si
  ku\u0107u. Ni\u0161ta u vezi s ovom ku\u0107om nije dosadno. Meni\\n\\nse ona dopada.\\\"\\n\\n\u201eTebi
  se sve dopada. Ti sve voli\u0161. Ti si moj sre\u0107ni dom. Ovde\\\", re\u010de
  on.\\n\\nPru\u017eio joj je os tatak svog tosta i ona ga sa\u017evaka i pome\u0161a
  sa \u017eit aricama i bobicama. Odjed nom je shvat ila \u0161ta je nam eravao da
  joj ka\u017ee. Za\u010dula je mno\u0161tvo vrana kako galame u granama, ver ovatno
  u napadu na nekog sokola.\\n\\n\u201eHajde, reci mi. To je samo sekund\\\", rekla
  je, pot puno sig urna da zna o \u010demu je re\u010d.\\n\\nVidela ga je kako za
  vla\u010di ruku u d\u017eep na grudima a onda za staje i spu\u0161ta je prema \u0161olji.
  Bile su to njegova kafa, njegova \u0161olja i njegova ci gar eta. Jedan doga\u0111aj
  opisan u nov i n ama kao da se pod igao iz tih mas til javo od\u0161tam panih redova
  i uvukao je u sebe. Nedel jom, \u010dovek razdvaja delove novina.\\n\\n\u201eSamo
  mi reci tako je. Po\u0161to ja ionako znam.\\\"\\n\\nOn re\u010de: \u201eMolim?
  Ti si ba\u0161 nava lila da izvu\u010de\u0161 to iz mene. Sre\u0107a je \u0161to
  obi\u010dno ne dor u\u010dkujemo za jedno. Jer, u \u0161ta bi se pret vor ila moja
  jutra.\\\"\\n\\n\u201e\u0408\u0430 ionako znam. Zato mi reci.\\\"\\n\\nOn je gledao
  u novine.\\n\\n\u201eZna\u0161. Ba\u0161 lepo. Onda ne moram da ti pri\u010dam.\\\"\\n\\n\u010citao
  je, spremao se da krene po ci gar ete.\\n\\nOna re\u010de: \u201eOnaj \u0161um.\\\"\\n\\nOn
  je pogleda. Zagleda se u nju. A onda joj podari velik osmeh, tih zlat nih zuba na
  \u0161irokom tam no maslinastom licu. Podu\u017ee ve\u0107 nije to videla, taj osmeh
  prop u\u0161ten kroz po ja\u010dalo, Rej koji se budi, bis trih i svet lih o\u010diju,
  s dubokim borama urez anim oko usana.\\n\\n\u201e\u0160umovi u zidovima. Jeste.
  Pro\u010dit ala si mi misli.\\\"\\n\\n\u201eBio je to jedan \u0161um. Bio je to
  jedan \u0161um\\\", rekla je. \u201eI nije bio u zidovima.\\\"\\n\\n\u201eJedan
  \u0161um. U redu. Nisam ga \u010duo u posled nje vreme. To je ono \u0161to sam hteo
  da ka\u017eem. Nema ga vi\u0161e. Gotovo. Kraj razgo v ora.\\\"\\n\\n\u201eTako
  je. Samo \u0161to sam ga ja \u010dula ju\u010de, \u010dini mi se.\\\"\\n\\n\u201eOnda
  zna\u010di da je jo\u0161 tu. Fino. Ba\u0161 mi je drago, zbog tebe.\\\"\\n\\n\u201eOvo
  je stara ku\u0107a. Tu uvek ima nekak vih \u0161umova. Ali ovaj je druga\u010diji.
  Nisu to one glupave \u017eivot inje koje tr\u010dka raju no\u0107u. Niti sleganje
  ku\u0107e, ili \u0161ta ti ja znam\\\", rekla je, sa \u017eeljom da ne za zvu\u010di
  za b- rinuto. \u201eKao da je ne\u0161to unutra.\u201c\\n\\n\u010citala je novine,
  glas joj je posta jao sve ti\u0161i.\\n\\n\u201eFino. Ba\u0161 mi je drago\\\",
  rekao je. \u201eTebi treba dru\u0161tvo.\\\"\\n\\nRazdva ja\u0161 delove nedeljnih
  novina i u njima nalazi\u0161 be skon a\u010dne istovetne od\u0161tam pane redove
  s lju dima koji \u017eive negde u tim re\u010dima i ta \u010dud novata sapeta stvarnost
  hartije i mas tila nedelju dana se uvla\u010di u ku\u0107u a kad pogleda\u0161 stran
  icu i razlu\u010di\u0161 jedan red od drugog sve to te uvu\u010de u sebe i na jed
  nom eto ti nekih ljudi \u0161irom sveta izlo\u017eenih zlostavl janju, ljudi koji
  govore nekim drugim jezikom, i ti po\u010din je\u0161 da razgo v ara\u0161 s njima
  manje-vi\u0161e nekon trol isano sve dok ne shvati\u0161 \u0161ta \u010dini\u0161
  a onda prestane\u0161, i ugleda\u0161 bilo \u0161ta \u0161to se u tom tren utku
  nalazi pred tobom, na primer pola \u010da\u0161e soka u ruci tvoga mu\u017ea.\\n\\nUzela
  je za logaj \u017eit ar ica i za boravila da im oseti ukus. Ukus je izgubila negde
  usput, izme\u0111u tren utka kada je stavila hranu u usta i one \u017ealosne sekunde
  kada ju je progutala.\\n\\nOn odlo\u017ei \u010da\u0161u soka. Zatim izvadi iz ko\u0161ulje
  paklo i zapali ci gar etu, ci gar etu koju je pu\u0161io uz kafu jo\u0161 od svoje
  dvan aeste godine, kako joj je jednom rekao. Pustio je \u0161ibicu da jo\u0161 malo
  dogori pre no \u0161to ju je kao na usporenom snimku zam i\u0161ljeno pro tresao
  i spus tio na rub svog tanjira. Prijao joj je taj miris duvana. Bio je deo njenih
  znanja o njego vom telu. Pred stavl jao je auru tog \u010doveka, talog dima i nenaru\u0161ene
  navike, jo\u0161 jednu di men ziju no\u0107i, i ona ga je skid ala s kovrd\u017eavih
  sedih dlaka na njegovim grudima, os e\u0107ala ga u njegovim ustima. Na to se on
  svodio u tami, na ci gar ete i mum lanje u snu i stot ine drugih stvari kojima se
  mo\u017ee ili ne mo\u017ee naden uti ime.\\n\\nNo ova nije bila od njegovih, ta
  dlaka koju je prona\u0161la u svojim ustima. Pre izlaska iz toaleta, za posleni
  su obavezni da operu ruke. Bio je to njegov tost, ali ona je ve\u0107 bila pojela
  gotovo po lovinu par\u010deta. Bile su to njegova kafa i \u0161olja. Samo mu dotaknite
  \u0161olju i pogleda\u0107e vas popreko, onim zvan i\u010dnim pogle dom kakvim bokser,
  jednim okom, odmerava protivnika pri likom pozdravnog dodira rukavicama. Znala je,
  me\u0111u tim, da je to samo njena izmi\u0161l jot ina, po\u0161to njega savr\u0161eno
  nije bilo briga \u0161ta \u0107ete u\u010din iti s njego vom \u0161oljom. Bilo je
  mnogo drugih \u0161olja koje je mogao da upo trebi. Tele fon je bio njegov. Ptice
  su bile njene, ti vrapci koji su klju cali se menke sun cokreta. Ona dlaka pri padala
  je nekom tre\u0107em.\\n\\nRekao je ne\u0161to o svom auto mobilu, o kilo metra\u017ei,
  uz \u017eivu gestiku la- ciju. Voleo je da di riguje, da pokre tom ruke produ\u017ei
  izre\u010denu primedbu, s dva is turena prsta.\\n\\n\u201eJu\u010de sam celog dana
  mis lila da je petak.\\\"\\n\\nOn re\u010de: \u201eMolim?\\\"\\n\\nIli postane\u0161
  neko drugi, neko od likova iz pri\u010de, u\u010destvuje\u0161 u di jalogu koji
  sama izmi\u0161l ja\u0161. Ponekad posta je\u0161 mu\u0161karac, koji \u017eivi
  izme\u0111u redova, stvara jo\u0161 jednu verziju pri\u010de.\\n\\nRazmi\u0161l
  jala je i \u010ditala. Pose gnula je da uzme kutiju sa sojom i rukom za ka\u010dila
  tet rapak soka. Podigla je pogled i shvat ila da on ne \u010dita novine. Gledao
  je u njih ali ih nije \u010ditao i ona je to shvat ila sa zaka\u0161n jen jem, to
  da je sve vreme gledao u novine ali nije us va jao re\u010di sa stran ica.\\n\\nPakovanje
  soka ostalo je us pravno. Nasula je jo\u0161 malo soje u \u010diniju, da smesa bude
  gu\u0161\u0107a a \u017eivot du\u017ei.\\n\\n\u201eJu\u010de sam celog dana mis
  lila da je petak.\\\"\\n\\n\u201e\u0420\u0430 je li bio?\\\", rekao je.\\n\\nNije
  za boravila da se os mehne.\\n\\nOn upita: \u201eZa\u0161to bi to uop\u0161te bilo
  va\u017eno?\\\"\\n\\nBila mu je spust ila ruku na rame i malo je ne dosta jalo da
  njome pre\u0111e preko njego vog vrata, da mu zavu\u010de prste u kosu i pomiluje
  ga, ali nije to u\u010dinila.\\n\\n\u201eSamo ka\u017eem. Kako se uop\u0161te dogodi
  da \u010detvrtak li\u010di na petak? Izvan grada smo. Izvan kal en dara. Ovde petak
  ne bi tre balo da ima svoj iden titet. \u017deli li neko jo\u0161 malo kafe?\\\"\\n\\nOti\u0161la
  je da sipa vodu za \u010daj i za stala kraj \u0161ted njaka, \u010dekaju\u0107i
  ga da ka\u017ee da ili ne na izre\u010deno pit anje o kafi. Kada je krenula natrag,
  ugledala je jednu kreju kako sedi na hrani lici. Za stala je kao uko pana i zaustavila
  dah. Kreja je sta jala onako velika i ugla\u010dana i de lovala je kraljevski ud
  aljeno od os ta lih ptica za ok upljenih jelom i njoj se u\u010dini da bi mogla
  da pover uje da nikada do tada nije videla kreju. Sta jala je onako ogromna, gledala
  u nju, videla ono \u0161to je videla, i ona po\u017eele da ka\u017ee Reju da podigne
  pogled.\\n\\nPos mat rala je pticu, s tim crnim prugama preko krila i repa, i pom
  islila je kako je odnekud tek sada nau\u010dila kako treba gled ati. Nikada do tada
  ni\u0161ta nije videla tako jasno i to ne samo zato \u0161to se kreja smestila ba\u0161
  tu, dovoljno blizu da je do de talja mogla videti per jan icu i boje. Va\u017ean
  je bio i taj o\u010diti \u0161ok iza zvan njenom po ja vom me\u0111u znatno manjim
  sivkas tim pticama, njena min er al no plava i prigu\u0161enoplava boja i \u0161iroki
  tamni okov rat nik. Ali kad bi Rej pod igao pogled, ptica bi odletela.\\n\\nPok
  u\u0161ala je da pre vazi\u0111e te de talje i dopre do same ptice, te plja\u010dka\u0161ice
  tu\u0111ih gnezda i ve\u0161te im it at orke, do usred sre\u0111ene radoznalosti
  u tim o\u010dima, neke vrste ljubo pitljive hlad no\u0107e koja je de lovala pomalo
  kao izazov.\\n\\nKakve samo nemogu\u0107e svetove vide ptice kad gledaju ku\u0107e.
  Zamis lite samo. Kakvo rasplin javanje svake zam is live povr\u0161ine i svakog
  pro cesa. Po\u017eelela je da pover uje da ptica vidi nju, \u017eenu sa \u0161oljom
  za \u010daj u ruci, i da ne mari za sk lapanje i rask lapanje dana i no\u0107i,
  za utvaru prost ora odvo jenog od vremena. Oprezno udahnuv\u0161i vazduh, nastavila
  je da gleda. Bila je pot puno svesna jas no\u0107e tog tren utka, ali je znala i
  to da se on ve\u0107 bli\u017ei kraju. Os etila je to po kreji. Ili mo\u017eda nije.
  Sama je to tako smi\u0161l jala zato \u0161to vi\u0161e nije mogla da gleda. Mora
  da ovako izgleda kad odjed nom progleda\u0161 nakon \u0161to si \u010dita vog \u017eivota
  bio gotovo slep. Ona re\u010de ne\u0161to Reju, koji malo podi\u017ee glavu, i tim
  pokre tom otera kreju, dok vrapci os tado\u0161e ravnodu\u0161ni.\\n\\n\u201eJesi
  li je video?\\\"\\n\\nNapola se okrenuo da joj odgo vori.\\n\\n\u201eZar ih ne vi\u0111amo
  svaki dan?\\\"\\n\\n\u201eNe svaki dan. I nikada tako blizu.\\\"\\n\\n\u201eNikada
  tako blizu. U redu.\\\"\\n\\n\u201eGledala je u mene.\\\"\\n\\n\u201eGledala je
  u tebe.\\\"\\n\\nSta jala je na istom mestu, kraj njego vog levog ramena. Kada je
  krenula prema stolici, vrapci odlete\u0161e.\\n\\n\u201ePos mat rala me je.\\\"\\n\\n\u201eI
  je l'' ti to ulep\u0161alo dan?\\\"\\n\\n\u201eUlep\u0161alo mi je dan. \u010citavu
  nedelju. \u0160ta jo\u0161 ho\u0107e\u0161?\\\"\\n\\nPijuck ala je \u010daj i \u010ditala.
  Skoro sve \u0161to bi pro\u010dit ala pod stic alo ju je na san jar enje.\\n\\nUklju\u010dila
  je radio i lagano po\u010dela da tra\u017ei stan icu, \u010ditaju\u0107i novine,
  u nastojanju da prona\u0111e vre mensku pro gnozu.\\n\\nOn je ispio kafu i za p
  alio ci gar etu.\\n\\nOna je sedela nad zdelom \u017eit ar ica. Gledala je nekud
  pored zdele u neki prostor koji se istovre meno nalazio i u njenoj glavi i tu pred
  njom.\\n\\nPres avila je svoj deo novina i pro\u010dit ala ili nije red ili dva
  i jo\u0161 nekoliko redova, pijuck ala \u010daj i bludela u mis lima.\\n\\nNa radiju
  su javl jali vest o nekoj raketi koja je iz ta jnovitog razloga ek s plodir ala,
  ispod zemlje, u Montani, i ona nije uspela da \u010duje da li je to bila bojeva
  raketa ili ne.\\n\\nOn je pu\u0161io i gledao kroz prozor sa svoje desne strane,
  gde se zapu\u0161teni travn jak survavao na izrovani blat njavi put koji je vodio
  do po\u0161ljun \u010danog puta.\\n\\nOna je \u010ditala i bludela u mis lima. Bila
  je i tu i tamo.\\n\\n\u010caj je bio bez meda. Teglu s medom os tavila je neotvorenu
  kraj \u0161ted njaka.\\n\\nOn se obazre oko sebe tra\u017ee\u0107i pepel jaru.\\n\\nOna
  je vodila razgo vor s nekim lekarom iz nov in skog teksta.\\n\\nTre balo je pre\u0107i
  tri kilo metra po \u0161ljunku da bi se stiglo do as falt nog puta koji je vodio
  u grad.\\n\\nUzela je smokvu s njego vog tanjira pa za vukla prst u nju i pro\u010deprkala
  tra\u017ee\u0107i meso ploda.\\n\\nNeki glas je rekao ne\u0161to o vre menu, no
  to joj je pro maklo. Nije ni shvat ila da je re\u010d o vre menskoj pro gnozi, a
  ve\u0107 je bilo gotovo.\\n\\nOn je za ba cio glavu unazad i lagano je okretao s
  jedne na drugu stranu da bi smanjio na petost u vratu.\\n\\nOna je sisala prst one
  \u0161ake koju je bila zarila u smokvu i razmi\u0161l jala o tome \u0161ta im je
  sve po trebno iz pro davnice.\\n\\nIsklju\u010dio je radio.\\n\\nPijuck ala je \u010daj
  i \u010ditala. Manje-vi\u0161e, us pevala je da vidi sebe kako razgo v ara s nekim
  lekarom u nekak voj di vljini, dok kraj njih u pra\u0161ini le\u017ee izglad neli
  ljudi.\\n\\nCi gar eta mu je dogorevala u ruci.\\n\\nUzela je kutiju sa sojom i
  nag nula je ka svom licu i omir is ala njenu un ut ra\u0161n jost.\\n\\nKada je
  iza\u0161ao iz sobe, shvat ila je da je \u017eelela ne\u0161to da mu ka\u017ee.\\n\\nPonekad
  i ne razmi\u0161lja o tome \u0161ta \u017eeli da mu ka\u017ee sve dok on ne iza\u0111e
  iz prost or ije u kojoj se tren utno nalaze. Tek tada razmisli o tome. A onda ili
  vikne za njim ili ne vikne, a on odgo vori ili ne odgovori.\\n\\nSedela je i is
  pi jala os tatak \u010daja i razmi\u0161l jala o onom o \u010demu je razmi\u0161l
  jala, o tragov ima se\u0107anja i pro plam sajima pri zora i jednoj prijateljici
  koja joj je ne dosta jala i o sen kama i\u0161aranom, nedeljivom tren utku jednog
  nor mal nog jutra koje postaje suma nuto na na\u010din do te mere ljud ski i rut
  in ski da ne mo\u017ee\u0161 \u010dak ni da za stane\u0161 da ne\u0161to primeti\u0161,
  osim da treba kupiti sapun, i da su iza tebe ptice, koje zveckaju metal nim ok virom
  hranilice.\\n\\nKako je to glupo, \u010ditati novine i jesti.\\n\\nUgledala ga je
  kako stoji u dov ratku.\\n\\n\u201eJesi li negde videla moje klju\u010deve?\\\"\\n\\n\u201eMolim?\\\"\\n\\nSa\u010dekao
  je da joj pit anje dopre do svesti.\\n\\n\u201eKoje klju\u010deve?\\\"\\n\\nGledao
  je u nju.\\n\\nOna re\u010de: \u201eJu\u010de sam kupila neki losion. Htela sam
  to da ti ka\u017eem. Za masa\u017eu mi\u0161i\u0107a. Eno ga u zeleno-beloj tubi
  gore u ve likom kupatilu. Bez masti je. Slu\u017ei za masa\u017eu mi\u0161i\u0107a.
  Is trl jaj se njime, ljubavi. Ili me lepo zamoli, pa \u0107u te ja is trl jati.\\\"\\n\\n\u201eSvi
  moji klju\u010devi su na jednom privesku\\\", rekao je.\\n\\nOna umalo nije izust
  ila: ne znam da li je to pametno? Ali nije. Jer to je bilo tako suvi\u0161no. Jer
  bilo je tako ni\u0161tavno izgo v or iti tako ne\u0161to, ujutro ili u bilo koje
  drugo vreme, u jednom mo\u0107nom i vedrom danu posle oluje.\\n\\nREJ ROBLS, 64,
  PESNIK SAMO\u0106E U FILMSKOJ UMET NOSTI\\n\\nRej Robls, koji je krajem sedam de
  setih re\u017eirao dva \u0161irom sveta proslavljena filma, prona\u0111en je mrtav
  u nedelju ujutro na Men hetnu, u stanu njegove prve supruge, stil istk inje Izabele
  Kor ales.\\n\\nUzrok smrti, prema re\u010dima poli cije koja je iza\u0161la na lice
  mesta, bilo je sam op ovre\u0111ivanje hicem iz pi\u0161tolja.\\n\\nSve do\u010denja
  gos pod ina Roblsa o vlastitoj mla dosti bila su prili\u010dno ne dosledna, ali
  prema najubedljivi joj neza v is noj verz iji, ver ovatno je u tren utku smrti imao
  \u0161ezde set \u010detiri godine.\\n\\nRo\u0111en je kao Ale handro Al kesar, u
  Barseloni. Prema jednoj bio grafskoj zabele\u0161ci ob javljenoj u \u010dasop isu
  Cahiers du Cinema, njegov otac, radnik u fab rici tek stila i vatreni an ti fa\u0161ista,
  po ginuo je u tom gradu tokom na j\u017ee\u0161\u0107ih uli\u010dnih okr\u0161aja
  u gra\u0111anskom ratu. U \u010dlanku se navode i dokazi o tome da je Ale handro,
  tada jo\u0161 de\u010dak, bio me\u0111u onom \u0161panskom \u201edecom rata\\\"
  koju su porodice poslale u Sovjet ski Savez u vreme kada je diktatura des nice posta
  jala neizbe\u017ena stvarnost.\\n\\nNije poznato koliko je godina proveo u SSSR-u,
  niti da li se ikada ponovo susreo sa svojom majkom. Zna se da je kao mladi\u0107
  \u017eiveo u Parizu, gde je radio kao \u0111ub retar, nas tupao kao uli\u010dni
  \u017eon gler i igrao male uloge u neko liko filmova, glume\u0107i lopove ili makroe.
  U to vreme je i uzeo pseud onim Rej Robls, po spored nom liku iz uloge koju je odi
  grao u nekom za boravljenom film noiru.\\n\\nNeko liko godina proveo je u Nju jorku
  rade\u0107i na is pi sivanju tit lova za retke filmove na \u0161panskom i ruskom
  jeziku, a onda oti\u0161ao na Zapad i za poslio se kao livrejis ani \u0161ofer u
  Los An \u0111e lesu, gde je odr\u017eavao svoju mar gin alnu vezu sa filmskim svetom,
  nas tupaju\u0107i kao statista u pet-\u0161est filmova. S druge strane kamere prvi
  put se oprobao po\u0161to je najpre postao li\u010dni \u0161ofer jednog mul timilion
  era, pro iz vo\u0111a\u010da ce menta iz Li hten\u0161ta jna, \u010doveka koji je
  ulagao ogromne svote novca u filmske pro jekte. Prema njegovim vlasti tim re\u010dima,
  gos podin Robls stupio je u ljubavnu vezu sa suprugom tog \u010doveka, i ubedio
  je da mu obezbedi posao re\u017eisera druge ekipe u radu na jednom \u0161pa getivesternu
  \u010dije je sn i m anje tre balo da se obavi u \u0160pan iji.\\n\\nDeset godina
  kas nije, na filmskom fest i valu u Kanu, gos podin Robls obra tio se za di vljenoj
  pub lici re\u010dima: \u201eRe\u0161enje tajne \u017eivota je u filmovima.\\\"\\n\\nRe\u017eirao
  je ukupno osam filmova. Tre\u0107i me\u0111u njima, Moj \u017eivot za tvoj, fran
  cusko-it ali janska ko produk cija o jednoj bogata\u0161ici koju otimaju razbojn
  ici s Korzike, dobio je Zlatnu palmu u Kanu. Za njim je usle dio Po laris, napeta
  amer i\u010dka krim in al isti\u010dka drama s prigu\u0161enim tonovima \u0161panskog
  nad real izma. Ovaj film stekao je kultno sled ben i\u0161tvo i dugo se prikazivao
  u mno gobro jnim artbisokop ima u zemlji i in ostran stvu.\\n\\n\u201eNjegova na
  jbolja dela pro\u0161iruju filmski jezik\\\", nap isao je kriti\u010dar Filip Stanski.
  \u201eNjegova tema su ljudi u pe jz a \u017eima otu\u0111enja. Prona\u0161ao je
  svoju duhovnu o\u0161 tricu u poez iji otu\u0111enih pre dela, u kojima grani\u010dne
  situa cije postaju neizbe\u017ene, a junake sud bina vodi ka prelomnim \u017eivot
  nim tre nucima.\\\"\\n\\nNjegovi kas niji filmovi do\u017eiveli su komer cijalni
  neuspeh, a i kritika ih je na jve\u0107im delom ot pis ala. Pri jatelji gos pod
  ina Roblsa opadanje njegove kreat ivne mo\u0107i prip isuju al ko hol izmu i povre
  menim de presijama. Tokom ovog peri oda o\u017eenio se po zor i\u0161nom glumi com
  Anom Leng don. Ubrzo je do\u0161lo do raskida, pro pra\u0107enog odv rat nim naslovima
  u brit anskim tabloidima, a na kraju su se i razveli.\\n\\nIza njega je ostala njegova
  tre\u0107a supruga, Loren Hartke, bodi artist.\\n\\nPOGLAVLJE 2\\n\\nDan je beo
  i obavijen izmaglicom, a put se uzdi\u017ee ka sas u\u0161enom nebu. Na sever vode
  \u010detiri trake, a ti vozi\u0161 tre\u0107om i auto mobili su i pred tobom i iza
  tebe i s obe strane, mada ih nema pre vi\u0161e niti su preter ano blizu. Kad stigne\u0161
  do vrha padine, ne\u0161to se dogodi i automobili po\u010dinju da se kre\u0107u
  bez \u017eurbe, kao da i nemaju motore, glatko klize po ravnoj povr\u0161ini. Sve
  je usporeno i magli\u010dasto i sas u\u0161eno, a re\u010d izgled ati u sredi\u0161tu
  je svega \u0161to se doga\u0111a. Svi auto mobili, uklju\u010duju\u0107i i tvoj
  izgledaju kao da plove u nepovez anim kret njama, odaju utisak ili deluju na odre\u0111en
  na\u010din, a put juri dalje uz belo zujanje.\\n\\nA onda to raspo lo\u017eenje
  nestane. Vra\u0107aju se buka i jurnjava i zamagljen ost i ti klizne\u0161 natrag
  u svoj \u017eivot, s bolnim bremenom na grudima.\\n\\nO tim danima razmi\u0161l
  jala je kao o prvim danima posle pov ratka.\\n\\nTokom prvih dana posle pov ratka
  ob novila je zalihe hrane u ostavi i poprskala dez in fek cionim sred stvom plo\u010dice
  u ku patilu. Ostava je bila pove lika, tamna, ples niva prost or ija pored kuh inje
  i u njoj nije bilo po trebe za ob navl jan jem zaliha hrane. O\u010distila je i
  na pun ila hranilice za ptice, da tako ob likuje dan oko jedne ist in ski va\u017ene
  stvari, sa svim prate\u0107im neravn i n ama i vijugama, sa skupom uskovitlanih
  var i jacija. Poprskala je plo\u010dice i por celan hemi kali jom s mir i som borov
  ine, gotovo u\u017eivaju\u0107i u njenim is par enjima. Ugovor o zakupu tre balo
  je da va\u017ei jo\u0161 dva meseca. Ku\u0107u su za k upili na \u0161est meseci,
  a sada je preo stalo dva. Jedna osoba, dva meseca. Upo tre bila je bocu s raspr\u0161iva\u010dem
  u obliku pi\u0161tolja.\\n\\nOs e\u0107ala se kao kod ku\u0107e, u ovom zdanju,
  i jurila je kroz dane ispun jene neodoljivom ru tinom, istovetne dane, izdeljene
  i organizovane kao u nekak vom sim ul tanom ko trl janju, li\u0161ene sredi\u0161ta,
  katkad s beli n ama na po jedinim mes tima, dane koji su se kretali tako sporo da
  je to naprosto bolelo.\\n\\nPogledala je u stranice na kojima je radila za jedno
  s Rejom, u tu njegovu usranu auto bi o grafiju. Le\u017eale su od\u0161tam pane,
  bez za \u0161tite izlo\u017eene njenom do\u017eivl jaju njegovih se\u0107anja, te
  tap iser ije sa\u010din jene od la\u017ei i izmi\u0161l jot ina, od pri\u010da stvorenih
  iz o\u010da janja \u010dije joj poreklo nije uvek bilo jasno. Pre\u0161la je rukama
  preko njegove ode\u0107e u ormaru u spava\u0107oj sobi. Nije bila od onih koje se
  slamaju pri pogledu na stvari zaostale posle ne\u010dije smrti, pa je ode\u0107u
  odlo\u017eila u jednu kutiju, da je preda onima kojima \u0107e biti po trebna.\\n\\nKada
  je si\u0161la niz ste penice, os etila je njegovo prisustvo u prost or ijama na
  drugom spratu. \u010cesto se \u0161unjao tim prost or i jama i go vorio u mali dikta
  fon, lica obavijenog dimom, izgo v arao je ideje za neki zamorni scen ario, na men
  jene nekom piscu, negde, \u010dijeg imena nikako nije us pevao da se seti. Sada
  je i on, Rej, postao dim, ono ne\u0161to u vazduhu, \u0161to se kao para pre ili
  kas nije uvu\u010de u svaku pukotinu, bez ob li\u010dja, ali s licem koje odnekud
  kao da je bilo deo \u010ditave te pojave, svojstveno samo tom \u010doveku koji se
  nekada \u0161unjao tuda.\\n\\nPopela se uz ste penice, os lu\u0161kuju\u0107i zvuk
  koji stvara osoba koja se penje uz ste penice, i kada je stigla do odmor i\u0161ta,
  dotakla je hrastovinu od koje je bio na\u010din jen pot porni stub.\\n\\nU redu
  je. \u017delela je da bude tu i s njom \u0107e biti sve u redu. \u010citavo tra
  janje nji ho vog braka, sve vreme koje su \u017eiveli za jedno, pro\u017eiveli su
  upravo ovde.\\n\\nSvoje telo os e\u0107ala je nekako druga\u010dije na na\u010din
  koji nije us pevala da shvati. Napeto, sapeto, nije ba\u0161 ta\u010dno znala. Nekako
  tu\u0111e i nepoznato. Druga\u010dije, prozirnije, sasvim sve jedno kako.\\n\\nNa
  jednoj od polica u ostavi le\u017eala je kutija s mr vicama hleba. Znala je da je
  negde videla sjajni papir, u nekoj kutiji plave i jo\u0161 neke boje. Te su stvari
  sada bile va\u017ene. Obedi, zadaci, sitni poslovi.\\n\\nLagano je pro\u0161la kroz
  sobe. Os e\u0107ala ga je iza sebe dok se svla\u010dila, dok je bosa sta jala na
  hlad nom podu, odba civala po hab ani d\u017eem per, i umalo se nije okrenula prema
  kre vetu.\\n\\nPrvih dana posle pov ratka, jednom pri likom je iza\u0161la iz auto
  mobila i umalo se nije ones vest ila - nije to bio onaj pot puni slom svih zn a\u010dajnih
  funk cija, ve\u0107 nezn atno, be spo mo\u0107no po tonu\u0107e ka tlu, nekako kao
  da je za boravila kako se stoji.\\n\\nPom is lila je da pri premi sebi kotlet, svesna
  da je sama, gotovo kao da je gledala sebe sa ruba prost or ije ili kao da je sta
  jala ta\u010dno tu gde je sta jala i bila to \u0161to jeste a pritom gledala malu
  le lu javu sebe negde u vazduhu, i mis lila da je ve\u0107 sutra.\\n\\nPo\u017eelela
  je da i\u0161\u010dezne u Re jovom dimu, da umre, da postane on, a onda je po cepala
  sjajni papir du\u017e nazup\u010dene ivice pakovanja i posegnula za kuti jom mrvica
  hleba.\\n\\nKada je tele fon za zvo nio, nije ga pogledala onako kako to \u010dine
  u filmovima. Stvarni ljudi ne gledaju u tele fone koji zvone.\\n\\nPapir se odvojio
  od rolne uz jedno ra falno ra-ta-tat, krenuv\u0161i ka recka voj ivici kutije, i
  njoj se u\u010dini da \u010duje taj zvuk du\u017e \u010ditave ki\u010dme.\\n\\nOduvek
  je u razmi\u0161l janjima strem ila u sut ra\u0161nji dan. Svoje dane planir ala
  je un apred. Sedela je u sobi sa brod skim podom. Sta jala je u kadi i prskala visoko
  po plo\u010dicama na zidovima sve dok aroma borov ine pome\u0161ana sa za dahom
  kiseline i etera nije po\u010dela da je savla dava. S mukom se nat er ala da prestane
  da prit iska obara\u010d boce sa spre jom.\\n\\nOpekla je ruku o tiganj i odmah
  krenula ka fri\u017ei deru ali nije bilo leda u onom jebenom. Za boravila je da
  napuni to jebeno za led.\\n\\nKad tele fon zvoni, \u010dovek podigne slu\u0161alicu
  ili je ne podigne. Slu\u0161ala ga je kako zvoni. Zvon java se orila kroz ku\u0107u,
  sve slu\u0161alice zveckale su na svojim postoljima.\\n\\nKako joj se savr\u0161eno
  \u010dudno odjed nom u\u010dinilo to \u0161to velike kor poracije masovno pro iz
  vode mrvice hleba i pakuju ih i prodaju svuda po svetu, tako da je prvi put zaista
  pogledala tu kutiju s mr vicama, prvi put je zaista videla i shvat ila \u0161ta
  je u njoj, a to behu mrvice hleba.\\n\\nSedela je u sobi s brod skim podom i pok
  u\u0161avala da \u010dita. Najpre \u0107e za lo\u017eiti vatru. Ta prost or ija
  bila je ambi ciozno pro jektovana za \u010da\u0161icu kon jaka i vatru, pro ma\u0161ena
  soba, a ona je pila \u010daj i pok u\u0161avala da \u010dita knjigu. No, uspe\u0107e
  ona da se probije do kraja te stranice, da bi se potom ravnodu\u0161no zagledala
  u pred mete okovane u prostoru.\\n\\nPrvih dana po pov ratku pojela je neku \u0161koljku
  prispelu pravo iz pakla i potom provela neko liko uza stopnih sati tr\u010dka raju\u0107i
  do toaleta. Ako ni\u0161ta drugo, time je bar ponovo stekla svoje telo. Malo \u0161ta
  mo\u017ee tako da sjedini telo i du\u0161u, pom is lila je, kao pomahnit ali proliv.\\n\\nPopela
  se uz ste penice, i pritom kao da je nekako \u010dula sebe iz drugih delova ku\u0107e.\\n\\nSvukla
  je po hab ani d\u017eem per. Izvukla je jednu ruku iz d\u017eem pera i \u0161akom
  lako dotakla ne\u0161to iznad sebe, i za p it ala se \u0161ta je to, premda joj
  se to doga\u0111alo i ranije, a onda se setila vise\u0107e svetiljke, rasklimatanog
  metal nog aba\u017eura, svetiljke koja je bila pot puno po gre\u0161no odabrana
  za tu sobu, pa se okrenula prema kre vetu i pogledala, gotovo da je pogledala, nije
  pogledala s i\u0161\u010dekivan jem ve\u0107 nekako druga\u010dije - sa smis lom
  tako tanu\u0161nim da nije mogla ni da ga pojmi.\\n\\nBilo je tu suvi\u0161e stvari
  koje je tre balo shvat iti, a na kraju kra jeva ipak je bila samo jedna.\\n\\nU
  gradu je videla jednu se dokosu \u017eenu, Ja panku, koja je sama stajala na ka
  menoj stazi pred svojom ku\u0107om. Dr\u017eala je u ruci crevo za polivanje i sta
  jala je kao bez te\u017eine pod sve ni\u017eim nebom, ravna i nepom i\u010dna kao
  papir za uvi janje pok lona, i za livala leju jarko cr venog pla menca, iz \u0161mrka
  su izbi jale sitne kapi.\\n\\nStvari koje je videla de lo vale su joj sum njivo
  - ne ba\u0161 sum njivo, ve\u0107 neprekidno pro men ljivo, kao uron jene u preo
  bra\u017eaj, svaka stvar istovre meno je bila i ne\u0161to drugo, ali \u0161ta,
  i \u0161ta.\\n\\nPo\u010dela je da odgo v ara na tele fon ske pozive. Isprva se
  javl jala ne\u017enim glasom, koji nije bio ba\u0161 sasvim njen, iz men jenim i
  opreznim tu\u0111im glasom, go v or ila halo, ko je to, da. Ve\u0107 se bio proneo
  glas da je tu, i pozivi su stiz ali iz Nju jorka, gde je \u017eivela, i od pri jatelja
  i kolega iz drugih gradova. Zvali su iz tih gradova da joj ka\u017eu kako im nije
  jasno za\u0161to se vrat ila tu. Bilo je to posled nje mesto gde bi trebalo da bude,
  sama u ve likoj ku\u0107i na pustoj obali, a ona je kor a\u010dala kroz sobe i pela
  se uz ste penice i planir ala dane un apred zbog toga \u0161to je bivalo sve vi\u0161e
  stvari koje je tre balo obaviti za sve manje vremena dok je svetlost sve br\u017ee
  uzm icala. Pogleda\u0161 i ve\u0107 je mrak, svaki put neo\u010dekivano.\\n\\nUsta
  jala je rano svakog jutra i to je bio na jgori tren u tak, taj prvi ubistveni \u010dasak
  le\u017eanja u kre vetu i se\u0107anja na ne\u0161to i u istom dahu svesti o tome
  \u0161ta je to.\\n\\nZvali su je pet do \u0161est puta dnevno a potom malo manje
  i ona je mis lila na tu Ja panku, lepu i za gon etnu, ako je uop\u0161te i bila
  Ja panka, koja je za livala ba\u0161tu dok je nebo na javljivalo ki\u0161u.\\n\\nStarim
  metal nim tra jek tom odvezla se do Litl Muna, gde je mogla jedino da pro\u0161eta
  blat nja vom stazom do drugog kraja ostrva pored vetrom \u0161ibanih ku\u0107a i
  crkve kojoj je ne dosta jao zvonik, u \u010detrde setminut nom mar\u0161u do napu\u0161te
  nog zanat skog centra, izrada prekriva\u010da i mo\u017eda drvoreza uz neizbe\u017enu
  grn\u010dariju, a posle toga odse\u010dnim korakom natrag. Tra jekt je vozio prema
  utvr\u0111enom rasporedu i to je bio dovol jan razlog da se s vremena na vreme pre
  veze njime.\\n\\nPlan joj se svodio na to da nekako or gan izuje vreme dok ne po\u010dne
  ponovo da \u017eivi.\\n\\nPosle tih prvih dana po pov ratku, po\u010dela je da radi
  ve\u017ebe dis anja. Tre balo je nastaviti rad na telu, re\u017eim ma\u010djeg pro
  tez anja i sis tematskog izvi janja. Us meravala se od ki\u010dme prema spol ja\u0161n
  jem delu, kretala se po podu \u010det voro no\u0161ke, i os e\u0107ala kako joj
  se aorta gr\u010di pri svakom naletu krvi.\\n\\nDubila je na glavi i istez ala vrat.
  Plazila je jezik i dahtala u ta\u010dno odmerenim razmacima, merenim iznutra, pre
  cizno\u0161\u0107u koju je ose\u0107ala u kos tima razdvo jenim diskovima koji su
  joj radili ta-ta-ra-ta du\u017e ki\u010dme.\\n\\nAli svet u njoj bio je izgubljen.\\n\\nNo\u0107u
  je nebo bilo vrlo blizu, \u0161irilo se u zvezdanom dimu i kataklizmama, ali ga
  ona nije do\u017eivl javala kao nekada, kao produ\u017eenje du\u0161e, bezglasno
  \u010dudo u grlu, kao ne\u0161to \u0161to je izvan jezika \u017eivelo u najiskon
  skijem delu njenog bi\u0107a.\\n\\nPre stala je da slu\u0161a vre mensku pro gnozu.
  Pri hvatala je vreme kakvo bi nai\u0161lo, hladnu ki\u0161u i vet ro vite dane i
  golemo zgrbljeno kamenje na zel enim pad i n ama, nalik na grbove prastarih brat
  stava, kamenje u kome su treper ili svetlost oluje i pri\u010de i vreme. Cepala
  je drva za pot palu. Pro vodila je sate pred ekranom ra\u010dun ara gledaju\u0107i
  video-snimak u\u017eivo sa nekog dvos mer nog puta u jednom gradu u Fin skoj. U
  Kotki, u Fin skoj, bio je mrkli mrak, a ona je gledala u ekran. To joj je bilo zan
  im ljivo zato \u0161to se de\u0161avalo u tom tren utku, dok je ona tu sedela, i
  zato \u0161to se de\u0161avalo dvade set \u010detiri \u010dasa na dan, bez lica,
  auto mobili su ulazili u Kotku i izlazili iz nje, a u peri odima mrtvila video se
  samo prazan put. Ti peri odi mrtvila bili su najbolji.\\n\\nSedela je i gledala
  u ekran. Tome nije mogla da odoli, po\u0161to je bilo dovoljno stvarno da bi se
  moglo odupreti \u010din jen ici da se ni\u0161ta ne doga\u0111a. \u010cak je i posta
  jalo mo\u0107n ije upravo za hvaljuju\u0107i tome. U Kotki je bilo tri sata ujutro
  i ona je \u010dekala da pro\u0111e neki auto mobil - ne pitaju\u0107i se pri tom
  ko bi mogao biti u njemu. Bila je to jed nostavno Kotka kao \u010din jen ica. Bio
  je to ose\u0107aj or ganizovanosti, jedno mesto uhva\u0107eno u \u010dvrstom ramu,
  takvo kakvo jeste i kakvo se videlo, sa ispis anim lokal nim vre menom na di git
  al nom dis pleju u uglu ekrana. Kotka je pred stavl jala drugi svet ali ona je taj
  svet mogla videti u svoj njego voj stvarnosti, s njegovim satima, minu tima i sekun
  dama.\\n\\nZam i\u0161l jala je kako neko mo\u017eda mas tur bira uz taj prizor,
  pojavu auto mobila na putu prema Kotki u gluvo doba no\u0107i. Po\u017eelela je
  da se nas meje na tu pom isao. Cepala je drva za pot palu. Svakoga dana odva jala
  je vreme za veb-kameru iz Kotke. Nije shvatala smisao te po trebe, ali ju je pri
  hvatala kao \u010din plutaju\u0107e poez ije. Na jbolji su bili peri odi mrtvila.
  Oni bi joj o\u010distili um i po mogli da oseti duboku ti\u0161inu drugih mesta,
  tajnu pos mat ranja nekog mesta na drugom kraju sveta, u kome ne postoji vi\u0161e
  ni\u0161ta osim autop uta koji pri lazi i odlazi, pri \u010demu se obe te stvarnosti
  odi gravaju istovre meno, i bro jeva koji se smen juju na di git al nom dis pleju
  s nekom \u010dudnom i pot mu lom neu mit no\u0161\u0107u, sekunde napre duju prema
  minutu, minuti se penju ka satu, i ona je sedela i gledala, \u010dekaju\u0107i da
  neki auto mobil poprimi svoj nestalni oblik na tom autop utu.\\n\\nPozvala ju je
  Mar ijela, pri jateljica, spisateljica iz Nju jorka. \u201eJesi li dobro?\\\"\\n\\n\u201e\u0160ta
  bi tre balo da ka\u017eem?\\\"\\n\\n\u201eNe znam. Ali, jesi li usam ljena?\\\"\\n\\n\u201eTre
  balo bi da postoji neka druga re\u010d za to. Svi su usam ljeni. Ovo je ne\u0161to
  drugo.\\\"\\n\\n\u201eAli zar ne misli\u0161. Ne znam. Bilo bi lak\u0161e.\\\"\\n\\n\u201eOvakav
  razgo vor tre balo bi da vodi\u0161 s nekim drugim. Ja ne znam kako se vode ovakvi
  razgo vori.\\\"\\n\\n\u201eNe valja ti \u0161to se osam ljuje\u0161. Tre balo bi
  da se ok ru\u017ei\u0161 pozn atim ljudima i stvar ima. Samo\u0107a ne valja. Znam
  \u0161ta si os e\u0107ala prema njemu. I koliko je sna\u017eno to bilo. Bo\u017ee.
  Ali ne treba sada da se za t vori\u0161 u sebe. Znam i da si od lu\u010dna. Na svoj
  usporeni na\u010din, ti si osoba sna\u017ene volje. Samo, mora\u0161 da nastoji\u0161
  da iza\u0111e\u0161 iz ovoga, a ne da os ta je\u0161 u tome. Ne za tva raj se u
  sebe.\\\"\\n\\n\u201eReci mi \u0161ta ti radi\u0161.\\\"\\n\\n\u201eHranim svoje
  lice. Gledam kroz prozor\\\", re\u010de Mar ijela. \u201eRazgo varam s tobom.\\\"\\n\\n\u201e\u0160ta
  jede\u0161?\\\"\\n\\n\u201eSirovu \u0161ar garepu.\\\"\\n\\n\u201eTime ne hrani\u0161
  lice.\\\"\\n\\n\u201eTime izglad njujem telo. Znam. U Film forumu prikazuju neke
  njegove star ije filmove. Ti ga nisi poznavala toliko dugo. To bi moglo biti po
  voljna okolnost.\\\"\\n\\nSlede\u0107eg jutra \u010dula je onaj \u0161um. Bio je
  raza zn atljiv isto onako kao kada ga je prvi put primetila, pre ot pri like tri
  meseca, kada se zajedno s Rejom popela na sprat da provere \u0161ta je to. On je
  rekao da je to ver ovatno neka za lutala vever ica ili rakun. Ona je smat rala da
  je re\u010d o un apred planir anoj kra\u0111i. \u010cinilo joj se da taj \u0161um
  ne poti\u010de ni od kakve \u017eivot inje. U njemu je bilo ne\u010deg gotovo sasvim
  li\u010dnog, kao da je tu ne\u0161to \u0161to di\u0161e vazduh koji mi di\u0161emo
  i kre\u0107e se onako kako se mi kre\u0107emo. Taj \u0161um je de lovao tako, kao
  da neko telo razmi\u010de prostor pred sobom, ali kada su pogledali nije bilo nikoga.\\n\\nOvoga
  puta kada ga je \u010dula zatekla se u kuh inji. Popela se uz stepenice ponev\u0161i
  \u010daj. Sobe na kraju pred soblja na drugom spratu. Mra\u010dni tre\u0107i sprat,
  s pregore lim si jalicama i gotovo bez name\u0161taja. Kratko ste pen i\u0161te
  do kupole. Za vir ila je u tu nepom i\u010dnu ti\u0161inu, okre\u0107u\u0107i glavu,
  pro turiv\u0161i gornji deo tela u kupolu koja je, po\u0161to je bila prili\u010dno
  pros trana, kor i\u0161\u0107ena za odlaganje stvari. U tren utku kada se obrela
  na podu kupole, \u010daj joj je ve\u0107 bio hladan. Pre tur ila je rukama po staroj
  ode\u0107i poslaganoj u kar ton ske kutije i preg ledala ve\u0107 pomalo sas u\u0161ena
  dok u menta u ko\u017enim fas cik lama. Bila je tu i jedna pun jena sova, kao i
  ve\u0107i broj neuram ljenih ak varela, do brano izvitoperenih. Tik kraj pro zora
  ugledala je jedan list kako treperi. Bio je to maleni list boje \u0107ilibara koji
  je podrhtavao na vetru ispod grane drveta koja se pru\u017eala preko krova. Nije
  se videla nit neke larve na kojoj je list mogao da visi, niti vlakno kakve gra\u0111e
  iz pti\u010dijeg gnezda. Samo list koji se okretao u vazduhu.\\n\\nProna\u0161la
  ga je slede\u0107eg dana u maloj spava\u0107oj sobi kraj velike prazne prost or
  ije u samom dnu pred soblja na tre\u0107em spratu. Bio je omalen i sk ladno gra\u0111en
  pa je isprva pom is lila da je u pit anju dete, \u017eu\u0107kastocr vene kose i
  tek probu\u0111eno iz dubokog sna, a mo\u017eda i pod utica jem nekih lekova.\\n\\nSedeo
  je na rubu postelje, u donjem rublju. U prvih neko liko sekundi pom is lila je kako
  je on zapravo bio neizbe\u017ean. Vrat ila se kroz vreme do najran ijih nagov e\u0161taja
  da u ku\u0107i nekoga ima i stigla do ovog tren utka, nepo gre\u0161ivo, sa pot
  puno sre\u0111enim i uredno zabele\u017eenim opa\u017eajima.\\n\\nPOGLAVLJE 3\\n\\nGledala
  je u njega.\\n\\n\u201eRecite mi. Koliko ste dugo ovde?\\\"\\n\\nOvaj ne podi\u017ee
  glavu. Odavao je tako \u010dud novat utisak da se njoj u\u010dinilo da su joj re\u010di
  za stale nasred sobe, pre d vidljive i banalne. Nije os e\u0107ala strah. De lovao
  joj je nekako kao naho\u010de - izgubljeno pa na\u0111eno - a ona je, po svoj pri
  lici, bila nalaza\u010d.\\n\\n\u201eVi ste ovde\\\", po\u010de ona, govore\u0107i
  razgov etno, prave\u0107i pauze izme\u0111u re\u010di.\\n\\nOn je pogleda i sada
  joj se u\u010dini da je star iji, i to nezn atno pod iz anje glave, jed nostavno
  pom er anje brade i o\u010diju, na neki pre fin jen na\u010din odi gralo je klju\u010dnu
  ulogu u tom preo bra\u017eaju - bio je star iji i odnekud kao vla\u017ean, s nekak
  vim sjajem preko \u010dela i obraza.\\n\\nOn je ne\u0161to rekao.\\n\\nKazala je:
  \u201eMolim?\\\"\\n\\nNjegovo donje rublje sastojalo se od belih bok ser s kih ga\u0107a
  i prev elike majice s kratkim rukavima, i ona ga odmeri od glave do pete, sasvim
  otvoreno, du\u017e \u010dita vog tela.\\n\\n\u201e\u0422\u043e nije da mo\u017ee\\\",
  re\u010de on.\\n\\n\u201eAli \u0161ta \u0107ete vi ovde? I jeste li ve\u0107 dugo
  tu?\\\"\\n\\nOborio je glavu i izgledalo je kao da razmi\u0161lja o tome, kao da
  razmatra de talje nekog slo\u017eenog prob lema.\\n\\nSta jali su ispred ku\u0107e
  blizu vrha zelene padine i pos mat rali jedan \u010damac lovaca na rakove kako se
  probija kroz penu talasa. Pre toga dala mu je os tatke supe sa malo hleba, i komad
  tosta. Onu napravu tre balo je prit is nuti dva puta da bi se tost val jano is pekao.\\n\\n\u201e\u0160ta
  vidite?\\\", up it ala ga je, pokaza v\u0161i prema brodu i sve bli\u017eim oblacima.\\n\\n\u201ePone\u0161to
  od toga je drve\u0107e\\\", re\u010de on.\\n\\n\u201ePovija se. Nji\u0161e se na
  vetru. Ono su breze. Ono belo. One tamo zovu se pa pirne breze.\u201c\\n\\n\u201eOne
  bele.\\\"\\n\\n\u201e\u0422\u0435 bele. Ali tamo dalje od pnog drve\u0107a.\\\"\\n\\n\u201eDalje
  od onog drve\u0107a.\\\"\\n\\n\u201eTamo preko\\\", re\u010de ona.\\n\\nOn se na
  kratko zagleda.\\n\\n\u201ePala je velika ki\u0161a.\\\"\\n\\n\u201ePada\u0107e
  ki\u0161a. Pa\u0161\u0107e ki\u0161a\\\", re\u010de ona.\\n\\nNosio je vet ro vku
  i rad ni\u010dke pan talone i de lovao je nekako nesre\u0107no. Pok u\u0161ala je
  da bude uporna u nastojanju da od njega ne\u0161to sazna. Bila joj je zan im ljiva
  ta odsut nost, to za sta jkivanje u govoru i kret njama, to pri rodno ste\u010deno
  svojstvo, njegova prividna nebriga za to \u0161ta \u0107e se s njim desiti. Nije
  to apatija ili ravnodu\u0161nost, pom is lila je, ve\u0107 njegova ogran i\u010dena
  sposob nost da razmo tri posledice. Nije uspevala da shvati \u0161ta je to za njega
  zn a\u010dilo, to \u0161to je prona\u0111en u tu\u0111oj ku\u0107i.\\n\\nVetar post
  ade ja\u010di i oni mu okrenu\u0161e le\u0111a. Za bavl jala ju je pom isao da je
  on tu mo\u017eda dospeo iz sajber-prost ora, da je neko ko se u gluvo doba no\u0107i
  po ja vio iz njenog ra\u010dun ara. Pot i cao je iz Kotke, u Fin skoj.\\n\\nOna
  re\u010de: \u201eNije padala ki\u0161a. Tek \u0107e padati.\\\"\\n\\nKroz prostor
  se kretao s nekom nela go dom, i unutra i na polju, kao da su u vazduhu posto jale
  kriv ine i vijuge.\\n\\nPos mat rala ga je kako se u\u0161un java u ku\u0107u, pomalo
  vuku\u0107i noge.\\n\\nKao da se bojao da ne poleti. Nije mogla da skine pogled
  s njega.\\n\\nUvek je posto jalo neko \u201ekao da\\\". U\u010dinio je ovo ili ono
  kao da. Bio joj je po tre ban pred met pore\u0111enja da bi ga nekako odredila.\\n\\nSedeli
  su u sumornoj sobi s brod skim podom ispod re produk cija jedren jaka. Tele fon
  je zvonio. On je gledao nagorele klade polegle u kaminu, a ona ga je pos mat rala.
  Knjige na ni\u017eim pol icama bile su uglavnom letnja lit er atura kakvu \u010dovek
  pronalazi u izna jm ljenim ku\u0107ama, knjige podesne za tu ulogu, s izblede lim
  kor icama sa slikama nekih drugih ku\u0107a iz nekih drugih leta, ili godi\u0161n
  jaci, ili atlasi, a vrhove onih vi\u0161ih knjiga oivi\u010davao je tanki zrak sunca.\\n\\nBrada
  mu je bila uvu\u010dena, duboko uvu\u010dena, \u0161to je njego vom licu davalo
  nekako ne dovr\u0161en izgled, dok mu je kos\u0430 bila \u010dvrsta i o\u0161tra,
  ovde-onde is pre pletana u \u017ebun ove.\\n\\nMorala je sna\u017eno da se usred
  sredi da bi za pazila te crte. Pogledala ga je, a onda je morala jo\u0161 jednom
  da ga pogleda. U njego vom liku bilo je ne\u010deg neuhvatljivog, iz \u010dasa u
  \u010das, nekakve tananosti u telesnom nas tupu.\\n\\n\u201eHajde da razgo v aramo\\\",
  pro\u0161aputala je.\\n\\nOn je sedeo ne spretno prekr\u0161tenih nogu, jedna nogavica
  mu se pela uz potkolen icu, a primetila je i da je jednu \u010darapu pri vrhu privezao
  kana pom, da mu ne bi spadala. To ju je pod setilo na nekoga.\\n\\n\u201eHajde da
  razgo v aramo. Ja razgo v aram\\\", re\u010de on.\\n\\nNjoj se u\u010dini da je
  shvat ila \u0161ta je \u017eeleo da ka\u017ee. Bilo je u njego vom tonu neke uz
  a lud nosti, nekog be skon a\u010dnog naprez anja, \u0161to je nagov e\u0161tavalo
  da postoje stvari koje on ne mo\u017ee lako da joj razjasni, ma koliko go vorio.
  \u010cinilo se da se napor ose\u0107a \u010dak i u njegovim gestovima. Znala je
  da \u0107e morati da poziva tele fonom bol nice i klinike, psi hi jat rijske us
  tan ove, da se raspituje da li je nekome nestao pa cijent.\\n\\nKi\u0161a je po\u010dela
  da udara o pro zore po jed in a\u010dnim udarcima i rafalima, sitnim a brojivim,
  a onda je zasula sve, tuku\u0107i po krovu zatvorenog trema i pune\u0107i oluke,
  a njih dvoje su sedeli i slu\u0161ali.\\n\\nUp it ala je: \u201eKako vam je ime?\\\"\\n\\nOn
  ju je gledao.\\n\\nOna re\u010de: \u201eDo\u0161la sam ovamo da bih bila sama. Ovo
  mi je veoma va\u017eno. Spremna sam i da sa\u010dekam. Pru\u017ei\u0107u vam pri
  liku da mi ka\u017eete ko ste. Ali ne \u017eelim nikoga u ku\u0107i. Pru\u017ei\u0107u
  vam pri liku\\\", re\u010de. \u201eAli ne\u0107u be skon a\u010dno da \u010dekam.\\\"\\n\\nNije
  \u017eelela da to za zvu\u010di kao form alno upo zorenje, ali ver ovatno jeste
  zvu\u010dalo tako. Mora\u0107e da pozove na jbli\u017ee uto\u010di\u0161te za besku\u0107nike,
  koje ne\u0107e biti nimalo blizu, a mo\u017eda i crkvu u gradu ili onu crkvu bez
  zvonika u Litl Munu i mora\u0107e da sa\u010deka poli ciju, na kraju, ako ni\u0161ta
  drugo ne uspe.\\n\\n\u201eDo\u0161la sam ovamo zbog Reja, koji mi je bio mu\u017e,
  i koji je umro. Ne znam zbog \u010dega vam to go v orim po\u0161to je to svakako
  nepo trebno. Ali, po trebno mi je da neko vreme ovde pro\u017eivim sama. Samo mi
  recite da li shvatate.\\\"\\n\\nMahnuo je rukom kao da je \u017eeleo da ka\u017ee
  da ne mora ni\u0161ta vi\u0161e da mu govori. Nara vno da je shva tio. Ali mo\u017eda
  i nije.\\n\\nNa polju je vit lala oluja i oni su sedeli i slu\u0161ali. Ki\u0161a
  je bila tako sveprisutna da su morali da je slu\u0161aju. Mogla je da pozove agenta
  za nekret nine i da se po\u017eali da joj je neka osoba upala u ku\u0107u. I to
  je mogla da u\u010dini.\\n\\nBilo je jo\u0161 jutro, a imala je ose\u0107aj da je
  on tu ve\u0107 \u010ditavu nedelju. Sedeli su i gledali u no\u0107a\u0161nju vatru.\\n\\nTada
  se setila na koga ju je taj \u010dovek pod se tio.\\n\\nPod se tio u je na nastavnika
  bio lo gije iz sred nje \u0161kole, prili\u010dno nespret nog \u010doveka, \u010dija
  je kosa pod slabijim svetlom de lovala izbledelo, dok se pod ja\u010dim \u010dinilo
  da je \u0107elav, \u010doveka koji je jednom pri likom rasparani \u0161av na pan
  talonama za le pio lepljivom trakom i koji je u govoru pravio za stoje nepre d vidljive
  du\u017eine, zbog \u010dega se deo u\u010denika u njegovo ime ose\u0107ao nepri
  jatno, njih neko liko os etljivijih, dok su drugi, dakle svi ostali, posta jali
  otvoreno nedis cip linovani.\\n\\nNastavniku u \u010dast, nazvala je svog gosta
  gos podin Tatl. Pom is lila je da \u0107e joj to olak\u0161avati sus rete s njim.\\n\\nPro\u0161aputala
  je: \u201eRecite mi ne\u0161to.\\\"\\n\\nOn is pravi noge i ostade da sedi s rukama
  na kolen ima, Kao kroja\u010dka lutka u cr venoj fotelji, okrenut prema njoj.\\n\\n\u201eZnam
  koliko.\\\" Re\u010de: \u201eZnam koliko ova ku\u0107a. Sama pored mora.\\\"\\n\\nDe
  lovao je ne ba\u0161 sasvim sre\u0107no, no ipak nekako zado voljno, zado voljno
  u tehni\u010dkom smislu zbog toga \u0161to je uspeo da se izbori s tim posled njim
  nizom re\u010di. A ona je taj niz, po\u0161to ga je izgo vorio gospodin Tatl, \u010dula
  s nekim dubokim odjekom. Svega tri re\u010di. No te su je re\u010di postavile u
  \u010ditav skup me\u0111usobno suprot stavljenih ok ru\u017eenja, istovre menih
  un ut ra\u0161n josti i spol ja\u0161n josti. Ta ku\u0107a, bezobalno more pred
  njom, i to kako se re\u010d sama odnosila i na nju i na ku\u0107u i kako je re\u010d
  mora osna\u017eila ideju samo\u0107e a u isti mah nagov estila i en er gi\u010dno
  os lob a\u0111anje, mogu\u0107nost bek stva iz kn jigama pop lo\u010danih zidova
  vlasti tog bi\u0107a.\\n\\nZnala je da je glupo razmat rati tu re\u010den icu tako
  pomno. Izmi\u0161l jala je stvari. No on je na nju tako de lovao, kao \u0161to se
  \u0161unjao kroz re\u010den icu, pokazuju\u0107i svaku re\u010d u svim njenim vidovima
  i ob licima, svaka re\u010d bila je nalik na mesec u odre\u0111enoj meni.\\n\\nRekla
  je: \u201eDopada mi se ova ku\u0107a. Da, volim \u0161to sam ovde. Ali ku\u0107a
  je izna jm ljena. Izna jm ila sam je. Oti\u0107i \u0107u odavde kroz \u0161est-sedam
  nedelja. Mo\u017eda i manje. Mi smo je izna jmili. Pet-\u0161est nedelja. Manje\\\",
  re\u010de.\\n\\nSada nije gledala u njega. Gledala je u svoje nad lanice, razmaknutih
  prstiju, gledala i razmi\u0161l jala, prise\u0107ala se tren u taka s Rejom, zapravo
  ne tren u taka ve\u0107 odse\u010daka vremena, ili tren u taka koji su se ulivali
  u sve op\u0161te vreme, u erot iku pogleda i dodira, pa je jednu zgr\u010denu \u0161aku
  pri grlila drugom, u telu je os e\u0107ala kako joj on nedostaje i os e\u0107ala
  je kako je sek su alno i be skon a\u010dno usam ljena i gledala je u ta\u010dke
  na kojima su joj se zglavci presi javali, obe skr vljeni od njenog stiska.\\n\\nOn
  re\u010de: \u201eAli nisi oti\u0161la.\\\"\\n\\nOna ga pogleda.\\n\\n\u201eOti\u0107i
  \u0107u. Kroz neko liko nedelja. Kad do\u0111e vreme\\\", rekla je. \u201eKad istekne
  zakup. Ili pre toga. Oti\u0107i \u0107u.\\\"\\n\\n\u201eAli ne ide\u0161\\\", re\u010de
  on.\\n\\nOvo pre b a civanje iz pro\u0161 log u sada\u0161nje vreme za zvu\u010dalo
  je kao da je u me\u0111uvre menu ne\u0161to pre vladano, neka prepreka ili ogran
  i\u010denje. Morao je veoma da se po trudi da bi to izgo vorio. Povrh toga, \u010dula
  je ne\u0161to u njego vom glasu. Nije znala \u0161ta, ali to ju je nat er alo da
  ustane i pri\u0111e pro zoru.\\n\\nZa stala je i zagledala se u ki\u0161u. Pom is
  lila je kako je taj \u010dovek mo\u017eda dospeo tu iz jedne od onih kamp-prikolica
  ra\u0161trkanih po rubu \u0161ume nado mak grada, ob li\u017enjih a sasvim dale
  kih, s nepokret nim auto mobilima i pokojim slu\u0111enim psetom koje, gr\u010de\u0107i
  se u pra\u0161ini i opalom li\u0161\u0107u, pok u\u0161ava da dohvati neko mesto
  koje ga svrbi, a ovaj \u010dovek je ne\u010diji odrasli sin koji je oduvek bio takav,
  nepris tupa\u010dan, oduvek za v isan od drugih, oduvek pri rodno zato\u010den u
  jednoj pra vougaonoj kutiji sa svojim sparu\u0161enim i ostare lim rod iteljima,
  koji nikada ne zovu jedno drugo po imenu, a on ponekad nestane na neko liko dana
  i krene kud krene, sve tako mrm l jaju\u0107i, i ostaje neozle\u0111en u tom uskovit
  lanom svetu.\\n\\nA mo\u017eda i ne, pom is lila je. Nije to ono \u0161to je \u010dula
  u njego vom glasu. Bilo je tu ne\u010deg sa samog ruba, ne\u010deg \u0161to nije
  imalo veze s vis inom pri hoda ili glagol skim vre men ima ili onim \u0161to su
  njegovi rod itelji gledali na tele v iz iji.\\n\\nOkrenula se od pro zora i uspela
  da ga navede da bar malo pro go- vori. U\u010dinilo se da mu se pom isao o razgo
  voru i dopala. Po\u010deo je da govori o pred me tima u sobi, zamuck uju\u0107i,
  i ona se pitala \u0161ta je on to video, ili nije uspeo da vidi, ili je pak video
  na toliko raz li\u010dit na\u010din da ona nije mogla ni da poku\u0161a da doku\u010di
  kon ture pred meta o kome je bilo re\u010di.\\n\\n\u010covek je go vorio. Posle
  neko liko tren u taka po\u010dela je da razume re\u010di koje je slu\u0161ala. Za
  to je bilo po trebno mnogo nivoa per cep cije. Bile su po trebne \u010ditave so
  ciois tor ijske studije o tome kako ljudi slu\u0161aju druge ljude. U njego vom
  glasu bilo je ne\u010deg sasvim osobenog, neke odlike koja se razvi jala dok je
  go vorio, tako da je mogla da je is prati do samog njenog ishodi\u0161ta.\\n\\nPos
  mat rala ga je. Bio je to onaj isti nes re\u0107nik s kojim se sus rela ne\u0161to
  ranije, i na njemu se nije moglo primetiti da je svestan utiska koji os tavlja.\\n\\nNije
  to bilo ba\u0161 pravo opona\u0161anje, ali \u010dula je neke ele mente sopstvenog
  glasa, onaj naglo skra\u0107eni iskaz, lako zu janje duboko u grlu, \u010dula je
  svoju visinu glasa, svoj ton, a kako je isprva bilo te\u0161ko, bezmalo nestvarno,
  raza znati sop stveni glas kako dopire od nekog drugog, od njega, i kako se duboko
  uznemir ila od toga.\\n\\nIsprva nije bila sig urna da je to njen glas. A onda je
  postala sig urna. Desilo se to u tren utku kada je ve\u0107 bio prestao da govori
  o stol icama, svetiljkama, ili \u0161arama na par ketu. Sada je izgledalo kao da
  preuzima njenu ulogu u razgo voru s nekim.\\n\\nPok u\u0161avala je da shvati njegove
  re\u010di.\\n\\nDok je go vorio, pravio je pokrete, re\u010di je pro pra\u0107ao
  ma han jem rukom, i ona po\u010de da shvata da su to re\u010di koje je ona izgo
  v arala u razgo v or ima s Rejom, tu u toj ku\u0107i, te iste ili sli\u010dne re\u010di.
  Behu to rut inske na po mene o tome kako je tele fonom razgo v arala s pri jateljima
  koji su na javili posetu. Se\u0107ala se, ne jasno se pris etila da je ona tada
  sta jala u pod no\u017eju ste pen i\u0161ta a da je on, da je Rej, bio na drugom
  spratu i \u0161etao tamo-amo, rade\u0107i na scen ariju.\\n\\nSada je ponovo sta
  jala kraj pro zora. Glas je po\u010deo da treperi i zamire ali se ruka i dalje kretala,
  prate\u0107i sve slabiji ritam.\\n\\nZgrabila je kaput s ve\u0161alice i iza\u0161la
  na ki\u0161u. Kaput je pre b a cila preko ruke, a ruku podigla iznad glave, i preko
  travn jaka oti\u0161la do blat nja vog pri laznog puta, gde joj je bio parkiran
  auto mobil. Vrata su bila otklju\u010dana i ona je u\u0161la unutra i sela jer za\u0161to
  biste za klju\u010davali vrata na jednom tako sam ot nom mestu. Ki\u0161a je za
  sip ala vet robransko staklo u nale tima koji su se me\u0111usobno sus tiz ali.
  Sela je, obuz eta kratkim nas tupom drhtavice, i s mukom nastojala da se oslobodi
  utiska da \u010duje zvuk tog glasa. Jedan od pro zora na zad njim vratima bio je
  nezn atno spu\u0161ten, pa su se miris mokrog travn jaka, opojni dah ki\u0161e u
  pri rodi, uz nemali udeo mora i povetarca i se\u0107anja me\u0161ali u vazduhu,
  ali ona je i dalje \u010dula taj glas i videla onaj pokret rukom, tako nepo gre\u0161ivo
  Rejov, s dva spo jena prsta koji se nji\u0161u u vazduhu.\\n\\nNije znala koliko
  je vremena provela tu. Mo\u017eda prili\u010dno dugo. Ki\u0161a je sna\u017eno udarala
  o krov i haubu. Koliko vremena je dugo? To se mo\u017ee shvat iti i ovako i onako.
  Na kraju je sna\u017eno gurnula vrata i vratila se u ku\u0107u, dr\u017ee\u0107i
  kaput nad glavom.\\n\\nPOGLAVLJE 4\\n\\nNa hrani lici je sta jalo pet ptica, i sve
  su bile le\u0111ima okren ute hrani i na istovetan na\u010din nepom i\u010dne. Pos
  mat rala ih je. Nisu toliko gledale ili slu\u0161ale, koliko su os e\u0107ale ne\u0161to,
  napete i na\u010duljene.\\n\\nSve su te re\u010di po gre\u0161ne, pom isli ona.\\n\\nHranilica
  je visila ispred za tvorenog trema, a ona je sedela u toj prete\u017eno beloj sobi,
  kraj \u0161irokog pro zora, i \u010dekala gos pod ina Tatla. Postavl jala je hranilice
  otkako se vrat ila. To je odre\u0111ivalo os novni raspon njene ne posredne okoline,
  \u0161irinu pri rode kojom je ku\u0107a bila ok ru\u017eena. Imala je ose\u0107aj,
  me\u0111u tim, da hrani sve ptice ovog sveta, raz li\u010di tim se menom za svaku
  posudu, ponekad bi se dve vrste semena, svetlo i tamno, na\u0161le u istoj hrani
  lici, i ptice bi do\u0161le i kljucale, ili ne bi, a hranilice su tako\u0111e bile
  raz li\u010dite, kavezi, cilindri s prsten jem, vise\u0107i tanjiri, poslu\u017eavn
  ici na stalkovima, a mo\u017eda, ona to nije znala, mo\u017eda ptice ponekad ne
  smeju da do\u0111u zbog sokola, ili kakve kreje koja podra\u017eava sokola, ili
  zato \u0161to pro\u010ditaju neku poruku u doga\u0111aju koji se odigra izvan spek
  tra vidljivog.\\n\\nKada je u\u0161ao, nije pogledao u nju, ve\u0107 je oti\u0161ao
  pravo do stola sa staklenom plo\u010dom i povijenim nogama.\\n\\nRejov dikta fon
  le\u017eao je nasred stola i svetlu cao.\\n\\nSela je i po\u010dela da govori, opisuju\u0107i
  njegov izgled. Lice i kosa i tako dalje. Budan ili ne. Prili\u010dno uredan ili
  uglavnom za pu\u0161ten. \u0160ta jo\u0161? Dobra, lo\u0161a ili sasvim obi\u010dna
  no\u0107.\\n\\nS tim \u0161to ona nije znala kave su ina\u010de njegove no\u0107i.
  Jedna jedina no\u0107. Nije mogla da zaspi, pa je posle pono\u0107i neko vreme presta
  jala pred njegovim vratima, os lu\u0161kuju\u0107i \u0161i\u0161tave naza lne udisaje,
  odnekud na \u010dudan na\u010din po tresena. Gledaj. Pokriv eno telo koje slaba\u0161no
  otku cava. Eto \u0161ta ose\u0107a\u0161, dok pos mat ra\u0161 to uti\u0161ano i
  ranjivo telo, koje bi moglo biti bilo \u010dije, ili le\u017ei\u0161 kraj svog mu\u017ea
  posle ljubavnog \u010dina i udi\u0161e\u0161 vrelinu njegovih ok rut nih snova i
  pita\u0161 se ko je on, ne\u017eno prom i\u0161l ja\u0161 istinu koju nikada ne\u0107e\u0161
  dok u\u010diti, jer to je tajna koju san \u010duva u svojim nervnim du bi n ama,
  u svojim stadiju mima, slojevima i na bor ima.\\n\\nOvoga jutra go v or ila je o
  njego vom imenu, ili bar pok u\u0161avala da govori. \u010cinili su to za jedno,
  po\u010din jali i prekid ali. No \u0161to su vi\u0161e go v orili - malo bi pro
  go v or ili pa bi pro menili temu i ona bi isklju\u010dila dikta fon pa bi ga ponovo
  uklju\u010dila a mo\u017eda on i jeste imao ime, ali ga je zabora vio ili izgu bio
  i nije us pevao da ga se seti.\\n\\nOna re\u010de: \u201e\u0408\u0430 sam Loren.\\\"\\n\\nIzgo
  v or ila je to neko liko puta, pokazuju\u0107i na sebe, po\u0161to je pom is lila
  da bi za oboje bilo dobro da on po\u010dne da je os lov l java imenom.\\n\\nRe\u010de
  mu: \u201eKad bi ti imao ime. Hajde da pret postavimo. Postoji li iko ko bi mogao
  da zna to ime? Gde ti je majka? Kad ka\u017eem majka, mislim \u017eena koja ra\u0111a
  dete, rod itelj, \u017eenski rod itelj, mo\u017ee li ta re\u010d? Reci. Molim?\\\"\\n\\nZnao
  je kako se zovu stol ica i prozor i zid, ali ne i dikta fon, premda je umeo da ga
  isklju\u010di, a nije znao, \u010dinilo se, ni ko mu je majka ili gde bi je bilo
  mogu\u0107e prona\u0107i.\\n\\n\u201eAko go v ori\u0161 neki drugi jezik\\\", re\u010de
  mu, \u201eka\u017ei mi neke re\u010di.\\\"\\n\\n\u201eKa\u017ei mi neke re\u010di.\\\"\\n\\n\u201eKa\u017ei
  mi neke re\u010di. Nije va\u017eno ako ih ne\u0107u ra zu meti.\\\"\\n\\n\u201eKa\u017ei
  mi neke re\u0107i da ka\u017eem neke re\u010di.\\\"\\n\\n\u201eDobro. Onda budi
  zen-u\u010ditelj, ti mala suk lato. Otkud zna\u0161 \u0161ta sam go v or ila svom
  mu\u017eu? Gde si bio? Jesi li bio negde ovde, i slu\u0161ao? Moj glas. Tako je
  zvu\u010dalo, od re\u010di do re\u010di. Pri\u010daj mi o tome.\\\"\\n\\nKada je
  u razgo voru do\u0161lo do za stoja, dikta fon je prestao da zuji. Ona ga je pos
  mat rala. Pok u\u0161ala je da ga natera da joj ne\u0161to ka\u017ee o tome, ali
  nije uspela, pa je ponovo pro menila temu.\\n\\n\u201e\u0160ta si to hteo da ka\u017ee\u0161
  ju\u010de kada si rekao, kada mi se u\u010dinilo da si rekao, kako ono be\u0161e?
  Ne se\u0107am se ta\u010dno re\u010di. Bilo je to ju\u010de. Dan pre nego danas.
  Rekao si da \u0107u ostati ovde, \u010dini mi se, i kada zakup. Se\u0107a\u0161
  li se toga? Kad bude vreme da odem. Rekao si da ne\u0107u.\\\"\\n\\n\u201eRekao
  sam \u0161ta sam rekao.\\\"\\n\\n\u201eRekao si to. Da ti nekako.\\\"\\n\\n\u201eNekako.
  \u0160ta je nekako?\\\"\\n\\n\u201eUmukni. Da ti nekako, ali nema veze. Kad istekne
  zakup. Ili ne\u0161to sasvim drugo.\\\"\\n\\nIsklju\u010dio je dikta fon. Ona ga
  je uklju\u010dila, on ga je isklju\u010dio. Jednostavno je radoznao, pom is lila
  je, ili se igra, onako bez cilja. Ali je os e\u0107ala da bi ga rado udar ila. Ne,
  nije. Nije znala \u0161ta ose\u0107a. Bilo je vreme da po\u010dne da poziva bol
  nice i druge us tan ove. To je os e\u0107ala. Poo davno je ve\u0107 bilo vreme za
  to i po gre\u0161ila je \u0161to se nije raspit ala, \u0161to g\u0430 nije odvela
  nekoj osobi od autor iteta, nekom lekaru ili up rav itelju, nekoj \u010dasnoj sestri
  koja vodi uto\u010di\u0161te za ometene u razvoju, ljubaznoj i sposob noj, ali znala
  je da to ne\u0107e u\u010din iti.\\n\\nProvela je jedan sat u im provi zovanoj radnoj
  sobi na drugom spratu, bele\u017ee\u0107i odabrane re\u010denice sa trake koju je
  sn im ila za jedno s njim.\\n\\n\u010cula je sebe kako izgo v ara: \u201e\u0408\u0430
  sam Loren\\\", kao kakav u crni triko odeveni lik iz nau\u010dnofant asti\u010dnog
  filma.\\n\\nNa kraju joj je doprlo do svesti. Po\u010dela je da shvata da je on
  slu\u0161ao njen glas sa trake. U nekom tren utku u pro\u0161losti, pre no \u0161to
  je ona ubacila praznu traku, on je prit is nuo dugme za re produkovanje i \u010duo
  njen razgo vor s Rejom, koji je bio na drugom spratu s dikta fonom u ruci, i snimao
  ideje za scen ario.\\n\\nTako je on uspeo da re produkuje njen glas.\\n\\nA onaj
  pokret rukom? Taj pokret rukom je odba cila. Pokret je bio slu\u010da jan, plod
  sticaja okolnosti, a delom i njena sop stvena izmi\u0161l jotina.\\n\\nOs etila
  se bolje.\\n\\nDanima je pre dano iscrpljivala svoje telo. Uvek je bilo stanja koja
  je tre balo dose\u0107i da bi se nad ma\u0161ile dot ada\u0161nje kra jnosti. Mogla
  je svaku radnju da dovede do neizdr\u017eljive kra jnosti, mereno dahom ili snagom
  ili vre menskim tra jan jem ili snagom volje, i da potom odlu\u010di da pomeri gran
  icu.\\n\\nImam utisak da stvara\u0161 svoju sop stvenu malu to tal it arnu za jed
  nicu, rekao joj je Rej jednom pri likom, u kojoj si ti i diktator, ali i pot la\u010deni
  narod, rekao joj je, mo\u017eda i s di vljen jem, kao umet nik umet niku.\\n\\nNjen
  rad na vlastitom telu \u010dinio je sve sasvim o\u010digled nim. Stvari je videla
  jasno i isto tako mis lila o njima, \u0161to je moglo da zna\u010di i samo to da
  je bilo malo toga \u0161to je tre balo videti i ne mnogo vi\u0161e onoga o \u010demu
  je vre delo razmi\u0161l jati. No mo\u017eda je to i\u0161lo i dublje, te poze koje
  je za uz i m ala i dugo os ta jala u njima, spir alna prete r ivanja, zmi jo liki
  oblici i po lo\u017eaji klonu log cveta, peri odi sis tem ati\u010dnog dis anja
  kao u molitvi, \u017eivota svedenog na na j manju mogu\u0107u meru, na golo dis
  anje. Najpre di\u0161e\u0161, pa onda dah\u0107e\u0161, i na kraju hvata\u0161 vazduh.
  Od toga bi joj se telo napregnulo, o\u010di iskola\u010dile, ar ter ije isko\u010dile
  na vratu, od tih dugih sati dis anja tako neizbe\u017enog i apsurd nog da je na
  kraju iz toga izlazila oz ar ena nekom novom svetlo\u0161\u0107u, pro\u017eeta sve\u0161\u0107u
  o tome \u0161ta zna\u010di \u017eiveti.\\n\\nPo\u010dela je da ve\u017eba naga u
  hlad noj sobi. Radila je svoje pregibe na golom podu, i svoja istez anja kar lice,
  koja su istovre meno bila i ironi\u010dno i ist in ski erot i\u010dna, i svoja usporena
  ponavl janja svakod nevnih pokreta, bacanja pogleda na ru\u010dni sat ili okretanja
  radi zaustavl janja tak sija, radnji koje se me han i\u010dki izvode u druga\u010dijem
  kon cep tu al nom okviru, ponovljenih mnogo puta i to svaki put sve spor ije, sa
  zaprepa\u0161\u0107eno otvorenim ustima i \u010dvrsto za tvorenim o\u010dima pred
  tom tako prolaznom sve\u0161\u0107u.\\n\\nPozvala ju je Iza bela, Rejova prva \u017eena.\\n\\n\u201eNa
  sahrani jedva da smo porazgo v arale. Znam da si me pomalo izbegavala, \u0161to
  ra zumem, veruj mi, i \u0161to mogu da pri hvatim. Prihvatam i to \u0161to je on
  u\u010dinio, po\u0161to ga znam od pamt iveka. Ali za tebe to nije isto. Krivo mi
  je \u0161to nismo porazgo v arale. God i n ama sam ose\u0107ala da \u0107e se to
  desiti. To je moralo da se desi. Svi smo to znali o njemu. God i n ama se spremao
  da to u\u010dini. Nosio je to sa sobom. To je bio njegov na\u010din da ode. Nije
  on bio o\u010da jnik. Tu stvar je nosio u sebi kao svestan plan. Kao trik za koji
  je znao da \u0107e mo\u0107i da ga izvede kad mu zatreba. \u010cak se postarao i
  da ga zateknem u fotelji.\\\"\\n\\n\u201eAli, zar ti ne shvata\u0161?\\\"\\n\\n\u201eNemoj,
  molim te. Ko shvata, ako ne ja? Bio je nemogu\u0107 \u010dovek. Jo\u0161 od Pariza
  bio je tako nepri jatan. Bili smo u braku skoro jedan aest godina. Pro\u0161la sam
  s njim stvari o kojima bolje da ne po\u010din jem da ti go v orim. Nemoj da misli\u0161
  da te ne \u0161tedim. Nastojim da te po\u0161tedim svega. \u0160to se ti\u010de
  tog \u010doveka, nije to bilo pit anje hernije u njego vom mozgu. On je bio to \u0161to
  je bio. Ako \u0107emo iskreno, ti nisi ni imala vremena da to shvati\u0161. Jer
  evo, da ti ne\u0161to ka\u017eem. Bili smo dvoje ljudi s jednim \u017eivo tom, a
  taj \u017eivot bio je njegov. Ostala sam uz njega sve dok mi to nije uni\u0161tilo
  zdravlje, i jo\u0161 pla\u0107am za to. Morala sam da odem usred no\u0107i. \u0160ta
  misli\u0161, za\u0161to? Pretio je da \u0107e me ubiti. A evo u ovoj sobi gde sada
  stojim, gledam u prazno mesto na kome je stajala ta fotelja. Sta jala je tu \u010ditav
  dan pre no \u0161to su mi je uk lonili s o\u010diju i odneli je foren zi\u010daru,
  s njego vom krvlju i dobro, da ti ne pri\u010dam sa \u010dime sve jo\u0161, radi
  dokaza. Dobro, kupi\u0107u novu fotelju. Nema problema. U me\u0111uvre menu, tu
  zjapi prazan prostor. Nara vno da je hteo da te po\u0161tedi tog tren utka. Zato
  je do\u0161ao u Nju jork i seo u moju fotelju.\\\"\\n\\n\u201eFotelja je bila tvoja?
  Je li i pi\u0161tolj bio tvoj? \u010ciji je pi\u0161tolj upo tre bio?\\\"\\n\\n\u201e\u0160ta
  pri\u010da\u0161, kakav moj pi\u0161tolj? Eto, ni to nisi znala. On je oduvek imao
  pi\u0161tolj. Svuda gde je \u017eiveo, imao je pi\u0161tolj. Ovakav ili onakav.
  Nisam ih bro jala.\\\"\\n\\n\u201eNe. Zar ne shvata\u0161? Ne \u017eelim to da slu\u0161am.\\\"\\n\\n\u201eAli
  ja \u017eelim to da ka\u017eem. Re\u0161ena sam da to ka\u017eem. Taj \u010dovek
  je mrzeo sebe. Jer, koliko ga dugo ja znam, a koliko dugo ga ti poznaje\u0161? Ja
  njega nisam napust ila? Jesam li ga ikad napust ila? Jesmo li bili stvarno razvedeni?
  Poznavala sam ga i u snu. I znam ta\u010dno kako je razmi\u0161l jao. Rekao je sebi
  dve stvari. Ovu \u017eenu znam od pamtiveka. I mo\u017eda mi ne\u0107e zamer iti
  zbog nereda.\\\"\\n\\nOti\u0161la je da po tra\u017ei gos pod ina Tatla. Nije imala
  pojma kuda je odlazio ili \u0161ta je radio onda kada joj nije bio pred o\u010dima.
  Za nju je on vi\u0161e smisla imao dok je spavao, ili \u010dak u njenoj ma\u0161ti,
  nego dok je za stolom sedeo nas pram nje, lako iskola\u010denih o\u010diju. S na
  porom ga je o\u017eivl javala u mis lima, makar i samo na tren, u na jkrhki joj
  pretpostavci, kao siluetu kraj pro zora u pra\u0161n ja vom svetlu.\\n\\nZa stala
  je u pred soblju i viknula: \u201eGde si?\\\"\\n\\nTe no\u0107i sedeli su u sobi
  s brod skim podom i ona mu je iz jedne knjige \u010ditala o ljud skom telu. Bilo
  je tu fo to grafija krvnih zrnaca uve\u0107anih mnogo hil jada puta, a u jednom
  delu teksta bilo je re\u010di o bio lo giji ra\u0111anja i ona mu je \u010ditala
  upravo taj deo, po lagano, i pri tom ubacivala sop stvena za pa\u017eanja, postavl
  jala pit anja, pijuck ala \u010daj, da bi posle nekih \u010detrde set minuta, dok
  je \u010ditala odel jak o em bri onu, duga\u010dkom jedan cen ti metar i po topljenom
  u telesnu te\u010dnost, shvat ila da joj se on obra\u0107a.\\n\\nGlas koji je \u010dula,
  me\u0111u tim, bio je Rejov glas. Podra\u017eavanje je bilo prili\u010dno verno,
  onaj nagla sak i otegnuti sam oglas nici, one sasvim li\u010dne os oben osti, artiku
  la cije koje stvara samo jedan glasovni aparat i nijedan drugi, odlike koje je poznavala
  u Re jovom glasu, i samo Rejovom, i zato nije bila u stanju da podigne pogled ka
  njemu, ve\u0107 je nastavila da zuri u knjigu.\\n\\nPok u\u0161ala je da se usred
  sredi na pomno slu\u0161anje. Naredila je sebi da slu\u0161a. Ruka joj je jo\u0161
  bila u vazduhu, po\u0161to mu je pokazivala koliki je em brion, odme riv\u0161i
  du\u017einu palcem i ka\u017ei prstom.\\n\\nPrat ila je njegov iskaz, re\u010d po
  re\u010d, ali je morala da mu po tra\u017ei kontekst. Govor je bio nepovezan i za
  petl jan. Go vorio je o markama cigar eta, ple jers i \u017eitan, za kemel bih pe\u0161a\u010dio
  \u010ditavu milju, i tu je \u010dula Rejov smeh, zvonki prasak Re jovog smeha, jasan
  i is prekidan, smeh koji nije dopirao iz dikta fona.\\n\\nObra\u0107ao se njoj,
  a ne nekom scen ar isti iz Rima ili Los An \u0111e lesa. Bio je to Rej koji je,
  u svojoj ulozi neodoljivog fa tal iste, pre pri\u010davao is toriju svoje za v is
  nosti od nikot ina, u kojoj je ona usput \u010dula i svoje ime, i bilo je to prvi
  put da ga je gos podin Tatl izgo vorio.\\n\\nNije to bilo op\u0161tenje s poko jnikom.
  Bio je to \u017eivi Rej u razgo voru koji je vodio s njom, u ovoj prost or iji,
  nedugo nakon nji ho vog doseljenja. Bila je uver ena u to, se\u0107ala se kako su
  se popeli uz ste penice i predali se no\u0107i pre punoj mahnitih os e\u0107anja,
  uskovit lanog seksa, ispovesti i krhkog sna, a te su ispovesti bile zaveti me\u0111usob
  nog pover enja, ne ras tere\u0107enja od krivice ve\u0107 potvrde pover enja, uglavnom
  njegove i podstaknute dubokom po tre bom, a onda opet sanjivi seks, dvoje ljudi
  koji prolaze jedno kroz drugo, lako i vazdu\u0161asto kao kapljice mora, i tada
  joj je rekao kako mu ona poma\u017ee da pov rati du\u0161u.\\n\\nSve je to bilo
  tek beli sjaj, ledeni treptaj se\u0107anja, a onda su se za\u010dule same te re\u010di,
  Rejove re\u010di, iz usta \u010doveka koji je sedeo na fotelji kraj nje.\\n\\n\u201eZa
  hvaljuju\u0107i tebi ja ponovo po\u010din jem da vladam sobom. Sada razmi\u0161l
  jam kao pravi ja, ne kao ono \u0161to sam u me\u0111uvre menu postao. Jedem i spavam
  kao pravi ja, lo\u0161, i to jeste lo\u0161e, ali to sam ja kakav sam bio dok sam
  bio ja, a ne onaj drugi.\\\"\\n\\nPos mat rala ga je, tu glavu i telo kao iz crtanog
  filma - bezbradog, vre tenas tog trupa, ali je i takav umeo da o\u017eivi njenog
  mu\u017ea u vazduhu koji mu je iz plu\u0107a navirao u glasne \u017eice - vazduh
  u glasove, glasovi u re\u010di, re\u010di u \u010doveka, vero dosto jno uob li\u010denog
  na njegovim usnama i jeziku.\\n\\nOna pro\u0161aputa: \u201e\u0160ta to radi\u0161?\\\"\\n\\n\u201eRadim.
  To tako ono. Ne\u0161to ka\u017eem.\\\"\\n\\n\u201eJesi li ikada? Gledaj u mene.
  Jesi li ikada razgo v arao s Rejom? Ovako kako mi sada razgo v aramo.\\\"\\n\\n\u201eMi
  sada razgo v aramo.\\\"\\n\\n\u201eDa. Ka\u017ee\u0161 li da? Reci da. Kada si ga
  upoznao?\\\"\\n\\n\u201eUpoznao gde je bio.\\\"\\n\\n\u201eOnda i sada. Da li to
  ho\u0107e\u0161 da ka\u017ee\u0161? Jesi li stajao ispred sobe i slu\u0161ao na\u0161
  razgo vor? Kad ka\u017eem Rej, zna\u0161 li na koga mislim? Razgo v arali u sobi.
  On i ja.\\\"\\n\\nPustio je da mu se telo pomeri, s jedne na drugu stranu, me hani\u010dkim
  pokre tom, jedno tik i jedno tak, kao da je prva ig ra\u010dka s pokretnim de lovima
  ikad na\u010din jena.\\n\\nNije znala \u0161ta da misli o tome. Bilo je u tom tren
  utku ne\u010deg bolnog, nalik na otvorenu ranu. To ju je ogol javalo do stvari koje
  su bile izvan njenog iskustva ali su istovre meno, nekako, bile od ogrom nog zna\u010daja.\\n\\nNekako.
  \u0160ta to zna\u010di nekako?\\n\\nPostavl jala mu je pit anja i on je go vorio
  svojim glasom, koji je bio piskav i tanak i za robljen u glagol skim vre men ima
  i prom e nama re\u010di, u ot pevanim glagol skim prom e nama, i ona post ade svesna
  da upravo ob ja\u0161n java njegove re\u010di nekoj tre\u0107oj osobi na koju je
  u tom \u010dasu mis lila, mo\u017eda svojoj pri jateljici Mar ijeli, razlo\u017enoj,
  pouzdanoj, sposob noj da posavetuje, pozn atoj po iskren osti, premda je posesivno
  slu\u0161ala svaku re\u010d koju je taj \u010dovek izgo v arao.\\n\\nPo\u010dela
  je da nosi dikta fon svuda sa sobom. Bio je mali i lagan i mogao je lako da joj
  stane u d\u017eep na grudima. Nosila je flanel ske pan talone sa za tvorenim d\u017ee
  povima. Nosila je gumene \u010dizme i satima je hodala obodom slanih mo\u010dvara
  i posred za boravljenih puteva i slu\u0161ala gos pod ina Tatla.\\n\\nGledala je
  svoje lice u ogledalu u ku patilu i pok u\u0161avala da shvati za\u0161to izgleda
  druga\u010dije od tog istog lica kada ga gleda tamo dole, u ve likom ogledalu u
  pred soblju, mada to uop\u0161te ne bi tre balo da bude te\u0161ko shvat iti, pom
  is lila je, po\u0161to lica uvek i svuda izgledaju raz li\u010dito, u za v is nosti
  od stot ina svakod nevnih prom ena, ali ipak, pom isli, za\u0161to izgledam druga\u010dije?\\n\\nNije
  ga odvela u grad zato \u0161to je posto jala mogu\u0107nost da ga neko tamo poznaje
  i zato \u0161to on nikada, bar koliko je ona znala, nije svo jevoljno izlazio iz
  ku\u0107e, a ona nije htela da mu name\u0107e iskustvo koje bi ga moglo prestrav
  iti, ali je vi\u0161e od svega \u017eelela da spre\u010di da ga drugi vide.\\n\\nNo
  ipak ga je povela sa sobom u veliki trgov a\u010dki centar, kroz te\u0161ki auto
  mobil ski dim i gusti sao bra\u0107aj, a u\u010dinila je to onako kako ljudi \u010dine
  stvari koje su \u010dud nije od svega \u0161to su do tada smat rali \u010dudnim,
  in stinkt ivno, da bi se ras teretila po trebe da u\u010dini ne\u0161to prenagljeno,
  a mo\u017eda pomalo i sam o\u017eivo, da bi videla stvari njegovim o\u010dima, svet
  u geo met rijskim ob licima, ure\u0111en po \u0161ablonu i uredno poslagan, i duge
  gon dole pre pune raznih pro iz voda i kupce koji ple\u0161u kao u transu i sve
  drugo \u0161to bi moglo privu\u0107i njegovu pa\u017enju a \u0161to ona vi\u0161e
  nije umela da gleda.\\n\\nIpak, kada su stigli tamo, os tavila ga je privez anog
  sig urnos nim poja som i za klju\u010danog u auto mobilu dok je ona oti\u0161la
  u pro davnicu elektri\u010dnih aparata i sam o poslugu i pro davnicu cipela. Kupila
  mu je par cipela i neko liko pari \u010darapa. Kupila je prazne trake za dikta fon,
  kojih u gradu nije bilo, i vrat ila se do kola sa kesama punim namirnica sme\u0161tenim
  u sjajna kolica da bi ga zatekla kako sedi upi\u0161an i usran.\\n\\nMo\u017eda
  taj \u010dovek do\u017eivl java neku drugu vrstu stvarnosti u kojoj je on i ovde
  i tamo, i pre i posle, pa se izme\u0111u tih polova kre\u0107e teturavo, u stanju
  kolapsa, li\u0161en iden titeta, jezika, na\u010dina da u\u017eiva u ukusu medom
  premazanog par\u010deta tosta koji je jeo, pra\u0107en njenim pogledom.\\n\\nPom
  is lila je kako on mo\u017eda \u017eivi u nekoj vrsti vremena koje nije podlo\u017eno
  nara ciji. \u0160ta je jo\u0161 mis lila? Sedela je u gotovo praznoj radnoj sobi
  na drugom spratu i nije znala \u0161ta je jo\u0161 mis lila.\\n\\nSvakoga jutra
  razgo v arali su za staklenim stolom na za tvorenom tremu i ona je te razgovore
  sn im ala. Ta prost or ija nije imala gre janje, ali su udobno sedeli u nizu uza
  stopnih sun \u010danih dana, uz \u0161olje \u010daja od mente.\\n\\nSedeo je po
  grbljen, govore\u0107i prema aparatu, katkad i pravo u njega, kao da mu se obra\u0107a,
  kao da su tu samo njih dvojica, a kada bi naglo zastao, izme\u0111u delova re\u010den
  ica, usne bi nastavile da mu lako podrhtavaju, u jedva primet nom pokretu koji je
  pod se\u0107ao na stara\u010dku drhta vicu ili re fleks ili uzru janost.\\n\\n\u201eJesi
  li poznavao Reja? Zna\u0161 li na koga mislim kada ka\u017eem Rej?\\\" \u201e\u0422\u043e
  nije da mo\u017ee.\\\"\\n\\n\u201ePok u\u0161aj da odgo v ori\u0161. Molim te. Shvata\u0161
  koliko mi je to va\u017eno. Govori kao on. Reci ne\u0161to.\\\"\\n\\nI u na jjed
  nostavn ijem razgo voru postoji kod koji u\u010des nicima govori o tome \u0161ta
  se doga\u0111a mimo onoga \u0161to se mo\u017ee \u010duti. U nji hovim razgo v or
  ima toga nije bilo. Jedan takt je ne dosta jao. I bilo joj je te\u0161ko da odredi
  tempo. \u010cule su se samo nepri lago\u0111ene re\u010di. Gubila je kontakt s njim,
  pokatkad i in teresovanje, nije us pevala da odredi rit mi\u010dke in ter vale ili
  odse\u010dke vremena, \u010dak ni mrm l janje i pevuckanje, one \u010dujne pauze
  koje daju ritam re\u010den ici. Na njego vom licu nije bilo nikak vih reak cija
  na njene re\u010di, i to ju je silno ljutilo. Nije bilo gra dacija i nagla saka
  s jedne, i ravnomer nog tona s druge strane. Po\u010dela je da shvata da u nji hovim
  razgo v or ima ne postoji ose\u0107aj za vreme i da sve one ref er ence na nivou
  neizgovorenog, ono \u0161to \u010dovek koji govori na ho lan d skom mo\u017ee da
  prenese \u010doveku koji govori kin eski da sve to ovde izostaje.\\n\\n\u201ePrit
  isni to.\\\"\\n\\n\u201ePrit isni dugme. Ne, nemoj da prit is ne\u0161 dugme. To
  je dugme za prekid. Jesi li nas \u010duo u onoj sobi? Njega i mene. Kako razgo varamo.\\\"\\n\\nPo\u017eelela
  je da ga dotakne. Nikada ga nije dotakla, nije to ni pom islila, ili jeste jednom
  onako usput, mo\u017eda, dok ga je po ja som vezivala u sedi\u0161te u kolima, kada
  je imao na sebi neki d\u017eem per ili sako.\\n\\n\u201eZna\u0161 gde je bio. Pozna
  je\u0161 ga odranije. \u010cuo si ga kako razgo v ara sa mnom. Jesmo li te videli
  nas dvoje? Jesi li bio negde sakriven, tako da nismo mogli da te vidimo? Ra zume\u0161
  li re\u010d sakriven? Zna\u0161 njegov glas. Daj, da ga \u010dujem.\\\"\\n\\nZnala
  je, rekla je sebi da ona nije neurav note\u017eena \u017eena koja se sus re\u0107e
  sa osobom os etljivom na psi hi\u010dke sile, kadrom da joj omogu\u0107i kon takt
  sa poko jnim mu\u017eem.\\n\\nOvo je bilo ne\u0161to drugo.\\n\\nPos mat rala ga
  je. Kosa mu je danas izgledala kao posuta kredom. \u010cinilo se bezmalo kao da
  nije tu, na metar od nje. Nije znao kako da sebe odredi prema onome \u0161to mi
  nazivamo Sada. Uosta lom, \u0161ta je to? Sasvim je mogu\u0107e da tako ne\u0161to
  i ne postoji za one koji ga ne pri hvataju kao ne\u0161to sasvim pri rodno. Mo\u017eda
  je tre balo da porazgo vara s nekim fiz i\u010darem, s nekim, nije znala ta\u010dno
  s kim, ko bi joj rekao koji para metri tu vladaju. Mrzela je tu re\u010d. Kor istila
  ju je, ali nije znala \u0161ta zna\u010di, no ipak ju je kor istila. Ptice su mahnitale
  na hrani lici.\\n\\nPozvala je Mar ijelu i javila joj se tele fon ska sek ret ar
  ica. Sintetizovani glas rekao je: Molim / os tavite / po/ruku / \u0440\u043e/sle/
  zvu\u010d/nog / sig nala. Te re\u010di nisu bile izgovorene ve\u0107 ve\u0161ta\u010dki
  stvorene i bile su razdvo jene kratkim ali dubokim di men zi jama. Prekin ula je
  vezu pa ponovo pozvala, samo da bi jo\u0161 jednom \u010dula taj glas. Kako je \u010dudan
  bio taj is prekid ani ritam. Kao da je \u010ditav kvantni skok delio svake dve re\u010di.
  Prekin ula je vezu i ponovo pozvala. Druga\u010diji glas za svaku re\u010d. Sedam
  raz li\u010ditih glasova. Ne sedam raz li\u010ditih glasova, ve\u0107 jedan mu\u0161ki
  glas u sedam vre mens kih ciklusa. Mada ne ba\u0161 sasvim mu\u0161ki. A ni re\u010di
  nisu bile ba\u0161 sasvim re\u010di, ve\u0107 slo govi, a i to ne sasvim. Spust
  ila je slu\u0161alicu i ponovo pozvala.\\n\\nPro\u0161la je kroz dugi hodnik i uz
  ste penice se popela na tre\u0107i sprat, pa je pored praznih soba oti\u0161la do
  ku pat ila blizu suprot nog kraja. Kada je ot vor ila vrata, on je sedeo u kadi.
  Nije po merio glavu, niti je re agovao na bilo koji drugi na\u010din. Sta jala je
  i gledala ga. U jednoj ruci je dr\u017eao sapun, a u drugoj ubrus za kupanje. Ostao
  je u tom polo\u017eaju, lako uzdignutih ruku, a ona ga je pos mat rala. Nije se
  okretao. Ruke su mu sasvim malo virile iz vode, komad sapuna, zgu\u017evani ubrus.
  Za sapun se u takvim pri likama obi\u010dno ka\u017ee \u201ekomad sapuna\\\". Pro\u0161aputala
  je: \u201ePogledaj me.\\\"\\n\\nKada je ovaj to i u\u010dinio, bez stida, ona je
  kleknula na kolena kraj kade i uzela mu sun\u0111er iz ruke. Pre\u0161la je njime
  od jednog do drugog njego vog ramena, a onda niz le\u0111a.\\n\\nOprala mu je i
  udubljenje ispod mi\u0161ke. To je pazuho, jedno pa drugo. Iz druge ruke mu je uzela
  sapun i pro trl jala ga o sun\u0111er, da bi mu potom oprala grudi i ruke, pri \u010demu
  mu je bez re\u010di go v or ila nazive delova njego vog tela. Ne\u017eno je po lo\u017eila
  na vodu ubrus, koji se tu potk lobu\u010dio i po tonuo, a zatim je po\u010dela da
  mu pod vodom trlja stomak sa punom, lenjim pokre tima, lagano kru\u017ee\u0107i
  rukom oko njego- vog pupka. Potom se nag nula preko njega da bi stavila sapun u
  posudu za sapun, taj komad sapuna, sve vreme gledaju\u0107i u njega, pa je spust
  ila ruku u vodu i pre vukla njome preko njego vog penisa, evo ga, pa je uhvat ila
  i pro trl jala testise, tako je davala imena delovima njego vog tela i preb ro javala
  ih, jedan-dva, i usne mu se oz ari\u0161e jedva primet nim vla\u017enim sjajem.\\n\\nRuka
  mu je izronila iz vode dr\u017ee\u0107i ubrus. Ona mu ga uze i ra\u0161iri ga preko
  svog lica, utisnu ga u pore i pre\u0111e njime preko usana, pa mu ga vrati. Dotakla
  mu je lice, lako obraslo mal jama, da li se brije i ko ga je tome nau\u010dio, prstom
  mu je pre\u0161la preko usta, prate\u0107i oblik usana. Is prat ila je i oblik nosa
  i obrva i u\u0161ne \u0161koljke i njene vijugave un ut ra\u0161nje povr\u0161ine.
  Jedno pa drugo. Jedno je vodilo drugom. Nije \u017eivnuo pod njenim dod irom, ako
  i jeste bilo je to tek rut in ski, pa je pom is lila kako njemu ni\u0161ta ne mo\u017ee
  izgled ati neo bi\u010dno, niti zaprepa\u0161\u0107uju\u0107e, niti pod stica jno,
  nas pram \u010din jenice, ili ne jasne ideje, \u0161to god da je to bilo - nas pram
  pren er a\u017een osti zbog toga \u0161to je uop\u0161te tu.\\n\\nOs etila je ne\u0161to
  tanko u uglu usana, napola unutra a napola izvan, ne\u0161to \u0161to je moglo biti
  jedino dlaka. Uhvat ila ju je i otrla palcem, vlas kose iz ubrusa, i onda je vi\u0161e
  nije os e\u0107ala na licu i pogledala je u njega pa u svoju \u0161aku i mo\u017eda
  ju je to samo ne\u0161to bilo zas vrbelo.\\n\\nPotom se kroz hodnik vrat ila natrag
  i nara vno nije imala ose\u0107aj kao da je ok upala kakvo dete, a ipak nije on
  ba\u0161 sasvim bio ni mu\u0161karac, no opet, eto \u0161ta je bio, mimo tog lakog
  nji hanja ili/ili, i ona je nastavila da pronalazi de talje o kojima je vre delo
  razmi\u0161l jati, naglas se za\u010dudila njego vom na\u010dinu kor i\u0161\u0107enja
  ubrusa za kupanje, koji je delovao kao zn a\u010da jan napre dak, i branila je sebe
  zbog svog pos tupka, i razmi\u0161l jala je o svojoj reak ciji na kret nje rukom
  preko njego vog tela dok je prelazila kilo metre hodaju\u0107i kroz pustare obrasle
  grm ljem borovn ica, kroz nisko pole glu maglu, za kop\u010danog kaputa i uz neprest
  ano okretanje trake u dikta fonu.\\n\\n\u201eKako si mogao da \u017eivi\u0161 ovde
  a da ja to ne znam?\\\" \u201eAli zna\u0161. Ja \u017eivim.\\\"\\n\\nPri tome se
  gotovo lupio po obrazu, \u0161to je mo\u017eda bilo nekakva mala \u0161ala.\\n\\n\u201eAli
  pre toga. \u010cula sam neke \u0161umove i onda sam te prona\u0161la u onoj sobi
  gore. Koliko si ve\u0107 dugo ovde? Pri\u010daj u ovo.\\\" \u201ePri\u010daj u ovo\\\",
  re\u010de on glasom koji je mogao biti i nes vesna im itacija\\n\\nnjenog.\\n\\nNalazila
  se u gradu, vozila je niz jednu malo nag nutu ulicu s drvenim ku\u0107ama, i ugledala
  \u010doveka kako sedi na svom tremu, videla ga je pred sobom, kroz granje i \u017ebunje,
  ra\u0161irenuh ruku, svetlokosog \u010doveka \u0161irokog lica, koji se odmarao.
  Os etila je u tom malenom odse\u010dku vremena, u toj ot pri like \u010detvrtini
  sekunde, da ga je sagledala u pot pun osti. Njegov se \u017eivot pot puno ot vorio
  pred njenim us put nim pogle dom. Lenj i spletkar enju sklon \u010dovek, u poslu
  s nekret ni n ama, u zgod noj ku\u0107ici pored nekog jezera opsedanog ko marcima.
  Shvat ila je ko je on. Videla je kroz njega. Sedeo je tamo, razveden, sklon pi\u0107u,
  emotivno otu\u0111en od svoje dece, svojih sinova, dvojice sinova, u \u0161kol skim
  uni form ama, shvat ila je u treptaju oka.\\n\\nNeki glas je \u010ditao vesti preko
  radija.\\n\\nKada je u auto mobilu pro\u0161la pored te ku\u0107e, u vre menu od
  jedne sekunde, shvat ila je da zapravo i nije videla \u010doveka koji sedi, ve\u0107
  kantu s bojom koja je sta jala na dasci os lon jenoj o dve sto lice. Ta belo-\u017euta
  kanta bila mu je lice, daska je pred stavl jala ruke, dok su duh i srce tog \u010doveka
  leb deli negde u vazduhu, ve\u0107 izgubljeni u glasu \u010dita\u010da vesti sa
  radija.\\n\\nPozvala je Mar ijelin broj i javila joj se tele fon ska sek ret ar
  ica. Odslu\u0161ala je snimak i prekin ula vezu, a onda je jo\u0161 jednom pozvala
  i prekin ula vezu. Tokom slede\u0107eg dana i do po lov ine onog posle njega, pozvala
  je jo\u0161 neko liko puta i od slu\u0161ala sn im ljeni glas ne ostaviv\u0161i
  poruku. Kada je ponovo pozvala i za\u010dula Mar ijelin glas, spustila je slu\u0161alicu,
  ne\u017eno, i neko vreme ostala pot puno nepom i\u010dna.\\n\\nRekla je: \u201ePri\u010daj
  kao on. U\u010dini to za mene. Znam da ti to mo\u017ee\u0161. Pri\u010daj kao on.
  Reci ne\u0161to za \u0161ta se se\u0107a\u0161 da je on rekao. Ili reci \u0161ta
  god ti padne na pamet. Bolje je tako. Reci \u0161ta god ti padne na pamet, samo
  da zvu\u010di kao on. Ne\u0107u te pitati otkud ti ta sposob nost. \u017delim samo
  da slu\u0161am. Pri\u010daj kao on. Budi kao on. Pro go vori njegovim glasom. Budi
  Rej. Daj da ga \u010dujem. Kad te lepo molim. Budi mi pri jatelj. Osoba u koju imamo
  pover enja, to je pri jatelj. U\u010dini mi to.\u201c\\n\\nDoletale su pravo na
  pre\u010dage, borile se za prostor kraj posudica s hranom, me\u0111usobno se klju
  cale, krila su im bru jala a grudi gorele na suncu bledim \u017earom, hrana im je
  is padala iz kljun ova. Odletale su i vra\u0107ale se, gotovo leb dele, devet, deset,
  jedan aest ptica, neke su se prib i jale uz pro zor sko okno, druge os ta jale na
  ob li\u017en jem drve\u0107u, i nisu ba\u0161 pevale ve\u0107 kako se to ka\u017ee,
  cvrkutale ili pijukale ili \u0107u\u0107orile, i napadale jedna drugu na pre\u010dagama
  ili lep r\u0161ale u vazduhu, te ptice koje men jaju boje, koje izgo v a raju imena,
  koje se hrane sto je\u0107i naglavce.\\n\\nNo\u0107u bi sta jala ispred njegove
  sobe i pos mat rala ga kako spava. Ostala bi tako jedan sat a zatim bi se priklju\u010dila
  na in ter net da gleda auto mobile kako se po javljuju na dve trake autop uta koji
  je ulazio u Kotku i izlazio iz nje, u Fin skoj, gledala bi ih sve dok se i njoj
  ne bi prispavalo, kon a\u010dno, s nailaskom severne svetlosti.\\n\\nPOGLAVLJE 5\\n\\nBilo
  je to jo\u0161 jedno lenjo jutro, ma glovito i nepom i\u010dno, i u njemu je za
  zvo nio tele fon. Sta jala je naga u sobi za ve\u017ebanje, nag nuta ulevo, za tvorenih
  o\u010diju, mere\u0107i vreme otku cajima na ru\u010dnom zglobu.\\n\\nIli je sedela
  prekr\u0161tenih nogu, is pravljenih le\u0111a, ote\u017eano di\u0161u\u0107i. Izduvavala
  je vazduh kroz nozdrve i u grlu pro iz vodila zvuke nalik na odjek, zam i\u0161l
  jala je svoje telo kako se podi\u017ee i okre\u0107e, po jedan obrt sa svakim udisa
  jem.\\n\\nIli se kretala \u010det voro no\u0161ke, raz maknutih kolena, odiz ala
  stra\u017enjicu, os e\u0107ala se kao ma\u010dka u tom po lo\u017eaju, kru\u017eila
  ra men ima.\\n\\nSta jala je i lagano se nji hala, bez prest anka kon troli\u0161u\u0107i
  vreme, jedna po lov ina tela joj se okretala za podignutom levom rukom, rukom na
  kojoj je tre balo da stoji sat, ili je ruka slu\u017eila kao poluga za telo a glava
  se sve vi\u0161e pomer ala kao druga kaza ljka na satu koga nije bilo, otvorenih
  usta i \u010dvrsto sk lopljenih o\u010diju.\\n\\n\u010cula je avion kako pre le\u0107e
  nebom a onda je svetlost na\u010das sinula pa se ugas ila, sun \u010deva svetlost,
  sun\u010dev zrak, doga\u0111aj koji je prim ila u svest kroz spu\u0161tene kapke,
  i shvat ila da se magla kon a\u010dno podigla.\\n\\nU danima kada je na za tvorenom
  tremu bilo suvi\u0161e hladno i vla\u017eno, razgo v arali bi u sobi s brod skim
  podom, a ona je hvatala bele\u0161ke i sn im ala. Bilo je jutara kada je on jedva
  pro go v arao, ali i onih u kojima je bio raspo lo\u017een za razgo vor i tada bi
  sedeli pored vatre koju je ona za lo\u017eila dok bi os tatak ku\u0107e bio pot
  puno mrtav.\\n\\n\u201eDo\u0161lo mi je da sam ovde. Ja sam sa tren utkom, napusti\u0107u
  tren utak. Stol ica, sto, zid hodnik, sve za tren u tak, u tren utku. To mi je do\u0161lo.
  Ovde i blizu. Od tren utka ja sam oti\u0161ao, oti\u0161ao sam, oti\u0107i \u0107u
  iz tren utka za tren u tak.\\\"\\n\\nNije znala kako da nazove takav iskaz. Nazvala
  ga je pevan jem. Ogla\u0161avao se tako neko vreme, ti\u0161e pa glas nije, i to
  je bila pesma, bilo je to po janje. Nag nula se prema njemu. U tom \u010dasu bilo
  je o\u010dito da nije sasvim imun na nadahnu\u0107e. Ona je pak u svome telu os
  e\u0107ala olak\u0161anje koje ju je izbavl jalo iz prete\u0161 kih misli i uvodilo
  u ne\u0161to bezmalo neuk rotivo. Nag nula se prema njego vom glasu, sme ju\u0107i
  se. Po\u017eelela je da peva s njim, da prati i gubi ritam, ili re\u010di, ili stvari,
  ili \u0161to god da je bilo to \u010dime se on bavio, ali se umesto svega toga samo
  nas me jala.\\n\\n\u201eDo\u0111em idem odlazim. Odem pa do\u0111em. Oti\u0161lo
  mi je da do\u0111em. Mi \u0107emo, svi \u0107emo, svi \u0107emo da budemo oti\u0161li.
  Jer ja sam ovde i gde sam. I oti\u0107i \u0107u ili ne\u0107u ili nikada. A video
  sam \u0161ta \u0107u da vidim. Ako sam gde \u0107u da budem. Jer ni\u0161ta ne do\u0111e
  izme\u0111u mene.\\\"\\n\\nOna se sme jala, ali on nije. Re\u010di su bez prest
  anka navirale iz njega i to nije bio \u0161izo freni govor niti povici tela koje
  je uznemirio Bog. Sedeo je bled i nepom i\u010dan. Ona ga je gledala. Bilo je to
  \u010disto pojanje, sasvim ned vos misleno, ili je on to mo\u017eda pok u\u0161avao
  ne\u0161to da joj ka\u017ee? Os e\u0107ala je ushi\u0107enje koje je re metilo njeno
  nastojanje da pa\u017eljivo slu\u0161a. Da li je on to pok u\u0161avao da joj ka\u017ee
  kako to izgleda biti on, \u017eiveti u njego vom telu i umu? Pok u\u0161ala je da
  to \u010duje, ali nije uspela. Re\u010di su tekle, \u010dulne a prazne, i ona po\u017eele
  da i on po\u010dne da se smeje s njom, da joj po mogne da napusti sop stveno bi\u0107e.
  U tome je smisao, da, to je navir anje ist in ske ushi\u0107en osti. I nekog u\u017easa
  na rubu svega toga, ili straha od ver ovanja, nekog izme\u0161tanja sopstvenog bi\u0107a,
  ali u tome je smisao, to je put ka ek stazi, u onom starom i dubokom zn a\u010denju
  te re\u010di, kada se \u010doveku o\u010di pre vrnu u lob anji.\\n\\n\u201e\u0160ta
  je tren u tak? Rekao si tren u tak. Ka\u017ei mi \u0161ta to tebi zna\u010di? Poka\u017ei
  mi tren u tak.\\\"\\n\\nOn re\u010de: \u201ePri\u010daj u ovo.\\\"\\n\\n\u201eReci
  \u0161ta zna\u0161? Ko je Rej? Razgo v ara\u0161 li s njim? Jesi li ikada razgo
  v arao s njim? Zna\u0161 li o kome go v orim kada spo me nem Reja? Ja sam Loren.
  Ko je Rej? Jedan \u010dovek. Evo ovo liko visok. Gledaj. Ovo liko visok. S brkovima.
  \u010covek s dlakama na gorn joj usni. Gledaj u mene, budalo. Koliko visok? Ovo
  liko visok. \u010covek s o\u0161trom dlakom na gorn joj usni. Samo \u0161to je obri
  jao brkove.\\\"\\n\\nOn je obri jao brkove. Bila je za boravila to sve do ovog tren
  utka.\\n\\nKraji\u010dkom oka primetila je ne\u0161to. Okrenula se, i toga vi\u0161e
  nije bilo. Tele fon je zvonio. Za klju\u010dila je da bi tre balo da po tra\u017ei
  nekog opti\u010dara, ili o\u010dnog lekara, po\u0161to joj se mnogo puta, ili mo\u017eda
  jednomdvaput, u\u010dinilo da je ne\u0161to videla kraji\u010dkom desnog oka, ali
  je znala da se zapravo ne\u0107e petl jati s tim. Tele fon je zvonio. Podigla je
  slu\u0161alicu i \u010dekala da se neko oglasi.\\n\\nBilo joj je vreme da malo is
  trlja telo. Za tabane je upo tre bila kamen plavac, kojim je, kru\u017enim pokre
  tima, is trl jala pete i gornje delove tabana, a onda je jo\u0161 jednom nas a pun
  jala sto palo i ponovo ga stisnula \u0161akom. Volela je da dr\u017ei sto palo \u0161akom.
  Strpljivo je tanjila jedan usam ljeni \u017eulj, pro tegav\u0161i taj posao na neko
  liko dana, pre dav\u0161i mu se do kraja, tela zgr\u010denog u celovitosti tog nauma,
  u nekoj vrsti sve\u010dane za ok upljen osti sobom koja zrelu osobu odvaja od deteta.\\n\\nImala
  je \u0161mirglaste da\u0161\u010dice i turpije, razne vrste makaza, maka zica i
  krema, pod stica jnih za upo trebu glagola koji ozn a\u010davaju radnje skra\u0107ivanja
  i pod sec anja. Prou\u010davala je prste na svojim rukama i nogama. Imala je svoj
  na\u010din za pod vrgavanje odre\u0111enog prsta pomnom pos mat ranju, pomo\u0107u
  uveli\u010davaju\u0107eg stakla i kvad rati\u0107a od tamnog kar tona, i tako su
  na sve strane letele zan ok tice i ko madi\u0107i i zrnca mrtve ko\u017ee i delovi
  nok tiju, iskrice su vrcale u vazduh.\\n\\nLepo je bilo ponovo se pre pustiti tom
  poslu.\\n\\n***\\n\\nMo\u017eda taj \u010dovek ne raspola\u017ee nikak vom odbranom
  protiv istine ovoga sveta.\\n\\nKoje istine? Za p it ala se: koje istine?\\n\\nPret
  postavlja se da vreme prolazi, pom is lila je. No mo\u017eda on \u017eivi u nekom
  drugom stanju. To je neka vrsta vremena koja je jed nostavno i neotk lonjivo tu,
  raspros trta, nevid ljiva, a on je li\u0161en uro\u0111ene sposob nosti da iznova
  spozna takvo stanje.\\n\\nKoje sposob nosti?\\n\\nOn ni na koji na\u010din ne mo\u017ee
  da zam isli kako vreme postoji u pouzdanom toku, kako prolazi, te\u010de, doga\u0111a
  se - svet se doga\u0111a, neminovno, mi to os e\u0107amo - sa imen ima i da tumima
  i raz li\u010ditostima.\\n\\nNjegova bu du\u0107nost je bez i mena. Ona je, nekako,
  jed novremena sa sada\u0161n jo\u0161\u0107u. Ni\u0161ta se ne doga\u0111a pre ili
  posle onog drugog i oboje je pod jed nako dos tupno, mo\u017eda, makar i samo u
  njego vom umu.\\n\\nZakoni pri rode omogu\u0107uju stvari koje se zapravo, u praksi,
  pom is lila je, nikada ne doga\u0111aju.\\n\\nAli bi mogle da se dogode.\\n\\nAli
  ne bi.\\n\\nAli bi mogle. Makar i samo u njego voj svesti, pom is lila je.\\n\\nZa
  ru\u010dak je obi\u010dno obed ovala laku i nez an im ljivu hranu, hitro, tek da
  zavr\u0161i s tim. On se ponekad ne bi po ja vio a ponekad bi se po ja vio ali ne
  bi jeo, a jednom pri likom ga nije bilo \u010ditavih \u0161est-sedam sati pa je
  ona preg ledala celu ku\u0107u i u mraku pro\u0161la niz pri lazni put, gde je ba
  ter ijskom lampom os vetl javala drve\u0107e i mirnim glasom izgo v arala; \u201eGde
  si?\\\"\\n\\nZatim ga je \u010dekala u ku\u0107i s kn jigom u rukama kao pukim rek
  v iz itom, sedela je i razmi\u0161l jala, nije razmi\u0161l jala, kao svaka \u017eena
  koja zna da se do godilo ono na jgore.\\n\\nA on je u jednom tren utku u\u0161ao
  u sobu, nekako postrance, na svoj posuv ra\u0107eni na\u010din, kao da, kao da.
  Gledala ga je dok je pok u\u0161avao da svoje telo pri la godi fotelji, i dopust
  ila sebi izvesno olak\u0161anje, neku vrstu telesne lako\u0107e koja ju je sneno
  os lobod ila one ravnodu\u0161ne \u017eene s kn jigom.\\n\\nPom is lila je na \u010doveka
  koji bi se neo\u010dekivano po ja vio. Ne na \u010doveka koji je sada bio tu. Na
  jednog drugog. Nije to bilo ni\u0161ta posebno, to joj je palo na um za dor u\u010dkom,
  \u010dovek koji bi se nenadano po ja vio, kao u kakvom filmu, sn im ljen iz donjeg
  rak ursa. Ne kamerom, ve\u0107 fo toaparatom. Ne ist in ski sn im ljen, ve\u0107
  za robljen na filmskoj traci, iz donjeg rak ursa, kao da se nad vija nad njom. To
  bi iza zvalo \u0161ok, na\u010din na koji bi se to do godilo, \u010dovek na vratima,
  osvetljen na sasvim odre\u0111en na\u010din, prete\u0107i, radi pot pun ijeg utiska,
  ili \u010dovek koga bi srela pred ku\u0107om dok izlazi iz kola, krupan \u010dovek,
  koji bi se izn en ada nadvio nad njom. Bio bi to \u0161ok iz spol ja\u0161n jeg
  sveta, udarac, za pan juju\u0107i nalet, i takav jedan tren u tak deluje duboko
  prete\u0107e za dvoje ljudi koji do tada \u017eive izdvo jeno od sveta, prepu\u0161teni
  sebi. Is postavilo bi se da je to vlas nik ku\u0107e, krupan \u010dovek, da, radi
  pot pun ijeg utiska, star ali krepak, ili mo\u017eda ne tako star, a onda bi se
  is postavilo i da je do\u0161ao da porazgo v a raju o gos podinu Tatlu.\\n\\nVidela
  je sebe u tom pri zoru, na pri laznom putu, kako slu\u0161a re\u010di tog \u010doveka.
  Bila je to us putna misao, pri\u010da koju je sebi is pri\u010dala, ili prikazala
  kao film, ne\u0161to sasvim bezn a\u010da jno. \u010covek joj ob ja\u0161n java
  kako je gos podin Tatl, ili kako bi ga on ve\u0107 nazvao, njegov dalji ro\u0111ak,
  ili sin, jo\u0161 bolje, njegove voljene sestre, i da je veliki deo svog \u017eivota
  proveo u ovoj ku\u0107i, bez di jagnoze, ili jo\u0161 bolje sa o\u0161te\u0107en
  jem mozga, i da o njemu brine ne gov ateljica koju je un ajmio taj \u010dovek, vlas
  nik, koji jeste pomalo za pu\u0161ten, pomalo po haban, ali uglavnom tu\u017ean,
  nekako porodi\u010dno tu\u017ean, i da kada su taj vlas nik i njegova \u017eena
  Alma od lu\u010dili da se presele, po\u0161to su deca odrasla i za s novala svoje
  porodice, re\u0161ili su da izdaju u najam ovu staru na herenu ku\u0107erinu, svoje
  neg danje ognji\u0161te i dom, mo\u017eda da je na kraju i prodaju, pa su gos pod
  ina Tatla, \u010dije se pravo ime ne spom inje, smestili u neku us tan ovu za ljude
  obolele od ovoga ili onoga, nekih stot inak milja odatle, za ljude u stanju kakvo
  se ne da naslutiti ni u na jlu\u0111im pret postavkama, i nikome od \u010dlan ova
  porodice nije palo na um, kada su \u010duli da je nestao iz te us tan ove, da bi
  on bio u stanju da prona\u0111e put do ku\u0107e, sve do ovog tren utka. Sada im
  je to palo na um, i zato je on, taj vlas nik, do\u0161ao da se raspita.\\n\\nU svom
  zam i\u0161l janju ona se, kao i vlas nik, su zdr\u017eava da gos pod ina Tatla
  uporedi sa izgubljenim psom, iz nekak vih obzira ili tako ne\u010deg, i tako se
  ta stvar okon\u010dala, manje-vi\u0161e, za dor u\u010dkom, s pri zorom vlasnika
  i za k upca na pri laznom putu, neodre\u0111eno zagledanih u ku\u0107u.\\n\\nIme
  Alma do\u0161lo je ni otkuda. De lovalo je pot puno vero dosto jno. Sve je de lovalo
  vero dosto jno, sve je de lovalo uver ljivo, \u010dak i ono s povratkom izgubljenog
  psa, a na jva\u017en ije u vezi s tim pri zorom bilo je to \u0161to nikada nije
  stigao do ta\u010dke u kojoj se postavlja pit anje da li \u0107e ga ona pred ati,
  da li \u0107e im ga izru\u010diti, ve\u0107 se samo za vr\u0161io, naglo, tek tako.\\n\\nKor
  a\u010dala je po tlu, i os e\u0107ala sve \u0161to je bilo tu, sve nebo i svu svetlost,
  zvuk udaranja \u010deki\u0107a odnekud iz stra\u0107ara pored pra\u0161n ja vog
  puta, ud aljenih gotovo pola milje, zvuk opipljiv na vetru, os e\u0107ala je i kako
  jas no\u0107a stvari mo\u017ee da produbi korak, da \u010doveku podari ne\u0161to
  za \u0161ta se mo\u017ee \u010dvrsto uhvat iti, a onda je \u010deki\u0107 utih nuo.
  Kor a\u010dala je i razmi\u0161l jala. Bilo je to jedno od onih jutara bez ptica.
  Nad hranilicama je lebdeo mir, prazn ina koja je os va jala svojom du binom.\\n\\nPo
  pov ratku ku\u0107i, najpre je primetila da on na nogama ima cipele koje mu je ona
  kupila, udobne, za vez anih pertli, s mekanim \u0111onovima, i bilo joj je drago
  zbog toga.\\n\\nSedeli su u sobi s brod skim podom, sa onom spravicom za sn i manje
  na sto\u010di\u0107u postavljenom izme\u0111u njih.\\n\\nKo ga je nau\u010dio da
  vezuje pertle?\\n\\nZurio je u nju. \u010cinilo se da zuri, ali ver ovatno i nije.
  Po njenom mi\u0161ljenju, njegove o\u010di bile su u stanju da hvataju i uo\u010davaju
  oblike stvari. U svakom slu\u010daju, ne kao nor malne o\u010di. Od oka se o\u010dekuje
  da ob likuje i obra\u0111uje i boji. Ono nam pri\u010da pri\u010du u koju \u017eelimo
  da pover ujemo.\\n\\n\u201eOnda kada mi do\u0111e.\\\"\\n\\n\u201e\u0160ta?\\\"\\n\\n\u201e\u0422\u043e
  na jvi\u0161e. Dani da godine.\\\"\\n\\n\u201eZna\u0161 li \u0161ta to zna\u010di?
  Dan. Godina. Ili si \u010duo mene kako kor is tim te re\u010di?\\\"\\n\\n\u201eReci
  ne\u0161to.\\\"\\n\\n\u201eReci ne\u0161to.\\\"\\n\\n\u201eBude kad do\u0111e.\\\"\\n\\n\u201eBude
  kad do\u0111e. \u0160ta?\\\" re\u010de ona.\\n\\n\u201eOde da odlazi.\\\"\\n\\n\u201e\u041a\u043e
  odlazi?\\\"\\n\\n\u201eOnda kada ti, da, tako re\u010de.\\\"\\n\\n\u201e\u0160ta
  sam rekla?\\\"\\n\\nShvat ila je da ga jo\u0161 nikada nije os lov ila po imenu.
  Izgo v arala je njegovo ime jedino kada je bila sama, kada je go v or ila u dikta
  fon. Jer, nara vno, treba to priznati - to ime je i zgodno i snishodljivo.\\n\\nOn
  re\u010de: \u201eNe diraj to\\\", glasom koji nije bio sasvim njegov. \u201ePo\u010disti\u0107u
  kas nije.\\\"\\n\\nPosle toga je utonuo u \u0107utanje. Da, utonuo. Oborio je pogled,
  nekako sneveseljen, ako je ona to pravilno shvat ila. Odre citovala je jednu de\u010diju
  pe smicu, na fran cuskom. Pok u\u0161ala je da ga nago vori da ponovi jedan stih
  i on se po tru dio, dirljivo i bezn ade\u017eno, a ona je uhvat ila sebe kako u
  sebi pok u\u0161ava da opi\u0161e taj prizor nekome, mogla je to biti Mar ijela,
  ili ne, kao da je on nekakav prona\u0111eni umetni\u010dki pred met i da njih dve
  treba da rasprave pit anje njegove upotrebljivosti.\\n\\nPo podne bi, svaki put
  sve br\u017ee, svetlost gas nula u brdima s druge strane zaliva, u svemu oko nje,
  drve\u0107u i zemlji i zga\u017eenom li\u0161\u0107u pod njenim nogama, tam no cr
  venom i zlat nom, a jednom joj je ponad ramena ne\u010dujno pre letelo jato gusaka,
  koje se preko sveta za putilo u neku svoju ta jnovitu no\u0107.\\n\\nPo\u010dela
  je da shvata da vi\u0161e ne mo\u017ee da ose\u0107a koliko joj Rej nedostaje, da
  vi\u0161e ne mo\u017ee da razmi\u0161lja o njego voj odsut nosti, o gubitku Reja,
  a da pritom u nekom za k utku svesti ne pom isli i na gospod ina Tatla.\\n\\nKada
  je podigla slu\u0161alicu tele fona koji je zvonio, sa\u010dekala je da se onaj
  ko je pozvao oglasi prvi i os etila slaba\u0161no ok rutno zado voljstvo u tom za
  ti\u0161ju zbunjenih molekula.\\n\\nJedne vedre no\u0107i izvela ga je na polje
  i prstom mu pokazala jedno sazve\u017e\u0111e. Podu\u017ee vreme pre toga nije pos
  mat rala no\u0107no nebo i dah im je u ob la\u010di\u0107ima izlazio u hladni vazduh.
  Privukla ga je sebi spreda i stavila njegove \u0161ake u d\u017ee pove svoje jakne
  i u lice mu glasno izgov arala re\u010di koje je tra\u017eila da joj ponovi.\\n\\nOn
  re\u010de: \u201eMese\u010dina se ka\u017ee mese\u010dina.\\\"\\n\\nTo ju je obradovalo.
  Re\u010den ica je bila lo gi\u010dki slo\u017eena i na \u010dud novat na\u010din
  dirljiva i za ok ru\u017eeno lepa i istin ita - ili mo\u017eda ne toliko za okru\u017eena
  ve\u0107 prava da pravija nije mogla biti.\\n\\nTre balo je da prona\u0111e ime
  kojim ga je mogla naziv ati i pred njim.\\n\\nBilo joj je zan im ljivo da razmi\u0161lja
  kako on \u017eivi u stvarnos tima koje se me\u0111usobno preklapaju.\\n\\nMnoge
  su stvari zan im ljive, budalo, a da pri tom nisu ni blizu istine.\\n\\nPod setila
  je sebe da su joj po trebne ba ter ije za dikta fon.\\n\\nDopadalo joj se da razmi\u0161lja.
  O \u010demu joj se dopadalo da razmi\u0161lja? Provela je jedan is prazan dan i
  htela je da za to optu\u017ei maglu.\\n\\nMo\u017eda on ispada, mo\u017eda klizi,
  ako se uop\u0161te mo\u017ee upo tre biti ta re\u010d, iz svog do\u017eivl jaja
  ob jekt ivnog sveta, na j dubljeg opisa odnosa prostor-vreme, u kome ne mo\u017ee
  da oseti kuda ga vodi bu du\u0107nost mo\u017eda klizi u njen do\u017eivl jaj, u
  sva\u010diji, u stand ardnu suncem obljubljenu hro no lo giju doga\u0111aja.\\n\\nJesam
  li ja mo\u017eda prvo ljud sko bi\u0107e koje je otelo van zemaljca?\\n\\nMagla
  je bila sumorna i bronzana i nisko se val jala prema obali, ali je na obali gubila
  oblik, povla\u010de\u0107i sa sobom sve u ameboidnu pomr\u010dinu.\\n\\nAko ne postoji
  pravilan poredak izuzev onog koji sami stvaramo da bismo se os e\u0107ali bezbed
  nije na ovom svetu, to zna\u010di da je mogu\u0107e, na primer, pre\u0107i iz jednog
  bez i menog stanja u neko drugo, s tim \u0161to je to o\u010dito nemogu\u0107e.\\n\\nPod
  setila je sebe da su joj po trebne ba ter ije. Rekla je sebi da treba da se seti.\\n\\nBio
  je to jedan od onih dana u kojima za boravl jate re\u010di i is pu\u0161tate stvari
  i pitate se \u0161ta ste to hteli da uzmete iz sobe po\u0161to ste se u njoj obreli
  s nekim razlo gom i morate sebi da ka\u017eete da je pit anje trenutka kada \u0107ete
  se setiti, po\u0161to se pre ili kas nije uvek setite, kad ve\u0107 stignete u tu
  sobu.\\n\\nTo vam se nekako samo ka\u017ee.\\n\\nVoskom je skin ula dlake ispod
  pazuha i s nogu. Po\u010dupale su se uz hladan, reski zvuk. Imala je neku kiselu
  kremu za epila ciju, jaku, dobijenu na recept, i po\u0161to je skin ula dlake utrl
  jala je kremu da bi odstranila suvi\u0161nu ko\u017eu u obliku pahuljica i krlju\u0161ti
  i gro muljica koje je volela da dr\u017ei me\u0111u prstima i zam i\u0161lja, bez
  imalo mor bid nosti, kao znamen smrti neke \u0107elije unutar njenog tela.\\n\\nZa
  laktove i kolena kor istila je \u010detku od ma jmun ske dlake. \u017delela je da
  je zaboli. Nije morala da ide \u010dak u Tanger da bi kupila lufu i \u0161tapi\u0107e
  po mor and\u017ee. Toga je bilo u svim rad njama, na vi sokim pol icama, kao i \u010detkica
  za lice, \u017eileta i pilinga od ovsene krupice. To je bio njen za datak, da i\u0161\u010dezne
  iz svih svojih ran ijih oblika i dr\u017eanja i postane belina, telesna tablica
  sa koje su izbris ani svi likovi pro\u0161losti.\\n\\nImala je jednu kremu za iz
  beljivanje koju je nanela gotovo po \u010ditavom telu, da bi se os lobod ila pig
  menta. Odsekla je sebi malo kose, pa onda jo\u0161 malo. Taj grubi posao postao
  je bezmalo bru talan kada je po\u010dela da iz beljuje kosu. \u017delela je da u
  ogledalu ugleda nekog ko neminovno ostaje nevi\u0111en, osobu koju ljudi po navici
  ne prime\u0107uju, li\u0161enu bilo \u010dega bliskog u izrazu, poput sa b lasti
  u no\u0107nom miru javnog toaleta.\\n\\nUpo tre bila je losion da bi uk lonila os
  tatke sapuna, masti, i one neizbe\u017ene hron i\u010dne prl jav\u0161t ine. Bilo
  je tu i plasti\u010dnih traka koje je nalepila na ko\u017eu pa skin ula, izvukav\u0161i
  pri tom \u010depove ne\u010dis to\u0107e iz svojih pora.\\n\\n\u010cud novat se
  i zan im ljiv sistem krio u tim vo\u0161tanim izlu\u010dev i n ama, \u017elezdanim
  zbivanjima u kos mosu tela, malim truljenjima i erup cijama, utis nu tim mas tima,
  uljima, solima i znoju, a u zado voljstvu nji ho vog istiskivanja bilo je ne\u010deg
  gotovo nau\u010dnog.\\n\\nProna\u0161la je ulje za masa\u017eu mi\u0161i\u0107a
  koje je kupila Reju ne posredno pre njego vog odlaska, pa ga je upo tre bila tek
  da ga upo trebi.\\n\\nSta jala je i gledala ga, dva tela u istoj prost or iji. \u010cinilo
  se da on pred tu\u0111im pogle dom nekako uzmi\u010de, povla\u010di se u sebe, ne
  s nela go dom, pom is lila je, ve\u0107 spon tano, svo je voljno, po diktatu nekog
  zakona stvorenog u njego vom telu. Spust ila mu je ruke na ramena i zagledala mu
  se u o\u010di. Pom is lila je: Kada su to ljudi po\u010deli jedni drugima da gledaju
  u o\u010di? Eto \u0161ta je \u010dinila, nekako is tra\u017eiva\u010dki, dok je
  sta jala u kuh inji s gos podinom Tatlom.\\n\\nNe diraj to. Po\u010disti\u0107u
  kas nije.\\n\\nO\u010di su mu bile sive, ali to i nije bilo va\u017eno. O\u010di
  su mu bile ble dos ive, bile su blage i mirne i spoko jne. Ona je gledala. Oduvek
  je gledala. Nikad nije mogla da se nagleda. Njegove sive o\u010di pod ovim jakim
  svetlom postale su ble do\u017eute, \u017eu\u0107kaste, i u njima nije bilo ti traja
  uzdrhta log bi\u0107a.\\n\\nObuhvat ila mu je lice \u0161akama, gledaju\u0107i ga
  pravo u o\u010di. Sa kakvim li se mogu\u0107im smis lom neko misle\u0107e stvorenje
  prvi put zagledalo u o\u010di drugog? Da li je bilo po trebno sto hil jada godina
  da se tako ne\u0161to dogodi ili je to bilo prvo \u0161to su u\u010dinili, nadilaze\u0107i
  sebe, da li ih je to u\u010dinilo vi\u0161im bi\u0107ima, pri la godilo ih vre menu,
  taj pogled koji pokazuje koliko smo usam ljeni u du\u0161i?\\n\\nOna re\u010de:
  \u201e\u0160ta misli\u0161, za\u0161to ja stojim bli\u017ee tebi nego ti meni?\\\"\\n\\nNije
  pok u\u0161ala da bude duhovita. Bilo je to istina, sab lasni paradoks. Potom je
  pok u\u0161ala da bude duhovita, da bude slatkore\u010diva i da mu tepa, ali se
  ubrzo os etila glupavo i pre stala s tim.\\n\\nPojeo je dor u\u010dak, ili nije,
  na jve\u0107i deo je os ta vio. Posle toga je zastao u dov ratku izme\u0111u kuh
  inje i dugog pred soblja koje je vodilo u foaje. Ona je sedela za stolom i \u010dekala.\\n\\nGledao
  je nekud pored nje ili kroz nju i gotovo da je znala \u0161ta \u0107e usled iti.\\n\\nRekao
  je: \u201eAli, kuda \u0107e\u0161?\\\"\\n\\nRekao je: \u201eIdem malo do grada.\\\"\\n\\nRekao
  je: \u201eAli ni\u0161ta nam ne treba. A i ako nam zatreba, kupi\u0107u ja.\\n\\nZnam
  \u0161ta treba da kupim.Treba nam malo kako-se-ono-zva\u0161e. Abrazivno sred stvo.\\\"\\n\\nRekao
  je: \u201eMolim?\\\"\\n\\nZnala je bezmalo istog tren utka, \u010dak i pre no \u0161to
  je pro go vorio. Nije znala savim odre\u0111eno, ali je os e\u0107ala, po\u0161to
  je os etila i pro menu u njemu. \u010caj joj se pu\u0161io u \u0161olji. Sedela
  je za stolom i pos mat rala ga i bilo joj je sasvim jasno ve\u0107 u prvoj napreg
  putoj razmeni rep lika po\u0161to taj glas, po\u0161to ti glasovi nisu bili njegovi.\\n\\n\u201eAli
  ne treba nam ovog tren utka. Kupi\u0107u ja kad odem. Ajaks. Tako se to zove. Tren
  utno ne treba ni\u0161ta da ribamo.\\\"\\n\\nSlu\u0161ala ga je i \u010dula svoj
  glas. \u010ciji drugi, do \u0111avola. Bile su to re\u010di koje je ona jednom pri
  likom izgo v or ila.\\n\\n\u201eAjaks, sin Tel a monov, \u010dini mi se, ako jo\u0161
  pamtim ono \u0161to sam znala o Tro janskom ratu, a mo\u017eda su nam po trebne
  novine, po\u0161to su se ove stare ve\u0107 prili\u010dno ubu\u0111ale, i veliki
  hrabri ratnik, nen ad ma\u0161ni baca\u010d koplja, a uz to i \u010dista\u010d toaleta.\\\"\\n\\nMo\u017ee
  li \u010dovek da pre pozna re\u010di koje je izgo vorio neko liko nedelja ranije,
  dabome, ako mu ih neko ponovi, i dabome, ako su to poslednje, ili neke od posled
  njih re\u010di koje je uputio nekome koga je voleo i koga nikada vi\u0161e ne\u0107e
  videti. To mu je rekla pre no \u0161to je u\u0161ao u auto mobil i odvezao se, eh
  da je samo znala, \u010dak u Nju jork.\\n\\n\u201eSamo da se malo pro vozam. Ni\u0161ta
  drugo. Uze\u0107u tojotu\\\", rekao je, rekao je, \u201eako uop\u0161te uspem da
  prona\u0111em klju\u010deve.\\\"\\n\\nTe re\u010di je izgo v arao ovaj \u010dovek
  u dov ratku, na izgled tako malen i krhak, satr ven ne\u010dim. I to nije de lovalo
  kao \u010din se\u0107anja. Jeste to bio Rejov glas, du\u0161a njenog mu\u017ea sad
  r\u017eana u tonovima, ali nije joj izgledalo da se to ovaj \u010dovek prise\u0107a.
  To se doga\u0111alo u sada\u0161n jem tren utku. Tako se njoj \u010dinilo. Pos mat
  rala ga je kako se mu\u010di u tom iskazu i mis lila kako se to odnekud doga\u0111a
  ba\u0161 sada, u tom telu, u njego vom razlom ljenom vre menu, i da on samo ponavlja,
  be spomo\u0107no, nji hove re\u010di.\\n\\nRekao je: \u201eU kolima su. Nara vno.
  Klju\u010devi. Gde bi drugde bili? Tako je to. Kako da ti ka\u017eem? To je uvek
  tako.\\\" Stajao je u dov ratku i treptao. Rej je sada \u017eiv u svesti tog \u010doveka,
  u njegovim ustima i telu i kurcu. Na je\u017eila se. Videla je sebe, vidi sebe kako
  puzi prema njemu. Taj lik je tu pred njom. Ona puzi preko poda i taj joj je lik
  jo\u0161 malo pa stvaran. Ose\u0107a da se ne\u0161to odvojilo, da se sasvim ne\u017eno
  otkin ulo, i pok u\u0161ava da ga povu\u010de sa sobom na pod, da ga zaustavi, da
  ga zadr\u017ei tu, ili da se uspu\u017ee na njega ili u njega, da se raspline, ili
  samo le\u017ei opru\u017eena i nez a d r\u017eivo jeca, gledaju\u0107i samu sebe
  odozgo. Os etila je njegov losion, na svom telu, njegovo ulje za masa\u017eu, a
  onda se on sav pret vorio u govor.\\n\\nPOGLAVLJE 6\\n\\nStoji\u0161 kraj stola
  i pre tura\u0161 po pa pirima i ne\u0161to ti is padne. Ali ti to ne primeti\u0161.
  Treba ti tren u tak-dva da to shvati\u0161 a \u010dak i tada shvati\u0161 to tek
  kao bezob li\u010dno iskrivljenje prost ora koji vri oko tvoga tela. No kada shvati\u0161
  da ti je ne\u0161to ispalo, \u010duje\u0161 to ne\u0161to kako pada na pod, sa za
  ka\u0161n jen jem. Taj zvuk se probija kroz bezmerni splet daljina. \u010cuje\u0161
  tu stvar kako pada i u manje-vi\u0161e istom tren utku zna\u0161 \u0161ta je to,
  zna\u0161 da je to spa jalica. Zna\u0161 to po zvuku koji se za\u010duje pri likom
  njenog pada na pod i po se\u0107anju na sam tren u tak kada je ispala, po\u0161to
  ti je ispala iz ruke ili je spala sa ruba stranice uz koju je bila pri\u010dvr\u0161\u0107ena.
  Spala je sa ruba stranice. Sada kad zna\u0161 da ti je ispala, se\u0107a\u0161 se
  kako se to do godilo, ili se napola se\u0107a\u0161, ili \u010dak pomalo i vidi\u0161
  to, ili ne\u0161to drugo. Spa jalica padne na pod i odsko\u010di, krhka i beste\u017e
  in ska, uz zvuk za koji ne postoji ono ma topeja, zvuk spa jalice koja je pala,
  ali kada se sagne\u0161 da je pok upi\u0161, nje nema.\\n\\nTe no\u0107i sta jala
  je ispred njegove sobe i slu\u0161ala ga kako cvili. Taj zvuk bio je sa\u010din
  jen od niza slaba\u0161nih jecaja, polujecaja, ravnih i jednoli\u010dnih, pra\u0107enih
  slaba\u0161nom jekom, odjekom, i pro\u017eetih o\u010da jan jem koje je jed nostavno
  ukid alo re\u010di, njene ili bilo \u010dije.\\n\\nNije znala \u0161ta je to tre
  balo da zna\u010di. Nara vno da je znala. On nije imao za \u0161titni sloj. Bio
  je sasvim sam i nes posoban da im prov izuje, da se pretvara. Pri\u0161la je postelji
  i sela na nju, po nu d i v\u0161i dodire i umiruju\u0107e zvuke, utehe no\u0107i.\\n\\nBio
  je up la\u0161en. Kako jed nostavno i kako istinito. Pok u\u0161ala je da mu po
  mogne, da u\u010dini da otupi na strah. Bio je tu, sav u urliku ovoga sveta. Bilo
  je to lice koje urla, ogoljeno, za koje ne postoji pore\u0111enje. Samo, otkud je
  ona to mogla znati? Nije mogla.\\n\\nMo\u017eda je bio samo pore me\u0107en, nimalo
  rut in ski \u0161a\u0161av. Kao da to ikada mo\u017ee biti rut in ski. Ludak koji
  pok u\u0161ava da \u017eivi u tu\u0111im glaso- vima.\\n\\nLe\u017eao je sk lup\u010dan
  u tankom \u0107ebetu. Otkrila ga je i legla preko njega. Uvek valja po nud iti utehu.
  Polju bila ga je u lice i vrat i pro trljala da se zagreje. Za vukla mu je ruku
  u ga\u0107e, i po\u010dela da di\u0161e zajedno s njim, da ga vodi uz tihe dahtave
  jecaje. Tako se pos tupa s njima kada su up la\u0161eni.\\n\\n***\\n\\nU\u010dinilo
  joj se da je videla pticu. Kraji\u010dkom oka videla je kako se ne\u0161to podi
  glo kraj pro zora, ne\u0161to avet injsko i sli\u010dno ptici, no to mo\u017eda
  i nije bila ptica. Pogledala je i videla da je re\u010d o ptici, koja je uz letela
  u savr\u0161enoj ver tikali, dok joj je sme\u0111e pru gasto telo ostalo ho ri zont
  alno, lagano je mahala krilima, nekakav vrabac, koji nije lebdeo na vetru ve\u0107
  se sam pod izao a onda u trenu nestao.\\n\\nVidela ga je uglavnom u na knad nom
  prise\u0107anju, po\u0161to isprva nije ni znala \u0161ta to vidi, pa je morala
  iznova da o\u017eivi taj sab lasni tren u tak, da ga ispi\u0161e kao red u proznom
  tekstu, a mo\u017eda to i nije bio vrabac ve\u0107 neka manja ptica, siva a ne sme\u0111a
  i ta\u010dkasta a ne pru gasta i ne ba\u0161 malena kao kolibri, a kako je ikada
  mogla da sazna ako se to ne bi do godilo jo\u0161 jednom, a mo\u017eda \u010dak
  ni tada, pom is lila je, mo\u017eda \u010dak ni tada.\\n\\nTo nije istina zato \u0161to
  to ne mo\u017ee biti istina. Rej ne \u017eivi u svesti ovog \u010doveka niti u njegovim
  opipljivim glagol skim vre men ima, u njego vom raspri\u010danom kontinuumu.\\n\\nLepa
  re\u010d? \u0160ta li samo zna\u010di?\\n\\nPom is lila je da ta re\u010d ozn a\u010dava
  ne\u0161to neprekidno, neku neraskidivu celinu, u kojoj se jedan deo od drugog,
  ovo od onoga, sada od onda, mogu raz likovati jedino sasvim pro iz voljnim podelama.\\n\\nTo
  je upravo ono \u0161to on ne ume da \u010dini.\\n\\nRadila je na svome telu, po
  grbljena na hlad nom podu, os e\u0107ala je svoj miris.\\n\\nNe mo\u017ee, me\u0111u
  tim, biti istina to da on neprest ano prelazi iz jedne stvarnosti u drugu, neza
  v isno od logike vremena. To nije mogu\u0107e. \u010covek je sazdan od vremena.
  Vreme je sila koja ti ob ja\u0161n java \u0161ta si. Sklopi o\u010di i oseti to.
  Vreme je ono \u0161to odre\u0111uje pri rodu tvog postojanja.\\n\\nNo u tome i jeste
  stvar, u tome \u0161to se on odliva i kaplje, nekako, u druge opsege \u017eivljenja,
  druge \u017eivote i vremena, a u ovom ovde njegov izgled odaje zbunjen ost i bol.\\n\\nNekako.
  Na jnemo\u0107n ija re\u010d u jeziku. Uz manje-vi\u0161e. Uz mo\u017eda. Uvek mo\u017eda.
  Ona je uvek bila mo\u017eda.\\n\\nKle\u010dala je, tela krutog i us pravljenog,
  lako raz maknutih nogu, zaba\u010dene glave, za ba\u010denih ruku, is turene kar
  lice.\\n\\nPusti ruke da padnu.\\n\\nPre b aci desnu \u0161aku preko desnog sto
  pala a potom levu \u0161aku preko levog.\\n\\nSve se iz kar lice sliva un atrag.\\n\\nStavi
  dlan ove na tabane, tako da se pok lope.\\n\\nJedina pri\u010da koja je ist in ski
  va\u017ena jeste vreme. Ono ras te\u017ee doga\u0111aje i omogu\u0107uje nam da
  patimo i nad vladamo patnju i da budemo sve doci smrti pa onda nad vladamo i to.
  Ne i za njega, me\u0111u tim. On je u nekoj druga\u010di joj struk turi, drugoj
  kul turi, u kojoj vreme donekle li\u010di na sebe, \u010disto i ogoljeno, bez uto\u010di\u0161ta.\\n\\nOstani
  u tom po lo\u017eaju. Sve se iz kar lice sliva un atrag u grudi i ramena i ruke,
  sve do mahnite, un atrag za ba\u010dene glave.\\n\\nOstani u tom po lo\u017eaju,
  di\u0161i najpre nor malno, a onda nenor malno.\\n\\nPonovi sve to.\\n\\n***\\n\\nVetar
  je po\u010deo da duva u podne i jo\u0161 je tresao pro zore kada je ona pet sati
  kas nije pro\u0161la kroz hod nike.\\n\\nTele fon je zvonio.\\n\\nU kuh inji je
  is pus tio \u010da\u0161u s vodom a ona je is pru\u017eila ruku, i potom videla
  kako kru\u017ei\u0107i vode po\u010dinju da se \u0161ire preko da\u0161\u010danog
  poda.\\n\\nTaj reski vetar ju je uznemirio, nagnao da se uvu\u010de u sebe. Bio
  je gori, na neki na\u010din, od snega koji zatrpa sve ili od mraza zbog koga nestaje
  struje.\\n\\nZa lo\u017eila je vatru a onda iza\u0161la iz sobe i oti\u0161la uz
  ste penice, oslu\u0161kuju\u0107i kako \u0161i\u0161te\u0107i nas rtaji nadiru u
  zidove.\\n\\nU kuh inji je rekla: \u201eNe diraj to.\\\"\\n\\nDve na jbolje stvari
  u ovoj ku\u0107i bile su da\u0161\u010dani pod u kuh inji i stepen i\u0161na ograda
  od hrastov ine. Kako je neo bi\u010dno izgo v or iti te re\u010di. Mis liti o njima.\\n\\nRekla
  je: \u201eNe diraj to\\\", i is pru\u017eila ruku, da bi pre dupredila svaki njegov
  pok u\u0161aj da pokupi deli\u0107e. \u201ePo\u010disti\u0107u kas nije.\\\"\\n\\nIma
  ne\u010dega u tom vetru. On te li\u0161ava svega pouzdanog, ulazi u tebe, posto
  jan, \u010dini da oseti\u0161 skrivenu krhkost svega \u0161to te ok ru\u017euje,
  \u010dvrstinu stot ina raz li\u010ditih poduhvata - i ogoljenu provi zornost ni\u0161tavila.\\n\\nPo\u010distila
  je to odmah. Nije sa\u010dekala nikakvo kas nije. Bilo je u tom tren utku ne\u010dega
  \u0161to je \u017eelela da sa\u010duva.\\n\\n***\\n\\nPodigla je slu\u0161alicu
  i s druge strane \u017eice \u010dula glas Re jovog advokata. Ne\u0161to u vezi s
  nekak vim dugov ima. Bio je prezadu\u017een. Bilo je tu raz li\u010ditih ob liga
  cija i zadu\u017eenja. Dugovi su se nagom ilavali na druge dugove. Od toga se os
  etila nekako bolje. Bio je to pravi Rej. Pre pla vio ju je sna\u017ean talas na
  k lono sti, premda ju je ta vest navela da pom isli na svoja sve tanja ma ter i
  jalna sred stva. Bio je to Rej kakvog je znala, a ne neki drugi. Bila je uver ena
  da on nije bio svestan te situa cije ili ju je pak smat rao tako neod vojivom od
  svog \u017eivota da je svest o njoj bila tek druga\u010diji oblik pot puno bla\u017eenog
  nezn anja. Ona je u njego voj svesti za uz i m ala prost ora koliko i lako na ka\u0161l
  javanje u kakvom let njem danu. Bilo je dosta ve li kih zadu\u017eenja, nena pla\u0107enih
  ra\u010duna i poreza koje je odavno tre balo platiti. Ad vokat je re citovao bro
  jeve glasom koji je zvu\u010dao kao glas \u010doveka na vlasti. Ukazivao je na posledice,
  na neveselo pren o\u0161enje odgo v ornosi na bra\u010dne drugove. Ra dosno se nas
  me jala i po\u017eelela mu sre\u0107u.\\n\\nA onda je prestao da jede. Posela bi
  ga za sto i hranila ga rukom. Nago v arala ga i pod sticala. Uzimao je malo, pa
  onda sve manje hrane. Pok u\u0161ala je da ga hrani silom, no on je to na j\u010de\u0161\u0107e
  pas ivno odbi jao, tako \u0161to bi okrenuo glavu, ili uzeo hranu pa pustio da mu
  ispadne iz usta ili visi sa usana, ili bljuvao.\\n\\nI sama je po\u010dela da jede
  sve manje. Gledala je u njega i os e\u0107ala da joj se ni\u0161ta ne jede. Tokom
  tri uza stopna dana on nije pojeo gotovo ni\u0161ta, a ona tek malo vi\u0161e od
  toga. Bilo je to nekako prik ladno. Nije da i sama nije razmi\u0161l jala o tome.\\n\\nGledala
  je u njega. Jad ni\u010dak. Pos mat rala ga je sa svom usredsre\u0111en o\u0161\u0107u
  onih prvih tren u taka i \u010dasova, ali je u njoj sada bilo ne\u010deg \u0161to
  je do\u017eivl javala druga\u010dije, nekakve gotovo smr tono sne posve\u0107en
  osti.\\n\\nPonekad bi i\u0161la za njim kroz ku\u0107u. Gledala ga kako spava. Jutra
  zabele\u017eena na traci, pit anja i odgo vori, male pouke i ve\u017ebe pam\u0107enja,
  sve se to sada utap alo u izmaglicu nepovez anog razgo vora a onda i manje vi\u0161e
  obostrano pri hva\u0107enog \u0107utanja. Jednom prilikom nahranila ga je supom
  dok je sedeo na toalet noj \u0161olji. Dani su bili bezbojni i be skon a\u010dno
  dugi.\\n\\nNa kraju je u\u0161la u auto i krenula da se vozi za ba\u010denim putevima,
  po mo\u0107nim putevima, da obil azi mesta na koja niko ne nav ra\u0107a, pa je
  iza\u0161la iz auto mobila i krenula preko ledina do na jvi\u0161e ta\u010dke, bre\u017euljka
  ili padine, odakle je s rukama sk lopljenim oko lica po\u010dela da posmatra predeo,
  tra\u017ee\u0107i gos pod ina Tatla.\\n\\nKako li bi izgledao izdaleka, sa onim
  svojim hodom, stis nu tim, iskrivljenim nekako?\\n\\nKao neko koga bi \u010dovek
  lako mogao i da ne primeti. Kao neko koga u tehni\u010dkom smislu vidi\u0161, ali
  zapravo ne re gis truje\u0161 na onaj uobi\u010dajeni na\u010din koji se mo\u017ee
  pre to\u010diti u iskaz.\\n\\nKao \u010dovek neznan i samom sebi.\\n\\nKao neko
  koga vidi\u0161 i onda za boravi\u0161 da si ga video. Tek tako, istog trena.\\n\\nU
  ku\u0107i nije uspela da prona\u0111e dvogled, a uosta lom, od kakve bi joj kor
  isti bio. On nije bio nigde u okolini. No ona je ipak satima motrila predeo s raz
  li\u010ditih mesta, sa \u0161akama na sle poo\u010dn icama da bi za \u0161titila
  pogled od sunca.\\n\\nKako je takva prekomerna ranjivost mogla da se zatekne sama
  na ovom svetu?\\n\\nZato \u0161to je tako na\u010din jena. Zato \u0161to je ranjiva,
  zato \u0161to je sama. Ili ga ti to vidi\u0161 okren utog naglavce, onako kako o\u010di
  vide pre no \u0161to se ume\u0161a um.\\n\\nOdvezla se natrag do ku\u0107e i lagano
  pro\u0161la kroz nju, prost oriju po prost oriju, jo\u0161 jednom. Pom is lila je
  kako \u0107e se popeti uz ste penice i pro\u0107i kroz hodnik i sti\u0107i do tre\u0107eg
  sprata i prona\u0107i ga u maloj spava\u0107oj sobi u dnu hod nika kako, kao i prvi
  put, u donjem rublju sedi na rubu kre veta.\\n\\nAli kada ga tamo nije bilo, znala
  je da ga ne\u0107e tu prona\u0107i, ako to ima ikak vog smisla. Neko liko koraka
  pre no \u0161to je stigla do vrata znala je da ga tamo ne\u0107e biti, i nije ga
  ni bilo. Znala je to sve vreme.\\n\\nOstalo joj je samo da tumara hod nicima, i
  ose\u0107a kako joj ne dostaje. Bio je nestao tako pot puno da iza njega nije preo
  stalo ni\u0161ta, \u010dak ni zaostali da\u0161ak prisustva, no iako su prost or
  ije oko nje bile prazne, os e\u0107ala je kako ne\u0161to u njenom telu pok u\u0161ava
  da ga tu zadr\u017ei.\\n\\nPo\u010dela je da poziva razne us tan ove, svesna iron
  i\u010dnosti situa cije, i slu\u0161ala je sn im ljene glasove i prit iskala dugmad
  za izbor opcije a ponekad bi izve\u0161ta\u010denim, umer eno za b rinu tim glasom,
  i porazgo varala s nekim.\\n\\nOdredila je sebi dva dana za taj posao. Drugog dana
  po podne porazgo v arala je s up ravnikom odeljenja psi hi jat rije iz jedne male
  bol nice ud aljene nekih sat vremena vo\u017enje prema jugu i ovaj ju je obaves
  tio da je jedan \u010dovek, koji u op\u0161tim crtama donekle odgo v ara opisu,
  preth od nog dana prim ljen kod njih, dok se ne obavi is pit ivanje.\\n\\nNije tra\u017eila
  dod atne de talje. \u017delela je da pover uje da je to on, da brinu o njemu i da
  ga hrane, da je na \u010distom i bezbed nom i snabdeven lekovima - da je kon a\u010dno
  os lobo\u0111en patnje.\\n\\nSamo, za\u0161to bi to bio on? On nije men talno re
  tardiran. Zbog \u010dega li je najpre pom is lila da treba da zove bol nice za umo
  bolne, odmah po\u0161to ga je otkrila? Nije se pon a\u0161ao suma nuto, tek donekle
  omet eno u pogledu artiku la cije i sposob nosti shvatanja. Za\u0161to li je ikada
  pomis lila da u njemu ima ne\u010deg psi hoti\u010dnog, ako ne samo zbog toga \u0161to
  za ljude koji se pon a\u0161aju protivno na\u0161im pre dube\u0111enjima uvek verujemo
  da su ludi.\\n\\nA ipak, to je mogao biti on.\\n\\nImala je neku stvar\u010dicu
  koju je stavl jala u usta, o\u0161tru alatku, malenu, plasti\u010dnu, koju je prit
  iskala uz donji deo jezika i strugala talog koji se tu mogao za d r\u017eati, me\u0161avinu
  hrane, sluzi i bak ter ija.\\n\\nNije to bilo odbrana od pri rod nog de lovanja
  tela. Bilo je to ne\u0161to \u0161to je ona jed nostavno \u010dinila.\\n\\nSra\u010dun
  ala je sve svoje neo phodne po trebe. A onda ih je prema\u0161ila. Dovela je u pit
  anje nji hovu prak ti\u010dnost. To se moralo u\u010din iti. Bilo je nu\u017eno
  pro men iti po javni lik, sve do samog jezika. Pot iskivala je ne\u0161to, za tvarala
  sve pri laze vlastitom bi\u0107u, sve do taloga na dnu jezika, skriv enog od ljud
  s kih o\u010diju. Duh je to nalagao telu.\\n\\nTo je bilo neo phodno zato \u0161to
  je ona os e\u0107ala da mora to da u\u010dini.\\n\\nZato je bilo neo phodno.\\n\\nNjegova
  bu du\u0107nost nije ne\u0161to \u0161to je tek u iz grad nji. Ona je ve\u0107 tu,
  u nju se mo\u017ee u\u0107i.\\n\\nImala ju je na traci.\\n\\nOdbi jala je da pover
  uje da je tako. Bila je to i njena bu du\u0107nost. To jeste i njena bu du\u0107nost.\\n\\nPreslu\u0161ala
  ju je s trake de se tak puta.\\n\\nTo zna\u010di da su ti \u017eivot i smrt ve\u0107
  postavljeni na svoja mesta, i da samo \u010dekaju da za ka\u017ee\u0161 sastanak
  s njima.\\n\\nSlu\u0161ala ga je kako izgo v ara: Ne diraj to. Po\u010disti\u0107u
  kas nije.\\n\\nU pit anju je ne\u0161to o \u010demu ne zna\u0161 ni\u0161ta.\\n\\nA
  onda je i sama izgo v or ila te iste re\u010di, neko liko dana kas nije. I on je
  tada bio kraj nje. Bila je to njena bu du\u0107nost, ne njegova.\\n\\nKoliku koli\u010dinu
  mit skog ugra\u0111ujemo u svoj do\u017eivl jaj vremena.\\n\\nNe diraj to, rekao
  je.\\n\\nZnao je da \u0107e se to do god iti. Bile su to re\u010di koje \u0107e
  kas nije ona izgo v or iti. I on je tada bio kraj nje.\\n\\nPo\u010disti\u0107u
  kas nije.\\n\\n\u017delela je da stvara svoju bu du\u0107nost, ne da ulazi u stanje
  koje je unapred ob likovano prema njenim kon turama.\\n\\nNe\u0161to se doga\u0111a.
  Do godilo se. Tek \u0107e se do god iti. Tako je ona mislila. Postoji tu neka pri\u010da,
  nekakav tok svesnosti i mogu\u0107nosti. Budu\u0107nost u nasta janju.\\n\\nAli
  ne i za njega.\\n\\nOn nije nau\u010dio jezik. Mora biti da postoji neka zam i\u0161ljena
  ta\u010dka, nekakvo ne-mesto u kome jezik ukr\u0161ta puteve s na\u0161im opa\u017eajima
  vremena i prost ora, a on je tu\u0111in na tom raskr\u0161\u0107u, bez re\u010di
  i bez orijenta cije.\\n\\nA \u0161ta je ona znala? Ni\u0161ta. Tako je to uvek kad
  je vreme u pit anju. Ono je ne\u0161to o \u010demu ne zna\u0161 ni\u0161ta.\\n\\nSlu\u0161ala
  ga je kako izgo v ara te re\u010di, na traci, glasom koji je verovatno bio njen
  glas.\\n\\nA mo\u017eda je ona to sve izmis lila, ve likim delom. Ne od samog po\u010detka.
  Ali na knadno da, kroz se\u0107anje.\\n\\nAli, imala je to na traci i to jeste bio
  on i jeste izgo v arao te re\u010di.\\n\\nKas nije ih je izgo v or ila i ona, pa
  \u0161ta s tim. Pa \u0161ta ako je rekla isto to istim re\u010dima.\\n\\nTo ne zna\u010di
  ni\u0161ta. Ljudi katkad izgo v a raju iste stvari.\\n\\nImala ga je sn im ljenog
  na traci, kako to izgo v ara, ali mogu\u0107e je da se ona i nije ta\u010dno se\u0107ala
  \u0161ta je rekla kada je on is pus tio \u010da\u0161u s vodom. Mo\u017eda je to
  bilo ne\u0161to druga\u010dije. Mal\u010dice, malo vi\u0161e, umereno druga\u010dije.\\n\\nPa
  \u0161ta i ako je bilo isto.\\n\\nPro\u0161lost, sada\u0161n jost i bu du\u0107nost
  nisu odlike jezika. Vreme se razmo tava u \u0161avove posto janja. Ono pro\u017eima
  \u010doveka, stvara ga i oblikuje.\\n\\nNe i ako je taj \u010dovek on.\\n\\nOn je
  \u010dovek koji se se\u0107a bu du\u0107nosti.\\n\\nNe diraj to. Po\u010disti\u0107u
  kas nije.\\n\\nKako bi bilo, me\u0111u tim, da o tome razmis li\u0161 met odi\u010dno.
  Budi pametna, pom is lila je, i ra\u0161\u010dlani to hladne glave. Razlo\u017ei
  stvar na delove i pomno razmisli.\\n\\nAko o tome razmis li\u0161 met odi\u010dno,
  shvati\u0107e\u0161 da je re\u010d o re tardir anom \u010doveku, na tu\u017ean na\u010din
  nadar enom u izves nim sasvim poseb nim oblas tima, kao \u0161to je produ\u017eeno
  pam\u0107enje i podra\u017eavanje, \u010doveku koji je neko vreme proveo sakriven
  u jednoj ve likoj ku\u0107i, i slu\u0161ao.\\n\\nSve drugo nema nikak vog smisla.\\n\\nVreme
  je ne\u0161to \u0161to niko ne shvata. Ali ono te stvara i ob likuje. A u no\u0107ima
  posle njego vog odlaska ona je ponekad sedela s kn jigom na krilu, za tvorenih o\u010diju,
  i os e\u0107ala da on \u017eivi negde u tami, i da je tamo gde on \u017eivi hlad
  nije, da je zi m skije, i \u017eelela je da ga uvede unutra, da poku\u0161a da ga
  upozna u onim pre de lima iz kojih vreba njegov haos, u svim za obljenim prost or
  i jama i glagolima koji sve ob ja\u0161n javaju, u vrstama re\u010di u kojima je
  ver ovatno pohranio svoje posto janje, i u onom opipljivom delu gde u njemu \u017eivi
  Rej, iznova \u017eiv, re\u010d po re\u010d, dodir po dodir, a onda bi ot vor ila
  i za t vor ila o\u010di i pom is lila kako se u treptaju oka svet iz menio.\\n\\nOn
  nasr\u0107e na granice ljud skog.\\n\\nJedno vreme nije odgo v arala na tele fon
  ske pozive, kao \u0161to je s vremena na vreme \u010dinila i u prvim danima po pov
  ratku, a kada je ponovo po\u010dela da odgo v ara, javl jala se iz men jenim glasom.\\n\\nMorala
  je da privikava o\u010di na no\u0107no nebo. Odlazila je podaleko od ku\u0107e,
  izvan doma\u0161aja elektri\u010dnog os vetljenja, i nebo je posta jalo dublje.
  Dugo ga je pos mat rala i ono je po\u010delo da se \u0161iri i rastapa i postaje
  jo\u0161 dublje, stva raju\u0107i u sebi slo jeve i mag nitude i svetlosne godine
  nes am er ljive do te mere da je tre balo smi\u0161l jati \u0161a\u0161ave izraze
  da bi se njima ozn a\u010dili nizovi jedin ica i nula i stupn jeva i pro gresija
  jer nas samo jezik kojim se u det injstvu govori pred san mo\u017ee po\u0161tedeti
  od straha i stida.\\n\\nIsprva je taj glas kojim je odgo v arala na pozive bio ni\u010diji,
  neodre\u0111eno ljud ski i sred njeg roda, ali je potom po\u010dela da kor isti
  njegov. Bio je to njegov glas, suv piskav zvuk, \u0161upalj, kao kad ptica pevu\u0161i
  na nekom svom jeziku.\\n\\nBODI ART IN EX TREMIS: USPOREN, OSKUDAN I BOLAN\\n\\nSedimo
  u polutam noj prost or iji na spratu jednog ar apskog kafea u Kem brid\u017eu, i
  Loren Hartke jede salatu od kozjeg sira, ubada je kao da je besna na nju.\\n\\nIzme\u0111u
  za logaja govori o malom per formansu koji je ne davno priredila u jednom prostoru
  nalik na pe\u0107inu, u Bo ston skom umet ni\u010dkom centru.\\n\\nZa po trebe tog
  doga\u0111aja os tvar ila je zapre pa\u0161\u0107uju\u0107u trans form aciju, i
  premda je kratki period njenog iz vo\u0111enja pro\u0161ao, ona i dalje deluje -
  recimo, nekako po tro\u0161eno.\\n\\nNije toliko bleda, koliko bezbojna, be skr
  vna i neodre dive starosti. Sna\u017enih je kostiju i lako izbuljenih o\u010diju.
  Kosa joj deluje ter or isti\u010dki. Nije pod\u0161i\u0161ana ve\u0107 potkres ana,
  a njen pri rodno kesten jast sjaj sada je pepel jastosiv, sa slaba\u0161nim odsevima
  ru\u017ei\u010das tog.\\n\\nAko upo trebim re\u010d \u201ealbino\\\", ho\u0107u
  li ikada mo\u0107i ponovo da ru\u010dam u ovom gradu?\\n\\n\u201eU pit anju je ta\u0161t
  ina. To i ni\u0161ta drugo\\\", ka\u017ee ona. \u201eAli ta\u0161t ina je za glumca
  su\u0161t in ski va\u017ena. Ona je prazn ina. Otuda i poti\u010de ta re\u010d.
  A tome ja stremim i to pok u\u0161avam da iz gradim.\\\"\\n\\nTri de set\u0161es
  to godi\u0161nja Loren Hartke bila je udata za filmskog reditelja Reja Roblsa koji
  je izvr\u0161io sam oubistvo. Njen otac, dr Robert Hartke, nau\u010dnik je koji
  svoje pen zion er ske dane pro vodi kao volonter na ar he olo\u0161kim isko pavanjima
  u egejskoj ob lasti. Njena poko jna majka, \u017denevjev Last, svir ala je harfu
  u Sim fon ijskom orkestru grada Mil vokija. Ima i star ijeg brata, Toda, koji je
  stru\u010dn jak za Kinu u Stejt de part mentu.\\n\\n\u201eNe znam da li je to delo
  dospelo tamo gde sam \u017eelela da dospe\\\", ka\u017ee ona. \u201eJedan njegov
  deo jo\u0161 mi je u glavi, tu se preob likuje.\\\"\\n\\nTo delo, nazvano Telesno
  vreme, u\u0161un jalo se u ovaj grad da u njemu provede tri no\u0107i, bez ikakve
  reklame izuzev usmene, a privuklo je zn ati\u017eeljnu pub liku \u010dija pa\u017enja
  tokom pred stave nije uvek os ta jala na istom nivou. Loren Hartke je o\u010dito
  \u017eelela da njena pub lika oseti kako vreme prolazi, da oseti to u utrobi, i
  to s bolom. Tako je i bilo, no to je one manje re vnosne navelo da napuste pred
  stavu.\\n\\nTakvi su propust ili ono na jbolje.\\n\\nLoren Hartke je kon cep tu
  alna umet nica koja pok u\u0161ava da se oslobodi tela - makar svog sop stvenog.
  Jedan \u010dovek stoji u umet ni\u010dkoj galer iji dok mu kolega is paljuje metke
  u ruku. To je umet nost. Jedan drugi, obil ato tetoviran, stavio je sebi na glavu
  krunu od trnja. I to je umet nost. Ono \u0161to \u010dini Loren Hartke nije ni razmetljivo
  ni autodestrukt ivno. Jedna \u017eena stvara slike na platnu svojom va ginom. To
  je umet nost. Nagi \u010dovek i \u017eena jur i\u0161aju jedno na drugo sve ve\u0107om
