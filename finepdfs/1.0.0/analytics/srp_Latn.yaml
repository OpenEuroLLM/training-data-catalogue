  Obuzima nas bla\u017eenstvo, neko nemo ludilo nas, ne\"", "\"Zabrana odela.\\n\\nTragikomi\u010dna
  blagdanska pri\u010da iz jednog ruskog gradi\u0107a.\\n\\nI.\\n\\nGradani Kolomenke
  u svemu nisu mnogo davali na eleganciju i modu, tokom cele nedelje nisu ni mislili
  nato, da svoj vanjski habitus polep\u0161avaju pomo\u0107u bilo kojih umetnih sredstava.
  Sam \u201egevir\u201c gradi\u0107a, \u017eeljezar Aron Leiser nije na\u0161ao ispod
  svoje \u010dasti, da na vru\u0107e letnje dane stoji pred svojim du\u0107anom u
  ko\u0161ulji, a u zimi u prostom ov\u010dijem ko\u017euhu, oko kojeg bi, poput seljaka,
  opasao konopac. Ta on je bio i ostao Aron Leiser i u ko\u0161ulji ili u selja\u010dkom
  ko\u017euhu.\\n\\nSasvim druga\u010dije na sabat i praznike. Svaki, bio on bogat
  ili siromah, imao je jo\u0161 od vremena ven\u010danja svoj burnus, crno odelo sli\u010dno
  talaru, sa razrezom na stra\u017enjoj i mnogo dugmeta na prednjoj strani. Izgled
  tog sve\u010danog odela bio je ovisan o starosti mu, a i ve\u017ebano oko moglo
  je ustanoviti po broju nabora, krpa, po stanju dugmeta i lakata sa skoro matemati\u010dnom
  ta\u010dno\u0161\u0107u, koliko mu je godina proveo gospodar u vi\u0161e ili manje
  sretnom braku. Ako bi takvo odelo ve\u0107 potpuno izgubilo svoj nekadanji sjaj
  i mladost, te suvi\u0161e napadno pokazivao znakove starosti, pre ostalo bi jo\u0161
  samo jedino sredstvo: Da se odelo odnese kroja\u010du \u0160lojme, koji be\u0161e
  specialista na podru\u010dju okretanja odela. Kao s nekom \u010darobnom re\u010dju
  umeo je, da izno\u0161ena, otrcana odela pretvara u nova novcata. \u0160lojme bi
  sa ljubavlju pravog umetnika prema svom umetni\u010dkom delu izvr\u0161ivao to preobra\u0107anje
  i pretvaranje svih vrednota.\\n\\n*) Mesni religiozni obi\u010daji.\\n\\n\u00bbAko
  imam da napravim nov kaput\u00ab, znao je kazati, \u00bbnu\u010dim se \u0161njime
  sto muka\u00ab! Naime radi kroja. Jer svaki pojedini \u010dovek u Kolomenki imao
  je leda druga\u010dijeg oblika te ramena, koja su bila specijalno samo za doti\u010dnog
  stvorenja. Zato je bilo veoma te\u0161ko na\u0161em kratkovidnom majstoru da mrtvu
  materiju ude\u0161ava prema tim \u017eivim okolnostima. I ako kroj ispade kratak
  ili duga\u010dak, bilo je svakojakih neprihlika. Sasvim druga\u010dije sa okretanjem.
  Rasparati, to je prvo, zatim prevrnuti sa prave strane na nali\u010dje i eto ti
  novog odela, koje se ni u \u010demu nije razlikovalo od pravog novog odela.\\n\\nIstina,
  ni to ne be\u0161e jeftina stvar, jer \u0160lojme je bio \u010dovek \u010dvrstih
  na\u010dela i nije se \u0161njime dalo mnogo govoriti. Imao je utvr\u0111ene cene,
  od kojih ne bi ni\u0161ta popustio, duboko uveren o svojoj umetnosti.\\n\\nAli svet
  koraca ipak napred. I u Kolomenki. Ekonomski polo\u017eaj, konkurencija otvarali
  bi i tu nova podru\u010dja, nove industrije za poduzetne duhove. Jedna od tih novotarija
  u Kolomenki be\u0161e konfekciona radnja, koju otvori jednog vedrog, sun\u010danog
  jutra sefire neki spekulativni duh, upola kroja\u010d, upola trgovac, po imenu Hajim
  Ort\u017ee, domi\u0161ljata glava i nemiran duh, koji mogu\u0107e be\u0161e stvoren,
  da preplovi Okeane, da osvaja zemlje, a sada bi mu su\u0111eno, da uvada u Kolomenku
  konfekcijsku industriju. Po zanatu kroja\u010d, Hajim nije imao nikada pravu volju
  za svoju struku. Vi\u0161e je volio trgovinu i poslove. A poslove bi izmi\u0161ljao
  svakodnevno na tucete. Jednog bi se dana pojavio na pijaci sa tezgom u ruci, daru\u0107i
  se na svakog seljaka, da kupuje lan uz najve\u0107u cenu. Druge bi nedelje stajao
  na pijaci sa kolima, na jednoj bi strani kupovao su\u0161ene glive, \u010dekinje
  itd. od seljaka, dok bi na drugoj strani prodavao istim seljacima soli, masti i
  kolomaza.\\n\\nMudra, domi\u0161ljata glava be\u0161e taj Hajim Ort\u017ee. A kraj
  svega toga, posao mu ipak nije isao najbolje. Po mi\u0161ljenju nekih ljudi bio
  je uzrok tome, \u0161to bi odvi\u0161e \u017eestok i grazmlijiv, jednim mahom htio,
  da osvoji ceo svet. Ali za takve siled\u017eije Kolomenka nije bila prikladno tlo.
  Trgovina bi u Kolomenki isla od vajkada svojim laganim, umerenim korakom.\\n\\nU
  ostalom stvar je dobro otpo\u010dela. I Bog zna, kako daleko bi stigao Hajim Ort\u017ee
  sa svojim izumom, da nije nastupilo ne\u0161to nepredvi\u0111eno.\\n\\nCelo grandiozno
  poduze\u0107e nastrada usled elementarne snage jednog \u010doveka u Kolomenki, a
  to be\u0161e kroja\u010d \u0160lojme. Kako je do toga do\u0161lo, pripoveda\u010du
  vam u slede\u0107em.\\n\\nII.\\n\\nHajim Ort\u017ee nabavljao bi odela iz glavnog
  grada gubernije, koja je udaljena 24 sata sa kolima, a \u010detiri sata sa \u017eeljeznicom.
  Ali po\u0161to je \u017eeljezni\u010dka karta ko\u0161tala 42 kopeka (za\u0161to
  ba\u0161 42, a ne 40 nisu mogli Kolomen\u010dani da shva\u0107aju), pretpostavljali
  bi ljudi ravan broj, te bi se vozili kolima za 25 kopeka. Da je vo\u017enja tako
  trajala sa 20 sata vi\u0161e, to u Kolomenki, gde vreme ni iz daleka jo\u0161 ne
  zna\u010di novac, nije igralo nikakvu ulogu. A na koncu bi se ra\u0111e poverili
  bandiku (kola sa lotrama) nego li \u017eeljeznici. Jer \u017eeljeznicu bila je sve
  u svemu ipak samo mrtva ma\u0161ina, koja je mogla jednom da pukne, a konj bi tome
  nasuprot stigao kona\u010dno ipak sretno i sigurno svome cilju, ma kako se polako
  i mu\u010dno vukao na putu. Jedino Hajim Ort\u017ee vozio bi se \u017eeljeznicom,
  kako to dolikuje pravom trgovcu, a i robu je otpremio u Kolomenki sa \u017eeljeznicom,
  kao sporovoznu robu.\\n\\nA u reklamu bi se razumeo, kao pravi, prefrigani, svetski
  trgovac. Pre svega pozove bahura, koji se hranio kod njega, pa mu nalo\u017ei, da
  izradi jedan oglas, kako bi se svima Kolomen\u010danima glava vrtila, da bi onda
  kao o\u010darani jurili u njegov du\u010dan.\\n\\nNa pola \u017eidovsko-nema\u010dki,
  na pola hebrejski, sa slovima kao \u0161tampanima, trebao je oglas da glasi od prilike
  ovako:\\n\\n\u00bbPo\u0161to je erev jomtof i po\u0161to je velika micva, da se
  kitimo lekovaud jomtof, zato vam ovime maudia, da sami donea iz ir habiro (to \u0107e
  da zna\u010di gubernijski grad) najbolje i najdragocenije begodim za sve ljude,
  mu\u0161karce, \u017eene i decu, minaar vead zoken, taf veno\u0161im bajom eho''d.
  Odela su dodu\u0161e ve\u0107 ne\u0161to no\u0161ena, ali jo\u0161 lep\u0161a, ja\u010da
  i novija od onih, koja se \u0161iju u kehilo kedau\u0161o Kolomenka. A \u0161ta
  se cene ti\u010de, to je sve behaci hinom, a mnogo skoro potpuno hinom\u00ab.\\n\\nTo
  bi bahur sve ukrasio na umetni\u010dki na\u010din sa mnogo \u0161ara u lapidarnom
  stilu. Od svoga bi pisar harmoni\u010dki upleo jo\u0161 mnogo lepih, prikladnih
  citata iz knjiga Megilat Ester, Pesme nad pesmama i Rut te iz Talmuda i Midra\u0161a.
  A zatim je Hajim Ort\u017ee taj oglas dao prikucati pred ulazom starog \u0161ula,
  bet-hamidra\u0161a i ostalih dvaju bogomolja. Nije to islo tako lako i jednostavno.
  Jer put je vodio preko \u0161ama\u0161im, a ovi bi sumnjivo tresli sa glavom: \u00bb\u0160ta,
  oglasivanje starih odela na mestu, gde se ina\u010de objavljuju molitveni red i
  saop\u0161tenja rabina?\u00ab Ali Hajim Ort\u017ee be\u0161e svetski \u010dovek:
  bilo mu je poznata \u010dudotvorna mo\u0107 zve\u010de\u0107e pare. Jedan takav
  komad od tvrdog, crvenog bakra i za oglas be\u0161e osigurano mesto, od kuda je
  najbole padao u o\u010di Kolomen\u010danima.\\n\\nTaj oglas prouzrokovao je u varo\u0161ici
  silno ubu\u0111enje. Najpre bi \u017eene do\u0161le, da razgledaju blago iz \u00bbrezidencije\u00ab
  i da ga zatim kupuju \u00bbbehaci hinom\u00ab ili skoro sasvim \u00bbhinom\u00ab.\\n\\nAli
  posle toga do\u0161li bi i mu\u0161karci. Isprva reservirano i skepti\u010dno, mogu\u0107e
  samo da malo \u00bbrazgledaju\u00ab, ili da kupe jedan prsluk ili hla\u010de. Ali
  ko bi jednom dopao \u0161aka Hajima Ort\u017ee, taj nebi pro\u0161ao tako jeftino.
  \u00bb\u0160ta \u0107e da zna\u010di jedan prsluk\u00ab, upita Hajim \u00bba za\u0161to
  ne odmah i burnus? Nije li to \u010disto badava, 12 forinti? \u0160ta velite, da
  je prekratak? Pa jeste li vi rabin ili hasid, da ga morate nositi do zemlje? Izgledate
  u njemu kao neki kralj..\\n\\n\u010cekajte samo, dok otidem na tavan, da vam donesem
  ogledalo. Pa da vidite kako vam stoji!\u00ab\\n\\nNa taj bi na\u010din zadobio ljude.
  I na cvetni blagdan \u0161eboot be\u0161e cela Kolomenka novo odevena. \u00bb\u0160eta
  je samo, \u0161to su kacputi ne\u0161to kratki,\u00ab tu\u017eili bi se mu\u0161karci.
  Ali, \u0161ta \u010dini, kada su svi gra\u0111ani bili tako odeveni. A kona\u010dno
  \u010dovek je u \u0161ulu ogrnuo talis, te bi tako pokriven taj nedostatak.\\n\\nIII.\\n\\nBilo
  je veselje gledati, kako se Kolomenka okitila na prvi blagdan. Nova odela nasmejana
  lica svuda, kuda pogleda oko. Slojme, koji u toj, ina\u010de za njega najboljoj
  sezoni nije imao nikakvog posla, do\u0161ao bi zvoljan u \u00bbklaus\u00ab i pristupi
  prvome, koji mu padne u \u0161ake, Sa pa\u017eljivim, pomnim okom stru\u010dnjaka
  i malicioznim sme\u0161kom bi motrio ne\u0161to prekratki kaput, \u00bbkoji je stajao
  kao sliven, te bi opipao sukno sa prstima.\\n\\n\u00bbAha, takoder kod Hajima Ort\u017ee?\u00ab
  Tako je i\u0161ao od \u010doveka do \u010doveka, opipao sve redom i svuda dobio
  isti odgovor: \u00bbKod Hajima Ort\u017ee.\u00ab Svi su oni tamo kupili.\\n\\n\u00bbAli
  ipak mislim,\u00ab primeti kroja\u010d sa bunjenom ravnodu\u0161no\u0161\u0107u,
  \u00bbda je za vas prekratak.\u00ab Upitani odvratio bi u neprilici: \u00bbNe\u0161to
  prekratak zato i jeftiniji\u00ab.\\n\\n\u00bbTako jeftiniji,\u00ab usklinke valjani
  majstor, koji nije bio vi\u0161e u stanje da savlada svoj gnjev, \u00bbtako, jeftiniji?
  A gde je \u017didovstvo? He, \u017didovstvo? \u017didovstvo? \u017didovstvo?\u00ab
  Tako bi vikao i sve mu se vi\u0161e raspuli srd\u017eba.\\n\\n\u00bbLe\u017ei li
  \u017didovstvo u delu?\u00ab mrmljao bi drugi nesigurno u svoju odbranu.\\n\\nNa
  to se rasvetli lice kroja\u010da, kao od svetog \u017eara. O\u010di mu sevahu munje
  te stane da vi\u010de gromkim glasom: \u00bbA \u0161ta je sa \u0161atnezom? He \u0161atnez?
  Satnez?\u00ab\\n\\nTako glasno je vikao, da se cela op\u0161tina okupi oko Slojme-a
  \u00bbNe\u00ab uzvikne kroja\u010d izvan sebe, okretaju\u0107i krila omino\u017enih
  kaputa, \u00bbta gledajte sami vlakno i vunu. A \u0161ta mo\u017ee jo\u0161 sve
  da bude u postavi. \u0160atnez, \u0161atnez, \u0161atnez!\u00ab\\n\\nBogomoljce
  obuzne od jednom silan strah. Kao okamenjeni bi stajali na svom mestu, sasvim pokunjeni
  i duboko uvereni o svojoj krivicu, bez jedne re\u010di opravdanja. A Slojme bi besnio
  sve glasnije.\\n\\n\u00bbRado bi samo znao, \u0161ta ka\u017ee k tome na\u0161 rebe.
  Zabranio je, da se na pesah jede gra\u0161ak, ali trefe odela ga ne smetaju. Odmah
  \u0107u oti\u0107i k njemu da ga pitam.\u00ab Jedan trenutak i na\u0161 kroja\u010d
  je bio vani te poleti u veliki \u0161ul, gde su ve\u0107 dovr\u0161ili molitvu.
  Jedino rabin sedeo bi jo\u0161 na svom mestu pevuckaju\u0107i nad svojim foliantima.
  Kao iz drugog sveta, probudi ga promukli glas kroja\u010da: \u00bbCela je op\u0161tina
  odevena u \u0161atnez, a rebe \u010duti tome\u00ab.\\n\\nRabin, malen, suh \u010dovek
  u duga\u010dkom crnom kaftanu zadrtao bi do vrha prstiju i pogleba Slojme-a za\u010dudeno,
  bez razumevanja.\\n\\n\u00bb\u0160ta zna\u010di to \u0161atnez. Jao meni! Kako!
  Ko? Na koji na\u010din?\u00ab\\nSada se ispostavilo, da rabin nije imao ni pojma
  o poduze\u0107u\\nHajima Ort\u017ee. Ali po saslu\u0161anju stru\u010dnog nalaza
  \u0160lojmea do\u0161le\\nbi mu suze u o\u010di i re\u010de izvan sebe: \u00bbSvakako
  je to \u0161atnez.\\nPa \u010dak i onda, ako nebi sve tako bilo, kako vi mislite.
  Odela,\\nkoja dolaze iz daleka, kod kojih se nezna, ko ih je pravio i\\nkako su
  sa\u0161ivena... To je dovoljno\u00ab.\\n\\nJo\u0161 istog dana u ve\u010der stane
  \u0161ames na almemor te udari\\ndlanom na sto, tako sna\u017eno i ljutito, kao
  \u0161to je obi\u010davao \u010diniti\\nsamo prilikom najva\u017enijih obnarodovanja.\\n\\nA
  zatim re\u010de gromkim glasom:\\n\\n\u00bbPo nalogu rabina: Na gotova odela kupljena
  kod Hajima\\nOrt\u017ee udaren je veliki isur (zabrana). Svaki, koji bi ih dalje\\nnosio,
  po\u010dini te\u017eak greh\u00ab.\\n\\nI na drugi dan praznika pojavlje se bogomoljac
  pognute\\nglave u svojim starim, otrcanim kaputima, na kojima se moglo\\nizra\u010dunati
  godine provedene u bra\u010dnom jarnu.\\n\\nA \u0160lojme, na\u0161 kroja\u010d,
  be\u0161e zadovoljan. I\u0161ao bi sa sme\u0161kom\\nvelikodu\u0161nog pobednika
  na licu od \u010doveka do \u010doveka, opipao bi\\nstara odela pa ih te\u0161io:\\n\\n\u00bb\u0160ta
  fali tom burnusu? Da je ne\u0161to izble\u0111en? Pa zato ima\\nsve svoje dve strane...
  Donesite mi ga samo posle blagdana. Ne\u0107u\\nda Vas ucenim, tako mi Boga\u00ab.\\n\\nI
  u uzvi\u0161enom \u010duvstvu, da je celu op\u0161tinu odvratio od te\u0161ke\\nnepravde,
  otide na\u0161 kroja\u010di\u0107 na svoje mesto, da obavi svoje\\nmolitve, duboko
  uveren, da je dvostruko zavredio da mu molitva\\nbude usli\u0161ana.\"", "\"KAKO
  STVARNO VOLETI SVOG TINEJD\u017dERA\\n\\nPreporu\u010dujem vam da pro\u010ditate
  ovu knjigu pre nego \u0161to va\u0161a deca postanu tinejd\u017eeri. Ovo je veoma
  prakti\u010dna knjiga koju \u0107ete \u010ditati ponovo i ponovo dok budete prolazili
  kroz tinejd\u017eerske godine va\u0161e dece.\\n\\nFiona Kasl\\n\\nOvaj svetski
  poznati bestseler je dopunjen i pro\u0161iren novim informacijama o ljutnji, nedostatku
  pa\u017enje i duhovnoj brizi.\\n\\nPored toga, dr Kembel nudi ideje koje vam mogu
  pomo\u0107i da stvorite solidan i uravnote\u017een pristup u odnosima s va\u0161im
