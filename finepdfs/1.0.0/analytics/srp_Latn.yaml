  Godine 2008, dobio je Orden \u010dasti Nacion al nog udru\u017eenja umet nika, za
  izuzetno os tvar enje u knji\u017eevnosti. Na grada PEN/Sol Belou, u \u010dijem
  \u017eiriju je Filip Rot, za posebna dostignu\u0107a u amer i\u010dkoj knji\u017eevnosti
  dodeljena mu je 2010. godine, a dob it nik je i no vous tan ovljene Nagrade za amer
  i\u010dku be letristiku Kon gresne bib li oteke u 2013. godini, koja se dodeljuje
