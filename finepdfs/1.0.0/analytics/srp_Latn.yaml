  prema tinejd\u017eerskoj depresiji i kako da svom tinejd\u017eeru pomognete u duhovnom
  i intelektualnom napretku.\\n\\nDr Ros Kembel govori iz li\u010dnog iskustva, kao
  otac dvojice sinova i dveju \u010derki, kao i na temelju svojih \u010destih predavanja
  o odnosima roditelj-dete.\\n\\nOn radi kao vanredni profesor na odseku za pedijatriju
  i psihijatriju na Univerzitetu dr\u017eave Tenesi. Napisa\u043e je jo\u0161 jednu
  bestseler knjigu Kako stvarno voleti svoje dete.\\n\\nNaslov originala: How to Really
