  dr\u017eala po strani od njihove patnje, koliko si \u010desto \u0161tedela sebe,
  i kako si tek u retkim prilikama otvarala srce, sva predata gra\u0111enju svojih
  sis tema uz i manja i dav anja.\\n\\nBila je privr\u017eena ovim ide jama u svim
  vidovima svoga posto janja. U o\u010dima, duhu i telu. Kretala se blagim strmi n
  ama grad s kih ulica neprime\u0107ena, nose\u0107i u sebi te ideje, kupovala namir
  nice i posu\u0111e i poigravala se tim mis lima do izvesne granice, u duga\u010dkom
  hod niku, me\u0111u bravama, al atkama i staklenim pred me tima.\\n\\nZa\u0161to
  te njegova smrt ne bi uter ala u pot puno skan dalozni sr ce paraju\u0107i jad?
  Zbog \u010dega bi tre balo da se pri la godi\u0161 njego voj smrti? Ili da joj se
  stis nutih usana pokori\u0161 u ot menoj patnji? Zbog \u010dega bi ga se tre balo
  odre\u0107i, ako ve\u0107 mo\u017ee\u0161 da pro\u0111e\u0161 kroz taj hodnik i
  prona\u0111e\u0161 na\u010din da ga nekako u\u010dini\u0161 dos tupnim?\\n\\nPotoni
  dublje, pom is lila je. Pusti da te satre. Idi tamo kuda te povede.\\n\\nPonekad
  je razmi\u0161l jala na takav, pokreta\u010dki na\u010din - obra\u0107ala se nekom
  ko nije bio ba\u0161 sasvim ona, a ponekad na druga\u010dije na\u010dine.\\n\\nRazmi\u0161l
  jala je kroz lica, prisutna tu u vazduhu, kroz lice onog malog nesta log \u010doveka
  kad god bi uspela da ga se seti, tu odmah ispred njenih upalih o\u010diju.\\n\\nJa
  jesam Loren. Ali sve manje i manje.\\n\\nKad je iza\u0161la iz auto mobila, tamo
  je stajao neki \u010dovek. Nije jo\u0161 bila sasvim iza\u0161la, jo\u0161 je napola
  bila unutra, ba\u0161 je po\u010din jala da se uspravlja, a nad njom se na tom pri
  laznom putu nad vila jedna pri lika.\\n\\nMalo je ne dosta jalo da padne natrag
  u sedi\u0161te. Bio je to tren u tak pot pune pren er a\u017een osti. Podigla je
  pogled ka njemu, krupnom \u010doveku, sredove\u010dnom, koji joj se obra\u0107ao.\\n\\nKada
  se pot puno us pravila, opazila je njegov auto mobil, parkiran pored ku\u0107e.
  Os lu\u0161nula je njegove re\u010di. Pok u\u0161ala je da ga saslu\u0161a i shvati
  situa ciju, da pre cizno odredi njene granice.\\n\\n\u201eUveravam vas da nisam
  hteo da se name\u0107em. Neko liko puta poku\u0161ao sam da po zovem tele fonom.
  Nije bilo odgo v ora. Ja to pot puno ra zumem. Do\u0161li ste ovamo da biste pobegli
  od svega onoga.\\\"\\n\\n\u201e\u0410 vi?\\\"\\n\\nSada je ve\u0107 bila srdita.
  Onaj utisak ugro\u017een osti, ona pret nja, lagano su po\u010deli da blede. Strah
  je po\u010deo da joj se rastvara u telu, da ulazi u kr vo tok i nervna vlakna, u
  vrhove prstiju, i ona sna\u017eno zalupi vrata, za t vori ih sna\u017enim zama hom.\\n\\n\u201eDa
  porazgo v aramo o ku\u0107i\\\", re\u010de on pomalo su zdr\u017eano. \u201e\u010cini
  mi se da je to jo\u0161 moja ku\u0107a. Moje \u017eene i moja.\\\"\\n\\nUz makao
  je za korak i izvio se da pogleda ku\u0107u, da je i ma ter i jalno uvede u taj
  razgo vor - svoju ku\u0107u. Sada kada ju je pogledao, vi\u0161e nije moglo biti
  sumnje.\\n\\n\u201e\u0410 \u017eelite i da raspravimo jedan prob lem.\\\"\\n\\n\u201eTa\u010dno
  tako\\\", re\u010de on i pritom se nekako za japuri, zado vol jan zbog toga \u0161to
  je ona shvat ila o \u010demu je re\u010d.\\n\\nOboje na kratko za \u0107uta\u0161e.
  \u010covek je de lovao pomalo iznureno, kao da mu se zamor talo\u017eio god i n
  ama.\\n\\nOna re\u010de: \u201eK\u043e koga treba da pozove unutra?\\\"\\n\\nOn
  podi\u017ee ruke.\\n\\n\u201eNema po trebe. Nisam ni pom is lio. Ne, ne, apsolutno.\\\"\\n\\nZatim
  se nas meja na njenu primedbu. Kon a\u010dno je uspeo da je shvati i nas me jao
  se, otkriv\u0161i sive zube. Ona je \u010dekala. Po\u010delo je da joj biva zan
  im ljivo. Po\u010dela je da ose\u0107a da se nekako uklapa u sve to, da joj je ugodno
  tu na polju, na pri laznom putu, sa vlas nikom ku\u0107e.\\n\\n\u201eOnda, da li
  ste zado voljni boravkom?\\\"\\n\\n\u201eMislim, uglavnom, da.\\\"\\n\\n\u201eJer
  ako mogu ne\u0161to da.\\\"\\n\\n\u201eNe, sve je u redu. Sobe.\\\"\\n\\n\u201eDa.\\\"\\n\\n\u201eSobe
  i sobe.\\\"\\n\\nBilo je hladno. Pitala se da li bi tre balo da bude tako hladno.\\n\\n\u201eDa\\\",
  re\u010de on. \u201ePorodi\u010dna svojina. Da ka\u017eemo, odva jkada. Ali odr\u017eavanje.\\\"\\n\\n\u201eMogu
  da zam is lim.\\\"\\n\\n\u201eMnogo rada, pa\u017enje. Oduvek su tu \u017eivele
  velike porodice, moram da ka\u017eem. I onda be skra jno, znate, ren ov ir anje,
  kre\u010denje. Uvek ima ne\u0161to za \u0161ta se treba pobrinuti.\\\"\\n\\n\u010cekala
  je da u toj pri\u010di spo mene Almu, svoju \u017eenu, i \u010din jen icu da su
  deca odrasla i oti\u0161la da \u017eive negde drugde.\\n\\n\u201eU stvari, nadali
  smo se.\\\"\\n\\nTelo mu se pro te glo, izvilo navi\u0161e i nekako ukoso u tom
  epi fanijskom tren utku oz ar enog i\u0161\u010dekivanja. Kroz taj pokret, sagledala
  ga je kao \u010doveka koji pok u\u0161ava da se isko belja iz stidljivosti i sa
  petosti kojima je \u010dita vog \u017eivota bio okovan.\\n\\n\u201eDa ne\u0107ete
  imati ni\u0161ta protiv.\\\"\\n\\nSlu\u0161ala ga je, gotovo je videla njegove re\u010di,
  i nekako joj je postao dra\u017ei, i os etila se pri jatno probu\u0111enom, kao
  da je \u010ditavim bi\u0107em prisutna u tom tren utku.\\n\\n\u201eDa.\\\"\\n\\n\u201eZnate,
  ima jedna komoda. Sme\u0161tena je u nekoj od soba na spratu. Mislim da je i umotana.
  Ver ovatno je umotana u onaj jas tu\u010dasti omota\u010d koji se kor isti za te
  stvari. Mo\u017eda ste i nai\u0161li na nju. Jer nju je tre balo odneti, uto var
  iti, a onda nekako, pa, znate da ne ide uvek sve onako kako je zam i\u0161ljeno.
  To je fini komad name\u0161taja, dvodelni, i prili\u010dno star.\\\"\\n\\nNije to
  ono \u0161to je tre balo da ka\u017ee.\\n\\n\u201eJedna od onih nekor i\u0161\u0107enih
  soba na na jvi\u0161em spratu, prekriv ena \u010dar\u0161avima. E, sad, ono \u0161to
  bismo mi hteli.\\\"\\n\\nPrimetila je \u017eilice krvnih sudova na njego vom licu,
  krupan \u010dovek, da, i sve star iji, ko\u017ea po\u010dinje da mu se ras te\u017ee,
  podo\u010dn jaci se produbljuju, a tre balo je valjda da ka\u017ee ne\u0161to i
  o gos podinu Tatlu, zbog \u010dega je nestao i kuda je oti\u0161ao i sve drugo \u0161to
  je mo\u017eda tre balo re\u0107i o tom \u010doveku, ra\u0161\u010distiti stvari,
  ob jas niti i ra\u0161\u010dlan iti.\\n\\n\u201eJeste to da po\u0161aljemo nekoga
  da je uzme, i nadam se da nam ne\u0107ete zamer iti zbog uznemiravanja. Pok u\u0161ali
  smo da se javimo tele fonom, a zvala je i ona \u017eena, ona iz agen cije za nekret
  nine. To je stari porodi\u010dni komad name\u0161taja. Po\u017eeleli smo da ga preradimo
  i smes timo u na\u0161u spava\u0107u sobu, u na\u0161u ku\u0107u. Ve\u0107 neko
  vreme pri\u010damo o tome. U na\u0161u sada\u0161nju ku\u0107u, nara vno. Ali kad
  se sve uzme u obzir.\\\"\\n\\nBojao se da za\u010duti po\u0161to ona nije pokazivala
  nikakav nagov e\u0161taj reak cije i de lovalo je kao da se nekako odvaja od \u010dita
  vog tog pri zora. On uzma\u010de za korak i napravi jo\u0161 jedan poluokret te
  njih dvoje osta\u0161e da stoje na toj hlad no\u0107i, vlas nik ku\u0107e i za k
  upac na pri laznom putu, neodre\u0111eno zagledani u ku\u0107u.\\n\\nPok u\u0161ala
  je da se seti kako je izgledao i u tom tren utku je zaboravila njegovo ime. Ali
  samo na tren. Bilo je to samo na tren, a to uosta lom i nije bilo njegovo ime. Bilo
  je to ime koje mu je ona nadenula.\\n\\nSlede\u0107eg jutra, \u010dula je \u0161um.\\n\\nZnala
  je da je sedam i dvade set, ili tu negde, i pogledala je na sat u kuh inji. Toliko
  je i bilo.\\n\\nIstog tren utka shvat ila je da to nije onaj \u0161um sa tre\u0107eg
  sprata. Bio je druga\u010diji, nije se \u010duo u tako vi sokom delu ku\u0107e,
  i bio je manje prigu\u0161en no ranije.\\n\\nLaganim korakom pro\u0161la je kroz
  sobe, znala je da \u0107e se to po javiti na takav na\u010din, kao kakvo rit mi\u010dko
  ponavl janje, uob li\u010deno mu\u0161kim glasom, njegovim, i ono joj je odre\u0111ivalo
  ritam koraka uz ste penice i odmer ilo dodir ruke na na jvi\u0161em stubu ste pen
  i\u0161ne ograde. Do\u0161lo mi je da sam ovde. Zato \u0161to je tako pusta, ova
  obala u ovo doba godine, i zato \u0161to je svaki put morala da dotakne taj vrh
  stuba.\\n\\nPro\u0161la je pored odmor i\u0161ta i u\u0161la u pred soblje, os e\u0107ala
  je ono \u0161to je os e\u0107ala, os e\u0107ala se izlo\u017eeno, otvoreno, moglo
  bi se re\u0107i nekako ogoljeno, ako to i\u0161ta zna\u010di, i sa svakim svojim
  korakom bila je svesna sveta.\\n\\nZnala je kako \u0107e se to do god iti, dok je
  u auto mobilu prolazila pored table s nat pi som NOVI I PO LOVNI, pored ku\u0107a
  s drvima za ogrev poslaganim u \u0161upama i prekriv enim plavim ciradama ispred
  gara\u017ea i ambara. Vrati\u0107e se ku\u0107i pored nat pisa \u0160LEP SLU\u017dBA
  i AUTO DELOVI i pope\u0107e se uz ste penice i pro\u0107i kroz pred soblje na drugom
  spratu, u ritmu onog zvuka, uz nastojanje da se pri la godi telu koje je upravo
  posta jalo njeno.\\n\\n\u010cula ga je u svojim grudima i u grlu, njegov hipnoti\u010dki
  govor, i pri\u0161la je vratima svoje sobe, spava\u0107e sobe, koja i nije bila
  sme\u0161tena u najvi\u0161em delu ku\u0107e. U sobi iznad nje nalazio se samo jedan
  orman, prekriven \u010dar\u0161avima jo\u0161 pri likom un o\u0161enja. Njegovo
  vreme bilo je ovde, njegova mera ili di men zija ili kakvim god te\u0161ko skovanim
  izrazom \u017eelite to da nazovete.\\n\\nBila je sto struka budala. Kretala se prema
  tim vratima i bila je budala na ovaj i na onaj na\u010din, ali ne i u svojoj sobi,
  u koju je dospela voze\u0107i pored nat pisa AUTO SERVIS i NOVI I PO LOVNI, i pored
  drva za ogrev prekriv enih plat nom i cira dom, jer tu je Rej posto jao ne taknut,
  u svom stvarnom telu, s dimom u kosi i ode\u0107i.\\n\\nZnala je kako \u0107e se
  to do god iti, ve\u0107 je bila pre stala da zam i\u0161lja, po\u0161to je odbi
  jala da se pokori gran icama ver ovanja.\\n\\nKad u\u0111e u sobu, ona \u0107e ve\u0107
  biti tu, sada, usred no\u0107i, ba\u0161 u tom tren utku \u0107e se svla\u010diti.
  Po trebno je samo da se pri la godi tom trenutku, u kome svla\u010di po hab ani
  d\u017eem per, le\u0111ima okren uta kre vetu. Stoji bo sonoga, izvla\u010di ruku
  iz d\u017eem pera i \u0161akom udara u ne\u0161to iznad glave. Dose\u0107a se vise\u0107e
  svetiljke, pot puno neprik ladne za tu prost oriju, metalni aba\u017eur se nji\u0161e,
  i ona se okre\u0107e i gleda, znaju\u0107i un apred \u0161ta \u0107e videti.\\n\\nOn
  sedi na ivici kre veta u donjem rublju, i pri p aljuje svoju posled nju ci gar etu
  toga dana.\\n\\nZar zaista ne mo\u017ee\u0161 da zam is li\u0161 takav prizor, \u010dak
  i kada ga vidi\u0161?\\n\\nDa li je to \u0161to se doga\u0111a toliko izvan polja
  iskustva da mora\u0161 da mu pronalazi\u0161 opravdanja, ili da ga na jeftin na\u010din
  ob ja\u0161n java\u0161 kao obmanu \u010dula?\\n\\nDa li je stvarnost i suvi\u0161e
  mo\u0107na za tebe?\\n\\nOdva\u017ei se. Poveruj u ono \u0161to vidi\u0161 i \u010duje\u0161.
  U tome se krije klica svih sk rovitih nagov e\u0161taja koje si ikada os etila na
  rubovima svog \u017eivota.\\n\\nU sobi su dva stvarna tela. Tako ih ona ose\u0107a,
  u onom ras- cepljenom srcu polusekunde koja joj je po trebna da bi pro\u0161la pored
  dov ratka, s rukama koje se dodiruju i miluju i usnama koje se lagano razmi\u010du.
  Kita mu se di\u017ee u njenoj op u\u0161tenoj ru\u017ei\u010dastoj pes nici. Usta
  su im rastvorena, spremna za jezike, bra da vice, prste, za sve isturene delove
  tela, za \u0161apat o onome \u0161to je bilo i \u0161to jeste, a o\u010di im se
  \u0161irom otva raju da bi se jedno drugom zagledali u du\u0161u.\\n\\nZa stala
  je na samom pragu, svesna izraza na svom licu.\\n\\nDo sada su svakako ve\u0107
  odspavali i probudili se i si\u0161li na dor u\u010dak, i ve\u0107 se svako probija
  kroz svoju rutinu, sipa mleko ili mu\u0107ka sok, jedna kreja ih pos matra sa hranilice,
  a ona miri\u0161e gran ule soje iz kutije. Ni\u0161ta na svetu nije jed nostavn
  ije nego da iza\u0111e i ode do njego vog auto mobila, uzme klju\u010deve tog auta
  i sakrije ih, uni\u0161ti, izobli\u010di, pojede, zakopa ih u ispo\u0161\u0107eno
  tlo u krep kom i jarkom danu poznog leta, posle sna\u017ene oluje.\\n\\nAli pre
  no \u0161to je za kor a\u010dila u sobu, os etila je kakav izraz ima na licu. Znala
  je taj izraz, oka men jeni lik la\u017enog i\u0161\u010dekivanja.\\n\\nZa stala
  je na neko liko \u010dasaka, i zam is lila se o tome. Za stala je na pragu sobe,
  licem okren uta prema pred soblju, i os etila prazninu oko sebe. U tom tren utku
  sru\u0161ila se na pod, le\u0111ima os lon jena o dov ratak. Sru\u0161ila se nekako
  zgr\u010deno, po lagano, gotovo zam i\u0161ljeno, i ot vor ila je usta, oh, u jauk
  koji je ostao bez glasa. Sela je na pod ispred sobe. Kao kakav ukras na licu, u
  o\u010dima je jo\u0161 nosila trag o\u010dekivanih \u010dudesa. Taj izraz lica tako
  je slobodno lebdeo pred njom da je mogla da naduva obraze, kao dete, i da ga oduva.\\n\\nPom
  is lila je kako nema razloga da pogleda unutra. Bilo je pat eti\u010dno pogled ati.
  Soba je bila okren uta prema istoku i bi\u0107e uron jena u jut arnju svetlost,
  u naslage pau\u010dine i zrake os un \u010dane pra\u0161ine i u re\u010d motes,
  koju je njena mati tako rado kor istila.\\n\\nMo\u017eda je sve to bilo tek erot
  ska san jar ija. Kao grad sagra\u0111en radi jedne ne\u010diste misli. Obuzela ju
  je sek su alna his ter ija, ha. S tim \u0161to ona nije ver ovala u to.\\n\\nSedela
  je tako, i razmi\u0161l jala o ravnodu\u0161nosti svoje odluke. Zatim se us pravila
  uz dov ratak, lagano, duboko di\u0161u\u0107i, le\u0111ima os lon jena o izbrazdano
  drvo, zgr\u010deno se pod iz ala, pro te\u017eu\u0107i taj \u010din \u0161to du\u017ee
  u vre menu. Majka joj je umrla kad joj je bilo devet godina. Nije to bilo njena
  krivica. Ona s tim nije imala nikakve veze.\\n\\nSoba je bila prazna kada je pogledala
  u nju. Tu nije bilo nikoga.\\n\\nSvetlost je bila tako sna\u017ena da je mogla da
  vidi prave boje zidova i poda. Nikada do tada nije videla te zidove. Postelja je
  bila prazna. Sve vreme je znala da \u0107e biti prazna ali je ipak hitala ka njoj.
  Pogledala je \u010dar\u0161av i \u0107ebe zgu\u017evano na njenoj strani postelje,
  jedinoj strani koja se kor istila.\\n\\nU\u0161la je u sobu i pri\u0161la pro zoru.
  Ot vor ila ga je. \u0160irom je ot vor ila prozor. Nije znala zbog \u010dega to
  \u010dini. A onda je shvat ila. \u017delela je da na licu oseti opori miris mora,
  a u telu protok vremena, da tako sazna ko je ona zapravo.\\n\\nza balkan down load.org
  Thalia\\n\\nBELE\u0160KA O PISCU\\n\\nDon DeLilo, spada u red na jzn a\u010da jn
