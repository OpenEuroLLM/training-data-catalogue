  voda Va\u013cdis s\u0113dis i B\u012bdreibys K\u016bpsapu\u013ccis,\\n7.1.4. dorboj\u0101s
  B\u012bdreibys vuord\u0101, puorstuov j\u016b vysuos t\u012bsu i administrativajuos
