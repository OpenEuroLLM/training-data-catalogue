sample: '["\"Piektdiena, 31. marts, 2023 PROJEKTS.  TV programma Demokrateja nav id
  eala, tok lobuokys puorva\u013cdis formys nav Roksta autore: Laura Melne, portals
  lakuga.lv .\\n\\nka reidzin\u012bki d\u016bmuoja, ka vysi Latgol\u0101 ir n\u016bzomb\u0101ti
  ar Kr\u012bvejis propagandu. Tai nav, i nadreikst taid\u016bs lel\u016bs vyspuorynuojum\u016bs
  d\u016bmuot.\\n\\nPaguoju\u0161aj\u0101 god\u0101 daudzi, \u012bspiejams, pat pyrm\u016b
  reizi pa eistam n\u016bviert\u0113ja t\u016b, ka dzeivojam demokratisk\u0101 va\u013cst\u012b.
  Nu \u016btrys pusis, izskan\u0113ja ari daudz kritikys. P\u012bm\u0101ram, kai var
  Saeim\u0101 \u012bviel\u0113t, \u012bspiejams, va\u013cstei nalojalus puorstuovus.
  Kaidi ir demokratejis r\u016bbe\u017ei? Publicit\u0101tes foto\\n\\nNav n\u016bsl\u0101pums,
  ka pres\u0113 pasaruoda informaceja par kaidim politiskajim omotim i cylv\u0101kim,
  kas nav pateikama. Bet Latvej\u0101 ir institucejis, kuru dorbs ir tam sekuot leidza.
  \u017durnalistim, medejim ir c\u012b\u0161i svareigs dorbs t\u016b izgaismuot, paruodeit.
  Pyls\u016bniskajai sab\u012bdreibai, cylv\u0101kim, kuri po\u0161i dzeivoj Latgol\u0101,
  ir juorunoj par tom l\u012btom, bet es d\u016bmoju, ka nabyutu labi mums pasaceit,
  ka jius t\u012b Latgol\u0101 vysi asat taidi voi itaidi. Cylv\u0101kim var byut
  daudzys identitatis, Latgol\u0101 tuos ir c\u012b\u0161i sajauktys, t\u012b ir latgal\u012b\u0161i,
  latv\u012b\u0161i, kr\u012bvi, p\u016bli, ebreji, bet golvonais, ka tim cylv\u0101kim
  ryup sova zeme, ryup Latgola i Latveja, ka j\u012b gryb dzeivuot demokratisk\u016bs
  vierteibu telp\u0101. T\u012b Reigys ska\u013cruni na vysod aizasn\u0101dz leidz
  Latgolai, bet tam ir \u012bmeslis \u2013 varbyut j\u012b runoj taid\u0101 vol\u016bd\u0101
  voi bols\u0101, kas nav interesants. Cik daudz t\u012b gudr\u012b kritiz\u0101tuoji
  po\u0161i ir aizbrauku\u0161i iz Latgolu i parunuoju\u0161i ar cylv\u0101kim!?\\n\\nIt\u016bvosor
  jau deveit\u016b reizi Cies\u012bs n\u016btiks Sarunu festivals LAMPA. V\u012bns
  nu tuo principu i mierku ir sarunu kulturys k\u016bp\u0161ona i dialoga veiduo\u0161ona
  sab\u012bdreib\u0101. Ar festivala direktori i fonda atv\u0101rtai sab\u012bdreibai
  DOTS izpylddirektori Ievu Moricu dr\u016bsai var komunic\u0113t ari latgaliski \u2013
  tei ir juos mamys dzymtuo vol\u016bda, i Ieva ari po\u0161a breineigi tam\u0101
  runoj, jo bierneibys vosorys pavadejuse Aglyunys pus\u0113.\\n\\nLatveja demokratejis
  indeks\u016bs nav zam\u0101 v\u012bt\u0101. Saleidzynoj\u016bt ar daudzom cytom
  va\u013cstim, asam lob\u0101 situacej\u0101. Mums vysim ir \u012bspiejis byut demokratim
  ar sovu reiceibu \u2013 \u012bt iz vielie\u0161onom, interes\u0113t\u012bs par politiskajom,
  ekonomiskajom i socialajom n\u016brisem, p\u012bsadaleit breivpruoteigajuos kusteibuos,
  nava\u013cstiskajuos organizacejuos voi paleidz\u0113t leidzcylv\u0101kim, ko\u010d
  voi interes\u0113t\u012bs par t\u016b, kas n\u016bteik sov\u0101 s\u0101t\u0101
  i pogolm\u0101. Po\u0161im \u012bjimt aktivu i atbi\u013cdeigu poziceju. Pa munam,
  demokrateja ir c\u012b\u0161i ikd\u012bni\u0161ka cylv\u0101ku sasarunuo\u0161onys
  i l\u0101mumu p\u012bjim\u0161onys forma. Kai cyts pret cytu izatur \u2013 v\u012bnleidzeigai,
  ar c\u012bnu voi nu varys autoritarom pozicejom? Demokrateja princip\u0101 ir taida
  horizontala, v\u012bnleidzeiga, c\u012bnpylna sazinis forma i l\u0101mumu p\u012bjim\u0161ona
  sab\u012bdreib\u0101. Mes kotrs t\u016b varim praktiz\u0113t sov\u0101 ikd\u012bn\u0101.\\n\\nSkaidrs,
  ka mes tagad dzeivojam apdraudiejuma apstuok\u013c\u016bs. Izaicynuojumu ir c\u012b\u0161i,
  c\u012b\u0161i daudz. Tym\u0101 po\u0161\u0101 laik\u0101 ir ko\u010d kaidys stabilys
  vierteibys, p\u012bjimsim, lykuma vara, kas demokratej\u0101 ir c\u012b\u0161i svareigs
  elements. Kod mes d\u016bmojam par kaidu cylv\u0101ka breiveibu voi t\u012bseibu
  \u012br\u016bbe\u017euojumu, mums kai demokratisk\u0101 va\u013cst\u012b ir juosaver
  iz lykuma varu, t\u016b, ka l\u0101mumi teik p\u012bjimti lykumisk\u0101 kuorteib\u0101
  \u2013 izsv\u0101rti, balans\u0101ti, ari sal\u0101goj\u016bt da\u017eaidys interesis
  sab\u012bdreib\u0101. Skaidrs, ka mes vysi naasam v\u012bnaidi, ir cylv\u0101ki,
  kuri d\u016bmoj cytai\u017euok, i j\u012b ari \u012bt iz vielie\u0161onom. Ir juosaver,
  kas ir voi nav p\u012b\u013caunams demo kratiskaj\u0101 telp\u0101. P\u012bm\u0101ram,
  ari vuorda breiveiba nav na\u012br\u016bbe\u017euota. Tys ir c\u012b\u0161i pla\u0161s
  jiedz\u012b\u0146s, bet, p\u012bjimsim, apmaluo\u0161ona, maldynuo\u0161ona, aicynuojumi
  iz vardarbeibu, naida runa nateik aizsorguota ar vuorda breiveibu. Vysod ir r\u016bbe\u017ei,
  bet ir c\u012b\u0161i svareigi, lai t\u016bs \u012bv\u0101ruo\u0161ona n\u016bteik
  lykumeig\u0101 kuorteib\u0101.\\n\\nSarunu kulturys ce\u013c\u0161ona ir v\u0113\u013c
  v\u012bna l\u012bta, ar k\u016b n\u016bsadorboj fonds DOTS. Nu jiusu saceituo sapr\u016btu,
  ka mums v\u0113\u013c ir daudz kur augt itam\u0101 zi\u0146\u0101. V\u012bna nu
  l\u012btu, kam v\u0101rts p\u012bv\u0113rst uzmaneibu, ir dialoga styp-\\n\\nJius
  struodojat fond\u0101 DOTS, kura v\u012bna nu miseju ir styprynuot demokratejis
  kvalitati Latvej\u0101. Kaida mums Latvej\u0101 it\u016b\u0161a\u013ct ir situaceja
  ar demokrateju? Ka cylv\u0101kim prosa, voi ir kaida cyta \u012bkuorta, kur\u0101
  j\u012b gry-\\n\\nPasacei\u0161u g\u016bdeigai, es d\u016bmoju, ka reidzin\u012bkim
  (i sevi itam\u0101 situacej\u0101 pi t\u016bs p\u012bskaitu), kas ikd\u012bn\u0101
  nadzeivoj Latgol\u0101 i nav \u012b\u0161k\u0101 tuos l\u012btuos, nav gaumeigai
  daudz kritiz\u0113t i koment\u0113t, part\u016b ka mes nazynim, kaida ir dzeive
  iz v\u012btys. Zynu, ka aktivim cylv\u0101kim Daugovpil\u012b beja c\u012b\u0161i
  aizvainoj\u016b\u0161ai, b\u0101tu dzeivuot, j\u012b soka, ka nav. Tym\u0101 po\u0161\u0101
  laik\u0101 demokratejai teik ve\u013cteita kritika, kas, pa munam, na vysod ir pamatuota.
  Juosapr\u016bt, ka demokrateja nav recepte laimeigai dzeivei, bet tei d\u016bd cylv\u0101kim
  breivu izvieli i \u012bspieju sab\u012bdreibai po\u0161ai veiduot t\u016b \u012bkuortu,
  kaid\u0101 mes gribim byut. Demokrateja nav ideala, tok skaidrs, ka lobuokys puorva\u013cdis
  formys nav. Juobyut gotovim, ka demokratiskais process na vysod n\u016bdr\u016bsynuos
  t\u016b, k\u016b mes gribim, bet l\u0101mumus var maineit, i da\u017eaidu cylv\u0101ku
