  philol.\\n\\nIlga \u0160uplinska\\n\\n)\\n\\nHumanitaruo \u017eurnala \u201eVia
  Latgalica\\\" (9) prezentaceja\\n\\nDiskusejis:\\n\\n30. novembr\u012b\\n\\n11:40
  diskuseja \u201eMedeji Latgol\u0101, j\u016bs sasn\u012bdzameiba i saturs\\\"\\n\\n(vad.
  Jurs Sauk\u0101ns, 124. aud.).\\n\\nAicynuoti Latgolys medeju, t. sk. po\u0161va\u013cdeibu
  izd\u016bt\u016bs av\u012b\u017eu, biletenu veiduotuoji.\\n\\n4. pasau\u013ca latgal\u012b\u0161u
  sa\u012bta rezolucej\u0101 saceits: \u201eLatgolys planavuo\u0161onys regiona teritorej\u0101
  n\u016bdr\u016b\u0161ynuot va\u013csts informativ\u016b telpu, t. sk. kai sab\u012bdrysk\u016b
  pasyutejumu, i tam\u0101 rast v\u012btu raidejumim i zi\u0146om latgal\u012b\u0161u
  rokstu vol\u016bd\u0101. N\u016bdr\u016b\u0161ynuot i vysur, kur lykums paredz,
  sn\u012bgt fina\u0146siejumu tim informacejis leidzeklim, kur\u016bs ir publikacejis
  voi raidejumi latgal\u012b\u0161u rokstu vol\u016bd\u0101, sab\u012bdryski finans\u0101taj\u016bs
  radejis (LR 1) i televizejis kanal\u016bs (LTV 1, LTV 7) \u012bk\u013caut zi\u0146u,
  taipat atsevi\u0161ku raidejumu regularu sagatavei\u0161onu i translie\u0161onu
  latgal\u012b\u0161u rokstu vol\u016bd\u0101. Styprynuot i atba\u013csteit plotu
  social\u016bs teiklu vidi (p\u012bm\u0101ram, iz LAKUGA bazis) latgal\u012b\u0161u
  rokstu vol\u016bd\u0101\\\".\\n\\nVaicuojumi: Cik lel\u0101 m\u0101r\u0101 Latgolys
  medeji ir gotovi atsevi\u0161ku rokstu, raidejumu sagatavei\u0161onai latgal\u012b\u0161u
  vol\u016bd\u0101? Voi ir p\u012bteikami loba (tehniskais n\u016bdr\u016b\u0161ynuojums)
  Latvejis medeju sasn\u012bdzameiba Latgol\u0101, sevi\u0161ki p\u012br\u016bbe\u017e\u0101?
  Voi Latvejis (t. sk. v\u012btej\u016bs medeju) medeju sn\u0101gtais saturs ir l\u012btuotuoja
  i\u0146teresem atbylst\u016b\u0161s? Kas var\u0101tu tikt maineits? Voi v\u012btej\u012b
  Latgolys medeji spiej p\u012bsadaleit va\u013csts sludynuotaj\u016bs konkurs\u016bs
  medeju atteisteibai? Voi v\u012btej\u016bs medeju kapacitate ir p\u012bteikama,
  lai saceitu, ka medeji styprynoj p\u012br\u016bbe\u017e\u0101 dzeivoj\u016b\u0161\u016bs
  ide\u0146titati, dr\u016b\u0161uma sajiutu i gribie\u0161onu dzeivuot austrumu p\u012br\u016bbe\u017e\u0101?\\n\\n16:50
  diskuseja \u201eLatgal\u012b\u0161u literaturys \u0161udi\u0146d\u012bna, reitd\u012bna
  voi vakard\u012bna?\\\" (vad. Ilga \u0160uplinska, 124. aud.)\\n\\nP\u012bsadola:
  Anna Ranc\u0101ne, Ineta Atpile-Jug\u0101ne, Raibais, Sandra \u016adre, Ligija Purina\u0161a,
  M\u0101r\u012bte \u0160adurska, Meldra Gail\u0101ne, Karonhisake, Jurs Vi\u013cums,
  L\u012bvija Liepdruviete.\\n\\n4. pasau\u013ca latgal\u012b\u0161u sa\u012bt\u0101
  beja vairuoki referati par latgal\u012b\u0161u literaturys n\u016bzeimi, uztveri
  i pietn\u012bceibu latv\u012b\u0161u literaturys kontekst\u0101. Ievas Kalni\u0146as
  rokst\u0101, kas publyc\u0101ts \u017eurnal\u0101 \u201eVia Latgalica\\\" (2017,
  9) ir itaida atzi\u0146a: \u201e90. gadi s\u0101k iez\u012bm\u0113t divas attieksmes
  attiec\u012bb\u0101 pret latgalie\u0161u literat\u016bru: 1) nosac\u012bti latviskaj\u0101
  trad\u012bcij\u0101 latgalie\u0161u literat\u016bra tiek skat\u012bta k\u0101 etnogr\u0101fiska
  trad\u012bcija, kura par\u0101da latvie\u0161u valodas iesp\u0113jas, trad\u012bciju
  daudzveid\u012bbu, papildina latvie\u0161u literat\u016bru ar latgalisko vitalit\u0101ti
  un \u0161armu, iez\u012bm\u0113 katolisko ievirzi, par\u0101da Latgales dabas skaistumu;\\n\\n2)
  latgalie\u0161u literat\u016bra tiek uzskat\u012bta par patst\u0101v\u012bgu literat\u016bru,
  rakst\u012bt latgaliski \u2013 t\u0101 ir autoru pa\u0161izpausmes forma, t\u0101
  neko necen\u0161as k\u0101 nomale papildin\u0101t latvie\u0161u liter\u0101raj\u0101
  trad\u012bcij\u0101, t\u0101 pamat\u0101 rodas Latgal\u0113 un kop\u0101 ar latvie\u0161u
  liter\u0101ro trad\u012bciju veido latvie\u0161u literat\u016bru.\\\"\\n\\nVaicuojumi:
  Kai izjiutom latgal\u012b\u0161u literaturu 21. g. s. pyrmaj\u0101 desmitgad\u0113?
  Tei ir atsevi\u0161ka literaturys tradiceja voi latv\u012b\u0161u literaturys atzors?
  Kas jums ir latgal\u012b\u0161u literatura: autori, \u017eanri, procesi? Kuri redz\u012bs
  svareigi? Park\u016b? Cik lel\u0101 m\u0101r\u0101 latgal\u012b\u0161u literatura
  ir juovuica \u0161kol\u0101? Voi latgal\u012b\u0161u literaturai ir reitd\u012bna?\\n\\n1.
  decembr\u012b\\n\\n13:40 diskuseja \u201eMyusu d\u012bnu latgal\u012b\u0161u vol\u016bda:
  padareitais i doromais\\\" (vad. Dr. philol. Lideja Leikuma, 124. aud.)\\n\\nVa\u013csts
  vol\u016bdys lykuma, kas stuoj\u012bs sp\u0101k\u0101 ar 2000. goda 1. septembri,
  3. panta 4. punkts n\u016bsoka: \u201eVa\u013csts n\u016bdr\u016b\u0161ynoj latgal\u012b\u0161u
  rokstu vol\u016bdys kai viesturyska latv\u012b\u0161u vol\u016bdys paveida saglobuo\u0161onu,
  aizsardzeibu i atteisteibu.\\\"\\n\\nVaicuojumi: Voi i kai teik pi\u013cdeita itei
  va\u013csts apsajim\u0161ona? Kas pozitivs ir n\u016btics i n\u016bteik, kuo svareiga
  v\u0113\u013c datryukst? Voi dorbs latgal\u012b\u0161u rokstu ci literaruos vol\u016bdys
  izk\u016bp\u0161on\u0101 leidz \u0161am ir bejs gona efektivs i kai j\u016b var\u0101tu
  optimiz\u0113t? Kaidu svareigu latgalisku izdavumu datryukst \u0161kolom i sab\u012bdreibai
  k\u016bpum\u0101 i kaidus realus ce\u013cus redzit, kab taidi drei\u017euok pasaruodeitu?\"",
  "\"Tre\u0161ais pasau\u013ca diktats latgal\u012b\u0161u rokstu vol\u016bd\u0101,
  2019\\n\\nFragments nu Egitys Kanc\u0101nis stuostu gruomotys \\\"Syltuo mola\\\"
  (2018, Latgolys Studentu centrs)\\n\\nDiktata video\\n\\nhttps://www.youtube.com/watch?v=RARGPN2CPwY&feature=youtu.be&fbclid=IwA
  R1R2JjkQxV1bVzPAxXEJqX2yP1rK7Io42hpFvtYm8oLF4WP47Ug51oxu-U\\n\\nEisuo saite: http://ejuz.lv/diktats2019video\\n\\nTeksts
  sastateits, \u012bv\u0101roj\u016bt Va\u013csts vol\u016bdys centra 2007. god\u0101
  apstyprynuot\u016bs Latgal\u012b\u0161u raksteibys n\u016bsacejumus, p\u012b\u013caunama
  divska\u0146a \\\"uo\\\" apzeimuo\u0161ona ari ar \\\"\u014d\\\".\\n\\nDiktats.\\n\\nLai\u017e\u016bt
  pl\u016bstu iudin\u012b, tys bi\u0161ku \u012bgrymst, bet iz iudi\u0146a tur\u012bs.
  A\u0146ds brauks pyrmais! \u012astumam j\u016b leic\u012b. Jau ruod\u012bs, ka boltuo
  bura ir pavysam tyvai pi sagryb\u0101t\u016bs vyzbulei\u0161u, kod pl\u016bsts \u016bmai
  n\u016bstuoj i vairs ni nu v\u012btys. Aivars b\u013caun, lai A\u0146ds jam paleig\u0101
  airi. A\u0146ds ruoda tuk\u0161ys r\u016bkys. Asam aizmiersu\u0161i jam \u012bd\u016bt
  t\u016b leidza! I vyspuor air\u0113t tuk\u0161om r\u016bkom nav tik v\u012bgli,
  kai ruod\u012bs tim, kur\u012b stuov krost\u0101 i tik b\u013caun.\\n\\n\\\"Pal\u012bc,
  kur esi! Mes tevi ratavuosim,\\\" kl\u012bdz Aivars.\\n\\nJis izs\u0101dynoj mani
  iz leluos kamerys, \u012bd\u016bd r\u016bk\u0101 divejus m\u012btus, ar \u0161vunku
  \u012bstum kameru nu krosta i pats izl\u0101c iz juos nu \u016btrys pusis. Kamera
  sasa\u0161yupoj, n\u016bsmird piec gumejis, i kuojis dzolda pagaidom v\u0113\u013c
  soltais pavasara iudi\u0146s.\"", "\"Arv\u012bds Turlajs (Arendolis mui\u017ea)
  LATGOLYS KONGRESA L\u0100MUMU N\u016aZEIME NUOK\u016aTN\u0112\\n\\nAtsl\u0101ga
  vuordi: Latgolys kongress, ideja, eisteneiba, \u012bspieja.\\n\\nLatgolys kongresa
  l\u0101mums; ,,Mes, Latgolys latv\u012b\u0161i, apsav\u012bnuodam\u012bs ar K\u016brzemis
  un Vydzemis latv\u012b\u0161im, patur\u0113sim sovu po\u0161va\u013cdeibu, pylnu
  pa\u0161n\u016bteik\u0161onys t\u012bseibu vol\u016bdys, ticeibys, bazneicys, \u0161kolu
  un saimisteibys, kai ar\u012b zemis jautuojum\u0101.\\\"\\n\\nLatgolys kongress
  izveiduoja Latgolys zemis pad\u016bmi. 1917.\u00a0goda 30.\u00a0jul\u012b Latvejis
  apgobolu Zemis pad\u016bmu puorstuovu kongress Reig\u0101 l\u0113me, ka Latveja
  sastuov nu K\u016brzemis, Vydzemis un Latgolys, kotram apgobolam ir sova po\u0161va\u013cdeiba,
  nu apgobolim sa\u012bt Latvejis Saeima; v\u012btejuos po\u0161va\u013cdeibys pr\u012b\u0161k\u0101
  ir Zemis pad\u016bme un va\u013cde. Latvejis Saeimai ir lykumd\u016b\u0161onys t\u012bseibys
  vyspuorej\u016bs Latvejis vaicuojum\u016bs. 1917.\u00a0goda 17.\u00a0novembr\u012b
  tyka izveiduota Latvejis Pagaidu Nacionaluo pad\u016bme, kura tyka atzeita storptautyski
  ,,de facto\\\".\\n\\n1918.\u00a0 goda 18.\u00a0 novembr\u012b K\u0101r\u013ca Ulma\u0146a
  ,,Tautys Pad\u016bme\\\" \u016btru raizi pasludynoj Latvejis naatkareibu. Latgolys
  Zemis pad\u016bmis l\u0101mumi teik ignor\u0101ti. Priv\u0101t\u012bpa\u0161uma
  t\u012bseibu na\u012bv\u0101ruo\u0161ona izraisa pils\u016b\u0146u karu Latvej\u0101.
  Teik sl\u0101gts slapyns pam\u012brs un m\u012bra leigums ar Pad\u016bmu Kr\u012bveju.
  Latvejis Republikys Satversm\u0113 Latgolys t\u012bseibys iz po\u0161va\u013cdeibu,
  vol\u016bdu, \u0161kolom un zemi teik ignor\u0101tys. K.\u00a0Ulma\u0146a diktaturys
  c\u0101l\u016bni un tuos \u012btekme uz Latgolu. Latgolys t\u012bseibu aizstuovu
  darbeiba pad\u016bmu i nacistyskuos okupacejis laik\u0101. P\u0101dej\u016bs god\u016bs
  LR p\u012bjamt\u012b lykumd\u016b\u0161onys akti, kuri ir pretrun\u0101 ar Latgolys
  1917.\u00a0goda kongresa l\u0101mumim.\\n\\nN\u016bteikta Latgolys administrativuo
  teritoreja ar sovu po\u0161va\u013cdeibu, n\u016bteik\u0161onu vol\u016bdys, izgleiteibys,
  saimisteibys un zemis vaicuojum\u016bs ir garants Latgolys ekonomiskai atteisteibai.
  Lai var\u0101tu realiz\u0113t Latgolys t\u012bseibys, kurys n\u016bsaceja Latgolys
  kongress un apstyprynuoja puorej\u012b Latvejis n\u016bvodi, lykumd\u016b\u0161onys
  ce\u013c\u0101 juomaina LR Satversme. LR Satversmei juosabolsta na iz partejom,
  bet iz Zemis pad\u016bmem, kurys \u012bvielej Saeimu.\"", "\"Valentina Luka\u0161evi\u010da
  esejis \\\"Velologeja\\\" fragments:\\n\\nMa\u0146 te v\u012bnu reizi pavaicuoja:
  \u201eA riti\u0146s tev ir?\\\"\\n\\nPasaceju, ka nav, i nikuo te nasamaluoju.\\n\\nEistineib\u0101
  jis laikam grib\u0113ja pavaicuot, voi es braukoju ar ritini. It\u016bvosor \u010detrys
  reizis saguoja, \u2014 spaidelieju pedalis pa\u017e\u012b\u010deitim ritinim. Voi
  tuo ir gona, kab pasaceit, ka es braukoju ar ritini, nazynu.\\n\\nV\u012bns zyna
  se\u0161desmit fra\u017eu sve\u0161vol\u016bd\u0101 i roksta CV, ka zyna it\u016b
  vol\u016bdu, bet \u016btrys ir atbi\u013csteiguos vol\u016bdys bakalaurs i kosa
  aiz auss, voi tys atbi\u013cst pat\u012bseibai, ka jis zyna it\u016b vol\u016bdu.\\n\\nKa
  runoj itaid\u0101 redz\u012bn\u012b par mani i ritini, tod laikam es ar ritini nabraukoju.
  Saleidzynoj\u016bt sevi ar tim, kurim riti\u0146s ir autobusa voi televizora v\u012bt\u0101,
  nimoz narunoj\u016bt par tim, kurim tys ir d\u0101la voi s\u012bvys v\u012bt\u0101.\\n\\nTys,
  ka ma\u0146 nap\u012bder g\u016bvs, nimoz nan\u016bzeimoj, ka es nadzeru p\u012bna.
  Tys, ka ma\u0146 nav vasarneicys, nimoz nan\u016bzeimoj, ka gu\u013cbu kas\u0161ona
  ma\u0146 ir sve\u0161a l\u012bta.\"", "\"Jana Skriv\u013ca-\u010cevere Ce\u013cmolys
  krysti jeb krucifiksi ari myusd\u012bnuos ir sam\u0101r\u0101 b\u012b\u017ei n\u016bv\u0101
  rojami Latgolys ainov\u0101. I taisni majs ir tys mieness, kod j\u012b burtiski
  atsadzeivoj \u2013 teik eipa\u0161i izr\u016btuoti ar z\u012bdu i lopu veitnem,
  pi jim pu\u013ccej\u0101s cylv\u0101ki, R\u016b\u017eukr\u016b\u0146a i cytys lyug\u0161onys,
  dz\u012bsmis i litanejis za\u013ci tvaneig\u016bs maja vokor\u016bs uzavej aug\u0161up
  leidz ar putnu i vysys cytys D\u012bva radeibenis pr\u012bcys dz\u012bsmem par sagaideit\u016b
  vosorys laiku. It\u016b\u0161a\u013ct gon it\u016b tradiceju n\u016bteikti \u012btekmiejuse
  pandemeja i ar t\u016b saisteit\u012b pu\u013ccie\u0161onuos \u012br\u016bbe\u017euojumi,
  bet nuoks jauni pavasari i n\u016bteikti atsarass \u013caudis, kas grib\u0113s d\u016bt
  g\u016bdu D\u012bvam i D\u012bvmuotei ari maja dz\u012bduojumu veid\u0101. Maja
  dz\u012bduojumu tradiceja Latgol\u0101\\n\\nMajs tradicionali teik skaiteits par
  Vyssv\u0101tuokuos Jaunovys Marijis mienesi, par t\u016b v\u012bns nu it\u016bs
  dz\u012bduojumu centralajim elementim ir tai\u0161ni Marijis dz\u012bsmis, kuruos
  stuosteits par Juos dzeivi, c\u012bs\u0161onom i n\u016bpalnim ci\u013cv\u0113cis
  lob\u0101, par p\u012bm\u0101ru, dz\u012bsme \u00abReiz treispadsmyt\u0101 maj\u0101\u00bb,
  kur\u0101 puorstuosteiti Fatimys n\u016btykumi, bet p\u012bdz\u012bduojums \u00abAve
  Maria\u00bb ir tik skaneigs, ka burtiski l\u012bk goram gavil\u0113t leidza skaistajai
  melodejai.\\n\\nMajs \u2013 Marijis mieness\\n\\nFoto \u2013 Ilze Ja\u010duka\\n\\nFoto
  \u2013 Jana Skriv\u013ca-\u010cevere\\n\\nFoto \u2013 Evel\u012bna A\u0161\u0137e\u013ca\u0146eca\\n\\nKo\u010d
  i k\u016bpum\u0101 it\u016bs dz\u012bduojumu rituali pamat\u0101 ir v\u012bni, da\u017eaiduos
  v\u012btuos seceiba vys var atsa\u0161kiert. Ari Marijis g\u016bdam ve\u013cteit\u016bs
  dz\u012bsmu izvieli i seceibu kotr\u0101 konkret\u0101 gadejum\u0101 n\u016bsoka
  kluotas\u016b\u0161\u016bs dz\u012bduotuoju p\u012bredze i v\u012btejuos tradicejis,
  bet b\u012b\u017euok dz\u012bduotuos var\u0101tu byut \u00abLoba nakts, o Jezu\u00bb,
  \u00abD\u012bva Muote, tevi slav\u0113jam\u00bb, \u00abSveika, jiurys zvaigzne\u00bb.\\n\\njezuiti,
  kuru golvonais uzdavums bejs aktivs dorbs sab\u012bdreibys lob\u0101. Tai kai j\u012b
  naapsp\u012bde v\u012btejuos tradicejis, tod pamozom poguoniskuo Muora saplyuduse
  ar D\u012bvmuotis Marijis t\u0101lu i poguoniskuos gavilie\u0161onys tradicejis
  \u2013 ar maja dz\u012bduojumim pi krysta. Tradiceja Latgol\u0101 as\u016bt vysmoz
  treis godu symtus vaca i kolpuojuse gon kai kat\u016b\u013cticeibys izpausme, gon
  kai v\u012btej\u016bs \u012bdzeivuotuoju i s\u0101bru k\u016bp\u012bnys v\u012bnoj\u016b\u0161s
  pasuokums.\\n\\nKrucifiksu v\u012btys m\u0101dz veiduot ari kai nalelys muoje\u0146is
  \u2013 taids ir ari Dek\u0161uoris pogost\u0101 pi Strodu saimis s\u0101tys. Originalais
  krucifikss calts 1930. god\u016bs, kod s\u0101tys saimineicys Marijis Strodis veira
  vacaist\u0101vs p\u012b\u0161keirs zemis gabale\u0146u krysta ce\u013c\u0161onai
  \u2013 niv\u012bns cyts tuo naas\u016bt gribiejs dareit. Tagadejuo muoje\u0146a
  atjaunuota 2000. god\u0101 ar s\u0101bru paleidzeibu. Nu pyrmsuokumu sa zaglobuojs
  Marijis obrozs pi suonu s\u012bnys i nale luokais Jezus obroze\u0146\u0161.\\n\\nDaugavpi\u013cs
  D\u012bva \u017d\u0101\u013csirdeibys draudzis pr\u0101vests Aigars Bern\u0101ns
  atzeist, ka pandemeja ir \u012btekmiejuse ari maja dz\u012bduojumu tradicejis \u012bv\u0101ruo\u0161onu
  \u2013 \u013cauds p\u012bsasorgoj i lel\u016bs pulk\u016bs nasapu\u013ccej. Tai
  P\u012bne\u0146u draudzis pus\u0113 pi krystu pu\u013ccie\u0161onuos byu\u0161\u016bt
  vi\u0146 \u0161udi\u0146, 28. maj\u0101 Sme\u013cter\u016bs, kur tiks \u012bsvieteiti
  at jaunuot\u012b krucifiksi pi lyug\u0161onu noma (att\u0101l\u0101) i pi Solys
  pamat\u0161kolys. Krysti ir veiduoti nu \u016bzulk\u016bka, z\u012bduojs Alberts
  Pastars, izgatavieja \u2013 J. Ernstons, A. Ivdris, leidz\u0113ja V. Madal\u0101ns
  i L. Vaivods.\\n\\nNeicgalis pogosta Dukur\u012b\u0161u s\u0101d\u017eys krysts.
  Be tona pamatn\u0113 as\u016b\u0161uo naleluo D\u012bvmuotis sta tuja z\u012bm\u0101
  t\u012bk \u012bnasta ustob\u0101. Interesanti, ka ap Jezus fig\u016bru ir aps\u012bta
  sorkona lenteite \u2013 kai c\u012bs \u0161onu simbols. Evel\u012bnys A\u0161 \u0137e\u013ca\u0146ecys
  interv\u0101tuo Marianna Skrupska saceja, ka krysta l\u012b\u0161onys veidne v\u0113\u013c
  aizv\u012bn atsar\u016bn juos dzymtuos s\u0101tys, pi kurys atsar\u016bn itys krysts,
  biene\u0146\u016bs. Krysts pastateits 1936. god\u0101.\\n\\nObligata sastuovda\u013ca
  ir ari Jaunovys Marijis litaneja i Beibelis lasejumi. Tok vysaizrauj\u016b\u0161uokuo
  vokora sada\u013ca, ka tai var saceit, n\u016bteikti ir zna\u010dku vilk\u0161ona.
  Zna\u010dka ir numur\u0101ta taisnstyura formys zeimeite, iz kurys n\u016bruodeits
  uzdavums, kas zeimeiti izvylku\u0161ajam n\u016bteikt\u0101 laik\u0101 \u2013 par
  d\u012bnu voi mienesi \u2013 ir juoizpylda. J\u016bs teksti atr\u016bnami senejuos
  puotoru gruomotuos. Nu munys bierneibys vysspylgtuok atmi\u0146\u0101 palykuse zna\u010dka
  \u00abNasaver uz t\u016b pusi, kur tev c\u012b\u0161i grib\u012bs v\u0113rt\u012bs\u00bb.\\n\\nLai
  ar\u012b krucifiksi ce\u013cu moluos ir v\u012bna nu Latgolys regionam rakstureiguokajom
  \u012bzeimem, t\u016bm\u0101r autentisk\u0101 veid\u0101 labi sazaglobuoju\u0161u
  kulturys p\u012bminek\u013cu nav daudz. V\u012bns nu taidim ir nupat, ituo goda
  maj\u0101 va\u013csts aizsorgojam\u016b kulturys p\u012bminek\u013cu sarokst\u0101
  \u012bk\u013cautais Brama\u0146u krucifikss, kas atsar\u016bn Prei\u013cu n\u016bvoda
  Pelie\u010du pogost\u0101 pi K\u013cavinsku dzymtys s\u0101tys i ir dat\u0101ts
  ar 1856. godu. Krysts ir vairuokkuort restaur\u0101ts, t\u016bm\u0101r sagloboj\u016bt
  autentisk\u016b apdari i original\u016b materialu, leidz ar t\u016b ir spylgts 19.
  godu symta bazneicys muokslys tradiceju paraugs. Ar krucifiksim nareti saistomi
  ari da\u017eaidi\\n\\nVeic\u016bt pietejumu itam\u016bs pogost\u016bs, kur da \u0161am
  pietejumi nabeja veikti, kab n\u016b skaidruotu, kai n\u016bteik dz\u012bduojumi
  i kaidi faktori \u012btekmej tradicejis ilgtspiejeibu, Evel\u012bna interv\u0113ja
  dz\u012bduojumu daleibn\u012bkus, kuri atzina, ka k\u016bp\u0161 40. godu \u2013
  aptaujuot\u016bs bierneibys \u2013 ir sazaglobuojuse namaineiga dz\u012bduojumu
  n\u016brise. Pr\u016bti, vyspyrms teik skaiteita lyug\u0161ona, tod R\u016b\u017eukr\u016bns,
  dz\u012bduota litaneja i aptuveni 10 dz\u012bsmis Marijis g\u016bdam, nu kurom popularuokuo
  as\u016bt \u00abSveika jiurys zvaigzne\u00bb. Zna\u010dku vilk\u0161ona fiks\u0101ta
  gon tikai Vabalis pogost\u0101.\\n\\nKrucifiksi kai kulturviesturiska vierteiba\\n\\nVisvacuok\u012b
  krysti beju\u0161i v\u012bnkuor\u0161i, rupai t\u0101sti, sam\u0101r\u0101 zami.
  20. godu symta 20. god\u016bs pasaruodeja krysti ar jumte\u0146im, 30.\u2013 40.
  god\u016bs \u2013 smagneji, nu cementa l\u012bti, ari \u010duguna krysti, bet leidz
  ar Atm\u016bdu vaira v\u0101rojama beja k\u016bka krystu atjaunuo\u0161ona.\\n\\nNa
  tikai po\u0161a dz\u012bduojumu tradiceja ir skaitama par vierteibu \u2013 na ve\u013cti
  jei leidz ar Myru\u0161\u016bs oficeju (taut\u0101 \u012brostuok zynomu i sauktu
  par sa\u013cmem) ir \u012bk\u013cauta Latvejis kulturys kanon\u0101. Nareti ari
  krucifiksi ir na tikai v\u012bta lyug\u0161onom, bet jim p\u012bmeit ari kulturviesturiska
  vierteiba.\\n\\nK\u016bktie\u013cn\u012bks Ontons Ranc\u0101ns jau k\u016bp\u0161
  1990. goda ir aktivi veics Latgolys breivdobys krystu pietei\u0161onu i atjaunuo\u0161onu,
  ir izgataviejs i atjaunuojs k\u016bpum\u0101 vairuokus dasmytus krucifiksu, kai
  ari sarakstiejs ilustrativu pietejumu \u00abKrust\u0101 cirst\u0101s cie\u0161anas\u00bb,
  kuram kai turpynuojums 2008. god\u0101 izveiduota \u00abVirtu\u0101l\u0101 Latgales
  koka krucifiksu enciklop\u0113dija\u00bb, kas gon \u0161\u016bbreid teik atjaunuota
  i publiski nav p\u012bejama, t\u016bm\u0101r tuos veiduotuoji cer, ka tei var\u0101tu
  byut interesentim p\u012bejama jau it\u016bgod.\\n\\nn\u016bstuosti, par p\u012bm\u0101ru,
  par R\u0113zeknis n\u016bvoda Ru\u017eynys krucifiksu, kas ir v\u012bns nu senuokajim
  Latgol\u0101, stuosta, ka jis as\u016bt veiduots nu aug\u016b\u0161a k\u016bka,
  bet pyrms 110 godim gu\u0146sgr\u0101k\u0101 breinumaini nan\u016bdaguse vi\u0146
  tei \u0101ka, pi kurys s\u012bnys bejs p\u012bsl\u012bts Jezus t\u0101ls.\\n\\nPar
  maja dz\u012bduojumim myusu d\u012bnuos\\n\\nKrysta i ticeibys k\u016bpum\u0101
  n\u016bzeimeiguma latgal\u012b\u0161a dzeiv\u0113 apl\u012bcynuojums ir ari tys,
  ka labi zynomaj\u0101 kin\u0101 \u00abCylv\u0101ka b\u0101rns\u00bb ce\u013cmolys
  krystam (tys ir K\u016brpin\u012bku krysts, kas sovulaik atsaroda gruomotys, kas
  jimta par pamatu kinai, autora, rakstn\u012bka Juo\u0146a Kl\u012bdz\u0113ja vacuot\u0101va
  Donata Kl\u012bdz\u0113ja s\u0101tys pogolm\u0101), Jaunovai Marijai i religejai
  kai taidai ir atv\u0101l\u0101ta vysai svareiga v\u012bta i l\u016bma mozuo cylv\u0101kb\u0101rna
  Bo\u0146uka dzeivis telp\u0101, ikd\u012bn\u0101 i pasau\u013ca skatejum\u0101.\\n\\nKai
  saglobuot it\u016b tradiceju nuokamom paaudzem? Evel\u012bna uzsver, ka nuokamuos
  paaudzis ir juo\u012bsaista tuos k\u016bp\u0161on\u0101, i pasadola ar v\u0113l
  vairuokom lobom i eistynojamom idejom: \u00abB\u0101rnim i jaun\u012b\u0161im interesanta
  var\u0101tu byut zna\u010dku vilk\u0161ona, kas ir sova veida \u00ab\u010dellend\u017es\u00bb
  \u2013 voi izad\u016bs vysu nakti \u00abn\u016bgul\u0113t kryst\u0101\u00bb (kuojis
  k\u016bp\u0101, r\u016bkys plotai iz suonim) voi mienesi nasaluod\u0113t i valna
  nap\u012bsaukt, voi sorguot\u012bs nu aprunuo\u0161onys. \u012aspiejams, zna\u010dkys
  var\u0101tu vilkt ari cyt\u016bs draud\u017eu k\u016bpeig\u016bs pasuokum\u016bs.\\n\\nTaids,
  par p\u012bm\u0101ru, ir ari Sakstagol\u0101, Fran\u010da Trasuna muzeja \u00abKolnas\u0101ta\u00bb
  uobe\u013c dorz\u0101 1991. god\u0101 uzstuodeitais i \u012bsvieteitais krucifikss,
  kura Jezus att\u0101la jeb m\u016bkys veiduotuojs ir zynomais k\u016bktie\u013cn\u012bks
  Ontons Ranc\u0101ns. D\u012bvam\u017e\u0101\u013c ituo goda maja suokum\u0101 m\u016bce\u0146a
  nu krysta ir pazuduse, n\u016bzogta. Tai kai tys dareits ryupeigi, \u012bspiejams,
  jei, D\u012bva s\u016bda nasabeist\u016bt par bau\u0161\u013ca \u00abtev nabyus
  zagt\u00bb puorkuop\u0161onu, pajimta voi puord\u016bta kaidai kolekcejai.\\n\\nPad\u016bmju
  laik\u016bs, kai zynoms, naskaitami ce\u013cmolu krysti tyka iznycynuoti, dz\u012bduojumu
  tradiceja \u2013 apkaruota, leidzeigi kai jebkas cyts ar religeju saisteitais. Ari
  pietei\u0161ona nabeja p\u012b\u013caujama ideologiski politisku \u012bmaslu de\u013c.\\n\\nEvel\u012bna
  na tikai vuic\u0101s sp\u0113l\u0113t iergelis, bet ir ari Neicgalis D\u012bvmuotis
  dzim\u0161onys R\u016bmys kat\u016b\u013cu bazneicys iergelneica. Juos m\u012bluokuo
  Marijai ve\u013cteituo dz\u012bsme ir Ligitys Kursi\u0161ys-Patopys \u00abMarij,
  kad uz tevi raugos\u00bb \u2013 \u00abv\u012bnkuor\u0161a i pat\u012bsa,\u00bb soka
  jaun\u012bte.\\n\\n\u013ca\u0146ecys (att\u0101l\u0101) 2020. goda pavasar\u012b
  aizstuov\u0101tais zynuotniskuos pietn\u012bceibys dorbs \u00abMaija dzied\u0101jumi
  pie krusta Daugavpils novada Vaboles, Kalupes un N\u012bcgales pagastos 21. gadsimta
  s\u0101kum\u0101\u00bb, kura vadeituoja beja Anita Zar\u0101ne.\\n\\n\u0160\u016bbreid,
  lai ari na daudz, bet ir pieteju mi par maja dz\u012b duoju mu tradiceju agruok
  i myusd\u012bnuos. V\u012bns nu tim ir t\u016blaik Daugav pils Va\u013csts gim nazejis
  11. kla sis \u0161kolneicys Evel\u012bnys A\u0161\u0137e -\\n\\nInteresants ir ari
  fakts, ka Muolagola k\u016bka krysts Neicgalis pogost\u0101 ir sazaglobuojs nu 18.
  godu symta. Runoj\u016bt par krystim \u2013 t\u012b beju\u0161i nu k\u016bka, betona,
  metala (atkareib\u0101 nu finansialuo stuov\u016bk\u013ca), tyka r\u016btuoti ar
  bryuklenuoju i pu\u010du vainagim. Boguotuoku saimu krystim apleik bejuse siete\u0146a
  voi jumte\u0146\u0161. Kai unikals elements juop\u012bmi\u0146 tys, ka Neicgalis
  pogosta Dukur\u012b\u0161u s\u0101d\u017e\u0101 teik s\u012bta sorkona lenteite
  ap Jezus fig\u016brys vydukli kai c\u012bs\u0161onu simbols.\\n\\n\u012aspieju r\u016bbe\u017euos
  ari Bazneicai byutu juoaktualizej itei tradiceja, pr\u012bsterim uzrunoj\u016bt
  draudzi d\u012bvkolpuojum\u016bs, k\u016bru vadeituojim i daleibn\u012bkim \u2013
  p\u012brokst\u016bt i \u012bsavuic\u016bt dz\u012bduojumu melodejis, kab tuos naizzustu
  leidz ar ilggadej\u016bs dz\u012bduotuoju aiz\u012b\u0161onu myu\u017eeib\u0101.\\n\\nNiu
  Evel\u012bnai tyvoj\u0101s n\u016bsl\u0101gumam 12. klase, i paraleli jei vuic\u0101s
  Sta\u0146islava Broka Daugavpi\u013cs Muzykys vyds\u0161kol\u0101, klav\u012brsp\u0113lis
  i ierge\u013csp\u0113lis 3. kurs\u0101.\\n\\nJaun\u012bte stuosta, ka ari po\u0161a
  ir p\u012bsadalejuse dz\u012bduojum\u016bs Neicgalis pogost\u0101: \u00abVysod pasaruoda
  smaids sej\u0101, kod \u012braugu krystu voi D\u012bvmuotis fig\u016brys v\u012btu
  sak\u016bptu i izr\u016btuotu, kas d\u012bvam\u017e\u0101\u013c aizv\u012bn b\u012b\u017euok
  daudzv\u012bt ir ratums par t\u016b, ka tradiceja izzyud.\u00bb Eipa\u0161i syltys
  atminis jai ir nu p\u0101rnuo goda Neicgal\u0113, kur sazaglobuojuse tradiceja pas\u0113d\u0113t
  i pac\u012bnuot gostus ar sovys s\u0101tys gordumim piec dz\u012bduojumu.\\n\\nVaicuota,
  kai roduos ideja dorba t\u0113mai i kas beja sare\u017egeituokais, t\u016b rokst\u016bt,
  Evel\u012bna stuosta: \u00abD\u016bmoj\u016bt, kaidu temu izav\u0113l\u0113t, saprotu,
  ka n\u016bteikti juopietej sf\u0113ra, par kuru byus po\u0161ai interesanti uzzynuot
  k\u016b nibeis jaunu. Sare\u017egeituokais beja atrast informaceju par t\u016b,
  ka itei tradiceja D\u012bnvydlatgol\u0101 da \u0161am ir moz pieteita, saleidzynoj\u016bt
  ar Z\u012bme\u013clatgolu. Informaceju meklieju da\u017eaiduos bibliotekuos, laikrokst\u016bs,
  interneta v\u012btn\u0113s i gruomotuos, tok vysvaira \u012bgivu, intervej\u016bt
  tradicejis uztur\u0101tuojus.\u00bb\\n\\nVaicuota par atkluosmem i interesantim
  faktim, veic\u016bt pietejumu, Evel\u012bna stuosta: \u00abDaudz interesantu faktu
  atrodu profesora Leonarda Latkovska publikacejuos \u00abActa Latgalica 2\u00bb material\u016bs.
  Par p\u012bm\u0101ru, atzini, ka Latgol\u0101 krysti ir augsti, kab cylv\u0101ki
  v\u0101rt\u016bs iz aug\u0161u, dabas\u016bs, voi faktu, ka krysti vysod calti apdzeivuotuos
  v\u012btuos par t\u016b, ka krysts p\u012bdar civiliz\u0101tai i kulturalai videi,
  navys dobai, kas dzeivoj piec sovu lykumu. Sovukuort etnomuzikologa M. Boiko pietejum\u0101
  interesanta lykus\u0113s hipoteze, ka dz\u012bduojumus \u012bv\u012bsu\u0161i voi
  vysmoz veicynuoju\u0161i\\n\\nTaipat maja dz\u012bduojumus, \u012bspiejams, var\u0101tu
  \u012bk\u013caut programys \u00abSkolas soma\u00bb satur\u0101, bet krystu sak\u016bp\u0161onu
  organiz\u0113t \u00abLeluos tolkys\u00bb \u012btvor\u016bs. Jauna tradicejis izpausmis
  forma var\u0101tu byut ari tuos apv\u012bnuojums ar Boltuo goldauta sv\u0101tkim
  4. maj\u0101 \u2013 dz\u012bd\u016bt pi boltim goldautim kluota golda sv\u0101tku
  dr\u0113b\u0113s pi krysta breiv\u0101 dob\u0101, lyudz\u016bt D\u012bvmuotis aizguodeibu
  Latgolai, zna\u010dkuos apsajem\u016bt paveikt lobu dorbu v\u012btejuos k\u016bp\u012bnys
  lob\u0101.\\n\\nSova da\u013ca \u012bgu\u013cdejuma byutu juove\u013ctej ari pogostu
  puorva\u013cdem i kulturys darbin\u012bkim, par p\u012bm\u0101ru, n\u016bdr\u016b\u0161ynoj\u016bt
  transportu voi organizej\u016bt izgleitoj\u016b\u0161us pasuokumus.\\n\\nBet pats
  golvonais, sapr\u016btams, ir myusu kotra po\u0161a gribie\u0161ona napazaud\u0113t
  i tur\u0113t c\u012bn\u0101 it\u016b vierteig\u016b myusu vac\u016bsmuo\u0161u i
  vac\u016bst\u0101vu tradiceju.\u00bb\\n\\nProjektu finans\u0113 Mediju atbalsta
  fonds no Latvijas valsts bud\u017eeta l\u012bdzek\u013ciem.\"", "\"21. va\u013csts
  atkluotuos latgal\u012b\u0161u rokstu vol\u016bdys i kulturviesturis olimpiadis
