  K\u016bpsapu\u013ccis i Va\u013cdis l\u0101mumim.\\n\\n9.  B\u012aDREIBYS FINANSIS
  I MONTA\\n\\n9.1.B\u012bdreibys leidzek\u013cus veidoj:\\n9.1.1. Latvejis Republikys,
  kai ari uorvalstu fizisk\u016bs i juridisk\u016bs personu breivpruoteiguos \u012bmoksys,
  z\u012bduojumi, duovynuojumi,\\n9.1.2. B\u012bdreibys b\u012bdru naudys,\\n9.1.3.
