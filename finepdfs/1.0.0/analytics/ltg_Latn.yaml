  kas nav aizl\u012bgti ar Latvejis Republikys lykumd\u016b\u0161onu i normativajim
  aktim.\\n9.2.B\u012bdreibys leidzekli teik izl\u012btuoti tikai B\u012bdreibys mier\u0137u
  i aizdavumu eistynuo\u0161onai.\\n9.3.B\u012bdreibys leidzek\u013cu \u012bgu\u013cdei\u0161onys
  i izl\u012btuo\u0161onys kuorteibu n\u016bsoka Va\u013cde saska\u0146\u0101 ar K\u016bpsapu\u013cc\u0113
  n\u016bsaceitajim darbeibys aizdavumim, kai ari \u012bv\u0101roj\u016bt it\u016bs
  Statutu n\u016bsacejumus i apstyprynuot\u016b bud\u017eeta izdavumu t\u0101mi. Leidzek\u013cu
  \u012bguldei\u0161ona i\\n\\nizl\u012btuo\u0161ona veicama atbylst\u016b\u0161i
  Latvejis Republikys lykumd\u016b\u0161on\u0101 n\u016bsaceitajai kuorteibai.\\n\\n9.4.Ar
  K\u016bpsapu\u013ccis l\u0101mumu B\u012bdreiba ir t\u012bseiga veiduot specialus
  fondus, kuri izl\u012btojami att\u012bceigim mierkim, kas atbylst Statut\u016bs
  n\u016bsaceitajim darbeibys mierkim i aizdavumim.\\n9.5.Finansu leidzekli globoj\u0101s
  B\u012bdreibys n\u016br\u0113kinu kont\u016bs bankuos.\\n9.6. Ar B\u012bdreibys
  \u012bpa\u0161umu saisteitys darbeibys nadreikst kolpuot par personiskuos pe\u013cnis
  ol\u016btu B\u012bdreibys b\u012bdrim, de\u013ctuo nav p\u012b\u013caunama pe\u013cnis
  sadalie\u0161ona B\u012bdreibys b\u012bdru storp\u0101.\\n\\n10.  REVIDENTS\\n\\n10.1.
  B\u012bdreibys finansialuos i saimn\u012bciskuos darbeibys kontroli veic revidents,
  kuru ievielej b\u012bdru K\u016bpsapu\u013cce iz v\u012bnu godu.\\n10.2. B\u012bdreibys
  revidents navar byut B\u012bdreibys Va\u013cdis l\u016bceklis.\\n10.3. Revidents:\\n10.3.1.
  veic B\u012bdreibys montys i finansu leidzek\u013cu revizeju,\\n10.3.2. d\u016bd
  atzynumu par B\u012bdreibys bud\u017eetu i goda puorskotu,\\n10.3.3. izviertej B\u012bdreibys
  gruomotvedeibys i l\u012btvedeibys dorbu,\\n10.3.4. sn\u012bdz \u012bsacejumus par
  B\u012bdreibys finansu i saimn\u012bciskuos darbeibys uzlobuo\u0161onu.\\n10.4.
  Revidents veic revizeju b\u012bdru K\u016bpsapu\u013ccis n\u016bsaceitaj\u016bs
  termi\u0146\u016bs, tok na re\u0161uok kai reizi god\u0101.\\n10.5. B\u012bdru K\u016bpsapu\u013cce
  apstyprynoj B\u012bdreibys goda puorskotu tikai piec Revidenta atzynuma sajim\u0161onys.\\n\\n11.  LgSC
  DARBEIBYS IZBEIG\u0160ONA\\n\\n11.1. B\u012bdreibys darbeiba izabeidz, ka K\u016bpsapu\u013cce
  Statut\u016bs n\u016bsaceit\u0101 kuorteib\u0101 p\u012bjem l\u0101mumu par B\u012bdreibys
  po\u0161likvidaceju ci reorganizaceju, apsav\u012bnuo\u0161onu ci p\u012bsav\u012bnuo\u0161onu
  cytai organizacejai.\\n\\nVa\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja  ______________  Edeite
  Husare\\n\\nB\u012bdreibys \\\"LgSC\\\" statuti (2020. goda 15. marta redakceja)\"",
  "\"Oskars Orlovs (R\u0113zeknis Tehnologeju akademeja)\\n\\n2016.\u00a0GODA KULTURYS
  BOLVYS \u201eBO\u0145UKS\\\" NOMINANTU DORBU RAKSTURUOJUMS LITERATUR\u0100\\n\\nAtsl\u0101ga
  vuordi: latgal\u012b\u0161u literatura, latgal\u012b\u0161u ku\u013cturys goda bolva
  \u201eBo\u0146uks\\\", styls, adresats.\\n\\n2016.\u00a0gods latgal\u012b\u0161u
  kultur\u0101 beja \u012bv\u0101rojams ar vairuokim dasaceitim dorbim literatur\u0101:
  divuos nominacejuos \u201eLobuokais sn\u0101gums literatur\u0101\\\" i \u201eLobuokais
  izdavums/gruomota\\\" tyka dasaceiti septeni nominanti, nu tim tai\u0161ni literatur\u0101:
  Annele Sli\u0161\u0101ne \u201est\u0101sti #100de\u010diLatvijai\\\", Dagnija Dudarjonoka,
  Gunta Nagle, Ligija Purina\u0161a, Jana Skriv\u013ca-\u010cevere \u201eLinejis\\\"
  (dzeja), Ineta AtpileJugane \u201eM\u016bdynuot muoku\u013cus\\\" (dzeja), Raib\u012bs
  \u201eZalta tesmini\\\" (stuosti), Sandra \u016adre, Juo\u0146s Ryu\u010d\u0101ns
  \u201eAizlauztais spaits\\\" (Fra\u0146\u010da Kempa dzeivis atspeidynuojumi).\\n\\nPar
  \u201eLobuok\u016b sn\u0101gumu literatur\u0101\\\" tyka p\u012bzeits Juo\u0146a
  Ryu\u010d\u0101na i Sandrys \u016adris saraksteitais romans \u201eAizlauztais spaits\\\".
  Nominacej\u0101 \u201eLobuokais izdavums/gruomota\\\" Bo\u0146uks datyka gruomotai
  i audio diskam \u201e\u0160kilbanu s\u012bvas\\\" (autoris \u2013 Edeite Husare,
  Anda Beit\u0101ne).\\n\\nPietejum\u0101 ir raksturuots literaturys nominantu sn\u0101gums:
  stils, idejis, adresats (kas i kaids d\u016bmuots gruomotys skaiteituojs. Latgal\u012b\u0161u
  literatura ir sam\u0101r\u0101 da\u017eaida, kotram autoram juo dorb\u016bs pasaruoda
  tai\u0161\u0146i jam rakstureiguos \u012bzeimis i sovumi. Debejis dai\u013cdorbim
  var\u0101tu skaiteituoju byut vaira. Tuos ir Latgolys lokalisma eipatneibys, kur
  (ari kai vys\u0101 Latvej\u0101) gr\u0101koj ar taidu tende\u0146ci, ka autora po\u0161a
  biografeju p\u012bleidzynoj juo dai\u013cdorbam.\\n\\nA. Sli\u0161\u0101nis stuosteni
  ir public\u0101ti juos facebook.com profil\u0101 latv\u012b\u0161u i latgal\u012b\u0161u
  literaraj\u0101 vol\u016bd\u0101. Kotrs pastuosts vaira ir kai mozs emuars, atmi\u0146u
  t\u0101luojums. Tys eisti naatbylst d\u016btajam \u017eanra n\u016bsaukumam i eisti
  par literaturu t\u016b n\u016bsaukt ir pagryu\u0161i.\\nD. Dudarjonokys, G.\u00a0Naglis,
  L.\u00a0Purina\u0161ys, J.\u00a0Skrivlis-\u010ceveris dzejis kruojums p\u012bsaista
  ar t\u016b, ka latgal\u012b\u0161u literatur\u0101 tys ir pyrmais kruosojamais dzej\u016b\u013cu
  kruojums. \u010cetru jaunu autoru kolektivs, kur kotra nu ailineicom izace\u013c
  ar sovu, s\u012bv\u012b\u0161u, pasau\u013ca redziejumu. Vysam dzejis kruojumam
  c\u012b\u0161i rakstureigi ir kontrasti. Divom autorem (L.\u00a0Purina\u0161ai i
  G.\u00a0Naglei) tei ir debeja latgal\u012b\u0161u literatur\u0101.\\nI. Atpilis-Juganis
  dzejis kruojums \u201eM\u016bdynuot muoku\u013cus\\\" ir jau cat\u016brtuo ailineicys
  gruomota. Gruomota p\u012bsaista na vi\u0146 dzejis mei\u013cuotuojus, bet i muokslys
  baudeituojus plotuok\u0101 n\u016bzeim\u0113 \u2013 izv\u0101l\u0101ti originali
  i viereibu saist\u016b\u0161i dizaina elementi. Dzej\u0101 dominej meditativuo lirika
  i s\u012bv\u012btis pasau\u013ca dzi\u013cums.\\n\\nItys ir \u016btrais Raibuo stuostu
  kruojums. Raib\u012bs roksta ironiski sarkastisk\u0101 stil\u0101. V\u012btom var
  pamaneit karnevalizacejis elementus, maskys i pateibys vaicuo\u0161onys arhetipus
  i postmodernismam rakstureig\u016b sp\u0113lis pryncypu. Kai jau i veir\u012b\u0161u
  t\u0101luot\u0101 pasaul\u012b, gruomot\u0101 v\u012bta atsaroduse i varys dorbim,
  i kaisleibom.\\n\\nS. \u016adris, J.\u00a0 Ryu\u010d\u0101na dorbs \u201eAizlauztais
  spaits\\\" ir ve\u013cteits latgal\u012b\u0161u politikam i sab\u012bdryskajam darbin\u012bkam
  Fra\u0146\u010dam Kempam. Dorbs, kur\u0101 na vys\u0101 organiski mej\u0101s diveji
  stili: biografiskais, emocionalais i viesturiskais, publicistiskais. Daildorb\u0101
  izmontuoti damiersti latgal\u012b\u0161u vol\u016bdys vuordi i formys, redz\u012bs,
  tei ir vysu leluokuo dorba vierteiba, tok nasagataveitu skaiteituoju tai\u0161ni
  tys var atbaideit.\\n\\n2016.\u00a0goda davums latgal\u012b\u0161u literatur\u0101
  ruoda, ka pote\u0146cis jaunajim i videjuos audzis raksteituojim ir, tys \u013caun
  cer\u0113t, ka latgal\u012b\u0161u literatura atsateista.\"", "\"R\u0113zeknis Tehnologeju
  akademeja (Latveja)\\n\\nLatvejis Universitate (Latveja) A. Mickevi\u010da universitate
