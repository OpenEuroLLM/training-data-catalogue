  atsarass!\\n\\n\\\"{\\n\\n\\\"{\"", "\"Seima\u0146s Put\u0101ns\\n\\nM\u0233su fabulistam\\n\\nKod
  pyrm\u016b \u0157aizi fabulys ma\u0146 tovys n\u014dc\u00e4s las\u00e4\u021b, tod,
  pakasiejis pakausi, as sevi s\u014dku pras\u00e4\u021b:\\n\\n\u00abVoi nav tys nazkod
  bierneib\u0101 jau m\u014dceits kr\u012bvu \u0161kol\u0101? Pag, j\u014dpierk kr\u012bvu
  fabulys, varb\u0233\u021b tod tik\u0161u gol\u0101.\u00bb As ejmu n\u016bpierk\u021b
  Krylovu i tivlei\u021b ver\u016bs \u012b\u0161k\u0101 . . . Tod otkon l\u012bku
  tautisk\u016b as fabulistu pr\u012b\u0161k\u0101.\\n\\nT\u00e1 vier\u0161a v\u012bt\u0101
  \u012blykts zyrgs i tam iz aus\u0219 p\u014drs \u016bdu. Cik v\u012bgli aizpe\u013cn\u00e4ja
  \u0161ys s\u00e1v fabulista g\u016bdu!\\n\\nBet kur ta ir tys n\u016bsl\u0101pums?
  Raug, br\u014dl\u00e1 d\u0101ls pi varys, i tys ik godus sasmierej par veci ryndys
  garys.\\n\\nTam tolk\u0101 n\u014dk bors taut\u012b\u0161u, lai paleidz\u00e4\u021b
  ik breidi. Nu dz\u00e1dzka ir lels fabulists par ve\u013cti vysi streidi.\\n\\n\u00abLatgolas
  Dorbs\u00bb  Nr.11  21.07.1931\\n\\nMoralisti\\n\\nDzeiv\u014dja div kristeig\u012b,
  Obi, zynoms, ticeig\u012b, I \u0161\u012b beja fabulisti, Lobi ari moralisti.\\n\\nV\u012bns
  par \u016btru rakst\u00e4ja, Tai v\u012bns \u016btru m\u014dc\u00e4ja, \u2014 Kas
  ir taida kat\u014dleiba, Voi ar kaida tykumeiba; Kas ir eista ticeiba, Kura tei\u0161am
  kristeiga \u2014 Springovi\u010da \u2014 Ranc\u0101na, A voi vac\u014d Trasuna ...\\n\\nKai
  ni ir, kod m\u014dca vacs, Kura maneiga ir ac\u0219, \u2014 Bet, ak, mu\u013ckeibeni
  tovu, B\u0101rns kod m\u014dca \u201et\u0101vu\\\" sovu!\\n\\n\u00abLatgolas Dorbs\u00bb  Nr.5  07.03.1925\"",
  "\"GUDRIN\u012aKS  I  JUMTS\\n\\n(Fabula par fabulu)\\n\\nKaids gudrin\u012bks,
  r\u014dd\u00e4j\u00e4s, ka vysu m\u014dk,\\n\\nPi sev\u00e1 \u012bsoka tai p\u016brpyn\u014d\u021b:\\n\\n\u201eIr
  acim radzams\\\", jys sac\u00e4ja, \u201eka \u013caudim naradzams\\n\\nKai ir, tai
  pal\u012bk lykums nagr\u016bzams\\n\\nI tys ska\u0146 tai:\\n\\nLai kai\\n\\nTu,
  cylv\u0101ks, plies\u012bs, str\u014ddoj, sveisti, d\u016bmoj \u2014 Tik po\u0161ys
  beigys tovu dorbu kr\u016b\u0146oj. T\u014d pec ir pat\u0219 par sevi sapr\u016btams,
  Ka kotrs pas\u014dkums nu beigom \u012bs\u014dcams. Jo kas v\u00e4\u013c kl\u014dtu
  n\u014dk, tys l\u012bks, Voi tikai n\u012bks.\\n\\nTai, atkl\u014dj\u0219, kas ir
