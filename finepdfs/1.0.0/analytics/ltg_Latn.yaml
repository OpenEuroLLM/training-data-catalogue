  Latgolys \u017eurnala \\\"A12\\\" redaktore In\u0101ra Groce\\n* Latgolys planavuo\u0161onys
  regiona puorstuove Sarm\u012bte Teiv\u0101ne\\n* Europe Direct D\u012bnvidlatgolys
  centra vadeituojs Oskars Zu\u0123ickis\\n* Daugovpi\u013cs pi\u013cs\u0101tys d\u016bmis
  Kulturys puorva\u013cdis vadeituojis v\u012btneicys p.i. Di\u0101na Sold\u0101ne\\n*
  L\u016bznovys mui\u017eis kulturys projektu vadeituoja Inga \u017dirgule\\n* Reklamys
  specialists Raimonds Platacis\"", "\"Voi tu muoki raksteit latgaliski?\\n\\nInga
  Ka\u013cva-Mi\u0146ina Ar k\u016b tev asociej\u0101s diktata rakstei\u0161ona? Voi
  tys ir vysgarlaiceiguokais i napateikamuokais uzdavums, kurs at\u012bt pruot\u0101
  saisteib\u0101 ar latv\u012b\u0161u vol\u016bdys stu\u0146dem? Ceru, ka tod, ja
  tev beja taidys sajiutys, niu tuos ir pagaisu\u0161s i tu ar pr\u012bcu gryb\u0101tu
  pamieginuot puorbaudeit sovys spiejis uzraksteit pareizi kaidu tekstu latviski voi
  ari latgaliski. Voi tys byus izaicynuojums voi interesanta aktivitate i jauna p\u012bredze
  \u2013 tys ir kotra po\u0161a zi\u0146\u0101.\\n\\nJau sast\u016b reizi n\u016btiks
  diktats latgal\u012b\u0161u rokstu vol\u016bd\u0101\\n\\nSastdi\u0146, 15.\u00a0oktobr\u012b,
  kas ir Va\u013csts vol\u016bdys d\u012bna, jau ostoit\u016b reizi n\u016btiks Pasau\u013ca
  diktats latv\u012b\u0161u vol\u016bd\u0101. Par diktata n\u016brisi i \u012bspieju
  t\u016b raksteit kluot\u012bn\u0113 kaid\u0101 nu 14 rakstei\u0161onys v\u012btom
  v\u012bnpadsmit Latvejis pi\u013cs\u0101tuos vairuok var uzzynuot v\u012btn\u0113
  www.raksti.org. Itam\u0101 d\u012bn\u0101 byus \u012bspieja raksteit diktatu ari
  latgal\u012b\u0161u rokstu vol\u016bd\u0101.\\n\\nJa diktatu latgaliski gribi uzraksteit
  kluot\u012bn\u0113, tod taida \u012bspieja byus 16. oktobr\u012b, kod p\u013ckst.
  17.00 n\u016btiks sarunu cykla \u00abLiter\u0101r\u0101s sarunas L\u016bznavas mui\u017e\u0101\u00bb
  ituo goda rudi\u0146a sezonys pyrmuo sasatik\u0161ona \u2013 tekstilmuokslineica
  i literate Annele Sli\u0161\u0101ne stuosteis par sovim rod\u016b\u0161ajim dorbim
  i atbi\u013cd\u0113s iz klauseituoju vaicuojumim. Sarun\u0101 p\u012bsadaleit var\u0113s
  kluot\u012bn\u0113 mui\u017e\u0101, i ari t\u012b\u0161raid\u0113 mui\u017eys s\u0101tyslop\u0101.\\n\\nTekstilmuokslineica
  i liter\u0101te Annele Sli\u0161\u0101ne ir muokslys i literaturys projektu \u00ab#100de\u010diLatvijai\u00bb
  autore, divys reizis piec kuortys bejuse Latgolys prozys skaitejumu uzvar\u0101tuoja.
  Par projektu \u00ab#100de\u010diLatvijai\u00bb i par stuostu kruojumu \u00abtuoraga
  stuosti\u00bb jei ir saj\u0101muse Latgal\u012b\u0161u kulturys goda bolvu \u00abBo\u0146uks\u00bb.\\n\\nKai
  laikrokstam \u00abViet\u0113j\u0101 Latgales Av\u012bze\u00bb stuosta latgal\u012b\u0161u
  kulturys zi\u0146u portala lakuga.lv i b\u012bdreibys \u00abLgSC\u00bb vadeituoja
  Edeite Husare, tod diktata reikuotuojim gribiejuos, lai diktata rakstei\u0161ona
  nav tikai attuolynuot\u0101 format\u0101, de\u013ctam sv\u0101tdi\u0146 eisi pyrms
  literarajom sarunom L\u016bznov\u0101 byus \u012bspieja p\u012bsadaleit diktata
  rakstei\u0161on\u0101 kluot\u012bn\u0113. Iz vaicuojumu, kai diktata rod\u016b\u0161uo
  komanda izd\u016bmoj, kura autora teksts byus kotra Foto: Inga Ka\u013cva-Mi\u0146ina\\n\\n16.\u00a0oktobr\u012b\u00a0pyrma
  sasatik\u0161onys ar Anneli Sli\u0161\u0101ni p\u013ckst.\u00a016.00 interesenti
  var\u0113s vairuok uzzynuot par latgal\u012b\u0161u vol\u016bdu i p\u012bsadaleit
  kluot\u012bnis diktata latgal\u012b\u0161u rokstu vol\u016bd\u0101 rakstei\u0161on\u0101,
  iz kuru aicynoj b\u012bdreiba \\\"LgSC\\\", latgal\u012b\u0161u kulturys zi\u0146u
  portals lakuga.lv i Latvejis Radejis Latgolys studeja. \u00ab\\n\\nLatv\u012b\u0161u
  vol\u016bda ir v\u012bna nu myusu \u2013 Latvejis \u012bdzeivuotuoju \u2013 vierteibom,
  kura juosorgoj i juopopularizej, i eipa\u0161a viereiba n\u016bteikti juop\u012bgr\u012b\u017e
  ari latgal\u012b\u0161u vol\u016bdai. Va\u013csts vol\u016bdys lykum\u0101 saceits,
  ka latgal\u012b\u0161u rokstu vol\u016bda ir viesturiskys latv\u012b\u0161u vol\u016bdys
  paveids i s\u016bpluok latv\u012b\u0161u literarajai vol\u016bdai ir latv\u012b\u0161u
  vol\u016bdys \u016btra rokstu tradiceja. Bet t\u0101n pad\u016bmoj \u2013 cik daudz
  tu skaiti gruomotys latgaliski i cik daudz tu roksti latgaliski? Kab napagaisynuot
  latgal\u012b\u0161u vol\u016bdys l\u016bmu myusu \u2013 latgal\u012b\u0161u \u2013
  vyd\u0101, ir daudz breineigu pasuokumu i aktivita\u0161u, i v\u012bna nu tom ir
  ari latgal\u012b\u0161u vol\u016bdys diktats, kuru var\u0113s raksteit jau itam\u0101
  sastd\u012bn\u0113, 15. oktobr\u012b, t\u012b\u0161saist\u0113, i sv\u0101tdi\u0146,
  16. oktobr\u012b, kluot\u012bn\u0113 L\u016bznovys mui\u017e\u0101. Paguoju\u0161aj\u0101
  god\u0101 diktats latgal\u012b\u0161u rokstu vol\u016bd\u0101 n\u016btyka p\u012bkt\u016b
  reizi \u2013 27. novembr\u012b\\n\\nP\u0101rnej\u0101 god\u0101 diktata tekstu \u2013
  fragmentu nu Ilzis Spergys vie\u013c napublic\u0101ta stuosta \u00abSeiki k\u016bceni
  z\u012bd\u0113ja\u00bb \u2013 skaiteja aktrise Inga Mis\u0101ne-Grasberga\\n\\nLatvejis
  Radejis Latgolys studeja i latgal\u012b\u0161u kulturys zi\u0146u portals lakuga.lv
  aicynuoja p\u012bsadaleit itam\u0101 aktivitat\u0113, puorbaud\u016bt i papyldynoj\u016bt
  sovys zynuo\u0161onys. Diktatu skaiteja aktrise Inga Mis\u0101ne-Grasberga, i raksteituojim
  beja \u012bspieja \u012bsaklauseit i raksteit fragmentu nu Ilzis Spergys vie\u013c
  napublic\u0101ta stuosta \u00abSeiki k\u016bceni z\u012bd\u0113ja\u00bb.\\n\\n\u00abDiktatu
  skaiteis Juo\u0146s Kr\u016b\u0146s, kurs ir na tikai akt\u012brs, bet paruodejs
  sevi ari teatr\u012b izruod\u0113 \u00abMuols\u00bb, kas beja latgaliski. Bet, atkluoj\u016bt
  t\u016b, kas gaidoms nuok\u016btn\u0113, Juo\u0146s Kr\u016b\u0146s byus ari v\u012bns
  nu t\u016bp\u016b\u0161uo radejis lasejumu \u012bstudiejuma bolsim, kas radejis
  eter\u0101 izskan\u0113s jau nuokamuo goda suokum\u0101. Ar sovu p\u012bm\u0101ru
  jis var \u012bdvasmuot jaun\u016bs voi t\u016bp\u016b\u0161\u016bs akt\u012brus
  nasakautr\u0113t i nasabeit dareit ko\u010d k\u016b ari latgaliski, de\u013c tam
  ka tys paver jaunys \u012bspiejis,\u00bb soka Edeite, p\u012bbylst\u016bt:\\n\\ngoda
  diktata teksts, Edeite atbi\u013cd, ka tys atkareigs nu kotra goda aktualitatem
  literatur\u0101 i nu po\u0161a autora aktivitatem konkretaj\u0101 god\u0101. Tai
  kai p\u0101rnej\u0101 god\u0101 (nu 7. da 11. decembram kotru vokoru) taids eipa\u0161s
  n\u016btykums beja Latvejis Radejis 1 eter\u0101 skanieju\u0161\u012b pyrm\u012b
  radejis lasejumi latgaliski \u2013 Ilzis Spergys kruojuma \u00abDzeiveiba\u00bb
  stuosti, tod diktata autore as\u016bt bejuse Ilze. Ituo goda diktata teksta autors
  ir spylgts latgal\u012b\u0161u autors Valentins Luka\u0161evi\u010ds, kuram ituo
  goda suokum\u0101 izguoja eseju kruojums \u00abCasn\u0101gu maizeitis\u00bb, jis
  ari regulari roksta Latgolys masu medejim. \u00abTai nu mes \u012bsad\u016bmuojom,
  ka itys gods var\u0101tu byut Va\u013cuka gods. Mes grybam, lai ir da\u017eaideiba,
  lai nav tai, ka kotru godu diktat\u0101 ir v\u012bna i tuo po\u0161a autora dorbs.
  Grybam, lai ari puorn\u016bvodn\u012bki uzzyna par myusu autorim. Ari po\u0161im
  latgal\u012b\u0161im tei ir loba \u012bspieja \u012bsadvesmuot k\u016b vairuok paskaiteit
  nu konkretuo autora dorbim,\u00bb soka Edeite.\\n\\n\u00ab\\n\\nItam\u0101 god\u0101
  diktats latgal\u012b\u0161u rokstu vol\u016bd\u0101 teik reikuots 15. oktobr\u012b
  \u2013 Va\u013csts vol\u016bdys d\u012bn\u0101, kab p\u012bgr\u012bztu leluoku viereibu
  latv\u012b\u0161u vol\u016bdys rokstu tradiceju daudzveideibai.\\n\\nFoto: Amanda
  Anus\u0101ne/portals lakuga.lv\\n\\n15.\u00a0oktobr\u012b diktats skan\u0113s Latvejis
  Radejis 1 eter\u0101 raidejum\u0101 \\\"Kolnas\u0101ta\\\" sastd\u012bnis vokor\u0101
  p\u013ckst.\u00a018.20, kai ari video format\u0101 byus n\u016bsaverams Sab\u012bdrysk\u016bs
  medeju portal\u0101 LSM.lv i latgal\u012b\u0161u kulturys zi\u0146u portal\u0101
  lakuga.lv, taipat Latvejis Radejis Latgolys studejis i portala lakuga.lv social\u016bs
  teiklu profil\u016bs. \u00ab\\n\\n15.\u00a0oktobr\u012b diktatu skaiteis teatra
  trupys \\\"KVADRIFRONS\\\" akt\u012brs Juo\u0146s Kr\u016b\u0146s (att\u0101l\u0101)
  (juouzsver, ka septembra gol\u0101 diktata reikuotuoji, popularizej\u016bt latgal\u012b\u0161u
  vol\u016bdu jaun\u012b\u0161u vyd\u0101, organiz\u0113ja diktata rakstei\u0161onu
  R\u0113zeknis Va\u013csts 1. gimnazej\u0101)\\n\\nItuo goda diktatu \u2013 fragmentu
  nu rakstn\u012bka i literaturzynuotn\u012bka Valentina Luka\u0161evi\u010da esejis
  \u2013 skaiteis teatra trupys \\\"KVADRIFRONS\\\" akt\u012brs Juo\u0146s Kr\u016b\u0146s
  (J\u0101nis Kronis), kuru skateituoji \u012bpazyna R\u0113zeknis teatr\u012b \\\"Joriks\\\"
  re\u017eisora M\u0101rti\u0146a Eihis Latgolys p\u016bdn\u012bceibai ve\u013cteit\u0101
  \u012bstudiejum\u0101 \\\"Muols\\\". Itam\u0101 izruod\u0113 eipa\u0161u v\u012btu
  \u012bjem muokslys zynuotn\u012bka, Latgolys keramikys viesturis pietn\u012bka Juo\u0146a
  Puj\u0101ta (1925\u20131988) personeiba i darbeiba, i Juo\u0146s Kr\u016b\u0146s
  ir Juo\u0146a Puj\u0101ta muosys mozd\u0101ls, kura dzymtys saknis meklejamys Latgol\u0101
  \u2013 Gaigalovys i Kolupa pus\u0113.\\n\\nDiktata teksts, kas sagataveits, \u012bv\u0101roj\u016bt
  2007. god\u0101 apstyprynuot\u016bs n\u016bsacejumus, piec tuo n\u016bsl\u0101guma
  puorbaudei byus da\u012bmams portal\u016bs lakuga.lv i LSM.lv. Diktatu organizej
  b\u012bdreiba \\\"LgSC\\\", latgal\u012b\u0161u kulturys zi\u0146u portals lakuga.lv
  i Latvejis Radejis Latgolys studeja.\\n\\n14\\n\\nSv\u0101td\u012bne ar diktatu
  i pie\u010duok sasatik\u0161ona ar Anneli Sli\u0161\u0101ni ir \u012bspieja p\u012bdzeivuot
  t\u016b da\u017eaideibu, kas ir latgal\u012b\u0161u vol\u016bd\u0101. Varbyut kaidu
  reizi gryb\u0101tu pajimt kai diktata tekstu ari kaidu nu Annelis dorbim, bet tai
  kai jei roksta vaira tai, kai runoj tai\u0161ni Z\u012bme\u013clatgol\u0101 i tei
  nav latgal\u012b\u0161u rokstu vol\u016bda, tod tys nav tik v\u012bnkuor\u0161i.
  Bet itam\u0101 sv\u0101td\u012bn\u0113 byus breineiga \u012bspieja \u012bpazeit,
  cik da\u017eaida ir latgal\u012b\u0161u vol\u016bda \u2013 mums ir gon rokstu vol\u016bda,
  gon ari sovai\u017euoka vol\u016bda Z\u012bme\u013clatgol\u0101. Sv\u0101td\u012bn\u0113
  var\u0113s izbaudeit it\u016b latgal\u012b\u0161u vol\u016bdys da\u017eaideibu.\\\"\\n\\n*\u00a0Kab
  lobuok izprostu i \u012bsavuiceitu latgal\u012b\u0161u rokstu vol\u016bdys n\u016bsacejumus,
  sekoj portala lakuga.lv kontam @voluuda socialaj\u0101 teikl\u0101 Instagram \u2013
  t\u012b ir gon vierteigi pad\u016bmi, kai pareizi raksteit latgaliski, gon ari daudz
  da\u017eaidu aktualita\u0161u, foto i video saisteib\u0101 ar latgal\u012b\u0161u
  vol\u016bdu i kulturu.\\n\\nkod  latgal\u012b\u0161u rokstu vol\u016bdys n\u016bdarbeibuos
  var\u0113s p\u012bsadaleit Facebook t\u012b\u0161raid\u0113 b\u012bdreibys \u00abLgSC\u00bb
  profil\u0101, kai ari v\u0113rt\u012bs latgal\u012b\u0161u kulturys zi\u0146u portal\u0101
  lakuga.lv i b\u012bdreibys s\u0101tyslop\u0101 lgsc.lv, byus 18. oktobr\u012b. Bet
  nab\u0101doj, ka nasaguoja p\u012bsav\u012bnuot n\u016bdarbeibom t\u012b\u0161saist\u0113,
  de\u013c tam ka lobuo zi\u0146a ir taida, ka vysys n\u016bdarbeibys ir n\u016bsaveramys
  ari \u00abLgSC\u00bb kanal\u0101 YouTube (https://ej.uz/LTGkursi), i \u012broksts
  pal\u012bk ari Facebook. Taitod \u2013 pylnveiduot sovys prasmis latgal\u012b\u0161u
  rokstu vol\u016bd\u0101 tu vari jebkur\u0101 sev \u0101rt\u0101 laik\u0101 i v\u012bt\u0101.\\n\\n*N\u016bsaver
  b\u012bdreibys \u00abLgSC\u00bb sadarbeib\u0101 ar latgal\u012b\u0161u kulturys
  zi\u0146u portalu lakuga.lv reikuotuos latgal\u012b\u0161u rokstu vol\u016bdys t\u012b\u0161saistis
  bezmoksys n\u016bdarbeibys, kab izzynuotu vaira par latgal\u012b\u0161u rokstu vol\u016bdu
  i \u012bsavuiceitu tuos pamatprincipus. Latgal\u012b\u0161u rokstu vol\u016bdys
  n\u016bdarbeibys voda v\u012bna nu zyn\u016b\u0161uok\u016bs latgal\u012b\u0161u
  rokstu vol\u016bdys specialistu, latgalisk\u016bs gruomotu korektore, p\u012bredziejuse
  vol\u016bdys n\u016bdarbeibu vadeituoja i vol\u016bdys eksperte Muora Mortuz\u0101ne-Muravska.
  Vol\u016bdys n\u016bdarbeibys n\u016bteik jau nu pavasara, i p\u0101dejuo reize
  t\u012b\u0161saist\u0113,\\n\\n* Svareigs fakts myusd\u012bnu latgal\u012b\u0161u
  rokstu vol\u016bdai \u2013 septembra gol\u0101 paguoja 15\u00a0godu nu 2007.\u00a0goda,
  kod Va\u013csts vol\u016bdys centr\u0101 ir apstyprynuoti myusd\u012bnu latgal\u012b\u0161u
  rokstu vol\u016bdys pareizraksteibys n\u016bsacejumi.\\n\\n\u00abProjektu finans\u0113
  Mediju atbalsta fonds no Latvijas valsts bud\u017eeta l\u012bdzek\u013ciem\u00bb.
  \u00abPar projekta raksta \u00abVoi tu muoki raksteit latgaliski?\u00bb saturu atbild
  SIA \u00abViet\u0113j\u0101\u00bb\u00bb.\"", "\"Konkursa \\\"Latgolys prozys skaitejumi
  2022\\\" N\u016aLYKUMS\\n\\nMIERKIS\\n\\nVeicynuot literar\u016b procesu Latgol\u0101,
  d\u016bd\u016bt vareibu latgal\u012b\u0161u rokstu vol\u016bd\u0101 voi latv\u012b\u0161u
  literaraj\u0101 vol\u016bd\u0101 rokst\u016b\u0161im autorim satikt leluoku auditoreju
  i skaiteituojim \u012bpazeit jaunus Latgolys kulturtelp\u0101 topu\u0161us dorbus.\\n\\nDALIN\u012aKI\\n\\nVysa
  vacuma Latgolys kulturtelpai p\u012bdareigi autori, kur\u012b roksta prozu latgal\u012b\u0161u
  rokstu vol\u016bd\u0101 voi latv\u012b\u0161u literaraj\u0101 vol\u016bd\u0101.\\n\\nKONKURSA
  DORBA N\u016aSACEJUMI\\n\\nAutori aicynuoti \u012bsyuteit:\\n\\n1. po\u0161a radeitu
  i da tuo napublic\u0101tu tekstu latgal\u012b\u0161u rokstu vol\u016bd\u0101 voi
  latv\u012b\u0161u literaraj\u0101 vol\u016bd\u0101 (bet v\u0101lams ar vysmoz 10
  % latgal\u012b\u0161u rokstu vol\u016bd\u0101 integr\u0101ta teksta) \u2014 eseju,
  stuostu voi romana fragmentu sev tyvuok\u0101 \u017eanr\u0101;\\n2. prozys teksta
  lelums: 7000\u201312 000 zeimu ar atstarpem;\\n3. teksta n\u016bformiejums: A4 formats,
  Times New Roman, burtu lelums 12 punkti, rindu storp\u0101 1,5 punkti;\\n\\n4. v\u0101lams
  jimt v\u0101r\u0101 konkursa moto \\\"Kur ir muna s\u0101ta?\\\" (latv\u012b\u0161u
  lit. \u2013 \\\"Kur ir manas m\u0101jas?\\\"). T\u012b var byut sova\\n\\n\u012b\u0161kejuo
  sirdsm\u012bra, sovys s\u0101tys mekliejumi, p\u012bdareibys izjiutys vaicuojumi,
  pasau\u013ca n\u016btik\u0161onu konteksts, p\u012bm\u0101ram, ar Kr\u012bvejis
  agresejis rezultat\u0101 pagaisynuotajom s\u0101tom Ukrain\u0101, emigraceja paceli
  lobuokys dzeivis mekliejum\u016bs i cyta saisteita tematika, kas sasauc ar konkursa
  dorbu viertie\u0161onys kriterejim (p\u012bdareiba Latgolys kulturtelpai, tai atkluoj\u016bt
  regiona sovpateibu i paruod\u016bt latgaliskumu juo pla\u0161uokajuos n\u016bzeim\u0113s).\\n\\nP\u012aSACEJUMA
  N\u016aSACEJUMI\\n\\nKonkursa dorba elektroniskajai versejai obligati juodal\u012bk
  e-posta teksts ar p\u012bsacejumu, kur\u0101 juobyut:\\n\\n1. zi\u0146om par autoru
  (vuords, pavuorde, dzim\u0161onys dati (gods), n\u016bsadorbuo\u0161ona, eisa rod\u016b\u0161uo
  biografeja\\n(vysmoz 3\u20134 teikumi));\\n2. autora kontaktinformaceja (telepona
  numers, e-posts).\\n\\nTERMENI\\n\\nKonkursa dorbi, dal\u012bk\u016bt p\u012bsacejumus,
  konkursam juo\u012bsn\u0101dz leidz 2022. goda 4. novembram, n\u016bsyut\u016bt
  b\u012bdreibai \\\"LgSC\\\" iz e-postu: email@example.com ar n\u016bruodi \\\"Latgolys
  prozys skaitejumi 2022\\\".\\n\\nVIERTIE\u0160ONYS KRITEREJI\\n\\nDorbi tiks v\u0101rt\u0101ti,
  vysu vaira izce\u013c\u016bt na teksta vol\u016bdu, bet literaruo teksta kvalitati
  i p\u012bdareibu Latgolys kulturtelpai, tai atkluoj\u016bt regiona sovpateibu i
  paruod\u016bt latgaliskumu juo pla\u0161uokajuos n\u016bzeim\u0113s.\\n\\nKONKURSA
  DORBU VIERTIE\u0160ONA\\n\\nKonkurss n\u016btiks v\u012bn\u0101 kuort\u0101 \u2013
  autori leidz 4. novembram \u012bsyuta sovus prozys tekstus i konkursa organizatori
  j\u016bs n\u016bd\u016bd \u017eurejai anonimai viertie\u0161onai;\\n\\nKonkursa
  dalin\u012bki 8. decembr\u012b 20.30 byus aicynuoti p\u012bsadaleit konkursa \\\"Latgolys
  prozys skaitejumi 2022\\\" n\u016bsl\u0101guma pasuokum\u0101 R\u0113zekn\u0113.
  Tuo n\u016btik\u0161onu planavuots fi\u013cm\u0113t i raideit storptautyskuo literaturys
  festivala\\n\\n\\\"Prozas las\u012bjumi 2022\\\" i latgal\u012b\u0161u kulturys
  zi\u0146u portala lakuga.lv kanal\u016bs. Pasuokuma n\u016btik\u0161on\u0101 tik
  jimti v\u0101r\u0101 vysi tym\u0101 breid\u012b va\u013cst\u012b pastuov\u016b\u0161\u012b
  \u012br\u016bbe\u017euojumi.\\n\\nREZULTATU IZZI\u0145UO\u0160ONYS PAR\u0100DS\\n\\nAutorus,
  kur\u016bs konkursa \\\"Latgolys prozys skaitejumu 2022\\\" n\u016bsl\u0101guma
  pasuokum\u0101 8. decembr\u012b aicynuos konkursa tekstu skaiteit publiski, inform\u0113s
  personeigi, sasazynoj\u016bt iz p\u012bsacejum\u0101 n\u016bruodeit\u016b e-posta
  adresi voi telepona numeri. Konkurs\u0101 uzvarieju\u0161\u016bs dorbu autoru vuordi
  tiks izzi\u0146uoti konkursa n\u016bsl\u0101guma pasuokum\u0101, kai ari public\u0101ti
  b\u012bdreibys \\\"LgSC\\\" s\u0101tyslop\u0101 lgsc.lv i latgal\u012b\u0161u kuturys
  zi\u0146u portal\u0101 lakuga.lv. Atbylst\u016b\u0161i konkursa n\u016bsl\u0101guma
  pasuokuma koncepcejai, uzvar\u0101tuoju dorbu video \u012broksti var tikt sataiseiti
  ari pyrma pasuokuma. Konkursa \\\"Latgolys prozys skaitejumi 2022\\\" uzvar\u0101tuojam
  ar sova dorba skaitejumu byus p\u012bduovuota vareiba p\u012bsadaleit ari festivala
  \\\"Prozas las\u012bjumi 2022\\\" n\u016btik\u0161onuos 11. decembr\u012b.\\n\\nATLEIDZEIBA
  PAR PUBLIKACEJOM I PUBLICITATE\\n\\nKonkursa uzvar\u0101tuoju dorbim tiks da\u0161kiertys
  atleidzeibys par dorbu pyrmpublikacejom portal\u0101 lakuga.lv: I v\u012btai 350
  eiro apm\u0101r\u0101, II v\u012btai 250 eiro apm\u0101r\u0101 i III v\u012btai
  150 eiro apm\u0101r\u0101 (pyrma n\u016bd\u016bk\u013cu n\u016bmoksys). Atkareib\u0101
  nu \u012bsn\u0101gt\u016bs dorbu kvalitatis i \u017eurejis viertejuma b\u012bdreiba
  \\\"LgSC\\\" patur t\u012bseibys atleidzeibu apm\u0101rus maineit. Konkursa uzvar\u0101tuoju
  dorbi var tikt public\u0101ti ari video format\u0101 portala lakuga.lv i b\u012bdreibys
  \\\"LgSC\\\" social\u016bs teiklu kont\u016bs, kai ari portala sagataveitaj\u016bs
  izdavum\u016bs.\\n\\n\u017dUREJA\\n\\nKonkursa \\\"Latgolys prozys skaitejumi 2022\\\"
  dalin\u012bku dorbus viert\u0113s vysmoz treis, bet na vaira kai p\u012bci \u017eurejis
  l\u016bcekli \u2013 ar Latvejis literaturys procesim i aktivitatem saisteitys personeibys.
  \u017durejis l\u016bcek\u013cu vuordi tyks atkluoti piec 10. novembra.\\n\\nORGANIZATORI\\n\\nKonkursu
  reikoj b\u012bdreiba \\\"LgSC\\\" (vaira dazynuo\u0161onai Edeite Husare tel. 29509672,
  e-posts edeite@lgsc). Konkursa n\u016btik\u0161onu atbolsta storptautyskais literaturys
  festivals \\\"Prozas las\u012bjumi 2022\\\" (reikuotuojs Latvejis Rakstn\u012bku
  sav\u012bneiba), Va\u013csts kulturkapitala fonds, AS \\\"Latvijas dzelzce\u013c\u0161\\\",
  latgal\u012b\u0161u kulturys zi\u0146u portals lakuga.lv i \u017eurnals \\\"Domuz\u012bme\\\".\"",
  "\"Andrivs Niedra\\n\\nZemn\u012bka d\u0101ls\\n\\nSATURS\\n\\n| Pyrm\u014d k\u016bdal\u00e1
  | 6 |\\n|---|---|\\n| \u016atr\u014d k\u016bdal\u00e1 | 43 |\\n| Tre\u0161\u014d
  k\u016bdal\u00e1 | 63 |\\n| Cat\u016brt\u014d k\u016bdal\u00e1 | 69 |\\n| Beigys
  | 74 |\\n\\nTrejs Laimis k\u016bdalis\\n\\nKai n\u016bsyln\u014dju\u0161i calmi
  ataug\u0101, tai j\u012b obeji st\u014dv\u00e4ja v\u012bntuli storp jaun\u016b paaudzi.\\n\\nPo\u0161a
  beja jaun\u014dka. Klus\u0101, veiceig\u0101 gait\u0101 jei t\u00e1c\u00e4ja nu
  kl\u0101va iz pogrobu, nu pogroba iz klieti. Tod n\u016bst\u014dja iz pogolma i
  klaus\u00e4j\u00e4s, kai kl\u0101v\u0101 m\u012breigi gram\u014dja pa\u0101du\u0161\u014ds
  g\u016bv\u0219. I jei n\u016bzapyut\u00e1...\\n\\nPat\u0219 zemn\u012bks kotru vokoru
  izg\u014dja aiz v\u014drtenim i ilgi n\u016bzav\u00e4r\u00e1 iz vokoru pusi. Tai
  jys zyn\u014dja, kaida reit b\u0233\u0219 d\u012bna. Tod jys pagl\u014dst\u00e4ja
  \u012bsierm\u016b kupl\u016b b\u014drzdu i lieni pagr\u012bz\u00e1 bryun\u016b,
  grumbain\u016b vaigu iz reita pusi. \u201eLeita laivys\\\" par me\u017eu jam st\u014dst\u00e4ja,
  kaida b\u0233\u0219 nakt\u0219. Jys p\u014drlaid\u00e1  ac\u0219  par  j\u014d  po\u0161a  k\u016bpt\u012bm  teirumim:  var\u00e4ja  dzierd\u00e4\u021b,  kai
  labeiba br\u012bst... Zemn\u012bks n\u016bzapyut\u00e1 i gausi \u012bg\u014dja atpaka\u013c
  ustob\u0101.\\n\\nJ\u012bm nabeja b\u0101rnu.\\n\\n\u201eNavajag kurn\u00e4\u021b,
  m\u014d\u021b...\\\" zemn\u012bks cytu \u0157aizi teic\u00e1, kod dzierd\u00e4ja
  saimineicys n\u016bpyutys. \u201eLaim\u00e1 po\u0161a zyna, de\u013ck\u014d jei
  tai dora. Kur b\u0101rni, t\u012b b\u0101dys...\\\" I jys \u014dtri \u012bg\u014dja
  ustob\u0101.\\n\\nSaimineica  atsas\u0101da  zam  vac\u014ds  l\u012bpys.  Putinen\u0161  lieni
  aiz\u010dierkst\u00e4ja. Saimineica s\u00e4d\u00e4ja i v\u00e4r\u00e4s iz vokoru
  pusi: m\u014dkuli v\u012bns pec \u016btra palyka pal\u0101ki, tik divejim v\u00e4\u013c
  beja sorkona mola.\\n\\n\u201eKab ko\u010d ma\u0146 b\u0233tu b\u0101rnu Nalaim\u00e1!\\\"
  saimineica n\u016bzapyut\u00e1. \u201e\u00c1j niu tuk\u0161\u0101 ustob\u0101...
  gu\u013cst\u012bs tuk\u0161\u0101 gult\u0101... B\u0233tu pagl\u014dstiejus\u00e1
  garum \u012bdama, a k\u016b gl\u014dsteisi: akmin\u0219 i k\u016bks!\\\"\\n\\n\u201eAs
  t\u00e1v soku: t\u00e1v nav b\u0101rnu Laimis! Kotram cylv\u0101kam n\u016blykta
  sova Laim\u00e1...\\\"\\n\\n\u201eAi,  ai  saimineic,  tai  nav  labi:  navajag  dzei\u021b  sovu  Laimi
  pr\u016bjom... Voi t\u00e1v l\u016bpeni na\u012bt pa r\u016bkai, voi t\u00e1v kliet\u0219
  nav pylna, voi vu\u0161kenis nastaigoj kai sn\u012bga koponys?\\\"\\n\\n\u201eKam
  tys vyss palik\u0219?\\\"\\n\\n\u201eNasau\u00e7  Nalaimis,  saimineic:  b\u0101rnu  Nalaim\u00e1  ir  tei
  vysgryut\u014dk\u014d!\\\"\\n\\n\u201eKai tu po\u0161a grybi... As parun\u014d\u0161u...\\\"\\n\\n\u201eKab
  ma\u0146 ko\u010d kapen\u0161 b\u0233tu kop\u016bs, pi k\u014d pas\u00e4d\u00e4\u021b
  sv\u0101td\u012b\u0146\u014ds... Ar gr\u014dbekli apkostu, pu\u010deitis \u012bstateitu...\\\"\\n\\nSaimineica
  sazatryuka. I kai jei var\u00e4ja tai \u014dtri aizmig\u021b? I... da, jai tok r\u014dd\u00e4j\u00e4s,
  ka niupa\u021b nazkas run\u014dja, a niv\u012bna nabeja. Viejen\u0161 \u0161\u0146\u014dc\u00e1
  l\u012bp\u0101. V\u00e4\u013c v\u012bnam m\u014dkulei\u0161am mola beja sorkona.\\n\\nJei
  str\u00e4\u010deiti past\u014dv\u00e4ja, n\u016bslauc\u00e4ja ac\u0219 i \u012bg\u014dja
  tymsij\u0101, tuk\u0161ij\u0101 ustob\u0101.  Tik  ciercin\u0219  t\u012b  \u010dierkst\u00e4ja,  lai  dorba  \u013caud\u0219  m\u012bg\u0101  v\u012bg\u013c\u014dk
  pyust\u016bs, pyu\u013cu nostu n\u016blyku\u0161i.\\n\\n\u201eCik tys tai sovaidi!\\\"
  saimineica pad\u016bm\u014dja. \u201eAs v\u00e4\u013c atbi\u013cdieju: kab ma\u0146
  ko\u010d kapen\u0161 b\u0233tu!\\\"\\n\\n* * *\\n\\nTys  beja  \u016btr\u0101  pavasar\u012b.  Itik  \u014dtri  vac\u012bs  saimin\u012bks  v\u00e4\u013c  nikod
  nabeja skriej\u0219 iz me\u017eu. Div v\u014drnys sazatryuka i kr\u0101kdamys aizskr\u00e4ja
  iz kaimi\u0146u bierzi.\\n\\nMe\u017e\u0101 zemn\u012bks apzast\u014dja i ar mitrom
  acim pazav\u00e4r\u00e1 iz b\u0101rza calmu i pi t\u014d kl\u014dtu aug\u016b\u0161\u016b
  atvasi.\\n\\n\u201eKai  tys  var  b\u0233\u021b!\\\"  d\u016bm\u014dja  zemn\u012bks.  \u201eIt\u00e1  it\u016b  b\u0101rzu  as  beju
  izlasiej\u0219 de\u013c \u0161yupel\u00e1 leikst\u0219 jau pyrmij\u0101 pavasar\u012b
  pec k\u014dzom. B\u0101rzs izauga, \u0161yupel\u00e1m leikst\u0219 navajdz\u00e4ja.
  Tod as iztaisieju lemesneicu nu t\u014d... kai ar sovu draugu run\u014dju ar lemesneicu
  pla\u0161um\u0101. Kam cytam lai as st\u014dsteitu sovys d\u016bmys? T\u016bmar
  nu vac\u014d calma izauga atvas\u00e1 i niu m\u0233sim vajaga \u0161yupel\u00e1m
  leiksti!\\\"\\n\\nVac\u012bs  saimin\u012bks  raud\u014dja  i  sm\u00e4j\u00e4s,  bolt\u016b  b\u0101rza  leiksti
  gl\u014dsteidams.  Jys  \u014dtri  apzav\u00e4r\u00e1  vysapleik.  N\u0101,  niv\u012bns  nabeja
  dzierdiej\u0219 kai vac\u012bs saimin\u012bks raud\u014dja i sm\u00e4j\u00e4s. Tik
  vac\u014ds pr\u012bdis tai \u017eieleigi pyut\u00e1: pr\u012b\u1e11om nikod naaug
  atvasis.\\n\\nSaimineica po\u0161a beja aizsnaudus\u00e1 kliet\u012b. Tys ir: navys
  taid\u0101 eist\u0101 m\u012bg\u0101, a tai kai pu\u0219aizsnau\u017e\u0101. Jei
  skaidri dzierd\u00e4ja, kai moz\u012bs t\u012bpa\u021b s\u016bplok pyut\u00e4s...
  tai vi\u0146 \u014dtri, \u014dtri. I kliet\u0219 gr\u012bstus jei r\u00e1dz\u00e4ja.
  V\u014drpu vai\u0146ucen\u0161 beja p\u012bsprausts pi sejis. Jei nabeja maniejus\u00e1,
  kai \u012bg\u014dja ga\u0161ka i atsas\u0101da iz apg\u014dztys ba\u013cvenis pi
  j\u014ds.\\n\\n\u201eKas  par  breinumim!\\\"  saimineica  klusu  pad\u016bm\u014dja  i  greizi
  pazav\u00e4r\u00e1 iz ga\u0161kys grumbain\u016b vaigu i leik\u016b mugoru. \u201eNiupa\u021b
  vairs navaru  p\u012bmin\u00e4\u021b  kai  ga\u0161kai  v\u014drds!  Icik  r\u00e1dz\u0101ts  cylv\u0101ks!  Teiri  kai
  n\u016breibus\u00e1!\\\"\\n\\nSaimineica v\u00e4r\u00e4s i gaid\u00e4ja, k\u016b
  ga\u0161ka sac\u00e4s. Varb\u0233\u021b dzier\u017e\u016bt bolsu var\u00e4s \u012bg\u014dd\u014d\u021b,
  kas par cylv\u0101ku. Ga\u0161ka saleikus\u00e1 s\u00e4d\u00e4ja, v\u00e4r\u00e4s
  iz moz\u016b puis\u0101nu i nasc\u00e4ja ni v\u014drda.\\n\\nGa\u0161ka pagr\u012bz\u00e1
  pal\u0101k\u014ds ac\u0219 iz j\u016b, pazav\u00e4r\u00e1 skumeigi jai ac\u012bs,
  n\u016bzapyut\u00e1 i nasc\u00e4ja ni v\u014drda.\\n\\n\u201eVoi nav smuks puiseit\u0219,
  krystam\u014d\u021b?\\\" saimineica beidz\u016bt \u012bs\u014dka run\u014d\u021b.\\n\\n\u201eAs
  gon, krystam\u014d\u021b, vairs nabeju ceriejus\u00e1 p\u012bdzeiv\u014d\u021b taidys
  pr\u012bcys!\\\" nadr\u016bsi run\u014dja saimineica.\\n\\nGa\u0161ka ar lel\u014dku
  uzmaneibu pazav\u00e4r\u00e1 iz gul\u0101t\u014dji.\\n\\n\u201eKai to n\u0101, \u1e3fait!..
  pr\u012bcys vysi gaida, vysi cerej...\\\" vac\u014d otkon apklusa.\\n\\nSaimineica
  n\u016bzapyut\u00e1 i nazyn\u014dja, k\u016b vairs sac\u00e4\u021b.\\n\\n\u201eVoi
  tu redzi, \u1e3fait, kai jys k\u014djenis kustynoj?\\\" vac\u014d pec str\u00e4\u010dis
  po\u0161a \u012bs\u014dka. \u201eNam\u012breigs cylv\u0101ks jys b\u0233\u0219...
  \u012b\u0219 iz reitim, iz vokorim. I tova sirsnen\u00e1, \u1e3fait, tam leidza
  vi\u0146 laiss\u012bs kai bol\u016bdeit\u0219...\\\"\\n\\n\u201eKab Laim\u00e1 tik
  d\u016btu jam lelam izaug\u021b!\\\" saimineica \u010dyukst\u00e4ja i osorys jai
  saskr\u00e4ja ac\u012bs. \u201eKas niu par mani, par vacu cylv\u0101ku...\\\"\\n\\nGa\u0161ka
  izj\u00e4m\u00e1 kuleiti nu veik\u0161a.\\n\\n\u012b\u0161k\u0101.\\n\\n\u201eAs
  t\u00e1v, \u1e3fait, nazk\u016b atne\u0161u...\\\" \u010dyukst\u00e4ja jei i p\u012bzal\u012bc\u00e1
  pi gultys. Saimineica pagr\u012bz\u00e1 ac\u0219 iz kuleiti. Taidi kai izsuk\u014dti
  lyni t\u012b beja\\n\\n\u201ePa\u013cdis, krystam\u014d\u021b, pa\u013cdis...\\\"
  jei sac\u00e4, tik nazynu, kod niu tik\u0161u pi vierp\u0161onys... Taipa\u021b
  jau p\u014dr\u012b\u0219 v\u012bns-\u016btrs breisnen\u0161 ar d\u0101lu...\\\"\\n\\n\u201eGon
  jau \u1e3fait, at\u012b\u0219 i vierp\u00e1m\u012bs laiks...\\\" ga\u0161ka atbi\u013cd\u00e4ja.
  \u201eAs t\u00e1v atne\u0161u trejs k\u016bdalis... n\u016blik\u0161u t\u00e1 teineit\u012b.
  Tys jau t\u012bsa gon: tagad pi vierp\u0161onys natiksi. Tod, kod d\u0101ls b\u0233\u0219
  lels, kod d\u0101ls aiz\u012b\u0219 sve\u0161uma... gon jau t\u016b\u0157aiz n\u014dk\u0219
  t\u012b gar\u012b vokori. V\u00e4\u013c as t\u00e1v k\u016b teik\u0161u: v\u00e4r\u1e55,
  \u1e3fait, stypru paved\u012bni. Aiz it\u014d paved\u012bn\u00e1 tu d\u0101lu vi\u013cksi
  atpaka\u013c nu sve\u0161om z\u00e1\u1e3fom. V\u00e4r\u1e55 stypru paved\u012bni:
  kod tys tryuk\u0219, tod d\u0101la vairs atpaka\u013c nadab\u014dsi... I v\u00e4\u013c
  k\u016b: iz reitu pusi tu d\u0101lu vari lais\u021b i iz vokoru, i d\u012bnvydu
  pusi, a iz z\u012bmelim nalai\u1e11. De\u013c z\u012bmelim ma\u0146 k\u016bdalis
  nav...\\n\\n\u201eKod paved\u012bn\u0219 tryuk\u0219, tod d\u0101la vairs atpaka\u013c
  nadab\u014dsi...\\\" ga\u0161ka klusi  atk\u014drt\u014dja.  \u201eR\u00e1dz\u00e4\u021b
  j\u016b dab\u014dsi  tod, kod jys  osor\u014ds  mozg\u014ds\u012bs sve\u0161um\u0101...\\\"\\n\\n\u201eKod
  paved\u012bn\u0219 tryuk\u0219, tod d\u0101la vairs naredzei\u0161u!\\\" saimineica
  kai m\u016brg\u016bs teic\u00e1. \u201eVoi ta nikod as j\u014d vairs naredzei\u0161u?\\\"\\n\\nSaimineicai  nazkas  \u012bzadyur\u00e1  kryut\u012bs.  Osorainom  acim  jei
  pazav\u00e4r\u00e1 iz sorkon\u016b vaidzeni bolt\u0101 vylnaineit\u012b. Puis\u0101ns
  tai soldi gul\u00e4ja...\\n\\n\u201eKrystam\u014d\u021b...\\\"  saimineica  grib\u00e4ja  sac\u00e4\u021b,  a  ga\u0161kys  jau  vairs
  nabeja. Saimin\u012bks g\u014dja pa durovom \u012b\u0161k\u0101 ar bolt\u014d b\u0101rza
  leiksti par placu...\\n\\nPyrm\u014d k\u016bdal\u00e1\\n\\nKod Zemn\u012bka d\u0101ls
  beja desmit godu vacs \u2014 jam vairs niv\u012bns k\u016bks nabeja par augstu.
  N\u014dc\u00e1 p\u012bcpadsmit godu vacs \u2014 niv\u012bns orklys jam nabeja par
  smogu. Kod jam pag\u014dja jau divdesmit godu \u2014 nabeja niv\u012bnys dz\u012bsmis,
  kurys jys nazyn\u014dtu.\\n\\nZemn\u012bka  bierz\u0219  naapklusa  vysu  vosoru.  Par  nakti  tr\u012bc\u00e1
  laksteigola, par d\u012bnu dz\u012bd\u014dja Zemn\u012bka d\u0101ls. T\u014dlum\u0101
  klaus\u00e4j\u00e4s v\u012bna\u016btra tautu \u1e3faita i sird\u0219 jai si\u013cd\u00e4j\u00e4s
  nasapr\u016btam\u014ds \u017e\u0101lob\u014ds.\\n\\nLaksteigolai p\u012btryuka dz\u012bs\u1e3fu
  i  jei apklusa. Zemn\u012bka d\u0101lam dz\u012bs\u1e3fu nap\u012btryuka leidz v\u0101lam
  rudin\u00e1m. Kod n\u014dc\u00e1 jaun\u012bs pavasar\u0219, tod Zemn\u012bka d\u0101ls
  s\u014dka par jaunu sovys nasaskaitam\u014ds dz\u012bsmis i pr\u012bc\u014dj\u00e4s
  par t\u016b, ka ceirul\u0219 i bierz\u0219 dz\u012b\u1e11 jam leidza. Raudz\u00e4ja
  svi\u013cp\u014d\u021b maln\u0233\u0219 strods, bet tam dz\u012bsm\u00e1 izg\u014dja
  taida paeisa...\\n\\n\u0156aiz  n\u016bst\u014dja  bierz\u0219  mol\u0101  sve\u0161in\u012bks  i  klaus\u00e4j\u00e4s,  kai  dz\u012b\u1e11
  Zemn\u012bka d\u0101ls: kotrai vogai sova dz\u012bsm\u00e1.\\n\\n\u201eD\u012bvs
  paleidz or\u014djam!\\\" sve\u0161in\u012bks sac\u00e4.\\n\\n\u201eAs vysu laiku
  t\u00e1 skot\u016bs i breinoj\u016bs...\\\" cel\u00e1veirs \u012bs\u014dka.\\n\\n\u201eTaipa\u021b
  i cel\u00e1 g\u014djiejam!\\\" Zemn\u012bka d\u0101ls atbi\u013cd\u00e4ja, paklabyn\u014dja
  v\u0101rstuvi i \u012bspraud\u00e1 speid\u016b\u0161\u016bs leme\u0161us zal\u00e4
  val\u0101n\u0101.\\n\\n\u201ePark\u016b ta tu breinoj\u012bs?\\\"\\n\\n\u201eKai
  tai?\\\"\\n\\n\u201eAs  breinoj\u016bs  part\u016b,  ka  tovs  orklys  taids  pat\u0219,  kai  tovys
  dz\u012bsmis.\\\"\\n\\n\u201eRedzi, ar orklu tu ar iz v\u012bnu pusi, vogys gol\u0101
  tu apgr\u012bz zyrgu i ar iz \u016btru pusi, a val\u0101nys ikkotru \u0157aiz kreit
  iz t\u016b pa\u0161u pusi...\\\"\\n\\n\u201eNu da, as tok p\u014drce\u013cu v\u0101rstuvi...\\\"\\n\\n\u201eTys
  nikas. Val\u0101na myu\u017eam kreit tik iz v\u012bnu pusi. Taipa\u021b i tovys
  dz\u012bsmis: tu dz\u012bdi par \u0161\u016b i dz\u012bdi par t\u016b, bet myu\u017eam
  tik nu v\u012bnys pusis...\\\"\\n\\n\u201eAs  dz\u012b\u017eu  par  vysu,  k\u016b  as  radzu...\\\"  Zemn\u012bka  d\u0101ls  nadr\u016bsi
  atbi\u013cd\u00e4ja.\\n\\n\u201eTu redzi vysu tik nu v\u012bnys pusis!\\\" Cel\u00e1veirs
  atbi\u013cd\u00e4ja.\\n\\n\u201eKai tai?\\\"\\n\\n\u201eKas tys par tr\u016bksni
  t\u012b bierz\u012b?\\\" sve\u0161in\u012bks vaic\u014dja.\\n\\n\u201eViej\u0219
  pyu\u0161...\\\" Zemn\u012bka d\u0101ls atbi\u013cd\u00e4ja.\\n\\n\u201eTys tik
  nu v\u012bnys pusis tai izaskota...\\\" teic\u00e1 sve\u0161in\u012bks. \u201eA
  ka pazav\u00e4rt\u012bs nu \u016btrys pusis, to tys nav viej\u0219...?\\\"\\n\\n\u201eKas
  to tys ir?\\\"\\n\\n\u201eMo\u017e ka t\u014ds bierz\u0219 \u017e\u0101lobys...\\\"
  cel\u00e1veirs klusu atbi\u013cd\u00e4ja. \u201eBierz\u0219 n\u016bzapyut\u00e1.\\\"\\n\\n\u201eVoi
  tu vysom l\u012btom redzi \u016btru pusi? Zemn\u012bka d\u0101ls pec str\u00e4\u010dis
  vaic\u014dja.\\n\\n\u201eDe\u013ck\u014d? De\u013ct\u014d ka tai sova liktin\u00e1
  \u017e\u0101l. Tei ver\u0101s iz aug\u0161u i r\u00e1\u1e11z, kai m\u014dk\u016bni
  t\u012b maun: lely i mozi, pulk\u016bs i pa v\u012bnam... vysi maun t\u014d\u013c\u014dk
  i t\u014d\u013c\u014dk... A bierz\u00e1i j\u014dpal\u012bk t\u00e1pa\u021b. Viej\u0219
  at\u012bt i aiz\u012bt, putineni atsamat i skr\u012bn t\u014d\u013c\u014dk, a bierz\u00e1i
  j\u014dpal\u012bk t\u00e1pa\u021b. T\u012b po\u0161i teirumi, t\u014ds po\u0161ys
  p\u013covys... Izkreit sn\u012bgs, n\u016bzalai\u017e, i otkon t\u012b po\u0161i
  teirumi, t\u014ds po\u0161ys p\u013covys... Tai tys beja symts godu atpaka\u013c
  i tai tys b\u0233\u0219 leidz laikam, kod tova cierva esmin\u0219 n\u016bg\u014dz\u0219
  v\u012bnu b\u0101rzu pec \u016btra... De\u013ct\u014d bierz\u00e1i \u017e\u0101l
  sova liktin\u00e1 i tei n\u016bzapyu\u0161. A tu d\u016bmoj, ka viej\u0219 pyu\u0161...\\\"\\n\\n\u201eVysom!\\\"
  cel\u00e1 g\u014djiejs atbi\u013cd\u00e4ja i n\u016bskuma.\\n\\n\u201eI tu zyni,
  kaids m\u014dk\u016bnim ir vierss i kas t\u012b aiz t\u014d zyl\u014d me\u017ea
  dzeivoj?\\\"\\n\\n\u201eZynu... I cylv\u0101kam as radzu \u016btr\u016b pusi. Cyts
  sv\u0101ts kai bazneic\u0101, bet as radzu, ka nalobys d\u016bmys l\u016b\u017e\u0146oj
  ap j\u014d sirdi. Cyts smej\u0101s, bet as radzu, ka jam osorys bierst \u012b\u0161k\u0101.\\\"\\n\\n\u201e\u012a\u0161k\u0101?\\\"\\n\\n\u201eZynoms,
  \u012b\u0161k\u0101. Tu dz\u012bdi vysu nu \u014dr\u012bnis de\u013ct\u014d, ka
  tu vysu radzi nu \u014dr\u012bnis...\\\"\\n\\n\u201eVoi zyni...\\\" Zemn\u012bka
  d\u0101ls grib\u00e4ja k\u016b teik\u021b, bet sazakaun\u00e4ja.\\n\\n\u201eNu?\\n\\n\u201eDa\u017eu
  \u0157aiz ma\u0146 ir tai ap sirdi...\\\"\\n\\n\u201eKai?\\\"\\n\\n\u201eNu, tai...
  gryb\u0101t\u016bs r\u00e1dz\u00e4\u021b \u016btr\u016b pusi. As sie\u017eu vokor\u0101
  iz s\u016blen\u00e1 zam l\u012bpys i ver\u016bs. Iz p\u013covys cel\u00e4s bolta
  mygla, aiz myglys malns me\u017e\u0161... nakustynoj ni zaren\u00e1. Mygla kus\u021b
  kai \u0161kidri pologi i ma\u0146 r\u014dd\u012bs, ka t\u012b iz me\u017eu \u012bt
  boltys jaunovys, t\u014ds \u012bt gar\u014ds v\u00e4rti\u0146\u014ds, lieni, lieni
  i narunoj ni v\u014drda... I tod ma\u0146 grib\u012bs r\u00e1dz\u00e4\u021b, voi
  pat\u012b\u0161i t\u014ds ir jaunovys? I de\u013ck\u014d t\u014ds izaug tik lelys,
  leidz \u00e1g\u013cu golym? Ma\u0146 gryb\u0101t\u016bs zyn\u014d\u021b, voi  t\u014ds
  ir  nalaik\u0101  myru\u0161u  b\u0101rnu  dv\u00e4selis... de\u013ck\u014d  t\u014ds
  tik klusys?\\\"\\n\\nSve\u0161in\u012bks n\u016bzapyut\u00e1.\\n\\n\u201eDz\u012b\u1e11
  lob\u014dk sovys vac\u014ds dz\u012bsmis...\\\" jys sac\u00e4 i n\u016bj\u00e4m\u00e1
  capuri, lai n\u016bslauceitu sv\u012bdrus nu b\u014dl\u014ds p\u012bris.\\n\\nZemn\u012bka  d\u0101ls  n\u016bdyur\u00e1  ac\u0219.  Kod  jys  t\u014ds  otkon  pac\u00e4l\u00e1,  tod
  sve\u0161in\u012bks tais\u00e4j\u00e4s jau \u012b\u021b.\\n\\n\u201eNajam, c\u012bme\u0146,
  par \u013caunu...\\\"\\n\\n\u201eNu?\\\"\\n\\n\u201eVoi tu daudzi dz\u012bs\u1e3fu
  zyni tai... nu \u016btrys pusis?\\\"\\n\\n\u201eZynu gon...\\\"\\n\\n\u201eKur tu
  t\u014ds m\u014dciej\u012bs?\\\"''\\n\\n\u201eNu v\u012bnys vacys, vacys m\u0101menis.\\\"\\n\\n\u201eKur
  jei dzeivoj?\\\"\\n\\n\u201eT\u014dli, draugs...\\\"\\n\\n\u201eCik t\u014dli?\\\"\\n\\n\u201eTrejs
  godi iz t\u012bn\u012bni, trejs atpaka\u013c...\\\"\\n\\n\u201eVoi iz vokoru pusi?\\\"\\n\\n\u201eDa,
  iz vokora pusi?\\n\\n\u201eZemn\u012bka d\u0101ls ilgi v\u00e4r\u00e4s aizg\u014djiejam
  paka\u013c. Tod jys n\u016bzapyut\u00e1, \u012bsp\u013c\u014dv\u00e1 sauvj\u014ds
  i izvylka leme\u0161us nu val\u0101nys.\\n\\n\u201eN\u016b, vogu!\\\" jys sauc\u00e1.
  Dz\u012bd\u014d\u021b jys vairs nadz\u012bd\u014dja...\\n\\n\u201eVysam sovs laiks...\\\"
  t\u0101vs atbi\u013cd\u00e4ja i izg\u014dja \u014dr\u0101.\\n\\n\u201eNazyn, kas
  tam puikai tagad n\u016btic\u0219?\\\" m\u014dt\u00e1 pec da\u017eom d\u012bnom
  nadr\u016bsi pavaic\u014dja. \u201eNi vairs dz\u012b\u1e11, ni gavilej...\\\"\\n\\nAtg\u014dja
  J\u014dn\u00e1 d\u012bnys vokors. Me\u017ei tric\u00e4ja nu J\u014dn\u00e1 b\u0101rnu
  dz\u012bs\u1e3fom. J\u014dn\u00e1 gun\u0219 laist\u00e4j\u00e4s nu vysom pu\u0219om.
  Vysa goda pr\u012bca kai vieja \u0161\u0146\u014dk\u0161ona plyud\u00e1 par teirumim
  i p\u013covom. Reit vairs nab\u0233\u0219 z\u012bdu i nab\u0233\u0219 pr\u012bcys.\\n\\nZemn\u012bka
  d\u0101ls s\u00e4d\u00e4ja iz s\u016bla zam l\u012bpys. Korst\u016b golvu jys beja
  atsp\u012bd\u0219 obej\u014ds r\u016bk\u014ds, spieceig\u012b placi raust\u00e4j\u00e4s
  kai s\u014d\u1e55\u014ds. Nacik t\u014dli g\u014dja cauri \u1e3faitu pulks, vysom
  vai\u0146uceni golv\u0101 i J\u014d\u0146u z\u014dlis kliep\u012b. Divejom, trejom
  s\u016bli palyka lie\u0146\u014dki iz Zemn\u012bka d\u0101lu skot\u016bt\u012bs.
  A jys napac\u00e4l\u00e1 vaiga. I leig\u014dt\u014djis klusom aizg\u014dja t\u014d\u013c\u014dk.\\n\\n\u201eDiele\u0146,  as  t\u00e1v  pal\u0101k\u016bs  sv\u014drkus  n\u016blyku
  ustob\u0101 iz  kr\u0101sla...\\\" m\u014dt\u00e1 sac\u00e4 sov\u0101 klus\u0101
  bols\u0101. \u201eAr vac\u012bm tu navari \u012b\u021b leig\u014d\u021b.''\\\" I
  jei izlyka sovu n\u016bstr\u014dd\u014dt\u016b r\u016bku iz placa.\\n\\nD\u0101ls
  napakust\u00e4ja.\\n\\n\u201eDiele\u0146, voi ta m\u00e1\u0219 ar t\u0101vu vairs
  tovi draugi naasom?\\\" m\u014dt\u00e1 skumeigi vaic\u014dja.\\n\\nE\u013csdams
  d\u0101ls jai kryta ap koklu.\\n\\n\u201eKas ta t\u00e1v, d\u0101ls, t\u00e1 ir
  teic\u0219 \u013caunu v\u014drdu? M\u00e1\u0219 ar t\u0101vu... tu jau zyni, m\u00e1\u0219
  obi asom klusi cylv\u0101ki, m\u0233su d\u016bmys, d\u0101ls... t\u014ds ap tevi
  vi\u0146 tyn\u0101s, ap tevi vi\u0146... kai zali dzeipuri...\\\"\\n\\n\u201eM\u014d\u021b,
  m\u014d\u021b, lai\u1e11 mani pasaul\u012b!\\\" jys sauc\u00e1. \u201eAs vairs navaru...
  ma\u0146 t\u00e1 j\u014dn\u016bsleikst \u017e\u0101lob\u014ds kai iudin\u012b!\\\"\\n\\n\u201eVyss,
  m\u014d\u021b, t\u00e1 ap mani tyn\u0101s...\\\" d\u0101ls kai s\u014d\u1e55\u014ds
  atsasauc\u00e1. \u201eD\u012bnu i nakti, z\u012bmu i vosoru... vyss t\u00e1 ap m\u0233sim
  taipa\u021b vi\u0146 apleik \u012bt... kai teituvis. T\u012b dz\u012b\u1e11 t\u014ds
  po\u0161ys J\u014dn\u00e1 dz\u012bsmis kai p\u0101rni. J\u014dn\u00e1 gun\u0219
  dag tym\u016bs po\u0161\u016bs k\u016bk\u016bs kai p\u0101rni i cytugod tys otkon
  b\u0233\u0219 taipa\u021b. As ar\u0161u t\u016b pa\u0161u teirumu i brauk\u0161u
  pa t\u012bm po\u0161im celim... M\u014d\u021b, vyss jau ir bej\u0219, vyss b\u0233\u0219
  taipa\u021b... Ma\u0146 gryu\u0161i pal\u012bk pyus\u021b... Lai\u1e11, m\u014d\u021b,
  lai\u1e11 mani pr\u016bjom!\\\"\\n\\nT\u0101vs ilgi v\u00e4r\u00e4s i c\u012bt\u00e1
  klusu. Kod jys vokor\u016bs aiz v\u014drtim st\u014dv\u00e4ja zam l\u012bpys, jys
  vairs nazav\u00e4r\u00e1 leita laivys... j\u014d sird\u0219 beja gryuta kai\\n\\nNakt\u012b
  m\u014dt\u00e1 v\u014dr\u00e4ja vysaidys z\u014dlis pec vac\u016bs \u013cau\u017eu
  pad\u016bmim: gon  pret  \u013caunu  aci,  gon  taidys,  kurys  sirdi  m\u012breigu  dora.  Bet
  napaleidz\u00e4ja nikaidys z\u014dlis, \u2014 laikam par dau\u1e11z osoru t\u014dm
  beja liej\u012bs kl\u014dt. Atg\u014d saulis d\u012bnys, speid\u00e4ja otkon pylns
  mienes\u0219, a t\u014ds nakt\u0219  naizkleidyn\u014dja  nikaida  gaisma,  kura  kai  sp\u014drn\u016bs  beja
  n\u016bzalaidus\u00e1 par Zemn\u012bka d\u0101la dv\u00e4seli.\\n\\np\u012bmierkus\u00e1
  pr\u012bd\u00e1. Rudin\u012b, kod beja n\u016bkults beidzam\u012bs kl\u014dj\u012bn\u0219,
  jys pak\u014dr\u00e1 spryguli pi s\u012bnys i paj\u00e4m\u00e1 d\u0101lu aiz r\u016bkys.\\n\\n\u201eIt\u016b
  as audzieju de\u013c tev\u00e1...\\\" t\u0101vs klusom sac\u00e4ja, \u201et\u00e1v,
  ar k\u016b taut\u014ds brauk\u021b. Bet laikam m\u0233sim ar m\u014dti Laim\u00e1
  nab\u0233\u0219 t\u014ds pr\u012bcys n\u016blykus\u00e1. Jam, d\u0101ls, sovu zyrgu
  i j\u014dj pasaul\u012b. Saj\u014dj, sameidi sovys \u017e\u0101lobys... Tik v\u012bnys
  l\u012btys naaizmiers\u021b, d\u0101ls: m\u014dt\u00e1 nav t\u014d pe\u013cniejus\u00e1,
  ka j\u014ds actenis aizm\u012bdz sve\u0161a r\u016bka...\\\"\\n\\nPi stall\u00e1
  j\u012b n\u016bst\u014dja. Sierm\u012bs ierzel\u0219 bubin\u00e4ja i kosa z\u00e1mi
  ar pr\u012b\u0161kys k\u014dji.\\n\\nTai Zemn\u012bka d\u0101ls aizg\u014dja sve\u0161\u016bs
  \u013caud\u012bs. M\u014dt\u00e1 v\u00e4\u013c ilgi st\u014dv\u00e4ja aiz v\u014drtim,
  n\u016bsolu\u0161ys r\u016bkys pr\u012b\u0161kaut\u0101 salykus\u00e1, i v\u00e4r\u00e4s
  iz m\u014dkulim, kas v\u0101su myglu dzeidami, gausi styum\u00e4s iz vokoru pusi.
  Tik tod, ka m\u014dkuli sazal\u00e4ja v\u012bn\u0101 malnum\u0101 ar bierzi, tod
  m\u014dt\u00e1 \u012bg\u014dja ustob\u0101, izlyka auklu izkoltu\u0161am raten\u00e1m
  i s\u014dka spr\u00e4s\u021b pyrm\u016b k\u016bdali. \u00c1glis skols kiup\u00e4ja
  i sprakst\u00e4ja, a m\u014dt\u00e1 mierc\u00e4ja paved\u012bni po\u0161a ar sovom
  osorom...\\n\\n* * *\\n\\nCel\u00e1 mol\u0101 s\u00e4d\u00e4ja ubogs. Zemn\u012bka
  d\u0101ls aptur\u00e4ja zyrgu.\\n\\nUbogs pazasm\u00e4ja.\\n\\n\u201eKryst\u0101v\\\",
  jys vaic\u014dja, \u201evoi tu zyni m\u0101meni, kura vysys l\u012btys r\u00e1\u1e11z
  nu obejom pu\u0219om?\\\"\\n\\n\u201eZynu!\\\" jys atbi\u013cd\u00e4ja.\\n\\n\u201eVoi
  tu vari ma\u0146 par\u014dd\u00e4\u021b ce\u013cu iz t\u012bni?\\\"\\n\\n\u201eVaru!\\\"\\n\\n\u201eVoi
  t\u00e1 b\u0233\u0219 pareizi?\\\"\\n\\n\u201eB\u0233\u0219!\\\"\\n\\n\u201eVoi
  v\u00e4\u013c t\u014dli?\\\"\\n\\n\u201eT\u014dli!\\\"\\n\\n\u201eKai ta var\u0101tu
  zyn\u014d\u021b, kurs ce\u013c\u0161 taisn\u014dk\u012bs?\\\"\\n\\n\u201eKurs t\u014dl\u014dks,
  tys taisn\u014dks!\\\" atbi\u013cd\u00e4ja ubogs i otkon pazasm\u00e4ja.\\n\\n\u201ePa\u013cdis,
  kryst\u0101v, i par t\u016b!\\\"  Zemn\u012bka d\u0101ls n\u016bskumeigi  teic\u00e1.
  Zyrgs n\u016bzasprausl\u014dja i bryda t\u014d\u013c\u014dk pa rudin\u00e1 dublim.\\n\\nAtg\u014dja
  tre\u0161\u012bs rudin\u0219. V\u012bneigi viejen\u0161 dz\u012bd\u014dja sovu dz\u012bsmi,
  t\u016b po\u0161u myu\u017eeig\u016b, osoru pylnu rudin\u00e1 dz\u012bsmi. Zemn\u012bka
  d\u0101ls klaus\u00e4j\u00e4s i d\u016bm\u014dja.\\n\\nV\u00e4\u013c dau\u1e11z
  \u0157ai\u017eu Zemn\u012bka d\u0101ls vaic\u014dja cel\u00e1 nu sve\u0161in\u012bkim.
  Kas zyn\u014dja \u0161\u016b ce\u013cu, t\u012b vysi sac\u00e4: k\u016b t\u014d\u013c\u014dk,
  t\u016b taisn\u014dk. I vysi tai sovaidi sm\u012bgn\u00e4ja.  Trejs  vosorys  Zemn\u012bka  d\u0101ls  klaus\u00e4j\u00e4s  sve\u0161u  \u013cau\u017eu
  dz\u012bs\u1e3f\u014ds. Taidys po\u0161ys t\u014ds vysur: vysys dzierd\u0101tys,
  vysys dz\u012bd\u014dtys.\\n\\n\u201eVoi  as  naasmu \u0161am  viejam radin\u012bks?\\\"  jys  vaic\u014dja
  nu sova zyrga. \u201eBez cel\u00e1, bez atpyutys, sird\u012b ska\u0146 tei po\u0161a
  myu\u017eeig\u014d rudin\u00e1 dz\u012bsm\u00e1 \u2014 osoru pyln\u014d...\\\"\\n\\nZyrgs
  n\u016bzasprausl\u014dja i br\u012bda t\u014d\u013c\u014dk pa rudin\u00e1 dublim.\\n\\nT\u00e1
  Zemn\u012bka d\u0101ls iz\u0157aizis savylku povodu. T\u012bpa\u021b, tai\u0161ni
  pr\u012b\u0161k\u0101 jys  dzierd\u00e4ja  dz\u012bsmi.  Spieceigi  plyud\u00e1  jaunovys  bolss,  gon
  l\u016bceidam\u014ds, gon tai\u0161ni kai t\u0101rauda esmin\u0219. Zemn\u012bka
  d\u0101ls grib\u00e4ja atk\u014drt\u014d\u021b pyrm\u016b pajiem\u012bni i navar\u00e4ja:
  dz\u012bsm\u00e1 beja par daudzi sve\u0161a.\\n\\nJys n\u016bk\u014dp\u00e1 nu zyrga,
  paj\u00e4m\u00e1 t\u016b aiz povodys i g\u014dja iz pr\u012b\u0161ku. Drei\u017ei
  j\u014d cau\u0146u capur\u00e1 aizam\u00e1t\u00e1 cysu jumt\u0101. Jys p\u012bs\u00e4ja
  zyrgu pi sp\u014dris, p\u012bzal\u012bc\u00e1 i attais\u00e4ja durovys.\\n\\n\u201eLobs
  vokors!\\\" jys teic\u00e1 \u012b\u012bdams.\\n\\n\u201eLobs vokors, gaste\u0146!\\\"
  sprauns bolss atteic\u00e1.\\n\\n\u201eAtsasies\u021b, b\u0233si gosts!\\\" jei
  sac\u00e4 i paj\u00e4m\u00e1 jaunu sp\u016bleiti.\\n\\nZemn\u012bka d\u0101ls apzav\u00e4r\u00e1.
  Beja moza, moza ustaben\u00e1, ar divim mozim l\u016bdzenim. Ustabenis vyd\u0101
  izpl\u0101stys lelys austuvis ar raibu izraksteitu audaklu viers\u0101. Austuvj\u014ds
  s\u00e4d\u00e4ja vaca, vaca m\u0101men\u00e1, myna pamynys, saud\u00e4ja atsp\u016bli
  i dz\u012bd\u014dja nadzierd\u0101t\u016b dz\u012bsmi.\\n\\nZemn\u012bka d\u0101ls
  atsas\u0101da pi cepl\u00e1 iz myuren\u00e1, v\u00e4r\u00e4s, klaus\u00e4j\u00e4s
  i brein\u014dj\u00e4s.  Jys  brein\u014dj\u00e4s  par  raib\u016b  audaklu,  par  m\u014dmulenis
  sn\u012bgbolt\u0233m  motim,  par  j\u014ds  jautrijom  acim,  a  vysvair\u014dk  par  j\u014ds
  dz\u012bsmi.\\n\\n\u201eVoi t\u00e1v, krystam\u014d\u021b, dau\u1e11z taidu dz\u012bs\u1e3fu?\\\"
  jys pavaic\u014dja.\\n\\n\u201eDau\u1e11z, krysdiele\u0146, dau\u1e11z!\\\"\\n\\n\u201eKur
  ta tu t\u014ds vysys jam?\\\"\\n\\n\u201ePazaskotu,  diele\u0146,  pa  v\u012bnu  l\u016bdzeni  \u2014  dz\u012bsm\u00e1i  v\u012bna  pus\u00e1
  gotova, pazaskotu pa \u016btru l\u016bdzeni \u2014 gotova dz\u012bsm\u00e1i \u016btra
  pus\u00e1.\\\"\\n\\nZemn\u012bka d\u0101lam n\u016btierpa sird\u0219.\\n\\n\u201eA
  tu b\u0233si tys Zemn\u012bka d\u0101ls, kurs val\u0101nu i dz\u012bsmi iz t\u016b
  pa\u0161u pusi mat?\\\" jei apzavaic\u014dja.\\n\\n\u201eTo jau tu b\u0233si tei
  m\u0101men\u00e1, kas r\u00e1\u1e11z vysys l\u012btys nu divejom pu\u0219om?\\\"
  jys nadr\u016bsi pavaic\u014dja.\\n\\nZemn\u012bka d\u0101ls navar\u00e4ja n\u016bc\u012bs\u021b:
  jys n\u016bbu\u010d\u014dja m\u0101menis kaulain\u016b r\u016bku.\\n\\nV\u00e1cineit\u00e1
  jam atglaud\u00e4ja p\u012blypu\u0161\u016bs pi p\u012bris motus.\\n\\n\u201e\u00c1j,
  izagu\u013c, d\u0101ls. Gon jau reit\u0101 izarun\u014dsim.\\\"\\n\\nN\u016bv\u014drdz\u0219  i  p\u012bkus\u0219  Zemn\u012bka  d\u0101ls  \u012bzalaid\u00e1  m\u012bg\u0101  kai  d\u016bje\u0146u
  spylvyn\u0101. Caur m\u012bgu jam skan\u00e4ja aus\u012bs austuvis v\u012bnaid\u012b
  sit\u012bni i vac\u014ds m\u0101menis jaun\u014d dz\u012bsm\u00e1.\\n\\n\u016atr\u0101
  reit\u0101 jys pazam\u016bda v\u00e4\u013c zam gaismys aus\u0161onys, a vac\u014d
  m\u0101men\u00e1 beja t\u012bpa\u021b austuvj\u014ds. V\u00e4\u013c breineig\u014dku
  rokstu jei aud\u00e1 i dz\u012bd\u014dja v\u00e4\u013c sovaid\u014dku dz\u012bsmi.\\n\\nVac\u014d
  m\u0101men\u00e1 pazasm\u00e4ja i pakrat\u00e4ja jam ar pierstu.\\n\\nZemn\u012bka
  d\u0101ls n\u016bzamozg\u014dja, sasuk\u014dja motus, pa\u00e4d\u00e1 i atsas\u0101da
  iz myuren\u00e1. J\u014d ac\u0219 g\u014dja vysapleik pa ustabeni.\\n\\n\u201eAs
  jau zynu, t\u00e1v t\u012b l\u016bdzeni vi\u0146 pr\u014dt\u0101 st\u014dv!\\\"
  jei sac\u00e4. \\\"Nu \u00e1j, \u00e1j, pazasko\u021b. Papr\u012b\u0161ku t\u012b
  pi t\u014d pa labi. Tod past\u014ds\u021b ma\u0146 t\u016b, k\u016b redzeisi.\\\"\\n\\nSird\u0219
  Zemn\u012bka d\u0101lam stypri syt\u014ds, kod jys atsas\u0101da pi l\u016bdzen\u00e1.
  Papr\u012b\u0161ku jam apreiba ac\u0219, tod jys p\u012broda i elpu aiztur\u0101dams
  v\u00e4r\u00e4s.\\n\\nCik ilgi jys tai v\u00e4r\u00e4s, t\u014d jys pat\u0219 naatj\u00e4dz\u00e1.
  V\u00e1cineit\u00e1 izlyka jam r\u016bku iz placa i izm\u016bdyn\u014dja kai nu
  jauka sapyna.\\n\\n\u201eNu, d\u0101ls, k\u016b redzieji?\\\" jei sm\u012bgneidama
  vaic\u014dja.\\n\\n\u201eOi  D\u012bve\u0146,  krystam\u014d\u021b,  kas  par  jaukom  l\u012btom!\\\"  Atbi\u013cd\u00e4ja\\n\\nZemn\u012bka
  d\u0101ls i sasyta plaukst\u0219. \u201ePapr\u012b\u0161ku as d\u016bm\u014dju,
  sok, tys laikam m\u0233su mui\u017e\u0101: greida taida vi\u0146 r\u016btaina i
  sleideiga, kai lads, pi s\u012bnom taidi sp\u012bgeli, ka bailis jem tym\u016bs
  skat\u00e4t\u012bs \u2014 tai spei\u1e11... Vysapleik bi\u013cdis, taidys zalta
  ram\u014ds; iz cytys radzama z\u012bma, iz cytys pavasar\u0219, a iz cytys cylv\u0101ki,
  i nazagryb tic\u00e4\u021b, ka t\u014ds ir bi\u013cdis: d\u016bmoj\u0101s, ka niupa\u021b
  k\u016bk\u016bs s\u014dk\u0219 pyust viejen\u0161, ka t\u00e1v tys sve\u0161\u012bs
  c\u012bmen\u0161 sn\u00e4g\u0219 r\u016bku... I tod pa t\u014dm ustobom ska\u0146
  tik jauka muzyka i staigoj taidi lely kungi i lelm\u014dtis, ma\u0146 mugora tai
  i l\u012bc\u0101s iz r\u016bkys bu\u010d\u014d\u0161onu, zeids vi\u0146 \u010dauks\u021b
  i samts valk\u0101s pa greidu kai vosorys nakt\u0219. As tai ve\u013c n\u016bd\u016bm\u014dju,
  sok, cik jauka dzeiv\u00e1 t\u012bm lelkungim. A t\u00e1 iz\u0157aizis klaus\u016bs,
  i voi zyni krystam\u014d\u021b: j\u012b vysi runoj tym\u0101 po\u0161\u0101 vol\u016bd\u0101,
  kai m\u00e1\u0219! K\u016b tu d\u016bmoj, krystam\u014d\u021b: tik skaidri, tik
  glei\u0161i... vysi kai nu gr\u014dmotys. Tod j\u012b s\u00e4d\u00e4ja ap goldu
  i malni kungi j\u012bm n\u00e1s\u00e1 ied\u012b\u0146us i dzier\u012b\u0146us, tod
  p\u012bzac\u00e4l\u00e1 v\u012bns sierms kungs, par vysim cytim c\u012bneig\u014dks,
  i \u012bs\u014dka runu... tik skaisti, tik m\u012bleigi, kai pat\u0219 m\u014dceit\u014djs.
  As klaus\u016bs, klaus\u016bs, i nimoz namonu, ka ma\u0146 osorys bierst par vaigu.
  Jys run\u014dja, ka \u0161ys as\u016bt gon\u016bs g\u014dj\u0219 i orklu cyl\u014dj\u0219,
  i ka \u0161am r\u016bkys as\u016bt beju\u0161ys tulzn\u014dtys nu sprygul\u00e1
  k\u014dta. I kai \u0161ys g\u014dj\u0219 pasaul\u012b, kai cytk\u014drt vac\u012bs
  t\u0101vs J\u0101kobs, tik v\u012bni sv\u014drki mugor\u0101 i v\u0101zda r\u016bk\u0101.
  Jys r\u014dd\u00e4ja zorainu v\u0101zdu i r\u014dd\u00e4ja n\u016bdylu\u0161\u016bs
  pu\u0219vylnon\u016bs sv\u014drkus. T\u012bm v\u00e4\u013c beja p\u012bza\u010dier\u0219
  puteklis, pat\u0219 ar sovu r\u016bku t\u016b n\u016bj\u00e4m\u00e1. I tod as\u016bt
  n\u014dku\u0161ys taidys d\u012bnys, kaidu \u0161ys sovim b\u0101rnim nikod nav\u0101l\u0101tu,
  kur \u0161ys st\u014dviej\u0219 atst\u014dts i n\u016bv\u014drdz\u0219 upis mol\u0101
  i d\u016bm\u014dj\u0219, cik m\u012breigs i v\u0101ss t\u012b vyss dybyn\u0101.
  Da, \u0161ys zyn\u016bt, kas ir v\u012bntuleiba i izmysums. Bet \u0161ys zyn\u016bt
  i kas ir dorbs, kas dorba svieteiba. Trejsdesmit godu \u0161ys as\u016bt str\u014dd\u014dj\u0219
  d\u012bnom i naktim, leidz variej\u0219 tai kai \u0161\u016bvokor atl\u012bk\u021b
  mugoru i atsapyus\u021b sovu b\u0101rnu i draugu vyd\u0101. Trejsdesmit godu \u0161ys
  nazyn\u014dj\u0219, kas ir sv\u0101td\u012bn\u00e1, kas sv\u0101tki, cikom beidz\u016bt
  nu sovim b\u0101rnim \u012bzam\u014dciej\u0219, ka pr\u012bca i atpyuta ir jauka
  D\u012bva d\u014dvyna. Dorbs i atpyuta \u2014 t\u012b obi lai vej\u016bt\u012bs
  caur m\u0233su dzeivi, kai ar pu\u010dom izpu\u0161k\u014dtys zalta va\u017eys.
  I iz dorbu i atpyutu \u0161ys skubynoj\u016bt m\u0233su tautys br\u014d\u013cus
  i par t\u016b dzer\u016bt sovu gl\u014dzi... I voi zyni, krystam\u014d\u021b, tod
  n\u014dc\u00e1 vac\u014d kunga d\u0101ly i \u1e3faitys i bu\u010d\u014dja jam r\u016bkys,
  i draugi j\u016b apkamp\u00e1 i dz\u012bd\u014dja nu sird\u0219.\\n\\n\u201eI tu?\\\"
  v\u00e1ceit\u00e1 sm\u012bdam\u014ds pavaic\u014dja.\\n\\nV\u00e1ceit\u00e1 leidzc\u012bteigi
  pazav\u00e4r\u00e1, kai Zemn\u012bka d\u0101lam mirdz\u00e4ja ac\u0219. Tod jei
  klusom teic\u00e1:\\n\\n\u201eI as? Krystam\u014d\u021b, ma\u0146 sird\u012b pazam\u016bda
  jauna dz\u012bsm\u00e1. As j\u014d\u0161u pa dzimtinis kolnym i l\u00e1jom i dz\u012bd\u014d\u0161u
  par dorbu i par atpyutu. Nav tys, tauta, tovs liktin\u0219, ka dyumoj\u0101 sej\u012b
  dzymst tovi d\u0101ly i dyum\u016bs syuroj j\u016bs osorain\u014ds ac\u0219 leidz
  kopa molai. J\u012bm ir t\u012bseibys sn\u00e4gt\u012bs pec pavasara, pec z\u012bmys
  i t\u014ds s\u012bnys; ari j\u012bm atska\u0146 nadzierd\u0101ti sve\u0161u z\u00e1\u1e3fu  me\u013cdeni.  Nav  vairs  tovim  d\u0101lym  j\u014dleikst  leidz  siermam
  vacumam zam lela gryutuma, kur piersti pal\u012bk steivi i mugora leika. Ari j\u012bm
  Laimis m\u014dmulen\u00e1 ir g\u014dd\u014djus\u00e1 par atpyutu i par m\u012breigu
  myu\u017ea vokoru. De\u013ck\u014d tu n\u016bzapyuti, gudr\u012bs or\u014djs, teirum\u0101
  mol\u0101, kod tu d\u016bmoj par sovim b\u0101rnim? Voi nasajiut tova sird\u0219,
  voi nadzier\u1e11 tova dv\u00e4sel\u00e1, ka j\u012bm izaus\u0219 breini\u0161keigs
  reits, i ka ceirul\u0219 j\u012bm dz\u012b\u1e11 jauku dz\u012bsmi? I breivi n\u016bzapyus\u0219
  laim\u012b i p\u014drtyk\u0101 tovu b\u0101rnu kryut\u0219, i atras\u0219 j\u014ds
  v\u014drdus pr\u012bceigom dz\u012bs\u1e3fom, jo j\u016bs bolss pazac\u00e1l\u0219
  jaunu laiku saskan\u012b... Skot\u012bs, krystam\u014d\u021b, tai as dz\u012bd\u014d\u0161u
  dzimtinis s\u0101t\u014ds; tai as  atspierdzyn\u014d\u0161u  sovu  br\u014d\u013cu  iztveiku\u0161\u014ds  dv\u00e4selis  iz  jaunu
  cereibu...\\\"\\n\\n\u201eNu pazasko\u021b, d\u0101ls, i pa \u016btru l\u016bdzeni...\\\"\\n\\n\u201eZemn\u012bka  d\u0101ls  paklaus\u00e4ja  i  atsas\u0101da.  Aiz  mugorys  otkon
  skan\u00e4ja systuvju kloudz\u012bni i v\u00e1ceitis sp\u016bdr\u014d dz\u012bsm\u00e1.\\n\\n\u201eNik\u014d
  navaru sar\u00e1dz\u00e4\u021b!\\\"  \u0145\u016brd\u00e4ja Zemn\u012bka d\u0101ls.
  Kod j\u014d ac\u0219 p\u012broda pi tymsa, jys \u012braudz\u00e4ja tymsu, p\u012bkv\u0101pu\u0161u
  pogroba ustobu. Pa pu\u0219izdauzeitu l\u016bdzeni var\u00e4ja man\u00e4\u021b sp\u016bdri
  apgaism\u014dtys m\u014djis l\u016bgus, t\u016bs po\u0161us, aiz kurim c\u012bneig\u012bs
  siermga\u013cv\u0219 beja turiej\u0219 sovu svineig\u016b runu.\\n\\nAizdadzyn\u014dja  mozu  petrolejis  lampeni.  Nam\u012breiga  l\u012bsmen\u00e1
  apgaism\u014dja  trejs  s\u012bv\u012btis:  v\u012bnu,  jau  vair\u014dk  kai  pu\u0219myu\u017ea,  vacu
  atbrauceitom  r\u016bkom  pi  mozgojam\u014ds  ba\u013cvys.  \u016atrai  beja  godu
  divdesmit,  nateir\u014ds  zamej\u014ds   dr\u00e4bj\u014ds  i  par  placim  n\u016b\u0161\u013cuku\u0161\u0101,
  namozg\u014dt\u0101 krakl\u0101, kura pa\u0161ulaik pyna kuplu bizi, iz gultys molys
  s\u0101d\u0101dama; tre\u0161a, par t\u016b gryu\u0161i beja pasc\u00e4\u021b, voi
  tei beja jaunova, voi \u1e3faitin\u00e1. Tei s\u00e4d\u00e4ja iz treju k\u014dju
  be\u0146\u010dei\u0161a, ar saulis sorgu r\u016bk\u0101, capuri ar sorkonu spolvu
  golv\u0101, kai iz iz\u012b\u0161onu apzagierbus\u00e1. Jei v\u00e4r\u00e4s to iz
  m\u014dti pi dr\u00e4bju ba\u013cvys, to iz m\u014dsu pi gultys; tod aizlyka ar
  r\u016bku muti i \u017e\u014dv\u014dja.\\n\\n\u201eI t\u016b as t\u00e1v soku, ka
  as po\u0161a n\u016bjim\u0161u s\u00e1v ustobu, vari ko\u010d tu iz golvys staig\u014d\u021b.
  Ka Minne taida mu\u013cka, lai pal\u012bk pi jiusu. T\u016b tik zyni, kai izpl\u00e4s\u021b
  nu man\u00e1 beidzam\u016b kapeiku. A voi esi de\u013c man\u00e1 ko\u010d dr\u00e4bis
  lupateni n\u016bpierkus\u00e1? Lela patik\u0161ona ma\u0146 n\u016bpleisu\u0161ai
  pa \u012blu skraid\u00e4\u021b! Glaun\u014dks cylv\u0101ks \u012bskat\u00e4t\u012bs
  nagryb...\\\"\\n\\n\u201eAs  ari  \u012b\u0161u  ar  L\u012bzi!\\\"  atsasauc\u00e1  \u016btra  m\u014dsa,  ar  saulis  sorgu
  urbyn\u014ddama sapyvu\u0161\u016b greidu. \u201eTod as zynu: k\u016b as n\u016bpe\u013cneju,
  tys ma\u0146 pal\u012bk!\\\"\\n\\n\u201eVoi zyni, kai lik\u0161u par \u017eaunom!\\\"
  m\u014dt\u00e1 \u014dtri, dusm\u014ds aizkl\u012bdz\u00e1, styngrij\u0101 r\u016bk\u0101
  tur\u0101dama sl\u00e1pnu dr\u00e4bis gobolu. \u201eLaikam tu navari sagaid\u00e4\u021b.
  Beigus\u00e1 b\u0233tu pa pr\u012b\u0161ku m\u014dcei\u0161on\u016bs!.. I tu ari
  ma\u0146, tei...\\\" jei pazagr\u012bz\u00e1 iz vac\u014dk\u016b \u1e3faitu. \u201eVoi
  t\u00e1v ir \u012bg\u014dj\u0219 pr\u014dt\u0101 ko\u010d piersteni dad\u016br\u021b
  pi ba\u013cvys? Kas tevi ikkotru reitu apgierb kai preileni, kas atnas iudini, kas
  izv\u014drej kopeji? I t\u00e1v ve\u013c \u017e\u0101l t\u016bs p\u014drs kapeiku...\\\"
  Kai lelu nataisneibu c\u012bsdama, jei umai n\u016bsv\u012bd\u00e1 sl\u00e1pn\u016b
  dr\u00e4bis gobolu ba\u013cv\u0101, atsasp\u012bd\u00e1 po\u0161a iz ba\u013cvys
  molys i sam\u012bdz\u00e1 ar obejom r\u016bkom golvu.\\n\\n\u201eTei niu ir tei
  pateiceiba par munom divdesmit godu pyu\u013com!\\\" jei sac\u00e4. \u201eVoi de\u013ct\u014d
  as asmu skriejus\u00e1 i givus\u00e1, asmu mal\u014djus\u00e1 i zogus\u00e1;  asmu  ar  j\u0101lom  r\u016bkom  str\u014dd\u014djus\u00e1  bodu  c\u012bsdama,  nakt\u0219
  nagul\u0101dama! Vysi tok vac\u014dki d\u016bmoj, izaug\u0219, sok, b\u0101rni,
  b\u0233\u0219 atspaids, b\u0233\u0219 v\u012bgl\u014dkys d\u012bnys... T\u00e1 ir
  munys v\u012bgl\u014ds d\u012bnys pi dr\u00e4bju ba\u013cvys, cikom \u1e3faitys
  staigoj \u0161pac\u012br\u00e4\u021b ar jaunkungim.\\n\\nM\u014dt\u00e1  nabeja  apm\u012bryn\u014dta.  Kai  drudz\u012b  raust\u00e4j\u00e4s  j\u014ds  dorb\u0101
  saleiku\u0161\u012b placi.\\n\\n\u201eNu bei\u1e11z jau sovus p\u014dtorus!\\\"
  pec jakys sn\u012bgdam\u014ds d\u016b\u0161eigi atsasauc\u00e1 vac\u014dk\u014d
  \u1e3faita. \u201eV\u012bns i tys kotru boltu d\u012bnu... apnykst jau!\\\"\\n\\n\u201eKas
  ma\u0146 kait\u00e4ja nadzeiv\u014d\u021b muna t\u0101va s\u0101t\u0101!\\\" jei
  t\u014d\u013c\u014dk gaud\u014dja. \u201eV\u012bneig\u012bs b\u0101rns, \u010detri
  zyrgi s\u0101t\u0101! Voi man\u00e1 grib\u0101t\u014dju tryuka, voi k\u014d! Dzyna
  mani muna nalaim\u00e1 pi taida pi\u013cs\u0101tys plykau\u0161a... Ar m\u00e4li
  s\u016bl\u00e4ja ma\u0146 zalta kolnus, cikom m\u014djis tyka r\u016bk\u014ds...
  Mozgoj niu cauru nakti i ver\u012bs, ka po\u0161ys b\u0101rni nan\u016bl\u012bdz
  t\u00e1v maizis kim\u016bsu...\\\"\\n\\n\u201eTo po\u0161ys nu sev\u00e1 jau m\u00e1\u0219
  naasom pasaul\u012b rodu\u0161\u014ds...\\\" vac\u014dk\u014d \u012bs\u014dka.\\n\\n\u201eT\u0101vs!\\\"
  aizkl\u012bdz\u00e1 jaun\u014dk\u014d i n\u016bg\u014dja pi molys.\\n\\nN\u016bzagr\u012bz\u00e1
  i vac\u014dk\u014d moz\u014dk radzam\u0101 v\u012bt\u0101.\\n\\nM\u014dt\u00e1 st\u014dj\u00e4s
  otkon pi mozg\u014d\u0161onys. Tik div lelys osorys lieni t\u00e1c\u00e4ja par j\u014ds
  nateir\u016b vaigu.\\n\\n\u201e\u013busteigs \u0161ai i \u013custeigs tai...\\\"
  atskan\u00e4ja aiz durovom napareiz\u016bs t\u016b\u0146\u016bs i kai ar k\u014dji
  atspartys leidz pus\u00e1i atsatais\u00e4ja durovys. \u012ag\u014dja pavacs veir\u012bt\u0219,
  sapynk\u014dtu b\u014drzdu, n\u016bpleisu\u0161\u0101 vu\u0161kys \u014ddu ka\u017eucen\u012b,
  ar divejom, kai r\u014dd\u00e4j\u00e4s, pu\u0219tuk\u0161om bute\u013com pozus\u012b.\\n\\n\u201eB\u0101rni,
  as asmu \u0161udi\u0146 \u013custeigs!\\\" vac\u012bs \u012bs\u014dka, kod ar pyuli
  beja atsasied\u012bs iz v\u012bneig\u014d v\u00e4\u013c nasalauzt\u014d kr\u0101sla
  ustob\u0101 i n\u016blic\u0219 butelis iz nateira golda.\\n\\n\u201eKuru d\u012bn
  ta tu naasi \u013custeigs?\\\" p\u014drmasdama atsasauc\u00e1 s\u012bva.\\n\\n\u201eAs
  v\u012bnum\u0101r asmu \u013custeigs!\\\" Ar steivu m\u00e4li atbi\u013cd\u00e4ja
  vac\u012bs. \u201eI \u0161udi\u0146 as asmu \u013custeigs. Voi zynit, kungs, as
  soku \u0161udi\u0146: voi Jiu\u0219 zynit, kungs, ka m\u00e1\u0219 asom obi nu v\u012bna
  pogosta?\\\" \u2014 \u201eDa, P\u012bter,\\\" jys soka... \u201e\u0161a izdz\u00e1\u0157!\\\"
  \u201eIz Jiusu veseleibu, kungs!\\\" as soku. \u2014 \u201ePa\u013cdis, P\u012bter,\\\"
  jys soka. \u201eKaids as jam P\u012bter\u0219, k\u016b? Jys milijon\u0161\u010diks,
  as \u2014 j\u014d dvorniks... n\u0101, as j\u014d dvornika paleigs. A jys soka:
  pa\u013cdis, P\u012bter! Ai, ai, kas t\u012b beja par laikim, kod m\u00e1\u0219
  obi atg\u014djam iz pi\u013cs\u0101tu. Bet cylv\u0101kam vajag \u013custeigam b\u0233\u021b.
  A?\\\"\\n\\nNazin\u012b(i) aiz\u012bsim...\\\"\\n\\nI otkon jys \u012bs\u014dka
  napareizi dz\u012bd\u014d\u021b: \u201e\u0160itai, z\u0101ni, dzeiv\u014ddami\\n\\n\u201eVoi  jiu\u0219  b\u0101rni  grib\u00e4jat  kur  iz\u012b\u021b?\\\"  \u016bt\u0157aiz  jys  pavaic\u014dja  nu
  \u1e3faitom.\\n\\n\u201eGrib\u00e4jam,  t\u00e4\u021b,  drusku  pastaig\u014d\u021b...\\\"  vac\u014dk\u014d  patr\u014dpdama
  atbi\u013cd\u00e4ja. \u201eVoi tu na\u012bsi ar m\u0233sim leidza?\\\"\\n\\n\u201eVoi
  t\u00e1v ir kaids grivin\u012bks pi r\u016bkys?\\\"\\n\\nMeita soka mekl\u00e4\u021b
  pa kabatom.\\n\\n\u201eV\u00e4\u013c b\u0233\u0219...\\\"'' sac\u00e4 jei i past\u012bp\u00e1
  r\u016bku.\\n\\n\u201eMaitys gobols taids!\\\" jei n\u016b\u0161\u0146\u014dc\u00e1,
  \u201evoi tu zyni, kai tei nauda ir pe\u013cneita?\\\"\\n\\nZibin\u00e1 \u014dtrum\u0101
  m\u014dt\u00e1 atsaroda j\u016bs storp\u0101 i pyrms \u1e3faita atgid\u014ds, jau
  naudys gobols izgaisa m\u014dtis mitrij\u0101 sauv\u012b.\\n\\nZemn\u012bka  d\u0101ls  sazatryuka,  vacij\u0101  s\u0101tys  puis\u012b  pazavier\u0219,  tik
  br\u012bsmeigi  beja  p\u014drzamej\u0219  niupa\u021b  \u201e\u013custeig\u012bs\\\"  vec\u0219:  kai  satrok\u014dts
  zvier\u0219 tys d\u00e1v\u00e4s iz sovu s\u012bvu, kura kai j\u016bk\u014ddama st\u012bp\u00e1
  pret j\u016b v\u012bnu r\u016bku  ar  sl\u00e1pnu,  sagr\u012bztu  dr\u00e4bis  gobolu  i  tym\u0101  breid\u012b  ar  \u016btru
  steidzeigi n\u016bglob\u014d naudys gobolu mut\u012b. Vac\u012bs vairs naj\u00e4dz\u00e1
  nik\u014d. Boltys putys par b\u014drzdu sprausl\u014ddams, jys syta ar kul\u0101ku
  s\u012bvai par placu, par golvu, sazatyna sl\u00e1pnij\u0101 dr\u00e4b\u012b, n\u016br\u014dv\u00e1
  s\u012bvai lakateni nu golvys, \u012bza\u010d\u00e4r\u00e1 j\u014ds n\u016bdylu\u0161ij\u0101
  biz\u012b i gryust\u00e4ja tod j\u014ds golvu pret durovu stenderi, pat\u0219 nalob\u0101
  bols\u0101 kl\u012bgdams. S\u012bva izst\u012bp\u00e1 r\u016bkys pret s\u012bnu.
  Tod veirs aizvylka j\u016b a\u010dg\u014drni iz dr\u00e4bju ba\u013cvu i pyul\u00e4j\u00e4s
  \u012bb\u014dz\u021b j\u014ds golvu nateirij\u0101 iudini. S\u012bva p\u012bza\u010d\u00e4r\u00e1
  pi ba\u013cvys molys. Vec\u0219 j\u016b raust\u00e4ja, raust\u00e4ja, bet navar\u00e4ja
  atrau\u021b n\u016bst nu ba\u013cvys. A\u0161\u0146ainom acim jys apzav\u00e4r\u00e1
  apleik: cepl\u00e1 pr\u012b\u0161k\u0101 beja div pagalis. Tym\u0101 breid\u012b,
  kod jys pec v\u012bnys sn\u00e4dz\u00e4s, vac\u014dk\u014d \u1e3faita cauri skr\u012bdama
  apdz\u00e4s\u00e1 lampeni. Tod obejis \u1e3faitys izskr\u00e4ja pa durovom \u014dr\u0101.\\n\\nKod
  pec breisnen\u00e1 s\u012bva \u012bdadzyn\u014dja lampeni, veirs jau kr\u014dc\u00e1
  gult\u0101, kur jys natei\u0161am beja \u012bkrit\u0219. Jei vyspyrms n\u016bglob\u014dja
  izgl\u014dbt\u016b naudys  gobolu  i  n\u016bslauc\u00e4ja  a\u0161ni  nu  vaiga.  Tod  jei  pazav\u00e4r\u00e1  pa
  l\u016bdzeni iz pogolmu.\\n\\n\u201eKur ir pr\u014dts, tik vieli volk\u014dt\u012bs
  apleik!\\\" jei pad\u016bm\u014dja. \u201eB\u0233tu lob\u014dk pagaidieju\u0161ys,
  cikom t\u00e1pa\u021b m\u0233su jaun\u012bm kungim \u012b\u0219 c\u012bmeni iz m\u014djom...\\\"\\n\\nTod  jei  st\u014dj\u00e4s  otkon  pi  dr\u00e4bju  ba\u013cvys.  Zemn\u012bka  d\u0101ls  kai
  sastindz\u0219  v\u00e4r\u00e4s  gon  iz  j\u016b,  gon  iz  kr\u014dc\u016b\u0161\u016b  s\u0101tys  puisi.  Pa
  pu\u0219izdauzeit\u016b  l\u016bdzeni  var\u00e4ja  man\u00e4\u021b  sp\u016bdri  apgaism\u014dtu  kungu
  nomu.\\n\\n\u201eV\u012bna  pogosta  cylv\u0101ki!\\\"  Zemn\u012bka  d\u0101ls  skumeigi  pateic\u00e1  i
  atsazv\u00e4l\u00e1 iz myurei\u0161a.\\n\\n* * *\\n\\nJys \u012braudz\u00e4ja divejus
  b\u0101rnus, puis\u0101nu i \u1e3faitini, ru\u0161ynoj\u016bt\u012bs pa smi\u013cktim.
  J\u012b beja n\u016bplyuku\u0161i p\u013cov\u0101 pu\u010dis i stat\u00e4ja tagad
  t\u014ds sov\u0101 smi\u013ck\u0161u skaudz\u012b. Pa \u0157aiz\u00e1i puis\u0101ns
  paj\u00e4m\u00e1 iudin\u00e1 konnu, aizg\u014dja iz pumpi,  p\u012bpump\u00e4ja
  t\u016b leidz pus\u00e1i i n\u00e1s\u00e1 iz pu\u010dom. Bet d\u012bvam\u017e\u0101l:
  kai laisteit\u014ds,  tai  nalaisteit\u014ds,  gondrei\u017e  vysys  n\u016bk\u014dr\u00e1  sovys  ga\u013cvenis
  vokora saul\u012b.\\n\\n\u016atr\u0101  reit\u0101  Zemn\u012bka  d\u0101ls  jau  bez  aicyn\u014d\u0161onys  atsas\u0101da  pi
  l\u016bdzen\u00e1.\\n\\n\u201eK\u014dpusti ari n\u016bveist, kod \u012bstota: bet
  reit\u0101 vysi otkon st\u014dv...\\\" m\u012bryn\u014dja puis\u0101ns.\\n\\n\u201eJ\u014dm
  laikam t\u00e1 napateik...\\\" atsasauc\u00e1 \u1e3faitin\u00e1.\\n\\nPuis\u0101ns
  breisneni d\u016bm\u014dja.\\n\\n\u201ePatik\u0219 gon!\\\" galeigi jys teic\u00e1
  i \u010d\u00e4r\u00e4s otkon pi l\u014dpstys.\\n\\nT\u014dlum\u0101  beja  dzier\u017eama  rotu  reibei\u0161ona.  Nu  zam  k\u016bku
  pakrie\u0161l\u00e1 izg\u014dja pajauna s\u012bv\u012bt\u00e1, gr\u014dmotu r\u016bk\u0101
  tur\u0101dama. R\u016bku iz acim izlykdama pazav\u00e4r\u00e1 iz t\u016b pusi, kur
  beja dzier\u017eama reibei\u0161ona.\\n\\nTod  jei  \u014dtri  atsagr\u012bz\u00e1  iz  b\u0101rnim,
  kuri  ar  iudini  i  smi\u013cktim beja n\u016bzap\u0101ru\u0161i kai zvierbuli.\\n\\nB\u0101rni
  pazav\u00e4r\u00e1 pa pr\u012b\u0161ku iz sovom pu\u010dei\u021bom, tod iz m\u014dti
  i v\u012bns pec \u016btra izgaisa ustob\u0101.\\n\\n\u201eKai jiu\u0219 izaskotot!\\\"
  pavaic\u014dja j\u016bs s\u012bv\u012bt\u00e1, \u201etivlei\u021b \u00e1jt\u00e1
  ustob\u0101, lai Mad\u00e1 jiusus n\u016bmozgoj i apvalk cytys dr\u00e4bis.\\\"\\n\\nDrei\u017ei
  pi m\u014djis n\u016bst\u014dja divej\u016bs zyrg\u016bs aizjiugti roti i nu t\u012bm
  izl\u00e4c\u00e1 pu\u0219myu\u017ea veir\u012bt\u0219, ar n\u016bputieju\u0161\u016b
  mieteli mugor\u0101. Pa pr\u012b\u0161ku jys  grib\u00e4ja  skr\u012b\u021b  ustob\u0101,
  tod  paman\u00e4ja  s\u012bv\u012bti  i  d\u00e1v\u00e4s  iz  t\u016b  pusi, steidzeigi
  n\u016bvylkdams braucam\u016bs cymdus.\\n\\n\u201eNiupa\u021b  \u012bskr\u00e4ja  ustob\u0101...\\\"  atbi\u013cd\u00e4ja  s\u012bva,  atbrauciejam
  sn\u0101gdama sovu slaid\u016b r\u016bku, kuru jys g\u016bdbijeib\u0101 vylka pi
  lyupom. \u201eRedzi, t\u00e1 j\u012b tev\u00e1 gaideidami, stat\u00e4ja d\u014drzu...\\\"
  Jei par\u014dd\u00e4ja iz smi\u013ck\u0161u skaudzi.\\n\\n\u201eTu t\u00e1?\\\"
  jys atsasauc\u00e1 i sirsneiga m\u012blesteiba pazar\u014dd\u00e4ja j\u014d sej\u012b.
  \u201eKur b\u0101rni? Voi vasaly?\\\"\\n\\nVeiram ac\u012bs pazar\u014dd\u00e4ja
  osorys.\\n\\n\u201eKurs ta t\u016b izd\u016bm\u014dja?\\\" jys vaic\u014dja.\\n\\n\u201eLaikam
  Marija... tai v\u012bnm\u0101r vair\u014dk n\u012bku pr\u014dt\u0101.\\\"\\n\\n\u201eN\u016bveitu\u0161u
  pu\u010du d\u014drzs...\\\" veirs d\u016bmeigi teic\u00e1 i n\u016bzapyut\u00e1;
  \u201eda, i m\u00e1\u0219 lel\u0233 naspiejom vysod izsorg\u014d\u021b sovu m\u012bl\u014dk\u016b
  pu\u010deiti nu solnys, nu kv\u00e4lis i n\u016bveis\u0161onys...\\\" Tod jys umai
  kai n\u016bkrat\u00e4ja \u0161\u016b \u0101nu nu sejis i  teic\u00e1  p\u012bm\u012bgdams  s\u012bvu  pi  sovom  spieceigij\u014dm  kryutim.  \u201eVyss
  k\u014drteib\u0101! Tovs br\u014dl\u0219 pal\u012bk sov\u014ds m\u014dj\u014ds...\\\"
  S\u012bva grib\u00e4ja \u2014 pr\u012bceigi p\u014drsteigta  \u2014  ko\u010d  k\u016b  atbi\u013cd\u00e4\u021b,  bet  lels  tr\u016bksnis  pr\u012b\u0161knom\u0101  t\u016b
  iztrauc\u00e4ja.\\n\\n\u201eT\u00e4t\u00e1 m\u014dj\u012b, t\u00e4t\u00e1 m\u014dj\u012b!\\\"
  kl\u012bdz\u00e1 puis\u0101ns pa pr\u012b\u0161knomu, i \u201et\u00e4t\u00e1 m\u014dj\u012b,
  t\u00e4t\u00e1 m\u014dj\u012b!\\\" seik\u0101 ba\u013csten\u012b jam paka\u013c
  sauc\u00e1 \u1e3faitin\u00e1. Durovys drei\u017ei tyka atgryustys i pa t\u014dm
  \u014dr\u0101 izskr\u00e4ja puis\u0101ns, sl\u00e1pnu muti i r\u016bkom, eis\u0101
  bolt\u0101 kreklen\u012b. Jys b\u0233tu n\u016bzaviel\u012bs pa tra\u1e55om z\u00e1m\u012b,
  ka t\u0101vs j\u014d nab\u0233tu sa\u010dier\u0219.\\n\\n\u201eLie\u0146\u014dk
  draugs... lie\u0146\u014dk... Kaids tu izaskoti?\\\"\\n\\nNaatlyka laika d\u016bm\u014d\u021b
  par pui\u0161a bezbik\u0161ain\u016b izskotu, part\u016b ka iz m\u014djis tra\u1e55om
  spruka po\u0161laik jauns registrs val\u012b. T\u012b beja moz\u014d Marija, taipa\u021b
  tik kreklen\u012b, ac\u0219 ar r\u016bce\u0146om barzdama, \u012bz\u012bp\u014dtu
  muti. Nabadzeit\u00e1i z\u012bpis po\u0161ulaik beja tyku\u0161ys ac\u012bs, i jei
  navar\u00e4ja tik\u021b ni iz pr\u012b\u0161ku, ni atpaka\u013c.\\n\\nT\u0101vs
  paj\u00e4m\u00e1 nu kolpyunis sl\u00e1pn\u016b dv\u012bli, izslauc\u00e4ja i izbu\u010d\u014dja
  \u1e3faitin\u00e1i ac\u0219, pat\u0219 atsas\u0101da iz tra\u1e55u pak\u014dp\u012bnim
  i paj\u00e4m\u00e1 obejus pu\u0219plyk\u016bs b\u0101rnus kliep\u012b.\\n\\n\u201eAk  to  jiu\u0219  mani  gaid\u00e4jat  gon?\\\"  vaic\u014dja  jys,  v\u0101rad\u012bs  j\u016bs
  n\u016bsorku\u0161\u016bs vaidze\u0146\u016bs. \u201eVoi t\u014d de\u013c j\u014dskr\u012bn
  pu\u0219plykim \u014dr\u0101? Marij, kur\u0101 \u1e3faita kreklen\u012b staigoj
  pa lauku?\\\"\\n\\n\u201eNu labi, jau pazaskatieji... \u00e1j vyd\u0101. As tivlei\u021b
  \u012b\u0161u. A tu, br\u014d\u013c: voi esi redziej\u0219 kaidu puisi bez bik\u0219om?\\\"\\n\\n\u201eAs  tik  druscei\u021b  vi\u0146  gribieju  pazaskat\u00e4\u021b...\\\"  pu\u0219raud\u014ddama
  atbi\u013cd\u00e4ja \u1e3faitin\u00e1.\\n\\n\u201eBazneic\u0101 t\u012b e\u0146gelei\u0161i
  ir vysi bez bik\u0219om...\\\" puis\u0101ns atteic\u00e1.\\n\\n\u201eNu da, t\u012b
  e\u0146gelei\u0161i... t\u012b ve\u013c mozi\u0146ki. A tu tok esi lels puis\u0219.
  Lely pui\u0161i tok tai nastaigoj.\\\"\\n\\n\u201eTam  vacijam  Mozum  bazneic\u0101  ari  nav  bik\u0161u!\\\"  puis\u0101ns
  past\u014dv\u00e4ja iz sova.\\n\\n\u201eNu da, tys Mozus... tys.. A voi tu zyni:
  as t\u00e1v nazk\u016b atve\u017eu. Kur tu t\u016b \u012bb\u014dzsi, kod nab\u0233\u0219
  kabatu?\\\"\\n\\n\u201eVoi tys \u0101dams?\\\" pavaic\u014dja puis\u0101ns.\\n\\n\u201eN\u0101,
  br\u014d\u013c, globojams...\\\" t\u0101vs sm\u012bdam\u012bs atteic\u00e1.\\n\\n\u201eTod  as  tivlei\u021b...\\\"  i  bolt\u014d  ga\u013cven\u00e1  n\u016bkust\u00e4ja  vi\u0146  kr\u0101slainij\u0101
  pr\u012b\u0161knom\u0101.\\n\\nPec breisnen\u00e1 kolpyun\u00e1 iznes\u00e1 goldautu
  i traukus, i n\u016blyka iz golda  pakriesl\u012b  zam  l\u012bpom.  M\u012bleiga,  \u012bdzaltona  gaisma  kryta  par
  golda boltumu, izgaisdama kupl\u016b lopu zali-malnyj\u016bs vejum\u016bs.\\n\\nVeirs
  ar s\u012bvu izg\u014dja zam r\u016bkys nu ustobys i atsas\u0101da pi golda. S\u012bva
  v\u00e4r\u00e4s, kai veirs \u00e4d\u00e1 lelym kim\u016bsim. Po\u0161a tik mais\u00e4ja
  \u010daji ar sudobra kar\u016bteiti.\\n\\n\u201eMarte\u0146!\\\" jei iz\u0157aizis
  \u012bs\u014dc\u00e1 i pazagr\u012bz\u00e1 tyv\u014dk pi veira, \u201eas tai\u0161ni
  nazynu... ma\u0146 tei\u0161am kauns, ka t\u00e1v tik lela izad\u016b\u0161ona m\u0233su
  \u2014 muna br\u014dl\u00e1 lob\u0101...\\\"\\n\\nVeirs n\u016bslauc\u00e4ja lyupys
  servet\u012b i pazav\u00e4r\u00e1 iz s\u012bvu, golvu pal\u012bc\u0219.\\n\\n\u201eNu,
  voi tu esi ar m\u012bru, ka J\u014dn\u00e1m navajag \u012b\u021b pr\u016bjom?\\\"
  jys vaic\u014dja.\\n\\n\u201eKai tu tai vari run\u014d\u021b! Vysu nedeli ma\u0146
  tik t\u014ds vi\u0146 d\u016bmys, tys v\u012bns kauns nalyka m\u012bra: vac\u014d
  Rezys d\u0101ls izklapeits! As nazynu, kai lai as t\u00e1v t\u016b atmoksoju!\\\"\\n\\nVeirs
  breisneni pad\u016bm\u014dja. Tod jys pagau\u0161i teic\u00e1:\\n\\n\u201eAnna,
  as t\u00e1v k\u016b teik\u0161u: tik pr\u012bceigs, kai \u0161udi\u0146 as naasmu
  nikod ve\u013c bej\u0219... kai m\u00e1\u0219 asom apzaprecieju\u0161i. Tu, sirsne\u0146,
  nimoz nazyni, cik br\u012bsmeiga nosta mani m\u012bdz\u00e1 \u0161\u016b vysu laiku.
  Ma\u0146 beja jau trejsdesmit ostoini godi, t\u00e1v devei\u0146padsmit, kod tu
  atg\u014dji iz munu m\u014dji. As st\u014dvieju kai v\u012bntu\u013c\u0161 k\u016bks,
  rudin\u00e1 vieja aplauzeits. Tova dzeiv\u00e1 beja kai pu\u010du d\u014drzen\u0161:
  pylna pympuru. K\u016b ta as t\u00e1v varieju s\u016bl\u00e4\u021b, k\u016b d\u016b\u021b?
  Ni stoltuma, ni skaistuma, ni jautrys vol\u016bdys. Kod ma\u0146 grib\u00e4j\u00e4s
  t\u00e1v teik\u021b m\u012blus v\u014drdus, pazaskatieju iz tevi, ka tu b\u014dla
  i klusa staigoj pa ustobom i pa d\u014drzu, as apklusu... as klusieju ar t\u016b
  apzini sird\u012b, ka asmu br\u012bsmeigi pret tevi lels n\u016bz\u012bdzn\u012bks.
  Tod n\u014dc\u00e1 m\u0233su bierneni. T\u00e1v vysys c\u012bs\u0161onys, vysys
  s\u014dpis. I otkon as t\u00e1v nik\u014d navarieju d\u016b\u021b par t\u016b bezgola
  lel\u016b laimi, kuru tu ma\u0146 devi. Voi zyni, kod tu tai t\u016b\u0157aiz gulieji
  gult\u0101 taida b\u014dla, izv\u014drgus\u00e1, i  m\u0233su puis\u0101ns pi tev\u00e1
  kl\u014dtu, taids mozi\u0146ks, n\u012bceigs, tod as da\u017eu\u0157aiz klusom,
  iz pierstu golym p\u012bleidu pi tova galvgal\u00e1, skatiej\u016bs iz jiusim obejim,
  cikom ma\u0146 soka bir\u021b osorys nu laimis i \u017e\u0101lobom. I tod as apzajiemu
  sov\u0101  sirdi,  sok,  D\u012bvs  lai  ma\u0146  paleidz,  kab  tev\u00e1  nikod,  nikod
  naapkryudeitu... i lai Jys ma\u0146 at\u013caun p\u012bdzeiv\u014d\u021b t\u016b
  breisneni, kur as ko\u010d mozu, mozu daleni var\u0101tu atmoks\u014d\u021b nu t\u014ds
  laimis bogoteibys, kura ar tevi k\u016bp\u0101 \u012bg\u014dja mun\u0101 s\u0101t\u0101.
  Pag\u014dja godi, bierneni auga, muna jauneiba  otkon  tym\u016bs  pazam\u016bda,  a  de\u013c  tev\u00e1  as  nik\u014d  navarieju
  padar\u00e4\u021b. Beidz\u016bt atg\u014d tys breid\u0219... Voi zyni, sirsne\u0146:
  iz apgobola t\u012bsu as  brau\u010du  kai  iz  k\u014dzom,  a  atpaka\u013c  daudzi,  daudzi  laimeig\u014dks...
  Pa\u013cdis, m\u012bl\u014d, ka ma\u0146 t\u016b at\u013c\u014dvi...\\\"\\n\\n\u201eKur
  ma\u0146 t\u016b\u0157aiz beja tei d\u016b\u0161a, taidam vacam sok\u014drn\u00e1m
  tevi prec\u00e4\u021b?\\\"\\n\\nJys p\u012bzal\u012bc\u00e1 pi s\u012bvys r\u016bkys,
  gon laikam lai p\u014drvylktu ar mutis autu par acim.\\n\\nS\u012bva aplyka jam
  r\u016bkys ap koklu i n\u016bbu\u010d\u014dja j\u014d p\u012bri.\\n\\n\u201eAs t\u016bmar
  tevi m\u012b\u013coju!\\\" jei teic\u00e1.\\n\\n\u201eIt\u016b v\u014drdeni as t\u00e1v
  nikod, nikod naaizmiers\u0161u...\\\"\\n\\nVeirs breidi klus\u00e4ja. Tod jys saj\u00e4m\u00e1
  ar obejom r\u016bkom j\u014ds lob\u016b r\u016bku i klus\u0101 sirsneib\u0101 teic\u00e1:\\n\\nPa  attaiseit\u016b  l\u016bgu  nu  ustobys  beja  dzier\u017eami  stu\u0146din\u012bka
  torkst\u016b\u0161i sit\u012bni. Veirs klusom t\u016bs skait\u00e4ja.\\n\\n\u201eJau
  desmit\\\" jys atsasauc\u00e1. \u201eReit\u0101 ma\u0146 agri otkon vajag b\u0233\u021b
  k\u014dj\u014ds. P\u012bd\u016b\u1e11, sirsne\u0146, as gon \u012b\u0161u vyd\u0101.
  Vysu pag\u014dju\u0161\u016b nedeli naasmu k\u014drteigi tic\u0219 gult\u0101. Voi
  tu v\u00e4\u013c paliksi?\\n\\n\u201eDa... druscei\u021b... Laiks ir jauks...\\\"\\n\\n\u201eBreinum
  jauks. Tik naprosa\u013c. As izsyutei\u0161u t\u00e1v ar Madi lelu lokotu... Ar
  lobu nakti, draudzi\u0146, i pa\u013cdis par vysu!... Klaus\u012bs, kai ciercin\u0219
  kiek\u012b dz\u012b\u1e11. Tys as\u016bt iz laimi.\\\"\\n\\n\u201eNu?\\\" v\u00e1ceit\u00e1
  vaic\u014dja, dz\u012bsmi p\u014drtraukdama.\\n\\nMirdz\u016b\u0161om acim Zemn\u012bka
  d\u0101ls p\u012bzatryuka k\u014dj\u014ds. Lelym s\u016blim jys s\u014dka staig\u014d\u021b
  pa ustabeni.\\n\\n\u201eKrystam\u014d\u021b,\\\"  Zemn\u012bka  d\u0101ls  aizgr\u014dbts  run\u014dja,  \u201ema\u0146  jauna
  dz\u012bsm\u00e1 atskan\u00e4ja aus\u012bs \u2014 dz\u012bsm\u00e1 par m\u012blesteibu.\\\"\\n\\n\u201eM\u012blesteibys
  dz\u012bsm\u00e1? Oi, d\u0101ls, tei ir vaca dz\u012bsm\u00e1. Tys, kas t\u016b
  pyrm\u016b \u0157aizi dzier\u1e11, tik tys d\u016bmoj, ka jam tei pyrm\u016b \u0157aiz
  atskan\u00e4ja.\\\"\\n\\n\u201eN\u0101, krystam\u014d\u021b, na par t\u016b m\u012blesteibu,
  kura tveikst i ilgoj\u0101s, par pu\u010dei\u021bom i putinenim jautoj. As dz\u012bd\u014d\u0161u
  par cytu m\u012blesteibu. As dz\u012bd\u014d\u0161u par veira m\u012blesteibu, kurs
  v\u012bntuleigu ce\u013cu \u012bdams, nagaideitu atr\u016bn s\u00e1v draugu. Jys
  ver\u0101s sovam draugam ac\u012bs i navar sapras\u021b, voi tys ir sapyns, voi
  pat\u012bseiba: ir cylv\u0101ks, kas par j\u016b d\u016bmoj, ir v\u012bns cylv\u0101ks,  kuram  pateik  tik  ar  j\u016b  k\u016bp\u0101  \u012b\u021b.  Tyspa\u021b  ol\u016bten\u0161  j\u016bs
  spierdzynoj, tei po\u0161a pu\u010deit\u00e1 j\u016bs pr\u012bcynoj. I k\u016b vair\u014dk
  jys sovam draugam d\u016bd, t\u016b bogot\u014dks pat\u0219 pal\u012bk. Jam gryb\u0101t\u016bs
  de\u013c sova drauga mier\u021b i laimeigam b\u0233\u021b, jam gryb\u0101t\u016bs
  dzeiv\u014d\u021b, lai par sovu draugu pr\u012bc\u014dt\u012bs... I krystam\u014d\u021b...\\\"
  Zemn\u012bka d\u0101la bolss tyka sv\u0101tsvineigs... \u201ev\u00e4\u013c v\u012bna
  dzeivis meikl\u00e1 ma\u0146 \u012bg\u014dja pr\u014dt\u0101...\\\"\\n\\n\u201eNu?\\\"\\n\\n\u201eMa\u0146
  divi bolsi ir sird\u012b. V\u012bns soka: dzeivoj de\u013c sev\u00e1, a \u016btrs
  soka: miersti par cytim. As nasapr\u016btu kai t\u012bm obejim paklaus\u00e4\u021b.
  Tagad as t\u016b zynu: de\u013c sovu b\u0101rnu mierdams, tu dzeiv\u014dsi de\u013c
  sev\u00e1. Par t\u016b m\u012blesteibu  as  dz\u012bd\u014d\u0161u:  divi  draugi  mier\u0219,  lai  dzeiv\u014dtu  sov\u016bs
  b\u0101rn\u016bs...\\\"\\n\\n\u201eDz\u012bdi, d\u0101ls, dz\u012bdi. A pa pr\u012b\u0161ku
  pazasko\u021b pa t\u016b \u016btr\u016b l\u016bdzeni!\\\"\\n\\nZemn\u012bka d\u0101ls
  paklaus\u00e4ja.\\n\\nJauna s\u012bv\u012bt\u00e1 beja apzasagus\u00e1 ar lelu lokotu
  i st\u014dv\u00e4ja pi d\u014drza v\u014drtenim. Iz p\u013covys beja pazac\u0101lus\u00e1
  v\u012bgla mygla, par kur\u016b tivlej\u014d bierz\u0219 r\u014dd\u00e4j\u00e4s
  kai zal\u00e1, nu bolt-pal\u0101ka iudin\u00e1. Namaneits pyln\u0233\u0219 mienes\u0219
  beja izk\u014dp\u0219 par bierzi i v\u00e4r\u00e4s nazkur t\u014dlum\u0101, kai
  klusys, jam po\u0161am tik sapr\u016btamys d\u016bmys d\u016bm\u014ddams.\\n\\nJaun\u014d
  s\u012bv\u012bt\u00e1 izsp\u012bd\u00e1 r\u016bku iz kryutim.\\n\\nBeja dzier\u017eami
  m\u0101roni s\u016bli. N\u016b\u0161veikst\u00e4ja kryumu zori otkon k\u016bp\u0101
  sazam\u012bgdami.\\n\\n\u201eLobs vokors!\\\" atskan\u00e4ja nu kir\u0161u kryuma
  pakrie\u0161l\u00e1. Jauns veir\u012bt\u0219 studenta form\u0101 st\u012bp\u00e1
  jai r\u016bku.\\n\\n\u201eLobs vokors!\\\" jei atbi\u013cd\u00e4ja, pec breisnen\u00e1
  atvylkdama sovu r\u016bku atpaka\u013c.\\n\\n\u201eTik v\u0101lu c\u012bmen\u00e1
  gon vairs nagaidieji?\\\" jys teic\u00e1. I j\u014d tyms\u014ds ac\u0219 lieni sleid\u00e4ja
  par j\u014ds smuk\u016b augumu.\\n\\n\u201eTu v\u012bna po\u0161a s\u0101t\u0101?\\\"
  jys pu\u0219bols\u0101 vaic\u014dja.\\n\\n\u201eGaidieju...\\\"  jei  kai  kav\u0101dam\u014ds  atbi\u013cd\u00e4ja,
  \u201ema\u0146  sac\u00e4, ka tu \u0161\u016breit atbrauc\u0219.\\\"\\n\\n\u201eN\u0101.\\\"\\n\\nObi
  apklusa.\\n\\n\u201eSt\u014dsti lob\u014dk, kai t\u00e1v g\u014dja...''\\\" jei
  pyrm\u014d \u012bs\u014dka. \u201eVoi studejis beidzi?\\\"''\\n\\nJys atsasp\u012bd\u00e1
  ar obejom aukiu\u0146om iz v\u014drte\u0146u st\u016bpen\u00e1 i pasl\u00e4p\u00e1
  sovu n\u016bsorku\u0161\u016b vaigu plaukst\u012bs.\\n\\n\u201eEh\\\" jys pec breisnen\u00e1
  caur z\u016bbim teic\u00e1, \u201etai grib\u0101tus vysu sagr\u014db\u021b, sam\u012bg\u021b
  i  meid\u00e4\u021b... meid\u00e4\u021b ar   k\u014djom vysu pasauli, sevi pa\u0161u,...
  sovu sirdi...\\\"\\n\\nJaunai s\u012bv\u012bt\u00e1i kryut\u0219 s\u014dka stypr\u014dk
  cyl\u014dt\u012bs. J\u014ds seja palyka b\u014dla, laikam nu miene\u0161a gaismys.
  Tik r\u014dd\u00e4j\u00e4s, ka ac\u0219 ar v\u012bnu palyka tyms\u014dkys, maln\u014dkys.\\n\\n\u201eTu
  vaicoj, voi as studejis beid\u017eu?\\\" jauneklis run\u014dja. \u201eDa, de\u013c
  k\u014d ta lai str\u014ddoju. De\u013c k\u014d lai as t\u014ds beidzu?\\\"\\n\\n\u201eTu
  tak gribieji pyul\u00e4t\u012bs... de\u013c moz\u014dkij\u012bm br\u014dlim... de\u013c
  vysu \u013cau\u017eu...\\\" jei nadr\u016bsi izteic\u00e1.\\n\\n\u201eDe\u013c vysu
  \u013cau\u017eu!\\\" jys ryugti atbi\u013cd\u00e4ja, \u201eda, \u0157aiz as gon
  beju tik biernen\u0161, ka ticieju cylv\u0101kim, ticieju dorbam de\u013c moz\u014dk\u012bm
  br\u014dlim. Pa\u013cdis D\u012bvam, atsaroda lobi \u013caud\u0219, kuri nu munys
  sird\u0219 izplyuc\u00e1 \u0161\u016b ticeibu pa lapen\u00e1i vi\u0146 kai s\u012brenis
  z\u012bdu...\\\"\\n\\nJys gondrei\u017e naideigi pazav\u00e4r\u00e1 iz jaun\u016b
  s\u012bv\u012bti.\\n\\n\u201eKam tu v\u012bnmar par t\u016b po\u0161u!\\\" jei s\u014dpeigi
  teic\u00e1.\\n\\n\u201eAs \u0157aiz redzieju \u014drpr\u014dteig\u016b...\\\" jys
  dryumi run\u014dja. \u201eJam beja gun\u0219gr\u0101k\u0101 sadagu\u0161i divi bierneni,
  nu t\u014d jys pazaud\u00e4ja sovu pr\u014dtu. Myu\u017eam jys staig\u014dja apleik
  i run\u014dja par sovim b\u0101rnim... nadar\u00e4ja niv\u012bnam  nik\u014d  \u013cauna,
  bet  cyta nik\u014d  narun\u014dja,  kai  tik  par  sovim biernenim... Ma\u0146
  r\u014dd\u012bs, ka ma\u0146 ir sadedz\u0219 dau\u1e11z, dau\u1e11z vair\u014dk...
  I k\u014d pec beja j\u014dmierdej \u0161\u016b munu korst\u016b ticeibu iz \u013caudim?
  K\u014d pec ma\u0146 beja j\u014dmierdej munu pr\u012bcu iz dorbu, k\u014d pec beja
  j\u014dmeida dub\u013c\u016bs vysu, k\u016b as pu\u0161k\u014dju, kai sova sv\u0101tuma
  oltori!\\\"\\n\\nPo\u0161ai namon\u016bt, jaun\u014ds s\u012bv\u012btis r\u016bka
  p\u012bzadyur\u00e1 pi j\u014d p\u012bris. Ar \u016btr\u016b  r\u016bku  jei  jam  leini  gl\u014dst\u00e4ja  maln\u016bs  motus  kai  raud\u016b\u0161am
  b\u0101rnam.\\n\\nDzi\u013c\u014ds s\u014d\u1e55\u014ds jys atsp\u012bd\u00e1 sovu
  seji iz v\u014drtu st\u016bpen\u00e1. Capur\u00e1 jam n\u016bkryta pylnyj\u0101
  rosys z\u014dl\u012b i kupl\u0233, maln\u0233 moti n\u016bzak\u014dr\u00e1 iz l\u00e1ji.\\n\\n\u201eAs  asmu  vysvysaidi  izraudziej\u0219...\\\"  jys  run\u014dja,  a  v\u014drdi  j\u014d
  dzierd\u00e4j\u00e4s kai nu zam z\u00e1mis: \u201eas d\u012bnom i naktim asmu str\u014dd\u014dj\u0219,
  cikom nu n\u016bguruma saleiku pi sov\u0101 kr\u0101sla. As asmu izmekliej\u0219
  vystrok\u014dk\u016bs b\u012bdrus i asmu nede\u013com k\u016bp\u0101 ar j\u012bm
  min\u0219 dub\u013c\u016bs sovu cylv\u0101ka  sajus\u0161onu.  As  asmu  g\u014dj\u0219  nu  v\u012bnys  v\u012btys  iz  \u016btru,  kur
  m\u012blesteiba  teik  pierkama,  asmu  raudziej\u0219  cytu  s\u012bv\u012b\u0161u  kaun\u0101
  n\u016bsleicyn\u014d\u021b p\u012bmini par t\u016b v\u012bnu, kas ma\u0146 tik d\u014drga
  ir bejus\u00e1. Vyss beja par ve\u013cti. Kai slapkovai iz sova n\u016bz\u012bguma
  v\u012btu, tai ma\u0146 v\u012bnmar beja j\u014datsagr\u012b\u017e atpaka\u013c
  pi t\u012bm malnyj\u012bm myurim, kas beja palyku\u0161i nu muna ideala \u0101kys.
  Viej\u0219 gaud\u014dja pa tuk\u0161ij\u012bm l\u016bgim i naatsola niv\u012bns
  za\u013cumen\u0161 iz tuk\u0161ys, apdagu\u0161ys v\u012btys.\\\"\\n\\n\u201eMuns  draugs,  muns  draugs,\\\"  jei  run\u014dja,  \u201ecik  tu  esi
  nalaimeigs!\\\"\\n\\nAr  osorom  ac\u012bs  s\u012bv\u012bt\u00e1  p\u012bzal\u012bc\u00e1  pi  j\u014d  i  nadr\u016bsi  pabu\u010d\u014dja  j\u016b
  meikstij\u016bs mot\u016bs.\\n\\nKai b\u0101rns pi m\u014dtis mekleidams m\u012bra,
  tai jauneklis ar obejom r\u016bkom apza\u010d\u00e4r\u00e1 ap j\u014ds koklu i pasl\u00e4p\u00e1
  seju pi j\u014ds placa. Sisi\u0146u v\u012bnmuleig\u014d \u010dierkstei\u0161ona
  mais\u00e4j\u00e4s j\u014d kaisli izteikt\u0101 run\u0101:\\n\\n\u201eVoi v\u00e4\u013c
  atmini t\u016bs vokorus, kur m\u00e1\u0219 aiz pu\u0219naktim s\u00e4d\u00e4jam
  tov\u0101 d\u014drzen\u012b i run\u014djam nabeidzamys runys? Voi atmini, kai t\u00e1v
  mirdz\u00e4ja ac\u0219, kod jaunekl\u00e1 pyrmij\u0101 m\u012blesteib\u0101 t\u00e1v
  st\u014dstieju par sovu leigaveni \u2014 zyn\u014dtni! I kai t\u00e1v sazavylka
  kul\u0101k\u016bs moz\u014ds r\u016bkys, kod klausiej\u012bs par t\u016b, cik dau\u1e11z
  nataisneibys i varm\u014dceibys pasaul\u012b... i kai t\u00e1v pi\u013cd\u00e4j\u00e4s
  ar osorom tovys m\u012bl\u014ds actenis, kod dzierdieji par dzeivis pab\u0101rnu
  syur\u016b liktini... I cik aug\u0161i i t\u014dli plyud\u00e1 jaunekl\u00e1 p\u014drpi\u013cdeit\u014ds
  sird\u0219 sapyni \u2014 de\u013c tev\u00e1. T\u012b nabeja ni par augstim, ni par
  t\u014dlejim. Kai draugs, kai uztycam\u012bs b\u012bdrs tu b\u0233tu bejus\u00e1
  gotova \u012b\u021b k\u016bp\u0101 ar mani iz dorbu i cei\u0146u. Nikod tu ma\u0146
  t\u016b natyki teikus\u00e1, bet as t\u016b zyn\u014dju, as t\u016b jutu kai naapg\u014d\u017eamu
  pat\u012bseibu. Kod as klus\u0101 nakt\u012b g\u014dju v\u012bns pat\u0219 iz s\u0101tu,
  tod ma\u0146 symtu \u0157ai\u017eu beja j\u014dn\u016bst\u014dj aiz sird\u0219 p\u014drpi\u013cneibys.
  As krytu rosys pylnyj\u0101 z\u014dl\u012b i st\u012bpu r\u016bkys pret zvaig\u017e\u0146u
  zyl\u016b t\u014dlumu i vielieju: ko\u010d vysa pasaul\u00e1 gryutumi ma\u0146 \u012btu
  preteim... tik dau\u1e11z sp\u0101ka ma\u0146 beja cein\u00e4t\u012bs. As ticieju
  ci\u013cviec\u00e1i t\u014d de\u013c, ka as ticieju sovam draugam...\\\"\\n\\n\u201eDe\u013ck\u014d,
  de\u013ck\u014d tu apzaprecieji?\\\" jys s\u014dpeigi izteic\u00e1. Jei n\u016bdyur\u00e1
  golvu.\\n\\nUmai jys pac\u00e4l\u00e1 golvu i sam\u012bdz\u00e1 sov\u016bs styngrij\u016bs
  pierst\u016bs j\u014ds placus.\\n\\n\u201eTu nikod nagrybi \u012bzad\u016bm\u014d\u021b
  mun\u0101 liktini.\\\" \u2014 jei p\u014drtraukdama run\u014dja. Tu zyni, ka t\u0101vs
  br\u014dli i mani \u0161kol\u014ddams, beja vysu sovu kr\u014djumu  izdev\u0219.  Bogot\u012bs  Reza  n\u016bmyra  kai  nabogs  veirs.  M\u014dt\u00e1
  r\u00e1dz\u00e4ja,  ka  vairs  navar  tai  pi\u013cneigi  dzeiv\u014d\u021b  kai  se\u0146\u014dk,  i  tai  kai
  sird\u00e4j\u00e4s iz m\u0233su. Br\u014dl\u0219 navar\u00e4ja atst\u014d\u021b
  sovu pi\u013cs\u0101t\u0101 \u012brost\u016b dzeivi i tais\u00e4ja por\u014ddus.
  As vysu t\u016b redzieju i run\u014dju, kaids tam vysam b\u0233\u0219 izn\u014dkums.
  Tei nabeja br\u014dl\u00e1 vain\u00e1, ka m\u0233su s\u0101ta \u0161\u016bgod g\u014dja
  iz vair\u014dks\u016blei\u0161onu. Kaids liktin\u0219 beja ma\u0146 sagaidams, kod
  m\u0233su nabadzeiba beja ma\u0146 zynoma? Tei jau beja zynoma. T\u016b as skaidri
  redzieju nu sovu kavaleru izal\u016bcei\u0161on\u014ds. Tik v\u012bns nu munim c\u012bneit\u014djim
  nikod t\u014d nad\u00e1v\u00e1 ma\u0146 man\u00e4\u021b, ka muns liktin\u0219 ir
  gr\u016bziej\u012bs. Tys beja muns tagadej\u012bs veirs... Da\u017eu\u0157aiz d\u016bm\u014dju
  brauk\u021b iz sve\u0161u molu, t\u012b pe\u013cn\u00e4\u021b s\u00e1v maizi. A
  de\u013ck\u014d ta sve\u0161um\u0101, ka t\u00e1pa\u021b dzimtin\u012b lobs cylv\u0101ks
  ma\u0146 aps\u016bla jumtu, maizi i aizst\u014dvei\u0161onu pret kotru nakr\u012btneibu?
  Tai as n\u016bd\u016bm\u014dju, sok, kolp\u014d\u0161u jam uzticeigi. M\u012b\u013c\u014d\u021b
  as j\u014d navarieju. T\u014d jys i napras\u00e4ja. Jys ir tik sirsneigs, tik lobs
  de\u013c b\u0101rnim, de\u013c man\u00e1... Ma\u0146 nikas  cyts  naatlyka!  Kur  as  ni  vier\u016bs,  vysur  nabadzeiba,
  apvain\u014d\u0161ona, tuk\u0161a bezcereibys dzeiv\u00e1. Re\u0161i, re\u0161i
  kod aizspeid\u00e4ja saul\u00e1  mun\u0101  m\u014dku\u013cain\u0101  dzeiv\u012b.  Tys  beja  tym\u016bs  brei\u017e\u016bs,  kod  tu
  atbrauci iz m\u014djom. Tu jau lauleibys dzeivis naatzyni...\\\"\\n\\n\u201eN\u0101,
  n\u0101 i tyukst\u016b\u0161u \u0157ai\u017eu n\u0101!\\\" jauneklis uzbudyn\u014dts
  atsasauc\u00e1, \u201eas t\u014ds naatzeistu, as naatzeistu \u0161\u016b va\u017eu,
  kurys saka\u013c m\u012blesteibu, \u0161\u016b vysys dobys karal\u012bni! Kai dreiks\u021b
  cylv\u0101ks, \u0161ys puteklis i t\u014drps, dar\u00e4\u021b par  para\u017eu  t\u016b,  kas  sird\u0219  dzi\u013cum\u0101  l\u012bsmoj  kai  zvaigzn\u00e1  nu  cyta
  pasaul\u00e1! Kai jys dreiks\u021b kal\u021b t\u012bseibu va\u017e\u014ds t\u014ds
  jiutys, kurys n\u014dk kai z\u012bd\u016bn\u00e1 v\u00e4sma! T\u016b jaun\u014dk\u016b
  i skaidr\u014dk\u016b, kas izz\u012b\u1e11 m\u0233su dv\u00e4sel\u012b varb\u0233\u021b
  tik v\u012bnu \u0157aizi, kai p\u014dsokaina breinumpu\u010d\u00e1, \u2014 kai t\u016b
  dreiksteitu n\u00e1s\u021b i p\u014drd\u016b\u021b tam, kas t\u00e1v s\u016bla vysdr\u016bs\u014dk\u016b
  maizi i skaistys dr\u00e4bis? T\u014ds t\u012b, kas iz \u012blom p\u012bs\u016bla
  sovu m\u012blesteibu, t\u014ds as sapr\u016btu: boda sp\u012bstys j\u014ds t\u016b
  dora, j\u014ds p\u014drd\u016bd tik sovu m\u012bsu... dv\u00e4sel\u00e1 j\u014dm
  jau ir myrus\u00e1. A tu, tu... kai tu varieji n\u00e1s\u021b sovu eist\u016b, sovu
  debesi\u0161ki skaidr\u016b dv\u00e4seli i p\u014drd\u016b\u021b t\u016b vair\u014dk-s\u016blei\u0161on\u0101.
  Voi ta tu nadzierdieji kai s\u014dp\u00e4ja i raud\u014dja \u0161ei  tova  dv\u00e4sel\u00e1,  kod  lapneig\u012b  rodi  t\u00e1v  viel\u00e4ja  laimis!  Voi  ta  tu
  nadzierdieji t\u014ds izmysuma kl\u012bdz\u012b\u0146u, kod tyka sarausteits tovs
  mir\u0161u vai\u0146uks, tovys dv\u00e4selis simbols? I tod tei pazasl\u00e4p\u00e1
  dzili, dzili i klusum\u0101 c\u012bt\u00e1, vysu pan\u00e1s\u00e1 i myra... N\u016bmyra
  tova p\u014drd\u016bt\u014d dv\u00e4sel\u00e1 i ni pu\u010deitis nav\u0101 iz \u0161\u014ds
  vysskaidr\u014dk\u014ds dv\u00e4selis kopa... \u0160ys beja tys, kas paj\u00e4m\u00e1
  munu ticeibu iz idealym i ci\u013cvieci: ka tu varieji p\u014drd\u016b\u021b sovu
  dv\u00e4seli!\\\"\\n\\nJys apklusa dzil\u00e4 skumeib\u0101 i klaus\u00e4j\u00e4s,
  kai jei raud\u014dja pi j\u014d kryutim.\\n\\nJau se\u0146 beja n\u016bsleidiejus\u00e1
  j\u014ds golva pi jaunekl\u00e1 kryutim. I nu kotra jaun\u014d v\u014drda jei raust\u00e4j\u00e4s
  kai nu p\u014dtogys sit\u012bn\u00e1.\\n\\nUmai  atskan\u00e4ja  caur  nakt\u0219  klusumu  breini\u0161k\u014d  laksteigolys
  dz\u012bsm\u00e1. Tei aicyn\u014dja, tei sauc\u00e1, tei s\u016bl\u00e4ja laimi.\\n\\nJauneklis
  n\u016bdreb\u00e4ja, j\u014d r\u016bkys kai nasaman\u012b ap\u010d\u00e4r\u00e1
  s\u012bv\u012bti.\\n\\n\u201eAs tev\u00e1 naatst\u014d\u0161u!\\\" caur sak\u016bstim
  z\u016bbim jys izteic\u00e1. \u201eI t\u016bm\u0101r as j\u016b atdzeivyn\u014d\u0161u
  \u0161\u016b tovu, myru\u0161\u016b dv\u00e4seli, \u0161\u016b munu Ier\u0161kei\u017eu
  R\u016bzeiti. I lai ma\u0146 b\u0233tu j\u014dsajem vysa pasaul\u00e1 v\u012bsuli...
  as izpyus\u0161u l\u012bsmi,  seneju  kv\u00e4li,  \u0161\u016b  sameideit\u016b  sird\u0219  gunteni.  I  lai  as  tym\u0101
  sadagtu, i lai tevi apreitu \u0161ei l\u012bsm\u00e1... bet iz ocumirkl\u00e1 tai
  vajag atsam\u016bs\u021b, \u0161ai tovai dv\u00e4sel\u00e1i. Tai ceistai vajag n\u016bzamozg\u014d\u021b
  \u0161ym\u0101 l\u012bsm\u012b nu vysa t\u014d, k\u016b pasaul\u0219 ir kai dub\u013cus
  kr\u014dv\u0219 viers\u0101. Iz ocumirkl\u00e1 izpl\u00e4ssim  sovus  sp\u014drnus  saul\u00e1i  preteim,  lai  m\u0233su  skr\u012b\u0161ona  pa\u021b
  n\u014dveiga b\u0233tu. As naatzeistu lauleibys, bet as atzeistu m\u012blesteibys
  vysvareig\u016b sp\u0101ku... N\u014d\u00e7, m\u012bl\u014d, \u012bsim t\u012b,
  kur m\u0233sus sauc myu\u017eeigys m\u012blesteibys dz\u012bsmin\u012bks. Izdz\u00e4ssim
  ko\u010d iz ocumirkli nu sovys atminis vysus \u0161\u016bs gryut\u016bs, gryut\u016bs
  godus. Izdzeisim nu pr\u014dta i atminis vysu, vysu pasauli!\\\"\\n\\nMoz\u012b
  v\u014drteni, kuri j\u016bs \u0161keira, beja atsataisieju\u0161i. Jauneklis vys
  vair\u014dk  j\u016b m\u012bdz\u00e1 pi  sev\u00e1 i  ar  v\u012bnu stypr\u014dk  cyl\u014dj\u00e4s  jaun\u014ds
  s\u012bv\u012btis kryut\u0219.\\n\\n\u201eI  ka  m\u0233sim  \u0161\u016b  stu\u0146di  b\u0233tu  j\u014dsamoksoj  ar  nabeidzamom
  m\u016bkom, ka m\u0233sim vajdz\u0101tu cein\u00e4t\u012bs pret vysu pasauli, ka
  iz m\u0233sim g\u014dzt\u016bs  dabasi  viers\u0101...  as  tev\u00e1  naatst\u014d\u0161u.
  As  sk\u016bpstei\u0161u tevi, as sk\u016bpstei\u0161u  tovu  dv\u00e4seli,  as  atd\u016b\u0161u  tai  sovu  dzeiveibu,  cikom
  sasi\u013cdei\u0161u j\u014ds n\u014dvis styngumu, cikom tei naatv\u00e4r\u0219
  sovu debeseigi skaidr\u016b ocu... N\u014d\u00e7, muna se\u0146 m\u012b\u013c\u014dt\u014d,
  n\u014d\u00e7!.. M\u00e1\u0219 sviet\u00e4sim tovys dv\u00e4selis aug\u0161amcel\u0161on\u014ds
  sv\u0101tkus!\\\"\\n\\n\u201eDraugs, draugs, kur tu mani aicynoj!\\\" jei run\u014dja
  i c\u012b\u017e\u014dk jam m\u012bdz\u00e4s kl\u014dtu. \u201eKai as varei\u0161u
  v\u00e4rt\u012bs b\u0101rnim i veiram ac\u012bs?\\\"\\n\\nLieni atsalaid\u00e1 j\u014ds
  r\u016bkys nu d\u014drza sietenis. Jys ap\u010d\u00e4r\u00e1 j\u016b ar obejom r\u016bkom
  i kai d\u014drgu nostu n\u00e1s\u00e1 iz bierz\u0219 pusi. J\u012bm cauri ejm\u016bt,
  sisini apklusa, laksteigola p\u014drtrauc\u00e1 sovu dz\u012bsmi. Kai se\u0146 raud\u014dtys
  osorys, zam j\u016bs k\u014djom byra nu z\u014dlis solta rosa.\\n\\nZemn\u012bka  d\u0101ls  kai  nasaman\u012b  p\u012bzatryuka  k\u014dj\u014ds.  \u201eBet  tai  tok
  navar,  tai  tok  navar!\\\"  j\u014d  lyupys  murmu\u013c\u014dja.  Jys  pat\u0219  nam\u012breigi
  staig\u014dja pa moz\u016b ustabeni.\\n\\nNakt\u012b, kod jys gul\u00e4ja, tod sapyn\u0101
  atk\u014drt\u014dja: \u201eBet tai tok navar, tai tok navar!\\\"\\n\\nBet  naapklust\u014d\u0161\u014ds  austuvju  pamynys,  kai  j\u016b  miedeidamys,
  \u010deikst\u00e4ja:\\n\\n\u201eVar, var, var!\\\"\\n\\nTre\u0161\u0101  d\u012bn\u0101  Zemn\u012bka  d\u0101ls  jau  bez  aicyn\u014d\u0161onys  atsas\u0101da  pi
  l\u016bdzen\u00e1. Vakar vokor\u0101 r\u00e1dz\u0101t\u012bs atst\u014dja j\u014d
  dv\u00e4sel\u012b tymsu kai rudin\u00e1 nakt\u0219 ainu. Jys ilg\u014dj\u00e4s pec
  sauleitis.\\n\\nBet taidu pa\u0161u \u0101nu i pakriesli jys atroda aiz l\u016bdzen\u00e1..
  T\u012b beja nabadzeigs pasaul\u0219, iz kuru jys v\u00e4r\u00e4s. \u010cetrys pal\u0101kys
  s\u012bnys, zami gr\u012bsti, ko\u010d kur iz z\u012bmelim v\u012bnk\u014dr\u0161s
  plyks l\u016bgs, pret t\u016b naapsagts golds,  trejs  pu\u0219salyuzu\u0161i  kr\u0101sly  i  ar  streipainu  sagu  p\u014drkl\u014dta,
  nakr\u014ds\u014dta k\u016bka gulta... Nu kokta vac\u012bs bl\u00e1kys ceplis, lyk\u014ds,
  dv\u00e1s\u00e1 soltumu i naidu.\\n\\n\u201eAri cylv\u0101ks, kas taid\u0101 dzeivoj!\\\"
  Zemn\u012bk\u0101 d\u0101ls pad\u016bm\u014dja ar skumeibu kaudam\u012bs.\\n\\nJys
  \u012braudz\u00e4ja \u0161\u016b cylv\u0101ku. Tys izg\u014dja nu vystyms\u014dk\u014d
  kokta, \u2014 dzaltoni-b\u014dls, jauns cylv\u0101ks ar drud\u017eainom acim.\\n\\nCylv\u0101ks
  n\u00e1s\u00e1 pylnu kliepi gr\u014dmotu i r\u016bkrokstu i n\u016bsv\u012bd\u00e1
  t\u016bs vysus iz greidys, kl\u014dtu pi naieveleitu die\u013cu kastis, kura jau
  leidz pus\u00e1i beja p\u012bkrauta ar gr\u014dmotom.\\n\\n\u201eGryb  aizce\u013cot!\\\"  Zemn\u012bka  d\u0101ls  pad\u016bm\u014dja  i  bez  sevi\u0161kys
  patik\u0161onys pazav\u00e4r\u00e1, kai jaun\u012bs cylv\u0101ks p\u012bkr\u014dv\u00e1
  i aizsyta ar noglom kasti, kai jys izvylka sovys apvolk\u014dt\u014ds dr\u00e4bis
  i salyka t\u014ds n\u016bpleisu\u0161\u0101, nateir\u0101 audaklu \u010demodan\u0101,
  a t\u016b, kas palyka, ar da\u017eom zamejom dr\u00e4bjom \u012btyna raibij\u0101
  gultys de\u010deit\u012b... Beidz\u016bt Zemn\u012bka d\u0101ls soka brein\u014dt\u012bs:
  jys pirmei\u021b nab\u0233tu ticiej\u0219, ka \u0161ei  plyk\u014d ustoba var\u0101tu
  palik\u021b v\u00e4\u013c tuk\u0161\u014dka, bet tagad tys tai beja... tai kai nabadzeiba
  i sk\u016bpums b\u0233tu t\u00e1 dzeiv\u014dju\u0161i  ilgus godus.\\n\\n\u201eCik  moz  pr\u012bcys  j\u014d  sird\u0219  ir  redziejus\u00e1,  kura  nu  \u0161aj\u012bnis
  \u0161kierdam\u014ds v\u00e4\u013c ar osorom skumst,\\\" d\u016bm\u014dja Zemn\u012bka
  d\u0101ls.\\n\\nTagad jauneklis n\u016bj\u00e4m\u00e1 v\u012bneig\u016b bi\u013cdi
  nu s\u012bnys... jys pat\u0219 i divi j\u014d b\u012bdri beja t\u012b radzami...
  i \u012blyka bi\u013cdi \u010demodan\u0101. Tod jys l\u0101nim s\u016blim apstaig\u014dja
  vysys \u010detrys ustabenis s\u012bnys, ar lob\u016b r\u016bku lieni par t\u014dm
  vylkdams, kai gl\u014dsteidams t\u016bs plykumu. Tod jys n\u016bst\u014dja pi l\u016bdzen\u00e1,
  i ilgi v\u00e4r\u00e4s t\u014dlum\u0101 p\u014dri pi\u013cs\u0101tys sorkon-bryunij\u012bm
  i pal\u0101kij\u012bm jumtim. Kod jys atsagr\u012bz\u00e1, beja radzamys j\u014d
  ac\u012bs osorys.\\n\\nT\u016brn\u00e1 stu\u0146din\u012bks syta trejs \u0157aizis.
  \u201eV\u00e4\u013c trejs stu\u0146dis!\\\" jauneklis n\u016bm\u016brd\u00e4ja i
  sn\u00e4dz\u00e4s pec capuris. Aiz durovom stypri dauz\u00e4j\u00e4s.\\n\\n\u201e\u012a\u0161k\u0101!\\\"\\n\\nZemn\u012bka
  d\u0101ls pazyna \u012bg\u014djiejus. T\u012b beja t\u012b po\u0161i obi b\u012bdri,
  kuru bi\u013cdi jauneklis n\u016bglob\u014dja \u010demodan\u0101. V\u012bnam iz
  r\u016bkys beja nalels bute\u013cu kurveit\u0219, \u016btrs tur\u00e4ja papeirus
  uzmaneigi sorg\u014ddams ar \u016btr\u016b r\u016bku.\\n\\n\u201e\u0100,  jau  gotovs!\\\"  teic\u00e1  pyrm\u012bs  \u012bn\u014dciejs,  gars,  malnsejeigs
  cylv\u0101ks, nam\u012breig\u014ds bryun\u014ds ac\u0219 \u014dtri par ustabeni
  p\u014drlaisdams. \u201eTys labi: to tu, Opol\u0233\u0219, vari tivlei\u021b s\u014dk\u021b
  sovu runu.\\\"\\n\\n\u201eO, draugs, tys nabeja n\u016brun\u014dts!\\\" jys protest\u00e4ja.
  \u201ePar runu nabeja ni runys.\\\"\\n\\nPar \u201eOpol\u016b\\\" saukt\u012bs brein\u014ddam\u012bs
  pac\u00e4l\u00e1 iz b\u012bdri sovys zyl\u014ds, opol\u014ds ac\u0219.\\n\\nMalnsejeig\u012bs
  izsv\u012bd\u00e1 sovu kurveiti ar bute\u013com iz golda i izr\u014dv\u00e1 Opolyjam
  papeirus nu r\u016bkys.\\n\\n\u201eAs naasmu nikaids run\u014dt\u014djs!\\\" taisn\u014dj\u00e4s
  Opol\u0233\u0219.\\n\\n\u201eTu myu\u017eam samaitoj po\u0161us vysu svineig\u014dk\u016bs
  ocumirk\u013cus!\\\" jys napac\u012bteigi s\u014dka run\u014d\u021b.\\n\\nMalnsejeig\u012bs  jym\u0101  vairs  nazaklaus\u00e4ja.  Drab\u016b\u0161im,  nervozim
  pierstim jys attyna papeiru. Pazar\u014dd\u00e4ja breinum skaisti r\u016b\u017eu
  pu\u0161ki.\\n\\nUstabenis \u012bmeitn\u012bks, p\u014drsteigts, v\u00e4r\u00e4s
  iz malnsejeig\u016b, iz Opol\u016b, kurs beja atsasied\u0219 iz trejk\u014djaina
  kr\u0101sla ar atzve\u013ctni iz pr\u012b\u0161ku, i pyul\u00e4j\u00e4s iz t\u014d
  n\u016btur\u00e4\u021b leidzsvor\u0101 sovu d\u016b\u0161eig\u016b augumeni.\\n\\n\u201eMa\u0146
  tev\u00e1 \u017e\u0101l, muns br\u014dlei\u021b, Jonatan,\\\"'' malnsejeig\u012bs
  s\u014dka, \u201etu ma\u0146 beji c\u012b\u017ei m\u012bls! Bet m\u0233sus vysus
  gods pec goda kai cel\u00e1 veirus vodoj i niu ir atn\u014dkus\u00e1 i tova \u0157aiz\u00e1.
  I tai j\u012b aiz\u012bt vysi, v\u012bns pec \u016btra i aiznas leidza sovu sirdi
  i sovys m\u012bl\u014ds ac\u0219, t\u00e1 pal\u012bk tik taidi kai Opol\u0233\u0219
  i as...\\\"\\n\\nMalnsejeig\u012bs na\u013c\u014dv\u00e1 sev\u00e1 trauc\u00e4\u021b.\\n\\n\u201ePar
  mani tu nab\u0101doj!\\\" Opol\u0233\u0219 j\u016b p\u014drtrauc\u00e1, sovys dzalton\u014ds
  \u016bsenis ar pierstim gr\u012bzdams, \u201eas taisu k\u014drteigi sovus eksamenus...\\\"\\n\\n\u201e...i
  pakal\u012b pal\u012bk tik t\u012b,\\\" jys atk\u014drt\u014dja, \u201ekuri k\u014drteigi
  taisa sovus eksamenus, kai \u0161ei tauku \u012b\u0161\u0146ova, voi tys, kurs nataisa
  nik\u014d, kai as....I kai ap aizmierstu myru\u0161\u014d zvejn\u012bka laivu, tai
  ap m\u0233sim skol\u014ds\u012bs solt\u0233 myu\u017eeibys iudini, i m\u00e1\u0219
  saraust\u00e4sim sovys saryusieju\u0161\u014ds va\u017eys, kod d\u016bm\u014dsim
  par t\u012bm b\u012bdrim, kuri d\u016bd\u0101s t\u014dlum\u0101, kai bolti gu\u013cbi
  pe\u013c\u1e11... Da, Opol\u0233\u0219, nazatri\u0146 nimoz iz t\u014d beju\u0161\u014d
  kr\u0101sla... n\u014dk\u0219 i par tevi  v\u012bntuleibys  d\u016bmys  ar  sovu  tuk\u0161umu.  Kod  m\u00e1\u0219  tai  s\u00e4d\u00e4sim
  ustaben\u012b i par ve\u013cti gaid\u00e4sim, voi naatskan\u00e4s aiz durovom drauga
  sirsneigs bolss, tod m\u0233su d\u016bmys atsagr\u012bz\u0219 atpaka\u013c iz \u0161\u012bm
  laikim kai iztrauc\u0101ti putineni, i \u0161\u016b d\u012bnu atmi\u0146om t\u014ds
  mekl\u00e4s pec t\u014d cel\u00e1, pa kur\u016b aizg\u014dja m\u0233su jaunu d\u012bnu
  draugs. I lai \u0161\u014ds m\u0233su pal\u0101k\u014ds d\u016bmys ar sovom izmierku\u0161\u012bm,
  n\u016bguru\u0161\u012bm sp\u014drnenim zyn\u014dtu atras\u021b m\u0233su drauga  p\u0101dus,  tod  m\u00e1\u0219  \u0161\u016bvokor  grybom  ar  r\u016bzjom  izpu\u0161k\u014d\u021b  j\u014d
  capuri. Redzi, draugs...\\\" jys pac\u00e4l\u00e1 r\u016b\u017eu pu\u0161ki vair\u014dk
  pret l\u016bgu, pa kur\u016b  v\u00e4\u013c  drusku  speid\u00e4ja  pal\u0101ka  voi  z\u012bmys  pecpu\u0161d\u012b\u0146u  gaisma.
  \u201eRedzi, zylu r\u016b\u017eu m\u0233sim nav\u0101. T\u014ds zeim\u014dtu uzticeibu.
  M\u00e1\u0219 zynom, ka tova uzticeiba ir tik pla\u0161a, kai zyl\u0233 dabasi,
  \u2014 de\u013ct\u014d m\u0233sim navajag zylu r\u016b\u017eu. \u0160ei bolt\u014d
  r\u016bz\u00e1, br\u014d\u013c, tei lai n\u016bzeimoj tovu bolt\u016b dv\u00e4seli...
  Vylt\u014d\u0161onys pi tev\u00e1 m\u00e1\u0219 naasom atrodu\u0161i, munu br\u014d\u013c
  Jonatan. \u0160ei dzalton\u014d r\u016bz\u00e1... t\u00e1v tei lai soka, kod \u012bsi
  par \u0161\u016b sovu sl\u012bksni, ka niu ari t\u00e1v, pakrie\u0161l\u00e1 b\u0101rnam
  s\u014dks\u012bs sauleitis d\u012bnys. \u0160\u014ds sorkon\u014ds... vysys \u0161\u014ds
  sorkon\u014ds lai ir tova m\u012blesteiba, kuru esi pe\u013cniej\u0219 i pe\u013cneisi
  sov\u0101 gait\u0101... Nu cyloj sovus iergl\u00e1 sp\u014drnus. I m\u00e1\u0219
  pr\u012bc\u014dsim\u00e4s, kod nu sova c\u012btuma tevi r\u00e1dz\u00e4sim aug\u0161i
  zyl\u0101 gais\u0101.\\\"\\n\\nI jys apkamp\u00e1 b\u012bdri, kuram ac\u0219 beja
  palyku\u0161ys mitrys.\\n\\nAri Opol\u0233\u0219 s\u014dka myrk\u0161yn\u014d\u021b
  ac\u0219. Tod kai sazakauniej\u0219 jys \u014dtri attais\u00e4ja sovu korku valkam\u016b
  n\u0101zi i gr\u012bz\u00e1 t\u016b veina butel\u00e1i kokl\u0101.\\n\\nPouk\u0161!\\n\\n\u201eVoi
  t\u00e1v gl\u014dz\u00e1 ir?\\\" jys pavaic\u014dja i apzav\u00e4r\u00e1 vysapleik.\\n\\n\u201eIzdz\u00e1rsim,  lai  r\u00e1\u1e11z,  kai  tod  ir!\\\"  jys  sac\u00e4  i  p\u014drvylka  ar
  pierdukni par sasorku\u0161\u016b seji.\\n\\n\u201eApteksn\u00e1!\\\" pr\u016bjom
  brauciejs sauc\u00e1 i p\u012bsyta ar kul\u0101ku pi s\u012bnys.\\n\\n\u201eK\u014d
  vajag, kandidata kungs?\\\" aiz s\u012bnys atsasauc\u00e1 s\u012bv\u012btis bolss.\\n\\n\u201eLyudzu
  trejs gl\u014dzis... i v\u012bnu sv\u00e1ci ari!'' kandidats teic\u00e1.\\n\\nPec  moza  breisnen\u00e1  durovys  atsatais\u00e4  i  pa  kr\u0101slu  var\u00e4ja
  n\u016bman\u00e4\u021b apteksnis saleiku\u0161\u016b augumu. V\u012bn\u0101 r\u016bk\u0101
  tai beja trejs \u010daja gl\u014dzis, cyta cyt\u0101 sab\u014dztys i \u016btr\u0101
  r\u016bk\u0101 pu\u0219sv\u00e1cis bez luktura.\\n\\n\u201eKam ta jiu\u0219, jaunskungs,
  napasauc\u00e1t man\u00e1... as b\u0233tu vysu sakr\u014dvus\u00e1...\\\" jei sac\u00e4
  iz \u010demodana i gr\u014dmotu kasti skateidam\u014ds.\\n\\n\u201eKur t\u016b sv\u00e1ci
  lai pastotu?\\\" vaic\u014dja Opol\u0233\u0219, kod v\u00e1c\u00e1 aizg\u014dja
  pr\u016bjom.\\n\\n\u201ePagai\u1e11!\\\" malnsejeig\u012bs p\u014drtrauc\u00e1,
  pyrm\u014d butel\u00e1 m\u0233sim j\u014ddzer tyms\u0101... par p\u012bmini vysam
  tam tymsam i \u0101nai, kura \u0161ym\u014ds \u010detr\u014ds s\u012bn\u014ds godim
  ir skol\u014djus\u00e4s ap m\u0233su drauga dv\u00e4seli. Klusu c\u012bsdami t\u016b
  dz\u00e1rsim...  g\u016bdyn\u014ddami  v\u012bntuleibu,  kura  tagad  kai  myglys  jyura
  izgaist aiz j\u014d...\\\"\\n\\nNi v\u014drda narun\u014ddami draugi pamozam iztuk\u0161\u014dja
  sovys gl\u014dzis. Sku\u1e3fu d\u016bmys n\u014dc\u00e1 i g\u014dja ar sevim nadzierdam\u012bm
  \u0101nys s\u016blim pa ustobu. Tik gl\u014dzis skanei\u0161ona \u0161od-tod p\u014drtrauc\u00e1
  klusumu. R\u014dd\u00e4j\u00e4s, ka s\u012bnys kotru \u0157aizi sazatryuktu nu \u0161\u014d
  nagaideiti naparost\u014d truk\u0161n\u00e1. Tod aizdadzyn\u014dja sv\u00e1ci i
  \u012bspraud\u00e1 t\u016b tuk\u0161ij\u0101 butel\u012b. R\u014dd\u00e4j\u00e4s,
  ka leidz ar tymsu izgaisa i dryum\u014ds d\u016bmys nu draugu sejom i aizavylka
  nazkur pi molys. Sv\u00e1c\u00e1 apgaism\u014dja goldu, r\u016bzis i trejs jaunek\u013cus;
  a t\u014d\u013c\u014dk t\u016b it kai n\u016bm\u014dc\u00e1 z\u012bmys vokora kr\u0101sla,
  \u012bsyukdama sev\u012b plyk\u014ds ustobys s\u012bnys.\\n\\n\u201eTagad  par  tovu  n\u014dk\u016btni,  br\u014d\u013c,  par  tovom  saulis  d\u012bnom!\\\"
  Malnsejeig\u012bs teic\u00e1 \u016btr\u016b buteli attaisiej\u0219 i gl\u014dzis
  nu jauna p\u012bpi\u013cdiej\u0219. \u201eOpol\u0233\u0219 tur\u00e4s otkon runu.\\\"\\n\\n\u201eAs
  naasmu nikaids run\u014dt\u014djs!\\\" Opol\u0233\u0219 n\u016bryuc\u00e1, \u201eProzit!\\\"\\n\\n\u201eDa,
  t\u00e1v taisneiba... atn\u014dk\u0219 i bez run\u014d\u0161onys \u0161ei zalta
  n\u014dk\u016btn\u00e1. Atn\u014dk\u0219 kai pavasar\u0219 ar syltom v\u00e4smom,
  ar ceirulim i z\u00e1mis bi\u021bom. I tu pat\u0219 brein\u014ds\u012bs, cik dau\u1e11z
  pasl\u0101ptu pympuru ir bej\u0219 tov\u0101 z\u012bmys dzeiv\u012b. Vysi t\u012b
  plauk\u0219 i z\u012bd\u00e4s... Ak da, br\u014d\u013c, tu t\u016b pe\u013cniej\u0219!
  Vysi t\u012b lai izplaukst, \u0161\u012b cereibu pympuri!\\\"\\n\\nVol\u016bdys
  s\u014dka rais\u00e4t\u012bs. Se\u0146 nadzierd\u0101ti sm\u012bkly sp\u012bd\u00e4s
  tyms\u0101 i atsasyta pret plykijom s\u012bnom.\\n\\nT\u016brn\u00e1 stu\u0146din\u012bks
  n\u016bsyta p\u012bcys.\\n\\n\u201eBeidzam\u014d stu\u0146d\u00e1!\\\" Malnsejeig\u012bs
  teic\u00e1 \u201eI beidzam\u014d butel\u00e1!\\\" jys p\u012brun\u014dja. \u201eT\u016b
  m\u00e1\u0219 dz\u00e1rsim iz laimis, kuru tu, br\u014d\u013c, m\u012b\u013coj.
  A runu j\u014dtur t\u00e1v po\u0161am!\\\"\\n\\nKandidats p\u012bzac\u00e4l\u00e1
  k\u014dj\u014ds i j\u014d dzalton-b\u014dlyj\u0101 vaig\u0101 beja radzams s\u014drtums.
  Ac\u0219 jam mirdz\u00e4ja.\\n\\n\u201ePar munu leigaveni as dzer\u0161u \u0161\u016b
  gl\u014dzi!\\\" jys sac\u00e4, par munu jauneibys m\u012blesteibu. Ka jiu\u0219
  mani vaic\u014dtu, k\u014d de\u013c as j\u016b m\u012b\u013coju, as laikam navar\u0101tu
  atbi\u013cd\u00e4\u021b. Nav jai skaistuma, nav vol\u016bdys smukuma, nav laiceiga
  monta. Nav j\u014ds sen\u010di va\u013cdieju\u0161i nu jyurys leidz jyurai, nav
  j\u014ds b\u014dleleni nasu\u0161i j\u014ds slavi z\u016bbyna gol\u0101 par kolnim
  i l\u00e1jom. Kas tod ir m\u0233su Latvejai, m\u0233su syurd\u012bneit\u00e1i, k\u014d
  de\u013c m\u00e1\u0219 t\u016b var\u0101tu m\u012b\u013c\u014d\u021b? I t\u016bmar
  tai\u0161ni it\u014d tuk\u0161uma de\u013c lob\u014dk sird\u0219 sylst de\u013c
  t\u014ds. Tai\u0161ni t\u014d de\u013c, ka tei v\u012bna po\u0161a st\u014dv na\u012bv\u0101r\u014dta
  cel\u00e1 mol\u0101, tai\u0161ni t\u014d de\u013c gryb\u0101t\u016bs atsas\u00e4s\u021b
  pi t\u014ds kl\u014dtu iz plyk\u014d akmin\u00e1 i sp\u012bs\u021b t\u014ds n\u016bstr\u014dd\u014dt\u016b
  r\u016bku, cikom munys lyupys \u010dyuksteitu taidus v\u014drdus: m\u00e1\u0219
  saderom k\u016bp\u0101, m\u00e1\u0219 liktin\u00e1 pab\u0101rni, m\u00e1\u0219 paliksim
  k\u016bp\u0101. As str\u014dd\u014d\u0161u nu reita leidz vokoram, as pyulei\u0161\u016bs
  de\u013c  tev\u00e1, as pi\u013cdei\u0161u tovus apcirk\u0146us, as kaldyn\u014d\u0161u
  t\u00e1v sudobra saktys i meklei\u0161u t\u00e1v dzintara krellis. Part\u016b ka  niv\u012bnam  pasaul\u012b  man\u00e1  navajag,  tik  t\u00e1v  man\u00e1  vajag.  Niv\u012bns
  nazapr\u012bcoj\u0101s par munom tuk\u0161in\u012bka d\u014dvynom, a tu pr\u012bcoj\u012bs.
  Part\u016b niv\u012bns cyts lai napu\u0161koj tovu augumu... K\u016b vair\u014dk
  as de\u013c tev\u00e1 varei\u0161u dar\u00e4\u021b, t\u016b lel\u014dka aug\u0219
  muna m\u012blesteiba... Kod as p\u012bkus\u0219 i izmis\u0219 \u012b\u0161u iz s\u0101tu,
  i rudin\u00e1 d\u016bmys ma\u0146 \u0161a\u013ck\u0219 dv\u00e4sel\u012b, tod as
  pasliep\u0161u golvu tov\u0101 kliep\u012b, i tu gl\u014dsteisi t\u016b i dz\u012bd\u014dsi
  sovys vac\u014ds dz\u012bsmis. Tu dz\u012bd\u014dsi sovu vac\u016b dz\u012bsmi par
  leidumn\u012bku, kas v\u012bns ar osu ciervi \u012bg\u014dja tymsij\u0101 me\u017e\u0101  i  apzav\u00e4r\u00e4s,  zam  kur\u014ds  \u00e1glis  apzam\u00e1s\u021b.  Nabeja  r\u016bbe\u017eu  j\u014d
  nabadzeibai,  nabeja  r\u016bbe\u017eu  j\u014d  cereibai  i  bogoteibai:  v\u00e4\u013c  nabeja
  vylkta niv\u012bna streip\u00e1, kura jam par\u014ddeitu: t\u00e1 j\u014dzabeidz
  tovai cein\u00e1i ar g\u0101r\u0161ys mi\u013czinim. Ciert\u00e1 jys d\u012bnu,
  ciert\u00e1 godu i pr\u012bc\u014dj\u00e4s, ka zalta sauleit\u00e1  ar  v\u012bnu  ilg\u014dk  apspeid\u00e4ja  j\u014d  apkv\u0101pu\u0161\u016b  b\u016bdeni,  i  ka
  gryudain\u014ds v\u014drpys ar v\u012bnu vair\u014dk i pla\u0161\u014dk leigoj\u0101s
  vokora v\u00e4sm\u0101. I kod jau jys beja vacs i golva jam dreb\u00e4ja, tod jys
  n\u016bst\u014dja me\u017ea mol\u0101 i sac\u00e4: \u201eV\u00e4\u013c v\u012bnu
  k\u016bku... b\u0233\u0219 vair\u014dk sauleitis munim b\u0101rnim...\\\" Tai jei
  ma\u0146  dz\u012bd\u014dja  \u0161\u016b  leidumn\u012bka  dz\u012bsmi  mun\u016bs  mozticeibys  brei\u017e\u016bs,
  muna izsolkuma i v\u012bntuleibys nakt\u012bs, kod z\u016bbi k\u016bd\u00e4s gultys
  mol\u0101 i sird\u0219 grib\u00e4ja voi st\u014dt\u012bs gryutum\u0101. Tod jei
  mani dr\u016bsyn\u014dja c\u00e1l\u021b otkon aug\u0161\u0101 kv\u0101l\u016b\u0161\u016b
  golvu i g\u014dd\u014d\u021b par gaismu s\u00e1v i sovim br\u014dlim. I kai lai
  as j\u014ds nam\u012b\u013c\u014dtu, \u0161\u014ds osor\u014ds mozg\u014dju\u0161\u014ds
  sirsnenis, kura na\u012bkreit izmysum\u0101, kura t\u016bm\u0101r cerej i m\u012b\u013coj
  vysus, kuri cerej? I ka ari as vair\u014dk nik\u014d namont\u014dtu par sovu m\u012blesteibu,
  kai tik atpyutys v\u012btu dzimtinis kliep\u012b, i tik dzimtinis viejen\u0161 s\u0101tu
  pu\u010deitis iz muna kopa, tik sn\u012bdzeit\u00e1 atsamastu t\u012b i n\u016bdz\u012bd\u014dtu
  sovu eis\u016b dz\u012bsmeni... i ka as t\u016b vysu  jau  \u0161udi\u0146  zyn\u014dtu,  as  t\u016bm\u0101r  nap\u014drst\u014dtu  m\u012b\u013c\u014d\u021b  sovu  tautu
  syurd\u012bneiti. Part\u016b ka muna m\u012blesteiba ir muns sp\u0101ks i muna laim\u00e1.
  Iz dzimtinis n\u014dkameibu br\u014dli! D\u012bvs lai svietej m\u0233su leigovu!\\\"\\n\\n\u201eD\u012bvs  lai  svietej  m\u0233su  leigovu!\\\"  obi  b\u012bdri  atk\u014drt\u014dja.  Niu  j\u012b
  svieteigi iztuk\u0161\u014dja sovys gl\u014dzis.\\n\\nKandidats  po\u0161ulaik  grib\u00e4ja  sn\u00e4gt\u012bs  pec  gr\u014dmotu  kastis,  lai
  nastu t\u016b l\u00e1j\u012b, kod iz\u0157aizis skaneigs, sovaids knauk\u0161k\u012bn\u0219
  prog\u014dja cauri par vysu vac\u016b m\u014dji. R\u014dd\u00e4j\u00e4s, ka n\u016bkv\u0101pu\u0161\u012b
  gr\u012bsti n\u016bskan\u00e4ja i nazkas smogi n\u016bzapyut\u00e1.\\n\\n\u201eAr
  D\u012bvu, tu klus\u012bs noms!\\\" kandidats teic\u00e1 i apvylka mieteli. Izlyka
  i b\u012bdri, kuri beja miete\u013c\u016bs siedieju\u0161i, capuris golv\u0101.\\n\\n\u201eTys
  iz n\u014dvi i \u0161kier\u0161on\u016bs!\\\" kandidats klusu teic\u00e1. Jys beja
  palic\u0219 b\u014dls.\\n\\nTik sv\u00e1cis galen\u0161 palyka dag\u016bt tuk\u0161ij\u0101
  ustob\u0101...\\n\\n\u201eDa,  tei  tova  pag\u014dtn\u00e1  mierst...\\\"  malnsejeig\u012bs  jautri  atteic\u00e1.
  \u201eNiu, Opol\u0233\u0219, \u010der\u012bs pi \u010demodana! Allons, enfants...\\\"\\n\\nZemn\u012bka
  d\u0101ls p\u012bzac\u00e4l\u00e1 ar aizgr\u014dbtu seji.\\n\\n\u201eKrystam\u014d\u021b,\\\"  jys  sac\u00e4,  \u201etys  vyss  beja  n\u012bki.  Tei  nav  nikaida
  dz\u012bsm\u00e1 par dorba i atpyutys laimi. Tei aizska\u0146 leidz ar kopu zvona
  beidzamu sit\u012bni. I ari tei nav eist\u014d dz\u012bsm\u00e1, jo as sov\u016bs
  b\u0101rn\u016bs laimi atr\u016bnu. Pla\u0161\u014dkai i varon\u014dkai vajag b\u0233\u021b
  munai dz\u012bsm\u00e1i. Tai vajag sp\u012bst\u012bs i t\u012bm sird\u012bs, kas
  vysu myu\u017eu ir plyuku\u0161i tik naaugleiga dorba dod\u017eus. Kas bez s\u012bvys
  i b\u0101rnim staigoj sovu gaus\u016b gaitu, i t\u014d dv\u00e4sel\u012b vajag  atsabols\u014d\u021b  munai  dz\u012bsm\u00e1i.  As  dz\u012bd\u014d\u0161u  par  t\u0101vu  z\u00e1mis
  m\u012blesteibu, par t\u016b l\u012bsmu, kas vej\u0101s ap vysim, kuri sevi atnasu\u0161i
  sovai t\u0101vu z\u00e1m\u00e1i par gun\u0219 z\u012bdu. Kas nu t\u014d, ka tu neiksti
  i v\u014drgsti: tu redzi, ka tova tauta plaukst. Kas nu t\u014d, ka t\u00e1v j\u014dmierst
  i tevi aizmiers\u0219. Tautys dv\u00e4sel\u012b tu t\u016bm\u0101r nazynoms i naminams
  dzeiv\u014dsi t\u014d\u013c\u014dk ar vysu sovu naizdz\u0101stu m\u012blesteibys
  kv\u00e4li. Krystam\u014d\u021b, nav augst\u014dkys dz\u012bsmis, par t\u0101vu
  z\u00e1mis dz\u012bsmi!\\\"\\n\\nM\u0101men\u00e1  aptur\u00e4ja  sovu  atsp\u016bli  i  n\u016bgryma  tai  kai  s\u014dpeig\u014ds
  atmi\u0146\u014ds i nik\u014d nateic\u00e1. Jei pam\u00e1t\u00e1 ar golvu iz \u016btr\u016b
  l\u016bdzeni i s\u014dka aus\u021b t\u014d\u013c\u014dk.\\n\\n\u016atr\u0101 l\u016bdzen\u012b
  Zemn\u012bka d\u0101ls r\u00e1dz\u00e4ja nazk\u016b cytu.\\n\\nGon ustaben\u00e1
  beja tikpa\u021b tuk\u0161a i nam\u012bleiga kai pirmeitej\u014d. Beja p\u012bkrauts  gr\u014dmotu  i  papeiru  skaud\u017eu  skau\u1e11zom,  iz  plauktim,  iz
  golda. Bet t\u016b\u0157aizej\u014d kandidata jys vairs nagrib\u00e4ja l\u014dg\u0101
  pazei\u021b. T\u012b iz \u0161aurys gu\u013ctenis gul\u00e4ja v\u012bns, ar n\u016bnos\u014dtu
  mieteli apzasedz\u0219. Voi t\u012b beja jys pat\u0219, voi j\u014d \u0101na?\\n\\nDzalton-b\u014dl\u014d  seja  tagad  beja  palykus\u00e1  par  pi\u013cneigu  voska
  kr\u014dsu. T\u016b\u0157aizej\u012b kupl\u0233 moti palyka par pl\u014dnom \u0161kipsne\u0146om
  i lypa pi apkl\u014dt\u014ds ar soltim sv\u012bdrim p\u012bris. Ocu v\u012bt\u0101
  caur vokora tymsumu var\u00e4ja sar\u00e1dz\u00e4\u021b div tymsys d\u016bbis. Nak\u016bpt\u014d,
  sazav\u0101lu\u0161\u014d b\u014drzden\u00e1 tik pa dal\u00e1i s\u00e1dz\u00e1 t\u012bvu,
  st\u012bgrainu koklu, kur\u0101 beja dzier\u017eama nam\u012breiga g\u014drk\u0161ona.\\n\\nCytu
  \u013cau\u017eu ustaben\u012b nabeja.\\n\\n\u201eKas  ta  tei  par  l\u012btu?\\\"  Zemn\u012bka  d\u0101ls  nam\u012breigi  d\u016bm\u014dja.  Jys
  navar\u00e4ja atsagis\u021b kai nu tricin\u00e4 par golvu.\\n\\nGul\u0101t\u014djs
  pa \u0157aizjom raust\u00e4j\u00e4s kai drebu\u013c\u016bs. Voi tys beja nu ustabenis
  mitr\u014d soltuma, voi nu drud\u017ea? Varb\u0233\u021b nu obejim.\\n\\nN\u016b\u010deikst\u00e4ja
  durovys. Pa t\u014dm iz pierstu golym \u012bg\u014dja nazkaids veirs. Klusom jys
  n\u016bzavylka i izlyka mieteli, k\u016bp\u0101 ar zal\u00e4 papeir\u0101 \u012bteitu  pagaronu  veik\u0161eiti  iz  golda.  Zemn\u012bka  d\u0101ls  n\u016bman\u00e4ja,  ka
  \u012bg\u014djiejs beja ryupeigi n\u016b\u0161kiv\u0219 b\u014drzdu, tik kuplys
  \u016bsys atst\u014ddams, i apzagierb\u0219 frak\u0101; bolta \u0161lipst\u00e1
  jam beja ap koklu.\\n\\n\u012ag\u014djiejs lyk\u014ds beja  pazeistams ar  ustabenis
  \u012bk\u014drt\u014djumu. Jys pamekl\u00e4ja vystyms\u014dk\u0101 kokt\u0101 iz
  plaukta i izlyka nalelu petrolejis lampu ar sadauzeitu stikleni iz golda. Tod sataukstiej\u0219
  spi\u010dkys, jys aizdadzyn\u014dja lampeni.\\n\\nGaisma  atspeid\u00e4ja  sve\u0161in\u012bkam  sej\u012b.  Zemn\u012bka  d\u0101lam
  pazar\u014dd\u00e4ja, ka jys nazkur b\u0233tu redziej\u0219 \u0161\u014ds tyms\u014ds
  nam\u012breig\u014ds ac\u0219, tik skaidri navar\u00e4ja atmin\u00e4\u021b \u2014
  kur. Pi gun\u0219 var\u00e4ja n\u016bman\u00e4\u021b, ka \u0161ys kungs nimoz nabeja
  tik glauns, kai tys r\u014dd\u00e4j\u00e4s mikriesl\u012b. Fraka jau vysgaram  speid\u00e4ja;  \u0161lipst\u00e1  vairs  nabeja  teira.  I  bolt\u014dka  krakla
  pr\u012b\u0161ken\u00e1 ari nab\u0233tu bejus\u00e1 par \u013caunu.\\n\\nSve\u0161in\u012bks  p\u012bg\u014dja  iz  pierstu  golym  pi  gul\u0101t\u014dja  i  ilgi  iz  j\u016b
  n\u016bzav\u00e4r\u00e1. Tod jys papuryn\u014dja golvu, atsas\u0101da pi golda i
  p\u012brakst\u00e4ja p\u014drs rinde\u0146u. T\u014ds sal\u016bciej\u0219, jys pasauc\u00e1
  apkolp\u014dt\u014dji.\\n\\nNazkur n\u016bkloudz\u00e4ja \u010deikst\u016b\u0161ys
  durovys i \u0161liuc\u016b\u0161ys k\u016bka tuplis g\u014dja  tyv\u014dk.  Kaida  ve\u013c  pajauna  s\u012bv\u012bt\u00e1  \u012bb\u014dz\u00e1  nasuk\u014dt\u016b  golvu  pa
  durovom.\\n\\n\u201eAk t\u00e1 jiu\u0219, jaunskungs!\\\" jei kauneigi smaideidama
  atsasauc\u00e1, i vylka iz kryutim bezp\u016bgain\u016b jaku cik nacik k\u016bp\u0101.
  \u201eAs d\u016bm\u014dju, ka kandidata kungs!\\\"\\n\\n\u201eVoi tu redzi t\u012b
  t\u016bs sp\u016bdri apgaism\u014dt\u016bs l\u016bgus aiz \u012blys?\\\" \u012bg\u014djiejs
  vaic\u014dja.\\n\\n\u201eKas ta beja?\\\"\\n\\n\u201eVoi tu zyni, kas t\u012b dzeivoj?\\\"\\n\\n\u201eV\u012bns
  doktor\u0219... E, v\u014drds t\u00e1pa\u021b m\u00e4lis gol\u0101...\\\"\\n\\n\u201eNu,
  lai v\u014drds pal\u012bk t\u012bpa\u021b. A tu aps\u00e1\u1e11z sovu jaukumu cik
  nacik vair\u014dk, i aiztec t\u012b par \u012blu, n\u016bd\u016b\u1e11 \u0161\u016b
  zeimeiti doktora kungam. I pasoki, ka t\u00e1v na\u013c\u014dv\u00e1 bez j\u014d
  \u012b\u021b atpaka\u013c.\\\"\\n\\nS\u012bv\u012bt\u00e1 pakas\u00e4ja s\u00e1v
  aiz mugorys, tod laikam pad\u016bm\u014dja, ka tai drusku var pazav\u00e4r\u021b
  doktora dzeiv\u016bkl\u012b, i paj\u00e4m\u00e1 zeimeiti divej\u016bs pierst\u016bs.\\n\\n\u201eKai
  tod, kai tod, jaunskungs...\\\"\\n\\nPalic\u0219 v\u012bns, sve\u0161in\u012bks
  lelym s\u016blim s\u014dka staig\u014d\u021b pa ustabeni. Pa \u0157aiz\u00e1i jys
  apzast\u014dja, sakn\u012bb\u00e1 lyupys i pyut\u00e1, kai grib\u0101dams aizpyus\u021b
  nazkur pr\u016bjom t\u014dli t\u016b, kas jam v\u012bnm\u0101r nu jauna m\u014dc\u00e4s
  viers\u0101.\\n\\nDurovys \u014dtri tyka atgryustys. \u012ag\u014dja zams, parasns
  kungs, ar zalta okulerim, sasku \u014ddu ka\u017euk\u0101. Ustobys mitrij\u0101
  gais\u0101 okuleru solt\u0233\u0219 styklys  laikam apsveida i  kungs  t\u012bpa\u021b
  pi  durovom st\u014dv\u016bt, n\u016bj\u00e4m\u00e1  okulerus  i  t\u016bs  mutauten\u012b  slauceidams,  v\u00e4r\u00e4s  ar  sovom
  tyvredzeig\u014dm opol\u014dm acim pa ustabeni apleik. Niv\u012bna cyta cylv\u0101ka\\n\\nIz
  tra\u1e55om beja dzier\u017eami s\u016bli i bolss. Sve\u0161in\u012bks \u012bg\u014dja
  tyms\u014dk\u0101 kokt\u0101 i palyka t\u012b st\u014dv\u016bt.\\n\\nt\u00e1  namaneidams,  jys  izlyka  okulerus,  \u014dtri  n\u016br\u014dv\u00e1  sovu  ka\u017euku,
  atst\u014dja  t\u016b  apkolp\u014dt\u014djai  r\u016bk\u014ds  i  pat\u0219  p\u012bg\u014dja  pi  slimin\u012bka  gultys.
  Pataukstiej\u0219  pu\u013csu,  jys  p\u012bl\u012bc\u00e1  ausi  pi  slimin\u012bka  kryutim  i
  pazaklaus\u00e4ja  mozu  breisneni.  Tod  jys  kai  nasapras\u0161on\u0101,  pac\u00e4l\u00e1
  golvu i v\u00e4r\u00e4s iz apkolp\u014dt\u014dju, kura tur\u00e4ja d\u014drg\u016b
  ka\u017euku obej\u014ds r\u016bk\u014ds izpl\u0101stu.\\n\\n\u201eSoki tu ma\u0146,
  m\u012bl\u016b s\u012bv\u012b\u021b, kas t\u00e1v t\u016b zeimeiti \u012bd\u00e1v\u00e1?\\\"
  jys vaic\u014dja.\\n\\n\u201eEuku  tys  jaunskungs,  c\u012bnejam\u012bs  doktora  lelskungs!\\\"
  apkolp\u014dt\u014dja atbi\u013cd\u00e4ja, golvu pamasdama iz frak\u014dta kunga
  pusi, kurs pa\u0161u laiku g\u014dja nu kokta \u014dr\u0101.\\n\\n\u201eNu,  t\u00e1  muna  siedei\u0161ona  nik\u014d  vairs  napaleidz\u00e4s...\\\"  \u014drsts
  atbi\u013cd\u00e4ja i grib\u00e4ja sn\u00e4gt\u012bs pec ka\u017euka. Bet frak\u014dt\u012bs
  kungs paj\u00e4m\u00e1 ka\u017euku nu apkolp\u014dt\u014djis i pam\u00e1t\u00e1
  ar golvu tai iz durovu pusi. Tod jys n\u016blyka ka\u017euku tyms\u0101 kokt\u0101
  i pastyum\u00e1 \u014drstam kaidu kr\u0101slu.\\n\\n\u201eN\u016bli\u00e7 t\u016b
  ka\u017euku, ko\u010d t\u00e1...\\\" jys sac\u00e4 iz pr\u012b\u0161ku \u012bdams.
  \u201eM\u00e1\u0219 ar doktora kungu pas\u00e4d\u00e4sim divej\u016bs pi slimin\u012bka.\\\"\\n\\n\u201eAtsasiestit...\\\"  jys  m\u012breigi  sac\u00e4,  kod  apkolp\u014dt\u014dja  jau  beja
  izg\u014djus\u00e1 \u201eKai jam?\\\" \u2014 pi tam jys par\u014dd\u00e4ja ar golvu
  iz slimin\u012bka pusi, \u201eka slimin\u012bkam tova siedei\u0161ona vairs napaleidz\u00e4s
  tik dau\u1e11z as ari sapr\u016btu nu \u014drstn\u012bceibys. Bet as d\u016bmoju,
  ka t\u00e1v kluss breisnen\u0161 ari n\u016bdar\u00e4s.\\\"\\n\\n\u201eBet as nasapr\u016btu...\\\"
  \u014drsts drusku uzbudyn\u014dts run\u014dja... \u201elabi zyn, ka t\u00e1 \u014drsts
  ir l\u012bks i t\u016bm\u0101r traucej j\u016b...\\\" Var\u00e4ja r\u00e1dz\u00e4\u021b,
  ka jam beja gryu\u0161i  frak\u014dt\u016b  kungu  sauk\u021b  ar  \u201etu\\\",  bet  ari  ar  \u201ejiu\u0219\\\"  laikam
  nadreikst\u00e4ja.\\n\\n\u201eZynu, ka trauceju!\\\" \u016bsain\u012bs m\u012breigi
  atbi\u013cd\u00e4ja. \u201eZynu, ka tovai kundz\u00e1i  \u0161udi\u0146  dzim\u0161onys  d\u012bna,  ko\u010d  gon  postn\u012bks  laikam  beja
  pazaudiej\u0219 ma\u0146 adreseitu \u012blyuguma karti...\\\"\\n\\n\u014crsts n\u016bsorka
  i soka nam\u012breigi gr\u016bz\u00e4t\u012bs iz kr\u0101sla.\\n\\n\u201eBet \u014drsts
  tei\u0161am ir l\u012bks!\\\" jys atk\u014drt\u014dja i pazav\u00e4r\u00e1 iz ka\u017euka.\\n\\n\u201eEsi
  tik lobs i pazaskot v\u00e4\u013c \u0157aiz iz munu zeimeiti!\\\" \u016bsain\u012bs
  c\u012b\u017e\u014dk run\u014dja, \u014drstam r\u016bku izlykdams iz pierduknis.
  \u201eT\u012b as rakstieju, ka studeju draugs saslim\u0219. Voi tu d\u016bmoj, ka
  ari draugs ir l\u012bks pi mirieja gultys?\\\"\\n\\nDaudzi jam st\u014dv, varb\u0233\u021b
  tyv\u014dk...\\\" atsarun\u014dja \u014drsts.\\n\\nFrak\u014dt\u012bs kungs drusku
  pazasm\u00e4ja.\\n\\nI jys n\u016bgryma dzi\u013c\u014ds d\u016bm\u014ds.\\n\\n\u201eEisti
  sok\u016bt, t\u014ds ir tik munys d\u016bmys!\\\" jys run\u014dja \u201e\u0160udi\u0146
  ir tai\u0161ni se\u0161i godi, kai m\u00e1\u0219 j\u016b pavad\u00e4jam nu augst\u0161kolys
  dzeiv\u012b. I tod as d\u016bmoju, ka simetrejis de\u013c m\u0233sim otkon p\u012bn\u014dks\u012bs
  j\u016b pavad\u00e4\u021b \u2014 da, kur?\\\"\\n\\n\u201eAs tei\u0161am navaru palik\u021b!\\\"
  \u014drsts otkon \u012bs\u014dc\u00e1.\\n\\n\u201eTu paliksi!\\\" \u016btrs jam
  osi atbi\u013cd\u00e4ja.\\n\\n\u201eDe\u013ck\u014d?\\\" \u014drsts, pu\u0219 aizkaityn\u014dts,
  pu\u0219 brein\u014ddam\u012bs vaic\u014dja.\\n\\n\u201eDe\u013ck\u014d? De\u013ct\u014d,
  ka as t\u016b tai grybu!\\\"\\n\\n\u201eTys ma\u0146 glu\u017ei kas jauns!\\\" vylka
  \u014drsts caur z\u016bbim.\\n\\n\u201eMa\u0146 n\u0101. Voi tu grybi reit\u0101
  las\u00e4\u021b m\u0233su laikrokst\u0101 obejis \u0161\u014ds scenys v\u012bnu
  s\u016bplok \u016btrai, t\u016b, kas beja pyrms se\u0161im godim, i it\u016b t\u00e1,
  \u0161\u016bvokor... I Opol\u016b pazei\u0219 kotrs... Part\u016b vari b\u0233\u021b
  dr\u016bss. Bet...\\\" jys n\u016bzapyusdams  run\u014dja,  \u201ek\u014d  ta  m\u00e1\u0219  t\u00e1  streidejom\u00e4s  de\u013c  t\u014ds  n\u012bka
  pu\u0219stu\u0146dis laik\u0101. Voi tu d\u016bmoj, ka jys ilg\u014dk dzeiv\u014d\u0219?\\\"\\n\\n\u201eDaudzi,
  ka pu\u0219stu\u0146di...\\\" \u014drsts dryumi atbi\u013cd\u00e4ja.\\n\\n\u014crsts
  n\u016bp\u012btni v\u00e4r\u00e4s iz greidu. Frak\u014dt\u012bs kungs attais\u00e4ja
  buteli, sadab\u014dja namozg\u014dtu ols gl\u014dzi, p\u012bpi\u013cd\u00e4ja t\u016b
  i sn\u00e4dz\u00e1 \u014drstam.\\n\\n\u201eNu de\u013ct\u014d! T\u016b\u0157aiz
  m\u00e1\u0219 palykom k\u016bp\u0101 kaidys trejs stu\u0146dis... Izdz\u00e4r\u00e1m
  trejs butelis. \u0160\u016b\u0157aiz as, teiri kai par\u00e1dz\u0101dams, pajiemu
  tik v\u012bnu buteli leidza. \u017d\u0101l, ka tu naatnesi r\u016b\u017eu. T\u00e1v
  \u0161udi\u0146 t\u016bs dzeiv\u016bkl\u012b j\u014dd\u016bmoj \u2014 ir d\u012bsgon...\\\"\\n\\n\u201ePateic\u016bs,
  bet as tei\u0161am \u0161\u016bvokor vair\u014dk navaru dz\u00e1r\u021b!\\\"\\n\\n\u201eKai  pateik...\\\"  \u016btrs  eisi  atbi\u013cd\u00e4ja.  \u201eIz  tovu
  veseleibu, muns naboga draugs!\\\" I jys izdz\u00e4r\u00e1 gl\u014dzi ar v\u012bnu
  vi\u013cc\u012bni.\\n\\n\u201eSovaids laimis izsaukums pi mirieja gultys!\\\" \u014drsts
  nan\u016bc\u012bt\u00e1 nap\u012bzeim\u014dj\u0219.\\n\\n\u201e\u014crpr\u014dteibys?\\\"\\n\\n\u201eTu
  d\u016bmoj?  Bet voi jys \u0161udi\u0146 natik\u0219 val\u012b nu vysom sovom kai\u021bom,
  nu bacylym i nu sovys \u014drpr\u014dteibys...\\\"\\n\\n\u201eKai, voi tu nik\u014d
  naasi dzierdiej\u0219 par j\u014d \u014drpr\u014dteibu? Ma\u0146 r\u014dd\u012bs,
  ka nu \u0161\u014ds sovys \u014drpr\u014dteibys jys dab\u014dja vysus \u0161\u016bs
  bacylus\\\".\\n\\n\u201eAs pyrm\u016b \u0157aizi dzier\u017eu, ka jys ar nervim
  slym\u014dja\\\", atbi\u013cd\u00e4ja \u014drsts.\\n\\n\u201eO, \u014drpr\u014dteigs
  jys beja jau nu laika gola. Tik m\u00e1\u0219 v\u00e4\u013c nazyn\u014dm t\u014ds
  kaitis. M\u00e1\u0219 t\u016b sauc\u00e1m par idealismu. Bet pec t\u014d, kod jys
  g\u014dja k\u016bp\u0101 ar pr\u014dteigim \u013caudim, tod j\u014d \u014drpr\u014dteibu
  var\u00e4ja jau ar r\u016bkom taukst\u00e4\u021b.\\\"\\n\\n\u201eAtsazeistu, as
  nik\u014d sevi\u0161ka...\\\"\\n\\n\u201e\u012ad\u016bmojit  it\u016b  napr\u014dteibu:  aiz\u012bt  jys  par  kandidatu  pi  kaida
  pr\u014dteiga vaca m\u014dceit\u014dja. Iz\u0157aiz jam \u012bkreit pr\u014dt\u0101
  \u2014 \u0161ys as\u016bt latv\u012bt\u0219. Latv\u012bt\u0219 \u2014 latv\u012bt\u0219,
  t\u012b nik\u014d navar dar\u00e4\u021b. Bet jys st\u014dv iz t\u014d, ka \u0161am,
  kai m\u014dceit\u014djam, j\u014dk\u016bp\u016bt sov\u0101 draudz\u012b ari tauteiba.
  Soki tok pat\u0219, kurs b\u0233dams gor\u0101 vasals cylv\u0101ks miegin\u014d\u0219
  sav\u012bn\u014d\u021b m\u014dceit\u014dja omotu ar tautisk\u012bm  cent\u012bnim?  I  nasav\u012bn\u014dja  ari.  Omots  palyka  pa  sovam,
  kandidats ar sovim tautiskim cent\u012bnim pa sovam. Tod jam \u012bg\u014dja pr\u014dt\u0101:
  kotrai tautai, kotram cylv\u0101kam ir sova \u012bpatneja religeja. I \u0161\u014d
  dzeivis uzdavums as\u016bt m\u016bdyn\u014d\u021b sovys tautys religisk\u016bs sp\u0101kus.
  \u201eT\u014d as nazynu, kas ar t\u016b religeji ir,\\\" as atbi\u013cdieju, \u201ebet
  as zynu, ka kotram cylv\u0101kam ir sovs \u012bpatnejs v\u0101dars. I tovs p\u012bn\u014dkums
  b\u0233tu par sovu v\u0101daru g\u014dd\u014d\u021b. Nakaiteitu ari \u012bzadzeiv\u014d\u021b
  jaun\u014ds bik\u0219\u014ds!\\\" Voi tu d\u016bmoj, ka  jys  man\u00e1  klaus\u00e4ja?  Pa  pr\u012b\u0161ku  s\u014dka  \u012b\u021b  iz  b\u012bdreibom...  tur\u00e4\u021b
  pr\u012b\u0161klasiejumus.  Losa  v\u012bnu  vokoru,  losa  \u016btru  \u2014  \u013caud\u0219  skot\u014ds  i
  nazyna k\u016b dar\u00e4\u021b. \u201eAtpaka\u013c r\u014dpul\u0219!\\\" v\u012bns
  soka i parausta placus. \u201eReideit\u014djs!\\\"  soka  \u016btrs i  skot\u014ds  iz  durovu
  pusi.  \u201eNikas, dzejiska vol\u016bda!\\\" soka tre\u0161s, \u201etik saturs
  naiztur kulturviesturn\u012bka kritikys...\\\"\\n\\nPr\u014dteigam cylv\u0101kam
  ar tu p\u012btyktu. A jys: \u0161ys as\u016bt v\u012bnu paaudzi par agri p\u012bdzim\u0219...
  \u0160ys rakstei\u0161\u016bt n\u014dku\u0161ai paaudz\u00e1i. I tai s\u00e4d\u00e4ja,
  rakst\u00e4ja i dyla. Skot\u012bs, t\u012b iz golda ir \u0161\u014ds \u014drpr\u014dteibys
  herbarejs. Tre\u0161\u016b dali apkolp\u014dt\u014dja  gon  jau  pa  slimeibys  laiku  b\u0233\u0219  izkleisteriejus\u00e1  pa
  pr\u012b\u0161kl\u016bgim; pazaver, kas tys v\u00e4\u013c par skaudzi!\\\"\\n\\nI
  jys ar aukiuni pagryud\u00e1 r\u016bkrokstu skaudzi. \u201eSoki niu pat\u0219: voi
  t\u00e1 nav tei br\u012bsmeig\u014d \u014drpr\u014dteiba, p\u014drd\u016b\u021b
  vysu sovu myu\u017eu, vysu sovu jauneibu par makulaturu, ar k\u016b l\u016bgus aizkleister\u00e4\u021b!
  I kaidu myu\u017eu v\u00e4\u013c... Eh!\\\"\\n\\n\u016asain\u012bs kungs \u014dtri
  p\u014drvylka ar speid\u016b\u0161\u016b fraka pierdukni par acim. Tod jys nu jauna
  p\u012bpi\u013cd\u00e4ja gl\u014dzi.\\n\\n\u014crsts beja n\u016bp\u012btns. Var\u00e4ja
  r\u00e1dz\u00e4\u021b, ka svareigs v\u014drds dzymst j\u014d dv\u00e4sel\u012b.\\n\\n\u201eNa
  j\u014d idealisms j\u016b n\u016bm\u014dc\u00e1...\\\" jys teic\u00e1, \u201ebet
  sve\u0161in\u012bks navar\u00e4ja sapras\u021b i nagrib\u00e4ja sapras\u021b j\u014d.
  I sve\u0161in\u012bkam dze\u013c\u017ea r\u016bka\\\".\\n\\n\u201eAtst\u014dsim
  \u0157aizi t\u016bs sve\u0161in\u012bkus mol\u0101!\\\" Frak\u014dt\u012bs kungs
  teic\u00e1. \u201eIr d\u012bsgon m\u0233sim po\u0161im p\u016bru, nu kurim solna
  n\u014dk... Mini ma\u0146 ko\u010d v\u012bnu v\u012bneigu tautu, kurai \u0161aidi
  idealisti ir vajdzeigi! Da\u017ei ar sovu napr\u014dtu staigoj storp gudrim, bogotim
  kungim, cyti mierst ar sovu tautys m\u012blesteibu, kurys niv\u012bnam nav vajdzeigs...
  Ak ka draugs: na tik sve\u0161in\u012bki nasapr\u016bt \u0161\u016b saucieji tuksnes\u012b:
  i m\u00e1\u0219 po\u0161i asom par pr\u014dteigim, lai kav\u0101tu laiku taidim
  n\u012bkim. T\u00e1, skot\u012bs, v\u012bns mierst, kuru draugi se\u0161i godi tam
  atpaka\u013c par iergli g\u016bdyn\u014dja, i \u0161\u012b po\u0161i draugi s\u00e4\u1e11
  t\u00e1, i v\u012bns d\u016bmoj, kai drei\u017e\u014dk tik\u021b atpaka\u013c pi
  nan\u016bbeigtys preferansa partejis, a \u016btrs riekinoj, voi v\u00e4\u013c \u012bsp\u00e4\u0219
  aizskr\u012b\u021b iz masku balli, lai t\u016b aprakst\u00e4\u021b de\u013c sova
  principala av\u012bzis \u2014 trejs kapeikys par rindeni...\\\"\\n\\n\u014crsts
  vairs nadzierd\u00e4ja j\u014d beidzam\u016b v\u014drdu. Jys beja p\u012bzalic\u0219
  pi slym\u014d i klaus\u00e4j\u00e4s. Kod jys p\u012bzac\u00e4l\u00e1, tod divejus
  pierstus izsp\u012bd\u00e1 gul\u0101t\u014djam iz acim. \u201eJys jau ir izc\u012bt\u0219...\\\"
  jys klusom teic\u00e1.\\n\\n\u016asain\u012bs pazav\u00e4r\u00e4s stu\u0146din\u012bk\u0101.\\n\\n\u201eV\u00e4\u013c
  nav desmit...\\\" jys sac\u00e4ja. Tai, jau iz reitd\u012bnu ma\u0146 iz\u012b\u0219
  v\u00e4\u013c divi roksti:, \u201eB\u014dl\u014d n\u014dv\u00e1 jau otkon n\u016blaupiejus\u00e1...\\\"
  Nr.1 i Nr.2\\\" \u201e\u0160\u014d goda  sezona  bez  \u0161aubom  sasn\u00e4dz\u00e1  sovu  augstumu  ar  vakarej\u016b
  masku balli...\\\" Kotram rokstam pa se\u0161desmit rinde\u0146u, i rinden\u00e1
  pa 3 kapeikys...\\\"\\n\\nBet tod pie\u0161ki jys, kai n\u016bp\u013cauts kryta
  ce\u013c\u016bs pi myr\u016bn\u00e1 i s\u014dka bu\u010d\u014d\u021b t\u014d l\u012bs\u016b
  r\u016bku.\\n\\n\u201eMuns  br\u014dl\u0219,  Jonatan\\\",  muns  br\u014d\u013c  Jonatan!\\\"  jys  leidz
  izmysumam satr\u012bkts sauc\u00e1 \u201eko\u010d as tov\u0101 v\u012bt\u0101 b\u0233tu
  mir\u0219!\\\"\\n\\n\u014crsts  at\u013c\u014dv\u00e1  izatrok\u014d\u021b  j\u014d  s\u014d\u1e55om.  Pec  breisnen\u00e1  \u017eurnalists
  p\u012bzac\u00e4l\u00e1.\\n\\n\u201eTai aiz\u012bt j\u012b vysi, ar t\u014dm pylnyjom
  sirdim\\\"'' jys sac\u00e4ja, \u201epal\u012bk tik taidi lupotys kai tu i as! N\u014d\u00e7!''\\\"\\n\\nPi
  durovom jys n\u016bst\u014dja.\\n\\n\u201eIz  j\u014d  krysta  m\u00e1\u0219  liksim  uzrokstu\\\",  jys  sac\u00e4:  \u201ev\u012bn\u0101  pus\u012b
  rakst\u00e4sim: jys m\u012b\u013c\u014dja sovu tautu, \u016btr\u0101 pus\u012b \u2014
  j\u014d m\u012blesteiba beja j\u014d l\u014dsts.\\\"\\n\\nZemn\u012bka d\u0101ls
  k\u014dp\u00e1 otkon zyrgam mugor\u0101 i j\u014dja iz m\u014djom. Stypr\u012bs
  viej\u0219 dzyna jam ac\u012bs osys sn\u012bga odotys, a jys t\u014d naman\u00e4ja.
  J\u014d ocu plaksteni p\u012bsola lada pylni.\\n\\n\u016atr\u014d k\u016bdal\u00e1\\n\\nZemn\u012bka  d\u0101ls  ora  teirum\u0101  aiz  bierz\u0219.  T\u0101vs  i  m\u014dt\u00e1  beja
  atsas\u0101du\u0161i atsapyusdami zam l\u012bpys.\\n\\n\u201eVoi tu d\u0101lu esi
  redziej\u0219 kaidu \u0157aizi smej\u016bt\u012bs, voi dz\u012b\u017e\u016bt?\\\"
  m\u014dt\u00e1 vaic\u014dja.\\n\\n\u201eNav  jau  jys  vair\u014dk  puika!\\\"  t\u0101vs  atbi\u013cd\u00e4ja.  \u201en\u014dk  jau  pr\u014dta
  god\u016bs...\\\", a pat\u0219 n\u016bl\u012bc\u00e1 sierm\u016b golvu, lai s\u012bva
  navar\u0101tu r\u00e1dz\u00e4\u021b j\u014d ocu.\\n\\nM\u014dt\u00e1 n\u016bzapyut\u00e1:
  \u201eCik biedeigi, cik tuk\u0161i \u0161\u012b pr\u014dta godi!\\\"\\n\\n\u201eMa\u0146  tai  r\u014dd\u012bs,  ka  jam  t\u012b  sve\u0161um\u0101  kaida  nalaim\u00e1  b\u0233\u0219
  n\u016btykus\u00e1!\\\" jei vair\u014dk po\u0161a s\u00e1v run\u014dja. \u201eAr
  v\u012bnu \u017e\u0101lumu aizj\u014dja, ar septeinim atj\u014dja. Agr\u014dk tok
  jys g\u014dja pi man\u00e1, paraud\u014dja. A tagad jam nav vairs niv\u012bna, ar
  k\u016b v\u014drdeni p\u014drmei\u021b. V\u012bns pat\u0219 nas sovu nostu.\\\"\\n\\nT\u0101vs
  naatbi\u013cd\u00e4ja nik\u014d. Kod m\u014dt\u00e1 beja izg\u014djus\u00e1 iz kl\u0101vu,
  tod jys apzav\u00e4r\u00e1 vysapleik, kai iz \u013caunu dorbu taiseidam\u012bs,
  i lieni aizg\u014dja, kai r\u014dd\u00e4j\u00e4s, sova teiruma v\u0101rt\u016bs,
  i drei\u017ei vi\u0146 izgaisa bierz\u012b.\\n\\n\u201eAtsas\u00e4ssim, d\u0101ls!\\\"
  sac\u00e4 t\u0101vs pi j\u014d kl\u014dt p\u012b\u012bdams.\\n\\nP\u014drg\u014dj\u0219
  par bierzi jys n\u016bst\u014dja i r\u00e1\u1e11z: d\u0101ls ar \u2014 ar, kotr\u0101
  vogys gol\u0101 n\u016bst\u014dj i d\u016bmoj. I storp uzacim sazavalk dzi\u013c\u014ds
  grumbys nu d\u016bmom. Cytu\u0157aiz jys skot\u014ds t\u014dlum\u0101, p\u014dri
  me\u017eim, par padebe\u0161im... Voi nu t\u012bn\u012bnis n\u014dk\u0219 atbi\u013cd\u00e1
  j\u014d d\u016bmom?\\n\\nObi atsas\u0101da gr\u014dvmal\u012b pi lozdu kryuma, kur
  pavasara saul\u00e1 beja saka\u013ctiejus\u00e1 p\u0101rnej\u014ds lopys.\\n\\n\u201eM\u014dt\u00e1  gau\u017ei  n\u016bskumus\u00e1,  d\u0101ls...\\\"  t\u0101vs  \u012bs\u014dka,  \u201eka  tu  tik
  skumeigs. Jei navar sapras\u021b, park\u016b tu tik daudzi d\u016bmoj. I pr\u012bcys
  t\u00e1v vairs nikaidys nav\\\".\\n\\nT\u0101vs nasc\u00e4 nik\u014d. Jys lieni
  k\u016bd\u00e4ja p\u0101rnej\u016b smylgu ar sovim v\u00e4\u013c boltyj\u012bm z\u016bbim.\\n\\n\u201eN\u0101,
  t\u0101vs, pr\u012bcys ma\u0146 vairs nikaidys nav!\\\" d\u0101ls atbi\u013cd\u00e4ja.
  \u201eI nab\u0233\u0219 nikod vairs...\\\" jys par breisneni teic\u00e1.\\n\\n\u201ePasaul\u012b
  tik dau\u1e11z jauneibys, dz\u012bs\u1e3fu i z\u012bdu...\\\" jys lieni teic\u00e1.\\n\\n\u201eTikpa\u021b
  dau\u1e11z vacuma, osoru i solnys...\\\" d\u0101ls atbi\u013cd\u00e4ja. \u201eRedzi,
  t\u0101vs, t\u00e1 ir tys, kas ma\u0146 nad\u016bd m\u012bra. Ma\u0146 grib\u0101tus
  pasaul\u012b atras\u021b taidu l\u012btu, kurai tik v\u012bna pus\u00e1 ir, grib\u0101tus
  \u012bd\u016bm\u014d\u021b k\u016b taidu, kas naneikst, nav\u014drgst i narau\u1e11...
  As navaru atras\u021b taidys l\u012btys. Nav taidys  dzeiveibys,  kurai  nab\u0233tu  j\u014dsamoksoj  ar  n\u014dvi.  Nav  taidys
  laimis, kura nab\u0233tu laupeita nu cytim, voi kas naplauktu iz nalaimis stubura...\\\"\\n\\n\u201eI
  par t\u016b tu d\u016bmoj?\\\" t\u0101vs n\u016bskum\u0219 vaic\u014dja.\\n\\n\u201eDa...
  nu reita leidz vokoram. I m\u012bg\u0101 as t\u014ds obejis dzier\u017eu: laimis
  i nalaimis dz\u012bsmi... As zynu t\u0101vs: ma\u0146 nab\u0233\u0219 m\u012bra,
  cikom as naatminei\u0161u \u0161\u014ds br\u012bsmeig\u014ds meiklis, de\u013ck\u014d
  pasaul\u012b nav\u0101 laimis bez nalaimis\\\".\\n\\n\u201eI tu t\u016b grybi atmin\u00e4\u021b?\\\"\\n\\n\u201eNikas
  cyts ma\u0146 t\u014ds nasoka...\\\"\\n\\nT\u0101vs n\u016bk\u014dr\u00e1 golvu.\\n\\n\u201eTai
  b\u0233\u0219 i ar mani, t\u00e4\u021b...\\\" d\u0101ls, t\u016b saprosdams, s\u014dpeigi
  atbi\u013cd\u00e4ja. \u201eTik n\u014dvis nakt\u0219: tei pajim\u0219 vysys itaidys
  d\u016bmys, nu kurom sird\u0219 navar tik\u021b val\u012b.\\\"\\n\\n\u201eTai st\u014dsta
  par kaidu kupreiti...\\\" jys lieni \u012bs\u014dka: \u201ejam bej\u0219 kauns nu
  sova kuprain\u014d  pakrie\u0161l\u00e1. Tod jys pajiem\u0219 l\u014dpstu i aizg\u014dj\u0219  iz
  jyurmolu, iz jyurys balyn\u014dt\u014dm smi\u013cktim. T\u012b jys grib\u00e4ja
  aprak\u021b sovu pakriesli. K\u016b vair\u014dk smi\u013ck\u0161u jys tam b\u00e4r\u00e1
  viers\u0101, t\u016b aug\u0161\u014dk c\u00e4l\u00e4s pakrieslis iz smi\u013ck\u0161u
  koponys... i lel\u014dks beja j\u014d kupris. Tik vokor\u0101, kod n\u016br\u012bt\u00e4ja
  saul\u00e1, tymsums apj\u00e4m\u00e1 kuprei\u0161a nalaimeig\u016b \u0101nu...\\\"\\n\\nT\u0101vam
  ac\u0219 palyka sl\u00e1pnys. Jys p\u014drvylka ar c\u012bt\u016b dalnu par p\u012bri
  kai sv\u012bdrus slauceidams.\\n\\n\u201eZyni k\u016b, d\u0101ls!\\\" jys tod styngri
  teic\u00e1: \u201eNu p\u016bra niv\u012bns navar pat\u0219 sev\u00e1 izvi\u013ck\u021b.
  Muna r\u016bka t\u00e1 ir par eisu. J\u014dj tu rudin\u012b. Mekl\u00e1j taidu cylv\u0101ku,
  kurs m\u014dk meiklis min\u00e4\u021b. Varb\u0233\u021b zyna ko\u010d v\u012bns
  tovu meikli. I tu atj\u014dsi iz m\u014djom jau bez it\u014dm d\u016bmom...\\\"\\n\\n\u201eT\u00e1v
  taisneiba, t\u0101vs!\\\" Zemn\u012bk\u0101 d\u0101ls atbi\u013cd\u00e4ja.\\n\\nN\u014dku\u0161\u0101
  rudin\u012b m\u014dt\u00e1 spraud\u00e1 cytu k\u016bdali sprielneic\u0101 i dau\u1e11z
  \u0157ai\u017eu slauc\u00e4ja ac\u0219, kod tym\u014ds p\u012bzal\u00e4ja osoru,
  laikam nu \u00e1glis skola k\u016bdeig\u012bm  dyumim.  Viej\u0219  stypri  pyut\u00e1  i  klabyn\u014dja  ap  ustobu;  a
  Zemn\u012bka d\u0101ls j\u014dja pa vieji v\u012bns pat\u0219 pa naktim iz austrumu
  pusi, gaidamai  saul\u00e1i  preteim. I d\u016bm\u014dja: kur  as atras\u0161u cylv\u0101ku,
  kas atmin\u00e4s munu meikli?\\n\\n* * *\\n\\nJ\u014dja Zemn\u012bka d\u0101ls pyrm\u016b
  godu i nu ikkotra celin\u012bka vaic\u014dja: \u201eVoi tu zyni taidu cylv\u0101ku,
  kurs vysys meiklis atmi\u0146?\\\" Vysi cel\u00e1 g\u014djieji gr\u016bz\u00e4ja
  ar golvu.\\n\\n\u201eVoi tu zyni, kam taida gr\u014dmota ir?\\\"\\n\\nTik v\u012bns
  sac\u00e4ja: \u201eTaida cylv\u0101ka as gon nazynu. Bet ir v\u012bna taida gr\u014dmota.
  Tym\u0101 ir atbi\u013cdis iz vysom meik\u013com.\\\"\\n\\n\u201eT\u00e1pa\u021b
  aiz me\u017ea ir v\u012bns kolns. Iz t\u014d kolna ir v\u012bna moza m\u014djen\u00e1.
  Tym\u0101 dzeivoj vacs veirs. Jam ir taida gr\u014dmota.\\\"\\n\\nZemn\u012bka d\u0101ls
  aizj\u014dja iz vac\u016b. Ustobai beja v\u012bns l\u016bdzen\u0161. Pi l\u016bdzen\u00e1
  Zemn\u012bka d\u0101ls \u012braudz\u00e4ja ar boltu pologu apkl\u014dtu ga\u013cdeni,
  iz kura  lela,  lela  gr\u014dmota.  Vacs,  maln\u014ds  dr\u00e4bj\u014ds  gierb\u012bs  veirs,  ar
  sudobra boltim motim, bet v\u00e4\u013c sorkonu vaigu, s\u00e4d\u00e4ja t\u012b
  i las\u00e4ja lel\u016b gr\u014dmotu. A par vysu ustabeni beja kai zal\u00e1 \u0101na
  p\u014drl\u012bta, laikam nu l\u012bpys aiz l\u016bdzen\u00e1... V\u012btv\u012btom
  r\u014dd\u00e4j\u00e4s dzalton-sorkoni r\u012bt\u016b\u0161\u014ds saulis storu
  gradzyni. Zemn\u012bka d\u0101ls brein\u014dj\u00e4s, cik skaidri beja l\u016bdzen\u00e1
  stykly: tik skaidri, ka caur t\u012bm var\u00e4ja r\u00e1dz\u00e4\u021b kopus iz
  \u016btrys p\u012bka\u013cnis... boltus marmora krystus ar efeju za\u013cumu, caur
  kuru mirdz\u00e4ja zalta roksti, malnus sp\u016bdrus granita krystus i astris, kai
  klusys zvaigznis iz v\u012bntuleigim kopim. Aiz kopim beja me\u017e\u0161, tymsu
  \u00e1g\u013cu izraib\u014dts rudin\u00e1 kr\u014ds\u0101 ar zalta b\u0101rzim i
  a\u0161n\u00e1 sorkonijom ap\u0219om... Vyss beja tik kluss i m\u012breigs vokora
  sauleitis sorkonij\u0101 gaismys mygl\u0101, tai at\u0161kierts nu pasaul\u00e1
  tr\u016bk\u0161n\u00e1, kai dorba cylv\u0101ks sv\u0101tvokor\u0101, kod m\u012bgs
  par acim ar sovu meikst\u016b r\u016bku gl\u014dsta, a sird\u0219 ir pr\u012bceiga
  par padareit\u016b nedelis dorbu...\\n\\nZemn\u012bka d\u0101ls nadreikst\u00e4ja
  trauc\u00e4\u021b siermga\u013cvi, cikom tys pat\u0219 \u012braudz\u00e4ja c\u012bmeni
  i laipni pam\u00e1t\u00e1 ar golvu.\\n\\n\u201eAs  nazynu  voi  as  eist\u0101  v\u012bt\u0101  b\u0233\u0161u  atg\u014dj\u0219...\\\"  Zemn\u012bka  d\u0101ls
  nadr\u016bsi \u012bs\u014dka.\\n\\nSiermga\u013cv\u0219 j\u016b pas\u0101dyn\u014dja
  i izvaic\u014dja par j\u014d vajdzeibu.\\n\\nZemn\u012bka d\u0101ls past\u014dst\u00e4ja
  vysu nu gola.\\n\\n\u201eAk to tu grybi zyn\u014d\u021b, de\u013ck\u014d pasaul\u012b
  nav laimis bez nalaimis, nav dzeiveibys bez n\u014dvis?\\\" siermga\u013cv\u0219
  d\u016bmeigi \u012bs\u014dka. \u201eTu gribieji pat\u0219 ar sovu pr\u014dtu atmin\u00e4\u021b
  \u0161\u016b meikli?  Voi zyni, d\u0101ls: tyukst\u016b\u0161u godu jau cylv\u0101ki
  ir d\u016bm\u014dju\u0161i par t\u016b, desmit tyukst\u016b\u0161u cylv\u0101ku
  ir ap \u0161\u016b pyulieju\u0161\u012bs.\\n\\nAtminiej\u0219 \u0161\u014ds meiklis
  nav niv\u012bns. Tei ir augst\u014dka par cylv\u0101ka pr\u014dtu. Tei laim\u00e1
  i nalaim\u00e1 \u012bt aug\u0161\u014dk par cylv\u0101ka pr\u014dtu.\\\"\\n\\n\u201eTo
  ma\u0146 b\u0233\u0219 j\u014dj\u014dj atpaka\u013c pa t\u016b pa\u0161u ce\u013cu,
  pa kuru atj\u014dju?\\\" jauneklis n\u016bskum\u0219 vaic\u014dja. \u201eTo as nadab\u014d\u0161u
  zyn\u014d\u021b t\u014d, pec k\u014d as ilgoj\u016bs?\\\"\\n\\n\u201eVoi as ari
  dreiksteitu...\\\" Zemn\u012bka d\u0101ls sac\u00e4 elpu aizraun\u016bt.\\n\\n\u201eTai
  nav, d\u0101ls...\\\" siermga\u013cv\u0219 m\u012breigi atbi\u013cd\u00e4ja. \u201eCylv\u0101ka
  pr\u014dts \u0161\u014ds meiklis atmin\u00e4\u021b navar. Bet t\u016bm\u0101r tei
  m\u0233sim nav palykus\u00e1 par n\u016bsl\u0101pumu. Tys, k\u014d r\u016bk\u014ds
  st\u014dv laim\u00e1 i nalaim\u00e1, tys pat\u0219 m\u0233sim ir dev\u0219 atbi\u013cdi
  iz \u0161\u016b cylv\u0101ka sird\u0219 nam\u012breig\u016b vaic\u014djumu.\\\"\\n\\n\u201eDe\u013ck\u014d
  n\u0101, d\u0101ls, i tu dreiksti  dzierd\u00e4\u021b \u0161\u016b atbi\u013cdi.
  T\u00e1, \u0161ym\u0101 gr\u014dmot\u0101 tei ir:.. De\u013c vysim tei ir raksteita.
  Bet daudzej\u012b t\u016b nagryb dzierd\u00e4\u021b, daudzej\u012b navar sapras\u021b.\\\"\\n\\n\u201eAtsasies\u021b,
  d\u0101ls...\\\" siermga\u013cv\u0219 sirsneigi sac\u00e4ja.\\\" M\u0233sim daudzi
  j\u014drunoj. Vysa \u0161ei gr\u014dmota, tu zyni, ir saraksteita tik par \u0161\u016b
  v\u012bnu meikli: park\u016b nav laimis bez nalaimis i park\u016b nav dzeiveibys
  bez n\u014dvis?\\\"\\n\\nJauneklis uzbudyn\u014dts v\u00e4r\u00e4s iz siermga\u013cvi,
  kai grib\u0101dams jau nu j\u014d lyupom n\u016bskait\u00e4\u021b kotru n\u014dku\u0161\u016b
  v\u014drdu.\\n\\n\u201eTod gon b\u0233\u0219 symts sovaidu atbi\u013c\u017eu...\\\"
  Zemn\u012bka d\u0101ls nadr\u016bsi pavaic\u014dja.\\n\\n\u201eN\u0101, tik v\u012bna
  atbi\u013cd\u00e1. I eis\u016bs v\u014drd\u016bs tei sajemoma: nav laimis bez nalaimis,
  nav dzeiveibys bez n\u014dvis part\u016b, ka cylv\u0101ks ir aizmiers\u0219 D\u012bvu...
  Voi tu sapr\u016bti t\u016b?\\\"\\n\\nI  siermga\u013cv\u00e1  sp\u016bdr\u014ds  ac\u0219  s\u014dka  v\u00e4rt\u012bs  iz  jaunekli  leidz  j\u014d
  dv\u00e4selis dzi\u013cumam.\\n\\n\u201eIr, d\u0101ls, tik trejs b\u0101dys pasaul\u012b,\\\"
  siermga\u013cv\u0219 m\u012breigi atbi\u013cd\u00e4ja, \u201ei t\u014ds po\u0161ys
  ir tik v\u012bnys. T\u014ds v\u012bnys ir sierd\u012bn\u00e1 b\u0101dys, t\u014ds
  \u016btr\u014ds ir griecin\u012bka b\u0101dys, t\u014ds tre\u0161\u014ds ir mirieja
  b\u0101dys. Ka cylv\u0101ks nab\u0233tu aizmiers\u0219 D\u012bvu, to nab\u0233tu
  niv\u012bnys b\u0101dys.\\\"\\n\\n\u201eNajam  par  \u013caunu,  kryst\u0101v...\\\"  Zemn\u012bka  d\u0101ls  pec  breisnen\u00e1
  nadr\u016bsi \u012bs\u014dka. \u201eRedzi, nu b\u0101rza saknis izaug b\u0101rza
  atvas\u00e1, nu veitula saknis aug veitula atvas\u00e1. As zynu, ka ikkotram k\u016bkam
  ir sovaida sakn\u00e1 i nu v\u012bnys saknis navar divi v\u012bnaidi k\u016bki aug\u021b.
  Pasaul\u012b ir daudzi, tik daudzi vysaidu b\u0101du... kai ta t\u014ds vysys var
  aug\u021b nu v\u012bnys saknis?\\\"\\n\\n\u201eAs, kryst\u0101v, labi nasapr\u016btu...\\\"\\n\\n\u201ePasaul\u012b,
  b\u0101rns, ir  daudzi  b\u014dri\u0146u, gryutd\u012bnu-b\u014dri\u0146u. Niv\u012bns
  cylv\u0101ks nav izskaitiej\u0219 i niv\u012bns cylv\u0101ks nav apriekin\u014dj\u0219
  j\u016bs osoru. J\u012b \u012bt pa pasauli i rau\u1e11. J\u012b rau\u1e11, kod vac\u014dkus
  pi b\u0101rnim r\u00e1\u1e11z i draugus pi draugim... j\u012bm nav vac\u014dku,
  nav b\u0101rnu, nav draugu v\u014drda. J\u012b rau\u1e11, kod runoj par taisneibu
  i v\u012bnleidzeibu... j\u012bm nikur nav\u0101 taisneibys, j\u012bm niv\u012bns
  nagryb leidzeigs b\u0233\u021b. J\u012b rau\u1e11, kod par t\u0101vu z\u00e1mi st\u014dsta
  i par dzimtini teic... j\u012bm nav\u0101 t\u0101vu z\u00e1mis i nan\u016bgiustam\u012bs
  viej\u0219 zyna, kai j\u016bs dzimtini sauc. J\u012b rau\u1e11, kod j\u012b po\u0161i
  par sevi d\u016bmoj: kotrs zyna, k\u014d jys gryb, kotram ir pec k\u014d dzeit\u012bs
  i pyul\u00e4t\u012bs. A \u0161\u012b dzeivis gryutd\u012bni ver\u0101s iz dyumim
  i iz vieji, kurs sn\u012bgu putynoj: ari j\u012bm j\u014dizgaist, kai dyumim i j\u016bs
  p\u0101di nav vairs radzami iz bolt\u014d sn\u012bga. Tai j\u012b grymst nu v\u012bnys
  v\u012bntuleibys \u016btr\u0101 i skumis kai iudin\u00e1 z\u014dlis tyn\u0101s ap
  j\u016bs r\u016bkom i k\u014djom...\\\"\\n\\n\u201eI tu d\u016bmoj, ka aizmiers\u0161ona...\\\"
  vaic\u014dja Zemn\u012bka d\u0101ls.\\n\\nSiermga\u013cv\u0219 steivi v\u00e4r\u00e4s
  iz v\u012bnu po\u0161u v\u012btu, kai t\u012b b\u0233tu radzams vyss, k\u016b jys
  sac\u00e4.\\n\\n\u201eDa, b\u0101rns: j\u012b vairs nazyna cel\u00e1 atpaka\u013c
  iz sovu t\u0101va s\u0101tu. J\u012b nazyna, ka v\u012bns s\u00e4\u1e11 i gaida,
  d\u012bnom i naktim gaida, voi j\u012b nan\u014dk\u0219 pi j\u014d atpaka\u013c.  I  pi  sovom  kryutim  jys  j\u016bs  sp\u012bstu  i  sk\u016bpsteitu  j\u016bs
  n\u016bputieju\u0161\u016bs  vaigus,  i  narun\u014dtu  par  j\u016bs  pag\u014dju\u0161\u014dm  d\u012bnom,  lai
  izm\u016bceita sird\u0219 nu jauna nas\u014dktu s\u014dp\u00e4\u021b. Nazyna \u0161\u012b
  gryutd\u012bni, ka j\u016bs kryut\u012bs snau\u017e d\u014drga, d\u014drga dv\u00e4sel\u00e1,
  tik d\u014drga, ka pat\u0219 D\u012bvs pec j\u014ds ilgoj\u0101s. Tai\u0161ni pec
  \u0161\u016bs dv\u00e4se\u013cu jys ilgoj\u0101s. Na pec t\u014dm bogotijom i pr\u012bceigijom,
  a pec \u0161\u016bs nabogu dv\u00e4se\u013com. Nazyna j\u012b, ka \u0161ys D\u012bvs
  atg\u014dja iz pasauli, mekl\u00e4ja i sauc\u00e1 vysus, kam gryu\u0161i ir i k\u016b
  v\u012bntuleiba sp\u012b\u017e. I po\u0161am D\u012bvam beja gryu\u0161i j\u014dc\u012b\u0161.
  Jys ir nos\u014dj\u0219 n\u016bpleisu\u0161ys dr\u00e4bis, ir klausiej\u012bs laimeigu
  \u013cau\u017eu izsm\u012bk\u013c\u016bs. De\u013ct\u014d jam gryutd\u012bni tik
  m\u012bly. De\u013ct\u014d jys gaida d\u012bnom i naktim, voi j\u012b na\u012b\u0219
  pi j\u014d, nan\u016blik\u0219 j\u014d kliep\u012b sovu v\u012bntuleibu i sovys
  skumis. Cylv\u0101ks ir aizmiers\u0219 j\u016b, v\u012bns pat\u0219 nas sovu nostu
  i rau\u1e11 pa pasauli staig\u014ddams...\\\"\\n\\n\u201eTod t\u014ds \u016btr\u014ds
  b\u0101dys\\\" \u2014 siermga\u013cv\u0219 run\u014dja t\u014d\u013c\u014dk, i kai
  pag\u014dtnis \u0101na p\u014drzalaid\u00e1 par j\u014d seji \u201et\u014ds ir griecin\u012bku
  b\u0101dys. T\u014ds b\u0101doj t\u012b lapn\u012b i t\u012b, kas spieceigi jiut\u014ds.
  Pa augstim kolnim j\u012b staig\u014dja i t\u014dli v\u00e4r\u00e4s. N\u014dvis
  klusums beja ap j\u012bm, lela v\u012bntuleiba j\u016bs c\u00e4l\u00e1 iz aug\u0161u,
  kai nu jyurys  dybyna.  \u201eAs  va\u013cdei\u0161u!\\\"  j\u016bs  p\u0101rkiun\u00e1  bolss  sauc\u00e1,  j\u012bm
  dreikst\u00e4ja atbi\u013cd\u00e4\u021b tik j\u016bs pa\u0161u atba\u013cs\u0219.
  Cylv\u0101ku cierst\u012b celi j\u012bm beja par \u0161aurim, k\u014djis dauz\u00e4j\u00e4s
  pi cylv\u0101ku \u017e\u016bgim. \u201eSp\u014drn\u016bs as laist\u016bs par t\u016b
  vysu p\u014dri!\\\" j\u012b teic\u00e1.\\n\\nSiermga\u013cv\u0219  otkon  apklusa.  Zemn\u012bka  d\u0101ls  na\u012bzadr\u016bsyn\u014dja  j\u014d
  trauc\u00e4\u021b.\\n\\nM\u014dtis  lyugdam\u014ds  v\u00e4r\u00e4s  j\u012bm  paka\u013c,  s\u012bvu  osorys  nasp\u00e4ja  j\u016bs
  n\u016btur\u00e4\u021b, b\u0101rnu meikst\u014ds r\u016bcenis j\u012b sameid\u00e4
  iz c\u012bt\u014d akmin\u00e1... Bez sai\u0161kim, bez r\u016bbe\u017ea, bez pag\u014dtnis!
  Kolnu sn\u012bgain\u014ds v\u00e4rtinis beja t\u014dli zam\u014dk j\u016bs, m\u014dkuli
  gr\u012bz\u00e1 j\u012bm ce\u013cu. Tod s\u014dka v\u012bns nu j\u012bm stypri sm\u012bt\u012bs.
  Cyti atsav\u00e4r\u00e1 i dzierd\u00e4ja: \u201eAs natycu tovim sp\u014drnim!\\\"
  J\u012b grib\u00e4ja t\u014d\u013c\u014dk laist\u012bs lapnum\u0101, bet viej\u0219
  n\u00e1s\u00e1 atba\u013csi nu kotrys pusis: \u201eAs natycu tovim sp\u014drnim!\\\"
  \u0160ei naticeiba tyn\u014ds kai lada paved\u012bni ap j\u012bm, i k\u016b stypr\u014dk  j\u012b  c\u00e4l\u00e1  sovus  sp\u014drnus,  t\u016b  c\u012b\u017e\u014dk  tyn\u014ds  solt\u012b  naticeibys
  paved\u012bni... T\u012b j\u012b gu\u013c \u2014 dzil\u00e4 \u0161liud\u016b\u0146u
  gais\u0101, kur sauleit\u00e1 naspei\u1e11, kur miene\u0161a sudobr\u014dt\u014ds
  k\u014djis cauri \u012bt. T\u012b j\u012b gu\u013c i dzier\u1e11, kai n\u016bzapyu\u0161
  m\u014dt\u00e1, dzier\u1e11, kai s\u012bva klusi \u0161\u0146uks\u021b. Kai bezm\u012bga
  gul\u0101t\u014djs, kod aiz nabeidzam\u014ds s\u014d\u1e55u nakt\u0219 naaust gaismys
  bl\u0101zma. B\u0101rna asarenis pa laseit\u00e1i kreit iz j\u016bs sird\u0219...
  Ir v\u00e4\u013c cytaidi griecin\u012bki \u2014 t\u012b, kam div dv\u00e4selis kryut\u012bs.
  V\u012bna dv\u00e4sel\u00e1 st\u014dv bolta i skaidra, kai marmora t\u0101ls, i  skot\u014ds  iz  sevi  ar  sovom  skaidr\u014dm  acim.  \u016atr\u014d  dv\u00e4sel\u00e1  at\u012bt  pa
  naktim, maln\u0101 sag\u0101 tei tyn\u0101s i klusi runoj: \u201eAs zynu, kur skaista
  s\u012bva tev\u00e1 gaida... bet t\u00e1v v\u012bnam po\u0161am j\u014dn\u014dk!
  As zynu, kur zaltu ka\u013c... bet t\u00e1v  v\u012bnam  po\u0161am  j\u014dn\u014dk!  As  zynu,  kai  tovu  \u012bnaidn\u012bku  samei\u021b
  dub\u013c\u016bs... bet t\u00e1v v\u012bnam po\u0161am j\u014dn\u014dk!\\\" I tu
  cel\u012bs nakt\u012b i pa tymsu meklej sovys s\u0101tys durovu; bet kai tik tu
  k\u014dji sp\u00e1\u0157 par sl\u012bksni, t\u012b tova bolt\u014d dv\u00e4sel\u00e1  kai  marmora  t\u0101ls  st\u014dv  i  iz  tevim
  ver\u0101s  ar  sovom skaidrijom,  skumeigijom  acim.  Tu  lieni  attaisi  sovu  l\u016bgu  i  pa
  kluse\u0146om k\u014dp sov\u0101 d\u014drz\u0101; i t\u012b aiz kuplyjom r\u016bzjom
  st\u014dv tova bolt\u014d dv\u00e4sel\u00e1, kai marmora t\u0101ls, i ver\u0101s
  iz tevi sovom skaidrijom acim. Tod tevi  sajem trokys  dusmys, tu \u010d\u00e1\u0157  dub\u013cus
  i  sv\u012b\u1e11 vaig\u0101 sovai boltyjai dv\u00e4sel\u00e1i, tu si\u021b t\u016b
  ar kul\u0101kim, meidi ar k\u014djom. Tu \u00e1j t\u012b, kur skaista s\u012bva
  tevi gaida, tu \u00e1j t\u012b, kur zaltu ka\u013c, tu sprau\u1e11 sovu naida n\u0101zi
  pretin\u012bka kryut\u012bs... A kod tu at\u00e1j atpaka\u013c, tova bolt\u014d
  dv\u00e4sel\u00e1 otkon t\u012bpa\u021b st\u014dv... sameideita, apsp\u013cauta...
  tik t\u014ds ac\u0219 ir taidys pa\u021b skaidrys i bezgola skumeigys. Tod s\u014dc\u0101s
  br\u012bsmeiga nycyn\u014d\u0161ona... kur  cylv\u0101ks  kaun\u012bs  pat\u0219  s\u00e1v  viers\u0101  sp\u013cau\u021b.  Tyukst\u016b\u0161u  godu  jys
  mozg\u014dtu sovu dv\u00e4seli, bet jys zyna, ka tei nikod vairs natik\u0219 bolta.
  Tod jys b\u0101g pr\u016bjom, kai pyrm\u012bs br\u014dl\u00e1 slapkova, b\u0101g
  pa pla\u0161\u016b pasauli i nikur navar aizb\u00e4g\u021b... Redzi, d\u0101ls,
  t\u014ds ir lel\u014d griecin\u012bka b\u0101dys, kod tu zyni: vysu tu sova lapnum\u0101
  esi izp\u016bstiej\u0219, nik\u014d naasi sasniedz\u0219 i nik\u014d nasasniegsi...
  tod t\u00e1v j\u014db\u0101g po\u0161am nu sev\u00e1 i sovys vainis.\\\"\\n\\nSiermga\u013cv\u0219
  aizkl\u014dja ar  obejom r\u016bkom seji  i gryuta s\u014dpeiga n\u016bzapyus\u0161ona  c\u00e4l\u00e4s  nu  j\u014d  kryutim.  Jys  izlyka  sovys  r\u016bkys  iz
  attaiseit\u014ds  gr\u014dmotys  i  skumeig\u0101  bols\u0101  run\u014dja  t\u014d\u013c\u014dk:  \u201eV\u012bns  \u012bt  pa
  pasauli d\u012bnu i nakti i klaus\u014ds, kur griecin\u012bki vaimanoj. Staigoj
  jys pa miene\u0161a apgaism\u014dtim \u0161liud\u016bnim i p\u012bl\u012bc\u0219
  golvu klaus\u014ds, kur iz aug\u0161u \u012bt gryutys n\u016bpyutys kai p\u012bkusu\u0161\u012b
  putyni iz jyurys vi\u013cnim. Jys runoj nakt\u0219 v\u012bntuleib\u0101 i j\u014d
  v\u014drdi slei\u1e11 pa bolt\u016b sn\u012bgu, viej\u0219 t\u016bs pyu\u0161 pa
  \u0161liud\u016b\u0146u \u0161kaut\u0146om: \u201eAs k\u014dp\u0161u, draugs, l\u00e1j\u012b
  pi tev\u00e1 i jim\u0161u tevi iz sovom r\u016bkom i pamozam m\u00e1\u0219 k\u014dpsim
  obi iz aug\u0161u... K\u014dpsim d\u012bnu k\u014dpsim nakti, as aps\u012b\u0161u
  tovys r\u016bkys, kod t\u014ds palik\u0219 a\u0161\u0146ainys nu lads \u0161kaut\u0146om,
  as ar sovu dva\u0161u si\u013cdei\u0161u tovus saskromb\u014dt\u016bs pierstus i
  n\u016bskupstei\u0161u t\u00e1v nu aizsolu\u0161\u014dm acim ladu i osorys. As izdzei\u0161u
  tovus  pag\u014dju\u0161\u016bs  godus  nu  tovys  dzeiveibys  i  nu  jauna  statei\u0161u
  pu\u010deitis, kurys tu sov\u0101 lapnum\u0101 izmeidieji i sk\u016bpst\u00e4sim
  otkon r\u016bku tovai m\u014dmulen\u00e1i, tova s\u012bva tev\u00e1 gaida i st\u014dsta
  sovim b\u0101rnim par tovu at\u012b\u0161onu... As paleidzei\u0161u t\u00e1v, muns
  draugs i br\u014d\u013c, jo as zynu tovys c\u012bs\u0161onys i ma\u0146 tev\u00e1
  \u017e\u0101l!\\\" I jys st\u014dv i gaida, tik slydons lads pleisdams n\u016breib,
  i viej\u0219 svi\u013cpoj ap malnu kolna gol\u016btni. Cylv\u0101ks ir par lapnu,
  lai cyts j\u016b pacaltu, kur jys pat\u0219 pec sovys gribei\u0161onys ir krit\u0219...  I  \u0161ys  v\u012bns  \u012bt  t\u014d\u013c\u014dk,  part\u016b  ka  m\u012bga  napazeist  i  st\u014dv  pi
  krystcelim  maln\u0101  k\u016bku  pakriesl\u012b  i  skot\u014ds  preteim  biegl\u00e1mcelin\u012bkam,
  i jys soka iz biegli-celin\u012bku: \u201eD\u016b\u1e11 ma\u0146 sovu sameideit\u016b
  dv\u00e4seli. As t\u016b m\u012b\u013coju i n\u016bmozg\u014d\u0161u otkon boltu!\\\"
  A celin\u012bks d\u016bd\u0101s s\u014dnim, kai iztrauceits putyns, jys nazyna,
  voi pat\u0219 ir tik k\u016b sacie\u0219 t\u016bs v\u014drdus, voi dzierdiej\u0219:
  \u201eKas mani atr\u016bn, tys mani n\u016bkau\u0219!..\\\" Tai b\u0101g cylv\u0101ks,
  i tys vi\u0146, kam na\u012bt m\u012bgs, tys ver\u0101s nakt\u0219 tymsum\u0101
  i rau\u1e11 par napr\u014dteig\u016b cylv\u0101ku, kurs nagryb i nadreiks\u021b
  atm\u00e1s\u021b n\u016bst sovu b\u0101du i m\u014dnei\u0161on\u014ds jiugu... Tod
  ir t\u014ds mirieja b\u0101dys. Symtim dorbi t\u00e1v ir \u012bs\u014dkti i v\u00e4\u013c
  symti leidumu n\u016bd\u016bm\u014dti... a d\u012bna tik eisa! Vokora kr\u0101sla
  \u012btyn tovus dorbus i \u012btyn tovus n\u016bd\u016bmus, i tu nazyni, kas reit\u0101
  dzei\u0219 t\u014d\u013c\u014dk tovu vogu. Tu apkam\u1e55 draugus i b\u012bdrus,
  i s\u012bva p\u012bzam\u012bdz\u0101s pi tovom kryutim, i tovi b\u0101rni vej\u00e4s
  ap tevi kai apeinei\u0161i. Bet kopu zvons du\u0146 i aicynoj, i t\u00e1v j\u014dsaraun
  tyukst\u016b\u0161 saitis, i j\u014datst\u014dj symti a\u0161\u0146ainus ciertumu,
  i tu pat\u0219 nasapr\u016b\u021b, de\u013ck\u014d tys vyss tai ir. N\u014dv\u00e1
  j\u014dj iz sova pols\u014d zyrga i skot\u014ds t\u014dlum\u0101 par zylyj\u012bm
  me\u017eim. I zam t\u014d pols\u014d  zyrga  pokovim  steigst  dyun\u012b  pu\u010deitis  i  labeibys  st\u012bbrs,  i
  siermga\u013cv\u00e1m sp\u012b\u017e\u0101s iz kryutim solt\u0233\u0219 pokovs,
  i mozi b\u0101rni t\u012b kunks\u021b, i spieceig\u012bs jauneklis v\u00e4\u013c
  kai spiejeib\u0101 sace\u013c iz aug\u0161u dze\u013cz\u012b sakn\u012bbt\u016bs
  kul\u0101kus... I m\u012bdz\u0101s solt\u0233\u0219 pokovs iz vaiga, skaistai s\u012bv\u012bt\u00e1i
  iz boltyj\u014dm kryutim, i sazavalk grumb\u014ds j\u014ds veira ar sv\u012bdrim
  apkl\u014dt\u016b p\u012bri... Bet N\u014dv\u00e1 j\u014dj pa pasauli iz sova pols\u014d
  zyrga i skot\u014ds t\u014dlum\u0101 p\u014dri par zylyj\u012bm me\u017eim. Aiz
  j\u014ds st\u012bp\u0101s nap\u014drr\u00e1dzam\u0101 v\u00e4rtin\u012b s\u014dpis
  i vaidi, i pa  obejom  molom  j\u014ds  \u0161ausmeig\u014d  cel\u00e1  st\u014dv  b\u014dly  cylv\u0101ki,
  nasapras\u0161on\u0101 sp\u012b\u017e s\u00e1v golvu i nazyna, voi tys sapyns, voi
  eistineiba. Nu pols\u014d zyrga n\u014dsim plyust myr\u016b\u0146u smoka, i tam
  pr\u012b\u0161k\u0101 \u0161veiks\u021b izmysuma maln\u0233 sp\u014drni. Tyukst\u016b\u0161ys
  cylv\u0101ku nu bai\u013com p\u014drv\u0101rstim vaigim b\u0101g i skr\u012bn, i
  vaimanoj... Vysi skr\u012bn iz t\u016b po\u0161u pusi, iz zylyj\u012bm me\u017eim
  i vysi jiut, ka k\u014djis drei\u017e vairs naklaus\u00e4s, i solt\u0233\u0219 pokovs
  \u0161n\u00e1ks\u021b aiz v\u012bnam tyv\u014dk i tyv\u014dk aiz j\u016bs mugorys...
  Tai j\u014dj N\u014dv\u00e1 iz sova pols\u014d zyrga jau tyukst\u016b\u0161om godu
  pa pasauli i skot\u014ds p\u014dri par zylyj\u012bm me\u017eim. Symtu myu\u017eu
  kauly balynoj\u0101s pa j\u014ds ce\u013cu, mi\u013cjoni \u013cau\u017eu b\u0101g
  nu j\u014ds... v\u012bnm\u0101r pa t\u016b po\u0161u ce\u013cu, v\u012bnm\u0101r
  par sovu se\u0146\u010du kaulym... I napal\u012bk  j\u012bm  laika pazv\u00e4r\u021b  ni  iz  lob\u016b,
  ni  iz  kair\u016b pusi... T\u012b  st\u014dv myu\u017eeibys kolni, iz kurim N\u014dvis
  pols\u012bs zyrgs nikod nav spier\u0219 sovu pokovu...\\\"\\n\\n\u201eVysa m\u0233su
  dzeiveiba ir kai sapyns...\\\" Siermga\u013cv\u0219 golvu n\u016bk\u014dr\u0219,
  gondrei\u017e vair\u014dk de\u013c sev\u00e1 run\u014dja. \u201eVysa m\u0233su dzeiv\u00e1
  ir ryugt\u012bs jyurys iudin\u0219. Sapyna sus\u0101tiva tu nasa\u010dersi i jyurys
  iudin\u00e1 lasei\u0161u tu navari saskait\u00e4\u021b. N\u014dk vieji, n\u014dk
  saulis sve\u013cm\u00e1. \u0160yupoj\u0101s iudin\u00e1 lasis v\u0101trys sacaltij\u0101
  vi\u013c\u0146u vai\u0146uk\u0101, i brauc tys myglys rot\u016bs par sn\u012bgain\u012bm
  kolnu augstumim. I gulst\u0101s tys t\u012b, kur bezdibe\u0146\u016bs klin\u021bom
  saknis ir, i rit tys sudobrains pa miene\u0161a storu v\u00e4smom, kur laksteigola
  tr\u012bc. Bet myu\u017eam tam j\u014d\u012bt atpaka\u013c par jyurys leimini i
  j\u014dzasyt ap t\u012bm po\u0161im krostim, i j\u014d\u0161\u013c\u014dc tys pa\u021b
  ryugtums pret st\u014dv\u016b\u0161\u014dm klin\u021bom... Klus\u016bs\\n\\n\u201eMyu\u017eeibys  kolni!...\\\"  atsasauc\u00e1  Zemn\u012bka  d\u0101ls,  vyss
  drebeidams.\\n\\nbrei\u017e\u016bs, kod storp divim padebe\u0161im maun i n\u016blai\u017e
  ziege\u013cus, kai p\u012bkusu\u0161a  putyna  sp\u014drnus,  tod  kugin\u012bks  zi\u0146k\u014dreigi  skot\u014ds  jyurys
  naizm\u0101r\u014djam\u0101  bezdiben\u012b. I  r\u00e1\u1e11z  jys, ka t\u012b  nu
  tymsuma  pasaul\u00e1 nasatrycynamys klint\u0219, i kai gl\u012bme\u017ei pi t\u014dm
  stypri p\u012baugu\u0161i a\u0161n\u00e1sorkoni koraly. I jyurys straumis plyust
  garum klin\u021bom, bet t\u014ds lieni aug i cel\u00e4s, lieni, tyukst\u016b\u0161om
  godu. Ka tu vaicoj nu kugin\u012bka, nu kureinis \u0161ei klint\u0219 ir c\u0101lus\u00e4s,
  tod jys d\u016bm\u014ds n\u016bgrim\u0219 t\u00e1v atbi\u013cd\u00e4s: nu myu\u017eeibys...  Da,  draugs:  ir  v\u00e4\u013c  v\u012bns  cyts  pasaul\u0219  aiz  \u0161\u014ds  m\u0233su
  nam\u012breig\u014ds i ryugt\u014ds jyurys; ir v\u012bns myu\u017eeigs pasaul\u0219,
  kura pamati pasl\u0101pti t\u014dli aiz m\u0233su dzeivis jyurys naizm\u0101r\u014djam\u012bm
  bezdibenim. Bet klus\u016bs brei\u017e\u016bs, kod m\u00e1\u0219 storp divejim dabasim
  maunom, tod m\u00e1\u0219 varam n\u016bman\u00e4\u021b, kai st\u012bp\u0101s nasagrau\u017eam\u014ds
  klint\u0219 \u012b\u0161k\u0101 m\u0233su naapm\u012brynojam\u0101  dzeivis  jyur\u0101,  st\u012bp\u0101s  \u012b\u0161k\u0101,  kai  myu\u017eeibys
  naapm\u012bryn\u014dt\u012b  l\u012bcin\u012bki. Kotr\u0101 gl\u012bmez\u012b, kurs
  p\u012baudz\u0219 pi \u0161\u014ds klint\u0219, kotr\u0101 ir pasl\u0101pta d\u014drga
  pierl\u00e1; ikkotrs korals tyn\u0101s pi t\u014ds sov\u0101 a\u0161n\u00e1 sorkonum\u0101.  At\u012b\u0219  \u0157aizi  tys  myu\u017eeig\u012bs  koralu  mekleit\u014djs  i  pier\u013cu
  zvejn\u012bks, v\u00e4r\u0219 breini\u0161keig\u014ds zei\u013c\u014ds bolti-pal\u0101kys
  gaismys pierlis i koralus  kai  a\u0161n\u00e1  l\u012bcin\u012bka  smukumu, v\u00e4r\u0219
  jys  t\u014ds  myu\u017eeibai  par d\u014drgu kokla r\u016btu...\\\"\\n\\nKai  d\u016bm\u014ds  iz  cytureini  aizkleisdams,  siermga\u013cv\u0219  apklusa.
  Pyln\u014d miene\u0161a stori lieni r\u016bt\u014dj\u00e4s ap j\u014d sudobrain\u012bm
  motim.\\n\\n\u201eDa,  d\u0101ls...\\\"  jys  tod  n\u016bzapyusdams  turpyn\u014dja,  \u201ecylv\u0101ki
  napazeist \u0161\u014d \u016btr\u014d pasaul\u00e1... tei ir j\u016bs nalaim\u00e1,
  tys ir j\u016bs p\u016bsts. J\u012b ir aizmiersu\u0161i i n\u016bzama\u013cdieju\u0161i
  nu \u0161\u014d myu\u017eeig\u014d pasaul\u00e1 sl\u012bk\u0161n\u00e1, ir n\u016bgrymu\u0161i  izn\u012bceibys  ryugtij\u016bs  iudi\u0146\u016bs  \u2014  tys  ir  vysa  \u013caunuma
  sakn\u00e1.  I  t\u016bm\u0101r:  ikkotru  breidi  j\u012b  dreiksteitu  kloudzyn\u014d\u021b  pi
  myu\u017eeibys v\u014drtim. Ikkotru breidi j\u012b dreiksteitu t\u012b pras\u00e4\u021b
  pec sovys b\u0101rna t\u012bsys. Dzimtin\u00e1 j\u012bm vysim ir t\u012b. T\u012b
  nav syurd\u012b\u0146u, part\u016b ka vysi ir sova t\u0101va kliep\u012b. T\u012b
  nav griecin\u012bku, part\u016b ka vysi gr\u0101ki n\u016bkreit nu m\u0233su iz
  myu\u017eeibys sl\u012bk\u0161n\u00e1 kai n\u016bvolk\u014dtys dr\u00e4bis. T\u012b
  nav\u0101 n\u014dvis b\u0101du, part\u016b ka myu\u017eeiba izn\u012bceibys napazeist.
  Kas \u0157aizi ir pajiem\u0219 sov\u0101 sird\u012b \u0161\u014ds myu\u017eeibys
  d\u016bmys, tys sova dzeivis vokora gaida kai jauka sapyna: kai k\u014dpurs jys
  atsagul\u0219, kod at\u012b\u0219 nakt\u0219, kai tauryns jys pazam\u016bs\u0219,
  kod zalta sauleit\u00e1 atspeid\u00e4s j\u014d breini\u0161keig\u016bs sp\u014drn\u016bs.\\n\\nZemn\u012bka
  d\u0101ls n\u016bbu\u010d\u014dja siermga\u013cv\u00e1 r\u016bku.\\n\\nSiermga\u013cv\u0219
  n\u016bgl\u014dst\u00e4ja j\u014d golvu.\\n\\n\u201eT\u0101vs, izm\u014dci mani
  \u0161\u014ds myu\u017eeibys d\u016bmys!\\\" jys lyudz\u00e4s, \u201eSyuti mani
  paleig\u0101 munim nalaimeigij\u012bm br\u014dlim!\\\"\\n\\n\u201eIr v\u012bns cyts,
  kurs tevi izm\u014dc\u00e4s myu\u017eeigys d\u016bmys,\\\" jys atteic\u00e1 \u201eb\u0101d\u014ds,
  tryukum\u0101, s\u014d\u1e55\u014ds, i kod sird\u0219 tuk\u0161a teik. Cylv\u0101ks
  cylv\u0101kam \u0161ym\u0101 cel\u00e4 navar paleidz\u00e4\u021b. T\u012b vysim
  j\u014dgaida, j\u014dzailgoj i j\u014dc\u012b\u0161, t\u012b j\u014djiut i j\u014dizbauda
  kotram \u0161\u014ds dzeivis n\u012bceiba i tuk\u0161ums... varb\u0233\u021b t\u016b\u0157aiz
  atsatais\u00e4s v\u012bnam \u016btram aus\u0219 iz myu\u017eeibys dz\u012bs\u1e3fom.\\\"\\n\\n\u201eA
  as? Kur lai as ejmu?\\\"\\n\\n\u201eT\u012b, kur ce\u013c\u0161 i gaida... Niu ar
  lobu nakti, d\u0101ls! T\u00e1 m\u0233sim b\u0233\u0219 obejim v\u012btys gona...\\\"\\n\\nJys
  par\u014dd\u00e4ja iz v\u012bnk\u014dr\u0161om cysom s\u012bnmal\u012b.\\n\\n\u201eDabasu
  pla\u0161ums nav myu\u017eeigs...\\\" jys s\u00e1v teic\u00e1. \u201eVoi pat\u012b\u0161i
  cylv\u0101kam varb\u0233\u021b d\u016bmys, kurys ir pla\u0161\u014dkys par vysim
  bezgaleigij\u012bm dabasim ar t\u016bs zvaig\u017e\u0146u dzierks\u021bom?\\\"\\n\\nJauneklis
  navar\u00e4ja gul\u00e4\u021b. Klusom jys izg\u014dja \u014dr\u0101, apsodl\u014dja
  sovu zyrgu i j\u014dja pa rosain\u016b z\u014dli. Sl\u00e1pn\u012b zori \u0161a\u013c\u021bom
  syt\u014ds j\u014d korstij\u0101 vaig\u0101. Par j\u016b mirdz\u00e4ja zvaig\u017e\u0146u
  bezgaleiba sov\u0101 klusij\u0101 g\u016bdeib\u0101. Zemn\u012bka d\u0101ls d\u016bm\u014dja
  par t\u014dm.\\n\\nMe\u017e\u0101 jys sapyna zyrgu, sakiura guni i atsagula. Caur
  k\u016bku zorim  mirdz\u00e4ja  zvaigznis.  Zemn\u012bka  d\u0101la  d\u016bmys  c\u00e4l\u00e4s  aug\u0161\u014dk  i
  aug\u0161\u014dk, cikom t\u014ds p\u014drzagr\u012bz\u00e1 par sudobra gaismu i
  izgaisa dabasu dzi\u013cum\u0101...\\n\\n* * *\\n\\nReita v\u00e4sma n\u016b\u0161a\u013cc\u00e1
  k\u016bku gol\u016bs. Gryutys, v\u0101sys rosys lasis byra caur k\u016bku lopom
  iz dzaltonij\u014dm sylnom i Zemn\u012bka d\u0101lam sej\u012b.\\n\\nZemn\u012bka
  d\u0101ls pazam\u016bda. \u0160ur  tur  jau  dz\u012bd\u014dja putyni. K\u016bku
  gol\u016bs leig\u014dj\u00e4s gaisma. Zyrgs meikst\u0101 z\u014dl\u012b paied\u0219,
  st\u014dv\u0101dams snaud\u00e1, \u0161od tod pakustyn\u014ddams pal\u0101k\u016b
  lyupu.\\n\\n\u201eKaidu  as  breineigu  sapynu  redzieju!\\\"  Zemn\u012bka  d\u0101ls
  staipeidam\u012bs  d\u016bm\u014dja.  \u201eKaidys  breineigys  vol\u016bdys  as  sapyn\u0101
  dzierdieju.  Itei  dzeiv\u00e1  naas\u016bt  dzeiv\u00e1,  a  sapyns.  It\u016b  k\u016bku  as  tik
  sapyn\u0101 radzu. I ka k\u016bka zors ma\u0146 \u012bsyta par vaigu, to tys as\u016bt
  tik sapyns? Kod pavasar\u012b speid\u016b\u0161\u012b leme\u0161i g\u014d\u017e
  apleik p\u012bmierku\u0161\u016b val\u0101nu, tod tys vyss tik sapyns... K\u016b
  cylv\u0101ks c\u012b\u0161, par k\u016b jys leidz n\u014dv\u00e1i skumst, tys vyss
  tik sapyns...\\\"\\n\\n\u201eN\u0101,\\\" jys caldam\u012bs sac\u00e4 \u201ekai
  lai as s\u00e1v t\u016b \u012bst\u014dstu, ka as pat\u0219 asmu sapyns? I ka vyss
  b\u0233tu tik sapynu m\u016bkom, kurys ma\u0146 paka\u013c staigoj, kai sus\u0101tivs
  saulis d\u012bn\u0101?\\\"\\n\\nJys dag\u014dja pi sova zyrga, kurs pazam\u016bd\u012bs
  pagr\u012bz\u00e1 pret j\u016b golvu i soka bubin\u00e4\u021b.\\n\\n\u201eNik\u014d,
  siermei\u021b...\\\" jys sac\u00e4, zyrga koklu m\u012bleigi gl\u014dsteidams, \u201epam\u00e1ssim
  sapynus sapynu laikim i j\u014dsim t\u014d\u013c\u014dk!\\\"\\n\\nOtkon Zemn\u012bka
  d\u0101ls j\u014dja v\u012bnu godu. Jys \u012bj\u014dja v\u012bn\u0101 breini\u0161keig\u0101
  v\u012bt\u0101.\\n\\nPa  lobai   r\u016bkai  jys  r\u00e1dz\u00e4ja  tuksnesi.  Korst\u012bs  viej\u0219  gau\u017ei
  putyn\u014dja p\u014dri k\u014dpu dzaltonom ryndom pal\u0101k\u014ds smi\u013ckt\u0219,
  sakorsu\u0161yj\u0101 gais\u0101 tric\u00e4ja  t\u014dlum\u0101 bryun\u014ds klint\u0219.
  N\u016bguru\u0161\u016b kamie\u013cu (\u017evirb\u013cu) rynda  s\u016b\u013c\u014dja
  pa  pu\u0219aizputyn\u014dt\u016b stygu,  beduinu  bolt\u0233  mieteli  to pazac\u00e4l\u00e1,  to  gryma  nav\u012bnaid\u0101  vieja  pyus\u0161on\u0101.  Pa  kairai  r\u016bkai
  Zemn\u012bka d\u0101ls r\u00e1dz\u00e4ja zylu iudini, pa kuru pe\u013cd\u00e4ja
  mi\u013czeigi lads goboly, pa t\u012bm k\u014dpel\u00e4ja bolt\u0233 l\u014d\u010di
  i sauleit\u012b si\u013cd\u00e4j\u00e4s r\u016bni, ar sovom opolyj\u014dm  acim  sapnaini  skateidam\u012bs  t\u014dlum\u0101,  kur  va\u013cziv\u0219  pyut\u00e1
  iudini iz aug\u0161u. Par iudini i ladim skraid\u00e4ja nasaskaitami jyurys putyni,
  garim kai  n\u012bdris lopa sp\u014drnim, gon gai\u0161i leig\u014ddam\u012bs pa
  skaidr\u016b  gaisu,  gon  izgaisdami,  gon  otkon  pazar\u014ddeidami  zyl\u0101
  t\u014dlum\u0101 kai vieja dzeit\u012b sn\u012bga putekli. Storp jyuru i tuksnesi
  Zemn\u012bka d\u0101lam beja cel\u00e4 nar\u00e1dz\u0101ts me\u017e\u0161. Tys \u012bzas\u014dk\u014ds
  tivlei\u021b pec apaugu\u0161\u014ds iz jyurys krosta ar kryumim tundrys, pa kur\u014ds
  kryumim l\u016b\u017e\u0146\u014dja z\u012bme\u013cu lopsa i pa pu\u0219atkusu\u0161\u012bm
  ezerenim pe\u013cd\u00e4ja mi\u013czeigi putynu bori. Pr\u012b\u017eu me\u017e\u0161
  ar v\u012bnu palyka lel\u014dks i lel\u014dks, kura opol\u0233, zylgon\u012b skuju
  vai\u0146uki tai sovaidi \u0161\u0146\u014dc\u00e1. Pa klusi n\u016bskumu\u0161u
  \u00e1g\u013cu zorim l\u0101kal\u00e4ja sorkon\u014ds v\u014dvereitis. T\u014d\u013c\u014dk
  beja n\u016bst\u014dju\u0161i tik k\u016b izmozg\u014dti b\u0101rzi, izk\u014dru\u0161i
  ka\u013ct\u00e4\u021b sovus smolk\u016bs zare\u0146us. Pi t\u012bm kl\u014dtu dreb\u00e4ja
  myu\u017eeigi n\u016bzabeidus\u00e1 aps\u00e1 i \u0161veikst\u00e4ja meikst\u014ds
  dzeivis mekl\u0101t\u014dja l\u012bpa. T\u014d\u013c\u014dk v\u00e4r\u00e4s brein\u014ddam\u012bs
  iz sovom styprijom r\u016bkom tyukst\u016b\u0161u godu vac\u012bs \u016bzuls i nasapras\u0161on\u0101
  puryn\u014dja sovu vac\u016b golvu part\u016b, ka spu\u017elopainam lauram ir tik
  dau\u1e11z k\u014d klaus\u00e4t\u012bs kauneigij\u0101 mirtis \u0161veikstei\u0161on\u0101.
  I caur mirtis smolk\u014dm lape\u0146om speid\u00e4ja d\u012bnvydu saul\u012b citroni,
  oran\u017ei i aprikosi, v\u00e4\u013c t\u014d\u013c\u014dk \u010daukst\u00e4ja i
  brak\u0161\u00e4ja Indejis n\u012bdris  zam  elefanta  gryutij\u012bm  s\u016blim,  cikom  tur  \u0161ur  paspeid\u00e4ja
  iztrauceit\u014d t\u012bgera raib\u012b s\u014dni. Po\u0161a tuksne\u0161a mol\u0101
  c\u00e4l\u00e4s zyl\u0101 gais\u0101 ploti  pa\u013cmu  lopu  vai\u0146uki  i  skat\u00e4j\u00e4s  p\u014dri  par  putyn\u014dt\u014dm  viej\u012b
  smi\u013cktim. T\u012b aiz me\u017ea kai pasaul\u00e1 r\u016bbe\u017ea r\u014dd\u00e4j\u00e4s
  lela kolnu ail\u00e1, kurys  sn\u012bgain\u012b  goly  st\u012bp\u00e4s  po\u0161\u016bs  padebe\u0161\u016bs...  Tik  v\u012bns  kolns
  pazac\u00e4l\u00e4s aug\u0161\u014dk par \u0161\u012bm vysim i v\u012bntu\u013c\u0161
  ierglis lid\u014dja ap t\u016b...\\n\\nIlgi  beja  j\u014dmeklej  Zemn\u012bka  d\u0101lam,  cikom  jys  atroda  moz
  \u012bmeideitu stidzeni. Zyls mikrieslis apj\u00e4m\u00e1 j\u016b. Kai sapyn\u0101
  jys skat\u00e4j\u00e4s iz  nasaraustamim  v\u012btenim,  kuri  tyn\u014ds  leidz  k\u016bka  golam,  a\u0161n\u00e1sorkonus  z\u012bdus  iz  l\u00e1ji  n\u016bk\u014dru\u0161i.  N\u016bb\u012bdeitys  styrnys  l\u00e4c\u00e1  par
  nasaskaitamim  pu\u010du  kryumim,  i  satrauceiti  mierka\u010di  izlaisdami eisus
  kl\u012bdz\u012b\u0146us \u014dtri sl\u00e4p\u00e4s k\u016bku viersyu\u0146\u014ds,
  nu kureinis zi\u0146k\u014dreigi v\u00e4r\u00e4s  iz  j\u014djieju.  Nazkur  b\u012bzum\u0101  atskan\u00e4ja  br\u012bsmeiga  ryuk\u0161ona,
  ocumirkl\u012b  vyss  me\u017e\u0161  palyka  kai  izmir\u0219.  Zemn\u012bka  d\u0101la  zyrgs
  n\u016bdreb\u00e4ja kai apsis lopa.\\n\\nBeidz\u016bt teirumi, d\u014drzs i po\u0161\u0101
  vyd\u0101 m\u014dja ar kiup\u016b\u0161u \u0161k\u016brstynu. M\u014drk\u016bs peld\u00e4ja
  vysvysaidi gon pazeistami, gon napazeistami iudin\u00e1 putyni i storp akminim pa
  krosta molu saud\u00e4j\u00e4s zivtenis.\\n\\nBrein\u014ddam\u012bs, Zemn\u012bka
  d\u0101ls izstaig\u014dja vysu m\u014dji. V\u012bn\u0101 v\u012bt\u0101 vysa s\u012bna
  beja  n\u016bsprausta  ar  taurynim, cyt\u0101  v\u012bt\u0101  beja  butelis pylnys
  spirta, spirt\u0101 vysvysaidi kust\u016bni i kukaini. Otkon cyt\u016bs vysaid\u016bs
  trauk\u016bs  vyra  \u0161aidi-taidi  \u0161keistumi  i  tvaiks  prog\u014dj\u0219  stykla  tr\u016bb\u014ds
  otkon palyka par iudini, par zylu, za\u013cu, sorkonu... Cylv\u0101ka t\u012b nabeja
  niv\u012bna. Jys \u012bg\u014dja d\u014drz\u0101. Ilgi jys mekl\u00e4ja storp breineigij\u012bm
  pu\u010du kryumim, cikom d\u014drza mol\u0101 \u012braudz\u00e4ja cylv\u0101ku.
  Tys beja pu\u0219myu\u017ea veir\u012bt\u0219 ar bri\u013c\u013com iz acim. Jys
  beja atsagul\u0219 iz v\u0101dara z\u014dl\u012b i caur opolu styklu v\u00e4r\u00e4s
  iz mozu kukaineiti.\\n\\n\u201eD\u012bvs paleidz!\\\" Zemn\u012bka d\u0101ls sac\u00e4,
  \u201evoi natrauceju?\\\"\\n\\nPu\u0219myu\u017ea veirs druscei\u021b pasmeign\u00e4ja.\\n\\n\u201eNu,\\\"
  jys teic\u00e1 \u201epi it\u014d dorba lobs palelynoj\u016b\u0161s styklys ma\u0146
  vair\u014dk paleidz kai tovs D\u012bvs. Voi tu nu t\u014d siermga\u013cv\u00e1 atg\u014dji?\\\"\\n\\n\u201eDa!\\\"\\n\\n\u201eJys
  t\u00e1v grib\u00e4ja \u012bst\u014dst\u00e4\u021b, ka itei dzeiv\u00e1 nimoz nav
  dzeiv\u00e1?\\\"\\n\\n\u201eDa!\\\"\\n\\n\u201eNaboga veceit\u0219! Jys v\u00e4\u013c
  nu aizpag\u014dju\u0161a godu simten\u00e1. As \u0157aizi j\u016b aicyn\u014dju,
  sok, lai at\u012bt \u2014 ma\u0146 vysaidi instrumenti, lai iztaisa ma\u0146 kaidu
  eksperimentu nu sova \u016btra pasaul\u00e1. Bet naatg\u014d!\\\"\\n\\n\u201eVoi
  jiu\u0219 ar sovim instrumentim varit daudzi r\u00e1dz\u00e4\u021b?\\\" Zemn\u012bka
  d\u0101ls nadr\u016bsi pavaic\u014dja.\\n\\n\u201eVair\u014dk kai cyti!\\\"\\n\\n\u201eVoi
  jiu\u0219 l\u012btom \u016btru pusi varot r\u00e1dz\u00e4\u021b?\\\"\\n\\n\u201eI
  po\u0161u sirdi, na tik \u016btru pusi.\\\"\\n\\n\u201eTo jiu\u0219 zynot, de\u013ck\u014d
  pasaul\u012b tik dau\u1e11z nalaimis?\\\"\\n\\nPu\u0219myu\u017ea cylv\u0101ks pac\u00e4l\u00e1
  iz j\u016b sovys bri\u013c\u013cain\u014ds ac\u0219.\\n\\n\u201eVoi ta tys nav v\u012bna
  olga?\\\"\\n\\n\u201ePasaul\u012b?\\\" Tu gribieji sac\u00e4\u021b: de\u013ck\u014d
  storp cylv\u0101kim tik dau\u1e11z nalai\u1e3fu.\\n\\nPu\u0219myu\u017ea veir\u012bt\u0219
  otkon druscei\u021b pasmeign\u00e4ja.\\n\\n\u201eMyu\u017eam tei po\u0161a vac\u014d
  p\u014dsoka: ka s\u014dp cylv\u0101kam z\u016bbi, to t\u012b s\u014dp vysai radeibai.
  Voi tu zyni, cik cylv\u0101ku ir pavysam pasaul\u012b?\\\"\\n\\n\u201e\u0160kol\u0101
  st\u014dst\u00e4ja...\\\"\\n\\n\u201eA voi tu zyni, ka \u0161ym\u0101 iudin\u00e1
  gl\u014dz\u012b ir vair\u014dk kust\u016b\u0146u kai vys\u0101 pasaul\u012b cylv\u0101ku?\\\"\\n\\nZemn\u012bka
  d\u0101ls izpl\u00e4t\u00e1 ac\u0219.\\n\\nA cik taurinte\u0146u, cik t\u014drpe\u0146u,
  cik zivte\u0146u, cik putine\u0146u gais\u0101!.. Tu navari s\u016bl\u00e1 pasp\u00e1r\u021b,
  pa\u021b t\u012b tym\u0101 tuk\u0161ij\u0101 t\u016bksni, ka naredzeisi tyukst\u016b\u0161u
  dzeiveibys, sapr\u016btams, ka t\u00e1v de\u013c it\u014d b\u0233\u0219 ac\u0219.
  Vysi it\u012b naizskaitami kust\u016bnei\u0161i i dzeivin\u012bceni dzeivoj ikkotrs
  sovu dzeivi, pr\u012bcoj\u0101s, dusmoj\u0101s, m\u012b\u013coj, vairoj\u0101s...
  Lai cylv\u0101ks b\u0233tu vyss pasaul\u0219! Da, kas to ir tovs pasaul\u0219?\\\"
  Iz m\u0233su z\u00e1mis cylv\u0101ks ir tik n\u012bceiga dal\u00e1 nu vysys radeibys.
  A kas ir m\u0233su z\u00e1m\u00e1 pret vysu bezgaleibu? Vier\u012bs nakt\u012b iz
  nasaskaitamu zvaig\u017e\u0146u daudzumu... Tu d\u016bmoj, ka t\u012b nazyn kaidys
  dzierksteitis sab\u0101gu\u0161ys dabas\u016bs nu cylv\u0101ku gunkurim? T\u014ds
  vysys, draugs, ir pasauli, lel\u014dki, stypr\u014dki, kai \u0161ys puteklis, k\u016b
  m\u00e1\u0219 par  z\u00e1mi  saucom.  Tu  grybi  lai  cylv\u0101ka  nalaim\u00e1  ir  vysys  \u0161\u014ds
  bezgaleibys nalaim\u00e1! N\u0101, draugs, \u0161ei bezgaleiba ir past\u014dviejus\u00e1
  jau myu\u017eeibys godus, pyrms t\u014d kai beja atsateistiej\u0219 cylv\u0101ks.
  I tei v\u00e4\u013c myu\u017eeibys past\u014dv\u00e4s, kod jau beidzam\u012bs cylv\u0101ks
  b\u0233\u0219 n\u016bgrim\u0219 soltyj\u016bs lads kop\u016bs. Par v\u012bnu putekli
  vair\u014dk voi moz\u014dk, nu t\u014d pasaul\u00e1 gaita nazamain\u014ds.\\\"\\n\\n\u201eVer\u012bs!\\\"
  pu\u0219myu\u017ea veirs turpyn\u014dja, \u201et\u00e1, \u0161ym\u0101 iudin\u00e1
  laseit\u012b pi muna  piersta,  ir  vair\u014dk  kust\u016b\u0146u,  kai  vyslel\u014dk\u0101  pasaul\u00e1  pi\u013cs\u0101t\u0101
  cylv\u0101ku. Iz kotrys laseitis, iz kotrys lapenis dzeivoj, tai sok\u016bt, vasals
  pasaul\u0219.\\n\\n\u201eI  vys\u0101 \u0161ym\u0101  bezgaleig\u0101 dob\u0101
  tak  volda n\u014dv\u00e1  i  nalaim\u00e1...\\\" Zemn\u012bka d\u0101ls \u012bzadr\u016bsyn\u014dj\u00e4s
  sac\u00e4\u021b.\\n\\n\u201eN\u014dv\u00e1 i nalaim\u00e1 \u2014 otkon tei po\u0161a
  vac\u014d dz\u012bsm\u00e1!\\\" atsasauc\u00e1 pu\u0219myu\u017ea veirs. \u201eVoi
  ta n\u014dv\u00e1 kaida nalaim\u00e1! Voi redzi \u0161\u016b moz\u016b myuseni,  kura  tik  jautri,  tik  m\u012bleigi  sp\u012bdz  sovu  m\u012blesteibys\\n\\ndz\u012bsmeni?
  Tik \u0161\u016breit tei ir dzymus\u00e1 i saul\u00e1 nab\u0233\u0219 v\u00e4\u013c
  r\u012btiejus\u00e1, kai tei n\u016bmier\u0219. Voi t\u014d pec tei nalaimeiga?
  N\u0101, draugs, tei taipa\u021b bauda sovu dzeivis  laimi,  taipa\u021b  v\u012bnoj\u0101s  kaisleib\u0101  ar  sovu  izr\u00e1dz\u0101t\u016b,  taipa\u021b
  pr\u012bcoj\u0101s, kod izad\u00e1v\u00e4s kur atras\u021b lobu v\u012btu de\u013c
  \u016blys, de\u013c sovys cilt\u0219 pavair\u014d\u0161onys. De\u013ck\u014d lai
  tei namiertu vokor\u0101 kod sauleit\u00e1 r\u012b\u021b? Sovus p\u012bn\u014dkumus  tei  ir  padariejus\u00e1,  sovu  dzeivi  ir  izbaudiejus\u00e1...  lai
  snau\u017e, lai du\u0219! Da, tod b\u0233tu nalaim\u00e1, ka tei \u016btr\u0101
  reit\u0101 atsam\u016bst\u016bs. I k\u014d lai tei m\u016bst\u0101s? M\u012blesteiba
  vairs nab\u0233\u0219 j\u014ds sird\u012b, p\u012bn\u014dkumu tai vairs nav, sp\u0101ka
  nav... Bez n\u016blyuka, bez vajdzeibys tei lai skraida nu v\u012bnys lapenis iz
  \u016btru. N\u0101, draugs, n\u014dv\u00e1 nav nalaim\u00e1, kod esi dariej\u0219
  sovu dorbu. Nalaim\u00e1 ir dzeiv\u014d\u021b bez dzeivis mierk\u00e1...\\\"\\n\\nZemn\u012bka
  d\u0101lam s\u014dka golv\u0101 vyss \u012b\u021b juku-jukom.\\n\\nPu\u0219myu\u017ea
  cylv\u0101ks savylka uzac\u0219.\\n\\n\u201eA cylv\u0101ks tak sajiut n\u014dvi
  kai nalaimi!\\\" jys sac\u00e4, \u201ei pr\u014dts t\u014d navar p\u014drgr\u016bz\u00e4\u021b.\\\"\\n\\n\u201eCylv\u0101ks...\\\"
  jys teic\u00e1, \u201etys, zynoms, myu\u017eam b\u0233\u0219 nalai\u1e3f\u014ds.\\\"\\n\\n\u201eK\u014d
  de\u013c?\\\"\\n\\n\u201eT\u014d de\u013c ka jys atsak\u014dp\u00e1 nu dobys. Dob\u0101
  nalaimis nav. T\u012b tik myu\u017eeiga dzeivis k\u014dreiba i myu\u017eeiga dzeivis
  p\u014drgr\u016bzei\u0161ona.\\n\\n\u201eNu po\u0161a moz\u014d kust\u016bnei\u0161a
  leidz elefantam i va\u013cziv\u0219 mi\u013czen\u00e1m \u2014 vysur tei po\u0161a
  dobys teik\u0161ona \u2014 dzeiv\u014d\u021b i dzeiveibu vair\u014d\u021b. Vysa
  doba pec t\u014d tik dzan\u0101s. Nu pyrm\u014d ocumirkl\u00e1 ikkotrs radiejums
  klaus\u014ds  tik  sova  dzeivis  devieja,  dora  sovu  nu  dobys  izlykt\u016b
  p\u012bn\u014dkumu.  Kod  jys  ir  padariej\u0219  sovu  dorbu,  jys  izgaist  tikpa\u021b
  m\u012breigi, d\u016bdams v\u012btu sovim pecn\u014dciejim.\\n\\nTik cylv\u0101ks
  g\u014dja i sac\u00e4: n\u0101, as naklausei\u0161u \u0161\u014d dobys lykuma; mani
  voda v\u00e4\u013c v\u012bns cyts sp\u0101ks, k\u014d dob\u0101 par ve\u013cti mekl\u00e4\u021b...
  Sac\u00e4l\u00e1 cylv\u0101ks sovam cel\u00e1m vysapleik osus ier\u0161kei\u017eus
  i pat\u0219 a\u0161\u0146\u014ddams plie\u0161\u0101s caur t\u012bm cauri. Runoj
  jys par t\u016b sovu sovaid\u016b augst\u016b sp\u0101ku, kas v\u012bns ir i t\u016bm\u0101r
  tri\u00e7, kod at\u012bt tei stu\u0146d\u00e1, kod j\u014dp\u014drzagr\u012b\u017e\u0101s
  i jam. Dob\u0101  na\u012bt  gais\u0161on\u0101  niv\u012bns  sp\u0101ks.  Bet  cylv\u0101ks  t\u016bm\u0101r
  naatsadr\u016bsynoj\u0101s tic\u00e4\u021b, ka j\u014d sevi\u0161k\u012bs sp\u0101ks
  b\u0233\u0219 myu\u017eeigi. Ver\u012bs, \u0161ym\u0101  atkris\u0161on\u0101  nu  dobys  ir  cylv\u0101ka  nalaim\u00e1  i  l\u014dsts.  Pr\u012bcoj\u012bs,
  str\u014ddoj, m\u012b\u013coj, v\u014drgsti... i miersti, kod esi vysu izdariej\u0219.
  Tys ir dobys ce\u013c\u0161. Iz t\u016b jei aicynoj cylv\u0101ku. I cylv\u0101ks
  naatras\u0219 m\u012bra, cikom nab\u0233\u0219 atsagr\u012bz\u0219 pi dobys... voi
  kai puteklis i palni, voi kai radiejums, kurs gryb b\u0233\u021b tik mozs l\u016bceklis
  bezgaleigij\u014ds dzeiveibys m\u014dj\u014ds...\\\"\\n\\n\u201eN\u014dv\u00e1!\\\"\\n\\n\u201eKas
  atsvabyn\u014d\u0219 t\u016bs cylv\u0101kus nu \u0161\u014d \u016btr\u014d lykuma
  kuri t\u016b jau jiut sov\u0101 sirdi?\\\"\\n\\n\u201eI kai as var\u0101tu paleidz\u00e4\u021b
  pi \u0161\u014d atsvabyn\u014d\u0161onys dorba?\\\"\\n\\n\u201eMiersti!\\\"\\n\\nPu\u0219myu\u017ea  veir\u012bt\u0219  otkon  n\u016bzal\u012bc\u00e1  z\u014dl\u012b  i  v\u00e4r\u00e4s  iz  moz\u016b
  kukaineiti.\\n\\nMe\u017ea mol\u0101 Zemn\u012bka d\u0101ls n\u016bst\u014dja. Jys
  pazav\u00e4r\u00e1 iz tuksnesi, pazav\u00e4r\u00e1 iz jyuru i p\u012blyka p\u012br\u00e1i
  kl\u014dt r\u016bku.\\n\\n\u201eAtpaka\u013c pi dobys... atpaka\u013c pi dobys...\\\"
  jys run\u014dja pat\u0219 sev\u012b. \u201eM\u00e1\u0219 t\u014d vairs navar\u016bt.
  I t\u016bm\u0101r... N\u0101, siermei\u021b, j\u014dsim t\u014d\u013c\u014dk.\\\"\\n\\n*
  * *\\n\\nI otkon j\u014dja Zemn\u012bka d\u0101ls v\u012bnu godu. Beidz\u016bt jys
  \u012bj\u014dja lel\u0101, lel\u0101 pi\u013cs\u0101t\u0101. \u016astys mol\u0101
  jys r\u00e1dz\u00e4ja nasaskaitamys kugu ma\u010dtys. \u016atr\u0101 pi\u013cs\u0101tys
  pus\u012b beja n\u016bryugu\u0161i fabriku \u0161k\u016brstyni. A pa vydu rip\u014dja
  roti ar gumejis ritinim i lelyj\u016bs magazinu l\u016bg\u016bs mirdz\u00e4ja zalts,
  sudobrs i d\u014drgi audumi.\\n\\nZemn\u012bka d\u0101ls r\u00e1dz\u00e4ja daudzi
  n\u016bkv\u0101pu\u0161u i n\u016bputieju\u0161u cylv\u0101ku seju. Vysi zyl\u014ds
  i pal\u0101k\u014ds dorba bl\u016b\u017e\u014ds, s\u012bv\u012btis ar lelu lokotu
  ap izdylu\u0161\u012bm placim. Vysim j\u012bm beja sorkonys pu\u010dis pi kryutim,
  vysi j\u012b g\u014dja dryumim vaigim iz v\u012bnu pusi.\\n\\nZemn\u012bka d\u0101ls
  pagr\u012bz\u00e1 sovu siermeiti iz t\u016b po\u0161u pusi.\\n\\nIz lela laukuma
  sazapu\u013cc\u00e4j\u00e4s \u0161\u012b dorba \u013caud\u0219 nu vysom pu\u0219om
  \u012bdami, nu \u016bstys, nu fabrikom. Vysi v\u00e4r\u00e4s iz v\u012bnu v\u012btu
  i gaid\u00e4ja.\\n\\nI tod izk\u014dp\u00e1 iz  die\u013cu paaugstyn\u014djuma jauns  cylv\u0101ks  i  s\u014dka
  run\u014d\u021b.  Jys  run\u014dja  par  dorbu  i  dorba  cylv\u0101kim,  par  bodu  i  par
  bagateibu.  Dryum\u012b  veir\u012b\u0161i  n\u016bp\u012btni  pagr\u016bz\u00e4ja  ar  golvom,  s\u012bv\u012b\u0161u
  izdzysu\u0161ij\u014ds ac\u012bs pazar\u014dd\u00e4j\u00e4s sovaida gun\u0219.\\n\\n\u201eM\u00e1\u0219
  zynom, kur meklejama cylv\u0101ku nalaimis sakn\u00e1...\\\" jys teic\u00e1. \u201eM\u00e1\u0219
  asom atminieju\u0161i \u0161\u016b na\u017eieleig\u016b meikli, kur\u014d tyukst\u016b\u0161im
  godu  cylv\u0101kus  v\u014drdzyn\u014dja.  T\u014d  de\u013c  iz  pr\u012b\u0161ku  br\u014dli  i  m\u014dsys!
  Atsvabyn\u014dsim t\u016bs, kas c\u012b\u0161, nu j\u016bs nalaimis!\\\"\\n\\nZemn\u012bka
  d\u0101ls nasaprota, k\u016b jauneklis run\u014dja. Tik  da\u017ei v\u014drdi \u012bg\u014dja
  j\u014d pr\u014dt\u0101.\\n\\nAr gavi\u013com i dz\u012bs\u1e3fom pavad\u00e4ja
  veir\u012b\u0161i i s\u012bv\u012btis \u0161\u016b jaunekli iz m\u014djom. A Zemn\u012bka
  d\u0101ls palyka pi v\u014drtim st\u014dv\u016bt.\\n\\nSve\u0161\u012bs jauneklis
  s\u00e4d\u00e4ja iz kr\u0101sla pi v\u012bnk\u014dr\u0161\u014d rokstam\u014d golda.\\n\\nV\u0101l\u0101
  vokor\u0101 jys p\u012bzadauz\u00e4ja pi sve\u0161\u014d jaunekl\u00e1 durovom.
  \u201eT\u00e1 voi nikur!\\\" sird\u0219 jam run\u014dja \u201eVarb\u0233\u021b,
  t\u00e1 beja pat\u012bseiba!\\\"\\n\\nZal\u00e1 lampys kupola sus\u0101tivs kryta
  pa dal\u00e1i iz gr\u014dmotom i iz jaunekl\u00e1 smuk\u016b vaigu. Jys pac\u00e4l\u00e1
  sovys dedzeig\u014ds ac\u0219 iz \u012bg\u014djieju.\\n\\n\u201eAs nasaprotu \u0161udi\u0146
  tev\u00e1...\\\" Zemn\u012bka d\u0101ls teic\u00e1 \u201ei as g\u014dju pi tev\u00e1
  pec pad\u016bma.\\\"\\n\\nJauneklis pas\u0101dyn\u014dja j\u016b i aizd\u016bmeigi
  n\u016bzav\u00e4r\u00e1 iz j\u014d apjuku\u0161\u016b seji, gaideidams, cikom gosts
  \u012bs\u014dk\u0219 run\u014d\u021b.\\n\\n\u201eAs ilgi meklieju taisneibys...\\\"
  Zemn\u012bka d\u0101ls sac\u00e4, \u201ei naasmu atrad\u0219. Kur ir cylv\u0101ka
  nalaimis sakn\u00e1?\\\"\\n\\n\u201eKur tu meklieji atbi\u013cdis?\\\" vaic\u014dja
  jauneklis.\\n\\nZemn\u012bka d\u0101ls izst\u014dst\u00e4ja, kur beja i k\u016b
  dzierd\u00e4ja.\\n\\n\u201eJ\u012b obi mold\u014ds!\\\" jauneklis teic\u00e1, \u201ekai
  tys siermga\u013cv\u0219, tai i tys pu\u0219myu\u017ea veir\u012bt\u0219. Na de\u013ct\u014d
  cylv\u0101ks nalaimeigs, ka jys nu D\u012bva ir atsast\u014dj\u0219 i na de\u013ct\u014d,
  ka jys atsak\u014dp\u00e1 nu dobys, a de\u013ct\u014d, ka cylv\u0101ks atsagr\u012bz\u00e1
  nu cylv\u0101ka. V\u012bni ver\u0101s iz padebe\u0161im: t\u012b aug\u0161\u0101
  as\u016bt eist\u014d dzeiv\u00e1. Tys tik sapyns, maldei\u0161on\u014ds i p\u016bsts.
  I j\u012b atsagr\u012bz\u00e1 nu \u0161\u014ds dzeivis i nu t\u014d cylv\u0101ka,
  k\u016b dze\u013c\u017ea va\u017eys ir saistieju\u0161ys pi \u0161\u014ds po\u0161ys
  dzeivis. I \u016btri naatzeist cylv\u0101k\u0101 nik\u014d cylv\u0101ciska, nik\u014d
  kas j\u016b pacaltu par dobu i prosa, lai vysur otkon va\u013cdeitu tik dobys lykums.
  Da, jauks jau ir \u0161ys lykums de\u013c t\u012bm, kuri spieceigi, veikly i kam
  osi z\u016bbi: cik t\u00e1v sp\u0101ka voi vi\u013cteibys, tik t\u00e1v t\u012bseibys
  iz dzeivi. A ka t\u00e1v sird\u0219 s\u014dp par tovim moz\u014dkij\u012bm br\u014dlim,
  ka tu d\u016bmoj, ka varb\u0233\u021b nu j\u016bs b\u0101rnim i b\u0101rnu b\u0101rnim
  \u0157aiz p\u012bdzim\u0219 veiri, kuri vysai ci\u013cviec\u00e1i dzeivi v\u012bgl\u014dku
  padar\u00e4s  i  ka  t\u00e1v  sird\u0219  a\u0161\u0146oj\u0101s  de\u013c  t\u012bm,  kurim  j\u014dgaist  pakriesl\u012b,
  nar\u00e1dz\u0101tim nu saulis, jau pyrms j\u012b \u2014 ka Jonatans \u2014 \u201ebaudieju\u0161i
  makeneit mads...\\\" tod miersti k\u016bp\u0101 ar j\u012bm, part\u016b ka j\u012bm
  nav ticeibys iz dzeivi. Voi na tai skan\u00e4ja t\u014ds nagr\u016bzam\u014ds dobys
  lykums? N\u0101, draugs, m\u00e1\u0219 asom dzymu\u0161i \u0161ym\u0101 pasaul\u012b,
  to laikam i m\u0233sim t\u00e1 kaids uzdavums b\u0233\u0219. De\u013ct\u014d pagr\u012bz
  ac\u0219 nu dabasim i ver\u012bs iz leidumu i pla\u0161umu tov\u0101 pr\u012b\u0161k\u0101!
  M\u0233su pr\u014dts m\u0233sus at\u0161kier\u0219 nu napr\u014dteigys dobys. De\u013ct\u014d
  laikam tys cylv\u0101kam d\u016bts, lai caur t\u016b cylv\u0101ks b\u0233tu ci\u013cvieceigs.  St\u014dj\u012bs  otkon  pi  dorba  \u0161ym\u0101  pasaul\u012b,  savoldi  sovys
  k\u014dreibys i egoismu, \u012bk\u014drtoj sovu i leidzcylv\u0101ku dzeivi pec cylv\u0101ku
  pr\u014dta  lykumim...  i  izgais\u0219  nataisneiba  i  varm\u014dceiba,  izgais\u0219
  nabadzeiba i p\u016bsts, palik\u0219 otkon s\u014drti tovu n\u016bv\u014drdzyn\u014dt\u016b
  b\u0101rnu vaigi i ar t\u016b pat\u0219 sajussi, ka naasi l\u012bks i nadereigs
  \u0161ym\u0101 pasaul\u012b, ka i tu esi \u2014 draugs voi moz str\u014dd\u014dj\u0219
  pi ci\u013cviecis kulturys dorba. I ka tod pec aug\u013cu pylna vokora t\u00e1v
  at\u012b\u0219 dzeivis rudin\u0219, tu t\u016bm\u0101r bez bai\u013com vareisi v\u00e4rt\u012bs
  myu\u017eeigam m\u012bram preteim: tovs augums, tova m\u012bsa iznik\u0219, a tovs
  dorbs palik\u0219 i tovi b\u0101rni t\u016b str\u014dd\u014d\u0219 t\u014d\u013c\u014dk.\\n\\n\u201eI
  voi drei\u017e at\u012b\u0219 \u0161\u012b ci\u013cviecis zalta laiki?\\\" Zemn\u012bka
  d\u0101ls, elpu aiztur\u0101dams, vaic\u014dja.\\n\\nJauneklis ryugti pasmeign\u00e4ja.\\n\\n\u201ePa
  pr\u012b\u0161ku j\u014dn\u016bmierst t\u012b tam siermga\u013cv\u00e1m. Tod j\u014dmierst
  tam, kas tik  dobys lykumu gryb klaus\u00e4\u021b. J\u014dpal\u012bk vysim cylv\u0101kim
  tik\u021b nalaimeigim, ka j\u012b niv\u012bns vairs navar\u00e4s pat\u0219 s\u00e1v
  paleidz\u00e4\u021b. Tod b\u0233\u0219 cylv\u0101kam lel\u014d ilg\u014d\u0161on\u014ds
  pec cylv\u0101ka, tod at\u012b\u0219 lel\u014d atzei\u0161ona, ka cylv\u0101ka pr\u014dts
  ir cylv\u0101ka v\u012bneig\u012bs D\u012bvs i va\u013cdin\u012bks.\\\"\\n\\n\u201eVoi
  as k\u016b var\u0101tu \u0161ym\u0101 cel\u00e4 str\u014dd\u014d\u021b, pa kuru
  laimis laiki at\u012bt?\\\" Mirdz\u016b\u0161om acim vaic\u014dja Zemn\u012bka d\u0101ls.\\n\\n\u201eTu?..
  Varb\u0233\u021b! Ka t\u00e1v b\u0233tu tik dau\u1e11z d\u016b\u0161ys...\\\"\\n\\nI
  jys klusom pi aus\u0219 pateic\u00e1 Zemn\u012bka d\u0101lam v\u012bnu v\u014drdu.\\n\\nZemn\u012bka
  d\u0101ls palyka b\u014dls.\\n\\n\u201eN\u0101, as tai navaru!\\\" jys klusu teic\u00e1.\\n\\nJauneklis
  aizasm\u00e4j\u00e4s.\\n\\n\u201eAs  aizmiersu,  ka  tu  esi  Zemn\u012bka  d\u0101ls!\\\"  jys  sac\u00e4.  \u201eTova
  bierneiba nav  sameideita iz  pi\u013cs\u0101tys akminim, nav  tovys kryut\u0219
  v\u014drgu\u0161ys,  c\u012btu\u0161ys  fabrikys  dyum\u016bs,  nav  tova  m\u014dsa  sovu  g\u016bdu
  p\u014drdavus\u00e1 tam, kas m\u014dk zaltu kal\u021b, tovys aus\u0219 nav dzierdieju\u0161ys
  b\u0101du dz\u012bsmis... T\u00e1v, draugs, j\u014dst\u014dv n\u016bmal\u012b, kod
  dorba veirs sovai n\u014dk\u016btn\u00e1i \u012bt preteim!\\\"\\n\\n...T\u014dli
  beja Zemn\u012bka d\u0101lam iz s\u0101tu j\u014d\u021b. Z\u012bme\u013cu viej\u0219
  n\u016br\u014dv\u00e1 jam capuri,  rudin\u00e1  sorma  \u010d\u00e4r\u00e4s  mot\u016bs.  Zemn\u012bka  d\u0101ls  t\u014d  naman\u00e4ja.
  Pasaul\u012b beja tik dau\u1e11z p\u016bsta i nalaimis, ka jys navar\u00e4ja niv\u012bnam
  paleidz\u00e4\u021b...\\n\\nTre\u0161\u014d k\u016bdal\u00e1\\n\\nKod atg\u014dja
  rudin\u0219, m\u014dt\u00e1 spraud\u00e1 raten\u012b beidzam\u016b k\u016bdali.
  D\u0101ls j\u014dja iz d\u012bnvydu pusi. Jam nabeja lyku\u0161i m\u012bra jaunekl\u00e1
  beidzam\u012b v\u014drdi, jam grib\u00e4j\u00e4s st\u014dv\u00e4\u021b t\u016bs
  rynd\u0101, kuri n\u014dk\u016btn\u00e1i \u012bt preteim.\\n\\nZemn\u012bka d\u0101ls
  n\u016bk\u014dp\u00e1 nu zyrga i paleidz\u00e4ja jaunekl\u00e1m \u012bk\u014dp\u021b
  sodl\u016bs. Jys  g\u014dja  pat\u0219  k\u014djom, a  jauneklis  j\u014dja.  Jys  j\u014dja  i  st\u014dst\u00e4ja\\n\\nVoi
  jys dau\u1e11z beja j\u014dj\u0219, voi moz \u2014 d\u012bnu jys naskait\u00e4ja,
  \u2014 bet pavasar\u012b  jys  dadzyna  cel\u00e1  g\u014djieji.  Kod  labi  iz  j\u016b  pazav\u00e4r\u00e1,  tod
  pazyna: jys beja tys pat\u0219 jauneklis, kuru veir\u012b\u0161i i s\u012bv\u012btis
  gavileidami pavad\u00e4ja iz s\u0101tu.\\n\\nZemn\u012bka d\u0101lam par n\u014dku\u0161\u012bm
  zalta laikim. Zemn\u012bka d\u0101ls klaus\u00e4j\u00e4s i brein\u014dj\u00e4s.
  Tai j\u012b palyka par draugim.\\n\\nT\u014dlum\u0101 kiup\u00e4ja fabriku \u0161k\u016brstyni.\\n\\n\u201eT\u00e1
  m\u00e1\u0219 n\u016bst\u014dsim!\\\" jauneklis sac\u00e4ja i n\u016bk\u014dp\u00e1
  nu zyrga.\\n\\n\u201eDe\u013ck\u014d tu vairs nagribi j\u014d\u021b?\\\" vaic\u014dja
  Zemn\u012bka d\u0101ls.\\n\\n\u201eM\u00e1\u0219 vysi asom br\u014dli!\\\" paskaidr\u014dja
  jauneklis. \u201eTai navar b\u0233\u021b m\u0233su storp\u0101, ka v\u012bns lel\u014dks
  par \u016btru. Ka navar vysi j\u014d\u021b, to navajag j\u014d\u021b niv\u012bnam.\\\"\\n\\n\u0160\u016bs
  v\u014drdus klaus\u016bt\u012bs, Zemn\u012bka d\u0101lam sird\u0219 syla. Tai j\u012b
  g\u014dja: v\u012bns pa lob\u016b pusi, \u016btrs pa kair\u016b, zyrgs pa vydu.
  Zyrgs natrauc\u00e4ja j\u016bs draudzeibys.\\n\\nFabrik\u0101  Zemn\u012bka  d\u0101lam  reiba  golva:  vysur  dyuc\u00e1,  reib\u00e4ja,
  svi\u013cp\u00e1, \u010deikst\u00e4ja. Vysur gr\u012bz\u00e4s, l\u016bc\u00e4j\u00e4s,
  cyl\u014dj\u00e4s. J\u014d placi palyka j\u0101ly nu gryutij\u012bm sit\u012bnim,
  r\u016bkys palyka a\u0161\u0146ainys nu os\u014dm skaidom. A sird\u0219 j\u014d
  beja pr\u012bceiga, part\u016b ka tagad jys st\u014dv\u00e4ja t\u016bs rynd\u0101,
  kas n\u014dk\u016btn\u00e1i \u012bt preteim.\\n\\nJys s\u014dka pe\u013cn\u00e4\u021b
  naudu. B\u012bdrs lobpr\u014dt paj\u00e4m\u00e1 pusi nu j\u014d pe\u013cnis. Tai
  auga j\u016bs draudzeiba.\\n\\nVokor\u016bs jys klaus\u00e4j\u00e4s sova b\u012bdra
  run\u0101. Jam r\u014dd\u00e4j\u00e4s, ka j\u014d ac\u0219 pal\u012bk ar kotru d\u012bnu
  gai\u0161\u014dkys. Ka jys ar v\u012bnu k\u014dp caur m\u014dkulim aug\u0161\u014dk
  koln\u0101. I kod jys b\u0233\u0219 po\u0161\u0101 gol\u0101, tod r\u00e1dz\u00e4s,
  kai n\u014dk\u0219 ci\u013cviecis zalta laiki i kai t\u016brn\u00e1 vaktn\u012bks,
  sauk\u0219 lai vysi \u012bt jam preteim.\\n\\nSv\u0101td\u012b\u0146\u014ds n\u016bkv\u0101pu\u0161i,
  n\u016bputieju\u0161i veir\u012b\u0161i i sadylu\u0161\u014ds s\u012bv\u012btis
  g\u014dja iz lel\u016b laukumu i klaus\u00e4j\u00e4s, k\u016b Zemn\u012bka d\u0101la
  draugs run\u014dja. J\u012b vysi ar gavi\u013com pavad\u00e4ja j\u016b iz s\u0101tu,
  a Zemn\u012bka d\u0101ls tik dreikst\u00e4ja tivle\u0146 pec j\u014d \u012b\u021b.
  I j\u014d sird\u0219 syla par taidu g\u016bdu.\\n\\nTrejs \u0157aizis nu jaunekl\u00e1
  vadeiti, g\u014dja veir\u012b\u0161i i s\u012bv\u012btis ar dz\u012bs\u1e3fom i
  sorkonom pu\u010dom pret zalta laikim. I trejs \u0157aizis j\u012b atg\u014dja atpaka\u013c
  n\u016bpleisu\u0161i,  n\u016bsolu\u0161i,  izsolku\u0161i  i  slymi.  Sorkon\u014ds  pu\u010dis  j\u012b  beja
  atst\u014dju\u0161i cel\u00e1 mol\u0101 iz sovu b\u0101rnu kopim. Ar v\u012bnu sovaid\u014dk
  j\u012b v\u00e4r\u00e4s iz sovu vad\u016bni, veir\u012b\u0161i vairs nam\u0101t\u014dja
  p\u014drl\u012bcyn\u014dju\u0161i ar golvom, s\u012bv\u012b\u0161u izdzysu\u0161yj\u014ds  ac\u012bs  nal\u012bsm\u014dja  vairs  sovaida  gun\u0219.  N\u016bskum\u0219  par
  pasaul\u00e1 napateiceibu, jauneklis staig\u014dja pa ustobu, a Zemn\u012bka d\u0101ls
  j\u016b pr\u012bcyn\u014dja. Jauneklis atkryta iz gultys i dryumi v\u00e4r\u00e4s
  gr\u012bst\u016bs...\\n\\n\u201eMa\u0146 j\u014d\u012bt nu \u0161aj\u012bnis pr\u016bjom!\\\"
  kaid\u0101 d\u012bn\u0101 jys sac\u00e4ja.\\n\\nZemn\u012bka d\u0101ls n\u016bskuma.\\n\\n\u201eAs
  ar tevim \u012b\u0161u leidz!\\\" jys sac\u00e4ja.\\n\\n\u201eIz kureini \u012b\u021b?\\\"
  jauneklis ryugti vaic\u014dja: \u201evysur taipa\u021b ir bej\u0219, vysur  taipa\u021b  b\u0233\u0219.
  Ar  gavi\u013com sagaida, ar  akminim  pavoda...  \u0161ei mozticeig\u014d cilt\u0219!\\\"\\n\\nZemn\u012bka
  d\u0101ls nazyn\u014dja k\u016b sac\u00e4\u021b.\\n\\nJ\u014d draugs p\u012bzatryuka
  k\u014dj\u014ds.\\n\\n\u201eN\u0101, tys tai navar b\u0233\u021b!\\\" jys \u012bs\u014dka
  run\u014d\u021b i j\u014d ac\u0219 s\u014dka kval\u014d\u021b.\\n\\n\u201eA tu vysod
  run\u014dji, ka zalts as\u016bt str\u014ddn\u012bka veira n\u014dvis z\u014dlis...
  Zemn\u012bka d\u0101ls nadr\u016bsi atg\u014ddyn\u014dja.\\n\\n\u201eBodu mierdami,
  j\u012b naspiej staig\u014d\u021b pa \u0161\u016b tuksne\u0161a ce\u013cu. Nu dabasim  j\u012bm  nabierst  nikaida  manna.  Ka  ma\u0146  b\u0233tu  zalts,
  nasaskaitami daudzi zalta, tod as j\u016bs bor\u014dtu, dzirdeitu i aizvastu leidz
  aps\u016bleitai z\u00e1m\u00e1i!\\\"\\n\\n\u201eDa, n\u014dvis z\u014dlis!\\\" atsasauc\u00e1
  j\u014d b\u012bdrs. Tys izsyuc dr\u016b\u0161eibu i cereibu iz lob\u014dkim laikim.
  Bet as radzu: m\u0233su laik\u016bs v\u00e4\u013c nav cytu z\u014d\u013cu pret \u0161\u016b
  n\u014dveit\u014dji, kai tik n\u014dvis z\u014dlis pret n\u014dvis z\u014d\u013com...\\\"\\n\\nI
  jys n\u016bgryma gryut\u014ds d\u016bm\u014ds. Zemn\u012bka d\u0101ls g\u014dja
  pi dorba.\\n\\n\u016atr\u0101 d\u012bn\u0101 pu\u0161d\u012b\u0146\u014ds Zemn\u012bka
  d\u0101ls atg\u014dja iz s\u0101tu p\u012bkus\u0219. J\u014d draugs gul\u00e4ja
  iz gultys i v\u00e4r\u00e4s gr\u012bst\u016bs.\\n\\n\u201eNav lel\u014dkys nalaimis,
  kai tys, ka cylv\u0101ks pat\u0219 vairs nati\u00e7 sovai ticeibai!\\\" vokor\u0101
  sac\u00e4 draugs i j\u012b obi klus\u00e4ja.\\n\\n\u201eKai tu n\u016bsveid\u0219?\\\"
  jys vaic\u014dja nu Zemn\u012bka d\u0101la.\\n\\n\u201eDa, laiks korsts i dorba
  daudzi...\\\"\\n\\n\u201eCik dau\u1e11z sv\u012bdru lej\u0101s pi dorba!\\\" run\u014dja
  t\u014d\u013c\u014dk draugs.\\n\\n\u201eKa t\u016bs vysus var\u0101tu sakr\u014d\u021b
  v\u012bna v\u012bt\u0101... i p\u014drv\u00e4rs\u021b par zaltu...\\\"\\n\\n\u201eT\u012b
  pi\u013cs\u0101t\u0101 dzeivoj\u016bt taids cylv\u0101ks, kurs nu vysa m\u014dk\u016bt
  zaltu tais\u00e4\u021b...\\\" j\u016bk\u014dja Zemn\u012bka d\u0101ls, a sird\u0219
  jam palyka gau\u017ei n\u016bsp\u012bsta.\\n\\nVokor\u0101 jys atroda b\u012bdri
  lelym s\u016blim staigoj\u016bt pa ustobu. \u0156aizis div jys n\u016bst\u014dja
  i grib\u00e4ja Zemn\u012bka d\u0101lam k\u016b sac\u00e4\u021b, bet n\u016bzatur\u00e4j\u00e4s
  i staig\u014dja t\u014d\u013c\u014dk. Beidz\u016bt jys n\u016bst\u014dja.\\n\\n\u201eVoi
  tu esi styprs?\\\" jys vaic\u014dja Zemn\u012bka d\u0101la.\\n\\nTys par\u014dd\u00e4ja
  jam sovys dzeisl\u014dt\u014ds r\u016bkys.\\n\\n\u201eN\u0101, voi tu gor\u0101
  esi styprs? Voi tu vareisi pan\u00e1s\u021b vysu \u013cau\u017eu nycyn\u014d\u0161onu,
  zyn\u014ddams, ka tova l\u012bta ir loba? Voi tu vari aizl\u012bg\u021b sovu ticeibu
  \u013cau\u017eu pr\u012b\u0161k\u0101, lai t\u016b glob\u014dtu leidz lob\u014dkim
  laikim?\\\"\\n\\nZemn\u012bka d\u0101ls palyka n\u016bp\u012btns i sn\u00e4dz\u00e1
  draugam r\u016bku.\\n\\n\u201eVysu, k\u016b tu dareisi, t\u016b as darei\u0161u!\\\"
  jys sac\u00e4. \u201eI ka niv\u012bns vairs t\u00e1v natyc\u0101tu, as t\u016bm\u0101r
  ticei\u0161u t\u00e1v i n\u014dkameibai!\\\"\\n\\nDraugs svineigi sp\u012bd\u00e1
  jam r\u016bku.\\n\\n\u201eAs beju t\u012b, pi t\u014d veira, kas nu vysa zaltu taisa...
  ar satr\u012bc\u016b\u0161u bolsu  jys  sac\u00e4  \u201ejys  s\u016bl\u00e4j\u00e4s  n\u016bsv\u00e4r\u021b  ar  zaltu  vysus  dorba  veira
  sv\u012bdrus...\\\"\\n\\n\u201ePar mani tu esi kungs i pavieln\u012bks!\\\" Zemn\u012bka
  d\u0101ls atsasauc\u00e1,\\n\\n\u201eT\u014d ir par moz. M\u0233su n\u016bd\u016bmi
  ir par lelym, lai t\u016bs ar n\u012bka leidzeklim izv\u00e1s\u021b. Voi t\u00e1v
  p\u012btyktu sp\u0101ka, sakr\u014d\u021b t\u016bs vysus sv\u012bdrus, kas m\u0233su
  fabrik\u0101 lej\u0101s?\\\"\\n\\n\u201eKa tu t\u014d grybi \u2014 as darei\u0161u!\\\"
  Zemn\u012bka d\u0101ls klusi atbi\u013cd\u00e4ja. Jam pret acim st\u014dv\u00e4ja
  vysu t\u016b n\u016bguru\u0161\u016b str\u014ddn\u012bku ryndys, kuri saleiku\u0161i
  iz dyuc\u016b\u0161om ma\u0161i\u0146om, ilg\u014dj\u00e4s pec sv\u0101tvokora zvona.\\n\\nGoda
  beig\u014ds j\u012b p\u014drskait\u00e4ja sovu kr\u014djumu.\\n\\nTai kr\u014dja
  Zemn\u012bka d\u0101ls dorba veira sv\u012bdrus, a j\u014d draugs n\u00e1s\u00e1
  t\u016bs veiram, kurs nu vysa zaltu tais\u00e4ja.\\n\\n\u201ePar moz, par moz!\\\"
  \u2014 draugs n\u016bzapyut\u00e1. \u201eTai m\u0233sim j\u014dstr\u014ddoj p\u012bcdesmit
  godu, lai beidz\u016bt m\u00e1\u0219 var\u0101tu aicyn\u014d\u021b sovus br\u014d\u013cus
  preteim lob\u014dkim laikim, bet tod m\u00e1\u0219 po\u0161i vairs nasp\u00e4sim
  c\u00e1l\u021b sovys v\u0101zdys.\\\"\\n\\nJys atsagula gult\u0101 i v\u00e4r\u00e4s
  gr\u012bst\u016bs.\\n\\n\u016atr\u0101 reit\u0101 jys sac\u00e4 iz Zemn\u012bka
  d\u0101lu:\\n\\n\u201eFabrik\u0101 ir v\u0101ss. \u012atais\u00e4sim taidu v\u012btu,
  kur dorba cylv\u0101kim b\u0233\u0219 sazasi\u013cd\u00e4\u021b\\\"\\n\\nJ\u012b  \u012btais\u00e4ja  pi  fabrikys  v\u014drtim  v\u012btu,  kur  dorba  cylv\u0101kim
  apzasi\u013cd\u00e4t\u012bs... \u014drspuseigi i \u012b\u0161keigi. I dorba cylv\u0101ki
  g\u014dja i si\u013cd\u00e4j\u00e4s, i beja pr\u012bceigi, a j\u016bs sv\u012bdri
  plyud\u00e1 t\u014d\u013c\u014dk iz veiru, kurs nu vysa m\u014dk zaltu tais\u00e4\u021b.\\n\\n\u201eV\u00e4\u013c
  moz, v\u00e4\u013c moz!\\\" Zemn\u012bka d\u0101la draugs \u017e\u0101l\u014dj\u00e4s,
  kod j\u012b otkon pec  goda  p\u014drskait\u00e4ja  sovu  kr\u014djumu.  Jys  nazyn\u014dja,  kai  pavair\u014d\u021b
  sv\u012bdru daudzumu.\\n\\nN\u014dku\u0161\u014d  d\u012bn\u0101  beja  sastd\u012bn\u00e1.  Jau  nu  stu\u0146\u1e11om  se\u0161om  dorba
  cylv\u0101ki si\u013cd\u00e4j\u00e4s pi Zemn\u012bka d\u0101la i j\u014d drauga,
  i beja pr\u012bceigi i v\u00e4r\u00e4s, kai j\u016bs sv\u012bdri plyud\u00e1 pr\u016bjom.\\n\\nZemn\u012bka
  d\u0101la draugs st\u014dv\u00e4ja pi l\u016bga i v\u00e4r\u00e4s iz pogolmu, kur
  st\u014dv\u00e4ja  dorba  cylv\u0101ku  s\u012bvys  i  b\u0101rni,  gaideidami  dorba  cylv\u0101kus
  izejm\u016bt nu syltys v\u012btys.\\n\\n\u201eBreinums! Dabasi l\u012bk\u0101s skaidri,
  a leits lej...\\\"\\n\\nKod jys lob\u014dk \u012bzav\u00e4r\u00e1, tys nabeja leits.
  T\u014ds bej osorys, kurys byra nu acim dorba cylv\u0101ku s\u012bvom i b\u0101rnim.\\n\\nIz\u0157aizis
  Zemn\u012bka d\u0101la b\u012bdram p\u014drg\u014dja kai gaismys stors par vaigu.
  \u014ctri jys pagiva capuri i aizg\u014dja iz veiru, kurs nu vysa m\u014dc\u00e4ja
  zaltu tais\u00e4\u021b.\\n\\n\u201eNiu as zynu!\\\" J\u014d b\u012bdrs atsasauc\u00e1,
  capuri n\u016bsv\u012bsdams iz golda. \u201eI nu osorom var tais\u00e4\u021b zaltu.\\\"\\n\\nBet  vieli  jys  p\u012bg\u014dja.  P\u0101dej\u012b  dorba  cylv\u0101ki  dz\u012bd\u014ddami  g\u014dja
  pr\u016bjom pa \u012blu. Zemn\u012bka d\u0101ls \u017e\u014dv\u014dja.\\n\\n\u201eT\u00e1
  pi m\u0233su \u0161ei l\u012bta \u012bt d\u012bsgon jautri!\\\" Zemn\u012bka d\u0101ls
  atbi\u013cd\u00e4ja.\\n\\n\u201eA t\u012b pogolm\u0101?.. M\u0233sim j\u014djem
  i tei l\u012bta sov\u014ds r\u016bk\u014ds...\\\"\\n\\nI  j\u012b  j\u00e4m\u00e1  t\u016b  l\u012btu  sov\u014ds  r\u016bk\u014ds.  Dorba  cylv\u0101ku  sv\u012bdri  i  j\u016bs
  p\u012bdereig\u016b osorys plyud\u00e1 pr\u016bjom iz veiru, kurs nu vysa m\u014dk
  zaltu tais\u00e4\u021b.\\n\\nZemn\u012bka d\u0101ls i j\u014d draugs skait\u00e4ja
  kotru sastd\u012bnis vokoru sovu kr\u014djumu i run\u014dja par lel\u016b d\u012bnu,
  kod j\u012b iz\u012b\u0219 ar kar\u016bgim i pu\u010dom n\u014dkameibai pret\u012b.
  J\u016bs kr\u014djums vair\u014dj\u00e4s ar kotru n\u016bdzeiv\u014dtu nedeli i
  j\u012bm atlyka ar v\u012bnu moz\u014dk laika run\u014d\u021b par kar\u016bgim i
  pu\u010dom. Pusi nu t\u014d  kr\u014djuma  glob\u014dja  Zemn\u012bka  d\u0101ls,  \u016btru  pusi  j\u014d  draugs.  Nauda
  natrauc\u00e4ja j\u016bs draudzeibai...\\n\\nT\u016bm\u0101r pasaul\u012b vyss izneikst.
  Ari eista draudzeiba...\\n\\nTys  n\u016btyka  tre\u0161\u014d  goda  beig\u014ds.  J\u012b  skait\u00e4ja  sovu  kr\u014djumu  i
  pr\u012bc\u014dj\u00e4s.\\n\\n\u201eKas  t\u016b  b\u0233tu  d\u016bm\u014dj\u0219,  ka  m\u00e1\u0219  tiksim  pi  taidys  naudys!\\\"  j\u012b
  run\u014dja, tod apklusa. N\u016bzaskaidr\u014dja, ka v\u012bns zalta gabalen\u0161
  nabeja eists!\\n\\n\u201eE, tys ir caur tovu nauzmaneibu!\\\" draugs sac\u00e4ja.\\n\\n\u201eVoi
  nu tovys v\u012bglpr\u014dteibys!\\\" Zemn\u012bka d\u0101ls atciert\u00e1.\\n\\n\u201eK\u016b?
  Tu, zemn\u012bka puika, s\u014dksi mani r\u014d\u021b?\\\"\\n\\n\u201eNu, ka tys
  zemn\u012bka puika nab\u0233tu tev\u00e1 vi\u013cc\u0219 cauri, tod se\u0146 jau
  tevi b\u0233tu vut\u0219 ap\u0101du\u0161ys...\\\" Zemn\u012bka d\u0101ls atbi\u013cd\u00e4ja.\\n\\nV\u00e4\u013c
  trejs v\u014drdi nu b\u012bdra pusis i \u010detri nu Zemn\u012bka d\u0101la, i nazkas
  \u017evaksteidams n\u016bkryta iz akmin\u00e1 greidys. Kod j\u012b pazav\u00e4r\u00e1
  \u2014 t\u012b tik druponys; j\u016bs draudzeiba beja sapleisus\u00e1...\\n\\nDraugs
  paj\u00e4m\u00e1 pusi nu j\u016bs kr\u014djuma i aizg\u014dja iz d\u012bnvydim.
  Kod Zemn\u012bka d\u0101ls apsodl\u014dja sovu sierm\u016b i izj\u014dja pa pi\u013cs\u0101tys
  v\u014drtim, tod nabeja  niv\u012bna,  kas  j\u016b  pavoda.  Jys  n\u016blaid\u00e1  siermei\u0161a  povodu  i
  siermeit\u0219 t\u00e1c\u00e4ja l\u0101nu rikseiti iz t\u0101va s\u0101tys pusi.\\n\\nCat\u016brt\u014d
  k\u016bdal\u00e1\\n\\nZemn\u012bka d\u0101ls iztais\u00e4ja t\u0101vam jaunu ustobu,
  m\u014dt\u00e1i \u2014 kl\u0101vu. Vysi kaimini g\u014dja, brein\u014dj\u00e4s i
  grib\u00e4ja b\u0233\u021b par draugim Zemn\u012bka d\u0101lam. A jam po\u0161am
  nabeja nikaidys pr\u012bcys.\\n\\nPa \u0157aiz\u00e1i jys attais\u00e4ja skreini,
  kura beja pylna speideigim zalta gabalenim. Jys ru\u0161yn\u014dj\u00e4s pa zalta
  gabalenim i ryugti sm\u00e4j\u00e4s.\\n\\n\u201eTo t\u00e1 muna jauneiba!\\\" jys
  run\u014dja, \u201eto t\u00e1 muna sird\u0219 ilg\u014d\u0161on\u014ds i m\u012blesteiba.
  Osoru t\u00e1 tik dau\u1e11z i n\u016bpyutu i l\u014dstu. I tik dau\u1e11z kauna...\\\"\\n\\nJys
  pat\u0219 soka dze\u013ct\u00e4\u021b kai voska ritin\u0219.\\n\\n\u013baud\u0219
  brein\u014dj\u00e4s i puryn\u014dja golvys.\\n\\n\u201eVyss jam ir, a m\u012bra
  nav!\\\" tai run\u014d.\\n\\nM\u014dt\u00e1 gl\u014dst\u00e4ja jam vaigu i sac\u00e4ja:\\n\\n\u201eMonts
  t\u00e1v ir, g\u016bds ir, gudreiba ir... soki tak, diele\u0146, k\u014d t\u00e1v
  nav?\\\"\\n\\n\u201eLaimis nav;\\\" d\u0101ls atbi\u013cd\u00e4ja i aizlyka vaigu
  ar r\u016bkom.\\n\\nT\u0101vs ilgi d\u016bm\u014dja i beidz\u016bt sac\u00e4:\\n\\n\u201eM\u0233sim
  ar m\u014dti nik\u014d nabeja, kod jauni bejom, a laim\u00e1 m\u0233sim beja. Laikam
  gon tik cylv\u0101ks var cylv\u0101kam d\u016b\u021b laimi. Mekl\u00e1j, d\u0101ls,
  cylv\u0101ka, kas t\u00e1v laimi d\u016b\u0219!\\\"\\n\\nD\u0101ls  nik\u014d  naatbi\u013cd\u00e4ja,  m\u014dt\u00e1  n\u016bskuma.  Jai  \u012bg\u014dja  pr\u014dt\u0101  se\u0146
  dzierd\u0101ti v\u014drdi: ka bez paved\u012bn\u00e1 palais\u0161\u016bt d\u0101lu
  pasaul\u012b, to atpaka\u013c lai vairs nagaid\u016bt. Jai vair\u014dk nabeja niv\u012bnys
  Laimis k\u016bdalis.\\n\\nVysu vosoru d\u0101ls staig\u014dja kluss i aizad\u016bm\u014dj\u0219.
  Rudin\u012b jys sac\u00e4ja:\\n\\n\u201eNik\u014d  m\u014d\u021b:  golva  mat\u0101s  sierma,  augumam  gaist  jauneibys
  sp\u0101ks, a sird\u0219 v\u00e4\u013c naapklust. Lai\u1e11, m\u014d\u021b, mani
  pasaul\u012b \u2014 sird\u00e1i laimis mekl\u00e4\u021b\\\"\\n\\nM\u014dt\u00e1  pras\u00e4ja,  lai  pagaid\u016bt  pavasara.  Jei  cer\u00e4ja,  ka  leidz
  pavasaram d\u0101ls aizsp\u012bs\u0161\u016bt jai ac\u0219. Pavasar\u0219 atg\u014dja,
  a n\u014dv\u00e1 nag\u014dja. Jei lyudz\u00e4s,  lai  v\u00e4\u013c  leidz  rudin\u00e1m  pagaid\u016bt.  Rudin\u0219  atg\u014dja,  a  n\u014dv\u00e1
  nag\u014dja. Tik d\u0101ls dze\u013ct\u00e4ja ar kotru d\u012bnu kai voska ritin\u0219.
  Rudin\u012b m\u014dt\u00e1 sac\u00e4ja:\\n\\nKod d\u0101ls beja izj\u014dj\u0219
  pa v\u014drtim, m\u014dt\u00e1 paj\u00e4m\u00e1 rateni i aizg\u014dja iz vac\u016b
  ustobu. T\u012b jei n\u016bcierpa sovus sudobrbolt\u016bs motus, patais\u00e4ja
  nu t\u012bm cat\u016brt\u016b k\u016bdali i \u012bspraud\u00e1 t\u016bs pi sprieleicys.
  Ac\u0219 jai beja sausys... Osorom ir sovs m\u0101rs...\\n\\n\u201eNavaru, d\u0101ls,
  vair\u014dk v\u00e4rt\u012bs tov\u014ds \u017e\u0101lob\u014ds. J\u014dj, mekl\u00e1j...
  Voi ta tova laim\u00e1 b\u0233\u0219 iudin\u012b n\u016bsleikus\u00e1...\\\"\\n\\n*
  * *\\n\\nIlgi j\u014dja Zemn\u012bka d\u0101ls iz  z\u012bme\u013cu pusi. Z\u012bme\u013cu
  zvaigzn\u00e1 jau gondrei\u017e jam st\u014dv\u00e4ja iz golvys, a sovys sird\u0219-laimis
  jys v\u00e4\u013c nabeja atrad\u0219.\\n\\nJam st\u014dst\u00e4ja, ka t\u014d\u013c\u014dk
  iz z\u012bmelim as\u016bt augsts kolns, iz t\u014d kolna skaista  mui\u017ea.  Tym\u0101  mui\u017e\u0101  sie\u017e\u016bt  breineigi  skaista  jaunova,
  gaideidama sova taut\u012b\u0161a atj\u014dj\u016bt. Kas izj\u014d\u0161\u016bt
  st\u014dvij\u0101 koln\u0101, tys b\u0233\u0161\u016bt j\u014ds taut\u012bt\u0219.
  Zemn\u012bka d\u0101lam sird\u0219 mudr\u014dk s\u014dka pukst\u00e4\u021b, jys
  p\u012bm\u012bdz\u00e1 sovam balten\u00e1m s\u014dn\u016bs.\\n\\nV\u00e4\u013c palyka
  trejs j\u014djam\u014ds d\u012bnys, kod Zemn\u012bka d\u0101ls p\u012bj\u014dja
  pi st\u014dv\u014d kolna. Jys \u012braudz\u00e4ja vysvysaidus kungu d\u0101lus i
  tivlej\u016bs, i t\u014dlej\u016bs. Cytam beja malns zyrgs, cytam b\u0101rs, cytam
  ar sudobru apkolts. Kotru reitu j\u012b vysi izj\u014dja iz lauka i t\u016blaik
  laid\u00e4s st\u014dvij\u0101 koln\u0101. Bet tik v\u012bns beja \u0157aizi tic\u0219
  leidz pu\u0219kolnam, i tam po\u0161am beja j\u014dzalai\u017e r\u014dpu atpaka\u013c.\\n\\nKungu
  d\u0101ly \u012braudz\u00e4ja Zemn\u012bka d\u0101lu.\\n\\n\u201eKur tu ar it\u016b
  \u014dzi?\\\" j\u012b sm\u00e4j\u00e4s.\\n\\n\u201eJiusim garum...\\\" Zemn\u012bka
  d\u0101ls atbi\u013cd\u00e4ja.\\n\\n\u201eLob\u014dk pa viejam koln\u0101, nakai
  pret vieji gr\u014dv\u012b!\\\" Zemn\u012bka d\u0101ls atbi\u013cd\u00e4ja i bor\u014dja
  sovu bolt\u016b.\\n\\n\u201eTo jau t\u00e1v v\u00e4\u013c kaida d\u012bna j\u014dpagaida,
  cikom bolt\u0233\u0219 pavysam saka\u013cs\u0219. Izn\u00e1s\u0219 obejus viej\u0219
  koln\u0101, kai dod\u017ea z\u012bdu.\\\"\\n\\nReit\u0101 otkon izj\u014dja vysi
  kungu d\u0101ly i laid\u00e4s pret kolnu. Zemn\u012bka d\u0101ls apsodl\u014dja
  sovu bolt\u016b i run\u014dja pat\u0219 sev\u012b.\\n\\nI jys s\u014dka lieneit\u012b
  j\u014d\u021b ap kolnu, ar v\u012bnu aug\u0161\u014dk i aug\u0161\u014dk.\\n\\n\u201eMuns
  t\u0101vs mani m\u014dc\u00e4ja kolnus ar\u021b: nikod tai\u0161ni iz aug\u0161u,
  tik apleik, tik apleik...\\\"\\n\\nKungu dali skr\u00e4ja jam garum.\\n\\nKod jys
  otkon beja \u0157aizi apj\u014dj\u0219 ap kolnu, tod kungu d\u0101ly g\u014dja kai
  ar ecei\u017eom nu kolna l\u00e1j\u012b.\\n\\n\u201eM\u00e1\u0219 nazyn\u014djam,
  ka i \u014d\u017ei daboj apleik ejamu slimeibu!\\\" J\u012b sm\u00e4j\u00e4s.\\n\\n\u201eAs
  nazyn\u014dju, ka kungu zyrgim obej\u016bs gol\u016bs ac\u0219...\\\" Zemn\u012bka
  d\u0101ls sac\u00e4. Kungu d\u0101lym nabeja valis atbi\u013cd\u00e4\u021b.\\n\\nPyrm\u0101
  d\u012bn\u0101 Zemn\u012bka d\u0101ls apj\u014dja desmit \u0157ai\u017eu ap kolnu
  i tyka gondrei\u017e  pus\u012b: \u016btr\u0101  d\u012bn\u0101 jys  apj\u014dja  divdesmit
  \u0157ai\u017eu i  var\u00e4ja  jau mui\u017eys su\u0146us dzierd\u00e4\u021b.\\n\\nTre\u0161\u0101
  d\u012bn\u0101 jys apj\u014dja trejsdesmit \u0157ai\u017eu i p\u012bvakar\u012b
  p\u012bkloudzyn\u014dja pi mui\u017eys v\u014drtim.\\n\\nIzskr\u00e4ja nykni suni
  i s\u014dka r\u012b\u021b Zemn\u012bka d\u0101lu. Zemn\u012bka d\u0101ls izvylka  nu  kabatys  sudobra  dalderus  i  sv\u012bd\u00e1  sunim.  T\u012b  b\u0101ga
  kaukdami.\\n\\nSkaist\u014d dzaltoneit\u00e1 s\u00e4d\u00e4ja pi l\u016bga.\\n\\n\u201eK\u016b
  t\u012b suni tai br\u012bsmeigi plie\u0161?\\\" jei pras\u00e4ja sovai r\u016bkys
  \u1e3faitai. \u201eTys dr\u016b\u0161i vi\u0146 ir voi \u017eyds, voi zemn\u012bks.\\\"\\n\\nR\u016bkys  \u1e3faita  izg\u014dja  pazav\u00e4r\u021b  i  atskr\u00e4ja  r\u016bkys  plateidama.
  \u201eJaunkun\u1e11z, jaunkun\u1e11z, precin\u012bks atj\u014dj\u0219!\\\" jei sac\u00e4ja.\\n\\n\u201eTak
  beidz\u016bt\\\" jaunova v\u012bgli n\u016bzapyut\u00e1 i vaic\u014d: \u201eKaids
  jys ir?\\\"\\n\\n\u201eSoki jam, ka asmu cytam... N\u0101, v\u00e1\u1e11 j\u016b
  ustob\u0101 i pasok, ka d\u012bn\u0101 v\u00e4\u013c nav gol\u0101. A po\u0161a
  \u00e1j aiz v\u014drtim i ver\u012bs, voi naj\u014dj cyts.\\\"\\n\\n\u201ePat\u0219
  kai vosks, zyrgs kai kleper\u0219, bet sunim sv\u012b\u017e ar dalderim.\\\" Skaist\u014d
  jaunova atm\u00e1t\u00e1 lyupu.\\n\\nKotru stu\u0146di vaic\u014dja skaist\u014d
  jaunova iz r\u016bkys \u1e3faitu: \u201eVoi j\u014dj?\\\" I kotru stu\u0146di beja
  atbi\u013cd\u00e1 nu r\u016bkys \u1e3faitys: \u201eNaj\u014dj...\\\"\\n\\n\u016atr\u0101
  reit\u0101 attais\u00e4ja g\u016bda ustobai l\u016bgus i \u012bv\u00e1d\u00e1 Zemn\u012bka
  d\u0101lu \u012b\u0161k\u0101. Skaist\u014ds jaunovys m\u014dt\u00e1 sp\u012bd\u00e1
  jam r\u016bku i tur\u00e4ja mutauteni pi ocu i daguna, \u1e3faitys t\u0101vs syta
  jam iz placa, br\u014dli myrk\u0161yn\u014dja jam ar acim. A po\u0161a skaist\u014d
  jaunova s\u00e4d\u00e4ja kai r\u016bz\u00e1 i d\u00e1v\u00e1 jam n\u016bbu\u010d\u014d\u021b
  diveju pierstu golus. Zemn\u012bka d\u0101lam beja j\u014dst\u014dsta, ka jys ir
  bej\u0219 fabrikants i leltierg\u014dt\u014djs i tagad dzeivoj nu sova kapitala.
  Voi jam ir beju\u0161i t\u0101vs i m\u014dt\u00e1, part\u016b jaun\u012b rodi aizmiersa
  pavaic\u014d\u021b.\\n\\nI tai n\u016btyka, ka Zemn\u012bka d\u0101ls sasn\u00e4dz\u00e1
  sovu sird\u0219 laimi, i ka skaist\u014d jaunova sagaid\u00e4ja beidz\u016bt precin\u012bka,
  i ka mui\u017eys jaunkungi p\u012bdzeiv\u014dja  svaini,  kurs saprota, kod  myrk\u0161yn\u014dja  ar  acim.  K\u014dzys
  n\u016bdz\u00e4r\u00e1 klusys  i jaun\u012bs p\u014dreit\u0219 aizbrauc\u00e1 iz
  t\u014dlom skaistom z\u00e1\u1e3fom.\\n\\nNazkur s\u00e4d\u00e4ja vac\u014d m\u0101men\u00e1
  vac\u0101 ustob\u0101 i spr\u00e4d\u00e1 sudobrboltu k\u016bdali. Ac\u0219 jai beja
  sausys part\u016b, ka osorom ir sovs m\u0101rs...\\n\\nZemn\u012bka d\u0101ls s\u00e4d\u00e4ja
  i brein\u014dj\u00e4s: kaida beja tei sird\u0219 laim\u00e1! Kotru d\u012bnu gordi
  ied\u012bni, lobi veini, bolti goldauti i skaistys kundzis, a par vysom skaist\u014dka
  beja j\u014d po\u0161a sird\u0219 karal\u012bn\u00e1... zeid\u0101, pier\u013c\u014ds
  i zalta  kolum\u016bs.  Muzyka  skan\u00e4ja,  ap  pu\u0161d\u012b\u0146om  k\u016bk\u016bs  \u0161a\u013cc\u00e1  m\u012bls
  viejen\u0161, jyurys zylums \u0161yup\u014dja ar samtu izkl\u014dtu laiveni. Taida
  beja tei sird\u0219 laim\u00e1!\\n\\nKod gaud\u014dja rudin\u00e1 vieji, kod pal\u0101ki
  m\u014dkuli steidzeigi styum\u00e4s iz d\u012bnvydim, tod Zemn\u012bka d\u0101lam
  pa \u0157aizjom aizamiersa j\u014d sird\u0219 laim\u00e1, ar raudeigom acim jys
  v\u00e4r\u00e4s iz augst\u012bm kolnim, aiz kurim atsar\u016bn dzimtin\u00e1. Kod
  n\u014dku\u0161\u0101 pavasar\u012b j\u012b brauc\u00e1 atpaka\u013c iz z\u012bme\u013cu
  rodim, tod Zemn\u012bka d\u0101ls ku\u010deram saciej\u0219 pavysam sovaidu ce\u013cu.
  Ko\u010d nu t\u014dl\u012bnis jam grib\u00e4j\u00e4s pazav\u00e4r\u021b iz dyumim,
  kuri kiup\u00e4ja nu t\u0101va cepl\u00e1.  Turkl\u014dt  jam  izg\u014dja  gondrei\u017e  naids  ar  skaist\u016b  kundzi:  jei
  pavysam navar\u00e4ja sapras\u021b, kai var jiug\u021b vac\u016b steiv\u016b balteni
  k\u016bp\u0101.\\n\\nR\u00e1dz\u00e4ja Zemn\u012bka d\u0101ls v\u00e4\u013c t\u016bs
  laukus, pa kurim jys beja staig\u014dj\u0219 jauneib\u0101 i d\u016bm\u014dj\u0219
  sovys jauneibys d\u016bmys, kai sve\u0161in\u012bks i bieglis. Jys izk\u014dp\u00e1
  nu meikst\u016bs rotu i divejis osorys jam  n\u016bkryta dzimtinis z\u00e1m\u012b...\\n\\nTod
  n\u016btyka nalaim\u00e1. Vac\u012bs, steiv\u012bs balten\u0161 iz\u0157aizis s\u014dka
  trok\u014d\u021b... zv\u012bdz\u00e1, spard\u00e4j\u00e4s i svaid\u00e4j\u00e4s
  par \u012blyuk\u0161im p\u014dri iz zemn\u012bka s\u0101tys pusi, kura beja nat\u014dli
  nu cel\u00e1 molys. Trejs \u0157aizis \u0161veikst\u00e4ja os\u014d peicka pa gaisu,
  trejs \u0157aizis pazac\u00e4l\u00e1 balten\u0161, \u017eieleigi aizazv\u012bdz\u0219,
  n\u016bkryta i beja pagolam...\\n\\nJaun\u014d  kundz\u00e1  s\u00e4d\u00e4ja  myr\u016bn\u00e1  garbum\u0101  rot\u016bs.  Ar  spieceigu
  r\u016bku Zemn\u012bka d\u0101ls izr\u014dv\u00e1 j\u016b nu rotu.\\n\\n\u201eV\u00e1\u1e11
  mani...  iudin\u00e1...\\\" jei \u010dyukst\u00e4ja i r\u014dd\u00e4ja iz m\u014djis
  pusi.\\n\\nPatymsij\u0101  ustob\u0101  s\u00e4d\u00e4ja  v\u00e1cineit\u00e1  spr\u0101sdama  sudobrboltu
  k\u016bdali. Golv\u0101 jai beja vac\u016bs \u013cau\u017eu ausaineit\u00e1 dzili
  izmaukta. \u012ag\u014dja kungs i b\u014dl\u014d kundz\u00e1. Raten\u0161 apst\u014dja,
  v\u00e1cineit\u00e1i dreb\u00e4ja celi nu lela uztraukuma.\\n\\nA Zemn\u012bka d\u0101ls
  nav\u00e1d\u00e1 j\u014ds iz jaun\u014ds m\u014djis pusi. T\u012bpa\u021b pi vac\u014ds
  l\u012bpys beja vac\u014d pu\u0219sagrymus\u00e1. \u2014 Tei beja gondrei\u017e
  tai kai tyv\u014dk.\\n\\n\u201eLyudzu, voi m\u00e1\u0219 t\u00e1 navar\u0101tu dab\u014d\u021b
  gl\u014dzis solta iudin\u00e1?\\\" Vair\u014dk nabeja kungam k\u014d sac\u00e4\u021b.\\n\\n\u201eVoi
  varom \u012b\u021b?\\\" kungs run\u014dja sve\u0161\u0101 vol\u016bd\u0101.\\n\\nV\u00e1cineit\u00e1i
  r\u016bkys v\u014dji n\u016bzalaid\u00e1 caur s\u014dnim. Jei tai pazav\u00e4r\u00e1
  mudri iz kunga i iz b\u014dl\u014ds kundzis.\\n\\n\u201eDa... t\u00e1 gaiss \u013c\u016bti
  slykts...\\\"\\n\\nI j\u012b aizg\u014dja... pa\u013cdis napasceidami.\\n\\nV\u00e1cineit\u00e1
  otkon atsas\u0101da pi raten\u00e1. Ac\u0219 jai palyka tymsys i piersti dreb\u00e4ja.\\n\\nKu\u010der\u0219
  beja atjiudz\u0219 naboga bolt\u016b. Me\u013cni tagad stypr\u014dk var\u00e4ja
  kop\u014d\u021b c\u012bt\u016b ce\u013cu. T\u014dlum\u0101 izgaisa rotu tr\u016bksnis.\\n\\nTryuka
  v\u00e1cineitis sudobrbolt\u012b\u0219 paved\u012bn\u0219...\\n\\nBeigys\\n\\nBolta
  kai \u014dbu\u013cneicys z\u012bds golva Zemn\u012bka d\u0101lam. Laikam par daudzi
  sylti spei\u1e11 iz j\u014d augst\u016bs rodu \u017eielesteibys saul\u00e1. T\u012b
  apak\u0161\u0101 j\u012b vysi pr\u012bcoj\u0101s, \u0161\u012b rodi. J\u014d kundz\u00e1
  s\u00e4\u1e11 v\u00e4\u013c v\u012bnm\u0101r kai r\u016bz\u00e1 zeid\u0101, pier\u013c\u014ds
  i zalta kolum\u016bs. Muzykys skanis i dz\u012bsmis nazyn kai atr\u016bn ce\u013cu
  leidz Zemn\u012bka d\u0101la tymsijai ustobai.\\n\\nDe\u013ck\u014d jam ustoba ir
  tymsa? Vajag pagr\u012bz\u021b mozu p\u016bdzeni i tei aizspeid\u00e4s symtu sv\u00e1\u010du
  gaism\u0101. Bet n\u0101, lai pal\u012bk tymsa... tys lob\u014dk saska\u0146 ar
  j\u014d tymsij\u014dm d\u016bmom.\\n\\nJys  lieni  tyn  pyrm\u016b komuli.  Lieni  viej\u0219  pyu\u0161
  nu  dzimtinis pusis, pazace\u013c kai s\u014dpis i tod otkon n\u016bklust. Tai n\u016bzapyut\u00e1
  m\u014dt\u00e1, kod sird\u00e1i gryu\u0161i beja.\\n\\n\u010cetri komuli Zemn\u012bka
  d\u0101lam pr\u012b\u0161k\u0101... prog\u014dju\u0161\u016b laiku komuli. Se\u0146
  jau t\u012b st\u014dv\u00e4ja j\u014d atvilktn\u012b, jys beid\u014ds pi t\u012bm
  p\u012bzad\u016br\u021b... kauns i \u017e\u0101lobys... A \u0161\u016bvokor at\u012bt
  s\u014d\u1e55u d\u016bmys kai tuksne\u0161a viej\u0219 par j\u016b. T\u014ds sp\u012b\u017e\u0101s  kotr\u0101  dv\u00e4selis  kakten\u012b,  lieni,  kryut\u0219  \u017e\u0146augdamys,  elpu
  aizjymdamys.  De\u013ckam  b\u00e4g\u021b  nu  s\u014d\u1e55om?  Lai  s\u014dp,  lai  syurst,  lai
  aizamierst tagadnis gryut\u014ds likstys.\\n\\nZemn\u012bka d\u0101ls tyn \u016btr\u016b
  komuli.\\n\\nTai raud\u014dja m\u014dt\u00e1, kod dv\u00e4sel\u012b vairs nabeja
  s\u014d\u1e55om v\u012btys.\\n\\nL\u0101ns leits syt pret luga r\u016btim, \u010dauks\u021b
  l\u012bpu lop\u014ds i syuc\u0101s mitrij\u0101 rudin\u00e1 z\u00e1m\u012b.\\n\\nZemn\u012bka
  d\u0101ls tyn tre\u0161\u016b komuli.\\n\\nZemn\u012bka d\u0101ls tyn cat\u016brt\u016b
  komuli.\\n\\nKas par dunei\u0161onu, tik klus\u0101, tik v\u012bnaida, iz m\u012bru
  aicynoj\u016b\u0161a? Voi  l\u00e1j\u012b  jaunu  dz\u012bsmi  dz\u012bd\u014d\u0219?  N\u0101,  tys  ir  nu  dzimtinis.  Tai  du\u0146
  stu\u0146din\u012bks  dzimtinis  kop\u016bs,  kod  bierneni  br\u012bn  pa  dzaltonij\u014dm
  smi\u013ckte\u0146om.\\n\\nN\u016bklust  viejen\u0161,  n\u016bst\u014dj  leits,  nadzier\u1e11
  zvona  dunei\u0161onys. Aug\u0161\u0101 caur l\u012bpu lopom spei\u1e11 zvaigzneitis,
  m\u012breigi, klusi, t\u014dli n\u016bst nu pasaul\u00e1 i t\u014d \u013caunuma.
  Zemn\u012bka d\u0101ls ilgi ver\u0101s zvaig\u017e\u0146u m\u012br\u0101 i d\u016bmoj
  ilgys d\u016bmys, cikam t\u014ds p\u014drzavier\u0161 par  sudobra  gaismu i  izgaist
  dabasu dzi\u013cum\u0101...\"", "\"AICYNUOJUMS\\n\\nLatvejis izgleiteibys darbin\u012bkim\\n\\nV\u0101roj\u016bt
  socialpolitisk\u016bs procesus va\u013cst\u012b i pasaul\u012b k\u016bpum\u0101
  (nalobvieleiguo demografiskuo situaceja, dorbasp\u0101ka i jaun\u012b\u0161u aizplyus\u0161ona,
  emigraceja iz cytom Eiropys va\u013cstim, bieg\u013cu krize i tt.), jau nazcik godu
  garum\u0101 teik runuots i d\u016bmuots par patriotiskuos, va\u013cstiskuos audzynuo\u0161onys
  nap\u012bteikamajim akcentim Latvejis va\u013csts izgleiteibys proces\u0101.\\n\\nDa
  ituo lokaluo kulturapzi\u0146a tyka saglobuota i styprynuota atkareib\u0101 nu tuo,
  par cik lelu vierteibu j\u016b skaiteja (skaita) \u0161kolys i \u0161kolu dybynuotuoji.
  Tys beja i ir \u012bspiejams intere\u0161u izgleiteib\u0101, tym\u0101 po\u0161\u0101
  laik\u0101: 1) nateik n\u016bdr\u016bsynuota mier\u0137t\u012bceigi vierzeitys kulturapzinis
  veiduo\u0161ona vys\u016bs \u0161kol\u0101n\u016bs; 2) intere\u0161u izgleiteiba
  ir papyldu izgleiteiba i att\u012bksme pret j\u016b i nu dzymdynuotuoju, i \u0161kol\u0101nu
  i naratai ari \u0161koluotuoju pusis ir formala.\\n\\nSapr\u016btams, saleidzynomais
  aspekts i standarta vodlinejis na\u012br\u016bbe\u017eoj \u0161koluotuoju individualiz\u0113t
  apgiustam\u016b programu, tok centraliz\u0101t\u016bs eksamenu praseibys izl\u012bk
  par p\u012bnuokumu formalai sagatavei\u0161onai kvantitativu zynuo\u0161onu i prasmu
  puorbaud\u0113. Naratai \u0161koluotuojam datryukst laika tai\u0161ni izpratnis
  i att\u012bksmu veiduo\u0161onai, kas na\u013caun pi\u013cdeit v\u012bnu nu svareiguok\u016bs
  \u0161kolys aizdavumu \u2013 atraiseit \u0161kol\u0101na d\u016bteibys, spiejis
  i atteisteit prasmi izzynuot sova n\u016bvoda kulturu i viesturi, izgleituot daudzpuseigu,
  d\u016bmoj\u016b\u0161u personeibu, sova n\u016bvoda i va\u013csts patriotu i atbi\u013cdeigu
  pyls\u016bni. Tai\u0161ni itam izgleiteibys aspektam, jam\u016bt v\u0101r\u0101
  myusu d\u012bnu geopolitisk\u016b situaceju, byutu juop\u012bgr\u012b\u017e eipa\u0161a
  viereiba. V\u012bna nu \u012bspieju, kai t\u016b dareit sistemiski, sistematiski
  i mier\u0137t\u012bceigi vys\u0101 va\u013cst\u012b, ir, izstruodoj\u016bt jaun\u016b
  izgleiteibys standartu, \u012bv\u012bst \u0161koluos n\u016bvodvuiceibys kursu.\\n\\nLatgolys
  situaceja att\u012bksm\u0113 pret n\u016bvodvuiceibu ir eipa\u0161a, part\u016b
  ka 2010.\u20132012. god\u0101, izstruodoj\u016bt latgal\u012b\u0161u vol\u016bdys
  i literaturys standartu, nu v\u012bnys pusis, beja skaidrys, ka vuiceibu pr\u012bk\u0161matu
  \u201eLatgal\u012b\u0161u vol\u016bda\\\" ir gryuteibys atjaunuot, part\u016b ka
  vol\u016bdys aizl\u012bgumu periods ir bejs puoruok ilgs, part\u016b i pedagogi,
  i sab\u012bdreiba eisti tam nabyutu gotova. Nu \u016btrys pusis, beja juod\u016bmoj
  par n\u016bvoda \u012bdzeivuotuoju po\u0161apzinis ce\u013c\u0161onu, teritorialuos
  identitatis styprynuo\u0161onu i vol\u016bdys, cytu kulturys vierteibu saglobuo\u0161onu
  i puormontuo\u0161onu. Part\u016b, struodoj\u016bt pi latgal\u012b\u0161u literaturys
  standarta, beja skaidrys, ka nep\u012bc\u012b\u0161ams cyts pr\u012b\u0161kmats,
  kas sp\u0101tu \u012binteres\u0113t \u0161kol\u0101nus holistisk\u0101 veid\u0101,
  \u012btvar\u016bt vysus pyrma n\u016bsaukt\u016bs aspektus. Taida var byut n\u016bvodvuiceiba.
  Suok\u016btneji lykuos, ka vol\u016bdys specifikys de\u013c tys ir svareigs tai\u0161ni
  Latgolai, tok pakuopeniski veidoj\u0101s izpratne, ka tys ir svareigs vysim Latvejis
  n\u016bvodim. Par n\u016bvodvuiceibu, storp cytu, tyka runuots jau daudz senejuok,
  90. god\u016bs, VISC, kod spr\u012bde, kai puormeit vol\u016bdys i literaturys apgivi.\\n\\nPr\u012b\u0161kmata
  \u201eN\u016bvodvuiceiba\\\" pamatmier\u0137s \u2013 veiduot stypru teritorial\u016b
  identitati, ce\u013ct \u0161kol\u0101nu nacional\u016b/kulturys po\u0161apzi\u0146u,
  rod\u016bt lapnumu par dzymt\u016b pusi i p\u012bdereibys izjiutu sovam n\u016bvodam,
  va\u013cstei, [ruod\u016bt, ka] izgaismoj\u016bt sevkura n\u016bvoda viesturi i
  paruod\u016bt juo atteisteibys \u012bspiejis vysaiduos j\u016bmuos (\u012bskait\u016bt
  tehnologeju) ari myusu d\u012bnuos. Latvejis vierteibu, tradiceju, geografisk\u016bs
  i social\u016bs sovpateibu \u012bpazei\u0161ona jau n\u016bteik latv\u012b\u0161u
  vol\u016bdys, literaturys, kulturys viesturis pr\u012b\u0161kmat\u016bs, a styprai
  individualitatei i p\u012bdereibys apzi\u0146ai ir nap\u012bc\u012b\u0161ams zynuot
  i saprast specifisk\u016b, sevkuram n\u016bvodam unikal\u016b, part\u016b pr\u012b\u0161kmats
  \u201eN\u016bvodvuiceiba\\\" ir nap\u012bc\u012b\u0161ams Latvejis \u0161koluos.
  Ari Eiropys Sav\u012bneib\u0101, styprynoj\u016bt pamatkompete\u0146\u010du apgivi
  (sazi\u0146a dzymtaj\u0101 vol\u016bd\u0101, sve\u0161vol\u016bd\u0101, digitaluos
  i matematiskuos pamatzynuo\u0161onys, kulturapzi\u0146a, kreativitate, uzjiemiejdarbeibys
  i iniciativys, lidereibys, raksteitprasmis i prasme vuiceit\u012bs) ir \u012bv\u012bsts
  pr\u012b\u0161kmats \u201eRegional Studies\\\" (n\u016bvodvuiceiba).\\n\\nJam\u016bt
  v\u0101r\u0101 da\u0161amejuos \u012bstruodnis, ir topu\u0161i i t\u016bp daudzi
  vuiceibu leidzekli, kas ir izmontojami n\u016bvodvuiceibys pr\u012b\u0161kmata eistynuo\u0161onai
  (t. sk., \u201eSuitu n\u016bvoda vuiceiba\\\" (2014)), R\u0113zeknis Tehnologeju
  akademeja \u0161koluotuoja vuiceibu program\u0101 ir iek\u013cuovuse metodiku ari
  itaida pr\u012b\u0161kmata apgivei, ir izstruoduotys myu\u017eizgleiteibys programys
  (2013. god\u0101 n\u016bsaklauseju\u0161i puori par 30 R\u0113zeknis pi\u013cs\u0101tys
  pedagogu, kas intere\u0161u izgleiteib\u0101 p\u012bduovoj n\u016bvodvuiceibu R\u0113zeknis
  \u0161koluos, kai ari 2016. god\u0101 \u0161koluotuoju kursu \u201eVosoruo\u0161ona\\\"
  laik\u0101 it\u016b kursu n\u016bsaklauseju\u0161i v\u0113\u013c 30 pedagogi nu
  vysaidu Latgolys i Vydzemis regiona po\u0161va\u013cdeibu), tym\u0101 po\u0161\u0101
  laik\u0101 pr\u012b\u0161kmata \u012bdzeivynuo\u0161onai byutu nap\u012bc\u012b\u0161ams:\\n\\n1)
  va\u013cstisks atbolsts mier\u0137dotacejis veid\u0101, kas ir d\u016bmuots tai\u0161ni
  ituo pr\u012b\u0161kmata apgivei (35 stu\u0146\u017eu goda kurss 1 klasei videji
  var\u0101tu izmoksuot 500\u2013750 eiro), svareigi byutu n\u016bdr\u016bsynuot 1
  stu\u0146di nede\u013c\u0101 sevkur\u0101 nu izgleiteibys p\u016bsmu (1.\u20134.
  klas\u0113; 5.\u20139. klas\u0113; 10.\u201312. klas\u0113, k\u016bp\u0101 sevkurai
  \u0161kolai 3 kursi pa 35 stu\u0146dem), klasi, kuram\u0101 n\u016bteik n\u016bvodvuiceiba,
  var izalaseit \u0161kola,\\n2) va\u013csts pasyutejums atbylst\u016b\u0161u vuiceibu
  leidzek\u013cu i paraugprogramu planveideigai sagatavei\u0161onai i izd\u016b\u0161onai.\\n\\nVa\u013csts
  dot\u0101ta \u012bspieja apgiut n\u016bvodvuiceibu byutu veiksmeigs reiks ari sab\u012bdreibys
  integracejis politikys atvese\u013cuo\u0161onai, part\u016b n\u016bvodvuiceiba ir
  pr\u012b\u0161kmats, kas respektej lokal\u016b identitati, tym\u0101 skait\u0101,
  lokal\u016bs vol\u016bdys, izl\u016bk\u0161\u0146u variantus. I izcileiba sevkur\u0101
  j\u016bm\u0101 ir sasn\u012bdzama vi\u0146 tod, ka ir stabils vierteibu pamats,
  t. sk., stypra lokaluos, va\u013cstiskuos identitatis p\u012bdereibys apzi\u0146a.\\n\\nRogovka,\\n\\n05.08.2016\\n\\nN\u016bdybynuojuma
  \u201eLatgal\u012b\u0161u vol\u016bdys, literaturys i kulturviesturis \u0161koluotuoju
  asociaceja\\\" va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja\\n\\nVeronika Dundure\\n\\nLatgal\u012b\u0161u
  Kulturys b\u012bdreibys va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja\\n\\nL\u012bvija
  Plavinska\\n\\nB\u012bdreibys \u201eEtniskuos kulturys centrys \u201eSuiti\\\"\\\"
  va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja\\n\\nDace Martinova\"", "\"Kod uzvelc
  latga\u013cu t\u0101rpu, mugura kliust taisnuoka\\n\\nLudz\u0101 radzami seneji
  t\u0101rpi, kurus latgal\u012b vylka mugur\u0101 7.\u201313. godsymt\u0101 i 18.\u201319.
  godsymt\u0101\\n\\nEgita Ter\u0113ze Jon\u0101ne\\n\\nLudzys amatniku centr\u0101
  gu\u0111a wit\u0101 iruodeita latgal\u012b senej\u016bn t\u0101rpi\u0146u, partu,
  ka, ka \\\"Vletiej\u0101 Latgale\\\" un \\\"Latgales kulin\u0101r\u0101 mantojuma
  centrs\\\" vad\u0113tajai Tatjana\u012b Koza\u010dukai - jeli uzrakstieja \u013c\u016bti
  viertiegu projektu, kas luove Ludzys n\u016bvoda posvaldeib\u0101 i m\u016bsdienu
  latgal\u012bskaikim ra\u0111ei latgal\u012b t\u0101rpu. Taidue t\u0101rpu, k\u0101ka
  mugur\u0101 myusu sen\u010di Latgolys Ludzys aprin\u0137i. Kod atbrucu ekskursejs,
  mes stuotom Ludzys aprin\u0137a t\u0101rpu stuotus.\\n\\nI tagad es tev past\u016bciotu\u0161u,
  par k\u016b Ludza ir s\u016bla Latgolys, Latvejas i pasaul\u012b kar\u0113!\u00bb
  pr\u012bc\u0113gts soka Liga i vadynoj iet Ludzys amatnie\u010d\u012bbjes centr\u0101
  dz\u012blukoj\u0101 telp\u0101 apsav\u0113rt latgal\u012b seneju t\u0101rpi\u0146
  kolekciju.\\n\\nPyrms rokst\u016b t\u016b, k\u016b stuotstieja L\u012bga, grubu
  atsazet, ka, radz\u012bt latgal\u012b senej\u016bn t\u0101rpi\u0146u, sam\u016bs
  - nu kraso\u0161u selektivu i seno t\u0101rpi\u0146u, rokst\u016b t\u016b, aprin\u0137i
  i cytu r\u012bnu kruo\u0161\u012bmata. I vel - p\u012bsaskar\u012bt t\u0101rpi\u0146u,
  maini cauraude syltums i lapnums, i apzina, ka muni sen\u010di ir beju\u0161i skasti
  i darbeigi cylv\u0101ki. L\u012bga v\u0101luok iiti muni sajutu i d\u012bmu stypynoju
  jau ar sovu stuotu.\\n\\n\u00abMyusu Ludzys amatniku centr\u0101 var redz\u0113t
  latgal\u012b vyssis t\u0101rpi\u0146u, k\u0101du iruota i cytu t\u0101rpi\u0146u,
  i jiem vyssis ir nazi i citi iru\u0161i, vel kruo\u0161\u012bmata r\u016btu, bez
  kuru vyssis nav izt\u0101dojietys. Gon t\u0101rpi, gon iru\u010di i r\u012btnys
  i autentiski tim t\u0101rpi fragmentiem i priksm\u0101t\u012bm, kas beja atrosti
  Ludzys \u016adu kolna kopu lauk\u0101 i K\u016btu senkop\u012bs. Visvai-ruok l\u012bceibu
  ir nu Ludzys \u016adu kolna kop\u012bm, ti beja izrokti par 400 kopi. Arheologi
  atzie\u017e, ka ti beja boguoteig\u012b kopi, k\u0101du iruota i t\u016bsis atrosta,
  k\u0101du iruota boguoteig\u012b kopi, k\u0101du latgal\u012b t\u0101lta, i Ludzys
  beja n\u016bzimej\u012bgs n\u016bvoda i t\u012brzi\u0146dz\u012bb\u012bbys centr\u0101.
  Koln\u0101, kur tagad ir kat\u0101lu bazein\u012bca, beja sv\u0101t\u012bta, a po\u0161a
  latgalu cils dz\u012bvzoju puori Ludzys Lelajam azaram Ki\u0161u koln\u0101. Ti
  beja Ludzys pyrms Ludzys. Tys beja \u013c\u016bti lels i v\u0101rens pi\u0161kols,
  varem latgalu apmetne ar sovi lels \u013c\u016btu, 15 hektarim pi\u0161l\u0101tys
  zem\u012bs. Jau t\u016briez te beju vi\u0146u nu lehokojom pi\u0161kols tagad\u0113jai
  Latvejas teritorij\u0101.\\n\\nIte beja iudina ce\u013c\u0161 par il\u017eys upi
  i Ludzys azarim nu divvid\u012btis i Daugavu i t\u016blojok ce\u013ca i z\u012bm\u0113lim,
  i Ludzys nu Ludzina ce\u013ca beja n\u016bzimej\u012bgs i Nierdz\u012bceibys centr\u0101.
  Na par t\u016bs\u012b i Kazu\u013cuisku kopu kulin\u0101ri Zelteni\u0146us beja
  atrostys monetys, kas nav atrostys n\u012bvina cyt\u0101 naudy\u0161 depoz\u012btai
  Latveja\u00bb, soka Liga i atguodoy\u00f1o \u016adu kolna aprokst\u0101 arheolo\u0123u
  paustu sacynuo-jumu, ka vys atrostas li\u00e7ovy par t\u016b, ka ti dz\u012bvzoju\u0161ie
  \u013c\u016bti bogueta, sociali i ekonomiski atteitie\u0161u cylv\u0101ku kop\u012bna,
  del-tam nabogu kolpojotuoj kopu nav, bet i\u012b karaju kopi.\\n\\nD\u012bru\u017e\u0101l
  \u016adu kon\u016bs atrostuos arheologiskus li-ciebys. K\u0113rvejas sam laik\u0101
  tyka savstotys i V\u012btshoku, viluok iz Sanktpeterburga Ermit\u0101\u017eys muzej\u0101,
  Moskovys viesturs muzej\u0101 i citim muzej\u0101m. Daudz prik-matu s\u0101j\u0113me
  i Vilnis viesturs muzej\u0101s, bet lit\u016bv\u0161i t\u016b vyssis ir atdauvusi
  Reigs viesturs muzej\u0101m, ti latgalu stend\u0101 var fraudeizt muzeja raksturojumu,
  kas ir tikai druskys nu \u016adu kolna 400 kop\u012bs atrostom latgalu mon-tom,
  sajutu i L\u012bga.\\n\\nL\u012bga n\u016bvoda iz senej\u016b tautys t\u0101rpu,
  kaidu latgal\u012b\u0161\u012b aude 14\u201315. godsymt\u0101, kas beja storp\u012bsmu
  storp ar-heologu atrasstajim i ludz\u0101ni\u0161u atjauniotajim arheolo-giskajam
  t\u0101rpi\u0146. Abrenis t\u0101rpu stuotu myusu t\u016b, ka latgal\u012b\u0161\u012b
  t\u0101rpus suoka r\u016btuo ar paved\u012bmi i dzepiorim, stykla ze\u0161ien. Tipat
  izt\u0101dojieti i etnogr\u0101fiski t\u0101rpi, lat-gal\u012b\u0161\u012b t\u0101rpi\u0146
  ritu 17.\u201319. godsymt\u0101. Sam\u012bn\u012btu t\u0101rpu nu 19.\u201320. godsimt\u0101
  nav, be gan jau ludz\u0101ni\u0161\u012b t\u016bs n\u016baus ciyta projekta.\\n\\nL\u012bga
  atguodoyno, ka t\u012bkpat unik\u0101lis ir latgalu r\u016btu stuotus, i aicnoj
  par t\u016b rakstiet. P\u012bm\u0101ram, pyucs sakta, ku nosuoja veir\u0161i, ir
  atrost\u0101 Ludz\u0101, i t\u016b nosuoja vad\u016bns voi kara vad\u016bms. Iga
  t\u016b par ip\u0101s\u012bm n\u016bp\u0101nim, c\u012bn\u0113jam\u0101 r\u016btu,
  k\u0101du iruota i t\u016bsis atrosta, k\u0101du iruota, apr\u016bc\u0101, kokl\u0101r\u016btu
  - lai atbaudieti jum\u012bs gors. Ip\u0101s\u012bm n\u016bp\u0101nim ir par j\u016bstom,
  zejm\u016b gudrebim i daudzom ciytom dz\u0113vis viertiebom i zyno\u0161onom.\\n\\nInteresanti,
  kai i \u0161\u016bdin Ludzys cylv\u0101ki, apotu nosuo-za Ludzys amatniku centr\u0101
  korg\u0101, ar t\u016bl\u012bt iemammu posi an\u017ei lyvun i vok\u0101ri latgal\u012b\u0161\u012b
  t\u016bs\u012bs. L\u012bga volkoj te, cen\u012btai, darbeigi senej\u016b t\u0101rpi\u0146u
  latgalu t\u0101rpu, deltam ka j\u016b jutai kai \u013c\u016bti radniec\u012bgu sovai
  dv\u0113sel\u0113m.\\n\\nIr pareizi atdarynuot t\u016b, kas ir atrosts nu po\u0161am
  pyrmus n\u016bm\u012bm. Ludz\u0101 radz\u012bt latgal\u012b t\u0101rpi kolekcija
  ir pit\u012bvymuota originalaj\u0101m senej\u016b latgal\u012b t\u0101rpi\u0146am.
  Met t\u016bs pietejom, izzyzmujom i tuo laika gorieg\u016bs i dz\u0113vis lykumus.
  Tys vyss mani pricej, dora lapnu, ka es pidaru Ludzai, pidaru Latgaloi, pidaru latgal\u012b\u0161im.
  Es lepojis ar myusu sen\u010dim, kas beja bogueta gareigi i ekonomiski,\\\" uzsv\u0113r
  Liga.\\n\\nUzzin\u0101t: Senie\u0161u latgalu t\u0101rpi tyka auzti i \u0161\u016bti
  projekt\u0101 \\\"Kul\u012bn\u0101r\u0101 mantojuma un tradicion\u0101lo amatniec\u012bbas
  prasmju saglab\u0101\u0161ana un populariz\u0113\u0161ana\\\" (Bells Culture), kuru
  realiz\u0113 b\u016briebra \\\"Latgales kul\u012bn\u0101r\u0101 mantojuma centrs\\\"
  sadarb\u012bb\u0101 ar picom Latgolys, Leitovys i Boltr\u012bkeivys po\u0161valdeibom.
  Ludzys n\u016bvoda po\u0161val-deiba sovu finans\u0113jum\u0101 dalu \\\"rgudeja
  latgalu sene-j\u016bs t\u0101rpu ausona i \u0161\u016bso\u0161ana (topa pavysam
  deveni t\u0101rpu komplekti).\"", "\"Troks ci nu Rogovkys voi lobs ar lobu sazatyka\\n\\nSevkuram
  ir sovys gaitys iz zemes. Sovs id\u016btis laika vektors \u2013 deig\u0161onai,
  aug\u0161anai, pumpuruo\u0161onai, \u017eidie\u0161onai, br\u012bdumam un siermumam.
  Skriejinam un gausumam. D\u016b\u0161onai i jim\u0161onai. Kluotbyu\u0161on\u0101
  i atguoduojum\u016bs. Sevkura sirds stundiniks dzeivis d\u012bnvyd\u0101 ir apjiemeibys
  pylns atstuoat p\u0101dys, istuodeit \u016bzulu ci lipu, izcelt muoji, izaudzynuot
  d\u0101lu. Adventa laik\u0101 J.Soikana Ludzys muokslys \u0161kola aicyno pimin\u0113t,
  atguoduot par dzejniku, muoksliniku, kulturyss darbiniku Ontonu K\u016bkuoju, kas
  2014.god\u0101 23.decembr\u012b svineitu sovys dzim\u0161onys dinys 74. goda dinu.
  Rad\u016b\u0161is, koloritis, \u201ctrokis\u201d rogovk\u012bts 7 godus kai myu\u017eeib\u0101,
  tok juo isuokt\u012b dorbi r\u016bd sp\u0101ku byu\u0161on\u0101. Cel\u0161 iz dzymt\u016b
  s\u0101tu Ruduk\u016bs gluds i ibraukts. N\u016bdybynuotuo muokslys \u0161kola Ludz\u0101
  mainuos, palykdama uzticeiga pamot\u016bs \u012blyktuom vierteibom \u2013 Latgalis
  kultura, \u0123imeniskums i muokslys dz\u012bdyn\u016b\u0161is sp\u0101ks misai,
  goram, dvieselei, individam i sabidreibai k\u016bpum\u0101. Latgalis s\u0101tu pavord\u016bs
  kiup sylta gu\u0146s Ontona d\u0101la myur\u0101toj\u016bs cep\u013c\u016bs. \u201cO
  blakys\u201d isuokt\u016bs trikm\u012b\u0146us ritm\u0101 izsyt unuks. P\u016bdniku
  saime gr\u012b\u017e i lypynoj p\u016bdus. Ailiniki (dzejniki) turpynoj salikt vuordus
  ritmiskuos vineibuos, lai pastuostesteit\u016b par jiutu pasauli. Zynuotn\u012bki,
  studenti, unu\u010dka pietej Ontona literar\u016b un muokslinicisk\u016b devumu
  Latvejis kulturyss konteksta. \u012aspiejams, ka pais kaida seik\u0161alte\u0146a
  pyrms laseituoju iraudzeis Ontona K\u016bkouja latgali\u0161u dzejis izlaze i napabeigtu
  gruomota \u201c\u0136\u012bvit\u0101ns\u201d, tok kaida ES projekta rezultats tiu\u013cen
  byus taustoms i litojams kai \u0161koluos, tai vinkuor\u0161i s\u0101t\u0101. Tei
  jir kruosojomuo gruomate\u0146a par Ontonu K\u016bkoju un muoksliniku nu Boltkrivejis
  Jazepu Drozdovi\u010du.\\n\\nTaipo\u0161 ir sagataveits metodiskis materials deve\u0146om
  n\u016bdarbeibom, kas, lik\u016bt po\u0161\u0101 viden\u012b vi\u0146a cylv\u0101ka
  dzeivis n\u016btykumus, stuosta par kulturyss tradicejom, amatniceibu, viesturiskim
  n\u016btykumim Latgol\u0101 i muokslys lykumim. Vysam sovs laiks, i sova vita. Skriejinam
  un gausumam. D\u016b\u0161onai i jim\u0161onai. Kluotbyu\u0161on\u0101 i atguoduojum\u016bs.
  Pimyn\u016bt, puorskait\u016bt, puortiemej\u016bt atstuoat\u016bs n\u016bsp\u012bdumus
  \u2013 Ontona K\u016bkuoja dzejis i prozu, gleznys i kinyss Adventa garij\u016bs
  i sve\u010du gaismys pipildietij\u016bs vokor\u016bs.\\n\\nLatvijas \u2013 Lietuvas
  \u2013 Baltkrievijas p\u0101rrobe\u017eu sadarb\u012bbas programma Eiropas kaimi\u0146attiec\u012bbu
  un partner\u012bbas instrumenta ietvaros projekts \u201eIzgl\u012bt\u012bbas apst\u0101k\u013cu
  uzlabo\u0161ana m\u0101kslas mantojuma saglab\u0101\u0161anai Latvij\u0101 un Baltkrievij\u0101
  p\u0101rrobe\u017eu sadarb\u012bbas ietvaros\u201d (Virtual\u0101 realit\u0101te\u201d)
  Nr.LLB-2-244)\\n\\nLudzys mokslys \u0161kolas direktore\\nSandra Vorkale\"", "\"Latgolys
  storpkongress\\n\\n\\\"Latgolys atteisteiba \u2013 dr\u016b\u0161eibys pamats Latvejai
  i Eiropai\\\" R\u0113zekne\\n\\nR\u0113zeknis Tehnologeju akademeja (RTA), Atbreivuo\u0161onys
