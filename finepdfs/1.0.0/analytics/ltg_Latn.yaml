  lobs b\u0233\u0219 A Za\u010du Janc\u0219, skriejiejs lobs, Par me\u017ea postn\u012bku
  jys tap\u0219.\\n\\nTik v\u012bns nu vysa zvieru bora Sovai klas\u00e1i kaunu dora:
  S\u00e4\u1e11, narunoj i smaida. K\u016b n\u014dk\u016btn\u012b jys gaida?\\n\\nOp\u016bgs
  ver\u0101s \u2014 kas ir jys? Ak, tys \u2014 vilc\u0101ns A\u013cfonen\u0161, Klasis
  slaisten\u0161, rakaren\u0161. \u00bbTu, pui\u0219, iz m\u014dtis sag\u014dd\u014dt\u014d
  kars, Voi b\u0233si me\u017ea sanitar\u0219?\u00ab Tai Op\u016bgs vaicoj.\\n\\n\u00bbVa\u016b!
  Nagrybu as taidys lygys \u2014 St\u012bp\u021b nakt\u0219-p\u016bdus i sak\u016bp\u021b
  mygys.\u00ab Tod \u0161keibi sm\u012bn\u016bt vilc\u0101ns ryuc: \u00bbNu mili\u010dim
  kod se\u0146 jau m\u012brs,\\n\\nA policistu v\u00e4\u013c ir moz, Jauns laupeit\u014dju
  omots rad\u012bs \u2014 Reketirs.\\n\\nTam dereigs niu as b\u0233\u0161u pat\u012bs.\u00ab\\n\\nOp\u016bgs
  ac\u0219 tik sovys b\u014dla Jiut jys \u2014 blameita tik\u0219 \u0161kola, Kod
  \u012bst\u014d\u0219 jaun\u014d vylka tykums. Bet b\u0101rnu aizsardzeibys lykums
  Tam d\u016b\u0219 pa nogim, Kas zvier\u0101nu, vysleidza k\u014ddu, Ko\u010d i par
  p\u014drk\u014dpumim smogim, Tik v\u012bgli \u012bp\u0101rtu pa \u014ddu.\\n\\n*\\n\\nKaidu
  morali lai d\u016bdu? Voi lai demokrateji s\u016bdu, Kur b\u0101rnu at\u013cauteiba
  p\u014drspiej g\u016bdu? ...s\u014dk t\u014d\u013c\u014dk korupceja z\u00e1l\u021b,
  Lai b\u0233tu r\u014dtnij\u012bm k\u016b p\u00e1l\u021b.\\n\\n1996.\\n\\nDZI\u013b\u014c  SAKN\u00c1\\n\\nNav
  br\u012bsmeig\u014dkys D\u012bva str\u014dpis \u2014 Kai narymst\u016b\u0161ys z\u016bbu
  s\u014dpis.\\n\\nSe\u0146 atgad\u012bn\u0219 taids dzierd\u0101ts beja Par b\u014dbu
  v\u014drd\u0101 \u2014 Sa\u013cumeja: Jai z\u016bbs na v\u012bns jau \u014dr\u0101
  krit\u0219, A par it\u016b z\u016bbu past\u014dsts cyts.\\n\\nJei m\u016bc\u00e4j\u00e4s
  kai ni ar v\u012bnu, Tys s\u014dp\u00e4ja jau p\u012bkt\u016b d\u012bnu;\\n\\nNi
  ar pierstu, ni ar d\u012bgu valkams, Kai tikai ambulanc\u012b raunams.\\n\\nNik\u014d
  dar\u00e4\u021b, Lob\u014dk \u0161udi\u0146, nakai pareit. T\u014dm s\u014d\u1e55om
  vajag Golu dar\u00e4\u021b.\\n\\nJaunu skustu apsiejus\u00e1, \u014crstam naudu
  dab\u014djus\u00e1, Pyrms cel\u00e1 sevi p\u014drkryst\u00e4ja, Iz m\u012bstu d\u00e1v\u00e4s
  Sa\u013cumeja...\\n\\nZ\u016bbu \u014drsts jau dze\u013c\u017eus ska\u0146dej, \u2014
  Kai be\u0146d\u00e1 lel\u014ds str\u014dpis stu\u0146d\u00e1i. A b\u014dba kr\u0101sl\u0101
  tik k\u016b e\u013c\u0161: \u2014 Cik \u0161ausmeigs dzeivis krystace\u013c\u0161!\\n\\nT\u00e1
  \u014drsts ar l\u012btpratieja skotu Reikoj \u2014 muti tur\u00e4\u021b plotu! Jau
  slym\u016b z\u016bbu stang\u014ds j\u00e4m\u00e1... A b\u014dba \u2014 muti sakramp\u00e4ja.\\n\\nNu,
