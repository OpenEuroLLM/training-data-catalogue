  bylst i turpynoj: \u00bbAs \u0161kolai pateiceigs bez gola!\u00ab\\n\\nT\u00e1 n\u016bzaskaidroj
  v\u00e4\u013c dau\u1e11z kas: Iudr\u0101ns \u2014 zvej\u014ds leidakys, Babr\u0101ns
