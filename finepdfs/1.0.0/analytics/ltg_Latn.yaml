  i www.lakuga.lv\"", "\"\\n\\nSATURS\\n\\nZylaceit\u00e1 i Zaltga\u013cveit\u00e1\\n\\nV\u012bn\u0101  c\u012bma  mol\u0101,  moz\u0101  ustaben\u012b  dzeiv\u014dja  div  mozys
  \u1e3faitineitis: Zylaceit\u00e1 i Zaltga\u013cveit\u00e1. J\u014ds beja b\u014drineitis.
  Zylaceit\u00e1i beja \u013c\u016bti skaistys zylys actenis. Nu j\u014ds acte\u0146om
  vysod speid\u00e4ja \u017e\u0101lsirdeiba, m\u012bleiba i pac\u012bteiba. Zaltga\u013cveit\u00e1i
  beja skaisti zalta mateni. \u013baud\u0219  m\u012b\u013c\u014dja  t\u014ds  \u1e3faitinis  i  cyt\u0101  v\u014drd\u0101  j\u014ds  nasauc\u00e1.
  \u1e3eaitineitis ari m\u012b\u013c\u014dja vysus i paleidz\u00e4ja vysim. C\u012bm\u0101
  beja dau\u1e11z mozu b\u0101rnu. M\u014dtis, \u012bdamys iz dorbim, atst\u014dja
  b\u0101rnus ustob\u0101, iz pogolma. Zylaceit\u00e1 ar Zaltga\u013cveiti gryuta
  dorba nasp\u00e4ja str\u014dd\u014d\u021b, a pa\u0161yup\u014d\u021b, pakav\u00e4\u021b
  mozus b\u0101rnus, pasn\u00e4g\u021b slymijam iudin\u00e1 gl\u014dzi j\u014ds sp\u00e4ja
  i vysod ar pr\u012bcu t\u016b dar\u00e4ja. Part\u016b \u013caud\u0219 d\u00e1v\u00e1
  j\u014dm maizis, p\u012bna, sa\u0161yva lynu krekle\u0146us \u2014 i b\u014drinei\u021bom
  t\u014d p\u012btyka. J\u014ds jut\u014ds laimeigys. I niv\u012bns j\u014ds nab\u014dr\u00e1.
  Kai ta var b\u014dr\u021b b\u0101rnu, kurs, kai zvaigzneit\u00e1, spei\u1e11 tymsij\u0101
  b\u0101du kokt\u0101, kai e\u0146geleit\u0219 pr\u012bcynoj, slauka sku\u1e3fu osorys?
  I navi\u0146 tym\u0101 c\u012bm\u0101, a vys\u0101 apk\u014drtn\u012b zyn\u014dja
  par moz\u014dm b\u014drinei\u021bom. S\u012bv\u012btis, kam beja mozi b\u0101rni
  voi slimin\u012bks s\u0101t\u0101, mekl\u00e4ja, sauc\u00e1 iz sevim Zylaceiti voi
  Zaltga\u013cveiti i dr\u016b\u0161i iztic\u00e4ja j\u014dm sovus m\u012bl\u014dk\u016bs.
  Zyn\u014dja, ka niv\u012bns tai jauki napr\u012bcynoj, na\u0161yupoj  b\u0101rna,  niv\u012bns  tik  m\u012bleigi  naapk\u016bp  slym\u014d,  kai  t\u014ds
  \u1e3faitinis. I b\u014drineitis beja laimeigys. Laimeigys jut\u014ds na t\u014d
  de\u013c, ka j\u014ds var \u013caudim lobu dar\u00e4\u021b, bet j\u014dm r\u014dd\u00e4j\u00e4s,
  ka moz loba dora i grib\u00e4j\u00e4s v\u00e4\u013c vair\u014dk atn\u00e1s\u021b
  pr\u012bcys, jaukuma. T\u00e1 j\u014ds var\u00e4ja pr\u012bcyn\u014d\u021b tik apleicej\u016bs
  b\u0101rnus, a voi tod cytur nav b\u0101rnu? Voi ta cytur nav slymu?\\n\\n\u2014
  Zyni, m\u014dse\u0146, \u2014 run\u014dja Zylaceit\u00e1, \u2014 as dzierdieju,
  ka t\u012b aiz lel\u014d me\u017ea dzeivoj gudr\u014d \u00e7oceit\u00e1. \u012asim
  iz j\u016b. Jei izm\u014dc\u00e4s m\u0233sus, kai vair\u014dk loba dar\u00e4\u021b.\\n\\nKaid\u0101
  vosorys vokor\u0101, kod m\u014dtis jau beja atg\u014dju\u0161ys nu dorba i \u1e3faiti\u0146om
  vairs navajdz\u00e4ja \u0161yup\u014d\u021b, pr\u012bcyn\u014d\u021b j\u016bs b\u0101rnu,
  obejis atsas\u0101da iz sl\u012bk\u0161n\u00e1 i, v\u0101rdam\u014ds zvaigz\u0146\u014ds,
  run\u014dja, kai b\u0233tu vair\u014dk atn\u00e1s\u021b \u013caudim pr\u012bcys.\\n\\n\u2014
  Labi, \u012bsim, a voi m\u00e1\u0219 j\u016b atrassim? \u2014 \u0161aub\u00e4j\u00e4s
  Zaltga\u013cveit\u00e1.\\n\u2014 Mienesten\u0161 r\u014dd\u00e4s mums ce\u013cu,
  \u2014 dr\u016bsyn\u014dja Zylaceit\u00e1.\\n\u2014 Mienesten\u0161? A-a, eukur
  jys! Skot\u012bs, m\u014dse\u0146, cik mienesten\u0161 m\u012bleigi iz m\u0233sim
  ver\u0101s, \u2014 run\u014dja Zaltga\u013cveit\u00e1. \u2014 Varb\u0233\u021b padzierd\u00e1
  m\u0233su runu i aicynoj ar sevim. To \u012bsim. \u2014\\n\\n\u2014 \u012asim. \u2014\\n\\n\u1e3eaitinis,
  paj\u00e4m\u00e1 pa maizis gabalen\u00e1m, p\u014drm\u00e1t\u00e1 krystu i laid\u00e4s
  cel\u00e4. Ilgi j\u014ds g\u014dja pa t\u016b ce\u013cu, kur mienesten\u0161 maun,
  a ustabenis  vys  nar\u00e1dz\u00e4ja.  Jau  soka  \u0161aub\u00e4t\u012bs,  voi  atras\u0219  lob\u016b
  \u00e7oceiti. T\u00e1 stidzen\u00e1 beidz\u00e4s i umai \u1e3faitinis n\u016bst\u014dja
  pret mozu ustabeni. Tei gr\u012bz\u00e4s iz vystys k\u014djom. B\u014dl\u0233\u0219
  mienesten\u0161 n\u016bst\u014dja tai\u0161ni  viers  jumta.  \u1e3eaitinis  nasp\u00e4ja  atsaj\u00e4g\u021b,  kai  pret  sevim
  \u012braudz\u00e4ja \u013c\u016bti nagleitu v\u00e1ci. Tai beja gars, leiks daguns,
  treis\u016b\u0161s z\u016bds, siermi moti. Jei st\u014dv\u00e4ja iz sl\u012bk\u0161n\u00e1
  i treis\u016b\u0161om r\u016bkom tur\u00e4j\u00e4s aiz v\u0101zys. \u1e3eaitinis
  n\u016bzabeida. J\u014ds d\u016bm\u014dja, ka tei \u00e7oceit\u00e1 b\u0233\u0219
  gleit\u014dka. Zylaceit\u00e1 pa\u021b jau grib\u00e4ja raud\u014d\u021b nu bailis
  i Zaltga\u013cveit\u00e1 sl\u00e4p\u00e4s aiz m\u014dsys.\\n\\nV\u00e1ceit\u00e1
  pyrm\u014d s\u014dka run\u014d\u021b.\\n\\n\u2014 Nazabeistit, moz\u014ds. Zynu,
  k\u014d jiu\u0219 iz \u0161ani atg\u014djat, zynu, kai jiusus  sauc.  Tu  esi  Zylaceit\u00e1,  a  jei  \u2014  Zaltga\u013cveit\u00e1.  Redzit,
  nazabeistit.\\n\\nNiu \u1e3faitinis dr\u016bs\u014dk pazav\u00e4r\u00e1 i Zylaceit\u00e1
  teic\u00e1:\\n\\n\u2014 M\u00e1\u0219 grib\u0101tu, ka vysi b\u0101rni pr\u012bc\u014dt\u016bs.\\n\u2014
  \u00c7ocei\u021b, ka zyni, k\u014d m\u00e1\u0219 \u0161ur g\u014djam, to pasoki,
  kai vair\u014dk \u013caudim loba dar\u00e4\u021b, \u2014 run\u014dja Zylaceit\u00e1
  i Zaltga\u013cveit\u00e1 p\u012bbi\u013cd\u00e4ja:\\n\\nV\u00e1ceit\u00e1 pasmeign\u00e4ja
  i teic\u00e1:\\n\\n\u2014 Labi, moz\u014ds, b\u0233\u0219 kai jiu\u0219 grybot.
  Niu asot p\u012bkusu\u0161ys. \u012asim mun\u0101  ustaben\u012b.  T\u012b  labi  atsapyussit,  t\u012b  atrassit,  k\u014d  mekl\u00e4jat.
  V\u00e1ceit\u00e1 \u012bv\u00e1d\u00e1 \u1e3faitinis sov\u0101 ustaben\u012b. Ustaben\u00e1
  otkon soka gr\u012bzt\u012bs iz vystys k\u014djom, mienesten\u0161 pasmeign\u00e4ja
  i aizg\u014dja sovu ce\u013cu, a \u1e3faitinis iz c\u012bmu jau naatsagr\u012bz\u00e1.
  Kas ar j\u014dm n\u016btyka? Kur j\u014ds palyka? T\u014d niv\u012bns nam\u014dc\u00e4ja
  pasc\u00e4\u021b. Tik iz reita, kod b\u0101rni c\u00e4l\u00e4s i izskr\u00e4ja  \u014dr\u0101,  \u012braudz\u00e4ja,  ka  vysa  p\u013cova  kai  n\u016bs\u0101ta  zylom  i
  dzaltonom pu\u010dom. Kas p\u012bs\u00e4ja cik dau\u1e11z pu\u010dei\u0161u? Ekur
  pr\u012bcys! B\u0233\u0219 nu k\u014d vai\u0146uce\u0146us pei\u021b, b\u0233\u0219
  ar k\u016b pu\u0161k\u014dt\u012bs. I na vi\u0146 b\u014drinei\u0161u c\u012bma
  p\u013cov\u0101, a vysur, pa vysom p\u013covom, umai par v\u012bnu nakti p\u012bauga
  daudzums zylu, dzaltonu pu\u010du. A kur palyka Zylaceit\u00e1 ar Zaltga\u013cveiti?
  Kas atmin\u00e4s?\\n\\nAizb\u016brt\u012bs saulis spaits\\n\\nBeja \u013c\u016bti
  jauks agr\u014d z\u012bd\u016bn\u00e1 reits. Sauleit\u00e1 tik m\u012bly gl\u014dst\u00e4ja
  tik k\u016b nu zam lads v\u014dka atbreiv\u014dt\u016b z\u00e1mi, ka tei pakust\u00e4ja,
  leidz kai pazam\u016bda nu dzil\u00e1 m\u012bga i syut\u00e4ja sauleit\u00e1i pret\u012b
  sovus b\u0101rnus \u2014 za\u013cu z\u014dleiti, pumpurei\u0161us, da\u017eus z\u012bde\u0146us.\\n\\nJau
  vij\u014dleit\u00e1, vysbol\u00e1 i bolt\u014d viejineica c\u00e4l\u00e1 pret sauli
  sovys moz\u014ds ga\u013cvenis i sauleit\u00e1 m\u012bly t\u014ds sk\u016bpst\u00e4ja.
  Vysbol\u00e1 i bolt\u014d viejineica tai n\u016bm\u012b\u013c\u014dja sauleiti,
  ka, tai aizlai\u017e\u016bt\u012bs, skumeigi n\u016bk\u014dr\u00e1 ga\u013cvenis,
  sam\u012bdz\u00e1 skaist\u014ds lapenis, sl\u00e4p\u00e1 t\u014ds zam za\u013cu
  mietelei\u0161u i tai gaid\u00e4ja n\u014dku\u0161a reita. I kai tik reita sauleit\u00e1
  s\u014dka si\u013cd\u00e4\u021b, kai tik soka syut\u00e4\u021b sovus b\u0101rnus
  \u2014 mozus spaite\u0146us iz z\u00e1mi, jauki z\u012bdeni otkon palyka  pr\u012bceigi,
  c\u00e4l\u00e1  ga\u013cvenis  iz aug\u0161u,  v\u00e4r\u00e1  val\u012b  za\u013c\u016bs
  mietelei\u0161us i otkon skat\u00e4j\u00e4s saul\u00e1i ac\u012bs. I tai beja kotru
  reitu, kotru vokoru. Reit\u0101 Sauleit\u00e1-m\u0101men\u00e1 syut\u00e4ja mozus
  spaitus iz z\u00e1mi, iz pu\u010dei\u021bom, vokor\u0101, aiz\u012bdama aiz jyurenis
  v\u00e1d\u00e1 leidza sovus  m\u012blu\u013cus.  A  voi  zynot,  kas  \u0157aizi  n\u016btyka  ar  v\u012bnu  mozu
  spaiteni? Sauleit\u00e1-m\u0101men\u00e1, salasiejus\u00e1 \u0161ur tur izskraidieju\u0161\u016bs
  b\u0101rnus, jau \u012bs\u0101da zalta laiven\u012b i brauc\u00e1 par plot\u016b
  jyuru. Jau beja nato\u013c  \u016btr\u012bs  jyurys  krosts,  kod  Sauleit\u00e1  paman\u00e4ja,  ka  tryukst
  vysmoz\u014dk\u014d dielen\u00e1 luteklei\u0161a. T\u014d vysod sauleit\u00e1 stypri
  sorg\u014dja, jo moz\u014dk\u012bs spaiten\u0161 beja lels sovaidn\u012bks. Jys
  parosti takal\u00e4ja pa taidom z\u00e1mis male\u0146om, kur cyti, vac\u014dk\u012b
  br\u014dli nag\u014dja. Mozijam patyka, pareiz\u014dk \u017e\u0101l beja aplaistu
  staignu  p\u016bru i p\u013covu. Jys, b\u012b\u017ei vi\u0146, n\u016bst\u014dj\u0219
  kur iz kryusnenis voi iz p\u016bra molys kryuma zaren\u00e1 d\u016bm\u014dja, kai
  t\u014ds v\u012btenis \u012brus\u021b, kai skaistyn\u014d\u021b.\\n\\nBeja aicyn\u014dj\u0219
  da\u017eys pu\u010dis, a t\u014dm nazagrib\u00e4ja atst\u014d\u021b maig\u016b p\u013caveni
  voi skaist\u016b bierzeiti i ,ka kura paklaus\u00e4ja moz\u014d spaiten\u00e1, to
  ilgi naz\u012bd\u00e4ja, n\u016bl\u012bc\u00e1 ga\u013cveni, kryta p\u016bra z\u014dl\u012b
  i vairs nazac\u00e4l\u00e1.\\n\\n\u0156aizi jys tai aizad\u016bm\u014dja, ka pat\u0219
  nadzierd\u00e4ja Saulis-m\u014dtis sauc\u012bn\u00e1 i palyka iz kryusnenis tup\u0101dams.\\n\\nSpaiten\u0161  vairs  nazyn\u014dja  k\u016b  dar\u00e4\u021b.  Skot\u016bt\u012bs  iz  tuk\u0161u
  staignumu jam s\u014dp\u00e4ja moz\u014d sirsnen\u00e1.\\n\\nJau beja tymsa nakt\u0219,
  kod jys m\u016bd\u014ds nu sovom d\u016bmom. Grib\u00e4ja skr\u012b\u021b pec m\u014dtis
  i br\u014dlei\u0161u, a tyms\u0101 nazyn\u014dja cel\u00e1. Grib\u00e4ja sauk\u021b,
  a kas niu j\u016b dzierd\u00e4s? Saul\u00e1-m\u014dt\u00e1 ar cytim spaitenim jau
  se\u0146 du\u0219 aizjyuru sol\u0101. Spaiten\u0161 grib\u00e4ja raud\u014d\u021b,
  bet bolta, jauka burv\u00e1 n\u016bst\u014dja jam preteim, pac\u00e4l\u00e1 zalta
  viezeni, p\u012bzadyur\u00e1 pi spr\u016bg\u014dt\u014ds spaita ga\u013cvenis i
  teic\u00e1:\\n\\n\u2014 Moz\u016b spaite\u0146, as asu aplaist\u016b p\u013covu
  i p\u016bru va\u013cdineica. Tu vysod gribieji skaistyn\u014d\u021b munu nabadzeig\u016b
  kienisti i t\u014d pec as aizturieju tevi. Niu tu vysod paliksi t\u00e1 viers z\u00e1mis,
  skaistyn\u014dsi aplaist\u014ds, mitr\u014ds p\u013covys, p\u016brus i azaru molys,
  kur pu\u010dis naaug. \u0160udi\u0146 tu paliksi par plotu p\u016bra lopu z\u012bdu.
  \u2014\\n\\nBurv\u00e1 beidz\u00e1 run\u014d\u021b i moz\u012bs spaiten\u0161 nazkur
  izgaisa.\\n\\n\u016atr\u0101 reit\u0101, kod sauleit\u00e1 atleig\u014dja nu aiz
  plot\u014ds jyurys, tivle\u0146 s\u014dka mekl\u00e4\u021b moz\u014dk\u014d dielen\u00e1.
  Vyspyrms jei pazaskat\u00e4ja aplaistij\u0101 mitrij\u0101, staign\u0101 z\u00e1m\u012b,
  p\u013cov\u0101. Jai preti nu p\u013covys mitrum\u0101 c\u00e4l\u00e1 ga\u013cveni
  skaists, opols, p\u012bcom zalta lape\u0146om z\u012bden\u0161. Apleik ap moz\u016b
  z\u012bda sirsneni, leidzeigi saulis spaitim, st\u012bp\u00e4s pret sauli moz\u012b
  d\u012bdzeni. Z\u012bden\u0161 leidz kai run\u014dja iz sauli:\\n\\n\u2014 M\u0101me\u0146,
  as asu tovs moz\u014dk\u012bs dielen\u0161. Burv\u00e1 p\u014drmeja mani par z\u012bdu.
  Niu as nan\u016bskr\u012b\u0161u iz tevim, as vysod palik\u0161u t\u00e1, skaistyn\u014d\u0161u
  t\u014ds z\u00e1mis dalenis, kur cyti z\u012bdeni navar aug\u021b.\\n\\nI sauleit\u00e1
  n\u016bskupst\u00e4ja moz\u016b dieleni z\u012bdu, bet v\u012bna naatst\u014dja.
  V\u012bnum\u0101r syut\u00e4ja iz j\u016b br\u014d\u013cus spaitus i t\u012b st\u014dst\u00e4ja
  z\u012bden\u00e1m par vysu, k\u016b tik ce\u013coj\u016bt r\u00e1dz\u00e4ja. I z\u012bden\u0161
  auga, pr\u012bc\u014dj\u00e4s i smaid\u00e4ja.\\n\\nAtskr\u00e4ja  moz\u012b  c\u012bma  b\u0101rni  plyuk\u021b  plot\u014ds  p\u016bra  lopys,  jo
  g\u016btenis  t\u014ds  lobpr\u014dt  \u00e4d\u00e1.  Bet  cik  j\u012b  n\u016bzapr\u012bc\u014dja,  \u012braudzieju\u0161i
  skaistu zalta z\u012bdeni!\\n\\n\u2014 Nu kureinis tys z\u012bden\u0161? P\u016bra
  lopys nikod naz\u012bd\u00e4ja. Kai m\u00e1\u0219 t\u016b z\u012bdu n\u016bsauksim?\\n\u2014
  Tys kai sauleit\u00e1 spei\u1e11 \u2014 run\u014dja v\u012bna moza \u1e3faitineit\u00e1.
  \u016atra p\u012bbi\u013cd\u00e4ja:\\n\u2014 Ka tys izauga pi p\u016bra lapenis,
  to sauksim j\u016b par Purineni \u2014 sac\u00e4ja tre\u0161a, vac\u014dka \u1e3faitin\u00e1.\\n\u2014
  Labi, lai b\u0233\u0219 Purinen\u0161, \u2014 p\u012bkryta moz\u014dk\u014ds.\\n\\nNu  t\u014d  laika  kotru  godu,  kai  tik  sauleit\u00e1  n\u016bdzan  sn\u012bgu,
  izkausej  z\u00e1mi,  Purinen\u0161,  tys  aizb\u016brt\u012bs  saulis  spaiten\u0161,  pu\u0161koj
  mitr\u014ds, staign\u014ds p\u013covys i b\u0101rni ar pr\u012bcu plyuc t\u014d
  zalta z\u012bde\u0146us.\\n\\nKurs gon b\u0101rns, kura jaunova, jauneklis napazeist
  maigi zyl\u014ds rudzu pu\u010deitis, parosti pi m\u0233su par naktineicu sauktys?
  M\u012bl\u014d, jauk\u014d pu\u010deit\u00e1 pa lel\u014dkai dal\u00e1i ir par r\u012bbumu
  m\u0233su t\u0101vimz\u00e1mdarim  i  t\u012b  vysaid\u0101  zin\u012b  gryb\u0101tu  t\u016b  izskaus\u021b  nu  labeibys
  dryvom, t\u016bm\u0101r tys gondrei\u017e nav \u012bspiejams. A kai tei pu\u010deit\u00e1
  tyka labeib\u0101? Pazaklausit, k\u016b legenda st\u014dsta. \u0156aizi dzeiv\u014dja
  v\u012bnt\u016bleigs veceit\u0219. Ni jam beja rodu, ni draugu. Ilgi jys kleida
  pa pasauli, ilgi v\u014drg\u014dja, D\u012bvs apza\u017e\u0101l\u014dja i d\u00e1v\u00e1
  jam past\u014dveigu dzeivis v\u012btu \u2014 ustabeni syla mol\u0101 i kl\u014dt
  pi t\u014ds augleigys z\u00e1mis gabaleni. Veceit\u0219 \u012bg\u014dd\u014dja s\u00e1v
  g\u016bteni i sad\u016bm\u014dja z\u00e1mis gabaleni aps\u00e4\u021b ai labeibu.
  Jys d\u016bm\u014dja: g\u016bten\u00e1 d\u016b\u0219 ma\u0146 p\u012bnu, me\u017ea
  bit\u0219 san\u00e1s\u0219 madu, a z\u00e1m\u012b  izaug\u0219  maizeit\u00e1.  Gon  b\u0233\u0219  ma\u0146,  gon  nabogam  i  cel\u00e1
  g\u014djiejam. Apora jys z\u00e1meiti, aps\u00e4ja ai rudzim, apvylka sovu s\u0101tu
  i dryvu ai skuju \u017e\u016bgu i kotru d\u012bnu, sauleit\u00e1i l\u0101c\u016bt,
  g\u014dja apzav\u0101rtu i pr\u012bc\u014dj\u00e4s, \u012braudziej\u0219 ka  za\u013c\u014d  rudz-z\u014dleit\u00e1  aps\u00e1dz\u00e1  tyms\u016b
  z\u00e1mi. Atg\u014dja sn\u012bga m\u014dt\u00e1 i ai boltu vylnaineiti aps\u00e1dz\u00e1
  za\u013c\u016b rudz-z\u014dli. Tei aizmyga i gul\u00e4ja, cikom pavasara sauleit\u00e1
  t\u014ds naizm\u016bdyn\u014dja.\\n\\nNaktineica\\n\\nPavasar\u012b  ik  reit  veceit\u0219  g\u014dja  ap  sovu  driveni  i  pr\u012bc\u014dj\u00e4s
  r\u00e1dz\u0101dams, ka j\u014d rudz-z\u014dleit\u00e1 ai kotru d\u012bnu st\u012bp\u0101s
  garum\u0101, aug\\n\\nmaigi zal\u00e1. \u201eEk b\u0233\u0219 maizeit\u00e1!\\\"
  \u2014 d\u016bm\u014dja veceit\u0219. A nat\u016b d\u016bm\u014dja j\u014d \u012bnaidn\u012bks.
  Tik pazaklausit:\\n\\nTym\u0101 syl\u0101, po\u0161\u0101 b\u012bz\u016bkn\u012b,
  kur cylv\u0101ka k\u014dja nadreiks\u021b sp\u00e1r\u021b, kur  pa\u021b  putinen\u0161  i  g\u016bdeigs  me\u017ea  zvier\u0219  na\u012bt  \u2014  ai  leikumu
  s\u016b\u013c\u014ddams caur t\u016b v\u012btu, dzeiv\u014dja br\u012bsmeigs me\u017ea
  gors. Tik vylki i l\u014d\u010di dreikst\u00e4ja tyv\u014dt\u012bs j\u014d n\u016bmetn\u00e1i
  \u2014 cyts nikas. I taids t\u00e1v beja speitn\u012bks ka g\u016bdeiga cylv\u0101ka
  syla kl\u014dtb\u0233tn\u012b nac\u012bt\u00e1. Ka gad\u00e4j\u00e4s tyvum\u0101
  dz\u0101r\u014djs voi kaids palaidnis, to me\u017ea gors gr\u014db\u00e1 t\u016bs
  sov\u016bs nog\u016bs i tai n\u016bvolk\u014dja pa syla p\u016brim, syun\u014dk\u013com,
  ka nabogs vysu dzeivi p\u012bmin\u00e4ja. Sevi\u0161ki ai dz\u0101r\u014djim me\u017ea
  gors m\u012b\u013c\u014dja spiel\u00e4t\u012bs. N\u016bzamet\u0219 pr\u012bdis viersyun\u012b,
  vasalom d\u012bnom tup\u00e4ja i gaid\u00e4ja, kod kaids nu kr\u016bdzen\u00e1 streipu\u013c\u014ds
  caur sylu. Pamaniej\u0219 taidu tivlei\u021b apmygl\u014dja j\u014d ac\u0219 i vod\u014dja
  pa sovu sylu, pa syla sl\u00e1pn\u014dkom v\u012btom cikom beidz\u016bt \u012bv\u00e1d\u00e1
  dyun\u012b, kur naboga dz\u0101r\u014djen\u0161, \u012bgrim\u0219 leidz podu\u0219om,
  tup\u00e4ja leidz saulis l\u0101ktam, a me\u017ea gors dyuc\u00e1 apleik i sm\u00e4j\u00e4s.
  I vot, tys speitn\u012bks, me\u017ea gors, izzyn\u014dja, ka syla mol\u0101 veceleit\u0219
  n\u016bzamet\u0219 iz m\u012breigu dzeivi. Vyspyrms jys syut\u00e4ja sovu vadaklu
  \u2014 pal\u0101du. Tei vasalom naktim b\u013c\u014dv\u00e1 i nad\u00e1v\u00e1 vecei\u0161am
  gul\u00e4\u021b. A voi veceit\u0219 beis\u012bs pal\u0101dys?\\n\\nPazasm\u00e4ja
  par najauk\u016b t\u014ds b\u013cau\u0161onu i cik t\u014d. Me\u017ea gors r\u00e1\u1e11z,  ka  tys  naleidz,  skr\u012bn  pat\u0219.  Aplidoj  ustabeni,  driveni  i
  sm\u012bdam\u012bs \u012bzalai\u017e syla b\u012bz\u016bkn\u012b. I vecei\u0161a
  m\u012breig\u014d dzeiv\u00e1 beidz\u00e4s. S\u0101rga apmeklej j\u014d g\u016bteni
  tai, ka tik-tik izgl\u014db t\u016b; sazace\u013c v\u012bsul\u0219, n\u016braun
  ustabenis jumtu, sajauc \u017e\u016bgu, n\u016bgulda pr\u012bdi par ce\u013cu, kur
  vecei\u0161am j\u014d\u012bt, voi sajauc ol\u016bt\u0101 iudini. Veceit\u0219 vys
  nik\u014d. Zemn\u012bka dzeiv\u012b t\u014ds b\u0101dys jau nav nikaidys b\u0101dys.
  Ka tik maizeit\u00e1 augtu. A maizeit\u00e1 \u2014 salmen\u0161 salmen\u012b tik
  skaisti za\u013coj, mat v\u014drpys; teiri pr\u012bks pazav\u00e4r\u021b.\\n\\nKaid\u0101  reit\u0101,  kai  parosti,  veceit\u0219  izg\u014dja  apzav\u0101rtu  sovu
  labeibys dryvu. I \u2014 ak, tovu p\u016bstu, tovu nalaimi! Storp labeibys st\u012bbrei\u0161im,  kur  vi\u0146  ver\u012bs,  saaugus\u00e1  nar\u00e1dz\u0101ta  naz\u014dl\u00e1  i  taida
  zoroja, ka ai sovim zorim gryu\u017e t\u012bv\u016bs st\u012bbrei\u0161us iz vysom
  molom. Veceit\u0219 aizlauz\u00e1 r\u016bkys. Raudz\u00e4ja naz\u014dli izrev\u00e4\u021b,
  a kas t\u016b d\u00e1v\u00e1! Nu molys v\u00e4\u013c var\u0101tu, a \u012bbr\u012b\u0146
  tu, ci\u013cviece\u0146, dzi\u013c\u014dk! I k\u016b d\u012bna, naz\u014dl\u00e1
  tais\u014ds vys lel\u014dka, kupl\u014dka, a labeiba s\u014dk n\u012bku\u013c\u014d\u021b,
  dze\u013ct\u00e4\u021b. Veceit\u0219 atsas\u0101da iz ustabenis sl\u012bk\u0161n\u00e1,
  saj\u00e4m\u00e1 golvu i aizraud\u014dja. K\u016b niu \u00e4s\u0219 pat\u0219, k\u016b
  d\u016b\u0219 nabogam, k\u016b cel\u00e1 g\u014djiejam? Umai nu labeibys izatryuka  mozs,  pal\u0101ks  putinen\u0161  i  trallyn\u014ddams,  zvaneidams
  pazac\u00e4l\u00e1  gais\u0101.  Veceit\u0219  pac\u00e4l\u00e1  golvu,  ver\u0101s,  \u2014  ceiruleit\u0219  pi
  padebe\u0161im skandynoj D\u012bvam dz\u012bsmeni. Saprota veceit\u0219 pi k\u014d
  b\u0101d\u014ds  paleiga  j\u014dmeklej  i  atv\u0101l\u0101dams  sevi  Vysuaugst\u014dkijam,
  atviel\u00e4ja jam i sovu labeibys driveni. Iz\u0157aizis jam palyka v\u012bg\u013c\u014dk
  i m\u012breigu pr\u014dtu g\u014dja iz nakt\u0219 dusu. Gu\u013c veceit\u0219 i
  nazyna, kas j\u014d driven\u012b n\u016bteik. Vot, atsadar\u00e4ja sp\u016b\u017ei
  dabasi i pulks boltu e\u0146ge\u013cu n\u016bzalaid\u00e1  vecei\u0161a  driven\u012b.  Teir\u012bs  dabass  zylgoj,  mienesneica
  maun pa t\u014d zylumu i syuta b\u014dlus spaitus iz gu\u013c\u016b\u0161u z\u00e1mi,
  a bolt\u0233 dabasu gori ai sovom caurspeid\u016b\u0161om r\u016bkom jem dabasu
  zylumu i kaisa pa naz\u014d\u013com. Tai j\u012b str\u014dd\u014dja leidz austrai.
  Izl\u00e4c\u00e1 austra \u2014 reita zvaigzneit\u00e1, i e\u0146geli dz\u012bd\u014ddami
  aizlid\u014dja. Sauleit\u00e1i l\u0101c\u016bt, veceit\u0219 p\u012bzac\u00e4l\u00e1
  i, p\u014drmet\u0219 krystu, g\u014dja apzav\u00e4r\u021b driveni. I \u2014 ak,
  tovu breinumu! Voi dabasu zylums n\u016bzalaid\u012bs iz z\u00e1mi? Ik naz\u014dlis
  zaren\u012b, kai zyl\u014d dabasu acten\u00e1, spei\u1e11 skaists zyls z\u012bden\u0161.
  Z\u012bde\u0146u skaistums  tai  aizgr\u014db\u00e1  vecei\u0161a  sirdi,  ka  aizmiers\u0219  b\u0101dys  jys
  atsam\u00e1t\u00e1 iz celim i dz\u012bd\u014dja D\u012bvam pateiceibys dz\u012bsmi,
  teikdams:\\n\\nI leidz \u0161ai d\u012bnai dail\u012b, zyl\u0233 z\u012bdeni pr\u012bcynoj
  moze\u0146\u016bs i jau nav\u012bnu izgl\u014db\u00e1 nu bods n\u014dvis.\\n\\n\u201eP\u012bd\u016bd  ma\u0146,  Radeit\u014dj,  munys  napr\u014dteig\u014ds  ba\u017eys.  V\u014djs
  cylv\u0101ks asu i b\u012b\u017ei naizpr\u016btu Tovu ce\u013cu. Tu i \u013caunu
  m\u014dki p\u014drv\u00e4rs\u021b par lobu. Lai tod \u0161\u012b dabasu z\u012bdeni
  pr\u012bcynoj i aplaimoj z\u00e1mis v\u014drgu\u013cus\\\".\\n\\nVot,  pa  lelys  pi\u013cs\u0101tys  \u012blu  \u012bt  v\u00e1cineit\u00e1.  Sakrypu\u0161\u014ds  r\u016bk\u014ds
  ryupeigi  nas  skalini.  Tym\u0101  rudzu  pu\u010deitis.  Bogot\u012b  pi\u013cs\u0101tn\u012bki,
  sevi\u0161ki jauni cylv\u0101ki, b\u0101rni n\u016bpierk pu\u010deitis i v\u00e1cineit\u00e1i
  ir maiz\u00e1. Pa \u012blu tak, voi kur pi styura st\u014dv skrondaina \u1e3faitin\u00e1
  i r\u016bce\u0146\u014ds tur zylu  pu\u010du  sainei\u0161us.  Zyl\u014ds  b\u0101rna  actenis  lyudz\u016b\u0161i  skot\u014ds  iz
  caurg\u014djiejim. T\u012b sapr\u016bt m\u0101mu ocu lyug\u0161onu, n\u016bpierk
  zyl\u014ds rudzu pu\u010deitis i b\u0101rns pr\u012bceigs tak iz m\u014djom, kur,
  varb\u0233\u021b, slym\u014d m\u014dt\u00e1 gaida  maizis  gabalen\u00e1.  Tai  dai\u013c\u014d  pu\u010deit\u00e1,  m\u0233su  taut\u0101  par
  naktineicu saukta, jau na v\u012bnam n\u00e1s\u00e1 svieteibu.\\n\\nVysbolis\\n\\nSolts
  z\u012bmys reits. Vieji gaudoj, sn\u012bgu koponys dzan. Tyms\u012bs syls \u017eieleigi
  \u0161\u0146\u014dc, vai\u1e11, \u0161a\u013ctim k\u016bku zori brak\u0161 \u2014
  t\u00e1 vac\u012bs Lauzka mieginoj  sp\u0101ku.  Lauzkam  gara, bolta  b\u014drda,  pylna  speid\u016b\u0161u
  vyzu\u013cu,  zei\u013cu.  Golv\u0101  sn\u012bga  capur\u00e1.  Borg\u012bs  vec\u0219,  pastaig\u014dj\u0219  pa
  me\u017eu, palauziej\u0219 k\u016bku s\u014dnkau\u013cus, \u012bleida sov\u0101
  lads pil\u012b drusku atsapyust.  Par  atpyutys  laiku  syut\u00e4ja  sovu  mozu  unu\u010dku,
  Sn\u012bgputeiti, apzav\u00e4r\u021b: voi j\u014d pava\u013cstn\u012bki labi dorboj\u0101s.
  Sn\u012bgputeit\u00e1 laimeiga  sprukus\u00e1  nu  vact\u0101va  pil\u0219,  kur  na  c\u012b\u017e  m\u012b\u013c\u014dja  palik\u021b,
  lakst\u00e4ja  kai  putinen\u0161.  \u0160a\u013c\u021bom  \u012bk\u014dp\u00e1  augst\u014ds  pr\u012bdis  viersyun\u012b,
  \u0161a\u013ctim izskr\u00e4ja iz plot\u014d bolt\u014d teiruma, voi otkon takal\u00e4ja
  pa me\u017ea b\u012bzumu.  \u0160udi\u0146  sevi\u0161ki  jai  patyka  skraid\u00e4\u021b  pa  klus\u014dm  me\u017ea
  stidze\u0146om. T\u00e1 nikas j\u014ds m\u012bra natrauc\u00e4ja, nikas naapskaud\u00e1
  j\u014ds bolt\u016b sv\u014drce\u0146u i zyl\u016b acte\u0146u. Breineigi gon r\u014dd\u014ds,
  ka Sn\u012bgputeit\u00e1i zylys actenis. Bet pi j\u014ds bolt\u016b sv\u014drku
  t\u014ds \u013c\u016bti gleiti izaskat\u00e4ja i vact\u0101vs  Lauzka  sevi\u0161ki  t\u014ds  actenis  m\u012b\u013c\u014dja.  Acte\u0146u  de\u013c  jys  t\u016b
  mozuli sorg\u014dja kai vyslel\u014dk\u016b d\u014drgumu i m\u012b\u013c\u014dja
  \u1e3faitini tik stypri, ka nikod nik\u014d jai naatteic\u00e1. K\u014d tik Sn\u012bgputeit\u00e1
  grib\u00e4ja, t\u016b dab\u014dja. Nabeja jau tys Lauzka v\u012bnk\u014dr\u0161\u012bs
  vec\u0219; jys tak beja vareigs karal\u0219, a\\n\\nSn\u012bgputeit\u00e1  beja
  moza princes\u00e1. Princes\u00e1i beja dau\u1e11z kolpu i kolpyu\u0146u, sevi\u0161ki
  jai patyka viejen\u0161, kurs, leidzeigi vys\u014dtr\u014dkijam zyrgam  j\u016b
  vyzyn\u014dja,  nos\u014dja  pa  kolnim,  l\u012bk\u0146om,  par  azarim  i u\u1e55om,
  pa lelym me\u017eim, pa\u021b n\u00e1s\u00e1 j\u016b par plot\u016b jyuru. \u0160ys
  ce\u013c\u0161 Sn\u012bgputeit\u00e1i  sevi\u0161ki  patyka.  Tik  iz  d\u012bnvydim  i  d\u012bnvydvokorim
  viejen\u0161 j\u014ds nan\u00e1s\u00e1. Tym\u014ds mol\u014ds dzeiv\u014dja Korstums
  \u2014 myu\u017eeig\u012bs Lauzkys \u012bnaidn\u012bks.\\n\\nTys,  pamaniej\u0219  skaistu  Lauzkys  unu\u010dku,  lyktu  j\u016b
  n\u016bsleicyn\u014d\u021b, voi pa\u021b izkaus\u00e4\u021b kai zalta gobolu. K\u016b
  tod biedeig\u012bs vec\u0219 dareitu? Ar Sn\u012bgputeitis n\u014dvi jam b\u0233tu
  j\u014dmierst; ve\u010da sird\u0219 nu \u017e\u0101luma  p\u014drpleistu  kai  pleist  klint\u0219  nu  j\u014d  ciert\u012bn\u00e1.  Viejam
  styngri aizl\u012bgts iz t\u012bni princeseiti nos\u014d\u021b.\\n\\nK\u016b tod
  jei atroda? \u1e3eaitineiti appleisu\u0161u, pl\u014dn\u014ds dr\u00e4bj\u014ds
  g\u0101rbtu, zylom sastyngu\u0161om r\u016bce\u0146om, boltu vaigu, izraud\u014dtom
  acte\u0146om. Lob\u014ds Sn\u012bgputeitis sirdi sam\u012bdz\u00e1 \u017e\u0101lums.
  \u1e3eaitineit\u00e1 beja j\u014ds auguma i r\u014dd\u012bs na vac\u014dka par v\u012bnpadsmit
  godu.\\n\\nA \u0161udi\u0146 Sn\u012bgputeit\u00e1 palaid\u00e1 Vieji atpyut\u0101
  i po\u0161a m\u012breigi staig\u014dja pa me\u017eu. Nazkas j\u016b vi\u013ckti\u0146
  vylka vys t\u014d\u013c\u014dk i t\u014d\u013c\u014dk me\u017e\u0101. Umai Sn\u012bgputeit\u00e1
  n\u016bst\u014dja cel\u00e4: izdzierd\u00e4 nazk\u016b raud\u016bt. Maneigi n\u016bzaklausiejus\u00e1,
  g\u014dja iz t\u012bni, nu kureinis atskan\u00e4ja gau\u017eys raudys.\\n\\n\u2014
  K\u014d raudi, moz\u014d, voi cel\u00e1 nazyni? vaic\u014dja princeseit\u00e1.\\n\\n\u1e3eaitin\u00e1
  pazav\u00e4r\u00e1 iz bolt\u014ds princeseitis i r\u014dd\u012bs, m\u012bl\u0233
  v\u014drdi j\u016b drusku sasi\u013cd\u00e4ja. \u012azadr\u016bsyn\u014djus\u00e1  moz\u014d
  s\u014dka st\u014dst\u00e4\u021b.\\n\\nAsu b\u014drineit\u00e1. Dzeiv\u014dju pi
  pam\u014dtis. Pam\u014dt\u00e1 vysai\u017e mani m\u016bka, dzan pi gryutim dorbim,
  a \u00e4s\u021b d\u016bd sakoltu\u0161ys maizis gor\u016bzys i soltu iudini. Apzagierb\u021b
  ma\u0146 nav ar k\u016b, redzi lupotys vi\u0146 krot\u014ds, bet t\u014ds ni-ni
  nasylda. Tam laikam eist\u014d pam\u014dtis \u1e3faita staigoj  zeid\u016bs  i  cau\u0146u  ka\u017euk\u016bs,  kai  kaida  princes\u00e1  i  nik\u014d
  nastr\u014ddoj. \u0160udi\u0146 jai \u012bzagrib\u00e4ja pu\u010du. Pam\u014dt\u00e1
  padzierdus\u00e1 sovys \u1e3faitys vielei\u0161on\u014ds, tivle\u0146 lyka ma\u0146
  \u012b\u021b iz me\u017eu pu\u010du makl\u0101tu. A kur to as t\u014ds pu\u010dis
  lai jemu? Me\u017e\u0161 n\u016bgrim\u0219 zam sn\u012bga, z\u00e1m\u00e1 lad\u0101
  \u012bkolta. Kur t\u00e1 pu\u010dom aug\u021b? A bez pu\u010du as nadreikstu iz
  m\u014djom gr\u012bzt\u012bs. I \u1e3faitin\u00e1 otkon s\u014dka raud\u014d\u021b.\\n\\n\u2014
  T\u00e4tei\u021b, kur \u012bsi? \u2014 jei m\u012bly vaic\u014dja,\\n\u2014 Naraudi,
  b\u014drinei\u021b, aizrun\u014dja Sn\u012bgputeit\u00e1, \u2014 ma\u0146 tev\u0219
  \u017e\u0101l. Pagai\u1e11, varb\u0233\u021b as varei\u0161u t\u00e1v k\u016b paleidz\u00e4\u021b.
  Pagaidi it\u00e1 zam pr\u012bdis. \u0160a muns bolt\u0233\u0219 ka\u017eucen\u0161,
  sedz\u012bs, tod nan\u016bsa\u013csi. As skr\u012b\u0161u iz vact\u00e4ti. Jys ir
  gudrs, vysu zyna, jys pasc\u00e4s, kur pu\u010deitis z\u012b\u1e11.\u2014 Sn\u012bgputeit\u00e1,
  apsagus\u00e1 moz\u016b b\u014drini, aizskr\u00e4ja iz karal\u00e1 Lauzkys pili.  Lauzka  pa\u0161ulaik,  sab\u016bz\u0219  b\u014drdu,  grib\u00e4ja  \u012b\u021b  mekl\u00e4\u021b  sovys
  unu\u010dkys; jam garlaiceigi bez j\u014ds palyka. Sn\u012bgputeit\u00e1 satyka
  j\u016b iz sl\u012bk\u0161n\u00e1.\\n\u2014 Vajag, \u1e3faiti\u0146, pazav\u00e4r\u021b,
  k\u016b me\u017e\u0161 dora, voi nav \u012bs\u014dc\u0219 j\u016bk\u014d\u021b.
  Tod gon as jam par\u014ddei\u0161u...\\n\u2014 Vact\u00e4tei\u021b, na\u00e1j \u0161udi\u0146
  \u2014 lyudz\u00e4s Sn\u012bgputeit\u00e1 \u2014 ma\u0146 vajag ar tevi parun\u014d\u021b.\\n\\nVacijam
  gon nazagrib\u00e4ja s\u00e4d\u00e4\u021b lads pil\u012b i skait\u00e4\u021b zvaigznis;
  jam lob\u014dk patyka staig\u014d\u021b pa me\u017eu i sp\u0101k\u014dt\u012bs ar
  lel\u0233m k\u016bkim, kuri zam j\u014d sk\u016bpstu brak\u0161\u00e4ja vi\u0146,
  bet princeseit\u00e1 tik jauki run\u014dja, m\u012blyn\u014dj\u00e4s, ka vacijam
  sameik\u0161a sird\u0219. Jys n\u016bzalaid\u00e1 iz vyzu\u013c\u014dju\u0161\u014d
  lads s\u016bla i Sn\u012bgputeit\u00e1 v\u012bgli n\u016bzam\u00e1t\u00e1 pi j\u014d
  k\u014djom. Jei s\u00e4d\u00e4ja iz moza meiksta, bolta krieslen\u00e1, kai jau
  mozai princeseit\u00e1i p\u012bdar.\\n\\nLauzka  to  jau  nimoz  nagaid\u00e4ja.  Pu\u010du  laiks  jam  na  pa
  pr\u014dtam. Jys savylka p\u012bri i dryumi teic\u00e1.\\n\\n\u2014 Vact\u00e4tei\u021b,  kod  pu\u010deitis  z\u012bd\u00e4s?  \u2014  umai  pavaic\u014dja
  Sn\u012bgputeit\u00e1.\\n\u2014 Pu\u010dis, pu\u010dis, kam t\u00e1v t\u016bs pu\u010du
  vajag. Voi ta tovi sv\u014drceni naz\u012b\u1e11 kai bolt\u014dk\u014d d\u012bnvydu
  lileja i voi tovys actenis naspei\u1e11, kai zyl\u014d vysbol\u00e1.\\n\u2014 Vysbol\u00e1?
  Kas tei taida? As naasu vysbolis redziejus\u00e1, pasok kod vysbol\u00e1 z\u012bd\u00e4s
  \u2014 lyudz\u00e4s moz\u014d.\\n\u2014 Oi \u1e3faiti\u0146, nazyni k\u014d gribi!
  T\u00e1v nav breivi iz vysbo\u013com v\u00e4rt\u012bs, run\u014dja vec\u0219. Moz\u014d
  princes\u00e1 \u0161\u016b\u0157aizi tik uzb\u014dzeigi lyudz\u00e4s, ka gol\u0101
  Lauzka, gl\u014dsteidams j\u014ds ga\u013cveni, teic\u00e1:\\n\u2014 Princesi? Voi
  ir v\u00e4\u013c kaida princes\u00e1? K\u014d de\u013c nikod ma\u0146 par j\u016b
  napast\u014dsti? Varb\u0233\u021b jei ma\u0146 par draudzini b\u0233tu, tod as v\u012bntuleigi
  nastaig\u014dtu.\\n\u2014 \u1e3eaiti\u0146, vysbolis i pec tam cytys pu\u010dis
  z\u012bd\u00e4s tod, kod r\u00e1dz\u00e4s sovu princesi breivu.\\n\u2014 N\u0101,
  bierne\u0146, gryu\u0161i n\u016bzapyusdams run\u014dja Lauzka. \u2014 Tei princes\u00e1
  ir vyslel\u014dka muna i tova \u012bnaidn\u012bc\u00e1. \u0156aizi ma\u0146 pazaveic\u00e1
  j\u016b paveik\u021b  i \u012bsl\u016bdz\u00e4\u021b c\u012btum\u0101.  Niu  nav
  k\u014d  beit\u012bs, nikas  mums nadrau\u1e11. C\u012btuma durovys ir styprys i
  atsl\u0101ga pi man\u0219. Nikas nu c\u012btuma j\u014ds naizlais\u0219.\\n\\n\u2014
  I kai tei princes\u00e1 izaskota? Past\u014dsti, kai jei izaskota? Voi ir tik pa\u021b
  bolta kai as? Voi tei princes\u00e1 b\u014dri\u0146u \u017e\u0101loj?\\n\u2014 Otkon
  n\u012bkus izgudr\u014dji! Nu kureinis tu zyni par b\u014drinim? Voi t\u00e1v kas
  st\u014dst\u00e4ja? M\u0233su apk\u014drtn\u012b jau taidu nav, \u2014 run\u014dja
  Lauzka.\\n\u2014 Nav? Nu kureinis atg\u014dja taida moza, lupot\u014ds gierbta,
  v\u014dja \u1e3faitineit\u00e1?  Satyku  j\u016b  me\u017e\u0101  iz  kolna.  St\u014dsta,  ka  \u0161\u016b  pam\u014dt\u00e1
  padzynus\u00e1 iz me\u017eu pec pu\u010du. Ma\u0146 tyka \u017e\u0101l nabadzis;
  as aps\u016blieju n\u016bv\u00e1s\u021b j\u016b iz pu\u010dom, tik pyrm\u014dk atskrieju
  \u0161ur, izzyn\u014d\u021b, kur t\u014ds pu\u010dis aug. Vact\u00e4tei\u021b, past\u014dsti,
  past\u014dsti, cytaidi pam\u014dt\u00e1 \u1e3faitini n\u016bsis\u0219, \u2014 lyudz\u00e4s
  bolt\u014d princeseit\u00e1.\\n\\nNiu Lauzka sab\u016bz\u00e1 p\u012bri, pagl\u014dst\u00e4ja
  b\u014drdu i, borgi v\u0101rdam\u012bs iz me\u017eu, run\u014dja:\\n\\n\u2014 Tai
  jau t\u014ds pam\u014dtis i dora. Pag, as gon j\u016b pam\u014dcei\u0161u. \u0160\u016bpa\u021b
  nakti \u012b\u0161u ar rungu iz j\u014ds m\u014dji; zyn\u014d\u0219, k\u016b zeimoj
  pa\u1e3faitu v\u014drdzyn\u014d\u021b.\\n\u2014 Vact\u00e4\u021b, i kas b\u0233\u0219
  ar b\u014drineiti? Voi jei pu\u010dei\u0161u nadab\u014d\u0219? Pasok, kur pu\u010deitis
  aug. Cikom tu str\u014dpeisi pam\u014dti, as n\u016bves\u0161u \u1e3faitini iz pu\u010dom.\\n\u2014
  Iz  pu\u010dom  t\u00e1v  navar.  Gol\u0101  pu\u010dis  tik  tod  z\u012bd\u00e4s,  kod
  \u012bsl\u016bdzeit\u014d princes\u00e1 tik\u0219 nu c\u012btuma, a t\u014ds as
  nalais\u0161u val\u012b.\\n\u2014 Vact\u00e4tei\u021b,  lyudzams,  pa\u017e\u0101loj  b\u014drineitis,  palai\u1e11
  pu\u010du princesi  val\u012b.  D\u016b\u1e11 ma\u0146  atsliedzeni,  as  n\u016btecei\u0161u  iz  c\u012btumu  i
  palais\u0161u j\u016b.\\n\\n\u2014 Apreibi moz\u014d! Tu v\u00e4\u013c nazyni, ka
  kai tik pu\u010du princes\u00e1 tik\u0219 nu c\u012btuma, t\u00e1v b\u0233\u0219
  j\u014dmierst i ma\u0146 j\u014d\u012bt iz t\u014dlej\u016b molu, a it\u014d jau
  navar p\u012blais\u021b, \u2014 run\u014dja  Lauzka  i, pavylkdams  Sn\u012bgputeiti  aiz
  r\u016bkys, turpyn\u014dja: \u2014 lob\u014dk \u0161ur\u00e1j past\u014dsti ma\u0146,
  k\u016b vieji svi\u013cpoj.\\n\\nNiu  vac\u012bs  Lauzka  atsazv\u00e4l\u00e1  iz  vyzu\u013coj\u016b\u0161\u014ds  koponys,
  Sn\u012bgputeit\u00e1 atsas\u0101da iz moz\u014d bolt\u014d krieslen\u00e1 i st\u014dst\u00e4ja,
  k\u016b vieji svi\u013cpoj. Zam maig\u014d princesis bolsa vec\u0219 aizsnaud\u00e1
  i naman\u00e4ja, kai c\u012btuma atsl\u0101ga izkryta jam nu oz\u016btis. Princeseit\u00e1
  drei\u017e pagiva t\u016b i n\u016bp\u012btni apskat\u00e4ja. Iz atsl\u0101gys beja
  raksteits: \u201eSaulis pu\u010du princesis c\u012btuma atsl\u0101ga. C\u012btums
  aug\u0161i padebe\u0161\u016bs.\\\" K\u014d ta vair\u014dk? Sn\u012bgputeit\u00e1
  pazav\u00e4r\u00e1 iz sova vact\u0101va, kurs jau tik stypri aizmyga, ka s\u014dka
  kr\u014dk\u021b.\\n\\nT\u00e1 vac\u012bs \u012bg\u014dja sov\u0101 pil\u012b i \u012bv\u00e1d\u00e1
  t\u012b n\u016bskumu\u0161\u016b Sn\u012bgputeiti. Mozijai \u013c\u016bti grib\u00e4j\u00e4s
  gl\u014db\u021b b\u014drineiti, kas t\u012b me\u017e\u0101 zam pr\u012bdis gaida.
  Labi, ka pasv\u012bd\u00e1 jai sovu bolt\u016b ka\u017euceni, cytaidi b\u014drin\u00e1
  b\u0233tu n\u016bsolus\u00e1.\\n\\n\u2014 Tys labi. Cikom vact\u0101vs gu\u013c,
  jys parosti gu\u013c \u013c\u016bti ilgi, as varei\u0161u n\u016bskr\u012b\u021b
  i ko\u010d iz breidei\u0161a palais\u021b pu\u010du princesi, \u2014 d\u016bm\u014dja
  Sn\u012bgputeit\u00e1,\\n\\nNiu jei cel\u00e4s nu sova krieslen\u00e1, lieni, klusu
  izsleid\u00e4ja nu vact\u0101va  pil\u0219  i,  s\u0101dus\u00e4s  v\u012bgl\u014d  viejen\u00e1  mugor\u0101,  aizlid\u014dja  iz
  padebe\u0161u c\u012btumu, kur beja pu\u010du princes\u00e1 sl\u0101gta. Jei lieni,
  lieni, p\u012bzatyv\u014dja  pi  c\u012btuma  durovom,  \u012blyka  atsliedzeni,  atdar\u00e4ja...
  Nazkas paspeid\u00e4 j\u014ds ac\u012bs. T\u00e1 princes\u00e1 Saul\u00e1, jauka,
  smaid\u016b\u0161a, skaistim garim zalta motim cel\u00e4s nu tymsa kokta i ar pateiceibu
  g\u014dja  skupst\u00e4\u021b  moz\u016b  Sn\u012bgputeiti.  Sn\u012bgputeit\u00e1  naizc\u012bt\u00e1  pu\u010du
  princesis  sk\u016bpsta.  Jei  s\u014dpeigi  aizvaid\u00e4ja,  apgeiba  i  kai  bolts
  tvaiku m\u014dkuleit\u0219  n\u016bkryta  z\u00e1m\u012b. I breinums; n\u016bkryta  tai\u0161ni  pi
  moz\u014ds b\u014drinis k\u014djom.\\n\\nI kur palyka bolt\u0233\u0219 princesis
  ka\u017eucen\u0161? Tys nazkur izput\u00e4ja, tik nu aug\u0161\u012bnis, pu\u010du
  princes\u00e1 Saul\u00e1, smaideidama sk\u016bpst\u00e4ja b\u014drinis golvu, si\u013cd\u00e4ja
  moz\u014ds r\u016bcenis, ar kurom tei niu plyuc\u00e1 pu\u010deitis.  Me\u017ea  b\u012bzum\u0101  nazkas  kai  mierdams  aizvaid\u00e4ja:  \u2014
  \u201eSn\u012bgputei\u021b, \u1e3faiti\u0146, tovys actenis...\\\"\\n\\nB\u014drin\u00e1
  skot\u014ds apleik i breinoj\u0101s: me\u017ea ka\u013cnen\u0161, t\u014d\u013c\u014dk
  l\u012bkn\u00e1 zil\u00e4\u021b zi\u013c nu skaistom vysbolei\u021bom. Kod t\u014ds
  izauga?\\n\\nT\u014ds zyl\u014ds vysboleitis beja Sn\u012bgputeitis actenis.\\n\\nSudobra
  lileja\\n\\nLela  azara  krost\u016bs  snaud\u00e1  vac\u012bs  syls.  Syl\u0101  beja  moza
  m\u014djen\u00e1, sylnom n\u016baugu\u0161u jumtu. M\u014djen\u012b viz\u00e4ja
  divi sudobr\u014dtys gaismys. V\u012bnu izstor\u014dja lileja, kas v\u012bnm\u0101r
  z\u012bd\u00e4ja mozij\u0101 l\u016bdzen\u012b, a \u016btra sudobr\u014dt\u014d
  gaisma g\u014dja nu sierm\u012bm vecei\u0161a motim. Veceits beja glu\u017ei v\u012bns
  ar sovu na\u0161kiram\u016b draudzini, sudobra lileji. Tei v\u012bnm\u0101r smar\u017e\u014dja,
  viz\u00e4ja i pr\u012bcyn\u014dja v\u012bntu\u013c\u016b veceiti. Apleik azaram,
  syla izciertum\u016bs i leidzonum\u016bs v\u012bna \u016btrai c\u012b\u017ei glaud\u00e4s
  kl\u014dt c\u012bmotu m\u014djenis. Tym\u014ds dzeiv\u014dja lobi cylv\u0101ki.
  J\u012b vysi m\u012b\u013c\u014dja sierm\u016b v\u012bntuli i apbrein\u014dja j\u014d
  sudobra lileji. Da\u017eim lyk\u014ds, ka lileja ir m\u014dksleigi daryn\u014dta
  nu teira sudobra, da\u017ei otkon skaidri r\u00e1dz\u00e4ja, ka tei ir dzeiva, v\u012bnm\u0101r
  z\u012bd\u016b\u0161a i smar\u017eoj\u016b\u0161a pu\u010d\u00e1. Niv\u012bns nazyn\u014dja,
  nu kureinis veceits ir atg\u014dj\u0219 i kaids jam v\u014drds. Niv\u012bns i nasaprota,
  kai veceits  spiej\u0219  izaudzyn\u014d\u021b  tik  breini\u0161keigu  pu\u010di.  A  vaic\u014d\u021b  j\u012b
  navaic\u014dja.\\n\\nVeceit\u0219 beja j\u012bm lobvieleigs, kotram sn\u00e4dz\u00e1
  paleiga r\u016bku, kotru pr\u012bcyn\u014dja b\u0101d\u014ds, pac\u00e4l\u00e1 gor\u0101,
  sam\u012bryn\u014dja naidin\u012bkus. Kura\\n\\nsird\u012b  \u012bstor\u014dja  breini\u0161keig\u014ds  lilejis  gaisma,  tys  jut\u014ds  laimeigs,
  palyka pr\u012bceig\u014dks i lob\u014dks.\\n\\nS\u014dkum\u0101 c\u012bmotu \u013caud\u0219
  sauc\u00e1 veceiti par gudr\u016b v\u012bntuli, a v\u0101l\u014dk s\u014dka sauk\u021b
  \u0161aidi: \u201eM\u0233su lob\u012bs v\u012bntul\u0219\\\". Lobs jys beja i \u0161ys
  v\u014drds jam c\u012bneigi p\u012bder\u00e4ja. Nabeja niv\u012bn\u0101, kuram veceits
  b\u0233tu p\u014dri dariej\u0219. Iz j\u014d lyupom v\u012bnm\u0101r r\u016bt\u014dja
  lobvieleibys smaids, dabasu zylyj\u014ds ac\u012bs mirdz\u00e4ja naizseikst\u016b\u0161a
  tyv\u014dk\u016b m\u012blesteiba. Ka pi vecei\u0161a atv\u00e1d\u00e1 kaidu n\u016bz\u012bdzn\u012bku,
  i tod m\u012blesteiba naizdzysa nu j\u014d  acim.  Tik  tym\u014ds  pamirdz\u00e4ja  dzidrys  osoru  pierlis.  Veceit\u0219
  bu\u010d\u014dja n\u016bz\u012bdzn\u012bka p\u012bri i j\u014d osoru pierlis kryta
  tam iz golvys. Sajut\u0219 sylt\u016b volgumu, n\u016bz\u012bdzn\u012bks pazemeigi
  l\u012bc\u00e1 golvu i satr\u012bktu sirdi izzyna sovys vainis. Vecei\u0161a osorys
  mozg\u014dja n\u016bz\u012bdzn\u012bka sirdi. Vys\u0101 atjaun\u014dts, jys atsagr\u012bz\u00e1
  s\u0101t\u0101 i dzeiv\u014dja pr\u012b\u0161kzeimeigi.\\n\\nT\u014dl\u014dku c\u012bmotu
  \u013caud\u0219 b\u012b\u017ei \u012blyudz\u00e1 veceiti pi sev\u00e1. Jys g\u014dja
  lobpr\u014dt, n\u00e1s\u00e1 pr\u012bcu t\u012b, kur plyud\u00e1 b\u0101du osorys,
  n\u00e1s\u00e1 m\u012bru i saticeibu t\u012b, kur \u012bnaids  pl\u00e4s\u00e1  \u013cau\u017eu  sird\u0219.
  Sudobra  lileja  gon palyka m\u014djen\u012b pi l\u016bga, bet breini\u0161keig\u012bs
  t\u014ds sm\u014drds i sp\u016b\u017eums g\u014dja vecei\u0161am leidza. Niv\u012bnam
  na\u012bg\u014dja pr\u014dt\u0101 zag\u021b breini\u0161keig\u016b pu\u010di. Vysi
  m\u012b\u013c\u014dja veceiti i pa j\u014d pr\u016bmb\u0233\u0161onys laiku sorg\u014dja
  j\u014d v\u012bntu\u013c\u016b m\u014djeni. Kaid\u0101 d\u012bn\u0101 veceits d\u00e1v\u00e4s
  gar\u014dk\u0101 cel\u00e4. \u012adams jys \u012bzagr\u012bz\u00e1 lel\u0101 s\u0101d\u017e\u0101.
  T\u012b va\u013cd\u00e4ja naparosts klusums i nabadzeiba. Niv\u012bn\u0101 s\u0101d\u017eys
  pogolm\u0101 na\u012bzadz\u012bd\u014dja gail\u0219, na\u012bzar\u00e4ja sun\u0219.
  Cylv\u0101ki beja  b\u014dlom  sejom,  \u012bkrytu\u0161om  acim,  skrondainim  sv\u014drkim.
  S\u0101d\u017eys n\u016bmal\u012b pi po\u0161a cel\u00e1 glaud\u00e4s moza, n\u016bza\u0161k\u012bbus\u00e1
  m\u014djen\u00e1, cauru cysu jumtu. Durov\u014ds iz sl\u012bk\u0161n\u00e1 s\u00e4d\u00e4ja
  mozs puiseit\u0219 lynu kreklen\u012b.  Ga\u013cveni  jys  beja  pasliep\u0219  kauloj\u014ds  r\u016bce\u0146\u014ds  i  gau\u017ei
  raud\u014dja. Tik v\u012bna m\u014dja s\u0101d\u017e\u0101 beja skaista, bogota;
  t\u014ds \u012bpa\u0161n\u012bks beja  sorkonu  seji,  parasnys  veir\u012bt\u0219.  Tys  beja  kr\u016bdzin\u012bks.
  St\u014dv\u0101dams kr\u016bga durov\u014ds, jys jautri svi\u013cp\u014dja. \u012araudziej\u0219
  sierm\u016b veci, jys jau nu t\u014dl\u012bnis s\u014dka t\u016b n\u016bv\u0101r\u014d\u021b.\\n\\n\u2014
  Kas jys taids var\u0101tu b\u0233\u021b? \u2014 d\u016bm\u014dja kr\u016bdzin\u012bks.
  Varb\u0233\u021b kaids lels kungs naboga t\u0101rp\u0101? J\u014d sej\u012b spei\u1e11
  kungu c\u012bneiba. Jys skr\u00e4ja vecei\u0161am pr\u012b\u0161k\u0101 i aicyn\u014dja:
  \u2014 Kungs, napasm\u014dd\u00e1j munys pajumtis.  Ied\u012bn\u00e1  i  dzier\u012bn\u00e1  l\u012bk\u0161u  gold\u0101,  cik  gribeisi.  Veceit\u0219
  apst\u014dja, m\u00e1t\u00e1 skotu iz klus\u016b s\u0101d\u017eu i vaic\u014dja:\\n\u2014
  K\u014d pec s\u0101d\u017e\u0101 tik dryums klusums?\\n\u2014 Nav\u0101 nu k\u014d
  j\u012bm pr\u012bc\u014dt\u012bs. Vac\u014d maiz\u00e1 ap\u0101sta, jaun\u014d v\u00e4\u013c
  v\u014drpoj\u0101s. Bodam p\u012bzav\u012bn\u014dja v\u00e4\u013c slimeibys. \u013baun\u014dk\u012bs
  ir tys, ka pa\u021b dz\u00e1r\u021b j\u012bm nav\u0101 par k\u016b, a por\u014dd\u0101
  as nad\u016bdu. Ma\u0146 ari gryu\u0161i kl\u014dj\u0101s: nik\u014d  vairs  nan\u016bpe\u013cneju,  \u2014  syur\u014dj\u00e4s  kr\u016bdzin\u012bks,  a  veceits  v\u00e4\u013c
  vaic\u014dja:\\n\u2014 Voi se\u0146\u014dk j\u012b daudzi dz\u00e4r\u00e1?\\n\u2014
  O \u2014 da! Koleidz j\u012bm beja pylni kl\u0101vi l\u016bpu, koleidz putynu b\u016bd\u014ds
  mud\u017e\u00e4ja nu vystom, pei\u013com i z\u016bsim, koleidz or\u016bd\u016bs
  pylns beja br\u012bdu\u0161u gryudu, ari ma\u0146 lob\u014dk kl\u014dj\u0101s. D\u012bn-d\u012bn\u0101
  opol\u0233 v\u00e4l\u00e4s mun\u0101 kabat\u0101.\\n\\nVeceit\u0219 vys v\u00e4\u013c
  v\u00e4r\u00e4s s\u0101d\u017e\u0101. \u012araudziej\u0219 n\u016bza\u0161k\u012bbu\u0161\u016b
  b\u016bdeni me\u017ea mol\u0101, jys vaic\u014dja:\\n\\n\u2014 Kas dzeivoj tym\u0101
  t\u012b b\u016bden\u012b?\\n\\n\u2014 Tik tys moz\u012bs puiseit\u0219. Agr\u014dk
  dzeiv\u014dja i j\u014d naredzeig\u012bs t\u0101vs. Puiseit\u0219 v\u00e1d\u00e1
  j\u016b ubog\u014d\u021b. T\u0101vs myra, b\u0101rns palyka v\u012bns.\\n\u2014
  A m\u014dt\u00e1? Kur b\u0101rna m\u014dt\u00e1?\\n\u2014 T\u014ds jys nap\u012bmi\u0146,
  beja vys\u0101 mozi\u0146ks, kod m\u014dt\u00e1 myra,\\n\u2014 Kas ryupej\u0101s
  par b\u0101rnu?\\n\u2014 Niv\u012bns. K\u016b t\u012b par j\u016b ryup\u00e4t\u012bs.
  Paskr\u012b\u0219 pa \u013caudim, paubog\u014d\u0219 i  dzeiv\u014ds.  Nu,  lyudzu,  lyudzu,  kungs,  \u012bn\u014dcit  mun\u0101  m\u014dj\u012b,  \u2014
  klan\u00e4j\u00e4s kr\u016bdzin\u012bks.\\n\u2014 Kas jys taids ir? Runoj kai kungs,
  izaver tik c\u012bneigi... Varb\u0233\u021b kaids  veiskups  voi  karal\u0219  uboga  t\u0101rp\u0101?  Sovaidn\u012bku  pasaul\u012b
  natryukst. V\u00e4\u013c vair\u014dk kr\u016bdzin\u012bks brein\u014dj\u00e4s, \u012braudziej\u0219,
  ka veceit\u0219 paj\u00e4m\u00e1 b\u014drini iz r\u016bkom, n\u016bgl\u014dst\u00e4ja,
  n\u016bbu\u010d\u014dja i n\u00e1s\u00e1 \u0161ur.\\n\u2014 Laki, \u012bn\u014dk\u0161u,
  tik divat\u0101, sac\u00e4ja veceit\u0219 i g\u014dja iz b\u016bdu, kur durov\u014ds
  raud\u014dja moz\u012bs puiseit\u0219. Kr\u016bdzin\u012bks v\u00e4r\u00e4s i d\u016bm\u014dja:\\n\u2014
  Nu dr\u016b\u0161i vi\u0146 jys ir kaids b\u016br\u0219 voi karal\u0219, varb\u0233\u021b
  kaids bazneickungs, kas losa atst\u014dt\u016bs b\u0101rnus, p\u012bglau\u017e b\u014dri\u0146us,\\n\u2014
  Lyudzu, lyudzu, kungs, k\u016b n\u00e1s\u021b, dasu, s\u012bru? Voi varb\u0233\u021b
  c\u00e1p\u021b \u016blin\u012bku voi putyna cepeti? Veceit\u0219 pasmaid\u00e4ja
  i sac\u00e4ja:\\n\\nVeceit\u0219  kai  lob\u014dk\u014d  m\u014dt\u00e1  maigom  r\u016bkom  n\u00e1s\u00e1  puiseiti.
  Gl\u014dstu i nikod naizjust\u016bs m\u012blesteibys apreibyn\u014dts, b\u0101rns
  aizmyga pi vecei\u0161a kryutim. J\u014d gai\u0161\u014d ga\u013cven\u00e1 ar pylnu
  p\u0101\u013c\u014dveibu dus\u00e4ja iz nesieja  placa.  Kod  veceits  ar  b\u0101rnu  \u012bg\u014dja  kr\u016bga  ustob\u0101,
  kr\u016bdzin\u012bks tivle\u0146 lyka gold\u0101 lob\u014dk\u016b veinu, kv\u012b\u0161u
  maizi, klan\u00e4j\u00e4s i vaic\u014dja:\\n\\n\u2014 Ma\u0146, lyudzu, rudzu rupmaizis
  riceni i solta iudin\u00e1 skr\u016bzi, a b\u0101rnam taidu pa\u021b maizeiti i
  p\u012bna skr\u016bzeiti.\\n\\nKr\u016bdzin\u012bks sar\u014dv\u00e1 placus i \u012bdams
  \u0146\u016brd\u00e4ja:\\n\\n\u2014 Voi jys ir lels vi\u013ctin\u012bks, voi sk\u016bpul\u0219
  ... vajag j\u016b c\u012b\u017e\u014dk lyug\u021b... Atnes\u0219 maizi, p\u012bnu
  i iudini, kr\u016bdzin\u012bks otkon klan\u00e4j\u00e4s i skubyn\u014dja pi gord\u014dkim
  ied\u012bnim, i v\u012bnm\u0101r d\u016bm\u014dja, kai izvi\u013ck\u021b, kas ir
  tys sovaid\u012bs c\u012bmen\u0161. Nik\u014d pr\u014dteig\u014dka nasad\u016bm\u014dj\u0219
  jys vaic\u014dja:\\n\u2014 Voi,  jiu\u0219,  kungs,  pazynot  \u0161\u014d  b\u0101rna  t\u0101vu,  naredzeig\u016b
  ubogu?\\n\u2014 Napazynu i t\u016b n\u016b\u017e\u0101loju.\\n\u2014 Park\u016b!
  \u2014 brein\u014dj\u00e4s kr\u016bdzin\u012bks.\\n\u2014 Part\u016b ka n\u016bmiriejs
  beja muns jaun\u014dk\u012bs br\u014dl\u0219.\\n\\nNu lela izbreina kr\u016bdzin\u012bks
  muti vi\u0146 izpl\u00e4t\u00e1, bet niv\u012bna skan\u00e1 nu t\u014ds naizg\u014dja.
  V\u00e4\u013c vair\u014dk jys beja p\u014drsteigts, kod kr\u016bga ustob\u0101 \u012bg\u014dja
  divi napazeistami cylv\u0101ki i bu\u010d\u014ddami vecei\u0161a r\u016bkys, run\u014dja:\\n\\n\u2014
  N\u016bm\u012b\u013c\u014dt\u012bs t\u0101vs, cik m\u00e1\u0219 n\u016bzaryup\u00e4jam,
  naatrodu\u0161i tevi syla m\u014djen\u012b! Bai\u013c\u014ds, ka tu kur naizgaistu,
  m\u00e1\u0219 skr\u00e4jam, mekl\u00e4jam tevi, jo bez tev\u00e1 napr\u016btom dzeiv\u014d\u021b.\\n\u2014
  Redzit, D\u012bvs d\u00e1v\u00e1 m\u0233sim b\u0101rnu. Jys ir b\u014drin\u0219
  i pu\u0219bod\u0101 kai pamir\u0219. Jimsim j\u016b leidza.\\n\\nVeceit\u0219 sirsneigi
  sveicyn\u014dja \u012bn\u014dciejus i r\u014ddeidams b\u014drini, sac\u00e4ja:\\n\\n\u2014
  Jimsim i m\u012b\u013c\u014dsim kai sovu, \u2014 sac\u00e4ja \u012bn\u014dcieji.\\n\\nAizied\u0219  i  nu  gar\u014d  cel\u00e1  atsapyut\u0219,  veceit\u0219  g\u014dja  apc\u012bm\u014d\u021b
  s\u0101d\u017eys \u013caud\u0219. Kr\u016bdzin\u012bks st\u014dja pi t\u012bm divejim
  \u012bn\u014dciejim i seiki, seiki izpra\u0161\u0146\u014dja, kaidi j\u016bs pus\u012b
  \u013caud\u0219 i kas par sovaidu veci. Izzyn\u014dj\u0219, ka pi vecei\u0161a v\u012bnm\u0101r
  \u012bzar\u016bn daudzej\u012b cylv\u0101ki pad\u016bma i pr\u012bcyn\u014djuma
  makl\u0101tu, kr\u016bdzin\u012bks n\u016bl\u00e4m\u00e1 p\u014drzac\u00e1l\u021b
  iz t\u012bni. Jys cer\u00e4ja, ka jaunij\u0101 dzeivis v\u012bt\u0101 b\u0233\u0219
  dau\u1e11z \u012bn\u014dkumu. \u0160ei d\u016bm\u0101 tik ilgi m\u016bc\u00e4ja
  kr\u016bdzin\u012bku, koleidz sakr\u014dv\u0219 sovu montu vazum\u0101, jys nap\u014drzac\u00e4l\u00e1
  jaunij\u0101 dzeivis v\u012bt\u0101. Pyrms k\u016b \u012bs\u014dk\u021b, kr\u016bdzin\u012bks
  d\u00e1v\u00e4s pi vecei\u0161a pec pad\u016bma, kur lob\u014dk c\u00e1l\u021b kr\u016bgu.
  Po\u0161\u0157aiz veceit\u0219 beja c\u012bmot\u0101  pi  slyma  cylv\u0101ka,  a  moz\u012bs  puiseit\u0219  syl\u0101  las\u00e4ja  \u016bgys.
  V\u012bntulij\u0101  syla  m\u014djen\u012b  beja  palykus\u00e1  tik  sudobr\u0101  lileja.
  Nap\u014drst\u014ddama z\u012bd\u00e4\u021b tei kais\u00e4ja apleik sp\u016bdrus
  storus, izgor\u014dja breini\u0161keigu  smar\u017eu.  Kr\u016bdzin\u012bks  nar\u00e1dz\u00e4ja  sp\u016bdr\u016bs  storus,
  nasa\u016bd\u00e1 lilejis smar\u017eys. Sudobrs \u017eylbyn\u014dja j\u014d ac\u0219,
  monta k\u014dr\u00e1 dz\u00e4s\u00e1 pu\u010dis sm\u014drdu. Kai aizb\u016brts jys
  st\u014dv\u00e4ja i v\u00e4r\u00e4s lilej\u012b.\\n\\n\u2014 Itik daudzi sudobra!
  Par t\u016b var n\u016bpierk\u021b lelu mui\u017eu. Park\u016b tik lela monta niv\u012bns
  naapsorgoj? Pa\u021b durovys nav sl\u0101gtys i l\u016bgs attaiseits! \u2014 brein\u014dj\u00e4s
  kr\u016bdzin\u012bks i sev\u012b n\u016bsc\u00e4ja: \u2014 Dr\u016b\u0161i vi\u0146
  vac\u012bs v\u012bntul\u0219 ir lels b\u016br\u0219 i \u0161ei lileja ir j\u014d
  aizb\u016brt\u012bs monts. Mu\u013ckeigi cylv\u0101ki tur t\u016b par sv\u0101tu...
  A ka var\u0101tu izzyn\u014d\u021b b\u016bram\u016bs v\u014drdus... Mont\u0101 p\u012btyktu
  vysam myu\u017eam.\\n\\nKoleidz kr\u016bdzin\u012bks brein\u014dj\u00e4s i d\u016bm\u014dja
  par lilej\u012b aizb\u016brt\u016b montu, p\u012bt\u00e1c\u00e4ja moz\u012bs puiseit\u0219.
  Pazin\u0219 senej\u016b kaimini, b\u0101rns sauc\u00e1: \u2014 Lai ir slaveits Jezus
  Kristus!\\n\\n\u2014 Soki, moz\u012bs, kam p\u012bdar \u0161ei pu\u010d\u00e1?\\n\\nKr\u016bdzin\u012bks,  \u012bgrim\u0219  d\u016bm\u014ds  par  montu,  nadzierd\u00e4ja
  krystticeig\u014d sveic\u012bn\u00e1. Jys vaic\u014dja puisei\u0161am:\\n\\n\u2014
  Vact\u00e4tei\u0161am!  Skaista?  Tei  tai  z\u012b\u1e11 i  z\u012b\u1e11 vysu  laiku  i
  nan\u016bveist. Ni z\u012bden\u0161, ni lapen\u00e1 nu t\u014ds nan\u016bkreit.\\n\\nKr\u016bdzin\u012bks
  pasmaid\u00e4ja. \u2014 Mu\u013cka b\u0101rns, \u2014 jys d\u016bm\u014dja, \u2014
  lileja jam z\u012b\u1e11 i smar\u017eoj, as tok radzu, ka tei ir nu teir\u014dk\u014d
  sudobra, Tai,  tai...  z\u012bdlapenis  sudobra, putek\u0161lapenis  teira  zalta,
  a  t\u014ds myrdz\u016b\u0161\u014ds laseitis iz lape\u0146om? O, t\u012b ir eist\u012b
  dimanti! Taidys l\u012btys as labi pazeistu. Man\u00e1 vys nap\u012bvil\u0219...\\n\\n\u2014
  Vact\u00e4teit\u0219 ik d\u012bnys palaista lileji. Part\u016b iz lape\u0146om t\u014ds
  myrdz\u016b\u0161\u014ds  laseitis,  \u2014  st\u014dst\u00e4ja  moz\u012bs,  a  kr\u016bdzin\u012bks,  pal\u016bciej\u0219
  golvu, sac\u00e4ja:\\n\u2014 Da, da... taidys lilejis nikod naveist.\\n\u2014 Voi
  jiu\u0219 jau r\u00e1dz\u00e4jat taidu pu\u010di? \u2014 vaic\u014dja moz\u012bs.
  As gon naasu redziej\u0219 i navaru t\u014ds atsav\u00e4r\u021b. Tik skaista! Bet,
  re\u1e11z jau vact\u00e4teit\u0219  \u012bt!  \u2014  Vecei\u0161am  kl\u014dtu  p\u012bejm\u016bt,  kr\u016bdzin\u012bks  zamu
  pazaklan\u00e4ja i sac\u00e4ja:\\n\u2014 As  pi  c\u012bneigt\u0101va pec  pad\u016bm\u0101.
  Grybu t\u00e1 apzam\u00e1s\u021b iz dzeivi. T\u012b ma\u0146 nav\u0101 vairs pe\u013cnis.
  Lyudzu pasac\u00e4\u021b, kur t\u00e1 lob\u014dk b\u0233tu izc\u00e1l\u021b kr\u016bgu?\\n\\nVeceits
  pasmaid\u00e4ja i sac\u00e4ja:\\n\\n\u2014 Pyrmk\u014drt nasaucit mani par c\u012bneigt\u0101vu,
  asmu v\u012bnk\u014dr\u0161s cylv\u0101ks. \u016atrk\u014drt ar pad\u016bmu naspieju
  jiusim pakolp\u014d\u021b, bet grybu p\u014drsorg\u014d\u021b, ka ve\u013cti c\u00e1lsit
  t\u00e1 kr\u016bgu. \u0160aj\u012bnis cylv\u0101ki nadzer ni veina, ni dagveina,
  tik teiru strauta iudini i p\u012bnu.\\n\u2014 Dzierdieju, ka pi jiusu nu vysom
  molom saplyust\u016bt dau\u1e11z cylv\u0101ku, \u2014 taisn\u014dj\u00e4s kr\u016bdzin\u012bks,
  a veceits sac\u00e4ja:\\n\\n\u2014 Saplyust gon, bet strauta iudin\u0219 j\u012bm
  lob\u014dk\u012bs dzier\u012bn\u0219. Kr\u016bdzin\u012bks  d\u016bmoj: \u2014 Dr\u016b\u0161i
  vi\u0146 strauts  ir aizb\u016brts. Taids iudin\u0219 i ma\u0146 n\u016bder\u00e4s...\\n\\nNaizsaciej\u0219
  \u0161\u014ds d\u016bmu, kr\u016bdzin\u012bks v\u00e4\u013c vaic\u014dja vecei\u0161am:\\n\\n\u2014
  Pasokot ma\u0146 c\u012bneit\u012bs kungs, kur var n\u016bpierk\u021b taidu pu\u010di
  kai jiusu lileja? Tik skaista, tik smolki veid\u014dta, ka ocu navaru nu t\u014ds
  atrau\u021b.\\n\u2014 Taida pu\u010d\u00e1 nav pierkama par naudu, \u2014 sac\u00e4ja
  veceit\u0219, a kr\u016bdzin\u012bks brein\u014dj\u00e4s:\\n\u2014 Park\u016b nav
  pierkama?\\n\u2014 Kur  taidu  atras\u021b?  Pasokot,  par  t\u016b  bogoti  jiusim
  samoks\u014d\u0161u, \u2014 lyudz\u00e4s kr\u016bdzin\u012bks.\\n\u2014 Par naudu
  niv\u012bns taidys nap\u014drd\u016bd. T\u016b vajaga po\u0161am atras\u021b i ryupeigi
  k\u016bp\u021b.\\n\u2014 Na  vyss  par  naudu  pierkams  i  na  kotram  nauda vajdzeiga.
  Laipni sac\u00e4ja veceit\u0219 i skaidr\u014dja: \u2014 Kod padzeiv\u014dsit it\u00e1
  ilg\u014dk,  tod  jiusim  st\u014dstei\u0161u,  kur  taidys  lilejis  aug  i  kai  t\u014ds
  dabojamys.\\n\u2014 Voi c\u012bmota \u013caud\u0219 t\u016b zyna? \u2014 vaic\u014dja
  kr\u016bdzin\u012bks,\\n\u2014 C\u012bmota \u013caud\u0219 nav ma\u0146 vaic\u014dju\u0161i,
  kur lilejis aug. Klusum\u0101 as j\u016bs m\u014dcu, kai atras\u021b taidu pu\u010di
  i kai t\u016b k\u016bp\u021b.\\n\\nKr\u016bdzin\u012bks dusmeigs g\u014dja pr\u016bjom.\\n\\nMoz\u012bs
  puiseit\u0219, n\u016bzaklausiej\u0219 obeju veiru sarun\u0101, lyudz\u00e4s:\\n\\n\u2014
  Vact\u00e4tei\u021b, past\u014dsti, kur aug taidys pu\u010dis?\\n\\n\u2014 De\u013ctam
  as tevi, b\u0101rns, pajiemu, lai t\u00e1v pasceitu, kur taida pu\u010d\u00e1 meklejama.\\n\\nKr\u016bdzin\u012bks
  izc\u00e4l\u00e1 lapnu kr\u016bga m\u014dji, sav\u00e1d\u00e1 dau\u1e11z vysaidu
  dzier\u012b\u0146u, bet t\u012b tai i st\u014dv\u00e4ja bute\u013c\u014ds i ryuga.
  Niv\u012bns na\u012bzagr\u012bz\u00e4 j\u014d kr\u016bg\u0101, niv\u012bns nan\u016bgar\u0161\u014dja
  j\u014d savast\u016bs dzier\u012b\u0146us. Nu dusmom i b\u0101dom kr\u016bdzin\u012bks
  pazaud\u00e4ja sovu rasnumu, a cylv\u0101ki kai nag\u014dja tai nag\u014dja pi j\u014d
  dzartu.\\n\\nJaunam pavasaram \u012bzast\u014dj\u016bt, pie\u0161ki izkleida zin\u00e1,
  ka v\u012bntul\u012bs veceit\u0219 smogi slyms i gaida n\u014dvi. C\u012bmotu \u013caud\u0219
  g\u014dja pi vecei\u0161a i lyudz\u00e1 D\u012bvu, lai v\u00e4\u013c pagaryn\u014dtu
  j\u016bs labdara dzeivi. Kaid\u0101 pavasara reit\u0101 veceit\u0219 lyudz\u00e1
  sag\u014dju\u0161\u016bs \u013caud\u0219, lai t\u012b iznastu j\u016b pogolm\u0101.
  M\u014djen\u00e1 beja \u013c\u016bti moza. Tym\u0101 nasaleida vysi \u013caud\u0219,
  kas grib\u00e4ja r\u00e1dz\u00e4\u021b veceiti, dzierd\u00e4\u021b j\u016b v\u014drdus.
  Izn\u00e1s\u00e1. \u013baud\u0219 apst\u014dja apleik i klusi raud\u014dja. Moz\u012bs
  puiseit\u0219 glaud\u00e4s pi vecei\u0161a kryutim. Vysim lyk\u014ds, ka sierm\u012bs
  veceit\u0219 leidzeigs j\u014d k\u016bptijai lilejai, ka nu obim izstoroj v\u012bnaid\u0101
  gaisma, obi izdve\u0161 v\u012bnaidu smar\u017eu.\\n\\n\u2014 Pavaicoj, kur dabojama
  taida lileja?\\n\\nI kr\u016bdzin\u012bks ar sovu draugu, kr\u016bga spie\u013cmani,
  beja kl\u014dtu. P\u012b\u0161liuc\u0219 vys\u0101 tyvu puisei\u0161am, kr\u016bdzin\u012bks
  \u012b\u010dyukst\u00e4ja jam aus\u012b:\\n\\n\u2014 Voi naredzi, ka jys pat\u0219
  ir kai tei lileja? \u2014 klusu atsac\u00e4ja puiseit\u0219. Dusmeigs kr\u016bdzin\u012bks
  styum\u00e4s n\u016bstu i k\u016brn\u00e4ja:\\n\u2014 Moz\u012bs zyna, ka lileja
  palik\u0219 j\u014d r\u016bk\u014ds. Par cytu jys nazaryup.\\n\\nVeceit\u0219  m\u00e1t\u00e1  dz\u012bst\u016b\u0161u  skotu  iz  kr\u016bdzin\u012bka.  Laikam  jys
  dzierd\u00e4ja voi varb\u0233\u021b atmin\u00e4ja montrau\u0161a d\u016bmys. Sajiem\u0219
  sp\u0101ku, jys \u012bs\u014dc\u00e1 run\u014d\u021b:\\n\\n\u2014 N\u016bm\u012b\u013c\u014dt\u012b,
  naraudit man\u00e1. As aizejmu, jo D\u012bvs sauc mani, a munys lilejis sm\u014drds
  v\u012bnm\u0101r palik\u0219 pi jiusim. Po\u0161ys lilejis navaru jiusim atst\u014d\u021b.
  D\u012bvs gryb, lai tei pavadeitu mani pi J\u014d g\u016bdeibys kr\u0101sla. Bet
  ikv\u012bns teirys sird\u0219 i styprys grybys cylv\u0101ks pat\u0219 var dab\u014d\u021b
  taidu pu\u010di.\\n\\nVeceits apklusa. Kl\u014dtasu\u0161\u012b klusu slauc\u00e4ja
  osorys. Da\u017es aiz raudom nadzierd\u00e4ja mierst\u016b\u0161\u014d v\u014drda.
  Kr\u016bdzin\u012bks k\u014dri tv\u00e4r\u00e1 kotru vecei\u0161a v\u014drdu. Jys
  cer\u00e4ja, ka veceit\u0219 pasc\u00e4s, kur sadabojama breini\u0161keig\u014d
  lileja. Atgiv\u0219 elpu, veceits run\u014dja:\\n\\n\u2014 Vajaga  daudzi  lobys  grybys...  j\u014d\u012bt  arv\u012bnu  aug\u0161\u014dk...
  aug\u0161\u014dk... nu sird\u0219 j\u014dm\u012b\u013coj D\u012bvu i... tyv\u014dk...
  kus...\\n\\nT\u00e1 vecei\u0161a bolss aptryuka, gai\u0161\u014ds j\u014d ac\u0219
  aizav\u00e4r\u00e1. Vecei\u0161a elpai apklust\u016bt, ari lileja nazkur izgaisa.
  V\u012bneigi t\u014ds breini\u0161keig\u012bs sm\u014drds pi\u013cd\u00e4ja gaisu.
  \u013baud\u0219 pakryta iz celim i bols\u0101 raud\u014dja, V\u012bneigi  moz\u012bs  puiseit\u0219,  bu\u010d\u014ddams  solt\u016b  sova  labdara  r\u016bku,
  m\u012breigi i styngri sac\u00e4ja:\\n\\n\u013baud\u0219 izbrein\u0101 pazav\u00e4r\u00e1
  b\u0101rn\u0101, bet niv\u012bns jam navaic\u014dja, kur jys mekl\u00e4s breini\u0161keig\u016b
  pu\u010di. Niv\u012bns jam t\u014d i nal\u012bdz\u00e1.\\n\\n\u2014 Zviereju t\u00e1v,
  vact\u00e4tei\u021b, ka atras\u0161u taidu lileji i atnes\u0161u \u0161aj\u012bnis
  draudz\u00e1i.\\n\\nVeceiti paglob\u014dja ar lelu g\u016bdu, viers j\u014d kopa
  k\u016bpenis \u012bstat\u00e4ja boltu lileji, j\u014d m\u014djeni aizsl\u00e4dz\u00e1,
  a puiseiti draudz\u00e1 paj\u00e4m\u00e1 sov\u0101 g\u014ddeib\u0101. Vysi j\u016b
  m\u012b\u013c\u014dja i \u017e\u0101l\u014dja, jo juta, ka jym\u0101 p\u014drg\u014dj\u0219
  vecei\u0161a m\u012blesteibys gors. Pec da\u017eom d\u012bnom skum\u00e1 p\u014drj\u00e4m\u00e1
  draudzi. Puiseit\u0219 izgaisa bez viest\u0219. \u013baud\u0219 j\u016b mekl\u00e4ja,
  sauc\u00e1, vaic\u014dja par j\u016b caurg\u014djiejim.  Niv\u012bns  nazyn\u014dja  pasc\u00e4\u021b,  kur  puiseit\u0219  palic\u0219.  I
  kr\u016bdzin\u012bks ar sovu spie\u013cmani izgaisa, bet par t\u012bm niv\u012bns
  nab\u0101d\u014dja.\\n\\nKaid\u0101 vosorys d\u012bnys p\u012bvakar\u012b divi cel\u00e1veiri
  \u012bdami streid\u00e4j\u00e4s:\\n\\n\u2014 As jiusim soku, ka atrassim j\u016b
  augst\u016bs koln\u016bs. Vac\u012bs mierdams sac\u00e4ja, ka j\u014d\u012bt v\u012bnm\u0101r
  aug\u0161\u014dk, j\u014dzaver saul\u012b. Sp\u0101ka ma\u0146 p\u012btik\u0219.
  V\u012bneigi tagad, pec d\u012bnys tveicis, jiut\u016bs drusku p\u012bkus\u0219.
  Vajdz\u0101tu p\u014drs d\u012bnu atsapyust, \u012bzagr\u012bz\u021b pi gudrim cylv\u0101kim,
  kas par\u014ddeitu ce\u013cu iz augst\u014dkim kolnim.\\n\\n\u016atr\u012bs tam
  pret\u014dj\u00e4s:\\n\\n\u2014 As d\u016bmoju, ka vajaga iz pr\u012b\u0161ku vi\u0146
  \u012b\u021b i v\u00e4rt\u012bs dabas\u016bs. Taida lileja dr\u016b\u0161i vi\u0146
  kris\u0219 nu dabasim. Ka tik var\u0101tu gais\u0101 t\u016b n\u016btv\u00e1r\u021b.
  Dau\u1e11z \u0157ai\u017eu asmu redziej\u0219 kreit\u016b\u0161ys zvaigznis. Nap\u012bgr\u012b\u017eu
  t\u014dm  viereibys.  Nazyn\u014dju,  ka  taida  zvaigzn\u00e1  var  p\u014drzav\u00e4rs\u021b
  breinumpu\u010d\u012b.\\n\u2014 Mu\u013ckeibys! As t\u016bm\u0101r k\u014dp\u0161u
  koln\u016bs.\\n\u2014 A as \u012b\u0161u pa leidzonu. Ma\u0146 tei koln\u016bs k\u014dp\u0161on\u0101
  napateik.\\n\\nStreid\u00e4j\u00e4s j\u012b, streid\u00e4j\u00e4s i iza\u0161keira.
  V\u012bns, i tys beja kr\u016bdzin\u012bks, aizg\u014dja pasaul\u012b augst\u016bs
  kolnu makl\u0101tu. Atrad\u0219 kolnus, jys d\u00e1v\u00e4s tym\u016bs bez pavad\u016bn\u00e1,
  \u012bzadr\u014dz\u00e1 kolnu aiz\u0101 i n\u016bzasyta. \u016atr\u012bs, kr\u016bga
  spie\u013cman\u0219, lobs dz\u0101r\u014djs, labi vi\u0146 \u012bmet\u0219 i v\u00e4\u013c
  \u012bb\u014dz\u0219 pylnu buteli kabat\u0101, g\u014dja pa leidzonu vi\u0146, pa
  leidzonu vi\u0146. Dr\u016bsmis de\u013c jys vys \u012bm\u00e1t\u00e1 pa gu\u013cdz\u012bn\u00e1m.
  Kaid\u0101 nakt\u012b, labi \u012bmet\u0219 jys \u012bbryda mukl\u014dj\u012b. T\u012b
  l\u0101kal\u00e4ja moldu gu\u0146tenis i vylyn\u014dja dz\u0101r\u014dji arv\u012bnu
  dzi\u013c\u014dk p\u016br\u0101, koleidz jys \u012bstyga tym\u0101 ar vysu sovu
  augumu. i vys\u0101 iztuk\u0161\u014dtu buteli. Tai t\u012b divi breini\u0161keig\u014ds
  lilejis makl\u0101t\u014dji kai g\u014dja, tai izgaisa.\\n\\nMoz\u012bs puiseit\u0219
  g\u014dja cytu ce\u013cu. Atst\u014dj\u0219 v\u012bntu\u013c\u016b syla m\u014djeni,
  jys d\u00e1v\u00e4s nazynom\u0101 cel\u00e4. Satykt\u016bs cylv\u0101kus jys laipni
  sveicyn\u014dja, ce\u013cmal\u00e1  krystus  pu\u0161k\u014dja  lauku  pu\u010dei\u021bom.  Da\u017ek\u014drt  i  nakti
  pavad\u00e4ja  pi  ce\u013cmal\u00e1  krysta.  Tod,  d\u012bvbejeigi  salic\u0219  saul\u012b
  n\u016bdagu\u0161\u014ds r\u016bkys, puiseit\u0219 skait\u00e4ja vokora lyug\u0161onu,
  seik\u0101 b\u0101rn\u0101 ba\u013csten\u012b dz\u012bd\u014dja Jezum lobu nakti.
  Kaid\u0101 nakt\u012b, gul\u0101dams pi ce\u013cmal\u00e1 krysta, puiseit\u0219
  sar\u00e1dz\u00e4ja sovaidu sapynu. Vysys dabasu zvaigznis  laid\u00e4s  pi  j\u014d.  Kotra  zvaigzneit\u00e1,  laisdam\u014ds  z\u00e1m\u012b,
  p\u014drzav\u00e4rt\u00e1 teira zalta lilej\u012b i dz\u012bd\u014dja:\\n\\n\u2014
  St\u012bp r\u016bceni, puisei\u021b, jam mani, n\u00e1\u0219 syla m\u014djen\u012b!
  Tu kliusi bogots i slavons, va\u013cdeisi z\u00e1mi i jyuru. St\u012bp r\u016bceni
  puisei\u021b, jam mani, n\u00e1\u0219 syla m\u014djen\u012b!\\n\\nSt\u012bp r\u016bceni,
  puisei\u021b, jam mani, n\u00e1\u0219 syla m\u014djen\u012b.\\n\\nZeid\u0101  i  samt\u0101  m\u00e1\u0219  \u012bgierbsim  tevi,  teirzalta  bi\u010der\u016bs  t\u00e1v
  dzeram\u016b sn\u00e4gsim.\\n\\nZalta kr\u016bni golv\u0101 t\u00e1v liksim, pasaul\u00e1
  gudr\u016bs pi k\u014djom t\u00e1v v\u00e1ssim.\\n\\nPuiseit\u0219  papuryn\u014dja  gai\u0161\u016b  ga\u013cveni,  st\u012bp\u00e1  r\u016bceni,  dzyna
  zvaigzneitis pr\u016bjom i sac\u00e4ja:\\n\\n\u2014 Najim\u0161u,  najim\u0161u.  Ma\u0146  vajaga  sudobra  lilejis,  taidys,
  kaida z\u012bd\u00e4ja vact\u00e4tei\u0161am dzeivoj\u016bt. Tik taidu grybu atras\u021b
  i n\u00e1s\u021b t\u012bm \u013caudim, kas vact\u00e4ti m\u012b\u013c\u014dja.\\n\\nZvaigzneitis
  rind\u017e\u012b vi\u0146 gr\u012b\u017e\u0101s i arv\u012bnu tyv\u014dk glau\u017e\u0101s,
  kairynoj, vylynoj.\\n\\nPuiseit\u0219 p\u012bzatryuka k\u014dj\u014ds. Kas tys?
  Saul\u00e1! Ai, saul\u00e1 tik aug\u0161i dabas\u016bs, a as gu\u013cu? P\u014drmet\u0219
  krystu, n\u016bskaitiej\u0219 reita lyug\u0161onu, puiseit\u0219 n\u016bbu\u010d\u014dja
  krystu i d\u00e1v\u00e4s t\u014d\u013c\u014dk. Jys g\u014dja v\u012bns v\u012bneigs
  pa \u0161auru lauku celeni. Apleik za\u013c\u014dja labeibys dryvys, ceiruli trycyn\u014dja
  gaisu, puiseit\u0219 vys g\u014dja iz pr\u012b\u0161ku. Jys beja izsa\u013cc\u0219
  i lobpr\u014dt ap\u0101stu rupmaizis riceni, bet vakar beja apied\u0219 p\u0101dej\u016b
  leidza pajymt\u016b gabaleni.\\n\\n\u2014 Kas tys? Zvons?\\n\\nPuiseit\u0219 pazav\u00e4r\u00e1
  saul\u012b. Tei st\u014dv\u00e4ja pu\u0161d\u012b\u0146\u014ds.\\n\\n\u2014 Zvona
  kai m\u0233su draudzis bazneic\u0101 iz \u201eKunga e\u0146gel\u0219\\\".\\n\u2014
  \u012a\u0161u, pag\u016bdyn\u014d\u0161u n\u016bsl\u0101pt\u016b D\u012bvu. Jys
  pasc\u00e4s ma\u0146, kur atras\u021b lileji.\\n\\nPuiseit\u0219 d\u00e1v\u00e4s
  t\u014d\u013c\u014dk zvonu skanis virz\u012bn\u012b. P\u014drg\u014dj\u0219 nalelu
  bierzeiti, jys \u012braudz\u00e4ja boltu bazneiceni k\u016bku za\u013cum\u0101.\\n\\nBazneic\u0101
  puiseit\u0219 ilgi lyudz\u00e4s. \u012adams \u014dr\u0101, jys durov\u014ds satyka
  siermu bazneickungu. J\u014d ac\u0219 v\u00e4r\u00e4s tikpa\u021b lobsirdeigi kai
  myru\u0161\u014d vact\u00e4tei\u0161a. Puiseit\u0219 n\u016bbu\u010d\u014dja bazneickunga
  r\u016bku i vaic\u014dja:\\n\\n\u2014 Gareigs t\u0101vs, voi zyni, kur aug breini\u0161keigys
  lilejis? Par\u014ddi ma\u0146 ce\u013cu!\\n\\nSierm\u012bs goreidzn\u012bks paj\u00e4m\u00e1
  puiseiti pi sev\u00e1, seiki izvaic\u014dja, kur jys dzeivoj, kas ir. Puiseit\u0219
  st\u014dst\u00e4ja par sovu naredzeig\u016b t\u0101vu, kas ubog\u014ddams myra,
  st\u014dst\u00e4ja par lob\u016b vact\u00e4teni i j\u014d sudobra lileji. St\u014dst\u00e4ja
  i par t\u012bm lob\u012bm \u013caudim, kas p\u012bj\u00e4m\u00e1 j\u016b i m\u012b\u013c\u014dja
  kai sovu.\\n\\n\u2014 Tagad j\u012b vysi skumst, ka nav\u0101 vact\u00e4tei\u0161a
  i lilejis. As grybu aizn\u00e1s\u021b j\u012bm taidu pu\u010di, \u2014 beidz\u00e1
  puiseit\u0219.\\n\\nPr\u012bster\u0219 lobsirdeigi n\u016bgl\u014dst\u00e4ja b\u0101rna
  ga\u013cveni i sac\u00e4ja:\\n\\n\u2014 Tik drei\u017ei, bierne\u0146, navar taidu
  lileji atras\u021b.\\n\u2014 Navar! A par k\u016b? J\u012b t\u012b rau\u1e11 i skumst.\\n\u2014
  Voi tu j\u012bm vi\u0146 gribi n\u00e1s\u021b lileji? S\u00e1v nagrybi t\u016b patur\u00e4\u021b?\\n\u2014
  Labi, puisei\u021b! Pali\u00e7 pi man\u00e1. Syutei\u0161u tevi \u0161kol\u014ds.
  T\u012br tu \u012bzam\u014dceisi pat\u0219 k\u016bp\u021b taidys pu\u010dis i atrassi
  ce\u013cu iz breini\u0161keig\u016b lileji.\\n\u2014 Kai taidu d\u014drgumu s\u00e1v
  vi\u0146 patur\u00e4\u021b?! I vact\u00e4tei\u0161a lileja z\u012bd\u00e4ja de\u013c
  vysu, kai tik jys myra, tai lileja izgaisa.\\n\\nPag\u014dja vair\u014dki godi.
  Draudz\u00e1, kurai puiseit\u0219 s\u016bl\u00e4j\u00e4s n\u00e1s\u021b sudobra
  lileji, paraud\u014dja pec sova izgaisu\u0161\u014d puisei\u0161a i gondrei\u017e
  j\u016b aizmiersa. V\u012bneigi vac\u014d v\u012bntul\u00e1 kopa j\u012b naaizmiersa
  i ik gods stat\u00e4ja t\u012b bolt\u014ds lilejis. Kaid\u0101 vosorys d\u012bn\u0101
  syla m\u014djenis tyv\u014dk\u016bs c\u012bmotu \u013caud\u0219 ar izbreinu v\u00e4r\u00e4s
  divej\u016bs ce\u013c\u014dt\u014dj\u016bs, kas g\u014dja pa stidzeni tai\u0161ni
  iz syla m\u014djeni. Tyv\u014dk p\u012bskrieju\u0161i, j\u012b pazyna, ka obi ce\u013c\u014dt\u014dji
  ir pr\u012bsteri: v\u012bns vacs i vys\u0101 sierms kai bol\u016bd\u0219, \u016btrs
  po\u0161\u0101 jauneibys z\u012bd\u0101.\\n\\n\u2014 Taids  b\u0233tu  bej\u0219  m\u0233su  puiseit\u0219,  ka  nab\u0233tu  izgais\u0219,  \u2014
  \u012bzamin\u00e4ja kaids veir\u012bt\u0219. J\u014d v\u014drdi \u012bskan\u00e4ja
  jaun\u014d pr\u012bstera aus\u012bs.\\n\u2014 Jiusej\u012bs as i asmu, \u2014 jys
  sac\u00e4ja. \u2014 G\u014dju samekl\u00e4\u021b jiusim taidu lileji, kaid\u0101
  z\u012bd\u00e4ja m\u0233su vact\u00e4tei\u0161a m\u014djen\u012b. Pec ilgim godim
  t\u016b atrodu i atne\u0161u jiusim.\\n\\nC\u012bmota \u013caud\u0219 saprota vysu.
  Ar pr\u012bcys osorom j\u012b glaud\u00e4s pi jaun\u014d pr\u012bstera i pazateic\u00e1
  vacijam par izpaleidzeibu.\\n\\nPag\u014dja v\u00e4\u013c p\u014drs godu. Moz\u014ds
  syla m\u014djenis v\u012bt\u0101 pazac\u00e4l\u00e1 skaista bolta bazneicen\u00e1.
  Lel\u016b oltori pu\u0161k\u014dja boltys, smar\u017eeigys lilejis, a oltora sag\u0101
  beja ar zaltu \u012braksteiti v\u014drdi: \u201eM\u012b\u013coj D\u012bvu i tyv\u014dk\u016b!\\\"\\n\\n40\"",
  "\"Ivars Magazeinis (Daugovpi\u013ca t\u012bsa) LATGALISKAIS DAUGOVPIL\u012a GIDA
  STUOST\u016aS I PUBLISKAJ\u0100 TELP\u0100\\n\\nAtsl\u0101ga vuordi: kulturys turisms,
  kulturobjekti, publiskuos zeimis, \u201elatgal\u012b\u0161u p\u0101di Daugovpil\u012b\\\",
  viesturiskuo atmi\u0146a.\\n\\nDaugovpi\u013cs simboliski ir \u201edaudzeju \u201eiudi\u0146u\\\",
  kulturu, vol\u016bdu, ticeibu i likti\u0146u pi\u013cs\u0101ta\\\". 1 Ari \u201eLatgolys
  regiona turisma atteisteibys marketinga plan\u0101\\\" pastreipuota Latvej\u0101
  \u016btruos leluokuos pi\u013cs\u0101tys \u201ekulturys n\u016btykumu daudzveideiba\\\"
  2 multikultural\u0101 vid\u0113, a jam\u0101 v\u012bta ari latgaliskajam, s\u016bpluok
  viesturiskajam i myusd\u012bneigajam vyspuorlatvyskajam, kr\u012bvyskajam, p\u016bliskajam,
  boltkr\u012bvyskajam, ebrejiskajam, vuocyskajam i t. t.\\n\\nNasaver\u016bt iz pi\u013cs\u0101tys
  tyvuokuos i tuoluokuos \u201eviesturiskuos atminis\\\", kuram\u0101 latgaliskajam
  ir mozuok v\u012btys nakai P\u012bterburg\u0101 Kr\u012bvej\u0101, R\u0113zekn\u0113
  voi cytuos Latgolys pi\u013cs\u0101tuos, i nazkurim napasenejim puorspr\u012bdumim,
  ka Daugovpi\u013cs napozicionej sevi kai Latgolys organisku da\u013cu, daudz kas
  ir atkareigs nu po\u0161a gida i t\u016bs cylv\u0101ku, kuri grib dzierd\u0113t
  pi\u013cs\u0101tys \u201eraib\u016b\\\" viesturi i redz\u0113t ituos viesturis zeimis.\\n\\nItys
  referats ir praktika \u2013 pi\u013cs\u0101tys sertific\u0101ta gida \u2013 analitiski
  publicistisks pasavier\u012b\u0146s iz tuo, cik daudz (voi moz) Latgolys administrativaj\u0101
  golvyspi\u013cs\u0101t\u0101 Daugovpil\u012b turisma informacejis p\u012bduovuojum\u0101
  teik izmontuota latgal\u012b\u0161u vol\u016bda i kas gida stuostejum\u0101 latgaliski
  voi cytuos vol\u016bduos teik pastreipuots par latgal\u012b\u0161u kulturys personeibom,
  n\u016btykumim, fenomenim, taipat \u2013 kaidys publiskuos zeimis voi kulturobjekti
  paleidz gida stuostejumu paspylgtynuot.\\n\\nNu pazeistamuok\u016bs publisk\u016bs
  zeimu n\u016bsaucama Vladislava Luo\u010da i Juo\u0146a Cybu\u013cska izdevn\u012bceibys
  dorbam ve\u013cteita p\u012bminis pluoksne (latgaliski) Alejis \u012bl\u0101 5,
  kai ari p\u012bminis pluoksne pi beju\u0161uos Daugovpi\u013ca \u0160koluotuoju
  i\u0146stituta \u0101kys Saulis \u012bl\u0101 1/3 juo direktorei Valerejai Seilei
  (teksts latv\u012b\u0161u literaraj\u0101 vol\u016bd\u0101, niule pluoksne ir puornasta
  iz pogolma i nu uorspusis nav radzama).\\n\\nRai\u0146a zeime Daugovpil\u012b, resp.,
  juo kryu\u0161u t\u0101ls, at\u0161kireib\u0101 nu R\u0113zeknis, atsar\u016bn pi\u013cs\u0101tys
  centr\u0101 \u2013 pi Daugovpi\u013ca Universitatis golvonuo korpusa. Caur it\u016b
  personeibu var klauseituojus izvoduot pa Latgolu, Latveju i \u0160veici, izarunuot
  par socialismu, izgleiteibu, jurista i \u017eurnalista profeseju, par \u201ev\u012bnoj\u016b\u0161\u016b\\\"
  poezeju i daudz k\u016b cytu.\\n\\nV\u012bns nu jaun\u016bs turistu mar\u0161rutu
  vad iz 2016.\u00a0goda jun\u012b atkluot\u016b \u0160makovkys muzeju. Par pi\u013cs\u0101tys
  i regiona v\u012bnu nu slovonuokajim objektim suoc palikt C\u012bt\u016bksnis v\u012bnuv\u012bt
  ar jim\u0101 as\u016b\u0161\u016b i 2013.\u00a0goda aprel\u012b attaiseit\u016b
  Marka Rotko Muokslys centru. C\u012bt\u016bksn\u012b de\u013c \u201emilitaruos puorsavuicei\u0161onys\\\"
  beja \u012bsaukta i da\u013ca latgal\u012b\u0161u, t.\u00a0sk. izdeviejs V.\u00a0Luocs.\\n\\nDaugovpil\u012b
  sovus \u201ev\u0113sturisk\u016bs p\u0101dus\\\" ir pamatu\u0161i daudzi slovoni
  latgal\u012b\u0161i, ite var\u0101tumem likt memorialuos pluoksnis t\u016b pi tuos
  \u2013 Fra\u0146cs Trasuns, Juo\u0146s Vi\u0161nevskis, Konstantins Raudive, Juo\u0146s
  Kl\u012bdziejs, Jurs Pabierzs i t.\u00a0t.\\n\\nSvareiga kulturzeime ir i Daugovpi\u013ca
  katuo\u013cu kopi, kur var apraudzeit vairuoku \u012bv\u0101rojamu latgal\u012b\u0161u
  paglobuo\u0161onys v\u012btys \u2013 V.\u00a0Seilis, Amalejis B\u017ee\u017einskys,
  Puovula Laiz\u0101na i cytu.\\n\\nBez p\u012bmyn\u0101t\u016bs zeimu pi\u013cs\u0101tys
  centr\u0101 var \u012braudzeit i jaunus uzrokstus latgaliski voi par it\u016b tematiku,
  kai, saceisim, izkuortne \u201eMade in Latgola\\\" pi veikala \u201eO, Marta!\\\".
  Afi\u0161ys latgal\u012b\u0161u vol\u016bd\u0101 pasaruoda sakar\u0101 ar Latgolys
  Studentu centra pasuokumim, folklorys k\u016bpu \u201eDyrbyni\\\", \u201eSv\u0101tra\\\"
  i grupys \u201eDabasu Durovys\\\" izastuo\u0161onom, Daugovpi\u013ca teatra izruodem
  latgaliski.\\n\\n1\u0160uplinska, I. (zyn.\u00a0red.) Latgolys lingvoteritorialuo
  vuordineica II. R\u0113zekne: R\u0113zeknis Augst\u0161kola, 2012, 169.\\n\\nSummej\u016bt:
  Daugovpi\u013cs (Daugavpils, Dinaburga, Dvinska), kai i vysa Latgola, ir lelum lels
  vardamkotlys (melting pot), kurym\u0101 salypu\u0161i daudzeji kultursluoni, tym\u0101
  skait\u0101 \u201eaustrumlatvyskais\\\" \u2013 latgaliskais. It\u016b vysu var redz\u0113t
  i publiskajuos kulturys zeim\u0113s.\\n\\n2Latgales re\u0123iona t\u016brisma att\u012bst\u012bbas
  m\u0101rketinga pl\u0101ns. Daugavpils, Latgales pl\u0101no\u0161anas re\u0123ions,
  2012, 23.\"", "\"AT\u012a\u0160ONA\\n\\nLiterates Ilzes Spergas skaiteit\u012b teksti,
  radeiti speciali uzvadumam \\\"At\u012b\u0161ona\\\", izmantoj\u016bt t\u016bp\u016b\u0161uo
  stuostu kruojuma fragmentus.\\n\\nKas tu esi, Marija. Kaid\u0101 pasaul\u012b tu
  dzeivoj, Marija. Kas tev gar\u0161oj. Kuo tu gryb\u0101tu atsa\u0113st da seita.\\n\\nVoi
  tuos byutu bu\u013cbu meicinis ar \u0161kvarkom voi ozbora putra ar soltu p\u012bnu.
  Cepl\u012b sasutynuotys leluos bu\u013cbu k\u013cockys ar ciercinim. Studi\u0146a
  b\u013c\u016bda ar boltu tauku kuortu pa viersu i v\u012bglu casn\u0101gu smuordu.
  Varbyut capt\u012b uobeli ar cukru. Boltuo maize ar sv\u012bkstu i b\u012bzu doktora
  dasu, kluot cygore\u0146u kopeja iz plitys vuoreita. E\u013c\u013c\u0101 vuoreitys
  r\u016bzeitis voi \u017eagareni. Me\u013cneicu zupa ar k\u013cockom. Solta mannys
  putra ar dziervi\u0146u keiseli, pl\u0113ve kai l\u0101nys apsatyn ap lizeiku, daleipst.
  Rabarbera kuots cukr\u0101. Tik pazeistams skorbonums iz m\u0113lis. Voi varbyut
  \u2013 ab\u0101da kuopustu zupa.\\n\\nVeiri pa rudi\u0146am ir n\u016bkuovu\u0161i
  vepri, j\u012b mudri \u012bs ustob\u0101. Iz Sv\u0101tku byus studi\u0146s i cepe\u0161i.
  J\u012b v\u0113\u013c si\u0146c\u0113s n\u016bsyt kuojis, mozgoj r\u016bkys, slauka
  teve iznastaj\u0101 lynu dv\u012bl\u012b. Golda gol\u0101 iz be\u0146\u010da ir
  b\u013c\u016bda ar cyukys golvu, v\u012bgla dyumu i a\u0161\u0146a smoka. A kotl\u0101
  jau izvyru\u0161i kuopusti ar a\u0161\u0146ainajim gobolim, iz skourodys cap\u0101s
  cyukys oknys, p\u016bde\u0146\u0101 tu\u0161ej\u0101s vysaidys l\u0101nys de\u013c
  vystu. Tu nagribieji laist nikuo viej\u0101.\\n\\nTu, Marij, esi taupeiga s\u012bv\u012bte.
  Tu esi jauna, bet zyni, kai vajag. Tev vyss \u012bt nu r\u016bkys i ustob\u0101,
  i duorz\u0101, i kl\u0101v\u0101. Baba byutu lapna par tevi.\\n\\nMarij, voi tu
  vyspuor t\u012b London\u0101 \u0113d cyukys gali. Varbyut tu esi vegetar\u012bte.
  Varbyut tu raugi t\u012b sov\u0101 dzeiv\u0113 dzeivuot pareizi, tik tev nikod nikas
  nasa\u012bt. Pylnys r\u016bkys vysaida klama, nazkas kreit i ve\u013c\u0101s, tu
  ver\u012bs, tu raugi n\u016bgiut. I tod tu vaira naraugi nikuo.\\n\\nTu atbrauc
  iz s\u0101tu, ver\u012bs iz babys rate\u0146a, iz mamys adek\u013cu i dzejs komu\u013cu
  sapr\u016bti, ka tev tam vysam nav v\u012btys. Tev, Marij, jau se\u0146 vysa ir
  par daudzi. Tik tu nazyni, kur vysu n\u016blikt i k\u016b nu tuo vysa pajimt sev
  leidza.\\n\\nTu izrevej duorzu kai baba, vogys gol\u0101 \u012bdur kapli zem\u0113,
  n\u016bs\u012b\u0146 pluon\u016b kartona skustu. Tu kai mama aizej nu teiruma, vosorys
  kleitys mol\u0101 nasdama nazcik og\u016br\u010du, k\u016b sa\u010dupinieji gr\u0101d\u0101
  zam os\u016bs lopu. Dorba ni apdareit, ni apbyut. Tu tai pasoki babys bols\u0101.\\n\\nKod
  jei, neidama sv\u012bkstu, \u012bsav\u0113re, ka meikle jau puorryuguse. Kod jei
  guoja nu teiruma i \u012braudzeja otkon aizaugu\u0161\u016bs b\u016brkuonus, batvi\u0146us,
  gr\u012bzi\u0146us. \u012araudzeja, kai b\u0101rni malnom mutem plie\u0161\u0101s
  pi golda, \u012braudzeja sakrytu\u0161\u016b pyuneitis golu i aizaugu\u0161\u016b
  miesl\u012bni pi pierts. Kod jei nu kl\u0101va izsv\u012bde n\u016bspruogu\u0161\u016b
  syv\u0101nu, savuoreit vystom, cyuka n\u016bguliejuse, seivs kruoj\u0101s aizgold\u0101,
  dzeivys v\u012btys nav. I kod lai paspiej vysu. Dorbus, b\u0101rnus i dzeivi. Kod.\\n\\nTu,
  Marij, \u012bej ustob\u0101 myzuotu bu\u013cbu bl\u012bnim. Apsagr\u012bzt nav kur.
  Dzeivys v\u012btys nav. Nav ni rikteiguos b\u013c\u016bdys, bess j\u016b ruovs,
  ni osuo nazei\u0161a. Pa besim! Nu dusmis tu esi gotova izsv\u012bst vysu pa besim
  \u2013 vysu beju\u0161\u016b i paguoju\u0161\u016b, vysu paaudz\u0113s taupeit\u016b
  i luopeit\u016b, vysu saudzeit\u016b, vysu kruot\u016b.\\n\\nBesim! Vysus apdze\u013ctieju\u0161\u016bs
  kokarus, koldurus i naule\u010dkys nu driebu skapa, vysus p\u012bsmedzieju\u0161\u016bs
  i cyrmu\u013cu sa\u0101st\u016bs goldus i kr\u0101slus nu vacuos pyunis, vysys skreinis,
  skapus, de\u010dus, pyurus i bucys. Vysu izm\u0113zt i atsas\u0113st kukn\u0113
  pi l\u016bga. I n\u016bmyzuot tuos bu\u013cbys tim bl\u012bnim.\\n\\nBet tu, Marij,
  navari. Tu siedi internet\u0101, tu siedi socialaj\u016bs teikl\u016bs, tu raugi
  salikt sovu dzymtys k\u016bku. Tu raugi tikt gol\u0101 ar t\u0101va i muotis, babys
  i dzeda s\u0101tu. Ar se\u0146\u010du zemi raugi tikt gol\u0101, Marija.\\n\\nTu
  vysu, ruod\u012bs, atguodoj, i tu vysu vari. Tu esi stypra s\u012bv\u012bte, Marij.\\n\\nBet
  voi tu muoki izvuoreit bu\u013cbu k\u013cocku zupu? Tai lai juos naizjiukst putr\u0101,
  bet nav ari par c\u012btu. Voi tu muoki izcept taidus kotletus kai baba. Voi tev
  sa\u012bt ze\u010dis pap\u012bds. Voi tu atguodoj rikteig\u016b Jumprovys Marijis
  dz\u012bsmi nu babys puotarneicys. Voi tev iz l\u016bga aug mirta.\\n\\nMarija.
  Kai tev \u012bt. K\u016b tu, Marij, pat\u012bseib\u0101 d\u016bmoj. Kas tu esi,
  Marija.\\n\\nTu siedi ustobys pr\u012b\u0161k\u0101, ver\u012bs iz sova teiruma.
  Tu var\u0101tu \u012bt sien\u012bs, tys varbyut byutu v\u012bneigais, kuo tu gribi.
  Tikai ir pavasars, nase\u0146 n\u016blejs voi n\u016bsnidzs slapnis sn\u012bgs,
  ir solts, zeme v\u0113\u013c nav pasam\u016bduse, zam agropl\u0113vis tu \u012bbaksteji
  nazcik zier\u0146u. Sovim b\u0101rnim. Agr\u016bs zier\u0146us naap\u0101d tuorpi.
  Tu ituo vysa zyni. Kai s\u0113t, kai stateit, kai n\u016bvuokt, kai izga\u013cdeit
  pupys, kai salikt batvi\u0146us z\u012bmai. Bet tu nazyni, kai n\u016bgr\u012bzt
  t\u016b vac\u016b \u0161livu. Tu nazyni, kai \u012bdarbynuot i n\u016bsluop\u0113t
  t\u0101va traktoru. Tu esi sasaj\u0101muse j\u016b montuot i sakuortuot zemis papeirus,
  bet nazyni i nagribi d\u016bmuot, k\u016b tuo\u013cuok. Tam traktoram jau se\u0146
  nav skatis, ritini \u012bgrymu\u0161i zem\u0113, zam motora vuoka p\u0101r\u0146
  c\u012blave\u0146ai beja pereklis, bet tu navari ni puord\u016bt, ni sataiseit.
  Tu zyni, ka juoizl\u012bk kl\u0101vam jumts, ka juosataisa syltumneicai suoni, ka
  juoaizbrauc piec pl\u0113vis, tev pat ir nauda. Bet taida sajiuta, ka navari pasakust\u0113t,
  ka esi ite zem\u0113 \u012bauguse. Nazkur ir dzeive, tovi b\u0101rni ar \u0161kolys
  autobusu aizbrauc i atbrauc, veirs reizi nede\u013c\u0101 aizbrauc iz ofisu i pal\u012bk
  da v\u0101la vokora. Tam\u0101 d\u012bn\u0101 tu izvuorej kopeju, siedi i ver\u012bs
  pa l\u016bgu, kai t\u012b viej\u0101 kust\u012bs duorzs. Ir tik daudz dorba, bet
  tu nikuo navari. Tev vysu myu\u017eu ir tik daudz bejs juostruodoj. Leidz v\u012bnu
  d\u012bnu saproti, ka navari atzvaneit. Tev ir v\u012bns, div, tev ir jau desmit
  naatbyld\u0101tu zvonu, bet tu navari. Sasajem, n\u016bsp\u012bd v\u012bnu, sarunoj,
  pabeidz, aiz inercis mudri n\u016brunoj v\u0113\u013c nazcik sarunu. I tod siedi
  ar sovu tuk\u0161umu. Tik tuk\u0161u kai kl\u0101vs, nu kuo kup\u010dam izvedi muotis
  g\u016bvi. Tik tuk\u0161u kai s\u012bna pyune, kur var\u0101tu doncuot, kab na s\u012bna
  sme\u013cts pa kuojom i kab tu variejuse sarunuot muzyku i sakluot goldus. Tev tikai
  juop\u012bzvona, bet tu izl\u012bc luodeit\u016bs telefona i atv\u012bgluotai sapr\u016bti,
  ka nazcik minotu esi breiva. Cikom luodej\u0101s telefons, tu dreiksti nikuo nadareit.
  Tu zyni, ka ari piec tam\\n\\nnavariesi i tys tevi smacej n\u016bst, bet niu tu
  esi breiva. Siedi duorza gol\u0101 iz be\u0146\u010da zam ustobys jumta i ver\u012bs,
  kai lai\u017e\u0101s slapnis sn\u012bga puorslys, n\u016bkreit i izalai\u017e iz
  araminis.\\n\\nTik tev i ir tovys dzeivis. Cikom sn\u012bga puoslys kreit iz zemi
  i izalai\u017e.\\n\\nSiedieju mamys s\u0101t\u0101 pi kuknis golda. Juos pierktuo
  voskadr\u0113be ar pu\u010dem.\\n\\nBazneickungs atguoja ar Postor\u016b svieteibu.
  Aizguoja. Svieteigi t\u012b, kas...\\n\\nA k\u016b tuo\u013cuok.\\n\\nBeju izslaukuse
  mamys g\u016bvi i pabaruojuse syv\u0101nus. Salyku mamys dr\u0113bis. Naudu. Saraksteju
  nu telepona iz lopys vysus kontaktus, kam juozvona, ka gad\u012bn\u012b kas.\\n\\nRodi.
  Tuolej\u012b rodi. Krystab\u0101rni. Klasisb\u012bdri. Studeju b\u012bdri. Kur.
  Kaidi. Nikuo nazynu.\\n\\nKai nu myglys pluovuoja bierneib\u0101 p\u012bsaukt\u016bs
  draudzi\u0146u vuordi. Godu godim nasatyktuos, naradz\u0101tuos. Da pa kuru laiku.
  Kod ta lai.\\n\\nIz draugu i rodu apsveikumim jei nikod naatbi\u013cd\u0113ja. Gribieju
  paleidz\u0113t, n\u016bpierku apl\u016bksnis, kartenis. Tuk\u0161i tai i n\u016bstuov\u0113ja
  iz juos naktsga\u013cde\u0146a. Apl\u016bksn\u0113s es sajiemu naudu. Apsveikumus
  jei pamaze\u0146am atdeve mums. Daudz laimis, laimeigu jaun\u016b godu, sorgoj seve,
  meite\u0146.\\n\\nSv\u0101tku to daudzi sasalosa pa dzeivi. Jai vysmoz beja iz kuo
  p\u012braksteit. Kaidu \u0161a\u013cte\u0146u mes sasajutom normala saime, kas sajem
  i duovynoj, navys pa klus\u016b i kauneigai \u012bgryu\u017e \u016btram r\u016bk\u0101
  papeir\u0101 sateitu naudu. N\u016bpierc sev. Tu jau po\u0161a zyni. Po\u0161a gudra.\\n\\nNikaidu
  duovonu, nikuo personeiga. Jei samoksuoja kai olgu, kai atsapierk\u0161onu. Kai
  nu naba\u0161n\u012bka atsakrateja. Pat ni pu\u010du voi svineigu vuordu. Pakluse\u0146am
  r\u016bk\u0101 \u012bgryuzta nauda. Jem. Pierc.\\n\\nT\u016b naudu es izdevu par
  pi\u013cneigim m\u0101slim. Par puortyku veikal\u0101, par dr\u0113bem, k\u016b
  panosuoju i atdevu lobdareibai. Pr\u016bm. Paceli. Atlaidit. Atpestejit mani nu
  tuo vysa. Kai zuomauci uodu gribieju izamaukt nu tuo vysa. Breiva i sov\u0101 dzeiv\u0113.
  Ar garim z\u016bbim svinieju sovu b\u0101rnu sv\u0101tkus, vuiceidamuos nu  \u017eurnalu,
  na nu sovys muotis.\\n\\nAizbraucem pi juos div reizis gost\u016bs. Iz muotis dzim\u0161onys
  d\u012bnys i iz kopusv\u0101tku pi t\u0101va. Beja peir\u0101gi, \u0161ampan\u012bts.
  \u012abraucem pa ce\u013cam, apbrauc\u016bt Latveju. B\u0101rni izamauduoja mun\u0101
  bierneibys muork\u0101. Jei izcepe peir\u0101gu, meikle sakryta. Gar\u0161uoja piec
  soldonu gleizdu, nazkas pynuos pa muti. Vysim beja na sev\u012b. Runuot to nav par
  k\u016b. B\u0101rnim jei pavaicuoja, kur\u0101 niu klas\u0113. Kotru reizi pavaicuoja.
  B\u0101rni jai pavaicuoja, kur jei beja pa Juonim. S\u0101t\u0101. Kur ta cytur.\\n\\nKotru
  godu jei vys saceja, ka niu to gon p\u0101dej\u016b reizi. Gona, gona vysa, vysa
  par daudzi, kam tuo vysa vajadzeigs, kam tuo vysa. Ni ap\u0161k\u012bst, ni apbyut.
  Tok kotru godu guoja pavasars, kotru godu jei pierka s\u0101klys, roka ar luopstu
  i rev\u0113ja. C\u012bst navar\u016bte tuos zemis, jei kotru godu jun\u012b saceja,
  \u012bdama ar kapli nu teiruma, tai jei saceja jul\u012b, l\u012bdama izkoltu\u0161\u016bs
  og\u016br\u010dus, august\u0101 ar pupu i seipulu veik\u0161im i skalinim, i, treidama
  dorba p\u012bdzeituos rukys, tai saceja septembr\u012b. A zeme vylka pi seva. Jei
  otkon i otkon audz\u0113ja t\u016bs valna kaba\u010dus, og\u016br\u010dus, tomatus,
  batvi\u0146us, b\u016brkuonus, kuopustus, bu\u013cbys i gr\u012bzi\u0146us, pupys,
  zier\u0146us, casn\u0101gus, salatus, redisus, juo\u0146\u016bgys, ierk\u0161kei\u017eys,
  rabarberus, rutkus i seipulus. Audz\u0113ja i gryude burkuos. Mudri, mudri. Recepti
  taidi i itaidi, vajadzeigaja v\u012bt\u0101 attaiseiti i sakrauti \u017eurnali,
  gruomotuos s\u0101klu pacenis gruomotzeimu v\u012bt\u0101. Pi batvi\u0146u zupys
  sagatavis gruomot\u0101 batvi\u0146u s\u0101klu pace\u0146a. T\u016b jei beja aizlykuse
  p\u0101dej\u0101 vosor\u0101. Vyss ar apd\u016bmu, kai nazkod juos muotei Jumprovys
  Marijis obroze\u0146\u0161 puotorneic\u0101 pi \\\"Jaunovys sv\u0101tuos\\\" dz\u012bsmis
  i litanejis Marijis g\u016bdam.\\n\\nOtkon i otkon ar spanim, skalinem, kulem i
  maisim, kastem i burkom juos m\u012blesteiba brauce pi mane iz Reigu. Otkon i otkon
  burce\u0146uos, kast\u0113s, sa\u013cdeitov\u0101 Reig\u0101. Otkon i otkon ari
  es caurom naktim Reigys dzeiv\u016bkl\u012b myzuoju, gr\u012b\u017eu, vuoreju i
  jiem\u016bs ar kaba\u010dim, og\u016br\u010dim i batvinim. Kai beidamuos naaizsp\u0113t,
  kai beidamuos, ka miskast\u0113 byus juoizsv\u012b\u017e ko\u010d drupona juos m\u012blesteibys.\\n\\nJei
  s\u0113ja i stateja, rev\u0113ja, ratynuoja, gr\u012bze i laseja. Kotru pavasari
  i rudini duorzs kai polu laik\u0101 iudi\u0146s bez krostu puorj\u0113me juos s\u0101tu.\\n\\nPavasari
  vyss sasal\u0113ja iz kuknis golda i ap goldu, ka nabeja, kur atsas\u0113st. Seik\u012b
  seipuleni, s\u0101klys, sieklenis, burkys, burcenis, ba\u0146cenis. \u0160keiv\u016bs
  zam lupatenis kai bierneni \u0161yupel\u012b deiga og\u016br\u010di i kirbi, iz
  pal\u016bdzis golvys slaisteja aizac\u012btu\u0161i tomati i paprika, bakla\u017eani
  i syltumneicys ogur\u010di, zam golda span\u012b margancovk\u0101 mauduojuos seipuli
  apgr\u012bztom p\u012brem.\\n\\nKukn\u0113 dzeivys v\u012btys nabeja i rudin\u012b,
  kod tys vyss beja juodaboj zam jumta. Spani, skalini i kastis, vannys i maisi, maiseni.
  Kotr\u0101 b\u013c\u016bd\u0101 ko\u010d kas. Tys aiz tuo, tys iz tuo. Burkys p\u012bpi\u013cdeitys
  i apguoztys v\u0113\u013c korstys zam de\u010da, burkys tuk\u0161ys, burkys juomozgoj,
  spa\u0146s ar og\u016br\u010dim, vanna ar tomatim. Vuoceni, vuoki i vuoceni, vasals
  kokts receptu \u017eurnalim i gruomotom, recepti iz golda, pal\u016bdzis, iz radejis,
  dasprausti pi kalendera, attaiseiti, aizl\u016bceiti. Vysa, vysa vajag. V\u0113\u013c
  tuo i ituo.\\n\\nKai tik nu l\u012bknis aiz pierts augusta vokor\u0101 piec leita
  pasac\u0113le mygla, jei skr\u0113ja, ruove, nese. Mygla tomatim kai smierts. Kai
  suoc\u0101s augusts, kotra nakts, skaiti, kai p\u0101dejuo. N\u016bkaveisi, malnuo
  pyve i cauri. Mama izmysum\u0101 nese, slap\u0146um\u0101 iz\u017eulgu\u0161im pierstim.
  Aizaalsdama nese nu uor\u012bnis slap\u0146uma i v\u0101suma duorza lobumus ustob\u0101,
  sasi\u013cd\u0113ja kai b\u0101rnus. Seipulus sapyna biz\u0113s i pakuore pi cep\u013ca.
  Kai nazkod bierneib\u0101 ma\u0146 bizis nu reita. Lelom kastem zali tomati gataviejuos
  \u010dulan\u0101, apsagti ar vac\u016b mieteli. Ar t\u016b mieteli jei guoja iz
  dorbu. Es iz \u0161kolu. Obejis stuoviejom autobusa p\u012btur\u0101. Dasagivu pi
  polys, beja tik sylts, tik labi.\\n\\nMes jau se\u0146 narunuojom par dzeivi. Tik
  par og\u016br\u010dim, tomatim. K\u016b aizvest. K\u016b atvest.\\n\\n\u0160udi\u0146
  es n\u016bdevu dzeraunis p\u0101dej\u016b g\u016bvi. Nu p\u0101dejuo syltuo kl\u0101va
  izve\u017eu rudi\u0146a soltum\u0101 iz ma\u0161ynu. Mamys bryun\u016b g\u016bvi
  ar slap\u0146u dagunu i garu i osu m\u0113li.\\n\\nMes nase\u0146 kai asam \u012bsavuoku\u0161i
  jaunaj\u0101 treisustobu dzeiv\u016bkl\u012b. Beidz\u016bt ir gona v\u012btys vysam.\\n\\nV\u0113\u013c
  nav dalykti pakaram\u012b de\u013c driebu, nazkur pagaisu\u0161i puorsavuoc\u016bt.
  V\u0113\u013c nav sekcejis i driebu skapa. V\u0113\u013c piec puorves\u0161onys
  nav paraudzeita \u0161yut \u0161yuma\u0161yna, tik \u012bstumta koridora gol\u0101
  pi l\u016bga. V\u0113\u013c nav puorkruosuotys munys ustobys durovys, tok ma\u0146
  ir sova gulta, sovs golds i pat durovys iz lod\u017eeju. Beidz\u016bt ma\u0146 ir
  sova ustoba.\\n\\nEs iz\u012bmu uor\u0101 i klaus\u016bs, kai kl\u012bgdamys gais\u0101
  lidoj sv\u012bris, juos dzonoj\u0101s paka\u013c piec kukai\u0146u i sasasauc vysu
  laiku. Tei niu vysod byus muna pi\u013cs\u0101tys vosorys sajiuta. Sv\u012bris gais\u0101
  i saul\u0113 sakorsu\u0161a betona smuords.\\n\\nLelaj\u0101 ustob\u0101 sekcej\u0101
  stuov Herma\u0146a Hesis \\\"Stykla pierlei\u0161u sp\u0113lis\\\", div eksemplari,
  v\u012bnam vuoks pal\u0101kuoks nakai \u016btram. V\u012bna ir mamys, \u016btra
  t\u0113tis gruomota. Es raugu skaiteit, bet nasa\u012bt.\\n\\nPylni plaukti gruomotu.
  Es ari \u0161\u016bvokor var\u0101tu atguoduot i n\u016bsaukt seceibu. Lobaj\u0101
  pus\u0113 ir \u0161mukuos gruomotys par Latvejis muokslu i Bruo\u013cu kopim, par
  Latvejis upem, \u010cur\u013co\u0146a i Rozentala gleznom, \\\"Straum\u0101ni\\\",
  \\\"Viejim leidza\\\", Ojars Vuoc\u012bts i Harijs Heislers. Lel\u016bs romani i
  dzeja i munys b\u0101rnu gruomotys: Nazineits iz Miene\u0161a, Karlsons, Mozuo ragane\u0146a.
  Ma\u0146 ruod\u012bs, es ari niu var\u0101tu n\u016bsaukt i atguoduot kotru l\u012btu
  myusu dzeiv\u016bkl\u012b.\\n\\nDriebu pakaramais ar plastmasa r\u016bkei\u0161im
  koridor\u0101 se\u0146 ma\u0146 par zemli. Es asu izauguse.\\n\\nZa\u013ca kantaina
  plastmasys miskaste ar malnu izvuo\u017eamu spani vyd\u0101.\\n\\nPutek\u013cu syuciejs
  \\\"Ural\\\" kai opola i gryuta taburete zam zyla dermantina puorkluoja.\\n\\nVannys
  ustob\u0101 za\u013ca nal\u012btuota \u0161vamme ka\u010dei\u0161a form\u0101, nu
  mamys pyrmuo brauc\u012b\u0146a iz uorzemem.\\n\\nSorkons plastmasa z\u012bpu tur\u0101tuojs,
  kas kotru reizi \u012bkreit vann\u0101, kod kaids t\u012b mozgoj\u0101s.\\n\\nT\u0101va
  buordys skiunamuo b\u013c\u016bde\u0146a i bryunuo birste, \u017eiletis \\\"Niva\\\".
  Z\u016bbu pasta \\\"Aira\\\" i \\\"Buratino\\\", z\u012bpis nu VDR i nikod nal\u012btuota
  mugorys trynamuo birste gar\u0101 kuot\u0101. Metala bu\u0146d\u017ea ar jumprovom
  garuos kleituos, vyd\u0101 bi\u0146te i ze\u013conka, ocu skolojamais trauce\u0146\u0161
  i sausais spirts zyl\u0101 plastmasa cauruleit\u0113 ar vuoku. \u016alu gr\u012b\u017eamais
  ar metala druote\u0146om. Vac\u016bs p\u016bgu kasteite ar pionerim iz vuoka i kompetu
  b\u013caka bu\u0146d\u017ea \\\"Uzvara\\\" ar sakoltu\u0161im ze\u010dturu aiztaisamajim,
  kryu\u0161tura lencei\u0161u golim, kuo\u0161im i kuosei\u0161im, knopkom, spr\u0101dzem
  i cytu paaudzem kruot\u016b bagateibu \u2013 a mo\u017e n\u016bder\u0113s.\\n\\nNu
  dzeiv\u016bk\u013ca mes izavuocem, kod beja suoc\u012bs Persejis lei\u010da kars
  i zi\u0146uos vys skan\u0113ja Kuveitys vuords. Mes aizbraucem k\u016bpt sovu zemi.\\n\\nVaira
  nikod dzeiv\u0113 ma\u0146 nav bejs po\u0161ai sovys ostobys ar sovom durovom, sovu
  l\u016bgu i sovu izeju iz lod\u017eejis. Vysod tikai kokts, gultysv\u012bta, puse
  ustobys, puse gultys, vysod tikai nazkas \u012breits voi daleits ar vacuokim, draugim,
  veiru i b\u0101rnim.\\n\\nPa sapynim es b\u012b\u017ei asu tym\u0101 dzeiv\u016bkl\u012b.
  Vys v\u0113\u013c ir 1990. gods, ma\u0146 tikai aug kryuts, ma\u0146 ir gara bize,
  i vyss v\u0113\u013c tikai byus. Pyrmuos miene\u0161reizis, pyrmuo m\u012blesteiba
  i pyrmuos osorys par t\u016b, ka turpynuojuma tam vysam nav i nabyus.\\n\\nSapyn\u016bs
  ma\u0146 vys r\u016bk\u0101 ir munys s\u0101tys atsl\u0101gys, tys ir myusu jaunais
  treisustobu dzeiv\u016bklis. Mes ite dzeivuosim i nikur napuorsavuoksim. Mes dzeivuosim
  dzeiv\u016bkl\u012b, t\u0113te \u012bs iz dorbu i vokor\u0101 aizdzeis \u017eyguli
  iz gara\u017eu, at\u012bs ar k\u012bgeleiti nu veikala, n\u016bmozguos r\u016bkys
  i pi vakare\u0146u golda stuosteis, kaidi malni i dzili dabasi rudin\u012b i ka
  dzierd\u0113ja putynu bolsus, a mama at\u012bs nu dorba bibliotek\u0101, nu sumkys
  izjims jaunuos gruomotys, sataiseis sovo vokora kopeju, ar v\u012bnu r\u016bku puor\u0161kiers
  lopu, ar \u016btru daglauss golvu, i jai nabyus niv\u012bna sierma mota, tik ilgvi\u013cni.
  Baba atbrauks i atvess nu s\u0101tys burkys ar og\u016br\u010dim, t\u0101vs ryuks,
  ka navajadz\u0113ja tai st\u012bpt. Baba puorbaudeis munys burtneicys, nui, vuic\u012bs
  meite\u0146, vuic\u012bs. Atbrauks dzeds nu darei\u0161onu, i j\u012b obeji ar babu
  aizbrauks iz s\u0101tu. A es \u012b\u012b\u0161u sylt\u0101 vann\u0101 ar t\u016b
  \u0161vammi kai ka\u010deiti, a mama ar t\u0113ti iz divana v\u0113rs\u012bs kinu
  par suni maln\u016b Bimu ar v\u012bnu malnu ausi i sm\u012bs\u012bs da osoru.  I
  vyss v\u0113\u013c tikai byus. Niu mun\u016bs sapyn\u016bs vyss byus pareizi.\\n\\nMunai
  mamai beja taisneiba. Na jau par lelajom l\u012btom, t\u012b es jai vysleidza nap\u012bkreitu.
  N\u0101, es nikod vielie\u0161onuos nabolsuo\u0161u par tim trokajim i nikod nakruo\u0161u
  monta.\\n\\nMa\u0146 piec bieru paguoja vaira kai puse vosorys, cikom izteireju
  mamys s\u0101tu nu vysu t\u016bs v\u0113\u013c babys hlamu, nu driebu, nu kokaru,
  nu vysu t\u016bs juos nazde\u013ckuo sataupeit\u016bs dzeivuk\u013ca montu, izsv\u012b\u017eu
  vac\u016b \u0161vammi kai ka\u010deiti, sorkon\u016b z\u012bpu trauku, vac\u016b
  putek\u013cu syucieju. Vysu, vysu  izmie\u017eu, vysu izsv\u012b\u017eu, vysu sovetsk\u016b
  klamu, kab var\u0101tu t\u016bs kuormus puord\u016bt par sm\u012bkla naudu. Vysmoz
  niu tei ruod\u012bs sm\u012bkla nauda, a t\u016breiz es aizbrau\u010du ce\u013cuojum\u0101.\\n\\nEs
  zynu, ka it\u016b gon jei byutu saprotuse. Jei vys saceja \u2013 meite\u0146, pa\u017e\u0101loj
  seve po\u0161a, part\u016b ka niv\u012bns cyts teve na\u017e\u0101luos. I niu es
  t\u016b zynu. Tev beja taisneiba, mam.\\n\\nEs aizbrau\u010du ce\u013cuojum\u0101
  i vysu z\u012bmu beju syltum\u0101. Piec mamys bieru ma\u0146 beja tik solts, ruodejuos
  \u2013 sasti\u0146g\u0161u, sasa\u013c\u0161u i palik\u0161u nakur\u012bn\u0113
  stuov\u0113t. Tuo v\u012bt\u0101 stuovieju par mamys s\u0101tys naudu saul\u0113
  pi okeana i jutu, kai elpojam v\u012bn\u0101 ritm\u0101: es, mama i okeans.\\n\\nJuosalai\u017e.
  Juobrauc. Juosatyn. Juosad\u016bd. Juob\u0101g.\\n\\nMeita saceja, ka juosalai\u017e
  ce\u013c\u0101. Gona. V\u0113\u013c drusku, i byus par vieli.\\n\\nTova eistuo dzeive
  ir saime, a saime jau ir t\u012b, uorzem\u0113s. J\u012b aizbrauce pyrms nazcik
  godu. Niu j\u012b ir tikai datora ekran\u0101 i s\u0101t\u0101 vi\u0146 pa kopusv\u0101tkim.
  Meita vakar vysu vokoru raudzeja runuot. Brauc, mam. Gaidom, mam. Paleidzeisi ma\u0146
  piec dzemdeibu. Brauc. Mudri jau byus par vieli.\\n\\nTu jau nikod naklausi, mam.
  J\u012b mudri byus kluot. Amerikys viestn\u012bceibu jau evaku\u0113ja. Ir laiks.
  Niu ir p\u0101dejais laiks pamest vysu i braukt paceli.\\n\\nBet tu navari. Juoizgolda
  tok pupenis i juopajem leidza ko\u010d s\u0101klai. Gon jau zeme atsarass. Juosarunoj,
  kas apk\u016bps kopus. Preteim\u0101 tu jim \u012bd\u016bsi sovys ustobys atsl\u0101gys.
  Jemit i dzeivojit. Izvolkojit skapus i pogrobu. Lai teik.\\n\\nKab tikai t\u012b
  prokuosti naaizlaistu t\u016bs kopu. Kab tik apk\u016bptu. \u017d\u0101l, bet monta
  jau leidza grob\u0101 napajimsi. Juosal\u012bk tik slap\u0146\u0101 dr\u0113b\u0113
  leidza mirtys zori \u2013 dasaugs p\u016bd\u0101 i krystobom byus kai reizi. Juosamaina
  nauda, juosataisa jauna bankys karte. Bess zyna, kai t\u012b iz v\u012btys byus,
  a mo\u017e i pi naudys vaira natiksi. Juojem vi\u0146 vysa uor\u0101, lai napal\u012bk
  kr\u012bvam. Juon\u016bpierk \u010demodans. Otkon juobrauc iz t\u016b R\u0113zekni.
  Pi notara, pi saimis uorsta, iz veikalim. Juoapcierp i juon\u016bkruosoj moti. Nabrauksi
  tok iz uorzemem skust\u0101 voi \u013cau\u017eu b\u012bdeitu. K\u016b \u013cauds
  pad\u016bmuos.\\n\\nS\u0101t\u0101 beju v\u012bna po\u0161a, iz ustobys vyds stuov\u0113ja
  kastis, vysi l\u016bgi va\u013c\u0101. Gribieju aiztaiseit, lai nav caurvieja. Uor\u0101
  na rikteiga z\u012bma, a taids kai rudi\u0146s, vyss apsalaids, morkotnai. Pal\u0101ki
  dabasi, pal\u0101ks leits, solts.\\n\\nPajiemu mamys albumu.\\n\\nIte mama moze\u0146a
  tautyskuos dr\u0113beit\u0113s, tys ir v\u0113\u013c pyrms kara.\\n\\nIte jei jau
  \u012bt \u0161kol\u0101, 1948. gods. J\u016bs klase ar audzynuotuoju. Tys ir gods
  pyrms izves\u0161onu iz Sibireju, bi\u013cd\u0113 ver\u0101s b\u0101rni ar b\u016bglom
  lel\u016bs cylv\u0101ku acim, kuojis saruovu\u0161i zam kr\u0101slu, mugor\u0101
  b\u012bzys dr\u0113bis.\\n\\nIte kara laika biegli, krystt\u0101vam beja fotoaparats,
  beja atguojs c\u012bm\u0101 i saguoja kartenis. Biegli paleidz pi s\u012bna, b\u0101rni
  upmal\u012b gona vu\u0161kys. Bieg\u013cu meitu\u0161ka Nasta ar garom bizem i zyl\u0101
  mieteleiti ar div ryndom p\u016bgu, a ite muna mama moze\u0146u ar j\u016b. Tei
  meitine s\u0101tys b\u0101rnim beja lela draudzine \u2013 tai kai par aukli, cikom
  lel\u012b pi s\u012bna. Po\u0161ai jai mozuoka muosa i bruoleits. Loba meitine beja,
  vysim kai muosa.\\n\\nTai meitinei vaira nabeja s\u0101tys, vyss kar\u0101 n\u016bdaga.
  Guoja armeja puori, vysu n\u016bleidzynuoja leidza ar zemi. Kr\u012bvi, vuoc\u012b\u0161i
  \u2013 bess zyna. Paslapti\u0146 n\u016bguoja apsav\u0101rtu, a vyss cauri \u2013
  plyki \u0161k\u016brstini vi\u0146 nu\\n\\n7\\n\\napdagu\u0161\u016bs k\u016bku
  i izpyusta beigta g\u016bvs iz pogolma vyds. Tai i ce\u013c\u0101, ce\u013c\u0101.
  Ar t\u016b, kas mugor\u0101, steig\u0101 b\u0101g\u016bt, veik\u0161eit\u012b \u012bs\u012bts.
  Laime, ka dzeivi. Kur golvu n\u016blyki, t\u012b tev i s\u0101ta.\\n\\nSve\u0161uo
  meitine bi\u013cd\u0113 izaver piec vaca cylv\u0101ka. \u0160muka seje\u0146a, garys
  gai\u0161ys bizis, tok nasmaida. Muna mama bi\u013cd\u0113 ir mozs, opols b\u0101rns
  \u2013 kai nu cyta pasau\u013ca. Kab cytys dr\u0113bis i moti, jei m\u012breigi
  var\u0101tu byut i \u0161\u016bs laiku b\u0101rns.\\n\\nMeitinei Nastai t\u012b
  bi\u013cd\u0113 mugor\u0101 \u0161muks mieteleits iz vosorys vyds, lobuoku driebu
  jau nabeja, t\u016b po\u0161u lobuok\u016b apvylka, kab iz kartenis \u0161muki.
  Mama vys saceja \u2013 tik lobs mieteleits, gai\u0161i zyl\u0101 kruos\u0101.\\n\\n\u012asad\u016bmoj,
  es bi\u013cd\u0113 radzu pal\u0101ku dr\u0113bi i zynu juos kruosu. D\u016bmuot,
  es po\u0161a t\u012b byutu bejuse. Es asu p\u0101dejuo, kas atguodoj munys mamys
  bierneibu. Atguodoj ari bieg\u013cu meitini mieteleit\u012b.\\n\\nBeja cylv\u0101ks,
  niu tik karte\u0146a sve\u0161\u0101 album\u0101. J\u016b n\u016bsuove kr\u012bvi,
  kod \u012bguoja vyd\u0101. V\u012bnkuor\u0161i taipat. Mo\u017e napad\u016bmuoja,
  ka vystu klieve\u0146\u0101 globoj\u0101s b\u0101rni. Kai laide viers\u0101, tai
  spolvys vi\u0146 pajuka \u2013 vystys, b\u0101rni, asnis i osorys.\\n\\nMama it\u016b
  stuosteja kasreizis, kod bierneib\u0101 obejis v\u0113rem\u0113s juos albuma. Kai
  vysi iz pogolma kl\u012bdze. Kai lel\u016bs nalaide paleig\u0101, kai t\u012b prokvuosti
  par\u0113ce, par\u0113ce nazk\u016b i aizbrauce, a tepat kop\u016bs izroka d\u016bbi
  i \u012blaide zem\u0113. Ni groba beja, ni kuo. Taipat nu ustobys viersa die\u013cu
  sasyta kasteiti, apmozguoja, apuove lobuokaj\u0101 i \u012blaide zem\u0113. Tym\u0101
  po\u0161\u0101 gai\u0161aj\u0101 mieteleit\u012b ar p\u016bgom, \u016bdere ar pu\u010deitem,
  vij\u016bleitem, ar smolkom r\u016bzeitem, ar taidim nazkaidim boltim z\u012bdenim.\\n\\nMama
  vys atguoduoja, cik skaists jis beja. Dabasu zyls audums, p\u016bdzenis ar sudobra
  streipeiti, sleideiga \u016bdere seikom pu\u010deitem, taidom boltom kai peis\u0101
  z\u012bd mudri piec Juo\u0146ad\u012bnys.\\n\\nTod j\u012b vysi otkon aizguoja paceli.
  Aizguoja taipat kai guoju\u0161i, div lel\u012b i vi\u0146 div mozys ga\u013cvenis.
  Aizkust\u0113ja gar ce\u013camolys kryumim. Nu suokuma ga\u013cvenis pagaisa, tod
  boltais veik\u0161s, polog\u0101 sas\u012bta vysa saimisteiba. Tod vaira nikuo.\\n\\nVaira
  niv\u012bna nikod natyka radz\u0101ts, j\u012b nikod naatbrauce iz kopim pi Nastys.
  Ni t\u0101vs ar muoti, ni bruoleits, ni muose\u0146a. Beja cylv\u0101ki, aizguoja,
  pagaisa kara viejputn\u012b. Tik vi\u0146 palyka kai mieteleits album\u0101, mamys
  stuost\u016bs i munuos atmi\u0146uos. Septe\u0146desmit godu piec kara.\\n\\nJuopabeidz
  de\u010ds. Mozajam unuce\u0146am tu odi tymsi zylu de\u010di ar zalta zvaigznem.
  Ka nikuo cyta nu dzeda s\u0101tys jam navari \u012bd\u016bt, jam tiks zvaig\u017e\u0146u
  de\u010ds nu juo babu i probabu spr\u0101stuos, sauceituos, kruosuotuos dzejs, nu
  s\u0101tys vu\u0161ku vylnys i jam byus vysa tova m\u012blesteiba.\\n\\nJis ir v\u012bneigais
  \u012bmeslis, de\u013ckuo tu nasoki n\u0101. Meita runoj i runoj. Tu klusej, tu
  naesi sajiusm\u0101, bet tu brauksi. Tu byusi loba baba saimis v\u0113\u013c nadzymu\u0161ajam
  b\u0101rnam. Tev byus bezgaleiba laika i m\u012blesteibys. Nu sova kliepa uor\u0101
  nalaissi. Lai mama struodoj. Lai mama pe\u013cnej naude\u0146u. Mamai ir\\n\\njuos
  dorbs, t\u012b jau pi j\u016bs navar kai Latvej\u0101 \u2013 miene\u0161im i godim
  s\u0113d\u0113t s\u0101t\u0101. P\u012bdzemdieji i, dui, atpaka\u013c dorb\u0101.\\n\\nBet
  nikuo. Es t\u012b byu\u0161u. Muns klieps ir meiksts i sylts, muna sirds ir lela.\\n\\nTev
  byus vyss. Vysa muna m\u012blesteiba, vyss muns klieps i vysa muna breiveiba palaist
  \u012bt pasaul\u012b. Tu aiz\u012bsi nu mane, kai ir aizguoju\u0161i jau tik daudzi,
  bierne\u0146. Bet es byu\u0161u tovs sp\u0101ks, cikom tev juo vajadz\u0113s, i
  ari v\u0113\u013c piec tuo. Es myu\u017eam byu\u0161u tova muote.\\n\\nMes obeji
  \u012bsim staiguotu, bierne\u0146, obeji skaiteisim gruomotys. Es tevi turei\u0161u,
  es tevi n\u016bturei\u0161u, muna r\u016bka vysod byus tev pad\u016bta.\\n\\nNui,
  juosal\u012bk \u010demodan\u0101 meitys \u0161mukuos bi\u013c\u017eu gruomotys.
  Iz krystobom juon\u016bpierk rikteiga voska svece. Juopaprosa pi v\u012bna sev Postoruo
  svieteiba. Voi ta j\u012b uorzem\u0113s j\u0101dz k\u016b pa rikteigam nu bazneicys
  dzelu, tik krotuos i uovej\u0101s.\\n\\nTev vyss byus, bierne\u0146, sve\u0161aj\u0101
  pus\u0113. Tev vysa byus gona, ko\u010d tev nikod nabyus tova dzeda s\u0101tys.
  Tev byus pats svareiguokais \u2013 dzeiveiba. N\u016bsorguota nu vaidu i vuorgu,
  b\u0101g\u016bt pagluobta. Tev nabyus dzeda, bet tev, bierne\u0146, byu\u0161u es.\\n\\nKod
  Herods n\u016bkaus vysus zeidam\u016bs b\u0101rnus, tu, bierne\u0146, dzeivuosi.
  Vysa saime byus ap tevi, i t\u012b, kur tu byusi, byus tova s\u0101ta.\\n\\nA tu
  paraugi. Aiztaisi acs, izbuoz m\u0113li i gaidi.\\n\\nKod navi\u0146 kaida sn\u012bga
  puorsla n\u016bkriss ari iz m\u0113lis. Tova mute vysa byus slap\u0146a, byudi n\u016bsolu\u0161i,
  daguna gol\u0101 lase. Bet tu sajussi, kai jei dasadur. Tikai v\u012bna eisa \u0161a\u013cte\u0146a
  nu myu\u017eeibys. Nikuo vaira. Solts zibsnis iz m\u0113lis, dasadur i pagaist.
  D\u016bmuot, nikuo i nabyutu bejs. A tu stuovi i gaidi, apleik sn\u012bga smuords,
  meikstyune, lelom puorslom sn\u012bgs lepej nu gaisa, ruod\u012bs, pat ska\u0146a
  tam ir.\\n\\nA tev tikai tei v\u012bna puorsla iz m\u0113lis. Varbyut byus, varbyut
  i nabyus. Stuovi kai glupuoka, kai nazkod bierneib\u0101 pi babys ustobys voi studeju
  laik\u016bs pi stacejis, gaid\u016bt vi\u013cc\u012bni iz Reigu, stuovi i ceri iz
  nazyn kuo.\\n\\nTu, Marija, esi iznosuojuse sovu augli. Jam tikai ir juop\u012bdzymst.
  Juo vuords ir. Jis pats ir vuords, jis ir ce\u013c\u0161, pat\u012bseiba i dzeiveiba.\\n\\nTev
  pr\u012b\u0161k\u0101 ir pats gryutuokais \u2013 atrast dr\u016bs\u016b v\u012btu
  itym\u0101 vuorgu pasaul\u012b i radeit jaunu dzeiveibu, radeit nu nikuo, kod vuords
  kliva m\u012bsa. Tu esi Marija, myu\u017eeiguo muote, myu\u017eeiguo radeituoja,
  cereiba, globuotuoja, sorguotuoja, myusu patv\u0101rums nu vysa.\\n\\nTu esi stuodaiga,
  ap k\u016b zier\u0146am peit\u012bs iz aug\u0161u. Tu esi perine vysta, kas sasauc
  sovus b\u0101rnus zam spuornu. Tu esi muola p\u016bds, kur\u0101 salikt po\u0161u
  svareiguok\u016b. Tu esi dereibys skreine, kur\u0101 Vacuo dereiba sasateik ar Jaun\u016b,
  kur\u0101 zeme sasajauc ar dabasim, kur\u0101 jiedz\u012b\u0146s apaug ar m\u012bsu
  i pal\u012bk par vuordu.\\n\\nMarij, tu solt\u0101 z\u012bmys reit\u0101 stuovi
  pi l\u016bga, bet tu po\u0161a esi l\u016bgs. Tu esi l\u016bgs, pa k\u016b \u012bspeid\u0113t
  aust\u016b\u0161ai reita gaismai nu uora. Tu esi l\u016bgs, pa k\u016b sylta kuknis
  gaisma storoj iz uoru.\\n\\nNav nikuo sv\u0101tuoka kai s\u0101ta, kurai ir gai\u0161i
  l\u016bgi. Par cik verstu dzierd suni rejam. Par cik s\u0101tu dzierd gaili dz\u012b\u017eam.
  Cik b\u012b\u017ei redz dyumus nu \u0161k\u016brsti\u0146a kiup\u016bt. Cik tuoli
  nu kolna iz kolnu redz Juo\u0146u gu\u0146s, tik ilgi mes dzeivuosim.\\n\\nBet tu,
  Marij, po\u0161a esi gu\u0146s, kas aizdadzynuos vysa pasau\u013ca cep\u013cus,
  plitys, svecis i gunkurus. Tu esi l\u012bsme, pi kuo sasasi\u013cdeis vysa tova
  saime. Tu esi maizis ceplis, kas pabaruos vysu pasauli. Tu esi sylta m\u012bsa,
  nu kuruos p\u012bdzimt tovim b\u0101rnim, pi kuo jim sasasi\u013cdeit pasau\u013ca
  vuorg\u016bs i na\u017eielesteib\u0101.\\n\\nBet niu tu stuovi pi kuknis l\u016bga
  i ver\u012bs, kai pamaze\u0146am l\u0101c z\u012bmys saule. Gaisma at\u012bt kluse\u0146om,
  nikas daudz jau nasamaina. Tev byutu juo\u012bkur plita, juoizvuorej putra i kopeja
  sovejim, juoizl\u012bk cyukom virt bu\u013cbu kotlu i juosasylda g\u016bvei iudini.
  Tev byutu juosataisa \u0113st, juopalai\u017e vysi pa celi nu s\u0101tys.\\n\\nBet
  tu ver\u012bs pa l\u016bgu, i tei ir tova dzeive. Tei \u0161a\u013cte\u0146a ir
  tova dzeive. Tei eisuo p\u012btura ce\u013c\u0101. Tei eisuo \u0161a\u013cte\u0146a,
  cikom tu, Marij, nu reita ver\u012bs pa l\u016bgu iz bolta duorza, sn\u012bga apleik
  uobe\u013cneicom i iz sorkonys gaismys t\u012b austrum\u016bs.\\n\\nKas tu esi,
  Marij. Kod tev apleik vaira nav niv\u012bna sova  \u2013 ni t\u0101va ar muoti,
  ni dzeda ar babu, ni muosu, ni bruo\u013cu. Kod tev, Marij, nav palics vaira nikuo
  nu bierneibys i tu esi v\u012bna po\u0161a iz vysa pasau\u013ca.\\n\\nKod esi tikai
  tu, D\u012bvs t\u0101vs dabas\u016bs i b\u0101rns tev zam sirds. Nazkur t\u012b
  vyd\u0101 v\u0101dar\u0101, pats par sevi i vyss v\u0113\u013c tovs. I ce\u013c\u0161
  tev zam kuoju. Kai ka\u010dinei at\u012bt iz s\u0101tu i \u012bleist myg\u0101 laist
  pasaul\u012b b\u0101rnus. Sajimt aiz \u010dupra i nest, i volkuot sev leidza dr\u016b\u0161eib\u0101.
  Tu esi vysu muote, Marij. Tu, Marij, esi vysu myusu muote, i tev pi tuo byus juop\u012br\u016bn.\\n\\nKod
  tova dzymtuo s\u0101ta ir tuoli aiz mugorys, a po\u0161ai sovys s\u0101tys tev nav
  i nabyus. Nu t\u0101va s\u0101tys tu esi aizguojuse, part\u016b ka tys laiks ir
  cauri. A tova veira s\u0101ta v\u0113\u013c nav izcalta, part\u016b ka tuo laika
  v\u0113\u013c nav. Tu ej i ej.\\n\\nTu siedi iz juo n\u016bpierktuo ezelei\u0161a,
  jis ir apsajiems sorguot tevi, jis vad aiz stri\u010dei\u0161a, ezeleits sekoj,
  tu ver\u012bs iz sovu r\u016bku. Pa \u0161a\u013ctei veirs pasaver iz teve, kai
  gaideidams apstyprynuojuma \u2013 nui, es ari tai d\u016bmoju, ejam. Bet tu tok
  juo napazeisti.\\n\\nTu esi ce\u013c\u0101. Tu, Marij, myu\u017eeigi esi ce\u013c\u0101.
  Tev nav sovys gultys, kur\u0101 atsalaist i izst\u012bpt p\u012bdzeituos kuojis.
  Niu p\u0101dejuos nede\u013cuos tai lau\u017e mugoru, kuojstarp\u0113 izaplie\u0161
  kauli i suop nu \u012b\u0161onys, v\u0101dars sasavalk c\u012bts i pa laikam suop
  mugora. Kab variejs atsagu\u013ct, a ir tikai ce\u013c\u0161, ce\u013c\u0161 i ce\u013c\u0161.
  Tu esi v\u012bna, Marij, ar sovu po\u0161u gryutuok\u016b nostu. Tu esi pylna ar
  vuordim, bet jim v\u0113\u013c nav laika. Tu klusej i ver\u012bs iz ce\u013ca sev
  zam kuoju.\\n\\nTu, Marij, varbyut nikod nadzeivuosi sov\u0101 s\u0101t\u0101, part\u016b
  ka tu naesi taidu \u013cau\u017eu. Tu vysod esi ce\u013c\u0101, i tu ce\u013cu nosoj
  sev leidza. Tovs b\u0101rns tev\u012b syt\u0101s ar r\u016bkom i kuojom, tu atsapyusdama
  siedi iz akmi\u0146a ce\u013ca mol\u0101 i ver\u012bs iz sova leluo v\u0101dara.
  Tu esi taidu \u013cau\u017eu. Tei ir tova m\u012bsa, tei vys tik esi tu po\u0161a,
  bet v\u0113\u013c nadaudz i da\u013ca nu teve vaira nikod nabyus ar tevi.\\n\\nTu
  vysod esi ce\u013c\u0101, Marij, i vysu svareig\u016b nes sev leidza. Ari tod, kod
  niv\u012bnam nikur vaira nav juo\u012bt, kod vysi ir ite, vysi ir apleik, vysi ir
  apklusu\u0161i i gaida, k\u016b ta tu saceisi. Kod apleik nadzierdi ni seikuokuos
  skanis, vi\u0146 sovu bolsu nazkur nu dzil\u012bnis. Kod vysi tovi celi ir izabeigu\u0161i
  i ir palics vi\u0146 ce\u013c\u0161 pi seve. Pat tod tev nav m\u012bra.\\n\\nKod
  vysi ir saguoju\u0161i ite \\\"Gor\u0101\\\" i niv\u012bna nav pi seve iz v\u012btys
  s\u0101t\u0101. Kod vysi ir aizguoju\u0161i paceli nu sovys s\u0101tys i gaida tova
  vuorda. Gaida t\u016bs vuordu, k\u016b tu nes sev\u012b. Bet tev nav nikuo, vi\u0146
  sajiuta \u2013 niu otkon ir juo\u012bt. Ce\u013c\u0161 otkon teve sauc, i tu vari
  jam tikai sekuot. Part\u016b ka tu, Marij, naesi nu t\u016bs, kas runoj. Ko\u010d
  tev byutu juobyut tai, kas aizdadz guni i pasauc sev leidza. Ko\u010d tev byutu
  juobyut tai, kas pasoka, kai ir niu i kai byus iz pr\u012b\u0161ku.\\n\\nTu esi
  pylna ar pat\u012bseibu, tu d\u016bmoj, tu dzeivoj, tu pa sapynim m\u012bg\u0101
  rodi jaunu pasauli. T\u012b tev beidz\u016bt ir sova s\u0101ta, sova g\u016bvs i
  pylns kl\u0101vs kust\u016bnis. T\u012b tev ir jauna ma\u0161yna i ustoba kai vysim
  normalim cylv\u0101kim. Tu muoki vysu, tu vysu vari, tev vyss sa\u012bt. Tev ustob\u0101
  nav nikuo l\u012bka i vyss ir sov\u0101 v\u012bt\u0101.\\n\\nTok at\u012bt reits
  i otkon nikuo. Tu otkon siedi pi tuk\u0161a dokumenta sov\u0101 dator\u0101 i d\u016bmoj.\\n\\nKuri
  vuordi ir tik svareigi, kab j\u016bs saceit.\\n\\nKuri vuordi ir tik byutiski, kab
  j\u016bs na tikai izd\u016bmuot, bet ari pasaceit bols\u0101.\\n\\nKuri celi ir
  tik svareigi, kab j\u016bs \u012btu, i kurus p\u0101dus aizslauceis sn\u012bgs i
  viejputnis.\\n\\nTu, Marij, esi vysu myusu patv\u0101rums. Tu esi cereibys skreine.
  Tu esi gluob\u012b\u0146s nu vysa, tu esi gluob\u012b\u0146s ari nu mane po\u0161ys,
  kod ar vuordim, dorbim i n\u016blaideibu es staigoju moldu ce\u013cus voi na\u012bmu
  laik\u0101 iz s\u0101tu, kod naizpyldu muojisdorbu \u0161kol\u0101, laik\u0101 nan\u016bd\u016bdu
  studeju referatu i \u012bskai\u0161u, terme\u0146\u016bs na\u012bsak\u013caunu un
  napabeidzu projektu p\u012bsacejumu i atskai\u0161u. Kod vysi muni projekti ir n\u016braideiti,
  tu esi muna muote Marij. Tu esi sorguotuoja. Tu esi mums vysim i vysam vyss.\\n\\nTik
  ka kas dasad\u016brtu. Ar syltu i m\u012breigu r\u016bku. Nikuo daudz \u2013 tikai
  sajust sevi dzeivu cylv\u0101ku. Sevi sajust. I ka kas pajimtu iz syltu i stypru
  r\u016bku. Pacaltu i nastu. D\u012bva i sp\u0101ka goru sajust. Atbolstu i pace\u013c\u0161onu
  sajust.\\n\\nTik kas ir tys, kas reizem kai dasadur, kai dasam\u012bdz \u2013 pajem
  aiz r\u016bkys i vad, pajem aiz driebu i n\u016btur. Kas dzeivi pataisa dzeivu.
  Kas vysu sagr\u012b\u017e kuojom gais\u0101. Dasadur, pace\u013c i nas.\\n\\nKas
  ir tei sn\u012bga puorsle\u0146a iz m\u0113lis.\\n\\n\u012asad\u016bmoj. Tu tiule\u0146
  aizmigsi, pasam\u016bssi i tod dzeivuosi pa eistam. Tu liene\u0146om aizmigsi, nad\u016bmoj\u016bt
  nikuo, a dzeive po\u0161a at\u012bs da teve.\\n\\nI tod vyss byus pa eistam. Vyss
  byus i byus, i byus, byus i byus.\\n\\nI tu byusi, Marij. Tu byusi pa eistam, tu
  byusi vysu myusu muote, Marij.\"", "\"B\u012bdreibys \u201eLgSC\\\" statuti\\n\\n(2020.
  goda 15. marta redakceja)\\n\\n1. VYSPUOREIG\u012a N\u016aSACEJUMI\\n\\n1.1. \u201eLgSC\\\"
  (iz pr\u012b\u0161ku tekst\u0101 \u2013 B\u012bdreiba) ir patstuoveiga B\u012bdreiba,
  kurys darbeibys mierki i aizdavumi ir n\u016bsaceiti itym\u016bs Statut\u016bs.
  B\u012bdreibai ir juridiskys personys statuss, i jei dorboj\u0101s atbylst\u016b\u0161i
  Latvejis Republikys lykum\u016bs n\u016bsaceitajai kuorteibai i saska\u0146\u0101
  ar itim Statutim, jei ir bezpe\u013cnis organizaceja.\\n1.2. B\u012bdreibys n\u016bsaukums
  latv\u012b\u0161u vol\u016bd\u0101 ir LgSC, kr\u012bvu vol\u016bd\u0101 \u2013 \u041b\u0433\u0421\u0426,
  ang\u013cu vol\u016bd\u0101 LgSC.\\n1.3. B\u012bdreibys simboliku veidoj stilizeits
  organizacejis n\u016bsaukums (p\u012blykums Nr. 1).\\n1.4. B\u012bdreiba dorboj\u0101s
  Latvejis Republikys teritorej\u0101 i uorpus juos, sasadorboj\u016bt ar leidzeigom
  organizacejom cytuos va\u013cst\u012bs, kai ari cytom B\u012bdreibys interesis aizstuov\u016b\u0161om,
  atbolst\u016b\u0161om i \u012bsaisteitom \u012bstuodem, fiziskom i juridiskom personom.\\n1.5.
  B\u012bdreiba ir dybynuota iz nan\u016bsaceitu laiku.\\n\\n2. B\u012aDREIBYS MIERKIS\\n\\n2.1.B\u012bdreibys
  darbeibys mierkis ir sekm\u0113t jaun\u012b\u0161\u016bs Eiropys pyls\u016bneibys
  apsazynuo\u0161onu i veicynuot jaun\u012b\u0161u \u012bsasaistei\u0161onu Latgolys
  n\u016bvoda kulturvidis, ekonomiskuos i socialuos vidis atteisteib\u0101, puorstuov\u0113t
  i styprynuot saikni ar Latvejis diasporu, koordin\u0113t ar t\u016b saisteit\u016bs
  projektu izstruodi i realizie\u0161onu.\\n2.2.B\u012bdreibys golvon\u012b aizdavumi:\\n2.2.1.
  izstruoduot, koordin\u0113t i realiz\u0113t projektus, kas sekmej jaun\u012b\u0161u
  \u012bsasaistei\u0161onu Latgolys n\u016bvoda kulturvidis, ekonomiskuos i socialuos
  vidis atteisteib\u0101,\\n2.2.2. apzynuot jaun\u012b\u0161us i studentus, kas \u012bt
  nu Latgolys, i veicynuot j\u016bs sadarbeibu,\\n2.2.3. veicynuot latgaliskuos po\u0161apzinis
  ce\u013c\u0161onu i latgal\u012b\u0161u vol\u016bdys l\u012btuo\u0161onu, atteisteit
  interesi par Latgolys kulturvidi, ekonomiku i sab\u012bdriskajim procesim,\\n2.2.4.
  sekm\u0113t jaun\u012b\u0161\u016bs Eiropys pyls\u016bneibys apsazynuo\u0161onu,
  kai ari k\u016bpeigys eiropeiskuos identitatis sajiutys i integracejis izaveiduo\u0161onu.\\n2.3.B\u012bdreibys
  darbeibys metodis:\\n2.3.1. apk\u016bpuot i izd\u016bt informativus materialus (bukletus,
  video materialus, av\u012bzis, prospektus i c.) par Latgolys kulturys montuojumu,
  ekonomiskajim i sab\u012bdriskajim procesim i aktivitatem,\\n\\n2.3.2. inform\u0113t
  sab\u012bdreibu par B\u012bdreibys darbeibu,\\n2.3.3. sasadorbuot ar cytom organizacejom
  i institucejom mier\u0137u sasn\u012bg\u0161onai i projektu realizacejai,\\n2.3.4.
  reikuot vysaida veida i rakstura apvuiceibys, n\u016bmetnis, seminarus, konferencis
  i diskusejis,\\n2.3.5. veikt izgleitoj\u016b\u0161us, informej\u016b\u0161us i izklaidis
  pasuokumus,\\n2.3.6. sekm\u0113t pietiejumu veik\u0161onu,\\n2.3.7. populariz\u0113t
  i izk\u016bpt studentu vyd\u0101 latgaliskuos tradicejis,\\n2.3.8. sekm\u0113t lykumd\u016b\u0161onys
  pylnveiduo\u0161onu Latgolys n\u016bvoda intere\u0161u aizstuovei\u0161onai,\\n2.3.9.
  sasadorbuot ar Latgolys po\u0161va\u013cdeibom informacejis apmai\u0146\u0101, k\u016bpeigu
  projektu izstruod\u0113 i realizie\u0161on\u0101,\\n2.3.10. aicynuot Latgolys jaun\u012b\u0161us
  stud\u0113t i \u012bgiut augstuok\u016b izgleiteibu, kai ari veicynuot jaun\u016bs
  specialistu atsagr\u012b\u0161onu Latgol\u0101,\\n2.3.11. ryup\u0113t\u012bs par
  organizacejis darbeibys mier\u0137u izpi\u013cdis ilglaiceigumu, jaunu aktivistu
  p\u012bsaistei\u0161onu,\\n2.3.12. veikt cytys Latvejis lykumd\u016b\u0161on\u0101
  at\u013cautuos darbeibys.\\n\\n3. B\u012aDRU \u012aSASTUO\u0160ONA B\u012aDREIB\u0100,
  IZASTUO\u0160ANA I IZSLIEG\u0160ONYS N\u016aSACEJUMI\\n\\n3.1. Par B\u012bdreibys
  b\u012bdru (iz pr\u012b\u0161ku tekst\u0101 \u2013 b\u012bdrs) var kliut sevkura
  reiceibspiejeiga fiziska persona, kuru interesej B\u012bdreibys darbeiba i kas atbolsta
  i apsajem \u012bv\u0101ruot it\u016bs Statutus, B\u012bdreibys puorva\u013cdis instituceju
  l\u0101mumus, \u012bsn\u012bdz\u016bt rakstisku p\u012bsacejumu. P\u012bsacejuma
  formu i jam kluot dalykt\u016bs dokumentu sarokstu n\u016bsoka \u201eN\u016blykums
  par jaun\u016bs b\u012bdru p\u012bjim\u0161onu\\\", k\u016b izstruodoj i p\u012bjem
  B\u012bdreibys va\u013cde (iz pr\u012b\u0161ku tekst\u0101 \u2013 va\u013cde).\\n3.2.
  (izsl\u0101gts ar 08.03.2008 statutu gr\u016bziejumim)\\n3.3. L\u0101mumu par b\u012bdra
  p\u012bjim\u0161onu ci izslieg\u0161onu B\u012bdreib\u0101 p\u012bjem va\u013cde.
  Va\u013cdis l\u0101mumu par atsacejumu p\u012bjimt par B\u012bdreibys b\u012bdru
  var puorsyudz\u0113t b\u012bdru K\u016bpsapu\u013cc\u0113.\\n3.4. Kotram B\u012bdreibys
  b\u012bdram B\u012bdreibys K\u016bpsapu\u013cc\u0113 ir v\u012bns bolss.\\n3.5.
  B\u012bdreibys b\u012bdra t\u012bseibys:\\n3.5.1. p\u012bsadaleit vys\u016bs B\u012bdreibys
  pasuokum\u016bs i sapu\u013cc\u0113s, izvierz\u0113t pr\u012b\u0161klykumus i apspr\u012bst
  izvierzeit\u016bs vaicuojumus,\\n3.5.2. p\u012bsadaleit B\u012bdreibys vadeibys
  i revizejis instituceju vielei\u0161onuos, izvierz\u0113t sovu ci cyta b\u012bdra
  kandidaturu i tikt \u012bv\u0101l\u0101tam B\u012bdreibys vadeibys i revizejis institucejuos,\\n3.5.3.\\n\u012bsapazeit
  i sajimt informaceju par B\u012bdreibu, juos darbeibu,\\n3.5.4. breivi dorbuot\u012bs
  cytuos organizacejuos,\\n3.5.5. Va\u013cdis n\u016bsaceitaj\u0101 kuorteib\u0101
  l\u012btuot B\u012bdreibai p\u012bdar\u016b\u0161\u016b i l\u012btuo\u0161on\u0101
  n\u016bd\u016bt\u016b k\u016bpej\u016b montu,\\n3.5.6. sevkur\u0101 laik\u0101 breivi
  izastuot nu B\u012bdreibys, par t\u016b \u012bsn\u012bdz\u016bt rakstisku \u012bsn\u012bgumu
  Va\u013cdei,\\n\\n3.5.7. veikt cyta veida darbeibu, kas atbylst B\u012bdreibys mierkim
  i ir saisteita ar B\u012bdreibys aizdavumu veik\u0161onu.\\n3.6. B\u012bdra p\u012bnuokumi:\\n3.6.1.
  \u012bv\u0101ruot Statutus, p\u012bsadaleit B\u012bdreibys darbeib\u0101, izpi\u013cdeit
  aizd\u016bt\u016bs p\u012bnuokumus i aizdavumus,\\n3.6.2. aktivi leidzadorbuot B\u012bdreibys
  darbeib\u0101, mier\u0137u i aizdavumu eistynuo\u0161on\u0101,\\n3.6.3. veikt b\u012bdru
  naudys \u012bmoksys K\u016bpsapu\u013ccis n\u016bsaceitaj\u0101 apm\u0101r\u0101
  i moksuo\u0161onys kuorteib\u0101,\\n3.6.4. nap\u012b\u013caut reiceibu, kas sagraun
  B\u012bdreibys g\u016bdu i presti\u017eu sab\u012bdreib\u0101.\\n3.7. B\u012bdreibys
  Va\u013cde var izsl\u0113gt b\u012bdru nu B\u012bdreibys, ka b\u012bdrs ir izdariejs
  kaidu nu sekoj\u016b\u0161\u016bs puorkuopumu:\\n3.7.1. napylda ci nap\u012bnuoceigi
  pylda sovys saisteibys pret B\u012bdreibu,\\n3.7.2. ar sovu darbeibu ci bezdarbeibu
  maisa B\u012bdreibys mier\u0137u sasn\u012bg\u0161onu,\\n3.7.3. izdora  v\u012bnreizeju
  rupu Statutu, K\u016bpsapu\u013ccis, Va\u013cdis i juos pr\u012b\u0161ks\u0101d\u0101tuoja
  l\u0101muma puorkuopumu, kura rezultat\u0101 B\u012bdreibai teik n\u016bdareits
  morals i / ci materials zaudiejums,\\n3.7.4. ir izdariejs taidu amoralu puorkuopumu,
  kas nav sav\u012bnojams ar tuo\u013cuoku darbeibu B\u012bdreib\u0101 atbylst\u016b\u0161i
  juos mierkim i aizdavumim,\\n3.7.5. izdariejs kaidu cytu darbeibu, kas ir pretrun\u0101
  ar itym\u016bs Statut\u016bs n\u016bsaceit\u016b.\\n3.8. Vaicuojumu par B\u012bdreibys
  b\u012bdra izslieg\u0161onu apsaver tyvuokuos Va\u013cdis s\u0113dis laik\u0101,
  paaicynoj\u016bt ari izsl\u0101dzam\u016b b\u012bdru i d\u016bd\u016bt jam vuordu
  sova v\u012bd\u016bk\u013ca paus\u0161onai. Izsl\u0101dzamuo b\u012bdra na\u012bsaras\u0161ona
  nav \u0161kierslis Va\u013cdis l\u0101muma p\u012bjim\u0161onai. Va\u013cdis l\u0101mums
  par b\u012bdra izslieg\u0161onu ar l\u0101muma motivaceju juopazi\u0146oj rakstiski
  izsl\u0101gtajam b\u012bdram p\u012bcu d\u012bnu laik\u0101 nu l\u0101muma p\u012bjim\u0161onys
  \u0161a\u013cts.\\n3.9. Par \u012bpa\u0161im sasn\u012bgumim B\u012bdreibys lob\u0101
  piec Va\u013cdis pr\u012b\u0161klykuma k\u016bpsapu\u013cc\u0113 p\u012b\u0161kir
  g\u016bda b\u012bdra n\u016bsaukumu.\\n3.10. B\u012bdreibys atba\u013csteituoji
  ir personys, kas nav B\u012bdreibys b\u012bdri, tok atbolsta B\u012bdreibys mier\u0137us
  i aizdavumus. L\u0101mumu par B\u012bdreibys atba\u013csteituoja statusa p\u012b\u0161kier\u0161onu
  p\u012bjem B\u012bdreibys Va\u013cde. B\u012bdreibys atba\u013csteituojim ir t\u012bseibys
  p\u012bsadaleit K\u016bpsapu\u013cc\u0113, tok bez bolst\u012bseibu.\\n3.11. Ka
  b\u012bdrs nu B\u012bdreibys izastuoj ci teik izsl\u0101gts, jam nav t\u012bseibu
  prete\u0146d\u0113t ci atsavynuot B\u012bdreibys \u012bpa\u0161umu, juo dalis i
  finan\u0161u leidzek\u013cus, kai ari l\u012btuot B\u012bdreibys simboliku.\\n\\n4.
  PUORVA\u013bDIS STRUKTURA\\n\\n4.1. B\u012bdreibys puorva\u013cdis instituceja ir
  juos Va\u013cde, Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojs i b\u012bdru K\u016bpsapu\u013cce.\\n\\n5.  B\u012aDRU
  K\u016aPSAPU\u013bCE\\n\\n5.1. B\u012bdreibys augstuokuo liemiejinstituceja ir b\u012bdru
  K\u016bpsapu\u013cce.\\n5.2. K\u016bpsapu\u013ccis t\u012bseibys i p\u012bnuokumi:\\n5.2.1.
  apstyprynuot B\u012bdreibys statutus i j\u016bs gr\u016bziejumus,\\n5.2.2. \u012bv\u0113l\u0113t
  i atce\u013ct B\u012bdreibys Va\u013cdi i revidentu,\\n5.2.3. (izsl\u0101gts ar
  05.03.2016. statutu gr\u016bzejumim),\\n5.2.4. (izsl\u0101gts ar 05.03.2016. statutu
  gr\u016bzejumim),\\n5.2.5. p\u012bjimt i n\u016bsaceit B\u012bdreibys g\u016bda
  b\u012bdrus,\\n5.2.6. p\u012bjimt l\u0101mumu par B\u012bdreibys likvidie\u0161onu.\\n5.3.
  K\u016bpsapu\u013cc\u0113 ir t\u012bseigi p\u012bsadaleit vysi B\u012bdreibys b\u012bdri.
  B\u012bdri var p\u012bsadaleit Kopsapu\u013cc\u0113 personeigi, attuolynuotai \u2013
  izmontoj\u016bt t\u012b\u0161saistis reikus voi, ar notariali apstyprynuotu pylnvaru,
  pylnvaruot puorstuovn\u012bceibai k\u016bpsapu\u013cc\u0113 cytu b\u012bdreibys
  b\u012bdru.\\n5.4. Kuortej\u016b k\u016bpsapu\u013cci sasauc Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojs
  v\u012bnu raizi god\u0101 \u2013 ni v\u0101luok kai leidz 31. martam.\\n5.5. Uorkuortys
  K\u016bpsapu\u013cci sasauc Va\u013cde, ka t\u016b prosa Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojs,
  revidents ci 10 % nu B\u012bdreibys b\u012bdru, n\u016bruod\u016bt sasauk\u0161onys
  \u012bmes\u013cus.\\n5.6. Par K\u016bpsapu\u013ccis sasauk\u0161onu juos b\u012bdri
  teik informeiti ni v\u0101luok kai divejis nedelis pyrms sapu\u013ccis, informej\u016bt
  kotru b\u012bdru par juos n\u016brisis laiku i v\u012btu.\\n5.7. K\u016bpsapu\u013cce
  ir lemtt\u012bseiga, ka jim\u0101 p\u012bsadola vaira kai puse nu b\u012bdru.\\n5.8.
  Ka K\u016bpsapu\u013cce nav lemtt\u012bseiga kvoruma tryukuma de\u013c, treis nede\u013cu
  laik\u0101 teik sasaukta atkuortuota K\u016bpsapu\u013cce, kas ir t\u012bseiga p\u012bjimt
  l\u0101mumus naatkareigi nu kluotas\u016b\u0161\u016bs b\u012bdru skaita, ar n\u016bsacejumu,
  ka jim\u0101 p\u012bsadola vysmoz diveji b\u012bdri.\\n5.9. K\u016bpsapu\u013cci
  atkluoj, voda i sl\u0101dz va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojs. Atsevi\u0161\u0137\u016bs
  gad\u012b\u0146\u016bs K\u016bpsapu\u013cci var atkluot cyta persona, kas j\u016b
  voda leidz K\u016bpsapu\u013ccis vadeituoja \u012bvielei\u0161onai.\\n5.10. Vysi
  bolsuojumi ir atkluoti, izjem\u016bt gad\u012b\u0146us, ka vysmoz 30 % kluotas\u016b\u0161\u016bs
  bolst\u012bseig\u016bs b\u012bdru p\u012bprosa aizkluotu bolsuojumu.\\n5.11. K\u016bpsapu\u013ccis
  l\u0101mums ir p\u012bjimts, ka par j\u016b n\u016bbolsoj vaira kai puse nu kluotas\u016b\u0161\u016bs
  b\u012bdru. L\u0101mums par statutu gr\u016bzejumim, B\u012bdreibys darbeibys izbeig\u0161onu
  ci turpynuo\u0161onu ir p\u012bjimts, ka par j\u016b n\u016bbolsoj vaira kai divejis
  tre\u0161dalis nu kluotas\u016b\u0161\u016bs b\u012bdru.\\n5.12. S\u0113dis protokolu
  paroksta pr\u012b\u0161ksadatuojs i s\u0113dis sekretars. Sapu\u013ccis dokumenti
  ir p\u012bejami vysim b\u012bdrim atkluoti. Kotrs b\u012bdrs ir t\u012bseigs praseit,
  kab jam izsn\u012bgtu protokola n\u016brokstu, kopeju ci izrokstu nu juo.\\n\\n6.
  VA\u013bDE\\n\\n6.1. B\u012bdreibys izpyldinstituceja ir va\u013cde, k\u016b \u012bvielej
  k\u016bpsapu\u013cc\u0113 iz diveju godu i kas sastuov nu treis va\u013cdis l\u016bcek\u013cu.\\n6.2.Va\u013cdis
  l\u016bcekli nu sova vyda \u012bvielej:\\n6.2.1. va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoju,
  kurs organizej va\u013cdis dorbu,\\n6.2.2. va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja
  v\u012btn\u012bku, kurs paleidz organiz\u0113t va\u013cdis dorbu i va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja
  pr\u016bmbyutnis laik\u0101 veic juo funkcejis,\\n6.2.3. izvirzej atbi\u013cdeig\u016bs
  cytu Va\u013cdis p\u012bnuokumu izpi\u013cdei.\\n6.3.Va\u013cdis p\u012bnuokumi:\\n6.3.1.
  veikt vajadzeig\u016bs pasuokumus Statut\u016bs paradz\u0101t\u016bs mier\u0137u
  sasn\u012bg\u0161onai i k\u016bpsapu\u013ccis l\u0101mumu izpi\u013cdei,\\n6.3.2.
  \u012bce\u013ct i atce\u013ct regional\u016bs koordinatorus, vadeit i puorraudzeit
  j\u016bs dorbu,\\n6.3.3. izlemt vaicuojumus, kas nav k\u016bpsapu\u013ccis kompetenc\u0113,\\n6.3.4.
  sn\u012bgt B\u012bdreibys K\u016bpsapu\u013ccei atskaiti par padareit\u016b dorbu,\\n6.3.5.
  rysynuot ekonomisk\u016bs i finansu vaicuojumus, p\u012bsaist\u016bt finansiejumu
  B\u012bdreibys projektu realizacejai,\\n6.3.6. n\u016bform\u0113t va\u013cdis l\u0101mumus
  i izzi\u0146uot j\u016bs b\u012bdrim,\\n6.3.7. inici\u0113t jaunu projektu realizie\u0161onu
  i finansiejuma p\u012bsaisti jim,\\n6.3.8. veikt vysus vajadzeig\u016bs dorbus,
  kas saisteiti ar B\u012bdreibys uorej\u016b i \u012bk\u0161ej\u016b publicitati,
  jaunu b\u012bdru i interesentu p\u012bsaistie\u0161onu B\u012bdreibys projektu realizacejai.\\n6.4.Va\u013cde
  sovu darbeibu veic Va\u013cdis s\u0113d\u0113s. Va\u013cdis s\u0113dis n\u016bteik,
  Va\u013cdis l\u016bceklim pa pr\u012b\u0161ku v\u012bnoj\u016bt\u012bs par j\u016bs
  b\u012b\u017eumu, laiku i n\u016brisis v\u012btu, kai ari ka sa\u012b\u0161onu p\u012bprosa
  Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojs ci vysmoz puse nu Va\u013cdis l\u016bcek\u013cu.\\n6.5.Va\u013cdis
  s\u0113dis ir lemtt\u012bseigys, ka jamuos p\u012bsadola vairuok kai puse nu Va\u013cdis
  l\u016bcek\u013cu skaita.\\n6.6.Va\u013cdis l\u0101mumi teik p\u012bjimti ar bolsu
  vairuokumu. Ka bolsuojum\u0101 bolsi doluos iz pusem, iz\u0161kir\u016b\u0161ais
  ir Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuoja bolss.\\n6.7.Va\u013cdis l\u016bceklim
  ir t\u012bseibys puorstuov\u0113t B\u012bdreibu k\u016bp\u0101 ar v\u012bnu cytu
  Va\u013cdis l\u016bcekli. Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojs var puorstuov\u0113t
  B\u012bdreibu atsevi\u0161ki.\\n6.8.Va\u013cdis l\u016bceklis var izastuot nu Va\u013cdis,
  \u012bsn\u012bdz\u016bt rakstisku \u012bsn\u012bgumu Va\u013cdis pr\u012b\u0161ks\u0101d\u0101tuojam.\\n6.9.Ka
  B\u012bdreibys b\u012bdrs izastuoj ci teik izsl\u0101gts nu B\u012bdreibys, jis
  teik izsl\u0101gts ari nu Va\u013cdis.\\n6.10. Ka Va\u013cdis pylnvoru laik\u0101
  nu juos izastuoj ci teik izsl\u0101gts Va\u013cdis l\u016bceklis, tod juo v\u012bt\u0101
  \u012bsastuoj nuokamais nu Va\u013cdis l\u016bcek\u013cu kandidatu saroksta, kas
