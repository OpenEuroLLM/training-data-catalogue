  protokola Nr. 1\u201312)\\n\\n1. Komiseja n\u016bl\u0113me \u012bsaceit latgal\u012b\u0161u
  rokstu vol\u016bd\u0101 l\u012btuot itaidus Ludzys \u012blu un \u012bstuo\u017eu
  n\u016bsaukumus:\\n\\n* P\u012bzeime:\\n\\nlatgali \u2015 senejuo austrumbaltu ci\u013cts,
  kura apdzeivova Vydzemi i Latgolu;\\n\\nlatgal\u012bts \u2015 Latgolys latv\u012bts
  myusu d\u012bnu sapras\u0161on\u0101 (piec L. Leikumys \u201eGruomotys \u0161koluotuojim\\\",
  1993, 24).\"", "\"23. skotuvis runys konkursa \u201eVUOLYUDZ\u0100NI\\\" n\u016blykums\\n\\nKonkursa
  mierkis\\n\\n* Atteisteit \u0161kol\u0101nu skotuvis runys meistareibu, emocionalitati,
  ce\u013ct runys kulturu\\n* Styprynuot nacional\u016b identitati, veidoj\u016bt
  izpratni par latgal\u012b\u0161u autoru vuorda muokslu, latgaliski raksteita teksta
  vierteibu, izteiksmeibu\\n* Izk\u016bpt latgal\u012b\u0161u rokstu vol\u016bdu\\n\\nOrganiz\u0101tuoji\\n\\n*
  R\u0113zeknis n\u016bvoda po\u0161va\u013cdeiba\\n* Latgal\u012b\u0161u vol\u016bdys,
  literaturys i kulturviesturis \u0161koluotuoju asociaceja (LVLK\u0160A)\\n* R\u0113zeknis
  Va\u013csts 1. gimnazeja\\n\\nKonkursa n\u016btik\u0161onys laiks i v\u012bta\\n\\nKonkurss
  n\u016bteik 2023. goda 29. aprel\u012b R\u0113zeknis Va\u013csts 1. gimnazej\u0101,
  Dziernovu \u012bl\u0101 3a Suokums \u2014 10:00\\n\\nDaleibn\u012bku registraceja:
  9:00\u20139:50\\n\\nDaleibn\u012bki\\n\\n* Nu v\u012bnys \u0161kolys p\u012bsadola
  na vairuok par 2 \u0161kol\u0101nim nu kotrys kla\u0161u grupys\\n* Konkurs\u0101
  p\u012bsadola pyrms\u0161kolys vacuma b\u0101rni, 1.\u201312. kla\u0161u \u0161kol\u0101ni,
  studenti\\n* Nu v\u012bnys \u0161kolys p\u012bsaceitajim daleibn\u012bkim v\u0101lams
  najimt v\u012bnaidus dorbus\\n* Iz konkursa navest dailrunuotuoju, kur\u012b nazyna
  tekstu nu golvys\\n\\nKonkursa gaita\\n\\n* Konkurss n\u016bteik pa vacuma grupom:
  pyrms\u0161kola, 1.\u20134. kl., 5.\u20138. kl., 9.\u201312. kl., studenti\\n* \u012ateicams
  izmontuot jaunuok\u016b latgal\u012b\u0161u literaturu.\\n* Kotrys konkursa daleibn\u012bks
  sagatavej 2 daildorbu fragmentus latgaliski\\n* 1. konkursa kuort\u0101 kotrys daleibn\u012bks
  runoj pyrm\u016b prozys voi dzejis fragmentu, bet 2. kuort\u0101 \u2014 \u016btr\u016b
  sagataveit\u016b prozys voi dzejis fragmentu\\n* Konkursu papr\u012b\u0161ku \u012bteicams
  organiz\u0113t \u0161koluos\\n* Kotra literaruo dorba lasejuma garums nadreikst
  puorsn\u0113gt 3 min.\\n\\nViertie\u0161ona\\n\\nKonkursantus viertej LVLK\u0160A
  i RTA izveiduota komiseja.\\n\\nViertej dorba atbi\u013csteibu \u0161kol\u0101na
  vacumam, teksta zynuo\u0161onu, kontaktu ar klauseituojim, prasmi atkluot daildorba
  n\u016bska\u0146u, \u012bsak\u013cau\u0161onu laik\u0101.\\n\\nApbolvuo\u0161ona\\n\\nAtkareib\u0101
  nu rezultatu konkursa uzvar\u0101tuoji kotr\u0101 vacuma grup\u0101 sajam diplomus
  i bolvys voi p\u012bminis bolvys i Atzineibys rokstus. Par \u0161kol\u0101nu sagatavei\u0161onu
  konkursam teik g\u016bdynuoti i j\u016bs pedagogi.\\n\\nDaleibn\u012bkus fotograf\u0113s
  voi film\u0113s, fotografejis i audiovizualais materials var tikt publiskuots ar
  mierki populariz\u0113t b\u0101rnu i jaun\u012b\u0161u rad\u016b\u0161uos, muokslin\u012bciskuos
  aktivitatis i saglobuot kulturviesturiskuos l\u012bceibys.\\n\\nP\u012bteikumus
  syuteit leidz 17. apre\u013cam iz e-postu: firstname.lastname@example.org, n\u016bruod\u016bt
  \u0161kol\u0101na vuordu, uzvuordu, \u0161kolu, klasi, \u0161koluotuoju, taipat
  \u2014 daildorba autoru i n\u016bsaukumu. Informaceju var atrast www.ltgasoc.lv
  i www.lakuga.lv\"", "\"Konkursa\\n\\n\\\"Latgolys prozys skaitejumi 2023\\\" N\u016aLYKUMS\\n\\nKai
  vysam iz pasau\u013ca, profesionalai rakstn\u012bceibai ir p\u013cusi i minusi.
  Park\u016b, ka cylv\u0101ks pe\u013cnej naudu ar b\u016brkuonu audzie\u0161onu,
  tys ir labi, a, ka ar romanu rakstei\u0161onu, tys ir \u0161vaki? A ka rakstn\u012bks
  tai g\u016bdeigi i pasoka \u2014 cyta nikuo es dareit napr\u016btu, es rokstu part\u016b,
  lai ar t\u016b n\u016bpe\u013cneit naudu?\\n\\n/Valentins Luka\u0161evi\u010ds,
  \\\"Casn\u0101gu maizeitis\\\"/\\n\\nMIERKIS\\n\\nVeicynuot literar\u016b procesu
  Latgol\u0101, d\u016bd\u016bt vareibu latgal\u012b\u0161u rokstu vol\u016bd\u0101
  voi latv\u012b\u0161u literaraj\u0101 vol\u016bd\u0101 rokst\u016b\u0161im autorim
  satikt leluoku auditoreju i skaiteituojim \u012bpazeit jaunus Latgolys kulturtelp\u0101
  topu\u0161us dorbus.\\n\\nDALIN\u012aKI\\n\\nVysa vacuma Latgolys kulturtelpai p\u012bdareigi
  autori, kur\u012b roksta prozu latgal\u012b\u0161u rokstu vol\u016bd\u0101 voi latv\u012b\u0161u
  literaraj\u0101 vol\u016bd\u0101.\\n\\nKONKURSA DORBA N\u016aSACEJUMI\\n\\nAutori
  aicynuoti \u012bsyuteit:\\n\\n1. po\u0161a radeitu i da tuo napublic\u0101tu tekstu
  latgal\u012b\u0161u rokstu vol\u016bd\u0101 voi latv\u012b\u0161u literaraj\u0101
  vol\u016bd\u0101 (bet v\u0101lams ar vysmoz 10 % latgal\u012b\u0161u rokstu vol\u016bd\u0101
  integr\u0101ta teksta) \u2014 eseju, stuostu voi romana fragmentu sev tyvuok\u0101
  \u017eanr\u0101;\\n2. prozys teksta lelums: 7000\u201312 000 zeimu ar atstarpem
  (lyugums \u012bv\u0101ruot teksta leluma n\u016bsacejumus, garuoki dorbi pyrma n\u016bd\u016b\u0161onys
  viertie\u0161onai tiks eisynuoti);\\n3. teksta n\u016bformiejums: A4 formats, Times
  New Roman, burtu lelums 12 punkti, rindu storp\u0101 1,5 punkti;\\n4. v\u0101lams
  jimt v\u0101r\u0101 konkursa \\\"Latgolys prozys skaitejumi\\\" moto \\\"Es rokstu,
  bet voi tu skaiteisi?\\\"\\n\\n;\\n\\n5. v\u012bns nu viertie\u0161onys kritereju
  ir teksta p\u012bdareiba Latgolys kulturtelpai, tai atkluoj\u016bt regiona sovpateibu
  i paruod\u016bt latgaliskumu juo pla\u0161uokajuos n\u016bzeim\u0113s.\\n\\nP\u012aSACEJUMA
  N\u016aSACEJUMI\\n\\nKonkursa dorba elektroniskajai versejai obligati juodal\u012bk
  e-posta teksts ar p\u012bsacejumu, kur\u0101 juobyut:\\n\\n1. zi\u0146om par autoru
  (vuords, pavuorde, dzim\u0161onys dati (gods), n\u016bsadorbuo\u0161ona, eisa rod\u016b\u0161uo
  biografeja (vysmoz 3\u20134 teikumi));\\n2. autora kontaktinformaceja (telepona
  numers, e-posts).\\n\\nTERMENI\\n\\nKonkursa dorbi, dal\u012bk\u016bt p\u012bsacejumus,
  konkursam juo\u012bsn\u0101dz leidz 2023. goda 18. oktobram n\u016bsyut\u016bt b\u012bdreibai
  \\\"LgSC\\\" iz e-postu: email@example.com ar n\u016bruodi \\\"Latgolys prozys skaitejumi
  2023\\\".\\n\\n,\\n\\nVIERTIE\u0160ONYS KRITEREJI\\n\\nDorbi tiks v\u0101rt\u0101ti,
  vysu vaira izce\u013c\u016bt na teksta vol\u016bdu, bet literaruo teksta kvalitati
  i p\u012bdareibu Latgolys kulturtelpai, tai atkluoj\u016bt regiona sovpateibu i
  paruod\u016bt latgaliskumu juo pla\u0161uokajuos n\u016bzeim\u0113s.\\n\\nKONKURSA
  DORBU VIERTIE\u0160ONA\\n\\nKonkurss n\u016btiks v\u012bn\u0101 kuort\u0101 \u2013
  autori leidz 18. oktobram \u012bsyuta sovus prozys tekstus i konkursa organizatori
  j\u016bs n\u016bd\u016bd \u017eurejai anonimai viertie\u0161onai;\\n\\nKonkursa
  dalin\u012bki 7. decembr\u012b 18.00 byus aicynuoti p\u012bsadaleit konkursa \\\"Latgolys
  prozys skaitejumi 2023\\\" n\u016bsl\u0101guma pasuokum\u0101 R\u0113zekn\u0113.
  Tuo n\u016btik\u0161onu planavuots fi\u013cm\u0113t i raideit storptautyskuo literaturys
  festivala \\\"Prozas las\u012bjumi 2023\\\" i latgal\u012b\u0161u kulturys zi\u0146u
  portala lakuga.lv kanal\u016bs. Pasuokuma n\u016btik\u0161on\u0101 tiks jimti v\u0101r\u0101
  vysi tym\u0101 breid\u012b va\u013cst\u012b pastuov\u016b\u0161\u012b \u012br\u016bbe\u017euojumi.\\n\\nREZULTATU
  IZZI\u0145UO\u0160ONYS PAR\u0100DS\\n\\nAutorus, kur\u016bs konkursa \\\"Latgolys
  prozys skaitejumu 2023\\\" n\u016bsl\u0101guma pasuokum\u0101 7. decembr\u012b aicynuos
  konkursa tekstu skaiteit publiski, inform\u0113s personeigi, sasazynoj\u016bt iz
  p\u012bsacejum\u0101 n\u016bruodeit\u016b e-posta adresi voi telepona numeri. Konkurs\u0101
  uzvarieju\u0161\u016bs dorbu autoru vuordi tiks izzi\u0146uoti konkursa n\u016bsl\u0101guma
  pasuokum\u0101, kai ari public\u0101ti latgal\u012b\u0161u kulturys kusteibys \\\"Vol\u016bda\\\"
  s\u0101tyslop\u0101 lgsc.lv i latgal\u012b\u0161u kulturys zi\u0146u portal\u0101
  lakuga.lv. Atbylst\u016b\u0161i konkursa n\u016bsl\u0101guma pasuokuma koncepcejai,
  uzvar\u0101tuoju dorbu video \u012broksti var tikt sataiseiti ari pyrma pasuokuma.
  Konkursa \\\"Latgolys prozys skaitejumi 2023\\\" uzvar\u0101tuojam ar sova dorba
  skaitejumu byus p\u012bduovuota vareiba p\u012bsadaleit ari festivala \\\"Prozas
  las\u012bjumi 2023\\\" n\u016btik\u0161onuos.\\n\\nATLEIDZEIBA PAR PUBLIKACEJOM
  I PUBLICITATE\\n\\nKonkursa uzvar\u0101tuoju dorbim tiks da\u0161kiertys atleidzeibys
  par dorbu pyrmpublikacejom portal\u0101 lakuga.lv: I v\u012btai 300 eiro apm\u0101r\u0101,
  II v\u012btai 200 eiro apm\u0101r\u0101 i III v\u012btai 100 eiro apm\u0101r\u0101
  (pyrma n\u016bd\u016bk\u013cu n\u016bmoksys). Atkareib\u0101 nu \u012bsn\u0101gt\u016bs
  dorbu kvalitatis i \u017eurejis viertejuma latgal\u012b\u0161u kulturys kusteiba
  \\\"Vol\u016bda\\\" patur t\u012bseibys atleidzeibu apm\u0101rus maineit. Konkursa
  uzvar\u0101tuoju dorbi var tikt public\u0101ti ari video format\u0101 portala lakuga.lv
  i latgal\u012b\u0161u kulturys kusteibys \\\"Vol\u016bda\\\" social\u016bs teiklu
  kont\u016bs, kai ari portala sagataveitaj\u016bs izdavum\u016bs.\\n\\n\u017dUREJA\\n\\nKonkursa
  \\\"Latgolys prozys skaitejumi 2023\\\" dalin\u012bku dorbus viert\u0113s vysmoz
  treis, bet na vaira kai p\u012bci \u017eurejis l\u016bcekli \u2013 ar Latvejis literaturys
  procesim i aktivitatem saisteitys personeibys. \u017durejis l\u016bcek\u013cu vuordi
  tyks atkluoti piec 20. novembra.\\n\\nORGANIZATORI\\n\\nKonkursu reikoj latgal\u012b\u0161u
  kulturys kusteiba \\\"Vol\u016bda\\\" (b\u012bdreiba \\\"LgSC\\\", vaira dazynuo\u0161onai
  Krist\u012bne Pokratniece, e-posts lgsc@lgsc). Konkursa n\u016btik\u0161onu atbolsta
  storptautyskais literaturys festivals \\\"Prozas las\u012bjumi 2023\\\" (reikuotuojs
  Latvejis Rakstn\u012bku sav\u012bneiba), Va\u013csts kulturkapitala fonds, \\\"Valodu
  m\u0101ja\\\", SIA \\\"IGGI\\\", latgal\u012b\u0161u kulturys zi\u0146u portals
  lakuga.lv i \u017eurnals \\\"Domuz\u012bme\\\".\"", "\"Latgal\u012b\u0161u kulturys
  goda bolva BO\u0145UKS 2021 N\u016aLYKUMS\\n\\nLatgal\u012b\u0161u kulturys goda
  bolva teik taiseita ar mierki apk\u016bpuot lobuok\u016b, spylgtuok\u016b i svareiguok\u016b
  padareit\u016b i n\u016btik\u0161onys p\u0101rnej\u0101 god\u0101 latgaliskaj\u0101
  kultur\u0101, g\u016bdynoj\u016bt aktivuok\u016bs latgal\u012b\u0161u kulturys puorstuovus,
  populariz\u0101tuojus, kai ari veicynoj\u016bt jaunradis i kulturys daudzveideibys
  atteisteibu iz pr\u012b\u0161ku. \\\"Bo\u0146uks 2021\\\" tiks g\u016bdynuotys tuos
  personeibys, n\u016btik\u0161onys i aktivitatis, bez kuru vysa vaira nabyutu \u012bsad\u016bmojama
  latgaliskuo kultura 2021. god\u0101.\\n\\nProjekta ideja i mierki:\\n\\nVeicynuot
  latgal\u012b\u0161u kulturvidis saglobuo\u0161onu i atteisteibu. Apk\u016bpuot i
  g\u016bdynuot spylgtuok\u016bs i n\u016bzeimeiguok\u016bs sasn\u0101gumus, n\u016btik\u0161onys,
  personeibys latgal\u012b\u0161u kultur\u0101 p\u0101rnej\u0101 god\u0101.\\n\\nBolvys
  reikuotuoji:\\n\\nLatgolys viestn\u012bceiba GORS\\n\\nNominaceju pretendenti:\\n\\nFiziskys
  voi juridiskys personys, kas sov\u0101 darbeib\u0101 i jaunrad\u0113 sagloboj, atteista
  i popularizej latgal\u012b\u0161u kulturu, izmontoj latgal\u012b\u0161u vol\u016bdu
  i atbi\u013cst kaidai nu n\u016blykum\u0101 min\u0101t\u016bs kategoreju. Bolva
  teik da\u0161kierta par spylgtu, kvalitativu, sab\u012bdryski n\u016bzeimeigu, sab\u012bdreibys
  i profesiona\u013cu atzineibu dabuoju\u0161u darbeibu voi jaunradi latgaliskuos
  kulturys lauk\u0101 2021. god\u0101. Pretendentam nav obligata praseiba byut raksteitam,
  radeitam voi kai cytai\u017e izapaudu\u0161am latgaliski, tys latgaliskuos vierteibys
  i latgalisk\u016b kulturu var nest ari cytuos vol\u016bduos.\\n\\nPretendentu dasacei\u0161ona:\\n\\nNominantus
  latgal\u012b\u0161u kulturys goda bolvai \\\"Bo\u0146uks 2021\\\" var \u012bsn\u0113gt
  da 2022. goda 10. janvara. V\u012bnu aktivitati, personeibu, n\u016btik\u0161onu,
  dorbu var dasaceit vairuokuos kategorejuos. Dasacejuma anketa da\u012bmama kai elektronisk\u0101,
  tai izdrukavojam\u0101 format\u0101 bolvys s\u0101tyslop\u0101 http://bonuks.lv
  i Latgolys viestn\u012bceibys GORS s\u0101tyslop\u0101 http://latgalesgors.lv. Vys\u016bs
  dasacejum\u016bs eipa\u0161i teik v\u0101rt\u0101ts padareitais latgaliskaj\u0101
  kultur\u0101 tai\u0161ni konkretaj\u0101 god\u0101. \u017dureja \u012bsoka \u012bsn\u0113gt
  izdavumus, gruomotys, dz\u012bsmis, albumus, video, raidejumus i c., kas publiski
  pasaruodeju\u0161i da 2021. goda 26. decembra. Bolvys dasacejuma anketa teik p\u012bjimta
  ari drukavuot\u0101 format\u0101, dasacejumu syut\u016bt pa postu (po\u0161ta \u0161tempe\u013cs
  da 7. janvara): Latgal\u012b\u0161u kulturys goda bolvai \\\"Bo\u0146uks 2021\\\",
  Latgolys viestn\u012bceiba GORS, Pi\u013cs \u012bla 4, R\u0113zekne, LV-4601.\\n\\nBolvys
  sajiemieji:\\n\\nBolva teik pad\u016bta 10 spylgtuokajom n\u016btik\u0161onom, personeibom,
  aktivitatem voi cytom iniciativom p\u0101rnej\u0101 god\u0101 latgaliskaj\u0101
  kultur\u0101 kategorejuos \\\"Vol\u016bda. Literatura. Publicistika\\\", \\\"N\u016btik\u0161onys.
  Aktivitatis. Personeibys\\\" i \\\"Audio. Video\\\". V\u012bna atsevi\u0161ka bolva
  bez \u012bpr\u012b\u0161k 10 n\u016bsaukt\u016bs teik pad\u016bta nominacej\u0101
  \\\"Par myu\u017ea \u012bgu\u013cdejumu latgal\u012b\u0161u kulturys atteisteib\u0101\\\".\\n\\nPretendentu
  viertie\u0161ona:\\n\\nBolvys \u017eureja nu \u012bsn\u0101gt\u016bs pretendentu,
  izviertej\u016bt  vysus sajimt\u016bs dasacejumus, atlosa vysmoz 30 bolvys nominantus,
  kur\u012b teik izzi\u0146uoti 2022. goda janvara gol\u0101. Februara suok\u0101
  \u017eureja nu nominantu apstyprynoj desmit bolvys sajiemiejus, kur\u012b teik pazi\u0146uoti
  bolvys ceremonej\u0101 2022. goda 5. mart\u0101 Latgolys viestn\u012bceib\u0101
  GORS. Bolvys \\\"Par myu\u017ea \u012bgu\u013cdejumu latgal\u012b\u0161u kulturys
  atteisteib\u0101\\\" sajiemiejs teik pazi\u0146uots vysmoz divejis nedelis pyrma
  ceremonejis. L\u0101mumu par bolvys sajiemieju nominacej\u0101 \\\"Par myu\u017ea
  \u012bgu\u013cdejumu latgal\u012b\u0161u kulturys atteisteib\u0101\\\" p\u012bjem
  bolvys reikuotuoji, konsultej\u016bt\u012bs ar bolvys \u017eureju.\\n\\n\u017dureja:\\n\\nBolvom
  dasaceit\u016bs pretendentus v\u0113rt\u0113s \u012bpr\u012b\u0161k sataiseita komiseja,
  kurys vyd\u0101 ir:\\n\\n* dalin\u012bki ir profesionalu p\u012bredzi, dorboj\u016bt\u012bs
  kotr\u0101 nu kategoreju sferom;\\n* dalin\u012bki, kur\u012b ir zynomi, ar dorbim
  i p\u012bredzi atzeiti v\u012bd\u016bk\u013cu lideri latgaliskaj\u0101 kultur\u0101;\\n*
  bolvys reikuotuoju (Latgolys viestn\u012bceibys GORS) puorstuovi;\\n* latgaliski
  raid\u016b\u0161\u016bs i rokst\u016b\u0161\u016bs medeju puorstuovi;\\n* \u012bpr\u012b\u0161kejuos
  reizis latgal\u012b\u0161u kulturys goda bolvys \\\"Bo\u0146uks\\\" sajiemieji.\\n\\nKotrai
  nu bolvys kategoreju teik taiseits at\u0161kireigs komisejis sastuovs. K\u016bp\u0101
  \u017eurej\u0101 dorboj\u0101 vysmoz 30 komisejis dalin\u012bki. Gad\u012bn\u012b,
  ka kaids nu komisejis dalin\u012bku ir saisteits ar kaidu nu kategoreju voi r\u016bn\u0101s
  intere\u0161u konflikts, jis/jei nap\u012bsadola konkretuos kategorejis kandidata
  izviertie\u0161onys proces\u0101.\\n\\nKategoreju skaidruojumi:\\n\\n\\\"Vol\u016bda.
  Literatura. Publicistika\\\"\\n\\nKategorej\u0101 var dasaceit pretendentus, kas
  atsat\u012bc iz vol\u016bdys, literaturys, publicistikys laukim \u2013 kai latgaliski
  izdavumi, tai atsevi\u0161ki dorbi, aktivitatis, raidejumi, \u017eurnalistik\u0101
  padareitais, nu jauna sataiseitais, ari myusd\u012bnu tehnologeju sfer\u0101 latgaliski
  dareitais i c. Dasok\u016bt bolvai gruomotys i cyta veida izdavumus, dasaceituoji
  apsajem bolvys \u017eurejai \u012bsn\u0113gt gruomotys ci izdavuma eksemplaru elektronisk\u0101
  i/ci drukavuot\u0101 format\u0101.\\n\\n\\\"N\u016btik\u0161onys. Aktivitatis. Personeibys\\\"\\n\\nKategorej\u0101
  var dasaceit pretendentus, kas n\u016btyku\u0161i, beju\u0161i, dareju\u0161i dorbus
  latgaliskaj\u0101 kultur\u0101 2021. god\u0101. Leluokys i mozuokys sab\u012bdryskys
  i va\u013cstiskys n\u016btik\u0161onys, pasuokumi, koncerti, teatra izruodis, muokslys
  pasuokumi i aktivitatis, akcejis, projekti, darei\u0161onys internet\u0101, \u013cauds
  \u2013 kulturys darbin\u012bki, saimin\u012bki, amatn\u012bki, muokslin\u012bki
  i cyti, kur\u016bs dareitais 2021. god\u0101 eipa\u0161i g\u016bdynojams i pamets
  p\u0101dus latgaliskaj\u0101 kultur\u0101.\\n\\n\\\"Audio. Video\\\"\\n\\nKategorej\u0101
  var dasaceit audio i video dorbus muzykys, muokslys, kino, TV, interneta sferuos
  \u2013 vysu, k\u016b var n\u016bsav\u0113rt i/ci n\u016bsaklauseit latgaliski i
  kas radeits, public\u0101ts, viereibu dabuojs 2021. god\u0101. Dasok\u016bt bolvai
  konkretys dz\u012bsmis, albumus ci video, dasaceituoji apsajem bolvys \u017eurejai
  \u012bsn\u0113gt albuma, dz\u012bsmis ci video verseju elektronisk\u0101 format\u0101.\\n\\nViertie\u0161onys
  kritereji:\\n\\n1. Cik latgaliskys i/voi Latgolys kulturys vierteibys nas\u016b\u0161s
  ir pretendents, aktivitate;\\n2. Cik aktivs pretendents ir bejs vysa goda laik\u0101;\\n3.
  Kaidu rezonansi region\u0101, va\u013cst\u012b voi pla\u0161uok\u0101 m\u0101r\u016bg\u0101
  raisejuse pretendenta darbeiba (k\u016b leluoka, t\u016b viertejams aug\u0161uok);\\n4.
  Pretendenta sn\u0101guma kvalitate (muokslin\u012bcyskuo, vol\u016bdys, publicitatis,
  aktivitatis i tml.).\\n5. Pretendenta sn\u0101guma ilgtspieja \u2013 kaidus p\u0101dus
  n\u016btik\u0161ona, personeiba, aktivitate pamess godim iz pr\u012b\u0161ku.\\n\\nSasazynuo\u0161onai:\\n\\nfirstname.lastname@example.org
  i 64633303\"", "\"LATGOLYS KONGRESS\\n\\nR\u0113zekne, Latgola, Latveja 2022. goda
  27.\u201329. apre\u013cs\\n\\nC\u012bnejam\u012b kolegys!\\n\\n2017. goda 5.\u20136.
  maj\u0101 R\u0113zekn\u0113 n\u016btyka Latgolys symtgadis kongress, kas atguodynuoja
  Latvejis i pasau\u013ca sab\u012bdreibai par Latgolai n\u016bzeimeigim divim kongresim
  R\u0113zekn\u0113: 26.\u201327. aprel\u012b (piec j. st. 9.\u201310. maj\u0101),
  kur\u0101 vod\u016b\u0161uo l\u016bma beja goreidzn\u012bceibai i kur\u0101 tyka
  p\u012bjimts viesturisks l\u0101mums atsadaleit nu Vitebskys gubernis i veiduot
  v\u012bnu va\u013csti ar Vydzemi i K\u016brzemi, patur\u016bt po\u0161n\u016bsasacei\u0161onys
  t\u012bseibys tautsaimn\u012bceibys, vol\u016bdys i ticeibys vaicuojum\u016bs, i
  3.\u2013 4. decembr\u012b (piec j. st. 16.\u201317. decembr\u012b), kur vod\u016b\u0161uo
  l\u016bma beja strie\u013cn\u012bkim. \u016atruo kongresa rezultat\u0101 tyka panuokts,
  ka tuo laika treis apri\u0146\u010di \u2014 R\u0113zeknis, Ludzys i Daugovpi\u013cs
  \u2014 teik atdaleiti nu Vitebskys gubernis. Latgolys apre\u013ca kongress ir v\u012bns
  nu pyrm\u016bs, kas aktualizej k\u016bpejis Latvejis va\u013csts ideju i sagatavej
  politisk\u016b i sab\u012bdryski izgleitoj\u016b\u0161\u016b platformu Latvejis
  va\u013csts dybynuo\u0161onai 1918. goda 18. novembr\u012b.\\n\\n2017. goda Latgolys
  symtgadis kongress p\u012bj\u0113me rezoluceji i izveiduoja Sa\u012bta rezolucejis
  izpi\u013cdis komiteju (SaRIK), kas atbi\u013cd par rezolucejis izpi\u013cdi i organizej
  nuokam\u016b Latgolys kongresu. Izviertej\u016bt sasn\u0101gt\u016b i v\u0113\u013c
  rysynojam\u016bs vaicuojumus, tyka izveiduota Latgolys kongresa koncepceja. Kongresa
  tema \u2014 \u201eLatgaliskuma kods Eirop\u0101: nu vol\u016bdys da ekonomikai\\\".\\n\\n\u010cetru
  godu p\u012bredze piec 2017. goda Latgolys symtgadis kongresa, a sevi\u0161ki Latv\u012b\u0161u
  viesturysk\u016bs zemu lykuma p\u012bjim\u0161ona, apl\u012bcynoj vajadzeibu regulari
  i mierkt\u012bceigi apk\u016bpuot i vierzeit Latgolai i juos dzeivuotuojim n\u016bzeimeigus
  vaicuojumus. Part\u016b ir svareigi vysmoz reizi p\u012bc\u016bs god\u016bs, n\u016bdr\u016b\u0161ynoj\u016bt
  atbi\u013csteigu puorstuovn\u012bceibu kai nu dzeivuotuoju, tai i nu po\u0161va\u013cdeibu,
  NVO i cytu organizaceju, analiz\u0113t as\u016b\u0161\u016b situaceju i izvierzeit
  praktyskus aizdavumus i vaicuojumus, kas svareigi Latgolys atteisteibai.\\n\\nKab
  precizuok izvierzeit prioritatis Latgolys kongresa dorba kuorteibai, tyka organiz\u0101tys
  div diskusejis R\u0113zekn\u0113 i Daugovpil\u012b, aicynoj\u016bt puorva\u013cdis,
  tautsaimn\u012bcisk\u016b i nava\u013cstisk\u016b sektoru atsav\u0113rt iz padareituo
  i izvierzeit sasn\u0101dzamus mierkus. Kotr\u0101 nu it\u016bs diskuseju tyka skaidruots
  ari kongresa delegatu i daleibn\u012bku puorstuovn\u012bceibys pryncyps.\\n\\nLatgolys
  kongresa dorbs tiks organiz\u0101ts vairuok sekcejuos, kur daleibu jims kongresa
  delegati i kongresa daleibn\u012bki, taipat v\u012bsi (aicynuotuos personys). Kongresa
  delegati puorstuov\u0113s Latgolys dzeivuotuojus, po\u0161va\u013cdeibys, tuos organizacejis
  i NVO, kas mierkt\u012bceigi k\u016bp latgalisk\u016b ide\u0146titati i rysynoj
  Latgolai i latgaliskajam svareigus vaicuojumus. Kongres\u0101 var\u0113s jimt daleibu
  i pietn\u012bki, j\u016bmu praktiki, kuru p\u012bsaceituo izastuo\u0161onys tema
  tiks apstyprynuota kai Latgolys kongresa n\u016brisei atbi\u013csteiga.\\n\\nKongres\u0101
  aicynojam p\u012bsadaleit ari politikus i vysaidu n\u016bzaru praktikus \u2014 ar
  referatim, ar l\u012btyskom temom de\u013c diskuseju. Taipat Latgolys kongres\u0101
  daleibu jims puorstuovi nu va\u013csts instituceju, \u012bstuo\u017eu, v\u012bsi
  nu cytu latv\u012b\u0161u viesturysk\u016bs zemu. \u012acar\u0101ts, ka Latgolys
  atteisteibai aktuali zynuotnisk\u012b pr\u012b\u0161klasejumi meis\u012bs ar naskaidru
  voi streideigu vaicuojumu publisku apspr\u012bs\u0161onu, kab kongresa gait\u0101
  izstruoduot i apspr\u012bst rezolucejis pamatpunktus i kongresu beigt ar konkretim
  pr\u012b\u0161klykumim tautsaimn\u012bceibys, dr\u016b\u0161eibys, kulturys, izgleiteibys,
  vol\u016bdys i pla\u0161sazinis leidzek\u013cu politikys atteisteibai.\\n\\nP\u012bsok\u016bt
  temys i izstruodoj\u016bt tezis kongresam, prosom puord\u016bmuot i n\u016bviert\u0113t
  sova pas\u016blejuma aktualitati konkretys n\u016bzaris, taipat Latgolys i latgaliskuos
  ide\u0146titatis atteisteibys kontekst\u0101 Latvejis i Eiropys kulturys, izgleiteibys,
  tautsaimn\u012bceibys telp\u0101. Aicynojam aktivi \u012bsasaisteit mierkt\u012bceigu
  pr\u012b\u0161klykumu izstruod\u0113 regiona atteisteibys ce\u013c\u0161onai.\\n\\nJam\u016bt
  v\u0101r\u0101 storpdisciplinar\u016bs pietejumu p\u012baugumu i svareigumu ari
  Latgolys regiona problemu rysynuo\u0161on\u0101, gaideisim p\u012bsacejumu, kur\u012b
  respektej myusu d\u012bnu zynuotnis atteisteibys tende\u0146cis i padzilinoj myusu
  informieteibu i sapratni humanitarajuos (vol\u016bdys, kulturviesturis, folkloristikys,
  literaturzynuotnis), socialajuos (regionaluo ekonomika, demografeja, uzjiemiejdarbeiba,
  lykumd\u016b\u0161ona, dr\u016b\u0161eibys vaicuojumi i c.) i in\u017einerzynuotn\u0113s
  (vidis, informacejis tehnologejis, byuvn\u012bceibys i c.).\\n\\nLatgolys kongresa
  n\u016bsl\u0101gum\u0101 kongresa delegati apstyprynuos rezoluceju, kur\u0101 tiks
  n\u016bsaceiti nuokam\u016bs p\u012bcu godu aizdavumi i sasn\u0101dzam\u012b mierki,
  kai ari tiks apstyprynuots jauns SaRIK.\\n\\nKongresa dorba vol\u016bdys \u2014
  latv\u012b\u0161u, latgal\u012b\u0161u, ang\u013cu.\\n\\nReferata garums\\n\\n\u2014
  30 min.: 20 min. \u2014 referats, 10 min. \u2014 diskusejis.\\n\\nKongres\u0101
  var p\u012bsadaleit ar referatu voi stenda referatu.\\n\\nStenda referata prezentaceja
  \u2014 5 min., 30 min. \u2014 diskusejis par 3\u20135 stenda referatim.\\n\\nKongresa
  n\u016btik\u0161onys v\u012bta \u2014 27. aprel\u012b \u2014 Latgolys viestn\u012bceiba
  \u201eGors\\\", Pi\u013cs \u012bla 4, R\u0113zekne;\\n\\n29. aprel\u012b \u2014
  n\u016bsl\u0101guma plenars\u0113de, rezolucejis apstyprynuo\u0161ona (\u201eGors\\\"),
  Vol\u016bdu nakts.\\n\\n28. aprel\u012b \u2014 R\u0113zeknis Tehnologeju akademeja,
  Atbreivuo\u0161onys aleja 115, R\u0113zekne.\\n\\nV\u0101r\u0101 jamam\u012b laiki:\\n\\n\u2013
