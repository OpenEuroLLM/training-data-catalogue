  zemes kalendars\u00bb  1962\"", "\"Latv\u012b\u0161u vol\u016bdys ekspertu komisejis
  Latgal\u012b\u0161u rokstu vol\u016bdys apak\u0161komisejis svareiguok\u012b l\u0101mumi
  2019. god\u0101\\n\\n2019. goda 15. aprel\u012b (s\u0113dis protokola Nr. 2\u20138)\\n\\nApstyprynuot
  Latvejis pi\u013cs\u0101tu n\u016bsaukumu sarokstu latgal\u012b\u0161u rokstu vol\u016bd\u0101:\"",
  "\"Latgal\u012b\u0161u kulturys goda bolva BO\u0145UKS 2018\\nN\u016aLYKUMS\\n\\nLatgal\u012b\u0161u
  kulturys goda bolva teik taiseita ar mierki ap\u0137\u016bpuot lobuok\u016b, spylgtuok\u016b
  i svareiguok\u016b padareit\u016b i n\u016btik\u0161onys p\u0101rnej\u0101 god\u0101
  latgaliskaj\u0101 kultur\u0101, g\u016bdynoju\u0163 akt\u012bvuok\u016bs latgal\u012b\u0161u
  kulturys puorstuovus, populariz\u0101tuojus, kai ari veicynoju\u0163 jaunradis i
  kulturys daudzveideibys atteisteibu iz pri\u0161ku. \u201cBo\u0146uks 2018\u201d
  tiks g\u016bdynuotys tuos personeibys, n\u016btik\u0161onys i aktivitatis, bez kuru
  vysa vaira nabyutu \u012bsad\u016bmojama latgaliskuo kultura 2018. god\u0101.\\n\\nProjekta
  ideja i mierki:\\nVeicynuot latgal\u012b\u0161u kulturvidis saglobuo\u0161onu i
  atteisteibu. Apk\u016bpuot i g\u016bdynuot spylgtuok\u016bs i n\u016bzeimeiguok\u016bs
  sasn\u0101gumus, n\u016btik\u0161onys, personeibys latgal\u012b\u0161u kultur\u0101
  p\u0101rnej\u0101 god\u0101.\\n\\nBolvys reikuotuoji:\\nLatgolys viestn\u012bceiba
  GORS\\n\\nNominaceju pretendent\u012b:\\nFiziskys voi juridiskys personys, kas sov\u0101
  darbeib\u0101 i jaunrad\u0113 sagloboj, atteista i popularizej latgal\u012b\u0161u
  kulturu, izmontoj latgal\u012b\u0161u vol\u016bdu i atbilst kaidai nu n\u016blykum\u0101
  min\u0101t\u016bs kategor\u0113ju. Bolva teik da\u0161kierta par spylgtu, kvalitat\u012bvu,
  sab\u012bdryski n\u016bzeimeigu, sab\u012bdreibys i profesion\u0101lu atz\u012bneibu
  dabuoju\u0161u darbeibu voi jaunradi latgaliskuos kulturys lauk\u0101 2018. god\u0101.
  Pretendentam nav obligata praseiba byut raksteitam, radeitam voi kai cytaiz izapaudu\u0161am
  latgaliski, tys latgaliskuos vierteibys i latgalisk\u016b kulturu var nest ari cytuos
  vol\u016bduos.\\n\\nPretendentu dasacei\u0161ona:\\nNominantus latgal\u012b\u0161u
  kulturys goda bolvai \u201cBo\u0146uks 2018\u201d var \u012bsn\u0113gt da 2019.
  goda 10. janvara. V\u012bnu akt\u012bvitat\u012b, personeibu, n\u016btik\u0161onu,
  dorbu var dasaceit vairuokuos kategor\u0113juos. Dasacejuma anketa d\u0101\u012bmama
  kai elektronisk\u0101, tai izdrukavojam\u0101 form\u0101t\u0101 bolvys s\u0101tyslop\u0101
  http://bonuks.lv i Latgolys viestn\u012bceibys GORS s\u0101tyslop\u0101 http://latgolesgs.lv.
  Vys\u016bs dasacejum\u016bs eip\u0101si teik v\u0101rt\u0101ts padareitais latgaliskaj\u0101
  kultur\u0101 tai\u0161ni konkreta\u012b god\u0101. \u017dureja \u012bsoka \u012bsn\u0113gt
  izdavumus, gruomotys, dz\u012bsmis, albumus, video, raidejumus i c., kas publiski
  pasaruodeju\u0161i da 2018. goda 20. decembra. Bolvys dasacejuma anketa teik p\u012bjimta
  ari drukavuot\u0101 form\u0101t\u0101, dasacejumu syt\u016bt pa postu [po\u0161ta
  \u0161tempe\u013cs da 8. janvara]: Latgal\u012b\u0161u kulturys goda bolvai \u201cBo\u0146uks
  2018\u201d, Latgolys viestn\u012bceiba GORS, Pijs ila 4, R\u0113zekne, LV-4601.\\n\\nBolvys
  sajiemieji:\\nBolv\u0101 teik pad\u016bta 10 spylgtuokajom n\u016btik\u0161onom,
  personeibom, aktivitatem voi cytom iniciativom p\u0101rnej\u0101 god\u0101 latgaliskaj\u0101
  kultur\u0101 kategor\u0113juos \u201cVol\u016bda. Literat\u016bra. Publicistika\u201d,
  \u201cN\u016btik\u0161onys. Aktivitatis. Personeibys\u201d i \u201cAudio. Video\u201d.
  V\u012bna atsevi\u0161ka bolva bez \u012bpri\u0161k 10 n\u016bsaukt\u016bs teik
  pad\u016bta nominacej \u201cPar myu\u017ea \u012bguldejumu latgal\u012b\u0161u kulturys
  atteisteib\u0101\u201d.\\n\\nPretendentu viertie\u0161ana:\\nBolvys \u017eureja
  nu \u012bsn\u0101gtus pretendentu, izviertejut vysus sajm\u012btus dasacejumus,
  atlosa vysmoz 30 bolvys nominantus, kuri teik izzi\u0146uoti 2019. gada februara
  suokum\u0101. Ned\u0113\u013cu pyrma bolvys ceremonejis (2019. gada 17. febru\u0101r\u012b)
  \u017eureja kluot\u016bn\u012bs sasatisk\u0161on\u0101 apstyprynoj desmit bolvys
  sajemiemus, kuri teik paz\u012bnuoti bolvys ceremonej\u0101 2019. gada 24. febru\u0101r\u012b
  Latgolys viestn\u012bceib\u0101 GORS. Bolvys \u201cPar myu\u017ea \u012bgu\u013cdejumu
  latgal\u012b\u0161u kult\u016brys atteisteib\u0101\u201d sajemiemis teik paz\u012bnuots
  vysmoz divejis nedelis pyrma ceremonejis. L\u0101mumu par bolvys sajemiemju nominac\u0113j
  \u201cPar myu\u017ea \u012bgu\u013cdejumu latgal\u012b\u0161u kult\u016brys atteisteib\u0101\u201d
  p\u012bjem bolvys reikuotuojai, konsultej\u016btis ar bolvys \u017eureju.\\n\\n\u017dureja:\\nBolvom
  dasaceit\u016bs pretendentus v\u0113rt\u0113s \u012bpri\u0161k sataiseita komiseja,
  kurys vyd\u0101 ir:\\n- dalin\u012bki, kuri ir or profesion\u0101lu p\u012bredzi,
  dorboj\u016btis kotr\u0101 nu kategor\u0113ju sferom;\\n- dalin\u012bki, kuri ir
  zynomi, or dorbim i p\u012bredzi otzeiti vi\u016bdk\u013cu lideri latgaliskaj\u0101
  kultur\u0101;\\n- bolvys reikuotuoju (Latgolys viestn\u012bceibys GORS) puorstuovi;\\n-
  latgaliski roid\u016bs\u016bs i rokst\u016bs\u016bs me\u0111eju puorstuovi;\\n-
  \u012bpri\u0161kejuos reizis latgal\u012b\u0161u kult\u016brys goda bolvys \u201cBonuks\u201d
  sajemiemji.\\n\\nKotrainu bolvys kategor\u0113ju teik taiseits at\u0161kireigs komisejis
  sastuovs. K\u016bp\u0101 \u017eurej\u0101 p\u012bsadola vysmoz 25 komisejis dalin\u012bki.
  Gad\u012bni, ka kaidis nu komisejis dalin\u012bku ir saisteits ar kaidu nu kategor\u0113ju
  voi r\u016bn\u0101s intere\u0161u konflikts, jis/jei nap\u012bsadola konkretuos
  kategor\u0113jos kandidatu izviertie\u0161onys proces\u0101.\\n\\nKategor\u0113ju
  skaidruojumi:\\n\\n\u201cVol\u016bda. Literatura. Publicistika\u201d\\nKategor\u0113ja
  var dasaceit pretendentus, kas atsatic iz vol\u016bdys, literat\u016brys, publicistikys
  laukim \u2013 kai latgaliski izdavumu, tai atsevi\u0161ki dorbi, aktivitatis, raidejumi,
  \u017eurnalistik\u0101 podareitais, nu jauna sataiseitais, ari myusd\u012bnu tehnologeju
  sfer\u0101 latgaliski dareitais i c. Dasok\u016bt bolvai gruomotys i cyta veida
  izdavumus, dasaceituoji apsajem bolvys \u017eurejai \u012bsn\u0113gt gruomotys ci
  izdavuma eksemplar\u0173 elektronisk\u0101 i/ci drukavuot\u0101 form\u0101t\u0101.\\n\\n\u201cN\u016btik\u0161onys.
  Aktivit\u0101ts. Personeibys\u201d\\nKategor\u0113ja var dasaceit pretendentus,
  kas n\u016btyku\u0161i, beju\u0161i, dareju\u0161i dorbus latgaliskaj\u0101 kultur\u0101
  2018. god\u0101. Leluokys i mozuokys sab\u012bdryskys i valstiskys n\u016btik\u0161onys,
  pasuokumi, koncerti, teatra izruodis, muokslys pasuokumi i aktivitatis, akcejis,
  projekt\u012b, darei\u0161onys internet\u0101, \u013cauds \u2013 kult\u016brys darbin\u012bki,
  saimin\u012bki, amatn\u012bki, muokslin\u012bki i cyti, kur\u016bs dareitais 2018.
  god\u0101 eip\u0101\u0161i gudynojams i pamets p\u0101dus latgaliskaj\u0101 kultur\u0101.\\n\\n\u201cAudio.
  Video\u201d\\nKategor\u0113ja var dasaceit audio i video dorbus muzykys, muokslys,
  kino, TV, interneta sferuos \u2013 vysu, k\u016b var n\u016bsav\u0113rt i/ci n\u016bsaklauseit
  latgaliski i kas radeitis, public\u0101ts, viereibu dabuojs 2018. god\u0101. Dasok\u016bt
  bolvai konkretyds dz\u012bsmis, albumus ci video, dasaceituoji apsajem bolvys \u017eurejai
  \u012bsn\u0113gt albuma, dz\u012bsmis ci video verseju elektronisk\u0101 form\u0101t\u0101.\\n\\nViertie\u0161onys
  kritereji:\\n1. Cik latgaliskys i/voi Latgolys kult\u016brys vierteibys nas\u016b\u0161s
  ir pretendents, aktivitate;\\n2. Cik akt\u012bvs pretendents ir bejis vysa goda
  laik\u0101;\\n3. Kaidu rezonansi region\u0101, valst\u012b voi pla\u0161uok\u0101
  m\u0101r\u016bg\u0101 raisejuse pretendenta darbeiba (k\u016b leluoka, t\u016b viertejams
  aug\u0161uok);\\n4. Pretendenta sn\u0101guma kvalit\u0101te [muokslin\u012bcyskuo,
  vol\u016bdys, publicitatis, aktivitatis i tml.].\\n5. Pretendenta sn\u0101guma ilgtspiejo
  \u2013 kaidus p\u0101dus n\u016btik\u0161ona, personeiba, aktivitate pamess godim
  iz pri\u0161ku.\\n\\nSasazynuo\u0161onai:\\nemail@example.com i 64633303\"", "\"\u00abP\u012bci
  breinumi\u00bb \u2013 Latgolys jaun\u012b\u0161u veiduots radejis raidejums par
  v\u012bnaud\u017eim aktualom temom\\n\\nInga Ka\u013cva-Mi\u0146ina Pyrms treis
  godim \u2013 2018. goda 3. febral\u012b \u2013 Latvejis Radejis 5. program\u0101
  (pieci.lv) suoka skan\u0113t jaun\u012b\u0161im d\u016bmuots raidejums latgaliski
  \u00abP\u012bci breinumi\u00bb (t\u0101n \u2013 \u00abP\u012bci breinumi 2.0\u00bb).
  Rai dejums t\u016bp Latvejis Radejis Latgolys studej\u0101 R\u0113zekn\u0113, i
  t\u016b veidoj po\u0161i Latgolys regiona jaun\u012b\u0161i. Kotru nedeli j\u012b
  atraktivi i aizrauteigi stuosta par vysu t\u016b, kas jim i cytim v\u012bnaud\u017eim
  ir aktuals i svareigs. Pr\u012bceigi i skaneigi skan raidejuma sauklis: \u00abKa
  pasaul\u012b ir 7 breinumi, tod myusim 5, i vysi sovi! Breinojam\u012bs k\u016bp\u0101!\u00bb
  Ir pr\u012bks klauseit\u012bs raidejumu, kur\u0101 jaun\u012b\u0161i runoj latgaliski,
  i, kas ir svareigi, \u2013 j\u012b p\u012bruoda (i paruoda), ka latgal\u012b\u0161u
  vol\u016bda ir myusd\u012bneiga vol\u016bda, kur\u0101 var runuot par vysaidom jaun\u012b\u0161im
  aktualom temom.\\n\\n2020.\u00a0goda oktobr\u012b raidejum\u0101, kuru vadeja Daiga
  Laiz\u0101ne i Juo\u0146s Pampe (pyrmais nu lobuos) gasteja Latvej\u0101 popularuo
  muzykys grupa \u00abCarnival Youth\u00bb (att\u0101l\u0101 \u2013 grupys daleibn\u012bki
  Kristi\u0101ns Kos\u012btis (nu kreisuos) i Em\u012bls Kaupers)\\n\\n2019. goda
  rudin\u012b gost\u016bs iz radeju beja atguojuse uzjiemieja, dizainere, dabeiguos
  uodys apstruodis specialiste i zeim\u016bla \u00abZelma Kraft\u00bb radeituoja Zelma
  Ka\u010dk\u0101ne (t\u0101n \u2013 P\u012bgo\u017ene) (nu krei suos), ar j\u016b
  sasarunuoja Sintija Augustova (nu lobuos) i Regita Zei\u013ca\\n\\nPasateic\u016bt
  raidejumam, jaun\u012b\u0161i vairuok runoj latgaliski\\n\\nRaidejuma pyrmsuokum\u016bs
  t\u016b vadeja divi R\u0113zeknis jaun\u012b\u0161i \u2013 Sintija Augustova i Eduards
  Armu\u0161ka. Gost\u016bs tyka aicynuoti da\u017eaidi aktivi Latgolys cilv\u0101ki,
  kuri stuosteja par sevi i sovu dorbu, hobejim, dalejuos sov\u0101 p\u012bredz\u0113,
  \u012bdvasmoj\u016bt cytus. Treis godu laik\u0101 ir izaudzs raidejuma veiduotuoju
  kolektivs \u2013 t\u012b ir desmit jaun\u012b\u0161i, kas aktivi dorboj\u0101s raidejuma
  satura veiduo\u0161on\u0101, \u2013 roda idejis, voda raidejumu, intervej cylv\u0101kus.
  Izaudzs ir ari pats raidejums, kuram t\u0101n ir vairuokys sadalis \u2013 interveja
  ar gostu (\u012bv\u0101roj\u016bt vysus dr\u016b\u0161eibys n\u016bteikumus, sarunys
  t\u0101n nan\u016bteik kluot\u012bn\u0113 R\u0113zekn\u0113, bet attuolynuoti),
  rubrika \u00ab#5BREINUMI vaicoj atbi\u013cdis\u00bb, rubrika \u00abKai tys struodoj?\u00bb,
  rubrika \u00abKas te n\u016bteik?\u00bb. Jaun\u012b\u0161i doluos ar sovu p\u012bredzi,
  d\u016bmom i interesantom n\u016btik\u0161onom, apsarunoj ar cytim jaun\u012b\u0161im,
  muzikim, muokslin\u012bkim, izaicynoj cytus, eksperimentej i puorbauda po\u0161i
  sevi. Juouzsver, ka niu raidejuma veiduo\u0161an\u0101 ir \u012bsasaisteju\u0161i
  aktivi i rod\u016b\u0161i jaun\u012b\u0161i, kuru vyd\u0101 ir ari taidi, kuri v\u0113\u013c
  vuicuos vyds\u0161kol\u0101. Raidejumu \u00abP\u012bci breinumi 2.0\u00bb Latga-\\n\\nSandis
  Proms (Daugavpi\u013cs n\u016bvods) raidejuma \u00abP\u012bci breinumi\u00bb komand\u0101
  dorboj\u0101s jau apm\u0101ram godu:\\n\\nl\u012b\u0161u kulturys goda bolvys \u00abBo\u0146uks
  2020\u00bb\\n\\n\u017e\u016breja izvirzeja 30 lobuok\u016bs nominantu vyd\u0101,
  apl\u012bcynoj\u016bt, ka raidejuma komandys dorbs ir svareigs i paleidz populariz\u0113t
  Latgolu i latgal\u012b\u0161u vol\u016bdu jaun\u012b\u0161u vyd\u0101. Vysus \u00abP\u012bci
  breinumi\u00bb raidejumus var n\u016bsaklauseit s\u0101tyslop\u0101 www.pieci.lv
  sada\u013c\u0101 \u00abRaid\u012bjumi\u00bb/ \u00abP\u012bci breinumi\u00bb.\\n\\nKai
  stuosta Latvejis Radejis Latgolys studejis vadeituoja Ren\u0101te Lazdi\u0146a,
  tod raidejums topa, lai Latgolys jaun\u012b\u0161im byutu \u012bspieja interesant\u0101
  veid\u0101 apgiut medejprateibu: \u00abUzrunovom Latvejis Radeju 5, sok\u016bt,
  ka grybam Latgolys jaun\u012b\u0161us \u012bsaisteit radejis raidejuma veiduo\u0161on\u0101.
  Tys veicynoj medejprateibu, kvalitativys informacejis radei\u0161onu i patierei\u0161onu,
  \u012bvuica jaun\u012b\u0161im \u017eurnalistikys pamatus. Latvejis Radeja 5 p\u012bkryta
  taidai idejai i atba\u013csteja regiona jaun\u012b\u0161u \u012bsaisti. Latgol\u0101
  Latvejis Radejai 5 ir divys frekvencis \u2013 R\u0113zekn\u0113 i Daugav pi\u013c\u012b
  (tuos kai reiz ir studentu pi\u013cs\u0101tys \u2013 I.K.-M.). Nu jau treis godus
  dorbojam\u012bs ar jaun\u012b\u0161im, raidejums atsateista. Pamieginoj\u016bt dorbu
  radej\u0101 i sapr\u016bt\u016bt, ka tei ir j\u016bma, kas jim pateik, daudzi jaun\u012b\u0161i
  aiz\u012bt stud\u0113t tai\u0161ni \u017eurnalistiku.\u00bb\\n\\n*  *  * Anna Sintija
  Ivanova (Daugavpi\u013cs n\u016bvods) raidejum\u0101 gasteja 2019. goda aprel\u012b,
  kod stuosteja par sovu izd\u016bt\u016b dzejis gruomatu \u00ab115-ais R\u012aTS\u00bb:\\n\\ntys
  ir izaudzs i taid\u0101 v\u012bgl\u0101 form\u0101 stuosta par n\u016bp\u012btnom
  temom, p\u012bm\u0101ram, par mobingu, da\u017eaidom att\u012bceibom i t\u016bs
  veiduo\u0161onu, par karjeris izvieli, profesejom. Atkluoj\u016bt konkret\u016b
  temu, p\u012bsaistom regiona jaun\u012b\u0161us. Vyss ir v\u012bgl\u0101 format\u0101,
