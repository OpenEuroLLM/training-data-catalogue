sample: '["\"J.Pab\u0113rzs\\n\\nST\u014cSTI\\n\\n| Tai slykti i tai nalabi | (1913.g.)
  |\\n|---|---|\\n| P\u014dtori | (1921.g.) |\\n| Laim\u00e1 par laimi | (1921.g.)
  |\\n\\nM\u012br\u0101 laim\u00e1\\n\\nTys  beja  rudi\u0146,  sv\u0101td\u012bnis  vokor\u0101.  Vac\u012bs  Dzalbs  atg\u014dja  nu
  bazneicys jau mikriesl\u012b. Tik k\u016b atdariej\u0219 durovys, jys n\u016bj\u00e4m\u00e1
  nu sovys lauk\u014ds golvys capuri i dy\u017ean m\u012bly i pr\u012bceigi run\u014dja
  iz s\u012bvu:\\n\\nAgat, s\u012bv! Lyudzama, Agate\u0146, nazalomoj... As nu lelys
  pr\u012bcys i laimis...\\n\\nAgata jau nu pyrmij\u012bm Dzalba v\u014drdim n\u016bprota,
  ka j\u014ds vec\u0219 labi vi\u0146 \u012bvi\u013cc\u0219. Nasp\u00e4ja jei papl\u00e4s\u021b
  mutis, lai pasceitu k\u016b navi\u0146 veiram, kai tys otkon s\u014dc\u00e1 lyugt\u012bs:\\n\\n\u2014
  Nazalomoj, s\u012bve\u0146, nazalomoj... Vyss itys n\u016btyka caur m\u0233su d\u0101lu
  Juri... Jur, d\u0101ls! \u2014 run\u014dja Dzalbs, k\u014drdams pi durovom iz vad\u017ea
  sveitu, \u2014 Jur, klaus\u012bs, kaidu pr\u012bcu t\u00e1v past\u014dstei\u0161u...\\n\u2014
  Jura nav s\u0101t\u0101, \u2014 p\u014drtrauc\u00e1 Dzalbu Agata.\\n\u2014 Iz M\u014dru!
  Voi tod m\u0233su c\u012bm\u0101 tik vi\u0146 i \u013cau\u017eu kai Blusu M\u014dra?..
  N\u016bg\u014dja iz cytim kaiminim. Voi to jauns cylv\u0101ks lai sv\u0101td\u012b\u0146om
  s\u00e4\u1e11 s\u0101t\u0101...\\n\u2014 Nav? \u2014 lieni pavaic\u014dja vec\u0219.
  \u2014 Kur to jys palyka?.. A-a, \u2014 \u012bd\u016bm\u014dja vec\u0219, \u2014
  zynu, zynu! Iz Blusu M\u014dru aizg\u014dja.\\n\u2014 Iz  M\u014dru,  iz  M\u014dru  n\u016blaip\u014dja,  tu  jau  nast\u014dsti  ma\u0146,  \u2014
  p\u014drtrauc\u00e1 Agatu vec\u0219. \u2014 As radzu, tu gribi nu manim n\u016bsl\u00e4p\u021b,
  lai as nazalomoju. A par ve\u013cti, s\u012bve\u0146. Nudi par ve\u013cti. As \u013c\u016bti
  pr\u012bceigs, ka jys n\u016bg\u014dja iz M\u014dru, nudi. M\u00e1\u0219 tak \u0161udi\u0146
  ai vac\u016b Blusu m\u012bru sader\u00e4jam.\\n\u2014 M\u012bru sader\u00e4jat?
  \u2014 pavysam p\u014drsteigta pavaic\u014dja Agata.\\n\u2014 Nui, s\u012bve\u0146,
  sader\u00e4jam, \u2014 caur osorom run\u014dja Dzalbs. \u2014 Ma\u0146 tagad tik
  v\u012bgli iz sird\u0219, tik labi, tik pr\u012bceigi, ka laimis osorys ac\u012bs
  tai i k\u014dp... Nu, kai to, s\u012bve\u0146, naraud\u014d\u021b? Nu po\u0161ys
  s\u012bna p\u013c\u014dvis kai vylki tys iz t\u016b z\u016bbus gr\u012bz\u00e1m,
  navar\u00e4jam v\u012bns iz \u016btru i pazav\u00e4r\u021b. A \u0161udi\u0146...
  \u0160udi\u0146 sazabu\u010d\u014djam kai eisti draugi.\\n\\n\u2014 Nu i pa\u013cdis
  D\u012bvam. K\u014d to t\u00e1 raud\u014d\u021b? \u2014 m\u012breigi, i ai lelu
  \u012bk\u0161deju pr\u012bcu run\u014dja Agata iz Dzalbu, \u2014 B\u0233\u0219 m\u012brs
  i sadereiba, b\u0233\u0219 i laim\u00e1...\\n\\n\u2014 Laim\u00e1, s\u012bve\u0146,
  laim\u00e1, \u2014 \u014dtri pagiva Dzalbs. \u2014 As nu laimis i rau\u017eu...
  Nu kai to n\u0101? Skaitu \u0161udi\u0146 bazneic\u0101 p\u014dtorus i d\u016bmoju:
  \u00bbK\u016b, sok, dar\u00e4\u021b ai Juri, ka jys pi t\u014ds Blusu M\u014drys
  kai p\u012bs\u012bts.\u00ab D\u016bm\u014dju, d\u016bm\u014dju, s\u012bve\u0146,
  vysu mi\u0161a laiku i nik\u014d nasad\u016bm\u014dju... Izejmu nu bazneicys, ver\u016bs:
  st\u014dv Blusu \u0161vagris, Blyuzgu J\u0101kubs. G\u014dju as pi j\u014d, sazavasal\u014dju,
  i s\u014dc\u00e1m m\u00e1\u0219 run\u014d\u021b. \u00bb\u012asim, \u2014 soka jys
  ma\u0146, \u2014 eukur kr\u016bg\u0101, izdz\u00e1rsim kaidu gl\u014dzi ols i parun\u014dsim.\u00ab
  Nu, sok, labi, par k\u016b to na\u012b\u021b.\\n\\n\u012ag\u014djam m\u00e1\u0219
  kr\u016bg\u0101. Blyuzga paj\u00e4m\u00e1 divi p\u014dri bute\u013cu, i m\u00e1\u0219
  run\u014ddam\u012bs  \u012bm\u00e1t\u00e1m  pa  gl\u014dz\u00e1i.  Tai  m\u00e1\u0219  run\u014djam,  run\u014djam,  gol\u0101
  Blyuzga i soka ma\u0146: \u00bbDeri, soka, Dzalb, ai Blusu m\u012bru. Kaids jums
  lobums tai pl\u00e4st\u012bs. Ni jums po\u0161im m\u012bra, ni jiusu b\u0101rnim.\u00ab
  \u2014 N\u0101, as soku. As navaru ai Blusu m\u012bra der\u00e4\u021b. Nudi, sok,
  navaru. Kai tu d\u016bmoj, soku, iz vasala p\u0101da ma\u0146 p\u014drp\u013c\u014dv\u00e1
  \u0161\u0146\u016bri po\u0161\u0101 lobij\u0101 z\u014dl\u012b i palyka nan\u016bstr\u014dp\u0101ts.
  Voi to as, sok, kaids-nabej\u0219 mu\u013ckis voi lupota, ka ai j\u016b m\u012brei\u0161\u016bs?
  Pa\u013cdis D\u012bvam, soku, turu pylnu u\u010dastku z\u00e1mis, lobus  zyrgus  i  v\u012bnu  \u016btru  simteni  mok\u0101.  Kai  lai,  sok,  Blusai
  pazad\u016bmu.\\n\\nTai run\u014ddams, as pagr\u012b\u017eu iz durovom golvu i ver\u016bs
  \u2014 \u012bn\u014dk pat\u0219 Blusa. Nu, d\u016bmoju, kaida lyga j\u016b \u0161ur
  atn\u00e1s\u00e1. As pazagr\u012b\u017eu ai mugoru iz durovom i sie\u017eu, nik\u014d
  narun\u014ddams. Blusa p\u012bg\u014dja pi mums tyv\u014dk i aizak\u014ds\u00e4ja.
  Blyuzga, izdzierd\u0219 j\u014d bolsu, p\u012bzac\u00e4l\u00e1, p\u012bn\u014dc\u00e1
  pi j\u014d, nazk\u016b pa klusen\u00e1m n\u016bm\u016brd\u00e4ja i otkon atsas\u0101da.
  As pajiemu gl\u014dzi, izdzieru i slauku s\u00e1v \u016bsys, kai nik\u014d nar\u00e1dz\u0101dams.
  Tam laikam Blusa kraun mums iz golda se\u0161ys butelis ols. \u2014 Nu, as d\u016bmoju,
  t\u00e1 jau nalabi b\u0233\u0219. Ka tik iz nakt\u0219 m\u014djom soltij\u0101 naatsaras\u021b.
  As, tai sev\u012b d\u016bm\u014ddams, n\u016bdyuru golvu. Blyuzga ma\u0146 i soka:
  \u00bbK\u014d ta Dzalbs tai aizad\u016bm\u014dja?\\n\\nVoi tik na par m\u012bru?
  Nad\u016bmoj, soka, jau tik dau\u1e11z, nagr\u016bzi jau sovus vac\u016bs smedzi\u0146us.
  Sniedzit, soka, lob\u014dk v\u012bns \u016btram r\u016bku i derit m\u012bru. Pad\u016bmojit,
  soka, kai pr\u012bc\u014ds\u012bs Jur\u0219 ai M\u014dru. J\u012b jau kai bol\u016bdei\u0161i
  se\u0146 m\u012b\u013coj\u0101s, a jiu\u0219, vac\u012b skrobys, jaucot j\u012bm
  laimi, koltot j\u016b sirsnenis.\u00ab Ma\u0146, voi  paticeisi, s\u012bve\u0146,
  it\u012b  v\u014drdi  kai  ai  n\u0101zi  sirdi  p\u014drdyur\u00e1.  I pat\u012bsai,
  d\u016bmoju, caur mums, siermij\u012bm calmim, t\u012bm jaunij\u012bm tai j\u014dkolst...
  Ma\u0146, s\u012bve\u0146, osorys ac\u012bs s\u014dka plyus\u021b. I t\u00e1 Blyuzga
  soka, gl\u014dzis p\u012bl\u012bdams: \u00bbJemit, soka, gl\u014dzis, sazasitit,
  izdzerit da dybynam i sazabu\u010dojit.\u00ab As izdzieru, n\u016bslaucieju \u016bsys
  i p\u012bzacie\u013cu. Nu, soku, Blyuzgai  taisneiba.  Blusa,  der\u00e4sim  m\u012bru.  Namaldyn\u014dsim,  soku,
  sovus  b\u0101rnus...  Blusa  p\u012bg\u014d  pi  man\u0219.  M\u00e1\u0219  sazabu\u010d\u014djam  i  obi
  aizraud\u014djam.  Nui,  aizraud\u014djam,  n\u016bs\u0101dom  pi  golda  i  labi  vi\u0146
  \u012bm\u00e1t\u00e1m, \u2014 slauceidams ac\u0219, st\u014dst\u00e4ja Dzalbs. \u2014
  Tod laidam\u00e4s iz m\u014djom. Sas\u0101dom Blyuzgas rot\u016bs i vysi aizbrauc\u00e1m
  iz Blusu. I, pa cel\u00e1m braukdami, voi zyni, s\u012bve\u0146, k\u016b m\u00e1\u0219
  n\u016brunojom? N\u016bspr\u012bd\u00e1m apprec\u00e4\u021b Juri ai Moru.\\n\\nAtsadar\u00e4ja
  durovys i \u012bg\u014dja vyd\u0101 Jur\u0219, Blusa i Blyuzga.\\n\\n\u2014 Juri  ai  M\u014dru?  \u2014  ai  lelu  pr\u012bcu  \u012bzasauc\u00e1  Agata,  a  vair\u014dk
  nasp\u00e4ja pasc\u00e4\u021b i pu\u0219v\u014drden\u00e1.\\n\u2014 As vysus atve\u017eu,
  \u2014 \u013c\u016bti pr\u012bceigi run\u014dja Jur\u0219, \u012bdams iz pr\u012b\u0161ku.\\n\\nJur\u0219
  aizg\u014dja iz kambari. Beju\u0161\u012b \u012bnaidn\u012bki aps\u0101da ap goldu
  i navar\u00e4ja beig\u021b sovys pr\u012bcys. Jur\u0219 drei\u017ei atn\u00e1s\u00e1
  pylnu spani ols ai b\u012bzu putu aili viers\u0101, p\u012bl\u00e4ja gl\u014dzis
  i pad\u00e1v\u00e1 v\u012bsim.\\n\\n\u2014 T\u00e1 muni draugi, \u2014 \u014dtri
  pagiva vac\u012bs Dzalbs, \u2014 D\u0101ls, j\u00e1m spani, \u00e1j iz kambari,
  raun bucai topu val\u012b. Pazapr\u012bc\u014dsim k\u016bp\u0101!\\n\u2014 D\u0101ls,
  izdz\u00e1\u0157 ai v\u012bsim i \u00e1j, atv\u00e1\u1e11 \u0161ur sovu c\u012blaveni
  M\u014dreni, \u2014 pajymdams r\u016bk\u0101 gl\u014dzi, teic\u00e1 Juram Dzalbs.
  \u2014 As zynu, ka tu bez j\u014ds i brei\u017ea navari jauki pavad\u00e4\u021b.\\n\\nJur\u0219
  izg\u014dja.\\n\\nVysi  \u012bm\u00e1t\u00e1  pa  gl\u014dz\u00e1i.  Dzalbs  j\u012bm  otkon  p\u012bl\u00e4ja  i  nu  pr\u012bcys
  navar\u00e4ja n\u016bs\u00e4d\u00e4\u021b. Agata pa t\u016b laiku dab\u014dja s\u012bra
  i, p\u012blykus\u00e1 iz lela \u0161keiva, n\u00e1s\u00e1 t\u016b gostim.\\n\\n\u2014
  Nu,  v\u00e1ci\u0146,  izdz\u00e1rsim  i  m\u00e1\u0219,  \u2014  \u012braudziej\u0219  Agatu,  run\u014dja
  Dzalbs. \u2014 Jau vairs, \u017eubei\u021b, nazalom\u014dsim. As vairs nal\u012bg\u0161u
  Juram staig\u014d\u021b iz M\u014dru.\\n\\nAk jau, zynoms, kaimineic, \u2014 p\u014drtrauc\u00e1
  Agatu Blusa, \u2014 kaidi rudin\u012b p\u012bni, nu k\u014d to s\u012brus jimsi.\\n\\n\u2014
  Ak jau, izdz\u00e1rsim, veire\u0146, izdz\u00e1rsim, \u2014 pajymdama gl\u014dzi,
  sac\u00e4ja Agata. \u2014 Kai ta jau taid\u0101 jauk\u0101 breid\u012b naizdz\u00e1r\u021b?..
  Dzerit, gasteni i aizk\u016bdit s\u012bra, \u2014 m\u012bl\u014dja gostus saimineica.
  \u2014 S\u012brs taids c\u012bts, saka\u013ct\u0219... v\u00e4\u013c vosorys s\u012bts.\\n\u2014
  Nikas, saimineic, \u2014 pagiva Blyuzga, \u2014 \u012bk\u016bssim gon. Pa\u013cdis
  D\u012bvam, v\u00e4\u013c tur\u012bs mut\u012b z\u016bbi. Nabejom, sac\u00e4\u021b,
  jaun\u014ds d\u012bn\u014ds blie\u0146dari, naizdauz\u00e4jam.\\n\u2014 Nu,  dzerit,  nav\u0101dejit  lob\u014d  a\u013cten\u00e1,  \u2014  izdzier\u0219  gl\u014dzi  i
  slauceidams ols putys nu \u016bsom, skubyn\u014dja gostus Dzalbs.\\n\\nBlyuzga i
  Blusa izdz\u00e4r\u00e1 gl\u014dzis da dybynam i paj\u00e4m\u00e1 pa s\u012bra gobolam.  Agata  tur\u00e4ja  v\u012bn\u0101  r\u016bk\u0101  da  pus\u00e1i  izdzartu  gl\u014dzi  i
  aizad\u016bm\u014dja.\\n\\n\u2014 Par  k\u016b  to  taidu,  \u017eubei\u021b,  aizad\u016bm\u014dji?  \u2014  pavaic\u014dja  Agatu
  Dzalbs: \u2014 Voi d\u016bmoj, kai tagad Jur\u0219 loksta ap M\u014dru, kai j\u012b
  nu laimis bu\u010doj\u0101s. Nad\u016bmoj, v\u00e1ci\u0146, tik daudzi. Lob\u014dk
  izdz\u00e1\u0157 sovu gl\u014dzi. Voi ta jau  m\u00e1\u0219  t\u014d  soldonuma  sov\u0101  myu\u017e\u0101  nabaud\u00e4jam.  Voi  ta  tu  jau
  aizmiersi, kai m\u00e1\u0219 m\u012b\u013c\u014djam\u00e4s?\\n\u2014 Kai jau taidu
  laimi var aizmiers\u021b, \u2014 izdz\u0101rus\u00e1 gl\u014dzi, teic\u00e1 Agata,
  \u2014 T\u014d de\u013c i d\u016bmoju, ka navaru aizmiers\u021b, cik jauki t\u016blaik
  beja.\\n\u2014 Nui, bitei\u021b, as ari navaru aizmiers\u021b, \u2014 pagiva Dzalbs.
  \u2014 \u0160udi\u0146 pa\u021b: kai tik Blyuzga pasc\u00e4ja, ka caur m\u0233su
  naidu Jur\u0219 ai M\u014dru c\u012b\u0161 i kolst, tai ma\u0146 tivle\u0146 sirdi
  sagr\u014db\u00e1 \u017e\u0101lums. I eistyn, d\u016bmoju, kaidys m\u016bkys j\u012bm
  j\u014dc\u012b\u0161! Derei\u0161u, d\u016bmoju, m\u012bru \u2014 lai b\u0233\u0219
  j\u012bm laim\u00e1. Blusa, Blyuzga, \u2014 pazagr\u012bzdams iz j\u012bm, run\u014dja
  Dzalbs, \u2014 dzierd\u00e4jat, par  k\u016b  as  \u0161udi\u0146  m\u012bru  saderieju?  As  labi  zynu,  cik  gryuts
  sazam\u012b\u013c\u014dju\u0161im iza\u0161kier\u021b. M\u00e1\u0219 ai sovu Agateni
  ari m\u012b\u013c\u014djam\u00e4s. M\u00e1\u0219 jaun\u014ds  d\u012bn\u014ds  dzeiv\u014djam  trejs  verstys  v\u012bns  nu  \u016btra  i  navar\u00e4jam
  r\u00e1dz\u00e4t\u012bs kotru d\u012bnu pa nazcik \u0157ai\u017eu. I as sovu \u017eubeiti
  tai m\u012b\u013c\u014dju, ka bez j\u014ds i dzeiv\u014d\u021b navarieju. Str\u014ddoju
  d\u012bn dorbu, \u2014 vys ap Agatu d\u016bmoju.  Atsagulstu  \u2014  sapyn\u0101  j\u016b  radzu.  I  kaidu  t\u016bs  sapynu  tik
  nabeja! V\u012bnu v\u00e4\u013c i tagad p\u012bminu: \u012bt jei bosom k\u014dje\u0146om
  pa taidu \u0161auru stidzeni, aizaugu\u0161u ai za\u013cu z\u014dleiti. I as jai
  pr\u012b\u0161k\u0101. \u2014 Vasala, soku, Agate\u0146! \u2014 \u00bbVasals, vasals,\u00ab
  soka jei i ver\u0101s ma\u0146 tai\u0161ni ac\u012bs. \u2014 Kur ta, soku, ryuksi
  bosom k\u014dje\u0146om? \u00bbKaida t\u00e1v b\u0101da,\u00ab atbi\u013c\u1e11
  jei. \u2014 Nu to, sok, atsas\u00e4ssim t\u00e1 iz z\u014dleitis i parun\u014dsim,
  i pat\u0219 atsas\u0101du. \u00bbAs nagrybu s\u00e4d\u00e4\u021b, grybu lel\u014dka
  izaug\u021b,\u00ab jei ma\u0146 atsoka. \u2014 D\u012bsgon t\u00e1v t\u014d dai\u013c\u014d
  augumen\u00e1, \u2014 as jai soku, i pajiem\u0219 j\u016b aiz r\u016bkys, n\u016bs\u0101dyn\u014dju
  supl\u014dk ai sevi. Tod s\u014dc\u00e1m m\u00e1\u0219 run\u014d\u021b. Jei pasoka
  ma\u0146 v\u014drdeni, pace\u013c i kauneigi, m\u012bly aplai\u017e ac\u0219 i plyuc
  ai pierstenim za\u013c\u016b z\u014dleiti. As p\u012bzam\u012bd\u017eu pi j\u014ds,
  apjiemu j\u016b ap placim i \u00bb\u010dmaukst\u00ab jai lyupe\u0146\u014ds. A jei
  tryuk\u016bs, i as pazam\u016bdu.\\n\\nNu k\u016b jau run\u014d\u021b. Daudzi taidu
  m\u012blu sapynu beja. A kas nu t\u014d. Paplieti ac\u0219 \u2014 i nik\u014d. Cel\u012bs
  reit\u0101, iz\u00e1j iz teiruma, str\u014ddoj, a pr\u014dts tik ap Agateni vi\u0146
  gr\u012b\u017e\u0101s i ocu navar atvi\u013ck\u021b nu t\u014ds pusis, kur lobi\u0146k\u014d
  dzeivoj, i m\u00e4l\u00e1 lepinej: kod, sok, redzei\u0161u j\u014ds skaist\u016b
  vaidzeni, kod dzierdei\u0161u j\u014ds jauk\u016b vol\u016bdeni?\\n\\n\u0156aizi,  tai  ap  Mike\u013cd\u012bnu,  ma\u0146  gad\u00e4j\u00e4s  drusku  sazaneis\u021b  ai
  Agatu. Vasalys divi nedelis as iz j\u016b nastaig\u014dju i j\u014ds naredzieju.
  S\u014dc\u00e1 ma\u0146, voi zynit, sird\u0219 s\u014dp\u00e4\u021b i gryu\u0161i
  pyust\u012bs. N\u016bg\u014dju as Mike\u013cd\u012bn\u0101 iz bazneicu. D\u016bm\u014dju
  t\u012b tierg\u0101 j\u016b satik\u021b. Izstaig\u014dju vysu tiergu, ver\u016bs,
  a j\u014ds  nav.  Nu,  as  d\u016bmoju  sov\u0101  pr\u014dt\u0101,  nav  labi.  Jei  jau  mani
  aizmiersus\u00e1 i cytu n\u016bm\u012b\u013c\u014djus\u00e1. K\u016b, sok, tagad
  dar\u00e4\u021b? As pad\u016bmoju, vysu apsv\u012b\u017eu i g\u014dju \u2014 izmei\u0161u
  pu\u0219butelis \u00bbbo\u013cti\u0146k\u014d\u00ab: laikam, sok, pr\u014dts m\u012breig\u014dks
  palik\u0219... A kur ta tu! V\u00e4\u013c lel\u014dkys narym\u016bnis sagr\u014db\u00e1:
  tai grib\u012bs r\u00e1dz\u00e4\u021b Agatys actenis, tai i valk n\u016bbu\u010d\u014d\u021b
  j\u014ds sorkon\u014ds lyupenis. I as aizad\u016bm\u014dju: kai, sok, niu b\u0233\u021b?\\n\\nJau
  beja satims\u0219. Ce\u013c\u0161 na\u017eieleigi dub\u013cojs. V\u012bnam nakti
  \u012b\u021b iz jaunu meitu \u2014 ni \u0161ai ni tai, i jei v\u00e4\u013c iz mani
  dusmeiga... a s\u0101t\u0101 n\u016bs\u00e4d\u00e4\u021b navar. K\u016b ta, sok,
  \u012b\u0161u iz sovu draugu Odumu. N\u016bg\u014dju. T\u012b Mike\u013cd\u012bn\u0101  olu  dzer.  As  izmatu  gl\u014dzi  pec  gl\u014dzis.  A  sird\u0219  vys
  nam\u012breig\u014dka pal\u012bk. Izmatu v\u00e4\u013c, i man\u012b jau dr\u016bsums
  r\u016bn\u0101s.\\n\\nPad\u016bm\u014dju, pad\u016bmoju, me\u0161u ai r\u016bku
  i lai\u017e\u016bs iz s\u0101tu. S\u0101t\u0101 otkon nikai nan\u016brym\u021b:
  nazkas tai i valk iz Agatu.\\n\\nTod as dasp\u012b\u017eu capuri i lai\u017e\u016bs
  iz Agatu. Ejmu, ejmu, br\u012bnu, br\u012bnu. Dubli da celim. Tymss, navar nik\u014d
  r\u00e1dz\u00e4\u021b, lai pa\u021b voi ac\u012b d\u016brtu. Kai tik spersi dr\u016bs\u014dku
  s\u016bli, tai i izast\u012bp gr\u014dva mol\u0101, kai tik d\u016brs\u012bs k\u014dja
  pi k\u014djis, tai i saklupinej dub\u013c\u016bs. I cikom as tai n\u016bg\u014dju
  da golam, jau i pu\u0219nakt\u0219 par viersu.\\n\\nPaejmu as pret Agatys t\u0101va
  ustobu, ver\u016bs \u2014 vyd\u0101 gun\u0219. \u012aeju ustob\u0101. Ap goldu s\u00e4\u1e11
  pui\u0161i. S\u0101dynoj i mani pi golda. As atsas\u0101du. Izdzieru kaidu p\u014dri
  gl\u014d\u017eu ols i ce\u013c\u016bs n\u016bst.\\n\\nVoi  ta,  sok,  as  ols  dzartu  \u0161ur  atg\u014dju.  Ma\u0146  tak  vajag  sovu
  Agate\u0146u r\u00e1dz\u00e4\u021b. I as lai\u017e\u016bs, apzaveru v\u012bnu ustobu,
  \u016btru golu, a \u1e3faitu ni smokys. Kas, sok, tei par taidu lygu? Kur ta j\u014ds
  sab\u014dztys? Acepl\u012b, sok, gon jau nasaleida... Tai as, izg\u014dj\u0219 si\u0146\u00e7\u014ds,
  st\u014dvu, kosu pakausi i d\u016bmoju. A! ma\u0146 \u012bskr\u00e4ja pr\u014dt\u0101.
  Kliet\u012b, sok, j\u014ds gu\u013c...\\n\\nI lai\u017e\u016bs as par pogolmu iz
  klieti. Daejmu, paraugu \u2014 durovys val\u012b. Nu, as d\u016bmoju, t\u00e1 jei
  ir, t\u00e1 as j\u016b i dab\u014d\u0161u... Atdoru durovys i v\u012bgle\u0146om
  ejmu iz t\u016b koktu, kur Agatys gu\u013cten\u00e1. As jau labi zyn\u014dju, jau
  na pyrm\u016b \u0157aizi beju tym\u0101 kliet\u012b... As ejmu i raugu \u2014 or\u016bds
  pr\u012b\u0161k\u0101. Tod tausteidam\u012bs ejmu pa or\u016bda molai. Monu, k\u014djom
  pr\u012b\u0161k\u0101\\n\\nblu\u010deit\u0219. As izlyku iz t\u014d k\u014dji, lai
  p\u014drk\u014dp\u021b, a k\u014dja kai sleid\u00e4ja, tai as i blyuk\u0161 myltu
  or\u016bd\u0101.\\n\\n\u00bbKa tevi deveini valni,\u00ab as aizkl\u012bd\u017eu.
  I dzier\u017eu, kai nu kliet\u0219 tai izanas \u1e3faitys kai ai vieji i kl\u012bdz:
  \u00bbJezus! Marija! \u013bauteni!.. Zagli, zagli...\u00ab\\n\\nMa\u0146  \u0161\u0101rmys  tai  i  p\u014drskr\u00e4ja  par  mugoru.  I  Agatys,  sok,
  nadab\u014dju, i taid\u0101 kaun\u0101 tyku! K\u016b, sok, niu, dar\u00e4\u021b?
  Raugu leist nu or\u016bda \u014dr\u0101, a naspruk\u021b val\u012b. Tai i gu\u013cu,
  ka ni pakust\u00e4\u021b. I klaus\u016bs: \u014dr\u0101 vei\u0161kys vi\u0146 \u012bt.
  Kas m\u012btus lau\u017e, kas zede\u0146us raun, kas otkon kl\u012bdz: \u00bbTaipa\u021b,
  soka, jys sovu zagl\u00e1 dv\u00e4seli pam\u00e1s\u0219 \u0161ym\u0101 kliet\u012b.
  M\u00e1\u0219 j\u016b pam\u014dc\u00e4sim sve\u0161u montu mekl\u00e4\u021b...\u00ab\\n\\nIzdzierd\u0219
  it\u016bs v\u014drdus, as iz\u0157aizis i apmyru: sird\u0219 apst\u014dja i tik
  k\u016b varieju atgiu\u021b dva\u0161u. \u2014 Nu, sok, tagad i \u00bbamen\u00ab.
  Sasis\u0219, aizkaun\u00e4s i Agata nagrib\u00e4s pazav\u00e4r\u021b.\\n\\nKoleidz
  as tai d\u016bm\u014dju \u2014 ver\u016bs \u012b\u012bt kliet\u012b puis\u0219,
  tur\u0101dams v\u012bn\u0101 r\u016bk\u0101 guni, \u016btr\u0101 motoru, i soka:
  \u00bbKur tys labdar\u0219 ir? Tivle\u0146 m\u00e1\u0219 jam par\u014dd\u00e4sim.\u00ab\\n\\n\u2014
  Pui\u0161i, \u2014 soku as, k\u016b jiu\u0219 dorot... T\u00e1 as. Ai mani nalaim\u00e1
  n\u016btyka. Paleidzit, lyudzami, tik\u021b val\u012b nu or\u016bda.\\n\\nPui\u0161i
  pazyna mani pa bolsam, aizasm\u00e4ja i izvylka nu or\u016bda. As pazavieru iz sevi
  i n\u016bzabeidu: vyss mylt\u016bs, kai patma\u013cn\u012bks. Tod dam\u012bd\u017eu
  capuri i dev\u016bs skr\u012b\u021b pr\u016bjom, a ver\u016bs: kliet\u0219 pr\u012b\u0161k\u0101
  st\u014dv Agata i tai m\u012bl\u0233 i \u017eieleigi ver\u0101s iz mani. Ma\u0146,
  voi zynit, taids kauns, ka as lobpr\u014dt\u014dk b\u0233tu caur z\u00e1mi krit\u0219.
  A Agata soka ma\u0146: \u00bbLyudzams, soka, naj\u00e1m par \u013caunu, ka tai n\u016btyka.
  Ejom, soka, ustob\u0101...\u00ab Ma\u0146, voi patic\u00e4sit, draudzeni, pec taidim
  v\u014drdim tai\u0161ni kai dabasu v\u014drti atsadar\u00e4ja... M\u00e1\u0219 \u012bg\u014djam
  ustob\u0101 i da reita pr\u012bc\u014djam\u00e4s...\\n\\nTam laikam atg\u014dja
  Jur\u0219 ai  M\u014dru i p\u014drtrauc\u00e1 aizarun\u014dju\u0161\u016bs Dzalbu.
  Vysi ai pr\u012bcu pazav\u00e4r\u00e1 iz jaunij\u012bm. Dzalbs \u014dtri p\u012bzac\u00e4l\u00e1,
  p\u012bg\u014dja pi M\u014drys, apkampa j\u016b i n\u016bs\u0101dyn\u014dja obejus
  ai Juri golda gol\u0101.\\n\\n\u2014 D\u0101ls, \u2014 teic\u00e1 jys Juram, \u2014
  p\u012bl\u00e1j gl\u014dzis. As ai M\u014dri parun\u014d\u0161u... Voi tu gribi,
  M\u014dr, s\u00e1v taidu lauku t\u0101vu kai as?..\\n\u2014 \u1e3eaiti\u0146, M\u014dre\u0146,
  \u2014 p\u012bg\u014djus\u00e1 pi M\u014drys, sac\u00e4 Agata, \u2014 tu ma\u0146
  par vysom \u1e3faiti\u0146om vair\u014dk patei\u00e7. As na \u0157aizi asmu p\u014dtare\u0146us
  skaitiejus\u00e1 i uperi iz bazneicu nasus\u00e1, ka D\u012bven\u0161 i Jumprova
  Marija \u013cautu Juram ai tevi sa\u012b\u021b. I tagad as tik pr\u012bceiga, tik
  laimeiga, ka tys m\u012brs n\u016btyka!\\n\\nM\u014dra pabu\u010d\u014dja Dzalbam
  r\u016bku, papl\u00e4t\u00e1 muti nazk\u016b pasc\u00e4\u021b i aizakaun\u00e4ja.\\n\\n\u2014
  M\u012br\u0101 laim\u00e1, \u2014 \u012bzasauc\u00e1 Blyuzga.\\n\\nVysi paj\u00e4m\u00e1
  gl\u014dzis i izdz\u00e4r\u00e1.\\n\\n\u2014 Nui,  draugs,  eistyn,  m\u012br\u0101  laim\u00e1,  pagiva  Dzalbs.  \u2014  To
  izdz\u00e1rsim par t\u016b m\u012bru.\\n\\nJur\u0219 ai M\u014dru s\u00e4d\u00e4ja
  dy\u017ean pr\u012bceigi. J\u012bm ac\u0219 daga. J\u012b v\u00e4r\u00e4s v\u012bns
  \u016btr\u0101, i t\u012b skat\u012bni beja pylny laimis.\\n\\nVe\u010du ac\u0219
  ari beja gr\u012bztys iz jaunij\u012bm, i pr\u012bca iz j\u016bs grumboj\u012bm
  vaigim r\u014dd\u00e4ja, kaidu laimi j\u012b sajiut sov\u014ds sird\u012bs.\\n\\nM\u012brs...\\n\\nM\u012br\u0101
  laim\u00e1!\\n\\nTai slykti i tai nalabi\\n\\nSv\u0101td\u012bnis vokor\u0101 vysa
  m\u0233su c\u012bma jaun\u012b pui\u0161i i \u1e3faitys sazalas\u00e4ja pi  kaimin\u00e1  Ontona  iz  vakaru\u0161ku.  T\u012bpa\u021b  beja  moz\u014dki  puikys,
  \u1e3faitinis.  Pec  gar\u014d  kadril\u00e1  garmonika  iz  \u0161a\u013cti  n\u016bklusa  i  s\u014dc\u00e4s
  jautr\u014dka  runa.  Da\u017ei  st\u014dst\u00e4ja,  k\u016b  beja  redzieju\u0161i  i  dzierdieju\u0161i
  bazneic\u0101  i  pi  bazneicys.  V\u012bns  past\u014dst\u00e4ja,  ka  taidu  i  taidu
  bazneickungs  izsauc\u00e1;  \u016btrs  st\u014dst\u00e4ja,  ka  taids  t\u012b  brangs  puis\u0219
  sasv\u014dt\u014dj\u0219 taidu i taidu \u1e3faitu, i tai t\u014d\u013c\u014dk. V\u014drdu
  sok\u016bt, vysi m\u00e1\u0219 j\u016bk\u014djam, run\u014djam, i tei runa tyn\u0101s
  ap precei\u0161on\u016bs i ap k\u014dzom.\\n\\nS\u016bla gol\u0101,  t\u014d\u013c\u014dk  nu
  jauneklim, s\u00e4d\u00e4ja, sak\u016bd\u0219 peipi  z\u016bb\u016bs, vac\u014dku
  godu cylv\u0101ks \u2014 Justyns Veiz\u00e1. Jys peip\u00e4ja, smeig\u0146\u014ddams
  klaus\u00e4j\u00e4s, k\u016b runoj jaun\u012b, i pat\u0219 b\u012b\u017ei vi\u0146
  \u012bmais\u00e4j\u00e4s run\u0101.\\n\\nV\u012bns nu jauneklim, pazagr\u012bz\u012bs
  iz Justynu, lyudz\u00e1 j\u016b past\u014dst\u00e4\u021b, kai jys nazkod brauc\u00e1
  sv\u014dt\u016bs. Vysi pui\u0161i i \u1e3faitys aizasm\u00e4ja. Daudzi nu j\u012bm
  jau zyn\u014dja Veizis sv\u014dt\u014d\u0161on\u016bs, a da\u017ei jaunekli v\u00e4\u013c
  nazyn\u014dja. T\u014d pec t\u012b ve\u010dam nad\u00e1v\u00e1 m\u012bra. Vec\u0219
  pasmeig\u0146\u014dja i atm\u00e1t\u00e1 ai r\u016bku: \u00bbK\u016b jau, soka,
  as na \u0157aizi t\u016b asmu st\u014dstiej\u0219.\u00ab A jaun\u012b naatsast\u014dja
  nu j\u014d. Tod Veiz\u00e1 izj\u00e4m\u00e1 peipi nu mutis, n\u016bzasp\u013c\u014dv\u00e1
  i s\u014dka st\u014dst\u00e4\u021b, ai lel\u016b pierstu  p\u012bm\u012bgdams  peip\u012b  tabaku  i  pa  laikim  aizvylkdams  kuplu
  dyumu.\\n\\n\u2014 Ma\u0146 beja jau ap \u010detradesmit godu. As dzeiv\u014dju
  ai m\u014dti. T\u0101vs jau beja n\u016bmir\u0219. M\u014dt\u00e1 beja pavysam vaca
  i v\u014dja, nasp\u00e4ja pa\u021b i \u00e4s\u021b izv\u014dr\u00e4\u021b. D\u012bnu
  i nakti iz cepl\u00e1 vi\u0146 dzeiv\u014dja. Vysus dorbus as pat\u0219 apstr\u014dd\u014dju:  \u00e4s\u021b  v\u014drieju,  ustobu  slaucieju,  dr\u00e4bis  mozg\u014dju,  g\u016bv\u0219
  slau\u010du i vysu, vysu pat\u0219 str\u014dd\u014dju. Dzeiv\u00e1, sapr\u016btams,
  beja gryuta i skumeiga.\\n\\nS\u014dku as d\u016bm\u014d\u021b par precei\u0161on\u016bs.
  \u013b\u016bti pateikami pad\u016bm\u014d\u021b ap s\u012bvu, a kod pad\u016bm\u014dsi
  dzi\u013c\u014dk, kod \u012bd\u016bm\u014dsi s\u00e1v, ka ai t\u016b s\u012bvu vajdz\u00e4s
  b\u0233\u021b k\u016bp\u0101 d\u012bnu i nakti i vysu myu\u017eu, to iz \u0157aizi
  par kaulym p\u014drskr\u012bn \u0161\u0101rmys.\\n\\nLabi, sok, ka pajimsi lobu
  s\u012bvu, to dzeiv\u014dsi kai kungs. A voi ta loba \u1e3faita pi man\u00e1 \u012b\u0219?
  As i t\u016blaik beju taids pa\u021b nasmuks, nagleits ai lelu  b\u014drdu,  tik  t\u016blaik  tei  v\u00e1\u013c  nabeja  sierma.  \u2014  N\u0101,  sok,  lob\u014dk
  nazaprecei\u0161u. Tai as i n\u016bspr\u012b\u017eu: loba, g\u016bdeiga \u1e3faita
  pi man\u00e1, sok, na\u012b\u0219, a kaidys nabej\u0219 as najim\u0161u...\\n\\nT\u00e1  kai  iz  nalaimi,  at\u012bt  muns  dz\u00e1dz\u00e1,  myu\u017eeigu  dusei\u0161onu,
  Augusts  \u017dogota.  S\u014dkom  m\u00e1\u0219  run\u014d\u021b  par  saimisteibu,  par  l\u016bpim,
  p\u014drtyku i golu gol\u0101 sarun\u014djam da tam, ka ma\u0146 vajdz\u0101tu saimineicys.
  \u017dogota soka: \u00bbT\u00e1v, Justyn, vajag prec\u00e4t\u012bs. Redzi, soka,
  m\u014dt\u00e1 vaca, slyma,  naspiej  jau  t\u016b  dorbu  str\u014dd\u014d\u021b.  Vajag,  soka,  saimineicys
  mekl\u00e4\u021b.\u00ab\\n\\nAs pakasieju pakausi, n\u016bm\u016brdieju sev\u012b,
  a nik\u014d nascieju. \u017dogota otkon soka: \u00bbTu, soka, veir\u012bt\u0219
  jau kr\u012btn\u016bs god\u016bs. Laiks jau prec\u00e4t\u012bs, laiks jau, soka,
  b\u0233\u021b par pylnu saimin\u012bku.\u00ab\\n\\nAs n\u016bgrymu sev\u012b i run\u014d\u021b
  par precei\u0161on\u016bs ai dz\u00e1dzi nagribieju. A dz\u00e1dz\u00e1 ma\u0146
  nad\u00e1v\u00e1 klus\u00e4\u021b: \u00bbNu atbi\u013cdi, k\u016b gribi dar\u00e4\u021b:
  preceis\u012bs voi n\u0101?\u00ab\\n\\n\u2014 Prec\u00e4t\u012bs gon as grybu \u2014
  as jam tod soku, \u2014 a ma\u0146 bailis: D\u012bvs zyna, kaidu rogonu pajim\u0161u.
  Tod pliess\u012bs cylv\u0101ks vysu myu\u017eu, kai sun\u0219 ar ka\u010di v\u012bn\u0101
  mais\u0101. S\u012bva, soku, na kolpyun\u00e1, naizsv\u012bssi \u014dr\u0101. V\u012bgli
  t\u00e1v pasc\u00e4\u021b \u00bbprecej\u012bs!\u00ab, a paraugi prec\u00e4t\u012bs,
  \u2014 to tu dz\u00e1dzei\u021b cytai\u017e aizdz\u012bd\u014dsi. Prec\u00e4t\u012bs,
  soku, na putrys b\u013c\u016bdu iz\u00e4s\u021b.\\n\\n\u00bbN\u0101, \u2014 as jam
  atbi\u013cdieju, \u2014 as gryb\u0101tu gon prec\u00e4t\u012bs, a ma\u0146 bailis:
  as zynu, ka pi man\u00e1 loba, gudra \u1e3faita na\u012b\u0219, a taidys, kaida
  ma\u0146 napateik, as najim\u0161u. Eku, Kryumu Jul\u00e1, soku, ma\u0146 dy\u017ean
  pateik, a voi ta jei pi man\u00e1 \u012b\u0219? Cyta, soku, ma\u0146 napateik. As
  zynu, ka\\n\\nTod  \u017dogota  sazakn\u012bp\u00e1  i  soka:  \u00bbTu  d\u016bmoj  vysu  myu\u017eu  tai
  n\u016bdzeiv\u014d\u021b?\u00ab\\n\\nda\u017eys  pi  man\u00e1 \u012btu, ai  vysu
  sirdi  i  pr\u014dtu \u012btu, a  as, sok, niv\u012bnys najim\u0161u: jo nav, soku,
  loba tei \u1e3faita, kura pi man\u00e1 gryb iz\u012b\u021b. A Kryumu Juli ai r\u014ddu
  pr\u014dtu jymtu, ka jei tik \u012btu.\\n\\nTai as \u017dogotai pascieju i pat\u0219
  atsas\u0101du iz s\u016bla i n\u016bklusu. \u017dogota ari s\u00e4d\u00e4ja i d\u016bm\u014dja,
  n\u016bk\u014dr\u0219 golvu. Par \u0161a\u013cti jys c\u00e4l\u00e4s, p\u012bg\u014dja
  pi man\u00e1 i soka: \u00bbPalic vasals! As reit reit\u0101 at\u012b\u0161u i obi
  brauksim iz Kryumim sv\u014dt\u016bs.\u00ab\\n\\nTai pasc\u00e4ja i aizg\u014dja.
  As palyku v\u012bns i nik\u014d nasaprotu. \u00bbSv\u014dt\u016bs!\u00ab \u00bbIz
  Kryumim!\u00ab \u00bbO Dabasu T\u0101vs!\u00ab Ma\u0146 vysu m\u012bsu kai blusys
  s\u014dka k\u016bd\u00e4\u021b. Ac\u012bs palyka tymss. As ilgi, ilgi d\u016bm\u014dju,
  kai as brauk\u0161u sv\u014dt\u016bs.\\n\\nTod cie\u013c\u016bs i g\u014dju pi dorba:
  cerieju, ka pi dorba aizmiers\u0161u par reitd\u012bnu. A nik\u014d: pr\u014dt\u0101
  tai i gr\u012b\u017e\u0101s Kryumu Jul\u00e1 \u2014 taida skaista i m\u012bla...
  Atg\u014dja nakt\u0219. As lyk\u016bs gult\u0101 i d\u016bmoju: \u00bbNu, sok, tagad
  gon aizmiers\u0161u!\u00ab A kas t\u016b d\u00e1v\u00e1! Navar aizmig\u021b, i beigts.
  Tai as vysu nakti n\u016bzagr\u016bzieju pa gultu ni midz\u0219, ni namidz\u0219.
  Reit\u0101 ce\u013c\u016bs \u2014 golva gryuta, ac\u0219 kai smi\u013ck\u0161u p\u012bb\u0101rtys.
  Atsas\u0101du iz gultys molys i d\u016bmoju: \u00bbK\u016b, sok, as t\u00e1 \u0161udi\u0146
  grybu dar\u00e4\u021b? Sv\u014dt\u016bs brauk\u021b! Iz Kryumim! Voi ma\u0146 ir
  pr\u014dts? Jul\u00e1i, sok, papylnam sv\u014dtu, lob\u014dku par mani. Tfu! Soku,
  p\u012bsp\u013cau\u021b ma\u0146 iz it\u016b precei\u0161on\u016bs!..\u00ab\\n\\nTod
  as apzaovu, apzavylku, \u012bkiuru cepli. Izv\u014drieju br\u016bkast\u0219, paie\u017eu,
  pabor\u014dju l\u016bpus i tik k\u016b \u012bg\u014dju ustob\u0101, ver\u016bs\u2014
  jau i \u017dogota kl\u014dt.\\n\\nJys \u012bg\u014dja ustob\u0101 i soka: \u00bbNu,
  Justyn, jiudz zyrgu, i brauksim iz Kryumu.\u00ab  Ma\u0146  otkon  par  kaulym  p\u014drskr\u00e4ja  \u0161\u0101rmys;  ap  acim
  apskr\u00e4ja tymsums i golva s\u014dka gr\u012bzt\u012bs. As p\u012bzasp\u012b\u017eu
  pi cepl\u00e1 styura i st\u014dvu,  nik\u014d  narun\u014ddams. A  dz\u00e1dz\u00e1  aizasm\u00e4ja:  \u00bbNu
  k\u014d  ta,  soka, n\u016bzabeidi? Esi m\u012br\u0101, as vakar beju pi Kryuma
  i run\u014dju. Jul\u00e1 ai lobu protu \u012bt. Tik tais\u012bs i brauksim...\u00ab\\n\\nIzdzierd\u0219,
  ka Jul\u00e1 \u012bt pi man\u00e1, as pavysam apjuku. As nikod nad\u016bmoju, ka
  jei pi man\u00e1 \u012btu. Taida smuka \u1e3faita i taidam Vei\u017eu Justynam par
  s\u012bvu!\\n\\n\u2014 N\u0101. \u2014 as soku dz\u00e1dz\u00e1i, \u2014 as nabrauk\u0161u.
  Ka jei \u012bt pi man\u00e1 par s\u012bvu, varb\u0233\u021b, sok, jai ir kaida vain\u00e1:
  loba \u1e3faita gon jau nagrib\u0101tu b\u0233\u021b ma\u0146 par saimineicu.\\n\\nAs
  tai  \u017dogotai  i pascieju. A jys p\u012bzab\u016bz\u00e1 i jau ai dusmom aizbr\u00e4c\u00e1:
  \u00bbTu, Justyn, pr\u014dt\u0101 sajuki! Vakar sacieji, ka jimsi Kryuma \u1e3faitu,
  a \u0161udi\u0146 jau nagribi brauk\u021b!.. Jiudz zyrgu!\u00ab\\n\\nAs izplie\u0161u
  ac\u0219 i ver\u016bs: k\u016b, sok, jys gryb ai mani dar\u00e4\u021b? Ai sp\u0101ku
  gryb apprec\u00e4\u021b!\\n\\n\u2014 N\u0101, \u2014 as jam soku, \u2014 n\u0101,
  dz\u00e1dzei\u021b. As najim\u0161u t\u014ds, kura pi man\u00e1 \u012bt: ma\u0146
  bailis, ka nab\u0233tu slykta. Dusmoj\u012bs, dz\u00e1dzei\u021b, voi n\u0101, a
  nipark\u016b j\u014ds najim\u0161u... As v\u00e4\u013c nabeid\u017eu run\u014d\u021b,
  kai \u017dogota tryuk\u014ds i \u014dr\u0101 pa durovom.\\n\\nAs past\u014dvieju
  \u0161a\u013cti, tod atsas\u0101du i d\u016bmoju: \u00bbBranga gon Jul\u00e1 \u2014
  vaidzen\u0161  bolts,  byudeni  sorkoni,  ac\u0219  sp\u016bdrys  kai  zvaigzneitis.
  Skaista s\u012bva, sok, b\u0233tu. A kai tu j\u016b preceisi, ka jei po\u0161a gryb
  b\u0233\u021b t\u00e1v par s\u012bvu? Vys jau, sok, ir kaida vain\u00e1, cytai\u017e
  jei na\u012btu... Nu soku, D\u012bvs ai j\u016b i ai j\u014ds sp\u016bdrijom acim
  \u2014 ma\u0146 j\u014ds navajag. Dzeiv\u014d\u0161u, sok, tai \u2014 bez s\u012bvys.
  Tai as n\u016bspr\u012b\u017eu i vairs nad\u016bmoju prec\u00e4t\u012bs. Tik Juleit\u00e1
  v\u00e4\u013c i tagad \u012bskr\u012bn pr\u014dt\u0101. Taida, sok, skaista i m\u012bla
  \u1e3faita beja, a k\u016b, sok, dar\u00e4\u021b, tai slykti \u2014 tai nalabi...\\n\\nT\u00e1
  Veiz\u00e1i runoj\u016bt \u012bskr\u00e4ja tabaka dyumi reikl\u012b i jys s\u014dka
  k\u014ds\u00e4\u021b. Puikys  i  \u1e3faitinis, n\u016bst\u014dju\u0161i  ve\u010dam  pr\u012b\u0161k\u0101,
  gaid\u00e4ja,  k\u016b  t\u014d\u013c\u014dk  tys st\u014dst\u00e4s. A Veiz\u00e1
  k\u014dseidams atm\u00e1t\u00e1 ai r\u016bku i izg\u014dja pa durovom.\\n\\nP\u014dtori\\n\\n\u2014
  Klusit, pui\u0161i! Par preceibom past\u014dst\u00e4s mums, \u0161akur, \u010camu
  Odums, jautri aizkl\u012bdz\u00e1 v\u012bns nu c\u012bma jaun\u012bm pui\u0161im.\\n\u2014
  Tys beja z\u012bm\u0101, sv\u0101td\u012bnis vokor\u0101. Jaun\u012b c\u012bma pui\u0161i
  i \u1e3faitys, sazalasieju\u0161i v\u012bn\u0101 ustob\u0101, st\u014dst\u00e4ja
  v\u012bns \u016btram par t\u016b, kaidi sv\u014dti kurai \u1e3faitai gaidami, cik
  bogots jauni\u010d\u0161, cik \u00bbpasaga\u00ab jaunovai.\\n\u2014 A Stymbynu Gr\u012btai
  nazyn voi tik\u021b s\u012bv\u014ds, \u2014 \u012bzasauc\u00e1 v\u012bna nu vac\u014dkom
  meitom. \u2014 \u0160udi\u0146 as dzierdieju, ka bazneickungs j\u016b tik izsauc\u0219...  Jei  p\u014dtoru  nam\u014dk\u016bt.  Ka  na\u012bzam\u014dcei\u0161\u016bt  da  tre\u0161ijam
  saukumam,  to  vairs  natik\u0161\u016bt  saukta.  I  j\u014ds  bryugons  steivs  iz
  p\u014dtorim.\\n\\nVysi pagr\u012bz\u00e1 ac\u0219 iz \u010camu Odumu i n\u016bzasm\u00e4ja.\\n\\n\u2014
  Vyss pagolam, kai caur z\u00e1mi kryta, \u2014 n\u016bteikt\u0101 bols\u0101 sac\u00e4ja
  \u010camu Odums. \u2014 Ka jau p\u014dtoru nam\u014dk, ni D\u012bvs, ni kr\u012bvs
  naleidz\u00e4s.\\n\\nOdums s\u00e4d\u00e4ja kokt\u0101 pi cepl\u00e1 iz nalela be\u0146\u010dei\u0161a.
  Jys beja ap 50 godu vacs, pagarim i varb\u0233\u021b nu p\u0101r\u0146-goda nasuk\u014dtim
  motim, vaigu ai spolvu apaugu\u0161u, kai calms ai sylnom, gierbts taid\u0101 ka\u017euk\u0101,
  kurs, kai soka, kod t\u016b aizp\u016bgoj, tod aug\u0161p\u0101du lau\u017e, kod
  val\u012b lai\u017e \u2014 gais\u0101 nas,  i  kuram  \u012bl\u014dps  iz  \u012bl\u014dpa.  T\u016bm\u0101r,  nazaver\u016bt  iz  sovim  godim,
  izskotu i ka\u017euku, \u010camu Odums p\u012bskait\u00e4ja sevi pi jaunim pui\u0161im
  i par sovu vyslel\u014dk\u016b p\u012bn\u014dkumu skait\u00e4ja apmekl\u00e4\u021b
  vysys sa\u012b\u0161onys, kur jaun\u014dk\u012b sazalosa. Jaun\u014dk\u012b b\u012b\u017ei
  nu j\u014d sm\u00e4j\u00e4s, sevi\u0161ki, kod jys st\u014dst\u00e4ja par  sovu  nalaimeig\u016b  miegin\u014djumu  apzaprec\u00e4\u021b.  A  \u010camu  Odums
  nikod naj\u00e4m\u00e1 par \u013caunu. Turpretim jam sevi\u0161ki patyka, ka nu
  j\u014d smej\u0101s, ka j\u016b vaicoj par j\u014d m\u012blesteibu i jaunom d\u012bnom.\\n\\n\u2014
  Da,  ka p\u014dtoru nam\u014dk, to  nikas naiz\u012b\u0219,  \u2014  \u016btru  \u0157aizi  jys
  pastypryn\u014dja. \u2014 T\u016b as lob\u014dk par po\u0161u bazneickungu zynu.\\n\\n\u00bbAs
  z\u012bdieju, kai r\u016bzeit\u00e1 \u2014 jaunys \u1e3faitys kairyn\u014dju,\u00ab
  tai par sovom jaunom d\u012bnom v\u012bnm\u0101r m\u00e4dz\u00e1 atsasauk\u021b
  Odums.\\n\\n\u2014 Kai to tu zyni? \u2014 gryb\u0101dami, lai \u010cams otkon j\u012bm
  past\u014dsta par sovu nalaimi, vaic\u014dja c\u012bma pui\u0161i. \u2014 Varb\u0233\u021b,
  izam\u014dc\u00e4s p\u014dtorus i bazneickungs salaul\u014d\u0219.\\n\\nVyss pagolam,
  kai  caur  z\u00e1mi  kryta,  \u2014 kai  v\u012bnm\u0101r  atciert\u00e1 Odums.
  \u2014 Kas t\u016bs var izam\u014dc\u00e4\u021b! As jau lob\u014dk t\u016b zynu.\\n\\nOdums
  n\u016bzasp\u013c\u014dv\u00e1 i apv\u00e1d\u00e1 vysus ai acim, kur\u014ds var\u00e4ja
  r\u00e1dz\u00e4\u021b, ka jam grib\u012bs past\u014dst\u00e4\u021b par sevi.\\n\\n\u2014
  Voi ta jiu\u0219 nazynit, kai ma\u0146 beja? \u2014 nasagaidiej\u0219 nikaida pr\u012bk\u0161lykuma
  nu cytim, vaic\u014dja Odums.\\n\\nAtsak\u014dsiej\u0219 jys s\u014dka st\u014dst\u00e4\u021b.\\n\\n\u00bbLai
  b\u0233\u0219 pag\u016bdyn\u014dts,\u00ab soku.\\n\u2014 Tys beja v\u00e4\u013c
  tod, kod ma\u0146 beja kaidi 35 godi. Cik eistyn beja, as nazynu \u2014 voi ta as
  sovys krystobys p\u012bminu? Dzeiv\u014dju as v\u012bns pat\u0219 taipa\u021b kai
  tagad. M\u014dt\u00e1 i t\u0101vs, soka, mani mozu pamatu\u0161i. Dzeiv\u014dju
  i nikaids \u013cauns gors ma\u0146  nag\u014dja  pr\u014dt\u0101.  Pat\u0219  syv\u0101nu  bor\u014dju,  pat\u0219
  vu\u0161ku cierpu i g\u016bteni slau\u010du... Cik jau ma\u0146 t\u014ds saimisteibys
  iz sastys dalenis?.. \u0156aizi  z\u012bm\u0101 brau\u010du as iz  me\u017eu pec  molkys.
  Braucu ai molku atpaka\u013c. T\u00e1 euku \u017dogotu c\u012bm\u0101 br\u012bsmeigi
  pui\u0161i, kai kolni. Molkys vazums \u012bkrauts nikas. Brauc\u016bt gar P\u012btera
  s\u0101tu, vazums, brak, iz s\u014dna i rogovys tik saknei\u0161\u00e4ja vi\u0146.
  \u00bbVyss pagolam, kai caur z\u00e1mi kryta,\u00ab soku as sov\u0101 pr\u014dt\u0101.
  K\u016b to dar\u00e4\u021b \u2014 taids tam liktin\u0219. Ejmu as pi P\u012btera
  pras\u00e4\u021b paleiga, lai d\u016bd rogovys n\u016bv\u00e1s\u021b molku iz s\u0101tu.
  \u012aeju pogolm\u0101, ver\u016bs, kas t\u00e1 taids?! Vyss izslauceits, izteireits.
  Malnys komonys st\u014dv, taids t\u012bvs l\u016bks ai zvanenim. \u00bbVoi tik na
  sv\u014dti P\u012btera Madal\u00e1i,\u00ab \u012bskr\u00e4ja ma\u0146 pr\u014dt\u0101.
  \u012aejmu ustob\u0101.\\n\u00bbMyu\u017eeigi, myu\u017eam!\u00ab pajem lobu d\u012bnu
  pat\u0219 P\u012bter\u0219.\\n\u2014 Ver\u016bs \u2014 P\u012bteram byudi sorkoni
  kai pec piert\u0219. Iz golda skr\u016bz\u00e1 i vasala rynda pylnu sorkona ols
  gl\u014d\u017eu. Aiz golda s\u00e4\u1e11 Madal\u00e1 i nazkaids labvi\u0146 skaists
  puis\u012bt\u0219. As pi durovom n\u016bst\u014dju, n\u016bzabeidu i tivle\u0146
  gribieju \u012b\u021b atpaka\u013c. A vac\u012bs P\u012bter\u0219 mani aptur\u00e4ja.\\n\\n\u2014
  Kur tu \u012bsi, \u2014 sajymdams mani aiz placa, sac\u00e4 jys, \u2014 siest\u012bs,
  lyudzu, \u012bdz\u00e1rsim. Pi mums \u0161udi\u0146 taids g\u016bds.\\n\\nAs atsas\u0101du.
  P\u012bter\u0219 ma\u0146 p\u012bn\u00e1s\u00e1 ols gl\u014dzi. As izme\u0161u.\\n\\n\u2014
  Iz \u016btrys k\u014djis! \u2014 p\u012bliej\u0219 \u016btru, sac\u00e4 P\u012bter\u0219.\\n\\nIzme\u0161u  \u016btru  i  tivle\u0146  tre\u0161u.  Ols  lobs,  styprs:  tivle\u0146  pa
  mugorkauli s\u014dka staig\u014d\u021b. Pazace\u013c nu aiz golda Madal\u00e1, p\u012b\u012bt
  pi man\u00e1 kl\u014dt, sn\u0101dz ma\u0146 r\u016bku i soka:\\n\\n\u2014 As \u0161udi\u0146
  sadzarta, jau pi bazneickunga aizraksteiti. Tys ir muns jauni\u010d\u0161, \u2014
  n\u016br\u014dd\u00e4ja Madal\u00e1 iz t\u016b veir\u012bti, kas ai j\u016b s\u00e4d\u00e4ja
  aiz golda. \u2014 Voi skaists b\u0233\u0219 muns veirs?\\n\\nMadal\u00e1 aizasm\u00e4ja,
  j\u014ds jauni\u010d\u0161 n\u016bryuc\u00e1 kokt\u0101 aiz golda. Vac\u012bs P\u012bter\u0219
  p\u012bg\u014dja pi man\u00e1 i soka:\\n\\n\u2014 Nikas gon, \u2014 atsoku as, jau
  drusku tic\u0219 pi dr\u016bsuma. \u2014 Nikas, lai D\u012bvs paleidz jam symtu
  godu dzeiv\u014d\u021b i pulku b\u0101rnu audz\u00e4\u021b.\\n\u2014 Nu, Odum, izdz\u00e1\u0157
  vysys gl\u014dzis, cik ir iz golda \u2014 par munys \u1e3faitys laimi.\\n\\nV\u012bnu
  pec \u016btrys as n\u016bteirieju kaidu divpadsmit gl\u014d\u017eu. Pavysam palyka
  sylti pakaus\u012b... Madal\u00e1 otkon s\u00e4d\u00e4ja ai sovu jauni\u010di aiz
  golda, naz k\u016b \u0161veikst\u00e4ja sov\u0101 storp\u0101... Madal\u00e1 izlykus\u00e1
  jauni\u010dam r\u016bku iz placa, jauni\u010d\u0161 \u016btru sajiem\u0219 sov\u014ds
  r\u016bk\u014ds. Tai\u0161ni kai obroz\u0101...\\n\\n\u2014 Nak, as i izdzer\u0161u,
  \u2014 atbi\u013cdieju as, \u2014 naasmu as ai pierstu dzirdejams.\\n\u2014 Labi
  gon j\u012bm tai s\u00e4d\u00e4\u021b i \u0161veikst\u00e4\u021b \u2014 n\u016bd\u016bm\u014dju
  as sov\u0101 pr\u014dt\u0101. T\u00e1 atsadora durovys i nazkaids puika \u012bzave\u013c
  ustob\u0101.\\n\u2014 Tys  zyrgs  muns,  \u2014  pagivu  as.  \u2014  T\u00e1  ai  t\u016b  olu...  as,
  aizmiersu... Vazums apzag\u014dz\u00e1 i rogovys salyuza... Voi tu navar\u0101tu,
  dz\u00e1dzka, paleidz\u00e4\u021b?\\n\u2014 Dz\u00e1dz\u00e1, eukur nazkaids zyrgs
  st\u014dv pret jiusu v\u014drtim, molkys vazums apzag\u014dz\u012bs, \u2014 n\u016bzabeidu\u0161\u0101
  bols\u0101 runoj puika.\\n\u2014 A-a, ai lobu pr\u014dtu, \u2014 p\u012bkryta P\u012bter\u0219.\\n\\nAs
  p\u012bzace\u013cu, pajemu sovu mici. Vac\u012bs P\u012bter\u0219 v\u00e4\u013c
  ma\u0146 gl\u014dzi, Madal\u00e1 ai cel\u00e1 gl\u014dzi i ari P\u012bter\u0219
  otkon ai cel\u00e1 gl\u014dzi... As, zynoms, kai \u016bgu v\u012bnu pec \u016btrys...
  Raugu \u012b\u021b \u2014 nazk\u016b na tai \u2014 sver atpaka\u013c... T\u016bm\u0101r,  voi  ma\u0146  pyrm\u014d  \u0157aiz\u00e1  olu  dz\u00e1r\u021b?..  Sajiemu  sp\u0101ku,
  atsasveicyn\u014dju  ai  vysim...  Madal\u00e1  s\u00e4\u1e11 aizga\u013cd\u012b  ai  sovu  jauni\u010di,
  apza\u010d\u0101ru\u0161i... tai labi... ma\u0146 sl\u012bkys vi\u0146 n\u016bt\u00e1c\u00e4ja...
  Izg\u014djam m\u00e1\u0219 ai vac\u016b P\u012bteri, p\u014drkr\u014dv\u00e1m molku
  i as aizbrau\u010du.\\n\\nNazkai p\u014dr\u014dk labi ma\u0146 beja iz sird\u0219.
  Apeineit\u0219 pa smedzinim k\u014dpel\u00e4ja, a d\u016bm\u014dj\u00e4s par Madali
  i j\u014ds jauni\u010di \u2014 kai j\u012bm labi divejim s\u00e4d\u00e4\u021b apza\u010d\u00e4ru\u0161im.
  \u012aeju as sov\u0101 ustob\u0101. Solts, nateirs, v\u012bns pat\u0219... Skumeigi!\\n\\n\u2014
  A kas b\u0233tu, ka as taidu breinumu izdareitu? \u2014 pavaic\u014dju pat\u0219
  s\u00e1v. \u2014 Voi as nataids cylv\u0101ks kai cyti? Voi jau pi man\u00e1 nikaida
  meita na\u012b\u0219? Voi ta as na puis\u0219?\\n\\nD\u016bm\u014dju ilgi, da v\u0101lai
  nakt\u00e1i. P\u014drd\u016bm\u014dju par daudzom \u1e3faitom, pi kurom b\u0233tu
  j\u014dbrauc sv\u014dt\u016bs, tyv\u014dk ma\u0146 pi sird\u0219 kryta Krauk\u013cu
  Gu\u0146d\u00e1, ekur, kas aiz azara dzeivoj. Jei \u1e3faita d\u016b\u0161eiga,
  taida sibirna, kai gubern\u00e1. Saimineica jau loba b\u0233tu \u2014 d\u016bmoju
  sov\u0101 pr\u014dt\u0101. Nav jei skaista, \u013caud\u0219 st\u014dsta, ka jai
  daguns \u013c\u016bti lels, r\u016bkys i k\u014djis kai m\u012bta goly i ac\u0219
  drusku greizys, a kas par t\u016b.\\n\\nMa\u0146  \u012bzagrib\u00e4ja  prec\u00e4t\u012bs.  Atsagulu,  apzased\u017eu,  a  m\u012bga  nav.
  Pr\u014dt\u0101 r\u014dd\u014ds, kai labi b\u0233tu divej\u016bs ai s\u012bvu...\\n\\nAs
  jau Gu\u0146di i agr\u014dk pazynu, kod jei v\u00e4\u013c jaun\u014dka beja. Tys
  beja v\u012bna Mike\u013cd\u012bn\u0101. Jei beja atbraukus\u00e1 iz v\u012bnu m\u0233su
  kaimini c\u012bm\u0101. Nu, i  as  iz  tureini  n\u016bzalai\u017eu...  Kai  tod  \u2014  jaunys  \u1e3faitys,  soka,
  sabrauku\u0161ys. M\u00e1\u0219 t\u012b vokor\u0101 sie\u017eom aiz golda, j\u016bkojom,
  dzerom olu. As Gu\u0146di sagr\u014dbu i gribieju n\u016bbu\u010d\u014d\u021b. Kas
  t\u012b, redz\u012bs, par lelu nalaimi, ka j\u016b b\u0233tu n\u016bbu\u010d\u014dj\u0219.
  A jei aizasp\u012bdz\u00e1 kai ma\u0161in\u00e1: \u00bbTaids kai calms, soka, pi
  man\u00e1 \u010der\u0101s. N\u016bst \u00e1j.\u00ab I nik\u014d vairs nasac\u0101dam\u0101,
  pouk\u0161, ma\u0146 ols gl\u014dzi iz golvys. Vysu mani tai n\u016bg\u014dz\u00e1
  ai olu.\\n\\nCyti gosti sm\u00e4j\u00e4s. As tryuk\u016bs k\u014dj\u014ds. Voi as
  jai kaids lupota, ka mani skol\u014dtu ai olu? Staigoju dusmeigs, ni dzeru, ni runoju.
  Ver\u016bs, izlein nu aizga\u013cdis Gu\u0146d\u00e1, p\u012b\u012bt pi man\u00e1
  i taidu m\u012blu ba\u013csteni s\u014dc ma\u0146 run\u014d\u021b. \u00bbK\u014d
  ta tu, Odume\u0146, soka, aizdusm\u014dji. As tik tai, j\u016bk\u014ddama, natei\u0161i.\u00ab
  Run\u014ddama Gu\u0146d\u00e1 paj\u00e4m\u00e1 dv\u012bli i n\u016bslauc\u00e4ja
  ma\u0146 golvu, vaigu  i  dr\u00e4bis.  Ma\u0146  iz  \u0157aizi  vys\u0101  dusm\u00e1  pagolam.  M\u00e1\u0219  otkon
  sas\u0101dom pi  golda, dzerom, runojom, j\u016bkojom... Pec  t\u014d laika as \u0157aizjom
  Gu\u0146di satyku pi bazneicys. Taida loba, run\u014dja ai mani i sm\u00e4j\u00e4s!
  T\u014d de\u013c ari t\u016bnak\u021b, kod ma\u0146 \u012bskr\u00e4ja pr\u014dt\u0101
  prec\u00e4t\u012bs, Krauk\u013cu Gu\u0146d\u00e1 tyv\u014dk kryta pi munys sird\u0219.\\n\\nJau
  acepl\u012b gail\u0219 n\u016bdz\u012bd\u014dja, kod as aizmygu. Bet gryuts beja
  m\u012bgs:  sapyns  pec  sapyna.  Braucu  as  sv\u014dt\u016bs  pi  v\u012bnys  taidys
  napazeistamys \u1e3faitys, rod\u012bs ma\u0146 sapyn\u0101, \u2014 tei atsoka. Braucu
  pi \u016btrys. Otkon atsoka. Naskaists, nam\u016bk\u016bt run\u014d\u021b, kai l\u014dc\u0219.
  N\u016bdzanu b\u014drzdu,  n\u016bcierpu  motus  i  braucu  pi  tre\u0161\u014ds.  Tei  \u012bt.  Sadzerom,
  sazarokstom. Braucom iz pi\u013cs\u0101tu, n\u016bpierkom gradzynus \u2014 eist\u014d
  vara. P\u012bv\u014drejom ols. Kozys gotovys. Braucom iz bazneicu laul\u014dt\u012bs.
  N\u016bst\u014djam pret oltoru. V\u012bn\u0101 pus\u012b as kai \u016bzuls st\u014dvu,
  \u016btr\u0101 jaunova, taida  skaista,  kai  e\u0146gel\u0219,  appl\u0101sta  ai  boltu  vi\u013cumu,  za\u013c\u0161  mirtu
  vai\u0146uks iz golvys... At\u012bt bazneickungs, s\u014dc laul\u014d\u021b. Vaicoj
  gradzynu. As mekl\u00e4\u021b \u2014 nav gradzyna. Izmekleju pa vysom ke\u0161om
  \u2014 nav, kai gun\u012b  sadaga.  Bazneickungs  aiz\u012bt,  nalauloj.  Braucu  iz  m\u014djom.
  Dusm\u014ds maucu n\u016bst bazneicys z\u014dbokus. Ver\u016bs \u2014 gradzyns izave\u013c
  nu z\u014dboka. Lai napazaud\u00e4\u021b, braukdams iz bazneicu, as j\u016b beju
  \u012bb\u014dz\u0219 z\u014dbok\u0101... Sapyn\u0101 n\u016bzalom\u014dju tai, ka
  izam\u016bdu.\\n\\nPar \u0161a\u013cti otkon aizmygu. Otkon sapyni. Radzu as, ka
  salaul\u014dts ai Krauk\u013cu Gu\u0146di. Pec lauleibom atbrauku\u0161i nu bazneicys,
  sie\u017eom m\u00e1\u0219 pi Krauklim aiz golda. Ma\u0146 pi pr\u012b\u0161kys p\u012bsprausts
  pu\u010du pu\u0161kis ai garom  boltom  b\u016br\u021bom.  Gu\u0146d\u00e1  zam  vi\u013cuma.  Ap  goldu  staigoj
  dz\u012bd\u014dt\u014djis i apdz\u012b\u1e11 munu dagunu, ac\u0219, golvu i vysu,
  kas tik j\u014dm pr\u014dt\u0101 \u012b\u012bt. Gu\u0146d\u00e1 s\u014dc raud\u014d\u021b,
  tryukst\u0101s, n\u016braun nu golvys vai\u0146uku i vi\u013cumu, n\u016bsv\u012b\u017e
  z\u00e1m\u012b i po\u0161a aizb\u0101g. As jai paka\u013c, i nikai navaru dadzei\u021b...\\n\\nOtkon
  izam\u016bdu. Golva s\u014dp, taids gryutums i ap sirdi nalabi.\\n\\nTai  as  m\u016bciej\u016bs  da  reita.  St\u014dj\u016bs  reit\u0101  pi  dorba,  a  dorbs
  nazaveic. Pr\u014dt\u0101 vys Krauk\u013cu Gu\u0146d\u00e1.\\n\\nSagaidiej\u0219
  sv\u0101td\u012bni, lai\u017e\u016bs iz bazneicu. Varb\u0233\u021b Gu\u0146di redzei\u0161u.
  Tai i ir. Pec m\u014dceibys izeju nu bazneicys \u2014 ver\u016bs: Gu\u0146d\u00e1
  i cytys \u1e3faitys runoj ai nazkaidim pui\u0161im. Gribieju as \u012b\u021b kl\u014dt,
  bet tryuka dr\u016bsuma. T\u012bpa\u021b as sateiku sovu dz\u00e1dzi, s\u014dc\u00e1m
  run\u014d\u021b par t\u016b, par \u0161\u016b, i as jam soku, ka grybu prec\u00e4t\u012bs:
  gona jau ma\u0146 sun\u00e1 dzeivi dzeiv\u014d\u021b.\\n\\n\u2014 Labi, \u2014 soka
  dz\u00e1dz\u00e1, \u2014 trauc val\u012b. A k\u016b tu d\u016bmoj prec\u00e4\u021b?\\n\u2014
  Nak jau Krauk\u013cu Gu\u0146di... jei jau ma\u0146 vair\u014dk atsateik, \u2014
  soku as kauneig\u0101 bols\u0101.\\n\u2014 Nu, lai D\u012bvs t\u00e1v paleidz, \u2014
  pr\u012bc\u014ddam\u012bs dz\u00e1dz\u00e1 n\u016bviel\u00e4ja ma\u0146 laimis.\\n\\n\u2014
  A ma\u0146 sv\u014dta nav, \u2014 soku as, \u2014 voi navar\u0101tu tu n\u016bbrauk\u021b?
  Dz\u00e1dz\u00e1 p\u012bkryta.\\n\\n\u016atord\u012bna  laimeiga de\u013c  sv\u014dtim  d\u012bna.  De\u013c  t\u014d  m\u00e1\u0219  n\u016bspr\u012bd\u00e1m
  \u016btord\u012bn brauk\u021b iz Krauklim.\\n\\n\u016atord\u012bn agri, tik pec
  saulis liek\u0161onys, atbrauc\u00e1 dz\u00e1dz\u00e1 maln\u014ds komon\u014ds,  raksteit\u014ds  sorkonom  pu\u010dom.  Biereit\u0219  p\u016brk\u0161  vi\u0146.  As
  apzavylku sv\u0101td\u012bnis dr\u00e4bj\u014ds, apmau\u010du jau vakar vokor\u0101
  izsmiereit\u016bs ai taukim z\u014dbokus, i laidam\u00e4s cel\u00e4.\\n\\nPi  Krauklim  ustoba  teira  \u2014  varb\u0233\u021b  Gu\u0146d\u00e1  jau  se\u0146  sv\u014dtus
  gaidiejus\u00e1.  Atsas\u0101stom,  s\u014dcom  run\u014d\u021b  ai  po\u0161u  Kraukli  i  m\u014dti.  A
  Gu\u0146dis nar\u00e1\u1e11z.\\n\\n\u2014 Kur ta tova \u1e3faita? \u2014 vaicoj
  nu Krauk\u013cu t\u0101va sv\u014dts.\\n\u2014 Varb\u0233\u021b izg\u014djus\u00e1
  g\u016bvim pasv\u012bs\u021b cysu, \u2014 atbi\u013cd\u00e4ja Krauklis.\\n\u2014
  Voi D\u012bve\u0146! Taidu skaistu \u1e3faitu laisdams iz l\u016bpim. Ka mums taida
  \u1e3faita, m\u00e1\u0219 j\u016b nu ustobys nalaistu.\\n\\nVacijam Kraukl\u00e1m
  palyka \u013c\u016bti pr\u012bceigs vaigs. M\u014dt\u00e1, saprotus\u00e1 nu sv\u014dta
  v\u014drdim, kas m\u00e1\u0219 par gostim, izg\u014dja \u014dr\u0101.\\n\\n\u2014
  Varb\u0233\u021b pec Gu\u0146dis n\u016bg\u014dja, \u2014 n\u016bd\u016bm\u014dju
  sov\u0101 pr\u014dt\u0101.\\n\u2014 M\u00e1\u0219 atbrauc\u00e1m pi jums, \u2014
  gr\u012bz\u00e4s sv\u014dts pi Krauk\u013cu t\u0101va, \u2014 n\u016blaup\u00e4\u021b
  jiusu skaist\u014dk\u016b montu \u2014 Gu\u0146di. Ekur \u010camu Odums navar bez
  j\u014ds dzeiv\u014d\u021b, ni d\u012bnu ni nakti nabauda m\u012bra.\\n\u2014 Odums
  \u2014 puis\u0219 kai \u016bzuls i saimin\u012bks na slykts, \u2014 mani p\u014drtrauc\u00e1
  sv\u014dts, kai sauleit\u00e1 jei speid\u0101tu pi Oduma.\\n\u2014 Da, t\u0101vs,
  \u2014 izgryu\u017eu ari as ar sovu m\u00e4li, \u2014 ni d\u012bn, ni nak\u021b...
  Tai\u0161ni dzeiv\u014d\u021b navaru.\\n\\nDa, kai sauleit\u00e1 i mienes\u0219,
  \u2014 otkon as \u012bzagryu\u017eu. \u2014 L\u016bpus boroju as pat\u0219, vu\u0161kys
  cierpu, g\u016bvi slaucu...\\n\\nPa t\u016b laiku atsadar\u00e4ja durovys i \u012bg\u014dja
  m\u014dt\u00e1 ai Gu\u0146di. Sird\u0219 ma\u0146 tai i n\u016btreis\u00e4ja. Sv\u014dts
  c\u00e4l\u00e4s k\u014dj\u014ds i past\u012bp\u00e1 r\u016bku Gu\u0146d\u00e1i.
  P\u012bzace\u013cu as i n\u016bza\u010dieru pi Gu\u0146dis r\u016bkys.\\n\\n\u2014
  Pi Oduma jei kai pu\u010deit\u00e1 z\u012bdeitu, \u2014 otkon mani p\u014drtrauc\u00e1
  sv\u014dts. \u2014 Vyss jai b\u0233tu. Tik putna p\u012bna tryuktu.\\n\u2014 Cik
  nalobi tovi t\u0101vs ai m\u014dti! sac\u00e4ja sv\u014dts Gu\u0146d\u00e1i. Syuta
  tevi pi dorba, lai tovys skaist\u014ds r\u016bcenis padareitu malnys. M\u00e1\u0219
  tevi kai zeileiti sorg\u014dtu i tur\u0101tu ustob\u0101.\\n\\nZam vokora m\u00e1\u0219
  brauc\u00e1m iz s\u0101tu, n\u016brun\u014dju\u0161i, ka cat\u016brtd\u012b\u0146
  sadz\u00e1rsim i sazarakst\u00e4sim.\\n\\nGu\u0146d\u00e1  n\u016bzakaun\u00e4ja,  atsas\u0101da  iz  be\u0146\u010da  pi  l\u016bga  i  ni  v\u014drda
  nasac\u00e4ja. Kl\u014dtu jai atsas\u0101da sv\u014dts i kai s\u014dka j\u016b gr\u012bz\u021b
  ai m\u00e4li, kai s\u014dka mal\u021b, kai dziernovu akmin\u0219! Gu\u0146d\u00e1
  tik n\u016bsorkst i pazaver iz mani kauneigom acim. As ari \u0161\u016b t\u016b
  gribieju sac\u00e4\u021b, a sv\u014dts ma\u0146 nad\u00e1v\u00e1 run\u014d\u021b:
  pat\u0219 ber i ber, kai pupys or\u016bd\u0101. Tam laikam vac\u012bs Krauklis atn\u00e1s\u00e1
  ols skr\u016bzi. M\u014dt\u00e1 pac\u00e1p\u00e1 galis, aizk\u016bd\u00e1m i izdz\u00e4r\u00e1m.\\n\\nCat\u016brtd\u012b\u0146,
  kai p\u012bdar, m\u00e1\u0219 ai sv\u014dtu n\u016bbrauc\u00e1m iz Krauklim, izdz\u00e4r\u00e1m
  i tod as ai Gu\u0146di laidam\u00e4s iz bazneickungu.\\n\\n\u2014 Tai  i  tai,  \u2014  soku  bazneickungam,  \u2014  grybom  prec\u00e4t\u012bs.
  lyudzom, gareig\u012bs t\u0101vs, voi navar\u0101tu sazarakst\u00e4\u021b.\\n\\nBazneickungs
  paj\u00e4m\u00e1 papeira gabaleni i nazk\u016b p\u012brakst\u00e4ja.\\n\\n\u2014
  Labi, \u2014 soka bazneickungs, \u2014 a voi m\u014dkot p\u014dtorus?\\n\\nMa\u0146
  ir p\u014drskr\u00e4ja soltums par kaulym.\\n\\n\u2014 Pa drusceit\u00e1i m\u014dkom,
  \u2014 atsac\u00e4ja Gu\u0146d\u00e1.\\n\u2014 Voi tu m\u014dki atsaceibys, \u2014
  vaicoj nu man\u00e1 bazneickungs.\\n\\nGu\u0146d\u00e1  beja  dr\u016bs\u014dka  ai  bazneickungu,  moz\u014dk  j\u014d  beid\u014ds.
  Bazneickungs nu j\u014ds pavaic\u014dja p\u014dtorus. Jei d\u016brsteidam\u014ds
  n\u016bskait\u00e4ja vasalu  litani.  S\u014dka  vaic\u014d\u021b  par  atsaceibom.  T\u012b  nabadzeit\u00e1  Gu\u0146d\u00e1
  sazapyna.\\n\\n\u2014 \u00bbT\u0101vs m\u0233su\u00ab, \u00bbSveicyn\u014dta\u00ab,
  \u00bbE\u0146gel\u0219 Kungam\u00ab, \u00bbMyu\u017eeigu dusei\u0161onu\u00ab...\\n\u2014
  T\u00e1 nav b\u00e4ris, ka \u00bbmyu\u017eeigu dusei\u0161onu\u00ab skait\u00e4\u021b,
  \u2014 aizkl\u012bdz\u00e1 bazneickungs. \u2014 Ejit iz s\u0101tu, \u012bzam\u014dcit
  p\u014dtorus, tod sarakstei\u0161u.\\n\\nM\u00e1\u0219 aizbrauc\u00e1m iz Krauklim
  i n\u016bzarun\u014djam, ka da n\u014dku\u0161ai cat\u016brtd\u012bn\u00e1i \u012bzam\u014dc\u00e4sim
  p\u014dtorus.\\n\\nN\u016bbrauc\u0219  iz  sovu  s\u0101tu,  as  meklieju  p\u014dtoru  gr\u014dmotu,  lai
  \u012bzam\u014dc\u00e4\u021b p\u014dtorus. Atrodu gr\u014dmotu acepl\u012b iz loktys.
  S\u014dcu skait\u00e4\u021b \u2014 navaru: aizmiersu literus. Tai par nedelis laiku
  as tik \u00bbAs tycu\u00ab \u0161ai tai izam\u014dcieju.\\n\\nN\u014dku\u0161u cat\u016brtd\u012b\u0146
  as ai Gu\u0146di otkon pi bazneickunga. Gu\u0146d\u00e1 s\u014dc p\u014dtorus. \u012at
  kai pa taukim. Atsaceibys tai n\u016bb\u00e4r\u00e1, kai pa n\u016btim.\\n\\nBazneickungs
  st\u014dj\u00e4s pi manim.\\n\\n\u2014 Voi tu izam\u014dcieji? \u2014 pavaic\u014dja
  bazneickungs.\\n\\nTai, t\u00e4tei\u021b, izam\u014dcieju drusku, sacieju as.\\n\\n\u2014
  K\u016b m\u016bki?\\n\u2014- \u00bbAs tycu\u00ab.\\n\u2014 Nu skaiti, \u2014 sac\u00e4ja
  bazneickungs.\\n\\nAs s\u014d\u010du. Da pus\u00e1i g\u014dja nu r\u016bkys, a tik
  n\u016bg\u014dja pi Pilata, kai soka golva gr\u012bzt\u012bs i p\u014dtori juk\u021b,
  tai vyss pagolam, kai caur z\u00e1mi kryta!\\n\\n\u2014 Ekur  Gu\u0146d\u00e1  j\u016bs  m\u014dc\u00e4s,  \u2014  raudzieju  as  p\u014drl\u012bcyn\u014d\u021b
  bazneickungu. \u2014 Jei m\u014dk p\u014dtorus.\\n\u2014 As jiusu navaru sarakst\u00e4\u021b,
  \u2014 otkon aizbr\u00e4c\u00e1 bazneickungs. \u2014 Kai tu sovus b\u0101rnus m\u014dceisi
  D\u012bvu lyug\u021b, kod pat\u0219 nam\u014dki p\u014dtoru?\\n\u2014 A ka Gu\u0146d\u00e1
  n\u016bmiertu, tod tovi b\u0101rni par pog\u014dnim augtu? \u2014 grei\u017ei pazavier\u0219
  iz manim, sac\u00e4ja bazneickungs. \u2014 Ejit iz s\u0101tu... Ka \u012bzam\u014dceisi
  p\u014dtorus, to sarakstei\u0161u.\\n\\nM\u00e1\u0219  aizg\u014djam  kotrs  iz  sovu  s\u0101tu,  n\u016bzarun\u014dju\u0161i  n\u014dku\u0161u
  cat\u016brtd\u012b\u0146 otkon \u012b\u021b iz bazneickungu.\\n\\nAs me\u0161u mol\u0101
  vysus dorbus i st\u014dj\u016bs pi p\u014dtorim. D\u012bn i nak\u021b pi gr\u014dmotys
  siedieju. Ac\u0219 aptymsa i golva s\u014dc\u00e1 gr\u012bzt\u012bs. Po\u0161u gryut\u016b
  dorbu lob\u014dk dareitu... M\u014dc\u016bs, divi d\u012bnys da cat\u016brtd\u012bn\u00e1i,
  a ai p\u014dtorim as ni nu v\u012btys. \u2014 K\u016b to dar\u00e4\u021b? \u2014
  d\u016bmoju sov\u0101 pr\u014dt\u0101.\u2014 Na jau ta ma\u0146 i palik\u021b \u014d\u017eu
  cilt\u012b, bez s\u012bvys?..\\n\\nMa\u0146 \u012bskr\u00e4ja pr\u014dt\u0101 \u013c\u016bti
  gudrs pad\u016bms: \u012b\u021b iz C\u014dlei\u0161u M\u014dru, kas dzeiv\u014dja,  eukur,  \u0160kaplern\u012bku  c\u012bm\u0101  i  lyug\u021b  j\u016b,  lai  izm\u014dca  mani
  p\u014dtorim.  C\u014dlei\u0161u  M\u014dra  tak  beja  terc\u00e1rka,  vysaid\u014ds  br\u014dlis\u021b\u014ds
  \u012braksteita, ai vysaidim \u0161kaplerim i ro\u017eoncom apk\u014drta, ai Ontona
  j\u016bsteni apj\u016bzta, bazneic\u0101 vi\u0146 i s\u00e4d\u00e4ja... Jei v\u00e4\u013c,
  p\u012bminit, tik p\u0101r\u0146 n\u016bmyra...  T\u016blaik  jai  beja  kaidu  \u010detradesmit  godu...  \u016atord\u012bn
  mikrie\u0161l\u00e1m mat\u016bt\u012bs, as ejmu iz \u0160kaplern\u012bkim. P\u012bejmu
  pi C\u014dlei\u0161u M\u014drys  ustobys,  raugu  \u2014  durovys  aizlyktys  ai  drongu.
  Paklaudzynoju. Iz\u012bt M\u014dra.\\n\\n\u2014 Kas t\u00e1 klaudzynoj? \u2014 vaicoj
  taid\u0101 d\u012bvi\u0161k\u0101 bols\u0101.\\n\\nM\u014dra atdar\u00e4ja durovys.\\n\\n\u2014
  As, M\u014dre\u0146, as... \u010camu Odums, \u2014 soku as lyudz\u016b\u0161\u0101
  bols\u0101. Ma\u0146 \u013c\u016bti lela darei\u0161ona.\\n\\n\u2014 Lai  b\u0233\u0219  pag\u016bdyn\u014dts,\u2014  \u012bg\u014dj\u0219  ustob\u0101  i  n\u016bjiem\u0219  capuri,
  sveicynoju as M\u014dru, gryb\u0101dams sevi izr\u014dd\u00e4\u021b par \u013c\u016bti
  d\u012bva-baileigu cylv\u0101ku.\\n\\nP\u012bj\u0101mus\u00e1 lobu-d\u012bnu, M\u014dra
  vaic\u014dja, ai kaidu darei\u0161onu as asu g\u014dj\u0219 pi j\u014ds.\\n\\n\u2014-
  Redzi,  M\u014dre\u0146, ai  D\u012bva  apzavier\u0161onu  as asmu  sad\u016bm\u014dj\u0219
  prec\u00e4t\u012bs.. Ai D\u012bva paleigu asmu saderiej\u0219 bryuti \u2014 Krauk\u013cu
  Gu\u0146di. A nav ma\u0146 D\u012bvs dev\u0219 sovys \u017eielesteibys \u2014 nam\u014dku
  p\u014dtoru... Atg\u014dju pi tev\u00e1, M\u014dre\u0146, lyug\u021b tova paleiga...
  izm\u014dci p\u014dtorus.\\n\u2014 Voi tu nu pr\u014dta n\u016bg\u014dj\u0219? \u2014
  aizkl\u012bdz\u00e1 M\u014dra. \u2014 Lai as puisi pi sev\u00e1 p\u012bjemu! K\u016b
  \u013caud\u0219 sac\u00e4s? As naasmu taida, kai cytys \u1e3faitys \u2014 ai pui\u0161im...
  Lai D\u012bvs sv\u0101ts gors mani pasorgoj!\\n\u2014 Ok, D\u014dvida d\u0101ls,
  apza\u017e\u0101loj! \u2014 pret obrozim krysteidam\u014ds vaiman\u014dja M\u014dra,
  \u2014 dz\u00e1\u0146 n\u016bst \u013caun\u016b goru! \u00bbPa vokorim staig\u014d\u0161u,
  nakt\u012b...\u00ab Voi as asmu pe\u013cniejus\u00e1 taidu k\u0101rdyn\u014d\u0161onu?
  O Jumprova, izpestej mani nu \u013caunys k\u0101rdyn\u014d\u0161onys... dz\u00e1\u0146
  j\u016b \u014dr\u0101.\\n\u2014 M\u014dre\u0146, niv\u012bns nazyn\u014d\u0219,
  \u2014 run\u014dju as lyugdam\u012bs. \u2014 As pa vokorim staig\u014d\u0161u, nakt\u012b...
  Tik izm\u014dci p\u014dtorus.\\n\u2014 M\u014dre\u0146, nadz\u00e1\u0146... as nik\u014d
  slykta, \u2014 iztraukts run\u014dju as. \u2014 Ma\u0146 tik p\u014dtori. Bez Gu\u0146dis
  veistu i geibstu. Bazneickungs naroksta. B\u0101rni, sok, pog\u014dni b\u0233\u0219...\\n\u2014
  O sv\u0101t\u012b apostoly! \u00bbB\u0101rni pog\u014dni b\u0233\u0219\u00ab. Kaidu
  nag\u016bdeibu i bezkauneibu jys runoj mun\u0101 ustob\u0101. N\u016bst \u00e1j!
  \u014cr\u0101! Ka tovys smokys mun\u0101 ustob\u0101 nab\u0233tu! \u00c1j iz cytom
  \u1e3faitom, palaid\u0146om. As naasu taida... O \u017eieleig\u014d Jumprova i D\u014dvida
  d\u0101ls, apza\u017e\u0101lojit, dzenit n\u016bst \u013caun\u016b goru, k\u0101rdyn\u014d\u0161onu.
  O sv\u0101t\u012bs gors, apgaismoj munu tyms\u016b pr\u014dtu!..\\n\\nAs  breineigi  n\u016bzabeidu  i  nap\u012bminu,  kai  izg\u014dju  nu  M\u014drys
  ustobys. Tai ma\u0146 p\u014dtori pagolam, kai caur z\u00e1mi kryta.\\n\\nAtg\u014dja
  cat\u016brtd\u012bn\u00e1. J\u014dbrauc iz bazneickungu. Atlik\u021b t\u014d\u013c\u014dk
  navar \u2014 gavien\u0219 vys\u0101 kl\u014dtu. D\u016bmoju, n\u016bves\u0161u as
  bazneickungam kaidu galis cysku i auzu pyuru. Varb\u0233\u021b jys meikst\u014dks
  palik\u0219.\\n\\nN\u016bbrauc\u00e1m ai Gu\u0146di iz bazneickungu. As \u012bst\u012bpu
  kukn\u012b galis cysku i auzu maisu.\\n\\n\u2014 Lyudzu, \u2014 soku as saimineicai,
  \u2014 dalicit bazneickungam ka tys nu \u010camu Oduma, kas gryb prec\u00e4t\u012bs
  ai Krauk\u013cu Gu\u0146di.\\n\\nSag\u014djam m\u00e1\u0219 ai Gu\u0146di pi bazneickunga.
  S\u014dka jys vaic\u014d\u021b, cik D\u012bvu, cik d\u0101lu, cik sv\u0101t\u016b
  goru... Ma\u0146 golv\u0101 skrytuli gr\u012b\u017e\u0101s i ac\u012bs tymss palyka.
  Nik\u014d navaru pasc\u00e4\u021b. Bazneickungs s\u014dka kl\u012bg\u021b. Gu\u0146d\u00e1
  n\u016bzakaun\u00e4ja, n\u016bsorka.\\n\\n\u2014 As, t\u00e4tei\u021b, t\u012b aizve\u017eu...
  saimineicai, \u2014 gribieju as p\u012blabyn\u014d\u021b bazneickungu i pazemeigi
  pabu\u010doju jam r\u016bku.\\n\u2014 K\u016b?  \u2014  aizakl\u012bdz\u00e1  bazneickungs.  \u2014  Tu  grybi  p\u014dtorus
  n\u016bpierk\u021b? \u00c1j \u014dr\u0101, ka vairs tovys k\u014djis t\u00e1 nab\u0233tu!\\n\\nJys
  izgryud\u00e1 mani \u014dr\u0101 i aizciert\u00e1 durovys. Pec man\u00e1 izg\u014dja
  i Gu\u0146d\u00e1, nik\u014d nasaceidama, pag\u014dja garum. As ari ni v\u014drda
  navarieju sac\u00e4\u021b: m\u00e4l\u00e1 nazagr\u012bz\u00e1 i kokl\u0101 taids
  kai komul\u0219 st\u014dv\u00e4ja... N\u016bsiediej\u0219 laiceni, as lai\u017e\u016bs
  iz sovu s\u0101tu.\\n\\n\u2014 Tai m\u00e1\u0219 iza\u0161keirom ai Gu\u0146di,
  \u2014 gryu\u0161i n\u016bzapyut\u012bs, beidz\u00e1 Odums  sovu  gar\u016b  st\u014dstu.  \u2014  As  p\u014dtoru  naizam\u014dcieju  i  vairs
  nad\u016bm\u014dju par precei\u0161on\u016bs. Gu\u0146d\u00e1 gon izg\u014dja pi
  veira. A as palyku jumpraveib\u0101 i da \u0161ai d\u012bnai dzeivoju kai r\u016bzeit\u00e1
  z\u012bdeidams.\\n\\nSazalasieju\u0161\u012b  gosti  sm\u00e4j\u00e4s  nu  Oduma,  v\u012bns  par  \u016btru
  ospr\u014dteig\u014dk gryb\u0101dami aiz\u010d\u00e1r\u021b vac\u016b puisi.\\n\\n\u2014
  A jiu\u0219, jauni pui\u0161i i \u1e3faitys, \u2014 sauc\u00e1 Odums, vysus apved\u0219
  ai acim, \u2014 ka gribit n\u016bst\u014d\u021b iz de\u010da pret oltori \u2014
  tod m\u014dcit\u00e4s p\u014dtorus. Cytaidi \u2014 vyss pagolam, kai caur z\u00e1mi
  kryta. As t\u016b jau labi zynu.\\n\\nPa t\u016b laiku sag\u014dja muzykanti. S\u014dc\u00e4s
  da\u0146\u010di.\\n\\nOdums ari krat\u00e4j\u00e4s pa cytu donc\u014dt\u014dju storpu,
  kai jauns puis\u0219, bet nu vysom pu\u0219om jaun\u014dk\u012b j\u016b bad\u00e4ja
  ai p\u014dtorim i nalaimeigu m\u012blesteibu.\\n\\nLaim\u00e1 par laimi\\n\\nZ\u012bmyssv\u0101tku
  st\u014dsten\u0161\\n\\nTys beja k\u016b\u010du d\u012bn\u0101.\\n\\n\u0160udi\u0146
  jau nu po\u0161a reita slym\u012bs nik\u014d na\u0101d i tik k\u016b atbi\u013c\u1e11
  m\u014dt\u00e1i i t\u0101vam.\\n\\nSkudru Juram m\u014dj\u014ds lela nalaim\u00e1.
  Nedeli atpaka\u013c saslyma Jura v\u012bneig\u012bs dielen\u0161, kuram beja 5 godi.
  Jur\u0219 vod\u014dja i fe\u013cd\u0161eri, staig\u014dja ari pi \u00bble\u010darkorm\u00ab,
  a nikas naleidz\u00e4ja. Dielen\u0161 ar kotru d\u012bnu palyka v\u014dj\u014dks.\\n\\nZaudieju\u0161i  cereibu  gl\u014db\u021b  b\u0101rnu  ar  fe\u013cd\u0161eru  i  \u00bble\u010darku\u00ab
  paleidzeibu, Skudru t\u0101vs ar m\u014dti n\u016bspr\u012bd\u00e1 brauk\u021b iz
  m\u012bstu pec \u00bblel\u014d\u00ab doktora.\\n\\n\u2014 D\u014drgs jau ir tys
  doktor\u0219,\u2014 ba\u017e\u014dj\u00e4s m\u014dt\u00e1, \u2014 kas zyna, voi
  i tys paleidz\u00e4s...\\n\u2014 Lai  kaut  voi  vysu  montu  b\u0233tu  j\u014datd\u016bd,  nab\u0233tu  \u017e\u0101l,  \u2014
  n\u016bsp\u012bst\u0101, bet n\u016bteikt\u0101 bols\u0101 atsac\u00e4ja t\u0101vs.
  \u2014 Ka tik gl\u014db\u021b dieleni nu n\u014dvis.\\n\\nSkudra nabeja nu bogotim
  saimin\u012bkim. Nu v\u012bnys tre\u0161\u014ds dalis \u00bbu\u010dastkys\u00ab
  navar\u00e4ja d\u012bszyn kai \u012bzadzeiv\u014d\u021b. T\u014d de\u013c ari j\u014d
  zyrgs l\u0101nim s\u016blim rik\u0161\u014dja, jo auze\u0146u jam moz tyka r\u00e1dz\u00e4\u021b.\\n\\nDrei\u017ei
  pec br\u016bkast\u0219 Jur\u0219 aizjiudz\u00e1 zyrgu i laid\u00e4s iz m\u012bsteni.
  M\u012bsten\u0161 beja ap 30 verstu t\u014dlum\u0101.\\n\\nM\u012bsten\u012b  Skudra  tyka  jau  pec  pu\u0219d\u012bnys.  T\u00e1  otkon  nalaim\u00e1.
  Doktoru tik k\u016b aizvadu\u0161i iz kaidu slym\u016b, i d\u012bzgon t\u014dli.\\n\\n\u2014
  N\u016bgaidei\u0161u. Varb\u0233\u021b drei\u017ei atbrauk\u0219, \u2014 spr\u012bd\u00e1
  Skudra.\\n\\nJau  m\u00e1t\u00e4s  mikrieslis.  Doktor\u0219  vys  naatsagr\u012bz\u00e1  atpaka\u013c.
  Izzyn\u014dj\u0219, ka tys Z\u012bmyssv\u0101tku nakt\u012b nabrauk\u0219, Jur\u0219
  n\u016bk\u014dr\u00e1 golvu i nazyn\u014dja, k\u016b dar\u00e4\u021b.\\n\\n\u2014
  D\u012bva val\u00e1,\u2014 d\u016bm\u014dja jys,\u2014 brauk\u0161u iz m\u014djom.
  Lob\u014dk reit v\u00e4\u013c atbrauk\u0161u.\\n\\nBraukdams atpaka\u013c, Jur\u0219
  ap dieleni vi\u0146 d\u016bm\u014dja.\\n\\n\u2014 Ka tik nab\u0233tu n\u016bmir\u0219...
  i as j\u014d naredzieju p\u0101dej\u0101 breid\u012b, \u2014 nap\u014drvarami gryuta
  d\u016bma grauz\u00e1 t\u0101va sirdi.\\n\u2014 D\u012bvs, D\u012bvs! K\u016b tik
  sp\u0101tu, vysu dareitu, lai gl\u014dbtu nu n\u014dvis sovu b\u0101rnu!\\n\\nCel\u00e4
  Juram pavysam satymsa. C\u00e4l\u00e4s oss viej\u0219 nu reitu pusis. Soltums \u010d\u00e4r\u00e4s
  pi daguna gola, j\u014d byudi i aus\u0219 beja n\u016bsl\u0101pti ka\u017euka apakl\u012b.  Dabasi  g\u012bdr\u00e4j\u00e4s  i  v\u012bna  pec  \u016btrys  zvaigzneitis  pu\u0161k\u014dja
  dabasus. \u0100ri  mienesn\u012bks  nu  aiz  m\u014dkulim s\u014dka  r\u014dd\u00e4\u021b  sovu  b\u014dl\u016b
  vaigu.\\n\\nPa cel\u00e1 molu palyka ustobys. Sp\u016bdra gunten\u00e1 tym\u014ds
  speid\u00e4ja. Klusums. Da\u017e\u0101 ustob\u0101 caur l\u016bgu r\u00e1dz\u00e4j\u00e4s
  aplykts ai s\u012bnu i ar pologu apkl\u014dts golds.\\n\\n\u2014 Kaids m\u012brs,
  kaidi jauki dabasi! \u2014 n\u016bzapyusdams d\u016bm\u014dja Jur\u0219. \u2014
  \u013baud\u0219 sateik sv\u0101tkus... dabasi pr\u012bcoj\u0101s... A mun\u0101
  sird\u012b nav m\u012br\u0101...\\n\\nGryutu d\u016bmu kom\u014dts, Jur\u0219 napaman\u00e4ja,
  kai \u012bbrauc\u00e1 me\u017een\u012b, kas beja kaidu 8 verstu t\u014dlum\u0101
  nu j\u014d m\u014djis. K\u016bku viersyunis l\u016bc\u00e4j\u00e4s i \u0161a\u013cc\u00e1,  it  kai  klaneidam\u014ds  i  dz\u012bd\u014ddamys  skaistij\u012bm  dabasim,
  zvaigz\u0146om, miene\u0161am. Zyrgs p\u016brk\u0161\u00e1 i, m\u014dju tyvumu sajusdams,
  skubyn\u014dja s\u016b\u013cus.\\n\\nT\u00e1 iz\u0157aizis, sab\u016bz\u0219 aus\u0219,
  sv\u012bd\u00e4s nu cel\u00e1 mol\u0101. Jur\u0219 skot\u014ds \u2014 gu\u013c cel\u00e1
  mol\u0101 kaut kas pal\u0101ks.\\n\\n\u2014 Kas tys ir? \u2014 n\u016bturiej\u0219
  zyrgu, Jur\u0219 vaicoj s\u00e1v i skot\u014ds atpaka\u013c. \u2014 Cylv\u0101ks
  gu\u013c, \u2014 \u012bzaskatiej\u012bs jys aizkl\u012bdz\u00e1.\\n\\nSkudra  izk\u014dp\u00e1  nu  komonom,  p\u012bg\u014dja  kl\u014dt,  p\u012bzal\u012bc\u00e1  i  r\u00e1\u1e11z:
  \u1e3faitin\u00e1 ap 12 godu vaca gu\u013c k\u0146up\u0161i sn\u012bg\u0101. Jei
  sazar\u014dvus\u00e1, r\u016bce\u0146\u014ds sam\u012bgus\u00e1 dr\u00e4bei\u0161u
  muskuli i tik k\u016b pyu\u0161. Jur\u0219 j\u016b pac\u00e4l\u00e1, s\u014dka vaic\u014d\u021b,
  kas tei ir. A \u1e3faitin\u00e1 izrun\u014dja kaidus nasapr\u016btamus murgu v\u014drdus
  i n\u016bkryta. Apskatiej\u0219 Skudra n\u016bspr\u012bd\u00e1, ka tei ir sasolus\u00e1.\\n\\nSkudra
  paj\u00e4m\u00e1 \u1e3faitini, n\u016bgu\u013cd\u00e4ja komon\u014ds, patryna ai
  sn\u012bgu jai byude\u0146us, dagunteni i r\u016bkys. K\u014djis \u1e3faitin\u00e1i
  beja autys veizei\u021b\u014ds. Jys n\u016bova tai k\u014djis, n\u016btryna t\u014ds
  ai sn\u012bgu i, n\u016bvi\u013cc\u0219 sovu ka\u017euku, satyna tym\u0101 \u1e3faitini,
  pat\u0219 palyka v\u012bn\u0101 sveit\u0101 i, lai b\u0233tu sylt\u014dk, ap placim
  s\u00e1v aplyka komonu de\u010di.\\n\\n\u2014 Gl\u014db\u0161u j\u016b, \u2014 n\u016bd\u016bm\u014dja
  Jur\u0219, \u2014 varb\u0233\u021b D\u012bvs i ma\u0146 paleidz\u00e4s, munu dieleni
  gl\u014db\u0219...\\n\u2014 As styprs, pac\u012bs\u0161u gon da s\u0101tys soltumu,\u2014
  ai gondariejumu d\u016bm\u014dja Jur\u0219, i m\u014djis nav tik t\u014dli \u2014
  kaidys 5 verstys palyka.\\n\\nSkudra laid\u00e4s brauk\u021b, v\u012bnm\u0101r ai
  p\u014dtogu zyrgam atg\u014ddyn\u014ddams, ka brauciejam t\u016bm\u0101r stypri
  solts i ka j\u014dsteidz iz m\u014djom. A sird\u012b Juram aizadaga taida kai  gunten\u00e1
  i  rod\u014ds cereiba, ka j\u014d dorg\u012bs dielen\u0161  s\u014dc  jau  lob\u014dt\u012bs  i  b\u0233\u0219  vasals,  taipa\u021b  kai  palyka  dzeiva
  nalaimeig\u014d \u1e3faitin\u00e1.\\n\\nNadab\u014dju doktora,\u2014 teic\u00e1
  s\u012bvai Jur\u0219. Varb\u0233\u021b jau taida D\u012bva val\u00e1... Bet atve\u017eu
  \u1e3faitini. As j\u016b atrodu me\u017e\u0101, cel\u00e1 mol\u0101, sasolu\u0161u...
  atve\u017eu j\u016b, izgl\u014dbu nu nalaimis \u2014 varb\u0233\u021b D\u012bvs
  mums paleidz\u00e4s...\\n\\nJau beja v\u0101la nakt\u0219, kod Skudra \u012bbrauc\u00e1
  sov\u0101 pogolm\u0101. Jys ryupeigi paj\u00e4m\u00e1 \u1e3faitini i \u012bnes\u00e1
  ustob\u0101.\\n\\nSkudra apvaic\u014dja, kai sevi juta slym\u012bs, i pec tam, kod
  izdzierd\u00e1, ka dielen\u0161 m\u012breigi gu\u013c\u016bt, past\u014dst\u00e4ja
  s\u012bvai, par k\u016b doktora nadab\u014dja, kur \u1e3faitini atroda, kai t\u016b
  atv\u00e1d\u00e1...\\n\\nVeirs ar s\u012bvu sasi\u013cd\u00e4ja \u1e3faitini. Tei
  pamozam s\u014dka atspierg\u021b\\n\\nD\u016bm\u014dju, \u2014 teic\u00e1 Jur\u0219,
  \u2014 izgl\u014db\u0161u nalaimeig\u016b nu n\u014dvis. Jo par lobim dorbim \u2014
  loba ari atmoksa.\\n\\nPec kaida laika Jur\u0219 ai s\u012bvu s\u00e4d\u00e4ja pi
  golda. \u1e3eaitin\u00e1 s\u00e4d\u00e4ja t\u012bm preteim \u2014 laimeiga, pr\u012bceiga,
  bet kauneiga i nadr\u016bsa. Nu zam bolt\u014d pologa smar\u017e\u014dja pateikama
  s\u012bna smar\u017ea. M\u014dt\u00e1 n\u016bskait\u00e4ja lyug\u0161onu, padal\u00e4ja  \u00bbaplatkys\u00ab,  n\u016blyka  iz  \u0161keivei\u0161a  slym\u014d  daleni  i  m\u012bl\u014dja
  nagaideit\u016b v\u012b\u0161ni ai k\u016b\u010du ma\u013cteiti.\\n\\nSlym\u012bs
  dielen\u0161 gul\u00e4ja m\u012breigi, navaid\u00e4ja i nazasvaid\u00e4ja.\\n\\n\u2014
  Kai ta ai tevi tai n\u016btyka? \u2014 vaic\u014dja nu \u1e3faitinis m\u014dt\u00e1.
  \u2014 Kur tu v\u012bna \u012bdama pa me\u017eu nakt\u0219 vyd\u0101?\\n\u2014 Mani
  padzyna saimin\u012bks, \u2014 aplaidus\u00e1 actenis, teic\u0219 \u1e3faitin\u00e1.
  \u2014 As dzeiv\u014dju par gani. \u0160\u016breit saimin\u012bks soka: \u00bbT\u00e1v
  nav k\u014d pi mums dar\u00e4\u021b \u2014 maizi vi\u0146 par ve\u013cti iessi da
  pavasara. \u00c1j pace\u013cu.\u00ab As salasieju sovys  dr\u00e4beitis,  sasieju  muskul\u012b  i  lai\u017e\u016bs.  Lyud\u017eu  nu  saimin\u012bka
  maizis cel\u00e1m, bet nad\u00e1v\u00e1. As g\u014dju nu solys iz solu, makl\u0101dama
  jauna saimin\u012bka. Niv\u012bns nagryb jim\u021b. Izdzier\u017eu, ka pi bazneickunga
  vajdzeiga kolpyun\u00e1. \u012ag\u014dju kukn\u012b, lyud\u017e\u016bs, a saimineica
  soka: \u00bbNav mums  \u0161udi\u0146  laika.  Sv\u0101tk\u016bs  bazneickungam  v\u012bsi  sabrauk\u0219  \u2014
  j\u014dgatavoj ied\u012bni... \u00c1j pr\u016bjom. Taidu montu v\u012bnm\u0101r
  atrassim.\u00ab G\u014dju t\u014d\u013c\u014dk.  V\u012bns  cylv\u0101ks  cel\u00e4  sac\u00e4ja,  ka,  me\u017eam  nap\u012bej\u016bt,  v\u012bnam
  saimin\u012bkam vajdzeiga gan\u00e1. \u012ag\u014dju t\u012b jau zam po\u0161a vokora.
  Vaic\u014dju nu saimin\u012bka,  a  tys  atbi\u013c\u1e11:  \u00bbIz  sv\u0101tkim  maizis  \u0101d\u014dju  navajag.  Kod
  vajdz\u00e4s  ganis,  pat\u0219  atras\u0161u.\u00ab  S\u014dku  lyugt\u012bs  iz  nakt\u0219  m\u014djom,  a
  nap\u012bj\u00e4m\u00e1. \u00bbK\u016b ta,\u2014 soka, \u2014 m\u00e1\u0219 t\u00e1
  sv\u0101tku nakt\u012b ai sve\u0161u cylv\u0101ku lai vozojam\u012bs...\u00ab Tod
  raud\u014ddama lai\u017e\u016bs t\u014d\u013c\u014dk, kur ac\u0219 r\u00e1\u1e11z.
  \u012ag\u014dju me\u017e\u0101, g\u014dju, g\u014dju. \u00c4s\u021b grib\u00e4j\u00e4s.
  Palyka \u013c\u016bti gryuti. Cik na sp\u00e1\u0157 s\u016bli, vys iz v\u012btys.
  Apsyta korstums, palyka slykti, taidys kai guntenis ac\u012bs soka mirdz\u00e4\u021b
  i p\u00e4\u010d\u014dk... as nazynu, kai tys beja... \u012ag\u014dju taid\u0101
  skaist\u0101 bolt\u0101 m\u014dj\u012b, kai bazneic\u0101. T\u012b \u013c\u016bti
  sylts. As atsagulu meikst\u0101, bolt\u0101 gult\u0101. Ma\u0146  apleik  apst\u014dja  skaisti  e\u0146gelei\u0161i,  dz\u012bd\u014dja,  stost\u00e4ja,  ka  \u0161udi\u0146
  d\u012bven\u0161 dzymst, lai ap\u017e\u0101l\u014dtu nabog\u016bs i nalaimeig\u016bs.
  n\u016bslauceitu j\u012bm osorys,  paleidz\u0101tu...  D\u00e1v\u00e1  ma\u0146  \u00e4s\u021b  kaut  k\u016b  taidu  gordu,  kai
  cukorkys. Tod e\u0146geleit\u0219 mani pabu\u010d\u014dja, appl\u00e4t\u00e1 ai
  sp\u014drnim, i as aizmygu.\u00ab\\n\\n\u1e3eaitin\u00e1  n\u016bzapyut\u00e1,  pac\u00e4l\u00e1  iz  obrozim  actenis,  it  kai  t\u012b
  makl\u0101dama e\u0146gelei\u0161us.\\n\\n\u2014 M\u014dt\u00e1 i t\u0101vs n\u016bmyra,
  \u2014 n\u016bspist\u0101 ba\u013csten\u012b atbi\u013cd\u00e4ja \u1e3faitin\u00e1.
  \u2014 M\u00e1\u0219  bejom  biegli.  Pam\u00e1t\u00e1m  vysu  i  b\u0101gom.  P\u0101r\u0146  j\u012b  saslyma  i
  n\u016bmyra. As palyku v\u012bna po\u0161a, staig\u014ddama pa pasauli...\\n\u2014
  A kur tovi t\u0101vs ai m\u014dti voi radin\u012bki? \u2014 ai satr\u012bktu sirdi
  vaic\u014dja m\u014dt\u00e1.\\n\\n\u1e3eaitin\u00e1 aizraud\u014dja. M\u014dt\u00e1i
  ari p\u012bplyud\u00e1 ac\u012bs osorys i kai pupys n\u016bbyra pa byudim.\\n\\nSlym\u012bs
  dielen\u0161 pazam\u016bda, pazagr\u012bz\u00e1 iz s\u014dna. M\u014dt\u00e1 ryupeigi
  j\u016b apvaic\u014dja, voi lob\u014dk ir, voi nagryb k\u016b ap\u00e4s\u021b.\\n\\nDielen\u0161  juta  sevi  lob\u014dk.  Jys  ap\u00e4d\u00e1  \u00bbaplatkys\u00ab  gabaleni,
  paraudz\u00e4ja peir\u0101ga i s\u014dc\u00e1 run\u014d\u021b.\\n\\nJuram palyka
  v\u012bgl\u014dk iz sird\u0219. Jys pabu\u010d\u014dja slym\u016b i s\u014dka jam
  st\u014dst\u00e4\u021b:\\n\\n\u2014 \u0160\u016bnak\u021b  D\u012bven\u0161  at\u012b\u0219.  As  jam  iztaisieju  nu  \u00bbaplatkom\u00ab
  \u0161yupeleiti,  pak\u014dru  iz  golda.  T\u012b  D\u012bven\u0161  \u0161yup\u014ds\u012bs.  D\u012bven\u0161  t\u00e1v  d\u016b\u0219
  veseleibu, paliksi vasals, kaveis\u012bs, lobus dorbus dareisi...\\n\u2014 Palik\u0161u
  vasals, kavei\u0161\u016bs, lobus dorbus darei\u0161u...\\n\\nDielen\u0161 skat\u00e4j\u00e4s
  sp\u016bdrom acte\u0146om iz \u0161yupeleiti i klusu t\u0101vam atbi\u013cd\u00e4ja:\\n\\nGar\u012bs
  i solt\u0233\u0219 ce\u013c\u0161 dzyna Juri gul\u0101tu.\\n\\n\u2014 \u00c1j, \u1e3faiti\u0146,
  gu\u013cst\u012bs pi m\u014dtis i pali\u00e7 mums par \u1e3faitu iz vysu myu\u017eu,\u2014
  \u012bdams gul\u0101tu, sac\u00e4ja v\u012b\u0161n\u00e1i Jur\u0219. \u2014 As izgl\u014dbu
  tevi \u2014 D\u012bvs lai sorgoj munu dieleni...\\n\\nSkudru saimeit\u00e1 aizmyga.
  \u1e3eaitinis vaig\u0101 speid\u00e4ja pr\u012bca i laim\u00e1, it kai jei b\u0233tu
  atrodus\u00e1 sovu t\u0101vu i m\u014dti, sovu syltu kakteni i meikstu v\u012bte\u0146u.\\n\\nJuram
  ai s\u012bvu ari nabeja vairs skumu i b\u0101du: j\u016bs dielen\u0161 s\u014dka
  lob\u014dt\u012bs.\\n\\nLaim\u00e1 \u2014 par laimi!\"", "\"21. va\u013csts atkluotuos
  latgal\u012b\u0161u rokstu vol\u016bdys i kulturviesturis olimpiadis rezultati\"",
  "\"Latvejis Satversmis Sapu\u013ccis\\n\\n1922. goda 15. februara k\u016bps\u0113d\u0113
  p\u012bjimtuo\\n\\nLatvejis Republikys\\n\\nSatversme\\n\\n-  -    \\n\\n  \\n\\n
  - -  \\n\\n-  -   \\n\\n \\n\\n  -   \\n\\n  \\n\\n(22.07.2014.\\n\\nLatvejis tauta
  sov\u0101 breivi v\u0101l\u0101t\u0101 Satversmis sapu\u013cc\u0113 ir n\u016bl\u0101muse
  sev itaidu va\u013csts Satversmi:\\n\\nI n\u016bda\u013ca. Vyspuorej\u012b n\u016bsacejumi\\n\\n1.
  Latveja ir naatkareiga demokratiska republika.\\n2. Latvejis va\u013csts suverenuo
  vara p\u012bdar Latvejis tautai.\\n3. Latvejis va\u013csts teritoreju storptautysk\u016bs
  leigum\u016bs n\u016bsaceit\u016bs r\u016bbe\u017e\u016bs sastota Vydzeme, Latgola,
  K\u016brzeme i Zemgale.\\n\\n4.\\n\\nVa\u013csts vol\u016bda Latvejis Republik\u0101
  ir latv\u012b\u0161u vol\u016bda. Latvejis kar\u016bgs ir sorkons ar boltu streipi.\\n\\n(15.10.1998.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 06.11.1998.)\\n\\nII n\u016bda\u013ca.\\n\\nSaeima\\n\\n5.\\n\\nSaeima
  sastuov nu symta tautys pr\u012b\u0161kstuovu.\\n\\n6.\\n\\nSaeimu \u012bvielej
  vyspuoreiguos, v\u012bnleidzeiguos, tei\u0161uos, aizkluotuos i proporcionaluos
  vielie\u0161onuos.\\n\\n7.\\n\\nSadol\u016bt Latveju atsevi\u0161k\u016bs vielie\u0161onu
  apgobol\u016bs, Saeimys deputatu skaits, kurs \u012bvielejams kotr\u0101 vielie\u0161onu
  apgobol\u0101, n\u016bsokoms proporcionali kotra apgobola v\u0101l\u0101tuoju skaitam.\\n\\n8.\\n\\nT\u012bseibys
  v\u0113l\u0113t ir pylnt\u012bseigim Latvejis pi\u013cs\u016bnim, kuri vielie\u0161onu
  d\u012bn\u0101 ir sasn\u0101gu\u0161i osto\u0146padsmit godu vacumu.\\n\\n(27.01.1994.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 26.02.1994.)\\n\\n9.\\n\\nSaeim\u0101
  var \u012bviel\u0113t kotru pylnt\u012bseigu Latvejis pi\u013cs\u016bni, kurs vielie\u0161onu
  pyrmaj\u0101 d\u012bn\u0101 ir vacuoks par divdesmit v\u012bnu godu.\\n\\n10.\\n\\nSaeimu
  \u012bvielej iz \u010detru godu.\\n\\n(04.12.1997. lykuma redakcej\u0101, kas stuoj\u0101s
  sp\u0101k\u0101 31.12.1997.)\\n\\n11.\\n\\nSaeimys vielie\u0161onys izdoromys oktobra
  miene\u0161a pyrmaj\u0101 sastd\u012bn\u0113.\\n\\n(04.12.1997. lykuma redakcej\u0101,
  kas stuoj\u0101s sp\u0101k\u0101 31.12.1997.)\\n\\n12.\\n\\nNu jauna \u012bv\u0101l\u0101tuo
  Saeima sa\u012bt iz pyrm\u016b s\u0113di novembra miene\u0161a pyrmaj\u0101 \u016btard\u012bn\u0113,
  kod ari izabeidz \u012bpr\u012bk\u0161ejuos Saeimys pylnvarys.\\n\\n13.\\n\\nKa
  Saeimys vielie\u0161onys Saeimys atlais\u0161onys gad\u012b\u0146\u016bs n\u016bteik
  cyt\u0101 goda laik\u0101, tod itaida Saeima sa\u012bt na v\u0101luok kai v\u012bnu
  mienesi piec juos \u012bvielie\u0161onys i juos pylnvarys izabeidz piec treju godu
  jauna novembra miene\u0161a pyrmaj\u0101 \u016btard\u012bn\u0113 ar nu jauna \u012bv\u0101l\u0101tuos
  Saeimys sa\u012b\u0161onu.\\n\\n(04.12.1997. lykuma redakcej\u0101, kas stuoj\u0101s
  sp\u0101k\u0101 31.12.1997.)\\n\\n14.\\n\\nNa mozuok kai v\u012bnai dasmytai da\u013cai
  v\u0101l\u0101tuoju ir t\u012bseiba \u012br\u016bsynuot tautys n\u016bbolsuo\u0161onu
  par Saeimys atsauk\u0161onu. Ka tautys n\u016bbolsuo\u0161on\u0101 par Saeimys atsauk\u0161onu
  n\u016bbolsoj vairuokums nu bolsuotuoju i vysmoz divejis tre\u0161dalis nu p\u0101dejuos
  Saeimys vielie\u0161onuos p\u012bsadaleju\u0161u v\u0101l\u0101tuoju skaita, tod
  Saeima skaitoma par atsauktu. T\u012bseibu \u012br\u016bsynuot tautys n\u016bbolsuo\u0161onu
  par Saeimys atsauk\u0161onu navar izmontuot godu piec Saeimys sa\u012b\u0161onys,
  godu pyrms Saeimys pylnvaru beigu, Va\u013csts Prezidenta pylnvaru p\u0101dej\u016bs
  se\u0161u miene\u0161u laik\u0101, kai ari agruok par se\u0161im miene\u0161im piec
  \u012bpr\u012bk\u0161ejuos tautys n\u016bbolsuo\u0161onys par Saeimys atsauk\u0161onu.\\n\\nV\u0101l\u0101tuoji
  navar atsaukt atsevi\u0161ku Saeimys l\u016bcek\u013cu.\\n\\n(08.04.2009. lykuma
  redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 02.11.2010.)\\n\\n15.\\n\\nSaeima
  sovys s\u0113dis n\u016btur Reig\u0101 i tikai uorkuorteigu apstuok\u013cu de\u013c
  jei var sa\u012bt cyt\u0101 v\u012bt\u0101.\\n\\n16.\\n\\nSaeima \u012bvielej sovu
  prezideju, kurs sastuov nu pr\u012b\u0161ks\u0101d\u0101tuoja, juo diveju b\u012bdru
  i sekretaru. Saeimys prezidejs dorboj\u0101s napuortraukti vysu Saeimys pylnvaru
  laiku.\\n\\nNu jauna \u012bv\u0101l\u0101tuos Saeimys pyrm\u016b s\u0113di atkluoj
  \u012bpr\u012bk\u0161ejuos Saeimys pr\u012b\u0161ks\u0101d\u0101tuojs voi prezideja
  aizdavum\u0101 cyts prezideja l\u016bceklis.\\n\\n18.\\n\\nSaeima po\u0161a puorbauda
  sovu l\u016bcek\u013cu pylnvarys.\\n\\nSaeimys l\u016bcek\u013ca pylnvarys sajam
  Saeim\u0101 \u012bv\u0101l\u0101ta persona, ka jei Saeimys s\u0113d\u0113 d\u016bd
  itaidu svineigu s\u016blejumu:\\n\\n\\\"Es, apsajam\u016bt Saeimys deputata omota
  p\u012bnuokumus, Latvejis tautys pr\u012b\u0161k\u0101 zviereju (svineigi s\u016blu)
  byut uzticeigs Latvejai, styprynuot juos suverenitati i latv\u012b\u0161u vol\u016bdu
  kai v\u012bneig\u016b va\u013csts vol\u016bdu, aizstuov\u0113t Latveju kai naatkareigu
  i demokratisku va\u013csti, sovus p\u012bnuokumus pi\u013cdeit g\u016bdpruoteigi
  i piec lobuokuos apzinis. Es apsajamu \u012bv\u0101ruot Latvejis Satversmi i lykumus.\\\"
  (30.04.2002. lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 05.11.2002.)\\n\\n19.\\n\\nSaeimys
  prezidejs sasauc Saeimys sesejis i n\u016bsoka kuortejuos voi uorkuortejuos s\u0113dis.\\n\\n20.\\n\\nSaeimys
  prezidejam ir juosasauc Saeimys s\u0113de, ka tuo prosa Va\u013csts Prezidents,
  ministru prezidents voi na mozuok kai v\u012bna tre\u0161uo da\u013ca Saeimys l\u016bcek\u013cu.\\n\\n21.\\n\\n\u012ak\u0161ejuos
  darbeibys i kuorteibys n\u016bsacei\u0161onai Saeima izstruodoj sev kuorteibys rulli.
  Saeimys dorba vol\u016bda ir latv\u012b\u0161u vol\u016bda.\\n\\n(30.04.2002. lykuma
  redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 24.05.2002.)\\n\\n22.\\n\\nSaeimys
  s\u0113dis ir atkluotys. Desmit Saeimys l\u016bceklim, Va\u013csts Prezidentam,
  ministru prezidentam voi ministram p\u012bpros\u016bt, Saeima ar na mozuok kai diveju
  tre\u0161da\u013cu kluot as\u016b\u0161\u016bs deputatu bolsu vairuokumu var n\u016blemt
  n\u016btur\u0113t aizkluotu s\u0113di.\\n\\n23.\\n\\nSaeimys s\u0113dis var n\u016btikt,
  ka jimuos p\u012bsadola vysmoz puse Saeimys l\u016bcek\u013cu.\\n\\n24.\\n\\nSaeima,
  izjam\u016bt Satversm\u0113 sevi\u0161ki paradz\u0101t\u016bs gad\u012b\u0146us,
  p\u012bjam sovus l\u0101mumus ar kluot as\u016b\u0161\u016bs deputatu absolut\u016b
  bolsu vairuokumu.\\n\\n25.\\n\\nSaeima izvielej komisejis, n\u016bsok\u016bt j\u016bs
  l\u016bcek\u013cu skaitu i aizda vumus. Komisejom ir t\u012bseiba p\u012bpraseit
  sovai darbeibai vajadzeiguos zinis i paskaidruojumus nu atsevi\u0161ku ministru
  i po\u0161va\u013cdeibys \u012bstuo\u017eu, kai ari p\u012baicynuot sovuos s\u0113d\u0113s
  d\u016bt paskaid ruojumus att\u012bceig\u016bs ministreju i po\u0161va\u013cdeibys
  \u012bstuo\u017eu atbi\u013cdeig\u016bs pr\u012b\u0161kstuovus. Komisejis var dorbuot\u012bs
  ari storp sesejom. 26.\\n\\nSaeimai juo\u012bce\u013c n\u016bsaceitim gad\u012bnim
  parlamentariskuos izmeklie\u0161onys komisejis, ka tuo p\u012bprosa na mozuok kai
  v\u012bna tre\u0161uo da\u013ca Saeimys l\u016bcek\u013cu.\\n\\n27.\\n\\nSaeimai
  ir t\u012bseiba \u012bsn\u0113gt ministru prezidentam voi atsevi\u0161kam ministram
  p\u012bprasejumus i vaicuojumus, iz kuru ir juoatbi\u013cd jim voi j\u016bs pylnvaruotai
  atbi\u013cdeigai va\u013csts omota personai. Ministru prezidentam voi ministram
  iz Saeimys voi juos komisejis p\u012bprasejuma juoce\u013c jom pr\u012b\u0161k\u0101
  att\u012bceigi dokumenti i aktis. 28.\\n\\nSaeimys l\u016bcek\u013ca ni par bolsuo\u0161onu,
  ni par pyld\u016bt omotu izsaceitom d\u016bmom navar saukt pi atbi\u013cdeibys ni
  t\u012bsys, ni administrativ\u0101, ni disciplinar\u0101 ce\u013c\u0101. Saeimys
  l\u016bcekli var saukt pi t\u012bsys atbi\u013cdeibys, ka jis, ko\u010d i omotu
  pyld\u016bt, izplota: 1) g\u016bdu aizskar\u016b\u0161ys zinis, zynuodams, ka juos
  napat\u012bsys, voi 2) g\u016bdu aizskar\u016b\u0161ys zinis par privatu voi saimis
  dzeivi.\\n\\nSaeimys l\u016bcek\u013ca navar apc\u012btynuot, izdareit pi juo kratei\u0161onys,
  ni cytaidi apr\u016bbe\u017euot juo personys breiveibu, ka tam nap\u012bkreit Saeima.
  Saeimys l\u016bcekli var apc\u012btynuot, ka j\u016b n\u016bgiun pi po\u0161a n\u016bz\u012bguma
  pastruoduo\u0161onys. Par kotru Saeimys l\u016bcek\u013ca apc\u012btynuo \u0161onu
  divdesmit \u010detru stu\u0146\u017eu laik\u0101 juopazi\u0146oj Saeimys prezidejam,
  kurs t\u016b ce\u013c pr\u012b\u0161k\u0101 jaun\u0101 Saeimys s\u0113d\u0113 izlem\u0161onai
  par Saeimys l\u016bcek\u013ca paturie\u0161onu apc\u012btynuojum\u0101 voi par juo
  atbreivuo\u0161onu. Laik\u0101 storp sesejom, leidz sesejis atkluo\u0161onai, par
  Saeimys l\u016bcek\u013ca paturie\u0161onu apc\u012btynuojum\u0101 lem Saeimys prezidejs.\\n\\n30.\\n\\nPret
  Saeimys l\u016bcekli navar \u012bsuokt kriminalvojuo\u0161onys voi izlikt jam administrativu
  struopi bez Saeimys p\u012bkris\u0161onys.\\n\\n(04.12.1997. lykuma redakcej\u0101,
  kas stuoj\u0101s sp\u0101k\u0101 31.12.1997.)\\n\\n31.\\n\\nSaeimys l\u016bcek\u013cam
  ir t\u012bseiba atsasaceit nu l\u012bceibys d\u016b\u0161onys: 1) par personom,
  kurys jam kai tautys pr\u012b\u0161kstuovam uzticieju\u0161ys kaidus navi\u0146
  faktus voi zinis;\\n\\n2) par personom, kurom jis, pyld\u016bt sovus tautys pr\u012b\u0161kstuova
  p\u012bnuokumus, uzticiejs kaidus navi\u0146 faktus voi zinis; 3) par po\u0161im
  itim faktim i zi\u0146om.\\n\\n32.\\n\\nSaeimys l\u016bceklis navar pats, ni ari
  iz cytys personys vuorda sajimt nu va\u013csts pasyutejumus i koncesejis. Ituo panta
  n\u016bsacejumi atsat\u012bc iz ministru, ka j\u012b i nav Saeimys l\u016bcekli.\\n\\n33.\\n\\nSaeimys
  l\u016bcekli sajam atolguojumu nu va\u013csts leidzek\u013cu. 34.\\n\\nPar Saeimys
  i komiseju sie\u017eu atreferiejumim, ka t\u012b saska\u0146 ar pat\u012bseibu,
  niv\u012bna navar saukt pi atbi\u013cdeibys. Par Saeimys i komiseju sl\u0101gtom
  s\u0113dem var sn\u0113gt zinis tik ar Saeimys voi komisejis prezideja at\u013cuovi.\\n\\nIII
  n\u016bda\u013ca.\\n\\nVa\u013csts Prezidents\\n\\n35.\\n\\nVa\u013csts Prezidentu
  \u012bvielej Saeima iz \u010detru godu.\\n\\n(04.12.1997. lykuma redakcej\u0101,
  kas stuoj\u0101s sp\u0101k\u0101 31.12.1997.)\\n\\n36.\\n\\nVa\u013csts Prezidentu
  \u012bvielej aizkluoti bolsoj\u016bt ar ni mozuok kai 51 Saeimys l\u016bcek\u013ca
  bolsu vairuokumu.\\n\\n37.\\n\\nPar Va\u013csts Prezidentu var \u012bviel\u0113t
  pylnt\u012bseigu Latvejis pi\u013cs\u016bni, kurs sasniedzs \u010detrdesmit godu
  vacumu. Par Va\u013csts Prezidentu navar \u012bviel\u0113t pi\u013cs\u016bni ar
  dubultpi\u013cs\u016bneibu.\\n\\n(04.12.1997. lykuma redakcej\u0101, kas stuoj\u0101s
  sp\u0101k\u0101 31.12.1997.)\\n\\n38.\\n\\nVa\u013csts Prezidenta omots nav sav\u012bnojams
  ar cytu omotu. Ka par Va\u013csts Prezidentu \u012bv\u0101l\u0101tuo persona ir
  Saeimys l\u016bceklis, tod jam juon\u016bl\u012bk Saeimys l\u016bcek\u013ca pylnvarys.\\n\\n39.\\n\\nV\u012bna
  i tei po\u0161a persona navar byut par Va\u013csts Prezidentu ilguok kai osto\u0146us
  godus nu v\u012btys.\\n\\n(04.12.1997. lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101
  31.12.1997.)\\n\\n40.\\n\\nVa\u013csts Prezidents, apsajam\u016bt omota p\u012bnuokumus,
  Saeimys s\u0113d\u0113 d\u016bd itaidu svineigu s\u016blejumu: \\\"Es zviereju,
  ka vyss muns dorbs byus ve\u013cteits Latvejis tautys lobumam. Es darei\u0161u vysu,
  kas stuov\u0113s mun\u016bs sp\u0101k\u016bs, kab sekm\u0113t Latvejis va\u013csts
  i juos \u012bdzeivuotuoju lobkluojeibu. Es turie\u0161u sv\u0101tus i \u012bv\u0101ruo\u0161u
  Latvejis Satversmi i va\u013csts lykumus. Pret vysim es izaturie\u0161u taisneigi
  i sovus p\u012bnuokumus izpi\u013cdei\u0161u piec lobuokuos apzinis.\\\" (03.05.2007.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 31.05.2007.)\\n\\n41.\\n\\nVa\u013csts
  Prezidents repreze\u0146tej va\u013csti storptautyski, \u012bce\u013c Latvejis,
  kai ari p\u012bjam cytu va\u013cstu diplomatisk\u016bs pr\u012b\u0161kstuovus. Jis
  izpylda Saeimys l\u0101mumus par storptautysku leigumu rati\ufb01cie\u0161onu.\\n\\n42.\\n\\nVa\u013csts
  Prezidents ir va\u013csts bru\u0146otuo sp\u0101ka augstuokais vod\u016b\u0146s.
  Kara laikam jis \u012bce\u013c vierspavie\u013cn\u012bku.\\n\\n43.\\n\\nVa\u013csts
  Prezidents iz Saeimys l\u0101muma pamata pasludynoj karu.\\n\\n44.\\n\\nVa\u013csts
  Prezidentam ir t\u012bseiba spert nap\u012bc\u012b\u0161am\u016bs militaruos aizsardzeibys
  s\u016b\u013cus, ka kaida cyta va\u013csts Latvejai p\u012bsacejuse karu voi \u012bnaidn\u012bks
  izbryuk Latvejis r\u016bbe\u017eim. Leidz ar t\u016b Va\u013csts Prezidents nasakavej\u016bt
  sasauc Saeimu, kurei lem par kara pasludynuo\u0161onu i suok\u0161onu.\\n\\n45.\\n\\nVa\u013csts
  Prezidentam ir t\u012bseiba ap\u017e\u0101luot n\u016bz\u012bdzn\u012bkus, par kurim
  t\u012bsys spr\u012bdums stuoj\u012bs lykumeig\u0101 sp\u0101k\u0101. It\u016bs
  t\u012bseibu izmontuo\u0161onys apj\u016bmu i kuorteibu n\u016bsoka eipa\u0161s
  lykums. Amnesteju d\u016bd Saeima.\\n\\n(04.12.1997. lykuma redakcej\u0101, kas
  stuoj\u0101s sp\u0101k\u0101 31.12.1997.)\\n\\n46.\\n\\nVa\u013csts Prezidentam
  ir t\u012bseiba sasaukt i vadeit uorkuortejis ministru kabineta s\u0113dis, n\u016bsok\u016bt
  jom d\u012bnys kuorteibu.\\n\\n47.\\n\\nVa\u013csts Prezidentam ir lykuma \u012br\u016bsynuo\u0161onys
  t\u012bseiba.\\n\\n48.\\n\\nVa\u013csts Prezidentam ir t\u012bseiba \u012br\u016bsynuot
  Saeimys atlais\u0161onu. Piec tuo izdoroma tautys n\u016bbolsuo\u0161ona. Ka tautys
  n\u016bbolsuo\u0161on\u0101 vaira kai puse bolsuotuoju izasoka par Saeimys atlais\u0161onu,
  tod Saeima skaitoma par atlaistu i izsludynojamys jaunys vielie\u0161onys, kurom
  juon\u016bteik na v\u0101luok kai divejus miene\u0161us piec Saeimys atlais\u0161onys.\\n\\nKa
  Saeima ir atlaista voi atsaukta, tod Saeimys l\u016bcek\u013cu pylnvarys vystik
  pal\u012bk sp\u0101k\u0101 leidz nu jauna \u012bvielejamuos Saeimys sa\u012b\u0161onai,
  bet \u012bpr\u012bk\u0161ejuo Saeima var sa\u012bt iz s\u0113dem tikai tod, ka Va\u013csts
  Prezidents j\u016b sasauc. Itaidom Saeimys s\u0113dem d\u012bnys kuorteibu n\u016bsoka
  Va\u013csts Prezidents. Na agruok kai v\u012bnu mienesi i na v\u0101luok kai divejus
  miene\u0161us piec Saeimys atsauk\u0161onys juon\u016bteik jaunom vielie\u0161onom.\\n\\n(08.04.2009.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 02.11.2010.)\\n\\n50.\\n\\nKa
  tautys n\u016bbolsuo\u0161on\u0101 vaira kai puse nu n\u016bd\u016bt\u016bs bolsu
  izasoka pret Saeimys atlais\u0161onu, tod Va\u013csts Prezidents skaitoms par atlaistu
  i Saeima \u012bvielej jaunu Va\u013csts Prezidentu iz atlaistuo Prezidenta atlyku\u0161\u016b
  pylnvaru laiku.\\n\\n51.\\n\\nIz na mozuok kai pusis vysu Saeimys l\u016bcek\u013cu
  pr\u012b\u0161klykuma, Saeima sl\u0101gt\u0101 s\u0113d\u0113 ar na mozuok kai divejom
  tre\u0161da\u013com vysu Saeimys l\u016bcek\u013cu bolsu vairuokuma, var n\u016blemt
  atlaist Va\u013csts Prezidentu. Piec itaida l\u0101muma Saeima nasakavej\u016bt
  \u012bvielej jaunu Va\u013csts Prezidentu.\\n\\n52.\\n\\nKa Va\u013csts Prezidents
  atsasoka nu omota, n\u016bmierst voi teik atsaukts, pyrma juo omota laiks izabeidzs,
  Va\u013csts Prezidenta v\u012btu izpylda Saeimys pr\u012b\u0161ks\u0101d\u0101tuojs,
  cikom Saeima \u012bvielej jaunu Va\u013csts Prezidentu. Taipat Saeimys pr\u012b\u0161ks\u0101d\u0101tuojs
  izpylda Va\u013csts Prezidenta v\u012btu, ka p\u0101dejais atsar\u016bn uorpus va\u013csts
  r\u016bbe\u017ea voi cytai\u017ei aizkav\u0101ts pi\u013cdeit sovu omotu.\\n\\n53.\\n\\nVa\u013csts
  Prezidents par sovu darbeibu politiskys atbi\u013cdeibys nanas. Vysim Va\u013csts
  Prezidenta reikuojumim juobyun ministru prezidenta voi att\u012bceiguo ministra
  leidzparaksteitim, j\u012b leidza ar t\u016b apsajam vysu atbi\u013cdeibu par itim
  reikuojumim, izjam\u016bt \u010detrdesmit ostoitaj\u0101 i p\u012bcdesmit sastaj\u0101
  pant\u0101 paradz\u0101taj\u016bs gad\u012b\u0146\u016bs.\\n\\n54.\\n\\nVa\u013csts
  Prezidentu var saukt pi kriminaluos atbi\u013cdeibys, ka tam p\u012bkreit Saeima
  ar na mozuok kai diveju tre\u0161da\u013cu bolsu vairuokuma.\\n\\nIV n\u016bda\u013ca.\\n\\nMinistru
  kabinets\\n\\n55.\\n\\nMinistru kabinets sastuov nu ministru prezidenta i juo aicynuot\u016bs
  ministru.\\n\\n56.\\n\\nMinistru kabinetu sastota persona, kuru iz t\u016b aicynoj
  Va\u013csts Prezidents.\\n\\n57.\\n\\nMinistreju skaitu i j\u016bs darbeibys apj\u016bmu,
  kai ari va\u013csts \u012bstuo\u017eu sovstarpeiguos att\u012bceibys n\u016bsoka
  lykums.\\n\\n58.\\n\\nMinistru kabinetam ir pad\u016btys va\u013csts puorva\u013cdis
  \u012bstuodis.\\n\\n59.\\n\\nMinistru prezidentam i ministrim j\u016bs omota pi\u013cdei\u0161onai
  ir vajadzeiga Saeimys uzticeiba, i j\u012b par sovu darbeibu ir atbi\u013cdeigi
  Saeimys pr\u012b\u0161k\u0101. Ka Saeima izsoka nauzticeibu ministru prezidentam,
  tod juoatsakuop vysam kabinetam. Ka nauzticeiba izsaceita atsevi\u0161kam ministram,
  tod jam juoatsakuop i juo v\u012bt\u0101 ministru prezidentam juoaicynoj cyta persona.\\n\\n60.\\n\\nMinistru
  kabineta s\u0113dis voda ministru prezidents i juo pr\u016bmbyu\u0161onys laik\u0101
  tys ministrs, kuru jis iz tuo ir pylnvaruojs. 61.\\n\\nMinistru kabinets apspr\u012b\u017e
  vysus atsevi\u0161kus ministreju izstruoduot\u016bs lykuma projektus i vaicuojumus,
  kuri atsat\u012bc iz vairuoku ministreju darbeibys, kai ari atsevi\u0161ku kabineta
  l\u016bcek\u013cu \u012br\u016bsynuotus va\u013csts politikys vaicuojumus.\\n\\n62.\\n\\nKa
  va\u013csti apdraud uorejais \u012bnaidn\u012bks voi ka va\u013cst\u012b voi juos
  da\u013c\u0101 ir izacie\u013cs voi draud izace\u013ct \u012bk\u0161ejs nam\u012brs,
  kurs apdraud pastuov\u016b\u0161\u016b va\u013csts \u012bkuortu, tod ministru kabinetam
  ir t\u012bseibys izsludynuot izj\u0101muma stuov\u016bkli, par t\u016b divdesmit
  \u010detru stu\u0146\u017eu laik\u0101 pazi\u0146oj\u016bt Saeimys prezidejam, kuram
  itaids ministru kabineta l\u0101mums nasakavej\u016bt juoce\u013c pr\u012b\u0161k\u0101
  Saeimai.\\n\\n63.\\n\\nMinistrim, ka j\u012b i nav Saeimys l\u016bcekli, i ministru
  pylnvaruotom atbi\u013cdeigom va\u013csts omota personom ir t\u012bseiba p\u012bsadaleit
  Saeimys i juos komiseju s\u0113d\u0113s i \u012bsn\u0113gt papyldynuojumus i puorlobuojumus
  pi lykuma projektu.\\n\\nV n\u016bda\u013ca.\\n\\nLykumd\u016b\u0161ona\\n\\n64.\\n\\nLykumd\u016b\u0161onys
  t\u012bseibys p\u012bdar Saeimai, kai ari tautai itam\u0101 Satversm\u0113 paradz\u0101t\u0101
  kuorteib\u0101 i apm\u0101r\u016bs.\\n\\n65.\\n\\nLykuma projektus var \u012bsn\u0113gt
  Saeimai Va\u013csts Prezidents, ministru kabinets, Saeimys komisejis, na mozuok
  kai p\u012bci deputati, kai ari itam\u0101 Satversm\u0113 paradz\u0101t\u016bs gad\u012b\u0146\u016bs
  i kuorteib\u0101 v\u012bna dasmytuo da\u013ca v\u0101l\u0101tuoju.\\n\\n66.\\n\\nSaeima
  kasgods pyrma saimn\u012bciskuo goda \u012bsasuok\u0161onys lem par va\u013csts
  \u012bnuokumu i izdavumu bud\u017eetu, kura projektu jai \u012bsn\u0101dz ministru
  kabinets.\\n\\nKa Saeima p\u012bjam l\u0101mumu, kurs saisteits ar bud\u017eet\u0101
  naparadz\u0101tim izdavumim, tod l\u0101mum\u0101 juoparedz ari leidzekli, ar kurim
  segt it\u016bs izdavumus.\\n\\nPiec bud\u017eeta goda izabeig\u0161onys ministru
  kabinetam juo\u012bsn\u0101dz Saeimai apstyprynuo\u0161onai n\u016briekini par bud\u017eeta
  izpi\u013cdei\u0161onu.\\n\\n67.\\n\\nSaeima lem par va\u013csts bru\u0146uotuo
  sp\u0101ka lelumu m\u012bra laik\u0101.\\n\\n68.\\n\\nVysim storptautyskim leigumim,
  kuri n\u016bkuortoj lykumd\u016b\u0161onys ce\u013c\u0101 iz\u0161kiramus vaicuojumus,
  vajadzeiga Saeimys apstyprynuo\u0161ona.\\n\\nSl\u0101dz\u016bt storptautyskus leigumus,
  Latveja n\u016blyuk\u0101 styprynuot demokrateju var deleg\u0113t storptautyskom
  institucejom da\u013cu nu va\u013csts instituceju kompete\u0146cis. Storptautyskus
  leigumus, kuram\u016bs storptautyskajom institucejom teik deleg\u0101ta da\u013ca
  nu va\u013csts instituceju kompetencis, Saeima var apstyprynuot s\u0113d\u0113s,
  kuramuos p\u012bsadola vysmoz divejis tre\u0161dalis Saeimys l\u016bcek\u013cu,
  i apstyprynuo\u0161onai vajadzeigs diveju tre\u0161da\u013cu kluot as\u016b\u0161\u016bs
  deputatu bolsu vairuokums.\\n\\nLatvejis daleiba Eiropys Sav\u012bneib\u0101 izlemama
  tautys n\u016bbolsuo\u0161on\u0101, kuru \u012br\u016bsynoj Saeima.\\n\\nKa tuo
  p\u012bprosa vysmoz puse Saeimys l\u016bcek\u013cu, byutiskys izmainis n\u016bsacejum\u016bs
  par Latvejis daleibu Eiropys Sav\u012bneib\u0101 izlemamys tautys n\u016bbolsuo\u0161on\u0101.\\n\\n(08.05.2003.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 05.06.2003.)\\n\\n69.\\n\\nVa\u013csts
  Prezidents izsludynoj Saeim\u0101 p\u012bjimt\u016bs lykumus na agruok kai dasmyt\u0101
  d\u012bn\u0101 i na v\u0101luok kai divdesmit pyrm\u0101 d\u012bn\u0101 piec j\u016bs
  p\u012bjim\u0161onys. Lykums stuoj\u0101s sp\u0101k\u0101 \u010detrpadsmit d\u012bnu
  piec izsludynuo\u0161onys, ka lykum\u0101 nav n\u016bsaceits cyts laiks. (23.09.2004.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 21.10.2004.)\\n\\n70.\\n\\nVa\u013csts
  Prezidents izsludynoj p\u012bjimt\u016bs lykumus itaid\u0101 kuort\u0101: \\\"Saeima
  (resp. tauta) ir p\u012bj\u0101muse i Va\u013csts Prezidents izsludynoj itaidu lykumu:
  (lykuma teksts).\\\"\\n\\n71.\\n\\nDesmit d\u012bnu laik\u0101, skait\u016bt nu
  lykuma p\u012bjim\u0161onys Saeim\u0101, Va\u013csts Prezidents motiv\u0101t\u0101
  rokst\u0101 Saeimys pr\u012b\u0161ks\u0101d\u0101tuojam var praseit lykuma puorsavier\u0161onys
  \u016btru reizi. Ka Saeima lykuma nagr\u016bza, tod Va\u013csts Prezidents \u016btru
  reizi \u012brunu navar ce\u013ct. (23.09.2004. lykuma redakcej\u0101, kas \u012bsastuojs
  sp\u0101k\u0101 21.10.2004.)\\n\\n72.\\n\\nVa\u013csts Prezidentam ir t\u012bseibys
  aptur\u0113t lykuma publicie\u0161onu iz diveju miene\u0161u. Jam lykuma publicie\u0161ona
  ir juoaptur, ka tuo p\u012bprosa na mozuok kai v\u012bna tre\u0161uo da\u013ca Saeimys
  l\u016bcek\u013cu. Ituos t\u012bseibys Va\u013csts Prezidents voi v\u012bna tre\u0161uo
  da\u013ca Saeimys l\u016bcek\u013cu var izl\u012btuot desmit d\u012bnu laik\u0101,
  skait\u016bt nu lykuma p\u012bjim\u0161onys Saeim\u0101. Itaid\u0101 kuort\u0101
  aptur\u0101tais lykums n\u016bd\u016bdams tautys n\u016bbolsuo\u0161onai, ka tuo
  p\u012bprosa na mozuok kai v\u012bna dasmytuo da\u013ca v\u0101l\u0101tuoju. Ka
  aug\u0161uok n\u016bsaukt\u016bs diveju miene\u0161u laik\u0101 itaids p\u012bprasejums
  na\u012b\u012bt, tod piec ituo laika izabeig\u0161onys lykums ir publicejams. Tautys
  n\u016bbolsuo\u0161ona vystik nan\u016bteik, ka Saeima v\u0113\u013c reizi bolsoj
  par it\u016b lykumu i ka par juo p\u012bjim\u0161onu izasoka na mozuok kai treis
  cat\u016brtdalis nu vysu deputatu. (23.09.2004. lykuma redakcej\u0101, kas stuoj\u0101s
  sp\u0101k\u0101 21.10.2004.)\\n\\nTautys n\u016bbolsuo\u0161onai navar n\u016bd\u016bt
  bud\u017eetu i lykumus par aizj\u0101mumim, n\u016bd\u016bklim, muitom, dze\u013c\u017eace\u013ca
  tari\ufb01m, kara klauseibu, kara pasludynuo\u0161onu i suok\u0161onu, m\u012bra
  n\u016bslieg\u0161onu, izj\u0101muma stuov\u016bk\u013ca izsludynuo\u0161onu i juo
  izbeig\u0161onu, mobilizaceju i demobilizaciju, kai ari leigumus ar uorva\u013cstim.
  74.\\n\\nSaeim\u0101 p\u012bjimtais i septe\u0146desmit \u016btruo panta kuorteib\u0101
  aptur\u0101tais lykums ir atcalts tautys n\u016bbolsuo\u0161on\u0101, ka bolsuotuoju
  skaits ir vysmoz puse nu p\u0101dejuos Saeimys vielie\u0161onuos p\u012bsadaleju\u0161u
  v\u0101l\u0101tuoju skaita i ka vairuokums ir bolsuojs par lykuma atce\u013c\u0161onu.\\n\\n(21.03.1933.
  lykuma redakcej\u0101)\\n\\n75.\\n\\nKa Saeima ar na mozuok kai diveju tre\u0161da\u013cu
  bolsu vairuokuma p\u012bjam lykuma steidzameibu, tod Va\u013csts Prezidents navar
  praseit itaida lykuma \u016btrreizejis puorsavier\u0161onys, juo navar n\u016bd\u016bt
  tautys n\u016bbolsuo\u0161onai i jis ir izsludynojams na v\u0101luok kai tre\u0161\u0101
  d\u012bn\u0101 piec tuo, kod Prezidents p\u012bjimt\u016b lykumu sajiems.\\n\\n76.\\n\\nSatversmi
  Saeima var gr\u016bzeit s\u0113d\u0113s, kuruos p\u012bsadola vysmoz divejis tre\u0161dalis
  Saeimys l\u016bcek\u013cu. Puorgr\u016bzejumus p\u012bjam trej\u016bs lasejum\u016bs
  ar na mozuok kai diveju tre\u0161da\u013cu kluot as\u016b\u0161\u016bs deputatu
  bolsu vairuokuma.\\n\\n77.\\n\\nKa Saeima gr\u016bzejuse Satversmis pyrm\u016b,
  \u016btr\u016b, tre\u0161\u016b, cat\u016brt\u016b, sast\u016b voi septe\u0146desmit
  septeit\u016b pantu, tod itaidi puorgr\u016bzejumi, kab j\u012b dabuotu lykuma sp\u0101ka,
  ir apstyprynojami tautys n\u016bbolsuo\u0161on\u0101.\\n\\n(15.10.1998. lykuma redakcej\u0101,
  kas stuoj\u0101s sp\u0101k\u0101 06.11.1998.)\\n\\n78.\\n\\nNa mozuok kai v\u012bnai
  dasmytai da\u013cai v\u0101l\u0101tuoju ir t\u012bseiba \u012bsn\u0113gt Va\u013csts
  Prezidentam pi\u013cneigi izstruoduotu Satversmis gr\u016bzejumu projektu voi lykuma
  projektu, kuru Prezidents n\u016bd\u016bd Saeimai. Ka Saeima tuo nap\u012bjam bez
  puorgr\u016bzejumu piec satura, tod jis ir n\u016bd\u016bdams tautys n\u016bbolsuo\u0161onai.
  79.\\n\\nTautys n\u016bbolsuo\u0161onai n\u016bd\u016btais Satversmis puorgr\u016bzejums
  ir p\u012bjimts, ka jam p\u012bkreit vysmoz puse nu vysu bolsa t\u012bseig\u016bs.
  Tautys n\u016bbolsuo\u0161onai n\u016bd\u016btais lykuma projekts, l\u0101mums par
  Latvejis daleibu Eiropys Sav\u012bneib\u0101 voi byutiskom izmai\u0146om ituos daleibys
  n\u016bsacejum\u016bs ir p\u012bjimts, ka bolsuotuoju skaits ir vysmoz puse nu p\u0101dejuos
  Saeimys vielie\u0161onuos p\u012bsadaleju\u0161u v\u0101l\u0101tuoju skaita i ka
  vairuokums ir bolsuojs par lykuma projekta p\u012bjim\u0161onu, Latvejis daleibu
  Eiropys Sav\u012bneib\u0101 voi byutiskom izmai\u0146om ituos daleibys n\u016bsacejum\u016bs.
  (08.05.2003. lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 05.06.2003.)\\n\\nTautys
  n\u016bbolsuo\u0161on\u0101 var p\u012bsadaleit vysi Latvejis pi\u013cs\u016bni,
  kurim ir bolsa t\u012bseibys Saeimys vielie\u0161onuos.\\n\\n81.\\n\\n(Izsl\u0101gts
  ar 03.05.2007. lykumu, kas stuoj\u0101s sp\u0101k\u0101 31.05.2007.)\\n\\nVI n\u016bda\u013ca.\\n\\nT\u012bsa\\n\\n82.\\n\\nT\u012bsu
  Latvej\u0101 spr\u012b\u017e rajona (pi\u013cs\u0101tys) t\u012bsys, apgobolt\u012bsys
  i Augstuokuo t\u012bsa, bet kara voi izj\u0101muma stuov\u016bk\u013ca gad\u012bn\u012b
  \u2013 ari kara t\u012bsys.\\n\\n(15.10.1998. lykuma redakcej\u0101, kas stuoj\u0101s
  sp\u0101k\u0101 06.11.1998.)\\n\\n83.\\n\\nT\u012bsne\u0161i ir naatkareigi i v\u012bneigi
  lykumam pad\u016bti.\\n\\n84.\\n\\nT\u012bsne\u0161us apstyprynoj Saeima, i j\u012b
  ir naatce\u013cami. T\u012bsnesi pret juo grybu atce\u013ct nu omota var Saeima
  v\u012bneigi lykum\u0101 paradz\u0101t\u016bs gad\u012b\u0146\u016bs, par pamatu
  jam\u016bt t\u012bsne\u0161u disciplinarkolegejis l\u0101mumu voi t\u012bsys spr\u012bdumu
  kriminall\u012bt\u0101. Ar lykumu var n\u016bsaceit vacumu, ar kura sasnieg\u0161onu
  t\u012bsne\u0161i pamat sovu omotu.\\n\\n(04.12.1997. lykuma redakcej\u0101, kas
  stuoj\u0101s sp\u0101k\u0101 31.12.1997.)\\n\\n85.\\n\\nLatvej\u0101 pastuov Satversmis
  t\u012bsa, kas lykum\u0101 n\u016bsaceituos kompete\u0146cis \u012btvor\u016bs izskota
  l\u012btys par lykumu atbi\u013csteibu Satversmei, kai ari cytys ar lykumu juos
  kompete\u0146c\u0113 n\u016bd\u016btuos l\u012btys. Satversmis t\u012bsa ir t\u012bseiga
  atzeit par sp\u0101k\u0101 naas\u016b\u0161im lykumus i cytus aktus voi j\u016bs
  dalis. Satversmis t\u012bsys t\u012bsne\u0161us iz lykum\u0101 n\u016bsaceituo laika
  apstyprynoj Saeima, aizkluoti bolsoj\u016bt, ar na mozuok kai 51 Saeimys l\u016bcek\u013ca
  bolsu vairuokuma.\\n\\n(05.06.1996. lykuma redakcej\u0101, kas \u012bsastuojs sp\u0101k\u0101
  26.06.1996.)\\n\\n86.\\n\\nT\u012bsu var spr\u012bst tik t\u012b organi, kurim ituos
  t\u012bseibys p\u012b\u0161kir lykums, i tikai lykum\u0101 paradz\u0101t\u0101 kuorteib\u0101.
  Kara t\u012bsys dorboj\u0101s iz sevi\u0161ka lykuma pamata.\\n\\nVII n\u016bda\u013ca.
  Va\u013csts kontrole\\n\\n87.\\n\\nVa\u013csts kontrole ir naatkareiga kolegiala
  \u012bstuode.\\n\\n88.\\n\\nVa\u013csts kontrolerus \u012bce\u013c i apstyprynoj
  omot\u0101 taid\u0101 pat kuorteib\u0101 kai t\u012bsne\u0161us, bet tik iz n\u016bsaceita
  laika, kur\u0101 j\u016bs var atce\u013ct nu omota v\u012bneigi iz t\u012bsys spr\u012bduma
  pamata. Va\u013csts kontrolis \u012bkuortu i kompete\u0146cis n\u016bsoka sevi\u0161kys
  lykums.\\n\\nVIII n\u016bda\u013ca. Cylv\u0101ka pamatt\u012bseibys\\n\\n(N\u016bda\u013ca
  15.10.1998. lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 06.11.1998.)\\n\\n89.\\n\\nVa\u013csts
  atzeist i sorgoj cylv\u0101ka pamatt\u012bseibys saska\u0146\u0101 ar it\u016b Satversmi,
  lykumim i Latvejai saist\u016b\u0161im storptautyskajim leigumim.\\n\\n90.\\n\\nSevkuram  ir
  t\u012bseibys zynuot sovys t\u012bseibys.\\n\\n91.\\n\\nVysi cylv\u0101ki Latvej\u0101
  ir v\u012bnleidzeigi lykuma i t\u012bsys pr\u012b\u0161k\u0101. Cylv\u0101ka t\u012bseibys
  teik eistynuotys bez kod kaidys diskriminacejis.\\n\\n92.\\n\\nSevkurs var aizstuov\u0113t
  sovys t\u012bseibys i lykumiskuos interesis taisneig\u0101 t\u012bs\u0101. Sevkurs
  skaitoms par navaineigu, cikom juo vaine nav atzeita saska\u0146\u0101 ar lykumu.
  Napamatuota t\u012bseibu aizskuoruma gad\u012bn\u012b sevkuram ir t\u012bseibys
  iz atbylst\u016b\u0161u atleidzynuojumu. Sevkuram ir t\u012bseibys iz advokata paleidzeibu.\\n\\n93.\\n\\nSevkura
  t\u012bseibys iz dzeiveibu aizsorgoj lykums.\\n\\n94.\\n\\nSevkuram ir t\u012bseibys
  iz breiveibu i personys naaizskarameibu. Niv\u012bnam nadreikst atjimt voi \u012br\u016bbe\u017euot
  breiveibu cytai\u017e kai tik saska\u0146\u0101 ar lykumu.\\n\\n95.\\n\\nVa\u013csts
  aizsorgoj cylv\u0101ka g\u016bdu i c\u012bnu. Spydzynuo\u0161ona, cytaida c\u012btsirdeiga
  voi c\u012bnu pazamoj\u016b\u0161a izaturie\u0161ona pret cylv\u0101ku ir aizl\u012bgta.
  Niv\u012bna nadreikst pak\u013caut na\u017eieleigai voi cylv\u0101ka c\u012bnu pazamoj\u016b\u0161ai
  struopei.\\n\\nSevkuram ir t\u012bseibys iz privat\u016b dzeivi, muoj\u016bk\u013ca
  i koresponde\u0146cis naaizskarameibu.\\n\\n97.\\n\\nSevkuram, kas lykumeigi uzatur
  Latvejis teritorej\u0101, ir t\u012bseibys breivi puorsav\u012btuot i izaviel\u0113t  dzeivis
  v\u012btu.\\n\\n98.\\n\\nSevkuram ir t\u012bseibys breivi izbraukt nu Latvejis.
  Sevkurs, kam ir Latvejis pase, uorpus Latvejis atsar\u016bn va\u013csts aizsardzeib\u0101,
  i jam ir t\u012bseibys breivi atsagr\u012bzt Latvej\u0101. Latvejis pi\u013cs\u016b\u0146a
  navar izd\u016bt uorva\u013cstim, izjam\u016bt Saeimys apstyprynuotaj\u016bs storptautyskaj\u016bs
  leigum\u016bs paradz\u0101t\u016bs gad\u012b\u0146us, ka ar izd\u016b\u0161onu nateik
  puorkuoptys Satversm\u0113 n\u016bsaceituos cylv\u0101ka pamatt\u012bseibys. (23.09.2004.
  lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101 21.10.2004.)\\n\\n99.\\n\\nSevkuram  ir
  t\u012bseibys iz d\u016bmys, apzinis i religiskuos puorl\u012bceibys breiveibu.
  Bazneica ir atdaleita nu va\u013csts.\\n\\n100.\\n\\nSevkuram ir t\u012bseibys iz
  vuorda breiveibu, kas \u012btver t\u012bseibys breivi dabuot, patur\u0113t i izplateit
  informaceju, paust sovus uzskotus. Cenzura ir aizl\u012bgta.\\n\\n101.\\n\\nSevkuram
  Latvejis pi\u013cs\u016b\u0146am ir t\u012bseibys lykum\u0101 paradz\u0101taj\u0101
  veid\u0101 p\u012bsadaleit va\u013csts i po\u0161va\u013cdeibu darbeib\u0101, kai
  ari pi\u013cdeit va\u013csts d\u012bnastu.\\n\\nPo\u0161va\u013cdeibys \u012bvielej
  pylnt\u012bseigi Latvejis pi\u013cs\u016bni i Eiropys Sav\u012bneibys pi\u013cs\u016bni,
  kas pastuoveigi uzatur Latvej\u0101. Sevkuram Eiropys Sav\u012bneibys pi\u013cs\u016b\u0146am,
  kas pastuoveigi uzatur Latvej\u0101, ir t\u012bseibys lykum\u0101 paradz\u0101taj\u0101
  veid\u0101 p\u012bsadaleit po\u0161va\u013cdeibu darbeib\u0101. Po\u0161va\u013cdeibu
  dorba vol\u016bda ir latv\u012b\u0161u vol\u016bda.\\n\\n(23.09.2004. lykuma redakcej\u0101,
  kas stuoj\u0101s sp\u0101k\u0101 21.10.2004.)\\n\\n102.\\n\\nSevkuram  ir t\u012bseibys
  apsav\u012bnuot b\u012bdreibuos, politiskuos partejuos i cytuos sab\u012bdriskuos
  organizacejuos.\\n\\n103.\\n\\nVa\u013csts aizsorgoj \u012bpr\u012bk\u0161 p\u012bsaceitu
  m\u012brm\u012bleigu sapu\u013c\u010du i guoj\u012b\u0146u, kai ari piketu breiveibu.\\n\\n104.\\n\\nSevkuram  ir
  t\u012bseibys lykum\u0101 paradz\u0101taj\u0101 veid\u0101 v\u0113rst\u012bs va\u013csts
  i po\u0161va\u013cdeibu \u012bstuod\u0113s ar \u012bsn\u0101gumim i sajimt atbi\u013cdi
  piec byuteibys. Sevkuram  ir t\u012bseibys sajimt atbi\u013cdi latv\u012b\u0161u
  vol\u016bd\u0101. (30.04.2002. lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101
  24.05.2002.)\\n\\n105.\\n\\nSevkuram  ir t\u012bseibys iz eipa\u0161umu. Eipa\u0161umu
  nadreikst izmontuot preteji sab\u012bdreibys interesem. Eipa\u0161uma t\u012bseibys
  var \u012br\u016bbe\u017euot v\u012bneigi saska\u0146\u0101 ar lykumu. Eipa\u0161uma
  p\u012bsp\u012bdu atsavynuo\u0161ona sab\u012bdreibys vajadzeibom p\u012b\u013caunama
  tikai izj\u0101muma gad\u012b\u0146\u016bs iz atsevi\u0161ka lykuma pamata pret
  taisneigu atleidzeibu.\\n\\n106.\\n\\nSevkuram  ir t\u012bseibys breivi izaviel\u0113t  n\u016bsadorbuo\u0161onu
  i dorba v\u012btu atbylst\u016b\u0161i sovom spiejom i kvali\ufb01kacejai. P\u012bsp\u012bdu
  dorbs ir aizl\u012bgts. Par p\u012bsp\u012bdu dorbu nateik skaiteita \u012bsasaistei\u0161ona
  katastrofu i j\u016bs saku likvidie\u0161on\u0101 i n\u016bdarbynuo\u0161ona saska\u0146\u0101
  ar t\u012bsys n\u016bl\u0101mumu.\\n\\n107.\\n\\nSevkuram  darbin\u012bkam ir t\u012bseibys
  sajimt veiktajam dorbam atbylst\u016b\u0161u samoksu, kas nav mazuoka par va\u013csts
  n\u016bsaceit\u016b minimumu, kai ari t\u012bseibys iz kasnedelis breivd\u012bnom
  i kasgods apmaksuotu atvalynuojumu.\\n\\n108.\\n\\nStruodoj\u016b\u0161im ir t\u012bseibys
  iz k\u016bpleigumu, kai ari t\u012bseibys streikuot. Va\u013csts aizsorgoj or\u016bdb\u012bdreibu
  breiveibu.\\n\\n109.\\n\\nSevkuram  ir t\u012bseibys iz social\u016b n\u016bdr\u016bsynuojumu
  vacuma, dorba naspiejis, bezdorba i cyt\u016bs lykum\u0101 n\u016bsaceit\u016bs
  gad\u012b\u0146\u016bs.\\n\\n110.\\n\\nVa\u013csts aizsorgoj i atbolsta lauleibu
  \u2013 sav\u012bneibu storp veir\u012bti i s\u012bv\u012bti, saimi, t\u0101va ar
  muotis i b\u0101rna t\u012bseibys. Va\u013csts eipa\u0161i paleidz b\u0101rnim invalidim,
  b\u0101rnim, kas palyku\u0161i bez t\u0101va ar muotis guodeibys voi c\u012btu\u0161i
  nu varm\u016bceibys.\\n\\n(15.12.2005. lykuma redakcej\u0101, kas stuoj\u0101s sp\u0101k\u0101
  17.01.2006.)\\n\\n111.\\n\\nVa\u013csts aizsorgoj cylv\u0101ku veseleibu i garantej
  sevkuram mediciniskuos paleidzeibys minimumu.\\n\\n112.\\n\\nSevkuram  ir t\u012bseibys
  iz izgleiteibu. Va\u013csts n\u016bdr\u016bsynoj \u012bspieju bez moksys sajimt
  pamatizgleiteibu i videj\u016b izgleiteibu. Pamatizgleiteiba ir obligata.\\n\\n113.\\n\\nVa\u013csts
  atzeist zynuotniskuos, muokslin\u012bciskuos i cytaidys jaunradis breiveibu, kai
  ari aizsorgoj autoru t\u012bseibys i patentu t\u012bseibys.\\n\\n114.\\n\\nPersonom,
  kurys p\u012bdar pi mozuokuma tauteibu, ir t\u012bseibys saglobuot i atteisteit
  sovu vol\u016bdu, etnisk\u016b i kulturys sovdabeibu.\\n\\n115.\\n\\nVa\u013csts
  aizsorgoj sevkura t\u012bseibys dzeivuot lobvieleig\u0101 vid\u0113, sn\u0101dz\u016bt
  zinis par vidis stuov\u016bkli i ryupej\u016bt\u012bs par juos saglobuo\u0161onu
  i uzlobuo\u0161onu.\\n\\n116.\\n\\nPersonys t\u012bseibys, kas n\u016bsaceitys Satversmis
  deve\u0146desmit sastaj\u0101, deve\u0146desmit septeitaj\u0101, deve\u0146desmit
  ostoitaj\u0101, symtaj\u0101, symtu \u016btraj\u0101, symtu tre\u0161aj\u0101, symtu
  sastaj\u0101 i symtu ostoitaj\u0101 pant\u0101, var \u012br\u016bbe\u017euot lykum\u0101
  paradz\u0101t\u016bs gad\u012b\u0146\u016bs, kab aizsorguot cytu cylv\u0101ku t\u012bseibys,
  demokratisk\u016b va\u013csts \u012bkuortu, sab\u012bdreibys dr\u016b\u0161eibu,
  lobkluojeibu i tykumeibu. Iz itym\u0101 pant\u0101 n\u016bsaukt\u016bs n\u016bsacejumu
  pamata var \u012br\u016bbe\u017euot ari religiskuos puorl\u012bceibys paus\u0161onu.\\n\\nJ.
  \u010cakste,\\n\\nSatversmis Sapu\u013ccis prezidents\\n\\nR. Ivanovs,\\n\\nSatversmis
  Sapu\u013ccis sekretars\\n\\n(Aktualuo redakceja 2012. god\u0101 \u2013 90 godu
  piec Satversmis p\u012bjim\u0161onys.)\"", "\"Marija And\u017e\u0101ne\\n\\nAkmin\u0219
