  A kaidus dorbus asom darieju\u0161i. \u2014\\n\\nTys myu\u017e\u0101 sver, cik asom
  pe\u013cnieju\u0161i.\\n\\n\u00abOl\u016bts-6\u00bb  1944.g.\"", "\"Latv\u012b\u0161u
