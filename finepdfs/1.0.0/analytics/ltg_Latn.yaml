  Latvejis Kulturys akademejis Pad\u016bmis vadeituoja |\"", "\"ST\u016aPS  I  \u017dBANS\\n\\nJauns
  puis\u0219 ai m\u012blys pylnu kryuti N\u016bt\u00e4s\u00e1 ai ciervi jaunu st\u016bpeni.
  Pyrms \u012bkas\u021b s\u0101tmal\u012b t\u014d n\u016bpyvu\u0161\u014d st\u016bpa
  v\u012bt\u0101, Jys atsas\u00e4d\u00e1, i ai smolku n\u0101zeiti, d\u016bm\u014ddams
  par bryuti, izgr\u012bz\u00e1 jaunij\u0101 st\u016bpen\u012b sirsneni - m\u012blesteibys
  zeimeiti.\\n\\nLai, gadiejum\u0101, - bryut\u00e1 garom \u012bdama r\u00e1dz\u0101tu
  i saprostu: ka pi kr\u012btna saimin\u012bka iz\u012bdama, t\u00e1 dzeivis laimi
  atrostu.\\n\\nSt\u016bpen\u0161 t\u016b vysu n\u016bjausdams, i kai pui\u0161a d\u016bmys
  laseidams, aiz \u012bd\u016bmeibys gondrei\u017e pleisa, par m\u014dkslys dorbu
  sevi tur\u0101dams.\\n\\nTik, dreiz\u014dku par \u012bd\u016bm\u014dt\u016b bryuti,
  D\u012bvs izsyut\u00e4ja \u014dr\u0101 vacu babeni... (kas j\u016b t\u00e1 sauc\u00e1?!)
  Jei tikk\u016b izmozg\u014dt\u016b ola \u017ebanu iz jaun\u014d st\u016bpen\u00e1
  ka\u013ct\u00e4\u021b mauc\u00e1.\\n\\nAi ciervi t\u0101st\u012bs napac\u012bt\u00e1,
  ka jam nazkas viers\u0101 s\u0101st\u0101s: \\\"Kai tu, puzat\u012bs, dreikst, Ma\u0146,
  m\u014dkslys dorbam, viers\u0101 leist? I v\u00e4\u013c nazk\u016b sl\u00e1pnu viers\u0101
  meiz\u021b!?\\\"\\n\\nPasc\u00e4\u021b da golam napasp\u00e4ja jys, Part\u016b,
  ka paza\u013c\u0161 b\u0233dams, niu korst\u0101 saul\u012b n\u016bkliudams, \u012bpleisa
  jys drei\u017e nu \u012bd\u016bmeig\u014ds golvys sovys da pap\u012b\u017eim gondrei\u017e.\\n\\n\u017dbans
  pad\u016bmova: \\\"Ko\u010d nu sapras\u0161onys st\u016bps ir \u0161kierts i niul\u00e1
  naruneigs, a mo\u017e v\u00e4\u013c lai dzier\u1e11 cik dau\u1e11z m\u014dkslys
  dorba i dai\u013cuma m\u00e1\u0219 kotrys asom viert\u0219?\\\" I soka jam: \\\"T\u00e1v,
  ai ciervi t\u0101stijam i ai n\u0101zi drusce\u0146 gr\u012bztijam, paviestei\u0161u:
  ka ma\u0146, iz p\u016bdin\u012bka rypys gr\u012bztijam dau\u1e11z vair\u014dk veikl\u016bs
  r\u016bku gl\u014dstu beja j\u014dp\u012bjam. A, lai napleistu, as tyku cepl\u012b
  kars\u0101ts, glazeits, ryudeits. Pec vysa t\u014d tik beju \u013cau\u017eu pr\u012bcai
  syuteits, ai m\u012b\u017eu olu iz golda g\u016bda v\u012bt\u0101 stateits.\\\"
  *\\n\\nPar m\u014dkslys dai\u013cumu var run\u014d\u021b dau\u1e11z, Par sevi c\u012b\u017e\u014dk
  skandynoj ai ciervi t\u0101st\u012b \u013caud\u0219.\\n\\n2009.\\n\\nPAL\u0100DA\\n\\nPec
  bogoteigom medeibom I agrom s\u014dtnom br\u016bkas\u021bom Pal\u0101dai bej m\u014dga
  smoga I drei\u017ei m\u012bgs jai dazazoga; Tym\u0101 l\u012bp\u0101, ma\u013cteit\u00e1
  kur beja,\\n\\nT\u00e1, me\u017ea mol\u0101, Jei ni nu v\u012bna nazabej\u014ds.\\n\\nDrei\u017e
  rod\u014ds m\u012bra trauc\u0101t\u014dji Mozi putni \u2013 dz\u012bd\u014dt\u014dji.\\n\\nTik
  it\u016b \u0157aizi, na ai dz\u012bsmom A ai gvaltu, kara br\u012bsmom. J\u016bs
  sp\u014drni \u0161veiks\u021b, I bolsi peiks\u021b, A pal\u0101dai vairs nav kur
  leis\u021b, Saul\u00e1 \u017eylbynoj jai ac\u0219, Nu vysom pu\u0219om kara trac\u0219.\\n\\nKotra
  radeiben\u00e1 moza Morali jai losa:\\n\\n- Kai t\u00e1v, zagl\u00e1i kauna nav,
  pat\u012b\u0161i? Cik ilgi laupeiti tik\u0219 me\u017ea m\u014dj\u016bklei\u0161i?
  P\u00e1lis teirum\u0101 - ir tova dal\u00e1, A na m\u0233su c\u014d\u013cu gal\u00e1!
  -\\n\\nAug lel\u014dks \u010deipst\u0101t\u014dju maln\u0233\u0219 rojs Kai pikets.
  Kas t\u016b izd\u016bm\u014dj\u0219?\\n\\nGaida pal\u0101da - kod vokors n\u014dk\u0219,
  Moz\u012b nakaunis tod rimt\u012bs s\u014dk\u0219. Jei d\u012bn\u0101 okla, zynoms
  tys, I pac\u012bs\u021b daza\u012bt \u0161\u014ds klopotys.\\n\\n- Kas zyn, kur
  b\u012bz\u016bknis tys dzymt\u012bs, Pa\u021b tagad, d\u012bn\u0101, gondrei\u017e
  tyms\u012bs? Jei l\u012bp\u0101 d\u016bmoj, planus ka\u013c: Kai it\u016b piketu
  j\u012bm sar\u012bb\u021b atpaka\u013c? I soka s\u00e1v:\\n- As nakt\u012b par\u014ddei\u0161u
  sovu varu\\n\\nAi jaunu laupei\u0161onu. Na ai karu. -\\n\\nNakt\u0219 zag\u013cus
  t\u012bs\u0101 sauk\u021b vys navarom nikai, Ni golu dar\u00e4\u021b ''\u0101nu
  ekonomikai''.\\n\\n2009.\\n\\nPOEMA  PAR  ZABABONU\\n\\nL\u012bksmeigi m\u00e1\u0219
  Vac\u016b godu pavad\u00e4jam: Ai tostim, dz\u012bs\u1e3fom, deklamacejom i dejom.
  A \u0161udi\u0146 - Jaungod\u0101 kai svyna pylna golva, Nu, sapr\u016btams, - nu
  dzier\u012bnim tei bolva.\\n\\nKa labi pad\u016bm\u014d\u021b, var b\u0101du risyn\u014d\u021b
  Da vakard\u012bnys gostam \u0161udi\u0146 sastaig\u014d\u021b; Tys vakar s\u016bl\u00e4ja,
  ka pac\u012bn\u00e4s ai olu, Lai n\u016b\u012bmu da j\u014d iz S\u012bvergolu.\\n\\nAs
  soku s\u012bvai: \\\"Tup\u00e4\u021b s\u0101t\u0101 nav\u0101 eist\u014d v\u012bta.
  Pastaig\u014d\u0161u. Lai \u0161\u016bgod asu aktivs kotr\u0101 l\u012bt\u0101.\\\"
  T\u00e1 muna I\u013c\u017een\u00e1 ai pr\u012bcu atsasauc: \\\"P\u012bkreitu! B\u0233\u0219
  darbeigs tys, kas \u0161udi\u0146 sliep\u014d\u021b brauc.\\\"\\n\\nVer\u016bs:
  jau obim sporta t\u0101rpus dab\u014djus\u00e1 I gleit\u0101 \u0161tabeleit\u012b
  salykus\u00e1. Ma\u0146 soka bols\u0101, kurs nac\u012b\u0161 \u012bbyldumus: \\\"Brauksim
  obi raudz\u00e4\u021b nazkodej\u016bs kolnus munus!\\\"\\n\\nNapaklaus\u00e4\u021b
  s\u012bvai - tuk\u0161a cereiba, Jai vyss kai n\u016bd\u016bm\u014dts, tai beja
  veic\u012bs. Part\u016b ka sp\u012bteiba i va\u013cd\u016bneiba Bej mont\u014dta
  nu vacvacm\u014dtis Stepcis.\\n\\n*\\n\\nA n\u016btyka tys se\u0146, pyrms laika
  gara: God\u016bs gryutij\u016bs iz\u0157aiz pec kara, Kod b\u014dbys vysu dar\u00e4,
  kod veir\u012b\u0161i bej d\u014drga monta; Jaunom s\u012bvom daudzom t\u012b naatg\u014d
  nu fronta.\\n\\nNu soltuma lai navajdz\u0101tu c\u012bs\u021b, Ai cytom Stepc\u00e1
  g\u014dja me\u017e\u0101 molku gr\u012bz\u021b. J\u014ds r\u00e1\u1e11z pi kryuma
  s\u00e4\u1e11 malnim ausu golym za\u010deit\u0219 Kai breinums rats, kas b\u014dbu
  laim\u00e1i syuteits.\\n\\nJ\u014ds runoj: \\\"Kura taidus ausu golus giutu, Tei
  laimeiga iz vysim myu\u017eim b\u0233tu. Part\u016b, ka vysod izapylda itys zababons:
  \\\"Veirs klausa tod kai cyuku gons...\\\"\\n\\nStepc\u00e1 nad\u016bm\u014d i paka\u013c
  za\u010dam \u013c\u016bb\u00e1, Nazav\u00e4r\u00e1 dau\u1e11z: t\u012b kryums voi
  gr\u014dv\u0219, voi d\u016bb\u00e1... I ko\u010d j\u014ds \u1e3faitom nabej bogots
  pyurs, J\u014ds \u1e3faitu veirim tyka liktin\u0219 syurs.\\n\\n*\\n\\nVot koln\u0101
  m\u00e1\u0219, na t\u014d\u013c nu \u021bo\u0161\u010dys m\u014djom, Kur jauneib\u0101
  nu ve\u010derinku g\u014djom; Pi kolna t\u014d jau aug pa kaidam kryumam... T\u00e1
  skots muns pie\u0161ki l\u012bk ma\u0146 palik\u021b dryumam\\n\\nT\u00e1pa\u021b
  na t\u014d\u013c l\u0101c za\u010deit\u0219 senej\u012bs; Ko\u010d palyktu tys I\u013c\u017eai
  napamaneit\u012bs! Tik, kas t\u016b d\u00e1v\u00e1! Jei atspier\u012bn\u012b dreiz\u0101
  Slei\u1e11 laimis zvieren\u00e1m tam tai\u0161ni viers\u0101!...\\n\\nAs mudri p\u014drzamatu,
  kur kolnam \u016btr\u0101 pus\u00e1 I nav ma\u0146 dalis: voi b\u0233\u0219 t\u016b
  n\u016bgivus\u00e1. Ai v\u0101zom atsasperu... D\u016bmoju par olu. T\u014dl\u012bn\u012b
  jau radzu sap\u0146u S\u012bvergolu.\\n\\nPec laicen\u00e1 jau dzerom olu, lyupys
  \u010d\u0101pstynoj\u016bt, I dau\u1e11z k\u016b filosofisku ai draugu p\u014drrunoj\u016bt:
  Cik maln\u014d \u012bt\u012bpeiba sird\u00e1i solta, Cik m\u012bram tyv\u014dk saticeiba
  bolta.\\n\\n*\\n\\nPar za\u010da medeibom ma\u0146 navaicojit, Ka atjauteigi esit
  \u2013 dag\u014ddojit! Ma\u0146 s\u0101t\u0101 I\u013c\u017ea napasc\u00e4 ni v\u014drda:
  Voi vakar za\u010di n\u016bgiu\u021b bejus\u00e1 j\u014ds k\u014drta.\\n\\n*\\n\\nPavuiceiba
  tam, kas klaus\u014ds: Ai sovim m\u012b\u017eim nabrau\u00e7 cyta auz\u014ds! 2009.\\n\\nPROFESIONAL\u014c  ORIENTACEJA\\n\\nPyrms
  me\u017ea \u0161kolys izlaiduma, Lai nav nikaida p\u014drprotuma, Op\u016bgs \u2014
  \u0161kolys p\u014drzin\u0219, C\u012bnejam\u012bs vyszin\u0219, Kod tam \u00bbnu
  aug\u0161ys\u00ab vieleits tyka, Klas\u00e1i sazapu\u013cc\u00e4\u021b lyka Pi lauzt\u014d
  b\u0101rza \u2014 bez lopu, plyka, Kur s\u014dc\u0101s lel\u014d zvieru styga.\\n\\nPat\u0219
  atsasied\u0219 iz pr\u012bdis zora Iz sovim \u0161ko\u013cn\u012bkim jys soka: \u00bbM\u012bl\u0233
  b\u0101rni! Kod n\u016bsvineits b\u0233\u0219 izlaidums, K\u016b dar\u00e4s tod
  s\u00e1vkurs nu jums?\u00ab\\n\\nIz calma izl\u0101c zvieren\u0161 mozs, Skots n\u014dk\u016btn\u012b
  tam oss: \u00bbMuns t\u0101vs pavysam palic\u0219 vacs, Ar pyu\u013com jys pa zorim
  l\u0101c \u2014 I r\u012bkstu sag\u014ddn\u012bks jau l\u0101ns; \u0160am dorbam
  j\u014dp\u012bl\u012bk ma\u0146 placs.\u00ab N\u016bsoka itai v\u014dver\u0101ns.\\n\\n\u00bbTaisei\u0161u
