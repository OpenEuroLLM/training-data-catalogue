  r\u00f6gz\u00edtik, hogy Megrendel\u0151, mint aj\u00e1nlatk\u00e9r\u0151 a k\u00f6zbeszerz\u00e9sekr\u0151l
  sz\u00f3l\u00f3 2015. \u00e9vi CXLIII. t\u00f6rv\u00e9ny (tov\u00e1bbiakban: Kbt.)
  115. \u00a7 (1)-(2) bekezd\u00e9s\u00e9ben foglalt elj\u00e1r\u00e1ssrend figyelembev\u00e9tel\u00e9vel
  k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1st folytatott le EKR001257492020 sz\u00e1mon
  S\u00e1rv\u00e1r, Eperjes utca fel\u00faj\u00edt\u00e1sa az \u00d6nkorm\u00e1nyzati
  feladatell\u00e1t\u00e1st szolg\u00e1l\u00f3 fejleszt\u00e9sek t\u00e1mogat\u00e1sa
  keret\u00e9ben. A k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s nyertese V\u00e1llalkoz\u00f3
  lett. Kbt. 131. \u00a7 alapj\u00e1n Megrendel\u0151 jelen szerz\u0151d\u00e9st k\u00f6ti
  V\u00e1llalkoz\u00f3val. A szerz\u0151d\u00e9s minden elem\u00e9ben megfelel a k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1s sor\u00e1n k\u00f6z\u00f6ttett szerz\u0151d\u00e9stervezetnek.\\n\\nII.
  A szerz\u0151d\u00e9st alkot\u00f3 dokumentumok:\\n\\n1. Annak ok\u00e1n, hogy jelen
  szerz\u0151d\u00e9st a Felek a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s alapj\u00e1n
  k\u00f6t\u00f6tt\u00e9k meg, a Felek kijelentik, hogy teljes meg\u00e1llapod\u00e1sukat
  nem kiz\u00e1r\u00f3lag jelen szerz\u0151d\u00e9s t\u00f6rzssz\u00f6vege tartalmazza.
  A k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s sor\u00e1n keletkezett iratokat \u00fagy
  kell tekinteni, mint amelyek a jelen szerz\u0151d\u00e9s elv\u00e1laszthatatlan
  r\u00e9szeit k\u00e9pezik, azzal egy\u00fctt olvasand\u00f3k \u00e9s \u00e9rtelmezend\u0151k,
  k\u00fcl\u00f6n\u00f6s tekintettel az al\u00e1bbi dokumentumokra:\\n\\n   - a Megrendel\u0151
  \u00e1ltal k\u00fcld\u00f6tt aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1s,\\n   -
  az aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1s mell\u00e9kletek\u00e9nt kiadott aj\u00e1nlatt\u00e9teli
  dokument\u00e1ci\u00f3 (K\u00f6zbeszerz\u00e9si Dokumentum),\\n   - a k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1sban k\u00f6z\u00f6ttett m\u0171szaki le\u00edr\u00e1s (K\u00f6zbeszerz\u00e9si
  Dokumentum),\\n   - a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s sor\u00e1n a kieg\u00e9sz\u00edt\u0151
  t\u00e1j\u00e9koztat\u00e1s keret\u00e9ben adott inform\u00e1ci\u00f3k,\\n\\n\u2013
  a V\u00e1llalkoz\u00f3 nyertes aj\u00e1nlata.\\n\\nA fenti dokumentumok k\u00f6z\u00f6tti,
  ugyanazon k\u00e9rd\u00e9sre vonatkoz\u00f3 b\u00e1rmely elt\u00e9r\u00e9s, ellentmond\u00e1s,
  \u00e9rtelmez\u00e9si neh\u00e9zs\u00e9g eset\u00e9n a dokumentumok hierarchi\u00e1ja
  (eml\u00edt\u00e9si sorrendben a legmagasabb rend\u0171vel kezdve) a k\u00f6vetkez\u0151:
  kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1sra adott aj\u00e1nlatk\u00e9r\u0151i
  v\u00e1laszok (amennyiben erre sor ker\u00fclt), az aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1s,
  K\u00f6zbeszerz\u00e9si Dokumentum, a V\u00e1llalkoz\u00f3 nyertes aj\u00e1nlata.
  A jelen alpontban eml\u00edtett dokumentumok egy\u00fcttesen: \u201eSzerz\u0151d\u00e9ses
  okm\u00e1nyok\u201d.\\n\\nA Szerz\u0151d\u0151 Felek r\u00f6gz\u00edtik, hogy a
  m\u0171szaki tartalommal kapcsolatosan ugyanazon k\u00e9rd\u00e9sre vonatkoz\u00f3
  b\u00e1rmely elt\u00e9r\u00e9s, ellentmond\u00e1s, \u00e9rtelmez\u00e9si neh\u00e9zs\u00e9g
  eset\u00e9n \u2013 k\u00fcl\u00f6n\u00f6sen a m\u0171szaki le\u00edr\u00e1s \u00e9s
  a k\u00f6lts\u00e9gvet\u00e9s elt\u00e9r\u00e9se, ellentmond\u00e1sa eset\u00e9n
  - a p\u00e1ly\u00e1zati tartalomnak legink\u00e1bb megfelel\u0151 m\u0171szaki tartalom
  az ir\u00e1nyad\u00f3. A p\u00e1ly\u00e1zati tartalomnak legink\u00e1bb megfelel\u0151
  m\u0171szaki tartalomr\u00f3l a Megrendel\u0151 k\u00e9pviselet\u00e9ben elj\u00e1r\u00f3
  M\u0171szaki ellen\u0151r jogosult nyilatkozni, illetve k\u00f6teles d\u00f6nteni.\\n\\n2.
  Jogszab\u00e1lyi rendelkez\u00e9st kiv\u00e9ve semmis minden olyan kik\u00f6t\u00e9s,
  amely ellent\u00e9tes a fentiekben felsorolt dokumentumok valamelyik\u00e9vel.\\n\\n3.
  Felek kijelentik, hogy az eml\u00edtett dokumentumok ugyan fizikailag nem ker\u00fclnek
  a szerz\u0151d\u00e9shez csatol\u00e1sra, azonban mindk\u00e9t f\u00e9l \u00e1ltal
  ismert azok tartalma.\\n\\nIII. A szerz\u0151d\u00e9s t\u00e1rgya\\n\\n1. A Megrendel\u0151
  megrendeli, a V\u00e1llalkoz\u00f3 pedig elv\u00e1llalja S\u00e1rv\u00e1r, Eperjes
  utca fel\u00faj\u00edt\u00e1s\u00e1t az \u00d6nkorm\u00e1nyzati feladatell\u00e1t\u00e1st
  szolg\u00e1l\u00f3 fejleszt\u00e9sek t\u00e1mogat\u00e1sa keret\u00e9ben a K\u00f6zbeszerz\u00e9si
  Dokumentumban, k\u00fcl\u00f6n\u00f6s tekintettel a M\u0171szaki le\u00edr\u00e1sban
  meghat\u00e1rozottak szerint a jelen szerz\u0151d\u00e9sben meghat\u00e1rozott d\u00edj\u00e9rt.\\n\\n2.
  A V\u00e1llalkoz\u00f3 nyilatkozik, hogy a munkater\u00fcletet egy tapasztalt kivitelez\u0151t\u0151l
  elv\u00e1rhat\u00f3 gondoss\u00e1ggal ellen\u0151rizte, illetve megtekintette, a
  dokument\u00e1ci\u00f3t \u00e1ttanulm\u00e1nyozta. V\u00e1llalkoz\u00f3 kijelenti,
  hogy az \u00e1ltala adott aj\u00e1nlat teljes k\u00f6r\u0171, \u00e9s tudom\u00e1sul
  veszi, hogy a nem megfelel\u0151 felm\u00e9r\u00e9sb\u0151l, vagy egy\u00e9b (pl.
  sz\u00e1m\u00edt\u00e1si) hib\u00e1b\u00f3l ad\u00f3d\u00f3 t\u00f6bbletmunk\u00e1k
  miatt megt\u00e9r\u00edt\u00e9si ig\u00e9nynel a Megrendel\u0151vel szemben nem
  l\u00e9phet fel. V\u00e1llalkoz\u00f3 nyilatkozik, hogy a munk\u00e1k nem megfelel\u0151
  megismer\u00e9s\u00e9vel \u00f6sszef\u00fcgg\u00e9sben k\u00f6vetel\u00e9ssel nem
  l\u00e9phet fel, arra k\u00e9sedelmi okk\u00e9nt nem hivatkozhat.\\n\\n3. Az \u00e9p\u00edt\u00e9si
  beruh\u00e1z\u00e1s \u00e9p\u00edt\u00e9si hat\u00f3s\u00e1gi enged\u00e9lyhez nem
  k\u00f6t\u00f6tt.\\n\\nIV. A V\u00e1llalkoz\u00f3i d\u00edj\\n\\n1. A V\u00e1llalkoz\u00f3t
  a szerz\u0151d\u00e9s t\u00e1rgy\u00e1nak megval\u00f3s\u00edt\u00e1s\u00e1\u00e9rt,
  teljes\u00edt\u00e9s\u00e9nek ellen\u00e9rt\u00e9kek\u00e9nt egy\u00f6sszeg\u0171
  \u00e1tal\u00e1ny\u00e1rk\u00e9nt (v\u00e1llalkoz\u00f3i d\u00edjk\u00e9nt nett\u00f3
  \u2026\u2026.- Ft + \u00c1FA illeti meg).\\n\\n2. A Felek r\u00f6gz\u00edtik, hogy
  a V\u00e1llalkoz\u00f3 v\u00e1llalkoz\u00f3i d\u00edj\u00e1nak sz\u00e1m\u00edt\u00e1sa
  sor\u00e1n figyelembe vette, hogy az elj\u00e1r\u00e1s sor\u00e1n kiadott anyagokban,
  aj\u00e1nlati dokument\u00e1ci\u00f3nban, a le\u00edr\u00e1sokban, tervekben foglaltakat
  egys\u00e9ges eg\u00e9szk\u00e9nt kell kezelni, \u00e9s a kivitelez\u00e9s sor\u00e1n
  minden olyan szakmai tartalmat meg kell val\u00f3s\u00edtania, amely b\u00e1rmelyik
  dokumentumban szerepel.\\n\\n3. Fentiekre tekintettel a V\u00e1llalkoz\u00f3 t\u00f6bbletmunka
  elsz\u00e1mol\u00e1s\u00e1ra egy\u00e1ltal\u00e1n nem (Ptk. 6:244. \u00a7), p\u00f3tmunk\u00e1k
  elsz\u00e1mol\u00e1s\u00e1ra pedig csak a Kbt-ben a kieg\u00e9sz\u00edt\u0151 munk\u00e1k
  megrendel\u00e9s\u00e9re vonatkoz\u00f3 szab\u00e1lyok betart\u00e1sa mellett, a
  Megrendel\u0151vel el\u0151zetesen egyeztetve, \u00e9s csak abban az esetben jogosult,
  amennyiben azok ut\u00f3lagosan, a Megrendel\u0151 \u00e1ltal a kor\u00e1bbiakban
  \u00edrtakhoz k\u00e9pest k\u00fcl\u00f6n megrendelt munkat\u00f6bbletet jelentenek,
  vagy olyanok, amelyek a V\u00e1llalkoz\u00f3t\u00f3l kell\u0151en gondos k\u00f6r\u00fclt\u00e9kt\u00e9nt
  mellett sem voltak el\u0151rel\u00e1that\u00f3ak (Ptk. 6:245.\u00a7, Kbt. 141. \u00a7
  figyelembev\u00e9tel\u00e9vel).\\n\\n4. Amennyiben a Megrendel\u0151 \u00e1ltal
  elrendelt p\u00f3tmunka anyag- \u00e9s d\u00edjt\u00e9telei a V\u00e1llalkoz\u00f3
  \u00e1ltal beadott \u00e1raj\u00e1nlat t\u00e9teles k\u00f6lts\u00e9gvet\u00e9s\u00e9ben
  nem szerepelnek, a V\u00e1llalkoz\u00f3 a p\u00f3tmunka \u00e1raj\u00e1nlat\u00e1ban
  az igazolt anyag- \u00e9s beszerz\u00e9si k\u00f6lts\u00e9geket, valamint a k\u00f6zbeszerz\u00e9si
  aj\u00e1nlatban alkalmazott rezsiorad\u00edjjal sz\u00e1molt munkad\u00edjat szerepeltetheti.\\n\\n5.
  (1.k\u00f6zbeszerz\u00e9si r\u00e9sz tekintet\u00e9ben) A kifizet\u00e9s sor\u00e1n
  figyelembe kell venni az \u00e1ltal\u00e1nos forgalmi ad\u00f3r\u00f3l sz\u00f3l\u00f3
  2007. \u00e9vi CXXVII. t\u00f6rv\u00e9ny vonatkoz\u00f3 rendelkez\u00e9seit is [2007.
  \u00e9vi CXXVII. t\u00f6rv\u00e9ny 142. paragrafus (1) bekezd\u00e9s b) pontja].\\n\\n6.
  Megrendel\u0151 kijelenti, hogy a v\u00e1llalkoz\u00f3 d\u00edj (aj\u00e1nlati \u00e1r)
  p\u00e9nz\u00fcgyi fedezete a 442061 sz. EBR 42 p\u00e1ly\u00e1zati forr\u00e1sb\u00f3l
  \u00e1ll rendelkez\u00e9sre, illet\u0151leg az esed\u00e9kess\u00e9gkor rendelkez\u00e9sre
  fog \u00e1llni, illetve a sz\u00fcks\u00e9ges t\u00f6bblet p\u00e9nz\u00fcgyi fedezettel
  saj\u00e1t k\u00f6lts\u00e9gvet\u00e9si forr\u00e1sb\u00f3l rendelkezik.\\n\\nV.
  Fizet\u00e9si felt\u00e9telek\\n\\n1. A Megrendel\u0151 a sz\u00e1mla ellen\u00e9rt\u00e9k\u00e9t
  a Polg\u00e1ri T\u00f6rv\u00e9nyk\u00f6nyvr\u0151l sz\u00f3l\u00f3 2013. \u00e9vi
  V. t\u00f6rv\u00e9ny 6:130. \u00a7 (1)-(2) bekezd\u00e9se alapj\u00e1n a sz\u00e1mla
  k\u00e9zhezv\u00e9tel\u00e9t\u0151l sz\u00e1m\u00edtott 30 napon bel\u00fcl \u00e1tutal\u00e1ssal
  egyenl\u00edti ki.\\n\\n2. Amennyiben a V\u00e1llalkoz\u00f3 a teljes\u00edt\u00e9shez
  alv\u00e1llalkoz\u00f3t vesz ig\u00e9nybe a Megrendel\u0151 a sz\u00e1mla ellen\u00e9rt\u00e9k\u00e9t
  - a 2013. \u00e9vi V. t\u00f6rv\u00e9ny 6:130. \u00a7 (1) \u00e9s (2) bekezd\u00e9s\u00e9t\u0151l
  elt\u00e9r\u0151en - a 322/2015. (X. 30.) Korm. rendelet 32./A. \u00e9s 32/B. \u00a7-a
  alapj\u00e1n az al\u00e1bbiak szerint egyenl\u00edti ki:\\n\\n   a) az aj\u00e1nlattev\u0151k\u00e9nt
  szerz\u0151d\u0151 felek legk\u00e9s\u0151bb a teljes\u00edt\u00e9s elismer\u00e9s\u00e9nek
  id\u0151pontj\u00e1ig k\u00f6telesek nyilatkozatot tenni az aj\u00e1nlatk\u00e9r\u0151nek,
  hogy k\u00f6z\u00fcl\u00fck melyik mekkora \u00f6sszegre jogosult az ellenszolg\u00e1ltat\u00e1sb\u00f3l;\\n   b)
  az \u00f6sszes aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151 f\u00e9l legk\u00e9s\u0151bb
  a teljes\u00edt\u00e9s elismer\u00e9s\u00e9nek id\u0151pontj\u00e1ig k\u00f6teles
  nyilatkozatot tenni, hogy az \u00e1ltala a teljes\u00edt\u00e9sbe bevont alv\u00e1llalkoz\u00f3k
  egyenk\u00e9nt mekkora \u00f6sszegre jogosultak az ellenszolg\u00e1ltat\u00e1sb\u00f3l,
  egyidej\u0171leg felh\u00edvja az alv\u00e1llalkoz\u00f3kat, hogy \u00e1ll\u00edts\u00e1k
  ki ezen sz\u00e1ml\u00e1ikat;\\n   c) az aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151
  felek mindegyike a teljes\u00edt\u00e9s elismer\u00e9s\u00e9t k\u00f6vet\u0151en
  \u00e1ll\u00edtja ki sz\u00e1ml\u00e1j\u00e1t, a sz\u00e1ml\u00e1ban r\u00e9szleteze
  az alv\u00e1llalkoz\u00f3i teljes\u00edt\u00e9s, valamint az aj\u00e1nlattev\u0151i
  teljes\u00edt\u00e9s m\u00e9rt\u00e9k\u00e9t;\\n   d) a c) pont szerint a sz\u00e1ml\u00e1ban
  felt\u00fcntetett alv\u00e1llalkoz\u00f3i teljes\u00edt\u00e9s ellen\u00e9rt\u00e9k\u00e9t
  az aj\u00e1nlatk\u00e9r\u0151k\u00e9nt szerz\u0151d\u0151 f\u00e9l \u2013 eur\u00f3pai
  uni\u00f3s t\u00e1mogat\u00e1s eset\u00e9n sz\u00e1ll\u00edt\u00f3it kifizet\u00e9s
  sor\u00e1n a kifizet\u00e9sre k\u00f6teles szervezet \u2013 tizen\u00f6t napon bel\u00fcl
  \u00e1tutalja az aj\u00e1nlattev\u0151knek;\\n   e) az aj\u00e1nlattev\u0151k\u00e9nt
  szerz\u0151d\u0151 f\u00e9l halad\u00e9ktalanul kiegyenl\u00edti az alv\u00e1llalkoz\u00f3k
  sz\u00e1ml\u00e1it, vagy az alv\u00e1llalkoz\u00f3val k\u00f6t\u00f6tt szerz\u0151d\u00e9sben
  foglaltak szerint az alv\u00e1llalkoz\u00f3i d\u00edj egy r\u00e9sz\u00e9t visszatartja;\\n   f)
  az aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151 felek \u00e1tadj\u00e1k az
  e) pont szerinti \u00e1tutal\u00e1sok igazol\u00e1sainak m\u00e1solatait;\\n   g)
  az aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151 felek \u00e1ltal beny\u00fajtott
  sz\u00e1ml\u00e1ban megjel\u00f6lt, f\u0151v\u00e1llalkoz\u00f3i teljes\u00edt\u00e9s
  ellen\u00e9rt\u00e9k\u00e9t az aj\u00e1nlatk\u00e9r\u0151k\u00e9nt szerz\u0151d\u0151
  f\u00e9l \u2013 eur\u00f3pai uni\u00f3s t\u00e1mogat\u00e1s eset\u00e9n sz\u00e1ll\u00edt\u00f3it
  kifizet\u00e9s sor\u00e1n a kifizet\u00e9sre k\u00f6teles szervezet \u2013 tizen\u00f6t
  napon bel\u00fcl \u00e1tutalja az aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151
  feleknek;\\n   h) ha az aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151 felek
  valamelyike az e) vagy az f) pont szerinti k\u00f6telezetts\u00e9get nem teljes\u00edti,
  az ellenszolg\u00e1ltat\u00e1s fennmarad\u00f3 r\u00e9sz\u00e9t az aj\u00e1nlatk\u00e9r\u0151
  (vagy a kifizet\u00e9sre k\u00f6teles szervezet) \u00f6rizi, \u00e9s az akkor illeti
  meg az aj\u00e1nlattev\u0151t, ha az aj\u00e1nlatk\u00e9r\u0151 r\u00e9sz\u00e9re
  igazolja, hogy az e) vagy az f) pont szerinti k\u00f6telezetts\u00e9get teljes\u00edtette,
  vagy hitelt \u00e9rdeml\u0151 irattal igazolja, hogy az alv\u00e1llalkoz\u00f3 vagy
  szakember nem jogosult az aj\u00e1nlattev\u0151 \u00e1ltal a b) pont szerint bejelentett
  \u00f6sszegre vagy annak egy r\u00e9sz\u00e9re;\\n\\ni) r\u00e9szben vagy eg\u00e9szben
  eur\u00f3pai uni\u00f3s t\u00e1mogat\u00e1sb\u00f3l megval\u00f3s\u00edtott k\u00f6zbeszerz\u00e9s
  eset\u00e9n\\na d) pont szerinti hat\u00e1rid\u0151 harminc nap.\\n\\nA V\u00e1llalkoz\u00f3
  - a 322/2015. (X. 30.) Korm. rendelet 32/B. \u00a7 (1) bekezd\u00e9se alapj\u00e1n
  - az\\nalv\u00e1llalkoz\u00f3nak a havonta nett\u00f3 m\u00f3don sz\u00e1m\u00edtott
  200 000 forintot meghalad\u00f3 kifizet\u00e9s\u00e9t abban\\naz esetben teljes\u00edtheti
  visszatart\u00e1si k\u00f6telezetts\u00e9g n\u00e9lk\u00fcl, ha\\n\\na) az alv\u00e1llalkoz\u00f3
  az aj\u00e1nlattev\u0151 rendelkez\u00e9s\u00e9re bocs\u00e1t a t\u00e9nyleges kifizet\u00e9s
  id\u0151pontj\u00e1t\u00f3l\\nsz\u00e1m\u00edtott 30 napn\u00e1l nem r\u00e9gebbi
  nemleges ad\u00f3igazol\u00e1st,\\nb) az alv\u00e1llalkoz\u00f3 a kifizet\u00e9s
  id\u0151pontj\u00e1ban szerepel a k\u00f6ztartoz\u00e1smentes ad\u00f3z\u00f3i\\nadatb\u00e1zisban,
  vagy\\nc) az aj\u00e1nlattev\u0151 rendelkez\u00e9s\u00e9re bocs\u00e1tja az ad\u00f3igazgat\u00e1si
  elj\u00e1r\u00e1s r\u00e9szletszab\u00e1lyair\u00f3l sz\u00f3l\u00f3\\nkorm\u00e1nyrendelet
  szerinti k\u00f6ztartoz\u00e1smentes ad\u00f3z\u00f3i min\u0151s\u00e9gr\u0151l
  sz\u00f3l\u00f3 igazol\u00e1st.\\n\\n3. Sz\u00e1ml\u00e1z\u00e1si \u00fctemek:\\n\\n3.1
  A V\u00e1llalkoz\u00f3 a teljes\u00edt\u00e9st k\u00f6vet\u0151en jogosult sz\u00e1mla
  beny\u00fajt\u00e1s\u00e1ra, tov\u00e1bb\u00e1 - annak ig\u00e9nybev\u00e9tel\\neset\u00e9n
  - el\u0151legre jogosult.\\n\\n- El\u0151legsz\u00e1mla:\\nA V\u00e1llalkoz\u00f3
  a Kbt. 135. \u00a7 (7) bekezd\u00e9se alapj\u00e1n a szerz\u0151d\u00e9sben foglalt
  \u2013 tartal\u00e9kkeret \u00e9s\\n\u00e1ltal\u00e1nos forgalmi ad\u00f3 n\u00e9lk\u00fcl
  sz\u00e1m\u00edtott \u2013 teljes ellenszolg\u00e1ltat\u00e1s 30 %-\u00e1nak megfelel\u0151
  \u00f6sszeg\\nig\u00e9nybev\u00e9tel\u00e9re jogosult.\\n\\nA V\u00e1llalkoz\u00f3
  az el\u0151leg ig\u00e9nybev\u00e9tel\u00e9re vonatkoz\u00f3 nyilatkozat\u00e1t,
  \u00e9s/vagy az el\u0151legr\u0151l ki\u00e1ll\u00edtott\\nsz\u00e1ml\u00e1t legk\u00e9s\u0151bb
  az \u00e9p\u00edt\u00e9si munkater\u00fclet \u00e1tad\u00e1s\u00e1nak sz\u00e1m\u00edtott
  5 napon bel\u00fcl k\u00f6teles beny\u00fajtani.\\nAz \u00e9p\u00edt\u00e9si munkater\u00fclet
  \u00e1tad\u00e1s\u00e1nak id\u0151pontja 2021. janu\u00e1r 5. napja. V\u00e1llalkoz\u00f3
  ezt k\u00f6vet\u0151en\\njogosult el\u0151legig\u00e9nyl\u00e9st \u00e9s/vagy az
  el\u0151legr\u0151l ki\u00e1ll\u00edtott sz\u00e1ml\u00e1t beny\u00fajtani.\\n\\nA
  Megrendel\u0151 - az \u00e9p\u00edt\u00e9si beruh\u00e1z\u00e1sok, valamint az \u00e9p\u00edt\u00e9si
  beruh\u00e1z\u00e1sokhoz kapcsol\u00f3d\u00f3 tervez\u0151i\\n\u00e9s m\u00e9rn\u00f6ki
  szolg\u00e1ltat\u00e1sok k\u00f6zbeszerz\u00e9s\u00e9nek r\u00e9szletes szab\u00e1lyair\u00f3l
  sz\u00f3l\u00f3 322/2015. (X.30.)\\nKorm. rendelet 30. \u00a7 (1) bekezd\u00e9se
  alapj\u00e1n - a V\u00e1llalkoz\u00f3 \u00e1ltal beny\u00fajtott el\u0151leg sz\u00e1ml\u00e1t\\nlegk\u00e9s\u0151bb
  az \u00e9p\u00edt\u00e9si munkater\u00fclet \u00e1tad\u00e1s\u00e1t k\u00f6vet\u0151
  15 napon bel\u00fcl k\u00f6teles kiegyenl\u00edteni.\\n\\n- Sz\u00e1mla:\\nV\u00e1llalkoz\u00f3
  2021. m\u00e1rcius 16. napj\u00e1t k\u00f6vet\u0151en jogosult sz\u00e1ml\u00e1t
  ki\u00e1ll\u00edtani.\\n\\nA V\u00e1llalkoz\u00f3 sz\u00e1ml\u00e1t a Megrendel\u0151
  nev\u00e9re k\u00f6teles ki\u00e1ll\u00edtani.\\n\\n3.2 A Felek r\u00f6gz\u00edtik,
  hogy a sz\u00e1mla beny\u00fajt\u00e1s\u00e1nak felt\u00e9tele a Megrendel\u0151
  \u00e1ltal kiadott teljes\u00edt\u00e9sigazol\u00e1s.\\n\\n3.3 A sz\u00e1ml\u00e1t
  a Megrendel\u0151 nev\u00e9re kell ki\u00e1ll\u00edtani, \u00e9s 2 p\u00e9ld\u00e1nyban
  a Megrendel\u0151h\u00f6z kell beny\u00fajtani. A\\nsz\u00e1ml\u00e1nak tartalmaznia
  kell: a tev\u00e9kenys\u00e9g pontos meghat\u00e1roz\u00e1s\u00e1t \u00e9s annak
  TE\u00c1OR sz\u00e1m\u00e1t,\\nV\u00e1llalkoz\u00f3 bankj\u00e1nak nev\u00e9t, banksz\u00e1mlasz\u00e1m\u00e1t,
  ad\u00f3sz\u00e1m\u00e1t, Megrendel\u0151 ad\u00f3sz\u00e1m\u00e1t, v\u00e1llalkoz\u00f3i\\nszerz\u0151d\u00e9s
  sz\u00e1m\u00e1ra t\u00f6rt\u00e9n\u0151 hivatkoz\u00e1st, v\u00e1llalkoz\u00f3i
  szerz\u0151d\u00e9s t\u00e1rgy\u00e1ra t\u00f6rt\u00e9n\u0151 hivatkoz\u00e1st,
  a\\n\u201er\u00e9szsz\u00e1mla\u201d vagy \u201ev\u00e9gssz\u00e1mla\u201d megnevez\u00e9st.
  A kifizet\u00e9sek a V\u00e1llalkoz\u00f3 \u2026\u2026\u2026\u2026\u2026\u2026 sz\u00e1m\u00fa\\nsz\u00e1ml\u00e1j\u00e1ra
  t\u00f6rt\u00e9n\u0151 \u00e1tutal\u00e1ssal t\u00f6rt\u00e9nnek.\\n\\n4 K\u00e9sedelmi
  kamat:\\nFizet\u00e9si k\u00e9sedelem eset\u00e9n Megrendel\u0151 a Ptk. 6:155.
  \u00a7-\u00e1ban foglaltak szerinti k\u00e9sedelmi kamat\\nmegfizet\u00e9s\u00e9re
  k\u00f6telesek. V\u00e1llalkoz\u00f3 sz\u00e1ml\u00e1j\u00e1n szerepl\u0151 minden
  ezzel ellent\u00e9tes rendelkez\u00e9s\\neset\u00e9n is a fenti szab\u00e1ly \u00e9rv\u00e9nyes\u00fcl
  a Felek viszonylat\u00e1ban.\\n\\nA Kbt. 136. \u00a7 rendelkez\u00e9seinek megfelel\u0151en
  Megrendel\u0151 el\u0151\u00edrja, hogy V\u00e1llalkoz\u00f3:\\n\\na) nem fizethet,
  illetve sz\u00e1mlahat el a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9vel \u00f6sszef\u00fcgg\u00e9sben
  olyan k\u00f6lts\u00e9geket, amelyek a Kbt. 62. \u00a7 (1) bekezd\u00e9s k) pont
  ka)-kb) alponja szerinti felt\u00e9teleknek nem megfelel\u0151 t\u00e1rsas\u00e1g
  tekintet\u00e9ben mer\u00fclnek fel, \u00e9s amelyek a nyertes aj\u00e1nlattev\u0151
  ad\u00f3k\u00f6teles j\u00f6vedelm\u00e9nek cs\u00f6kkent\u00e9s\u00e9re alkalmasak;\\n\\nb)
  a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9nek teljes id\u0151tartama alatt
  tulajdonosi szerkezet\u00e9t az aj\u00e1nlatk\u00e9r\u0151 sz\u00e1m\u00e1ra megismerhet\u0151v\u00e9
  teszi \u00e9s a Kbt. 143. \u00a7 (3) bekezd\u00e9se szerinti \u00fcgyletekr\u0151l
  az aj\u00e1nlatk\u00e9r\u0151t halad\u00e9ktalanul \u00e9rtes\u00edti.\\n\\nA Kbt.
  135. \u00a7-\u00e1nak (1) bekezd\u00e9se alapj\u00e1n a Megrendel\u0151 a szerz\u0151d\u00e9s
  teljes\u00edt\u00e9s\u00e9nek elismer\u00e9s\u00e9r\u0151l (teljes\u00edt\u00e9sigazol\u00e1s)
  vagy az elismer\u00e9s megtagad\u00e1s\u00e1r\u00f3l legk\u00e9s\u0151bb a V\u00e1llalkoz\u00f3
  teljes\u00edt\u00e9s\u00e9t\u0151l vagy az err\u0151l sz\u00f3l\u00f3 \u00edr\u00e1sbeli
  \u00e9rtes\u00edt\u00e9s k\u00e9zhezv\u00e9tel\u00e9t\u0151l sz\u00e1m\u00edtott
  tizen\u00f6t napon bel\u00fcl \u00edr\u00e1sban k\u00f6teles nyilatkozni.\\n\\nMegrendel\u0151
  k\u00f6teles dokument\u00e1lni a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9re
  vonatkoz\u00f3 adatokat, ennek keret\u00e9ben k\u00f6teles ellen\u0151rizni \u00e9s
  dokument\u00e1lni azon szerz\u0151d\u00e9sek k\u00f6telezetts\u00e9gek teljes\u00edt\u00e9s\u00e9t,
  amelyeket a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sban az \u00e9rt\u00e9kel\u00e9s
  sor\u00e1n figyelembe vett, valamint minden, a szerz\u0151d\u00e9sben foglaltakt\u00f3l
  elt\u00e9r\u0151 teljes\u00edt\u00e9st, annak okait \u00e9s - adott esetben - a
  szerz\u0151d\u00e9sszeg\u00e9ssel kapcsolatos ig\u00e9nyek \u00e9rv\u00e9nyes\u00edt\u00e9s\u00e9t.\\n\\nVI.
  A teljes\u00edt\u00e9si hat\u00e1rideje, helye \u00e9s m\u00f3dja:\\n\\n1. A teljes\u00edt\u00e9si
  hat\u00e1rid\u0151k:\\n\\nA V\u00e1llalkoz\u00f3 a beruh\u00e1z\u00e1st legk\u00e9s\u0151bb
  a szerz\u0151d\u00e9s hat\u00e1lya l\u00e9p\u00e9s\u00e9t\u0151l sz\u00e1m\u00edtott
  150 napon bel\u00fcl k\u00f6teles teljes\u00edteni.\\n\\nA Felek r\u00f6gz\u00edtik,
  hogy a V\u00e1llalkoz\u00f3 el\u0151teljes\u00edt\u00e9sre jogosult.\\n\\n2. A teljes\u00edt\u00e9s
  helye: 9600 S\u00e1rv\u00e1r, Eperjes utca Hrsz.: 2633\\n\\n3. A teljes\u00edt\u00e9s
  m\u00f3dja:\\n\\n3.1. Megrendel\u0151 a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9nek
  ellen\u0151rz\u00e9se sor\u00e1n az \u00e9p\u00edt\u00e9si napl\u00f3 adatai alapj\u00e1n
  ellen\u0151rzi, hogy a teljes\u00edt\u00e9sben csak a Kbt. 138. \u00a7 (2) \u00e9s
  (3) bekezd\u00e9s\u00e9ben foglaltaknak megfelel\u0151 alv\u00e1llalkoz\u00f3 vesz
  r\u00e9szt.\\n\\n3.1 V\u00e1llalkoz\u00f3 a munk\u00e1latokhoz a vonatkoz\u00f3
  \u00e9s hat\u00e1lyos jogszab\u00e1lyoknak megfelel\u0151 anyagokat, szerkezeteket
  \u00e9s berendez\u00e9seket haszn\u00e1lhat fel.\\n\\n3.2 V\u00e1llalkoz\u00f3 nem
  felel\u0151s a mulaszt\u00e1sok\u00e9rt, ha a mulaszt\u00e1s oka vis maior eredm\u00e9nye.
  A V\u00e1llalkoz\u00f3 csak abban az esetben hivatkozhat vis major esem\u00e9nyre,
  ha \u00e9rtes\u00edtette arr\u00f3l a Megrendel\u0151t, okainak \u00e9s v\u00e1rhat\u00f3
  id\u0151tartam\u00e1nak r\u00e9szletez\u00e9se mellett.\\n\\nMegrendel\u0151 k\u00f6teles
  a szerz\u0151d\u00e9sszer\u0171en teljes\u00edtett munk\u00e1t \u00e1tvenni, a teljes\u00edt\u00e9sigazol\u00e1sokat
  kiadni \u00e9s a v\u00e1llalkoz\u00e1si d\u00edjat megfizetni.\\n\\nVII. A Megrendel\u0151
  jogai\\n\\n1. A Megrendel\u0151 k\u00f6teles a v\u00e1llalkoz\u00f3i d\u00edjat
  a jelen szerz\u0151d\u00e9sben foglaltak szerint a V\u00e1llalkoz\u00f3 r\u00e9sz\u00e9re
  megfizetni.\\n\\n3. A Megrendel\u0151 k\u00f6teles a rendelkez\u00e9sre \u00e1ll\u00f3
  kiviteli m\u0171szaki tervdokument\u00e1ci\u00f3 kivitelez\u00e9shez sz\u00fcks\u00e9ges
  t\u00f6bblet p\u00e9ld\u00e1nyait (2 p\u00e9ld\u00e1ny pap\u00edralap\u00fa forma)
  a V\u00e1llalkoz\u00f3 r\u00e9sz\u00e9re a szerz\u0151d\u00e9sk\u00f6t\u00e9skor
  \u00e1tadni.\\n\\n4. A munkater\u00fclet \u00e1tad\u00e1s\u00e1ra a szerz\u0151d\u00e9sk\u00f6t\u00e9st
  k\u00f6vet\u0151 15 napon bel\u00fcl ker\u00fcl sor. A Felek k\u00f6telesek az \u00e1tad\u00e1s-\u00e1tv\u00e9telr\u0151l
  jegyz\u0151k\u00f6nyvet felvenni, valamint az \u00e1tad\u00e1s-\u00e1tv\u00e9tel
  napj\u00e1n az \u00e9p\u00edt\u0151ipari kivitelez\u00e9si tev\u00e9kenys\u00e9gr\u0151l
  sz\u00f3l\u00f3 191/2009. (IX. 15.) Korm. rendelet alapj\u00e1n az elektronikus
  \u00e9p\u00edt\u00e9si napl\u00f3t megnyitni.\\n\\nAz \u00e9p\u00edt\u00e9si napl\u00f3bejegyz\u00e9sre
  Megrendel\u0151 k\u00e9pviselet\u00e9ben a m\u0171szaki ellen\u0151r, V\u00e1llalkoz\u00f3
  r\u00e9sz\u00e9r\u0151l \u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026
  jogosult.\\n\\nA Megrendel\u0151 az utas\u00edt\u00e1saikat els\u0151sorban az \u00e9p\u00edt\u00e9si
  napl\u00f3ba t\u00f6rt\u00e9n\u0151 bejegyz\u00e9ssel jogosult k\u00f6z\u00f6lni
  a V\u00e1llalkoz\u00f3val.\\n\\n5. A Megrendel\u0151 szavatolja, hogy a jelen szerz\u0151d\u00e9s
  t\u00e1rgy\u00e1t k\u00e9pez\u0151 k\u00f6telezetts\u00e9gek teljes\u00edt\u00e9s\u00e9t
  harmadik szem\u00e9ly joga nem korl\u00e1tozza.\\n\\n6. A Megrendel\u0151, illetve
  az \u00e1ltala megb\u00edzott szervezet, vagy szem\u00e9ly jogosultak a munka v\u00e9gz\u00e9s\u00e9t
  \u00e9s a felhaszn\u00e1l\u00e1sra ker\u00fcl\u0151 anyagokat b\u00e1rmikor, mindenf\u00e9le
  korl\u00e1toz\u00e1s n\u00e9lk\u00fcl ellen\u0151rizni. A V\u00e1llalkoz\u00f3 nem
  mentes\u00fcl a felel\u0151ss\u00e9g al\u00f3l, ha a Megrendel\u0151 az ellen\u0151rz\u00e9st
  elmulasztotta, vagy nem megfelel\u0151en v\u00e9gezte el.\\n\\n7. A Megrendel\u0151
  jogosult a V\u00e1llalkoz\u00f3hoz a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9vel
  kapcsolatban k\u00e9rd\u00e9seket, illetve \u00e9szrev\u00e9teleket tenni az \u00e9p\u00edt\u00e9si
  napl\u00f3ban t\u00f6rt\u00e9n\u0151 bejegyz\u00e9s \u00fatj\u00e1n, vagy \u00edr\u00e1sban.
  A V\u00e1llalkoz\u00f3 k\u00f6teles a Megrendel\u0151 k\u00e9rd\u00e9seire, illetve
  \u00e9szrev\u00e9teleire a k\u00e9rd\u00e9s felmer\u00fcl\u00e9st\u0151l, illetve
  az \u00e9szrev\u00e9tel megt\u00e9telet\u0151l sz\u00e1m\u00edtott 5 munkanapon
  bel\u00fcl reag\u00e1lni.\\n\\nVIII. A V\u00e1llalkoz\u00f3 jogai \u00e9s k\u00f6telezetts\u00e9gei\\n\\n1.
  A V\u00e1llalkoz\u00f3 k\u00f6teles a saj\u00e1t k\u00f6lts\u00e9g\u00e9re biztos\u00edtani
  a megl\u00e9v\u0151 h\u00e1l\u00f3zatokr\u00f3l kivitelez\u00e9si munk\u00e1khoz
  sz\u00fcks\u00e9ges iv\u00f3v\u00edz mennyis\u00e9g\u00e9t, valamint az elektromos
  energia mennyis\u00e9g\u00e9t.\\n\\n2. A V\u00e1llalkoz\u00f3 jogosult a Megrendel\u0151h\u00f6z
  a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9vel kapcsolatban k\u00e9rd\u00e9seket,
  illetve \u00e9szrev\u00e9teleket tenni az \u00e9p\u00edt\u00e9si napl\u00f3ban t\u00f6rt\u00e9n\u0151
  bejegyz\u00e9s \u00fatj\u00e1n, vagy \u00edr\u00e1sban. A Megrendel\u0151 k\u00f6teles
  a V\u00e1llalkoz\u00f3 k\u00e9rd\u00e9seire, illetve \u00e9szrev\u00e9teleire a
  k\u00e9rd\u00e9s felmer\u00fcl\u00e9st\u0151l, illetve az \u00e9szrev\u00e9tel megt\u00e9telet\u0151l
  sz\u00e1m\u00edtott 5 munkanapon bel\u00fcl reag\u00e1lni.\\n\\n3. V\u00e1llalkoz\u00f3
  k\u00f6telezetts\u00e9gei kiterjednek a szakmai felel\u0151ss\u00e9gre, a szerz\u0151d\u00e9sben
  meghat\u00e1rozott c\u00e9lra val\u00f3 alkalmass\u00e1gra, a m\u0171szaki le\u00edr\u00e1sban
  foglaltak els\u0151 oszt\u00e1ly\u00fa min\u0151s\u00e9g\u0171 megval\u00f3s\u00edt\u00e1s\u00e1ra,
  illetve a v\u00e1llalt szerz\u0151d\u00e9si hat\u00e1rid\u0151k marad\u00e9ktalan
  betart\u00e1s\u00e1ra.\\n\\n4. A V\u00e1llalkoz\u00f3 k\u00f6teles a kivitelez\u00e9s
  teljes id\u0151tartama alatt biztos\u00edtani a ment\u0151szolg\u00e1lat, a t\u0171zolt\u00f3s\u00e1g
  \u00e9s a rend\u0151rs\u00e9g j\u00e1rm\u0171veinek a k\u00f6zelked\u00e9s\u00e9t.\\n\\n5.
  A kivitelez\u00e9s sor\u00e1n a V\u00e1llalkoz\u00f3 k\u00f6teles figyelembe venni
  az \u00e9p\u00edtkez\u00e9ssel kapcsolatos biztons\u00e1gi \u00e9s eg\u00e9szs\u00e9g\u00fcgyi
  k\u00e9rd\u00e9sekr\u0151l sz\u00f3l\u00f3, a Nemzetk\u00f6zi Munka\u00fcgyi Konferencia
  1988. \u00e9vi 75. \u00fcl\u00e9szak\u00e1n elfogadott 167. sz\u00e1m\u00fa Egyezm\u00e9ny
  kihirdet\u00e9s\u00e9r\u0151l sz\u00f3l\u00f3 2000. \u00e9vi LXXX. t\u00f6rv\u00e9ny
  rendelkez\u00e9seit. A kivitelez\u00e9s sor\u00e1n folyamatosan be kell tartani
  a hat\u00e1lyos munkav\u00e9delmi, biztons\u00e1gt\u00e9chnikai, vagyonv\u00e9delmi
  \u00e9s t\u0171zv\u00e9delmi el\u0151\u00edr\u00e1sokat.\\n\\n6. A V\u00e1llalkoz\u00f3
  k\u00f6teles a munka megkezd\u00e9s\u00e9t sz\u00fcks\u00e9g eset\u00e9n a jogszab\u00e1lyi
  el\u0151\u00edr\u00e1soknak megfelel\u0151en bejelenteni az illet\u00e9kes hat\u00f3s\u00e1goknak,
  illetve szerveknek.\\n\\n7. A munkater\u00fcleten az el\u0151\u00edrt figyelmeztet\u0151
  jelz\u00e9sek elhelyez\u00e9s\u00e9r\u0151l \u00e9s esetleges j\u00f3v\u00e1hagyat\u00e1s\u00e1r\u00f3l
  a kivitelez\u00e9s id\u0151tartama alatt V\u00e1llalkoz\u00f3nak k\u00f6teles gondoskodni.\\n\\n8.
  A V\u00e1llalkoz\u00f3 k\u00f6teles a kivitelez\u00e9shez sz\u00fcks\u00e9ges ideiglenes
  mell\u00e9kl\u00e9tes\u00edtm\u00e9nyek (pl. mobil WC) biztos\u00edtani.\\n\\n9.
  A V\u00e1llalkoz\u00f3 k\u00f6teles a kivitelez\u00e9si munka elv\u00e9gz\u00e9s\u00e9hez
  kiz\u00e1r\u00f3lag hozz\u00e1\u00e9rt\u0151 \u00e9s szakk\u00e9pzett szem\u00e9lyzetet
  alkalmazni. A V\u00e1llalkoz\u00f3 k\u00f6teles tov\u00e1bb\u00e1 az olyan alkalmazottj\u00e1nak
  munkav\u00e9gz\u00e9s\u00e9t felf\u00fcggeszteni, akir\u0151l meg\u00e1llap\u00edtj\u00e1k,
  hogy a jelen szerz\u0151d\u00e9s vagy m\u00e1s k\u00f6telez\u0151 jogszab\u00e1lyok
  rendelkez\u00e9seinek megszeg\u00e9s\u00e9vel j\u00e1r el vagy dolgozik.\\n\\n10.
  A V\u00e1llalkoz\u00f3 k\u00f6teles a Megrendel\u0151t minden olyan k\u00f6r\u00fclm\u00e9nyr\u0151l
  halad\u00e9ktalanul \u00e9rtes\u00edteni, amely a saj\u00e1t vagy az alv\u00e1llalkoz\u00f3i
  teljes\u00edt\u00e9s\u00e9nek vonatkoz\u00e1s\u00e1ban a min\u0151s\u00e9get, a
  szerz\u0151d\u00e9s szerinti el\u0151rehalad\u00e1st, a hat\u00e1rid\u0151k betart\u00e1s\u00e1t
  g\u00e1tolja, illetve vesz\u00e9lyezeti. Az \u00e9rtes\u00edt\u00e9snek tartalmaznia
  kell a k\u00e9sedelem ok\u00e1t \u00e9s annak v\u00e1rhat\u00f3 id\u0151tartam\u00e1t.\\n\\n11.
  Az \u00e9p\u00edt\u00e9si t\u00f6rmel\u00e9k \u00e9s hullad\u00e9k kezel\u00e9s\u00e9vel
  (min\u0151s\u00edt\u00e9se, sz\u00e1ll\u00edt\u00e1sa \u00e9s t\u00e1rol\u00e1sa)
  kapcsolatban V\u00e1llalkoz\u00f3 k\u00f6teles betartani a vesz\u00e9lyes hullad\u00e9kkal
  kapcsolatos egyes tev\u00e9kenys\u00e9gek r\u00e9szletes szab\u00e1lyair\u00f3l
  sz\u00f3l\u00f3 225/2015. (VIII. 7.) Korm. rendeletben foglaltakat.\\n\\n12. Ha
  V\u00e1llalkoz\u00f3 elt\u00e9r\u00e9st vagy \u00f6sszeegyeztethetetlen ellentmond\u00e1st
  fedez fel a jelen szerz\u0151d\u00e9s \u00e9s b\u00e1rmely hat\u00e1lyos jogszab\u00e1ly,
  szab\u00e1lyzat vagy szakmai el\u0151\u00edr\u00e1s rendelkez\u00e9sei k\u00f6z\u00f6tt,
  k\u00f6teles azt halad\u00e9ktalanul \u00edr\u00e1sban jelezni a Megrendel\u0151nek,
  aki a megfelel\u0151, sz\u00fcks\u00e9ges int\u00e9zked\u00e9seket megteszi.\\n\\n13.
  V\u00e1llalkoz\u00f3nak az \u00e1ltala biztos\u00edtott anyagok, szerkezetek, elemek/berendez\u00e9sek
  \u00e9s az elv\u00e9gzett munka min\u0151s\u00e9g\u00e9t bizonylatolnia kell.\\n\\n14.
  V\u00e1llalkoz\u00f3 a Kbt.-ben \u00e9s az elj\u00e1r\u00e1s sor\u00e1n adott nyilatkozataiban
  meghat\u00e1rozottak valamint jelen szerz\u0151d\u00e9s XI. fejezet\u00e9nek rendelkez\u00e9sei
  szerint vehet ig\u00e9nybe a teljes\u00edt\u00e9s sor\u00e1n alv\u00e1llalkoz\u00f3t,
  akinek a magatart\u00e1s\u00e1\u00e9rt \u00fagy felel, mintha maga j\u00e1rt volna
  el.\\n\\n15. Az \u00e9p\u00edt\u00e9si beruh\u00e1z\u00e1sok, valamint az \u00e9p\u00edt\u00e9si
  beruh\u00e1z\u00e1sokhoz kapcsol\u00f3d\u00f3 tervez\u0151i \u00e9s m\u00e9rn\u00f6ki
  szolg\u00e1ltat\u00e1sok k\u00f6zbeszerz\u00e9s\u00e9nek r\u00e9szletes szab\u00e1lyair\u00f3l
  sz\u00f3l\u00f3 322/2015. (X.30.) Korm\u00e1nyrendelet 26. \u00a7-nak megfelel\u0151en
  V\u00e1llalkoz\u00f3 k\u00f6teles felel\u0151ss\u00e9gbiztos\u00edt\u00e1si szerz\u0151d\u00e9st
  k\u00f6tni, vagy megl\u00e9v\u0151 felel\u0151ss\u00e9gbiztos\u00edt\u00e1s\u00e1t
  kiterjeszteni Megrendel\u0151 \u00e1ltal az elj\u00e1r\u00e1st megind\u00edt\u00f3
  felh\u00edv\u00e1sban, vagy a k\u00f6zbeszerz\u00e9si dokumentumokban el\u0151\u00edrt
  m\u00e9rt\u00e9k\u0171 \u00e9s terjedelm\u0171 felel\u0151ss\u00e9gbiztos\u00edt\u00e1sra.
  Az elv\u00e1rt felel\u0151ss\u00e9gbiztos\u00edt\u00e1s m\u00e9rt\u00e9ke 40 milli\u00f3
  HUF/\u00e9v \u00e9s 20 milli\u00f3 HUF/k\u00e1resem\u00e9ny.\\n\\nIX. M\u0171szaki
  \u00e1tad\u00e1s-\u00e1tv\u00e9tel\\n\\n1. Megrendel\u0151 V\u00e1llalkoz\u00f3
  szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9re vonatkoz\u00f3 fr\u00e1sbeli \u00e9rtes\u00edt\u00e9s\u00e9t\u0151l
  (k\u00e9szre jelent\u00e9s) sz\u00e1m\u00edtott 5 munkanapon bel\u00fcl k\u00f6teles
  t\u00e1j\u00e9koztatni V\u00e1llalkoz\u00f3t, hogy az \u00e1tad\u00e1s-\u00e1tv\u00e9teli
  elj\u00e1r\u00e1s megkezdhet\u0151-e. Amennyiben az \u00e1tad\u00e1s \u2013 \u00e1tv\u00e9telt
  akad\u00e1lyoz\u00f3 hib\u00e1kat tartalmaz a teljes\u00edt\u00e9s Megrendel\u0151
  t\u00e1j\u00e9koztatja V\u00e1llalkoz\u00f3t a hib\u00e1kr\u00f3l \u00e9s kijav\u00edt\u00e1suk
  hat\u00e1ridej\u00e9r\u0151l. Nem tagadhat\u00f3 meg az \u00e1tv\u00e9tel megkezd\u00e9se
  a m\u0171 olyan hib\u00e1ja miatt, amely, illetve amelynek kijav\u00edt\u00e1sa
  vagy p\u00f3tl\u00e1sa nem akad\u00e1lyozza a rendeltet\u00e9sszer\u0171 haszn\u00e1latot.\\n\\n2.
  Az \u00e1tad\u00e1s \u2013 \u00e1tv\u00e9telt megtagad\u00f3 nyilatkozatban foglalt
  hib\u00e1k, hi\u00e1nyoss\u00e1gok V\u00e1llalkoz\u00f3 \u00e1ltal t\u00f6rt\u00e9nt
  kijav\u00edt\u00e1s\u00e1t k\u00f6vet\u0151en a IX. 1. pontban meghat\u00e1rozott
  elj\u00e1r\u00e1s megism\u00e9tl\u00e9se ir\u00e1nyad\u00f3.\\n\\n3. Amennyiben
  az \u00e1tad\u00e1s-\u00e1tv\u00e9tel lefolytatathat\u00f3 Megrendel\u0151 k\u00f6teles
  azt a IX.1. pontban meghat\u00e1rozott megrendel\u0151i t\u00e1j\u00e9koztat\u00e1st\u00f3l
  sz\u00e1m\u00edtott 30 napon bel\u00fcl lefolytatni (Ptk. 6:247. \u00a7 (2)).\\n\\n4.
  Az \u00e1tad\u00e1s-\u00e1tv\u00e9teli elj\u00e1r\u00e1s V\u00e1llalkoz\u00f3 hib\u00e1j\u00e1b\u00f3l
  ered\u0151 eredm\u00e9nytelen lez\u00e1r\u00e1sa eset\u00e9n Megrendel\u0151 t\u00e1j\u00e9koztatja
  V\u00e1llalkoz\u00f3t a hib\u00e1kr\u00f3l \u00e9s kijav\u00edt\u00e1suk hat\u00e1ridej\u00e9r\u0151l,
  egy\u00fattal a IX. pontban meghat\u00e1rozott elj\u00e1r\u00e1s megism\u00e9tl\u00e9se
  ir\u00e1nyad\u00f3. A sikertelen \u00e1tad\u00e1s-\u00e1tv\u00e9teli elj\u00e1r\u00e1s
  k\u00f6lts\u00e9gei V\u00e1llalkoz\u00f3t terhelik.\\n\\n5. Megrendel\u0151 a munk\u00e1t
  a k\u00e9szre jelent\u00e9s Megrendel\u0151 \u00e1ltali k\u00e9zhezv\u00e9tel\u00e9nek
  id\u0151pontj\u00e1t\u00f3l tekinti teljes\u00edttetnek, amennyiben V\u00e1llalkoz\u00f3
  a munk\u00e1kat az aj\u00e1nlati dokument\u00e1ci\u00f3ban meghat\u00e1rozott \u00e9s
  az \u00e1ltala v\u00e1llalt felt\u00e9teleknek megfelel\u0151en \u2013 mind mennyis\u00e9gi,
  mind min\u0151s\u00e9gi \u00e9rtelemben \u2013 a Ptk. 6:247. \u00a7-ban foglaltak
  szerint, rendeltetetsszer\u0171, szerz\u0151d\u00e9sszer\u0171 \u00e9s biztons\u00e1gos
  haszn\u00e1latra alkalmas m\u00f3don elv\u00e9gezte, \u00e9s azt a Megrendel\u0151
  V\u00e1llalkoz\u00f3t\u00f3l sikeres \u00e1tad\u00e1s-\u00e1tv\u00e9teli elj\u00e1r\u00e1s
  keret\u00e9ben \u00e1tvette. A Szerz\u0151d\u00e9s IX. 2., valamint IX. 4. pontjaiban
  foglaltak eset\u00e9n a sikeres \u00e1tad\u00e1s-\u00e1tv\u00e9telt megel\u0151z\u0151
  ism\u00e9telt k\u00e9szre jelent\u00e9s Megrendel\u0151 \u00e1ltali k\u00e9zhezv\u00e9tel\u00e9nek
  id\u0151pontja ir\u00e1nyad\u00f3 a teljes\u00edt\u00e9s id\u0151pontja, egy\u00fattal
  a k\u00e9sedelemi k\u00f6tb\u00e9r vonatkoz\u00e1s\u00e1ban.\\n\\n6. V\u00e1llalkoz\u00f3
  tudom\u00e1sul veszi, hogy a bizony\u00edthat\u00f3 mulaszt\u00e1s\u00e1b\u00f3l
  ered\u0151 hib\u00e1kat, hi\u00e1nyoss\u00e1gokat a szerz\u0151d\u00e9s keret\u00e9n
  bel\u00fcli k\u00f6teles a v\u00e1llalkoz\u00f3i d\u00edj terh\u00e9re kijav\u00edtani,
  p\u00f3tolni, kieg\u00e9sz\u00edteni annak ellen\u00e9re is, hogy a m\u0171szaki
  \u00e1tad\u00e1s-\u00e1tv\u00e9teli elj\u00e1r\u00e1s sikeres z\u00e1r\u00e1sa megt\u00f6rt\u00e9nt.\\n\\n7.
  A V\u00e1llalkoz\u00f3 szavatoss\u00e1gi k\u00f6telezetts\u00e9gei a sikeres m\u0171szaki
  \u00e1tad\u00e1s-\u00e1tv\u00e9tel lez\u00e1r\u00e1s\u00e1nak napj\u00e1t\u00f3l
  kezd\u0151dnek.\\n\\n8. V\u00e1llalkoz\u00f3 a m\u0171szaki \u00e1tad\u00e1s-\u00e1tv\u00e9teli
  elj\u00e1r\u00e1s sikeres lez\u00e1r\u00e1s\u00e1t k\u00f6vet\u0151en a vonatkoz\u00f3
  jogszab\u00e1lyi el\u0151\u00edr\u00e1sok alapj\u00e1n k\u00f6teles a munkater\u00fcletet
  a Megrendel\u0151nek visszaadni.\\n\\n9. A sikeres m\u0171szaki \u00e1tad\u00e1s-\u00e1tv\u00e9teli
  elj\u00e1r\u00e1s lez\u00e1r\u00e1s\u00e1t k\u00f6vet\u0151en jogosult V\u00e1llalkoz\u00f3
  a v\u00e9gsz\u00e1mla ki\u00e1ll\u00edt\u00e1s\u00e1ra.\\n\\n10. Tov\u00e1bbi rendelkez\u00e9sek:\\n   -
  jogi \u00e9rtelemben az \u00e9p\u00edt\u00e9si munk\u00e1k teljes\u00edtett\u00e9k
  min\u0151s\u00fclnek, ha a l\u00e9tes\u00edtm\u00e9nyt (m\u0171vet) a Megrendel\u0151
  hiba \u00e9s hi\u00e1nymentesen \u00e1tvette, \u00e9s a V\u00e1llalkoz\u00f3 a jogszab\u00e1lyokban
  \u00e9s jelen szerz\u0151d\u00e9sben el\u0151\u00edrt valamennyi sz\u00fcks\u00e9ges
  dokumentumot a Megrendel\u0151 r\u00e9sz\u00e9re \u00e1tadtott.\\n   - p\u00e9nz\u00fcgyi
  \u00e9rtelemben eg\u00e9sz\u00e9ben teljes\u00edtettnek min\u0151s\u00fcl, amikor
  Megrendel\u0151 a v\u00e9gsz\u00e1mla ellen\u00e9rt\u00e9k\u00e9t kiegyenl\u00edtette.\\n\\n11.
  A teljes\u00edt\u00e9sek igazol\u00e1sa az \u00e9p\u00edt\u00e9si napl\u00f3ban
  t\u00f6rt\u00e9nik.\\n\\nX. **Szerz\u0151d\u00e9st biztos\u00edt\u00f3 mell\u00e9kk\u00f6telezetts\u00e9gek**\\n\\n1.
  V\u00e1llalkoz\u00f3, ha neki vagy alv\u00e1llalkoz\u00f3j\u00e1nak, teljes\u00edt\u00e9si
  seg\u00e9dj\u00e9nek f\u00e9lr\u00f3hat\u00f3 okb\u00f3l k\u00e9sedelembe esik,
  a nett\u00f3 v\u00e1llalkoz\u00e1si d\u00edj 0,1 %-\u00e1nak megfelel\u0151 m\u00e9rt\u00e9k\u0171
  napi k\u00e9sedelmi k\u00f6tb\u00e9rt k\u00f6teles megfizetni minden k\u00e9sedelemmel
  \u00e9rintett napt\u00e1ri nap ut\u00e1n. A k\u00e9sedelmi k\u00f6tb\u00e9rt legfeljebb
  30 napi t\u00e9tel tekintet\u00e9ben lehet \u00e9rv\u00e9nyes\u00edteni. A k\u00e9sedelmi
  k\u00f6tb\u00e9r megfizet\u00e9se nem mentes\u00edti a V\u00e1llalkoz\u00f3t a szerz\u0151d\u00e9sszer\u0171
  teljes\u00edt\u00e9s al\u00f3l.\\n\\n2. Megrendel\u0151 fenntartja mag\u00e1nak
  a jogot, hogy a 30 napot meghalad\u00f3, V\u00e1llalkoz\u00f3 \u00e9rdekk\u00f6r\u00e9ben
  felmer\u00fclt, f\u00e9lr\u00f3hat\u00f3 k\u00e9sedelem eset\u00e9n a szerz\u0151d\u00e9st\u0151l
  egyoldal\u00fa nyilatkoz\u00e1ttal el\u00e1lljon. El\u00e1ll\u00e1s eset\u00e9n
  a V\u00e1llalkoz\u00f3 a nett\u00f3 v\u00e1llalkoz\u00f3i d\u00edj (aj\u00e1nlati
  \u00e1r) 20%-\u00e1nak megfelel\u0151 \u00f6sszeg\u0171 meghi\u00fasul\u00e1si k\u00f6tb\u00e9r
  megfizet\u00e9s\u00e9re k\u00f6teles. A k\u00e9sedelem jogk\u00f6vetkezm\u00e9nyei
  nem alkalmazhat\u00f3k abban az esetben, ha az a Megrendel\u0151 szerz\u0151d\u00e9sben
  v\u00e1llalt k\u00f6telezetts\u00e9geinek megszeg\u00e9s\u00e9b\u0151l fakadnak.\\n\\n3.
  A Megrendel\u0151 a k\u00f6tb\u00e9r mellett \u00e9rv\u00e9nyes\u00edtheti a k\u00f6tb\u00e9rt
  meghalad\u00f3 k\u00e1r\u00e1t. Megrendel\u0151 a szerz\u0151d\u00e9sszeg\u00e9ssel
  okozott k\u00e1r\u00e1nak a megter\u00edt\u00e9s\u00e9t akkor is k\u00f6vetelheti,
  ha k\u00f6tb\u00e9rig\u00e9ny\u00e9t nem \u00e9rv\u00e9nyes\u00edtette.\\n\\n4.
  V\u00e1llalkoz\u00f3t szavatoss\u00e1gi \u00e9s a m\u0171szaki \u00e1tad\u00e1s-\u00e1tv\u00e9tel
  id\u0151pontj\u00e1t k\u00f6vet\u0151 \u2026\u2026 (**aj\u00e1nlattev\u0151 v\u00e1llal\u00e1sa
  szerint***) h\u00f3nap id\u0151tartamra vonatkoz\u00f3an j\u00f3t\u00e1ll\u00e1si
  k\u00f6telezetts\u00e9g terheli az \u00e1ltala elv\u00e9gzett munk\u00e1k \u00e9s
  felhaszn\u00e1lt anyagok vonatkoz\u00e1s\u00e1ban.\\n\\n5. Megrendel\u0151 az esetlegesen
  felmer\u00fcl\u0151 szavatoss\u00e1gi \u00e9s j\u00f3t\u00e1ll\u00e1si ig\u00e9nyek
  \u00e9rv\u00e9nyes\u00edt\u00e9se c\u00e9lj\u00e1b\u00f3l a j\u00f3t\u00e1ll\u00e1s
  id\u0151tartama alatt \u00e9vente egy alkalommal ut\u00f3-fell\u00edvizsg\u00e1lati
  elj\u00e1r\u00e1st folytat le, amelynek id\u0151pontj\u00e1t az elj\u00e1r\u00e1st
  megel\u0151z\u0151en legal\u00e1bb 15 nappal kit\u0171zi, \u00e9s amelyr\u0151l
  \u00e9rtes\u00edt\u00e9st k\u00fcld minden \u00e9rintett szervezetnek.\\n\\n6. Amennyiben
  a j\u00f3t\u00e1ll\u00e1si id\u0151szak alatt hiba mer\u00fcl fel, V\u00e1llalkoz\u00f3
  k\u00f6teles azt a Megrendel\u0151 fr\u00e1sos felsz\u00f3l\u00edt\u00e1s\u00e1nak
  k\u00e9szhez v\u00e9tel\u00e9t k\u00f6vet\u0151en, az abban megjel\u00f6lt hat\u00e1rid\u0151ben
  d\u00edjfmentesen gondoskodni, illet\u0151leg a hib\u00e1s term\u00e9k cser\u00e9j\u00e9r\u0151l
  t\u00e9r\u00edt\u00e9smentesen gondoskodni. Amennyiben olyan hiba mer\u00fcl fel
  a j\u00f3t\u00e1ll\u00e1si id\u0151szakon bel\u00fcl, amely az \u00fczemeltet\u00e9st
  g\u00e1tolja, V\u00e1llalkoz\u00f3 k\u00f6teles a hiba elh\u00e1r\u00edt\u00e1s\u00e1r\u00f3l
  \u2026\u2026\u2026 (*aj\u00e1nlattev\u0151 v\u00e1llal\u00e1sa szerint* *) munkanapon
  bel\u00fcl int\u00e9zkedni.\\n\\n7. Megrendel\u0151 k\u00f6teles fr\u00e1sban halad\u00e9ktalanul
  \u00e9rtes\u00edteni V\u00e1llalkoz\u00f3t, amennyiben a szavatoss\u00e1gi vagy
  j\u00f3t\u00e1ll\u00e1si id\u0151szak alatt k\u00e1rig\u00e9nyt k\u00edv\u00e1nnak
  \u00e9rv\u00e9nyes\u00edteni. V\u00e1llalkoz\u00f3 tudom\u00e1sul veszi, hogy a
  j\u00f3t\u00e1ll\u00e1si id\u0151szak alatt keletkezett \u00e9s bejelentett jogos
  ig\u00e9nyek a j\u00f3t\u00e1ll\u00e1si id\u0151szak lej\u00e1rta ut\u00e1n is \u00e9rv\u00e9nyes\u00edthet\u0151ek.\\n\\n8.
  A j\u00f3t\u00e1ll\u00e1s nem terjed ki elemi csap\u00e1s, sz\u00e1nd\u00e9kos rong\u00e1l\u00e1s,
  emberi mulaszt\u00e1s, illet\u00e9kterlen beavatkoz\u00e1s, illetve m\u00e1s szakszer\u0171tlen
  kezel\u00e9s, m\u0171k\u00f6dtet\u00e9s, \u00fczemeltet\u00e9s, vagy egy\u00e9b
  nem rendeltet\u00e9sszer\u0171 haszn\u00e1lat \u00e1ltal okozott k\u00e1rok helyre\u00e1ll\u00edt\u00e1s\u00e1ra.\\n\\nXI.
  Min\u0151s\u00e9g-ellen\u0151rz\u00e9s\\n\\n1. V\u00e1llalkoz\u00f3 felel\u0151s
  az\u00e9rt, hogy a szerz\u0151d\u00e9sben foglalt munka a szerz\u0151d\u00e9s dokumentumainak
  mennyis\u00e9gileg \u00e9s min\u0151s\u00e9gileg, valamint a jogszab\u00e1lyokban
  foglaltaknak megfeleljen.\\n\\n2. A V\u00e1llalkoz\u00f3 a be\u00e9p\u00edtett anyagokat
  \u00fagy k\u00f6teles dokument\u00e1lni, hogy azok min\u0151s\u00e9ge ut\u00f3lag
  ellen\u0151rizhet\u0151 legyen.\\n\\n3. A felhaszn\u00e1lt anyagok \u00e9s az elv\u00e9gzett
  munka min\u0151s\u00e9g\u00e9vel kapcsolatos vita eset\u00e9n \u2013 amennyiben
  a vit\u00e1t a Felek megegyez\u00e9ssel rendezni nem tudj\u00e1k \u2013 igazs\u00e1g\u00fcgyi
  m\u0171szaki szak\u00e9rt\u0151 vagy szak\u00e9rt\u0151 int\u00e9zet \u00e1ll\u00e1sfoglal\u00e1sa
  az ir\u00e1nyad\u00f3. A szak\u00e9rt\u0151i d\u00edjat az el\u0151legezi meg, akinek
  a szak\u00e9rt\u0151 ig\u00e9nybev\u00e9tele \u00e9rdek\u00e9ben \u00e1ll, \u00e9s
  az viseli, akinek a hib\u00e1j\u00e1b\u00f3l a szak\u00e9rt\u0151 ig\u00e9nybev\u00e9tel\u00e9re
  sor ker\u00fclt.\\n\\nXII. Alv\u00e1llalkoz\u00f3 ig\u00e9nybev\u00e9tele\\n\\n1.
  V\u00e1llalkoz\u00f3 a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9nek id\u0151tartama
  alatt k\u00f6teles Megrendel\u0151nek minden, a teljes\u00edt\u00e9sbe bevonti k\u00edv\u00e1nt
  alv\u00e1llalkoz\u00f3t el\u0151zetesen bejelenteni, \u00e9s a bejelent\u00e9ssel
  egy\u00fctt nyilatkozni arr\u00f3l is, hogy az \u00e1ltala ig\u00e9nybe venni k\u00edv\u00e1nt
  alv\u00e1llalkoz\u00f3 nem \u00e1ll a Kbt-ben \u00e9s a k\u00f6zbeszerz\u00e9si
  aj\u00e1nlatban meghat\u00e1rozott kiz\u00e1r\u00f3 okok hat\u00e1lya alatt.\\n\\n2.
  A szerz\u0151d\u00e9s teljes\u00edt\u00e9se sor\u00e1n V\u00e1llalkoz\u00f3 \u00e1ltal
  bemutatott valamely szervezet vagy szakember bevon\u00e1s\u00e1t\u00f3l nem lehet
  eltekinteni olyan esetben, ha az \u00e9rintett szerz\u0151d\u00e9s saj\u00e1tos
  tulajdons\u00e1gait figyelembe v\u00e9ve az adott szem\u00e9ly (szervezet) ig\u00e9nybev\u00e9tele
  a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sban az aj\u00e1nlatok \u00e9rt\u00e9kel\u00e9sekor
  meghat\u00e1roz\u00f3 k\u00f6r\u00fclm\u00e9nyek min\u0151s\u00fcl. Ilyen esetben
  csak a jogut\u00f3d\u00e1s olyan eseteiben v\u00e1ltozhat a bevont szervezet, ha
  az \u00faj szervezet az \u00e9rt\u00e9kel\u00e9skor figyelembe vett minden relev\u00e1ns
  k\u00f6r\u00fclm\u00e9ny \u2013 k\u00fcl\u00f6n\u00f6s tekintettel a Kbt. 76. \u00a7
  (3) bekezd\u00e9s b) pontja szerinti esetben az \u00e9rt\u00e9kelt szem\u00e9lyi
  \u00e1llom\u00e1ny \u2013 tekintet\u00e9ben az elj\u00e1r\u00e1sban bemutatott szervezet
  jogut\u00f3dj\u00e1nak tekinthet\u0151. Az \u00e9rt\u00e9kel\u00e9skor meghat\u00e1roz\u00f3
  szakember szem\u00e9lye csak Megrendel\u0151 hozz\u00e1j\u00e1rul\u00e1s\u00e1val
  \u00e9s abban az\\n\\nesetben v\u00e1ltozhat, ha az \u00e9rt\u00e9kel\u00e9skor
  figyelembe vett minden relev\u00e1ns k\u00f6r\u00fclm\u00e9ny tekintet\u00e9ben
  az \u00e9rt\u00e9kelettel egyen\u00e9rt\u00e9k\u0171 szakember ker\u00fcl bemutat\u00e1sra.\\n\\n3.
  Felek r\u00f6gz\u00edtik, hogy Megrendel\u0151 a 322/2015 (X.30.) Korm. rendelet
  27. \u00a7 alapj\u00e1n a szerz\u0151d\u00e9s teljes\u00edt\u00e9se sor\u00e1n ellen\u0151rzi,
  hogy a teljes\u00edt\u00e9sben csak a Kbt. 138. \u00a7 (2) \u00e9s (3) bekezd\u00e9s\u00e9ben
  foglaltaknak megfelel\u0151 alv\u00e1llalkoz\u00f3 vesz r\u00e9szt.\\n\\nXIII. A
  Felek k\u00e9pvisel\u0151i\\n\\n1. Megrendel\u0151 k\u00e9pviselet\u00e9ben elj\u00e1r\u00f3
  f\u00e9l:\\n   a. n\u00e9v:\\n   b. telefon:\\n   c. email:\\n\\n   Megrendel\u0151
  m\u0171szaki ellen\u0151re:\\n   a. n\u00e9v:\\n   b. telefon:\\n   c. email:\\n   d.
  kamarai jogosults\u00e1g sz\u00e1ma:\\n\\n2. V\u00e1llalkoz\u00f3 meghatalmazott
  k\u00e9pvisel\u0151je:\\n   a. n\u00e9v:\\n   b. telefon: .......\\n   c. email:
  .........\\n\\n3. Fent meghat\u00e1rozott k\u00e9pvisel\u0151k jogosultak \u00e1ll\u00e1sfoglal\u00e1sra,
  nyilatkozatt\u00e9telre, teljes\u00edt\u00e9s igazol\u00e1s\u00e1ra \u00e9s minden
  olyan meg\u00e1llapod\u00e1s megk\u00f6t\u00e9s\u00e9re, amely a szerz\u0151d\u00e9s
  teljes\u00edt\u00e9s\u00e9vel \u00f6sszef\u00fcgg, de nem min\u0151s\u00fcl annak
  m\u00f3dos\u00edt\u00e1s\u00e1nak.\\n\\n4. Az egy\u00fcttm\u0171k\u00f6d\u00e9s
  sor\u00e1n tett nyilatkozatokat a Felek k\u00f6telesek \u00edr\u00e1sba foglalni.\\n\\n5.
  A kijel\u00f6lt k\u00e9pvisel\u0151k kinevezhetnek tov\u00e1bbi kapcsolattart\u00f3
  szem\u00e9lyeket, akik nev\u00e9t \u00e9s hat\u00e1sk\u00f6r\u00e9t k\u00f6lcs\u00f6n\u00f6sen
  k\u00f6zlik egym\u00e1ssal. A kijel\u00f6lt k\u00e9pvisel\u0151 szem\u00e9ly\u00e9nek
  v\u00e1ltoz\u00e1s\u00e1r\u00f3l a v\u00e1ltoz\u00e1st megel\u0151z\u0151en 2 munkanappal
  k\u00f6zlik a felek a m\u00e1sik f\u00e9llel.\\n\\nXIV. A szerz\u0151d\u00e9s m\u00f3dos\u00edt\u00e1sa\\n\\n1.
  Jelen szerz\u0151d\u00e9s m\u00f3dos\u00edt\u00e1s\u00e1ra kiz\u00e1r\u00f3lag a
  Kbt. 141. \u00a7-nak megfelel\u0151 m\u00f3don, az ott szab\u00e1lyozott esetekben
  ker\u00fclhet sor.\\n\\n2. A szerz\u0151d\u00e9s m\u00f3dos\u00edt\u00e1s\u00e1val
  kapcsolatos k\u00f6lts\u00e9geket \u00e9s kiad\u00e1sokat (ide \u00e9rtve a hat\u00f3s\u00e1gi
  d\u00edjakat is) annak a szerz\u0151d\u0151 f\u00e9lnek kell viselnie, akinek az
  \u00e9rdekk\u00f6r\u00e9ben felmer\u00fclt okb\u00f3l a szerz\u0151d\u00e9s m\u00f3dos\u00edt\u00e1sra
  ker\u00fclt.\\n\\n3. Semmis a szerz\u0151d\u00e9s m\u00f3dos\u00edt\u00e1sa, ha
  az arra ir\u00e1nyul, hogy V\u00e1llalkoz\u00f3t mentes\u00edts\u00e9k az olyan
  szerz\u0151d\u00e9sszeg\u00e9s (illetve szerz\u0151d\u00e9sszeg\u00e9sbe es\u00e9s)
  \u00e9s annak jogk\u00f6vetkezm\u00e9nyei - ide nem \u00e9rtve a felmond\u00e1s
  vagy el\u00e1ll\u00e1s jog\u00e1nak gyakorl\u00e1s\u00e1t - alkalmaz\u00e1sa al\u00f3l,
  amely\u00e9rt felel\u0151s (illetve felel\u0151s lenne), vagy amely arra ir\u00e1nyul,
  hogy Megrendel\u0151 \u00e1tv\u00e1llalja a V\u00e1llalkoz\u00f3t terhel\u0151 t\u00f6bbletmunkak\u00f6lts\u00e9geket
  vagy indokolatlanul egy\u00e9b, a szerz\u0151d\u00e9s alapj\u00e1n a nyertes aj\u00e1nlattev\u0151t
  terhel\u0151 kock\u00e1zatokat.\\n\\nXV. A szerz\u0151d\u00e9s megsz\u0171n\u00e9se
  \u00e9s megsz\u00fcntet\u00e9se\\n\\n1. Megrendel\u0151 a szerz\u0151d\u00e9st felmondhatja,
  vagy - a Ptk.-ban foglaltak szerint - a szerz\u0151d\u00e9st\u0151l el\u00e1llhat,
  ha:\\n\\na. felt\u00e9tlen\u00fcl sz\u00fcks\u00e9ges a szerz\u0151d\u00e9s olyan
  l\u00e9nyeges m\u00f3dos\u00edt\u00e1sa, amely eset\u00e9ben a Kbt. 141. \u00a7
  alapj\u00e1n \u00faj k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1st kell lefolytatni;\\n\\nb.
  V\u00e1llalkoz\u00f3 nem biztos\u00edtja a Kbt. 138. \u00a7-ban foglaltak betart\u00e1s\u00e1t,
  vagy V\u00e1llalkoz\u00f3 szem\u00e9ly\u00e9ben \u00e9rv\u00e9nyesen olyan jogut\u00f3dl\u00e1s
  k\u00f6vetkezett be, amely nem felel meg a Kbt. 139. \u00a7-ban foglaltaknak; vagy\\n\\nc.
  az EUMSZ 258. cikke alapj\u00e1n a k\u00f6zbeszerz\u00e9s szab\u00e1lyainak megszeg\u00e9se
  miatt k\u00f6telezetts\u00e9gszeg\u00e9si elj\u00e1r\u00e1s indult, vagy az Eur\u00f3pai
  Uni\u00f3 B\u00edr\u00f3s\u00e1ga az EUMSZ 258. cikke alapj\u00e1n ind\u00edtott
  elj\u00e1r\u00e1sban kimondta, hogy az Eur\u00f3pai Uni\u00f3 jog\u00e1b\u00f3l
  ered\u0151 valamely k\u00f6telezetts\u00e9g tekintet\u00e9ben k\u00f6telezetts\u00e9gszeg\u00e9s
  t\u00f6rt\u00e9nt, \u00e9s a b\u00edr\u00f3s\u00e1g \u00e1ltal meg\u00e1llap\u00edtott
  jogs\u00e9rt\u00e9s miatt a szerz\u0151d\u00e9s nem semmis.\\n\\n2. Megrendel\u0151
  k\u00f6teles a szerz\u0151d\u00e9st felmondani, vagy - a Ptk.-ban foglaltak szerint
  - att\u00f3l el\u00e1llni, ha a szerz\u0151d\u00e9s megk\u00f6t\u00e9s\u00e9t k\u00f6vet\u0151en
  jut tudom\u00e1s\u00e1ra, hogy a szerz\u0151d\u0151 f\u00e9l tekintet\u00e9ben a
  k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s sor\u00e1n kiz\u00e1r\u00f3 ok \u00e1llt
  fenn, \u00e9s ez\u00e9rt ki kellett volna z\u00e1rni a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sb\u00f3l.\\n\\n3.
  Megrendel\u0151 jogosult \u00e9s egyben k\u00f6teles a szerz\u0151d\u00e9st felmondani
  - ha sz\u00fcks\u00e9ges olyan hat\u00e1rid\u0151vel, amely lehet\u0151v\u00e9 teszi,
  hogy a szerz\u0151d\u00e9ssel \u00e9rintett feladata ell\u00e1t\u00e1s\u00e1r\u00f3l
  gondoskodni tudjon -, ha\\n\\n   a. a nyertes aj\u00e1nlattev\u0151ben k\u00f6zvetetten
  vagy k\u00f6zvetlen\u00fcl 25%-ot meghalad\u00f3 tulajdoni r\u00e9szesed\u00e9st
  szerez valamely olyan jogi szem\u00e9ly vagy szem\u00e9lyes joga szerint jogk\u00e9pes
  szervezet, amely tekintet\u00e9ben fenn\u00e1ll a Kbt. 62. \u00a7 (1) bekezd\u00e9s
  k) pont kb) alponjt\u00e1ban meghat\u00e1rozott felt\u00e9tel;\\n\\n   b. a nyertes
  aj\u00e1nlattev\u0151 k\u00f6zvetetten vagy k\u00f6zvetlen\u00fcl 25%-ot meghalad\u00f3
  tulajdoni r\u00e9szesed\u00e9st szerez valamely olyan jogi szem\u00e9lyben vagy
  szem\u00e9lyes joga szerint jogk\u00e9pes szervezetben, amely tekintet\u00e9ben
  fenn\u00e1ll a Kbt. 62. \u00a7 (1) bekezd\u00e9s k) pont kb) alponjt\u00e1ban meghat\u00e1rozott
  felt\u00e9tel.\\n\\nFenti esetben a V\u00e1llalkoz\u00f3 a szerz\u0151d\u00e9s megsz\u0171n\u00e9se
  el\u0151tt m\u00e1r teljes\u00edtett szolg\u00e1ltat\u00e1s szerz\u0151d\u00e9sszer\u0171
  p\u00e9nzbeli ellen\u00e9rt\u00e9k\u00e9re jogosult.\\n\\n4. A jelen szerz\u0151d\u00e9sben
  meghat\u00e1rozott el\u00e1ll\u00e1si ok bek\u00f6vetkez\u00e9se eset\u00e9n a Megrendel\u0151
  a V\u00e1llalkoz\u00f3hoz int\u00e9zett egyoldal\u00fa jognyilatkozattal felmondhatja
  a szerz\u0151d\u00e9st, illetve att\u00f3l el\u00e1llhat. A Megrendel\u0151 felmond\u00e1s
  vagy el\u00e1ll\u00e1s eset\u00e9n a m\u00e1r teljes\u00edtett munkafolyamatok megfizet\u00e9s\u00e9re
  k\u00f6telesek, egy\u00e9b k\u00e9rtalan\u00edt\u00e1sra a V\u00e1llalkoz\u00f3
  nem tarthat ig\u00e9nyt.\\n\\n5. Megrendel\u0151 azonnali hat\u00e1llyal felmondhatja
  a szerz\u0151d\u00e9st (el\u00e1llhat a szerz\u0151d\u00e9st\u0151l), ha:\\n\\n   a.
  V\u00e1llalkoz\u00f3 szerz\u0151d\u00e9ses k\u00f6telezetts\u00e9geit s\u00falyosan
  vagy ism\u00e9telten megszegi (s\u00falyosnak min\u0151s\u00fcl az a szerz\u0151d\u00e9sszeg\u00e9s,
  amely a feladat hat\u00e1rid\u0151re t\u00f6rt\u00e9n\u0151 megval\u00f3sul\u00e1s\u00e1t
  vesz\u00e9lyeztetni, vagy a jogszab\u00e1lyok megs\u00e9rt\u00e9s\u00e9vel j\u00e1r);\\n\\n   b.
  V\u00e1llalkoz\u00f3 a Megrendel\u0151 \u00e1ltal adott \u00e9sszer\u0171 hat\u00e1rid\u0151n
  bel\u00fcl nem tesz eleget a felh\u00edv\u00e1snak, hogy szerz\u0151d\u00e9ses k\u00f6telezetts\u00e9geinek
  eleget tegyen;\\n\\n   c. V\u00e1llalkoz\u00f3 cs\u00f6delj\u00e1r\u00e1s al\u00e1
  ker\u00fcl, felsz\u00e1mol\u00e1s vagy v\u00e9gsz\u00e1mol\u00e1si elj\u00e1r\u00e1st
  kezdem\u00e9nyeznek vele szemben, felf\u00fcggeszti gazdas\u00e1gi tev\u00e9kenys\u00e9g\u00e9t,
  besz\u00fcnteti kifizet\u00e9s\u00e9it, vagy egy\u00e9b m\u00f3don fizet\u00e9sk\u00e9ptelennek
  v\u00e1lik; - az ad\u00f3ossal k\u00f6t\u00f6tt szerz\u0151d\u00e9st\u0151l a fizet\u00e9si
  halad\u00e9k id\u0151tartama alatt nem lehet el\u00e1llni. [cs\u00f6delj\u00e1r\u00e1sr\u00f3l
  \u00e9s a felsz\u00e1mol\u00e1sr\u00f3l sz\u00f3l\u00f3 1991. \u00e9vi IL. t\u00f6rv\u00e9ny
  11. \u00a7 (2) bekezd\u00e9s h) pontja]\\n\\n   d. joger\u0151s elmarasztal\u00f3
  hat\u00e1rozatot hoznak V\u00e1llalkoz\u00f3 szakmai tev\u00e9kenys\u00e9g\u00e9t
  \u00e9rint\u0151 szab\u00e1lys\u00e9rt\u00e9s vagy b\u0171ncselekm\u00e9ny miatt;\\n\\n   e.
  az adott k\u00f6telezetts\u00e9gre el\u0151\u00edrt teljes\u00edt\u00e9si hat\u00e1rid\u0151
  el\u0151tt nyilv\u00e1nval\u00f3v\u00e1 v\u00e1lik, hogy V\u00e1llalkoz\u00f3 a
  munk\u00e1t csak sz\u00e1mottev\u0151 k\u00e9s\u00e9ssel vagy \u2013 a fogyat\u00e9koss\u00e1g
  kik\u00fcsz\u00f6b\u00f6l\u00e9s\u00e9re t\u0171z\u00f6tt m\u00e9lt\u00e1nyos hat\u00e1rid\u0151
  eltelt\u00e9 ellen\u00e9re is \u2013 hib\u00e1san tudja elv\u00e9gezni.\\n\\n6.
  A felmond\u00e1s a V\u00e1llalkoz\u00f3 \u00e1ltali k\u00e9zhezv\u00e9tellel v\u00e1lik
  hat\u00e1lyoss\u00e1.\\n\\n7. A szerz\u0151d\u00e9s felmond\u00e1sa eset\u00e9n
  az elk\u00e9sz\u00fclt munka a felmond\u00e1s id\u0151pontj\u00e1ig \u2013 ar\u00e1nyos
  ellenszolg\u00e1ltat\u00e1s fej\u00e9ben \u2013 megilleti a Megrendel\u0151t, a
  V\u00e1llalkoz\u00f3 pedig jogosult a szerz\u0151d\u00e9s megsz\u0171n\u00e9se el\u0151tt
  szerz\u0151d\u00e9sszer\u0171en teljes\u00edtett munk\u00e1k p\u00e9nzbeli ellen\u00e9rt\u00e9k\u00e9re.
  Megrendel\u0151 a m\u00e9g nem teljes\u00edtett r\u00e9sz tekintet\u00e9ben meghi\u00fasul\u00e1si
  k\u00f6tb\u00e9rre jogosultak, amennyiben a szerz\u0151d\u00e9s V\u00e1llalkoz\u00f3nak
  felr\u00f3hat\u00f3an sz\u0171nt meg.\\n\\n8. A szerz\u0151d\u00e9s felmond\u00e1sa
  vagy m\u00e1s okb\u00f3l t\u00f6rt\u00e9n\u0151 megsz\u0171n\u00e9se eset\u00e9n
  a megsz\u0171n\u00e9st\u0151l sz\u00e1m\u00edtott 15 napon bel\u00fcl a Felek k\u00f6telesek
  egym\u00e1ssal elsz\u00e1molni. A szerz\u0151d\u00e9s megsz\u0171n\u00e9se nem \u00e9rinti
  az elsz\u00e1mol\u00e1si \u00e9s titoktart\u00e1si k\u00f6telezetts\u00e9geket.\\n\\nXVI.
  Vegyes \u00e9s z\u00e1r\u00f3 rendelkez\u00e9sek\\n\\n1. Felek k\u00f6telesen mindent
  megtenni annak \u00e9rdek\u00e9ben, hogy k\u00f6zvetlen t\u00e1rgyal\u00e1ssal,
  b\u00e9k\u00e9s \u00faton rendezz\u00e9k a k\u00f6z\u00f6tt\u00fck esetlegesen felmer\u00fcl\u0151
  mindenf\u00e9le n\u00e9zetelt\u00e9r\u00e9st vagy jogvit\u00e1t.\\n\\n2. Amennyiben
  a k\u00f6zvetlen t\u00e1rgyal\u00e1sok nem vezetnek eredm\u00e9nyre, Felek a pert\u00e1rgy
  \u00e9rt\u00e9k\u00e9t\u0151l f\u00fcgg\u0151en kik\u00f6ti a Megrendel\u0151 sz\u00e9khelye
  szerint ter\u00fcletileg illet\u00e9kess j\u00e1r\u00e1sb\u00edr\u00f3s\u00e1g vagy
  t\u00f6rv\u00e9nysz\u00e9k kiz\u00e1r\u00f3lagos illet\u00e9kess\u00e9g\u00e9t a
  jogvita elb\u00edr\u00e1l\u00e1s\u00e1ra.\\n\\n3. Jelen szerz\u0151d\u00e9sben nem
  szab\u00e1lyozott k\u00e9rd\u00e9seken a Polg\u00e1ri T\u00f6rv\u00e9nyk\u00f6nyv,
  a k\u00f6zbeszerz\u00e9sekr\u0151l sz\u00f3l\u00f3 2015. \u00e9vi CXLIII. t\u00f6rv\u00e9ny
  \u00e9s v\u00e9grehajt\u00e1si rendeletei, valamint az egy\u00e9b \u00e1gazati jogszab\u00e1lyok
  el\u0151\u00edr\u00e1sai ir\u00e1nyad\u00f3ak.\\n\\n4. Amennyiben a szolg\u00e1ltat\u00e1s
  ny\u00fajt\u00e1sa sor\u00e1n a kapcsol\u00f3d\u00f3 jogszab\u00e1lyok vagy szabv\u00e1nyok,
  k\u00f6telez\u0151 el\u0151\u00edr\u00e1sok v\u00e1ltoznak, \u00e9s ezen v\u00e1ltoz\u00e1sok
  az elv\u00e9gzend\u0151 munk\u00e1t befoly\u00e1solj\u00e1k, az ebb\u0151l ered\u0151
  k\u00f6lts\u00e9gek Megrendel\u0151t terhelik.\\n\\n5. Szerz\u0151d\u0151 Felek
  tudom\u00e1sul veszik, hogy jelen szerz\u0151d\u00e9s a k\u00f6zbeszerz\u00e9si
  t\u00f6rv\u00e9ny \u00e9rtelm\u00e9ben nyilv\u00e1nos, annak tartalma k\u00f6z\u00e9rdek\u0171
  adatnak min\u0151s\u00fcl. Ez al\u00f3l azon adatok k\u00f6re k\u00e9pez csak kiv\u00e9telt,
  amelyet V\u00e1llalkoz\u00f3 a Kbt. 44. \u00a7-ban foglaltak szerinti \u00fczleti
  titoknak nyilv\u00e1n\u00edtott.\\n\\n6. Abban az esetben, ha jelen szerz\u0151d\u00e9s
  b\u00e1rmely rendelkez\u00e9se r\u00e9szben vagy eg\u00e9szben \u00e9rv\u00e9nytelennek
  min\u0151s\u00fclne, az nem eredm\u00e9nyezi a szerz\u0151d\u00e9s t\u00f6bbi rendelkez\u00e9s\u00e9nek
  \u00e9rv\u00e9nyteleness\u00e9g\u00e9t. Az \u00e9rv\u00e9nytelen rendelkez\u00e9s
  hely\u00e9be a felek \u00e9rv\u00e9nyes rendelkez\u00e9st iktatnak be, amennyiben
  ez a szerz\u0151d\u00e9s szab\u00e1lyszer\u0171 teljes\u00edt\u00e9s\u00e9hez sz\u00fcks\u00e9ges.\\n\\n7.
  Jelen szerz\u0151d\u00e9st n\u00e9gy, egym\u00e1ssal sz\u00f3 szerint megegyez\u0151,
  eredeti p\u00e9ld\u00e1nyban k\u00e9sz\u00fclt. Jelen szerz\u0151d\u00e9s csak az
