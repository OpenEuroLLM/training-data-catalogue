  "\"VEGYES K\u00d6ZLEM\u00c9NYEK.\\n\\nV\u00e1ltoz\u00e1s a Magyar K\u00f6nyvszemle
  szerkeszt\u00e9s\u00e9ben. Koll\u00e1nyi Ferencz p\u00e1pai prel\u00e1tus \u00far,
  a ki foly\u00f3iratunkat 1902. \u00f3ta szerkesztette, megv\u00e1lv\u00e1n a M.
  N. M\u00fazeumn\u00e1l viselt \u00e1ll\u00e1s\u00e1t\u00f3l, a nagym\u00e9lt\u00f3s\u00e1g\u00fa
  vall\u00e1s- \u00e9s k\u00f6zoktat\u00e1s\u00fcgyi miniszter \u00far szep-tember
  h\u00f3 12-\u00e9n 87.895. sz. rendelet\u00e9vel k\u00f6nyvt\u00e1runk hivatalos
  lapj\u00e1nak szerkeszt\u00e9s\u00e9vel dr. Guly\u00e1s P\u00e1l nemz. m\u00fazeumi
  seg\u00e9d-\u00f6rt m\u00e9lt\u00f3ztatott megbizni.\\n\\nHorv\u00e1th Ign\u00e1c
  t. A Magyar Nemzeti M\u00fazeumot, els\u0151 sorban a k\u00f6nyvt\u00e1ri oszt\u00e1lyt,
  s\u00falyos vesztes\u00e9g \u00e9rte egyik legr\u00e9gebbi, munk\u00e1s\u00e9let\u0171
  tisztvisel\u0151j\u00e9nek, Horv\u00e1th Ign\u00e1c m\u00fazeumi igazgat\u00f3\u00f3rnek
  1911. aug. 17-\u00e9n, tragikus k\u00f6r\u00fclm\u00e9nyek k\u00f6zt t\u00f6rt\u00e9nt
  elhunyt\u00e1val. A megboldogult 1851. janu\u00e1r 21-\u00e9n sz\u00fcletett Tat\u00e1n,
  papi p\u00e1ly\u00e1ra k\u00e9sz\u00fclt el\u0151bb a szent Benedek-rendiek pannonhalmi
  iskol\u00e1j\u00e1ban, azut\u00e1n mint vil\u00e1gi n\u00f6vend\u00e9kpap az esztergomi
  szemin\u00e1riumban, majd kil\u00e9pv\u00e9n az egyh\u00e1zi rendb\u0151l, egyideig
  a kincst\u00e1ri jog\u00fcgyek igazgat\u00f3s\u00e1g\u00e1n\u00e1l, a budapesti
  egyetemi k\u00f6nyvt\u00e1rn\u00e1l s v\u00e9g\u00fcl 1876. szeptember \u00f3ta
  a m\u00fazeumi k\u00f6nyvt\u00e1rban volt napidijas gyakornok. Id\u0151k\u00f6zben
  a tudom\u00e1ny egyetem b\u00f6lcs\u00e9szeti kar\u00e1ra is beiratkozott s 1881-ben
  befejezv\u00e9n tanulm\u00e1nyait, 1882 m\u00e1jus 27-\u00e9n a Sz\u00e9ch\u00e9nyi
  gr\u00f3fi csal\u00e1d aj\u00e1nlat\u00e1ra m\u00fazeumi seg\u00e9dd\u00e9 nevezt\u00e9k
  ki. Seg\u00e9d\u0151rr\u00e9 1886-ban, \u00f6rr\u00e9 1898-ban s igazgat\u00f3orr\u00e9
  1910-ben l\u00e9pett el\u0151. A munkaseret\u0151 tisztvisel\u0151 mintak\u00e9pe
  volt, a ki f\u00e1radhatatlan buzgalommal, jeles gyakorlati ismeretekr\u0151l tan\u00fas-kodva
  s a legszigor\u00fabb pontoss\u00e1ggal t\u00f6lt\u00f6tte be a sz\u00e1m\u00e1ra
  kijel\u00f6lt \u00fcgyk\u00f6rt. 1898 \u00f3ta \u0151 vezette a k\u00f6telesp\u00e9ld\u00e1nyok
  nyilv\u00e1ntart\u00e1s\u00e1ra berendezett irod\u00e1t s minden lehet\u0151t megtett,
  hogy a mennyeire k\u00f6nyv\u00e9szeti seg\u00e9deszk\u00f6z\u00e9ink el\u00e9gtelens\u00e9ge
  mellett lehets\u00e9ges, ellen\u0151rizze a nyomdatulajdonosokat az 1897: XLL. t-cz.-ben
  el\u0151\u00edrt k\u00f6telezetts\u00e9g\u00fck teljes\u00edt\u00e9s\u00e9ben. \u00dagyancsak
  nagy j\u00e1rtass\u00e1ga k\u00f6nyvt\u00e1runk szakrendszer\u00e9ben s k\u00f6nyvk\u00e9szlet\u00e9ben
  mintegy predesztin\u00e1lt\u00e1k \u0151t az \u00f6tvenkint szok\u00e1sos k\u00f6nyvt\u00e1ri
  rev\u00edzi\u00f3 vezet\u00e9s\u00e9re, melyet h\u00e1rom izben biztak re\u00e1
  az \u00fcgy el\u0151ny\u00e9re. A legutols\u00f3 rev\u00edzi\u00f3t \u00e9pen az
  id\u00e9n vezette, de m\u00e1r a munk\u00e1latok lez\u00e1r\u00e1s\u00e1ban s a
  v\u00e9gs\u0151 jelent\u00e9s elk\u00e9sz\u00edt\u00e9s\u00e9ben megakad\u00e1lyozta
  \u0151t a hal\u00e1l. Gyakorlati k\u00e9pzetts\u00e9ge sz\u00e9lesebb k\u00f6rben
  elterjedv\u00e9n, t\u00f6bb a m\u00fazeumon k\u00edv\u00fcl \u00e1ll\u00f3 int\u00e9zet
  is re\u00e1 bizta k\u00f6nyvt\u00e1ra szakszer\u0171 elrendez\u00e9s\u00e9t, czm-\u00e9s
  szakkatalogusai elk\u00e9sz\u00edt\u00e9s\u00e9t. Igy 1884-ben a k\u00e9zsm\u00e1rki
  \u00e1g. h.ev. liczeum k\u00f6nyvt\u00e1r\u00e1nak, 1891-ben az Orsz\u00e1gos Magyar
  Gazdas\u00e1gi Egyes\u00fclet k\u00f6nyvt\u00e1r\u00e1nak egyik rendez\u0151je volt,
  az\\n\\nigazs\u00e1g\u00fcgyi miniszt\u00e9rium szakk\u00f6nyvt\u00e1rat pedig 1889-ben
  egymaga rendezte \u00e9s l\u00e1tt\u00e1 el a sz\u00fcks\u00e9ges katalogusokkal.
  De nemcsak gyakorlati t\u00e9ren, hanem a szakirodalomban is szorgalmas munk\u00e1snak
  bizonyult. 1881-t\u0151l 1891-ig foly\u00f3iratunk f\u00fcggel\u00e9k\u00e9ben \u0151
  \u00e1ll\u00edtotta \u00f6ssze a Magyarorsz\u00e1gi k\u00f6nyv\u00e9szetet, 1904-t\u0151l
  hal\u00e1l\u00e1ig A magyarorsz\u00e1gi bibliogr\u00e1fiai irodalom negyed\u00e9ves
  lajstromait, s v\u00e9g\u00fcl a Hazai h\u00edrlapirodalom 1901\u20141909. \u00e9veir\u0151l
  sz\u00f3l\u00f3 jegyz\u00e9kekben a foly\u00f3iratokra vonatkoz\u00f3 fejezetet.
  Legjelent\u0151sebb munk\u00e1ja e nemben: A budapesti kir. m. tud. egyetem b\u00f6lcs\u00e9szeti
  kar\u00e1nak bibliogr\u00e1fi\u00e1ja, mely 1896-ban jelent meg egy \u00f6t\u00f6df\u00e9lsz\u00e1z
  lapra terjed\u0151 vaskos k\u00f6tetben. De nemcsak a modern, hanem a r\u00e9gi
  nyomtatv\u00e1nyok le\u00edr\u00e1sa ter\u00e9n is jelent\u0151s munk\u00e1ss\u00e1got
  fejtett ki. Ilyenm\u0171 munk\u00e1latai k\u00f6z\u00fcl els\u0151 helyen eml\u00edtt\u00fck
  meg A M. N. M\u00fazeum K\u00f6nyvt\u00e1r\u00e1nak \u00f6snyomatv\u00e1nyai cz.
  k\u00f6tet\u00e9t, mely a m\u00fazeumi k\u00f6nyvt\u00e1r katalogusainak sor\u00e1t
  nyitotta meg s \u00e1ttekinthet\u0151s\u00e9g\u00e9vel, pontoss\u00e1g\u00e1val
  az ilyenm\u0171 hazai kiadv\u00e1nyok k\u00f6zt jelent\u0151s szerepet t\u00f6lt
  be. A katalogus elk\u00e9sz\u00fclte ut\u00e1n beszerzett b\u00f6lesk\u00f6ri nyomtatv\u00e1nyokr\u00f3l
  sz\u00f3l\u00f3 p\u00f3tl\u00e9k\u00e1t foly\u00f3iratunk 1900. folyama hozta. E
  nagyobb dolgozatok mellett a Magyar K\u00f6nyvszeml\u00e9nek szinte minden egyik
  \u00e9vfolyama hozott toll\u00e1b\u00f3l t\u00f6bb\u00e9-kev\u00e9sb\u00e9 jelent\u0151s
  adal\u00e9kokat ak\u00e1r r\u00e9gi magyar irodalmunkhoz, ak\u00e1r a magyar k\u00f6nyvt\u00e1rt\u00f6rt\u00e9net\u00e9hez
  s n\u00e9ha szakirodalmi rovatunkat is f\u00f6lkereste a bibliogr\u00e1fiai t\u00f6r\u00e9kv\u00e9seket
  \u00e1t\u00e9rt\u0151, sok j\u00f3indulatr\u00f3l tan\u00fas\u00edkod\u00f3 ismertet\u00e9seivel.
  Eml\u00e9kk\u00e9t kegyelettel \u0151rizz\u00fck!\\n\\nT\u00f3th \u00c1rp\u00e1d
  \u2020. Munk\u00e1s\u00e9lete del\u00e9n, 52 \u00e9ves kor\u00e1ban d\u00f6lt ki
  f. \u00e9. m\u00e1jus h\u00f3 13-\u00e1n a M. N. M\u00fazeum tisztsel\u0151i sor\u00e1b\u00f3l
  T\u00f3th \u00c1rp\u00e1d, az int\u00e9zet titk\u00e1ra, akit, mint a Magyar K\u00f6nyvszemle
  p\u00e9nzt\u00e1ros\u00e1t szorosabb k\u00f6telekkel kapcsoltak foly\u00f3iratunkhoz.
  Az a p\u00e9ldaszer\u0171 k\u00f6teless\u00e9gtud\u00e1s \u00e9s pontoss\u00e1g,
  mely eg\u00e9sz munk\u00e1ss\u00e1g\u00e1t jellemzette, ezen a t\u00e9ren is \u00e9rv\u00e9nyes\u00fclt
  s tette \u00e9rt\u00e9kes\u00e9 k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9t. F\u00e1jlalva
  korai hal\u00e1l\u00e1t, k\u00e9rj\u00fck a Mindenhat\u00f3t, adja meg lelk\u00e9nek
  az \u00f6r\u00f6k nyugodalmat.\\n\\nEm\u0151kei Emich Guszt\u00e1v \u2020. A magyar
  bibliofilek kis csapat\u00e1nak egyik vezet\u0151 alakja, Emich Guszt\u00e1v udvari
  tan\u00e1csos, imm\u00e1r nincsen az \u00e9l\u0151k sor\u00e1ban. A megboldogult
  egyik legel\u0151kel\u0151bb k\u00f6nyvkeresked\u0151nk \u00e9s k\u00f6nyvnyomat\u00f3nk,
  id. Emich Guszt\u00e1v, Pet\u0151fi kiad\u00f3ja fiak\u00e9nt sz\u00fcletett 1843-ban
  Pesten. Gondos neveltet\u00e9sben r\u00e9szes\u00fclt, t\u00f6bb \u00e9vet t\u00f6lt\u00f6tt
  a tenger\u00e9szeti akad\u00e9mi\u00f3n, hosszabb ideig j\u00e1rta a k\u00fclf\u00f6ldi
  egyetemeket s hogy az atyj\u00e1t\u00f3l majdan \u00e1tveend\u0151 \u00fczlet technikai
  rejt\u00e9lyeivel is megismerkedj\u00e9k a bet\u0171szed\u00e9s mesters\u00e9g\u00e9t
  is elsaj\u00e1t\u00edtotta. Az atyja \u00fczlet\u00e9b\u0151l kialakult Athenaeum
  irodalmi \u00e9s nyomdai r. t.-nak hal\u00e1l\u00e1ig volt az igazgat\u00f3ja s
  e der\u00e9k int\u00e9zetnek nyomd\u00e1szati fejl\u0151d\u00e9s\u00e9re, kiad\u00f3i
  tev\u00e9kenys\u00e9g\u00e9nek felvir\u00e1goztat\u00e1s\u00e1ra nagy hat\u00e1st
  gyakorolt. Kultur\u00e1lis szempontb\u00f3l legjelent\u0151sebb tette e t\u00e9ren
  az egykoron\u00e1s teljes Pet\u0151fi-kiad\u00e1s s Mad\u00e1ch dr\u00e1mai k\u00f6ltem\u00e9ny\u00e9nek,
  Az ember trag\u00e9di\u00e1j\u00e1nak n\u00e9pies kiad\u00e1sa volt. Mint k\u00f6nyvgy\u0171jt\u0151
  p\u00e1ratlan \u00e1ldozatk\u00e9szs\u00e9ggel \u00e9s szerencs\u00e9vel gy\u0171jt\u00f6tte
  \u00fagy a hazai vonatkoz\u00e1s\u00fa, mint a k\u00fclf\u00f6ldi mini\u00e1lt k\u00e9ziratokat
  \u00e9s ritka k\u00f6nyveket. Hazafias \u00e1ldozatk\u00e9szs\u00e9g\u00e9nek adta
  tan\u00fajel\u00e9t, a mid\u0151n 1905-ben a tulajdon\u00e1ban volt Corvin-kodexet
  \u00f6t m\u00e1s, hazai vonatkoz\u00e1s\u00fa k\u00e9zirattal egy\u00fctt 20.000
  koron\u00e1\u00e9rt \u00e1tengedte a Nemzeti M\u00fazeumnak,\\n\\nmert k\u00e9ts\u00e9gtelen,
  hogy az \u00e1rver\u00e9s hev\u00e9ben e becses eml\u00e9kek v\u00e9tel\u00e1ra
  j\u00f3val magasabbra sz\u00f6k\u00f6tt volna. K\u00fclf\u00f6ldi vonatkoz\u00e1s\u00fa
  k\u00e9ziratait \u00e9s ritka k\u00f6nyveit a b\u00e9csi Gilhofer cz\u00e9g \u00e1rverezte
  el az eg\u00e9sz m\u0171velt vil\u00e1g \u00e9rdekl\u0151d\u00e9se \u00e9s r\u00e9szv\u00e9te
  mellett. Mint a M\u00fazeumok \u00e9s K\u00f6nyvt\u00e1rak Orsz. Tan\u00e1cs\u00e1nak
  egyik buzg\u00f3 tagja, a k\u00f6nyv \u00fatj\u00e1n terjesztett k\u00f6zm\u0171vel\u0151d\u00e9s
  szolg\u00e1lataib\u00f3l is kivette a maga r\u00e9sz\u00e9t. \u00c1ld\u00e1s poraira!\\n\\nV\u00e1ltoz\u00e1sok
  a M. N. M\u00fazeum k\u00f6nyvt\u00e1ra tiszttvisel\u0151i kar\u00e1ban. Koll\u00e1nyi
  Ferencz m. n. m\u00fazeumi igazgat\u00f3r nagyv\u00e1radi kanonokk\u00e1 neveztetv\u00e9n
  ki, j\u00falius 1-\u00e9vel megv\u00e1lt a M. N. M\u00fazeum Sz\u00e9ch\u00e9nyi
  Orsz. K\u00f6nyvt\u00e1r\u00e1ban viselt \u00e1ll\u00e1s\u00e1t\u00f3l. Koll\u00e1nyi
  Ferencz a Sz\u00e9ch\u00e9nyi csal\u00e1d aj\u00e1nlat\u00e1ra 1892-ben ker\u00fclt
  mint \u0151r a Nemzeti M\u00fazeum k\u00f6teleck\u00e9be s 1902-ben igazgat\u00f3\u00f6rr\u00e9
  l\u00e9pett el\u0151. Itt kifejtett fradahatatlan munk\u00e1ss\u00e1g\u00e1nak maradand\u00f3
  irodalmi eml\u00e9ke a k\u00f6nyvt\u00e1r sz\u00e1z\u00e9ves t\u00f6rt\u00e9nete,
  melynek els\u0151 k\u00f6tete 1905-ben l\u00e1tott napvil\u00e1got. Amily nehezn\u00fckre
  esik Koll\u00e1ny\u00edt\u00f3l, mint az int\u00e9zet egyik legkiv\u00e1l\u00f3bb
  tagj\u00e1t\u00f3l megv\u00e1lni, szintoly \u00f6r\u00f6mmel l\u00e1tjuk \u0151t
  abban a d\u00edszes \u00e1ll\u00e1sban, melyet az egyh\u00e1z \u00e9s tudom\u00e1ny
  szolg\u00e1lat\u00e1ban kifejtett jelent\u0151s munk\u00e1ss\u00e1g\u00e1val oly
  m\u00e9lt\u00f3n ki\u00e9rdelem.\\n\\nDr. Sulica Szil\u00e1rd gyakornokot a nm\u00e9lt.
  vall\u00e1s- \u00e9s k\u00f6zoktat\u00e1s\u00fcgyi miniszter \u00far j\u00falius
  h\u00f3 18-\u00e1n seg\u00e9d\u0151rr\u00e9 m\u00e9lt\u00f3ztatott kinevezni.\\n\\nA
  magyar emigr\u00e1ci\u00f3 egy eml\u00e9ke. A Magyar Nemzeti M\u00fazeum \u00fajabb
  szerzem\u00e9nyei k\u00f6z\u00f6tt van egy el\u00e9gg\u00e9 testes k\u00f6tet a
  k\u00f6vetkez\u0151 c\u00edmmel: \u00abR\u00f6vid magyar t\u00f6rt\u00e9net k\u00e9rd\u00e9sekkel
  \u00e9s feleletekkel. Guyon M\u00e1ria \u00e9s Victor tan\u00edtv\u00e1nyaim sz\u00e1m\u00e1ra
  szerkeszt\u00e9m Damaskusban 1851/2. Pap J\u00e1nos\u00bb (k\u00f6nyvt\u00e1ri jegye:
  1975. Qu. Hung.). A szerz\u0151r\u0151l Szalczer S\u00e1ndor \u00abA magyar emigr\u00e1nsok
  T\u00f6r\u00f6korsz\u00e1gban\u00bb (P\u00e9cs, 1893) c\u00edm\u0171 k\u00f6nyv\u00e9ben
  olvashatni: Honv\u00e9df\u0151hadnagy volt Bem erd\u00e9lyi sereg\u00e9ben s a szabads\u00e1gharc
  lever\u00e9se ut\u00e1n T\u00f6r\u00f6korsz\u00e1gba bujdosott. Itt Szulejm\u00e1n
  n\u00e9v alatt be\u00e1llt a t\u00f6r\u00f6k hadseregbe, de megmaradva kereszt\u00e9ny
  hit\u00e9ben, mint Kmetty \u00e9s Guyon. 1861-ben Olaszorsz\u00e1gban \u00e1llt
  be a magyar emigr\u00e1nsok k\u00f6z\u00e9. A kiegyez\u00e9s ut\u00e1n b\u0171cs\u00fat
  mondva a kalandoknak, haz\u00e1j\u00e1ba t\u00e9rt s hivatalt v\u00e1llalt. Szerette
  elbesz\u00e9lni viszontags\u00e1gos \u00e9let\u00e9t s az \u0151 elbesz\u00e9l\u00e9seib\u0151l
  \u00edrta meg Szalczer eml\u00edtett k\u00f6nyv\u00e9t. E k\u00f6nyvben olvassuk
  (154. l.), hogy Guyon t\u00e1bornok \u2014 t\u00f6r\u00f6k nev\u00e9n Khorsid pasa
  \u2014 Pap J\u00e1nost v\u00e1lasztotta seg\u00e9d\u00edtiszt\u00fcl. A k\u00f6vetkez\u0151
  szavakat int\u00e9zte hozz\u00e1: \u00ab... hadseg\u00e9demnek k\u00edv\u00e1ntam;
  j\u00f3llehet ink\u00e1bb magyar nevel\u0151re volna sz\u00fcks\u00e9gem gyermekeim
  mell\u00e9\u00bb. Hogy Pap J\u00e1nos nevel\u0151nek is meg akart felelni, annak
  bizony\u00f3s\u00e1ga ez a k\u00f6nyv, mely 1910-ben ker\u00fclt a m\u00fazeum birtok\u00e1ba.\\n\\nA
  magyarok t\u00f6rt\u00e9net\u00e9t el\u00e9g r\u00e9szletesen mondja el, l\u00e1ngol\u00f3
  gy\u0171l\u00f6lettel a Habsburg-h\u00e1z ir\u00e1nt, melynek el nem mulaszt kifejez\u00e9st
  adni minden l\u00e9pten-nyomon. A t\u00f6rt\u00e9nelem az 1848 m\u00e1rciusi esem\u00e9nyek
  t\u00e1rgyal\u00e1s\u00e1n\u00e1l sz\u00e9lesedik ki. Itt Szil\u00e1gyi S\u00e1ndor
  \u00abA magyar szabads\u00e1gharc vez\u00e9rf\u00e9rfi\u00e1i\u00bb, 1850-ben n\u00e9vtelen\u00fcl
  megjelent munk\u00e1j\u00e1t haszn\u00e1lja forr\u00e1sul s innen irja ki a vez\u00e9rf\u00e9rfiak
  \u00e9l\u00e9nk, n\u00e9pszer\u0171, de nem mindig megbizhat\u00f3 jellemz\u00e9s\u00e9t.
  Innen veszi G\u00f6rgei elleni gy\u0171l\u00f6let\u00e9t, b\u00e1r ez am\u00fagy
  is term\u00e9szetes Guyon seg\u00e9d\u00edtisztj\u00e9t\u0151l, mert a t\u00e1bornok
  tudvalev\u0151leg mindig G\u00f6rgei ellens\u00e9ge \u00e9s Kossuth\\n\\nlekes hive
  volt. Pap J\u00e1nos egy \u00abG\u00f6rgei \u00e1tka\u00bb c\u00edm\u0171 igen selejtes
  k\u00f6ltem\u00e9nyt is mell\u00e9kelett m\u0171v\u00e9hez, mely al\u00e1 a V\u00f6r\u00f6smarty
  nev\u00e9t \u00edrja. Elbesz\u00e9l\u00e9s\u00e9be k\u00fcl\u00f6nben m\u00e1s k\u00f6ltem\u00e9nyeket
  is belesz\u0151 Pet\u0151fit\u0151l, S\u00e1rosy Gyul\u00e1t\u00f3l stb., nyilv\u00e1n,
  hogy fiatal n\u00f6vend\u00e9keit jobban f\u00f6llelkes\u00edtse. K\u00f6z\u00fcl
  t\u00f6bb mag\u00e1n- \u00e9s hivatalos levelet is, melyeket szint\u00e9n Szil\u00e9gyi
  m\u0171v\u00e9b\u0151l \u00edrt ki.\\n\\nMunk\u00e1ja eml\u00e9kiratszer\u0171v\u00e9
  lesz az erd\u00e9lyi hadj\u00e1rat t\u00e1rgyal\u00e1s\u00e1n\u00e1l. 1849 febru\u00e1r
  6-\u00e1n csatlakozott Bemhez Ih\u00e1sz \u0151rmagy z\u00e1szl\u00f3alj\u00e1val,
  hol mint \u0151rmeister szolg\u00e1lt. \u00c9l\u00e9nken irja le a piskii csat\u00e1t,
  ahol \u00e9letveszedelmen forgott, mikor bajt\u00e1rsaival egy\u00fctt \u00e1tg\u00e1zolt
  a f\u00e9lleg befagyott vizen s\u0171r\u0171 goly\u00f3z\u00e1porban. Nem tagadja,
  hogy \u0151ket is elragadta a harcz vad\u00e1sa, mert bizony lesz\u00fart\u00e1k
  a kegyelmet k\u00e9r\u0151 osztr\u00e1k katon\u00e1t is: \u00absokkal t\u00f6bb
  dolgunk volt, minthogy foglyokkal bajoskodjunk\u00bb. Elbesz\u00e9li azt\u00e1n
  Bem csod\u00e1latos gyors hadj\u00e1rat\u00e1t, a melyel a hatalm\u00e1ba ker\u00edtette
  Erd\u00e9lyt. Nagy n\u00e9lk\u00fclv\u00f6zesen mentek \u00e1t; egyszer n\u00e9gy
  nap n\u00e9gy \u00e9jjel nem aludtak s Pap J\u00e1nos boldognak \u00e9rzi mag\u00e1t,
  hogy feje al\u00e1 teheti borij\u00fat, k\u00f6peny\u00e9be takar\u00f3zh\u00e1t
  s elalhatik a h\u00f3b\u00e1n. Ott l\u00e1tja az \u0151reg Bemet, a mint t\u00e1bori
  t\u0171z mellett melegszik a k\u00f6zleg\u00e9nyekkel egysorban. Hajnalra megered
  a csendes havaz\u00e1s s Pap J\u00e1nost is eg\u00e9szen betakarja feh\u00e9r lepellet,
  mire f\u00f6lkel. Akkor nevezik ki hadnagygy\u00e1.\\n\\nAz eg\u00e9sz k\u00f6nyv
  k\u00e9ts\u00e9gk\u00edv\u00fcl j\u00f3 olvasm\u00e1ny lehetett arra, hogy valakit
  lekes magyarr\u00e1 neveljen. De a sors nem \u00fagy akarta. Guyon Richard igazi
  tipusa volt a nemes kalandornak, a kit nem az anyagi v\u00e1gyak, hanem a lelkesed\u00e9s
  s a dics\u0151s\u00e9g v\u00e1gya visz kereszt\u00fcl az eg\u00e9sz vil\u00e1gon.
  Az angol f\u0151\u00far ifj\u00fa kor\u00e1ban Portug\u00e1liaiba megy, majd az
  osztr\u00e1k hadseregbe l\u00e9p. Magyar asszonyt vett feles\u00e9g\u00fcl s lett
  a szabads\u00e1gharc egyik legb\u00e1trabb, legmer\u00e9szebb bajnoka, hogy v\u00e9g\u00fcl
  mint Khorsid pasa t\u00f6r\u00f6k f\u00f6ldbe t\u00e9rjen \u00f6r\u00f6k nyugalomra.
  Holta ut\u00e1n csal\u00e1dja P\u00e1risba k\u00f6lt\u00f6z\u00f6tt s Guyon Victor,
  Pap J\u00e1nos egyik tan\u00edtv\u00e1nya, \u00fajra haz\u00e1t cser\u00e9lve, francia
  katonai szolg\u00e1latba l\u00e9pett. V.J.\\n\\nUjabb adat Sz\u00e9kely Istv\u00e1n
  Kr\u00f3nik\u00e1j\u00e1nak 1558-iki kiad\u00e1s\u00e1r\u00f3l. Hogy Sz\u00e9kely
  Kr\u00f3nik\u00e1j\u00e1nak 1559-iki krakk\u00f3i kiad\u00e1s\u00e1n [RMK. I. 38.]
  k\u00edv\u00fcl egy 1558-iki ugyanottani els\u0151 kiad\u00e1sa is volt, arr\u00f3l
  a Magyar K\u00f6nyvszemle f. \u00e9. 53-ik lapj\u00e1n 442. sz. a. k\u00f6z\u00f6lt
  adal\u00e9kon k\u00edv\u00fcl bizony\u00e1s\u00e1got tesz Szenczi Moln\u00e1r Albert
  is, ki \u00abNova Grammatica Ungarica... Hanovice. 1610.\u00bb c\u00edm\u0171 m\u0171v\u00e9nek
  \u00abEpistola Dedicatori\u00e1\u00bb-j\u00e1ban, hol a 13-ik lapon err\u0151l az
  \u00e1ltala legr\u00e9gebb magyar k\u00f6nyvnek tartott, de ma m\u00e1r egy p\u00e9ld\u00e1nyban
  sem ismeretes kiad\u00e1sr\u00f3l \u00edgy eml\u00e9kezik meg: \u00abOmnium libroru
  quos adhuc coquirere potui, vetustissimus est, Chronicon mundi, Ungari\u00e6 script\u0169
  \u00e0 Stephano Sz\u00e9kely; edit\u0169 Oracovie in Polonia Anno 1558.\u00bb A
  Szenczi Moln\u00e1r \u00e1ltal Sz\u00e9kely Kr\u00f3nik\u00e1j\u00e1b\u00f3l vett
  id\u00e9zetek k\u00f6z\u00fcl az els\u0151nek sz\u00f6vege ett\u00e9r az 1559-iki
  kiad\u00e1s\u00e9t\u0151l, a mennyiben Istv\u00e1n kir\u00e1lynak a 14-ik lapon
  48. sorsz\u00e1m alatt eml\u00edtett neve \u2014 \u00ab48. Stephanus Rex.\u00bb
  \u2014 az 1559-iki kiad\u00e1s id\u00e9zett 150-ik level\u00e9nek b lapj\u00e1n
  nem fordul el\u0151; ott a n\u00e9vsor 47. sorsz\u00e1m alatt Geiza-val v\u00e9gz\u0151dik
  [\u00ab47. Geiza\u00bb]. Az 1559-iki kiad\u00e1sb\u00f3l hi\u00e1nyoz\u00f3 \u00ab48.
  Stephanus Rex\u00bb szavakat nem Szenczi Moln\u00e1r toldotta be az id\u00e9zetbe,
  mert \u0151, ha az id\u00e9zetbe valamit magyar\u00e1zatul betoldott, azt szegletes
  z\u00e1r\u00f3jel k\u00f6z\u00e9 tette, mint pl. a 17-ik lapon az \u00abEstvan kiraly\u00bb
  szavakat. A Szenczi Moln\u00e1rt\u00f3l id\u00e9zett r\u00e9szletek, melyek k\u00f6z\u00fcl
  a m\u00e1sodik \u00e9s harmadik a 15\u201418. lapokon tal\u00e1lhat\u00f3, az 1559-iki
  kiad\u00e1sban is ugyanazon lapokon tal\u00e1lhat\u00f3k. [A m\u00e1sodik id\u00e9z\u00e9sn\u00e9l
  azonban a \u00abfol. 124.\u00bb helyett \u00abfol. 142.\u00bb olvasand\u00f3]. Megjegyzem
  v\u00e9g\u00fcl, hogy S\u00e1ndor Istv\u00e1n nemesak az eml\u00edtettem [Kszemle.
  1911. 53. l.], n\u00e9metb\u0151l magyarra ford\u00edtott m\u0171v\u00e9nek el\u0151besz\u00e9d\u00e9ben
  sz\u00f3l az 1558-iki kiad\u00e1sr\u00f3l, hanem Magyar K\u00f6nyvesh\u00e1z\u00e1nak
  2-ik lapj\u00e1n is. Ezek az adatok Szab\u00f3 K\u00e1roly figyelm\u00e9t kiker\u00fclt\u00e9k.\\n\\nHars\u00e1nyi
  Istv\u00e1n.\\n\\nAz orsz\u00e1gos lev\u00e9lt\u00e1r \u00faj \u00e9p\u00fclet\u00e9r\u0151l
  a Sz\u00e1zadok szeptemberi f\u00fczet\u00e9ben hosszabb k\u00f6zlem\u00e9nyt olvashatunk.
  A k\u00f6zlem\u00e9ny szerint az \u00faj palota, melynek v\u00e1zlatterveit Pecz
  Samu, m\u0171egyetemi tan\u00e1r k\u00e9sz\u00edtette, a V\u00e1rban, a B\u00e9csi
  kapu-t\u00e9ren fog \u00e9p\u00fclni 3,200,000 K k\u00f6lts\u00e9ggel. A monument\u00e1lis
  \u00e9p\u00fclet h\u00e1rom r\u00e9szre tagoz\u00f3dik: k\u00f6z\u00e9p\u00fctt
  lesz a hivatalokat mag\u00e1ban foglal\u00f3 r\u00e9sz, k\u00e9t oldalt a lev\u00e9lt\u00e1ri
  rakt\u00e1rak, melyek 12 emberragass\u00e1g\u00fa emeletre vannak tervezve. A rakt\u00e1rak
  bels\u0151 oszlopai s minden m\u00e1sodik f\u00f6d\u00e9m vasbetonb\u00f3l, az iratt\u00e1ri
  \u00e1lv\u00e1nyok pedig kov\u00e1csolt vasb\u00f3l k\u00e9sz\u00fcln\u00e9nek.
  A hivatali r\u00e9szben a f\u00e9lemeletre a 12 m. hossz\u00fa, 7 m. sz\u00e9les
  fel\u00fclr\u0151l vil\u00e1g\u00edtott dolgoz\u00f3 terem, az els\u0151 emeletre
  a f\u0151lev\u00e9lt\u00e1ros hivatalos helyis\u00e9gei, a k\u00e9zik\u00f6nyvt\u00e1r
  \u00e9s k\u00e9t lev\u00e9lt\u00e1ros dolgoz\u00f3sob\u00e1ja, a m\u00e1sodik emeletre
  egy lev\u00e9lt\u00e1ros \u00e9s \u00f6t alhev\u00e9lt\u00e1ros r\u00e9sz\u00e9re
  egy-egy szoba \u00e9s a vizsg\u00e1latok terme, a harmadik emeletre pedig h\u00e1rom
  alhev\u00e9lt\u00e1ros \u00e9s a gyakornokok hivatalos helyis\u00e9ge j\u00f6n.
  Hogy ez a rangsorszerinti elhelyez\u00e9s a t\u00e9nyleges k\u00f6vetelm\u00e9nyeknek
  meg fog-e felelni, azt a j\u00f6v\u0151 fogja megmutatni. A rom\u00e1n st\u00edlusban
  tervezett \u00e9p\u00fclet dunai f\u0151homlokzata faragott term\u00e9szk\u0151b\u0151l,
  a mell\u00e9khomlokzatok \u00e9s a k\u00fcl\u00f6n \u00e1ll\u00f3 igazgat\u00f3s\u00e1gi
  \u00e9p\u00fclet fa\u00e7adejai pedig jobbmin\u0151s\u00e9g\u0171 t\u00e9gl\u00e1b\u00f3l
  k\u00e9sz\u00fclnek.\\n\\nMit olvas a magyar n\u00e9p? Erre a k\u00e9rd\u00e9sre
  \u00e9rdekes felelet az az \u00f6ssze\u00e1ll\u00edt\u00e1s, melyet lapunk szerkeszt\u0151je
  k\u00f6z\u00f6l a M\u00fazeumi \u00e9s K\u00f6nyvt\u00e1ri \u00c9rtes\u00edt\u0151
  f. \u00e9. 2\u20143. f\u00fczet\u00e9ben megjelent tanulm\u00e1ny\u00e1ban. Az adatokat
  a szerz\u0151 a M\u00fazeumok \u00e9s K\u00f6nyvt\u00e1rak Orsz. Tan\u00e1csa fenhat\u00f3s\u00e1ga
  al\u00e1 tartoz\u00f3 n\u00e9pk\u00f6nyvt\u00e1rak 1909. \u00e9vi forgalmi kimutat\u00e1saib\u00f3l
  mer\u00edtette \u00e9s csoportos\u00edtotta. A jelent\u00e9st\u00e9telre k\u00f6teles
  552 k\u00f6nyvt\u00e1r k\u00f6z\u00fcl 263 erre a k\u00e9rd\u00e9sre csup\u00e1n
  \u00e1ltal\u00e1noss\u00e1gban mozg\u00f3 v\u00e1laszt adott s be\u00e9rte a legkedveltebb
  \u00edr\u00f3k felsorol\u00e1s\u00e1val, 185 k\u00f6nyvt\u00e1r ellenben minden
  n\u00e9v mell\u00e9 a k\u00f6lcs\u00f6nz\u00e9sek sz\u00e1m\u00e1t is kitette.\\n\\nAz
  els\u0151 csoportba tartoz\u00f3 263 k\u00f6nyvt\u00e1r k\u00f6z\u00fcl 232 J\u00f3kai
  M\u00f3rt vallja legkedvesebb \u00edr\u00f3j\u00e1nak, a m\u00e1sodik a sorban,
  de a vallom\u00e1sok sz\u00e1m\u00e1t tekintve, messze az els\u0151 m\u00f6g\u00f6tt
  Miksz\u00e1th K\u00e1lm\u00e1n 145 szavazattal, a harmadik Benedek Elek, a kire
  134 sz\u00f3 esett, mig a negyedik idegen szerz\u0151: Jules Verne, a kire 104 k\u00f6nyvt\u00e1r
  szavazott. Sz\u00e1zn\u00e1l kevesebb k\u00f6nyvt\u00e1r sorolja legkedveltebb \u00edr\u00f3i
  k\u00f6z\u00e9 G\u00e1rdonyi G\u00e9z\u00e1t (84 k\u00f6nyvt\u00e1r), Gaal M\u00f3zest
  (77), Vas Gerebent (66), R\u00e1kosi Viktort \u00e9s Jen\u0151t (50), Herczeg Ferenczet
  (39),\\n\\n1 Sz\u00e9tv\u00e1lasztani bajos a rajuk vonatkoz\u00f3 adatokat, mert
  a legt\u00f6bb k\u00f6nyvt\u00e1rkezel\u0151 nem teszi ki a keresztn\u00e9vet.\\n\\nE\u00f6tv\u00f6s
  J\u00f3zsefet \u00e9s K\u00e1rolyt (35) \u00e9s J\u00f3sik\u00e1t (32). \u00d6rvendetes
  jelens\u00e9g Beniczkyn\u00e9 (37 eset), Marlitt (16 eset), May K\u00e1roly (3 eset)
  \u00e9s Ohnet (9 eset) h\u00e1tt\u00e9rbe szorul\u00e1sa, a mi ez \u00edr\u00f3k
  fokozatos kik\u00fcsz\u00f6b\u00f6l\u00e9s\u00e9ben leli magyar\u00e1zat\u00e1t
  Ann\u00e1l elszomor\u00edt\u00f3bb jelens\u00e9g, hogy k\u00f6lt\u0151inket alig
  olvass\u00e1k: Aranyt 19, Pet\u0151fit 16, Tomp\u00e1t pedig csak 5 k\u00f6nyvt\u00e1r
  tartotta \u00e9rdemesnek a megeml\u00edt\u00e9sre s tal\u00e1n ezek is ink\u00e1bb
  honoris causa tett\u00e9k!\\n\\nB\u00e1rmily \u00e9rdekesek is azonban ezek az adatok,
  az \u00edr\u00f3k t\u00e9nyleges kedvelts\u00e9g\u00e9r\u0151l k\u00e9pet nem adhatnak,
  mert a nevek pusztta felsorol\u00e1sa nem sejteti vel\u00fcnk, hogy hol kezd\u0151dik
  minden egyes jelent\u00e9sttev\u0151re n\u00e9zve a n\u00e9pszer\u0171s\u00e9g fogalma.
  A k\u00e9rd\u00e9snek ezt az oldal\u00e1t vil\u00e1g\u00edtja meg az a 185 k\u00f6nyvt\u00e1r,
  mely a legolvasottabb szerz\u0151k lajstrom\u00e1n az egyes \u00edr\u00f3kra vonatkoz\u00f3
  k\u00f6lcsonz\u00e9sek sz\u00e1m\u00e1t is felt\u0171nteti. A legolvasottabb \u00edr\u00f3
  ebben a csoportban is J\u00f3kai, akit 161 k\u00f6nyvt\u00e1r eml\u00edt f\u00f6l.
  M\u0171veib\u0151l e 161 k\u00f6nyvt\u00e1rban \u00f6sszesen 19.937 k\u00f6tetet
  olvastak; a legt\u00f6bbet, a h\u00f3dmez\u0151v\u00e1s\u00e1rhelyi k\u00f6zk\u00f6nyvt\u00e1rban.
  Minthogy e k\u00f6nyvt\u00e1rban a sz\u00e9pirodalmi olvasm\u00e1nyok \u00f6sszege
  11.123 k\u00f6tetre rugott, J\u00f3kaira egymag\u00e1ra a sz\u00e9pirodalmi forgalom
  17% -a jut. Vannak azonban k\u00f6nyvt\u00e1rak, melyek forgalm\u00e1ban J\u00f3kai
  m\u00e9g nagyobb sz\u00e1zal\u00e9kkal szerepel. \u00cdgy \u00d3dombov\u00e1rt a
  sz\u00e9pirodalmi olvasm\u00e1nyok 25% -a, Temesv\u00e1r-Erzs\u00e9betv\u00e1rosban
  37-50% -a, Petrilla-De\u00e1kban 50% -a s Beszterceb\u00e1ny\u00e1n 55% /s% -a irhat\u00f3
  J\u00f3kai jav\u00e1ra. Miksz\u00e1th 111 k\u00f6nyvt\u00e1rban szerepel, de a k\u00f6lcsonz\u00e9sek
  v\u00e9g\u00f6sszege csup\u00e1n 6176 k\u00f6tetre r\u00fag. Legt\u00f6bbet a p\u00e9csi
  k\u00f6zponti k\u00f6nyvt\u00e1rban olvastak t\u0151le, 620 k\u00f6tetet, a mi az
  eg\u00e9sz sz\u00e9pirodalmi forgalom 13% -\u00e1nak felel meg. Benedek Elek csak
  91 k\u00f6nyvt\u00e1r jegyz\u00e9k\u00e9ben szerepel, de az olvasott k\u00f6letek
  sz\u00e1m\u00e1t tekintve, t\u00faltesz Miksz\u00e1thon s \u00edgy tulajdonk\u00e9pen
  J\u00f3kai ut\u00e1n \u0151 k\u00f6vetkezik. Az \u0151 m\u0171vei 8662 k\u00f6tettel
  szerepelnek e 91 k\u00f6nyvt\u00e1r forgalm\u00e1ban. A maximumot: 839 k\u00f6tetet
  a kism\u00e1nyai k\u00f6nyvt\u00e1r \u00e9rte el, a mi e k\u00f6nyvt\u00e1r sz\u00e9pirodalmi
  forgalm\u00e1nak 31-50% -\u00e1t teszi. Miksz\u00e1thot, az olvas\u00f3k sz\u00e1m\u00e1t
  tekintve, majd hogy el\u00e9ri, b\u00e1r csak 75 k\u00f6nyvt\u00e1r eml\u00edt meg,
  Jules Verne, a kire e k\u00f6nyvt\u00e1rak forgalm\u00e1ban 5260 k\u00f6tet jut.
  A legt\u00f6bbet a h\u00f3dmez\u0151v\u00e1s\u00e1rhelyiek olvasgatt\u00e1k: \u00f6sszesen
  890 esetben, a mi az ottani forgalom 80% -\u00e1t k\u00e9pviseli. Ha a k\u00f6zkedvelts\u00e9g
  meg\u00e1llap\u00edt\u00e1s\u00e1n\u00e1l nem a szavazatok sz\u00e1m\u00e1t, hanem
  az illet\u0151 \u00edr\u00f3ra es\u0151 kik\u00f6lcs\u00f6nz\u00e9sek mennyis\u00e9g\u00e9t
  vessz\u00fck ir\u00e1nyad\u00f3ul, akkor \u00f6t\u00f6dik helyre Gaal M\u00f3zest
  kell tenn\u00fcnk, a kit\u0151l 51 k\u00f6nyvt\u00e1rban 3717 k\u00f6tetet olvastak
  (sz\u00e1zon fel\u00fcl volt a kik\u00f6lcs\u00f6nz\u00e9sek sz\u00e1ma 6 k\u00f6nyvt\u00e1rban,
  a legt\u00f6bb 1013 k\u00f6tet Kism\u00e1ny\u00e1n), a hatodik hely G\u00e1rdonyi
  G\u00e9z\u00e1t illeti meg, a ki 65 k\u00f6nyvt\u00e1rban 2550 k\u00f6ttel szerepel
  (sz\u00e1zon fel\u00fcl volt a kik\u00f6lcs\u00f6nz\u00e9sek sz\u00e1ma 6 k\u00f6nyvt\u00e1rban,
  a legt\u00f6bb 182 k\u00f6tet Temesv\u00e1r-Erzs\u00e9betv\u00e1rosban); a hetedik
  Beniczkyn\u00e9 B. Lenk\u00e9t, a ki csak 13 k\u00f6nyvt\u00e1r jegyz\u00e9k\u00e9ben
  szerepel ugyan, de sajnos, 2298 k\u00f6ttel (sz\u00e1zon fel\u00fcl \u00e1llt a
  kik\u00f6lcs\u00f6nz\u00e9sek sz\u00e1ma 7 k\u00f6nyvt\u00e1rban, a legt\u00f6bb:
  1295 k\u00f6tet H\u00f3dmez\u0151v\u00e1s\u00e1rhelyt); a nyolcadik helyre, de Beniczkyn\u00e9vel
  majdnem egy vonalba ker\u00fcl Vas Gereben, a kit\u0151l 52 k\u00f6nyvt\u00e1rban
  2278 k\u00f6tetet olvastak (sz\u00e1zon fel\u00fcli k\u00f6lcsonz\u00e9sek sz\u00e1ma
  5, a legt\u00f6bb 413 P\u00e9cssett); kilenczedik a sorban a k\u00e9t R\u00e1kosi,
  a kiknek m\u0171veit 37 k\u00f6nyvt\u00e1rban 1417-szer vett\u00e9k ig\u00e9nybe
  (sz\u00e1zon fel\u00fcli esetek sz\u00e1ma 4,\\n\\na legt\u00f6bb, valamennyi R\u00e1kosi
  Viktort\u00f3l, 308 k\u00f6tet Nagykanizs\u00e1n, m\u00edg R\u00e1kosi Jen\u0151nek
  Gal\u00e1nt\u00e1n volt a legt\u00f6bb olvas\u00f3ja: 50, a mi igen sz\u00e9p sz\u00e1m,
  ha meggondoljuk, hogy egyetlen munka: A kis Kelemen t\u00f6rt\u00e9nete \u00fatj\u00e1n
  \u00e9rett el) \u00e9s a tizedik helyen \u00e1ll Herczeg Ferencz, akinek m\u0171vei
  18 k\u00f6nyvt\u00e1rban 1325 k\u00f6tetes forgalmat \u00e9rtek el (sz\u00e1zon
  fel\u00fcl \u00e1llt a k\u00f6lcs\u00f6nz\u00e9sek sz\u00e1ma 5 k\u00f6nyvt\u00e1rban,
  a legt\u00f6bb: 283 k\u00f6tet P\u00e9cssett). \u00c9rdekes, hogy br. J\u00f3sika
  Mikl\u00f3s, noha 20 k\u00f6nyvt\u00e1r kedvelt \u00edr\u00f3i k\u00f6z\u00e9 szerepel,
  csup\u00e1n 748 k\u00f6tetes forgalmat volt k\u00e9pes el\u00e9rni. Nem kev\u00e9sb\u00e9
  figyelemre m\u00e9lt\u00f3 a kik\u00f6lcs\u00f6nz\u00e9seknek az a viszonylag el\u00e9g
  jelent\u0151s sz\u00e1ma, melyet egyik-m\u00e1sik k\u00f6nyvt\u00e1rban a kev\u00e9sb\u00e9
  \u00e1ltal\u00e1nosan kedvelt \u00edr\u00f3akra n\u00e9zve is kimutatnak. Igy pl.
  Baksay novell\u00e1s k\u00f6tetei Lajtaujtalun 59-szer, Tatab\u00e1ny\u00e1n 36-szor
  \u00e9s B\u00e9k\u00e9s-B\u00e9lmegyeren 21-szer voltak k\u00e9zben; Dickens Bicsk\u00e9n
  75 k\u00f6tetnyi forgalmat \u00e9rt el, Tolsztoj \u00e9s Csehov a kistapolcs\u00e1nyi
  kimitat\u00e1sban 30\u201430 k\u00f6tteltel szerepelnek; Abonyi Lajosr\u00f3l P\u00e9cssett
  316, Bicsk\u00e9n 100 k\u00f6tetnyi forgalmat mutatnak ki; B\u00e1rszony Istv\u00e1n
  csup\u00e1n n\u00e9gy k\u00f6nyvt\u00e1r kimitat\u00e1s\u00e1ban szerepel, de ez
  202 k\u00f6tetnyi forgalmat jelent; k\u00e9t legnagyobb k\u00f6lt\u0151nk k\u00f6z\u00fcl
  Arany 12 k\u00f6nyvt\u00e1rban 357 k\u00f6tetnyi (a legt\u00f6bb 142 k\u00f6tet
  Dett\u00e1n), Pet\u0151fi 9 k\u00f6nyvt\u00e1rban 324 k\u00f6tetnyi (a legt\u00f6bb
  55 k\u00f6tet Csongorban) forgalmat k\u00e9pvisel.\\n\\nAz ismeretterjeszt\u0151
  olvasm\u00e1nyokat illet\u0151leg k\u00e9rd\u0151\u00edveink igen sz\u0171kszavuak.
  Az a p\u00e1r adat, a mely ebbe a k\u00f6rbe v\u00e1g, azt a f\u00f6ltev\u00e9st
  igazolja, hogy els\u0151sorban a hazai t\u00f6rt\u00e9nelem (s ebb\u0151l is f\u0151leg:
  k\u00e9t korszak a kuruczkor \u00e9s a szabads\u00e1gharcz), azut\u00e1n meg az
  \u00fcteir\u00e1sok \u00e9rdeklik a mi n\u00e9p\u00fcnket. \u00cdme a rendelkez\u00e9s\u00fcnkre
  \u00e1ll\u00f3 adatok: Brankovics: A magyar szabads\u00e1gharcz t\u00f6rt\u00e9nete
  P\u00e1p\u00e1n 46-szor, Krizb\u00e1n 8-szor k\u00f6lcs\u00f6n\u00f6z\u00f6ttet
  ki; Br\u00f3zik feldrajzi m\u0171veit Baks\u00e1n 48-szor vett\u00e9k ig\u00e9nybe;
  Er\u0151di \u00fatle\u00edr\u00e1sait a fels\u0151bal\u00e1styai tanyai n\u00e9p
  (Szeged) 19-szer haszn\u00e1lta; Endr\u0151di Magyar h\u00f6lgyek \u00e9letrajzai
  Kisszerdahelyen 5 kik\u00f6lcs\u00f6nz\u00e9st \u00e9rt; Gracza m\u0171veit Csongorban
  48-szor olvast\u00e1k; Szalay-Bar\u00f3ti m\u0171ve B\u00e9k\u00e9s-Kamutkerten
  22 k\u00f6tetnyi, a Szil\u00e1gyi S\u00e1ndor-f\u00e9le Talpason 7 k\u00f6tetnyi
  forgalmat adott: Szter\u00e9nyi Hug\u00f3t Erdeviken 18 esetben, Szivos B\u00e9l\u00e1t
  Szerepen 11 esetben, Smiles-t Egyh\u00e1zasszecs\u00e9d\u00f6n 8 esetben s Thaly
  K\u00e1lm\u00e1nt K\u00e9zdi-V\u00e1s\u00e1rhelyen 15 esetben olvasgatt\u00e1k.\\n\\nVal\u00f3s\u00e1ggal
  revel\u00e1czi\u00f3k\u00e9p hat a kecskem\u00e9t-g\u00e1tt\u00e9ri v\u00e1ndork\u00f6nyvt\u00e1r
  k\u00f6nyvjegyz\u00e9ke, melyet a kezel\u0151, id. Kov\u00e1cs J\u00f3zsef, az egyes
  k\u00f6nyvek 1909-iki haszn\u00e1lati eseteinek pontos felt\u00fcntet\u00e9s\u00e9vel
  ell\u00e1tva terjesztett a Tan\u00e1cs el\u00e9. Minthogy ez a jegyz\u00e9k a szinmagyar
  f\u00f6ldmivel\u0151 n\u00e9p lelki vil\u00e1g\u00e1nak val\u00f3s\u00e1ggal tipikus
  dokumentuma, egyp\u00e1r adat\u00e1t a k\u00f6vetkez\u0151kben ismertetj\u00fck:
  A kik\u00f6lcs\u00f6nz\u00e9sek z\u00f6me: 65 k\u00f6tet a J\u00f3 k\u00f6nyvek
  c\u00edm\u0171 v\u00e1llalat h\u00e9t k\u00f6tet\u00e9re esik; ez ut\u00e1n j\u00f3
