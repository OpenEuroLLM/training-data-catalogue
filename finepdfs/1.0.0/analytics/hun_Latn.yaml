  96\\n\\n5. A SZAKK\u00c9PZ\u00c9S SZAKMAI PROGRAMJA ..........................................................
  97\\n\\n6. SAJ\u00c1TOS NEVEL\u00c9SI IG\u00c9NY\u0170 TANUL\u00d3K ..........................................................
  98\\n6.1. Saj\u00e1tos nevel\u00e9si ig\u00e9ny\u0171 tanul\u00f3k iskolai nevel\u00e9se
  \u00e9s oktat\u00e1sa .......................... 98\\n6.2. A helyi tanterv \u00e9s
  a szakmai program az egyes \u00e9vfolyamok k\u00f6vetelm\u00e9nyeinek teljes\u00edt\u00e9s\u00e9hez
  egy tan\u00edt\u00e1si \u00e9vn\u00e9l hosszabb id\u0151t is megjel\u00f6lhet ..........................
  102\\n\\n1. NEVEL\u00c9SI PROGRAM\\n\\n1.1. Pedag\u00f3giai alapelvek, c\u00e9lok,
  feladatok, eszk\u00f6z\u00f6k, elj\u00e1r\u00e1sok\\n\\n1.1.1. Az iskol\u00e1ban
  foly\u00f3 nevel\u0151-oktat\u00f3 munka pedag\u00f3giai alapelvei\\n\\nIskol\u00e1nkban
  a 21. sz\u00e1zadi kompetenci\u00e1k fejleszt\u00e9s\u00e9t igyeksz\u00fcnk el\u0151t\u00e9rbe
  helyezni oktat\u00f3n\u00e9vel\u0151munk\u00e1nk sor\u00e1n. Di\u00e1kjaink eset\u00e9ben
  az al\u00e1bbi kompetencia ter\u00fcletek fejleszt\u00e9s\u00e9re t\u00f6reksz\u00fcnk:\\n\\n-
  Kreativit\u00e1s \u00e9s innov\u00e1ci\u00f3\\n- Kritikai gondolkod\u00e1s \u00e9s
  probl\u00e9mamegold\u00e1s\\n- Kommunik\u00e1ci\u00f3\\n- Kollabor\u00e1ci\u00f3\\n\\n1.1.2.
  Az iskol\u00e1ban foly\u00f3 nevel\u0151-oktat\u00f3 munka pedag\u00f3giai c\u00e9ljai\\n\\nA
  legfontosabb c\u00e9lunk az \u00e1ltal\u00e1nos \u00e9s sz\u00e9lesk\u00f6r\u0171
  szakmai alapm\u0171velts\u00e9g biztos\u00edt\u00e1sa minden tanul\u00f3nk sz\u00e1m\u00e1ra,
  az egyetemes emberi \u00e9s nemzeti \u00e9rt\u00e9keket fontosnak tart\u00f3 szem\u00e9lyis\u00e9g
  alak\u00edt\u00e1sa, aki testi \u00e9s lelki eg\u00e9szs\u00e9ge \u00e9rdek\u00e9ben
  cselekszik, t\u00e1rsas kapcsolataiban ig\u00e9nyes, \u00e9s mindennapjaiban a konstrukt\u00edv
  \u00e9letvezet\u00e9s elveit k\u00f6veti.\\n\\nA megval\u00f3sul\u00f3 k\u00f6zismereti
  \u00e9s szakmai alapoz\u00f3 oktat\u00e1s szerves egys\u00e9get alkot, \u00e9s az
  egy\u00e9ni k\u00e9pess\u00e9gek fejleszt\u00e9s\u00e9vel biztos\u00edtja a fiatalok
  c\u00e9ljainak el\u00e9r\u00e9s\u00e9t.\\n\\nAz \u00e1ltal\u00e1nos \u00e9s szakmai
  alapoz\u00f3 oktat\u00e1s megteremti a tud\u00e1snak \u00e9s a k\u00e9szs\u00e9geknek
  azt a b\u00e1zis\u00e1t, amelyek birtok\u00e1ban a tanul\u00f3 az ismeretelsaj\u00e1t\u00edt\u00e1s
  k\u00f6r\u00fclm\u00e9nyeit\u0151l elt\u00e9r\u0151 k\u00f6rnyezetben is tud\u00e1s\u00e1t
  \u00e9s k\u00e9pess\u00e9geit felhaszn\u00e1lva cselekszik.\\n\\nKiel\u00e9g\u00edt\u0151
  \u00e1ltal\u00e1nos m\u0171velts\u00e9ggel rendelkezik, k\u00e9pes \u00edrott \u00e9s
  sz\u00f3beli kommunik\u00e1ci\u00f3ra magyar \u00e9s idegen nyelven, produkt\u00edvan
  \u00e9s kreat\u00edvan haszn\u00e1lja fel az inform\u00e1ci\u00f3kat a tov\u00e1bbtanul\u00e1s,
  az \u00e1tk\u00e9pz\u00e9sek, a tov\u00e1bbk\u00e9pz\u00e9sek sor\u00e1n is, meg\u00e9rtve
  \u00e9s elfogadva az eg\u00e9sz \u00e9leten \u00e1t tart\u00f3 tanul\u00e1s fontoss\u00e1g\u00e1t
  \u00e9s szerep\u00e9t.\\n\\nIskol\u00e1nk a kompetenciaalap\u00fa k\u00e9pz\u00e9s
  egyik b\u00e1zisak\u00e9nt kiemelt c\u00e9lj\u00e1nak \u00e9s feladat\u00e1nak tekinti
  a NAT-ban megfogalmazott kulcskompetenci\u00e1k fejleszt\u00e9s\u00e9t.\\n\\n1.1.3.
  Az iskol\u00e1ban foly\u00f3 nevel\u0151-oktat\u00f3 munka feladatai\\n\\nIskol\u00e1nk
  a gazdas\u00e1gi k\u00f6z\u00e9pfok\u00fa \u00e9s fels\u0151fok\u00fa szakemberk\u00e9pz\u00e9sben
  hossz\u00fa \u00e9s eredm\u00e9nyes m\u00faltra tekint vissza, ennek a m\u00faltnak
  hagyom\u00e1nyait folytatjuk \u00e9s mindig \u00fajat teremtve tov\u00e1bbfejlesztj\u00fck.\\n\\nFontos
  tev\u00e9kenys\u00e9g\u00fcnknek tartjuk a tan\u00e1rk\u00e9pz\u00e9s menet\u00e9ben
  referenciaint\u00e9zm\u00e9nyk\u00e9nt r\u00e9szt v\u00e1llalni.\\n\\nOktat\u00e1si
  strat\u00e9gi\u00e1ink legfontosabb eleme: az \u00e1ltal\u00e1nos \u00e9s szakmai
  m\u0171velts\u00e9gtartalmak egym\u00e1st kieg\u00e9sz\u00edt\u0151 \u00e9s meger\u0151s\u00edt\u0151
  kapcsolata.\\n\\nAz oktat\u00e1s k\u00f6z\u00e9piskolai, illetve a 2013/14-es tan\u00e9vt\u0151l
  \u00fajra OKJ-s szakk\u00e9pz\u0151 \u00e9vfolyamokon folyik nappali \u00e9s esti
  k\u00e9pz\u00e9sform\u00e1ban.\\n\\n**Az iskola \u00e1ltal\u00e1nos k\u00e9pz\u00e9si
  modellje:**\\n\\nK\u00f6z\u00e9piskolai k\u00e9pz\u00e9s:\\n\\nAz oktat\u00e1s a
  k\u00f6z\u00e9piskolai szakaszban az \u00e1ltal\u00e1nos iskola 8. oszt\u00e1ly\u00e1t
  befejez\u0151 tanul\u00f3 sikeres felv\u00e9teli elj\u00e1r\u00e1s\u00e1val kezd\u0151dik
  \u00e9s \u00e9retts\u00e9gi vizsg\u00e1val z\u00e1rul.\\n\\nAz \u00e9retts\u00e9gi
  vizsg\u00e1ra felk\u00e9sz\u00edt\u00e9s 4 (hagyom\u00e1nyos k\u00e9pz\u00e9s) illetve
  5 \u00e9ves (intenz\u00edv nyelvi el\u0151k\u00e9sz\u00edt\u0151) oktat\u00e1si
  folyamatban val\u00f3sul meg.\\n\\nA \u201enyek\u201d-es oszt\u00e1lyokban az els\u0151
  \u00e9v alapfeladata a nyelvi ismeretek elm\u00e9ly\u00edt\u00e9se. A k\u00f6vetkez\u0151
  k\u00e9t \u00e9vben \u00e9s a hagyom\u00e1nyos k\u00e9pz\u00e9s\u0171 oszt\u00e1lyok
  9-10. \u00e9vfolyamain az \u00e1ltal\u00e1nos m\u0171velts\u00e9get alapoz\u00f3
  tant\u00e1rgyak mellett megjelennek a szakmai orient\u00e1ci\u00f3s tant\u00e1rgyak.
  Az \u00e9retts\u00e9gi vizsg\u00e1t megel\u0151z\u0151 k\u00e9t \u00e9v feladata
  az \u00e1ltal\u00e1nos m\u0171velts\u00e9g elm\u00e9ly\u00edt\u00e9se \u00e9s a
  p\u00e1lyav\u00e1laszt\u00e1s seg\u00edt\u00e9se, a sikeres \u00e9retts\u00e9gi
  vizsg\u00e1ra \u00e9s a tanulm\u00e1nyok folytat\u00e1s\u00e1ra t\u00f6rt\u00e9n\u0151
  felk\u00e9sz\u00edt\u00e9s.\\n\\nMindk\u00e9t k\u00e9pz\u00e9si form\u00e1ban az
  utols\u00f3 k\u00e9t \u00e9vfolyamon biztos\u00edtjuk az emelt szint\u0171 oktat\u00e1st
  a tanul\u00f3i v\u00e1laszt\u00e1soknak megfelel\u0151en.\\n\\n**A 9-10. \u00e9vfolyamok
  k\u00e9pz\u00e9si szakasz\u00e1nak jellemz\u00e9se:**\\n\\nA befejezett 8. oszt\u00e1ly
  ut\u00e1n felv\u00e9telt nyert tanul\u00f3k sz\u00e1m\u00e1ra k\u00e9t illetve h\u00e1rom
  \u00e9v.\\n\\nA \u201enyek\u201d-es oszt\u00e1lyok els\u0151 \u00e9vfolyam\u00e1n
  hangs\u00falyos a nyelvoktat\u00e1s, az informatikai kompetenci\u00e1k fejleszt\u00e9se,
  a kommunik\u00e1ci\u00f3 \u00e9s az egy\u00e9ni, hat\u00e9kony tanul\u00e1si technik\u00e1k
  elsaj\u00e1t\u00edt\u00e1sa.\\n\\nA k\u00f6vetkez\u0151 k\u00e9t \u00e9vben illetve
  a hagyom\u00e1nyos k\u00e9pz\u00e9s els\u0151 k\u00e9t \u00e9v\u00e9ben ezeken az
  \u00e9vfolyamokon az oktat\u00e1sban a k\u00f6zismereti t\u00e1rgyak oktat\u00e1sa
  a hangs\u00falyos. A tananyagtartalmakat a NAT \u00e9s a kerettantervi aj\u00e1nl\u00e1sok
  hat\u00e1rozz\u00e1k meg.\\n\\nA k\u00f6zismereti oktat\u00e1s sor\u00e1n term\u00e9szettudom\u00e1nyos
  tant\u00e1rgyakat \u00e9s hum\u00e1n m\u0171velts\u00e9gtartalm\u00fa tant\u00e1rgyakat,
  valamint egy vagy k\u00e9t idegen nyelvet tanulnak a tanul\u00f3k. Fontos szerep
  jut a tanul\u00f3k informatikai oktat\u00e1s\u00e1nak, valamint \u00e1ltal\u00e1nos
  inform\u00e1ci\u00f3kezel\u00e9si k\u00e9szs\u00e9geik kialak\u00edt\u00e1s\u00e1nak.\\n\\n**A
  11-12. \u00e9vfolyamok k\u00e9pz\u00e9si szakasz\u00e1nak jellemz\u00e9se:**\\n\\nAz
  \u00e9retts\u00e9gi vizsg\u00e1t megel\u0151z\u0151 k\u00e9t \u00e9v.\\n\\nEzekben
  az \u00e9vfolyamokon k\u00f6zismereti \u00e9s szakmai tant\u00e1rgyakat tan\u00edtunk.\\n\\nAz
  informatika a 11. \u00e9s 12. \u00e9vfolyamon is jelen van, a hum\u00e1n m\u0171velts\u00e9gtartalmak
  oktat\u00e1sa folytat\u00f3dik, \u00e9retts\u00e9gi vizsg\u00e1ra val\u00f3 felk\u00e9sz\u00edt\u00e9ssel
  fejez\u0151dik be. A k\u00f6telez\u0151 \u00e9retts\u00e9gi t\u00e1rgyakb\u00f3l
  valamint a szakmacsoportos alapoz\u00f3 ismeretekb\u0151l emelt szint\u0171 oktat\u00e1s
  felt\u00e9teleit is biztos\u00edtjuk.\\n\\nA k\u00e9pz\u00e9si szakaszt \u00e9retts\u00e9gi
  vizsga z\u00e1rja. A sikeres \u00e9retts\u00e9gi vizsga lehet\u0151v\u00e9 teszi
  a tanul\u00f3k sz\u00e1m\u00e1ra a j\u00f6v\u0151 tervez\u00e9s\u00e9t:\\n\\n- k\u00f6zvetlen\u00fcl,
  OKJ vizsga n\u00e9lk\u00fcl munk\u00e1ba \u00e1llhat,\\n- szakmai k\u00e9pes\u00edt\u00e9st
  szerezhet a szakmai specializ\u00e1ci\u00f3kon\\n- tanulm\u00e1nyait folytathatja
  egyetemen vagy f\u0151iskol\u00e1n,\\n- a 2016/17-es tan\u00e9vt\u0151l az \u00e9retts\u00e9gi
  vizsga komplex szakmai vizsg\u00e1t is tartalmaz, ami munkak\u00f6r bet\u00f6lt\u00e9s\u00e9re
  alkalmas v\u00e9gzetts\u00e9get ad tanul\u00f3inknak.\\n\\n**A szakmai specializ\u00e1ci\u00f3
  szakasza**\\n\\nAz OKJ-s szakk\u00e9pz\u0151 szakasz a sikeres \u00e9retts\u00e9gi
  vizsg\u00e1t k\u00f6vet\u0151en indul \u00e9s szakmai bizony\u00edtv\u00e1nnyal
  z\u00e1rul.\\n\\nAz OKJ-s k\u00e9pz\u00e9s tartalma mindenkor a hat\u00e1lyos t\u00f6rv\u00e9nyi
  szab\u00e1lyoz\u00e1snak megfelel\u0151 tartalommal, az \u00e9rv\u00e9nyes OKJ \u00e9s
  a fels\u0151fok\u00fa k\u00e9pz\u00e9st akkredit\u00e1l\u00f3 programok szerinti
  tartalmak \u00e9s k\u00f6vetelm\u00e9nyek szerint folyik.\\n\\n**A feln\u0151ttoktat\u00e1s**\\n\\nA
  szakk\u00e9pz\u00e9sben esti tagozat m\u0171k\u00f6dik, az al\u00e1bbi szakm\u00e1k
  eset\u00e9n:\\n\\n- 54 344 01 P\u00e9nz\u00fcgyi-sz\u00e1mviteli \u00fcgyint\u00e9z\u0151\\n-
  54 81201 Idegenvezet\u0151\\n- 54 81 203 Turisztikai szervez\u0151, \u00e9rt\u00e9kes\u00edt\u0151\\n\\nTan\u00e1rk\u00e9pz\u00e9s\\n\\nA
  gazdas\u00e1gi szakk\u00e9pz\u00e9s tan\u00e1rk\u00e9pz\u00e9s\u00e9hez kapcsol\u00f3dva
  referenciaint\u00e9zm\u00e9nyk\u00e9nt seg\u00edtj\u00fck a k\u00f6z\u00e9pfok\u00fa
  szakmai k\u00e9pz\u00e9sek tartalm\u00e1nak, nevel\u00e9s-oktat\u00e1s m\u00f3dszer\u00e9nek
  megismertet\u00e9s\u00e9t, gyakorl\u00e1s\u00e1t mentortan\u00e1rok seg\u00edts\u00e9g\u00e9vel.
  Hagyom\u00e1nyosan a BME, Budapesti Corvinus Egyetem, ELTE jelentik hallgat\u00f3i
  b\u00e1zisunkat, de term\u00e9szetesen nyitottak vagyunk m\u00e1s int\u00e9zm\u00e9nyek
  fel\u00e9 is.\\n\\n1.1.4. Az iskol\u00e1ban foly\u00f3 nevel\u0151-oktat\u00f3 munka
  pedag\u00f3giai eszk\u00f6zei, elj\u00e1r\u00e1sai\\n\\nAz iskola oktat\u00e1si-nevel\u00e9si
  programj\u00e1nak c\u00e9ljai csak a mindennapi munk\u00e1ban k\u00f6vetkezetesen
  alkalmazott eszk\u00f6z\u00f6k \u00e9s m\u00f3dszerek haszn\u00e1lat\u00e1val val\u00f3s\u00edthat\u00f3k
  meg.\\n\\nA tanul\u00e1shoz sz\u00fcks\u00e9ges sz\u00f6veg\u00e9rt\u00e9si \u00e9s
  sz\u00f6vegalkot\u00e1si k\u00e9pess\u00e9gek fejleszt\u00e9se l\u00e9nyeges eleme
  ennek a c\u00e9lrendszernek. Sz\u00fcks\u00e9ges megismertetn\u00fcnk tanul\u00f3inkat
  az \u00edrott, besz\u00e9lt \u00e9s k\u00e9pi kommunik\u00e1ci\u00f3 legfontosabb
  elemeivel, a szabatos \u00e9s vil\u00e1gos \u00e9rvel\u00e9s \u00e9s \u00f6nkifejez\u00e9s
  eszk\u00f6zeivel. Minden tant\u00e1rgyban a magyar nyelv helyes haszn\u00e1lat\u00e1ra,
  a sz\u00f3kincs gazdag\u00edt\u00e1s\u00e1ra kell t\u00f6rekedni a nemzeti identit\u00e1s
  megteremt\u00e9se \u00e9rdek\u00e9ben is.\\n\\nMindenkinek biztos\u00edtani kell
  tud\u00e1sa \u00e9s szem\u00e9lyis\u00e9ge egy\u00e9ni fejl\u0151d\u00e9s\u00e9t
  figyelembe egyedi \u00e9s saj\u00e1tos k\u00e9pess\u00e9geire, motiv\u00e1ci\u00f3ira
  a pedag\u00f3giai \u00e9s tan\u00edt\u00e1si m\u00f3dszerek min\u00e9l sz\u00e9lesebb
  differenci\u00e1l\u00e1s\u00e1val, vagyis, hogy a pedag\u00f3gusok nevel\u0151-oktat\u00f3
  munk\u00e1ja a lehet\u0151s\u00e9gekhez m\u00e9rt\u00e9n a legnagyobb m\u00e9rt\u00e9kben
  igazodjon a tanul\u00f3k egy\u00e9ni fejletts\u00e9g\u00e9hez, k\u00e9pess\u00e9geihez
  \u00e9s az egyes tant\u00e1rgyakb\u00f3l ny\u00fajtott teljes\u00edtm\u00e9ny\u00e9hez.\\n\\nA
  tanul\u00f3knak a passz\u00edv befogad\u00f3 attit\u0171d kialakul\u00e1s\u00e1nak
  elker\u00fcl\u00e9se \u00e9s a manipul\u00e1ci\u00f3k elleni v\u00e9dekez\u00e9s
  c\u00e9lj\u00e1b\u00f3l meg kell tanulni a fel\u00e9j\u00fck ir\u00e1nyul\u00f3
  kommunik\u00e1ci\u00f3 kritikai szeml\u00e9l\u00e9s\u00e9t, elemz\u00e9s\u00e9t,
  \u00e9rtelmez\u00e9s\u00e9t.\\n\\nA fiataloknak fokozatosan alkalmass\u00e1 kell
  v\u00e1lniuk a gondolatok \u00e9s fogalmak elemz\u00e9s\u00e9re, azok \u00f6sszerendez\u00e9s\u00e9re,
  a racion\u00e1lis gondolatmenet kialak\u00edt\u00e1s\u00e1ra. Fontos a logikus \u00f6sszef\u00fcgg\u00e9seken,
  rendszerben val\u00f3 gondolkod\u00e1s, a k\u00fcl\u00f6nb\u00f6z\u0151 inform\u00e1ci\u00f3k
  k\u00f6z\u00f6tti eligazod\u00e1s k\u00e9pess\u00e9ge, a l\u00e9nyeges \u00e9s a
  j\u00e1rul\u00e9kos k\u00f6z\u00f6tti k\u00fcl\u00f6nbs\u00e9gt\u00e9tel.\\n\\nK\u00e9pess\u00e9
  kell v\u00e1lniuk az eg\u00e9sz vil\u00e1gra kiterjed\u0151 inform\u00e1ci\u00f3\u00e1raml\u00e1sba
  val\u00f3 bekapcsol\u00f3d\u00e1sra, a leg\u00fajabb inform\u00e1ci\u00f3szerz\u00e9si,
  -feldolgoz\u00e1si \u00e9s \u2013\u00e1tad\u00e1si technik\u00e1k haszn\u00e1lat\u00e1ra.\\n\\nSzorgalmazni
  kell a tanul\u00f3i aktivit\u00e1st, fenntartani a motiv\u00e1lts\u00e1got, t\u00e1g
  teret adni az egy\u00e9ni munkam\u00f3dszereknek \u00e9s hozz\u00e1seg\u00edteni
  a tanul\u00f3t egy\u00e9ni tanul\u00e1si strat\u00e9gia kialak\u00edt\u00e1s\u00e1hoz,
  valamint tanul\u00e1si, t\u00e1j\u00e9koz\u00f3d\u00e1si m\u00f3dszerek megtanul\u00e1s\u00e1hoz
  a di\u00e1k elv\u00e1r\u00e1sai szerint.\\n\\nAz interpol\u00e1ci\u00f3s k\u00e9pess\u00e9gek
  kialak\u00edt\u00e1sa csak tanul\u00f3i aktivit\u00e1ssal lehets\u00e9ges. Ez a
  tanul\u00e1s \u00e1lland\u00f3 gyakorl\u00e1s, probl\u00e9mafelismer\u00e9s \u00e9s
  megold\u00e1skeres\u00e9s, folytonos \u00f6nk\u00e9nt v\u00e1llalt aktivit\u00e1s.
  Az elv\u00e9gzett tev\u00e9kenys\u00e9gek \u00e9rt\u00e9kel\u00e9se a kapott feladatok
  megval\u00f3s\u00edt\u00e1s\u00e1nak m\u00f3dja \u00e9s sz\u00ednvonala, a probl\u00e9m\u00e1kra
  adott v\u00e1laszok min\u0151s\u00e9ge szerint t\u00f6rt\u00e9nik.\\n\\nPontos,
  fegyelmezett, kitart\u00f3, \u00f6n\u00e1ll\u00f3 munk\u00e1ra, feladataik elv\u00e9gz\u00e9s\u00e9nek
  megszervez\u00e9s\u00e9re \u00e9s munk\u00e1juk ellen\u0151rz\u00e9s\u00e9re kell
  szoktatni a tanul\u00f3kat - ak\u00e1r egyed\u00fcl, ak\u00e1r csoportban dolgoznak
  - az auton\u00f3mia \u00e9s a felel\u0151ss\u00e9gtudat kialak\u00edt\u00e1sa \u00e9rdek\u00e9ben.\\n\\nAz
  iskol\u00e1nak a vil\u00e1got olyan fel\u00e9p\u00edtm\u00e9nyk\u00e9nt kell bemutatnia,
  amelynek alak\u00edt\u00e1sa mindannyiunk feladata, s nem olyannak, ami m\u00e1r
  befejezett alkot\u00e1s.\\n\\nA jogok \u00e9s k\u00f6teless\u00e9gek tudatos\u00edt\u00e1sa
  a demokr\u00e1cia gyakorl\u00e1s\u00e1hoz sz\u00fcks\u00e9ges k\u00e9pess\u00e9geket
  fejleszti. Fontos a felel\u0151s t\u00e1rsadalmi magatart\u00e1s kialak\u00edt\u00e1sa,
  az \u00e1llampolg\u00e1ri l\u00e9tre felk\u00e9sz\u00edt\u00e9s, a term\u00e9szeti
  \u00e9s mesters\u00e9ges k\u00f6rnyezet felel\u0151s haszn\u00e1lata. A gyakorlati
  \u00e9letben felmer\u00fcl\u0151 k\u00e9rd\u00e9sekre v\u00e1laszt tal\u00e1lni:
  pl. a tudatos fogyaszt\u00f3v\u00e9delem elsaj\u00e1t\u00edt\u00e1sa \u00e9s a k\u00fcl\u00f6nb\u00f6z\u0151
  \u00e9lethelyzetekben a tud\u00e1sra \u00e9p\u00fcl\u0151 \u00f6n\u00e1ll\u00f3
  v\u00e9lem\u00e9ny kialak\u00edt\u00e1s\u00e1ra t\u00f6rekedni.\\n\\nA komplex szem\u00e9lyis\u00e9gfejleszt\u00e9sben
  fontos szerepet kapjon az \u00f6nismeret - az er\u0151s \u00e9s gyenge pontok felismer\u00e9se,
  a fejlett \u00e9s re\u00e1lis \u00f6n\u00e9rt\u00e9kel\u00e9s, az \u00f6nbizalom
  er\u0151s\u00edt\u00e9se gyakori pozit\u00edv meger\u0151s\u00edt\u00e9ssel, a kezdem\u00e9nyez\u0151
  \u00e9s v\u00e1llalkoz\u00f3 k\u00e9szs\u00e9gek, az \u00edt\u00e9l\u0151k\u00e9pess\u00e9g,
  az erk\u00f6lcsi \u00e9s eszt\u00e9tikai \u00e9rz\u00e9kenys\u00e9g, az \u00e9rzelmi
  intelligencia kialak\u00edt\u00e1sa.\\n\\nA szem\u00e9lyis\u00e9gfejleszt\u00e9sben
  meghat\u00e1roz\u00f3 az iskola arculata, hagyom\u00e1nyai, bels\u0151 k\u00f6rnyezete
  \u00e9s l\u00e9gk\u00f6re.\\n\\n1.2. Szem\u00e9lyis\u00e9gfejleszt\u00e9ssel kapcsolatos
  pedag\u00f3giai feladatok\\n\\nAz iskolai nevel\u0151i munk\u00e1nk alapvet\u0151
  c\u00e9lja tanul\u00f3ink szem\u00e9lyis\u00e9genek szervezett, tervezett kibontakoztat\u00e1sa,
  a sokoldal\u00faan fejlett, eg\u00e9szs\u00e9ges lelk\u00fclet\u0171 szem\u00e9lyis\u00e9g
  kialak\u00edt\u00e1sa. Mivel minden tev\u00e9kenys\u00e9gform\u00e1nak szem\u00e9lyis\u00e9gfejleszt\u0151
  hat\u00e1sa van, csak sz\u00e9lesk\u00f6r\u0171 tev\u00e9kenys\u00e9gk\u00e9szlettel
  \u00e9rhet\u00fcnk el eredm\u00e9nyeket. \u00cdgy szem\u00e9lyis\u00e9gfejleszt\u00e9si
  alapelv\u00fcnk az, hogy megjel\u00f6lt feladatainkat az iskolai \u00e9let valamennyi
  megnyilv\u00e1nul\u00e1s\u00e1n\u00e1l, valamennyi tan\u00f3r\u00e1n, tan\u00f3r\u00e1n
  k\u00edv\u00fcli nevel\u00e9si szintereken \u00e9rv\u00e9nyes\u00edten\u00fcnk kell.
  Igyeksz\u00fcnk minden lehet\u0151s\u00e9get kiakn\u00e1zni nevel\u00e9si c\u00e9lkit\u0171z\u00e9seink
  \u00e9rdek\u00e9ben felhaszn\u00e1lva a kompetenciaalap\u00fa pedag\u00f3giai fejleszt\u00e9s
  soksz\u00edn\u0171 ter\u00fclet\u00e9t.\\n\\nA szem\u00e9lyis\u00e9gfejleszt\u00e9ssel
  kapcsolatos feladatainkat az iskol\u00e1ban foly\u00f3 oktat\u00f3-nevel\u0151 munka
  pedag\u00f3giai alapelveivel \u00f6sszhangban jel\u00f6lt\u00fck meg: \u00e9rt\u00e9kk\u00f6zvet\u00edt\u00e9s,
  a szem\u00e9lyis\u00e9g \u00f6szt\u00f6nz\u0151 funkci\u00f3j\u00e1nak fejleszt\u00e9se,
  a konstrukt\u00edv \u00e9letvezet\u00e9s ig\u00e9ny\u00e9nek megteremt\u00e9se \u00e9s
  a tanul\u00f3inkban rejl\u0151 k\u00e9pess\u00e9gek kibontakoztat\u00e1sa. T\u00f6reksz\u00fcnk
  tov\u00e1bb\u00e1 az erk\u00f6lcsi, eszt\u00e9tikai, k\u00f6z\u00f6ss\u00e9gi nevel\u00e9s
  hat\u00e9konys\u00e1g\u00e1nak fokoz\u00e1s\u00e1ra, az el\u0151\u00edt\u00e9letek
  felismertet\u00e9s\u00e9re, a szocializ\u00e1ci\u00f3ban mutatkoz\u00f3 hi\u00e1nyok
  p\u00f3tl\u00e1s\u00e1ra, a viselked\u00e9si norm\u00e1k elsaj\u00e1t\u00edt\u00e1s\u00e1ra,
  a helyes, eg\u00e9szs\u00e9ges \u00e9letm\u00f3dot folytat\u00f3, devianci\u00e1kat
  ker\u00fcl\u0151 szem\u00e9lyis\u00e9g kialak\u00edt\u00e1s\u00e1ra.\\n\\nFeladataink
  teljes\u00fcl\u00e9se \u00e9rdek\u00e9ben a szem\u00e9lyis\u00e9g komplex fejleszt\u00e9s\u00e9t
  szolg\u00e1l\u00f3 tev\u00e9kenys\u00e9geink a k\u00f6vetkez\u0151 ter\u00fcletekre
  ir\u00e1nyulnak:\\n\\n**Az \u00e9rtelem fejleszt\u00e9se:**\\n\\n- pedag\u00f3giai
  tev\u00e9kenys\u00e9geinkkel (differenci\u00e1lt \u00e9s csoportmunka alkalmaz\u00e1s\u00e1val,
  siker\u00e9lm\u00e9nyhez juttat\u00e1ssal) fejlesztj\u00fck a tanul\u00f3k motiv\u00e1ci\u00f3s
  b\u00e1zis\u00e1t;\\n- t\u00f6reksz\u00fcnk az intellektu\u00e1lis tev\u00e9kenys\u00e9g
  megszeretettet\u00e9s\u00e9re, az \u00f6nk\u00e9pz\u00e9s, az optim\u00e1lis teljes\u00edt\u00e9sv\u00e1gy
  sz\u00fcks\u00e9glet\u00e9nek kialak\u00edt\u00e1s\u00e1ra;\\n- lehet\u0151s\u00e9get,
  teret enged\u00fcnk a kreat\u00edv kezdem\u00e9nyez\u00e9sekn\u00e9l, felk\u00e9sz\u00edtj\u00fck
  tanul\u00f3inkat a teljes\u00edtm\u00e9nyhelyzethez val\u00f3 alkalmazkod\u00e1sra
  (tehets\u00e9ggondoz\u00f3 szakk\u00f6r\u00f6k, tanulm\u00e1nyi versenyek, nemzetk\u00f6zi
  projektekben val\u00f3 r\u00e9szv\u00e9tel);\\n- t\u00f6reksz\u00fcnk az \u00e9rdekl\u0151d\u00e9s
  \u00e9lm\u00e9nyekkel t\u00f6rt\u00e9n\u0151 felkelt\u00e9s\u00e9re, a probl\u00e9mamegold\u00f3
  tev\u00e9kenys\u00e9g motiv\u00e1l\u00e1s\u00e1ra;\\n- valamennyi tant\u00e1rgy
  keret\u00e9n bel\u00fcl sz\u00fcks\u00e9gesnek tartjuk a tanul\u00e1s tan\u00edt\u00e1s\u00e1t,
  a tanul\u00e1sm\u00f3dszertan hangs\u00falyos jelenl\u00e9t\u00e9t, egy\u00e9ni
  m\u00f3dszerek, elj\u00e1r\u00e1sok kialak\u00edt\u00e1s\u00e1t.\\n\\nAz \u00e9rzelmek,
  a szem\u00e9lyes k\u00e9pess\u00e9gek fejleszt\u00e9se:\\n\\n- pedag\u00f3giai munk\u00e1nkban
  hangs\u00falyt fektet\u00fcnk az \u00f6nismeret fejleszt\u00e9s\u00e9re, az eg\u00e9szs\u00e9ges
  \u00f6nv\u00e9delmi k\u00e9pess\u00e9gek elsaj\u00e1t\u00edt\u00e1s\u00e1ra (\u00f6nismereti
  \u00f3r\u00e1k, oszt\u00e1lyf\u0151n\u00f6ki \u00f3r\u00e1k, egy\u00e9ni besz\u00e9lget\u00e9sek,
  iskol\u00e1n k\u00edv\u00fcli lehet\u0151s\u00e9gek);\\n- fontosnak tartjuk az \u00f6nfeljegyz\u0151,
  stabil \u00e9rt\u00e9krendszerrel \u00e9l\u0151, helyes teljes\u00edtm\u00e9ny\u00e9rt\u00e9kel\u00e9ssel,
  er\u0151s akarattal rendelkez\u0151 szem\u00e9lyis\u00e9gek kialak\u00edt\u00e1s\u00e1t;\\n-
  seg\u00edtj\u00fck az \u00e9rzelmi probl\u00e9m\u00e1kkal k\u00fczd\u0151, szem\u00e9lyis\u00e9gfejl\u0151d\u00e9s\u00fckben
  zavart szenved\u0151 tanul\u00f3inkat egy\u00e9ni seg\u00edt\u0151 besz\u00e9lget\u00e9sekkel,
  illetve a gyermekv\u00e9delem egy\u00e9b eszk\u00f6zeinek felhaszn\u00e1l\u00e1s\u00e1val.\\n\\nA
  szoci\u00e1lis k\u00e9pess\u00e9g fejleszt\u00e9se:\\n\\n- a toleranci\u00e1ra val\u00f3
  nevel\u00e9sben, az empatikus k\u00e9szs\u00e9gek fejleszt\u00e9s\u00e9ben, a megfelel\u0151
  konfliktuskezel\u00e9si technik\u00e1k elsaj\u00e1t\u00edttat\u00e1s\u00e1ban jel\u00f6lj\u00fck
  meg f\u0151 ir\u00e1nyvonalunkat, mely sor\u00e1n sz\u00e9lesk\u00f6r\u0171en alkalmazzuk
  a Szoci\u00e1lis, \u00e9letviteli \u00e9s k\u00f6rnyezeti kompetenciater\u00fclet
  fejleszt\u00e9si programj\u00e1n alapul\u00f3 ismereteket, tov\u00e1bb\u00e1 igyeksz\u00fcnk
  hat\u00e9konyan alkalmazni a k\u00fcl\u00f6nf\u00e9le tr\u00e9ningek nevel\u00e9si
  lehet\u0151s\u00e9geit k\u00fcl\u00f6nb\u00f6z\u0151 tant\u00e1rgyak keretei k\u00f6z\u00f6tt;\\n-
  t\u00f6reksz\u00fcnk a helyes magatart\u00e1si, viselked\u00e9si norm\u00e1k kialak\u00edt\u00e1s\u00e1ra,
  meger\u0151s\u00edt\u00e9s\u00e9re, a viselked\u00e9s alapvet\u0151 erk\u00f6lcsi
  \u00e9rt\u00e9keken alapul\u00f3 betart\u00e1s\u00e1ra;\\n- a kooperat\u00edv k\u00e9szs\u00e9gek
  fejleszt\u00e9s\u00e9nek ter\u00fclet\u00e9n fontosnak tartjuk a team-munka m\u00f3dszereinek
  elsaj\u00e1t\u00edt\u00e1s\u00e1t, a v\u00e9lem\u00e9nynyilv\u00e1n\u00edt\u00e1si
  k\u00e9szs\u00e9g kialak\u00edt\u00e1s\u00e1t, a szem\u00e9lyes felel\u0151ss\u00e9gen
  alapul\u00f3 v\u00e9lem\u00e9nyek kultur\u00e1lt st\u00edlusban t\u00f6rt\u00e9n\u0151
  megnyilatkoz\u00e1s\u00e1t;\\n- a pedag\u00f3gus hat\u00e9kony modellk\u00f6zvet\u00edt\u0151
  szerep\u00e9nek v\u00e1llal\u00e1s\u00e1val minden ter\u00fcleten fejlesztj\u00fck
  a hat\u00e9kony kommunik\u00e1ci\u00f3t, a d\u00f6nt\u00e9shozatal, a magabiztoss\u00e1g
  k\u00e9pess\u00e9g\u00e9nek gyakorl\u00e1s\u00e1t (sz\u00f3beli feleletek, csoportmunk\u00e1k,
  versenyek, di\u00e1kn\u00f6vend\u00e9kek feladatok);\\n- igyeksz\u00fcnk p\u00f3tolni
  a szocializ\u00e1ci\u00f3 sor\u00e1n kialakult kultur\u00e1lis hi\u00e1nyoss\u00e1gokat;\\n-
  seg\u00edtj\u00fck a k\u00f6t\u0151d\u00e9si k\u00e9pess\u00e9gek fejleszt\u00e9s\u00e9t,
  a k\u00f6z\u00f6ss\u00e9gek szociometriai h\u00e1l\u00f3j\u00e1nak megism\u00e9r\u00e9s\u00e9t,
  a tartalmas emberi kapcsolatok ig\u00e9ny\u00e9nek kialak\u00edt\u00e1s\u00e1t;\\n-
  hazaszeretetre, a k\u00f6z\u00f6ss\u00e9gek kultur\u00e1lis \u00e9rt\u00e9keinek
  megbecs\u00fcl\u00e9s\u00e9re, a hazai \u00e9s egyetemes kult\u00fara kincseinek
  \u00e9rt\u00e9kel\u00e9s\u00e9re nevel\u00fcnk;\\n- fontosnak tartjuk, hogy tanul\u00f3ink
  k\u00e9pesek legyenek eligazodni a jelen t\u00e1rsadalmi v\u00e1ltoz\u00e1sokban,
  kialak\u00edts\u00e1k saj\u00e1t \u00e1ll\u00e1spontjukat a t\u00f6rt\u00e9n\u00e9sekkel
  kapcsolatban, \u00e9s felel\u0151s \u00e1llampolg\u00e1rr\u00e1 v\u00e1ljanak.\\n\\n1.3.
  A teljesk\u00f6r\u0171 eg\u00e9szs\u00e9gfejleszt\u00e9ssel \u00f6sszef\u00fcgg\u0151
  feladatok\\n\\nA testi-lelki eg\u00e9szs\u00e9g v\u00e9delme, a helyes attit\u0171d
  kialak\u00edt\u00e1sa az eg\u00e9szs\u00e9ges, kultur\u00e1lt \u00e9letm\u00f3d
  \u00e1ltal val\u00f3sul meg, ez\u00e9rt di\u00e1kjainkban ezen \u00e9letm\u00f3d
  sz\u00fcks\u00e9glet\u00e9nek kialak\u00edt\u00e1s\u00e1t minden pedag\u00f3gus
  szem\u00e9lyes feladat\u00e1nak tekinti, mely a nevel\u0151munka eg\u00e9sz\u00e9t
  \u00e1thatja.\\n\\nA teljes k\u00f6r\u0171 eg\u00e9szs\u00e9gfejleszt\u00e9si programot
  nyomon k\u00f6vethet\u0151 m\u00f3don kell megtervezni, amelyet a nevel\u0151test\u00fclet
  az iskolaeg\u00e9szs\u00e9g\u00fcgyi szolg\u00e1lat k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9vel
  k\u00e9sz\u00edt el.\\n\\nC\u00e9lunk, hogy a tanul\u00f3kban kialakuljanak az al\u00e1bbi
  \u00e9rt\u00e9kek:\\n\\n- \u00f6nmagukkal \u00e9s k\u00f6rnyezet\u00fckkel szembeni
  \u00e9rz\u00e9kenys\u00e9g \u00e9s felel\u0151ss\u00e9g\u00e9rzet;\\n- \u00e9letm\u00f3d
  \u00e9s eg\u00e9szs\u00e9gi \u00e1llapot ok-okozati \u00f6sszef\u00fcgg\u00e9seinek
  felismer\u00e9se;\\n- testi \u00e9s lelki eg\u00e9szs\u00e9g harmonikus megval\u00f3s\u00edt\u00e1sa;\\n-
  j\u00f6v\u0151 tervez\u00e9se \u00e9s az \u00e9let\u00fat tudatos \u00e9p\u00edt\u00e9se;\\n-
  eg\u00e9szs\u00e9g- \u00e9s k\u00f6rnyezetv\u00e9d\u0151 magatart\u00e1s;\\n- eg\u00e9szs\u00e9ges
  \u00e9letm\u00f3d, kiegyens\u00falyozott \u00e9letvitel;\\n- \u00f6nismertet\\n-
  munk\u00e1hoz sz\u00fcks\u00e9ges nyugodt, rendezett k\u00f6rnyezet \u00e9s a munka,
  pihen\u0151 id\u0151 megfelel\u0151 ar\u00e1ny\u00e1nak kialak\u00edt\u00e1sa;\\n-
  elfogad\u00f3 \u00e9s seg\u00edt\u0151k\u00e9sz magatart\u00e1s a beteg, s\u00e9r\u00fclt,
  fogyat\u00e9kos emberek ir\u00e1nt;\\n- konfliktuskezel\u0151 kommunik\u00e1ci\u00f3s
  k\u00e9pess\u00e9gek;\\n- nemis\u00e9ggel kapcsolatos felel\u0151ss\u00e9gteljes
  magatart\u00e1s;\\n- felel\u0151s d\u00f6nt\u00e9shozz\u00e1si k\u00e9pess\u00e9g
  az eg\u00e9szs\u00e9gv\u00e9delem \u00e9rdek\u00e9ben.\\n\\nA program tartalma:\\n\\na)
  Az eg\u00e9szs\u00e9ges t\u00e1pl\u00e1lkoz\u00e1sra val\u00f3 ig\u00e9ny kialak\u00edt\u00e1sa\\n\\nb)
  A mindennapos testnevel\u00e9s, testmozg\u00e1s\\n\\nInt\u00e9zm\u00e9ny\u00fcnk
  a mindennapos testnevel\u00e9st \u2013 felhaszn\u00e1lhat\u00f3 er\u0151forr\u00e1sainkat
  figyelembe v\u00e9ve \u2013 a t\u00f6rv\u00e9nyi el\u0151\u00edr\u00e1soknak megfelel\u0151en
  felmen\u0151 rendszerben heti \u00f6t tan\u00f3ra keret\u00e9ben biztos\u00edtja
  egy\u00fcttm\u0171k\u00f6dve a MH Vit\u00e9z Szurmay S\u00e1ndor Budapest Hely\u0151rs\u00e9g
  Dand\u00e1rral a KatonaSuli/Honv\u00e9d Kad\u00e9t program adta lehet\u0151s\u00e9gek
  keretein bel\u00fcl.\\n\\nc) A testi \u00e9s lelki eg\u00e9szs\u00e9g fejleszt\u00e9se,
  a viselked\u00e9si f\u00fcgg\u0151s\u00e9gek, a szenved\u00e9lybetegs\u00e9gekhez
  vezet\u0151 szerek fogyaszt\u00e1s\u00e1nak megel\u0151z\u00e9se, betegs\u00e9gek
  elker\u00fcl\u00e9se az eg\u00e9szs\u00e9g meg\u00f3v\u00e1sa \u00e9rdek\u00e9ben\\n\\nA
  testi-lelki eg\u00e9szs\u00e9gfejleszt\u00e9s alapj\u00e1t a ment\u00e1lhigi\u00e9n\u00e9s
  szeml\u00e9let hat\u00e1rozza meg.\\n\\nEnnek f\u0151 alkot\u00f3elemei:\\n\\n-
  tev\u00e9kenys\u00e9g \u00e9s terhel\u00e9s harmonikus, kiegyens\u00falyozott ar\u00e1nya;\\n-
  helyes magatart\u00e1s betegs\u00e9g eset\u00e9n;\\n- eg\u00e9szs\u00e9ges, korszer\u0171,
  rendszeres t\u00e1pl\u00e1lkoz\u00e1s;\\n- helyes napirend, \u00e9letrend kialak\u00edt\u00e1sa;\\n-
  az eg\u00e9szs\u00e9get fenyeget\u0151 k\u00f6rnyezetkar\u00f3z\u00edt\u00f3 anyagok,
  k\u00f6rnyezeti \u00e1rtalmak ismerete;\\n- \u00f6nismertet, \u00f6nkontroll, \u00f6nbizalom,
  auton\u00f3mia, szem\u00e9lyis\u00e9g meg\u0151rz\u00e9se;\\n- pozit\u00edv \u00e9letszeml\u00e9let
  elsaj\u00e1t\u00edt\u00e1sa;\\n- szorong\u00e1s- \u00e9s stresszold\u00f3 technik\u00e1k
  alkalmaz\u00e1sa; k\u00fcl\u00f6nb\u00f6z\u0151 (pozit\u00edv \u00e9s negat\u00edv)
  \u00e9lm\u00e9nyek feldolgoz\u00e1sa;\\n- emberismeret, emp\u00e1tia, alkalmazkod\u00f3k\u00e9pess\u00e9g,
  nyitotts\u00e1g;\\n- probl\u00e9mamegold\u00f3 \u00e9s konfliktuskezel\u0151 k\u00e9szs\u00e9g
  fejleszt\u00e9se;\\n- d\u00f6nt\u00e9si k\u00e9pess\u00e9g, \u00e9rzelmek kifejez\u0151
  k\u00e9szs\u00e9g fejleszt\u00e9se;\\n- egy\u00e9ni k\u00e9pess\u00e9gek, lehet\u0151s\u00e9gek
  \u00e9s c\u00e9lok \u00f6sszhangja;\\n- devianci\u00e1k ter\u00e9n a f\u00fcgg\u0151s\u00e9ghoz
  vezet\u0151 mot\u00edvumok felt\u00e1r\u00e1sa, illetve szok\u00e1sok megel\u0151z\u00e9se,
  tudatos\u00edt\u00e1sa (az iskola drogstrat\u00e9gi\u00e1ja);\\n- eg\u00e9szs\u00e9gk\u00e1ros\u00edt\u00f3
  \u00e9lvezeti szerek (alkohol-, nikotin- \u00e9s k\u00e1v\u00e9fogyaszt\u00e1s)
  megismer\u00e9se;\\n- serkent\u0151k, nyugtat\u00f3k, drogok alkalmaz\u00e1si ter\u00fcleteinek
  pontos\u00edt\u00e1sa;\\n- szenved\u00e9lybetegs\u00e9gek (alkoholizmus, narkom\u00e1nia,
  egy\u00e9b f\u00fcgg\u0151s\u00e9gek) felismer\u00e9se;\\n- a f\u00fcgg\u0151s\u00e9g
  eg\u00e9szs\u00e9gk\u00e1ros\u00edt\u00f3 k\u00f6vetkezm\u00e9nyei;\\n- a konfliktus-
  \u00e9s v\u00e1ls\u00e1gkezel\u00e9s m\u00e1s, lehets\u00e9ges megold\u00e1sai.\\n\\nd)
  A b\u00e1ntalmaz\u00e1s \u00e9s iskolai er\u0151szak megel\u0151z\u00e9se\\n\\nAz
  iskolai H\u00e1zirend, SZMSZ betart\u00e1s\u00e1val, betartatat\u00e1s\u00e1val.\\n\\ne)
  A baleset-megel\u0151z\u00e9s \u00e9s els\u0151seg\u00e9lyny\u00fajt\u00e1s\\n\\nTer\u00fcletei:\\n\\n-
  Baleseti \u00f3v\u00f3rendszb\u00e1lyok ismerete, balesetek elker\u00fcl\u00e9se.\\n-
  K\u00f6zleked\u00e9si kult\u00fara fejleszt\u00e9se (a gyalogos \u00e9s ker\u00e9kp\u00e1ros
  k\u00f6zleked\u00e9s szab\u00e1lyai, a t\u00f6megk\u00f6zleked\u00e9si eszk\u00f6z\u00f6k
  haszn\u00e1lata, stb.)\\n\\n\u2022 Az els\u0151seg\u00e9ly-ny\u00fajt\u00e1si alapismereteket
  az eg\u00e9szs\u00e9gnevel\u00e9si program keret\u00e9ben tan\u00edtjuk, amely az
  oszt\u00e1lyf\u0151n\u00f6ki \u00e9s ment\u00e1lhigi\u00e9n\u00e9s munkak\u00f6z\u00f6ss\u00e9g
  k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9vel, t\u00e1mogat\u00e1s\u00e1val val\u00f3sul
  meg.\\n\\n\u2022 Az MH Vit\u00e9z Szurmay S\u00e1ndor Budapest Hely\u0151rs\u00e9g
  Dand\u00e1rral k\u00f6t\u00f6tt egy\u00fcttm\u0171k\u00f6d\u00e9si meg\u00e1llapod\u00e1s
  keret\u00e9ben a Katonai alapismeretek tant\u00e1rgy oktat\u00e1sa sor\u00e1n is
  tan\u00edtunk els\u0151seg\u00e9ly-ny\u00fajt\u00e1si ismereteket k\u00fcls\u0151
  szakemberek bevon\u00e1s\u00e1val.\\n\\n**f) A szem\u00e9lyi higi\u00e9ne**\\n\\nTer\u00fcletei:\\n\u2022
  rendszeres tiszt\u00e1lkod\u00e1s szab\u00e1lyainak er\u0151s\u00edt\u00e9se;\\n\u2022
  id\u0151j\u00e1r\u00e1snak, \u00e9vszaknak megfelel\u0151 \u00f6lt\u00f6zk\u00f6d\u00e9s.\\n\\nA
  program sz\u00ednterei:\\n\u2022 tan\u00f3rai foglalkoz\u00e1sok;\\n\u2022 tan\u00f3r\u00e1n
  k\u00edv\u00fcli foglalkoz\u00e1sok;\\n  \u2013 d\u00e9lut\u00e1ni szabadid\u0151s
  foglalkoz\u00e1sok (stresszkezel\u0151, szem\u00e9lyis\u00e9gfejleszt\u0151 foglalkoz\u00e1sok,
  vet\u00e9lked\u0151k);\\n  \u2013 kir\u00e1ndul\u00e1sok, sportprogramok.\\n\\nSeg\u00edt\u0151
  szakemberek:\\n\u2022 eg\u00e9szs\u00e9gnevel\u0151 (biol\u00f3gia szakos tan\u00e1r);\\n\u2022
  iskolaorvos, v\u00e9d\u0151n\u0151;\\n\u2022 oszt\u00e1lyf\u0151n\u00f6k\u00f6k\\n\u2022
  testnevel\u0151 tan\u00e1r;\\n\u2022 di\u00e1kk\u00f6nkorm\u00e1nyzatot seg\u00edt\u0151
  pedag\u00f3gus.\\n\\nK\u00fcl\u00f6z\u0151 seg\u00edt\u0151 kapcsolatok:\\n\u2022
  sz\u00fcl\u0151k;\\n\u2022 gyermekj\u00f3l\u00e9ti szolg\u00e1latok;\\n\u2022 csal\u00e1dseg\u00edt\u0151
  szolg\u00e1latok;\\n\u2022 nevel\u00e9si tan\u00e1csad\u00f3k;\\n\u2022 tanul\u00e1si
  k\u00e9pess\u00e9get vizsg\u00e1l\u00f3 szak\u00e9rt\u0151i bizotts\u00e1gok;\\n\u2022
  gyermekv\u00e9delmi \u00e9s ifj\u00fas\u00e1gseg\u00edt\u0151 civil szervezetek\\n\u2022
  rendv\u00e9delmi szervek.\\n\\n1.4. K\u00f6z\u00f6ss\u00e9gfejleszt\u00e9ssel, az
  iskola szerepl\u0151inek egy\u00fcttm\u0171k\u00f6d\u00e9s\u00e9vel kapcsolatos
  feladatok\\n\\nAz iskola k\u00f6z\u00f6ss\u00e9gfejleszt\u0151 munk\u00e1j\u00e1nak
  alapvet\u0151 c\u00e9lja, hogy a tanul\u00f3kat megtan\u00edtsa a csoportos, hat\u00e9kony
  egy\u00fcttm\u0171k\u00f6d\u00e9sre, k\u00f6z\u00f6s gondolkoz\u00e1sra \u00e9s
  tev\u00e9kenys\u00e9gre, valamint az al\u00e1bbi magatart\u00e1sform\u00e1k kialak\u00edt\u00e1s\u00e1ra:
  bizalom, meg\u00e9rt\u00e9s, t\u00e1mogat\u00e1s, egy\u00fcttm\u0171k\u00f6d\u00e9si
  \u00e9s konszenzusk\u00e9szs\u00e9g.\\n\\nA k\u00f6z\u00f6ss\u00e9gi feladatok sz\u00ednterei
  a k\u00f6vetkez\u0151k:\\n\\n**Tanul\u00f3ifj\u00fas\u00e1g k\u00f6z\u00f6ss\u00e9gei**\\n\\n-
  az iskola, \u00e9vfolyam k\u00f6z\u00f6ss\u00e9gei;\\n- oszt\u00e1lyk\u00f6z\u00f6ss\u00e9gek;\\n-
  fakultat\u00edv csoportos \u00f3r\u00e1k tanul\u00f3csoportjai;\\n- k\u00e9tszint\u0171
  \u00e9retts\u00e9gi miatt kialakul\u00f3 tanul\u00f3csoportok;\\n- di\u00e1k\u00f6nkorm\u00e1nyzat.\\n\\n**Feln\u0151tt
  k\u00f6z\u00f6ss\u00e9gek**\\n\\n- nevel\u0151test\u00fclet;\\n- munkak\u00f6z\u00f6ss\u00e9gek,
  szakmai \u00e9s feladatk\u00f6zpont\u00fa munkacsoportok;\\n- egy oszt\u00e1lyban
  tan\u00edt\u00f3 k\u00f6z\u00f6ss\u00e9gek;\\n- azonos k\u00e9pz\u00e9si form\u00e1ban
  tan\u00edt\u00f3k k\u00f6z\u00f6ss\u00e9gei;\\n- sz\u00fcl\u0151i munkak\u00f6z\u00f6ss\u00e9gek.\\n\\n**Oszt\u00e1lyk\u00f6z\u00f6ss\u00e9g**\\n\\nFontos
  feladat az oszt\u00e1lyf\u0151n\u00f6ki \u00f3ra keret\u00e9ben az adott oszt\u00e1lyt
  \u00e9rint\u0151 gondok megbesz\u00e9l\u00e9se \u00e9s a k\u00fcl\u00f6nb\u00f6z\u0151
  probl\u00e9m\u00e1k k\u00f6z\u00f6s megold\u00e1sa k\u00f6lcs\u00f6n\u00f6s v\u00e9lem\u00e9nyform\u00e1l\u00e1ssal.
  Kiemelked\u0151 szerepet t\u00f6lt be az oszt\u00e1ly di\u00e1kbizotts\u00e1ga,
  amely minden oszt\u00e1lyk\u00f6z\u00f6ss\u00e9gn\u00e9l a koordin\u00e1ci\u00f3s
  feladatokban \u00e9s az oszt\u00e1lyt \u00e9rint\u0151 k\u00e9rd\u00e9sekben k\u00e9pviseleti
  csoportk\u00e9nt j\u00e1r el. Nagyon fontos, hogy a megv\u00e1lasztott di\u00e1k
  (j\u00f3 \u00e9rtelemben vett) vez\u00e9regy\u00e9nis\u00e9g legyen, hogy az oszt\u00e1lyf\u0151n\u00f6k
  v\u00e9lem\u00e9nyform\u00e1l\u00f3 pedag\u00f3giai m\u00f3dszerei \u00e1ltala is
  kihassanak az adott oszt\u00e1lyk\u00f6z\u00f6ss\u00e9gre.\\n\\nFakultat\u00edv
  csoportok/egy\u00e9ni \u00f3r\u00e1k tanul\u00f3csoporthjai\\n\\nIde tartozik a
  szakk\u00f6r, k\u00e9pz\u0151m\u0171v\u00e9szeti szakk\u00f6r, stb.\\n\\nA m\u0171v\u00e9szetekkel
  kapcsolatos szakk\u00f6r\u00f6k szerepe, hogy a tanul\u00f3kat egy k\u00f6z\u00f6s
  c\u00e9l ir\u00e1ny\u00e1ba mozgatva fejlessze \u00fagy, hogy egym\u00e1st\u00f3l
  is tanuljanak.\\n\\nLegf\u0151bb c\u00e9lja az \u00e9rt\u00e9kek elm\u00e9ly\u00edt\u00e9se,
  tiszteletben tart\u00e1sa, m\u00e1s ter\u00fcletek ismereteinek alkalmaz\u00e1sa
  \u00e9s a kreativit\u00e1s \u00f6nmegval\u00f3s\u00edt\u00e1s \u00e1ltal t\u00f6rt\u00e9n\u0151
  fejleszt\u00e9se.\\n\\nK\u00e9tszint\u0171 \u00e9retts\u00e9gi miatt kialakul\u00f3
  tanul\u00f3csoporthok\\n\\nLegfontosabb feladata az oszt\u00e1lyk\u00f6z\u00f6ss\u00e9gek
  egyben tart\u00e1sa \u00fagy, hogy m\u00e1s csoportokkal p\u00e1rhuzamosan is megval\u00f3suljon
  a tanul\u00e1shoz sz\u00fcks\u00e9ges k\u00f6z\u00f6ss\u00e9g.\\n\\nDi\u00e1k\u00f6nkorm\u00e1nyzat\\n\\nA
  tanul\u00f3k \u00e9s a tanul\u00f3k\u00f6z\u00f6ss\u00e9gek \u00e9rdekeinek k\u00e9pviselet\u00e9re,
  a tanul\u00f3k tan\u00f3r\u00e1n k\u00edv\u00fcli, szabadid\u0151s tev\u00e9kenys\u00e9g\u00e9nek
  seg\u00edt\u00e9s\u00e9re az iskol\u00e1ban di\u00e1k\u00f6nkorm\u00e1nyzat m\u0171k\u00f6dik.
  Az iskolai di\u00e1k\u00f6nkorm\u00e1nyzat munk\u00e1j\u00e1t az oszt\u00e1lyokban
  megv\u00e1lasztott k\u00fcld\u00f6ttekb\u0151l \u00e1ll\u00f3 di\u00e1k\u00f6nkorm\u00e1nyzati
  vezet\u0151s\u00e9g ir\u00e1ny\u00edtja. A di\u00e1k\u00f6nkorm\u00e1nyzat tev\u00e9kenys\u00e9g\u00e9t
  az iskola igazgat\u00f3ja \u00e1ltal megb\u00edzott nevel\u0151 seg\u00edti. A di\u00e1k\u00f6nkorm\u00e1nyzat
  a szervez\u00e9shez, \u00e9rdekk\u00e9pviseleti m\u00f3dszerek elsaj\u00e1t\u00edt\u00e1s\u00e1hoz
  sz\u00fcks\u00e9ges k\u00f6z\u00f6ss\u00e9gi csoport. \u00c1ltaluk panaszkezel\u00e9si
  bizotts\u00e1g hozhat\u00f3 l\u00e9tre. A csoportos feladatok megbesz\u00e9l\u00e9s\u00e9n\u00e9l
  a di\u00e1kok saj\u00e1t maguk d\u00f6ntenek r\u00e9szfeladataik v\u00e9grehajt\u00e1s\u00e1r\u00f3l,
  amelynek kivitelez\u00e9s\u00e9ben a di\u00e1k\u00f6nkorm\u00e1nyzatot vezet\u0151
  tan\u00e1r seg\u00edt meghagyva a di\u00e1kok szabad d\u00f6nt\u00e9si jog\u00e1t.\\n\\nC\u00e9lja,
  hogy a di\u00e1kok megismerj\u00e9k a demokr\u00e1cia \u00e1ltal adott lehet\u0151s\u00e9geket
  a nyilv\u00e1noss\u00e1g szem\u00e9lyis\u00e9ggform\u00e1l\u00f3 ereje \u00e1ltal.
  Megtanuljanak \u00e9rt\u00e9keket k\u00f6zvet\u00edtve \u00f6n\u00e1ll\u00f3an v\u00e9lem\u00e9nyt
  nyilv\u00e1n\u00edtani az \u0151ket \u00e9rint\u0151 k\u00e9rd\u00e9sekben. C\u00e9l
  tov\u00e1bb\u00e1 az is, hogy k\u00e9pess\u00e9 v\u00e1ljanak megv\u00e9deni saj\u00e1t
  \u00e1ll\u00e1spontjukat \u00e9s megval\u00f3s\u00edtani pozit\u00edv c\u00e9lkit\u0171z\u00e9seiket.
  Ez a csoport szervesen kihat az iskolai di\u00e1kk\u00f6z\u00f6ss\u00e9g eg\u00e9sz\u00e9re
  \u00e9s meghat\u00e1rozza a tanul\u00f3i l\u00e9gk\u00f6rt.\\n\\nNevel\u0151test\u00fclet\\n\\nEgy
  k\u00fcl\u00f6nb\u00f6z\u0151 tudom\u00e1nyter\u00fcletek k\u00e9pvisel\u0151ib\u0151l
  \u00e1ll\u00f3, szakmai munkak\u00f6z\u00f6ss\u00e9gekb\u0151l fel\u00e9p\u00fcl\u0151
  heterog\u00e9n k\u00f6z\u00f6ss\u00e9g. Els\u0151dleges c\u00e9lja az oktat\u00e1si
  tev\u00e9kenys\u00e9gen t\u00fal a tanul\u00f3k ir\u00e1ny\u00e1ba ny\u00fajtott
  p\u00e9ldamutat\u00e1s.\\n\\nMunkak\u00f6z\u00f6ss\u00e9gek, szakmai \u00e9s feladatk\u00f6zpont\u00fa
  munkacsoportok\\n\\nEls\u0151dleges feladatuk a szakmai tan\u00e1csad\u00e1s, amely
  nemcsak a tananyag r\u00e9szletes kidolgoz\u00e1s\u00e1t jelenti, hanem az ehhez
  kapcsol\u00f3d\u00f3 esetleges szakir\u00e1ny\u00fa felvil\u00e1gos\u00edt\u00e1st.
  Rendk\u00edv\u00fcl fontos az egys\u00e9ges k\u00f6vetelm\u00e9nyrendszer kialak\u00edt\u00e1sa,
  valamint a k\u00f6lcs\u00f6n\u00f6s tolerancia, a pedag\u00f3giai m\u00f3dszerek
  megbesz\u00e9l\u00e9se \u00e9s tiszteletben tart\u00e1sa.\\n\\nEgy oszt\u00e1lyban
  tan\u00edt\u00f3k k\u00f6z\u00f6ss\u00e9gei\\n\\nNagyon fontos a di\u00e1kokkal
  kapcsolatos feladatok \u00e9s tapasztalatok egyeztet\u00e9se: pl. dolgozatok \u00edrat\u00e1s\u00e1nak
  egyeztet\u00e9se, tanult t\u00e9mak\u00f6r\u00f6k kapcsolati rendszer\u00e9nek egyeztet\u00e9se,
  stb.\\n\\nAzonos k\u00e9pz\u00e9si form\u00e1ban tan\u00edt\u00f3k k\u00f6z\u00f6ss\u00e9gei\\n\\nAz
  azonos k\u00e9pz\u00e9si form\u00e1ban tan\u00edt\u00f3k k\u00f6z\u00f6tt kialakul\u00f3
  szakmai kapcsolatok ann\u00e1l is ink\u00e1bb l\u00e9nyegesek, hisz csak teljesk\u00f6r\u0171
  egy\u00fcttm\u0171k\u00f6d\u00e9ssel \u00e9rhet\u00fcnk el val\u00f3di eredm\u00e9nyeket.
  Az azonos feladatok, hasonl\u00f3 probl\u00e9m\u00e1k megold\u00e1s\u00e1ra l\u00e9trej\u00f6tt
  k\u00f6z\u00f6ss\u00e9gek t\u00f6bbf\u00e9l\u00e9k lehetnek: pl. OKJ-s k\u00e9pz\u00e9s,
  intenz\u00edv nyelvi el\u0151k\u00e9sz\u00edt\u0151s \u00e9vfolyami k\u00e9pz\u00e9s,
  KatonaSuli/Honv\u00e9d Kad\u00e9t program, stb.\\n\\nSz\u00fcl\u0151i Szervezet\\n\\nMaxim\u00e1lisan
  sz\u00e1m\u00edtunk a sz\u00fcl\u0151k egy\u00fcttm\u0171k\u00f6d\u00e9s\u00e9re
  az iskolai \u00e9let szinte minden ter\u00fclet\u00e9n mind a nevel\u0151, mind
  az oktat\u00f3 munk\u00e1t ide \u00e9rtve. Folyamatos visszajelz\u00e9st, meger\u0151s\u00edt\u00e9st,
  kritikai gondolatokat v\u00e1runk t\u0151l\u00fck, hogy ezeket be\u00e9p\u00edtve
  a napi munk\u00e1nkba m\u00e9g hat\u00e9konyabban gyakorolhassuk feladatainkat.\\n\\nEbben
  a munk\u00e1ban seg\u00edtenek a sz\u00fcl\u0151i \u00e9rtekezletek, fogad\u00f3\u00f3r\u00e1k,
  a Sz\u00fcl\u0151i Szervezet megbesz\u00e9l\u00e9sei.\\n\\nA fentiekben bemutatott
  k\u00f6z\u00f6ss\u00e9gek aj\u00e1nlott tev\u00e9kenys\u00e9gform\u00e1i:\\n\\nA
  tanul\u00f3i szem\u00e9lyis\u00e9g fejleszt\u00e9s\u00e9nek legfontosabb sz\u00edntere
  a hosszabb tan\u00edt\u00e1si-tanul\u00e1si folyamatba illeszked\u0151 tan\u00edt\u00e1si
  \u00f3ra.\\n\\nA tan\u00edt\u00e1si-tanul\u00e1si folyamat megszervez\u00e9se sor\u00e1n
  kiemelten fontosnak tartjuk a tanul\u00f3k motiv\u00e1l\u00e1s\u00e1t, a tanul\u00f3i
  aktivit\u00e1s biztos\u00edt\u00e1s\u00e1t \u00e9s a differenci\u00e1l\u00e1st,
  melynek el\u0151seg\u00edt\u00e9s\u00e9ben minden fent nevezett csoportnak r\u00e9szt
  kell v\u00e1llalnia, egy\u00fctt kell m\u0171k\u00f6dnie.\\n\\nAz iskol\u00e1ban
  a nevel\u00e9si \u00e9s oktat\u00e1si c\u00e9lok megval\u00f3s\u00edt\u00e1s\u00e1t
  az al\u00e1bbi tan\u00edt\u00e1si \u00f3r\u00e1n k\u00edv\u00fcli tev\u00e9kenys\u00e9gek
  seg\u00edtik:\\n\\n**Az iskolai sportk\u00f6r**: Tagja az iskola minden tanul\u00f3ja.
  Az iskolai sportk\u00f6r a tan\u00f3r\u00e1i testnevel\u00e9si \u00f3r\u00e1kkal
  egy\u00fctt biztos\u00edtja a tanul\u00f3k mindennapi testedz\u00e9s\u00e9t, valamint
  a tanul\u00f3k felk\u00e9sz\u00edt\u00e9s\u00e9t a k\u00fcl\u00f6nf\u00e9le sport\u00e1gakban
  az iskolai \u00e9s iskol\u00e1n k\u00edv\u00fcli sportversenyekre.\\n\\n**Szakk\u00f6r\u00f6k**:
  A k\u00fcl\u00f6nf\u00e9le szakk\u00f6r\u00f6k m\u0171k\u00f6d\u00e9se a tanul\u00f3k
  egy\u00e9ni k\u00e9pess\u00e9geinek fejleszt\u00e9s\u00e9t szolg\u00e1lja. A szakk\u00f6r\u00f6k
  jelleg\u00fcket tekintve lehetnek m\u0171v\u00e9sziak, technikaiak, szakt\u00e1rgyiak,
  de szervez\u0151dhetnek valamilyen k\u00f6z\u00f6s \u00e9rdekl\u0151d\u00e9si k\u00f6r
  alapj\u00e1n is. A szakk\u00f6r\u00f6k ind\u00edt\u00e1s\u00e1r\u00f3l \u2013 felmer\u00fcl\u0151
  ig\u00e9nyek \u00e9s az iskola lehet\u0151s\u00e9geinek figyelembe v\u00e9tel\u00e9vel
  \u2013 minden tan\u00e9v elej\u00e9n az iskola nevel\u0151test\u00fclete d\u00f6nt.\\n\\n**Di\u00e1k\u00e9tkeztet\u00e9s**:
  Iskol\u00e1nk nem rendelkezik \u00e9tteremmel illetve konyh\u00e1val. Ez\u00e9rt
  azok a tanul\u00f3k, akik ig\u00e9nylik, a BGSZC Arany J\u00e1nos M\u0171szaki Szakgimn\u00e1ziuma
  \u00e9s Szakk\u00f6z\u00e9piskol\u00e1j\u00e1nak Ny\u00e1r utca 9. sz\u00e1m alatti
  \u00e9p\u00fclet\u00e9ben tal\u00e1lhat\u00f3 \u00e9tteremben \u00e9tkezhetnek.
  Az \u00e9tkez\u00e9s\u00e9rt fizetend\u0151 \u00f6sszeget a mindenkor hat\u00e1lyos
  jogszab\u00e1lyok alapj\u00e1n hat\u00e1rozzuk meg. A tanul\u00f3i hozz\u00e1j\u00e1rul\u00e1s
  \u00f6sszeg\u00e9t - bele\u00e9rtve a kedvezm\u00e9nyeket is- a p\u00e9nzt\u00e1rban
  kell befizetni a kihirdetett hat\u00e1rid\u0151ig, ahol ennek fej\u00e9ben a tanul\u00f3k
  megkapj\u00e1k az \u00e9tkez\u00e9si jegyeket.\\n\\n**A k\u00f6nyvt\u00e1r**: Biztos\u00edtja
  a di\u00e1kok sz\u00e1m\u00e1ra a tan\u00f3r\u00e1kra, a versenyekre val\u00f3 felk\u00e9sz\u00fcl\u00e9st,
  a m\u0171vel\u0151d\u00e9st, a sz\u00f3rakoz\u00e1st sz\u00e9pirodalmi \u00e9s szakirodalmi
  m\u0171vek, tank\u00f6nyvek helyben olvas\u00e1s\u00e1val \u00e9s k\u00f6lcs\u00f6nz\u00e9s\u00e9vel,
  elektronikus adathordoz\u00f3k \u00e9s internet haszn\u00e1lat\u00e1val. A k\u00f6nyvt\u00e1ros
  tan\u00e1r tan\u00f3ra keret\u00e9ben oktatja a di\u00e1kokat a k\u00f6nyvt\u00e1r
  haszn\u00e1lat\u00e1ra. K\u00f6z\u00f6ss\u00e9gi helyet teremt sz\u00e1mukra, k\u00fcl\u00f6nb\u00f6z\u0151
  programok helysz\u00edn\u00e9\u00fcl szolg\u00e1lhat. A k\u00f6nyvt\u00e1r lehet\u0151s\u00e9get
  biztos\u00edt arra, hogy a szak\u00f3r\u00e1kon a di\u00e1kok, \u00e9s a szaktan\u00e1rok,
  az inform\u00e1ci\u00f3szerz\u00e9s k\u00fcl\u00f6nb\u00f6z\u0151 form\u00e1it,
  tov\u00e1bb\u00e1 a k\u00f6nyv \u00e9s k\u00f6nyvt\u00e1r haszn\u00e1latot gyakorolhass\u00e1k.\\n\\n**Versenyek,
  vet\u00e9lked\u0151k**: A tehets\u00e9ges tanul\u00f3k tov\u00e1bbfejleszt\u00e9s\u00e9t
  seg\u00edtik a k\u00fcl\u00f6nf\u00e9le (szakt\u00e1rgyi, sport, stb.) versenyek,
  vet\u00e9lked\u0151k, amelyeket az iskol\u00e1ban \u00e9vente rendszeresen szervez\u00fcnk.
  A legtehets\u00e9gesebb tanul\u00f3kat az iskol\u00e1n k\u00edv\u00fcli versenyeken
  (OKTV, \u00c1SZ\u00c9V, egy\u00e9b k\u00f6zismereti \u00e9s szakmai versenyek: pl.
  Kazinczy-verseny, stb.) val\u00f3 r\u00e9szv\u00e9telre is felk\u00e9sz\u00edtj\u00fck.
  A versenyek, vet\u00e9lked\u0151k megszervez\u00e9s\u00e9t, illetve a tanul\u00f3k
  felk\u00e9sz\u00edt\u00e9s\u00e9t a k\u00fcl\u00f6nf\u00e9le versenyekre a tan\u00e1rok
  szakmai munkak\u00f6z\u00f6ss\u00e9gei vagy a szaktan\u00e1rok v\u00e9gzik.\\n\\nTanulm\u00e1nyi
  kir\u00e1ndul\u00e1sok: Az iskola nevel\u0151i a tantervi k\u00f6vetelm\u00e9nyek
  teljes\u00fcl\u00e9se, a nevel\u0151munka el\u0151seg\u00edt\u00e9se c\u00e9lj\u00e1b\u00f3l
  az oszt\u00e1lyok sz\u00e1m\u00e1ra \u00e9vente egy alkalommal tanulm\u00e1nyi kir\u00e1ndul\u00e1st
  szerveznek.\\n\\nM\u00fazeuml\u00e1togat\u00e1shoz, m\u0171v\u00e9szeti el\u0151ad\u00e1shoz
  kapcsol\u00f3d\u00f3 foglalkoz\u00e1sok: A Nemzeti alaptantervben meghat\u00e1rozott
  kulcskompetenci\u00e1k fejleszt\u00e9se c\u00e9lj\u00e1b\u00f3l (k\u00fcl\u00f6n\u00f6s
  tekintettel a hat\u00e9kony, \u00f6n\u00e1ll\u00f3 tanul\u00e1s, a szoci\u00e1lis
  \u00e9s \u00e1llampolg\u00e1ri kompetencia valamint az eszt\u00e9tikai-m\u0171v\u00e9szeti
  tudatoss\u00e1g \u00e9s kifejez\u0151k\u00e9pess\u00e9g fejleszt\u00e9se \u00e9rdek\u00e9ben)
  nem szakrendszer\u0171 oktat\u00e1s keret\u00e9ben is t\u00f6rt\u00e9nik oktat\u00e1s.
  Egy-egy tant\u00e1rgy n\u00e9h\u00e1ny t\u00e9m\u00e1j\u00e1nak feldolgoz\u00e1s\u00e1t
  a k\u00f6vetelm\u00e9nyek teljes\u00edt\u00e9s\u00e9re szolg\u00e1lj\u00e1k a k\u00fcl\u00f6nf\u00e9le
  k\u00f6zm\u0171vel\u0151d\u00e9si int\u00e9zm\u00e9nyekben, illetve m\u0171v\u00e9szeti
  el\u0151ad\u00e1sokon tett csoportos l\u00e1togat\u00e1sok. A gondvisel\u0151ket
  \u2013 amennyiben az el\u0151ad\u00e1s az oktat\u00e1si int\u00e9zm\u00e9nyen k\u00edv\u00fcl
  t\u00f6rt\u00e9nik \u2013 el\u0151zetesen \u00e9rtes\u00edteni sz\u00fcks\u00e9ges.
  Az e foglalkoz\u00e1sokon val\u00f3 r\u00e9szv\u00e9tel \u2013 ha az k\u00f6lts\u00e9gekkel
  is j\u00e1r \u2013 \u00f6nk\u00e9ntes. A felmer\u00fcl\u0151 k\u00f6lts\u00e9geket
  a sz\u00fcl\u0151knek kell fedezni\u00fck.\\n\\nAz es\u00e9lyegyenl\u0151s\u00e9get
  szolg\u00e1lja az iskolai alap\u00edtv\u00e1ny t\u00e1mogat\u00e1sa, illetve a k\u00fcl\u00f6nb\u00f6z\u0151
  p\u00e1ly\u00e1zati forr\u00e1sok felhaszn\u00e1l\u00e1sa.\\n\\nC\u00e9lkit\u0171z\u00e9s\u00fcnk,
  hogy minden oszt\u00e1lyunk \u00e9vente legal\u00e1bb egy ilyen foglalkoz\u00e1son
  r\u00e9szt vehessen.\\n\\nSzabadid\u0151-szervez\u00e9s: A szabadid\u0151-szervez\u00e9s
  legfontosabb c\u00e9lja a tanul\u00f3k szabadidej\u00e9nek tartalmas kit\u00f6lt\u00e9se,
  id\u0151beoszt\u00e1suk \u00e9sszer\u0171 megszervez\u00e9se, esetleges tehets\u00e9g\u00fck
  felkutat\u00e1sa, k\u00e9pess\u00e9geik pozit\u00edv ir\u00e1ny\u00fa fejleszt\u00e9se.
  Ide tartoznak azok a k\u00f6z\u00f6ss\u00e9gi programok, ahol t\u00f6bb oszt\u00e1ly
  di\u00e1ks\u00e1ga k\u00f6z\u00f6sen vesz r\u00e9szt olyan iskolai, vagy az int\u00e9zm\u00e9nyen
  k\u00edv\u00fcli programokon (kultur\u00e1lis programok, verseny, vet\u00e9lked\u0151,
  stb.), ahol tov\u00e1bbi ismereteket szereznek.\\n\\nIskolai \u00fcnnep\u00e9lyek:
  Ezek egyr\u00e9szt \u00e1llnak a hagyom\u00e1nyos iskolai rendezv\u00e9nyekb\u0151l
  (tan\u00e9vnit\u00f3t, tan\u00e9vz\u00e1r\u00f3, szalagavat\u00f3 \u00e9s ballag\u00e1s),
  valamint a nemzeti \u00fcnnepekb\u0151l, eml\u00e9knapokb\u00f3l (Az aradi v\u00e9rtan\u00fak
  napja, 1956-os forradalom \u00fcnnepe, kommunista diktat\u00fara \u00e1ldozatainak
  eml\u00e9knapja, 1848-as magyar forradalom \u00e9s szabads\u00e1gharc \u00fcnnepe
  \u00e9s holokauszt magyarorsz\u00e1gi \u00e1ldozatainak eml\u00e9knapja). Fontos
  feladat az iskola n\u00e9vad\u00f3j\u00e1nak, II. R\u00e1k\u00f3czi Ferenc eml\u00e9k\u00e9nek
  \u00e1pol\u00e1sa, ehhez kapcsol\u00f3d\u00f3 iskolai rendezv\u00e9nyek megszervez\u00e9se
  a sz\u00fclet\u00e9snapj\u00e1n. Az \u00fcnnepl\u00e9s m\u00f3dja \u00e9s form\u00e1ja
  alapvet\u0151en sokf\u00e9le iskol\u00e1nkban. Szerepel ezek k\u00f6z\u00f6tt a
  hagyom\u00e1nyos iskolai \u00fcnnep\u00e9ly, m\u00fazeuml\u00e1togat\u00e1s, k\u00fcls\u0151
  helysz\u00ednenek tematikus\\n\\ns\u00e9t\u00e1k, filmvet\u00edt\u00e9sek \u00e9s
  projekt alap\u00fa \u00e9rz\u00e9keny\u00edt\u0151, a di\u00e1kok egy\u00fcttm\u0171k\u00f6d\u00e9s\u00e9re
  \u00e9p\u00edt\u0151 rendezv\u00e9nyek. A projekt alap\u00fa megeml\u00e9kez\u00e9sekn\u00e9l
  t\u00f6reksz\u00fcnk a sz\u00edntez\u0151, \u00e9vfolyamonk\u00e9nt v\u00e1ltoz\u00f3
  projektfeladatokra, \u00edgy minden \u00e9vben m\u00e1s m\u00f3don tudnak egy-egy
  \u00fcnnephez, eml\u00e9knaphoz k\u00f6zel\u00edteni tanul\u00f3ink.\\n\\n**Iskolai
  hagyom\u00e1ny\u0151rz\u0151 tev\u00e9kenys\u00e9gek:** Ezek szervez\u00e9se \u00e9s
  lebonyol\u00edt\u00e1sa a pedag\u00f3gusok \u00e9s a D\u00d6K feladata. A tan\u00e9v
  rendje, \u00e1llami \u00fcnnepek \u00e9s megeml\u00e9kez\u00e9sek, eml\u00e9knapok
  m\u00e9lt\u00f3 megrendez\u00e9se. A k\u00f6rnyezetv\u00e9delem, fenntarthat\u00f3
  fejl\u0151d\u00e9s k\u00e9rd\u00e9sk\u00f6r\u00e9t k\u00fcl\u00f6nb\u00f6z\u0151
  programokon kereszt\u00fcl, \u00e1ltal\u00e1ban projekt form\u00e1ban dolgozzuk
  fel.\\n\\n**G\u00f6lyat\u00e1bor:** A leend\u0151 9. \u00e9vfolyamosok r\u00e9sz\u00e9re
  augusztus v\u00e9g\u00e9n szervezz\u00fck meg. Ebben a programban a di\u00e1kok
  m\u00e1r a tan\u00e9vkezd\u00e9s el\u0151tt k\u00f6tetlen form\u00e1ban megismerhetik
  egym\u00e1st, oszt\u00e1lyf\u0151n\u00f6k\u00fcket, a di\u00e1k\u00f6nkorm\u00e1nyzat
  vezet\u0151it, az iskola vezet\u0151it.\\n\\n**Kar\u00e1csony:** A kar\u00e1csonyi
  \u00fcnnepk\u00f6rt oszt\u00e1ly \u00e9s iskolai szinten tartjuk meg.\\n\\n**Szalagavat\u00f3:**
  C\u00e9lja, hogy az iskola, v\u00e9gz\u0151s di\u00e1kjait R\u00e1k\u00f3czi-szalaggal
  t\u00fcntesse ki a 4 illetve 5 \u00e9v alatt tan\u00fas\u00edtott tanul\u00f3i munk\u00e1juk
  elismer\u00e9sekk\u00e9nt.\\n\\n**Ballag\u00e1s:** Hagyom\u00e1nyosan k\u00e9t r\u00e9szb\u0151l
  \u00e1ll: az egyik r\u00e9sze k\u00fcls\u0151 helysz\u00ednen zajlik, a m\u00e1sik
  pedig az iskol\u00e1n bel\u00fcl. A ballag\u00e1s sor\u00e1n a v\u00e9gz\u0151s\u00f6k
  k\u00f6sz\u00f6netet mondanak tan\u00e1raiknak, sz\u00fcleiknek, majd \u00e1tadj\u00e1k
  a R\u00e1k\u00f3czi-z\u00e1szl\u00f3t a k\u00f6vetkez\u0151 \u00e9vben \u00e9retts\u00e9giz\u0151
  \u00e9vfolyam k\u00e9pvisel\u0151inek.\\n\\n**Kapcsolat, \u00e9p \u00e9s fogyat\u00e9koss\u00e1ggal
  \u00e9l\u0151 gyerekek egy\u00fcttm\u0171k\u00f6d\u00e9s\u00e9t \u00e9s a m\u00e1ss\u00e1g
  elfogad\u00e1s\u00e1t fejleszt\u0151 program:** A projekt els\u0151dleges c\u00e9lja
  megismertetni az \u00e9p tanul\u00f3kkal a fogyat\u00e9kkal \u00e9l\u0151 gyerekek
  iskol\u00e1ban val\u00f3 m\u0171k\u00f6d\u00e9s\u00e9nek felt\u00e9teleit, szok\u00e1sait
  \u00e9s c\u00e9ljait. Felh\u00edvni a figyelmet az es\u00e9lyegyenl\u0151s\u00e9g
  megval\u00f3sul\u00e1s\u00e1hoz sz\u00fcks\u00e9ges szoci\u00e1lis kompetenci\u00e1k
  fontoss\u00e1g\u00e1ra, elsaj\u00e1t\u00edtattni az egy\u00fctt\u00e9l\u00e9shez
  sz\u00fcks\u00e9ges alapvet\u0151 felt\u00e9teleket \u00e9s ismereteket. Fontos
  megmutatni a tanul\u00f3knak azt, hogy a t\u00e1rsadalmi egy\u00fctt\u00e9l\u00e9s
  egyik legfontosabb felt\u00e9tele a m\u00e1ss\u00e1gra val\u00f3 nyitotts\u00e1g,
  emp\u00e1tia fejleszt\u00e9se saj\u00e1t tapasztalati \u00faton: di\u00e1kjaink
  fogyat\u00e9kkal \u00e9l\u0151 gyerekekkel m\u0171k\u00f6dhetnek egy\u00fctt tanul\u00f3p\u00e1rok
  kialak\u00edt\u00e1s\u00e1val. A projekt el\u0151zetes tal\u00e1lkoz\u00e1sokb\u00f3l,
  el\u0151foglalkoz\u00e1sokb\u00f3l majd k\u00f6z\u00f6s tev\u00e9kenys\u00e9geken
  alapul\u00f3 t\u00e9manapb\u00f3l (pl. zen\u00e9s-t\u00e1ncos, dr\u00e1mapedag\u00f3giai,
  k\u00e9zm\u0171ves stb.) \u00e1ll, \u00e9s \u00e9rt\u00e9kel\u00e9ssel z\u00e1rul.\\n\\nA
  program r\u00e9sz\u00e9t k\u00e9pezi a helyben v\u00e9gezhet\u0151 iskolai k\u00f6z\u00f6ss\u00e9gi
  szolg\u00e1latnak.\\n\\n**D\u00edjaz\u00e1s, jutalmaz\u00e1s:** Az iskola hagyom\u00e1nyainak
  megfelel\u0151en h\u00e1romszor kaphatnak elismer\u00e9st munk\u00e1juk\u00e9rt
  az iskola dolgoz\u00f3i. A tantest\u00fclet dolgoz\u00f3inak elismer\u00e9se k\u00e9t
  fokozatban lehets\u00e9ges: *R\u00e1k\u00f3czi-d\u00edjat* \u00e9s *R\u00e1k\u00f3czi-gy\u0171r\u0171t*
  kaphatnak a tan\u00e1rok. Ezzel az eredm\u00e9nyes, kiemelked\u0151 munk\u00e1t
  d\u00edjazzuk.\\n\\nA technikai szem\u00e9lyzet elismer\u00e9se a *R\u00e1k\u00f3czi
  szolg\u00e1lat\u00e1\u00e9rt-d\u00edj*, amit azok a dolgoz\u00f3k kapnak, akik a
  tantest\u00fclet kiv\u00e1l\u00f3 dolgoz\u00f3ihoz hasonl\u00f3an a legeredm\u00e9nyesebb
  munk\u00e1t \u00e9rt\u00e9k el az iskol\u00e1ban.\\n\\nAz iskola di\u00e1kjai k\u00f6z\u00fcl
  a *R\u00e1k\u00f3czi-d\u00edjat* kap az a v\u00e9gz\u0151s di\u00e1k, aki az iskola
  h\u00edrnev\u00e9t \u00f6regb\u00edtve kiemelked\u0151 teljes\u00edtm\u00e9nyt ny\u00fajtott
  az int\u00e9zm\u00e9nyben.\\n\\nEzen d\u00edjak kiad\u00e1s\u00e1nak rendj\u00e9r\u0151l
  az iskola Szervezeti \u00e9s M\u0171k\u00f6d\u00e9si Szab\u00e1lyzata rendelkezik.\\n\\n1.5.
  A pedag\u00f3gusok feladatai\\n\\n1.5.1. A pedag\u00f3gusok helyi int\u00e9zm\u00e9nyi
  feladatai\\n\\n- A v\u00e1ltoz\u00e1sok \u00e9s meg\u0151rzend\u0151 \u00e9rt\u00e9kek
  ment\u00e9n megfigyelhet\u0151 a pedag\u00f3gusok munk\u00e1j\u00e1nak m\u00f3dosul\u00e1sa,
  kib\u0151v\u00fcl\u00e9se \u00e9s sz\u00ednesed\u00e9se is.\\n- Ennek legjellemz\u0151bb
  ter\u00fcletei illetve megnyilv\u00e1nul\u00e1sai:\\n  - magas sz\u00ednvonal\u00fa
  oktat\u00f3-nevel\u0151 munka,\\n  - k\u00fcl\u00f6nleges b\u00e1nam\u00e1sm\u00f3dot
  ig\u00e9nyl\u0151 tanul\u00f3k integr\u00e1lt oktat\u00e1sa,\\n  - oszt\u00e1lyz\u00e1si
  gyakorlat \u00e1lland\u00f3s\u00e1ga,\\n  - tehets\u00e9ggondoz\u00e1s \u00e9s felz\u00e1rk\u00f3ztat\u00e1s,\\n  -
  projektszervez\u00e9s, projektmenedzsel\u00e9s,\\n  - p\u00e1ly\u00e1zat\u00edr\u00e1s,
  p\u00e1ly\u00e1zatir\u00e1ny\u00edt\u00e1s,\\n  - tank\u00f6nyv\u00edr\u00e1s, tantervfejleszt\u00e9s
  \u00e9s tananyagfejleszt\u00e9s,\\n  - az IKT-kompetencia folyamatos fejleszt\u00e9se,\\n  -
  \u00f6nk\u00e9pz\u00e9s, folyamatos m\u00f3dszertani meg\u00fajul\u00e1s, ismeretszerz\u00e9s,\\n  -
  pedag\u00f3giai k\u00f6z\u00e9letis\u00e9g,\\n  - szak\u00e9rt\u0151i tev\u00e9kenys\u00e9g,\\n  -
  kompetenciaalap\u00fa k\u00e9pz\u00e9sekben val\u00f3 r\u00e9szv\u00e9tel, fejleszt\u0151
  munka,\\n  - fejleszt\u00e9sekben val\u00f3 r\u00e9szv\u00e9tel, egy\u00fcttm\u0171k\u00f6d\u00e9s
  partneriskol\u00e1kkal,\\n  - egy\u00e9ni korrepet\u00e1l\u00f3, felz\u00e1rk\u00f3ztat\u00f3
  \u00f3r\u00e1k tart\u00e1sa, dokument\u00e1l\u00e1sa\\n  - nevel\u00e9si feladatok
  b\u0151v\u00fcl\u00e9se, m\u00f3dosul\u00e1sa, konfliktuskezel\u0151i szerepek fejleszt\u00e9se.\\n\\nAz
  oktat\u00e1s-nevel\u00e9s folyamatos fejleszt\u00e9se a taneszk\u00f6z\u00f6k fejleszt\u00e9s\u00e9vel
  is p\u00e1rosul.\\n- Ennek ter\u00fcletei:\\n  - szakk\u00e9pz\u00e9si alapok, p\u00e1ly\u00e1zatok
  \u00e9s t\u00e1mogat\u00e1sok felhaszn\u00e1l\u00e1sa korszer\u0171 oktat\u00e1stechnikai
  eszk\u00f6z\u00f6k (projektorok, akt\u00edv t\u00e1bl\u00e1k, sz\u00e1m\u00edt\u00f3g\u00e9pek,
  laptopok, korszer\u0171 szoftverek) beszerz\u00e9s\u00e9re \u00e9s alkalmaz\u00e1s\u00e1ra;\\n  -
  minimum taneszk\u00f6zfejleszt\u00e9sek a k\u00f6zoktat\u00e1st \u00e9rint\u0151
  mindenkor hat\u00e1lyos jogszab\u00e1lyok \u00e9s a (szakmai) k\u00f6zponti programok,
  szakmai \u00e9s vizsgak\u00f6vetelm\u00e9nyek alapj\u00e1n;\\n  - IKT eszk\u00f6z\u00f6kkel
  t\u00e1mogatott tananyagok fejleszt\u00e9se \u00e9s folyamatos haszn\u00e1lata az
  oktat\u00e1sban, a kapcsolattart\u00e1sban az iskol\u00e1n bel\u00fcli \u00e9s k\u00edv\u00fcli
  szerepl\u0151kkel.\\n\\n1.5.2. Az oszt\u00e1lyf\u0151n\u00f6ki munka tartalma, az
  oszt\u00e1lyf\u0151n\u00f6k feladatai\\n\\nAz oszt\u00e1lyf\u0151n\u00f6k az oszt\u00e1ly\u00e1\u00e9rt
  felel\u0151s pedag\u00f3gus, aki v\u00e9grehajtja a r\u00e1 b\u00edzott feladatokat:\\n\\n-
  r\u00e9szt vesz az oszt\u00e1ly\u00e1ban m\u0171k\u00f6d\u0151 di\u00e1k\u00f6nkorm\u00e1nyzat
  szervez\u00e9s\u00e9ben \u00e9s m\u0171k\u00f6dtet\u00e9s\u00e9ben; tudatosan seg\u00edti
  a k\u00f6z\u00f6ss\u00e9gi \u00e9let kialakul\u00e1s\u00e1t, az \u00f6nkorm\u00e1nyzat
  dinamikus fejl\u0151d\u00e9s\u00e9t;\\n- c\u00e9ltudatosan t\u00f6rekszik a tanul\u00f3k
  szem\u00e9lyis\u00e9g\u00e9nek min\u00e9l teljesebb megismer\u00e9s\u00e9re, egy\u00e9ni
  fejleszt\u00e9s\u00fckre, k\u00f6z\u00f6ss\u00e9gi \u00e9let\u00fck ir\u00e1ny\u00edt\u00e1s\u00e1ra,
  \u00f6n\u00e1ll\u00f3s\u00e1guk, \u00f6nkorm\u00e1nyzati tev\u00e9kenys\u00e9g\u00fck
  fejleszt\u00e9s\u00e9re;\\n- a r\u00e1b\u00edzott k\u00f6z\u00f6ss\u00e9g min\u00e9l
  jobb megismer\u00e9se \u00e9s a koordin\u00e1ci\u00f3 \u00e9rdek\u00e9ben l\u00e1togatja
  oszt\u00e1ly\u00e1t m\u00e1s nevel\u0151k tan\u00edt\u00e1si \u00f3r\u00e1in \u00e9s
  tan\u00f3r\u00e1n k\u00edv\u00fcli foglalkoz\u00e1sokon;\\n- nevel\u0151t\u00e1rsaival
  kics\u00e9r\u00e9li tapasztalatait, a felmer\u00fcl\u0151 probl\u00e9m\u00e1kat
  tan\u00edtv\u00e1nyaival megbesz\u00e9li; sz\u00fcks\u00e9g szerint t\u00e1j\u00e9koztatja
  k\u00f6zvetlen felettes\u00e9t, munk\u00e1ltat\u00f3j\u00e1t;\\n- a gyermek pedag\u00f3giai
  jellemz\u0151it sz\u00fcl\u0151i \u00e9rtekezletek, fogad\u00f3 \u00f3r\u00e1k keret\u00e9ben
  a tanul\u00f3 gondvisel\u0151ivel egyezteti;\\n- t\u00e1mogatja az elektronikus
  kommunik\u00e1ci\u00f3t az iskolai levelez\u0151 rendszer\u00e9n kereszt\u00fcl;\\n-
  a sz\u00fcl\u0151ket az elektronikus ellen\u0151rz\u0151 \u00fatj\u00e1n folyamatosan
  t\u00e1j\u00e9koztatja \u00fagy, hogy minden fontos inform\u00e1ci\u00f3hoz hozz\u00e1jussanak,
  igyekszik bevonni az iskolai \u00e9letbe \u0151ket;\\n- rendszeresen ellen\u0151rzi
  - a sz\u00fcl\u0151i h\u00e1tt\u00e9rt\u0151l f\u00fcgg\u0151en -, hogy a sz\u00fcl\u0151k
  a bejegyz\u00e9seket al\u00e1\u00edr\u00e1sukkal, vagy egy\u00e9b \u00faton tudom\u00e1sul
  vett\u00e9k-e;\\n- a tanul\u00f3k hi\u00e1nyz\u00e1sainak megfelel\u0151 igazol\u00e1s\u00e1t
  megk\u00f6veteli, igazol\u00e1s hi\u00e1ny\u00e1ban a h\u00e1zirend \u00e9s a vonatkoz\u00f3
  jogszab\u00e1lyok alapj\u00e1n int\u00e9zkedik;\\n- pontosan, napra k\u00e9szen
  v\u00e9gzi a megb\u00edz\u00e1s\u00e1val j\u00e1r\u00f3 adminisztr\u00e1ci\u00f3s
  teend\u0151ket; \u00e9rt\u00e9keli a tanul\u00f3k magatart\u00e1s\u00e1t \u00e9s
  szorgalm\u00e1t, az iskola k\u00f6z\u00f6ss\u00e9gi \u00e9let\u00e9ben val\u00f3
  r\u00e9szv\u00e9tel\u00e9rt jutalmaz \u00e9s elmarasztal a jogk\u00f6r\u00e9ben
  el\u00e9rhet\u0151 eszk\u00f6z\u00f6kkel;\\n- folyamatos feladata oszt\u00e1lyterme
  rendj\u00e9nek kialak\u00edt\u00e1sa, a tanul\u00f3i eszk\u00f6z\u00f6k \u00e1llapot\u00e1nak
  meg\u0151rz\u00e9se;\\n- az oszt\u00e1lyf\u0151n\u00f6ki \u00f3r\u00e1kat a pedag\u00f3giai
  program alapj\u00e1n \u00f6ssze\u00e1ll\u00edtott tanmenet alapj\u00e1n szervezi
  \u00e9s val\u00f3s\u00edtja meg;\\n- az iskolai munkaterv szerint el\u0151k\u00e9sz\u00edti
  a tanulm\u00e1nyi kir\u00e1ndul\u00e1sokat, illetve azokon r\u00e9szt vesz;\\n-
  az oszt\u00e1lyf\u0151n\u00f6k a feladatk\u00f6r\u00e9hez tartoz\u00f3 ter\u00fcleteken
  \u00f6n\u00e1ll\u00f3an j\u00e1r el, \u00fagy hogy t\u00e1j\u00e9koztatja k\u00f6zvetlen
  felettes\u00e9t az elv\u00e9gzett feladatokr\u00f3l.\\n\\n1.5.3. A k\u00f6nyvt\u00e1rostan\u00e1r
  feladatai\\n\\nAz int\u00e9zm\u00e9nyben k\u00f6nyvt\u00e1r m\u0171k\u00f6dik, melynek
  rendj\u00e9r\u0151l a k\u00f6nyvt\u00e1rostan\u00e1r gondoskodik.\\n\\nA k\u00f6nyvt\u00e1rostan\u00e1r
  jog\u00e1ll\u00e1sa:\\n\\nA k\u00f6nyvt\u00e1rostan\u00e1r feladatait pedag\u00f3gus
  munkak\u00f6rben k\u00f6zalkalmazotti jogviszonyban l\u00e1tja el.\\n\\n\u00c1ltal\u00e1nos
  feladatai:\\n\\n- Ell\u00e1tja a k\u00f6nyvt\u00e1r vezet\u00e9s\u00e9vel, \u00fcgyvitel\u00e9vel
  kapcsolatos feladatokat.\\n- A meghat\u00e1rozott nyitvatart\u00e1si id\u0151ben
  biztos\u00edtja a di\u00e1koknak a k\u00f6nyvt\u00e1r z\u00f6kken\u0151mentes haszn\u00e1lat\u00e1t.\\n-
  \u00c9ves munkatervet k\u00e9sz\u00edt a k\u00f6nyvt\u00e1r m\u0171k\u00f6d\u00e9si
  felt\u00e9teleinek \u00e9s tartalmi munk\u00e1j\u00e1nak fejleszt\u00e9s\u00e9re.\\n-
  Tan\u00e9v v\u00e9g\u00e9n \u00e9s f\u00e9l\u00e9vkor besz\u00e1mol\u00f3t k\u00e9sz\u00edt,
  t\u00e1j\u00e9koztatja a tantest\u00fcletet a k\u00f6nyvt\u00e1r tev\u00e9kenys\u00e9geir\u0151l,
  haszn\u00e1lat\u00e1r\u00f3l.\\n- Szervezi \u00e9s lebonyol\u00edtja a k\u00f6nyvt\u00e1r
  pedag\u00f3giai felhaszn\u00e1l\u00e1s\u00e1t.\\n- R\u00e9szt vesz a k\u00f6nyvt\u00e1r
  id\u0151szaki \u00e9s soron k\u00edv\u00fcli let\u00e1roz\u00e1s\u00e1ban.\\n- Elv\u00e9gzi
  a tank\u00f6nyvi \u00e1llom\u00e1ny selejtez\u00e9s\u00e9t, szelekt\u00e1l\u00e1s\u00e1t,
  illetve egy esetleges b\u0151v\u00edt\u00e9shez sz\u00fcks\u00e9ges ig\u00e9nyfelm\u00e9r\u00e9st
  (pl. sz\u00fcks\u00e9ges polcok mennyis\u00e9ge).\\n\\nSzakmai feladatai:\\n\\nTeljes
  szakmai felel\u0151ss\u00e9ggel v\u00e9gzi az iskolai k\u00f6nyvt\u00e1r \u00e1llom\u00e1nyalak\u00edt\u00e1s\u00e1t
  az al\u00e1bbiak szerint:\\n\\n- Tervszer\u0171en \u00e9s folyamatosan v\u00e9gzi
  az \u00e1llom\u00e1ny gyarap\u00edt\u00e1s\u00e1t, a beszerz\u00e9si lehet\u0151s\u00e9gekr\u0151l
  folyamatosan konzult\u00e1l az iskola igazgat\u00f3j\u00e1val.\\n\\nEgy\u00e9b pedag\u00f3giai
  \u00e9s mentori feladatai:\\n\\n- Kialak\u00edtja az egy\u00e9ni fejleszt\u0151
  \u00e9s felz\u00e1rk\u00f3ztat\u00f3 \u00f3r\u00e1k hely\u00e9t a k\u00f6nyvt\u00e1r
  ter\u00fclet\u00e9n.\\n- Egy\u00e9ni felz\u00e1rk\u00f3ztat\u00f3 \u00f3r\u00e1kat
  tart a szak\u00e9rt\u0151i v\u00e9lem\u00e9nyekben le\u00edrtak figyelembe v\u00e9tel\u00e9vel,
  melyet pontos dokument\u00e1ci\u00f3val (jelenl\u00e9ti iven vezeti, hogy mikor,
  milyen tartalommal/t\u00e9m\u00e1val foglalkoztak) is al\u00e1t\u00e1maszt.\\n-
  Ell\u00e1tja a mentori feladatokat a 2 \u00e9ves gyakornoki id\u0151t teljes\u00edt\u0151
  pedag\u00f3gusgyakornok (ok) mellett, az SZMSZ gyakornoki szab\u00e1lyzat\u00e1nak
  megfelel\u0151en.\\n\\nTank\u00f6nyvfelel\u0151si feladatai:\\n\\n- El\u0151k\u00e9sz\u00edti
  a tank\u00f6nyvrendel\u00e9seket: a munkak\u00f6z\u00f6ss\u00e9gek vezet\u0151ivel
  \u00e9s a szaktan\u00e1rokkal val\u00f3 egyeztet\u00e9s alapj\u00e1n \u00f6ssze\u00e1ll\u00edtja
  a tank\u00f6nyvlist\u00e1t.\\n- Elint\u00e9zi az iskolai tank\u00f6nyvrendel\u00e9st,
  a megrendelt tank\u00f6nyveket \u00e1tveszi, \u00e9s megszervezi a kioszt\u00e1st
  a di\u00e1kok r\u00e9sz\u00e9re.\\n- Kapcsolatot tart a KELLO-val.\\n\\n1.6. A kiemelt
  figyelmet ig\u00e9nyl\u0151 tanul\u00f3kkal kapcsolatos pedag\u00f3giai tev\u00e9kenys\u00e9g
  helyi rendje\\n\\nMinden tanul\u00f3 egyedi, megism\u00e9telhetetlen, k\u00fcl\u00f6nleges,
  minden gyermeknek egy\u00e9ni sz\u00fcks\u00e9gletei, ig\u00e9nyei, lehet\u0151s\u00e9gei
  vannak. Vannak olyan tanul\u00f3k, akiknek k\u00fcl\u00f6nleges, speci\u00e1lis
  sz\u00fcks\u00e9gleteik vannak, \u00edgy nevel\u00e9s\u00fck, oktat\u00e1suk speci\u00e1lis
  feladatot jelent a pedag\u00f3gusoknak.\\n\\nInt\u00e9zm\u00e9ny\u00fcnk Befogad\u00f3
  Iskola c\u00edmmel rendelkezik. A program keret\u00e9ben saj\u00e1tos nevel\u00e9si
  ig\u00e9ny\u0171, valamint beilleszked\u00e9si, tanul\u00e1si \u00e9s magatart\u00e1si
  neh\u00e9zs\u00e9ggel k\u00fczd\u0151 tanul\u00f3kat is integr\u00e1ltan oktatunk.
  A k\u00fcl\u00f6nleges figyelmet ig\u00e9nyl\u0151 tanul\u00f3k egy\u00e9ni ig\u00e9nyekhez
  igazod\u00f3 differenci\u00e1lt nevel\u00e9sben \u00e9s oktat\u00e1sban r\u00e9szes\u00fclnek.\\n\\nK\u00fcl\u00f6nleges
  b\u00e1na\u00e1sm\u00f3dot ig\u00e9nyl\u0151 tanul\u00f3k\\n\\n1.6.1. Saj\u00e1tos
  nevel\u00e9si ig\u00e9ny\u0171 tanul\u00f3k\\n\\nA speci\u00e1lis kompetenci\u00e1k
  fejleszt\u00e9s\u00e9nek fontos ter\u00fclete a saj\u00e1tos nevel\u00e9si ig\u00e9ny\u0171
  tanul\u00f3k oktat\u00e1sa-nevel\u00e9se. Iskol\u00e1nk \u00f6sszet\u00e9tel\u00e9ben
  m\u00e9g kis l\u00e9tsz\u00e1mban vannak jelen az eml\u00edtett tanul\u00f3k, de
  az integr\u00e1lt nevel\u00e9s-oktat\u00e1s szellem\u00e9nek megval\u00f3s\u00edt\u00e1sa
  \u00e9rdek\u00e9ben sz\u00fcks\u00e9gesnek tartjuk az idevonatkoz\u00f3 pedag\u00f3giai
  m\u00f3dszerek megismer\u00e9s\u00e9t, alkalmaz\u00e1s\u00e1t, figyelembe v\u00e9tel\u00e9t.\\n\\nAz
  \u00e9p\u00fclet adotts\u00e1gai miatt a kerekessz\u00e9kes tanul\u00f3k akad\u00e1lymentes
  k\u00f6zleked\u00e9s\u00e9t, oktat\u00e1s\u00e1t nem tudjuk biztos\u00edtani. C\u00e9lunk,
  hogy a t\u00e1rsaikkal egy\u00fctt nevelhet\u0151, fogyat\u00e9kkal \u00e9l\u0151,
  vagy tanul\u00e1si zavarral (diszlexia, diszgr\u00e1fia) k\u00fczd\u0151 tanul\u00f3k
  fejl\u0151d\u00e9s\u00e9t az oszt\u00e1lyban tan\u00edt\u00f3 pedag\u00f3gusok mellett,
  a speci\u00e1lis ig\u00e9nyeiknek megfelel\u0151 szakember, gy\u00f3gypedag\u00f3gus
  is figyelemmel k\u00eds\u00e9rje. Az SNI-s tanul\u00f3kat speci\u00e1lis tan\u00edt\u00e1si
  \u00e9s tanul\u00e1si ig\u00e9nyeinek megfelel\u0151en speci\u00e1lis taneszk\u00f6z\u00f6kkel
  is t\u00e1mogatjuk.\\n\\nA saj\u00e1tos nevel\u00e9si ig\u00e9ny\u0171 tanul\u00f3kat
  szak\u00e9rt\u0151i v\u00e9lem\u00e9ny alapj\u00e1n, az elj\u00e1r\u00e1si rend
  betart\u00e1s\u00e1val mentes\u00edtj\u00fck egyes tant\u00e1rgyak, tant\u00e1rgyi
  r\u00e9szek min\u0151s\u00edt\u00e9se, \u00e9rt\u00e9kel\u00e9se al\u00f3l, r\u00e9sz\u00fckre
  egy\u00e9ni foglalkoz\u00e1sokat szervez\u00fcnk.\\n\\nElk\u00f6telezett szakmai
  munk\u00e1nkat mutatja, hogy az int\u00e9zm\u00e9ny\u00fcnkben integr\u00e1ltan
  oktatott saj\u00e1tos nevel\u00e9si ig\u00e9ny\u0171 tanul\u00f3k eredm\u00e9nyesen
  befejezik a k\u00f6z\u00e9piskolai tanulm\u00e1nyaikat \u00e9s c\u00e9ljaik szerint
  tov\u00e1bb tanulnak.\\n\\n1.6.2. Beilleszked\u00e9si, tanul\u00e1si \u00e9s magatart\u00e1si
  neh\u00e9zs\u00e9ggel k\u00fczd\u0151 tanul\u00f3k\\n\\nA beilleszked\u00e9si, tanul\u00e1si,
  magatart\u00e1si neh\u00e9zs\u00e9ggel k\u00fczd\u0151 tanul\u00f3k a szak\u00e9rt\u0151i
  bizotts\u00e1g szak\u00e9rt\u0151i v\u00e9lem\u00e9nye alapj\u00e1n az \u00e9letkorukt\u00f3l
  elv\u00e1rhat\u00f3an tart\u00f3san \u00e9s jelent\u0151sen alulteljes\u00edtenek.
  T\u00e1rsas kapcsolataikban probl\u00e9m\u00e1kkal, tanul\u00e1si, magatart\u00e1sszab\u00e1lyoz\u00e1si
  hi\u00e1nyoss\u00e1gokkal k\u00fczdenek. K\u00f6z\u00f6ss\u00e9gbbe val\u00f3 beilleszked\u00e9s\u00fck,
  szocializ\u00e1ci\u00f3s folyamatuk, szem\u00e9lyis\u00e9gfejl\u0151d\u00e9s\u00fck
  nehez\u00edtett.\\n\\nA tanul\u00e1si neh\u00e9zs\u00e9ggel k\u00fczd\u0151 tanul\u00f3kat
  differenci\u00e1ltan oktatjuk \u00e9s \u00e9rt\u00e9kelj\u00fck. R\u00e9sz\u00fckre
  a szak\u00e9rt\u0151i v\u00e9lem\u00e9nyben r\u00f6gz\u00edtett tanul\u00e1sszervez\u00e9si
  m\u00f3dszereket, tant\u00e1rgyi k\u00f6nny\u00edt\u00e9seket, a fejl\u0151d\u00e9s\u00fckhez
  sz\u00fcks\u00e9ges seg\u00e9d- \u00e9s taneszk\u00f6z\u00f6k haszn\u00e1lat\u00e1t
  biztos\u00edtjuk. Az alapvet\u0151 k\u00e9szs\u00e9gek fejleszt\u00e9s\u00e9n\u00e9l
  tan\u00e1raink munk\u00e1j\u00e1t fejleszt\u0151 pedag\u00f3gus is seg\u00edtheti.\\n\\nA
  beilleszked\u00e9si \u00e9s magatart\u00e1si neh\u00e9zs\u00e9gekkel k\u00fczd\u0151
  tanul\u00f3k szocializ\u00e1ci\u00f3s, alkalmazkod\u00e1si \u00e9s magatart\u00e1sszab\u00e1lyoz\u00e1si
  probl\u00e9m\u00e1it a szak\u00e9rt\u0151i v\u00e9lem\u00e9ny alapj\u00e1n seg\u00edt\u00fcnk
  megoldani.\\n\\nPedag\u00f3giai munk\u00e1nk egyik c\u00e9lja, hogy seg\u00edts\u00fck
  az iskolai k\u00f6vetelm\u00e9nyrendszer\u0151l, a t\u00e1rsadalmi norm\u00e1kt\u00f3l
  elt\u00e9r\u0151en szocializ\u00e1lt gyermekek beilleszked\u00e9si neh\u00e9zs\u00e9geit.\\n\\nAz
  ut\u00f3bbi \u00e9vekben int\u00e9zm\u00e9ny\u00fcnkben jelent\u0151sen n\u0151tt
  a beilleszked\u00e9si, magatart\u00e1si probl\u00e9m\u00e1kkal k\u00fczd\u0151 tanul\u00f3k
  sz\u00e1ma. Ezen tanul\u00f3inkra jellemz\u0151 a probl\u00e9m\u00e1s szocializ\u00e1ci\u00f3,
  a hi\u00e1nyos kultur\u00e1lts\u00e1got t\u00fckr\u00f6z\u0151 kommunik\u00e1ci\u00f3,
  a gyenge tanulm\u00e1nyi motiv\u00e1ci\u00f3, az intellektu\u00e1lis alulteljes\u00edt\u00e9s.\\n\\nAz
  eml\u00edtett gyermekek jellemz\u0151i a gyakori hangulatingadoz\u00e1sok, az \u00f6n\u00e9rt\u00e9kel\u00e9s
  \u00e9s az identit\u00e1s zavarai, a k\u00f6z\u00f6ss\u00e9gi feladatrendszeren
  val\u00f3 gyakori k\u00edv\u00fcl\u00e1ll\u00e1s, az agressz\u00edv vagy fesz\u00fclt
  magatart\u00e1s, illetve a kort\u00e1rs kapcsolati probl\u00e9m\u00e1k.\\n\\nFeladatunk,
  hogy e probl\u00e9m\u00e1s tanul\u00f3k konstrukt\u00edv tev\u00e9kenys\u00e9gek,
  v\u00e9lem\u00e9nycser\u00e9k, besz\u00e9lget\u00e9sek form\u00e1j\u00e1ban vegyenek
  r\u00e9szt az iskolai \u00e9letben, s haladjanak tanulm\u00e1nyaikban. Ezzel megakad\u00e1lyozzuk
  az eml\u00edtett di\u00e1kok spont\u00e1n kirekeszt\u0151d\u00e9s\u00e9t vagy t\u00falzott
  negat\u00edv hangad\u00e1s\u00e1t.\\n\\n- A gyermekv\u00e9delmi munka sor\u00e1n
  szem\u00e9lyre szabott pedag\u00f3giai elj\u00e1r\u00e1sokkal, a probl\u00e9m\u00e1k
  egy\u00e9ni kezel\u00e9s\u00e9vel ny\u00fajtunk seg\u00edts\u00e9get. Seg\u00edtj\u00fck
  a kudarc\u00e9lm\u00e9nyek\\n\\nfeldolgoz\u00e1s\u00e1t, illetve speci\u00e1lis
  tr\u00e9ningekkel t\u00e1mogatjuk a k\u00f6z\u00f6ss\u00e9gbe val\u00f3 beilleszked\u00e9s
  folyamat\u00e1t.\\n\\n- Az eml\u00edtett di\u00e1kok motiv\u00e1ci\u00f3s b\u00e1zis\u00e1nak
  megismer\u00e9s\u00e9re \u00e9p\u00edtve igyeksz\u00fcnk \u00e9lni a siker\u00e9lm\u00e9nyhez
  juttat\u00e1s, a dics\u00e9ret, a pozit\u00edv meger\u0151s\u00edt\u00e9s m\u00f3dszer\u00e9vel.\\n\\n-
  Felz\u00e1rk\u00f3ztat\u00f3, p\u00f3tl\u00f3 foglalkoztat\u00e1sok szervez\u00e9s\u00e9vel,
  sz\u00fcks\u00e9g eset\u00e9n k\u00fcl\u00f6n tanul\u00e1sm\u00f3dszertani, tanul\u00e1stechnikai
  seg\u00edts\u00e9g ny\u00fajt\u00e1s\u00e1val biztos\u00edtjuk az elmaradt tanul\u00f3k
  halad\u00e1s\u00e1t.\\n\\n- Speci\u00e1lis oszt\u00e1lyf\u0151n\u00f6ki \u00f3r\u00e1kon,
  szem\u00e9lyis\u00e9gfejleszt\u0151 tr\u00e9ningeken fejlesztj\u00fck \u00e9rintett
  tanul\u00f3ink \u00f6n\u00e9rt\u00e9kel\u00e9si, \u00f6nismereti k\u00e9pess\u00e9geit.\\n\\n-
  Egy\u00e9ni besz\u00e9lget\u00e9sekkel t\u00f6reksz\u00fcnk a konfliktusok, agresszi\u00f3,
  frusztr\u00e1ci\u00f3 felold\u00e1s\u00e1ra.\\n\\n- Fontosnak tartjuk az egy\u00fcttm\u0171k\u00f6d\u00e9st
  a tantest\u00fcletben az \u0151szintes\u00e9gre, a titoktart\u00e1sra, a seg\u00edt\u0151sz\u00e1nd\u00e9kra
  \u00e9p\u00edtve.\\n\\n- Besz\u00e9lget\u00e9seket kezdem\u00e9nyez\u00fcnk a probl\u00e9m\u00e1s
  tanul\u00f3k sz\u00fcleivel, sz\u00fcks\u00e9g eset\u00e9n ig\u00e9nybe vessz\u00fck
  k\u00fcls\u0151 szakemberek seg\u00edts\u00e9g\u00e9t.\\n\\nHissz\u00fck, hogy a
  k\u00fcl\u00f6nleges b\u00e1n\u00e1sm\u00f3dot ig\u00e9nyl\u0151 tanul\u00f3kat
  integr\u00e1l\u00f3 nevel\u00e9s, oktat\u00e1s siker\u00e9t, a t\u00e1mogat\u00f3,
  befogad\u00f3, szeretetteljes iskolai l\u00e9gk\u00f6r \u00e9s a tan\u00e1raink
  meg\u00e9rt\u0151 \u00e9s lelkiismeretes szakmai munk\u00e1ja biztos\u00edtja.\\n\\n1.6.3.
  Kiemelten tehets\u00e9ges tanul\u00f3k\\n\\nHit\u00fcnk szerint minden tanul\u00f3ban
  vannak olyan k\u00e9pess\u00e9gek, amelyek \u0151t t\u00e1rsadalmalag hasznos \u00e9s
  egy\u00e9nileg boldogs\u00e1got, eredm\u00e9nyess\u00e9get ny\u00fajt\u00f3 tev\u00e9kenys\u00e9gi
  form\u00e1kra predesztin\u00e1lj\u00e1k. S vannak olyanok is, akikben egy-egy k\u00e9pess\u00e9g
  olyan szint\u0171, hogy az m\u00e1r valamely ter\u00fcleten kiemelked\u0151nek sz\u00e1m\u00edt,
  teh\u00e1t tehets\u00e9gr\u0151l besz\u00e9lhet\u00fcnk.\\n\\nA nevel\u0151 felel\u0151ss\u00e9ge,
  hogy a k\u00e9pess\u00e9geket \u00e9s a tehets\u00e9get az iskolai tev\u00e9kenys\u00e9gek
  sor\u00e1n felismerje \u00e9s fejleszt\u00e9s\u00e9r\u0151l gondoskodj\u00e9k.\\n\\nA
  tanul\u00f3nak joga, hogy k\u00e9pess\u00e9geinek \u00e9rdekl\u0151d\u00e9s\u00e9nek,
  adotts\u00e1gainak megfelel\u0151 nevel\u00e9sben \u00e9s oktat\u00e1sban r\u00e9szes\u00fclj\u00f6n.
  Iskol\u00e1nk hagyom\u00e1nyait k\u00f6vetve teh\u00e1t egyik kiemelt c\u00e9lunka
  tehets\u00e9ges gyerekek felismer\u00e9se, az \u00f6nkifejez\u00e9si tev\u00e9kenys\u00e9gek
  lehet\u0151s\u00e9geinek megteremt\u00e9se, t\u00e1mogat\u00e1sa, az \u00f6nkifejez\u00e9si
  k\u00e9pess\u00e9g ismereteinek tan\u00edt\u00e1sa, gyakorl\u00e1sa sz\u00e1mukra.\\n\\nFeladatunk
  az, hogy felismerj\u00fck, felt\u00e1rruk azokat a kompetenci\u00e1kat \u00e9s adotts\u00e1gokat,
  amelyek az oktat\u00e1s folyamat\u00e1ban fejleszthet\u0151k, a tanul\u00f3t k\u00e9pess\u00e9
  teszik az \u00f6n\u00e1ll\u00f3 \u00edt\u00e9letalkot\u00e1sra, a kritikai szeml\u00e9letm\u00f3dra,
  az \u00e9let \u00faj helyzeteinek megold\u00e1s\u00e1ra, hogy saj\u00e1t maga el\u00e9
  olyan feladatokat t\u0171zz\u00f6n ki, amelyek seg\u00edtik az el\u0151rehalad\u00e1st.\\n\\nA
  tehets\u00e9g felismer\u00e9s\u00e9t seg\u00edti, ha a nevel\u0151 figyel a tanul\u00f3k
  \u201ek\u00fcl\u00f6nleges\u201d megnyilv\u00e1nul\u00e1saira:\\n\\n- a tanul\u00f3
  manu\u00e1lis \u00e9s motorikus k\u00e9pess\u00e9geire,\\n- egy-egy tant\u00e1rgy
  vagy egy\u00e9b ter\u00fcleten megnyilv\u00e1nul\u00f3 kimagasl\u00f3 \u00e9rdekl\u0151d\u00e9sre,\\n-
  a gondolkod\u00e1si strat\u00e9gia egy\u00e9ni volt\u00e1ra.\\n\\nA tehets\u00e9g
  saj\u00e1tos m\u00f3don megnyilatkozhat valamely speci\u00e1lis tanul\u00e1si neh\u00e9zs\u00e9g
  jelenl\u00e9te kapcs\u00e1n is.\\n\\nA tehets\u00e9gek, k\u00e9pess\u00e9gek kibontakoztat\u00e1s\u00e1nak
  kiemelt feladatai:\\n\\n- az iskol\u00e1ba bel\u00e9p\u0151 tanul\u00f3k adotts\u00e1gainak
  \u00e9s motiv\u00e1ci\u00f3inak megismer\u00e9se, felt\u00e1r\u00e1sa, a saj\u00e1tos
  egy\u00e9nis\u00e9gek, az elt\u00e9r\u0151 kompetenci\u00e1j\u00fa gyerekek sz\u00e1mbav\u00e9tele;\\n-
  a tehets\u00e9ggondoz\u00e1s egy\u00e9nre szabott \u00e9s sokoldal\u00fa fejleszt\u00e9s\u00e9nek
  biztos\u00edt\u00e1sa;\\n- felt\u00e1rni a tehets\u00e9ges gyerekeket vesz\u00e9lyeztet\u0151
  k\u00e1ros hat\u00e1sokat, \u00e9s azokat ellens\u00falyozni a testi \u00e9s lelki
  eg\u00e9szs\u00e9ges fejl\u0151d\u00e9s biztos\u00edt\u00e1sa \u00e9rdek\u00e9ben;\\n-
  biztos\u00edtani kell a tantest\u00fclet egys\u00e9ges fell\u00e9p\u00e9s\u00e9t,
  ehhez a megfelel\u0151 kommunik\u00e1ci\u00f3t az oszt\u00e1lyban tan\u00edt\u00f3
  koll\u00e9g\u00e1k, az oszt\u00e1lyf\u0151n\u00f6k \u00e9s az ifj\u00fas\u00e1gv\u00e9delem\u00e9rt
  felel\u0151s szaktan\u00e1r k\u00f6z\u00f6tt;\\n- az iskol\u00e1ban v\u00e9gzett
  tanul\u00f3k nyomon k\u00f6vet\u00e9se, tapasztalataik hasznos\u00edt\u00e1sa a
  tehets\u00e9ggondoz\u00f3 tev\u00e9kenys\u00e9g\u00fcnk folytonos meg\u00faj\u00edt\u00e1s\u00e1ban.\\n\\nA
  tehets\u00e9g, k\u00e9pess\u00e9g kibontakoz\u00e1s\u00e1t seg\u00edt\u0151 eszk\u00f6z\u00f6k,
  form\u00e1k, m\u00f3dszerek:\\n\\nA legfontosabb a tan\u00f3r\u00e1i oktat\u00f3-nevel\u0151
  munka sor\u00e1n v\u00e9gzett tehets\u00e9ggondoz\u00e1s:\\n\\n- az egy\u00e9nre
  szabott differenci\u00e1l\u00e1s pedag\u00f3giai m\u00f3dszereivel a k\u00fcl\u00f6nleges
  tehets\u00e9g is felismerhet\u0151, foglalkoztathat\u00f3;\\n- az egy\u00e9nre szabott
  fejleszt\u00e9si \u00e9s nevel\u00e9si elvek, programok kialak\u00edt\u00e1sa;\\n-
  a csoportbont\u00e1sos \u00e9s kiscsoportos foglalkoz\u00e1sok;\\n- a tanul\u00f3i
  aktivit\u00e1st megk\u00f6vetel\u0151 pedag\u00f3giai, oktat\u00e1si m\u00f3dszerek
  alkalmaz\u00e1sa;\\n- a t\u00e9maegys\u00e9gek feldolgoz\u00e1sa, a feladat megold\u00e1sa
  a tanul\u00f3k \u00e9rdekl\u0151d\u00e9s\u00e9re, a tanul\u00f3k \u00e9s pedag\u00f3gusok
  k\u00f6z\u00f6s tev\u00e9kenys\u00e9g\u00e9re, egy\u00fcttm\u0171k\u00f6d\u00e9s\u00e9re
  \u00e9p\u00fclj\u00f6n (a projektoktat\u00e1s);\\n\\n\u2022 a sz\u00f6vegalkot\u00f3
  \u00e9s m\u0171\u00e9rtelmez\u0151 k\u00e9pess\u00e9g fejleszt\u00e9se, ami lehet\u0151v\u00e9
  teszi, hogy a minta\u00e9rt\u00e9k\u0171 m\u0171vek a szem\u00e9lyis\u00e9g szerves
  r\u00e9sz\u00e9v\u00e9 v\u00e1ljanak;\\n\u2022 a tant\u00e1rgyi integr\u00e1ci\u00f3,
  a komplexit\u00e1sra t\u00f6rekv\u00e9s;\\n\u2022 k\u00e9pess\u00e9g-kibontakoztat\u00f3
  felk\u00e9sz\u00edt\u00e9s a szem\u00e9lyis\u00e9gfejleszt\u00e9s, a k\u00f6z\u00f6ss\u00e9gfejleszt\u00e9s
  seg\u00edts\u00e9g\u00e9vel, ami a tanul\u00e1si kudarcb\u00f3l, a szoci\u00e1lis
  h\u00e1tr\u00e1nyb\u00f3l ered\u0151 lemarad\u00e1s cs\u00f6kkent\u00e9s\u00e9hez,
  a tanul\u00f3 egy\u00e9ni k\u00e9pess\u00e9g\u00e9nek, tehets\u00e9g\u00e9nek kibontakoztat\u00e1s\u00e1hoz,
  tanul\u00e1si, tov\u00e1bbtanul\u00e1si es\u00e9ly\u00e9nek n\u00f6vel\u00e9s\u00e9hez
  vezethet;\\n\u2022 az iskolai k\u00f6nyvt\u00e1r, seg\u00e9deszk\u00f6z\u00f6k,
  az internet alkalmaz\u00e1sa, \u00f6n\u00e1ll\u00f3 feldolgoz\u00e1st ig\u00e9nyl\u0151
