  \u00e9s a lehet\u0151s\u00e9gek, a programok kihaszn\u00e1l\u00e1sa. Fontos, hogy
  a di\u00e1kokkal megismertetj\u00fck ezen int\u00e9zm\u00e9nyek \u00e1ltal meghirdetett
