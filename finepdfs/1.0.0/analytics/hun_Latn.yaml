sample: '["\"S\u00e1rv\u00e1r V\u00e1ros Polg\u00e1rmester\u00e9nek\\n137/2020. (XI.
  25.) sz\u00e1m\u00fa hat\u00e1rozata\\na k\u00e9pvisel\u0151-test\u00fclet feladat-
  \u00e9s hat\u00e1sk\u00f6r\u00e9nek gyakorl\u00e1sa keret\u00e9ben hozott d\u00f6nt\u00e9sr\u0151l\\n\\nA
  vesz\u00e9lyhelyzet kihirdet\u00e9s\u00e9r\u0151l sz\u00f3l\u00f3 478/2020. (XI.
  3.) Korm. rendelet \u00e9s a katasztr\u00f3fav\u00e9delemr\u0151l \u00e9s a hozz\u00e1
  kapcsol\u00f3d\u00f3 egyes t\u00f6rv\u00e9nyek m\u00f3dos\u00edt\u00e1s\u00e1r\u00f3l
  sz\u00f3l\u00f3 2011. \u00e9vi CXXVIII. t\u00f6rv\u00e9ny 46. \u00a7 (4) bekezd\u00e9se,
  tov\u00e1bb\u00e1 a koronav\u00edrus-vil\u00e1gj\u00e1rv\u00e1ny m\u00e1sodik hull\u00e1ma
  elleni v\u00e9dekez\u00e9sr\u0151l sz\u00f3l\u00f3 2020. \u00e9vi CIX. t\u00f6rv\u00e9ny
  alapj\u00e1n S\u00e1rv\u00e1r V\u00e1ros \u00d6nkorm\u00e1nyzata K\u00e9pvisel\u0151-test\u00fclet\u00e9nek
  a Magyarorsz\u00e1g helyi \u00f6nkorm\u00e1nyzatair\u00f3l sz\u00f3l\u00f3 2011.
  \u00e9vi CLXXXIX. t\u00f6rv\u00e9ny 13. \u00a7 (1) bekezd\u00e9se 1. pontj\u00e1ban,
  a k\u00f6zbeszerz\u00e9sekr\u0151l sz\u00f3l\u00f3 2015. \u00e9vi CXLIII. t\u00f6rv\u00e9nyben
  (a tov\u00e1bbiakban: Kbt.) \u00e9s S\u00e1rv\u00e1r V\u00e1ros \u00d6nkorm\u00e1nyzata
  Beszerz\u00e9si \u00e9s K\u00f6zbeszerz\u00e9si Szab\u00e1lyzata 7. \u00a7 (3) bekezd\u00e9s
  1-3. francia bekezd\u00e9seiben meghat\u00e1rozott feladat- \u00e9s hat\u00e1sk\u00f6r\u00e9nek
  gyakorl\u00e1sa keret\u00e9ben a k\u00f6vetkez\u0151 hat\u00e1rozatot hozom:\\n\\nA
  \u201eS\u00e1rv\u00e1r, Eperjes utca fel\u00faj\u00edt\u00e1sa az \u00d6nkorm\u00e1nyzati
  feladatell\u00e1t\u00e1st szolg\u00e1l\u00f3 fejleszt\u00e9sek t\u00e1mogat\u00e1sa
  keret\u00e9ben\u201d t\u00e1rgy\u00fa k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s
  fajtaj\u00e1t a Kbt. Harmadik R\u00e9sz 115. \u00a7 (1) bekezd\u00e9se szerinti
  hirdetm\u00e9ny k\u00f6zz\u00e9t\u00e9telre n\u00e9lk\u00fcli ny\u00edlt elj\u00e1r\u00e1sban
  hat\u00e1rozom meg. Az elj\u00e1r\u00e1s aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1s\u00e1t
  \u00e9s a dokument\u00e1ci\u00f3t a mell\u00e9klet szerinti tartalommal j\u00f3v\u00e1hagyom.
  Aj\u00e1nlatt\u00e9telre az al\u00e1bbi gazdas\u00e1gi szerepl\u0151k ker\u00fcljenek
  felh\u00edv\u00e1sra:\\n\\n1. BIT-\u00c9P \u00c9p\u00edt\u0151ipari \u00e9s Kereskedelmi
  Bt. 9761 T\u00e1pl\u00e1nszentkeresz, F\u0151 utca 15. B. \u00e9p. (ad\u00f3sz\u00e1m:
  26866336-2-18, EKR azonos\u00edt\u00f3: EKRSZ_65121403)\\n2. TIA 2002 \u00c9p\u00edt\u0151ipari,
  Kivitelez\u0151 \u00e9s Kereskedelmi Kft. 9600 S\u00e1rv\u00e1r, S\u00f3tornyi \u00fat
  13. (ad\u00f3sz\u00e1m: 12936027-2-18, EKR azonos\u00edt\u00f3: EKRSZ_47940101)\\n3.
  Planet \u00c9p\u00edt\u0151 \u00e9s Szolg\u00e1ltat\u00f3 Kft. 2500 Esztergom, Vasv\u00e1ri
  P\u00e1l u. 1. (ad\u00f3sz\u00e1m: 26114392-2-11, EKR azonos\u00edt\u00f3: EKRSZ_22082190)\\n4.
  LANG SZOLG Kereskedelmi \u00e9s Szolg\u00e1ltat\u00f3 Kft. 9081 Gy\u0151r\u00fajbar\u00e1t,
  Istv\u00e1n u. 213. (ad\u00f3sz\u00e1m: 12467398-2-08, EKR azonos\u00edt\u00f3:
  EKRSZ_39949013)\\n5. Nyugat-\u00c9p H\u00fasz Szolg\u00e1ltat\u00f3 \u00e9s Kereskedelmi
  Kft. 9797 N\u00e1rai, Vad\u00e1sz utca 15. (ad\u00f3sz\u00e1ma: 27104303-2-18.,
  EKR azonos\u00edt\u00f3: EKRSZ_67306695)\\n\\nHat\u00e1rid\u0151: azonnal\\nFelel\u0151s:
  Kondora Istv\u00e1n polg\u00e1rmester\\n\\nS\u00e1rv\u00e1r, 2020. november 25.\\n\\n/:
  Kondora Istv\u00e1n\\npolg\u00e1rmester\\n\\nMell\u00e9klet a 137/2020. (XI.25.)
  sz\u00e1m\u00fa polg\u00e1rmesteri hat\u00e1rozathoz\\n\\nAj\u00e1nlatt\u00e9teli
  felh\u00edv\u00e1s (Klasszikus aj\u00e1nlatk\u00e9r\u0151k eset\u00e9ben, Kbt. 115.
  \u00a7 szerinti elj\u00e1r\u00e1sra)\\n\\nI.1) N\u00e9v \u00e9s c\u00edmek \\\\(^1\\\\)
