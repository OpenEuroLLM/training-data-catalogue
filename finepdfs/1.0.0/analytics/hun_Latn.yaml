  hogy k\u00f6z\u00fcl\u00fck kinek a nev\u00e9re \u00e9s c\u00edm\u00e9re ker\u00fclj\u00f6n
  ki\u00e1ll\u00edt\u00e1sra a szolg\u00e1ltat\u00e1si sz\u00e1mla. Ha a tulajdonosok
  a k\u00f6zszolg\u00e1ltat\u00f3val ezt nem k\u00f6zlik, akkor a k\u00f6zszolg\u00e1ltat\u00f3
  vagy a legnagyobb tulajdoni h\u00e1nyaddal rendelkez\u0151 tulajdonos, vagy az azonos
  tulajdoni h\u00e1nyaddal rendelkez\u0151 tulajdonosok k\u00f6z\u00fcl az ingatlan-nyilv\u00e1ntart\u00e1sban
  els\u0151 helyen bejegyzett tulajdonos nev\u00e9re \u00e9s c\u00edm\u00e9re \u00e1ll\u00edtja
  ki a szolg\u00e1ltat\u00e1si sz\u00e1ml\u00e1t.\\n(4) A rendelkez\u00e9sre \u00e1ll\u00e1si
  d\u00edjat annak a tulajdonosnak kell teljes h\u00f3napra megfizetni, aki a v\u00e1ltoz\u00e1ssal
  \u00e9rintett h\u00f3nap els\u0151 napj\u00e1n tulajdonos.\\n\\n7. \u00a7.\\n\\n(1)A
  k\u00f6zszolg\u00e1ltat\u00f3  tulajdon\u00e1ban l\u00e9v\u0151, a tulajdonos haszn\u00e1lat\u00e1ra
  t\u00e9r\u00edt\u00e9smentesen \u00e1tadott hullad\u00e9kgy\u0171jt\u0151 ed\u00e9ny
  meg\u0151rz\u00e9s\u00e9r\u0151l, tiszt\u00e1ntart\u00e1s\u00e1r\u00f3l, fert\u0151tlen\u00edt\u00e9s\u00e9r\u0151l
  a tulajdonos k\u00f6teles\\n\\n9 Az 5.\u00a7 (3) bekezd\u00e9s\u00e9ben a - legal\u00e1bb
  egy darab sz\u00e1zh\u00fasz literes ed\u00e9nyt - sz\u00f6veget a 2/2011.(I.07.)
  \u00f6nkorm\u00e1nyzati rendelet 11.\u00a7 (4) bekezd\u00e9se b) pontja hat\u00e1lyon
  k\u00edv\u00fcl helyezte\\n\\n11 A 6.\u00a7 a 2/2011.(I.07.) \u00f6nkorm\u00e1nyzati
  rendelet 5.\u00a7-\u00e1val meg\u00e1llap\u00edtott sz\u00f6veg\\n\\n10 Az 5.\u00a7
  (4) bekezd\u00e9st a 2/2011.(I.07.) \u00f6nkorm\u00e1nyzati rendelet 11.\u00a7 (4)
  bekezd\u00e9se c) pontja hat\u00e1lyon k\u00edv\u00fcl helyezte\\n\\ngondoskodni.
  Az ed\u00e9ny elt\u0171n\u00e9s\u00e9rt, megsemmis\u00fcl\u00e9s\u00e9\u00e9rt \u00e9s
  nem rendeltet\u00e9sszer\u0171 haszn\u00e1lat\u00e1b\u00f3l ered\u0151 k\u00e1r\u00e9rt
  a tulajdonos felel.\\n(2)A hullad\u00e9kot felhalmozni nem szabad, azt a megadott
  szem\u00e9tsz\u00e1ll\u00edt\u00e1si napon elsz\u00e1ll\u00edt\u00e1s c\u00e9lj\u00e1b\u00f3l
  a szolg\u00e1ltat\u00e1st v\u00e9gz\u0151 rendelkez\u00e9s\u00e9re kell bocs\u00e1tani.\\n(3)A
  szem\u00e9tgy\u0171jt\u0151 ed\u00e9nybe nem szabad m\u00e9rgez\u0151 anyagot, \u00e1llati
  tetemet, foly\u00e9kony, gy\u00fal\u00e9kony, k\u00f6rnyezetk\u00e1ros\u00edt\u00f3
  anyagot, robban\u00f3anyagot, tr\u00e1gy\u00e1t vagy egy\u00e9b olyan anyagokat
  elhelyezni, amely vesz\u00e9lyezteti a szolg\u00e1ltat\u00e1st v\u00e9gz\u0151 dolgoz\u00f3k
  testi \u00e9ps\u00e9g\u00e9t \u00e9s eg\u00e9szs\u00e9g\u00e9t vagy a sz\u00e1ll\u00edt\u00f3j\u00e1rm\u0171ben
  rong\u00e1l\u00f3d\u00e1st okozhat.\\n(4) A tulajdonos k\u00f6teles egy\u00fcttm\u0171k\u00f6dni
  a hullad\u00e9k mennyis\u00e9gi cs\u00f6kkent\u00e9s\u00e9t \u00e9s elk\u00fcl\u00f6n\u00edtett
  gy\u0171jt\u00e9s\u00e9t c\u00e9lz\u00f3 kezdem\u00e9nyez\u00e9sekben, k\u00fcl\u00f6n\u00f6sen
  a k\u00e9tkann\u00e1s- \u00e9s szelekt\u00edv hullad\u00e9kgy\u0171jt\u00e9sben.
  12\\n\\nA k\u00f6zszolg\u00e1ltat\u00e1s rendszere 13 7/A.\u00a7 14\\n\\n(1) A k\u00f6zszolg\u00e1ltat\u00f3
  a lakoss\u00e1g k\u00f6r\u00e9be tartoz\u00f3, a k\u00f6zszolg\u00e1ltat\u00e1si
  ter\u00fcleten l\u00e9v\u0151 ingatlan tulajdonosai r\u00e9sz\u00e9re lak\u00e1sonk\u00e9nt
  t\u00e9r\u00edt\u00e9smentesen, haszonk\u00f6lcs\u00f6n szerz\u0151d\u00e9s alapj\u00e1n,
  sz\u00e1ll\u00edt\u00f3eszk\u00f6z\u00e9hez rendszeres\u00edtett, k\u00e9t gy\u0171jt\u0151ed\u00e9nyt
  biztos\u00edt: egy 120 literes, barna fedel\u0171 ed\u00e9nyt a komposzt\u00e1lhat\u00f3
  hullad\u00e9kok \u00e9s egy 120 literes, sz\u00fcrke fedel\u0171 ed\u00e9nyt a marad\u00e9k
  hullad\u00e9k elhelyez\u00e9s\u00e9re.\\n(2) Az (1) bekezd\u00e9sben megjel\u00f6lt
  ed\u00e9nyeken fel\u00fcl a k\u00f6zszolg\u00e1ltat\u00f3 egyedi ig\u00e9ny eset\u00e9n
  ugyancsak t\u00e9r\u00edt\u00e9smentesen, haszonk\u00f6lcs\u00f6n szerz\u0151d\u00e9s
  alapj\u00e1n tov\u00e1bbi ed\u00e9nyt biztos\u00edt a tulajdonos r\u00e9sz\u00e9re.\\n(3)
  A k\u00f6zszolg\u00e1ltat\u00f3 k\u00f6teles a komposzt\u00e1lhat\u00f3 hullad\u00e9kok
  heti egy alkalommal, a marad\u00e9k hullad\u00e9kok k\u00e9thetente t\u00f6rt\u00e9n\u0151
  elsz\u00e1ll\u00edt\u00e1si lehet\u0151s\u00e9g\u00e9t, tov\u00e1bb\u00e1 a barna
  tetej\u0171 \u00e9s vegyes hullad\u00e9k gy\u0171jt\u00e9s\u00e9re szolg\u00e1l\u00f3
  ed\u00e9nyek mos\u00e1s\u00e1t \u00e9vente n\u00e9gy alkalommal biztos\u00edtani.\\n(4)
  A tulajdonos k\u00f6teles gondoskodni arr\u00f3l, hogy a barna tetej\u0171 ed\u00e9nybe
  marad\u00e9k hullad\u00e9k, a sz\u00fcrke tetej\u0171 ed\u00e9nybe bio hullad\u00e9k
  ne ker\u00fclj\u00f6n.\\n(5) A bio hullad\u00e9k kezel\u00e9s\u00e9r\u0151l \u00e9s
  a komposzt\u00e1l\u00e1s m\u0171szaki k\u00f6vetelm\u00e9nyeir\u0151l sz\u00f3l\u00f3
  23/2003. (XII. 29.) KvVM rendelet szerinti h\u00e1zi komposzt\u00e1l\u00e1s eset\u00e9n
  az ingatlanon bel\u00fcli komposzt\u00e1l\u00e1s helysz\u00edn\u00e9t \u00fagy kell
  meghat\u00e1rozni, hogy az k\u00f6zter\u00fclett\u0151l, lak\u00f3\u00e9p\u00fclett\u0151l
  \u00e9s telekhat\u00e1rt\u00f3l legal\u00e1bb 5 m\u00e9terre helyezkedjen el.\\n(6)
  A komposzt\u00e1l\u00e1si tev\u00e9kenys\u00e9get az illet\u00e9kes jegyz\u0151nek
  be kell jelenteni, felt\u00fcntetve az azt v\u00e9gz\u0151 szem\u00e9ly nev\u00e9t,
  lakc\u00edm\u00e9t, a komposzt\u00e1l\u00e1ssal \u00e9rintett ingatlan helyrajzi
  sz\u00e1m\u00e1t, illetve a (5) bekezd\u00e9sben felsorolt objektumokt\u00f3l val\u00f3
  t\u00e1vols\u00e1g\u00e1t, tov\u00e1bb\u00e1 csatolni kell a szomsz\u00e9dok beleegyez\u0151
  nyilatkozat\u00e1t.\\n(7) A k\u00f6zszolg\u00e1ltat\u00f3 a jegyz\u0151 \u00e9rtes\u00edt\u00e9se
  alapj\u00e1n a h\u00e1zi komposzt\u00e1l\u00e1st v\u00e9gz\u0151 fogyaszt\u00f3t\u00f3l
  a barna tetej\u0171 hullad\u00e9kgy\u0171jt\u0151 ed\u00e9nyt \u2013 a fogyaszt\u00f3
  ig\u00e9nye eset\u00e9n \u2013 a haszonk\u00f6lcs\u00f6n szerz\u0151d\u00e9s m\u00f3dos\u00edt\u00e1sa
  mellett elsz\u00e1ll\u00edtja.\\n\\n12 A 7.\u00a7 (4) bekezd\u00e9se a 2/2011.(I.07.)
  \u00f6nkorm\u00e1nyzati rendelet 6.\u00a7-\u00e1val meg\u00e1llap\u00edtott sz\u00f6veg\\n\\n14
  A 7/A.\u00a7-t a 2/2011.(I.07.) \u00f6nkorm\u00e1nyzati rendelet 7.\u00a7-a iktatta
  be\\n\\n13 A 7/A.\u00a7-t megel\u0151z\u0151 alc\u00edmet a 2/2011.(I.07.) \u00f6nkorm\u00e1nyzati
  rendelet 7.\u00a7-a iktatta be\\n\\n(8) A k\u00f6zszolg\u00e1ltat\u00f3 a jegyz\u0151
  \u00e1ltal igazoltan lakatlann\u00e1 v\u00e1lt ingatlanhoz biztos\u00edtott hullad\u00e9kgy\u0171jt\u0151
  ed\u00e9nyt veszi vissza. Az igazol\u00e1sra szolg\u00e1l\u00f3 formanyomtatv\u00e1nyt
  a k\u00f6zszolg\u00e1ltat\u00f3 bocs\u00e1tja a jegyz\u0151 rendelkez\u00e9s\u00e9re.\\n\\n7/B.\u00a7\\n\\n15\\n\\n(1)
  A k\u00f6zszolg\u00e1ltat\u00f3 a fogyaszt\u00f3 r\u00e9sz\u00e9re a telep\u00fcl\u00e9s
  k\u00f6zter\u00fclet\u00e9n l\u00e9v\u0151 szelekt\u00edv hullad\u00e9kgy\u0171jt\u0151
  sziget ig\u00e9nybev\u00e9tel\u00e9t t\u00e9r\u00edt\u00e9smentesen biztos\u00edtja.\\n(2)
  A hullad\u00e9kgy\u0171jt\u0151 szigeten elk\u00fcl\u00f6n\u00edtve helyezhet\u0151k
  el a m\u0171anyag, pap\u00edr, \u00fcveg \u00e9s f\u00e9m \u2013 els\u0151sorban
  csomagol\u00e1si - hullad\u00e9kok az egyes ed\u00e9nyeken elhelyezett feliratnak
  megfelel\u0151en.\\n(3) A k\u00f6zszolg\u00e1ltat\u00f3 a telep\u00fcl\u00e9si szil\u00e1rd
  hullad\u00e9k kezel\u00e9s\u00e9re szolg\u00e1l\u00f3 egyes l\u00e9tes\u00edtm\u00e9nyek
  kialak\u00edt\u00e1s\u00e1nak \u00e9s \u00fczemeltet\u00e9seinek r\u00e9szletes
  m\u0171szaki szab\u00e1lyair\u00f3l sz\u00f3l\u00f3 5/2002. (X.29.) KvVM rendelet
  5-7. \u00a7-a szerint m\u0171k\u00f6dtetett hullad\u00e9kgy\u0171jt\u0151 szigeten
  l\u00e9v\u0151 ed\u00e9nyeket j\u00e1ratterve szerint, az ed\u00e9nyek tel\u00edtetts\u00e9g\u00e9nek
  megfelel\u0151 gyakoris\u00e1ggal \u00fcr\u00edti.\\n(4) A hullad\u00e9kgy\u0171jt\u0151
  szigeteken v\u00e1llalkoz\u00e1si tev\u00e9kenys\u00e9gb\u0151l sz\u00e1rmaz\u00f3
  hullad\u00e9kot elhelyezni tilos.\\n(5) A k\u00f6zszolg\u00e1ltat\u00f3 a hullad\u00e9kgy\u0171jt\u0151
  sziget ter\u00fclet\u00e9n az ed\u00e9nyeken k\u00edv\u00fcl elhelyezett hullad\u00e9kok
  k\u00f6z\u00fcl kiz\u00e1r\u00f3lag a (2) bekezd\u00e9sben felsorolt fajt\u00e1j\u00fa
  hullad\u00e9kokat sz\u00e1ll\u00edtja el.\\n\\n7/C.\u00a7 16\\n\\n(1) A k\u00f6zszolg\u00e1ltat\u00f3
  Ad\u00e1sztevel telep\u00fcl\u00e9s r\u00e9sz\u00e9re Ugod telep\u00fcl\u00e9sen
  meg\u00e9p\u00edtett \u00e9s \u00fczemeltetett hullad\u00e9kudvarban \u2013 nyitvatart\u00e1si
  id\u0151ben \u2013 egyes hullad\u00e9kok t\u00e9r\u00edt\u00e9smentes elhelyez\u00e9s\u00e9t
  biztos\u00edtja, azon fogyaszt\u00f3 sz\u00e1m\u00e1ra, aki a vele kapcsolatos k\u00f6zszolg\u00e1ltat\u00e1si
  jogviszony fenn\u00e1ll\u00e1s\u00e1t a k\u00f6zszolg\u00e1ltat\u00f3 \u00e1ltal
  rendelkez\u00e9s\u00e9re bocs\u00e1tott azonos\u00edt\u00f3 dokumentummal igazolja.\\n(2)
  A hullad\u00e9kudvarban az inert hullad\u00e9k havonta 1 m 3 , de \u00e9vente legfeljebb
  3 m 3 mennyis\u00e9gben helyezhet\u0151 el.\\n(3) Mennyis\u00e9gi korl\u00e1toz\u00e1s
  n\u00e9lk\u00fcl helyezhet\u0151 el a hullad\u00e9kudvarban a lomtalan\u00edt\u00e1si
  hullad\u00e9k, a m\u0171anyag, a pap\u00edr, az \u00fcveg, a f\u00e9m hullad\u00e9k,
  a textil hullad\u00e9k \u00e9s a f\u00e1s sz\u00e1r\u00fa kerti nyesed\u00e9k.\\n(4)
  A vesz\u00e9lyes hullad\u00e9kok k\u00f6z\u00fcl alkalmank\u00e9nt \u00f6sszesen
  50 kg mennyis\u00e9gben, de \u00e9vente legfeljebb \u00f6sszesen 150 kg mennyis\u00e9gben
  helyezhet\u0151k el az elemek, akkumul\u00e1torok, elektronikai hullad\u00e9kok,
  fest\u00e9kes \u00e9s vegyszeres g\u00f6ngy\u00f6legek.\\n(5) Haszn\u00e1lt \u00e9tolaj-
  \u00e9s zs\u00edr hullad\u00e9k a hullad\u00e9kudvarban alkalmank\u00e9nt 5 liter,
  de \u00e9vente legfeljebb \u00f6sszesen 60 liter mennyis\u00e9gben helyezhet\u0151
  el.\\n(6) A vesz\u00e9lyes hullad\u00e9knak min\u0151s\u00fcl\u0151 f\u00e1radt
  olaj hullad\u00e9k alkalmank\u00e9nt 4 liter, de \u00e9vente legfeljebb 8 liter
  mennyis\u00e9gben adhat\u00f3 \u00e1t a hullad\u00e9kudvarban.\\n(7) Inert hullad\u00e9knak
  tekintend\u0151 az ingatlanokon keletkez\u0151 \u2013 hibaelh\u00e1r\u00edt\u00e1sb\u00f3l
  vagy jav\u00edt\u00e1sb\u00f3l sz\u00e1rmaz\u00f3 \u2013 \u00e9p\u00edt\u00e9si,
  bont\u00e1si tev\u00e9kenys\u00e9g sor\u00e1n keletkez\u0151, vesz\u00e9lyes hullad\u00e9kot
  nem\\n\\n15 A 7/B.\u00a7-t a 2/2011.(I.07.) \u00f6nkorm\u00e1nyzati rendelet 7.\u00a7-a
  iktatta be\\n\\n16 A 7/C.\u00a7-t a 2/2011.(I.07.) \u00f6nkorm\u00e1nyzati rendelet
  7.\u00a7-a iktatta be\\n\\ntartalmaz\u00f3, els\u0151sorban beton, t\u00e9gla cser\u00e9p,
  ker\u00e1mia hullad\u00e9k.\\n(8) Nem sz\u00e1m\u00edt lomtalan\u00edt\u00e1si hullad\u00e9knak
  a teljes h\u00e1ztart\u00e1s, illetve ingatlan felsz\u00e1mol\u00e1s\u00e1n\u00e1l
  \u00e9s ki\u00fcr\u00edt\u00e9s\u00e9n\u00e9l keletkez\u0151 hullad\u00e9k.\\n(9)
  A hullad\u00e9kudvarban v\u00e1llalkoz\u00e1si tev\u00e9kenys\u00e9gb\u0151l sz\u00e1rmaz\u00f3
  hullad\u00e9kot befogadni tilos.\\n\\nA k\u00f6zszolg\u00e1ltat\u00e1s\u00e9rt fizetend\u0151
  d\u00edj m\u00e9rt\u00e9ke, meg\u00e1llap\u00edt\u00e1s\u00e1nak szab\u00e1lyai
  8. \u00a7.\\n\\n(1)A lakoss\u00e1gi k\u00f6zszolg\u00e1ltat\u00e1s ig\u00e9nybev\u00e9tel\u00e9\u00e9rt
  az ingatlan tulajdonosa illetve a k\u00f6zszolg\u00e1ltat\u00e1st ig\u00e9nybevev\u0151
  e rendeletben meg\u00e1llap\u00edtott d\u00edjat k\u00f6teles fizetni.\\n(2)Az int\u00e9zm\u00e9nyek
  \u00e9s a gazd\u00e1lkod\u00f3 szervezetek a k\u00f6zszolg\u00e1ltat\u00e1s ig\u00e9nybev\u00e9tel\u00e9\u00e9rt
  a k\u00f6zszolg\u00e1ltat\u00f3val megk\u00f6t\u00f6tt k\u00fcl\u00f6n v\u00e1llalkoz\u00e1si
  k\u00f6zszolg\u00e1ltat\u00e1si szerz\u0151d\u00e9sben foglalt d\u00edjat fizetik.\\n(3)A
  telep\u00fcl\u00e9si hullad\u00e9k kezel\u00e9s\u00e9nek d\u00edj\u00e1t az \u00f6nkorm\u00e1nyzat
  1 \u00e9vi d\u00edjfizet\u00e9si id\u0151szakra \u00e1llap\u00edtja meg. 17\\n(4)A
  telep\u00fcl\u00e9si hullad\u00e9k kezel\u00e9s\u00e9re ir\u00e1nyul\u00f3 k\u00f6zszolg\u00e1ltat\u00e1snak
  e rendeletben meghat\u00e1rozott d\u00edja a k\u00f6zszolg\u00e1ltat\u00f3 \u00e1ltal
  az adott k\u00f6zszolg\u00e1ltat\u00e1sra alkalmazhat\u00f3 d\u00edj legmagasabb
  m\u00e9rt\u00e9ke.\\n\\n9. \u00a7.\\n\\n(1)A telep\u00fcl\u00e9si szil\u00e1rd hullad\u00e9k
  elsz\u00e1ll\u00edt\u00e1s\u00e1val kapcsolatos k\u00f6zszolg\u00e1ltat\u00e1si
