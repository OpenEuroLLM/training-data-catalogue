  Duna\u00fajv\u00e1rosi V\u00edz-, Csatorna- H\u0151szolg\u00e1ltat\u00f3 Kft. 2021.
  \u00e9vre vonatkoz\u00f3 vesztes\u00e9ge\\n\\nellent\u00e9telez\u00e9s\u00e9re vonatkoz\u00f3
  T\u00e1mogat\u00e1si szerz\u0151d\u00e9s megk\u00f6t\u00e9s\u00e9re\\n\\nTisztelt
  K\u00f6zgy\u0171l\u00e9s!\\n\\nMagyarorsz\u00e1g 2021. \u00e9vi k\u00f6zponti k\u00f6lts\u00e9gvet\u00e9s\u00e9r\u0151l
  sz\u00f3l\u00f3 2020. \u00e9vi CX. t\u00f6rv\u00e9ny 2. mell\u00e9klete r\u00f6gz\u00edti
  a nem  k\u00f6zm\u0171vel  \u00f6sszegy\u0171jt\u00f6tt  h\u00e1ztart\u00e1si  szennyv\u00edz  \u00e1rtalmatlan\u00edt\u00e1sa  c\u00edmen  ig\u00e9nyelhet\u0151  \u00e1llami
  t\u00e1mogat\u00e1s ig\u00e9nybev\u00e9tel\u00e9nek m\u00f3dj\u00e1t, fajlagos \u00f6sszeg\u00e9t:\\n\\n\u201e11
  1.1.2. Nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si
  szennyv\u00edz \u00e1rtalmatlan\u00edt\u00e1sa 100 forint/m 3\\\"\\n\\n\u201e11.
  1.1.2. Nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si
  szennyv\u00edz \u00e1rtalmatlan\u00edt\u00e1sa jogc\u00edm\\n\\n11.1. A  t\u00e1mogat\u00e1s  az  \u00f6sszegy\u0171jt\u00f6tt  \u00e9s  a  hat\u00f3s\u00e1gilag  kijel\u00f6lt  lerak\u00f3helyeken  igazoltan
  elhelyezett, nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si
  szennyv\u00edz mennyis\u00e9ge (m3) ut\u00e1n illeti meg azon \u00f6nkorm\u00e1nyzatokat,
  amelyek\\na) a  v\u00edzgazd\u00e1lkod\u00e1sr\u00f3l  sz\u00f3l\u00f3  1995.  \u00e9vi  LVII.  t\u00f6rv\u00e9ny  alapj\u00e1n  szervezett  k\u00f6zszolg\u00e1ltat\u00e1s
  ell\u00e1t\u00e1s\u00e1r\u00f3l k\u00f6zszolg\u00e1ltat\u00f3val k\u00f6t\u00f6tt,
  hat\u00e1lyos szerz\u0151d\u00e9s \u00fatj\u00e1n,\\nb) a k\u00f6rnyezet \u00e9s
  a v\u00edzb\u00e1zisok v\u00e9delme \u00e9rdek\u00e9ben a k\u00f6zm\u0171ves csatornah\u00e1l\u00f3zattal
  el nem l\u00e1tott telep\u00fcl\u00e9sr\u00e9szein  keletkezett  nem  k\u00f6zm\u0171vel  \u00f6sszegy\u0171jt\u00f6tt  h\u00e1ztart\u00e1si  szennyv\u00edz  gy\u0171jt\u00e9s\u00e9r\u0151l
  \u00e1rtalmatlan\u00edt\u00e1s c\u00e9lj\u00e1b\u00f3l gondoskodnak.\\n11.2. Az
  \u00f6sszeg a fajlagos lakoss\u00e1gi r\u00e1ford\u00edt\u00e1sok (d\u00edjak) cs\u00f6kkent\u00e9s\u00e9hez
  j\u00e1rul hozz\u00e1.\\n11.3. A t\u00e1mogat\u00e1st az \u00f6nkorm\u00e1nyzatok
  a nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si szennyv\u00edz
  becs\u00fclt \u00e9vi mennyis\u00e9ge (m3) alapj\u00e1n ig\u00e9nylik \u00e9s annak
  t\u00e9nyleges, k\u00f6zszolg\u00e1ltat\u00e1si szerz\u0151d\u00e9s szerint \u00f6sszegy\u0171jt\u00f6tt
  mennyis\u00e9ge alapj\u00e1n sz\u00e1molnak el.\\n11.4. A t\u00e1mogat\u00e1s kiz\u00e1r\u00f3lag
  a t\u00e1mogat\u00e1s c\u00e9lj\u00e1nak megfelel\u0151en, a lakoss\u00e1gi r\u00e1ford\u00edt\u00e1sok
  (d\u00edjak) cs\u00f6kkent\u00e9s\u00e9re ford\u00edthat\u00f3. A t\u00e1mogat\u00e1s
  szempontj\u00e1b\u00f3l kiz\u00e1r\u00f3lag\\na) a \u201eSzennyv\u00edz gy\u0171jt\u00e9se,
  tiszt\u00edt\u00e1sa, elhelyez\u00e9se\\\", valamint\\nb) a \u201eSzennyv\u00edziszap
  kezel\u00e9se, \u00e1rtalmatlan\u00edt\u00e1sa\\\"\\nkorm\u00e1nyzati funkci\u00f3kon
  elsz\u00e1molt kiad\u00e1sok vehet\u0151k figyelembe.\\\"\\n\\nA t\u00f6rv\u00e9ny
  3. rendelete r\u00f6gz\u00edti a t\u00e1mogat\u00e1s meg\u00e1llap\u00edt\u00e1s\u00e1nak,
  felhaszn\u00e1l\u00e1s\u00e1nak \u00e9s elsz\u00e1mol\u00e1s\u00e1nak szab\u00e1lyait:\\n\\n\u201e4.
  2.1.4. A nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si
  szennyv\u00edz ideiglenes begy\u0171jt\u00e9s\u00e9re kijel\u00f6lt k\u00f6z\u00e9rdek\u0171
  k\u00f6zszolg\u00e1ltat\u00f3 meg nem t\u00e9r\u00fcl\u0151 k\u00f6lts\u00e9geinek
  t\u00e1mogat\u00e1sa jogc\u00edm\\n4.1. A  jogc\u00edm  szolg\u00e1l  a  nem  k\u00f6zm\u0171vel  \u00f6sszegy\u0171jt\u00f6tt  h\u00e1ztart\u00e1si  szennyv\u00edz  begy\u0171jt\u00e9s\u00e9re
  vonatkoz\u00f3 nem rendszeres k\u00f6zszolg\u00e1ltat\u00e1sr\u00f3l sz\u00f3l\u00f3
  378/2015. (XII. 8.) Korm. rendelet alapj\u00e1n a nem  k\u00f6zm\u0171vel  \u00f6sszegy\u0171jt\u00f6tt  h\u00e1ztart\u00e1si  szennyv\u00edz  ideiglenes  begy\u0171jt\u00e9s\u00e9re  kijel\u00f6lt  k\u00f6z\u00e9rdek\u0171
  szolg\u00e1ltat\u00f3nak az ideiglenes begy\u0171jt\u00e9si ell\u00e1t\u00e1s\u00e9rt
  fizetend\u0151 k\u00f6zszolg\u00e1ltat\u00e1si d\u00edjb\u00f3l meg nem t\u00e9r\u00fcl\u0151,
  indokolt k\u00f6lts\u00e9gei megt\u00e9r\u00edt\u00e9s\u00e9re a k\u00f6z\u00e9rdek\u0171
  k\u00f6zszolg\u00e1ltat\u00f3 kijel\u00f6l\u00e9se megsz\u0171n\u00e9s\u00e9ig vagy
  az \u00faj k\u00f6zszolg\u00e1ltat\u00e1si  szerz\u0151d\u00e9s  alapj\u00e1n  t\u00f6rt\u00e9n\u0151  k\u00f6zszolg\u00e1ltat\u00e1s  megkezd\u00e9s\u00e9ig  tart\u00f3  id\u0151szakra
  vonatkoz\u00f3an az ell\u00e1t\u00e1s\u00e9rt felel\u0151s telep\u00fcl\u00e9si
  \u00f6nkorm\u00e1nyzatokon kereszt\u00fcl.\\n4.2. A t\u00e1mogat\u00e1sr\u00f3l  a  helyi  \u00f6nkorm\u00e1nyzatok\u00e9rt  felel\u0151s  miniszter  a  Magyar  Energetikai  \u00e9s
  K\u00f6zm\u0171-szab\u00e1lyoz\u00e1si Hivatal (a tov\u00e1bbiakban: MEKH) t\u00e1mogat\u00e1si
  javaslat\u00e1t k\u00f6vet\u0151en d\u00f6nt.\\n4.3. A t\u00e1rgy\u00e9vre meg\u00e1llap\u00edtott
  t\u00e1mogat\u00e1s foly\u00f3s\u00edt\u00e1sa  t\u00e1mogat\u00e1si el\u0151legk\u00e9nt
  egy \u00f6sszegben t\u00f6rt\u00e9nik, a helyi \u00f6nkorm\u00e1nyzatok\u00e9rt
  felel\u0151s miniszter d\u00f6nt\u00e9s\u00e9t k\u00f6vet\u0151 15 napon bel\u00fcl.
  A foly\u00f3s\u00edt\u00e1s felt\u00e9tele, hogy az ell\u00e1t\u00e1s\u00e9rt felel\u0151s
  \u00f6nkorm\u00e1nyzat az el\u0151z\u0151 \u00e9vre vonatkoz\u00f3 elsz\u00e1mol\u00e1st
  az \u00e9ves k\u00f6lts\u00e9gvet\u00e9si besz\u00e1mol\u00f3j\u00e1ban teljes\u00edtse.
  Amennyiben ez nem t\u00f6rt\u00e9nt meg a miniszteri d\u00f6nt\u00e9st megel\u0151z\u0151en,
  akkor az elsz\u00e1mol\u00e1st k\u00f6vet\u0151 15 napon bel\u00fcl ker\u00fclhet
  sor a foly\u00f3s\u00edt\u00e1sra. Amennyiben a k\u00f6z\u00e9rdek\u0171 szolg\u00e1ltat\u00f3t
  a t\u00e1rgy\u00e9vet megel\u0151z\u0151 \u00e9vi besz\u00e1mol\u00f3j\u00e1nak
  ellen\u0151rz\u00e9s\u00e9t k\u00f6vet\u0151en a MEKH\\n\\nt\u00e1j\u00e9koztat\u00e1sa
  alapj\u00e1n t\u00f6bblett\u00e1mogat\u00e1s illeti meg, a helyi \u00f6nkorm\u00e1nyzatok\u00e9rt
  felel\u0151s miniszter d\u00f6nt a  t\u00f6bblett\u00e1mogat\u00e1sr\u00f3l,  \u00e9s  az  ell\u00e1t\u00e1s\u00e9rt  felel\u0151s  \u00f6nkorm\u00e1nyzatokon  kereszt\u00fcl  gondoskodik  a
  t\u00e1mogat\u00e1si el\u0151leggel nem fedezett r\u00e9sznek t\u00e1mogat\u00e1sk\u00e9nt
  t\u00f6rt\u00e9n\u0151 biztos\u00edt\u00e1s\u00e1r\u00f3l.\\n\\n4.4. Ha a k\u00f6z\u00e9rdek\u0171
  szolg\u00e1ltat\u00f3 az ig\u00e9nyl\u00e9sben megadott id\u0151szakra vonatkoz\u00f3an
  nem r\u00e9szes\u00fclt t\u00e1mogat\u00e1si el\u0151legben, \u00e9s a besz\u00e1mol\u00f3j\u00e1nak
  ellen\u0151rz\u00e9s\u00e9t k\u00f6vet\u0151en a MEKH t\u00e1j\u00e9koztat\u00e1sa
  alapj\u00e1n t\u00e1mogat\u00e1s illeti meg, a helyi \u00f6nkorm\u00e1nyzatok\u00e9rt
  felel\u0151s miniszter a MEKH t\u00e1mogat\u00e1si javaslat\u00e1t k\u00f6vet\u0151en
  d\u00f6nt a t\u00e1mogat\u00e1sr\u00f3l, \u00e9s az ell\u00e1t\u00e1s\u00e9rt felel\u0151s
  \u00f6nkorm\u00e1nyzatokon kereszt\u00fcl gondoskodik a t\u00e1mogat\u00e1s biztos\u00edt\u00e1s\u00e1r\u00f3l.\\n4.5.
  A t\u00e1mogat\u00e1s felhaszn\u00e1l\u00e1s\u00e1nak hat\u00e1rideje t\u00e1rgy\u00e9v
  december 31-e.\\\"\\n\\nA  telep\u00fcl\u00e9si  foly\u00e9kony  hullad\u00e9k  kezel\u00e9s\u00e9re  a  DVCSH
  Kft.  2023.  j\u00fanius  30-ig  jogosult,  az \u00f6nkorm\u00e1nyzat \u00e1ltal
  megk\u00f6t\u00f6tt k\u00f6zszolg\u00e1ltat\u00e1si szerz\u0151d\u00e9st alapj\u00e1n
  (1. sz. mell\u00e9klet).\\n\\nMindezek alapj\u00e1n az \u00d6nkorm\u00e1nyzat az
  \u00e1llami t\u00e1mogat\u00e1st tov\u00e1bbadja a t\u00e1rsas\u00e1g r\u00e9sz\u00e9re
  a 2021. \u00e9vre vonatkoz\u00f3 vesztes\u00e9ge ellent\u00e9telez\u00e9s\u00e9re.\\n\\nAz
  \u00d6nkorm\u00e1nyzat az al\u00e1bbi \u00fctemez\u00e9sben adja tov\u00e1bb a t\u00e1mogat\u00e1st:\\n\\n-
  I. r\u00e9szlet (I., II., III. negyed\u00e9v ): 2021. janu\u00e1r 1. \u2013 szeptember
  30-ig\\n- II. r\u00e9szlet (IV. negyed\u00e9vre jut\u00f3 els\u0151 r\u00e9szlet):
  2021. okt\u00f3ber 1. - december 12-ig\\nIII. r\u00e9szlet (IV. negyed\u00e9vre
  jut\u00f3, fennmarad\u00f3 r\u00e9szlet): 2021. december 13.- december 31-ig\\n\\nT\u00e1mogat\u00f3
  a jogszab\u00e1ly felt\u00e9telei alapj\u00e1n a 2021. janu\u00e1r 01-t\u0151l 2021.
  december 31. napj\u00e1ig terjed\u0151 id\u0151szakra 15.000 m 3 ut\u00e1n 1.500.000.-Ft
  \u00e1llami t\u00e1mogat\u00e1st ig\u00e9nyelt.  T\u00e1mogat\u00f3 fenti id\u0151szakra
  a foly\u00f3s\u00edtott t\u00e1mogat\u00e1sr\u00f3l a nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt
  h\u00e1ztart\u00e1si szennyv\u00edz sz\u00e1ll\u00edt\u00e1s\u00e1t sz\u00e1ml\u00e1kkal
  igazolt mennyis\u00e9ge alapj\u00e1n a Magyar \u00c1llamkincst\u00e1r Igazgat\u00f3s\u00e1g
  fel\u00e9 elsz\u00e1molni k\u00f6teles a 2021. \u00e9vi k\u00f6lts\u00e9gvet\u00e9si
  besz\u00e1mol\u00f3 k\u00e9sz\u00edt\u00e9s keretein bel\u00fcl.\\n\\nA K\u00f6lts\u00e9gvet\u00e9si
  \u00e9s P\u00e9nz\u00fcgyi Oszt\u00e1ly t\u00e1j\u00e9koztat\u00e1sa alapj\u00e1n,
  a f\u00e9l\u00e9ves adatok szerint ez a keret\u00f6sszeg kev\u00e9snek bizonyul,
  m\u00e1r most meghaladtuk ezt az \u00f6sszeget, ez\u00e9rt annak 2.000.000.- Ft-ra
  (500.000.Ft t\u00f6bblett\u00e1mogat\u00e1s) t\u00f6rt\u00e9n\u0151 n\u00f6vel\u00e9se
  sz\u00fcks\u00e9ges (2. sz. mell\u00e9klet). A n\u00f6veked\u00e9s fedezete az \u00e1llami
  t\u00e1mogat\u00e1s lesz, amit p\u00f3tl\u00f3lagosan k\u00e9r\u00fcnk meg 2021.
  okt\u00f3ber\u00e9ben.\\n\\nMindezek alapj\u00e1n el\u0151k\u00e9sz\u00edtett\u00fck
  a T\u00e1mogat\u00e1si szerz\u0151d\u00e9st, mely a hat\u00e1rozati javaslat mell\u00e9klete.\\n\\nAz
  el\u0151terjeszt\u00e9st t\u00e1rgyalta a  P\u00e9nz\u00fcgyi, Gazdas\u00e1gi \u00e9s
  V\u00e1ros\u00fczemeltet\u00e9si Bizotts\u00e1g, valamint az \u00dcgyrendi, Igazgat\u00e1si
  \u00e9s Jogi Bizotts\u00e1g.\\n\\nBizotts\u00e1gi v\u00e9lem\u00e9nyek:\\n\\nA bizotts\u00e1gok
  v\u00e9lem\u00e9nyeit, a bizotts\u00e1gok eln\u00f6kei a k\u00f6zgy\u0171l\u00e9sen
  sz\u00f3ban ismertetik.\\n\\nMindezek alapj\u00e1n az al\u00e1bbi hat\u00e1rozati
  javaslatot terjeszt\u00fcnk a Tisztelt K\u00f6zgy\u0171l\u00e9s el\u00e9:\\n\\nHAT\u00c1ROZATI
  JAVASLAT Duna\u00fajv\u00e1ros Megyei Jog\u00fa V\u00e1ros K\u00f6zgy\u0171l\u00e9se
  ......./2021. (IX.16.) hat\u00e1rozata\\n\\na Duna\u00fajv\u00e1rosi V\u00edz-,
  Csatorna- H\u0151szolg\u00e1ltat\u00f3 Kft. 2021. \u00e9vre vonatkoz\u00f3 vesztes\u00e9ge
  ellent\u00e9telez\u00e9s\u00e9re vonatkoz\u00f3 T\u00e1mogat\u00e1si szerz\u0151d\u00e9s
  megk\u00f6t\u00e9s\u00e9r\u0151l\\n\\n1. DMJV K\u00f6zgy\u0171l\u00e9se, tekintettel
  a Magyarorsz\u00e1g 2021. \u00e9vi k\u00f6zponti k\u00f6lts\u00e9gvet\u00e9s\u00e9r\u0151l
  sz\u00f3l\u00f3 2020. \u00e9vi CX. t\u00f6rv\u00e9nyre, valamint a DVCSH Kft.-vel
  a telep\u00fcl\u00e9si foly\u00e9kony hullad\u00e9k kezel\u00e9s\u00e9re megk\u00f6t\u00f6tt
  k\u00f6zszolg\u00e1ltat\u00e1si  szerz\u0151d\u00e9sre,  a  DVCSH  Kft.  r\u00e9sz\u00e9re  2.000.000.-  Ft  t\u00e1mogat\u00e1st  ny\u00fajt  a  nem\\n\\nk\u00f6zm\u0171vel
  \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si szennyv\u00edz \u00e1rtalmatlan\u00edt\u00e1sa
  feladatell\u00e1t\u00e1sb\u00f3l sz\u00e1rmaz\u00f3 vesztes\u00e9ge ellent\u00e9telez\u00e9s\u00e9re,
  a hat\u00e1rozat mell\u00e9klete szerinti szerz\u0151d\u00e9sben r\u00f6gz\u00edtettek
  szerint.\\n\\n2. Duna\u00fajv\u00e1ros  Megyei  Jog\u00fa  V\u00e1ros  K\u00f6zgy\u0171l\u00e9se  kijelenti,  hogy  jelen  hat\u00e1rozat  1.  pontj\u00e1ban
  meghat\u00e1rozott  feladatra  brutt\u00f3  1.500.000.-,  Ft  forr\u00e1s  Duna\u00fajv\u00e1ros  Megyei  Jog\u00fa  V\u00e1ros
  \u00d6nkorm\u00e1nyzata  K\u00f6zgy\u0171l\u00e9se  6/2021.  (II.18.)  \u00f6nkorm\u00e1nyzati  rendelete  8.  mell\u00e9klet  2.
  V\u00e1ros\u00fczemeltet\u00e9s 2.1. sor\u00e1n rendelkez\u00e9sre \u00e1ll (melynek
  forr\u00e1sa  a nem k\u00f6zm\u0171vel \u00f6sszegy\u0171jt\u00f6tt h\u00e1ztart\u00e1si
  szennyv\u00edz \u00e1rtalmatlan\u00edt\u00e1sa c\u00edmen ig\u00e9nyelt, \u00e9s
  m\u00e1r megkapott \u00e1llami t\u00e1mogat\u00e1s) a tov\u00e1bbi 500.000.- Ft
  fedezete, a p\u00f3tl\u00f3lagosan ig\u00e9nyelend\u0151 \u00e1llami t\u00e1mogat\u00e1s.\\n3.
  Duna\u00fajv\u00e1ros Megyei Jog\u00fa V\u00e1ros Polg\u00e1rmestere utas\u00edtja
  a vagyonkezel\u00e9si oszt\u00e1ly vezet\u0151j\u00e9t jelen  hat\u00e1rozat  mell\u00e9klet\u00e9t  k\u00e9pez\u0151  t\u00e1mogat\u00e1si  szerz\u0151d\u00e9s  polg\u00e1rmesteri  al\u00e1\u00edr\u00e1sra  val\u00f3
  el\u0151k\u00e9sz\u00edt\u00e9s\u00e9re \u00e9s a hat\u00e1rozat k\u00f6zl\u00e9s\u00e9re.\\n\\nFelel\u0151s
  : - a hat\u00e1rozat v\u00e9grehajt\u00e1s\u00e1\u00e9rt:\\n\\na polg\u00e1rmester\\n-
  a hat\u00e1rozat v\u00e9grehajt\u00e1s\u00e1ban val\u00f3 k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9rt:\\na
  Vagyonkezel\u00e9si Oszt\u00e1ly vezet\u0151je\\na Gazdas\u00e1gi F\u0151oszt\u00e1ly
  vezet\u0151je\\n\\nHat\u00e1rid\u0151: - a hat\u00e1rozat k\u00f6zl\u00e9s\u00e9re:
  a hat\u00e1rozatnak az el\u0151k\u00e9sz\u00edt\u0151 oszt\u00e1lyra t\u00f6rt\u00e9n\u0151
  meg\u00e9rkez\u00e9s\u00e9t\u0151l sz\u00e1m\u00edtott 8 napon bel\u00fcl\\n\\n-
  a t\u00e1mogat\u00e1si szerz\u0151d\u00e9s al\u00e1\u00edr\u00e1s\u00e1ra: a hat\u00e1rozat
  \u00e9rintettekkel val\u00f3 k\u00f6zl\u00e9s\u00e9t\\n\\nk\u00f6vet\u0151 30 napon
  bel\u00fcl\\n\\n4. Duna\u00fajv\u00e1ros Megyei Jog\u00fa V\u00e1ros \u00d6nkorm\u00e1nyzata
  K\u00f6zgy\u0171l\u00e9se felhatalmazza a polg\u00e1rmestert, hogy  jelen  hat\u00e1rozat
  alapj\u00e1n int\u00e9zkedjen  a k\u00f6telezetts\u00e9gv\u00e1llal\u00e1s  nyilv\u00e1ntart\u00e1sba  v\u00e9tel\u00e9r\u0151l
  \u00e9s a p\u00e9nz\u00fcgyi teljes\u00edt\u00e9sr\u0151l.\\n5. Duna\u00fajv\u00e1ros
  Megyei Jog\u00fa V\u00e1ros  \u00d6nkorm\u00e1nyzata  K\u00f6zgy\u0171l\u00e9se
  utas\u00edtja a jegyz\u0151t, hogy az 1. pontban  foglalt  k\u00f6telezetts\u00e9gv\u00e1llal\u00e1st  a  2.  pontban  foglaltaknak  megfelel\u0151en  a  2021.  \u00e9vi
  k\u00f6lts\u00e9gvet\u00e9s  k\u00f6vetkez\u0151 m\u00f3dos\u00edt\u00e1sakor  vegye
  figyelembe, valamint a k\u00fcl\u00f6nb\u00f6zet 500.000.- Ft \u00f6sszeget  a  2021.  \u00e9vi  okt\u00f3beri  \u00e1llami  t\u00e1mogat\u00e1sok  fel\u00fclvizsg\u00e1latakor  ig\u00e9nyelje  meg,  egyben
  felhatalmazza a polg\u00e1rmestert a d\u00f6nt\u00e9ssel \u00f6sszef\u00fcgg\u0151
  k\u00f6telezetts\u00e9gv\u00e1llal\u00e1s teljes\u00edt\u00e9s\u00e9re.\\n\\nFelel\u0151s:
  - a k\u00f6telezetts\u00e9gv\u00e1llal\u00e1s teljes\u00edt\u00e9s\u00e9\u00e9rt:\\n\\na
  polg\u00e1rmester\\n- a k\u00f6telezetts\u00e9gv\u00e1llal\u00e1sban t\u00f6rt\u00e9n\u0151
  k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9rt:\\na Vagyonkezel\u00e9si Oszt\u00e1ly vezet\u0151je\\n-
  a k\u00f6lts\u00e9gvet\u00e9s m\u00f3dos\u00edt\u00e1s\u00e1\u00e9rt:\\na Jegyz\u0151\\n-
  a k\u00f6lts\u00e9gvet\u00e9s m\u00f3dos\u00edt\u00e1s\u00e1\u00e9rt val\u00f3 k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9rt,
  a p\u00f3tl\u00f3lagos t\u00e1mogat\u00e1s ig\u00e9nyl\u00e9s\u00e9\u00e9rt a Gazdas\u00e1gi
  F\u0151oszt\u00e1ly vezet\u0151je\\n\\nHat\u00e1rid\u0151: a 2021. \u00e9vi \u00f6nkorm\u00e1nyzati
  k\u00f6lts\u00e9gvet\u00e9s k\u00f6vetkez\u0151 m\u00f3dos\u00edt\u00e1s\u00e1nak
  id\u0151pontja az \u00e1llami t\u00e1mogat\u00e1sok ig\u00e9nyl\u00e9s\u00e9nek
  id\u0151pontja, 2021. okt\u00f3ber h\u00f3napj\u00e1ban\\n\\nDuna\u00fajv\u00e1ros,
  2021. szeptember 16.\\n\\nT\u00f3th K\u00e1lm\u00e1n s.k. a P\u00e9nz\u00fcgyi,
  Gazdas\u00e1gi \u00e9s V\u00e1ros\u00fczemeltet\u00e9si Bizotts\u00e1g, valamint
  az \u00dcgyrendi, Igazgat\u00e1si \u00e9s Jogi Bizotts\u00e1g eln\u00f6ke\"", "\"Mell\u00e9kletek:\\n\\nTisztelt
  K\u00f6zgy\u0171l\u00e9s!\\n\\nA Ter\u00fclet- \u00e9s Telep\u00fcl\u00e9sfejleszt\u00e9si
  Operat\u00edv Program keret\u00e9ben megjelent, TOP-6.6.1-15 Eg\u00e9szs\u00e9g\u00fcgyi
  alapell\u00e1t\u00e1s infrastruktur\u00e1lis fejleszt\u00e9se\\\" t\u00e1rgy\u00fa
  felh\u00edv\u00e1s tekintet\u00e9ben Debrecen Megyei Jog\u00fa V\u00e1ros \u00d6nkorm\u00e1nyzata
  (a tov\u00e1bbiakban: \u00d6nkorm\u00e1nyzat) a 2016. m\u00e1rcius 31-\u00e9n megtartott
  K\u00f6zgy\u0171l\u00e9sen 11 db t\u00e1mogat\u00e1si k\u00e9relem beny\u00fajt\u00e1s\u00e1r\u00f3l
  d\u00f6nt\u00f6tt. A Magyar \u00c1llamkincst\u00e1r Hajd\u00fa-Bihar Megyei Igazgat\u00f3s\u00e1ga
  a mai napig 9 db t\u00e1mogat\u00e1si k\u00e9relem vonatkoz\u00e1s\u00e1ban \u00e9rtes\u00edtette
  az \u00d6nkorm\u00e1nyzatot t\u00e1mogat\u00f3 d\u00f6nt\u00e9s\u00e9r\u0151l, 2
  db t\u00e1mogat\u00e1si k\u00e9relem eset\u00e9ben m\u00e9g nem sz\u00fcletett d\u00f6nt\u00e9s,
  de v\u00e1rhat\u00f3an ezen t\u00e1mogat\u00e1si k\u00e9relmekr\u0151l is napokon
  bel\u00fcl \u00e9rtes\u00edt\u00e9st kapunk.\\n\\nA 2014-2020 programoz\u00e1si
  id\u0151szakban az egyes eur\u00f3pai uni\u00f3s alapokb\u00f3l sz\u00e1rmaz\u00f3
  t\u00e1mogat\u00e1sok felhaszn\u00e1l\u00e1s\u00e1nak rendj\u00e9r\u0151l sz\u00f3l\u00f3
  272/2014 (XI. 5.) Korm. rendelet 81. \u00a7 (3) bekezd\u00e9se szerint a T\u00e1mogat\u00e1si
  D\u00f6nt\u00e9sr\u0151l sz\u00f3l\u00f3 \u00e9rtes\u00edt\u00e9s Kedvezm\u00e9nyezett
  \u00e1ltali k\u00e9zhezv\u00e9tel\u00e9t\u0151l sz\u00e1m\u00edtott harminc napon
  bel\u00fcl sz\u00fcks\u00e9ges megk\u00f6tni a T\u00e1mogat\u00e1si Szerz\u0151d\u00e9st.\\n\\nA
  projekt lebonyol\u00edt\u00e1s\u00e1ba indokolt Debrecen Megyei Jog\u00fa V\u00e1ros
  Polg\u00e1rmesteri Hivatal\u00e1t konzorciumi partnerk\u00e9nt bevonni, amelyr\u0151l
  a K\u00f6zgy\u0171l\u00e9snek d\u00f6ntenie kell. Tekintettel arra, hogy a projekt
  sor\u00e1n saj\u00e1t teljes\u00edt\u00e9sben a Hivatal munkat\u00e1rsai k\u00f6zrem\u0171k\u00f6dnek
  a megval\u00f3s\u00edt\u00e1sban, a projekt szem\u00e9lyi jelleg\u0171 k\u00f6lts\u00e9gei
  k\u00f6z\u00f6tt a b\u00e9rek az elv\u00e9gzett munk\u00e1val ar\u00e1nyosan elsz\u00e1molhat\u00f3k.\\n\\nA
  Nemzetgazdas\u00e1gi Miniszt\u00e9rium Region\u00e1lis Fejleszt\u00e9si Programok\u00e9rt
  Felel\u0151s Helyettes \u00c1llamtitk\u00e1r ROP 2016-4 sz\u00e1m\u00fa Utas\u00edt\u00e1sa
  (tov\u00e1bbiakban: Utas\u00edt\u00e1s) kimondja, hogy amennyiben a t\u00e1mogat\u00e1si
  k\u00e9relem t\u00e1mogat\u00e1st nyer, \u00e9s annak megval\u00f3s\u00edt\u00e1sa
  konzorciumi form\u00e1ban t\u00f6rt\u00e9nik, \u00fagy az egy\u00fcttm\u0171k\u00f6d\u0151
  feleknek meg kell k\u00f6tni\u00fck a \u201eKonzorciumi Egy\u00fcttm\u0171k\u00f6d\u00e9si
  Meg\u00e1llapod\u00e1s T\u00e1mogat\u00e1sban r\u00e9szes\u00edtett projekt megval\u00f3s\u00edt\u00e1s\u00e1ra\\\"
  c\u00edm\u0171 meg\u00e1llapod\u00e1st (tov\u00e1bbiakban: Meg\u00e1llapod\u00e1s).\\n\\nJelen
  esetben a T\u00e1mogat\u00e1si Szerz\u0151d\u00e9sek megk\u00f6t\u00e9s\u00e9ig
  - amelyekre 2016. augusztus h\u00f3napban ker\u00fcl sor - az \u00d6nkorm\u00e1nyzatnak
  rendelkeznie kell az egyes projektekre vonatkoz\u00f3 Meg\u00e1llapod\u00e1ssal,
  amely alapj\u00e1n Konzorcium j\u00f6n l\u00e9tre Debrecen Megyei Jog\u00fa V\u00e1ros
  Polg\u00e1rmesteri Hivatala \u00e9s Debrecen Megyei Jog\u00fa V\u00e1ros \u00d6nkorm\u00e1nyzata
  k\u00f6z\u00f6tt.\\n\\nAz Utas\u00edt\u00e1s szerint a Meg\u00e1llapod\u00e1sra
  a T\u00e1mogat\u00f3i d\u00f6nt\u00e9sr\u0151l sz\u00f3l\u00f3 dokumentum-csomagban
  szerepl\u0151 minta alkalmazand\u00f3 azzal, hogy a minta 1-8. pontjai nem t\u00f6r\u00f6lhet\u0151ek,
  nem m\u00f3dos\u00edthat\u00f3ak, csak a k\u00f6lts\u00e9gekre vonatkoz\u00f3 adatokkal
  lehet azokat felt\u00f6lteni, illetve a Meg\u00e1llapod\u00e1s 9. pontj\u00e1ban
  ker\u00fclhetnek r\u00f6gz\u00edt\u00e9sre a Tagok egy\u00e9b, egym\u00e1ssal egyeztetett,
  a feladat v\u00e9grehajt\u00e1s\u00e1ban val\u00f3 k\u00f6zrem\u0171k\u00f6d\u00e9s\u00fck
  r\u00e9szletez\u00e9s\u00e9re vonatkoz\u00f3 meg\u00e1llap\u00edt\u00e1sai.\\n\\nA
  rendelkez\u00e9s\u00fcnkre \u00e1ll\u00f3 9 db T\u00e1mogat\u00f3i D\u00f6nt\u00e9s
  alapj\u00e1n elk\u00e9sz\u00fclt Meg\u00e1llapod\u00e1sok tervezetei jelen el\u0151terjeszt\u00e9s
  mell\u00e9klet\u00e9t k\u00e9pezik. Tekintettel a szerz\u0151d\u00e9sk\u00f6t\u00e9sre
  rendelkez\u00e9sre \u00e1ll\u00f3 30 napos hat\u00e1rid\u0151re, amennyiben a T\u00e1mogat\u00f3
  D\u00f6nt\u00e9ssel m\u00e9g nem rendelkez\u0151 2 db t\u00e1mogat\u00e1si k\u00e9relem
  vonatkoz\u00e1s\u00e1ban a K\u00f6zgy\u0171l\u00e9s \u00fcl\u00e9s\u00e9t megel\u0151z\u0151en
  d\u00f6nt\u00e9s sz\u00fcletik, \u00fagy el\u0151terjeszt\u0151i kieg\u00e9sz\u00edt\u00e9s
  k\u00e9sz\u00fcl a hat\u00e1rozati javaslat \u00e9s az el\u0151terjeszt\u00e9s mell\u00e9kletei
  vonatkoz\u00e1s\u00e1ban.\\n\\n* a projekt c\u00edme: \u201eA Debrecen, J\u00e1nosi
