  igazgat\u00f3 Pro Progressione Kft.\\n\\nFelber Gabriella opera\u00e9nekes, tan\u00e1r\\n\\nStach\u00f3
  L\u00e1szl\u00f3 egyetemi adjunktus LFZE\\n\\nL\u00e9vai P\u00e9ter adjunktus MTE\\n\\nIfj.
  Sapszon Ferenc Kossuth- \u00e9s Liszt Ferenc-d\u00edjas karnagy, zeneszerz\u0151,
  a Kod\u00e1ly Zolt\u00e1n Magyar K\u00f3rusiskola alap\u00edt\u00f3ja\\n\\nTudom\u00e1nyos
  tev\u00e9kenys\u00e9gek t\u00e1mogat\u00e1sa\\n\\nK\u00eds\u00e9rleti fejleszt\u00e9sek
  \u00f6szt\u00f6nz\u00e9se, amelyek c\u00e9lja, hogy olyan t\u00f6bb tudom\u00e1nyter\u00fcletet
  \u00e9rint\u0151 m\u00f3dszertani megold\u00e1sok sz\u00fclessenek, melyek az \u00f3vod\u00e1skort\u00f3l
  kezd\u0151d\u0151en be\u00e9p\u00edtik, illetve aktualiz\u00e1lj\u00e1k azokat a
  m\u00f3dszertani megold\u00e1sokat, melyeket Kod\u00e1ly Zolt\u00e1n fontosnak tartott,
  illetve feleleven\u00edtik, tov\u00e1bbgondolj\u00e1k a Kod\u00e1ly-Dienes-f\u00e9le
  k\u00eds\u00e9rleti matematika programot, illetve fel\u00f6lelik a medi\u00e1ci\u00f3,
  a kommunik\u00e1ci\u00f3 \u00e9s az inform\u00e1ci\u00f3technol\u00f3gia ter\u00fcleteit,
  k\u00fcl\u00f6n\u00f6s hangs\u00fallyal az egy\u00fcttm\u0171k\u00f6d\u00e9s, kooper\u00e1ci\u00f3ra
  val\u00f3 k\u00e9pess\u00e9g fejleszt\u00e9s\u00e9re. A m\u00f3dszertani fejleszt\u00e9sek
  t\u00e1volabbi c\u00e9lja, hogy \u00f6szt\u00f6n\u00f6zz\u00e9k a szerz\u0151ket
  gyermekek \u00e1ltal el\u0151adhat\u00f3, a mai kornak megfelel\u0151 tartalm\u00fa
  sz\u00edndarabok, dalj\u00e1t\u00e9kok \u00e9s gyermekoper\u00e1k alkot\u00e1s\u00e1ra,
  illetve felk\u00e9sz\u00edts\u00e9k az \u00f3vodapedag\u00f3gusokat, a tan\u00edt\u00f3kat
  \u00e9s a tan\u00e1rokat a m\u0171v\u00e9szeti nevel\u00e9s olyan \u00f6sszetett
  megold\u00e1saira, ahol a gyermekek alkot\u00f3 folyamatai (a szerz\u0151k \u00fagy
  \u00edrj\u00e1k a darabokat, hogy a gyermekeknek lehet\u0151s\u00e9ge legyen a r\u00f6gt\u00f6nz\u00e9sre),
  nem sz\u0171k\u00fclnek le a darabok el\u0151ad\u00e1s\u00e1ra, hanem fel\u00f6lelik
  a d\u00edszletek, a jelmezek, az egy\u00e9b szcenikai megold\u00e1sok tervez\u00e9si
  \u00e9s kivitelez\u00e9si f\u00e1zisait is.\\n\\nKod\u00e1ly Zolt\u00e1n \u00e9letm\u0171v\u00e9nek
  tal\u00e1n egyik legfontosabb \u00fczenete a nevel\u00e9s fontoss\u00e1ga, \u00e9s
  a nevel\u00e9s nem \u00e9r v\u00e9get a gyermekkorral. A Kod\u00e1ly Vil\u00e1ga
  kezdem\u00e9nyez\u00e9s t\u00f6bbek k\u00f6z\u00f6tt olyan t\u00f6bb tudom\u00e1nyter\u00fcleten
  \u00e1t\u00edvel\u0151 fejleszt\u0151 munk\u00e1n is f\u00e1radozik, amely a harmonikus
  p\u00e1rkapcsolatra \u00e9s a csal\u00e1di \u00e9letre val\u00f3 felk\u00e9sz\u00fcl\u00e9st
  c\u00e9lozza Kod\u00e1ly Zolt\u00e1n zenei nevel\u00e9si rendszer\u00e9re alapozva.\\n\\nEgy\u00e9b
  \u00f6tletek\\n\\n1. Zenede m\u0171v\u00e9szeti bolt (saj\u00e1t k\u00e9sz\u00edt\u00e9s\u0171,
  illetve antik t\u00e1rgyakat v\u00e1runk, melyeket havonta egy alkalommal valamilyen
  el\u0151re meghat\u00e1rozott\\n\\n\\\"j\u00f3t\u00e9kony\\\" c\u00e9l \u00e9rdek\u00e9ben
  nyilv\u00e1nos program keret\u00e9ben el\u00e1rverez\u00fcnk \u2013 Kod\u00e1ly
  Zolt\u00e1nn\u00e9 javaslata alapj\u00e1n. 2017. dcember 11-\u00e9n interakt\u00edv
  ki\u00e1ll\u00edt\u00e1s megnyit\u00e1sa a Bozs\u00f3 gy\u0171jtem\u00e9nyben.\\n\\n2.
