  ill. k\u00f6zbeszerz\u00e9si r\u00e9szben beny\u00fajtott igazol\u00e1st k\u00e9ri
  figyelembe venni a b\u00edr\u00e1lat sor\u00e1n.\\n\\nSzekmai tev\u00e9kenys\u00e9g
  v\u00e9gz\u00e9s\u00e9re vonatkoz\u00f3 alkalmass\u00e1g el\u0151\u00edr\u00e1sa
  [Kbt. 65. \u00a7 (1) bekezd\u00e9s c) pont]: (Max. 6000 karakter)\\n\\nSzekmai tev\u00e9kenys\u00e9g
