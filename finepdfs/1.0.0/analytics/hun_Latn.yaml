  b\u00e1bos, a kalapos mester \u00e9s a k\u00e9ses mester. \u00c1ttekintj\u00fck,
  hogyan m\u0171k\u00f6dtek a c\u00e9hek, mik\u00e9nt lehetett mesterr\u00e9 valaki,
  \u00e9s kik voltak a hab\u00e1nok.\\n\\n1. M\u00fazeumi szakm\u00e1k (l\u00e1togat\u00e1s
