  \u00f3vod\u00e1s, als\u00f3 \u00e9s fels\u0151 tagozatos iskol\u00e1soknak\\n\\nCsoport
  l\u00e9tsz\u00e1ma: 10-15 f\u0151\\n\\nA foglalkoz\u00e1s id\u0151tartama: 45, 60
