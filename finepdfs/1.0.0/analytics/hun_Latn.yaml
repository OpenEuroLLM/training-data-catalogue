  iskol\u00e1k k\u00f6z\u00f6tti kapcsolatok felhaszn\u00e1l\u00e1sa, egy\u00fcttm\u0171k\u00f6d\u00e9s
  \u00faj lehet\u0151s\u00e9gek kihaszn\u00e1l\u00e1s\u00e1ra;\\n\u2022 k\u00fcl\u00f6n\u00f6sen
