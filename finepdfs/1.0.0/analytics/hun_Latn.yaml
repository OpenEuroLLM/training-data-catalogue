  form\u00e1i tant\u00e1rgycsoportok szerint:\\n\\nTerm\u00e9szettudom\u00e1nyos tant\u00e1rgyak
  eset\u00e9ben:\\n\u2022 A tanul\u00e1si kudarcnak kitett tanul\u00f3k diagnosztiz\u00e1l\u00e1sa
