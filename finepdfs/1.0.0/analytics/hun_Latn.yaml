  k\u00f6tb\u00e9rt k\u00f6tele megfizetni minden k\u00e9sedelemmel \u00e9rintett
  napt\u00e1ri nap ut\u00e1n. A k\u00e9sedelmi k\u00f6tb\u00e9rt legfeljebb 30 napi
