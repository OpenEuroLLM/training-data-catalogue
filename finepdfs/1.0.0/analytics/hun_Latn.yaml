  a terem\u0151r.\\n\\nT\u00e1rgyalkot\u00f3 hagyom\u00e1ny \u2013 \u00e1lland\u00f3
  n\u00e9prajzi ki\u00e1ll\u00edt\u00e1s\\n\\nP\u00c1SZTOR\u00c9LET\\n\\nFoglalkoz\u00e1s
