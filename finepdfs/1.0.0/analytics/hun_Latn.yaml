  MIN\u0150S\u00c9G\\nA n\u00e9metorsz\u00e1gi transzportbeton ipar kor\u00e1bbi \u00e9s
  mai gyakorlata\\n\\nA Szil\u00e1ktipari Tudom\u00e1nyos Egyes\u00fclet - egy\u00fcttm\u0171k\u00f6dve
  a Magyar Betonsz\u00f6vets\u00e9ggel - szakmai tov\u00e1bbk\u00e9pz\u00e9st szervez
  a magyar transzportbeton iparban dolgoz\u00f3 szakemberek sz\u00e1m\u00e1ra. A k\u00e9t
  alkalommal, azonos tartalommal megrendezend\u0151 egy-egy napos tanfolyam keret\u00e9ben
  az \u00e9rdekl\u0151d\u0151 koll\u00e9g\u00e1k betekint\u00e9st kapnak: hogyan m\u0171k\u00f6dik
  N\u00e9metorsz\u00e1gban a transzportbetonok gy\u00e1rt\u00e1s\u00e1nak k\u00fcls\u0151
  \u00e9s bels\u0151 ellen\u0151rz\u00e9se?\\n\\nMilyen szervezetek \u00e9s hogyan
  m\u0171k\u00f6dtetik az ellen\u0151rz\u00e9si rendszert, milyen a kapcsolat az \u00e9p\u00edt\u0151anyag
  fel\u00fcgyeleti hat\u00f3s\u00e1gokkal? Hogyan folyik a min\u0151s\u00e9gir\u00e1ny\u00edt\u00e1s
  \u00e9s ellen\u0151rz\u00e9s a n\u00e9metorsz\u00e1gi kavics-, homok-, habarcs-
  \u00e9s transzportbeton ipari gyakorlatban? Milyen jogszab\u00e1lyok seg\u00edthet
