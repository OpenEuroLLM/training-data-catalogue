  Szarvasmarhafeny\u00e9szts (2), Ol\u00e1h: Az ember \u00e9s az eg\u00e9szs\u00e9g
  (3), Sebesty\u00e9n: Az \u00c1rp\u00e1dok t\u00f6rt\u00e9nete (4), Szegfi: A vil\u00e1g
  csod\u00e1i (4). Ellenben szomor\u00fa t\u00fcnet, hogy a helyes gazd\u00e1lkod\u00e1sra
  vonatkoz\u00f3 k\u00f6nyvek legt\u00f6bbj\u00e9t egyetlen egyszer sem vett\u00e9k
  ig\u00e9nybe.\\n\\nEz adatok egy r\u00e9sze egyik k\u00f6nyomat\u00e1sunk buzg\u00f3s\u00e1g\u00e1b\u00f3l
  a napi sajt\u00f3t is bej\u00e1rta. A hozz\u00e1f\u0171z\u00f6tt comment\u00e1r\u00f3k
  k\u00f6z\u00fcl a magyar n\u00e9pl\u00e9lek nem ismer\u00e9s\u00e9t tan\u00fas\u00edt\u00f3
  t\u00e1j\u00e9kozatlans\u00e1ggal mulats\u00e1gosan kiv\u00e1lik a Vil\u00e1g\u00e9,
  mely n\u00e9p\u00fcnk izl\u00e9sbeli h\u00e1tramaradotts\u00e1g\u00e1n sop\u00e1nkodik,
  mi\u00e9rt J\u00f3kait, Miksz\u00e1thot, Verne-t kedveli s nem Anatole France-ot,
  Stendhalt, Balzac-ot vagy Flaubert-t olvassa a magyar olvas\u00f3k\u00f6z\u00f6ns\u00e9g,
  helyesebben a magyar paraszt, mert hiszen ebb\u0151l a sorb\u00f3l ker\u00fcl ki
  a n\u00e9pk\u00f6nyvt\u00e1rak olvas\u00f3k\u00f6z\u00f6ns\u00e9g\u00e9nek a z\u00f6me.
  Ezzel szemben lesz\u00f6gezz\u00fck a mez\u0151t\u00fari n\u00e9pk\u00f6nyvt\u00e1r
  kezel\u0151j\u00e9nek 1910. \u00e9vi jelent\u00e9s\u00e9ben kifejez\u00e9sre juttatott
  panasz\u00e1t, a mely szerint az ottani k\u00f6z\u00f6ss\u00e9g annyira bizalmatlan
  minden \u00faj ir\u00e1nt, hogy az \u00fajak\u00f6tetett kedvelt k\u00f6nyveit sem
  akarja k\u00e9zbevenni, mert okoskod\u00e1suk szerint csak az a j\u00f3, a mit sokan
  olvasnak s a min meg is l\u00e1tszik ennek a nyoma! K\u00fcl\u00f6nben is eg\u00e9szen
  holtbizonyos, hogy a Vil\u00e1g \u00e1ltal felsorolt francia szerz\u0151ket, a kiknek
  igaz \u00e1t\u00e9rt\u00e9se, teh\u00e1t \u00e9lvez\u00e9se is a kultur\u00e1val
  tel\u00edtett szellemi v\u00e1lasztottak privil\u00e9giuma marad, a francia n\u00e9p
  sem olvassa valami nagyon s \u00edgy n\u00e9pszer\u0171tlens\u00e9g\u00fckr\u0151l
  a mi n\u00e9p\u00fcnk kulturai fejletlens\u00e9g\u00e9re k\u00f6vetkeztetni legal\u00e1bb
  is elhamarkodott dolog.\\n\\nObserver.\\n\\nV\u00c1LTOZ\u00c1SOK\\na magyarorsz\u00e1gi
