  ny\u00fajt\u00f3 ell\u00e1t\u00e1sok\\n\\n9.\u00a7.\\n\\n/1/ Az alapell\u00e1t\u00e1s
  form\u00e1i:\\na./ h\u00e1zi seg\u00edts\u00e9gny\u00fajt\u00e1s,\\nb./ szoci\u00e1lis
  \u00e9tkeztet\u00e9s.\\n/2/ a./ \u00d3cs\u00e1rd \u2013Sz\u0131ke-Regenye \u00d6nkorm\u00e1nyzatai
  \u00d3cs\u00e1rd \u00d6nkorm\u00e1nyzat gesztors\u00e1g\u00e1val \u00d3cs\u00e1rd-Sz\u0131ke-Regenye
  telep\u00fcl\u00e9sek eg\u00e9sz\u00e9re egy h\u00e1zi gondoz\u00f3i k\u00f6rzetet
  hoztak l\u00e9tre amelyet a t\u00e1rsul\u00e1si t\u00f6rv\u00e9ny alapj\u00e1n m\u0151k\u00f6dtetnek.
  Hat\u00e1lyos 2004. m\u00e1jus 1 napj\u00e1t\u00f3l.\\nb./ A h\u00e1zi seg\u00edts\u00e9gny\u00fajt\u00e1s
  \u00e9s a szoci\u00e1lis \u00e9tkeztet\u00e9s anyagi jogi szab\u00e1lyait az 1993.
  \u00e9vi III. t\u00f6rv\u00e9ny tartalmazza.\\n\\n/3/ A h\u00e1zi seg\u00edts\u00e9gny\u00fajt\u00e1s
  keret\u00e9ben kell gondoskodni\\n\\na./ Azokr\u00f3l a szem\u00e9lyekr\u0131l,
  akik otthonukban \u00f6nmaguk ell\u00e1t\u00e1s\u00e1ra saj\u00e1t er\u0131b\u0131l
  nem k\u00e9pesek \u00e9s r\u00f3luk nem gondoskodnak,\\nb./ azokr\u00f3l a gyermekekr\u0131l,
  akik r\u00e9sz\u00e9re nappali vagy bentlak\u00e1sos int\u00e9zm\u00e9nybe t\u00f6rt\u00e9n\u0131
  \u00e1lland\u00f3 vagy id\u0131szakos ell\u00e1t\u00e1s nem biztos\u00edthat\u00f3
  /beteg/ \u00e9s a sz\u00fcl\u0131k a gyermek napk\u00f6zbeni ell\u00e1t\u00e1s\u00e1t
  nem vagy csak r\u00e9szben tudj\u00e1k megoldani.\\n/4/ a./ H\u00e1zi seg\u00edts\u00e9gny\u00fajt\u00e1st
  az \u00f6nkorm\u00e1nyzat az ig\u00e9nyjogosultak r\u00e9sz\u00e9re \u2013 tekintet
  n\u00e9lk\u00fcl a szolg\u00e1ltat\u00e1st ig\u00e9nybe vev\u0131 szoci\u00e1lis
  helyzet\u00e9re \u2013 t\u00e9r\u00edt\u00e9s mentesen biztos\u00edtja.\\nb./ A
  szoci\u00e1lis \u00e9tkeztet\u00e9s t\u00e9r\u00edt\u00e9si d\u00edj\u00e1t az \u00f6nkorm\u00e1nyzat
  k\u00fcl\u00f6n rendelet\u00e9ben \u00e1llap\u00edtja meg.\\n/5/ A h\u00e1zi seg\u00edts\u00e9gny\u00fajt\u00e1s
  gondoz\u00f3ja a ter\u00fcleten m\u0151k\u00f6d\u0131 h\u00e1ziorvosokkal, szoci\u00e1lis
  \u00fcgyint\u00e9z\u0131kkel, polg\u00e1rmesterrel egy\u00fcttm\u0151k\u00f6dik
  a feladat hat\u00e9kony ell\u00e1t\u00e1sa \u00e9rdek\u00e9ben.\\n/6/ A szem\u00e9lyes
  gondoskod\u00e1s ig\u00e9nybe v\u00e9tele \u00f6nk\u00e9ntes. Az ell\u00e1t\u00e1s
  az ig\u00e9nyl\u0131 vagy t\u00f6rv\u00e9nyes k\u00e9pvisel\u0131je k\u00e9relm\u00e9re
  t\u00f6rt\u00e9nik. A szem\u00e9lyes gondoskod\u00e1st ny\u00fajt\u00f3 ell\u00e1t\u00e1s
  ig\u00e9nybe v\u00e9tel\u00e9re ir\u00e1nyul\u00f3 k\u00e9relem a k\u00f6rjegyz\u0131s\u00e9gen
  terjeszthet\u0131 el\u0131. A d\u00f6nt\u00e9s a polg\u00e1rmester hat\u00e1sk\u00f6r\u00e9be
  tartozik. A szem\u00e9lyes gondoskod\u00e1st ny\u00fajt\u00f3 ell\u00e1t\u00e1s
  megkezd\u00e9se el\u0131tt az ell\u00e1t\u00e1sra jogosultat t\u00e1j\u00e9koztatni
  kell az ell\u00e1t\u00e1s tartalm\u00e1r\u00f3l, felt\u00e9teleir\u0131l \u00e9s
  az int\u00e9zm\u00e9ny \u00e1ltal vezetett r\u00e1 vonatkoz\u00f3 nyilv\u00e1ntart\u00e1sokr\u00f3l.\\n\\nx
  Hat\u00e1lyos 2004.m\u00e1rcius 1 napj\u00e1t\u00f3l.\\n\\n\u00c1pol\u00e1si d\u00edj\\n\\n10.\u00a7.\\n\\n/1/
  Az Sztv. 43/B  \u00a7.(1)bekezd\u00e9s\u00e9re figyelemmel \u00e1pol\u00e1si d\u00edjra
  jogosult az a szem\u00e9ly is, aki\\n\\na./ 18. \u00e9let\u00e9v\u00e9t bet\u00f6lt\u00f6tt,
  tart\u00f3san beteg  hozz\u00e1tartoz\u00f3ja \u00e1pol\u00e1s\u00e1t, gondoz\u00e1s\u00e1t
  v\u00e9gzi, felt\u00e9ve, hogy\\nb./ a gondoz\u00e1s m\u00e1s m\u00f3don nem oldhat\u00f3
  meg vagy a gondoz\u00e1s m\u00e1s m\u00f3dja az \u00f6nkorm\u00e1nyzat sz\u00e1m\u00e1ra
  nagyobb k\u00f6lts\u00e9get jelentene, \u00e9s\\n\\nc./ a gondozott \u00e1llapota
  miatt a gondoz\u00f3 keres\u0131tev\u00e9kenys\u00e9get nem folytathat.\\n\\nd./
  \u00e9s a k\u00e9relmez\u0131 csal\u00e1dj\u00e1ban az egy f\u0131re sz\u00e1m\u00edtott
  j\u00f6vedelem az \u00f6regs\u00e9gi nyugd\u00edj legkisebb \u00f6sszeg\u00e9t,
  egyed\u00fcl\u00e1ll\u00f3 eset\u00e9n annak 150 %-\u00e1t nem haladja meg.\\n/2/
  Amennyiben a 18. \u00e9let\u00e9vet bet\u00f6lt\u00f6tt , tart\u00f3san beteg szem\u00e9lynek
  nincs olyan \u2013 az \u00f6nkorm\u00e1nyzat illet\u00e9kess\u00e9gi ter\u00fclet\u00e9n
  lak\u00f3hellyel rendelkez\u0131 \u2013 hozz\u00e1tartoz\u00f3ja, aki a gondoz\u00e1st
  ell\u00e1thatn\u00e1, az \u00e1pol\u00e1si d\u00edj az \u00f6nkorm\u00e1nyzat illet\u00e9kess\u00e9gi
  ter\u00fclet\u00e9n tart\u00f3zkod\u00e1si hellyel rendelkez\u0131 szem\u00e9ly
  r\u00e9sz\u00e9re is meg\u00e1llap\u00edthat\u00f3.\\n/3/ Az /1/  bekezd\u00e9s
  szerinti \u00e1pol\u00e1si d\u00edj \u00f6sszege az \u00f6regs\u00e9gi nyugd\u00edj
  mindenkori legkisebb \u00f6sszeg\u00e9nek 80%-a.\\n/4/ Az \u00e1pol\u00e1si k\u00f6telezetts\u00e9g
  teljes\u00edt\u00e9s\u00e9t \u2013 f\u00fcggetlen\u00fcl att\u00f3l, hogy az \u00e1pol\u00e1si
  d\u00edj meg\u00e1llap\u00edt\u00e1s\u00e1ra milyen jogc\u00edmen ker\u00fclt sor
  \u2013 a k\u00e9pvisel\u0131test\u00fclet a h\u00e1zi seg\u00edts\u00e9gny\u00fajt\u00e1st
  biztos\u00edt\u00f3 \u00e1pol\u00f3 \u00fatj\u00e1n rendszeresen ellen\u0131rzi.\\n/5/
  A jogosults\u00e1g felt\u00e9teleinek fenn\u00e1ll\u00e1s\u00e1t k\u00e9t\u00e9vente
  fel\u00fclvizsg\u00e1lja a \u00d6nkorm\u00e1nyzat..\\n\\nHat\u00e1lyos 2006. janu\u00e1r
  1 napj\u00e1t\u00f3l /13/2005./XII.16./sz. rendelettel\\n\\nRendszeres szoci\u00e1lis
  seg\u00e9ly\\n\\n11.\u00a7.\\n\\n/1/ Hat\u00e1lyon k\u00edv\u00fcl helyezve 2003
  j\u00fanius 1 napj\u00e1t\u00f3l a 13/2005./XII.16./sz.rendelettel.\\n\\n/2/ Az
  \u00f6nkorm\u00e1nyzat a Sztv. 37/D.\u00a7./4/ bek. alapj\u00e1n a Baranya Megyei
  Munka\u00fcgyi K\u00f6zpont Sikl\u00f3si Kirendelts\u00e9g\u00e9vel egy\u00fcttm\u0151k\u00f6d\u00e9si
  meg\u00e1llapod\u00e1st k\u00f6t.\\n/3/ Akt\u00edvkor\u00fa nem foglalkoztatott
  szem\u00e9lyt a rendszeres szoci\u00e1lis seg\u00e9ly meg\u00e1llap\u00edt\u00e1s\u00e1nak
  felt\u00e9telek\u00e9nt egy\u00fcttm\u0151k\u00f6d\u00e9si k\u00f6telezetts\u00e9g
  terheli. Egy\u00fcttm\u0151k\u00f6dni k\u00f6teles az \u00f6nkorm\u00e1nyzattal,
  avagy az \u00f6nkorm\u00e1nyzat \u00e1ltal megjel\u00f6lt szervezettel, munka\u00fcgyi
  k\u00f6zponttal.\\n\\nAz egy\u00fcttm\u0151k\u00f6d\u00e9s tartalma\\n\\na./ A telep\u00fcl\u00e9si
  \u00f6nkorm\u00e1nyzatn\u00e1l nyilv\u00e1ntart\u00e1sba veteti mag\u00e1t.\\nb./
  A seg\u00e9lyez\u00e9sre val\u00f3 jogosults\u00e1g felt\u00e9teleinek vizsg\u00e1lat\u00e1n\u00e1l
  egy\u00fcttm\u0151k\u00f6dik.\\nc./ Az \u00f6nkorm\u00e1nyzat, illet\u0131leg a
  munka\u00fcgyi k\u00f6zpont kirendelts\u00e9ge \u00e1ltal felaj\u00e1nlott munk\u00e1t,
  amely a jogszab\u00e1ly \u00e9rtelm\u00e9ben sz\u00e1m\u00e1ra megfelel\u0131 elfogadja.\\nd./
  30 munkanapot d\u00edjaz\u00e1s ellen\u00e9ben ledolgozik k\u00f6zc\u00e9l\u00fa
  munk\u00e1ban. Az \u00f6nkorm\u00e1nyzat r\u00e9szmunkaid\u0131ben is foglalkoztathatja.\\ne./
  Az \u00f6nkorm\u00e1nyzat \u00e1ltal felaj\u00e1nlott munk\u00e1t 10 napon bel\u00fcl
  k\u00f6teles megkezdeni \u00e9s 30 munkanapot folyamatosan ledolgozni.\\nf./ R\u00e9szt
  vesz az \u00f6nkorm\u00e1nyzat \u00e1ltal szervezett programokon.\\ng./Az akt\u00edv
  kor\u00fa nem foglalkoztatott rendszeres seg\u00e9lyre jogosult a Baranya Megyei
  Munka\u00fcgyi K\u00f6zpont Sikl\u00f3s V\u00e1rosi Kirendelts\u00e9g\u00e9vel egy\u00fcttm\u0151k\u00f6d\u00e9si\\n\\nmeg\u00e1llapod\u00e1st
  k\u00f6teles k\u00f6tni.\\n\\n/4/ Azon akt\u00edv kor\u00fa nem foglalkoztatott
  szem\u00e9lynek, akinek a rendszeres szoci\u00e1lis seg\u00e9lyre val\u00f3 jogosults\u00e1g\u00e1t
  2000. \u00e1prilis 30-ig \u00e1llap\u00edtott\u00e1k meg, az \u00f6nkorm\u00e1nyzat
  elrendeli fel\u00fclvizsg\u00e1lat\u00e1t, egy\u00fcttm\u0151k\u00f6d\u00e9si k\u00f6telezetts\u00e9ge
  a fel\u00fclvizsg\u00e1lat id\u0131pontj\u00e1t\u00f3l \u00e1ll fenn.\\n/5/ Amennyiben
  az akt\u00edv kor\u00fa szoci\u00e1lis seg\u00e9lyben r\u00e9szes\u00fcl\u0131 a
  rendeletben szab\u00e1lyozott egy\u00fcttm\u0151k\u00f6d\u00e9si k\u00f6telezetts\u00e9g\u00e9nek
  nem tesz eleget \u00e9s ezt \u00f6nhib\u00e1j\u00e1n k\u00edv\u00fcli okk\u00e9nt
  hitelt \u00e9rdeml\u0131en nem tudja bizony\u00edtani, a seg\u00e9lyre val\u00f3
  jogosults\u00e1ga megsz\u0151nik.\\n\\nHat\u00e1lyos 2000.m\u00e1jus 31-t\u0131l\\n\\nRendszeres
  gyermekv\u00e9delmi t\u00e1mogat\u00e1s\\n\\n12.\u00a7.\\n\\nx Hat\u00e1ly\u00e1t
  vesztette 2004. m\u00e1jus 1 napj\u00e1t\u00f3l.\\n\\nRendk\u00edv\u00fcli gyermekv\u00e9delmi
  t\u00e1mogat\u00e1s\\n\\n13.\u00a7.\\n\\nx Hat\u00e1ly\u00e1t vesztette 2004. m\u00e1jus
  1 napj\u00e1t\u00f3l.\\n\\nLak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1s\\n\\n14.\u00a7.\\n\\n/1/
  A lak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1s c\u00e9lj\u00e1b\u00f3l r\u00e1szorult
  szem\u00e9lyeknek, csal\u00e1doknak, az \u00e1ltaluk lakott lak\u00e1s vagy nem
  lak\u00e1s c\u00e9lj\u00e1ra szolg\u00e1l\u00f3 helyis\u00e9g fenntart\u00e1s\u00e1val
  kapcsolatos rendszeres kiad\u00e1sok visel\u00e9s\u00e9hez ny\u00fajtott hozz\u00e1j\u00e1rul\u00e1s.\\n\\nA
  telep\u00fcl\u00e9si \u00f6nkorm\u00e1nyzat lak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1st
  ny\u00fajt: a./ A t\u00f6rv\u00e9nyben meghat\u00e1rozott felt\u00e9telek szerinti
  jogosultaknak a jogszab\u00e1lyokban meghat\u00e1rozott felt\u00e9telek mellett
  /normat\u00edv t\u00e1mogat\u00e1s/. b./ E rendeletben meghat\u00e1rozott felt\u00e9telek
  szerinti jogosultaknak /helyi lak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1s.\\n\\n/2/
  A lak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1s eset\u00e9ben elismert lak\u00e1s
  nagys\u00e1g:\\n\\na./ ha a h\u00e1ztart\u00e1sban egy szem\u00e9ly lakik 35 nm,\\nb./
  ha a h\u00e1ztart\u00e1sban k\u00e9t szem\u00e9ly lakik  45 nm,\\nc./ ha a h\u00e1ztart\u00e1sban
  h\u00e1rom szem\u00e9ly lakik 55 nm,\\nd./ ha a h\u00e1ztart\u00e1sban n\u00e9gy
  szem\u00e9ly lakik   65 nm,\\ne./ ha n\u00e9gy szem\u00e9lyn\u00e9l t\u00f6bb lakik
  a h\u00e1ztart\u00e1sban, a d./ pontban megjel\u00f6lt lak\u00e1snagys\u00e1g \u00e9s
  minden tov\u00e1bbi szem\u00e9ly ut\u00e1n 5-5 nm, de legfeljebb a jogosult \u00e1ltal
  lakott lak\u00e1s nagys\u00e1ga.\\n/3/ A helyi lak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1sra
  val\u00f3 jogosults\u00e1g felt\u00e9telei: A h\u00e1ztart\u00e1sban az egy f\u0131re
  sz\u00e1m\u00edtott havi j\u00f6vedelemhat\u00e1r a mindenkori \u00f6regs\u00e9gi
  nyugd\u00edjminimum 200 %-\u00e1t nem haladhatja meg.\\n\\n/4/ A lak\u00e1sfenntart\u00e1si
  t\u00e1mogat\u00e1s egyhavi m\u00e9rt\u00e9k\u00e9nek meghat\u00e1roz\u00e1sa:\\n\\na./
  A lak\u00e1sfenntart\u00e1s elismert havi k\u00f6lts\u00e9g\u00e9nek 20 %-a, de
  minimum 2.500.-Ft, ha a jogosult h\u00e1ztart\u00e1s\u00e1ban az egy f\u0131re jut\u00f3
  j\u00f6vedelem nem haladja meg az \u00f6regs\u00e9gi nyugd\u00edjminimum mindenkori
  legkisebb \u00f6sszeg\u00e9t.\\n\\nb./ lak\u00e1sfenntart\u00e1si t\u00e1mogat\u00e1s
  eset\u00e9ben a lak\u00e1sfenntart\u00e1s elismert havi k\u00f6lts\u00e9ge az elismert
  lak\u00e1snagys\u00e1g \u00e9s az 1 nm-re jut\u00f3 k\u00f6lts\u00e9g szorzata.\\n\\nAz
  1 nm-re jut\u00f3 elismert havi k\u00f6lts\u00e9g 2005. \u00e9vben 225.-Ft.\\n\\nx
  Hat\u00e1lyos 2005. janu\u00e1r 1. napj\u00e1t\u00f3l\\n\\n/5/ Ugyanazon lak\u00e1sra
  vonatkoz\u00f3 t\u00f6bb jogosults\u00e1g eset\u00e9n a t\u00e1mogat\u00e1st a t\u00e9nyleges
  haszn\u00e1l\u00f3nak kell meg\u00e1llap\u00edtani.\\n\\n/6/ A t\u00e1mogat\u00e1si
  k\u00e9relem \u00e9vente k\u00e9tszer ny\u00fajthat\u00f3 be.\\n\\nA lak\u00e1sfenntart\u00e1sra
  ny\u00fajtott t\u00e1mogat\u00e1s egy \u00e9vre \u00e1llap\u00edthat\u00f3 meg,
  k\u00e9tszeri kifizet\u00e9ssel: j\u00fanius 30. \u00e9s okt\u00f3ber 31.\\n\\n/7/
  Megsz\u0151nik a t\u00e1mogat\u00e1s a meg\u00e1llap\u00edtott id\u0131 eltelt\u00e9vel
  a t\u00e1mogat\u00e1sra okot ad\u00f3 k\u00f6r\u00fclm\u00e9ny megv\u00e1ltoztat\u00e1s\u00e1val.\\n\\n14.\u00a7.
  Hat\u00e1lyos 2005. j\u00falius 15 napj\u00e1t\u00f3l.\\n\\n15.\u00a7.\\n\\nE rendelet
  alkalmaz\u00e1sakor az ell\u00e1t\u00e1sok meg\u00e1llap\u00edt\u00e1s\u00e1n\u00e1l
  a szoci\u00e1lis t\u00f6rv\u00e9ny elj\u00e1r\u00e1si rendelkez\u00e9seit valamint
  a 2004. \u00e9vi CXL. t\u00f6rv\u00e9ny rendelkez\u00e9seit kell alkalmazni. x Hat\u00e1lyos
  2005.november 1.napj\u00e1t\u00f3l.\\n\\n16.\u00a7.\\n\\nA k\u00e9pvisel\u0131test\u00fclet
  jelen rendelete kihirdet\u00e9se napj\u00e1n l\u00e9p hat\u00e1lyba. Kihirdet\u00e9s\u00e9r\u0131l
  a k\u00f6rjegyz\u0131 gondoskodik.\\n\\n\u00d3cs\u00e1rd, 1993. m\u00e1jus 19.\\n\\nSzil\u00e1gyi
  Imre sk.                                                 dr.Gell\u00e9rtn\u00e9
  dr.Kugler Anna sk. polg\u00e1rmester                                                                        k\u00f6rjegyz\u0131\"",
  "\"Jegyz\u0151k\u00f6nyv\\n\\nK\u00e9sz\u00fclt: Kuncorba K\u00f6zs\u00e9g \u00d6nkorm\u00e1nyzata
