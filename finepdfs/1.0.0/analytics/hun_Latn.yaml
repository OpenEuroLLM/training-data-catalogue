  Legnagyobb v/c          | 0,60| 0,50| 0,45| 0,55| 0,50| 0,40   | 0,60   |\\n| Legkisebb
  szil\u00e1rds\u00e1gi jel | C25/30 | C30/37 | C34/45 | C30/37 | C30/37 | C40/50
