  \u00c9retts\u00e9gire el\u0151k\u00e9sz\u00edt\u0151, valamint egy\u00e9ni foglalkoz\u00e1sok
  tart\u00e1sa.\\n\\nT\u00e1rsadalomtudom\u00e1nyi tant\u00e1rgyak eset\u00e9ben:\\n\u2022
  A tanul\u00f3k \u00e9rdekl\u0151d\u00e9s\u00fcknek megfelel\u0151en tehets\u00e9ggondoz\u00f3
  szakk\u00f6r\u00f6k\u00f6n, fakult\u00e1ci\u00f3kon vehetnek r\u00e9szt.\\n\\n\u2022
  Indulnak az OKTV-n, Kazinczy-versenyen, illetve m\u00e1s iskolai (pl. vers- \u00e9s
  pr\u00f3zamond\u00f3, disputa) \u00e9s orsz\u00e1gos versenyeken (pl. r\u00e9szt
  vesznek II. R\u00e1k\u00f3czi Ferencr\u0151l sz\u00f3l\u00f3 vet\u00e9lked\u0151k\u00f6n).\\n\\n\u2022
  A k\u00f6nyvt\u00e1rban gy\u0171jt\u0151 \u00e9s feldolgoz\u00f3 feladatokat kapnak.\\n\\n\u2022
