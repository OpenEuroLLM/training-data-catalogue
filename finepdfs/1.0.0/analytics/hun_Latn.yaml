  Magyar R\u00e1di\u00f3 \u00c9nekkara\\n\\nsz\u00f3list\u00e1k:\\n\\nFelber Gabriella\\n\\nMester
  Vikt\u00f3ria\\n\\nWiedemann Bernadett\\n\\nMoln\u00e1r Levente\\n\\nFekete Attila\\n\\nKiss
  Tivadar\\n\\nvez\u00e9nyel: Medveczky \u00c1d\u00e1m\\n\\n\\\"Mindannyian a Mester
  tan\u00edtv\u00e1nyai vagyunk\\\" Kod\u00e1ly Zolt\u00e1nn\u00e9\\n\\nArs po\u00e9tik\u00e1nk
  Kod\u00e1ly Zolt\u00e1nt\u00f3l:\\n\\n\\\"A zene lelki t\u00e1pl\u00e1l\u00e9k \u00e9s
  semmi m\u00e1ssal nem p\u00f3tolhat\u00f3. Aki nem \u00e9l vele: lelki v\u00e9rszeg\u00e9nys\u00e9gben
  \u00e9l \u00e9s hal.\\\"\\n\\n\u201eMondd meg nekem, mit dalolsz, megmondom, ki
  vagy. A benn\u00fcnk tov\u00e1bbrezg\u0151 dallamok \u00e9s foszl\u00e1nyaik olyat
  vallanak fel\u0151l\u00fcnk, amit semmi l\u00e9lekelemz\u00e9s nem hoz felsz\u00ednre.
  Bevil\u00e1g\u00edtanak a l\u00e9lek rejtett zugaiba, ahova m\u00e1sk\u00e9pp nem
  f\u00e9rk\u0151zhet\u00fcnk.\\\"\\n\\n\u201eLehet \u00e9lni zene n\u00e9lk\u00fcl
  is. A sivatagon \u00e1t is vezet \u00fat. De mi (...) azt akarjuk, hogy az ember
  ne \u00fagy j\u00e1rja v\u00e9gig \u00e9lete \u00fatj\u00e1t, mintha sivatagon menne
  \u00e1t, hanem vir\u00e1gos r\u00e9teken.\\\"\\n\\n\\\"Kult\u00far\u00e1t nem lehet
  \u00f6r\u00f6k\u00f6lni. Az el\u0151d\u00f6k kult\u00far\u00e1ja egykett\u0151re
  elp\u00e1rolog, ha minden nemzed\u00e9k \u00fajra meg \u00fajra meg nem szerzi mag\u00e1nak.\\\"\\n\\n\\\"A
  zene az \u00e9letnek olyan sz\u00fcks\u00e9glete, mint a leveg\u0151. Sokan csak
  akkor veszik \u00e9szre, ha m\u00e1r nagyon hi\u00e1nyzik. \\\"\\n\\n\\\"Teljes
  lelki \u00e9let zene n\u00e9lk\u00fcl nincs. Vannak a l\u00e9leknek r\u00e9gi\u00f3i,
  melyekbe csak a zene vil\u00e1g\u00edt be.\\\"\\n\\n\u201eAz emberis\u00e9g boldogabb
  lesz, ha megtanul a zen\u00e9vel m\u00e9lt\u00f3k\u00e9ppen \u00e9lni.\\\"\\n\\n\\\"Mi
  teh\u00e1t a teend\u0151? Menn\u00e9l nagyobb t\u00f6megeket k\u00f6zvetlen \u00e9rintkez\u00e9sbe
  hozni igazi, \u00e9rt\u00e9kes zen\u00e9vel. Mi ennek ma a legj\u00e1rhat\u00f3bb
  \u00fatja? A kar\u00e9nekl\u00e9s.\\\"\\n\\n\\\"T\u00f6bbsz\u00f3lam\u00fa \u00e9nekl\u00e9s,
  s vele p\u00e1rhuzamosan fejl\u0151d\u0151 hall\u00f3- \u00e9s felfog\u00f3k\u00e9pess\u00e9g
  olyanok sz\u00e1m\u00e1ra is megnyitja a vil\u00e1girodalom remekeit, akik semmif\u00e9le
  hangszeren nem j\u00e1tszanak. S a m\u0171vek csak akkor t\u00f6lthetik be l\u00e9t\u00fck
  c\u00e9lj\u00e1t, ha milli\u00f3k lelk\u00e9ben keltenek visszhangot.\\\"\\n\\nA
  CSAPAT\\n\\nakik elk\u00f6telezettek a program megval\u00f3s\u00edt\u00e1s\u00e1\u00e9rt
