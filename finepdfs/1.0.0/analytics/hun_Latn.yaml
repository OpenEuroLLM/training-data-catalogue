  \u00fat 36., e-mail: email@example.com 3University of Debrecen H-4010 Debrecen,
  Egyetem t\u00e9r 1., e-mail: firstname.lastname@example.org\\n\\nKeywords: Coastal
  tourism, ski tourism, environmental impacts, climate change\\n\\nThis paper intends
  to give an overview on some future aspects of ski and coastal tourism, in the light
  of climate change and sustainability, based on literature available.\\n\\nSince
  the last third of the 20 th century, tourism and sport with their immense development
  have become two of the most requested free-time activities of citizens in the developed
  countries. Also, the conjuncture of the need for recreation, which can be considered
  as the basic and most popular motivation of travelling and sport, is undiminished
  too. According to the investigations carried out by the World Tourism Organization,
  most popular physical activities among recreational travels are skiing, snowboarding,
  climbing, touring, water sports and cycling.\\n\\nThe popularity of outdoor activities
  in certain fields may lead to the high concentration of participants regarding both
  time and space, resulting in significant development in infrastructure altering
  the environment and also causing an increased load of environment. Research of the
  impact of tourism and sport on the natural environment, in addition to these two
  sectors becoming multitudinous, is becoming more and more essential as nowadays
  outdoor, sport-orientated travels are gaining more and more grounds.\\n\\nDue to
  the expected consequences of global climate change, tourism faces several new challenges.
  Various impacts of climate change have the most effects on branches of tourism classified
  as mass tourism.\\n\\nAnalysis of the potential impacts of climate change tendencies
  and sport tourism on the relief of the Earth''s surface and living world (long-term
  and regular observation of plant and animal species and ecosystems) is a more and
  more important objective today. During this, it is necessary to have a comprehensive
  analysis and evaluation that would determine the orientations of the development
  of each branch of mass tourism for all potential climate change scenarios. Moreover,
  climate change influencing the alternative branches of tourism (e.g. wine tourism,
  water tourism, hunting tourism) should not be forgotten in the future.\"", "\"Mehmed
