  elnyer\u00e9s\u00e9t biztos\u00edtjuk egy-egy tanul\u00f3nk sz\u00e1m\u00e1ra.\\n\\n\u2022
  A tehets\u00e9ggondoz\u00e1sban fontos a Francia Int\u00e9zettel, a F\u0151v\u00e1rosi
