  hi\u00e1nyp\u00f3tl\u00e1s alkalmaz\u00e1sa.\\n\\n11. Az aj\u00e1nlathoz \u00e1razott
  k\u00f6lts\u00e9gvet\u00e9st kell csatolni, mely dokumentum a 322/2015. (X.30.)
