  % leveg\u0151t tartalmaz. Az id\u00e9zett k\u00f6vetelm\u00e9nyekb\u0151l n\u00e9h\u00e1nyat
  az 1. t\u00e1bl\u00e1zat mutat be.\\n\\n| K\u00f6rnyezeti oszt\u00e1ly jele | XC2
