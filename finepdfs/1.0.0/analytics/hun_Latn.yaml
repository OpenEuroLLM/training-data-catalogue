  Szolg\u00e1ltat\u00f3 \u00e9s Tan\u00e1csad\u00f3 Kft. (NEKSZT Kft.)\\n\\n5) Aj\u00e1nlatk\u00e9r\u0151
  nyomat\u00e9kosan felh\u00edvja a figyelmet arra, hogy az EKR haszn\u00e1lat\u00e1val,
  az aj\u00e1nlat elektronikus \u00f6ssze\u00e1ll\u00edt\u00e1s\u00e1val, tov\u00e1bb\u00e1
  az EKR rendszer haszn\u00e1latakor felmer\u00fcl\u0151 esetleges \u00fczemzavar
  \u00e9s/vagy \u00fczemsz\u00fcnet tekintet\u00e9ben felmer\u00fcl\u0151 b\u00e1rmely
  k\u00e9rd\u00e9s, \u00e9szrev\u00e9tel nem min\u0151s\u00fcl a Kbt. 56. \u00a7 szerinti
  kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1s k\u00e9r\u00e9snek. Aj\u00e1nlattev\u0151
  ezen k\u00e9rd\u00e9seket, \u00e9szrev\u00e9teleket k\u00f6zvetlen\u00fcl a NEKSZT
  Kft. fel\u00e9 jelentheti be. A NEKSZT Kft. honlapja a k\u00f6vetkez\u0151 c\u00edmen
  \u00e9rhet\u0151 el: http://nekszt.hu/.\\n\\n6) \u00dczemsz\u00fcnet: EKR rendelet
  22. \u00a7 (1) bekezd\u00e9se.\\n\\n7) \u00dczemzavar: EKR rendelet 22. \u00a7 (2)
  bekezd\u00e9se. Aj\u00e1nlatk\u00e9r\u0151 e k\u00f6rben felh\u00edvja a figyelmet
