  K\u0151r\u00f6s Endre, a Herendi Porcel\u00e1nm\u0171v\u00e9szeti M\u00fazeum Alap\u00edtv\u00e1ny
  kurat\u00f3rium\u00e1nak eln\u00f6ke,\\n\\nDr. Simon Attila, a Herendi Porcel\u00e1nmanufakt\u00fara
  Zrt. vez\u00e9rigazgat\u00f3ja\\n\\nMegnyitja: Vargha Tam\u00e1s \u00e1llamtitk\u00e1r\\n\\nMegtekinthet\u0151:
  2013. j\u00falius 31-ig, szerd\u00e1t\u00f3l vas\u00e1rnapig 10\u201318 \u00f3r\u00e1ig\\n\\nA
  nemzet t\u00f6rt\u00e9nelmi f\u0151v\u00e1ros\u00e1ban 2013 Szent Istv\u00e1n eml\u00e9k\u00e9r\u0151l
  sz\u00f3l. Sz\u00e9kesfeh\u00e9rv\u00e1r az egyik legnagyobb m\u00falt\u00fa magyar
  v\u00e1ros, hajdani kir\u00e1lyi sz\u00e9khely, a \u201eKir\u00e1lyok v\u00e1rosa\\\".
  T\u00f6bb mint 1000 \u00e9ve, 972-ben itt alak\u00edtotta ki uralkod\u00f3i sz\u00e9khely\u00e9t
  G\u00e9za fejedelem, Szent Istv\u00e1n pedig folytatta az \u00e9p\u00edt\u00e9st.
  Az eml\u00e9k\u00e9vhez kapcsol\u00f3d\u00f3an ker\u00fcl megrendez\u00e9sre a Herendi
  Porcel\u00e1nok tematikus, a t\u00e9m\u00e1hoz kapcsol\u00f3d\u00f3 t\u00e1rgyakat
  is felvonultat\u00f3 reprezentat\u00edv ki\u00e1ll\u00edt\u00e1sa. De term\u00e9szetesen
  nem hi\u00e1nyozhatnak Herend legismertebb, legsikeresebb darabjai, mint\u00e1i
  sem a ki\u00e1ll\u00edt\u00e1sr\u00f3l.\\n\\nA Herendi Porcel\u00e1nmanufakt\u00fara
  187 \u00e9ve a min\u0151s\u00e9g \u00e9s a sz\u00e9ps\u00e9g jelk\u00e9pe. 1826-os
  alap\u00edt\u00e1sa \u00f3ta cs\u00e1sz\u00e1rok, kir\u00e1lyok, az arisztokr\u00e1cia
  asztalainak \u00e9s szalonjainak m\u00e9lt\u00f3 d\u00edsze. A vil\u00e1gki\u00e1ll\u00edt\u00e1sokon
  rendre sikerrel szerepeltek a csillog\u00f3 herendi porcel\u00e1nok, s m\u00e1r
  1851-ben, Londonban, az els\u0151 vil\u00e1gki\u00e1ll\u00edt\u00e1son prominens
  megrendel\u00e9ssel t\u00e9rhetett haza Fischer M\u00f3r, a manufakt\u00fara akkori
  vezet\u0151je. Vikt\u00f3ria angol kir\u00e1lyn\u0151 a k\u00ednai eredet\u0171,
  herendi lepk\u00e9s, vir\u00e1gos mint\u00e1s \u00e9tk\u00e9szletb\u0151l rendelt,
  s ez a dekor\u00e1ci\u00f3, mint Vikt\u00f3ria-minta ismert ma is a vil\u00e1g minden
  szeglet\u00e9n.\\n\\nM\u00e1ra a vil\u00e1g legnagyobb porcel\u00e1nmanufakt\u00far\u00e1j\u00e1v\u00e1
  v\u00e1lt, a Magyar \u00d6r\u00f6ks\u00e9g, \u00e9s az Eur\u00f3pai Kultur\u00e1lis
  \u00d6r\u00f6ks\u00e9g r\u00e9sze. Hungarikum. K\u00f6zel k\u00e9t \u00e9vsz\u00e1zad
  alatt a siker kulcsa nem is lehetett m\u00e1s: \u00e1polni a hagyom\u00e1nyokat,
  tisztelni a nagy el\u0151d\u00f6k elhivatotts\u00e1g\u00e1t, elk\u00f6telezetten
  a min\u0151s\u00e9get \u00e9s a k\u00e9zi munk\u00e1t tartva szem el\u0151tt. A
  manufakt\u00far\u00e1ban a nyers porcel\u00e1nmassza els\u0151 \u00e9rint\u00e9s\u00e9t\u0151l
  a fest\u0151ecset utols\u00f3 sim\u00edt\u00e1s\u00e1ig minden munkaf\u00e1zis k\u00e9zzel,
  manufaktur\u00e1lis \u00faton t\u00f6rt\u00e9nik. \u00cdgy teremt\u0151dik \u00e9rt\u00e9k
  \u00e9s sz\u00e9ps\u00e9g Herenden.\\n\\nA kir\u00e1lyok porcel\u00e1nja k\u00f6zel
  k\u00e9t \u00e9vsz\u00e1zados t\u00f6rt\u00e9net\u00e9b\u0151l, elk\u00e9peszt\u0151
  term\u00e9kpalett\u00e1b\u00f3l v\u00e1logattunk, s a kiemelt darabokon t\u00fal,
  Herend az \u00fcnnepl\u0151 v\u00e1rosnak k\u00e9sz\u00edtett aj\u00e1nd\u00e9k\u00e1t
  is megtekinthetik a l\u00e1togat\u00f3k! Herend kultur\u00e1lis misszi\u00f3ja most
  az egykori koron\u00e1z\u00f3 v\u00e1rosban jelenik meg. K\u00f6sz\u00f6ntj\u00fck
  \u00d6n\u00f6ket Herend soksz\u00edn\u0171, var\u00e1zslatos, mindig meg\u00fajul\u00f3
  vil\u00e1g\u00e1ban.\\n\\nSZENT ISTV\u00c1N KIR\u00c1LY M\u00daZEUM\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r,
  Megyeh\u00e1z u. 17.\\n\\n\u201e\u2026\u00daJABB MEGLEPET\u00c9S\u2026 OLVAS\u00d3INK
  R\u00c9SZ\u00c9RE\\\" V. NEMZETK\u00d6ZI M\u0170V\u00c9SZK\u00d6NYV KI\u00c1LL\u00cdT\u00c1S\\n\\nA
  k\u00f6z\u00f6sen megrendezett ki\u00e1ll\u00edt\u00e1s m\u00e1sik helysz\u00edne:
  V\u00e1rosi K\u00e9pt\u00e1r \u2013 De\u00e1k Gy\u0171jtem\u00e9ny, Sz\u00e9kesfeh\u00e9rv\u00e1r,
  Oskola u. 10.\\n\\nMegnyit\u00f3program:\\n\\n2013. m\u00e1jus 18-\u00e1n, szombaton
  16 \u00f3rakor (Megyeh\u00e1z utca 17.)\\n\\nPerformance: Konrad Korabiewski (PL/DK/IS)
  multim\u00e9dia m\u0171v\u00e9sz\\n\\n2013. m\u00e1jus 18-\u00e1n, szombaton 17
  \u00f3rakor (Oskola u. 10.)\\n\\nK\u00f6sz\u00f6nt\u0151t mond: Dr. Cser-Palkovics
  Andr\u00e1s, Sz\u00e9kesfeh\u00e9rv\u00e1r Megyei Jog\u00fa V\u00e1ros polg\u00e1rmestere\\n\\nA
  ki\u00e1ll\u00edt\u00e1st megnyitja: Susanne Padberg (D) m\u0171v\u00e9szett\u00f6rt\u00e9n\u00e9sz\\n\\nMegtekinthet\u0151:
  2013. okt\u00f3ber 27-ig, h\u00e9tf\u0151 kiv\u00e9tel\u00e9vel naponta 10\u201318
  \u00f3r\u00e1ig\\n\\nA sz\u00e9kesfeh\u00e9rv\u00e1ri Szent Istv\u00e1n Kir\u00e1ly
  M\u00fazeum 1987-ben rendezte meg az I. Nemzetk\u00f6zi M\u0171v\u00e9szk\u00f6nyv
  Ki\u00e1ll\u00edt\u00e1st. Ezzel a m\u00fazeum olyan ter\u00fcletre l\u00e9pett,
  olyan ter\u00fcletet igyekezett felfedezni \u00e9s a k\u00f6z\u00f6ns\u00e9gnek
  bemutatni, amely vil\u00e1gszerte \u00e9vtizedek \u00f3ta az \u00e9rdekl\u0151d\u00e9s
  k\u00f6z\u00e9ppontj\u00e1ban \u00e1llt, Magyarorsz\u00e1gon azonban csak a 80-as
  \u00e9vek folyam\u00e1n indult fejl\u0151d\u00e9snek. A be\u00e9rkezett k\u00f6zel
  400 m\u0171v\u00e9szk\u00f6nyv kit\u0171n\u0151 \u00e1ttekint\u00e9st ny\u00fajtott
  a m\u0171fajr\u00f3l, megjelentek mindazok az \u00e1ramlatok, amelyek a m\u0171v\u00e9szk\u00f6nyv
  jelen\u00e9t meghat\u00e1rozt\u00e1k, de k\u00e9pet adtak a vil\u00e1gban jelenl\u00e9v\u0151
  m\u0171v\u00e9szeti-vizu\u00e1lis gondolatokr\u00f3l \u00e9s t\u00f6rekv\u00e9sekr\u0151l
  is. A ki\u00e1ll\u00edtott m\u0171vekb\u0151l a m\u0171v\u00e9szek 240 alkot\u00e1st
  aj\u00e1nd\u00e9koztak a m\u00fazeumunknak. \u00cdgy alakult ki az orsz\u00e1g els\u0151
  m\u00fazeumi m\u0171v\u00e9szk\u00f6nyv-gy\u0171jtem\u00e9nye.\\n\\nA sikeres els\u0151
  ki\u00e1ll\u00edt\u00e1st 1994-ben a II. Nemzetk\u00f6zi M\u0171v\u00e9szk\u00f6nyv
  Ki\u00e1ll\u00edt\u00e1s k\u00f6vette. A III. Nemzetk\u00f6zi M\u0171v\u00e9szk\u00f6nyv
  Ki\u00e1ll\u00edt\u00e1s megrendez\u00e9s\u00e9re 2000-ben ker\u00fclt sor, a Szent
  Istv\u00e1n Kir\u00e1ly M\u00fazeum \u00e9s a V\u00e1rosi K\u00e9pt\u00e1r\u2013De\u00e1k
  Gy\u0171jtem\u00e9ny k\u00f6z\u00f6s szervez\u00e9s\u00e9ben, a De\u00e1k K\u00e9pt\u00e1rban.
  A IV. Nemzetk\u00f6zi M\u0171v\u00e9szk\u00f6nyv Ki\u00e1ll\u00edt\u00e1st 2006-ban
  rendezt\u00fck meg, szint\u00e9n k\u00f6z\u00f6sen.\\n\\nA gy\u0171jtem\u00e9ny
  folyamatosan gyarapodik, jelenleg mintegy 1500 munk\u00e1t tartalmaz (k\u00f6r\u00fclbel\u00fcl
  60 magyar \u00e9s 500 k\u00fclf\u00f6ldi m\u0171v\u00e9sz alkot\u00e1s\u00e1t),
  melyeket f\u0151k\u00e9nt az alkot\u00f3k aj\u00e1nd\u00e9koztak a m\u00fazeumnak.\\n\\nEzek
  a k\u00e9pz\u0151m\u0171v\u00e9szeti alkot\u00e1sok k\u00fcl\u00f6nb\u00f6znek a
  hagyom\u00e1nyos k\u00f6nyvekt\u0151l, funkci\u00f3juk nem az olvas\u00e1s. M\u00edg
  a legt\u00f6bb ember egyet\u00e9rtene a k\u00f6nyv defin\u00edci\u00f3j\u00e1ban,
  neh\u00e9zs\u00e9gekbe \u00fctk\u00f6z\u00fcnk, ha a m\u0171v\u00e9szk\u00f6nyvet
  egyetlen, egyszer\u0171 \u00e1ll\u00edt\u00e1ssal szeretn\u00e9nk jellemezni. Ha
  m\u0171v\u00e9szk\u00f6nyvr\u0151l besz\u00e9l\u00fcnk, a k\u00f6nyvre vonatkoz\u00f3
  meghat\u00e1roz\u00e1s elveszti egy\u00e9rtelm\u0171s\u00e9g\u00e9t \u2013 ak\u00e1r
  a form\u00e1tumot, anyagot vagy a tartalm\u00e1t n\u00e9zz\u00fck: a m\u0171v\u00e9szk\u00f6nyv
  els\u0151sorban m\u0171alkot\u00e1s. A legv\u00e1ltozatosabb technik\u00e1kkal (m\u00e1sol\u00e1s,
  nyomtat\u00e1s, metsz\u00e9s, ragaszt\u00e1s, forraszt\u00e1s, varr\u00e1s), a legk\u00fcl\u00f6nf\u00e9l\u00e9bb
  anyagokb\u00f3l, eszk\u00f6z\u00f6kb\u0151l (fa, pap\u00edr, m\u0171anyag, r\u00e9z,
  \u00f3lom, v\u00e1szon, gipsz, textil) k\u00e9sz\u00fclnek. A m\u0171v\u00e9szk\u00f6nyvek
  b\u0151velkednek vizu\u00e1lis \u00f6tletekben \u00e9s tartalomban; sz\u00ednesek
  \u00e9s v\u00e1ltozatosak.\\n\\nCS\u00d3K ISTV\u00c1N K\u00c9PT\u00c1R\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r,
  Bart\u00f3k B\u00e9la t\u00e9r 1.\\n\\nMAGYAR-FRANCIA T\u00d6RT\u00c9NELMI KAPCSOLATOK.
  ABA-NOV\u00c1K VILMOS PANN\u00d3JA\\n\\nMegtekinthet\u0151: 2013. szeptember 29-ig
  h\u00e9tf\u0151n 13\u201318, keddt\u0151l p\u00e9ntekig 10\u201318, szombaton 10\u201315
  \u00f3r\u00e1ig\\n\\n\u201eNYITOTT M\u0170HELY\\\"\\n\\nM\u00fazeumi restaur\u00e1l\u00e1s,
  \u00e1llom\u00e1nyv\u00e9delem Veszpr\u00e9m megye k\u00f6zgy\u0171jtem\u00e9nyeiben\\n\\nMegnyit\u00f3:
  2013. m\u00e1jus 31-\u00e9n, p\u00e9nteken 16 \u00f3rakor\\n\\nMegnyitja: Czir\u00e1ki
  Veronika restaur\u00e1tor\\n\\nMegtekinthet\u0151: 2013. j\u00fanius 30-ig, h\u00e9tf\u0151n
  13\u201318, keddt\u0151l p\u00e9ntekig 10\u201318, szombaton 10\u201315 \u00f3r\u00e1ig\\n\\nGy\u0151r
  \u00e9s a hat\u00e1ron t\u00fali R\u00e9v-Kom\u00e1rom mellett Sz\u00e9kesfeh\u00e9rv\u00e1rra
  is ell\u00e1togat a Laczk\u00f3 Dezs\u0151 M\u00fazeum \u201erestaur\u00e1tor ki\u00e1ll\u00edt\u00e1sa\\\".\\n\\nTerm\u00e9szetesnek
  vessz\u00fck, hogy a m\u00fazeumokban l\u00e1that\u00f3 ki\u00e1ll\u00edt\u00e1sokon
  szemet gy\u00f6ny\u00f6rk\u00f6dtet\u0151 t\u00e1rgyak v\u00e1rj\u00e1k a l\u00e1togat\u00f3kat,
  \u00e1m abba m\u00e1r ritk\u00e1n gondolunk bele, hogy mennyi munka sz\u00fcks\u00e9ges
  egy-egy m\u0171t\u00e1rgy t\u00f6k\u00e9letes restaur\u00e1l\u00e1s\u00e1hoz. A
  ki\u00e1ll\u00edt\u00e1s bemutatja a restaur\u00e1l\u00e1s, a f\u00f6l\u00e9leszt\u00e9s,
  a helyre\u00e1ll\u00edt\u00e1s rendk\u00edv\u00fcli k\u00e9z\u00fcgyess\u00e9get
  \u00e9s szakmai tud\u00e1st ig\u00e9nyl\u0151 m\u00fazeumi tev\u00e9kenys\u00e9g\u00e9t.
  A restaur\u00e1tor feladata gondozni, fel\u00faj\u00edtani a r\u00e9g\u00e9szeti
  \u00e1sat\u00e1sok leleteit, a falun, v\u00e1roson gy\u0171jt\u00f6tt r\u00e9gi
  haszn\u00e1lati eszk\u00f6z\u00f6ket, dokumentumokat. Ker\u00e1mia, \u00fcveg, f\u00e9m,
  fa, textil, pap\u00edr, b\u0151r, k\u00e9pkeret egyar\u00e1nt megfordul a restaur\u00e1torok
  kezei k\u00f6z\u00f6tt, akik a szennyezett, s\u00e9r\u00fclt, t\u00f6red\u00e9kes
  t\u00e1rgyakat megtiszt\u00edtj\u00e1k, megszil\u00e1rd\u00edtj\u00e1k, tart\u00f3s\u00edtj\u00e1k,
  \u00e9s sz\u00fcks\u00e9g eset\u00e9n hitelesen kieg\u00e9sz\u00edtik.\\n\\nE titokzatos
  \u00e9s rejtelmes munk\u00e1t \u00e9s a tev\u00e9kenys\u00e9g eredm\u00e9nyeit t\u00e1rja
  az \u00e9rdekl\u0151d\u0151 nagyk\u00f6z\u00f6ns\u00e9g el\u00e9 az utaz\u00f3 t\u00e1rlat.
  A ki\u00e1ll\u00edt\u00e1s v\u00e1logatott t\u00e1rgyakkal \u00e9s r\u00e9szletfot\u00f3kat,
  m\u0171helymunk\u00e1kat bemutat\u00f3 tabl\u00f3k seg\u00edts\u00e9g\u00e9vel \u00e9rz\u00e9kelteti
  a m\u00fazeumban v\u00e9gzett restaur\u00e1tori munka soksz\u00edn\u0171s\u00e9g\u00e9t
  \u00e9s sz\u00ednvonal\u00e1t. A ki\u00e1ll\u00edt\u00e1s a Nemzeti Kultur\u00e1lis
  Alap K\u00f6zgy\u0171jtem\u00e9nyek Koll\u00e9giuma \u00e1ltal ki\u00edrt p\u00e1ly\u00e1zata
  r\u00e9v\u00e9n val\u00f3sul meg. A t\u00e1rlat 2013 j\u00fanius\u00e1ban fejezi
  be v\u00e1ndor\u00fatj\u00e1t Sz\u00e9kesfeh\u00e9rv\u00e1ron.\\n\\nFEKETE SAS PATIKAM\u00daZEUM\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r,
  F\u0151 u. 5.\\n\\nM\u00daLTAM EML\u00c9KEI 1938 \u00c9S 1988\\n\\nKamaraki\u00e1ll\u00edt\u00e1s
  az 1938-as \u00e9s 1988-as \u00fcnnepi \u00e9vek esem\u00e9nyeit meg\u00f6r\u00f6k\u00edt\u0151
  fot\u00f3kb\u00f3l\\n\\nMegtekinthet\u0151: 2013. \u00e1prilis 5 \u2013 j\u00fanius
  9-ig, keddt\u0151l p\u00e9ntekig 10\u201314 \u00f3r\u00e1ig, szombaton \u00e9s vas\u00e1rnap
  14\u201318 \u00f3r\u00e1ig\\n\\n\u201eP\u00c1ROK\\\" \u2013 P\u00e1ros \u00e9letk\u00e9pek
  a Szent Istv\u00e1n Kir\u00e1ly M\u00fazeum n\u00e9prajzi fot\u00f3arch\u00edvum\u00e1b\u00f3l\\n\\nMegtekinthet\u0151:
  2013. j\u00fanius 14 \u2013 j\u00falius 28-ig, keddt\u0151l p\u00e9ntekig 10\u201314
  \u00f3r\u00e1ig, szombaton \u00e9s vas\u00e1rnap 14\u201318 \u00f3r\u00e1ig\\n\\nSZENT
  ISTV\u00c1N KIR\u00c1LY M\u00daZEUM\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r, Orsz\u00e1gz\u00e1szl\u00f3
  t\u00e9r 3.\\n\\nOSZLOPSOR (ARRI\u00c8RE-GARDE)\\n\\nK\u0151nig Frigyes Munk\u00e1csy-d\u00edjas
  fest\u0151- \u00e9s grafikusm\u0171v\u00e9sz ki\u00e1ll\u00edt\u00e1sa\\n\\nMegtekinthet\u0151:
  2013. j\u00fanius 9-ig, szerd\u00e1t\u00f3l vas\u00e1rnapig 10\u201318 \u00f3r\u00e1ig\\n\\nK\u0151nig
  Frigyes m\u0171v\u00e9szi attit\u0171dj\u00e9re a tudom\u00e1nyos alap\u00fa vizsg\u00e1l\u00f3d\u00e1s,
  a kutat\u00e1s, a tapasztalaton alapul\u00f3 megismer\u00e9s, a k\u00eds\u00e9rletez\u00e9s
  jellemz\u0151. \u00c9vek \u00f3ta foglalkoztatja az egyik legelemibb, leg\u0151sibb
  \u00e9p\u00edt\u00e9szeti forma, az oszlop. Szavai szerint az oszlop maga a rend,
  a t\u00f6rv\u00e9ny, a stabilit\u00e1s, \u00e9s az ember nagyon szeretne ezek ment\u00e9n
  \u00e9lni. Amikor egy k\u00f6vet fel\u00e1ll\u00edtunk, az a gravit\u00e1ci\u00f3
  ellen van, az \u00e9p\u00edtkez\u00e9s ezzel a jelk\u00e9pes gesztussal indul. Nemcsak
  arr\u00f3l sz\u00f3l, hogy legy\u0151zt\u00fck a gravit\u00e1ci\u00f3t, hanem ez
  szimbolikusan egy kapocs a f\u00f6ld \u00e9s az \u00e9g k\u00f6z\u00f6tt.\\n\\n2011-ben
  kezdett foglalkozni a zadari Szent Don\u00e1t templommal, majd megismerkedett horv\u00e1t
  m\u0171v\u00e9szekkel, \u00e9s ennek eredm\u00e9nyek\u00e9nt Hvar sziget\u00e9n
  egy g\u00f6r\u00f6g ar\u00e1nyrendszer\u0171 oszlop ihlet\u00e9s\u00e9b\u0151l egy
  n\u00f6vekv\u0151, organikus szoborm\u0171 k\u00e9sz\u00fclt.\\n\\nA sz\u00e9kesfeh\u00e9rv\u00e1ri
  ki\u00e1ll\u00edt\u00e1son K\u0151nig Frigyes horv\u00e1torsz\u00e1gi, illetve adriai-tengeri
  vonatkoz\u00e1s\u00fa festm\u00e9nyei, plasztik\u00e1i \u00e9s grafik\u00e1i ker\u00fclnek
  bemutat\u00e1sra. L\u00e1that\u00f3ak lesznek a Hvar szigeti Jelsa v\u00e1ros\u00e1ban
  3 \u00e9ve foly\u00f3 ny\u00e1ri alkot\u00f3 munka sor\u00e1n k\u00e9sz\u00fclt
  alkot\u00e1sok, valamint a Jels\u00e1n fel\u00e1ll\u00edtand\u00f3 k\u0151szobor
  k\u00e9sz\u00edt\u00e9s\u00e9nek dokument\u00e1ci\u00f3ja is, \u00e9s a sorozat
  leg\u00fajabb darabjai is.\\n\\n\u201eN\u00e9h\u00e1ny \u00e9vvel ezel\u0151tt a
  zadari Szent Don\u00e1t-templom l\u00e1togat\u00e1sa sor\u00e1n lettem figyelmes
  arra, hogy az \u00e9p\u00fclet alapoz\u00e1s\u00e1hoz az \u00f3kori \u00e9p\u00fclet
  elemeit, illetve t\u00f6red\u00e9keit haszn\u00e1lt\u00e1k fel. J\u00f3l megfigyelhet\u0151ek
  voltak a faragott r\u00e9szletek \u00e9s a kannel\u00far\u00e1s oszlopt\u00f6red\u00e9kek.
  A IX. sz\u00e1zadban \u00e9p\u00fclt kereszt\u00e9ny templom a r\u00f3mai kori F\u00f3rum
  ter\u00fclet\u00e9n, az egykori bazilika maradv\u00e1nyainak felhaszn\u00e1l\u00e1s\u00e1val
  k\u00e9sz\u00fclt. Az egykori szakr\u00e1lis \u00e9p\u00fclet elemei egy \u00faj
  templom fundamentum\u00e1ul szolg\u00e1ltak. Ezek az oszlopok nem tartanak semmit,
  nem hordoznak neh\u00e9z terheket, a n\u00f6veked\u00e9s st\u00e1dium\u00e1ban vannak.
  Az \u00e9rtelem \u00e9s rendezetts\u00e9g oszlopai: ugyanazok, amelyek a vil\u00e1grend
  \u00e9s jogrend megjelen\u00edt\u0151ik\u00e9nt egykor t\u00f6rv\u00e9nyeket hordoztak
  \u00f6nmagukon, ugyanazok, amelyek Plat\u00f3nn\u00e1l a t\u00f6rv\u00e9ny \u00e9s
  a rend tart\u00f3pill\u00e9rei. Megegyeznek a J\u00f3b K\u00f6nyv\u00e9ben is eml\u00edtett
  \u00e9g oszlopaival, avagy a F\u00f6ld oszlopaival, amelyek m\u00e9g, ha inog is
  a F\u00f6ld, er\u0151sen tartj\u00e1k azt. A n\u00f6vekv\u0151 oszlopok a formatudatos
  gondolkod\u00e1sr\u00f3l sz\u00f3lnak, amely az eur\u00f3pai m\u0171v\u00e9szet
  egyik legfontosabb jellemz\u0151je.\\\" \u2013 \u00edrja K\u0151nig az Oszlopsor
  c\u00edm\u0171 sorozat\u00e1r\u00f3l.\\n\\nK\u00cdS\u00c9RLET \u2013 SOLT ANDR\u00c1S
  grafikusm\u0171v\u00e9sz ki\u00e1ll\u00edt\u00e1sa\\n\\nMegnyit\u00f3: 2013. j\u00fanius
  22-\u00e9n, szombaton 11.30 \u00f3rakor\\n\\nMegtekinthet\u0151: 2013. augusztus
  25-ig, szerd\u00e1t\u00f3l vas\u00e1rnapig 10\u201318 \u00f3r\u00e1ig\\n\\nSolt
  Andr\u00e1s grafikusm\u0171v\u00e9szk\u00e9nt \u2013 m\u00e1r a diplomamunk\u00e1j\u00e1ban
  \u00e9s k\u00e9s\u0151bbi grafikai sorozataiban is \u2013 a jelet, mint grafikai
  mot\u00edvumot, filoz\u00f3fiai kateg\u00f3ri\u00e1t \u00e9rtelmezi. K\u00e9pein
  sokr\u00e9t\u0171 tapasztalatk\u00e9nt vannak jelen a m\u00e1r hagyom\u00e1nny\u00e1
  v\u00e1lt metafizikusok, konstruktivist\u00e1k, sz\u00fcrrealist\u00e1k. De alkot\u00e1sai
  m\u00e9gsem egyszer\u0171 posztmodern kompoz\u00edci\u00f3k. Minden grafik\u00e1j\u00e1ban
  ott a f\u00e9ny, ez a legnehezebben form\u00e1ba \u00f6nthet\u0151 vizu\u00e1lis
  elem. A grafikusi jel\u00e9rtelmez\u00e9s saj\u00e1tos alkot\u00f3i megfogalmaz\u00e1s\u00e1\u00e9rt
  Solt Andr\u00e1s 2011-ben megkapta a Miskolci Grafikai Trienn\u00e1l\u00e9 Miniszt\u00e9riumi
  d\u00edj\u00e1t.\\n\\nA sz\u00e9kesfeh\u00e9rv\u00e1ri ki\u00e1ll\u00edt\u00e1sa
  a kor\u00e1bbi \u00e9vekben elkezdett alkot\u00f3i folyamat legteljesebb \u00f6sszefoglal\u00f3ja,
  a m\u00e1r megfogalmazott alkot\u00f3i t\u00f6rekv\u00e9seit folytatja, gondolja
  tov\u00e1bb. K\u00e9peinek f\u0151 tartalmi probl\u00e9m\u00e1ja: a jel \u00e9s
  jel-n\u00e9lk\u00fclis\u00e9g, a sz\u00edn-sz\u00edntelens\u00e9g, a forma-formahi\u00e1ny,
  az \u201e\u00e9p\u00edtett\\\" t\u00f6megek, illetve azok hi\u00e1nya.\\n\\nGrafik\u00e1i
  formai szempontb\u00f3l egy perspektivikusan \u00e1br\u00e1zolt, ablakszer\u0171
  ny\u00edl\u00e1sra \u00e9p\u00edtenek. A kompoz\u00edci\u00f3k ki- \u00e9s betekint\u00e9st
  engednek, megmutatnak dolgokat \u00e9s gondolatokat, egy megfigyel\u0151 szempontj\u00e1b\u00f3l
  jelen\u00edtik meg az esem\u00e9nyeket. Ez a megfigyel\u0151 lehet maga a m\u0171v\u00e9sz,
  de a megfigyel\u00e9si \u00e9s \u00e9rtelmez\u00e9si folyamatnak akt\u00edv r\u00e9szese
  a n\u00e9z\u0151 is. L\u00e1thatjuk az esem\u00e9nyek h\u00f6mp\u00f6lyg\u00e9s\u00e9t,
  l\u00e1thatjuk saj\u00e1t d\u00f6nt\u00e9seink eredm\u00e9ny\u00e9t. Az ablakny\u00edl\u00e1s
  mot\u00edvuma k\u00f6ti \u00f6ssze a k\u00e9peket. Az ablak hol \u00f6sszek\u00f6t,
  hol sz\u00e9tv\u00e1laszt, hol ki- \u00e9s betekint\u00e9st enged, hol kivet\u00fcl\u00e9st
  eredm\u00e9nyez.\\n\\nA feh\u00e9rv\u00e1ri ki\u00e1ll\u00edt\u00e1s c\u00edme els\u0151sorban
  tartalmi, koncepci\u00f3beli elemekre utal, m\u00e1sodsorban pedig a technikai kivitelez\u00e9sre.
  Rendk\u00edv\u00fcl szubjekt\u00edv sorozat, mindamellett, hogy a megfigyel\u00e9s,
  a k\u00eds\u00e9rletez\u00e9s elengedhetetlen\u00fcl a t\u00e1rgyilagoss\u00e1g\u00e1r\u00f3l
  sz\u00f3l. Az \u00faj grafikai sorozat err\u0151l a feloldhatatlan ellent\u00e9tr\u0151l
  \u2013 d\u00f6nt\u00e9sk\u00e9ptelens\u00e9g k\u00f6vetkezt\u00e9ben a bizonytalans\u00e1gb\u00f3l
  kivezet\u0151 utak lehet\u0151s\u00e9g\u00e9r\u0151l, a magabiztoss\u00e1g megtal\u00e1l\u00e1s\u00e1r\u00f3l,
  a bizonytalans\u00e1g megsz\u00fcntet\u00e9s\u00e9r\u0151l \u2013 sz\u00f3l.\\n\\nTechnikai
  szempontb\u00f3l t\u00f6bb grafikai blokk j\u00f6n l\u00e9tre. A technikai k\u00eds\u00e9rletez\u00e9s
  fontos r\u00e9sz\u00e9t k\u00e9pezi a sorozatnak. A cianot\u00edpia grafikai elemk\u00e9nt
  val\u00f3 felhaszn\u00e1l\u00e1sa, a f\u00e9nym\u00e1solatok, a computer \u00e1ltal
  m\u00f3dos\u00edtott elemek beemel\u00e9se \u00faj ir\u00e1nyokat mutatnak Solt
  Andr\u00e1s sz\u00e1m\u00e1ra. Az a t\u00e9ny, hogy a hagyom\u00e1nyos sokszoros\u00edt\u00f3
  grafikai elj\u00e1r\u00e1sokat \u2013 mint pl. hidegt\u0171, alum\u00edniummarat\u00e1s,
  szitanyomat \u2013 siker\u00fclt szerves eg\u00e9ssz\u00e9 form\u00e1lnia a nem
  hagyom\u00e1nyos technik\u00e1kkal, tov\u00e1bbi motiv\u00e1ci\u00f3t \u00e9s inspir\u00e1ci\u00f3t
  adnak a m\u0171v\u00e9sznek.\\n\\nRENDEZV\u00c9NY\\n\\nSZENT ISTV\u00c1N KIR\u00c1LY
  M\u00daZEUM\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r, Orsz\u00e1gz\u00e1szl\u00f3 t\u00e9r
  3.\\n\\nEl\u0151ad\u00e1s\\n\\nKIS MAGYAR N\u00c9PRAJZ A M\u00daZEUMBAN sorozat\\n\\n2013.
  m\u00e1jus 29-\u00e9n, szerd\u00e1n 16.30 \u00f3rakor\\n\\n\u201eSokf\u00e9le az
  ember\u2026\\\" \u2013 Moldvai cs\u00e1ng\u00f3 n\u00e9prajzi \u00e1ttekint\u00e9s
  El\u0151ad\u00f3: Haraszti Zsigmond n\u00e9prajzkutat\u00f3\\n\\nM\u00fazeumi alkot\u00f3
  napok\\n\\n\u201eA P\u00dcNK\u00d6SDNEK JELES NAPJ\u00c1N\u2026\\\" \u2013 p\u00fcnk\u00f6sdi
  csal\u00e1di d\u00e9lel\u0151tt\\n\\n2013. m\u00e1jus 20-\u00e1n, h\u00e9tf\u0151n
  10\u201313 \u00f3r\u00e1ig\\n\\nProgramok:\\n\\n- Te is lehetsz p\u00fcnk\u00f6sdi
  kir\u00e1ly! \u2013 \u00fcgyess\u00e9gi j\u00e1t\u00e9kok\\n- K\u00e9zm\u0171ves
  foglalkoz\u00e1sok \u2013 koszor\u00fafon\u00e1s, vir\u00e1gok k\u00e9sz\u00edt\u00e9se
  term\u00e9szetes anyagokb\u00f3l\\n- T\u00e1rlatvezet\u00e9sek a T\u00e1rgyalkot\u00f3
  hagyom\u00e1ny c\u00edm\u0171 \u00e1lland\u00f3 n\u00e9prajzi ki\u00e1ll\u00edt\u00e1sban
  \u00e9s a Marosi Arnold M\u00fazeumi K\u00f6nyv \u00e9s R\u00e9gis\u00e9g L\u00e1tv\u00e1nyt\u00e1rban\\n\\nR\u00e9szv\u00e9teli
  d\u00edj: 600 Ft/f\u0151\\n\\nK\u00f6nyvbemutat\u00f3\\n\\n2013. j\u00fanius 12-\u00e9n,
  szerd\u00e1n 16.30 \u00f3rakor K\u00e1liz Sajtos J\u00f3zsef: \u201e\u00c9kes p\u00e1rt\u00e1k,
  leesni \u00e1h\u00edt\u00f3k.\\\" A k\u00e1rp\u00e1t-medencei lakodalmi \u00e9s
  szerelmi versek \u00f6sszef\u00fcgg\u00e9sei s kapcsolatuk a r\u00e9gi magyar k\u00f6zk\u00f6lt\u00e9szettel
  c\u00edm\u0171 k\u00f6nyv\u00e9t bemutatja dr. Luk\u00e1cs L\u00e1szl\u00f3 n\u00e9prajzkutat\u00f3.\\n\\nFEKETE
  SAS PATIKAM\u00daZEUM\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r, F\u0151 u. 5.\\n\\nM\u00fazeumi
  alkot\u00f3 napok\\n\\n\u201eA FEKETE SAS TITKAI\\\" \u2013 interakt\u00edv m\u00fazeumi
  d\u00e9lut\u00e1n csal\u00e1dok sz\u00e1m\u00e1ra\\n\\n2013. j\u00fanius 2-\u00e1n,
  szombaton 14\u201318 \u00f3r\u00e1ig\\n\\nMi\u00e9rt \u00e9ppen Fekete Sas lett
  a patika neve? Mi mindent \u00e1rultak hajdan a patik\u00e1ban? Milyen sz\u00edn\u0171
  a kamilla olaja, \u00e9s mire haszn\u00e1lt\u00e1k a cukrot a gy\u00f3gyszer\u00e9szek?
  Eff\u00e9le k\u00e9rd\u00e9sekre keress\u00fck a v\u00e1laszokat, mik\u00f6zben
  megismerked\u00fcnk a patikusmesters\u00e9g r\u00e9gi m\u00f3dszereivel. Feladatlap
  seg\u00edts\u00e9g\u00e9vel kutatjuk az officina \u00e9s a gy\u00f3gyn\u00f6v\u00e9nyek
  titkait, interakt\u00edv m\u00f3don szerz\u00fcnk ismereteket. Megszagolunk, megk\u00f3stolunk
  k\u00fcl\u00f6nf\u00e9le alapanyagokat, kipr\u00f3b\u00e1ljuk a mozsaraz\u00e1st.
  Bepillantunk a patika laborat\u00f3rium\u00e1ba, ahol egykor a \u201ecsodaszerek\\\"
  k\u00e9sz\u00fcltek.\\n\\nR\u00e9szv\u00e9teli d\u00edj: 600 Ft/f\u0151\\n\\nPATIKANAP\\n\\n2013.
  j\u00fanius 6-\u00e1n, cs\u00fct\u00f6rt\u00f6k\u00f6n 10\u201318 \u00f3r\u00e1ig\\n\\n10\u201312.30
  \u00f3r\u00e1ig \u2013 Patikus leszek \u2013 M\u00fazeumi foglalkoz\u00e1sok gyerekcsoportok
  sz\u00e1m\u00e1ra Ismerked\u00e9s a patikus szakm\u00e1val, gy\u00f3gyn\u00f6v\u00e9ny
  gy\u0171jtem\u00e9ny \u00e9s patikat\u00e9gely k\u00e9sz\u00edt\u00e9se.\\n\\n12.30\u201314
  \u00f3r\u00e1ig \u2013 A mi csodapatik\u00e1nk: interakt\u00edv t\u00e1rlatvezet\u00e9s
  a patika t\u00f6rt\u00e9net\u00e9nek bemutat\u00e1s\u00e1val 14\u201316 \u00f3r\u00e1ig
  \u2013 Gy\u00f3gy\u00edt\u00f3 \u00e1sv\u00e1nyok \u2013 Bevezet\u00e9s az \u00e1sv\u00e1nygy\u00f3gy\u00e1szat
  rejtelmeibe, mozsaraz\u00e1s kipr\u00f3b\u00e1l\u00e1sa\\n\\n16 \u00f3r\u00e1t\u00f3l
  \u2013 \u201eCsod\u00e1s patikaszerek\\\" \u2013 Interakt\u00edv j\u00e1tsz\u00f3h\u00e1z:
  pilulak\u00e9sz\u00edt\u00e9s, ismerked\u00e9s illatszerekkel, csodanekt\u00e1r
  k\u00f3stol\u00e1s, k\u00f6z\u00f6s rejtv\u00e9nyfejt\u00e9s \u00e9s egy\u00e9b
  rejtelmek\\n\\nA programokra a bel\u00e9p\u00e9s ingyenes!\\n\\nSZENT ISTV\u00c1N
  KIR\u00c1LY M\u00daZEUM \u2013 RENDH\u00c1Z\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r,
  F\u0151 u. 6.\\n\\nEl\u0151ad\u00e1s\\n\\n140 \u00c9VES A SZENT ISTV\u00c1N KIR\u00c1LY
  M\u00daZEUM sorozat\\n\\n2013. m\u00e1jus 15-\u00e9n, szerd\u00e1n 16 30 \u00f3rakor\\n\\nMarosi
  Arnold Szent Istv\u00e1nnal kapcsolatos kutat\u00e1sai\\n\\nEl\u0151ad\u00f3: N\u00e1dorfi
  Gabriella r\u00e9g\u00e9sz\\n\\nA f\u0151 utc\u00e1n foly\u00f3 munk\u00e1latok
  miatt az el\u0151ad\u00e1st az Orsz\u00e1gz\u00e1szl\u00f3 t\u00e9r 3. sz. alatti
  \u00e9p\u00fclet\u00fcnkben tartjuk meg!\\n\\nHIST\u00d3RIA sorozat\\n\\n2013. j\u00fanius
  5-\u00e9n, szerd\u00e1n 16.30 \u00f3rakor Az 1988-as Szent Istv\u00e1n \u00fcnneps\u00e9gek
  Sz\u00e9kesfeh\u00e9rv\u00e1ron El\u0151ad\u00f3: Hars\u00e1nyi L\u00e1szl\u00f3n\u00e9\\n\\nK\u00f6nyvbemutat\u00f3\\n\\n2013.
  j\u00fanius 10-\u00e9n, h\u00e9tf\u0151n 16.30 \u00f3rakor\\n\\nLuk\u00e1cs L\u00e1szl\u00f3
  n\u00e9prajzkutat\u00f3, egyetemi tan\u00e1r besz\u00e9l n\u00e9prajzi k\u00f6nyvtril\u00f3gi\u00e1j\u00e1r\u00f3l:\\n\\n-
  S\u00e1rf\u0151t\u0151l Mez\u0151f\u00f6ldig. T\u00e1j- \u00e9s n\u00e9pkutat\u00e1s
  Fej\u00e9r megy\u00e9ben (2009)\\n- N\u00e9prajzi l\u00e1t\u00e1sm\u00f3d az ezredfordul\u00f3n
  (2011)\\n- T\u00e1rgyak, \u00e9letform\u00e1k, n\u00e9pszok\u00e1sok. Tematikus
  n\u00e9prajzi tanulm\u00e1nyok (2012)\\n\\nMindh\u00e1rom k\u00f6tet a k\u00f6nyvbemutat\u00f3n
  kedvezm\u00e9nyesen megv\u00e1s\u00e1rolhat\u00f3.\\n\\nM\u00daZEUMOK \u00c9JSZAK\u00c1JA
  \u2013 2013. j\u00fanius 22-\u00e9n, szombaton\\n\\nSZENT ISTV\u00c1N KIR\u00c1LY
  M\u00daZEUM\\n\\nSz\u00e9kesfeh\u00e9rv\u00e1r, Orsz\u00e1gz\u00e1szl\u00f3 t\u00e9r
  3.\\n\\n\u201eA JUHAIT KERES\u0150 P\u00c1SZTOR\\\" LEGEND\u00c1JA\\n\\n16\u201320
  \u00f3r\u00e1ig: \u201eSz\u0151r\u0151st\u00fcl-b\u0151r\u0151st\u00fcl\u201d \u2013
  nemez- \u00e9s b\u0151rt\u00e1rgyak k\u00e9sz\u00edt\u00e9se\\n\\n17, 19 \u00e9s
  21 \u00f3r\u00e1t\u00f3l: T\u00e1rlatvezet\u00e9sek az \u00e1lland\u00f3 ki\u00e1ll\u00edt\u00e1sokban\\n\\n17
