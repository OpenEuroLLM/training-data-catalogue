  2360 | 2380 | 2410   | 2340   |\\n| Sz\u00e1raz tests\u0171r\u0171s\u00e9g, kg/m\u00b3
  | 2220 | 2230 | 2300 | 2240 | 2270 | 2320   | 2200   |\\n\\n1. t\u00e1bl\u00e1zat
  N\u00e9h\u00e1ny k\u00f6vetelm\u00e9ny\u00e9rt\u00e9k az MSZ 4798-1 szerinti k\u00fcl\u00f6nb\u00f6z\u0151
  kit\u00e9ti oszt\u00e1lyok eset\u00e9n\\n\\nA beton aj\u00e1nlott kever\u00e9si
  ar\u00e1ny\u00e1n k\u00edv\u00fcl (v\u00edz/cement t\u00e9nyez\u0151, adal\u00e9kanyag:
  cement ar\u00e1ny) ismerni kell a bet\u00f6m\u00f6rt\u00edttet friss beton \u00e9s
  a szil\u00e1rd, sz\u00e1raz beton sz\u00fcks\u00e9ges tests\u0171r\u0171s\u00e9g\u00e9t,
  mert az egy\u00e9bk\u00e9nt j\u00f3l megtervezett betonkever\u00e9k a k\u00f6vetelm\u00e9nyek
  teljes\u00edt\u00e9s\u00e9nek csak a lehet\u0151s\u00e9get adja meg. Hogy a lehet\u0151s\u00e9g
  val\u00f3ra v\u00e1lj\u00e9k, a kever\u00e9ket megfelel\u0151 tests\u0171r\u0171s\u00e9gre
  kell bedolgozni. A t\u00f6m\u00f6rts\u00e9g megfelel\u0151s\u00e9g\u00e9t a tests\u0171r\u0171s\u00e9g
  ismeret\u00e9ben lehet eld\u00f6nteni.\\n\\nAz MSZ 4798-1 szabv\u00e1ny F.1. \u00e9s
  F.2. t\u00e1bl\u00e1zat\u00e1ban megadott tests\u0171r\u0171s\u00e9g-k\u00f6vetelm\u00e9nyek
  teh\u00e1t sz\u00fcks\u00e9gesek, azonban nem el\u00e9gs\u00e9gesek, illetve nem
  szabatosak. A k\u00f6vetkez\u0151kben ezt elemzem.\\n\\n2. A bedolgozott friss beton
  \u00e9s a sz\u00e1raz beton tests\u0171r\u0171s\u00e9ge\\n\\nA bedolgozott friss
  beton tests\u0171r\u0171s\u00e9g\u00e9t a beton \u00f6sszet\u00e9teleb\u0151l lehet
  kisz\u00e1m\u00edtani. Az MSZ 4798-1 szabv\u00e1ny F.1. \u00e9s F.2. t\u00e1bl\u00e1zat\u00e1nak
  az adat\u00e1b\u00f3l a sz\u00e1m\u00edt\u00e1s az al\u00e1bbiak szerinti:\\n\\n\\\\[
  V_c = \\\\frac{m_c}{\\\\rho_c} \\\\]  \\\\hspace{1cm} (1)\\n\\nahol\\n\\n\\\\[ V_c
  = \\\\text{a cement t\u00f6m\u00f6r t\u00e9rfogata, liter/m}^3, \\\\]\\n\\\\[ m_c
  = \\\\text{a cementtartalom, kg/m}^3, \\\\]\\n\\\\[ \\\\rho_c = \\\\text{a cement
  s\u0171r\u0171s\u00e9ge, g/cm}^3. \\\\]\\n\\nA v\u00edz t\u00e9rfogata literben
  azonos a kg-ban kifejezett t\u00f6meg\u00e9vel. Ez az \u00e9rt\u00e9k a v\u00edz/cement
  t\u00e9nyez\u0151 ismeret\u00e9ben sz\u00e1m\u00edthat\u00f3:\\n\\n\\\\[ V_v = x
  \\\\cdot m_c \\\\]  \\\\hspace{1cm} (2)\\n\\nahol\\n\\n\\\\[ V_v = \\\\text{a v\u00edz
  t\u00e9rfogata, liter/m}^3, \\\\]\\n\\\\[ x = \\\\text{a v\u00edz/cement t\u00e9nyez\u0151}.
  \\\\]\\n\\nA t\u00f6m\u00f6r, friss beton \\\\( V_a \\\\) adal\u00e9kanyagtartalma
  (liter/m\u00b3):\\n\\n\\\\[ V_a = 1000 - (V_c + V_v) \\\\]  \\\\hspace{1cm} (3)\\n\\nA
  \\\\( V_a \\\\) t\u00e9rfogat\u00fa adal\u00e9kanyag ma (kg/m\u00b3) t\u00f6mege,
  ha az adal\u00e9kanyag s\u0171r\u0171s\u00e9ge a (g/cm\u00b3):\\n\\n\\\\[ m_a =
  V_a \\\\cdot \\\\rho_a \\\\]  \\\\hspace{1cm} (4)\\n\\nA leveg\u0151mentes t\u00f6m\u00f6r
  friss beton \\\\( \\\\gamma_f \\\\) (kg/m\u00b3) tests\u0171r\u0171s\u00e9ge:\\n\\n\\\\[
  \\\\gamma_f = \\\\frac{m_c + m_a}{V_a} \\\\]  \\\\hspace{1cm} (5)\\n\\nP\u00e9ldak\u00e9ppen
  vizsg\u00e1ljuk meg az 1. t\u00e1bl\u00e1zat B3 kit\u00e9ti oszt\u00e1lyhoz tartoz\u00f3
  el\u0151\u00edrt betonj\u00e1nak tests\u0171r\u0171s\u00e9g\u00e9t friss \u00e1llapotban.
  A sz\u00e1m\u00edt\u00e1sokhoz \u00e1ltal\u00e1ban fel lehet t\u00e9telezni a cementre
  \\\\( \\\\rho_c = 3,1 \\\\text{ g/cm}^3 \\\\) \u00e9s a homokos kavics adal\u00e9kanyagra
  \\\\( \\\\rho_a = 2,64 \\\\text{ g/cm}^3 \\\\) s\u0171r\u0171s\u00e9get. Ebb\u0151l
  k\u00f6vetkez\u0151en a cement t\u00e9rfogata az (1) k\u00e9pletb\u0151l: \\\\(
  V_c = \\\\frac{320}{3,1} = 103,2 \\\\text{ liter/m}^3 \\\\), a v\u00edz t\u00e9rfogata
  a (2) alapj\u00e1n: \\\\( V_v = 320 \\\\cdot 0,45 = 144 \\\\text{ liter/m}^3 \\\\),
  az adal\u00e9kanyag t\u00e9rfogata a (3) alapj\u00e1n: \\\\( V_a = 1000 - (103,2
  + 144) = 752,8 \\\\text{ liter/m}^3 \\\\), t\u00f6mege pedig a (4) alapj\u00e1n:
  \\\\( m_a = 752,8 \\\\cdot 2,64 = 1987 \\\\text{ kg/m}^3 \\\\). Ezekb\u0151l az
  adatokb\u00f3l az (5) alapj\u00e1n a leveg\u0151mentes t\u00f6m\u00f6r friss beton
  tests\u0171r\u0171s\u00e9ge: \\\\( \\\\gamma_f = \\\\frac{320 + 144 + 1987}{752,8}
  = 2451 \\\\text{ kg/m}^3 \\\\).\\n\\nAz MSZ 4798-1 F.1. \u00e9s F.2. t\u00e1bl\u00e1zata
  2 % leveg\u0151tartalm\u00fa betonok v\u00e1rhat\u00f3 tests\u0171r\u0171s\u00e9g\u00e9t
  adja meg, ez\u00e9rt a sz\u00e1m\u00edt\u00e1ssal kapott tests\u0171r\u0171s\u00e9get
  kb. 0,98-cal kell szorozni, \u00edgy a tests\u0171r\u0171s\u00e9g k\u00f6vetelm\u00e9ny
  2451 \\\\cdot 0,98 = 2402 \\\\sim 2400 \\\\text{ kg/m}^3. Az egy h\u00f3napos kor\u00fa
  beton tests\u0171r\u0171s\u00e9ge sz\u00e1raz \u00e1llapotban a friss beton tests\u0171r\u0171s\u00e9gehez
  k\u00e9pest cs\u00f6kken. A cement a kever\u0151v\u00edz egy r\u00e9sz\u00e9t k\u00e9mialag
  lek\u00f6ti, a v\u00edz t\u00f6bbi r\u00e9sze elp\u00e1rolog. \u00c1ltal\u00e1ban
  felt\u00e9telezhet\u0151, hogy 1 h\u00f3napos korban a cement a v\u00edzb\u0151l
  t\u00f6meg\u00e9nek 15%-\u00e1t k\u00f6ti meg. Az B3 kit\u00e9ti oszt\u00e1ly betonj\u00e1nak
  bemutatott p\u00e9ld\u00e1ja eset\u00e9n a lek\u00f6tt v\u00edz 320 \\\\cdot 0,15
  = 48 \\\\text{ kg/m}^3, ez\u00e9rt az elp\u00e1rolg\u00f3 v\u00edz mennyis\u00e9ge
  144 - 48 = 96 \\\\text{ kg/m}^3, teh\u00e1t a sz\u00e1raz beton tests\u0171r\u0171s\u00e9ge
  ~2300 \\\\text{ kg/m}^3.\\n\\nA bemutatott sz\u00e1m\u00edt\u00e1si elj\u00e1r\u00e1s
  k\u00f6z\u00e9lt\u00e9s, mert a cement s\u0171r\u0171s\u00e9ge 3,0-3,2 g/cm\u00b3
  k\u00f6z\u00f6tt v\u00e1ltozhat (CEM 32,5 portlandcementre kb. 3,1, heterog\u00e9n
  cementekre < 3,1, szulf\u00e1t\u00e1ll\u00f3 cementre > 3,1), a homokos kavics s\u0171r\u0171s\u00e9ge
  2,65 g/cm\u00b3 is lehet. Sz\u00e9ls\u0151 esetben teh\u00e1t a fent bemutatott
  sz\u00e1m\u00edt\u00e1s v\u00e9geredm\u00e9nye \\\\( \\\\rho_c = 3,2 \\\\text{ g/cm}^3
  \\\\)\\n\\n\u00e9s \\\\( \\\\rho_a = 2,65 \\\\text{ g/cm}^3 \\\\) eset\u00e9n \\\\(
  V_c = 100 \\\\text{ liter/m}^3 \\\\) \u00e9s \\\\( V_a = 1000 - (144 + 100) = 756
  \\\\text{ liter/m}^3 \\\\), illetve \\\\( m_a = 2003 \\\\text{ kg/m}^3 \\\\), k\u00f6vetkezt\u00e9sk\u00e9ppen
  \\\\( \\\\gamma_f = 2467 \\\\text{ kg/m}^3 \\\\) azaz 2 % leveg\u0151tartalom mellett
  2418 kg/m\\\\(^3\\\\) lehet a v\u00e1rhat\u00f3 tests\u0171r\u0171s\u00e9g. Ha a
  2400 kg/m\\\\(^3\\\\) k\u00f6vetelm\u00e9ny v\u00e1ltozatlan maradna, akkor megfelel\u0151nek
  kellene \u00edt\u00e9lni a 2,7 % leveg\u0151tartalm\u00fa friss betont is (ez sz\u00e1mithat\u00f3
  2400/2467 = 0,973 -b\u00f3l). Az elt\u00e9r\u00e9s ugyan gyakorlatilag nem jelent\u0151s,
  de a szabv\u00e1ny F.1. \u00e9s F.2. t\u00e1bl\u00e1zata ebb\u0151l k\u00f6vetkez\u0151en
  nem szabatos.\\n\\nM\u00e1s ok is k\u00e9ts\u00e9gess\u00e9 teszi az F.1. \u00e9s
  F.2. t\u00e1bl\u00e1zatok alkalmazhat\u00f3s\u00e1g\u00e1t. A t\u00e1bl\u00e1zatokban
  megadott cementtartalom \u00e9s v\u00edz/cement t\u00e9nyez\u0151 ugyanis csak aj\u00e1nl\u00e1s,
  amelyt\u0151l el lehet t\u00e9rni: lehet nagyobb cementtartalom \u00e9s kisebb v\u00edz/cement
  t\u00e9nyez\u0151t is alkalmazni az adott kit\u00e9t oszt\u00e1lyra a t\u00e1bl\u00e1zatban
  megadott \u00e9rt\u00e9kekhez k\u00e9pest. P\u00e9ldak\u00e9ppen a 2. t\u00e1bl\u00e1zatban
  bemutatom ennek a k\u00f6vetkezm\u00e9nyeit a friss beton tests\u0171r\u0171s\u00e9g\u00e9nek
  az alakul\u00e1s\u00e1ra.\\n\\nA t\u00e1bl\u00e1zatb\u00f3l leolvashat\u00f3, hogy
  mind a n\u00f6vekv\u0151 cementtartalom, mind a cs\u00f6kken\u0151 v\u00edz/cement
  t\u00e9nyez\u0151 megv\u00e1ltoztatja a bedolgozott friss betonok v\u00e1rhat\u00f3
  tests\u0171r\u0171s\u00e9g\u00e9t, ez\u00e9rt az MSZ 4798-1 F.1. \u00e9s F.2. t\u00e1bl\u00e1zat\u00e1nak
  k\u00f6vetelm\u00e9nyei egyes esetekben t\u00falzottan szigor\u00faak, m\u00e1s
  esetekben t\u00falzottan enged\u00e9kenyen lehetnek. Ez\u00e9rt meg kell \u00e1llap\u00edtani,
  hogy a szabv\u00e1ny vonatkoz\u00f3 el\u0151\u00edr\u00e1sai nem alkalmasak arra,
  hogy szabatos k\u00f6vetkeztet\u00e9seket lehessen a betonok t\u00f6m\u00f6ris\u00e9gre
  levonni.\\n\\n| \\\\( m_c \\\\) kg/m\\\\(^3\\\\) | \\\\( m_v \\\\) kg/m\\\\(^3\\\\)
  | \\\\( m_a \\\\) kg/m\\\\(^3\\\\) | \\\\( x \\\\) | \\\\( \\\\gamma_f \\\\) kg/m\\\\(^3\\\\)
  | 0,98 . \\\\( \\\\gamma \\\\) |\\n|---------------------|---------------------|---------------------|-------|---------------------|------------------|\\n|
  320                 | 144                 | 1987                | 0,45  | 2451                |
  2400             |\\n| 360                 | 162                 | 1906                |
  0,45  | 2428                | 2380             |\\n| 320                 | 128                 |
  2030                | 0,4   | 2478                | 2430             |\\n| 360                 |
  144                 | 1953                | 0,4   | 2457                | 2410             |\\n\\n2.
  t\u00e1bl\u00e1zat Az \u01513 kit\u00e9t oszt\u00e1lyban felhaszn\u00e1lt k\u00fcl\u00f6nb\u00f6z\u0151
  \u00f6sszet\u00e9telek betonok v\u00e1rhat\u00f3 tests\u0171r\u0171s\u00e9geinek
  a v\u00e1ltoz\u00e1sa\\n\\nSz\u00fcks\u00e9ges ez\u00e9rt az MSZ 4798-1 szabv\u00e1ny
  F.1. \u00e9s F.2. t\u00e1bl\u00e1zatainak a m\u00f3dos\u00edt\u00e1sa, amelyre a
  k\u00f6vetkez\u0151ben ismertetem javaslatomat.\\n\\n### 3. A beton v\u00e1rhat\u00f3
  tests\u0171r\u0171s\u00e9g\u00e9nek a sz\u00e1m\u00edt\u00e1sa\\n\\nA bedolgozott
  friss, leveg\u0151mentes beton tests\u0171r\u0171s\u00e9ge szabatosan a kever\u00e9si
  ar\u00e1nyb\u00f3l sz\u00e1m\u00edthat\u00f3 a k\u00f6vetkez\u0151k szerint.\\n\\nA
  tervez\u00e9si szakaszban a beton t\u00f6meg szerinti kever\u00e9si ar\u00e1nya
  ismert, amely megadj a egys\u00e9gnyi t\u00f6meg\u0171 cementre vonatkozott v\u00edz,
  adal\u00e9kanyag (\u00e9s esetleg kieg\u00e9sz\u00edt\u0151 anyag) t\u00f6meget
  (az adal\u00e9kok szer mennyis\u00e9g\u00e9t \u00e1ltal\u00e1ban a cement t\u00f6megsz\u00e1la\u00e9kb\u00e1ban
  fejezik ki). P\u00e9ld\u00e1ul 1:0,5:5:0,2 kever\u00e9si ar\u00e1ny azt jelenti,
  hogy 1 t\u00f6megr\u00e9sz cement-hez 0,5 t\u00f6megr\u00e9sz v\u00edzet, 5 t\u00f6megr\u00e9sz
  adal\u00e9kanyagot \u00e9s 0,2 t\u00f6megr\u00e9szkieg\u00e9sz\u00edt\u0151 anyagot
  kell hozz\u00e1keverni. A kever\u00e9si ar\u00e1nyb\u00f3l a k\u00e9sz\u00edt\u00e9si
  tests\u0171r\u0171s\u00e9g ismeret\u00e9ben lehet kisz\u00e1m\u00edtani a beton
  \u00f6sszet\u00e9teleit, amely att\u00f3l f\u00fcgg\u0151en elt\u00e9r\u0151 lehet,
  amennyiben a bedolgoz\u00e1s hat\u00e9konys\u00e1ga k\u00fcl\u00f6nb\u00f6zik. A
  fenti kever\u00e9si ar\u00e1ny\u00fa beton \u00f6sszet\u00e9telei k\u00fcl\u00f6nb\u00f6z\u0151
  k\u00e9sz\u00edt\u00e9si tests\u0171r\u0171s\u00e9gek (azaz k\u00fcl\u00f6nb\u00f6z\u0151
  t\u00f6m\u00f6ris\u00e9gek) mellett a k\u00f6vetkez\u0151k lehetnek:\\n\\n**K\u00e9sz\u00edt\u00e9si
  tests\u0171r\u0171s\u00e9g, kg/m\\\\(^3\\\\)**\\n\\n| 2000 | 2100 | 2200 | 2300
  | 2370 |\\n|------|------|------|------|------|\\n| 299  | 313  | 328  | 342  |
  343  |\\n| 355  | 355  | 355  | 355  | 355  |\\n\\n**V\u00edztartalom, liter/m\\\\(^3\\\\)**\\n\\n|
  149  | 157  | 164  | 172  | 178  |\\n|------|------|------|------|------|\\n| 565  |
  594  | 622  | 650  | 672  |\\n| 30   | 31   | 33   | 34   | 35   |\\n| 840  | 883  |
  925  | 967  | 1000 |\\n| 160  | 117  | 75   | 33   | 0    |\\n\\nA fenti p\u00e9ld\u00e1b\u00f3l
  kit\u0171n\u0151k, hogy a friss beton leveg\u0151tartalma a t\u00e9rfogat szerinti
  \u00f6sszet\u00e9telb\u0151l sz\u00e1m\u00edthat\u00f3, de a kever\u00e9si ar\u00e1nyt
  hagyom\u00e1nyosan t\u00f6meg szerint szoktuk megadni. C\u00e9lszer\u0171 ez\u00e9rt
  a t\u00e9rfogat szerinti kever\u00e9si ar\u00e1nyt meghat\u00e1rozni, mert ebb\u0151l
  lehet a hi\u00e1nytalanul t\u00f6m\u00f6ritett beton \u00f6sszet\u00e9tel\u00e9i
  adatait megkapni. A t\u00f6meg szerinti kever\u00e9si ar\u00e1nyb\u00f3l a t\u00e9rfogat
  szerinti kever\u00e9si ar\u00e1ny a t\u00f6megr\u00e9szeknek a s\u0171r\u0171s\u00e9ggel
  val\u00f3 oszt\u00e1s\u00e1val sz\u00e1m\u00edthat\u00f3. A p\u00e9lda szerint 1
  : 0,5 : 5 : 0,2 t\u00f6megar\u00e1ny\u00fa betonkever\u00e9k t\u00e9rfogatar\u00e1nya
  a k\u00f6vetkez\u0151:\\n\\n\\\\[\\n\\\\frac{1}{3,1} : \\\\frac{0,5}{1} : \\\\frac{5}{2,64}
  : \\\\frac{0,2}{2}\\n\\\\]\\n\\nazaz 0,32258 : 0,5 : 1,89394 : 0,1\\n\\nK\u00e9pezz\u00fck
  a t\u00e9rfogatr\u00e9szek \u00f6sszeg\u00e9t, teh\u00e1t:\\n\\n\\\\( 0,32258 +
  0,5 + 1,89394 + 0,1 = 2,81652 \\\\)\\n\\n\u00e9rt\u00e9ket. Ha ezzel az \u00f6sszeggel
  elosztjuk az egys\u00e9gnyi t\u00e9rfogatot, azaz 1 m\\\\(^3\\\\) = 1000 liter \u00e9s
  a nyert h\u00e1nyadosnal megszorozzuk a t\u00e9rfogatr\u00e9szeket, akkor megkapjuk
  literben az alkot\u00f3 anyagok t\u00f6m\u00f6r t\u00e9rfogat\u00e1t. P\u00e9ld\u00e1inkban:\\n\\n\\\\[\\n\\\\frac{1000}{2,81652}
  = 355,04807\\n\\\\]\\n\\nteh\u00e1t **cementt\u00e9rfogat**\\n\\n\\\\[\\n355,04807
  \\\\cdot 0,32258 = 114,5 \\\\text{ liter/m}^3\\n\\\\]\\n\\n**v\u00edzt\u00e9rfogat**\\n\\n\\\\[\\n355,04807
  \\\\cdot 0,5 = 177,5 \\\\text{ liter/m}^3\\n\\\\]\\n\\n**adal\u00e9kanyag t\u00e9rfogat**\\n\\n\\\\[\\n355,04807
  \\\\cdot 1,89394 = 672,5 \\\\text{ liter/m}^3\\n\\\\]\\n\\n**kieg\u00e9sz\u00edt\u0151anyag
  t\u00e9rfogat**\\n\\n\\\\[\\n355,04807 \\\\cdot 0,1 = 35,5 \\\\text{ liter/m}^3\\n\\\\]\\n\\n**\u00f6sszesen**
  = 1000 liter/m\\\\(^3\\\\)\\n\\nAz alkot\u00f3anyagok t\u00e9rfogat\u00e1t megszorozva
  a s\u0171r\u0171s\u00e9ggel megkapjuk annak a betonnak a t\u00f6meg szerinti \u00f6sszet\u00e9teleit,
  amelyben nincs t\u00f6m\u00f6rit\u00e9si hi\u00e1ny miatti leveg\u0151tartalom,
  illetve az alkot\u00f3anyagok \u00edgy kisz\u00e1m\u00edtott t\u00f6megeinek az
  \u00f6sszege megadj\u00e1 az el\u00e9rend\u0151 k\u00e9sz\u00edt\u00e9si tests\u0171r\u0171s\u00e9get.
  A p\u00e9ld\u00e1nak megfelel\u0151en:\\n\\n**\u00d6nentttartalom**\\n\\n\\\\[ 114,5
  \\\\cdot 3,1 = 55 \\\\text{ kg/m}^3 \\\\]\\n\\n**V\u00edztartalom**\\n\\n\\\\[ 177,5
  \\\\cdot 1 = 178 \\\\text{ kg/m}^3 \\\\]\\n\\n**Adal\u00e9kanyag tartalom**\\n\\n\\\\[
  672,5 \\\\cdot 2,64 = 1775 \\\\text{ kg/m}^3 \\\\]\\n\\n**Kieg\u00e9sz\u00edt\u0151anyag
  tartalom**\\n\\n\\\\[ 35,5 \\\\cdot 2 = 71 \\\\text{ kg/m}^3 \\\\]\\n\\n**\u00d6sszesen**\\n\\n\\\\[
  = 2379 \\\\text{ kg/m}^3 \\\\]\\n\\nA t\u00e9rfogat szerinti kever\u00e9si ar\u00e1ny
  bemutatott sz\u00e1m\u00edt\u00e1s\u00e1hoz felhaszn\u00e1lt \u00f6sszef\u00fcgg\u00e9sek
  a k\u00f6vetkez\u0151kben foglalhat\u00f3k \u00f6ssze:\\n\\na) \u00f6sszef\u00fcgg\u00e9s
  a t\u00e9rfogat szerinti kever\u00e9si ar\u00e1ny sz\u00e1m\u00edt\u00e1s\u00e1ra
  a t\u00f6meg szerinti kever\u00e9si ar\u00e1nyb\u00f3l:\\n\\n\\\\[\\nV = \\\\frac{c}{\\\\rho_c}
  + \\\\frac{v}{\\\\rho_v} + \\\\frac{a}{\\\\rho_a} + \\\\frac{k}{\\\\rho_k}\\n\\\\]  \\n\\n(6)\\n\\nahol\\n\\n-
  \\\\( V \\\\) = a t\u00e9rfogatar\u00e1nyok \u00f6sszege,\\n- \\\\( c \\\\) = cement
  t\u00f6megar\u00e1nya (rendszereint = 1),\\n- \\\\( v \\\\) = v\u00edz t\u00f6megar\u00e1nya
  (rendszereint egyenl\u0151 a v\u00edz/cement t\u00e9nyez\u0151vel),\\n- \\\\( a
  \\\\) = adal\u00e9kanyag t\u00f6megar\u00e1nya,\\n- \\\\( k \\\\) = kieg\u00e9sz\u00edt\u0151
  anyag t\u00f6megar\u00e1nya,\\n- \\\\( \\\\rho_c \\\\) = cement s\u0171r\u0171s\u00e9ge,
  g/cm\u00b3,\\n- \\\\( \\\\rho_v \\\\) = v\u00edz s\u0171r\u0171s\u00e9ge, g/cm\u00b3
  (rendszereint = 1),\\n- \\\\( \\\\rho_a \\\\) = adal\u00e9kanyag s\u0171r\u0171s\u00e9ge,
  g/cm\u00b3,\\n- \\\\( \\\\rho_k \\\\) = kieg\u00e9sz\u00edt\u0151 anyag s\u0171r\u0171s\u00e9ge,
  g/cm\u00b3.\\n\\nb) cementtartalom\\n\\n\\\\[ V_c \\\\neq \\\\frac{1000}{V} \\\\cdot
  \\\\left( \\\\frac{c}{\\\\rho_c} \\\\right) \\\\text{ \u00e9s } m_c = \\\\frac{V}{\\\\rho_c}
  \\\\]\\n\\n(7)\\n\\nc) v\u00edztartalom\\n\\n\\\\[ V_v \\\\neq \\\\frac{1000}{V}
  \\\\cdot \\\\left( \\\\frac{v}{\\\\rho_v} \\\\right) \\\\text{ \u00e9s } m_v = \\\\frac{V}{\\\\rho_v}
  \\\\]\\n\\n(8)\\n\\nd) adal\u00e9kanyag tartalom\\n\\n\\\\[ V_a \\\\neq \\\\frac{1000}{V}
  \\\\cdot \\\\left( \\\\frac{a}{\\\\rho_a} \\\\right) \\\\text{ \u00e9s } m_a = \\\\frac{V}{\\\\rho_a}
  \\\\]\\n\\n(9)\\n\\ne) kieg\u00e9sz\u00edt\u0151anyag tartalom\\n\\n\\\\[ V_k \\\\neq
  \\\\frac{1000}{V} \\\\cdot \\\\left( \\\\frac{k}{\\\\rho_k} \\\\right) \\\\text{
  \u00e9s } m_k = \\\\frac{V}{\\\\rho_k} \\\\]\\n\\n(10)\\n\\nEzekb\u0151l az \u00f6sszef\u00fcgg\u00e9sekb\u0151l
  lehet kialak\u00edtani a bedolgozott friss beton tervezett tests\u0171r\u0171s\u00e9g\u00e9nek
  szabv\u00e1nyba foglalt hat\u00f3 sz\u00e1m\u00edt\u00e1si m\u00f3dszer\u00e9t.\\n\\n4.
  Javaslat az MSZ 4798-szabv\u00e1ny F mell\u00e9klet m\u00f3dos\u00edt\u00e1s\u00e1ra\\n\\nAz
  ismertetett sz\u00e1m\u00edt\u00e1sok v\u00e9g eredm\u00e9nyek\u00e9nt az MSZ 4798-1
  F.1. \u00e9s F.2. t\u00e1bl\u00e1zat\u00e1nak a m\u00f3dos\u00edt\u00e1s\u00e1ra
  javaslatom a k\u00f6vetkez\u0151:\\n\\nAz F.1. \u00e9s az F.2. t\u00e1bl\u00e1zatok
  Friss beton megk\u00f6vetelt tests\u0171r\u0171s\u00e9ge, kg/m\u00b3 \u00e9s Kisz\u00e1rul\u00f3
  szil\u00e1rd beton megk\u00f6vetelt tests\u0171r\u0171s\u00e9ge, kg/m\u00b3 megnevez\u00e9s\u0171
  sorait \u00e9s az azokban tal\u00e1lhat\u00f3 sz\u00e1m\u00e9rt\u00e9keket \u00e9rv\u00e9nyteleneknek
  kell nyilv\u00e1n\u00edtani \u00e9s e helyett a k\u00f6vetkez\u0151 sz\u00f6veget
  kell a t\u00e1bl\u00e1zatok ut\u00e1n a szabv\u00e1nyba illeszteni:\\n\\nA bedolgozott
  friss beton \u00e9s a 28 napos kor\u00fa szil\u00e1rd beton megfelel\u0151 t\u00f6nm\u00f6rs\u00e9g\u00e9t
  a testst\u0171r\u00e9s ellen\u0151rz\u00e9s\u00e9vel kell megbat\u00e1rozni. A bedolgozott
  friss beton \\\\( \\\\gamma_f \\\\) megengedett legkisebb tests\u0171r\u0171s\u00e9g\u00e9t
  a t\u00f6meg szerinti kever\u00e9si ar\u00e1ny ismeret\u00e9ben a k\u00f6vetkez\u0151
  k\u00e9pletb\u0151l kell kisz\u00e1m\u00edtani:\\n\\n\\\\[\\n\\\\gamma_f = 980 \\\\times
  \\\\left[ \\\\frac{c \\\\times (1+x)}{V} + \\\\frac{a}{V} + \\\\frac{k}{V} \\\\right]
  \\\\text{ kg/m}^3\\n\\\\]\\n\\nahol\\n\\n- \\\\( \\\\gamma_f \\\\) = a bedolgozott
  friss beton megengedett legkisebb tests\u0171r\u0171s\u00e9ge, kg/m\u00b3,\\n- \\\\(
  c \\\\) = a cement t\u00f6megar\u00e1nya (\u00e1ltal\u00e1ban = 1)\\n- \\\\( x \\\\)
  = a v\u00edz/cement t\u00e9nyez\u0151\\n- \\\\( a \\\\) = az adal\u00e9kanyag t\u00f6megar\u00e1nya\\n-
  \\\\( k \\\\) = a kieg\u00e9sz\u00edt\u0151 anyag t\u00f6megar\u00e1nya\\n\\n\\\\[\\nV
  = \\\\left( \\\\frac{c}{\\\\rho_c} + x + \\\\frac{a}{\\\\rho_a} + \\\\frac{k}{\\\\rho_k}
  \\\\right)\\n\\\\]\\n\\nebben a kifejez\u00e9sben:\\n\\n- \\\\( \\\\rho_c, \\\\rho_a
  \\\\) \u00e9s \\\\( \\\\rho_k \\\\) = rendre a cement, az adal\u00e9kanyag \u00e9s
  a kieg\u00e9sz\u00edt\u0151 anyag s\u0171r\u0171s\u00e9ge, g/cm\u00b3, amelyek k\u00f6z\u00e9lt\u0151
  \u00e9rt\u00e9kei rendre 3,1, 2,64 (homokos kavics) \u00e9s 2,0 (meszk\u00f6lisztt)\\n\\nA
  28 napos szil\u00e1rd \u00e9s sz\u00e1raz beton megengedett legkisebb \\\\( \\\\gamma_{sz}
  \\\\) tests\u0171r\u0171s\u00e9g\u00e9t annak felt\u00e9telez\u00e9s\u00e9vel szabad
  kisz\u00e1m\u00edtani, hogy a cement - a beton szokv\u00e1nyos t\u00e1rol\u00e1si
  k\u00f6r\u00fclm\u00e9nyei k\u00f6z\u00f6tt - a kever\u0151v\u00edzb\u0151l t\u00f6meg\u00e9nek
  kb. 15 %-\u00e1t k\u00e9mialag megk\u00f6ti, a t\u00f6bbi elp\u00e1rol\u00f3, ez\u00e9rt\\n\\n\\\\[\\n\\\\gamma_{sz}
  = \\\\gamma_f - (m_v \\\\cdot 0,15 \\\\cdot m_c) \\\\text{ kg/m}^3\\n\\\\]\\n\\nahol
  \\\\( m_v \\\\) = v\u00edztartalom, kg/m\u00b3, \\\\( m_c \\\\) = cementtartalom,
  kg/m\u00b3.\\n\\nA betonkever\u00e9k min\u0151s\u00edt\u00e9s\u00e9re k\u00e9sz\u00edtett
  pr\u00f3batestek vizsg\u00e1lati eredm\u00e9nyeit csak akkor szabad m\u00e9rvad\u00f3nak
  tekinteni, ha a m\u00e9rt \\\\( \\\\gamma_{sf} \\\\) t\u00e9nyleges tests\u0171r\u0171s\u00e9g\u00fck
  friss, bedolgozott \u00e1llapotban\\n\\n\\\\[\\n\\\\gamma_{sf} \\\\geq \\\\gamma_f\\n\\\\]\\n\\nilletve
  t\u00f6r\u00e9skor - \u00e1ltal\u00e1ban 28 napos korban, sz\u00e1raz \u00e1llapotban
  - m\u00e9rt \\\\( \\\\gamma_{sz} \\\\) t\u00e9nyleges tests\u0171r\u0171s\u00e9g\u00fck\\n\\n\\\\[\\n\\\\gamma_{sz}
  \\\\geq \\\\gamma_{sz}\\n\\\\]\\n\\nA javasolt m\u00f3dos\u00edt\u00e1s ut\u00e1n
  az MSZ 4798-1 F.1. \u00e9s F.2 t\u00e1bl\u00e1zataiba foglalt valamennyi el\u0151\u00edr\u00e1s
  szabatos\u00e1 v\u00e1lik.\\n\\n**K\u00d6NYVJELZ\u0150**\\n\\nMegjelent az Update
  c\u00edm\u0171 kiadv\u00e1nyok 2006. \u00e9vi 1, \u00e9s 2. sz\u00e1ma.\\n\\nAz
  1. sz\u00e1m a k\u00f6zleked\u00e9si zajr\u00f3l, a cs\u00f6kkent\u00e9s m\u00f3dj\u00e1r\u00f3l
  sz\u00f3l. N\u00e9metorsz\u00e1gban 1975 \u00f3ta a lakoss\u00e1got \u00e9rint\u0151
  zajterhel\u00e9s az aut\u00f3p\u00e1ly\u00e1kon 2,5 dB(A) \u00e9rt\u00e9kkel, a
  t\u00f6bbi k\u00f6z\u00faton 1,5 dB(A) \u00e9rt\u00e9kkel n\u00f6vekedett. A zajv\u00e9delmi
  falak magass\u00e1ga 3 m\u00e9terr\u0151l 4,2 m\u00e9terre n\u00f6vekedett. A zajv\u00e9delmi
  int\u00e9zked\u00e9sek egyre ink\u00e1bb k\u00f6lts\u00e9gt\u00e9nyez\u0151v\u00e9
  v\u00e1lnak \u00e9s befoly\u00e1solj\u00e1k az \u00fat megjelen\u00e9s\u00e9t.\\n\\nN\u00e9metorsz\u00e1gban
  t\u00f6bb vizsg\u00e1latot is v\u00e9geztek e t\u00e9mban, melynek eredm\u00e9nye
  szerint a nagy sebes\u00e9g\u0171 j\u00e1rm\u0171vekkel terhelt utakon a zajcs\u00f6kkent\u00e9s
  lehet\u0151s\u00e9ge mind az abroncsokn\u00e1l, mind az \u00fatburkolatot illet\u0151en
  nagy. Beton p\u00e1lyaszerekzeth\u00e9n\u00e9l komoly eredm\u00e9nyre vezet a m\u0171t\u0171ves
  \u00e9rdes\u00edt\u00e9s, vagy a mosott beton fel\u00fclet kialak\u00edt\u00e1sa.\\n\\nA
  2. sz\u00e1m arr\u00f3l sz\u00f3l, hogy Baselban 2006 v\u00e9g\u00e9ig egy \u00faj,
  7 km hossz\u00fas\u00e1g\u00fa felj\u00e1r\u00f3h\u00edd fogja a terhegyp\u00e1rr\u00famev\u0171
  v\u00e1m parkol\u00f3j\u00e1t az A2 aut\u00f3p\u00e1ly\u00e1val k\u00f6zvetlen\u00fcl
  \u00f6sszek\u00f6tni. A nagy terhel\u00e9s, az er\u0151s lejt\u00e9s \u00e9s a f\u00e9k\u00fat
  roppant nagy ig\u00e9nybev\u00e9telt jelent a burkolat sz\u00e1m\u00e1ra, ez\u00e9rt
  a m\u00e9ly\u00e9p\u00edt\u00e9si hivatal kop\u00e1s\u00e1ll\u00f3 betonburkolatot
  \u00edrt el\u0151, amelyet a betonhiddal \u00f6sszekapcsolva kellett r\u00e1\u00e9p\u00edteni.\\n\\nA
  burkolat be\u00e9p\u00edt\u00e9se el\u0151tt a p\u00e1lyaelemz fel\u00fclet\u00e9t
  \u00e9rdeztett\u00e9k, majd elter\u00edtett\u00e9k a betont, t\u00fcbl\u00e9r\u0151l
  t\u00f6n\u00f6ritett\u00e9k, elhelyezt\u00e9k az \u00f6sszek\u00f6t\u0151 vasal\u00e1st,
  a fel\u00fcletet sim\u00edtott\u00e1k, keresztir\u00e1nyban bord\u00e1zt\u00e1k,
  majd kipermettezt\u00e9k a p\u00e1raz\u00e1r\u00f3 anyagot. A burkolat 5 \u00f3r\u00e1n
  bel\u00fcl k\u00e9sz\u00fclt el az eg\u00e9sz felj\u00e1r\u00f3n.\\n\\nA kiadv\u00e1nyok
  beszerezhet\u0151k a Magyar Cementipari Sz\u00f6vets\u00e9gn\u00e9l, telefon: 1/250-1629.\\n\\nAz
  EU szabv\u00e1nyokra val\u00f3 \u00e1tt\u00e9r\u00e9s neh\u00e9zs\u00e9gei\\n\\nPOLG\u00c1R
  L\u00c1SZL\u00d3\\n\\nEzen cikk fr\u00f3ja sokat foglalkozott \u00e9s foglalkozik
  a szabv\u00e1nyokkal, f\u0151leg a vasbeton szerkezetek tervez\u00e9se, kivitelez\u00e9se
  ter\u00fclet\u00e9n. A kiterjedt k\u00fclf\u00f6ldi tev\u00e9kenys\u00e9gek - Rom\u00e1nia,
  Bulg\u00e1ria, Ukrajna, Szerbia - k\u00fcl\u00f6n\u00f6sen a felsz\u00ednre hozz\u00e1k
  a szabv\u00e1nyalkalmaz\u00e1sok neh\u00e9zs\u00e9geit. Egy \u00e1tmeneti kor c\u00e9legyenese
  fel\u00e9 k\u00f6zeled\u00fcnk, hiszen ha akadozva is, de nap mint nap szembees\u00fcl\u00fcnk
  a k\u00f6z\u00f6s Eur\u00f3pa, az EU kih\u00edv\u00e1saival. Egyik oldalon s\u00e9r\u0171n\u0151
  l\u00e1tjuk nemzeti identit\u00e1sunkat, m\u00e1sik oldalr\u00f3l a nemzetk\u00f6zi
  versenyben is helyt szeretn\u00e9nk \u00e1llni, \u00e9s persze sz\u00edvesen fogadn\u00e1nk
  min\u00e9l t\u00f6bb EU t\u00e1mogat\u00e1st.\\n\\nKulcsszavak: EN szabv\u00e1nyok,
  szakmai egy\u00fcttm\u0171k\u00f6d\u00e9s, inform\u00e1ci\u00f3k az interneten\\n\\nEgy
  kis kitekint\u00e9s k\u00fclf\u00f6ldre\\n\\nA n\u00e9met Beton-Jahrbuch 2006 egyik
  cikk\u00e9b\u0151l id\u00e9zek, mely azokr\u00f3l a neh\u00e9zs\u00e9gekr\u0151l
  \u00e9s probl\u00e9m\u00e1kr\u00f3l sz\u00f3l, melyek a szab\u00e1lyoz\u00e1si k\u00f6rnyezet
  v\u00e1ltoz\u00e1saib\u00f3l ad\u00f3dnak a gyakorlatban. A cikkir\u0151l fel k\u00edv\u00e1nja
  h\u00edvni a figyelmet azon kih\u00edv\u00e1sokra, melyekkel az \u00e9p\u00edt\u00e9si
  tev\u00e9kenys\u00e9gben r\u00e9sztvev\u0151knek foglalkozniuk kell!\\n\\nStefan
  Zwolinski: Az \u00e9rt\u00e9kek reol\u00f3giaja - a l\u00e9tr\u0151l \u00e9s a l\u00e1tszatr\u00f3l,
  biztons\u00e1g \u00e9s val\u00f3sz\u00edn\u0171s\u00e9g Eur\u00f3p\u00e1ban\\n\\nA
  reol\u00f3gia a betonokkal kapcsolatban a friss \u00e1llapot\u00fa cementip\u00e9p
  \u00e9s beton mozg\u00e1si foly\u00e1si tulajdons\u00e1gait \u00edrja le. Az elm\u00falt
  \u00e9vtizedekben a reol\u00f3gia fogalm\u00e1t els\u0151sorban tudom\u00e1nyos
  vizsg\u00e1latokn\u00e1l haszn\u00e1lt\u00e1k. Az 1990-es \u00e9vek kezdet\u00e9t\u0151l
  a reol\u00f3gia a sz\u00e9les szakmai nyilv\u00e1noss\u00e1g el\u00e9 ker\u00fclt
  \u00e9s a modern betonetchnol\u00f3gia fontos r\u00e9sz\u00e9v\u00e9 v\u00e1lt.\\n\\nA
  g\u00f6r\u00f6g \\\"pantha rei\\\" kifejez\u00e9s jelent\u00e9se magyarul: minden
  folyik. Ez az \u00f6nt\u00f6m\u00f6r\u00f6d\u0151 betonokra \u00e9pp\u00fagy igaz,
  mint az \u00faj eur\u00f3pai szab\u00e1lyoz\u00e1sokra \u00e9s \u00e9p\u00edt\u00e9ssel
  kapcsolatos jogokra, valamint az ezekhez kapcsol\u00f3d\u00f3 nemzeti kompetenci\u00e1kra.\\n\\nK\u00f6zben
  az eur\u00f3pai szab\u00e1lyoz\u00e1sok egykor nyugodtan cs\u00f6rd\u00f6gez\u0151
  patakj\u00e1b\u00f3l egy igen tekinthet\u0151 folyam lett, k\u00fcl\u00f6n\u00f6sen
  az ut\u00f3bbi 10 \u00e9v alatt. Ebbe j\u00f6nnek a nemzeti szab\u00e1lyoz\u00e1sok,
  mint a DIN szabv\u00e1nyok, a n\u00e9met vasbeton bizotts\u00e1g (DAF stb.) ir\u00e1nyelvei
  \u00e9s az ezekhez kapcsol\u00f3d\u00f3, kieg\u00e9sz\u00edt\u0151 m\u0171szaki
  szerz\u0151d\u00e9ses \u00e9s sz\u00e1ll\u00edt\u00e1si felt\u00e9telek (ZTV-ING,
  TL-Pflaster \u00e9s basonl\u00f3k).\\n\\nAz \u00f6sszes anyag \u00e9s gy\u00e1rtm\u00e1ny
  szabv\u00e1nyok \u00e9s tov\u00e1bbi szab\u00e1lyoz\u00e1sok, melyek a beton term\u00e9kekre
  \u00e9s az el\u0151regy\u00e1rt\u00f3 iparra hat\u00e1ssal vannak, r\u00f6vid id\u0151n
  bel\u00fcl ca. 90%-ban megv\u00e1ltoztak, az \u00e1tmeneti id\u0151k is a v\u00e9g\u00fckhez
  k\u00f6zelkednek. A t\u00f6bbnyire 2004-ben kezd\u0151d\u00f6tt \u00e1tmeneti id\u0151
  h\u00e1rom \u00e9ven bel\u00fcl lej\u00e1r.\\n\\nAz \u00e1t\u00e1ll\u00e1sb\u00f3l
  sz\u00fcks\u00e9ges folyamatok \u00e9s az \u00faj el\u0151\u00edr\u00e1sok megismere
  minden r\u00e9sztvev\u0151 sz\u00e1m\u00e1ra rendk\u00edv\u00fcli k\u00f6vetelm\u00e9nyeket
  t\u00e1maszt. Abboz, hogy az \u00fajdons\u00e1gok konzisztensen ker\u00fclhessene
  alkalmaz\u00e1sra, a k\u00f6vetelm\u00e9nyeket kiir\u00f3 helyeknek, a tervez\u0151nek,
  a gy\u00e1rt\u00f3nak, az \u00e9p\u00edt\u00e9s kivitelez\u0151inek, a bat\u00f3s\u00e1goknak
  \u00e9s a fel\u00fcgyel\u0151, ellen\u0151rz\u0151 szerveknek azonos m\u00e9rt\u00e9kben
  k\u00f6teless\u00e9gg\u00fckkel kell v\u00e1lni a k\u00f6z\u00f6s cselekedeteknek.\\n\\n\u00dajdons\u00e1gok:
  fogalmak, fel\u00e9p\u00edt\u00e9s, oszt\u00e1lyok.\\n\\nEgy \u00faj m\u0171szaki
  el\u0151\u00edr\u00e1s alkalmaz\u00e1s\u00e1hoz a r\u00e1ford\u00edt\u00e1sok k\u00f6zvetlen\u00fcl
  \u00f6sszef\u00fcggnek az el\u0151\u00edr\u00e1sban megjelen\u0151 \u00fajdons\u00e1gok
  m\u00e9rt\u00e9k\u00e9vel, melyek a kor\u00e1bbi m\u0171szaki alapokt\u00f3l elt\u00e9rnek.\\n\\nEzen
  r\u00e1ford\u00edt\u00e1sok k\u00f6z\u00fcl nem is felt\u00e9tlen\u00fcl azok a
  r\u00e1ford\u00edt\u00e1sok a m\u00e9rt\u00e9kad\u00f3k, melyek a gy\u00e1rt\u00e1si
  m\u00f3dszerek v\u00e1ltoztat\u00e1s\u00e1t jelentik. Sokkal nagyobb az a r\u00e1ford\u00edt\u00e1s,
  melyet az \u00f6sszes r\u00e9sztvev\u0151nek meg kell tenni, mint a szabv\u00e1nyok
  elolv\u00e1sa, meg\u00e9rt\u00e9se, kritikusan r\u00e1k\u00e9rdezni a r\u00e9szletekre
  \u00e9s az alkalmaz\u00e1st gyakorolni: mely k\u00f6vetelm\u00e9nyeket kell nekem
  mint tervez\u0151nek kiel\u00e9g\u00edteni? Milyen min\u0151s\u00e9gi k\u00f6vetelm\u00e9nyeket
  \u00edrjak el\u0151? Hogyan \u00edrjam el\u0151 az \u00fczemben bel\u00fcli gy\u00e1rtm\u00e1nyellen\u0151rz\u00e9s
  kritikus r\u00e9szeit? B\u0151s\u00e9gesen tal\u00e1lunk m\u00e9g ma is negat\u00edv
  p\u00e9ld\u00e1kat egyes, a betonokra vonatkoz\u00f3 ki\u00edr\u00e1sokban. Pl.
  Bn 225 betont k\u00f6vetelnek, azaz egy olyan jel\u00f6l\u00e9st haszn\u00e1lnak,
  mely m\u00e9g abb\u00f3l az id\u0151b\u0151l sz\u00e1rmazik, melyet a most \u00e9ppen
  felv\u00e1ltott DIN 1045 v\u00e1ltott ki, \u00e9s 1978-ig volt \u00e9rv\u00e9nyben.
  De ugyan\u00fagy el\u0151fordulhat egy \\\"EPZ 45\\\" cement v\u00e1ltoz\u00e1sa,
  egy reliktia a r\u00e9gen el\u00e9v\u00fclt cement szabv\u00e1nyb\u00f3l, melyet
  1994-ben v\u00e1ltott fel az \u00faj szabv\u00e1ny.\\n\\nSok fogalom megv\u00e1ltozott,
  eg\u00e9szben \u00faj jogalmak j\u00f6ttek el\u0151 \u00e9s v\u00e1ltott\u00e1k
  fel a r\u00e9gieket. Az \u00faj DIN 1045-tel kapcsolatos els\u0151, 2001. \u00e9vi
  betant\u00e1sok sor\u00e1n t\u00f6bb extr\u00e9m p\u00e9ld\u00e1t soroltunk fel,
  \u00e9s tudatos\u00edtottuk, hogy az \u00e9p\u00edt\u00e9sben r\u00e9sztvev\u0151
  a tudatlans\u00e1g\u00e1t semmitvel sem tudna jobban el\u00e1rulni, mint azzal,
  hogy m\u00e1r el\u00e9v\u00fclt definici\u00f3kat, feljel\u00e9seket alkalmaz. Ilyen
  tudatlans\u00e1gi bizony\u00edtv\u00e1ny lehet pl. a B25 beton szil\u00e1rds\u00e1g
  megad\u00e1sa, a KR konzisztencia k\u00f6vetel\u00e9se. P\u00e9ld\u00e1ul a beton
  burkol\u00f3k\u00f6vek eset\u00e9ben a nyomoszl\u00e1rds\u00e1g helyett a basit\u0151-biz\u00f3
  szil\u00e1rds\u00e1g a jellemz\u0151 k\u00f6vetelm\u00e9ny.\\n\\nA legt\u00f6bb
  eur\u00f3pai szabv\u00e1ny legfelt\u0171n\u0151bb jellemz\u0151je az, hogy az oldalsz\u00e1m
  a r\u00e9gebbi, basonl\u00f3 t\u00e9ma-j\u00fa nemzeti szabv\u00e1nyok oldalsz\u00e1mba\u00f3z\u00f3
  k\u00e9pest jelent\u0151sen megn\u0151tt. Mik\u00f6zben a burkol\u00f3k\u00f6vek
  r\u00e9gi, DIN 18501:1992-11 szabv\u00e1nya csak 3 oldal volt, az \u00faj DIN EN
  1338:2003-08 beton burkol\u00f3 k\u00f6vekre vonatkoz\u00f3 szabv\u00e1ny 64 oldal
  terjedelm\u0171. A legt\u00f6bb esetben a szabv\u00e1nyok oldalsz\u00e1maival egy\u00fctt
  ar\u00e1nyosan n\u00f6vekszik az \u00e1ttekintetbetelesen. A lapoz\u00e1s k\u00e9zm\u0171ves
  tev\u00e9kenys\u00e9g \u00e9s ahogy lapozunk, j\u00f6nnek a k\u00e9rd\u00e9sek,
  m\u00e9g akkor is, ha szerencs\u00e9s esetben nem kell m\u00e1sik szab\u00e1lyoz\u00e1st
  is kezbe venni.\\n\\nK\u00e9rd\u00e9s ut\u00e1n az \u00fajabb k\u00e9rd\u00e9s:
  hol van ez \u00e9s ez r\u00f6gz\u00edtve?\\n\\n\u00c9s a v\u00e1lasz\u00e9rt sokszoros
  tov\u00e1bbi\\n\\nkeresg\u00e9l\u00e9s sz\u00fcks\u00e9ges. Most nem elemezz\u00fck,
  mi\u00e9rt kellett a szabv\u00e1nyok strukt\u00far\u00e1j\u00e1t ilyenre v\u00e1ltoztani.
  A legt\u00f6bb haszn\u00e1l\u00f3 egydaltalan nem tudja \u00e9rt\u00e9kelni az elvileg
  deklar\u00e1lt felhaszn\u00e1l\u00f3 bar\u00e1t jel\u00e9p\u00edt\u00e9st. Mindenesetre
  a felhaszn\u00e1l\u00f3k r\u00e9sz\u00e9r\u0151l nagy t\u00fcrelem \u00e9s k\u00e9szs\u00e9g
  kell, hogy ezen \u00faj szabv\u00e1nyok tartalm\u00e1t befogadja, pr\u00f3b\u00e1ra
  t\u00e9ve ezen k\u00e9pess\u00e9geket. Az \u00faj szabv\u00e1nyok haszn\u00e1latain\u00e1l
  fell\u00e9p\u0151 akad\u00e1lyok n\u00e9ha od\u00e1ig vezetnek, hogy az eg\u00e9sz
  szabv\u00e1ny \u00e9rtelm\u00e9t \u00e9s haszn\u00e1t megk\u00e9rd\u0151jelezz\u00fck.
  A bizonyos fokig \u00e9rtelhet\u0151 dilemma: ba m\u00e9g meg sem tudjuk az anyagot
  \u00e9rteni, akkor minek haszn\u00e1lni? Ezek nagyon komolyan veend\u0151 gondolatok
  \u00e9s k\u00fcl\u00f6n figyelemre m\u00e9lt\u00f3, hogy olyan szakemberek - gy\u00e1rt\u00f3k,
  tervez\u0151k stb. - r\u00e9sz\u00e9r\u0151l hangzanak el, akikn\u00e9l megvan a
  szak\u00e9rtelme.\\n\\nKonkr\u00e9t p\u00e9lda az egyes oszt\u00e1lyokba sorol\u00e1s
  neh\u00e9zs\u00e9ge. A szil\u00e1rds\u00e1gi oszt\u00e1lyok a betonokn\u00e1l vagy
  falaz\u00f3 elemekn\u00e9l N\u00e9metorsz\u00e1gban bossz\u00fa \u00e9rtez\u00e9den
  \u00e1t term\u00e9szetes kateg\u00f3ri\u00e1k voltak. Most viszont eg\u00e9sz oszt\u00e1lyba
  sorol\u00e1si rendszerek j\u00f6nnek l\u00e9tre, k\u00fcl\u00f6nb\u00f6z\u0151 tulajdons\u00e1gokkal,
  az ezzel \u00f6sszef\u00fcgg\u0151 jel\u00f6l\u00e9sekkel \u00e9s a gy\u00e1rtm\u00e1nyok
  megjel\u00f6l\u00e9seivel. Pl. a DIN EN 1339-2003-08: Lemezek betonb\u00f3l olyan
  oszt\u00e1lyokat k\u00fcl\u00f6nb\u00f6ztetnek meg, mint a D1/KP/V7. Erre is igaz,
  hogy az \u00e9rtelmes, c\u00e9lszer\u0171 oszt\u00e1lyokba sorol\u00e1snak csak
  akkor van \u00e9rtelme, ha a gy\u00e1rt\u00f3k, tervez\u0151k, v\u00e1s\u00e1rl\u00f3k
  stb. el\u0151tt egyar\u00e1nt ismerik az egyes oszt\u00e1lyokkal kapcsolatos k\u00f6vetelm\u00e9nyek.\\n\\nEddig
  a cikk eleje, amib\u0151l l\u00e1tszik, seh\u0151l sem egyszer\u0171 az \u00e1tmenet.\\n\\nEgy
  kis t\u00f6rt\u00e9neti \u00e1ttekint\u00e9s itthonr\u00f3l\\n\\n1989: Rendszerv\u00e1lt\u00e1s
  Magyarorsz\u00e1gon, a KGST \u00f6sszeoml\u00e1sa.\\n\\n1990: Megjelennek az els\u0151
  ENV m\u00e9retez\u00e9si szabv\u00e1nyok a szakk\u00f6nyvekben, mint pl. a Beton-Kalender
  1990 sz\u00e1m\u00e1ban.\\n\\nAz utols\u00f3, m\u00e9g KGST b\u00e1zis\u00fa MSZ
  szabv\u00e1nyok megjelen\u00e9se.\\n\\n1992: Ausztri\u00e1ban, N\u00e9metorsz\u00e1gban
  enged\u00e9lyezik az ENV szabv\u00e1nyok szerinti tervez\u00e9seket, a Nemzeti Alkalmaz\u00e1si
  Dokumentumokban foglaltak figyelembe v\u00e9tellel.\\n\\n1993: Az ADA K\u00f6rmend
  b\u00fatorgy\u00e1r el\u0151regy\u00e1rtott vasbeton v\u00e1zszerkezet\u00e9t az
  ENV 1992 alapj\u00e1n tervezi a Plan31 M\u00e9rn\u00f6k Kft., gy\u00e1rtja, kivitelez\u00ed
  az ASA \u00c9p\u00edt\u0151ipari Kft. Ezzel elindul Magyarorsz\u00e1g is az Eurocode-ok
  t\u00e9rhird\u00edt\u00e1sa (de egyidej\u0171leg el kell k\u00e9sz\u00edteni az
  MSZ 15020 sorozat szerinti igazol\u00e1sokat is).\\n\\n1994: Az els\u0151 k\u00e9t
  METRO \u00e1ruh\u00e1z \u00e9p\u00edt\u00e9se. Kezdet\u00e9t veszi az a METRO \u00e1ruh\u00e1z
  \u00e9p\u00edt\u00e9si sorozat, melynek sor\u00e1n 2005 v\u00e9g\u00e9ig nyolc orsz\u00e1gban
  mintegy 65 METRO \u00e1ruh\u00e1z \u00e9p\u00fclt fel a Plan31-ASA k\u00f6zrem\u0171k\u00f6d\u00e9s\u00e9vel,
  Eurocode szabv\u00e1nyb\u00e1zison.\\n\\nEur\u00f3pai Meg\u00e1llapod\u00e1s I sz.
  t\u00f6rv\u00e9ny \u2013 EU tags\u00e1gunk fel\u00e9 az els\u0151 l\u00e9p\u00e9s.\\n\\n1995:
  Megsz\u0171nik az MSZH (Magyar Szabv\u00e1ny\u00fcgyi Hivatal), helyette l\u00e9trehozz\u00e1k
  az MSZT-t.\\n\\nA BME Vasbetonszerkezetek Tansz\u00e9k\u00e9n megkezd\u0151dik az
  Eurocode b\u00e1zis\u00fa vasbeton szerkezetek oktat\u00e1sa.\\n\\nAz els\u0151
  magyar k\u00f6zbeszerz\u00e9si t\u00f6rv\u00e9ny megalkot\u00e1sa az 1993. \u00e9vi
  EU k\u00f6zbeszerz\u00e9si ir\u00e1nyelv alapj\u00e1n.\\n\\n1997: \u00c9p\u00edt\u00e9si
  t\u00f6rv\u00e9ny, m\u00e1r az EU szellems\u00e9g\u00e9ben.\\n\\n1998: Janu\u00e1r
  1-t\u0151l \u00e9letbe l\u00e9p az MSZ ENV 1991 Eurocode1 A tervez\u00e9s alapjai
  \u00e9s a tart\u00f3szerkezeteket \u00e9r\u0151 hat\u00e1sok c\u00edm\u0171 magyar
  nemzeti szabv\u00e1ny, majd egym\u00e1s ut\u00e1n jelennek meg a t\u00f6bbi Eurocode
  b\u00e1zis\u00fa MSZ ENV magyar nemzeti szabv\u00e1nyok, magyarul. A tervez\u0151
  t\u00e1rsadalom gyakorlatilag nem vesz ezekr\u0151l tudom\u00e1st.\\n\\nElkezd\u0151dik
  a m\u00e1r v\u00e9gleges EN m\u00e9retez\u00e9si szabv\u00e1nyok kidolgoz\u00e1sa.\\n\\n2000:
  \u00c9letbe l\u00e9p az MSZ ENV 206 beton szabv\u00e1ny, angolul.\\n\\n\u00c9letbe
  l\u00e9p az MSZ ENV 13670-1:2000 Betonszerkezetek kivitelez\u00e9se. 1. r\u00e9sz
  \u00c1ltal\u00e1nos el\u0151\u00edr\u00e1sok megnevez\u00e9s\u0171, angol nyelv\u0171
  szabv\u00e1ny, de m\u00e9g hat \u00e9v m\u00falva sem ismerik (2006-ban!), pedig
  \u00faj alapokra helyezi t\u00f6bbek k\u00f6z\u00f6tt a kivitelez\u00e9si pontatlans\u00e1gok
  meg\u00edt\u00e9l\u00e9set!\\n\\n2001: Az akkori FVM megb\u00edz\u00e1st ad a BME
  H\u00edd- \u00e9s Szerkezetek Tansz\u00e9k\u00e9nek a m\u00e9retez\u00e9si szabv\u00e1nyok
  NAD-jainak a kidolgoz\u00e1s\u00e1ra. A miniszterium m\u00e9g nem tudja, hogy a
  szabv\u00e1nyos\u00edt\u00e1s m\u00e1r nem \u00e1llami feladat? A kidolgozott NAD-ok
  sosem v\u00e1lnak hivataloss\u00e1, mivel a szabv\u00e1nyos\u00edt\u00e1s kiz\u00e1r\u00f3lag
  az MSZT kompetenci\u00e1ja.\\n\\nA K\u00f6zbeszerz\u00e9si t\u00f6rv\u00e9ny m\u00f3dos\u00edt\u00e1sa,
  benne az 58\u00a7: \\\"az eur\u00f3pai szabv\u00e1nyokat k\u00f6zz\u00e9tev\u0151
  nemzeti szabv\u00e1nyokat\\\" kell alkalmazni a k\u00f6zbeszerz\u00e9sben megval\u00f3sul\u00f3
  \u00e9p\u00edt\u00e9m\u00e9nyekn\u00e9l.\\n\\n2002: CEN tags\u00e1gunk kezdete.
  Megsz\u0171nik a szabv\u00e1nyok k\u00f6telez\u0151 alkalmaz\u00e1sa.\\n\\n2003:
  Az MSZT meghirdeti az elavult, KGST b\u00e1zis\u00fa MSZ szabv\u00e1nyok visszavon\u00e1si
  sz\u00e1nd\u00e9k\u00e1t. Rendk\u00edv\u00fcli felh\u00e1borod\u00e1s, az MMK, \u00c9VOSZ,
  M\u00c9ASZ, \u00c9MI egym\u00e1sra lict\u00e1lva tiltakoznak sok szabv\u00e1ny visszavon\u00e1si
  sz\u00e1nd\u00e9ka ellen. Az MSZT visszakozik, nagyon sok KGST b\u00e1zis\u00fa
  szabv\u00e1ny tov\u00e1bbra is \u00e9rv\u00e9nyes marad.\\n\\nElkezd\u0151dik az
  MSZ EN 206 magyar nyelvre ford\u00edt\u00e1sa, valamint a hozz\u00e1 tartoz\u00f3
  NAD kidolgoz\u00e1sa a Magyar Betonsz\u00f6vets\u00e9g tagy\u00e1llatainak finansz\u00edroz\u00e1s\u00e1val.\\n\\nMegjelenik
  a 3/2003 BM-GKM-KvVM egy\u00fcttes rendelet az \u00e9p\u00edt\u00e9si term\u00e9kek
  forgalomba hozatal\u00e1r\u00f3l.\\n\\nMegjelenik a 2003 \u00e9vi CXIX t\u00f6rv\u00e9ny
  a k\u00f6zbeszerz\u00e9sekr\u0151l (a m\u00e1r idezett 58\u00a7-sal egy\u00fctt).\\n\\n2004:
  Szepember 1-i hat\u00e1llyal megjelenik az MSZ 4798 beton szabv\u00e1ny: M\u0171szaki
  felt\u00e9telek, teljes\u00edtm\u0151 k\u00e9pess\u00e9g, k\u00e9sz\u00edt\u00e9s
  \u00e9s megfelel\u0151s\u00e9g, valamint az MSZ EN 206-1 alkalmaz\u00e1si felt\u00e9telei
  Magyarorsz\u00e1gon.\\n\\nM\u00e1jus 1-t\u0151l N\u00e9metorsz\u00e1gban hidakat
  m\u00e1r csak az Eurocode b\u00e1zis\u00fa \u00faj DIN szabv\u00e1nyok szerint szabad
  tervezni.\\n\\nMegjelenik az EU \u00faj k\u00f6zbeszerz\u00e9si ir\u00e1nyelve \u00e1prilis
  30-\u00e1n, egyidej\u0171leg megjelenik a magyar m\u00f3dos\u00edtott k\u00f6zbeszerz\u00e9si
  t\u00f6rv\u00e9ny m\u00e9g az 1993 \u00e9vi EU k\u00f6zbeszerz\u00e9si ir\u00e1nyelv
  szerint. \u00dajb\u00f3l kihangs\u00falyozz\u00e1k, ha m\u00e1r van nemzeti szabv\u00e1nyok
  k\u00f6z\u00e9 beemelt EU szabv\u00e1ny, akkor annak\\n\\nvan els\u0151bbs\u00e9ge,
  hogy biztos\u00edtott legyen a hat\u00e1rok n\u00e9lk\u00fcli versenysemlegess\u00e9g.
  K\u00f6zp\u00e9nb\u0151l megval\u00f3sul\u00f3 beruh\u00e1z\u00e1sokn\u00e1l nem
  szenvedhetnek k\u00fclf\u00f6ldi aj\u00e1nlattev\u0151k amiatt h\u00e1tr\u00e1nyt,
  mert valamely p\u00e1rhuzamosan m\u00e9g \u00e9rv\u00e9nyes r\u00e9gi nemzeti szabv\u00e1ny
  alkalmaz\u00e1st \u00edrnak el\u0151, ilyen k\u00f6vetelm\u00e9nyt nem enged meg
  az EU bels\u0151 piac szab\u00e1lyoz\u00e1sa.\\n\\n2005: Janu\u00e1r 1-t\u0151l
  N\u00e9metorsz\u00e1gban csakis az Eurocode b\u00e1zis\u00fa \u00faj DIN szabv\u00e1ny
  szerint szabad tart\u00f3szerkezet tervezni, \u00e9p\u00edteni.\\n\\n2006: Az egyik
  magyarorsz\u00e1gi k\u00f6zbeszerz\u00e9si ki\u00edr\u00e1s M\u0171szaki felt\u00e9telek
  szabv\u00e1nyhivatkoz\u00e1sainak 80 %-a \u00e9rv\u00e9nytelen szabv\u00e1nyokra
  hivatkozott!\\n\\nA 2005-ben be\u00e9p\u00edtett betonok 95 %-a \u00e9rv\u00e9nytelen
  szabv\u00e1ny szerint k\u00e9sz\u00fclt (a 25 \u00e9ve kiadott KGST b\u00e1zis\u00fa,
  2004. szeptember 1-\u00e9n \u00e9rv\u00e9nytelen\u00edtett szabv\u00e1ny szerint).
  A magyar \u00e9p\u00edt\u0151ipar, a tervez\u0151k \u00e9s kivitelez\u0151k gyakorlatilag
  szabot\u00e1lj\u00e1k az EU szabv\u00e1nyainak alkalmaz\u00e1s\u00e1t!\\n\\nJanu\u00e1r
  16.: \u00c9letbe l\u00e9p az \u00faj k\u00f6zbeszerz\u00e9si t\u00f6rv\u00e9ny,
  benne az 58\u00a7 sz\u00f3l a M\u0171szaki le\u00edr\u00e1sr\u00f3l.\\n\\nA szabv\u00e1nyos\u00edt\u00e1s
  nem \u00e1llami feladat, hirdeti az EU, ugyanakkor elism\u00e9ri, hogy a szabv\u00e1nyok
  a t\u00f6rv\u00e9nyhoz\u00e1s r\u00e9sz\u00e9t k\u00e9pezik, \u00e1ltaluk egyszer\u0171s\u00f6dik
  a t\u00f6rv\u00e9nyhoz\u00e1s, t\u00f6rv\u00e9nyek. Ez a kett\u0151ss\u00e9g ismeretlen
  a magyar k\u00f6z\u00e9letben, hiszen ez azt felt\u00e9telezi, hogy a civil szf\u00e9ra
  k\u00e9pes egy\u00fctt dolgozni a k\u00f6zszf\u00e9r\u00e1val, a gazdas\u00e1g szerepl\u0151i
  a politikusokkal. Ehhez el\u0151sz\u00f6r a civil szf\u00e9ra szervezet\u00e9inek
  kellene k\u00e9pesnek lenni egym\u00e1ssal a kommunik\u00e1ci\u00f3ra. A szabv\u00e1nyos\u00edt\u00e1s
  kapcs\u00e1n pl. az \u00e9p\u00edt\u0151ipar ter\u00fclet\u00e9n az MMK, M\u00c9K,
  \u00c9VOSZ, IPOSZ, M\u00c9ASZ, \u00c9TE stb. szervezeteinek egy\u00fctt kellene
  m\u0171k\u00f6dni\u00fck, mert a m\u00e9retez\u00e9si szabv\u00e1nyok nem v\u00e1laszthat\u00f3k
  k\u00fcl\u00f6n az anyagszabv\u00e1nyokt\u00f3l, term\u00e9kszabv\u00e1nyokt\u00f3l.
  Ezzel szemben ma m\u00e9g sokan a korm\u00e1nyzati szervekt\u0151l v\u00e1rnak megold\u00e1st,
  amelyek sokszor m\u00e9g szint\u00e9n nem teljesen ismerik az EU szabv\u00e1nyos\u00edt\u00e1si
  folyamat\u00e1t.\\n\\nMi a baj az EU szabv\u00e1nyaival, azaz az EN szabv\u00e1nyokkal?\\n\\nA
  magyar m\u00e9rn\u00f6k t\u00e1rsadalom egyes hangad\u00f3i m\u00e9g az egykori
  szocialista nagyv\u00e1llalatokt\u00f3l megmenek\u00edtett szabv\u00e1nyokon, szakk\u00f6nyveken
  \u00e9lnek maig is. Az elm\u00falt 15 \u00e9v alatt gyakorlatilag nem v\u00e1s\u00e1roltak
  szabv\u00e1nyokat, szakirodalmat. A f\u0151iskol\u00e1k, egyetemek csak nagy k\u00e9s\u00e9sekkel
  \u00e1lltak \u00e1t az EN szabv\u00e1nyb\u00e1zis szerinti oktat\u00e1sra. Az eg\u00e9sz
  szabv\u00e1ny-alkalmaz\u00e1si kult\u00fara m\u00e9lyre s\u00fclyedt. A szabv\u00e1nyok
  alkalmaz\u00e1s\u00e1ban a nem k\u00f6telez\u0151 elveg\u00e9szen t\u00e9ves \u00e9rtelmez\u00e9st
  kapott. A CEN t\u00e9nylegesen meghirdette, hogy a szabv\u00e1nyok alkalmaz\u00e1sa
  \u00f6nk\u00e9ntes. Tett\u00e9k ezt az\u00e9rt, mert a m\u0171szaki fejl\u0151d\u00e9st
  nem akarj\u00e1k h\u00e1tr\u00e1ltatni. A szabv\u00e1nyok sosem a m\u0171szaki \u00e9let
  \u00e9s tudom\u00e1ny aktu\u00e1lis felfedez\u00e9seit, \u00fajdons\u00e1gait tartalmazz\u00e1k,
  hanem azt n\u00e9mi k\u00e9s\u00e9ssel k\u00f6vetve a m\u0171szaki \u00e9let aktu\u00e1lis
  \u00e1ltal\u00e1nos szab\u00e1lyait. Ha valaki kell\u0151k\u00e9ppen igazolni tudja,
  hogy az \u00e9rv\u00e9nyes szabv\u00e1nyokban foglaltakn\u00e1l jobbat tud, azt
  nyugodtan alkalmazhatja. A szabv\u00e1nyok nem k\u00f6telez\u0151 volta abban sz\u00e1rmazik,
  hogy a szabv\u00e1nyok ne g\u00e1tolj\u00e1k a m\u0171szaki halad\u00e1st, az innov\u00e1ci\u00f3t.
  Szabad teh\u00e1t a m\u0171szaki \u00e9let aktu\u00e1lis szab\u00e1lyai helyett
  a leg\u00fajabb kutat\u00e1si eredm\u00e9nyeket felhaszn\u00e1lni, ha bizony\u00edthat\u00f3
  a legal\u00e1bb egyen\u00e9rt\u00e9k\u0171s\u00e9g. Szigor\u00faan tilos viszont
  olyan elavult, de esetleg m\u00e9g \u00e9rv\u00e9nyes szabv\u00e1nyokra hivatkozni
  k\u00f6zbeszerz\u00e9sekn\u00e9l, mely egy orsz\u00e1g elmaradott tervez\u00e9s\u00e9t,
  \u00e9p\u00edt\u0151ipar\u00e1rt szeretn\u00e9 el\u0151ny\u00f6kh\u00f6z juttatni
  m\u00e1s, a m\u0171szaki \u00e9let aktu\u00e1lis szintj\u00e9n \u00e1ll\u00f3 p\u00e1ly\u00e1z\u00f3kkal
  szemben. Teh\u00e1t a szabad szabv\u00e1nyv\u00e1laszt\u00e1s nem lehet visszafele
  l\u00e9p\u00e9s, hanem csakis el\u0151rel\u00e9p\u00e9s!\\n\\nKomoly gondot jelent
  az EN szabv\u00e1nyok terjedelme. Am\u00edg a tart\u00f3szerkezetek m\u00e9retez\u00e9s\u00e9re
  vonatkoz\u00f3 r\u00e9gi KGST b\u00e1zis\u00fa szabv\u00e1nyok csak cca. 800 oldalt
  tettek ki, addig az \u00faj EN szabv\u00e1nyok ennek a n\u00e9gysszeres\u00e9t.\\n\\nEzen
  \u00edr\u00e1s kezdet\u00e9n id\u00e9zett cikk v\u00e9ge a kil\u00e1t\u00e1sokr\u00f3l\\n\\nKil\u00e1t\u00e1sok:
  Eur\u00f3pa-megb\u00edz\u00e1s a j\u00f6v\u0151 gener\u00e1ci\u00f3j\u00e1nak\\n\\n\u00c1ltal\u00e1ban
  eg\u00e9sz Eur\u00f3p\u00e1ban az \u00e9p\u00edt\u00e9siogi \u00e9s m\u0171szaki
  egyes\u00fcl\u00e9s folyamat\u00e1t a mai 50-60 \u00e9ves gener\u00e1ci\u00f3 bajtja.
  Nekik olyan Eur\u00f3p\u00e1r\u00f3l vannak fogalmak, \u00e9rt\u00e9k-elk\u00e9pz\u00e9l\u00e9seik,
  mely megfelel \u00e9let\u00e9p\u00edtj\u00fck folyam\u00e1n nyert fogalmaknak az
  eur\u00f3pai gazdas\u00e1gi t\u00e9rs\u00e9gr\u0151l, az eur\u00f3pai k\u00f6z\u00f6ss\u00e9gr\u0151l.
  Ebb\u0151l k\u00f6vetkez\u0151leg az eur\u00f3pai gondolatok a nemzeti identit\u00e1sok
  ut\u00e1n foglalnak csak helyet, ezzel kapcsolatosak a c\u00e9l- \u00e9s \u00e9rt\u00e9kek\u00e9pzel\u00e9sek,
  mely elk\u00e9pzel\u00e9sekkel \u00e9let\u00fckben m\u00e1r sokkal kor\u00e1bban
  azonosultak. Ez\u00e1ltal a szabv\u00e1nyoz\u00e1s \u00e9s \u00e9p\u00edt\u00e9si
  jog ter\u00fclet\u00e9n a mai \u00e1llapototak a nemzeti korl\u00e1tok \u00e9s az
  eur\u00f3pai nagyobb szabads\u00e1guk befoly\u00e1solj\u00e1k.\\n\\nAz alattuk l\u00e9v\u0151
  koroszt\u00e1lynak, a mostani 30-50 \u00e9veseknek (akit nagyon a napi munk\u00e1jukhoz
  k\u00f6t\u00f6dnek) az iskolai k\u00e9pz\u00e9s\u00e9ben m\u00e9g nem szerepelt
  a mostani Eur\u00f3pa ilyen dimenzi\u00f3kban \u00e9s berendezked\u00e9ssel.\\n\\nEzzel
  ellent\u00e9tes az a k\u00e9p, mely pl. 2004. j\u00faniusban (n\u00e9h\u00e1ny h\u00e9ttel
  Lengyelorsz\u00e1g EU tags\u00e1g\u00e1nak kezdete ut\u00e1n) egy lengyel iskol\u00e1ban
  fogadtott: \\\"Lengyel vagyok \u00e9ppen \u00fagy, mint eur\u00f3pai \u00e1llampolg\u00e1r\\\".
  Ezek a gyerekek Eur\u00f3p\u00e1t m\u00e1r olyan fiatalon megtanulj\u00e1k pozit\u00edvan
  \u00e9rt\u00e9kelni, ahogy az a mi koroszt\u00e1lyunkban m\u00e9g lebentelen lett
  volna. \u00c9s ez az \u00faj szeml\u00e9let m\u00e1r ki fog hatni az eur\u00f3pai
  \u00e9p\u00edt\u00e9s szab\u00e1lyoz\u00e1s\u00e1ra is. Ha bizalom lesz a tov\u00e1bbiakban
  is biztos\u00edtott b\u00e9k\u00e9s politikai keretf\u00e9l\u00e9t\u00e9telek ir\u00e1nt
  \u00e9s n\u00e9mi szerencs\u00e9vel a mostani 30-as \u00e9s fiatalabb gener\u00e1ci\u00f3
  m\u00e1r csak nevetni fog a ma aktu\u00e1lis, nem egys\u00e9ges \u00e9p\u00edt\u0151ipari
  \u00e1llapotokon.\\n\\nAzonban m\u00e1r ma is valami minden k\u00f6r\u00fclm\u00e9nyek
  k\u00f6z\u00f6tt megt\u00f6rt\u00e9nik, nek\u00fcnk mindannyiunknak akcept\u00e1lnunk
  kell a m\u00e1r megalkotott szab\u00e1lyoz\u00e1sokat, meg kell tanulnunk \u00e9s
  konzekvensen alkalmaznunk kell azokat. A fenn\u00e1ll\u00f3 bib\u00e1k\u00e1t, gyenge
  helyeket \u00e9s h\u00e1tr\u00e1nyos vonzatokat, melyeket felism\u00e9r\u00fcnk
  Eur\u00f3p\u00e1n bel\u00fcl, elemezn\u00fcnk kell, mert azok k\u00e9pzik a bolh\u00e1pra
  vonatkoz\u00f3 jav\u00edt\u00e1sokat.\\n\\n\u00c9s ek\u00f6zben senki sem teheti
  meg, hogy pibenjen valamely k\u00f6zben\u0151 \u00e1llom\u00e1son, \u00e9s azzal
  nyugtassa mag\u00e1t, hogy \u00fcgyes meg fog v\u00e1ltozni, valamely szab\u00e1lyoz\u00e1st
  majd b\u00e1masor\u00e1n kiigaz\u00edtanak.\\n\\nA min\u0151s\u00e9gv\u00e9delmi
  t\u00e1rsas\u00e1g seg\u00edti \u00d6n\u00f6ket ezen j\u00e1radoz\u00e1saitban.\\n\\nMegjegyz\u00e9s:
  csak a cikk els\u0151 r\u00e9sz\u00e9t \u00e9s befejezet\u00e9t ford\u00edtottam
  le. A k\u00f6zbens\u0151 r\u00e9szek r\u00e9szletezik a m\u00e9retez\u00e9si szabv\u00e1nyok,
  tan\u00fas\u00edt\u00e1sok ellenmond\u00e1sait.\\n\\n\u00c9lekesnek tartom Stefan
  \u0150linski \u00edr\u00e1s\u00e1t, mert a n\u00e9metek sokkal el\u0151bbre j\u00e1rnak
  az El\u0151jogszab\u00e1lyok, az EN szabv\u00e1nyok alkalmaz\u00e1s\u00e1ban, mint
  mi. \u00c9lemes figyelni r\u00e1juk, hallatlan nagy a piaci verseny, a hat\u00e1rok
  n\u00e9lk\u00fcli Eur\u00f3pa kisz\u00e9les\u00edtette a versenyp\u00e1ly\u00e1t.
  A Magyarorsz\u00e1gra bet\u00f6d\u00fcl\u0151 osztr\u00e1k, n\u00e9met, francia,
  jap\u00e1n stb. \u00e9p\u00edt\u00e9si v\u00e1llalkoz\u00e1sok, az egyre nagyobb
  m\u00e9rt\u00e9k\u0171 k\u00fclf\u00f6ldi tervez\u0151i r\u00e9szv\u00e9tel messze
  meghaladja a magyar \u00e9p\u00edt\u00e9si v\u00e1llalkoz\u00e1sok, tervez\u00e9sek
  k\u00fclf\u00f6ldi r\u00e9szv\u00e9tel\u00e9t.\\n\\n**Eur\u00f3pai Uni\u00f3s \u00e9p\u00edt\u0151ipari
  inform\u00e1ci\u00f3k az interneten**\\n\\nTerm\u00e9szetesen az EUSzabv\u00e1nyoz\u00e1si
  folyamatait csak akkor lehet meg\u00e9rteni, ha folyamatosan figyelemmel k\u00eds\u00e9rj\u00fck
  a t\u00f6rt\u00e9n\u00e9seket. Ehhez a legegyszer\u0171bb m\u00f3dszer, ha ell\u00e1togatunk
  az EU honlapj\u00e1nak \\\"\u00c9p\u00edt\u0151ipar\\\" r\u00e9sz\u00e9re:\\n\\nhttp://www.europa.eu.int/comm/enterprise/construction/index_de.htm\\n\\nA
  honlap angolul, franciaul \u00e9s n\u00e9met\u00fcl \u00e9rhet\u0151 el (2006 \u00e1prilis).
  T\u00f6bb rovata csak angolul olvashat\u00f3, viszont akkor \u00e9rthet\u0151ek
  meg az \u00f6sszef\u00fcgg\u00e9sek, \u00e9s a magyar \u00e9p\u00edt\u0151ipari
  jogalkot\u00e1s, ha ezeket az anyagokat legal\u00e1bb v\u00e1zlatosan ismeri a magyar
  m\u00e9rn\u00f6k t\u00e1rsadalom.\\n\\nA 9106F\u00c9P\u00edt\u00e9si Term\u00e9k
  diktat\u00edv\u00e1 \u00e1tdolgoz\u00e1s\u00e1val kapcsolatos inform\u00e1ci\u00f3k
  helye:\\n\\nhttp://www.europa.eu.int/comm/enterprise/construction/cpdrevision/cpd_cons_de.htm\\n\\nAzon
  jogi el\u0151\u00edr\u00e1sok, melyek szerint a v\u00e1llalatok dolgoznak, a versenyk\u00e9pess\u00e9g,
  a n\u00f6veked\u00e9s \u00e9s foglalkoztat\u00e1s kulcst\u00e9nyez\u0151i. Az Eur\u00f3pai
  F\u0151l\u0151 v\u00e1llalkoz\u00e1s-politik\u00e1inak egyik fontos c\u00e9lja \u00e9ppen
  ez\u00e9rt az, hogy gondoskodjon az egyszer\u0171 \u00e9s magas sz\u00ednvonal\u00fa
  jogi k\u00f6rnyezetr\u0151l.\\n\\nEzen alapokb\u00f3l kiindulva a jogi el\u0151\u00edr\u00e1sok
  jav\u00edt\u00e1sa nagyon fontos helyet foglal el azon lisszaboni strat\u00e9gi\u00e1ban,
  melyet 2005 tavasz\u00e1n \u00fatj\u00e1ra bocs\u00e1tottak. Az iparpolitik\u00e1r\u00f3l
  k\u00f6zreadott k\u00f6zlem\u00e9ny\u00e9ben a Botts\u00e1g m\u00e9g egyszer al\u00e1h\u00fazta
  a jogi k\u00f6rnyezet jelent\u0151s\u00e9g\u00e9t \u00e9s befoly\u00e1s\u00e1t az
  ipar versenyk\u00e9pess\u00e9g\u00e9re \u00e9s termel\u00e9kenys\u00e9g\u00e9re.\\n\\nEzen
  h\u00e1tt\u00e9rb\u0151l kiindulva a Botts\u00e1g 2005. okt\u00f3berben egy k\u00f6zlem\u00e9nyt
  adott ki a jogi el\u0151\u00edr\u00e1sok egyszer\u0171s\u00edt\u00e9s\u00e9re, melyben
  az \u00e9p\u00edt\u0151ipart kiemelt ter\u00fcletk\u00e9nt hat\u00e1rozta meg, ebben
  az ipar\u00e1gban az alkalmazhat\u00f3 jogi keretek teljes hat\u00e9konys\u00e1g\u00e1t
  elemezni k\u00edv\u00e1nj\u00e1k. Ehhez a strat\u00e9gi\u00e1hoz tartozik egy dinamikus
  egyszer\u0171s\u00edt\u00e9si program, mely k\u00fcl\u00f6n\u00f6s m\u00f3dszereket
  tartalmaz a 9106F\u00c9 Ir\u00e1nyelvben foglaltak egyszer\u0171s\u00edt\u00e9s\u00e9re.\\n\\nA
  Botts\u00e1gnak az a felfog\u00e1sa, hogy ez az Ir\u00e1nyelv a kereskedelmi korl\u00e1tokat
  csak r\u00e9szben oldja fel \u00e9s nem teremti meg az optim\u00e1lis felt\u00e9teleket,
  hogy az \u00e9p\u00edt\u00e9si term\u00e9kek szabad forgalma \u00e9s alkalmaz\u00e1sa
  megval\u00f3suljon a k\u00f6z\u00f6ss\u00e9gen bel\u00fcl.\\n\\nAz Ir\u00e1nyelv
  komplexit\u00e1sa \u00e9s t\u00f6bbf\u00e9lek\u00e9ppen \u00e9rtelmezhet\u0151s\u00e9ge
  hi\u00e1nyt okoz az egy\u00e9rtelm\u0171s\u00e9gben a \u00c9 tan\u00fas\u00edt\u00e1s
  \u00e9s megjel\u00f6l\u00e9s val\u00f3di szerep\u00e9t \u00e9s jelent\u0151s\u00e9g\u00e9t
  illet\u0151en, mely az \u00e9p\u00edt\u00e9si term\u00e9kek haszn\u00e1l\u00f3i
  sz\u00e1m\u00e1ra is bizonyos k\u00e9tyekeket \u00e9breszt. Ebb\u0151l kifoly\u00f3lag
  a neh\u00e9z, t\u00fal komplex \u00e9s merev \u00e1tv\u00e9teli, alkalmaz\u00e1si
  elj\u00e1r\u00e1sok a v\u00e1llalatoknak felesleges k\u00f6lts\u00e9geket okoznak.\\n\\nEzen
  k\u00edv\u00fcl az Ir\u00e1nyelv r\u00f6gz\u00edti, hogy az eur\u00f3pai m\u0171szaki
  specifik\u00e1ci\u00f3knak, k\u00fcl\u00f6n\u00f6sen a harmoniz\u00e1lt szabv\u00e1nyoknak
  a meglete \\\"de facto\\\" el\u0151felt\u00e9telei az \u00e9p\u00edt\u00e9si term\u00e9kek
  \u00c9 tan\u00fas\u00edt\u00e1s\u00e1nak. 16\u00e9vvel ezen felt\u00e9tel kihirdet\u00e9se
  ut\u00e1n m\u00e9gis csak mintegy 50% \u00e1ll rendelkez\u00e9sre a sz\u00fcks\u00e9ges
  m\u0171szaki specifik\u00e1ci\u00f3knak.\\n\\nS\u00fagul a rendszer szavahihet\u0151s\u00e9ge
  amiatt is csorb\u00e1t szenved, ahogyan a krit\u00e9riumokat az egyes tagorsz\u00e1gokban
  alkalmazz\u00e1k, ahogyan az Ir\u00e1nyelv a bejelentett tan\u00fas\u00edt\u00f3
  helyek megnevez\u00e9s\u00e9t \u00e9s ellen\u0151rz\u00e9s\u00e9t el\u0151\u00edr\u00e1nyozza,
  hogy azut\u00e1n az egyes elj\u00e1r\u00e1sok ir\u00e1nti bizalom meglegyen.\\n\\nA
  felsoroltak miatt a Botts\u00e1g az Ir\u00e1nyelv egyszer\u0171s\u00edt\u00e9s\u00e9nek
  t\u00f6rv\u00e9nytervezet el\u0151k\u00e9sz\u00edt\u00e9se el\u0151tt az \u00e9p\u00edt\u00e9si
  szektor r\u00e9sztvev\u0151i sz\u00e9les r\u00e9teg\u00e9nek r\u00e9szv\u00e9tel\u00e9t
  k\u00e9ri, hogy megadj\u00e1k a\\n\\nv\u00e1ltoztat\u00e1si vagy elhagy\u00e1si
  javaslataiak az\u00e9rt, hogy ez a t\u00f6rv\u00e9nycsomag egyszer\u0171bb\u00e9
  \u00e9s \u00e1tl\u00e1that\u00f3bb\u00e1 v\u00e1ljon, hat\u00e9konys\u00e1ga javuljon
  \u00e9s az alkalmaz\u00e1s k\u00f6lts\u00e9gei cs\u00f6kkennjenek. Ez a r\u00e9szv\u00e9tel
  \u00e9rinti a legfontosabb specifikus t\u00e9nyez\u0151ket, melyeket az \u00e9p\u00edt\u00e9si
  term\u00e9k ir\u00e1nyelv fel\u00fclvizsg\u00e1latakor figyelembe kell venni an\u00e9lk\u00fcl,
  hogy k\u00e1rosan hasson a folyamatban l\u00e9v\u0151 egy\u00e9b horizont\u00e1lis
  t\u00f6rv\u00e9nyjavaslatokra, melyek ezen Ir\u00e1nyelvre is kihat\u00e1ssal lehetnek,
  mint pl. az \u00dajalkalmaz\u00e1sok fel\u00fclvizsg\u00e1lat\u00e1n\u00e1l.\\n\\nA
  Szabv\u00e1nyos\u00edt\u00e1si B\u00edr\u00f3s\u00e1g k\u00f6zlem\u00e9nye a K\u00f6z\u00f6ss\u00e9g
  lisszaboni programj\u00e1nak v\u00e9grehajt\u00e1s\u00e1r\u00f3l: Oktatikai keretek
  az EUgy\u00e1ripar\u00e1nak meger\u0151s\u00edt\u00e9s\u00e9re - egy integr\u00e1ltabb
  iparpolitikai megk\u00f6zel\u00edt\u00e9s fel\u00e9.\\n\\nKM 2005/418 oldal, let\u00f6lthet\u0151
  magyarul.\\n\\nhttp://europa.eu.int/eur-lex/lex/LexUriServ/site/hu/com/2005/com2005_0474hu01.pdf\\n\\nA
  Szabv\u00e1nyos\u00edt\u00e1si B\u00edr\u00f3s\u00e1g k\u00f6zlem\u00e9nye a lisszaboni
  strat\u00e9gia f\u00e9lid\u00e9j\u00e9r\u0151l, az egyszer\u0171bb jogi k\u00f6rnyezet
  megteremt\u00e9s\u00e9r\u0151l.\\n\\nKM 2005/35, 6 oldal, let\u00f6lthet\u0151 magyarul.\\n\\nhttp://europa.eu.int/eur-lex/lex/LexUriServ/site/hu/com/2005/com2005_0535hu01.pdf\\n\\nK\u00e1roly
  ismertet\u00e9s tal\u00e1lhat\u00f3 a harmoniz\u00e1lt EUszabv\u00e1nyokr\u00f3l
  D\u00f3kusay Tibor honlapj\u00e1n.\\n\\nhttp://www.betonopus.hu/notesz/fogalomtar/16-harmonizalt-eu/16-harmonizalt-eu.htm\\n\\nA
  szabv\u00e1ny alkalmaz\u00e1sokr\u00f3l r\u00e9szletesebb anyagok olvashat\u00f3k
  a Magyar Bonelemgy\u00e1rt\u00f3 Sz\u00f6vets\u00e9g honlapj\u00e1n, a Szabv\u00e1nyos\u00edt\u00e1s
  rovatban.\\n\\nwww.webforum.com/mabesz\\n\\nOktat\u00e1s\u00fcgy\\n\\nSzakiskolai
  fejleszt\u00e9si program II\\n\\nDr. Bartus Zsolt\\n\\nAz Oktat\u00e1si Miniszt\u00e9rium
  szakk\u00e9pz\u00e9si helyettes \u00e1llamtitk\u00e1rs\u00e1g\u00e1nak ir\u00e1ny\u00edt\u00e1s\u00e1val
  meg\u00faj\u00edt\u00f3 c\u00e9l\u00fa fejleszt\u00e9si strat\u00e9gia k\u00e9sz\u00fclt
  a szakiskol\u00e1k sz\u00e1m\u00e1ra Szakiskolai fejleszt\u00e9si program c\u00edmmel.
  Megval\u00f3s\u00edt\u00e1sa 2003-ban kezd\u0151d\u00f6tt \u00e9s 2006-ban fejez\u0151dik
  be.\\n\\nA 2005-2013 k\u00f6z\u00f6tti id\u0151szakban a SZAKK\u00c9PZ\u00c9S FEJLESZT\u00c9SI
  STRAT\u00c9GIA \u00e9rtelm\u00e9ben ki kell terjeszteni a Szakiskolai fejleszt\u00e9si
  programot, jav\u00edtani kell ezen iskol\u00e1k infrastruktur\u00e1lis felt\u00e9teleit
  is. Ennek szellem\u00e9ben indul a Szakiskolai fejleszt\u00e9si program II., melynek
  megval\u00f3sul\u00e1s\u00e1\u00e9rt a Nemzeti Szakk\u00e9pz\u00e9si Int\u00e9zet
  felel.\\n\\nKulcsszavak: munkaer\u0151-piaci ig\u00e9nyek, tartalmi \u00e9s m\u00f3dszertani
  fejleszt\u00e9s, kerettanterv\\n\\nMi\u00e9rt volt sz\u00fcks\u00e9g a Szakiskolai
  fejleszt\u00e9si program kiterjeszt\u00e9s\u00e9re?\\n\\nA 2003-ban ind\u00edtott
  program hat\u00e1sa k\u00e9ts\u00e9gtelen\u00fcl kedvez\u0151, de az akkor tett
  meg\u00e1llap\u00edt\u00e1sok jelent\u0151s r\u00e9sze ma is \u00e9rv\u00e9nyes.
  Az ut\u00f3bbi \u00e9vtizedben a szakiskol\u00e1k n\u00e9pszer\u0171s\u00e9ge cs\u00f6kkent.
  A szakiskol\u00e1kban v\u00e9gzett szakmunk\u00e1sok l\u00e9tsz\u00e1ma - a 2002-es
  adatok szerint - csup\u00e1n a fele volt a piac aktu\u00e1lis felvev\u0151 k\u00e9pess\u00e9g\u00e9nek.
  A szakiskol\u00e1ban tanul\u00f3k buk\u00e1si, lemorzsol\u00f3d\u00e1si ar\u00e1nya
  tov\u00e1bbra is igen magas. Tov\u00e1bbra is s\u00falyos gond, hogy a szakiskol\u00e1ba
  jelentkez\u0151k k\u00f6z\u00f6tt sok az olyan fiatal, akinek speci\u00e1lis gondoskod\u00e1sra
  van sz\u00fcks\u00e9ge szociokultur\u00e1lis h\u00e1tr\u00e1nyai, tanul\u00e1si
  \u00e9s magatart\u00e1si probl\u00e9m\u00e1i miatt. A szakiskol\u00e1ban foly\u00f3
  munk\u00e1t ma is nehez\u00edti a hi\u00e1nyos t\u00e1rgyi, anyagi felt\u00e9telek,
  tov\u00e1bb\u00e1 a pedag\u00f3gusok gyakran jogosan emlegetett szakmai mag\u00e1ra
  hagyatotts\u00e1ga.\\n\\nHa tov\u00e1bb nyilik az oll\u00f3 a munkaer\u0151-piaci
  sz\u00fcks\u00e9gletek \u00e9s a kibocs\u00e1tott szakmunk\u00e1sok sz\u00e1ma \u00e9s
  k\u00e9pzetts\u00e9g\u00e9nek sz\u00ednvonala k\u00f6z\u00f6tt, a magyar gazdas\u00e1g
  helyzete s\u00falyosbodik.\\n\\nA program kiterjeszt\u00e9s\u00e9nek c\u00e9lkit\u0171z\u00e9se,
  m\u0171k\u00f6d\u00e9se\\n\\nA Szakiskolai fejleszt\u00e9si program II.-nek a t\u00e1rsadalmi
  \u00e9s az egy\u00e9ni \u00e9rdekeket \u00f6sszehangoltan kell szolg\u00e1lnia.
  A tartalmi \u00e9s m\u00f3dszertani fejleszt\u00e9s eredm\u00e9nyek\u00e9ppen jelen\u0151sen
  jav\u00edtani k\u00edv\u00e1njuk annak es\u00e9ly\u00e9t, hogy a tanul\u00f3k birtokolj\u00e1k
  azokat a k\u00e9pess\u00e9geket, amelyek seg\u00edts\u00e9g\u00e9vel \u00e9letp\u00e1lya-\u00e9p\u00edt\u00e9s\u00fck
  sikeres lehet. A gazdas\u00e1g m\u0171k\u00f6d\u0151k\u00e9pess\u00e9g\u00e9nek
  meg\u0151rz\u00e9se \u00e9rdek\u00e9ben javul\u00f3 ar\u00e1nyban kell hozz\u00e1j\u00e1rulni
  a megfelel\u0151 l\u00e9tsz\u00e1mu \u00e9s j\u00f3l k\u00e9pzett szakmunk\u00e1sok
  ir\u00e1nti munkaer\u0151-piaci ig\u00e9nyek kiel\u00e9g\u00edt\u00e9s\u00e9hez.\\n\\nA
  program \u00e1ltal\u00e1nos c\u00e9lja, hogy jav\u00edtsa a szakk\u00e9pz\u00e9s
  min\u0151s\u00e9g\u00e9t, n\u00f6velje a v\u00e9gzettek elhelyezked\u00e9s\u00e9nek
  es\u00e9lyeit, \u00e9s ezeken kereszt\u00fcl er\u0151s\u00edtsse a k\u00e9pz\u00e9s
  \u00e9s a k\u00e9pz\u00e9sben r\u00e9sztvev\u0151k szakmai \u00e9s t\u00e1rsadalmi
  preszt\u00edzs\u00e9t. Adjon megb\u00edzhat\u00f3 alapot a sikeres szakmai \u00e9let\u00fathoz
  elengedhetetlen tov\u00e1bbi ismeretek b\u0151v\u00edt\u00e9s\u00e9hez, a tanul\u00e1shoz
  \u00e9s fejl\u0151d\u00e9shez, k\u00fcl\u00f6n\u00f6s tekintettel az idegen nyelvi,
  valamint az informatikai kompetenci\u00e1k n\u00f6vel\u00e9s\u00e9re. \u00d3 az,
  hogy a program legyen \u00f6sszhangban az eur\u00f3pai uni\u00f3s szakk\u00e9pz\u00e9si
  ir\u00e1nyelvekkel, valamint a Nemzeti fejleszt\u00e9si terv int\u00e9zked\u00e9seivel.
  A t\u00e1j\u00e9koz\u00f3d\u00e1st k\u00e9t honlap is seg\u00edti, a wsszi.hu \u00e9s
  a wzkma.hu.\\n\\nA program feladata a jogszab\u00e1lyi k\u00f6rnyezet megteremt\u00e9se,
  a kerettantervek kidolgoz\u00e1sa, hogy a projekt m\u00f3dszer alkalmaz\u00e1sa
  felmen\u0151 rendszerben lehet\u0151v\u00e9 v\u00e1ljon a r\u00e9gi \u00e9s az \u00faj
  SE iskol\u00e1kban is.\\n\\nHozz\u00e1j\u00e1rul\u00e1s a tan\u00e1rk\u00e9pz\u00e9s
  \u00e9s tan\u00e1r-tov\u00e1bbk\u00e9pz\u00e9s, valamint a vezet\u0151k\u00e9pz\u00e9s
  korszer\u0171s\u00edt\u00e9s\u00e9hez. A szakiskol\u00e1k nevel\u0151test\u00fclet\u00e9nek
  felk\u00e9sz\u00edt\u00e9se a m\u00f3dszertani v\u00e1ltoz\u00e1sokkal j\u00e1r\u00f3
  feladatokra. A szakiskolai tan\u00e1rok, oktat\u00f3k, valamint a gyakorlati k\u00e9pz\u00e9sbe
  bekapcsol\u00f3d\u00f3k korszer\u0171 pedag\u00f3giai, m\u00f3dszertani, idegen
  nyelvi, oktat\u00e1stechnikai, informatikai k\u00e9pz\u00e9se. A szakmai mentorh\u00e1l\u00f3zat
  kialak\u00edt\u00e1sa.\\n\\nA szakiskolai k\u00f6zismereti tantervek, tananyagok,
  k\u00f6vetelm\u00e9nyek fel\u00fclvizsg\u00e1lata \u00e9s \u00e1tdolgoz\u00e1sa.
  A p\u00e1lyaorient\u00e1ci\u00f3, \u00e9letp\u00e1lya-\u00e9p\u00edt\u00e9s tanterv\u00e9nek,
  tananyag\u00e1nak \u00e9s tan\u00edt\u00e1s-m\u00f3dszertan\u00e1nak meg\u00faj\u00edt\u00e1sa.
  Olyan tananyagok, programok k\u00e9sz\u00edt\u00e9se, m\u00f3dszerek elterjeszt\u00e9se,
  illetve elj\u00e1r\u00e1sok kidolgoz\u00e1sa, adapt\u00e1l\u00e1sa, amelyek az alapfok\u00fa
  iskolai v\u00e9gzetts\u00e9ggel nem rendelkez\u0151ket felk\u00e9sz\u00edtik a szakk\u00e9pz\u00e9sre,
  illetve a lemorzsol\u00f3d\u00f3kat reintegr\u00e1lj\u00e1k az iskolai rendszer\u0171
  szakk\u00e9pz\u00e9sbe. A szakmai - szakter\u00fcleti \u00e9s szakmacsoportos -
  tantervek, tananyagok, tanul\u00e1siir\u00e1ny\u00edt\u00e1ssal kapcsolatos m\u00f3dszerek,
  k\u00f6vetelm\u00e9nyek fel\u00fclvizsg\u00e1lata \u00e9s \u00e1tdolgoz\u00e1sa.\\n\\nAz
  int\u00e9zm\u00e9nyek \u00f6nfeljegyz\u0151, folyamatszab\u00e1lyoz\u00f3, hat\u00e9konys\u00e1g-elemz\u0151
  tev\u00e9kenys\u00e9g\u00e9nek meg\u00e9r\u0151s\u00edt\u00e9se, ehhez a felt\u00e9telek
  jav\u00edt\u00e1sa. A szakiskol\u00e1k vezet\u00e9s\u00e9nek, fentart\u00f3j\u00e1nak,
  \u00e9s az iskol\u00e1hoz kapcsol\u00f3d\u00f3 gyakorlati k\u00e9pz\u0151hely k\u00e9pviseletj\u00e9nek
  felk\u00e9sz\u00edt\u00e9se a korszer\u0171 iskolafejleszt\u00e9sre \u00e9s -vezet\u00e9sre,
  a rendszerszer\u0171 min\u0151s\u00e9gfejleszt\u00e9sre.\\n\\nAz int\u00e9zm\u00e9nyek
  fejleszt\u00e9s\u00e9t, pedag\u00f3giai feladatait, a k\u00f6zismereti \u00e9s szakmai
  tant\u00e1rgyak hat\u00e9konyabb tan\u00edt\u00e1s\u00e1t \u00e9s tanul\u00e1s\u00e1t
  szolg\u00e1l\u00f3 t\u00e1rgyi eszk\u00f6z\u00f6k biztos\u00edt\u00e1sa. Az elm\u00e9leti
  \u00e9s gyakorlati tud\u00e1s m\u00e9r\u00e9s\u00e9re szolg\u00e1l\u00f3 standardiz\u00e1lt
  eszk\u00f6zrendszer megteremt\u00e9se \u00e9s alkalmaz\u00e1sa.\\n\\nA Szakiskolai
  fejleszt\u00e9si program II. a h\u00e1tr\u00e1nyos helyzet\u0171ek reintegr\u00e1ci\u00f3j\u00e1ra,
  a k\u00f6zismereti oktat\u00e1sra \u00e9s szakmai alapoz\u00e1sra, a szakk\u00e9pz\u00e9si
  \u00e9vfolyamokon a m\u00f3dszertani fejleszt\u00e9sre, a szakiskolai m\u00e9r\u00e9s\u00e9rt\u00e9kel\u00e9sre
  \u00e9s az iskolai \u00f6n- \u00e9s min\u0151s\u00e9gfejleszt\u00e9sre ir\u00e1nyul.
  Tov\u00e1bbi eleme a monitoring, \u00e9s a programhoz kapcsol\u00f3d\u00f3 - a programban
  k\u00f6zvetlen\u00fcl r\u00e9szt nem vev\u0151 iskol\u00e1k sz\u00e1m\u00e1ra is
  (r\u00e9szben vagy eg\u00e9szsben) nyitott - tan\u00e1cskoz\u00e1sok, kiadv\u00e1nyok,
  szakmai m\u0171helyek, p\u00e1ly\u00e1zatok. A 9-10. \u00e9vfolyamok jellemz\u0151je,
  hogy valamennyinek r\u00e9sz\u00e9t k\u00e9pezi a tartalomfejleszt\u00e9s, amely
  kiterjed a tantervekre, tananyagokra, tan\u00e1ri h\u00e1tt\u00e9ranyagokra egyar\u00e1nt.
  A korm\u00e1nyhat\u00e1rozat \u00e9s a NAT szerint a tan\u00e1rok, gyakorlati oktat\u00f3k,
  vezet\u0151k tov\u00e1bbk\u00e9pz\u00e9se; valamint a t\u00e1rgyi felt\u00e9telek
  megteremt\u00e9se, illetve korszer\u0171s\u00edt\u00e9se, azaz az eszk\u00f6zbeszerz\u00e9s
  a 11-13. \u00e9vfolyamon is megval\u00f3sul. A program eredm\u00e9nyeit m\u00e1r
  a megval\u00f3sul\u00e1si szakaszban terjeszthet\u0151v\u00e9, illetve hozz\u00e1f\u00e9rhet\u0151v\u00e9
  tessz\u00fck azok sz\u00e1m\u00e1ra is, akik k\u00f6zvetlen\u00fcl nem vesznek r\u00e9szt
  a programban.\\n\\nA programba p\u00e1ly\u00e1zat \u00fatj\u00e1n ker\u00fclhettek
  be a szakiskol\u00e1k, 70 iskola nyerte el a csatlakoz\u00e1s lehet\u0151s\u00e9g\u00e9t.
  A fejleszt\u0151 munka az \u00e9v elej\u00e9n elkezd\u0151d\u00f6tt \u00e9s a fentebb
  elmondott feladatok megval\u00f3sul\u00e1s\u00e1r\u00f3l, teh\u00e1t m\u00e1r eredm\u00e9nyr\u0151l
  is be tudok sz\u00e1molni, ugyanis a program sor\u00e1n kifejlesztett \u00faj kerettantervek
  elfogad\u00e1sra ker\u00fcltek, az Oktat\u00e1si Miniszt\u00e9rium honlapj\u00e1n
  a vonatkoz\u00f3 rendelettervezet elolvashat\u00f3.\\n\\n**Az \u00faj kerettanterv**\\n\\nA
  kilencedik-tizedik \u00e9vfolyamos szakiskolai kerettanterv c\u00e9lja az oktat\u00e1s
  hat\u00e9konys\u00e1g\u00e1nak jav\u00edt\u00e1sa, a lemorzsol\u00f3d\u00e1s cs\u00f6kkent\u00e9se,
  a tanul\u00f3k felk\u00e9sz\u00edt\u00e9se a szakmatanul\u00e1s elkezd\u00e9s\u00e9re
  \u00e9s - egyes \u00e1gazatokban - a tanul\u00f3szerz\u0151d\u00e9s keret\u00e9ben
  foly\u00f3 szakk\u00e9pz\u00e9sre is.\\n\\nA szakiskolai kerettanterv h\u00e1romszint\u0171.
  A kerettanterv bevezet\u0151je megfogalmazza a kerettanterv \u00e1ltal\u00e1nos
  c\u00e9lj\u00e1t, felv\u00e1zolja a tant\u00e1rgyak rendszer\u00e9t, aj\u00e1nl\u00e1st
  fogalmaz meg a p\u00e1lyaorient\u00e1ci\u00f3ra, a szakmai el\u0151k\u00e9sz\u00edt\u0151,
  szakmai alapoz\u00f3 oktat\u00e1s, illetve a szakmai elm\u00e9leti \u00e9s gyakorlati
  k\u00e9pz\u00e9s id\u0151beli tagol\u00e1s\u00e1ra, id\u0151kereteire, ar\u00e1nyaira.
  A tant\u00e1rgyak \u00e9s m\u0171velts\u00e9gter\u00fcletek tantervei aj\u00e1nl\u00e1st
  tesznek a nevel\u00e9s \u00e9s oktat\u00e1s c\u00e9lj\u00e1ra, a tant\u00e1rgyak
  rendszer\u00e9re, az egyes tant\u00e1rgyak t\u00e9mak\u00f6reire, a t\u00e9mak\u00f6r\u00f6kr\u0151l
  tartalm\u00e1ra, a tev\u00e9kenys\u00e9gekre, a fejleszt\u00e9si feladatokra, a
  tant\u00e1rgyak \u00e9vfolyamonk\u00e9nti k\u00f6vetelm\u00e9nyeire, a k\u00f6vetelm\u00e9nyek
  teljes\u00edt\u00e9s\u00e9hez rendelkez\u00e9sre \u00e1ll\u00f3 id\u0151keretre,
  a v\u00e1rhat\u00f3 eredm\u00e9nyekre.\\n\\nA tant\u00e1rgyak \u00e9s m\u0171velts\u00e9gter\u00fcletek
  tanterveit feladatbank (projektbank) eg\u00e9sz\u00edti ki. Ez a tant\u00e9rv harmadik
  szintje. A szakiskol\u00e1k a feladatbank (projektbank) projektin\u00e1lataira \u00e9p\u00edtve
  alak\u00edtj\u00e1k ki a tanul\u00f3k fejleszt\u00e9s\u00e9t szolg\u00e1l\u00f3
  tev\u00e9kenys\u00e9gszerviz\u00fcket. Saj\u00e1t projekteket is fejleszthetnek.
  A tev\u00e9kenys\u00e9galap\u00fa oktat\u00e1s megval\u00f3s\u00edt\u00e1sa k\u00fcl\u00f6n\u00f6sen
  fontos a kilencedik \u00e9vfolyamon szerepl\u0151 gyakorlati oktat\u00e1s \u00e9s
  a 10. \u00e9vfolyamon foly\u00f3 szakmai alapoz\u00e1s sor\u00e1n. A kerettanterv
  javaslata szerint a feladatbankban szerepl\u0151 komplex feladatokra (projektek)
  \u00e9p\u00fcl a gyakorlati k\u00e9pz\u00e9s \u00e9s a szakmai alapoz\u00e1s, s
  ehhez illeszthet\u0151k egyes term\u00e9szetsmereti \u00e9s matematikai t\u00e9mak\u00f6r\u00f6k
  is. A projektalap\u00fa oktat\u00e1s kiterjeszt\u00e9se az \u00e1ltal\u00e1nos m\u0171velts\u00e9get
  megalapoz\u00f3 k\u00e9pz\u00e9s ter\u00fclet\u00e9n is indokolt.\\n\\nA szakiskola
  kilenc-tizedik \u00e9vfolyamain a k\u00f6telez\u0151 tan\u00f3r\u00e1i foglalkoz\u00e1s
  id\u0151kerete napi 5,5 \u00f3ra, heti 27,5 \u00f3ra. A k\u00f6telez\u0151 \u00e9s
  szabadon v\u00e1laszthat\u00f3 \u00f3r\u00e1k \u00f6sszege egy tan\u00edt\u00e1si
  h\u00e9ten a k\u00f6zoktat\u00e1sr\u00f3l sz\u00f3l\u00f3 t\u00f6rv\u00e9ny 52.
  \u00a7-\u00e1ban meghat\u00e1rozott id\u0151keretet a hetedik-tizenharmadik \u00e9vfolyamon
  legfeljebb n\u00e9gy tan\u00edt\u00e1si \u00f3r\u00e1val haladhatja meg. A kerettanterv
  a k\u00f6telez\u0151 tan\u00f3r\u00e1i foglalkoz\u00e1sok heti 27,5 \u00f3r\u00e1j\u00e1ra
  fogalmaz meg aj\u00e1nl\u00e1sokat. A jogszab\u00e1ly lehet\u0151v\u00e9 teszi,
  hogy a szakiskol\u00e1k a k\u00f6telez\u0151 tan\u00f3r\u00e1i foglalkoz\u00e1sok
  legfeljebb negyven sz\u00e1zalek\u00e1ban szakmai alapoz\u00f3 elm\u00e9leti \u00e9s
  gyakorlati oktat\u00e1st folytassanak.\\n\\nMegfelel\u0151s\u00e9g nyom\u00f3szil\u00e1rds\u00e1g
  szerint\\n\\n- Informit\u0151r (backfestigke\u00edthet)\\n- Informit\u0151r compressive
  strength (angol)\\n- Informit\u0151r r\u00e9sistance \u00e0 la compression (francia)\\n\\nA
  szil\u00e1rd betont \u00e1ltal\u00e1ban nyom\u00f3szil\u00e1rds\u00e1g\u00e1val,
  tests\u0171r\u0171s\u00e9g\u00e9vel (l\u00e1sd: S\u0171r\u0171s\u00e9g), k\u00fcl\u00f6nleges
  esetben fagy\u00e1ll\u00f3s\u00e1g\u00e1val, korrozi\u00f3-\u00e1ll\u00f3s\u00e1g\u00e1val,
  v\u00edzz\u00e1r\u00f3s\u00e1g\u00e1val, kop\u00e1s\u00e1ll\u00f3s\u00e1g\u00e1val
  stb. kell jelemezni, \u00e9s ezek alapj\u00e1n az MSZ EN 206-1:2002 eur\u00f3pai
  szabv\u00e1ny, illetve annak nemzeti alkalmaz\u00e1si dokumentuma, az MSZ 4798-1:2004
  szerint kell oszt\u00e1lyba sorolni. A szil\u00e1rd beton oszt\u00e1lyba sorol\u00e1s\u00e1t
  az MSZ 4798-1:2004 szabv\u00e1ny 4.3. szakasza, vizsg\u00e1lat\u00e1t \u00e9s k\u00f6vetelm\u00e9nyeit
  5.5. szakasza, megfelel\u0151s\u00e9g\u00e9nek felt\u00e9teleit \u00e9s ellen\u0151rz\u00e9s\u00e9t
  8. fejezete t\u00e1rgyalja.\\n\\nA beton akkor felel meg a nyom\u00f3szil\u00e1rds\u00e1gi
  k\u00f6vetelm\u00e9nynek, ha teljes\u00edti az MSZ 4798-1:2004 szabv\u00e1ny 8.2.1.
  szakasz\u00e1ban, valamint A \u00e9s B mell\u00e9klet\u00e9ben foglalt felt\u00e9teleket,
  amelyeket a k\u00f6vetkez\u0151kben \u00e9rtelmezz\u00fck.\\n\\nA szil\u00e1rd (\u00e1ltal\u00e1ban
  28 napos kor\u00fa), azonos felt\u00e9telekkel gy\u00e1rtott beton nyom\u00f3szil\u00e1rds\u00e1g\u00e1t
  - \u00e9s egyidej\u0171leg a tests\u0171r\u0171s\u00e9g\u00e9t -\\n\\n- vagy a t\u00f6bb
  egyedi mint\u00e1b\u00f3l k\u00e9sz\u00edtett, mint\u00e1nk\u00e9nti egyetlen pr\u00f3batest
  (p\u00e9ld\u00e1ul 15 minta = 15 pr\u00f3batest, vagy 9 minta = 9 pr\u00f3batest
  stb.) vizsg\u00e1lat\u00e1b\u00f3l kapott egyedi eredm\u00e9nyek \u00e1tlagak\u00e9nt,
  ami egy vizsg\u00e1lati eredm\u00e9ny (\u00e1ltal\u00e1ban a folyamatos gy\u00e1rt\u00e1s
  esete, illetve a beton azonos\u00edt\u00f3 vizsg\u00e1lata);\\n\\n- vagy t\u00f6bb
  egyedi minta eset\u00e9n az egy mint\u00e1b\u00f3l k\u00e9sz\u00edtett k\u00e9t,
  illetve t\u00f6bb ugyanazon kor\u00fa pr\u00f3batest (p\u00e9ld\u00e1ul 1 minta
  = 3 pr\u00f3batest) vizsg\u00e1lat\u00e1b\u00f3l kapott \u00e1tlag eredm\u00e9nyek
  (p\u00e9ld\u00e1ul 35 minta = 35 \u00e1tlag eredm\u00e9ny) \u00e1tlagak\u00e9nt,
  ami egy vizsg\u00e1lati eredm\u00e9ny (\u00e1ltal\u00e1ban a kezdeti gy\u00e1rt\u00e1s
  esete) lehet megadni.\\n\\nA minta vagy a kever\u0151g\u00e9pben egy kever\u00e9si
  ciklus alatt el\u0151\u00e1ll\u00edtott friss betonb\u00f3l, vagy egy sz\u00e1ll\u00edtm\u00e1nyb\u00f3l
  (egy j\u00e1rm\u0171b\u0151l vagy sz\u00e1ll\u00edt\u00f3tart\u00e1lyb\u00f3l) elk\u00fcl\u00f6n\u00edtett,
  az \u00e1tlagos min\u0151s\u00e9get k\u00e9pvisel\u0151, egy vagy t\u00f6bb pr\u00f3batest
  k\u00e9sz\u00edt\u00e9s\u00e9re \u00e9s egy\u00e9b vizsg\u00e1latok v\u00e9gz\u00e9s\u00e9re
  elegend\u0151 friss beton mennyis\u00e9g (MSZ 4798-1:2004 szabv\u00e1ny 3.1.19.,
  3.1.20. \u00e9s 3.1.51. szakasza).\\n\\nHa egy mint\u00e1b\u00f3l k\u00e9t vagy
  t\u00f6bb pr\u00f3batest k\u00e9sz\u00fcl, \u00e9s a vizsg\u00e1lati \u00e9rt\u00e9kek
  terjedelem (\\\\(T\\\\)) nyom\u00f3szil\u00e1rds\u00e1g (\\\\(f\\\\)) eset\u00e9n
  az \u00e1tlag (\\\\(f_m\\\\)) 15%-\u00e1n\u00e1l, tests\u0171r\u0171s\u00e9g (\\\\(p\\\\))
  eset\u00e9n az \u00e1tlag (\\\\(p_m\\\\)) 4%-\u00e1n\u00e1l nagyobb, akkor az eredm\u00e9nyeket
  el kell vetni, hacsak az egyik egyedi vizsg\u00e1lati eredm\u00e9ny igazolhat\u00f3
  m\u00f3don el nem vethet\u0151, \u00edrja az MSZ EN 206-1:2000 szabv\u00e1ny 220.127.116.11.
  szakasza, illetve B2. fejezete. Eszerint teh\u00e1t, ha egy mint\u00e1b\u00f3l k\u00e9t
  vagy t\u00f6bb pr\u00f3batest k\u00e9sz\u00fcl:\\n\\n\\\\[ T_s \\\\leq 0,15; f_m
  \\\\]\\n\\\\[ T_s \\\\leq 0,04; p_m \\\\]\\n\\nkell legyen.\\n\\nHa egy mint\u00e1b\u00f3l
  k\u00e9sz\u00edtett h\u00e1rom pr\u00f3batest vizsg\u00e1lat\u00e1ra alkalm\u00e1val
  csak az egyik egyedi \u00e9rt\u00e9k esik k\u00edv\u00fcl a megengedett terjedelemn\u00e9l,
  akkor ezt az \u00e9rt\u00e9ket ki lehet hagyni, \u00e9s a m\u00e1sik k\u00e9t \u00e9rt\u00e9k
  \u00e1tlag\u00e1t szabad vizsg\u00e1lati eredm\u00e9nyk\u00e9nt elfogadni. P\u00e9ld\u00e1ul
  legyen h\u00e1rom pr\u00f3batest nyom\u00f3szil\u00e1rds\u00e1g vizsg\u00e1lati
  eredm\u00e9nye 29,0; 32,8; 34,2 N/mm\u00b2, amelyek \u00e1tlaga: 32,0 N/mm\u00b2,
  terjedelem: 5,2 N/mm\u00b2. Az \u00e1tlag 15%-a, azaz a megengedett terjedelem:
  4,8 N/mm\u00b2, amelyet a terjedelem tapasztalati \u00e9rt\u00e9ke (5,2 N/mm\u00b2)
  meghalad. A megengedett terjedelemhez tartoz\u00f3 als\u00f3 nyom\u00f3szil\u00e1rds\u00e1gi
  hat\u00e1r\u00e9rt\u00e9k: 32,0 - 4,8/2 = 29,6 N/mm\u00b2, amelyn\u00e9l kisebb
  \u00e9s elhagyhat\u00f3 egyedi \u00e9rt\u00e9k: 29,0 N/mm\u00b2. Ha a megmaradt
  k\u00e9t adatnak a terjedelem is nagyobb, mint nyom\u00f3szil\u00e1rds\u00e1g eset\u00e9n
  az \u00e1tlag 15%-a, \u00e9s tests\u0171r\u0171s\u00e9g eset\u00e9n az \u00e1tlag
  4%-a, akkor az adott minta vizsg\u00e1lati eredm\u00e9ny\u00e9t (teh\u00e1t a k\u00e9t,
  h\u00e1rom vagy t\u00f6bb egyedi eredm\u00e9nyt egy\u00fcttesen) nem szabad az \u00e9rt\u00e9kel\u00e9sbe
  bevonni. Ebben az elj\u00e1r\u00e1sban van bizonyos \u00f6nk\u00e9nyess\u00e9g,
  amelyet helyes lenne szab\u00e1lyoz\u00e1ssal feloldani.\\n\\nA fenti k\u00f6vetelm\u00e9ny
  az egy mint\u00e1b\u00f3l k\u00e9sz\u00edtett pr\u00f3batestek nyom\u00f3szil\u00e1rds\u00e1g\u00e1nak
  megengedett terjedelem\u00e9t az \u00e1tlag f\u00fcggv\u00e9ny\u00e9ben adja meg,
  a terjedelem pedig nem f\u00fcggetlen a sz\u00f3r\u00e1st\u00f3l, teh\u00e1t az
  eur\u00f3pai szabv\u00e1nynak ez a felt\u00e9tele arra \u00e9p\u00fcl, hogy a nyom\u00f3szil\u00e1rds\u00e1g
  sz\u00f3r\u00e1sa (\u00e9s \u00e1ltala a terjedelem) az \u00e1tlag f\u00fcggv\u00e9nye
  (1. \u00e1bra).\\n\\nAz egy\u00fctt \u00e9rt\u00e9ktelt mint\u00e1k (teh\u00e1t
  nem egy mint\u00e1n bel\u00fcl a pr\u00f3batestek) nyom\u00f3szil\u00e1rds\u00e1ga
  vari\u00e1ci\u00f3s t\u00e9nyez\u0151j\u00e9nek (sz\u00f3r\u00e1s/\u00e1tlag) felt\u00e9telezett
  \u00e9rt\u00e9ke az MSZ 15022-1:1986 szabv\u00e1ny ill. el\u0151zm\u00e9nye, tov\u00e1bb\u00e1
  az\\n\\nMSZ 4720/2:1980 szabv\u00e1ny szerint 0,15 volt (Szalai, 1982, 4.3. szakasz).
  A vari\u00e1ci\u00f3s t\u00e9nyez\u0151 = 0,15 \u00e9rt\u00e9k\u0171 felt\u00e9telez\u00e9se
  csak kb. C16 szil\u00e1rds\u00e1gi jelleg volt re\u00e1lis (M\u00c9ASZ ME-04.19.1995
  18.104.22.168.3.b. szakasz).\\n\\nA t\u00f6bb pr\u00f3batestb\u0151l \u00e1ll\u00f3
  minta terjedelm\u00e9re vonatkoz\u00f3 k\u00f6vetelm\u00e9nyt \u00e9rdemes \u00f6sszevetni
  a nyom\u00f3szil\u00e1rds\u00e1g vizsg\u00e1latra (MSZ EN 123903:2002) vonatkoz\u00f3
  ism\u00e9tl\u00e9si felt\u00e9telekkel (l\u00e1sd: Ism\u00e9tl\u00e9si \u00e9s \u00f6sszehasonl\u00edt\u00e1si
  felt\u00e9telek, m\u00e9r\u00e9si eredm\u00e9nyek pontoss\u00e1ga [\u25b6]), amelyr\u0151l
  az MSZ EN 206-1:2002 eur\u00f3pai betonszabv\u00e1ny ugyan nem besz\u00e9l, de a
  nemzeti alkalmaz\u00e1si dokumentum az eur\u00f3pai vizsg\u00e1lati szabv\u00e1nyokb\u00f3l
  a m\u00e9r\u00e9si eredm\u00e9nyek pontoss\u00e1g\u00e1nak jellemz\u00e9s\u00e9re
  a nemzeti betonszabv\u00e1nyba (MSZ 4798-1:2004 szabv\u00e1ny N4. fejezet) t\u00e1j\u00e9koztat\u00e1sk\u00e9nt
  beemelte.\\n\\nA m\u00e9r\u00e9si pontoss\u00e1g (n\u00e9met\u00fcl: Zuverl\u00e4ssigkeit,
  angolul: Precision) meghat\u00e1roz\u00e1sa azon az elven alapszik, amely szerint
  a $T$ tapasztalati terjedelem \u00e9s az $s$ sz\u00f3r\u00e1s h\u00e1nyadosak\u00e9nt
  k\u00e9pzett $\\\\omega = T/s$ standardiz\u00e1lt terjedelem v\u00e1rhat\u00f3 \u00e9rt\u00e9ke
  \u00e9s sz\u00f3r\u00e1sa csup\u00e1n a m\u00e9r\u00e9sek $n$ sz\u00e1m\u00e1t\u00f3l,
  \u00e9s a statisztikai biztons\u00e1gt\u00f3l ($P_t$) f\u00fcgg\u0151 \u00e9rt\u00e9k.
  Ha a m\u00e9r\u00e9sek sz\u00e1ma $n = 3$, ahogy az MSZ 4798-1:2004 aj\u00e1nlja,
  \u00e9s a statisztikai biztons\u00e1g $P_t = 0.95$, akkor a terjedelem \u00e9s a
  sz\u00f3r\u00e1s \u00f6sszef\u00fcgg\u00e9se: $T = \\\\omega \\\\cdot s = 3,31 \\\\cdot
  s$.\\n\\nAz MSZ 4798-1:2004 szabv\u00e1ny NAD N8. t\u00e1bl\u00e1zata a nyom\u00f3szil\u00e1rds\u00e1g
  terjedelm\u00e9nek \u00e9s sz\u00f3r\u00e1s\u00e1nak megengedett \u00e9rt\u00e9k\u00e9t
  csak k\u00e9t m\u00e9r\u00e9sre adja meg, h\u00e1rom m\u00e9r\u00e9s eset\u00e9re
  nem k\u00f6zli. Ha a $T = T_{(e)} = 3,31 \\\\cdot s$ formul\u00e1t \u00e9s a $T_{(e)}
  \\\\leq 0,15 \\\\cdot f_m$ k\u00f6vetelm\u00e9nyt \u00f6sszevetj\u00fck, akkor h\u00e1rom
  nyom\u00f3szil\u00e1rds\u00e1g m\u00e9r\u00e9sre az $s \\\\leq 0,045 \\\\cdot f_m$
  \u00f6sszef\u00fcgg\u00e9s ad\u00f3dik.\\n\\nA beton nyom\u00f3szil\u00e1rds\u00e1g
  vizsg\u00e1lata \u00e9s az eredm\u00e9nyek \u00e9rt\u00e9kel\u00e9se sor\u00e1n
  az egyedi beton\u00f6sszet\u00e9telek mintav\u00e9teli \u00e9s vizsg\u00e1lati terv\u00e9ben,
  valamint a megfelel\u0151s\u00e9gi felt\u00e9telekben meg kell k\u00fcl\u00f6nb\u00f6ztetni
  a kezdeti gy\u00e1rt\u00e1st \u00e9s vizsg\u00e1latot [\u25b6], a folyamatos gy\u00e1rt\u00e1st
  \u00e9s vizsg\u00e1latot [\u25b6], valamint az azonos\u00edt\u00f3 vizsg\u00e1latot
  [\u25b6].\\n\\n**Felhaszn\u00e1lt irodalom:**\\n\\n[1] MSZ 4798-1:2004 Beton. 1.
  r\u00e9sz: M\u0171szaki felt\u00e9telek, teljes\u00edt\u0151k\u00e9pess\u00e9g,
  k\u00e9sz\u00edt\u00e9s \u00e9s megfelel\u0151s\u00e9g, valamint az MSZ EN 206\u20131
