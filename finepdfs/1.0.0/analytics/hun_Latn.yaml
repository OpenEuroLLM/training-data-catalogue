  int\u00e9zm\u00e9ny sz\u00e9khely szerinti \u00f6nkorm\u00e1nyzatai. 2014. \u00e9vt\u0151l
  a gyermekek, tanul\u00f3k k\u00f6z\u00e9tkeztet\u00e9se k\u00f6telez\u0151 \u00f6nkorm\u00e1nyzati
  feladat, ez\u00e9rt a T\u00e1rsul\u00e1si Tan\u00e1csnak csak a szoci\u00e1lis \u00e9lelmez\u00e9si
  nyersanyagnorm\u00e1r\u00f3l kell d\u00f6ntenie.\\n\\nA Szentgotth\u00e1rd V\u00e1ros
  \u00d6nkorm\u00e1nyzata \u00e1ltal alap\u00edtott, de a Szentgotth\u00e1rd \u00e9s
  T\u00e9rs\u00e9ge \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1s \u00e1ltal fenntartott
  szoci\u00e1lis int\u00e9zm\u00e9nyben, a V\u00e1rosi Gondoz\u00e1si K\u00f6zpontban
  kiz\u00e1r\u00f3lag a szentgotth\u00e1rdi \u00f6nkorm\u00e1nyzat finansz\u00edrozza
  az \u00e9tkeztet\u00e9st, ez\u00e9rt k\u00e9rem, hogy a szentgotth\u00e1rdi k\u00e9pvisel\u0151-test\u00fclet
  javaslat\u00e1t a d\u00f6nt\u00e9shozataln\u00e1l figyelembe venni sz\u00edveskedjenek
  \u2013 a szentgotth\u00e1rdi k\u00e9pvisel\u0151-test\u00fclet a 240/2015. sz\u00e1m\u00fa
  hat\u00e1rozat\u00e1val az \u00e9lelmez\u00e9si t\u00e9r\u00edt\u00e9si d\u00edj
  alapj\u00e1t meghat\u00e1roz\u00f3 nyersanyagnorm\u00e1k emel\u00e9s\u00e9t egys\u00e9gesen
  3%-ban javasolja meghat\u00e1rozni a fenntart\u00f3 T\u00e1rsul\u00e1si Tan\u00e1cs
  sz\u00e1m\u00e1ra.\\n\\nA V\u00e1llalkoz\u00f3 k\u00e9ri, hogy a T\u00e1rsul\u00e1si
  Tan\u00e1cs az el\u0151terjeszt\u00e9shez csatolt mell\u00e9kletben foglalt nyersanyagnorm\u00e1t
  fogadja el.\\n\\nK\u00e9rem a Tisztelt T\u00e1rsul\u00e1si Tan\u00e1csot, hogy az
  el\u0151terjeszt\u00e9st megt\u00e1rgyalni \u00e9s a t\u00e1rgy\u00e1ban d\u00f6nteni
  sz\u00edveskedjen!\\n\\nHat\u00e1rozati javaslat:\\n\\nSzentgotth\u00e1rd \u00e9s
  T\u00e9rs\u00e9ge \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1s T\u00e1rsul\u00e1si
  Tan\u00e1csa a V\u00e1rosi Gondoz\u00e1si K\u00f6zpont int\u00e9zm\u00e9nyben a
  2016. janu\u00e1r 01. \u00e9s 2016. december 31. k\u00f6z\u00f6tti \u00e9lelmez\u00e9si
  t\u00e9r\u00edt\u00e9si d\u00edj alapj\u00e1t meghat\u00e1roz\u00f3 nyersanyagnorm\u00e1k
  emel\u00e9s\u00e9t 3%-ban VAGY a v\u00e1llalkoz\u00f3 \u00e1ltal javasoltak szerint,
  az el\u0151terjeszt\u00e9s 1. sz. mell\u00e9klet\u00e9ben meghat\u00e1rozottak alapj\u00e1n
  hat\u00e1rozza meg. A rezsik\u00f6lts\u00e9get mindk\u00e9t esetben v\u00e1ltozatlanul
  72%-ban fogadja el.\\n\\nHat\u00e1rid\u0151: azonnal\\n\\nFelel\u0151s: Husz\u00e1r
  G\u00e1bor eln\u00f6k Somorjain\u00e9 D. Zsuzsanna p\u00e9nz\u00fcgyi vezet\u0151\\n\\nSzentgotth\u00e1rd,
