  A T\u00e1rsul\u00e1si Tan\u00e1cs a 2015. \u00e9vi k\u00f6lts\u00e9gvet\u00e9s bev\u00e9teli
  f\u0151\u00f6sszeg\u00e9t 521 972 e/Ft-ban \u00e1llap\u00edtja meg. /Az 1. sz\u00e1m\u00fa
