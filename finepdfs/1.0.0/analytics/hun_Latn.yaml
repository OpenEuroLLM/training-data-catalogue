  "\"SULIB\u00d6RZE,\\n\\na P\u00c1LYAV\u00c1LASZT\u00c1S legfontosabb helyi f\u00f3ruma.\\n\\n\u00c9let\u00fcnk
  sor\u00e1n szinte \u00e9szrev\u00e9tlen\u00fcl hozunk kisebb-nagyobb horderej\u0171
  d\u00f6nt\u00e9seket. Mint akkor is, amikor reggel beny\u00falunk a szekr\u00e9nybe
  \u00e9s \u00e9ppen azt a ruh\u00e1t v\u00e1lasztjuk, amelyikben azt\u00e1n remek\u00fcl
  \u00e9rezz\u00fck magunkat a nap folyam\u00e1n. D\u00f6nt\u00e9seink alak\u00edtj\u00e1k
  tov\u00e1bbi l\u00e9p\u00e9seinket, befoly\u00e1solj\u00e1k hangulatunkat is.\\n\\n\u00c9letp\u00e1ly\u00e1nkat
  tekintve els\u0151, legfontosabb d\u00f6nt\u00e9s\u00fcnket 14-15 \u00e9vesen kell
  meghoznunk, a kamaszkor am\u00fagy is viharos id\u0151szak\u00e1ban. A p\u00e1lyav\u00e1laszt\u00e1si
  d\u00f6nt\u00e9st meghozni egy gyerek sz\u00e1m\u00e1ra egy\u00e1ltal\u00e1n nem
  k\u00f6nny\u0171 feladat. A helyzet az, hogy a sz\u00fcl\u0151knek sem. A legjobbat
  szeretn\u00e9k a gyerekeiknek, hogy siker\u00fclj\u00f6n \u00e9ppen azt az iskol\u00e1t
  kiv\u00e1lasztani, ami legjobban megfelel a gyerek k\u00e9pess\u00e9g\u00e9nek,
  \u00e9rdekl\u0151d\u00e9s\u00e9nek. Amib\u0151l nem csak meg tud majd \u00e9lni,
  de a foglalkoz\u00e1s\u00e1t szeretve siker\u00e9lm\u00e9nyekben is r\u00e9sze lesz.
  Manaps\u00e1g nehezen k\u00f6vethet\u0151k az oktat\u00e1si rendszer \u00e9s kisz\u00e1m\u00edthatatlanok
  a munkaer\u0151piac v\u00e1ltoz\u00e1sai. Mi, a veresegyh\u00e1zi KINCS Alap\u00edtv\u00e1ny
  \u00f6nk\u00e9ntesei ez\u00e9rt hat\u00e1roztuk el, hogy seg\u00edteni fogjuk a
  gyerekek p\u00e1lyav\u00e1laszt\u00e1s\u00e1t. Ennek m\u00e1r 8 \u00e9ve.\\n\\nAz\u00f3ta
  minden \u00e9v \u0151sz\u00e9n SULIB\u00d6RZ\u00c9T rendez\u00fcnk, ahol a F\u00f3tr\u00f3l,
  V\u00e1cr\u00f3l, Budapestr\u0151l, G\u00f6dr\u0151l, Asz\u00f3dr\u00f3l \u00e9s
  G\u00f6d\u00f6ll\u0151r\u0151l \u00e9rkez\u0151 K\u00f6z\u00e9piskol\u00e1k bemutatkoz\u00e1sa
  mellett p\u00e1lyav\u00e1laszt\u00e1si tan\u00e1csad\u00e1sokkal igyeksz\u00fcnk
  az idel\u00e1togat\u00f3 di\u00e1kok \u00e9s sz\u00fcleik sz\u00e1m\u00e1ra a lehet\u0151
  legt\u00f6bb inform\u00e1ci\u00f3t \u00e1tadni. Hogy ezek birtok\u00e1ban a lehet\u0151
  legjobb d\u00f6nt\u00e9st tudj\u00e1k meghozni.\u00a0\u00cdgy lesz ez id\u00e9n
  is!\\n\\n2017. okt\u00f3ber 14-\u00e9n szombaton 9 \u00e9s 14 \u00f3ra k\u00f6z\u00f6tt
  v\u00e1runk minden \u00e9rdekl\u0151d\u0151 7.-8. oszt\u00e1lyos di\u00e1kot \u00e9s
  sz\u00fcleiket a SULIB \u00d6RZ\u00c9N!\\n\\n1 / 4\\n\\nHelysz\u00edn: M\u00e9zesv\u00f6lgyi
