  Mell\u00e9kletek / Referencia dokumentumok\\n\\n1. Mell\u00e9klet: V\u00e1ratlan
  esem\u00e9nyek \u00e9s ledolgozott munka\u00f3r\u00e1k jelent\u00e9se a v\u00e1llalkoz\u00f3
  r\u00e9sz\u00e9r\u0151\\n\\nl\\n\\nBalesetek jelent\u00e9si m\u00e1trixa\\n\\n2.
  Mell\u00e9klet: Helysz\u00edni jelent\u00e9s minta\\n\\nTelephelyi jelent\u00e9s\"",
  "\"KIVONAT\\n\\n\u00dajk\u00edgy\u00f3s V\u00e1ros \u00d6nkorm\u00e1nyzat K\u00e9pvisel\u0151-test\u00fclet\u00e9nek
  2021. okt\u00f3ber 25-\u00e9n megtartott \u00fcl\u00e9s\u00e9n\\n\\nfelvett jegyz\u0151k\u00f6nyv\u00e9b\u0151l\\n\\n84/2021.
  (X. 25.) sz\u00e1m\u00fa k\u00e9pvisel\u0151-test\u00fcleti hat\u00e1rozat:\\n\\n\u00dajk\u00edgy\u00f3s
  V\u00e1ros \u00d6nkorm\u00e1nyzat K\u00e9pvisel\u0151-test\u00fclete a K\u00f6z\u00f6s
  Igazgat\u00e1s\u00fa \u00d3vodai \u00e9s B\u00f6lcs\u0151dei Int\u00e9zm\u00e9ny
  2020-2021. tan\u00e9vr\u0151l sz\u00f3l\u00f3 besz\u00e1mol\u00f3j\u00e1t elfogadja.\\n\\nMegk\u00f6sz\u00f6ni
  az int\u00e9zm\u00e9ny dolgoz\u00f3inak az elv\u00e9gzett munk\u00e1jukat!\\n\\nFelel\u0151s:
  Boty\u00e1nszki P\u00e1l polg\u00e1rmester\\n\\nHat\u00e1rid\u0151: a hat\u00e1rozat
  megk\u00fcld\u00e9s\u00e9re: 2021. november 15.\\n\\nSzavaz\u00e1s eredm\u00e9nye          igen:
  8           nem: - tart\u00f3zkodott: -\\n\\nK.m.f.\\n\\nBoty\u00e1nszki P\u00e1l
  sk. polg\u00e1rmester\\n\\nKivonat hitel\u00e9\u00fcl:\\n\\ndr. Csatl\u00f3s L\u00e1szl\u00f3
  sk. jegyz\u0151\"", "\"A MOHOLY-NAGY M\u0170V\u00c9SZETI EGYETEM\\nMIN\u0150S\u00c9GBIZTOS\u00cdT\u00c1SI
  BIZOTTS\u00c1G\u00c1NAK \u00dcGYRENDJE\\n\\n(2) Az eln\u00f6k megb\u00edzat\u00e1s\u00e1ra
  a Bizotts\u00e1g mand\u00e1tum\u00e1nak id\u0151tartam\u00e1ra sz\u00f3l.\\n\\n(3)
  az eln\u00f6k funkci\u00f3j\u00e1r\u00f3l b\u00e1rmikor lemondhat. Ebben az esetben
  az eln\u00f6ki funkci\u00f3kat -a soron k\u00f6vetkez\u0151 \u00fcl\u00e9sig- a
  Bizotts\u00e1g titk\u00e1ra l\u00e1tja el, aki a lemond\u00e1s hat\u00e1lyosul\u00e1s\u00e1t\u00f3l
  sz\u00e1m\u00edtott 30 napon bel\u00fcl k\u00f6teles \u00fcl\u00e9st \u00f6sszeh\u00edvni.\\n\\n(4)
  A Bizotts\u00e1g titk\u00e1ri feladatait min\u0151s\u00e9gbiztos\u00edt\u00e1si
  referens (akad\u00e9miai ter\u00fclet) l\u00e1tja el.\\n\\n(5) A Bizotts\u00e1g
  eln\u00f6k\u00e9nek feladatai:\\n   a) az \u00fcl\u00e9sek \u00f6sszeh\u00edv\u00e1sa,
  levezet\u00e9se;\\n   b) szavazategyel\u0151ss\u00e9g eset\u00e9n d\u00f6nt\u00e9si
  jogk\u00f6re van;\\n   c) k\u00e9pviseli a Bizotts\u00e1got a k\u00fcl\u00f6nb\u00f6z\u0151
  egyetemi f\u00f3rumokon.\\n\\n(6) A Bizotts\u00e1g titk\u00e1r\u00e1nak feladatai:\\n   a)
  gondoskodik az eln\u00f6k \u00e1ltal \u00f6sszeh\u00edvott \u00fcl\u00e9sek megszervez\u00e9s\u00e9r\u0151l
  \u00e9s el\u0151k\u00e9sz\u00edt\u00e9s\u00e9r\u0151l,\\n   b) gondoskodik az \u00fcl\u00e9sek
  jegyz\u0151k\u00f6nyvez\u00e9s\u00e9r\u0151l \u00e9s az \u00fcl\u00e9seken meghozott
  hat\u00e1rozatok elk\u00e9sz\u00edt\u00e9s\u00e9r\u0151l \u00e9s publik\u00e1l\u00e1s\u00e1r\u00f3l.\\n\\nA
  Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g \u00fcl\u00e9sei \u00e9s d\u00f6nt\u00e9shozatali
  elj\u00e1r\u00e1sa\\n\\n5.\u00a7\\n\\n(1) A Bizotts\u00e1g \u00fcl\u00e9seit a Bizotts\u00e1g
  eln\u00f6ke h\u00edvja \u00f6ssze sz\u00fcks\u00e9g szerint, de legal\u00e1bb negyed\u00e9vente
  egy alkalommal. Az \u00fcl\u00e9st \u00f6ssze kell h\u00edvni abban az esetben is,
  ha azt legal\u00e1bb a tagok egyharmad\u00e1nak \u2013 az indok megjel\u00f6l\u00e9s\u00e9vel
  \u2013 \u00edr\u00e1sban k\u00e9ri.\\n\\n(2) A Bizotts\u00e1g hat\u00e1sk\u00f6r\u00e9it
  \u00fcl\u00e9sen gyakorolja, \u00fcl\u00e9sei z\u00e1rtak.\\n\\n(3) A Bizotts\u00e1g
  hat\u00e1rozatk\u00e9pes, ha a szavazati joggal rendelkez\u0151 tagok t\u00f6bb
  mint fele jelen van. A hat\u00e1rozatk\u00e9pess\u00e9get minden szavaz\u00e1s el\u0151tt
  vizsg\u00e1lni kell. Amennyiben a Bizotts\u00e1g nem hat\u00e1rozatk\u00e9pes, 5
  napon bel\u00fcl p\u00f3tl\u00e9st kell tartani, mely a megjelentek l\u00e9tsz\u00e1m\u00e1ra
  val\u00f3 tekintet n\u00e9lk\u00fcl hat\u00e1rozatk\u00e9pes. Ezt a szab\u00e1lyt
  kell alkalmazni akkor is, ha a Bizotts\u00e1g az \u00fcl\u00e9s k\u00f6zben v\u00e1lik
  hat\u00e1rozatk\u00e9ptelennek, azzal, hogy ilyenkor a p\u00f3tl\u00e9st a hat\u00e1rozatk\u00e9ptelens\u00e9g
  miatt nem t\u00e1rgyalt napirendi pontokban kell megtartani.\\n\\n(4) Hat\u00e1rozat
  meghozatalakor nem szavazhat az, aki szem\u00e9lyesen \u00e9rdeklelt a d\u00f6nt\u00e9sben.
  Ha egy tag valamely \u00fcgyben nem szavazhat, \u0151t az adott hat\u00e1rozat meghozatal\u00e1n\u00e1l
  a hat\u00e1rozatk\u00e9pess\u00e9g meg\u00e1llap\u00edt\u00e1sa sor\u00e1n figyelem
  k\u00edv\u00fcl kell hagyni.\\n\\n(5) A Bizotts\u00e1g hat\u00e1rozatot kiz\u00e1r\u00f3lag
  \u00fcl\u00e9sen hozhat. A hat\u00e1rozathozatal sor\u00e1n valamennyi tagnak egy
  szavazata van. A hat\u00e1rozathozatalhoz a jelenlev\u0151 tagok t\u00f6bb mint
  fel\u00e9nek egybehangz\u00f3 szavazata sz\u00fcks\u00e9ges.\\n\\n(6) A Bizotts\u00e1g
  \u00fcl\u00e9seir\u0151l jegyz\u0151k\u00f6nyvet kell k\u00e9sz\u00edteni. A jegyz\u0151k\u00f6nyvnek
  tartalmaznia kell az \u00fcl\u00e9s hely\u00e9t, idej\u00e9t, a megjelent tagok
  nev\u00e9t, a napirendi pontokat, az egyes szavaz\u00e1sok eset\u00e9ben a szavaz\u00e1s
  menet\u00e9t, eredm\u00e9ny\u00e9t. A jegyz\u0151k\u00f6nyvet az \u00fcl\u00e9s
  v\u00e9gezt\u00e9vel az eln\u00f6kn\u00e9l al\u00e1 kell \u00edrnia.\\n\\n(7) Az
  \u00fcl\u00e9sek hat\u00e1rozatait, \u00e1ll\u00e1sfoglal\u00e1sait az \u00fcl\u00e9st
  k\u00f6vet\u0151 h\u00e9t munkanapon bel\u00fcl el kell k\u00fcldeni azoknak, akik
  a hat\u00e1rozat v\u00e9grehajt\u00e1s\u00e1ban vagy m\u00e1s m\u00f3don \u00e9rintettek.\\n\\n(8)
  A Bizotts\u00e1g elektronikus \u00faton is \u00fcl\u00e9sezhet \u00e9s hozhat d\u00f6nt\u00e9st.\\n\\nA
  Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g feladat \u00e9s hat\u00e1sk\u00f6re\\n\\n6.\u00a7\\n\\n(1)
  A Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g f\u0151 feladata a min\u0151s\u00e9g\u00fcgyi
  m\u0171k\u00f6d\u00e9s\u00e9hez kapcsol\u00f3d\u00f3 tan\u00e1csad\u00e1s, d\u00f6nt\u00e9s-el\u0151k\u00e9sz\u00edt\u00e9s
  \u00e9s v\u00e9lem\u00e9nyez\u00e9s. E funkci\u00f3j\u00e1ban minden, a Szen\u00e1tus
  el\u00e9 ker\u00fcl\u0151 min\u0151s\u00e9g\u00fcgyi el\u0151terjeszt\u00e9st el\u0151zetesen
  megt\u00e1rgyal.\\n\\nAz \u00dcgyrend c\u00e9lja\\n\\n1. \u00a7\\n\\nAz \u00dcgyrend
  c\u00e9lja a Moholy-Nagy M\u0171v\u00e9szeti Egyetem (\u2018MOME\u2019/\u2019Egyetem\u2019)
  - Szervezeti \u00e9s M\u0171k\u00f6d\u00e9si Szab\u00e1lyzat r\u00e9sz\u00e9t k\u00e9pz\u0151
  - Szervezeti \u00e9s M\u0171k\u00f6d\u00e9si Rend (\u2018SZMR\u2019) III.3.3. alapj\u00e1n
  meghat\u00e1rozza a Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g (a tov\u00e1bbiakban:
  MB, Bizotts\u00e1g) m\u0171k\u00f6d\u00e9s\u00e9nek rendj\u00e9t, s ez\u00e1ltal
  el\u0151mozd\u00edtsa, t\u00e1mogassa MOME min\u0151s\u00e9g\u00fcgyi tev\u00e9kenys\u00e9g\u00e9nek
  magas sz\u00ednvonal\u00fa m\u0171k\u00f6d\u00e9s\u00e9t.\\n\\nAz \u00dcgyrend hat\u00e1lya\\n\\n2.
  \u00a7\\n\\n(1) Jelen \u00dcgyrend szem\u00e9lyi hat\u00e1lya kiterjed a Bizotts\u00e1g
  valamennyi tagj\u00e1ra \u00e9s a megh\u00edvottakra.\\n(2) Jelen \u00dcgyrend t\u00e1rgyi
  hat\u00e1lya a Bizotts\u00e1g m\u0171k\u00f6d\u00e9si rendj\u00e9re terjed ki.\\n(3)
  A Bizotts\u00e1g m\u0171k\u00f6d\u00e9s\u00e9vel kapcsolatosan azon k\u00e9rd\u00e9sben,
  amelyet jelen \u00dcgyrend nem vagy nem kell\u0151 r\u00e9szletess\u00e9ggel szab\u00e1lyoz,
  az SZMR \u00e9s a Szen\u00e1tus \u00fcgyrendj\u00e9re vonatkoz\u00f3 rendelkez\u00e9seket
  kell megfelel\u0151en alkalmazni.\\n\\nA Min\u0151s\u00e9gbiztos\u00edt\u00e1si
  Bizotts\u00e1g jog\u00e1ll\u00e1sa \u00e9s tagjai, valamint \u00e1lland\u00f3 szak\u00e9rt\u0151i/megh\u00edvottjai\\n\\n3.
  \u00a7\\n\\n(1) A Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g az Egyetem
  Szen\u00e1tusa mellett m\u0171k\u00f6d\u0151 \u00e1lland\u00f3 bizotts\u00e1g, v\u00e9lem\u00e9nyez\u0151
  test\u00fclet.\\n(2) A Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g l\u00e9tsz\u00e1ma
  legal\u00e1bb 5 f\u0151.\\n(3) A Bizotts\u00e1g szorosan egy\u00fcttm\u0171k\u00f6dik
  a min\u0151s\u00e9gbiztos\u00edt\u00e1si referensekkel \u00e9s min\u0151s\u00e9gbiztos\u00edt\u00e1si
  megb\u00edzottakkal, a folyamatfelel\u0151s\u00f6kkel.\\n(4) A Bizotts\u00e1g tagjainak
  megb\u00edzat\u00e1sa, az aktu\u00e1lis szen\u00e1tus mand\u00e1tum\u00e1hoz igazodva,
  bizotts\u00e1gi tagg\u00e1 v\u00e1laszt\u00e1suk kezdet\u00e9t\u0151l sz\u00e1m\u00edtott
  legfeljebb n\u00e9gy \u00e9v. A bizotts\u00e1g tagjai \u00fajrav\u00e1laszthat\u00f3k.\\n(5)
  Az id\u0151k\u00f6zben p\u00f3tl\u00e1sra ker\u00fcl\u0151 tagok mand\u00e1tuma
  az eredeti tagok mand\u00e1tum\u00e1nak lej\u00e1rt\u00e1hoz igazodik, ann\u00e1l
  nem lehet hosszabb.\\n(6) Az \u00e1lland\u00f3 megh\u00edvottak/szak\u00e9rt\u0151k
  az \u00fcl\u00e9sen tan\u00e1cskoz\u00e1si-v\u00e9lem\u00e9nyez\u00e9si-javaslatt\u00e9teli
  joggal rendelkeznek, szavazati joguk nincs.\\n\\nA Min\u0151s\u00e9gbiztos\u00edt\u00e1si
  Bizotts\u00e1g eln\u00f6ke \u00e9s titk\u00e1ra\\n\\n4. \u00a7\\n\\n(1) A Bizotts\u00e1g
  eln\u00f6k\u00e9t a bizotts\u00e1g szavazati jog\u00fa tagjai az alakul\u00f3 \u00fcl\u00e9sen
  maguk k\u00f6z\u00fcl titkos szavaz\u00e1ssal, egyszer\u0171 t\u00f6bbs\u00e9ggel
  v\u00e1lasztj\u00e1k azzal, hogy a tagok legal\u00e1bb 1/3-nak szavazata sz\u00fcks\u00e9ges
  a szavaz\u00e1s eredm\u00e9nyess\u00e9g\u00e9hez. Szavazategyenl\u0151s\u00e9g eset\u00e9n
  a jel\u00f6lteket \u00fajra szavaz\u00e1sra kell bocs\u00e1tani.\\n\\n(2) A Min\u0151s\u00e9gbiztos\u00edt\u00e1si
  Bizotts\u00e1g feladatai az al\u00e1bbiak:\\n   a) v\u00e9lem\u00e9nyez\u00e9si
  tev\u00e9kenys\u00e9ge nyom\u00e1n int\u00e9zked\u00e9si javaslatokat fogalmazhat
  meg, amelyet\\n      az MB eln\u00f6ke a Szen\u00e1tus el\u00e9 terjeszthet;\\n   b)
  v\u00e9lem\u00e9nyezi a min\u0151s\u00e9gir\u00e1ny\u00edt\u00e1si politik\u00e1t
  \u00e9s ir\u00e1nyelveit;\\n   c) v\u00e9lem\u00e9nyezi az Egyetem \u00e9ves min\u0151s\u00e9gfejleszt\u00e9si
  programj\u00e1t;\\n   d) v\u00e9lem\u00e9nyezi az Egyetem \u00e9ves min\u0151s\u00e9gjelent\u00e9s\u00e9t;\\n   e)
  v\u00e9lem\u00e9nyezi a min\u0151s\u00e9g\u00fcgyi k\u00e9zik\u00f6nyveket \u00e9s
  egy\u00e9b, min\u0151s\u00e9g\u00fcgyi dokumentumokat;\\n   f) v\u00e9lem\u00e9nyezi
  az oktat\u00f3i munka hallgat\u00f3i v\u00e9lem\u00e9nyez\u00e9s\u00e9nek rendj\u00e9t,\\n   g)
  v\u00e9lem\u00e9nyezi a teljes\u00edtm\u00e9ny\u00e9rt\u00e9kel\u00e9si rendszert.\\n\\nZ\u00e1r\u00f3
  Rendelkez\u00e9sek\\n\\n7. \u00a7\\n\\n(1) Amennyiben jelen \u00dcgyrend \u00e9s
  az SZMR rendelkez\u00e9sei elt\u00e9rnek egym\u00e1st\u00f3l, \u00fagy az SZMR\\nrendelkez\u00e9sei
  az ir\u00e1nyad\u00f3ak.\\n(2) Az \u00dcgyrend annak Szen\u00e1tus \u00e1ltali elfogad\u00e1st
  k\u00f6vet\u0151 napon l\u00e9p hat\u00e1lyba.\\n(3) Jelen \u00fcgyrendet a MOME
  Szen\u00e1tusa 2023.febru\u00e1r 27. napj\u00e1n 50_2022/2023. (II.27.) sz\u00e1m\u00fa\\nhat\u00e1rozat\u00e1val
  fogadta el.\\n\\nF\u00fcl\u00f6p J\u00f3zsef\\nmint a Szen\u00e1tus eln\u00f6ke\\n\\nMilovits
  M\u00e1t\u00e9\\nmint a Min\u0151s\u00e9gbiztos\u00edt\u00e1si Bizotts\u00e1g eln\u00f6ke\"",
