  foglalt felt\u00e9teleknek.\\n\\n9. Projektt\u00e1rsas\u00e1g l\u00e9trehoz\u00e1sa
  kiz\u00e1rt. (Kbt. 35. \u00a7 (8) bekezd\u00e9s)\\n\\n10. Aj\u00e1nlatk\u00e9r\u0151
  hi\u00e1nyp\u00f3tl\u00e1s\u00e1ra a Kbt. 71. \u00a7-\u00e1ban foglaltak szerint
