  a szaktant\u00e1rgyakkal val\u00f3 integr\u00e1ci\u00f3 megteremt\u00e9se.\\n\\n\u2022
  Interakt\u00edv oktat\u00e1s.\\n\\n**A szakk\u00e9pz\u00e9st megalapoz\u00f3 tant\u00e1rgycsoport
  eset\u00e9ben:**\\n\\n\u2022 Helyi \u00e9s orsz\u00e1gos versenyeken val\u00f3 r\u00e9szv\u00e9tel
  (pl. OSZTV ill. \u00c1SZ\u00c9V, t\u0151zsdeverseny).\\n\\n\u2022 Interakt\u00edv
  k\u00e9pz\u00e9sben vehetnek r\u00e9szt.\\n\\nP\u00e1ly\u00e1zatokon indulnak.\\n\\n**Testnevel\u00e9s,
  mozg\u00e1skult\u00fara:**\\n\\n- A h\u00e9t minden napj\u00e1n a tanul\u00f3k r\u00e9szt
  vehetnek a mindennapos testnevel\u00e9s keretein bel\u00fcl r\u00f6plabda, labdar\u00fag\u00e1s,
  kos\u00e1rlabda \u00e9s ezekkel azonos id\u0151ben test\u00e9p\u00edt\u00e9s foglakoz\u00e1sokon
