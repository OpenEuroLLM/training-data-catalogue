  Est\\n\\nRachmaninov: \u00dcdv\u00f6zl\u00e9gy M\u00e1ria\\n\\nA koncert helysz\u00edne
  Sz\u00e9kesfeh\u00e9rv\u00e1r, Nepomuki Szent J\u00e1nos ciszterci templom, F\u0151
  utca\\n\\nA koncert ingyenes, adom\u00e1nyaikat sz\u00edvesen fogadjuk.\\n\\nT\u00e1mogat\u00f3k
  Sz\u00e9kesfeh\u00e9rv\u00e1r Megyei Jog\u00fa V\u00e1ros \u00d6nkorm\u00e1nyzata
  V\u00e9gh P\u00e9ter\"", "\"A koreai sorozatok ut\u00e1n most egy jap\u00e1n t\u00f6rt\u00e9nelmi
  dr\u00e1ma, az Atsu-hime ker\u00fclt az M1 m\u0171sor\u00e1ra. A t\u00f6rt\u00e9net
  alapja Tomiko Miyao Tensh\u014din Atsuuhime c\u00edm\u0171 reg\u00e9nye \u00e9s
  az Edo-kor v\u00e9g\u00e9re kalauzol minket. A t\u00e9v\u00e9ben janu\u00e1r 7-t\u0151l
  k\u00f6vethetj\u00fck nyomon minden h\u00e9tk\u00f6znap 15:40-16:00 k\u00f6r\u00fcl,
  \u00e9jjel t\u00e1j\u00e1n pedig ism\u00e9tlik szint\u00e9n az M1-en.\\n\\nAz 50
  epiz\u00f3dnyi t\u00f6rt\u00e9nelmi szelet k\u00f6z\u00e9ppontj\u00e1ban a Shimazu
  daimj\u00f3 (nagy\u00far, tartom\u00e1ny nagybirtokos) kl\u00e1n egyik mell\u00e9k\u00e1g\u00e1ba
  tartoz\u00f3 Kacu hercegn\u0151 \u00e1ll (k\u00e9s\u0151bb kapja/felveszi az Atsuko
  \u00e9s a Tensh\u014din neveket is). J\u00f3n\u00f6v\u0171 szamur\u00e1j l\u00e1nyak\u00e9nt
  Acu m\u00e1r gyermeknek is \u00e9rdekes, hat\u00e1rozott, szeleburdi, felfedez\u0151
  szem\u00e9lyis\u00e9gek, aki okos l\u00e1ny\u00e1v erik. A t\u00f6rt\u00e9net az
  \u00e9let\u00e9t mutatja be, \u00e9s rajta kereszt\u00fcl megismerj\u00fck az akkori
  jap\u00e1n politik\u00e1t, a s\u00f3g\u00fan\u00e1tus helyzet\u00e9t, gyeng\u00fcl\u00e9s\u00e9t,
  a nagyurak el\u00e9gdetlenked\u00e9seit, szervezked\u00e9seit. Nyomon k\u00f6vethetj\u00fck
  Acu csal\u00e1di helyzet\u00e9t, Nariakir\u00e1hoz ker\u00fcl\u00e9s\u00e9t vagy
  \u00e9pp az \u00e9let\u00e9ben legmeghat\u00e1roz\u00f3b\u00f3l dolgot: \u0151t
  sz\u00e1nj\u00e1k a 13. s\u00f3g\u00fan, Tokugava leszada Feles\u00e9g\u00e9nek...\\n\\nA
  t\u00f6rt\u00e9net h\u0171en visszaadja a korszak esem\u00e9nyeit: a s\u00f3g\u00fan\u00e1tus
  \u00e9s Jap\u00e1n bez\u00e1rkoz\u00e1s\u00e1nak k\u00f6zeig\u0151 v\u00e9get; a
  nyugat megjelen\u00e9s\u00e9t. A 19. sz\u00e1zad k\u00f6zep\u00e9n ugyanis a szigetorsz\u00e1g
  ism\u00e9t megny\u00edltja kapuit k\u00fclf\u00f6ld fel\u00e9, ett\u0151l kezdve
  \u00e1ramlik be a nyugati hat\u00e1s \u00e9s kereskedelem az orsz\u00e1gba. A sorozat
  pedig ezen esem\u00e9nyek f\u0151 mozgat\u00f3ir\u00f3l, szerepl\u0151ir\u0151l
  is sz\u00f3l.\\n\\nRengeteg mindenben k\u00fcl\u00f6nb\u00f6zik. \u00cdgy els\u0151re
  furcsa lesz m\u00e9g azoknak is a hercegn\u0151 t\u00f6rt\u00e9nete, akik \u00fagy
  gondolj\u00e1k (valamennyire) ismerik m\u00e1r a T\u00e1vol-Keletet.\\n\\nFontos
  megjegyezni, hogy a r\u00e9szek eleve r\u00f6videbbek \u00e9s a szerepl\u0151k \u00e9s
  esem\u00e9nyek itt m\u00e9g ink\u00e1bb t\u00f6rt\u00e9nelemh\u0171ek, kev\u00e9s
  teh\u00e1t a koreaiakn\u00e1l megfigyelhet\u0151 kiszinez\u00e9s, de az\u00e9rt
  az er\u00e9nyes h\u0151s\u00f6n (m\u00e9g ha val\u00f3s\u00e1gon alapul is) itt
  is megkapjuk. A sorozatban a narr\u00e1tor alakja is \u00e1lland\u00f3an el\u0151ker\u00fcl,
  az id\u0151sebb Acu az, aki utal\u00e1sokat tesz, t\u00e1volr\u00f3l tekint az esem\u00e9nyekre
  \u00e9s \u00f6sszefoglalja azokat. R\u00e9szben \u00fagy \u00e9rezhetj\u00fck, hogy
  semmit sem \u00e9rt\u00fcnk, a nyakunkba zudul ez a sok n\u00e9v, szerepl\u0151
  \u00e9s t\u00f6rt\u00e9nelmi esem\u00e9ny, ami k\u00f6vethetetlennek t\u0171nik,
  nem jap\u00e1nk\u00e9nt pedig kev\u00e9sb\u00e9 lehet meg hozz\u00e1 a h\u00e1tt\u00e9rtud\u00e1sunk.\\n\\nEz
  nem koreai\\n\\nAz igazi dorama fanoknak most is lehet \u00f6rvendezni, a jap\u00e1n
  m\u0171vek\u00e9rt rajong\u00f3knak m\u00e9g ink\u00e1bb, elv\u00e9gre ez az els\u0151
  ilyen t\u00f6rt\u00e9nelmi sorozat a hazai t\u00e9v\u00e9ben. Jap\u00e1n drama fanoknak
  teh\u00e1t k\u00f6telez\u0151, \u00e9s akik m\u00e1r ismernek/l\u00e1ttak hasonl\u00f3kat,
  biztosan ezt is hamar falni fogj\u00e1k, vagy elv\u00e9gezettel n\u00e9zik \u00fajra.\\n\\nAkik
  pedig csak az itthoni (vagy csak) koreai doram\u00e1kat k\u00f6vett\u00e9k, azok
  m\u00e1r j\u00f3l ismerik a l\u00e1tott sorozatok s\u00e9m\u00e1j\u00e1t, a sz\u00edn\u00e9szeket,
  a j\u00e1tszukat vagy \u00e9ppen a kameramozg\u00e1st. Az eddigi n\u00e9gy koreait\u00f3l
  azonban a jap\u00e1n el\u00e9gg\u00e9 elt\u00e9r. \u00dagy gondolom, nem rosszabb,
  nem jobb, csak m\u00e1s, de ez teljesen \u00e9rthet\u0151 is. Elv\u00e9gre hi\u00e1ba
  szomsz\u00e9dok, m\u00e9g a hasonl\u00f3 kult\u00fara is nemzetenk\u00e9nt egyedi
  sz\u00edneket, szok\u00e1sokat \u00f6lt \u00e9s...\\n\\nM\u00e1sr\u00e9szt viszont
  a mes\u00e9l\u00e9s sokszor kimond egy\u00e9rtelm\u0171, b\u00e1rmelyik n\u00e9z\u0151
  sz\u00e1m\u00e1ra is teljesen \u00e9rthet\u0151 dolgokat, amikr\u0151l \u00fagy
  \u00e9rezz\u00fck felesleges a sz\u00e1nkba r\u00e1gni. Az els\u0151 r\u00e9szn\u00e9l
  a narr\u00e1ci\u00f3, de m\u00e9g a felv\u00e9telek is enyh\u00e9n egy dokumentumfilm
  \u00e9rz\u00e9s\u00e9t keltettek bennem, de ehhez hamar hozz\u00e1 lehet szokni
  \u00e9s k\u00e9s\u0151bb a szerepl\u0151k j\u00e1t\u00e9ka, a sorozat dial\u00f3gusai
  \u00e9s mozgalmas\u00e1ga jobban domin\u00e1lnak.\\n\\nNem kell teh\u00e1t megijedni,
  sem pedig er\u0151lk\u00f6dni, hogy mindent \u00e9s mindenkit megr\u00e9ts\u00fcnk,
  a sorozat term\u00e9szetesen \u00edgy is hozza a j\u00f3l bev\u00e1lt t\u00e9ves
  elemeket, melyeknek k\u00f6sz\u00f6nhet\u0151en XY nagyur rossz szem\u00f6ld\u00f6k\u0171
  arc\u00e1t vagy \u00e9p Z \u00fcnn\u0151 \u00e9rz\u00e9seit messzirol \u00e9szrevessz\u00fck,
  magyarul a t\u00f6rt\u00e9netet j\u00f3l megismerj\u00fck \u00e9s magunk\u00e9v\u00e9
  tessz\u00fck. Aki pedig szereti komplexebb\u00e9 ismerni a dolgokat, az m\u00e1r
  a kezdeti inform\u00e1ci\u00f3ar\u00e1dat ut\u00e1n is nagyon hamar belej\u00f6n
  a kikicsod\u00e1ba.\\n\\nA f\u0151bb karakterek mind-mind megl\u00e9v\u0151 t\u00f6rt\u00e9nelmi
  szem\u00e9lyis\u00e9gek, \u00edgy nem jellemz\u00e9nnem \u0151ket. Ez maradjon a
  n\u00e9z\u0151k feladata, hogy felfedezz\u00e9k az adott esem\u00e9nyek k\u00f6zepette
  kik \u00e9s mi\u00e9rt, mit cselekszenek. A f\u0151szerepl\u0151k a k\u00fcl\u00f6nb\u00f6z\u0151
  dalmj\u00f3 csal\u00e1dok, legink\u00e1bb a m\u00e1r eml\u00edtett Shimazu kl\u00e1n,
  k\u00e9s\u0151bb pedig a s\u00f3guni csal\u00e1d is. Nagyon j\u00f3l a sz\u00edn\u00e9szv\u00e1laszt\u00e1sok
  is, remek\u00fcl hozz\u00e1k a karaktereket, illetnek a szerep\u00fckhez. A f\u0151h\u0151s\u00f6st
  alak\u00edt\u00f3 Miyazaki Aoi (Nana fanoknak ismer\u0151s lehet a live actionb\u00f3l
  Komatsu Nanak\u00e9nt) j\u00e1t\u00e9ka nagyon hamar meg szerethet\u0151.\\n\\nMegval\u00f3s\u00edt\u00e1s\u00e1t
  tekintve sem marad le a sorozat az itthon adott koreaiak m\u00f6g\u00f6tt. Nagyon
  sz\u00e9p felv\u00e9teleket csod\u00e1lhatunk, jelenethez ill\u0151 zen\u00e9ket
  kapunk, a jap\u00e1n d\u00edszeletek \u00e9s ruh\u00e1k pedig elk\u00e9peszt\u0151en
  gy\u00f6ny\u00f6r\u0171ek. Gondos munka, melyet \u00e9rdemes szem\u00fcgyre venni.
  A t\u00f6rt\u00e9net pedig kerek eg\u00e9sz, aj\u00e1nlom teh\u00e1t mindenkinek,
  aki szereti az ilyen sorozatokat vagy szimpl\u00e1n a jap\u00e1n t\u00f6rt\u00e9nelmet.\\n\\nT\u00f6rt\u00e9nelmi
  h\u00e1tt\u00e9r\\n(a sorozat szempontj\u00e1b\u00f3l spoliert is tartalmaz):\\n\\nJap\u00e1nban
  a s\u00f3g\u00fan\u00e1tus (m\u00e1s n\u00e9ven bakufu, katonai korm\u00e1nyzat)
  1192-ben kezd\u0151d\u00f6tt. L\u00e9nyege, hogy a cs\u00e1sz\u00e1r nem birtokol
  t\u00e9nyleges hatalmat, mert az orsz\u00e1got egy katonai vezet\u0151, a s\u00f3g\u00fan
  ir\u00e1ny\u00edtja. Ez a c\u00edm t\u00f6bb korszakot, csal\u00e1dot \u00e9s harcot
  is megel\u0151z, v\u00e9g\u00fcl a szekigahara\u00ed csata ut\u00e1n 1603-t\u00f3l
  a Tokugava kl\u00e1n\u00e9 lett a hatalom. Az orsz\u00e1g ett\u0151l kezdve elz\u00e1rk\u00f3zott
  a k\u00fclvil\u00e1gt\u00f3l, gazdas\u00e1giag \u00e9s politikailag is meger\u0151s\u00f6d\u00f6tt,
  b\u00e9k\u00e9s, fejl\u0151d\u0151 k\u00f6r\u00fclm\u00e9nyek k\u00f6z\u00f6tt \u00e9ltek.
  A Tokugava-s\u00f3g\u00fan\u00e1tus vagy m\u00e1s n\u00e9ven Edo-bakufu eg\u00e9szen
  1868-ig tartott. Nevet a korm\u00e1ny sz\u00e9khely\u00e9r\u0151l, Edo v\u00e1rosr\u00f3l
  kapta (Toki\u00f3 kor\u00e1bbi neve).\\n\\nAcu hercegn\u0151 t\u00f6rt\u00e9nete
  az 1800-as \u00e9vekben j\u00e1tsz\u00f3dik, pontosabban az \u0151 \u00e9let\u00e9t
  k\u00f6veti v\u00e9gig a sorozat, \u00edgy 1836 \u00e9s 1883 k\u00f6z\u00e9 tehet\u0151.
  Ebben az id\u0151szakban m\u00e1r a s\u00f3guni hatalom jelent\u0151sen gyeng\u00fclt:
  p\u00e9nz\u00fcgyi gondokkal, az emberek (dalmj\u00f3k, szamur\u00e1jok, parasztok)
  elg\u00e9detlenked\u00e9s\u00e9vel \u00e9s k\u00fclf\u00f6ldi nyom\u00e1ssal kellett
  szembesz\u00edn\u00fc\u00f6k.\\n\\nAcuko \u00e9lete alatti szogunok:\\n\\n11. Tokugawa
  lenari (1773-1841), s\u00f3gun: 1787-1837\\n12. Tokugawa Ieyoshi (1793-1853), s\u00f3gun:
