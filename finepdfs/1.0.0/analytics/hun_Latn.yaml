  rendelkez\u00e9s\u00e9re bocs\u00e1jtott \u00e1razatlan k\u00f6lts\u00e9gvet\u00e9sek
  az aj\u00e1nlatt\u00e9tel megk\u00f6nyvt\u00e9se \u00e9rdek\u00e9ben k\u00e9pleteket
  tartalmazhatnak. A k\u00e9pletek helyess\u00e9g\u00e9nek, megfelel\u0151 mivolt\u00e1nak
  ellen\u0151rz\u00e9se Aj\u00e1nlattev\u0151 felel\u0151ss\u00e9ge.) A szakmai aj\u00e1nlat
  hi\u00e1nya, hi\u00e1nyp\u00f3tl\u00e1s n\u00e9lk\u00fcli \u00e9rv\u00e9nytelens\u00e9get
