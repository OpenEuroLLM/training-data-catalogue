sample: '["\"FAKTOR Zrt.\\n\\nTisztelt \u00dcgyfel\u00fcnk!\\n\\nK\u00e9rj\u00fck,
  adja meg szerz\u0151d\u00e9s\u00e9hez kapcsol\u00f3d\u00f3 adatait, v\u00e1lasszon
  egyet az al\u00e1bbi lehet\u0151s\u00e9gek \u00e9s bek\u00fcld\u00e9si m\u00f3dok
  k\u00f6z\u00fcl \u00e9s a kit\u00f6lt\u00f6tt nyomtatv\u00e1nyt al\u00e1\u00edr\u00e1ssal
  ell\u00e1tva k\u00fcldje vissza a 1535 Budapest, Pf. 821. postac\u00edm\u00fcnkre,
  faxon az 1/391-4858 faxsz\u00e1mra vagy az email@example.com e-mail c\u00edmre.\\n\\nARGENTA
  FAKTOR Zrt.\\n\\nD\u00cdJFIZET\u00c9SSEL KAPCSOLATBAN FELMER\u00dcL\u0150 IG\u00c9NYEK
  BEJELENT\u00c9SE\\n\\nK\u00e9relem ind\u00edt\u00f3ja : o AD\u00d3S / o AD\u00d3ST\u00c1RS
  / o KEZES / o \u00f6r\u00f6k\u00f6s    Eredeti szerz\u0151d\u00e9ssz\u00e1m: ..................................
  (a megfelel\u0151 r\u00e9sz al\u00e1h\u00fazand\u00f3)\\n\\nCsal\u00e1di \u00e9s
  ut\u00f3/h\u00e1zass\u00e1gi neve:\\n\\nSz\u00fclet\u00e9si neve:\\n\\nAnyja neve:\\n\\nSz\u00fcl.
  helye, ideje:\\n\\n\u00c1lland\u00f3 lakc\u00edme:\\n\\nLevelez\u00e9si c\u00edme:\\n\\nMobil
  telefonsz\u00e1ma:\\n\\nVezet\u00e9kes telefonsz\u00e1ma:\\n\\n1. A fenti sz\u00e1m\u00fa
  szerz\u0151d\u00e9semmel kapcsolatos r\u00e9szletfizet\u00e9si meg\u00e1llapod\u00e1sban
  r\u00f6gz\u00edtett fizet\u00e9si m\u00f3d megv\u00e1ltoztat\u00e1s\u00e1t szeretn\u00e9m
  k\u00e9rv\u00e9nyezni. K\u00e9rem, enged\u00e9lyezz\u00e9k sz\u00e1momra\\n\\n az
  \u00e1tutal\u00e1ssal\\n\\n a k\u00e9szp\u00e9nz\u00e1tutal\u00e1si megb\u00edz\u00e1ssal
  (csekkes befizet\u00e9s)\\n\\nt\u00f6rt\u00e9n\u0151 fizet\u00e9si m\u00f3dot.\\n\\n2.
  K\u00e9rem, k\u00fcldjenek r\u00e9szemre aktu\u00e1lis tartoz\u00e1s kimutat\u00e1st.\\n\\n3.\\n\\nK\u00e9rem,
  k\u00fcldjenek a r\u00e9szemre \u2026\u2026\u2026\u2026\u2026.. db postai k\u00e9szp\u00e9nz
  \u00e1tutal\u00e1si megb\u00edz\u00e1st.\\n\\nAlul\u00edrott k\u00e9relmez\u0151
  hozz\u00e1j\u00e1rulok ahhoz, hogy az ARGENTA FAKTOR Zrt. jelen bejelent\u0151 lapon
  illetve az \u00e1ltalam csatolt mell\u00e9kletekben k\u00f6z\u00f6lt szem\u00e9lyes
  adataimat a fizet\u00e9si konstrukci\u00f3 kidolgoz\u00e1sa c\u00e9lj\u00e1b\u00f3l
  ellenkez\u0151 bejelent\u00e9semig, a k\u00e9relem elutas\u00edt\u00e1sa eset\u00e9n
  az elutas\u00edt\u00e1st k\u00f6vet\u0151 6 h\u00f3napig, fizet\u00e9si meg\u00e1llapod\u00e1s
  megk\u00f6t\u00e9se eset\u00e9n az ebb\u0151l sz\u00e1rmaz\u00f3 k\u00f6telezetts\u00e9geim
  teljes\u00edt\u00e9s\u00e9t k\u00f6vet\u0151 5 \u00e9vig nyilv\u00e1ntartsa, feldolgozza,
  kezelje. Kijelentem, hogy az adataim kezel\u00e9se \u00f6nk\u00e9ntes hozz\u00e1j\u00e1rul\u00e1somon
  alapszik.\\n\\nKelt: ............ \u00e9v ...........h\u00f3 ............... nap\\n\\n\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\\n\\nK\u00e9relmez\u0151\"",
  "\"AH\u00c1NY SZAKMA, ANNYI ES\u00c9LY...\\n\\nK\u00f6zm\u0171vel\u0151d\u00e9si
  \u00e9s k\u00f6z\u00f6ns\u00e9gkapcsolati szakember\\n\\nOKJ 54 345 05\\n\u201eA\u201d\\nE-000203/2014/A007\\nI/2018/1.\\n\\nK\u00f6zm\u0171vel\u0151d\u00e9si
  \u00e9s k\u00f6z\u00f6ns\u00e9gkapcsolati szakember\\n(K\u00f6zm\u0171vel\u0151d\u00e9si
  szakmair\u00e1ny)\\n900 \u00f3r\u00e1s OKJ szerinti szakk\u00e9pes\u00edt\u00e9s\\n(460
  kontakt\u00f3ra, 440 \u00f3ra e-learning)\\n\\n\\\"P. Oktat\u00e1si K\u00f6zpont\\\"
  M\u00e1sodik Es\u00e9ly Iskol\u00e1ja\\n\\nA szakk\u00e9pes\u00edt\u00e9s megnevez\u00e9se:\\nK\u00f6zm\u0171vel\u0151d\u00e9si
  \u00e9s k\u00f6z\u00f6ns\u00e9gkapcsolati szakember (K\u00f6zm\u0171vel\u0151d\u00e9si
  szakmair\u00e1ny)\\n\\nA szakk\u00e9pes\u00edt\u00e9s azonos\u00edt\u00f3 (OKJ)
  sz\u00e1ma: 54 345 05\\n\\nA szakk\u00e9pes\u00edt\u00e9s szintje: K\u00f6z\u00e9pfok\u00fa
  v\u00e9gzetts\u00e9ghez k\u00f6t\u00f6tt szakk\u00e9pes\u00edt\u00e9s\\n\\nA szakk\u00e9pes\u00edt\u00e9s
  nyilv\u00e1ntart\u00e1sba v\u00e9teli sz\u00e1ma: E-000203/2014/A007\\n\\nA K\u00c9PZ\u00c9S
  ELV\u00c9GZ\u00c9S\u00c9VEL \u00d6N K\u00c9PES LESZ:\\n\\na k\u00f6z\u00f6ss\u00e9gi
  m\u0171vel\u0151d\u00e9si folyamatok koordin\u00e1l\u00e1sa m\u0171vel\u0151d\u00e9si
  szolg\u00e1ltat\u00e1sok,\\nrendezv\u00e9nyek, ki\u00e1ll\u00edt\u00e1sok, v\u00e1s\u00e1rok,
  t\u00e1borok szervez\u00e9s\u00e9re,\\ntartalmas sz\u00f3rakoz\u00e1si lehet\u0151s\u00e9gek
  biztos\u00edt\u00e1s\u00e1ra,\\namat\u0151r m\u0171v\u00e9szeti \u00e9s szabadid\u0151s
  k\u00f6r\u00f6k, klubok, valamint tanfolyamok m\u0171k\u00f6d\u00e9s\u00e9nek\\nszakszer\u0171
  seg\u00edt\u00e9s\u00e9re,\\na szervezet, int\u00e9zm\u00e9ny szab\u00e1lyok szerinti\\nm\u0171k\u00f6dtet\u00e9s\u00e9re,
  a k\u00f6zm\u0171vel\u0151d\u00e9si tev\u00e9kenys\u00e9g\\nfelt\u00e9teleinek biztos\u00edt\u00e1s\u00e1ra,\\na
  telep\u00fcl\u00e9s vagy az adott t\u00e1rsadalmi r\u00e9teg m\u0171vel\u0151d\u00e9si
  \u00e9s a k\u00f6z\u00f6ss\u00e9gi \u00e9lete\\nfejl\u0151d\u00e9s\u00e9nek el\u0151seg\u00edt\u00e9s\u00e9re.\\n\\nKINEK
  AJ\u00c1NLJUK A K\u00c9PZ\u00c9ST?\\n\\nA k\u00f6zm\u0171vel\u0151d\u00e9s ter\u00fclet\u00e9n
  elhelyezkedni k\u00edv\u00e1n\u00f3 leend\u0151\\nkoll\u00e9g\u00e1k sz\u00e1m\u00e1ra,
  akik \u00e9rdekl\u0151dnek a k\u00f6z\u00f6ss\u00e9gi m\u0171vel\u0151d\u00e9s szervez\u00e9se,
  a helyi\\nk\u00f6z\u00f6ss\u00e9g ig\u00e9nyeit szolg\u00e1l\u00f3 szabadid\u0151s
  \u00e9s kultur\u00e1lis rendez-\\nv\u00e9nyek szervez\u00e9se ir\u00e1nt.\\n\\nA
  bel\u00e9p\u00e9s felt\u00e9tele k\u00f6z\u00e9pfok\u00fa v\u00e9gzetts\u00e9g megl\u00e9te.\\n\\nK\u00c9PZ\u00c9S
  MODULJAI:\\n\\n10656\u201316 \u2013 Helyi t\u00e1rsadalom\u2013\u00e9s kult\u00faraismeret\\n10657\u201316
  \u2013 Kultur\u00e1lis rendezv\u00e9nyek szervez\u00e9se\\n10658\u201316 \u2013
  Kultur\u00e1lis szervezetek \u00e9s int\u00e9zm\u00e9nyek m\u0171k\u00f6d\u00e9se,
  k\u00f6zm\u0171vel\u0151d\u00e9si\\ntev\u00e9kenys\u00e9ge\\n11498\u201312 \u2013
  Foglalkoztat\u00e1s I. (\u00e9retts\u00e9gire \u00e9p\u00fcl\u0151 k\u00e9pz\u00e9sek
  eset\u00e9n)\\n11499\u201312 \u2013 Foglalkoztat\u00e1s II.\\n\\nINFORM\u00c1CI\u00d3K
  A K\u00c9PZ\u00c9SR\u0150L:\\n\\n\u00d6rasz\u00e1ma \u00e9s \u00fctemez\u00e9se:
  900 \u00f3ra\\n360 \u00f3ra elm\u00e9let \u00e9s 540 \u00f3ra gyakorlat\\n460 kontakt\u00f3ra,
  440 \u00f3ra e-learning\\n\\nA k\u00e9pz\u00e9s tervezett kezd\u00e9se: A jelentkez\u0151k
  l\u00e9tsz\u00e1m\u00e1t\u00f3l f\u00fcgg\u0151en indul.\\nA k\u00e9pz\u00e9s d\u00edja:
  300.000 forint + vizsgad\u00edj\\nBefizet\u00e9s: A tanfolyam d\u00edj\u00e1t fizetheti
  egy \u00f6sszegben, vagy r\u00e9szletben is.\\n\\nMODULZ\u00c1R\u00d3 VIZSG\u00c1K:\\nA
  modulz\u00e1r\u00f3 vizsga vizsgatev\u00e9kenys\u00e9ge\\n1. 10656\u201316 Helyi
  t\u00e1rsadalom - \u00e9s kult\u00faraismeret gyakorlati\\n2. 10657\u201316 Kultur\u00e1lis
  rendezv\u00e9nyek szervez\u00e9se gyakorlati\\n3. 10658\u201316 Kultur\u00e1lis
  szervezetek \u00e9s int\u00e9zm\u00e9nyek m\u0171k\u00f6d\u00e9se, k\u00f6zm\u0171vel\u0151d\u00e9si
  tev\u00e9kenys\u00e9ge gyakorlati\\n4. 11498\u201312 Foglalkoztat\u00e1s I. (\u00e9retts\u00e9gire
  \u00e9p\u00fcl\u0151 k\u00e9pz\u00e9sek eset\u00e9n) \u00edr\u00e1sbeli\\n5. 11499\u201312
  Foglalkoztat\u00e1s II. \u00edr\u00e1sbeli\\n\\nSZAKMAI \u00c9S VIZSGAK\u00d6VETELM\u00c9NYEK:\\nGyakorlati
  vizsgatev\u00e9kenys\u00e9g:\\nA) Esettanulm\u00e1ny bemutat\u00e1sa.\\nEgy telep\u00fcl\u00e9s
  k\u00f6zm\u0171vel\u0151d\u00e9si helyzetelemz\u00e9s\u00e9r\u0151l int\u00e9zm\u00e9nyi
  vagy civil szervezeti koncepci\u00f3j\u00e1r\u00f3l a k\u00e9pz\u00e9s sor\u00e1n
  elk\u00e9sz\u00edtett t\u00edz oldalas esettanulm\u00e1ny sz\u00f3beli ismertet\u00e9se
  \u00e9s megv\u00e9d\u00e9se. A hozz\u00e1rendelt szakmai k\u00f6vetelm\u00e9nymodul
  azonos\u00edt\u00f3ja \u00e9s megnevez\u00e9se: 10656\u201316 Helyi t\u00e1rsadalom-
  \u00e9s kult\u00faraismeret.\\n\\nB) Int\u00e9zm\u00e9nyi portf\u00f3li\u00f3 bemutat\u00e1sa.\\nA
  vizsg\u00e1t megel\u0151z\u0151en elk\u00e9sz\u00edtett portf\u00f3li\u00f3 bemutat\u00e1sa
  a vizsg\u00e1lt telep\u00fcl\u00e9s egyik k\u00f6zm\u0171vel\u0151d\u00e9si int\u00e9zm\u00e9ny\u00e9nek
  m\u0171k\u00f6d\u00e9s\u00e9r\u0151l, jogi st\u00e1tusz\u00e1r\u00f3l, int\u00e9zm\u00e9nyi
