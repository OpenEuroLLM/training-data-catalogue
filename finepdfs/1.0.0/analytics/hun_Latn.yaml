  v\u00e1s\u00e1rolhatj\u00e1k meg az \u00e9rdekl\u0151d\u0151k j\u00fanius 6-10-ig.\\n-
  A Szent Istv\u00e1n Kir\u00e1ly M\u00fazeum fot\u00f3gy\u0171jt\u00e9st hirdetett
  az al\u00e1bbi t\u00e9m\u00e1ban:\\n\\nA Szent Istv\u00e1n Kir\u00e1ly M\u00fazeum
  2012. december 5-\u00e9n felh\u00edv\u00e1st tett k\u00f6zz\u00e9, amivel az 1938-as
  \u00fcnnepi \u00e9v esem\u00e9nyeit \u00e9s az 1988-as \u00e9v Szent Istv\u00e1n
  \u00fcnnepeit meg\u00f6r\u00f6k\u00edt\u0151 fot\u00f3kat k\u00edv\u00e1nja gy\u0171jteni.
  A M\u00faltam eml\u00e9kei \u2013 1938 \u00e9s 1988 fot\u00f3kon c\u00edm\u0171
  program keret\u00e9ben a csal\u00e1di fot\u00f3albumokb\u00f3l \u00e9s gy\u0171jtem\u00e9nyekb\u0151l
  olyan f\u00e9nyk\u00e9peket v\u00e1r a m\u00fazeum, amelyek 1938-b\u00f3l a Szent
  Jobb v\u00e1rosunkba \u00e9rkez\u00e9s\u00e9t, a vit\u00e9zavat\u00e1st, Proh\u00e1szka
  p\u00fcsp\u00f6k \u00fajratemet\u00e9s\u00e9t, a tan\u00fcgyi ki\u00e1ll\u00edt\u00e1st,
  a levente \u00fcnnepet, \u00e9s m\u00e1s, kevesebb publicit\u00e1st kapott esem\u00e9nyeket
  \u00f6r\u00f6k\u00edtettek meg. 1988-b\u00f3l egyebek mellett az augusztus 20-ai
  sz\u00e9kesfeh\u00e9rv\u00e1ri orsz\u00e1gos \u00fcnneps\u00e9g, a k\u00f6rmenet,
  az \u00fcnnepi irodalmi m\u0171sor \u00e9s a De\u00e1k Gy\u0171jtem\u00e9ny megnyit\u00e1s\u00e1nak
  felv\u00e9teleit v\u00e1rjuk 2013. m\u00e1rcius 31-ig. Int\u00e9zm\u00e9ny\u00fcnk
  \u00f6r\u00f6mmel veszi az eredeti f\u00e9nyk\u00e9peket is, de ig\u00e9ny eset\u00e9n
  a fot\u00f3 lem\u00e1sol\u00e1s\u00e1t k\u00f6vet\u0151en az eredetit visszajuttatja
  tulajdonos\u00e1nak. A leg\u00e9rt\u00e9kesebb fot\u00f3kat felaj\u00e1nl\u00f3knak
  m\u00fazeumi kiadv\u00e1nyokkal h\u00e1l\u00e1ljuk meg seg\u00edts\u00e9g\u00fcket.\\n\\nA
  fot\u00f3kat B\u00e1nyai Bal\u00e1zs gy\u0171jti a Szent Istv\u00e1n Kir\u00e1ly
  M\u00fazeumban. A felaj\u00e1nl\u00e1sokat a firstname.lastname@example.org e-mail
