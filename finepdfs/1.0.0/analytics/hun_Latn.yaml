  helyr\u0151l, rakt\u00e1rr\u00f3l, azonnal\\n\\nBETONMIX KFT.\\nT.: 23 520 544;
  Fax: 23 520 545\\nwww.betonmix.hu\\n\\nBetonos \u00e9rdekess\u00e9gek\\n\\nCCR cikfoly\u00f3irat
  2006. \u00e1prilisi \u00e9s m\u00e1jusi sz\u00e1m\u00e1b\u00f3l\\n\\nN\u00e9gy szerz\u0151
  egy nyugat-k\u00ednai v\u00edzer\u0151m\u0171 alag\u00fatj\u00e1ban taumazitk\u00e9pz\u0151d\u00e9st
  \u00e9szlelt [1]. (A taumazit egy kalcium-szilik\u00e1t-karbon\u00e1t-hidr\u00e1t,
  mely szulf\u00e1tos talajv\u00edz hat\u00e1s\u00e1ra k\u00e9pz\u0151dik a cementtartalm\u00fa
  anyagokb\u00f3l). A taumazit egy mind\u00f6ssze hat \u00e9ves betonalag\u00fatban
  k\u00e9pz\u0151d\u00f6tt, feh\u00e9r \u201egomba\u201d alakj\u00e1ban, ettringit,
  gipsz \u00e9s kalcit mellett; a talajv\u00edz el\u00e9g nagy mennyis\u00e9g\u0171
  szulf\u00e1tot, karbon\u00e1tot \u00e9s kloridot tartalmazott. El\u0151szer\u0151
  fordult el\u0151 K\u00edn\u00e1ban, hogy taumazitot tal\u00e1ltak, b\u00e1r szulf\u00e1tos
  talajv\u00edz eset\u00e9ben el\u00e9g gyakori a vil\u00e1gban. Az anyagot r\u00f6ntgendiffrakci\u00f3val,
  elektronmikroszk\u00f3ppal \u00e9s infrav\u00f6r\u00f6s spektroszk\u00f3ppal vizsg\u00e1lt\u00e1k
  \u00e9s azt tal\u00e1lt\u00e1k, hogy a szulf\u00e1tos talajv\u00edz hat\u00e1s\u00e1ra
  ez a leggyakoribb k\u00e1ros\u00edt\u00f3 t\u00e9nyez\u0151.\\n\\nK\u00e9t olasz
  szerz\u0151 [2] \u00f6nt\u00f6m\u00f6r\u00f6d\u0151 betonhoz haszn\u00e1lt gumiaibrons\u00f6rlem\u00e9nyt
  (kriog\u00e9n \u00faton \u0151r\u00f6lv), cement, v\u00edz \u00e9s foly\u00f3s\u00edt\u00f3
  adal\u00e9kszer jelenl\u00e9t\u00e9ben. A lefutott gumiaibronsorb\u00f3l nem t\u00e1vol\u00edtott\u00e1k
  el az ac\u00e9lsz\u00e1lat \u00e9s a textilanyagot. A gumi\u00f3rlemennel k\u00e9sz\u00fclt
  \u00f6nt\u00f6m\u00f6r\u00f6d\u0151 betonhoz az v\u00edz/cement t\u00e9nyez\u0151
  azonos volt a szok\u00e1sos m\u00f3don k\u00e9sz\u00fcltek, b\u00e1r valamivel t\u00f6bb
  foly\u00f3s\u00edt\u00f3 anyagot haszn\u00e1ltak. A szil\u00e1rds\u00e1g n\u0151tt
  a gumi\u00f3rlem\u00e9ny hat\u00e1s\u00e1ra, de ehhez t\u00f6bb cementre volt sz\u00fcks\u00e9g.
  A gumi\u00f3rlem\u00e9ny-tartam\u00fa anyag jobban ellen\u00e1ll a deform\u00e1ci\u00f3knak
  \u00e9s a porozit\u00e1s is elhanyagolhat\u00f3 hat\u00e1rok k\u00f6zt maradt. A
  szerz\u0151k nagyon aj\u00e1nlj\u00e1k a gumi\u00f3rlem\u00e9ny haszn\u00e1lat\u00e1t.\\n\\nFranciaorsz\u00e1gban
  \u00e9s Kanad\u00e1ban dolgoz\u00f3 h\u00e1rom szerz\u0151 [3] a nagyon foly\u00f3s
  betonr\u00f3l \u00edrt cikket. Term\u00e9szetesen elhhez foly\u00f3s\u00edt\u00f3szter
  (F) sz\u00fcks\u00e9ges. K\u00e9tfele t\u00edpus\u00fa F-et haszn\u00e1ltak: polinaftalin-szulfon\u00e1tot
  (FN) \u00e9s polikarboxil\u00e1t-polimert (FK). N\u00e9gy-f\u00e9le betont haszn\u00e1ltak,
  a v/c t\u00e9nyez\u0151 0,42 \u00e9s 0,53 k\u00f6zt v\u00e1ltakozott. A betonok
  k\u00e9sz\u00edt\u00e9si h\u0151m\u00e9rs\u00e9klete 10 \u00e9s 30 \u00b0C k\u00f6z\u00f6tt
  v\u00e1ltozott. A foly\u00f3s\u00e1g FN eset\u00e9ben a line\u00e1risan v\u00e1ltozott,
  tekintet n\u00e9lk\u00fcl az el\u0151\u00e1ll\u00edt\u00e1si h\u0151m\u00e9rs\u00e9kletre.
  Az FK eset\u00e9ben azonban er\u0151sen f\u00fcgg\u00f6tt az el\u0151\u00e1ll\u00edt\u00e1si
  h\u0151m\u00e9rs\u00e9klett\u0151l.\\n\\nEgy n\u00e9met \u00e9s k\u00e9t amerikai
  szerz\u0151 [4] a kezd\u0151szil\u00e1rds\u00e1got vizsg\u00e1lta effekt\u00edv
  szil\u00e1rds\u00e1gm\u00e9reessel (ehhez egy k\u00fcl\u00f6nleges k\u00e9sz\u00fcl\u00e9ket
  haszn\u00e1ltak) \u00e9s ultrahanggal. A cement szil\u00e1rdul\u00e1sa folytonos
  a plasztikus, deform\u00e1lhat\u00f3 a szil\u00e1rd \u00e1llapotig. Az ultrahangos
  vizsg\u00e1latokhoz r\u00e9szben keresztir\u00e1ny\u00fa, r\u00e9szben hosszanti
  hull\u00e1mokat haszn\u00e1ltak, 150-180 kHz tartom\u00e1nyban. A hosszir\u00e1ny\u00fa
  hull\u00e1mok nagym\u00e9rt\u00e9kben v\u00e1ltoztak, m\u00edg a keresztir\u00e1ny\u00fa
  hull\u00e1mok jobban megfelelt\u00e9k a szil\u00e1rdul\u00e1snak. Az ultrahangos
  vizsg\u00e1latok \u00e9s a szil\u00e1rdul\u00e1s \u00f6sszef\u00fcgg\u00e9se kezdetben
  hatv\u00e1nyf\u00fcggv\u00e9ny szerint v\u00e1ltozik, k\u00e9s\u0151bb azonban line\u00e1ris\u00e1
  v\u00e1lik.\\n\\nK\u00e9t n\u00e9met szerz\u0151 a stuttgarti egyetemen a h\u0151kezel\u00e9s
  hat\u00e1s\u00e1t vizsg\u00e1lta \u00f6nt\u00f6m\u00f6r\u00f6d\u0151 beton eset\u00e9ben
  [5]. A betonok h\u0151kezel\u00e9se 40, 60 \u00e9s 80 \u00b0C h\u0151m\u00e9rs\u00e9kleten
  t\u00f6rt\u00e9nt, 10 \u00f3r\u00e1s id\u0151vel. A h\u0151kezel\u00e9s hat\u00e1s\u00e1ra
  \u00e1ltal\u00e1ban a szil\u00e1rds\u00e1g cs\u00f6kkent. Egy empirikus f\u00fcggv\u00e9nyt
  \u00edrnak le, mely j\u00f3l t\u00fckr\u00f6zi a szil\u00e1rds\u00e1got \u00e9s
  a h\u0151kezel\u00e9si h\u0151m\u00e9rs\u00e9kletet; az $R^2$ \u00e9rt\u00e9ke 0,82.\\n\\nN\u00e9gy
  spanyol szerz\u0151 180 k\u00fcl\u00f6nf\u00e9le, dolomitos m\u00e9sz alap\u00fa
  jav\u00edt\u00f3 habarcs haszn\u00e1lat\u00e1r\u00f3l \u00edr [6]. A cikk els\u0151sorban
  a p\u00f3russzerkezet \u00e9s a mechanikai tulajdons\u00e1gok szerep\u00e9t vizsg\u00e1lta
  (kezd\u0151- \u00e9s v\u00e9gszil\u00e1rds\u00e1g, adal\u00e9kanyag-mennyis\u00e9g.
  A szil\u00e1r-\\n\\ndul\u00e1s els\u0151sorban a kalcitmennyis\u00e9gt\u0151l (kalcium-karbon\u00e1t)
  f\u00fcgg; brucit (magn\u00e9zium-hidroxid) szerepe ilyen szempontb\u00f3l kisebb
  jelent\u0151s\u00e9g\u0171. A 365 napos szil\u00e1rds\u00e1g nagy m\u00e9rt\u00e9kben
  n\u0151 a 28 naposhoz k\u00e9pest. A p\u00f3russzerkezet er\u0151sen befoly\u00e1solja
  a szil\u00e1rds\u00e1got. A nagy m\u00e9szmennyis\u00e9g megn\u00f6veli a ny\u00edlt
  porozit\u00e1st \u00e9s ez el\u0151seg\u00edti a karboniz\u00e1ci\u00f3t.\\n\\nN\u00e9gy
  d\u00e9l-koreai szerz\u0151 a karboniz\u00e1ci\u00f3t vizsg\u00e1lta [7]. Ez a f\u0151
  oka a vasbeton-szerkezetekn\u00e9l a vasbet\u00e9tek t\u00f6nkrementetl\u00e9n\u00e9nek.
  A reped\u00e9sek szabad utat nyitnak a vasbet\u00e9tekhez, \u00e9s ezzel el\u0151seg\u00edtik
  azok korrozi\u00f3j\u00e1t. A cikk a CO$_2$ hat\u00e1s\u00e1t vizsg\u00e1lja t\u00f6n\u00f6r
  \u00e9s repedezett beton eset\u00e9ben. A cikk k\u00e9plettel ad karboniz\u00e1ci\u00f3
  el\u0151re-halad\u00e1s\u00e1ra a repedezetts\u00e9g f\u00fcggv\u00e9ny\u00e9ben.
  A k\u00e9plet j\u00f3 k\u00f6zel\u00edt\u00e9st ad.\\n\\nDr. TAM\u00c1S FERENC\\nVeszpr\u00e9mi
