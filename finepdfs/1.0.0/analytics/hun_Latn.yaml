  Ft\\n\\n24\u00a0900 Ft\"", "\"\\n\\nKOD\u00c1LY VIL\u00c1GA TAL\u00c1LKOZ\u00d3
  2017\\n\\nTERVEZET\\n\\nKod\u00e1ly''s World Meeting 2017 in Kecskem\u00e9t\\n\\nmott\u00f3:\\n\\nA
  Mester a tan\u00edtv\u00e1nyok sz\u00edv\u00e9ben, lelk\u00e9ben, k\u00e9pess\u00e9geiben,
  alkot\u00e1saiban \u00e9l tov\u00e1bb...\\n\\n\\\"Az \u00e9nek szebb\u00e9 teszi
  az \u00e9letet, az \u00e9nekl\u0151k m\u00e1sok\u00e9t is. Nem sokat \u00e9r, ha
  magunkban dalolunk, szebb, ha ketten \u00f6sszedalolnak. Azt\u00e1n mind t\u00f6bben,
  sz\u00e1zan, ezren, m\u00edg megsz\u00f3lal a nagy Harm\u00f3nia, amiben mind egyek
  lehet\u00fcnk. Akkor mondhatjuk majd csak igaz\u00e1n: \u00d6rvendjen az eg\u00e9sz
  vil\u00e1g!\\\" Kod\u00e1ly Zolt\u00e1n\\n\\nKod\u00e1ly Zolt\u00e1n nem csup\u00e1n
  a professzion\u00e1lis zen\u00e9szek Mestere. Nagyon sokan vagyunk a vil\u00e1gban
  k\u00fcl\u00f6nf\u00e9le foglalkoz\u00e1sban eredm\u00e9nyesek, akik h\u00e1l\u00e1nkat
  szeretn\u00e9nk kifejezni mindaz\u00e9rt, amit kaptunk, \u00e9s amit el\u00e9rhett\u00fcnk
  a zenei nevel\u00e9s hat\u00e1s\u00e1ra. A professzion\u00e1lis zen\u00e9szek sikere
  sokkal ink\u00e1bb k\u00f6z\u00e9ppontban van, mint azok\u00e9 az amat\u0151r\u00f6k\u00e9,
  akik ak\u00e1r tudom\u00e1nyos p\u00e1ly\u00e1n vagy az \u00e9let k\u00fcl\u00f6nf\u00e9le
  ter\u00fcletein \u00e9rnek el kimagasl\u00f3 eredm\u00e9nyeket. Azok pedig, akik
  \\\"csup\u00e1n\\\" sokkal el\u00e9gedettebb \u00e9letet k\u00e9pesek \u00e9lni
  az\u00e1ltal, hogy a zenei nevel\u00e9s \u00faj horizontot nyitott az \u00e9let\u00fckben,
  tal\u00e1n egy\u00e1ltal\u00e1n nem jutnak sz\u00f3hoz.\\n\\nMa, felgyorsult vil\u00e1gunkban
  k\u00fcl\u00f6n\u00f6sen fontos, hogy \u00e9rt\u00e9keket k\u00f6zvet\u00edts\u00fcnk,
  hogy p\u00e9ld\u00e1t mutassunk a gyermekek, a fiatal feln\u0151ttek sz\u00e1m\u00e1ra,
  de olyan m\u00f3don, melyre a mai ifj\u00fas\u00e1g nyitott lehet, azaz \u00e9lm\u00e9nyeken
  kereszt\u00fcl.\\n\\nM\u00e1s orsz\u00e1gokban \u00e9vtizedes hagyom\u00e1nya van
  az amat\u0151r\u00f6k egy\u00fcttes felk\u00e9sz\u00fcl\u00e9s\u00e9nek, \u00e9vente
  egy-k\u00e9t k\u00f6z\u00f6s produkci\u00f3 bemutat\u00e1s\u00e1nak. Londonban,
  Leidenben, stb. \u00e9vente megrendez\u00e9sre ker\u00fcl a Scratch Messiah p\u00e9ld\u00e1ul,
  amely sok-sok ezer embert vonz. Kod\u00e1ly Zolt\u00e1n Kecskem\u00e9t sz\u00fcl\u00f6tte,
  azonban munk\u00e1ss\u00e1ga messze meghaladja nem csup\u00e1n Magyarorsz\u00e1g,
  de Eur\u00f3pa hat\u00e1rait is. \u0150 nem csup\u00e1n Kecskem\u00e9t, nem csup\u00e1n
  Magyarorsz\u00e1g \\\"\u00fcgye\\\", hanem a vil\u00e1g zenei nevel\u00e9s\u00e9nek
  egyik meghat\u00e1roz\u00f3 alakja.\\n\\nMi, akik m\u00e1r megfelel\u0151 \u00e9lettapasztalattal
  rendelkez\u00fcnk, tudjuk, hogy milyen kincshez jutottunk hozz\u00e1 Kod\u00e1ly
  Zolt\u00e1n csod\u00e1latram\u00e9lt\u00f3 munk\u00e1ss\u00e1ga k\u00f6vetkezt\u00e9ben.
  Err\u0151l szeretn\u00e9nk \u00e9vente tan\u00fabizonys\u00e1got tenni. Szeretn\u00e9nk
  felv\u00e1llalni \u00e9s er\u0151s\u00edteni azt a \\\"h\u00edd\\\" szerepet, ami
  k\u00edv\u00e1natos, hogy fennmaradjon a professzion\u00e1lis zen\u00e9szek \u00e9s
  amat\u0151r\u00f6k k\u00f6z\u00f6tt (k\u00f6z\u00fcl\u00fck ker\u00fcl ki a sz\u00ednvonalas
  k\u00f6z\u00f6ns\u00e9g!), Kecskem\u00e9t v\u00e1rosa \u00e9s a kecskem\u00e9ti
  k\u00f6t\u0151d\u00e9s\u0171 zen\u00e9sz t\u00e1rsadalom, a Kod\u00e1ly-rajong\u00f3k,
  valamint a Kod\u00e1ly tan\u00edtv\u00e1nyok n\u00e9pes nemzetk\u00f6zi t\u00e1bora
  \u00e9s a t\u00e1mogat\u00f3k lehets\u00e9ges k\u00f6re k\u00f6z\u00f6tt.\\n\\nA
  nagyvil\u00e1gban m\u00e9g mindig legink\u00e1bb a technol\u00f3giai halad\u00e1s
  hat\u00e1rozza meg egy gazdas\u00e1g alapj\u00e1t. Ha innov\u00e1ci\u00f3r\u00f3l
  hallunk, jelenleg is tal\u00e1n kiz\u00e1r\u00f3lag valamilyen m\u0171szaki fejleszt\u00e9s
  jut esz\u00fcnkbe. Egyre t\u00f6bbet hallani azonban olyan szoci\u00e1lis innov\u00e1ci\u00f3kr\u00f3l,
  melyek n\u00e9lk\u00fcl a j\u00f3l\u00e9t nem lenne teljes. A Kod\u00e1ly Vil\u00e1ga
  elnevez\u00e9s\u0171 kezdem\u00e9nyez\u00e9s egy olyan \u00f6tlet megval\u00f3s\u00edt\u00e1sa,
  amely tev\u00e9kenys\u00e9geivel azon munk\u00e1lkodik, hogy minden, amivel foglalkozunk,
  egy kicsit jobb legyen, mint azel\u0151tt.\\n\\nC\u00e9lok:\\n\\n1. Kod\u00e1ly-m\u00f3dszeren
  nevelkedett tan\u00edtv\u00e1nyok, a Kod\u00e1ly iskol\u00e1k volt n\u00f6vend\u00e9keinek
  felkutat\u00e1sa, megsz\u00f3l\u00edt\u00e1sa, annak a lehet\u0151s\u00e9gnek a
  megteremt\u00e9se, hogy k\u00f6z\u00f6ss\u00e9get alkossanak, tal\u00e1lkozhassanak
  \u00e9s egy\u00fctt zen\u00e9lhessenek, tov\u00e1bbi egy\u00fcttm\u0171k\u00f6d\u0151
  folyamatokat ind\u00edtsanak el\\n2. Kod\u00e1ly iskol\u00e1k volt n\u00f6vend\u00e9kei
  (\u00e9nekesek, hangszeresek, t\u00e1ncosok) k\u00f6z\u00f6tt a vil\u00e1g minden
  t\u00e1j\u00e1n sz\u00e1mosan vagyunk olyanok, akik k\u00e9pesek min\u0151s\u00e9gi
  produkci\u00f3 l\u00e9trehoz\u00e1s\u00e1ra. Ezen er\u0151k mozg\u00f3s\u00edt\u00e1s\u00e1val\\n\\nc\u00e9lunk
  els\u0151\\n\\nalkalommal\\n\\nKecskem\u00e9ten, sz\u00fcl\u0151v\u00e1ros\u00e1ban\\n\\nl\u00e9trehoz\u00e1s\u00e1val\\n\\nKod\u00e1ly\\n\\nZolt\u00e1n
  ig\u00e9nyes m\u0171sor\\n\\na\\n\\nzene mint\\n\\n\u00f6r\u00f6mforr\u00e1s, a
  k\u00f6z\u00f6s nyelv\\n\\nfelemel\u0151 \u00e9rz\u00e9s\u00e9nek, a pozit\u00edv\\n\\nenergi\u00e1kkal
  val\u00f3 felt\u00f6lt\u0151d\u00e9s lehet\u0151s\u00e9g\u00e9nek val\u00f3ra v\u00e1lt\u00e1sa,
  illetve egyfajta trad\u00edci\u00f3 megteremt\u00e9se\\n\\n3. Hozz\u00e1j\u00e1rulni
  Kecskem\u00e9t v\u00e1ros hagyom\u00e1nyteremt\u0151 \u00e9s szervez\u0151 erej\u00e9nek
  fokoz\u00e1s\u00e1hoz, \u2013 egy\u00fcttm\u0171k\u00f6d\u00e9sek kialak\u00edt\u00e1s\u00e1hoz
  a k\u00f6z\u00f6s c\u00e9lok megval\u00f3s\u00edt\u00e1sa \u00e9rdek\u00e9ben. K\u00f6zrem\u0171k\u00f6dni
  abban, hogy a v\u00e1rosvezet\u00e9s \u00e9s a v\u00e1rosban m\u0171k\u00f6d\u0151
  zenei, kultur\u00e1lis, turisztikai \u00e9s egy\u00e9b civil szervezetek, az egyh\u00e1zak,
  oktat\u00e1si int\u00e9zm\u00e9nyek, a m\u00e9dia, a m\u00e1r megl\u00e9v\u0151
  rendezv\u00e9nyszervez\u0151 tev\u00e9kenys\u00e9gek k\u00fcl\u00f6nb\u00f6z\u0151
  csatorn\u00e1i \u00f6sszefogjanak, egy\u00fcttm\u0171k\u00f6d\u00e9sek form\u00e1l\u00f3djanak
  a c\u00e9lok el\u00e9r\u00e9se \u00e9rdek\u00e9ben\\n4. Az \u00e9vek sor\u00e1n
  egyre vil\u00e1gosabban megfogalmazott k\u00f6z\u00f6s c\u00e9lok nyom\u00e1n megalkotott
  programokon kereszt\u00fcl kialak\u00edtani az ism\u00e9tl\u0151d\u0151 Kod\u00e1ly
  Vil\u00e1ga Fesztiv\u00e1l arculat\u00e1t, karakter\u00e9t, melyen bel\u00fcl k\u00f6zponti
  helyet kap Kod\u00e1ly zen\u00e9je \u00e9s \u00e9let\u00fatja.\\n6. A Kod\u00e1ly
  Vil\u00e1ga kezdem\u00e9nyez\u00e9s tev\u00e9kenys\u00e9gi k\u00f6r\u00e9be tartoz\u00f3,
  l\u00e1t\u00f3mez\u0151j\u00e9be ker\u00fcl\u0151 tehets\u00e9gek, tudom\u00e1nyos
  \u00e9s m\u0171v\u00e9szeti tev\u00e9kenys\u00e9gek menedzsel\u00e9se, t\u00e1mogat\u00e1sa\\n5.
  A Kod\u00e1ly Vil\u00e1ga Fesztiv\u00e1lon, konferenci\u00e1kon k\u00edv\u00fcl
  k\u00f6zponti helyet kap nemzetk\u00f6zi gyermek zenei fesztiv\u00e1lok \u00e9s
  versenyek megszervez\u00e9se\\n7. \\\"Legyen az egy\u00fctt \u00e9nekl\u00e9s, az
