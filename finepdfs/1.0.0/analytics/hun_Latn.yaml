  a 321/2015. (X. 30.) Korm. rendelet 46. \u00a7-\u00e1t megfelel\u0151en alkalmazza.\\n\\n8.
  Aj\u00e1nlatk\u00e9r\u0151 felh\u00edvja az aj\u00e1nlattev\u0151k figyelm\u00e9t
  arra, hogy kiz\u00e1r\u00f3lag az aj\u00e1nlatt\u00e9telre felh\u00edvott gazdas\u00e1gi
  szerepl\u0151 tehet aj\u00e1nlatot. Az aj\u00e1nlatt\u00e9telre felh\u00edvott gazdas\u00e1gi
  szerepl\u0151k k\u00f6z\u00f6sen nem tehetnek aj\u00e1nlatot. Az aj\u00e1nlatt\u00e9telre
  felh\u00edvott gazdas\u00e1gi szerepl\u0151 jogosult k\u00f6z\u00f6sen aj\u00e1nlatot
