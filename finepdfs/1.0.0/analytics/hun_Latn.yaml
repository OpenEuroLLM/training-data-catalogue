  sportj\u00e1t\u00e9k versenyeket, sport\u00e1gv\u00e1laszt\u00f3ra, hideg id\u0151szakban
  korcsoly\u00e1zni vissz\u00fck di\u00e1kjainkat.\\n- Lehet\u0151s\u00e9get biztos\u00edtunk
  kiemelked\u0151 tehets\u00e9g\u0171 tanul\u00f3inknak testnevel\u00e9sb\u0151l k\u00f6z\u00e9p
  \u00e9s emelt szinten is felk\u00e9sz\u00fclni a testnevel\u00e9s \u00e9retts\u00e9gire.\\n-
  A BGSZC \u00e1ltal meghirdetett versenyek rendszeres r\u00e9sztvev\u0151i vagyunk
  sportj\u00e1t\u00e9kokban, - r\u00f6plabd\u00e1ban, kos\u00e1rlabd\u00e1ban, labdar\u00fag\u00e1sban
  - \u00e9s atl\u00e9tik\u00e1ban.\\n- A R\u00e1k\u00f3czi-nap keret\u00e9ben zajl\u00f3
  bemutat\u00f3k, vet\u00e9lked\u00e9sek, versenyek nagyon n\u00e9pszer\u0171ek.\\n-
  Minden tanul\u00f3 fizikai k\u00e9pess\u00e9geit a NETFIT rendszer seg\u00edts\u00e9g\u00e9vel
  \u00e9vente egyszer m\u00e9rj\u00fck.\\n- Mindezek mellett rendszeresen be lehet
  kapcsol\u00f3dni a di\u00e1kszervezet \u00e1ltal k\u00edn\u00e1lt kultur\u00e1lis
  \u00e9s sport programokba, pl. g\u0151lyaprogramokba, R\u00e1k\u00f3czi-nap el\u0151ad\u00e1saiba
  \u00e9s versenyeibe.\\n\\n### 1.6.4. H\u00e1tr\u00e1nyos \u00e9s halmozottan h\u00e1tr\u00e1nyos
  helyzet\u0171 tanul\u00f3 pedag\u00f3giai t\u00e1mogat\u00e1sa\\n\\nA tanul\u00f3
  rendk\u00edv\u00fcl neh\u00e9z csal\u00e1di \u00e9s szoci\u00e1lis h\u00e1tt\u00e9r\u00e9b\u0151l
  sz\u00e1rmaz\u00f3 h\u00e1tr\u00e1nyos helyzet. A csal\u00e1d rendk\u00edv\u00fcl
  alacsony j\u00f6vedelme miatt, a tanul\u00f3k eg\u00e9szs\u00e9gi \u00e1llapota
  gyenge. A gyerekek nem r\u00e9szes\u00fclnek olyan tapasztalatokban, amiket a k\u00f6z\u00e9poszt\u00e1lybeli
  tanul\u00f3k sz\u00e1m\u00e1ra term\u00e9szetesek. Sokszor a sz\u00fcl\u0151i h\u00e1z
  t\u00e1mogat\u00e1sa, motiv\u00e1l\u00e1sa hi\u00e1nyzik.\\n\\n- Ez\u00e9rt szorosan
  egy\u00fcttm\u0171k\u00f6d\u00fcnk az iskolaorvosi, fogorvosi \u00e9s csal\u00e1dorvosi
  h\u00e1l\u00f3zattal.\\n- K\u00fcl\u00f6nleges figyelemmel \u00e9s szeretettel biztons\u00e1gos,
  t\u00e1mogat\u00f3 tanul\u00e1si k\u00f6rnyezetet biztos\u00edtunk sz\u00e1mukra.\\n\\n\u2022
  A h\u00e1tr\u00e1nyos helyzet\u0171 tanul\u00f3 motiv\u00e1l\u00e1sa, \u00f6szt\u00f6nz\u00e9se
  a pedag\u00f3giai folyamatok sor\u00e1n, kiemelt feladatunk. Az egy\u00e9ni sikerek
  a gyerekeket \u00f6n\u00e1ll\u00f3 tanul\u00e1sra, tov\u00e1bbi eredm\u00e9nyek
  el\u00e9r\u00e9s\u00e9re k\u00e9sz\u00edti.\\n\\n\u2022 Nagyon fontosnak tartjuk
  a sz\u00fcl\u0151i h\u00e1z bevon\u00e1s\u00e1t az iskolai \u00e9let\u00e9be. Illetve
  nevel\u00e9si, szem\u00e9lyis\u00e9gfejl\u0151d\u00e9si k\u00e9rd\u00e9sekr\u0151l
  el\u0151ad\u00e1sokat, besz\u00e9lget\u0151 k\u00f6r\u00f6ket szervez\u00fcnk.\\n\\n\u2022
  A tanul\u00f3k szem\u00e9lyis\u00e9gfejl\u0151d\u00e9s\u00e9t t\u00e1mogatva seg\u00edteni
  k\u00edv\u00e1njuk a serd\u00fcl\u0151 kori szerepbiztons\u00e1g, az identit\u00e1s
  kialakul\u00e1s\u00e1t, valamint a felel\u0151ss\u00e9gteljes feln\u0151tt\u00e9
  v\u00e1l\u00e1st.\\n\\n\u2022 F\u0151 feladatunknak tekintj\u00fck, hogy a tanul\u00f3kban
  fel tudjuk kelteni a tanul\u00e1s ir\u00e1nti \u00e9rdekl\u0151d\u00e9st, sikerekhez
  juttassuk \u0151ket, \u00e9s az \u00f6n\u00e1ll\u00f3 ismeretszerz\u00e9s, az \u00e9lethosszig
  tart\u00f3 tanul\u00e1s ig\u00e9ny\u00e9t kialak\u00edtsuk n\u00f6vend\u00e9keinkben.\\n\\n1.7.
  A tanul\u00f3knak az int\u00e9zm\u00e9nyi d\u00f6nt\u00e9si folyamatban val\u00f3
  r\u00e9szv\u00e9teli jogai gyakorl\u00e1s\u00e1nak rendje\\n\\n1.7.1. Di\u00e1kk\u00f6r\u00f6k\\n\\nAz
  iskola tanul\u00f3i a nevel\u00e9s-oktat\u00e1ssal \u00f6sszef\u00fcgg\u0151 k\u00f6z\u00f6s
  tev\u00e9kenys\u00e9g\u00fck megszervez\u00e9s\u00e9re, a demokr\u00e1ci\u00e1ra,
  k\u00f6z\u00e9leti felel\u0151ss\u00e9gre nevel\u00e9s \u00e9rdek\u00e9ben \u2013
  a h\u00e1zirendben meghat\u00e1rozott szerint \u2013 di\u00e1kk\u00f6r\u00f6ket
  hozhatnak l\u00e9tre, amelyek l\u00e9trej\u00f6tt\u00e9t \u00e9s m\u0171k\u00f6d\u00e9s\u00e9t
  a nevel\u0151test\u00fclet seg\u00edti.\\n\\nA di\u00e1kk\u00f6r\u00f6k d\u00f6nt\u00e9si
  jogk\u00f6rt gyakorolhatnak a nevel\u0151test\u00fclet v\u00e9lem\u00e9nye meghallgat\u00e1s\u00e1val:\\n\\n-
  saj\u00e1t k\u00f6z\u00f6ss\u00e9gi \u00e9let\u00fck tervez\u00e9s\u00e9ben, szervez\u00e9s\u00e9ben;\\n-
  tiszts\u00e9gvisel\u0151ik megv\u00e1laszt\u00e1s\u00e1ban;\\n- jogosultak k\u00e9pviseltetni
  magukat a di\u00e1konkorm\u00e1nyzatban.\\n\\n1.7.2. Di\u00e1konkorm\u00e1nyzat\\n\\nA
  tanul\u00f3k, di\u00e1kk\u00f6r\u00f6k a tanul\u00f3k \u00e9rdekeinek k\u00e9pviselet\u00e9re
  di\u00e1konkorm\u00e1nyzatot hozhatnak l\u00e9tre.\\n\\nA di\u00e1konkorm\u00e1nyzat
  munk\u00e1j\u00e1t e feladatra kijel\u00f6lt pedag\u00f3gus seg\u00edti, akit a
  di\u00e1konkorm\u00e1nyzat javaslat\u00e1ra az int\u00e9zm\u00e9nyvezet\u0151 b\u00edz
  meg \u0151t \u00e9ves id\u0151tartamra.\\n\\nA di\u00e1konkorm\u00e1nyzat a nevel\u0151test\u00fclet
  v\u00e9lem\u00e9ny\u00e9nek kik\u00e9r\u00e9s\u00e9vel d\u00f6nt:\\n\\n- saj\u00e1t
  m\u0171k\u00f6d\u00e9s\u00e9r\u0151l;\\n- a di\u00e1konkorm\u00e1nyzat m\u0171k\u00f6d\u00e9s\u00e9hez
  biztos\u00edtott anyagi eszk\u00f6z\u00f6k felhaszn\u00e1l\u00e1s\u00e1r\u00f3l;\\n-
  hat\u00e1sk\u00f6rei gyakorl\u00e1s\u00e1r\u00f3l;\\n- egy tan\u00edt\u00e1s n\u00e9lk\u00fcli
  munkanap programj\u00e1r\u00f3l;\\n- az iskolai di\u00e1konkorm\u00e1nyzat t\u00e1j\u00e9koztat\u00e1si
  rendszer\u00e9nek l\u00e9trehoz\u00e1s\u00e1r\u00f3l \u00e9s m\u0171k\u00f6dtet\u00e9s\u00e9r\u0151l;\\n\\nA
  di\u00e1konkorm\u00e1nyzat v\u00e9lem\u00e9nyt nyilv\u00e1n\u00edthat, javaslattal
  \u00e9lhet a nevel\u00e9si-oktat\u00e1si int\u00e9zm\u00e9ny m\u0171k\u00f6d\u00e9s\u00e9vel
  \u00e9s a tanul\u00f3kkal kapcsolatos valamennyi k\u00e9rd\u00e9sben.\\n\\nV\u00e9lem\u00e9nyez\u00e9si
  jog\\n\\nA di\u00e1k\u00f6nkorm\u00e1nyzat v\u00e9lem\u00e9ny\u00e9t ki kell k\u00e9rni:\\n\\n-
  az iskolai SZMSZ jogszab\u00e1lyban meghat\u00e1rozott rendelkez\u00e9seinek elfogad\u00e1sa
  el\u0151tt;\\n- a tanul\u00f3k k\u00f6z\u00f6ss\u00e9gg\u00e9t \u00e9rint\u0151
  k\u00e9rd\u00e9sek meghozatal\u00e1n\u00e1l;\\n- a tanul\u00f3k helyzet\u00e9t elemz\u0151,
  \u00e9rt\u00e9kel\u0151 besz\u00e1mol\u00f3k elk\u00e9sz\u00edt\u00e9s\u00e9hez,
  elfogad\u00e1s\u00e1hoz;\\n- a tanul\u00f3i p\u00e1ly\u00e1zatok, versenyek meghirdet\u00e9s\u00e9hez,
  megszervez\u00e9s\u00e9hez;\\n- az iskolai sportk\u00f6r m\u0171k\u00f6d\u00e9si
  rendj\u00e9nek meg\u00e1llap\u00edt\u00e1s\u00e1hoz;\\n- az egy\u00e9b foglalkoz\u00e1s
  form\u00e1inak meghat\u00e1roz\u00e1s\u00e1hoz;\\n- a k\u00f6nyvt\u00e1r, a sportl\u00e9tes\u00edtm\u00e9nyek
  m\u0171k\u00f6d\u00e9si rendj\u00e9nek kialak\u00edt\u00e1s\u00e1hoz;\\n- az \u00e9ves
  munkaterv elfogad\u00e1sa el\u0151tt, a tanul\u00f3kat \u00e9rint\u0151 programokat
  illet\u0151en;\\n- a tanul\u00f3i szoci\u00e1lis juttat\u00e1sok eloszt\u00e1si
  elveinek meghat\u00e1roz\u00e1sa el\u0151tt;\\n- az ifj\u00fas\u00e1gpolitikai c\u00e9lokra
  biztos\u00edtott p\u00e9nzeszk\u00f6z\u00f6k felhaszn\u00e1l\u00e1sakor;\\n- a h\u00e1zirend
  elfogad\u00e1sa el\u0151tt;\\n- az adatkezel\u00e9si szab\u00e1lyzat elk\u00e9sz\u00edt\u00e9s\u00e9n\u00e9l,
  m\u00f3dos\u00edt\u00e1s\u00e1n\u00e1l;\\n- a tanul\u00f3i fegyelmi elj\u00e1r\u00e1s
  sor\u00e1n.\\n\\n- A tan\u00edt\u00e1si napot a reggel nyolc \u00f3ra el\u0151tt
  \u2013 az iskolasz\u00e9k, ennek hi\u00e1ny\u00e1ban az iskolai sz\u00fcl\u0151i
  szervezet, k\u00f6z\u00f6ss\u00e9g \u00e9s az iskolai di\u00e1k\u00f6nkorm\u00e1nyzat
  v\u00e9lem\u00e9ny\u00e9nek kik\u00e9r\u00e9sevel \u2013 legfeljebb negyven\u00f6t
  perccel kor\u00e1bban meg lehet kezdeni.\\n\\nAzokban az \u00fcgyekben, amelyekben
  a di\u00e1k\u00f6nkorm\u00e1nyzat v\u00e9lem\u00e9ny\u00e9nek kik\u00e9r\u00e9se
  k\u00f6telez\u0151, a di\u00e1k\u00f6nkorm\u00e1nyzat k\u00e9pvisel\u0151j\u00e9t
  a t\u00e1rgyal\u00e1sra meg kell h\u00edvni, \u00e9s az el\u0151terjeszt\u00e9st,
  valamint a megh\u00edv\u00f3t a t\u00e1rgyal\u00e1s hat\u00e1rnapj\u00e1t legal\u00e1bb
  tizen\u00f6t nappal megel\u0151z\u0151en meg kell k\u00fcldeni a di\u00e1k\u00f6nkorm\u00e1nyzat
  r\u00e9sz\u00e9re.\\n\\nAz iskolai di\u00e1k\u00f6nkorm\u00e1nyzat k\u00e9pvisel\u0151it
  az oszt\u00e1lyok di\u00e1k\u00f6nkorm\u00e1nyzat\u00e1nak (ODB) tagjai ny\u00edlt
  szavaz\u00e1ssal v\u00e1lasztj\u00e1k meg.\\n\\n1.7.3. A D\u00d6K m\u0171k\u00f6d\u00e9se\\n\\nAz
  iskolai di\u00e1k\u00f6nkorm\u00e1nyzat tev\u00e9kenys\u00e9g\u00e9t saj\u00e1t
  szervezeti \u00e9s m\u0171k\u00f6d\u00e9si szab\u00e1lyzata (tov\u00e1bbiakban SZMSZ)
  szerint folytatja. A di\u00e1k\u00f6nkorm\u00e1nyzat SZMSZ-\u00e9t a v\u00e1laszt\u00f3
  tanul\u00f3k\u00f6z\u00f6ss\u00e9g fogadja el, \u00e9s a nevel\u0151test\u00fclet
  hagyja j\u00f3v\u00e1.\\n\\nAz SZMSZ j\u00f3v\u00e1hagy\u00e1sa csak akkor tagadhat\u00f3
  meg, ha az jogszab\u00e1lys\u00e9rt\u0151 vagy ellent\u00e9tes az iskola SZMSZ-\u00e9vel,
  h\u00e1zirendj\u00e9vel.\\n\\nAz SZMSZ j\u00f3v\u00e1hagy\u00e1s\u00e1r\u00f3l a
  nevel\u0151test\u00fcletnek a j\u00f3v\u00e1hagy\u00e1sra t\u00f6rt\u00e9n\u0151
  beterjeszt\u00e9st k\u00f6vet\u0151 harminc napon bel\u00fcl nyilatkoznia kell.
  Az SZMSZ - t vagy annak m\u00f3dos\u00edt\u00e1s\u00e1t j\u00f3v\u00e1hagyottnak
  kell tekinteni, ha a nevel\u0151test\u00fclet harminc napon bel\u00fcl nem nyilatkozik.\\n\\nA
  di\u00e1k\u00f6nkorm\u00e1nyzat feladatainak ell\u00e1t\u00e1s\u00e1hoz t\u00e9rit\u00e9smentesen
  haszn\u00e1lhatja az iskola helyis\u00e9geit, berendez\u00e9seit, ha ezzel nem akad\u00e1lyozza
  az iskola m\u0171k\u00f6d\u00e9s\u00e9t.\\n\\nA di\u00e1kk\u00f6zgy\u0171l\u00e9s
  \u00f6sszeh\u00edv\u00e1s\u00e1t az iskolai di\u00e1k\u00f6nkorm\u00e1nyzat vezet\u0151je
  kezdem\u00e9nyezi, a tan\u00e9v helyi rendj\u00e9ben meghat\u00e1rozottak szerint.\\n\\nAz
  iskola eg\u00e9sz\u00e9nek \u00e9let\u00e9r\u0151l, az iskolai munkatervr\u0151l,
  az aktu\u00e1lis feladatokr\u00f3l az igazgat\u00f3 az iskolai di\u00e1k\u00f6nkorm\u00e1nyzat
  vezet\u0151s\u00e9gi \u00fcl\u00e9s\u00e9n \u00e9s a di\u00e1kk\u00f6zgy\u0171l\u00e9sen,
  a tanul\u00f3i hirdet\u0151t\u00e1bl\u00e1n kereszt\u00fcl, valamint az oszt\u00e1lyf\u0151n\u00f6k\u00f6k
  k\u00f6zvet\u00edt\u00e9s\u00e9vel az oszt\u00e1lyf\u0151n\u00f6ki \u00f3r\u00e1kon
  t\u00e1j\u00e9koztatja a tanul\u00f3kat.\\n\\nA tanul\u00f3k k\u00e9rd\u00e9seiket,
  v\u00e9lem\u00e9ny\u00fcket, javaslataikat sz\u00f3ban vagy \u00edr\u00e1sban egy\u00e9nileg
  vagy v\u00e1lasztott k\u00e9pvisel\u0151k, tiszts\u00e9gvisel\u0151k \u00fatj\u00e1n
  k\u00f6z\u00f6lhetik az iskola igazgat\u00f3s\u00e1g\u00e1val, a nevel\u0151test\u00fclettel.\\n\\nA
  di\u00e1k\u00f6nkorm\u00e1nyzat jogainak megs\u00e9rt\u00e9se eset\u00e9n tizen\u00f6t
  napon bel\u00fcl a fenntart\u00f3hoz jogszab\u00e1lys\u00e9rt\u00e9sre hivatkoz\u00e1ssal
  fellebbez\u00e9st ny\u00fajthat be.\\n\\nA di\u00e1k\u00f6nkorm\u00e1nyzat kezdem\u00e9nyez\u00e9s\u00e9re
  a nevel\u0151test\u00fcletet \u00f6ssze kell h\u00edvni.\\n\\n1.8. A sz\u00fcl\u0151,
  a tanul\u00f3, a pedag\u00f3gus \u00e9s az int\u00e9zm\u00e9ny partnerei kapcsolattart\u00e1s\u00e1nak
  form\u00e1i\\n\\nC\u00e9l, feladat:\\nMivel az iskola nevel\u0151munk\u00e1ja sz\u00fcl\u0151i
  k\u00f6zrem\u0171k\u00f6d\u00e9s n\u00e9lk\u00fcl nehezen tud \u00e9rv\u00e9nyes\u00fclni,
  ez\u00e9rt a c\u00e9l olyan tartalmas, \u00e9rdemi, \u00e9s k\u00f6lcs\u00f6n\u00f6s
  kapcsolat kialak\u00edt\u00e1sa sz\u00fcl\u0151 \u00e9s iskola k\u00f6z\u00f6tt,
  mely \u00e9rv\u00e9nyes\u00edti mind a sz\u00fcl\u0151t, mind a tanul\u00f3t, mind
  a pedag\u00f3gust megillet\u0151 jogokat, ugyanakkor \u00fcgyel k\u00f6teless\u00e9geik
  marad\u00e9ktalan betart\u00e1s\u00e1ra.\\n\\nA kit\u0171z\u00f6tt feladat: a megfelel\u0151
  t\u00f6rv\u00e9nyi h\u00e1tt\u00e9r betart\u00e1s\u00e1val, a rendelkez\u00e9sre
  \u00e1ll\u00f3 eszk\u00f6z\u00f6k felhaszn\u00e1l\u00e1s\u00e1val a kapcsolat folyamatos
  fenntart\u00e1sa, \u00e9l\u0151v\u00e9 t\u00e9tele.\\n\\n1.8.1. Sz\u00fcl\u0151i
  szervezet\\n\\nA sz\u00fcl\u0151k jogaik \u00e9rv\u00e9nyes\u00edt\u00e9se, k\u00f6teless\u00e9g\u00fck
  teljes\u00edt\u00e9se \u00e9rdek\u00e9ben, az int\u00e9zm\u00e9ny m\u0171k\u00f6d\u00e9s\u00e9t,
  munk\u00e1j\u00e1t \u00e9rint\u0151 k\u00e9rd\u00e9seken v\u00e9lem\u00e9nyez\u00e9si,
  javaslattev\u0151 joggal rendelkez\u0151 sz\u00fcl\u0151i szervezetet (k\u00f6z\u00f6ss\u00e9get)
  hozhatnak l\u00e9tre.\\n\\nA sz\u00fcl\u0151i szervezet a jogainak megs\u00e9rt\u00e9se
  eset\u00e9n tizen\u00f6t napon bel\u00fcl a fenntart\u00f3hoz jogszab\u00e1lys\u00e9rt\u00e9sre
  hivatkoz\u00e1ssal fellebbez\u00e9st ny\u00fajthat be.\\n\\nAz iskola \u00e9s sz\u00fcl\u0151k
  k\u00f6zti tartalmas \u00e9s \u00e9rdemi munkakapcsolat kialakul\u00e1s\u00e1hoz
  figyelembe kell venn\u00fcnk a sz\u00fcl\u0151knek a k\u00f6znevel\u00e9si t\u00f6rv\u00e9ny
  \u00e1ltal r\u00f6gz\u00edtett k\u00f6teless\u00e9geit \u00e9s jogait, hiszen a
  t\u00f6rv\u00e9nym\u00f3dos\u00edt\u00e1s a kor\u00e1bban hat\u00e1lyos rendelkez\u00e9shez
  k\u00e9pest egy\u00e9rtelm\u0171v\u00e9 \u00e9s pontosabb\u00e1 teszi, milyen k\u00f6telezetts\u00e9gek
  terhelik, \u00e9s milyen jogok illetik meg a sz\u00fcl\u0151t. Ezek ismerete \u00e9s
  betart\u00e1sa elengedhetetlen az eredm\u00e9nyes egy\u00fcttm\u0171k\u00f6d\u00e9shez.\\n\\n1.8.2.
  V\u00e9lem\u00e9nyez\u00e9si jog\\n\\nA sz\u00fcl\u0151i szervezetet v\u00e9lem\u00e9nyez\u00e9si
  jog illeti meg:\\n\\n- az iskolai munkaterv elk\u00e9sz\u00edt\u00e9s\u00e9n\u00e9l;\\n-
  az adatkezel\u00e9si szab\u00e1lyzat elk\u00e9sz\u00edt\u00e9s\u00e9n\u00e9l, m\u00f3dos\u00edt\u00e1s\u00e1n\u00e1l;\\n-
  a fenntart\u00f3 a k\u00f6znevel\u00e9si int\u00e9zm\u00e9ny megsz\u00fcntet\u00e9s\u00e9vel,
  \u00e1tszervez\u00e9s\u00e9vel, feladat\u00e1nak megv\u00e1ltoztat\u00e1s\u00e1val,
  nev\u00e9nek meg\u00e1llap\u00edt\u00e1s\u00e1val, vezet\u0151j\u00e9nek megb\u00edz\u00e1s\u00e1val
  \u00e9s megb\u00edz\u00e1s\u00e1nak visszavon\u00e1s\u00e1val \u00f6sszef\u00fcgg\u0151
  d\u00f6nt\u00e9se vagy v\u00e9lem\u00e9ny\u00e9nek kialak\u00edt\u00e1sa el\u0151tt;\\n\\n\u2022
  ha iskol\u00e1szek nem m\u0171k\u00f6dik, az SZMSZ elfogad\u00e1sakor az iskolai
  sz\u00fcl\u0151i szervezet, k\u00f6z\u00f6ss\u00e9g v\u00e9lem\u00e9ny\u00e9t kell
  beszerezni;\\n\\nAz iskolai sz\u00fcl\u0151i szervezet, k\u00f6z\u00f6ss\u00e9g
  figyelemmel k\u00eds\u00e9ri\\n\u2022 a tanul\u00f3i jogok \u00e9rv\u00e9nyes\u00fcl\u00e9s\u00e9t;\\n\u2022
  a pedag\u00f3giai munka eredm\u00e9nyess\u00e9g\u00e9t.\\n\\nA tanul\u00f3k csoportj\u00e1t
  \u00e9rint\u0151 b\u00e1rmely k\u00e9rd\u00e9sben t\u00e1j\u00e9koztat\u00e1st k\u00e9rhet
  a nevel\u00e9si-oktat\u00e1si int\u00e9zm\u00e9ny vezet\u0151j\u00e9t\u0151l, az
  e k\u00f6rbe tartoz\u00f3 \u00fcgyek t\u00e1rgyal\u00e1sakor k\u00e9pvisel\u0151je
  tan\u00e1cskoz\u00e1si joggal r\u00e9szt vehet a nevel\u0151test\u00fclet \u00e9rtekezletein.\\n\\n1.8.3.
  Egy\u00fcttm\u0171k\u00f6d\u00e9si ter\u00fcletek\\n\\nK\u00f6lcs\u00f6n\u00f6s
  r\u00e9szv\u00e9tel az \u00e9rtekezleteken, fegyelmi t\u00e1rgyal\u00e1sokon, elismer\u00e9sek,
  oktat\u00e1si\u2013nevel\u00e9si programok, dokumentumok megbesz\u00e9l\u00e9se,
  v\u00e9lem\u00e9nyez\u00e9se, inform\u00e1ci\u00f3csere (oszt\u00e1lyf\u0151n\u00f6k\u00f6k,
  szaktan\u00e1rok seg\u00edts\u00e9g\u00e9vel) a sz\u00fcl\u0151k \u00e9s az iskola
  egy\u00fcttm\u0171k\u00f6d\u00e9s\u00e9nek ter\u00fcletei.\\n\\nNevel\u0151test\u00fcleti
  \u00e9rtekezletet kell \u00f6sszeh\u00edvni a sz\u00fcl\u0151i szervezet, k\u00f6z\u00f6ss\u00e9g,
  kezdem\u00e9nyez\u00e9sre.\\n\\n126.96.36.199. Az egy\u00fcttm\u0171k\u00f6d\u00e9sben
  r\u00e9szt vev\u0151 szervezetek:\\n\\n\u2022 Tan\u00e1ri szervezetek: tantest\u00fclet,
  szakmai munkak\u00f6z\u00f6ss\u00e9gek.\\n\u2022 Sz\u00fcl\u0151i szervezet\\n\u2022
  Vezet\u0151s\u00e9g: igazgat\u00f3, helyettesek.\\n\\n188.8.131.52. Egy\u00fcttm\u0171k\u00f6d\u00e9si
  keretek a sz\u00fcl\u0151k \u00e9s az iskola k\u00f6z\u00f6tt\\n\\nA k\u00f6vetkez\u0151
  esem\u00e9nyek, alkalmak adj\u00e1k sz\u00fcl\u0151k \u00e9s iskola k\u00f6zti egy\u00fcttm\u0171k\u00f6d\u00e9s
  lehet\u0151s\u00e9geit:\\n\u2022 sz\u00fcl\u0151i munkak\u00f6z\u00f6ss\u00e9gek,
  a sz\u00fcl\u0151i szervezet \u00e9rtekezletei,\\n\u2022 sz\u00fcl\u0151i \u00e9rtekezletek,\\n\u2022
  el\u0151zetes egyeztet\u00e9s alapj\u00e1n fogad\u00f3\u00f3r\u00e1k\\n\u2022 oszt\u00e1lykir\u00e1ndul\u00e1sok,\\n\u2022
  oszt\u00e1lyprogramok,\\n\u2022 iskolai rendezv\u00e9nyek: szalagavat\u00f3 b\u00e1l,
  R\u00e1k\u00f3czi-nap, ballag\u00e1s, sz\u00f3beli \u00e9retts\u00e9gi vizsg\u00e1k,
  \u00fcnneps\u00e9gek, meglel\u00e9kez\u00e9sek, versenyek.\\n\\n1.9. Vizsg\u00e1k,
  felv\u00e9tel szab\u00e1lyai\\n\\nA 20/2012. (VIII. 31.) EMMI rendelet a nevel\u00e9si-oktat\u00e1si
  int\u00e9zm\u00e9nyek m\u0171k\u00f6d\u00e9s\u00e9r\u0151l \u00e9s a k\u00f6znevel\u00e9si
  int\u00e9zm\u00e9nyek n\u00e9vhaszn\u00e1lat\u00e1r\u00f3l szab\u00e1lyozza \u00e1tfog\u00f3an
  az \u00e9rt\u00e9kel\u00e9st \u00e9s a vizsg\u00e1k rendj\u00e9t, az alapszab\u00e1lyoz\u00e1st
  a 2011. \u00e9vi CXC. t\u00f6rv\u00e9ny a nemzeti k\u00f6znevel\u00e9sr\u0151l teszi
  meg.\\n\\n1.9.1. \u00c1ltal\u00e1nos alapelvek\\n\\nA pedag\u00f3gus a tanul\u00f3
  teljes\u00edtm\u00e9ny\u00e9t, el\u0151menetel\u00e9t tan\u00edt\u00e1si \u00e9v
  k\u00f6zben rendszeresen \u00e9rdemjeggyel \u00e9rt\u00e9keli, f\u00e9l\u00e9vkor
  \u00e9s a tan\u00edt\u00e1si \u00e9v v\u00e9g\u00e9n oszt\u00e1lyzattal min\u0151s\u00edti.
  A tanul\u00f3 oszt\u00e1lyzatait \u00e9vk\u00f6zi teljes\u00edtm\u00e9nye \u00e9s
  \u00e9rdemjegyei vagy az oszt\u00e1lyoz\u00f3 vizsg\u00e1n, a k\u00fcl\u00f6nb\u00f6z\u0151i
  vizsg\u00e1n, valamint a p\u00f3tl\u00f3 \u00e9s jav\u00edt\u00f3vizsg\u00e1n ny\u00fajtott
  teljes\u00edtm\u00e9nye (a tov\u00e1bbiakban a felsorolt vizsg\u00e1k egy\u00fctt:
  tanulm\u00e1nyok alatti vizsga) alapj\u00e1n kell meg\u00e1llap\u00edtani. A f\u00e9l\u00e9vi
  \u00e9s az \u00e9v v\u00e9gi oszt\u00e1lyzatot az \u00e9rdemjegyek alapj\u00e1n
  kell meghat\u00e1rozni. A tanul\u00f3 magatart\u00e1s\u00e1nak \u00e9s szorgalm\u00e1nak
  \u00e9rt\u00e9kel\u00e9s\u00e9t \u00e9s min\u0151s\u00edt\u00e9s\u00e9t az oszt\u00e1lyf\u0151n\u00f6k
  \u2013 az oszt\u00e1lyban tan\u00edt\u00f3 pedag\u00f3gusok v\u00e9lem\u00e9ny\u00e9nek
  kik\u00e9r\u00e9sevel \u2013 v\u00e9gzi. Az \u00e9rdemjegy \u00e9s az oszt\u00e1lyzat
  meg\u00e1llap\u00edt\u00e1sa a tanul\u00f3 teljes\u00edtm\u00e9ny\u00e9nek, szorgalm\u00e1nak
  \u00e9rt\u00e9kel\u00e9sekor, min\u0151s\u00edt\u00e9sekor nem lehet fegyelmez\u00e9si
  eszk\u00f6z. Az \u00e9rdemjegyekr\u0151l a tanul\u00f3t \u00e9s a kiskor\u00fa tanul\u00f3
  sz\u00fcl\u0151j\u00e9t rendszeresen \u00e9rtes\u00edteni kell. A t\u00e1j\u00e9koztat\u00e1s
  ide\u00e1lis esetben folyamatos, b\u00e1rmilyen eszk\u00f6zzel t\u00f6rt\u00e9nhet,
  sz\u00f3ban, \u00edr\u00e1sban. Az iskola az oszt\u00e1lyzatr\u00f3l a tanul\u00f3t
  \u00e9s a kiskor\u00fa tanul\u00f3 sz\u00fcl\u0151j\u00e9t f\u00e9l\u00e9vkor \u00e9rtes\u00edt\u0151,
  \u00e9v v\u00e9g\u00e9n bizony\u00edtv\u00e1ny \u00fatj\u00e1n \u00e9rtes\u00edti.
  A f\u00e9l\u00e9vi \u00e9s az \u00e9v v\u00e9gi buk\u00e1s fenn\u00e1ll\u00f3 lehet\u0151s\u00e9g\u00e9r\u0151l
  a sz\u00fcl\u0151t, tanul\u00f3t az e-napl\u00f3n kereszt\u00fcl az oszt\u00e1lyf\u0151n\u00f6k
  t\u00e1j\u00e9koztatja.\\n\\n1.9.2. A tanulm\u00e1nyok alatti vizsg\u00e1k\\n\\n184.108.40.206.
  Oszt\u00e1lyoz\u00f3 vizsga\\n\\nOszt\u00e1lyoz\u00f3 vizsg\u00e1t kell tennie a
  tanul\u00f3nak a f\u00e9l\u00e9vi \u00e9s a tan\u00e9v v\u00e9g\u0151 oszt\u00e1lyzat
  meg\u00e1llap\u00edt\u00e1s\u00e1hoz,\\n\\n- ha felmentett\u00e9k a tan\u00f3r\u00e1i
  foglalkoz\u00e1sokon val\u00f3 r\u00e9szv\u00e9tele al\u00f3l;\\n- enged\u00e9lyezt\u00e9k,
  hogy egy vagy t\u00f6bb tant\u00e1rgy tanulm\u00e1nyi k\u00f6vetelm\u00e9ny\u00e9nek
  egy tan\u00e9vben vagy az el\u0151\u00edrttn\u00e1l r\u00f6videbb id\u0151 alatt
  tegyen eleget;\\n\\n\u2022 meghat\u00e1rozott id\u0151n\u00e9l t\u00f6bbet mulasztott,
  \u00e9s a nevel\u0151test\u00fclet d\u00f6nt\u00e9se alapj\u00e1n oszt\u00e1lyoz\u00f3
  vizsg\u00e1t tehet;\\n\u2022 ha a tanul\u00f3 a f\u00e9l\u00e9vi, \u00e9v v\u00e9gi
  oszt\u00e1lyzat\u00e1nak meg\u00e1llap\u00edt\u00e1sa \u00e9rdek\u00e9ben f\u00fcggetlen
  vizsgabizotts\u00e1g el\u0151tt tesz vizsg\u00e1t.\\n\\nEgy oszt\u00e1lyoz\u00f3
  vizsga egy adott tant\u00e1rgy \u00e9s egy adott \u00e9vfolyam k\u00f6vetelm\u00e9nyeinek
  teljes\u00edt\u00e9s\u00e9re vonatkozik. A tan\u00edt\u00e1si \u00e9v lez\u00e1r\u00e1s\u00e1t
  szolg\u00e1l\u00f3 oszt\u00e1lyoz\u00f3 vizsg\u00e1t az adott tan\u00edt\u00e1si
  \u00e9vben kell megszervezni.\\n\\n220.127.116.11. K\u00fcl\u00f6nb\u00f6zet\u00ed
  vizsga\\n\\nK\u00fcl\u00f6nb\u00f6zet\u00ed vizsg\u00e1t a tanul\u00f3 abban az
  iskol\u00e1ban tehet, amelyben a tanulm\u00e1nyait folytatni k\u00edv\u00e1nja.\\n\\nA
  k\u00fcl\u00f6nb\u00f6zet\u00ed vizsg\u00e1kra tan\u00e9venk\u00e9nt legal\u00e1bb
  k\u00e9t vizsgaid\u0151szakot kell kijel\u00f6lni, ami a tan\u00e9v rendj\u00e9ben
  ker\u00fcl meghat\u00e1roz\u00e1sra.\\n\\n18.104.22.168. P\u00f3tl\u00f3 vizsga\\n\\nP\u00f3tl\u00f3
  vizsg\u00e1t tehet a vizsg\u00e1z\u00f3, ha a vizsg\u00e1r\u00f3l neki fel nem r\u00f3hat\u00f3
  okb\u00f3l elk\u00e9szik, t\u00e1vol marad, vagy a megkezdett vizsg\u00e1r\u00f3l
  enged\u00e9llyel elt\u00e1vozik, miel\u0151tt a v\u00e1laszad\u00e1st befejezn\u00e9.\\n\\nA
  vizsg\u00e1z\u00f3nak fel nem r\u00f3hat\u00f3 ok minden olyan, a vizsg\u00e1n val\u00f3
  r\u00e9szv\u00e9telt g\u00e1tol\u00f3 esem\u00e9ny, k\u00f6r\u00fclm\u00e9ny, amelynek
  bek\u00f6vetkez\u00e9se nem vezethet\u0151 vissza a vizsg\u00e1z\u00f3 sz\u00e1nd\u00e9kos
  vagy gondatlan magatart\u00e1s\u00e1ra.\\n\\nAz igazgat\u00f3 hozz\u00e1j\u00e1rulhat
  ahhoz, hogy az adott vizsganapon vagy a vizsg\u00e1z\u00f3 \u00e9s az int\u00e9zm\u00e9ny
  sz\u00e1m\u00e1ra megszervezhet\u0151 legk\u00f6zelebbi id\u0151pontban a vizsg\u00e1z\u00f3
  p\u00f3tl\u00f3 vizsg\u00e1t tegyen, ha ennek felt\u00e9telei megteremthet\u0151k.\\n\\nA
  vizsg\u00e1z\u00f3 k\u00e9r\u00e9s\u00e9re a vizsga megszak\u00edt\u00e1s\u00e1ig
  a vizsgak\u00e9rd\u00e9sekre adott v\u00e1laszait \u00e9rt\u00e9kelni kell.\\n\\n22.214.171.124.
  Jav\u00edt\u00f3vizsga\\n\\nJav\u00edt\u00f3vizsg\u00e1t tehet a vizsg\u00e1z\u00f3,
  ha\\n\\n\u2022 a tan\u00e9v v\u00e9g\u00e9n \u2013 legfeljebb h\u00e1rom tant\u00e1rgyb\u00f3l
  \u2013 el\u00e9gtelen oszt\u00e1lyzatot kapott;\\n\u2022 az oszt\u00e1lyoz\u00f3
  vizsg\u00e1r\u00f3l, a k\u00fcl\u00f6nb\u00f6zet\u00ed vizsg\u00e1r\u00f3l sz\u00e1m\u00e1ra
  felr\u00f3hat\u00f3 okb\u00f3l\\n  - elk\u00e9szik,\\n\\n- t\u00e1vol marad,\\n-
  a vizsg\u00e1r\u00f3l enged\u00e9ly n\u00e9lk\u00fcl elt\u00e1vozik.\\n\\nA vizsg\u00e1z\u00f3
  jav\u00edt\u00f3vizsg\u00e1t az iskola igazgat\u00f3ja \u00e1ltal meghat\u00e1rozott
  id\u0151pontban, az augusztus 15-\u00e9t\u0151l augusztus 31-\u00e9ig terjed\u0151
  id\u0151szakban tehet.\\n\\n1.9.3. K\u00f6z\u00f6s szab\u00e1lyok\\n\\nA vizsg\u00e1t
  megel\u0151z\u0151 h\u00e1rom h\u00f3napon bel\u00fcl kell a vizsgaid\u0151szakot
  kijel\u00f6lni. A vizsg\u00e1k id\u0151pontj\u00e1r\u00f3l a vizsg\u00e1z\u00f3t
  a vizsg\u00e1ra t\u00f6rt\u00e9n\u0151 jelentkez\u00e9skor \u00edr\u00e1sban t\u00e1j\u00e9koztatni
  kell.\\n\\nA szab\u00e1lyosan megtartott tanulm\u00e1nyok alatti vizsga nem ism\u00e9telhet\u0151.
  Az iskol\u00e1ban tartott tanulm\u00e1nyok alatti vizsga eset\u00e9n az igazgat\u00f3,
  a f\u00fcggetlen vizsgabizotts\u00e1g el\u0151tti vizsga eset\u00e9n a korm\u00e1nyhivatal
  vezet\u0151je enged\u00e9lyezheti, hogy a vizsg\u00e1z\u00f3 az el\u0151re meghat\u00e1rozott
  id\u0151pontt\u00f3l elt\u00e9r\u0151 id\u0151ben tegyen vizsg\u00e1t.\\n\\n1.9.4.
  Vizsgaszervez\u00e9s\\n\\nTanulm\u00e1nyok alatti vizsg\u00e1t legal\u00e1bb h\u00e1romtag\u00fa
  vizsgabizotts\u00e1g el\u0151tt kell tenni. Amennyiben a nevel\u00e9si-oktat\u00e1si
  int\u00e9zm\u00e9nyben foglalkoztatottak v\u00e9gzetts\u00e9ge, szakk\u00e9pzetts\u00e9ge
  alapj\u00e1n erre lehet\u0151s\u00e9g van, a vizsgabizotts\u00e1gba legal\u00e1bb
  k\u00e9t olyan pedag\u00f3gust kell jel\u00f6lni, aki jogosult az adott tant\u00e1rgy
  tan\u00edt\u00e1s\u00e1ra.\\n\\nA tanulm\u00e1nyok alatti vizsga k\u00f6vetelm\u00e9nyeit,
  r\u00e9szeit, \u00edgy k\u00fcl\u00f6n\u00f6sen az \u00edr\u00e1sbeli, a sz\u00f3beli,
  a gyakorlati vizsgar\u00e9szeket, az \u00e9rt\u00e9kel\u00e9s szab\u00e1lyait meg
  kell meghat\u00e1rozni (ld. az al\u00e1bbiakban).\\n\\nA tanulm\u00e1nyok alatti
  vizsga \u2013 ha azt az iskol\u00e1ban szervezik \u2013 vizsgabizotts\u00e1g\u00e1nak
  eln\u00f6k\u00e9t \u00e9s tagjait az igazgat\u00f3, a f\u00fcggetlen vizsgabizotts\u00e1g
  eln\u00f6k\u00e9t \u00e9s tagjait a ter\u00fcletileg illet\u00e9kes korm\u00e1nyhivatal
  b\u00edzza meg.\\n\\nA tanulm\u00e1nyok alatti vizsga vizsgabizotts\u00e1g\u00e1nak
  eln\u00f6ke felel a vizsga szakszer\u0171 \u00e9s jogszer\u0171 megtart\u00e1s\u00e1\u00e9rt:\\n\\n-
  meggy\u0151z\u0151dik arr\u00f3l, a vizsg\u00e1z\u00f3 jogosult-e a vizsga megkezd\u00e9s\u00e9re,
  \u00e9s teljes\u00edtette-e a vizsga let\u00e9tel\u00e9hez el\u0151\u00edrt felt\u00e9teleket;\\n-
  sz\u00fcks\u00e9g eset\u00e9n kezdem\u00e9nyezi a szab\u00e1lytalanul vizsg\u00e1zni
  sz\u00e1nd\u00e9koz\u00f3k kiz\u00e1r\u00e1s\u00e1t;\\n- vezeti a sz\u00f3beli vizsg\u00e1kat
  \u00e9s a vizsgabizotts\u00e1g \u00e9rtekezleteit;\\n- \u00e1tvizsg\u00e1lja a vizsg\u00e1val
  kapcsolatos iratokat, a szab\u00e1lyzatban foglaltak szerint al\u00e1\u00edrja a
  vizsga iratait;\\n\\n\u2022 a vizsgabizotts\u00e1g \u00e9rtekezletein v\u00e9lem\u00e9nyelt\u00e9r\u00e9s
  eset\u00e9n szavaz\u00e1st rendel el.\\n\\nA vizsgabizotts\u00e1gi eln\u00f6k feladatainak
  ell\u00e1t\u00e1s\u00e1ba a vizsgabizotts\u00e1g tagjait bevonhatja.\\n\\nA k\u00e9rdez\u0151
  tan\u00e1r csak az lehet, aki a vizsga t\u00e1rgya szerinti tant\u00e1rgyat tan\u00edthatja.\\nA
  vizsgabizotts\u00e1g munk\u00e1j\u00e1t \u00e9s mag\u00e1t a vizsg\u00e1t az iskola
  igazgat\u00f3ja k\u00e9sz\u00edti el\u0151.\\nA vizsga reggel nyolc \u00f3ra el\u0151tt
  nem kezdhet\u0151 el, \u00e9s legfeljebb tizenh\u00e9t \u00f3r\u00e1ig tarthat.\\nEgy
  vizsganapon egy vizsg\u00e1z\u00f3 vonatkoz\u00e1s\u00e1ban legfeljebb h\u00e1rom
  \u00edr\u00e1sbeli vizsg\u00e1t lehet megtartani. Egy vizsg\u00e1z\u00f3nak egy
  napra legfeljebb h\u00e1rom tant\u00e1rgyb\u00f3l szervezhet\u0151 sz\u00f3beli
  vizsga.\\nA vizsg\u00e1z\u00f3 sz\u00e1m\u00e1ra az \u00edr\u00e1sbeli feladatok
  megv\u00e1laszol\u00e1s\u00e1hoz rendelkez\u00e9sre \u00e1ll\u00f3 maxim\u00e1lis
  id\u0151 tant\u00e1rgyank\u00e9nt hatvan perc. A vizsg\u00e1k k\u00f6z\u00f6tt a
  vizsg\u00e1z\u00f3 k\u00e9r\u00e9s\u00e9re legal\u00e1bb t\u00edz, legfeljebb harminc
  perc pihen\u0151id\u0151t kell biztos\u00edtani.\\nA p\u00f3tl\u00f3 vizsga \u2013
  sz\u00fcks\u00e9g eset\u00e9n \u00fajabb pihen\u0151id\u0151 beiktat\u00e1s\u00e1val
  \u2013 harmadik vizsgak\u00e9nt is megszervezhet\u0151.\\nA vizsgateremben egyidej\u0171leg
  legfeljebb hat vizsg\u00e1z\u00f3 tart\u00f3zkodhat.\\nHa a vizsg\u00e1z\u00f3 a
  h\u00fazott t\u00e9tel anyag\u00e1ban teljes t\u00e1j\u00e9kozatlans\u00e1got \u00e1rul
  el, azaz felelet\u00e9nek \u00e9rt\u00e9kel\u00e9se nem \u00e9ri el az el\u00e9gs\u00e9ges
  szintet, az eln\u00f6k egy alkalommal p\u00f3tt\u00e9telt h\u00fazat vele. Ez esetben
  a sz\u00f3beli min\u0151s\u00edt\u00e9st a p\u00f3tt\u00e9telre adott felelet alapj\u00e1n
  kell kialak\u00edtani \u00fagy, hogy az el\u00e9rt pontsz\u00e1mot meg kell felelni
  \u00e9s eg\u00e9sz pontra fel kell kerek\u00edteni, majd az oszt\u00e1lyzatot ennek
  alapj\u00e1n kell kisz\u00e1m\u00edtani.\\n\\n1.9.5. A felv\u00e9teli vizsga k\u00f6vetelm\u00e9nyei\\n\\nA
  jelentkez\u0151knek k\u00f6zponti \u00edr\u00e1sbeli vizsg\u00e1t kell \u00edrniuk,
  majd felv\u00e9teli elbesz\u00e9lget\u00e9sre h\u00edvjuk be minden hozz\u00e1nk
  jelentkez\u0151 di\u00e1kot.\\nA KatonaSuli/Honv\u00e9d Kad\u00e9t programban r\u00e9sztvev\u0151
  oszt\u00e1lyba jelentkez\u0151k sz\u00e1m\u00e1ra a fizikai alkalmass\u00e1gi teszt
  elv\u00e9gz\u00e9se is k\u00f6telez\u0151.\\n\\n1.9.6. A felv\u00e9tel helyi szab\u00e1lyai\\n\\nA
  hozz\u00e1nk jelentkez\u0151 di\u00e1koknak k\u00f6zponti \u00edr\u00e1sbeli vizsg\u00e1t
  kell \u00edrniuk, majd sz\u00f3beli elbesz\u00e9lget\u00e9sre h\u00edvjuk be \u0151ket.
  A KatonaSuli/Honv\u00e9d Kad\u00e9t programra jelentkez\u0151k sz\u00e1m\u00e1ra
  fizikai alkalmass\u00e1gi teszt elv\u00e9gz\u00e9se k\u00f6telez\u0151.\\n\\nA bejut\u00e1s
  alapjai:\\n\\n- k\u00f6zponti \u00edr\u00e1sbeli vizsg\u00e1n el\u00e9rt eredm\u00e9ny.
  **Maximum 100 pont.**\\n- az \u00e1ltal\u00e1nos iskol\u00e1ban el\u00e9rt eredm\u00e9ny:
  5-7. \u00e9v v\u00e9gi \u00e9s 8. f\u00e9l\u00e9vi magyar nyelv \u00e9s irodalom,
  matematika, t\u00f6rt\u00e9nelem, 1. tanult idegen nyelv oszt\u00e1lyzat\u00e1b\u00f3l
  tev\u0151dik \u00f6ssze. **Maximum 100 pont.**\\n\\nA 9. \u00e9vfolyamba t\u00f6rt\u00e9n\u0151
