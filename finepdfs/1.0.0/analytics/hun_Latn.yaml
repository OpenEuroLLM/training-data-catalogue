  ered\u0151en felmer\u00fclt b\u00e1rmely k\u00f6zvetlen, vagy k\u00f6zvetett m\u00f3don
  bek\u00f6vetkezett k\u00e1r eset\u00e9re.\\n\\nIII. A k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s
  szab\u00e1lyai\\n\\n1) Az aj\u00e1nlat elk\u00e9sz\u00edt\u00e9s\u00e9nek alapj\u00e1t
  az EKR-ben publik\u00e1lt dokumentumok k\u00e9pezik, amelyek tartalmazz\u00e1k az
  aj\u00e1nlat elk\u00e9sz\u00edt\u00e9s\u00e9vel kapcsolatban az aj\u00e1nlattev\u0151
  r\u00e9sz\u00e9re sz\u00fcks\u00e9ges inform\u00e1ci\u00f3kr\u00f3l sz\u00f3l\u00f3
  t\u00e1j\u00e9koztat\u00e1st, az aj\u00e1nlat r\u00e9szek\u00e9nt beny\u00fajtand\u00f3
  igazol\u00e1sok, nyilatkozatok jegyz\u00e9k\u00e9t, a nyilatkozatmint\u00e1kat,
  a m\u0171szaki le\u00edr\u00e1st, valamint a szerz\u0151d\u00e9stervezetet. Az aj\u00e1nlattev\u0151nek
  az aj\u00e1nlati felh\u00edv\u00e1sban, illetve a k\u00f6zbeszerz\u00e9si dokumentumokban
  meghat\u00e1rozott tartalmi \u00e9s formai k\u00f6vetelm\u00e9nyeknek megfelel\u0151en
  kell aj\u00e1nlat\u00e1t elk\u00e9sz\u00edtenie.\\n\\n2) Aj\u00e1nlata beny\u00fajt\u00e1s\u00e1val
  az aj\u00e1nlattev\u0151 teljes eg\u00e9sz\u00e9ben \u00e9s megk\u00f6t\u00e9sek
  n\u00e9lk\u00fcl elfogadja a jelen k\u00f6zbeszerz\u00e9si dokumentumokban meghat\u00e1rozott
  \u00f6sszes felt\u00e9telt az aj\u00e1nlatt\u00e9teli id\u0151szakban esetlegesen
  kiadott kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1sokkal, m\u00f3dos\u00edt\u00e1sokkal
  egy\u00fctt.\\n\\n3) Az aj\u00e1nlattev\u0151 k\u00f6teless\u00e9ge, hogy teljes
  k\u00f6r\u0171 ismeretet szerezzen a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1s minden
  vonatkoz\u00e1s\u00e1ban az aj\u00e1nlat beny\u00fajt\u00e1sa el\u0151tt. Aj\u00e1nlatk\u00e9r\u0151
  felt\u00e9telezi, hogy az aj\u00e1nlattev\u0151 minden olyan inform\u00e1ci\u00f3t
  beszerzett, amely az EKR rendszer haszn\u00e1lat\u00e1hoz, az aj\u00e1nlat elk\u00e9sz\u00edt\u00e9s\u00e9hez
  \u00e9s a szerz\u0151d\u00e9sk\u00f6t\u00e9shez sz\u00fcks\u00e9ges. Aj\u00e1nlatk\u00e9r\u0151
  aj\u00e1nlattev\u0151t\u0151l elv\u00e1rja, hogy az \u00f6sszes t\u00e1j\u00e9koztat\u00e1st,
  k\u00f6vetelm\u00e9nyt, meghat\u00e1roz\u00e1st, amelyet a k\u00f6zbeszerz\u00e9si
  dokumentumok tartalmaznak, \u00e1tvizsg\u00e1ljon. B\u00e1rmely, az aj\u00e1nlat
  \u00e1ltal tartalmazott hiba, hi\u00e1nyoss\u00e1g az aj\u00e1nlattev\u0151 kock\u00e1zat\u00e1ra
  t\u00f6rt\u00e9nik, \u00e9s az aj\u00e1nlat \u00e9rv\u00e9nytelens\u00e9g\u00e9t
  eredm\u00e9nyezheti.\\n\\n4) Az aj\u00e1nlat \u00e9rv\u00e9nytelen, ha aj\u00e1nlattev\u0151
  aj\u00e1nlat\u00e1t b\u00e1rmilyen felt\u00e9telhez k\u00f6ti, tov\u00e1bb\u00e1
  akkor is, ha t\u00f6bbv\u00e1ltozat\u00fa aj\u00e1nlatot tesz. Aj\u00e1nlatk\u00e9r\u0151
  t\u00f6bbv\u00e1ltozat\u00fa aj\u00e1nlatnak tekint k\u00fcl\u00f6n\u00f6sen minden
  olyan aj\u00e1nlatot, amely a megval\u00f3s\u00edt\u00e1s tekintet\u00e9ben t\u00f6bb
  javaslatot tartalmaz. Aj\u00e1nlatk\u00e9r\u0151 sz\u00e1m\u00e1ra h\u00e1tr\u00e1nyosabb
  (azaz a szerz\u0151d\u00e9ses minimum k\u00f6vetelm\u00e9nyeknek meg nem felel\u0151)
  felt\u00e9tel megad\u00e1sa az aj\u00e1nlat \u00e9rv\u00e9nytelenne nyilv\u00e1n\u00edt\u00e1s\u00e1t
  vonja maga ut\u00e1n. Aj\u00e1nlatk\u00e9r\u0151 a F\u0151v\u00e1rosi T\u00f6rv\u00e9nysz\u00e9k
  3.Kf.650.103/2013/5. sz\u00e1m\u00fa \u00edt\u00e9lete alapj\u00e1n t\u00f6bbv\u00e1ltozat\u00fa
  aj\u00e1nlatt\u00e9telnek tekinti azt, ha a szakmai aj\u00e1nlatban szerepl\u0151
  aj\u00e1nlati \u00e1r, illetve a felolv\u00e1solap k\u00f6z\u00f6tt elt\u00e9r\u00e9s
  mutatkozik.\\n\\n5) Aj\u00e1nlatk\u00e9r\u0151 t\u00e1j\u00e9koztatja az aj\u00e1nlattev\u0151ket,
  hogy a jelen k\u00f6zbeszerz\u00e9si dokumentumok kiad\u00e1s\u00e1val aj\u00e1nlatk\u00e9r\u0151nek
  nem c\u00e9lja a felh\u00edv\u00e1sban, a Kbt.-ben, valamint az egy\u00e9b jogszab\u00e1lyokban
  foglalt rendelkez\u00e9sek megism\u00e9tl\u00e9se. Erre tekintettel a jelen k\u00f6zbeszerz\u00e9si
  dokumentumok kiz\u00e1r\u00f3lag a felh\u00edv\u00e1ssal \u00e9s a vonatkoz\u00f3
  jogszab\u00e1lyokkal (els\u0151sorban a Kbt.-vel) \u00f6sszhangban \u00e9rtelmezend\u0151.\\n\\n6)
  Az Aj\u00e1nlatt\u00e9teli Felh\u00edv\u00e1sban \u00e9s a jelen k\u00f6zbeszerz\u00e9si
  dokumentumokban nem szab\u00e1lyozott k\u00e9rd\u00e9sekb\u00e9n a Kbt., a 424/2017.
  (XII. 19.) Korm. rendelet, a vonatkoz\u00f3 k\u00f6zbeszerz\u00e9si rendeletek,
  a Kbt. 2. \u00a7 (8) bekezd\u00e9se szerinti k\u00f6rben a Ptk. \u00e9s az egy\u00e9b
  vonatkoz\u00f3 jogszab\u00e1lyok az ir\u00e1nyad\u00f3ak.\\n\\n7) Aj\u00e1nlattev\u0151
  felel\u0151ss\u00e9ge, hogy az aj\u00e1nlat \u00e9rv\u00e9nyess\u00e9g\u00e9hez
  \u2013 k\u00fcl\u00f6n\u00f6sen a m\u0171szaki illetve szakmai alkalmass\u00e1g
  k\u00f6r\u00e9ben \u2013 sz\u00fcks\u00e9ges dokumentumokat \u00e9s igazol\u00e1sokat,
  az aj\u00e1nlat \u00e9rv\u00e9nyess\u00e9g\u00e9nek egy\u00e9rtelm\u0171 meg\u00e1llap\u00edt\u00e1s\u00e1hoz
  sz\u00fcks\u00e9ges tartalommal aj\u00e1nlatk\u00e9r\u0151 rendelkez\u00e9s\u00e9re
  bocs\u00e1ss\u00e1.\\n\\n8) A k\u00e9rt inform\u00e1ci\u00f3k beny\u00fajt\u00e1s\u00e1\u00e9rt
  az aj\u00e1nlattev\u0151 felel, nem kiel\u00e9g\u00edt\u0151 inform\u00e1ci\u00f3k
  k\u00f6vetkezm\u00e9nye az aj\u00e1nlat \u00e9rv\u00e9nytelenn\u00e9 min\u0151s\u00edt\u00e9se
  lehet.\\n\\n9) Az elj\u00e1r\u00e1s \u00e9s az aj\u00e1nlatt\u00e9tel nyelve magyar.
  Aj\u00e1nlatk\u00e9r\u0151 kiz\u00e1r\u00f3lag a magyar nyelv\u0171, vagy magyar
  nyelvre leford\u00edtott iratokat, dokumentumokat veszi figyelembe az aj\u00e1nlatok
  elb\u00edr\u00e1l\u00e1sa \u00e9s \u00e9rt\u00e9kel\u00e9se sor\u00e1n. Aj\u00e1nlatk\u00e9r\u0151
  a nem magyar nyelven beny\u00fajtott dokumentumok aj\u00e1nlattev\u0151 \u00e1ltali
  felel\u0151s ford\u00edt\u00e1s\u00e1t elfogadja, aj\u00e1nlattev\u0151 nem k\u00f6teles
  a 24/1986. (VI. 26.) MT rendelet szerinti \u2013 az Orsz\u00e1gos Ford\u00edt\u00f3
  \u00e9s Ford\u00edt\u00e1shiteles\u00edt\u0151 Iroda \u00e1ltal k\u00e9sz\u00edtett
  \u2013 hiteles ford\u00edt\u00e1s k\u00e9sz\u00edtettet\u00e9s\u00e9re. Az elj\u00e1r\u00e1s
  sor\u00e1n mindennem\u0171 k\u00f6zl\u00e9s magyar nyelven t\u00f6rt\u00e9nik, kommunik\u00e1ci\u00f3
  semmilyen m\u00e1s nyelven nem fogadhat\u00f3 el.\\n\\n10) T\u00e1j\u00e9koztatjuk
  az aj\u00e1nlattev\u0151ket, hogy amennyiben aj\u00e1nlatk\u00e9r\u0151 felsz\u00f3l\u00edt\u00e1sa
  ellen\u00e9re az aj\u00e1nlattev\u0151, az aj\u00e1nlatk\u00e9r\u0151 \u00e1ltal
  el\u0151\u00edrt hat\u00e1rid\u0151 lej\u00e1rt\u00e1ig, a Kbt. 71. \u00a7-a szerinti
  hi\u00e1nyp\u00f3tl\u00e1st/felvil\u00e1gos\u00edt\u00e1st, vagy a 72. \u00a7 szerinti
  indokol\u00e1st nem adja meg, \u00fagy az aj\u00e1nlat elb\u00edr\u00e1l\u00e1s\u00e1t
  az eredeti, beadott aj\u00e1nlat alapj\u00e1n v\u00e9gzi el. Az elj\u00e1r\u00e1si
  cselekm\u00e9nyek hat\u00e1rid\u0151ben t\u00f6rt\u00e9n\u0151 teljes\u00edt\u00e9s\u00e9vel
  kapcsolatban ir\u00e1nyad\u00f3ak az EKR rendelet 17.\u00a7-\u00e1ban foglaltak.\\n\\n11)
  A beny\u00fajtott aj\u00e1nlatokat az aj\u00e1nlatk\u00e9r\u0151 \u00fagy tekinti,
  hogy az aj\u00e1nlattev\u0151 megbizonyosodott a k\u00f6zbeszerz\u00e9si dokumentumokban
  megadott, illetve a szerz\u0151d\u00e9s-tervezetb\u0151l \u00e9sszer\u0171en k\u00f6vetkez\u0151
  feladatokra vonatkoz\u00f3 szerz\u0151d\u00e9ses \u00e1r helyess\u00e9g\u00e9r\u0151l
  \u00e9s el\u00e9gs\u00e9ges volt\u00e1r\u00f3l.\\n\\n12) A szerz\u0151d\u00e9s-tervezetet
  nem kell kit\u00f6lteni, sem az aj\u00e1nlathoz csatolni.\\n\\nIV. Kieg\u00e9sz\u00edt\u0151
  t\u00e1j\u00e9koztat\u00e1s\\n\\n1) B\u00e1rmely gazdas\u00e1gi szerepl\u0151 kieg\u00e9sz\u00edt\u0151
  t\u00e1j\u00e9koztat\u00e1st az elj\u00e1r\u00e1st megind\u00edt\u00f3 felh\u00edv\u00e1s
  egy\u00e9b inform\u00e1ci\u00f3k pontj\u00e1ban meghat\u00e1rozott hat\u00e1rid\u0151
  lej\u00e1rt\u00e1ig kiz\u00e1r\u00f3lag az EKR-en kereszt\u00fcl k\u00e9rhet. Aj\u00e1nlatk\u00e9r\u0151
  valamennyi \u00e9rdekl\u0151d\u0151 gazdas\u00e1gi szerepl\u0151 r\u00e9sz\u00e9re
  \u00edr\u00e1sban megk\u00fcldi a v\u00e1laszt az EKR rendszeren kereszt\u00fcl,
  illetve hozz\u00e1f\u00e9rhet\u0151v\u00e9 teszi az EKR rendszerben.\\n\\n2) K\u00e9rj\u00fck
  a gazdas\u00e1gi szerepl\u0151ket, hogy kiz\u00e1r\u00f3lag a Kbt. 56. \u00a7-\u00e1nak
  megfelel\u0151 tartalommal, a megfelel\u0151 aj\u00e1nlatt\u00e9tel \u00e9rdek\u00e9ben
  tegy\u00e9k fel k\u00e9rd\u00e9seiket. Aj\u00e1nlatk\u00e9r\u0151 felh\u00edvja
  a gazdas\u00e1gi szerepl\u0151k figyelm\u00e9t arra, hogy a Kbt. 56. \u00a7-a alapj\u00e1n
  az aj\u00e1nlatk\u00e9r\u0151nek nincsen felhatalmaz\u00e1sa a Kbt. egyes rendelkez\u00e9seivel
  kapcsolatosan \u00e9rtelmez\u0151 t\u00e1j\u00e9koztat\u00e1st adni. A Kbt., valamint
  a k\u00f6zbeszerz\u00e9sekkel \u00f6sszef\u00fcgg\u0151 egy\u00e9b jogszab\u00e1lyok
  \u00e9rtelmez\u00e9s\u00e9vel kapcsolatban els\u0151sorban az Igazs\u00e1g\u00fcgyi
  Miniszt\u00e9rium, valamint a K\u00f6zbeszerz\u00e9si Hat\u00f3s\u00e1g adhat felvil\u00e1gos\u00edt\u00e1st.\\n\\n3)
  A gazdas\u00e1gi szerepl\u0151 \u00e1ltal feltett k\u00e9rd\u00e9sek, \u00e9s az
  aj\u00e1nlatk\u00e9r\u0151 \u00e1ltal adott kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1sok
  a k\u00f6zbeszerz\u00e9si dokumentumok r\u00e9szeiv\u00e9 v\u00e1lnak. Az aj\u00e1nlattev\u0151
  felel\u0151ss\u00e9ge, hogy az Aj\u00e1nlatk\u00e9r\u0151 \u00e1ltal megk\u00fcldend\u0151
  b\u00e1rmely dokumentum id\u0151ben az EKR rendszerben regisztr\u00e1lt, megfelel\u0151
  jogos\u00edtv\u00e1nyokkal rendelkez\u0151 felhaszn\u00e1l\u00f3hoz ker\u00fclj\u00f6n.\\n\\n4)
  Felh\u00edvjuk a gazdas\u00e1gi szerepl\u0151k figyelm\u00e9t, hogy a Kbt. szab\u00e1lyoz\u00e1sa
  \u00e9rtelm\u00e9ben Aj\u00e1nlatk\u00e9r\u0151 alkalmazottai nem jogosultak az
  elj\u00e1r\u00e1ssal kapcsolatosan sz\u00f3ban (pl. szem\u00e9lyesen, vagy telefon
  \u00fatj\u00e1n) felvil\u00e1gos\u00edt\u00e1st adni, erre tekintettel az ilyen
  m\u00f3don \u00e9rkez\u0151 megkeres\u00e9sre a Aj\u00e1nlatk\u00e9r\u0151 a v\u00e1laszad\u00e1st
  megtagadja.\\n\\n5) A kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1s ir\u00e1nti
  k\u00e9relm\u00fcket a fentiekben meghat\u00e1rozottak mellett \u2013 a k\u00f6nnyebb
  feldolgozhat\u00f3s\u00e1g \u00e9rdek\u00e9ben \u2013 k\u00e9rj\u00fck szerkeszthet\u0151,
  \u201e*.doc\u201d form\u00e1tumban is megk\u00fcldeni, amennyiben nem az EKR erre
  fejlesztett sz\u00f6veges mez\u0151j\u00e9t haszn\u00e1lj\u00e1k.\\n\\n6) Aj\u00e1nlatk\u00e9r\u0151
  kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1sban k\u00f6zli, hogy a dokument\u00e1ci\u00f3
  valamely eleme semmis, ha a k\u00f6zbeszerz\u00e9si dokumentumokon bel\u00fcl ugyanaz
  az adat, inform\u00e1ci\u00f3 t\u00f6bb ponton elt\u00e9r\u0151en szerepel, vagy
  a felh\u00edv\u00e1st kieg\u00e9sz\u00edt\u0151 k\u00f6zbeszerz\u00e9si dokumentumok
  valamely eleme elt\u00e9r az elj\u00e1r\u00e1st megind\u00edt\u00f3 felh\u00edv\u00e1st\u00f3l,
  vagy e t\u00f6rv\u00e9nyt\u0151l. A k\u00f6zbeszerz\u00e9si dokumentumok semmisnek
  nyilv\u00e1n\u00edtott eleme, el\u0151\u00edr\u00e1sa a k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1sban \u00e9s a k\u00f6zbeszerz\u00e9si szerz\u0151d\u00e9sben nem
  alkalmazand\u00f3.\\n\\n7) Amennyiben a k\u00f6zbeszerz\u00e9si dokumentumok m\u00f3dosulnak,
  de ez az elj\u00e1r\u00e1st megind\u00edt\u00f3 hirdetm\u00e9nyt nem \u00e9rinti
  a m\u00f3dos\u00edtott k\u00f6zbeszerz\u00e9si dokumentumokat, aj\u00e1nlatk\u00e9r\u0151
  azt az EKR-benn teszi k\u00f6zz\u00e9. Amennyiben a k\u00f6zbeszerz\u00e9si dokumentumok
  m\u00f3dos\u00edt\u00e1sa jelent\u0151s, \u00fagy Aj\u00e1nlatk\u00e9r\u0151 k\u00f6teles
  a hat\u00e1rid\u0151t meghosszabb\u00edtani, amelyr\u0151l hirdetm\u00e9nyt is sz\u00fcks\u00e9ges
  feladnia, amellett, hogy Aj\u00e1nlatk\u00e9r\u0151 t\u00e1j\u00e9koztatja azokat
  a gazdas\u00e1gi szerepl\u0151ket, akik \u00e9rdekl\u0151d\u00e9s\u00fcket az elj\u00e1r\u00e1s
  ir\u00e1nt jelezt\u00e9k. Nem jelent\u0151s a k\u00f6zbeszerz\u00e9si dokumentumok
  m\u00f3dos\u00edt\u00e1sa, ha nem befoly\u00e1solja aj\u00e1nlatok id\u0151ben t\u00f6rt\u00e9n\u0151
  megfelel\u0151 el\u0151k\u00e9sz\u00edt\u00e9s\u00e9t.\\n\\nV. K\u00f6z\u00f6s aj\u00e1nlatt\u00e9tel\\n\\n1)
  K\u00f6z\u00f6s aj\u00e1nlatt\u00e9tel eset\u00e9n az aj\u00e1nlatt\u00e9telnek
  meg kell felelnie a Kbt. 35. \u00a7-\u00e1ban foglalt felt\u00e9teleknek, \u00edgy
  k\u00fcl\u00f6n\u00f6sen:\\n\\na) a k\u00f6z\u00f6s aj\u00e1nlattev\u0151k k\u00f6telesek
  maguk k\u00f6z\u00fcl egy, a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sban a k\u00f6z\u00f6s
  aj\u00e1nlattev\u0151k nev\u00e9ben elj\u00e1rni jogosult k\u00e9pvisel\u0151t megjel\u00f6lni;\\n\\nb)
  a k\u00f6z\u00f6s aj\u00e1nlattev\u0151k csoportj\u00e1nak k\u00e9pviselet\u00e9ben
  tett minden nyilatkozatnak egy\u00e9rtelm\u0171en tartalmaznia kell a k\u00f6z\u00f6s
  aj\u00e1nlattev\u0151k megjel\u00f6l\u00e9s\u00e9t;\\n\\nc) az egy k\u00f6z\u00f6s
  aj\u00e1nlatot beny\u00fajt\u00f3 gazdas\u00e1gi szerepl\u0151(k) szem\u00e9ly\u00e9ben
  az aj\u00e1nlatt\u00e9teli hat\u00e1rid\u0151 lej\u00e1rta ut\u00e1n v\u00e1ltoz\u00e1s
  nem k\u00f6vetkezhet be.\\n\\n2) Aj\u00e1nlatk\u00e9r\u0151 felh\u00edvja a k\u00f6z\u00f6s
  aj\u00e1nlattev\u0151k figyelm\u00e9t, hogy a Kbt. 41/C \u00a7 (1) bekezd\u00e9s
  e) pontja szerinti esetben kiz\u00e1r\u00f3lag a k\u00e9pvisel\u0151 aj\u00e1nlattev\u0151
  r\u00e9sz\u00e9re k\u00fcldi meg a Kbt. \u00e1ltal el\u0151\u00edrt \u00e9s egy\u00e9b
  \u00e9rtes\u00edt\u00e9seket, t\u00e1j\u00e9koztat\u00e1sokat, felh\u00edv\u00e1sokat.
  A k\u00f6z\u00f6s aj\u00e1nlattev\u0151k felel\u0151ss\u00e9ge, hogy az egym\u00e1s
  k\u00f6z\u00f6tti kommunik\u00e1ci\u00f3t megfelel\u0151en rendezz\u00e9k. A k\u00e9pvisel\u0151
  aj\u00e1nlattev\u0151 r\u00e9sz\u00e9re k\u00e9zbes\u00edtett dokumentumok, valamennyi
  k\u00f6z\u00f6s aj\u00e1nlattev\u0151 r\u00e9sz\u00e9re k\u00e9zbes\u00edtettek
  tekinthet\u0151k. A megfelel\u0151 k\u00e9zbes\u00edt\u00e9s \u00e9rdek\u00e9ben
  az aj\u00e1nlatban meg kell adni a k\u00e9pvisel\u0151 aj\u00e1nlattev\u0151 kapcsolattart\u00e1sra
  megjel\u00f6lt el\u00e9rhet\u0151s\u00e9geit.\\n\\n3) Felh\u00edvjuk a tisztelt
  k\u00f6z\u00f6s aj\u00e1nlattev\u0151k figyelm\u00e9t, hogy az egyes nyilatkozatok
  megt\u00e9tel\u00e9n\u00e9l k\u00fcl\u00f6n\u00f6s figyelmet ford\u00edtsanak arra,
  hogy a nyilatkozatok \u2013 amennyiben az sz\u00fcks\u00e9ges \u2013 valamennyi
  k\u00f6z\u00f6s aj\u00e1nlattev\u0151re kiterjedjenek. \u00dagy szint\u00e9n fokozott
  figyelemmel j\u00e1rjanak el a kiz\u00e1r\u00f3 okokra, az alkalmass\u00e1gi felt\u00e9telekre
  vonatkoz\u00f3 \u00e9s egy\u00e9b igazol\u00e1sok csatol\u00e1sakor.\\n\\n4) Az
  EKR-ben elektronikus \u00faton tett nyilatkozat tekintet\u00e9ben az aj\u00e1nlatk\u00e9r\u0151
  szervezet vagy - az aj\u00e1nlatot vagy r\u00e9szv\u00e9teli jelentkez\u00e9st a
  rendszerben beny\u00fajt\u00f3 gazdas\u00e1gi szerepl\u0151 eset\u00e9ben - a gazdas\u00e1gi
  szerepl\u0151 k\u00e9pvisel\u0151j\u00e9nek kell tekinteni azt a szem\u00e9lyt,
  aki az EKR-ben az aj\u00e1nlatk\u00e9r\u0151 szervezet vagy gazdas\u00e1gi szerepl\u0151
  r\u00e9sz\u00e9r\u0151l a nyilatkozatt\u00e9telhez sz\u00fcks\u00e9ges hozz\u00e1f\u00e9r\u00e9ssel
  \u00e9s jogosults\u00e1ggal rendelkezik. Az EKR-ben kit\u00f6lt\u00f6tt elektronikus
  \u00fcrlapot e v\u00e9lelem alapj\u00e1n az aj\u00e1nlatk\u00e9r\u0151 szervezet,
  illetve a gazdas\u00e1gi szerepl\u0151 eredeti nyilatkozat\u00e1nak kell tekinteni.\\n\\n5)
  Az EKR-ben elektronikus \u00fcrlap beny\u00fajt\u00e1s\u00e1val teend\u0151 nyilatkozatokat
  a k\u00f6z\u00f6s aj\u00e1nlattev\u0151k, valamint az alkalmass\u00e1g igazol\u00e1s\u00e1ban
  r\u00e9szt vev\u0151 m\u00e1s szervezetek k\u00e9pviselet\u00e9ben az aj\u00e1nlatot
  beny\u00fajt\u00f3 gazdas\u00e1gi szerepl\u0151 teszi meg. A m\u00e1s nev\u00e9ben
  tett nyilatkozatok megt\u00e9tel\u00e9re meghatalmazott gazdas\u00e1gi szerepl\u0151
  kiz\u00e1r\u00f3lag az\u00e9rt felel, hogy a meghatalmaz\u00e1snak \u00e9s a sz\u00e1m\u00e1ra
  rendelkez\u00e9sre bocs\u00e1tott nyilatkozatoknak, adatoknak az \u00e1ltala elektronikusan
  megtett nyilatkozatok megfelelnek, ez a szab\u00e1ly azonban nem \u00e9rinti a k\u00f6z\u00f6s
  aj\u00e1nlattev\u0151k Kbt. 35. \u00a7 (6) bekezd\u00e9se szerinti egyetemleges
  felel\u0151ss\u00e9g\u00e9t.\\n\\n6) K\u00f6z\u00f6s aj\u00e1nlatt\u00e9tel eset\u00e9n
  az aj\u00e1nlatban csatolni kell a Kbt. 35. \u00a7 (2) bekezd\u00e9se szerinti meghatalmaz\u00e1st
  tartalmaz\u00f3 okiratot. A meghatalmaz\u00e1snak ki kell terjednie arra, hogy a
  k\u00f6z\u00f6s aj\u00e1nlattev\u0151k k\u00e9pviselet\u00e9re jogosult gazdas\u00e1gi
  szerepl\u0151 adott elj\u00e1r\u00e1s tekintet\u00e9ben az EKR-ben elektronikus
  \u00faton teend\u0151 nyilatkozatok megt\u00e9telekor az egyes k\u00f6z\u00f6s aj\u00e1nlattev\u0151k
  k\u00e9pviselet\u00e9ben elj\u00e1rhat.\\n\\n7) Az alkalmass\u00e1g igazol\u00e1s\u00e1hoz
  ig\u00e9nybe vett, az aj\u00e1nlattev\u0151n k\u00edv\u00fcli m\u00e1s szervezet
  r\u00e9sz\u00e9r\u0151l a Kbt. 65. \u00a7 (7) bekezd\u00e9se szerint csatoland\u00f3,
  k\u00f6telezetts\u00e9gv\u00e1llal\u00e1st tartalmaz\u00f3 okiratnak tartalmaznia
  kell - a Kbt. 65. \u00a7 (8) bekezd\u00e9se szerinti szervezet r\u00e9sz\u00e9r\u0151l
  az aj\u00e1nlatban csatolni kell - az aj\u00e1nlattev\u0151 r\u00e9sz\u00e9re sz\u00f3l\u00f3
  meghatalmaz\u00e1st arra, hogy az EKR-ben elektronikus \u00faton teend\u0151 nyilatkozatok
  megt\u00e9telekor az adott szervezet k\u00e9pviselet\u00e9ben elj\u00e1rhat.\\n\\nVI.
  Iratbetekint\u00e9s \u00e9s el\u0151zetes vitarendez\u00e9s\\n\\n1) A 424/2017.
  (XII. 19.) Korm. rendelet 20.\u00a7 (1) bekezd\u00e9se \u00e9rtelm\u00e9ben a Kbt.
  szerinti iratbetekint\u00e9st az aj\u00e1nlatk\u00e9r\u0151 az EKR-ben tal\u00e1lhat\u00f3
  dokumentumok tekintet\u00e9ben a gazdas\u00e1gi szerepl\u0151 k\u00e9pvisel\u0151j\u00e9nek
  szem\u00e9lyes megjelen\u00e9se ut\u00e1n biztos\u00edtja, azonban az iratbetekint\u00e9si
  k\u00e9relmet az EKR-en kereszt\u00fcl kell beny\u00fajtani, \u00e9s az iratbetekint\u00e9si
  k\u00e9relemmel kapcsolatos \u00edr\u00e1sbeli kommunik\u00e1ci\u00f3t az EKR-en
  kereszt\u00fcl kell bonyol\u00edtani.\\n\\n2) A Kbt. 80. \u00a7 (3)-(4) bekezd\u00e9sei
  \u00e9relm\u00e9ben az el\u0151zetes vitarendez\u00e9si k\u00e9relem megk\u00fcld\u00e9se
  \u00e9s az el\u0151zetes vitarendez\u00e9s sor\u00e1n a kommunik\u00e1ci\u00f3 az
  EKR-ben t\u00f6rt\u00e9nik a Kbt. 80. \u00a7-a tov\u00e1bbi rendelkez\u00e9sei alapj\u00e1n.\\n\\nVII.
  Az aj\u00e1nlat m\u00f3dos\u00edt\u00e1sa, visszavon\u00e1sa\\n\\n1) Az aj\u00e1nlattev\u0151
  az aj\u00e1nlat\u00e1hoz az aj\u00e1nlatt\u00e9teli hat\u00e1rid\u0151 id\u0151pontj\u00e1t\u00f3l
  k\u00f6tve van. Az aj\u00e1nlati k\u00f6t\u00f6tts\u00e9g be\u00e1llt\u00e1t k\u00f6vet\u0151en
  visszavont aj\u00e1nlat polg\u00e1ri jogi ig\u00e9nyeket keletkeztethet azon t\u00fal,
  hogy az aj\u00e1nlati biztos\u00edt\u00e9k (amennyiben az elj\u00e1r\u00e1sban relev\u00e1ns)
  nem ker\u00fcl visszafizet\u00e9sre.\\n\\n2) Az aj\u00e1nlat aj\u00e1nlatt\u00e9teli
  hat\u00e1rid\u0151 lej\u00e1rt\u00e1 el\u0151tt m\u00f3dos\u00edt\u00e1sa tekintet\u00e9ben
  az Kbt. 55. \u00a7 (7) ir\u00e1nyad\u00f3.\\n\\nVIII. Kbt. 73. \u00a7 (5) bekezd\u00e9se
  szerinti t\u00e1j\u00e9koztat\u00e1s\\n\\n1) A Kbt. 73. \u00a7 (5) bekezd\u00e9se
  \u00e9rtelm\u00e9ben aj\u00e1nlatk\u00e9r\u0151 a k\u00f6zbeszerz\u00e9si dokumentumokban
  t\u00e1j\u00e9koztat\u00e1sk\u00e9nt k\u00f6zli azoknak a szervezeteknek a nev\u00e9t,
  amelyekt\u0151l az aj\u00e1nlattev\u0151 t\u00e1j\u00e9koztat\u00e1st kaphat a Kbt.
  73.\u00a7 (4) bekezd\u00e9s szerinti azon k\u00f6rnyezetv\u00e9delmi, szoci\u00e1lis
  \u00e9s munkak\u00f6gi k\u00f6vetelm\u00e9nyekr\u0151l, amelyeknek a teljes\u00edt\u00e9s
  sor\u00e1n meg kell felelni.\\n\\n2) A fenti el\u0151\u00edr\u00e1sra tekintettel
  Aj\u00e1nlatk\u00e9r\u0151 az al\u00e1bbiakban megadja azoknak a szervezeteknek
  (hat\u00f3s\u00e1goknak) a nev\u00e9t \u00e9s el\u00e9rhet\u0151s\u00e9g\u00e9t,
