  oldal\u00e9rt felel\u0151s tag\u00e1llam szerz\u0151i jogi szab\u00e1lyait a Jogi
  nyilatkozatban tekintheti meg.\\n\\nHU\"", "\"HIRDETM\u00c9NY\\n\\nEz\u00faton \u00e9rtes\u00edtem
  \u00d6n\u00f6ket, hogy Somogyaszal\u00f3 K\u00f6zs\u00e9gi \u00d6nkorm\u00e1nyzat
  K\u00e9pvisel\u0151-test\u00fclete\\n\\n2020. szeptember 11. napj\u00e1n (p\u00e9nteken)
  10.00 \u2013 18.30 \u00f3ra k\u00f6z\u00f6tt ki\u00e1rus\u00edt\u00e1st, kirakod\u00f3
  v\u00e1s\u00e1rt tart a t\u0171zolt\u00f3szert\u00e1r el\u0151tti ter\u00fcleten.\\n\\nMegv\u00e1s\u00e1rolhat\u00f3ak
  kedvezm\u00e9nyes \u00e1ron haszn\u00e1lt kisb\u00fatorok, mez\u0151gazdas\u00e1gi
  g\u00e9pek, m\u0171szaki cikkek stb, szinte minden, amire csak sz\u00fcks\u00e9g
  lehet.\\n\\nMinden kedves v\u00e1s\u00e1rl\u00f3t szeretettel v\u00e1runk.\\n\\nBar\u00e1ts\u00e1ggal:\\n\\nT\u00f6rzs\u00f6k
  Gabriella sk. polg\u00e1rmester\"", "\"Ki ne tapasztalta volna, hogy a legk\u00fcl\u00f6nb\u00f6z\u0151bb
  helyzetekben egyszer csak egy j\u00f3l ismert n\u00e9v nem jut az esz\u00e9be, \u00e9s
  ann\u00e1l makacsabban siklik ki tudat\u00e1b\u00f3l, min\u00e9l ink\u00e1bb t\u00f6ri
  rajta a fej\u00e9t. Mihelyt azonban a gondolatot \\\"elfelejtettem e nevet\\\" annak
  k\u00e9pzet\u00e9vel helyettes\u00edtj\u00fck, hogy, hamarosan       eszembe fog
  jutni\\\" \u00e9s nem er\u0151lk\u00f6d\u00fcnk \u00e9rte, eg\u00e9szen bizonyosan
  bek\u00f6vetkezik, a pillant melyben a n\u00e9v mag\u00e1t\u00f3l egyszer\u0171en
  csak el\u0151bukkan tudatunkban.\\n\\nVagy kinek nem volt m\u00e9g \u00e9let\u00e9ben
  nevet\u0151g\u00f6rcse?\\n\\nIlyenkor az ember ellen\u00e1llhatatlan hahot\u00e1ban
  t\u00f6r ki, mely ann\u00e1l nagyobb m\u00e9rt\u00e9kben vesz rajta er\u0151t, min\u00e9l
  ink\u00e1bb\\\"szeretn\u00e9\\\"elfojtani azt. Felvet\u0151dik a k\u00e9rd\u00e9s,
  milyen folyamatok \u00e9s er\u0151k zajlanak le benn\u00fcnk? Akarn\u00e1m, hogy
  a j\u00f3l ismert n\u00e9vre eml\u00e9kezzek s m\u00e9gsem tudok visszaeml\u00e9kezni,
  \u00e9n val\u00f3ban szeretn\u00e9m elfojtani illetlen nevet\u00e9semet, de nem
  tudom elfojtani azt. Az ilyen \u201ebels\u0151 konfliktusok\\\" eset\u00e9n \u201ek\u00e9pzel\u0151er\u0151nk\\\"
  kiv\u00e9tel n\u00e9lk\u00fcl mindenkor f\u00f6l\u00e9je kerekedik sz\u00e1nd\u00e9kunk
  ellen\u00e9re is- akaratunknak.\\n\\nErr\u0151l sz\u00f3l Emile Cou\u00e9 /1857-1926/
  francia gy\u00f3gyszer\u00e9sz \u00e9s pszichi\u00e1ter 114 oldalas k\u00f6nyve
  melynek c\u00edme: Eg\u00e9szs\u00e9g \u00e9s \u00f6nfegyelmez\u00e9s. R\u00f3la
  kapta a nev\u00e9t az \u00f6nmeggy\u0151z\u00e9sen az autoszuggeszti\u00f3n alapul\u00f3
  gy\u00f3gym\u00f3d a\\\"cou\u00e9izmus\\\"\\n\\nEbben a k\u00f6nyvben a laikusok
  sz\u00e1m\u00e1ra is k\u00f6z\u00e9rthet\u0151 m\u00f3don fejti ki, hogy benn\u00fcnk
  k\u00e9t k\u00fcl\u00f6nb\u00f6z\u0151 val\u00f3s\u00e1g m\u0171k\u00f6dik: a tudatos
  \u00e9s a tudattalan \u201e\u00c9n\\\". Mialatt \u201e\u00e9n\\\"\u00fcnk egyik
  r\u00e9sze tudatoss\u00e1 v\u00e1lik el\u0151tt\u00fcnk, a m\u00e1sik jelens\u00e9gei
  \u00e1ltal\u00e1ban tudatunk k\u00fcsz\u00f6be alatt maradnak. Cou\u00e9 azt mondja\\\"
  minden bajunk, b\u00e1tortalans\u00e1gunk, el\u00e9gedetlens\u00e9g\u00fcnk, s\u0151t
  minden betegs\u00e9g\u00fcnk igen nagy r\u00e9sze a tudatunk k\u00fcsz\u00f6be alatt
  elm\u00e9ly\u00fclt \u00e9s ism\u00e9tl\u00e9sek \u00e1ltal bel\u00e9nk v\u00e9s\u0151d\u00f6tt
  k\u00e1ros autoszuggeszti\u00f3k k\u00f6vetkezm\u00e9nye.\\n\\nFelteszi a k\u00e9rd\u00e9st:
  mi\u00e9rt nem lehetne ezeket elfojtani, illetve hely\u00fcket bet\u00f6lteni tudatosan
  megv\u00e1lasztott autoszuggeszti\u00f3kkal ? Mert az csak nem mondhat\u00f3 bonyolult
  elj\u00e1r\u00e1snak, hogy egy r\u00f6vid mondatot:\\\"Mindennap minden tekintetben
  jobban \u00e9s jobban \u00e9rzem magam\\\" reggel este egy zsinegre k\u00f6t\u00f6tt
  h\u00fasz csom\u00f3cska v\u00e9gigsz\u00e1ml\u00e1l\u00e1sa mellett, h\u00faszszor-h\u00faszszor
  elism\u00e9telj\u00fck. / A zsineg haszn\u00e1lata a gondolat \u00f6sszpontos\u00edt\u00e1s\u00e1t
  seg\u00edti/\\n\\nMiel\u0151tt b\u00e1rki is a kuruzsl\u00e1sra gondolna le kell
  sz\u00f6gezn\u00fcnk, hogy ez nem az. Ez a XIX. sz\u00e1zad, melyben a tudom\u00e1nyos
  hipnotizmus egyre jobban kezd t\u00e9rt h\u00f3d\u00edtani az orvosl\u00e1sban is
  . Napjainkban gyakran elhangzik a mondat \\\" Gondolkodjunk pozit\u00edvan!\\\"
  vagy \u201ek\u00f6nnyen alkalmazhat\u00f3 AGYI technik\u00e1kat k\u00edn\u00e1lunk
  \u00d6nnek, hogy jobban eg\u00e9szs\u00e9gesebben, boldogabban \u00e9s magabiztosabban
  \u00e9ljen\\\" L\u00e1thatjuk, hogy csak a formai elemek v\u00e1ltoznak, a lelki
  t\u00e9nyez\u0151k ugyan \u00fagy hatnak.\\n\\n\u201eSzinte lehetetlen e Cou\u00e9
  \u00e1ltal, szinte a v\u00e9gletekig leegyszer\u0171s\u00edtett, \u00e9vezredek
  hosszas tanuls\u00e1gainak pr\u00f3b\u00e1j\u00e1t is meg\u00e1ll\u00f3 \u201egy\u00f3gym\u00f3d\\\"
  megfogalmaz\u00e1s\u00e1n\u00e1l nem gondolnunk arra a t\u00f6rt\u00e9nelmi p\u00e9ld\u00e1ra,
  amikor a Krisztus sz\u00fclet\u00e9se el\u0151tti m\u00e1sodik \u00e9vsz\u00e1zadban
  \u00e9lt \u00f6reg Cato minden nap azzal fejezte be besz\u00e9d\u00e9t, hogy \u201eCeterum
  censeo, Carthaginem esse delendam!\\\" /Az a v\u00e9lem\u00e9nyem, hogy Karthag\u00f3t
  el kell puszt\u00edtani!/ T\u00f6bb mintegy 2 \u00e9vezred el\u0151tt eme naponta
  megism\u00e9telt puszta szavak \u00e9pp ugyanazon szuggeszti\u00f3s \u00e9s\u00a0
  autoszuggeszti\u00f3s \u00e9lettani\\n\\n1 / 2\\n\\nt\u00f6rv\u00e9nyek \u00fatj\u00e1n
  d\u00f6nt\u00f6tt\u00e9k meg a b\u00fcszke Karthag\u00f3 v\u00e1rb\u00e1sty\u00e1it
  s vele urainak nagy hatalm\u00e1t, mint ahogy ugyanazok a szuggeszti\u00f3s \u00e9s
  autoszuggeszti\u00f3s t\u00f6rv\u00e9nyek ugyanazokon a lelki-\u00e9lettani utakon
  eszk\u00f6zlik ma is az emberis\u00e9g \u00e9let\u00e9nek, a t\u00f6rt\u00e9nelemnek,
  valamint az egyes ember egy\u00e9ni \u00e9lete boldogul\u00e1s\u00e1nak, illetve
  szenved\u00e9seinek t\u00f6rt\u00e9net\u00e9t egyar\u00e1nt.\\\"\\n\\nVagy mint
  Le Blon h\u00edres munk\u00e1j\u00e1ban:\\\"A t\u00f6megek l\u00e9lektan\u00e1\\\"-ban
  egyebet sem mond, mint hogy az eg\u00e9sz t\u00e1rsadalomvezet\u00e9s, a politikai
  \u00e9let, a rekl\u00e1m stb. alapmozgat\u00f3 rug\u00f3ja az \u00e1ll\u00edt\u00e1s
  \u00e9s ism\u00e9tl\u00e9s\\\". Nem az a fontos a t\u00f6megek\u00a0 sz\u00e1m\u00e1ra,
  hogy mit mondunk, hanem hogy nyomat\u00e9kosan \u00e9s ism\u00e9telten mondjuk s
  akkor megy a legb\u00e1rgy\u00fabb\u00a0 jelszavak ut\u00e1n- ak\u00e1r a biztos
  hal\u00e1lba \u00e9s pusztul\u00e1sba is.\\n\\nEzeket a kiragadott szemelv\u00e9nyeket
  gondolat\u00e9breszt\u0151nek, kedvcsin\u00e1l\u00f3nak sz\u00e1ntam az olvas\u00e1shoz.\\n\\nA
  XXI. sz\u00e1zad\u00a0 \u00e9lettemp\u00f3ja t\u00falterheli az ember idegrendszer\u00e9t.
  Egy t\u00e1rgyilagosan m\u00e9rlegel\u0151 szakember el\u0151tt nyilv\u00e1nval\u00f3,
  hogy a technikai civiliz\u00e1ci\u00f3 nem oldotta meg \u00e9s sohasem oldhatja
  meg a l\u00e9lek probl\u00e9m\u00e1it \u00e9s nem p\u00f3tolhatja a l\u00e9lek kult\u00far\u00e1j\u00e1t
  sem.\\n\\nEpil\u00f3gus:\\n\\nA csom\u00f3kkal ell\u00e1tott zsineg egy seg\u00e9deszk\u00f6z,
  hasonl\u00f3 de nem t\u00e9vesztend\u0151 \u00f6ssze az indiai szent helyeken- az
  ashramok k\u00f6rny\u00e9k\u00e9n- a helyiek nyak\u00e1ban gyakran l\u00e1that\u00f3
  gy\u00f6ngyf\u00fcz\u00e9rrel a dzsapa - mal\u00e1val, melyre a k\u00f6z\u00e9pkori
  lovagok figyeltek fel a szent h\u00e1bor\u00fa sor\u00e1n. A m\u00f3dszer megtetszett
  nekik \u00e9s Eur\u00f3p\u00e1ban is meghonos\u00edtott\u00e1k: r\u00f3zsaf\u00fcz\u00e9r
  n\u00e9ven.\\n\\nAmennyiben siker\u00fclt e t\u00e9ma ir\u00e1nt felkeltenem \u00e9rdekl\u0151d\u00e9s\u00fcket,
