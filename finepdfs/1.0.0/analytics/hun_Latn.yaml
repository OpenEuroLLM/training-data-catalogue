  "\"V\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nAZ
  \u00c9P\u00cdT\u00c9SI MUNK\u00c1K TERVEZ\u00c9S\u00c9RE, BONYOL\u00cdT\u00c1S\u00c1RA
  VONATKOZ\u00d3 MUNKAV\u00c9DELMI, T\u0170ZV\u00c9DELMI, \u00c9S K\u00d6RNYEZETV\u00c9DELMI
  EL\u0150\u00cdR\u00c1SOK\\n\\n\u00c9p\u00edt\u00e9si \u00e9s telep\u00edt\u00e9si
  munk\u00e1k, Alv\u00e1llalkoz\u00f3i szerz\u0151d\u00e9s ABB Energia rendszerek\\n\\nA
  szerz\u0151d\u00e9sben felsorolt munkav\u00e9delmi k\u00f6vetelm\u00e9nyek az \u00e9p\u00edt\u00e9si
  munk\u00e1k elv\u00e9gz\u00e9s\u00e9hez szerz\u0151d\u00f6tt v\u00e1llalkoz\u00f3ra
  vonatkoz\u00f3 minim\u00e1lis elv\u00e1r\u00e1sokat jelentik. A Megb\u00edz\u00f3
  k\u00f6vetelm\u00e9nyei, a v\u00e1llalkoz\u00f3 saj\u00e1t szab\u00e1lyzata, a helyi
  el\u0151\u00edr\u00e1sok \u00e9s t\u00f6rv\u00e9nyek kik\u00f6thetnek enn\u00e9l
  szigor\u00fabb vagy kieg\u00e9sz\u00edt\u0151 k\u00f6vetelm\u00e9nyeket, minden
  esetben a szigor\u00fabb k\u00f6vetelm\u00e9nyeket kell alkalmazni.\\n\\nEzek az
  el\u0151\u00edr\u00e1sok az ABB \u00e9s a V\u00e1llalkoz\u00f3 k\u00f6z\u00f6tt
  l\u00e9trej\u00f6tt szerz\u0151d\u00e9s elv\u00e1laszthatatlan r\u00e9sz\u00e9t
  k\u00e9pezik.\\n\\nA V\u00e1llalkoz\u00f3 k\u00f6teles biztos\u00edtani, hogy az
  alkalmazottai \u00e9s az \u00e9p\u00edt\u00e9si munk\u00e1kban \u00e1ltala bevont
  (pl. alv\u00e1llalkoz\u00f3k), tov\u00e1bb\u00e1 egy\u00e9b \u00e9rintett szem\u00e9lyek
  (pl. l\u00e1togat\u00f3k) bevezetik \u00e9s k\u00f6vetik a Munkav\u00e9delmi \u00e9s
  K\u00f6rnyezetv\u00e9delmi el\u0151\u00edr\u00e1sokat.\\n\\nTartalomjegyz\u00e9k\\n\\n3VAA100104   v2.  2008.
  okt\u00f3ber 25\\n\\nV\u00e1llalkoz\u00f3:\\n\\nMunkav\u00e9delmi mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s
  d\u00e1tuma:\\n\\n\u00c9p\u00edt\u00e9si L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nSZERZ\u0150D\u00c9SES
  FELT\u00c9TELEK\\n\\nEzen mell\u00e9kletben meghat\u00e1rozott k\u00f6vetelm\u00e9nyek
  az ABB \u00e9s a v\u00e1llalkoz\u00f3 k\u00f6z\u00f6tt l\u00e9trej\u00f6tt szerz\u0151d\u00e9s
  elv\u00e1laszthatatlan r\u00e9sz\u00e9t k\u00e9pezik.  Minden v\u00e1llalkoz\u00f3ra
  vonatkoznak a szerz\u0151d\u00e9s teljes id\u0151tartama alatt, ez biztos\u00edtja,
  hogy a munka az ABB, annak megb\u00edz\u00f3ja vagy b\u00e1rmely m\u00e1s a munk\u00e1ban
  \u00e9rintett szem\u00e9ly kock\u00e1ztat\u00e1sa n\u00e9lk\u00fcl k\u00e9sz\u00fclj\u00f6n
  el.\\n\\nA1. \u00c1ltal\u00e1nos k\u00f6vetelm\u00e9nyek\\n\\nA V\u00e1llalkoz\u00f3
  felel\u0151s ezen munkav\u00e9delmi k\u00f6vetelm\u00e9nyek betart\u00e1s\u00e1\u00e9rt
  \u00e9s a saj\u00e1t terveiben tov\u00e1bb r\u00e9szletezi ezek tartalm\u00e1t,
  \u00e9s tov\u00e1bb\u00e1 felel\u0151s az ABB \u00c9p\u00edtkez\u00e9si munkav\u00e9delmi
  terv\u00e9ben foglaltak betart\u00e1s\u00e1\u00e9rt. A V\u00e1llalkoz\u00f3:\\n\\n(a)
  Biztos\u00edtja, hogy az aj\u00e1nlat az ezen mell\u00e9kletben meghat\u00e1rozott
  k\u00f6vetelm\u00e9nyeknek megfelel.\\n(b) El\u0151k\u00e9sz\u00edt \u00e9s bevezet
  egy Biztons\u00e1gi- \u00e9s Eg\u00e9szs\u00e9gv\u00e9delmi Tervet amely k\u00f6veti
  az ABB el\u0151\u00edr\u00e1sait. Ahhoz, hogy a helysz\u00ednen a v\u00e1llalkoz\u00f3
  megkezdhesse a munk\u00e1t, legk\u00e9s\u0151bb 21 nappal a tervezett kezd\u00e9si
  id\u0151pont el\u0151tt be kell ny\u00fajtania az \u00e9rintett ABB-nek egy ABB
  \u00e1ltal elfogadott helysz\u00edni munkav\u00e9delmi tervet.\\n(c) Elv\u00e9gzi
  a projekthez tartoz\u00f3 \u00f6sszes tev\u00e9kenys\u00e9g kock\u00e1zatelemz\u00e9s\u00e9t
  \u00e9s ezek biztons\u00e1gos megval\u00f3s\u00edt\u00e1si m\u00f3dszer\u00e9r\u0151l
  nyilatkozatot tesz.  A m\u00f3dszertani\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nABB
  referencia sz\u00e1m:\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nnyilatkozatokat
  legk\u00e9s\u0151bb 7 nappal a munka tervezett kezd\u00e9si d\u00e1tuma el\u0151tt
  be kell ny\u00fajtani az ABB k\u00e9pvisel\u0151j\u00e9nek j\u00f3v\u00e1hagy\u00e1s
  v\u00e9gett.\\n\\n(d) Felkutatja a helysz\u00ednen v\u00e9gzett tev\u00e9kenys\u00e9gekkel
  kapcsolatos \u00f6sszes lehets\u00e9ges munkav\u00e9delemi \u00e9s k\u00f6rnyezetv\u00e9delemi
  v\u00e9szhelyzetet \u00e9s ezekre a helyzetekre v\u00e9szhelyzeti cselekv\u00e9si
  terveket k\u00e9sz\u00edt.\\n(e) Biztos\u00edtja, hogy az \u00e1ltala felfogadott
  \u00f6sszes alv\u00e1llalkoz\u00f3 helysz\u00ednen dolgoz\u00f3 alkalmazottja t\u00e1j\u00e9koztatva/\u00e9rtes\u00edtve
  lett a munkav\u00e9delmi \u00e9s k\u00f6rnyezetv\u00e9delmi k\u00f6vetelm\u00e9nyekr\u0151l,
  \u00e9s megfelel\u0151 k\u00e9pz\u00e9ssel rendelkeznek a v\u00e9gzett munkafolyamatokkal
  kapcsolatos munkav\u00e9delmi- t\u0171zv\u00e9delmi- \u00e9s k\u00f6rnyezetv\u00e9delmi
  vesz\u00e9lyek elh\u00e1r\u00edt\u00e1s\u00e1hoz.\\n(f) Biztos\u00edtja, hogy a
  saj\u00e1t \u00e9s a felfogadott alv\u00e1llalkoz\u00f3k \u00f6sszes helysz\u00ednen
  dolgoz\u00f3 alkalmazottja betartja az ezen Mell\u00e9kletben meghat\u00e1rozott
  el\u0151\u00edr\u00e1sokat.\\n(g) Biztos\u00edtja, hogy a saj\u00e1t \u00e9s a felfogadott
  alv\u00e1llalkoz\u00f3k \u00f6sszes helysz\u00ednen dolgoz\u00f3 alkalmazottja rendelkezik
  megfelel\u0151 k\u00e9pz\u00e9ssel, \u00e9s tud\u00e1ssal az elektromos vesz\u00e9lyekkel
  kapcsolatban \u00e9s a fesz\u00fclts\u00e9g alatt \u00e9s/vagy  a fesz\u00fclts\u00e9g
  k\u00f6zel\u00e9ben v\u00e9gzett munkav\u00e9gz\u00e9s sor\u00e1n megk\u00f6vetelt
  viselked\u00e9ssel kapcsolatban.\\n(h) Biztos\u00edtja, hogy a saj\u00e1t maga \u00e9s
  a felfogadott alv\u00e1llalkoz\u00f3k \u00e1ltal alkalmazott \u00f6sszes szem\u00e9ly
  szem\u00e9lyazonos\u00edt\u00f3 sz\u00e1ma/neve megtal\u00e1lhat\u00f3 a V\u00e1llalkoz\u00f3
  \u00e9p\u00edt\u00e9svezet\u0151j\u00e9n\u00e9l.\\n(i) Biztos\u00edtja, hogy saj\u00e1t
  maga \u00e9s alv\u00e1llalkoz\u00f3i is hozz\u00e1\u00e9rt\u0151 \u00e9s k\u00e9pzett
  munkaer\u0151t alkalmaznak.\\n(j) Biztos\u00edtja, hogy amennyiben kiv\u00e1lasztj\u00e1k
  v\u00e1llalkoz\u00f3nak, v\u00e9grehajtja a tev\u00e9kenys\u00e9gek \u00f6sszehangol\u00e1s\u00e1t
  a projekt hat\u00e9kony megval\u00f3s\u00edt\u00e1sa \u00e9rdek\u00e9ben.\\n(k)
  Biztos\u00edtja, hogy csak jogosult szem\u00e9lyek l\u00e9phetnek be a helysz\u00ednre
  \u00e9s \u0151k biztons\u00e1gi (munka-, t\u0171z-, k\u00f6rnyezetv\u00e9delmi)
  oktat\u00e1son vesznek r\u00e9szt, amely tartalmazza az \u00e9p\u00edtkez\u00e9s
  munkav\u00e9delmi terv\u00e9nek el\u0151\u00edr\u00e1sait \u00e9s ezt az utas\u00edt\u00e1st.\\n(l)
  A helysz\u00ednen szigor\u00faan rendet tart \u00e9s meg\u0151rzi annak tisztas\u00e1g\u00e1t.\\n(m)
  Kinevez egy munkav\u00e9delmi koordin\u00e1tort, aki a helysz\u00ednen v\u00e9gzett
  munk\u00e1kat \u00f6sszehangolja \u00e9s fel\u00fcgyeli, a munkav\u00e9delmi \u00e9s
  k\u00f6rnyezetv\u00e9delmi k\u00f6vetelm\u00e9nyeknek megfelel\u0151en. Kisebb projektekn\u00e9l,
  kevesebb, mint 10 f\u0151, ezek a felel\u0151ss\u00e9gek be\u00e9p\u00edthet\u0151ek
  a v\u00e1llalkoz\u00f3 \u00e9p\u00edt\u00e9svezet\u0151j\u00e9nek feladatai k\u00f6z\u00e9
  a t\u00f6rv\u00e9nyben meghat\u00e1rozott m\u00e9rt\u00e9kben (pl. koordin\u00e1ci\u00f3
  tov\u00e1bbra is a f\u0151v\u00e1llalkoz\u00f3 feladata).\\n\\nLegyen a v\u00e1llalt
  tev\u00e9kenys\u00e9gre is vonatkoz\u00f3 \u00e9rv\u00e9nyes v\u00e1llalkoz\u00f3i
  felel\u0151s\u00e9g biztos\u00edt\u00e1sa.\\n\\nA2. Munkav\u00e9delmi/K\u00f6rnyezetv\u00e9delmi
  ellen\u0151rz\u00e9s\\n\\nMinden \u00e9p\u00fcletben, \u00fczemben \u00e9s munkater\u00fcleten
  rendszeresen, megfelel\u0151 id\u0151k\u00f6z\u00f6nk\u00e9nt el kell v\u00e9gezni
  a bels\u0151 (nem hat\u00f3s\u00e1gi) munkav\u00e9delmi/k\u00f6rnyezetv\u00e9delmi,
  t\u0171zv\u00e9delmi ellen\u0151rz\u00e9st. Az ellen\u0151rz\u00e9st, a melyet a
  munkav\u00e9delmi/k\u00f6rnyezetv\u00e9delmi megb\u00edzott \u00e9s a munkav\u00e9gz\u00e9s\u00e9rt
  felel\u0151s szem\u00e9lyek v\u00e9gzik, dokument\u00e1lni kell; az \u00e9szrev\u00e9teleket,
  hi\u00e1nyoss\u00e1gokat, a sz\u00fcks\u00e9ges int\u00e9zked\u00e9seket dokument\u00e1lni
  kell. A hi\u00e1nyoss\u00e1gok megsz\u00fcntet\u00e9s\u00e9re int\u00e9zked\u00e9si
  tervet kell k\u00e9sz\u00edteni a felel\u0151s\u00f6k, priorit\u00e1sok, hat\u00e1rid\u0151k
  megjel\u00f6l\u00e9s\u00e9vel. A meghat\u00e1rozott feladatok, v\u00e9grehajt\u00e1s\u00e1t
  rendszeresen vissza kell ellen\u0151rizni.\\n\\nA3. Munkav\u00e9delmi megbesz\u00e9l\u00e9sek\\n\\nA
  v\u00e1llalkoz\u00f3 \u00e9p\u00edt\u00e9svezet\u0151je, a munkav\u00e9delmi/k\u00f6rnyezetv\u00e9delmi
  koordin\u00e1tor \u00e9s az ABB k\u00e9pvisel\u0151je vesz r\u00e9szt a munkav\u00e9delmi
  megbesz\u00e9l\u00e9seken. Minden megbesz\u00e9l\u00e9st dokument\u00e1lni kell
  \u00e9s a gy\u0171l\u00e9sen k\u00e9sz\u00fclt jegyz\u0151k\u00f6nyvb\u0151l egy
  m\u00e1solatot kell elhelyezni a\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nprojekt
  munkav\u00e9delmi iratai k\u00f6z\u00f6tt.  A megbesz\u00e9l\u00e9st legal\u00e1bb
  hetente meg kell tartani, de gyakrabban, ha jelent\u0151s kock\u00e1zat \u00e1ll
  fenn, vagy v\u00e1ltoz\u00e1sok k\u00f6vetkeztek be.\\n\\nAz al\u00e1bbi t\u00e9teleknek
  mindig szerepelnie kell a napirenden:\\n\\n(a) A helysz\u00ednen v\u00e9gzett tev\u00e9kenys\u00e9gek
  \u00e9s ezek \u00f6sszehangol\u00e1sa (t\u00e9rben \u00e9s id\u0151ben)\\n(b) Munkav\u00e9delmi
  kock\u00e1zatok \u00e9s megel\u0151z\u0151 int\u00e9zked\u00e9sek a jelenlegi \u00e9s
  j\u00f6v\u0151beni feladatokkal kapcsolatban\\n(c) Ellen\u0151rz\u00e9si m\u00f3dszerek/m\u00f3dszertani
  nyilatkozatok a kock\u00e1zatok cs\u00f6kkent\u00e9s\u00e9re \u00e9s ezek k\u00f6zl\u00e9se
  a dolgoz\u00f3kkal, KPI mutat\u00f3k meghat\u00e1roz\u00e1sa \u00e9s \u00e9rt\u00e9kel\u00e9se\\n(e)
  A munkav\u00e9delmi/k\u00f6rnyezetv\u00e9delmi ellen\u0151rz\u00e9s sor\u00e1n megfigyelt
  biztons\u00e1gos/nem biztons\u00e1gos k\u00f6r\u00fclm\u00e9nyek\\n(f) V\u00e1ratlan
  esem\u00e9nyek, balesetek, k\u00f6rnyezeti k\u00e1rok\\n(g) A hat\u00f3s\u00e1gok
  \u00e1ltal v\u00e9gzett ellen\u0151rz\u00e9sek\\n\\nA v\u00e1llalkoz\u00f3 \u00e9p\u00edt\u00e9svezet\u0151j\u00e9nek
  r\u00e9szt kell vennie az ABB napi munkakezd\u00e9s el\u0151tti megbesz\u00e9l\u00e9sein,
  a napi tev\u00e9kenys\u00e9gek/tervek, munkaenged\u00e9lyek, t\u0171zgy\u00fajt\u00e1si
  enged\u00e9lyek \u00e1tn\u00e9z\u00e9s\u00e9hez, \u00e9s a folyamatos koordin\u00e1ci\u00f3
  biztos\u00edt\u00e1s\u00e1hoz.\\n\\nA4. V\u00e1ratlan esem\u00e9nyek \u00e9s ledolgozott
  munka\u00f3r\u00e1k jelent\u00e9se\\n\\nMinden v\u00e1ratlan esem\u00e9nyt \u00e9s
  a ledolgozott munka\u00f3r\u00e1k sz\u00e1m\u00e1t jelenteni kell az ABB k\u00e9pvisel\u0151j\u00e9nek,
  az 1. \u00e9s 2. Mell\u00e9kletben meghat\u00e1rozott m\u00f3don.  A baleseti jelent\u00e9s/
  jegyz\u0151k\u00f6nyvnek legal\u00e1bb az al\u00e1bbiakat adatokat tartalmaznia
  kell:\\n\\n(i) Projekt \u00e9s helysz\u00edn,\\n(ii) D\u00e1tum \u00e9s id\u0151,\\n(iii)
  Baleset t\u00edpusa \u00e9s le\u00edr\u00e1sa, k\u00f6r\u00fclm\u00e9nyek dokument\u00e1l\u00e1sa,
  a baleset els\u0151dleges oka, els\u0151seg\u00e9lyny\u00fajt\u00e1ssal kapcsolatos
  int\u00e9zked\u00e9sek stb.\\n(iv) Alapvet\u0151 ok \u00e9s a v\u00e9grehajtott
  helyre\u00e1ll\u00edt\u00f3 int\u00e9zked\u00e9sek,\\n(v) A helyre\u00e1ll\u00edt\u00f3
  int\u00e9zked\u00e9sek\u00e9rt felel\u0151s szem\u00e9ly,\\n(vi) A baleset becs\u00fclt
  k\u00f6lts\u00e9ge,\\n(vii) Al\u00e1\u00edrt jelent\u00e9s, amennyiben lehets\u00e9ges
  f\u00e9nyk\u00e9pekkel.\\n\\nA5. V\u00e9szhelyzet eset\u00e9n \u00e9rtes\u00edtend\u0151
  szem\u00e9lyek/hat\u00f3s\u00e1gok\\n\\nA v\u00e1llalkoz\u00f3 a munkater\u00fcleten
  inform\u00e1ci\u00f3s t\u00e1bl\u00e1kat helyez el, melyeket az ABB j\u00f3v\u00e1hagyott,
  ezek tartalmazz\u00e1k a v\u00e9szhelyzet eset\u00e9n \u00e9rtes\u00edtend\u0151
  szem\u00e9lyeket/hat\u00f3s\u00e1gokat, bele\u00e9rtve:\\n\\n(i) A helysz\u00ednen
  l\u00e9v\u0151 els\u0151seg\u00e9ly/\u00fajra\u00e9leszt\u00e9si k\u00e9pz\u00e9ssel
  rendelkez\u0151 szem\u00e9lyek neve\\n(ii) Ment\u0151k\\n(iii) K\u00f3rh\u00e1z
  vagy rendel\u0151int\u00e9zet\\n(iv) Rend\u0151rs\u00e9g\\n(v) T\u0171zolt\u00f3s\u00e1g\\n(vi)
  Munkav\u00e9delmi/K\u00f6rnyezetv\u00e9delmi megb\u00edzott\\n(vii) V\u00e1llalkoz\u00f3
  k\u00e9pvisel\u0151je\\n(viii) ABB k\u00e9pvisel\u0151je\\n\\nA seg\u00e9lyh\u00edv\u00e1sokhoz
  telefont vagy r\u00e1di\u00f3 felszerel\u00e9st kell biztos\u00edtani.\\n\\nAmennyiben
  a v\u00e9szhelyzeti ell\u00e1t\u00e1sra sokat kell v\u00e1rni vagy nagyon t\u00e1volr\u00f3l
  \u00e9rkezik, akkor a v\u00e9szhelyzeti sz\u00e1ll\u00edt\u00e1shoz a helysz\u00ednen
  kell tartani egy megfelel\u0151 j\u00e1rm\u0171vet, a munkav\u00e9gz\u00e9s teljes
  ideje alatt.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nA6.
  Biztons\u00e1g \u00e9s K\u00f6rnyezetv\u00e9delem\\n\\n(i) Biztons\u00e1g: a helysz\u00edn
  k\u00f6r\u00e9 biztons\u00e1gi ker\u00edt\u00e9st/vagy elhat\u00e1rol\u00e1st kell
  \u00e9p\u00edteni, az illet\u00e9ktelen szem\u00e9lyek bejut\u00e1s\u00e1nak megakad\u00e1lyoz\u00e1s\u00e1ra.
  A szem\u00e9lyzetre vagy felszerel\u00e9sekre val\u00f3sz\u00edn\u0171leg vesz\u00e9lyt
  jelent\u0151 ter\u00fcleteket egy\u00e9rtelm\u0171en figyelmeztet\u0151 t\u00e1bl\u00e1kkal
  jel\u00f6lni kell \u00e9s korl\u00e1ttal, ker\u00edt\u00e9ssel le kell hat\u00e1rolni
  vagy , vesz\u00e9lyfigyel\u0151 szem\u00e9lyeket kell folyamatosan biztos\u00edtani.\\n(ii)
  Hullad\u00e9kkezel\u00e9s: A ter\u00fcleten keletkez\u0151 hullad\u00e9kokat megfelel\u0151
  t\u00e1rol\u00f3ed\u00e9nyekben szelekt\u00edven kell gy\u0171jteni, megfelel\u0151
  t\u00e1rol\u00f3ed\u00e9nyekben \u00e9s enged\u00e9llyel, rendelkez\u0151 v\u00e1llalkoz\u00f3val
  el kell sz\u00e1ll\u00edttatni, \u00e1rtalmatlan\u00edt\u00e1s\u00e1r\u00f3l a bizonylatokat
  meg kell \u0151rizni. A vesz\u00e9lyes hullad\u00e9kokat, \u00fagymint: ken\u0151anyagok,
  ki\u00f6ml\u00f6tt olaj, akkumul\u00e1torok, fest\u00e9k, azbeszt, stb., speci\u00e1lis
  t\u00e1rol\u00f3kban kell tartani.  Be kell vezetni egy \u00fajrahasznos\u00edt\u00e1si
  programot, hogy az \u00f6sszes \u00fajrahasznos\u00edthat\u00f3 anyag beker\u00fclj\u00f6n
  az \u00fajrahasznos\u00edt\u00e1si folyamatba. Tilos b\u00e1rmelyik anyag el\u00e9get\u00e9se!\\n\\nA7.
  Drog \u00e9s Alkohol\\n\\nBirtokolni, fogyasztani, a munkater\u00fcletre bevinni,
  vagy k\u00e1b\u00edt\u00f3szer illetve alkohol hat\u00e1sa alatt lenni szigor\u00faan
  tilos! Amennyiben erre f\u00e9ny der\u00fcl, az \u00e9rintett szem\u00e9lyt azonnal
  el kell t\u00e1vol\u00edtani a ter\u00fcletr\u0151l, \u00e9s a felel\u0151ss\u00e9gre
  von\u00e1s\u00e1r\u00f3l gondoskodni kell.\\n\\nGy\u00f3gyszerek szed\u00e9se eset\u00e9n
  az orvos v\u00e9lem\u00e9ny\u00e9t ki kell k\u00e9rni a munkak\u00f6rnyezet/folyamat
  kock\u00e1zataival kapcsolatban \u00e9s utas\u00edt\u00e1sait szigor\u00faan be
  kell tartani.\\n\\nB. El\u0151\u00edr\u00e1sok megszeg\u00e9se\\n\\nAz ABB k\u00e9pvisel\u0151je/az
  \u00e9p\u00edt\u00e9svezet\u0151 jogosult:\\n\\n(a) kiz\u00e1rni b\u00e1rmely szem\u00e9lyt
  a helysz\u00ednr\u0151l, megfelel\u0151 figyelmeztet\u00e9s ut\u00e1n, amennyiben
  az a szem\u00e9ly nem k\u00f6veti ezen Mell\u00e9klet el\u0151\u00edr\u00e1sait,
  \u00e9s/vagy vesz\u00e9lyesen v\u00e9gzi a munk\u00e1t. A kiz\u00e1r\u00e1s\u00e9rt
  az ABB semmilyen k\u00e1rt\u00e9r\u00edt\u00e9si k\u00f6telezetts\u00e9get nem v\u00e1llal.\\n(b)
  b\u00e1rmikor meg\u00e1ll\u00edtani a munk\u00e1t, ha \u00fagy v\u00e9li, hogy a
  v\u00e1llalkoz\u00f3 nem biztons\u00e1gosan dolgozik, jelent\u0151s vesz\u00e9ly
  \u00e1ll fenn a munk\u00e1val \u00e9rintett szem\u00e9lyekre vagy a k\u00f6rnyezetre
  n\u00e9zve, vagy ha a v\u00e1llalkoz\u00f3 k\u00f6zvetlen\u00fcl megs\u00e9rti az
  ezen utas\u00edt\u00e1sban megadott el\u0151\u00edr\u00e1sokat.  Ilyen esetekben
  a v\u00e1llalkoz\u00f3 visel minden k\u00f6lts\u00e9get, ami a munka esetlegesen
  hat\u00e1rid\u0151n t\u00fali befejez\u00e9s\u00e9b\u0151l ered.\\n\\nC. Helysz\u00edni
  munkav\u00e9delmi szab\u00e1lyoz\u00e1s\\n\\nA V\u00e1llalkoz\u00f3nak be kell tartania
  ezeket a szab\u00e1lyokat \u00e9s gondoskodnia kell arr\u00f3l, hogy az alv\u00e1llalkoz\u00f3i
  rendelkezzenek a szak\u00e9rtelemmel \u00e9s er\u0151forr\u00e1sokkal, hogy legal\u00e1bb
  ezek el\u0151\u00edr\u00e1sait betarts\u00e1k.\\n\\nA jelen Mell\u00e9kletben nem
  t\u00e1rgyalt tev\u00e9kenys\u00e9gekkel \u00e9s m\u0171veletekkel kapcsolatban,
  \u00e9s a k\u00f6vetelm\u00e9nyekkel kapcsolatos tov\u00e1bbi inform\u00e1ci\u00f3k
  tekintet\u00e9ben a k\u00f6vetkez\u0151 dokumentumok felelnek meg a minim\u00e1lis
  szintnek.\\n\\nILO Safety and health in construction (Munkav\u00e9delem az \u00e9p\u00edtkez\u00e9sekn\u00e9l),
  ISBN 92-2-107104-9\\n\\nVillamos berendez\u00e9sek \u00fczemeltet\u00e9se EN 50110-1\\n\\nNemzetk\u00f6zi
  Elektrotechnikai Bizotts\u00e1g (IEC) 61482\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nC1.
  Terv\u00fctemez\u00e9s\\n\\nA v\u00e1llalkoz\u00f3nak rendelkeznie kell egy el\u0151\u00edr\u00e1soknak
  megfelel\u0151 munkav\u00e9delmi szervezettel, amely biztos\u00edtja a jelen Mell\u00e9klet
  k\u00f6vetelm\u00e9nyeinek megfelel\u0151 projekt munkav\u00e9delmi tervek elk\u00e9sz\u00edt\u00e9s\u00e9t,
  \u00e9s azok k\u00e9s\u0151bbi megval\u00f3s\u00edt\u00e1s\u00e1t.\\n\\nC2. Helysz\u00edni
  megval\u00f3s\u00edt\u00e1s\\n\\nA helysz\u00edni megval\u00f3s\u00edt\u00e1s megtervez\u00e9s\u00e9n\u00e9l
  figyelembe kell venni a jelen Mell\u00e9klet el\u0151\u00edr\u00e1sait.\\n\\nC3.
  Hozz\u00e1f\u00e9r\u00e9sek\\n\\n1. A l\u00e9tr\u00e1n val\u00f3 munkav\u00e9gz\u00e9s
  kiz\u00e1r\u00f3lag 2.0 m magass\u00e1gig megengedett.  2.0 m magass\u00e1g felett
  megfelel\u0151 hozz\u00e1f\u00e9r\u00e9si felszerel\u00e9st kell haszn\u00e1lni,
  pl. mobil emelhet\u0151 munkapadozat, r\u00f6gz\u00edtett munkapadozat \u00e9s gondoskodni
  kell a lees\u00e9s elleni v\u00e9delemr\u0151l/ pl. testheveder/.\\n2. Minden l\u00e9tr\u00e1nak
  szerkezetileg kifog\u00e1stalannak \u00e9s megfelel\u0151en er\u0151snek kell lennie.\\n3.
  Minden l\u00e9tr\u00e1t rendszeresen, de legal\u00e1bb f\u00e9l\u00e9vente ellen\u0151riztetni
  kell egy szak\u00e9rt\u0151vel, \u00e9s nyilv\u00e1ntart\u00e1st kell vezetni.\\n4.
  Nem gy\u00e1ri kivitel\u0171/bizonylattal nem rendelkez\u0151l\u00e9tr\u00e1k haszn\u00e1lata
  tilos!\\n5. A haszn\u00e1lt l\u00e9tr\u00e1k emelked\u00e9snek 4:1 ar\u00e1ny\u00fanak
  kell lennie, \u00e9s rendelkezni\u00fck kell cs\u00fasz\u00e1sg\u00e1tl\u00f3 talpakkal
  (haszn\u00e1lat k\u00f6zben az als\u00f3 v\u00e9g\u00fckn\u00e9l meg kell t\u00e1masztani
  a l\u00e9tr\u00e1kat).\\n6. A l\u00e9tr\u00e1t felhaszn\u00e1l\u00f3 munkav\u00e1llal\u00f3
  k\u00f6teles a l\u00e9tr\u00e1t munkakezd\u00e9s el\u0151tt ellen\u0151rizni!\\n\\nC4.
  Azbeszt anyagok\\n\\nAzbeszt haszn\u00e1lata tilos!  Az olyan bont\u00e1si munk\u00e1kn\u00e1l,
  ahol azbeszt van jelen, minimum az ABB Azbeszt utas\u00edt\u00e1s\u00e1t GI/SA-01.02A01
  (beszerezhet\u0151 az ABB k\u00e9pvisel\u0151j\u00e9t\u0151l), \u00e9s a helyi azbesztre
  vonatkoz\u00f3 t\u00f6rv\u00e9nyeket szigor\u00faan be kell tartani.\\n\\nMinden
  munk\u00e1t j\u00f3v\u00e1 kell hagynia az ABB k\u00e9pvisel\u0151j\u00e9nek \u00e9s
  a hat\u00f3s\u00e1gnak, \u00e9s csak az azbeszttel val\u00f3 munk\u00e1ra kik\u00e9pzett
  \u00e9s enged\u00e9llyel rendelkez\u0151 hat\u00f3s\u00e1gi enged\u00e9llyel is
  rendelkez\u0151 v\u00e1llalkoz\u00f3 v\u00e9gezheti ezeket el.  K\u00e9sz\u00edteni
  kell egy azbeszt\u00e1rtalmatlan\u00edt\u00e1si tervet, amely meghat\u00e1rozza
  az \u00f6sszes sz\u00fcks\u00e9ges egy\u00e9ni v\u00e9d\u0151felszerel\u00e9st \u00e9s
  a szennyez\u0151d\u00e9smentes\u00edt\u00e9si elj\u00e1r\u00e1st.\\n\\nC5. K\u00e9miai
  biztons\u00e1g\\n\\n1. A helysz\u00ednen dolgoz\u00f3 \u00f6sszes v\u00e1llalkoz\u00f3
  k\u00f6teles kock\u00e1zatelemz\u00e9st k\u00e9sz\u00edteni \u00e9s beny\u00fajtani
  a Megrendel\u0151nek a vesz\u00e9lyes anyagokkal t\u00f6rt\u00e9n\u0151 munkav\u00e9gz\u00e9sekre
  vonatkoz\u00f3an. Ha nincs ilyen kock\u00e1zata a munkav\u00e9gz\u00e9s sor\u00e1n,
  err\u0151l \u00edr\u00e1sban kell nyilatkoznia.\\n2. A helysz\u00ednen vegyi anyagokkal
  dolgoz\u00f3 szem\u00e9lyeknek rendelkeznie kell a megfelel\u0151 k\u00e9pes\u00edt\u00e9sekkel
  \u00e9s ismerni\u00fck kell a vonatkoz\u00f3 v\u00e9szhelyzeti elj\u00e1r\u00e1sokat.\\n3.
  A vegyi anyagok \u00e9s m\u00e1s vesz\u00e9lyes anyagok sz\u00e1m\u00e1ra elegend\u0151,
  megfelel\u0151 \u00e9s biztons\u00e1gos t\u00e1rol\u00f3kat kell biztos\u00edtani,
  a sziv\u00e1rg\u00e1s miatti k\u00f6rnyezetszennyez\u00e9s elker\u00fcl\u00e9se
  \u00e9rdek\u00e9ben.\\n4. A biztons\u00e1gi adatlapokat a helysz\u00ednen kell t\u00e1rolni
  \u00e9s a dolgoz\u00f3kat oktat\u00e1sban, kell r\u00e9szes\u00edteni vegyi, vesz\u00e9lyes
  anyagok vesz\u00e9lyeivel \u00e9s az anyagok helyes haszn\u00e1lat\u00e1val kapcsolatban.\\n5.
  A t\u00e1rol\u00f3kat/csomagol\u00e1st fel kell c\u00edmk\u00e9zni a tartalom megjel\u00f6l\u00e9s\u00e9vel,
  meg kell v\u00e9deni a k\u00fcls\u0151 behat\u00e1sokt\u00f3l/s\u00e9r\u00fcl\u00e9sekt\u0151l
  \u00e9s folyamatosan figyelni kell.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\n6.
  A helysz\u00ednen lennie kell megfelel\u0151 abszorbens anyagnak, amelyet a vesz\u00e9lyes
  anyag mennyis\u00e9g\u00e9nek megfelel\u0151en k\u00e9szenl\u00e9tben kell tartani
  b\u00e1rmilyen ki\u00f6ml\u00e9s eset\u00e9re.\\n7. Megfelel\u0151 g\u00e9peket,
  felszerel\u00e9st \u00e9s v\u00e9d\u0151ruh\u00e1zatot kell haszn\u00e1lni. A helysz\u00ednen
  \u201eTilos a doh\u00e1nyz\u00e1s\\\" t\u00e1bl\u00e1kat kell elhelyezni.\\n8. A
  vesz\u00e9lyes hullad\u00e9kot \u00e9s a visszamaradt anyagokat a gy\u00e1rt\u00f3
  anyagbiztons\u00e1gi adatlapj\u00e1n tal\u00e1lhat\u00f3 utas\u00edt\u00e1sok szerint
  kell kezelni.\\n9. A PCB tartalm\u00fa felszerel\u00e9seket az ABB szab\u00e1lyai
  \u00e9s a nemzeti vonatkoz\u00f3 rendeletek szerint kell kezelni.\\n\\nC6. S\u0171r\u00edtett
  g\u00e1zok\\n\\n1. T\u00e1rolja a g\u00e1zt tartalmaz\u00f3 palackokat sz\u00e1raz,
  biztons\u00e1gos helyen, egyenes fel\u00fcleten \u00e9s j\u00f3l szell\u0151z\u0151
  ter\u00fcleten.\\n2. Bizonyosodjon meg r\u00f3la, hogy semmilyen gyullad\u00e1st
  okoz\u00f3 k\u00f6r\u00fclm\u00e9ny nem \u00e1ll fenn.\\n3. Az \u00e9ghet\u0151
  g\u00e1zokat az oxig\u00e9nt\u0151l elk\u00fcl\u00f6n\u00edtve t\u00e1rolja (> 1m).\\n4.
  A palackokat fel\u00e1ll\u00edtott helyzetben t\u00e1rolja \u00e9s r\u00f6gz\u00edtse
  \u0151ket a felbor\u00edt\u00e1s megel\u0151z\u00e9se \u00e9rdek\u00e9ben.\\n5.
  Haszn\u00e1ljon megfelel\u0151 tart\u00f3kat \u00e9s r\u00f6gz\u00edt\u0151k\u00f6telet
  a palackok megemel\u00e9s\u00e9hez, amikor felvon\u00f3t vagy emel\u0151darut haszn\u00e1l.\\n6.
  Az \u00f6sszes t\u00f6ml\u0151nek, cs\u0151\u00f6sszek\u00f6t\u0151nek, szelepnek
  \u00e9s palacknak j\u00f3 \u00e1llapotban kell lennie \u00e9s rendszeresen ellen\u0151rizni
  kell, hogy nem s\u00e9r\u00fcltek-e meg.\\n7. Vissza\u00e9g\u00e9sg\u00e1tl\u00f3t
  kell szerelni az \u00f6sszes \u00e9ghet\u0151 g\u00e1zt tartalmaz\u00f3 palackra
  (pl. az acetil\u00e9n/dissousg\u00e1z hegeszt\u0151pisztoly markolat\u00e1n\u00e1l
  stb.).\\n8. A palackokat sz\u00ednk\u00f3ddal kell ell\u00e1tni, \u00e9s a c\u00edmk\u00e9n
  fel kell t\u00fcntetni a tartalmukat.\\n\\nC7. Z\u00e1rt terek\\n\\nAmennyiben lehets\u00e9ges,
  el kell ker\u00fclni a z\u00e1rt terekben val\u00f3 munkav\u00e9gz\u00e9st. Amennyiben
  ez nem megoldhat\u00f3, kock\u00e1zatelemz\u00e9st kell v\u00e9gezni \u00e9s \u00edr\u00e1sos
  munkaenged\u00e9lyt kell ki\u00e1ll\u00edtani.  A munk\u00e1t csak az ut\u00e1n
  lehet megkezdeni, hogy az ABB k\u00e9pvisel\u0151je meg\u00e1llap\u00edtotta \u00e9s
  tan\u00fas\u00edtja, hogy a megfelel\u0151 biztons\u00e1gi szab\u00e1lyz\u00e1s
  \u00e9rv\u00e9nyben van (amennyiben sz\u00fcks\u00e9ges g\u00e1zkoncentr\u00e1ci\u00f3
  m\u00e9r\u00e9st kell biztos\u00edtani).\\n\\nC8. Elektromoss\u00e1g\\n\\n1. Kiz\u00e1r\u00f3lag
  k\u00e9pzett, megfelel\u0151 k\u00e9pes\u00edt\u00e9ssel \u00e9s a helyi k\u00f6r\u00fclm\u00e9nyek
  vesz\u00e9lyeire kioktatott szem\u00e9lyek dogozhatnak fesz\u00fclts\u00e9g alatt
  l\u00e9v\u0151, vagy fesz\u00fclts\u00e9g al\u00e1 helyezhet\u0151 l\u00e9tes\u00edtm\u00e9nyeken
  \u00e9s azok k\u00f6zel\u00e9ben. (Egyed\u00fcl munk\u00e1t v\u00e9gezni ezekben
  a l\u00e9tes\u00edtm\u00e9nyekben tilos!)\\n2. Az al\u00e1llom\u00e1si \u00fczemben
  dolgoz\u00f3k felel\u0151ss\u00e9ge a megb\u00edz\u00f3 \u00e1ltal ki\u00e1ll\u00edtott
  \u00edr\u00e1sos munkakezd\u00e9si enged\u00e9ly megl\u00e9t\u00e9nek biztos\u00edt\u00e1sa
  \u00e9s dokument\u00e1lniuk kell a megfigyel\u00e9seiket a megfelel\u0151 f\u00f6ldel\u00e9s
  ellen\u0151rz\u00e9s\u00e9hez.\\n3. Amikor az \u00e9p\u00edt\u00e9si munk\u00e1kat
  vagy a fel\u00e1ll\u00edt\u00e1si munk\u00e1kat fesz\u00fclts\u00e9g alatt l\u00e9v\u0151
  r\u00e9szek k\u00f6zel\u00e9ben kell elv\u00e9gezni, akkor az \u00e1ramell\u00e1t\u00e1st
  ki kell kapcsolni \u00e9s f\u00f6ldelni kell. Amennyiben ez m\u0171veleti okokb\u00f3l
  kifoly\u00f3lag nem megval\u00f3s\u00edthat\u00f3, a fesz\u00fclts\u00e9g alatt
  l\u00e9v\u0151 r\u00e9szeket elker\u00edt\u00e9ssel kell elk\u00fcl\u00f6n\u00edteni,
  meg kell jel\u00f6lni \u00e9s egy kijel\u00f6lt szakk\u00e9pzett szem\u00e9lynek
  folyamatosan fel\u00fcgyelnie \u00e9s ellen\u0151riznie kell a munk\u00e1latokat.
  Amennyiben lehets\u00e9ges, a Megrendel\u0151 helyezzen szigetel\u0151anyagot a
  fesz\u00fclts\u00e9g alatt l\u00e9v\u0151 \u00e1ramk\u00f6r\u00f6kre, ezzel megakad\u00e1lyozhatja
  a v\u00e9letlen \u00e9rintkez\u00e9seket. A r\u00e9szletek\u00e9rt l\u00e1sd EN
  50110-1.\\n4. Biztons\u00e1gos munkater\u00fcletek a kapcsol\u00f3terekben: A munkater\u00fclet
  elker\u00edt\u00e9se az egyik\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nMunkav\u00e9delmi mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s
  d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2. v\u00e1lt.  2008. november
  1.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nABB referencia sz\u00e1m:\\n\\n__________________________________________________________________________________\\n\\nlegfontosabb
  int\u00e9zked\u00e9s a biztons\u00e1gos \u00e9s nem biztons\u00e1gos munkater\u00fcletek
  k\u00f6z\u00f6tti egy\u00e9rtelm\u0171 elhat\u00e1rol\u00e1s biztos\u00edt\u00e1s\u00e1ra.
  Az elhat\u00e1rol\u00e1shoz haszn\u00e1lt felszerel\u00e9seket (korl\u00e1tok, l\u00e1ncok
  \u00e9s terel\u0151k\u00fapok, stb.) \u00e9s a biztons\u00e1gi t\u00e1bl\u00e1kat
  kiz\u00e1r\u00f3lag erre felhatalmazott szem\u00e9ly teheti ki vagy mozgathatja,
  a kock\u00e1zatfelm\u00e9r\u00e9s ut\u00e1n. Az elhat\u00e1rol\u00e1shoz haszn\u00e1lt
  felszerel\u00e9s sz\u00edne a helyi szab\u00e1lyok, rendelkez\u00e9sek, szok\u00e1sok
  \u00e9s gyakorlat szerint elt\u00e9r\u0151 lehet, de mindenk\u00e9ppen egy\u00e9rtelm\u0171en
  jeleznie kell a dolgoz\u00f3k fel\u00e9, hogy egy biztons\u00e1gos ter\u00fcletr\u0151l
  egy vesz\u00e9lyes ter\u00fcletre l\u00e9pnek \u00e1t, \u00e9s ford\u00edtva.\\n\\n5.
  F\u00f6ldalatti k\u00e1belekkel val\u00f3 \u00e9rintkez\u00e9s: S\u00falyos s\u00e9r\u00fcl\u00e9sek
  akkor is keletkezhetnek, amikor olyan \u00e1s\u00e1si m\u0171veleteket vagy f\u00f6ldkiemel\u00e9si
  munk\u00e1kat v\u00e9geznek, amelyek sor\u00e1n el\u0151fordulhat az elektromos
  vezet\u00e9kek \u00e1tszak\u00edt\u00e1sa vagy \u00f6sszez\u00faz\u00e1sa. Ilyen
  esetekben a s\u00e9r\u00fcl\u00e9sek gyakran igen s\u00falyosak, ak\u00e1r hal\u00e1losak
  is lehetnek a kezeken, arcon \u00e9s testen l\u00e9v\u0151 \u00e9g\u00e9sek miatt.
  Az \u00f3vint\u00e9zked\u00e9sek, t\u00f6bbek k\u00f6z\u00f6tt:\\n* Egyeztet\u00e9s
  a Megb\u00edz\u00f3val b\u00e1rmilyen k\u00e1bel lehets\u00e9ges jelenl\u00e9t\u00e9vel
  kapcsolatban.\\n* K\u00e1belek helyzet\u00e9t felismer\u0151 k\u00e9sz\u00fcl\u00e9kek
  haszn\u00e1lta \u00e9s jelenl\u00e9t eset\u00e9n ezek megjel\u00f6l\u00e9se a talajon.\\n*
  Egyeztet\u00e9s a k\u00f6z\u00fczemi szolg\u00e1ltat\u00f3kkal \u00e9s a vonatkoz\u00f3
  tervrajzok megszerz\u00e9se.\\n* K\u00e9zi felt\u00e1r\u00e1s biztos\u00edt\u00e1sa
  a nyomvonal k\u00f6rnyezet\u00e9ben.\\n6. L\u00e9gk\u00e1belek: Miel\u0151tt a j\u00e1rm\u0171vek
  vagy a neh\u00e9zg\u00e9pek bel\u00e9phetn\u00e9nek a fesz\u00fclts\u00e9g alatt
  l\u00e9v\u0151 ter\u00fcletekre, a bej\u00e1ratn\u00e1l fel kell \u00e1ll\u00edtani
  egy legnagyobb megengedett j\u00e1rm\u0171magass\u00e1got jelz\u0151 kaput.\\n7.
  Elektromos felszerel\u00e9sek \u00e9s k\u00e9ziszersz\u00e1mok\\n(a) Az \u00f6sszes
  elektromos felszerel\u00e9s \u00e9s k\u00e9zi szersz\u00e1m elektromos ell\u00e1t\u00e1s\u00e1t
  fel kell szerelni egy f\u00f6ldz\u00e1rlati v\u00e9delemmel ell\u00e1tott megszak\u00edt\u00f3val
  (GFCI). Az \u00f6sszes k\u00e1belnek a fenti megszak\u00edt\u00f3val v\u00e9dett
  gy\u0171jt\u0151s\u00ednr\u0151l kell kiindulnia, ahol egy\u00e9rtelm\u0171en meg
  kell jel\u00f6lni az \u00e1ramk\u00f6r\u00f6ket a v\u00e9szle\u00e1ll\u00edt\u00e1s
  megk\u00f6nny\u00edt\u00e9s\u00e9hez.\\n(b) Amennyiben a munkav\u00e9gz\u00e9s magas
  kock\u00e1zattal j\u00e1r, mert a helysz\u00edn vizes vagy z\u00e1rt t\u00e9rnek
  sz\u00e1m\u00edt, akkor pneumatikus szersz\u00e1mokat kell haszn\u00e1lni, ezzel
  kiiktatva az \u00f6sszes elektromos kock\u00e1zatot.\\n(c) A 230V-os rendszern\u00e9l
  biztons\u00e1gosabb, ha lehet\u0151s\u00e9g szerint akkumul\u00e1toros k\u00e9ziszersz\u00e1mokat
  alkalmaznak.\\n(d) Amennyiben elengedhetetlen a 230V-os hordozhat\u00f3 szersz\u00e1mok
  haszn\u00e1lata, akkor haszn\u00e1ljon FI-rel\u00e9t (RCD), amelyn\u00e9l a kiold\u00e1si
  \u00e1ramer\u0151ss\u00e9g 30mA, ezt naponta ellen\u0151rizze.\\n8. Egy\u00e9ni
  v\u00e9d\u0151eszk\u00f6z\u00f6k (Ev)\\n(a) kiz\u00e1r\u00f3lag j\u00f3v\u00e1hagyott
  Ev hordhat\u00f3\\n(b) Fesz\u00fclts\u00e9g alatt l\u00e9v\u0151 felszerel\u00e9s
  k\u00f6zel\u00e9ben v\u00e9gzett munka eset\u00e9n mindig biztos\u00edtani kell
  \u00edvkis\u00fcl\u00e9s ellen v\u00e9dett ruh\u00e1zatot. IEC (Nemzetk\u00f6zi
  Elektrotechnikai Bizotts\u00e1g) 1es oszt\u00e1ly a minim\u00e1lis k\u00f6vetelm\u00e9ny
  vagy 2-es oszt\u00e1ly, amennyiben a munka azt megk\u00f6veteli. (megfelel az NFPA
  70E 2-es \u00e9s 4-es vesz\u00e9ly oszt\u00e1ly\u00e1nak, \u00e9rtelem szer\u0171en)\\n(c)
  amennyiben a dolgoz\u00f3k szigetelt keszty\u0171ket viselnek, akkor kop\u00e1s
  \u00e9s sz\u00far\u00e1s\u00e1ll\u00f3 k\u00fcls\u0151 keszty\u0171ket is hordaniuk
  kell.\\n(d) j\u00f3v\u00e1hagyott szemv\u00e9delem, arcv\u00e9d\u0151 form\u00e1j\u00e1ban\\n9.
  Szigetelt szersz\u00e1mok, stb.\\n(a) Minden fesz\u00fclts\u00e9g alatt l\u00e9v\u0151
  r\u00e9szen v\u00e9gzett munk\u00e1t szigetelt szersz\u00e1mokkal kell elv\u00e9gezni
  \u00e9s ezeket mindig megfelel\u0151 \u00e1llapotban kell tartani\\n(b) A m\u00e9r\u0151l\u00e9cek
  \u00e9s m\u00e9r\u0151szalagok nem lehetnek vezet\u0151 anyagb\u00f3l.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\n(c)
  Az ellen\u0151rz\u0151 \u00e9s m\u00e9r\u0151 k\u00e9sz\u00fcl\u00e9kek kiz\u00e1r\u00f3lag
  fesz\u00fclts\u00e9gm\u00e9r\u0151 m\u0171szerek lehetnek. Multim\u00e9ter haszn\u00e1lata
  tilos!\\n\\nC9. F\u00f6ldkiemel\u00e9s \u00e9s k\u00f6z\u00fczemi szolg\u00e1ltat\u00e1sok\\n\\n1.
  A f\u00f6ldkiemel\u00e9st \u00e9s \u00e1rok\u00e1s\u00e1st olyan m\u00f3don tervezze
  meg \u00e9s v\u00e9gezze el, hogy az megakad\u00e1lyozza a falbeoml\u00e1st. Egy
  k\u00e9pzett/megfelel\u0151 k\u00e9pes\u00edt\u00e9sekkel rendelkez\u0151 szem\u00e9ly
  vizsg\u00e1lja meg a talaj \u00e1llapot\u00e1t, majd v\u00e1lassza ki a megfelel\u0151
  v\u00e9d\u0151rendszereket.\\n2. Vegye fel a kapcsolatot a megb\u00edz\u00f3val
  \u00e9s a k\u00f6z\u00fczemi szolg\u00e1ltat\u00f3kkal (g\u00e1z, elektromos, stb.)
  a f\u00f6ldalatti k\u00e1belek helyzet\u00e9nek meghat\u00e1roz\u00e1s\u00e1hoz
  \u00e9s az UXO (fel nem robbant eszk\u00f6z\u00f6k)-vizsg\u00e1latok/j\u00f3v\u00e1hagy\u00e1s
  visszaigazol\u00e1s\u00e1hoz.\\n3. A kock\u00e1zatos ter\u00fcleteken aknavizsg\u00e1latot
  kell elv\u00e9gezni \u00e9s meg kell szerezni az UXO j\u00f3v\u00e1hagy\u00e1st
  \u00e9s ezeket az EN szab\u00e1lyok szerint dokument\u00e1lni kell.\\n4. Amennyiben
  szennyezett f\u00f6ldter\u00fcletet tal\u00e1l, \u00e9rtes\u00edtse az ABB k\u00e9pvisel\u0151j\u00e9t
  \u00e9s a szennyez\u0151d\u00e9st t\u00e1rolja a helysz\u00ednen a m\u00e1s fajta
  hullad\u00e9kokt\u00f3l elk\u00fcl\u00f6n\u00edtve, \u00e9s \u00e1rtalmatlan\u00edtsa
  megfelel\u0151en.\\n5. Ha szennyezett f\u00f6ldter\u00fcletet tal\u00e1l, \u00e1ll\u00edtsa
  le a munk\u00e1t, am\u00edg a szennyez\u0151anyagot be nem azonos\u00edtott\u00e1k
  \u00e9s el nem v\u00e9gezt\u00e9k a megfelel\u0151 int\u00e9zked\u00e9seket a vesz\u00e9lyes
  szennyez\u0151d\u00e9sekkel val\u00f3 \u00e9rintkez\u00e9s megakad\u00e1lyoz\u00e1s\u00e1ra.\\n6.
  A f\u00f6ldkiemel\u00e9sn\u00e9l keletkez\u0151 kitermelt f\u00f6ldet a kiemel\u00e9s
  sz\u00e9l\u00e9t\u0151l legal\u00e1bb 1.5m-re kell elhelyezni, amennyiben a m\u00e9lys\u00e9g
  >1.5m, akkor a m\u00e9lys\u00e9ggel egyez\u0151 t\u00e1vols\u00e1g tekinthet\u0151
  megfelel\u0151nek.\\n7. A kitermel\u00e9s oldalfalait megfelel\u0151en ki kell t\u00e1masztani
  megfelel\u0151 min\u0151s\u00e9g\u0171 fa t\u00e1maszt\u00e9kokkal, vagy j\u00f3v\u00e1hagyott
  saj\u00e1t rendszerekkel. A t\u00e1maszt\u00e9kok helyett megfelel\u0151 lehet az
  oldalak visszad\u00f6ng\u00f6l\u00e9se vagy az oldalak biztons\u00e1gos sz\u00f6g\u0171
  lejt\u00e9ssel val\u00f3 kialak\u00edt\u00e1sa.\\n8. A kitermel\u00e9si ter\u00fcletre
  megfelel\u0151 bejut\u00e1si lehet\u0151s\u00e9get kell biztos\u00edtani.\\n9. Sz\u00fcks\u00e9g
  van sz\u00e9lekn\u00e9l l\u00e9v\u0151 v\u00e9delemre, nehogy t\u00e1rgyak vagy
  anyagok essenek a kiemel\u00e9sben dolgoz\u00f3 szem\u00e9lyek fej\u00e9re.\\n10.
  J\u00e1rm\u0171meg\u00e1ll\u00edt\u00f3 \u00fctk\u00f6z\u0151t\u00f6mb\u00f6ket
  kell elhelyezni, ezzel biztos\u00edtva, hogy a lerakod\u00f3/felrakod\u00f3 j\u00e1rm\u0171vek
  nem \u00e1llnak t\u00fal k\u00f6zel a f\u00f6ldkiemel\u00e9shez.\\n11. Minden nyitott
  f\u00f6ldkiemel\u00e9st ker\u00edt\u00e9ssel vagy torlaszokkal kell k\u00f6rbevenni,
  vagy le kell fedni. Amennyiben a ter\u00fclet a lakoss\u00e1gi ter\u00fclettel is
  \u00e9rintkezik, a ker\u00edt\u00e9snek 2m magasnak kell lennie, r\u00f6gz\u00edteni
  kell \u00e9s megfelel\u0151 vil\u00e1g\u00edt\u00e1ssal is el kell l\u00e1tni.\\n12.
  A j\u00e1rm\u0171vek nem lehetnek a f\u00f6ldkiemel\u00e9s sz\u00e9l\u00e9hez 2.0m-n\u00e9l
  k\u00f6zelebb, nagyobb t\u00e1vols\u00e1g is el\u0151\u00edrhat\u00f3, ha a f\u00f6ldi
  \u00e1llapota ezt megk\u00edv\u00e1nja.\\n13. A helysz\u00ednen dolgoz\u00f3 \u00f6sszes
  munk\u00e1st t\u00e1j\u00e9koztatni kell a f\u00f6ldkiemel\u00e9sen val\u00f3 munkav\u00e9gz\u00e9s
  vesz\u00e9lyeir\u0151l.\\n14. Minden f\u00f6lkiemel\u00e9st ellen\u0151rizni kell
  minden egyes m\u0171szak megkezd\u00e9se el\u0151tt \u00e9s olyan esem\u00e9nyek
  ut\u00e1n, amelyek ronthatt\u00e1k a stabilit\u00e1s\u00e1t, pl.: er\u0151s es\u0151z\u00e9s.
  Az ellen\u0151rz\u00e9sekr\u0151l jegyz\u0151k\u00f6nyvet kell k\u00e9sz\u00edteni.\\n15.Minden
  f\u00f6ldkiemel\u00e9st vissza kell t\u00f6lteni, amint az megtehet\u0151.\\n16.
  Porv\u00e9delmet vagy alacsony porral j\u00e1r\u00f3 technik\u00e1kat kell alkalmazni.
  A f\u00f6ldkiemel\u00e9si munk\u00e1k befejez\u00e9se ut\u00e1n a helysz\u00edn
  ter\u00fclet\u00e9t vissza kell \u00e1ll\u00edtani a megegyez\u00e9s szerint.\\n\\nK\u00f6z\u00fczemi
  szolg\u00e1ltat\u00e1sok\\n\\n1. Ha a helysz\u00ednen l\u00e9v\u0151 k\u00f6z\u00fczemi
  szolg\u00e1ltat\u00e1sok cs\u00f6vez\u00e9s\u00e9vel kapcsolatban csak kev\u00e9s
  vagy egy\u00e1ltal\u00e1n semennyi inform\u00e1ci\u00f3 nem \u00e1ll rendelkez\u00e9sre,
  akkor megfelel\u0151 helymeghat\u00e1roz\u00f3 k\u00e9sz\u00fcl\u00e9keket kell
  alkalmazni a szolg\u00e1ltat\u00e1sok bejel\u00f6l\u00e9s\u00e9hez.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\n2.
  A szolg\u00e1ltat\u00e1sok cs\u00f6vez\u00e9s\u00e9t meg kell jel\u00f6lni a talajon
  \u00e9s a helysz\u00edni terven is, \u00e9s ahol a f\u00f6ldkiemel\u00e9s a szolg\u00e1ltat\u00e1sokhoz
  k\u00f6zel t\u00f6rt\u00e9nik, ott k\u00e9zi \u00e1s\u00e1ssal kell azt elv\u00e9gezni.\\n3.
  Amennyiben b\u00e1rmilyen k\u00e9ts\u00e9g mer\u00fcl fel a ki\u00e1sott k\u00f6z\u00fczemi
  cs\u00f6vek azonos\u00edt\u00e1s\u00e1val kapcsolatban, akkor azokat vagy g\u00e1z,
  vagy elektromos szolg\u00e1ltat\u00e1sk\u00e9nt kell kezelni. Miut\u00e1n siker\u00fclt
  a beazonos\u00edt\u00e1s, meg kell ezeket jel\u00f6lni.\\n\\nC10. T\u0171z \u00e9s
  evaku\u00e1l\u00e1s\\n\\n1. Gondoskodjon a t\u0171z\u00e9rz\u00e9kel\u00e9s \u00e9s
  figyelmeztet\u00e9s megfelel\u0151 biztos\u00edt\u00e1s\u00e1r\u00f3l. Ez lehet
  elektromos k\u00fcrt, s\u00edp, harang vagy kis helysz\u00edn eset\u00e9ben \u00e9l\u0151sz\u00f3
  is.\\n* 2. Megjel\u00f6lt helyeken t\u0171zv\u00e9delmi felszerel\u00e9st, mint
  pl.: k\u00e9zi t\u0171zolt\u00f3 k\u00e9sz\u00fcl\u00e9k, kell elhelyezni a vonatkoz\u00f3
  jogszab\u00e1lyok alapj\u00e1n\\n\\nAhol sz\u00fcks\u00e9ges, elektromos t\u00fczek
  olt\u00e1s\u00e1hoz haszn\u00e1lt t\u0171zolt\u00f3 k\u00e9sz\u00fcl\u00e9keket
  is biztos\u00edtani kell.  Ahol sz\u00fcks\u00e9ges, m\u00e1s t\u00edpus\u00fa t\u00fczek
  (pl.: f\u00e9m, olajok \u00e9s zs\u00edrok) olt\u00e1s\u00e1hoz haszn\u00e1lat t\u0171zolt\u00f3
  berendez\u00e9seket is biztos\u00edtani kell.\\n\\n3. Az \u00fczemanyag k\u00e9szletet,
  a gy\u00fal\u00e9kony term\u00e9keket, g\u00e1zokat \u00e9s g\u00e1zpalackokat,
  folyad\u00e9kokat, m\u00e1s anyagokat \u00e9s a hullad\u00e9kot a munkater\u00fclett\u0151l
  \u00e9s a beszerel\u00e9sre v\u00e1r\u00f3 felszerel\u00e9st\u0151l elk\u00fcl\u00f6n\u00edtett
  helyen kell t\u00e1rolni.\\n\\nT\u0171z miatti evaku\u00e1l\u00e1s\\n\\n1. Biztos\u00edtani
  kell egy megfelel\u0151 menek\u00fcl\u00e9si \u00fatvonalat t\u0171z eset\u00e9re,
  amelyet mindig szabadon kell tartani.\\n2. Kett\u0151 (2) menek\u00fcl\u00e9si \u00fatvonalat
  kell biztos\u00edtani t\u0171z eset\u00e9re. Ez azt is jelenti, hogy a menek\u00fcl\u00e9si
  \u00fatvonalat megfelel\u0151en meg kell jel\u00f6lni, kifel\u00e9 kell ny\u00edlnia
  \u00e9s biztons\u00e1gos helyre kell vezetnie.\\n3. T\u0171z miatti evaku\u00e1l\u00e1si
  elj\u00e1r\u00e1sokat kell bevezetni, melyeket minden helysz\u00ednen dolgoz\u00f3
  szem\u00e9llyel ismertetni kell a helysz\u00edni k\u00e9pz\u00e9s sor\u00e1n.\\n4.
  \u00c9vente legal\u00e1bb egyszer el kell v\u00e9gezni egy pr\u00f3ba t\u0171zriad\u00f3t,
  vagy legal\u00e1bb egyszer a projekt kivitelez\u00e9se sor\u00e1n.\\n\\nMagas h\u0151m\u00e9rs\u00e9klettel
  j\u00e1r\u00f3 munka\\n\\n1. Amennyiben lehets\u00e9ges, ker\u00fclni kell a magas
  h\u0151m\u00e9rs\u00e9klettel j\u00e1r\u00f3 munk\u00e1kat. Amennyiben ez nem megoldhat\u00f3,
  minden magas h\u0151m\u00e9rs\u00e9klettel j\u00e1r\u00f3 munk\u00e1t j\u00f3v\u00e1
  kell hagyatni az ABB k\u00e9pvisel\u0151j\u00e9vel, aki ki\u00e1ll\u00edt egy magas
  h\u0151m\u00e9rs\u00e9klettel j\u00e1r\u00f3 munka enged\u00e9lyt.\\n2. A hegeszt\u00e9si,
  h\u0151kezel\u00e9si, csiszol\u00e1si, \u00e9get\u00e9si, stb. munk\u00e1kat v\u00e9gz\u0151
  dolgoz\u00f3knak rendelkeznie kell a sz\u00fcks\u00e9ges k\u00e9pes\u00edt\u00e9sekkel.
  A munka megkezd\u00e9se el\u0151tt \u00e1t kell n\u00e9zni a biztons\u00e1gi el\u0151\u00edr\u00e1sokat
  (kock\u00e1zatelemz\u00e9s). A k\u00fcl\u00f6nleges kock\u00e1zatokat \u00e9s vesz\u00e9lyeket
  cs\u00f6kkenteni \u00e9s dokument\u00e1lni kell.\\n3. T\u0171zfigyel\u00e9st kell
  folytatni, ezzel biztos\u00edtva, hogy a hegeszt\u00e9sb\u0151l, v\u00e1g\u00e1sb\u00f3l
  \u00e9s csiszol\u00e1sb\u00f3l keletkez\u0151 szikr\u00e1k ne okozzanak t\u00fczet.  A
  t\u0171zfigyel\u0151knek k\u00e9zk\u00f6zelben kell tartania egy t\u0171zolt\u00f3
  k\u00e9sz\u00fcl\u00e9ket a magas h\u0151m\u00e9rs\u00e9klettel j\u00e1r\u00f3 munk\u00e1k
  teljes id\u0151tartama alatt.\\n\\nC11. Gy\u00fal\u00e9kony folyad\u00e9kok\\n\\n1.
  Fontos, hogy ker\u00fclje a gy\u00fal\u00e9kony folyad\u00e9kok haszn\u00e1lat\u00e1t,
  amikor csak lehet. Amennyiben ez nem megoldhat\u00f3, akkor a magas lobban\u00e1spont\u00fa
  folyad\u00e9kokat kell el\u0151nyben r\u00e9szes\u00edteni az alacsony lobban\u00e1spont\u00fa
  folyad\u00e9kokkal szemben.\\n2. T\u00e1rolja a nagy t\u00e9rfogat\u00fa tart\u00e1lyokat
  a munkater\u00fclett\u0151l t\u00e1vol, egy rakt\u00e1rban vagy t\u0171z\u00e1ll\u00f3
  anyagb\u00f3l k\u00e9sz\u00fclt szekr\u00e9nyben. Ennek rendelkeznie kell valamennyi
  term\u00e9szetes\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nszell\u0151z\u00e9ssel
  vagy l\u00e9gmozg\u00e1ssal az als\u00f3 \u00e9s fels\u0151 szinteken, ez megakad\u00e1lyozza
  az esetlegesen g\u0151z\u00f6k felgy\u0171l\u00e9s\u00e9t \u00e9s seg\u00edt a sz\u00e9toszlat\u00e1sukban.\\n\\n3.
  A munkater\u00fcleten csak f\u00e9l napra elegend\u0151 mennyis\u00e9g lehet egyszerre
  jelen. Ehhez egy t\u0171z\u00e1ll\u00f3 t\u00e1rol\u00f3t kell biztos\u00edtani.\\n4.
  Ahol a t\u00e1roland\u00f3 mennyis\u00e9g kevesebb, mint 50 liter, ott f\u00e9mb\u0151l
  k\u00e9sz\u00fclt lez\u00e1rhat\u00f3 tart\u00e1lyokat is lehet alkalmazni.\\n5.
  Az \u00f6sszes tart\u00e1lyt megfelel\u0151en meg kell jel\u00f6lni \u00e9s haszn\u00e1laton
  k\u00edv\u00fcl mindig lefedve (z\u00e1rt fed\u0151vel, kupakkal) kell t\u00e1rolni.\\n6.
  Ki\u00f6ml\u00e9sv\u00e9dett tart\u00e1lyokat, illetve ki\u00f6nt\u0151ket kell
  haszn\u00e1lni, amennyiben lehets\u00e9ges.\\n7. Amennyiben \u00fclep\u00edt\u00e9st
  v\u00e9gez, ezt ny\u00edlt ter\u00fcleten, szabad \u00e9g alatt kell elv\u00e9gezni,
  \u00e9s ki\u00f6ml\u00e9sv\u00e9dett tart\u00e1lyokban kell elhelyezni.\\n8. A rakt\u00e1r
  \u00e9s a felhaszn\u00e1l\u00e1si ter\u00fclet k\u00f6zel\u00e9ben semmilyen gyullad\u00e1si
  forr\u00e1s nem lehet. A helysz\u00ednen \u201eDoh\u00e1nyz\u00e1s \u00e9s ny\u00edlt
  l\u00e1ng haszn\u00e1lata tilos!\\\" t\u00e1bl\u00e1kat kell elhelyezni.\\n9. A
  gy\u00fal\u00e9kony folyad\u00e9kot tartalmaz\u00f3 tart\u00e1lyokat k\u00e1rment\u0151vel
  k\u00f6r\u00fclv\u00e9ve kell elhelyezni, amely a legnagyobb tart\u00e1ly tartalm\u00e1nak
  110%-\u00e1t k\u00e9pes megtartani.\\n10. Biztos\u00edtani kell egy ki\u00f6ml\u00e9s
  kezel\u0151 csomagot is (pl. felitat\u00f3 anyag), a ki\u00f6ml\u00e9sek kezel\u00e9s\u00e9hez
  \u00e9s a felsz\u00edni v\u00edzelvezet\u0151k beszennyez\u0151d\u00e9s\u00e9nek
  megakad\u00e1lyoz\u00e1s\u00e1hoz.\\n11.T\u0171z eset\u00e9n a v\u00e9szhelyzeti
  t\u0171zv\u00e9delmi elj\u00e1r\u00e1sokat kell alkalmazni.\\n\\nC12. Emel\u00e9si
  m\u0171veletek\\n\\n1. Bizonyosodjon meg r\u00f3la, hogy megfelel\u0151 m\u00e9ret\u0171
  darut haszn\u00e1l, megfelel\u0151 biztons\u00e1gi r\u00e1hagy\u00e1ssal /terhel\u00e9si
  diagramot figyelembe kell venni/!\\n2. Az emel\u0151g\u00e9peket haszn\u00e1latuk
  el\u0151tt meg kell vizsg\u00e1lni /m\u0171szakos vizsg\u00e1lat/ \u00e9s eredm\u00e9ny\u00e9t
  az \u00fczemnapl\u00f3ban kell dokument\u00e1lni.\\n3. A teheremel\u00e9sekn\u00e9l,
  a pr\u00f3baemel\u00e9s elv\u00e9gez\u00e9se k\u00f6telez\u0151!\\n4. Ellen\u0151rizze
  a daru sz\u00e1ll\u00edt\u00f3j\u00e1nak \u00e9s az alkalmazott g\u00e9pkezel\u0151,
  k\u00f6t\u00f6z\u0151 \u00e9s az emel\u00e9sir\u00e1ny\u00edt\u00f3 kompetenci\u00e1j\u00e1t.\\n5.
  Bizonyosodjon meg r\u00f3la, hogy az emel\u00e9si kock\u00e1zat\u00e9rt\u00e9kel\u00e9st
  elv\u00e9gezt\u00e9k \u00e9s ez figyelembe vette a terhet, a talaj \u00e1llapot\u00e1t
  \u00e9s a k\u00f6zelben l\u00e9v\u0151 \u00e9p\u00fcleteket.\\n6. Ellen\u0151rizze
  a talaj \u00e1llapot\u00e1t. Amennyiben ez nem megfelel\u0151 a teherhez, egy speci\u00e1lis
  alapra lehet sz\u00fcks\u00e9g a daru \u00e9s kit\u00e1maszt\u00f3inak elhelyez\u00e9s\u00e9hez.\\n7.
  Ellen\u0151rizze, hogy a daru rendelkezik-e az utols\u00f3 ellen\u0151rz\u00e9s\u00e9nek/vizsg\u00e1lat\u00e1nak
  dokument\u00e1ci\u00f3j\u00e1val, legal\u00e1bb az utols\u00f3 12 h\u00f3napra vonatkoz\u00f3an.\\n8.
  Ellen\u0151rizze a haszn\u00e1lt emel\u0151 hevedereket, \u00e9s azt, hogy ezeket
  az utols\u00f3 6 h\u00f3napon bel\u00fcl megvizsg\u00e1lt\u00e1k-e \u00e9s a vizsg\u00e1lati
  jegyz\u0151k\u00f6nyv megvan-e.\\n9. Ellen\u0151rizze a vezet\u0151, hevederkezel\u0151
  \u00e9s jelz\u0151 hozz\u00e1\u00e9rt\u00e9s\u00e9t bizony\u00edt\u00f3 okiratokat,
  amennyiben ezeket \u00e1tadt\u00e1k.\\n\\nC13. Egyed\u00fcl v\u00e9gzett munka\\n\\n1.
  Az egyed\u00fcl v\u00e9gzett munka ker\u00fclend\u0151. Az elektromos berendez\u00e9sek
  k\u00f6zel\u00e9ben v\u00e9gzett munk\u00e1k eset\u00e9ben az egyed\u00fcli munkav\u00e9gz\u00e9s
  mindenkor tilos!\\n2. Az \u00e9jszakai m\u0171szakban dolgoz\u00f3kat mindig fel\u00fcgyelni
  kell.\\n\\nC14. K\u00e9zi rakod\u00e1s\\n\\n1. A k\u00e9zi rakod\u00e1si feladatokn\u00e1l
  kock\u00e1zat \u00e9rt\u00e9kel\u00e9st kell k\u00e9sz\u00edteni, \u00e9s megfelel\u0151
  szab\u00e1lyoz\u00e1st kell bevezetni.\\n2. A dolgoz\u00f3k \u00e1ltal kezelhet\u0151
  legnagyobb t\u00f6meg 25 kg.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nC15.
  Mobil \u00fczem, felszerel\u00e9s \u00e9s j\u00e1rm\u0171vek\\n\\n(G\u00e9pkocsik/utassz\u00e1ll\u00edt\u00f3
  j\u00e1rm\u0171vek eset\u00e9n l\u00e1sd C24)\\n\\n1. Biztos\u00edtsa, hogy a j\u00e1rm\u0171vek
  \u00e9s a gyalogosok egym\u00e1st\u00f3l elszepar\u00e1lva k\u00f6zlekedjenek, \u00e9s
  a helysz\u00ednen haszn\u00e1lt j\u00e1rm\u0171vek megfelel\u0151 bevezet\u0151
  \u00fattal rendelkeznek.\\n2. Biztos\u00edtson borul\u00e1s hat\u00e1sa elleni v\u00e9d\u0151szerkezeteket
  (ROPS) \u00e9s lees\u0151 t\u00e1rgyak elleni v\u00e9d\u0151szerkezeteket (FOPS).\\n3.
  A j\u00e1rm\u0171vekben utaz\u00f3 szem\u00e9lyek \u00e1ll\u00edts\u00e1k be \u00e9s
  haszn\u00e1lj\u00e1k a biztons\u00e1gi \u00f6vet.\\n4. Bizonyosodjon meg r\u00f3la,
  hogy a j\u00e1rm\u0171vezet\u0151k megfelel\u0151en k\u00e9pzettek, rendelkeznek
  a sz\u00fcks\u00e9ges k\u00e9pes\u00edt\u00e9sekkel \u00e9s enged\u00e9lyezett sz\u00e1mukra
  a j\u00e1rm\u0171 vezet\u00e9se;\\n5. A j\u00e1rm\u0171vek fel\u00e9p\u00edt\u00e9s\u00e9nek
  megfelel\u0151nek kell lennie \u00e9s rendszeres id\u0151k\u00f6z\u00f6nk\u00e9nt
  el kell v\u00e9gezni rajtuk a megfelel\u0151 karbantart\u00e1st.\\n6. Minden j\u00e1rm\u0171vezet\u0151
  k\u00f6teles a j\u00e1rm\u0171v\u00e9t naponta ellen\u0151rizni. Ennek sor\u00e1n
  ellen\u0151riznie kell a gumiabroncsokat, f\u00e9keket, f\u00e9nysz\u00f3r\u00f3kat,
  k\u00fcrt\u00f6t, t\u00fckr\u00f6ket, tolat\u00e1sjelz\u0151t \u00e9s a villog\u00f3
  f\u00e9nyeket. A vizsg\u00e1lat eredm\u00e9ny\u00e9t \u2013 a j\u00e1rm\u0171re
  vonatkoz\u00f3 szab\u00e1lyoz\u00e1sok alapj\u00e1n - a m\u0171szaknapl\u00f3ban
  (pl. emel\u0151g\u00e9p napl\u00f3) dokument\u00e1lni kell.\\n7. Minden j\u00e1rm\u0171vet
  a helysz\u00ednen \u00e9rv\u00e9nyes sebess\u00e9gkorl\u00e1toz\u00e1s betart\u00e1s\u00e1val
  kell vezetni, az \u00e1ltal\u00e1nos k\u00f6r\u00fclm\u00e9nyek figyelembev\u00e9tel\u00e9vel.\\n8.
  Azon munkag\u00e9pekn\u00e9l, g\u00e9pmozg\u00e1sokn\u00e1l, amelyekn\u00e9l a vezet\u0151
  csak korl\u00e1tozottan l\u00e1tja a munkater\u00fcletet illetve a k\u00f6rnyezet\u00e9ben
  munkav\u00e9gz\u00e9s t\u00f6rt\u00e9nik, tolat\u00e1sjelz\u00e9st /csipog\u00f3
  hangjelz\u0151t/ kell haszn\u00e1lni, illetve k\u00fcls\u0151 ir\u00e1ny\u00edt\u00f3t
  kell biztos\u00edtani a j\u00e1rm\u0171 mozg\u00e1s\u00e1hoz.\\n\\nC16 Zajok \u00e9s
  rezg\u00e9sek\\n\\n1. A magas zajszint\u0171 felszerel\u00e9seket, pl.: \u00e1ramfejleszt\u0151
  vagy kompresszor, fel kell szerelni hangtomp\u00edt\u00f3 bor\u00edt\u00e1ssal,
  vagy az emberekt\u0151l, lakott ter\u00fcletekt\u0151l t\u00e1volabb kell elhelyezni.\\n2.
  Ha a dolgoz\u00f3k val\u00f3sz\u00edn\u0171leg 80 dB(A)-n\u00e9l magasabb zajszintnek
  lesznek kit\u00e9ve a helysz\u00ednen, akkor f\u00fclv\u00e9d\u0151 felszerel\u00e9st
  kell hordaniuk.\\n3. Megfelel\u0151 vesz\u00e9lyjelz\u0151 t\u00e1bl\u00e1kat kell
  elhelyezni a helysz\u00ednen, ahol ilyen magas zajszint tal\u00e1lhat\u00f3.\\n4.
  Ha ilyen v\u00e9delmet kell biztos\u00edtani, akkor a dolgoz\u00f3knak be kell mutatni
  annak haszn\u00e1lat\u00e1t \u00e9s karbantart\u00e1s\u00e1t.\\n5. Ezekb\u0151l
  a v\u00e9d\u0151felszerel\u00e9sekb\u0151l megfelel\u0151 mennyis\u00e9get kell
  tartani a helysz\u00ednen a dolgoz\u00f3k \u00e9s m\u00e1s szem\u00e9lyek, pl.:
  l\u00e1togat\u00f3k, sz\u00e1m\u00e1ra.\\n6. Rezg\u00e9scsillap\u00edt\u00f3kat
  \u00e9s/vagy keszty\u0171t kell haszn\u00e1lni a t\u00falzott rezg\u00e9ssel j\u00e1r\u00f3
  munka v\u00e9gz\u00e9se k\u00f6zben.\\n7. Az \u00e9p\u00edt\u00e9si tev\u00e9kenys\u00e9g
  megkezd\u00e9se el\u0151tt ismerje meg a helyi k\u00f6rnyezeti zaj szab\u00e1lyoz\u00e1st
  \u00e9s k\u00f6vesse azt.\\n8. Minden bels\u0151\u00e9g\u00e9s\u0171 motorral rendelkez\u0151
  \u00e9p\u00edt\u00e9si berendez\u00e9st kipufog\u00f3dobbal kell felszerelni.  Meg
  kell tenni minden elv\u00e1rhat\u00f3 er\u0151fesz\u00edt\u00e9st, hogy az \u00e9p\u00edt\u00e9si
  munk\u00e1k olyan id\u0151ben t\u00f6rt\u00e9njenek, amikor a k\u00f6rnyezetet a
  lehet\u0151 legkisebb m\u00e9rt\u00e9kben zavarj\u00e1k.\\n\\nC17. Egy\u00e9ni v\u00e9d\u0151eszk\u00f6z\u00f6k
  (Ev)\\n\\n1. A helysz\u00edni t\u00e1j\u00e9koztat\u00e1sban r\u00e9szletesen ismertetni
  kell, hogy pontosan milyen Ev-et kell hordani \u00e9s hol. A helysz\u00edn Ev k\u00f6vetelm\u00e9nyeit
  fel kell t\u00fcntetni a helysz\u00edni t\u00e1j\u00e9koztat\u00f3t\u00e1bl\u00e1n,
  ami a helysz\u00edn bej\u00e1rat\u00e1n\u00e1l van elhelyezve.\\n2. A helysz\u00ednen
  tart\u00f3zkod\u00f3 szem\u00e9lyek k\u00f6telesek mindenkor v\u00e9d\u0151bakancsot/cip\u0151t
  hordani (minim\u00e1lis elv\u00e1r\u00e1s: orrmerev\u00edt\u00e9s, \u00e1tsz\u00far\u00e1s
  biztos, olaj\u00e1ll\u00f3, cs\u00fasz\u00e1smentes\u00edtett)\\n3. A helysz\u00ednen
  tart\u00f3zkod\u00f3 szem\u00e9lyek k\u00f6telesek v\u00e9d\u0151sisakot hordani,
  amennyiben a helysz\u00ednen magasban t\u00f6rt\u00e9n\u0151 munk\u00e1t v\u00e9geznek,
  \u00e9s amikor magasban v\u00e9gzett munka\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nmiatt
  kock\u00e1zat \u00e1ll fenn a helysz\u00edn b\u00e1rmely r\u00e9sz\u00e9n.\\n4.
  A helysz\u00ednen dolgoz\u00f3k k\u00f6telesek l\u00e1that\u00f3s\u00e1gi mell\u00e9nyt
  vagy kab\u00e1tot hordani, a l\u00e1that\u00f3s\u00e1guk \u00e9rdek\u00e9ben az
  aktu\u00e1lis kock\u00e1zatokt\u00f3l f\u00fcgg\u0151en (pl. hajnali, sz\u00fcrk\u00fcleti,
  \u00e9jszakai munkav\u00e9gz\u00e9s, emel\u00e9si z\u00f3na, kritikus folyamat ir\u00e1ny\u00edt\u00f3ja
  \u2013 emel\u00e9sir\u00e1ny\u00edt\u00f3, munkav\u00e9gz\u00e9s k\u00f6z\u00fat
  mellett).\\n5. A kock\u00e1zat\u00e9rt\u00e9kel\u00e9sben meg kell hat\u00e1rozni,
  hogy sz\u00fcks\u00e9ges-e tov\u00e1bbi Ev, mint pl.: v\u00e9d\u0151szem\u00fcveg,
  f\u00fclv\u00e9d\u0151, l\u00e9gz\u00e9sv\u00e9delem, kezesl\u00e1bas, keszty\u0171k
  \u00e9s t\u00e9rdv\u00e9d\u0151k, stb. Amennyiben igen, akkor azt biztos\u00edtani
  \u00e9s viselni kell.\\n6. A helysz\u00ednen megfelel\u0151 mennyis\u00e9g\u0171
  Egy\u00e9ni v\u00e9d\u0151felszerel\u00e9st (Ev) kell tartani a l\u00e1togat\u00f3k
  sz\u00e1m\u00e1ra.\\n\\nC18. Munkav\u00e9delmi t\u00e1bl\u00e1k\\n\\nA helysz\u00edn
  fel\u00e9p\u00edt\u00e9se hat\u00e1rozza meg, hogy milyen t\u00e1bl\u00e1kra van
  sz\u00fcks\u00e9g. A t\u00e1bl\u00e1kat n\u00e9gy alapvet\u0151 kateg\u00f3ri\u00e1ban
  kell biztos\u00edtani:\\n\\n1. Biztons\u00e1gi jelz\u00e9sek - ezek a t\u00e1bl\u00e1k
  a biztons\u00e1gi felt\u00e9teleket jel\u00f6lik, lehetnek sz\u00f6gletesek vagy
  n\u00e9gyzet alak\u00faak, \u00e9s \u00e1ltal\u00e1ban a t\u0171z eset\u00e9n haszn\u00e1land\u00f3
  menek\u00fcl\u00e9si \u00fatvonalak jel\u00f6l\u00e9s\u00e9re szolg\u00e1lnak, emellett
  jel\u00f6lhetnek els\u0151seg\u00e9lyny\u00fajt\u00f3 helyet, biztons\u00e1gi zuhanyt,
  stb. \u00c1ltal\u00e1ban z\u00f6ld.\\n2. Tilt\u00f3-t\u00e1bl\u00e1k, ezek a t\u00e1bl\u00e1k
  megtiltanak egy olyan tev\u00e9kenys\u00e9get vagy viselked\u00e9st, ami val\u00f3sz\u00edn\u0171leg
  vesz\u00e9lyt okozna. K\u00f6r alak\u00faak, a t\u00e1bl\u00e1n fekete \u00e1bra
  l\u00e1that\u00f3 feh\u00e9r h\u00e1tt\u00e9r el\u0151tt, a t\u00e1bla sz\u00e9l\u00e9n
  piros k\u00f6rvonal van \u00e9s a t\u00e1bla piros vonallal \u00e1t van h\u00fazva.\\n3.
  Vesz\u00e9ly-t\u00e1bl\u00e1k, ezek a t\u00e1bl\u00e1k egy adott vesz\u00e9lyre
  figyelmeztetnek, h\u00e1romsz\u00f6g alak\u00faak, fekete \u00e1bra s\u00e1rga h\u00e1tt\u00e9r
  el\u0151tt, a t\u00e1bl\u00e1k sz\u00e9l\u00e9n fekete k\u00f6rvonal l\u00e1that\u00f3.\\n4.
  K\u00f6telez\u0151en elhelyezend\u0151 t\u00e1bl\u00e1k, amelyek felt\u00fcntetik
  a betartand\u00f3 k\u00f6vetelm\u00e9nyeket. Ezek k\u00f6r alak\u00faak \u00e9s
  feh\u00e9r \u00e1bra l\u00e1that\u00f3 rajtuk k\u00e9k h\u00e1tt\u00e9r el\u0151tt.\\n\\nC19.
  \u00dczem \u00e9s felszerel\u00e9s ellen\u0151rz\u00e9se\\n\\nBiztos\u00edtsa az
  \u00fczem \u00e9s a felszerel\u00e9s rendszeres ellen\u0151rz\u00e9s\u00e9t \u00e9s
  vizsg\u00e1lat\u00e1t, ezt szak\u00e9rt\u0151 v\u00e9gezze el. A vizsg\u00e1latokr\u00f3l
  \u00e9s ellen\u0151rz\u00e9sekr\u0151l jegyz\u0151k\u00f6nyvet kell k\u00e9sz\u00edteni.\\n\\nA
  vizsg\u00e1latok \u00e9s ellen\u0151rz\u00e9sek gyakoris\u00e1g\u00e1t a sz\u00e1ll\u00edt\u00f3/gy\u00e1rt\u00f3,
  vagy jogszab\u00e1ly/szabv\u00e1ny hat\u00e1rozza meg.\\n\\nC20. Magasban v\u00e9gzett
  munka\\n\\nA magasban v\u00e9gzett munk\u00e1t ker\u00fclni kell, amennyiben csak
  lehets\u00e9ges. Amennyiben ez nem megoldhat\u00f3, a k\u00f6vetkez\u0151k el\u0151\u00edr\u00e1sok
  vonatkoznak r\u00e1:\\n\\n\u00c1llv\u00e1ny\\n\\n1. Az \u00e1llv\u00e1nyt egy megfelel\u0151
  jogosults\u00e1ggal rendelkez\u0151 szakk\u00e9pzett szem\u00e9ly tervezheti meg,
  \u00e9p\u00edtheti fel. Ki\u00e9p\u00edt\u00e9s ut\u00e1n \u00fczembe kell helyezni
  \u00e9s jel\u00f6lni kell rajta, hogy \u00e1tesett-e az ellen\u0151rz\u00e9sen /\u00e9s
  a tov\u00e1bbiakban rendszeresen kell ellen\u0151rizni/.\\n2. A talajon fel\u00e1ll\u00edtott
  \u00e1llv\u00e1nynak rendelkeznie kell megfelel\u0151 talpal\u00e1ssal a teher megtart\u00e1s\u00e1hoz.\\n\\nAmennyiben
  jogszab\u00e1ly/szabv\u00e1ny m\u00e1sk\u00e9nt nem rendelkezik:\\n\\n3. A tart\u00f3oszlopok
  (fel\u00e1ll\u00edtva) legyenek f\u00fcgg\u0151legesek \u00e9s a k\u00f6z\u00f6tt\u00fck
  l\u00e9v\u0151 t\u00e1vols\u00e1g 2.1 m legyen, a f\u00fcgg\u0151leges \u00e9s v\u00edzszintes
  illeszt\u00e9sek legyenek l\u00e9pcs\u0151sen eltolva.\\n4. A j\u00e1r\u00f3padozatokat
  tart\u00f3 keresztgerend\u00e1kat egym\u00e1st\u00f3l <1.2 m t\u00e1vols\u00e1gra
  kell elhelyezni.\\n5. A munkapadozat legal\u00e1bb 600 mm sz\u00e9les legyen \u00e9s
  rendelkezzen megfelel\u0151 al\u00e1t\u00e1maszt\u00e1ssal.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\n6.
  Az \u00e1llv\u00e1nyok f\u00e9mb\u0151l k\u00e9sz\u00fclt cs\u00f6vek \u00e9s szerelv\u00e9nyek
  felhaszn\u00e1l\u00e1s\u00e1val legyenek kialak\u00edtva.\\n7. A fa lapok legyenek
  s\u00e9rtetlen anyagb\u00f3l \u00e9s megfelel\u0151 tart\u00f3er\u0151vel rendelkezzenek.\\n8.
  L\u00e1bdeszk\u00e1kat kell felszerelni \u00e9s r\u00f6gz\u00edteni, amelyek legal\u00e1bb
  150 mm magasak legyenek.\\n9. A v\u00e9d\u0151korl\u00e1tokat a munkapadozatt\u00f3l
  950 mm-re \u00e9s 470 mm-re kell elhelyezni.\\n10. Az \u00e1llv\u00e1nyzatnak rendelkeznie
  kell megfelel\u0151 merev\u00edt\u00e9ssel \u00e9s megfelel\u0151 t\u00e1vols\u00e1gokban
  ki kell k\u00f6tni (legal\u00e1bb 1 k\u00f6t\u00e9s 32 m 2 k\u00e9nt).\\n11. Az
  \u00e1llv\u00e1nyoknak b\u00edrniuk kell a v\u00e1rhat\u00f3 terhel\u00e9st \u00e9s
  figyelembe kell venni a sz\u00e9lterhel\u00e9st is.\\n12.Az \u00e1llv\u00e1nyokat
  \u00e1t kell vizsg\u00e1lni a haszn\u00e1lat el\u0151tt, b\u00e1rmilyen v\u00e1ltoztat\u00e1s
  ut\u00e1n. 7 naponta mindenk\u00e9ppen dokument\u00e1lt ellen\u0151rz\u00e9s sz\u00fcks\u00e9ges.\\n\\nTov\u00e1bbi
  el\u0151\u00edr\u00e1sok mobil \u00e1llv\u00e1nyokhoz:\\n\\n1. A mobil \u00e1llv\u00e1nyokat
  egy szakk\u00e9pzett szem\u00e9lynek a gy\u00e1rt\u00f3 utas\u00edt\u00e1sai szerint
  kell \u00f6sszeszerelnie, \u00e9s jel\u00f6lni kell rajtuk, hogy biztons\u00e1gosan
  haszn\u00e1lhat\u00f3ak.\\n2. A mobil\u00e1llv\u00e1nyok magass\u00e1g-alap ar\u00e1nya
  nem haladhatja meg a 3:1-t.\\n3. A kerekeket \u00e9s a t\u00e1maszt\u00f3 talpakat
  le kell f\u00e9kezni.\\n4. Biztos\u00edtani kell egy biztons\u00e1gos hozz\u00e1f\u00e9r\u00e9si
  m\u00f3dot, pl.: bels\u0151 l\u00e9tra.\\n5. A mobil \u00e1llv\u00e1ny mozgat\u00e1sakor
  figyeljen a fels\u0151 villanyvezet\u00e9kekre, \u00e9s\\n6. ellen\u0151rizze, hogy
  a f\u00f6ldben semmilyen lyuk vagy g\u00f6d\u00f6r nincsen, mozgat\u00e1s k\u00f6zben
  az \u00e1llv\u00e1nyon senki sem tart\u00f3zkodhat.\\n\\nOll\u00f3s emel\u0151kosarak/Mobil
  emelhet\u0151 munka\u00e1llv\u00e1nyok (MEWP)\\n\\n1. A kosarat megfelel\u0151 v\u00e9d\u0151korl\u00e1ttal
  \u00e9s l\u00e1bdeszk\u00e1val kell felszerelni;\\n2. A MEWP rendelkezzen t\u00e1maszt\u00f3
  talpakkal, terhel\u00e9s oszt\u00f3 al\u00e1t\u00e9tekkel.\\n3. A MEWP rendelkezzen
  megfelel\u0151 r\u00f6gz\u00edt\u00e9si pontokkal, ahova a r\u00f6gz\u00edt\u0151k\u00f6teleket
  lehet er\u0151s\u00edteni.\\n4. A g\u00e9pen tart\u00f3zkod\u00f3 szem\u00e9lyek
  folyamatosan haszn\u00e1ljanak megfelel\u0151 zuhan\u00e1s-g\u00e1tl\u00f3 felszerel\u00e9st.\\n5.
  A g\u00e9pkezel\u0151knek rendelkeznie kell a biztons\u00e1gos kezel\u00e9shez sz\u00fcks\u00e9ges
  k\u00e9pz\u00e9ssel \u00e9s \u00edr\u00e1sos kezel\u00e9si enged\u00e9llyel.\\n6.
  Meg kell tenni az el\u0151k\u00e9sz\u00fcleteket a v\u00e9szhelyzet eseti ment\u00e9shez.\\n\\nGyenge
  tet\u0151 \u00e9s tet\u0151ny\u00edl\u00e1sok\\n\\n1. Biztons\u00e1gos hozz\u00e1f\u00e9r\u00e9si
  lehet\u0151s\u00e9get kell biztos\u00edtani a tet\u0151 ter\u00fclethez.\\n2. Padozatot
  vagy fed\u0151ket kell biztos\u00edtani \u00e9s haszn\u00e1lni a tet\u0151n dolgoz\u00f3
  szem\u00e9lyek s\u00faly\u00e1nak megtart\u00e1s\u00e1hoz.\\n3. Szereljen fel v\u00e9d\u0151korl\u00e1tot
  a gyenge tet\u0151n kereszt\u00fcli es\u00e9sek elker\u00fcl\u00e9s\u00e9re. Amennyiben
  ez nem megval\u00f3s\u00edthat\u00f3, akkor biztons\u00e1gi hevedereket/k\u00f6telet
  \u00e9s biztos\u00edt\u00f3k\u00f6telet kell haszn\u00e1lni. Biztons\u00e1gi h\u00e1l\u00f3t
  is lehet haszn\u00e1lni.\\n\\nPadl\u00f3ny\u00edl\u00e1sok\\n\\n1. Minden oldalr\u00f3l
  v\u00e9d\u0151korl\u00e1ttal kell k\u00f6r\u00fclvenni, vagy megfelel\u0151 er\u0151ss\u00e9g\u0171
  fed\u0151vel kell lefedni.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nC21.
  Lebont\u00e1s\\n\\nMinden bont\u00e1si munka el\u0151tt kock\u00e1zati \u00e9rt\u00e9kel\u00e9st
  kell v\u00e9gezni, \u00e9s \u00edr\u00e1sos m\u00f3dszertani nyilatkozatot kell
  k\u00fcldeni az ABB munkav\u00e9delmi koordin\u00e1tor\u00e1nak, ellen\u0151rz\u00e9s
  c\u00e9lj\u00e1b\u00f3l.\\n\\nC22. Orsz\u00e1g\u00fati munkav\u00e9gz\u00e9s\\n\\nMinden
  k\u00f6z\u00faton/orsz\u00e1g\u00faton v\u00e9gzett munka el\u0151tt kock\u00e1zati
  \u00e9rt\u00e9kel\u00e9st kell k\u00e9sz\u00edteni, \u00e9s \u00edr\u00e1sos m\u00f3dszertani
  nyilatkozatot kell k\u00fcldeni az ABB k\u00e9pvisel\u0151j\u00e9nek, j\u00f3v\u00e1hagy\u00e1s
  c\u00e9lj\u00e1b\u00f3l. A m\u00f3dszertani nyilatkozatnak r\u00e9szleteznie kell
  a szab\u00e1lyz\u00e1st, bele\u00e9rtve a sebess\u00e9gkorl\u00e1toz\u00e1sokat,
  figyelmeztet\u0151 t\u00e1bl\u00e1k \u00e9s terel\u0151b\u00f3j\u00e1k elhelyez\u00e9s\u00e9t,
  az elv\u00e1laszt\u00e1shoz haszn\u00e1lt felszerel\u00e9st \u00e9s annak t\u00edpus\u00e1t.
  Ahol jelent\u0151s k\u00f6z\u00fati balesetvesz\u00e9ly \u00e1ll fenn, ott j\u00e1rm\u0171
  \u00fctk\u00f6z\u0151t\u00f6mb\u00f6ket is el kell helyezni. A munkav\u00e1llal\u00f3knak
  a l\u00e1that\u00f3s\u00e1gi mell\u00e9nyt kell viselni\u00fck.\\n\\nC23. Munkav\u00e9delem
  a hevederek \u00e9s ideiglenes biztos\u00edt\u00f3k\u00f6telek haszn\u00e1lat\u00e1val\\n\\nAmennyiben
  a jogszab\u00e1lyok/szabv\u00e1nyok m\u00e1sk\u00e9nt nem rendelkeznek:\\n\\n1.
  Heveder: \u00f6sszetev\u0151inek k\u00e9pesnek kell lennie 22.2 kN nagys\u00e1g\u00fa
  szak\u00edt\u00e1si terhel\u00e9st elviselni, reped\u00e9s, szakad\u00e1s \u00e9s
  v\u00e9gleges anyagv\u00e1ltoz\u00e1s n\u00e9lk\u00fcl.\\n2. R\u00f6gz\u00edt\u0151k\u00f6t\u00e9l:
  A r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l lehet k\u00f6t\u00e9l vagy \u00fctk\u00f6z\u00e9selnyel\u0151
  h\u00e1l\u00f3s r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l, a hossza nem haladhatja meg
  az 1.8 m-t. A r\u00f6gz\u00edt\u0151 k\u00f6t\u00e9l \u00e9s minden m\u00e1s zuhan\u00e1sg\u00e1tl\u00f3
  rendszer szak\u00edt\u00f3szil\u00e1rds\u00e1g\u00e1nak legal\u00e1bb 22.2 kN-nak
  kell lennie. Automata z\u00e1r\u00f3d\u00e1s\u00fa kamp\u00f3kat kell haszn\u00e1lni
  a r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l hevederhez csatlakoztat\u00e1s\u00e1hoz.\\n3.
  A r\u00f6z\u00edt\u0151k\u00f6t\u00e9l lehet \u00f6nfelteker\u0151, \u00edgy szabad
  mozg\u00e1st tesz lehet\u0151v\u00e9, de megv\u00e9di a dolgoz\u00f3t, ha az leesne.\\n4.
  Az energiaelnyel\u0151 r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l jelent\u0151sen lecs\u00f6kkenti
  az es\u00e9s k\u00f6zben keletkez\u0151 er\u0151t. A r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l
  legnagyobb kiny\u00fal\u00e1sa es\u00e9s megakad\u00e1lyoz\u00e1sa k\u00f6zben nem
  lehet t\u00f6bb 1.06 mn\u00e9l.\\n5. Biztos\u00edt\u00f3k\u00f6t\u00e9l: A biztos\u00edt\u00f3k\u00f6t\u00e9l
  lehet v\u00edzszintes vagy f\u00fcgg\u0151leges, \u00e9s legal\u00e1bb 22.3kN-os
  szak\u00edt\u00f3szil\u00e1rds\u00e1ggal kell rendelkeznie. A f\u00fcgg\u0151leges
  biztos\u00edt\u00f3k\u00f6telet egyszerre csak egy dolgoz\u00f3 haszn\u00e1lhatja.\\n6.
  Cs\u00fasz\u00f3z\u00e1r: A dolgoz\u00f3 a biztos\u00edt\u00f3k\u00f6t\u00e9lhez
  kapcsol\u00f3dhat egy cs\u00fasz\u00f3z\u00e1rral vagy cs\u00fasz\u00f3z\u00e1r
  \u00e9s r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l kombin\u00e1ci\u00f3j\u00e1val. A
  r\u00f6gz\u00edt\u0151k\u00f6t\u00e9l nem lehet hosszabb 1.8m-n\u00e9l, hogy a teljes
  zuhan\u00e1st 1.8m-re vagy kevesebbre korl\u00e1tozza. A biztos\u00edt\u00f3k\u00f6t\u00e9l
  m\u00e9ret\u00e9t a cs\u00fasz\u00f3z\u00e1rra kell pecs\u00e9telni, \u00e9s csak
  ez a fajta \u00e9s m\u00e9ret\u0171 biztos\u00edt\u00f3k\u00f6t\u00e9l haszn\u00e1lhat\u00f3\\n7.
  R\u00f6gz\u00edt\u00e9si pont: A zuhan\u00e1sg\u00e1tl\u00f3 rendszer er\u0151ss\u00e9ge
  a biztons\u00e1gi r\u00f6gz\u00edt\u00e9si pontokt\u00f3l f\u00fcgg. A r\u00f6gz\u00edt\u00e9si
  pontnak el kell viselnie legal\u00e1bb 22.2kN-t a k\u00f6t\u00e9lhez k\u00f6t\u00f6tt
  dolgoz\u00f3nk\u00e9nt, vagy 2:1 biztons\u00e1gi t\u00e9nyez\u0151vel kell megtervezni.\\n8.
  R\u00f6gz\u00edt\u00e9s: A r\u00f6gz\u00edt\u00e9si pontoknak a lehet\u0151 legmagasabban
  kell lenni\u00fck, de soha nem lehetnek a heveder csatlakoz\u00e1si pontjai alatt.
  A dolgoz\u00f3kat olyan m\u00f3don kell kik\u00f6tni, hogy es\u00e9s k\u00f6zben
  ne \u00e9rhessenek als\u00f3bb szinthez vagy m\u00e1s fel\u00fclethez.\\n9. K\u00e9pz\u00e9s
  \u00e9s ellen\u0151rz\u00e9s: Minden zuhan\u00e1sg\u00e1tl\u00f3 rendszert haszn\u00e1l\u00f3
  szem\u00e9lynek k\u00e9pzettnek kell lennie a rendszer biztons\u00e1gos haszn\u00e1lat\u00e1ban,
  bele\u00e9rtve: helyes r\u00f6gz\u00edt\u00e9s, visel\u00e9s, ellen\u0151rz\u00e9s,
  rendszer korl\u00e1tai, \u00e9s a rendszer karbantart\u00e1sa. A zuhan\u00e1sg\u00e1tl\u00f3
  rendszereket meg kell vizsg\u00e1lni a haszn\u00e1latuk el\u0151tt, \u00e9s a gy\u00e1rt\u00f3
  \u00e1ltal meghat\u00e1rozott id\u0151szakonk\u00e9nt.\\n10. Ment\u00e9s: A zuhan\u00e1sg\u00e1tl\u00f3
  rendszer haszn\u00e1lata el\u0151tt ki kell alak\u00edtani egy v\u00e9szhelyzeti
  ment\u00e9s elj\u00e1r\u00e1st, amely tartalmazza az \u00f6nment\u00e9st, a k\u00fcls\u0151
  szolg\u00e1ltat\u00e1sokat, \u00e9s a helysz\u00edni ment\u00e9st. Az elj\u00e1r\u00e1snak
  ki kell jel\u00f6lnie a ment\u00e9shez haszn\u00e1lt felszerel\u00e9seket, \u00e9rtes\u00edt\u00e9si
  elj\u00e1r\u00e1sokat, seg\u00e9lyny\u00fajt\u00f3 szolg\u00e1ltat\u00e1sok telefonsz\u00e1mait
  \u00e9s a felel\u0151s szem\u00e9lyeket.\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nC24.
  Vezet\u00e9si \u00e9s sz\u00e1ll\u00edt\u00e1si biztons\u00e1g\\n\\nEz a v\u00e1llalkoz\u00f3
  \u00e1ltal a dolgoz\u00f3k sz\u00e1ll\u00edt\u00e1s\u00e1ra (helysz\u00ednre/helysz\u00ednr\u0151l)
  haszn\u00e1lt j\u00e1rm\u0171vekre vonatkozik.\\n\\nAz ig\u00e9nybe vett j\u00e1rm\u0171vek
  eset\u00e9n\\n\\n1. Biztos\u00edtsa, hogy az \u00f6sszes j\u00e1rm\u0171 megfelel
  a tervezett felhaszn\u00e1l\u00e1s\u00e1ra.\\n2. Biztos\u00edtsa, hogy az \u00f6sszes
  j\u00e1rm\u0171 \u00e9s r\u00f6gz\u00edt\u00e9s megfelel a vonatkoz\u00f3 biztons\u00e1gi
  szabv\u00e1nyoknak \u00e9s t\u00f6rv\u00e9nyeknek.\\n3. Biztos\u00edtsa, hogy az
  \u00f6sszes j\u00e1rm\u0171 megfelel\u0151en \u00e1t lett vizsg\u00e1lva \u00e9s
  karban van tartva.\\n4. Biztos\u00edtsa, hogy a j\u00e1rm\u0171vek rendelkeznek
  az els\u0151 \u00e9s h\u00e1ts\u00f3 \u00fcl\u00e9sekn\u00e9l is biztons\u00e1gi
  \u00f6vvel.\\n5. Biztos\u00edtsa, hogy az \u00f6sszes j\u00e1rm\u0171n\u00e9l biztos\u00edt\u00e1st
  k\u00f6t\u00f6tt a vezet\u0151re, utasokra, a j\u00e1rm\u0171 s\u00e9r\u00fcl\u00e9s\u00e9re
  \u00e9s harmadik szem\u00e9ly s\u00e9r\u00fcl\u00e9s\u00e9re.\\n6. A j\u00e1rm\u0171vekben
  helyezzen el t\u0171zolt\u00f3 k\u00e9sz\u00fcl\u00e9ket \u00e9s els\u0151seg\u00e9lyny\u00fajt\u00f3
  csomagot.\\n7. Csak kifejezetten szem\u00e9lysz\u00e1ll\u00edt\u00e1sra tervezett
  j\u00e1rm\u0171vekkel lehet a dolgoz\u00f3kat sz\u00e1ll\u00edtani, pl.: kisbusz,
  aut\u00f3busz, stb.\\n8. V\u00e1szontet\u0151 nem sz\u00fcks\u00e9ges, mivel az
  ABB kifejezetten megtiltja az alkalmazottak j\u00e1rm\u0171 h\u00e1tulj\u00e1ban
  val\u00f3 sz\u00e1ll\u00edt\u00e1s\u00e1t. A v\u00e1szontet\u0151 kiz\u00e1r\u00f3lagosan
  a sz\u00e1ll\u00edtott \u00e1ruk es\u0151, stb. elleni v\u00e9delme miatt haszn\u00e1lhat\u00f3.\\n\\nA
  j\u00e1rm\u0171 vezet\u0151je \u00e9s utasai\\n\\n1. A vezet\u0151 tartsa be az
  \u00f6sszes helyi k\u00f6zleked\u00e9si el\u0151\u00edr\u00e1st \u00e9s a helysz\u00ednen
  meghat\u00e1rozott sebess\u00e9gkorl\u00e1toz\u00e1st.\\n2. A j\u00e1rm\u0171 minden
  utasa k\u00f6teles a biztons\u00e1gi \u00f6vet bek\u00f6tni.\\n3. A j\u00e1rm\u0171
  vezet\u0151je csak a j\u00e1rm\u0171kateg\u00f3ria m\u0171k\u00f6dtet\u00e9s\u00e9re
  megfelel\u0151en k\u00e9pzett, enged\u00e9lyezett \u00e9s eg\u00e9szs\u00e9g\u00fcgyileg
  alkalmas szem\u00e9ly lehet.\\n4. Tilos a vezet\u00e9s alkohol vagy gy\u00f3gyszerek
  befoly\u00e1sa alatt, illetve f\u00e1radt \u00e1llapotban.\\n5. Vezet\u00e9s k\u00f6zben
  tilos a k\u00e9zi (mobil)telefon vagy r\u00e1di\u00f3 haszn\u00e1lata.\\n6. K\u00f6vesse
  a j\u00e1rm\u0171 biztons\u00e1gos \u00fczemeltet\u00e9s\u00e9hez \u00e9s karbantart\u00e1s\u00e1hoz
  sz\u00fcks\u00e9ges elj\u00e1r\u00e1sokat;\\n7. A gy\u00e1rt\u00f3 \u00e1ltal meghat\u00e1rozott
  utassz\u00e1mot \u00e9s terhel\u00e9si hat\u00e1rt ne l\u00e9pje t\u00fal.\\n8.
  A j\u00e1rm\u0171veket a haszn\u00e1lat/m\u0171szak kezdete el\u0151tt ellen\u0151rizni
  kell, ezzel biztos\u00edtva, hogy az \u00f6sszes alkatr\u00e9sz, felszerel\u00e9s
  \u00e9s tartoz\u00e9k a biztons\u00e1gos m\u0171k\u00f6d\u00e9shez megfelel\u0151
  \u00e1llapotban van \u00e9s olyan szemmel l\u00e1that\u00f3 s\u00e9r\u00fcl\u00e9s
  nem tal\u00e1lhat\u00f3 rajtuk, ami meghib\u00e1sod\u00e1st, s\u00e9r\u00fcl\u00e9st
  vagy k\u00f6rnyezeti k\u00e1rt okozhatna m\u0171k\u00f6d\u00e9s k\u00f6zben.\\n\\nC25.
  Els\u0151seg\u00e9ly \u00e9s v\u00e9szhelyzeti eg\u00e9szs\u00e9g\u00fcgyi ell\u00e1t\u00e1s\\n\\n1.
  Minim\u00e1lis ell\u00e1t\u00e1si id\u0151\\n\\nMeg kell tenni a sz\u00fcks\u00e9ges
  int\u00e9zked\u00e9seket, hogy:\\n\\n(a) a s\u00e9r\u00fclt szem\u00e9lyt a balesetet
  k\u00f6vet\u0151 5 percen bel\u00fcl els\u0151seg\u00e9lyny\u00fajt\u00e1si k\u00e9pz\u00e9ssel
  rendelkez\u0151 szem\u00e9ly kezelje.\\n(b) s\u00falyos s\u00e9r\u00fcl\u00e9s eset\u00e9n
  a s\u00e9r\u00fcltet egy \u00f3r\u00e1n bel\u00fcl eg\u00e9szs\u00e9g\u00fcgyi szakember
  kezelje.\\n\\nEz \u00e1ltal\u00e1ban korh\u00e1zban t\u00f6rt\u00e9nik, vagy m\u00e1s
  megfelel\u0151eg\u00e9szs\u00e9g\u00fcgyi k\u00f6zpontban.\\n\\nMeg kell \u00e1llap\u00edtani
  a ment\u00e9si id\u0151t a tender el\u0151k\u00e9sz\u00edt\u00e9se (aj\u00e1nlatad\u00e1s
  el\u0151k\u00e9sz\u00edt\u00e9sei) \u00e9s a helysz\u00edni mozg\u00f3s\u00edt\u00e1s
  f\u00e1zisokban. A t\u00e1voli helysz\u00edneken a s\u00falyosan s\u00e9r\u00fclt
  szem\u00e9ly eset\u00e9n el\u0151\u00edrt ell\u00e1t\u00e1si id\u0151 el\u00e9r\u00e9s\u00e9hez
  lehets\u00e9ges, hogy tov\u00e1bbi eg\u00e9szs\u00e9g\u00fcgyi el\u0151k\u00e9sz\u00fcleteket
  kell megtenni a helysz\u00ednen, bele\u00e9rtve:\\n\\n(a) Ment\u0151aut\u00f3 vagy
  m\u00e1s teljes hossz\u00fas\u00e1g\u00fa hord\u00e1gyat befogadni k\u00e9pes j\u00e1rm\u0171\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
  L\u00e9tes\u00edt\u00e9si/Szerel\u00e9si\\n\\nABB referencia sz\u00e1m:\\n\\nMunkav\u00e9delmi
  mell\u00e9klet\\n\\nKi\u00e1ll\u00edt\u00e1s d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2.
  v\u00e1lt.  2008. november 1.\\n\\n__________________________________________________________________________________\\n\\nKi\u00e1ll\u00edt\u00e1s
  d\u00e1tuma:\\n\\nV\u00e1ltozat:  Kelt:\\n\\n3VAA100104  2. v\u00e1lt.  2008. november
  1.\\n\\n__________________________________________________________________________________\\n\\n(b)
  Orvosi szakember \u00e9s s\u00e9r\u00fcl\u00e9sell\u00e1t\u00e1shoz sz\u00fcks\u00e9ges
  felszerel\u00e9sek\\n\\n(c) Helikopteres evaku\u00e1l\u00e1s\\n\\n2. Els\u0151seg\u00e9lyny\u00fajt\u00f3
  szem\u00e9lyek sz\u00e1ma\\n\\nHa a dolgoz\u00f3k sz\u00e1ma 5-50 f\u0151, akkor
  MINDENKOR a helysz\u00ednen kell tart\u00f3zkodnia egy szakk\u00e9pzett els\u0151seg\u00e9lyny\u00fajt\u00f3
  szem\u00e9lynek.  Minden tov\u00e1bbi 50 dolgoz\u00f3hoz m\u00e9g egy els\u0151seg\u00e9lyny\u00fajt\u00f3
  szem\u00e9ly sz\u00fcks\u00e9ges.\\n\\nLehet, hogy a mell\u00e9kletben el\u0151\u00edrt
  ell\u00e1t\u00e1si id\u0151 el\u00e9r\u00e9s\u00e9hez tov\u00e1bbi els\u0151seg\u00e9lyny\u00fajt\u00e1sban
  k\u00e9pzett szem\u00e9lyekre lesz sz\u00fcks\u00e9g.  Ugyanez igaz, ha tov\u00e1bbi
  vesz\u00e9lyek \u00e9s kock\u00e1zatok \u00e1llnak fenn.\\n\\n3. A helysz\u00ednen
  l\u00e9v\u0151 els\u0151seg\u00e9lyny\u00fajt\u00f3 csomagok\\n\\n* Minden projektn\u00e9l
  \u00e9s munkater\u00fcleten legal\u00e1bb egy els\u0151seg\u00e9lyny\u00fajt\u00f3
  csomagnak lennie kell.  50 dolgoz\u00f3nk\u00e9nt tov\u00e1bbi csomagok sz\u00fcks\u00e9gesek.\\n\\n*
  Az els\u0151seg\u00e9lyny\u00fajt\u00f3 csomagoknak v\u00edz- \u00e9s por\u00e1ll\u00f3
  anyagb\u00f3l kell k\u00e9sz\u00fclni\u00fck, \u00e9s a m\u00e9ret\u00fcknek elegend\u0151nek
  kell lennie a sz\u00fcks\u00e9ges felszerel\u00e9s t\u00e1rol\u00e1s\u00e1hoz. Z\u00e1rhat\u00f3nak
  \u00e9s foganty\u00faval ell\u00e1tottnak kell lenni\u00fck a v\u00e9szhelyzet sor\u00e1n
  t\u00f6rt\u00e9n\u0151 sz\u00e1ll\u00edt\u00e1shoz.\\n\\n* Az els \u0151 seg\u00e9lyny\u00fajt\u00f3
  csomag k\u00fclsej\u00e9n egy\u00e9rtelm \u0171 en meg kell jel\u00f6lni a taralm\u00e1t,
  p\u00e9ld\u00e1ul - \u201eEls \u0151 seg\u00e9ly\u201d.\\n\\n* A csomagok tartalm\u00e1nak
  megfelel\u0151nek \u00e9s elegend\u0151nek kell lennie a helysz\u00edni k\u00f6r\u00fclm\u00e9nyekhez,
  illetve ki kell el\u00e9g\u00edteni\u00fck a vonatkoz\u00f3 jogszab\u00e1lyi/szabv\u00e1nyi
  el\u0151\u00edr\u00e1sokat.\\n\\n* A t\u00e1voli helysz\u00ednen v\u00e9gzett projektek
  eset\u00e9n fontolja meg egy automatikus elektronikus defibrill\u00e1tor (AED) beszerz\u00e9s\u00e9t.\\n\\n4.
  Az els\u0151seg\u00e9lyny\u00fajt\u00f3 szem\u00e9ly k\u00e9pz\u00e9s\u00e9t egy
  akkredit\u00e1lt k\u00e9pes\u00edt\u00e9ssel rendelkez\u0151 szervezet v\u00e9gezze.  Megfelel\u0151
  id\u0151k\u00f6z\u00f6nk\u00e9nt vegyen r\u00e9szt ismeretfriss\u00edt\u0151 k\u00e9pz\u00e9sen.\\n\\n5.
  Dolgoz\u00f3k k\u00e9pz\u00e9se \u00e9s alapvet\u0151 int\u00e9zked\u00e9sek\\n\\nA
  dolgoz\u00f3kat t\u00e1j\u00e9kozatni kell az alapvet\u0151 int\u00e9zked\u00e9sekr\u0151l:\\n\\n*
  Azonnal kezelje a s\u00e9r\u00fcltet a baleset helysz\u00edn\u00e9n.\\n\\n* Tarts\u00e1k
  szabadon a ter\u00fcletet, a dolgoz\u00f3k, ne gy\u0171ljenek a s\u00e9r\u00fclt
  k\u00f6r\u00e9.\\n\\n* Haszn\u00e1lja a VMLLK els \u0151 seg\u00e9lyny\u00fajt\u00e1si
  szab\u00e1lyokat (V-Vesz\u00e9ly, M-Ment\u00e9s, L- L\u00e9gutak, L-L\u00e9gz\u00e9s,
  K-Kering\u00e9s).\\n\\n* Azonnal h\u00edvj\u00e1k az els\u0151seg\u00e9lyny\u00fajt\u00f3
  szem\u00e9lyt/ment\u0151ket.\\n\\n* Nyugtass\u00e1k meg a s\u00e9r\u00fcltet.\\n\\n6.
  V\u00e9szhelyzet eset\u00e9n \u00e9rtes\u00edtend\u0151 szem\u00e9lyek/hat\u00f3s\u00e1gok\\n\\nEzt
  az inform\u00e1ci\u00f3t a helysz\u00ednen j\u00f3l l\u00e1that\u00f3 helyeken kell
  elhelyezni, \u00e9s minden dolgoz\u00f3val k\u00f6z\u00f6lni kell.\\n\\nTelefon/r\u00e1di\u00f3
  kapcsolat neve \u00e9s sz\u00e1ma:\\n\\nEls\u0151seg\u00e9lyny\u00fajt\u00f3 szem\u00e9ly/Eg\u00e9szs\u00e9g\u00fcgyi
  szakember: \u2026\u2026\u2026\u2026\u2026\u2026\\n\\nMent\u0151k: \u2026\u2026\u2026\u2026\u2026\u2026\\n\\nK\u00f3rh\u00e1z:
  \u2026\u2026\u2026\u2026\u2026\u2026\\n\\nF\u0151szerz\u0151d\u00e9s:\\n\\nV\u00e1llalkoz\u00f3:\\n\\n\u00c9p\u00edt\u00e9si
