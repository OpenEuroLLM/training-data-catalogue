  Dorozsmai \u00fat 5-7.\\nTelefon: 62/549-510  Fax: 62/549-511  E-mail: email@example.com\\n\\nBeton
  a szobr\u00e1szatban - szobr\u00e1szat a betonban\\n\\nCsurgai Ferenc\\n\\nA P\u00e9csi
  Tudom\u00e1nyegyetem M\u0171v\u00e9szeti Kar\u00e1nak Szobr\u00e1sz Tansz\u00e9k\u00e9n
  hagyom\u00e1nyosan tan\u00edtott \u00e9s alkalmazott szobr\u00e1szati technol\u00f3gi\u00e1k
  mel\u00e9 2002-ben ker\u00fclt bevezet\u00e9sre a beton alkalmaz\u00e1sa a m\u0171v\u00e9szkapz\u00e9sbe.
  A cikk a 2005-2006. tan\u00e9v tapasztalatait mutatja be.\\n\\nKulcsszavak: \u00f6nt\u00f6m\u00f6r\u00f6d\u0151
  beton, nagyszil\u00e1rds\u00e1g\u00fa beton, sz\u00e1ler\u0151s\u00edt\u00e9s\\n\\nAz
  \u00e9p\u00edt\u0151iparban t\u00f6bb mint sz\u00e1z \u00e9ve sz\u00e9les k\u00f6rben
  haszn\u00e1lj\u00e1k a betont. Az 1920-as \u00e9vekt\u0151l kezd\u0151d\u0151en
  a szobr\u00e1szatban is megjelent ez a technol\u00f3gia. P\u00e9ri L\u00e1szl\u00f3
  volt az els\u0151 szobr\u00e1sz, aki m\u00e1r 1920 \u00e9s 1924 k\u00f6z\u00f6tt
  k\u00e9sz\u00edtette el az els\u0151 beton szobrokat Berlinben. Az\u00f3ta a technol\u00f3gia
  \u00f3ri\u00e1si v\u00e1ltoz\u00e1son ment kereszt\u00fcl. A huszadik sz\u00e1zad
  folyam\u00e1n korszakonk\u00e9nt mindig volt v\u00e1llalkoz\u00f3 kedv\u0171 alkot\u00f3
  ember, aki a betontehnol\u00f3gia pillantnyi fejl\u0151d\u00e9s\u00e9i fok\u00e1nak
  megfelel\u0151en \u00faj szelleml\u0171 m\u0171veket hozott l\u00e9tre.\\n\\nAz
  1990-es \u00e9vek elej\u00e9t\u0151l rendk\u00edv\u00fcl gyors betontehnol\u00f3giai
  fejl\u0151d\u00e9snek lehet\u00fcnk tan\u00fai. J\u00e1b \u00e9s \u00fajabb betonk\u00e9miai
  adal\u00e9kszerek seg\u00edts\u00e9g\u00e9vel nemcsak az \u00e9p\u00edt\u00e9szek,
  hanem a szobr\u00e1szok sz\u00e1m\u00e1ra is lehet\u0151s\u00e9g ny\u00edlt arra,
  hogy a k\u00fcl\u00f6nb\u00f6z\u0151 feladatok megold\u00e1s\u00e1hoz a legmegfelel\u0151bb
  betonkever\u00e9keket el\u0151\u00e1ll\u00edthass\u00e1k.\\n\\n1984-\u00f3ta foglalkozom
  a szobrok \u00f6nt\u00e9s\u00e9re alkalmas betontehnol\u00f3gia fejleszt\u00e9s\u00e9vel.
  Ez\u00e9rt kaptam 2002-ben megb\u00edz\u00e1st a P\u00e9csi Tudom\u00e1nyegyetem
  M\u0171v\u00e9szeti Kar\u00e1n kurzus vezet\u00e9s\u00e9re. A hallgat\u00f3k k\u00f6r\u00e9ben
  hamar n\u00e9pszer\u0171v\u00e9 v\u00e1lt az \u00faj kezdem\u00e9nyez\u00e9s, hiszen
  a hagyom\u00e1nyos szobr\u00e1szati m\u00f3dszerek mellett felkellette \u00e9rdekl\u0151d\u00e9s\u00fcket
  ez a 21. sz\u00e1zadi lehet\u0151s\u00e9geket k\u00edn\u00e1l\u00f3 m\u00f3dszus.\\n\\nA
  szobr\u00e1sz tansz\u00e9ken szinte minden esetben az \u00fan. \u00f6nt\u00f6m\u00f6r\u00f6d\u0151
  nagyszil\u00e1rds\u00e1g\u00fa betont haszn\u00e1ljuk, mivel \u00fagy gondolom,
  hogy m\u0171alkot\u00e1sok l\u00e9trehoz\u00e1s\u00e1ra kem\u00e9ny, id\u0151\u00e1ll\u00f3
  anyagra van sz\u00fcks\u00e9g. A nagy kezd\u0151- \u00e9s v\u00e9gszil\u00e1rds\u00e1g
  mellett ezek az \u00faj alkot\u00f3elemekkel \u00f6sszeszets\u00fatait. Ezzel a
  technol\u00f3gi\u00e1val ak\u00e1r nagyobb m\u00e9ret\u0171, a t\u00f6m\u00f6rre
  \u00f6nt\u00f6tt szoborhoz k\u00e9pest rendk\u00edv\u00fcl k\u00f6nny\u0171 m\u0171t\u00e1rgyakat
  lehet l\u00e9trehozni.\\n\\nA 2005-2006-os tan\u00e9vben k\u00e9sz\u00fclt munk\u00e1k
  bizony\u00edtj\u00e1k, hogy ez az \u00faj technol\u00f3gia k\u00e9pes teljes\u00edteni
  az egy\u00e9ni k\u00edv\u00e1ns\u00e1gokat. A mell\u00e9kelt fot\u00f3anyag j\u00f3l
  reprezent\u00e1lja mindazt a v\u00e1ltozatoss\u00e1got, amelyeket a m\u0171vek \u00e1ltal
  megk\u00edv\u00e1nt technikai megold\u00e1sok hoztak l\u00e9tre. K\u00fcl\u00f6n\u00f6sen
  nagy eredm\u00e9nynek tartom, hogy sz\u00fclettek olyan m\u0171vek is, amelyek a
  m\u0171termi lehet\u0151s\u00e9geken t\u00fal az \u00e9p\u00edtett k\u00f6rnyezetben
  is megval\u00f3sulhatnak. Ezzel a kisplasztikai m\u00e9rett\u0151l elt\u00e1volodva
  a betontehnol\u00f3gi\u00e1ban term\u00e9szetes m\u00f3don benne l\u00e9v\u0151
  monumentalit\u00e1s fel\u00e9 ny\u00edlhatnak utak.\\n\\nFejes Istv\u00e1n k\u00eds\u00e9rletssorozat\u00e1nak
  \u00f6sszetetts\u00e9ge \u00e9vekre el\u0151re vet\u00edti az \u00faj utak keres\u00e9s\u00e9t.
  A k\u00eds\u00e9rletssorozatban a m\u0171v\u00e9szi munk\u00e1n t\u00fal az a lehet\u0151s\u00e9g
  is kirajzol\u00f3dott, hogy az \u00e9p\u00edt\u0151ipar sz\u00e1m\u00e1ra hasznos,
  ismereteim szerint eddig nem haszn\u00e1lt, egyedi formak\u00e9pz\u00e9si technol\u00f3gia
  sz\u00fcletik. Ez a fajta \u00fatkeres\u00e9s nemcsak a betonteknol\u00f3gia haszn\u00e1lat\u00e1t,
  fejleszt\u00e9s\u00e9t jelenti, hanem eleve a forma megalkot\u00e1s\u00e1t, a negat\u00edv
  megkonstru\u00e1l\u00e1s\u00e1t \u00e9s egy\u00e9ni plasztikai nyelv kialak\u00edt\u00e1s\u00e1t
  teszi lehet\u0151v\u00e9. Az agyaggal negativban t\u00f6rt\u00e9n\u0151 mint\u00e1z\u00e1s
  \u00e9s a direkt \u00f6nt\u00e9s teszik \u00e9rdekkess\u00e9 az \u0151 munk\u00e1it.\\n\\nEbben
  az \u00e9vben kapott lehet\u0151s\u00e9get Veres Bal\u00e1zs IV. \u00e9ves szobr\u00e1szhallgat\u00f3,
  hogy egyik terv\u00e9t nagy m\u00e9retben, k\u00f6zt\u00e9ren megval\u00f3s\u00edthassa.
  A kompoz\u00edci\u00f3 a Beremendi Cementgy\u00e1r szoborparkj\u00e1ban ker\u00fcl
  fel\u00e1ll\u00edt\u00e1sra. A m\u0171 komplex feladat el\u00e9 \u00e1ll\u00edtja
  a kivitelez\u0151t, mert a szobor t\u00f6bb, egym\u00e1shoz r\u00f6gz\u00edtett
  elemb\u0151l \u00e1ll, amelyek r\u00e1ad\u00e1sul elt\u00e9r\u0151 sz\u00edn\u0171ek
  (anyagukban sz\u00ednezett v\u00f6r\u00f6s ill. k\u00e9k). A v\u00f6r\u00f6s sz\u00edn\u0171
  elem oszlopszer\u0171 forma, a k\u00e9k pedig 45 mm legnagyobb falvastags\u00e1g\u00fa,
  t\u00f6bbsz\u00f6r\u00f6sen \u00e1tt\u00f6rt h\u00e9jazat.\\n\\nA kurzus indul\u00e1sa
  \u00f3ta az idei az els\u0151 \u00e9v, amikor h\u00e1rom hallgat\u00f3 a diploma
  munk\u00e1j\u00e1t a betonteknol\u00f3gia felhaszn\u00e1l\u00e1s\u00e1val alkotja
  meg. Fejes Istv\u00e1n \u00e9s P\u00e9csi T\u00fcnde plasztik\u00e1i \u00f6sszel
  k\u00e9sz\u00fclnek el. P\u00e9csi T\u00fcnde a kor\u00e1bbi \u00e9vek sikeres k\u00eds\u00e9rleteit
  tov\u00e1bbfejlesztve olyan kompoz\u00edci\u00f3t k\u00e9sz\u00edt, amely egy nagy
  m\u00e9ret\u0171 k\u00f6zt\u00e9ri munka pontos terve. A kr\u00f3mac\u00e9l tart\u00f3szerkezet
  feszes ritmus a t\u00e9rben, amelyhez szervesen hozz\u00e1 \u00e9p\u00fclnek beton
  h\u00e9jazatok a szerkezetet fedve, ny\u00edl\u00e1sokat hagyva, organikusan \u00e9p\u00edtkezve.
  M\u00e9sz\u00e1ros Gergely diploma munk\u00e1ja \u00e9s dolgozata alapj\u00e1n a
  DLA k\u00e9pz\u00e9sben folytathatja tanulm\u00e1nyait. Munkaterve szerint a k\u00e9pz\u00e9s
  hat f\u00e9l\u00e9ve alatt is a betonnal szeretne foglalkozni.\\n\\nBar\u00f3ti
  Anna doktorandusz aspir\u00e1ns ebben a szorgalmi id\u0151szakban szint\u00e9n beton
  felhaszn\u00e1l\u00e1s\u00e1val k\u00e9sz\u00edtette el munk\u00e1it a besz\u00e1mol\u00f3
  ki\u00e1ll\u00edt\u00e1sra. Rendk\u00edv\u00fcl figyelemre m\u00e9lt\u00f3 plasztikai
  k\u00eds\u00e9rletek sz\u00fclettek, amelyben a beton anyag\u00e1hoz j\u00f3l illeszked\u0151en
  \u00fcveg bubor\u00e9kokat applik\u00e1lt a szobor \u00f6nt\u00e9se el\u0151tt a
  negat\u00edvra a m\u0171v\u00e9szi kifejez\u00e9s \u00e9rdek\u00e9ben. Herpesz c\u00edm\u0171
  alkot\u00e1sai szokatlanul dr\u00e1mai hat\u00e1st keltenek.\\n\\nA kurzus m\u0171k\u00f6d\u00e9s\u00e9hez
  sz\u00fcks\u00e9ges alapvet\u0151 felt\u00e9telek megteremt\u00e9s\u00e9ben seg\u00edtett
  az egyetem \u00e9s a Duna-Dr\u00e1va Cement Kft. mint f\u0151szponzor. Betonteknol\u00f3giai
  k\u00eds\u00e9rleteinkben kiv\u00e1l\u00f3 egy\u00fcttm\u0171k\u00f6d\u0151 partnereink
  voltak L\u00e1nyi Gy\u00f6rgy betonteknol\u00f3gus \u00e9s Spr\u00e1nitz Ferenc
  betonteknol\u00f3gus okleveles szakm\u00e9rn\u00f6k. Szaktud\u00e1sukkal \u00e9s
  bar\u00e1ti seg\u00edts\u00e9g\u00fckkel az el\u0151t\u00fcnk \u00e1ll\u00f3 feladatok
  sz\u00ednvonalasabb megold\u00e1s\u00e1t tett\u00e9k lehet\u0151v\u00e9.\\n\\nA
  k\u00f6vetkez\u0151 tan\u00e9v siker\u00e9nek alapvet\u0151 felt\u00e9tele, hogy
  ezek a kapcsolatok fennmaradjanak \u00e9s tov\u00e1bb \u00e9p\u00fcljenek.\\n\\nBeton
  szerkezetek v\u00edz elleni v\u00e9delme, k\u00fcl\u00f6nleges fel\u00fcleti kialak\u00edt\u00e1sa\\n\\nK\u00dcRT\u0150S
  ZOLT\u00c1N\\n\\nMAXIT FLOOR\\n\\nA leggondosabb tervez\u00e9s, kivitelez\u00e9s
  eset\u00e9n is el\u0151fordul, hogy az egy\u00e9bk\u00e9nt j\u00f3 min\u0151s\u00e9g\u0171
  beton f\u00f6d\u00e9mre, aljazatbetonra, vagy egy r\u00e9gi ipari betonpadl\u00f3ra
  \u00faj fel\u00fclet vagy nagy pontoss\u00e1g\u00fa kiegyenl\u00edt\u00e9s miatt
  2-50 mm vastag r\u00e9teget kell felhordani. A feladat k\u00fcl\u00f6nlegess\u00e9ge
  lehet, ha az \u00edgy elk\u00e9sz\u00fclt fel\u00fcletet k\u00f6zvetlen j\u00e1r\u00f3fel\u00fcletk\u00e9nt
  szeretn\u00e9k haszn\u00e1lni. S\u00e9r\u00fcl\u00e9s, sz\u00edn vagy p\u00e1ratechnikai
  okokb\u00f3l, esetleg m\u00e1s megfontol\u00e1sb\u00f3l a m\u0171gyanta bevonat
  nem j\u00f6het sz\u00f3ba.\\n\\nA Deitermann Hung\u00e1ria Kft. a m\u00falt \u00e9v
  v\u00e9g\u00e9n kezdte el forgalmazni a MAXIT term\u00e9keket. Ezen term\u00e9kek
  a padl\u00f3k vonatkoz\u00e1s\u00e1ban k\u00e9tf\u00e9le meghat\u00e1roz\u00f3 tulajdons\u00e1g\u00fa
  esztrichet foglalnak magukba. Az egyik burkolatot ig\u00e9nyel, az m\u00e1sik k\u00f6r
  az \u00fagynevezett ipari padl\u00f3k, melyek ABS n\u00e9ven a MAXIT Floor 4600
  sorozat\u00faak. Ezek egy r\u00e9sze burkolat n\u00e9lk\u00fcl is alkalmass er\u0151s
  ipari ig\u00e9nybev\u00e9telre. Itt is van igen gyors k\u00f6t\u00e9s\u0171 \u00e9s
  hamar terhelhet\u0151 v\u00e1ltozat.\\n\\nMindkett\u0151 alapvet\u0151 tulajdons\u00e1ga,
  hogy g\u00e9pi feldolgoz\u00e1sra alkalmas, de fontos, hogy kett\u0151s kever\u0151g\u00e9ppel
  legyen be\u00e9p\u00edtve. 4 mm felett \u00f6nter\u00fcl\u0151 a kever\u00e9k, \u00e9s
  nagyon k\u00f6nnyen alak\u00edthat\u00f3k ki sz\u00e9p \u00e9s nagy pontoss\u00e1g\u00fa
  fel\u00fcletek.\\n\\n2. \u00e1bra A feldolgoz\u00f3 g\u00e9p\\n\\n1. \u00e1bra MAXIT
  Floor rendszer komponensek \u00e9s tan\u00e1csad\u00e1s\\n\\nSv\u00e9dorsz\u00e1gban
  k\u00fcl\u00f6n\u00f6sen kedvelt az alkalmaz\u00e1suk az automata rakt\u00e1rakban,
  mert k\u00fcl\u00f6n\u00f6sebb gond n\u00e9lk\u00fcl lehet vel\u00fck az ilyen felhaszn\u00e1l\u00e1s
  eset\u00e9n ig\u00e9nyelt nagy pontoss\u00e1g\u00fa fel\u00fcletet kialak\u00edtani.
  A korund adal\u00e9kos v\u00e1ltozat felveszi a versenyt a k\u00e9regeros\u00edtett
  betonnal.\\n\\nR\u00e9gi, elhaszn\u00e1l\u00f3dott fel\u00fcletek eset\u00e9n \u00faj,
  nagy pontoss\u00e1g\u00fa \u00e9s nagy ellen\u00e1ll\u00f3 k\u00e9pess\u00e9g\u0171
  fel\u00fcletek alak\u00edthat\u00f3k ki, viszonylag kis vastags\u00e1g eset\u00e9n
  is.\\n\\nA legegyszer\u0171bb esetben a r\u00e9gi fel\u00fclet (lehet fa, ker\u00e1mia
  vagy beton) feltiszt\u00edt\u00e1sa, az ig\u00e9nybev\u00e9telnek \u00e9s a k\u00f6r\u00fclm\u00e9nyeknek
  megfelel\u0151 alapoz\u00e1s ut\u00e1n a MAXIT Floor k\u00f6zvetlen\u00fcl felhordhat\u00f3,
  \u00e9s 2-6 mm vastags\u00e1g felett m\u00e1r jelent\u0151s hat\u00e1soknak k\u00e9pes
  ellen\u00e1llni.\\n\\nM\u00e1s esetben homok vagy \u00fasztatott h\u0151szigetel\u00e9s,
  esetleg dombornyomott dr\u00e9nlemez fel\u00fclet\u00e9n 20-80 mm felett alak\u00edthat\u00f3
  kimegfelel\u0151 fel\u00fclet.\\n\\nA dr\u00e9nlemezes felhaszn\u00e1l\u00e1s k\u00fcl\u00f6n\u00f6sen
  kedvelt Norv\u00e9gi\u00e1ban \u00e9s Sv\u00e9dorsz\u00e1gban. \u00dajatot r\u00e9tegre
  t\u00f6rt\u00e9n\u0151 be\u00e9p\u00edt\u00e9s szinte mindenhol k\u00e9sz\u00fclt.
  Az olasz Fiat M\u0171vekn\u00e9l t\u00f6bb ipari csarnokot \u00faj\u00edtottak fel
  homok\u00e1gyas megold\u00e1ssal.\\n\\nDEITEROL C, DEITERMANN FC\\n\\nA k\u00fcls\u0151
  hat\u00e1sokra - mint a v\u00edz, a sz\u00e9ndioxid \u00e9s a sok - a l\u00fagos\u00e1g,
  azaz a beton term\u00e9szetes v\u00e9delme cs\u00f6kkenhet. Amint e folyamat a beton
  vasal\u00e1s\u00e1t el\u00e9ri, bek\u00f6vetkezik a vasbetonszerkezet l\u00e1tv\u00e1nyos
  k\u00e1rosod\u00e1sa. A lassan vagy egyre gyorsabban rozsd\u00e1sod\u00f3 betonac\u00e9l
  megduzzad, \u00e9s megrepeszti a k\u00f6r\u00fcli\u0151tte l\u00e9v\u0151 betont.
  Megl\u00e9v\u0151, v\u00e9delem n\u00e9lk\u00fcli betonszerkezetek n\u00e9h\u00e1ny
  \u00e9v eltelt\u00e9vel gyakran ilyen k\u00e1rosod\u00e1sokat mutatnak. A beton
  v\u00e9delm\u00e9t halad\u00e9ktalanul el kell v\u00e9gezni, illetve \u00faj szerkezetekn\u00e9l
  a k\u00e9sz\u00edt\u00e9ssel egyid\u0151ben cselz\u00e9r\u0171 azt megcsin\u00e1lni.
  A fel\u00fcletv\u00e9delem megakad\u00e1lyozza a nedvess\u00e9g, a sz\u00e9ndioxid
  \u00e9s a sok behatol\u00e1s\u00e1t \u00e9s v\u00e9di a betont a k\u00e1rosod\u00e1st\u00f3l.
  Az \u00e9p\u00edtm\u00e9ny fajt\u00e1j\u00e1t\u00f3l, valamint az ig\u00e9nybev\u00e9telt\u0151l
  f\u00fcgg\u0151en k\u00fcl\u00f6nf\u00e9le rendszerekkel t\u00f6rt\u00e9nhet a v\u00e9delem.\\n\\nA
  leggondosabb esetben is el\u0151fordulhat, hogy a beton fel\u00fclet\u00e9n reped\u00e9sek
  alakulnak ki. Ez, ha nem is l\u00e1tszik, a t\u00f6nkremenetelt jelent\u0151sen
  meggyors\u00edtja.\\n\\nAz \u00e9p\u00edt\u00e9szetben \u00fajra k\u00f6zkedvelt
  lett a l\u00e1tsz\u00f3 beton, meglelentek beton p\u00e1rk\u00e1nyok, illetve divatosak
  lettek a h\u00e9zagol\u00e1s n\u00e9lk\u00fcli k\u00f6burkolatok.\\n\\nA reped\u00e9sk\u00e9pz\u0151d\u00e9s
  eset\u00e9n felmer\u00fcl\u0151 gondok elker\u00fcl\u00e9s\u00e9re, valamint a l\u00e1tsz\u00f3
  betonon eset\u00e9n a fel\u00fcletek hidrof\u00f3biz\u00e1l\u00f3 impregn\u00e1llal
  t\u00f6rt\u00e9n\u0151 kezel\u00e9se j\u00f3 megold\u00e1s lehet.\\n\\nA Deitermann
  Hung\u00e1ria Kft. a tart\u00f3s v\u00e9delem \u00e9rdek\u00e9ben k\u00e9tf\u00e9le
  anyagot forgalmaz. Az egyiket alapvet\u0151en cementes, \\\"l\u00fagos\\\" fel\u0171let\u00e9kre
  fejlesztett\u00e9k ki, ez a DEITEROL C, m\u00edg a m\u00e1sikat t\u00e9gl\u00e1
  \u00e9s k\u00f6 fel\u00fcletekre, ez a DEITERMANN FC. Ezek a kr\u00e9mszer\u0171
  anyagok a szok\u00e1sos hidrof\u00f3biz\u00e1l\u00f3 anyagokn\u00e1l nagyobb \u00e9s
  tart\u00f3sabb v\u00e9delmet biztos\u00edtanak. A kr\u00e9mszer\u0171 felhord\u00e1s
  k\u00f6vetkezt\u00e9ben t\u00f6bb \u00e9s m\u00e9lyebbre jut\u00f3 hat\u00f3anyag
  ker\u00fcl a fel\u00fcletre, a v\u00e9d\u0151r\u00e9teg kialakul\u00e1sa el\u0151tt
  egy f\u00e1zisban. Az \u00edgy kialakul\u00f3 r\u00e9teg ellen\u00e1ll az UV sugaraknak
  a nagy behatol\u00e1s miatt, \u00e9s \u00e9lettartama, hat\u00e1sa m\u00e9g fel\u00fcleti
  s\u00e9r\u00fcl\u00e9s eset\u00e9n is jelent\u0151s.\\n\\n4. \u00e1bra Superflex
  D2 szigetel\u00e9s felbord\u00e1sa\\n\\nSUPERFLEX D2\\n\\nAz \u00e9p\u00edt\u00e9szek
  \u00e1ltal meg\u00e1ldomodott beton p\u00e1rk\u00e1nyok v\u00edzszintes vagy k\u00f6zel
  v\u00edzszintes fel\u00fclet\u00e9nek, \u00e9s az \u00e9p\u00fclet eg\u00e9sz\u00e9nek
  v\u00e9delm\u00e9re a Deitermann Hung\u00e1ria Kft. az elm\u00falt \u00e9v v\u00e9g\u00e9n
  kezdte el forgalmazni a tavaszi Construm\u00e1n nagyd\u00edjat nyert term\u00e9k\u00e9t,
  a Superflex D2-t. Ez a term\u00e9k rendk\u00edv\u00fcli rugalmass\u00e1ggal, UV
  \u00e1ll\u00f3s\u00e1ggal \u00e9s igen kedvez\u0151 felhord\u00e1si tulajdons\u00e1ggal
  rendelkezik.\\n\\nAlkalmas \u00e9p\u00fcletek m\u00e9ly\u00e9p\u00edt\u00e9si szigetel\u00e9s\u00e9re,
  ezen bel\u00fcl vasalt beton szerkezetek, pillerek \u00e1tmen\u0151 szigetel\u00e9s\u00e9re
  is. Medenc\u00e9k burkolat alatti vagy burkolat n\u00e9lk\u00fcli szigetel\u00e9s\u00e9re
  is kiv\u00e1l\u00f3. Kihaszn\u00e1lva UV \u00e1ll\u00f3s\u00e1g\u00e1t p\u00e1rk\u00e1nyok,
  pergol\u00e1k v\u00edz elleni v\u00e9delm\u00e9re is felhaszn\u00e1lhat\u00f3.\\n\\n5.
  \u00e1bra A beton p\u00e1rk\u00e1nyokat meg kell v\u00e9deni az id\u0151j\u00e1r\u00e1s
  viszontags\u00e1gait\u00f3l\\n\\n\u00c9let\u00fat\\n\\nBal\u00e1zs Gy\u00f6rgy \u00fcsz\u00f6nt\u00e9se
  80. sz\u00fclet\u00e9snapja alkalm\u00e1b\u00f3l\\n\\nJ\u00faniusban \u00fcnnepi
  \u00fcl\u00e9sen k\u00f6sz\u00f6nt\u00f6tt\u00e9k Dr. Bal\u00e1zs Gy\u00f6rgy ny.
  egyetemi tan\u00e1rt 80. sz\u00fclet\u00e9snapja alkalm\u00e1b\u00f3l a M\u0171egyetem
  D\u00edszt\u00e9rm\u00e9ben.\\n\\n1950-ben lett tan\u00e1rseg\u00e9d a II. sz. H\u00edd\u00e9p\u00edt\u00e9stan
  Tansz\u00e9ken Mihailich Gy\u00f6z\u0151 professzor mellett. Az \u00c9p\u00edt\u0151anyagok
  Tansz\u00e9ken az \u00c9p\u00edt\u0151anyagok c. tant\u00e1rgyat az \u00e9p\u00edt\u00e9sz
  hallgat\u00f3knak 26 \u00e9ven \u00e1t, az \u00c9p\u00edt\u0151anyagok \u00e9s k\u00e9mia
  c. tant\u00e1rgyat az \u00e9p\u00edt\u0151m\u00e9rn\u00f6k hallgat\u00f3knak kb.
  20 \u00e9ven \u00e1t adta el\u0151. K\u00e9s\u0151bb kialakult a szabadon v\u00e1laszthat\u00f3
  (v\u00e1laszt\u00e1s ut\u00e1n k\u00f6telez\u0151) tant\u00e1rgyak rendszere. Az
  \u00c9p\u00edtm\u00e9nyek diagnosztik\u00e1ja, a Szerkezetek v\u00e9delme \u00e9s
  jav\u00edt\u00e1sa c. tant\u00e1rgyakat dr. Kov\u00e1cs K\u00e1rolyal m\u00e9g ma
  is el\u0151adj\u00e1k.\\n\\nKezdett\u0151l fogva r\u00e9szt vett a szakm\u00e9rn\u00f6k-k\u00e9pz\u00e9sben.
  A tansz\u00e9k szervezte az \u00c9p\u00edt\u0151ipari min\u0151s\u00e9gvizsg\u00e1lat,
  majd \u00c9p\u00edt\u0151ipari min\u0151s\u00e9g-szab\u00e1lyoz\u00e1s, v\u00e9g\u00fcl
  az \u00c9p\u00edt\u0151ipari min\u0151s\u00e9gv\u00e9delem c. szakm\u00e9rn\u00f6ki
  tanfolyamokat. Mindig s\u00falyt helyezett a tehet\u0151s\u00e9ges hallgat\u00f3k
  bevezet\u00e9s\u00e9re a tudom\u00e1nyos kutat\u00e1sba. Ezt a munk\u00e1j\u00e1t
  a TDK-mozgalom megind\u00edt\u00e1s\u00e1val kezdt\u00e9 meg.\\n\\nA gyakorlati
  oktat\u00e1s el\u0151seg\u00edt\u00e9s\u00e9re megszervezte a K\u00f6zponti \u00e9p\u00fclet
  III. emelet\u00e9n az \u00c1lland\u00f3 \u00c9p\u00edt\u0151anyag Ki\u00e1ll\u00edt\u00e1st,
  amelyet fokozatosan az \u00e9p\u00edt\u0151- \u00e9s \u00e9p\u00edt\u00e9sz k\u00e9pz\u00e9s
  \u00e1ltal\u00e1nos szintjej\u00e9 b\u0151v\u00edttettek. Rendszeres korszer\u0171s\u00edt\u00e9ssel
  ez tov\u00e1bbra is j\u00f3 seg\u00edt\u00e9se az oktat\u00e1snak.\\n\\nKutat\u00e1si
  ter\u00fcletei di\u00f3h\u00e9jban: a beton szil\u00e1rdul\u00e1si folyamat\u00e1nak
  befoly\u00e1sol\u00e1sa; a g\u00f6z\u00f6lt beton ut\u00f3szil\u00e1rdul\u00e1sa;
  a beton, vasbeton alakv\u00e1ltoz\u00e1sai, valamint ebb\u0151l ered\u0151 saj\u00e1t
  fesz\u00fclts\u00e9gei; betonok v\u00edzz\u00e1r\u00f3s\u00e1g\u00e1nak n\u00f6vel\u00e9se;
  statikai \u00e9s szil\u00e1rds\u00e1gtani probl\u00e9m\u00e1k; a beton szil\u00e1rdul\u00e1s\u00e1nak
  gyors\u00edt\u00e1sa; k\u00fcl\u00f6nleges betonok \u00e9s betontechnol\u00f3giaiak;
  a beton alakv\u00e1ltoz\u00e1si jellemz\u0151i; a beton \u00e9s a vasbeton tartoss\u00e1ga
  \u00e9s a tartoss\u00e1g n\u00f6vel\u00e9se; a beton strukt\u00far\u00e1ja \u00e9s
  tulajdons\u00e1gai k\u00f6z\u00f6tti \u00f6sszef\u00fcgg\u00e9sek keres\u00e9se;
  fesz\u00edtett tart\u00f3k ny\u00edr\u00e1sai \u00e9s csavar\u00e1si vizsg\u00e1lata.\\n\\nT\u00f6bbs\u00e9g\u00e9ben
  e kutat\u00e1sokhoz kapcsol\u00f3dik kiemelked\u0151 szakk\u00f6nyv \u00e9s szakcikkir\u0151l
  tev\u00e9kenys\u00e9ge. K\u00f6nyvei k\u00f6z\u00fcl vil\u00e1gviszonylatban is
  az els\u0151 volt a Betonszil\u00e1rd\u00edt\u00e1s (1968) \u00e9s a Vasbetonelemek
  kapcsolatai (1977). Ut\u00f3bbit bolg\u00e1r nyelven is kiadt\u00e1k.\\n\\nBeton
  \u00e9s vasbeton c. k\u00f6nyvsorozatban foglalta \u00f6ssze a beton \u00e9s vasbeton
  t\u00f6rt\u00e9net\u00e9t:\\nI. Alapismeretek t\u00f6rt\u00e9nete (1994), II. M\u00e9ly\u00e9p\u00edt\u00e9si
  beton- \u00e9s vasbeton szerkezetek t\u00f6rt\u00e9nete (1995), III. Magas\u00e9p\u00edt\u00e9si
  beton- \u00e9s vasbeton szerkezetek t\u00f6rt\u00e9nete (1996), IV. Az oktat\u00e1s
  t\u00f6rt\u00e9nete (2001), V. A kutat\u00e1s t\u00f6rt\u00e9nete I. (2004), VI.
  A kutat\u00e1s t\u00f6rt\u00e9nete II. (2005), VII. Mit tettek a magyarok k\u00fclf\u00f6ld\u00f6n
  (2006, kiad\u00f3n\u00e1l).\\n\\n50 \u00e9ves betonkutat\u00e1sainak \u00faj eredm\u00e9nyeit
  Barangol\u00e1saim a betonkutat\u00e1s ter\u00fclet\u00e9n c. k\u00f6nyvben (2001)
  foglalta \u00f6ssze. Dr. T\u00f3th Ern\u0151vel szerkesztette a Beton- \u00e9s vasbeton
  szerkezetek diagnosztik\u00e1ja I. (1997), II. (1998) c. k\u00f6nyveket. T\u00e1rs
  szerz\u0151vel (dr. Kov\u00e1cs K\u00e1roly, dr. Bal\u00e1zs L. Gy\u00f6rgy \u00e9s
  dr. Farkas Gy\u00f6rgy) \u00edrta a Beton- \u00e9s vasbeton szerkezetek v\u00e9delme,
  jav\u00edt\u00e1sa \u00e9s meger\u0151s\u00edt\u00e9se c. k\u00f6nyvet (1999) \u00e9s
  szerkesztette a II. k\u00f6tetet (2002). E n\u00e9gy k\u00f6nyv egyben tank\u00f6nyv
  is.\\n\\nK\u00f6nyvet \u00edrt dr. Mihailich Gy\u00f6z\u0151 (2002) \u00e9s dr.
  Palot\u00e1s L\u00e1szl\u00f3 (2004) \u00e9letr\u0151l \u00e9s munk\u00e1ss\u00e1g\u00e1r\u00f3l.\\n\\n1952-ben
  megkapta a N\u00e9pk\u00f6zt\u00e1rsas\u00e1gi \u00c9rdem\u00e9rem Bronz fokozat\u00e1t,
  1997-ben a Magyar K\u00f6zt\u00e1rsas\u00e1gi \u00c9rdemrend kis keresztje kit\u00fcntet\u00e9st,
  2000-ben a Sz\u00e9chenyi d\u00edjat.\\n\\nGratul\u00e1lunk ehhez a tartalmas \u00e9let\u00fathoz,
  k\u00edv\u00e1nunk a tov\u00e1bbi tev\u00e9keny id\u0151szakhoz j\u00f3 er\u0151t,
  eg\u00e9szs\u00e9get.\\n\\nA Szerkeszt\u0151s\u00e9g\\n\\nA Zmentk\u00e9p foly\u00f3irat
  12. sz\u00e1m\u00e1ban olvastam\\n\\nHummel, H. U. - Kr\u00e4mer, G.: A gipsz-zeolit
  lemez kedvez\u0151 hat\u00e1sa szobaleveg\u0151 min\u0151s\u00e9g\u00e9re (2. r\u00e9sz)\\nZKG
  International\\n59. \u00e9vf. 6. sz\u00e1m, 72-80. oldal\\n\\nA cikk a laborat\u00f3riumi
  \u00e9s \u201eterepk\u00eds\u00e9rletek\u201d eredm\u00e9nyeit ismerteti. A laborat\u00f3riumi
  vizsg\u00e1latok sor\u00e1n (1. \u00e1bra) k\u00fcl\u00f6nb\u00f6z\u0151 koncentr\u00e1ci\u00f3j\u00fa
  formaldehidet, benzolt \u00e9s amm\u00f3ni\u00e1t tartalmaz\u00f3 leveg\u0151t bocs\u00e1tottak
  \u00e1t gipsz-zeolit lapot tartalmaz\u00f3 m\u00e9r\u0151kamr\u00e1n, ut\u00e1na
  g\u00e1zanal\u00edzissel meghat\u00e1rozt\u00e1k a koncentr\u00e1ci\u00f3 cs\u00f6kken\u00e9s\u00e9t,
  \u00e9s olfaktometterrel (szagm\u00e9r\u0151) a szagintenzit\u00e1st is m\u00e9rt\u00e9k.
  A doh\u00e1nyf\u00fcst megk\u00f6t\u00e9st viszont egy val\u00f3di doh\u00e1nyoz\u00f3sb\u00f3l
  hat\u00e1rozt\u00e1k meg. Valamennyi m\u00e9r\u00e9s igazolta a gipsz-zeolit lemezek
  kiv\u00e1l\u00f3 \u00e1rtalmas g\u00e1zmegk\u00f6ti k\u00e9pess\u00e9g\u00e9t, szagtalan\u00edt\u00f3
  hat\u00e1s\u00e1t.\\n\\nAz els\u0151 k\u00e9t csoport anyagai teljes\u00edt\u0151k\u00e9pess\u00e9g-jav\u00edt\u00f3
  tulajdons\u00e1gukat a hidrat\u00e1lt cementben a \u201eleggyeng\u00e9bb l\u00e1ncszemk\u00e9nt\u201d
  viselked\u0151 kalcium-hidroxid kalciump-szilik\u00e1t-hidr\u00e1t\u00e1 alak\u00edt\u00e1s\u00e1nak
  k\u00f6sz\u00f6nhetik, az inert anyagokkal pedig a cement szemcszerkezet jav\u00edthat\u00f3
  (vizig\u00e9ny cs\u00f6kkent\u00e9s).\\n\\nA legismertebb hidraulikus kieg\u00e9sz\u00edt\u0151
  anyag a koh\u00f3salak, s ide sorolhat\u00f3 m\u00e9g az \u00e9getett olajpala,
  a rizs feldolgoz\u00e1s mell\u00e9kterm\u00e9kek\u00e9nt k\u00e9pz\u0151d\u0151,
  kovasav tartalm\u00fa rizsh\u00e9j, valamint a kaolin\u00e9get\u00e9ssel nyert meta-kaolin.\\n\\nA
  puccol\u00e1nos anyagok k\u00e9t legismertebb k\u00e9pvisel\u0151je a term\u00e9szetes
  eredet\u0171 puccol\u00e1n (trasz), valamint a mesters\u00e9ges er\u0151m\u0171vi
  pernye. Ide sorolhatjuk ezen k\u00edv\u00fcl m\u00e9g a f\u00e9mszil\u00edcium \u00e9s
  \u00f6tv\u00f6zeteinek gy\u00e1rt\u00e1sakor k\u00e9pz\u0151d\u0151, d\u00f6nt\u0151en
  szil\u00edcium-dioxidb\u00f3l \u00e1ll\u00f3 szilikapot (ami por, vagy vizes szuszpenzi\u00f3
  alakj\u00e1ban hozz\u00e1f\u00e9rhet\u0151).\\n\\nAz inert anyagok legismertebbek
  term\u00e9szetesen a m\u00e9szk\u00f6, valamint a cementgy\u00e1rt\u00e1s mell\u00e9kterm\u00e9ke,
  az \u00fan. \\\"bypass-por\\\" (tudtommal nincs magyar neve).\\n\\nSajnos a l\u00e1t\u00e9ns
  hidraulikus \u00e9s puccol\u00e1nos anyagokb\u00f3l vil\u00e1gszerte csak korl\u00e1tozott
  mennyis\u00e9g \u00e1ll rendelkez\u00e9sre (1. t\u00e1bl\u00e1zat).\\n\\n2003-ban
  a vil\u00e1gon termelt 1880 Mt cementhez 180 Mt klinkerp\u00f3tl\u00f3 anyagot,
