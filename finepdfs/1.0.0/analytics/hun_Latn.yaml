  k\u00f6t\u0151d\u0151 szakmai programokon vehetnek r\u00e9szt.\\n\\n\u2022 M\u00fazeumokban
  \u00e9s sz\u00ednh\u00e1zi el\u0151ad\u00e1sokon gyakorlati feladatokat kell megoldaniuk.\\n\\n\u2022
  Hely- \u00e9s iskolat\u00f6rt\u00e9neti feladatokat kapnak.\\n\\n\u2022 Interakt\u00edv
  oktat\u00e1s keret\u00e9ben szaktant\u00e1rgyi feladatokat oldanak meg az internet
  seg\u00edts\u00e9g\u00e9vel a sz\u00e1m\u00edt\u00f3g\u00e9pen.\\n\\n**Idegen nyelvi
  k\u00e9pz\u00e9s eset\u00e9ben:**\\n\\n\u2022 A nyelvvizsg\u00e1ra val\u00f3 felk\u00e9sz\u00fcl\u00e9s
