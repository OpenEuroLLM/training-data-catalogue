  val\u00f3s. Az AK - ellenkez\u0151 bizony\u00edt\u00e1sig - az adat val\u00f3s\u00e1gtartalm\u00e1t
  az aj\u00e1nlattev\u0151 erre vonatkoz\u00f3 k\u00fcl\u00f6n nyilatkozata n\u00e9lk\u00fcl
  v\u00e9lemezi.\\n\\nA Kbt. 69. \u00a7 (11a) bekezd\u00e9se \u00e9s a 321/2015. (X.30.)
  Korm. rendelet 1. \u00a7 (8) bekezd\u00e9s ir\u00e1nyad\u00f3. Ebben az esetben
