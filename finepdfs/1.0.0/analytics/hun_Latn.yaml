  \u00e9rintik a leger\u00f4teljesebben, amelyeket t\u00f6megturizmusk\u00e9nt tartunk
  sz\u00e1mon. A legfontosabb tendenci\u00e1k felv\u00e1zol\u00e1sa mellett meg\u00e1llap\u00edtjuk,
  hogy a t\u00f6megturizmushoz sorolt \u00e1gazatok (tengerpart menti turizmus, s\u00edturizmus)
  mellett a j\u00f6v\u00f4ben sz\u00e1molnunk kell az alternat\u00edv turisztikai
  \u00e1gazatokat (pl. borturizmus, v\u00edzi turizmus, vad\u00e1szturizmus) \u00e9rint\u00f4
  klimatikus v\u00e1ltoz\u00e1sokkal is.\\n\\nBevezet\u00e9s\\n\\nA XX. sz\u00e1zad
  utols\u00f3 harmad\u00e1t\u00f3l a turizmus \u00e9s a sport robban\u00e1sszer\u00fb
  fejl\u00f4d\u00e9s\u00fckkel a fejlett orsz\u00e1gok lak\u00f3inak k\u00e9t legkeresettebb
  szabadid\u00f4s tev\u00e9kenys\u00e9ge lett, az utaz\u00e1s \u00e9s a sportol\u00e1s
  alapvet\u00f4 \u00e9s legn\u00e9pszer\u00fbbb motiv\u00e1ci\u00f3j\u00e1nak tekinthet\u00f4
  rekre\u00e1ci\u00f3s ig\u00e9ny konjunkt\u00far\u00e1ja  pedig t\u00f6retlen. A
  nemzetk\u00f6zi szakirodalom r\u00e1mutat, hogy e tev\u00e9kenys\u00e9gek mindegyike
  komoly hat\u00e1ssal van a benn\u00fcnket k\u00f6r\u00fclvev\u00f4 k\u00f6rnyezetre.\\n\\nA
  World Tourism Organization (Vil\u00e1g Turisztikai Szervezete) vizsg\u00e1latai
  alapj\u00e1n a szabadid\u00f4s utaz\u00e1sok sor\u00e1n a s\u00edel\u00e9s, a snowboardoz\u00e1s,
  a hegym\u00e1sz\u00e1s, a term\u00e9szetj\u00e1r\u00e1s, a v\u00edzi sportok \u00fbz\u00e9se,
  valamint a ker\u00e9kp\u00e1roz\u00e1s a legkedveltebb fizikai tev\u00e9kenys\u00e9g
  (D\u00c1VID \u00c9S SZIL\u00c1GYI 2006). A term\u00e9szetben v\u00e9gezhet\u00f4
  sportok n\u00e9pszer\u00fbs\u00e9ge bizonyos ter\u00fcleteken a r\u00e9sztvev\u00f4k
  \u00f3ri\u00e1si m\u00e9rt\u00e9k\u00fb id\u00f4beli \u00e9s t\u00e9rbeli koncentr\u00e1ci\u00f3j\u00e1hoz
  vezet, ami jelent\u00f4s k\u00f6rnyezet\u00e1talak\u00edt\u00f3 infrastruktur\u00e1lis
  fejleszt\u00e9seket \u00e9s fokozott k\u00f6rnyezetterhel\u00e9st eredm\u00e9nyez.
  A t\u00f6megturizmus \u00e9s a t\u00f6megsport mellett a k\u00e9t ter\u00fclet term\u00e9szeti
  k\u00f6rnyezetre gyakorolt hat\u00e1sainak vizsg\u00e1lata az\u00e9rt sem n\u00e9lk\u00fcl\u00f6zhet\u00f4,
  mivel napjainkban egyre na-gyobb teret h\u00f3d\u00edtanak a szabadt\u00e9ri, sport
  orient\u00e1ci\u00f3j\u00fa utaz\u00e1sok (D\u00c1VID \u00e9s SZIL\u00c1GYI 2006).\\n\\nA
  manaps\u00e1g egyre t\u00f6bbet emlegetett glob\u00e1lis kl\u00edmav\u00e1ltoz\u00e1s
  v\u00e1rhat\u00f3 hat\u00e1sai miatt az idegenforgalom \u00faj kih\u00edv\u00e1sokkal
  n\u00e9z szembe. Az alapvet\u00f4 klimatikus \u00f6sszef\u00fcgg\u00e9sekben is
  l\u00e9nyeges v\u00e1ltoz\u00e1sok v\u00e1rhat\u00f3ak (1. \u00e1bra).\\n\\nA prognosztiz\u00e1lt
  hat\u00e1sok r\u00e9gi\u00f3nk\u00e9nt elt\u00e9r\u00f4ek, annyi azonban bizonyosnak
  t\u00fbnik, hogy a v\u00e1ltoz\u00f3 csapad\u00e9keloszl\u00e1s \u00e9s -\u00f6sszegek,
  a megv\u00e1ltozott komfort\u00e9rzet, valamint a nagyobb gyakoris\u00e1ggal bek\u00f6vetkez\u00f4
  extr\u00e9m id\u00f4j\u00e1r\u00e1si esem\u00e9nyek k\u00f6vetkezt\u00e9ben a tengerparti
  \u00e9s a hegyvid\u00e9ki ter\u00fcletek t\u00fbnnek legink\u00e1bb vesz\u00e9lyeztetettnek.\\n\\n\u00cdr\u00e1sunkban,
  ebb\u00f4l kifoly\u00f3lag, a s\u00edturizmus \u00e9s a tengerpart menti turizmus
  j\u00f6v\u00f4j\u00e9vel kapcsolatos n\u00e9h\u00e1ny k\u00e9rd\u00e9st k\u00edv\u00e1nunk
  \u00e1ttekinteni, az \u00e9ghajlatv\u00e1ltoz\u00e1s \u00e9s a fenntarthat\u00f3s\u00e1g
  f\u00fcggv\u00e9ny\u00e9ben, megfigyel\u00e9seink \u00e9s a rendelkez\u00e9sre \u00e1ll\u00f3
  szakirodalom alapj\u00e1n.\\n\\nAz \u00e9ghajlati v\u00e1ltoz\u00e1sok f\u00f4 jellemz\u00f4i
  \u00e9s ir\u00e1nyai\\n\\nA rekre\u00e1ci\u00f3s c\u00e9l\u00fa turizmus \u00e9s
  sport \u00e1ltal \u00e9rintett ter\u00fcletek term\u00e9szeti k\u00f6rnyezetben
  nyomon k\u00f6vethet\u00f4 hat\u00e1sa sz\u00e1mos t\u00e9nyez\u00f4 f\u00fcggv\u00e9nye.\\n\\nEbb\u00f4l
  k\u00f6vetkezik, hogy b\u00e1r a hat\u00e1sok t\u00edpusa minden \u00e9rintett ter\u00fcleten
  hasonl\u00f3, konkr\u00e9t megjelen\u00e9si form\u00e1juk, kiterjed\u00e9s\u00fck
  \u00e9s nagys\u00e1guk m\u00e1s \u00e9s m\u00e1s lehet (PUCZK\u00d3 \u00e9s R\u00c1TZ
  2002). Ugyanakkor arra is utalnunk kell, hogy a rekre\u00e1ci\u00f3s turizmus \u00e9s
  sportol\u00e1s sz\u00ednterei komplexebb \u00e9s s\u00e9r\u00fcl\u00e9kenyebb k\u00f6rnyezetek
  (pl. kis szigetek, tengerparti ter\u00fcletek, hegyvid\u00e9ki ter\u00fcletek).\\n\\nA
  rekre\u00e1ci\u00f3s turisztikai, valamint sport tev\u00e9kenys\u00e9gek teljes
  fizikai hat\u00e1srendszer\u00e9nek felt\u00e1r\u00e1sa meglehet\u00f4sen neh\u00e9z
  feladat. A hat\u00e1sok \u00e9rt\u00e9kel\u00e9s\u00e9t megnehez\u00edt\u00f4 t\u00e9nyez\u00f4k
  a k\u00f6vetkez\u00f4k:\\n\\n\u2013 A k\u00f6vetkezm\u00e9nyek gyakran m\u00e1s
  (ipari, mez\u00f4gazdas\u00e1gi, k\u00f6zleked\u00e9s stb.) tev\u00e9kenys\u00e9gek
  hat\u00e1saival k\u00f6z\u00f6sen, azokt\u00f3l nehezen elv\u00e1laszthat\u00f3an
  jelentkeznek.\\n\u2013 A kutat\u00f3k nem rendelkeznek elegend\u00f4 ismerettel
  a c\u00e9lter\u00fclet turizmus \u00e9s/vagy sport tev\u00e9kenys\u00e9g megjelen\u00e9se
  el\u00f4tti k\u00f6rnyezeti \u00e1llapot\u00e1r\u00f3l, ez\u00e1ltal hi\u00e1nyzik
  az \u00f6sszehasonl\u00edt\u00e1si alap.\\n\u2013 A k\u00f6zvetlen hat\u00e1sok
  gyakran k\u00f6zvetett, vagy hossz\u00fa id\u00f4 m\u00falt\u00e1n jelentkez\u00f4
  v\u00e1ltoz\u00e1sokkal p\u00e1rosulnak.\\n\\n\u2013 A bonyolult kapcsolatrendszerb\u00f4l
  ad\u00f3d\u00f3an a k\u00f6vetkezm\u00e9nyeket nem mindig ott \u00e9szlelj\u00fck,
  ahol a hat\u00e1s bek\u00f6vetkezett.\\n\u2013 Az \u00f6sszehasonl\u00edt\u00f3
  \u00e9rt\u00e9kel\u00e9sekn\u00e9l, az \u00e1tfog\u00f3, rendszer szeml\u00e9let\u00fb
  tanulm\u00e1nyok k\u00e9sz\u00edt\u00e9s\u00e9n\u00e9l nagy probl\u00e9m\u00e1t
  jelent a k\u00edn\u00e1lati \u00e9s keresleti t\u00e9nyez\u00f4k k\u00fcl\u00f6nb\u00f6z\u00f4s\u00e9g\u00e9b\u00f4l
  ered\u00f4 sokf\u00e9le hat\u00e1s (MARTONN\u00c9 2001).\\n\\nA kl\u00edmav\u00e1ltoz\u00e1s
  kontinens\u00fcnk\u00f6n v\u00e1rhat\u00f3an jelentkez\u00f4 hat\u00e1sait gyakoribb
  h\u00f4hull\u00e1mok jelentik, melyek legink\u00e1bb a Mediterr\u00e1nium tengerparti
  turizmus\u00e1t s\u00fajthatj\u00e1k majd. Ennek k\u00f6vetkezt\u00e9ben drasztikusan
  visszaeshet annak vend\u00e9gforgalma. A h\u00f4\u00e9rzet megv\u00e1ltoz\u00e1s\u00e1nak
  jelei a TERJUNG (1966) \u00e1ltal kidolgozott oszt\u00e1lyoz\u00e1sban (2. \u00e1bra)
  bek\u00f6vetkez\u00f4 kisebb eltol\u00f3d\u00e1sok lehetnek, a mediterr\u00e1n \u00e9ghajlat\u00fa
  ter\u00fcleteken n\u00f4het a s\u00falyos h\u00f4stressz kateg\u00f3ri\u00e1j\u00e1ba
  es\u00f4 napok ar\u00e1nya. L\u00e9nyeg\u00e9ben a k\u00fcl\u00f6nb\u00f6z\u00f4
  sportol\u00e1si \u00e9s rekre\u00e1ci\u00f3s tev\u00e9kenys\u00e9gekre alkalmas
  h\u00f4m\u00e9rs\u00e9kleti \u00e9s l\u00e9gnedvess\u00e9g-tartom\u00e1nyok sz\u00fbk\u00fcl\u00e9se,
  az azok v\u00e9gz\u00e9s\u00e9hez sz\u00fcks\u00e9ges k\u00f6rnyezeti felt\u00e9telek
  kedvez\u00f4tlenebb\u00e9 v\u00e1l\u00e1sa val\u00f3sz\u00edn\u00fbs\u00edthet\u00f4.\\n\\nA
  magasabb l\u00e9g- \u00e9s v\u00edzh\u00f4m\u00e9rs\u00e9klet miatt n\u00f6vekv\u00f4
  diszkomfort\u00e9rzet nyom\u00e1n a turist\u00e1k v\u00e1rhat\u00f3an m\u00e1s c\u00e9lpontot
  igyekeznek majd keresni. Erre a magashegys\u00e9gek h\u00fbv\u00f6sebb, kellemesebb
  \u00e9s hosszabb ny\u00e1ri kl\u00edm\u00e1ja pedig lehets\u00e9ges alternat\u00edv\u00e1t
  k\u00edn\u00e1l. A h\u00f3hat\u00e1r feljebb h\u00faz\u00f3d\u00e1sa miatt a s\u00edelni
  v\u00e1gy\u00f3k a nagyobb magass\u00e1gokat veszik majd c\u00e9lba, melyek \u2013
  b\u00e1r eltart\u00f3- \u00e9s t\u00fbr\u00f4k\u00e9pess\u00e9g\u00fck j\u00f3val
  alacsonyabb \u2013 terhel\u00e9se a jelenlegihez k\u00e9pest jelent\u00f4sen n\u00f4ni
  fog (D\u00c1VID \u00e9s BAROS 2006).\\n\\nA tengerpart menti sporttev\u00e9kenys\u00e9gek
  b\u00f4v\u00fcl\u00e9se \u00e9s k\u00f6rnyezeti hat\u00e1sai\\n\\nA hegyvid\u00e9kek
  mellett a turizmus \u00e9s a sportok megannyi form\u00e1j\u00e1nak teret k\u00edn\u00e1l\u00f3
  term\u00e9szetes v\u00edzi k\u00f6rnyezetek a legn\u00e9pszer\u00fbbbek. A t\u00f6megturizmus
  kibontakoz\u00e1sakor a legnagyobb forgalmat a ny\u00e1ri vak\u00e1ci\u00f3z\u00e1sok
  jelentett\u00e9k, amelyek legf\u00f4bb c\u00e9lter\u00fcletei legink\u00e1bb \u2013
  a \u201e4 S\\\"-nek (Sea, Sand, Sun, Sex: MICHALK\u00d3 2005) k\u00f6sz\u00f6nhet\u00f4en
  \u2212 a tengerpartok, kisebb r\u00e9szt pedig a tavak \u00e9s foly\u00f3partok
  voltak. Napjainkra az egys\u00edk\u00fa tengerparti f\u00fcrd\u00f4z\u00e9ssel jellemezhet\u00f4
  klasszikus \u00fcd\u00fcl\u00f4turizmus jellege gy\u00f6keresen \u00e1talakult,
  egyre t\u00f6bb helyen jellemz\u00f4, hogy a turist\u00e1k kiszolg\u00e1l\u00e1sa
  \u00e9rdek\u00e9ben egyre t\u00f6bb sportol\u00e1si (akt\u00edv turisztikai) tev\u00e9kenys\u00e9get
  k\u00edn\u00e1lnak a szolg\u00e1ltat\u00f3k. A motoriz\u00e1ci\u00f3 (v\u00edzi
  j\u00e1rm\u00fbvek b\u00f4v\u00fcl\u00f4 felhaszn\u00e1l\u00e1sa), a v\u00edzisport-eszk\u00f6z\u00f6k
  alkalmaz\u00e1sa, a sz\u00e1mtalan sportol\u00e1si lehet\u00f4s\u00e9g egyre fokozottabban
  terhelik meg a partokat is. A v\u00edzpartokon emelt kiszolg\u00e1l\u00f3 l\u00e9tes\u00edtm\u00e9nyek
  tov\u00e1bbi negat\u00edv hat\u00e1sokat gerjesztenek. Term\u00e9szetesen a f\u00fcrd\u00f4turizmus
  \u00f6nmag\u00e1ban is sok k\u00f6rnyezeti gondot okoz, az egyre b\u00f4v\u00fcl\u00f4
  akt\u00edv sportol\u00e1si lehet\u00f4s\u00e9gek azonban tov\u00e1bb s\u00falyosb\u00edtj\u00e1k
  a probl\u00e9m\u00e1kat, hiszen n\u00f6velik a turista\u00e1radatot, illetve tov\u00e1bbi
  part menti \u00e9p\u00edtkez\u00e9seket is gener\u00e1lnak.\\n\\nA f\u00fcrd\u00e9sre
  alkalmas tengerpartok k\u00fcl\u00f6nf\u00e9le szolg\u00e1ltat\u00f3 l\u00e9tes\u00edtm\u00e9nyekkel
  t\u00f6rt\u00e9n\u00f4 be\u00e9p\u00edt\u00e9s\u00e9nek igen nagy ter\u00fcletek
  estek \u00e1ldozatul. Az \u00e9p\u00edtkez\u00e9sek elt\u00fcntetik a homokd\u00fbn\u00e9ket,
  valamint a v\u00e9d\u00f4 szerepet bet\u00f6lt\u00f4 v\u00edzparti n\u00f6v\u00e9nyzetet,
  a part \u00e1ll\u00e9konys\u00e1g\u00e1nak cs\u00f6kken\u00e9s\u00e9vel pedig megn\u00f4
  a parter\u00f3zi\u00f3, illetve az abr\u00e1zi\u00f3 hat\u00e9konys\u00e1ga. K\u00f6rnyezetszak\u00e9rt\u00f4k
  szerint a d\u00e9lkelet-\u00e1zsiai mangrove erd\u00f4k \u2013 amelyeket kiirtottak,
  hogy hely\u00fck\u00f6n t\u00f6bbek k\u00f6z\u00f6tt tengerparti turistaparadicsomokat
  l\u00e9tes\u00edtsenek \u2013 seg\u00edthettek volna a 2004. december 26-\u00e1n
  t\u00f6bb sz\u00e1zezer emberi \u00e9ltetet k\u00f6vetel\u00f4 \u00e9s hatalmas
  k\u00e1rokat okoz\u00f3 cunami megf\u00e9kez\u00e9s\u00e9ben. A katasztr\u00f3fa
  \u00f3ta sz\u00e1mos \u00e1zsiai orsz\u00e1gban v\u00e9dettnek tekintik a mangrove
  erd\u00f4ket, illetve \u00fajratelep\u00edt\u00e9ssel pr\u00f3b\u00e1lj\u00e1k \u00fajj\u00e1\u00e9leszteni
  a part menti term\u00e9szetes g\u00e1takat. A korallg\u00e1tak pusztul\u00e1s\u00e1val
  kapcsolatban hasonl\u00f3 jelens\u00e9get (3. \u00e9s 4. \u00e1bra) \u00edrtak le
  Kenya \u00f3ce\u00e1ni partvid\u00e9k\u00e9r\u00f4l (HOLDEN 2000), az er\u00f3zi\u00f3s
  k\u00e9rd\u00e9seken t\u00falmen\u00f4en komplexen v\u00e1zolva a turisztikai fejleszt\u00e9sek
  \u00e1ltal okozott probl\u00e9m\u00e1kat.\\n\\n4. \u00e1braA turisztikai fejleszt\u00e9se
  hat\u00e1sa tengerpartokon (H\\n\\nOLDEN\\n\\n2000)\\n\\nFigure 4. Effects of touristic
  developments on coasts (HOLDEN 2000)\\n\\nA Mediterr\u00e1neum tengerpartjainak
  jelent\u00f4s r\u00e9sze szenved a parter\u00f3zi\u00f3t\u00f3l. Az \u00f6sszesen
  18000 km hossz\u00fa parti ter\u00fcletnek \u00e1tlagosan 18%-\u00e1n komoly gondot
  okoz a partszeg\u00e9ly pusztul\u00e1sa. A szigetek partjai k\u00fcl\u00f6n\u00f6sen
  \u00e9rz\u00e9kenyek a puszt\u00edt\u00f3 er\u00f4kkel szemben. Az abr\u00e1zi\u00f3
  m\u00e9reteit jelzi az a becs\u00fclt adat, miszerint G\u00f6r\u00f6gorsz\u00e1g
  \u00e9vente elvesz\u00edt egy szigetet.\\n\\nId\u00f4vel persze maguk a turisztikai
  l\u00e9tes\u00edtm\u00e9nyek is v\u00e9delemre szorulnak a partok er\u00f3zi\u00f3ja
  miatt, ez\u00e9rt a t\u00e1jk\u00e9pet tov\u00e1bb ront\u00f3 v\u00e9d\u00f4falakat
  \u00e9p\u00edtenek. V\u00e9d\u00f4l\u00e9tes\u00edtm\u00e9nyekkel gyakran tal\u00e1lkozhatunk
  p\u00e9ld\u00e1ul az \u00c9szaki-tenger partjain\u00e1l. A v\u00e9delem egy m\u00e1sik,
  szint\u00e9n gyakran alkalmazott m\u00f3dja a tengerparti ter\u00fcletek felt\u00f6lt\u00e9se
  (D\u00c1VID \u00e9s SZIL\u00c1GYI 2006).\\n\\nA k\u00f6zelm\u00faltban t\u00f6bb
  olyan beruh\u00e1z\u00e1s is kezdet\u00e9t vette, amelyek tulajdonosai, a turizmusb\u00f3l
  sz\u00e1rmaz\u00f3 bev\u00e9telek n\u00f6vel\u00e9se \u00e9rdek\u00e9ben mesters\u00e9ges
  szigetcsoportokat \u00e9p\u00edttetnek a tengerbe, s ezzel soha nem l\u00e1tott
  m\u00e9retekben avatkoznak be a term\u00e9szeti k\u00f6rnyezet bonyolult rendszer\u00e9be.
  Az Arab Em\u00edrs\u00e9gek fennhat\u00f3s\u00e1ga al\u00e1 tartoz\u00f3 ter\u00fcleten,
  a The Palm, Jumeirah elnevez\u00e9s\u00fb mesters\u00e9ges szigetcsoport (5. \u00e1bra)
  t\u00e1rsaihoz hasonl\u00f3an p\u00e1lmafaalakban fog kin\u00f4ni a tengerpartb\u00f3l.
  8 km-es t\u00f6rzs\u00e9n luxus sz\u00e1llod\u00e1k, bev\u00e1s\u00e1rl\u00f3k\u00f6zpontok,
  mozik, sz\u00f3rakoz\u00f3helyek, 17 p\u00e1lma\u00e1g\u00e1n pedig lak\u00f3- \u00e9s
  irodah\u00e1zak tal\u00e1lhat\u00f3k majd. Az \u00e9p\u00edtm\u00e9ny elk\u00e9sz\u00fclt\u00e9t
  2006-ra tervezik. \u00c1m az em\u00edrs\u00e9g legexkluz\u00edvabb pihen\u00f4helye
  az a 250 mesters\u00e9ges szigetb\u00f4l \u00e1ll\u00f3 l\u00e9tes\u00edtm\u00e9ny
  lesz, amely 5 km-re fekszik majd Dubai partjait\u00f3l, s a f\u00f6ldg\u00f6mb\u00f6t
  mint\u00e1zza meg. A The World szigetcsoport szolg\u00e1ltat\u00e1sait 2008-t\u00f3l
  vehetik ig\u00e9nybe a vend\u00e9gek (HTTP://WWW.PALMSALES.CA).\\n\\nA t\u00e9li
  sportok k\u00f6rnyezeti hat\u00e1sai \u00e9s a kl\u00edmav\u00e1ltoz\u00e1s m\u00e1ris
  megfigyelhet\u00f4 k\u00f6vetkezm\u00e9nyei\\n\\nA vil\u00e1gszerte n\u00e9pszer\u00fb
  t\u00e9li sportok legkedveltebb c\u00e9lter\u00fcletei az Alpok, a Pireneusok, a
  Skandin\u00e1v-hegyvid\u00e9k, a K\u00e1rp\u00e1tok, az Andok, a Szikl\u00e1s-hegys\u00e9g,
  a Himal\u00e1ja, a Kauk\u00e1zus, valamint \u00daj-Z\u00e9land d\u00e9li szigete.
  Legkor\u00e1bban, az Alpokban terjedt el t\u00f6meges m\u00e9retekben a s\u00edel\u00e9s,
  \u00e9s annak nem k\u00edv\u00e1nt hat\u00e1sait is itt figyelt\u00e9k meg els\u00f4k\u00e9nt.
  A hegys\u00e9gek h\u00f3 bor\u00edtotta ter\u00fcleteit \u00e9vente mintegy 40\u201350
  milli\u00f3, a lesikl\u00e1s k\u00fcl\u00f6nb\u00f6z\u00f4 form\u00e1inak h\u00f3dol\u00f3
  vend\u00e9g keresi fel. A sportol\u00f3k kellemes id\u00f4t\u00f6lt\u00e9s\u00e9r\u00f4l
  k\u00f6r\u00fclbel\u00fcl 15000 felvon\u00f3 \u00e9s 40000 s\u00edp\u00e1lya (\u00f6sszhosszuk
  mintegy 120000 km!) gondoskodik (MARTONN\u00c9 2001). A s\u00edp\u00e1ly\u00e1k
  ki\u00e9p\u00edt\u00e9se sor\u00e1n el\u00f4sz\u00f6r kiv\u00e1gj\u00e1k a f\u00e1kat,
  majd a meredek lejt\u00f4ket buld\u00f3zerekkel, robbant\u00e1sokkal lefaragj\u00e1k,
  a lank\u00e1sabbakat felmagas\u00edtj\u00e1k, m\u00e1shol pedig elegyengetik a felsz\u00ednt.
  Az erd\u00f4k megsemmis\u00edt\u00e9s\u00e9vel megsz\u00fbnik a n\u00f6v\u00e9nyzet
  v\u00edzvisszatart\u00f3 hat\u00e1sa \u00e9s feler\u00f4s\u00f6dik a talajer\u00f3zi\u00f3.
  A gyorsan lefut\u00f3 olvad\u00e9k- \u00e9s csapad\u00e9kvizek a csupasz lejt\u00f4k
  felsz\u00edn\u00e9be er\u00f3zi\u00f3s bar\u00e1zd\u00e1kat, sz\u00e9ls\u00f4s\u00e9ges
  esetben er\u00f3zi\u00f3s \u00e1rkokat v\u00e9snek, de az elegyengetett, t\u00f6m\u00f6r\u00f6d\u00f6tt
  felsz\u00edneken gyakran are\u00e1lis lejt\u00f4le\u00f6bl\u00edt\u00e9s is t\u00f6rt\u00e9nik.
  A t\u00e9l elm\u00falt\u00e1val a f\u00e1kt\u00f3l megtiszt\u00edtott lejt\u00f4k\u00f6n
  akad\u00e1lytalanul lez\u00fadul\u00f3 v\u00edz gyakran okozhat l\u00e9tes\u00edtm\u00e9nyeket,
  s\u00f4t emberi \u00e9leteket vesz\u00e9lyeztet\u00f4 f\u00f6ldcsuszaml\u00e1sokkal
  k\u00eds\u00e9rt \u00e1rvizeket. A turisztikai infrastrukt\u00fara ki\u00e9p\u00edt\u00e9s\u00e9nek
  rov\u00e1s\u00e1ra \u00edrhat\u00f3 t\u00f6megmozg\u00e1sos folyamatokr\u00f3l Olaszorsz\u00e1gb\u00f3l,
  Sv\u00e1jcb\u00f3l \u00e9s Nep\u00e1lb\u00f3l is besz\u00e1moltak m\u00e1r (HOLDEN
  2000). Az intenz\u00edv turizmusnak k\u00f6sz\u00f6nhet\u00f4en, az Alpok ma a vil\u00e1g
  legs\u00e9r\u00fcl\u00e9kenyebb hegys\u00e9ge. A hotelek, a s\u00edp\u00e1ly\u00e1k
  infrastrukt\u00far\u00e1j\u00e1nak, valamint az \u00e9ttermeknek k\u00f6sz\u00f6nhet\u00f4en
  a t\u00e1j dr\u00e1maian megv\u00e1ltozott, sz\u00e9tt\u00f6redezett. MOSIMANN (1985)
  szerint a Sv\u00e1jciAlpokban a turizmus induk\u00e1lta m\u00f3dos\u00edtott ter\u00fcletek
  ar\u00e1nya el\u00e9ri a 15%-ot. Sv\u00e1jci s\u00edterepeken v\u00e9gzett vizsg\u00e1latai
  sor\u00e1n \u00fagy tal\u00e1lta, hogy az er\u00f3zi\u00f3 m\u00e9rt\u00e9k\u00e9t
  legink\u00e1bb a lejt\u00f4 form\u00e1ja, a talaj nedvess\u00e9gi \u00e1llapota,
  a lefoly\u00e1sok gyakoris\u00e1ga, valamint a v\u00edzgy\u00fbjt\u00f4ter\u00fclet
  nagys\u00e1ga hat\u00e1rozza meg.\\n\\nEgy v\u00e1rosi s\u00edp\u00e1lya, illetve
  a k\u00f6r\u00fcl\u00f6tte tal\u00e1lhat\u00f3 komplexum \u00e9vente t\u00f6bb ezer
  turist\u00e1t vonzhat (BALE 1989).\\n\\nAz \u00e9ghajlatv\u00e1ltoz\u00e1s m\u00e1ra
  megfigyelhet\u00f4v\u00e9 v\u00e1lt egyik jele az \u00e9vszakok eltol\u00f3d\u00e1sa,
  amely azokban az orsz\u00e1gokban a legl\u00e1tv\u00e1nyosabb, ahol a felmeleged\u00e9s
  m\u00e9rt\u00e9ke nagyobb. Eur\u00f3p\u00e1ban a tavasz 6\u20138 nappal el\u00f4bb,
  az \u00f4sz pedig \u00e1tlagosan h\u00e1rom nappal k\u00e9s\u00f4bb \u00e9rkezett
  az ut\u00f3bbi \u00e9vtizedben, mint a ''70-es \u00e9vekben. Ez a v\u00e1ltoz\u00e1s
  nemcsak az \u00f6kosziszt\u00e9m\u00e1kban okoz \u00e9szrevehet\u00f4 k\u00e1rokat,
  de komoly gazdas\u00e1gi k\u00f6vetkezm\u00e9nyekkel is j\u00e1rhat.\\n\\n6. \u00e1bra
  A Pasterze gleccser (Ausztria leghosszabb gleccsere a Grossglockner v\u00f6lgy\u00e9ben)
  Forr\u00e1s: HTTP://WWW.SIELOK.HU/FELMELEGEDES.HTM Figure 6. Pasterze Glacier (The
  longest glacier of Austria in the Grossglockner valley)\\n\\nA kl\u00edmav\u00e1ltoz\u00e1s
  magashegys\u00e9gekben jelentkez\u00f4, l\u00e9nyeg\u00e9ben szemmel is l\u00e1that\u00f3
  egyik jelens\u00e9ge a gleccserek olvad\u00e1sa. A folyamat \u00e9vezredek \u00f3ta
  nem tapasztalt, rendk\u00edv\u00fcl gyorsan v\u00e9gbemen\u00f4 v\u00e1ltoz\u00e1sokat
  mutat. A gleccserolvad\u00e1s az eg\u00e9sz vil\u00e1got \u00e9rinti. A World Glacier
  Monitoring Service vizsg\u00e1latai szerint 1980-t\u00f3l minden \u00e9vben, \u00e1tlagosan
  30 cm-t vesztenek a j\u00e9gvastags\u00e1gukb\u00f3l a gleccserek. A gleccserek
  elt\u00fbn\u00e9se az Alpokban k\u00fcl\u00f6n\u00f6sen j\u00f3l \u00e9szrevehet\u00f4
  (6. \u00e1bra). A XIX. sz\u00e1zad k\u00f6zep\u00e9t\u00f4l, vagyis az iparos\u00edt\u00e1st\u00f3l
  kezdve eg\u00e9szen 1975-ig \u00e1tlagosan fel\u00fclet\u00fck harmada t\u00fbnt
  el, t\u00f6meg\u00fcknek pedig mintegy fele. Az\u00f3ta tov\u00e1bbi 20\u201330%-ot
  vesz\u00edtettek a t\u00f6meg\u00fckb\u00f4l. A kutat\u00f3k \u00fagy sz\u00e1molj\u00e1k,
  hogy 2050 ut\u00e1n h\u00e1romnegyed r\u00e9sz\u00fcket fogj\u00e1k elveszteni (HTTP://WWW.SIELOK.HU).
  A zugspitzei gleccser mostanra eredeti ter\u00fclet\u00e9nek kb. 90%-\u00e1t elvesztette.\\n\\nA
  kor\u00e1bbiakhoz k\u00e9pest a m\u00e1sik jelent\u00f4s v\u00e1ltoz\u00e1st a permafrost
  meleg nyarak okozta egyre alacsonyabb tengerszint feletti magass\u00e1gban t\u00f6rt\u00e9n\u00f4
  felolvad\u00e1sa jelenti. Ez az Alpokban kor\u00e1bban nagyj\u00e1b\u00f3l 2800
  m-t\u00f4l jelentkezett, azonban az elm\u00falt 100 \u00e9vben 150\u2013200 m\u00e9tert
  felfel\u00e9 k\u00faszott. Kor\u00e1bban stabil sziklaoldalak v\u00e1ltak a j\u00e9g
  folyamatos olvad\u00e1sa miatt \u2013 t\u00f6bbek k\u00f6z\u00f6tt \u2013 a s\u00edel\u00f4ket,
  mag\u00e1t a s\u00edterepet \u00e9s az ahhoz kapcsol\u00f3d\u00f3 \u00e9p\u00fcleteket
  \u00e9s a s\u00edfelvon\u00f3kat is vesz\u00e9lyeztet\u00f4 t\u00e9nyez\u00f4v\u00e9.\\n\\nHasonl\u00f3an
  l\u00e1tv\u00e1nyos v\u00e1ltoz\u00e1s ment v\u00e9gbe a h\u00f3vastags\u00e1g tekintet\u00e9ben.
  P\u00e9ldak\u00e9nt eml\u00edthet\u00f4 az osztr\u00e1k Sonnblicken, ahol az 1940-es
  \u00e9vekben m\u00e9rt\u00e9k a legnagyobb h\u00f3vastags\u00e1got; ez 11 m\u00e9ter
  volt. De az \u00e1tlagos teleken is 6\u20138 m volt a jellemz\u00f4. Ez az \u00e9rt\u00e9k
  az\u00f3ta folyamatosan cs\u00f6kken, k\u00fcl\u00f6n\u00f6sen az elm\u00falt \u00e9vekben,
  pl. 2005-ben mind\u00f6ssze 260 cm k\u00f6r\u00fcl mozgott (HTTP://WWW.SIELOK.HU).\\n\\nA
  h\u00f3vastags\u00e1g drasztikus m\u00e9ret\u00fb, az ut\u00f3bbi \u00e9vekben felgyorsult,
  cs\u00f6kken\u00e9s\u00e9nek els\u00f4dleges oka a magas ny\u00e1ri l\u00e9gh\u00f4m\u00e9rs\u00e9kleti
  \u00e9rt\u00e9kekkel magyar\u00e1zhat\u00f3. A 2003. augusztus\u00e1ban Pitztalon
  (3440 m magass\u00e1gban) m\u00e9rt +9 \u00b0C a kor\u00e1bban a ny\u00e1ri s\u00edel\u00e9s
  helysz\u00edn\u00e9\u00fcl szolg\u00e1l\u00f3 s\u00edparadicsomok l\u00e9t\u00e9t
  vesz\u00e9lyezteti. A 90-es \u00e9vekben sorra z\u00e1rtak be a kor\u00e1bban eg\u00e9sz
  \u00e9vben nyitva tart\u00f3 gleccserterepek (Pitztal, Marmolada, Corvatsch, stb.;
  HTTP://WWW.SIELOK.HU).\\n\\nA s\u00edturizmus j\u00f6v\u00f4je\\n\\nGALLARZA et
  al. (2002) a turisztikai c\u00e9lpontok kiv\u00e1laszt\u00e1s\u00e1nak h\u00fasz
  t\u00e9nyez\u00f4je k\u00f6z\u00fcl az \u00e9ghajlatot a hetedik helyre rangsorolta.
  Sz\u00e1mos turisztikai c\u00e9lpont eset\u00e9ben a legf\u00f4bb probl\u00e9m\u00e1t
  jelent\u00f4 szezon\u00e1lis jelleg \u00e1ltal\u00e1ban klimatikus meghat\u00e1rozotts\u00e1g\u00fa,
  \u00edgy ez a felt\u00e9tel az idegenforgalomban alapvet\u00f4 k\u00e9rd\u00e9snek
  tekinthet\u00f4.\\n\\nEgy turisztikai c\u00e9lpont vonzerej\u00e9t jelenthetik annak
  fizikai jellemz\u00f4i (term\u00e9szeti adotts\u00e1gai), az ott v\u00e9gezhet\u00f4
  tev\u00e9kenys\u00e9gek k\u00f6re (idegenforgalmi \u00e1gazat), az arr\u00f3l a
  l\u00e1togat\u00f3k k\u00f6r\u00e9ben kialakult k\u00e9p, valamint ezek \u00f6sszess\u00e9ge
  (7. \u00e1bra). A turisztikai term\u00e9kek jelent\u00f4s r\u00e9sze bizonyos \u00e9ghajlati
  k\u00f6r\u00fclm\u00e9nyekhez kapcsol\u00f3dik, \u00edgy a megv\u00e1ltozott viszonyok
  k\u00f6z\u00f6tt cs\u00f6kkenhet bizonyos term\u00e9kek n\u00e9pszer\u00fbs\u00e9ge,
  a term\u00e9k min\u00f4s\u00e9g\u00e9nek fenntart\u00e1sa saj\u00e1tos kih\u00edv\u00e1sok
  el\u00e9 \u00e1ll\u00edthatja a turizmus szektort, sz\u00e9ls\u00f4s\u00e9ges esetekben
  pedig egyszer\u00fben elt\u00fbnhet a term\u00e9k alapj\u00e1ul szolg\u00e1l\u00f3
  klimatikus felt\u00e9telrendszer (R\u00c1TZ 2006). K\u00fcl\u00f6n\u00f6sen igaz
  lehet ez a nagym\u00e9rt\u00e9kben kl\u00edmaf\u00fcgg\u00f4, alapvet\u00f4en a
  term\u00e9szeti attrakci\u00f3kra \u00e9p\u00fcl\u00f4 szabadt\u00e9ri turisztikai
  tev\u00e9kenys\u00e9gekre.\\n\\nEnnek s\u00e9r\u00fcl\u00e9se a pihen\u00e9sben,
  rekre\u00e1ci\u00f3ban val\u00f3 r\u00e9szv\u00e9tel egyik akad\u00e1ly\u00e1v\u00e1
  v\u00e1lhat, amelynek eredm\u00e9nyek\u00e9pp az adott desztin\u00e1ci\u00f3 vesz\u00edthet
  prefer\u00e1lts\u00e1g\u00e1b\u00f3l. Ez a folyamat \u00f6nmag\u00e1ban is v\u00e9gbemehet
  (7. \u00e1bra). J\u00f3 p\u00e9lda lehet erre, hogy a h\u00f3hat\u00e1r nagyobb
  tengerszint f\u00f6l\u00f6tti magass\u00e1gokba h\u00faz\u00f3d\u00e1sa miatt a
  s\u00edelni v\u00e1gy\u00f3k kisebb ter\u00fcletre lesznek k\u00e9nytelenek koncentr\u00e1l\u00f3dni.
  Ezzel egyfel\u00f4l a jelenlegihez k\u00e9pest, mivel \u2013 eltart\u00f3- \u00e9s
  t\u00fbr\u00f4k\u00e9pess\u00e9g\u00fck j\u00f3val alacsonyabb \u2013 n\u00f4ni
  fog ezek terhel\u00e9se, ami r\u00f6vid- vagy k\u00f6z\u00e9pt\u00e1von vezethet
  a ter\u00fclet degrad\u00e1l\u00f3d\u00e1s\u00e1hoz, m\u00e1sfel\u00f4l a nagyobb
  zs\u00fafolts\u00e1g ronthatja pl. a n\u00e9pszer\u00fbbb s\u00edparadicsomokr\u00f3l
  kialakult k\u00e9pet.\\n\\nHossz\u00fat\u00e1v\u00fa el\u00f4rejelz\u00e9sek szerint
  a m\u00e9rs\u00e9kelt \u00f6vben kiz\u00e1r\u00f3lag a magashegys\u00e9gekben lehet
  majd s\u00edzni. Az utaz\u00e1si c\u00e9lpontokn\u00e1l el\u00f4t\u00e9rbe ker\u00fclhet
  Skandin\u00e1via, Gr\u00f6nland vagy \u00e9ppen Szib\u00e9ria r\u00e9szei (ut\u00f3bbi
  k\u00e9t helyen nincs ki\u00e9p\u00edtett s\u00edp\u00e1lyarendszer). Az is elk\u00e9pzelhet\u00f4,
  hogy 30\u201350 \u00e9v m\u00falva m\u00e1r csak 1600\u20132000 m k\u00f6z\u00f6tti
  s\u00edterepek lesznek h\u00f3biztosak (HTTP://WWW.SIELOK.HU).\\n\\nA hagyom\u00e1nyos
  eur\u00f3pai c\u00e9lpontok k\u00f6z\u00fcl a Sv\u00e1jcban tal\u00e1lhat\u00f3
  230 s\u00edterepnek m\u00e1r csak a 44%-a fog h\u00f3biztosnak sz\u00e1m\u00edtani.
  Az olasz s\u00edterepek, melyek fele 1300 m-t\u00f4l kezd\u00f4dik, a j\u00f6v\u00f4ben
  komoly h\u00f3hi\u00e1nnyal k\u00fczdhetnek, de N\u00e9metorsz\u00e1gban is sok
  esetben komoly probl\u00e9m\u00e1t jelenthet, hogy a csapad\u00e9k \u2013 egyre
  nagyobb ar\u00e1nyban h\u00f3 helyett es\u00f4 form\u00e1j\u00e1ban fog hullani.\\n\\nK\u00fcl\u00f6n\u00f6sen
  \u00e9rdekes probl\u00e9m\u00e1t vet fel a nagyobb t\u00f6megrendezv\u00e9nyek,
  pl. a T\u00e9li Olimpiai J\u00e1t\u00e9kok helysz\u00edn\u00e9nek kiv\u00e1laszt\u00e1sa,
  illetve azok lebonyol\u00edt\u00e1sa (SCOTT et al. 2005). Az \u00e9ghajlat j\u00f6v\u00f4beni
  v\u00e1ltoz\u00e1s\u00e1t el\u00f4rejelz\u00f4 tendenci\u00e1kat a Nemzetk\u00f6zi
  Olimpiai Bizotts\u00e1g is nyomon k\u00f6veti, a helysz\u00ednek kiv\u00e1laszt\u00e1s\u00e1n\u00e1l
  pedig az egyik lehets\u00e9ges szempont lehet az adott ter\u00fclet k\u00f6rnyezeti
  \u00e9rz\u00e9kenys\u00e9ge. A szerz\u00f4k hat, volt \u00e9s leend\u00f4 \u00e9szak-amerikai
  helysz\u00edn eset\u00e9ben v\u00e9geztek vizsg\u00e1latokat. Meg\u00e1llap\u00edtott\u00e1k,
  hogy az \u00e9ghajlatv\u00e1ltoz\u00e1s \u00f6sszess\u00e9g\u00e9ben kev\u00e9s
  hat\u00e1st fog gyakorolni a v\u00e1lasztott t\u00e9rs\u00e9gekben: a 2050-es \u00e9vekig
  a febru\u00e1r havi s\u00edel\u00e9sre alkalmas napok sz\u00e1ma az 1961\u20131990
  k\u00f6z\u00f6tti id\u00f4szakhoz k\u00e9pest \u2013 a legmelegebb scen\u00e1ri\u00f3t
  v\u00e9ve figyelembe \u2013 maximum k\u00e9tnapos cs\u00f6kken\u00e9st (\u00edgy
  \u00f6sszesen 26\u201328 nap) mutat.\\n\\nL\u00e9nyegesen m\u00e1s k\u00e9p rajzol\u00f3dik
  ki azonban, ha a s\u00edszezon \u00e1tlagos hossz\u00e1ban bek\u00f6vetkezett v\u00e1ltoz\u00e1sokat
  vessz\u00fck figyelembe (1. t\u00e1bl\u00e1zat). Itt a 2020-as \u00e9vekig a \u201elegrosszabb\\\"
  forgat\u00f3k\u00f6nyvet figyelembe v\u00e9ve is maxim\u00e1lisan 3%-os cs\u00f6kken\u00e9s
  prognosztiz\u00e1lhat\u00f3. A 2050-es \u00e9vekre azonban ez az ar\u00e1ny \u2013
  els\u00f4sorban az alacsonyabb f\u00f6ldrajzi sz\u00e9less\u00e9geken, \u00e9s a
  kisebb tengerszint f\u00f6l\u00f6tti magass\u00e1gokon drasztikusan n\u00f4het,
  \u00e9s el\u00e9rheti a 17%-ot is. Ezek alapj\u00e1n, az egyes versenysz\u00e1mok
  (k\u00fcl\u00f6n\u00f6sen a lesikl\u00e1s) sikeres lebonyol\u00edt\u00e1s\u00e1hoz
  h\u00f3g\u00e9pek haszn\u00e1lata l\u00e1tszik sz\u00fcks\u00e9gesnek.\\n\\n1. t\u00e1bl\u00e1zat
