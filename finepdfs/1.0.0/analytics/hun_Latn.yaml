  karnagy\\n\\nK\u00edv\u00e1natos tov\u00e1bb\u00e1 a hossz\u00fa t\u00e1v\u00fa
  tudom\u00e1nyos programok form\u00e1l\u00f3d\u00e1sa \u00e9rdek\u00e9ben, hogy a
