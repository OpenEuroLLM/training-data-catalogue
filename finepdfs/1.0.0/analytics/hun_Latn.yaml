  \u00e9s felold\u00e1s\u00e1nak el\u0151seg\u00edt\u00e9se, seg\u00edts\u00e9gny\u00fajt\u00e1s
  szoci\u00e1lis probl\u00e9m\u00e1k miatt vesz\u00e9lyeztetett, ill. kr\u00edzishelyzetben
  l\u00e9v\u0151 szem\u00e9lyeknek, csal\u00e1doknak.  A gyermek testi, lelki eg\u00e9szs\u00e9g\u00e9nek
  , csal\u00e1dban t\u00f6rt\u00e9n\u0151 nevel\u00e9s\u00e9nek seg\u00edt\u00e9se;
  a gyermek vesz\u00e9lyeztetetts\u00e9g\u00e9nek megel\u0151z\u00e9se, megsz\u00fcntet\u00e9se
  ; a vesz\u00e9lyeztetetts\u00e9get  \u00e9szlel\u0151 \u00e9s jelz\u0151 hat\u00e9kony
  inform\u00e1ci\u00f3s rendszer m\u0171k\u00f6dtet\u00e9se. Helyettes  sz\u00fcl\u0151i
  h\u00e1l\u00f3zat m\u0171k\u00f6dtet\u00e9s\u00e9vel biztos\u00edtja  a csal\u00e1dban
  \u00e9l\u0151 gyermek \u00e1tmeneti gondoz\u00e1s\u00e1t , nevel\u00e9s\u00e9t.\\n\\n4.4.
  A k\u00f6lts\u00e9gvet\u00e9si szerv alaptev\u00e9kenys\u00e9g\u00e9nek korm\u00e1nyzati
  funkci\u00f3 szerinti megjel\u00f6l\u00e9se:\\n\\n|  | korm\u00e1nyzati funkci\u00f3sz\u00e1m
  | korm\u00e1nyzati funkci\u00f3 megnevez\u00e9se |\\n|---|---|---|\\n| 1 | 041231
  | R\u00f6vid id\u0151tartam\u00fa k\u00f6zfoglalkoztat\u00e1s |\\n\\n| 2 | 041232
  |\\n|---|---|\\n| 3 | 041233 |\\n| 4 | 041236 |\\n| 5 | 041237 |\\n| 6 | 104012
  |\\n| 7 | 104042 |\\n| 8 | 106020 |\\n| 9 | 107054 |\\n\\n4.5. A k\u00f6lts\u00e9gvet\u00e9si
  szerv illet\u00e9kess\u00e9ge, m\u0171k\u00f6d\u00e9si ter\u00fclete:\\n\\nc.) a
  csal\u00e1dseg\u00edt\u00e9s \u00e9s a gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1s
  eset\u00e9ben a Szentgotth\u00e1rdi j\u00e1r\u00e1s k\u00f6zigazgat\u00e1si ter\u00fclete
  \u2013 Szentgotth\u00e1rd, Gasztony,Vasszentmih\u00e1ly, Nemesmedves, R\u00f6n\u00f6k,
  R\u00e1bagyarmat , R\u00e1t\u00f3t, Cs\u00f6r\u00f6tnek, Magyarlak, Als\u00f3sz\u00f6ln\u00f6k,
  Fels\u0151sz\u00f6ln\u00f6k, Szakonyfalu, Ap\u00e1tistv\u00e1nfalva, Orfalu, K\u00e9tv\u00f6lgy,
  Kondorfa telep\u00fcl\u00e9sek.\\nd.) a nem foglalkozatott szem\u00e9lyek beilleszked\u00e9s\u00e9nek
  el\u0151seg\u00edt\u00e9se szolg\u00e1ltat\u00e1s tekintet\u00e9ben a Szentgotth\u00e1rdi
  j\u00e1r\u00e1s k\u00f6zigazgat\u00e1si ter\u00fclete Szentgotth\u00e1rd, Gasztony,Vasszentmih\u00e1ly,
  Nemesmedves, R\u00f6n\u00f6k, R\u00e1bagyarmat , R\u00e1t\u00f3t, Cs\u00f6r\u00f6tnek,
  Magyarlak, Als\u00f3sz\u00f6ln\u00f6k, Fels\u0151sz\u00f6ln\u00f6k, Szakonyfalu,
  Ap\u00e1tistv\u00e1nfalva, Orfalu, K\u00e9tv\u00f6lgy, Kondorfa telep\u00fcl\u00e9sek.\\ne.)
  az a.) \u00e9s b.) pontokhoz nem tartoz\u00f3 szolg\u00e1ltat\u00e1sok tekintet\u00e9ben
  kiz\u00e1r\u00f3lag Szentgotth\u00e1rd V\u00e1ros k\u00f6zigazgat\u00e1si ter\u00fclete\\n\\n5.
  A k\u00f6lts\u00e9gvet\u00e9si szerv szervezete \u00e9s m\u0171k\u00f6d\u00e9se\\n\\n5.1.
  A k\u00f6lts\u00e9gvet\u00e9si szerv vezet\u0151j\u00e9nek megb\u00edz\u00e1si rendje:
  Az int\u00e9zm\u00e9ny vezet\u0151j\u00e9t a Szentgotth\u00e1rd \u00e9s T\u00e9rs\u00e9ge
  \u00d6nkorm\u00e1nyzati  T\u00e1rsul\u00e1s T\u00e1rsul\u00e1si Tan\u00e1csa nevezi
  ki, az egy\u00e9b munk\u00e1ltat\u00f3i jogk\u00f6rt a T\u00e1rsul\u00e1s eln\u00f6ke
  gyakorolja.\\n\\n5.2. A k\u00f6lts\u00e9gvet\u00e9si szervn\u00e9l alkalmaz\u00e1sban
  \u00e1ll\u00f3 szem\u00e9lyek jogviszonya:\\n\\n|  | foglalkoztat\u00e1si jogviszony
  |\\n|---|---|\\n| 1 | k\u00f6zalkalmazotti jogviszony |\\n| 2 | k\u00f6zfoglalkoztatotti
  jogviszony |\\n\\n6. Z\u00e1r\u00f3 rendelkez\u00e9s\\n\\nJelen alap\u00edt\u00f3
  okiratot a t\u00f6rzsk\u00f6nyvi nyilv\u00e1ntart\u00e1sba t\u00f6rt\u00e9n\u0151
  bejegyz\u00e9s napj\u00e1t\u00f3l kell alkalmazni, ezzel egyidej\u0171leg a k\u00f6lts\u00e9gvet\u00e9si
  szerv 2013.08.15. napj\u00e1n kelt alap\u00edt\u00f3 okiratot visszavonom.\\n\\nAz
  \u00e1llamh\u00e1ztart\u00e1sr\u00f3l sz\u00f3l\u00f3 t\u00f6rv\u00e9ny v\u00e9grehajt\u00e1s\u00e1r\u00f3l
  sz\u00f3l\u00f3 368/2011. (XII. 31.) Korm. rendelet 5. \u00a7 (4) bekezd\u00e9se
  alapj\u00e1n a Magyar \u00c1llamkincst\u00e1r nev\u00e9ben igazolom, hogy jelen
  alap\u00edt\u00f3 okirat m\u00f3dos\u00edt\u00e1sokkal egys\u00e9ges szerkezetbe
  foglalt sz\u00f6vege megfelel az alap\u00edt\u00f3 okiratnak a Csal\u00e1dseg\u00edt\u0151
  \u00e9s Gyermekj\u00f3l\u00e9ti K\u00f6zpont  Szentgotth\u00e1rd 2015. december\u2026
  napj\u00e1n kelt, 2016.01.01. napj\u00e1t\u00f3l alkalmazand\u00f3 1677-3/2015.
  okiratsz\u00e1m\u00fa m\u00f3dos\u00edt\u00f3 okirattal v\u00e9grehajtott m\u00f3dos\u00edt\u00e1sa
  szerinti tartalm\u00e1nak.\\n\\nKelt: Szombathely, 2015. december \u2026.\\n\\nP.H.\\n\\nMagyar
  \u00c1llamkincst\u00e1r\\n\\nEl\u0151terjeszt\u00e9s a Szentgotth\u00e1rd \u00e9s
  T\u00e9rs\u00e9ge \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1s T\u00e1rsul\u00e1si
  Tan\u00e1cs\u00e1nak 2015. okt\u00f3ber 29-i \u00fcl\u00e9s\u00e9re\\n\\nT\u00e1rgy:
  Csal\u00e1dseg\u00edt\u00e9s-gyermekj\u00f3l\u00e9ti feladatell\u00e1t\u00e1s /
  Kondorfa csatlakoz\u00e1si sz\u00e1nd\u00e9ka\\n\\nTisztelt T\u00e1rsul\u00e1si
  Tan\u00e1cs!\\n\\nIII. CSAL\u00c1DSEG\u00cdT\u0150 \u00c9S GYERMEKJ\u00d3L\u00c9TI
  SZOLG\u00c1LAT V\u00c1LTOZ\u00c1SOK\\n\\nAz Orsz\u00e1ggy\u0171l\u00e9s 2015. j\u00falius  6-i
  \u00fcl\u00e9s\u00e9n  elfogadta az egyes szoci\u00e1lis gyermekv\u00e9delmi t\u00e1rgy\u00fa
  t\u00f6rv\u00e9nyek m\u00f3dos\u00edt\u00e1s\u00e1r\u00f3l sz\u00f3l\u00f3 2015.
  \u00e9vi CXXXIII t\u00f6rv\u00e9nyt. A jogszab\u00e1ly \u00e9rtelm\u00e9ben a csal\u00e1dseg\u00edt\u00e9s
  csak gyermekj\u00f3l\u00e9ti  szolg\u00e1ltat\u00e1ssal integr\u00e1ltan - egy szervezeti
  \u00e9s szakmai egys\u00e9gben \u2013 m\u0171k\u00f6dhet 2016.  janu\u00e1r 1-j\u00e9t\u0151l:  telep\u00fcl\u00e9si  szinten  a  csal\u00e1d-
  \u00e9s gyermekj\u00f3l\u00e9ti szolg\u00e1lat, j\u00e1r\u00e1si szinten a csal\u00e1d-\u00e9s
  gyermekj\u00f3l\u00e9ti k\u00f6zpont keret\u00e9ben. Mindkett\u0151 szolg\u00e1ltat\u00e1s
  tov\u00e1bbra is \u00f6nkorm\u00e1nyzati feladat marad. Ennek alapj\u00e1n  a csal\u00e1d-\u00e9s
  gyermekj\u00f3l\u00e9ti szolg\u00e1lat, illetve k\u00f6zpont a jelenlegi csal\u00e1dseg\u00edt\u00e9s
  \u00e9s gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1s b\u00e1zis\u00e1n j\u00f6n
  l\u00e9tre. Az integr\u00e1ci\u00f3b\u00f3l fakad\u00f3 feladatok ell\u00e1t\u00e1sa
  rendszeren bel\u00fcli er\u0151forr\u00e1s \u00e1tcsoportos\u00edt\u00e1ssal t\u00f6rt\u00e9nhet.
  Az \u00faj rendelkez\u00e9sek hat\u00e1lyba  l\u00e9p\u00e9si id\u0151pontja 2016.
  janu\u00e1r elseje.\\n\\nAz \u00faj int\u00e9zm\u00e9nyek \u00e1ltal ell\u00e1tand\u00f3
  csal\u00e1dseg\u00edt\u00e9s feladatait tov\u00e1bbra is a szoci\u00e1lis igazgat\u00e1sr\u00f3l
  \u00e9s szoci\u00e1lis ell\u00e1t\u00e1sokr\u00f3l sz\u00f3l\u00f3 1993. \u00e9vi
  III. t\u00f6rv\u00e9ny , a gyermekj\u00f3l\u00e9ti szolg\u00e1lat \u00e9s  a k\u00f6zpont
  feladatait pedig a gyermekek v\u00e9delm\u00e9r\u0151l \u00e9s a gy\u00e1m\u00fcgyi
  igazgat\u00e1sr\u00f3l sz\u00f3l\u00f3 1997. \u00e9vi XXXI. t\u00f6rv\u00e9ny tartalmazza.
  Sajnos a k\u00e9t t\u00f6rv\u00e9ny szakmai v\u00e9grehajt\u00e1si rendelete m\u00e9g
  nem jelent meg.\\n\\nA jogszab\u00e1lyokb\u00f3l ad\u00f3d\u00f3 v\u00e1ltoz\u00e1sok:\\n\\n-
  A feladat-ell\u00e1t\u00e1si k\u00f6telezetts\u00e9g m\u00f3dosul: a csal\u00e1dseg\u00edt\u00e9s
  \u00e9s a gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1s biztos\u00edt\u00e1sa m\u00e1r
  nem  lakoss\u00e1gsz\u00e1mhoz k\u00f6t\u00f6tt, hanem minden esetben biztos\u00edtani
  kell az \u00f6nkorm\u00e1nyzatnak a szolg\u00e1latot, ha polg\u00e1rmesteri hivatalt
  m\u0171k\u00f6dtet vagy ha a k\u00f6z\u00f6s \u00f6nkorm\u00e1nyzati hivatal sz\u00e9khelye
  a telep\u00fcl\u00e9sen van, akkor a k\u00f6z\u00f6s hivatalhoz tartoz\u00f3 telep\u00fcl\u00e9sek
  vonatkoz\u00e1s\u00e1ban (Szt. 86.\u00a7 (1) a) pont \u00e9s Gyvt.94.\u00a7 (2a)
  bekezd\u00e9s).\\n- A j\u00e1r\u00e1ssz\u00e9khely telep\u00fcl\u00e9s szint\u00e9n
  lakoss\u00e1gsz\u00e1mt\u00f3l f\u00fcggetlen\u00fcl k\u00f6teles gyermekj\u00f3l\u00e9ti
  k\u00f6zpontot m\u0171k\u00f6dtetni, amelynek ell\u00e1t\u00e1si ter\u00fclete a
  j\u00e1r\u00e1s lakoss\u00e1g\u00e1ra terjed ki (Gyvt. 94.\u00a7 (4) bekezd\u00e9s)
  A j\u00e1r\u00e1sk\u00f6zpont telep\u00fcl\u00e9si \u00f6nkorm\u00e1nyzat\u00e1nak
  \u00f6n\u00e1ll\u00f3 szakmai egys\u00e9gben kell a csal\u00e1d-\u00e9s gyermekj\u00f3l\u00e9ti
  szolg\u00e1lat \u00e9s a csal\u00e1d-\u00e9s gyermekj\u00f3l\u00e9ti k\u00f6zpont
  feladatait biztos\u00edtani. A j\u00e1r\u00e1sk\u00f6zpont  telep\u00fcl\u00e9si
  \u00f6nkorm\u00e1nyzat\u00e1nak egy m\u0171k\u00f6d\u00e9si enged\u00e9lye lesz
  a k\u00e9t feladat ell\u00e1t\u00e1sra.\\n- A hat\u00f3s\u00e1gi feladatokhoz kapcsol\u00f3d\u00f3,
  gyermekek v\u00e9delm\u00e9re ir\u00e1nyul\u00f3 tev\u00e9kenys\u00e9gek, valamint
  a speci\u00e1lis szolg\u00e1ltat\u00e1sok biztos\u00edt\u00e1sa a j\u00e1r\u00e1ssz\u00e9khely
  telep\u00fcl\u00e9si \u00f6nkorm\u00e1nyzatokhoz ker\u00fcl. A j\u00e1r\u00e1ssz\u00e9khely
  telep\u00fcl\u00e9sen m\u0171k\u00f6d\u0151 szolg\u00e1ltat\u00f3 illet\u00e9kess\u00e9gi
  ter\u00fclete a hat\u00f3s\u00e1gi feladatokhoz kapcsol\u00f3d\u00f3 szolg\u00e1ltat\u00e1sok,
  valamint a speci\u00e1lis szolg\u00e1ltat\u00e1sok vonatkoz\u00e1s\u00e1ban kiterjed
  a j\u00e1r\u00e1st alkot\u00f3  telep\u00fcl\u00e9sek lakoss\u00e1g\u00e1ra.\\n-
  Tekintettel arra, hogy a csal\u00e1dseg\u00edt\u00e9s \u00e9s a gyermekj\u00f3l\u00e9ti
  szolg\u00e1ltat\u00e1s 2016. janu\u00e1r 1-j\u00e9t\u0151l kiz\u00e1r\u00f3lag egy
  szolg\u00e1ltat\u00f3 keret\u00e9ben m\u0171k\u00f6dtethet\u0151, eddig az id\u0151pontig
  sz\u00fcks\u00e9ges az \u00faj  szab\u00e1lyok szerinti feladat-ell\u00e1t\u00e1si
  k\u00f6telezetts\u00e9ggel b\u00edr\u00f3 \u00f6nkorm\u00e1nyzatoknak l\u00e9trehozniuk
  az \u00faj int\u00e9zm\u00e9nyeket, vagy  a sz\u00fcks\u00e9ges \u00e1talak\u00edt\u00e1sokat
  elv\u00e9gezni\u00fck.\\n\\nEzek alapj\u00e1n a telep\u00fcl\u00e9si \u00f6nkorm\u00e1nyzat
  feladatai:\\n\\n- 2015. okt\u00f3ber 31-ig fel\u00fcl kell vizsg\u00e1lni a csal\u00e1dseg\u00edt\u00e9s
  , illetve a gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1si feladatok ell\u00e1t\u00e1s\u00e1nak
  m\u00f3dj\u00e1t, szervezeti kereteit \u00e9s az e feladatok biztos\u00edt\u00e1s\u00e1ra
  k\u00f6t\u00f6tt ell\u00e1t\u00e1si szerz\u0151d\u00e9st, vagy szerz\u0151d\u00e9seket.
  2016. janu\u00e1r elsej\u00e9t\u0151l a csal\u00e1dseg\u00edt\u00e9s egy int\u00e9zm\u00e9ny
  keret\u00e9ben , csal\u00e1d-\u00e9s gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1sk\u00e9nt
  kell m\u0171k\u00f6dj\u00f6n, \u00edgy d\u00f6ntenie kell az \u00f6nkorm\u00e1nyzatoknak,
  hogy saj\u00e1t int\u00e9zm\u00e9nye \u00fatj\u00e1n vagy ell\u00e1t\u00e1si szerz\u0151d\u00e9ssel
  biztos\u00edtja a j\u00f6v\u0151ben a feladatell\u00e1t\u00e1st, de megosztani nem
  lehet ezeket a feladatokat!\\n- Az ell\u00e1t\u00e1si szerz\u0151d\u00e9sek kapcs\u00e1n
  fontos kiemelni, hogy az \u00faj jogszab\u00e1ly  2016. janu\u00e1r 1-j\u00e9t\u0151l  m\u00e1r
  nem engedi a csal\u00e1d \u2013 \u00e9s gyermekj\u00f3l\u00e9ti k\u00f6zpont feladatainak  egyh\u00e1zi
  fenntart\u00f3val \u00e9s nem \u00e1llami fenntart\u00f3val k\u00f6t\u00f6tt ell\u00e1t\u00e1si
  szerz\u0151d\u00e9s \u00fatj\u00e1n t\u00f6rt\u00e9n\u0151 biztos\u00edt\u00e1s\u00e1t!\\n-
  Tov\u00e1bbra is lehets\u00e9ges a t\u00e1rsul\u00e1s \u00fatj\u00e1n t\u00f6rt\u00e9n\u0151
  feladatell\u00e1t\u00e1s- mind a szolg\u00e1lat, mind a k\u00f6zpont tekintet\u00e9ben.
  A szolg\u00e1lat vonatkoz\u00e1s\u00e1ban t\u00e1rsul\u00e1si form\u00e1ban t\u00f6rt\u00e9n\u0151
  feladatell\u00e1t\u00e1s eset\u00e9ben figyelemmel kell lenni arra, hogy nem lehet
  a k\u00f6z\u00f6s hivatalok egys\u00e9g\u00e9t bontani.\\n- A telep\u00fcl\u00e9si
  \u00f6nkorm\u00e1nyzatok 2015. november 30-ig  d\u00f6ntenek a feladatell\u00e1t\u00e1s  \u00faj
  rendelkez\u00e9seknek megfelel\u0151 biztos\u00edt\u00e1sa m\u00f3dj\u00e1r\u00f3l,
  \u00e9s ezen  id\u0151pontig k\u00e9relmezni\u00fck kell szolg\u00e1ltat\u00f3i
  nyilv\u00e1ntart\u00e1sba bejegyzett adatok m\u00f3dos\u00edt\u00e1s\u00e1t.\\n\\nA
  szentgotth\u00e1rdi kist\u00e9rs\u00e9g telep\u00fcl\u00e9sein m\u00e1r r\u00e9g\u00f3ta
  a Csal\u00e1dseg\u00edt\u0151 \u00e9s Gyermekj\u00f3l\u00e9ti Szolg\u00e1lat l\u00e1tja
  el ezeket a feladatokat, 2015. \u00f3ta pedig k\u00f6zvetlen\u00fcl a T\u00e1rul\u00e1s
  a fenntart\u00f3ja az int\u00e9zm\u00e9nynek. A fentiek alapj\u00e1n a feladatell\u00e1t\u00e1s,
  ezzel egy\u00fctt a fenntart\u00e1s szerkezete / m\u00f3dja maradhat ugyanebben
  a form\u00e1ban azzal, hogy a tov\u00e1bbiakban \u201eK\u00f6zpontk\u00e9nt\\\"
  m\u0171k\u00f6dhet az int\u00e9zm\u00e9ny. Ami v\u00e1ltozna:\\n\\n k\u00f6zpontk\u00e9nt
  m\u0171k\u00f6dik tov\u00e1bb az int\u00e9zm\u00e9ny, \u00e9s a szolg\u00e1lat feladatait
  is ell\u00e1tja majd,\\n az int\u00e9zm\u00e9nyen bel\u00fcl \u00f6n\u00e1ll\u00f3
  szakmai egys\u00e9gben kell a csal\u00e1d-\u00e9s gyermekj\u00f3l\u00e9ti k\u00f6zpont
  feladatait biztos\u00edtani. A gyakorlatban ez azt jelenti, hogy minden csal\u00e1dseg\u00edt\u0151nek
  a feladata ugyanaz, de nem z\u00e1rja ki, hogy a vezet\u0151 a szakemberek speci\u00e1lis
  tud\u00e1s\u00e1nak, k\u00e9szs\u00e9geinek megfelel\u0151en ett\u0151l elt\u00e9r\u0151
  feladatmegoszt\u00e1s mellett d\u00f6nts\u00f6n. Az int\u00e9zm\u00e9nynek egy m\u0171k\u00f6d\u00e9si
  enged\u00e9lye lesz a k\u00e9t feladat ell\u00e1t\u00e1sra, stb. (T\u00f6bb szakmai
  r\u00e9szlet is v\u00e1ltozni fog, de ezeket majd a megjelen\u0151 szakmai v\u00e9grehajt\u00e1si
  rendeletet szab\u00e1lyozza.)\\n ugyanezzel az int\u00e9zm\u00e9nyi alkalmazotti
  l\u00e9tsz\u00e1mmal ell\u00e1that\u00f3 a feladat, a fenntart\u00e1si k\u00f6lts\u00e9gek
  v\u00e1rhat\u00f3an nem v\u00e1ltoznak emiatt,\\n Kondorfa telep\u00fcl\u00e9s csatlakoz\u00e1sa
  v\u00e1rhat\u00f3 (l\u00e1sd: lentebb), az int\u00e9zm\u00e9ny a jelenlegi alkalmazotti
  l\u00e9tsz\u00e1mmal ell\u00e1tja ezt a plusz telepel\u00fcl\u00e9st is, a finansz\u00edroz\u00e1sban
  ugyanakkor Kondorfa lakoss\u00e1gsz\u00e1m-ar\u00e1nyosan r\u00e9szt vesz, teh\u00e1t
  a fenntart\u00e1si k\u00f6lts\u00e9gek v\u00e1rhat\u00f3an cs\u00f6kkennek a t\u00f6bbi
  telep\u00fcl\u00e9s vonatkoz\u00e1s\u00e1ban,\\n mindezek tekintet\u00e9ben sz\u00fcks\u00e9g
  lesz az int\u00e9zm\u00e9ny alap\u00edt\u00f3 okirat\u00e1nak \u00e9s m\u0171k\u00f6d\u00e9si
  enged\u00e9ly\u00e9nek, tov\u00e1bb\u00e1 az egy\u00e9b int\u00e9zm\u00e9nyi dokumentumok
  m\u00f3dos\u00edt\u00e1s\u00e1ra is.\\n\\nSzentgotth\u00e1rd V\u00e1ros  K\u00e9pvisel\u0151-test\u00fclete
  a 233/2015. sz. hat\u00e1rozattal d\u00f6nt\u00f6tt arr\u00f3l, hogy a csal\u00e1dseg\u00edt\u00e9s,
  illetve a gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1si feladatokat a tov\u00e1bbiakban
  is a T\u00e1rsul\u00e1s \u00e1ltal fenntartott int\u00e9zm\u00e9ny keret\u00e9ben  k\u00edv\u00e1nja
  biztos\u00edtani.\\n\\nAz int\u00e9zm\u00e9ny alap\u00edt\u00f3 okirat\u00e1t is
  m\u00f3dos\u00edtani sz\u00fcks\u00e9ges a jogszab\u00e1lyi el\u0151\u00edr\u00e1sok
  -  a szoci\u00e1lis igazgat\u00e1sr\u00f3l  \u00e9s a szoci\u00e1lis  ell\u00e1t\u00e1sokr\u00f3l
  sz\u00f3l\u00f3 1993. \u00e9vi III. t\u00f6rv\u00e9ny, valamint a gyermekek v\u00e9delm\u00e9r\u0151l  \u00e9s
  a gy\u00e1m\u00fcgyi  igazgat\u00e1sr\u00f3l sz\u00f3l\u00f3 1997. \u00e9vi XXXI.
  tv \u2013 alapj\u00e1n.. Tov\u00e1bb\u00e1 a m\u00f3dos\u00edt\u00e1st indokolja
  az \u00e1llamh\u00e1ztart\u00e1sr\u00f3l sz\u00f3l\u00f3 2011. \u00e9vi CXCV t\u00f6rv\u00e9ny  8/A
  (2) bek \u00e9s 11. \u00a7 ( 7) bek.., valamint a 111. \u00a7 (26) bek. is, miszerint
  az alap\u00edt\u00f3, m\u00f3dos\u00edt\u00f3 \u00e9s megsz\u00fcntet\u0151 okiratokat
  ezen jogszab\u00e1lyi el\u0151\u00edr\u00e1sok alapj\u00e1n kell elk\u00e9sz\u00edteni
  .\\n\\nA m\u00f3dos\u00edt\u00f3 okiratot \u00e9s a m\u00f3dos\u00edt\u00e1ssal
  egybeszerkesztett alap\u00edt\u00f3 okiratot az el\u0151terjeszt\u00e9s 2. sz\u00e1m\u00fa
  mell\u00e9klete tartalmazza.\\n\\nIV. KONDORFA CSATLAKOZ\u00c1SA AZ \u00d6NKORM\u00c1NYZATI
  T\u00c1RSUL\u00c1SHOZ\\n\\nAz el\u0151bbi pontban m\u00e1r eml\u00edtett\u00fck,
  - a jogszab\u00e1lyv\u00e1ltoz\u00e1s k\u00f6vetkezt\u00e9ben - a szolg\u00e1lat
  vonatkoz\u00e1s\u00e1ban a t\u00e1rsul\u00e1si form\u00e1ban t\u00f6rt\u00e9n\u0151
  feladatell\u00e1t\u00e1s eset\u00e9ben figyelemmel kell lenni arra, hogy nem lehet
  a k\u00f6z\u00f6s hivatalok egys\u00e9g\u00e9t bontani. Kondorfa K\u00f6zs\u00e9g
  \u00d6nkorm\u00e1nyzata nem r\u00e9sze a szentgotth\u00e1rdi kist\u00e9rs\u00e9g
  ter\u00fclet\u00e9nek \u00e9s eddig a szentgotth\u00e1rdi \u00f6nkorm\u00e1nyzati
  t\u00e1rsul\u00e1snak sem. A szentgotth\u00e1rdi j\u00e1r\u00e1snak \u00e9s a cs\u00f6r\u00f6tneki
  sz\u00e9khely\u0171 k\u00f6z\u00f6s \u00f6nkorm\u00e1nyzati hivatalnak ugyanakkor
  igen.\\n\\nKondorfa K\u00f6zs\u00e9g \u00d6nkorm\u00e1nyzattal folytatott el\u0151zetes
  egyeztet\u00e9sek alapj\u00e1n v\u00e1rhat\u00f3, hogy Kondorfa a csal\u00e1dseg\u00edt\u00e9s-
  \u00e9s gyermekj\u00f3l\u00e9ti feladatok ell\u00e1t\u00e1s\u00e1val a szentgotth\u00e1rdi
  t\u00e1rsul\u00e1shoz szeretne csatlakozni, de az sem kiz\u00e1rt, hogy m\u00e1s
  feladatell\u00e1t\u00e1s vonatkoz\u00e1s\u00e1ban is kezdem\u00e9nyezik az egy\u00fcttm\u0171k\u00f6d\u00e9st.
  A T\u00e1rsul\u00e1si Tan\u00e1cs id\u0151pontj\u00e1ig v\u00e1rhat\u00f3an a kondorfai
  k\u00e9pvisel\u0151-test\u00fclet hat\u00e1roz a k\u00e9rd\u00e9sben \u00e9s ennek
  ismeret\u00e9ben hozhatja meg a T\u00e1rsul\u00e1si Tan\u00e1cs a d\u00f6nt\u00e9s\u00e9t.\\n\\nKondorfa
  v\u00e1rhat\u00f3 csatlakoz\u00e1s\u00e1val sz\u00fcks\u00e9gess\u00e9 v\u00e1lik
  nem csup\u00e1n az \u00e9rintett int\u00e9zm\u00e9ny(ek) alap\u00edt\u00f3 okirat\u00e1nak
  \u00e9s egy\u00e9b dokumentumainak m\u00f3dos\u00edt\u00e1sa a feladatell\u00e1t\u00e1s
  ter\u00fclete tekintet\u00e9ben, de az \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1s
  T\u00e1rsul\u00e1si Meg\u00e1llapod\u00e1s\u00e1nak m\u00f3dos\u00edt\u00e1sa is
  \u2013 amennyiben Kondorfa csatlakoz\u00e1si k\u00e9relm\u00e9t a T\u00e1rsul\u00e1s
  j\u00f3v\u00e1hagyja. A T\u00e1rsul\u00e1si Meg\u00e1llapod\u00e1s m\u00f3dos\u00edt\u00e1sa
  kiz\u00e1r\u00f3lag valamennyi tag\u00f6nkorm\u00e1nyzat k\u00e9pvisel\u0151-test\u00fclet\u00e9nek
  j\u00f3v\u00e1hagy\u00f3 hat\u00e1rozata alapj\u00e1n t\u00f6rt\u00e9nhet. Ehhez
  az el\u0151terjeszt\u00e9s 1. sz\u00e1m\u00fa mell\u00e9kletek\u00e9nt el\u0151k\u00e9sztett\u00fck
  a T\u00e1rsul\u00e1si Meg\u00e1llapod\u00e1s m\u00f3dos\u00edt\u00f3 okirat\u00e1t.
  Fontos, hogy amennyiben a T\u00e1rsul\u00e1si Tan\u00e1cs j\u00f3v\u00e1hagyja Kondorfa
  k\u00e9relm\u00e9t \u00e9s kezdem\u00e9nyezi a T\u00e1rsul\u00e1si Meg\u00e1llapod\u00e1s
  m\u00f3dos\u00edt\u00e1s\u00e1t, azt valamennyi tag\u00f6nkorm\u00e1nyzat k\u00e9pvisel\u0151-test\u00fclet\u00e9nek
  legk\u00e9s\u0151bb november v\u00e9g\u00e9ig el kell fogadnia, mert csak \u00edgy
  tudjuk a sz\u00fcks\u00e9ges v\u00e1ltoz\u00e1sok enged\u00e9lyez\u00e9s\u00e9r\u0151l
  hat\u00e1rid\u0151ben, azaz 2015. december 31-ig gondoskodni.\\n\\nK\u00e9rem a
  Tisztelt T\u00e1rsul\u00e1si Tan\u00e1csot, hogy az el\u0151terjeszt\u00e9st megt\u00e1rgyalni,
  a t\u00e1rgyban d\u00f6nteni sz\u00edveskedjen.\\n\\nHat\u00e1rozati javaslat:\\n\\n4.
  A Szentgotth\u00e1rd \u00e9s T\u00e9rs\u00e9ge \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1s
  a csal\u00e1dseg\u00edt\u00e9s, illetve a gyermekj\u00f3l\u00e9ti szolg\u00e1ltat\u00e1si
  feladatok ell\u00e1t\u00e1s\u00e1nak m\u00f3dj\u00e1t fel\u00fclvizsg\u00e1lva a
  tov\u00e1bbiakban is a T\u00e1rsul\u00e1s keret\u00e9ben fenntartott int\u00e9zm\u00e9ny
  keret\u00e9ben k\u00edv\u00e1nja biztos\u00edtani ezeket a feladatokat,\\n\\n21\\n\\nazzal,
  hogy 2016. janu\u00e1r 01. id\u0151pontot k\u00f6vet\u0151en a jogszab\u00e1lyi
  el\u0151\u00edr\u00e1soknak megfelel\u0151, integr\u00e1lt csal\u00e1d-\u00e9s gyermekj\u00f3l\u00e9ti
  k\u00f6zpont keret\u00e9ben m\u0171k\u00f6dj\u00f6n tov\u00e1bb az int\u00e9zm\u00e9ny.\\n\\nFelk\u00e9ri
  a T\u00e1rsul\u00e1s munkaszervezet\u00e9t \u00e9s az int\u00e9zm\u00e9nyt, hogy
  a sz\u00fcks\u00e9ges dokumentumok (alap\u00edt\u00f3 okirat m\u00f3dos\u00edt\u00e1s,
  m\u0171k\u00f6d\u00e9si enged\u00e9ly m\u00f3dos\u00edt\u00e1s, int\u00e9zm\u00e9nyi
  dokumentumok) el\u0151k\u00e9sz\u00edt\u00e9s\u00e9r\u0151l gondoskodjon.\\n\\nHat\u00e1rid\u0151:
  azonnal\\n\\nFelel\u0151s: Husz\u00e1r G\u00e1bor polg\u00e1rmester\\n\\ndr. G\u00e1bor
  L\u00e1szl\u00f3 \u00d6nk. \u00e9s T\u00e9rs\u00e9gi Er\u0151forr\u00e1sok v.\\n\\nUhor
  Anita int\u00e9zm\u00e9nyvezet\u0151\\n\\n5. Szentgotth\u00e1rd \u00e9s T\u00e9rs\u00e9ge
  \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1s T\u00e1rsul\u00e1si Tan\u00e1csa a Csal\u00e1dseg\u00edt\u0151
  \u00e9s Gyermekj\u00f3l\u00e9ti Szolg\u00e1lat Szentgotth\u00e1rd Alap\u00edt\u00f3
  Okirat\u00e1t m\u00f3dos\u00edt\u00f3 okiratot \u00e9s az egys\u00e9ges Alap\u00edt\u00f3
  Okiratot az el\u0151terjeszt\u00e9s 2. sz\u00e1m\u00fa mell\u00e9klete szerint j\u00f3v\u00e1hagyja.\\n6.
  A T\u00e1rsul\u00e1si Tan\u00e1cs t\u00e1mogatja Kondorfa K\u00f6zs\u00e9g \u00d6nkorm\u00e1nyzata
  csatlakoz\u00e1si k\u00e9relm\u00e9t a Szentgotth\u00e1rd \u00e9s T\u00e9rs\u00e9ge
  \u00d6nkorm\u00e1nyzati T\u00e1rsul\u00e1shoz az al\u00e1bbi feladatell\u00e1t\u00e1sok
  vonatkoz\u00e1s\u00e1ban azzal, hogy Kondorfa K\u00f6zs\u00e9g \u00d6nkorm\u00e1nyzata
  is lakoss\u00e1gsz\u00e1m-ar\u00e1nyos m\u00f3don vegyen r\u00e9szt a szolg\u00e1ltat\u00e1sok
  \u00e9s az \u00e9ves tagd\u00edj finansz\u00edroz\u00e1s\u00e1ban:\\n- csal\u00e1dseg\u00edt\u00e9s,\\n-
  gyermekv\u00e9delmi ell\u00e1t\u00e1s,\\n- bels\u0151 ellen\u0151rz\u00e9s,\\n-
  k\u00f6zm\u0171vel\u0151d\u00e9s,\\n- ter\u00fcletfejleszt\u00e9si feladatok,\\n-
  k\u00f6rnyezet- \u00e9s term\u00e9szetv\u00e9delem,\\n- turizmusfejleszt\u00e9s,
  idegenforgalom,\\n- k\u00f6zmunkaprogram megval\u00f3s\u00edt\u00e1sa,\\n- valamint
  az \u00f6nkorm\u00e1nyzati t\u00e1rsul\u00e1s \u00fcgyint\u00e9z\u00e9s\u00e9nek
  fejleszt\u00e9s\u00e9b\u0151l ad\u00f3d\u00f3 feladatok,\\n\\nHat\u00e1rid\u0151:
  azonnal\\n\\nFelel\u0151s: Husz\u00e1r G\u00e1bor  eln\u00f6k\\n\\nt\u00f6rzsk\u00f6nyvi
  \u00e1tvezet\u00e9sre: dr. G\u00e1bor L\u00e1szl\u00f3 \u00d6nk. \u00e9s T\u00e9rs\u00e9gi
  Er\u0151forr\u00e1sok v.\\n\\nUhor Anita   int\u00e9zm\u00e9nyvezet\u0151\\n\\nA
  T\u00e1rsul\u00e1si Tan\u00e1cs ezzel p\u00e1rhuzamosan valamennyi tag\u00f6nkorm\u00e1nyzatn\u00e1l
  kezdem\u00e9nyezi a T\u00e1rsul\u00e1si Meg\u00e1llapod\u00e1s m\u00f3dos\u00edt\u00e1s\u00e1t
  az el\u0151terjeszt\u00e9s 1. sz\u00e1m\u00fa mell\u00e9klete szerint.\\n\\nHat\u00e1rid\u0151:
  a T\u00e1rsul\u00e1si Meg\u00e1llapod\u00e1s m\u00f3dos\u00edt\u00e1s\u00e1nak hat\u00e1lybal\u00e9p\u00e9sre:
