  \u00e9s az internetes versenyeken val\u00f3 r\u00e9szv\u00e9tel.\\n\\n**Az informatikai
  k\u00e9pz\u00e9s eset\u00e9ben:**\\n\\n\u2022 ECDL vizsg\u00e1ra t\u00f6rt\u00e9n\u0151
