  el.\\n\\nIX. Az aj\u00e1nlattal kapcsolatos formai el\u0151\u00edr\u00e1sok\\n\\n1)
  Az aj\u00e1nlat r\u00e9szek\u00e9nt beny\u00fajtand\u00f3 dokumentumok eset\u00e9ben
  Aj\u00e1nlatk\u00e9r\u0151 elektronikus \u0171rlapok rendelkez\u00e9sre bocs\u00e1t\u00e1s\u00e1val
  seg\u00edti az aj\u00e1nlatt\u00e9telt. Aj\u00e1nlatk\u00e9r\u0151 felh\u00edvja
  a figyelmet, hogy azon nyilatkozatok tekintet\u00e9ben, ahol Aj\u00e1nlatk\u00e9r\u0151
  elektronikus \u0171rlapot k\u00e9sz\u00edtett, ott ezen \u0171rlapok haszn\u00e1lat\u00e1t\u00f3l
  nem lehet eltekinteni, ezen \u0171rlapok haszn\u00e1lata k\u00f6telez\u0151!\\n\\n2)
  Amennyiben az adott dokumentumra vonatkoz\u00f3an aj\u00e1nlatk\u00e9r\u0151 elektronikus
  \u0171rlapot nem k\u00e9sz\u00edtett, illet\u0151leg a nyilatkozatt\u00e9tel nyelv\u00e9n
  \u0171rlap nem \u00e1ll rendelkez\u00e9sre, \u00fagy a nyilatkozat csatolhat\u00f3
  az EKR-ben legal\u00e1bb fokozott biztons\u00e1g\u00fa elektronikus al\u00e1\u00edr\u00e1ssal
  ell\u00e1tott dokumentumk\u00e9nt is! Aj\u00e1nlatk\u00e9r\u0151 felh\u00edvja a
  figyelmet, hogy a Kbt. 41/A \u00a7 (2) bekezd\u00e9s\u00e9ben foglaltakon k\u00edv\u00fcl,
  amennyiben az adott dokumentum tekintet\u00e9ben elektronikus \u0171rlap nem \u00e1ll
  rendelkez\u00e9sre, \u00fagy a nyilatkozat egyszer\u0171 m\u00e1solatban is beny\u00fajthat\u00f3
  az EKR-en kereszt\u00fcl.\\n\\n3) Ahol a Kbt. vagy annak v\u00e9grehajt\u00e1s\u00e1ra
  rendelete k\u00f6zjegyz\u0151 vagy szakmai, illetve gazdas\u00e1gi kamara \u00e1ltal
  hiteles\u00edtett nyilatkozat beny\u00fajt\u00e1s\u00e1t \u00edrja el\u0151, a dokumentum
  beny\u00fajthat\u00f3 a pap\u00edr alapon hiteles\u00edtett dokumentum egyszer\u0171
  elektronikus m\u00e1solatak\u00e9nt vagy olyan form\u00e1ban is, ahol a pap\u00edr
  alapon vagy legal\u00e1bb fokozott biztons\u00e1g\u00fa elektronikus al\u00e1\u00edr\u00e1ssal
  elektronikus \u00faton megtett nyilatkozatot k\u00f6zjegyz\u0151 vagy szakmai, illetve
  gazdas\u00e1gi kamara - legal\u00e1bb fokozott biztons\u00e1g\u00fa elektronikus
  al\u00e1\u00edr\u00e1ssal vagy b\u00e9lyegz\u0151vel - elektronikusan l\u00e1tta
  el hiteles\u00edt\u00e9ssel.\\n\\n4) Amennyiben az adott dokumentum tekintet\u00e9ben
  elektronikus \u0171rlap nem \u00e1ll rendelkez\u00e9sre, \u00fagy az adott dokumentumot
  \u201ePDF\u201d form\u00e1tumban csatolja Aj\u00e1nlattev\u0151. A r\u00e9szletes
  \u00e1raj\u00e1nlatot (\u00e1razott k\u00f6lts\u00e9gvet\u00e9st) \u201eEXCEL\u201d
  form\u00e1tumban is k\u00e9rij\u00fck csatolni. Elt\u00e9r\u00e9s eset\u00e9n a
  \u201ePDF\u201d form\u00e1tum\u00fa az ir\u00e1nyad\u00f3\\n\\n5) E k\u00f6rben
  Aj\u00e1nlatk\u00e9r\u0151 az al\u00e1bbiakra h\u00edvja fel a figyelmet:\\n\\nAmennyiben
  az EKR-ben az aj\u00e1nlat r\u00e9szek\u00e9nt csatolt dokumentum nem tesz eleget
  a k\u00f6zbeszerz\u00e9si dokumentumokban meghat\u00e1rozott, az aj\u00e1nlat r\u00e9szt
  k\u00e9pez\u0151 dokumentumok informatikai jellemz\u0151ire vonatkoz\u00f3 k\u00f6vetelm\u00e9nyeknek,
  de az aj\u00e1nlatk\u00e9r\u0151 sz\u00e1m\u00e1ra olvashat\u00f3, illetve megjelen\u00edthet\u0151,
  az aj\u00e1nlatk\u00e9r\u0151 - ha azt nem tartja sz\u00fcks\u00e9gesnek - nem k\u00f6teles
  hi\u00e1nyp\u00f3tl\u00e1sra felh\u00edvni az aj\u00e1nlattev\u0151t, \u00e9s \u00fagy
  kell tekinteni, hogy az aj\u00e1nlat megfelelt az el\u0151\u00edrt k\u00f6vetelm\u00e9nyeknek.
  Amennyiben az aj\u00e1nlat r\u00e9szek\u00e9nt csatolt dokumentum nem tesz eleget
  az el\u0151\u00edrt informatikai k\u00f6vetelm\u00e9nyeknek \u00e9s az aj\u00e1nlatk\u00e9r\u0151
  sz\u00e1m\u00e1ra nem olvashat\u00f3, illetve jelen\u00edthet\u0151 meg, ez nem
  tekinthet\u0151 formai hi\u00e1nyoss\u00e1gnak, azt \u00fagy kell kezelni, mintha
  az aj\u00e1nlattev\u0151 az \u00e9rintett dokumentumot nem ny\u00fajtotta volna
  be \u00e9s a Kbt. hi\u00e1nyp\u00f3tl\u00e1sra vonatkoz\u00f3 szab\u00e1lyaira figyelemmel
  kell elj\u00e1rni.\\n\\nAmennyiben az EKR-ben az aj\u00e1nlat r\u00e9szek\u00e9nt
  csatolt dokumentum eleget tesz a k\u00f6zbeszerz\u00e9si dokumentumokban meghat\u00e1rozott,
  az aj\u00e1nlat r\u00e9sz\u00e9t k\u00e9pez\u0151 dokumentumok informatikai jellemz\u0151ire
  vonatkoz\u00f3 k\u00f6vetelm\u00e9nyeknek, de az egy\u00e9b okb\u00f3l nem olvashat\u00f3,
  illetve nem jelen\u00edthet\u0151 meg, az aj\u00e1nlattev\u0151 fel kell h\u00edvni
  az aj\u00e1nlat olvashatos\u00e1g\u00e1hoz \u00e9s megjelen\u00edthet\u0151s\u00e9g\u00e9hez
  sz\u00fcks\u00e9ges szoftver megnevez\u00e9s\u00e9re. Az aj\u00e1nlatk\u00e9r\u0151
  - ha a k\u00f6zbeszerz\u00e9si dokumentumokban elt\u00e9r\u0151en nem rendelkezik
  - csup\u00e1n \u00e1ltal\u00e1nosan hozz\u00e1f\u00e9rhet\u0151, ingyenes vagy szabad
  szoftvert k\u00f6teles ig\u00e9nybe venni az aj\u00e1nlatok olvas\u00e1s\u00e1hoz
  \u00e9s megjelen\u00edthet\u0151s\u00e9g\u00e9hez az aj\u00e1nlattev\u0151 el\u0151bbi
  nyilatkozata alapj\u00e1n. Amennyiben a dokumentum tartalma ezt k\u00f6vet\u0151en
  sem hat\u00e1rozhat\u00f3 meg, azt \u00fagy kell kezelni, mintha az aj\u00e1nlattev\u0151
  az \u00e9rintett dokumentumot nem ny\u00fajtotta volna be \u00e9s a Kbt. hi\u00e1nyp\u00f3tl\u00e1sra
  vonatkoz\u00f3 szab\u00e1lyaira figyelemmel kell elj\u00e1rni.\\n\\nAz EKR fel\u00fcletre
  felt\u00f6lthet\u0151 dokumentumm\u00e9ret: 25 MB/dokumentum.\\n\\nA Kbt. 41/B.\u00a7
  (2) bekezd\u00e9se alapj\u00e1n Aj\u00e1nlatk\u00e9r\u0151 az al\u00e1bbi f\u00e1jlform\u00e1tumokat
  fogadja el az elj\u00e1r\u00e1sban:\\n\\n- PDF form\u00e1tum\u00fa f\u00e1jl\\n-
  XLSX form\u00e1tum\u00fa f\u00e1jl\\n- ZIP form\u00e1tum\u00fa f\u00e1jl\\n- DOCX
  form\u00e1tum\u00fa f\u00e1jl\\n\\nJavasoljuk a T. Aj\u00e1nlattev\u0151knek, hogy
  amennyiben t\u00f6bb azonos t\u00edpus\u00fa f\u00e1jlt t\u00f6ltenek fel, abban
  az esetben haszn\u00e1ljanak t\u00f6m\u00f6r\u00edt\u00e9st, ez\u00e1ltal kevesebb
  f\u00e1jl felt\u00f6lt\u00e9se v\u00e1lik sz\u00fcks\u00e9gess\u00e9.\\n\\n**X.
  Az aj\u00e1nlatok felbont\u00e1sa**\\n\\n1) Az aj\u00e1nlatok az EKR-en kereszt\u00fcl
  elektronikus \u00faton kell beny\u00fajtani:\\n\\n   www.ekr.gov.hu\\n\\n2) A 424/2017.
  (XII. 19.) Korm. rendelet 15.\u00a7 (3) bekezd\u00e9se \u00e9rtelm\u00e9ben az aj\u00e1nlatnak
  az aj\u00e1nlatt\u00e9teli hat\u00e1rid\u0151 lej\u00e1rt\u00e1nak id\u0151pontj\u00e1ig
  kell elektronikusan be\u00e9rkeznie. A be\u00e9rkez\u00e9s id\u0151pontj\u00e1r\u00f3l
  az EKR visszaigazol\u00e1st k\u00fcld.\\n\\n3) Az aj\u00e1nlatok felbont\u00e1s\u00e1ra
  az EKR-ben ker\u00fcl sor az aj\u00e1nlatt\u00e9teli hat\u00e1rid\u0151 lej\u00e1rt\u00e1t
  k\u00f6vet\u0151 k\u00e9t \u00f3r\u00e1val k\u00e9s\u0151bb [EKR rendelet 15. \u00a7
  (2)]. Az aj\u00e1nlatnak az aj\u00e1nlatt\u00e9teli hat\u00e1rid\u0151 lej\u00e1rt\u00e1nak
  id\u0151pontj\u00e1ig kell elektronikusan be\u00e9rkeznie. A be\u00e9rkez\u00e9s
  id\u0151pontj\u00e1r\u00f3l az EKR visszaigazol\u00e1st k\u00fcld. [EKR rendelet
  15. \u00a7 (3)] A Kbt. 68. \u00a7 (4)-(5) bekezd\u00e9se szerinti adatokat az EKR
  a bont\u00e1s id\u0151pontj\u00e1t\u00f3l kezdve azonnal elektronikusan - azzal
  a tartalommal, ahogyan azok az aj\u00e1nlatban szerepelnek - az aj\u00e1nlattev\u0151k
  r\u00e9sz\u00e9re el\u00e9rhet\u0151v\u00e9 teszi [Kbt. 68.\u00a7 (1c)].\\n\\n**XI.
  \u00dczleti titkot k\u00e9pez\u0151 dokumentumok**\\n\\n1) A gazdas\u00e1gi szerepl\u0151
  az aj\u00e1nlatban, r\u00e9szv\u00e9teli jelentkez\u00e9sben, hi\u00e1nyp\u00f3tl\u00e1sban
  vagy felvil\u00e1gos\u00edt\u00e1sban, valamint a 72. \u00a7 szerinti indokol\u00e1sban
  elk\u00fcl\u00f6n\u00edtett m\u00f3don elhelyezett, \u00fczleti titkok (ide\u00e9rtve
  a v\u00e9dett ismeretet is) [az \u00fczleti titok v\u00e9delm\u00e9r\u0151l sz\u00f3l\u00f3
  2018. \u00e9vi LIV. t\u00f6rv\u00e9ny 1. \u00a7] tartalmaz\u00f3 iratok nyilv\u00e1noss\u00e1gra
  hozatal\u00e1t megtilthatja. Az \u00fczleti titkok tartalmaz\u00f3 irat kiz\u00e1r\u00f3lag
  olyan inform\u00e1ci\u00f3kat tartalmazhat, amelyek nyilv\u00e1noss\u00e1gra hozatala
  a gazdas\u00e1gi szerepl\u0151 \u00fczleti tev\u00e9kenys\u00e9ge szempontj\u00e1b\u00f3l
  ar\u00e1nytalan s\u00e9relmet okozna. A gazdas\u00e1gi szerepl\u0151 az \u00fczleti
  titkok tartalmaz\u00f3, elk\u00fcl\u00f6n\u00edtett irathoz indokol\u00e1st k\u00f6teles
  csatolni, amelyben r\u00e9szletesen \u00e1ltal\u00e1masztja, hogy az adott inform\u00e1ci\u00f3
  vagy adat nyilv\u00e1noss\u00e1gra hozatala mi\u00e9rt \u00e9s milyen m\u00f3don
  okozna sz\u00e1m\u00e1ra ar\u00e1nytalan s\u00e9relmet. A gazdas\u00e1gi szerepl\u0151
  \u00e1ltal adott indokol\u00e1s nem megfelel\u0151, amennyiben az \u00e1ltal\u00e1noss\u00e1g
  szintj\u00e9n kerti megfogalmaz\u00e1sra.\\n\\n2) A Kbt. 44. \u00a7 (2) bekezd\u00e9se
  alapj\u00e1n a gazdas\u00e1gi szerepl\u0151 nem nyilv\u00e1n\u00edthatja \u00fczleti
  titoknak k\u00fcl\u00f6n\u00f6sen\\n\\na) azokat az inform\u00e1ci\u00f3kat, adatokat,
  amelyek elektronikus, hat\u00f3s\u00e1gi vagy egy\u00e9b nyilv\u00e1ntart\u00e1sb\u00f3l
  b\u00e1rki sz\u00e1m\u00e1ra megismerhet\u0151k,\\nb) az inform\u00e1ci\u00f3s \u00f6nrendelkez\u00e9si
  jogr\u00f3l \u00e9s az inform\u00e1ci\u00f3szabads\u00e1gr\u00f3l sz\u00f3l\u00f3
  2011. \u00e9vi CXII. t\u00f6rv\u00e9ny 27. \u00a7 (3) bekezd\u00e9se szerinti k\u00f6z\u00e9rdekb\u0151l
  nyilv\u00e1nos adatokat,\\nc) az aj\u00e1nlattev\u0151, illetve r\u00e9szv\u00e9telre
  jelentkez\u0151 \u00e1ltal az alkalmass\u00e1g igazol\u00e1sa k\u00f6r\u00e9ben
  bemutatott ca) kor\u00e1bban teljes\u00edtett k\u00f6zbeszerz\u00e9si szerz\u0151d\u00e9sek,
  illetve e t\u00f6rv\u00e9ny szerinti \u00e9p\u00edt\u00e9s- vagy szolg\u00e1ltat\u00e1si
  koncesszi\u00f3k megk\u00f6t\u00e9s\u00e9re, tartalm\u00e1ra \u00e9s teljes\u00edt\u00e9s\u00e9re
  vonatkoz\u00f3 inform\u00e1ci\u00f3kat \u00e9s adatokat,\\ncb) g\u00e9pekre, eszk\u00f6z\u00f6kre,
  berendez\u00e9sekre, szakemberekre, tan\u00fas\u00edtv\u00e1nyokra, c\u00edmk\u00e9kre
  vonatkoz\u00f3 inform\u00e1ci\u00f3kat \u00e9s adatokat,\\nd) az aj\u00e1nlatban
  meghat\u00e1rozott \u00e1ruk, \u00e9p\u00edt\u00e9si beruh\u00e1z\u00e1sok, szolg\u00e1ltat\u00e1sok
  le\u00edr\u00e1s\u00e1t, ide nem \u00e9rtve a le\u00edr\u00e1snak azt a j\u00f3l
  meghat\u00e1rozhat\u00f3 elem\u00e9t, amely tekintet\u00e9ben az els\u0151 pontban
  meghat\u00e1rozott felt\u00e9telek az aj\u00e1nlattev\u0151 \u00e1ltal igazoltan
  fenn\u00e1llnak,\\ne) ha az aj\u00e1nlatk\u00e9r\u0151 annak beny\u00fajt\u00e1s\u00e1t
  k\u00e9ri, az aj\u00e1nlattev\u0151 szakmai aj\u00e1nlat\u00e1t, ide nem \u00e9rtve
  a szakmai aj\u00e1nlatnak azt a j\u00f3l meghat\u00e1rozhat\u00f3 elem\u00e9t, amely
  tekintet\u00e9ben az els\u0151 pontban meghat\u00e1rozott felt\u00e9telek az aj\u00e1nlattev\u0151
  \u00e1ltal igazoltan fenn\u00e1llnak\\n\\nXII. Az elj\u00e1r\u00e1s eredm\u00e9nytelens\u00e9ge
  az EKR-re visszavezethet\u0151 okok miatt\\n\\n1) A k\u00f6zbeszerz\u00e9si t\u00f6rv\u00e9ny
  75. \u00a7 (2) bek g) pontj\u00e1ban foglaltak alapj\u00e1n aj\u00e1nlatk\u00e9r\u0151
  eredm\u00e9nytelenne nyilv\u00e1n\u00edthatja az elj\u00e1r\u00e1st, ha az EKR rendszer
  m\u0171k\u00f6d\u00e9si hib\u00e1ja olyan jogs\u00e9rt\u00e9st eredm\u00e9nyez,
  amely a k\u00f6zbeszerz\u00e9si t\u00f6rv\u00e9nyben meghat\u00e1rozott alapelvek
  \u00e9rv\u00e9nyes\u00fcl\u00e9s\u00e9t biztos\u00edt\u00f3 m\u00f3don nem orvosolhat\u00f3.\\n\\nXIII.
  Nyilv\u00e1noss\u00e1g\\n\\n1) Aj\u00e1nlattev\u0151 mag\u00e1ra n\u00e9zve k\u00f6telez\u0151nek
  fogadja el, hogy a k\u00f6zp\u00e9nzek felhaszn\u00e1l\u00e1s\u00e1val, a k\u00f6ztulajdon
  haszn\u00e1lat\u00e1nak nyilv\u00e1noss\u00e1g\u00e1val, \u00e1tl\u00e1that\u00f3bb\u00e1
  t\u00e9teleivel \u00e9s ellen\u0151rz\u00e9s\u00e9nek b\u0151v\u00edt\u00e9s\u00e9vel
  \u00f6sszef\u00fcgg\u0151 egyes t\u00f6rv\u00e9nyek m\u00f3dos\u00edt\u00e1s\u00e1r\u00f3l
  sz\u00f3l\u00f3 2003. \u00e9vi XXIV. t\u00f6rv\u00e9ny alapj\u00e1n az \u00c1llami
  Sz\u00e1mv\u00e9v\u00f6sz\u00e9k, illetve a 210/2010. (VI.30.) Korm\u00e1nyrendeletben
  meghat\u00e1rozott szervezet is jogosult ellen\u0151rizni a nyertes aj\u00e1nlattev\u0151
  rendelkez\u00e9s\u00e9re bocs\u00e1tott k\u00f6lts\u00e9gvet\u00e9si p\u00e9nzeszk\u00f6z\u00f6k
  szerz\u0151d\u00e9sszer\u0171 felhaszn\u00e1l\u00e1s\u00e1t.\\n\\n2) Aj\u00e1nlattev\u0151
  tudom\u00e1sul veszi, hogy az \u00c1llami Sz\u00e1mv\u00e9v\u00f6sz\u00e9kr\u0151l
  sz\u00f3l\u00f3 2011. \u00e9vi LXVI. t\u00f6rv\u00e9ny 5. \u00a7-\u00e1nak (5) bekezd\u00e9s\u00e9ben
  foglaltak alapj\u00e1n az \u00c1llami Sz\u00e1mv\u00e9v\u00f6sz\u00e9k vizsg\u00e1lhatja
  az \u00e1llamh\u00e1ztart\u00e1s alrendszereib\u0151l finansz\u00edrozott beszerz\u00e9seket
  \u00e9s az \u00e1llamh\u00e1ztart\u00e1s alrendszereinek vagyon\u00e1t \u00e9rint\u0151
  szerz\u0151d\u00e9seket a megrendel\u0151n\u00e9l, a megrendel\u0151 nev\u00e9ben
  vagy k\u00e9pviseleteiben elj\u00e1r\u00f3 term\u00e9szetes szem\u00e9lyn\u00e9l
  \u00e9s jogi szem\u00e9lyn\u00e9l, valamint azokn\u00e1l a szerz\u0151d\u0151 felekn\u00e9l,
  akik, illetve amelyek a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9\u00e9rt felel\u0151sek,
  tov\u00e1bb\u00e1 a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9ben k\u00f6zrem\u0171k\u00f6d\u0151
  valamennyi gazd\u00e1lkod\u00f3 szervezetn\u00e9l.\\n\\n3) Aj\u00e1nlattev\u0151
  tudom\u00e1sul veszi, hogy nem min\u0151s\u00fcl \u00fczleti titoknak az \u00e1llami
  \u00e9s a helyi \u00f6nkorm\u00e1nyzati k\u00f6lts\u00e9gvet\u00e9s, illetve az
  eur\u00f3pai k\u00f6z\u00f6ss\u00e9gi t\u00e1mogat\u00e1s felhaszn\u00e1l\u00e1s\u00e1val,
  k\u00f6lts\u00e9gvet\u00e9st \u00e9rint\u0151 juttat\u00e1ssal, kedvezm\u00e9nnyel,
  az \u00e1llami \u00e9s \u00f6nkorm\u00e1nyzati vagyon kezel\u00e9s\u00e9vel, birtokl\u00e1s\u00e1val,
  haszn\u00e1lat\u00e1val, hasznos\u00edt\u00e1s\u00e1val, az azzal val\u00f3 rendelkez\u00e9ssel,
  annak megerhel\u00e9s\u00e9vel, az ilyen vagyon \u00e9rint\u0151 b\u00e1rmilyen
  jog megszerz\u00e9s\u00e9vel kapcsolatos adat, valamint az az adat, amelynek megismer\u00e9s\u00e9t
  vagy nyilv\u00e1noss\u00e1gra hozatal\u00e1t k\u00fcl\u00f6n t\u00f6rv\u00e9ny k\u00f6z\u00e9rdekb\u0151l
  elrendeli. A nyilv\u00e1noss\u00e1gra hozatal azonban nem eredm\u00e9nyezheti az
  olyan adatokhoz - \u00edgy k\u00fcl\u00f6n\u00f6sen a technol\u00f3giai elj\u00e1r\u00e1sokra,
  a m\u0171szaki megold\u00e1sokra, a gy\u00e1rt\u00e1si folyamatokra, a munkaszervez\u00e9si
  \u00e9s logisztikai m\u00f3dszerekre, tov\u00e1bb\u00e1 a know-how-ra vonatkoz\u00f3
  adatokhoz - val\u00f3 hozz\u00e1f\u00e9r\u00e9st, amelyek megismer\u00e9se az \u00fczleti
  tev\u00e9kenys\u00e9g v\u00e9gz\u00e9se szempontj\u00e1b\u00f3l ar\u00e1nytalan
  s\u00e9relmet okozna, felt\u00e9ve, hogy ez nem akad\u00e1lyozza meg a k\u00f6z\u00e9rdekb\u0151l
  nyilv\u00e1nos adat megismer\u00e9s\u00e9nek lehet\u0151s\u00e9g\u00e9t.\\n\\n4)
  Aj\u00e1nlattev\u0151 tudom\u00e1sul veszi, hogy az, aki az \u00e1llamh\u00e1ztart\u00e1s
  valamely alrendsz\u00e9vel p\u00e9nz\u00fcgyi, illetve \u00fczleti kapcsolatot l\u00e9tes\u00edt,
  k\u00e9r\u00e9sre k\u00f6teles a jogviszonnyal \u00f6sszef\u00fcgg\u0151 \u00e9s
  a k\u00f6z\u00e9rdekb\u0151l nyilv\u00e1nos adatokra vonatkoz\u00f3an t\u00e1j\u00e9koztat\u00e1st
  adni, valamint azt, hogy a k\u00f6lts\u00e9gvet\u00e9si p\u00e9nzeszk\u00f6z\u00f6k
  felhaszn\u00e1l\u00e1s\u00e1nak nyilv\u00e1noss\u00e1g\u00e1ra tekintettel a szerz\u0151d\u00e9s
  l\u00e9nyeges tartalm\u00e1r\u00f3l a t\u00e1j\u00e9koztat\u00e1s \u00fczleti titok
  c\u00edm\u00e9n nem tagadhat\u00f3 meg.\\n\\nXIV. Az aj\u00e1nlatok elb\u00edr\u00e1l\u00e1sa,
  \u00e9rt\u00e9kel\u00e9se\\n\\n1) Az aj\u00e1nlatk\u00e9r\u0151 a szerz\u0151d\u00e9s
  teljes\u00edt\u00e9s\u00e9re p\u00e9nz\u00fcgyi, gazdas\u00e1gi \u00e9s m\u0171szaki,
  szakmai szempontb\u00f3l alkalmas aj\u00e1nlattev\u0151nek a jelen k\u00f6zbeszerz\u00e9si
  dokument\u00e1ci\u00f3ban meghat\u00e1rozott m\u0171szaki, szakmai k\u00f6vetelm\u00e9nyeket
  kiel\u00e9g\u00edt\u0151 aj\u00e1nlatait a Kbt. 76. \u00a7 (5) bekezd\u00e9se, valamint
  az az \u00e9p\u00edt\u00e9si beruh\u00e1z\u00e1sok, valamint az \u00e9p\u00edt\u00e9si
  beruh\u00e1z\u00e1sokhoz kapcsol\u00f3d\u00f3 tervez\u0151i \u00e9s m\u00e9rn\u00f6ki
  szolg\u00e1ltat\u00e1sok k\u00f6zbeszerz\u00e9s\u00e9nek r\u00e9szletes szab\u00e1lyair\u00f3l
  sz\u00f3l\u00f3 322/2015. (X. 30.) Korm. rendelet 24. \u00a7 (3) bekezd\u00e9se
  alapj\u00e1n a 76. \u00a7 (2) bekezd\u00e9s c) pontja szerinti \u201elegjobb \u00e1r-\u00e9rt\u00e9k
  ar\u00e1ny\u201d alapj\u00e1n b\u00edr\u00e1lja el.\\n\\n2) A k\u00f6zbeszerz\u00e9s
  t\u00e1rgy\u00e1nak egy\u00e9rtelm\u0171 \u00e9s k\u00f6zierthet\u0151 meghat\u00e1roz\u00e1sa
  \u00e9rdek\u00e9ben az aj\u00e1nlatk\u00e9r\u0151 a dokument\u00e1ci\u00f3ban meghat\u00e1rozott
  gy\u00e1rtm\u00e1ny\u00fa, eredet\u0171, t\u00edpus\u00fa dologra, elj\u00e1r\u00e1sra,
  tev\u00e9kenys\u00e9gre, szem\u00e9lyre, illet\u0151leg szabadalomra vagy v\u00e9djegyre
  hivatkozik. Minden ilyen esetben a megnevez\u00e9s csak a t\u00e1rgy jelleg\u00e9nek
  egy\u00e9rtelm\u0171 meghat\u00e1roz\u00e1sa \u00e9rdek\u00e9ben t\u00f6rt\u00e9nt,
  aj\u00e1nlatot a dokument\u00e1ci\u00f3ban el\u0151\u00edrt, vagy az azzal \u2013
  a dokument\u00e1ci\u00f3ban szerepl\u0151 m\u0171szaki param\u00e9terei tekintet\u00e9ben
  \u2013 egyen\u00e9rt\u00e9k\u0171 term\u00e9kre lehet tenni.\\n\\n3) Az aj\u00e1nlati
  \u00e1rnak tartalmaznia kell minden, a szerz\u0151d\u00e9sszerz\u0151 teljes\u00edt\u00e9s
  \u00e9rdek\u00e9ben felmer\u00fcl\u0151 k\u00f6lts\u00e9get.\\n\\n4) Mindenf\u00e9le,
  a felh\u00edv\u00e1sban \u00e9s a dokument\u00e1ci\u00f3ban (Szerz\u0151d\u00e9s
  tervezetben) foglaltakkal ellent\u00e9tes, vagy azoknak nem megfelel\u0151, a b\u00edr\u00e1lati
  szemponttal, vagy a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9vel kapcsolatos
  aj\u00e1nlattev\u0151i kik\u00f6t\u00e9s (k\u00fcl\u00f6n\u00f6sen, de nem kiz\u00e1r\u00f3lagosan
  pl.: az aj\u00e1nlati \u00e1r milyen valuta \u00e1rfolyam mellett \u00e9rv\u00e9nyes;
  vagy az aj\u00e1nlat a felh\u00edv\u00e1sban meghat\u00e1rozott aj\u00e1nlati k\u00f6t\u00f6tts\u00e9gt\u0151l
  elt\u00e9r\u0151 ideig \u00e9rv\u00e9nyes; a j\u00f3t\u00e1ll\u00e1s terjedelm\u00e9nek
  a felh\u00edv\u00e1sban \u00e9s/vagy a dokument\u00e1ci\u00f3ban meghat\u00e1rozott\u00f3l
  elt\u00e9r\u0151 korl\u00e1toz\u00e1sa) az aj\u00e1nlat \u00e9rv\u00e9nytelens\u00e9g\u00e9t
  vonhatja maga ut\u00e1n.\\n\\n5) Az aj\u00e1nlati \u00e1rat magyar forintban (HUF),
  nett\u00f3 \u00e9rt\u00e9kben kell megadni a felolv\u00e1solapon az EKR rendszerben.
  A felolv\u00e1solapon szerepl\u0151 \u00f6sszegnek meg kell egyeznie a t\u00e9teles
  kereskedelmi aj\u00e1nlat / \u00e1razott k\u00f6lts\u00e9gvet\u00e9s \u00f6sszesen
  rovatban szerepl\u0151 \u00f6sszeggel.\\n\\n6) Az aj\u00e1nlatok \u00e9rt\u00e9kel\u00e9se
  mindk\u00e9t k\u00f6zbeszerz\u00e9si r\u00e9sz tekintet\u00e9ben:\\n\\n| \u00c9rt\u00e9kel\u00e9si
  szempont | S\u00falysz\u00e1m |\\n|---------------------|----------|\\n| 1. Egy\u00f6sszeg\u0171
  aj\u00e1nlati \u00e1r (nett\u00f3 Ft) | 70 |\\n| 2. 12 h\u00f3napot meghalad\u00f3
  t\u00f6bblet j\u00f3t\u00e1ll\u00e1s m\u00e9rt\u00e9ke | 15 |\\n| 3. A garanci\u00e1lis
  \u00e9s j\u00f3t\u00e1ll\u00e1si id\u0151szak tartam\u00e1n bel\u00fcl b\u00e1rmely
  a Megrendel\u0151 \u00e1ltal felismert hiba V\u00e1llalkoz\u00f3 \u00e1ltali orvosl\u00e1s\u00e1nak
  megkezd\u00e9si id\u0151pontja, a bejelent\u00e9st k\u00f6vet\u0151en (minimum 1,
  maximum 5 munkanap) | 15 |\\n\\n1. **\u00e9rt\u00e9kel\u00e9si r\u00e9szszempont:
  Egy\u00f6sszeg\u0171 aj\u00e1nlati \u00e1r (nett\u00f3 Ft)**\\n\\nAz 1. \u00e9rt\u00e9kel\u00e9si
  r\u00e9szszempont szerinti megaj\u00e1nl\u00e1s al\u00e1t\u00e1maszt\u00e1s\u00e1ra
  aj\u00e1nlattev\u0151knek az aj\u00e1nlathoz \u00e1razott k\u00f6lts\u00e9gvet\u00e9st
  kell csatolni.\\n\\nAz \u00e1razott k\u00f6lts\u00e9gvet\u00e9s elk\u00e9sz\u00edt\u00e9se
  sor\u00e1n az al\u00e1bbiakat sz\u00fcks\u00e9ges figyelembe venni:\\n\\n- Az \u00e1razatlan
  k\u00f6lts\u00e9gvet\u00e9s t\u00e9teleinek tartalm\u00e1t els\u0151dlegesen \u00fagy
  kell \u00e9rtelmezni, hogy azok a megnevez\u00e9s\u00fck szerinti munka minden k\u00f6zvetlen
  \u00e9s k\u00f6zvetett munkam\u0171veleti \u00e9s dologi elem\u00e9t magukban foglalj\u00e1k
  az el\u0151k\u00e9sz\u00edt\u00e9st\u0151l a Szerz\u0151d\u00e9sben megfogalmazott
  \u00e9s az egy\u00e9b vonatkoz\u00f3\\n\\nel\u0151\u00edr\u00e1sokat mindenben kiel\u00e9g\u00edt\u0151
  m\u00f3don t\u00f6rt\u00e9n\u0151 teljes elk\u00e9sz\u00edt\u00e9sig, azaz a t\u00e9telekhez
  tartoz\u00f3 egys\u00e9g\u00e1rakat \u00c1FA (\u00c1ltal\u00e1nos Forgalmi Ad\u00f3)
  n\u00e9lk\u00fcl kell megadni, de tartalmazniuk kell minden egy\u00e9b j\u00e1rul\u00e9kos
  k\u00f6lts\u00e9get is (biztons\u00e1gi elkorl\u00e1toz\u00e1sok, terel\u0151elemek,
  lez\u00e1r\u00e1sok, lerak\u00f3helyi d\u00edjak, el\u0151\u00edrt ellen\u0151rz\u0151
  m\u00e9resek \u00e9s vizsg\u00e1latok, mintav\u00e9telek, min\u0151s\u00edt\u00e9sek,
  min\u0151s\u00e9g tan\u00fas\u00edt\u00e1sok, seg\u00e9danyagok, kit\u0171z\u00e9sek,
  geod\u00e9ziai munk\u00e1k, stb.), valamennyi sz\u00fcks\u00e9ges munka elv\u00e9gz\u00e9s\u00e9t
  teljesen k\u00e9szten, tov\u00e1bb\u00e1 minden v\u00e1mot ad\u00f3t \u00e9s egy\u00e9b
  illet\u00e9k\u00e9t, ami a V\u00e1llalkoz\u00f3nak a Szerz\u0151d\u00e9s alapj\u00e1n,
  vagy b\u00e1rmely m\u00e1s okb\u00f3l kell fizetnie.\\n\\n- Ha egy munkaf\u00e1zis
  t\u00e9tele nem ker\u00fclt k\u00fcl\u00f6n ki\u00edr\u00e1sra, de az abban foglalt
  tev\u00e9kenys\u00e9gre sz\u00fcks\u00e9g van, akkor azok k\u00f6lts\u00e9geit a
  munkat\u00e9telek egys\u00e9g\u00e1r\u00e1ban kell figyelembe venni.\\n- A megadott
  egys\u00e9g\u00e1raknak a m\u0171szaki tartalom megval\u00f3s\u00edt\u00e1s\u00e1hoz
  sz\u00fcks\u00e9ges r\u00e1ford\u00edt\u00e1s \u00f6sszeg\u00e9n t\u00fal a munk\u00e1k
  teljes befejez\u00e9s\u00e9ig v\u00e1rhat\u00f3 \u00e1rv\u00e1ltoz\u00e1sb\u00f3l
  ered\u0151 k\u00f6lts\u00e9geket is tartalmaznia kell, ez\u00e9rt az egys\u00e9g\u00e1rok
  r\u00f6gz\u00edtettek \u00e9s nem v\u00e1ltoztathat\u00f3k a Szerz\u0151d\u00e9s
  id\u0151tartama alatt.\\n- A k\u00f6lts\u00e9gvet\u00e9s(ek) Microsoft Office Excel
  form\u00e1tumban \u00e1ll(nak) az Aj\u00e1nlattev\u0151k rendelkez\u00e9s\u00e9re,
  amelyet kit\u00f6ltve kell az aj\u00e1nlatukhoz csatolniuk, valamint elektronikus
  form\u00e1tumban (Microsoft Office Excel form\u00e1tumban) is!\\n\\nAj\u00e1nlatk\u00e9r\u0151
  felh\u00edvja Aj\u00e1nlattev\u0151k figyelm\u00e9t a Kbt. 71. \u00a7 (8) bekezd\u00e9s
  b) pontj\u00e1ra, mely szerint \u00e1tal\u00e1nyd\u00edjas szerz\u0151d\u00e9s eset\u00e9n
  az \u00e1razott k\u00f6lts\u00e9gvet\u00e9s (r\u00e9szletes \u00e1raj\u00e1nlat)
  valamely t\u00e9tele \u00e9s egys\u00e9g\u00e1ra p\u00f3tolhat\u00f3, m\u00f3dos\u00edthat\u00f3,
  kieg\u00e9sz\u00edthet\u0151 vagy t\u00f6r\u00f6lhet\u0151, amelynek v\u00e1ltoz\u00e1sa
  a teljes aj\u00e1nlati \u00e1rat vagy annak \u00e9rt\u00e9kel\u00e9s al\u00e1 es\u0151
  r\u00e9sz\u00f6sszeget \u00e9s az Aj\u00e1nlattev\u0151k k\u00f6z\u00f6tt az \u00e9rt\u00e9kel\u00e9skor
  kialakul\u00f3 sorrendet nem befoly\u00e1solja.\\n\\n**Aj\u00e1nlatk\u00e9r\u0151
  az aj\u00e1nlatokat a Kbt. 73. \u00a7 (1) bekezd\u00e9s e) pontia alapj\u00e1n \u00e9rv\u00e9nytelennek
  nyilv\u00e1n\u00edthatja az al\u00e1bbi esetekben, amennyiben a k\u00f6vetkez\u0151
  v\u00e1ltoztat\u00e1sok b\u00e1rmelyike eset\u00e9n**\\n\\n**Aj\u00e1nlatk\u00e9r\u0151
  nem lenne k\u00e9pes az aj\u00e1nlatok k\u00f6zbeszerz\u00e9si dokumentumokban foglaltaknak
  megfelel\u0151 \u00e9rt\u00e9kel\u00e9s\u00e9re:**\\n\\n- Aj\u00e1nlattev\u0151
  nem ny\u00fajt be \u00e1razott k\u00f6lts\u00e9gvet\u00e9st,\\n- Aj\u00e1nlattev\u0151
  a k\u00f6lts\u00e9gvet\u00e9s sorait Aj\u00e1nlatk\u00e9r\u0151 erre vonatkoz\u00f3
  j\u00f3v\u00e1hagy\u00e1sa n\u00e9lk\u00fcl (pl. kieg\u00e9sz\u00edt\u0151 t\u00e1j\u00e9koztat\u00e1s)
  \u00faj sorral eg\u00e9sz\u00edti ki, vagy\\n- Aj\u00e1nlattev\u0151 a k\u00f6lts\u00e9gvet\u00e9s
  sorait Aj\u00e1nlatk\u00e9r\u0151 erre vonatkoz\u00f3 j\u00f3v\u00e1hagy\u00e1sa
  n\u00e9lk\u00fcl \u00f6sszevonja, vagy\\n- Aj\u00e1nlattev\u0151 Aj\u00e1nlatk\u00e9r\u0151
  erre vonatkoz\u00f3 j\u00f3v\u00e1hagy\u00e1sa n\u00e9lk\u00fcl a k\u00f6lts\u00e9gvet\u00e9s
  t\u00e9teleit, mennyis\u00e9gi adatait m\u00f3dos\u00edtja, vagy\\n- egy\u00e9b
  m\u00f3don olyan m\u00f3dos\u00edt\u00e1st eszk\u00f6z\u00f6l Aj\u00e1nlattev\u0151
  az \u00e1razatlan k\u00f6lts\u00e9gvet\u00e9sen, mely alapj\u00e1n az nem felel
  meg a k\u00f6zbeszerz\u00e9si dokumentumokban \u00e9s a vonatkoz\u00f3 jogszab\u00e1lyokban
  foglaltaknak.\\n\\nAz aj\u00e1nlatok r\u00e9szszempontok szerinti tartalmi elemeinek
  \u00e9rt\u00e9kel\u00e9se sor\u00e1n adhat\u00f3 pontsz\u00e1m als\u00f3 \u00e9s
  fels\u0151 hat\u00e1ra: 0-10 pont, mely minden r\u00e9szszempont eset\u00e9n azonos.\\n\\nAzon
  \u00e9rt\u00e9kel\u00e9si r\u00e9szszempontok eset\u00e9ben, ahol aj\u00e1nlatk\u00e9r\u0151
  minim\u00e1lis elv\u00e1r\u00e1st hat\u00e1rozott meg, az \u00e9rt\u00e9ket el nem
  \u00e9r\u0151 v\u00e1llal\u00e1sok az aj\u00e1nlat \u00e9rv\u00e9nytelens\u00e9g\u00e9t
  eredm\u00e9nyezik! Az aj\u00e1nlati elemek Aj\u00e1nlatk\u00e9r\u0151 sz\u00e1m\u00e1ra
  legkedvez\u0151bb szintet el\u00e9r\u0151, illetve a legkedvez\u0151bb szintj\u00e9n\u00e9l
  m\u00e9g kedvez\u0151bb v\u00e1llal\u00e1sokra Aj\u00e1nlatk\u00e9r\u0151 egyar\u00e1nt
  a ponthat\u00e1r fels\u0151 hat\u00e1r\u00e1val azonos (10 pont) sz\u00e1m\u00fa
  pontot ad.\\n\\nAj\u00e1nlatk\u00e9r\u0151 az 1. r\u00e9szszempont eset\u00e9ben
  a **ford\u00edtott ar\u00e1nyos\u00edt\u00e1s** elv\u00e9t alkalmazza az al\u00e1bbiak
  szerint: a legalacsonyabb \u00e9rt\u00e9k a legkedvez\u0151bb. Az aj\u00e1nlatk\u00e9r\u0151
  a legkedvez\u0151bb tartalmi elemre a maxim\u00e1lis pontot adja, a t\u00f6bbi aj\u00e1nlat
  tartalmi elem\u00e9re pedig a legkedvez\u0151bb tartalmi elemhez viszony\u00edtva
  ford\u00edtott ar\u00e1nyos\u00edt\u00e1ssal sz\u00e1molja ki a pontsz\u00e1mokat.
  Az \u00e9rt\u00e9kel\u00e9s m\u00f3dszere: az al\u00e1bbi ford\u00edtott ar\u00e1nyos\u00edt\u00e1si
  k\u00e9plet alapj\u00e1n.\\n\\n\\\\[ P = \\\\frac{Alegjobb}{Avizsg\u00e1lt} * (P_{max}
  - P_{min}) + P_{min} \\\\]\\n\\nahol:\\nP: a vizsg\u00e1lt aj\u00e1nlati elem adott
  szempontra vonatkoz\u00f3 pontsz\u00e1ma\\n$P_{\\\\text{max}}$: a pontsk\u00e1la
  fels\u0151 hat\u00e1ra\\n$P_{\\\\text{min}}$: a pontsk\u00e1la als\u00f3 hat\u00e1ra\\nA
  legjobb: a legel\u0151ny\u00f6sebb aj\u00e1nlat tartalmi eleme\\nA vizsg\u00e1lt:
  a vizsg\u00e1lt aj\u00e1nlat tartalmi eleme\\n\\nHa e m\u00f3dszer alkalmaz\u00e1s\u00e1val
  t\u00f6rt pont\u00e9rt\u00e9kek keletkeznek, akkor azokat az \u00e1ltal\u00e1nos
  szab\u00e1lyoknak megfelel\u0151en k\u00e9t tizedes jegyre kell kerek\u00edteni,
  kiv\u00e9ve, ha pontazonoss\u00e1got eredm\u00e9nyezne (ehhez Aj\u00e1nlatk\u00e9r\u0151
  Microsoft Excel programot fog haszn\u00e1lni a pontsz\u00e1m\u00edt\u00e1s sor\u00e1n).\\n\\nA
  m\u00f3dszert l\u00e1sd r\u00e9szletesen a K\u00f6zbeszerz\u00e9si Hat\u00f3s\u00e1g
  \u00fatmutat\u00f3ja a nyertes aj\u00e1nlattev\u0151 kiv\u00e1laszt\u00e1s\u00e1ra
  szolg\u00e1l\u00f3 \u00e9rt\u00e9kel\u00e9si szempontrendszer alkalmaz\u00e1s\u00e1r\u00f3l
  (K\u00c9 2016. \u00e9vi 147. sz\u00e1m; 2016. december 21.) 1. sz. mell\u00e9klet
  A. 1. b) pont ba) alpontj\u00e1ban.\\n\\n2. **\u00e9rt\u00e9kel\u00e9si r\u00e9szszempont:
  12 h\u00f3napot meghalad\u00f3 j\u00f3t\u00e1ll\u00e1s m\u00e9rt\u00e9ke**\\n\\nAj\u00e1nlatk\u00e9r\u0151
  a 2. \u00e9rt\u00e9kel\u00e9si szempont eset\u00e9ben a legjobb aj\u00e1nlatot tartalmaz\u00f3
  aj\u00e1nlatra (legmagasabb j\u00f3t\u00e1ll\u00e1si id\u0151tartam) 10 pontot ad,
  a t\u00f6bbi aj\u00e1nlatra ar\u00e1nyosan kevesebbet (egyenes ar\u00e1nyos\u00edt\u00e1s).
  A pontsz\u00e1mok kisz\u00e1m\u00edt\u00e1sa sor\u00e1n alkalmazand\u00f3 k\u00e9plet:\\n\\n$$P
  = \\\\frac{A \\\\text{ vizsg\u00e1lt}}{A \\\\text{ legjobb}} * (P_{\\\\text{max}}
  - P_{\\\\text{min}}) + P_{\\\\text{min}}$$\\n\\nahol:\\nP: a vizsg\u00e1lt aj\u00e1nlati
  elem adott szempontra vonatkoz\u00f3 pontsz\u00e1ma\\n$P_{\\\\text{max}}$: a pontsk\u00e1la
  fels\u0151 hat\u00e1ra\\n$P_{\\\\text{min}}$: a pontsk\u00e1la als\u00f3 hat\u00e1ra\\nA
  legjobb: a legel\u0151ny\u00f6sebb aj\u00e1nlat tartalmi eleme (maximum 60 h\u00f3napot
  figyelembe v\u00e9ve)\\nA vizsg\u00e1lt: a vizsg\u00e1lt aj\u00e1nlat tartalmi eleme\\n\\nAj\u00e1nlatk\u00e9r\u0151
  a 2. \u00e9rt\u00e9kel\u00e9si szemponttal \u00f6sszef\u00fcgg\u0151 aj\u00e1nlati
  elemmel kapcsolatban 48 h\u00f3napban hat\u00e1rozza meg az aj\u00e1nlati elem legkedvez\u0151bb
  szintj\u00e9t, amelyre \u00e9s az ann\u00e1l m\u00e9g kedvez\u0151bb v\u00e1llal\u00e1sokra
  egyar\u00e1nt az \u00e9rt\u00e9kel\u00e9si ponthat\u00e1r fels\u0151 hat\u00e1r\u00e1val
  azonos sz\u00e1m\u00fa pontot ad.\\n\\nAj\u00e1nlatk\u00e9r\u0151 a 2. \u00e9rt\u00e9kel\u00e9si
  szemponttal \u00f6sszef\u00fcgg\u0151 aj\u00e1nlati elemmel kapcsolatban meghat\u00e1rozza,
  hogy az aj\u00e1nlati elem minimum \u00e9rt\u00e9ke 0 h\u00f3nap, enn\u00e9l kedvez\u0151tlenebb
  az aj\u00e1nlati elem nem lehet, a minimum \u00e9rt\u00e9ket el nem \u00e9r\u0151
  aj\u00e1nlatokat Aj\u00e1nlatk\u00e9r\u0151 \u00e9rv\u00e9nytelennek nyilv\u00e1n\u00edtja.\\n\\nA
  t\u00f6bblet j\u00f3t\u00e1ll\u00e1s m\u00e9rt\u00e9k\u00e9t Aj\u00e1nlatk\u00e9r\u0151
  \u00fagy \u00e9rtelmezi, hogy amennyiben Aj\u00e1nlattev\u0151 0 h\u00f3nap megaj\u00e1nl\u00e1st
  tesz, abban az esetben 12 h\u00f3nap j\u00f3t\u00e1ll\u00e1st v\u00e1llal. Amennyiben
  12 h\u00f3napos megaj\u00e1nl\u00e1st tesz, abban az esetben a k\u00f6telez\u0151en
  el\u0151\u00edrt j\u00f3t\u00e1ll\u00e1s m\u00e9rt\u00e9k\u00e9hez a v\u00e1llal\u00e1s
  m\u00e9rt\u00e9k\u00e9t Aj\u00e1nlatk\u00e9r\u0151 a szerz\u0151d\u00e9sk\u00f6t\u00e9skor
  hozz\u00e1adja, vagyis $12 + 12 = 24$, azaz Aj\u00e1nlattev\u0151 24 h\u00f3nap
  j\u00f3t\u00e1ll\u00e1sra k\u00f6teles.\\n\\nA fenti m\u00f3dszerrel \u00e9rt\u00e9kel
  egyes tartalmi elemekre adott \u00e9rt\u00e9kel\u00e9si pontsz\u00e1mot Aj\u00e1nlatk\u00e9r\u0151
  megszorozza az aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1sban meghat\u00e1rozott
  s\u00falysz\u00e1mmal, a szorzatokat pedig aj\u00e1nlatonk\u00e9nt \u00f6sszeadj\u00e1k.\\n\\nAz
  az aj\u00e1nlat a legkedvez\u0151bb, amelynek az \u00f6sszpontsz\u00e1ma a legnagyobb.\\n\\nAz
  elj\u00e1r\u00e1s nyertese az az aj\u00e1nlattev\u0151, aki az Aj\u00e1nlatk\u00e9r\u0151
  r\u00e9sz\u00e9re az aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1sban \u00e9s a k\u00f6zbeszerz\u00e9si
  dokumentumokban meghat\u00e1rozott felt\u00e9telek alapj\u00e1n, valamint az \u00e9rt\u00e9kel\u00e9si
  szempontok szerint a legkedvez\u0151bb \u00e9rv\u00e9nyes aj\u00e1nlatot tette.\\n\\n3.
  **\u00e9rt\u00e9kel\u00e9si szempont: A garanci\u00e1lis \u00e9s j\u00f3t\u00e1ll\u00e1si
  id\u0151szak tartam\u00e1n bel\u00fcl b\u00e1rmely a Megrendel\u0151 \u00e1ltal
  felismert hiba V\u00e1llalkoz\u00f3 \u00e1ltali orvosl\u00e1s\u00e1nak megkezd\u00e9si
  id\u0151pontja, a bejelent\u00e9st k\u00f6vet\u0151en (minimum 1, maximum 5 munkanap)**\\n\\nA
  garanci\u00e1lis \u00e9s j\u00f3t\u00e1ll\u00e1si id\u0151szak tartam\u00e1n bel\u00fcl
  b\u00e1rmely a Megrendel\u0151 \u00e1ltal felismert hiba V\u00e1llalkoz\u00f3 \u00e1ltali
  orvosl\u00e1s\u00e1nak megkezd\u00e9si id\u0151pontja, a bejelent\u00e9st k\u00f6vet\u0151en
  minimum 1, maximum 5 munkanap. Az 5 munkanapot meghalad\u00f3 v\u00e1llal\u00e1sok
  \u00e9rv\u00e9nytelen aj\u00e1nlatot eredm\u00e9nyeznek.\\n\\nEzen \u00e9rt\u00e9kel\u00e9si
  szempont eset\u00e9ben a megaj\u00e1nl\u00e1sokat aj\u00e1nlatk\u00e9r\u0151 a ford\u00edtott
  ar\u00e1nyos\u00edt\u00e1s alapj\u00e1n alak\u00edtja \u00e1t pontsz\u00e1mokk\u00e1.
  Ebben az esetben a legalacsonyabb \u00e9rt\u00e9k legkedvez\u0151bb (ezzen aj\u00e1nlat
  kapja a maxim\u00e1lis pontsz\u00e1mot (10 pont), a t\u00f6bbi aj\u00e1nlat tartalmi
  elem\u00e9re pedig a legkedvez\u0151bb tartalmi elemhez viszony\u00edtva ford\u00edtottan
  ar\u00e1nyosan sz\u00e1molja ki a pontsz\u00e1mokat az al\u00e1bbi k\u00e9plet szerint:\\n\\n\\\\[
  P = \\\\frac{A_{legjobb}}{A_{vizsg\u00e1lt}} * (P_{max} - P_{min}) + P_{min} \\\\]\\n\\nahol:\\n-
  \\\\( P \\\\): a vizsg\u00e1lt aj\u00e1nlati elem adott szempontra vonatkoz\u00f3
  pontsz\u00e1ma\\n- \\\\( P_{max} \\\\): a pontsk\u00e1la fels\u0151 hat\u00e1ra\\n-
  \\\\( P_{min} \\\\): a pontsk\u00e1la als\u00f3 hat\u00e1ra\\n- \\\\( A_{legjobb}
  \\\\): a legel\u0151ny\u00f6sebb aj\u00e1nlat tartalmi eleme\\n- \\\\( A_{vizsg\u00e1lt}
  \\\\): a vizsg\u00e1lt aj\u00e1nlat tartalmi eleme\\n\\n**XV. Hi\u00e1nyp\u00f3tl\u00e1s,
  sz\u00e1m\u00edt\u00e1si hiba \u00e9s jav\u00edt\u00e1s**\\n\\n1) Az aj\u00e1nlatk\u00e9r\u0151
  az \u00f6sszes aj\u00e1nlattev\u0151 \u00e9s r\u00e9szv\u00e9telre jelentkez\u0151
  sz\u00e1m\u00e1ra azonos felt\u00e9telekkel biztos\u00edtja a hi\u00e1nyp\u00f3tl\u00e1s
  lehet\u0151s\u00e9g\u00e9t.\\n\\n2) Am\u00edg b\u00e1rmely aj\u00e1nlattev\u0151
  vagy r\u00e9szv\u00e9telre jelentkez\u0151 sz\u00e1m\u00e1ra hi\u00e1nyp\u00f3tl\u00e1sra
  vagy felvil\u00e1gos\u00edt\u00e1s ny\u00fajt\u00e1s\u00e1ra hat\u00e1rid\u0151
  van folyamatban, az aj\u00e1nlattev\u0151 vagy r\u00e9szv\u00e9telre jelentkez\u0151
  p\u00f3tolhat olyan hi\u00e1nyokat, amelyekre n\u00e9zve az aj\u00e1nlatk\u00e9r\u0151
  nem h\u00edrta fel hi\u00e1nyp\u00f3tl\u00e1sra.\\n\\n3) A Kbt. 71. \u00a7 (8) bekezd\u00e9se
  szerint a hi\u00e1nyp\u00f3tl\u00e1s vagy a felvil\u00e1gos\u00edt\u00e1s megad\u00e1sa:\\n   a)
  nem j\u00e1rhat a Kbt. 2. \u00a7 (1)-(3) \u00e9s (5) bekezd\u00e9s\u00e9ben foglalt
  alapelvek s\u00e9relm\u00e9vel \u00e9s\\n   b) annak sor\u00e1n az aj\u00e1nlatban
  a beszerz\u00e9s t\u00e1rgy\u00e1nak jellemz\u0151ire, az aj\u00e1nlattev\u0151
  szerz\u0151d\u00e9ses k\u00f6telezetts\u00e9ge v\u00e9grehajt\u00e1s\u00e1nak m\u00f3dj\u00e1ra
  vagy a szerz\u0151d\u00e9s m\u00e1s felt\u00e9teleire vonatkoz\u00f3 dokumentum
  tekintet\u00e9ben csak olyan nem jelent\u0151s, egyedi r\u00e9szletk\u00e9rd\u00e9sre
  vonatkoz\u00f3 hiba jav\u00edthat\u00f3 vagy hi\u00e1ny p\u00f3tolhat\u00f3, tov\u00e1bb\u00e1
  \u00e1tal\u00e1nyd\u00edjas szerz\u0151d\u00e9s eset\u00e9n az \u00e1razott k\u00f6lts\u00e9gvet\u00e9s
  (r\u00e9szletes \u00e1raj\u00e1nlat) valamely t\u00e9tele \u00e9s egys\u00e9g\u00e1ra
  p\u00f3tolhat\u00f3, m\u00f3dos\u00edthat\u00f3, kieg\u00e9sz\u00edthet\u0151 vagy
  t\u00f6r\u00f6lhet\u0151, amelynek v\u00e1ltoz\u00e1sa a teljes aj\u00e1nlati \u00e1rat
  vagy annak \u00e9rt\u00e9kel\u00e9s al\u00e1 es\u0151 r\u00e9sz\u00f6sszeg\u00e9t
  \u00e9s az aj\u00e1nlattev\u0151k k\u00f6z\u00f6tt az \u00e9rt\u00e9kel\u00e9skor
  kialakul\u00f3 sorrendet nem befoly\u00e1solja.\\n\\n4) A Kbt. 71. \u00a7 (11) bekezd\u00e9se
  alapj\u00e1n ha az aj\u00e1nlatk\u00e9r\u0151 az aj\u00e1nlatban az \u00e9rt\u00e9kel\u00e9sre
  kihat\u00f3 sz\u00e1m\u00edt\u00e1si hib\u00e1t \u00e9szlel - a hiba \u00e9s a jav\u00edtand\u00f3
  \u00e9rt\u00e9k, valamint a jav\u00edt\u00e1s eredm\u00e9nyek\u00e9nt meghat\u00e1rozott
  \u00e9rt\u00e9k megjel\u00f6l\u00e9s\u00e9vel -, felh\u00edvja az aj\u00e1nlattev\u0151t
  annak jav\u00edt\u00e1s\u00e1ra. A sz\u00e1m\u00edt\u00e1si hiba jav\u00edt\u00e1s\u00e1nak
  az eredm\u00e9ny\u00e9t az aj\u00e1nlatk\u00e9r\u0151 akk\u00e9nt \u00e1llap\u00edtja
  meg, hogy a k\u00f6zbeszerz\u00e9s t\u00e1rgya elemeinek t\u00e9telesen meghat\u00e1rozott
  \u00e9rt\u00e9keit (az alapadatokat) alapul v\u00e9ve kisz\u00e1m\u00edtja az \u00f6sszes\u00edtett
  ellen\u00e9rt\u00e9ket vagy m\u00e1s - az aj\u00e1nlatban megtal\u00e1lhat\u00f3
  sz\u00e1m\u00edt\u00e1son alapul\u00f3 - adatot. Ha a sz\u00e1m\u00edt\u00e1si hiba
  jav\u00edt\u00e1s\u00e1t nem, vagy nem az el\u0151\u00edrt hat\u00e1rid\u0151ben,
  vagy tov\u00e1bbra is hib\u00e1san teljes\u00edtett\u00e9k, az aj\u00e1nlat \u00e9rv\u00e9nytelen.\\n\\n**XVI.
  Az elj\u00e1r\u00e1s eredm\u00e9nye, a szerz\u0151d\u00e9s megk\u00f6t\u00e9se**\\n\\n1)
  A Kbt. 131. \u00a7 (1) bekezd\u00e9se szerint eredm\u00e9nyes k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1s alapj\u00e1n a szerz\u0151d\u00e9st a nyertes aj\u00e1nlattev\u0151vel
  - k\u00f6z\u00f6s aj\u00e1nlatt\u00e9tel eset\u00e9n a nyertes aj\u00e1nlattev\u0151kkel
  - kell \u00edr\u00e1sban megk\u00f6tni a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sban
  k\u00f6z\u00f6lt v\u00e9gleges felt\u00e9telek, szerz\u0151d\u00e9stervezet \u00e9s
  aj\u00e1nlat tartalm\u00e1nak megfelel\u0151en.\\n\\n2) Az aj\u00e1nlatk\u00e9r\u0151
  csak az elj\u00e1r\u00e1s nyertes\u00e9vel k\u00f6theti meg a szerz\u0151d\u00e9st,
  vagy - a nyertes visszal\u00e9p\u00e9se eset\u00e9n - az aj\u00e1nlatok \u00e9rt\u00e9kel\u00e9se
  sor\u00e1n a k\u00f6vetkez\u0151 legkedvez\u0151bb aj\u00e1nlatot tev\u0151nek min\u0151s\u00edtett
  aj\u00e1nlattev\u0151vel, ha \u0151t az aj\u00e1nlatok elb\u00edr\u00e1l\u00e1s\u00e1r\u00f3l
  sz\u00f3l\u00f3 \u00edr\u00e1sbeli \u00f6sszegez\u00e9sben megjel\u00f6lte.\\n\\n3)
  A nyertes aj\u00e1nlattev\u0151 \u00e9s \u2013 adott esetben - a m\u00e1sodik legkedvez\u0151bb
  aj\u00e1nlatot tett aj\u00e1nlattev\u0151 aj\u00e1nlati k\u00f6t\u00f6tts\u00e9ge
  az aj\u00e1nlatok elb\u00edr\u00e1l\u00e1s\u00e1r\u00f3l sz\u00f3l\u00f3 fr\u00e1sbeli
  \u00f6sszegez\u00e9snek az aj\u00e1nlattev\u0151k r\u00e9sz\u00e9re t\u00f6rt\u00e9nt
  megk\u00fcld\u00e9se napj\u00e1t\u00f3l sz\u00e1m\u00edtott harminc - \u00e9p\u00edt\u00e9si
  beruh\u00e1z\u00e1s eset\u00e9n hatvan - nappal meghosszabbodik.\\n\\n4) Aj\u00e1nlatk\u00e9r\u0151
  a szerz\u0151d\u00e9st az aj\u00e1nlati k\u00f6t\u00f6tts\u00e9g lej\u00e1rt\u00e1ig
  k\u00f6teles a szerz\u0151d\u00e9st megk\u00f6tni.\\n\\n5) A szerz\u0151d\u00e9s
  nem k\u00f6thet\u0151 meg azonban a szerz\u0151d\u00e9s az fr\u00e1sbeli \u00f6sszegez\u00e9s
  - ha az \u00f6sszegez\u00e9s jav\u00edt\u00e1s\u00e1ra ker\u00fcl sor \u00e9s az
  elj\u00e1r\u00e1s eredm\u00e9nyess\u00e9g\u00e9re, az aj\u00e1nlat \u00e9rv\u00e9nyess\u00e9g\u00e9re
  vagy az \u00e9rt\u00e9kel\u00e9s eredm\u00e9ny\u00e9re vonatkoz\u00f3 adat m\u00f3dosul,
  a m\u00f3dos\u00edtott \u00f6sszegez\u00e9s - megk\u00fcld\u00e9se napj\u00e1t k\u00f6vet\u0151
  t\u00edz napos id\u0151tartam lej\u00e1rt\u00e1ig, a 115. \u00a7 szerinti elj\u00e1r\u00e1s
  eset\u00e9n az fr\u00e1sbeli \u00f6sszegez\u00e9s megk\u00fcld\u00e9se napj\u00e1t
  k\u00f6vet\u0151 \u00f6t napos id\u0151tartam lej\u00e1rt\u00e1ig.\\n\\n6) Az aj\u00e1nlatk\u00e9r\u0151
  k\u00f6teles szerz\u0151d\u00e9ses felt\u00e9telk\u00e9nt el\u0151\u00edrni, hogy:\\n\\n-
  nem fizethet, illetve sz\u00e1mlahat el a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9vel
  \u00f6sszef\u00fcgg\u00e9sben olyan k\u00f6lts\u00e9geket, amelyek a 62. \u00a7
  (1) bekezd\u00e9s k) pont ka)-kb) alpontja szerinti felt\u00e9teleknek nem megfelel\u0151
  t\u00e1rsas\u00e1g tekintet\u00e9ben mer\u00fclnek fel, \u00e9s amelyek a nyertes
  aj\u00e1nlattev\u0151 ad\u00f3k\u00f6teles j\u00f6vedelm\u00e9nek cs\u00f6kkent\u00e9s\u00e9re
  alkalmasak;\\n- a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9nek teljes id\u0151tartama
  alatt tulajdonosi szerkezetet az aj\u00e1nlatk\u00e9r\u0151 sz\u00e1m\u00e1ra megismerhet\u0151v\u00e9
  teszi \u00e9s a 143. \u00a7 (3) bekezd\u00e9se szerinti \u00fcgyletekr\u0151l az
  aj\u00e1nlatk\u00e9r\u0151t halad\u00e9ktalanul \u00e9rtes\u00edti.\\n\\n7) Az aj\u00e1nlatk\u00e9r\u0151kent
  szerz\u0151d\u0151 f\u00e9l jogosult \u00e9s egyben k\u00f6teles a szerz\u0151d\u00e9st
  felmondani - ha sz\u00fcks\u00e9ges olyan hat\u00e1rid\u0151vel, amely lehet\u0151v\u00e9
  teszi, hogy a szerz\u0151d\u00e9ssel \u00e9rintett feladata ell\u00e1t\u00e1s\u00e1r\u00f3l
  gondoskodni tudjon \u2013 ha:\\n\\n- a nyertes aj\u00e1nlattev\u0151ben k\u00f6zvetetten
  vagy k\u00f6zvetlen\u00fcl 25%-ot meghalad\u00f3 tulajdoni r\u00e9szesed\u00e9st
  szerez valamely olyan jogi szem\u00e9ly vagy szem\u00e9lyes joga szerint jogk\u00e9pes
  szervezet, amely tekintet\u00e9ben fenn\u00e1ll a 62. \u00a7 (1) bekezd\u00e9s k)
  pont kb) alpontj\u00e1ban meghat\u00e1rozott felt\u00e9tel;\\n- a nyertes aj\u00e1nlattev\u0151
  k\u00f6zvetetten vagy k\u00f6zvetlen\u00fcl 25%-ot meghalad\u00f3 tulajdoni r\u00e9szesed\u00e9st
  szerez valamely olyan jogi szem\u00e9lyben vagy szem\u00e9lyes joga szerint jogk\u00e9pes
  szervezetben, amely tekintet\u00e9ben fenn\u00e1ll a 62. \u00a7 (1) bekezd\u00e9s
  k) pont kb) alpontj\u00e1ban meghat\u00e1rozott felt\u00e9tel.\\n\\nJelen pontban
  eml\u00edtett felmond\u00e1s eset\u00e9n a nyertes aj\u00e1nlattev\u0151 a szerz\u0151d\u00e9s
  megsz\u0171n\u00e9se el\u0151tt m\u00e1r teljes\u00edtett szolg\u00e1ltat\u00e1s
  szerz\u0151d\u00e9sszer\u0171 p\u00e9nzbeli ellen\u00e9rt\u00e9k\u00e9re jogosult.\\n\\n8)
  A k\u00fclf\u00f6ldi ad\u00f3illet\u0151s\u00e9g\u0171 nyertes aj\u00e1nlattev\u0151
  k\u00f6teles a szerz\u0151d\u00e9shez arra vonatkoz\u00f3 meghatalmaz\u00e1st csatolni,
  hogy az illet\u0151s\u00e9ge szerinti ad\u00f3hat\u00f3s\u00e1gt\u00f3l a magyar
  ad\u00f3hat\u00f3s\u00e1g k\u00f6zvetlen\u00fcl beszerezhet a nyertes aj\u00e1nlattev\u0151re
  vonatkoz\u00f3 adatokat az orsz\u00e1gok k\u00f6z\u00f6tti jogseg\u00e9ly ig\u00e9nybev\u00e9tele
  n\u00e9lk\u00fcl.\\n\\n9) A k\u00f6zbeszerz\u00e9si szerz\u0151d\u00e9st a k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1s alapj\u00e1n nyertes aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151
  f\u00e9lnek, illetve k\u00f6z\u00f6sen aj\u00e1nlatot tev\u0151knek kell teljes\u00edtenie.\\n\\n10)
  Az aj\u00e1nlattev\u0151k\u00e9nt szerz\u0151d\u0151 f\u00e9l teljes\u00edt\u00e9s\u00e9ben
  k\u00f6teles k\u00f6zrem\u0171k\u00f6dni az olyan alv\u00e1llalkoz\u00f3 \u00e9s
  szakember, amely a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sban r\u00e9szt vett
  az aj\u00e1nlattev\u0151 alkalmass\u00e1g\u00e1nak igazol\u00e1s\u00e1ban. Az aj\u00e1nlattev\u0151
  k\u00f6teles az aj\u00e1nlatk\u00e9r\u0151nek a teljes\u00edt\u00e9s sor\u00e1n
  minden olyan - ak\u00e1r a kor\u00e1bban megjel\u00f6lt alv\u00e1llalkoz\u00f3 helyett
  ig\u00e9nybe venni k\u00edv\u00e1nt - alv\u00e1llalkoz\u00f3 bevon\u00e1s\u00e1t
  bejelenteni, amelyet az aj\u00e1nlat\u00e1ban nem nevezett meg \u00e9s a bejelent\u00e9ssel
  egy\u00fctt nyilatkoznia kell arr\u00f3l is, hogy az \u00e1ltala ig\u00e9nybe venni
  k\u00edv\u00e1nt alv\u00e1llalkoz\u00f3 nem \u00e1ll a kiz\u00e1r\u00f3 okok hat\u00e1lya
  alatt.\\n\\n11) A nyertes aj\u00e1nlattev\u0151 legk\u00e9s\u0151bb a szerz\u0151d\u00e9s
  megk\u00f6t\u00e9s\u00e9nek id\u0151pontj\u00e1ban k\u00f6teles az aj\u00e1nlatk\u00e9r\u0151nek
  valamennyi olyan alv\u00e1llalkoz\u00f3t bejelenteni, amely r\u00e9szt vesz a szerz\u0151d\u00e9s
  teljes\u00edt\u00e9s\u00e9ben, \u00e9s - ha a megel\u0151z\u0151 k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1sban az adott alv\u00e1llalkoz\u00f3t m\u00e9g nem nevezte meg -
  a bejelent\u00e9ssel egy\u00fctt nyilatkozni arr\u00f3l is, hogy az \u00e1ltala
  ig\u00e9nybe venni k\u00edv\u00e1nt alv\u00e1llalkoz\u00f3 nem \u00e1ll kiz\u00e1r\u00f3
  okok hat\u00e1lya alatt. A nyertes aj\u00e1nlattev\u0151 a szerz\u0151d\u00e9s teljes\u00edt\u00e9s\u00e9nek
  id\u0151tartama alatt k\u00f6teles az aj\u00e1nlatk\u00e9r\u0151nek minden tov\u00e1bbi,
  a teljes\u00edt\u00e9sbe bevonni k\u00edv\u00e1nt alv\u00e1llalkoz\u00f3t el\u0151zetesen
  bejelenteni, \u00e9s a bejelent\u00e9ssel egy\u00fctt nyilatkozni arr\u00f3l is,
  hogy az \u00e1ltala ig\u00e9nybe venni k\u00edv\u00e1nt alv\u00e1llalkoz\u00f3 nem
  \u00e1ll kiz\u00e1r\u00f3 okok hat\u00e1lya alatt.\\n\\n12) Az elj\u00e1r\u00e1s
  sor\u00e1n az aj\u00e1nlattev\u0151 \u00e1ltal bemutatott valamely szervezet vagy
  szakember bevonas\u00e1s\u00e1t\u00f3l nem lehet eltekinteni olyan esetben, ha az
  \u00e9rintett szerz\u0151d\u00e9s saj\u00e1tos tulajdons\u00e1gait figyelembe v\u00e9ve
  az adott szem\u00e9ly (szervezet) ig\u00e9nybev\u00e9tele a k\u00f6zbeszerz\u00e9si
  elj\u00e1r\u00e1sban az aj\u00e1nlatok \u00e9rt\u00e9kel\u00e9sekor meghat\u00e1roz\u00f3
  k\u00f6r\u00fclm\u00e9nynek min\u0151s\u00fclt. Ilyen esetben csak a jogut\u00f3dias
  olyan eseteiben v\u00e1ltozhat a bevont szervezet, ha az \u00faj szervezet az \u00e9rt\u00e9kel\u00e9skor
  figyelembe vett minden relev\u00e1ns k\u00f6r\u00fclm\u00e9ny - k\u00fcl\u00f6n\u00f6s
  tekintettel a Kbt. 76. \u00a7 (3) bekezd\u00e9s b) pontja szerinti esetben az \u00e9rt\u00e9ktelt
  szem\u00e9lyi \u00e1llom\u00e1ny - tekintet\u00e9ben az elj\u00e1r\u00e1sban bemutatott
  szervezet jogut\u00f3dj\u00e1nak tekinthet\u0151. Az \u00e9rt\u00e9kel\u00e9skor
  meghat\u00e1roz\u00f3 szakember szem\u00e9lye csak az aj\u00e1nlatk\u00e9r\u0151
  hozz\u00e1j\u00e1rul\u00e1s\u00e1val \u00e9s abban az esetben v\u00e1ltozhat, ha
  az \u00e9rt\u00e9kel\u00e9skor figyelembe vett minden relev\u00e1ns k\u00f6r\u00fclm\u00e9ny
  tekintet\u00e9ben az \u00e9rt\u00e9kelettel egyen\u00e9rt\u00e9k\u0171 szakember
  ker\u00fcl bemutat\u00e1sra.\\n\\n13) Taj\u00e9koztatjuk a T. Aj\u00e1nlattev\u0151ket,
  hogy \u00e9p\u00edt\u00e9si beruh\u00e1z\u00e1sok eset\u00e9n az Aj\u00e1nlattev\u0151
  az \u00e9p\u00edt\u00e9si beruh\u00e1z\u00e1sok, valamint az \u00e9p\u00edt\u00e9si
  beruh\u00e1z\u00e1sokhoz kapcsol\u00f3d\u00f3 tervez\u0151i \u00e9s m\u00e9rn\u00f6ki
  szolg\u00e1ltat\u00e1sok k\u00f6zbeszerz\u00e9s\u00e9nek r\u00e9szletes szab\u00e1lyair\u00f3l
  sz\u00f3l\u00f3 322/2015. (X. 30.) Korm. rendelet 26.\u00a7 alapj\u00e1n k\u00f6teles
  legk\u00e9s\u0151bb a szerz\u0151d\u00e9sk\u00f6t\u00e9s id\u0151pontj\u00e1ra felel\u0151ss\u00e9gbiztos\u00edt\u00e1si
  szerz\u0151d\u00e9st k\u00f6tni, vagy megl\u00e9v\u0151 felel\u0151ss\u00e9gbiztos\u00edt\u00e1s\u00e1t
  kiterjeszteni az aj\u00e1nlatk\u00e9r\u0151 \u00e1ltal az elj\u00e1r\u00e1st megind\u00edt\u00f3
  felh\u00edv\u00e1sban vagy a k\u00f6zbeszerz\u00e9si dokumentumokban el\u0151\u00edrt
  m\u00e9rt\u00e9k\u0171 \u00e9s terjedelm\u0171 felel\u0151ss\u00e9gbiztos\u00edt\u00e1sra.
  Felh\u00edvjuk a T. Aj\u00e1nlattev\u0151k figyelm\u00e9t, hogy a fenti esetben
  a szerz\u0151d\u00e9sk\u00f6t\u00e9s felt\u00e9tele a k\u00f6zbeszerz\u00e9si dokumentumokban
  el\u0151\u00edrt m\u00e9rt\u00e9k\u0171 \u00e9s terjedelm\u0171 felel\u0151ss\u00e9gbiztos\u00edt\u00e1sra
  vonatkoz\u00f3 k\u00f6tv\u00e9ny bemutat\u00e1sa.\\n\\n**XVII. Tov\u00e1bbi inform\u00e1ci\u00f3k**\\n\\n1)
  A k\u00f6zbeszerz\u00e9si dokumentum EKR-ben t\u00f6rt\u00e9n\u0151 el\u00e9r\u00e9se
  az elj\u00e1r\u00e1sban val\u00f3 r\u00e9szv\u00e9tel felt\u00e9tele!\\n\\n2) Aj\u00e1nlattev\u0151
  k\u00f6teless\u00e9ge, hogy tanulm\u00e1nyozza a k\u00f6zbeszerz\u00e9si dokumentum
  valamennyi el\u0151\u00edr\u00e1s\u00e1t. Amennyiben az aj\u00e1nlattev\u0151 nem
  adja meg az \u00f6sszes, a felh\u00edv\u00e1sban \u00e9s k\u00f6zbeszerz\u00e9si
  dokumentumban k\u00e9rt inform\u00e1ci\u00f3t, vagy ha a beny\u00fajtott aj\u00e1nlat
  nem felel meg a felh\u00edv\u00e1sban \u00e9s k\u00f6zbeszerz\u00e9si dokumentumban
  foglaltaknak, ez minden vonatkoz\u00e1sban az aj\u00e1nlattev\u0151 kock\u00e1zata
  \u00e9s az aj\u00e1nlat \u00e9rv\u00e9nytelens\u00e9g\u00e9t eredm\u00e9nyezheti.\\n\\n3)
  Az aj\u00e1nlattev\u0151nek az aj\u00e1nlatt\u00e9teli felh\u00edv\u00e1sban \u00e9s
  a k\u00f6zbeszerz\u00e9si dokumentumban meghat\u00e1rozott tartalmi \u00e9s formai
  k\u00f6vetelm\u00e9nyeknek megfelel\u0151en kell aj\u00e1nlat\u00e1t elk\u00e9sz\u00edtenie
  \u00e9s beny\u00fajtania.\\n\\n4) Az aj\u00e1nlatnak tartalmaznia kell k\u00fcl\u00f6n\u00f6sen
  az aj\u00e1nlattev\u0151 kifejezett nyilatkozat\u00e1t az aj\u00e1nlatt\u00e9teli
  felh\u00edv\u00e1s felt\u00e9teleire, a szerz\u0151d\u00e9s megk\u00f6t\u00e9s\u00e9re
  \u00e9s teljes\u00edt\u00e9s\u00e9re, valamint a k\u00e9rt ellenszolg\u00e1ltat\u00e1sra
  vonatkoz\u00f3an.\\n\\n5) Az aj\u00e1nlatk\u00e9r\u0151 felh\u00edvja az aj\u00e1nlattev\u0151k
  figyelm\u00e9t a Kbt. 36.\u00a7-\u00e1ban foglaltakra, miszerint: \u201eAz aj\u00e1nlattev\u0151
  ugyanabban a k\u00f6zbeszerz\u00e9si elj\u00e1r\u00e1sban \u2013 r\u00e9szaj\u00e1nlat-t\u00e9teli
  lehet\u0151s\u00e9g biztos\u00edt\u00e1sa eset\u00e9n ugyanazon r\u00e9sz tekintet\u00e9ben\\n\\na)
  nem tehet m\u00e1sik aj\u00e1nlatot m\u00e1s aj\u00e1nlattev\u0151vel k\u00f6z\u00f6sen,\\nb)
  m\u00e1s aj\u00e1nlattev\u0151 alv\u00e1llalkoz\u00f3jak\u00e9nt nem vehet r\u00e9szt,\\n\\nc)
  m\u00e1s aj\u00e1nlatot beny\u00fajt\u00f3 aj\u00e1nlattev\u0151 szerz\u0151d\u00e9s
  teljes\u00edt\u00e9s\u00e9re val\u00f3 alkalmass\u00e1g\u00e1t nem igazolhatja [Kbt.
  65. \u00a7 (7) bekezd\u00e9s].\u201d\\n\\n6) Ahol a k\u00f6zbeszerz\u00e9s t\u00e1rgy\u00e1nak
  egy\u00e9rtelm\u0171 \u00e9s k\u00f6z\u00e9rthet\u0151 meghat\u00e1roz\u00e1sa sz\u00fcks\u00e9gess\u00e9
  tesz meghat\u00e1rozott gy\u00e1rtm\u00e1ny\u00fa, eredet\u0171, t\u00edpus\u00fa
  doogra, elj\u00e1r\u00e1sra, tev\u00e9kenys\u00e9gre, szem\u00e9lyre, szabadalomra
  vagy v\u00e9djegyre val\u00f3 hivatkoz\u00e1st, ott Aj\u00e1nlatk\u00e9r\u0151 321/2015.
  (X. 30.) Korm. rendelet 46. \u00a7 (3) bekezd\u00e9s\u00e9ben foglaltak szerint
  az azzal egyen\u00e9rt\u00e9k\u0171 eszk\u00f6z\u00f6k, berendez\u00e9sek stb. megaj\u00e1nl\u00e1s\u00e1t
  is elfogadja. Amennyiben Aj\u00e1nlattev\u0151 nem a dokumentumokban meghat\u00e1rozott
  term\u00e9ket/szolg\u00e1ltat\u00e1st szerepelteti aj\u00e1nlat\u00e1ban, \u00fagy
  csatolni k\u00f6teles az \u00e1ltala megaj\u00e1nlott term\u00e9k/szolg\u00e1ltat\u00e1s
  egyen\u00e9rt\u00e9k\u0171s\u00e9g\u00e9t teljes k\u00f6r\u0171en \u00e9s hitelt
  \u00e9rdeml\u0151en bizony\u00edt\u00f3 okiratot(kat), melyek alapj\u00e1n Aj\u00e1nlatk\u00e9r\u0151
  egy\u00e9rtelm\u0171en meggy\u0151z\u0151dik a megaj\u00e1nlott term\u00e9k/szolg\u00e1ltat\u00e1s
  megfelel\u0151s\u00e9g\u00e9r\u0151l. Aj\u00e1nlatk\u00e9r\u0151 ebben a k\u00f6rben
  tov\u00e1bbi okiratokat, dokumentumokat k\u00e9reth be az egyen\u00e9rt\u00e9k\u0171s\u00e9g
  meg\u00e1llap\u00edt\u00e1sa \u00e9rdek\u00e9ben. Amennyiben a m\u0171szaki le\u00edr\u00e1s
  meghat\u00e1rozott gy\u00e1rtm\u00e1ny\u00fa, eredet\u0171, t\u00edpus\u00fa doogra,
  elj\u00e1r\u00e1sra, tev\u00e9kenys\u00e9gre, szem\u00e9lyre, szabadalomra vagy
  v\u00e9djegyre val\u00f3 hivatkoz\u00e1st tartalmaz, abban az esetben Aj\u00e1nlatk\u00e9r\u0151
  minden esetben a \u201evagy azzal egyen\u00e9rt\u00e9k\u0171\u201d term\u00e9ket
  is \u00e9rt.\\n\\n7) Aj\u00e1nlatk\u00e9r\u0151 az Aj\u00e1nlattev\u0151k c\u00e9gjegyz\u00e9s\u00e9nek
  adatait a www.e-cegjegyzek.hu weboldalon ellen\u0151rzi. Amennyiben az eml\u00edtett
  weboldalon az aj\u00e1nlattev\u0151nek, c\u00e9gjegyz\u00e9si adatai nem tal\u00e1lhat\u00f3ak
  meg, akkor az aj\u00e1nlatt\u00e9teli hat\u00e1rid\u0151t megel\u0151z\u0151 60
  napn\u00e1l nem r\u00e9gebbi c\u00e9gkivonato(ka)t eredetiben vagy egyszer\u0171
  m\u00e1solatban az aj\u00e1nlathoz csatolni sz\u00fcks\u00e9ges. Nem c\u00e9g keret\u00e9ben
  folytatott tev\u00e9kenys\u00e9gek eset\u00e9ben - a m\u0171k\u00f6d\u00e9si form\u00e1nak
  megfelel\u0151en - a nyilv\u00e1ntart\u00f3 b\u00edr\u00f3s\u00e1g/k\u00f6lts\u00e9gvet\u00e9si
  szerv/kamara \u00e1ltali nyilv\u00e1ntart\u00e1s m\u00e1solata csatoland\u00f3 (amennyiben
  az adatokat az aj\u00e1nlatk\u00e9r\u0151 magyar nyelven rendelkez\u00e9sre \u00e1ll\u00f3,
  elektronikus, hat\u00f3s\u00e1gi nyilv\u00e1ntart\u00e1sb\u00f3l ingyenesen nem
  tudja ellen\u0151rizni). Egy\u00e9ni v\u00e1llalkoz\u00f3k eset\u00e9n a c\u00e9gjegyz\u00e9s
  adatait Aj\u00e1nlatk\u00e9r\u0151 a https://www.nyilvantarto.hu/evny-lekerdezo/
  oldalon ellen\u0151rzi.\\n\\n8) Beny\u00fajtand\u00f3 az aj\u00e1nlattev\u0151,
  az aj\u00e1nlatban nyilatkozatot tev\u0151 a Kbt. 65.\u00a7 (1) bekezd\u00e9s b)-c)
  pont szerint alkalmass\u00e1g igazol\u00e1s\u00e1hoz kapacit\u00e1sait rendelkez\u00e9sre
  bocs\u00e1t\u00f3 szervezet c\u00e9gkivonata szerint c\u00e9gjegyz\u00e9sre jogosult
  azon k\u00e9pvisel\u0151(k) - 2006. \u00e9vi V. t\u00f6rv\u00e9ny 9.\u00a7 szerinti
  - al\u00e1\u00edr\u00e1si c\u00edmp\u00e9ld\u00e1ny\u00e1nak (vagy \u00fcgyv\u00e9d
  \u00e1ltal ellenjegyzett al\u00e1\u00edr\u00e1smint\u00e1j\u00e1nak) egyszer\u0171
  m\u00e1solati p\u00e9ld\u00e1nya, akik al\u00e1\u00edr\u00e1ssukkal ell\u00e1tt\u00e1k
  az aj\u00e1nlatot (aj\u00e1nlatban szerepl\u0151 iratot).\\n\\n9) Amennyiben az
  aj\u00e1nlatban szerepl\u0151 b\u00e1rmely iratot nem a c\u00e9gjegyz\u00e9sre jogosultak
  \u00edrt\u00e1k al\u00e1, az \u00e1ltaluk al\u00e1\u00edrt meghatalmaz\u00e1s m\u00e1solati
  p\u00e9ld\u00e1ny\u00e1t is csatolni kell az aj\u00e1nlathoz. A meghatalmaz\u00e1snak
  tartalmaznia kell a meghatalmazott al\u00e1\u00edr\u00e1smint\u00e1j\u00e1t is.
  Egy\u00e9ni v\u00e1llalkoz\u00f3 \u00e9s mag\u00e1nszem\u00e9ly aj\u00e1nlattev\u0151/alkalmass\u00e1got
  igazol\u00f3 szervezet eset\u00e9n Aj\u00e1nlatk\u00e9r\u0151 elfogadja a teljes
  bizony\u00edt\u00f3 erej\u0171 mag\u00e1nkiratba foglalt al\u00e1\u00edr\u00e1si-mint\u00e1t.\\n\\n10)
  Amennyiben Aj\u00e1nlattev\u0151 az el\u0151\u00edrt alkalmass\u00e1gi felt\u00e9teleknek
  m\u00e1s szervezet kapacit\u00e1saira t\u00e1maszkodva k\u00edv\u00e1n megfelelni
  (\u00e9s ezt az aj\u00e1nlat\u00e1ban megfelel\u0151en jelezte), \u00fagy csatoland\u00f3
  a kapacit\u00e1sait rendelkez\u00e9sre bocs\u00e1t\u00f3 szervezettel k\u00f6t\u00f6tt
  - erre vonatkoz\u00f3 - szerz\u0151d\u00e9ses vagy el\u0151szerz\u0151d\u00e9sben
  v\u00e1llalt k\u00f6telezetts\u00e9gv\u00e1llal\u00e1s\u00e1t tartalmaz\u00f3 okirat
  legal\u00e1bb a Kbt. 65.\u00a7 (7) bekezd\u00e9s szerinti tartalommal.\\n\\n11)
  Csatoland\u00f3 az aj\u00e1nlattev\u0151 vonatkoz\u00e1s\u00e1ban:\\n\\n- Az aj\u00e1nlattev\u0151
  nyilatkozata arr\u00f3l, hogy v\u00e1ltoz\u00e1s-bejegyz\u00e9si k\u00e9relmet ny\u00fajtott-e
  be, amely m\u00e9g nem ker\u00fclt \u00e1tvezet\u00e9sre a nyilv\u00e1ntart\u00f3
  b\u00edr\u00f3s\u00e1g/hat\u00f3s\u00e1g nyilv\u00e1ntart\u00e1s\u00e1ban. Nemleges
  nyilatkozat csatol\u00e1sa is k\u00f6telez\u0151.\\n\\n- Amennyiben az aj\u00e1nlattev\u0151
  (c\u00e9g)adataiban v\u00e1ltoz\u00e1sbejegyz\u00e9s (vagy adatv\u00e1ltoz\u00e1s)
  van folyamatban, abban az esetben az \u00e9rintett c\u00e9g eset\u00e9ben csatolni
  kell a v\u00e1ltoz\u00e1sbejegyz\u00e9sre vonatkoz\u00f3 elektronikus k\u00e9relm\u00e9nyek
  kinyomtatott v\u00e1ltozat\u00e1t, valamint a c\u00e9gb\u00edr\u00f3s\u00e1g \u00e1ltal
  a k\u00e9relemr\u0151l ki\u00e1ll\u00edtott elektronikus tan\u00fas\u00edtv\u00e1ny
  kinyomtatott v\u00e1ltozat\u00e1t Nem c\u00e9g keret\u00e9ben folytatott tev\u00e9kenys\u00e9gek
  eset\u00e9ben a nyilv\u00e1ntart\u00f3 b\u00edr\u00f3s\u00e1g/k\u00f6lts\u00e9gvet\u00e9si
  szerv/kamarajegyz\u0151 \u00e1ltal \u00e1tvett (\u00e9rkeztetett) v\u00e1ltoz\u00e1sbejegyz\u00e9si/adatv\u00e1ltoztat\u00e1si
  k\u00e9relem egyszer\u0171 m\u00e1solati p\u00e9ld\u00e1ny\u00e1t is.\\n\\n12) Aj\u00e1nlattev\u0151nek
  aj\u00e1nlat\u00e1ban nyilatkoznia kell arra vonatkoz\u00f3an, hogy a Kbt. 134.
  \u00a7 (5) bekezd\u00e9s\u00e9ben foglalt biztos\u00edt\u00e9kokat hat\u00e1rid\u0151ben
  rendelkez\u00e9sre bocs\u00e1tja.\\n\\n13) A Kbt. 41/A. (6) bekezd\u00e9se \u00e9rtelm\u00e9ben,
  ahol e t\u00f6rv\u00e9ny vagy v\u00e9grehajt\u00e1si rendelete valamely dokumentum
  k\u00f6zvetlen megk\u00fcld\u00e9s\u00e9t \u00edrja el\u0151, azon a dokumentum
  elektronikus hozz\u00e1f\u00e9rhet\u0151v\u00e9 t\u00e9tel\u00e9t is \u00e9rteni
  kell.\\n\\n14) Az EKR-ben tov\u00e1bb\u00edtott dokumentumokkal, az EKR-ben elektronikus
