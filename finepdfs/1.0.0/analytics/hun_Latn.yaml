  rendezv\u00e9nyekkel\\n\\n2017 \u0151sz\u00e9t\u0151l\\n\\n\u2665 Est\u00e9ly \u00e9vente
  Kod\u00e1ly Zolt\u00e1n tisztelet\u00e9re k\u00fcl\u00f6nleges programokkal (2018-t\u00f3l!)\\n\u2665
  Zenede M\u0171v\u00e9szeti bolt + Webshop\\n\u2665 K\u00f3rust\u00e1bor 1 \u2013
