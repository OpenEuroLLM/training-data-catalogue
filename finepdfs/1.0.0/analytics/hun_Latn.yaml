  imm\u00e1r Magyarorsz\u00e1gon is.\\n\\nA D\u00e9l-Magyarorsz\u00e1gon \u00fczembe
  helyezett (1. \u00e1bra) Cobra C80-5/140 RL t\u00edpus\u00fa betongy\u00e1runk legfontosabb
  jellemz\u0151i:\\n\\n- maxim\u00e1lis elm\u00e9leti termel\u00e9si kapacit\u00e1s:
  80 m\u00b3/h\\n- Lapa t\u00edpus\u00fa f\u00fcgg\u0151leges k\u00e9nyszer t\u00e1ny\u00e9rkever\u0151\\n-
  5 rekeszes soradagol\u00f3, 140 m\u00b3 kavics t\u00e1rol\u00f3kapacit\u00e1s\\n-
  hidraulikus mozgat\u00e1s\u00fa soradagol\u00f3 z\u00e1r\u00f3fed\u00e9l\\n- 5 db
  WAM t\u00edpus\u00fa nagy teljes\u00edtm\u00e9ny\u0171 cementsz\u00e1ll\u00edt\u00f3
  csiga\\n- 2 db osztott, 1 db egyter\u0171, egyenk\u00e9nt 100 tonna t\u00e1rol\u00f3kapacit\u00e1s\u00fa
  cementt\u00e1rol\u00f3 sil\u00f3\\n- 4 fajta foly\u00e9kony adal\u00e9kszer adagol\u00e1sa\\n-
  komplet t\u00e9lies\u00edt\u00e9s \u00e9s adal\u00e9kanyag f\u0171t\u00e9s\\n- Turbotomatic
  PMC-750 0,75 MW f\u0171t\u0151kont\u00e9ner\\n- marad\u00e9kv\u00edz \u00fajrahasznos\u00edt\u00f3
  rendszer.\\n\\nA gyors \u00fczembe helyez\u00e9st a betongy\u00e1r egyedi megold\u00e1sai
  tett\u00e9k lehet\u0151v\u00e9.\\n\\n1. Modul\u00e1ris, szabadalmaztatott szerkezeti
  fel\u00e9p\u00edt\u00e9s\\n\\nA f\u0151 modult h\u00e1rom egym\u00e1shoz kapcsol\u00f3d\u00f3
  helys\u00e9g alkotja: vegyszert\u00e1rol\u00f3 helys\u00e9g, vez\u00e9rl\u0151 helys\u00e9g
  \u00e9s kever\u0151 helys\u00e9g. Sz\u00e1ll\u00edt\u00e1skor a f\u0151\\n\\nmodul
  v\u00edzszintesen helyezkedik el. Egy 70 tonn\u00e1s aut\u00f3daru seg\u00edts\u00e9g\u00e9vel
  az emel\u00e9s sor\u00e1n a k\u00f6z\u00e9ps\u0151 vez\u00e9rl\u0151 helys\u00e9g
  180 fokot emelkedik \u00e9s a vegyszert\u00e1rol\u00f3 helys\u00e9g tetej\u00e9re
  \u00fcl fel. A kever\u0151 helys\u00e9g az emel\u00e9s sor\u00e1n a vez\u00e9rl\u0151
  helys\u00e9g tetej\u00e9re \u00fcl fel \u00e9s veszi fel v\u00e9gleges poz\u00edci\u00f3j\u00e1t.
  L\u00e1sd 3. \u00e1bra.\\n\\n2. Kazett\u00e1s emel\u0151szalag\\n\\nA kazett\u00e1s
  emel\u0151szalag alacsony helyig\u00e9nye mellett hat\u00e9kony adal\u00e9kanyag
  felhord\u00e1st tesz lehet\u0151v\u00e9 (4. \u00e1bra). A soradagol\u00f3 k\u00f6zvetlen\u00fcl
  kapcsol\u00f3dik a f\u0151 modulhoz. A kazett\u00e1k a term\u00e9szetes elhaszn\u00e1l\u00f3d\u00e1s
  sor\u00e1n egyenk\u00e9nt cser\u00e9lhet\u0151k.\\n\\n3. Adagol\u00f3szalag\\n\\nCobra
  mobil betongy\u00e1rainkban az \u00fan. adagol\u00f3szalagok (5., 6. \u00e1bra)
  juttatj\u00e1k az adal\u00e9kanyagot a t\u00e1rl\u00f3s\u00edkokb\u00f3l m\u00e9rlegszalagra.
  A vertik\u00e1lis szalagnak k\u00f6sz\u00f6nhet\u0151en az adal\u00e9kanyag egyenletesen
  ter\u00fcl el a m\u00e9rlegszalagon, \u00e9s pontosabb adagol\u00e1st tesz lehet\u0151v\u00e9.
  Ennek k\u00f6sz\u00f6nhet\u0151en a m\u00e9rlegszalag alacsony oldalfalakkal rendelkezik.\\n\\n4.
  Gy\u00e1rban install\u00e1lt elektromos k\u00f6zpont \u00e9s berendez\u00e9sek\\n\\nAz
  elektromos k\u00f6zpont, az alk\u00f6zpontok, illetve az elektromos berendez\u00e9sek
  a gy\u00e1rban el\u0151re ker\u00fclnek install\u00e1l\u00e1sra \u00e9s tesztel\u00e9sre,
  \u00edgy az \u00fczembe helyez\u00e9s sor\u00e1n nincs sz\u00fcks\u00e9g k\u00e1belvezet\u00e9sre.\\n\\nA
  betongy\u00e1r teljes \u00fczembe helyez\u00e9se a Tecwill szervez\u00e9s\u00e9ben
  t\u00f6rt\u00e9nt. A telep\u00edt\u00e9s sor\u00e1n a magyarorsz\u00e1gi szerviz
  csapat finnorsz\u00e1gi szakemberg\u00e1rd\u00e1val m\u0171k\u00f6d\u00f6tt egy\u00fctt.\\n\\nTov\u00e1bbi
  inform\u00e1ci\u00f3\u00e9rt forduljon hozz\u00e1im bizalommal:\\n\\nPete Zsolt,
  Tecwill Oy\\ne-mail: firstname.lastname@example.org\\ngsm: 06 30 904 4178\\nwww.tecwill.com\\n\\nH\u00cdREK,
  INFORM\u00c1CI\u00d3K\\n\\nAz M0 k\u00f6rny\u0171r\u0171 \u00e9szaki \u00f6sszek\u00f6t\u0151
  h\u00eddja a v\u00e1ros hat\u00e1r\u00e1n\u00e1l, az M3 aut\u00f3p\u00e1lya \u00e9s
  a 11. sz. f\u0151\u00fat k\u00f6z\u00f6tti \u00e9szaki szektorbani keresztezi a
  Dun\u00e1t. \u00c1thidalja a Duna f\u0151\u00e1g\u00e1t (v\u00e1ci Duna-\u00e1g),
  a Szentendrei-sziget d\u00e9li r\u00e9sz\u00e9t, a szentendrei Duna-\u00e1g\u00e1t
  \u00e9s az \u00e1ter\u00fcleteket.\\n\\nA h\u00edd teljes hossza 1862 m, szerkezetileg
  \u0151t r\u00e9szb\u0151l \u00e1ll, az al\u00e1bbi t\u00e1maszk\u00f6z\u00f6kkel:
  \u2022 bal parti \u00e1teri h\u00edd: 37 + 2x33 + 45 m, \u2022 Duna-f\u0151\u00e1g\u00fa
  h\u00edd: 145 + 300 + 145 m, \u2022 Szentendrei-sziget \u00e1teri h\u00edd: 42 +
  11x47 m, \u2022 szentendrei Duna-\u00e1g h\u00eddja: 94 + 144 + 94 m, \u2022 jobb
  parti \u00e1teri h\u00edd: 43 + 3x44 + 43 m.\\n\\nAz \u00e1teri hidak kisebb ny\u00edl\u00e1sokkal,
  vasbetonb\u00f3l k\u00e9sz\u00fclnek, a folyami hidak ac\u00e9l szerkezet\u0171ek.
  A bal parti \u00e1teri h\u00edd \u00e9s a folyami hidak egyenes tengely\u0171ek,
  a Szentendrei-szigeti h\u00edd \u00e9s a jobb parti \u00e1teri h\u00edd \u00edvben
  fekszik.\\n\\nAz alapoz\u00e1s m\u00e9lyalapoz\u00e1ssal (120 \u00e9s 150 cm \u00e1tm\u00e9r\u0151j\u0171,
  f\u00fart vasbeton c\u00f6l\u00f6p\u00f6kkel) t\u00f6rt\u00e9nik. \u00d6sszes\u00e9g\u00e9ben
  a h\u00eddhoz 8100 m c\u00f6l\u00f6p sz\u00fcks\u00e9ges. A mederben k\u00e9sz\u00fcl\u0151
  pillerek alapoz\u00e1sa a t\u00f6bbi folyami h\u00eddn\u00e1l m\u00e1r alkalmazott
  \u00e9s bev\u00e1lt vasbeton k\u00e9reg\u00e9lem m\u00f3dszerrel k\u00e9sz\u00fcl.\\n\\nAz
  \u00e1teri hidak folytat\u00f3s\u00e1gos szekr\u00e9ny keresztmetszet\u0171, fesz\u00edtett
  vasbeton szerkezettel \u00e9p\u00fclnek. A szekr\u00e9nyelemei gy\u00e1rt\u00f3p\u00e1don
