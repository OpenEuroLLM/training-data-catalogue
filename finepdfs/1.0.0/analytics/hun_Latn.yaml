  er\u0151s\u00edt\u00e9se\\n8. T\u00e1rsadalmi szerepv\u00e1llal\u00e1s szempontj\u00e1b\u00f3l
  kiemelked\u0151 esem\u00e9ny szervez\u00e9se\\n10. Az \u00e9vr\u0151l \u00e9vre
  gazdagod\u00f3 programok, a r\u00e9sztvev\u0151k sz\u00e1m\u00e1nak n\u00f6veked\u00e9se
  nyom\u00e1n k\u00e9pesek lesz\u00fcnk l\u00e1ttatni, hogy Kod\u00e1ly Zolt\u00e1n
  \u00f6r\u00f6ks\u00e9ge nem csup\u00e1n a zenei nevel\u00e9s ter\u00fclet\u00e9re
  korl\u00e1toz\u00f3dik, hanem olyan \u00e9rt\u00e9keket hordoz, amelyek alapjai
  kell, hogy legyenek az ig\u00e9nyes emberi \u00e9letnek.\\n\\nFeladatok\\n\\n\u2665
  A Kod\u00e1ly M\u0171v\u00e9szeti \u00e9s Tudom\u00e1nyos Tan\u00e1cs L\u00e9trehoz\u00e1sa.\\n\\nA
