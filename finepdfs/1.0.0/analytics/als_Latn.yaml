  Tavani, dyert ishin t\u00eb izoluara nga zhurmat apo nxeht\u00ebsia t\u00eb cila
  b\u00ebjn\u00eb q\u00eb dhoma t\u00eb jet\u00eb e sigurt\u00eb ndaj faktor\u00ebve
  atmosferik dhe zhurmave akustike;\\n2. Ambienti ishte i pajisur me sensor\u00eb
  p\u00ebr detektimin e tymit si dhe pajisje p\u00ebr fikjen me tym t\u00eb zjarrit
  n\u00eb p\u00ebrputhje me Rregulloren e AKSH-it, pika 4.6;\\n3. Dhoma ishte e pajisur
  me sensor\u00eb lag\u00ebshtie, temperature n\u00eb p\u00ebrputhje me Rregulloren
  e AKSH-it 5.3;\\n4. Ambienti ishte i pajisur me sistem v\u00ebzhgimi me kamera n\u00eb
  p\u00ebrputhje me Rregulloren e AKSH-it 4.4/b;\\n5. Rak-et ishin t\u00eb pajisur
  me UPS por jo t\u00eb gjith\u00eb raket e kishin t\u00eb montuar t\u00eb sistemin
  kund\u00ebr l\u00ebkundjeve sizmike n\u00eb kundershtim me Rregulloren e AKSH-it,
  pika 4.2;\\n6. Rak-et nuk ndodhen n\u00eb nj\u00eb distanc\u00eb t\u00eb p\u00ebrshtatshme
  nga nj\u00ebri tjetri por jan\u00eb t\u00eb vendosur shum\u00eb pran\u00eb nj\u00ebri-tjetrit;\\n7.
  Dhoma \u00ebsht\u00eb e pajisur me nj\u00eb sistem kund\u00ebr zjarrit;\\n8. Dhoma
  ka sistem ftoh\u00ebs dhe sistem t\u00eb shp\u00ebrndarjes s\u00eb ajrit dhe mbajtja
  e temperatur\u00ebs s\u00eb ambientit realizohej n\u00eb p\u00ebrputhje me Rregulloren
  e AKSH-it, pika 4.4/b.\\n\\n![Diagram](image)\\n\\n1. Instalimet elektrike kishin
  tok\u00ebzimin dhe nulin e dedikuar;\\n2. Instalimi elektrik i dhom\u00ebs s\u00eb
  rrjetit \u00ebsht\u00eb i ndar\u00eb nga instalimi i p\u00ebrgjithsh\u00ebm i nd\u00ebrtes\u00ebs.
  *(ndri\u00e7imi apo ai i p\u00ebrdoruesve)*;\\n3. Fuqia elektrike e rak-eve ishte
  e ndar\u00eb nga ajo e pajisjeve elektromekanike q\u00eb p\u00ebrdoren p\u00ebr
  t\u00eb garantuar kushtet teknike t\u00eb operimit;\\n4. Dhoma ka sistem ushqyes
  rezerve *(gjenerator\u00eb, bateri)*;\\n5. Dhoma ka sistem alarmi q\u00eb t\u00eb
  sinjalizoj\u00eb problemet me rrym\u00ebn elektrike, me ambientin fizik;\\n6. Hyrja
  n\u00eb dhom\u00eb \u00ebsht\u00eb e siguruar me an\u00eb t\u00eb nj\u00eb sistemi
  elektronik n\u00eb p\u00ebrputhje me Rregulloren e AKSH-it pika 4.6/b.\\n\\n*N\u00eb
  lidhje me kapacitet e serverave nga auditimi u konstatua se:*\\n7. Titulli i gjetjes:
  Mungesa e kapaciteteve t\u00eb server\u00ebve.\\n\\n**Situata:**\\n- Serverat kan\u00eb
  munges\u00eb n\u00eb hap\u00ebsirat fizike dhe logjike duke ndikuar n\u00eb performanc\u00ebn
  dhe mbar\u00ebvajtje e sistemeve, si dhe duke rrezikuar n\u00eb humbjen e t\u00eb
  dh\u00ebnave. Transactional backup nuk b\u00ebhet p\u00ebr shkak t\u00eb munges\u00ebs
  s\u00eb hap\u00ebsirave n\u00eb serverin e databaz\u00ebs.\\n\\n- Backup-i i sistemit
  t\u00eb regjistrit t\u00eb biznesit realizohet n\u00eb m\u00ebnyr\u00eb manuale
  nga punonj\u00ebsit e Drejtoris\u00eb s\u00eb Inovacionit dhe Regjistrave.\\n- Disa
  nga volumet Hdd nuk jan\u00eb t\u00eb konfiguruar n\u00eb redundant RAID gj\u00eb
  e cila mund t\u00eb sjell\u00eb humbje t\u00eb dh\u00ebnash n\u00eb raste aksidentesh
  apo n\u00eb raste t\u00eb d\u00ebshtimit t\u00eb nj\u00eb Hdd, etj.\\n- Serverat
  e sistemit QKL p\u00ebr shkak t\u00eb munges\u00ebs s\u00eb suportit nga ana e prodhuesit
  kan\u00eb kaluar n\u00eb status \u201cretired\u201d.\\n- Upgrade-imi i SQL Servers
  n\u00eb versione m\u00eb t\u00eb reja nuk mund t\u00eb realizohet p\u00ebr arsy\u00eb
  t\u00eb munges\u00ebs s\u00eb kapaciteteve t\u00eb vet\u00eb serverave dhe kushteve
  t\u00eb tjera optimale q\u00eb k\u00ebrkohen p\u00ebr t\u00eb kaluar n\u00eb versione
  m\u00eb t\u00eb reja.\\n\\n**Ndikimi/efekti:** Humbje e t\u00eb dh\u00ebnave, nd\u00ebrprerje
  e sh\u00ebrbimeve.\\n\\n**Shkaku:** Mos planifikim.\\n\\n**R\u00ebnd\u00ebsia:**
  E lart\u00eb.\\n\\n**Rekomandimi:** QKB n\u00eb bashk\u00ebpunim me Drejtoren\u00eb
  e Inovacionit dhe Regjistrave si dhe me strukturat k\u00ebshilluese mbi TI, t\u00eb
  marrin masa p\u00ebr:\\n\\n- analizimin dhe dokumentimin e situat\u00ebs s\u00eb
  krijuar dhe krijuimin e kushteve optimale mbi rrjitjen e kapaciteve (hap\u00ebsirave
  storage) t\u00eb serverave t\u00eb sistemeve p\u00ebr t\u00eb siguruar mbar\u00ebvajtjen
  e sistemeve dhe vazhdim\u00ebsin\u00eb e ofrimit t\u00eb sh\u00ebrbimeve pa nd\u00ebrprerje.\\n-
  kryerjen backup-it t\u00eb particioneve t\u00eb konsideruara kritike dhe klasifikimin
  e t\u00eb dh\u00ebnave t\u00eb r\u00ebnd\u00ebsishme.\\n- kryerjen e konfigurimeve
  p\u00ebrkat\u00ebse t\u00eb Hdd-ve ose volumeve q\u00eb nuk jan\u00eb t\u00eb konfiguruar
  si redundant RAID.\\n\\n---\\n\\n**Portal**\\\\(^1\\\\) **Web i Qendr\u00ebs Komb\u00ebtare
  t\u00eb Biznesit**\\n\\nN\u00eb baz\u00eb t\u00eb ligjit nr. 131/2015 \u201cP\u00ebr
  Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit\u201d, si rezultat i bashkimit t\u00eb
  dy institucioneve, Qendr\u00ebs Komb\u00ebtare t\u00eb Licencimit dhe Qendr\u00ebs
  Komb\u00ebtare t\u00eb Regjistrimit, lindi nevoja e krijuimit t\u00eb nj\u00eb portali
  t\u00eb vet\u00ebm, i cili do t\u00eb p\u00ebrmbante t\u00eb dh\u00ebna t\u00eb
  integruara nga t\u00eb dy sistemet QKR dhe QKL.\\n\\n---\\n\\n\\\\(^1\\\\) [http://www.qkb.gov.al/](http://www.qkb.gov.al/)\\n\\nPortali
  i Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit (QKB) \u00ebsht\u00eb nd\u00ebrtuar
  duke integruar dy sistemet e brendshme Qendra Komb\u00ebtare e Regjistrimit (QKR)
  dhe Qendra Komb\u00ebtare e Licencimit (QKL) dhe mir\u00ebmbahet nga ana e staffit
  t\u00eb TIK t\u00eb Drejtoris\u00eb s\u00eb Inovacionit dhe Regjistrave.\\n\\nBaza
  e t\u00eb dh\u00ebnave e portalit popullohet n\u00ebp\u00ebrmjet paketave t\u00eb
  integritimit duke marr\u00eb t\u00eb gjitha tabelat e nevojshme nga t\u00eb dy sistemet.
  Kjo paket\u00eb ekzekutohet dy her\u00eb n\u00eb dit\u00eb, n\u00eb m\u00ebnyr\u00eb
  q\u00eb t\u00eb sigurohet q\u00eb n\u00eb \u00e7do moment t\u00eb dh\u00ebnat t\u00eb
  jen\u00eb sa m\u00eb t\u00eb p\u00ebrdit\u00ebsuara. P\u00ebr module t\u00eb ve\u00e7anta,
  si marrjen e dokumenteve t\u00eb licenc\u00ebs, portali komunikon me sistemet e
  brendshme duke p\u00ebrdorur sh\u00ebrbimet q\u00eb ato ofrojn\u00eb.\\n\\nPortali
  \u00ebsht\u00eb nd\u00ebrtuar mbi platform\u00ebn Umbraco\\\\(^2\\\\). Aplikacioni
  i k\u00ebtij portali si dhe databaza e portalit hostohen n\u00eb IP t\u00eb ve\u00e7anta
  t\u00eb dedikuar.\\n\\nNd\u00ebrtimi i nj\u00eb baz\u00eb t\u00eb dh\u00ebnash me
  t\u00eb dh\u00ebn\u00eb t\u00eb unifikuara nga t\u00eb dy regjistrat dhe t\u00eb
  optimizuara p\u00ebr proceset q\u00eb kryhen nga portali.\\n\\nNga databaza e sistemit
  t\u00eb brendsh\u00ebm t\u00eb regjistrat tregtar merren t\u00eb dh\u00ebnat q\u00eb
  kan\u00eb t\u00eb b\u00ebjn\u00eb me bizneset, aplikimet e b\u00ebr\u00eb si dhe
  ekstraktet historike dhe t\u00eb thjeshta t\u00eb bizneseve.\\n\\nNga databaza e
  sistemit t\u00eb brendsh\u00ebm t\u00eb lejeve, licencave dhe autorizimeve merret
  informacion mbi \u00e7\u00ebshtjet e hapura p\u00ebr regjistrim\u00eb, ndryshime
  licencash/lejesh, informacion mbi licencat/lejet e l\u00ebshuara si dhe informacionet
  mbi autorizimet.\\n\\nPortali i QKB-s\u00eb publikon shpallje p\u00ebr publikun.
  K\u00ebto shpallje mund t\u00eb jen\u00eb p\u00ebr kreditor\u00ebt, njoftime nga
  gjykatat, nga zyrat p\u00ebrmbarimore, etj.\\n\\nM\u00eb posht\u00eb jan\u00eb t\u00eb
  listuara disa karakteristika teknika rreth pajisjeve hardware t\u00eb k\u00ebtij
  portali:\\n\\n| Nr. | Emri i Serverit          | Karakteristikat                                                                 |\\n|-----|--------------------------|---------------------------------------------------------------------------------|\\n|
  1   | QKB Database Server      | CPU Intel (R) Xeon (R) CPU E5-2602 0 @2.00GHz 2.00GHz
  (2 processor)            |\\n|     |                          | RAM 96 GB                                                                       |\\n|     |                          |
  HDD Local Disk (C:) 97.4 GB New Volume (E:) 1.9 TB                              |\\n|
  2   | QKB Application Server   | CPU AMD Opteron(tm) Processor 6172 2.10 GHz (4
  processors)                      |\\n|     |                          | RAM 32 GB                                                                       |\\n|     |                          |
  HDD Local Disk (C:) 558 GB DB_LOG (D:) 558 GB DB_DATA (E:) 1.63 TB               |\\n\\nBurimi
  i t\u00eb dh\u00ebnave: QKB\\nPunoi: KLSH\\n\\nArkitektura fizike e portalit t\u00eb
  Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit \u00ebsht\u00eb e demonstruar si m\u00eb
  posht\u00eb:\\n\\n---\\n\\n\\\\(^2\\\\) Umbraco \u00ebsht\u00eb nj\u00eb platform\u00eb
  open source p\u00ebr publikimin e faqeve Web dhe intranet. \u00cbsht\u00eb e shkruar
  n\u00eb gjuh\u00ebn C# \u00ebsht\u00eb e vendosur n\u00eb infrastruktur\u00ebn e
  bazuar n\u00eb Microsoft.\\n\\nP\u00ebr testimin e performanc\u00ebs s\u00eb faqes
  s\u00eb internetit u b\u00ebn\u00eb disa pen test\\\\(^3\\\\) p\u00ebr sjelljen
  e faqes Web sipas bro\u00ebserit t\u00eb zgjedhur. Kjo metod\u00eb p\u00ebrdoret
  p\u00ebr gjetjen e gabimeve si\u00e7 \u00ebsht\u00eb \u201c404\u2019s\u201d ose
  probleme m\u00eb komplekse si\u00e7 jan\u00eb burimet e jashtme q\u00eb blokojn\u00eb
  pasqyrimin e faqes (page rendering) dhe rezultoi si m\u00eb posht\u00eb:\\n\\n\\\\(^3\\\\)
  teste t\u00eb thyerjes s\u00eb siguris\u00eb dhe mang\u00ebsive\\n\\nNga auditimi
  dhe mbik\u00ebqyrja e faqes Web u konstatua se:\\n\\n- n\u00eb kuadrin e transparenc\u00ebs
  QKB ka afishuar n\u00eb faqen e saj Web Organigram\u00ebn e institucionit, ku p\u00ebrfshihen,
  strukturat e t\u00eb gjith\u00eb deg\u00ebve Rajonale t\u00eb QKB, me adresat e
  sakta, numrat e kontaktit dhe orarin e ofrimit t\u00eb sh\u00ebrbimeve ndaj publikut;\\n-
  ka rregulllore p\u00ebr faqen e Web;\\n- tek menuja \u201cKontakte\u201d ka t\u00eb
  afishuar p\u00ebr publikun oraret e pritjes s\u00eb publikut. Numri p\u00ebr marrjen
  e informacionit t\u00eb afishuar n\u00eb faqen Web \u00ebsht\u00eb funksional;\\n-
  \u00ebsht\u00eb realizuar versionin e faqes Web n\u00eb gjuh\u00ebn angleze;\\n-
  monitorimi i statistikave t\u00eb vizitor\u00ebve t\u00eb faqes \u00ebsht\u00eb
  b\u00ebr\u00eb me google analytics.\\n\\n8. Titulli i gjetjes: Mungesa e elementeve
  t\u00eb siguris\u00eb p\u00ebrgjat\u00eb navigimit.\\n\\nSituata: Portali nuk p\u00ebrdor
  nj\u00eb lidhje t\u00eb sigurt\u00eb (connection security) HTTPS (HyperText Transfer
  Protocol Secure) (Not secure status) q\u00eb do t\u00eb thot\u00eb se serveri i
  faqes s\u00eb internetit nuk p\u00ebrdor nj\u00eb certifikat\u00eb siguri p\u00ebr
  t\u00eb v\u00ebrtetuar identitetin e internetit n\u00eb shfletues, si Chrome. N\u00eb
  munges\u00eb t\u00eb k\u00ebsaj certifikate mund t\u00eb ndodh\u00eb humbja e privat\u00ebsis\u00eb,
  ndryshimit t\u00eb informacionit q\u00eb merret ose jepet me an\u00eb t\u00eb k\u00ebtij
  portali.\\n\\nNdikimi/efekti: Humbja e privat\u00ebsis\u00eb, ndryshimit t\u00eb
  informacionit q\u00eb merret ose jepet me an\u00eb t\u00eb portalit.\\n\\nShkaku:
  -\\n\\nR\u00ebnd\u00ebsia: E mesme.\\n\\nRekomandimi: QKB n\u00eb bashk\u00ebpunim
  me strukturat p\u00ebrgjegj\u00ebse p\u00ebr mbar\u00ebvajtjen e faqes Web, t\u00eb
  marrin masa p\u00ebr p\u00ebrmir\u00ebsimin e faqes Web me element\u00ebt p\u00ebrkat\u00ebs
  t\u00eb siguris\u00eb (certifikat\u00ebn e siguris\u00eb) s\u00eb navigimit online
  p\u00ebr t\u00eb rritur sigurin\u00eb dhe ndihmes\u00ebn ndaj qytetar\u00ebve. T\u00eb
  kihet parasyq\u00eb q\u00eb n\u00eb t\u00eb ardhmen t\u00eb shtohen element\u00eb
  inovativ n\u00eb faqen Web p\u00ebr ta b\u00ebr\u00eb at\u00eb sa m\u00eb interaktive
  dhe ndihm\u00ebse p\u00ebr qytetar\u00ebt.\\n\\nProcedura e backup dhe menaxhimi
  i aseteve\\n\\nDrejtoria e Inovacionit dhe Regjistrave ka hartuar nj\u00eb procedur\u00eb
  t\u00eb p\u00ebrcaktuar p\u00ebr backup-in e sistemeve n\u00eb Qendr\u00ebn Komb\u00ebtare
  t\u00eb Biznesit.\\n\\nQ\u00ebllimi i procedur\u00ebs s\u00eb kryerjes s\u00eb backup-it
  t\u00eb sistemeve n\u00eb p\u00ebrdorim \u00ebsht\u00eb q\u00eb t\u00eb siguroj\u00eb
  metoda dhe procedura t\u00eb standardizuara mbi k\u00ebto procese, duke siguruar
  k\u00ebshtu ruajtjen e t\u00eb dh\u00ebnave t\u00eb serverave dhe mund\u00ebsimin
  e rikthimit t\u00eb k\u00ebtyre t\u00eb dh\u00ebnave n\u00eb raste t\u00eb defekteve
  kritike ose rasteve t\u00eb tjera t\u00eb humbjes s\u00eb t\u00eb dh\u00ebnave.\\n\\nProcedura
  e hartuar \u00ebsht\u00eb e pasqyruar edhe n\u00eb Rregullore TIK ku p\u00ebrcaktohet
  m\u00ebnyra e kryerjes s\u00eb backup-ve, procesin e ruajtjes s\u00eb t\u00eb dh\u00ebnave
  p\u00ebr sistemet n\u00eb p\u00ebrdorim nga punonj\u00ebsit e Qendr\u00ebs Komb\u00ebtare
  t\u00eb Biznesit.\\n\\nBackup-i i serverit, n\u00eb t\u00eb cil\u00ebn ndodhet databaza
  e regjistrit elektronik t\u00eb biznesit, konfigurohet automatikisht/manualisht.
  Sistemi ka nj\u00eb skedar n\u00eb Hdd e jasht\u00ebm me emrin e serverit, t\u00eb
  cilit do i b\u00ebhet backup. N\u00eb fillim verifikohet lidhja me Hdd dhe \u00e7do
  m\u00ebngjes kontrollohet statusi i backup-it n\u00ebse procedura \u00ebsht\u00eb
  kryer me sukses.\\n\\nRuajtja e backup realizohet n\u00eb 2 Hdd t\u00eb jasht\u00ebm
  me nga 3TB secili. N\u00eb nj\u00eb Hdd ruhet backup-i i databazes s\u00eb regjistrit
  elektronik i cili kryhet direkt nga SQL. N\u00eb Hdd tjet\u00ebr ruhet backup-i
  i nj\u00eb muaji t\u00eb m\u00ebparsh\u00ebm. Procedura e backup-it zgjat n\u00eb
  koh\u00eb sepse gjat\u00eb procesit t\u00eb saj sistemi \u00ebsht\u00eb\\n\\nn\u00eb
  gjendje funksionale p\u00ebr t\u00eb dh\u00ebn\u00eb sh\u00ebrbime, p\u00ebr k\u00ebt\u00eb
  arsye procesi i backup-it realizohet kur p\u00ebrdoruesit nuk jan\u00eb duke kryer
  veprime n\u00eb sistem. N\u00ebse procedura d\u00ebshton, lajm\u00ebrohet drejtori
  i drejtoris\u00eb, analizohen log-et e sistemit p\u00ebr t\u00eb evidentuar problemin
  dhe procedura p\u00ebr kryerjen e backup-it rifillon nga fillimi. Pasi b\u00ebhet
  realizimi i backup-it, ai ruhet n\u00eb nj\u00eb kasafort\u00eb.\\n\\n**Planifikimi
  i procedur\u00ebs s\u00eb backup kryhet si m\u00eb posht\u00eb:**\\n\\n| e h\u00ebn\u00eb   |
  kryhet Backup Direfencial i cili p\u00ebrmban ndryshimet e ndodhura q\u00eb nga
  dita e diele, me an\u00eb t\u00eb programit SQL Server Management / job t\u00eb
  paraprogramuar |\\n|----------|----------------------------------------------------------------------------------|\\n|
  e mart\u00eb  | kryhet Backup Direfencial i cili p\u00ebrmban ndryshimet e ndodhura
  q\u00eb nga dita e h\u00ebn\u00eb, me an\u00eb t\u00eb programit SQL Server Management/
  job t\u00eb paraprogramuar |\\n| e m\u00ebrkur\u00eb| kryhet Backup Direfencial
  i cili p\u00ebrmban ndryshimet e ndodhura q\u00eb nga dita e m\u00ebrkur\u00eb,
  me an\u00eb t\u00eb programit SQL Server Management/ job t\u00eb paraprogramuar
  |\\n| e enjte  | kryhet Backup Direfencial i cili p\u00ebrmban ndryshimet e ndodhura
  q\u00eb nga dita e m\u00ebrkur\u00eb, me an\u00eb t\u00eb programit SQL Server Management/
  job t\u00eb paraprogramuar |\\n| e premte | kryhet Backup i Plot\u00eb me an\u00eb
  t\u00eb programit SQL Server Management / job t\u00eb paraprogramuar |\\n| e shtun\u00eb
  | vazhdon procedura e backup                                                        |\\n|
  e diele  | p\u00ebrfundon procedura e backup                                                      |\\n\\n**Burimi
  i t\u00eb dh\u00ebnave:** QKB  \\n**Punoi:** KLSH\\n\\n**Nga auditimi u konstatua
  se:**\\n\\n- Backup-et p\u00ebr sistemin e regjistrit elektronik t\u00eb bizneseve
  jan\u00eb t\u00eb ruajtura n\u00eb m\u00ebnyr\u00eb periodike n\u00eb Hdd storage
  t\u00eb jasht\u00ebm n\u00eb m\u00ebnyr\u00eb manuale nga specialist\u00ebt e Drejtoris\u00eb
  s\u00eb Inovacionit dhe Regjistrave nd\u00ebrsa p\u00ebr sistemin e regjistrit t\u00eb
  licencave b\u00ebhet n\u00eb m\u00ebnyr\u00eb automatike;\\n- Hap\u00ebsira ku ruhen
  backup-et e sistemit t\u00eb QKR jan\u00eb t\u00eb pamjaftueshme;\\n- Backup-i transferohet
  fizikisht nga AKSHI tek zyrat qendrore t\u00eb QKB;\\n- Procedurat e rikthimit (restore)
  t\u00eb t\u00eb dh\u00ebnave testohen p\u00ebr t''u siguruar q\u00eb ato jan\u00eb
  t\u00eb efektshme dhe q\u00eb ato mund t\u00eb ekzekutohen brenda koh\u00ebs s\u00eb
  lejuar n\u00eb sistemin test q\u00eb QKB disponon n\u00eb ambientet e saj n\u00eb
  zyrat qendrore.\\n- Ruajtja e backup n\u00eb vende jasht\u00eb godin\u00ebs s\u00eb
  QKB-s\u00eb, n\u00eb distanc\u00eb realizohet tek AKSHI, n\u00eb Qendr\u00ebn e
  Vazhdim\u00ebsis\u00eb s\u00eb Biznesit;\\n- nga QKB realizohet backup p\u00ebr
  loget e sistemit t\u00eb hyrje-daljeve t\u00eb personelit;\\n- realizohet backup-i
  i centralit telefonik rr\u00ebth konfigurimeve t\u00eb centralit.\\n- pajisjet e
  rrjetit (switch dhe router) jan\u00eb b\u00ebr\u00eb backup dhe ruhen n\u00eb ambientet
  e dhom\u00ebs s\u00eb serverave;\\n- N\u00eb rastet kur t\u00eb dh\u00ebnat e backup-it
  jan\u00eb t\u00eb panevojshme nuk ekzistonj\u00eb procedura p\u00ebr m\u00ebnyr\u00ebn
  e nxjerrjes s\u00eb tyre jasht\u00eb p\u00ebrdorimit.\\n\\n**Menaxhimi i aseteve**\\n\\nNga
  auditimi rezultoi se n\u00eb QKB ka nj\u00eb inventar inventar fizik t\u00eb t\u00eb
  gjitha pajisjeve elektronike q\u00eb jan\u00eb n\u00eb dhom\u00ebn e serverave,
  n\u00eb p\u00ebrdorim nga punonj\u00ebsit (PC, printer\u00eb, etj) si dhe n\u00eb
  deg\u00ebt rajonale tona ku jan\u00eb pajisjet servera, router, Firewall, PC printer\u00eb
  etj. Pajisjet vihen n\u00eb kartel\u00ebn personale t\u00eb punonj\u00ebsit q\u00eb
  e mban n\u00eb p\u00ebrgjegj\u00ebsi n\u00eb p\u00ebrpunhje me Udh\u00ebzimin nr.
  30 dat\u00eb 27.12.2011 \\\"P\u00ebr menaxhimin e aktiveve n\u00eb nj\u00ebsit\u00eb
  e sektorit publik\\\" t\u00eb Ministrit t\u00eb Financave, i ndryshuar.\\n\\n**Nga
  auditimi u konstatua se:**\\n\\n- QKB-ja nuk disponon pajisje q\u00eb p\u00ebrmbajn\u00eb
  informacione sekrete, pasi QKB nuk administron informacione t\u00eb klasifikuara
  sekret, si rrejdhoj\u00eb QKB nuk ka pajisje q\u00eb t\u00eb jen\u00eb t\u00eb pajisura
  me \u00e7ip (RFID).\\n- Dokumentacion mbi aktivitetet e sektorit t\u00eb IT-s\u00eb
  jasht\u00eb sistemit, p\u00ebrfaqshin aktivitetin e p\u00ebrditsh\u00ebm t\u00eb
  p\u00ebrdoruesve. P\u00ebrgjith\u00ebsisht veprohet me e-mail duke dh\u00ebn\u00eb
  asistenc\u00ebn p\u00ebrkat\u00ebse, si dhe p\u00ebrgjigja e p\u00ebr nd\u00ebrhyrjet
  n\u00eb raste k\u00ebrkesash specifike jepet po me e-mail. Programet jan\u00eb t\u00eb
  aksesueshme n\u00eb nj\u00eb file q\u00eb \u00ebsht\u00eb dh\u00ebn\u00eb aksesi
  \u201cshare\u201d, n\u00eb m\u00ebnyr\u00eb t\u00eb aksesueshme nga specialist\u00ebt
  e IT-s\u00eb.\\n- Active Directory aksesohet dhe nd\u00ebrhyrhet gjithmon\u00eb
  p\u00ebr krijuim p\u00ebrdoruesi apo risetim passwordi me an\u00eb t\u00eb nj\u00eb
  email. Active Directory \u00ebsht\u00eb n\u00eb pron\u00ebsi t\u00eb AKSHI dhe ndiqen
  politikat e miratuara t\u00eb tij.\\n- Pajisjet elektronike q\u00eb QKB disponon,
  evidentohen nga numrat serial p\u00ebrkat\u00ebs t\u00eb pajisjeve.\\n\\nP\u00ebr
  sa \u00ebsht\u00eb trajtuar n\u00eb k\u00ebt\u00eb pik\u00eb t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit jan\u00eb mbajtur Akt Konstatimi nr.1, dat\u00eb 18.07.2018, si
  dhe \u00ebsht\u00eb trajtuar n\u00eb faqet 37-50 t\u00eb Projektraportit t\u00eb
  Auditimit, mbi t\u00eb cilin jan\u00eb paraqitur observacione me shkres\u00ebn nr.
  5086/21, dat\u00eb 25.07.2018, protokolluar n\u00eb KLSH me nr. 550/3, dat\u00eb
  27.07.2018, si dhe me shkres\u00ebn nr. 5086/23, dat\u00eb 30.08.2018, protokolluar
  n\u00eb KLSH me nr. 550/5, dat\u00eb 31.08.2018, t\u00eb cilat n\u00eb thelb jan\u00eb
  t\u00eb nj\u00ebjt\u00eb.\\n\\n**Pretendimi i subjektit:**\\n\\n1. Lidhur me konstatimin:
  *Nisur nga sa m\u00eb sip\u00ebr QKB nuk ka t\u00eb nd\u00ebrtuar Planin Strategjik
  t\u00eb Teknologjis\u00eb s\u00eb Informacionit duke sjell\u00eb mos pasqyrimin
  t\u00eb qart\u00eb t\u00eb objektivave t\u00eb QKB lidhur me sigurin\u00eb institucionale
  dhe infrastruktur\u00ebn TI, objektivat strategjik\u00eb p\u00ebr burimet njer\u00ebzore
  t\u00eb struktur\u00ebs s\u00eb TI n\u00eb QKB dhe p\u00ebr deg\u00ebt rajonale
  dhe burimet e nevojshme p\u00ebr ngritjen, zhvillimin dhe mir\u00ebmbajtjen e saj.*\\n\\n2.
  Lidhur me konstatimin: *\u201cRregullorja e Teknologjis\u00eb s\u00eb Informacionit
  \u00ebsht\u00eb e pa miratuar dhe Drejtoria e Inovacionit dhe Regjistrave e ka mb\u00ebshtetur
  aktivitetin e saj n\u00eb k\u00ebt\u00eb rregullore. Me miratimin dhe futjen n\u00eb
  fuqi t\u00eb VKM nr. 673, dat\u00eb 22.11.2017 \u201cP\u00ebr riorganizimin e Agjencis\u00eb
  Komb\u00ebtare t\u00eb Shoq\u00ebris\u00eb s\u00eb Informacionit\u201d, manualet
  e miratuar nga QKB nuk jan\u00eb eficente dhe efektive p\u00ebr tu p\u00ebrdorur
  dhe do t\u00eb duhet tu n\u00ebnshtrohen nj\u00eb risikimi t\u00eb holl\u00ebsisht\u00ebm
  duke reflektuar ndryshimet q\u00eb do t\u00eb ndodhin n\u00eb struktur\u00eb, n\u00eb
  p\u00ebrshtakrimet e pun\u00ebs dhe n\u00eb ndarjen e p\u00ebrgjegj\u00ebsive t\u00eb
  gjithsecilit p\u00ebr tu p\u00ebrshtatur me p\u00ebrcaktimet e k\u00ebsaj VKM-je.
  Drejtoria e Inovacionit dhe Regjistrave n\u00eb QKB \u00ebsht\u00eb nj\u00eb nga
  strukturat q\u00eb preket nga miratimi dhe futja n\u00eb fuqi e VKM-s nr. 673 ku
  sipas s\u00eb cil\u00ebs, stafi TI dhe pajisjet kalojn\u00eb n\u00eb var\u00ebsi
  t\u00eb ASKHI-it.\u201d*\\n\\n3. Lidhur me konstatimin \u201cRegjistri i riskut
  n\u00eb QKB nuk \u00ebsht\u00eb i p\u00ebrdit\u00ebsuar (update) me risqet e reja
  t\u00eb brendshme dhe t\u00eb jashtme q\u00eb mund t\u00eb jen\u00eb shfaqur si
  dhe nuk ka identifikuar ndikimin e k\u00ebtyre risqeve n\u00eb institucion. Regjistri
  i riskut ka t\u00eb pasqyruara t\u00eb nj\u00ebjtat fusha t\u00eb p\u00ebrs\u00ebritura
  p\u00ebr tre vitet e fundit duke e b\u00ebr\u00eb jo efektiv dhe jo eficent reduktimin
  e risqeve, n\u00eb mosp\u00ebrputhje me nenet 19-21 t\u00eb ligjit nr. 10296, dat\u00eb
  08.07.2010, \u201cP\u00ebr menaxhimin financiar dhe kontrollin\u201d, i ndryshuar,
  Udh\u00ebzimi nr. 30, dat\u00eb 27.12.2011 \u201cP\u00ebr Menaxhimin e Aktiveve
  n\u00eb Nj\u00ebsit\u00eb e Sektorit Publik\u201d, i ndryshuar, Udh\u00ebzimi nr.
  21, dat\u00eb 25.10.2016 \u201cP\u00ebr n\u00ebpun\u00ebsit zbatues t\u00eb t\u00eb
  gjitha niveleve\u201d, Udh\u00ebzimi i Ministrit t\u00eb Financave nr. 16, dat\u00eb
  20.07.2016 \u201cP\u00ebr p\u00ebrgjegj\u00ebsitet dhe detyrat e koordinatorit t\u00eb
  menaxhimit financiar dhe kontrollit dhe koordinatorit t\u00eb riskut n\u00eb nj\u00ebsi
  t\u00eb publike\u201d, ju b\u00ebjm\u00eb me dije si vijon:\\n\\n4. Lidhur me konstatimin
  \u201cQKB si institucion q\u00eb posedon dy sisteme informacioni (QKR dhe QKL),
  q\u00eb ruajn\u00eb, p\u00ebrpunojn\u00eb dhe regjistrojn\u00eb t\u00eb dh\u00ebna
  me r\u00ebnd\u00ebsi p\u00ebr regjistrimin e subjekteve t\u00eb p\u00ebrcaktuara
  n\u00eb ligjin organik q\u00eb rregullon regjistrimin e biznesit, nuk ka qend\u00ebr
  t\u00eb rim\u00ebk\u00ebmbjes nga katastrofat (DRC) p\u00ebr serverat e sistemeve
  QKR dhe QKL t\u00eb cil\u00ebt hostohen tek data centeri i AKSHI-t si dhe nuk ka
  hartuar planin e politikave t\u00eb vazhdueshm\u00ebris\u00eb s\u00eb biznesit (BCP)
  dhe dokumentimin e planit t\u00eb rim\u00ebk\u00ebmbjes nga katastrofa (DRC).\u201d\\n\\n5.
  Lidhur me konstatimin \u201cN\u00eb munges\u00eb t\u00eb struktur\u00ebs/sektorit
  Help Desk n\u00eb QKB nuk sigurohet menaxhimi i sh\u00ebrbimeve IT dhe plot\u00ebsimi
  i k\u00ebrkesave t\u00eb p\u00ebrdoruesve t\u00eb institucionit si dhe deg\u00ebve
  rajonale. Duke par\u00eb r\u00ebnd\u00ebsin\u00eb e QKB-s\u00eb n\u00eb dh\u00ebnien
  e sh\u00ebrbimeve p\u00ebr biznesin, duhej t\u00eb kishte nj\u00eb struktur\u00eb
  suporti t\u00eb ndar\u00eb me detyra dhe p\u00ebrgjegj\u00ebsit\u00eb p\u00ebrkat\u00ebse
  t\u00eb gjith\u00ebsecilit p\u00ebr t\u00eb garantuar dhe siguruar cil\u00ebsin\u00eb
  e sh\u00ebrbimeve ndaj biznesit dhe qytetar\u00ebve.\u201d\\n\\n6. Lidhur me konstatimin
  \u201cDrejtoria e Inovacionit dhe Registravre ka mungesa n\u00eb personel; QKB dhe
  Drejtoria e Inovacionit dhe Registravre nuk ka nj\u00eb analiz\u00eb t\u00eb nevojave
  p\u00ebr trajnim t\u00eb stafit t\u00eb drejtoris\u00eb dhe nuk ka plan p\u00ebr
  trajnime. Stafi i Drejtoris\u00eb s\u00eb Inovacionit dhe Registravre nuk ka kryer
  asnj\u00eb dit\u00eb trajnim p\u00ebr sistemet, sigurin\u00eb dhe teknologjin\u00eb
  e informacionit, etj.\u201d\\n\\n7. Lidhur me konstatimin \u201cportali nuk p\u00ebrdor
  nj\u00eb lidhje t\u00eb sigurt\u00eb (connection security) HTTPS (HyperText Transfer
  Protocol Secure) (Not secure status) q\u00eb do t\u00eb thot\u00eb se serveri i
  fajes s\u00eb internetit nuk p\u00ebrdor nj\u00eb certifikat\u00eb sigurie p\u00ebr
  t\u00eb v\u00ebrtetuar identitetin e internetit n\u00eb shifletues, si Chrome. N\u00eb
  munges\u00eb t\u00eb k\u00ebsaj certifikate mund t\u00eb ndodh\u00eb humbja e privat\u00ebsis\u00eb,
  ndryshimit t\u00eb informacionit q\u00eb merret ose jepet me an\u00eb t\u00eb k\u00ebtij
  portali.\u201d\\n\\n**Q\u00ebndrimi i Grupit t\u00eb Auditimit:**\\n\\n1. Strategjit\u00eb
  nd\u00ebrsektoriale \u201cAxhenda Dixhitale e Shqip\u00ebris\u00eb 2015-2020\u201d
  t\u00eb hartuar nga Kryeministria dhe ministri i shtetit p\u00ebr inovacionin dhe
  administrat\u00ebn publike, jan\u00eb miratuar n\u00eb nivele makro t\u00eb investimeve,
  p\u00ebrmir\u00ebsimeve dhe politikave t\u00eb Qeveris\u00eb n\u00eb nj\u00eb nivel
  t\u00eb gj\u00ebr\u00eb. Pra bazuar n\u00eb k\u00ebto strategji \u00e7do institucion
  ka p\u00ebr detyr\u00eb t\u00eb nd\u00ebrtoj\u00eb strategjit\u00eb e tyre specifike,
  aq m\u00eb tep\u00ebr kur b\u00ebhet fjal\u00eb p\u00ebr teknologjin\u00eb e informacionit
  p\u00ebr t\u00eb pasqyruar qart\u00eb objektivat e institucionit t\u00eb QKB. Nga
  grupi i auditimit \u00ebsht\u00eb l\u00ebn\u00eb rekomandim q\u00eb kjo strategji
  t\u00eb realizohet n\u00eb bashk\u00ebpunim me Ministri n\u00eb linj\u00ebs.\\n\\nGrupi
  i auditimit, pasi shqyrtoi me v\u00ebmendje k\u00ebt\u00eb observacion konkludoi
  si m\u00eb posht\u00eb:\\n\\nArgumentet nuk merren n\u00eb konsiderat\u00eb.\\n\\n2.
  Grupi i auditimit, pasi shqyrtoi me v\u00ebmendje k\u00ebt\u00eb observacion konkludoi
  si m\u00eb posht\u00eb:\\n\\nNga QKB jan\u00eb paraqitur argumente shpjeguese pa
  fakte t\u00eb reja p\u00ebr pasoj\u00eb konstatimi i grupit t\u00eb auditimit nuk
  ndryshon.\\n\\n3. N\u00eb lidhje me k\u00ebt\u00eb \u00e7\u00ebshtje sqarojm\u00eb
  se regjistri i risqeve nuk p\u00ebrmban vet\u00ebm risqet q\u00eb jan\u00eb tashm\u00eb
  t\u00eb dukshme por duhet t\u00eb parashikoj\u00eb dhe risqet e mundshme q\u00eb
  mund t\u00eb ndodhin n\u00eb t\u00eb ardhmen. Me identifikimin e risqeve ulet ndikimi
  i tyre n\u00eb institucion. Risqe t\u00eb tilla si mungesa e kapaciteteve n\u00eb
  memori t\u00eb serverave t\u00eb registrave nuk jan\u00eb listuar n\u00eb regjistrin
  e risqeve q\u00eb QKB disponon. Ju sjellim n\u00eb v\u00ebmendje q\u00eb n\u00eb
  regjistrin e risqeve duhet t\u00eb jan\u00eb t\u00eb identifikuar t\u00eb gjith\u00eb
  risqet e mundshme dhe jo vet\u00ebm ato q\u00eb kan\u00eb lidhje me mbar\u00ebvajtjen
  e rregjistrave, por risqet institucionale etj. Grupi i auditimit, pasi shqyrtoi
  me v\u00ebmendje k\u00ebt\u00eb observacion konkludoi si m\u00eb posht\u00eb: Argumentet
  nuk merren n\u00eb konsiderat\u00eb.\\n\\n4. Grupi i auditimit, pasi shqyrtoi me
  v\u00ebmendje k\u00ebt\u00eb observacion konkludoi si m\u00eb posht\u00eb:\\n\\nNga
  QKB jan\u00eb paraqitur argumente shpjeguese pa fakte t\u00eb reja p\u00ebr pasoj\u00eb
  konstatimi i grupit t\u00eb auditimit nuk ndryshon.\\n\\n5. Grupi i auditimit, pasi
  shqyrtoi me v\u00ebmendje k\u00ebt\u00eb observacion konkludoi si m\u00eb posht\u00eb:\\n   Nga
  QKB jan\u00eb paraqitur argumente shpjeguese pa fakte t\u00eb reja p\u00ebr pasoj\u00eb
  konstatimi i grupit t\u00eb auditimit nuk ndryshon. Konstatimi i grupit t\u00eb
  auditimit lidhet me nevoj\u00ebn p\u00ebr p\u00ebrmir\u00ebsim q\u00eb ka kjo problematik\u00eb,
  pa anashkaluar pun\u00ebn e b\u00ebr\u00eb deri n\u00eb k\u00ebt\u00eb koh\u00eb
  nga ana e QKB.\\n\\n6. Grupi i auditimit, pasi shqyrtoi me v\u00ebmendje k\u00ebt\u00eb
  observacion konkludoi si m\u00eb posht\u00eb:\\n   Nga QKB jan\u00eb paraqitur argumente
  shpjeguese, p\u00ebr pasoj\u00eb konstatimi i grupit t\u00eb auditimit nuk ndryshon.\\n\\n7.
  Grupi i auditimit, pasi shqyrtoi me v\u00ebmendje k\u00ebt\u00eb observacion konkludoi
  si m\u00eb posht\u00eb:\\n   Nga QKB jan\u00eb paraqitur argumente shpjeguese, p\u00ebr
  pasoj\u00eb konstatimi i grupit t\u00eb auditimit nuk ndryshon.\\n\\nPika 4. \u201cVerifikim
  i kontrolleve t\u00eb aplikacioneve p\u00ebr t\u00eb dh\u00ebnat input/output dhe
  shkalla e siguris\u00eb s\u00eb p\u00ebrdoruesve\u201d.\\n\\nNga grupi i auditimit
  u analizu data baz\u00eb e inputeve p\u00ebr QKL dhe Regjistrin Tregtar p\u00ebr
  vitet 2015-2018. K\u00ebto t\u00eb dh\u00ebna u vun\u00eb n\u00eb dispozicion nga
  QKB n\u00eb form\u00eb elektronike. Nga analiza e inputeve u konstatuan veprime
  t\u00eb cilat n\u00eb opinion t\u00eb grupit t\u00eb auditimit jan\u00eb t\u00eb
  parregullta. M\u00eb holl\u00ebsisht trajtohen m\u00eb posht\u00eb:\\n\\nNga auditimi
  i Inputeve t\u00eb QKL u konstatua se:\\n- P\u00ebr vitet 2015-2017, n\u00eb fush\u00ebn
  \u201cTipi i Subjektit\u201d, plot\u00ebsimi i fush\u00ebs nuk \u00ebsht\u00eb i
  unifikuar. Sakt\u00ebsisht kjo fush\u00eb \u00ebsht\u00eb plot\u00ebsuar me statusin
  \u201cShoqeri Aksionare\u201d si dhe \u201cShoq\u00ebri Aksionare\u201d. Gjithashtu
  kjo fush\u00eb \u00ebsht\u00eb plot\u00ebsuar me statusin \u201cShoq\u00ebri me
  p\u00ebrgjegj\u00ebsi t\u00eb kufizuar\u201d si dhe e shkurtuar \u201cShpk\u201d.
  Edhe pse p\u00ebr rastet e cituara, n\u00eb thelb statusi juridik mbet\u00ebt i
  nj\u00ebjt\u00eb, kjo qasje rrjit mund\u00ebsin\u00eb n\u00eb deklarimin e statistikave
  t\u00eb gabuara nga ana e institucionit t\u00eb Qendr\u00ebs Komb\u00ebtare t\u00eb
  Biznesit.\\n- P\u00ebr vitet 2015-2017, n\u00eb 19 raste mosha e aplikantit p\u00ebr
  marrjen e licenc\u00ebs \u00ebsht\u00eb n\u00ebn 18 vje\u00e7, pra pa zot\u00ebsi
  t\u00eb plot\u00eb juridike p\u00ebr t\u00eb vepruar. Sakt\u00ebsisht, u konstatuan
  12 raste p\u00ebr vitin 2015, 6 raste p\u00ebr vitin 2016 dhe 1 rast p\u00ebr vitin
  2017. Gjithashtu, n\u00eb 10 raste u konstatua se data e lindjes s\u00eb aplikantit
  i p\u00ebrket s\u00eb ardhmes. Sakt\u00ebsisht 5 raste p\u00ebr vitin 2015 dhe 5
  raste p\u00ebr vitin 2016.\\n\\n- Nj\u00eb pjes\u00eb e fushave t\u00eb plot\u00ebsuara
  kan\u00eb vler\u00ebn \u201cNULL\u201d. Sakt\u00ebsisht fushat: \u201cAdresa e e-mail\u201d,
  \u201cGjinia\u201d, \u201cTechDirector Name\u201d, \u201cEconomic Activity\u201d,
  \u201cDescription of Activity\u201d. Pra fushat nuk kan\u00eb t\u00eb dh\u00ebnat
  e k\u00ebrkuara, e p\u00ebr pasoj\u00eb informacioni i plot\u00eb p\u00ebr k\u00ebto
  raste nuk ekziston.\\n- P\u00ebr vitin 2016, n\u00eb 3831 raste nga 4095 n\u00eb
  total, fusha \u201cSasia e paguar\u201d rezulton dat\u00eb. Normalisht kjo fush\u00eb
  duhet t\u00eb jet\u00eb e plot\u00ebsuar me vlerat \u201c100\u201d, \u201c50\u201d
  ose \u201cNULL\u201d.\\n- P\u00ebr vitet 2015-2018, u konstatua se fusha \u201cNID\u201d
  nuk \u00ebsht\u00eb plot\u00ebsuar gjithnj\u00eb n\u00eb m\u00ebnyr\u00eb korrekte,
  pasi n\u00eb mjaft raste \u00ebsht\u00eb plot\u00ebsuar me numrin e let\u00ebrnjoftimit
  apo numrin e pasaport\u00ebs.\\n- P\u00ebr vitet 2015-2018, u konstatuan 241 raste
  t\u00eb veprimeve t\u00eb dublikuara. Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb
  33 veprime t\u00eb dublikuara, p\u00ebr vitin 2016 rezultojn\u00eb 19 raste, p\u00ebr
  vitin 2017 rezultojn\u00eb 122 raste dhe 2018 rezultojn\u00eb 67 raste.\\n\\nNga
  auditimi i inputeve p\u00ebr regjistrin tregtar u konstatua se:\\n\\n- P\u00ebr
  vitet 2015-2018, u konstatuan 52 raste n\u00eb t\u00eb cilat forma ligjore nuk \u00ebsht\u00eb
  e p\u00ebrcaktuar. Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb 18 raste,
  p\u00ebr vitin 2016 rezultojn\u00eb 13 raste, p\u00ebr vitin 2017 rezultojn\u00eb
  8 raste dhe 2018 rezultojn\u00eb 13 raste.\\n\\n- P\u00ebr vitet 2015-2018, u konstatuan
  197 raste n\u00eb t\u00eb cilat fusha \u201cNACE_ID\u201d si dhe \u201cNACE_PARENT\u201d
  nuk jan\u00eb t\u00eb p\u00ebrcaktuara. Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb
  156 raste, p\u00ebr vitin 2016 rezultojn\u00eb 7 raste, p\u00ebr vitin 2017 rezultojn\u00eb
  26 raste dhe 2018 rezultojn\u00eb 8 raste.\\n\\nStruktura e QKB \u00ebsht\u00eb
  miratuar me urdh\u00ebr t\u00eb Kryeministrit nr. 53, dat\u00eb 31.03.2016, ku jan\u00eb
  p\u00ebrcaktuar pozicionet, hierarkia, drejtori t\u00eb dhe kategorit\u00eb e pag\u00ebs
  p\u00ebr \u00e7do pozicion. Rekrutimi p\u00ebr punonj\u00ebsit e TIK n\u00eb QKB
  b\u00ebhet sipas ligjit nr. 152/2013 \u201cP\u00ebr n\u00ebpun\u00ebsin civil\u201d,
  i ndryshuar, si dhe VKM-ve n\u00eb zbatim t\u00eb tij. Detyrat dhe kompetencat e
  \u00e7do punonj\u00ebsi p\u00ebrcaktohen n\u00eb zbatim t\u00eb udh\u00ebzimit nr.
  01, dat\u00eb 31.05.2017 \u201cP\u00ebr hartimin e p\u00ebrshtrimeve t\u00eb pun\u00ebs
  n\u00eb sh\u00ebrbimin civil\u201d dhe n\u00eb zbatim t\u00eb VKM-s\u00eb nr. 142,
  dat\u00eb 12.03.2014 \u201cP\u00ebr p\u00ebrshtrimin dhe klasifikimin e pozicioneve
  t\u00eb pun\u00ebs n\u00eb institucionet e administrat\u00ebs shtet\u00ebrore dhe
  institucionet e pavarura\u201d.\\n\\nRastet e problematikave n\u00eb site. Me an\u00eb
  t\u00eb e-mailit zyrtar ose telefonis\u00eb njoftohen zyrat qendrore p\u00ebr problematik\u00ebn
  dhe n\u00eb rastet kur nuk arrihet rregullimi i tyre me remote, sportelisti p\u00ebrkat\u00ebs
  depoziton pajisjen pran\u00eb QKB p\u00ebr evidentimin dhe zgjidhjen e problematik\u00ebs.
  Nga specialist\u00ebt e TIK merren masat e nevojshme p\u00ebr rregullimin e tyre
  dhe p\u00ebrs\u00ebri me an\u00eb t\u00eb e-mail/telefonit njoftohen sportelist\u00ebt
  p\u00ebr t\u00ebrheqjen nga zyrat e QKB t\u00eb PC s\u00eb riparuar/formatuar.\\n\\nAktualisht,
  QKB-ja e zhvillon aktivitetin e saj n\u00eb 35 sporte t\u00eb gjith\u00eb territorin
  e Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb, n\u00eb t\u00eb cilat sh\u00ebrbejn\u00eb
  75 punonj\u00ebs me detyra dhe p\u00ebrshtreme pun\u00eb t\u00eb nj\u00ebjt\u00eb
  me ato t\u00eb zyres qendrore. Sportelet prit\u00ebse t\u00eb biznesit n\u00eb rrethe
  jan\u00eb t\u00eb vendosura pran\u00eb Bashkive dhe Komunave si dhe n\u00eb Dhomat
  e Tregtis\u00eb. T\u00eb gjitha aplikimet e kryera nga biznesi procesohen nga struktura
  e regjistrimit e vendosur n\u00eb zyr\u00ebn qendrore n\u00eb Tiran\u00eb.\\n\\nQKB
  funksionon n\u00eb baz\u00eb t\u00eb nj\u00eb sistemi elektronik t\u00eb integruar
  t\u00eb dh\u00ebnash q\u00eb realizon lidhjen nd\u00ebrmjet sporteleve t\u00eb sh\u00ebrbimit
  n\u00eb rrethe me zyr\u00ebn qendrore t\u00eb QKB-s\u00eb n\u00eb Tiran\u00eb. Sistemi
  i regjistrimit u krijon mund\u00ebsin\u00eb bizneseve t\u00eb regjistrohen brenda
  24 or\u00ebve. Sistemi n\u00eb fjal\u00eb \u00ebsht\u00eb baz\u00eb t\u00eb dh\u00ebnash
  shtet\u00ebrore dhe \u00ebsht\u00eb i regjistruar pran\u00eb ARK me nivel sigurie
  L-D3I1K0.\\n\\n**P\u00ebrdoruesit e thjesht\u00eb t\u00eb e-licencing.**\\n\\nP\u00ebrdoruesit
  e thjesht\u00eb t\u00eb e-licencing klasifikohen n\u00eb p\u00ebrputhje me detyrat
  e tyre n\u00eb rolin p\u00ebrkat\u00ebs, t\u00eb p\u00ebrcaktuara n\u00eb aktet
  ligjore dhe n\u00ebligjore, si dhe n\u00eb Manualin e P\u00ebrdorimit t\u00eb e-licencing
  dhe Rregulloren e Brendshme, si m\u00eb posht\u00eb:\\n\\n- Service Windows Clerk
  (sportelist)\\n- Registrar (regjistrues)\\n- Department Head (supervizor)\\n- Registrars
  Director\\n- Ministry Officer\\n- Independent Institutions\\n- Prokuroria\\n\\n**Emri
  i p\u00ebrdoruesit dhe Fjal\u00ebkalimi p\u00ebr p\u00ebrdoruesit e thjesht\u00eb.**\\n\\n\u00c7do
  p\u00ebrdorues i e-register duhet t\u00eb jet\u00eb i pajisur me em\u00ebr p\u00ebrdoruesi
  unik. Nj\u00eb sistem kontrollues aksesi duhet t\u00eb identifikoj\u00eb \u00e7do
  p\u00ebrdorues dhe ndaloj\u00eb p\u00ebrdorues t\u00eb paautorizuar t\u00eb modifikojn\u00eb/p\u00ebrdorin
  informacionin n\u00eb e-register. K\u00ebrkesat e siguris\u00eb p\u00ebr identifikimin
  e p\u00ebrdoruesve p\u00ebrfshijn\u00eb:\\n\\n- \u00c7do p\u00ebrdorues pajiset
  me nj\u00eb identifikues, i cili p\u00ebrb\u00ebhet nga emri/mbiemri i p\u00ebrdoruesit.\\n\\n\u00c7do
  p\u00ebrdorues \u00ebsht\u00eb p\u00ebrgjegj\u00ebs p\u00ebr p\u00ebrdorimin dhe
  keq-p\u00ebrdorimin e identifikusit t\u00eb tyre personal n\u00eb p\u00ebrpunhje
  me rolin p\u00ebrkat\u00ebs.\\n\\nP\u00ebrdoruesit dhe identifikuesi p\u00ebrkat\u00ebs
  p\u00ebrcaktohen nga Drejtori i Regjistrimit, i cili mund t\u00eb urdh\u00ebrroj\u00eb
  delegimin e k\u00ebsaj p\u00ebrgjegj\u00ebsie, p\u00ebr t\u00eb krijuar \u00e7do
  p\u00ebrdorues t\u00eb ri s\u00eb bashku me rolin e tij p\u00ebrkat\u00ebs n\u00eb
  e-register.\\n\\nDrejtoria e Sh\u00ebrbimeve Mb\u00ebshtet\u00ebse i d\u00ebrgon
  administratorit t\u00eb sistemit, Drejtorit t\u00eb Drejtoris\u00eb s\u00eb Inovacionit
  dhe Regjistrit Elektronik, informacion t\u00eb menj\u00ebher\u00ebsh\u00ebm n\u00ebse
  nj\u00eb p\u00ebrdorues i ri:\\n\\n- duhet shtuar n\u00eb e-register s\u00eb bashku
  me rolin e tij p\u00ebrkat\u00ebs;\\n- nj\u00eb p\u00ebrdorues \u00ebsht\u00eb larguar;\\n-
  pozicioni i pun\u00ebs s\u00eb p\u00ebrdoruesit ka ndryshuar.\\n\\nK\u00ebrkesat
  e siguris\u00eb p\u00ebr fjal\u00ebkalimin e p\u00ebrdoruesve p\u00ebrfshijn\u00eb:\\n\\n-
  Fjal\u00ebkalimi duhet t\u00eb jet\u00eb minimalisht me 8 karaktere;\\n- Fjal\u00ebkalimi
  duhet t\u00eb p\u00ebrmbyaj\u00eb nj\u00eb kombinim t\u00eb germave kapitale dhe
  t\u00eb vogla, numrave dhe karaktereve special (si !, @, #, etj);\\n- Fjal\u00ebkalimet
  duhet t\u00eb ndryshojn\u00eb \u00e7do 90 dit\u00eb. Fjal\u00ebkalimet q\u00eb dyshohet
  se mund t\u00eb jen\u00eb zbuluar ose b\u00ebr\u00eb t\u00eb ditur duhet t\u00eb
  raportohen tek administrator\u00ebt e sistemit dhe t\u00eb ndryshohen menj\u00ebher\u00eb;\\n-
  15 fjal\u00ebkalimet e m\u00ebparshme nuk mund t\u00eb p\u00ebrdor\u00ebn;\\n- Fjal\u00ebkalimet
  nuk mund tu komunikohen t\u00eb tjer\u00ebve, t\u00eb shkruhen n\u00eb let\u00ebr,
  ose t\u00eb ruhen n\u00eb ndonj\u00eb file n\u00eb kompjuter;\\n- Fjal\u00ebkalimet
  jan\u00eb t\u00eb maskuara dhe nuk printohen ose p\u00ebrfshihen kurr\u00eb n\u00eb
  raporte ose log-e.\\n- T\u00eb nj\u00ebjtat k\u00ebrkesa sigurie jan\u00eb edhe
  p\u00ebr administratorin e sistemit t\u00eb menaxhimit t\u00eb baz\u00ebs s\u00eb
  t\u00eb dh\u00ebnave.\\n\\nKontrolllet e siguris\u00eb p\u00ebr baz\u00ebn e t\u00eb
  dh\u00ebnave klasifikohen n\u00eb \u201cparandaluese\u201d, \u201cdedektuese\u201d
  dhe \u201cevidentuese\u201d kundrejt aksesit t\u00eb pa autorizuar.\\n\\n**Kontrolllet
  e siguris\u00eb parandaluese.**\\n\\nReziqet mbi sigurin\u00eb e nj\u00eb sistemi
  ose baz\u00eb t\u00eb dh\u00ebnash rriten, sa m\u00eb kompleks dhe i avancuar ky
  sistem ose baz\u00eb t\u00eb dh\u00ebnash b\u00ebhet. Si rrjedhim kontolle sigurie
  duhet t\u00eb zbatohen n\u00eb m\u00ebnyr\u00eb q\u00eb t\u00eb parandalojn\u00eb
  aksesin e pa autorizuar tek ky sistem ose baza e t\u00eb dh\u00ebnave.\\n\\n**Regjistri
  tregtar.**\\n\\nKomunikimi dhe nd\u00ebrveprimi funksionon n\u00eb dy m\u00ebnyra.\\n\\nI.
  N\u00ebp\u00ebrmjet publikimit t\u00eb Webserviseve drejt infrastruktur\u00ebs s\u00eb
  nd\u00ebrveprimit t\u00eb menaxhuar nga AKSHI.\\n\\nT\u00eb dh\u00ebnat nga databasa
  reale n\u00eb interval \u00e7do 1 or\u00eb ruhen n\u00eb nj\u00eb databaze t\u00eb
  ve\u00e7ant\u00eb. Ky proces kryhet n\u00ebp\u00ebrmjet paketave te integrimit SSIS
  (SQL Server Integration Services). Paketat e integrimit p\u00ebrdorin nj\u00eb user
  me t\u00eb drejta t\u00eb kufizuara n\u00eb databaz\u00ebn e sistemit t\u00eb brendsh\u00ebm,
  paketat e integrimit SSIS jan\u00eb t\u00eb mbrojtura me fjal\u00ebkalim.\\n\\nWebserviset
  q\u00eb jan\u00eb ngritur lidhen me databaz\u00ebn me an\u00eb t\u00eb nj\u00eb
  useri n\u00eb SQL server i cili ka vet\u00ebm t\u00eb drejta leximi mbi databaz\u00ebn.\\n\\nII.
  N\u00ebp\u00ebrmjet nj\u00eb aplikacioni i cili d\u00ebrgon t\u00eb dh\u00ebnat
  drejt infrastruktur\u00ebs s\u00eb nd\u00ebrveprimit n\u00ebp\u00ebrmjet DIS dhe
  GG.\\n\\nN\u00eb k\u00ebt\u00eb modul jan\u00eb t\u00eb p\u00ebrfshira t\u00eb dh\u00ebnat
  e biznesit (gjendja aktuale e biznesit pas veprimit n\u00eb regjist\u00ebr) t\u00eb
  cil\u00ebt i d\u00ebrgohen t\u00eb inkriptuara drejt sistemit tatimore sipas marr\u00ebveshjes
  s\u00eb n\u00ebnshkruar dhe protokollit t\u00eb komunikimit t\u00eb hartuar p\u00ebr
  k\u00ebt\u00eb rast. Dhe drejt APP n\u00eb lidhje me t\u00eb dh\u00ebnat p\u00ebr
  regjistrimet filletare, ndryshimeve, etj. Jan\u00eb ne proces testimi lidhja me
  sistemin e IQ dhe DPTTV. P\u00ebr t\u00eb dy institucionet \u00ebsht\u00eb ngritur
  edhe nj\u00eb sistem monitorimi t\u00eb \u00e7do \u00e7\u00ebshtjeje t\u00eb\\n\\nd\u00ebrguar
  drejt sistemit GDT dhe APP e cila kthen mb\u00ebrapsht rezultat n\u00ebse mesazhi
  \u00ebsht\u00eb d\u00ebrguar me sukses apo ka pasur problematike.\\n\\n**K\u00ebrkesat
  e p\u00ebrdoruesve menaxhohen n\u00eb disa m\u00ebnyra:**\\n- Marr\u00ebveshjet
  e n\u00ebnshkruara nd\u00ebrmjet Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit\\n-
  Shkresat e sjella p\u00ebr krijuim, mbyllje p\u00ebrdoruesish, me k\u00ebrkes\u00eb
  t\u00eb titullarit p\u00ebrkat\u00ebs t\u00eb Institucionit p\u00ebrkat\u00ebs.\\n-
  Email nga Drejtoria e Sh\u00ebrbimeve t\u00eb Brendshme.\\n\\nFillimi i p\u00ebrkat\u00ebs
  p\u00ebrdoruesit b\u00ebhet e-mail AKSHI mbi krijuimin e p\u00ebrdoruesit. M\u00eb
  pas me konfirmimin e krijuimit t\u00eb mailbox dhe p\u00ebrdoruesit n\u00eb Active
  Directory vijohet me krijuimin e p\u00ebrdoruesit p\u00ebrkat\u00ebs n\u00eb Regjist\u00ebr.\\n\\nN\u00eb
  var\u00ebsi t\u00eb m\u00ebnyr\u00ebs s\u00eb d\u00ebrguar, e-mail apo shkres\u00eb,
  n\u00eb t\u00eb cil\u00ebn jan\u00eb mir\u00eb p\u00ebrcaktuar em\u00ebr mbiem\u00ebr
  t\u00eb p\u00ebrdoruesit p\u00ebrkat\u00ebs si dhe roli i tij n\u00eb Regjist\u00ebr,
  krijohet user-i dhe i jetet aksesi p\u00ebrkat\u00ebs.\\n\\nDeri n\u00eb momentin
  e auditimit nuk jan\u00eb regjistruar raste nd\u00ebrhyrjeje t\u00eb evidentuara.\\n\\nN\u00eb
  rregulloren e IT-s\u00eb, p\u00ebrfshihet krijuimi dhe aksesi i \u00e7do p\u00ebrdoruesi
  n\u00eb aplikacion dhe n\u00ebp\u00ebrmjet sistemit t\u00eb kartave t\u00eb aksesit
  n\u00eb Institucion.\\n\\n**Kontrolle t\u00eb p\u00ebrshtatshme p\u00ebr vlefshm\u00ebrin\u00eb
  e inputeve.**\\n\\nKufizimi PRIMARY KEY identifikon n\u00eb m\u00ebnyr\u00eb unike
  \u00e7do rekord n\u00eb nj\u00eb tabel\u00eb t\u00eb baz\u00ebs s\u00eb t\u00eb
  dh\u00ebnave. PRIMARY KEY duhet t\u00eb p\u00ebrmbajn\u00eb vlera unike dhe nuk
  mund t\u00eb p\u00ebrmbajn\u00eb vlera NULL. Nj\u00eb tabel\u00eb mund t\u00eb ket\u00eb
  vet\u00ebm nj\u00eb PRIMARY KEY, i cili mund t\u00eb p\u00ebrb\u00ebhet nga fusha
  t\u00eb vetme ose t\u00eb shum\u00ebfishta.\\n\\nProcedura t\u00eb p\u00ebrshtatshme
  p\u00ebr trajtimin e gabimeve fillimisht raportohet me an\u00eb t\u00eb nj\u00eb
  e-mail nga p\u00ebrdoruesi p\u00ebrkat\u00ebs, duke b\u00ebr\u00eb nj\u00eb sqarim
  t\u00eb problematik\u00ebs. Kjo problematik\u00eb e raportuar m\u00eb pas kontrollohet
  nga ndjek\u00ebsi i kontrat\u00ebs dhe n\u00eb rast se q\u00ebndron raportohet n\u00eb
  sistemin e raportimit (n\u00eb rastin e kompanive t\u00eb mir\u00ebmbajtjes nga
  t\u00eb dy Regjistrat) apo me e-mail p\u00ebr kompanit\u00eb e tjera. N\u00eb rastin
  e kompanive t\u00eb Regjistrat Tregtar dhe Regjistrat t\u00eb Leje/Licencave/Autorizimeve
  problematika mund t\u00eb raportohet dhe me e-mail paraprakisht dhe me krijuimin
  e nj\u00eb rasti n\u00eb sistemin e raportimit p\u00ebrkat\u00ebs.\\n\\n**Autorizimi
  p\u00ebr hyrjen e t\u00eb dh\u00ebnave n\u00eb aplikacion.**\\n\\nSistemi e-register
  dhe i licencave i ka t\u00eb p\u00ebrcaktuar nivelet e p\u00ebrdoruesve n\u00eb
  baz\u00eb t\u00eb rolit t\u00eb pun\u00ebs. Secili p\u00ebrdorues ka profilin e
  tij me t\u00eb cilin akseson faqen e pun\u00ebs n\u00ebp\u00ebrmjet username password.\\n\\nFillimi
  i p\u00ebrdoruesit b\u00ebhet e-mail AKSHI mbi krijuimin e p\u00ebrdoruesit. M\u00eb
  pas me konfirmimin e krijuimit t\u00eb mailbox dhe p\u00ebrdoruesit n\u00eb Active
  Directory vijohet me krijuimin e p\u00ebrdoruesit p\u00ebrkat\u00ebs n\u00eb Regjist\u00ebr.\\n\\nN\u00eb
  p\u00ebrfundim t\u00eb periudh\u00ebs s\u00eb trajnimit n\u00eb sportel, dhe n\u00ebse
  kalon testimin, pajiset me llogari n\u00eb sistemin e-register n\u00eb njyjen Service
  Window Clerk (Sportelist).\\n\\nProfilet jan\u00eb t\u00eb ndara n\u00eb: Administrator,
  Arkiv\u00eb, Audit, Chief of Service, Correctors, Director, Finance, Head of NRC,
  TIK Specialist, Members, Metodologji, P\u00ebrgjegj\u00ebs Finance, Registrar, Service
  Window Clerk, Viewers, Profilet e licencave, Administrator, Departament Head, Ministry
  Officer, Outside NLC, Prokuroria, Registrar, Registrar Director, Service Window
  Clerk.\\n\\nP\u00ebr t\u00eb dy Regjistrat elektronik\u00eb t\u00eb QKB-s\u00eb
  (Regjistri Tregtar dhe Regjistri i Leje/Licencave/Autorizimeve) ekzistonj\u00eb
  dy lloje fushash p\u00ebr plot\u00ebsim: fusha me ngjyr\u00eb blu dhe fusha me ngjyr\u00eb
  t\u00eb kuqe.\\n\\nFushat me ngjyr\u00eb blu jan\u00eb fusha jo t\u00eb detyrueshme,
  pra vullnetare. Informacioni i hedhur n\u00eb to nuk \u00ebsht\u00eb domosdoshm\u00ebrisht
  i detyruesh\u00ebm. Fushat me ngjyr\u00eb t\u00eb kuqe jan\u00eb fusha t\u00eb detyrueshme
  dhe duhen plot\u00ebsuar.\\n\\nPolitikat e krijuimit dhe ndryshimit t\u00eb p\u00ebrdoruesve
  n\u00eb sistem/me si dhe politikat e fjal\u00ebkalimeve jan\u00eb t\u00eb implementuara
  n\u00eb \u201cRregulloren e siguris\u00eb p\u00ebr Regjistrat elektronik t\u00eb
  Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit\u201d.\\n\\n**Nga auditimi u konstatuan
  k\u00ebto mang\u00ebsi:**\\n\\n1. **Titulli i gjetjes:** Munges\u00eb e nj\u00eb
  procedur\u00eb standarde p\u00ebr trajtimin e gabimeve.\\n   **Situata:** QKB nuk
  ka nj\u00eb procedur\u00eb standarde p\u00ebr trajtimin e gabimeve. K\u00ebto raste
  nuk jan\u00eb t\u00eb regjistruara apo t\u00eb reflektuara n\u00eb regjistrin e
  riskut t\u00eb hartuar nga ana QKB. N\u00eb regjistrin e riskut jan\u00eb t\u00eb
  listuara vet\u00ebm raste apo situata t\u00eb p\u00ebrgjithshme, dhe jo t\u00eb
  gjitha rastet specifike t\u00eb m\u00ebv\u00ebme t\u00eb konstatuara t\u00eb ndodhura
  n\u00eb vazhdim\u00ebsi t\u00eb cilat duhet t\u00eb analizohen dhe t\u00eb trajtohen,
  e p\u00ebr pasoj\u00eb t\u00eb rritet mund\u00ebsia e parandalimit zgjidhjen e shpejt\u00eb
  t\u00eb tyre.\\n   **Kriteri:** Hartimi i sakt\u00eb i regjistrit t\u00eb riskut.\\n   **Ndikimi/efekti:**
  Mungesa e nj\u00eb regjistri t\u00eb plot\u00eb riskut\\n   **Shkaku:** Mos pasqyrim
  i t\u00eb gjitha rasteve t\u00eb trajtimit t\u00eb gabimeve.\\n   **R\u00ebnd\u00ebsia:**
  E lart\u00eb\\n   **Rekomandimi:** QKB t\u00eb marr\u00eb masa p\u00ebr hartimin
  e nj\u00eb procedur\u00eb standarde p\u00ebr trajtimin e gabimeve, duke i reflektuar
  t\u00eb gjitha k\u00ebto situata n\u00eb regjistrin e riskut, e cila do t\u00eb
  sh\u00ebrbej\u00eb p\u00ebr zgjidhjen n\u00eb nj\u00eb koh\u00eb m\u00eb t\u00eb
  ul\u00ebt t\u00eb gabimeve n\u00eb t\u00eb ardhmen si dhe p\u00ebr parandalimin
  e tyre.\\n\\n2. **Titulli i gjetjes:** Parregullsi n\u00eb inputet e QKL.\\n   **Situata:**
  - P\u00ebr vitet 2015-2017, n\u00eb fush\u00ebn \u201cTipi i Subjektit\u201d, plot\u00ebsimi
