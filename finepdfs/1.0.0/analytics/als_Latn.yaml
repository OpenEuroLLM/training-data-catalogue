  Standarde. Kushtet Standarde (si t\u00eb p\u00ebrshkruara n\u00eb seksionin 1.02
  m\u00eb posht\u00eb) p\u00ebrb\u00ebjn\u00eb nj\u00eb pjes\u00eb integrale t\u00eb
  k\u00ebsaj Marr\u00ebveshjeje.\\na) \\\"Sistemi Shqiptar i Informacionit p\u00ebr
  Pyjet\\\" \u00ebsht\u00eb kuadri i teknologjis\u00eb s\u00eb informacionit i projektuar
  t\u00eb marr\u00eb t\u00eb dh\u00ebna ose informacion p\u00ebr pyjet dhe kullotat
  p\u00ebr t\u00eb leht\u00ebsuar analizimin dhe raportimin p\u00ebr menaxhimin e
  integruar t\u00eb pyjeve.\\n1.02 P\u00ebrkufizime. N\u00ebse nuk k\u00ebrkohet ndryshe
  nga konteksti, termat me germa kapitale t\u00eb p\u00ebrdorura n\u00eb k\u00ebt\u00eb
  Marr\u00ebveshje, kan\u00eb kuptimet q\u00eb u jan\u00eb dh\u00ebn\u00eb n\u00eb
  Kushtet Standarde ose n\u00eb k\u00ebt\u00eb seksion:\\nb) \\\"LEK\\\" \u00ebsht\u00eb
  monedha e P\u00ebrfituesit e referuar, gjithashtu, si LEK shqiptar.\\nd) \\\"Udh\u00ebzuesi
  Antikorrupsion\\\" \u00ebsht\u00eb p\u00ebr q\u00ebllime t\u00eb paragrafit 2, t\u00eb
  shtojc\u00ebs s\u00eb Kushteve Standarde \\\"Udh\u00ebzuesi p\u00ebr Parandalimin
  dhe Luftimin e Falsifikimit dhe Korrupsionit n\u00eb Projekte t\u00eb Financuara
  nga Hua t\u00eb IBRD, Kredi t\u00eb IDA-s\u00eb dhe Grante\\\", i dat\u00ebs 15
  tetor 2006, dhe rishikuar n\u00eb janar 2011, si dhe m\u00eb 1 korrik, 2016.\\nc)
  \\\"Plani Vjetor i Punimeve dhe Buxheti\\\" \u00ebsht\u00eb plani i pun\u00ebs dhe
  buxheti i p\u00ebrgatitur n\u00eb terma vjetor\u00eb nga P\u00ebrfituesi dhe miratuar
  nga Banka Bot\u00ebrore, n\u00eb p\u00ebrputhje me 2.03(C) t\u00eb shtojc\u00ebs
  s\u00eb k\u00ebsaj Marr\u00ebveshjeje; dhe \\\"Planet Vjetore t\u00eb Punimeve dhe
  Buxhetet\\\" jan\u00eb m\u00eb shum\u00eb se nj\u00eb Plan Vjetor i Punimeve dhe
  Buxhet.\\ne) \\\"AZHBR\\\" \u00ebsht\u00eb Agjencia p\u00ebr Zhvillim Bujq\u00ebsor
  dhe Rural e P\u00ebrfituesit e krijuar dhe q\u00eb funksionon n\u00eb p\u00ebrputhje
  me ligjin p\u00ebr \\\"Zhvillimin Bujq\u00ebsor dhe Rural\\\" nr. 9817, i dat\u00ebs
  22 tetor, 2007 ose pasuesi ligjor i tij.\\ng) \\\"Kategori\\\" \u00ebsht\u00eb kategoria
  e parashikuar n\u00eb tabel\u00ebn e seksionit 3.01 t\u00eb k\u00ebsaj Marr\u00ebveshjeje.\\nf)
  \\\"P\u00ebrfituesit\\\" jan\u00eb individ\u00ebt dhe organizatat e p\u00ebrzgjedhura
  p\u00ebr t\u00eb marr\u00eb N\u00ebngrante n\u00ebn pjes\u00ebn 2(b) t\u00eb Projektit,
  n\u00eb p\u00ebrputhje me kriteret e parashikuara n\u00eb Manualin Operacional t\u00eb
  Granteve.\\nh) \\\"Planet e Menaxhimit p\u00ebr Pyjet dhe Kullotat Komunale\\\"
  ose \\\"PMPKK\\\" jan\u00eb nj\u00eb instrument menaxhimi i zhvilluar nga komunitetet
  ku parashikohen masat e komunitetit afatshkurtra, afatmesme dhe afatgjata p\u00ebr
  menaxhimin e tokave pyjore dhe kullosore p\u00ebr t\u00eb pakt\u00ebn 10 vjet.\\nj)
  \\\"Planet e Menaxhimit t\u00eb Mikrobaseneve Komunale\\\" ose \\\"PMMBK\\\" jan\u00eb
  nj\u00eb instrument menaxhimi i zhvilluar nga komunitetet ku parashikohen masat
  e komunitetit afatshkurtra, afatmesme dhe afatgjata p\u00ebr menaxhimin e tokave
  pyjore dhe kullosore dhe ato bujq\u00ebsore p\u00ebr t\u00eb pakt\u00ebn 10 vjet.\\ni)
  \\\"Shoqatat e P\u00ebrdoruesve t\u00eb Pyjeve dhe Kullotave Komunale\\\" ose \\\"SHPPKK\\\"
  jan\u00eb organizata joqeveritare q\u00eb p\u00ebrfshijn\u00eb an\u00ebtar\u00eb
  t\u00eb komuniteteve q\u00eb p\u00ebrdorin burimet pyjore dhe kullosore brenda nj\u00eb
  zone t\u00eb nj\u00eb nj\u00ebsie rurale t\u00eb qeveris\u00eb vendore.\\nk) \\\"K\u00ebshilli
  i Ministrave\\\" \u00ebsht\u00eb dega ekzekutive e qeveris\u00eb s\u00eb P\u00ebrfituesit
  kryesuar nga Kryeministri.\\nm) \\\"Departamenti i Bashkis\u00eb p\u00ebr Pyjet\\\"
  \u00ebsht\u00eb zyra e P\u00ebrfituesit n\u00eb nivel bashkiak p\u00ebrgjegj\u00ebse
  p\u00ebr menaxhimin e pyjeve dhe kullotave.\\nl) \\\"Departamenti i Zhvillimit dhe
  Mir\u00ebqeverisjes\\\" \u00ebsht\u00eb departamenti n\u00eb Kryeministri i ngritur
  dhe q\u00eb vepron n\u00eb p\u00ebrputhje me urdhrin e Kryeministrit nr. 157, dat\u00eb
  15.8.2019.\\nn) \\\"Kuadri i Menaxhimit Mjedisor\\\" ose \\\"KMM\\\" \u00ebsht\u00eb
  kuadri i p\u00ebrgatitur nga P\u00ebrfituesi n\u00ebn Projektin Origjinal, dat\u00eb
  11 n\u00ebntor, 2013, i shpallur n\u00eb 23 janar 2014, dhe rishpallur m\u00eb 14
  janar 2020, duke p\u00ebrcaktuar modalitetet p\u00ebr shqyrtim mjedisor dhe procedura
  p\u00ebr p\u00ebrgatitjen dhe\\n\\nzbatimin e planeve t\u00eb menaxhimit mjedisor
  n\u00ebn projektin, dhe terma t\u00eb till\u00eb p\u00ebrfshijn\u00eb t\u00eb gjitha
  planifikimet dhe shtojcat e KMM-s\u00eb.\\n\\np) \\\"Marr\u00ebveshja e Grantit
  t\u00eb GEF-s\u00eb\\\" \u00ebsht\u00eb marr\u00ebveshja e dat\u00ebs 25 korrik
  2014 nd\u00ebrmjet P\u00ebrfituesit dhe Bank\u00ebs Bot\u00ebrore, q\u00eb vepron
  si Agjenci Zbatuese e Fondit p\u00ebr Mjedis Global (GEF), duke siguruar Grantin
  p\u00ebr P\u00ebrfituesin p\u00ebr t\u00eb mb\u00ebshtetur me financim pjes\u00ebt
  1(a), 2(a) dhe 3 t\u00eb Projektit Origjinal, dhe nj\u00eb marr\u00ebveshje e till\u00eb
  mund t\u00eb p\u00ebrdit\u00ebsohet nga koha n\u00eb koh\u00eb. \\\"Marr\u00ebveshja
  e Grantit t\u00eb GEF-s\u00eb\\\" p\u00ebrfshin t\u00eb gjitha shtojcat, planifikimet
  dhe marr\u00ebveshjet shtes\u00eb t\u00eb Marr\u00ebveshjes s\u00eb Grantit t\u00eb
  GEF-s\u00eb.\\no) \\\"Plani i Menaxhimit Mjedisor\\\" ose \\\"PMM\\\" \u00ebsht\u00eb
  n\u00eb p\u00ebrputhje me secilin prej aktiviteteve t\u00eb Projektit, n\u00eb mb\u00ebshtetje
  t\u00eb t\u00eb cil\u00ebve KMM-ja k\u00ebrkon nj\u00eb plan menaxhimi mjedisor,
  i p\u00ebrgatitur n\u00eb p\u00ebrputhje me dispozitat e seksionit 2.03(D) t\u00eb
  shtojc\u00ebs s\u00eb k\u00ebsaj Marr\u00ebveshjeje; dhe \\\"P-tMM\\\" do t\u00eb
  thot\u00eb m\u00eb shum\u00eb se nj\u00eb PMM.\\nq) \\\"Plani Gjinor i Veprimit\\\"
  \u00ebsht\u00eb nj\u00eb plan i zhvilluar nga P\u00ebrfituesi, dat\u00eb 7 n\u00ebntor
  2013, p\u00ebr t\u00eb mb\u00ebshtetur pjes\u00ebmarrjen e grave n\u00eb t\u00eb
  gjitha aktivitetet e projektit q\u00eb p\u00ebrb\u00ebn nj\u00eb pjes\u00eb t\u00eb
  monitorimit t\u00eb Projektit dhe sistemit t\u00eb vler\u00ebsimit.\\ns) \\\"Manuali
  Operacional i Granteve\\\" \u00ebsht\u00eb manuali i miratuar nga P\u00ebrfituesi
  m\u00eb 4 prill 2017, n\u00eb p\u00ebrputhje seksionin IV.B.1 (b) (i), t\u00eb pjes\u00ebs
  2, t\u00eb Marr\u00ebveshjes s\u00eb Huas me IBRD-n\u00eb, si\u00e7 mund t\u00eb
  ndryshohet her\u00eb pas here pas miratimit paraprak me shkrim t\u00eb Bank\u00ebs
  Bot\u00ebrore.\\nr) \\\"Marr\u00ebveshja e Grantit\\\" \u00ebsht\u00eb marr\u00ebveshja
  e referuar n\u00eb seksionin 2.03.B.2(c) e shtojc\u00ebs s\u00eb k\u00ebsaj Marr\u00ebveshjeje.\\nt)
  \\\"Marr\u00ebveshja e Huas e IBRD-s\u00eb\\\" \u00ebsht\u00eb marr\u00ebveshja
  e dat\u00ebs 25 korrik 2014 nd\u00ebrmjet P\u00ebrfituesit dhe Bank\u00ebs Bot\u00ebrore,
  p\u00ebr t\u00eb mb\u00ebshtetur financimin e pjes\u00ebve 1(a), 2(c) dhe pjes\u00ebs
  4(a) t\u00eb Projektit Origjinal.\\nv) \\\"Grupi Lokal i Veprimit\\\" ose \\\"GLV\\\"
  do t\u00eb thot\u00eb partneritet nd\u00ebrmjet institucioneve publike, privatit
  dhe shoq\u00ebris\u00eb civile n\u00eb nivel rajonal p\u00ebr zhvillimin e zon\u00ebs
  rurale.\\nu) \\\"Agjencia Shtet\u00ebrore e Kadastr\u00ebs\\\" \u00ebsht\u00eb agjencia
  p\u00ebrgjegj\u00ebse e P\u00ebrfituesit p\u00ebr sh\u00ebrbimin publik t\u00eb
  regjistrimit t\u00eb pasurive t\u00eb paluajtshme, e ngritur n\u00eb p\u00ebrputhje
  me ligjin nr. 111/2018; ose pasuesi ligjor i saj.\\nw) \\\"Nj\u00ebsit\u00eb e Qeverisjes
  Vendore\\\" ose \\\"NJQV\\\" jan\u00eb komunat ose bashkit\u00eb.\\ny) \\\"MBZHR\\\"
  \u00ebsht\u00eb Ministria e Bujq\u00ebsis\u00eb dhe Zhvillimit Rural e P\u00ebrfituesit
  ose pasuesi ligjor i saj.\\nx) \\\"Autoriteti Menaxhues n\u00eb MBZHR\\\" \u00ebsht\u00eb
  Departamenti i Zhvillimit Rural n\u00eb MBZHR.\\nz) \\\"MFE\\\" \u00ebsht\u00eb
  Ministria e Financave dhe Ekonomis\u00eb e P\u00ebrfituesit ose pasuesi ligjor i
  saj.\\nbb) \\\"Inventari Komb\u00ebtar i Pyjeve\\\" ose \\\"IKP\\\" \u00ebsht\u00eb
  regjistri i t\u00eb dh\u00ebnave mbi pyjet, t\u00eb marra nga informacioni i ofruar
  nga imazhet satelitore, me q\u00ebllim krijimin e nj\u00eb vler\u00ebsimi komb\u00ebtar
  p\u00ebr m\u00ebnyr\u00ebn se si ka ndryshuar mbulesa e pyjeve dhe volumi i pyjeve
  brenda nj\u00eb periudhe t\u00eb caktuar.\\naa) \\\"Federata Komb\u00ebtare e SHPPKK-s\u00eb\\\"
  \u00ebsht\u00eb nj\u00eb organizat\u00eb komb\u00ebtare jofitimprur\u00ebse, e cila
  p\u00ebrfaq\u00ebson interesat e p\u00ebrdoruesve t\u00eb pyjeve dhe kullotave n\u00eb
  territorin e P\u00ebrfituesit.\\ncc) \\\"AKM\\\" \u00ebsht\u00eb Agjencia Komb\u00ebtare
  e Mjedisit e P\u00ebrfituesit e krijuar n\u00eb p\u00ebrputhje me vendimin e K\u00ebshillit
  t\u00eb Ministrave nr. 47, dat\u00eb 29 janar 2014, p\u00ebr Organizimin dhe Funksionimin
  e Agjencis\u00eb Komb\u00ebtare t\u00eb Mjedisit dhe Agjencive Rajonale t\u00eb
  Mjedisit ose pasuesit ligjor t\u00eb saj.\\nee) \\\"Projekti Origjinal\\\" \u00ebsht\u00eb
  projekti i pasqyruar n\u00eb pjes\u00ebn 1 t\u00eb Marr\u00ebveshjes s\u00eb Huas
  me IBRD dhe Marr\u00ebveshjes s\u00eb Grantit me GEF-n\u00eb.\\ndd) \\\"Kostot Operative\\\"
  jan\u00eb kosto me rritje t\u00eb arsyeshme graduale q\u00eb dalin nga Projekti
  dhe q\u00eb p\u00ebrb\u00ebhen nga shpenzime p\u00ebr pajisje p\u00ebr stafin e
  Ministris\u00eb s\u00eb Turizmit dhe Mjedisit dhe AZHBR-s\u00eb, t\u00eb shoq\u00ebruara
  me zbatimin e aktiviteteve t\u00eb Projektit, p\u00ebrfshir\u00eb mir\u00ebmbajtjen
  e zyrave, dietat p\u00ebr n\u00ebpun\u00ebsit civil (p\u00ebrjashtuar pagat p\u00ebr
  n\u00ebpun\u00ebsit civil), orendit\u00eb, materialet dhe furnizimet, kostot e komunikimit,
  kostot e promovimit dhe t\u00eb karburantit p\u00ebr vizitat n\u00eb terren.\\nff)
  \\\"Pagesa p\u00ebr Sh\u00ebrbimet Mjedisore\\\" \u00ebsht\u00eb pagesa q\u00eb
  u ofrohet individ\u00ebve apo grupeve n\u00eb k\u00ebmbim t\u00eb p\u00ebrdorimit
  t\u00eb q\u00ebndruesh\u00ebm t\u00eb tok\u00ebs apo praktikave m\u00eb t\u00eb
  mira.\\ngg) \\\"Pagesa p\u00ebr Sh\u00ebrbimet n\u00eb Uj\u00ebmbledh\u00ebs\\\"
  \u00ebsht\u00eb pagesa q\u00eb u ofrohet individ\u00ebve apo grupeve n\u00eb k\u00ebmbim
  t\u00eb p\u00ebrdorimit t\u00eb q\u00ebndruesh\u00ebm t\u00eb uj\u00ebmbledh\u00ebsve.\\nii)
  \\\"Nj\u00ebsia e Menaxhimit t\u00eb Projektit\\\" \u00ebsht\u00eb nj\u00ebsia e
  P\u00ebrfituesit e p\u00ebrb\u00ebr\u00eb nga staf i nominuar nga Ministria e Turizmit
  dhe Mjedisit, koordinatori i Projektit, specialisti i prokurimit, specialisti i
  menaxhimit financiar dhe staf plot\u00ebsues p\u00ebr rekrutim nga Projekti, n\u00eb
  p\u00ebrputhje me seksionin 2.03.A.1, t\u00eb shtojc\u00ebs s\u00eb k\u00ebsaj Marr\u00ebveshjeje.\\nhh)
  \\\"Pagesa p\u00ebr Sh\u00ebrbimet n\u00eb Uj\u00ebmbledh\u00ebs\\\" \u00ebsht\u00eb
  pagesa q\u00eb u ofrohet individ\u00ebve apo grupeve n\u00eb k\u00ebmbim t\u00eb
  p\u00ebrdorimit t\u00eb q\u00ebndruesh\u00ebm t\u00eb uj\u00ebmbledh\u00ebsve.\\njj)
  \\\"Manuali Operacional i Projektit\\\" \u00ebsht\u00eb manuali i p\u00ebrgatitur
  n\u00eb p\u00ebrputhje me seksionin 2.03.B.1 t\u00eb shtojc\u00ebs s\u00eb k\u00ebsaj
  Marr\u00ebveshjeje dhe i konfirmuar si i k\u00ebnaqsh\u00ebm nga Banka, i miratuar
  nga P\u00ebrfituesi, ku p\u00ebrshkruhen dhe p\u00ebrcaktohen procedurat dhe rregullimet
  institucionale p\u00ebr zbatimin e Projektit, n\u00eb p\u00ebrputhje me dispozitat
  e k\u00ebsaj Marr\u00ebveshjeje dhe me ligjet e rregulloret e zbatueshme, p\u00ebrfshir\u00eb
  rolet dhe p\u00ebrgjegj\u00ebsit\u00eb p\u00ebrkat\u00ebse t\u00eb aktor\u00ebve
  t\u00eb p\u00ebrfshir\u00eb n\u00eb zbatimin e Projektit.\\nll) \\\"Kushtet Standarde\\\"
  jan\u00eb Kushtet Standarde t\u00eb \\\"Bank\u00ebs Nd\u00ebrkomb\u00ebtare p\u00ebr
  Rind\u00ebrtim dhe Zhvillim dhe Shoqat\u00ebs p\u00ebr Zhvillim Nd\u00ebrkomb\u00ebtar
  p\u00ebr Financimin e Grantit t\u00eb kryer n\u00ebp\u00ebrmjet Bank\u00ebs nga
  Fondet e Besimit\\\", dat\u00eb 25 shkurt 2019, me modifikimet e p\u00ebrcaktuara
  n\u00eb shtojc\u00eb.\\nkk) \\\"Komiteti Drejtues i Projektit\\\" \u00ebsht\u00eb
  komiteti drejtues i P\u00ebrfituesit, i referuar n\u00eb seksionin 2.03.A.2 t\u00eb
  shtojc\u00ebs s\u00eb k\u00ebsaj Marr\u00ebveshjeje.\\nmm) \\\"N\u00ebngrante\\\"
  jan\u00eb grantet p\u00ebr p\u00ebrfituesit e pranuesh\u00ebm p\u00ebr t\u00eb realizuar
  N\u00ebnprojektet.\\noo) \\\"Trajnime dhe Seminare\\\" jan\u00eb kostot e arsyetuara,
  t\u00eb miratuara nga Banka Bot\u00ebrore, p\u00ebr trajnime dhe seminare t\u00eb
  mbajtura me k\u00ebt\u00eb Projekt, p\u00ebrfshir\u00eb t\u00eb m\u00ebsuarit, kostot
  e udh\u00ebtimit dhe ushqimit p\u00ebr pjes\u00ebmarr\u00ebsit n\u00eb seminare
  dhe trajnime, kosto t\u00eb shoq\u00ebruara me sigurimin e sh\u00ebrbimeve p\u00ebr
  trajner\u00ebt dhe fol\u00ebsve n\u00eb seminare, qirat\u00eb e lidhura me organizimin
  e seminareve dhe trajnimeve, p\u00ebrgatitja dhe riprodhimi i materialeve t\u00eb
  trajnimeve dhe seminareve, dhe kosto t\u00eb tjera t\u00eb lidhura direkt me kursin
  e trajnimit dhe p\u00ebrgatitjen dhe zbatimin e seminarit (p\u00ebrjashtuar mallrat
  dhe sh\u00ebrbimet e konsulent\u00ebve).\\nnn) \\\"N\u00ebnprojekt\\\" \u00ebsht\u00eb
  n\u00ebnprojekti i p\u00ebrzgjedhur dhe i miratuar nga P\u00ebrfituesi p\u00ebr
  t''u financuar nga N\u00ebngranti, n\u00eb p\u00ebrputhje me kriteret dhe procedurat
  e p\u00ebrcaktuara n\u00eb Manualin Operacional t\u00eb Granteve.\\n\\nNeni II Ekzekutimi
  i Projektit\\n\\n2.01 Objektivat dhe P\u00ebrshkrimi i Projektit. Objektivi i Projektit
  \u00ebsht\u00eb t\u00eb mb\u00ebshtes\u00eb praktikat e menaxhimit t\u00eb q\u00ebndruesh\u00ebm
  t\u00eb tok\u00ebs dhe t\u00eb rris\u00eb p\u00ebrfitimet monetare dhe jomonetare
  t\u00eb komuniteteve n\u00eb zona t\u00eb caktuara t\u00eb zbatimit t\u00eb Projektit,
  t\u00eb cilat shtrihen kryesisht n\u00eb zona t\u00eb larta rurale t\u00eb prekshme
  nga erozioni.\\n\\nPjesa 1: Forcimi i Kapaciteteve Institucionale p\u00ebr P\u00ebrmir\u00ebsimin
  e Sh\u00ebrbimeve Mjedisore nga Menaxhimi i Integruar i Peizazhit\\n\\nProjekti
  p\u00ebrb\u00ebhet nga pjes\u00ebt e m\u00ebposhtme:\\n\\na) Forcimi i kapaciteteve
  t\u00eb P\u00ebrfituesit p\u00ebr menaxhimin e pyjeve dhe kullotave, duke p\u00ebrfshir\u00eb:\\nii.
  zhvillimin e nj\u00eb IKP t\u00eb shtrir\u00eb n\u00eb 10 vjet ku sip\u00ebrfaqet
  prov\u00eb p\u00ebr mbules\u00ebn e pyjeve dhe volumin monitorohen n\u00eb baza
  vjetore p\u00ebr nj\u00eb periudh\u00eb 10-vje\u00e7are;\\ni. p\u00ebrgatitjen e
  nj\u00eb Inventari Komb\u00ebtar t\u00eb Pyjeve p\u00ebr t\u00eb zbuluar ndryshimet
  dhe p\u00ebr t\u00eb dh\u00ebn\u00eb informacion se si ka ndryshuar mbulesa e pyjeve
  dhe volumi i pyjeve p\u00ebr periudh\u00ebn e nd\u00ebrhyrjes p\u00ebr t\u00eb cil\u00ebn
  \u00ebsht\u00eb r\u00ebn\u00eb dakord;\\niii. mb\u00ebshtetje p\u00ebr hartimin
  e planeve t\u00eb menaxhimit t\u00eb pyjeve, n\u00eb pyje shtet\u00ebrore me funksion
  prodhues duke p\u00ebrjashtuar zonat e mbrojtura;\\niv. krijimin e Sistemit Shqiptar
  t\u00eb Informacionit p\u00ebr Pyjet;\\nv. forcimin e kapaciteteve t\u00eb Departamentit
  Bashkiak t\u00eb Pyjeve p\u00ebr t\u00eb p\u00ebrmbushur detyrimet e tij, duke p\u00ebrfshir\u00eb
  monitorim t\u00eb pavarur t\u00eb pyjeve; dhe\\nb) Realizimi i aktiviteteve p\u00ebr
  t\u00eb fuqizuar P\u00ebrfituesit, duke p\u00ebrfshir\u00eb NJQV-n\u00eb, SHPPKK-n\u00eb,
  dhe fermer\u00ebt p\u00ebr t\u00eb p\u00ebrdorur praktika t\u00eb q\u00ebndrueshme
  t\u00eb menaxhimit t\u00eb tok\u00ebs dhe kullotave, duke p\u00ebrfshir\u00eb:\\nvi.
  regjistrimin e pyjeve dhe kullotave t\u00eb transferuara te nj\u00ebsit\u00eb e
  qeverisjes vendore nga qeveria qendrore.\\ni. zbatimin e Planit Gjinor t\u00eb Veprimit
  p\u00ebr t\u00eb nxitur barazin\u00eb gjinore n\u00eb menaxhimin e burimeve natyrore;\\niii.
  trajnimin e NJQV-ve dhe SHPPKK-ve p\u00ebr p\u00ebrdorim t\u00eb q\u00ebndruesh\u00ebm
  t\u00eb pyjeve, kullotave dhe tokave bujq\u00ebsore; dhe\\nii. mb\u00ebshtetjen
  e GLV-ve p\u00ebr t\u00eb kontribuuar n\u00eb strategjin\u00eb e zhvillimit rural;\\niv.
  nxitjen e gjenerimit t\u00eb t\u00eb ardhurave rurale n\u00ebp\u00ebrmjet analiz\u00ebs
  s\u00eb zinxhir\u00ebve t\u00eb vlerave, dhe p\u00ebrgatitjes s\u00eb planeve afatshkurt\u00ebr
  dhe afatmes\u00ebm t\u00eb p\u00ebrpunimit dhe marketimit t\u00eb produkteve pyjore.\\na)
  Realizimi i aktiviteteve p\u00ebr p\u00ebrgatitjen dhe zbatimin e PMMBK-s\u00eb
  p\u00ebr p\u00ebrmir\u00ebsimin e menaxhimit t\u00eb tokave, p\u00ebrfshir\u00eb:\\n\\nPjesa
  2. Planifikimi dhe Dispozita mbi N\u00ebnprojektet p\u00ebr P\u00ebrmir\u00ebsimin
  e Menaxhimit t\u00eb Tokave\\n\\ni. zhvillimin e udh\u00ebzimeve p\u00ebr p\u00ebrgatitjen
  e PMMBK-s\u00eb p\u00ebr t\u00eb promovuar p\u00ebrdorimin e burimeve natyrore;\\niii.
  p\u00ebrmir\u00ebsimin e PMPKK-s\u00eb ekzistuese, t\u00eb cilat p\u00ebrfundojn\u00eb
  brenda jet\u00ebgjat\u00ebsis\u00eb s\u00eb Projektit, n\u00eb PMMBK.\\nii. p\u00ebrgatitjen
  e PMMBK-s\u00eb p\u00ebr komuna t\u00eb tjera; dhe\\nb) Sigurimin e N\u00ebngranteve
  p\u00ebr p\u00ebrfituesit e pranuar p\u00ebr t\u00eb zbatuar N\u00ebnprojekte.\\n\\nPjesa
  3: Prezantimin e Pagesave p\u00ebr Sh\u00ebrbime Mjedisore\\n\\nc) Forcimin e kapaciteteve
  t\u00eb drejtorive rajonale t\u00eb Pyjeve, Zyrave Pyjore Rajonale, AZHBR dhe grupimeve
  t\u00eb tjera t\u00eb p\u00ebrfshira n\u00eb sh\u00ebrbime k\u00ebshillimore n\u00eb
  fush\u00ebn e bujq\u00ebsis\u00eb dhe pyjeve, si edhe t\u00eb aplikant\u00ebve p\u00ebr
  t\u00eb realizuar detyrimet e tyre gjat\u00eb Projektit.\\n\\nKrijimin e mekanizmave
  financues p\u00ebr zvog\u00eblimin e degradimit t\u00eb tokave dhe mb\u00ebshtetjen
  e mjeteve t\u00eb jetes\u00ebs t\u00eb q\u00ebndrueshme, p\u00ebrfshir\u00eb:\\n\\nb)
  Zhvillimin e mekanizmave p\u00ebr pagesat e sh\u00ebrbimeve n\u00eb Uj\u00ebmbledh\u00ebs,
  p\u00ebr t\u00eb garantuar pagesat nga ana e p\u00ebrfituesve t\u00eb sh\u00ebrbimeve
  mjedisore kundrejt atyre t\u00eb cil\u00ebt mund\u00ebsojn\u00eb k\u00ebto sh\u00ebrbime;
  dhe nj\u00eb model p\u00ebr lidhjen mes praktikave t\u00eb p\u00ebrdorimit t\u00eb
  tok\u00ebs me gjenerimin e sh\u00ebrbimeve t\u00eb ekosistemit; dhe\\na) P\u00ebrgatitjen
  e studimeve teknike p\u00ebr zhvillimin e projekteve t\u00eb karbonit dhe krijimin
  e sistemeve t\u00eb monitorimit, raportimit dhe verifikimit, p\u00ebr p\u00ebrcaktimin
  sasior t\u00eb karbonit t\u00eb fiksuar nga aktivitetet e Projektit;\\nc) Pilotimin
  e mekanizmit t\u00eb Pagesave p\u00ebr Sh\u00ebrbimet n\u00eb Uj\u00ebmbledh\u00ebs
  n\u00eb zonat e p\u00ebrzgjedhura.\\na) Realizimin e aktiviteteve p\u00ebr zbatimin
  e Projektit p\u00ebrfshir\u00eb, furnizimin me baz\u00eb materiale, ngritjen e kapaciteteve
  t\u00eb personelit dhe zbatimin e masave mbrojt\u00ebse t\u00eb mjedisit.\\n\\nPjesa
  4: Mb\u00ebshtetje e Zbatimit t\u00eb Projektit\\n\\nb) Furnizimi dhe instalimi
  i sistemit informatik p\u00ebr monitorimin e Projektit, p\u00ebr p\u00ebrkrahjen
  efektive t\u00eb ndjekjes s\u00eb aktiviteteve t\u00eb projektit; dhe realizimin
  e sondazheve, kryerjen e auditimeve mjedisore dhe monitorimin e vler\u00ebsimin.\\n2.03.
  Marr\u00ebveshjet institucionale dhe t\u00eb tjera.\\n2.02. Ekzekutimi i Projektit
  n\u00eb P\u00ebrgjith\u00ebsi. P\u00ebrfituesi deklaron angazhimin e tij ndaj objektivave
  t\u00eb Projektit. P\u00ebr k\u00ebt\u00eb q\u00ebllim, P\u00ebrfituesi do t\u00eb
  realizoj\u00eb Projektin p\u00ebrmes Ministris\u00eb s\u00eb Turizmit dhe Mjedisit,
  me mb\u00ebshtetjen e AZHBR-s\u00eb, n\u00eb p\u00ebrputhje me: a) neni II i Kushteve
  Standarde; b) Udh\u00ebzime Antikorrupsion; dhe c) k\u00ebtij neni II.\\n\\nA. Marr\u00ebveshjet
  institucionale\\n\\nP\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb Turizmit
  dhe Mjedisit, gjat\u00eb koh\u00ebs s\u00eb zbatimit t\u00eb Projektit do t\u00eb
  ket\u00eb nj\u00eb Ekip t\u00eb Menaxhimit t\u00eb Projektit ku p\u00ebrfshihet
  edhe koordinatori i Projektit, t\u00eb cil\u00ebt do t\u00eb ken\u00eb funksione
  dhe p\u00ebrgjegj\u00ebsi t\u00eb pranueshme p\u00ebr Bank\u00ebn, p\u00ebrfshir\u00eb
  koordinimin e shpejt\u00eb dhe efikas, zbatimin komunikimin e p\u00ebrditsh\u00ebm
  t\u00eb lidhur me aktivitetet dhe rezultatet e Projektit.\\n\\n1. Ekipi i Menaxhimit
  t\u00eb Projektit\\n2. Komiteti Drejtues i Projektit\\nb) Pa kufizime n\u00eb p\u00ebrgjith\u00ebsin\u00eb
  e sa m\u00eb sip\u00ebrme, KDP-ja do t\u00eb kryesohet nga Ministria e Turizmit
  dhe Mjedisit dhe do t\u00eb p\u00ebrfshij\u00eb Drejtorin e Projektit, p\u00ebrfaq\u00ebsues
  t\u00eb Ministris\u00eb s\u00eb Turizmit dhe Mjedisit, Autoritetit Menaxhues t\u00eb
  MBZHR-s\u00eb, AKM-s\u00eb, Agjencin\u00eb Shtet\u00ebrore t\u00eb Kadastr\u00ebs,
  AZHBR-s\u00eb, MFE-s\u00eb, Departamentit p\u00ebr Zhvillim dhe Mir\u00ebqeverisje,
  K\u00ebshillit t\u00eb Ministrave, kryetarit t\u00eb nj\u00eb komune dhe t\u00eb
  Federat\u00ebs Komb\u00ebtare t\u00eb SHPPKK-s\u00eb.\\na) P\u00ebrfituesi, p\u00ebrmes
  Ministris\u00eb s\u00eb Turizmit dhe Mjedisit, gjat\u00eb koh\u00ebs s\u00eb zbatimit
  t\u00eb Projektit do t\u00eb ket\u00eb nj\u00eb Komitet Drejtues t\u00eb Projektit
  (KDP) me p\u00ebrb\u00ebrje, mandate dhe terma reference t\u00eb pranueshme nga
  ana e Bank\u00ebs.\\nc) P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb Turizmit
  dhe Mjedisit, do t\u00eb mund\u00ebsoj\u00eb mbledhjen e KDPs\u00eb t\u00eb pakt\u00ebn
  dy her\u00eb n\u00eb vit dhe do t\u00eb ket\u00eb p\u00ebrgjegj\u00ebsin\u00eb p\u00ebr
  t\u00eb siguruar mbik\u00ebqyrjen e zbatimit t\u00eb Projektit, duke p\u00ebrfshir\u00eb,
  nd\u00ebr t\u00eb tjera: i. ofrimin e udh\u00ebzuesve strategjik\u00eb e politik\u00eb;
  ii. leht\u00ebsimin e koordinimit t\u00eb aktiviteteve t\u00eb Projektit, dhe dh\u00ebnien
  e rekomandimeve p\u00ebr heqjen e \u00e7do pengese p\u00ebr zbatimin e Projektit;
  dhe iii. kontrollin e progresit t\u00eb b\u00ebr\u00eb drejt arritjes s\u00eb objektivave
  t\u00eb Projektit.\\na) P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb Turizmit
  dhe Mjedisit, gjat\u00eb koh\u00ebs s\u00eb zbatimit t\u00eb Projektit do t\u00eb
  ket\u00eb nj\u00eb Komitet Teknik t\u00eb Projektit (KTP) t\u00eb kryesuar nga Drejtori
  i Projektit p\u00ebrfshirjen e Koordinatorit t\u00eb Projektit, koordinator\u00ebve
  t\u00eb pjes\u00ebve p\u00ebrb\u00ebr\u00ebse dhe stafit teknik t\u00eb Ministris\u00eb
  s\u00eb Turizmit dhe Mjedisit dhe agjencive t\u00eb tjera t\u00eb p\u00ebrfshira
  n\u00eb zbatimin e projektit; me funksione dhe p\u00ebrgjegj\u00ebsi t\u00eb pranueshme
  nga Banka Bot\u00ebrore, duke p\u00ebrfshir\u00eb: i. sigurimin e cil\u00ebsis\u00eb
  n\u00eb aspektet teknike t\u00eb Projektit; ii. miratimin e Planit Vjetor t\u00eb
  Pun\u00ebs dhe Buxhetit t\u00eb propozuar p\u00ebr t''u kaluar m\u00eb pas n\u00eb
  Bank\u00eb Bot\u00ebrore; dhe iii. mbik\u00ebqyrjen e zbatimit t\u00eb Projektit.\\n3.
  Komiteti Teknik i Projektit\\nb) Pa kufizime mbi dispozitat e paragrafit \\\"a\\\"
  m\u00eb sip\u00ebr, P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb Turizmit
  dhe Mjedisit, do t\u00eb mund\u00ebsoj\u00eb mbledhjen e KTP-s\u00eb t\u00eb pakt\u00ebn
  nj\u00eb her\u00eb n\u00eb dy muaj.\\n1. Manuali Operacional i Projektit\\nB. Marr\u00ebveshjet
  e Zbatimit\\n\\nPa kufizime t\u00eb dispozitave t\u00eb nenit II t\u00eb Kushteve
  Standarde, P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb Turizmit dhe Mjedisit
  do t\u00eb siguroj\u00eb q\u00eb:\\n\\nb) Manuali Operacional i Projektit ose ndonj\u00eb
  pjes\u00eb e tij nuk ndryshohet, hiqet, pezullohet ose shfuqizohet pa pajtueshm\u00ebrin\u00eb
  me shkrim t\u00eb Bank\u00ebs, dhe n\u00eb rast t\u00eb ndonj\u00eb mosp\u00ebrputhjeje
  midis dispozitave t\u00eb Manualit Operacional t\u00eb Projektit dhe atyre t\u00eb
  k\u00ebsaj Marr\u00ebveshjeje, do t\u00eb mbizot\u00ebrojn\u00eb dispozitat e k\u00ebsaj
  Marr\u00ebveshjeje.\\na) Projekti zbatohet n\u00eb p\u00ebrputhje me Manualin Operacional
  t\u00eb Projektit; dhe\\n2. N\u00ebnprojektet\\na) P\u00ebrfituesit e p\u00ebrzgjedhur
  p\u00ebr t\u00eb marr\u00eb N\u00ebngrante jan\u00eb p\u00ebrzgjedhur n\u00eb p\u00ebrputhje
  me kriteret e parashikuara n\u00eb Manualin Operacional t\u00eb Granteve.\\n\\nP\u00ebr
  q\u00ebllimin e zbatimit t\u00eb pjes\u00ebs 2(b) t\u00eb Projektit, P\u00ebrfituesi,
  p\u00ebrmes Ministris\u00eb s\u00eb Turizmit dhe Mjedisit do t\u00eb siguroj\u00eb,
  q\u00eb:\\n\\nb) N\u00ebnprojektet p\u00ebrzgjidhen, vler\u00ebsohen dhe zbatohen
  n\u00eb p\u00ebrputhje me kriteret e procedurat e pranueshme nga Banka Bot\u00ebrore
  t\u00eb parashikuara n\u00eb Manualin Operacional t\u00eb Granteve; p\u00ebrfshir\u00eb,
  k\u00ebrkesat:\\ni. N\u00ebnprojekti i p\u00ebrzgjedhur duhet t\u00eb zbatoj\u00eb
  nj\u00eb PMPK ose PMMBK, ose t\u00eb p\u00ebrmir\u00ebsoj\u00eb praktikat e menaxhimit
  t\u00eb tokave, ose t\u00eb mund\u00ebsoj\u00eb komunitete dhe fermer\u00eb me mund\u00ebsi
  alternative t\u00eb ardhurash p\u00ebr jetes\u00eb;\\nii. t\u00eb jet\u00eb teknikisht
  i mundsh\u00ebm, i zbatuesh\u00ebm ekonomikisht dhe financiarisht; dhe\\nc) P\u00ebrpara
  zbatimit t\u00eb \u00e7do N\u00ebnprojekti t\u00eb caktuar, P\u00ebrfituesi, p\u00ebrmes
  Ministris\u00eb s\u00eb Turizmit dhe Mjedisit, do t\u00eb bazoj\u00eb \u00e7do N\u00ebngrant
  n\u00eb nj\u00eb Marr\u00ebveshjeje Granti me P\u00ebrfituesin p\u00ebrkat\u00ebs,
  me terma dhe kushte t\u00eb miratuar nga Banka Bot\u00ebrore, t\u00eb cilat do t\u00eb
  p\u00ebrfshijn\u00eb si m\u00eb posht\u00eb:\\niii. nuk do t\u00eb p\u00ebrfshij\u00eb
  zhvendosje t\u00eb pavullnetshme.\\n1. N\u00ebngranti do t\u00eb em\u00ebrtohet
  n\u00eb lek\u00eb; dhe\\nd) P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb
  Turizmit dhe Mjedisit, do t\u00eb ushtroj\u00eb t\u00eb drejtat e tij n\u00ebn \u00e7do
  Marr\u00ebveshje Granti p\u00ebr t\u00eb mbrojtur interesat e P\u00ebrfituesit dhe
  t\u00eb Bank\u00ebs Bot\u00ebrore dhe p\u00ebr t\u00eb p\u00ebrmbushur q\u00ebllimin
  e N\u00ebngrantit; dhe p\u00ebrve\u00e7 rastit t\u00eb dakord\u00ebsis\u00eb s\u00eb
  Bank\u00ebs Bot\u00ebrore, P\u00ebrfituesi nuk do t\u00eb ndryshoj\u00eb, shfuqizoj\u00eb
  ose t\u00eb heq\u00eb dor\u00eb nga Marr\u00ebveshja e Grantit ose nga ndonj\u00eb
  prej dispozitave t\u00eb tij.\\n2. P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb
  s\u00eb Turizmit dhe Mjedisit, do t\u00eb ket\u00eb t\u00eb drejtat e duhura p\u00ebr
  mbrojtur interesat e tij dhe t\u00eb Bank\u00ebs Bot\u00ebrore, p\u00ebrfshir\u00eb
  t\u00eb drejtat p\u00ebr: i. t\u00eb pezulloj\u00eb apo p\u00ebrfundoj\u00eb t\u00eb
  drejt\u00ebn e P\u00ebrfituesit p\u00ebr t\u00eb p\u00ebrdorur t\u00eb ardhurat
  e N\u00ebngrantit ose p\u00ebr t\u00eb p\u00ebrfituar rimbursim t\u00eb plot\u00eb
  ose t\u00eb pjessh\u00ebm t\u00eb N\u00ebngrantit t\u00eb t\u00ebrhequr, pas d\u00ebshtimit
  t\u00eb P\u00ebrfituesit p\u00ebr t\u00eb p\u00ebrmbushur detyrimet e tij ndaj Marr\u00ebveshjes
  s\u00eb Grantit: A. Kryerjen e N\u00ebnprojektit me p\u00ebrgjegjshm\u00ebri dhe
  efikasitet dhe n\u00eb p\u00ebrputhje me standardet dhe praktikat e duhura teknike,
  ekonomike, financiare, menaxheriale dhe mjedisore t\u00eb pranueshme nga Banka Bot\u00ebrore,
  p\u00ebrfshir\u00eb p\u00ebrputhshm\u00ebrin\u00eb me dispozitat e Udh\u00ebzuesit
  Antikorrupsion t\u00eb zbatueshme edhe p\u00ebr t\u00eb tjer\u00eb p\u00ebrfitues
  t\u00eb Grantit p\u00ebrve\u00e7 P\u00ebrfituesit; B. Sigurimin, e menj\u00ebhersh\u00ebm
  sipas nevojave, t\u00eb burimeve t\u00eb nevojshme p\u00ebr q\u00ebllimin; C. Prokurimin
  e mallrave, punimeve dhe sh\u00ebrbimeve t\u00eb financuara nga N\u00ebngranti n\u00eb
  p\u00ebrputhje me dispozitat e k\u00ebsaj Marr\u00ebveshjeje; D. P\u00ebrdorimin
  e politikave dhe t\u00eb procedurave t\u00eb duhura p\u00ebr t\u00eb mund\u00ebsuar
  monitorimin dhe vler\u00ebsimin e progresit t\u00eb N\u00ebnprojektit dhe realizimin
  e objektivave t\u00eb tij, n\u00eb p\u00ebrputhje me indikator\u00ebt e pranuesh\u00ebm
  nga Banka Bot\u00ebrore; E. 1. p\u00ebrdorim t\u00eb sistemit t\u00eb menaxhimit
  financiar dhe p\u00ebrgatitjen e pasqyrave financiare, n\u00eb p\u00ebrputhje me
  standardet kontab\u00ebl t\u00eb pranueshme nga Banka Bot\u00ebrore, p\u00ebr t\u00eb
  reflektuar pun\u00ebn, burimet dhe shpenzimet n\u00eb lidhje me N\u00ebnprojektet;
  dhe 2. auditimin e k\u00ebtyre pasqyrave financiare nga auditues t\u00eb pavarur,
  me k\u00ebrkes\u00eb t\u00eb Bank\u00ebs Bot\u00ebrore apo t\u00eb P\u00ebrfituesit,
  n\u00eb p\u00ebrputhje me standardet e zbatueshme t\u00eb auditimit t\u00eb pranueshme
  p\u00ebr Bank\u00ebn Bot\u00ebrore, dhe kalimin e menj\u00ebhersh\u00ebm t\u00eb
  pasqyrave t\u00eb audituara te P\u00ebrfituesi dhe Banka Bot\u00ebrore; F. Mund\u00ebsimin
  e P\u00ebrfituesit dhe Bank\u00ebs p\u00ebr t\u00eb inspektuar N\u00ebnprojektin,
  pun\u00ebn e b\u00ebre dhe regjistrimet e dokumentacionin p\u00ebrkat\u00ebs; dhe
  G. p\u00ebrgatitjen dhe dor\u00ebzimin e informacioneve t\u00eb k\u00ebrkuar nga
  P\u00ebrfituesi dhe Banka Bot\u00ebrore p\u00ebr sa m\u00eb sip\u00ebr.\\nC. Plani
  Vjetor i Pun\u00ebs dhe Buxheti\\n2. P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb
  s\u00eb Turizmit dhe Mjedisit, do t''i mund\u00ebsoj\u00eb Bank\u00ebs Bot\u00ebrore
  nj\u00eb afat t\u00eb p\u00ebrshtatsh\u00ebm p\u00ebr t\u00eb shk\u00ebmbyer pik\u00ebpamjet
  me P\u00ebrfituesin mbi planin e pun\u00ebs dhe buxhetin e propozuar, duke mund\u00ebsuar
  k\u00ebshtu zbatimin e Projektit me kujdesin e duhur p\u00ebrgjat\u00eb vitit fiskal
  n\u00eb vazhdim, n\u00eb p\u00ebrputhje me planin e pun\u00ebs dhe buxhetin e miratuar
  nga Banka Bot\u00ebrore (Plani Vjetor i Pun\u00ebs dhe Buxheti).\\n1. P\u00ebrfituesi,
  p\u00ebrmes Ministris\u00eb s\u00eb Turizmit dhe Mjedisit, do t\u00eb p\u00ebrgatis\u00eb
  dhe d\u00ebrgoj\u00eb n\u00eb Bank\u00eb Bot\u00ebrore, jo m\u00eb von\u00eb se
  data 1 dhjetor i \u00e7do viti fiskal gjat\u00eb zbatimit t\u00eb Projektit, nj\u00eb
  plan pune dhe buxhet ku p\u00ebrfshihen t\u00eb gjitha aktivitetet e propozuara
  p\u00ebr t''u p\u00ebrfshir\u00eb n\u00eb Projekt gjat\u00eb vitit t\u00eb ardhsh\u00ebm
  fiskal, dhe propozimin e nj\u00eb plani financiar p\u00ebr shpenzimet e lidhura
  me k\u00ebto aktivitete, duke paraqitur shumat e propozuara dhe burimet e financimit.\\n3.
  P\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb Turizmit dhe Mjedisit, nuk
  do t\u00eb kryej\u00eb ose lejoj\u00eb kryerjen e ndryshimeve n\u00eb Planin Vjetor
  t\u00eb Pun\u00ebs dhe Buxhet pa marr\u00eb dakord\u00ebsis\u00eb e me shkrim t\u00eb
  Bank\u00ebs Bot\u00ebrore.\\n\\nP\u00ebrfituesi, p\u00ebrmes Ministris\u00eb s\u00eb
  Turizmit dhe Mjedisit, do t\u00eb zbatoj\u00eb Projektin n\u00eb p\u00ebrputhje
