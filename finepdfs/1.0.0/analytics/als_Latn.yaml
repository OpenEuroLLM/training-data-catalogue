  t\u00eb cilat n\u00eb opinion t\u00eb grupit t\u00eb auditimit jan\u00eb t\u00eb
  r\u00ebnd\u00ebsishme p\u00ebr dh\u00ebnien e nj\u00eb pasqyre sa m\u00eb t\u00eb
  plot\u00eb t\u00eb bizneseve.\\n\\n3. Titulli i gjetjes: Parregullsi n\u00eb inputet
  e Regjistrist Tregtar.\\n\\nSituata: - P\u00ebr vitet 2015-2018, u konstatuan 52
  raste n\u00eb t\u00eb cilat forma ligjore nuk \u00ebsht\u00eb e p\u00ebrcaktuar.
  Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb 18 raste, p\u00ebr vitin 2016
  rezultojn\u00eb 13 raste, p\u00ebr vitin 2017 rezultojn\u00eb 8 raste dhe 2018 rezultojn\u00eb
  3 raste.\\n\\n- P\u00ebr vitet 2015-2018, u konstatuan 197 raste n\u00eb t\u00eb
  cilat fusha \u201cNACE_ID\u201d si dhe \u201cNACE_PARENT\u201d nuk jan\u00eb t\u00eb
  p\u00ebrcaktuara. Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb 156 raste,
  p\u00ebr vitin 2016 rezultojn\u00eb 7 raste, p\u00ebr vitin 2017 rezultojn\u00eb
  26 raste dhe 2018 rezultojn\u00eb 8 raste.\\n\\nKriteri: Plot\u00ebsimi i fushave.\\n\\nNdikimi/efekti:
  T\u00eb dh\u00ebna jo t\u00eb plota.\\n\\nShkaku: Mosplot\u00ebsim i fushave.\\n\\nR\u00ebnd\u00ebsia:
  E lart\u00eb.\\n\\nRekomandimi: QKB t\u00eb marr\u00eb masa p\u00ebr analizimin
  e anomalive t\u00eb konstatuara nga auditimi i inputeve t\u00eb t\u00eb dh\u00ebnave
  n\u00eb Regjistrin Tregtar, duke p\u00ebrcaktuar p\u00ebrgjegj\u00ebsit\u00eb, si
  dhe t\u00eb marr\u00eb masa p\u00ebr krijuimin e kontrolleve parandaluese n\u00eb
  t\u00eb ardhmen me q\u00ebllim regjistrimin, mbajtjen dhe raportimin e sakt\u00eb
  t\u00eb t\u00eb dh\u00ebnave.\\n\\nP\u00ebr sa \u00ebsht\u00eb trajtuar n\u00eb
  k\u00ebt\u00eb pik\u00eb t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit jan\u00eb
  mbajtur Akt Konstatimet nr. 2 dhe 3, dat\u00eb 18.07.2016, si dhe \u00ebsht\u00eb
  trajtuar n\u00eb faqet 50-57 t\u00eb Projektraportit t\u00eb Auditimit, mbi t\u00eb
  cilin jan\u00eb paraqitur observacione me shkres\u00ebn nr. 5086/21, dat\u00eb 25.07.2018,
  protokolluar n\u00eb KLSH me nr. 550/3, dat\u00eb 27.07.2018, si dhe me shkres\u00ebn
  nr. 5086/23, dat\u00eb 30.08.2018, protokolluar n\u00eb KLSH me nr. 550/5, dat\u00eb
  31.08.2018, t\u00eb cilat n\u00eb thelb jan\u00eb t\u00eb nj\u00ebjt\u00eb.\\n\\nPretendimi
  i subjektit:\\n\\nI. Lidhur me konstatimin: \u201cQKB nuk ka organizuar p\u00ebrcaktimin
  e n\u00ebnklasave t\u00eb siguris\u00eb, t\u00eb pavarurura nga nj\u00ebra-tjetra
  n\u00eb var\u00ebsi t\u00eb p\u00ebrfundimit t\u00eb analiz\u00ebs s\u00eb siguris\u00eb,
  n\u00eb lidhje me bazat e t\u00eb dh\u00ebnave shtet\u00ebrore q\u00eb kan n\u00eb
  administrim, sakt\u00ebsisht \u201cRegjistri Treg\u00ebtar\u201d dhe \u201cRegjistri
  Komb\u00ebtar i Licencave, Autorizimeve dhe Lejeve\u201d, veprim n\u00eb kund\u00ebrshtrim
  me nenin 17 t\u00eb VKM nr. 945, dat\u00eb 2.11.2012 \u201cP\u00ebr miratimin e
  rregullores \u201cAdministrimi i sistemit t\u00eb bazave t\u00eb t\u00eb dh\u00ebnave
  Shtet\u00ebrore\u201d, Ju sgarojm\u00eb si m\u00eb poshi\u00eb vijon:\\n\\nQendra
  Komb\u00ebtare e Biznesit, konform parashikimeve ligjore dhe n\u00ebnligjore, ka
  regjistruar pran\u00eb ARK-s\u00eb, t\u00eb dy databazat, me klasifikimet e m\u00ebposhtme:\\n\\nRegjistri
  tregtar me nivel sigurie t\u00eb deklaruar: L-D3IIK0;\\n\\nRegjistri i Licencave,
  Autorizimeve dhe Lejeve me nivel sigurie t\u00eb deklaruar L-D2 I3K1.\\n\\nSipas
  parashikimeve t\u00eb nenit 20, t\u00eb VKM-s\u00eb nr 945 date 2.11.2012, Simboli
  i klasave t\u00eb siguris\u00eb formohet nga shkronjat L, M dhe U dhe nga n\u00ebnklasat
  n\u00eb rendin D, I dhe K (p.sh. LP\u00ebr sa koh\u00eb q\u00eb, nga ana e QKB,
  \u00ebsht\u00eb garantuar regjistrimi i dy databazave pran\u00eb ARK-s\u00eb, konform
  dhe n\u00eb zbatim t\u00eb parashikimeve t\u00eb VKM-s\u00eb s\u00eb sip\u00ebr\u00e7ituar,
  vler\u00ebsojm\u00eb se, ky konstatim i grupit t\u00eb pun\u00ebs, nuk g\u00ebndron.\\n\\n2.
  Lidhur me konstatimin: \u201cQKB nuk ka nj\u00eb procedur\u00eb standarte p\u00ebr
  trajtimin e gabimeve. K\u00ebto raste nuk jan\u00eb t\u00eb regjistruara apo t\u00eb
  reflektuara n\u00eb regjistrin e riskut t\u00eb hartuar nga ana QKB. N\u00eb regjistrin
  e riskut jan\u00eb t\u00eb listuara vet\u00ebm raste apo situata t\u00eb p\u00ebrgjithshme,
  dhe Jo t\u00eb gjitha rastet specifike t\u00eb gabimeve t\u00eb konstatuara t\u00eb
  ndodhura n\u00eb vazdim\u00ebsi t\u00eb cilat duhet t\u00eb analizohen dhe t\u00eb
  trajtohen, e p\u00ebr pasoj\u00eb t\u00eb rritet mund\u00ebsia e parandalimit zgjidhjen
  e shpejt\u00eb t\u00eb tyre.\u201d Referuar parimeve t\u00eb menaxhimit t\u00eb
  riskut, po jo vet\u00ebm, gabimet e ndeshura gjat\u00eb proceseve rutin\u00eb t\u00eb
  pun\u00ebs, nuk jan\u00eb t\u00eb ngritura n\u00eb nivelin e risqeve, t\u00eb cilat
  gjejn\u00eb zbatim dhe jan\u00eb thelb\u00ebsore, p\u00ebr t\u2019u trajtuar, n\u00eb
  Menaxhimin e Riskut. N\u00eb \u00e7do rast QKB, i ka trajtuar gabimet e raportuara
  rast pas rasti dhe zgjidhja \u00ebsht\u00eb dh\u00ebn\u00eb n\u00eb p\u00ebrputhje
  me natyr\u00ebn e gabimit dhe sipas kontratatave t\u00eb mir\u00ebmbajtjes s\u00eb
  sistemeve. Duke q\u00ebn\u00eb se, incidentet nuk ndikojn\u00eb n\u00eb mbar\u00ebvajtjen
  e t\u00eb gjith\u00eb regjistrave, p\u00ebr k\u00ebt\u00eb arsye ato nuk jan\u00eb
  p\u00ebrfshir\u00eb n\u00eb regjistrin e riskut.\\n\\n3. N\u00eb lidhje me konstatimet
  mbi gabimet n\u00eb t\u00eb dh\u00ebnat e regjistrave sqarojm\u00eb se k\u00ebto
  gabime konsistojn\u00eb n\u00eb gabime materiale nj\u00ebrzore pasi referuar dokumentacioneve
  shoq\u00ebruese t\u00eb cilat jan\u00eb pjes\u00eb e regjistrave v\u00ebrtetohet
  dhe provohet se jan\u00eb respektuar k\u00ebrkesat ligjore n\u00eb rastin e mosh\u00ebs
  s\u00eb aplikant\u00ebve n\u00eb p\u00ebrputhje me parashikimet e kodit civil, nd\u00ebrkohe
  pasat\u00ebsit\u00eb e konstatuara p\u00ebr regjistrin tregtari p\u00ebr mos plot\u00ebsim
  t\u00eb form\u00ebs ligjore mbas verifikimit t\u00eb kryera n\u00eb register p\u00ebr
  vitin 2018 subjektet e posht\u00ebcituara rezultojn\u00eb t\u00eb jen\u00eb t\u00eb
  regjistruara n\u00eb form\u00ebn e \u201cShoq\u00ebri e Bashk\u00ebpunimit Bujq\u00ebsor\u201d,
  por gjat\u00eb eksportit t\u00eb t\u00eb dh\u00ebnave skripti i gjeneruar e ka quajtur
  Null kthimin e vler\u00ebs kur gjente k\u00ebt\u00eb form\u00eb ligjore, pavar\u00ebsisht
  k\u00ebtij fakti n\u00eb gjenerimin e raporteve n\u00ebp\u00ebrmjet sistemit t\u00eb
  raportimeve k\u00ebto dhena jan\u00eb t\u00eb identifikuara dhe nuk paraqesin asnj\u00eb
  lloj problematike gjat\u00eb p\u00ebrpunimit t\u00eb t\u00eb dh\u00ebnave statistikore.\\n\\n**Q\u00ebndrimi
  i Grupit t\u00eb Auditimit:**\\n\\n1. N\u00eb lidhje me konstatimin e grupit t\u00eb
  auditimit se QKB nuk ka organizuar p\u00ebr\u00e7aktimin e n\u00ebnklasave t\u00eb
  siguris\u00eb, observacioni \u00ebsht\u00eb marr\u00eb n\u00eb konsiderat\u00eb
  dhe \u00ebsht\u00eb reflektuar n\u00eb Raportin P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n2.
  N\u00eb lidhje me konstatimin e grupit t\u00eb auditimit se \u201cQKB nuk ka nj\u00eb
  procedur\u00eb standarte p\u00ebr trajtimin e gabimeve. K\u00ebto raste nuk jan\u00eb
  t\u00eb regjistruara apo t\u00eb reflektuara n\u00eb regjistrin e riskut t\u00eb
  hartuar nga ana QKB. N\u00eb regjistrin e riskut jan\u00eb t\u00eb listuara vet\u00ebm
  raste apo situata t\u00eb p\u00ebrgjithshme, dhe jo t\u00eb gjitha rastet specifike
  t\u00eb gabimeve t\u00eb konstatuara t\u00eb ndodhura n\u00eb vazdim\u00ebsi t\u00eb
  cilat duhet t\u00eb analizohen dhe t\u00eb trajtohen, e p\u00ebr pasoj\u00eb t\u00eb
  rritet mund\u00ebsia e parandalimit zgjidhjen e shpejt\u00eb t\u00eb tyre\u201d,
  nga QKB \u00ebsht\u00eb kund\u00ebrshtuar duke sqaruar se: \u201cGabimet e ndeshura
  gjat\u00eb proceseve rutin\u00eb t\u00eb pun\u00ebs, nuk jan\u00eb t\u00eb ngritura
  n\u00eb nivelin e risqeve, t\u00eb cilat gjejn\u00eb zbatim dhe jan\u00eb thelb\u00ebsore,
  p\u00ebr t\u2019u trajtuar, n\u00eb Menaxhimin e Riskut. N\u00eb \u00e7do rast QKB,
  i ka trajtuar gabimet e raportuara rast pas rasti dhe zgjidhja \u00ebsht\u00eb dh\u00ebn\u00eb
  n\u00eb p\u00ebrputhje me natyr\u00ebn e gabimit dhe sipas kontratatave t\u00eb
  mir\u00ebmbajtjes s\u00eb sistemeve. Duke q\u00ebn\u00eb se, incidentet nuk ndikojn\u00eb
  n\u00eb mbar\u00ebvajtjen e t\u00eb gjith\u00eb regjistrave, p\u00ebr k\u00ebt\u00eb
  arsye ato nuk jan\u00eb p\u00ebrfshir\u00eb n\u00eb regjistrin e riskut\u201d. Nga
  grupi i auditimit gabimet e evidentuara p\u00ebrmbajn\u00eb risqe t\u00eb cilat
  duhet t\u00eb evidentohen n\u00eb regjistrin e riskut, pasi ato ndikojn\u00eb n\u00eb
  dh\u00ebnien e sakt\u00eb t\u00eb informacionit. Gjithashtu n\u00eb opinionin ton\u00eb,
  duhet t\u00eb ket\u00eb nj\u00eb procedur\u00eb t\u00eb standartizuar\\n\\np\u00ebr
  trajtimin e tyre, e cila duhet tu p\u00ebr\u00e7illet t\u00eb gjith\u00eb punonj\u00ebsve
  t\u00eb QKB. P\u00ebr pasoj\u00eb observacioni nuk merret n\u00eb konsiderat\u00eb.\\n\\n3.
  P\u00ebr sa i p\u00ebrket problematikave t\u00eb konstatuara n\u00eb lidhje me t\u00eb
  dh\u00ebnat e databaz\u00ebs t\u00eb v\u00ebna n\u00eb dispozicion t\u00eb grupit
  t\u00eb auditimit, nga QKB jan\u00eb dh\u00ebn\u00eb shpjegime p\u00ebr arsyet e
  ndodhjes s\u00eb k\u00ebtyre gabimeve, duke mos c\u00ebnuar n\u00eb thelb ekzistenc\u00ebn
  e k\u00ebtyre konstatimeve. Nga grupi i auditimit jan\u00eb p\u00ebrmendur k\u00ebto
  problematika duke i v\u00ebn\u00eb n\u00eb dukje ato me q\u00ebllim p\u00ebrmir\u00ebsimin,
  p\u00ebrshtatjen apo edhe marrjen e masave parandaluese n\u00eb t\u00eb ardhmen,
  pa faj\u00ebsuar n\u00eb asnj\u00eb moment autor\u00ebt e hedhjes s\u00eb t\u00eb
  dh\u00ebnave, pasi edhe n\u00eb opinion t\u00eb grupit t\u00eb auditimit jan\u00eb
  gabime njer\u00ebzore. Por ky fakt nuk e kund\u00ebrshton ekzistenc\u00ebn e k\u00ebtyre
  anomalive. P\u00ebr k\u00ebt\u00eb arsye konstatimi i b\u00ebr\u00eb nuk ndryshon.\\n\\nIV.1.
  P\u00ebr p\u00ebrmir\u00ebsimin e gjendjes, rekomandojm\u00eb marrjen e masave si
  m\u00eb posht\u00eb:\\n\\nA. PROPOZIME P\u00cbR NDRYSHIME APO P\u00cbRMIR\u00cbSIME
  N\u00cb LEGJISLACIONIN N\u00cb FUQI\\n\\n1. Gjetje nga auditimi:\\nNga auditimi
  lidhur me t\u00eb dh\u00ebnat p\u00ebr pasqyrat financiare t\u00eb subjekteve dhe
  raportet e auditit/veprimtaris\u00eb \u00ebsht\u00eb konstatuar se:\\n\\n1. K\u00ebto
  t\u00eb dh\u00ebna jan\u00eb par\u00ebsore n\u00eb regjistrin e biznesit n\u00eb
  QKR, n\u00eb p\u00ebrpunje me nenin 43, germa a, t\u00eb ligjit nr. 9723, dat\u00eb
  \u201cP\u00ebr Qendr\u00ebn Komb\u00ebtare t\u00eb Regjistrimit\u201d i p\u00ebrdit\u00ebsuar,
  si dhe VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijuimin e baz\u00ebs t\u00eb
  t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb Qendr\u00ebs Komb\u00ebtare t\u00eb
  Regjistrimit, regjistri tregtar\u201d. Afati p\u00ebrfundimtar p\u00ebr depozitimin
  e tyre, sipas nenit 43, germa a, \u00ebsht\u00eb data 31 Korrik e \u00e7do viti,
  n\u00eb t\u00eb kund\u00ebrt ndaj subjektit vendoset gjoba prej 15,000 lek\u00eb
  bazuar n\u00eb nenin 74, pika 3.\\n\\n2. Pasqyrat financiare dhe raportet e auditimit/veprimtaris\u00eb
  jan\u00eb t\u00eb detyrueshme p\u00ebr t\u2019u plot\u00ebsuar edhe n\u00eb sistemin
  tatimor t\u00eb DPT sipas nenit 29 t\u00eb ligjit nr. 8438, dat\u00eb 28.12.1998
  \u201cP\u00ebr tatimin mbi t\u00eb ardhurat\u201d i ndryshuar. DPT ushtron kontroll
  mbi element\u00ebt e pasqyrave financiare, lejon ose jo ndryshimin e tyre dhe i
  certifikon ato.\\n\\n3. Pasqyrat financiare dhe raportet e auditimit/veprimtaris\u00eb
  p\u00ebrmbajn\u00eb t\u00eb dh\u00ebna q\u00eb sipas nenit 25 i ligjit nr. 9920,
  dat\u00eb 19.05.2008 \u201cP\u00ebr procedurat tatimore n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d i ndryshuar, i n\u00ebnshtrohen kushteve t\u00eb konfidencialitetit,
  nd\u00ebrkohe q\u00eb po t\u00eb nj\u00ebjtat t\u00eb dh\u00ebna t\u00eb subjekteve
  n\u00eb QKB k\u00ebrkohen t\u00eb dor\u00ebzohen brenda afateve t\u00eb p\u00ebrcaktuara
  me ligj e me gjoba n\u00eb rast mos p\u00ebrbushje n\u00eb sh\u00ebrbim t\u00eb
  transparenc\u00ebs.\\n\\n4. Bazat ligjore t\u00eb dy institucioneve i k\u00ebrkojn\u00eb
  biznesit t\u00eb nj\u00ebjt\u00ebn t\u00eb dh\u00ebn\u00eb t\u00eb klasifikuar si
  par\u00ebsore, t\u00eb paraqitet n\u00eb dy sisteme t\u00eb ndryshme, tek ai i regjistrit
  t\u00eb biznesit n\u00eb QKB si dhe ai tatimor n\u00eb DPT, \u00e7far\u00eb bie
  ndesh me nenin 7 t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\n5. QKB dhe DPT jan\u00eb dakord\u00ebsuar
  me marr\u00ebveshjen nr. 1242/1, dat\u00eb 07.09.2017, pa marr\u00eb parasysh faktin
  q\u00eb transparenca mbi t\u00eb dh\u00ebnat e subjekteve n\u00eb QKB e zhb\u00ebn
  konfidencialitetin p\u00ebr t\u00eb nj\u00ebjtat subjekte n\u00eb DPT.\\n\\n6. Subjektet
  dor\u00ebzimin e pasqyrave financiare e kryejn\u00eb n\u00eb dy institucionet (QKB/DPT),
  ku q\u00eb prej vitit 2015 p\u00ebr llogari t\u00eb QKB, e kryen n\u00ebp\u00ebrmjet
  portalit e-albania (para k\u00ebtij viti k\u00ebto veprime kryheshin n\u00eb sportel),
  nd\u00ebrsa p\u00ebr llogari t\u00eb DPT n\u00eb sistemin tatimor i cili \u00ebsht\u00eb
  dhe p\u00ebrgjegj\u00ebs p\u00ebr v\u00ebnien n\u00eb dijeni t\u00eb QKB p\u00ebr
  subjektet q\u00eb kan\u00eb k\u00ebt\u00eb detyrim.\\n\\nM\u00eb holl\u00ebsisht
  trajtuar n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n1.1. Rekomandimi: Ministria e Financave n\u00eb bashk\u00ebpunim
  me Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit dhe Drejtoren\u00eb e P\u00ebrgjithshme
  t\u00eb Tatimeve, t\u00eb shqyrtojn\u00eb mbivendosjet e m\u00ebsip\u00ebrme ligjore,
  p\u00ebr sa i p\u00ebrket deklarimit t\u00eb pasqyrave financiare, e cila rezulton
  si e dh\u00ebn\u00eb par\u00ebsore n\u00eb dy institucione (QKB/DPT), si rezultat
  i k\u00ebrkesave ligjore respektive: ligji nr. 9723, dat\u00eb 03.05.2007 \u201cP\u00ebr
  qendr\u00ebn komb\u00ebtare t\u00eb regjistrimit\u201d i p\u00ebrdit\u00ebsuar dhe
  ligji nr. 9920, dat\u00eb 19.05.2008 \u201cP\u00ebr procedurat tatimore n\u00eb
  Republik\u00ebn e Shqip\u00ebris\u00eb\u201d i ndryshuar, gj\u00eb e cila vjen n\u00eb
  kund\u00ebrshtim edhe me ligjin nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d, konkretisht me: nenin 4 \u201cKrijimi
  i baz\u00ebs s\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore\u201d, pika 3, ku cil\u00ebsohet:\\n\\n\u201cNdalohet
  krijuimi i bazave t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb ve\u00e7anta
  p\u00ebr t\u00eb nj\u00ebjtin informacion ose q\u00ebllim\u201d.\\n\\nnenin 7 \u201cT\u00eb
  dh\u00ebnat par\u00ebsore dhe dyt\u00ebsore\u201d ku cil\u00ebsohet:\\n\\n\u201cBaza
  e t\u00eb dh\u00ebnave shtet\u00ebrore p\u00ebrmban t\u00eb dh\u00ebnat par\u00ebsore
  dhe t\u00eb dh\u00ebnat dyt\u00ebsore.\\n\\na) T\u00eb dh\u00ebnat par\u00ebsore
  t\u00eb nj\u00eb baz\u00eb t\u00eb dh\u00ebnash shtet\u00ebrore jan\u00eb informacione
  specifike, t\u00eb mbledhura nga institucioni administrues, n\u00eb p\u00ebrpunhje
  me aktin e krijimit.\\n\\nb) T\u00eb dh\u00ebnat dyt\u00ebsore jan\u00eb t\u00eb
  dh\u00ebnat q\u00eb merren nga nj\u00eb baz\u00eb tjet\u00ebr t\u00eb dh\u00ebnash,
  ku ato jan\u00eb par\u00ebsore\u201d\\n\\nMenj\u00ebher\u00eb\\n\\nB. MASA ORGANIZATIVE:\\n\\n1.
  Gjetje nga auditimi: Nga auditimi lidhur me Planin Strategjik t\u00eb Teknologjis\u00eb
  s\u00eb Informacionit rezulton se, Qendra Komb\u00ebtare e Biznesit nuk ka t\u00eb
  nd\u00ebrtuar nj\u00eb Plan Strategjik t\u00eb Teknologjis\u00eb s\u00eb Informacionit,
  \u00e7far\u00eb sjell mos pasqyrimin t\u00eb qart\u00eb t\u00eb objektivave t\u00eb
  QKB, lidhur me sigurin\u00eb institucionale dhe infrastruktur\u00ebn TIK, objektivat
  strategjik\u00eb p\u00ebr burimet njer\u00ebzore t\u00eb struktur\u00ebs s\u00eb
  TIK n\u00eb QKB, si dhe n\u00eb deg\u00ebt rajonale n\u00eb lidhje me burimet e
  nevojshme p\u00ebr ngritjen, zhvillimin dhe mir\u00ebmbajtjen e tyre.\\n\\nM\u00eb
  holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 3, faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n1.1. Rekomandimi: QKB n\u00eb bashk\u00ebpunim me Drejtoren\u00eb
  e Inovacionit dhe Regjistrave si dhe me strukturat k\u00ebshilluese mbi TIK, t\u00eb
  marr\u00eb masa p\u00ebr hartimin e Planit Strategjik t\u00eb Teknologjis\u00eb
  s\u00eb Informacionit, ku t\u00eb adresohen qart\u00eb objektivat e institucionit,
  duke marr\u00eb n\u00eb konsiderat\u00eb koh\u00ebn, burimet e nevojshme dhe rishikimin
  vjetor t\u00eb indikatoreve t\u00eb performanc\u00ebs s\u00eb ecuris\u00eb s\u00eb
  objektivave.\\n\\nBrenda vitit 2018 dhe n\u00eb vijim\u00ebsi\\n\\n2. Gjetje nga
  auditimi: Nga auditimi lidhur me Planin e Rim\u00ebk\u00ebmbjes nga Katastrofat,
  QKB si institucion q\u00eb administrojn\u00eb dh\u00ebna me r\u00ebnd\u00ebsi p\u00ebr
  regjistrimin dhe licencimin n\u00eb dy sisteme informacioni (QKR dhe QKL), p\u00ebrcaktuar
  n\u00eb ligjin organik q\u00eb rregullon regjistrimin dhe licencimin e biznesit,
  rezulton se nuk ka qend\u00ebr t\u00eb rim\u00ebk\u00ebmbjes nga katastrofat (DRC)
  p\u00ebr serverat e sistemeve QKR dhe QKL t\u00eb cil\u00ebt hostohen tek data centeri
  i AKSHI-t, si dhe nuk ka t\u00eb hartuar nj\u00eb plan t\u00eb politikave t\u00eb
  vazhdueshm\u00ebrises s\u00eb biznesit (BCP) dhe dokumentim mbi planin e rim\u00ebk\u00ebmbjes
  nga katastrofa (DRC).\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 3,
  faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n2.1. Rekomandimi:
  QKB, duke marr\u00eb n\u00eb konsiderat\u00eb koh\u00ebn dhe burimet e nevojshme
  t\u00eb marr\u00eb masa p\u00ebr nd\u00ebrtimin dhe hartimin e Planeve t\u00eb Vazhdim\u00ebsis\u00eb
  s\u00eb Institucionit, duke p\u00ebrfshir\u00eb planet p\u00ebr backup dhe rim\u00ebk\u00ebmbjen
  nga katastrofat p\u00ebr sistemet, pajisjet kompjuterike dhe t\u00eb dh\u00ebnat,
  hartimin e planit t\u00eb siguris\u00eb s\u00eb informacionit dhe implementimin
  e tij, duke p\u00ebrfshir\u00eb ndarjen e detyrave/p\u00ebrgjegj\u00ebsive t\u00eb
  siguris\u00eb n\u00eb TIK. Planifikimi dhe testimi i sistemeve TIK t\u00eb kryhet
  n\u00eb p\u00ebrpunhje me k\u00ebrkesat p\u00ebr t\u00eb cilat k\u00ebto sisteme
  nd\u00ebrtohen.\\n\\nMenj\u00ebher\u00eb dhe n\u00eb vijim\u00ebsi\\n\\n3. Gjetje
  nga auditimi: Nga auditimi mbi dokumentimin e regjistrit elektronik t\u00eb Licencave,
  Lejeve dhe Autorizimeve si baz\u00eb t\u00eb dh\u00ebnash shtet\u00ebrore rezulton
  se, ky regjist\u00ebr \u00ebsht\u00eb i pa miratuar me akte ligjore.\\n\\nM\u00eb
  holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n3.1. Rekomandimi: AKSHI t\u00eb marr\u00eb masa p\u00ebr
  nxjerrjen e aktave ligjore p\u00ebr miratimin e Regjistrit elektronik t\u00eb Licencave,
  Lejeve dhe Autorizimeve si autoritet rregullator koordinues, p\u00ebrgjegj\u00ebs
  p\u00ebr p\u00ebrpunimin, p\u00ebrdit\u00ebsimin dhe standardizimin e procedurave
  dhe rregullave p\u00ebr krijuimin, regjistrimin, p\u00ebrfundimin e funksionimit,
  administrimin, nd\u00ebrveprimin dhe sigurin\u00eb e bazave t\u00eb t\u00eb dh\u00ebnave
  shtet\u00ebrore dhe elementeve t\u00eb tjer\u00eb specifike q\u00eb lidhen me k\u00ebto
  procese.\\n\\nMenj\u00ebher\u00eb\\n\\n4. Gjetje nga auditimi: Rregullorja e Teknologjis\u00eb
  s\u00eb Informacionit \u00ebsht\u00eb e pa miratuar, nd\u00ebrkohe q\u00eb Drejtoria
  e Inovacionit dhe Regjistrave e ka mb\u00ebshtetur aktivitetin e saj n\u00eb k\u00ebt\u00eb
  rregullore. Me miratimin dhe futjen n\u00eb fuqi t\u00eb VKM nr. 673, dat\u00eb
  22.11.2017 \u201cP\u00ebr riorganizimin e Agjencis\u00eb Komb\u00ebtare t\u00eb
  Shoq\u00ebris\u00eb s\u00eb Informacionit\u201d, rregulloret e miratuara nga QKB
  nuk jan\u00eb eficente dhe efektive p\u00ebr t\u2019u p\u00ebrdorur dhe do t\u00eb
  duhet t\u2019u n\u00ebnshtrohen nj\u00eb rishikimi t\u00eb holl\u00ebsisht\u00ebm,
  duke reflektuar ndryshimet q\u00eb do t\u00eb ndodhin n\u00eb struktur\u00eb, n\u00eb
  p\u00ebrshtkrimet e pun\u00ebs dhe n\u00eb ndarjen e p\u00ebrgjegj\u00ebsive t\u00eb
  gjithasecilit, p\u00ebr t\u2019u p\u00ebrshtatur me k\u00ebrkesat e k\u00ebsaj VKM-je.
  Drejtoria e Inovacionit dhe Regjistrave n\u00eb QKB \u00ebsht\u00eb nj\u00eb nga
  strukturat q\u00eb preket nga miratimi dhe futja n\u00eb fuqi e VKM-s nr. 673 ku
  sipas s\u00eb cil\u00ebs, stafi TI dhe pajisjet kalojn\u00eb n\u00eb var\u00ebsi
  t\u00eb ASKHI-it.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 3, faze
  nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n4.1. Rekomandimi:
  QKB t\u00eb marr\u00eb masa p\u00ebr hartimin e nj\u00eb Rregulloreje t\u00eb P\u00ebrgjithshme
  mbi Teknologjin\u00eb e Informacionit n\u00eb QKB, n\u00eb t\u00eb cil\u00ebn t\u00eb
  identifikikohen t\u00eb gjitha operacionet TIK n\u00eb institucion, afatet dhe burimet
  e nevojshme p\u00ebr \u00e7do veprimtar. Hartimi i k\u00ebsaj Rregulloreje t\u00eb
  marr\u00eb n\u00eb konsiderat\u00eb t\u00eb gjitha rregulloret e miratuara dhe k\u00ebrkesat
  q\u00eb vijn\u00eb si rezultat i futjes n\u00eb fuqi t\u00eb VKM-s 673, dat\u00eb
  22.11.2018 si dhe legjislacionin e Teknologjis\u00eb, Informacionit dhe Komunikimit
  n\u00eb Shqip\u00ebri.\\n\\nBrenda vitit 2018 dhe n\u00eb vijim\u00ebsi\\n\\n5.
  Gjetje nga auditimi: Nga auditimi lidhur me identifikimin dhe menaxhimin e risqeve
  n\u00eb teknologjin\u00eb e informacionit rezulton se registri i riskut n\u00eb
  QKB nuk \u00ebsht\u00eb i p\u00ebrdit\u00ebsuar (update) me risqet e reja t\u00eb
  brendshme dhe t\u00eb jashtme q\u00eb mund t\u00eb jen\u00eb shfaqur, si dhe nuk
  ka identifikuar ndikimin e k\u00ebtyre risqeve n\u00eb institucion. Regjistri i
  riskut ka t\u00eb pasqyruara t\u00eb nj\u00ebjtat fusha t\u00eb p\u00ebrs\u00ebritura
  p\u00ebr tre vitet e fundit duke e b\u00ebr\u00eb jo efektiv dhe jo eficent reduktimin
  e risqeve, n\u00eb mosp\u00ebrputhje me nenet 19-21 t\u00eb ligjit nr. 10296, dat\u00eb
  08.07.2010, \u201cP\u00ebr menaxhimin financiar dhe kontrollin\u201d, i ndryshuar,
  udh\u00ebzimi nr. 30, dat\u00eb 27.12.2011 \u201cP\u00ebr menaxhimin e aktiveve
  n\u00eb nj\u00ebsit\u00eb e sektorit publik\u201d, i ndryshuar, udh\u00ebzimi nr.
  21, dat\u00eb 25.10.2016 \u201cP\u00ebr n\u00ebpun\u00ebsit zbatues t\u00eb t\u00eb
  gjitha niveleve\u201d, Udh\u00ebzimi i Ministrit t\u00eb Financave nr. 16, dat\u00eb
  20.07.2016 \u201cP\u00ebr p\u00ebrgjegj\u00ebsit\u00eb dhe detyrat e koordinatorit
  t\u00eb menaxhimit financiar dhe kontrollit dhe koordinatorit t\u00eb riskut n\u00eb
  nj\u00ebsit\u00eb publike\u201d.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn
  3, faze nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n5.1.
  Rekomandimi: QKB n\u00eb bashk\u00ebpunim me Drejtoren\u00eb e Inovacionit dhe Regjistrave
  si dhe me strukturat k\u00ebshilluese mbi TIK, t\u00eb marrin masat e nevojshme
  p\u00ebr p\u00ebrdit\u00ebsimin dhe dokumentimin e regjistrit t\u00eb risqeve dhe
  t\u00eb marrin masa p\u00ebr hartimin dhe dokumentimin e nj\u00eb plani veprimi
  p\u00ebr minimizimin/ parandalimin e risqeve t\u00eb identifikuara, si dhe t\u00eb
  b\u00ebhet monitorimi periodik i zbatimit t\u00eb k\u00ebtyre masave.\\n\\n6. Gjetje
  nga auditimi: Nga auditimi mbi veprimet operacionale rezulton se, thjeshtimi i veprimeve
  n\u00eb sportel ka deleguar fluksin tek regjistruesit, q\u00eb aktualisht duhet
  t\u00eb kalojn\u00eb \u00e7do veprim n\u00eb miratim edhe kur rishku \u00ebsht\u00eb
  i ul\u00ebt, ose i pa konsideruesh\u00ebm. N\u00eb nd\u00ebrtimin e sistemeve QKB
  nuk ka marr\u00eb n\u00eb konsiderat\u00eb miratimin e thjesht\u00eb (simple aprove),
  n\u00eb momentin e aplikimit p\u00ebr krijime, apo ndryshime t\u00eb elementeve
  t\u00eb caktuar t\u00eb regjistrit q\u00eb jan\u00eb leht\u00ebsisht t\u00eb verifikuesh\u00ebm
  q\u00eb n\u00eb sportel.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn
  2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n6.1.
  Rekomandimi: QKB t\u00eb analizoj\u00eb nevoj\u00ebn p\u00ebr miratim t\u00eb veprimeve
  operacionale me risk t\u00eb ul\u00ebt, p\u00ebr t\u00eb gjitha llojet e sporteve
  p\u00ebrfshir\u00eb dhe sh\u00ebrbimin online t\u00eb e-albania, p\u00ebr kalimin
  me miratim t\u00eb thjesht\u00eb n\u00eb sportel, n\u00eb funksion t\u00eb nj\u00eb
  menaxhimi m\u00eb t\u00eb mir\u00eb t\u00eb k\u00ebrkesave nga biznesi, si dhe t\u00eb
  burimeve njer\u00ebzore q\u00eb vet\u00eb institucioni disponon.\\n\\nMenj\u00ebher\u00eb\\n\\n7.
  Gjetje nga auditimi: Nga auditimi mbi hartimin e marr\u00ebveshjes p\u00ebr komunikimin
  elektronik rezulton se, nd\u00ebrmjet QKB dhe DPT marr\u00ebveshja p\u00ebr nd\u00ebrveprimin
  e t\u00eb dh\u00ebnav\u00eb, \u00ebsht\u00eb n\u00ebnshkruar pa p\u00ebrfshirjen
  e Autoritetit Rregulator Koordinues, si institucioni p\u00ebrgjegj\u00ebs p\u00ebr
  p\u00ebrpunimin, p\u00ebrdit\u00ebsimin dhe standardizimin e procedurave dhe rregullave
  p\u00ebr kririmin, regjistrimin, p\u00ebrfundimin e funksionimit, administrimin,
  nd\u00ebrveprimin dhe sigurin\u00eb e bazave t\u00eb dh\u00ebnav\u00eb shtet\u00ebrore
  dhe elementeve t\u00eb tjer\u00eb specifike q\u00eb lidhen me k\u00ebto procese
  bazuar n\u00eb nenin 10/pika 1.2 t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010
  \u201cP\u00ebr bazat e t\u00eb dh\u00ebnav\u00eb shtet\u00ebrore\u201d. Gjithashtu,
  nd\u00ebrmjet QKB dhe DPT ende nuk rezulton t\u00eb jet\u00eb zyrtarizuar ndonj\u00eb
  protokoll komunikimi apo nd\u00ebrveprimi t\u00eb dh\u00ebna p\u00ebr leht\u00ebsimin
  e procedurave, konsultimin si dhe leximin n\u00eb m\u00ebnyr\u00eb t\u00eb nd\u00ebrsjell\u00ebt
  n\u00eb zbatim t\u00eb objektit t\u00eb marr\u00ebveshjes neni 3, pika 3.2 n\u00eb
  t\u00eb cil\u00ebn citohet se: \u201c.....n\u00ebp\u00ebrmjet hapave t\u00eb detajuar
  n\u00eb Protokollin e Shk\u00ebmbimit Elektronik i cili \u00ebsht\u00eb pjes\u00eb
  p\u00ebrb\u00ebr\u00ebse e k\u00ebsaj marr\u00ebveshje\u201d.\\n\\nM\u00eb holl\u00ebsisht
  trajtuar n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n7.1. Rekomandimi: Nga ana e QKB dhe DPT t\u00eb merren masa
  p\u00ebr rishikimin e marr\u00ebveshjes me nr. 12420/1, dat\u00eb 07.09.2017 n\u00eb
  lidhje me nd\u00ebrtimin e protokollit t\u00eb komunikimit n\u00eb nj\u00eb koh\u00eb
  sa m\u00eb t\u00eb shkurt\u00ebr, p\u00ebr p\u00ebrmir\u00ebsimin n\u00eb koh\u00eb
  t\u00eb afateve t\u00eb p\u00ebrgjigjes s\u00eb institucioneve tek nj\u00ebri-tjetri,
  si dhe p\u00ebrfshirjen e autoritetit rregulator koordinues n\u00eb rishikimin e
  saj.\\n\\nMenj\u00ebher\u00eb\\n\\n8. Gjetje nga auditimi: Nga auditimi ka rezultuar
  se QKB-s\u00eb, nuk i \u00ebsht\u00eb mund\u00ebsuar leximi i detyrimeve tatimore
  n\u00eb koh\u00eb reale n\u00eb sistemin e DPT, n\u00eb kund\u00ebrshtim me objektin
  e marr\u00ebveshjes me nr. 12420/1, dat\u00eb 07.09.2017. Konkretisht, n\u00eb lidhje
  me leximin e t\u00eb dh\u00ebnav\u00eb n\u00eb DPT p\u00ebr situat\u00ebn aktuale
  tatimore t\u00eb subjekteve q\u00eb aplikojn\u00eb p\u00ebr \u00e7regjistrim, rezulton
  se aplikimet p\u00ebr \u00e7regjistrim nga QKB d\u00ebrgohen n\u00eb koh\u00eb reale
  n\u00eb DPT dhe me shkres\u00eb zyrtare n\u00eb nj\u00ebsit\u00eb vendore. DPT dhe
  nj\u00ebsit\u00eb vendore i p\u00ebrgjigjen k\u00ebrkes\u00ebs s\u00eb QKB n\u00eb
  lidhje me detyrimet e subjektit q\u00eb ka aplikuar p\u00ebr \u00e7regjistrim me
  shkres\u00eb zyrtare dhe jo n\u00ebp\u00ebrmjet sistemit.\\n\\nM\u00eb holl\u00ebsisht
  trajtuar n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n8.1. **Rekomandimi:** DPT, si pal\u00eb n\u00eb marr\u00ebveshjen
  e lidhur me QKB, t\u00eb marr\u00eb masa q\u00eb n\u00eb zbatim t\u00eb marr\u00ebveshjes
  me QKB nr. 12420/1, dat\u00eb 07.09.2017, t\u00eb mund\u00ebsoj\u00eb QKB-s\u00eb,
  n\u00ebp\u00ebrmjet nd\u00ebrveprimit t\u00eb t\u00eb dh\u00ebnave, leximin n\u00eb
  koh\u00eb reale, t\u00eb situat\u00ebs aktuale tatimore.\\n\\n**Menj\u00ebher\u00eb**\\n\\n9.
  **Gjetje nga auditimi:** N\u00eb marr\u00ebveshjen nd\u00ebrmjet pal\u00ebve \u00ebsht\u00eb
  dakord\u00ebsuar q\u00eb kodet NVE (Nace) t\u00eb d\u00ebrgohen elektronikisht nga
  DPT n\u00eb QKB-s\u00eb, t\u00eb azhurnuara n\u00eb rast verifikimi dhe konstatimi
  nga Administrata Tatimore, n\u00eb nj\u00eb koh\u00eb q\u00eb k\u00ebto t\u00eb
  dh\u00ebna n\u00eb Regjistrin Tregtar reflektohen si t\u00eb dh\u00ebna par\u00ebsore
  q\u00eb i p\u00ebrkasin themelimit dhe veprimtaris\u00eb s\u00eb subjekteve tregtare
  kodet NVE (NACE), referuar VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijuimin
  e baz\u00ebs t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs komb\u00ebtare
  t\u00eb regjistrimit, regjistri tregtar\u201d.\\n\\n*M\u00eb holl\u00ebsisht trajtuar
  n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar t\u00eb
  Auditimit.*\\n\\n9.1. **Rekomandimi:** QKB n\u00eb bashk\u00ebpunim me DPT, t\u00eb
  marr\u00eb masa p\u00ebr rishikimin e pik\u00ebs 4.4 t\u00eb Marr\u00ebveshjes me
  nr. 12420/1, dat\u00eb 07.09.2017, n\u00eb t\u00eb cil\u00ebn t\u00eb cil\u00ebsohet
  se e drejta e DPT p\u00ebr kodet NACE \u00ebsht\u00eb reklamimi pran\u00eb QKB,
  i rasteve t\u00eb konstatuara gjat\u00eb kontrolleve n\u00eb terren nga Administrata
  Tatimore, ku ushtrimi i aktivitetit nga ana e subjekteve \u00ebsht\u00eb n\u00eb
  ndryshim nga ai i deklaruar.\\n\\nPasqyrimi i ndryshimit t\u00eb objektit t\u00eb
  veprimtaris\u00eb s\u00eb subjektit (kodi NACE) \u00ebsht\u00eb detyrim i QKB, pasi
  \u00ebsht\u00eb e dh\u00ebn\u00eb par\u00ebsore n\u00eb sistemin e regjistrit t\u00eb
  biznesit, ndryshim i cili nga QKB n\u00ebp\u00ebrmjet nd\u00ebrveprimit t\u00eb
  sistemeve automatikisht ti pasqyrohet DPT-s\u00eb.\\n\\n**Menj\u00ebher\u00eb**\\n\\n10.
  **Gjetje nga auditimi:** Nga auditimi i nd\u00ebrveprimit p\u00ebr element\u00eb
  t\u00eb r\u00ebnd\u00ebsish\u00ebm rezultoi se DPT nuk merr nga QKB t\u00eb dh\u00ebna
  n\u00eb koh\u00eb reale, por n\u00ebp\u00ebrmjet post\u00ebs elektronike me komunikime
  periodike javore p\u00ebr:\\n\\nAplikimet p\u00ebr aktivizim; Fillimin e procedurave
  p\u00ebr likuidim; Bashkim me p\u00ebrthithje; Ndarjen e shoq\u00ebr\u00ebs\u00eb;
  Shnd\u00ebrrimin e shoq\u00ebr\u00ebs\u00eb.\\n\\n10.1. **Rekomandimi:** QKB n\u00eb
  bashk\u00ebpunim me DPT t\u00eb p\u00ebrfshijn\u00eb n\u00eb protokollin e komunikimit
  elektronik dhe t\u00eb realizoj\u00eb shk\u00ebmbimin n\u00eb koh\u00eb reale nd\u00ebrmetjet
  sistemeve, t\u00eb dh\u00ebnat q\u00eb marrin periodikisht, p\u00ebr nj\u00eb pasqyrim
  sa m\u00eb t\u00eb sakt\u00eb dhe n\u00eb nj\u00eb afat t\u00eb shkurta p\u00ebr:
  Aplikimet p\u00ebr aktivizim; Fillimin e procedurave p\u00ebr likuidim; Bashkim
  me p\u00ebrthithje; Ndarjen e shoq\u00ebr\u00ebs\u00eb; Shnd\u00ebrrimin e shoq\u00ebr\u00ebs\u00eb.\\n\\n*Me
  holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.*\\n\\n**Menj\u00ebher\u00eb**\\n\\n11. **Gjetje nga auditimi:**
  Nga trajtimi i incidenteve dhe gabimeve ka rezultuar se, QKB nuk ka t\u00eb dokumentuar
  dhe implementuar nj\u00eb procedur\u00eb t\u00eb standardizuar p\u00ebr kontrollin
  e ndryshimeve n\u00eb infrastruktur\u00eb dhe n\u00eb sistemet e TIK n\u00eb institucion.
  Situata n\u00eb QKB dhe n\u00eb deg\u00ebt rajonale, p\u00ebr periudh\u00ebn n\u00ebn
  auditim, menaxhohet mbi baza ngjarjesh. Gjithashtu, nuk disponohet procedur\u00eb
  p\u00ebr inicimin, rishikimin dhe aprovimin e ndryshimeve, klasifikimin e tyre sipas
  r\u00ebnd\u00ebsis\u00eb, ndarjen e detyrave dhe p\u00ebrgjegj\u00ebsive p\u00ebr
  kryerjen e ndryshimeve (update, upgrade, etj.), struktura kontrolli p\u00ebr verifikimin
  e efektivitetit t\u00eb ndryshimeve t\u00eb kryera, procedura p\u00ebr ndryshimet
  emergjente si dhe dokumentimin e t\u00eb gjith\u00eb procesit t\u00eb ndryshimeve,
  duke p\u00ebrfshir\u00eb dhe incidentet q\u00eb vijn\u00eb nga nd\u00ebrveprimi
  i t\u00eb dh\u00ebnave.\\n\\nNga auditimi rezulton se mungon formati kur \u00e7\u00ebshtja
  hapet nga vet\u00eb punonj\u00ebsit n\u00eb zbatim t\u00eb urdhreve apo vendimeve
  t\u00eb ndryshme q\u00eb jan\u00eb detyrues p\u00ebr zbatim.\\n\\n*Me holl\u00ebsisht
  trajtuar n\u00eb pik\u00ebn 3, faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.*\\n\\n11.1. **Rekomandimi:** QKB t\u00eb marr\u00eb masa organizative
  lidhur me hartimin dhe v\u00ebnien n\u00eb funksion t\u00eb rregullores p\u00ebr
  trajtimin e incidenteve dhe gabime, masave shtes\u00eb, personat p\u00ebrgjegj\u00ebs
  si dhe afatet p\u00ebr ngjarje t\u00eb t\u00eb pa parishikuara, t\u00eb cilat mund
  t\u00eb ndodhin gjat\u00eb pun\u00ebs me veprime operacionale. N\u00eb rregullore
  t\u00eb p\u00ebrfshihen dhe veprimet, q\u00eb vijn\u00eb si rezultat i vendimeve
  t\u00eb ndryshme detyruese p\u00ebr ekzekutim, si dhe ndryshimet q\u00eb ndodhin
  brenda p\u00ebr brenda TIK.\\n\\n**Menj\u00ebher\u00eb**\\n\\n12. **Gjetje nga auditimi:**
  Nga auditimi u konstatuan disa parregullsi n\u00eb inputet e QKL. P\u00ebr vitet
  2015-2017, n\u00eb fush\u00ebn \u201cTipi i Subjektit\u201d, plot\u00ebsimi i fush\u00ebs
  nuk \u00ebsht\u00eb i unifikuar. Sakt\u00ebsisht kjo fush\u00eb \u00ebsht\u00eb
  plot\u00ebsuar me statusin \u201cShoq\u00ebri Aksionare\u201d si dhe \u201cShoq\u00ebri
  Aksionare\u201d. Gjithashtu kjo fush\u00eb \u00ebsht\u00eb plot\u00ebsuar me statusin
  \u201cShoq\u00ebri me p\u00ebrgjegj\u00ebsi t\u00eb kufizuar\u201d si dhe e shkurtuar
  \u201cShpk\u201d. Edhe pse p\u00ebr rastet e cituara, n\u00eb thelb statusi juridik
  mbet\u00ebt i nj\u00ebjt\u00eb, kjo qasje rr\u00ebt mund\u00ebsin\u00eb n\u00eb
  deklarimin e statistikave t\u00eb gabuara nga ana e institucionit t\u00eb Qendr\u00ebs
  Komb\u00ebtare t\u00eb Biznesit.\\n\\n- P\u00ebr vitet 2015-2017, n\u00eb 19 raste
  mosha e aplikantit p\u00ebr marrjen e licenc\u00ebs \u00ebsht\u00eb n\u00ebn 18
  vje\u00e7, pra pa zot\u00ebsi t\u00eb plot\u00eb juridike p\u00ebr t\u00eb vepruar.
  Sakt\u00ebsisht u konstatuan 12 raste p\u00ebr vitin 2015, 6 raste p\u00ebr vitin
  2016 dhe 1 rast p\u00ebr vitin 2017. Gjithashtu n\u00eb 10 raste u konstatua se
  data e lindjes s\u00eb aplikantit i p\u00ebrket s\u00eb ardhmes. Sakt\u00ebsisht
  5 raste p\u00ebr vitin 2015 dhe 5 raste p\u00ebr vitin 2016.\\n\\n- Nj\u00eb pjes\u00eb
  e fushave t\u00eb plot\u00ebsuara kan\u00eb vler\u00ebn \u201cNULL\u201d. Sakt\u00ebsisht
  fushat: \u201cAdresa e e-mail\u201d, \u201cGjinia\u201d, \u201cTechDirector Name\u201d,
  \u201cEconomic Activity\u201d, \u201cDescription of Activity\u201d. Pra fushat nuk
  kan\u00eb t\u00eb dh\u00ebn\u00ebt e k\u00ebrkuara, e p\u00ebr pasoj\u00eb informacioni
  i plot\u00eb p\u00ebr k\u00ebto raste nuk ekziston.\\n\\n- P\u00ebr vitin 2016,
  n\u00eb 3831 raste nga 4095 n\u00eb total, fusha \u201cSasia e paguar\u201d rezulton
  dat\u00eb. Normalisht kjo fush\u00eb duhet t\u00eb jet\u00eb e plot\u00ebsuar me
  vlerat \u201c100\u201d, \u201c50\u201d ose \u201cNULL\u201d.\\n- P\u00ebr vitet
  2015-2018, u konstatua se fusha \u201cNID\u201d nuk \u00ebsht\u00eb plot\u00ebsuar
  gjithnj\u00eb n\u00eb m\u00ebnyr\u00eb korekte, pasi n\u00eb mjaft raste \u00ebsht\u00eb
  plot\u00ebsuar me numrin e let\u00ebrnjoftimit apo numrin e pasaport\u00ebs.\\n-
  P\u00ebr vitet 2015-2018, u konstatuan 241 raste t\u00eb veprimeve t\u00eb dublikuara.
  Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb 33 veprime t\u00eb dublikuara,
  p\u00ebr vitin 2016 rezultojn\u00eb 19 raste, p\u00ebr vitin 2017 rezultojn\u00eb
  122 raste dhe 2018 rezultojn\u00eb 67 raste.\\n\\nM\u00eb holl\u00ebsisht trajtuar
  n\u00eb pik\u00ebn 4, faqe nr. 53-61 t\u00eb Raportit P\u00ebrfundimtar t\u00eb
  Auditimit.\\n\\n12.1. Rekomandimi: QKB t\u00eb marr\u00eb masa p\u00ebr analizimin
  e anomalive t\u00eb konstatuara nga auditimi i inputeve t\u00eb t\u00eb dh\u00ebnave
  n\u00eb QKL, duke p\u00ebrcaktuar p\u00ebrgjegj\u00ebsitet, si dhe t\u00eb marr\u00eb
  masa p\u00ebr krijuimin e kontrolleve parandaluese n\u00eb t\u00eb ardhmen me q\u00ebllim
  regjistrimin, mbajtjen dhe raportimin e sakt\u00eb t\u00eb t\u00eb dh\u00ebnave.\\n\\nQKB
  t\u00eb marr\u00eb masa p\u00ebr p\u00ebrcaktimin e fushave \u201cMandatory fields\u201d,
  apo shtimin n\u00eb k\u00ebt\u00eb kategori t\u00eb fushave t\u00eb p\u00ebrmendura,
  t\u00eb cilat n\u00eb opinion t\u00eb grupit t\u00eb auditimit jan\u00eb t\u00eb
  r\u00ebnd\u00ebsishme p\u00ebr dh\u00ebnien e nj\u00eb pasqyre sa m\u00eb t\u00eb
  plot\u00eb t\u00eb bizneseve.\\n\\nMenj\u00ebher\u00eb dhe n\u00eb vijim\u00ebsi\\n\\n13.
  Gjetje nga auditimi: Nga auditimi u konstatuan disa parregullsi n\u00eb inputet
  e Regjistrit Tregtar. P\u00ebr vitet 2015-2018, u konstatuan 52 raste n\u00eb t\u00eb
  cilat forma ligjore nuk \u00ebsht\u00eb e p\u00ebrcaktuar. Sakt\u00ebsisht p\u00ebr
  vitin 2015 rezultojn\u00eb 18 raste, p\u00ebr vitin 2016 rezultojn\u00eb 13 raste,
  p\u00ebr vitin 2017 rezultojn\u00eb 8 raste dhe 2018 rezultojn\u00eb 13 raste.\\n\\n-
  P\u00ebr vitet 2015-2018, u konstatuan 197 raste n\u00eb t\u00eb cilat fusha \u201cNACE_ID\u201d
  si dhe \u201cNACE_PARENT\u201d nuk jan\u00eb t\u00eb p\u00ebrcaktuara. Sakt\u00ebsisht
  p\u00ebr vitin 2015 rezultojn\u00eb 156 raste, p\u00ebr vitin 2016 rezultojn\u00eb
  7 raste, p\u00ebr vitin 2017 rezultojn\u00eb 26 raste dhe 2018 rezultojn\u00eb 8
  raste.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 4, faqe nr. 53-61
  t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n13.1. Rekomandimi: QKB
  t\u00eb marr\u00eb masa p\u00ebr analizimin e anomalive t\u00eb konstatuara nga
  auditimi i inputeve t\u00eb t\u00eb dh\u00ebnave n\u00eb Regjistrin Tregtar, duke
  p\u00ebrcaktuar p\u00ebrgjegj\u00ebsitet, si dhe t\u00eb marr\u00eb masa p\u00ebr
  krijuimin e kontrolleve parandaluese n\u00eb t\u00eb ardhmen me q\u00ebllim regjistrimin,
  mbajtjen dhe raportimin e sakt\u00eb t\u00eb t\u00eb dh\u00ebnave.\\n\\nMenj\u00ebher\u00eb
  dhe n\u00eb vijim\u00ebsi\\n\\n14. Gjetje nga auditimi: Nga auditimi i menaxhimit
  t\u00eb sh\u00ebrbimeve TIK dhe dh\u00ebnies s\u00eb sportit, ka rezultuar se, n\u00eb
  munges\u00eb t\u00eb struktur\u00ebs/sektorit Help Desk n\u00eb QKB, nuk sigurohet
  menaxhimi i sh\u00ebrbimeve TIK dhe plot\u00ebsimi i k\u00ebrkesave t\u00eb p\u00ebrdoruesve
  t\u00eb institucionit si dhe deg\u00ebve rajonale. Duke par\u00eb r\u00ebnd\u00ebsin\u00eb
  e QKB-s\u00eb, n\u00eb dh\u00ebnien e sh\u00ebrbimeve p\u00ebr biznesin, duhet t\u00eb
  gjendej m\u00ebnyra p\u00ebr dh\u00ebnje sporti, ku t\u00eb p\u00ebrcaktoheshin
  detyrat dhe p\u00ebrgjegj\u00ebsitet e gjithsecilit p\u00ebr t\u00eb garantuar dhe
  siguruar cil\u00ebsin\u00eb e sh\u00ebrbimeve ndaj biznesit dhe qytetar\u00ebve.\\n\\nM\u00eb
  holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 3, faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n14.1. Rekomandimi: QKB, duke marr\u00eb n\u00eb konsiderat\u00eb
  koh\u00ebn dhe burimet e nevojshme, t\u00eb marr\u00eb masa p\u00ebr dh\u00ebnien
  e sportit, p\u00ebr plot\u00ebsimin e k\u00ebrkesave t\u00eb p\u00ebrdoruesve t\u00eb
  institucionit dhe deg\u00ebve rajonale p\u00ebr t\u00eb siguruar cil\u00ebsin\u00eb
  e sh\u00ebrbimeve ndaj biznesit dhe qytetar\u00ebve.\\n\\nN\u00eb vijim\u00ebsi\\n\\n15.
  Gjetje nga auditimi: Mungesa e trajnimeve dhe planifikimi i trajnimeve. Nga auditimi
  i burimeve njer\u00ebzore n\u00eb struktur\u00ebn e TIK dhe menaxhim i kapaciteteve
  t\u00eb personelit q\u00eb ka akses n\u00eb asetet e informacionit t\u00eb QKB n\u00eb
  m\u00ebnyr\u00eb q\u00eb t\u00eb jet\u00eb i vet\u00ebdijsh\u00ebm p\u00ebr rregullat
  dhe standardet e siguris\u00eb dhe t\u00eb jen\u00eb t\u00eb aft\u00eb t\u2019i
  zbatojn\u00eb dhe ndjekin ato gjat\u00eb pun\u00ebs s\u00eb tyre u konstatua se:\\n\\n-
  Drejtoria e Inovacionit dhe Regjistrave ka mungesa n\u00eb personel;\\n- QKB dhe
  Drejtoria e Inovacionit dhe Regjistrave nuk ka nj\u00eb analiz\u00eb t\u00eb nevojave
  p\u00ebr trajnim t\u00eb stafit t\u00eb drejtoris\u00eb dhe nuk ka plan p\u00ebr
  trajnim\u00eb. Stafi i Drejtoris\u00eb s\u00eb Inovacionit dhe Regjistrave nuk ka
  kryer asnj\u00eb dit\u00eb trajnim p\u00ebr sistemet, sigurin\u00eb dhe teknologjin\u00eb
  e informacionit, etj.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 3,
  faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n15.1.
  Rekomandimi: QKB t\u00eb marr\u00eb masa p\u00ebr menaxhimin e burimeve njer\u00ebzore,
  duke plot\u00ebsuar nevojat p\u00ebr trajnime t\u00eb stafit t\u00eb Drejtoris\u00eb
  s\u00eb Inovacionit dhe Regjistrave, si dhe t\u00eb hartoj\u00eb plane dhe politika
  p\u00ebr zhvillimin e trajnimeve n\u00eb lidhje me sistemet, sigurin\u00eb dhe teknologjin\u00eb
  e informacionit.\\n\\nN\u00eb vijim\u00ebsi\\n\\n16. Gjetje nga auditimi: Nga auditimi
  u konstatuan mungesa n\u00eb kapacitetet e server\u00ebve si m\u00eb posht\u00eb:\\n\\n-
  Serverat kan\u00eb munges\u00eb n\u00eb hap\u00ebsirat fizike dhe logjike, duke
  ndikuar n\u00eb performanc\u00ebn dhe mbar\u00ebvajtje e sistemeve, si dhe duke
  rezikuar n\u00eb humbjen e t\u00eb dh\u00ebnave. Transactional backup nuk b\u00ebhet
  p\u00ebr shkak t\u00eb munges\u00ebs s\u00eb hap\u00ebsirave n\u00eb serverin e
  databaz\u00ebs.\\n- Backup-i i sistemit t\u00eb regjistrit t\u00eb biznesit, realizohet
  n\u00eb m\u00ebnyr\u00eb manuale nga punonj\u00ebsit e Drejtoris\u00eb s\u00eb Inovacionit
  dhe Regjistrave.\\n- Disa nga volumet Hdd nuk jan\u00eb t\u00eb konfiguruar n\u00eb
  redundant RAID, gj\u00eb e cila mund t\u00eb sjell\u00eb humbje t\u00eb dh\u00ebnashe
  n\u00eb raste aksidentesh apo n\u00eb raste t\u00eb d\u00ebshtimit t\u00eb nj\u00eb
  Hdd, etj.\\n- Serverat e sistemit QKL p\u00ebr shkak t\u00eb munges\u00ebs s\u00eb
  suportit nga ana e prodhuesit kan\u00eb kaluar n\u00eb status \u201cretired\u201d.\\n-
  Upgrade-imi i SQL Servers n\u00eb versione m\u00eb t\u00eb reja nuk mund t\u00eb
  realizohet, p\u00ebr arsyet\u00eb munges\u00ebs s\u00eb kapaciteteve t\u00eb vet\u00eb
  serverave dhe kushteve t\u00eb tjera optimale, q\u00eb k\u00ebrkohen p\u00ebr t\u00eb
  kaluar n\u00eb versione m\u00eb t\u00eb reja.\\n\\nM\u00eb holl\u00ebsisht trajtuar
  n\u00eb pik\u00ebn 3, faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar t\u00eb
  Auditimit.\\n\\n16.1. Rekomandimi: QKB n\u00eb bashk\u00ebpunim me Drejtorin\u00eb
  e Inovacionit dhe Regjistrave si dhe me strukturat k\u00ebshilluese mbi TIK, t\u00eb
  marrin masa p\u00ebr:\\n\\n- analizimin dhe dokumentimin e situat\u00ebs s\u00eb
  krijuar dhe krijuimin e kushteve optimale mbi rritjen e kapaciteteve (hap\u00ebsirave
  storage) t\u00eb serverave t\u00eb sistemeve p\u00ebr t\u00eb siguruar mbar\u00ebvajtjen
  e sistemeve dhe vazhdimesin\u00eb e ofrimit t\u00eb sh\u00ebrbimeve pa nd\u00ebrprerje;\\n-
  kryerjen backup-it t\u00eb particioneve t\u00eb konsideruara kritike dhe klasifikimin
  e t\u00eb dh\u00ebnave t\u00eb r\u00ebnd\u00ebsishme;\\n- kryerjen e konfigurimeve
  p\u00ebrkat\u00ebse t\u00eb Hdd-ve ose volumeve q\u00eb nuk jan\u00eb t\u00eb konfiguruar
  si redundant RAID.\\n\\nMenj\u00ebher\u00eb dhe n\u00eb vijim\u00ebsi\\n\\n17. Gjetje
  nga auditimi: Nga auditimi i portalit rezultoi se, nuk p\u00ebrdoret nj\u00eb lidhje
  e sigurt (connection security) HTTPS (HyperText Transfer Protocol Secure) (Not secure
  status) q\u00eb do t\u00eb thot\u00eb se serveri i faqes s\u00eb internetit nuk
  p\u00ebrdor nj\u00eb certifikat\u00eb sigurie p\u00ebr t\u00eb v\u00ebrtetuar\\n\\nidentitetin
  e internetit n\u00eb shfletues, si Chrome. N\u00eb munges\u00eb t\u00eb k\u00ebsaj
  certifikate mund t\u00eb ndodh\u00eb humbja e privat\u00ebsis\u00eb, ndryshimit
  t\u00eb informacionit q\u00eb merret ose jepet me an\u00eb t\u00eb k\u00ebtij portali.\\n\\nM\u00eb
  holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 3, faqe nr. 39-53 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n17.1. Rekomandimi: QKB n\u00eb bashk\u00ebpunim me strukturat
  p\u00ebrgjegj\u00ebse p\u00ebr mbar\u00ebvajtjen e faqes web, t\u00eb marrin masa
  p\u00ebr p\u00ebrmir\u00ebsimin e faqes web me element\u00ebt p\u00ebrkat\u00ebs
  t\u00eb siguris\u00eb (certifikat\u00ebn e siguris\u00eb) s\u00eb navigimit online
  p\u00ebr t\u00eb rritur sigurin\u00eb dhe ndihmes\u00ebn ndaj qytetar\u00ebve. T\u00eb
  kihet parasysh q\u00eb n\u00eb t\u00eb ardhmen t\u00eb shtohen element\u00eb inovativ
  n\u00eb faqen web p\u00ebr ta b\u00ebr\u00eb at\u00eb sa m\u00eb interaktive dhe
  ndihm\u00ebse p\u00ebr qytetar\u00ebt.\\n\\nBrenda vittit 2018 dhe n\u00eb vijim\u00ebsi\\n\\n18.
  Gjetje nga auditimi: Nga auditimi mbi diagramat e rrjedh\u00ebs s\u00eb informacionit
  rezulton se, nuk jan\u00eb p\u00ebrshir\u00eb statuset e aplikimit p\u00ebr t\u00eb
  gjitha rastet nga vjen aplikimi, duke qen\u00eb se aplikimet vijn\u00eb jo vet\u00ebm
  nga sporteli, por dhe nga portali e-albania, si dhe hapat q\u00eb duhet t\u00eb
  ndiqen kur:\\n\\nc. Regjistruesi refuzon miratimin e nj\u00eb veprimi duke k\u00ebrkuar
  nga sporteli i QKB t\u00eb b\u00ebhen plot\u00ebsimet e nevojshme.\\n\\nd. Aplikimi
  vjen nga portali qeveritar E-albania\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb
  pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n18.1.
  Rekomandimi: QKB t\u00eb pasqyroj\u00eb veprimet e pa dokumentuara q\u00eb ndodhin
  gjat\u00eb rrjedh\u00ebs s\u00eb informacionit, q\u00eb menaxhohet n\u00ebp\u00ebrmjet
  sistemit, si dhe t\u00eb kryej\u00eb pasqyrimin e ndryshimeve n\u00eb t\u00eb gjith\u00eb
  manualet apo udh\u00ebzuesit q\u00eb disponon p\u00ebr p\u00ebrdorimin e sistemeve.\\n\\nMenj\u00ebher\u00eb\\n\\n19.
  Gjetje nga auditimi: Nga auditimi rezultojn\u00eb t\u00eb pa standardizuar formular\u00ebt
  p\u00ebr 56 sh\u00ebrbime p\u00ebr regjistrin e biznesit, si dhe 6 sh\u00ebrbime
  p\u00ebr regjistrin e Licencave/Lejeve dhe Autorizimeve.\\n\\nM\u00eb holl\u00ebsisht
  trajtuar n\u00eb pik\u00ebn 2, faqe nr. 24-39 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n19.1. Rekomandimi: QKB t\u00eb analizoj\u00eb t\u00eb gjitha
  mund\u00ebsit\u00eb operacionale dhe ato financiare duke renditur grupimin e formular\u00ebve
  nga prioriteti me i lart\u00eb, p\u00ebr standardizimin e formular\u00ebve q\u00eb
  kan\u00eb num\u00ebr t\u00eb madh aplikimesh.\\n\\nN\u00eb vijim\u00ebsi\\n\\n20.
  Gjetje nga Auditimi: Nga auditimi ka rezultuar se komisionet p\u00ebrgjegj\u00ebse
  p\u00ebr mbik\u00ebqyrjen e zbatimit t\u00eb kontratave, nuk kan\u00eb dokumentuar
  kryerjen e matjeve n\u00eb lidhje me cil\u00ebsin\u00eb e sh\u00ebrbimit. Nga strukturat
  p\u00ebrgjegj\u00ebse p\u00ebr mbik\u00ebqyrjen e zbatimit t\u00eb kontrat\u00ebs,
  nuk u paraqit asnj\u00eb dokument, apo e dh\u00ebn\u00eb, ku t\u00eb v\u00ebrtetohej
  se nga ana e tyre \u00ebsht\u00eb p\u00ebrbushur kjo detyr\u00eb. Gjithashtu, ka
  rezultuar se nuk jan\u00eb mbajtur Procesverbale t\u00eb kontrolleve t\u00eb kryera
  p\u00ebr zbatimin e kontrat\u00ebs dhe t\u00eb pranimit t\u00eb sh\u00ebrbimit.\\n\\nM\u00eb
  holl\u00ebsisht trajtuar n\u00eb pik\u00ebn 1, faqe nr. 11-24 t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit.\\n\\n20.1. Rekomandim: QKB, n\u00eb cil\u00ebsin\u00eb e Autoritetit
  Kontraktor, si dhe struktura p\u00ebrgjegj\u00ebse p\u00ebr zbatimin e kontratave
  t\u00eb marrin masa p\u00ebr dokumentimin e t\u00eb gjith\u00eb hapave, kontolleve,
  testimeve t\u00eb kryera gjat\u00eb mbik\u00ebqyrjes s\u00eb zbatimit t\u00eb kontratave.\\n\\nN\u00eb
  vijim\u00ebsi\\n\\n21. Gjetje nga Auditimi: Nga auditimi rezultoi se ka mosp\u00ebrputhje
  midis stafit t\u00eb deklaruar nga operatori ekonomik fitues n\u00eb dokumentet
  tenderit, me stafin i cili realisht ka kryer mir\u00ebmbajtjen e sistemit. Kjo ka
  ndodhur pasi, nga strukturat p\u00ebrgjegj\u00ebse p\u00ebr mbik\u00ebqyrjen e zbatimit
  t\u00eb kontratave, nuk \u00ebsht\u00eb kryer verifikim mbi stafin e kontraktuesit,
  i cili ka kryer mir\u00ebmbajtjen e sh\u00ebrbimit, sipas kontratave p\u00ebrkat\u00ebse.
  Konkretisht, konfirmimin e marr\u00ebdh\u00ebnies s\u00eb pun\u00ebs me kontraktuesin
  si, kontrata pune, formulari E-sig; kapacitetin tekniko-profesional si, diploma
  dhe certifikata, n\u00eb raport me at\u00eb t\u00eb deklaruar n\u00eb DT nga (kontraktuesi),
  me q\u00ebllim marrjen e siguris\u00eb se sh\u00ebrbimi i kontraktuar do t\u00eb
  kryhet me cil\u00ebsi.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb pik\u00ebn
  1, faze nr. 11-24 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n21.1.
  Rekomandimi: QKB n\u00eb cil\u00ebsin\u00eb e Autoritetit Kontraktor, si dhe struktura
  p\u00ebrgjegj\u00ebse p\u00ebr zbatimin e kontrat\u00ebs, duhet t\u00eb marr\u00eb
  masa q\u00eb nga ana e subjektit kontraktues, i cili do t\u00eb realizoj\u00eb MNSH,
  t\u00eb deklarohet p\u00ebrber\u00ebja e stafit q\u00eb do t\u00eb kryej\u00eb mir\u00ebmbajtjen
  e sistemeve TIK, me q\u00ebllim verifikimin e tij, n\u00eb lidhje me marr\u00ebdh\u00ebnien
  e pun\u00ebs me kontraktuesin si dhe kapacitetin tekniko-profesional, n\u00eb raport
  me at\u00eb t\u00eb deklaruar n\u00eb dokumentet e tenderit nga operatori ekonomik
  i shpallur fitues (kontraktuesi).\\n\\nN\u00eb vijim\u00ebsi\\n\\n22. Gjetje nga
  Auditimi: Nga auditimi u konstatua se personeli kompanive kontraktuese, i cili \u00ebsht\u00eb
  caktuar p\u00ebr kryerjen e k\u00ebtij sh\u00ebrbimi, nuk \u00ebsht\u00eb dokumentuar
  ruajtja e konfidencialitetit t\u00eb t\u00eb dh\u00ebnave, pavar\u00ebsisht se n\u00eb
  kontratat e lidhura n\u00eb nenet p\u00ebrkat\u00ebse \u00ebsht\u00eb cil\u00ebsuar
  domosdoshm\u00ebria e ruajtjes s\u00eb t\u00eb dh\u00ebnave nga t\u00eb dy pal\u00ebt.
  Nga k\u00ebqyrja e dokumentacionit rezultoi se, nuk ka asnj\u00eb dokument i cili
  v\u00ebrteton p\u00ebrmbushjen e k\u00ebtij kushti t\u00eb kontratave, nga ana e
  stafit t\u00eb kontraktuesve, t\u00eb cil\u00ebt kan\u00eb akses n\u00eb sistem,
  p\u00ebr shkak t\u00eb detyr\u00ebs.\\n\\nM\u00eb holl\u00ebsisht trajtuar n\u00eb
  pik\u00ebn 1, faze nr. 11-24 t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit.\\n\\n22.1.
  Rekomandimi: QKB, n\u00eb cil\u00ebsin\u00eb e Autoritetit Kontraktor, t\u00eb marr\u00eb
  masa q\u00eb p\u00ebr t\u00eb gjith\u00eb personat e deklaruar nga Kontraktuesi,
  se do t\u00eb jen\u00eb pjes\u00eb e stafit q\u00eb do t\u00eb zbatojn\u00eb Marr\u00ebveshjet
  e Nivelit t\u00eb Sh\u00ebrbimit, t\u00eb k\u00ebrkoj\u00eb t\u00eb paraqesin paraprakisht
  deklarat\u00eb p\u00ebr ruajtjen e konfidencialitetit t\u00eb t\u00eb dh\u00ebnave
  t\u00eb kontraktorit (QKB).\\n\\nN\u00eb vijim\u00ebsi\\n\\nP\u00ebr sa m\u00eb
