  MENU dhe NANOCARE jan\u00eb prodhime t\u00eb Widex A/S\"", "\"Tel: +355 4 2222 411\\n\\nIndeksi
  i \u00c7mimeve t\u00eb Konsumit*\\n\\nJanar,  2017\\n\\nTiran\u00eb, m\u00eb 08
  Shkurt 2017: Indeksi i \u00c7mimeve t\u00eb Konsumit n\u00eb muajin Janar 2017,
  arriti 103,7 kundrejt muajit Dhjetor 2015.\\n\\nN\u00eb muajin Janar 2017 ndryshimi
  vjetor i indeksit t\u00eb \u00e7mimeve t\u00eb konsumit \u00ebsht\u00eb 2,8 %. Nj\u00eb
  vit m\u00eb par\u00eb ky ndryshim ishte 1,5 %.\\n\\nNdikimi i grupeve kryesore n\u00eb
  ndryshimin vjetor t\u00eb indeksit t\u00eb \u00e7mimeve t\u00eb konsumit. Rritja
  vjetore e \u00e7mimeve n\u00eb muajin Janar \u00ebsht\u00eb ndikuar kryesisht nga
  grupi \\\"Ushqime dhe pije joalkoolike\\\" me + 2,33 pik\u00eb p\u00ebrqindje. \u00c7mimet
  e grupit \\\"Transporti\\\" kan\u00eb kontribuar me +1,17 pik\u00eb p\u00ebrqindje.
  \u00c7mimet e grupit \\\"Mallra dhe sh\u00ebrbime t\u00eb ndryshme\\\" kan\u00eb
  kontribuar me +0,15 pik\u00eb p\u00ebrqindje. \u00c7mimet e grupeve \\\"Qira, uj\u00eb,
  l\u00ebnd\u00eb djeg\u00ebse dhe energji\\\"  dhe \\\"Arg\u00ebtim e kultur\u00eb\\\"
  kan\u00eb kontribuar secili me nga + 0,08 pik\u00eb p\u00ebrqindje. \u00c7mimet
  e grupit \\\"Pije alkoolike dhe duhan\\\"  kan\u00eb kontribuar me +0,04\\n\\nP\u00ebr
  publikim 08/02/2017\\n\\npik\u00eb p\u00ebrqindje.  \u00c7mimet e grupeve \\\"Veshje
  dhe k\u00ebpuc\u00eb\\\" dhe \\\"Sh\u00ebrbimi arsimor\\\" kan\u00eb kontribuar
  secili me nga +0,02 pik\u00eb p\u00ebrqindje. \u00c7mimet e grupeve \\\"Komunikimi\\\"
  dhe \\\"Sh\u00ebndeti\\\" kan\u00eb kontribuar secili me nga + 0,01 pik\u00eb p\u00ebrqindje.\\n\\nNdryshimet
  vjetore t\u00eb grupeve kryesore: Krahasuar me muajin Janar 2016, rritja m\u00eb
  e madhe e \u00e7mimeve v\u00ebrehet n\u00eb grupin \\\"Ushqime dhe pije joalkoolike\\\"  me
  5,8 %, pasuar nga grupet  \\\"Mallra dhe sh\u00ebrbime t\u00eb ndryshme\\\" me 3,2
  %,  \\\"Arg\u00ebtim e kultur\u00eb\\\"  me 3,1 %, \\\"Transport\\\" me 2,8 %, \\\"Pije
  alkoolike dhe duhan\\\" me 0,9 %, etj. Brenda grupit t\u00eb ushqimeve \u00e7mimet
  e n\u00ebngrupit  \\\"zarzavate p\u00ebrfshir\u00eb patatet\\\" u rrit\u00ebn me
  24,8 %, pasuar nga n\u00ebngrupet \\\"fruta\\\" me 8,8 %, \\\"sheqer, re\u00e7elna
  e \u00ebmb\u00eblsira\\\" me 6,6 %, \\\"qum\u00ebsht, djath e vez\u00eb\\\" me 4,9
  %, etj.  Nga ana tjeter \u00e7mimet e n\u00ebngrupit \\\"vajra dhe yndyrna\\\" u
  ul\u00ebn me 1,8 %, pasuar nga n\u00ebngrupi \\\"mish\\\" me 0,5 %.\\n\\nNdryshimi
  mujor i indeksit \u00ebsht\u00eb + 1,5 %. Krahasuar me muajin Dhjetor 2016 rritja
  m\u00eb e madhe mujore e \u00e7mimeve v\u00ebrehet n\u00eb grupin \\\"Ushqime dhe
  pije jo alkoolike\\\" me 3,7 %. Ulja m\u00eb e madhe mujore e \u00e7mimeve v\u00ebrehet
  n\u00eb grupin \\\"Veshje dhe k\u00ebpuc\u00eb\\\" me -1,0 %.\\n\\nTab. 1 Indeksi
  i \u00c7mimeve t\u00eb Konsumit\\n\\nDhjetor 2015=100\\n\\nTab. 2  Ndryshimet vjetore
  t\u00eb Indeksit t\u00eb \u00c7mimeve t\u00eb Konsumit\\n\\n%\\n\\nTab. 3  Ndryshimet
  mujore t\u00eb Indeksit t\u00eb \u00c7mimeve t\u00eb Konsumit\\n\\n%\\n\\n|  |  |
  01-16 | 02-16 | 03-16 | 04-16 | 05-16 | 06-16 | 07-15 | 08-16 | 09-16 | 10-16 |
  11-16 | 12-16 | 01-17 |\\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\\n|
  Kodi | Grupet |  |  |  |  |  |  |  |  |  |  |  |  |  |\\n|  | Gjithsej | 0,9 | 1,1
  | 0,4 | -0,4 | -1,2 | -0,6 | 0,1 | 0,9 | 0,3 | -0,2 | 0,1 | 0,9 | 1,5 |\\n\\nSHPJEGIME
  METODOLOGJIKE\\n\\n- Ndryshime metodologjike\\n\\nN\u00eb muajin Janar t\u00eb \u00e7do
  viti, Indeksi i \u00c7mimeve t\u00eb Konsumit shoq\u00ebrohet me disa ndryshime
  t\u00eb bazuara n\u00eb metodologjin\u00eb nd\u00ebrkomb\u00ebtare t\u00eb llogaritjes
  s\u00eb k\u00ebtij treguesi, si m\u00eb posht\u00eb:\\n\\n- Peshat e mallrave dhe
  sh\u00ebrbimeve jan\u00eb ndryshuar duke u bazuar n\u00eb shpenzimet mesatare t\u00eb
  Anket\u00ebs s\u00eb Buxhetit t\u00eb Familjeve 2015.\\n- Lista e mallrave dhe sh\u00ebrbimeve
  \u00ebsht\u00eb  p\u00ebrdit\u00ebsuar, n\u00eb 332 mallra dhe sh\u00ebrbime nga
  333 q\u00eb ishte n\u00eb vitin e kaluar.\\n- P\u00ebrdit\u00ebsimin e list\u00ebs
  tregtare ku mblidhen \u00e7mimet.\\n\\nP\u00ebrkufizime\\n\\nIndeksi i \u00c7mimeve
  t\u00eb Konsumit (I\u00c7K) \u00ebsht\u00eb mat\u00ebsi zyrtar i inflacionit n\u00eb
  Shqip\u00ebri. Indeksi mat ndryshimet relative t\u00eb \u00e7mimeve t\u00eb mallrave
  dhe sh\u00ebrbimeve t\u00eb p\u00ebrdorura nga familjet p\u00ebr konsum vetjak dhe
  llogaritet duke p\u00ebrdorur struktur\u00ebn e konsumit final t\u00eb familjeve
  shqiptare. Burimi kryesor i informacionit p\u00ebr shpenzimet \u00ebsht\u00eb Anketa
  e Buxhetit t\u00eb Familjeve. I\u00c7K n\u00eb vitin t llogaritet me struktur\u00ebn
  e shpenzimeve t\u00eb vitit (t-1)\\n\\nNdryshimi vjetor mat ndryshimin e indeksit
  t\u00eb \u00e7mimeve midis muajit korrent me t\u00eb nj\u00ebjtin muaj t\u00eb vitit
  t\u00eb m\u00ebparsh\u00ebm. Ky ndryshim \u00ebsht\u00eb rrjedhoj\u00eb e ndryshimeve
  korente n\u00eb nivelin e \u00e7mimeve, por mund t\u00eb ndikohet edhe nga efektet
  e pap\u00ebrs\u00ebritshme t\u00eb cilitdo muaj\\n\\nNdryshimi mujor mat ndryshimin
  e indeksit t\u00eb \u00e7mimeve t\u00eb muajit korent me muajin e m\u00ebparsh\u00ebm.
  Ky tregues \u00ebsht\u00eb i ndjesh\u00ebm nga efektet sezonale.\\n\\nNdryshimi
  mesatar 12 mujor mat ndryshimin e indeksit mesatar t\u00eb konsumit n\u00eb 12 muajt
  e fundit me indeksin mesatar t\u00eb 12 muajve t\u00eb m\u00ebparsh\u00ebm.\"",
