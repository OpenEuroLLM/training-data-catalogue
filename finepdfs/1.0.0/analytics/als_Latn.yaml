  zbulojn se personi ka kryer veprime t\u00eb jasht\u00ebligjshme ose Autoriteti Kontraktues
  \u00ebsht\u00eb mjaf\u00eb i pak\u00ebnaqur nga puna e personit\u201d;\\n\\n11.3
