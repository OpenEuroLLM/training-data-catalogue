  2 punonj\u00ebs t\u00eb certifikuar n\u00eb MS-SQL Server, ose ekuiivalent;\\n-
  2 punonj\u00ebs t\u00eb trajnuar p\u00ebr BizTalk Server nga Microsoft ose ekuiivalent;\\n-
  2 punonj\u00ebs t\u00eb trajnuar p\u00ebr platform\u00ebn Webassembler;\\n- 1 menaxher
  projekti certifikuar PMP nga PMI, ose ekuiivalent;\\n\\nNga k\u00ebqyrja e dokumentacionit
