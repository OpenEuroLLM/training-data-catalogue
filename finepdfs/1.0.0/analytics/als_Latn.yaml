  NELAJ\\n\\nVITE DHE INAUGURIME POEZI\\n\\nSHT\u00cbPIA BOTUESE \u00abNAIM FRASH\u00cbRI\u00bb\\n\\nSA
  V\u00cbSHTIR\u00cb\\n\\nPenel\u00ebn poetike e shtriva\\nsi k\u00ebto parcela t\u00eb
  m\u00ebdha t\u00eb pem\u00ebve\\nrreshtat kaq bukur radh\u00eb-radh\u00eb\\nsi rreshtat
  e rimuara t\u00eb nj\u00eb vjershe.\\n\\nDeg\u00ebt n\u00eb dim\u00ebr zbardhur
  nga bora,\\nn\u00eb pranver\u00eb nga lulet e bukura\\nvera i b\u00ebri t''u ulen
  krah\u00ebt\\nnga pesha e r\u00ebnd\u00eb e frutave.\\n\\nNga letra desha t''i nxjerr
  vargjet,\\nl\u00eb t\u00eb sh\u00ebrbejn\u00eb si furka dhe ato,\\nt\u00eb mbajn\u00eb
  krah\u00ebt e k\u00ebtyre pem\u00ebve\\nt\u00eb mos bjer\u00eb asnj\u00eb kok\u00ebrr
  n\u00eb tok\u00eb.\\n\\nNgjyrat e stin\u00ebve derdhen k\u00ebtu\\nme nuanca t\u00eb
  larmishme,\\ne sa v\u00ebshtir\u00eb n\u00eb let\u00ebr t\u00eb hedh\u00ebsh\\nk\u00ebt\u00eb
  peizazh me pemishte.\\n\\n1978\\n\\nNga desha o t\u00ebnd\u00eb e jurave\\nveza
  i p\u00ebrri i njon krah\u00ebt\\nte bluan\u00eb nga jup\u00eb e punkta\\nte m\u00ebsojn\u00eb
  se \u00e7mendun \u00ebg\u00eb porr''\\n\\nN\u00ebs jeta desha ti u xjet av\u00ebjet''\\n\\nME
  AT\u00cb LAPS T\u00cb FUTUR N\u00cb G\u00cbZHOJ\u00cb\\n\\nMe nj\u00eb gisht laps
  kishe nisur t\u00eb shkruaje,\\npartizan i vog\u00ebl, por i madh nga lufta,\\nn\u00eb
  g\u00ebzhoj\u00eb ai laps i vog\u00ebl\\nsi trupi yt i vog\u00ebl i rritur nga pushka.\\n\\nMe
  at\u00eb laps t\u00eb futur n\u00eb g\u00ebzhoj\u00eb\\nderdhe shkronjat porsi flak\u00eb,\\nai
  laps futur n\u00eb g\u00ebzhoj\u00eb-fole p\u00ebr barot,\\nai si plori n\u00eb
  maj\u00ebn e plugut\\nar\u00ebn e dijes p\u00ebr t\u00eb \u00e7ar\u00eb.\\n\\nMe
  at\u00eb laps futur m\u00eb g\u00ebzhoj\u00eb shkrove shum\u00eb.\\nA s\u2019\u00eb
  kan\u00eb nism\u00ebn atje dhe skicat e kombinateve,\\nt\u00eb uzinave, t\u00eb
  qyteteve t\u00eb rinj,\\nshtratat e ndryshuara t\u00eb lumenjve e digat e maleve?\\n\\nMe
  at\u00eb lapsin e futur n\u00eb g\u00ebzhoj\u00eb, partizan i vog\u00ebl,\\nshkrove
  emra shok\u00ebsh t\u00eb r\u00ebn\u00eb n\u00eb ball\u00eb t\u00eb stuhis\u00eb,\\nme
  at\u00eb laps n\u00eb g\u00ebzhoj\u00eb desha t\u2019shkruaj emrin\\nt\u00ebnd un\u00eb
  sot,\\nemrin e novatorit t\u00eb dalluar\\nn\u00eb uzin\u00eb.\\n\\n1979\\n\\nGJER
  N\u00cb PIK\u00cbN E FUNDIT T\u00cb GJAKUT\\n\\nKush s''po pyet p\u00ebr top t''gjermanit\\nLihja,
  motra e Merimanit.\u00b9\\nPopulli\\n\\nNj\u00ebsh me trupin e kumbull\u00ebs n\u00eb
  bah\u00e7e at\u00eb dit\u00eb\\nsht\u00ebpia n\u00ebn bresh\u00ebri predhash; shembje!\\nTundej
  kumbulla nga predhat e artileris\u00eb\\npor Lihja, si shk\u00ebmbi, e paepur.\\n\\nArmiku
  n\u00ebn bresh\u00ebri sht\u00ebpin\u00eb e saj,\\narmiku ta fshinte at\u00eb baz\u00eb
  partizane,\\npor ajo mes dhjetra sht\u00ebpijash n\u00eb fshat\\nngrihej, k\u00ebshtjell\u00eb
  e p\u00ebrjetshme malesh.\\n\\nDeg\u00ebt e kumbull\u00ebs sa shum\u00eb lule t\u00eb
  bardha\\nnd\u00ebrsa lule t\u00eb kuqe n\u00eb trupin e Lihes.\\nDhembjen e shkundi
  kumbulla me petale\\nmbi plag\u00ebt si fasho t''ia vinte.\\n\\nTi, mot\u00ebr e
  Merimanit, ti, shoqe lufte e tij,\\ngjer n\u2019pik\u00ebn e fundit t\u00eb gjakut
  mbete ti,\\nndaj \u00e7do vit lul\u00ebzim i asaj kumbulle\\nsi kuror\u00eb t\u00eb
  p\u00ebrulet me dashuri.\\n\\n1979\\n\\n1) Meriman Braja, d\u00ebshmor, ish-komandant
  i \u00e7et\u00ebs s\u00eb Lum\u00ebs.\\n\\nVITE DHE INAUGURIME\\n\\nDit\u00eb e
  inaugurimit t\u00eb vepr\u00ebs...\\nM\u00eb e plot\u00eb tufa e buz\u00ebqeshjes
  s\u00eb pun\u00ebtor\u00ebve.\\nN\u00eb ballin e tyre \u00e7do vij\u00eb lodhje,
  p\u00ebrleshje,\\nn\u00eb duart e tyre \u00e7do e \u00e7ar\u00eb nga guri, hekuri,
  betoni\\nmbushet me ngroht\u00ebsin\u00eb e k\u00ebsaj dite suksesesh.\\n\\nP\u00ebrpara
  \u2014 vepra;\\naty-dit\u00ebt, net\u00ebt e gdhira, djersa pun\u00ebtore,\\naty-dielli
  i paper\u00ebnduar kurr\u00eb n\u00eb syt\u00eb e saldator\u00ebve.\\n\\nShirit
  i prer\u00eb,\\nshfletim i madh\u00ebshtis\u00eb s\u00eb duarve t\u00eb pun\u00ebs,\\np\u00ebrqaftime,
  urime, p\u00ebrsh\u00ebndetje,\\nhapsir\u00eb e hapur e parashikimeve ku nj\u00eb
  vep\u00ebr tjet\u00ebr,\\nende m\u00eb e madhe,\\nqysh sot nis themelet.\\n\\nVite
  dhe inaugurime.\\nDiga si male t\u00eb rinj,\\nkombine, uzina, q\u00eb derdhin hekur
  e \u00e7elik,\\nfshatra, qytete t\u00eb rinj \u2014\\nec\u00ebn drejt komunizmit
  n\u00ebna Shqip\u00ebri.\"", "\"VENDIM\\n\\nNr. 882, dat\u00eb 12.11.2020\\n\\nP\u00cbR
  MIRATIMIN E LET\u00cbRMARR\u00cbVESHJES S\u00cb GRANTIT NR. TF0B2002, P\u00cbR FINANCIMIN
  SHTES\u00cb ND\u00cbRMJET REPUBLIK\u00cbS S\u00cb SHQIP\u00cbRIS\u00cb DHE BANK\u00cbS
  ND\u00cbRKOMB\u00cbTARE P\u00cbR RIND\u00cbRTIM DHE ZHVILLIM, Q\u00cb VEPRON SI
  ADMINISTRATORE E FONDEVE GRANT T\u00cb SIGURUARA NGA AGJENCIA P\u00cbR ZHVILLIMIN
  E BASHK\u00cbPUNIMIT ND\u00cbRKOMB\u00cbTAR (SIDA), N\u00cbN FONDIN SUEDEZ T\u00cb
  BESIMIT, P\u00cbR PROJEKTIN E SH\u00cbRBIMEVE MJEDISORE N\u00cb SHQIP\u00cbRI\\n\\nN\u00eb
  mb\u00ebshtetje t\u00eb nenit 100 t\u00eb Kushtetut\u00ebs dhe t\u00eb nenit 19,
  t\u00eb ligjit nr. 43/2016, \\\"P\u00ebr marr\u00ebveshjet nd\u00ebrkomb\u00ebtare
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\\\", me propozimin e ministrit t\u00eb
  Financave dhe Ekonomis\u00eb, K\u00ebshilli i Ministrave\\n\\nVENDOSI:\\n\\nMiratimin
  e let\u00ebrmarr\u00ebveshjes s\u00eb grantit nr. TF0B2002, p\u00ebr financimin
  shtes\u00eb nd\u00ebrmjet Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb dhe Bank\u00ebs
  Nd\u00ebrkomb\u00ebtare p\u00ebr Rind\u00ebrtim dhe Zhvillim, q\u00eb vepron si
  administratore e fondeve grant t\u00eb siguruara nga Agjencia p\u00ebr Zhvillimin
  e Bashk\u00ebpunimit Nd\u00ebrkomb\u00ebtar (SIDA), n\u00ebn Fondin Suedez t\u00eb
  Besimit, p\u00ebr projektin e sh\u00ebrbimeve mjedisore n\u00eb Shqip\u00ebri, sipas
  tekstit bashk\u00eblidhur k\u00ebtij vendimi.\\n\\nKy vendim hyn n\u00eb fuqi pas
  botimit n\u00eb Fletoren Zyrtare.\\n\\nKRYEMINIST\u00cbR Edi Rama\\n\\n28 maj 2020\\n\\nSh.S.
  Anila Denaj Minist\u00ebr i Financave dhe Ekonomis\u00eb Ministria e Financave dhe
  Ekonomis\u00eb Tiran\u00eb Republika e Shqip\u00ebris\u00eb\\n\\nProjekti Shqiptar
  i Sh\u00ebrbimeve Mjedisore Fondi Suedez i Besimit nr. TF0B2002 Let\u00ebrmarr\u00ebveshje
  \u2013 Financimi Shtes\u00eb\\n\\nShk\u00eblqesi,\\n\\nN\u00eb p\u00ebrgjigje t\u00eb
  k\u00ebrkes\u00ebs p\u00ebr ndihm\u00eb financiare t\u00eb b\u00ebr\u00eb n\u00eb
  em\u00ebr t\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb (P\u00ebrfituesi),
  dat\u00eb 28 maj 2019, jam e k\u00ebnaqur t''ju informoj se Banka Nd\u00ebrkomb\u00ebtare
  p\u00ebr Rind\u00ebrtim dhe Zhvillim/Zhvillim Nd\u00ebrkomb\u00ebtar (Banka Bot\u00ebrore),
  q\u00eb vepron si administrator i fondeve t\u00eb granteve t\u00eb dh\u00ebna nga
  Agjencia Suedeze p\u00ebr Zhvillim dhe Bashk\u00ebpunim Nd\u00ebrkomb\u00ebtar,
  SIDA (Donatori) n\u00ebn Fondin Suedez t\u00eb Besimit p\u00ebr Fondin e Besimit
  t\u00eb Projektit t\u00eb Sh\u00ebrbimeve Mjedisore n\u00eb Shqip\u00ebri (Fondi
  i Besimit), propozon t\u00eb shtoj\u00eb p\u00ebr P\u00ebrfituesin, Grantin, n\u00eb
  nj\u00eb shum\u00eb q\u00eb nuk duhet t\u00eb kaloj\u00eb dy milion\u00eb dollar\u00eb
  amerikan\u00eb (2,000,000 USD) (Grant), p\u00ebr termat dhe kushtet e p\u00ebrcaktuar
  ose t\u00eb referuar n\u00eb k\u00ebt\u00eb let\u00ebrmarr\u00ebveshje (Marr\u00ebveshja),
  e cila p\u00ebrfshin aneksin bashkangjitur, p\u00ebr t\u00eb ndihmuar p\u00ebr financimin
  e projektit, t\u00eb p\u00ebrshkruar n\u00eb shtojc\u00eb (Projekti).\\n\\nKy Grant
  financohet nga fondi i lartp\u00ebrmendur i besimit p\u00ebr t\u00eb cilin Banka
  Bot\u00ebrore merr kontribute periodike nga Donatori. N\u00eb p\u00ebrputhje me
  seksionin 3.02 t\u00eb Kushteve t\u00eb P\u00ebrcaktuara (si\u00e7 p\u00ebrcaktohet
  n\u00eb shtojc\u00ebn e k\u00ebsaj Marr\u00ebveshjeje), detyrimet e pages\u00ebs
  s\u00eb Bank\u00ebs n\u00eb lidhje me k\u00ebt\u00eb Marr\u00ebveshje jan\u00eb
  t\u00eb kufizuara n\u00eb shum\u00ebn e fondeve t\u00eb v\u00ebna n\u00eb dispozicion
  t\u00eb saj nga Donatori, n\u00ebn fondin e sip\u00ebrp\u00ebrmendur t\u00eb besimit,
  dhe e drejta e P\u00ebrfituesit p\u00ebr t\u00eb t\u00ebrhequr t\u00eb ardhurat
  e Grantit \u00ebsht\u00eb subjekt i disponueshm\u00ebris\u00eb s\u00eb fondeve t\u00eb
  tilla.\\n\\nLutemi konfirmoni Marr\u00ebveshjen nga ana e P\u00ebrfituesit p\u00ebr
  sa m\u00eb sip\u00ebr, duke e n\u00ebnshkruar dhe vendosur dat\u00ebn n\u00eb k\u00ebt\u00eb
  Marr\u00ebveshje n\u00ebp\u00ebrmjet nj\u00eb zyrtari t\u00eb autorizuar nga P\u00ebrfituesi
  dhe kthimin e nj\u00eb kopje t\u00eb n\u00ebnshkruar Bank\u00ebs Bot\u00ebrore.
  Pas marrjes s\u00eb k\u00ebsaj kopjeje t\u00eb n\u00ebnshkruar, kjo Marr\u00ebveshje
  do t\u00eb hyj\u00eb n\u00eb fuqi pas njoftimit nga P\u00ebrfituesi p\u00ebr p\u00ebrfundimin
  e procedurave t\u00eb brendshme.\\n\\nP\u00ebrfituesi p\u00ebrfaq\u00ebson duke
  konfirmuar Marr\u00ebveshjen e tij m\u00eb posht\u00eb, se \u00ebsht\u00eb i autorizuar
  t\u00eb hyj\u00eb n\u00eb k\u00ebt\u00eb Marr\u00ebveshje dhe t\u00eb zbatoj\u00eb
  Projektin, n\u00eb p\u00ebrputhje me termat dhe kushtet e p\u00ebrcaktuar ose t\u00eb
  referuar n\u00eb k\u00ebt\u00eb Marr\u00ebveshje.\\n\\nSinqerisht juaji,\\n\\nBANKA
  ND\u00cbRKOMB\u00cbTARE P\u00cbR RIND\u00cbRTIM DHE ZHVILLIM/SHOQATA P\u00cbR ZHVILLIM
  ND\u00cbRKOMB\u00cbTAR\\n\\nN\u00ebnshkrimi\\n\\nMaryam Salim\\n\\nNga __________________\\n\\nMenaxher
  vendi i Bank\u00ebs Bot\u00ebrore p\u00ebr Shqip\u00ebrin\u00eb, Evrop\u00ebn dhe
  Rajonin e Azis\u00eb Qendrore\\n\\nR\u00ebn\u00eb dakord:\\n\\nREPUBLIKA E SHQIP\u00cbRIS\u00cb\\n\\nN\u00ebnshkrimi\\n\\nNga________________\\n\\nP\u00ebrfaq\u00ebsuesi
  i autorizuar\\n\\nEmri: Anila Denaj\\n\\nTitulli: Minist\u00ebr i Financave dhe
  Ekonomis\u00eb\\n\\nDat\u00eb 15 tetor 2020\\n\\nBashk\u00eblidhur:\\n\\n2. Letra
  e disbursimit dhe e informacionit financiar e s\u00eb nj\u00ebjt\u00ebs dat\u00eb
