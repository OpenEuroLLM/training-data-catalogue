  VKM-ja nr. 1117, dat\u00eb 16.12.2020, \u201cP\u00ebr miratimin e Strategjis\u00eb
  Nd\u00ebrsektoriale t\u00eb Menaxhimit t\u00eb Integruar t\u00eb Kufirit 2021\u20132027
  dhe Planit t\u00eb Veprimit 2021\u20132023\u201d [https://qbz.gov.al/share/E_qMh2nrQ6SGDzoFUWX2qg](https://qbz.gov.al/share/E_qMh2nrQ6SGDzoFUWX2qg)\\n\\ni
  imigrant\u00ebve) dhe integrimi i suksessh\u00ebm i emigrant\u00ebve t\u00eb kthyer,
  jan\u00eb nd\u00ebr objektivat kryesor\u00eb t\u00eb k\u00ebtij dokumenti politik.\u00b9\u00b3\\n\\n**Strategjia
  Kund\u00ebr Krimit t\u00eb Organizuar dhe Krimeve t\u00eb R\u00ebnda, 2021\u20132025**
  - Nj\u00eb pjes\u00eb e \u00e7\u00ebshtjeve t\u00eb migracionit trajtohen edhe n\u00eb
  Strategjin\u00eb Komb\u00ebtare kund\u00ebr Krimit t\u00eb Organizuar dhe Krimeve
  t\u00eb R\u00ebnda nga k\u00ebndv\u00ebshtrimi i luft\u00ebs kund\u00ebr kalimit
  t\u00eb paligjsh\u00ebm t\u00eb kufirit nga emigranti, i njohur ndryshe si kontrabandimi
  i migrant\u00ebve.\u00b9\u2074\\n\\n**Strategjia Komb\u00ebtare e Pun\u00ebsimit
  dhe Aft\u00ebsive 2023\u20132030**\u00b9\u2075 ofron nj\u00eb vler\u00ebsim t\u00eb
  situat\u00ebs s\u00eb migracionit nga k\u00ebndv\u00ebshtrimi i pun\u00ebsimit dhe
  aft\u00ebsive, duke theksuar se plakja e popullsis\u00eb dhe l\u00ebvizjet migratore
  kan\u00eb zgjedhur rritjen e fuqis\u00eb pun\u00ebtore n\u00eb vend. SKPA-ja, n\u00eb
  masat q\u00eb synojn\u00eb t\u00eb realizojn\u00eb vizionin e saj p\u00ebr pun\u00ebsim
  dhe aft\u00ebsi p\u00ebr t\u00eb gjith\u00eb, gjat\u00eb t\u00eb gjith\u00eb jet\u00ebs,
  n\u00eb m\u00ebnyr\u00eb specifike p\u00ebr l\u00ebvizshm\u00ebrin\u00eb e fuqis\u00eb
  pun\u00ebtore, parashikon nd\u00ebrhyrje q\u00eb synojn\u00eb lidhjen me platform\u00ebn
  evropiane t\u00eb zyrave t\u00eb pun\u00ebsimit (EURES), p\u00ebrmir\u00ebsimin
  e kuadrit rregulator p\u00ebr rekrutimin e drejt\u00eb t\u00eb punonj\u00ebsve,
  forcimin e bashk\u00ebpunimit nd\u00ebrmjet zyrave publike dhe private t\u00eb pun\u00ebsimit,
  identifikimin e aft\u00ebsive t\u00eb munguara n\u00eb vend e rajon dhe plot\u00ebsimin
  e tyre n\u00ebp\u00ebrmjet promovimit t\u00eb l\u00ebvizshm\u00ebris\u00eb n\u00eb
  rajonin e Evrop\u00ebs Juglindore.\\n\\n**Strategjia Komb\u00ebtare p\u00ebr Barazin\u00eb
  Gjinore 2021\u20132030** - specifikisht parashikohen nd\u00ebrhyrje p\u00ebr: p\u00ebrmbushjen
  e t\u00eb drejtave ekonomike dhe sociale p\u00ebr grat\u00eb migrante; rritjen e
  aksesit t\u00eb grave migrante n\u00eb sh\u00ebrbime dhe produkte financiare, informimin
  e grave migrante p\u00ebr t\u00eb drejtat pron\u00ebsore; reduktimin e barriarave
  q\u00eb i mbajn\u00eb grat\u00eb, t\u00eb rejet dhe vajzat larg tregut t\u00eb pun\u00ebs,
  si dhe rritjen e aksesit t\u00eb grave, t\u00eb rejave dhe vajzave nga t\u00eb gjitha
  grupet (migrant\u00eb dhe azil\u00ebrk\u00ebues etj.), p\u00ebr pun\u00eb t\u00eb
  denj\u00eb edhe n\u00eb sektor\u00ebt e pun\u00ebsimit jotradicional (n\u00eb ve\u00e7anti
  n\u00eb shkenc\u00eb, teknologji, inxhinieri, matematik\u00eb) dhe p\u00ebrmir\u00ebsimin
  e sh\u00ebrbimeve t\u00eb specializuara mb\u00ebshtet\u00ebse p\u00ebr t\u00eb mbijetuarat
  e dhun\u00ebs me baz\u00eb gjinore, trafikimit dhe shfryt\u00ebzimit seksual, nga
  t\u00eb gjitha grupet e grave (p\u00ebrfsir\u00eb grat\u00eb migrante).\u00b9\u2076\\n\\n###
  3.2 Kuadri ligjor mbi t\u00eb drejtat e t\u00eb huajve n\u00eb Shqip\u00ebri;\\n\\nLegjislacioni
  shqiptar ka nj\u00eb kuad\u00ebr t\u00eb plot\u00eb t\u00eb rregullimi dhe garantimit
  t\u00eb t\u00eb drejtave t\u00eb t\u00eb huajve duke nisur me parashikimet q\u00eb
  n\u00eb ligjet themelore, t\u00eb tilla si **Kushtetuta e Republik\u00ebs s\u00eb
  Shqip\u00ebris\u00eb dhe Kodi i Pun\u00ebs i Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb**,
  i cili rregullon marr\u00ebdh\u00ebniet e punonj\u00ebsve vendas dhe t\u00eb huaj,
  dhe zbatohet nj\u00eblljo si p\u00ebr shtetasit shqiptar\u00eb ashtu edhe p\u00ebr
  t\u00eb huajt, si dhe ligje t\u00eb tjera kryesore, si: ligji nr. 79/2021; \u201cP\u00ebr
  t\u00eb huajt\u201d; ligji nr. 10/2020, \u201cP\u00ebr azilin n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d; ligji nr. 9668, dat\u00eb 18.12.2006, \u201cP\u00ebr
  emigrimin e shtetasve\\n\\n---\\n\\n\u00b9\u00b3 VKM nr. 585 dat\u00eb 22.07.2020
  \u201cP\u00ebr miratimin e Strategjis\u00eb Komb\u00ebtare p\u00ebr Diaspor\u00ebn
  dhe t\u00eb planit t\u00eb veprimit 2021\u20132025\u201d, fq 9 [https://qbz.gov.al/share/VHkJINldSZ6BDDpy9DkjViA](https://qbz.gov.al/share/VHkJINldSZ6BDDpy9DkjViA)\\n\\n\u00b9\u2074
  VKM nr. 1140, dat\u00eb 24.12.2020 \u201cP\u00ebr miratimin e Strategjis\u00eb kund\u00ebr
  Krimit t\u00eb Organizuar dhe Krimeve t\u00eb R\u00ebnda, 2021\u20132025, dhe planin
  e veprimit 2021\u20132022\u201d fq. 10 [https://qbz.gov.al/share/q566V-yvTwyGMvh4GFbTsg](https://qbz.gov.al/share/q566V-yvTwyGMvh4GFbTsg)\\n\\n\u00b9\u2075
  VKM-ja nr. 173, dat\u00eb 24.3.2023, \u201cP\u00ebr miratimin e Strategjis\u00eb
  Komb\u00ebtare t\u00eb Pun\u00ebsimit dhe Aft\u00ebsive 2023\u20132030. Planit t\u00eb
  Veprimit p\u00ebr zbatimin e saj, si dhe Planit t\u00eb Zbatimit t\u00eb Garancis\u00eb
  Rinore 2023\u20132024\u201d [https://qbz.gov.al/share/7-qucOWOQoalGY0HxIOHew](https://qbz.gov.al/share/7-qucOWOQoalGY0HxIOHew)\\n\\n\u00b9\u2076
  VKM nr. 400, dat\u00eb 30.06.2021, \u201cP\u00ebr miratimin e Strategjis\u00eb Komb\u00ebtare
  p\u00ebr Barazin\u00eb Gjinore 2021\u20132030 dhe t\u00eb planit t\u00eb saj t\u00eb
  veprimit\u201d fq 31 [https://qbz.gov.al/share/tktXmfelRC2k4gkz9V4COg](https://qbz.gov.al/share/tktXmfelRC2k4gkz9V4COg)\\n\\nshqiptar\u00eb
  p\u00ebr q\u00ebllime pun\u00ebsimi\u201d; ligji nr. 10221/2020, \u201cP\u00ebr
  mbrojtjen nga diskriminimi\u201d, etj. Nd\u00ebrkohe q\u00eb legjislacioni dyt\u00ebsor
  \u00ebsht\u00eb kuadri rregulator q\u00eb buron nga k\u00ebto akte ligjore, kryesisht
  vendime t\u00eb K\u00ebshillit t\u00eb Ministrave dhe urdhra apo udh\u00ebzime specifike
  q\u00eb rregullojn\u00eb dhe leht\u00ebsojn\u00eb procedurat e q\u00ebndrimit t\u00eb
  ligjsh\u00ebm p\u00ebr t\u00eb gjith\u00eb t\u00eb huajt q\u00eb d\u00ebshirojn\u00eb
  t\u00eb jetojn\u00eb apo punojn\u00eb n\u00eb territorin e Republik\u00ebs s\u00eb
  Shqip\u00ebris\u00eb.\\n\\nLegjislacioni komb\u00ebtar p\u00ebr migracionin, n\u00eb
  p\u00ebrgjith\u00ebsi, pasqyron parimet e konventave nd\u00ebrkomb\u00ebtare p\u00ebr
  t\u00eb drejtat e migrant\u00ebve. Zbatimi i k\u00ebtyre t\u00eb drejtave realizohet
  n\u00ebp\u00ebrmjet disa parimeve t\u00eb p\u00ebrgjithshme si: respektimi i t\u00eb
  drejtave t\u00eb njeriut, mosdiskriminimi, mosn\u00ebnshtrimi ndaj tortur\u00ebs,
  trajtimi apo d\u00ebnimit mizor, \u00e7njerezor apo posht\u00ebrues, parimi i integritetit
  dhe dinjitetit, bashkimit familjar, garantimit t\u00eb kujdesit sh\u00ebndet\u00ebsor,
  arsimimi, integrimi social, etj.\\n\\nLigji \u201cP\u00ebr t\u00eb huajt\u201d \u00ebsht\u00eb
  ligji i ri specifik i cili ka p\u00ebr q\u00ebllim rregullimin e regjimit t\u00eb
  hyrjes, t\u00eb q\u00ebndrimit, t\u00eb pun\u00ebsimit dhe t\u00eb daljes s\u00eb
  t\u00eb huajve n\u00eb/nga Republika e Shqip\u00ebris\u00eb. Ky akt \u00ebsht\u00eb
  n\u00eb p\u00ebrputhje me 18 akte t\u00eb acquis t\u00eb BE-s\u00eb dhe garanton
  se dispozitat e tij p\u00ebrputhen me t\u00eb drejtat dhe lirit\u00eb e p\u00ebrcaktuara
  n\u00eb Kushtetut\u00eb dhe n\u00eb instrumentet nd\u00ebrkomb\u00ebtare t\u00eb
  ratifikuara. Ky ligj \u00ebsht\u00eb i orientuar p\u00ebr t\u00eb siguruar p\u00ebrputhshm\u00ebrin\u00eb
  me parimet si ai i interesit m\u00eb t\u00eb mir\u00eb t\u00eb f\u00ebmij\u00ebs,
  t\u00eb drejt\u00ebs p\u00ebr jet\u00eb familjare, parimin e moskthimit, si dhe
  t\u00eb drejt\u00ebn p\u00ebr procedura t\u00eb drejta dhe transparente. Synimi
  i tij \u00ebsht\u00eb p\u00ebrmir\u00ebsimi i mbrojtjes p\u00ebr migrant\u00ebt
  dhe an\u00ebtar\u00ebt e familjes s\u00eb tyre, refugjat\u00ebt dhe azilk\u00ebrkuar\u00eb.
  Ligji gjithashtu garanton t\u00eb drejt\u00ebn p\u00ebr q\u00ebndrim dhe pun\u00ebsim
  t\u00eb ligjsh\u00ebm n\u00eb Shqip\u00ebri, p\u00ebrmes lejeve t\u00eb q\u00ebndrimit
  dhe lejeve unike t\u00eb kategorizuara, ofron akses n\u00eb programe dhe sh\u00ebrbime
  integrimi, ndihmon n\u00eb ofrimin e informacionit dhe procedurave t\u00eb thjeshtuara
  p\u00ebr dokumente, dhe sigurimin e dokumenteve sipas standardeve nd\u00ebrkomb\u00ebtare.
  Ligji gjithashtu parashikon t\u00eb drejt\u00ebn e ankimit t\u00eb rrug\u00eb administrative
  sipas legjislacionit n\u00eb fuqi.\\n\\nRisit\u00eb e ligjit t\u00eb ri p\u00ebr
  t\u00eb huajt fokusohen n\u00eb p\u00ebrmir\u00ebsimin e mekanizmave t\u00eb nevojsh\u00ebm
  p\u00ebr l\u00ebshimin e vizave elektronike on-line, duke synuar zgjidhjen e problematikave
  t\u00eb ndeshura gjat\u00eb zbatimit t\u00eb ligjit t\u00eb m\u00ebparsh\u00ebm
  lidhur me pamund\u00ebsin\u00eb p\u00ebr t\u00eb mbuluar shum\u00eb vende me misione
  diplomatike apo poste konsullore. Ligji i ri plot\u00ebson nj\u00eb nga mang\u00ebsit\u00eb
  e legjislacionit t\u00eb m\u00ebparsh\u00ebm p\u00ebr t\u00eb huajt, duke integruar
  pajisjen me leje unike, e cila garanton nj\u00eb procedur\u00eb t\u00eb vetme t\u00eb
  aplikimit p\u00ebr t\u00eb huajt, q\u00eb kan\u00eb p\u00ebr q\u00ebllim t\u00eb
  punojn\u00eb dhe t\u00eb q\u00ebndrojn\u00eb n\u00eb territorin e Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb. Gjithashtu, Ligji synon p\u00ebrmir\u00ebsimin e dispozitave
  t\u00eb lidhura me \u00e7\u00ebshtjen e pun\u00ebsimit t\u00eb shtetasve t\u00eb
  huaj n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, duke qart\u00ebsuar afatet\\n\\n---\\n\\n17
  Shih Strategjin\u00eb Komb\u00ebtare p\u00ebr Migracionin 2024\u20132030, fq 3.\\n18
  Shih po aty, fq 3.\\n19 Neni 1 i Ligjit Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr
  t\u00eb huajt\u201d; https://qbz.gov.al/share/h6NNRj6cQMey7WFNnu7wng\\n20 Kreu IV,
  Q\u00ebndrimi n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, Ligji Nr. 79 dat\u00eb
  18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d; https://qbz.gov.al/share/h6NNRj6cQMey7WFNnu7wng\\n\\nkohore
  dhe procedurat p\u00ebr t\u00eb u pajasur me leje unike, si dhe duke reduktuar pengesat
  e panevojshme p\u00ebr pun\u00ebsimin e shtetasve t\u00eb huaj n\u00eb territorin
  e Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb.\\\\(^{21}\\\\)\\n\\nNd\u00ebr t\u00eb
  tjer\u00eb, n\u00ebp\u00ebrmjet dispozitave t\u00eb t\u00eb k\u00ebtij ligji jan\u00eb
  shtuar kategoria e t\u00eb huajve p\u00ebr t\u00eb u pajasur me leje q\u00ebndrimi
  t\u00eb cil\u00ebt kan\u00eb hasur v\u00ebshtir\u00ebsi n\u00eb t\u00eb shkuar\u00ebn
  p\u00ebr t\u00eb q\u00ebndruar n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, si
  m\u00eb posht\u00eb vijon:\\n\\n- Leje q\u00ebndrimi p\u00ebr personat pa shtetas\u00eb,
  duke garantuar nj\u00eb q\u00ebndrim t\u00eb ligjsh\u00ebm p\u00ebr k\u00ebt\u00eb
  kategori;\\n- Leje q\u00ebndrimi p\u00ebr pensionist\u00eb, leje e cila do t\u00eb
  mbuloj\u00eb nj\u00eb hendek t\u00eb ligjit aktual p\u00ebr t\u00eb huajt, duke
  u siguruar shtetasve t\u00eb huaj q\u00eb jan\u00eb n\u00eb pension n\u00eb vendin
  e tyre, mund\u00ebsin\u00eb p\u00ebr t\u00eb aplikuar p\u00ebr nj\u00eb leje q\u00ebndrimi
  p\u00ebr pensionist\u00eb, pran\u00eb autoritetit p\u00ebrgjegj\u00ebs p\u00ebr
  kufirin dhe migracionin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, n\u00ebse
  preferojn\u00eb vendin ton\u00eb si nj\u00eb destinacion p\u00ebr t\u00eb jetuar;\\n-
  Leje q\u00ebndrimi p\u00ebr punonj\u00ebs l\u00ebviz\u00ebs, t\u00eb cil\u00ebt
  jan\u00eb shtetasit e huaj q\u00eb punonjn\u00eb n\u00eb vende t\u00eb ndryshme,
  jo n\u00eb nj\u00eb zyr\u00eb apo seli t\u00eb institucionit, dhe puna e tyre kryesisht
  \u00ebsht\u00eb puna l\u00ebviz\u00ebse ku mjet kryesor pun\u00eb kan\u00eb mjetet
  e teknologjis\u00eb s\u00eb informacionit;\\n- Leje q\u00ebndrimi e p\u00ebrkohshme
  p\u00ebr p\u00ebrdorim t\u00eb pasuris\u00eb s\u00eb paluajtshme n\u00eb pron\u00ebsi
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, procedurat dhe kriteret e s\u00eb
  cil\u00ebs p\u00ebrcaktohen me vendim t\u00eb K\u00ebshillit t\u00eb Ministrave.\\\\(^{22}\\\\)\\n\\nLigji
  p\u00ebr t\u00eb huajt ka parashikuar lejen e q\u00ebndrimit, kart\u00ebn blu, bazuar
  n\u00eb direktiv\u00ebn 2009/52/KE, t\u00eb Parlamentit Evropian dhe t\u00eb K\u00ebshillit,
  dat\u00eb 18 qershor 2009, \u201cMbi parashikimin e standardeve minimale t\u00eb
  sanksioneve dhe masave ndaj pun\u00ebdh\u00ebn\u00ebsve t\u00eb shtetasve t\u00eb
  vendeve t\u00eb treta q\u00eb q\u00ebndrojn\u00eb n\u00eb m\u00ebnyr\u00eb t\u00eb
  paligjshme\u201d. Karta Blu e BE-s\u00eb sh\u00ebrben si leje pune dhe q\u00ebndrimi
  p\u00ebr shtetasit e vendeve jo an\u00ebtar\u00eb t\u00eb Bashkimit Evropian me
  kualifikim t\u00eb lart\u00eb, gj\u00eb q\u00eb u lejon atyre t\u00eb jetojn\u00eb
  dhe punojn\u00eb n\u00eb Bashkimin Evropian. Kjo kart\u00eb \u00ebsht\u00eb krijuar
  p\u00ebr t\u00eb t\u00ebrhequr n\u00eb BE profesionist\u00eb me kualifikim t\u00eb
  lart\u00eb nga vendet jo an\u00ebtare t\u00eb BE-s\u00eb, duke thjeshtuar procesin
  dhe duke p\u00ebrmir\u00ebsuar statusin e tyre ligjor.\\n\\nMe direktiv\u00ebn (BE)
  2021/1883 t\u00eb Parlamentit Evropian dhe K\u00ebshillit, e dat\u00ebs 20 tetor
  2021 \\\"Mbi kushtet e hyrjes dhe q\u00ebndrimit t\u00eb shtetasve t\u00eb vendeve
  t\u00eb treta p\u00ebr q\u00ebllime pun\u00ebsimi me kualifikim t\u00eb lart\u00eb\\\",
  leja e q\u00ebndrimit q\u00eb njihet si karta blu n\u00eb Bashkimin Evropian p\u00ebsoi
  ndryshime. Sipas k\u00ebsaj direktive parashikohen kushte m\u00eb fleksib\u00ebl
  pranimi p\u00ebr pun\u00ebtor\u00ebt e huaj t\u00eb kualifikuar, vesan\u00ebrisht
  p\u00ebr sa i p\u00ebrket pragut t\u00eb pag\u00ebs minimale, t\u00eb drejtave t\u00eb
  zgjeruara, kushteve m\u00eb t\u00eb favorshme p\u00ebr bashkim familjar dhe mund\u00ebsis\u00eb
  p\u00ebr t\u00eb udh\u00ebtuar dhe punuar m\u00eb leht\u00eb n\u00eb shtetet e tjera
  an\u00ebtare t\u00eb BE-s\u00eb. Sipas screening report p\u00ebr vitin 2023 evidentohet
  se \u2018n\u00eb fush\u00ebn e migracionit t\u00eb ligjsh\u00ebm jan\u00eb t\u00eb
  nevojshme ndryshime, vesan\u00ebrisht p\u00ebr t\u00eb\\n\\n\\\\(^{21}\\\\) Shih
  relacionin pwr projektitgjin \u201cP\u00ebr t\u00eb huajt\u201d, https://kuvendiwebfiles.blob.core.windows.net/webfiles/20210214210347/RELACION%20-%20TE%20HUAJT.pdf\\n\\n\\\\(^{22}\\\\)
  Shih relacionin pwr projektitgjin \u201cP\u00ebr t\u00eb huajt\u201d, https://kuvendiwebfiles.blob.core.windows.net/webfiles/20210214210347/RELACION%20-%20TE%20HUAJT.pdf\\n\\np\u00ebrfaqruar
  disa dispozita mbi bashkimin familjar, me lejen e vetme (single permit) dhe me ndryshimet
  e fundit n\u00eb kart\u00ebn blu t\u00eb BE-s\u00eb.23\\n\\nN\u00eb lidhje me aktet
  n\u00ebnligjore q\u00eb burojn\u00eb nga ky ligj, ato rregullojn\u00eb detajet e
  migracionit t\u00eb rregullt dhe t\u00eb parregullt. Konkretisht, Vendimi i K\u00ebshillit
  t\u00eb Ministrave nr. 858, dat\u00eb 29.12.202124, p\u00ebrcakton rregullat p\u00ebr
  kriteret, procedurat dhe dokumentacionin e nevojsh\u00ebm p\u00ebr hyrjen dhe q\u00ebndrimin
  e ligjsh\u00ebm t\u00eb t\u00eb huajve n\u00eb Shqip\u00ebri. Ky vendim lejon pajisjen
  me leje q\u00ebndrimi apo leje unike n\u00eb Shqip\u00ebri, sipas motiveve dhe q\u00ebllimeve
  t\u00eb aplikimit. Vendimi nr. 857, dat\u00eb 29.12.202125, si nj\u00eb bashk\u00eb
  propozim nga Ministria e Brendshme, Ministria p\u00ebr Evrop\u00ebn dhe Pun\u00ebt
  e Jashtme, dhe Ministria e Financave dhe Ekonomis\u00eb, miratoi ngritjen e Regjistrit
  Elektronik Komb\u00ebtar p\u00ebr t\u00eb Huajt (REKH) n\u00eb Shqip\u00ebri. Ky
  regjist\u00ebr do t\u00eb mbledh\u00eb dhe p\u00ebrdit\u00ebson t\u00eb dh\u00ebnat
  p\u00ebr shtetasit e huaj dhe p\u00ebr personat me q\u00ebndrim t\u00eb parregullt
  n\u00eb territorin shqiptar, duke ofruar informacion p\u00ebr t\u00eb huajt q\u00eb
  kan\u00eb viz\u00eb, leje q\u00ebndrimi, leje unike dhe ata me q\u00ebndrim t\u00eb
  parregullt. Udh\u00ebzimet e Ministrit t\u00eb Brendsh\u00ebm dhe t\u00eb Ministrit
  p\u00ebr Evrop\u00ebn dhe Pun\u00ebt e Jashtme p\u00ebrftoshin\u00eb trajtimin e
  t\u00eb huajve t\u00eb parregullt, sigurimin e asistenc\u00ebs n\u00eb transit dhe
  organizimin e operacioneve t\u00eb kthimit n\u00eb rrug\u00eb ajrove, n\u00eb p\u00ebrpunhje
  me direktivat p\u00ebrkat\u00ebse.26\\n\\nVendimi i K\u00ebshillit t\u00eb Ministrave
  Nr. 159 dat\u00eb 17.03.202327 \u00ebsht\u00eb akti normativ p\u00ebr miratimin
  e form\u00ebs dhe p\u00ebrmbajtjes s\u00eb dokumentit t\u00eb udh\u00ebtimit p\u00ebr
  t\u00eb huajt pa shtet\u00ebsi, t\u00eb dokumentit t\u00eb udh\u00ebtimit, lejes
  s\u00eb kalimit, t\u00eb dokumentit t\u00eb p\u00ebrkohsh\u00ebm, dublikat\u00ebs
  s\u00eb lejes s\u00eb q\u00ebndrimit e t\u00eb lejes unike, si dhe t\u00eb let\u00ebrmjoftimit
  p\u00ebr t\u00eb huajt. Nd\u00ebrkoh\u00eb, Vendimi nr. 450 dat\u00eb 29.06.2022
  p\u00ebrcakton form\u00ebn dhe p\u00ebrmbajtjen e lejeve t\u00eb q\u00ebndrimit
  p\u00ebr t\u00eb huajt.28\\n\\nShum\u00eb akte t\u00eb tjera n\u00ebnligjore jan\u00eb
  miratuar p\u00ebr t\u00eb rregulluar bashk\u00ebpunimin e strukturave p\u00ebrkat\u00ebse
  t\u00eb migracionit dhe p\u00ebr t\u00eb p\u00ebrcaktuar procedurat p\u00ebr zgjatjen
  e afatit t\u00eb q\u00ebndrimit, regjistrimin n\u00eb autoritetet lokale p\u00ebr
  kufirin dhe migracionin, si dhe p\u00ebr pajisjen me dokumente t\u00eb ndryshme
  n\u00eb rast humbjeje apo d\u00ebmtimi.\\n\\n---\\n\\n23 Screening report 2023 https://neighbourhood-enlargement.ec.europa.eu/document/download/b83313ef-48c5-4bef-9f00-f5d66509572e_en?filename=AL%20Cluster_1%20Draft%20screening%20report_external%20version.pdf\\n24
  VKM Nr. 858 dat\u00eb 29.12.2021 \u201cP\u00ebr p\u00ebrcaktimin e kriterieve, t\u00eb
  procedurave e t\u00eb dokumentacionit p\u00ebr hyrjen, q\u00ebndrimin dhe trajimin
  e t\u00eb huajve n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d e ndryshuar
  https://qbz.gov.al/share/jkg1P7KaQSOm92Qf53f6mg\\n25 Vendim Nr. 857, Dat\u00eb 29.12.2021
  P\u00ebr Ngritjen dhe Funksionimin e Regjistrit Elektronik Komb\u00ebtar p\u00ebr
  t\u00eb Huajt n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, https://qbz.gov.al/share/duXrYVKUTjSQXOpKkWz0tw\\n26
  Shih Strategjin\u00eb Komb\u00ebtare p\u00ebr Migracionin 2024\u20132030, fq 4.\\n27
  VKM nr. 159 dat\u00eb 17.03.2023 P\u00ebr miratimin e form\u00ebs e t\u00eb p\u00ebrmbajtjes
  s\u00eb dokumentit t\u00eb udh\u00ebtimit p\u00ebr t\u00eb huajt pa shtet\u00ebsi,
  t\u00eb dokumentit t\u00eb udh\u00ebtimit, lejes s\u00eb kalimit, t\u00eb dokumentit
  t\u00eb p\u00ebrkohsh\u00ebm, dublikat\u00ebs s\u00eb lejes s\u00eb q\u00ebndrimit
  e t\u00eb lejes unike, si dhe t\u00eb let\u00ebrmjoftimit p\u00ebr t\u00eb huajt;
  https://qbz.gov.al/share/6hrR2i9TSvaDlwvKO2uCiA\\n28 VKM nr. 450 dat\u00eb 29.06.2022
  P\u00ebr miratimin e form\u00ebs dhe t\u00eb p\u00ebrmbajtjes s\u00eb lejeve t\u00eb
  q\u00ebndrimit p\u00ebr t\u00eb huajt, https://qbz.gov.al/share/u8mswoaDSee9hPPMxW5puw\\n\\nN\u00eb
  lidhje me zvog\u00eblimin e pashtet\u00ebsis\u00eb, \u00ebsht\u00eb miratuar **Udh\u00ebzimi
  i Ministrit t\u00eb Brendsh\u00ebm nr. 87, dat\u00eb 21.6.2023**\\\\(^{29}\\\\),
  p\u00ebr dokumentacionin dhe procedur\u00ebn e aplikimit p\u00ebr shpalljen e statusit
  t\u00eb pashtet\u00ebsis\u00eb. Ky udh\u00ebzim synon dh\u00ebnien e statusit t\u00eb
  pashtet\u00ebsis\u00eb p\u00ebr individ\u00eb q\u00eb e k\u00ebrkojn\u00eb k\u00ebt\u00eb
  status, p\u00ebr t\u00eb garantuar t\u00eb drejtat dhe lirit\u00eb themelore. Personat
  pa shtet\u00ebsi mund t\u00eb aplikojn\u00eb p\u00ebr leje q\u00ebndrimi p\u00ebr
  personat pa shtet\u00ebsi, leje humanitare dhe dokument udh\u00ebtimi p\u00ebr k\u00ebt\u00eb
  kategori, sipas legjislacionit n\u00eb fuqi. Dokumenti i udh\u00ebtitimit lejon
  udh\u00ebtimin dhe rikthimin n\u00eb Shqip\u00ebri p\u00ebr nj\u00eb periudh\u00eb
  2-vje\u00e7are. Udh\u00ebzimi \u00ebsht\u00eb hartuar n\u00eb p\u00ebrpunje me standardet
  nd\u00ebrkomb\u00ebtare dhe praktikat m\u00eb t\u00eb mira, t\u00eb ngjashme me
  procedurat p\u00ebr p\u00ebrcaktimin e statusit t\u00eb refugjat\u00ebve. Ai p\u00ebrfshin
  garancit\u00eb procedurale p\u00ebr drejt\u00ebsi dhe transparenc\u00eb, si intervist\u00eb,
  ndihm\u00eb me p\u00ebrkthim, afatin p\u00ebr marrjen e vendimit, t\u00eb drejt\u00ebn
  p\u00ebr t\u00eb marr\u00eb vendimin n\u00eb form\u00eb t\u00eb shkruar dhe t\u00eb
  drejt\u00ebn e ankimit. Procedurat p\u00ebr p\u00ebrcaktimin e pashtet\u00ebsis\u00eb
  gjithashtu marrin parasysh nevojat e ve\u00e7anta t\u00eb aplikant\u00ebve, ve\u00e7an\u00ebrisht
  p\u00ebr ata q\u00eb jan\u00eb t\u00eb mitur ose me aft\u00ebsi t\u00eb kufizuara,
  duke siguruar nj\u00eb pjes\u00ebmarrje t\u00eb barabart\u00eb n\u00eb procedura.\\n\\nEdhe
  **Ligji Nr. 10 2021**, \u201cP\u00ebr azilin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d\\\\(^{30}\\\\),
  si nj\u00eb akt ligjor i p\u00ebrfaqruar me Sistemin e P\u00ebrbashk\u00ebt Evropian
  t\u00eb Azilit apo konventat nd\u00ebrkomb\u00ebtare, n\u00eb dispozitat e tij parashikon
  si t\u00eb drejt\u00eb themelore t\u00eb drejt\u00ebn p\u00ebr azil, p\u00ebr t\u00eb
  gjith\u00eb shtetasit e huaj ose personat pa shtet\u00ebsi, t\u00eb cil\u00ebt ndodhen
  jasht\u00eb territorit t\u00eb vendbanimit t\u00eb tyre, por p\u00ebr arsyje objektive
  si: frika e persekutimit p\u00ebr shkak t\u00eb rac\u00ebs, besimit fetar, komb\u00ebs\u00ebs,
  an\u00ebtar\u00ebsis\u00eb n\u00eb nj\u00eb grup t\u00eb caktuar apo t\u00eb bindjes
  politike, nuk k\u00ebrkojn\u00eb mbrojtjen e atij vendi. Nd\u00ebr parimet kryesore
  ku bazohet ky ligj, diktuar dhe nga Konventa e Gjenev\u00ebs, vlen t\u00eb p\u00ebrmbendet
  parimi i moskthimit, nd\u00ebrkohe q\u00eb respektimi i t\u00eb drejtave dhe lirive
  themelore t\u00eb sanksionuara dhe nga konventat e tjera nd\u00ebrkomb\u00ebtare,
  ndalimi i d\u00ebbimit, e drejta p\u00ebr lirin\u00eb nga tortura dhe trajtimi mizor,
  \u00e7nj\u00ebr\u00ebzor dhe degradues, e drejta e procedurave dhe garancive ligjore
  p\u00ebr ndihm\u00ebn juridike falas nga shteti, e drejta p\u00ebr kushtet minimale
  t\u00eb jet\u00ebs\u00ebs, p\u00ebr kujdes sh\u00ebndet\u00ebsor, p\u00ebr arsimim,
  p\u00ebr pun\u00ebsim dhe trajnim\u00eb profesionale, e drejta p\u00ebr bashkim
  familjar, p\u00ebr t\u00eb pasur nj\u00eb p\u00ebrkthyes, apo dhe e drejta e ankimit,
  mbeten kryejfala e k\u00ebtij Ligji.\\\\(^{31}\\\\)\\n\\nN\u00eb p\u00ebrmbushje
  t\u00eb angazhimeve nd\u00ebrkomb\u00ebtare t\u00eb Shqip\u00ebris\u00eb n\u00eb
  fush\u00ebn e mbrojtjes, Ligji nr. 10/2021, \u201cP\u00ebr azilin n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d, p\u00ebrcakton kushtet p\u00ebr dh\u00ebnien e formave
  t\u00eb ndryshme t\u00eb mbrojtjes p\u00ebr azilk\u00ebrkesuesit, duke p\u00ebrfshir\u00eb
  statusin e refugjatit, mbrojtjen plot\u00ebsuese dhe t\u00eb p\u00ebrkohshme. Miratimi
  i ligjit ka p\u00ebrfaqruar kuadrin shqiptar t\u00eb mbrojtjes me standardet e p\u00ebrcaktuara
  n\u00eb Sistemin e P\u00ebrbashk\u00ebt Evropian t\u00eb Azilit (CEAS). Ligji p\u00ebrcakton
  procedur\u00ebn p\u00ebr shqyrtimin e k\u00ebrkesave p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare,
  duke k\u00ebrkuar q\u00eb t\u00eb ekzistojn\u00eb kushtet e duhura p\u00ebr nj\u00eb
  vler\u00ebsim gjith\u00ebp\u00ebrfsir\u00ebs t\u00eb arsyeve p\u00ebr dh\u00ebnien
  e statusit t\u00eb refugjatit ose njohjen e statusit t\u00eb mbrojtjes plot\u00ebsuese
  dhe vendosjen e afatve kohore p\u00ebr shqyrtimin e k\u00ebrkes\u00ebs. P\u00ebrcaktohen
  nocionet \u201cvend i sigurt i origjin\u00ebs\u201d, \u201cvend i tret\u00eb i sigurt\u201d,\\n\\n---\\n\\n\\\\(^{29}\\\\)
  Udh\u00ebzim Nr. 87, Dat\u00eb 21.6.2023 Mbi Dokumentacionin dhe Procedur\u00ebn
  p\u00ebr Aplikimin, Vler\u00ebsimin, Miratimin dhe Refuzimin e K\u00ebrkes\u00ebs
  p\u00ebr Shpalljen e Statusit t\u00eb Pashtet\u00ebsis\u00eb, https://qbz.gov.al/share/KjQwHywSRiyMlszwGFQkNw\\n\\n\\\\(^{30}\\\\)
  Ligji Nr. 10/2021 \u201cP\u00ebr Azilin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d,
  https://qbz.gov.al/share/4XpgKg6lSds_MIJgzKakmQ\\n\\n\\\\(^{31}\\\\) Shih Strategjin\u00eb
  Komb\u00ebtare p\u00ebr Migracionin 2024-2030, fq 4.\\n\\n\u201cprocedur\u00eb e
  p\u00ebrshtejtuar\u201d dhe \u201caplikime duksh\u00ebm t\u00eb pabazuara\u201d.
  P\u00ebrshkruhen rr\u00ebthanat n\u00eb t\u00eb cilat nj\u00eb person humb statusin
  e mbrojtjes nd\u00ebrkomb\u00ebtare.\\\\(^{32}\\\\)\\n\\nLigji p\u00ebrcakton se
  n\u00eb cilat kushte mund t\u00eb kufizohet liria e l\u00ebvizjes s\u00eb aplikantit
  ose mund t\u00eb kryhet largimi i tij/saj nga territori i vendit. Parashikohen masa
  t\u00eb dedikuara p\u00ebr t\u00eb p\u00ebrballuar nj\u00eb trajtim t\u00eb ve\u00e7ant\u00eb
  p\u00ebr personat q\u00eb i p\u00ebrkaqsin kategoris\u00eb s\u00eb ve\u00e7ant\u00eb,
  t\u00eb p\u00ebrcaktuar p\u00ebrmes vler\u00ebsimit individual. N\u00eb ve\u00e7anti,
  t\u00eb miturve t\u00eb pashoq\u00ebruar duhet t\u2019u caktohet nj\u00eb kujdestar
  dhe t\u2019u ofrohet strehim dhe kujdes i specializuar. Ligji p\u00ebrcakton t\u00eb
  drejtat dhe detyrimet e aplikant\u00ebve p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare,
  refugjat\u00ebve dhe p\u00ebrfituesve t\u00eb mbrojtjes plot\u00ebsuese. Brenda
  dy viteve nga marrja e mbrojtjes, refugjat\u00ebt dhe personat q\u00eb g\u00ebzojn\u00eb
  mbrojtje plot\u00ebsuese kan\u00eb t\u00eb drejt\u00eb p\u00ebr bashkim familjar
  n\u00ebse mund t\u00eb d\u00ebshmojn\u00eb se kan\u00eb strehim t\u00eb duhur, t\u00eb
  ardhura t\u00eb q\u00ebndrueshme dhe sigurim s\u00ebmundjeje.\\\\(^{33}\\\\)\\n\\nP\u00ebr
  ofrimin e zgjidhjeve t\u00eb q\u00ebndrueshme p\u00ebr migrant\u00ebt dhe garantimin
  e q\u00ebndrimit afatgjat\u00eb p\u00ebrmes shtet\u00ebsis\u00eb shqiptare. **Ligji
  nr. 113/2020 \u201cP\u00ebr Shtet\u00ebsin\u00eb\u201d**\\\\(^{34}\\\\) ofron baz\u00ebn
  ligjore. Ky llig mund\u00ebson fitimin e shtet\u00ebsis\u00eb shqiptare sipas kategoriave
  dhe kushteve p\u00ebrkat\u00ebse (me lindje, origjin\u00eb, natyralizim, bir\u00ebsim,
  apo interes komb\u00ebtar n\u00eb fush\u00ebn e arsimit, shkenc\u00ebs, artit, kultur\u00ebs,
  ekonomis\u00eb, sportit). Ligji \u00ebsht\u00eb ndryshuar n\u00eb korrik 2023 p\u00ebr
  t\u00eb mund\u00ebsuar fitimin e shtet\u00ebsis\u00eb shqiptare p\u00ebr mes natyralizimit
  t\u00eb f\u00ebmij\u00ebve t\u00eb mitur t\u00eb shtetasve shqiptar\u00eb, edhe
  n\u00ebse nuk p\u00ebrmbushin kushtet p\u00ebr njohuri t\u00eb gjuh\u00ebs dhe historis\u00eb
  s\u00eb Shqip\u00ebris\u00eb. Ndryshimet gjithashtu synojn\u00eb mbrojtjen e interesit
  m\u00eb t\u00eb lart\u00eb t\u00eb f\u00ebmij\u00ebve dhe leht\u00ebsimin e bashkimit
  familjar, duke p\u00ebrjashtuar k\u00ebrkes\u00ebn p\u00ebr nj\u00eb periudh\u00eb
  q\u00ebndrimi t\u00eb vazhduesh\u00ebm 7-vje\u00e7ar dhe p\u00ebr vler\u00ebsimin
  e njohurive t\u00eb gjuh\u00ebs shqipe dhe historis\u00eb s\u00eb Shqip\u00ebris\u00eb.\\n\\nNj\u00eb
  ndryshim tjet\u00ebr lligor \u00ebsht\u00eb b\u00ebr\u00eb p\u00ebr t\u00eb mund\u00ebsuar
  p\u00ebrrthihjen e talenteve t\u00eb rinj q\u00eb nuk kan\u00eb mbushur mosh\u00ebn
  18 vje\u00e7are n\u00eb fushat e interesit komb\u00ebtar, duke ulur kufirin e mosh\u00ebs
  p\u00ebr fitimin e shtet\u00ebsis\u00eb shqiptare n\u00ebp\u00ebrmjet programeve
  t\u00eb ve\u00e7anta t\u00eb shtet\u00ebsis\u00eb.\\n\\n**Ligji \u201cP\u00ebr mbrojtjen
  nga diskriminimi\u201d**\\\\(^{35}\\\\) rregullon zbatimin e parimit t\u00eb barazis\u00eb
  dhe mosdiskriminimit p\u00ebr t\u00eb gjitha grupet e parashikuara n\u00eb t\u00eb.
  Ky llig garanton mbrojtje t\u00eb barabart\u00eb nga lligji, barazi mund\u00ebsish
  dhe shanseve p\u00ebr ushtrimin e t\u00eb drejtave dhe pjes\u00ebmarrjen n\u00eb
  jet\u00ebn publike, si dhe mbrojtje efektive nga diskriminimi. Ai zbatohet p\u00ebr
  t\u00eb gjith\u00eb personat q\u00eb jetojn\u00eb dhe q\u00ebndrojn\u00eb n\u00eb
  territorin e Shqip\u00ebris\u00eb, p\u00ebrfshir\u00eb migrant\u00ebt e rregullt
  dhe t\u00eb parregullt.\\n\\nNdryshimet e miratuara n\u00eb **Ligjin \u201cP\u00ebr
  vet\u00ebqeverisjen vendore\u201d**\\\\(^{36}\\\\) i ngarkuan nj\u00ebsive t\u00eb
  vet\u00ebqeverisjes vendore (NJVV) p\u00ebrgjegj\u00ebsi shtes\u00eb duke k\u00ebrkuar
  ngritjen e nj\u00eb nj\u00ebsie t\u00eb posa\u00e7me p\u00ebr diaspor\u00ebn dhe
  migracionin. Funksionet e k\u00ebsaj strukture p\u00ebrfshijn\u00eb ofrimin e mb\u00ebshtetjes,\\n\\n---\\n\\n\\\\(^{32}\\\\)
  Shih Strategjin\u00eb Komb\u00ebtare p\u00ebr Migracionin 2024-2030, fq 4.\\n\\n\\\\(^{33}\\\\)
  Shih Strategjin\u00eb Komb\u00ebtare p\u00ebr Migracionin 2024-2030., fq 4.\\n\\n\\\\(^{34}\\\\)
  Ligji Nr. 113/2020 \u201cP\u00ebr Shtet\u00ebsin\u00eb\u201d, i ndryshuar [https://qbz.gov.al/share/oTsG6arSRnCEU4gQ_6l7WQ](https://qbz.gov.al/share/oTsG6arSRnCEU4gQ_6l7WQ)\\n\\n\\\\(^{35}\\\\)
  Ligji Nr.10 221, Dat\u00eb 4.2.2010 \u201cP\u00ebr Mbrotjen nga Diskriminimi\u201d
  (Ndryshuar me Ligjin Nr. 124/2020, Dat\u00eb 15.10.2020) [https://qbz.gov.al/share/HdHbRxBRcqILh6wR3FvWQ](https://qbz.gov.al/share/HdHbRxBRcqILh6wR3FvWQ)\\n\\n\\\\(^{36}\\\\)
  Ligji Nr. 139/2015 \u201cP\u00ebr Vet\u00ebqeverisjen Vendore\u201d (Ndryshuar me
  ligjin nr. 38/2019, dat\u00eb 20.6.2019), [https://qbz.gov.al/share/2-vAvQMyRkaPVz83F_eifg](https://qbz.gov.al/share/2-vAvQMyRkaPVz83F_eifg)\\n\\nInformacionit
  dhe sh\u00ebrbimeve p\u00ebr migrant\u00ebt n\u00eb lidhje me mund\u00ebsit\u00eb
  e investimit si dhe riintegrimin social t\u00eb migrant\u00ebve t\u00eb kthyer.
  Nj\u00eb funksion tjet\u00ebr i NJVV-ve ka t\u00eb b\u00ebj\u00eb me mbajtjen e
  komunikimit t\u00eb vazhduesh\u00ebm me emigrant\u00ebt dhe diaspor\u00ebn n\u00ebp\u00ebrmjet
  aktiviteteve t\u00eb ndryshme t\u00eb organizuara brenda dhe jasht\u00eb vendit.
  NJVV-t\u00eb k\u00ebrkohet t\u00eb koordinojn\u00eb veprimtarin\u00eb e tyre me
  ministrit\u00eb p\u00ebrgjegj\u00ebse p\u00ebr migracionin dhe pun\u00ebt e jashtme
  p\u00ebr t\u00eb siguruar informacion dhe mb\u00ebshtetje p\u00ebr \u00e7\u00ebshtjet
  q\u00eb lidhen me migracionin dhe diaspor\u00ebn.\\n\\nN\u00eb shkurt t\u00eb vitit
  2024, Kuvendi i Shqip\u00ebris\u00eb ka mirtauar Ligjin nr. 20/2024 \u201cP\u00ebr
  ratifikimin e protokollit nd\u00ebrmjet K\u00ebshillit t\u00eb Ministrave t\u00eb
  Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb dhe qeveris\u00eb s\u00eb Republik\u00ebs
  Italiane p\u00ebr forcimin e bashk\u00ebpunimit n\u00eb fush\u00ebn e migracionit\u201d\\\\(^{37}\\\\),
  Protokoli p\u00ebr Migracionin e cili ishte miratuar nga K\u00ebshilli i Ministrave
  me vendimin nr. 622, dat\u00eb 06.11.2013\\\\(^{38}\\\\), \u00ebsht\u00eb n\u00ebnshkruar
  n\u00eb t\u00eb nj\u00ebjt\u00ebn dat\u00eb nga kryeministrat respektiv\u00eb n\u00eb
  Rom\u00eb, Itali. Protokoli p\u00ebr Migracionin ka p\u00ebr q\u00ebllim forcimin
  e bashk\u00ebpunimit dypal\u00ebsh p\u00ebr menaxhimin e flukseve migratore nga
  vendet e treta n\u00eb p\u00ebrpunhje me t\u00eb drejt\u00ebn nd\u00ebrkomb\u00ebtare
  dhe at\u00eb evropiane. Sipas tij, pala shqiptare i njeh pal\u00ebs italiane t\u00eb
  drejt\u00ebn e p\u00ebrdorimit t\u00eb disa pronave t\u00eb paluajtshme n\u00eb
  pron\u00ebsi t\u00eb shtetit (zona), pa kund\u00ebrshp\u00ebrblim, p\u00ebr t\u00eb
  gjith\u00eb koh\u00ebzgjatjen e Protokollit p\u00ebr Migracionin, i cili do t\u00eb
  mbetet n\u00eb fuqi p\u00ebr pes\u00eb vjet, me t\u00eb drejt\u00eb rinovimi, n\u00eb
  form\u00eb t\u00eb heshtur, p\u00ebr nj\u00eb periudh\u00eb tjet\u00ebr pes\u00ebvjecare.
  Nd\u00ebrsa, pala italiane n\u00eb k\u00ebto zona mund t\u00eb krijoj\u00eb struktur\u00eb
  p\u00ebr pritjen e migrant\u00ebve, t\u00eb cil\u00ebt nuk kan\u00eb t\u00eb drejt\u00eb
  hyrjeje dhe q\u00ebndrimi n\u00eb shtetin italian dhe numri i tyre nuk mund t\u00eb
  jet\u00eb m\u00eb i lart\u00eb se 3 000 veta. K\u00ebto struktura do t\u00eb menaxhohen
  nga autoritetet italiane, sipas legjislacionit italian dhe evropian dhe mosmarr\u00ebveshjet
  q\u00eb mund t\u00eb lindin nd\u00ebrmjet autoriteteve italiane dhe migrant\u00ebve
  q\u00eb do t\u00eb akomodohen n\u00eb to, do t\u2019i n\u00ebnshtrohen ekskluzivisht
  juridikcionit italian.\\n\\nMe depozitimin fillimi t\u00eb projektligjit p\u00ebr
  ratifikimin e protokollit, ky protokoll solli polemika t\u00eb shumta duke b\u00ebr\u00eb
  q\u00eb 30 deputet\u00eb t\u00eb Kuvendit t\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb,
  t\u00eb drejtohen Gjykat\u00ebs Kushtetuese p\u00ebr deklarimin t\u00eb papajtuesh\u00ebm
  me Kushtetut\u00ebn t\u00eb Protokollit. Gjykata Kushtetuese me Vendimin nr. 2 dat\u00eb
  29.01.2024\\\\(^{39}\\\\) ka vendosur se Protokoli p\u00ebr Migracionin nuk \u00ebsht\u00eb
  territorial\u00eb t\u00eb Shqip\u00ebris\u00eb dhe nuk prek integritetin e saj territorial,
  pasi nuk ka t\u00eb b\u00ebj\u00eb me ndonj\u00eb ndryshim fizik t\u00eb territorit.
  N\u00eb dy zonat ku Protokollit zbatohet, do t\u00eb veprojn\u00eb e drejta shqiptare,
  krahas asaj italiane. Gjykata theksoi se e drejta nd\u00ebrkomb\u00ebtare p\u00ebr
  \u00e7\u00ebshtjet e migracionit dhe azilit \u00ebsht\u00eb e zbatueshme edhe nga
  autoritetet italiane, pasi t\u00eb dy shtetet kan\u00eb ratifikuar marr\u00ebveshjet
  p\u00ebrkat\u00ebse. P\u00ebr m\u00eb tep\u00ebr, Gjykata n\u00ebnvizoi se Shqip\u00ebria
  mban p\u00ebrgjegj\u00ebsi p\u00ebr Protokollin, bazuar n\u00eb normat kushtetuese
  dhe detyrimet nd\u00ebrkomb\u00ebtare. N\u00eb aspektin e t\u00eb drejtave dhe lirive
  t\u00eb njeriut, ekziston nj\u00eb juridiksjon i dyfisht\u00eb, ku autoritetet italiane
  dhe shqiptare kan\u00eb p\u00ebrgjegj\u00ebsi t\u00eb p\u00ebrbashk\u00ebta, dhe
  prania e juridikcionit italian n\u00eb zonat e caktuara nuk p\u00ebrjashton at\u00eb
  shqiptar.\\n\\n---\\n\\n\\\\(^{37}\\\\) Ligjin nr. 20 dat\u00eb 22.02.2024 \u201cP\u00ebr
  ratifikimin e protokollit nd\u00ebrmjet K\u00ebshillit t\u00eb Ministrave t\u00eb
  Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb dhe qeveris\u00eb s\u00eb Republik\u00ebs
  Italiane p\u00ebr forcimin e bashk\u00ebpunimit n\u00eb fush\u00ebn e migracionit\u201d
  https://qzb.gov.al/share/fsz4ugARQLqB8bvsyfHmaw\\n\\n\\\\(^{38}\\\\) VKM nr. 622/2013
  \u201cP\u00ebr miratimin, n\u00eb parim, t\u00eb Protokollit nd\u00ebrmjet K\u00ebshillit
  t\u00eb Ministrave t\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb dhe Qeveris\u00eb
  s\u00eb Republik\u00ebs Italiane p\u00ebr forcimin e bashk\u00ebpunimit n\u00eb
  fush\u00ebn e migracionit\u201d\\n\\n\\\\(^{39}\\\\) Vendim nr. 2 dat\u00eb 29.01.2024
  (V-2/24), Gjykata Kushtetuese e Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb https://www.gjk.gov.al/include_php/previewdoc.php?id_kerkesa_vendimi=3990&nr_vendim=1\\n\\n3.3
  Standardet nd\u00ebrkomb\u00ebtare dhe evropiane\\n\\n3.3.1 Standardet nd\u00ebrkomb\u00ebtare
  sipas Kombeve t\u00eb Bashkuara\\n\\nMenaxhimi i duhur i migracionit mbetet nj\u00eb
  prioritet kryesor edhe p\u00ebr perspektiv\u00ebn e integrimit t\u00eb vendit n\u00eb
  BE. P\u00ebr gjith\u00ebsish, Shqip\u00ebria vazhdon t\u00eb jet\u00eb nj\u00eb
  vend origjine p\u00ebr migrant\u00ebt ekonomik\u00eb, por \u00ebsht\u00eb gjithashtu
  nj\u00eb vend tranziti dhe destinacioni p\u00ebr migrant\u00ebt ekonomik\u00eb,
  azil\u00ebk\u00ebrkuar\u00eb dhe refugiat\u00ebt. Shqip\u00ebria ka nj\u00eb kuad\u00ebr
  ligjor t\u00eb plot\u00eb sa i takon garantimit t\u00eb t\u00eb drejtave t\u00eb
  migrant\u00ebve, ku p\u00ebrfshihet dhe zbatimi i t\u00eb drejtave themelore p\u00ebr
  pun\u00ebtor\u00ebt migrant\u00eb dhe an\u00ebtar\u00ebt e familjeve t\u00eb tyre,
  t\u00eb cilat mbrohen n\u00ebp\u00ebrmjet dispozitave t\u00eb kuadrit ligjor komb\u00ebtar
  dhe konventave nd\u00ebrkomb\u00ebtare t\u00eb ratifikuara nga Shqip\u00ebria, ve\u00e7an\u00ebrisht
  instrumenteve, t\u00eb tilla si:\\n\\n- Deklarata Universale e t\u00eb Drejtave
  t\u00eb Njeriut;\\n- Konventa Nd\u00ebrkomb\u00ebtare p\u00ebr Mbrojtjen e t\u00eb
  Drejtave t\u00eb t\u00eb gjith\u00eb Pun\u00ebtor\u00ebve Migrant\u00eb dhe An\u00ebtar\u00ebve
  t\u00eb Familjes s\u00eb tyre (ICRMW);\\n- Konventa e Organizat\u00ebs Nd\u00ebrkomb\u00ebtare
  t\u00eb Pun\u00ebs (ILO) nr. 97 dhe nr. 143;\\n- Konventa p\u00ebr t\u00eb Drejtat
  e F\u00ebmij\u00ebs (CRC);\\n- Pakti Nd\u00ebrkomb\u00ebtar p\u00ebr t\u00eb Drejtat
  Civile dhe Politike (ICCPR);\\n- Pakti Nd\u00ebrkomb\u00ebtar p\u00ebr t\u00eb Drejtat
  Ekonomike, Sociale dhe Kulturore (ICESCR);\\n- Konventa e vitit 1951 mbi Statusin
  e Refugiat\u00ebve dhe protokoll i saj i vitit 1967;\\n- Konventa p\u00ebr Statusin
  e Personave pa Shtet\u00ebsi;\\n- Konventa mbi Zvog\u00eblimin e Pashtet\u00ebsis\u00eb;\\n-
  Kompakti Global p\u00ebr migracionin;\\n- Strategjia e BE-s\u00eb p\u00ebr Kthimin
  Vullnetar dhe Riintegrimin.\\n\\n**Deklarata Universale e t\u00eb Drejtave t\u00eb
  Njeriut** - Deklarata Universale e t\u00eb Drejtave t\u00eb Njeriut (DUDNJ) parashikon
  q\u00eb t\u00eb gjith\u00eb individ\u00ebt, pavar\u00ebsisht nga komb\u00ebsia apo
  statusi, p\u00ebrfshir\u00eb t\u00eb huajt dhe refugiat\u00ebt, kan\u00eb t\u00eb
  drejt\u00ebn e trajtimit t\u00eb barabart\u00eb dhe t\u00eb mbrojtjes nga diskriminimi.
  Neni 14 thekson t\u00eb drejt\u00ebn e individ\u00ebve p\u00ebr t\u00eb k\u00ebrkuar
  dhe p\u00ebr t\u00eb g\u00ebzuar azil nga persektutimi n\u00eb vende t\u00eb tjera.
  Gjithashtu, neni 13 garanton lirin\u00eb e l\u00ebvizjes dhe t\u00eb zgjedhjes s\u00eb
  vendbanimit brenda \u00e7do shteti, si dhe t\u00eb drejt\u00ebn p\u00ebr t''u larguar
  nga \u00e7do vend, p\u00ebrfshir\u00eb vendin e vet, dhe p\u00ebr t''u kthyer n\u00eb
  t\u00eb. K\u00ebto parashikime mb\u00ebshtesin mbrojtjen e refugiat\u00ebve dhe
  t\u00eb huajve, duke u siguruar atyre t\u00eb drejta themelore, pavar\u00ebsisht
  nga statusi juridik.\\\\(^{40}\\\\)\\n\\n**Konventa Nd\u00ebrkomb\u00ebtare p\u00ebr
  Mbrojtjen e t\u00eb Drejtave t\u00eb t\u00eb gjith\u00eb Pun\u00ebtor\u00ebve Migrant\u00eb
  dhe An\u00ebtar\u00ebve t\u00eb Familjes s\u00eb tyre (ICRMW)**\\\\(^{41}\\\\) -
  e miratuar nga Kombet e Bashkuara n\u00eb vitin 1990, synon t\u00eb mbroj\u00eb
  t\u00eb drejtat e pun\u00ebtor\u00ebve migrant\u00eb dhe t\u00eb an\u00ebtar\u00ebve
  t\u00eb familjeve t\u00eb tyre, pavar\u00ebsisht nga statusi i tyre ligjor. Ajo
  garanton t\u00eb drejta themelore si mbrojtja nga\\n\\n---\\n\\n\\\\(^{40}\\\\)
  Deklarata Universale e t\u00eb Drejtave t\u00eb Njeriut - [https://kmd.al/wp-content/uploads/2018/05/1524735491-DEKLARATA-UNIVERSALE-E-TE-DREJTAVE-TE-NJERIUT.pdf](https://kmd.al/wp-content/uploads/2018/05/1524735491-DEKLARATA-UNIVERSALE-E-TE-DREJTAVE-TE-NJERIUT.pdf)\\n\\n\\\\(^{41}\\\\)
  Ligji Nr.9703, dat\u00eb 2.4.2007 \u201cP\u00ebr aferimin e Republik\u00ebs s\u00eb
  Shqip\u00ebris\u00eb n\u00eb Konvent\u00ebn Nd\u00ebrkomb\u00ebtare \u201cP\u00ebr
  mbrojtjen e t\u00eb drejtave t\u00eb t\u00eb gjith\u00eb pun\u00ebtor\u00ebve migrant\u00eb
  dhe an\u00ebtar\u00ebve t\u00eb familjeve t\u00eb tyre\u201d [https://qzb.gov.al/share/48J_m76XR6eJNMCKk6Xdrw](https://qzb.gov.al/share/48J_m76XR6eJNMCKk6Xdrw)\\n\\ndiskriminimi,
  trajtimi i drejt\u00eb n\u00eb kushte pun\u00eb, t\u00eb drejt\u00ebn p\u00ebr qasje
  n\u00eb kujdes sh\u00ebndet\u00ebsor, arsim dhe sh\u00ebrbime sociale. Konventa
  gjithashtu k\u00ebrkon q\u00eb shtetet t\u00eb promovojn\u00eb mir\u00ebqenien e
  pun\u00ebtor\u00ebve migrant\u00eb dhe familjeve t\u00eb tyre, si dhe t\u00eb sigurojn\u00eb
  respektimin e dinjitetit dhe t\u00eb drejtave t\u00eb tyre njer\u00ebzore n\u00eb
  t\u00eb gjitha fazat e migracionit. Kjo konvent\u00eb nxiti trajtim t\u00eb drejt\u00eb
  dhe dinjitoz p\u00ebr pun\u00ebtor\u00ebt migrant\u00eb, duke njohur kontributin
  e tyre n\u00eb shoq\u00ebrit\u00eb prit\u00ebse dhe ato t\u00eb origjin\u00ebs.\\n\\n**Konventa
  e Organizat\u00ebs Nd\u00ebrkomb\u00ebtare t\u00eb Pun\u00ebs (ILO) nr. 97 dhe nr.
  143** - jan\u00eb dy instrumente nd\u00ebrkomb\u00ebtare q\u00eb synojn\u00eb t\u00eb
  mbrojn\u00eb t\u00eb drejtat e pun\u00ebtor\u00ebve migrant\u00eb dhe t\u00eb promovojn\u00eb
  menaxhimin e drejt\u00eb t\u00eb migracionit t\u00eb pun\u00ebs. **Konventa nr.
  97**\\\\(^{42}\\\\), e miratuar n\u00eb vitin 1949, ka p\u00ebr q\u00ebllim sigurimin
  e mbrojtjes p\u00ebr pun\u00ebtor\u00ebt migrant\u00eb. Ajo parashikon q\u00eb pun\u00ebtor\u00ebt
  migrant\u00eb t\u00eb trajtohen n\u00eb m\u00ebnyr\u00eb t\u00eb barabart\u00eb
  me shtetasit vendas n\u00eb lidhje me kushtet e pun\u00ebs, pagat, mbrojtjen sociale
  dhe qasjen n\u00eb sh\u00ebrbime mjek\u00ebsore. Gjithashtu, k\u00ebrkon q\u00eb
  shtetet t\u00eb bashk\u00ebpunojn\u00eb p\u00ebr t\u00eb luftuar migracionin e paligjsh\u00ebm
  dhe t\u00eb rregullojn\u00eb kushtet e migracionit. **Konventa nr. 143**,\\\\(^{43}\\\\)
  e miratuar n\u00eb vitin 1975, p\u00ebrgendrohet n\u00eb luftimin e abuzimeve q\u00eb
  lidhen me migracionin e parregullt dhe n\u00eb mbrojtjen e t\u00eb drejtave t\u00eb
  pun\u00ebtor\u00ebve migrant\u00eb, pavar\u00ebsisht nga statusi i tyre. Ajo thekson
  r\u00ebnd\u00ebsin\u00eb e ndihm\u00ebs p\u00ebr integrimin e pun\u00ebtor\u00ebve
  migrant\u00eb n\u00eb vendin prit\u00ebs dhe nxiti mbrojtjen e t\u00eb drejtave
  t\u00eb tyre, p\u00ebrfshir\u00eb qasjen e barabart\u00eb n\u00eb pun\u00eb, arsim,
  dhe trajtim dinjitoz. T\u00eb dy konventat promovojn\u00eb parimin e trajtimit t\u00eb
  barabart\u00eb dhe mbrojtjen e t\u00eb drejtave themelore p\u00ebr pun\u00ebtor\u00ebt
  migrant\u00eb, duke mb\u00ebshtetur migracionin e sigurt dhe t\u00eb rregulluar.\\n\\n**Konventa
  p\u00ebr t\u00eb Drejtat e F\u00ebmij\u00ebs (CRC)**\\\\(^{44}\\\\) - e miratuar
  nga Kombet e Bashkuara n\u00eb vitin 1989, \u00ebsht\u00eb nj\u00eb instrument nd\u00ebrkomb\u00ebtar
  q\u00eb p\u00ebrcakton t\u00eb drejtat themelore t\u00eb \u00e7do f\u00ebmije, pavar\u00ebsisht
  nga komb\u00ebsia, statusi apo gjendja ekonomike. Konventa p\u00ebrfshin kat\u00ebr
  parime kryesore: mosdiskriminimi, interes\u00eb m\u00eb i lart\u00eb i f\u00ebmij\u00ebs,
  e drejta p\u00ebr t\u00eb jetuar dhe zhvilluar, dhe pjes\u00ebmarrja e f\u00ebmij\u00ebs
  n\u00eb vendime q\u00eb ndikojn\u00eb jet\u00ebn e tij. Ajo mbron t\u00eb drejtat
  e f\u00ebmij\u00ebve n\u00eb fusha t\u00eb ndryshme, p\u00ebrfshir\u00eb t\u00eb
  drejt\u00ebn p\u00ebr arsim, sh\u00ebndet\u00ebsi, mbrojtje nga abuzimi dhe shfryt\u00ebzimi,
  si dhe t\u00eb drejt\u00ebn p\u00ebr t\u00eb pasur nj\u00eb familje. Konventa k\u00ebrkon
  q\u00eb shtetet t\u00eb nd\u00ebrmarrin masa p\u00ebr t\u00eb mbrojtur f\u00ebmij\u00ebt
  n\u00eb situata t\u00eb rrezikut, si f\u00ebmij\u00ebt refugjat\u00eb, ata t\u00eb
  ndar\u00eb nga familjet e tyre, ose ata t\u00eb p\u00ebrfshir\u00eb n\u00eb pun\u00eb
  t\u00eb detyruar dhe trafikim. Ajo siguron q\u00eb \u00e7do f\u00ebmij\u00eb t\u00eb
  trajtohet me dinjitet dhe respekt, duke theksuar detyrimin e shteteve p\u00ebr t\u00eb
  siguruar mir\u00ebqenien dhe zhvillimin e tyre t\u00eb plot\u00eb.\\n\\n---\\n\\n\\\\(^{42}\\\\)
  C097 - Migration for Employment Convention (Revised). 1949 (No. 97) [https://normlex.ilo.org/dyn/normlex/en/f?p=NORMLEXPUB:55:0::NO::P55_TYPE,P55_LANG,P55_DOCUMENT,P55_NODE:CON_en,C097,./Document](https://normlex.ilo.org/dyn/normlex/en/f?p=NORMLEXPUB:55:0::NO::P55_TYPE,P55_LANG,P55_DOCUMENT,P55_NODE:CON_en,C097,./Document)\\n\\n\\\\(^{43}\\\\)
  C143 - Migrant Workers (Supplementary Provisions) Convention. 1975 (No. 143) [https://normlex.ilo.org/dyn/normlex/es/f?p=NORMLEXPUB:55:0::NO::P55_TYPE,P55_LANG,P55_DOCUMENT,P55_NODE:SUP_en,C143,./Document](https://normlex.ilo.org/dyn/normlex/es/f?p=NORMLEXPUB:55:0::NO::P55_TYPE,P55_LANG,P55_DOCUMENT,P55_NODE:SUP_en,C143,./Document)\\n\\n\\\\(^{44}\\\\)
  [https://www.unicef.org/child-rights-convention/convention-text](https://www.unicef.org/child-rights-convention/convention-text)\\n\\nPakti
  Nd\u00ebrkomb\u00ebtar p\u00ebr t\u00eb Drejtat Civile dhe Politike (ICCPR)\\\\(^{45}\\\\)
  - i miratuar nga Kombet e Bashkuara n\u00eb vitin 1966, \u00ebsht\u00eb nj\u00eb
  instrument thelb\u00ebsor q\u00eb garanton dhe mbron t\u00eb drejtat themelore civile
  dhe politike p\u00ebr t\u00eb gjith\u00eb individ\u00ebt, pavar\u00ebsisht nga komb\u00ebsia
  apo statusi. Pakti p\u00ebrmban nj\u00eb gam\u00eb t\u00eb gjer\u00eb t\u00eb drejta,
  duke p\u00ebrshir\u00eb t\u00eb drejt\u00ebn p\u00ebr jet\u00ebn, lirin\u00eb nga
  tortura, lirin\u00eb e mendimit, shprehjes, dhe fes\u00eb, si dhe t\u00eb drejt\u00ebn
  p\u00ebr nj\u00eb proces t\u00eb drejt\u00eb ligjor. ICCPR gjithashtu parashikon
  t\u00eb drejt\u00ebn p\u00ebr lirin\u00eb e l\u00ebvizjes, t\u00eb drejt\u00ebn
  p\u00ebr pjes\u00ebmarrje n\u00eb jet\u00ebn publike dhe zgjedhje, dhe mbrojtjen
  nga arrestimi apo ndalimi arbitrar. Dokumenti \u00ebsht\u00eb i r\u00ebnd\u00ebsish\u00ebm
  p\u00ebr t\u00eb siguruar barazin\u00eb para ligjit dhe p\u00ebr t\u00eb luftuar
  diskriminimin mbi baz\u00ebn e rac\u00ebs, gjinis\u00eb, fes\u00eb apo origjin\u00ebs.
  Pakti vendos obligime p\u00ebr shtetet pjes\u00ebmarr\u00ebse q\u00eb t\u00eb respektojn\u00eb
  dhe t\u00eb garantojn\u00eb t\u00eb drejtat e individ\u00ebve n\u00eb territorin
  e tyre dhe t\u00eb krijojn\u00eb mekanizma p\u00ebr mbrojtjen dhe zbatimin e k\u00ebtyre
  t\u00eb drejtave.\\n\\nPakti Nd\u00ebrkomb\u00ebtar p\u00ebr t\u00eb Drejtat Ekonomike,
  Sociale dhe Kulturore (ICESCR)\\\\(^{46}\\\\) - i miratuar nga Kombet e Bashkuara
  n\u00eb vitin 1966, synon t\u00eb mbroj\u00eb dhe promovoj\u00eb t\u00eb drejtat
  ekonomike, sociale dhe kulturore t\u00eb individ\u00ebve, duke njohtur r\u00ebnd\u00ebsin\u00eb
  e barazis\u00eb dhe mir\u00ebqenies p\u00ebr t\u00eb gjith\u00eb. Ky pakt thekson
  t\u00eb drejtat themelore si e drejta p\u00ebr pun\u00eb, t\u00eb drejt\u00ebn p\u00ebr
  kushte t\u00eb drejta dhe t\u00eb sigurta t\u00eb pun\u00ebs, t\u00eb drejt\u00ebn
  p\u00ebr edukim, e drejta p\u00ebr nj\u00eb standard t\u00eb p\u00ebrshtatsh\u00ebm
  jetese, dhe t\u00eb drejt\u00ebn p\u00ebr kujdes sh\u00ebndet\u00ebsor. ICESCR k\u00ebrkon
  nga shtetet pjes\u00ebmarr\u00ebse t\u00eb p\u00ebrmbushin dhe t\u00eb promovojn\u00eb
  gradualisht k\u00ebto t\u00eb drejta p\u00ebrmes marrjes s\u00eb masave ekonomike
  dhe sociale, duke marr\u00eb parasysht burimet e tyre t\u00eb disponueshme. Nj\u00eb
  tjet\u00ebr aspekt i r\u00ebnd\u00ebsish\u00ebm \u00ebsht\u00eb t\u00eb drejtat
  kulturore, p\u00ebrfsir\u00eb t\u00eb drejt\u00ebn e individ\u00ebve p\u00ebr t\u00eb
  marr\u00eb pjes\u00eb n\u00eb jet\u00ebn kulturore dhe p\u00ebr t\u00eb g\u00ebzuar
  p\u00ebrfitimet e p\u00ebrparimeve shkencore. Ky pakt n\u00ebnvizon detyrimin e
  shteteve p\u00ebr t\u00eb luftuar varf\u00ebrin\u00eb, p\u00ebr t\u00eb siguruar
  arsimin t\u00eb cil\u00ebsis\u00eb s\u00eb lart\u00eb dhe qasje n\u00eb kujdes sh\u00ebndet\u00ebsor
  p\u00ebr t\u00eb gjith\u00eb, duke mb\u00ebshtetur zhvillimin ekonomik dhe social
  n\u00eb nj\u00eb m\u00ebnyr\u00eb q\u00eb p\u00ebrmir\u00ebson mir\u00ebqenien e
  p\u00ebrgjithshme t\u00eb popullsis\u00eb.\\n\\nKonventa e vitit 1951 mbi Statusin
  e Refugiat\u00ebve dhe Protokolli i saj i vitit 1967\\\\(^{47}\\\\) - jan\u00eb
  dokumente themelore nd\u00ebrkomb\u00ebtare q\u00eb p\u00ebr\u00e7aktojn\u00eb standartet
  p\u00ebr mbrojtjen e refugiat\u00ebve n\u00eb mbar\u00eb bot\u00ebn. Konventa e
  vitit 1951 p\u00ebr\u00e7akton nj\u00eb definicion t\u00eb qart\u00eb p\u00ebr refugiat\u00ebt,
  duke i p\u00ebrkuifzuar ata si individ\u00eb q\u00eb ndodhen jasht\u00eb vendit
  t\u00eb tyre t\u00eb origjin\u00ebs dhe kan\u00eb frik\u00eb t\u00eb bazuar p\u00ebrndjekje
  p\u00ebr arsyet e rac\u00ebs, fes\u00eb, komb\u00ebsis\u00eb, p\u00ebrkat\u00ebsis\u00eb
  n\u00eb nj\u00eb grup t\u00eb caktuar shoq\u00ebror apo opinionit politik. Nj\u00eb
  nga parimet kryesore t\u00eb k\u00ebsaj konvente \u00ebsht\u00eb parimi i moskthimit
  (\\\"non-refoulement\\\"), q\u00eb ndalon kthimin e refugiat\u00ebve n\u00eb nj\u00eb
  vend ku jeta apo liria e tyre mund t\u00eb jen\u00eb n\u00eb rrezik. Gjithashtu,
  konventa siguron t\u00eb drejta t\u00eb r\u00ebnd\u00ebsishme p\u00ebr refugiat\u00ebt,
  p\u00ebrfsir\u00eb t\u00eb drejt\u00ebn p\u00ebr qasje n\u00eb arsim, pun\u00ebsim,
  dhe strehim, si dhe mbrojtjen nga diskriminimi dhe ndalimi arbitrar. Protokolli
  i vitit 1967 zgjeroi fush\u00ebn e veprimit t\u00eb konvent\u00ebs duke hequr kufizimet\\n\\n---\\n\\n\\\\(^{45}\\\\)
  [https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights](https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights)\\n\\n\\\\(^{46}\\\\)
  International Covenant on Economic, Social and Cultural Rights. Adopted by General
  Assembly Resolution 2200A (XXI) on 16 December 1966. United Nations General Assembly.
  [https://www.ohchr.org/sites/default/files/cescr.pdf](https://www.ohchr.org/sites/default/files/cescr.pdf)\\n\\n\\\\(^{47}\\\\)
  Convention And Protocol Relating To The Status of Refugees [https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees](https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees)\\n\\ngjeografike
  dhe t\u00eb periudh\u00ebs kohore t\u00eb p\u00ebrcaktuara n\u00eb tekstin origjinal,
  duke e b\u00ebr\u00eb at\u00eb t\u00eb zbatueshme p\u00ebr refugjat\u00ebt n\u00eb
  t\u00eb gjith\u00eb bot\u00ebn, pavar\u00ebsisht se kur ose ku kan\u00eb ndodhur
  ngjarjet q\u00eb i detyruan ata t\u00eb k\u00ebrkojn\u00eb azil. K\u00ebto instrumente
  nd\u00ebrkom\u00ebtare kan\u00eb krijuar nj\u00eb baz\u00eb t\u00eb fuqishme ligjore
  p\u00ebr mbrojtjen e refugjat\u00ebve dhe detyrimet e shteteve p\u00ebr t\u2019u
  siguruar atyre mbrojtje dhe mb\u00ebshtetje.\\n\\n**Konventa p\u00ebr Statusin e
  Personave pa Shtet\u00ebsi**\u2074\u2078 - e miratuar n\u00eb vitin 1954 nga Kombet
  e Bashkuara, ka p\u00ebr q\u00ebllim t\u00eb mbroj\u00eb dhe t\u00eb p\u00ebrmir\u00ebsoj\u00eb
  kushtet e jetes\u00ebs p\u00ebr individ\u00ebt q\u00eb nuk kan\u00eb shtet\u00ebsi.
  Persona pa shtet\u00ebsi jan\u00eb ata q\u00eb nuk njihen si shtetas nga asnj\u00eb
  shtet sipas ligjit t\u00eb atij shteti, duke i l\u00ebn\u00eb pa mbrojtje juridike
  dhe shpesh pa qasje n\u00eb t\u00eb drejtat themelore. Konventa garanton q\u00eb
  personat pa shtet\u00ebsi t\u00eb ken\u00eb t\u00eb drejta t\u00eb njashme me ato
  t\u00eb refugjat\u00ebve dhe shtetave t\u00eb vendave prit\u00ebse, p\u00ebrfshir\u00eb
  t\u00eb drejt\u00ebn p\u00ebr qasje n\u00eb arsim, pun\u00ebsim, dhe strehim, si
  dhe mbrojtjen nga d\u00ebbimi. Ajo p\u00ebrcakton t\u00eb drejt\u00ebn e personave
  pa shtet\u00ebsi p\u00ebr dokumente udh\u00ebtimi, q\u00eb u mund\u00ebsojn\u00eb
  t\u00eb l\u00ebvizin lirsh\u00ebm, dhe p\u00ebrmban udh\u00ebzime p\u00ebr p\u00ebrmir\u00ebsimin
  e statusit t\u00eb tyre ligjor. Konventa gjithashtu k\u00ebrkon q\u00eb shtetet
  t\u00eb punojn\u00eb drejt uljes s\u00eb numrit t\u00eb personave pa shtet\u00ebsi
  p\u00ebrmes regjistrimeve t\u00eb lindjeve, natyrizimeve, dhe p\u00ebrpjekjeve p\u00ebr
  t\u00eb parandaluar krijimin e m\u00ebtejsh\u00ebm t\u00eb statusit t\u00eb pa shtet\u00ebsis\u00eb,
  duke mbrojtur t\u00eb drejtat e k\u00ebtyre individ\u00ebve dhe duke siguruar integrimin
  e tyre t\u00eb suksessh\u00ebm n\u00eb shoq\u00ebri.\\n\\n**Konventa mbi Zvog\u00eblimin
  e Pashtet\u00ebsis\u00eb**\u2074\u2079 - e miratuar nga Kombet e Bashkuara n\u00eb
  vitin 1961, synon t\u00eb reduktoj\u00eb rastet e pashtet\u00ebsis\u00eb dhe t\u00eb
  parandaloj\u00eb krijimin e m\u00ebtejsh\u00ebm t\u00eb k\u00ebtij statusi. Pashtet\u00ebsia
  ndodh kur nj\u00eb individ nuk \u00ebsht\u00eb i njohur si shtetas nga asnj\u00eb
  shtet, duke i l\u00ebn\u00eb ata pa mbrojtje juridike dhe shpesh pa qasje n\u00eb
  t\u00eb drejt\u00eb t\u00eb r\u00ebnd\u00ebsishme civile dhe sociale. Konventa vendos
  detyrime p\u00ebr shtetet an\u00ebtare q\u00eb t\u00eb sigurojn\u00eb marrjen e
  shtet\u00ebsis\u00eb p\u00ebr individ\u00ebt n\u00eb situata t\u00eb caktuara, si
  p\u00ebr shembull f\u00ebmij\u00ebt e lindur n\u00eb territorin e tyre q\u00eb p\u00ebrndryshe
  do t\u00eb mbeteshin pa shtet\u00ebsi, dhe ata q\u00eb e humbasin shtet\u00ebsin\u00eb
  p\u00ebr shkak t\u00eb humbjes s\u00eb shtet\u00ebsis\u00eb s\u00eb prind\u00ebrve.
  Ajo nxit shtetet q\u00eb t\u00eb parandalojn\u00eb heqjen e shtet\u00ebsis\u00eb
  p\u00ebr individ\u00ebt n\u00eb m\u00ebnyr\u00eb arbitrale dhe t\u00eb ndihmojn\u00eb
  personat q\u00eb p\u00ebrndryshe do t\u00eb mbeteshin pa shtet\u00ebsi p\u00ebrmes
  proceseve t\u00eb natyrizimit. Nj\u00eb aspekt i r\u00ebnd\u00ebsish\u00ebm i konvent\u00ebs
  \u00ebsht\u00eb parimi q\u00eb askush nuk duhet t\u00eb mbetet pa shtet\u00ebsi
  p\u00ebr shkak t\u00eb rac\u00ebs, fes\u00eb, etnis\u00eb apo faktor\u00ebve t\u00eb
  tjera diskriminues. Ajo synon t\u00eb siguroj\u00eb q\u00eb shtet\u00ebsia t\u00eb
  mos humbet n\u00eb m\u00ebnyr\u00eb t\u00eb padrejt\u00eb dhe q\u00eb t\u00eb minimizohet
  ndikimi i pashtet\u00ebsis\u00eb, duke garantuar respektimin e t\u00eb drejtave
  themelore t\u00eb individ\u00ebve.\\n\\n**Kompakti Global p\u00ebr Migracionin (Global
  Compact for Safe, Orderly and Regular Migration)**\u2075\u2070 - i miratuar nga
  Kombet e Bashkuara n\u00eb vitin 2018, \u00ebsht\u00eb marr\u00ebveshja e par\u00eb
  nd\u00ebrkom\u00ebtare q\u00eb synon t\u00eb rregulloj\u00eb dhe t\u00eb p\u00ebrmir\u00ebsoj\u00eb
  menaxhimin e migracionit n\u00eb nivel global. Ky dokument jo-detyrues p\u00ebrmban
  nj\u00eb s\u00ebr\u00eb parimesh dhe objektivash q\u00eb synojn\u00eb t\u00eb mb\u00ebshtesin
  migracionin e sigurt, t\u00eb rregullt dhe t\u00eb parashikuesh\u00ebm, duke respektuar
  t\u00eb drejtat e njeriut dhe sovranitetin komb\u00ebtar. Kompakti ka 23 objektiva
  q\u00eb p\u00ebrfshijn\u00eb fusha si: zvog\u00eblimi\\n\\n---\\n\\n\u2074\u2078
  Convention relating to the Status of Stateless Persons  \\nhttps://treaties.un.org/doc/Treaties/1960/06/19600606%2001-49%20AM/Ch_V_3p.pdf\\n\\n\u2074\u2079
  Convention on the Reduction of Statelessness 1961  \\nhttps://legal.un.org/ilc/texts/instruments/english/conventions/6_1_1961.pdf\\n\\n\u2075\u2070
  https://www.iom.int/global-compact-migration\\n\\ni faktor\u00ebve q\u00eb detyrojn\u00eb
  njer\u00ebzit t\u00eb migrojn\u00eb, sigurimi i qasjes n\u00eb dokumente identifikimi
  dhe mbrojtje ligjore, luftimi i trafikimit dhe shfryt\u00ebzimit t\u00eb migrant\u00ebve,
  p\u00ebrmir\u00ebsimi i integrimit t\u00eb migrant\u00ebve n\u00eb vendet prit\u00ebse,
  dhe promovimi i nj\u00eb migracioni t\u00eb sigurt p\u00ebrmes kanaleve t\u00eb
  regullta. Ai gjithashtu thekson r\u00ebnd\u00ebsin\u00eb e bashk\u00ebpunimit nd\u00ebrkomb\u00ebtar
  p\u00ebr t\u00eb ndihmuar n\u00eb menaxhimin e sfidave t\u00eb migracionit. Nj\u00eb
  aspekt i r\u00ebnd\u00ebsis\u00eb h\u00ebn\u00eb i Kompaktit \u00ebsht\u00eb qasja
  e tij ndaj mbrojtjes s\u00eb dinjitetit dhe t\u00eb drejtave t\u00eb migrant\u00ebve,
  duke p\u00ebrfshir\u00eb t\u00eb drejtat p\u00ebr qasje n\u00eb sh\u00ebrbime baz\u00eb
  si arsim, sh\u00ebndet\u00ebsi dhe strehimi, pavar\u00ebsisht nga statusi i tyre.
  Ai synon t\u00eb reduktoj\u00eb rreziqet dhe pasigurit\u00eb q\u00eb p\u00ebrballen
  migrant\u00ebt gjat\u00eb rrug\u00ebtimit t\u00eb tyre, dhe nxiti integrimin dhe
  p\u00ebrfshirjen shoq\u00ebrore t\u00eb tyre n\u00eb vendet prit\u00ebse.\\n\\n3.3.2.
  Standardet nd\u00ebrkomb\u00ebtare sipas t\u00eb drejt\u00ebs Evropiane\\n\\nN\u00eb
  nivel evropian, ka disa akte dhe instrumente q\u00eb rregullojn\u00eb t\u00eb drejtat
  e t\u00eb huajve, p\u00ebrfshir\u00eb emigrant\u00ebt, refugjatat\u00eb dhe personat
  pa shtet\u00ebsi. Nd\u00ebr aktet m\u00eb t\u00eb r\u00ebnd\u00ebsis\u00eb h\u00ebn\u00eb
  mund t\u00eb b\u00ebrmendim:\\n\\n**Konventa Evropiane p\u00ebr t\u00eb Drejtat
  e Njeriut (ECHR)**\\\\(^{51}\\\\) - Konventa Evropiane p\u00ebr t\u00eb Drejtat
  e Njeriut (ECHR) parashikon mbrojtjen e t\u00eb drejtave dhe lirive themelore p\u00ebr
  t\u00eb gjith\u00eb individ\u00ebt n\u00eb territorin e shteteve an\u00ebtare t\u00eb
  K\u00ebshillit t\u00eb Evrop\u00ebs, p\u00ebrfshir\u00eb t\u00eb huajt dhe refugjatat\u00eb.
  Ajo garanton t\u00eb drejta t\u00eb r\u00ebnd\u00ebsis\u00eb h\u00ebn\u00eb si e
  drejta p\u00ebr jet\u00ebn, e drejta p\u00ebr mbrojtje nga tortura dhe trajtimi
  i keq, e drejta p\u00ebr nj\u00eb proces t\u00eb drejt\u00eb ligjor, dhe e drejta
  p\u00ebr respektimin e jet\u00ebs private dhe familjare. Konventa ndalon gjithashtu
  diskrimininimin dhe ofron mbrojtje p\u00ebr individ\u00ebt pa marr\u00eb parasysh
  statusin e tyre ligjor. N\u00eb ve\u00e7anti, nen\u00eb 3 ndalon trajtimin jo njer\u00ebzor
  dhe degradues, i cili \u00ebsht\u00eb v\u00ebcan\u00ebrisht i r\u00ebnd\u00ebsis\u00eb
  h\u00ebn\u00eb p\u00ebr refugjatat\u00eb dhe t\u00eb huajt n\u00eb situata t\u00eb
  rrezikshme. Gjithashtu, nen\u00eb 4 mbron nga detyrimi p\u00ebr t\u00eb punuar n\u00eb
  kushte t\u00eb shkeljes s\u00eb t\u00eb drejtave dhe nen\u00eb 8 mb\u00ebshtet t\u00eb
  drejt\u00ebn p\u00ebr t\u00eb k\u00ebrkuar azil dhe p\u00ebr t\u00eb ruajtur integritetin
  e jet\u00ebs private dhe familjare. K\u00ebshtu, ECHR ofron nj\u00eb mbrojtje t\u00eb
  gj\u00ebr\u00eb dhe t\u00eb fuqishme p\u00ebr t\u00eb gjith\u00eb individ\u00ebt
  q\u00eb ndodhen n\u00eb jurisdikcionin e shteteve an\u00ebtare, duke kontribuar
  n\u00eb sigurin\u00eb dhe dinjitetin e t\u00eb huajve dhe refugjatat\u00ebve. E
  miratuar n\u00eb vitin 1950, kjo konvent\u00eb \u00ebsht\u00eb nj\u00eb instrument
  thelb\u00ebsor p\u00ebr mbrojtjen e t\u00eb drejtave dhe lirive themelore n\u00eb
  Evrop\u00eb. Ajo ndalon diskrimininimin dhe garanton t\u00eb drejta t\u00eb r\u00ebnd\u00ebsis\u00eb
  h\u00ebn\u00eb p\u00ebr t\u00eb gjith\u00eb individ\u00ebt n\u00eb territorin e
  shteteve an\u00ebtare t\u00eb K\u00ebshillit t\u00eb Evrop\u00ebs, p\u00ebrfshir\u00eb
  t\u00eb huajt.\\n\\n**Kart\u00ebs s\u00eb t\u00eb Drejtave Themelore t\u00eb Bashkimit
  Evropian** \u2013 e shpallur n\u00eb vitin 2000 dhe e b\u00ebra e detyrueshme me
  Traktatin e Lisbon\u00ebs n\u00eb vitin 2009, Karta mbron t\u00eb drejtat themelore
  t\u00eb individ\u00ebve n\u00eb Bashkim Evropian (BE). Ajo p\u00ebrfshin t\u00eb
  drejtat e lidhura me lirin\u00eb, mbrojtjen nga diskriminimi, t\u00eb drejtat sociale
  dhe ekonomike, p\u00ebrfshir\u00eb komb\u00ebsin\u00eb dhe statusin e emigrant\u00ebve.
  Ajo ndihmon n\u00eb harmonizimin e legjislacionit t\u00eb BE-s\u00eb dhe siguron
  mbrojtjen e dinjitetit dhe t\u00eb drejtave t\u00eb individ\u00ebve q\u00eb ndodhen
  n\u00eb territoret e shteteve an\u00ebtare, duke for\u00e7uar angazhimin p\u00ebr
  respektimin e t\u00eb drejtave themelore n\u00eb t\u00eb gjitha veprimet e BE-s\u00eb.\\n\\n---\\n\\n\\\\(^{51}\\\\)
  European Convention on Human Rights [https://www.echr.coe.int/documents/d/echr/Convention_ENG](https://www.echr.coe.int/documents/d/echr/Convention_ENG)\\n\\nDirektiva
  p\u00ebr Procedurat e Azilit (2013/32/EU) \u2013 Direktiva p\u00ebr Procedurat e
  Azilit (2013/32/EU)\\\\(^{52}\\\\) - e miratuar nga Bashkimi Evropian n\u00eb vitin
  2013, p\u00ebrcakton standardet p\u00ebr shqyrtimin e k\u00ebrkesave p\u00ebr azil
  n\u00eb shtetet an\u00ebtare t\u00eb BE-s\u00eb. Ajo synon t\u00eb siguroj\u00eb
  q\u00eb procedurat e azilit t\u00eb jen\u00eb t\u00eb drejt\u00eb, efikase dhe t\u00eb
  harmonizuara n\u00eb t\u00eb gjitha shtetet an\u00ebtare. K\u00ebrkesat p\u00ebr
  azil duhet t\u00eb shqyrtohen n\u00eb m\u00ebnyr\u00eb t\u00eb drejt\u00eb dhe t\u00eb
  shpejt\u00eb, duke garantuar qasje n\u00eb sh\u00ebrbime t\u00eb r\u00ebnd\u00ebsishme
  p\u00ebr k\u00ebrkuuesit. Direktiva ndalon vendosjen e kushteve q\u00eb ndikojn\u00eb
  negativisht n\u00eb mir\u00ebqenien e k\u00ebrkuuesve. Ajo k\u00ebrkon q\u00eb individ\u00ebt
  t\u00eb ken\u00eb mund\u00ebsi t\u00eb paraqesin provat dhe t\u00eb marrin k\u00ebshillim
  ligjor. Ka dispozita p\u00ebr procedura t\u00eb shpejt\u00eb dhe t\u00eb shkurtuara
  n\u00eb raste t\u00eb caktuara. K\u00ebrkuuesit e azilit nuk mund t\u00eb d\u00ebbohen
  deri sa t\u00eb merret nj\u00eb vendim p\u00ebrfundimtar. Direktiva ndihmon n\u00eb
  harmonizimin e praktikave t\u00eb azilit n\u00eb t\u00eb gjith\u00eb BE-n\u00eb.
  Ajo kontribuon n\u00eb mbrojtjen dhe trajtimin e drejt\u00eb t\u00eb individ\u00ebve
  q\u00eb k\u00ebrkojn\u00eb mbrojtje nd\u00ebrkomb\u00ebtare. P\u00ebrmes k\u00ebsaj
  direktive, BE p\u00ebrpiqet t\u00eb p\u00ebrmir\u00ebsoj\u00eb sistemin e azilit
  dhe t\u00eb siguroj\u00eb standarde t\u00eb barabarta p\u00ebr t\u00eb gjith\u00eb
  k\u00ebrkuuesit.\\n\\nDirektiva p\u00ebr Kualifikimin (2011/95/EU)\\\\(^{53}\\\\)
  - e miratuar nga Bashkimi Evropian n\u00eb vitin 2011, p\u00ebrcakton standardet
  p\u00ebr njoftjen e statusit t\u00eb refugjat\u00ebve dhe mbrojtjen e personave
  q\u00eb k\u00ebrkojn\u00eb mbrojtje nd\u00ebrkomb\u00ebtare n\u00eb shtetet an\u00ebtare
  t\u00eb BE-s\u00eb. Ajo vendos kriteret p\u00ebr t\u00eb p\u00ebrcaktuar se kush
  mund t\u00eb cil\u00ebsohet si refugjat dhe siguron mbrojtje p\u00ebr ata q\u00eb
  jan\u00eb n\u00eb rrezik t\u00eb p\u00ebrndekjes ose kan\u00eb nevoj\u00eb p\u00ebr
  mbrojtje t\u00eb plot\u00eb. Direktiva p\u00ebrfshin definicionin e refugjat\u00ebve
  sipas Konvent\u00ebs s\u00eb vitit 1951 dhe shp\u00ebrndan standarde p\u00ebr vler\u00ebsimin
  e k\u00ebrkesave p\u00ebr azil. Ajo gjithashtu garanton t\u00eb drejtat e refugjat\u00ebve,
  p\u00ebrfshir\u00eb aksesin n\u00eb mbrojtje ligjore, arsim dhe sh\u00ebndet\u00ebsi.
  Ka rregulla t\u00eb ve\u00e7anta p\u00ebr mbrojtjen e personave q\u00eb p\u00ebrballen
  me rrezik t\u00eb r\u00ebnd\u00eb, si tortura dhe trajtim i keq. Direktiva k\u00ebrkon
  harmonizimin e praktikave t\u00eb mbrojtjes nd\u00ebrkomb\u00ebtare n\u00eb t\u00eb
  gjith\u00eb BE-n\u00eb dhe siguron standarde t\u00eb nj\u00ebjt\u00eb p\u00ebr t\u00eb
  gjitha shtetet an\u00ebtare. Ajo ndihmon n\u00eb p\u00ebrmir\u00ebsimin e mbrojtjes
  p\u00ebr refugjatat dhe p\u00ebrputhshm\u00ebrin\u00eb e lligjeve t\u00eb azilit
  n\u00eb t\u00eb gjith\u00eb Bashkimin Evropian. P\u00ebrmes k\u00ebsaj direktive,
  BE synon t\u00eb siguroj\u00eb nj\u00eb sistem t\u00eb drejt\u00eb dhe efikas p\u00ebr
  mbrojtjen e individ\u00ebve q\u00eb k\u00ebrkojn\u00eb azil.\\n\\nDirektiva p\u00ebr
  Pranimin e T\u00eb Huajve (2013/33/EU)\\\\(^{54}\\\\) - e miratuar nga Bashkimi
  Evropian n\u00eb vitin 2013, p\u00ebrcakton standardet p\u00ebr kushtet e jet\u00ebs\u00ebs
  s\u00eb k\u00ebrkuuesve t\u00eb azilit n\u00eb shtetet an\u00ebtare t\u00eb BE-s\u00eb.
  Ajo siguron q\u00eb k\u00ebta individ\u00eb t\u00eb ken\u00eb kushte t\u00eb arsyeshme
  dhe humane gjat\u00eb periudh\u00ebs s\u00eb shqyrtimit t\u00eb k\u00ebrkes\u00ebs
  s\u00eb tyre, duke p\u00ebrfshir\u00eb strehim t\u00eb sigurt, ushqim, dhe akses
  n\u00eb sh\u00ebrbime sh\u00ebndet\u00ebsore dhe arsimore. Direktiva garanton gjithashtu
  qasje n\u00eb ndihm\u00eb sociale dhe materiale, mb\u00ebshtetje p\u00ebr integrimin,
  dhe mbik\u00ebqyrje p\u00ebr t\u00eb siguruar q\u00eb standardet jan\u00eb t\u00eb\\n\\n\\\\(^{52}\\\\)
  Directive 2013/32/EU of the European Parliament and of the Council of 26 June 2013
  on common procedures for granting and withdrawing international protection [https://eur-lex.europa.eu/legal-content/en/TXT/?uri=celex%3A32013L0032](https://eur-lex.europa.eu/legal-content/en/TXT/?uri=celex%3A32013L0032)\\n\\n\\\\(^{53}\\\\)
  Directive 2011/95/EU of 13 December 2011 on standards for the qualification of third-country
  nationals or stateless persons as beneficiaries of international protection, for
  a uniform status for refugees or for persons eligible for subsidiary protection,
  and for the content of the protection granted [https://eur-lex.europa.eu/eli/dir/2011/95/oj](https://eur-lex.europa.eu/eli/dir/2011/95/oj)\\n\\n\\\\(^{54}\\\\)
  Directive 2013/33/EU of the European Parliament and of the Council of 26 June 2013
  laying down standards for the reception of applicants for international protection
  [https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32013L0033](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32013L0033)\\n\\np\u00ebrmbushura.
  Ajo ndalon d\u00ebbimin e k\u00ebrkuesve n\u00eb vende ku mund t\u00eb rrezikohen
  nga p\u00ebrndjekja ose trajtimi i keq dhe siguron q\u00eb ata t\u00eb ken\u00eb
  mund\u00ebsi t\u00eb kontribuojn\u00eb n\u00eb shqyrtimin e k\u00ebrkes\u00ebs s\u00eb
  tyre. N\u00eb k\u00ebt\u00eb m\u00ebnyr\u00eb, direktiva ndihmon n\u00eb krijuimin
  e kushteve t\u00eb barabarta dhe t\u00eb ndershme p\u00ebr k\u00ebrkuesit e azilit
  n\u00eb t\u00eb gjith\u00eb BE-n\u00eb.\\n\\n**Direktiva p\u00ebr T\u00eb Drejt\u00ebn
  e Liris\u00eb dhe t\u00eb L\u00ebvizjes (2004/38/EC)**\\\\(^{55}\\\\) - e miratuar
  nga Bashkimi Europian n\u00eb vitin 2004, garanton q\u00eb shtetasit e BE-s\u00eb
  dhe an\u00ebtar\u00ebt e familjeve t\u00eb tyre kan\u00eb t\u00eb drejt\u00ebn t\u00eb
  l\u00ebvizin dhe t\u00eb q\u00ebndrojn\u00eb n\u00eb \u00e7do shtet an\u00ebtar
  p\u00ebr nj\u00eb periudh\u00eb t\u00eb gjat\u00eb. Ajo lejon q\u00eb shtetasit
  e BE-s\u00eb dhe familjar\u00ebt e tyre t\u00eb q\u00ebndrojn\u00eb n\u00eb \u00e7do
  shtet an\u00ebtar p\u00ebr deri n\u00eb 90 dit\u00eb pa k\u00ebrkesa t\u00eb ve\u00e7anta,
  dhe p\u00ebr q\u00ebndrim\u00eb m\u00eb t\u00eb gjata, ata duhet t\u00eb regjistrohen
  dhe t\u00eb p\u00ebrmbushin kushte si t\u00eb ken\u00eb burime t\u00eb mjafueshme
  dhe sigurim sh\u00ebndet\u00ebsor. Direktiva ofron mbrojtje nga d\u00ebbimi dhe
  siguron akses n\u00eb t\u00eb drejtat dhe sh\u00ebrbimet n\u00eb vendin e pritjes,
  duke p\u00ebrfshir\u00eb arsimimin dhe sh\u00ebndet\u00ebsin\u00eb. Ajo gjithashtu
  garanton q\u00eb an\u00ebtar\u00ebt e familjes, q\u00eb nuk jan\u00eb shtetas t\u00eb
  BE-s\u00eb, mund t\u00eb bashkohen dhe t\u00eb q\u00ebndrojn\u00eb me qytetar\u00ebt
  e BE-s\u00eb n\u00ebn kushte t\u00eb caktuara. N\u00eb k\u00ebt\u00eb m\u00ebnyr\u00eb,
  direktiva ndihmon n\u00eb sigurimin e liris\u00eb s\u00eb l\u00ebvizjes dhe integrimin
  e shtetasve t\u00eb BE-s\u00eb n\u00eb shtetet an\u00ebtare.\\n\\n**Strategjia e
  BE-s\u00eb p\u00ebr Kthimin Vullnetar dhe R\u00fcintegrimin**\\\\(^{56}\\\\) - e
  publikuar n\u00eb vitin 2021, synon t\u00eb p\u00ebrmir\u00ebsoj\u00eb procesin
  e kthimit dhe riintegrimit t\u00eb individ\u00ebve q\u00eb nuk kan\u00eb t\u00eb
  drejt\u00eb t\u00eb q\u00ebndrojn\u00eb n\u00eb BE, duke promovuar nj\u00eb sistem
  t\u00eb p\u00ebrbashk\u00ebt dhe t\u00eb koordinuar t\u00eb kthimit. Strategjia
  fokusohet n\u00eb forcimin e mb\u00ebshtetjes p\u00ebr riintegrimin dhe rritjen
  e pron\u00ebsis\u00eb nga vendet e origjin\u00ebs p\u00ebr k\u00ebt\u00eb proces.
  Ajo identifikon disa sfida, si mang\u00ebsit\u00eb n\u00eb kapacitetet dhe sh\u00ebrbimet
  publike n\u00eb vendet e origjin\u00ebs, q\u00eb ndikojn\u00eb negativisht n\u00eb
  efektivitetin e riintegrimit. Mungesa e koordinimit dhe cil\u00ebsis\u00eb s\u00eb
  sh\u00ebrbimeve, si kujdesi sh\u00ebndet\u00ebsor, trajnimi dhe pun\u00ebsimi, mund
  t\u00eb pengoj\u00eb aksesin n\u00eb mb\u00ebshtetje p\u00ebr individ\u00ebt e rikthyer.
  Strategjia k\u00ebrkon q\u00eb BE-ja t\u00eb nxise nj\u00eb rritje graduale t\u00eb
  rolit t\u00eb vendeve t\u00eb origjin\u00ebs n\u00eb nismat e riintegrimit dhe t\u00eb
  p\u00ebrfshij\u00eb shoq\u00ebrim\u00eb civile dhe sektorin privat p\u00ebr t\u00eb
  rritur efektivitetin. FRONTEX-i do t\u00eb kontribuoj\u00eb n\u00eb forcimin e kapaciteteve
  p\u00ebr kthimin dhe riintegrimin, duke ndihmuar n\u00eb organizimin e ripranimeve
  dhe nd\u00ebrtimin e kapaciteteve vendore. BE-ja do t\u00eb mb\u00ebshtes\u00eb
  zhvillimin e strukturave t\u00eb qeverisjes s\u00eb migracionit dhe do t\u00eb ndihmoj\u00eb
  n\u00eb krijimin e qendrave t\u00eb integruara t\u00eb sh\u00ebrbimit publik n\u00eb
  vendet e origjin\u00ebs. Dialogu strategjik dhe menaxhimi i informacionit do t\u00eb
  p\u00ebrdoren p\u00ebr t\u00eb p\u00ebrmir\u00ebsuar cil\u00ebsin\u00eb e referimeve
  dhe p\u00ebr t\u00eb maksimizuar p\u00ebrdorimin e burimeve n\u00eb programet e
  riintegrimit.\\n\\n---\\n\\n\\\\(^{55}\\\\) Directive 2004/38/EC of the European
  Parliament and of the Council of 29 April 2004 on the right of citizens of the Union
  and their family members to move and reside freely within the territory of the Member
  States amending Regulation (EEC) [https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A32004L0038](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A32004L0038)\\n\\n\\\\(^{56}\\\\)
  Strategjia e BE-s\u00eb p\u00ebr Kthimin dhe R\u00fcintegrimin Vullnetar, Bruksel,
  120 final, 27 prill 2021 [https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52021DC0120&qid=1632401748181](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52021DC0120&qid=1632401748181)\\n\\nIV.
  Procedurat p\u00ebr p\u00ebrfitimin e viz\u00ebs dhe lejes s\u00eb q\u00ebndrimit
  p\u00ebr t\u00eb huajt\\n\\n4.1. Procedura p\u00ebr pajisjen me viz\u00eb\\n\\nReferuar
  Ligjit Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d, \u201cViz\u00eb\u201d
  \u00ebsht\u00eb autorizimi n\u00eb form\u00ebn e nj\u00eb viz\u00eb pull\u00eb n\u00eb
  nj\u00eb dokument t\u00eb vlefsh\u00ebm udh\u00ebtimi ose viz\u00eb elektronike,
  e printuar nga format elektronik, l\u00ebshuar nga autoritetet p\u00ebrgjegj\u00ebse,
  sipas procedurave t\u00eb k\u00ebtij ligji, q\u00eb lejon t\u00eb huajin t\u00eb
  hyj\u00eb, t\u00eb q\u00ebndrojn\u00eb ose t\u00eb kaloj\u00eb transit n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb, n\u00eb p\u00ebrpunhje me legjislacionin n\u00eb fuqi.\\n\\nLlojet
  e vizave dhe procedura p\u00ebr marrjen e tyre jan\u00eb t\u00eb rregulluara me
  ligj dhe p\u00ebrfshijn\u00eb disa kategori kryesore:\\n\\n**Viza e tipit \u201cA\u201d:**
  Kjo viz\u00eb konsiderohet si viza e tranzitit n\u00eb aeroport dhe u lejon mbajt\u00ebsve
  t\u00eb hyjn\u00eb dhe t\u00eb q\u00ebndrojn\u00eb n\u00eb zon\u00ebn nd\u00ebrkontinentare
  t\u00eb aeroportit p\u00ebr t\u00eb vazhduar udh\u00ebtimin drejt destinacionit
  t\u00eb tyre. Viza e tipit \u201cA\u201d mund t\u00eb jetet me shum\u00eb hyrje-dalje
  dhe me vlefshm\u00ebri maksimumi deri n\u00eb gjasht\u00eb muaj, n\u00ebse aplikuesi
  \u00ebsht\u00eb i besuesh\u00ebm apo ka p\u00ebrdorur me korrekt\u00ebs\u00eb vizat
  e m\u00ebparshme dhe provon se ka nevoj\u00eb t\u00eb kaloj\u00eb transit shpesh
  ose rregullisht. Aplikuesit mund t\u00eb p\u00ebrjashtohen nga kjo viz\u00eb n\u00eb
  disa raste, p\u00ebr shembull, mbajt\u00ebsit e pasaportave diplomatike ose an\u00ebtar\u00ebt
  e ekuipazheve t\u00eb transportit ajror t\u00eb cil\u00ebt jan\u00eb shtetas t\u00eb
  nj\u00eb pale kontraktuese t\u00eb Konvent\u00ebs s\u00eb \u00c7ikagos mbi Aviacionin
  Civil Nd\u00ebrkomb\u00ebtar, si dhe Konvent\u00ebs s\u00eb Detit Montego Bay, apo
  thjesht\u00eb i p\u00ebrkasin nj\u00eb kategorie q\u00eb p\u00ebrjashtohen nga detyrimi
  i pajisjes me viz\u00eb.\\n\\n**Viza e tipit \u201cC\u201d:** Kjo viz\u00eb l\u00ebshohet
  n\u00eb form\u00ebn e nj\u00eb vize pull\u00eb ose e printuar n\u00eb format elektronik,
  e cila i jep t\u00eb drejt\u00ebn mbajt\u00ebsit t\u00eb saj t\u00eb hyj\u00eb dhe
  t\u00eb q\u00ebndrojn\u00eb n\u00eb RSH deri n\u00eb 90 dit\u00eb brenda 180 dit\u00ebve,
  duke filluar nga data q\u00eb aplikuesi ka hyr\u00eb p\u00ebr her\u00eb t\u00eb
  par\u00eb. Mund t\u00eb l\u00ebshohet me nj\u00eb, dy, ose shum\u00eb hyrje, por
  *periudha e vlefshm\u00ebris\u00eb nuk mund t\u2019i kaloj\u00eb 5 vjet*. Kjo viz\u00eb
  mund t\u00eb p\u00ebrdoret p\u00ebr q\u00ebllime t\u00eb ndryshme si turizmi, biznesi,
  apo angazhim\u00ebve familjare, dhe mund t\u00eb p\u00ebrfshij\u00eb viz\u00eb grupi
  p\u00ebr aktivitete t\u00eb p\u00ebrbashk\u00ebta (artistike, shkencore apo sportive).
  Viza e tipit \u201cC\u201d me nj\u00eb hyrje mund t\u00eb jetet edhe si viz\u00eb
  grupi e hedhur n\u00eb nj\u00eb pasaporte grupi, me q\u00ebllim transiti ose q\u00ebndrimi
  maksimalisht deri 30 dit\u00eb dhe p\u00ebr 5 deri n\u00eb 50 persona, t\u00eb cil\u00ebt
  kan\u00eb p\u00ebr q\u00ebllim t\u00eb marrin pjes\u00eb n\u00eb aktivitete artistike,
  shkencore ose sportive, apo kur hyjn\u00eb dhe dalin nga territori s\u00eb bashku
  si turist\u00eb. Kjo viz\u00eb grupi u l\u00ebshohet me kufizime rajonale ekuipazheve
  t\u00eb mjeteve t\u00eb lundrimit, t\u00eb cilat transferohen n\u00eb ose nga nj\u00eb
  anije s\u00eb bashku.\\n\\n**Viza e tipit \u201cD\u201d:** Kjo viz\u00eb l\u00ebshohet
  n\u00eb form\u00ebn e nj\u00eb vize pull\u00eb ose e printuar n\u00eb format elektronik
  p\u00ebr shtetasit e huaj q\u00eb synojn\u00eb t\u00eb q\u00ebndrojn\u00eb n\u00eb
  RSh m\u00eb shum\u00eb se 90 dit\u00eb brenda 180 dit\u00ebve, dhe kur, p\u00ebr
  t\u2019u pajisur me leje q\u00ebndrimi, p\u00ebr k\u00ebta shtetas k\u00ebrkohet
  viz\u00eb. Kjo viz\u00eb mund\\n\\n---\\n\\n57 Shih nenin 3, pika 56 i Ligjit Nr.
  79 dat\u00eb 18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d;\\n58 P\u00ebr m\u00eb
  shum\u00eb shih Nenin 19, t\u00eb ligjit Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr
  t\u00eb huajt\u201d.\\n59 P\u00ebr m\u00eb shum\u00eb shih Nenin 20 t\u00eb ligjit
  Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d.\\n\\nt\u00eb jepet
  edhe me vlefshm\u00ebri 1-vje\u00e7are, koh\u00eb q\u00ebndrimi 90 dit\u00eb, por
  jo p\u00ebr m\u00eb shum\u00eb se 180 dit\u00eb, llogaritur q\u00eb nga dita e hyrjes
  s\u00eb par\u00eb, me nj\u00eb, dy apo m\u00eb shum\u00eb hyrje-dalje, e cila i
  jep t\u00eb drejt\u00eb mbajt\u00ebsit t\u00eb aplikoj\u00eb p\u00ebr t\u2019u pajisur
  me leje q\u00ebndrimi pas hyrjes n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb.\\n\\nKriteret
  dhe dokumentacioni p\u00ebr pajisjen me viz\u00eb dhe leje q\u00ebndrimi jan\u00eb
  t\u00eb p\u00ebrcaktuar qart\u00eb me Vendimin e K\u00ebshillit t\u00eb Ministrave
  (VKM) Nr. 858 dat\u00eb 29.12.2021 \u201cP\u00ebr p\u00ebrcaktimin e kriteveve,
  t\u00eb procedurave e t\u00eb dokumentacionit p\u00ebr hyrjen, q\u00ebndrimin dhe
  trajtimin e t\u00eb huajve n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d
  e ndryshuar.\\n\\nAutoritetet p\u00ebrgjegj\u00ebse p\u00ebr pajisjen e t\u00eb
  huajve me viza p\u00ebr hyrje, q\u00ebndrim ose transit n\u00eb Shqip\u00ebri, \u00ebsht\u00eb
  Ministria p\u00ebrgjegj\u00ebse p\u00ebr pun\u00ebt e jashtme e cila bashk\u00ebpunon
  me ministrin\u00eb p\u00ebrgjegj\u00ebse p\u00ebr rendin e sigurin\u00eb publike
  dhe Sh\u00ebrbimin Informativ t\u00eb Shtetit lidhur me procedur\u00ebn e l\u00ebshimit
  t\u00eb vizave.\\n\\n- **Aplikimi dhe l\u00ebshimi i viz\u00ebs**\\n\\nNeni 23 i
  ligjit \u201cP\u00ebr t\u00eb huajt\u201d rregullon procedurat p\u00ebr aplikimin
  p\u00ebr viz\u00eb p\u00ebr t\u00eb huajt q\u00eb d\u00ebshirojn\u00eb t\u00eb hyjn\u00eb
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb. Sipas k\u00ebtij neni, p\u00ebr
  pajisje me viz\u00eb, **aplikimi b\u00ebhet jo m\u00eb shum\u00eb se 90 dit\u00eb
  p\u00ebrp\u00ebra dat\u00ebs s\u00eb planifikuar p\u00ebr t\u00eb ardhur n\u00eb
  RSH**, pran\u00eb p\u00ebrfaq\u00ebsive diplomatike dhe/ose konsullore t\u00eb RSH
  jasht\u00eb vendit n\u00eb m\u00ebnyr\u00eb elektronike ose, n\u00eb rastet e marr\u00ebveshjeve
  me vendet t\u00eb tjera, n\u00eb p\u00ebrfaq\u00ebsit\u00eb p\u00ebrkat\u00ebse
  t\u00eb k\u00ebtyre vendeve. Aplikimi p\u00ebr t\u00eb miturit duhet t\u00eb n\u00ebnshkruhet
  nga prind\u00ebrit ose kujdestari ligjor, dhe t\u00eb miturit duhet t\u00eb pajisen
  me viz\u00eb n\u00eb pasaport\u00ebn e tyre personale. N\u00ebse p\u00ebr arsy\u00eb
  ligjore, nj\u00eb i mitur nuk mund t\u00eb ket\u00eb pasaport\u00eb n\u00eb vendin
  e tij t\u00eb origin\u00ebs, viz\u00eb e tij mund t\u00eb regjistrohet n\u00eb pasaport\u00ebn
  e prindit ose kujdestarit.\\n\\nShtetasi i huaj duhet t\u00eb aplikoj\u00eb personalisht
  n\u00eb konsulatat\u00eb ose online, dhe n\u00ebse nuk ka nj\u00eb p\u00ebrfaq\u00ebs\u00ebsi
  diplomatike shqiptare n\u00eb vendin ku ai banon, k\u00ebrkesa mund t\u00eb b\u00ebhet
  online ose me post\u00eb n\u00eb nj\u00eb p\u00ebrfaq\u00ebs\u00ebsi diplomatike
  t\u00eb autorizuar. **Dokamenti i udh\u00ebtimit i t\u00eb huajit duhet t\u00eb
  jet\u00eb i vlefsh\u00ebm t\u00eb pakt\u00ebn tre muaj pas largimit nga Shqip\u00ebria,
  t\u00eb ket\u00eb dy faqe bosh dhe t\u00eb jet\u00eb l\u00ebshuar brenda dhjet\u00eb
  viteve t\u00eb fundit.**\\n\\nL\u00ebshimi i viz\u00ebs p\u00ebr hyrje n\u00eb RSH
  realizohet nga p\u00ebrfaq\u00ebs\u00ebti diplomatike dhe postet konsullore t\u00eb
  Shqip\u00ebris\u00eb ose p\u00ebrfaq\u00ebs\u00ebti e vendeve t\u00eb treta sipas
  marr\u00ebveshjeve nd\u00ebrkomb\u00ebtare. Vizat, qoft\u00eb ato t\u00eb stampuara
  n\u00eb pasaport\u00eb apo elektronike, jepen vet\u00ebm pasi ka p\u00ebrfunduar
  procedura e vler\u00ebsimit t\u00eb k\u00ebrkes\u00ebs, q\u00eb kryhet nga autoritetet
  p\u00ebrkat\u00ebse brenda nj\u00eb periudhe deri n\u00eb 15 dit\u00eb, e cila mund
  t\u00eb zgjatet deri n\u00eb 30 dit\u00eb n\u00eb raste t\u00eb ve\u00e7anta. **Megjithat\u00eb,
  pajisja me viz\u00eb nuk garanton automatikisht hyrjen n\u00eb vend.**\\n\\n---\\n\\n60
  P\u00ebr m\u00eb shum\u00eb shih Nenin 20 t\u00eb ligjit Nr. 79 dat\u00eb 18.10.2021
  \u201cP\u00ebr t\u00eb huajt\u201d.\\n\\n61 VKM Nr. 858 dat\u00eb 29.12.2021 \u201cP\u00ebr
  p\u00ebrcaktimin e kriteveve, t\u00eb procedurave e t\u00eb dokumentacionit p\u00ebr
  hyrjen, q\u00ebndrimin dhe trajtimin e t\u00eb huajve n\u00eb Republik\u00ebn e
  Shqip\u00ebris\u00eb\u201d e ndryshuar https://qbz.gov.al/share/jkg1P7KaQSOm92Qf53j6mg\\n\\n62
  Nenin 23 i ligjit Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d.\\n\\n63
  Nenin 24, pika 4 e ligjit Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d.\\n\\nN\u00eb
  raste p\u00ebrjashtimore, nj\u00eb viz\u00eb mund t\u00eb l\u00ebshohet edhe n\u00eb
  kufi nga autoritetet vendore p\u00ebr kufirin dhe migracionin, p\u00ebr ata t\u00eb
  huaj q\u00eb nuk kan\u00eb pasur mund\u00ebsi reale t\u00eb aplikojn\u00eb paraprakisht
  p\u00ebr viz\u00eb dhe q\u00eb p\u00ebrbushin disa kritere t\u00eb caktuara. K\u00ebto
  viz\u00eb kan\u00eb nj\u00eb afat deri n\u00eb 15 dit\u00eb dhe jepen n\u00eb rrethana
  si emergjencia natyrore, aksidente, vdekje apo s\u00ebmundje t\u00eb an\u00ebtar\u00ebve
  t\u00eb familjes, si dhe p\u00ebr ekuiupazhet e anijeve apo avion\u00ebve q\u00eb
  p\u00ebrballen me probleme teknike ose mot t\u00eb keq. P\u00ebr k\u00ebta persona,
  nuk k\u00ebrkohet siguracion sh\u00ebndet\u00ebsor, p\u00ebrve\u00e7 rasteve humanitare.
  N\u00ebse konsiderohet e nevojshme, pajisja me viz\u00eb n\u00eb kufi mund t\u00eb
  refuzohet, dhe i huaji ka t\u00eb drejt\u00eb t\u00eb ankohet p\u00ebr k\u00ebt\u00eb
  vendim. Procedurat e l\u00ebshimit t\u00eb viz\u00ebs n\u00eb kufi jan\u00eb t\u00eb
  p\u00ebrcaktuara nga nj\u00eb udh\u00ebzim i p\u00ebrbashk\u00ebt mes disa ministrive
  dhe autoriteteve shtet\u00ebrore.\\n\\nSa i p\u00ebrket afatit t\u00eb q\u00ebndrimit,
  n\u00eb raste p\u00ebrjashtimore autoriteti p\u00ebrgjegj\u00ebs p\u00ebr kufirin
  dhe migracionin zgjat afatin e q\u00ebndrimit t\u00eb p\u00ebrcaktuar n\u00eb viz\u00ebn
  e l\u00ebshuar apo afatin e lejuar t\u00eb q\u00ebndrimit pa viz\u00eb, n\u00ebse
  i huaji k\u00ebrkon zgjatjen e q\u00ebndrimit para p\u00ebrfundimit t\u00eb afatit
  t\u00eb vlefsh\u00ebm t\u00eb q\u00ebndrimit, vet\u00ebm p\u00ebr arsyje serioze
  personale, motive q\u00eb vler\u00ebsohen t\u00eb nj\u00eb r\u00ebnd\u00ebsie t\u00eb
  ve\u00e7ant\u00eb, nj\u00eb forc\u00eb madhore ose humanitare, kur i huaji nuk ka
  pasur mund\u00ebsi t\u00eb largohet nga territori.\\n\\n- **Anullimi dhe refuzimi
  i viz\u00ebs**\\n\\nKa dhe raste t\u00eb p\u00ebrligjura kur viz\u00eb mund t\u00eb
  anulohet apo refuzohet nga autoriteti p\u00ebrgjegj\u00ebs. N\u00eb \u00e7do rast
  viz\u00eb mund t\u00eb anulohet nga ambasatat, postet konsulllore, ose autoritetet
  p\u00ebrgjegj\u00ebse kur ajo \u00ebsht\u00eb l\u00ebshuar n\u00eb kund\u00ebrshtrim
  me ligjin, me dokumente t\u00eb falsifikuara, ose n\u00ebse i huaji shpallet person
  i pad\u00ebshiruar. Anulimi mund t\u00eb b\u00ebhet edhe nga autoritetet kuftuante
  kur i huaji nuk p\u00ebrbush m\u00eb kushtet e viz\u00ebs. Arsyja e anulimit i njoftohet
  menj\u00ebher\u00eb dhe i huaji ka t\u00eb drejt\u00ebn e ankimit.\\n\\nRefuzimi
  i viz\u00ebs ndodh kur aplikuesi nuk plot\u00ebson kushtet e q\u00ebndrimit, paraqet
  dokumente t\u00eb falsifikuara, nuk ka burime financiare t\u00eb mj\u00ebftueshme,
  ose konsiderohet k\u00ebr\u00e7\u00ebnim p\u00ebr sigurin\u00eb. Vendimi p\u00ebr
  refuzim i komunikohet t\u00eb huajt, i cili ka t\u00eb drejt\u00ebn e ankimit ose
  mund t\u00eb riaplikoj\u00eb pas tre muajsh.\\n\\nNga ana tjet\u00ebr n\u00eb VKM
  Nr. 858 dat\u00eb 29.12.2021 \u201cP\u00ebr p\u00ebrcaktimin e kritereve, t\u00eb
  procedurave e t\u00eb dokumentacionit p\u00ebr hyrjen, q\u00ebndrimin dhe trajtimin
  e t\u00eb huajve n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d e ndryshuar
  \u00ebsht\u00eb p\u00ebrcaktuar edhe lista e vendeve, shtetasit e t\u00eb cilave
  hyjn\u00eb pa viz\u00eb n\u00eb RSH. T\u00eb huajt e p\u00ebrjashtuar nga detyrimi
  i pajisjes me viz\u00eb kan\u00eb t\u00eb drejt\u00eb t\u00eb hyjn\u00eb dhe t\u00eb
  q\u00ebndrojn\u00eb n\u00ebp\u00ebr nj\u00eb afat deri n\u00eb 90 dit\u00eb brenda
  180 dit\u00ebve nga hyrja, p\u00ebrve\u00e7 rasteve kur n\u00eb marr\u00ebveshje
  nd\u00ebrkomb\u00ebtare dy ose shum\u00ebpalesh\u00eb n\u00eb fuqi ose bazuar n\u00eb
  parimin e reciprocitetit apo q\u00ebndrimin e nj\u00ebansh\u00ebm, t\u00eb shprehur
  me vendim t\u00eb K\u00ebshillit t\u00eb Ministrave, parashikohet ndryshe.\\n\\nReferuar
  rasteve t\u00eb hyrjes pa viz\u00eb n\u00eb Shqip\u00ebri \u201cRaporti i 5 p\u00ebr
  regjimin e lir\u00eb vizave\u201d nga Komisioni Evropian, shprehet se p\u00ebrt\u00ebj
  rekordit pozitiv t\u00eb Shqip\u00ebris\u00eb n\u00eb adresimin e \u00e7\u00ebshtjeve
  t\u00eb lidhura me migracionin, u vu re se politika e vizave t\u00eb Shqip\u00ebris\u00eb
  devijonte nga standardet\\n\\n---\\n\\n64 Neni 25 t\u00eb ligjit Nr. 79 dat\u00eb
  18.10.2021 \u201cP\u00ebr t\u00eb huajt\u201d.\\n\\ne BE-s\u00eb duke lejuar udh\u00ebtime
  pa viza p\u00ebr shtetasit e disa vendeve t\u00eb treta, si Armenia, Azerbajxhani
  dhe Turqia, shumica e t\u00eb cil\u00ebve p\u00ebrballen me k\u00ebrkesa p\u00ebr
  viza nga BE-ja. P\u00ebr pasoj\u00eb nga ky raport Shqip\u00ebria u k\u00ebshillua
  t\u00eb p\u00ebrputhhte m\u00eb ngusht\u00eb politikat e saj t\u00eb vizave me rregulloret
  e BE-s\u00eb p\u00ebr t\u00eb shmangur rreziqet e mundshme t\u00eb migracionit t\u00eb
  parregullt dhe k\u00ebrc\u00ebnimeve t\u00eb siguris\u00eb.\\\\(^{65}\\\\)\\n\\nRasti
  Ahorugeze kund\u00ebr Suedis\u00eb,\\\\(^{66}\\\\) \u00ebsht\u00eb nj\u00eb \u00e7\u00ebshtje
  e r\u00ebnd\u00ebsishme e Gjykat\u00ebs Evropiane p\u00ebr t\u00eb Drejtat e Njeriut
  q\u00eb trajton refuzimin e nj\u00eb viz\u00eb p\u00ebr nj\u00eb individ nga Suedia.
  N\u00eb k\u00ebt\u00eb rast, Z. Ahorugeze, nj\u00eb shtetas i nj\u00eb vendi afrikani
  (Ruanda), kishte aplikuar p\u00ebr nj\u00eb viz\u00eb p\u00ebr t\u00eb hyr\u00eb
  n\u00eb Suedi dhe p\u00ebr t\u00eb vizituar disa t\u00eb af\u00ebrmi. Autoritetet
  suedeze refuzuan aplikimin e tij, duke argumentuar se ai nuk kishte paraqitur prova
  t\u00eb mjaftueshme p\u00ebr q\u00ebllimin e udh\u00ebtimit dhe p\u00ebr mbulimin
  e shpenzimeve gjat\u00eb q\u00ebndrimit n\u00eb Suedi. Ahorugeze e sfidoi k\u00ebt\u00eb
  refuzim n\u00eb Gjykat\u00ebn Evropiane p\u00ebr t\u00eb Drejtat e Njeriut, duke
  pretenduar se ky veprim kishte shkelur t\u00eb drejtat e tij n\u00ebn Konvent\u00ebn
  Evropiane p\u00ebr t\u00eb Drejtat e Njeriut, ve\u00e7an\u00ebrisht t\u00eb drejt\u00ebn
  p\u00ebr respektimin e jet\u00ebs familjare dhe t\u00eb drejt\u00ebn p\u00ebr nj\u00eb
  shqyrtim t\u00eb drejt\u00eb.\\n\\nGjykata shqyrtoi n\u00ebse refuzimi i viz\u00ebs
  p\u00ebrb\u00ebnte nj\u00eb shkelje t\u00eb t\u00eb drejtave t\u00eb garantuara
  nga Konventa. Pas nj\u00eb analize t\u00eb detajuar, GjEDNJ vendosi se Suedia nuk
  kishte shkelur t\u00eb drejtat e k\u00ebrkuarit. Gjykata theksoi se autoritetet
  suedeze kishin vepruar n\u00eb p\u00ebrpun\u00eb me ligjet dhe praktikat e tyre
  dhe se k\u00ebrkuari nuk kishte ofruar prova t\u00eb mjaftueshme q\u00eb t\u00eb
  justifikonin refuzimin e viz\u00ebs p\u00ebr t\u00eb mbajtur lidhjet e tij familjare
  n\u00eb Suedi.\\\\(^{67}\\\\)\\n\\nVendimi i Gjykat\u00ebs u b\u00eb p\u00ebrfundimtar
  m\u00eb 4 qershor 2012, duke konfirmuar se Suedia kishte vepruar brenda kufijve
  t\u00eb ligjit n\u00eb refuzimin e viz\u00ebs dhe se nuk kishte shkelur t\u00eb
  drejtat e k\u00ebrkuarit. Ky rast ilustron r\u00ebnd\u00ebsin\u00eb e p\u00ebrputhshm\u00ebris\u00eb
  me procedurat komb\u00ebtare t\u00eb vizave dhe shqyrtimin e ndjeshm\u00ebris\u00eb
  s\u00eb ndikimit q\u00eb mund t\u00eb ket\u00eb nj\u00eb refuzim viz\u00eb n\u00eb
  jet\u00ebn private dhe familjare t\u00eb individ\u00ebve.\\\\(^{68}\\\\)\\n\\n###
  4.2 Procedurat p\u00ebr marrjen e lejes s\u00eb q\u00ebndrimit dhe llojet e lejeve.\\n\\nReferuar
  legjislacionit n\u00eb fuqi, i huaji mund t\u00eb q\u00ebndroj\u00eb n\u00eb RSH
  p\u00ebr nj\u00eb periudh\u00eb afatshkurt\u00ebr, p\u00ebr nj\u00eb periudh\u00eb
  t\u00eb p\u00ebrkohshme, si dhe t\u00eb p\u00ebrhershme. Q\u00ebndrimi p\u00ebr
  nj\u00eb periudh\u00eb afatshkurt\u00ebr nuk mund t\u00eb kaloj\u00eb afatin 90
  dit\u00eb p\u00ebr 180 dit\u00eb, n\u00eb baz\u00eb t\u00eb viz\u00ebs s\u00eb l\u00ebshuar
  apo hyrjes pa viz\u00eb, p\u00ebrjashtuar kur p\u00ebrcaktohet ndryshe n\u00eb k\u00ebt\u00eb
  liq ose n\u00eb marr\u00ebveshje t\u00eb njohura nga Republika e Shqip\u00ebris\u00eb.
  Q\u00ebndrimi p\u00ebr nj\u00eb periudh\u00eb t\u00eb p\u00ebrkohshme dhe t\u00eb
  p\u00ebrhershme mund t\u00eb realizohet vet\u00ebm n\u00eb p\u00ebrmjet pajisjes
  t\u00eb t\u00eb huajit me leje q\u00ebndrimi.\\n\\n---\\n\\n\\\\(^{65}\\\\) Fifth
  report on EU visa-free regime Western Balkans Eastern Partnership countries, 2022
  [https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=COM%3A2022%3A715%3AREV1&qid=1670337341649](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=COM%3A2022%3A715%3AREV1&qid=1670337341649)\\n\\n\\\\(^{66}\\\\)
  *Case of Ahorugeze v. S\u00f6eden*, Application No. 37075/09, Judgment of 27 October
  2011, final on 4 June 2012. [https://hudoc.echr.coe.int/?i=001-107183](https://hudoc.echr.coe.int/?i=001-107183)\\n\\n\\\\(^{67}\\\\)
  Po aty.\\n\\n\\\\(^{68}\\\\) *Case of Ahorugeze v. S\u00f6eden*, Application No.
  37075/09, Judgment of 27 October 2011, final on 4 June 2012. [https://hudoc.echr.coe.int/?i=001-107183](https://hudoc.echr.coe.int/?i=001-107183)\\n\\nNumri
  i aplikimeve p\u00ebr leje q\u00ebndrimi n\u00eb Shqip\u00ebri, n\u00eb vitin 2023
  ishte 12.430 aplikime, duke sh\u00ebnuar nj\u00eb rritje me 22,7 %, krahasuar me
  vitin 2022. Aplikimet sipas vendit t\u00eb origin\u00ebs nga Kosova dhe Italia p\u00ebrb\u00ebjn\u00eb
  28,5 % t\u00eb aplikimeve gjithsej n\u00eb 2023. Vendet me numrin m\u00eb t\u00eb
  madh t\u00eb aplikimeve jan\u00eb Itali, Kosov\u00eb, Turqi, SHBA, Egipt, Filipine,
  Maqedoni e Veriut, Bangladesh, Siri, dhe 5.342 nga shtete e tjera.\\n\\nLeja e q\u00ebndrimit
  l\u00ebshohet sipas motiveve t\u00eb m\u00ebposhtme:\\n\\na) p\u00ebr motive t\u00eb
  bashkimit familjar;\\nb) p\u00ebr motive studimi (student dhe nx\u00ebn\u00ebs);\\nc)
  p\u00ebr t\u00eb trajnuar pa pages\u00eb;\\nd) p\u00ebr *au pairs*;\\ne) p\u00ebr
  shk\u00ebmbime rinore;\\nf) p\u00ebr k\u00ebrkim shkencor;\\ng) p\u00ebr k\u00ebrkimin
  e pun\u00ebs ose sip\u00ebrmarrjen p\u00ebr k\u00ebrkuesit shkencor\u00eb dhe student\u00ebt;\\nh)
  p\u00ebr raste humanitare;\\ni) p\u00ebr viktimat e trafikimit t\u00eb qenieve njer\u00ebzore;\\nj)
  p\u00ebr personat pa shtet\u00ebsi;\\nk) p\u00ebr leje unike q\u00ebndrimi p\u00ebr
  motive pune, si:\\n   - leje unike si pun\u00ebmarr\u00ebs;\\n   - leje unike p\u00ebr
  pun\u00ebsim stinor;\\n   - leje unike p\u00ebr t\u00eb transferuar brenda nd\u00ebrmarrjes;\\n   -
  leje unike si pun\u00ebtor nd\u00ebrkuftitar;\\n   - leje unike p\u00ebr formim
  profesional;\\n   - leje unike p\u00ebr sportist\u00eb;\\n   - leje unike p\u00ebr
  sh\u00ebrbim vullnetar;\\n   - leje unike p\u00ebr punonj\u00ebs me kualifikim t\u00eb
  lart\u00eb;\\n   - leje unike p\u00ebr persona t\u00eb vet\u00ebpun\u00ebsuar;\\n   -
  leje unike p\u00ebr punonj\u00ebs l\u00ebviz\u00ebs digital;\\n   - leje unike p\u00ebr
  investitor\u00eb;\\n   - leje unike p\u00ebr sh\u00ebrbime kontraktuese;\\n   -
  leje unike p\u00ebr kategori t\u00eb ve\u00e7anta.\\nl) p\u00ebr ekuipazhin e mjeteve
  t\u00eb lundrimit;\\nm) p\u00ebr leje q\u00ebndrimi p\u00ebr p\u00ebrdorim t\u00eb
  pasuris\u00eb s\u00eb paluajtshme n\u00eb pron\u00ebsi;\\nn) p\u00ebr leje q\u00ebndrimit
  p\u00ebr pensionist\u00ebt.\\n\\nReferuar ligjit p\u00ebr t\u00eb huajt llojet e
  lejeve t\u00eb q\u00ebndrimit kategorizohen si m\u00eb posht\u00eb:\\n\\na) leje
  q\u00ebndrimi e tipit \u201cA\u201d, e cila i jep t\u00eb drejt\u00ebn mbajt\u00ebsit
  vet\u00ebm t\u00eb q\u00ebndrojn\u00eb n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb
  brenda afatit kohor p\u00ebr t\u00eb cil\u00ebn ajo l\u00ebshohet;\\n\\n---\\n\\n69
  INSTAT. T\u00eb huajt n\u00eb shqip\u00ebri 2023. [https://www.instat.gov.al/media/13789/publikimi-te-huajt-ne-shqiperi-2023_shqip.pdf](https://www.instat.gov.al/media/13789/publikimi-te-huajt-ne-shqiperi-2023_shqip.pdf)\\n\\n70
  Shih neni 39 i Ligjit \u201cP\u00ebr t\u00eb huaj\u201d\\n\\n71 Shih neni 32 i Ligjit
  \u201cP\u00ebr t\u00eb huaj\u201d\\n\\nb) leje q\u00ebndrimi ose leje unike e tipit
  \u201cB\u201d, e rip\u00ebrt\u00ebrithshme, e cila l\u00ebshohet me afat t\u00ebp\u00ebrcaktuar
  dhe i jep t\u00eb drejt\u00ebn mbajt\u00ebsit t\u00eb hyj\u00eb, t\u00eb q\u00ebndroj\u00eb
  dhe t\u00eb dal\u00eb n\u00eb/nga Republika e Shqip\u00ebris\u00eb brenda afateve
  t\u00eb p\u00ebrcaktuara n\u00eb t\u00eb;\\n\\nc) leje q\u00ebndrimi ose leje unike
  e tipit \u201cC\u201d, e cila l\u00ebshohet me afat t\u00eb p\u00ebrhersh\u00ebm
  dhe i jep t\u00eb drejt\u00ebn mbajt\u00ebsit t\u00eb hyj\u00eb, t\u00eb q\u00ebndroj\u00eb
  dhe t\u00eb dal\u00eb n\u00eb/nga Republika e Shqip\u00ebris\u00eb;\\n\\nd) leje
  q\u00ebndrimi unike \u201cKart\u00eb blu AL\u201d, e rip\u00ebrt\u00ebrithshme,
  e cila l\u00ebshohet me afat t\u00eb p\u00ebrcaktuarvet\u00ebm p\u00ebr punonj\u00ebs
  me kualifikim t\u00eb lart\u00eb dhe i jep t\u00eb drejt\u00ebn mbajt\u00ebsit t\u00eb
  hyj\u00eb, t\u00eb q\u00ebndroj\u00eb dhe t\u00eb dal\u00eb n\u00eb/nga Republika
  e Shqip\u00ebris\u00eb brenda afateve t\u00eb p\u00ebrcaktuara n\u00eb t\u00eb;\\n\\ne)
  leje q\u00ebndrimi \u201cKart\u00eb blu AL-C\u201d, e cila l\u00ebshohet me afat
  t\u00eb p\u00ebrhersh\u00ebm vet\u00ebm p\u00ebr punonj\u00ebsme kualifikim t\u00eb
  lart\u00eb dhe i jep t\u00eb drejt\u00ebn mbajt\u00ebsit t\u00eb hyj\u00eb, t\u00eb
  q\u00ebndroj\u00eb dhe t\u00eb dal\u00eb n\u00eb/nga Republika e Shqip\u00ebris\u00eb.\\n\\nLeje
  q\u00ebndrimi e tipit \u201cA\u201d: Kjo leje i jep t\u00eb drejt\u00ebn mbajt\u00ebsit
  vet\u00ebm t\u00eb q\u00ebndroj\u00eb n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb
  p\u00ebr nj\u00eb periudh\u00eb t\u00eb caktuar. Nuk i jep t\u00eb drejt\u00ebn
  t\u00eb punoj\u00eb ose t\u00eb ket\u00eb akses n\u00eb tregun e pun\u00ebs. \u00cbsht\u00eb
  nj\u00eb leje q\u00ebndrimi m\u00eb e thjesht\u00eb, e l\u00ebshuar p\u00ebr q\u00ebllime
  specifike si\u00e7 \u00ebsht\u00eb q\u00ebndrimi afatshkurt\u00ebr p\u00ebr turiz\u00ebm,
  trajtim mjek\u00ebsor, etj.\\n\\nLeje q\u00ebndrimi ose leje unike e tipit \u201cB\u201d:
  Kjo leje \u00ebsht\u00eb e rip\u00ebrt\u00ebrithshme dhe i jep mbajt\u00ebsit t\u00eb
  drejt\u00ebn t\u00eb hyj\u00eb, t\u00eb q\u00ebndroj\u00eb dhe t\u00eb dal\u00eb
  nga Republika e Shqip\u00ebris\u00eb brenda nj\u00eb periudh\u00eb t\u00eb caktuar.
  Mund t\u00eb jet\u00eb e vlefshme p\u00ebr q\u00ebllime t\u00eb ndryshme, p\u00ebrshir\u00eb
  edhe p\u00ebr pun\u00ebsim, dhe \u00ebsht\u00eb m\u00eb fleksible krahasuar me tipin
  \u201cA\u201d.\\n\\nLeje q\u00ebndrimi ose leje unike e tipit \u201cC\u201d: Leje
  me afat t\u00eb p\u00ebrhersh\u00ebm, q\u00eb i jep mbajt\u00ebsit t\u00eb drejt\u00ebn
  t\u00eb hyj\u00eb, t\u00eb q\u00ebndroj\u00eb dhe t\u00eb dal\u00eb nga Republika
  e Shqip\u00ebris\u00eb n\u00eb \u00e7do koh\u00eb. Kjo leje u jepet individ\u00ebve
  q\u00eb kan\u00eb plot\u00ebsuar kriteret p\u00ebr q\u00ebndrim t\u00eb p\u00ebrhersh\u00ebm,
  pas nj\u00eb periudh\u00eb t\u00eb caktuar q\u00ebndrimi n\u00eb vend.\\n\\nSipas
  ligjit nr. 79/2021 \u00ebsht\u00eb parashikuar leja e q\u00ebndrimit unike \u201cKarta
  blu AL\u201d dhe \u201cKarta blu AL-C\u201d. Leja e q\u00ebndrimit \u201cKarta blu
  AL\u201d l\u00ebshohet me afat t\u00eb p\u00ebrcaktuar vet\u00ebm p\u00ebr punonj\u00ebs
  me kualifikim t\u00eb lart\u00eb dhe i jep t\u00eb drejt\u00ebn mbajt\u00ebsit t\u00eb
  hyj\u00eb, t\u00eb q\u00ebndroj\u00eb dhe t\u00eb dal\u00eb n\u00eb/nga Republika
  e Shqip\u00ebris\u00eb brenda afateve t\u00eb p\u00ebrcaktuara n\u00eb t\u00eb.
  Kjo leje l\u00ebshohet p\u00ebr nj\u00eb afat 2-vje\u00e7ar dhe mund t\u00eb rip\u00ebrt\u00ebrihet
  p\u00ebr nj\u00eb periudh\u00eb 3-vje\u00e7are. Nd\u00ebrkohe leja e q\u00ebndrimit
  \u201cKart\u00eb blu AL-C\u201d, e cila l\u00ebshohet me afat t\u00eb p\u00ebrhersh\u00ebm
  vet\u00ebm p\u00ebr punonj\u00ebs me kualifikim t\u00eb lart\u00eb. Autoriteti p\u00ebrgjegj\u00ebs
  p\u00ebr kufirin dhe migracionin pajis t\u00eb huajin me leje unike \u201cKart\u00eb
  blu AL\u201d p\u00ebr pun\u00eb me kualifikim t\u00eb lart\u00eb vet\u00ebm n\u00ebse
  ka marr\u00eb m\u00eb par\u00eb miratimin e Agjencis\u00eb Komb\u00ebtare t\u00eb
  Pun\u00ebsimit dhe Aft\u00ebsive p\u00ebr punonj\u00ebs t\u00eb kualifikuar dhe
  kur p\u00ebrmbush kushtet p\u00ebr marrjen e nj\u00eb lejeje q\u00ebndrimi \u201cKart\u00eb
  blu AL\u201d.\\n\\nLigji nr. 79/2021 \u201cP\u00ebr t\u00eb huajt\u201d nd\u00ebr
  risit q\u00eb solli ishte kombinon lejen e q\u00ebndrimit dhe t\u00eb pun\u00ebs
  n\u00eb nj\u00eb dokument t\u00eb vet\u00ebm, duke e b\u00ebr\u00eb procesin m\u00eb
  t\u00eb thjesht\u00eb dhe m\u00eb t\u00eb shpejt\u00eb p\u00ebr t\u00eb huajt q\u00eb
  duan t\u00eb punojn\u00eb dhe jetojn\u00eb n\u00eb Shqip\u00ebri. Kjo risi synonte
  reduktimin e burokracis\u00eb dhe koh\u00ebn e p\u00ebrpunimit p\u00ebr marrjen
  e lejeve.\\n\\nT\u00eb gjitha kriteret dhe dokumentacioni i nevojsh\u00ebm p\u00ebr
  pajisje me leje q\u00ebndrimi \u00ebsht\u00eb i p\u00ebrcaktuar n\u00eb VKM Nr.
  858 dat\u00eb 29.12.2021 \u201cP\u00ebr p\u00ebrcaktimin e kritereve, t\u00eb procedurave
  e t\u00eb dokumentacionit p\u00ebr hyrjen, q\u00ebndrimin dhe trajtimin e t\u00eb
  huajve n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d e ndryshuar.\\n\\nV.
  Procedurat p\u00ebr t\u00eb p\u00ebrfshitur mbrojtjen nd\u00ebrkomb\u00ebtare dhe
  statusin e refugjatit\\n\\nRepublika e Shqip\u00ebris\u00eb garanton t\u00eb drejt\u00ebn
  p\u00ebr azil t\u00eb shtetasit t\u00eb huaj ose personit pa shtet\u00ebsi, i cili
  ndodhet jasht\u00eb vendit t\u00eb shtet\u00ebsis\u00eb s\u00eb vet ose jasht\u00eb
  vendbanimit t\u00eb zakonsh\u00ebm t\u00eb m\u00ebparsh\u00ebm dhe nuk ka mund\u00ebsi
  ose d\u00ebshir\u00eb t\u00eb k\u00ebrkoj\u00eb mbrojtjen e atij vendi p\u00ebr
  shkak t\u00eb:\\n\\n1. frik\u00ebs s\u00eb bazuar p\u00ebr t\u00eb qen\u00eb i persektuar\\n2.
  p\u00ebr arsy\u00eb t\u00eb rac\u00ebs,\\n3. t\u00eb besimit fetar,\\n4. t\u00eb
  komb\u00ebsis\u00eb,\\n5. t\u00eb an\u00ebtar\u00ebsis\u00eb n\u00eb nj\u00eb grup
  t\u00eb caktuar shoq\u00ebror ose t\u00eb bindjes politike.\\n\\nReferuar ligjit
  Nr. 10 dat\u00eb 24.02.2021 \u201cP\u00ebr azilin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d
  (k\u00ebtu dhe n\u00eb vijim \u201cLigji P\u00ebr Azilin\u201d) \u201cAzil\u201d
  \u00ebsht\u00eb forma e mbrojtjes nd\u00ebrkomb\u00ebtare q\u00eb Republika e Shqip\u00ebris\u00eb
  u jep refugjat\u00ebve dhe personave n\u00eb mbrojtje plot\u00ebsuese. Nd\u00ebrsa
  \u201cAzilk\u00ebrkuves\u201d \u00ebsht\u00eb \u00e7do shtetas i huaj ose person
  pa shtet\u00ebsi, q\u00eb ka paraqitur k\u00ebrkes\u00eb p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare,
  p\u00ebr t\u00eb cil\u00ebn nuk \u00ebsht\u00eb marr\u00eb ende nj\u00eb vendim
  p\u00ebrfundimtar i form\u00ebs s\u00eb prer\u00eb.\\n\\nKryesisht Shqip\u00ebria
  ashtu si dhe vendet e tjera t\u00eb Ballkanit Per\u00ebndimor, Shqip\u00ebria ka
  qen\u00eb vend tranxit p\u00ebr emigrant\u00ebt dhe refugjatat\u00eb dhe jo destinacion.
  Megjithat\u00eb, autoritetet shqiptare kan\u00eb b\u00ebr\u00eb p\u00ebrpijakje
  n\u00eb p\u00ebrgjigje t\u00eb flukseve t\u00eb tilla migratore p\u00ebr t\u00eb
  ofruar t\u00eb gjitha sh\u00ebrbimet e nevojshme dhe p\u00ebr nj\u00eb reagim efikas
  ndaj azilk\u00ebrkuvesve dhe p\u00ebr mbrojtjen e refugjat\u00ebve. Nd\u00ebrsa
  vitet fundit vihet re se n\u00eb shqip\u00ebri ka patur rritje t\u00eb numrit t\u00eb
  azilk\u00ebrkuvesve.\\n\\nReferuar Departamentit t\u00eb Kufirit dhe Migracionit,
  pran\u00eb Drejtoris\u00eb s\u00eb P\u00ebrgjithshme t\u00eb Policis\u00eb s\u00eb
  Shtetit, n\u00eb vitin 2023, rezultojn\u00eb 261 azilk\u00ebrkuves, duke sh\u00ebnuar
  nj\u00eb rritje, krahasuar me nj\u00eb vit m\u00eb par\u00eb, ku kishim 125 azilk\u00ebrkuves.
  Azilk\u00ebrkuvesit me origjin\u00eb nga Afganistani z\u00ebn\u00eb 61,7 % t\u00eb
  azilk\u00ebrkuvesve gjithsej dhe rezultojn\u00eb 161 persona.\\n\\nNd\u00ebr parimet
  kryesore ku bazohet ky ligj, diktuar dhe nga Konventa e Gjenev\u00ebs, vlen t\u00eb
  p\u00ebrmendet parimi i moskthimit, nd\u00ebrkoh\u00eb q\u00eb respektimi i t\u00eb
  drejtave dhe lirive themelore t\u00eb sanksionuara dhe nga konventat e tjera nd\u00ebrkomb\u00ebtare,
  ndalimi i d\u00ebbimit, e drejta p\u00ebr lirin\u00eb nga tortura dhe trajtimi mizor,
  \u00e7njer\u00ebzor dhe degradues, e drejta e procedurave dhe garancive ligjore
  p\u00ebr ndihm\u00ebn juridike falas nga shteti, e drejta p\u00ebr kushtet minimale
  t\u00eb jet\u00ebs\u00ebs, p\u00ebr kujdes\\n\\n---\\n\\n72 https://qbz.gov.al/share/09E93V77RY2YpX3Fe7eWmg\\n73
  Neni 5 i ligjit Nr. 10 dat\u00eb 24.02.2021 \u201cP\u00ebr azilin n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d.\\n74 Azilk\u00ebrkuvesit n\u00eb Shqip\u00ebri 2023,
  INSTAT https://www.instat.gov.al/media/13767/azilkerkuesit-dt-03072024.pdf\\n\\nsh\u00ebndet\u00ebsor,
  p\u00ebr arsimim, p\u00ebr pun\u00ebsim dhe trajnim\u00eb profesionale, e drejt\u00eb
  p\u00ebr bashkim familjar, p\u00ebr t\u00eb pasur nj\u00eb p\u00ebrkthyes, apo dhe
  e drejt\u00eb e ankimitimit, mbeten kryefjala e k\u00ebtij ligji.\\n\\nParimi i
  moskthimit \u00ebsht\u00eb nj\u00eb nga parimet m\u00eb t\u00eb r\u00ebnd\u00ebsishme
  t\u00eb s\u00eb drejt\u00ebs nd\u00ebrkom\u00ebtare, i cili vepron kryesisht n\u00eb
  fush\u00ebn e t\u00eb drejtave t\u00eb njeriut, duke i dh\u00ebn\u00eb atyre aktualisht
  nj\u00eb dimension t\u00eb ri. Ky parim i ndalon shtetet q\u00eb t\u00eb kthejn\u00eb
  mbrapa, d\u00ebbojn\u00eb ose ekstradojn\u00eb nj\u00eb person t\u00eb caktuar,
  n\u00eb territorret e shteteve ku ka dyshime te bazuara se atij i k\u00ebr\u00e7\u00ebnohet
  seriozisht jeta ose liria, p\u00ebr shkak t\u00eb rac\u00ebs, besimit, komb\u00ebsis\u00eb
  an\u00ebtar\u00ebsis\u00eb n\u00eb nj\u00eb grup t\u00eb caktuar shoq\u00ebror ose
  p\u00ebr shkak t\u00eb bindjeve politike t\u00eb tij.\\n\\nN\u00eb nenin 33 paragrafi
  i par\u00eb i Konvent\u00ebs s\u00eb Refugiat\u00ebve t\u00eb vitit 1951 p\u00ebrcaktohet
  se \u201cPal\u00ebt Kontraktuase nuk do t\u00eb d\u00ebbojn\u00eb nj\u00eb refugjat
  q\u00eb ndodhet ligj\u00ebrish\u00ebt n\u00eb territorin e tyre, p\u00ebrve\u00e7
  n\u00eb rastin kur cenohet sigurimi komb\u00ebtar\u00eb ose rendit publik.\u201d
  Pra ky nen nuk e mbron refugiatin nga kthimi n\u00ebse ka arsye t\u00eb besueshme
  se refugjati p\u00ebrb\u00ebn rrezik p\u00ebr vendin n\u00eb t\u00eb cilin ai ose
  ajo \u00ebsht\u00eb, ose i cili ka qen\u00eb d\u00ebnuar me vendim gjykat\u00eb
  p\u00ebr kryerjen e nj\u00eb krimi q\u00eb p\u00ebrb\u00ebn rrezik p\u00ebr komunitetin
  e atij vendi. Nga interpretimi i k\u00ebtij nenit v\u00ebrejm\u00eb q\u00eb parimi
  moskthimit n\u00eb nenin 33 t\u00eb Konvent\u00ebs kufizohet nga 2 arsy\u00eb t\u00eb
  cilat jan\u00eb:\\n\\n1. Cenimi i siguris\u00eb komb\u00ebtar\u00eb ose rendit publik;\\n2.
  Bindja nga gjykat\u00eb se p\u00ebrb\u00ebn rrezik p\u00ebr komunitetin.\\n\\nK\u00ebto
  kufizime i gjejm\u00eb t\u00eb sanksionuara n\u00eb paragrafin e dyt\u00eb t\u00eb
  nenit 33 t\u00eb Konvent\u00ebs dhe do ti trajtojm\u00eb m\u00eb gj\u00ebr\u00ebsisht
  n\u00eb vijim.\\n\\n5.1 Procedura p\u00ebr Shqyrtimin e K\u00ebrkes\u00ebs p\u00ebr
  Mbrojtje Nd\u00ebrkom\u00ebtare (Azil) dhe Statusi i Refugiatit\\n\\nSipas legjislacionit
  n\u00eb fuqi shtetas\u00eb i huaj ose personi pa shtet\u00ebsi (k\u00ebtu dhe n\u00eb
  vijim \u201cAzilk\u00ebrkuesi\u201d) mund t\u00eb shpreh\u00eb q\u00ebllimin p\u00ebr
  t\u00eb k\u00ebrkuar mbrojtje nd\u00ebrkom\u00ebtare, verbalisht ose n\u00eb form\u00eb
  t\u00eb shkruar, n\u00eb momentin e hyrjes n\u00eb territorin e Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb, n\u00eb nj\u00eb pik\u00eb t\u00eb kalimit kufitar,
  n\u00eb nj\u00eb stacion t\u00eb Policis\u00eb s\u00eb Shtetit, pran\u00eb autoritetit
  p\u00ebr\u00e7gjegj\u00ebs p\u00ebr kufirin dhe migracionin. Autoriteti vendor p\u00ebr
  kufirin dhe migracionin \u00ebsht\u00eb autoriteti shtet\u00ebror p\u00ebr\u00e7gjegj\u00ebs
  p\u00ebr kryerjen e procedur\u00ebs s\u00eb p\u00ebr\u00e7gjedhjes dhe regjistrimit
  t\u00eb shtetasit t\u00eb huaj ose personit pa shtet\u00ebsi, q\u00eb ka paraqitur
  k\u00ebrkes\u00eb p\u00ebr mbrojtje nd\u00ebrkom\u00ebtare n\u00eb pikat e kalimit
  kufitar ose brenda territorit t\u00eb RSH.\u201d\\n\\n75\\n\\nMbrojtja nd\u00ebrkom\u00ebtare
  i referohet dy formave:76\\n\\n1. \u201cMbrojtja plot\u00ebsuese\u201d \u00ebsht\u00eb
  form\u00eb mbrojtjeje q\u00eb i jepet shtetasit t\u00eb huaj ose personit pa shtet\u00ebsi,
  q\u00eb nuk i p\u00ebrmbush kriteret p\u00ebr t\u00eb fituar statusin e refugjatit
  dhe ka arsye serioze e t\u00eb bazuara t\u00eb mendohet se n\u00eb rast t\u00eb
  kthimit t\u00eb tij n\u00eb vendin e origjin\u00ebs apo n\u00eb rastin e personit
  pa shtet\u00ebsi n\u00eb vendbanimin e tij t\u00eb zakonsh\u00ebm t\u00eb m\u00ebparsh\u00ebm,
  ai\\n\\n---\\n\\n75 Urdh\u00ebr Nr. 247, dat\u00eb 3.6.2021 \u201cP\u00ebr p\u00ebrcaktimin
  e procedurave dhe rregullave t\u00eb d\u00ebrgimit t\u00eb k\u00ebrkes\u00ebs p\u00ebr
  mbrojtje nd\u00ebrkom\u00ebtare nga Autoritati P\u00ebr\u00e7gjegj\u00ebs p\u00ebr
  Kufirin dhe Migracionin tek Autoritati P\u00ebr\u00e7gjegj\u00ebs p\u00ebr Azilin
  dhe Refugjatet\u201d https://qbz.gov.al/share/gzkV9_QqTDK7-3rTMek1ne\\n76 Neni 5
  pika 19 dhe 20 e ligjit Nr. 10 dat\u00eb 24.02.2021 \u201cP\u00ebr azilin n\u00eb
  Republik\u00ebn e Shqip\u00ebris\u00eb\u201d.\\n\\nrrezikon realisht t\u00eb p\u00ebrballet
  me cenime t\u00eb r\u00ebnda dhe nuk ka mund\u00ebsi, apo p\u00ebr shkak t\u00eb
  rrezikut t\u00eb till\u00eb nuk d\u00ebshiron t\u00eb p\u00ebrfitoj\u00eb nga mbrojtja
  e atij vendi.\\n\\n2. \u201cMbrojtje e p\u00ebrkohshme\u201d \u00ebsht\u00eb nj\u00eb
  procedur\u00eb e ve\u00e7ant\u00eb mbrojtjeje, e cila u siguron mbrojtje t\u00eb
  menj\u00ebhershme dhe t\u00eb p\u00ebrkohshme personave t\u00eb shp\u00ebrngulur
  n\u00eb rastet e flukseve masive, t\u00eb cil\u00ebt nuk mund t\u00eb kthehen n\u00eb
  vendin e tyre t\u00eb origjin\u00ebs, n\u00eb ve\u00e7anti, n\u00ebse ekziston rreziku
  q\u00eb sistemi i azilit t\u00eb jet\u00eb i paaft\u00eb t\u00eb procedoj\u00eb
  me k\u00ebt\u00eb fluk, pa krijuar efekte t\u00eb pafavororshme n\u00eb funksionimin
  e tij efektiv, n\u00eb interes t\u00eb k\u00ebtyre personave.\\n\\nAzilk\u00ebrkuesi,
  brenda 15 dit\u00ebve nga paraqitja e k\u00ebrkes\u00ebs p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare,
  informohet p\u00ebr procedur\u00ebn p\u00ebr p\u00ebrcaktimin e statusit t\u00eb
  mbrojtjes, t\u00eb drejtat dhe detyrimet n\u00eb nj\u00eb procedur\u00eb t\u00eb
  till\u00eb, kushtet e pritjes, t\u00eb drejt\u00ebn p\u00ebr t\u00eb kontaktuar
  me p\u00ebrfaq\u00ebsues t\u00eb UNHCR-s\u00eb n\u00eb \u00e7do faz\u00eb t\u00eb
  procedur\u00ebs, me pasojat e mundshme n\u00eb rast t\u00eb mos p\u00ebrmbushjes
  s\u00eb detyrimeve dhe mosbashk\u00ebpunimit me autoritetet p\u00ebrgjegj\u00ebse
  si dhe t\u00eb drejt\u00ebn p\u00ebr ndihm\u00eb ligjore. Ky informacion jetep n\u00eb
  m\u00ebnyr\u00eb verbale dhe, n\u00ebse \u00ebsht\u00eb e nevojshme, sigurohet edhe
  n\u00eb form\u00eb t\u00eb shkruar, gjithmon\u00eb n\u00eb gjuh\u00ebn q\u00eb azilk\u00ebrkuesi
  kupton.\\n\\nN\u00eb koh\u00ebn e plot\u00ebsimit t\u00eb formuluarit t\u00eb p\u00ebrcaktimit
  t\u00eb statusit p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare, autoriteti p\u00ebrgjegj\u00ebs
  p\u00ebr azilin dhe refugiat\u00ebt informon k\u00ebrkuasin dhe me p\u00eblqimin
  e tij mund\u00ebson kontaktin me nj\u00eb specialist n\u00eb \u00e7\u00ebshtjet
  e azilit, p\u00ebr sh\u00ebrbime ligjore falas. Ky i fundit me shpenzimet e tij
  ka t\u00eb drejt\u00eb t\u00eb zgjedh\u00eb nj\u00eb p\u00ebrfaq\u00ebsues, i cili
  do ta ndihmoj\u00eb dhe do ta p\u00ebrfaq\u00ebsoj\u00eb at\u00eb gjat\u00eb procedur\u00ebs
  p\u00ebr p\u00ebrcaktimin e statusit t\u00eb mbrojtjes nd\u00ebrkomb\u00ebtare.\\n\\nP\u00ebrfaq\u00ebsuesi
  i autorizuar ka t\u00eb drejt\u00eb t\u00eb njihet me informacionin n\u00eb dosjen
  e Azilk\u00ebrkuesis, por mund t\u2019i mohohet aksesi n\u00eb dosjen e k\u00ebrkuesis,
  kur zbulimi i informatave ose burimeve rrezikon sigurin\u00eb komb\u00ebtare, sigurin\u00eb
  e organizatave apo personave q\u00eb ofrojn\u00eb informacionin, sigurin\u00eb e
  personit t\u00eb cilit i referohet informacioni, kur cenohen interesat e hetimit
  n\u00eb lidhje me shqyrtimin e k\u00ebrkes\u00ebs nga autoriteti p\u00ebrgjegj\u00ebs
  p\u00ebr azilin dhe refugiat\u00ebt ose rezikohen marr\u00ebdh\u00ebniet nd\u00ebrkom\u00ebtare
  t\u00eb RSH. P\u00ebrjashtimisht, n\u00eb k\u00ebto raste informacioni mund t\u2019i
  lejohet nj\u00eb p\u00ebrfaq\u00ebsuesi ligjor i cili \u00ebsht\u00eb i pajisur
  me certifikat\u00eb t\u00eb siguris\u00eb p\u00ebr njohjen e informacionit t\u00eb
  klasifikuar.\\n\\nGjat\u00eb k\u00ebsaj periudhe deri n\u00eb dh\u00ebnien e vendimit
  p\u00ebrfundimtar ose t\u00eb form\u00ebs s\u00eb prer\u00eb nga gjykata, k\u00ebrkuasi
  lejohet t\u00eb Azilk\u00ebrkuesi ka t\u00eb drejt\u00eb t\u00eb q\u00ebndroj\u00eb
  n\u00eb Qendr\u00ebn Komb\u00ebtare Prit\u00ebse p\u00ebr Azilk\u00ebrkues brenda
  territorit t\u00eb RSH dhe nuk mund t\u00eb k\u00ebrkoj\u00eb leje q\u00ebndrimi
  me motiv tjet\u00ebr n\u00eb baz\u00eb t\u00eb ligjit p\u00ebr t\u00eb huajt. N\u00ebse
  azilk\u00ebrkuesi i \u00ebsht\u00eb refuzuar aplikimi p\u00ebr azil, i lejohet t\u00eb
  q\u00ebndroje n\u00eb territor apo t\u00eb akomodohet n\u00eb qend\u00ebr derisa
  t\u00eb mbarojn\u00eb procedurat e ankimimit apo afatet p\u00ebr ushtrimin e tyre.\\n\\nAutoriteti
  P\u00ebrgjegj\u00ebs p\u00ebr Azilin dhe Refugiat\u00ebt fillon procedur\u00ebn
  e intervistimit t\u00eb azilk\u00ebrkuesisit brenda nj\u00eb kohe sa m\u00eb t\u00eb
  shkurter q\u00eb t\u00eb jet\u00eb e mundur nga paraqitja e k\u00ebrkes\u00ebs ku
  i garantohej konfidencialiteti. Azilk\u00ebrkuesi intervistohet personalisht pa
  pranim\u00eb e an\u00ebtar\u00ebve t\u00eb familjes, p\u00ebrve\u00e7 rastit kur
  struktura p\u00ebrgjegj\u00ebse n\u00eb ministrin\u00eb p\u00ebrkat\u00ebse p\u00ebr
  \u00e7\u00ebshtjet e azilit dhe refugiat\u00ebt e konsideron t\u00eb nevojshme pranim\u00eb
  e tyre p\u00ebr t\u00eb zhvilluar shqyrtimin e duhur t\u00eb k\u00ebrkes\u00ebs.\\n\\nProcedura
  p\u00ebr shqyrtimin e k\u00ebrkes\u00ebs p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare
  nis sapo personi q\u00eb k\u00ebrkon mbrojtje plot\u00ebson formularin p\u00ebr
  p\u00ebrcaktimin e statusit t\u00eb mbrojtjes pran\u00eb autoritetit p\u00ebrgjegj\u00ebs.
  Autoriteti p\u00ebrgjegj\u00ebs p\u00ebr azilin dhe refugiat\u00ebt vler\u00ebsojn\u00eb
  n\u00ebse k\u00ebrkuesi plot\u00ebson kushtet p\u00ebr t\u00eb marr\u00eb statusin
  e refugjatit ose mbrojtje plot\u00ebsuese, duke i dh\u00ebn\u00eb mund\u00ebsin\u00eb
  t\u00eb dor\u00ebzoj\u00eb dhe shp\u00ebjgoj\u00eb t\u00eb gjitha provat dhe dokumentet
  q\u00eb lidhen me k\u00ebrkes\u00ebn e tij.\\n\\nAzilk\u00ebrkuesi ka p\u00ebr detyr\u00eb
  t\u00eb paraqes\u00eb sa m\u00eb shpejt t\u00eb gjitha dokumentet e nevojshme q\u00eb
  lidhen me mosh\u00ebn, identitetin, komb\u00ebsin\u00eb, historin\u00eb e udh\u00ebtimeve
  dhe arsyet q\u00eb e kan\u00eb detyruar t\u00eb k\u00ebrkojn\u00eb mbrojtje nd\u00ebrkomb\u00ebtare.
  Gjat\u00eb shqyrtimit t\u00eb k\u00ebrkes\u00ebs, autoritetet marrin n\u00eb konsiderat\u00eb
  informacione nga burime nd\u00ebrkomb\u00ebtare, si EASO dhe UNHCR, p\u00ebr situat\u00ebn
  n\u00eb vendin e origjin\u00ebs s\u00eb k\u00ebrku\u00ebsit dhe vendet e tranzitit.\\n\\nDeklaratat
  e azilk\u00ebrku\u00ebsit vler\u00ebsohen s\u00eb bashku me dokumentet e paraqitura
  dhe situat\u00ebn personale t\u00eb tij, si orientimi seksual apo mosha, p\u00ebr
  t\u00eb vler\u00ebsuar n\u00ebse \u00ebsht\u00eb persektuuar p\u00ebr k\u00ebto
  arsyet. N\u00ebse k\u00ebrkuesi nuk mund t\u00eb siguroj\u00eb dokumente mb\u00ebshtet\u00ebse,
  deklarata e tij mund t\u00eb konsiderohet e besueshme, me kusht q\u00eb t\u00eb
  ket\u00eb b\u00ebr\u00eb p\u00ebrpjekje t\u00eb singerta p\u00ebr t\u00eb justifikuar
  k\u00ebrkes\u00ebn dhe informacioni i dh\u00ebn\u00eb t\u00eb jet\u00eb koherent
  dhe n\u00eb p\u00ebrpunje me faktet.\\n\\nN\u00eb disa raste, autoritetet mund t\u00eb
  k\u00ebrkojn\u00eb d\u00ebshmi shtes\u00eb p\u00ebr t\u00eb marr\u00eb vendimin
  p\u00ebrfundimtar p\u00ebr k\u00ebrkes\u00ebn e mbrojtjes nd\u00ebrkomb\u00ebtare.\\n\\nGjat\u00eb
  shqyrtimit t\u00eb k\u00ebrkes\u00ebs Autoriteti p\u00ebrgjegj\u00ebs p\u00ebr azilin
  dhe refugiat\u00ebt mund t\u00eb vendos\u00eb me nj\u00eb vendim t\u00eb nd\u00ebrmjet\u00ebm
  nd\u00ebrprerjen e procedur\u00ebs p\u00ebr p\u00ebrcaktimin e statusit t\u00eb
  mbrojtjes nd\u00ebrkomb\u00ebtare n\u00eb rastet kur:\\n\\na) kur k\u00ebrkuesi
  t\u00ebrheq k\u00ebrkes\u00ebn p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare;\\nb) kur
  k\u00ebrkuesi largohet nga vendgjendrimi i fundit p\u00ebr m\u00eb shum\u00eb se
  3 (tri) dit\u00eb pa njoftuar autoritetin p\u00ebrgjegj\u00ebs p\u00ebr azilin dhe
  refugiat\u00ebt, p\u00ebrve\u00e7 rasteve kur k\u00ebrkuesi v\u00ebrteton brenda
  nj\u00eb kohe t\u00eb arsyeshme se largimi i tij dhe moslajm\u00ebrimi kan\u00eb
  ndodhur \u201cp\u00ebr shkaqe t\u00eb justifikueshme\u201d ose \u201cp\u00ebr shkaqe
  q\u00eb nuk varen prej tij\u201d;\\nc) nuk \u00ebsht\u00eb paraqitur n\u00eb intervist\u00eb
  n\u00eb dat\u00ebn e komunikuar p\u00ebr zhvillimin e intervist\u00ebs dhe nuk ka
  njoftuar autoritetin p\u00ebrgjegj\u00ebs p\u00ebr azilin dhe refugiat\u00ebt p\u00ebr
  arsyet e mosparaqitjes, brenda 3 (tri) dit\u00ebve;\\nd) \u00ebsht\u00eb larguar
  nga Republika e Shqip\u00ebris\u00eb gjat\u00eb procedur\u00ebs s\u00eb shqyrtimit
  t\u00eb k\u00ebrkes\u00ebs, pa dijenin\u00eb e autoritetit p\u00ebrgjegj\u00ebs
  p\u00ebr azilin dhe refugiat\u00ebt.\\n\\nProcedura p\u00ebr p\u00ebrcaktimin e
  statusit t\u00eb mbrojtjes nd\u00ebrkomb\u00ebtare nga Autoriteti P\u00ebrgjegj\u00ebs
  p\u00ebr Azilin dhe Refugiat\u00ebt zgjat 6- muaj nga data e paraqitjes s\u00eb
  k\u00ebrkes\u00ebs. P\u00ebr raste t\u00eb ve\u00e7anta t\u00eb parashikuara n\u00eb
  ligj ky afat mund t\u00eb zgjatet p\u00ebr nj\u00eb periudh\u00eb shtes\u00eb prej
  3- muajsh por n\u00eb \u00e7do rast Autoriteti P\u00ebrgjegj\u00ebs p\u00ebr Azilin
  dhe Refugiat\u00ebt p\u00ebrfundon shqyrtimin brenda afatit maksimal kohor prej
  21 muajsh nga paraqitja e k\u00ebrkes\u00ebs.\\n\\nN\u00eb p\u00ebrfundim t\u00eb
  procedur\u00ebs s\u00eb shqyrtimit t\u00eb k\u00ebrkes\u00ebs, Autoriteti P\u00ebrgjegj\u00ebs
  p\u00ebr Azilin dhe Refugiat\u00ebt merr vendim n\u00ebp\u00ebrmjet t\u00eb cilit:\\n\\na)
  njeh statusin e refugjatit;\\nb) refuzon statusin e refugjatit dhe njeh statusin
  e mbrojtjes plot\u00ebsuese;\\n\\nc) refuzon k\u00ebrkes\u00ebn p\u00ebr mbrojtje
  nd\u00ebrkomb\u00ebtare;\\nd) nd\u00ebrpret procedur\u00ebn p\u00ebr p\u00ebrcaktimin
  e statusit t\u00eb mbrojtjes nd\u00ebrkomb\u00ebtare;\\ne) pushon shqyrtimin e k\u00ebrkes\u00ebs
  p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare.\\n\\nVendimi i autoritetit p\u00ebrgjegj\u00ebs
  n\u00eb ministrin\u00eb p\u00ebrkat\u00ebse p\u00ebr \u00e7\u00ebshtjet e azilit
  dhe refugiat\u00ebt merret n\u00eb nj\u00eb mbledhje t\u00eb posa\u00e7me me shumic\u00eb
  votash. Vendimi p\u00ebrpilohet me shkrim dhe arsyetohet. N\u00eb rastin kur punonj\u00ebsit
  e autoritetit p\u00ebrgjegj\u00ebs n\u00eb ministrin\u00eb p\u00ebrkat\u00ebse p\u00ebr
  \u00e7\u00ebshtjet e azilit dhe refugiat\u00ebt, t\u00eb cil\u00ebt jan\u00eb n\u00eb
  pakic\u00eb, mund ta shprehin me shkrim mendimin e tyre kund\u00ebr, i cili i bashk\u00eblidhet
  vendimit p\u00ebrfundimtar. Nj\u00eb kopje e vendimit t\u00eb autoritetit p\u00ebrgjegj\u00ebs
  n\u00eb ministrin\u00eb p\u00ebrkat\u00ebse p\u00ebr \u00e7\u00ebshtjet e azilit
  dhe refugiat\u00ebt i komunikohet k\u00ebrkuuesit dhe UNHCR-s\u00eb drit\u00ebra
  5 dit\u00ebve nga data e marrjes t\u00eb vendimit.\\n\\nN\u00eb raste t\u00eb p\u00ebrligjura
  autoriteti p\u00ebrgjegj\u00ebs p\u00ebr azilin dhe refugiat\u00ebt mund t\u00eb
  marr\u00eb vendim p\u00ebr zbatimin e procedur\u00ebs s\u00eb p\u00ebrshtejtuar,
  n\u00eb p\u00ebrputhje me parimet dhe garancit\u00eb themelore.\\n\\nNj\u00eb k\u00ebrkes\u00eb
  p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare mund t\u00eb konsiderohet e papranueshme
  n\u00ebse azilk\u00ebrkuesi tashm\u00eb ka marr\u00eb mbrojtje nga nj\u00eb shtet
  an\u00ebtar n\u00eb BE-s\u00eb ose nj\u00eb shtet tjeter i sigurt, ose n\u00ebse
  k\u00ebrkesa \u00ebsht\u00eb p\u00ebrs\u00ebritur pa informacione t\u00eb reja.
  Autoriteti q\u00eb shqyrton k\u00ebrkes\u00ebn siguron q\u00eb azilk\u00ebrkuuesi
  t\u00eb informohet p\u00ebr konceptin e \\\"shtetit t\u00eb sigurt t\u00eb origjin\u00ebs\\\"
  dhe t''i jepet mund\u00ebsia t\u00eb kund\u00ebrshtoj\u00eb vendimin. N\u00ebse
  nj\u00eb vend i tret\u00eb nuk lejon hyrjen e k\u00ebrkuesit, autoriteti p\u00ebrgjegj\u00ebs
  siguron qasje n\u00eb procedur\u00ebn e azilit.\\n\\nK\u00ebrkesat mund t\u00eb
  refuzohen n\u00ebse ato jan\u00eb duksh\u00ebm t\u00eb pabazuara, q\u00eb do t\u00eb
  thot\u00eb se nuk p\u00ebrmbajn\u00eb ndonj\u00eb lidhje me kriteret p\u00ebr mbrojtje
  nd\u00ebrkomb\u00ebtare, ose k\u00ebrkuesi ka dh\u00ebn\u00eb informacione t\u00eb
  rrreme ose ka hyr\u00eb n\u00eb Shqip\u00ebri n\u00eb m\u00ebnyr\u00eb t\u00eb paligjshme
  dhe nuk \u00ebsht\u00eb paraqitur brenda nj\u00eb afati prej 10 dit\u00ebsh. K\u00ebrkesat
  refuzohen gjithashtu n\u00ebse k\u00ebrkuesi p\u00ebrmb\u00ebn rrezik p\u00ebr sigurin\u00eb
  komb\u00ebtare ose rendin publik.\\n\\nK\u00ebrkesa e re p\u00ebr mbrojtje mund
  t\u00eb paraqitet n\u00ebse ka fakte dhe t\u00eb dh\u00ebna t\u00eb reja q\u00eb
  mund t\u00eb ndikojn\u00eb n\u00eb kualifikimin p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare,
  dhe n\u00ebse konstatohen, ajo do t\u00eb shqyrtohet sipas procedur\u00ebs s\u00eb
  rregullt.\\n\\nAzilk\u00ebrkuesi, i cili deklaron q\u00ebllimin p\u00ebr paraqiten
  e k\u00ebrkes\u00ebs p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare, transferohet n\u00eb
  Qendr\u00ebn e Pritjes p\u00ebr Azil, ku ka t\u00eb drejt\u00eb t\u00eb q\u00ebndroj\u00eb
  deri n\u00eb momentin kur merret vendimi p\u00ebrfundimtar.\\n\\nSipas VKM Nr. 630
  , dat\u00eb 27.10.2021 \u201cP\u00ebr organizimin dhe funksionimin e Qendr\u00ebs
  s\u00eb Pritjes p\u00ebr Azil\u201d , Qendra e Pritjes p\u00ebr Azil (QPA) ka k\u00ebto
  p\u00ebrgjegj\u00ebsi:\\n\\na) organizon pun\u00ebn p\u00ebr t\u00eb siguruar pranimin
  kolektiv t\u00eb k\u00ebrkuesve p\u00ebr mbrojtjend\u00ebrkomb\u00ebtare;\\n\\n---\\n\\n77
  Shih neni 43 i Ligjit p\u00ebr Azilin\\n78 VKM Nr. 630 , dat\u00eb 27.10.2021 \u201cP\u00ebr
  organizimin dhe funksionimin e Qendr\u00ebs s\u00eb Pritjes p\u00ebr Azil\u201d\\nhttps://qbz.gov.al/share/bxigSAJlRKK7p3RdXh0WDg\\n\\nb)
  organizon pun\u00ebn p\u00ebr t\u00eb siguruar ofrimin e standardeve t\u00eb jetes\u00ebs
  s\u00eb p\u00ebrshtatshme p\u00ebr k\u00ebrkuarit\u00eb e mbrojtjes nd\u00ebrkomb\u00ebtare;\\nc)
  organizon pun\u00ebn p\u00ebr t\u00eb siguruar zhvillimin e programeve pedagogjike
  e edukuese dhe k\u00ebshillimin ligjor falas p\u00ebr k\u00ebrkuarit\u00eb e mbrojtjes
  nd\u00ebrkomb\u00ebtare.\\n\\n- **Mbrojtja e p\u00ebrkohshme nd\u00ebrkomb\u00ebtare**\\n\\nSa
  i p\u00ebrket mbrojtjes s\u00eb p\u00ebrkohshme n\u00eb Shqip\u00ebri u ofrohet
  shtetasve t\u00eb huaj ose personave pa shtetesi q\u00eb vijn\u00eb n\u00eb m\u00ebnyr\u00eb
  masive nga nj\u00eb vend, ku p\u00ebr arsyet e luft\u00ebs ose situat\u00ebs s\u00eb
  ngjashme, t\u00eb dhun\u00ebs s\u00eb p\u00ebrgjithshme ose konfliktit t\u00eb brendsh\u00ebm,
  t\u00eb karakterizuara nga shkelje t\u00eb t\u00eb drejtave t\u00eb njeriut, kur
  shteti, nga i cili kan\u00eb ardhur, nuk mund t\u00eb garantojn\u00eb mbrojtjen
  e tyre. Ajo jepet p\u00ebr nj\u00eb periudh\u00eb 1-vje\u00e7are me vendim t\u00eb
  K\u00ebshillit t\u00eb Ministrave, duke pasur parasysh kushtet ekonomike dhe sigurin\u00eb
  komb\u00ebtare, dhe mund t\u00eb zgjatet deri n\u00eb 3 vjet n\u00ebse vazhdojn\u00eb
  kushtet n\u00eb vendin nga kan\u00eb ardhur personat e mbrojtur, t\u00eb cilat p\u00ebrb\u00ebnin
  baz\u00ebn e vendimit p\u00ebr dh\u00ebnien e mbrojtjes. Personat q\u00eb p\u00ebrfitojn\u00eb
  nga kjo mbrojtje kan\u00eb t\u00eb drejt\u00eb t\u00eb aplikojn\u00eb p\u00ebr mbrojtje
  nd\u00ebrkomb\u00ebtare (azil) gjat\u00eb k\u00ebsaj periudhe. P\u00ebrjashtime
  nga mbrojtja b\u00ebhet p\u00ebr rastet kur personit p\u00ebr t\u00eb cilin ka arsye
  serioze t\u00eb konsiderohet se:\\n\\na) ka kryer krim kund\u00ebr paqes, krim luft\u00eb
  ose krim kund\u00ebr njer\u00ebzimit, t\u00eb p\u00ebrcaktuara n\u00eb instrumentet
  nd\u00ebrkomb\u00ebtare t\u00eb hartuara p\u00ebr krim\u00eb t\u00eb tilla;\\nb)
  ka kryer nj\u00eb krim t\u00eb r\u00ebnd\u00eb jopolitik jasht\u00eb Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb para pranimit t\u00eb tij si person q\u00eb g\u00ebzon
  mbrojtje t\u00eb p\u00ebrkohshme. Ky p\u00ebrcaktim zbatohet edhe p\u00ebr pjes\u00ebmarr\u00ebsit
  n\u00eb krim dhe/ose p\u00ebr nxit\u00ebsit e tij;\\nc) \u00ebsht\u00eb shpallur
  fajtor p\u00ebr akte q\u00eb jan\u00eb n\u00eb kund\u00ebrshtim me q\u00ebllimet
  dhe parimet e Kombeve t\u00eb Bashkuara;\\nd) paraqet rrezik p\u00ebr sigurin\u00eb
  komb\u00ebtare dhe rendin publik t\u00eb RSH.\\n\\nMbrojtja e p\u00ebrkohshme p\u00ebrfundon
  n\u00eb rastet kur kalon afati i p\u00ebrcaktuar nga K\u00ebshilli i Ministrave,
  kur nuk ekzistojn\u00eb m\u00eb arsyet p\u00ebr t\u00eb, kur i huaji largohet nga
  Shqip\u00ebria, kur i jepet nj\u00eb lloj tjet\u00ebr mbrojtjeje ose kur i huaji
  d\u00ebbohet. P\u00ebr kthimin e personave, autoritetet p\u00ebrgjegj\u00ebse mund\u00ebsojn\u00eb
  kthimin vullnetar, duke respektuar dinjitetin e tyre. Nd\u00ebrsa n\u00eb rastet
  e kthimit me forc\u00eb, merren parasysh faktor\u00eb humanitar\u00eb. Gjithashtu,
  autoriteti p\u00ebrgjegj\u00ebs kujdeset p\u00ebr personat q\u00eb nuk mund t\u00eb
  udh\u00ebtojn\u00eb p\u00ebr arsyet sh\u00ebndet\u00ebsore, duke mos i d\u00ebbuar
  deri n\u00eb p\u00ebrmir\u00ebsimin e gjendjes. K\u00ebrkesat p\u00ebr kthim vullnetar
  vler\u00ebsohen bazuar n\u00eb situat\u00ebn n\u00eb vendin e origjin\u00ebs.\\n\\nPersonat
  q\u00eb p\u00ebrfitojn\u00eb mbrojtjen e p\u00ebrkohshme kan\u00eb t\u00eb drejt\u00eb:79\\n\\na)
  t\u00eb q\u00ebndrojn\u00eb n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb sipas
  koh\u00ebzgjatjes s\u00eb mbrojtjes s\u00eb p\u00ebrkohshme;\\nb) t\u00eb ken\u00eb
  kushtet themelore t\u00eb jetes\u00ebs dhe t\u00eb strehimit, n\u00eb p\u00ebrpunhje
  me mund\u00ebsit\u00eb ekonomike t\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb;\\nc)
  t\u00eb p\u00ebrfitojn\u00eb kujdes sh\u00ebndet\u00ebsor;\\nd) p\u00ebr arsim parauniversitar
  n\u00eb t\u00eb nj\u00ebjtat kushte me shtetasit shqiptar\u00eb;\\n\\n---\\n\\n79
  Per me teper shih Ligjin \u201cP\u00ebr Azilin\u201d\\n\\ne) p\u00ebr ushtrimin
  e mendimit, besimit fetar dhe lirin\u00eb e fes\u00eb sipas bindjeve t\u00eb tyre,
  n\u00eb p\u00ebrputhje me parashikimet e legjislacionit p\u00ebrkat\u00ebs n\u00eb
  fuqi;\\nf) p\u00ebr pun\u00eb dhe trajnime profesionale;\\ng) p\u00ebr ndihm\u00eb
  juridike t\u00eb garantuar nga shteti.\\n\\nP\u00ebrjashtimisht, nj\u00eb i huaj
  n\u00ebn mbrojtje t\u00eb p\u00ebrkohshme g\u00ebzon t\u00eb drejt\u00ebn p\u00ebr
  t\u00eb k\u00ebrkuar bashkim familjar vet\u00ebm n\u00ebse kjo e drejt\u00eb nuk
  mund t\u00eb realizohet n\u00eb asnj\u00eb vend tjet\u00ebr, p\u00ebrve\u00e7se
  n\u00eb territorin e RSH.\\n\\n5.1.1 Pushimi, shfuqizimi, humbja e mbrojtjes nd\u00ebrkom\u00ebtare\\n\\nStatusi
  i refugjatit mund t\u00eb humbet kur personi vendos vullnetarisht t\u00eb kthehet
  n\u00eb vendin e origjin\u00ebs, fiton shtet\u00ebsi t\u00eb re dhe g\u00ebzon mbrojtje
  nga shteti i ri, ose n\u00ebse rr\u00ebthanat q\u00eb e b\u00ebjn\u00eb t\u00eb
  nevojshme mbrojtjen nd\u00ebrkom\u00ebtare ndryshojn\u00eb n\u00eb m\u00ebnyr\u00eb
  t\u00eb r\u00ebnd\u00ebsishme dhe t\u00eb q\u00ebndrueshme. Gjithashtu, humb\u00ebt
  statusin n\u00ebse largohet nga territori i Shqip\u00ebris\u00eb pa njoftuar autoritetet
  p\u00ebrkat\u00ebse.\\\\(^{80}\\\\)\\n\\nStatusi mund t\u00eb shfuqizohet n\u00ebse
  \u00ebsht\u00eb bazuar n\u00eb informacione t\u00eb rreme, personi p\u00ebrben k\u00ebr\u00e7enim
  p\u00ebr sigurin\u00eb komb\u00ebtare, apo \u00ebsht\u00eb d\u00ebnuar p\u00ebr
  krime t\u00eb r\u00ebnda q\u00eb cenonin\u00eb rendin publik. P\u00ebrpara marrjes
  s\u00eb vendimit p\u00ebr shfuqizim, personi njoftohet dhe i jepet mund\u00ebsia
  p\u00ebr t\u00eb paraqitur pretendimet e tij.\\n\\nStatusi i mbrojtjes plot\u00ebsuese
  pushon kur rr\u00ebthanat q\u00eb e justifikonin at\u00eb ndryshojn\u00eb n\u00eb
  m\u00ebnyr\u00eb t\u00eb q\u00ebndrueshme ose kur personi heq dor\u00eb vullnetarisht
  nga mbrojtja ose largohet nga Shqip\u00ebria pa njoftuar autoritetet. N\u00ebse
  k\u00ebto rr\u00ebthana jan\u00eb t\u00eb p\u00ebrkohshme ose personi mund t\u00eb
  paraqes\u00eb arsy\u00eb bind\u00ebse q\u00eb rrjedhin nga p\u00ebrndjekjet e m\u00ebparshme,
  statusi i mbrojtjes plot\u00ebsuese mund t\u00eb mos pushoj\u00eb. Statusi gjithashtu
  mund t\u00eb shfuqizohet p\u00ebr shkak t\u00eb mashtrimit, rrezikut p\u00ebr sigurin\u00eb
  komb\u00ebtare, ose p\u00ebrjashtimeve t\u00eb tjera sipas ligjit.\\n\\n- **A mundet
  q\u00eb nj\u00eb person pa shtet\u00ebsi t\u00eb jet\u00eb dhe refugjat?**\\n\\nPashtet\u00ebsia
  nuk p\u00ebrben persekutim n\u00ebn p\u00ebrkufizimin e refugjatit t\u00eb p\u00ebrcaktuar
  n\u00eb Konvent\u00ebn p\u00ebr Refugjatin e vitit 1951, por ajo mund t\u00eb jet\u00eb
  nj\u00eb element i persekutimit t\u00eb marr\u00eb n\u00eb m\u00ebnyr\u00eb t\u00eb
  p\u00ebrmbledhur me faktor\u00eb t\u00eb tjer\u00eb. Hedja arbitrar\u00eb e shtet\u00ebsis\u00eb
  mbi baza diskriminuese mund t\u00eb krijoj\u00eb shkak\u00eb p\u00ebr nj\u00eb frik\u00eb
  t\u00eb bazuar mbi persekutimin, ve\u00e7an\u00ebrisht kur rezulton n\u00eb pashtet\u00ebsi.
  Konventa e Gjenev\u00ebs\u00eb 1951 garanton t\u00eb drejtat e refugjat\u00ebve,
  duke p\u00ebrfshir\u00eb dhe ata q\u00eb jan\u00eb pa shtet\u00ebsi, nd\u00ebrkoh\u00eb
  q\u00eb Konventa e vitit 1954 \u00ebsht\u00eb projektuar p\u00ebr personat pa shtet\u00ebsi,
  t\u00eb cil\u00ebt nuk jan\u00eb refugjat\u00eb. N\u00eb rastet kur nj\u00eb person
  kualifikohet p\u00ebr t\u00eb dy statuset, prevalon Konventa e Refugjatit t\u00eb
  vitit 1954.\\n\\n\\\\(^{80}\\\\) Neni 39 i Ligjit \u201cP\u00ebr Azilin\u201d\\n\\n5.1.2
  Persona q\u00eb i p\u00ebrkasin kategoris\u00eb s\u00eb ve\u00e7ant\u00eb dhe f\u00ebmij\u00ebt
  e pashoq\u00ebruar\\n\\nPersona q\u00eb i p\u00ebrkasin kategoris\u00eb s\u00eb
  ve\u00e7ant\u00eb jan\u00eb f\u00ebmij\u00ebt, f\u00ebmij\u00ebt e pashoq\u00ebruar,
  personat me aft\u00ebsi t\u00eb kufizuara, personat e moshuar, grat\u00eb shtatz\u00ebna,
  prind i vet\u00ebm me f\u00ebmij\u00eb t\u00eb mitur, viktimat e trafikimit t\u00eb
  qenieve njer\u00ebzore, viktimat e gjymitmit gjinital, LGBTI, personat me s\u00ebmundje
  t\u00eb r\u00ebnd\u00eb, personat me probleme/\u00e7rrregullime t\u00eb sh\u00ebndetit
  mendor ose personat, t\u00eb cil\u00ebt kan\u00eb qen\u00eb subjekt i tortur\u00ebs,
  p\u00ebrdhunimit apo ndonj\u00eb forme tjeter t\u00eb dhun\u00ebs psikologjike,
  fizike apo seksuale.\\n\\nN\u00eb p\u00ebrputhje me ligjin p\u00ebr azilin dhe refugjatat\u00eb,
  persona q\u00eb i p\u00ebrkasin kategoris\u00eb s\u00eb ve\u00e7ant\u00eb trajtohen
  me v\u00ebmendje dhe kujdes t\u00eb ve\u00e7ant\u00eb nga autoritetet p\u00ebrgjegj\u00ebse.
  Ky ligj siguron q\u00eb k\u00ebta individ\u00eb, t\u00eb cil\u00ebt mund t\u00eb
  jen\u00eb k\u00ebrkues, refugjat\u00eb, persona n\u00ebn mbrojtje plot\u00ebsuese
  ose p\u00ebrkohshme, t\u00eb marrin trajtimin e nevojsh\u00ebm n\u00eb p\u00ebrputhje
  me nevojat e tyre t\u00eb ve\u00e7anta.\\n\\nNevojat e k\u00ebtyre individ\u00ebve
  p\u00ebrcaktohen n\u00ebp\u00ebrmjet vler\u00ebsimit individual t\u00eb \u00e7do
  k\u00ebrkuesi. Pjes\u00ebtar\u00ebt e k\u00ebsaj kategorie p\u00ebrfitojn\u00eb
  nj\u00eb trajtim t\u00eb ndrysh\u00ebm q\u00eb p\u00ebrfshin akomodimin e p\u00ebrshtatsh\u00ebm,
  kushte t\u00eb ve\u00e7anta pranimi, trajtim mjek\u00ebsor dhe k\u00ebshillim psikosocial
  t\u00eb nevojsh\u00ebm. P\u00ebr ata q\u00eb kan\u00eb p\u00ebrfjetuar tortur\u00eb,
  p\u00ebrdhunim, ose forma t\u00eb tjera t\u00eb dhun\u00ebs s\u00eb r\u00ebnd\u00eb,
  ligji parashikon nj\u00eb trajtim t\u00eb plot\u00eb dhe t\u00eb duhur p\u00ebr
  d\u00ebmet e shkaktuara, duke p\u00ebrfshir\u00eb mund\u00ebsin\u00eb p\u00ebr trajtim
  mjek\u00ebsor dhe psikologjik t\u00eb nevojsh\u00ebm.\\n\\nPersonat q\u00eb punojn\u00eb
  me viktimat e dhun\u00ebs duhet t\u00eb ken\u00eb marr\u00eb trajnimin e duhur dhe
  t\u00eb respektojn\u00eb rregullat e konfidencialitetit p\u00ebr informacionin q\u00eb
  mblidhet gjat\u00eb pun\u00ebs s\u00eb tyre.\\n\\nN\u00eb lidhje me procedurat e
  ve\u00e7anta dhe garancit\u00eb e pranimit, k\u00ebrkuesit p\u00ebrfitojn\u00eb
  mb\u00ebshtetje n\u00eb p\u00ebrputhje me rrethanat e tyre personale, si mosha,
  gjinia, orientimi seksual, identiteti gjinor, aft\u00ebsit\u00eb e kufizuara, s\u00ebmundjet
  e r\u00ebnd\u00eb, \u00e7rrregullimet mendore, ose si rezultat i tortur\u00ebs dhe
  dhun\u00ebs t\u00eb tjera t\u00eb r\u00ebnd\u00eb. K\u00ebto procedura mbik\u00ebqyrjen
  vazdimisht nga punonj\u00ebs t\u00eb trajnuar posa\u00e7\u00ebrisht, q\u00eb nga
  momenti i shprehjes s\u00eb q\u00ebllimit p\u00ebr t\u00eb k\u00ebrkuar mbrojtje
  nd\u00ebrkomb\u00ebtare deri n\u00eb marrjen e vendimit p\u00ebrfundimtar.\\n\\nN\u00eb
  raste t\u00eb caktuara, si p\u00ebr viktimat e tortur\u00ebs dhe dhun\u00ebs s\u00eb
  r\u00ebnd\u00eb, procedura e p\u00ebrshtpejtuar nuk zbatohet n\u00ebse nuk sigurohet
  mb\u00ebshtetje e duhur. P\u00ebr k\u00ebrkuesit me probleme t\u00eb sh\u00ebndetit
  mendor, caktohet nj\u00eb p\u00ebrfaq\u00ebsues q\u00eb do t\u2019i ndihmoj\u00eb
  gjat\u00eb procedur\u00ebs p\u00ebr shqyrtimin e k\u00ebrkes\u00ebs p\u00ebr mbrojtje
  nd\u00ebrkomb\u00ebtare.\\n\\nN\u00eb Shqip\u00ebri n\u00eb m\u00ebnyr\u00eb t\u00eb
  ve\u00e7ant\u00eb trajtohen edhe f\u00ebmij\u00ebt e pashoq\u00ebruar\\\\(^{81}\\\\)
  q\u00eb k\u00ebrkojn\u00eb mbrojtje nd\u00ebrkomb\u00ebtare \u00ebsht\u00eb i irregulluar
  me kujdes p\u00ebr t\u00eb siguruar mbrojtjen e duhur t\u00eb t\u00eb drejtave t\u00eb
  tyre. Ligji per Azilin parashikon se kur nj\u00eb f\u00ebmij\u00eb i pashoq\u00ebruar
  shpreh q\u00ebllimin p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare n\u00eb Shqip\u00ebri,
  ai merr mbrojtje dhe caktohet nj\u00eb kujdestar n\u00eb p\u00ebrputhje me ligjin.
  Autoritetet p\u00ebr kufirin dhe migracionin njoftojn\u00eb menj\u00ebher\u00eb
  struktur\u00ebn e sh\u00ebrbimeve shoq\u00ebrore n\u00eb bashki. Brenda pes\u00eb
  dit\u00ebve nga vendimi p\u00ebr mbrojtje, punonj\u00ebsi p\u00ebr mbrojtjen e f\u00ebmij\u00ebs\\n\\n---\\n\\n\\\\(^{81}\\\\)
  Shi nen i Ligjit \u201cP\u00ebr azilin\u201d\\n\\ndepoziton k\u00ebrkes\u00ebn n\u00eb
  gjykat\u00eb p\u00ebr t\u00eb certifikuar mas\u00ebn emergjente t\u00eb mbrojtjes
  ose mas\u00ebn e mbrojtjes p\u00ebr p\u00ebrkujdesjen alternative dhe p\u00ebr kujdestari.\\n\\nF\u00ebmij\u00ebt
  e pashoq\u00ebruar nuk mund t\u00eb intervistohen pa qen\u00eb t\u00eb shoq\u00ebruar
  nga punonj\u00ebsi i mbrojtjes s\u00eb f\u00ebmij\u00ebs, i cili vepron n\u00eb
  interesin m\u00eb t\u00eb lart\u00eb t\u00eb f\u00ebmij\u00ebs dhe mund t\u00eb
  ndryshohet vet\u00ebm n\u00ebse \u00ebsht\u00eb e nevojshte. Kujdestari informon
  f\u00ebmij\u00ebn p\u00ebr kuptimin dhe pasojat e mundshme t\u00eb intervist\u00ebs
  dhe, kur \u00ebsht\u00eb e nevojshte, si t\u00eb p\u00ebrgatitet p\u00ebr t\u00eb.\\n\\nKur
  nj\u00eb f\u00ebmij\u00eb i pashoq\u00ebruar intervistotohet p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare,
  intervista zhvillohet nga nj\u00eb n\u00ebpun\u00ebs q\u00eb ka njohuri p\u00ebr
  nevojat e ve\u00e7anta t\u00eb f\u00ebmij\u00ebs. Autoritetet p\u00ebr azilin dhe
  refugiat\u00ebt b\u00ebjn\u00eb p\u00ebrprpjeke t\u00eb vazhdueshme p\u00ebr t\u00eb
  gjetur prind\u00ebr\u00ebt ose t\u00eb af\u00ebrmit e f\u00ebmij\u00ebs dhe koordinon
  vendosjen e f\u00ebmij\u00ebs n\u00eb nj\u00eb ambient t\u00eb p\u00ebrshtatsh\u00ebm,
  qoft\u00eb me t\u00eb af\u00ebrmit e rritur, nj\u00eb familje kujdestare, n\u00eb
  qendra t\u00eb specializuara p\u00ebr f\u00ebmij\u00ebt, ose n\u00eb akomodim tjet\u00ebr
  t\u00eb p\u00ebrshtatsh\u00ebm.\\n\\nN\u00eb raste kur ka kerc\u00ebnime p\u00ebr
  jet\u00ebn ose integritetin e f\u00ebmij\u00ebs, informacioni p\u00ebr ata persona
  duhet t\u00eb mbledhet dhe t\u00eb p\u00ebrpunohet n\u00eb m\u00ebnyr\u00eb konfidenciale.
  P\u00ebr aq sa \u00ebsht\u00eb e mundur, v\u00ebllez\u00ebr\u00ebt dhe motrat mbahen
  s\u00eb bashku duke marr\u00eb n\u00eb konsiderat\u00eb interesin m\u00eb t\u00eb
  lart\u00eb t\u00eb f\u00ebmij\u00ebve dhe ndryshimet e vendq\u00ebndrimit kuftizohen
  sa m\u00eb shum\u00eb t\u00eb jet\u00eb e mundur.\\n\\nP\u00ebr sa i p\u00ebrket
  vizitave mjek\u00ebsore, f\u00ebmij\u00ebt e pashoq\u00ebruar mund t\u00eb n\u00ebnshtrohen
  nj\u00eb vizite p\u00ebr t\u00eb p\u00ebrcaktuar mosh\u00ebn e tyre n\u00ebse ka
  dyshime. Vizita kryhet me respekt p\u00ebr dinjitetin e f\u00ebmij\u00ebs dhe nga
  profesionist\u00eb t\u00eb kualifikuar, dhe rezultatat e saj shqyrtohen nga autoritetet
  p\u00ebr azilin dhe refugiat\u00ebt. N\u00eb rastet e vizit\u00ebs, f\u00ebmija
  duhet t\u00eb informohet n\u00eb nj\u00eb gjysh\u00eb q\u00eb kupton dhe t\u00eb
  jap\u00eb p\u00eblqimin p\u00ebr vizit\u00ebn, dhe refuzimi i vizit\u00ebs nuk ndalon
  shqyrtimin e k\u00ebrkes\u00ebs p\u00ebr mbrojtj\\n\\nTrajtimi dhe mbrojtja e f\u00ebmij\u00ebve
  t\u00eb pashoq\u00ebruar jan\u00eb \u00e7\u00ebshtje t\u00eb ndjeshme q\u00eb k\u00ebrkojn\u00eb
  v\u00ebmendje t\u00eb ve\u00e7ant\u00eb nga autoritetet dhe organizatat nd\u00ebrkomb\u00ebtare.\\n\\n\u00c7far\u00eb
  konsiderohen si sfida p\u00ebr trajtimin e k\u00ebsaj kategori i referohen kryesisht
  problematikave si me posht\u00eb:\\n\\n- **Kujdestaria dhe Akomodimi**: F\u00ebmij\u00ebt
  e pashoq\u00ebruar duhet t\u00eb caktohen nj\u00eb kujdestar i cili \u00ebsht\u00eb
  p\u00ebrgjegj\u00ebs p\u00ebr mir\u00ebqenien e tyre. Ky kujdestar duhet t\u00eb
  siguroj\u00eb q\u00eb f\u00ebmija t\u00eb ket\u00eb akses n\u00eb sh\u00ebrbime
  t\u00eb nevojshme dhe t\u00eb jet\u00eb mbrojtur nga rr\u00ebziqet t\u00eb mundshme.
  F\u00ebmij\u00ebt e pashoq\u00ebruar duhet t\u00eb vendosen n\u00eb akomodime q\u00eb
  jan\u00eb t\u00eb p\u00ebrshtatshme p\u00ebr nevojat e tyre dhe q\u00eb ofrojn\u00eb
  nj\u00eb ambient t\u00eb sigurt dhe mb\u00ebshtetje.82\\n\\n- **Trajtimi Psikologjik**:
  F\u00ebmij\u00ebt e pashoq\u00ebruar shpesh p\u00ebrballen me trauma dhe stres t\u00eb
  r\u00ebnd\u00eb p\u00ebr shkak t\u00eb p\u00ebrvojave t\u00eb tyre gjat\u00eb udh\u00ebtimit
  dhe gjat\u00eb periudh\u00ebs s\u00eb q\u00ebndrimit n\u00eb vendin prit\u00ebs.
  Ata kan\u00eb nevoj\u00eb p\u00ebr mb\u00ebshtetje psikologjike dhe sh\u00ebrbime
  t\u00eb tjera p\u00ebr t\u00eb adresuar d\u00ebmet emocionale dhe psikologjike.83\\n\\n---\\n\\n82
  Guidelines on Determining the Best Interests of the Child, UNHCR pg. 61 https://www.unhcr.org/media/unhcr-guidelines-determining-best-interests-child
  .\\n\\n83 Child Protection and Migration Report 2023, UNICEF - Report. https://www.unicef.org/documents/inclusion-children-context-migration-national-child-protection-systems-0\\n\\n\u25cf
  **Procedurat Ligjore**: F\u00ebmij\u00ebt e pashoq\u00ebruar duhet t\u00eb ken\u00eb
  akses n\u00eb ndihm\u00eb ligjore dhe p\u00ebrfaq\u00ebsim t\u00eb p\u00ebrshtatsh\u00ebm
  gjat\u00eb procedurave p\u00ebr k\u00ebrkesat e azilit ose mbrojtjes nd\u00ebrkomb\u00ebtare.
  Procedurat duhet t\u00eb jen\u00eb t\u00eb dizajnuara p\u00ebr t\u00eb mbrojtur
  interesat e f\u00ebmij\u00ebs dhe p\u00ebr t\u00eb siguruar q\u00eb ata t\u00eb
  marrin informacionin dhe mb\u00ebshtetje t\u00eb nevojshme nd\u00ebrkomb\u00ebtare.\\n\\nT\u00eb
  gjith\u00eb ata q\u00eb punojn\u00eb me f\u00ebmij\u00eb t\u00eb pashoq\u00ebruar
  duhet t\u00eb ken\u00eb trajnim t\u00eb p\u00ebrshtatsh\u00ebm dhe t\u00eb respektojn\u00eb
  konfidencialitetin n\u00eb lidhje me informacionin q\u00eb marrin.\\n\\n**VI. Qasja
  e t\u00eb huajve n\u00eb Sh\u00ebrbime publike**\\n\\n6.1 **Arsimimi dhe Sh\u00ebrbimet
  Sociale: Qasja e t\u00eb huajve n\u00eb arsim dhe sh\u00ebrbime sh\u00ebndet\u00ebsore**\\n\\nSipas
  ligjit p\u00ebr t\u00eb huajt n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb i huaji
  g\u00ebzon t\u00eb drejt\u00ebn p\u00ebr kujdes sh\u00ebndet\u00ebsor. Gjithashtu
  n\u00eb nenin 133 t\u00eb k\u00ebtij ligji parashikohet se edhe t\u00eb huajve t\u00eb
  cil\u00ebt nuk jan\u00eb t\u00eb pajisur me nj\u00eb dokument t\u00eb vlefsh\u00ebm
  udh\u00ebtimi, viz\u00eb ose leje q\u00ebndrimi t\u00eb vlefshme dhe q\u00eb nuk
  v\u00ebrtetojn\u00eb q\u00eb kan\u00eb hyr\u00eb dhe q\u00ebndrojn\u00eb n\u00eb
  m\u00ebnyr\u00eb t\u00eb ligjshme n\u00eb territor spitalet dhe gendrat sh\u00ebndet\u00ebsore
  u ofrojn\u00eb sh\u00ebrbim mjek\u00ebsor n\u00eb situata t\u00eb emergjencave mjek\u00ebsore.
  Theksojm\u00eb se nj\u00eb nd\u00ebr kushtet p\u00ebr p\u00ebrfitimin e viz\u00ebs
  dhe t\u00eb lejes s\u00eb q\u00ebndrimit n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb
  \u00ebsht\u00eb edhe polic\u00eb t\u00eb sigurimit sh\u00ebndet\u00ebsor.\\n\\nBazuar
  n\u00eb ligjin Nr. 10 107, dat\u00eb 30.3.2009 \\\"P\u00ebr kujdesin sh\u00ebndet\u00ebsor
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\\\", i ndryshuar parashikohet se
  sh\u00ebrbimi i kujdesit sh\u00ebndet\u00ebsor, q\u00eb ofrohet n\u00eb institucionet
  e kujdesit sh\u00ebndet\u00ebsor p\u00ebr shtetasit e huaj, q\u00eb banonjn\u00eb
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, b\u00ebhet n\u00eb baz\u00eb t\u00eb
  marr\u00ebveshjeve p\u00ebrkat\u00ebse nd\u00ebrkomb\u00ebtare ose n\u00eb baz\u00eb
  t\u00eb parimit t\u00eb reciprocitetit.\\n\\nN\u00eb munges\u00eb t\u00eb nj\u00eb
  marr\u00ebveshjeje nd\u00ebrkomb\u00ebtare apo t\u00eb kushteve ku zbatohet parimi
  i reciprocitetit, shtetasit e huaj p\u00ebrfitojn\u00eb sh\u00ebrbimet e kujdesit
  sh\u00ebndet\u00ebsor, n\u00eb baz\u00eb t\u00eb ligjit.\\n\\nShtetasit e huaj,
  q\u00eb kan\u00eb nevoj\u00eb p\u00ebr kujdes sh\u00ebndet\u00ebsor, n\u00eb kushteve
  e urgjenc\u00ebs mjek\u00ebsore, marrin kujdes sh\u00ebndet\u00ebsor dhe n\u00eb
  kushte t\u00eb barabarta me ato q\u00eb zbatohen p\u00ebr shtetasit e Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb. Gjithashtu sipas ligjit nr. 147/2014 \\\"P\u00ebr
  sh\u00ebrbimin e urgjenc\u00ebs mjek\u00ebsore\\\" sh\u00ebrbimi i urgjenc\u00ebs
  mjek\u00ebsore n\u00eb t\u00eb gjitha nivelet e tij, p\u00ebr t\u00eb gjith\u00eb
  shtetasit shqiptar\u00eb dhe t\u00eb huaj me banim t\u00eb p\u00ebrhersh\u00ebm
  ose t\u00eb p\u00ebrkohsh\u00ebm n\u00eb Shqip\u00ebri, si dhe p\u00ebr \u00e7do
  shtetas t\u00eb huaj q\u00eb \u00ebsht\u00eb duke kaluar n\u00eb territorin e Shqip\u00ebris\u00eb.\\n\\n6.1.1
  **Aksesi i t\u00eb huajve n\u00eb sistemin arsimor.**\\n\\nSipas ligjit p\u00ebr
  t\u00eb huajt parashikohet se i huaji, i cili ka hyr\u00eb dhe q\u00ebndron n\u00eb
  Republik\u00ebn e Shqip\u00ebris\u00eb p\u00ebr \u00e7\u00ebllime studimi, pran\u00eb
  nj\u00eb institucioni arsimor publik apo privat t\u00eb njohur nga shteti shqiptar,
  ka t\u00eb drejt\u00eb t\u00eb aplikoj\u00eb p\u00ebr leje q\u00ebndrimi. I huaji,
  i pranuar n\u00eb nj\u00eb institucion arsimor, apo q\u00eb merr pjes\u00eb n\u00eb
  trajnime ose praktika profesionale, pajiset me leje q\u00ebndrimi, me afat jo m\u00eb
  shum\u00eb se nj\u00eb vit, kur l\u00ebshohet p\u00ebr her\u00eb t\u00eb par\u00eb
  dhe mund t\u00eb shtyhet \u00e7do her\u00eb me nj\u00eb\\n\\nvit deri n\u00eb p\u00ebrfundimin
  e shkoll\u00ebs, t\u00eb studimeve ose t\u00eb praktik\u00ebs. N\u00eb rast se koh\u00ebzgjatja
  e kursit \u00ebsht\u00eb m\u00eb e vog\u00ebl se nj\u00eb vit, afati i lejes s\u00eb
  q\u00ebndrimit \u00ebsht\u00eb i barabart\u00eb me koh\u00ebzgjatjen e kursit.\\n\\nN\u00eb
  m\u00ebnyr\u00eb q\u00eb t\u00eb p\u00ebrfitoje lejen e q\u00ebndrimit i huaj duhet
  t\u00eb provoj\u00eb se \u00ebsht\u00eb pranuar nga institucioni arsimor, se ka
  njohuri t\u00eb mjaftueshme t\u00eb gjuh\u00ebs s\u00eb shkollimit ose trajnimit,
  si dhe disponon mjete financiare t\u00eb mjaftueshme p\u00ebr jetes\u00ebn n\u00eb
  Republik\u00ebn e Shqip\u00ebris\u00eb gjat\u00eb studimeve.\\n\\nBazuar n\u00eb
  vendimin nr. 858, dat\u00eb 29.12.2021 t\u00eb K\u00ebshillit t\u00eb Ministrave
  \\\"P\u00ebr p\u00ebrcaktimin e kriterive, t\u00eb procedurave e t\u00eb dokumentacionit
  p\u00ebr hyrjen, q\u00ebndrimin dhe trajtimin e t\u00eb huajve n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\\\", t\u00eb ndryshuar p\u00ebrcaktohet dokumentacioni shtes\u00eb
  q\u00eb duhet t\u00eb paraqitet p\u00ebr viz\u00eb p\u00ebr motive studimi (student
  dhe nx\u00ebn\u00ebs) D/ST:\\n\\na) Dokumenti, q\u00eb v\u00ebrteton pranimin n\u00eb
  nj\u00eb institucion arsimor shqiptar;\\nb) D\u00ebshmia financiare, q\u00eb v\u00ebrteton
  mbulimin e shpenzimeve t\u00eb jetes\u00ebs dhe t\u00eb shkollimit;\\nc) Certifikata
  q\u00eb provon njohjen e gjuh\u00ebs, me t\u00eb cil\u00ebn k\u00ebrkuesi i viz\u00ebs
  do t\u00eb kryej\u00eb studimet. Prova e njohjes s\u00eb gjuh\u00ebs mund t\u00eb
  verifikohet edhe me intervist\u00eb nga i ngarkuari me \u00e7\u00ebshtjet konsullore
  n\u00eb ambasad\u00eb ose konsullat\u00eb.\\n\\nDokumentacioni shtes\u00eb p\u00ebr
  pajisjen me leje q\u00ebndrimi p\u00ebr motive studimi (student dhe nx\u00ebn\u00ebs):\\n\\n-
  Dokumenti i pranimit nga nj\u00eb institucion arsimor n\u00eb Shqip\u00ebri;\\n-
  D\u00ebshmia e burimeve t\u00eb mjaftueshme financiare p\u00ebr jetes\u00eb gjat\u00eb
  q\u00ebndrimit n\u00eb Shqip\u00ebri p\u00ebr periudh\u00ebn e k\u00ebrkuar;\\n-
  D\u00ebshmia e njohjes s\u00eb gjuh\u00ebs t\u00eb programit t\u00eb studimit/gjuh\u00ebs
  s\u00eb zhvillimit t\u00eb procesit m\u00ebsimor apo v\u00ebrtetim p\u00ebr pranimin
  n\u00eb kursin p\u00ebrgatitor t\u00eb gjuh\u00ebs;\\n- Dokument se jan\u00eb paguar
  tarifat e vendosura nga institucioni i arsimit t\u00eb lart\u00eb.\\n\\nDokumente
  shtes\u00eb p\u00ebr nx\u00ebn\u00ebs:\\n\\n- D\u00ebshmi se nuk \u00ebsht\u00eb
  n\u00ebn mosh\u00ebn ose n\u00ebn klas\u00ebn minimale dhe as mbi mosh\u00ebn ose
  klas\u00ebn maksimale t\u00eb p\u00ebrcaktuar nga legjislacioni komb\u00ebtar;\\n-
  D\u00ebshmi se nx\u00ebn\u00ebsi i huaj do t\u00eb akomodohet nga nj\u00eb familje
  gjith\u00eb q\u00ebndrimit t\u00eb tij n\u00eb nj\u00eb ambient t\u00eb ve\u00e7ant\u00eb
  akomodimi brenda institucionit arsimor ose n\u00eb ndonj\u00eb ambient tjet\u00ebr
  q\u00eb p\u00ebrmbush kushtet e duhura.\\n\\nNj\u00eb nd\u00ebr procedurat q\u00eb
  t\u00eb huajt duhet t\u00eb kryejn\u00eb me q\u00ebllim ndjekjen e shkollimit ose
  studimeve n\u00eb Republik\u00eb e Shqip\u00ebris\u00eb lidhet me njohjen e d\u00ebftesave,
  diplomave ose viteve t\u00eb studimit.\\n\\nUdh\u00ebzimi nr. 13, dat\u00eb 30.6.2023
  i ministrit t\u00eb Arsimit dhe Sportit, i ndryshuar p\u00ebrcakton p\u00ebrcaktimin
  e kriteret dhe t\u00eb procedurat t\u00eb nj\u00ebvlershm\u00ebris\u00eb s\u00eb
  d\u00ebftesave dhe t\u00eb diplomave t\u00eb nx\u00ebn\u00ebsve t\u00eb arsimit
  parauniversitar t\u00eb ardhur nga jasht\u00eb vendit.\\n\\nAplikimi p\u00ebr njohjen
  dhe nj\u00ebsimin e d\u00ebftes\u00ebs s\u00eb p\u00ebrfundimit t\u00eb arsimit
  baz\u00eb, d\u00ebftesave t\u00eb klasave, si dhe diplom\u00ebs s\u00eb arsimit
  t\u00eb mes\u00ebm t\u00eb lart\u00eb, q\u00eb i p\u00ebrkasin nivelit I deri n\u00eb
  4 t\u00eb Korniz\u00ebs\\n\\nShqiptare dhe Korniz\u00ebs Evropiane t\u00eb Kualifikimeve,
  kryhet online n\u00ebp\u00ebrmjet portalit e-Albania n\u00eb sh\u00ebrbimin elektronik
  \\\"Aplikim p\u00ebr nj\u00ebvlefshm\u00ebr\u00ebn e d\u00ebftesave t\u00eb nx\u00ebn\u00ebsve
  t\u00eb arsimit parauniversitar t\u00eb ardhur nga jasht\u00eb vendit\\\".\\n\\nProcedura
  e njohjes dhe nj\u00ebsimit t\u00eb d\u00ebftes\u00ebs s\u00eb p\u00ebrfundimit
  t\u00eb arsimit baz\u00eb dhe t\u00eb d\u00ebftesave t\u00eb klasave t\u00eb arsimit
  parauniversitar, pas aplikimit online vijon me shqyrtimin dhe verifikimin e dokumentacionit
  nga ana e Komisionit t\u00eb Njohjes s\u00eb D\u00ebftesave n\u00eb ZVAP. Kur dosja
  e aplikimit \u00ebsht\u00eb e plot\u00ebsuar me t\u00eb gjith\u00eb dokumentacionin
  e k\u00ebrkuar, kjo procedur\u00eb p\u00ebrfundon brenda 45 dit\u00ebve.\\n\\nProcedura
  e njohjes dhe nj\u00ebsimit e diplom\u00ebs s\u00eb shkoll\u00ebs s\u00eb mesme,
  q\u00eb i p\u00ebrket nivelit 4 t\u00eb Korniz\u00ebs Shqiptare dhe Korniz\u00ebs
  Evropiane t\u00eb Kualifikimeve, pas aplikimit online, vijon me shqyrtimin dhe verifikimin
  e dokumentacionit nga ana e Komisionit t\u00eb Njohjes s\u00eb Diplomave n\u00eb
  QSHA. Kjo procedur\u00eb, kur dosja e aplikimit \u00ebsht\u00eb e plot\u00ebsuar
  me t\u00eb gjith\u00eb dokumentacionin e k\u00ebrkuar, p\u00ebrfundon brenda 45
  dit\u00ebve.\\n\\nLidhur me ndjekjen e arsimit t\u00eb lart\u00eb n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb, institucionet e arsimit t\u00eb lart\u00eb p\u00ebrcaktojn\u00eb
  kuota t\u00eb ve\u00e7anta p\u00ebr studentet e huaj n\u00eb programet e studimit
  q\u00eb ofrojn\u00eb.\\n\\nT\u00eb huajt mund t\u00eb aplikojn\u00eb pran\u00eb
  institucioneve t\u00eb arsimit t\u00eb lart\u00eb, sipas afateve t\u00eb p\u00ebrcaktuara
  nga k\u00ebto institucione p\u00ebr \u00e7do vit akademik, n\u00eb programet e studimit
  ku jan\u00eb parashikuar kuotat p\u00ebr k\u00ebto kategori nga IAL-t\u00eb n\u00eb
  programet e studimit q\u00eb ato ofrojn\u00eb. N\u00eb udh\u00ebzimin e Ministrit
  t\u00eb Arsimit dhe Sportit \u00ebsht\u00eb parashikuar se regjistrimi i k\u00ebtyre
  kandidat\u00ebve fitues b\u00ebhet me rezerv\u00eb, n\u00ebse n\u00eb momentin e
  regjistrimit nuk zot\u00ebrojn\u00eb dokumentin e njohjes dhe njehsimit t\u00eb
  l\u00ebshuar nga QSHA-ja. Nj\u00eb parashikim i till\u00eb ju mund\u00ebson t\u00eb
  huajve t\u00eb regjistrohen me rezerve n\u00eb kushtet kur nuk e kan\u00eb p\u00ebrfunduar
  akoma njohjen e diplom\u00ebs q\u00eb p\u00ebrb\u00ebn kusht p\u00ebr ndjekjen e
  studimeve.\\n\\nT\u00eb huajt duhet t\u00eb paraqesin n\u00eb institucionin e arsimit
  t\u00eb lart\u00eb edhe d\u00ebshmin\u00eb e njohjes s\u00eb gjuh\u00ebs shqipe,
  l\u00ebshuar nga strukturat p\u00ebrgjegj\u00ebse (p\u00ebr rastet kur regjistrohet
  n\u00eb nj\u00eb program studimi q\u00eb zhvillohet n\u00eb gjuh\u00ebn shqipe).
  N\u00eb rastet kur t\u00eb huajt kan\u00eb p\u00ebrfunduar arsimin e mes\u00ebm
  t\u00eb lart\u00eb n\u00eb t\u00eb nj\u00ebjt\u00ebn gjuh\u00eb t\u00eb huaj q\u00eb
  zhvillohet edhe programi i studimit t\u00eb IAL-s\u00eb ku aplikon, p\u00ebrjashtohen
  nga detyrimi i paraqitjes s\u00eb d\u00ebshmis\u00eb s\u00eb njohjes s\u00eb k\u00ebsaj
  gjuhe t\u00eb huaj.\\n\\n6.1.2 Qasja e refugiat\u00ebve n\u00eb arsim si nj\u00eb
  kategori ve\u00e7ant\u00eb e t\u00eb huajve.\\n\\nArsimi \u00ebsht\u00eb nj\u00eb
  nd\u00ebr t\u00eb drejtat themelore t\u00eb gjith\u00ebs\u00ebcilit, prandaj t\u00eb
  gjith\u00eb personave pavar\u00ebsisht rr\u00ebthanave n\u00eb t\u00eb cilat ndodh\u00ebn
  duhet t''u sigurohet aksesi n\u00eb sistemin arsimor.\\n\\n____________________\\n\\n84
  Kreu VI i udh\u00ebzimit nr. 12, dat\u00eb 30.6.2023 i ministrit t\u00eb Arsimit
  dhe Sportit \\\"P\u00ebr procedurat e aplikimit dhe t\u00eb regjistrimit n\u00eb
  institucionet e arsimit t\u00eb lart\u00eb\\\".\\n\\nBazuar n\u00eb Konvent\u00ebn
  e Gjenev\u00ebs \\\"P\u00ebr statusin e refugjatit\\\"85, parashikohet se shtetet
  pal\u00eb duhet t\u2019u japin refugjat\u00ebve t\u00eb nj\u00ebjtin trajtim q\u00eb
  u japin shtetasve t\u00eb tyre n\u00eb lidhje me arsimin baz\u00eb. Lidhur me nivellet
  arsimore t\u00eb ndryshme nga arsimi baz\u00eb, shtetet pal\u00eb duhet t\u2019u
  japin refugjat\u00ebve nj\u00eb trajtim sa m\u00eb t\u00eb favorsh\u00ebm t\u00eb
  jet\u00eb e mundur, dhe n\u00eb \u00e7do rast, jo m\u00eb pak t\u00eb favorsh\u00ebm
  se trajtimi q\u00eb ju jepet t\u00eb huajve n\u00eb p\u00ebrgjith\u00ebsi n\u00eb
  t\u00eb nj\u00ebjtat rr\u00ebthana, ve\u00e7an\u00ebrisht, p\u00ebr sa i p\u00ebrket
  aksesit n\u00eb studime, njohjes s\u00eb certifikatave, diplomave dhe gradave t\u00eb
  l\u00ebshuara nga institucionet e huaja, p\u00ebrjashtimin nga tarifa dhe dh\u00ebnien
  e bursave.\\n\\nParimet e Konvent\u00ebs s\u00eb Gjenev\u00ebs u riafirmuan n\u00eb
  Dhjetor 2018 nga Kompakti Global p\u00ebr Refugjat\u00ebt ku u k\u00ebrkohet shteteve
  pal\u00eb mb\u00ebshtetje m\u00eb e drejt\u00ebp\u00ebrdrejt\u00eb financiare dhe
  p\u00ebrpjekje t\u00eb ve\u00e7ant\u00eb p\u00ebr t\u00eb minimizuar koh\u00ebn
  q\u00eb djemt\u00eb dhe vajzat refugjate q\u00ebndrojn\u00eb jaqsh\u00eb arsimit,
  idealisht nj\u00eb maksimum prej tre muaj pas mb\u00ebrritjes. Fushat shtes\u00eb
  p\u00ebr mb\u00ebshtetje p\u00ebrfshijn\u00eb p\u00ebrprjekjet p\u00ebr t\u00eb
  p\u00ebrmbushur specifikat nevojat arsimore t\u00eb refugjat\u00ebve (p\u00ebrfshir\u00eb
  p\u00ebrmes \\\"shkollave t\u00eb sigurta\\\" dhe metoda inovative si edukimi online)
  dhe kap\u00ebrcimin e pengesave p\u00ebr regjistrimin dhe ndjekjen e m\u00ebsimit,
  programet fleksib\u00ebl t\u00eb certifikuara t\u00eb t\u00eb m\u00ebsuarit, ve\u00e7an\u00ebrisht
  p\u00ebr vajzat, si dhe personat me aft\u00ebsi t\u00eb kufizuara dhe trauma psikosociale.
  Mb\u00ebshtetja duhet t\u00eb ofrohet gjithashtu p\u00ebr t\u00eb leht\u00ebsuar
  njohjen dhe nj\u00ebsimin diplomave dhe kualifikimeve profesionale dhe akademike.\\n\\nDirektiva
  2003/9 e Bashkimit Evropian p\u00ebr p\u00ebrcaktimin e standardeve minimale p\u00ebr
  pritjen e azil\u00ebk\u00ebrkuesve k\u00ebrkon q\u00eb shtetet t\u2019u sigurojn\u00eb
  akses n\u00eb sistemin arsim edhe personave q\u00eb kan\u00eb aplikuar p\u00ebr
  azil dhe nuk e kan\u00eb marr\u00eb akoma statusin e refugjatit. Aksesi n\u00eb
  sistemin arsimor sipas direktiv\u00ebs s\u00eb Bashkimit Evropian duhet t\u2019u
  sigurohet t\u00eb gjith\u00eb personave q\u00eb nuk e kan\u00eb arritur mosh\u00ebn
  madhore. Qasja n\u00eb sistemin arsimor nuk mund t\u00eb shtyhet p\u00ebr m\u00eb
  shum\u00eb se tre muaj nga data e paraqites s\u00eb k\u00ebrkes\u00ebs p\u00ebr
  azil.86\\n\\nSa i p\u00ebrket t\u00eb drejt\u00ebs kuadrit ligjor lidhur me t\u00eb
  drejt\u00ebn p\u00ebr arsim n\u00eb Shqip\u00ebri, ligji nr. 10/2021 \\\"P\u00ebr
  azilin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\\\", p\u00ebr\u00e7akton se
  k\u00ebrku\u00ebsit f\u00ebmij\u00eb kan\u00eb t\u00eb drejt\u00eb p\u00ebr ndjekjen
  e arsimit parauniversitar me t\u00eb nj\u00ebjtat kushte si edhe p\u00ebr f\u00ebmij\u00ebt
  me shtet\u00ebsi shqiptare. Ndjekja e arsimit parauniversitar nga k\u00ebrku\u00ebsit
  f\u00ebmij\u00eb, b\u00ebhet brenda 3 (tre) muajve nga data kur \u00ebsht\u00eb
  paraqitur k\u00ebrkesa p\u00ebr mbrojtje nd\u00ebrkomb\u00ebtare.87\\n\\nSa m\u00eb
  sip\u00ebr legjislacioni shqiptar ka reflektuar parashikimet e konvent\u00ebs s\u00eb
  Gjenev\u00ebs dhe direktiv\u00ebs s\u00eb pritjes s\u00eb BE-s\u00eb duke u siguruar
  akses n\u00eb sistemin arsimor parauniversitar t\u00eb huajve, t\u00eb mitur q\u00eb
  k\u00ebrkojn\u00eb mbrojtje nd\u00ebrkomb\u00ebtare, brenda 3 muajve nga paraqitja
  e k\u00ebrkes\u00ebs p\u00ebr azil.\\n\\n85 Convention And Protocol Relating To
  The Status Of Refugees https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees\\n86
  Article 10 Council Directive 2003/9/EC of 27 January 2003 laying down minimum standards
  for the reception of asylum seekers https://eur-lex.europa.eu/legalcontent/EN/TXT/PDF/?uri=CELEX:32003L0009&from=EN\\n87
  Neni 59 i ligjit nr. 10/2021 \\\"P\u00ebr azilin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\\\"
  https://qbz.gov.al/el/ligj/2021/02/01/10/48ad6f04-07d2-4d94-ad90-3df7051c6c84\\n\\nArsimi
  parauniversitar n\u00eb Shqip\u00ebri p\u00ebrfshin nivelet arsimore me kodet 0,
  1, 2 dhe 3, sipas \u201cKlasifikimit Nd\u00ebrkom\u00ebtar Standard t\u00eb Arsimit\u201d,
  p\u00ebrkat\u00ebsisht:\\n\\na) \u201cNiveli me kodin 0\u201d, arsimi parashkollor;\\nb)
  \u201cNiveli me kodin 1\u201d, arsimi fillor;\\nc) \u201cNiveli me kodin 2\u201d,
  arsimi i mes\u00ebm i ul\u00ebt;\\nd) \u201cNiveli me kodin 3\u201d, arsimi i mes\u00ebm
  i lart\u00eb.\\n\\nN\u00eb rastet kur personi ka fituar statusin e refugjatit ose
  statusin e mbrojtjes plot\u00ebsuese ligji p\u00ebr azilin n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb e ka shtrir\u00eb t\u00eb drejt\u00ebn p\u00ebr arsim p\u00ebrv\u00eb\u00e7
  arsimit parauniversitar edhe n\u00eb arsimin e lart\u00eb. Edhe an\u00ebtar\u00ebt
  e familjes s\u00eb refugjatit, q\u00eb kan\u00eb p\u00ebrfshitur nga vendimi p\u00ebr
  bashkim familjar, kan\u00eb t\u00eb nj\u00ebjtat t\u00eb drejta sikurse edhe k\u00ebrkuesi
  p\u00ebr arsimim n\u00eb institucionet arsimore.\\n\\nNj\u00eb nd\u00ebr sfidat
  e regjistrimit n\u00eb institucionet arsimore p\u00ebr f\u00ebmij\u00ebt refugjat\u00eb
  lidhet me munges\u00ebn e dokumentacionit t\u00eb nevojsh\u00ebm p\u00ebr regjistrim.
  Duke mbajtur n\u00eb konsiderat\u00eb situatat nga t\u00eb cilat f\u00ebmij\u00ebt
  refugjat\u00eb vin\u00eb dhe interesin m\u00eb t\u00eb lart\u00eb t\u00eb f\u00ebmij\u00ebs
  n\u00eb udh\u00ebzimin nr. 10, dat\u00eb 17.5.2021 t\u00eb ministrit t\u00eb Arsimit
  Sportit dhe Rinis\u00eb \\\"P\u00ebr regjistrimin dhe mb\u00ebshtetjen n\u00eb institucionet
  arsimore parauniversitare publike t\u00eb f\u00ebmij\u00ebve t\u00eb personave n\u00eb
  situat\u00eb migrimi/azili, refugjat\u00eb, t\u00eb f\u00ebmij\u00ebve t\u00eb huaj
  t\u00eb pashoq\u00ebruar, t\u00eb f\u00ebmij\u00ebve q\u00eb kthehen nga emigracioni,
  nga zonat e konfliktit apo f\u00ebmij\u00eb, viktima t\u00eb trafikimit, n\u00eb
  Republik\u00ebn e Shqip\u00ebris\u00eb\\\" \u00ebsht\u00eb parashikuar m\u00ebnyra
  e regjistrimit p\u00ebr f\u00ebmij\u00ebt p\u00ebr t\u00eb cil\u00ebt ka munges\u00eb
  dokumentacioni ose nuk kan\u00eb dokumentacion p\u00ebr regjistrim.\\n\\nSipas udh\u00ebzimit
  t\u00eb sip\u00ebrcticuar f\u00ebmij\u00ebt e mosh\u00ebs 3\u20135 vje\u00e7 q\u00eb
  nuk zot\u00ebrojn\u00eb certifikat\u00eb lindjeje apo f\u00ebmij\u00ebve t\u00eb
  huaj t\u00eb pashoq\u00ebruar, regjistrohen n\u00eb arsimin parashkollor, sipas
  deklarimit t\u00eb prind\u00ebrve/kujdestarit ligjor dhe dokumentacionit q\u00eb
  f\u00ebmija zot\u00ebron nga autoriteti p\u00ebrgjegj\u00ebs p\u00ebr azilin dhe
  refugjat\u00ebt.\\n\\nNx\u00ebn\u00ebsit e mosh\u00ebs 6\u201321 vje\u00e7, n\u00eb
  situat\u00eb migrimi/azili, refugjat\u00eb, apo pa shtet\u00ebsi, p\u00ebr t\u00eb
  vazhduar m\u00ebsimin n\u00eb arsimin baz\u00eb ose arsimin e mes\u00ebm t\u00eb
  lart\u00eb, paraqesin n\u00eb ZVAP d\u00ebftes\u00ebn/d\u00ebft\u00ebsat origjinale
  t\u00eb p\u00ebrkthyera dhe t\u00eb noterizuara. ZVAP-ja b\u00ebn ekuiwant\u00ebmin
  e notave, siglon d\u00ebftes\u00ebn dhe nx\u00ebn\u00ebsit dhe cakton institucionin
  arsimor parauniversitar publik ku do t\u00eb vazhdojn\u00eb m\u00ebsimin nx\u00ebn\u00ebsi,
  sipas vendbanimit ku ai \u00ebsht\u00eb vendosur:\\n\\na) n\u00eb klas\u00ebn pasardh\u00ebse,
  kur vjen n\u00eb fillim t\u00eb vitit shkollor;\\nb) n\u00eb klas\u00ebn p\u00ebrkat\u00ebse,
  kur vjen gjat\u00eb vitit shkollor.\\n\\nNx\u00ebn\u00ebsit q\u00eb nuk provojn\u00eb
  me dokument zyrtar t\u00eb shtetit nga vijn\u00eb, p\u00ebrfundimin apo vazhdimin
  e nj\u00eb klase, vler\u00ebsohen me testim, p\u00ebr shkall\u00ebn e njohurive
  nga nj\u00eb komision nd\u00ebr\u00ebndor, i p\u00ebrmb\u00ebr\u00eb nga m\u00ebsues
  dhe nga punonj\u00ebsi i sh\u00ebrbimit psikosocial, q\u00eb ngrihet n\u00eb institucionin
  arsimor parauniversitar publik. Komisioni n\u00eb baz\u00eb t\u00eb vler\u00ebsimit
  cakton klas\u00ebn ku nx\u00ebn\u00ebsit i\\n\\n---\\n\\n88 Pika 1, e nenit 2, t\u00eb
  ligjit nr. 69/2012 \\\"P\u00ebr sistemin arsimor parauniversitar n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\\\", t\u00eb ndryshuar.\\n89 Neni 63 dhe 74 i ligjit nr.
  10/2021 \\\"P\u00ebr azilin n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\\\".\\n\\np\u00ebrket
  t\u00eb regjistrohet. Gjithashtu \u00ebsht\u00eb parashikuar se institucioni arsimor
  parauniversitar publik siguron tekstet shkollore p\u00ebr f\u00ebmij\u00ebt e personave
  n\u00eb situat\u00eb emigrimi/azili, refugjat\u00eb apo f\u00ebmij\u00ebve t\u00eb
  huaj t\u00eb pashoq\u00ebruar.\\n\\nP\u00ebr f\u00ebmij\u00ebt e kthyer nga zonat
  e konfliktit institucioni arsimor parauniversitar publik harton planin individual
  m\u00ebsimor bazuar n\u00eb vler\u00ebsimin e nevojave arsimore dhe t\u00eb atyre
  psikosociale t\u00eb k\u00ebtyre f\u00ebmij\u00ebve.\\n\\nUdh\u00ebzimi nr. 13,
  dat\u00eb 30.6.2023 i ministrit t\u00eb Arsimit dhe Sportit, i ndryshuar krijon
  leht\u00ebsira p\u00ebr njohjen e d\u00ebftesave dhe diplomave p\u00ebr refugjat\u00ebt.
  Refugjat\u00ebt, personat e zhvendosur dhe personat e ngjash\u00ebm me refugjat\u00ebt,
  t\u00eb cil\u00ebt paraqesin dokumentacion t\u00eb pjessh\u00ebm, ose nuk mund t\u00eb
  paraqesin dokumente p\u00ebr t\u00eb v\u00ebrtetuar kualifikimet e tyre dhe/ose
  periudhat e studimit, kan\u00eb t\u00eb drejt\u00ebn e njohjes dhe nj\u00ebsimit
  brenda nj\u00eb afati t\u00eb arsyesh\u00ebm t\u00eb kualifikimit t\u00eb tyre dhe/ose
  periudhave t\u00eb studimit, me q\u00ebllim p\u00ebr t\u00eb vazhduar studimet e
  m\u00ebtejshme, ose p\u00ebr t''u pun\u00ebsuar.\\n\\nP\u00ebr njohjen dhe/ose nj\u00ebsimin
  e d\u00ebftes\u00ebs s\u00eb p\u00ebrfundimit t\u00eb arsimit baz\u00eb, d\u00ebftesa
  klase, diplomave t\u00eb p\u00ebrfundimit t\u00eb arsimit parauniversitar, t\u00eb
  fituara jasht\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb dhe/ose periudhave
  t\u00eb studimit nga mbajt\u00ebsit/titullar\u00ebt e statusit t\u00eb refugjatit,
  personave t\u00eb zhvendosur dhe personave t\u00eb ngjash\u00ebm me refugjat\u00ebt,
  organet kompetente p\u00ebrcaktojn\u00eb procedurat e p\u00ebrshtatshme t\u00eb
  vler\u00ebsimit, vlefshm\u00ebris\u00eb dhe kritereve t\u00eb tjera, q\u00eb lejojn\u00eb
  njohjen e k\u00ebtyre kualifikimeve dhe/ose periudhave t\u00eb studimit, edhe n\u00eb
  munges\u00eb t\u00eb verifikimit t\u00eb vlefshm\u00ebris\u00eb s\u00eb tyre, apo
  munges\u00ebs, apo paraqitjes s\u00eb dokumentacionit t\u00eb pjessh\u00ebm ligjor,
  n\u00eb ato raste kur personat e interesuar provojn\u00eb pamund\u00ebsin\u00eb
  p\u00ebr t\u00eb verifikuar vlefshm\u00ebrin\u00eb e k\u00ebtyre diplomave/certifikatave,
  ose nuk mund t\u00eb paraqesin dokumente q\u00eb ta b\u00ebjn\u00eb k\u00ebt\u00eb
  gj\u00eb.\\n\\nOrganet kompetente p\u00ebr njohjen dhe nj\u00ebsimin e d\u00ebftes\u00ebs
  t\u00eb arsimit baz\u00eb, d\u00ebftesa klase, diplomave t\u00eb p\u00ebrfundimit
  t\u00eb arsimit parauniversitar dhe/ose periudhave t\u00eb studimit, duhet t\u00eb
  p\u00ebrdorin \u00e7do mjet t\u00eb disponuesh\u00ebm dhe \u00e7do informacion t\u00eb
  besuesh\u00ebm p\u00ebr t\u00eb verifikuar institucionet ku jan\u00eb fituar kualifikimet,
  apo jan\u00eb kryer periudhat e studimit dhe, gjithashtu, t\u00eb p\u00ebrdorin,
  p\u00ebr aq sa \u00ebsht\u00eb e mundur, \u00e7do informacion apo praktik\u00eb
  t\u00eb vler\u00ebsimeve t\u00eb m\u00ebparshme p\u00ebr kualifikime t\u00eb ngjashme
  p\u00ebr sa u p\u00ebrket vlefshm\u00ebris\u00eb, cil\u00ebsis\u00eb, nivelit dhe
  rezultateve t\u00eb t\u00eb nx\u00ebn\u00ebt.\\n\\nP\u00ebr vitin 2023 rezulton
  se 5 azilk\u00ebrkuar\u00eb f\u00ebmij\u00eb kan\u00eb ndjekur arsimin parauniversitar
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb.\\n\\nLidhur me njohjen e kualifikimeve
  t\u00eb refugjat\u00ebve, e personave t\u00eb zhvendosur dhe e personave t\u00eb
  ngjash\u00ebm me refugjat\u00ebt bazuar n\u00eb \u201cKonventen p\u00ebr njohjen
  e kualifikimeve t\u00eb arsimit t\u00eb lart\u00eb n\u00eb Evrop\u00eb\u201d (Lisbon\u00eb,
  1997) ratifikuar me ligjin nr. 8834, dat\u00eb 22.11.2001 parashikohet se Secila
  Pal\u00eb merr t\u00eb gjitha masat e mundshme dhe t\u00eb arsyeshme n\u00eb kuadrin
  e sistemit t\u00eb vet arsimor, konform dispozitave konstitucionale, ligjore dhe
  administrative, p\u00ebr t\u00eb p\u00ebrpunuar procedurat e p\u00ebrshtatshme q\u00eb
  lejojn\u00eb vler\u00ebsimin e drejt\u00eb dhe efikas, n\u00ebse refugjat\u00ebt,
  personat e zhvendosur dhe personat e ngjash\u00ebm me refugjat\u00ebt plot\u00ebsojn\u00eb
  kushtet e nevojshme p\u00ebr hyrjen.\\n\\nn\u00eb arsim t\u00eb lart\u00eb, ndjekjen
  e programeve t\u00eb arsimit t\u00eb lart\u00eb plot\u00ebsuese ose ushtrimin e
  nj\u00eb aktiviteti profesional dhe kjo do t\u00eb ndodh\u00eb edhe kur kualifikimet
  e kryera n\u00eb nj\u00ebr\u00ebn nga Pal\u00ebt nuk mund t\u00eb v\u00ebrtetohen
  nga dokumente q\u00eb mund ta b\u00ebjn\u00eb k\u00ebt\u00eb gj\u00eb.\\n\\nN\u00eb
  udh\u00ebzimin e ministrit t\u00eb Arsimit dhe Sportit p\u00ebr njohjen e diplomave
  t\u00eb arsimit t\u00eb lart\u00eb parashikohet nj\u00eb procedur\u00eb e ve\u00e7ant\u00eb
  p\u00ebr personat q\u00eb kan\u00eb statusin e refugjatit, personat e zhvendosur
  dhe personat e ngjash\u00ebm me refugjat\u00ebt. 90\\n\\nRefugjat\u00ebt, personat
  e zhvendosur dhe personat e ngjash\u00ebm me refugjat\u00ebt, t\u00eb cil\u00ebt
  paraqesin dokumentacion t\u00eb pjes\u00ebsh\u00ebm, ose nuk mund t\u00eb paraqesin
  dokumente p\u00ebr t\u00eb v\u00ebrtetuar kualifikimet e tyre dhe/ose periudhat
  e studimit, kan\u00eb t\u00eb drejt\u00ebn e njohjes dhe nj\u00ebsimit pa pages\u00eb
  dhe brenda nj\u00eb afati t\u00eb arsyesh\u00ebm t\u00eb kualifikimit t\u00eb tyre
  dhe/ose periudhave t\u00eb studimit me q\u00ebllim p\u00ebr t\u00eb vazhduar studimet
  e m\u00ebtejshme, ose p\u00ebr tu pun\u00ebsuar.\\n\\nP\u00ebr njohjen dhe/ose nj\u00ebsimin
  e diplomave/certifikatave profesionale, diplomave q\u00eb u p\u00ebrkasin niveleve
  5\u20138, gradave shkencore, titujve akademik\u00eb dhe kualifikimet e tjera t\u00eb
  fituara jasht\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb dhe/ose periudhave
  t\u00eb studimit nga mbajt\u00ebsit/titullar\u00ebt e statusit t\u00eb refugjatit,
  personave t\u00eb zhvendosur dhe personave t\u00eb ngjash\u00ebm me refugjat\u00ebt,
  organet kompetente, p\u00ebr\u00e7aktojn\u00eb procedurat e p\u00ebrshtatshme t\u00eb
  vler\u00ebsimit, vlefshm\u00ebris\u00eb dhe kriterieve t\u00eb tjera, q\u00eb lejojn\u00eb
  njohjen e k\u00ebtyre kualifikimeve dhe/ose periudhave t\u00eb studimit, edhe n\u00eb
  munges\u00eb t\u00eb verifikimit t\u00eb vlefshm\u00ebris\u00eb s\u00eb tyre, apo
  munges\u00ebs, apo paraqitjes s\u00eb dokumentacionit t\u00eb pjes\u00ebsh\u00ebm
  ligjor, n\u00eb ato raste kur personat e interesuar provojn\u00eb pamund\u00ebsin\u00eb
  p\u00ebr t\u00eb verifikuar vlefshm\u00ebrin\u00eb e k\u00ebtyre diplomave/certifikatave,
  ose nuk mund t\u00eb paraqesin dokumente q\u00eb ta b\u00ebjn\u00eb k\u00ebt\u00eb
  gj\u00eb.\\n\\nKualifikimet e paraqitura duhet t\u00eb vler\u00ebsohen n\u00ebp\u00ebrmjet
  mbledhjes s\u00eb informacionit nga burime t\u00eb besueshme publike, rrjeti ENIC-NARIC,
  nga personi q\u00eb aplikon p\u00ebr njohjen e kualifikimit dhe/ose periudhave t\u00eb
  studimit dhe sipas rastit duhet t\u00eb plot\u00ebsohet me intervista me aplikantin,
  provimet dhe \u00e7do metod\u00eb tjet\u00ebr t\u00eb p\u00ebrshtatshme vler\u00ebsimi.\\n\\nProjekti
  i Pasaport\u00ebs Evropiane t\u00eb Kualifikimit p\u00ebr Refugjat\u00ebt \u00ebsht\u00eb
  nj\u00eb mjet i ve\u00e7ant\u00eb i zhvilluar nga K\u00ebshilli i Evrop\u00ebs,
  Ministria e Arsimit dhe \u00c7\u00ebshtjeve Fetare t\u00eb Greqis\u00eb, Ministria
  e Arsimit, Universitetet dhe Hulumtimi i Italis\u00eb, Konferenca e Rektor\u00ebve
  t\u00eb Universiteteve Italiane dhe Rrjeti Evropian i Qendrave t\u00eb Informacionit
  (ENIC/NARIC) t\u00eb Armenis\u00eb, Kanada Franca, Gjermaina, Greqia, Italia, Holanda,
  Norvegjia dhe Mbret\u00ebria e Bashkuar. Ministria e Arsimit dhe K\u00ebrkimit t\u00eb
  Norvegjis\u00eb, Belgjika dhe UNHCR gjithashtu mb\u00ebshtesin projektin.\\n\\n90
  Kreu IV i udh\u00ebzimit nr. 21, dat\u00eb 15.10.2021 i ministrit t\u00eb Arsimit
  dhe Sportit \u201cP\u00ebr kriteret dhe procedurat p\u00ebr njohjen dhe nj\u00ebsimin
  n\u00eb republik\u00ebn e shqip\u00ebris\u00eb, t\u00eb diplomave, certifikatave,
  gradave shkencore dhe titujve akademik\u00eb, t\u00eb l\u00ebshuara nga institucione
  t\u00eb huaja t\u00eb arsimit t\u00eb lart\u00eb dhe institucione t\u00eb tjera
  t\u00eb autorizuara\u201d, i ndryshuar.\\n\\n91 Projekti realizohet nga K\u00ebshilli
  i Evrop\u00ebs, Ministria e Arsimit dhe \u00c7\u00ebshtjeve Fetare t\u00eb Greqis\u00eb,
  Ministria e Arsimit, Universitetet dhe Hulumtimi i Italis\u00eb, Konferenca e Rektor\u00ebve
  t\u00eb Universiteteve Italiane dhe Rrjeti Evropian i Qendrave t\u00eb Informacionit
  (ENIC/NARIC) t\u00eb Armenis\u00eb, Kanada Franca, Gjermaina, Greqia, Italia, Holanda,
  Norvegjia dhe Mbret\u00ebria e Bashkuar. Ministria e Arsimit dhe K\u00ebrkimit t\u00eb
  Norvegjis\u00eb, Belgjika dhe UNHCR gjithashtu mb\u00ebshtesin projektin.\\n\\nPasaporta
  Evropiane e Kualifikimit p\u00ebr Refugjat\u00eb nuk \u00ebsht\u00eb nj\u00eb dokument
  ligjor q\u00eb z\u00ebvend\u00ebson skemat komb\u00ebtare t\u00eb njohjes, por nj\u00eb
  deklarat\u00eb q\u00eb synon t\u00eb ndihmoj\u00eb n\u00eb lidhje me aplikimet p\u00ebr
  pun\u00ebsim/praktik\u00eb dhe studime. Vler\u00ebsimi bazohet n\u00eb dokumentacionin
  e disponuesh\u00ebm dhe intervist\u00ebn e strukturuar me nj\u00eb vler\u00ebsues
  profesionist t\u00eb kredencialeve.\\\\(^{92}\\\\)\\n\\nDokumenti shpjegon kualifikimet
  q\u00eb nj\u00eb refugjat ka t\u00eb ngjar\u00eb t\u00eb ket\u00eb bazuar n\u00eb
  provat e disponueshme. Edhe pse ky dokument nuk p\u00ebrb\u00ebn nj\u00eb akt zyrtar
  njohjeje, ai p\u00ebrmbledh dhe paraqet informacionin e disponuesh\u00ebm p\u00ebr
  nivelin arsimor t\u00eb aplikantit, p\u00ebrvoj\u00ebn e pun\u00ebs dhe aft\u00ebsit\u00eb
  gjysh\u00ebre. Metodologjia e vler\u00ebsimit konsiston n\u00eb kombinimin e vler\u00ebsimit
  t\u00eb dokumentacionit t\u00eb disponuesh\u00ebm, p\u00ebrvoj\u00ebs s\u00eb fituar
  nga vler\u00ebsimet e m\u00ebparshme dhe p\u00ebrdorimin e nj\u00eb interviste t\u00eb
  strukturuar. K\u00ebshtu, dokumenti ofron informacion t\u00eb besuesh\u00ebm q\u00eb
  mund t\u00eb jet\u00eb i p\u00ebrshtatsh\u00ebm n\u00eb lidhje me aplikimet p\u00ebr
  pun\u00eb, praktik\u00eb, kurse profesionale apo ndjekje t\u00eb studimeve.\\n\\nPasaporta
  Evropiane e Kualifikimeve p\u00ebr Refugjat\u00ebt u l\u00ebshohet refugjat\u00ebve
  q\u00eb pretendojn\u00eb se kan\u00eb p\u00ebrfunduar ose kan\u00eb ndjekur pjess\u00ebrisht
  studimet n\u00eb nivelin e shkoll\u00ebs s\u00eb mesme dhe vivelet m\u00eb lart
  p\u00ebrfshir\u00eb edhe kualifikimet p\u00ebr t\u00eb cilat kan\u00eb dokumentacion
  t\u00eb pamjaftuesh\u00ebm ose munges\u00eb dokumentacioni. Q\u00ebllimi \u00ebsht\u00eb
  q\u00eb t\u00eb ndihmoj\u00eb aplikant\u00ebt t\u00eb vazhdojn\u00eb studimet e
  m\u00ebtejshme, t\u00eb p\u00ebrmir\u00ebsojn\u00eb njohurit\u00eb e tyre gjysh\u00ebre,
  t\u00eb aplikojn\u00eb p\u00ebr njohjen formale t\u00eb k\u00ebtyre kualifikimeve
  ose t\u00eb gjejn\u00eb pun\u00eb.\\n\\n### 6.1.3 Qasja n\u00eb sh\u00ebrbimet sh\u00ebndet\u00ebsore\\n\\nN\u00eb
  ligjin nr. 10/2021 \u201cP\u00ebr azilin\u201d parashikohet se n\u00eb Qendrat e
  Pritjes p\u00ebr Azil sigurohet kujdesi sh\u00ebndet\u00ebsor. K\u00ebrkuat p\u00ebr
  mbrojtje nd\u00ebrkomb\u00ebtare kan\u00eb t\u00eb drejt\u00ebn p\u00ebr kujdes
  sh\u00ebndet\u00ebsor, i cili p\u00ebrfshin kujdesin e urgjenc\u00ebs sh\u00ebndet\u00ebsore,
  sh\u00ebrbimet e kujdesit sh\u00ebndet\u00ebsor dhe trajtimin e s\u00ebmundjeve
  dhe \u00e7rrregullimeve t\u00eb r\u00ebnda t\u00eb sh\u00ebndetit mendor. K\u00ebrkuave
  q\u00eb kan\u00eb qen\u00eb subjekte t\u00eb p\u00ebrdhunimit, t\u00eb ushtrimit
  t\u00eb tortur\u00ebs, trajtimit \u00e7nj\u00ebr\u00ebzor ose degradues apo formave
  t\u00eb tjera t\u00eb r\u00ebnda t\u00eb dhun\u00ebs, si dhe k\u00ebrkuave q\u00eb
  i p\u00ebrkasin kategoris\u00eb s\u00eb ve\u00e7ant\u00eb u ofrohet trajtim i nevojsh\u00ebm
  sh\u00ebndet\u00ebsor sipas nevojave specifike dhe pasojave t\u00eb shkaktuara.
  Nd\u00ebrsa personi me status refugjati ose personi me statusin e mbrojtjes plot\u00ebsuese
  ka t\u00eb drejt\u00ebn p\u00ebr kujdes sh\u00ebndet\u00ebsor n\u00eb kushte t\u00eb
  nj\u00ebjt\u00eb me shtetasit shqiptar\u00eb.\\n\\nSipas Kompaktit Global p\u00ebr
  Refugjat\u00ebt n\u00eb p\u00ebrputhje me ligjet, politikat dhe planet komb\u00ebtare
  t\u00eb kujdesit sh\u00ebndet\u00ebsor, shtetet duhet t\u00eb p\u00ebrmir\u00ebsojn\u00eb
  cil\u00ebsin\u00eb e sistemeve komb\u00ebtare sh\u00ebndet\u00ebsore p\u00ebr t\u00eb
  leht\u00ebsuar aksesin e refugjat\u00ebve dhe komuniteteve prit\u00ebse, duke p\u00ebrfshir\u00eb
  grat\u00eb dhe vajzat, f\u00ebmij\u00ebt, adoleshent\u00ebt dhe t\u00eb rinjt\u00eb,
  personat e moshuar, ato me s\u00ebmundjet kronike, t\u00eb mbijetuarit nga trafikimi,
  tortura, traumat ose dhuna, p\u00ebrfshir\u00eb dhun\u00ebn seksuale dhe dhun\u00ebn
  me baz\u00eb gjinore dhe personat me aft\u00ebsi t\u00eb kufizuara. Gjithashtu k\u00ebrkohet
  t\u00eb merren masa p\u00ebr t\u00eb siguruar aksesin e barabart\u00eb n\u00eb sasi
  t\u00eb p\u00ebrshtatshme i barnave, furnizimeve mjek\u00ebsore, vaksinave, diagnostifikimit
  dhe produkteve parandaluese.\\n\\n\\\\(^{92}\\\\) [https://www.coe.int/en/ceeb/education/recognition-of-refugees-qualifications](https://www.coe.int/en/ceeb/education/recognition-of-refugees-qualifications)\\n\\nGjat\u00eb
  inspektimit t\u00eb kryer nga Avokati i Popullit n\u00eb Qendr\u00ebn Komb\u00ebtare
  Prit\u00ebse t\u00eb Azilk\u00ebrkesve lidhur me sh\u00ebrbimin sh\u00ebndetesor
  n\u00eb k\u00ebt\u00eb qend\u00ebr \u00ebsht\u00eb konstatuar si m\u00eb posht\u00eb:\\n\\n\u201cOrganika
  e gendr\u00ebs kishte mungesa n\u00eb mjek me koh\u00eb t\u00eb plot\u00eb, infermier
  dhe stomatolog, k\u00ebto sh\u00ebrbime vijn\u00eb t\u00eb mos ofrohen nga qendra,
  por n\u00eb bashk\u00ebpunim me RMSA (Organizata Sh\u00ebrbimet Shqip\u00ebtare
  p\u00ebr Refugjat\u00ebt) dhe UNHCR \u00ebsht\u00eb mbuluar pozicioni i nj\u00eb
  infermieri p\u00ebr nj\u00eb periudh\u00eb 6-mujore. Me rikonstrukcionin e mjediseve
  t\u00eb gendr\u00ebs, ishte parashikuar nj\u00eb dhom\u00eb e ve\u00e7ant\u00eb
  p\u00ebr mjekun me t\u00eb gjitha pajisjet e duhura. Nuk kishte mungesa n\u00eb
  furnizimin me medikamente. Institucioni nuk kishte nj\u00eb autoambulance, por n\u00eb
  raste emergjente p\u00ebrdoreshin makinat e gendr\u00ebs p\u00ebr transportimin
  e azilk\u00ebrkesve pran\u00eb gendrave spitalore. Gjithashtu ishin t\u00eb hapura
  librezat sh\u00ebndet\u00ebsore p\u00ebr t\u00eb gjith\u00eb azilk\u00ebrkesit e
  akomoduar n\u00eb qend\u00ebr, dhe skema e rimbursimit t\u00eb ilaceve ishte n\u00eb
  funksion t\u00eb plot\u00eb. Medikamentet mjek\u00ebsore t\u00eb rimbursueshme p\u00ebrfitoheshin
  me t\u00eb nj\u00ebjt\u00ebn praktik\u00eb si shtetasit e tjer\u00eb t\u00eb Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb, n\u00eb rastin konkret nga fondet e gendr\u00ebs.
  Nd\u00ebrsa medikamentet mjek\u00ebsore t\u00eb parimbursueshme biliheshin sipas
  procedurave t\u00eb prokurimit publik.\u201d\\n\\nN\u00eb raportin vjetor t\u00eb
  Avokatit t\u00eb Popullit p\u00ebr vitin 2023 citohet se Avokati i Popullit n\u00eb
  rolin e Mekanizmit Komb\u00ebtar p\u00ebr Parandalimin e Tortur\u00ebs (MKPT), zhvilloi
  n\u00eb dat\u00ebn 17.02.2023, nj\u00eb inspektim n\u00eb Qendr\u00ebn e Mbyllur
  p\u00ebr t\u00eb Huajt n\u00eb Karrec\u00eb. N\u00eb lidhje me sh\u00ebrbimin sh\u00ebndetesor
  u konstatua se kishte problematika t\u00eb mungesave n\u00eb staf nd\u00ebr t\u00eb
  tjer\u00eb mjeku, dhe stomatologu, mungesa t\u00eb cilat ndikojn\u00eb drejtip\u00ebrdrejt
  n\u00eb respektimin e t\u00eb drejtave t\u00eb personave t\u00eb huaj t\u00eb parregullt
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb. Qendra kishte vet\u00ebm nj\u00eb
  infermier i cili u p\u00ebrgjigjet nevojave dhe sh\u00ebrbimit mjek\u00ebsor.\\n\\nAvokati
  i Popullit n\u00eb rolin e MKPT-s\u00eb, zhvilloi n\u00eb dat\u00ebn 06.09.2023,
  nj\u00eb inspektim n\u00eb Qendr\u00ebn Komb\u00ebtare Prit\u00ebse t\u00eb Azilk\u00ebrkesve
  ku u rekomandua t\u00eb vler\u00ebsohej p\u00ebr shtimin e organik\u00ebs me mjek\u00eb,
  infermier\u00eb, kujdestar\u00eb nate, t\u00eb cilat jan\u00eb t\u00eb domosdoshm\u00eb
  p\u00ebr plot\u00ebsimin e nevojave t\u00eb qendr\u00ebs. Gjithashtu edhe nga kontrolli
  i kryer n\u00eb Qendr\u00ebn Komb\u00ebtare Prit\u00ebse t\u00eb Viktimave t\u00eb
  Trafikut, Linz\u00eb dat\u00eb 8.09.2023 u konstata se n\u00eb Qend\u00ebr pozicionin
  e Mjekut \u00ebsht\u00eb vakant.\\n\\n6.2 Pun\u00ebsimi i t\u00eb Huajve: Rregullat
  dhe k\u00ebrkesat p\u00ebr pun\u00ebsimin e t\u00eb huajve.\\n\\nKonvent\u00ebn
  Nd\u00ebrkom\u00ebtare \u201cP\u00ebr mbrojtjen e t\u00eb drejtave t\u00eb t\u00eb
  gjith\u00eb pun\u00ebtor\u00ebve migrant\u00eb dhe an\u00ebtar\u00ebve t\u00eb familjeve
  t\u00eb tyre\u201d, ratifikuar me ligjin nr.9703, dat\u00eb 2.4.2007 parashikon
  detyrimin e shteteve pal\u00eb q\u00eb n\u00eb p\u00ebrputhje me instrumentet nd\u00ebrkom\u00ebtare
  n\u00eb lidhje me t\u00eb drejtat e njeriut, marrin p\u00ebrsip\u00ebr t\u00eb respektojn\u00eb
  dhe garantojn\u00eb p\u00ebr t\u00eb gjith\u00eb pun\u00ebtor\u00ebt migrant\u00eb
  dhe an\u00ebtar\u00ebt e\\n\\n---\\n\\n53 Rekomandim Nr. Dok. 201900570/2, 2019
  https://www.avokatipopullit.gov.al/media/manager/ebsite/media/Rekomandim%20p%C3%ABmir%C3%ABsimi%20%20kushteve%20dhe%20%20trajtimit%20%C3%AB%20azilk%C3%ABrkuesve%20n%C3%AB%20Qendr%C3%ABn%20Komb%C3%ABtare%20Prit%C3%ABBse%20p%C3%ABC%3ABr%20Azilk%C3%ABrkuesit%20Babrru,%20Tiran%C3%ABB.pdf\\n\\nfamiljeve
  t\u00eb tyre, brenda territorit ose objekt i juridiksjonit t\u00eb tyre, t\u00eb
  drejtat e parashikuara n\u00eb konvent\u00eb pa dallim gjinie, race, ngjyre, gjuhe,
  feje, besimi, bindjesh politike ose t\u00eb tjer\u00eb, origjine komb\u00ebtare,
  etnike apo shoq\u00ebrore, shtet\u00ebsie, moshe, gjendjeje ekonomike, pasurie,
  gjendjeje civile, status lindjeje apo tjet\u00ebr. Nuk \u00ebsht\u00eb e lejueshme
  t\u00eb ushtrohet asnj\u00eb form\u00eb presioni mbi pun\u00ebtor\u00ebt migrant\u00eb
  dhe an\u00ebtar\u00ebt e familjeve t\u00eb tyre, me q\u00ebllim q\u00eb ata t\u00eb
  heqin dor\u00eb apo t\u00eb mos k\u00ebrkojn\u00eb ndonj\u00eb nga t\u00eb drejtat
  e caktuara. Nuk \u00ebsht\u00eb e mundur q\u00eb t\u00eb devijohet me an\u00eb t\u00eb
  kontrat\u00ebs nga t\u00eb drejtat e njohura n\u00eb Konvent\u00eb. Shtetet Pal\u00eb
  marrin masat e p\u00ebrshtatshme p\u00ebr t\u00eb siguruar respektimin e k\u00ebtyre
  parimeve.\\n\\nMarr\u00ebveshja e Stabilizim \u2013 Asociimit p\u00ebrmban detyrime
  t\u00eb shumta, q\u00eb burojn\u00eb nga dispozitat e neneve 48 dhe 49 t\u00eb MSA,
  n\u00eb fush\u00ebn e qasjes n\u00eb tregun e pun\u00ebs p\u00ebr shtetasit e BE-s\u00eb
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, l\u00ebvizjen e pun\u00ebtor\u00ebve,
  kushtet e pun\u00ebsimit dhe trajnimet profesional. Aspekte t\u00eb tjera t\u00eb
  l\u00ebvizjes s\u00eb lir\u00eb t\u00eb pun\u00ebtor\u00ebve kan\u00eb t\u00eb b\u00ebjn\u00eb
  me promovimin e shk\u00ebmbimeve rinore dhe p\u00ebrfundimin e marr\u00ebveshjeve
  dypal\u00ebshe p\u00ebr pun\u00ebsimin dhe formimin profesional nd\u00ebrmjet Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb dhe Shteteve An\u00ebtare t\u00eb Bashkimit Evropian.
  Marr\u00ebveshja e Stabilizim Asociimit parashikon q\u00eb, n\u00eb p\u00ebrpunhje
  me kushtet dhe modalitetet e zbatueshme, Shqip\u00ebria dhe Shtetet An\u00ebtare
  t\u00eb BE-s\u00eb t\u00eb sigurojn\u00eb q\u00eb shtetasit e vendit partner t\u00eb
  cil\u00ebt jan\u00eb t\u00eb pun\u00ebsuar ligj\u00ebrisht n\u00eb territorin e
  tyre nuk jan\u00eb objekt diskriminimi, p\u00ebr sa i p\u00ebrket komb\u00ebsis\u00eb,
  kushteve t\u00eb pun\u00ebs, shp\u00ebrblimit apo pushimit nga puna.\\n\\nStrategjia
  Komb\u00ebtare e Pun\u00ebsimit dhe Aft\u00ebsive 2023\u20132030 ofron nj\u00eb
  vler\u00ebsim t\u00eb situat\u00ebs s\u00eb migracionit nga k\u00ebndv\u00ebshtrimi
  i pun\u00ebsimit dhe aft\u00ebsive. SKPA-ja, n\u00eb masat q\u00eb synojn\u00eb
  t\u00eb realizojn\u00eb vizionin e saj p\u00ebr pun\u00ebsim dhe aft\u00ebsi p\u00ebr
  t\u00eb gjith\u00eb, gjat\u00eb t\u00eb gjith\u00eb jet\u00ebs, n\u00eb m\u00ebnyr\u00eb
  specifike p\u00ebr l\u00ebvizshm\u00ebrin\u00eb e fuqis\u00eb pun\u00ebtore, parashikon
  nd\u00ebrhyrje q\u00eb synojn\u00eb lidhjen me platform\u00ebn evropiane t\u00eb
  zyrave t\u00eb pun\u00ebsimit (EURES), p\u00ebrmir\u00ebsimin e kuadrit rregulator
  p\u00ebr rekrutimin e drejt\u00eb t\u00eb punonj\u00ebsve, forcinim e bashk\u00ebpunimit
  nd\u00ebrmjet zyrave publike dhe private t\u00eb pun\u00ebsimit, identifikimin e
  aft\u00ebsive t\u00eb munguara n\u00eb vend e rajon dhe plot\u00ebsimin e tyre n\u00ebp\u00ebrmjet
  promovimit t\u00eb l\u00ebvizshm\u00ebris\u00eb n\u00eb rajonin e Evrop\u00ebs Juglindore.\\n\\nQytetar\u00ebt
  e BE-s\u00eb kan\u00eb t\u00eb drejt\u00eb t\u00eb punojn\u00eb n\u00eb Shqip\u00ebri
  pa leje pune. Kjo mund\u00ebsohet nga dispozitat e ligjit p\u00ebr t\u00eb Huajt
  dhe ndryshimeve pasuese, t\u00eb cilat parashikojn\u00eb se t\u00eb huajve nuk iu
  nevojitet leje pune apo certifikat\u00eb regjistrimi biznesi, n\u00ebse jan\u00eb
  shtetas t\u00eb nj\u00eb Shteti An\u00ebtar t\u00eb BE-s\u00eb ose vendi Schengen
  dhe me q\u00ebndrim t\u00eb ligjsh\u00ebm n\u00eb Shqip\u00ebri.\\n\\nLigji nr.
  15/2019 \\\"P\u00ebr nxitjen e pun\u00ebsimit\\\", i ndryshuar parashikon se t\u00eb
  drejt\u00ebn e p\u00ebrfitimit t\u00eb sh\u00ebrbimeve q\u00eb ofrohen n\u00eb struktur\u00ebn
  rajonale/vendore e kan\u00eb t\u00eb gjith\u00eb shtetasit e huaj dhe ata pa shtet\u00ebsi,
  t\u00eb cil\u00ebt hyjn\u00eb e q\u00ebndrojn\u00eb n\u00eb m\u00ebnyr\u00eb t\u00eb
  ligjshme n\u00eb territorin e Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb, p\u00ebr
  q\u00ebllime pun\u00ebsimi, n\u00eb p\u00ebrpunhje me legjislacionin n\u00eb fuqi
  p\u00ebr t\u00eb huajt. Gjithashtu t\u00eb drejt\u00ebn e p\u00ebrfitimit t\u00eb
  k\u00ebtyre sh\u00ebrbimeve e kan\u00eb edhe t\u00eb huajt, t\u00eb cil\u00ebt kan\u00eb
  p\u00ebrfituar statusin e refugjatat, si dhe azil\u00ebrk\u00ebkuesit n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb.\\n\\nI huaji mund t\u00eb pun\u00ebsohet n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb duke u pajisur me leje unike. Aplikimi p\u00ebr leje unike
  b\u00ebhet p\u00ebrmes sistemit elektronik t\u00eb sigurt on-line. N\u00eb momentin
  e p\u00ebrfundimit t\u00eb\\n\\naplikimit t\u00eb huajt i d\u00ebrgohet nj\u00eb
  njoftim on-line p\u00ebr pranimin e aplikimit.\\\\textsuperscript{94}\\n\\nAutoriteti
  p\u00ebr marrjen e aplikimit dhe l\u00ebshimin e lejes unike \u00ebsht\u00eb autoriteti
  i kufirit dhe migracionit. P\u00ebr kategorit\u00eb e t\u00eb huajve, t\u00eb cilat
  n\u00eb baz\u00eb t\u00eb ligjit duhet t\u00eb marrin miratimin e pun\u00ebsimit,
  aplikimi shqyrtohet dhe aprovohet on-line fillimisht nga AKPA-ja. Kategorit\u00eb
  q\u00eb marrin miratim nga Agjencia Komb\u00ebtare e Pun\u00ebsimit dhe Aft\u00ebsive,
  p\u00ebr sa koh\u00eb q\u00eb nuk parashikohet ndryshe n\u00eb marr\u00ebveshje
  nd\u00ebrshtet\u00ebrore apo akte t\u00eb tjer\u00eb ligjore, jan\u00eb pun\u00ebmarr\u00ebsit,
  punonj\u00ebsit stinor\u00eb t\u00eb transferuar brenda nd\u00ebrmarrjes, punonj\u00ebsit
  me kualifikim t\u00eb lart\u00eb, vullnetar\u00ebt, sportist\u00ebt dhe sh\u00ebrbimet
  kontraktuale. P\u00ebr kategorin\u00eb e t\u00eb huajve t\u00eb vet\u00ebpun\u00ebsuar
  dhe investitor\u00eb, vler\u00ebsimi i plot\u00ebsimit t\u00eb kushteve p\u00ebr
  pajisjen me leje unike b\u00ebhet nga komisioni vler\u00ebsues i ministris\u00eb
  p\u00ebrgjegj\u00ebse p\u00ebr financat dhe ekonomin\u00eb. P\u00ebr kategorit\u00eb
  e t\u00eb huajve, t\u00eb cil\u00ebt, n\u00eb baz\u00eb t\u00eb ligjit kan\u00eb
  nevoj\u00eb p\u00ebr pajisen me viz\u00eb, viza miratohet nga Ministria p\u00ebr
  Evrop\u00ebn dhe Pun\u00ebt e Jashtme pasi t\u00eb jet\u00eb aprovouar miratimi
  i pun\u00ebsimit nga AKPA-ja. Pas miratimit t\u00eb pun\u00ebsimit nga AKPA-ja dhe
  miratimit t\u00eb viz\u00ebs nga Ministria p\u00ebr Evrop\u00ebn dhe Pun\u00ebt
  e Jashtme, autoriteti p\u00ebr kufirin dhe migracionin merr vendimin p\u00ebr l\u00ebshimin,
  ndryshimin ose rip\u00ebrt\u00ebritjen e lejes unike, n\u00ebse aplikuesi p\u00ebrmbush
  kushtet e specifikuara n\u00eb ligj. P\u00ebr kategorit\u00eb q\u00eb nuk kan\u00eb
  nevoj\u00eb p\u00ebr miratim pun\u00ebsimi dhe miratim vize, aplikimi b\u00ebhet
  direkt te struktura p\u00ebrgjegj\u00ebse p\u00ebr \u00e7\u00ebshtjet e kufirit
  dhe migracionit. Shqyrtimi i k\u00ebrkes\u00ebs dhe l\u00ebshimi i lejes unike t\u00eb
  q\u00ebndrimit, kur plot\u00ebsohen kriteret e k\u00ebrkuara nga legjislationi n\u00eb
  fuqi, b\u00ebhen brenda nj\u00eb afati maksimal prej 12 jav\u00ebsh nga dita e aplikimit.
  Miratimi apo refuzimi i k\u00ebrkes\u00ebs i njoftohet on-line.\\n\\nDokumentacioni
  i nevojsh\u00ebm p\u00ebr tu p\u00ebsuar me leje unike si pun\u00ebmarr\u00ebs:\\n\\n-
  Kontrata e pun\u00ebs si pun\u00ebmarr\u00ebs me nj\u00eb pun\u00ebdh\u00ebn\u00ebs,
  n\u00eb p\u00ebrpunhje me formimin e tij profesional (kontrata e pun\u00ebs duhet
  t\u00eb p\u00ebrmbaj\u00eb t\u00eb gjitha k\u00ebrkesat e p\u00ebr\u00e7aktuara
  n\u00eb Kodin e Pun\u00ebs t\u00eb Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb
  p\u00ebr k\u00ebt\u00eb dokument), ose kategorizimi si pun\u00ebk\u00ebrkuar, n\u00eb
  p\u00ebrpunhje me marr\u00ebveshje reciproke nd\u00ebrqeveritar\u00eb.\\n- D\u00ebshmi
  aft\u00ebsimi (diploma/certifikata/referenca) ose vet\u00ebdeklarim p\u00ebr eksperienc\u00ebn
  n\u00eb pun\u00eb q\u00eb v\u00ebrteton aft\u00ebsit\u00eb profesionale n\u00eb
  p\u00ebrpunhje me pun\u00ebn q\u00eb do t\u00eb kryej\u00eb sipas kontrat\u00ebs
  s\u00eb pun\u00ebs.\\n\\nSipas raportit t\u00eb INSTAT p\u00ebr vitin 2023, pun\u00ebsimi
  \u00ebsht\u00eb arsyja kryesore e lejeve t\u00eb q\u00ebndrimit t\u00eb t\u00eb
  huajve n\u00eb Shqip\u00ebri n\u00eb 2023 me 48,3 %. Nga shtetet e Bashkimit Evropian,
  qytetar\u00ebt italian\u00eb p\u00ebrmbajn\u00eb numrin m\u00eb t\u00eb madh t\u00eb
  qytetar\u00ebve t\u00eb BE-s\u00eb n\u00eb tregun shqiptar t\u00eb pun\u00ebs dhe
  jan\u00eb t\u00eb pun\u00ebsuar kryesisht n\u00eb fush\u00ebn e mjek\u00ebsis\u00eb,
  sh\u00ebrbimeve, marketingut, tregtis\u00eb, industris\u00eb p\u00ebrpunuese, informacionit
  dhe telekomunikacionit. Qytetar\u00ebt rumun\u00eb, t\u00eb cil\u00ebt jan\u00eb
  grupi i dyt\u00eb m\u00eb i madh i qytetar\u00ebve t\u00eb BE-s\u00eb q\u00eb hyjn\u00eb
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb, jan\u00eb t\u00eb pun\u00ebsuar
  kryesisht n\u00eb fush\u00ebn e tregtis\u00eb dhe sh\u00ebrbimeve dhe call centers.\\n\\n\\\\textsuperscript{94}
  Vendim nr. 858, dat\u00eb 29.12.2021 i K\u00ebshillit t\u00eb Ministrave \u201cP\u00ebr
  p\u00ebrcaktimin e kritereve, t\u00eb procedurave e t\u00eb dokumentacionit p\u00ebr
  hyrjen, q\u00ebndrimin dhe trajtimin e t\u00eb huajve n\u00eb Republik\u00ebn e
  Shqip\u00ebris\u00eb\u201d, i ndryshuar.\\n\\nRishikimi i kuadrit ligjor, rregullator
  dhe i mekanizmave p\u00ebr nxitjen e rekrutimit t\u00eb drejt\u00eb (fair recruitment)
  nga vendet e huaja \u00ebsht\u00eb nj\u00eb nd\u00ebr objektivat e Strategjis\u00eb
  Komb\u00ebtare t\u00eb Pun\u00ebsimit dhe Aftesive 2023\u20132030, planit t\u00eb
  veprimit p\u00ebr zbatimin e saj.\\n\\nGjithashtu n\u00eb Strategjin\u00eb Komb\u00ebtare
  p\u00ebr Barazin\u00eb Gjinore 2021\u20132030, specifikisht parashikohen nd\u00ebrhyrje
  p\u00ebr: p\u00ebrmbushjen e t\u00eb drejtave ekonomike dhe sociale p\u00ebr grat\u00eb
  migrante; rritjen e aksesit t\u00eb grave migrante n\u00eb sh\u00ebrbime dhe produkte
  financiare, informimin e grave migrante p\u00ebr t\u00eb drejtat pron\u00ebsore;
  reduktimin e barrierave q\u00eb i mbajn\u00eb grat\u00eb, t\u00eb rejat dhe vajzat
  larg tregut t\u00eb pun\u00ebs, si dhe rritjen e aksesit t\u00eb grave, t\u00eb
  rejave dhe vajzave nga t\u00eb gjitha grupet (migrant\u00eb dhe azilk\u00ebrkues
  etj.), p\u00ebr pun\u00eb t\u00eb denj\u00eb edhe n\u00eb sektor\u00ebt e pun\u00ebsimit
  jotradicional (n\u00eb ve\u00e7anti n\u00eb shkenc\u00eb, teknologji, inxhinieri,
  matematik\u00eb) dhe p\u00ebrmir\u00ebsimin e sh\u00ebrbimeve t\u00eb specializuara
  mb\u00ebshtet\u00ebse p\u00ebr t\u00eb mbijetuarat e dhun\u00ebs me baz\u00eb gjinore,
  trafikimit dhe shfryt\u00ebzimit seksual, nga t\u00eb gjitha grupet e grave (p\u00ebrfsir\u00eb
  grat\u00eb migrante).\\n\\nT\u00eb huajt i pajisur me leje t\u00eb p\u00ebrhershme
  q\u00ebndrimi quhen banor afatgjat\u00eb dhe duhet t\u00eb regjistrohen n\u00eb
  zyr\u00ebn p\u00ebrkat\u00ebse t\u00eb gjendjes civile. I huaji q\u00eb pajiset
  me let\u00ebrmjofitim p\u00ebr t\u00eb huajt mund t\u00eb pun\u00ebsohet, t\u00eb
  vet\u00ebpun\u00ebsohet ose t\u00eb merret me veprimtari biznesi t\u00eb drejtp\u00ebrdrejt\u00eb,
  pa pasur nevoj\u00eb t\u00eb pajiset me leje pun\u00ebsimi. Banor\u00ebt afatgjat\u00eb
  g\u00ebzojn\u00eb t\u00eb drejtat ekonomike, sh\u00ebndet\u00ebsore dhe sociale,
  t\u00eb nj\u00ebjta me shtetasit shqiptar\u00eb, n\u00eb p\u00ebrpunhje me legjislacionin
  n\u00eb fuqi.\\n\\nNj\u00eb nd\u00ebr objektivat e strategjis\u00eb komb\u00ebtare
  p\u00ebr migracionin \u00ebsht\u00eb integrimi social-ekonomik i refugiat\u00ebve
  dhe azilk\u00ebrkuesve. Sipas t\u00eb dh\u00ebnave mbi k\u00ebt\u00eb tregues nuk
  rezulton asnj\u00eb azilk\u00ebrkues i pun\u00ebsuar p\u00ebr vitin 2023.\\n\\n---\\n\\n95
  https://arkiva.financa.gov.al/ep-content/uploads/2023/10/Strategjia-Kombetare-e-Punesimit-dhe-Aftesive-2023-2030-VKM-173.pdf\\n\\nVII.
  Konkluzione dhe Rekomandim\\n\\n7.1 Konkluzione dhe gjetjet kryesore.\\n\\n1. **P\u00ebrputhshm\u00ebria
  me legjislacionin e BE-s\u00eb**: Shqip\u00ebria ka b\u00ebr\u00eb p\u00ebrparime
  t\u00eb r\u00ebnd\u00ebsishme n\u00eb p\u00ebrrafrimin e kuadrit t\u00eb saj ligjor
  p\u00ebr migracionin dhe azilin me legjislacionin e BE-s\u00eb. Megjithat\u00eb,
  ky kuadr\u00eb k\u00ebrkon p\u00ebrdit\u00ebsim\u00eb t\u00eb vazhdueshme p\u00ebr
  t\u00eb mbajtur ritmin me ndryshimet e fundit n\u00eb BE, ve\u00e7an\u00ebrisht
  n\u00eb fushat q\u00eb lidhen me Kart\u00ebn Blu dhe vizat. N\u00eb fush\u00ebn
  e azilit, Shqip\u00ebria ka p\u00ebrfituar nga harmonizimi i legjislacionit me Direktavit
  e BE-s\u00eb p\u00ebr azilin dhe migracionin, duke siguruar mbrojtje p\u00ebr refugiat\u00ebt
  dhe migrant\u00ebt sipas standardeve nd\u00ebrkomb\u00ebtare.\\n\\n2. **Reduktimi
  i flukseve t\u00eb parregullta**: Komisioni Evropian thekson se Shqip\u00ebria ka
  treguar p\u00ebrparim t\u00eb duksh\u00ebm n\u00eb menaxhimin e flukseve migratore
  t\u00eb parregullta. N\u00eb vitin 2022, numri i migrant\u00ebve t\u00eb parregullt
  q\u00eb hyjn\u00eb n\u00eb vend u reduktua me 34% krahasuar me vitin 2021. Kjo ulje
  reflekton p\u00ebrprjekjet e suksesshme t\u00eb Shqip\u00ebris\u00eb p\u00ebr t\u00eb
  kontrolluar kufijt\u00eb dhe p\u00ebr t\u00eb menaxhuar migracionin e parregullt
  n\u00eb bashk\u00ebpunim me organizata si Frontex. Kjo \u00ebsht\u00eb nj\u00eb
  arritje pozitive, por duhet t\u00eb theksohet se sfidat n\u00eb k\u00ebt\u00eb fush\u00eb
  mbeten ende.\\n\\n3. **Qasja n\u00eb procedurat e azilit**: Nj\u00eb nga sfidat
  kryesore \u00ebsht\u00eb qasja e kufizuar n\u00eb procedurat e azilit. Megjith\u00ebse
  numri i personave q\u00eb kan\u00eb shprehur synimin p\u00ebr t\u00eb k\u00ebrkuar
  azil mbetet i lart\u00eb, shum\u00eb prej tyre nuk arrijn\u00eb t\u00eb formalizon\u00eb
  k\u00ebrkesat p\u00ebr shkak t\u00eb sfidave burokratike dhe qasjes s\u00eb kufizuar
  n\u00eb mbrojtje nd\u00ebrkomb\u00ebtare. Kjo tregon nevoj\u00ebn p\u00ebr p\u00ebrmir\u00ebsimin
  e procedurave administrative dhe leht\u00ebsimin e qasjes p\u00ebr ata q\u00eb k\u00ebrkojn\u00eb
  mbrojtje.\\n\\n4. **Mbrojtja e f\u00ebmij\u00ebve t\u00eb pashoq\u00ebruar**: F\u00ebmij\u00ebt
  e pashoq\u00ebruar jan\u00eb nj\u00eb grup ve\u00e7an\u00ebrisht vulnerab\u00ebl
  dhe p\u00ebrballen me sfida t\u00eb shumta n\u00eb Shqip\u00ebri. Aktualisht, ekziston
  nj\u00eb munges\u00eb e akomodimit t\u00eb p\u00ebrshtatsh\u00ebm dhe mb\u00ebshtetjes
  s\u00eb ve\u00e7ant\u00eb p\u00ebr k\u00ebta f\u00ebmij\u00eb. Kjo kategori k\u00ebrkon
  kujdes t\u00eb specializuar, duke p\u00ebrfsir\u00eb strehim t\u00eb sigurt, mb\u00ebshtetje
  psikosociale dhe arsimim. Nevoja p\u00ebr nj\u00eb qasje m\u00eb t\u00eb strukturuar
  dhe t\u00eb q\u00ebndrueshme p\u00ebr mbrojtjen e f\u00ebmij\u00ebve t\u00eb pashoq\u00ebruar
  mbetet nj\u00eb nga \u00e7\u00ebshtjet ky\u00e7e.\\n\\n7.2 Rekomandimet e Analiz\u00ebs:\\n\\n1.
  **P\u00ebrmir\u00ebsimi i kuadrit ligjor**: Shqip\u00ebria duhet t\u00eb vazhdoj\u00eb
  p\u00ebrprjekjet p\u00ebr p\u00ebrdit\u00ebsimin e legjislacionit t\u00eb saj mbi
  migracionin dhe azilin, n\u00eb p\u00ebrputhje me zhvillimet m\u00eb t\u00eb fundit
  n\u00eb BE. N\u00eb ve\u00e7anti, duhet t\u00eb p\u00ebrfafohen dispozitat mbi bashkimin
  familjar dhe Kart\u00ebn Blu t\u00eb BE-s\u00eb, p\u00ebr t\u00eb siguruar q\u00eb
  t\u00eb huajt q\u00eb t\u00eb punojn\u00eb dhe jetojn\u00eb n\u00eb Shqip\u00ebri
  t\u00eb\\n\\nken\u00eb t\u00eb drejta t\u00eb qarta dhe procedura transparente.
  Kjo do t\u00eb ndihmoj\u00eb n\u00eb krijuimin e nj\u00eb mjedisi m\u00eb t\u00eb
  favorsh\u00ebm p\u00ebr migrant\u00ebt ekonomik\u00eb dhe do t\u00eb forcoj\u00eb
  sistemin e menaxhimit t\u00eb migracionit.\\n\\n2. **Rritja e kapaciteteve p\u00ebr
  kthim:** Nj\u00eb tjet\u00ebr rekomandim \u00ebsht\u00eb p\u00ebrmir\u00ebsimi i
  procedurave t\u00eb kthimit t\u00eb migrant\u00ebve t\u00eb parregullt n\u00eb vendet
  e origjin\u00ebs s\u00eb tyre. Kjo p\u00ebrfshin zhvillimin e mekanizmave t\u00eb
  kthimit t\u00eb sigurt dhe dinjitoz, duke respektuar t\u00eb drejtat e migrant\u00ebve.
  Shqip\u00ebria duhet t\u00eb forcoj\u00eb kapacitetet p\u00ebr trajimin e k\u00ebtyre
  procedurave n\u00eb p\u00ebrpunhje me standardet nd\u00ebrkomb\u00ebtare dhe t\u00eb
  siguroj\u00eb q\u00eb proceset e kthimit t\u00eb jen\u00eb t\u00eb koordinuara dhe
  humane.\\n\\n3. **Mbrojtja e f\u00ebmij\u00ebve t\u00eb pashoq\u00ebruar:** Kjo
  kategori e vulnerab\u00ebl k\u00ebrkon masa t\u00eb ve\u00e7anta mbrojtjeje. Shqip\u00ebria
  duhet t\u00eb rris\u00eb kapacitetet p\u00ebr ofrimin e sh\u00ebrbimeve t\u00eb
  p\u00ebrshtatshme p\u00ebr k\u00ebta f\u00ebmij\u00eb, duke p\u00ebrfshir\u00eb
  akomodim t\u00eb sigurt, mb\u00ebshtetje edukative dhe psikosociale. P\u00ebrmir\u00ebsimi
  i strukturave p\u00ebr menaxhimin e nevojave t\u00eb tyre do t\u00eb jet\u00eb jetik
  p\u00ebr t\u00eb siguruar q\u00eb f\u00ebmij\u00ebt e pashoq\u00ebruar t\u00eb mos
  mbeten pa mbrojtje t\u00eb mjafutueshme.\\n\\n4. **Bashk\u00ebpunimi nd\u00ebrkomb\u00ebtar:**
  P\u00ebrmir\u00ebsimi i situat\u00ebs p\u00ebr migrant\u00ebt dhe refugiat\u00ebt
  k\u00ebrkon nj\u00eb bashk\u00ebpunim t\u00eb vazhduesh\u00ebm nd\u00ebrkomb\u00ebtar.
  Shqip\u00ebria duhet t\u00eb vazhdoj\u00eb t\u00eb punoj\u00eb ngusht\u00eb me BE-n\u00eb,
  UNHCR, IOM dhe organizata t\u00eb tjera nd\u00ebrkomb\u00ebtare p\u00ebr t\u00eb
  siguruar q\u00eb politika dhe praktikat e saj p\u00ebr menaxhimin e migracionit
  t\u00eb p\u00ebrputhen me standardet nd\u00ebrkomb\u00ebtare. Ky bashk\u00ebpunim
  do t\u00eb jet\u00eb ky\u00e7 p\u00ebr adresimin e sfidave t\u00eb flukseve migratore
  dhe p\u00ebrmir\u00ebsimin e sh\u00ebrbimeve p\u00ebr migrant\u00ebt dhe refugiat\u00ebt
  n\u00eb vend.\\n\\n5. **Lidhur me pun\u00ebsimin:** Bazuar n\u00eb standardet nd\u00ebrkomb\u00ebtare,
  Shqip\u00ebria ka nj\u00eb kuad\u00ebr t\u00eb plot\u00eb rregullator sa i p\u00ebrket
  pun\u00ebsimit t\u00eb t\u00eb huajve n\u00ebp\u00ebrmjet lejeve unike t\u00eb parashikuara
  n\u00eb ligjin specifik. Rekomandohet q\u00eb t\u00eb krijohen leht\u00ebsira n\u00eb
  procedurat e pun\u00ebsimit sa i p\u00ebrket marrjes s\u00eb Kart\u00ebs Blu, duke
  i siguruar t\u00eb huajt edhe Kart\u00ebn Blu edhe rezidenc\u00ebn n\u00eb t\u00eb
  nj\u00ebjt\u00ebn koh\u00eb dhe jo si procese t\u00eb ndara.\\n\\n6. **Lidhur me
  arsimi:** Ashtu si p\u00ebr pun\u00ebsimin dhe sh\u00ebrbimet t\u00eb tjera t\u00eb
  parashikuara p\u00ebr t\u00eb huajt, ekzistojn\u00eb leht\u00ebsira t\u00eb cilat
  garantojn\u00eb arsimimin e tyre, por rekomandohet t\u00eb hapen programe t\u00eb
  reja studimi n\u00eb gjuh\u00eb t\u00eb huaj dhe programe t\u00eb p\u00ebrbashk\u00ebta
  e t\u00eb dyfishta q\u00eb leht\u00ebsojn\u00eb shkollimin e tyre.\"", "\"SHTOJCA
  2  \u2013 T\u00eb ardhurat dhe shpenzimet e Kandidat\u00ebve\\n\\nTabela paraqet
  t\u00eb detajuara t\u00eb ardhurat dhe shpenzimet p\u00ebr kandidat\u00ebt e propozuar
  nga partit\u00eb politike apo koalicionet zgjedhore. N\u00eb k\u00ebt\u00eb shtojc\u00eb
  jan\u00eb p\u00ebrfshir\u00eb vet\u00ebm kandidat\u00ebt, t\u00eb cil\u00ebt kan\u00eb
  dor\u00ebzuar raportin e vet\u00ebdeklarimit n\u00eb KQZ.\\n\\nN\u00eb grup-kolon\u00ebn
  e par\u00eb, paraqiten emrat e kandidat\u00ebve sipas subjekteve zgjedhore n\u00eb
  logon e t\u00eb cil\u00ebve ata kandiduan, Bashkia ku kandiduan, si dhe numri i
