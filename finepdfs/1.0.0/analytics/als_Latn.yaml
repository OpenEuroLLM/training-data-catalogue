  | Regjistrimi me k\u00ebrkes\u00eb t\u00eb \u00e7do t\u00eb treti t\u00eb vendimeve
  t\u00eb autoritetit           |\\n\\n*Burimi i t\u00eb dh\u00ebnave: QKB  \\nPunoi:
  KLSH*\\n\\nNga auditimi rezulton se formular\u00eb t\u00eb pa standardizuar p\u00ebr
  Licencat/Lejet jan\u00eb si m\u00eb posht\u00eb:\\n\\n10. Titulli i gjetjes: Standardizimi
  i formular\u00ebve\\n\\nSituata: Nga auditimi rezultojn\u00eb t\u00eb pa standardizuar
  formular\u00ebt p\u00ebr 56 sh\u00ebrbime p\u00ebr regjistrin e biznesit si dhe
  6 sh\u00ebrbime p\u00ebr regjistrin e Licencave/Lejeve dhe Autorizimeve.\\n\\nKriteri:
  Standardizimi i formular\u00ebve t\u00eb aplikimit\\n\\nNdiskimi/efekti: Formular\u00eb
  t\u00eb pa standardizuar lidhur me veprimet operacionale n\u00eb t\u00eb dy regjistrat.\\n\\nShkaku:
  Kosto e lart\u00eb p\u00ebr standardizimin e tyre\\n\\nR\u00ebnd\u00ebsia: E mesme\\n\\nRekomandimi
  QKB t\u00eb analizoj\u00eb t\u00eb gjitha mund\u00ebsit\u00eb operacionale dhe ato
  financiare duke renditur grupimin e formular\u00ebve nga prioriteti me i lart\u00eb,
  p\u00ebr standardizimin e formular\u00ebve q\u00eb kan\u00eb num\u00ebr t\u00eb
  madh aplikimesh.\\n\\nP\u00ebr sa \u00ebsht\u00eb trajtuar n\u00eb k\u00ebt\u00eb
  pik\u00eb t\u00eb Raportit P\u00ebrfundimtar t\u00eb Auditimit \u00ebsht\u00eb mbajtur
  Aktkonstatimi nr. 4, dat\u00eb 18.07.2018, si dhe \u00ebsht\u00eb trajtuar n\u00eb
  faqet 25-37 t\u00eb Projektraportit t\u00eb Auditimit, mbi t\u00eb cilin jan\u00eb
  paraqitur observacione me shkres\u00ebn nr. 5086/21, dat\u00eb 25.07.2018, protokolluar
  n\u00eb KLSH me nr. 550/3, dat\u00eb 27.07.2018, si dhe me shkres\u00ebn nr. 5086/23,
  dat\u00eb 30.08.2018, protokolluar n\u00eb KLSH me nr. 550/5, dat\u00eb 31.08.2018,
  t\u00eb cilat n\u00eb thelb jan\u00eb t\u00eb nj\u00ebjt\u00eb.\\n\\nPretendimi
  i subjektit:\\n\\nI. Lidhur me gjetjen: \u201cmungon formati kur \u00e7\u00ebshtja
  hapet nga vet\u00eb punonj\u00ebsit n\u00eb zbatim t\u00eb urdh\u00ebrave apo vendimeve
  t\u00eb ndryshme q\u00eb jan\u00eb detyruese p\u00ebr zbatim. Gjithashtu, nuk disponohet
  procedur\u00eb p\u00ebr inicimin, rishikimin dhe aprovimin e ndryshimeve, klasifikimin
  e tyre sipas r\u00ebnd\u00ebsis\u00eb, ndarjen e detyrave dhe p\u00ebrgjegj\u00ebsive
  p\u00ebr kryerjen e ndryshimeve (update, upgrade, etj.), struktura kontrolli p\u00ebr
  verifikimin e efektivitetit t\u00eb ndryshimeve t\u00eb kryera, procedura p\u00ebr
  ndryshimet emergjente si dhe dokumentimin e t\u00eb gjith\u00eb procesit t\u00eb
  ndryshimeve, duke p\u00ebrfshir\u00eb dhe incidentet q\u00eb vijn\u00eb nga nd\u00ebrveprimi
  i t\u00eb dh\u00ebnave.\u201d\\n\\nLidhur me fjalin\u00eb e par\u00eb t\u00eb gjetjes
  n\u00eb fund t\u00eb faqes 1 sqarojm\u00eb se: p\u00ebr \u00e7do aplikim ka nj\u00eb
  format p\u00ebrve\u00e7 rasteve kur sh\u00ebrbimi nuk klasifikohet si aplikim i
  mir\u00ebfilit\u00eb, por \u00ebsht\u00eb sh\u00ebrbim p\u00ebrpunim t\u00eb dh\u00ebna\u0161,
  printim ekstrakti, apo rezervim, transferim emri. N\u00eb gjitha rastet e tjera
  gjenerohet nj\u00eb format i cili n\u00ebnshkruhet nga n\u00ebpun\u00ebsi i sportelit.
  Kur aplikimi kryhet kryesisht, ky format nuk ngarkohet n\u00eb dosjen elektronike
  t\u00eb ruajtura pasi t\u00eb dh\u00ebnat identifikuase jan\u00eb t\u00eb leht\u00eb
  gjetsh\u00ebm dhe t\u00eb verifikueshm\u00eb n\u00eb \u00e7do moment, \u00e7do aplikim
  ka gjurm\u00eb elektronike t\u00eb \u00e7do procesi q\u00eb ndjek aplikimi n\u00eb
  baz\u00eb t\u00eb Workflow t\u00eb aplikimit.\\n\\nInicimi/rishikimi i ndryshimeve
  b\u00ebhet rast pas rastit n\u00eb zbatim t\u00eb detyrimeve lidhur me procedurat
  e regjistrimit dhe licencimit t\u00eb biznesit ose p\u00ebr nevoja t\u00eb p\u00ebrmir\u00ebsimit
  t\u00eb sh\u00ebrbimit t\u00eb ofruar nga QKB. Klasifikimi lidhur m\u00eb r\u00ebnd\u00ebsin\u00eb
  e ndryshimeve b\u00ebhet rast pas rastit. P\u00ebrsa i p\u00ebrket strukturave t\u00eb
  kontrollit ky proces kryhet nga drejtoria t\u00eb p\u00ebrkat\u00ebse duke mos pasur
  mjafuesh\u00ebm personel t\u00eb dedikuar vet\u00ebm p\u00ebr k\u00ebt\u00eb proces,
  i gjith\u00eb kontrolli kryhet nga\\n\\nndjek\u00ebsit e kontratave respektive.\\n\\n2.
  Lidhur me gjetjen: \u201cQKB dhe DPT jan\u00eb dakord\u00ebsuar p\u00ebr nd\u00ebrveprimin
  e t\u00eb dh\u00ebnave pa p\u00ebrfshirjen e Autoriteti Rregullator Koordinues si
  institucioni p\u00ebrgjegj\u00ebs p\u00ebr p\u00ebrpunimin, p\u00ebrdit\u00ebsimin
  dhe standardizimin e procedurave dhe rregullave p\u00ebr krijimin, regjistrimin,
  p\u00ebrfundimin e funksionimit, administrimin, nd\u00ebrveprimin dhe sigurin\u00eb
  e bazave t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore dhe element\u00ebve t\u00eb
  tjer\u00eb specifik\u00eb q\u00eb lidhen me k\u00ebto procese bazuar n\u00eb nenin
  10/pika 1,2 t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\nSqarojm\u00eb se duke q\u00ebn\u00eb
  se dakort\u00ebsia mes QKB dhe DPT \u00ebsht\u00eb b\u00ebr\u00eb gjat\u00eb periudh\u00ebs
  2008-2009 p\u00ebr shk\u00ebmbimin e t\u00eb dh\u00ebnave n\u00eb m\u00ebnyr\u00eb
  elektronike pra para krijimit t\u00eb ARK at\u00ebher\u00eb ka qen\u00eb e pamundur
  n\u00eb at\u00eb koh\u00eb t\u00eb p\u00ebrfshihej ARK, nd\u00ebrkoh\u00eb me ndryshimet
  e fundit ligjore ARK do t\u00eb jet\u00eb p\u00ebrgjegj\u00ebse p\u00ebr administrimin
  e databazave shtet\u00ebrore.\\n\\n3. Lidhur me gjetjen: \u201cQKB dhe DPT ende
  nuk rezulton t\u00eb jet\u00eb zyrtarizuar ndonj\u00eb protokoll komunikimi apo
  nd\u00ebrveprimi t\u00eb dh\u00ebnash p\u00ebr leht\u00ebsimin e procedurave, konsultimin
  si dhe leximin n\u00eb m\u00ebnyr\u00eb t\u00eb nd\u00ebrrell\u00ebt n\u00eb zbatim
  t\u00eb objektit t\u00eb marr\u00ebveshjes nen 3, pika 3.2 n\u00eb t\u00eb cil\u00ebn
  citohet se: \u201c.....n\u00ebp\u00ebrmjet hapave t\u00eb detajuar n\u00eb Protokollin
  e Shk\u00ebmbimit Elektronik i cili \u00ebsht\u00eb pjes\u00eb p\u00ebrb\u00ebr\u00ebse
  e k\u00ebsaj marr\u00ebveshje\u201d.\\n\\nN\u00eb marr\u00ebveshjen e n\u00ebnshkruar
  p\u00ebr komunikim elektronik nd\u00ebrmjet QKB dhe DPT me nr. 12420/1, dat\u00eb
  07.09.2017, si dhe n\u00eb faqen zyrtare Web t\u00eb Tatimeve thuhet se nd\u00ebrmjet
  DPT dhe QKB \u00ebsht\u00eb thjeshtuar ndjesh\u00ebm shk\u00ebmbimi i t\u00eb dh\u00ebnave
  pasi ai \u00ebsht\u00eb b\u00ebr\u00eb kryesisht n\u00eb formatin elektronik. Faqja
  zyrtare e DPT:\\n\\nhttps://www.tatime.gov.al/8/45/45/501/drejtoria-e-pergjithshme-e-tatimeve-shkembim-elektronik-te-dhenash-me-qkb-ne-per-subjektet-tregtare\u201d\\n\\nSqarojm\u00eb
  se: duke q\u00ebn\u00eb se nga e DPT nuk \u00ebsht\u00eb respektuar i\u00e9r\u00ebsisht
  marr\u00ebveshja dhe nuk \u00ebsht\u00eb mund\u00ebsuar sh\u00ebrbimi i t\u00ebrheqjes
  se informacionit t\u00eb dakort\u00ebsuar n\u00eb marr\u00ebveshje protokolli i
  komunikimit nuk \u00ebsht\u00eb arritur t\u00eb finalizohet pavar\u00ebsisht p\u00ebrpjekjeve
  n\u00eb rrug\u00eb zyrtare t\u00eb QKB.\\n\\n4. Lidhur me gjetjen: \u201cQKB \u00ebsht\u00eb
  p\u00ebrgjegj\u00ebse p\u00ebr krijimin, standardizimin, operimin dhe mir\u00ebfunkcionimin
  e t\u00eb gjith\u00eb formular\u00ebve dhe pun\u00ebs operacionale t\u00eb p\u00ebrdoruesve
  me privilegje t\u00eb nivelit t\u00eb ndryshme t\u00eb baz\u00ebs s\u00eb t\u00eb
  dh\u00ebnave elektronike t\u00eb Regjistrit Tregtar.\\n\\nStandardizimi i formular\u00ebve
  t\u00eb aplikimit \u00ebsht\u00eb nj\u00eb proces i cili ka filluar n\u00ebp\u00ebrmjet
  sh\u00ebrbimeve t\u00eb integruara tek ADISA faqja zyrtare e t\u00eb cil\u00ebs
  \u00ebsht\u00eb: http://www.adisa.gov.al/lista-e-sherbimeve-qkb/, ku rezulton se
  ka p\u00ebrfunduar p\u00ebr 169 formular\u00eb t\u00eb regjistrimit t\u00eb biznesit
  dhe licencimit.\\n\\nN\u00eb lidhje me formular\u00ebt e implementuar n\u00eb sistemet
  e QKB gjithsej jan\u00eb standardizuar s\u00eb bashku me Adisa si institucioni p\u00ebrgjegj\u00ebs
  p\u00ebr standardizimin e formular\u00ebve t\u00eb aplikimit dhe vendosjen e kodifikimit
  t\u00eb formular\u00ebve 37 formular\u00eb dhe p\u00ebr 7 formular\u00eb n\u00eb
  p\u00ebrdorim nga registri i licencave dhe lejeve ka p\u00ebrfunduar standardizimi
  dhe jan\u00eb n\u00eb proces implementimi.\\n\\nGjithashtu theksojm\u00eb q\u00eb
  formular\u00eb t\u00eb pa standardizuar jan\u00eb vet\u00ebm 22 t\u00eb till\u00eb
  pasi sh\u00ebrbimi p\u00ebr korrigim ka vet\u00ebm nj\u00eb formular p\u00ebr t\u00eb
  gjitha format e nj\u00ebjt\u00eb gj\u00eb vlen edhe p\u00ebr sh\u00ebrbimin e plot\u00ebsimit
  t\u00eb t\u00eb dh\u00ebnave.\\n\\nQ\u00ebndrimi i Grupit t\u00eb Auditimit:\\n\\n1.
  Munges\u00ebn e formatit n\u00eb rastet kur \u00e7\u00ebshtja hapet nga vet\u00eb
  punonj\u00ebsit n\u00eb zbatim t\u00eb urdh\u00ebrave apo vendimeve t\u00eb ndryshme
  q\u00eb jan\u00eb detyrues p\u00ebr zbatim, sqarojm\u00eb se:\\nN\u00eb sistem v\u00ebrtet
  ka gjurmueshm\u00ebri t\u00eb veprimeve mbi faktin se kush dhe \u00e7far\u00eb veproi,
  por formatet q\u00eb mungojn\u00eb q\u00eb p\u00ebrmenden n\u00eb aktkonstatim lidhen
  me veprime q\u00eb aktualisht kryhen n\u00eb sistem, por plot\u00ebsojn\u00eb gjurm\u00ebn
  e auditimit n\u00eb lidhje me faktin se kush duhet ta kryej\u00eb dhe kush n\u00eb
  t\u00eb v\u00ebrtet\u00eb e kryen veprimin sipas analiz\u00ebs s\u00eb gjurm\u00ebve
  n\u00eb sistem. P\u00ebr k\u00ebt\u00eb arsye observacioni nga ana juaj nuk merret
  n\u00eb konsiderat\u00eb.\\n\\n2. Dakord\u00ebsin\u00eb mes QKB dhe DPT \u00ebsht\u00eb
  b\u00ebr\u00eb gjat\u00eb periudh\u00ebs 2008-2009 p\u00ebr shk\u00ebmbimin e t\u00eb
  dh\u00ebnave n\u00eb m\u00ebnyre elektronike pra para krijimit t\u00eb ARK at\u00ebher\u00eb
  ka gjen\u00eb e pamundur n\u00eb at\u00eb koh\u00eb t\u00eb p\u00ebrfshihej ARK,
  nd\u00ebrkoh\u00eb me ndryshimet e fundit ligjore ARK do t\u00eb jet\u00eb p\u00ebrgjegj\u00ebse
  p\u00ebr administrimin e databazave shtet\u00ebrore, sqarojm\u00eb se:\\nGrupi i
  auditimit i referohet marr\u00ebveshjes s\u00eb n\u00ebnshkruar me nr. 12420/1,
  dat\u00eb 07.09.2017, e cila nuk \u00ebsht\u00eb n\u00ebnshkruar p\u00ebrpara krijimit
  t\u00eb ARK ku sipas ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d, rezulton institucioni p\u00ebrgjegj\u00ebs.
  P\u00ebr k\u00ebt\u00eb arsye observacioni nga ana juaj nuk merret n\u00eb konsiderat\u00eb.\\n\\n3.
  Nga ana e DPT nuk \u00ebsht\u00eb respektuar t\u00ebr\u00ebsisht marr\u00ebveshja
  dhe nuk \u00ebsht\u00eb mund\u00ebsuar sh\u00ebrbimi i t\u00ebrheqjes se informacionit
  t\u00eb dakord\u00ebsuar n\u00eb marr\u00ebveshje protokoll i komunikimit nuk \u00ebsht\u00eb
  arritur t\u00eb finalizohet pavar\u00ebsisht p\u00ebrpjekjeve n\u00eb rrug\u00eb
  zyrtare t\u00eb QKB, sqarojm\u00eb se:\\nNga audituesit \u00ebsht\u00eb m\u00ebs\u00eb
  e qart\u00eb q\u00eb nj\u00eb marr\u00ebveshje t\u00eb funksionoj\u00eb, sidomos
  p\u00ebr shk\u00ebmbimin e t\u00eb dh\u00ebnave, k\u00ebrkon q\u00eb sistemet t\u00eb
  zhvillohen p\u00ebr d\u00ebrgim dhe pritjen e tyre sipas rastit.\\n\\n4. N\u00eb
  lidhje me formular\u00ebt e implementuar n\u00eb sistemet e QKB gjithsej jan\u00eb
  standardizuar s\u00eb bashku me Adisa si institucioni p\u00ebrgjegj\u00ebs p\u00ebr
  standardizimin e formular\u00ebve t\u00eb aplikimit dhe vendosjen e kodifikimit
  t\u00eb formular\u00ebve 37 formular\u00eb dhe p\u00ebr 7 formular\u00eb n\u00eb
  p\u00ebrdorim nga regjistri i licencave dhe lejeve ka p\u00ebrfunduar standardizimi
  dhe jan\u00eb n\u00eb proces implementimi. Gjithashtu, theksojm\u00eb q\u00eb formular\u00eb
  t\u00eb pa standardizuar jan\u00eb vet\u00ebm 22 t\u00eb tilla pasi sh\u00ebrbimi
  p\u00ebr korrigim ka vet\u00ebm nj\u00eb formular p\u00ebr t\u00eb gjitha format
  e nj\u00ebjt\u00eb gj\u00eb vlen edhe p\u00ebr sh\u00ebrbimin e plot\u00ebsimit
  t\u00eb t\u00eb dh\u00ebnave, sqarojm\u00eb se:\\nObservacioni juaj n\u00eb lidhje
  me numrin e formular\u00ebve t\u00eb standardizuar dhe t\u00eb pa standardizuar
  si dhe grupimi i k\u00ebtyre t\u00eb fundit n\u00eb 22 formular\u00eb, merret n\u00eb
  konsiderat\u00eb t\u00eb cilat jan\u00eb pasqyruar n\u00eb k\u00ebt\u00eb raport,
  por q\u00ebndron fakti q\u00eb numri i sh\u00ebrbimeve \u00ebsht\u00eb aq sa rezulton
  nga auditimi.\\n\\n**Pika 3. Auditimi i siguris\u00eb s\u00eb informacionit**\\n\\nSiguria
  e Informacionit \u00ebsht\u00eb b\u00ebr\u00eb gjithnj\u00eb e m\u00eb shum\u00eb
  e r\u00ebnd\u00ebsishme p\u00ebr institucionet qeveritare, kjo si pasoj\u00eb ritjes
  s\u00eb kompleksitetit t\u00eb kontrollit t\u00eb aksesit dhe ruajtjes s\u00eb konfidencialitetit,
  integritetit dhe gatishm\u00ebris\u00eb s\u00eb t\u00eb dh\u00ebnave nga marr\u00ebdh\u00ebniet
  e rrjeteve publike me ato private dhe nga bashk\u00eb p\u00ebrdorimi i burimeve
  t\u00eb informacionit. Siguria e Informacionit mund t\u00eb p\u00ebrcaktohet si
  mund\u00ebsia e nj\u00eb sistemi p\u00ebr t\u00eb mbrojtur informacionin dhe burimet
  e sistemeve n\u00eb p\u00ebrpunje me termat e konfidencialitetit, integritetit dhe
  gatishm\u00ebria. Sistemet e informacionit jan\u00eb bashkime komplekse t\u00eb
  teknologjis\u00eb, proceseve dhe njer\u00ebzve q\u00eb funksionojn\u00eb s\u00eb
  bashku p\u00ebr t\u00eb rregulluar p\u00ebrpunimin, ruajtjen, dhe transferimin e
  informacionit p\u00ebr t\u00eb mb\u00ebshtetur misionin e institucionit dhe funksionet
  e tij. Lidhur nga sa m\u00eb sip\u00ebr, \u00e7do institucion shtet\u00ebror q\u00eb
  ofron sh\u00ebrbime ndaj qytetar\u00ebve e ka si detyrim nd\u00ebrtimin e programit
  t\u00eb siguris\u00eb s\u00eb informacionit me element\u00ebt ky\u00e7 t\u00eb cil\u00ebt
  jan\u00eb: \u201cMjedisi i siguris\u00eb s\u00eb informacionit, Vler\u00ebsimi i
  riskut, Politikat e siguris\u00eb, Organizimi i siguris\u00eb s\u00eb TI, Menaxhimi
  i komunikimeve dhe operacioneve, Menaxhimi i aseteve, Siguria e burimeve njer\u00ebzore,
  Siguria fizike dhe mjedisore,\\n\\nKontrolli i aksesit, Menaxhimi i incidenteve
  t\u00eb siguris\u00eb s\u00eb TI, Menaxhimi i vazhdueshm\u00ebrises s\u00eb biznesit,
  P\u00ebrputhshm\u00ebria\u201d.\\n\\n**Verifikim i strategjis\u00eb s\u00eb TI dhe
  lidhja me objektivat e veprimtaris\u00eb s\u00eb institucionit**\\n\\nQendra Komb\u00ebtare
  e Biznesit n\u00eb vijim (QKB) \u00ebsht\u00eb institucion n\u00eb var\u00ebsi t\u00eb
  Ministrit t\u00eb Financave dhe Ekonomis\u00eb, i krijuar n\u00eb baz\u00eb t\u00eb
  ligjit nr. 131/2015 \u201cP\u00ebr Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit\u201d,
  si rezultat i bashkimit t\u00eb dy institucioneve, Qendr\u00ebs Komb\u00ebtare t\u00eb
  Licencimit dhe Qendr\u00ebs Komb\u00ebtare t\u00eb Regjistrimit.\\n\\nQKB \u00ebsht\u00eb
  institucioni i vet\u00ebm p\u00ebrgjegj\u00ebs p\u00ebr regjistrimin e biznesit
  dhe t\u00eb lejeve, licencimit dhe autorizimeve n\u00eb Shqip\u00ebri dhe sh\u00ebrben
  si sportel me nj\u00eb ndales\u00eb ku kryhen t\u00eb gjitha proceset e regjistrimit/lejeve/licencimit
  dhe autorizimeve t\u00eb biznesit, duke p\u00ebrfshir\u00eb dhe regjistrimin p\u00ebr
  efekt t\u00eb taksave n\u00eb nivel komb\u00ebtar dhe vendor, sigurimin sh\u00ebndet\u00ebsor
  e shoq\u00ebr\u00f3r\u00eb dhe inspektoratin e pun\u00ebs, leje/licencave dhe autorizimeve
  p\u00ebr kategori t\u00eb ndryshme.\\n\\nAktualisht, QKB-ja e zhvillon aktivitetin
  e saj n\u00eb 34 sportele n\u00eb t\u00eb gjith\u00eb territorin e Republik\u00ebs
  s\u00eb Shqip\u00ebris\u00eb, n\u00eb t\u00eb cilat sh\u00ebrbejn\u00eb 75 punonj\u00ebs
  me detyra dhe p\u00ebrshtakime pune t\u00eb nj\u00ebjt\u00eb me ato t\u00eb zyr\u00ebs
  qendrore. Sportelet prit\u00ebse t\u00eb biznesit n\u00eb rrethe jan\u00eb t\u00eb
  vendosura pran\u00eb Bashkive dhe Komunave si dhe n\u00eb Dhomat e Tregtis\u00eb.
  T\u00eb gjitha aplikimet e kryera nga biznesi procesohen nga struktura e regjistrimit
  e vendosur n\u00eb zyr\u00ebn qendrore n\u00eb Tiran\u00eb.\\n\\nQKB-ja, funksionon
  n\u00eb baz\u00eb t\u00eb nj\u00eb sistemi elektronik t\u00eb integruar t\u00eb
  dh\u00ebnash q\u00eb realizon lidhjen nd\u00ebrmjet sporteleve t\u00eb sh\u00ebrbimit
  n\u00eb rrethe me zyr\u00ebn qendrore t\u00eb QKB-s\u00eb n\u00eb Tiran\u00eb. Sistemi
  i regjistrimit u krijon mund\u00ebsin\u00eb bizneseve t\u00eb regjistrohen brenda
  24 or\u00ebve dhe koordinon t\u00eb dh\u00ebnat duke ju dh\u00ebn\u00eb mund\u00ebsin\u00eb
  subjekteve t\u00eb interesuara t\u00eb informohen n\u00eb koh\u00eb reale p\u00ebr
  sa i p\u00ebrket statusit t\u00eb aplikimit t\u00eb tyre. Sistemi n\u00eb fjal\u00eb
  \u00ebsht\u00eb baz\u00eb t\u00eb dh\u00ebnash shtet\u00ebrore dhe \u00ebsht\u00eb
  i regjistruar pran\u00eb ARK me nivel sigurie L-D3I1K0.\\n\\n*Nga auditimi u konstatua
  se:*\\n\\n1. **Titulli i gjetjes:** Verifikim i strategjis\u00eb s\u00eb TI dhe
  lidhja me objektivat e veprimtaris\u00eb s\u00eb institucionit\\n\\n   **Situata
  1:** Nga auditimi lidhur me Planin Strategjik t\u00eb Teknologjis\u00eb s\u00eb
  Informacionit rezulton se Qendra Komb\u00ebtare e Biznesit nuk ka t\u00eb nd\u00ebrtuar
  nj\u00eb Plan Strategjik t\u00eb Teknologjis\u00eb s\u00eb Informacionit \u00e7far\u00eb
  sjell\u00eb mos pasqyrimin t\u00eb qart\u00eb t\u00eb objektivave t\u00eb QKB lidhur
  me sigurin\u00eb institucionale dhe infrastruktur\u00ebn TI, objektivat strategjik\u00eb
  p\u00ebr burimet njer\u00ebzore t\u00eb struktur\u00ebs s\u00eb TIK n\u00eb QKB
  dhe p\u00ebr deg\u00ebt rajonale dhe burimet e nevojshme p\u00ebr ngritjen, zhvillimin
  dhe mir\u00ebmbajtjen e saj.\\n\\n   **Kriteri:** Standardet e Nd\u00ebrkomb\u00ebtare
  t\u00eb TI dhe praktikat m\u00eb t\u00eb mira.\\n\\n   **Ndikimi/efekti:** Mos pasqyrimin
  e qart\u00eb t\u00eb objektivave t\u00eb QKB lidhur me sigurin\u00eb institucionale
  dhe infrastruktur\u00ebn TI.\\n\\n   **Shkaku:** -\\n\\n   **R\u00ebnd\u00ebsia:**
  E lart\u00eb\\n\\n   **Rekomandimi:** QKB n\u00eb bashk\u00ebpunim me Drejtorin\u00eb
  e Inovacionit dhe Regjistrave si dhe me strukturat k\u00ebshilluese mbi TIK, t\u00eb
  marr\u00eb masa q\u00eb Strategjia Institucionale t\u00eb ket\u00eb kapitull t\u00eb
  v\u00eb\u00e7ant\u00eb, ku t\u00eb trajtohen objektivat strategjik\u00eb t\u00eb
  Teknologjis\u00eb s\u00eb Informacionit, me q\u00ebllim adresimin e qart\u00eb t\u00eb
  tyre, duke marr\u00eb n\u00eb konsiderat\u00eb koh\u00ebn, burimet e nevojshme,
  strukturat zbatuese, si dhe rishikimin vjetor t\u00eb indikatoreve t\u00eb performanc\u00ebs
  s\u00eb ecuris\u00eb s\u00eb objektivave.\\n\\n**Verifikim i regulloreve, politikave
  dhe procedurave TI**\\n\\nMe q\u00ebllim auditimin e nivelit t\u00eb adminstrimit
  t\u00eb dokumentimit, t\u00eb politikave dhe procedurave n\u00eb lidhje me teknologjin\u00eb
  e informacionit n\u00eb QKB, grupi i auditimit verifikoi Rregulloren \u201cMbi organizimin,
  funksionimin, detyrat dhe kompetencat e administrat\u00ebs s\u00eb Qendr\u00ebs
  Komb\u00ebtare t\u00eb Biznesit\u201d, Rregullorja \u201cP\u00ebr sigurin\u00eb
  e regjistrave elektronik t\u00eb Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit\u201d,
  Rregullorja e Teknologjis\u00eb s\u00eb Informacionit si dhe udh\u00ebzime t\u00eb
  tjera t\u00eb brendshme. Auditimi p\u00ebr k\u00ebt\u00eb \u00e7\u00ebshtje, pati
  n\u00eb konsiderat\u00eb risqet q\u00eb vijn\u00eb nga mungesa e politikave dhe
  procedurave t\u00eb shkruara si dhe nga praktikat me t\u00eb cilat institucioni
  punon.\\n\\nNisur nga r\u00ebnd\u00ebsia q\u00eb sistemet e informacionit kan\u00eb
  p\u00ebr realizimin e procedurave dhe regjistrimin e subjekteve t\u00eb p\u00ebrcaktuara
  n\u00eb ligjin organik q\u00eb rregullon regjistrimin e biznesit, p\u00ebr q\u00ebllim
  t\u00eb regjistrimit fiskal, t\u00eb sigurimeve shoq\u00ebrore e sh\u00ebndet\u00ebsore,
  si dhe t\u00eb inspektimit t\u00eb marr\u00ebdh\u00ebnieve t\u00eb pun\u00ebs, QKB
  ka hartuar dhe miratuar:\\n\\n- Rregulloren \u201cMbi organizimin, funksionimin,
  detyrat dhe kompetencat e administrat\u00ebs s\u00eb Qendr\u00ebs Komb\u00ebtare
  t\u00eb Biznesit\u201d, miratuar me an\u00eb t\u00eb shkres\u00ebs nr. 4568/1 dat\u00eb
  14.06.2016 t\u00eb Ministrit t\u00eb Zhvillimit Ekonomik, Turizmit, Tregtis\u00eb
  dhe Sip\u00ebrmarrjes. Objekti i k\u00ebsaj rregulloreje \u00ebsht\u00eb p\u00ebrcaktimi
  i rregullave dhe detyrave t\u00eb organizimit, funksionimit dhe marr\u00ebdh\u00ebnieve,
  nd\u00ebrmjet nj\u00ebsive t\u00eb brendshme administrative dhe n\u00ebpun\u00ebsve
  q\u00eb ushtron\u00eb aktivitetin n\u00eb Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit.
  Kjo rregullore gjithashtu vendos rregulla mbi adminstrimin e dokumentacionit, rregullat
  e etik\u00ebs dhe procedura t\u00eb tjera t\u00eb adminstrimit t\u00eb brendsh\u00ebm.\\n\\n-
  Rregullorja e Teknologjis\u00eb s\u00eb Informacionit \u00ebsht\u00eb e pa miratuar.
  Objekti i k\u00ebsaj rregulloreje \u00ebsht\u00eb p\u00ebrcaktimi i parimeve dhe
  rregullave t\u00eb Siguris\u00eb s\u00eb Informacionit n\u00eb Qendr\u00ebn Komb\u00ebtare
  t\u00eb Biznesit dhe p\u00ebrcaktimi i p\u00ebrgjegj\u00ebsive p\u00ebr veprimet
  q\u00eb lidhen me sigurin\u00eb me q\u00ebllim ruajtjen, integritetin, disponueshm\u00ebris\u00eb
  dhe konfidencialitetit t\u00eb aseteve t\u00eb informacionit t\u00eb Qendr\u00ebs
  Komb\u00ebtare t\u00eb Biznesit.\\n\\n- Rregullorja \u201cP\u00ebr sigurin\u00eb
  e regjistrave elektronik t\u00eb Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit\u201d
  miratuar me shkres\u00ebn nr. 147, dat\u00eb 04.12.2015 t\u00eb Drejtoris\u00eb
  t\u00eb P\u00ebrgjithsh\u00ebm t\u00eb QKB. Objekti i k\u00ebsaj rregulloreje \u00ebsht\u00eb
  garantiimi i siguris\u00eb s\u00eb regjistrave elektronik t\u00eb Qendr\u00ebs Komb\u00ebtare
  t\u00eb Biznesit, konkretisht Regjistri Tregtar dhe Regjistri i lejeve, licencave
  dhe autorizimeve.\\n\\nQ\u00ebllimi i k\u00ebsaj rregulloreje \u00ebsht\u00eb t\u00eb
  p\u00ebrcaktoj\u00eb rregulla t\u00eb p\u00ebrgjithshme dhe procedura transparente,
  p\u00ebr t\u00eb siguruar mbrojtjen e funksionalitetit, integritetit dhe disponueshm\u00ebris\u00eb
  s\u00eb informacionit n\u00eb Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit.\\n\\nNga
  auditimi u konstatua se:\\n\\n2. Titulli i gjetjes: Verifikim i rregulloreve, politikave
  dhe procedurave TIK\\n\\nSituata: Rregullorja e Teknologjis\u00eb s\u00eb Informacionit
  \u00ebsht\u00eb e pa miratuar dhe Drejtoria e Inovacionit dhe Regjistrave e ka mb\u00ebshtetur
  aktivitetin e saj n\u00eb k\u00ebt\u00eb rregullor\u00eb. Me miratimin dhe futjen
  n\u00eb fuqi t\u00eb VKM nr. 673, dat\u00eb 22.11.2017 \u201cP\u00ebr riorganizimin
  e Agjencis\u00eb Komb\u00ebtare t\u00eb Shoq\u00ebris\u00eb s\u00eb Informacionit\u201d,
  rregulloret e miratuara nga QKB nuk jan\u00eb eficente dhe efektive p\u00ebr tu
  p\u00ebrdorur dhe do t\u00eb duhet tu n\u00ebnshtrohen nj\u00eb rishikimi t\u00eb
  holl\u00ebsisht\u00eb duke reflektuar ndryshimet q\u00eb do t\u00eb ndodhin n\u00eb
  struktur\u00eb, n\u00eb p\u00ebrshtatjet e pun\u00ebs dhe n\u00eb ndarjen e p\u00ebrgjegj\u00ebsive
  t\u00eb gjithsecilit p\u00ebr tu p\u00ebrshtatur me k\u00ebrkesat e k\u00ebsaj VKM-je.
  Drejtoria e Inovacionit dhe Regjistrave n\u00eb QKB \u00ebsht\u00eb nj\u00eb nga
  strukturat q\u00eb preket nga miratimi dhe futja n\u00eb fuqi e VKM-s nr. 673 ku
  sipas s\u00eb cil\u00ebs, stafi TI dhe pajisjet kalojn\u00eb n\u00eb var\u00ebsi
  t\u00eb ASKHI-it. Kriteri: Standardet Nd\u00ebrkomb\u00ebtare t\u00eb TIK.\\n\\nNdikimi/efekti:
  Efektiviteti dhe eficencia n\u00eb p\u00ebrdorim.\\n\\nShkaku: Ndryshime n\u00eb
  baz\u00ebn ligjore, n\u00ebnligjore dhe aktet rregulative.\\n\\nR\u00ebnd\u00ebsia:
  E lart\u00eb.\\n\\nRekomandimi: QKB t\u00eb marr\u00eb masa p\u00ebr hartimin e
  nj\u00eb Rregulloreje t\u00eb P\u00ebrgjithshme mbi Teknologjin\u00eb e Informacionit
  n\u00eb QKB, n\u00eb t\u00eb cil\u00ebn t\u00eb identifikikohen t\u00eb gjitha operacionet
  TI n\u00eb institucion, afatet dhe burimet e nevojshme p\u00ebr \u00e7do veprimtar.
  Hartimi i k\u00ebsaj Rregulloreje t\u00eb marr\u00eb n\u00eb konsiderat\u00eb t\u00eb
  gjitha rregulloret e miratuara dhe k\u00ebrkesat q\u00eb vijn\u00eb si rezultat
  i futjes n\u00eb fuqi t\u00eb VKM-s 673, dat\u00eb 22.11.2018 si dhe legjislacionin
  e Teknologjis\u00eb, Informacionit dhe Komunikimit n\u00eb Shqip\u00ebri.\\n\\nIdentifikimi
  dhe menaxhimi i risqeve n\u00eb TIK\\n\\nBazuar n\u00eb VKM nr. 710, dat\u00eb 21.08.2013
  \u201cP\u00ebr krijimin dhe funksionimin e sistemeve t\u00eb ruajtjes s\u00eb informacionit,
  vazhdueshm\u00ebris\u00eb s\u00eb pun\u00ebs dhe marr\u00ebveshjeve t\u00eb nivelit
  t\u00eb sh\u00ebrbimit\u201d i ndryshuar, pika 1.a \u201cInstitucioni duhet t\u00eb
  siguroj\u00eb q\u00eb sistemet e teknologjis\u00eb s\u00eb informacionit t\u00eb
  p\u00ebrpunojn\u00eb informacionin n\u00eb m\u00ebnyr\u00eb q\u00eb t\u00eb garantohej
  efikasiteti i ofrimit t\u00eb sh\u00ebrbimeve\u201d, dhe pika 1.b \u201cInstitucioni
  duhet t\u00eb evidentoj\u00eb sistemet ose pjes\u00eb t\u00eb sistemeve t\u00eb
  cilat jan\u00eb kritike p\u00ebr ofrimin e sh\u00ebrbimit 24 or\u00eb n\u00eb 7
  dit\u00eb t\u00eb jav\u00ebs dhe t\u00eb ket\u00eb plane t\u00eb dokumentuara p\u00ebr
  menaxhimin e riskut, teknikat e menaxhimit dhe t\u00eb vler\u00ebsimit t\u00eb performanc\u00ebs
  s\u00eb tij. Me q\u00ebllim garantimin e mir\u00ebfunkcionimit t\u00eb k\u00ebtyre
  teknikave t\u00eb menaxhimit t\u00eb riskut, institucioni kryen auditime t\u00eb
  brendshme\u201d.\\n\\nP\u00ebr periudh\u00ebn e audituar, QKB disponon regjist\u00ebr
  risqesh institucional ku ka t\u00eb p\u00ebrfshir\u00eb edhe risqet p\u00ebr teknologjin\u00eb
  e informacionit. \u00c7do fillim viti hartohet regjistri i riskut i institucionit
  ku p\u00ebrfshihen edhe risqet p\u00ebr teknologjin\u00eb e informacionit dhe d\u00ebrgohet
  n\u00eb fund t\u00eb muajit t\u00eb par\u00eb t\u00eb vjetit koren\u00eb n\u00eb
  Ministrin\u00eb e Financave dhe Ekonomis\u00eb.\\n\\nNga auditimi u konstatua se:\\n\\n3.
  Titulli i gjetjes: Identifikimi dhe menaxhimi i risqeve n\u00eb TIK\\n\\nSituata:
  Nga auditimi lidhur me identifikimin dhe menaxhimin e risqeve n\u00eb teknologjin\u00eb
  e informacionit rezulton se regjistri i riskut n\u00eb QKB nuk \u00ebsht\u00eb i
  p\u00ebrdit\u00ebsuar (update) me risqet e reja t\u00eb brendshme dhe t\u00eb jashtme
  q\u00eb mund t\u00eb jen\u00eb shfaqur si dhe nuk ka identifikuar ndikimin e k\u00ebtyre
  risqeve n\u00eb institucion. Regjistri i riskut ka t\u00eb pasqyruarra t\u00eb nj\u00ebjtat
  fusha t\u00eb p\u00ebrs\u00ebritura p\u00ebr tre vitet e fundit duke e b\u00ebr\u00eb
  jo efektiv dhe jo eficent reduktimin e risqeve, n\u00eb mosp\u00ebrputhje me nenet
  19-21 t\u00eb ligjit nr. 10296, dat\u00eb 08.07.2010, \u201cP\u00ebr menaxhimin
  financiar dhe kontrollin\u201d, i ndryshuar, udh\u00ebzimi nr. 30, dat\u00eb 27.12.2011
  \u201cP\u00ebr menaxhimin e aktiveve n\u00eb nj\u00ebsit\u00eb e sektorit publik\u201d,
  i ndryshuar, udh\u00ebzimi nr. 21, dat\u00eb 25.10.2016 \u201cP\u00ebr n\u00ebpun\u00ebsit
  zbatues t\u00eb t\u00eb gjitha niveleve\u201d, Udh\u00ebzimi i Ministrit t\u00eb
  Financave nr. 16, dat\u00eb 20.07.2016 \u201cP\u00ebr p\u00ebrgjegj\u00ebsit\u00eb
  dhe detyrat e koordinatorit t\u00eb menaxhimit financiar dhe kontrollit dhe koordinatorit
  t\u00eb riskut n\u00eb nj\u00ebsit\u00eb publike\u201d.\\n\\nKriteri: Ky veprim
  \u00ebsht\u00eb n\u00eb mosp\u00ebrputhje me nenet 19-21 t\u00eb ligjit nr. 10296,
  dat\u00eb 08.07.2010, \u201cP\u00ebr menaxhimin financiar dhe kontrollin\u201d,
  i ndryshuar, Udh\u00ebzimi nr. 30, dat\u00eb 27.12.2011 \u201cP\u00ebr Menaxhimin
  e Aktiveve n\u00eb Nj\u00ebsit\u00eb e Sektorit Publik\u201d, i ndryshuar, Udh\u00ebzimi
  nr. 21, dat\u00eb 25.10.2016 \u201cP\u00ebr n\u00ebpun\u00ebsit zbatues t\u00eb
  t\u00eb gjitha niveleve\u201d, Udh\u00ebzimi i Ministrit t\u00eb Financave nr. 16,
  dat\u00eb 20.07.2016 \u201cP\u00ebr p\u00ebrgjegj\u00ebsit\u00eb dhe detyrat e koordinatorit
  t\u00eb menaxhimit financiar dhe kontrollit dhe koordinatorit t\u00eb riskut n\u00eb
  nj\u00ebsit\u00eb publike\u201d.\\n\\nNdikimi/efekti: QKB rezikon q\u00eb m\u00ebnyra
  dhe koha e zgjidhjes s\u00eb problemeve t\u00eb jet\u00eb e pap\u00ebr\u00e7aktuar,
  e p\u00ebr pasoj\u00eb cenon ecurin\u00eb normale t\u00eb pun\u00ebs s\u00eb sistemeve,
  nd\u00ebrprerjen e sh\u00ebrbimeve etj.\\n\\nShkaku: Mosnjohja e mosreagim ndaj
  risqeve t\u00eb njohura, por t\u00eb pa dokumentuara.\\n\\nR\u00ebnd\u00ebsia: E
  lart\u00eb.\\n\\nRekomandimi: QKB n\u00eb bashk\u00ebpunim me Drejtoren\u00eb e
  Inovacionit dhe Regjistrave si dhe me strukturat k\u00ebshilluese mbi TIK, t\u00eb
  marrin masat e nevojshme p\u00ebr p\u00ebrdit\u00ebsimin dhe dokumentimin e regjistrit
  t\u00eb risqeve dhe t\u00eb marrin masa p\u00ebr hartimin dhe dokumentimin e nj\u00eb
  plani veprimi p\u00ebr minimizimin/ parandalimin e risqeve t\u00eb identifikuara,
  si dhe t\u00eb b\u00ebhet monitorimi periodik i zbatimit t\u00eb k\u00ebtyre masave.\\n\\nVerifikimi
  i dokumentimit t\u00eb planeve t\u00eb vazhdueshm\u00ebr\u00ebs s\u00eb institucionit
  dhe rim\u00ebk\u00ebmbjes nga katastrofat.\\n\\nAuditimi mbi Planin e Vazhdueshm\u00ebr\u00ebs
  s\u00eb Biznesit u bazua mbi VKM nr. 710, dat\u00eb 21.08.2013 \u201cP\u00ebr krijuimin
  dhe funksionimin e sistemeve t\u00eb ruajtjes s\u00eb informacionit, vazhdueshm\u00ebr\u00ebs
  s\u00eb pun\u00ebs dhe marr\u00ebveshjeve t\u00eb nivelit t\u00eb sh\u00ebrbimit\u201d,
  i ndryshuar, risqeve t\u00eb identifikuara dhe praktikave m\u00eb t\u00eb mira.
  Referuar sa m\u00eb sip\u00ebr, \u00e7do institucion q\u00eb ka ose do t\u00eb zhvilloj\u00eb
  sisteme n\u00eb fush\u00ebn e teknologjis\u00eb s\u00eb informacionit, me q\u00ebllim
  ofrimin e sh\u00ebrbimeve tek qytetar\u00ebt, p\u00ebr biznesin dhe p\u00ebr nd\u00ebrveprim
  e shk\u00ebmbim informacioni p\u00ebr administrat\u00ebn publike n\u00ebp\u00ebrmjet
  k\u00ebtyre sistemeve, duhet t\u00eb parashikoj\u00eb dhe t\u00eb realizoj\u00eb
  investime p\u00ebr krijuimin e sistemit t\u00eb vazhdueshm\u00ebr\u00ebs s\u00eb
  pun\u00ebs dhe sistemit t\u00eb ruajtjes s\u00eb informacionit, me q\u00ebllim mund\u00ebsimin
  e ofrimit t\u00eb sh\u00ebrbimit pa nd\u00ebrprerje dhe parandalimin e humbjes ose
  shkat\u00ebrrimit t\u00eb t\u00eb dh\u00ebnave.\\n\\nNga auditimi u konstatua se:\\n\\n4.
  Titulli i gjetjes: Mungesa e Planit t\u00eb Rim\u00ebk\u00ebmbjes nga Katastrofat.\\n\\nSituada:
  Nga auditimi lidhur me Planin e Rim\u00ebk\u00ebmbjes nga Katastrofat, QKB si institucion
  q\u00eb administrojn\u00eb t\u00eb dh\u00ebna me r\u00ebnd\u00ebsi p\u00ebr regjistrimin
  dhe licencimin n\u00eb dy sisteme informacioni (QKR dhe QKL), p\u00ebr\u00e7aktuar
  n\u00eb ligjin organik q\u00eb regjullojn\u00eb regjistrimin dhe licencimin e biznesit,
  rezulton se nuk ka qend\u00ebr t\u00eb rim\u00ebk\u00ebmbjes nga katastrofat (DRC)
  p\u00ebr serverat e sistemeve QKR dhe QKL t\u00eb cil\u00ebt hostohen tek data centeri
  i AKSHI-t si dhe nuk ka t\u00eb hartuar nj\u00eb plan t\u00eb politikave t\u00eb
  vazhdueshm\u00ebr\u00ebs s\u00eb biznesit (BCP) dhe dokumentim mbi planin e rim\u00ebk\u00ebmbjes
  nga katastrofa (DRC).\\n\\nNdikimi/efekti: Rreziku i humbjes s\u00eb t\u00eb dh\u00ebnave,
  nd\u00ebrprerja e vazhdim\u00ebsis\u00eb s\u00eb pun\u00ebs, nd\u00ebrprerja e sh\u00ebrbimeve.\\n\\nShkaku:
  -\\n\\nR\u00ebnd\u00ebsia: E lart\u00eb.\\n\\nRekomandimi: QKB, duke marr\u00eb
  n\u00eb konsiderat\u00eb koh\u00ebn dhe burimet e nevojshme t\u00eb marr\u00eb masa
  p\u00ebr nd\u00ebrtimin dhe hartimin e Planeve t\u00eb Vazhdim\u00ebsis\u00eb s\u00eb
  Biznesit duke p\u00ebrfshir\u00eb planet p\u00ebr backup dhe rim\u00ebk\u00ebmbjen
  nga katastrofat p\u00ebr sistemet, pajisjet kompjuterike dhe t\u00eb dh\u00ebnat,
  hartimin e planit t\u00eb siguris\u00eb s\u00eb informacionit dhe implementimin
  e tij duke p\u00ebrfshir\u00eb ndarjen e detyrave/p\u00ebrgjegj\u00ebsive t\u00eb
  siguris\u00eb n\u00eb TI. Planifikimi dhe testimi i sistemeve TIK t\u00eb kryhet
  n\u00eb p\u00ebrputhje me k\u00ebrkesat p\u00ebr t\u00eb cilat k\u00ebto sisteme
  nd\u00ebrtohen.\\n\\nHelp Desk:\\n\\nNj\u00eb nga problematikat e shpeshta t\u00eb
  hasura n\u00eb sportelet e QKB \u00ebsht\u00eb amortizimi i pajisjeve PC, printer/skaner
  etj. Nga verifikimi n\u00eb terren n\u00eb 4 deg\u00eb rajonale (Shkod\u00ebr, Lezh\u00eb,
  Lushnje, Fier) n\u00eb t\u00eb cilat QKB jep sh\u00ebrbim bazuar n\u00eb marr\u00ebveshjen
  me Bashkin\u00eb p\u00ebrkat\u00ebse, rezulton se kushtet e ofruara p\u00ebr ti
  sh\u00ebrbyer biznesit kan\u00eb probleme dhe k\u00ebrkohen pajisje pc, printer\u00eb
  dhe skanera t\u00eb rinj, etj. N\u00eb deg\u00ebn rajonale Lushnje ambienti dhe
  pajisjet ishin jasht\u00eb kushteve teknike p\u00ebr t\u00eb ofruar sh\u00ebrbim.\\n\\nNj\u00eb
  problematik\u00eb tjet\u00ebr \u00ebsht\u00eb l\u00ebvizja apo transferimi i pajisjeve
  nga sportelet e rr\u00ebtheve q\u00eb kan\u00eb probleme t\u00eb ndryshme dhe kan\u00eb
  nevoj\u00eb p\u00ebr suport. P\u00ebr zgjidhjen e k\u00ebtyre problemeve me an\u00eb
  t\u00eb e-mailit zyrtar ose telefonis\u00eb njoftohejn zyrat qendrore p\u00ebr problematik\u00ebn
  dhe n\u00eb rastet kur nuk\\n\\narrihet rregullimi i tyre me remote, sportelisti
  p\u00ebrkat\u00ebs depoziton pajisjen pran\u00eb QKB p\u00ebr evidentimin dhe zgjidhjen
  e problematik\u00ebs dhe pas rregullimit t\u00eb tyre njoftohen sportelist\u00ebt
  s\u00ebrish me an\u00eb t\u00eb e-mail apo telefonit p\u00ebr t\u00ebrheqjen e pajisjes
  nga zyrat e QKB-s.\\n\\n*Burimi: Grupi i Auditimit\\n*QKB (dega rajonale Fier)\\n\\n*Burimi:
  Grupi i Auditimit\\n*QKB (dega rajonale Lushnje)\\n\\n*Burimi: Grupi i Auditimit\\n*QKB
  (dega rajonale Lezh\u00eb)\\n\\n*Burimi: Grupi i Auditimit\\n*QKB (dega rajonale
  Shkod\u00ebr)\\n\\nNga auditimi u konstatua se:\\n\\n5. Titulli i gjetjes: Menaxhimi
  i sh\u00ebrbimeve TI dhe dh\u00ebnia e suportit.\\n\\nSituata: N\u00eb munges\u00eb
  t\u00eb struktur\u00ebs/sektorit Help Desk n\u00eb QKB nuk sigurohet menaxhimi i
  sh\u00ebrbimeve TI dhe plot\u00ebsimi i k\u00ebrkesave t\u00eb p\u00ebrdoruesve
  t\u00eb institucionit si dhe deg\u00ebve rajonale. Duke par\u00eb r\u00ebnd\u00ebsin\u00eb
  e QKB-s\u00eb n\u00eb dh\u00ebnien e sh\u00ebrbimeve p\u00ebr biznesin, duhej t\u00eb
  kishte nj\u00eb struktur\u00eb suporti t\u00eb ndar\u00eb me detyra dhe p\u00ebrgjegj\u00ebsit\u00eb
  p\u00ebrkat\u00ebse t\u00eb gjithsecilit p\u00ebr t\u00eb garantuar dhe siguruar
  cil\u00ebsin\u00eb e sh\u00ebrbimeve ndaj biznesit dhe qytetar\u00ebve.\\n\\nNdikimi/efekti:
  Sh\u00ebrbime jo cil\u00ebsore ndaj biznesit dhe qytetar\u00ebve.\\n\\nShkaku: -\\n\\nR\u00ebnd\u00ebsia:
  E mesme.\\n\\nRekomandimi: QKB, duke marr\u00eb n\u00eb konsiderat\u00eb koh\u00ebn
  dhe burimet e nevojshme, t\u00eb marrin masa p\u00ebr krijimin e nj\u00eb strukture
  suporti p\u00ebr plot\u00ebsimin e k\u00ebrkesave t\u00eb p\u00ebrdoruesve t\u00eb
  institucionit dhe deg\u00ebve rajonale p\u00ebr t\u00eb siguruar cil\u00ebsin\u00eb
  e sh\u00ebrbimeve ndaj biznesit dhe qytetar\u00ebve.\\n\\nTrajnim:\\n\\nTrajnim
  \u00ebsht\u00eb nj\u00eb nga shtyllat e r\u00ebnd\u00ebsishme p\u00ebr menaxhimin
  e kapaciteteve. E r\u00ebnd\u00ebsishme \u00ebsht\u00eb q\u00eb i gjith\u00eb personeli
  q\u00eb ka akses n\u00eb asetet e informacionit t\u00eb QKB t\u00eb jet\u00eb i
  vet\u00ebdijsh\u00ebm p\u00ebr rregullat dhe standardet e siguris\u00eb dhe t\u00eb
  jen\u00eb t\u00eb aft\u00eb t\u2019i zbatojn\u00eb dhe ndjekin ato gjat\u00eb pun\u00ebs
  s\u00eb tyre.\\n\\nNga auditimi u konstatua se:\\n\\n6. Situata: Nga auditimi i
  burimeve njer\u00ebzore n\u00eb struktur\u00ebn e TIK dhe menaxhimi i kapaciteteve
  t\u00eb personelit q\u00eb ka akses n\u00eb asetet e informacionit t\u00eb QKB n\u00eb
  m\u00ebnyr\u00eb q\u00eb t\u00eb jet\u00eb i vet\u00ebdijsh\u00ebm p\u00ebr rregullat
  dhe standardet e siguris\u00eb dhe t\u00eb jen\u00eb t\u00eb aft\u00eb t\u2019i
  zbatojn\u00eb dhe ndjekin ato gjat\u00eb pun\u00ebs s\u00eb tyre u konstatua se:\\n\\n-
  Drejtoria e Inovacionit dhe Regjistrave ka mungesa n\u00eb personel;\\n- QKB dhe
  Drejtoria e Inovacionit dhe Regjistrave nuk ka nj\u00eb analiz\u00eb t\u00eb nevojave
  p\u00ebr trajnim t\u00eb stafit t\u00eb drejtoris\u00eb dhe nuk ka plan p\u00ebr
  trajnime. Stafi i Drejtoris\u00eb s\u00eb Inovacionit dhe Regjistrave nuk ka kryer
  asnj\u00eb dit\u00eb trajnim p\u00ebr sistemet, sigurin\u00eb dhe teknologjin\u00eb
  e informacionit, etj.\\n\\nKriteri: Standardet e nd\u00ebrkomb\u00ebtare t\u00eb
  TIK p\u00ebr rritjen e kapaciteteve dhe ligji p\u00ebr N\u00ebpun\u00ebsin Civil.\\n\\nNdikimi/efekti:
  Mungesa e aft\u00ebsive p\u00ebr zbatimin e rregullave dhe standardeve t\u00eb siguris\u00eb
  s\u00eb informacionit gjat\u00eb p\u00ebrdorimit t\u00eb aseteve.\\n\\nShkaku: Munges\u00eb
  planifikimi.\\n\\nR\u00ebnd\u00ebsia: E mesme.\\n\\nRekomandimi: QKB t\u00eb marr\u00eb
  masa p\u00ebr menaxhimin e burimeve njer\u00ebzore, duke plot\u00ebsuar nevojat
  p\u00ebr trajnime t\u00eb stafit t\u00eb Drejtoris\u00eb s\u00eb Inovacionit dhe
  Regjistrave dhe t\u00eb hartoj\u00eb plane dhe politika p\u00ebr zhvillimin e trajnimeve
  n\u00eb lidhje me sistemet, sigurin\u00eb dhe teknologjin\u00eb e informacionit.\\n\\nVerifikimi
  i shkall\u00ebs s\u00eb siguris\u00eb fizike dhe aksesit n\u00eb rrjet\\n\\nAuditimit
  mbi shkall\u00ebn e siguris\u00eb s\u00eb dhom\u00ebs s\u00eb serverave, u krye
  n\u00eb baz\u00eb t\u00eb VKM nr. 673, dat\u00eb 22.11.2017 \u201cP\u00ebr riorganizimin
  e Agjencis\u00eb Komb\u00ebtare t\u00eb Shoq\u00ebris\u00eb s\u00eb Informacionit\u201d
  dhe Rregulloren p\u00ebr nd\u00ebrtimin e dhom\u00ebs s\u00eb server\u00ebve (versioni
  1.0, dat\u00eb 02.12.2008) miratuar nga AKSHI, q\u00eb parashikon p\u00ebrcaktimin
  e standardeve t\u00eb TIK p\u00ebr administrat\u00ebn publike.\\n\\nDuke qen\u00eb
  se dhoma e server\u00ebve \u00ebsht\u00eb pika m\u00eb delikate e nj\u00eb sistemi
  informatik dhe p\u00ebrqendrimi i pajisjeve kompjuterike, mekanike, elektrike dhe
  elektronike \u00ebsht\u00eb m\u00eb i lart\u00eb se n\u00eb ambientet e tjera t\u00eb
  pun\u00ebs. D\u00ebmet eventuale t\u00eb shkaktuara n\u00eb ket\u00eb ambient do
  t\u00eb sillnin probleme serioze n\u00eb funksionimin e t\u00eb gjith\u00eb sistemit.\\n\\nP\u00ebr
  k\u00ebt\u00eb q\u00ebllim, grupi i auditimit, t\u00eb shoq\u00ebruar nga personat
  p\u00ebrgjegj\u00ebs t\u00eb Drejtoris\u00eb s\u00eb Inovacionit dhe Regjistrave
  n\u00eb QKB, zhvilloi verifikimin e dhom\u00ebs s\u00eb serverave t\u00eb lokalizuar
  tek AKSHI n\u00eb qendr\u00ebn e vazhdim\u00ebsis\u00eb s\u00eb pun\u00ebs, pasi
  QKB n\u00eb ambientet e saj nuk ka dhom\u00eb serverash.\\n\\nNga auditimi u konstatua
  se:\\n\\nRuajtja e pajisjeve fizike, Kontrolli i aksesit fizike mbi pajisjet, Kontrolli
  mbi personat q\u00eb kan\u00eb akses fizik:\\n\\n- Pajisjet elektronike si serverat
  dhe pajisjet e rrjetit jan\u00eb t\u00eb ruajtura n\u00eb ambiente t\u00eb mbyllura
  ku kan\u00eb akses vet\u00ebm specialistet e TI, ky ambient \u00ebsht\u00eb i mbyllur
  me der\u00eb t\u00eb blinduar i lokalizuar n\u00eb qendr\u00ebn e vazhdim\u00ebsis\u00eb
  s\u00eb pun\u00ebs tek AKSHI;\\n\\n- qendra e t\u00eb dh\u00ebnave dhe paketa elektrike
  jan\u00eb t\u00eb siguruar me sisteme alarmi;\\n- ka pajisje t\u00eb siguris\u00eb
  fizike t\u00eb aksesit dhe sistem *intrusion detection* p\u00ebr t\u00eb kufizuar
  personat e paautorizuar.\\n- n\u00eb qendr\u00ebn e t\u00eb dh\u00ebnave aksesi
  \u00ebsht\u00eb i kontrolluar me teknologji t\u00eb tilla si: skanime, lexues karte,
  etj.\\n- b\u00ebhet regjistrimi me video (*kamera sigurie*) p\u00ebr monitorimin
  e portave hyr\u00ebse p\u00ebr n\u00eb qendr\u00ebn e t\u00eb dh\u00ebnave dhe n\u00eb
  pjes\u00eb t\u00eb tjera t\u00eb perimetrit t\u00eb nd\u00ebrtes\u00ebs.\\n- ka
  nj\u00eb procedure t\u00eb qart\u00eb n\u00ebnshkrimi aksesi e cila p\u00ebrdoret
  n\u00eb rast log-imi nga punonj\u00ebsit n\u00eb zon\u00ebn e kufizuar.\\n- ekziston
  nj\u00eb politike strikte dhe procedura n\u00eb lidhje me koh\u00ebn e aksesit n\u00eb
  qendr\u00ebn e t\u00eb dh\u00ebnave nga punonj\u00ebsit.\\n\\nPozicionimi i rakeve
  t\u00eb regjistrit t\u00eb QKR dhe serverit t\u00eb QKL \u00ebsht\u00eb i organizuar
  n\u00eb dy dhoma t\u00eb ndryshme serverash, pra jan\u00eb t\u00eb ndar\u00eb n\u00eb
