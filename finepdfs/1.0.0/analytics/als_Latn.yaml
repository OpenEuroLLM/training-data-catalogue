  Problemi                                      | Shkaku i mundsh\u00ebm                                                                 |
  Zgjidhja                                                                 |\\n|----------------------------------------------|----------------------------------------------------------------------------------|--------------------------------------------------------------------------|\\n|
  N\u00eb qoft\u00eb aparati i d\u00ebgjimit ju bezdis n\u00eb vesh | Aparati i d\u00ebgjimit
  nuk \u00ebsht\u00eb vendosur si duhet n\u00eb kanalin e veshit.               |
  K\u00ebshillohuni me specialistin e d\u00ebgjimit se si ta vendosni aparatin e d\u00ebgjimit
  n\u00eb kanalin e veshit |\\n|                                              | Aparati
  i d\u00ebgjimit nuk z\u00eb vend mir\u00eb n\u00eb kanalin e veshit                          |
  Lidhuni me specialistin tuaj t\u00eb d\u00ebgjimit                                |\\n|                                              |
  Ju dhemb veshi ose kanali i veshit                                               |
  N\u00eb qoft\u00eb se dhimbja vazhdon, lidhuni me specialistin tuaj t\u00eb d\u00ebgjimit    |\\n\\nMIREMBAJTJA
  E APARATIT TUAJ TE DEGJIMIT\\n\\nAparati i d\u00ebgjimit \u00ebsht\u00eb nj\u00eb
  send me vler\u00eb dhe duhet trajtuar me kujdes. Ja \u00e7far\u00eb mund t\u00eb
  b\u00ebni, p\u00ebr t\u2019ia zgjatur jet\u00ebn aparatit tuaj t\u00eb d\u00ebgjimit:\\n\\nKUJDES\\n\\n\u2022
  Fikeni aparatin e d\u00ebgjimit, kur nuk \u00ebsht\u00eb n\u00eb p\u00ebrdorim.
  Hiqeni baterin\u00eb, nqs nuk do ta p\u00ebrdorni aparatin e d\u00ebgjimit p\u00ebr
  disa dit\u00eb rresht.\\n\\n\u2022 Kur aparat i d\u00ebgjimit nuk \u00ebsht\u00eb
  n\u00eb p\u00ebrdorim, mbajeni n\u00eb kutin\u00eb e vet, n\u00eb nj\u00eb vend
  t\u00eb that\u00eb, larg f\u00ebmij\u00ebve dhe kafsh\u00ebve sht\u00ebpiake.\\n\\n\u2022
  Mos e ekspozoni aparatin e d\u00ebgjimit ndaj temperaturave t\u00eb skajshme ose
  lag\u00ebshtis\u00eb s\u00eb madhe. Sigurohuni q\u00eb ta thani mir\u00eb aparatin
  e d\u00ebgjitit pasi t\u00eb keni djersitur shum\u00eb, si\u00e7 mund t\u00eb ndodh\u00eb
  gjat\u00eb nj\u00eb veprimtarie fizike intensive, psh. kur merreni me sport.\\n\\n\u2022
  Mos e lini aparatin e d\u00ebgjimit t\u00eb bjer\u00eb n\u00eb tok\u00eb- mbajeni
  mbi nj\u00eb sip\u00ebrfaqe t\u00eb but\u00eb, kur po e pastroni ose kur nd\u00ebrroni
  baterin\u00eb.\\n\\n\u2022 Mos e mbani aparatin e d\u00ebgjimit n\u00eb vesh, kur
  jeni duke b\u00ebr\u00eb dush ose duke notuar, ose kur p\u00ebrdorni spraj p\u00ebr
  floket, xhel, apo kremra plazhi.\\n\\nPARALAJMERIME\\n\\nPARALAJMERIM\\n\\nAparatet
  e d\u00ebgjimit dhe baterit\u00eb mund t\u00eb jen\u00eb t\u00eb rrezikshme n\u00ebse
  g\u00eblltiten ose p\u00ebrdoren n\u00eb m\u00ebnyr\u00eb t\u00eb pap\u00ebrshqatshme.
  G\u00eblltitja ose p\u00ebrdorimi i pap\u00ebrshqatsh\u00ebm mund t\u00eb shkaktojn\u00eb
  l\u00ebndime t\u00eb r\u00ebnda ose edhe vdekjen. N\u00eb rast g\u00eblltitje, lajm\u00ebroni
  menj\u00ebher\u00eb mjekun.\\n\\n\u2022 Mbajini aparatet e d\u00ebgjimit dhe pjes\u00ebt
  e tyre, aksesor\u00ebt dhe baterit\u00eb larg f\u00ebmij\u00ebve dhe kujdo tjet\u00ebr
  q\u00eb mund ti g\u00eblltit\u00eb k\u00ebto sende ose t\u00eb l\u00ebndoj\u00eb
  veten me ndonj\u00eb m\u00ebnyr\u00eb tjet\u00ebr. Mos i nd\u00ebrroni baterit\u00eb
  para tyre dhe mos i lejon ti shohin se ku i mbani baterit\u00eb rezerv\u00eb. Tregoni
  kujdes kur i eleminoni baterit\u00eb e p\u00ebrdorura.\\n\\n\u2022 Baterit\u00eb
  jan\u00eb shum\u00eb t\u00eb vogla dhe mund t\u00eb ngat\u00ebrhoen leht\u00eb me
  tabletat ose sende t\u00eb ngjashme. Kurr\u00eb mos e futni nj\u00eb bateri ose
  aparatin e d\u00ebgjimit n\u00eb goj\u00eb p\u00ebr asnj\u00eb arsyje, sepse mund
  ta g\u00eblltisni padashur.\\n\\n\u2022 Pas p\u00ebrdorimit, pastroje dhe kontrolloje
  aparatin e d\u00ebgjimit p\u00ebr t\u00eb par\u00eb q\u00eb \u00ebsht\u00eb n\u00eb
  rregull. Nqs aparati i d\u00ebgjimit ndahet n\u00eb pjes\u00eb kur \u00ebsht\u00eb
  n\u00eb kanalin e veshit, kontakto menj\u00ebher\u00eb me specialistin tuaj t\u00eb
  d\u00ebgjimit. Mos u p\u00ebrpiq kurr\u00eb q\u00eb ta heq\u00ebsh pjes\u00ebn e
  mbetur n\u00eb kanalin e veshit vet\u00eb.\\n\\nPARALAJMERIM\\n\\n\u2022 Ka rrezik
  shp\u00ebrthimi, n\u00eb qoft\u00eb se bateria z\u00ebvend\u00ebsohet me nj\u00eb
  tjet\u00ebr t\u00eb nj\u00eb lloji t\u00eb pap\u00ebrshtatsh\u00ebm ose ringarkohet.
  Eliminoni baterit\u00eb e p\u00ebrdorura sipas udh\u00ebzimeve.\\n\\n\u2022 Mos
  i lejoni asnj\u00ebher\u00eb t\u00eb tjer\u00ebt q\u00eb t\u00eb t\u00eb p\u00ebrdorin
  aparatin tuaj t\u00eb d\u00ebgjimit, meq\u00eb kjo mund t\u2019u shkaktoj\u00eb
  atyre d\u00ebmtim t\u00eb p\u00ebrhersh\u00ebm n\u00eb d\u00ebgjim.\\n\\n\u2022
  Kur p\u00ebrzgjidhni nj\u00eb program d\u00ebgjimi, mbani parasysh se ka situata
  n\u00eb t\u00eb cilat \u00ebsht\u00eb tejet e r\u00ebnd\u00ebsishme q\u00eb t\u00eb
  mund t\u00eb d\u00ebgjoni tingujt rrethues (p.sh. n\u00eb trafik, ose sinjale paralajm\u00ebruese).\\n\\n\u2022
  Aparati i d\u00ebgjimit \u00ebsht\u00eb i prodhuar me materiale moderne, jo-alergjike.
  Megjithat\u00eb, n\u00eb raste t\u00eb rralla, mund t\u00eb ndodh\u00eb irritim
  i l\u00ebkur\u00ebs. N\u00eb qoft\u00eb se v\u00ebreni irritim t\u00eb l\u00ebkur\u00ebs
  n\u00eb vesh, n\u00eb kanalin e veshit ose n\u00eb zonat p\u00ebrreth, lidhuni me
  specialistin tuaj t\u00eb d\u00ebgjimit.\\n\\n\u2022 Duhet t\u00eb keni parasysh
  q\u00eb gjat\u00eb p\u00ebrdorimit t\u00eb aparatit t\u00eb d\u00ebgjimit, ju duhet
  t\u00eb b\u00ebni nj\u00eb ventilim t\u00eb rregullt t\u00eb veshit. Nqs nuk sigurohet
  kjo mund t\u00eb keni nj\u00eb rrezik t\u00eb shtuar p\u00ebr infeksion ose s\u00ebmundje
  t\u00eb kanalit t\u00eb veshit. Prandaj ne rekomandojm\u00eb q\u00eb ta hiqni aparatin
  e d\u00ebgjimit dhe kufjen nga veshi nat\u00ebn, p\u00ebr t\u00eb lejuar ventilimin
  e kanalit t\u00eb veshit. Nqs \u00ebsht\u00eb e mundur, ju duhet ta hiqni aparatin
  e d\u00ebgjimit dhe kufjen edhe gjat\u00eb dit\u00ebs, n\u00eb periudha kur nuk
  keni nevoj\u00eb p\u00ebr t\u00eb. Sigurohuni q\u00eb ta pastroni dhe ta mir\u00ebmbani
  aparatin e d\u00ebgjimit dhe kufjen si\u00e7 k\u00ebrkohet. N\u00ebse nj\u00eb infeksion
  ndodh, k\u00ebrkon ndihm\u00eb mjek\u00ebsore dhe lidhuni me specialistin tuaj t\u00eb
  d\u00ebgjimit p\u00ebr tu k\u00ebshilluar rreth dezinfektimit t\u00eb pjes\u00ebve
  t\u00eb ndryshme t\u00eb aparatit t\u00eb d\u00ebgjimit. N\u00eb asnj\u00eb rrethan\u00eb
  mos p\u00ebrdorni alkool, klor ose l\u00ebnde tjera t\u00eb ngjashme.\\n\\nPARALAJMERIM\\n\\n\u2022
  P\u00ebrdorimi i rregullt i kapsulave kund\u00ebr lag\u00ebshtir\u00ebs, rekomandohet
  p\u00ebr t\u00eb shmangur keqfunksionimin e aparatit t\u00eb d\u00ebgjimit.\\n\\n\u2022
  Mos e p\u00ebrdorni aparatin e d\u00ebgjimit n\u00eb miniera ose zona t\u00eb tjetra
  ku mund t\u00eb ket\u00eb gazra shp\u00ebrthyese.\\n\\nPARALAJMERIM\\n\\n\u2022
  Mos e mbani aparatin e d\u00ebgjimit kur trajtoheni me rreze, b\u00ebni radiografi,
  MRI, CT ose trajtime dhe skanime mjek\u00ebsore. Rrezet nga k\u00ebto procedura,
  si dhe nga lloje t\u00eb tjera rrezatimi, t\u00eb tilla si ato q\u00eb l\u00ebshon
  nj\u00eb sob\u00eb me mikrovale, mund ta d\u00ebmtojn\u00eb aparatin tuaj t\u00eb
  d\u00ebgjimit. Rrezatimi nga paisjet e survejimit t\u00eb dhomave, sistemet e alarmit
  kund\u00ebr vjedhjeve, dhe i telefonave celular \u00ebsht\u00eb m\u00eb i dob\u00ebt
  dhe nuk do ta d\u00ebmtoje aparatin e d\u00ebgjimit., por mund t\u00eb krijoj\u00eb
  interferenca t\u00eb d\u00ebgjueshme.\\n\\nKUJDES\\n\\n\u2022 Aparati juaj i d\u00ebgjimit
  \u00ebsht\u00eb testuar p\u00ebr interferenc\u00eb sipas standardeve nd\u00ebrkont\u00ebtare.
  Megjithat\u00eb interferenca t\u00eb paparashikuara mund t\u00eb ndodh\u00eb n\u00eb
  aparatin e d\u00ebgjimit p\u00ebr shkak t\u00eb rrezatimit elektromagnetik nga paisje
  t\u00eb till\u00eb si sistemet e alarmit, paisjet e surveimit t\u00eb dhomave dhe
  telefonave celular.\\n\\n\u2022 Edhe pse aparati juaj i d\u00ebgjimit \u00ebsht\u00eb
  projektuar n\u00eb m\u00ebnyr\u00eb t\u00eb till\u00eb q\u00eb t\u00eb pajtohet
  me standardet m\u00eb t\u00eb rrepta nd\u00ebrkont\u00ebtare t\u00eb p\u00ebrputhshm\u00ebris\u00eb
  elektromagnetike, nuk mund t\u00eb p\u00ebrjashtohet mund\u00ebsia q\u00eb ai t\u00eb
  shkaktoj\u00eb interferenc\u00eb me paisje t\u00eb tjer\u00eb, si p.sh. aparaturat
  mjek\u00ebsore.\\n\\n\u2022 Asnj\u00ebher\u00eb mos provoni ta hapni ose ta riparoni
  aparatin e d\u00ebgjimit ju vet\u00eb.\\n\\nKESHILLA\\n\\nSHENIM\\n\\n\u2022 Aparati
  i d\u00ebgjimit nuk do t\u00eb rikthej\u00eb d\u00ebgjimin normal dhe nuk do t\u00eb
  parandaloj\u00eb as do t\u00eb p\u00ebrmir\u00ebsoj\u00eb nj\u00eb humbje d\u00ebgjimi
  q\u00eb vjen nga nj\u00eb s\u00ebmundje organike. Megjithat\u00eb, aparati i d\u00ebgjimit
  mund t\u2019ju ndihmoj\u00eb ta p\u00ebrdorni sa m\u00eb mir\u00eb at\u00eb aft\u00ebsi
  d\u00ebgjimi q\u00eb ju ka mbetur. Duhet t\u00eb keni parasysh edhe se mund t\u2019ju
  duhet koh\u00eb p\u00ebr t\u2019u m\u00ebsuar me nj\u00eb aparat t\u00eb ri d\u00ebgjimi
  dhe tingujt e rinj.\\n\\n\u2022 N\u00eb shum\u00eb raste, po ta p\u00ebrdorni aparatin
  e d\u00ebgjimit jo shpesh, nuk do t\u00eb mund t\u00eb p\u00ebrfitoni maksimumin
  prej tij.\\n\\n\u2022 P\u00ebrdorimi i nj\u00eb aparat d\u00ebgjimi \u00ebsht\u00eb
  vet\u00ebm pjes\u00eb e aft\u00ebsimit t\u00eb d\u00ebgjimit dhe mund t\u00eb duhet
  t\u00eb shoq\u00ebrohet nga st\u00ebrvitja d\u00ebgjimore dhe p\u00ebr leximin e
  buz\u00ebve.\\n\\n\u2022 P\u00ebrdorimi i aparateve t\u00eb d\u00ebgjimit rrit rrezikut
  e grumbullimit t\u00eb dyllit n\u00eb vesh\u00eb. Lidhuni me mjekun tuaj ose me
  otolaringologun, n\u00ebse dyshoni q\u00eb ju \u00ebsht\u00eb krijuar n\u00eb vesh
  nj\u00eb tap\u00eb dylli. Dylli jo vet\u00ebm mund t\u2019juja d\u00ebmtoj\u00eb
  d\u00ebgjimin, por edhe t\u00eb ndikoj\u00eb ndjesh\u00ebm n\u00eb rendimentin e
  aparatit t\u00eb d\u00ebgjimit. B\u00ebni mir\u00eb q\u00eb t\u2019i k\u00ebrkonin
  mjekut tuaj q\u00eb t\u2019juja pasyrojn\u00eb vesh\u00ebt nga dy her\u00eb n\u00eb
  vit.\\n\\nPaisjet elektrike dhe elektronike (EEE) p\u00ebrmbajn\u00eb materiale,
  komponent\u00eb dhe substanca q\u00eb mund t\u00eb jen\u00eb t\u00eb rrezikshme
  p\u00ebr sh\u00ebndetin e njeriut dhe mjedisin kur mbeturinat e paisjeve elektrike
  dhe elektronike (WEEE) nuk trajtohen si duhet.\\n\\nMos i hidhni aparatet e d\u00ebgjimit,
  paisjet ndihm\u00ebse t\u00eb tyre dhe baterit\u00eb n\u00eb mbeturinat e zakonshme
  sht\u00ebpiake.\\n\\nAparatet e d\u00ebgjimit, baterit\u00eb dhe aksesor\u00ebt
