  N\u00eb DT p\u00ebr Kontrat\u00ebn 11807, dat\u00eb 29.12.2016 jan\u00eb k\u00ebrkuar:\\n-
  8 punonj\u00ebs t\u00eb certifikuar n\u00eb MCPD, ose ekuiivalent, me q\u00ebllim
