  email@example.com\\nWebsite: asha.gov.al\"", "\"VENDIM\\n\\nNr. 107 Dat\u00eb 07.11.2014\\n\\nFILLIMIN
  E PROCEDURAVE P\u00cbR RINOVIMIN E LICENS\u00cbS S\u00cb SHOQ\u00cbRIS\u00cb \u201cAXPO
