  62-71|\\n\\n2\\n\\nI. P\u00cbRMBLEDHJE EKZEKUTIVE\\n\\nI.a. P\u00ebrshkrimi i Projektit
  t\u00eb Auditimit.\\n\\nProjekti i auditimit, p\u00ebr auditimin e Sistemeve t\u00eb
  Teknologjis\u00eb s\u00eb Informacionit, n\u00eb Qendr\u00ebn Komb\u00ebtare t\u00eb
  Biznesit, \u00ebsht\u00eb pjes\u00eb e Planit Vjetor t\u00eb auditimit t\u00eb KLSH-s\u00eb,
  si dhe e Planit Mujor, Qershor 2018. Projektimi i k\u00ebtij auditimi, \u00ebsht\u00eb
  b\u00ebr\u00eb bazuar n\u00eb nj\u00eb analiz\u00eb rishku, si gjat\u00eb hartimit
  t\u00eb planit vjetor, po ashtu edhe gjat\u00eb hartimit t\u00eb Programit t\u00eb
  Projektit t\u00eb Auditimit, ku KLSH, ka vler\u00ebsuar si t\u00eb r\u00ebnd\u00ebsisht\u00ebm
  auditimin e QKB-s\u00eb, p\u00ebr shkak t\u00eb r\u00ebnd\u00ebsis\u00eb s\u00eb
  ve\u00e7ant\u00eb t\u00eb sh\u00ebrbimit q\u00eb ofron, administrim t\u00eb Regjistrit
  Elektronik Tregtar dhe Regjistrit Elektronik t\u00eb Lejeve dhe Licencave n\u00eb
  nivel komb\u00ebtar. Siguria e Informacionit \u00ebsht\u00eb b\u00ebr\u00eb gjithnj\u00eb
  e m\u00eb shum\u00eb e r\u00ebnd\u00ebsisht\u00eb p\u00ebr institucionet qeveritare,
  kjo si pasoj\u00eb rritjes s\u00eb kompleksitetit t\u00eb kontrollit t\u00eb aksesit
  dhe ruajtjes s\u00eb konfidencialitetit, integritetit dhe gatishm\u00ebris\u00eb
  s\u00eb t\u00eb dh\u00ebnave nga marr\u00ebdh\u00ebniet e rrjeteve publike me ato
  private dhe nga bashk\u00eb p\u00ebrdorimi i burimeve t\u00eb informacionit. Siguria
  e Informacionit mund t\u00eb p\u00ebrcaktohet si mund\u00ebsia e nj\u00eb sistemi
  p\u00ebr t\u00eb mbrojtur informacionin dhe burimet e sistemeve n\u00eb p\u00ebrpunhje
  me termat e konfidencialitetit, integritetit dhe gatishm\u00ebris\u00eb. Sistemi
  e informacionit jan\u00eb bashkime komplekse t\u00eb teknologjis\u00eb, proceseve
  dhe njer\u00ebzve q\u00eb funksionojn\u00eb s\u00eb bashku p\u00ebr t\u00eb rregulluar
  p\u00ebrpunimin, ruajtjen, dhe transferimin e informacionit p\u00ebr t\u00eb mb\u00ebshtetur
  misionin e institucionit dhe funksionet e tij. Lidhur nga sa m\u00eb sip\u00ebr,
  \u00e7do institucion shtet\u00ebror q\u00eb ofron sh\u00ebrbime ndaj qytetar\u00ebve
  e ka si detyrim nd\u00ebrtimin e programit t\u00eb siguris\u00eb s\u00eb informacionit
  me element\u00ebt ky\u00e7 t\u00eb cil\u00ebt jan\u00eb: \u201cMjedisi i siguris\u00eb
  s\u00eb informacionit, Vler\u00ebsimi i rishkut, Politikat e siguris\u00eb, Organizimi
  i siguris\u00eb s\u00eb TIK, Menaxhimi i komunikimeve dhe operacioneve, Menaxhimi
  i aseteve, Siguria e burimeve njer\u00ebzore, Siguria fizike dhe mjedisore, Kontrolli
  i aksesit, Menaxhimi i incidenteve t\u00eb siguris\u00eb s\u00eb TIK, Menaxhimi
  i vazhdueshm\u00ebris\u00eb s\u00eb biznesit, P\u00ebrputhshm\u00ebria\u201d.\\n\\nN\u00eb
  p\u00ebrfundim t\u00eb k\u00ebtij auditimi, KLSH do siguroj\u00eb Parlamentin, pal\u00ebt
  e interesit si dhe gjith\u00eb p\u00ebrdoruesit e sistemit elektronik t\u00eb QKB,
  se ky sistem ka siguruar leht\u00ebsimin e procedurave t\u00eb regjistrimit t\u00eb
  subjekteve dhe licencimit t\u00eb tyre n\u00eb t\u00eb gjith\u00eb territorin e
  vendit, duke koordinuar t\u00eb dh\u00ebnat n\u00eb m\u00ebnyr\u00eb t\u00eb sakt\u00eb
  duke ju dh\u00ebn\u00eb mund\u00ebsin\u00eb subjekteve t\u00eb interesuara t\u00eb
  informohen n\u00eb koh\u00eb reale, duke siguruar n\u00eb t\u00eb nj\u00ebjt\u00ebn
  koh\u00eb ruajtjen e t\u00eb dh\u00ebnave.\\n\\nI.b Nj\u00eb p\u00ebrshkrim i p\u00ebrmbledhur
  i gjetjeve nga auditimi.\\n\\n1. Nga auditimi lidhur me t\u00eb dh\u00ebnat elektronike
  p\u00ebr pasqyrat financiare t\u00eb subjekteve dhe raportet e auditit/veprimtaris\u00eb
  \u00ebsht\u00eb konstatuar se:\\n\\n- K\u00ebto t\u00eb dh\u00ebna jan\u00eb par\u00ebsore
  n\u00eb regjistrin e biznesit n\u00eb QKR, n\u00eb p\u00ebrputhje me nenin 43, germa
  a, t\u00eb ligjit nr. 9723, dat\u00eb \u201cP\u00ebr qendr\u00ebn komb\u00ebtare
  t\u00eb regjistrimit\u201d i p\u00ebrdit\u00ebsuar, si dhe VKM nr. 863, dat\u00eb
  21.10.2015 \u201cP\u00ebr krijimin e baz\u00ebs t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore
  t\u00eb qendr\u00ebs komb\u00ebtare t\u00eb regjistrimit, regjistri tregtar\u201d.
  Afati p\u00ebrfundimtar p\u00ebr depozitimin e tyre, sipas nenit 43, germa a, \u00ebsht\u00eb
  data 31 Korrik e \u00e7do viti, n\u00eb t\u00eb kund\u00ebrt ndaj subjektit vendoset
  gjoba prej 15,000 lek\u00eb bazuar n\u00eb nenin 74, pika 3.\\n\\n- QKB nuk ka t\u00eb
  mundur asnj\u00eb element kontrolli mbi v\u00ebrtet\u00ebsin\u00eb e t\u00eb dh\u00ebnave
  n\u00eb pasqyrat financiare, pasi ky kontroll nuk \u00ebsht\u00eb pjes\u00eb e aktivitetit
  t\u00eb k\u00ebtij institucioni.\\n\\n- Pasqyrat financiare dhe raportet e auditimit/veprimtaris\u00eb
  jan\u00eb t\u00eb detyrueshme p\u00ebr t\u2019u plot\u00ebsuar edhe n\u00eb sistemin
  tatimor t\u00eb DPT sipas nenit 29 t\u00eb ligjit nr. 8438, dat\u00eb 28.12.1998
  \u201cP\u00ebr tatimin mbi t\u00eb ardhurat\u201d i ndryshuar. DPT ushton kontroll
  mbi element\u00ebt e pasqyrave financiare, lejon ose jo ndryshimin e tyre dhe i
  certifikon ato.\\n\\n- Pasqyrat financiare dhe raportet e auditimit/veprimtaris\u00eb
  p\u00ebrmbajn\u00eb t\u00eb dh\u00ebna q\u00eb sipas nenit 25 i ligjit nr. 9920,
  dat\u00eb 19.05.2008 \u201cP\u00ebr procedurat tatimore n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d i ndryshuar, i n\u00ebnshtronen kushteve t\u00eb konfidencialitetit,
  nd\u00ebrkohe q\u00eb po t\u00eb nj\u00ebjtat t\u00eb dh\u00ebna t\u00eb subjekteve
  n\u00eb QKB k\u00ebrkohen t\u00eb dor\u00ebzohen brenda afateve t\u00eb p\u00ebrcaktuara
  me ligj e me gjoba n\u00eb rast mos p\u00ebrmbushje n\u00eb sh\u00ebrbim t\u00eb
  transparenc\u00ebs.\\n\\n- Bazat ligjore t\u00eb dy institucioneve i k\u00ebrkojn\u00eb
  biznesit t\u00eb nj\u00ebt\u00ebn t\u00eb dh\u00ebn\u00eb t\u00eb klasifikuar si
  par\u00ebsore, t\u00eb paraqitet n\u00eb dy sisteme t\u00eb ndryshme, tek ai i regjistrit
  t\u00eb biznesit n\u00eb QKB si dhe ai tatimor n\u00eb DPT, \u00e7far\u00eb bie
  ndesh me nenin 7 t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\n- QKB dhe DPT jan\u00eb dakord\u00ebsuar
  me marr\u00ebveshjen nr. 1242/1, dat\u00eb 07.09.2017, pa marr\u00eb parasysh faktin
  q\u00eb transparencia mbi t\u00eb dh\u00ebnat e subjekteve n\u00eb QKB e zhb\u00ebn
  konfidencialitetin p\u00ebr t\u00eb nj\u00ebjtat subjekte n\u00eb DPT.\\n\\n- Subjektet
  dor\u00ebzimin e pasqyrave financiare e kryejn\u00eb n\u00eb dy institucionet (QKB/DPT),
  ku q\u00eb prej vitit 2015 p\u00ebr llogari t\u00eb QKB, e kryen n\u00ebp\u00ebrmjet
  portalit e-albania (para k\u00ebtij viti veprime kryheshin n\u00eb sportel), nd\u00ebrsa
  p\u00ebr llogari t\u00eb DPT n\u00eb sistemin tatimor i cili \u00ebsht\u00eb dhe
  p\u00ebrgjegj\u00ebs p\u00ebr v\u00ebnien n\u00eb dijeni t\u00eb QKB p\u00ebr subjektet
  q\u00eb kan\u00eb k\u00ebt\u00eb detyrim.\\n\\n2. Nga auditimi lidhur me Planin
  Strategjik t\u00eb Teknologjis\u00eb s\u00eb Informacionit rezulton se, Qendra Komb\u00ebtare
  e Biznesit, nuk ka t\u00eb nd\u00ebrtuar nj\u00eb Plan Strategjik t\u00eb Teknologjis\u00eb
  s\u00eb Informacionit, gj\u00eb q\u00eb sjell mos pasqyrimin t\u00eb qart\u00eb
  t\u00eb objektivave t\u00eb QKB, lidhur me sigurin\u00eb institucionale dhe infrastruktur\u00ebn
  TIK, objektivat strategjik\u00eb p\u00ebr burimet njer\u00ebzore t\u00eb struktur\u00ebs
  s\u00eb TIK n\u00eb QKB, si dhe p\u00ebr deget rajonale dhe burimet e nevojshme
  p\u00ebr ngritjen, zhvillimin dhe mir\u00ebmbajtjen e saj.\\n\\n3. Nga auditimi
  lidhur me Planin e Rim\u00ebk\u00ebmbjes nga Katastrofat, QKB si institucion q\u00eb
  administron t\u00eb dh\u00ebna me r\u00ebnd\u00ebsi p\u00ebr regjistrimin dhe licencimin
  n\u00eb dy sisteme informacioni (QKR dhe QKL), p\u00ebrcaktuar n\u00eb ligjin organik
  q\u00eb rregullon regjistrimin dhe licencimin e biznesit, rezulton se nuk ka qend\u00ebr
  t\u00eb rim\u00ebk\u00ebmbjes nga katastrofat (DRC) p\u00ebr serverat e sistemeve
  QKR dhe QKL t\u00eb cil\u00ebt hostohen tek data centeri i AKSHI-t, si dhe nuk ka
  t\u00eb hartuar nj\u00eb plan t\u00eb politikave t\u00eb vazhdueshm\u00ebrises s\u00eb
  biznesit (BCP) dhe dokumentim mbi planin e rim\u00ebk\u00ebmbjes nga katastrofa
  (DRC).\\n\\n4. Mungesa e kapaciteteve t\u00eb servereve. Nga auditimi u konstatua
  se:\\n   - Serverat kan\u00eb munges\u00eb n\u00eb hap\u00ebsirat fizike dhe logjike
  duke ndikuar n\u00eb performanc\u00ebn dhe mbar\u00ebvajtje e sistemeve, si dhe
  duke rrezikuar n\u00eb humbjen e t\u00eb dh\u00ebnave. Transactional backup nuk
  b\u00ebhet p\u00ebr shkak t\u00eb munges\u00ebs s\u00eb hap\u00ebsirave n\u00eb
  serverin e databaz\u00ebs.\\n   - Backup-i i sistemit t\u00eb regjistrit t\u00eb
  biznesit realizohet n\u00eb m\u00ebnyr\u00eb manuale nga punonj\u00ebsit e Drejtoris\u00eb
  s\u00eb Inovacionit dhe Regjistrave.\\n   - Disa nga volumet Hdd nuk jan\u00eb t\u00eb
  konfiguruar n\u00eb redundant RAID gj\u00eb e cila mund t\u00eb sjell\u00eb humbje
  t\u00eb dh\u00ebnash n\u00eb raste aksidentesh apo n\u00eb raste t\u00eb d\u00ebshmit
  t\u00eb nj\u00eb Hdd, etj.\\n   - Serverat e sistemit QKL p\u00ebr shkak t\u00eb
  munges\u00ebs s\u00eb suportit nga ana e prodhuesit kan\u00eb kaluar n\u00eb status
  \u201cretired\u201d.\\n   - Upgrade-imi i SQL Servers n\u00eb versione m\u00eb t\u00eb
  reja nuk mund t\u00eb realizohet p\u00ebr arsyet\u00eb t\u00eb munges\u00ebs s\u00eb
  kapaciteteve t\u00eb vet\u00eb serverave dhe kushteve t\u00eb tjera optimale q\u00eb
  k\u00ebrkohen p\u00ebr t\u00eb kaluar n\u00eb versione m\u00eb t\u00eb reja.\\n\\n5.
  Nga auditimi mbi dokumentimin e regjistrit elektronik t\u00eb Licencave, Lejeve
  dhe Autorizimeve si Baz\u00eb t\u00eb dh\u00ebnash Shtet\u00ebrore rezulton se ky
  regjist\u00ebr \u00ebsht\u00eb i pa dokumentuar me akte ligjore si baz\u00eb e t\u00eb
  dh\u00ebnave shtet\u00ebrore te autoriteti p\u00ebrgjegj\u00ebs rregulator koordinues.\\n\\n6.
  Nga auditimi i rregulloreve rezultoi se, Rregullorja e Teknologjis\u00eb s\u00eb
  Informacionit \u00ebsht\u00eb e pa miratuar dhe Drejtoria e Inovacionit dhe Regjistrave
  e ka mb\u00ebshtetur aktivitetin e saj n\u00eb k\u00ebt\u00eb\\n\\nrregullore. Me
  miratimin dhe futjen n\u00eb fuqi t\u00eb VKM nr. 673, dat\u00eb 22.11.2017 \u201cP\u00ebr
  riorganizimin e Agjencis\u00eb Komb\u00ebtare t\u00eb Shoq\u00ebr\u00ebsis\u00eb
  s\u00eb Informacionit\u201d, rregulloret e miratuara nga QKB nuk jan\u00eb efic\u00ebnte
  dhe efektive p\u00ebr tu p\u00ebrdorur dhe do t\u00eb duhet tu n\u00ebnshtrohen
  nj\u00eb rishikimi t\u00eb holl\u00ebsisht\u00ebm duke reflektuar ndryshimet q\u00eb
  do t\u00eb ndodhin n\u00eb struktur\u00eb, n\u00eb p\u00ebrshkrimet e pun\u00ebs
  dhe n\u00eb ndarjen e p\u00ebrgjegj\u00ebsive t\u00eb gjithasecilit p\u00ebr tu
  p\u00ebrshtatur me k\u00ebrkesat e k\u00ebsaj VKM-je. Drejtoria e Inovacionit dhe
  Regjistrave n\u00eb QKB \u00ebsht\u00eb nj\u00eb nga strukturat q\u00eb prek\u0435\u0442
  nga miratimi dhe futja n\u00eb fuqi e VKM-s nr. 673 ku sipas s\u00eb cil\u00ebs,
  staffi TIK dhe pajisjet kalojn\u00eb n\u00eb var\u00ebsi t\u00eb ASKHI-it.\\n\\n7.
  Nga auditimi mbi hartimin e marr\u00ebveshjes p\u00ebr komunikimin elektronik rezulton
  se, midis QKB dhe DPT marr\u00ebveshja p\u00ebr nd\u00ebrveprimin e t\u00eb dh\u00ebnave
  \u00ebsht\u00eb n\u00ebnshkruar pa p\u00ebrfshirjen e Autoritetit Rregullator Koordinues
  si institucioni p\u00ebrgjegj\u00ebs p\u00ebr p\u00ebrpunimin, p\u00ebrdit\u00ebsimin
  dhe standardizimin e procedurave dhe rregullave p\u00ebr krijimin, regjistrimin,
  p\u00ebrfundimin e funksionimit, administrimin, nd\u00ebrveprimin dhe sigurin\u00eb
  e bazave t\u00eb dh\u00ebnave shtet\u00ebrore dhe element\u00ebve t\u00eb tjer\u00eb
  specifik\u00eb q\u00eb lidhen me k\u00ebto procese bazuar n\u00eb nenin10/pika 1.2
  t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave
  shtet\u00ebrore\u201d.\\n\\nGjithashtu, nd\u00ebrmjet QKB dhe DPT ende nuk rezulton
  t\u00eb jet\u00eb zyrtarizuar ndonj\u00eb protokoll komunikimi apo nd\u00ebrveprimi
  t\u00eb dh\u00ebnash p\u00ebr leht\u00ebsimin e procedurave, konsultimin si dhe
  leximin n\u00eb m\u00ebnyr\u00eb t\u00eb nd\u00ebrsjell\u00ebt n\u00eb zbatim t\u00eb
  objektit t\u00eb marr\u00ebveshjes neni 3, pika 3.2 n\u00eb t\u00eb cil\u00ebn citohet
  se: \u201c.....n\u00ebp\u00ebrmjet hapave t\u00eb detajuar n\u00eb Protokollin e
  Shk\u00ebmbimit Elektronik i cili \u00ebsht\u00eb pjes\u00eb p\u00ebrb\u00ebr\u00ebse
  e k\u00ebsaj marr\u00ebveshje\u201d.\\n\\n8. Nga auditimi n\u00eb lidhje me leximin
  e t\u00eb dh\u00ebnave n\u00eb DPT p\u00ebr situat\u00ebn aktuale tatimore t\u00eb
  subjekteve q\u00eb aplikojn\u00eb p\u00ebr \u00e7regjistrim, rezulton se aplikimet
  p\u00ebr \u00e7regjistrim nga QKB d\u00ebrgohen n\u00eb koh\u00eb reale n\u00eb
  DPT dhe me shkres\u00eb zyrtare n\u00eb nj\u00ebsit\u00eb vendore. DPT dhe nj\u00ebsit\u00eb
  vendore i p\u00ebrgjigjen k\u00ebrkes\u00ebs s\u00eb QKB n\u00eb lidhje me detyrimet
  e subjektit q\u00eb ka aplikuar p\u00ebr \u00e7regjistrim me shkres\u00eb zyrtare
  dhe jo n\u00ebp\u00ebrmjet sistemit. QKB-s\u00eb nuk i \u00ebsht\u00eb mund\u00ebsuar
  leximi i detyrimeve tatimore n\u00eb koh\u00eb reale n\u00eb sistemin e DPT n\u00eb
  kund\u00ebrshtim me objektin e marr\u00ebveshjes me nr. 12420/1, dat\u00eb 07.09.2017.\\n\\n9.
  N\u00eb marr\u00ebveshjen nd\u00ebrmjet pal\u00ebve \u00ebsht\u00eb dakord\u00ebsuar
  q\u00eb kodet NVE (Nace) t\u00eb d\u00ebrgohen elektronikisht nga DPT n\u00eb QKB-s\u00eb,
  t\u00eb azhurnuara n\u00eb rast verifikimi dhe konstatimi nga Administrata Tatimore,
  n\u00eb nj\u00eb koh\u00eb q\u00eb k\u00ebto t\u00eb dh\u00ebna n\u00eb Regjistrin
  Tregtar reflektohen si t\u00eb dh\u00ebna par\u00ebsore q\u00eb i p\u00ebrkaqin
  themelimit dhe veprimtaris\u00eb s\u00eb subjekteve tregtare kodet NVE (NACE), referuar
  VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijimin e baz\u00ebs t\u00eb t\u00eb
  dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs komb\u00ebtare t\u00eb regjistrimit,
  regjistri tregtar\u201d.\\n\\n10. Nga auditimi i inpute-ve t\u00eb QKL rezultoi
  se, p\u00ebr vitet 2015-2017, n\u00eb fush\u00ebn \u201cTipi i Subjektit\u201d,
  plot\u00ebsimi i fush\u00ebs nuk \u00ebsht\u00eb i unifikuar. Sakt\u00ebsisht kjo
  fush\u00eb \u00ebsht\u00eb plot\u00ebsuar me statusin \u201cShoqeri Aksionare\u201d
  si dhe \u201cShoq\u00ebri Aksionare\u201d. Gjithashtu kjo fush\u00eb \u00ebsht\u00eb
  plot\u00ebsuar me statusin \u201cShoq\u00ebri me p\u00ebrgjegj\u00ebsi t\u00eb kufizuar\u201d
  si dhe e shkurtuar \u201cShpk\u201d. Edhe pse p\u00ebr rastet e cituara, n\u00eb
  thelb statusi juridik mbetet i nj\u00ebjt\u00eb, kjo qasje rrit mund\u00ebsin\u00eb
  n\u00eb deklarimin e statistikave t\u00eb gabuara nga ana e institucionit t\u00eb
  Qendr\u00ebs Komb\u00ebtare t\u00eb Biznesit.\\n\\n- P\u00ebr vitet 2015-2017, n\u00eb
  19 raste mosha e aplikantit p\u00ebr marrjen e licenc\u00ebs \u00ebsht\u00eb n\u00ebn
  18 vje\u00e7, pra pa zot\u00ebsi t\u00eb plot\u00eb juridike p\u00ebr t\u00eb vepruar.
  Sakt\u00ebsisht u konstatuan 12 raste p\u00ebr vitin 2015, 6 raste p\u00ebr vitin
  2016 dhe 1 rast p\u00ebr vitin 2017. Gjithashtu n\u00eb 10 raste u konstatua se
  data e lindjes s\u00eb aplikantit i p\u00ebrket s\u00eb ardhmes. Sakt\u00ebsisht
  5 raste p\u00ebr vitin 2015 dhe 5 raste p\u00ebr vitin 2016.\\n- Nj\u00eb pjes\u00eb
  e fushave t\u00eb plot\u00ebsuarra kan\u00eb vler\u00ebn \u201cNULL\u201d. Sakt\u00ebsisht
  fushat: \u201cAdresa e e-mail\u201d, \u201cGjinia\u201d, \u201cTechDirector Name\u201d,
  \u201cEconomic Activity\u201d, \u201cDescription of Activity\u201d. Pra fushat nuk
  kan\u00eb t\u00eb dh\u00ebnat e k\u00ebrkuara, e p\u00ebr pasoj\u00eb informacioni
  i plot\u00eb p\u00ebr k\u00ebto raste nuk ekziston.\\n\\n- P\u00ebr vitin 2016,
  n\u00eb 3831 raste nga 4095 n\u00eb total, fusha \u201cSasia e paguar\u201d rezulton
  dat\u00eb. Normalisht kjo fush\u00eb duhet t\u00eb jet\u00eb e plot\u00ebsuar me
  vlerat \u201c100\u201d, \u201c50\u201d ose \u201cNULL\u201d.\\n- P\u00ebr vitet
  2015-2018, u konstatua se fusha \u201cNID\u201d nuk \u00ebsht\u00eb plot\u00ebsuar
  gjithnj\u00eb n\u00eb m\u00ebnyr\u00eb korrekte, pasi n\u00eb mjaft raste \u00ebsht\u00eb
  plot\u00ebsuar me numrin e let\u00ebrmjofimit apo numrin e pasaport\u00ebs.\\n-
  P\u00ebr vitet 2015-2018, u konstatuan 241 raste t\u00eb veprimeve t\u00eb dublikuara.
  Sakt\u00ebsisht p\u00ebr vitin 2015 rezultojn\u00eb 33 veprime t\u00eb dublikuara,
  p\u00ebr vitin 2016 rezultojn\u00eb 19 raste, p\u00ebr vitin 2017 rezultojn\u00eb
  122 raste dhe 2018 rezultojn\u00eb 67 raste.\\n\\n11. Nga auditimi i inpute-ve t\u00eb
  Regjistrit Tregtar. P\u00ebr vitet 2015-2018, u konstatuan 52 raste n\u00eb t\u00eb
  cilat forma ligjore nuk \u00ebsht\u00eb e p\u00ebrcaktuar. Sakt\u00ebsisht p\u00ebr
  vitin 2015 rezultojn\u00eb 18 raste, p\u00ebr vitin 2016 rezultojn\u00eb 13 raste,
  p\u00ebr vitin 2017 rezultojn\u00eb 8 raste dhe 2018 rezultojn\u00eb 3 raste.\\n-
  P\u00ebr vitet 2015-2018, u konstatuan 197 raste n\u00eb t\u00eb cilat fusha \u201cNACE_ID\u201d
  si dhe \u201cNACE_PARENT\u201d nuk jan\u00eb t\u00eb p\u00ebrcaktuara. Sakt\u00ebsisht
  p\u00ebr vitin 2015 rezultojn\u00eb 156 raste, p\u00ebr vitin 2016 rezultojn\u00eb
  7 raste, p\u00ebr vitin 2017 rezultojn\u00eb 26 raste dhe 2018 rezultojn\u00eb 8
  raste.\\n\\n12. Nga auditimi i mbik\u00ebqyrjes s\u00eb zbatimit t\u00eb kontratave
  t\u00eb MNSH, ka rezultuar se:\\n- komisionet p\u00ebrgjegj\u00ebse p\u00ebr mbik\u00ebqyrjen
  e zbatimit t\u00eb kontratave, nuk kan\u00eb dokumentuar kryerjen e matjeve n\u00eb
  lidhje me cil\u00ebsin\u00eb e sh\u00ebrbimit. Nga strukturat p\u00ebrgjegj\u00ebse
  p\u00ebr mbik\u00ebqyrjen e zbatimit t\u00eb kontrat\u00ebs, nuk u paraqit asnj\u00eb
  dokument, apo e dh\u00ebn\u00eb, ku t\u00eb v\u00ebrtetohej se nga ana e tyre \u00ebsht\u00eb
  p\u00ebrmbushur kjo detyr\u00eb. Gjithashtu, ka rezultuar se nuk jan\u00eb mbajtur
  Procesverbale t\u00eb kontrolleve t\u00eb kryera p\u00ebr zbatimin e kontrat\u00ebs
  dhe t\u00eb pranimit t\u00eb sh\u00ebrbimit.\\n- ka mosp\u00ebrputhje midis stafit
  t\u00eb deklaruar nga operatori ekonomik fitues n\u00eb dokumentet tenderit, me
  stafin i cili realisht ka kryer mir\u00ebmbajtjen e sistemit. Kjo ka ndodhur pasi,
  nga strukturat p\u00ebrgjegj\u00ebse p\u00ebr mbik\u00ebqyrjen e zbatimit t\u00eb
  kontratave, nuk \u00ebsht\u00eb kryer verifikim mbi stafin e kontraktuesit, i cili
  ka kryer mir\u00ebmbajtjen e sh\u00ebrbimit, sipas kontratave p\u00ebrkat\u00ebse.
  Konkretisht, konfirmimin e marr\u00ebdh\u00ebnies s\u00eb pun\u00ebs me kontraktuesin
  si, kontrata pune, formulari E-sig; kapacitetin tekniko-profesional si, diploma
  dhe certifikata, n\u00eb raport me at\u00eb t\u00eb deklaruar n\u00eb DT nga (kontraktuesi),
  me q\u00ebllim marjen e siguris\u00eb se sh\u00ebrbimi i kontruktuar do t\u00eb
  kryhet me cil\u00ebsi.\\n- se personeli kompanive kontraktuese, i cili \u00ebsht\u00eb
  caktuar p\u00ebr kryerjen e k\u00ebtij sh\u00ebrbimi, nuk \u00ebsht\u00eb dokumentuar
  ruajtja e kofidencialitetit t\u00eb t\u00eb dh\u00ebnave, pavar\u00ebsisht se n\u00eb
  kontratat e lidhura n\u00eb nenet p\u00ebrkat\u00ebse \u00ebsht\u00eb cil\u00ebsuar
  domosdoshm\u00ebria e ruajtjes s\u00eb t\u00eb dhene nga t\u00eb dy pal\u00ebt.
  Nga k\u00ebqyra e dokumentacionit rezultoi se, nuk ka asnj\u00eb dokument i cili
  v\u00ebrteton p\u00ebrmbushjen e k\u00ebtij kushti t\u00eb kontratave, nga ana e
  stafit t\u00eb kontraktuesve, t\u00eb cil\u00ebt kan\u00eb akses n\u00eb sistem,
  p\u00ebr shkak t\u00eb detyr\u00ebs.\\n\\nI.c Konkluzioni dhe Opinion i Auditimit.\\n\\nOpinioni
  mbi funksionimin e Sistemeve t\u00eb Teknologjis\u00eb s\u00eb Informacionit n\u00eb
  Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit, \u00ebsht\u00eb bazuar n\u00eb ligjin
  nr. 154/2014, \u201cP\u00ebr organizimin dhe funksionimin e Kontrollit t\u00eb Lart\u00eb
  t\u00eb Shtetit\u201d, ISSAI 5300, Manualin e Auditimit TIK, praktikat m\u00eb t\u00eb
  mira si dhe n\u00eb Standardet e Auditimit ISSAI 400.\\n\\nNga auditimi i funksionimit
  t\u00eb Sistemeve t\u00eb Teknologjis\u00eb s\u00eb Informacionit, sa i takon shkall\u00ebs
  s\u00eb zbatueshm\u00ebris\u00eb nga subjekti \u201cQendra Komb\u00ebtare e Biznesit\u201d,
  t\u00eb ligjeve dhe rregulloreve, politikave, standardeve t\u00eb vendosura u konkludua
  se, jan\u00eb marr\u00eb masa rregullative dhe organizative p\u00ebr garantimin
  e sh\u00ebrbimeve dhe funksionaliteteve p\u00ebr t\u00eb garantuar disponibilitetin
  e sistemeve t\u00eb informacionit q\u00eb disponon, n\u00eb sh\u00ebrbim t\u00eb
  biznesit, por ka edhe mang\u00ebsi t\u00eb cilat nuk rezultojn\u00eb materiale p\u00ebrsa
  i p\u00ebrket r\u00ebnd\u00ebsis\u00eb, konkretisht:\\n\\n- mbivendosje t\u00eb
  aktive ligjore, duke sjell\u00eb gjenerim t\u00eb t\u00eb dh\u00ebnave par\u00ebsore
  p\u00ebr t\u00eb nj\u00ebjtin q\u00ebllim\\n\\nnga dy institucionet QKB dhe DPT,
  n\u00eb kund\u00ebrshtim me ligjin \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d,
  si dhe duke ndikuar negativisht n\u00eb leht\u00ebsimin e procedurave p\u00ebr biznesin;\\n\\n-
  munges\u00eb t\u00eb komunikimit me sistemin e Drejtoris\u00eb s\u00eb P\u00ebrgjithshme
  t\u00eb Tatimeve dhe nj\u00ebsit\u00eb vendore p\u00ebr shk\u00ebmbimet e t\u00eb
  dh\u00ebnave n\u00eb koh\u00eb reale, t\u00eb cilat rezultojn\u00eb si arsyet kryesore,
  p\u00ebr nj\u00eb volum t\u00eb lart\u00eb t\u00eb p\u00ebrpunimit t\u00eb t\u00eb
  dh\u00ebnave, p\u00ebrqendruar n\u00eb zyrat qendrore;\\n\\n- \u00ebsht\u00eb dakord\u00ebsuar
  q\u00eb kodet NVE (Nace) t\u00eb d\u00ebrgohen elektronikisht nga DPT n\u00eb QKB-s\u00eb,
  t\u00eb azhurnuara n\u00eb rast verifikimi dhe konstatimi nga Administrata Tatimore,
  n\u00eb nj\u00eb koh\u00eb q\u00eb k\u00ebto t\u00eb dh\u00ebna n\u00eb Regjistrin
  Tregtar reflektohen si t\u00eb dh\u00ebna par\u00ebsore q\u00eb i p\u00ebrkasin
  themelimit dhe veprimtaris\u00eb s\u00eb subjekteve tregtare kodet NVE (NACE), referuar
  VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijimin e baz\u00ebs t\u00eb t\u00eb
  dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs komb\u00ebtare t\u00eb regjistrimit,
  regjistri tregtar\u201d;\\n\\n- nj\u00eb nivel t\u00eb gabimit t\u00eb inputit,
  si rezultat i mosfunkcionimit n\u00eb mas\u00ebn e duhur t\u00eb sistemit t\u00eb
  kontrollit t\u00eb brendsh\u00ebm;\\n\\nII. HYRJE\\n\\nMb\u00ebshtetur n\u00eb Ligjin
  154/2014, dat\u00eb 27.11.2014 \u201cP\u00ebr Organizimin dhe Funksionimin e KLSH\u201d,
  n\u00eb zbatim t\u00eb Programit t\u00eb Auditimit nr. 550/2, dat\u00eb 31.05.2018
  miratuar nga Kryetari i KLSH, nga data 01.06.2018 deri n\u00eb dat\u00eb 18.07.2018,
  n\u00eb Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit, p\u00ebr periudh\u00ebn nga
  01.01.2017 deri n\u00eb 31.12.2017, u krye auditimi mbi \u201cAuditimin e Sistemeve
  t\u00eb Teknologjis\u00eb s\u00eb Informacionit\u201d, nga Grupi i Auditimit i p\u00ebrb\u00ebr\u00eb
  nga:\\n\\n1. Brunilda Zeneli, P\u00ebrgjegj\u00ebse Grupi\\n2. Elira Cukalla, Audituese
  e Lart\u00eb\\n3. Benard Haka, Auditues i Par\u00eb\\n4. Bledi Dervishaj, Auditues
  i Par\u00eb\\n\\na. Objektivat dhe q\u00ebllimi:\\nObjekti i Auditimit TIK ushtruar
  n\u00eb QKB, \u00ebsht\u00eb p\u00ebrcaktimi n\u00ebse objektivat e subjektit arrihen
  n\u00eb m\u00ebnyr\u00eb efektive duke p\u00ebrdorur burimet TIK, duke p\u00ebrfshir\u00eb
  pajtueshm\u00ebrin\u00eb me k\u00ebrkesat ligjore dhe rregullatore, konfidencialitetin,
  integritetin si dhe disponueshm\u00ebrin\u00eb e sistemeve t\u00eb informacionit
  dhe t\u00eb dh\u00ebnav\u00eb q\u00eb gjenden n\u00eb t\u00eb.\\n\\nQ\u00ebllimi
  i Auditimit TIK, \u00ebsht\u00eb dh\u00ebnja e opinionit apo vler\u00ebsimi n\u00ebse
  menaxhimi i lart\u00eb drejton, vler\u00ebson dhe monitoron n\u00eb m\u00ebnyr\u00eb
  efektive kontrollet dhe mekanizmat e duhur me q\u00ebllim krijuimin, mir\u00ebmbajtjen,
  zhvillimin e burimeve TIK dhe funksioneve p\u00ebr t\u00eb cilat k\u00ebto burime
  sh\u00ebrbejn\u00eb. Vler\u00ebsimin n\u00ebse t\u00eb dh\u00ebn\u00ebt jan\u00eb
  t\u00eb sigura kundrejt keqp\u00ebrdorimeve.\\n\\nObjektivat e k\u00ebtij projekt
  auditimi, u vendos\u00ebn n\u00eb koherenc\u00eb me veprimtarin\u00eb, vizionin,
  q\u00ebllimin dhe objektivat e QKB, duke marr\u00eb n\u00eb konsiderat\u00eb t\u00eb
  gjith\u00eb kuadrin rregullativ n\u00eb baz\u00eb t\u00eb t\u00eb cilit QKB zhvillon
  veprimtarin\u00eb e saj. P\u00ebr t\u00eb arritur n\u00eb dh\u00ebnien e nj\u00eb
  opinioni me nj\u00eb siguri t\u00eb arsyeshme, \u00ebsht\u00eb mbledhur informacion,
  t\u00eb dh\u00ebna dhe prova, p\u00ebr t\u00eb p\u00ebrcaktuar n\u00ebse ky sistem
  mbron asetat, ruan integritetin e t\u00eb dh\u00ebnav\u00eb, lejon q\u00eb synimet
  e subjektit q\u00eb auditohet t\u00eb arrihen n\u00eb m\u00ebnyr\u00eb efektive
  dhe p\u00ebrdor burimet n\u00eb m\u00ebnyr\u00eb eficente.\\n\\nb. Identifikimi
  i \u00e7\u00ebshtjeve:\\nNisur nga r\u00ebnd\u00ebsia e t\u00eb dh\u00ebnave t\u00eb
  Regjistrit Elektronik Tregtar dhe Regjistrit Elektronik t\u00eb Lejeve dhe Licencave
  si dhe funksionaliteti i QKB n\u00ebp\u00ebrmjet teknologjis\u00eb me q\u00ebllim
  garantimin dhe vazhdueshm\u00ebrin\u00eb e ofrimit t\u00eb sh\u00ebrbimeve online,
  fokusi i auditimit ishte n\u00eb:\\n\\n1. \u201cAuditimi i Marr\u00ebveshjeve t\u00eb
  Nivelit t\u00eb Sh\u00ebrbimit (MNSH)\u201d\\n2. \u201cAuditimi i Operacioneve n\u00eb
  TIK\u201d;\\n3. \u201cAuditimi i Siguris\u00eb s\u00eb Informacionit\u201d\\n4.
  \u201cVerifikim i kontolleve t\u00eb aplikacioneve p\u00ebr t\u00eb dh\u00ebnat
  Input/Output dhe shkalla e siguris\u00eb s\u00eb p\u00ebrdoruesve\u201d.\\n\\nc.
  P\u00ebrgjegj\u00ebsit\u00eb e strukturave drejtuese:\\nQendra Komb\u00ebtare e
  Biznesit, bazuar n\u00eb ligjin nr. 131/2015 \u201cP\u00ebr Qendr\u00ebn Komb\u00ebtare
  t\u00eb Biznesit\u201d nen\u00eb 3, ka p\u00ebrgjegj\u00ebsi:\\n\\n- t\u00eb mbaj
  regjistrin tregtar, n\u00eb p\u00ebrpunje me ligjin q\u00eb rregullon regjistrimin
  e biznesit;\\n- t\u00eb kryej\u00eb regjistrimet n\u00eb regjistrin tregtar, n\u00eb
  p\u00ebrpunje me dispozitat e ligjit q\u00eb rregullon regjistrimin e biznesit;\\n-
  t\u00eb kryej\u00eb regjistrimin e subjekteve t\u00eb p\u00ebrcaktuara n\u00eb ligjin
  q\u00eb rregullon regjistrimin e biznesit, p\u00ebr q\u00ebllim t\u00eb regjistrimit
  fiskal, t\u00eb sigurimeve shoq\u00ebrore e sh\u00ebndet\u00ebsore, si dhe t\u00eb
  inspektimit t\u00eb marr\u00ebdh\u00ebnieve t\u00eb pun\u00ebs;\\n\\n- t\u00eb l\u00ebshoj\u00eb
  certifikata, ekstrakte t\u00eb regjistrimeve dhe kopje t\u00eb v\u00ebrtetuar\u00eb
  t\u00eb akteve t\u00eb depozituar, sipas p\u00ebrcaktimit t\u00eb ligjit q\u00eb
  rregullon regjistrimin e biznesit;\\n- t\u00eb publikoj\u00eb t\u00eb dh\u00ebnat
  t\u00eb regjistruara, sipas ligjit q\u00eb rregullon regjistrimin e biznesit, si
  dhe siguron aksesin e lir\u00eb t\u00eb publikut n\u00eb to;\\n- trajton procedurat
  e licencimit, t\u00eb autorizimit apo t\u00eb lejeve, t\u00eb ndryshimit dhe revokimit
  t\u00eb tyre, sipas ligjit q\u00eb rregullon licencat, autorizimet dhe lejet;\\n-
  t\u00eb mbaj\u00eb dhe administrojn Regjistrin Komb\u00ebtar t\u00eb Licencave,
  Autorizimeve dhe Lejeve, n\u00eb p\u00ebrputhje me ligjin q\u00eb rregullon licencat,
  autorizimet dhe lejet;\\n- t\u00eb siguroj\u00eb aksesin e lir\u00eb t\u00eb publikut
  n\u00eb Regjistrin Komb\u00ebtar t\u00eb Licencave, Autorizimeve dhe Lejeve, n\u00eb
  p\u00ebrputhje me ligjin q\u00eb rregullon licencat, autorizimet dhe lejet;\\n-
  t\u00eb informoj\u00eb dhe k\u00ebshillon personat e interesuar p\u00ebr procedurat
  e regjistrimit t\u00eb biznesit, si dhe procedurat e licencimit, autorizimit e lejitit;\\n-
  t\u00eb jap mendim p\u00ebr \u00e7do nism\u00eb ligjore apo n\u00ebnligjore n\u00eb
  fush\u00ebn e regjistrimit t\u00eb biznesit dhe t\u00eb licencave, autorizimeve
  e lejeve;\\n- t\u00eb kryej\u00eb studime p\u00ebr cil\u00ebsin\u00eb e mjedisit
  rregulator, mb\u00ebshtet me informacion, analiza e k\u00ebshilla ministrin, K\u00ebshillin
  e Ministrave apo institucionet qendrore dhe t\u00eb pavurura, n\u00eb lidhje me
  nismat e tyre normative dhe organizative n\u00eb fush\u00ebn e regjistrimit t\u00eb
  biznesit dhe t\u00eb licencave, autorizimeve e lejeve, si dhe asiston n\u00eb p\u00ebrgatitjen
  e politikave p\u00ebr p\u00ebrmir\u00ebsimin e mjedisit rregulator n\u00eb k\u00ebto
  fusha.\\n\\nd. P\u00ebrgjegj\u00ebsi dhe audituesve:\\nKontrolli i Lart\u00eb i
  Shtetit auditoi QKB, mbi periudh\u00ebn e veprimtaris\u00eb nga 01.01.2017 deri
  n\u00eb 31.12.2017, duke i kushtuar v\u00ebmendje \u00e7\u00ebshtjeve q\u00eb lidhen
  me zbatimin e ligjshm\u00ebris\u00eb dhe rregullshm\u00ebris\u00eb si dhe standardeve
  nd\u00ebrkom\u00ebtare t\u00eb teknologjis\u00eb dhe auditimit TIK. Nga Grupi i
  auditimit, me p\u00ebrgjegj\u00ebsi t\u00eb plot\u00eb, jan\u00eb analizuar t\u00eb
  gjitha \u00e7\u00ebshtjet q\u00eb p\u00ebrmban Programi i Auditimit nr. 550/2, dat\u00eb
  30.05.2018, miratuar nga Kryetari i Kontrollit t\u00eb Lart\u00eb t\u00eb Shtetit.
  N\u00eb realizimin e k\u00ebtij Projekt Auditimi, Grupi i auditimit \u00ebsht\u00eb
  mb\u00ebshtetur n\u00eb baz\u00ebn ligjore mbi t\u00eb cil\u00ebn funksionon KLSH,
  standardet e auditimit, legjislacionin e fush\u00ebs n\u00eb t\u00eb cil\u00ebn
  operon QKB. Gjithashtu, gjat\u00eb veprimtaris\u00eb audituese, \u00ebsht\u00eb
  siguruar nj\u00eb evidenc\u00eb e p\u00ebrshtatshme, e mjaftueshme dhe e besueshme
  auditimi, n\u00eb t\u00eb cil\u00ebn jemi mb\u00ebshtetur n\u00eb dh\u00ebnien e
  konkluzioneve dhe rekomandimeve.\\n\\ne. Kriteret e vler\u00ebsimit:\\nVler\u00ebsimi
  n\u00eb lidhje me konkluzionet \u00ebsht\u00eb bazuar n\u00eb ligjet, rregulloret
  n\u00eb fuqi, standardet e p\u00ebrcaktuara nga AKSHI, si dhe praktikat m\u00eb
  t\u00eb mira mb\u00ebshtetur n\u00eb Standardet Komb\u00ebtare dhe Nd\u00ebrkom\u00ebtare
  t\u00eb Auditimit, si m\u00eb posht\u00eb:\\n- Standardet Nd\u00ebrkom\u00ebtare
  t\u00eb Auditimit (ISSAI) t\u00eb INTOSAI-t.\\n- Standardet Nd\u00ebrkom\u00ebtare
  t\u00eb Auditimit (ISA) t\u00eb IFAC\\n- Kushtetuta dhe Ligji nr. 154/2014 \u201cMbi
  Organizimin dhe Funksionimin e Kontrollit t\u00eb Lart\u00eb t\u00eb Shtetit\u201d;\\n-
  Manuali i Auditimit t\u00eb Teknologjis\u00eb s\u00eb Informacionit;\\n- Ligji nr.
  10296, dat\u00eb 08.07.2010 \u201cP\u00ebr Menaxhimin Financiar dhe Kontrollin\u201d,
  i ndryshuar dhe aktet ligjore n\u00eb zbatim t\u00eb tij, Ligjet p\u00ebr zbatimin
  e buxhetit t\u00eb shtetit dhe aktet ligjore n\u00eb zbatim t\u00eb tij, Legjislacioni
  mbi Krimin Kibernetik;\\n- Ligji Nr. 9918, dat\u00eb 19.05.2008, \u201cP\u00ebr
  Komunikimet Elektronike n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d.\\n\\n-
  Ligji Nr. 10 325, dat\u00eb 23.09.2010, \u201cP\u00ebr Bazat e t\u00eb Dh\u00ebnave
  Shtet\u00ebrore\u201d,\\n- Ligji nr. 7961, dat\u00eb 12.07.1995 \u201cKodi i Pun\u00ebs
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb\u201d, i ndryshuar\\n- Ligji nr.
  131/2015, dat\u00eb 26.11.2015 \u201dP\u00ebr qendr\u00ebn Komb\u00ebtare t\u00eb
  Biznesit\u201d\\n- Ligji nr. 9723, dat\u00eb 03.05.2007 \u201cP\u00ebr qendr\u00ebn
  Komb\u00ebtare t\u00eb Regjistrit\u201d, i ndryshuar\\n- Ligji nr. 9920, dat\u00eb
  19.5.2008 \u201cP\u00ebr procedurat tatimore n\u00eb republik\u00ebn e Shqip\u00ebris\u00eb\u201d\\n-
  VKM nr. 179, dat\u00eb 09.03.2016 \u201cP\u00ebr miratimin e Statutit t\u00eb Qendr\u00ebs
  Komb\u00ebtare t\u00eb Biznesit\u201d\\n- VKM nr. 710, dat\u00eb 21.08.2013, i ndryshuar
  \u201cP\u00ebr krijuimin dhe funksionimin e sistemeve t\u00eb ruajtjes s\u00eb informacionit,
  vazhdueshm\u00ebris\u00eb s\u00eb pun\u00ebs dhe marr\u00ebveshjeve t\u00eb nivelit
  t\u00eb sh\u00ebrbimit\u201d\\n- VKM nr. 391, dat\u00eb 03.05.2017 \u201cP\u00ebr
  p\u00ebrcaktimin e procedurave t\u00eb regjistrimit dhe t\u00eb publikimit n\u00eb
  qendr\u00ebn komb\u00ebtare t\u00eb biznesit\u201d\\n- VKM nr. 945, dat\u00eb 02.11.2012,
  \u201cP\u00ebr miratimin e rregullores administrimi i sistemit t\u00eb bazave t\u00eb
  t\u00eb dh\u00ebnave shtet\u00ebrore\u201d\\n- Ligji Nr. 9887, dat\u00eb 10.03.2008,
  ndryshuar me ligjin nr. 48/2012 \u201cP\u00ebr Mbrotjen e t\u00eb Dh\u00ebnave Personale\u201d,\\n-
  Udh\u00ebzimi nr. 30, dat\u00eb 27.12.2011 \u201cP\u00ebr menaxhimin e aktiveve
  n\u00eb nj\u00ebsit\u00eb e sektorit publik\u201d\\nRregulloret p\u00ebrkat\u00ebse
  t\u00eb Agjencis\u00eb Komb\u00ebtare t\u00eb Shoq\u00ebris\u00eb s\u00eb Informacionit,\\n-
  Udh\u00ebzimi nr. 1159 dat\u00eb 17.03.2014, i ndryshuar \u201cP\u00ebr hartimin
  e marr\u00ebveshjes t\u00eb Nivelit t\u00eb Sh\u00ebrbimit\u201d\\n- Standardet
  TIK\\n- Akte t\u00eb tjera ligjore apo n\u00ebnligjore q\u00eb do t\u00eb jen\u00eb
  t\u00eb nevojshme gjat\u00eb auditimit\\n\\nf. Standardet e auditimit:\\nAuditimi
  \u00ebsht\u00eb kryer, n\u00eb p\u00ebrputhje me Kodin Etik, Standardet, dhe teknika
  auditimi, duke p\u00ebrfshir\u00eb pyet\u00ebsor\u00eb, intervista, testime dhe
  procedura, t\u00eb cilat u gjykuan se ishin t\u00eb nevojshme, p\u00ebr t\u00eb
  dh\u00ebn\u00eb nj\u00eb vler\u00ebsim sa m\u00eb objektiv, profesional e t\u00eb
  pavarur, t\u00eb sakt\u00eb, t\u00eb plot\u00eb e t\u00eb qart\u00eb, duke u fokusuar
  ve\u00e7an\u00ebrisht n\u00eb standardet e fush\u00ebs s\u00eb auditimit t\u00eb
  TIK, si: COBIT 4.1, Manuali i Auditimit IT, ISSAI 5310, etj.\\n\\nIII. P\u00cbRSHKRIMI
  I AUDITIMIT\\n\\nQendra Komb\u00ebtare e Biznesit n\u00eb vijim (QKB) \u00ebsht\u00eb
  institucion n\u00eb var\u00ebsi t\u00eb Ministrit t\u00eb Financave dhe Ekonomis\u00eb,
  i krijuar n\u00eb baz\u00eb t\u00eb Ligjit nr. 131/2015 \u201cP\u00ebr Qendr\u00ebn
  Komb\u00ebtare t\u00eb Biznesit\u201d, si rezultat i bashkimit t\u00eb dy institucioneve,
  Qendr\u00ebs Komb\u00ebtare t\u00eb Licencimit dhe Qendr\u00ebs Komb\u00ebtare t\u00eb
  Regjistrimit.\\n\\nQKB \u00ebsht\u00eb institucioni i vetm\u00eb p\u00ebr gjegj\u00ebs
  p\u00ebr regjistrimin e biznesit dhe t\u00eb lejeve/licencimit dhe autorizimeve
  n\u00eb Shqip\u00ebri dhe sh\u00ebrben si sportel me nj\u00eb ndales\u00eb ku kryhen
  t\u00eb gjitha proceset e regjistrimit, lejeve, licencimit dhe autorizimeve t\u00eb
  biznesit, duke p\u00ebrfshir\u00eb dhe regjistrimin p\u00ebr efekt t\u00eb taksave
  n\u00eb nivel komb\u00ebtar dhe vendor, sigurimin sh\u00ebndet\u00ebsor e shoq\u00ebror
  dhe inspektoratin e pun\u00ebs, leje, licencave dhe autorizimeve p\u00ebr kategori
  t\u00eb ndryshme.\\n\\nAktualisht, QKB-ja e zhvillon aktivitetin e saj n\u00eb 34
  sporte t\u00eb nj\u00ebjt\u00eb territorin e Republik\u00ebs s\u00eb Shqip\u00ebris\u00eb,
  n\u00eb t\u00eb cilat sh\u00ebrbejn\u00eb 75 punonj\u00ebs me detyra dhe p\u00ebrshtkime
  pune t\u00eb nj\u00ebjt\u00eb me ato t\u00eb zyr\u00ebs qendrore. Sportelet prit\u00ebse
  t\u00eb biznesit n\u00eb rrethe jan\u00eb t\u00eb vendosura pran\u00eb Bashkive
  dhe Komunave si dhe n\u00eb Dhomat e Tregtis\u00eb. T\u00eb gjitha aplikimet e kryera
  nga biznesi procesohen nga struktura e regjistrimit e vendosur n\u00eb zyr\u00ebn
  qendrore n\u00eb Tiran\u00eb.\\n\\nQKB-ja, funksionon n\u00eb baz\u00eb t\u00eb
  nj\u00eb sistemi elektronik t\u00eb integruar t\u00eb dh\u00ebnash q\u00eb realizon
  lidhjen nd\u00ebrmjet sporteleve t\u00eb sh\u00ebrbimit n\u00eb rrethe me zyr\u00ebn
  qendrore t\u00eb QKB-s\u00eb n\u00eb Tiran\u00eb. Sistemi i regjistrimit u krijon
  mund\u00ebsin\u00eb bizneseve t\u00eb regjistrohen brenda 24 or\u00ebve dhe koordinon
  t\u00eb dh\u00ebnat duke ju dh\u00ebn\u00eb mund\u00ebsin\u00eb subjekteve t\u00eb
  interesuara t\u00eb informohen n\u00eb koh\u00eb reale, p\u00ebr sa i p\u00ebrket
  statusit t\u00eb aplikimit t\u00eb tyre. Sistemi n\u00eb fjal\u00eb \u00ebsht\u00eb
  baz\u00eb t\u00eb dh\u00ebnash shtet\u00ebrore dhe \u00ebsht\u00eb i regjistruar
  pran\u00eb ARK me nivel sigurie L-D3I1K0.\\n\\nIV. GJETJE DHE REKOMANDIME\\n\\nN\u00eb
  zbatim t\u00eb programit t\u00eb auditimit nr. 550/2, dat\u00eb 30.05.2018, t\u00eb
  miratuar nga Kryetari i Kontrollit t\u00eb Lart\u00eb t\u00eb Shtetit, si dhe pas
  ndarjes s\u00eb detyrave p\u00ebr secilin an\u00ebtar t\u00eb Grupit t\u00eb auditimit,
  miratuar nga Drejtori i Drejtoris\u00eb, nga Grupi i auditimit, u audituan 4 pikat
  e programit, si m\u00eb posht\u00eb:\\n\\nPika 1. \u201cAuditimi i Marr\u00ebveshjeve
  t\u00eb Nivelit t\u00eb Sh\u00ebrbimit\u201d\\n\\nGjat\u00eb periudh\u00ebs objekt
  auditimi, n\u00eb Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit \u00ebsht\u00eb kryer
  zbatimi i 4 kontratave \u201cMarr\u00ebveshje t\u00eb Nivelit t\u00eb Sh\u00ebrbimit\u201d
  MNSH, nga t\u00eb cilat jan\u00eb audituar 4 prej tyre si m\u00eb posht\u00eb:\\n\\n|
  Nr | Em\u00ebrtime                  | Lidhja e Kontrat\u00ebs | Nd\u00ebrtim sistemi
  (Vlera) | Mir\u00ebmbajtja (Afati) | Mir\u00ebmbajtja Totale | Vjetore |\\n|----|---------------------------|--------------------|-------------------------|---------------------|-------------------|--------|\\n|
  1  | MNSH-OKR                  | 08.09.2016         |                         |
  3-Vjet              | 48,630,000        | 16,210,000 |\\n| 2  | MNSH-OKL                  |
  01.10.2014         |                         | 4-Vjet              | 26,114,000        |
  6,528,500  |\\n| 3  | MNSH-Bashkimi nd\u00ebrkufitar | 29.12.2016         | 28,583,330              |
  4-Vjet              | 13,066,560        | 3,266,640  |\\n| 4  | MNSH-Paperless (QKB-NJQV-AKU)
  | 30.06.2016       | 18,700,000              | 4-Vjet              | 11,136,000        |
  2,784,000  |\\n| 5  | Totali (pa TVSH)          |                    |                         |                     |
  98,946,560        | 28,789,140 |\\n\\nMbi lidhjen e kontratave.\\n\\n- Nga auditimi
  ka rezultuar se kontratat e m\u00ebsip\u00ebrme jan\u00eb lidhur bazuar n\u00eb
  VKM nr. 710, dat\u00eb 21.08.2013 \u201cP\u00ebr krijin dhe funksionimin e sistemeve
  t\u00eb ruajtjes s\u00eb informacionit, vazhdueshm\u00ebris\u00eb s\u00eb pun\u00ebs
  dhe marr\u00ebveshjeve t\u00eb nivelit t\u00eb sh\u00ebrbimit\u201d i ndryshuar
  pika 2 ku cil\u00ebsohet:\\n\\n\u00c7do institucion, i cili ka ose do t\u00eb zhvilloj\u00eb
  nj\u00eb sistem n\u00eb fush\u00ebn e teknologjis\u00eb s\u00eb informacionit, q\u00eb
  ofron sh\u00ebrbime p\u00ebr qytetar\u00ebt, p\u00ebr biznesin dhe p\u00ebr nd\u00ebrveprim
  e shk\u00ebmbim informacioni p\u00ebr administrat\u00ebn publike n\u00ebp\u00ebrmjet
  sistemeve elektronike, duhet t\u00eb parashikoj\u00eb dhe t\u00eb hartoj\u00eb marr\u00ebveshje
  kontraktuale mbi nivelin e sh\u00ebrbimit (Service Level Agreement - SLA).\\n\\nKjo
  marr\u00ebveshje, n\u00ebnshkruhet nd\u00ebrmjet institucionit publik dhe ofruesit
  t\u00eb sh\u00ebrbimit t\u00eb TIK-ut dhe hartohet sipas udh\u00ebzimeve t\u00eb
  nxjerra nga ministri p\u00ebr \u00e7\u00ebshtjet e teknologjis\u00eb s\u00eb informacionit.
  Institucionet:\\n\\na) t\u00eb cilat jan\u00eb duke zhvilluar sisteme t\u00eb reja
  n\u00eb fush\u00ebn e teknologjis\u00eb s\u00eb informacionit, duhet t\u00eb parashikojn\u00eb
  k\u00ebt\u00eb marr\u00ebveshje, p\u00ebr mir\u00ebmbajtjen e k\u00ebtyre sistemeve.
  Koh\u00ebzgjatja e k\u00ebsaj marr\u00ebveshje duhet t\u00eb jet\u00eb jo m\u00eb
  e shkurt\u00ebr se 4 (kat\u00ebr) vjet.\\n\\nb) t\u00eb cilat jan\u00eb permiresime
  sistemeve ekzistuese n\u00eb fush\u00ebn e teknologjis\u00eb s\u00eb informacionit,
  duhet t\u00eb parashikojn\u00eb k\u00ebt\u00eb marr\u00ebveshje, p\u00ebr mir\u00ebmbajtjen
  e k\u00ebtyre sistemeve. Koh\u00ebzgjatja e k\u00ebsaj marr\u00ebveshje duhet t\u00eb
  jet\u00eb jo m\u00eb e shkurt\u00ebr se 2 (dy) vjet.\\n\\nc) Duhet, p\u00ebr \u00e7do
  procedur\u00eb prokurimi mbi investimet p\u00ebr sisteme ose sh\u00ebrbime t\u00eb
  teknologjis\u00eb s\u00eb informacionit, k\u00ebt\u00eb marr\u00ebveshje t\u2019ia
  bashk\u00eblidhin si aneks, kontrat\u00ebs administrative t\u00eb lidhur nd\u00ebrmjet
  pal\u00ebve.\\n\\n-Kontrata MNSH (Anekset bashk\u00ebngjitur), jan\u00eb b\u00ebr\u00eb
  n\u00eb p\u00ebrputhje me Udh\u00ebzimin nr. 1159, dat\u00eb 17.03.2014 \u201cP\u00ebr
  hartimin e Marr\u00ebveshjes s\u00eb \u201cNivelit t\u00eb Sh\u00ebrbimit\u201d,
  duke patur si pjes\u00eb p\u00ebrber\u00ebse t\u00eb saj gjith\u00eb element\u00ebt
  e p\u00ebrcaktuar n\u00eb \u201cAneksi 1\u201d, si dhe me Udh\u00ebzimin nr. 2,
  dat\u00eb 02.09.2013 \u201cP\u00ebr standardizimin e hartimit t\u00eb termave t\u00eb
  referenc\u00ebs p\u00ebr projektet TIK n\u00eb Administrat\u00ebn Publike\u201d
  pjesa III pika 10 Aneksi 2.\\n\\n- Kontratat jan\u00eb lidhur n\u00eb p\u00ebrputhje
  me kriteret e p\u00ebrcaktuara n\u00eb DT dhe Termat e referenc\u00ebs, n\u00eb
  zbatim t\u00eb LPP-n\u00eb, nen 60 \u201cRregullat q\u00eb zbatohen p\u00ebr kontrat\u00ebn\u201d,
  pika 1 cil\u00ebsohet:\\n\\nKushtet e kontrat\u00ebs, t\u00eb lidhur sipas k\u00ebtij
  ligji, nuk ndryshojn\u00eb nga ato t\u00eb p\u00ebrshtruar n\u00eb dokumentet e
  tenderit dhe n\u00eb ofert\u00ebn fituese.\\n\\n1. \u201cMarr\u00ebveshje e Nivelit
  t\u00eb Sh\u00ebrbimit\u201d me objekt \u201cKrijimi i moduleve t\u00eb reja dhe
  raportimeve p\u00ebr Formular\u00ebt e Bashkimit Nd\u00ebrkuftar n\u00eb sistemin
  e QKB-s\u00eb dhe aplikimet online p\u00ebr Bashkimin Nd\u00ebrkuftar dhe sh\u00ebrbimeve
  t\u00eb tjera\u201d.\\n\\n- P\u00ebr periudh\u00ebn objekt auditimi n\u00eb subjektin
  e audituar QKB, \u00ebsht\u00eb n\u00eb proces zbatimi kontrata \u201cMarr\u00ebveshje
  e Nivelit t\u00eb Sh\u00ebrbimit\u201d nr. 11807/1, dat\u00eb 16.01.2017 me objekt
  \u201cMir\u00ebmbajtje p\u00ebr nj\u00eb periudh\u00eb 4 vje\u00e7are e sh\u00ebrbimeve
  t\u00eb zhvilluara nga Kontraktuesi n\u00eb p\u00ebrputhje me Kontrat\u00ebn nr.
  11807, dat\u00eb 29.12.2016 me objekt \u201cKrijimi i moduleve t\u00eb reja dhe
  raportimeve p\u00ebr Formular\u00ebt e Bashkimit Nd\u00ebrkuftar n\u00eb sistemin
  e QKB-s\u00eb dhe aplikimet online p\u00ebr Bashkimin Nd\u00ebrkuftar dhe sh\u00ebrbimeve
  t\u00eb tjera\u201d\u201d, me vler\u00eb sh\u00ebrbimi n\u00eb shum\u00ebn 34,299,996
  lek\u00eb me tvsh dhe vler\u00eb mir\u00ebmbajtje n\u00eb shum\u00ebn 15,679,872
  lek\u00eb (ose n\u00eb mas\u00ebn 45.7 % t\u00eb vler\u00ebs s\u00eb krijuimit t\u00eb
  moduleve), t\u00eb lidhur mes pal\u00ebve Qendra Komb\u00ebtare e Biznesit (Autoriteti
  Kontraktor) dhe Bashkimi i Operator\u00ebve Ekonomik\u00eb (BOE). Vlera mujore e
  sh\u00ebrbimit 326,664 lek\u00eb me tvsh dhe 272,220 lek\u00eb pa tvsh.\\n- Sh\u00ebrbimi
  i ofruar nga QKB \u201cKrijimi i moduleve t\u00eb reja dhe raportimeve p\u00ebr
  Formular\u00ebt e Bashkimit Nd\u00ebrkuftar n\u00eb sistemin e QKB-s\u00eb dhe aplikimet
  online p\u00ebr Bashkimin Nd\u00ebrkuftar dhe sh\u00ebrbimeve t\u00eb tjera\u201d,
  sipas QKB-s\u00eb \u00ebsht\u00eb iniciuar n\u00eb zbatim t\u00eb ligjit nr. 110/2012
  dat\u00eb 15.11.2012 \u201cP\u00ebr bashkimin nd\u00ebrkuftar t\u00eb shoq\u00ebrive
  tregtare\u201d.\\nQ\u00ebllimi i k\u00ebtij ligji \u00ebsht\u00eb p\u00ebrcaktimi
  i kushteve, procedurave dhe pasojave juridike t\u00eb nj\u00eb bashkimi nd\u00ebrkuftar
  nd\u00ebrmjet shoq\u00ebrive shqiptare dhe shoq\u00ebrive evropiane, si dhe parashikimi
  i masave mbrojt\u00ebse p\u00ebr pun\u00ebmarr\u00ebsit dhe kreditor\u00ebt e k\u00ebtyre
  shoq\u00ebrive. N\u00eb nenin 8 \u201cPublikimi\u201d t\u00eb k\u00ebtij ligji,
  pika 3 cil\u00ebsohet:\\n\\nMinistria, n\u00eb p\u00ebrputhje me k\u00ebrkesat e
  parashikimeve t\u00eb ligjit q\u00eb rregullon organizimin dhe funksionimin e Qendr\u00ebs
  Komb\u00ebtare t\u00eb Regjistrimit, miraton formatin dhe p\u00ebrmbajtjen e dokumenteve
  t\u00eb nevojshme p\u00ebr kryerjen e aplikimeve dhe regjistrimeve, sipas k\u00ebtij
  nen.\\n\\nMbi zbatimin e kontrat\u00ebs.\\nSipas Kushteve t\u00eb ve\u00e7anta t\u00eb
  kontrat\u00ebs, nenit 3 \u201cFillimi i kontrat\u00ebs\u201d, rezulton se fillimi
  i procesit t\u00eb mir\u00ebmbajtjes fillon n\u00eb muajin e 6-t\u00eb, nga lidhja
  e k\u00ebsaj kontrate ku periudha 5 mujore \u00ebsht\u00eb afati p\u00ebr krijuimin
  e moduleve (Janar-Maj 2017) dhe Qershor 2017-2021, ofrimi e sh\u00ebrbimit t\u00eb
  mir\u00ebmbajtjes.\\nN\u00eb zbatim t\u00eb pik\u00ebs 1 \u201cAuditimi i Marr\u00ebveshjeve
  t\u00eb Nivelit t\u00eb Sh\u00ebrbimit (MNSH)\u201d t\u00eb programit t\u00eb auditimit
  u shqyrtua dokumentacioni si m\u00eb posht\u00eb:\\n- Termat e referenc\u00ebs t\u00eb
  miratuara nga AKSHI, pjes\u00eb e DT;\\n- Kriteret e ve\u00e7anta p\u00ebr kualifikim;\\n-
  Kontrata e lidhur mes pal\u00ebve dhe anekset e saj;\\n- Raportet e monitorimit;\\n-
  Faturat tatimore t\u00eb likuidimit t\u00eb vlerave mujore p\u00ebr sh\u00ebrbimin
  e kryer.\\nP\u00ebr zbatimin e k\u00ebsaj kontrate jan\u00eb ngarkuar:\\n- Urdh\u00ebr
  nr. 2, dat\u00eb 06.01.2017 \u201cP\u00ebr ngritjen e Grupit t\u00eb Pun\u00ebs
  p\u00ebr ndjekjen dhe zbatimin e Kontrat\u00ebs nr. 11807, dat\u00eb 29.12.2016\u201d\\n\\n-
  Urdh\u00ebr nr. 29, dat\u00eb 09.05.2017 \u201cP\u00ebr ndryshim n\u00eb urdhrin
  nr. 2, dat\u00eb 06.01.2017\u201d \u00ebsht\u00eb caktuar grupi\\n- Urdh\u00ebr
  nr. 23, dat\u00eb 23.05.2017 \u201cP\u00ebr ndryshim n\u00eb urdhrin nr. 2, dat\u00eb
  06.01.2017\u201d\\nNga auditimi \u00ebsht\u00eb evidentuar se, Raportet e Monitorimit,
  p\u00ebr mir\u00ebmbajtjen e sistemit n\u00eb periudh\u00ebn Qershor-Dhjetor 2017,
  jan\u00eb n\u00ebnshkruar\\n\\nNga auditimi u konstatua:\\n\\n1. Titulli i gjetjes:
  \u201cMbi dokumentimin e matjes s\u00eb cil\u00ebsis\u00eb s\u00eb sh\u00ebrbimit
  nga ana e AK\u201d.\\n\\nSituata: Nga auditimi ka rezultuar se nga Komisioni p\u00ebrgjegj\u00ebs
  p\u00ebr monitorimin dhe zbatimin e k\u00ebsaj kontrate nuk \u00ebsht\u00eb dokumentuar
  kryerja e matjeve n\u00eb lidhje me disponueshm\u00ebrin\u00eb e sh\u00ebrbimit;
  n\u00eb lidhje me shpejt\u00ebsin\u00eb e transmetimit t\u00eb t\u00eb dh\u00ebnave,
  koh\u00ebs s\u00eb p\u00ebrgjigjeve, si dhe cil\u00ebsin\u00eb e sh\u00ebrbimit.
  Nga grupi i pun\u00ebs nuk u paraqit asnj\u00eb dokument, apo e dh\u00ebn\u00eb
  n\u00eb forma t\u00eb ndryshme, ku t\u00eb v\u00ebrtetohej se nga Grupi i pun\u00ebs
  \u00ebsht\u00eb p\u00ebrmbushur k\u00ebrkes\u00eb e nenit 9 t\u00eb MNSH-s\u00eb.\\n\\nKriteri:
  Ky veprim \u00ebsht\u00eb n\u00eb kund\u00ebrshtim me MNSH, pika 9 \u201cMatja e
  cil\u00ebsis\u00eb s\u00eb sh\u00ebrbimit\u201d ku cil\u00ebsohet:\\n\\n\u201cN\u00eb
  m\u00ebnyr\u00eb q\u00eb t\u00eb arrihet ofrimi optimal i sh\u00ebrbimit t\u00eb
  mir\u00ebmbajtjes AK do t\u00eb realizoj\u00eb matjet p\u00ebrkat\u00ebse lidhur
  me:\\n- disponueshm\u00ebrin\u00eb, sa \u00ebsht\u00eb % e disponueshm\u00ebris\u00eb
  s\u00eb sh\u00ebrbimit online;\\n- performanc\u00ebn e sistemit, shpejt\u00ebsia
  e transmetimit t\u00eb t\u00eb dh\u00ebnave, koha e p\u00ebrgjigjes etj;\\n- cil\u00ebsin\u00eb
  e sh\u00ebrbimit (numri i fikjeve t\u00eb planifikuara, anketimi i p\u00ebrdoruesve
  etj.);\\nN\u00eb rast se nga matjet e cil\u00ebsis\u00eb s\u00eb sh\u00ebrbimit
  do t\u00eb rezultojn\u00eb defekte ato do ti komunikohen menj\u00ebher\u00eb Kontraktuesit,
  i cili do ti rregulloj\u00eb sipas afatave kohore t\u00eb p\u00ebrcaktuara n\u00eb
  MNSH.\\n\\nsi dhe me MFK, nenii 4, pika 19 ku cil\u00ebsohet:\\n\\n\u201cGjurma
  e auditimit\u201d p\u00ebrfaq\u00ebson rrjedh\u00ebn e dokumentuar t\u00eb transaksioneve
  financiare dhe t\u00eb transaksioneve t\u00eb tjera, nga fillimi deri n\u00eb p\u00ebrfundim
  t\u00eb tyre, q\u00eb synon t\u00eb rip\u00ebrshtkoj\u00eb t\u00eb gjitha veprimtarit\u00eb
  individuale dhe vendimmarrjen lidhur me to. Ajo p\u00ebrfshtin mbajtjen e dokumentacionit,
  raportimin, kontabilitetin dhe sistemin e mbajtjes s\u00eb dosjeve\u201d.\\n\\nNdikimi/efekti:
  Nuk ka gjurm\u00eb p\u00ebr verifikimin e proceseve t\u00eb mir\u00ebmbajtjes t\u00eb
  kryera nga Kontraktuesi dhe t\u00eb kontrolluara nga AK, gjat\u00eb zbatimit t\u00eb
  kontrat\u00ebs.\\n\\nShkaku: Mosveprim i Grupit t\u00eb pun\u00ebs p\u00ebr monitorimin
  dhe zbatimin e kontrat\u00ebs, n\u00eb p\u00ebrpunhje me k\u00ebrkesat e saj.\\n\\nR\u00ebnd\u00ebsia
  e shkeljes: E mesme\\n\\n2. Titulli i gjetjes: \u201cMbi dokumentimin e monitorimit
  dhe zbatimit t\u00eb kontrat\u00ebs nga AK\u201d.\\n\\nSituata: Nga auditimi ka
  rezultuar se nga Komisioni p\u00ebrgjegj\u00ebs p\u00ebr monitorimin dhe zbatimin
  e k\u00ebsaj kontrate nuk jan\u00eb mbajtur Procesverbale t\u00eb pranimit t\u00eb
  sh\u00ebrbimit.\\n\\nKriteri: Ky veprim \u00ebsht\u00eb n\u00eb kund\u00ebrshtim
  me Kontrat\u00ebn nenii 11.3, ku cil\u00ebsohet: \u201cPranimi do t\u00eb kryhet
  n\u00ebp\u00ebrmjet testimeve t\u00eb pranimit\u201d, si dhe me VKM nr. 914, dat\u00eb
  29.12.2014, nenii 77 \u201cMbik\u00ebqyrja e kontrat\u00ebs\u201d, pika 3 ku cil\u00ebsohet:\\n\\nP\u00ebr
  t\u2019u siguruar n\u00ebse cil\u00ebsia e pun\u00ebve, sh\u00ebrbeimeve ose e mallrave
  \u00ebsht\u00eb e nj\u00ebjt\u00eb me cil\u00ebsin\u00eb p\u00ebr t\u00eb cil\u00ebn
  \u00ebsht\u00eb shpallur fitues kontraktori, autoriteti kontraktor duhet t\u00eb
  monitoroj\u00eb zbatimin e kontrat\u00ebs dhe n\u00eb rast t\u00eb shkeljes s\u00eb
  kushteve t\u00eb k\u00ebrkuara zbaton penalitetet e parashikuara n\u00eb kontrat\u00eb.
  Autoriteti kontraktor, gjat\u00eb kryerjes s\u00eb kontrolleve, mban procesverbal
  me shkrim n\u00eb prani t\u00eb kontraktorit. N\u00eb rast se kontraktori nuk \u00ebsht\u00eb
  i pranish\u00ebm, autoriteti kontraktor ia komunikon me shkrim p\u00ebrmbytjen e
  k\u00ebtij procesverbali\u201d.\\n\\nKomisioni i zbatimit t\u00eb kontrat\u00ebs
  ka vepruar n\u00eb kund\u00ebrshtim me MFK, nenii 4, pika 19 ku cil\u00ebsohet:\\n\\n\\\"Gjurma
