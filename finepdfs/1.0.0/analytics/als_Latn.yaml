  detajimi i t\u00eb ardhurave duke specifikuar: shum\u00ebn e t\u00eb ardhurave q\u00eb
  kandidati i ka financuar vet\u00eb p\u00ebr fushat\u00ebn e saj/tij, shum\u00ebn
  e t\u00eb ardhurave t\u00eb dhuruara nga t\u00eb tret\u00eb n\u00eb para, dhe shum\u00ebn
  e t\u00eb ardhurave t\u00eb dhuruara nga t\u00eb tret\u00eb n\u00eb natyr\u00eb.
  N\u00eb fund t\u00eb ke\u00ebsaj grupkolone \u00ebsht\u00eb totali i t\u00eb ardhurave
  p\u00ebr secilin kandidat.\\n\\nGrup-kolona e dyt\u00eb paraqet detajimin e shpenzimeve,
  sipas z\u00ebrave t\u00eb deklaruar n\u00eb raportin e vet\u00ebdeklarimit t\u00eb
