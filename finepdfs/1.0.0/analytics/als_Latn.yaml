  Ministrave |\\n\\nI. Hyrje\\n\\nDuke mbajtur n\u00eb konsiderat\u00eb rritjen e
  numrit t\u00eb t\u00eb huajve q\u00eb hyn\u00eb n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb
  ku p\u00ebrfshihen t\u00eb huajt q\u00eb vin\u00eb p\u00ebr arsye q\u00ebndrimi,
  kalimi transit, pun\u00ebsimi, studimi dhe refugjat\u00ebt nga vendet e tret\u00eb
  vler\u00ebsojm\u00eb se respektimi i t\u00eb drejtave t\u00eb t\u00eb huajve ka
  marr\u00eb nj\u00eb r\u00ebnd\u00ebsi t\u00eb ve\u00e7ant\u00eb dhe ka sjell\u00eb
  nevoj\u00ebn p\u00ebr nj\u00eb v\u00ebmendje me t\u00eb madhe t\u00eb politikave
  p\u00ebr k\u00ebt\u00eb kategori. Hartimi dhe zbatimi i k\u00ebtyre politikave lidhet
  sa me detyrimet kushtetuese aq edhe me detyrimet e Shqip\u00ebris\u00eb n\u00eb
  kuad\u00ebr t\u00eb an\u00ebtar\u00ebsimit n\u00eb BE dhe l\u00ebvizjes s\u00eb
  lir\u00eb t\u00eb punonj\u00ebsve sipas kapitullit 24.\\n\\nSipas screening report
  p\u00ebr vitin 2023 evidentohet se \u2018n\u00eb fush\u00ebn e migracionit t\u00eb
  ligjsh\u00ebm jan\u00eb t\u00eb nevojshme ndryshime, ve\u00e7an\u00ebrisht p\u00ebr
  t\u00eb p\u00ebrfaqruar disa dispozita mbi bashkimin familjar, me lejen e vetme
  (single permit) dhe me ndryshimet e fundit n\u00eb kart\u00ebn blu t\u00eb BE-s\u00eb.
  Gjithashtu edhe p\u00ebrsa i p\u00ebrket migracionit t\u00eb paligjsh\u00ebm Shqip\u00ebria
  duhet t\u00eb kryej\u00eb p\u00ebrmir\u00ebsimet e nevojshme ve\u00e7an\u00ebrisht
  n\u00eb lidhje me kthimin e migrant\u00ebve t\u00eb paligjsh\u00ebm n\u00eb vendin
  e originis\u00eb\u2019.\u00b9 P\u00ebr t\u00eb huajt n\u00eb pozita t\u00eb cenueshme
  n\u00eb raport evidentohet se Shqip\u00ebria nuk ka ambiente t\u00eb ve\u00e7anta
  p\u00ebr mbajtjen e t\u00eb miturve t\u00eb pashoq\u00ebruar, grave n\u00eb rrezik
  dhe personave me kushte t\u00eb r\u00ebnda mjek\u00ebsore.\\n\\nSipas t\u00eb dh\u00ebnave
  t\u00eb INSTAT numri i t\u00eb huajve me leje q\u00ebndrimi n\u00eb Shqip\u00ebri
  rezultoi 18.151 banor\u00eb nga t\u00eb cil\u00ebt t\u00eb huajt rezident\u00eb
  me origjin\u00eb nga Italia, Kosova dhe Turqia p\u00ebrball\u00ebn numrin m\u00eb
  madh Nd\u00ebrkohe p\u00ebr sa u p\u00ebrket azilk\u00ebrkuar\u00ebsve rezulton
  se kan\u00eb si vende origjine Afganistanin, Ukrain\u00ebn, Sirin\u00eb, Egjiptin
  dhe Tunizin\u00eb. Gjithashtu, vitet e fundit Shqip\u00ebria ka sh\u00ebrbyer si
  vend tranzit p\u00ebr refugjat\u00ebt q\u00eb shkojn\u00eb drejt Bashkimit Evropian.
  T\u00eb drejtat e t\u00eb huajve dhe refugjat\u00ebve marrin r\u00ebnd\u00ebsi t\u00eb
  ve\u00e7ant\u00eb n\u00eb situat\u00ebn aktuale kur shtetet e BE-s\u00eb p\u00ebr
  p\u00ebrballimin e flukseve t\u00eb migrant\u00ebve kan\u00eb nd\u00ebrmarr\u00eb
  masa t\u00eb jasht\u00ebzakonshme si\u00e7 \u00ebsht\u00eb shembulli i protokollit
  mes Shqip\u00ebris\u00eb dhe Italis\u00eb.\\n\\nN\u00eb k\u00ebto kushte kjo analiz\u00eb
  synon t\u00eb sjell\u00eb nj\u00eb panoram\u00eb t\u00eb kuadrat politik dhe ligjor
  n\u00eb Republik\u00ebn e Shqip\u00ebris\u00eb n\u00eb raport me t\u00eb drejt\u00ebn
  nd\u00ebrkombe t\u00ebare, legjislacionin e Bashkimit Evropian dhe p\u00ebrvojat
  e vendeve t\u00eb tjera sa i p\u00ebrket t\u00eb drejtave t\u00eb t\u00eb huajve.
  Kjo analiz\u00eb ka si q\u00ebllim t\u00eb krijoj\u00eb nj\u00eb panoram\u00eb t\u00eb
  qart\u00eb n\u00eb lidhje me t\u00eb drejtat social ekonomike t\u00eb t\u00eb huajve
  n\u00eb vendin ton\u00eb dhe t\u00eb rekomandoj\u00eb p\u00ebrmir\u00ebsimet e nevojshme
  t\u00eb konstatuara.\\n\\n\u00b9 Screening report Albania 2023 https://neighbourhood-enlargement.ec.europa.eu/system/files/2023-07/AL%20Cluster_1%20Draft%20screening%20report_external%20version.pdf
  faqe 88-93\\n\\nII. P\u00ebrmbledhje ekzekutive\\n\\nAnaliza mbi t\u00eb drejtat
  e t\u00eb huajve n\u00eb Shqip\u00ebri vler\u00ebson mekanizmat ligjor\u00eb dhe
  politik\u00eb q\u00eb synojn\u00eb t\u00eb mb\u00ebshtesin integrimin dhe mbrojtjen
  e t\u00eb huajve, p\u00ebrfshir\u00eb grupet vulnerab\u00ebl si refugjat\u00ebt
  dhe azilk\u00ebrkucesit. Sipas legjislatacionit shqiptar, \\\"i huaj\\\" p\u00ebrfaq\u00ebson
  \u00e7do individ q\u00eb nuk \u00ebsht\u00eb shtetas shqiptar, duke p\u00ebrfshir\u00eb
  edhe ata q\u00eb k\u00ebrkojn\u00eb mbrojtje nd\u00ebrkomb\u00ebtare, si emigrant\u00eb,
  migrant\u00eb dhe refugjat\u00eb. Duke qen\u00eb vend kandidat p\u00ebr an\u00ebtar\u00ebsim
  n\u00eb BE, Shqip\u00ebria ka harmonizuar nj\u00eb pjes\u00eb t\u00eb konsiderueshme
  t\u00eb legjislatacionit t\u00eb saj me at\u00eb t\u00eb BE-s\u00eb, p\u00ebrfshir\u00eb
  Direktiva t\u00eb ndryshme. Gjithashtu, marr\u00ebveshjet dypal\u00ebshe dhe rajonale
  me organizata si Frontex kan\u00eb ndihmuar n\u00eb menaxhimin e flukseve migratore
  dhe frenimin e migracionit t\u00eb parregullt.\\n\\nNga ana tjet\u00ebr \u201crefugjat\u201d
  \u00ebsht\u00eb shtetas i huaj ose personi pa shtet\u00ebsi, i cili, p\u00ebr shkak
  t\u00eb frik\u00ebs s\u00eb bazuar t\u00eb persekutimit, p\u00ebr arsy\u00eb t\u00eb
  rac\u00ebs, besimit, komb\u00ebsis\u00eb, an\u00ebtar\u00ebsis\u00eb n\u00eb nj\u00eb
  grup t\u00eb caktuar shoq\u00ebror ose bindjes politike, ndodhet jasht\u00eb vendit
  t\u00eb shtet\u00ebsis\u00eb s\u00eb tij ose jasht\u00eb vendbanimit t\u00eb zakonsh\u00ebm
  t\u00eb m\u00ebparsh\u00ebm dhe nuk ka mund\u00ebsi ose d\u00ebshir\u00eb p\u00ebr
  t\u00eb k\u00ebrkuar mbrojtjen e atij vendi apo kthimin n\u00eb at\u00eb vend, si
  pasoj\u00eb e k\u00ebtyre rr\u00ebthanave, n\u00eb p\u00ebrpunjhe me kriteret e
  nenit 1 (A) t\u00eb Konvent\u00ebs s\u00eb Gjenev\u00ebs. N\u00eb k\u00ebt\u00eb
  kontekst, analizohen mekanizmat ligjor\u00eb dhe politik\u00eb q\u00eb mb\u00ebshtesin
  integrimin dhe mbrojtjen e t\u00eb huajve dhe refugjat\u00ebve, p\u00ebrfshir\u00eb
  grupet vulnerab\u00ebl, duke shqyrtuar efektivitetin e zbatimit t\u00eb tyre n\u00eb
  praktik\u00eb. Shqip\u00ebria \u00ebsht\u00eb pjes\u00eb e sistemit nd\u00ebrkomb\u00ebtar
  t\u00eb mbrojtjes s\u00eb refugjat\u00ebve dhe ofron politika t\u00eb qarta p\u00ebr
  azilk\u00ebrkucesit n\u00eb p\u00ebrpunjhe me Konvent\u00ebn e Gjenev\u00ebs, garantuar
  nj\u00eb proces t\u00eb drejt\u00eb dhe t\u00eb sigurt p\u00ebr ata q\u00eb k\u00ebrkojn\u00eb
  mbrojtje.\\n\\nMegjithat\u00eb, sfidat mbeten. Shqip\u00ebria p\u00ebrballet me
  munges\u00eb kapacitete t\u00eb p\u00ebr akomodimin e azilk\u00ebrkucesve dhe integrimin
  e migrant\u00ebve n\u00eb tregun e pun\u00ebs dhe shoq\u00ebri. Nj\u00eb tjet\u00ebr
  sfid\u00eb thelb\u00ebsore \u00ebsht\u00eb qasja e kufizuar n\u00eb procedurat e
  azilit dhe trajtimi i t\u00eb miturve t\u00eb pashoq\u00ebruar. Po ashtu, pavar\u00ebsisht
  se kemi patur progres n\u00eb harmonizimin e dispozitave ligjore, sfidat mbeten
  edhe n\u00eb nevoj\u00ebn p\u00ebr rishikim dhe harmonizim t\u00eb vazduesh\u00ebm
  t\u00eb k\u00ebtyre aktave, sipas rastit kur ndodhin rishikime n\u00eb nivel Evropian.
  Rasti konkret \u00ebsht\u00eb p\u00ebrfaq\u00ebrimi i Ligjit p\u00ebr t\u00eb huajt,
  i cili \u00ebsht\u00eb nj\u00eb ligj i ri, i harmonizuar m\u00eb her\u00ebt me Kart\u00eb
  Blu t\u00eb Bashkimit Evropian, por si shkak i ndryshimeve t\u00eb ndodhura n\u00eb
  k\u00ebt\u00eb Kart\u00eb nga BE, \u00ebsht\u00eb e nevojshme t\u00eb b\u00ebhen
  ndryshimet e nevojshme edhe n\u00eb Ligjin ton\u00eb p\u00ebr t\u00eb huajt.\\n\\nAnaliza
  vler\u00ebson t\u00eb drejtat sociale dhe ekonomike t\u00eb t\u00eb huajve n\u00eb
  Shqip\u00ebri dhe sugjeron p\u00ebrmir\u00ebsim\u00eb t\u00eb nevojshme, kur \u00ebsht\u00eb
  e mundur, me q\u00ebllim p\u00ebrmir\u00ebsimin e kuadrit ligjor/rregullator apo
  p\u00ebrmir\u00ebsimit t\u00eb qasjes n\u00eb sh\u00ebrbime t\u00eb k\u00ebsaj kategori.
  P\u00ebr efekt trajtimi n\u00eb k\u00ebt\u00eb analiz\u00eb, trajtimi sa i p\u00ebrket
  refugjat\u00ebve, t\u00eb cil\u00ebt jan\u00eb nj\u00eb kategori e t\u00eb huajve,
  \u00ebsht\u00eb b\u00ebr\u00eb n\u00eb m\u00ebnyr\u00eb t\u00eb ndar\u00eb duke
  qen\u00eb se kan\u00eb rregullim dhe procedura t\u00eb ve\u00e7anta p\u00ebr trajtimin
  e tyre.\\n\\n---\\n\\n2 Neni 3 pika 9 i ligjit Nr. 79 dat\u00eb 18.10.2021 \u201cP\u00ebr
  t\u00eb huajt\u201d: https://qbz.gov.al/share/h6NNRjocQMey7WFNiu7wng\\n3 Neni 3
  pika 28 i ligjit Nr. 10 dat\u00eb 24.02.2021 \u201cP\u00ebr azilin n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d.\\n\\nIII. Kuadri politik dhe ligjor komb\u00ebtar
  dhe nd\u00ebrkomb\u00ebtar p\u00ebr t\u00eb huajt\\n\\nN\u00eb fokus t\u00eb k\u00ebtij
  kreu \u00ebsht\u00eb identifikimi dhe analizimi i kuadrit t\u00eb plot\u00eb ligjor
  dhe politik n\u00eb Shqip\u00ebri p\u00ebr t\u00eb drejtat dhe sh\u00ebrbimet q\u00eb
  ofrohen p\u00ebr t\u00eb huajt n\u00eb Republik\u00ebn e Shqip\u00ebrise. N\u00eb
  k\u00ebt\u00eb Kre do t\u00eb trajtohen aktet kryesore q\u00eb parashikojn\u00eb
  rregullimin e t\u00eb drejtave t\u00eb t\u00eb huajve duke mund\u00ebsuar nj\u00eb
  panoram\u00eb t\u00eb p\u00ebrgjithshme t\u00eb secilit akt, p\u00ebr tu ndalur
  m\u00eb tej n\u00eb kapitujt pasardh\u00ebs n\u00eb procedura dhe sh\u00ebrbime
  konkrete p\u00ebr k\u00ebt\u00eb kategori. Gjithashtu, nj\u00eb fokus i ve\u00e7ant\u00eb
  do t\u2019i kushtohet standardeve nd\u00ebrkomb\u00ebtare p\u00ebr t\u00eb mund\u00ebsuar
  nj\u00eb analiz\u00eb m\u00eb t\u00eb thelluar n\u00eb kuad\u00ebr t\u00eb rregullimit
  dhe garantimit t\u00eb t\u00eb drejtave t\u00eb t\u00eb huajve n\u00eb vendin ton\u00eb
  sipas k\u00ebtyre standardeve.\\n\\n3.1 Kuadri politik p\u00ebr t\u00eb huajt n\u00eb
  Shqip\u00ebri\\n\\nKuadri politik p\u00ebr t\u00eb huajt n\u00eb Shqip\u00ebri synon
  t\u00eb siguroj\u00eb nj\u00eb menaxhim efektiv t\u00eb flukseve migratore, duke
  respektuar t\u00eb drejtat e t\u00eb huajve dhe duke p\u00ebrmbushur detyrimet nd\u00ebrkomb\u00ebtare
  t\u00eb vendit. Sa i p\u00ebrket kuadrit politik hartimi i politikave p\u00ebr menaxhimin
  e migracionit \u00ebsht\u00eb mb\u00ebshtetur nga disa strategji komb\u00ebtare
  dhe dokumente strategjike. Disa prej tyre p\u00ebrfshijn\u00eb:\\n\\n- Strategjia
  Komb\u00ebtare p\u00ebr Migracionin 2024\u20132030\u2074\\n- Strategjia Komb\u00ebtare
  p\u00ebr Zhvillim dhe Integrim Evropian 2022\u20132030;\\n- Plani Komb\u00ebtar
  p\u00ebr Integrim Evropian 2022\u20132024;\\n- Strategjia Nd\u00ebrsektoriale e
  Menaxhimit t\u00eb Integruar t\u00eb Kufirit 2021\u20132027;\\n- Strategjia Komb\u00ebtare
  p\u00ebr Diaspor\u00ebn dhe Plani i Veprit t\u00eb 2021\u20132025;\\n- Strategjia
  Kund\u00ebr Krimit t\u00eb Organizuar dhe Krimeve t\u00eb R\u00ebnda, 2021\u20132025;\\n-
  Strategjia Komb\u00ebtare e Pun\u00ebsimit dhe Afli\u00ebsive 2023\u20132030;\\n-
  Strategjia Komb\u00ebtare p\u00ebr Barazin\u00eb Gjinore 2021\u20132030 dhe Plani
  i Veprit;\\n\\nStrategjia Komb\u00ebtare p\u00ebr Migracionin 2024-2030 (SKM) n\u00eb
  Shqip\u00ebri synon nj\u00eb qasje gjith\u00ebp\u00ebrfshir\u00ebse ndaj sfidave
  dhe mund\u00ebsive t\u00eb migracionit, duke p\u00ebrfshir\u00eb t\u00eb huajt.
  Objektivat kryesore p\u00ebrfshijn\u00eb qeverisjen efektive t\u00eb migracionit,
  zhvillimin e politikave p\u00ebr migracionin p\u00ebr arsye pun\u00ebsimi, dhe promovimin
  e migracionit t\u00eb rregullt. Gjithashtu, strategjia fokusohet n\u00eb mbrojtjen
  e t\u00eb drejtave t\u00eb migrant\u00ebve dhe integrimin e tyre n\u00eb shoq\u00ebrin\u00eb
  shqiptare, duke kontribuar n\u00eb zhvillimin socio-ekonomik t\u00eb vendit. Kjo
  Strategji dhe Plani i Veprit t\u00eb 2024\u20132030 trajtojn\u00eb disa pik\u00eb
  ky\u00e7e, t\u00eb ngritura n\u00eb raportin e fundit t\u00eb Komisionit n\u00eb
  fush\u00ebn e migracionit. S\u00eb pari, i p\u00ebrgjigjet nevoj\u00ebs p\u00ebr
  kuadrin ligjor dhe institucional p\u00ebr t\u00eb mund\u00ebsuar mekanizma efektive
  p\u00ebr menaxhimin dhe koordinimin e migracionit. S\u00eb dyti, institucionet shqiptare
  jan\u00eb t\u00eb angazhuara p\u00ebr bashk\u00ebpunim nd\u00ebrkomb\u00ebtar p\u00ebr
  t\u00eb \u201cleht\u00ebsuar kthimin dhe ripanimin e sigurt dhe dinjitoz\u201d,
  nj\u00eb aspekt ky\u00e7 i qeverisjes s\u00eb migracionit, i monitoruar vazhdimisht
  nga BE-ja. Ky angazhim \u00ebsht\u00eb i lidhur ngusht\u00eb me synimin afatgjat\u00eb\\n\\n---\\n\\n\u2074
  VKM-ja nr. 271, dat\u00eb 2.05.2024, \u201cP\u00ebr miratimin e Strategjis\u00eb
  Komb\u00ebtare p\u00ebr Migracionin 2024-2030 dhe t\u00eb planit t\u00eb saj t\u00eb
  veprit t\u00eb 2024\u20132026\u201d. https://qbz.gov.al/share/05q_2DCYQFaOvFDBbf8JNw\\n\\np\u00ebr
  parandalimin e plot\u00eb t\u00eb fenomenit t\u00eb migrimit t\u00eb parregullt
  t\u00eb shtetasve shqiptar\u00eb, n\u00ebp\u00ebrmjet ofrimit t\u00eb informacionit,
  mbrojtjes dhe ndihm\u00ebs n\u00eb t\u00eb gjitha fazat emigrimit. Q\u00ebllimet
  politike t\u00eb prezantuara dhe q\u00eb synohen t\u00eb arrihen n\u00ebp\u00ebrmjet
  Strategjis\u00eb Komb\u00ebtare p\u00ebr Migracionin 2024-2030 jan\u00eb si m\u00eb
  posht\u00eb:\\n\\n- **Garantimi i qeverisjes strategjike t\u00eb migracionit n\u00eb
  Shqip\u00ebri:** Objektivi i politik\u00ebs p\u00ebr garantimin e qeverisjes strategjike
  t\u00eb migracionit n\u00eb Shqip\u00ebri ka qen\u00eb n\u00eb thelb t\u00eb SKM-s\u00eb
  dhe PV-s\u00eb 2019\u20132022, duke sh\u00ebrbyer si nj\u00eb baz\u00eb mbi t\u00eb
  cil\u00ebn mund t\u00eb b\u00ebhet p\u00ebrparrim n\u00eb shtyllat e tjera tematike.
  R\u00ebnd\u00ebsia thelb\u00ebsore e p\u00ebrfaqrimit t\u00eb kuadrit ligjor me
  at\u00eb t\u00eb BE-s\u00eb dhe me kornizat e tjera nd\u00ebrkomb\u00ebtare, si
  dhe e p\u00ebrmir\u00ebsimit t\u00eb koordinimit t\u00eb aktiviteteve t\u00eb qeverisjes
  s\u00eb migracionit, \u00ebsht\u00eb rip\u00ebrsh\u00ebritur pasi progresi drejt
  k\u00ebtij objektivi \u00ebsht\u00eb objekt monitorimi t\u00eb vazhduesh\u00ebm
  p\u00ebr an\u00ebtar\u00ebsimin e Shqip\u00ebris\u00eb n\u00eb BE.\\n\\n- **Zhvillimi
  i politikave efektive p\u00ebr migracionin p\u00ebr arsye pun\u00ebsimi, duke rritur
  ndikimin pozitiv t\u00eb migracionit n\u00eb zhvillimin social-ekonomik komb\u00ebtar/vendor:**
  Strategjia aktuale zgjeron masat parandaluese, duke ofruar stimuj p\u00ebr migracion
  t\u00eb rregullt dhe mbrojtjen e t\u00eb drejtave t\u00eb migrant\u00ebve, me fokus
  n\u00eb p\u00ebrfitimet ekonomike, arsimore dhe sociale. Ajo thekson nevoj\u00ebn
  p\u00ebr angazhimin e autoritetetve vendore, sh\u00ebrbimeve konsullore dhe aktor\u00ebve
  privat\u00eb p\u00ebr nj\u00eb qasje gjith\u00ebp\u00ebrfshir\u00ebse. Kjo qasje
  synon t\u00eb parandaloj\u00eb migrimin e parregullt dhe t\u00eb kontribuoj\u00eb
  n\u00eb zhvillimin e Shqip\u00ebris\u00eb.\\n\\n- **Promovimi i migracionit t\u00eb
  rregullt, mbrojtja e t\u00eb drejtave t\u00eb migrant\u00ebve dhe integrimi i tyre
  n\u00eb shoq\u00ebrin\u00eb shqiptare:** Strategjia e re p\u00ebr mbrojtjen e t\u00eb
  drejtave t\u00eb migrant\u00ebve fokusohet n\u00eb ofrimin e sh\u00ebrbimeve t\u00eb
  dedikuara p\u00ebr integrimin e tyre. Ajo p\u00ebrfsihin programe t\u00eb p\u00ebrshtatura
  p\u00ebr nevojat e migrant\u00ebve si nj\u00eb kategori e cenesueshe, duke marr\u00eb
  parasysh mosh\u00ebn dhe gjinin\u00eb. P\u00ebrfshirja e migrant\u00ebve n\u00eb
  sh\u00ebrbimet baz\u00eb dhe angazhimi p\u00ebr zgjidhje afatgjata jan\u00eb thelb\u00ebsore,
  duke adresuar gjithashtu sfidat e mbledhjes s\u00eb t\u00eb dh\u00ebnave dhe investimeve
  n\u00eb infrastruktur\u00eb. Strategjia synon t\u00eb forcoj\u00eb kushtet p\u00ebr
  shtet\u00ebsi dhe q\u00ebndrueshm\u00ebri, duke nxitur pjes\u00ebmarrjen e migrant\u00ebve
  n\u00eb zhvillimin lokal.\\n\\n- **Forcimi i sistemit t\u00eb mbrojtjes nd\u00ebrkomb\u00ebtare,
  garantimi i t\u00eb drejtave t\u00eb azilk\u00ebrkuvesve dhe refugiat\u00ebve dhe
  ofrimi i zgjidhjeve t\u00eb q\u00ebndrueshme:** Strategjia aktuale synon forcimin
  e sistemit t\u00eb azilit duke p\u00ebrmir\u00ebsuar procedurat, rritjen e kapaciteteve
  dhe garantimin e t\u00eb drejtave t\u00eb azilk\u00ebrkuvesve dhe refugiat\u00ebve,
  n\u00eb p\u00ebrputhje me standardet e BE-s\u00eb dhe Paktin Global p\u00ebr Refugjatat\u00eb.
  Ajo p\u00ebrfsihin p\u00ebrfaqrimin e kuadrit ligjor me at\u00eb nd\u00ebrkomb\u00ebtar,
  rritjen e efikasitetit n\u00eb trajtimin e k\u00ebrkesave p\u00ebr azil dhe mbrojtjen
  e personave me nevoja t\u00eb v\u00e7anta, v\u00e7an\u00ebrisht f\u00ebmij\u00ebt
  e pashoq\u00ebruar. P\u00ebrmir\u00ebsimi i infrastruktur\u00ebs n\u00eb qendrat
  prit\u00ebse dhe integrimi social-ekonomik i refugiat\u00ebve p\u00ebrmes programeve
  t\u00eb dedikuara jan\u00eb gjithashtu prioritet\u00eb kryesore.\\n\\n---\\n\\n5
  Shih po aty\\n6 Po aty, fq 28.\\n7 Po aty, fq 29.\\n8 Po aty, fq 30.\\n9 Po aty,
  fq 30.\\n\\nStrategjia Komb\u00ebtare p\u00ebr Zhvillim dhe Integrim Evropian 2022\u20132030\\\\(^{10}\\\\)
  - Strategjia Komb\u00ebtare p\u00ebr Zhvillim dhe Integrim Evropian (SKZHIE) deri
  n\u00eb vitin 2030 konsideron migracionin si nj\u00eb faktor t\u00eb r\u00ebnd\u00ebsish\u00ebm
  p\u00ebr zhvillimin social dhe ekonomik t\u00eb Shqip\u00ebris\u00eb, duke qen\u00eb
  thelb\u00ebsore p\u00ebr procesin e integrimit n\u00eb BE. Dokumenti synon t\u00eb
  adresoj\u00eb sfidat e migracionit n\u00eb vend, duke p\u00ebrmir\u00ebsuar mekanizmat
  e riintegrimit p\u00ebr migrant\u00ebt e kthyer dhe duke for\u00e7uar politikat
  p\u00ebr menaxhimin e migracionit, n\u00eb p\u00ebrpunhje me standardet nd\u00ebrkom\u00ebtare.
  Ai gjithashtu synon nj\u00eb qeverisje t\u00eb mir\u00eb t\u00eb l\u00ebvizjeve
  migratore p\u00ebr t\u00eb rritur ndikimin e tyre pozitiv n\u00eb zhvillimin komb\u00ebtar
  dhe lokal.\\n\\nSKZHIE-ja fokusohet n\u00eb promovimin e migracionit t\u00eb rregullt,
  mbrojtjen e t\u00eb drejtave t\u00eb migrant\u00ebve dhe integrimin e tyre t\u00eb
  q\u00ebndruesh\u00ebm n\u00eb shoq\u00ebrin\u00eb shqiptare. Nj\u00eb tjet\u00ebr
  q\u00ebllim kryesor \u00ebsht\u00eb nxiti e investimeve njer\u00ebzore dhe kapitale
  t\u00eb shqiptar\u00ebve q\u00eb jetojn\u00eb jasht\u00eb vendit, duke synuar q\u00eb
  politikat p\u00ebr migracionin t\u00eb kontribuojn\u00eb n\u00eb rritjen social-ekonomike
  t\u00eb vendit.\\n\\n**Plani Komb\u00ebtar p\u00ebr Integrimin Evropian 2022\u20132024**
  identifikon mang\u00ebsit\u00eb dhe masat prioritare p\u00ebr p\u00ebr\u00ebrafimin
  e legjislacionit dhe standardeve komb\u00ebtare me ato t\u00eb BE-s\u00eb n\u00eb
  t\u00eb 33 kapitujt e acquis-it t\u00eb BE-s\u00eb. PKIE-ja ofron nj\u00eb vler\u00ebsim
  t\u00eb detajuar t\u00eb situat\u00ebs, dhe mang\u00ebsive dhe identifikon fushat
  prioritare relevante si qeverisja e migracionit t\u00eb rregullt dhe t\u00eb parregullt,
  azili, politika e vizave (kapitulli 24), aksesi i barabart\u00eb dhe jodiskriminues
  n\u00eb tregun e pun\u00ebs dhe koordinimi i sistemit t\u00eb sigurimeve shoq\u00ebrore
  (kapitulli 2), njohja reciproke e kualifikimeve profesionale (kapitulli 3), statistikat
  demografike, sociale dhe ekonomike (kapitulli 18), standardet minimale dhe mosdiskriminimi
  n\u00eb pun\u00eb, si dhe marr\u00ebveshjet nd\u00ebrkom\u00ebtare dhe bashk\u00ebpunimin,
  n\u00eb lidhje me pun\u00ebsimin, pun\u00ebn dhe \u00e7\u00ebshtjet sociale (kapitulli
  19).\\\\(^{11}\\\\)\\n\\n**Strategjia Nd\u00ebrsektoriale e Menaxhimit t\u00eb Integruar
  t\u00eb Kufirit 2021\u20132027** \u2013 nd\u00ebr synimet kryesore t\u00eb Strategjis\u00eb
  s\u00eb Menaxhimit t\u00eb Integruar t\u00eb Kufirit \u00ebsht\u00eb leht\u00ebsimi
  i migracionit t\u00eb organizuar, t\u00eb sigurt, t\u00eb rregullt dhe t\u00eb p\u00ebrgjegjsh\u00ebm,
  n\u00ebp\u00ebrmjet zbatimit t\u00eb politikave t\u00eb migracionit t\u00eb planifikuara
  dhe t\u00eb menaxhuara mir\u00eb, s\u00eb bashku me parandalimin e migrimit t\u00eb
  parregullt dhe menaxhimin e fluksit migrator.\\\\(^{12}\\\\)\\n\\n**Strategjia Komb\u00ebtare
  p\u00ebr Diaspor\u00ebn** vler\u00ebson potencialin e imigrant\u00ebve jo vet\u00ebm
  sa i takon remitancave, por dhe rolit p\u00ebr zhvillimin e vendit p\u00ebrmes njohurive
  dhe vlerave t\u00eb fituara n\u00eb shtetet e tjera. Nga ana tjet\u00ebr, programi
  shtet\u00ebror p\u00ebr mb\u00ebshtetjen dhe p\u00ebrfshirjen e diaspor\u00ebs shqiptare
  ka si q\u00ebllim t\u00eb forcoj\u00eb politikat dhe strukturat institucionale p\u00ebr
  ta par\u00eb migracionin si nj\u00eb mund\u00ebsi p\u00ebr zhvillimin e vendit.
  P\u00ebrfitimet neto t\u00eb kapitalit njer\u00ebzor (kontributi n\u00eb aftesi\\n\\n---\\n\\n\\\\(^{10}\\\\)
