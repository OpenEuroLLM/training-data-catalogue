sample: '["\"VENDIM Nr. 210, dat\u00eb 31.10.2017\\n\\nN\u00eb mb\u00ebshtetje t\u00eb
  Ligjit nr. 9048, dat\u00eb 07.04.2003, \u201cP\u00ebr Trash\u00ebgimin\u00eb Kulturore\u201d
  (i ndryshuar), Neni 47, VKM Nr. 725, dat\u00eb 21.05.2008 \\\"P\u00ebr p\u00ebrballjen,
  funksionimin, kompetencat dhe m\u00ebnyr\u00ebn e shp\u00ebrblimit t\u00eb an\u00ebtar\u00ebve
  t\u00eb K\u00ebshillit Komb\u00ebtar t\u00eb Arkeologjis\u00eb\\\" (i ndryshuar),
  K\u00ebshilli Komb\u00ebtar i Arkeologjis\u00eb n\u00eb mbledhjen Nr.12, dat\u00eb
  31.10.2017, pasi shqyrtoi Raportin e V\u00ebzhgimit Arkeologjik sip\u00ebrfaq\u00ebsor,
  n\u00eb kuad\u00ebr t\u00eb projektit \\\"Nd\u00ebrtimi i HEC \\\"KASAJ\\\" n\u00eb
  lumin e Fanit t\u00eb Vog\u00ebl, Bashkia Mirdit\u00eb, Qarku Lezh\u00eb\\\"- subjekti
  \\\"TROJET ENERGJI\\\" sh.p.k., realizuar nga individ i licencuar n\u00eb arkeologji
  Z. Ylli Cerova.\\n\\nVENDOSI:\\n\\n1. T\u00eb miratojn\u00eb Raportin e V\u00ebzhgimit
  Arkeologjik sip\u00ebrfaq\u00ebsor, n\u00eb kuad\u00ebr t\u00eb projektit \\\"Nd\u00ebrtimi
  i HEC \\\"KASAJ\\\" n\u00eb lumin e Fanit t\u00eb Vog\u00ebl, Bashkia Mirdit\u00eb,
  Qarku Lezh\u00eb\\\"- subjekti \\\"TROJET ENERGJI\\\" sh.p.k., realizuar nga individ
  i licencuar n\u00eb arkeologji Z. Ylli Cerova.\\n\\n2. Subjekti \\\"TROJET ENERGJI\\\"
  sh.p.k., duhet t\u00eb lidh\u00eb paraprakisht akt-marr\u00ebveshje tre pal\u00ebshe
  me shoq\u00ebri t\u00eb licencuar n\u00eb arkeologji, e cila duhet t\u00eb ndjek\u00eb
  n\u00eb m\u00ebnyr\u00eb periodike ditore kryerjen e punimeve t\u00eb g\u00ebrmimit
  p\u00ebr HEC \\\"KASAJ\\\" n\u00eb lumin e Fanit t\u00eb Vog\u00ebl, Bashkia Mirdit\u00eb,
  Qarku Lezh\u00eb, si dhe Agjencin\u00eb e Sh\u00ebrbimit Arkeologjik, e cila do
  t\u00eb mbik\u00ebqyr\u00eb k\u00ebt\u00eb shoq\u00ebri.\\n\\n3. Investitori duhet
  t\u00eb derdh\u00eb detyrimet tatimore p\u00ebr mbik\u00ebqyrjen e realizuar nga
  ASHA, sipas tarifave t\u00eb miratuara me Urdh\u00ebrin e Ministrit Nr. 384, dat\u00eb
  21.10.2015 dhe p\u00ebrcaktimeve p\u00ebrkat\u00ebse t\u00eb akt-marr\u00ebveshjes
  tre pal\u00ebsh\u00eb.\\n\\n4. Ky vendim hyjn\u00eb fuqi menj\u00ebher\u00eb.\\n\\n5.
  Ngarkohet Sekretaria Teknike p\u00ebr njoftimin e k\u00ebtij vendimi.\\n\\nKRYETAR\\n\\nMIRELA
  KUMBARDUTURXHI\\nMINIST\u00cbR\\n\\nSEKRETARI KK\\nRUDINA ZOTO\\n\\nAlbasa, Rruga
