  57   |\\n\\nPERSHKRIMI I APARATIT TE DEGJIMIT\\n\\n1. Vrimat e mikrofonit\\n2. Komanda
  e volumit\\n3. Butoni i programeve\\n4. Funksioni ndiz/fik\\n5. Kap\u00ebsja p\u00ebr
  thoin\\n6. Vrima e daljes s\u00eb tingullit\\n7. Mbrojt\u00ebsja nga dylli NanoCare\\n8.
  Ventili (Jo n\u00eb t\u00eb gjitha modelet).\\n\\nNqs keni nevoj\u00eb t\u00eb identifikoni
  numrin serial t\u00eb produktit (zakonisht me gjasht\u00eb ose shtat\u00eb numra),
  kontaktoni me specialistin tuaj t\u00eb d\u00ebgjimit. Aparati juaj i d\u00ebgjimit
  mund t\u00eb vij\u00eb me nj\u00eb program d\u00ebgjimi t\u00eb quajtur Zen. Ky
  program prodhon tone muzikore (dhe ndonj\u00ebher\u00eb nj\u00eb zhurm\u00eb si
  fryrje ajri) n\u00eb sfond. K\u00ebta tinguj do t\u2019i p\u00ebrgjigjen llojit
  t\u00eb d\u00ebmtimit t\u00eb d\u00ebgjimit q\u00eb keni.\\n\\nPARALAJMERIM\\n\\nKjo
  broshur\u00eb p\u00ebrmban informacion dhe udh\u00ebzime t\u00eb r\u00ebnd\u00ebsishme.
  Lexojeni broshur\u00ebn me kujdes para se t\u00eb filloni t\u00eb p\u00ebrdorni
  aparatin e d\u00ebgjimit.\\n\\nSHENIM\\n\\nAparati juaj i d\u00ebgjimit dhe aksesor\u00ebt
  mund t\u00eb mos ken\u00eb pamje t\u00eb nj\u00ebjt\u00eb me \u00e7far\u00eb tregojn\u00eb
  ilustrimet n\u00eb broshur\u00eb. Ne gjithashtu ruajm\u00eb t\u00eb drejt\u00ebn
  t\u00eb b\u00ebjm\u00eb \u00e7do ndryshim q\u00eb e konsiderojm\u00eb t\u00eb nevojsh\u00ebm.\\n\\nP\u00ebrdorimi
  i synuar\\n\\nAparatet e d\u00ebgjimit jan\u00eb pajisje amplifikuese me p\u00ebrcim
  ajri, t\u00eb destinuara p\u00ebr p\u00ebrdorim n\u00eb rrethana d\u00ebgjimi t\u00eb
  zakonshme. Aparatet e d\u00ebgjimit mund t\u00eb pajisen edhe me programin Zen,
  q\u00eb ofron nj\u00eb sfond d\u00ebgjimi relaksues (muzik\u00eb dhe zhorma) p\u00ebr
  persona n\u00eb mosh\u00eb madhore q\u00eb d\u00ebshirojn\u00eb t\u2019i d\u00ebgjojn\u00eb
  k\u00ebto n\u00eb qet\u00ebsi.\\n\\nUdh\u00ebzimet p\u00ebr p\u00ebrdorim\\n\\nPajisjet
  indikohen p\u00ebr individ\u00eb me humbje d\u00ebgjimi nga t\u00eb leht\u00eb (10
  dB HL) n\u00eb serioze (80 dB HL), n\u00eb t\u00eb gjitha konfigurimet.\\n\\nPajisjet
  duhet t\u00eb programohen nga specialist\u00eb t\u00eb d\u00ebgjimit (audiolog\u00eb,
  specialist\u00eb t\u00eb d\u00ebgjimit, otolaringolog\u00eb) t\u00eb specializuar
  n\u00eb (ri) aft\u00ebsimin e d\u00ebgjimit.\\n\\nIdentifikimi djathtas/majtas\\n\\nN\u00eb
  qoft\u00eb se mbani aparate d\u00ebgjimi n\u00eb t\u00eb dy vesh\u00ebt, mund t\u2019i
  dalloni leht\u00eb nga nj\u00ebri-tjetri, megj\u00eb aparati n\u00eb veshin e djatht\u00eb
  ka nj\u00eb logo Widex t\u00eb kuqe, nd\u00ebrsa ai n\u00eb veshin e majt\u00eb
  nj\u00eb logo blu.\\n\\nShigjeta tregon pozicionin e logos.\\n\\nSinjalet akustike\\n\\nAparati
  i d\u00ebgjimit mund t\u00eb programohet q\u00eb t\u00eb l\u00ebshoj\u00eb sinjale,
  p\u00ebr t\u00eb lajm\u00ebruar p\u00ebrdorimin e disa funksioneve. Sinjali mund
  t\u00eb jet\u00eb n\u00eb trajt\u00eb tonesh (SmartTone) ose si mesazh i folur (SmartSpeak)*.
  Sinjali mund edhe t\u00eb \u00e7aktivizohet.\\n\\n| Funksionet                  |
  Cil\u00ebsimet e parazgjedhura | Cil\u00ebsime t\u00eb tjer\u00eb |\\n|-----------------------------|---------------------------|-------------------|\\n|
  Rregullimi i volumit        | Ton                       | Fikur             |\\n|
  Konfirmim i p\u00ebrdorimit t\u00eb butonit programues | Tingull klikues | Fikur             |\\n|
  Ndryshim i programit        | Ton                       | Mesazh/fikur      |\\n|
  Nisja e aparatit t\u00eb d\u00ebgjimit | Ton                       | Mesazh/fikur      |\\n|
  Paralajm\u00ebrim p\u00ebr bateri t\u00eb dob\u00ebt | 4 tone                   |
  Mesazh/fikur      |\\n| P\u00ebrkujt\u00ebse sh\u00ebrbimi         | Fikur                     |
  Mesazh            |\\n\\n* SmartSpeak nuk disponohet si funksion standard\\n\\nBateria\\n\\nNe
  rekomandojm\u00eb bateri me zink-aj\u00ebr. P\u00ebrdorni nj\u00eb bateri t\u00eb
  modelit 312 p\u00ebr aparatin e d\u00ebgjimit.\\n\\nKur keni nevoj\u00eb p\u00ebr
  t\u00eb nd\u00ebrruar baterin\u00eb, k\u00ebshillohuni me specialistin tuaj t\u00eb
  d\u00ebgjimit. Ka r\u00ebnd\u00ebsi t\u00eb mbani mend dat\u00ebn e skadimit dhe
  rekomandimet n\u00eb paket\u00ebn e bateris\u00eb n\u00eb lidhje me eliminimin e
  baterive t\u00eb shkarkuara. K\u00ebshtu do t\u00eb shmangni rrezikun q\u00eb bateria
  t\u00eb zgjat\u00eb m\u00eb pak se \u00e7\u2019prisnit.\\n\\nFutja e bateris\u00eb\\n\\nPara
  se t\u00eb futni nj\u00eb bateri t\u00eb re n\u00eb aparatin e d\u00ebgjimit, mos
  harroni t\u00eb hiqni gjuh\u00ebz\u00ebn ngjit\u00ebse. Si ta keni hequr gjuh\u00ebz\u00ebn,
  bateria do t\u00eb nis\u00eb t\u00eb funksionoj\u00eb pas pak sekondash.\\n\\nKUJDES\\n\\nMos
  e p\u00ebrdorni baterin\u00eb, n\u00ebse ka ndonj\u00eb mbetje ngjit\u00ebse nga
  gjuh\u00ebza ose ndonj\u00eb l\u00ebnd\u00eb tjet\u00ebr t\u00eb pad\u00ebshiruar,
  meq\u00eb kjo mund t\u00eb shkaktoj\u00eb keqfunksionim t\u00eb aparatit t\u00eb
  d\u00ebgjimit.\\n\\nDuke p\u00ebrdorur kap\u00ebsen p\u00ebr thoin, shtyjeni mbules\u00ebn
  e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb p\u00ebr nga posht\u00eb dhe hapeni mbules\u00ebn.
  Mos e shtyni mbules\u00ebn e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb p\u00ebrtej
  pozicionit t\u00eb hapur.\\n\\nVendoseni baterin\u00eb n\u00eb m\u00ebnyr\u00eb
  q\u00eb shenja plus (+) t\u00eb jet\u00eb e kthyer nga lart.\\n\\nMund t\u00eb p\u00ebrdorni
  magnetin e bateris\u00eb, q\u00eb ju \u00ebsht\u00eb dh\u00ebn\u00eb, p\u00ebr ta
  \u00e7uar baterin\u00eb n\u00eb vendin e vet.\\n\\nN\u00eb qoft\u00eb se mbulesa
  e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb nuk mbyllet leht\u00eb, bateria nuk \u00ebsht\u00eb
  futur si\u00e7 duhet.\\n\\nKur po nd\u00ebrroni baterin\u00eb, b\u00ebni mir\u00eb
  ta mbani aparatin e d\u00ebgjimit mbi nj\u00eb tryez\u00eb.\\n\\nTreguesi i bateris\u00eb
  s\u00eb dob\u00ebt\\n\\nKur bateria \u00ebsht\u00eb pothuajse e harxhuar, do t\u00eb
  d\u00ebgjohet nj\u00eb sinjal akustik, me kusht q\u00eb t\u00eb mos e keni \u00e7aktivizuar
  k\u00ebt\u00eb funksion (shihni f. 10). Rekomandojm\u00eb q\u00eb t\u00eb mbani
  gjithnj\u00eb nj\u00eb bateri rezerv\u00eb me vete.\\n\\nPARALAJMERIM\\n\\nAsnj\u00ebher\u00eb
  mos e lini nj\u00eb bateri t\u00eb harxhuar n\u00eb aparatin e d\u00ebgjimit. Baterit\u00eb
  e harxhuara mund t\u00eb rrjedhin dhe t\u00eb d\u00ebmtojn\u00eb aparatin e d\u00ebgjimit.\\n\\nPARALAJMERIM\\n\\nAparati
  i d\u00ebgjimit mund t\u00eb nd\u00ebrpres\u00eb funksionimin, n\u00eb qoft\u00eb
  se bateria \u00ebsht\u00eb harxhuar. K\u00ebt\u00eb duhet ta mbani parasysh, sidomos
  kur gjendeni n\u00eb trafik ose n\u00eb situata kur \u00ebsht\u00eb e nevojshme
  t\u00eb d\u00ebgjoni sinjale paralajm\u00ebruese.\\n\\nNdezja dhe fikja e aparatit
  t\u00eb d\u00ebgjimit\\n\\nMbulesa e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb e
  aparatit t\u00eb d\u00ebgjimit funksionon edhe si \u00e7el\u00ebsi ndiz/fik.\\n\\nMbylleni
  mbules\u00ebn e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb dhe shtyjeni p\u00ebr nga
  lart, q\u00eb ta ndizni aparatin e d\u00ebgjimit. Nj\u00eb sinjal akustik do t\u00eb
  lajm\u00ebroj\u00eb se aparat i d\u00ebgjimit \u00ebsht\u00eb ndezur, me kusht q\u00eb
  t\u00eb mos e keni \u00e7aktivizuar sinjalin.\\n\\nShtyjeni mbules\u00ebn e dhom\u00ebz\u00ebs
  s\u00eb bateris\u00eb nga lart posht\u00eb, p\u00ebr ta fikur aparatin e d\u00ebgjimit.\\n\\nMos
  harroni q\u00eb ta fikni aparatin e d\u00ebgjimit, kur nuk po e p\u00ebrdorni. Hiqeni
  baterin\u00eb, n\u00eb qoft\u00eb se nuk do ta p\u00ebrdorni aparatin e d\u00ebgjimit
  p\u00ebr disa dit\u00eb rresht.\\n\\nVendosja e aparatit t\u00eb d\u00ebgjimit\\n\\nMbylleni
  der\u00ebn e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb deri n\u00eb fund.\\n\\nMbajeni
  aparatin e d\u00ebgjimit me gishtin e madh dhe gishtin tregues. Futeni me ngadal\u00eb
  n\u00eb kanalin e veshit, derisa t\u00eb ndieni rezistenc\u00eb.\\n\\nL\u00ebshojeni
  aparatin e d\u00ebgjimit dhe, duke p\u00ebrdorur maj\u00ebn e gishtit tregues, shtyjeni
  me kujdes n\u00eb vesh, derisa t\u00eb z\u00ebr\u00eb vend mir\u00eb n\u00eb kanal.\\n\\nQ\u00eb
  aparati t\u00eb z\u00ebr\u00eb vend mir\u00eb, mund edhe ta t\u00ebrhiqni llap\u00ebn
  e veshit nga prapa dhe lart me dor\u00ebn tjet\u00ebr.\\n\\nNqs aparati i d\u00ebgjimit
  nuk q\u00ebndron si\u00e7 duhet, ose shkakton irritim, skuqje ose t\u00eb tjer\u00eb
  si k\u00ebto, kontakto me specialistin tuaj t\u00eb d\u00ebgjimit.\\n\\nHeqja e
  aparatit t\u00eb d\u00ebgjimit\\n\\nMabajeni aparatin e d\u00ebgjimit me gishtin
  e madh dhe gishtin tregues dhe t\u00ebrhiqeni me kujdes.\\n\\nN\u00ebse ashtu e
  keni t\u00eb v\u00ebshtir\u00eb, provoni ta l\u00ebvizni aparatin e d\u00ebgjimit
  nga nj\u00ebra an\u00eb n\u00eb tjetr\u00ebn. N\u00ebse kjo ndihmon, t\u00ebrhiqeni
  veshin e jasht\u00ebm prapa dhe lart, me dor\u00ebn tjet\u00ebr.\\n\\nRregullimi
  i volumit\\n\\nVolumi i aparatit t\u00eb d\u00ebgjimit rregullohet automatikisht,
  sipas mje- disit akustik ku gjendeni.\\n\\nAparati juaj i d\u00ebgjimit mund t\u00eb
  jet\u00eb i pajisur edhe me nj\u00eb komand\u00eb t\u00eb volumit, n\u00eb form\u00ebn
  e nj\u00eb leve t\u00eb vog\u00ebl.\\n\\nShtyjeni lev\u00ebn nga posht\u00eb lart,
  p\u00ebr ta ngritur volumin gradualisht.\\n\\nShtyjeni lev\u00ebn nga lart posht\u00eb,
  p\u00ebr ta ulur volumin gradualisht.\\n\\nSa her\u00eb q\u00eb ta p\u00ebrdorni
  komand\u00ebn e volumit, do t\u00eb d\u00ebgjoni nj\u00eb bip, me p\u00ebrjashtim
  t\u00eb rastit kur e keni paaft\u00ebsuar k\u00ebt\u00eb funksion. Kur t\u00eb keni
  arritur volumin maksimal ose minimal, do t\u00eb d\u00ebgjoni nj\u00eb ton t\u00eb
  vazhduesh\u00ebm.\\n\\nPARALAJMERIM\\n\\nNqs volumi i aparatit t\u00eb d\u00ebgjimit
  \u00ebsht\u00eb n\u00eb p\u00ebrgjith\u00ebsi i lart\u00eb ose tep\u00ebr i ul\u00ebt,
  tingujt riprodhohen t\u00eb deformuar, ose nqs d\u00ebshironi ndonj\u00eb informacion
  tjet\u00ebr, k\u00ebshillohuni me specialistin tuaj t\u00eb d\u00ebgjimit.\\n\\nP\u00ebr
  ta fikur tingullin krejt\\n\u2022 Vazhdoni ta shtypni lev\u00ebn e komand\u00ebs
  s\u00eb volumit nga lart posht\u00eb, pasi t\u00eb keni d\u00ebgjuar tonin e vazhduesh\u00ebm\\n\\nP\u00ebr
  ta ndezur tingullin s\u00ebrish\\n\u2022 Shtyjeni lev\u00ebn lart ose\\n\u2022 Nd\u00ebrroni
  programin e d\u00ebgjimit\\n\\n\u00c7do rregullim q\u00eb mund t\u2019ia keni b\u00ebr\u00eb
  volumit do t\u00eb anulohet kur ta fikni aparatin e d\u00ebgjimit, ose kur t\u00eb
  nd\u00ebrroni programin.\\n\\nN\u00ebse d\u00ebshironi q\u00eb ta \u00e7aktivizoni
  komand\u00ebn e volumit, bisedoni me specialistin tuaj t\u00eb d\u00ebgjimit.\\n\\nProgramet
  e d\u00ebgjimit\\n\\nMe parazgjedhje, aparati juaj i d\u00ebgjimit vjen me nj\u00eb
  program Master, dhe me opsonin e nj\u00eb programi shtes\u00eb. Mund t\u00eb disponohen
  edhe nj\u00eb num\u00ebr programesh suplementare. N\u00ebse d\u00ebshironi, mund
  t\u00eb keni deri n\u00eb pes\u00eb programe.\\n\\n| Program | Detaje |\\n|---------|--------|\\n|
  Master  | T\u00eb gjitha funksionet automatike jan\u00eb aktive, p\u00ebr t\u2019ju
  siguruar d\u00ebgjim t\u00eb rehatsh\u00ebm n\u00eb \u00e7do situat\u00eb |\\n|
  Muzik\u00eb  | P\u00ebr t\u00eb d\u00ebgjuar muzik\u00eb |\\n| TV      | P\u00ebr
  t\u00eb d\u00ebgjuar TV |\\n| T       | Ky program ju lejon t\u00eb d\u00ebgjoni
  n\u00ebp\u00ebrmjet telebobin\u00ebs (T) dhe jo mikrofonave t\u00eb aparateve t\u00eb
  d\u00ebgjimit (M). Telebobina p\u00ebrdoret atje ku \u00ebsht\u00eb instaluar nj\u00eb
  sistem cik\u00ebl. N\u00eb qoft\u00eb se e aktivizoni programin e telebobin\u00ebs,
  do t\u00eb d\u00ebgjoni nj\u00eb burim tingullor specifik, nd\u00ebrsa tingujt e
  mjedisit rr\u00ebthues do t\u00eb p\u00ebrjashtohen. |\\n\\n| Program | Description
  |\\n|--------|-------------|\\n| M+T    | Ky program ju lejon t\u00eb d\u00ebgjoni
  n\u00ebp\u00ebrmjet mikrofonave t\u00eb aparateve t\u00eb d\u00ebgjimit (M) dhe
  telebabin\u00ebs (T). |\\n| Standard | T\u00eb gjitha funksionet automatike jan\u00eb
  aktive, p\u00ebr t\u2019ju siguruar d\u00ebgjueshm\u00ebri dhe kuptim t\u00eb t\u00eb
  folurit n\u00eb \u00e7do situat\u00eb |\\n| Klimatizimi | Ky program ofron t\u00eb
  nj\u00ebjtat funksione si edhe programi Master, por me m\u00eb pak amplifikim |\\n|
  Zgjat\u00ebsi i d\u00ebgjueshm\u00ebr\u00ebs* | I b\u00ebn t\u00eb d\u00ebgjuesh\u00ebm
  tingujt me frekuenc\u00eb t\u00eb lart\u00eb |\\n| Zen* | P\u00ebrfton lloje t\u00eb
  ndryshme tonesh. |\\n\\n* Disponohet ve\u00e7an\\n\\nN\u00eb qoft\u00eb se nevojat
  tuaja ndryshojn\u00eb me kalimin e koh\u00ebs, kombinimi i programeve t\u00eb d\u00ebgjimit
  mund t\u00eb ndryshohet.\\n\\nProgrami Zen\\n\\nAparati juaj i d\u00ebgjimit mund
  t\u00eb vij\u00eb me nj\u00eb program opsional d\u00ebgjimi t\u00eb quajtur Zen.
  Ky program prodhon tone muzikore (dhe ndonj\u00ebher\u00eb nj\u00eb zhurm\u00eb
  si fryrje ajri) n\u00eb sfond. K\u00ebta tinguj do t\u2019i p\u00ebrgjigjen llojit
  t\u00eb d\u00ebmtimit t\u00eb d\u00ebgjimit q\u00eb keni. Programi Zen mund t\u00eb
  p\u00ebrdoret vet\u00ebm (pa amplifikim), n\u00eb kushte qet\u00ebsie, kur ju nuk
  keni nevoj\u00eb t\u00eb d\u00ebgjoni tinguj nga mjedis rrethues. Ose, mund t\u00eb
  p\u00ebrdoret s\u00eb bashku me programin Master, n\u00eb m\u00ebnyr\u00eb q\u00eb
  edhe tingujt rrethues edhe tingujt e p\u00ebrftuar (tone fraktale dhe zhurm\u00eb)
  t\u00eb d\u00ebgjohen s\u00eb bashku.\\n\\nKUJDES\\n\\nP\u00ebrdorimi i programeve
  t\u00eb ndryshme Zen mund t\u00eb pengoj\u00eb d\u00ebgjimin e tingujve n\u00eb
  mjedis, duke p\u00ebrfshir\u00eb edhe t\u00eb folurit. Programi nuk duhet p\u00ebrdorur,
  n\u00ebse ka r\u00ebnd\u00ebsi q\u00eb tinguj t\u00eb till\u00eb t\u00eb t\u00eb
  d\u00ebgjohen. N\u00eb ato situata, p\u00ebrdorni nj\u00eb program jo-Zen n\u00eb
  aparatin e d\u00ebgjimit.\\n\\nKUJDES\\n\\nN\u00ebse perceptoni nj\u00eb ulje t\u00eb
  forc\u00ebs s\u00eb tingullit dhe nj\u00eb toleranc\u00eb m\u00eb t\u00eb madhe
  p\u00ebr tingujt e fort\u00eb, n\u00ebse nuk e d\u00ebgjoni m\u00eb qart\u00eb t\u00eb
  folurit ose n\u00ebse tinnitus-i keq\u00ebsohet, lidhuni me specialistin tuaj t\u00eb
  d\u00ebgjimit.\\n\\nP\u00ebrfitimet\\nProgrami Zen ofron nj\u00eb sfond d\u00ebgjimi
  q\u00eb mund t\u00eb jet\u00eb relaksues p\u00ebr disa njer\u00ebz. Kur programi
  Zen p\u00ebrdoret si pjes\u00eb e nj\u00eb regjimi t\u00eb menaxhimit t\u00eb tinnitus-it,
  p\u00ebrdoruesit mund t\u2019i ndiejn\u00eb m\u00eb pak efektet e tinnitus-it.\\n\\nUdh\u00ebzimet
  p\u00ebr p\u00ebrdorim\\nProgrami Zen synon t\u00eb ofroj\u00eb nj\u00eb sfond d\u00ebgjimi
  relaksues (muzik\u00eb dhe zhorma) p\u00ebr persona n\u00eb mosh\u00eb madhore q\u00eb
  d\u00ebshiron\u00eb t\u2019i d\u00ebgjojn\u00eb k\u00ebto n\u00eb qet\u00ebsi. Mund
  t\u00eb p\u00ebrdoret si mjet i terapis\u00eb me tinguj n\u00eb nj\u00eb program
  t\u00eb trajtimit t\u00eb tinnitus-it t\u00eb parashkruar nga nj\u00eb specialist
  d\u00ebgjimi (audiolog, specialist aparatesh d\u00ebgjimi, otolaringolog) i trajnuar
  n\u00eb trajtimin e tinnitus-it.\\n\\nM\u00ebnyra e p\u00ebrdorimit\\n\\nP\u00ebr
  shkak se si Zen \u00ebsht\u00eb programuar n\u00eb aparatin tuaj t\u00eb d\u00ebgjimit,
  ndiqni rekomandimet e specialistit tuaj t\u00eb d\u00ebgjimit p\u00ebr m\u00ebnyr\u00ebn
  e p\u00ebrdorimit, kur mund ta p\u00ebrdorni dhe/ose sa koh\u00eb mund ta p\u00ebrdorni.\\n\\nK\u00ebmbimi
  mes programeve t\u00eb d\u00ebgjimit\\n\\nP\u00ebr t\u00eb nd\u00ebrruar programin,
  shtypni butonin e programit shkurtimisht. Sa her\u00eb q\u00eb kaloni nga nj\u00eb
  program n\u00eb tjetrin, do t\u00eb lajm\u00ebroheni me nj\u00eb sinjal akustik,
  me kusht q\u00eb t\u00eb mos e keni \u00e7aktivizuar k\u00ebt\u00eb funksion m\u00eb
  par\u00eb.\\n\\n| Programi 1: | Nj\u00eb bip i shkurtr\u00ebr ose mesazh |\\n|-------------|--------------------------------|\\n|
  Programi 2: | Dy bipe t\u00eb shkurtra ose mesazh |\\n|-------------|--------------------------------|\\n|
  Programi 3: | Tre bipe t\u00eb shkurtra ose mesazh |\\n| Programi 4: | Nj\u00eb
  bip i gjat\u00eb dhe nj\u00eb bip i shkurtr\u00ebr ose mesazh |\\n| Programi 5:
  | Nj\u00eb bip i gjat\u00eb dhe dy bipe t\u00eb shkurtra ose mesazh |\\n\\nN\u00ebse
  d\u00ebshironi q\u00eb ta \u00e7aktivizoni butonin e programeve, bisedoni me specialistin
  tuaj t\u00eb d\u00ebgjimit.\\n\\nPASTRIMI\\n\\nMe aparatin e d\u00ebgjimit mund
  t\u00eb p\u00ebrdorni aksesor\u00ebt pastrues t\u00eb m\u00ebposht\u00ebm.\\n\\n1.
  Leck\u00eb\\n2. Fur\u00e7\u00eb\\n3. Veg\u00ebl p\u00ebr heqjen e dyllit\\n\\nLidhuni
  me specialistin tuaj t\u00eb d\u00ebgjimit, n\u00ebse keni nevoj\u00eb p\u00ebr
  aksesor\u00eb t\u00eb tjer\u00eb pastrimi.\\n\\nAparati i d\u00ebgjimit\\n\\nQ\u00eb
  aparati i d\u00ebgjimit t\u00eb funksionoj\u00eb mir\u00eb, ka shum\u00eb r\u00ebnd\u00ebsi
  q\u00eb t\u00eb mbahet i past\u00ebr nga dylli i veshit dhe papast\u00ebrtit\u00eb.\\n\\nPastrojeni
  aparatin e d\u00ebgjimit p\u00ebrdit\u00eb me leck\u00ebn e but\u00eb, p\u00ebr
  ta mbajtur t\u00eb that\u00eb dhe t\u00eb past\u00ebr nga dylli i veshit ose papast\u00ebrtit\u00eb.\\n\\nPARALAJMERIM\\n\\nKurr\u00eb
  mos e pastroni aparatin e d\u00ebgjimit me uj\u00eb ose solucione pastrimi, sepse
  kjo mund ta d\u00ebmtoj\u00eb.\\n\\nKur aparati i d\u00ebgjimit nuk \u00ebsht\u00eb
  n\u00eb p\u00ebrdorim, mbulesa e dhom\u00ebz\u00ebs s\u00eb bateris\u00eb duhet
  mbajtur e hapur, p\u00ebr ta ajrosur aparatin dhe p\u00ebr ta l\u00ebn\u00eb t\u00eb
  thahet.\\n\\nJu k\u00ebshillojm\u00eb q\u00eb, sa her\u00eb q\u00eb ta nxirrni aparatin
  e d\u00ebgjimit nga veshi, t\u00eb kontrolloni vrim\u00ebn e daljes s\u00eb tingullit
  dhe ventilin, p\u00ebr t\u2019u siguruar se nuk ka grumbullime dylli ose papast\u00ebrtish.
  Shembulli m\u00eb posht\u00eb tregon si mund t\u00eb duken vrima e daljes s\u00eb
  tingullit dhe ventilit. Ilustrimi mund edhe t\u00eb ndryshoj\u00eb pak nga \u00e7far\u00eb
  duket n\u00eb aparatin tuaj t\u00eb d\u00ebgjimit.\\n\\n1. Vrima e daljes s\u00eb
  tingullit\\n2. Vrima e ventilit\\n\\nVrima e daljes s\u00eb tingullit\\n\\nKa r\u00ebnd\u00ebsi
  q\u00eb vrima e daljes s\u00eb tingullit t\u00eb mos jet\u00eb e blokuar nga dylli
  i veshit. N\u00ebse ka blokim, veproni si vijon:\\n\\nMe an\u00eb t\u00eb fur\u00e7\u00ebs
  s\u00eb vog\u00ebl ose leck\u00ebs, hiqni dyllin q\u00eb mund t\u00eb jet\u00eb
  mbledhur rr\u00ebth vrim\u00ebs s\u00eb daljes s\u00eb tingullit. Mos provoni t\u00eb
  pastroni mbrojt\u00ebsen nga dylli.\\n\\nN\u00eb qoft\u00eb se vrima e daljes s\u00eb
  tingullit mbetet e blokuar, duhet t\u00eb nd\u00ebrroni mbrojt\u00ebsen nga dylli
  (shihni faqet 37-41).\\n\\nPARALAJMERIM\\n\\nN\u00eb qoft\u00eb se nuk arrini ta
  pastroni mir\u00eb vrim\u00ebn e daljes s\u00eb tingullit, duhet t\u00eb lidheni
  me specialistin e d\u00ebgjimit. Mos futni asgj\u00eb n\u00eb vrim\u00ebn e daljes
  s\u00eb tingullit, meq\u00eb ashtu mund ta d\u00ebmtoni aparatin e d\u00ebgjimit.\\n\\nVentili\\n\\nN\u00eb
  qoft\u00eb se \u00ebsht\u00eb mbledhur dyll\u00eb n\u00eb ventil ose p\u00ebrreth
  vrim\u00ebs s\u00eb ventilit, veproni si m\u00eb posht\u00eb:\\n\\nPastrojeni dyllin
  nga ventil duke e futur vegl\u00ebn heq\u00ebse t\u00eb dyllit p\u00ebrmes vrim\u00ebs.\\n\\nPARALAJMERIM\\n\\nQ\u00eb
  aparati i d\u00ebgjimit t\u00eb funksionoj\u00eb mir\u00eb, ka r\u00ebnd\u00ebsi
  q\u00eb ventil\u00eb t\u00eb mos blokohet kurr\u00eb nga dylli. B\u00ebjeni zakon
  q\u00eb ta pastroni ventilin \u00e7do dit\u00eb! N\u00eb raste t\u00eb rralla, aq
  shum\u00eb dyll\u00eb mund t\u00eb grumbullohet n\u00eb ventil, sa kjo t\u00eb ndikoj\u00eb
  n\u00eb tingullin q\u00eb del nga aparati. N\u00ebse ndodh ashtu, duhet t\u00eb
  lidheni me specialistin e d\u00ebgjimit.\\n\\nMBROJTESJA NGA DYLLI NANOCARE\\n\\nMbrojt\u00ebsja
  nga dylli NanoCare ndihmon p\u00ebr ta mbrojtur aparatin nga dylli i veshit. Gjithnj\u00eb
  p\u00ebrdorni mbrojt\u00ebse nga dylli NanoCare me aparatin tuaj t\u00eb d\u00ebgjimit.
  P\u00ebrndryshe garancia e aparatit t\u00eb d\u00ebgjimit nuk do t\u00eb vlej\u00eb
  m\u00eb.\\n\\nMbrojt\u00ebsja nga dylli NanoCare konsiston n\u00eb pjes\u00ebt e
  m\u00ebposhtme:\\n\\n1. Mbajt\u00ebsja\\n2. Grepi heq\u00ebs\\n3. Mbrojt\u00ebsja
  nga dylli\\n\\nKUJDES\\n\\nMbrojt\u00ebsja nga dylli \u00ebsht\u00eb p\u00ebr nj\u00eb
  p\u00ebrdorim vet\u00ebm dhe pastaj duhet t\u00eb hidhet. Mos provoni t\u00eb pastroni
  mbrojt\u00ebsen nga dylli. Kjo mund ta d\u00ebmtoj\u00eb aparatin e d\u00ebgjimit
  dhe/ose t\u00eb b\u00ebj\u00eb q\u00eb mbrojt\u00ebsja nga dylli t\u00eb shk\u00ebputet
  brenda n\u00eb vesh.\\n\\nNd\u00ebrrimi i mbrojt\u00ebses nga dylli NanoCare\\n\\nFuteni
  grepin heq\u00ebs n\u00eb mbrojt\u00ebsen nga dylli q\u00eb keni instaluar n\u00eb
  vrim\u00ebn e daljes s\u00eb tingullit. Nxirreni mbrojt\u00ebsen nga dylli jasht\u00eb
  duke e t\u00ebrhequr.\\n\\n1. Vrima e ventilit\\n2. Vrima e daljes s\u00eb tingullit\\n3.
  Mbrojt\u00ebsja e p\u00ebrdorur\\n\\nKthejeni mbajt\u00ebsen p\u00ebrmbyt, n\u00eb
  m\u00ebnyr\u00eb q\u00eb mbrojt\u00ebsja e re t\u00eb jet\u00eb n\u00eb pozicion
  p\u00ebr t\u2019u futur.\\n\\nFuteni mbajt\u00ebsen n\u00eb vrim\u00ebn e daljes
  s\u00eb tingullit dhe shtyjeni me kujdes p\u00ebr ta futur n\u00eb vend.\\n\\nPastaj
  nxirreni mbajt\u00ebsen jasht\u00eb duke e t\u00ebrhequr. Mbrojt\u00ebsja e re nga
  dylli do t\u00eb shk\u00ebputet automatikisht nga mbajt\u00ebsja. Shtyjeni me kujdes
  aparatin e d\u00ebgjimit ndaj nj\u00eb sip\u00ebrfaqeje t\u00eb shesht\u00eb, p\u00ebr
  t\u2019u siguruar se mbrojt\u00ebsja nga dylli ka z\u00ebn\u00eb vend mir\u00eb.\\n\\nHidheni
  n\u00eb plehra mbajt\u00ebsen me mbrojt\u00ebsen e p\u00ebrdorur.\\n\\nSe sa shpesh
  duhet nd\u00ebrruar mbrojt\u00ebsja nga dylli NanoCare, kjo ndryshon nga nj\u00eb
  person n\u00eb tjetrin.\\n\\nPo t\u00eb keni pyetje n\u00eb lidhje me mbrojt\u00ebsen
  tuaj nga dylli NanoCare, lidhuni me specialistin e d\u00ebgjimit.\\n\\nPARALAJMERIM\\n\\nN\u00eb
  qoft\u00eb se mbrojt\u00ebsja kund\u00ebr dyllit nuk z\u00eb vend mir\u00eb, hidheni
  n\u00eb plehra dhe p\u00ebrdorni nj\u00eb tjet\u00ebr. N\u00eb qoft\u00eb se mbrojt\u00ebsja
  nga dylli shk\u00ebputet nga aparati i d\u00ebgjimit kur ky \u00ebsht\u00eb n\u00eb
  kanalin e veshit, lidhuni me mjekun. Mos u p\u00ebrpiqni ta hiqni ju vet\u00eb mbrojt\u00ebsen
  nga kanali.\\n\\nAKSESORET\\n\\nTelekomanda\\nTelekomanda ju jep nj\u00eb num\u00ebr
  opsonesh shtes\u00eb.\\n\\nT-DEX\\nNj\u00eb pajisje p\u00ebr t\u2019i lidhur aparatet
  e d\u00ebgjimit me telefonat celular\u00eb duke p\u00ebrdorur telebabin\u00ebn.\\n\\nSpecialisti
  juaj i d\u00ebgjimit do t\u2019ju ndihmoj\u00eb t\u00eb vendosni n\u00ebse do t\u00eb
  mund t\u00eb p\u00ebrfitoni nga nj\u00eb telekomand\u00eb ose ndonj\u00eb aksesor
  tjeter.\\n\\nN\u00cb RAST KEQFUNKSIONIMI\\n\\nFaqet e m\u00ebposhtme p\u00ebrmbajn\u00eb
  disa k\u00ebshilla t\u00eb shpejta nqs aparati juaj i d\u00ebgjimit ndalon s\u00eb
  punuari ose nuk funksionon si\u00e7 duhet. Nqs problemi vazhdon, kontakto me specialistin
  tuaj t\u00eb aparateve t\u00eb d\u00ebgjimit p\u00ebr assistenc\u00eb teknike.\\n\\n|
