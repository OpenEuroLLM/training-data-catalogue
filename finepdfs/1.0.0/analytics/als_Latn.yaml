  N\u00eb fund t\u00eb ke\u00ebsaj grupkolone \u00ebsht\u00eb totali i shpenzimeve
  p\u00ebr secilin kandidat.\\n\\n0\\n\\n0\\n\\n7.380\"", "\"VENDIM\\n\\nNr.315, dat\u00eb
