  122 raste dhe 2018 rezultojn\u00eb 67 raste.\\n   **Kriteri:** Sakt\u00ebsi n\u00eb
  hedhjen e t\u00eb dh\u00ebnave.\\n   **Ndikimi/efekti:** T\u00eb dh\u00ebna t\u00eb
  pasakta.\\n   **Shkaku:** Regjistrim i gabuar i t\u00eb dh\u00ebnave.\\n\\nR\u00ebnd\u00ebsia:
  E lart\u00eb.\\n\\nRekomandimi:- QKB t\u00eb marr\u00eb masa p\u00ebr analizimin
  e anomalive t\u00eb konstatuara nga auditimi i inputeve t\u00eb t\u00eb dh\u00ebnave
