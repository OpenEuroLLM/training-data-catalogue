  Ky veprim \u00ebsht\u00eb n\u00eb kund\u00ebrshtim me:\\n\\n| Kontrata 11807/1,
  dat\u00eb 16.01.2017 \u201cMNSH\u201d pika 1.6 \u201cT\u00eb drejtat dhe detyrimet
  e Kontraktuesit\u201d: |\\n| --- |\\n| N\u00ebnpika 1, ku cil\u00ebsohet: \u201cT\u00eb
