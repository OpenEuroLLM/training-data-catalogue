  SEITI\\n\\nAN\u00cbTAR\\nMOISI DUDA\\n\\nAN\u00cbTAR\\nTARTAR BAZAJ\"", "\"Kush
  e shkroi ungjillin sipas \\\"Gjonit\\\"\\n\\nDescription\\n\\nRaymond Brown\\n\\nFragment
  i shk\u00ebputur nga libri i Raymond Brown-it me titull: ''An Introduction to the
  New Testament, Doubleday Publisher, New York 1996\\n\\nUngjilli i Gjonit t\u00ebrheq
  v\u00ebmendjen p\u00ebr ekzistenc\u00ebn e nj\u00eb d\u00ebshmitari okular n\u00eb
  kryq\u00ebzimin e Jezusit (19:35), q\u00eb mesa dukej \u00ebsht\u00eb \\\"dishepulli
  i preferuar i Jezusit\\\" 1 (19:26). Gjoni 21:20, 24 pohon se ky dishepull i preferuar
  \u00ebsht\u00eb d\u00ebshmitari dhe autori i gj\u00ebrave t\u00eb shkruara n\u00eb
  k\u00ebt\u00eb ungjill. Ireneusi (rreth 180 e.r.s) e nj\u00ebsoi k\u00ebt\u00eb
  dishepull me Gjonin (nj\u00eb prej dishepujve) i cili kishte jetuar n\u00eb Efez
  2 deri n\u00eb koh\u00ebn e Trajanit (rreth 98 e.r.s.). Kur kishte qen\u00eb f\u00ebmij\u00eb
  Ireneusi kishte njohur Polikarpin, peshkopin e Smyrna, i cili hamend\u00ebsohej
  se e kishte njohur Gjonin). Identifikimi i dishepullit t\u00eb preferuar me Gjonin
  (birin e Zebedeut), me pak ndryshim, u pranua nga kisha si i v\u00ebrtet\u00eb.
  Sidoqoft\u00eb, si\u00e7 e kemi th\u00ebn\u00eb m\u00eb par\u00eb (f. 109), sot
  pranohet gjer\u00ebsisht se ky hamend\u00ebsim i fund shekullit t\u00eb dyt\u00eb
  n\u00eb lidhje me nj\u00eb figur\u00eb e cila ka jetuar nj\u00eb shekull m\u00eb
  par\u00eb, shpesh ka qen\u00eb shum\u00eb i thjesht\u00ebzuar. Ndonj\u00ebher\u00eb
  traditat n\u00eb lidhje me autor\u00ebsin\u00eb e nj\u00eb vepre kan\u00eb qen\u00eb
  m\u00eb shum\u00eb t\u00eb shqet\u00ebsuara p\u00ebr autoritetin q\u00eb q\u00ebndronte
  pas nj\u00eb shkrimi biblik sesa me autorin fizik t\u00eb shkrimit. Si n\u00eb rastin
  e ungjijve t\u00eb tjer\u00eb edhe p\u00ebr ungjillin e Gjonit, nga shumica e teolog\u00ebve
  \u00ebsht\u00eb v\u00ebn\u00eb n\u00eb dyshim fakti se ky ungjill \u00ebsht\u00eb
  shkruar nga nj\u00eb d\u00ebshmitar\u00eb okular i ngjarjeve t\u00eb jet\u00ebs
  s\u00eb Jezusit. 3\\n\\nKush \u00ebsht\u00eb dishepulli i preferuar? Kryesisht n\u00eb
  lidhje me k\u00ebt\u00eb \u00e7\u00ebshtje ka tre qasje, s\u00eb pari, disa kan\u00eb
  propozuar nj\u00eb figur\u00eb t\u00eb njohur t\u00eb Dhjat\u00ebs s\u00eb Re, si
  nj\u00eb kandidat shtes\u00eb ndaj atij tradicionalit (Gjonit birit t\u00eb Zebedeut),
  propozime t\u00eb tjera kan\u00eb p\u00ebrfshir\u00eb figura si Lazari, Gjon Marku
  dhe Thomai (Chalesworth). Ndon\u00ebse mund t\u00eb gjenden pasazhe p\u00ebr t\u00eb
  mb\u00ebshtetur gjithsecilin prej propozimeve, n\u00ebse do t\u00eb anashkalojm\u00eb
  tradit\u00ebn q\u00eb e identifikon Gjonin si autor t\u00eb k\u00ebtij shkrimi,
  \u00e7do alternativ\u00eb tjet\u00ebr mbetet thjesht nj\u00eb hamend\u00ebsim. S\u00eb
  dyti, disa teolog\u00eb e kan\u00eb par\u00eb iden\u00eb e dishepullit t\u00eb preferuar
  thjesht si nj\u00eb figur\u00eb simbolike, i krijuar p\u00ebr t''iu p\u00ebrshtatur
  figur\u00ebs s\u00eb dishepullit t\u00eb preferuar. Fakti q\u00eb ai nuk p\u00ebrmendet
  asnj\u00ebher\u00eb me em\u00ebr si dhe fakti se ai shfaqet pran\u00eb Pjetrit n\u00eb
  skenat q\u00eb na b\u00ebhen t\u00eb njohura n\u00eb ungjijt\u00eb sinoptik\u00eb
  dhe nj\u00eb figur\u00eb e till\u00eb nuk p\u00ebrmendet 4 \u00ebsht\u00eb marr\u00eb
  nga disa si prov\u00eb p\u00ebr johistoricitetin e k\u00ebsaj figure. Gjithsesi,
  nj\u00eb tjet\u00ebr figur\u00eb e paem\u00ebrtuar tek Gjoni e cila ka nj\u00eb
  rol simbolik dhe shfaqet n\u00eb rr\u00ebfimin e tij aty ku ungjijt\u00eb sinoptik
  nuk p\u00ebrmendin nj\u00eb fakt t\u00eb till\u00eb, d.m.th n\u00ebna e Jezusit\\n\\nArtikull
  - Erasmusi\\n\\n(2:3-12; 19:25-27), ka qen\u00eb me siguri nj\u00eb figur\u00eb
  historike. Fakti q\u00eb dishepulli i preferuar shfaqet n\u00eb k\u00ebmb\u00ebt
  e Jezusit gjat\u00eb kryq\u00ebzimit t\u00eb tij, n\u00eb nj\u00eb koh\u00eb kur
  t\u00eb gjith\u00eb dishepujt e tjer\u00eb ishin arratisur, tregon vet\u00ebm se
  ai nuk ishte nj\u00eb an\u00ebtar\u00eb i dymb\u00ebdhjet\u00ebshes 5 , e as nj\u00eb
  apostull, nj\u00eb term ky q\u00eb nuk p\u00ebrdoret asnj\u00ebher\u00eb n\u00eb
  ungjillin e Gjonit. S\u00eb treti, teolog\u00eb t\u00eb tjer\u00eb (me t\u00eb cil\u00ebt
  un\u00eb jam i nj\u00eb mendjeje) hamend\u00ebsojn\u00eb se dishepulli i preferuar
  ka qen\u00eb nj\u00eb personazh pa r\u00ebnd\u00ebsi gjat\u00eb jet\u00ebs s\u00eb
  Jezusit, aq i par\u00ebnd\u00ebsish\u00ebm sa p\u00ebr t\u00eb mos u p\u00ebrmendur
  n\u00eb tradit\u00ebn zyrtare t\u00eb paraqitur nga ungjijt\u00eb. Por meqen\u00ebse
  ky personazh u b\u00eb i r\u00ebnd\u00ebsish\u00ebm n\u00eb historin\u00eb e bashk\u00ebsis\u00eb
  ku ai ka jetuar (me shum\u00eb mund\u00ebsi ai ka qen\u00eb themeluesi i saj), ai
  u b\u00eb shembulli ideal n\u00eb portretin e dishepujve n\u00eb ungjillin e tij,
  i aft\u00eb t\u00eb krahasohej me Pjetrin dhe m\u00eb i af\u00ebrti me Jezusin.\\n\\nA
  ishte ky dishepulli i preferuar autori i ungjillit sipas Gjonit? Kjo duket se \u00ebsht\u00eb
  p\u00ebrshtypja q\u00eb t\u00eb l\u00eb pasazhi 21:20, 24: \\\"ai i ka shkruar k\u00ebto
  gj\u00ebra\\\". A mund t\u00eb ket\u00eb qen\u00eb ky nj\u00eb thjesht\u00ebzim
  i b\u00ebr\u00eb nga redaktori dhe autori i kapitullit 21, i cili ka theksuar pohimin
  m\u00eb t\u00eb sakt\u00eb q\u00eb gjendet tek 19:35: \\\"Dhe ai q\u00eb ka par\u00eb,
  ka d\u00ebshmuar p\u00ebr k\u00ebt\u00eb, dhe d\u00ebshmia e tij \u00ebsht\u00eb
  e v\u00ebrtet\u00eb; dhe ai e di se thot\u00eb t\u00eb v\u00ebrtet\u00ebn, q\u00eb
  ju t\u00eb besoni\\\"  Pasazhi i lartp\u00ebrmendur mund t\u00eb n\u00ebnkuptoj\u00eb
  faktin se dishepulli i preferuar nuk \u00ebsht\u00eb autori i ungjijve por d\u00ebshmitar\u00eb
  i jet\u00ebs s\u00eb Jezusit, p\u00ebr rrjedhoj\u00eb burimi i traditave q\u00eb
  jan\u00eb p\u00ebrfshir\u00eb n\u00eb ungjillin e kat\u00ebrt. Ungjillori q\u00eb
  e ka shkruar k\u00ebt\u00eb pasazh mund t\u00eb ket\u00eb qen\u00eb ndonj\u00eb
  ndjek\u00ebs apo dishepull i dishepullit t\u00eb preferuar (t\u00eb cilin e ai e
  p\u00ebrshkruan n\u00eb vet\u00eb t\u00eb tret\u00eb) dhe jo nj\u00eb d\u00ebshmitar\u00eb
  okular i ngjarjeve q\u00eb rr\u00ebfen. N\u00eb t\u00eb v\u00ebrtet\u00eb n\u00ebse
  do t\u00eb caktojm\u00eb p\u00ebr letrat e Gjonit (shih faqe 389 e m\u00eb posht\u00eb)
  nj\u00eb tjet\u00ebr autor si dhe ekzistenc\u00ebn e nj\u00eb redaktori p\u00ebr
  ungjillin, at\u00ebher\u00eb duhet t\u00eb biem dakord me ata t\u00eb cil\u00ebt
  hamend\u00ebsojn\u00eb ekzistenc\u00ebn e nj\u00eb \\\"shkolle Johaniane\\\" 6 ,
  d.m.th. dishepuj t\u00eb ndrysh\u00ebm q\u00eb kan\u00eb p\u00ebrdorur si stilin
  ashtu edhe materialin tradicional t\u00eb bashk\u00ebsis\u00eb s\u00eb tyre, tradicional
  p\u00ebr arsye se krejt\u00ebsisht apo pjes\u00ebrisht ai ishte modeluar nga dishepulli
  i preferuar.\\n\\nKjo hipotez\u00eb mund t\u00eb shpjegoj\u00eb faktin se p\u00ebrse
  disa faktor\u00eb n\u00eb ungjillin e Gjonit 7 me shum\u00eb mund\u00ebsi reflektojn\u00eb
  v\u00ebrtet\u00ebsi n\u00eb lidhje me ngjarjet e jet\u00ebs ministrore t\u00eb Jezusit
  nd\u00ebrsa disa t\u00eb tjer\u00eb duken shum\u00eb larg prej saj:\\n\\n1. Familjariteti
  me Palestin\u00ebn. Gjoni e njeh vendndodhjen e Betanis\u00eb (11:18), kopshtin
  p\u00ebrgjat\u00eb Kidronit (18:1), portikun e tempullit t\u00eb Salomonit (10:23),
  pellgun Betesda (5:2) at\u00eb t\u00eb Siloamit (9:7), si dhe kalldr\u00ebmin (Gabatha)
  (19:13). K\u00ebto vende nuk jan\u00eb p\u00ebrmendur tek ungjijt\u00eb e tjer\u00eb,
  e n\u00eb disa raste provat e jashtme u kan\u00eb mb\u00ebshtetur historicitetin
  e k\u00ebtyre t\u00eb dh\u00ebnave t\u00eb p\u00ebrmendura n\u00eb ungjillin e Gjonit.
  T\u00eb tjera t\u00eb dh\u00ebna t\u00eb p\u00ebrmendura nga Gjoni (Betania p\u00ebrtej
  Jordanit tek 1:28, Enonin af\u00ebr Salimit tek 3:23) nuk jan\u00eb identifikuar
  ende, por duhet t\u00eb jemi t\u00eb kujdessh\u00ebm e t\u00eb mos i shohim k\u00ebta
  emra si thjesht simbolik\u00eb.\\n2. Familjariteti me fen\u00eb Judaike. Festat
  judaike jan\u00eb p\u00ebrmendur tek 5:9; 6:4; 7:22; dhe 10:22, dhe dialog\u00ebt
  e tjer\u00eb tregojn\u00eb p\u00ebr nj\u00eb njohje t\u00eb ceremonive dhe teologjis\u00eb
  t\u00eb festave. Zakonet hebraike jan\u00eb p\u00ebrmendur n\u00eb m\u00ebnyr\u00eb
  eksplicite (rregullat e pastrimit 2:6; 18:28; qengji i pashk\u00ebs 19:36) si edhe
  n\u00eb m\u00ebnyr\u00eb implicite (ndoshta m\u00ebnyra e punimit t\u00eb tunik\u00ebs
  s\u00eb kryepriftit 19:23).\\n\\nN\u00ebse tradita q\u00eb q\u00ebndron pas Gjonit
  \u00ebsht\u00eb e ngulitur thell\u00eb n\u00eb Judaizmin dhe Palestin\u00ebn e asaj
  kohe 8 , paraqitja e asaj tradite ka l\u00ebvizur ndjesh\u00ebm p\u00ebrtej jet\u00ebs
  ministrore t\u00eb Jezusit. N\u00eb t\u00eb v\u00ebrtet\u00eb, vet\u00eb ungjillori
  e pranon nj\u00eb fakt t\u00eb till\u00eb (2:22) dhe e mbron k\u00ebt\u00eb zhvillim
  duke e njohur si nj\u00eb proces t\u00eb udh\u00ebzuar nga Fryma-Parakleti (16:12-14).
  Ata t\u00eb cil\u00ebt pranonin Jezusin, sipas ungjillit t\u00eb Gjonit, p\u00ebrjashtoheshin
  nga Sinagoga (9:22; 12:43). Madje, t\u00eb krishter\u00ebt vriteshin nga an\u00ebtar\u00eb
  t\u00eb devotsh\u00ebm t\u00eb sinagog\u00ebs (16:2). Ne e kemi par\u00eb m\u00eb
  par\u00eb se p\u00ebrdorimi i fjal\u00ebs \\\"\u00e7ifut\\\" nga Gjoni, reflekton
  nj\u00eb zakon t\u00eb zhvilluar n\u00eb bashk\u00ebsin\u00eb e tij. Ndryshe nga
  Jezusi i paraqitur nga ungjijt\u00eb sinoptik, Jezusi i Gjonit\\n\\nArtikull - Erasmusi\\n\\nshprehet
  haptazi p\u00ebr hyjnin\u00eb dhe para-ekzistenc\u00ebn e tij (8:58; 10:30-38; 14:9;
  17:5). Ai \u00ebsht\u00eb nderuar si Per\u00ebndi (5:16-18; 19:17). Veprimet tradicionale
  t\u00eb Jezusit, si sh\u00ebrimi i t\u00eb gjymtuarit, shum\u00ebfishimi i buk\u00ebve,
  sh\u00ebrimi i t\u00eb verb\u00ebrve, jan\u00eb b\u00ebr\u00eb subjekt i predikimeve
  t\u00eb gjata q\u00eb p\u00ebrfshin\u00eb reflektime teologjike dhe debate rreth
  interpretimit t\u00eb shkrimeve hebraike (5:30-47; 6:30-51a; 9:26-34). Ndryshe nga
  tradita e sinoptik\u00ebve, nj\u00eb grup jo pa r\u00ebnd\u00ebsi Samaritan\u00ebsh
  besuan n\u00eb Jezusin n\u00eb m\u00ebnyr\u00eb t\u00eb pavarur nga ndjek\u00ebsit
  e tij t\u00eb par\u00eb (4:28-42).\\n\\nKy zhvillim mund t\u00eb kuptohet vet\u00ebm
  n\u00ebse besojm\u00eb se traditat p\u00ebr Jezusin q\u00eb kishin p\u00ebr burim
  dishepullin e preferuar, kan\u00eb p\u00ebsuar shtjellime t\u00eb m\u00ebtejshme
  gjat\u00eb viteve dhe jan\u00eb zgjeruar mbi baz\u00ebn e eksperiencave t\u00eb
  ndryshme t\u00eb bashk\u00ebsis\u00eb s\u00eb Gjonit. Duke filluar me pranimin e
  Jezusit si profeti p\u00ebrfundimtar\u00eb dhe Mesiah i pritshm\u00ebrive t\u00eb
  hebrenjve (1:40-49), tradita m\u00eb pas ka kaluar n\u00eb gj\u00ebra m\u00eb t\u00eb
  m\u00ebdha (1:50). Jezusi, n\u00eb t\u00eb, nuk \u00ebsht\u00eb m\u00eb Biri i Njeriut
  q\u00eb do t\u00eb vinte nga qielli n\u00eb fund t\u00eb dit\u00ebve p\u00ebr t\u00eb
  gjykuar bot\u00ebn, sipas k\u00ebtij ungjilli, ora e fundit tashm\u00eb kishte ardhur
  dhe ai kishte zbritur. Sekreti i jet\u00ebs ministrore t\u00eb tij ishte ky: \u00e7do
  gj\u00eb q\u00eb ai kishte th\u00ebn\u00eb edhe b\u00ebr\u00eb ishte ajo q\u00eb
  ai kishte d\u00ebgjuar dhe par\u00eb kur kishte qen\u00eb me Per\u00ebndin\u00eb
  para se Fjala t\u00eb b\u00ebhej mish (5:19; 8:28; 12:49). Izraelit\u00ebt besuan
  n\u00eb Moisiun i cili u ngjit n\u00eb malin Sinai dhe kontaktoi atje me Per\u00ebndin\u00eb,
  e m\u00eb pas u kthye p\u00ebr t\u00eb th\u00ebn\u00eb at\u00eb q\u00eb kishte d\u00ebgjuar,
  por Jezusi ishte m\u00eb i madh se kaq. Ai nuk kishte nevoj\u00eb t\u00eb ngjitej
  p\u00ebr tek Zoti por kishte ardhur nga lart ku kishte par\u00eb Per\u00ebndin\u00eb,
  k\u00ebshtu q\u00eb kushdo q\u00eb do t\u00eb besonte n\u00eb t\u00eb nuk do t\u00eb
  p\u00ebrjetonte Gjyqin (3:10-21) 9 . Dishepulli i preferuar mund t\u00eb ket\u00eb
  jetuar p\u00ebrmes zhvillimeve historike t\u00eb bashk\u00ebsis\u00eb (ndoshta edhe
  p\u00ebrmes p\u00ebrjashtimit nga sinagoga), n\u00eb k\u00ebt\u00eb m\u00ebnyr\u00eb
  mund t\u00eb ket\u00eb pasur nj\u00eb lloj simbioze nd\u00ebrmjet tij dhe ungjillit
  i cili kishte marr\u00eb p\u00ebrsip\u00ebr t\u00eb shkruante nj\u00eb tradit\u00eb
  e cila jo vet\u00ebm i kishte rr\u00ebnj\u00ebt e saj n\u00eb eksperienc\u00ebn
  e tij p\u00ebr Jezusin, por gjithashtu ajo trup\u00ebzonte dekada t\u00eb reflektimit
  mbi at\u00eb eksperienc\u00eb. Ungjillori, i cili e ka shkrir\u00eb k\u00ebt\u00eb
  reflektim mbi tradit\u00ebn n\u00eb nj\u00eb vep\u00ebr me zhd\u00ebrvjellt\u00ebsi
  letrare unike, me shum\u00eb mund\u00ebsi mund t\u00eb ket\u00eb qen\u00eb nj\u00eb
  dishepull i dishepullit t\u00eb preferuar, rreth t\u00eb cilit ai ka folur n\u00eb
  vet\u00eb t\u00eb tret\u00eb. M\u00eb pas redaktori, gjithnj\u00eb n\u00ebse ka
  pasur nj\u00eb t\u00eb till\u00eb, mund t\u00eb ket\u00eb qen\u00eb nj\u00eb tjet\u00ebr
  dishepull.\\n\\nP\u00ebrkthyesi: Rezart Beka\\n\\n[*] At\u00eb Raymond Brown \u00ebsht\u00eb
  Distinguished Professor Emeritus of Biblical Studies n\u00eb Union Theological Semminary
  (N.Y.C.). Ai konsiderohet si nj\u00eb prej figurave qendrore nd\u00ebrmjet shkollar\u00ebve
  t\u00eb Dhjat\u00ebs s\u00eb Re. Gjat\u00eb jet\u00ebs s\u00eb tij ka marr\u00eb
  m\u00ebse tridhjet\u00eb \\\"honorary degrees\\\" nga universitetet katolike dhe
  protestante nga e gjith\u00eb bota, gjithashtu, ai \u00ebsht\u00eb zgjedhur si (Corresponding)
  Fellow of the British Academy dhe an\u00ebtar i Akademis\u00eb Amerikan\u00eb t\u00eb
  arteve dhe shkencave. Autor i m\u00ebse tridhjet\u00eb e pes\u00eb librave n\u00eb
  lidhje me Bibl\u00ebn, po ashtu ka qen\u00eb i vetmi amerikan q\u00eb \u00ebsht\u00eb
  zgjedhur nga dy pap\u00eb si an\u00ebtar\u00eb i Komisionit biblik papnor.\\n\\nReferenca\\n\\n[1]
  Nd\u00ebrmjet literatur\u00ebs n\u00eb lidhje me identitetin e dishepullit t\u00eb
  preferuar shih: \\\" P.S. Minear, NovT 19 (1997), 105-23; M. Pamment ExpTim (1982-83),
  363-367; B. Byrne, JSNT 23 (1985), 83-97; J. A. Grassi, The Secret Identity of the
  Beloved Disciple (New York: Paulist, 1992); J.H. Chalesworth, The Beloved Disciple
  (Valley Forge, PA: Trinity, 1995).\\n\\n[2] Ky lokalizim mund t\u00eb shihet si
  aspekti m\u00eb q\u00ebndruesh\u00ebm i informacionit q\u00eb jep Ireneusi (AH 3.1.1),
  sepse ndoshta ende shumica e teolog\u00ebve mendojn\u00eb se ky ungjill \u00ebsht\u00eb
  shkruar n\u00eb Efez. Shih S. Van Tilborg, Reading John in Ephesus (Leiden:Brill,
  1996). Nj\u00eb minoritet dometh\u00ebn\u00ebs kan\u00eb sugjeruar Sirin\u00eb si
  vendin e p\u00ebrpilimit t\u00eb k\u00ebtij ungjilli, n\u00eb raste t\u00eb rralla
  ka pasur z\u00ebra edhe p\u00ebr Aleksandrin\u00eb. Nd\u00ebrsa p\u00ebr\\n\\nArtikull
  - Erasmusi\\n\\nsa i p\u00ebrket traditave n\u00eb lidhje me Gjonin shih: R.A. Culpepper,
  John, the Son of Zebedee. The Life of a Legend (Columbia, SC: Univ. of South Carolina,
  1994). M.-\u00c9 Boismard, shkruar n\u00eb gjuh\u00ebn fr\u00ebnge n\u00eb 1996,
  ka grumbulluar evidenca t\u00eb bollshme p\u00ebr t\u00eb treguar se Gjoni i v\u00ebrtet\u00eb
  ka vdekur me v\u00ebllan\u00eb e tij Jakob n\u00eb Jerusalem n\u00eb fillim t\u00eb
  viteve 40 e.r.s., por m\u00eb pas ai \u00ebsht\u00eb ngat\u00ebrruar me priftin
  Gjon/ plaku i Efezit (shih fq. 398 e m\u00ebposht\u00eb). Sidoqoft\u00eb Gjoni \u00ebsht\u00eb
  takuar me Palin n\u00eb takimin e mbajtur n\u00eb Jeruzalem (Galatasve 2:9) t\u00eb
  cilin shumica e specialist\u00ebve e vendosin rreth vitit 49 (shih Tabel\u00ebn
  6 n\u00eb kapitullin 16).\\n\\n[3] Nj\u00eb p\u00ebrjashtim i r\u00ebnd\u00ebsish\u00ebm
  \u00ebsht\u00eb ai i Hengelit, \\\"Question\\\", i cili e identifikon k\u00ebt\u00eb
  autor me Gjon plakun (jo Gjon apostullin), i cili ishte kryetari i nj\u00eb shkolle
  n\u00eb Azin\u00eb e Vog\u00ebl, ku kishte ardhur nga Palestina. Duke qen\u00eb
  ende i ri ai kishte njohur Jezusin, m\u00eb pas ai e kishte nd\u00ebrtuar imazhin
  e tij sipas modelit t\u00eb dishepullit t\u00eb preferuar.\\n[3] Krahaso Markun
  14:18-21; 14:54; 16:1-4 me Gjonin 13:23-26; 18:15-18; 20:1-10. Nuk ekziston asnj\u00eb
  paralel tek ungjijt\u00eb Sinoptik\u00eb p\u00ebr Gjonin 21:20-23.\\n[4] P\u00ebr
  tradita t\u00eb cilat pohojn\u00eb se kan\u00eb ekzistuar m\u00eb shum\u00eb dishepuj
  t\u00eb Jezusit se sa vet\u00ebm dymb\u00ebdhjet\u00ebshja tradicionale, shih Raymond
  Brown, Death of Messiah, v\u00ebllimi 2, fq. 1017-1018, 11711173.\\n[5] shih Culpepper,
  School 258-59, p\u00ebr kuptimin e mundsh\u00ebm t\u00eb k\u00ebtij p\u00ebrcaktimi.\\n[6]
  Ne do t\u00eb vazhdojm\u00eb ti quajm\u00eb si ungjillin ashtu edhe ungjillorin
  me emrin Gjon, pavar\u00ebsisht se kush kan\u00eb qen\u00eb n\u00eb t\u00eb v\u00ebrtet\u00eb
  dishepulli i preferuar dhe autori i ungjillit.\\n[7] Bultman-i ka pretenduar se
  nj\u00eb nga burimet q\u00eb q\u00ebndron pas Gjonit (i quajtur fjalimet zbuluese
