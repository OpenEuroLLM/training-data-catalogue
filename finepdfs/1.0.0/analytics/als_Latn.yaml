  n\u00eb proces zbatimi kontrata \\\"Marr\u00ebveshje e Nivelit t\u00eb Sh\u00ebrbimit\\\"
  sipas Kontrat\u00ebs nr. 6923/1, dat\u00eb 08.09.2016 me objekt \\\"Mir\u00ebmbajtje
  sistemit elektronik t\u00eb QKR\\\", t\u00eb lidhur mes pal\u00ebve Qendra Komb\u00ebtare
  e Biznesit (Autoriteti Kontraktor) dhe Operatori Ekonomik. Vlera e kontrat\u00ebs
  si m\u00eb posht\u00eb:\\n\\n| Vlera totale | 36 Muaj | 12 Muaj- 2017 | Mujore-2017
  |\\n|--------------|---------|---------------|-------------|\\n| Vlera e mir\u00ebmbajtjes
  | 48,630,000 | 16,210,000 | 3,350,834 |\\n| Vlera p\u00ebr zhvillimet | 1,080,667
  | | |\\n| Vlera p\u00ebr zhvillimet | 270,166 | | |\\n\\nMbi zbatimin e kontrat\u00ebs:\\n\\nN\u00eb
  zbatim t\u00eb pik\u00ebs 1 \u201cAuditimi i Marr\u00ebveshjeve t\u00eb Nivelit
  t\u00eb Sh\u00ebrbimit (MNSH)\u201d t\u00eb programit t\u00eb auditimit u shqyrtua
  dokumentacioni si m\u00eb posht\u00eb:\\n\\n- Termat e referenc\u00ebs t\u00eb miratuara
  nga AKSHI, pjes\u00eb e DT;\\n- Kriteret e ve\u00e7anta p\u00ebr kualifikim;\\n-
  Kontrata e lidhur mes pal\u00ebve dhe anekset e saj;\\n- Raportet e monitorimit;\\n-
  Faturat tatimore t\u00eb likuidimit t\u00eb vlerave mujore p\u00ebr sh\u00ebrbimin
  e kryer.\\n\\nP\u00ebr zbatimin e k\u00ebsaj kontrate me Urdh\u00ebr t\u00eb Titullarit
  nr. 107, dat\u00eb 13.09.2016 grupi\u2026.\\n\\nNga auditimi u konstatua:\\n\\n1.
  Titulli i gjetjes: \u201cMbi dokumentimin e monitorimit dhe zbatimit t\u00eb kontrat\u00ebs
  nga AK\u201d.\\n\\nNga auditimi ka rezultuar se nga Komisioni p\u00ebrgjegj\u00ebs
  p\u00ebr monitorimin dhe zbatimin e k\u00ebsaj kontrate nuk jan\u00eb mbajtur Procesverbale
  t\u00eb pranimit t\u00eb sh\u00ebrbimit apo kryerjes s\u00eb kontrolleve t\u00eb
  matjes s\u00eb cil\u00ebsis\u00eb s\u00eb sh\u00ebrbimit nga ana e tij.\\n\\nKriteri:
  Ky veprim \u00ebsht\u00eb n\u00eb kund\u00ebrshtim me VKM nr. 914, dat\u00eb 29.12.2014,
  nen\u0131 77 \u201cMbik\u00ebqyrja e kontrat\u00ebs\u201d, pika 3 ku cil\u00ebsohet:\\n\\n\u201cP\u00ebr
  t\u2019u siguruar n\u00ebse cil\u00ebsia e pun\u00ebve, sh\u00ebrbimeve ose e mallrave
  \u00ebsht\u00eb e nj\u00ebjt\u00eb me cil\u00ebsin\u00eb p\u00ebr t\u00eb cil\u00ebn
  \u00ebsht\u00eb shpallur fitues kontraktori, autoriteti kontraktor duhet t\u00eb
  monitoroje zbatimin e kontrat\u00ebs dhe n\u00eb rast t\u00eb shkeljes s\u00eb kushteve
  t\u00eb k\u00ebrkuara zbaton penalitetet e parashikuara n\u00eb kontrat\u00eb. Autoriteti
  kontraktor, gjat\u00eb kryerjes s\u00eb kontrolleve, mban procesverbal me shkrim
  n\u00eb prani t\u00eb kontraktorit. N\u00eb rast se kontraktori nuk \u00ebsht\u00eb
  i pranimsh\u00ebm, autoriteti kontraktor ia komunikon me shkrim p\u00ebrmbajtjen
  e k\u00ebtij procesverbali\u201d.\\n\\nKomisioni i zbatimit t\u00eb kontrat\u00ebs
  ka vepruar n\u00eb kund\u00ebrshtim me MFK, nen\u0131 4, pika 19 ku cil\u00ebsohet:\\n\\n\u201cGjurma
  e auditimit\u201d p\u00ebrfaq\u00ebson rrjedh\u00ebn e dokumentuar t\u00eb transaksioneve
  financiare dhe t\u00eb transaksioneve t\u00eb tjera, nga fillimi deri n\u00eb p\u00ebrfundim
  t\u00eb tyre, q\u00eb synon t\u00eb rip\u00ebrshkoj\u00eb t\u00eb gjitha veprimtarit\u00eb
  individuale dhe vendimmarrjen lidhur me to. Ajo p\u00ebrfsihen mbajtjen e dokumentacionit,
  raportimin, kontabilitetin dhe sistemin e mbajtjes s\u00eb dosjeve\u201d.\\n\\nNdikimi/efekti:
  Nuk ka gjurm\u00eb p\u00ebr verifikimin e proceseve t\u00eb mbajtjes t\u00eb kryera
  nga Kontraktuesi dhe t\u00eb kontrolluara nga AK, gjat\u00eb zbatimit t\u00eb kontrat\u00ebs.\\n\\nShkaku:
  Mosveprim i komisionit p\u00ebrgjegj\u00ebs p\u00ebr monitorimin dhe zbatimin e
  kontrat\u00ebs n\u00eb p\u00ebrputhje me k\u00ebrkesat e saj.\\n\\nR\u00ebnd\u00ebsia
  e shkeljes: E mesme\\n\\n2. Titulli i gjetjes: Mbi personelin q\u00eb ka kryer mir\u00ebmbajtjen
  e kontrat\u00ebs.\\n\\nNga auditimi rezultoi se BOE \u201cIntracom Telecom Albania
  SHA dhe Horizon shpk\u201d, nuk ka paraqitur struktur\u00ebn organizative dhe punonj\u00ebsit
  me certifikimet specifike n\u00ebp\u00ebrmjet t\u00eb cilave v\u00ebrteton p\u00ebrmbushjen
  e kapaciteteit tekniko-profesional sipas k\u00ebrkesave n\u00eb DT.\\n\\nKy veprim
  \u00ebsht\u00eb n\u00eb kund\u00ebrshtim me Kushtet e ve\u00e7anta t\u00eb kontrat\u00ebs,
  ku cil\u00ebsohet:\\n\\n14.8 Autoriteti Kontraktues pranon qe n\u00ebp\u00ebrmjet
  k\u00ebsaj kontrate ka autorizuar personelin e Kontraktuesit p\u00ebr te hyre ne
  ambientet e veta, ne sistemet informative dhe ne pajisjet kompjuterike, qe kane
  lidhje me realizimin e objektit te k\u00ebsaj kontrate, autorizim i cili zgjatet
  deri ne p\u00ebrfundim te garancis\u00eb se dh\u00ebne p\u00ebr k\u00ebt\u00eb kontrate.\\n\\nMe
  aneksin 4 \u201cPropozimi teknik\u201d ku cil\u00ebsohet:\\n\\n13. Brenda 30 dit\u00ebve
  pas n\u00ebnshkrimit te kontrat\u00ebs ofruesi i sh\u00ebrbimit bashkimi i operatoreve
  ekonomik Intracom Telecom Albania SHA dhe Horizon SHPK do te paraqes\u00eb nj\u00eb
  plan ne te cilin te p\u00ebrshtrohen holl\u00ebsisht te gjitha veprimet qe do te
  nd\u00ebrmerr\u00ebn p\u00ebr te suportuar\\n\\nsistemin e QKR-se, i cili do te
  p\u00ebrmbaj\u00eb minimalisht:\\na. Personelin e kompanis\u00eb - struktura organizative
  dhe numri i punonj\u00ebsve q\u00eb do t\u00eb suportojn\u00eb aktivitetet e sh\u00ebrbimit
  si dhe certifikimet respektive.\\n\\nNga auditimi ka rezultuar se personat t\u00eb
  cil\u00ebt kan\u00eb kryer mir\u00ebmbajtjen e regjistrit elektronik t\u00eb QKR-s\u00eb
  nuk na u paraqit dokumentacioni i tyre.\\n\\nNdikimi/efekti: Ndikon n\u00eb cil\u00ebsin\u00eb
  dhe koh\u00ebn e ofrimit t\u00eb sh\u00ebrbimit.\\n\\nShkaku: Grupi i pun\u00ebs
  i ngarkuar p\u00ebr monitorimin e zbatimit t\u00eb kontrat\u00ebs, nuk ka kryer
  kontrollin mbi personalin q\u00eb ka kryer mir\u00ebmbajtjen dhe atij t\u00eb deklaruar
  n\u00eb DT nga BOE (kontraktuesi).\\n\\nR\u00ebnd\u00ebsia e shkeljes: E mesme\\n\\n3.
  Titulli i gjetjes: \u201cMbi ruajtjen e konfidencialitetit\u201d\\n\\nNga auditimi
  i konstatua se personeli kompanis\u00eb kontraktuese i cili \u00ebsht\u00eb caktuar
  p\u00ebr kryerjen e k\u00ebtij sh\u00ebrbimi nuk ka dokumentuar ruajtjen e konfidencialitetit
  t\u00eb t\u00eb dh\u00ebnave.\\n\\nKy veprim \u00ebsht\u00eb n\u00eb kund\u00ebrshtrim
  me Kontrat\u00ebn nr. 6923/1, dat\u00eb 08.09.2016 neni 7 \u201cInformacioni Konfidencial\u201d,
  ku cil\u00ebsohet:\\n\\n7.1 Kontraktuesi dhe Autoriteti Kontraktor duhet t\u00eb
  mbajne n\u00eb konfidence t\u00eb gjitha dokurnentat, t\u00eb dhenat dhe informacionet
  e tjera t\u00eb dhena nga pala tjeter n\u00eb lidhje me kontraten.\\n\\n7.2 Kontraktuesi
  mund t\u2019i jape nenkontraktuesit dokumenta t\u00eb till\u00eb, t\u00eb dhena
  ose informacione t\u00eb tjera q\u00eb merr nga Autoriteti Kontraktues deri n\u00eb
  masen e kerkuar p\u00ebr nen-kontraktuesin n\u00eb menyre q\u00eb ai t\u00eb kryeje
  pun\u00ebn e tij sipas kontates. Ne rast t\u00eb till\u00eb, Kontraktuesi duhet
  t\u00eb perfshije n\u00eb kontraten e tij me nenkontraktuesin nj\u00eb dispozite
  q\u00eb premton ruajtjen e konfidenc\u00ebs s\u00ebs: thuhet n\u00eb Paragrafin
  7.1 me sip\u00ebr.\\n\\nNeni 13 \u201cHeqja dhe Zevendesimi i Personelit Kryesor\u201d\\n\\n13.2
  \u201cNese behet e nevojshme te zevendesohet ndonj\u00eb nga personeli kryesor,
  Kontraktuesi duhet te siguroje si zevendesues nje person me kualifikime ekuivalente
  ose me te mira\u201d.\\n\\nNdikimi/efekti: Mos p\u00ebrcaktimi i p\u00ebrgjegj\u00ebsis\u00eb
  n\u00eb rast t\u00eb abuzimit me t\u00eb dh\u00ebnat.\\n\\nShkaku: Nuk \u00ebsht\u00eb
  p\u00ebrcaktuar dokumentimi i zbatimit t\u00eb k\u00ebsaj k\u00ebrkes\u00eb t\u00eb
  kontrat\u00ebs nga OE.\\n\\nR\u00ebnd\u00ebsia e shkeljes: E mesme\\n\\nP\u00ebr
  veprimet dhe mosveprimet e m\u00ebsip\u00ebrme mban p\u00ebrgjegj\u00ebsi: Grupi
  i monitorimit dhe marrjes n\u00eb dor\u00ebzim t\u00eb MNSH.\\n\\nMbi likuidimin
  e kontrat\u00ebs:\\n\\nU verifikua p\u00ebrputhshm\u00ebria midis vler\u00ebs mujore
  sipas kontrat\u00ebs, fatur\u00ebs dhe urdh\u00ebr shpenzimit, p\u00ebr Kontrat\u00ebn
  e MNSH \u201cMir\u00ebmbajtje e sistemit t\u00eb QKR\u201d, ku rezultoi se kryerja
  e likuidimeve mujore t\u00eb sh\u00ebrbimit t\u00eb mir\u00ebmbajtjes, \u00ebsht\u00eb
  i dokumentuar dhe \u00ebsht\u00eb kryer n\u00eb p\u00ebrpunje me vler\u00ebn e p\u00ebrcaktuar
  n\u00eb kontrat\u00eb (trajtuar holl\u00ebsisht n\u00eb PRA).\\n\\n4. \u201cMarr\u00ebveshje
  e Nivelit t\u00eb Sh\u00ebrbimit\u201d me objekt \u201cMir\u00ebmbajtje sistemit
