  2015 dhe 5 raste p\u00ebr vitin 2016.\\n   - Nj\u00eb pjes\u00eb e fushave t\u00eb
  plot\u00ebsuara kan\u00eb vler\u00ebn \u201cNULL\u201d. Sakt\u00ebsisht fushat:
