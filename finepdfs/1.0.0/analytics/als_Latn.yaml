  t\u00eb deklaruar n\u00eb DT nga BOE (kontraktuesi).\\n\\nR\u00ebnd\u00ebsia e shkeljes:
  E mesme\\n\\n4. Titulli i gjetjes: \u201cMbi ruajtjen e konfidencialitetit\u201d\\n\\nSituata:
