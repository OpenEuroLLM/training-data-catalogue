  e parashikura nga ERE n\u00eb \u201dRregulloren p\u00ebr procedurat e l\u00ebnsimit,
  modifikimit, transferimit t\u00eb plot\u00eb / t\u00eb pjessh\u00ebm dhe rinovimit
