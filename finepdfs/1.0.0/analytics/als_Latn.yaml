  e tij sipas kontat\u00ebs. N\u00eb rast t\u00eb till\u00eb, Kontraktuesi duhet t\u00eb
  p\u00ebrfshij\u00eb n\u00eb kontrat\u00ebn e tij me n\u00ebnkontraktuesin nj\u00eb
  dispozit\u00eb q\u00eb premton ruajtjen e konfidenc\u00ebs s\u00ebc\u00eb thuhet
  n\u00eb Paragrafin 5.1 m\u00eb sip\u00ebr. |\\n\\nP\u00ebr veprimet dhe mosveprimet
  e m\u00ebsip\u00ebrme mban p\u00ebrgjegj\u00ebsi Grupi i monitorimit dhe marrjes
  n\u00eb dor\u00ebzim t\u00eb MNSH.\\n\\n**Mbi likuidimin e kontrat\u00ebs:**\\nU
  verifikua p\u00ebrputhshm\u00ebria midis vler\u00ebs mujore sipas kontrat\u00ebs,
  fatur\u00ebs dhe urdh\u00ebr shpenzimit, p\u00ebr MNSH \u201cMir\u00ebmbajtje e
  sistemit elektronik t\u00eb QKR\u201d, ku rezultoi se kryerja e likuidimeve mujore
  t\u00eb sh\u00ebrbimit t\u00eb mir\u00ebmbajtjes, \u00ebsht\u00eb i dokumentuar
  dhe \u00ebsht\u00eb kryer n\u00eb p\u00ebrputhje me vler\u00ebn e p\u00ebrcaktuar
  n\u00eb kontrat\u00eb. *(Trajtuar holl\u00ebsisht n\u00eb PRA)*\\n\\nP\u00ebr sa
  \u00ebsht\u00eb trajtuar n\u00eb k\u00ebt\u00eb pik\u00eb t\u00eb Raportit P\u00ebrfundimtar
  t\u00eb Auditimit jan\u00eb mbajtur Aktkonstatimet nr. 5, 6, 7 dhe nr. 8, dat\u00eb
  18.07.2018, si dhe \u00ebsht\u00eb trajtuar n\u00eb faqet 9-25 t\u00eb Projektraportit
  t\u00eb Auditimit, mbi t\u00eb cilin jan\u00eb paraqitur observacione me shkres\u00ebn
  nr. 5086/21, dat\u00eb 25.07.2018, protokolluar n\u00eb KLSH me nr. 550/3, dat\u00eb
  27.07.2018, si dhe me shkres\u00ebn nr. 5086/23, dat\u00eb 30.08.2018, protokolluar
  n\u00eb KLSH me nr. 550/5, dat\u00eb 31.08.2018, t\u00eb cilat n\u00eb thelb jan\u00eb
  t\u00eb nj\u00ebjt\u00eb.\\n\\nPretendimi i subjektit:\\n\\nMbi disa \u00e7\u00ebshtje
  t\u00eb trajtuara n\u00eb AK dhe PRA.\\n\\n1. Pik\u00eb s\u00eb pari, detyrat e
  ushtruara nga ana jon\u00eb kan\u00eb qen\u00eb n\u00eb zbatim t\u00eb urdhrit t\u00eb
  titullarit. Ndjekja dhe monitorimi i kryer nga ne, \u00ebsht\u00eb pranuar nga zyra
  e financ\u00ebs;\\n2. S\u00eb dyti, P\u00ebrgjegj\u00ebsia e deleguar ndaj vet\u00ebm
  dy an\u00ebtar\u00ebve t\u00eb grupit t\u00eb pun\u00ebs, nga ana e KLSH \u00ebsht\u00eb
  e paargumentuar dhe e pamb\u00ebshtetur n\u00eb aktet e zbatueshme, pasi grupi i
  pun\u00ebs \u00ebsht\u00eb ngritur me urdhrin e sip\u00ebr\u00e7ituar dhe p\u00ebrmb\u00ebhet
  nga tre an\u00ebtar. P\u00ebr sa m\u00eb lart\u00eb, mos shp\u00ebrndarja e p\u00ebrgjegj\u00ebsis\u00eb
  n\u00eb m\u00ebnyr\u00eb t\u00eb barabart\u00eb, \u00ebsht\u00eb n\u00eb shkelje
  t\u00eb parimit t\u00eb barazis\u00eb, pasi t\u00eb gjith\u00eb s\u00eb bashku kemi
  ndjekur zbatimin e kontrat\u00ebs;\\n3. S\u00eb treti, Grupi i monitorimit t\u00eb
  kontrat\u00ebs ka pretendimin se nuk \u00ebsht\u00eb e nevojshme dokumentimi i procesit
  t\u00eb monitorimit t\u00eb kontrat\u00ebs, pasi \u00ebsht\u00eb i mjaftuesh\u00ebm
  Raporti mujor i paraqitur nga Kontraktuesi dhe i pranuar nga Kontraktori.\\n4. Grupi
  i auditimit t\u00eb KLSH n\u00eb m\u00ebnyr\u00eb t\u00eb paargumentuar na ka ngarkuar
  me p\u00ebrgjegj\u00ebsi p\u00ebr hartimin e DT.\\n\\nMbi projektraportin:\\n\\n1.
  QKB, n\u00eb cil\u00ebsin\u00eb e Autoritetit Kontraktor, si dhe struktura p\u00ebrgjegj\u00ebse
  p\u00ebr zbatimin e kontratave t\u00eb marrin masa p\u00ebr dokumentimin e t\u00eb
  gjith\u00eb hapave, kontrolleve, testimeve t\u00eb kryera gjat\u00eb mbik\u00ebqyrjes
  s\u00eb zbatimit t\u00eb kontratave.\\n2. QKB n\u00eb cil\u00ebsin\u00eb e Autoritetit
  Kontraktor, si dhe struktura p\u00ebrgjegj\u00ebse p\u00ebr zbatimin e kontrat\u00ebs,
  duhet t\u00eb marr\u00eb masa q\u00eb nga ana e subjektit kontraktues, i cili do
  t\u00eb realizoj\u00eb MNSH, t\u00eb deklarohet p\u00ebrberja e stafit q\u00eb do
  t\u00eb kryej\u00eb mir\u00ebmbajtjen e sistemeve TIK, me q\u00ebllim verifikimin
  e tij, n\u00eb lidhje me marr\u00ebdh\u00ebnien e pun\u00ebs me kontraktuesin si
  dhe kapacitetin tekniko-profesional, n\u00eb raport me at\u00eb t\u00eb deklaruar
  n\u00eb dokumentet e tenderit nga operatori ekonomik i shpallur fitues (kontraktuesi).\\n3.
  QKB, n\u00eb cil\u00ebsin\u00eb e Autoritetit Kontraktor, t\u00eb marr\u00eb masa
  q\u00eb p\u00ebr t\u00eb gjith\u00eb personat e deklaruar nga Kontraktuesi, se do
  t\u00eb jen\u00eb pjes\u00eb e stafit q\u00eb do t\u00eb zbatojn\u00eb Marr\u00ebveshjet
  e Nivelit t\u00eb Sh\u00ebrbimit, t\u00eb k\u00ebrkojn\u00eb t\u00eb paragjesin
  paraprakisht deklarat\u00eb p\u00ebr ruajtjen e konfidencialitetit t\u00eb t\u00eb
  dh\u00ebnav\u00eb t\u00eb kontraktorit (QKB).\\n\\nQ\u00ebndrimi i Grupit t\u00eb
  Auditimit:\\n\\nMbi disa \u00e7\u00ebshtje t\u00eb trajtuar n\u00eb AK dhe PRA.\\n\\n1.
  Pik\u00eb s\u00eb pari, ju sqarojm\u00eb se, detyra e Zyr\u00ebs s\u00eb Financ\u00ebs
  \u00ebsht\u00eb verifikimi i dokumentacionit mb\u00ebshtet\u00ebs p\u00ebrpara kryerjes
  s\u00eb likuidimit, q\u00eb \u00ebsht\u00eb Raporti mujor (marrja n\u00eb dor\u00ebzim)
  dhe Fatura e TVSH-s\u00eb dhe jo kontrolli i dosjes s\u00eb monitorimit dhe zbatimit
  t\u00eb kontrat\u00ebs p\u00ebr gjith\u00eb gjith\u00eb periudh\u00ebs nga Grupi
  i monitorimit. Argumenti juaj nuk q\u00ebndron.\\n2. S\u00eb dyti, Nga k\u00ebqyrja
  e Raporteve mujore ka rezultuar se jan\u00eb n\u00ebnshkruar nga muaji Janar-Shtator
  \u201e\u201e. Sa m\u00eb sip\u00ebr pretendimi juaj p\u00ebr shkelje t\u00eb barazis\u00eb
  n\u00eb ndarjen e p\u00ebrgjegj\u00ebsive nuk q\u00ebndron.\\n3. Monitorimi, ndjekja
  e zbatimit t\u00eb kontrat\u00ebs nuk n\u00ebnkupton n\u00ebnshkrimin nga ana e
  AK t\u00eb Raporteve mujore t\u00eb sh\u00ebrbimit t\u00eb paraqitura nga Kontraktuesi,
  por ndjekjen n\u00eb vazdim\u00ebsi t\u00eb zbatimit t\u00eb kontrat\u00ebs, cil\u00ebsin\u00eb
  e ofrimit t\u00eb sh\u00ebrbimit n\u00ebp\u00ebrmjet kontrolleve t\u00eb vazduhesme
  t\u00eb kryera nga Grupi i pun\u00ebs, si dhe dokumentimin e veprimeve t\u00eb kryera.
  Argumenti juaj nuk q\u00ebndron.\\n4. P\u00ebrsa i p\u00ebrket pretendimit tuaj
  mbi p\u00ebrgjegj\u00ebsin\u00eb n\u00eb hartimin e DT, nga grupi i auditimit nuk
  jeni ngarkuar ju me p\u00ebrgjegj\u00ebsi, por \u00ebsht\u00eb v\u00ebn\u00eb thjesht
  n\u00eb dukje konstatimi i k\u00ebsaj shkelje\\n\\np\u00ebr t\u00eb cil\u00ebn \u00ebsht\u00eb
  vendosur edhe referenca ligjore, si dhe efektet q\u00eb ka n\u00eb zbatimin e kontrat\u00ebs,
  p\u00ebr arsye se ju si AK, vet\u00ebm keni lidhur kontrat\u00ebn dhe keni b\u00ebr\u00eb
  ndjekjen e saj pasi nuk keni qen\u00eb pjes\u00eb e zhvillimit t\u00eb procedurave
  t\u00eb prokurimit publik.\\n\\nMbi Projektraportin:\\nNga subjekti nuk \u00ebsht\u00eb
  dh\u00ebn\u00eb asnj\u00eb argument ligjor, i gen\u00ebsish\u00ebm, logjik p\u00ebr
  kund\u00ebrshrimin e rekomandimeve t\u00eb propozuara nga Grupi i Auditimit, duke
  gen\u00eb shpesh edhe kontradiktori me vet\u00eb p\u00ebrbajtjen e neneve t\u00eb
  ve\u00e7anta t\u00eb kontratave t\u00eb MNSH t\u00eb n\u00ebnshkruar nga vet\u00eb
  AK, por edhe me q\u00ebndrimin e tyre t\u00eb shprehur n\u00eb observacionet mbi
  Aktkonstatimet. Konkretnisht:\\n\\n1. Dokumentimi i vepimeve dhe procedurave t\u00eb
  nd\u00ebrmarrra nga Grupi i pun\u00ebs nuk \u00ebsht\u00eb d\u00ebshir\u00eb, por
  detyrim ligjor i cili ju \u00ebsht\u00eb cituar n\u00eb t\u00eb 4 kontratat e audituara.
  Nuk mund t\u00eb pretendohet se detyrimet sipas kontrat\u00ebs jan\u00eb kryer nga
  Grupi i pun\u00ebs kur nuk ka asnj\u00eb dokument q\u00eb v\u00ebrteton se realisht
  jan\u00eb kryer. Monitorimi i kontrat\u00ebs nuk presupozon n\u00ebnshkrimin nga
  ana e Grupit t\u00eb pun\u00ebs t\u00eb relacionit m\u00ebjor t\u00eb sh\u00ebrbimit
  t\u00eb paraqitur nga Kontraktuesi.\\n\\n2. P\u00ebrsa i p\u00ebrket deklarimit
  t\u00eb stafit, vet\u00eb ju si AK keni k\u00ebrkuar deklarimin e tyre menj\u00ebher\u00eb
  pas lidhjes s\u00eb kontrat\u00ebs, (cituar te kontraata e QKR dhe QKL). Gjithashtu,
  zbatimi i k\u00ebtyre kontratave k\u00ebrkon persona t\u00eb kualifikuar n\u00eb
  aspekte t\u00eb ve\u00e7anta sipas llojit dhe komplektitetit t\u00eb kontrat\u00ebs,
  k\u00ebrkohet q\u00eb n\u00eb DT numri i specialist\u00ebve, kualifikimet p\u00ebrkat\u00ebse.
  Po k\u00ebshtu lidhja e kontrat\u00ebs duhet t\u00eb b\u00ebhet sipas deklarimeve
  t\u00eb b\u00ebra n\u00eb DT, \u00e7''ka do t\u00eb thot\u00eb se mir\u00ebmbajtja
  e sistemeve duhet t\u00eb kryhet nga specialist\u00ebt t\u00eb cil\u00ebt OE ka
  deklaruar se kan\u00eb aft\u00ebsit\u00eb profesionale dhe p\u00ebr t\u00eb cilat
  ai ka fituar realizimin e kontrat\u00ebs.\\n\\n3. P\u00ebrsa i p\u00ebrket n\u00ebnshkrimit
  t\u00eb deklarat\u00ebs s\u00eb ruajtjes s\u00eb konfidencialitetit t\u00eb t\u00eb
  dh\u00ebnave, p\u00ebrgjegj\u00ebsitet jan\u00eb individuale dhe jo kolektive. N\u00eb
  mir\u00ebmbajtjen e sistemeve \u00ebsht\u00eb i angazhuar personel konkret me akses
  n\u00eb t\u00eb dh\u00ebnat e QKB, i cili duhet t\u00eb deklarohet mbi ruajtjen
  e t\u00eb dh\u00ebnave individualisht. P\u00ebr m\u00eb tep\u00ebr ju rikujojm\u00eb
  se nga k\u00ebqyrja e dokumentacionit ka rezultuar se nga OE jan\u00eb angazhuar
  n\u00eb zbatimin e MNSH personel i cili nuk \u00ebsht\u00eb deklaruar n\u00eb DT,
  nuk ka kontrat\u00eb pune me OE, as ndonj\u00eb dokument tjet\u00ebr t\u00eb paraqitur
  n\u00eb momentin e zbatimit t\u00eb kontrat\u00ebs, duke qen\u00eb totalisht jasht\u00eb
  kontrollit si nga OE po ashtu dhe nga AK.\\n\\nSa m\u00eb sip\u00ebr, observacioni
  dhe argumentet mbi tre rekomandimet, mbi zbatimin e kontratave t\u00eb MNSH nuk
  q\u00ebndrojn\u00eb dhe do t\u00eb jen\u00eb pjes\u00eb e Raportit P\u00ebrfundimtar
  t\u00eb Auditimit, si dhe Rekomandimeve p\u00ebr QKB.\\n\\nRekomandime referuar
  gjetjeve t\u00eb m\u00ebsip\u00ebrme n\u00eb 4 kontratat MNSH.\\n\\nRekomandim 1:
  QKB, n\u00eb cil\u00ebsin\u00eb e Autoritetit Kontraktor, si dhe struktura p\u00ebrgjegj\u00ebse
  p\u00ebr zbatimin e kontratave t\u00eb marrin masa p\u00ebr dokumentimin e t\u00eb
  gjith\u00eb hapave, kontroleve, testimeve t\u00eb kryera gjat\u00eb mbik\u00ebqyrjes
  s\u00eb zbatimit t\u00eb kontratave.\\n\\nRekomandim 2: QKB n\u00eb cil\u00ebsin\u00eb
  e Autoritetit Kontraktor, si dhe struktura p\u00ebrgjegj\u00ebse p\u00ebr zbatimin
  e kontrat\u00ebs, duhet t\u00eb marr\u00eb masa q\u00eb nga ana e subjektit kontraktues,
  i cili do t\u00eb realizoj\u00eb MNSH, t\u00eb deklarohet p\u00ebrberja e stafit
  q\u00eb do t\u00eb kryej\u00eb mir\u00ebmbajtjen e sistemeve TIK, me q\u00ebllim
  verifikimin e tij, n\u00eb lidhje me marr\u00ebdh\u00ebnien e pun\u00ebs me kontraktuesin
  si dhe kapacitetin tekniko-profesional, n\u00eb raport me at\u00eb t\u00eb deklaruar
  n\u00eb dokumentet e tenderit nga operatori ekonomik i shpallur fitues (kontraktuesi).\\n\\nRekomandim
  3: QKB, n\u00eb cil\u00ebsin\u00eb e Autoritetit Kontraktor, t\u00eb marr\u00eb
  masa q\u00eb p\u00ebr t\u00eb gjith\u00eb personat e deklaruar nga Kontraktuesi,
  se do t\u00eb jen\u00eb pjes\u00eb e stafit q\u00eb do t\u00eb zbatojn\u00eb Marr\u00ebveshjet
  e\\n\\nNivelit t\u00eb Sh\u00ebrbimit, t\u00eb k\u00ebrkoj\u00eb t\u00eb paraqesin
  paraprakisht deklarat\u00eb p\u00ebr ruajtjen e konfidencialitetit t\u00eb t\u00eb
  dh\u00ebnave t\u00eb kontraktorit (QKB).\\n\\n**Pika 2. \u201cAuditimi i operacioneve
  n\u00eb TIK\u201d**\\n\\nT\u00eb dh\u00ebnat p\u00ebr subjektet t\u00eb cilat regjistrohen
  n\u00eb regjistrin tregtar, p\u00ebrcaktohen n\u00eb dispozitat e ligjit nr. 9723,
  dat\u00eb 3.5.2007 \u201cP\u00ebr Regjistrimin e Biznesit\u201d, i ndryshuar. Bazuar
  n\u00eb nenin 19 t\u00eb tij, regjistri duhet t\u00eb p\u00ebrmbaj\u00eb t\u00eb
  dh\u00ebna, q\u00eb i p\u00ebrkaqsin themelimit, veprimtaris\u00eb dhe \u00e7regjistrimit
  t\u00eb subjekteve, \u00e7do ndryshim n\u00eb status dhe organizimin e subjektit,
  t\u00eb dh\u00ebna, q\u00eb i p\u00ebrkaqsin atij n\u00eb lidhje me p\u00ebrfaq\u00ebsimin,
  si dhe t\u00eb dh\u00ebna t\u00eb tjera, t\u00eb parashikuara n\u00eb ligj.\\n\\nT\u00eb
  dh\u00ebnat e Regjistrit tregtar jan\u00eb t\u00eb dh\u00ebna unike t\u00eb subjekteve
  q\u00eb, kryejn\u00eb veprimtari ekonomike tregtare, t\u00eb cilat popullohen n\u00ebp\u00ebrmjet
  tre komponent\u00ebve p\u00ebr ofrimin e sh\u00ebrbimit ndaj biznesit dhe pal\u00ebve
  t\u00eb interesuar\u00eb:\\n\\n- Sistemi i brendsh\u00ebm\\n- Portali Web i QKB\\n-
  Portalit e-albania\\n\\nRegjistrimi, p\u00ebrpunimi dhe ruajtja e t\u00eb dh\u00ebnave,
  t\u00eb njoftuara dhe t\u00eb depozituara n\u00eb regjist\u00ebr, kryhen n\u00ebp\u00ebrmjet
  nj\u00eb sistemi t\u00eb informatizuar ku pjes\u00eb p\u00ebrb\u00ebr\u00ebse jan\u00eb
  edhe dokumentet e depozituara n\u00eb anekset e tij.\\n\\n**Trajtimi i incidenteve
  dhe gabimeve**\\n\\nQKB nuk ka t\u00eb dokumentuar dhe implementuar nj\u00eb procedur\u00eb
  t\u00eb standardizuar p\u00ebr kontrollin e ndryshimeve n\u00eb infrastruktur\u00eb
  dhe n\u00eb sistemet e TIK n\u00eb institucion. Situata n\u00eb QKB dhe n\u00eb
  deg\u00ebt rajonale, p\u00ebr periudh\u00ebn n\u00ebn auditim, menaxhohet mbi baza
  ngjarjesh. Ndhima, mb\u00ebshtetja teknike dhe logjike p\u00ebr operacionet TIK,
  q\u00eb ndihmojn\u00eb mbar\u00ebvajtjen e pun\u00ebs n\u00eb strukturat e institucionit,
  kryhet n\u00ebp\u00ebrmjet shk\u00ebmbimeve verbale ose n\u00ebp\u00ebrmjet e-mail\u00ebve,
  n\u00eb munges\u00eb t\u00eb procedurave t\u00eb shkruara p\u00ebr rastet e identifikuara
  si t\u00eb shpeshta.\\n\\nNga auditimi rezulton se procedur\u00eb t\u00eb operacioneve
  dhe form\u00eb e standardizuar ekziston vet\u00ebm p\u00ebr k\u00ebrkesat p\u00ebr
  ndryshim q\u00eb b\u00ebn aplikanti (subjekti) n\u00eb regjist\u00ebr, nd\u00ebrsa
  **mungon formati kur \u00e7\u00ebshtja hapet nga vet\u00eb punonj\u00ebsit n\u00eb
  zbatim t\u00eb urdhreve apo vendimeve t\u00eb ndryshme q\u00eb jan\u00eb detyrues
  p\u00ebr zbatim**. Gjithashtu, nuk disponohet procedur\u00eb p\u00ebr iniciimin,
  rishikimin dhe aprovimin e ndryshimeve, klasifikimin e tyre sipas r\u00ebnd\u00ebsis\u00eb,
  ndarjen e detyrave dhe p\u00ebrgjegj\u00ebsive p\u00ebr kryerjen e ndryshimeve (update,
  upgrade, etj.), struktura kontrolli p\u00ebr verifikimin e efektivitetit t\u00eb
  ndryshimeve t\u00eb kryera, procedura p\u00ebr ndryshimet emergjente si dhe dokumentimin
  e t\u00eb gjith\u00eb procesit t\u00eb ndryshimeve, duke p\u00ebrfshir\u00eb dhe
  incidentet q\u00eb vijn\u00eb nga nd\u00ebrveprimi i t\u00eb dh\u00ebnave.\\n\\n**1.
  Titulli i gjetjes: Trajtimi i incidenteve dhe gabimeve**\\n\\n**Situata:**\\n\\n1.
  QKB nuk ka t\u00eb dokumentuar dhe implementuar nj\u00eb procedur\u00eb t\u00eb
  standardizuar p\u00ebr kontrollin e ndryshimeve n\u00eb infrastruktur\u00eb dhe
  n\u00eb sistemet e TIK n\u00eb institucion. Situata n\u00eb QKB dhe n\u00eb deg\u00ebt
  rajonale, p\u00ebr periudh\u00ebn n\u00ebn auditim, menaxhohet mbi baza ngjarjesh.
  Gjithashtu, nuk disponohet procedur\u00eb p\u00ebr iniciimin, rishikimin dhe aprovimin
  e ndryshimeve, klasifikimin e tyre sipas r\u00ebnd\u00ebsis\u00eb, ndarjen e detyrave
  dhe p\u00ebrgjegj\u00ebsive p\u00ebr kryerjen e ndryshimeve (update, upgrade, etj.),
  struktura kontrolli p\u00ebr verifikimin e efektivitetit t\u00eb ndryshimeve t\u00eb
  kryera, procedura p\u00ebr ndryshimet emergjente si dhe dokumentimin e t\u00eb gjith\u00eb
  procesit t\u00eb ndryshimeve, duke p\u00ebrfshir\u00eb dhe incidentet q\u00eb vijn\u00eb
  nga nd\u00ebrveprimi i t\u00eb dh\u00ebnave.\\n\\n2. Nga auditimi rezulton se mungon
  formati kur \u00e7\u00ebshtja hapet nga vet\u00eb punonj\u00ebsit n\u00eb zbatim
  t\u00eb urdh\u00ebrave apo vendimeve t\u00eb ndryshme q\u00eb jan\u00eb detyrues\u00eb
  p\u00ebr zbatim.\\n\\n**Ndikimi/efekti:** Ndihma, mb\u00ebshtetja teknike dhe logjike
  p\u00ebr operacionet TIK, q\u00eb ndihmojn\u00eb mbar\u00ebvajtjen e pun\u00ebs
  n\u00eb strukturat e institucionit, kryhet n\u00ebp\u00ebrmjet shk\u00ebmbimeve
  verbale ose n\u00ebp\u00ebrmjet e-maileve, n\u00eb munges\u00eb t\u00eb procedurave
  t\u00eb shkruara p\u00ebr rastet e identifikuara si t\u00eb shpeshta. \u00c7do veprim
  pavar\u00ebsisht drejtimit nga i cili vjen k\u00ebrkesa k\u00ebrkon t\u00eb identifikohen
  hapat dhe personat q\u00eb veprojn\u00eb duke b\u00ebr\u00eb t\u00eb mundur dokumentimin
  e gjurm\u00ebs s\u00eb auditimit.\\n\\n**Shkaku:** Mungesa e standardeve n\u00eb
  lidhje me llojin e rregulloreve, manualeve apo udh\u00ebzuesve q\u00eb institucionet
  shtet\u00ebrore duhet t\u00eb disponojn\u00eb dhe zbatojn\u00eb p\u00ebr menaxhimin
  e sh\u00ebrbimeve publike.\\n\\n**R\u00ebnd\u00ebsia:** E lart\u00eb\\n\\n**Rekomandimi:**
  QKB t\u00eb marr\u00eb masa organizative lidhur me hartimin dhe v\u00ebnien n\u00eb
  funksion t\u00eb rregullores p\u00ebr trajtimin e incidenteve dhe gabime q\u00eb
  ndodhin gjat\u00eb pun\u00ebs me veprime operacionale, duke p\u00ebrfshir\u00eb
  dokumentimin e veprimeve q\u00eb vijn\u00eb si rezultat i vendimeve t\u00eb ndryshme
  detyrues\u00eb p\u00ebr ekzekutim si dhe ndryshimet q\u00eb ndodhin brenda p\u00ebr
  brenda TIK.\\n\\n---\\n\\n**Nd\u00ebrveprimi i t\u00eb dh\u00ebnave dhe Regjistrimi
  si baz\u00eb t\u00eb dh\u00ebnash shtet\u00ebrore**\\n\\nRegjistri i biznesit, n\u00eb
  kuad\u00ebr t\u00eb detyrimeve ligjore t\u00eb p\u00ebrcaktuara n\u00eb ligjin nr.
  10325, dat\u00eb 23.09.2010, \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d,
  rezulton i dokumentuar si baz\u00eb t\u00eb dh\u00ebnash shtet\u00ebrore me an\u00eb
  t\u00eb VKM nr. 863, dat\u00eb 21.10.2015 edhe pse t\u00eb dh\u00ebnat e tij jan\u00eb
  t\u00eb regjistruara q\u00eb n\u00eb vitin 2007, n\u00eb p\u00ebrputhje me ligjin
  nr. 9723, dat\u00eb 03.05.2007 \u201cP\u00ebr qendr\u00ebn komb\u00ebtare t\u00eb
  regjistrimit\u201d.\\n\\nRegjistri i lejeve/licencave dhe autorizimeve rezulton
  i pa dokumentuar me akte ligjore q\u00eb e dokumentojn\u00eb at\u00eb si baz\u00eb
  t\u00eb dh\u00ebnave shtet\u00ebrore te Autoriteti Rregullator Koordinues.\\n\\n-
  Nga auditimi rezulton se, bazuar n\u00eb nenin 10, pika 1 dhe 2 t\u00eb ligjit nr.
  10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d,
  p\u00ebrgjegj\u00ebsia p\u00ebr p\u00ebrpunimin, p\u00ebrdit\u00ebsimin dhe standardizimin
  e procedurave dhe rregullave p\u00ebr krijimin, regjistrimin, p\u00ebrfundimin e
  funksionimit, administrimin, nd\u00ebrveprimin dhe sigurin\u00eb e bazave t\u00eb
  t\u00eb dh\u00ebnave shtet\u00ebrore dhe element\u00ebve t\u00eb tjer\u00eb specifik\u00eb
  q\u00eb lidhen me k\u00ebto procese \u00ebsht\u00eb e AKSHI-t si Autoriteti Rregullator
  Koordinues.\\n\\n---\\n\\n2. **Titulli i gjetjes:** Dokumentimi i regjistrit elektronik
  t\u00eb Licencave, Lejeve dhe Autorizimeve si Baz\u00eb t\u00eb dh\u00ebnash Shtet\u00ebrore.\\n\\n**Situata:**
  Regjistri i lejeve/licencave dhe autorizimeve rezulton i pa dokumentuar me akte
  ligjore si baz\u00eb e t\u00eb dh\u00ebnave shtet\u00ebrore te AKSHI si Autoriteti
  Rregullator Koordinues p\u00ebrgjegj\u00ebs.\\n\\n**Kriteri:** Ligji nr. 10325,
  dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d,
  nen 10.1/2.\\n\\n**Ndikimi/efekti:** Pamund\u00ebsi p\u00ebr nd\u00ebrveprim pa
  dokumentacionin p\u00ebrkat\u00ebs n\u00eb p\u00ebrbushje t\u00eb detyrimeve t\u00eb
  ligjit t\u00eb sip\u00ebr\u00e7ituar.\\n\\n**Shkaku:** Mungesa e akteve ligjore
  p\u00ebr bazat e t\u00eb dh\u00ebnave q\u00eb ekzistonin p\u00ebrpara hyrjes n\u00eb
  fuqi t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb
  dh\u00ebnave shtet\u00ebrore\u201d.\\n\\n**R\u00ebnd\u00ebsia:** E Lart\u00eb\\n\\n**Rekomandimi:**
  AKSHI t\u00eb marr\u00eb masa p\u00ebr dokumentimin me akte ligjore t\u00eb Regjistrit
  elektronik t\u00eb Licencave, Lejeve dhe Autorizimeve si autoritet rregullator koordinues,
  p\u00ebrgjegj\u00ebs p\u00ebr p\u00ebrpunimin, p\u00ebrdit\u00ebsimin dhe standardizimin
  e procedurave dhe rregullave p\u00ebr krijimin, regjistrimin, p\u00ebrfundimin e
  funksionimit, administrimin, nd\u00ebrveprimin dhe sigurin\u00eb e bazave t\u00eb
  t\u00eb dh\u00ebnave shtet\u00ebrore dhe element\u00ebve t\u00eb tjer\u00eb specifik\u00eb
  q\u00eb lidhen me k\u00ebto procese.\\n\\nMarr\u00ebveshja nd\u00ebrmjet QKB dhe
  DPT p\u00ebr nd\u00ebrveprim t\u00eb t\u00eb dh\u00ebnave\\n\\nQKB, p\u00ebr t\u00eb
  garantuar leht\u00ebsimin e procedurave t\u00eb regjistrimit dhe ofrimin e sh\u00ebrbimeve
  t\u00eb tjera shtes\u00eb, tek subjektet e interesuara, n\u00eb p\u00ebrpunhje me
  legjislacionin n\u00eb fuqi, bashk\u00ebpunon me autoritete t\u00eb tjera publike
  dhe mund\u00ebson nd\u00ebrlidhjen dhe shk\u00ebmbimin elektronik t\u00eb t\u00eb
  dh\u00ebnave, t\u00eb regjistruara n\u00eb baz\u00ebn e saj elektronike, me regjistra
  apo baza t\u00eb dh\u00ebna\u0161 elektronike t\u00eb autoriteteve t\u00eb tjera
  publike.\\n\\nDPT dhe QKB kan\u00eb n\u00ebnshkruar nj\u00eb marr\u00ebveshje bashk\u00ebpunimi
  me nr. 12420/1, dat\u00eb 07.09.2017, me an\u00eb t\u00eb s\u00eb cil\u00ebs jan\u00eb
  dakord\u00ebsuar p\u00ebr shk\u00ebmbimin e t\u00eb dh\u00ebnave n\u00eb fusha t\u00eb
  caktuara, por protokolli p\u00ebr shk\u00ebmbimin e t\u00eb dh\u00ebnave i cili
  shoq\u00ebron dhe marr\u00ebveshjen ende nuk \u00ebsht\u00eb zyrtarizuar.\\n\\n3.
  Titulli i gjetjes: Hartimi i marr\u00ebveshjes p\u00ebr komunikimin elektronik nd\u00ebrmjet
  QKB dhe DPT\\n\\nSituata: Nga auditimi mbi hartimin e marr\u00ebveshjes p\u00ebr
  komunikimin elektronik rezulton se:\\n\\n1. Nd\u00ebrmjet QKB dhe DPT marr\u00ebveshja
  p\u00ebr nd\u00ebrveprimin e t\u00eb dh\u00ebnave \u00ebsht\u00eb n\u00ebnshkruar
  pa p\u00ebrfshirjen e Autoritetit Rregulator Koordinues si institucioni p\u00ebrgjegj\u00ebs
  p\u00ebr p\u00ebrpunimin, p\u00ebrdit\u00ebsimin dhe standardizimin e procedurave
  dhe rregullave p\u00ebr krijimin, regjistrimin, p\u00ebrfundimin e funksionimit,
  administrimin, nd\u00ebrveprimin dhe sigurin\u00eb e bazave t\u00eb dh\u00ebnave
  shtet\u00ebrore dhe element\u00ebve t\u00eb tjer\u00eb specifik\u00eb q\u00eb lidhen
  me k\u00ebto procese bazuar n\u00eb nenin 10/pika 1.2 t\u00eb ligjit nr. 10325,
  dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\n2.
  Nd\u00ebrmjet QKB dhe DPT ende nuk rezulton t\u00eb jet\u00eb zyrtarizuar ndonj\u00eb
  protokoll komunikimi apo nd\u00ebrveprimi t\u00eb dh\u00ebnash p\u00ebr leht\u00ebsimin
  e procedurave, konsultimin si dhe leximin n\u00eb m\u00ebnyr\u00eb t\u00eb nd\u00ebrsjell\u00ebt
  n\u00eb zbatim t\u00eb objektit t\u00eb marr\u00ebveshjes nen 3, pika 3.2 n\u00eb
  t\u00eb cil\u00ebn citohet se: \u201c\u2026.n\u00ebp\u00ebrmjet hapave t\u00eb detajuar
  n\u00eb Protokollin e Shk\u00ebmbimit Elektronik i cili \u00ebsht\u00eb pjes\u00eb
  p\u00ebrber\u00ebse e k\u00ebsaj marr\u00ebveshje\u201d.\\n\\nKriteri: Ligji nr.
  10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d
  dhe marr\u00ebveshja institucionale nd\u00ebrmjet tyre me nr. 12420/1, dat\u00eb
  07.09.2017.\\n\\nNdikimi/efekti: Mungesa n\u00eb nd\u00ebrveprimin e t\u00eb dh\u00ebnave
  konform ligjit t\u00eb sip\u00ebrcituar.\\n\\nShkaku: -\\n\\nR\u00ebnd\u00ebsia:
  E Lart\u00eb\\n\\nRekomandimi: Nga ana e QKB dhe DPT t\u00eb merren masa p\u00ebr
  rishikimin e marr\u00ebveshjes me nr. 12420/1, dat\u00eb 07.09.2017 n\u00eb lidhje
  me nd\u00ebrtimin e protokollit t\u00eb komunikimit n\u00eb nj\u00eb koh\u00eb sa
  m\u00eb t\u00eb shkurt\u00ebr p\u00ebr p\u00ebrmir\u00ebsimin n\u00eb koh\u00eb
  t\u00eb afateve t\u00eb p\u00ebrgjigjes s\u00eb institucioneve tek nj\u00ebri-tjetri
  si dhe p\u00ebrfshirjen e autoritetit rregulator koordinues n\u00eb rishikimin e
  saj.\\n\\nN\u00eb marr\u00ebveshjen e n\u00ebnshkruar p\u00ebr komunikim elektronik
  nd\u00ebrmjet QKB dhe DPT me nr. 12420/1, dat\u00eb 07.09.2017 si dhe n\u00eb faqen
  zyrtare Web t\u00eb Tatimeve thuhet se nd\u00ebrmjet DPT dhe QKB \u00ebsht\u00eb
  thjeshtuar ndjesh\u00ebm shk\u00ebmbimi i t\u00eb dh\u00ebnave pasi ai \u00ebsht\u00eb
  b\u00ebr\u00eb kryesisht n\u00eb formatin elektronik.\\n\\nFaqja zyrtare n\u00ebp\u00ebrmjet
  t\u00eb cil\u00ebs DPT: https://www.tatime.gov.al/d/8/45/45/501/drejtoria-e-pergjithshme-e-tatimeve-shkembim-elektronik-te-dhenash-me-qkb-ne-per-subjektet-tregtare\\n\\nDPT
  informon se \u00ebsht\u00eb rritur ndjesh\u00ebm reduktimi i procedurave, shkurtim
  n\u00eb koh\u00eb t\u00eb marrjes s\u00eb t\u00eb dh\u00ebnave, si dhe uljen e kostos
  administrative n\u00ebp\u00ebrmjet d\u00ebrgimit t\u00eb t\u00eb dh\u00ebnave n\u00eb
  rrug\u00eb elektronike si m\u00eb posht\u00eb:\\n\\n- Situat\u00ebn aktuale tatimore
  t\u00eb subjekteve q\u00eb aplikojn\u00eb p\u00ebr \u00e7regjistrim;\\n\\nN\u00ebp\u00ebrmjet
  k\u00ebtij funksionaliteti, QKB n\u00eb momentin e aplikimit, mund t\u2019i b\u00ebj\u00eb
  me dije subjekteve situat\u00ebn n\u00eb lidhje me detyrimet dhe dor\u00ebzimin
  e deklarimeve. Por, kjo m\u00ebnyr\u00eb nuk do t\u00eb p\u00ebrjashtoj\u00eb mund\u00ebsin\u00eb
  q\u00eb QKB t\u00eb respektoj\u00eb afatet e p\u00ebrcaktuara me ligj p\u00ebr \u00e7regjistrim.\\n\\n-
  **Kodet Nace (aktivitetin e subjektit t\u00eb p\u00ebrdit\u00ebsuar);**\\n  DPT
  i d\u00ebrgon elektronikisht QKB-s\u00eb Kodet Nace, t\u00eb azhurnuara n\u00eb
  rast verifikimi dhe konstatimi nga Administrata Tatimore, n\u00eb m\u00ebnyr\u00eb
  q\u00eb t\u00eb ket\u00eb p\u00ebrputhje t\u00eb t\u00eb dh\u00ebnav\u00eb midis
  dy institucioneve.\\n\\n- **Pasqyrat financiare dhe raportet e auditit/veprimtaris\u00eb;**\\n  QKB
  merr n\u00eb m\u00ebnyr\u00eb elektronike pasqyrat financiare dhe raportet e auditit
  t\u00eb dor\u00ebzuara n\u00eb Administrat\u00ebn Tatimore.\\n\\n- **Subjektet q\u00eb
  kan\u00eb detyrimin p\u00ebr depozitimin e pasqyrave financiare vjetore;**\\n  DPT
  i krijon mund\u00ebsi QKB-s\u00eb q\u00eb t\u00eb konsultohej n\u00eb koh\u00eb
  reale n\u00ebse nj\u00eb subjekt \u00ebsht\u00eb i detyruar t\u00eb dor\u00ebzoj\u00eb
  pasqyrat financiare p\u00ebr nj\u00eb periudh\u00eb t\u00eb caktuar.\\n\\nNga auditimi
  si sh\u00ebrbimeve elektronike t\u00eb nd\u00ebrtuara p\u00ebr marrjen e t\u00eb
  dh\u00ebnav\u00eb nga QKB, rezulton se nuk shk\u00ebmbehen t\u00eb dh\u00ebna n\u00eb
  koh\u00eb reale p\u00ebr asnj\u00eb nga sh\u00ebrbimet q\u00eb jan\u00eb p\u00ebrmbendur
  m\u00eb sip\u00ebr, pasi QKB nuk i \u00ebsht\u00eb mund\u00ebsuar kontrolli n\u00eb
  koh\u00eb reale n\u00eb kund\u00ebrshtim me marr\u00ebveshjen p\u00ebr t\u00eb cil\u00ebn
  kan\u00eb r\u00ebn\u00eb dakord, n\u00eb:\\n\\n1. Situat\u00ebn aktuale tatimore
  e subjekteve q\u00eb aplikojn\u00eb p\u00ebr \u00e7regjistrim;\\n2. Kodet Nace (aktivitetin
  e subjektit t\u00eb p\u00ebrdit\u00ebsuar);\\n3. Pasqyrat financiare dhe raportet
  e auditit/veprimtaris\u00eb;\\n4. Subjektet q\u00eb kan\u00eb detyrimin p\u00ebr
  depozitimin e pasqyrave financiare vjetore;\\n\\n*Nga auditimi n\u00eb lidhje me
  pik\u00ebn e par\u00eb*, at\u00eb t\u00eb situat\u00ebs aktuale tatimore, t\u00eb
  subjekteve q\u00eb aplikojn\u00eb p\u00ebr \u00e7regjistrim, rezulton se aplikimet
  p\u00ebr \u00e7regjistrim d\u00ebrgohen n\u00eb koh\u00eb reale nga QKB n\u00eb
  DPT dhe me shkres\u00eb zyrtare n\u00eb nj\u00ebsit\u00eb vendore. DPT dhe nj\u00ebsit\u00eb
  vendore i p\u00ebrgjigjen k\u00ebrkes\u00ebs s\u00eb QKB n\u00eb lidhje me detyrimet
  e subjektit q\u00eb ka aplikuar p\u00ebr \u00e7regjistrim me shkres\u00eb zyrtare
  dhe jo n\u00ebp\u00ebrmjet sistemit.\\n\\nP\u00ebr periudh\u00ebn 01.01.2017-30.06.2018
  numri i bizneseve prej af\u00ebrsisht 17.810 n\u00eb format ligjore si m\u00eb posht\u00eb
  rezulton t\u00eb k\u00ebt\u00eb kryer af\u00ebrsisht 20.556 aplikime, nga t\u00eb
  cilat 4.923 aplikime ose 24% e kan\u00eb koh\u00ebn e vendimmarrjes n\u00eb m\u00eb
  pak se 40 dit\u00eb, nd\u00ebrsa 15.633 aplikime ose 76% rezultojn\u00eb me nj\u00eb
  koh\u00eb vendimmarrje m\u00eb shum\u00eb se 40 dit\u00eb. Nga k\u00ebto aplikimi
  rezulton af\u00ebrsisht 1.217 aplikime p\u00ebr t\u00eb cilat deri n\u00eb periudh\u00ebn
  e auditimit nuk ka ardhur nj\u00eb p\u00ebrgjigjen nga DPT, \u00e7far\u00eb do t\u00eb
  thot\u00eb se QKB-s\u00eb, nuk i \u00ebsht\u00eb mund\u00ebsuar leximi i detyrimeve
  tatimore n\u00eb koh\u00eb reale, n\u00eb kund\u00ebrshtim me objektin e marr\u00ebveshjes
  me nr. 12420/1, dat\u00eb 07.09.2017.\\n\\n**4. Titulli i gjetjes:** T\u00eb dh\u00ebnat
  lidhur me situat\u00ebn aktuale tatimore e subjekteve q\u00eb aplikojn\u00eb p\u00ebr
  \u00e7regjistrim\\n\\n**Situata:** Nga auditimi ka rezultuar se QKB-s\u00eb, nuk
  i \u00ebsht\u00eb mund\u00ebsuar leximi i detyrimeve tatimore n\u00eb koh\u00eb
  reale n\u00eb sistemin e DPT, n\u00eb kund\u00ebrshtim me objektin e marr\u00ebveshjes
  me nr. 12420/1, dat\u00eb 07.09.2017. Konkretisht, n\u00eb lidhje me leximin e t\u00eb
  dh\u00ebnav\u00eb n\u00eb DPT p\u00ebr situat\u00ebn aktuale tatimore t\u00eb subjekteve
  q\u00eb aplikojn\u00eb p\u00ebr \u00e7regjistrim, rezulton se aplikimet p\u00ebr
  \u00e7regjistrim nga QKB d\u00ebrgohen n\u00eb koh\u00eb reale n\u00eb DPT dhe me
  shkres\u00eb zyrtare n\u00eb nj\u00ebsit\u00eb vendore. DPT dhe nj\u00ebsit\u00eb
  vendore i p\u00ebrgjigjen k\u00ebrkes\u00ebs s\u00eb QKB n\u00eb lidhje me detyrimet
  e subjektit q\u00eb ka aplikuar p\u00ebr \u00e7regjistrim me shkres\u00eb zyrtare
  dhe jo n\u00ebp\u00ebrmjet sistemit.\\n\\n**Kriteri:** Ligji nr. 10325, dat\u00eb
  23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnav\u00eb shtet\u00ebrore\u201d
  dhe marr\u00ebveshja institucionale n\u00ebd\u00ebrmjet tyre me nr. 12420/1, dat\u00eb
  07.09.2017.\\n\\nNdikimi/efekti: Vonesa n\u00eb \u00e7regjistrimin e bizneseve\\nShkaku:
  Mungesa e nd\u00ebrveprimit\\nR\u00ebnd\u00ebsia: E lart\u00eb\\n\\nRekomandimi:
  QKB n\u00eb bashk\u00ebpunim me DPT si pal\u00eb n\u00eb marr\u00ebveshjen e lidhur,
  t\u00eb marrin masa q\u00eb n\u00eb zbatim t\u00eb marr\u00ebveshjes me nr. 12420/1,
  dat\u00eb 07.09.2017, t\u00eb mund\u00ebsojn\u00eb, n\u00ebp\u00ebrmjet nd\u00ebrveprimit
  t\u00eb t\u00eb dh\u00ebnave, leximin n\u00eb koh\u00eb reale, t\u00eb situat\u00ebs
  aktuale tatimore.\\n\\nNga auditimi n\u00eb lidhje me pik\u00ebn e dyt\u00eb e cila
  \u00ebsht\u00eb parashikuar dhe n\u00eb marr\u00ebveshjen e n\u00ebnshkruar nd\u00ebrmbjet
  QKB dhe DPT, p\u00ebr d\u00ebrgimin e kodeve NVE (Nace) elektronikisht nga DPT n\u00eb
  QKB-s\u00eb, t\u00eb azhurnuara n\u00eb rast verifikimi dhe konstatimi nga Administrata
  Tatimore, citohet se: \u201c\u2026\u2026., kur administrata tatimore (Drejtorit\u00eb
  Rajonale Tatimore), konstatojn\u00eb se aktiviteti q\u00eb zhvillohet nga ana e
  tij, nuk korrespondon me kodin e veprimtaris\u00eb ekonomike NVE (NACE) p\u00ebrkat\u00ebs,
  sakt\u00ebson kodin q\u00eb duhet realisht dhe e pasqyron at\u00eb n\u00eb sistemin
  e saj. K\u00ebt\u00eb ndryshim t\u00eb kryer DPT e d\u00ebrgon edhe n\u00eb QKB
  sipas rregullave t\u00eb p\u00ebrcaktuara n\u00eb protokollin elektronik duke b\u00ebr\u00eb
  edhe ajo pasqyrimin n\u00eb sistemin e saj\u201d.\\n\\nN\u00eb Regjistrin Tregtar
  reflektohen si t\u00eb dh\u00ebna par\u00ebsore t\u00eb dh\u00ebnat q\u00eb i p\u00ebrkasin
  themelimit dhe veprimtaris\u00eb s\u00eb subjekteve tregtare kodet NVE (NACE), referuar
  VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijimin e baz\u00ebs t\u00eb t\u00eb
  dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs komb\u00ebtare t\u00eb regjistrimit,
  regjistri tregtar\u201d, ku:\\n\\n- N\u00eb pik\u00ebn 8 cil\u00ebsohet se: \u201cQendra
  Komb\u00ebtare e Regjistrimit \u00ebsht\u00eb administratori i vet\u00ebm i Regjistrit
  Tregtar dhe p\u00ebrgjegj\u00ebse e drejt\u00ebp\u00ebrdrejt\u00eb p\u00ebr struktur\u00ebn
  e baz\u00ebs t\u00eb t\u00eb dh\u00ebnave, an\u00ebn funksionale dhe operacionale\u201d\\n\\n-
  N\u00eb pik\u00ebn 9 cil\u00ebsohet se: \u201cQendra Komb\u00ebtare e Regjistrimit
  p\u00ebrfaq\u00ebson autoritetin e vet\u00ebm, i cili p\u00ebrcakton t\u00eb drejtat
  dhe kufizimet e operimit n\u00eb baz\u00ebn e t\u00eb dh\u00ebnave elektronike t\u00eb
  Regjistrit Tregtar, n\u00ebp\u00ebrmjet aplikimit t\u00eb skemave t\u00eb aksesit
  me nivele t\u00eb shkall\u00ebzuara dhe hierarkike t\u00eb administratorit t\u00eb
  informacionit respektiv p\u00ebr t\u00eb gjitha institucionet e tjera t\u00eb administrat\u00ebs
  shtet\u00ebrore, institucionet e pavarura dhe nj\u00ebsit\u00eb e qeverisjes vendore\u201d.\\n\\nP\u00ebr
  sa m\u00eb sip\u00ebr, DPT mund dhe duhet t\u00eb reklamoj\u00eb ndryshimet e konstatuara
  n\u00eb QKB, por ndryshimi lidhur me t\u00eb dh\u00ebnat par\u00ebsore q\u00eb kan\u00eb
  t\u00eb b\u00ebjn\u00eb me ushtrimin e veprimtaris\u00eb s\u00eb subjektit, duhet
  t\u00eb b\u00ebhet n\u00eb QKB. Gjenerimi i t\u00eb dh\u00ebn\u00ebs t\u00eb gjeneruara
  nga dy baza t\u00eb dh\u00ebnash shtet\u00ebrore p\u00ebr t\u00eb nj\u00ebjtin q\u00ebllim
  \u00ebsht\u00eb n\u00eb kund\u00ebrshtim me nenin 4 ligjit nr. 10325, dat\u00eb
  23.09.2010 \u201cP\u00ebr bazat \u00eb t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\n5.
  Titulli i gjetjes: D\u00ebrgimi i kodeve NVE (Nace) elektronikisht nga DPT n\u00eb
  QKB\\n\\nSituata: N\u00eb marr\u00ebveshjen nd\u00ebrmbjet pal\u00ebve \u00ebsht\u00eb
  dakord\u00ebsuar q\u00eb kodet NVE (Nace) t\u00eb d\u00ebrgohen elektronikisht nga
  DPT n\u00eb QKB-s\u00eb, t\u00eb azhurnuara n\u00eb rast verifikimi dhe konstatimi
  nga Administrata Tatimore, n\u00eb nj\u00eb koh\u00eb q\u00eb k\u00ebto t\u00eb
  dh\u00ebna n\u00eb Regjistrin Tregtar reflektohen si t\u00eb dh\u00ebna par\u00ebsore
  q\u00eb i p\u00ebrkasin themelimit dhe veprimtaris\u00eb s\u00eb subjekteve tregtare
  kodet NVE (NACE), referuar VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijimin
  e baz\u00ebs t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs komb\u00ebtare
  t\u00eb regjistrimit, regjistri tregtar\u201d.\\n\\nKriteri: Marr\u00ebveshja nd\u00ebrmbjet
  pal\u00ebve dhe VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr krijimin e baz\u00ebs
  t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs komb\u00ebtare
  t\u00eb regjistrimit, regjistri tregtar\u201d.\\n\\nNdikimi/efekti: T\u00eb dh\u00ebna
  par\u00ebsore t\u00eb gjeneruara jo nga vet\u00eb deklaruesi dhe n\u00eb p\u00ebrputhje
  me ligjin nr. 9723, dat\u00eb 03.05.2007 \u201cP\u00ebr qendr\u00ebn komb\u00ebtare
  t\u00eb regjistrimit\u201d.\\n\\nShkaku: Gjenerim t\u00eb dh\u00ebnash par\u00ebsore
  n\u00eb dy sisteme t\u00eb ndryshme p\u00ebr t\u00eb nj\u00ebjtin q\u00ebllim.\\n\\nR\u00ebnd\u00ebsia:
  E Lart\u00eb\\n\\nRekomandimi: QKB n\u00eb bashk\u00ebpunim me DPT, t\u00eb marr\u00eb
  masa p\u00ebr rishikimin e pik\u00ebs 4.4 t\u00eb Marr\u00ebveshjes me nr. 12420/1,
  dat\u00eb 07.09.2017, n\u00eb t\u00eb cil\u00ebn t\u00eb cil\u00ebsohet se e drejta
  e DPT p\u00ebr kodet NACE \u00ebsht\u00eb reklamimi pran\u00eb QKB, i rasteve t\u00eb
  konstatuara gjat\u00eb kontrolleve n\u00eb terren nga Administrata Tatimore, ku
  ushtrimi i aktivitetit nga ana e subjekteve \u00ebsht\u00eb n\u00eb ndryshim nga
  ai i deklaruar.\\n\\nPasqyrimi i ndryshimit t\u00eb objektit t\u00eb veprimtaris\u00eb
  s\u00eb subjektit (kodi NACE) \u00ebsht\u00eb detyrim i QKB, pasi \u00ebsht\u00eb
  e dh\u00ebn\u00eb par\u00ebsore n\u00eb sistemin e regjistrit t\u00eb biznesit,
  ndryshim i cili nga QKB n\u00ebp\u00ebrmjet nd\u00ebrveprimit t\u00eb sistemeve
  automatikisht i pasqyrohet DPT-s\u00eb.\\n\\nNga auditimi lidhur me pik\u00ebn e
  tret\u00eb p\u00ebr pasqyrat financiare dhe raportet e auditit/veprimtaris\u00eb
  si dhe detyrimin p\u00ebr depozitimin e pasqyrave financiare vjetore, rezulton se
  jo vet\u00ebm q\u00eb k\u00ebto t\u00eb dh\u00ebna nuk d\u00ebrgohen elektronikisht,
  por QKB ka n\u00ebnshkruar nj\u00eb kontrat\u00eb sh\u00ebrbimi me nr. 3092/2, dat\u00eb
  01.03.2018 me objekt \u201cImprovement of existing software of NBC and creation
  of New modules for public access to financial information\u201d, aktualisht n\u00eb
  faz\u00eb zhvillimi t\u00eb nj\u00eb sistemi mbi p\u00ebrmb\u00ebr\u00ebsimin e
  sistemit aktual si dhe krijuimin e moduleve p\u00ebr aksesimin publik t\u00eb informacionit
  financiar pjes\u00eb e t\u00eb cil\u00ebs jan\u00eb pasqyrat financiare dhe raportet
  e aktivitetit dhe veprimtaris\u00eb, specifikimet teknike t\u00eb s\u00eb cil\u00ebs
  jan\u00eb miratuar edhe nga AKSHI.\\n\\n-Pasqyrat financiare t\u00eb subjekteve
  dhe raportet e auditit/veprimtaris\u00eb jan\u00eb t\u00eb dh\u00ebna t\u00eb konsideruara
  si par\u00ebsore n\u00eb regjistrin e biznesit n\u00eb QKR, n\u00eb p\u00ebrputhje
  me nenin 43, germa a t\u00eb ligjit nr. 9723 \u201cP\u00ebr qendr\u00ebn komb\u00ebtare
  t\u00eb regjistrimit\u201d i p\u00ebrdit\u00ebsuar. Nj\u00ebkoh\u00ebsisht pasqyrat
  financiare dhe raportet e auditimit t\u00eb veprimtaris\u00eb jan\u00eb t\u00eb
  dh\u00ebna par\u00ebsore dhe si t\u00eb till\u00eb t\u00eb detyrueshme p\u00ebr
  tu plot\u00ebsuar edhe n\u00eb sistemin tatimor n\u00eb DPT sipas nenit 29 t\u00eb
  ligjit nr. 8438, dat\u00eb 28.12.1998 i ndryshuar. Kategorizimi si e dh\u00ebn\u00eb
  par\u00ebsore n\u00eb t\u00eb dy sistemet \u00ebsht\u00eb n\u00eb kund\u00ebrshtim
  me nenin 7 t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat \u00eb
  t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\nDepozitimi i pasqyrave financiare
  dhe raportet e auditit/veprimtaris\u00eb, i mund\u00ebsohen subjektit n\u00ebp\u00ebrmjet
  aplikimit online n\u00eb portalin e-albania. QKB raporton se ky sh\u00ebrbim \u00ebsht\u00eb
  funksional q\u00eb prej vitit 2015, vit n\u00eb t\u00eb cilin ka filluar ngarkimi
  online i pasqyrave financiare t\u00eb vitit ushtrimor 2014, \u00e7ka tregon se k\u00ebto
  t\u00eb dh\u00ebna nuk jan\u00eb d\u00ebrguar elektronikisht nga DPT, por p\u00ebr
  plot\u00ebsimin e k\u00ebsaj k\u00ebrkes\u00eb p\u00ebrgjegj\u00ebs \u00ebsht\u00eb
  vet\u00eb subjekti. Numri i aplikimeve p\u00ebr pasqyrat financiare n\u00eb QKB
  arrin n\u00eb afersisht 20.000-22.000 aplikime n\u00eb vit. Pasqyrat financiare
  t\u00eb cilat mund t\u00eb ken\u00eb ndryshuar n\u00eb DPT n\u00eb p\u00ebrputhje
  me afatet ligjore tatimore, n\u00eb QKB k\u00ebrkohet t\u00eb rid\u00ebrgohen n\u00ebp\u00ebrmjet
  formave t\u00eb v\u00ebna n\u00eb dispozicion e-albania dhe sportel, p\u00ebr pasqyrim
  sa m\u00eb t\u00eb sakt\u00eb t\u00eb t\u00eb dh\u00ebnave.\\n\\nQKB ofron disa
  sh\u00ebrbime n\u00ebp\u00ebrmjet portalit e-albania. P\u00ebr vitin 2016 dhe 2017
  sh\u00ebrbimet kan\u00eb njohur nj\u00eb rritje t\u00eb k\u00ebrkes\u00ebs, sipas
  t\u00eb dh\u00ebnave burimore t\u00eb QKB. Si\u00e7 mund t\u00eb vijet re edhe nga
  tabela, njeh rritje numri i ekstraktit dhe aplikimit p\u00ebr dor\u00ebzimin e bilancit,
  por jo sh\u00ebrbimet t\u00eb cilat rregullojn\u00eb fluksin n\u00eb sportelet.\\n\\n|
  Lloji i sh\u00ebrbimit | Aplikime 2016 | Aplikime 2017 | Aplikime deri ne Maj 2018
  |\\n|-------------------|---------------|---------------|--------------------------|\\n|
  Bilanci vjetor    | 18,954        | 19,098        | 1,407                    |\\n|
  Ndryshim Person Fizik | 60            | 17            | 0                        |\\n|
  Ndryshim Shoq\u00ebri Aksionare | 1             | 2             | 0                        |\\n|
  Ndryshim Shoq\u00ebri me P\u00ebrgjegj\u00ebsi t\u00eb Kufizuar | 110           |
  24            | 0                        |\\n| Regjistrim Person Fizik | 284           |
  541           | 62                       |\\n| Regjistrim Shoq\u00ebri me P\u00ebrgjegj\u00ebsi
  t\u00eb Kufizuar | 12            | 19            | 0                        |\\n\\nEkstrakti
  i thjesht\u00eb apo historik \u00ebsht\u00eb nj\u00eb sh\u00ebrbim q\u00eb QKB e
  ofron online prej vitesh n\u00ebp\u00ebrmbjet fajas Web: [www.qkb.gov.al](http://www.qkb.gov.al),
  si dhe n\u00eb sportel kur ai k\u00ebrkohet n\u00eb form\u00eb zyrtare. P\u00ebr
  vitin 2018 rezultojn\u00eb sh\u00ebrbime me zero aplikime. Nga QKB si institucioni
  administrues p\u00ebr biznesin si dhe AKSHI si institucioni administrues i portalit
  e-albania, nuk rezulton q\u00eb t\u00eb ken\u00eb v\u00ebn\u00eb n\u00eb dispozicion
  ndonj\u00eb udh\u00ebzues apo manual me shpjegimin se si k\u00ebrkohet plot\u00ebsimi
  i formular\u00ebve nga p\u00ebrdoruesit online (biznesi) q\u00eb n\u00eb k\u00ebt\u00eb
  rast jan\u00eb vet\u00eb edhe regjistrues p\u00ebr k\u00ebrkes\u00ebn e tyre.\\n\\n6.
  Titulli i gjetjes: Pasqyrat financiare dhe raportet e auditit/veprimtaris\u00eb.\\n\\nSituata:
  Nga auditimi lidhur me t\u00eb dh\u00ebnat p\u00ebr pasqyrat financiare t\u00eb
  subjekteve dhe raportet e auditit/veprimtaris\u00eb \u00ebsht\u00eb konstatuar se:\\n\\n1.
  K\u00ebto t\u00eb dh\u00ebna jan\u00eb par\u00ebsore n\u00eb regjistrin e biznesit
  n\u00eb QKR, n\u00eb p\u00ebrputhje me nenin 43, germa a, t\u00eb ligjit nr. 9723,
  dat\u00eb \u201cP\u00ebr qendr\u00ebn komb\u00ebtare t\u00eb regjistrimit\u201d
  i p\u00ebrdit\u00ebsuar, si dhe VKM nr. 863, dat\u00eb 21.10.2015 \u201cP\u00ebr
  krijimin e baz\u00ebs t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb qendr\u00ebs
  komb\u00ebtare t\u00eb regjistrimit, regjistri tregtar\u201d. Afati p\u00ebrfundimtar
  p\u00ebr depozitimin e tyre, sipas nenit 43, germa a, \u00ebsht\u00eb data 31 Korrik
  e \u00e7do viti, n\u00eb t\u00eb kund\u00ebrt ndaj subjektit vendoset gjoba prej
  15.000 lek\u00eb bazuar n\u00eb nenin 74, pika 3.\\n\\n2. QKB nuk ka t\u00eb mundur
  asnj\u00eb element kontrolli mbi v\u00ebrtet\u00ebsin\u00eb e t\u00eb dh\u00ebnave
  n\u00eb pasqyrat financiare, pasi ky kontroll nuk \u00ebsht\u00eb pjes\u00eb e aktivitetit
  t\u00eb k\u00ebtij institucioni.\\n\\n3. Pasqyrat financiare dhe raportet e auditimit/veprimtaris\u00eb
  jan\u00eb t\u00eb detyrueshme p\u00ebr t\u2019u plot\u00ebsuar edhe n\u00eb sistemin
  tatimor t\u00eb DPT sipas nenit 29 t\u00eb ligjit nr. 8438, dat\u00eb 28.12.1998
  \u201cP\u00ebr tatimin mbi t\u00eb ardhurat\u201d i ndryshuar. DPT ushtron kontroll
  mbi element\u00ebt e pasqyrave financiare, lejon ose jo ndryshimin e tyre dhe i
  certifikon ato.\\n\\n4. Pasqyrat financiare dhe raportet e auditimit/veprimtaris\u00eb
  p\u00ebrmblajn\u00eb t\u00eb dh\u00ebna q\u00eb sipas nenit 25 i ligjit nr. 9920,
  dat\u00eb 19.05.2008 \u201cP\u00ebr procedurat tatimore n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d i ndryshuar, i n\u00ebnshtrohen kushteve t\u00eb konfidencialitetit,
  nd\u00ebrkoh\u00eb q\u00eb po t\u00eb nj\u00ebjtat t\u00eb dh\u00ebna t\u00eb subjekteve
  n\u00eb QKB k\u00ebrkohen t\u00eb dor\u00ebzohen brenda afat\u00ebve t\u00eb p\u00ebrcaktuara
  me ligji e me gjoba n\u00eb rast mos p\u00ebrmbushje n\u00eb sh\u00ebrbim t\u00eb
  transparenc\u00ebs.\\n\\n5. Bazat ligjore t\u00eb dy institucioneve i k\u00ebrkojn\u00eb
  biznesit t\u00eb nj\u00ebjt\u00ebn t\u00eb dh\u00ebn\u00eb t\u00eb klasifikuar si
  par\u00ebsore, t\u00eb paraqitet n\u00eb dy sisteme t\u00eb ndryshme, tek ai i regjistrit
  t\u00eb biznesit n\u00eb QKB si dhe ai tatimor n\u00eb DPT, \u00e7far\u00eb bie
  ndesh me nenin 7 t\u00eb ligjit nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d.\\n\\n6. QKB dhe DPT jan\u00eb dakord\u00ebsuar
  me marr\u00ebveshjen nr. 1242/1, dat\u00eb 07.09.2017, pa marr\u00eb parasysh faktin
  q\u00eb transparenca mbi t\u00eb dh\u00ebnat e subjekteve n\u00eb QKB e zhb\u00ebn
  konfidencialitetin p\u00ebr t\u00eb nj\u00ebjtat subjekte n\u00eb DPT.\\n\\n7. Subjektet
  dor\u00ebzimin e pasqyrave financiare e kryejn\u00eb n\u00eb dy institucionet (QKB/DPT),
  ku q\u00eb prej vitit 2015 p\u00ebr llogari t\u00eb QKB, e kryen n\u00ebp\u00ebrmbjet
  portalit e-albania (para k\u00ebtij viti k\u00ebto veprime kryheshin n\u00eb sportel),
  nd\u00ebrsa p\u00ebr llogari t\u00eb DPT n\u00eb sistemin tatimor i cili \u00ebsht\u00eb
  dhe p\u00ebrgjegj\u00ebs p\u00ebr v\u00ebnien n\u00eb dijeni t\u00eb QKB p\u00ebr
  subjektet q\u00eb kan\u00eb k\u00ebt\u00eb detyrim.\\n\\nKriteri: Ligji nr. 10325,
  dat\u00eb 23.09.2010 \u201cP\u00ebr bazat e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d
  dhe marr\u00ebveshja institucionale nd\u00ebrmjet tyre me nr. 12420/1, dat\u00eb
  07.09.2017, ligji nr. 9723, dat\u00eb 03.05.2007 \u201cP\u00ebr\\n\\nqendr\u00ebn
  komb\u00ebtare t\u00eb regjistrimit\u201d i p\u00ebrdit\u00ebsuar dhe ligji nr.
  9920, dat\u00eb 19.05.2008 \u201cP\u00ebr procedurat tatimore n\u00eb Republik\u00ebn
  e Shqip\u00ebris\u00eb\u201d i ndryshuar.\\n\\n**Ndikimi/efekti:** Gjenerim t\u00eb
  dh\u00ebnash par\u00ebsore n\u00eb dy sisteme t\u00eb ndryshme p\u00ebr t\u00eb
  nj\u00ebjtin q\u00ebllim, si rezultat i t\u00eb cil\u00ebs nga ana e biznesit, p\u00ebr
  vitin 2017 rezultojn\u00eb t\u00eb jen\u00eb depozituar n\u00eb QKB ankesa lidhur
  me penalitetet e p\u00ebrllogaritur\u00eb p\u00ebr pasqyrat financiare.\\n\\n**Shkaku:**
  K\u00ebrkesa gjendet n\u00eb t\u00eb dy ligjet p\u00ebrkat\u00ebse t\u00eb QKB dhe
  DPT me at\u00eb t\u00eb cil\u00ebve rregullohet veprimtaria e tyre.\\n\\n**R\u00ebnd\u00ebsia:**
  E lart\u00eb. QKB p\u00ebr t\u00eb p\u00ebrmbushur k\u00ebt\u00eb k\u00ebrkese ligjore
  \u00ebsht\u00eb n\u00eb faz\u00ebn e implementimit t\u00eb nj\u00eb sistemi t\u00eb
  ri me objekt zhvillimin e nj\u00eb sistemi mbi p\u00ebrmir\u00ebsimin e sistemit
  aktual si dhe krijimin e moduleve p\u00ebr aksesimin publik t\u00eb informacionit
  financiar pjes\u00eb e t\u00eb cil\u00ebs jan\u00eb pasqyrat financiare dhe raportet
  e aktiviteteit e veprimtaris\u00eb.\\n\\n**Rekomandimi:** Ministria e Financave
  n\u00eb bashk\u00ebpunim me Qendr\u00ebn Komb\u00ebtare t\u00eb Biznesit dhe Drejtorin\u00eb
  e P\u00ebrgjithshme t\u00eb Tatimeve, t\u00eb shqyrtoj\u00eb mbivendosjet e m\u00ebsip\u00ebrme
  ligjore, p\u00ebr sa i p\u00ebrket deklarimit t\u00eb pasqyrave financiare, e cila
  rezulton si e dh\u00ebn\u00eb par\u00ebsore n\u00eb dy institucione (QKB/DPT), si
  rezultat i k\u00ebrkesave ligjore respektive: ligji nr. 9723, dat\u00eb 03.05.2007
  \u201cP\u00ebr qendr\u00ebn komb\u00ebtare t\u00eb regjistrimit\u201d i p\u00ebrdit\u00ebsuar
  dhe ligji nr. 9920, dat\u00eb 19.05.2008 \u201cP\u00ebr procedurat tatimore n\u00eb
  Republik\u00ebn e Shqip\u00ebris\u00eb\u201d i ndryshuar, gj\u00eb e cila vjen n\u00eb
  kund\u00ebrshtim me ligjin nr. 10325, dat\u00eb 23.09.2010 \u201cP\u00ebr bazat
  e t\u00eb dh\u00ebnave shtet\u00ebrore\u201d, konkretisht me:\\n\\nnenin 4 \u201cKrijimi
  i baz\u00ebs s\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore\u201d, pika 3, ku cil\u00ebsohet:\\n\\n\u201cNdalohet
  krijuimi i bazave t\u00eb t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb v\u00eb\u00e7anta
  p\u00ebr t\u00eb nj\u00ebjtin informacion ose q\u00ebllim\u201d.\\n\\nnenin 7 \u201cT\u00eb
  dh\u00ebnat par\u00ebsore dhe dyt\u00ebsore\u201d ku cil\u00ebsohet:\\n\\n\u201cBaza
  e t\u00eb dh\u00ebnave shtet\u00ebrore p\u00ebrmban t\u00eb dh\u00ebnat par\u00ebsore
  dhe t\u00eb dh\u00ebnat dyt\u00ebsore.\\n\\na) T\u00eb dh\u00ebnat par\u00ebsore
  t\u00eb nj\u00eb baze t\u00eb dh\u00ebnash shtet\u00ebrore jan\u00eb informacione
  specifike, t\u00eb mbledhura nga institucioni administrues, n\u00eb p\u00ebrputhje
  me aktin e krijuimit.\\n\\nb) T\u00eb dh\u00ebnat dyt\u00ebsore jan\u00eb t\u00eb
  dh\u00ebnat q\u00eb merren nga nj\u00eb baz\u00eb tjet\u00ebr t\u00eb dh\u00ebnash,
  ku ato jan\u00eb par\u00ebsore\u201d\\n\\n**Nga auditimi lidhur me pik\u00ebn e
  kat\u00ebrt** rezulton se, Qendra Komb\u00ebtare e Biznesit ende nuk disponon list\u00ebn
  zyrtare t\u00eb subjekteve q\u00eb kan\u00eb detyrim dor\u00ebzimin e pasqyrave
  financiare vjetore p\u00ebr vitin financiar 2017 edhe pse afati p\u00ebrfundimtar
  p\u00ebr depozitimtin e tyre, sipas shkrkonj\u00ebs \u201ca\u201d t\u00eb nenit
  43, pika 3 t\u00eb ligjit nr. 9723/2007, \u00ebsht\u00eb data 31 Korrik e \u00e7do
  viti, n\u00eb t\u00eb kund\u00ebrt ndaj subjektit vendoset gjoba prej 15,000 lek\u00eb
  bazuar n\u00eb nenin 74, pika 3, t\u00eb t\u00eb nj\u00ebjtut ligj. Mos v\u00ebnia
  n\u00eb dispozicion e k\u00ebtij informacioni nga DPT \u00ebsht\u00eb n\u00eb kund\u00ebrshtim
  nenin 4, pika 4.7 t\u00eb marr\u00ebveshjes s\u00eb n\u00ebnshkruar nd\u00ebrmjet
  pal\u00ebve. Nga ana e biznesit, p\u00ebr vitin 2017 rezultojn\u00eb t\u00eb jen\u00eb
  depozituar n\u00eb QKB afersisht 15 ankesa lidhur me penalitetet e p\u00ebrllogaritur\u00eb
  p\u00ebr pasqyrat financiare t\u00eb cilat v\u00ebrtetojn\u00eb s\u00ebrisht faktin
  se k\u00ebto t\u00eb dh\u00ebna nuk d\u00ebrgohen n\u00eb m\u00ebnyr\u00eb elektronike
  nga tatimet. P\u00ebr vitin 2016, QKB e ka b\u00ebr\u00eb list\u00ebn publike n\u00eb
  faqen e saj t\u00eb internetit: [http://www.qkb.gov.al/informacion-mbi-proceduren/regjistri-i-biznesit/depozitimi-i-pasqyrave-financiare/](http://www.qkb.gov.al/informacion-mbi-proceduren/regjistri-i-biznesit/depozitimi-i-pasqyrave-financiare/)\\n\\n-
  Lista zyrtare e subjekteve q\u00eb e kan\u00eb detyrim sipas DPT nuk importohet
  n\u00eb sistemin e regjistrit t\u00eb biznesit n\u00eb QKB, por kontrolli n\u00ebse
  subjekti e ka plot\u00ebsuar detyrimin p\u00ebr pasqyrat financiare \u00ebsht\u00eb
  nj\u00eb kontroll plot\u00ebsisht manual, q\u00eb realizohet nga punonj\u00ebsit
  t\u00eb cil\u00ebt miratojn\u00eb k\u00ebrkesat e biznesit. Kontrolli manual rrrit
  mund\u00ebsin\u00eb e gabimit njer\u00ebzor si dhe fiktivisht koh\u00ebn p\u00ebr
  miratimin e veprimeve operacionale, p\u00ebr nj\u00eb krahasim i cili mund t\u00eb
  realizohet leht\u00ebsisht n\u00ebp\u00ebrmjet sistemit.\\n\\nPo me an\u00eb t\u00eb
  Web-it DPT njofton se Qendra Komb\u00ebtare e Biznesit e informon p\u00ebr nj\u00eb
  s\u00ebr\u00eb t\u00eb dh\u00ebnash t\u00eb tjera p\u00ebr t\u00eb leht\u00ebsuar
  procedurat p\u00ebr biznesin n\u00eb lidhje me:\\n\\n- Aplikimet p\u00ebr \u00e7regjistrim;\\n-
  Aplikimet p\u00ebr aktivizim;\\n- Aplikimet p\u00ebr pezullim;\\n- Fillimin e procedurave
  p\u00ebr likuidim;\\n- Bashkimin me p\u00ebrthithje;\\n- Ndarjen e shoq\u00ebr\u00eds\u00eb;\\n-
  Shnd\u00ebrrimin e shoq\u00ebr\u00eds\u00eb;\\n\\nNga auditimi mbi realizimin dhe
  zbatimin e sh\u00ebrbimeve, nd\u00ebrtuar p\u00ebr shk\u00ebmbimin e t\u00eb dh\u00ebnave
  n\u00eb sistemin e regjistrit t\u00eb biznesit, rezulton se QKB \u00ebsht\u00eb
  e gatshme t\u00eb d\u00ebrgoj\u00eb dhe t\u00eb dh\u00ebn\u00ebt e tjera sipas sh\u00ebrbimeve,
  q\u00eb n\u00eb momentin e par\u00eb q\u00eb prit\u00ebsi do t\u00eb b\u00ebj\u00eb
  t\u00eb mundur pritjen. Aktualisht DPT merr nga QKB n\u00eb koh\u00eb reale t\u00eb
  dh\u00ebnat vet\u00ebm p\u00ebr:\\n\\n- Aplikimet p\u00ebr regjistrim filletar;\\n-
  Aplikimet p\u00ebr ndryshim;\\n- Aplikimet p\u00ebr \u00e7regjistrim;\\n- Aplikimet
  p\u00ebr pezullim;\\n\\nDPT nuk merr nga QKB t\u00eb dh\u00ebna n\u00eb koh\u00eb
  reale, por n\u00ebp\u00ebrmjet post\u00ebs elektronike me komunikime periodike javore
  p\u00ebr:\\n\\n- Aplikimet p\u00ebr aktivizim;\\n- Fillimin e procedurave p\u00ebr
  likuidim;\\n- Bashkim me p\u00ebrthithje;\\n- Ndarjen e shoq\u00ebr\u00eds\u00eb;\\n-
  Shnd\u00ebrrimin e shoq\u00ebr\u00eds\u00eb;\\n\\n7. Titulli i gjetjes: Munges\u00eb
  nd\u00ebrveprimi p\u00ebr element t\u00eb r\u00ebnd\u00ebsish\u00ebm\\n\\nSituata:
  Nga auditimi rezultoi se DPT nuk merr nga QKB t\u00eb dh\u00ebna n\u00eb koh\u00eb
  reale, por n\u00ebp\u00ebrmjet post\u00ebs elektronike me komunikime periodike javore
  p\u00ebr:\\n\\n- Aplikimet p\u00ebr aktivizim;\\n- Fillimin e procedurave p\u00ebr
  likuidim;\\n- Bashkim me p\u00ebrthithje;\\n- Ndarjen e shoq\u00ebr\u00eds\u00eb;\\n-
  Shnd\u00ebrrimin e shoq\u00ebr\u00eds\u00eb;\\n\\nKriteri: Marr\u00ebveshja institucionale
  nd\u00ebrmjet QKB dhe DPT me nr. 12420/1, dat\u00eb 07.09.2017.\\n\\nNdikimi/efekt:
  Vonesa 1 javore n\u00eb komunikimin e t\u00eb dh\u00ebnave q\u00eb raportohen si
  t\u00eb dh\u00ebna q\u00eb shk\u00ebmbehen n\u00eb koh\u00eb reale.\\n\\nShkaku:
  Munges\u00eb bashk\u00ebpunimi\\n\\nR\u00ebnd\u00ebsia: E lart\u00eb\\n\\nRekomandimi:
  QKB n\u00eb bashk\u00ebpunim me DPT t\u00eb p\u00ebrfshij\u00eb n\u00eb protokollin
  e komunikimit elektronik dhe t\u00eb realizoj\u00eb shk\u00ebmbimin n\u00eb koh\u00eb
  reale nd\u00ebrmjet sistemeve, t\u00eb dh\u00ebnat q\u00eb marrin periodikisht,
  p\u00ebr nj\u00eb pasqyrim sa m\u00eb t\u00eb sakt\u00eb dhe n\u00eb nj\u00eb afat
  t\u00eb shkurt\u00ebr p\u00ebr: Aplikimet p\u00ebr aktivizim; Fillimin e procedurave
  p\u00ebr likuidim; Bashkim me p\u00ebrthithje; Ndarjen e shoq\u00ebr\u00eds\u00eb;
  Shnd\u00ebrrimin e shoq\u00ebr\u00eds\u00eb.\\n\\nGjithashtu, nj\u00ebsit\u00eb
  vendore nuk rezultojn\u00eb t\u00eb ken\u00eb nd\u00ebrtuar ndonj\u00eb komunikim
  t\u00eb dh\u00ebnash n\u00eb koh\u00eb reale p\u00ebr leht\u00ebsimin e procedurave
  p\u00ebr biznesin pa l\u00ebn\u00eb pas dhe p\u00ebrfitimin n\u00eb kosto dhe koh\u00eb
  t\u00eb aplikimeve t\u00eb ndryshme q\u00eb vijn\u00eb si rezultat i k\u00ebrkesave
  t\u00eb subjektit. Kjo situat\u00eb duket se do zgjas\u00eb nisur nga fakti se realizimi
  i nd\u00ebrveprimit me baz\u00ebn e t\u00eb dh\u00ebnave shtet\u00ebrore t\u00eb
  QKB k\u00ebrkon q\u00eb edhe baza e t\u00eb dh\u00ebnave p\u00ebr \u00e7do nj\u00ebsi
  vendore t\u00eb jet\u00eb e regjistruar si e till\u00eb, n\u00ebse ky komunikim
  duhet t\u00eb kaloj\u00eb n\u00ebp\u00ebrmjet AKSHIT. Me DPTTV rezulton se t\u00eb
  dh\u00ebnat p\u00ebr NIPT thirren nga QKB \u00e7ka ul mund\u00ebsin e gabimit n\u00eb
  regjistrimin manual, por p\u00ebr aplikimet e ndryshme n\u00eb lidhje me statusin
  e subjektit nuk rezultojn\u00eb t\u00eb shk\u00ebmbehen n\u00eb koh\u00eb reale.
  Mungesa e nd\u00ebrveprimit m\u00eb t\u00eb dh\u00ebna krijon pengesa n\u00eb menaxhimin
  e mir\u00eb t\u00eb periudhave aktive t\u00eb subjektit dhe \u00e7do ndryshim t\u00eb
  mos vij\u00eb n\u00eb koh\u00eb reale p\u00ebr tu pasqyruar drejt n\u00eb sistemet
  q\u00eb drejtorit\u00eb vendore disponojn\u00eb p\u00ebr vijelen e taksave t\u00eb
  biznesit. Kjo munges\u00eb komunikimi nuk pengon mbar\u00ebvajtjen e pun\u00ebs
  vet\u00ebm n\u00eb QKB por edhe mbar\u00ebvajtjen e pun\u00ebs n\u00eb nj\u00ebsit\u00eb
  vendore, pasi veprimet me k\u00ebto nj\u00ebsi jan\u00eb plot\u00ebsisht shkresore,
  \u00e7far\u00eb e ngarkon t\u00eb dy pal\u00ebt n\u00eb plot\u00ebsimin e t\u00eb
  dh\u00ebnave manuale.\\n\\nAktualisht, nj\u00ebsit\u00eb vendore marrin t\u00eb
  dh\u00ebna n\u00ebp\u00ebrmjet post\u00ebs elektronike nga QKB t\u00eb dh\u00ebnat
  p\u00ebr:\\n\\n- Aplikimet p\u00ebr regjistrim filletar;\\n- Aplikimet p\u00ebr
  ndryshim;\\n- Miratimi p\u00ebr \u00e7regjistrim;\\n\\n**Workflow:**\\n\\nHapat
  e ndjekur nga regjistruesit dhe miratuesit e veprimeve operacionale n\u00eb QKB
  jan\u00eb dokumentuar me diagrama (Workflow) n\u00eb t\u00eb cil\u00ebt specifikohen
  hapat q\u00eb ndiqen p\u00ebr miratimin e regjistrimit filletar si dhe modifikimin
  e tyre. Veprimet operacionale marrin statuset: aprovuar, refuzuar dhe i pa plot\u00eb.\\n\\n-Nga
  auditimi rezulton se, n\u00eb k\u00ebto diagrama nuk jan\u00eb p\u00ebrfshir\u00eb
  statuset e aplikimit p\u00ebr t\u00eb gjitha rastet nga vjen aplikimi duke qen\u00eb
  se aplikimet vijn\u00eb jo vet\u00ebm nga sporteli por dhe nga portali e-albania,
  si dhe hapat q\u00eb duhet t\u00eb ndiqen kur:\\n\\n  a. Regjistruesi refuzon miratimin
  e nj\u00eb veprimi duke k\u00ebrkuar nga sporteli i QKB t\u00eb b\u00ebhen plot\u00ebsimet
  e nevojshme.\\n  b. Aplikimi vjen nga portali qeveritar E-albania\\n\\n8. Titulli
  i gjetjes: Workflow n\u00eb sistemtin e Regjistrimit t\u00eb biznesit\\n\\n**Situata:**
  Nga auditimi rezulton se, n\u00eb k\u00ebto diagrama nuk jan\u00eb p\u00ebrfshir\u00eb
  statuset e aplikimit p\u00ebr t\u00eb gjitha rastet nga vjen aplikimi duke qen\u00eb
  se aplikimet vijn\u00eb jo vet\u00ebm nga sporteli por dhe nga portali e-albania,
  si dhe hapat q\u00eb duhet t\u00eb ndiqen kur:\\n\\n  a. Regjistruesi refuzon miratimin
  e nj\u00eb veprimi duke k\u00ebrkuar nga sporteli i QKB t\u00eb b\u00ebhen plot\u00ebsimet
  e nevojshme.\\n  b. Aplikimi vjen nga portali qeveritar E-albania\\n\\n**Kriteri:**
  Veprime operacionale q\u00eb nuk gj\u00ebjn\u00eb pasqyrim n\u00ebp\u00ebrmjet gjurm\u00ebs
  s\u00eb auditimit\\n\\n**Ndikimi/efekti:** Munges\u00eb dokumentimi p\u00ebr veprime
  q\u00eb kryhen si dhe gjurm\u00ebs s\u00eb auditimit\\n\\n**Shkaku:** -\\n\\n**R\u00ebnd\u00ebsia:**
  E mesme\\n\\n**Rekomandimi:** QKB t\u00eb pasqyroj\u00eb veprimet e pa dokumentuara
  q\u00eb ndodhin gjat\u00eb rrjedh\u00ebs s\u00eb informacionit, q\u00eb menaxhohet
  n\u00ebp\u00ebrmjet sistemit, si dhe t\u00eb kryej\u00eb pasqyrimin e ndryshimeve
  n\u00eb t\u00eb gjith\u00eb manualet apo udh\u00ebzuesit q\u00eb disponon p\u00ebr
  p\u00ebrdorimin e sistemeve.\\n\\nVeprime me miratim n\u00eb sportel\\n\\nP\u00ebr
  \u00e7do veprim operacional q\u00eb vjen nga sportelet e QKB apo nga e-albania,
  kontrolli dhe miratimi kryhet nga Drejtoria e regjistrimit t\u00eb biznesit lejeve,
  licencave dhe autorizimeve, Sektori i regjistrimit t\u00eb Biznesit. Me q\u00ebllim
  thjeshtimin e veprimeve operacionale n\u00eb sportel, fluksi \u00ebsht\u00eb deleguar
  tek regjistruesit, q\u00eb aktualisht duhet t\u00eb kalojn\u00eb \u00e7do veprim
  n\u00eb miratim edhe kur rishku \u00ebsht\u00eb i ul\u00ebt ose i pa konsideruesh\u00ebm.\\n\\nN\u00eb
  sistemin e regjistrit t\u00eb biznesit, krijime apo ndryshime n\u00eb fusha t\u00eb
  caktuara t\u00eb elementeve t\u00eb caktuar t\u00eb regjistrit, t\u00eb cilat nuk
  p\u00ebrb\u00ebjn\u00eb rishk, apo jan\u00eb leht\u00ebsisht t\u00eb verifikuesh\u00ebm
  q\u00eb n\u00eb sportel, nuk rezulton q\u00eb t\u00eb miratohen n\u00eb momentin
  e aplikimit. Miratimi i thjesht\u00eb (simple aprove) nuk \u00ebsht\u00eb marr\u00eb
  n\u00eb konsiderat\u00eb edhe pse volumi i veprimeve q\u00eb kontrollohen \u00ebsht\u00eb
  n\u00eb sasi t\u00eb konsiderueshme me mesatarisht 400 aplikime n\u00eb sistem n\u00eb
  dit\u00eb ku afati p\u00ebr p\u00ebrgjigjen e aplikimeve \u00ebsht\u00eb 24 or\u00eb
  si dhe 90 shkres\u00eb zyrtare q\u00eb trajtohen nga ky sektor.\\n\\nT\u00eb dh\u00ebna
  t\u00eb caktuara p\u00ebr biznesin t\u00eb cilat kan\u00eb t\u00eb b\u00ebjn\u00eb
  me t\u00eb dh\u00ebna vullnetare apo t\u00eb dh\u00ebna t\u00eb cilat mund t\u00eb
  realizohen me miratim q\u00eb n\u00eb momentin e aplikimit n\u00eb sportel, pa q\u00ebn\u00eb
  nevoja p\u00ebr nj\u00eb miratim n\u00eb nj\u00eb shkall\u00eb tjet\u00ebr.\\n\\n9.
  Titulli i gjetjes: Veprime me miratim t\u00eb thjesht\u00eb n\u00eb sportel\\n\\nSituata:
  Thjeshtimi i veprimeve operacionale n\u00eb sportel ka deleguar fluksin tek regjistruesit,
  q\u00eb aktualisht duhet t\u00eb kalojn\u00eb \u00e7do veprim n\u00eb miratim edhe
  kur rishku \u00ebsht\u00eb i ul\u00ebt ose i pa konsideruesh\u00ebm. Nga QKB nuk
  \u00ebsht\u00eb marr\u00eb n\u00eb konsiderat\u00eb miratimi i thjesht\u00eb (simple
  aprove) n\u00eb momentin e aplikimit, p\u00ebr krijime apo ndryshime t\u00eb elementeve
  t\u00eb caktuar t\u00eb regjistrit q\u00eb jan\u00eb leht\u00ebsisht t\u00eb verifikuesh\u00ebm
  q\u00eb n\u00eb sportel.\\n\\nKriteri: Volumi i veprimeve \u00ebsht\u00eb mesatarisht
  400 aplikime n\u00eb sistem n\u00eb dit\u00eb dhe afati i p\u00ebrcaktuar n\u00eb
  aktet ligjore t\u00eb QKB k\u00ebrkohet p\u00ebrgjigjja e aplikimeve p\u00ebr 24
  or\u00eb.\\n\\nNdikimi/efekti: Me q\u00ebllim thjeshtimin e veprimeve operacionale
  n\u00eb sportel, fluksi \u00ebsht\u00eb deleguar tek regjistruesit, q\u00eb aktualisht
  duhet t\u00eb kalojn\u00eb \u00e7do veprim n\u00eb miratim edhe kur rishku \u00ebsht\u00eb
  i ul\u00ebt ose i pa konsideruesh\u00ebm.\\n\\nShkaku: Implementimi n\u00eb sistem
  i konceptit t\u00eb kontrollit t\u00eb dyfisht\u00eb n\u00eb regjistrimin e veprimeve.\\n\\nR\u00ebnd\u00ebsia:
  E Lart\u00eb\\n\\nRekomandimi: QKB t\u00eb analizoj\u00eb nevojn\u00eb p\u00ebr
  miratim t\u00eb veprimeve operacionale me rishk t\u00eb ul\u00ebt, p\u00ebr t\u00eb
  gjitha llojet e sporteleve p\u00ebrfshir\u00eb dhe sh\u00ebrbimin online t\u00eb
  e-albania, p\u00ebr kalimin me miratim t\u00eb thjesht\u00eb n\u00eb sportel, n\u00eb
  funksion t\u00eb nj\u00eb meaxhimi m\u00eb t\u00eb mir\u00eb t\u00eb k\u00ebrkesave
  nga biznesi, si dhe t\u00eb burimeve njer\u00ebzore q\u00eb vet\u00eb institucioni
  disponon.\\n\\nQKB \u00ebsht\u00eb p\u00ebrgjegj\u00ebse p\u00ebr krijuimin, standardizimin,
  operimin dhe mir\u00ebfunksionimin e t\u00eb gjith\u00eb formular\u00ebve dhe pun\u00ebs
  operacionale t\u00eb p\u00ebrdoruesve n\u00eb nivele t\u00eb ndryshme t\u00eb baz\u00ebs
  s\u00eb t\u00eb dh\u00ebnave elektronike t\u00eb Regjistrit Tregtar.\\n\\nStandardizimi
  i formular\u00ebve t\u00eb aplikimit \u00ebsht\u00eb nj\u00eb proces i cili ka filluar
  n\u00ebp\u00ebrmjet sh\u00ebrbimeve t\u00eb integruara tek ADISA faqja zyrtare e
  t\u00eb cil\u00ebs \u00ebsht\u00eb: http://www.adisa.gov.al/lista-e-sherbimeve-qkb/,
  ku rezulton se ka p\u00ebrfunduar p\u00ebr 169 formular\u00eb t\u00eb regjistrimit
  t\u00eb biznesit dhe licencimit.\\n\\n-Nga auditimi rezulton se formular\u00ebt
  e pa standardizuar, p\u00ebr regjistrin tregtar, jan\u00eb si m\u00eb posht\u00eb:\\n\\n|
  Nr | Formular                  |\\n|----|---------------------------|\\n| 1  | Regjistrim
  Person Fizik   |\\n\\n|   | Description                                                                 |\\n|---|-----------------------------------------------------------------------------|\\n|
  2 | Regjistrim Shoq\u00ebri Aksionare                                                |\\n|
  3 | Regjistrim Shoq\u00ebri Anonime me Oferte Publike                                 |\\n|
  4 | Regjistrim filletar p\u00ebr efekt t\u00eb ndarjes p\u00ebr Shoq\u00ebri Aksionare                |\\n|
  5 | Regjistrim Dege e Shoq\u00ebrise s\u00eb Huaj                                          |\\n|
