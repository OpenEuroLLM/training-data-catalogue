  p\u00ebr monitorimin dhe zbatimin e kontrat\u00ebs n\u00eb p\u00ebrputhje me k\u00ebrkesat
  e saj.\\n\\n**R\u00ebnd\u00ebsia e shkeljes:** E mesme\\n\\n3. **Titulli i gjetjes:**
  \\\"Verifikim mbi personelin q\u00eb ka b\u00ebr\u00eb sh\u00ebrbimin\\\".\\n\\n**Situata:**
  Nga auditimi i u konstatua BOE (Kontraktuesi), nuk ka kryer sh\u00ebrbimin e mir\u00ebmbajtjes
