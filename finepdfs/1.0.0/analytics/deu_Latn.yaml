  "\"Ausstellung Begr\u00fc\u00dfungsgeld in Geras Neuer Mitte\\n\\nIn Geras Neuer
  Mitte ist in einem Container aktuell die Ausstellung \u201eBegr\u00fc\u00dfungsgeld\\\"
  zu sehen\\n\\n30. August 2017 / 02:13 Uhr\\n\\nDer K\u00fcnstler Hans Ferenz spricht
  zur Er\u00f6ffnung der Ausstellung \u201eBegr\u00fc\u00dfungsgeld\\\" in Geras Neuer
  Mitte\\n\u00fcber die Bilder, die er herausgesucht hat und bis Sonntag zeigt. Foto:
  Katja Grieser\\n\\nGera. \u201eIch m\u00f6chte das Verst\u00f6rende zeigen\\\",
  sagt Hans Ferenz und beschreibt damit genau das, was seine Ausstellung \u201eBegr\u00fc\u00dfungsgeld
  \u2013 \u00dcber Fl\u00fcchten und Ankommen\\\" beim Betrachter hinterl\u00e4sst.
  Es ist verst\u00f6rend, wie \u00e4hnlich die Motive der Fotos der DDR-Flucht 1989
  und davor denen sind, die es aktuell beispielsweise von Syrern auf dem Weg aus ihrer
  Heimat gibt. \u201eIch h\u00f6re immer wieder: \u201aDas kann man nicht vergleichen''.
  Das stimmt auch\\\", so der K\u00fcnstler. Er zeigt seine Schau in dieser Woche
  in Geras Neuer Mitte in einem Container, der an die Auszahlungsschalter erinnern
  soll, an denen einst Begr\u00fc\u00dfungsgeld an die DDR-B\u00fcrger ausgeteilt
  wurde.\\n\\nVergleichbar sind die Fluchten nicht, obwohl hinter beiden der Wunsch
  der Menschen steht, dass es ihnen besser geht. Den gro\u00dfen Unterschied erkl\u00e4rt
  Ferenz, der die Ausstellung am Montag er\u00f6ffnete, so: \u201eIn der DDR konnte
  man leben. Wenn man versucht hat, \u00fcber die Grenze zu kommen, dann wurde man
  erschossen. In Syrien ist es anders: Da besteht die Gefahr, erschossen zu werden,
  wenn man im Land bleibt.\\\"\\n\\nAn die Vor- und Wende-Zeit will der K\u00fcnstler
  erinnern, zugleich zum Vergleichen mit der aktuellen Situation anregen. \u201eIch
  m\u00f6chte nicht, dass mit Fl\u00fcchtlingen von Heute unkritisch umgegangen wird,
  aber sorgsam\\\", so Hans Ferenz, der in West-Berlin aufgewachsen ist und seit einigen
  Jahren in Th\u00fcringen unter anderem Demokratieprojekte durchf\u00fchrt.\\n\\nGezeigt
  wird die Ausstellung bis Sonntag vom Verein Gedenkst\u00e4tte Amthordurchgang, der
  von der Staatskanzlei, der Stadt sowie der Initiativgruppe zur Gestaltung von Geras
  Neuer Mitte unterst\u00fctzt wurde. Vereinschef Frank Karbstein erinnerte daran,
  wie schnell die Fluchtwelle vor 28 Jahren in Vergessenheit geraten ist \u2013 und\u2009dass
  die aktuell Gefl\u00fcchteten ganz anders beurteilt werden. \u201eWillkommen sind
  Fl\u00fcchtlinge meist nicht\\\", wei\u00df er. Selbst die, die einst selbst ihre
  Heimat verlassen haben, k\u00f6nnten nach Jahren h\u00e4ufig kein Verst\u00e4ndnis
  f\u00fcr diejenigen aufbringen, die diesen Weg heute beschreiten. Zur Ausstellung
  gibt es ein Rahmenprogramm rund um das Thema Flucht.\\n\\nWeitere Aktionen\\n\\nHeute,
  13 bis 14.30 Uhr: \u201eDrawing Resistance\\\", Zeichnen mit Widerstand, mit Alexander
  Neugebauer.\\n\\nMorgen, 15.30 bis 17 Uhr: Gespr\u00e4chsrunde mit Gefl\u00fcchtetenberater
  Mohamed Oussaifi zum Thema \u201eAnkommen in Gera\\\".\\n\\nSonntag, 14 Uhr: Sonderf\u00fchrung
  durch die Ausstellung \u201eFremde in der Heimat \u2013 Heimat in der Fremde? Aufbruch
  und Ankommen aus acht Jahrhunderten\\\" mit Matthias\u2009Wagner, Treff am Container.\\n\\nKatja
  Grieser / 30.08.17\\n\\n(Quelle: http://gera.otz.de/web/gera/startseite/detail/-/specific/AusstellungBegruessungsgeld-in-Geras-Neuer-Mitte-304668283)\"",
