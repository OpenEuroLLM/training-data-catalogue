  Rektoratsdienst\"", "\"\\n\\nEwig geborgen\\n\\nWenn kleine Kinder sterben\\n\\nChristliche
  Literatur-Verbreitung e.\u2009V. Postfach 11\u2009\u200901\u2009\u200935\u2009\u2009\u00b7\u2009\u200933661
  Bielefeld\\n\\n1. Auflage 2009\\n\\n\u00a9 2003 by John MacArthur Originaltitel:
  Safe in the arms of God: truth from heaven about the death of a child Originalverlag:
  Thomas Nelson Publishers, Nashville, USA\\n\\n\u00a9 der deutschen Ausgabe 2009
  by CLV Christliche Literatur-Verbreitung Postfach 11 01 35 \u00b7 33661 Bielefeld
  Internet: www.clv.de\\n\\n\u00dcbersetzung: Hermann Grabe, Meinerzhagen Umschlag:
  Lucian Binder, Marienheide Satz: CLV Druck: GGP Media GmbH, P\u00f6\u00dfneck\\n\\nISBN
  978-3-86699-214-6\\n\\nInhalt\\n\\nDieses Buch ist dem lieben Gedenken an jene Kleinen
  gewidmet, die aus den Familien meiner Gemeinde in den Himmel gegangen sind \u2013
  und von deren Eltern einige in diesem Buch ihr sieghaftes Zeugnis mitteilen.\\n\\nWo
  ist mein Kind?\\n\\n\u00bbWas ist mit dem zweij\u00e4hrigen Kind, das am Grund des
  World Trade Centers zerschmettert wurde?\u00ab\\n\\nDiese Frage schoss Larry King
  gegen mich ab. Ich war eingeladen, an einer Podiumsdiskussion mit Larry King teilzunehmen,
  die an einem Samstagabend im Fernsehen lief. Das Programm wurde im Zusammenhang
  mit den Nachwirkungen des 11. Sep\u00ad tember 2001 aufgenommen, an dem die Vereinigten
  Staaten so schwer getroffen wurden. Obgleich wir als Teil des Programms \u00fcber
  Leben und Tod, \u00fcber Trauer und Hoffnung debattiert hatten, wurde ich von Larrys
  Frage doch heftig \u00fcberrascht.\\n\\n\u00bbSofort im Himmel\u00ab, war meine
  spontane Antwort.\\n\\nLarry schoss die zweite Frage ab: \u00bbEs war also kein
  S\u00fcnder?\u00ab\\n\\nUnd wieder sagte ich: \u00bbSofort im Himmel.\u00ab\\n\\nLarrys
  herausfordernde Fragen wiesen auf einen qu\u00e4\u00ad lenden Kummer hin, der viele
  Herzen besch\u00e4ftigt.\\n\\nWas passiert mit einem Baby, das vom Schutt des einst\u00fcrzenden
  World Trade Centers zermalmt wurde? Was ist mit Babys, die sterben? Was geschieht
  mit einem Ungeborenen, einem Kleinkind, einem gr\u00f6\u00dferen Kind oder mit einem
  Menschen, der vielleicht k\u00f6rperlich erwachsen, aber geistig auf der Stufe eines\\n\\nKleinkindes
  zur\u00fcckgeblieben ist und dann stirbt? Was ist das Schicksal dieser \u00bbKleinen\u00ab,
  wenn sie in die Ewigkeit eingehen? Das sind f\u00fcr manche Eltern unertr\u00e4glich
  qu\u00e4lende Fragen, seien sie nun Christen oder nicht.\\n\\nZahlreiche ziemlich
  eigenartige und schlecht be\u00adgr\u00fcn\u00ad dete Antworten sind in der Vergangenheit
  schon auf diese Fragen gegeben worden. Die richtige Antwort jedoch lautet schlicht
  und einfach: \u00bbSofort im Himmel.\u00ab\\n\\nIm Rahmen einer solch knapp bemessenen
  Sendung wie Larry King Live hatte ich keine M\u00f6glichkeit zu einer Erkl\u00e4rung
  meiner Aussage und, offen gesagt, Larry wollte auch gar keine h\u00f6ren. Er schien
  mit der schnellen und klaren Antwort zufrieden zu sein. Und so ging er zu anderen
  Fragen \u00fcber, die sich mit den vielerlei Schmerzen unseres Volkes und damit
  befassten, wie wir uns von den Folgen der Trag\u00f6die dieses Tages erholen k\u00f6nnten.\\n\\nAber
  ich glaube, Sie haben eine ausf\u00fchrlichere Antwort verdient, da Sie dieses Buch
  h\u00f6chstwahrscheinlich lesen, weil Sie den Verlust eines Kindes erlitten haben
  \u2013 oder Sie befinden sich in der Lage eines Men\u00ad schen, der wie ich als
  Pastor nur allzu oft jemanden tr\u00f6sten und ermutigen soll, der ein Kind verloren
  hat. Ich leide zutiefst mit allen Eltern, die ein Kind verloren haben, und das brachte
  mich dazu, die Bibel wegen dieser Fragen zu untersuchen, um mit biblisch\\n\\nbe\u00adgr\u00fcndeten
  Worten Trost und Ermutigung anbieten zu k\u00f6nnen.\\n\\nAu\u00dferdem meine ich,
  dass der Bedarf an Antworten auf die Fragen \u00fcber das Sterben von Kindern weiterhin
  zunehmen wird. Wenn wir \u00fcber die Rolle nachdenken, die die reichen L\u00e4nder
  k\u00fcnftig einnehmen m\u00fcssen, um Naturkatastrophen, Hunger und anderem Leid
  in vielen Teilen der Welt zu begegnen, dann stellt sich auch immer die Frage: \u00bbWas
  ist mit den Kindern, die gestorben oder einem beinahe sicheren Tod ausgeliefert
  sind?\u00ab\\n\\nWenn wir an Kriege denken, erhebt sich die Frage: \u00bbWas geschieht
  mit den unschuldigen Kindern, die dabei umkommen?\u00ab\\n\\nAuch wenn wir an den
  Tod von Kindern denken, die zu Familien aus heidnischen Kulturen geh\u00f6ren oder
  v\u00f6llig atheistisch sind, dann fragen sich viele Christen: \u00bbWas wird aus
  diesen Kleinen?\u00ab\\n\\nUnser Kummer \u00fcber das Sterben scheint immer viel
  st\u00e4rker und herzbewegender zu sein, wenn es sich um den Tod eines Kindes handelt.
  Es ist immer be\u00adsonders tragisch und bitter, wenn bei einem Unfall oder einer
  Krankheit ein kleines Kind ums Leben kommt.\\n\\nMillionen sterben \u2013 oder leben
  sie jetzt?\\n\\nW\u00e4hrend der gesamten Menschheitsgeschichte gilt die gro\u00dfe,
  traurige Wahrheit, dass Hunderte Mil\u00adlionen\\n\\n\u2013 ja, vielleicht Milliarden
  \u2013 ungeborener, neu\u00adgebore\u00ad ner und kleiner Kinder gestorben sind.
  Millionen ster\u00adben zu unseren Lebzeiten.\\n\\nIn der urspr\u00fcnglichen Sch\u00f6pfung
  lebten Adam und Eva ohne die Realit\u00e4t des Todes. Nach 1. Mose 1,2628 gab Gott
  der Menschheit die Macht, Leben in einer todesfreien Welt hervorzubringen. Von Adam
  und Eva wurde erwartet, \u00bbfruchtbar zu sein und sich zu mehren\u00ab. Sie sollten
  sich fortpflanzen und die Erde mit Kindern bev\u00f6lkern, die ebenfalls den Tod
  nicht kennenlernen w\u00fcrden. Gottes urspr\u00fcnglicher Plan war, dass jedes
  irgendwann gezeugte menschliche Leben f\u00fcr alle Ewigkeit existieren sollte.\\n\\nAls
  Adam und Eva s\u00fcndigten, wurde der Tod Wirklichkeit. Der Fluch des Todes \u00fcber
  dem Leben der ersten Eltern wurde der Fluch des Todes \u00fcber jedem Leben, das
  jemals empfangen werden sollte. Der Tod wurde nicht nur Wirklichkeit f\u00fcr die
  Er\u00adwachsenen, sondern ebenso f\u00fcr die Kinder. Seit den ersten Tagen der
  Geschichte bis in die Gegenwart hinein ist es keineswegs \u00fcbertrieben, davon
  auszugehen, dass die H\u00e4lf\u00adte aller jemals gezeugten Menschen starben,
  be\u00ad vor sie erwachsen waren.\\n\\nErst k\u00fcrzlich las ich diese ziemlich
  erschreckende Statistik:\\n\\n* Ungef\u00e4hr 25\u2009% aller Empf\u00e4ngnisse
  erreichen nicht die zwanzigste Woche der Schwangerschaft. Mit anderen Worten: Mindestens
  jeder vierte Mensch\\n\\nstirbt im Mutterleib. 75\u2009% dieser Todesf\u00e4lle
  ge\u00ad schehen in den ersten zw\u00f6lf Wochen.\\n\\n* Perinatale Todesf\u00e4lle
  \u2013 Todesf\u00e4lle w\u00e4hrend der Ge\u00adburt \u2013 treten auch heute noch
  im gro\u00dfen Stil welt\u00adweit auf \u2013 trotz der Fortschritte der modernen
  Medizin. Eine Weltgesundheitsorganisation be\u00adrichtete, dass im Jahre 1999 4\u2009350\u2009000
  Ba\u00adbys bei der Geburt starben; aber viele Experten mei\u00ad nen, die tats\u00e4chliche
  Anzahl sei wesentlich h\u00f6\u00adher. Sie sch\u00e4tzen, dass weltweit ann\u00e4hernd
  zehn Millionen Babys j\u00e4hrlich bei der Ge\u00adburt sterben, weil die meisten
  Todesf\u00e4lle nicht ge\u00admeldet werden.\\n\\nDie h\u00f6chsten Raten der Kindersterblichkeit
  scheint es nat\u00fcrlich bei den \u00e4rmsten und unterentwickeltsten V\u00f6lkern,
  besonders in Afrika und Asien, zu geben. Diese V\u00f6lker sind auch am st\u00e4rksten
  dem Heidentum verhaftet. In Afghanistan sterben zum Beispiel mindestens 150 von
  1000 Babys. In Angola liegt die Rate sogar noch h\u00f6her. 200 von 1000 Babys sterben
  dort w\u00e4hrend der Geburt oder kurz danach. Und dann gibt es die erschreckenden
  Abtreibungsstatistiken, die uns allen bekannt sind.\\n\\nWenn man anf\u00e4ngt,
  diese Millionen im Laufe der Ge\u00ad schichte zu addieren, dann ergibt das unz\u00e4hlige
  Milliarden von Menschen, die in die Ewigkeit kamen, bevor sie erwachsen wurden.\\n\\nWo
  befinden sich jetzt die Seelen dieser Menschen?\\n\\nBev\u00f6lkern sie jetzt in
  unvorstellbaren Scharen allesamt entweder die H\u00f6lle oder aber den Himmel? Oder
  bev\u00f6lkern sie in ebendieser unvorstellbaren Menge teilweise den Himmel und
  auch die H\u00f6lle? Was ist richtig?\\n\\nWir brauchen Antworten, die sich auf
  Wahrheit gr\u00fcnden\\n\\n\u00bbIst mein Baby im Himmel?\u00ab\\n\\nWenn jemand
  Sie so fragte, was w\u00fcrden Sie dann antworten?\\n\\nEinige beantworten diese
  Frage auf sentimenta\u00adle Wei\u00adse oder so, wie die Wahrheit ihrer Hoffnung
  ge\u00ad m\u00e4\u00df aussehen k\u00f6nnte. Fragt man genauer nach, so ist gew\u00f6hnlich
  das einzige Argument, sie k\u00f6nnten sich nicht vorstellen, dass Gott ein so s\u00fc\u00dfes
  Ge\u00adsch\u00f6pfchen abweisen k\u00f6nnte. Ein Allvers\u00f6hner hat nat\u00fcrlich
  eine schnelle Antwort, weil er glaubt, dass jeder nach dem Tod in den Himmel kommt.
  Am anderen Ende des Spektrums sind jene, die meinen, ein ungeborenes Kind habe keine
  Seele und darum auch keine ewige Bestimmung. Dazwischen liegen alle anderen mit
  ihren diversen Ansichten und Glaubensvorstellungen. Einige erkl\u00e4ren, nur einige
  \u00bbauserw\u00e4hlte\u00ab Kleinkinder k\u00e4men in den Himmel, w\u00e4hrend
  die \u00bbnicht erw\u00e4hlten\u00ab endlose Strafe erlitten. Andere glauben, die
  Kindertaufe sch\u00fctze ein Kind vor der H\u00f6lle und sichere ihm einen Platz
  im Himmel, doch \u00fcbersehen\\n\\nsie dabei die Seelen der vor der Geburt gestorbenen
  Kinder. Andere wieder glauben, dass alle Kinder, die sterben, in den Himmel kommen,
  weil Gott Gefallen daran hat, ihnen seine souver\u00e4ne Gnade in besonderer Weise
  zuzuwenden.\\n\\nMeine Antwort an Larry King mag etwas flott \u2013 ja, sogar unbedacht
  \u2013 erscheinen, wenn man sie so liest. Aber ich hatte sie nicht \u00bbaus dem
  \u00c4rmel gesch\u00fcttelt\u00ab. Schon sehr fr\u00fch in meinem Dienst wurde ich
  mit der Frage nach dem Schicksal gestorbener Babys kon\u00ad fron\u00adtiert. Meine
  Suche nach einer biblisch begr\u00fcndeten Antwort begann als Nachspiel eines schreck\u00ad
  lichen Erlebnisses an einem Samstagmorgen.\\n\\nDamals hatte ich ein Studierzimmer,
  das auf den Hofraum der Gemeinde hinausblickte. Die Beschriftung auf der Glast\u00fcr
  lautete eindeutig: \u00bbB\u00fcro des Pastors\u00ab. Ich h\u00e4tte deshalb nicht
  \u00fcber das erstaunt sein d\u00fcrfen, was an jenem Morgen geschah, w\u00e4hrend
  ich in meinem B\u00fcro sa\u00df und der Predigt f\u00fcr den kommenden Tag den
  letzten Schliff gab.\\n\\nEine Frau kam an die Verandat\u00fcr und klopfte erregt
  daran. Ich stand gleich auf, um zu \u00f6ffnen, da h\u00f6rte ich sie schon in gro\u00dfer
  Angst rufen: \u00bbKommen Sie bitte schnell! Ich glaube, mein Kind ist gestorben!\u00ab\\n\\nIch
  folgte ihr eilig zu ihrer Wohnung, nur wenige H\u00e4user von der Gemeinde entfernt.
  Als ich hinein\u00ad gegangen war, fand ich leider ihr kleines Kind tot im K\u00f6rbchen
  liegend.\\n\\nDann h\u00f6rte ich mich dieser verzweifelten jungen Mutter sagen,
  was ich f\u00fcr Worte des Trostes hielt: \u00bbDein Baby ist im Himmel. Es ist
  ewig geborgen \u2013 sicher in Gottes Armen.\u00ab\\n\\nErst weinte sie hemmungslos;
  doch als diese Worte in ihr Bewusstsein drangen, wurde sie ruhiger. Ich blieb bei
  ihr, bis der \u00e4rztliche Notdienst und nahe Verwandte eintrafen und sich um sie
  k\u00fcmmerten. Dann kehrte ich in meine Studierstube zur\u00fcck, v\u00f6llig durcheinander
  wegen dieser pl\u00f6tzlichen Unterbrechung meiner Arbeit und besonders wegen der
  Endg\u00fcltigkeit des Ablebens dieses winzigen Babys und wegen dessen, was ich
  aus meinem pastoralen Herzen heraus gesagt hatte.\\n\\nIn den folgenden Tagen dachte
  ich immer wieder \u00fcber das Erlebte nach. Intuitiv f\u00fchlte ich, dieser verst\u00f6rten
  und trauernden Mutter das Richtige mitgeteilt zu haben; andererseits wurde ich auch
  sehr gedr\u00e4ngt, mir Gewissheit zu verschaffen, ob ich ihr die Wahrheit gesagt
  hatte. War meine Antwort ihr gegen\u00fcber durch Gottes Wort belegbar? Oder hatte
  ich nur etwas gesagt, von dem ich meinte, es w\u00fcrde in diesem Augenblick der
  Verzweiflung Trost geben?\\n\\nSo begann ich, die Bibel nach dem abzusuchen, was
  sie \u00fcber den Tod von Babys und kleinen Kindern sagt, einschlie\u00dflich jener
  Kinder, die im Mutterleib oder bei der Geburt sterben oder nie so weit erwachsen
  werden, dass sie Recht von Unrecht zu unterscheiden lernen. Und durch diese Studien
  kam ich zu den Schl\u00fcssen, die in diesem Buch dargestellt werden. Dabei will
  ich Sie nachdr\u00fccklich darauf hinweisen, dass dies keineswegs ein schmalziges
  \u00bbTrostbuch\u00ab ist. Weil ich \u00fcberzeugt bin, dass der einzige wahre Trost
  aus Gottes Wort kommt, werde ich auch Themen wie S\u00fcnde und Pr\u00e4destination
  (Vorherbestimmung) ebenso an\u00adsprechen wie die Frage, wann Kinder in das Alter
  kommen, in dem sie selbst verantwortlich handeln.\\n\\nIch denke, Sie werden letztlich
  f\u00fcr diesen Ansatz dankbar sein, weil Sie sich nicht auf sentimentale gute W\u00fcnsche
  f\u00fcr Herz und Gem\u00fct verlassen wollen, sondern auf die Aussagen Gottes in
  seinem Wort. Gef\u00fchle kommen und gehen; aber die Wahrheit des g\u00f6ttlichen
  Wortes ist v\u00f6llig best\u00e4ndig und ver\u00ad trauens\u00adw\u00fcrdig.\\n\\nMeine
  Antwort an Larry King war also nicht nur eine schnelle Antwort auf eine schnelle
  Frage. Sie war der Ausdruck dessen, wovon ich vollkommen \u00fcberzeugt bin, nachdem
  ich die Bibel jahrelang sorgf\u00e4ltig und gewissenhaft durchforscht hatte.\\n\\n\u00bbSofort
  im Himmel\u00ab \u2013 das ist in Wahrheit das Schicksal der Babys und kleinen Kinder.\\n\\nIch
  will Ihnen jetzt erkl\u00e4ren, warum das wahr ist.\\n\\nWas k\u00f6nnen wir denen
  mit Gewissheit sagen, deren Arme leer sind?\\n\\nLily wachte an diesem Morgen fr\u00fcher
  als gew\u00f6hnlich auf, und ihr erster Gedanke galt ihrem Kind in der Wiege. Drei
  Tage zuvor hatte sie die kleine Eunice zur Welt gebracht, und Lily empfand gro\u00dfe
  Zufriedenheit dar\u00fcber, jetzt au\u00dfer ihren beiden wilden Jungen eine Tochter
  zu haben. Allerdings war die kleine Eunice von Anfang an apathisch und blass gewesen,
  ganz anders als ihre beiden Br\u00fcder nach deren Ge\u00ad burt. Sie schien h\u00e4ufig
  zu zittern, als fr\u00f6re sie in\u00ad nerlich, obwohl Lily und die sie unterst\u00fctzende
  He\u00ad bam\u00adme kein Fieber entdecken konnten. Weil sie stets f\u00fcrchtete,
  die Kleine k\u00f6nnte frieren, hatte sie die Wie\u00ad ge nahe an den Kamin geschoben.\\n\\nLily
  merkte gleich, als sie an jenem Morgen ins Wohn\u00adzimmer trat, dass das Feuer
  ausgegangen war \u2013 nicht einmal einige gl\u00fchende Kohlen waren noch zu entdecken.
  Sie eilte sofort zur Wiege und nahm Eunice hoch, um \u2013 von einem starken m\u00fctterlichen
  Instinkt ge\u00adleitet \u2013 der Kleinen von ihrer W\u00e4rme abzugeben. Zu ihrem
  Entsetzen war das Baby steif und kalt. Irgendwann zwischen Lilys Kontrolle um 1
  Uhr nachts und ihrem Kommen jetzt um f\u00fcnf Uhr morgens war Eunice gestorben.\\n\\nLilys
  schmerzliches Klagen weckte ihren Mann und\\n\\ndie S\u00f6hne. Man konnte sie nicht
  tr\u00f6sten, und stundenlang weigerte sie sich, Eunice aus den Armen zu geben,
  w\u00e4hrend sie sie immer hin und her schaukelte und laut schluchzte. Schlie\u00dflich
  sagte ihr Mann Marvin zu den beiden Jungen: \u00bbWir m\u00fcssen Mutter eine Weile
  allein lassen.\u00ab Die drei entfachten das Feuer im Kamin, schlossen die T\u00fcr
  zum Wohnzimmer und lie\u00dfen Lily so lange jammern, bis sie keine Tr\u00e4nen
  mehr hatte. Am Ende fiel sie in einen abgrundtiefen Schlaf. Da erst konnte Marvin
  ihr das tote Baby aus den Armen nehmen und sowohl den Pastor als auch den Hausarzt
  rufen.\\n\\nEin schlichter Beerdigungsgottesdienst fand am kalten Nachmittag des
  folgenden Tages statt. Der Prediger sagte einige Worte, als der kleine Sarg in die
  Erde gesenkt wurde, und die Familie kehrte in das schweigsame Haus zur\u00fcck,
  das sonst vom Lachen und von der W\u00e4rme sowie dem Duft erf\u00fcllt war, den
  die Suppen und anderen Gerichte verbreiteten, die Lily fast st\u00e4ndig kochte.\\n\\nIn
  ihrem Dorf sprach es sich herum, dass Lily ein Kind bekommen hatte, das nur drei
  Tage gelebt hatte. Die meisten ihrer Freunde und Nachbarn erfuhren von dem Verlust
  erst, nachdem Eunice beerdigt war. Nur wenige erw\u00e4hnten das tragische Geschehen
  um das Baby in Marvins und Lilys Gegenwart. Lediglich ein Junge kam in der Schule
  zu ihren S\u00f6hnen und sagte: \u00bbIch habe von eurer Schwester geh\u00f6rt.
  Das tut\\n\\nmir wirklich leid.\u00ab Auch besuchten nur sehr wenige ihrer Freunde
  und Glaubensgeschwister Lily und Marvin zu Hause.\\n\\nDie Frau eines Paares, das
  zu Besuch kam, meinte an Lily gewandt: \u00bbEs war so das Beste, meine Liebe. Du
  solltest einfach ganz schnell vergessen, was ge\u00adsche\u00ad hen ist. Wir brauchen
  nie wieder dar\u00fcber zu reden.\u00ab\\n\\nLily konnte sich nicht vorstellen,
  wie sie das jemals vergessen sollte. Und warum sollte sie \u00fcber ihre Tochter
  nie wieder reden? Eunice hatte neun Monate in ihr gelebt, wenn auch nur drei Tage
  lang au\u00dferhalb von ihr. Sie war eine Person und geh\u00f6rte zur Familie, und
  Lily war der Meinung, dass ihr Baby bei denen in Erinnerung bleiben m\u00fcsste,
  die sie geliebt hatten.\\n\\nEine andere Frau sagte zu ihr: \u00bbEs war aber auch
  zu schlimm, dass du das Feuer hast ausgehen lassen!\u00ab\\n\\nLily war entsetzt,
  dass ihre Freunde der Ansicht waren, sie h\u00e4tte ihre eigene Tochter durch Gleichg\u00fcltigkeit
  umgebracht. Bis zu diesem Augenblick war es ihr \u00fcberhaupt nicht in den Sinn
  gekommen, dass sie schuld an ihrem Tod sei, weil sie nicht aufgepasst und gen\u00fcgend
  Holz nachgelegt h\u00e4tte.\\n\\nDas Schlimmste, was sie nach dem Tod ihrer Tochter
  zuf\u00e4llig zu h\u00f6ren bekam, waren aber die Worte, die eine Frau gegen\u00fcber
  Marvin \u00e4u\u00dferte: \u00bbGott wollte einfach nicht, dass Lily eine Tochter
  bekam.\u00ab\\n\\nDas traf sie bis ins Innerste. Welch ein Gott konnte\\n\\nso grausam
  sein, dass er Lily eine Schwangerschaft anvertraute, sie dann aber f\u00fcr unf\u00e4hig
  hielt, eine Mutter zu sein, sodass er ihr das Kind sofort wieder nahm, nachdem sie
  es geboren hatte?\\n\\nIn vielerlei Hinsicht erholte sich Lily nie wieder von der
  Geburt und dem Tod ihres kleinen M\u00e4dchens. Es gab keine Erkl\u00e4rung f\u00fcr
  die Krankheit oder den Tod des Babys. Ihr Kind starb zu Beginn des zwanzigsten Jahrhunderts,
  und noch niemand hatte den Ausdruck \u00bbPl\u00f6tzlicher Kindstod\u00ab gepr\u00e4gt.\\n\\nLily,
  die man einst in ihrem Umfeld als tempera\u00ad ment\u00advolle, lebensfrohe und
  aufgeweckte Frau ge\u00ad kannt hatte, wurde schweigsam, in sich gekehrt und war
  nur noch traurig. Ohne Hilfen und seelsorger\u00ad liche Ratschl\u00e4ge, die heute
  reichlich zur Verf\u00fcgung stehen, blieb Lily mehrere Jahre lang depressiv. Eines
  Nachts verlie\u00df sie ohne Wissen ihres Mannes das Haus und wanderte lange durch
  einen Schneesturm. Die Erk\u00e4ltung, die sie sich dabei zuzog, wandelte sich zu
  einer Lungenentz\u00fcndung, und weil sie nicht den geringsten Lebenswillen mehr
  zeigte, starb Lily zwei Wochen sp\u00e4ter \u2013 zu Hause, nur einige Meter von
  der leeren Wiege entfernt, die immer noch ihren Platz am Kamin einnahm.\\n\\nLilys
  Geschichte wiederholt sich t\u00e4glich unz\u00e4hlige Male \u00fcberall auf der
  Welt. Immer wieder werden Babys geboren, sie gedeihen nicht und sterben innerhalb
  einiger Stunden oder Tage.\\n\\nIn einigen F\u00e4llen ist die Todesursache bekannt,
  doch in Tausenden von F\u00e4llen rings um den Globus erf\u00e4hrt man sie nie.\\n\\nEltern
  zeigen sehr starke Reaktionen auf den Tod eines Kindes. Aber diese Reaktionen werden
  selten zur Kenntnis genommen, und noch viel weniger wird in der \u00d6ffentlichkeit
  darauf eingegangen. Daher bleiben diese Reaktionen oft im Verborgenen, sind \u00e4u\u00dferst
  heftig und werden nicht verarbeitet.\\n\\nVor einigen Jahren las ich einen Artikel
  mit der \u00dcberschrift \u00bbPsychische Reaktionen auf perinatalen Tod\u00ab (wie
  in Eunices Fall). Darin wurden Statistiken \u00fcber das elterliche Verhalten bei
  fr\u00fchem Kindstod wiedergegeben:\\n\\n* Sechzig Prozent der Eltern werden zornig.\\n*
  F\u00fcnfzig Prozent der V\u00e4ter und neunzig Prozent der M\u00fctter f\u00fchlen
  sich schuldig.\\n* F\u00fcnfundsiebzig Prozent werden sehr reizbar.\\n* F\u00fcnfundsechzig
  bis f\u00fcnfundsiebzig Prozent der Eltern verlieren ihren Appetit, und achtzig
  bis neunzig Prozent haben starke Schlafst\u00f6rungen.\\n* F\u00fcnfundneunzig bis
  einhundert Prozent der Eltern empfinden eine echte, tiefe Traurigkeit. 1\\n\\nW\u00e4hrend
  einige dieser statistischen Daten mit denen \u00fcbereinstimmen, die mit Bezug auf
  anderes pers\u00f6nliches Leid erstellt wurden, liegen die Zahlen bei Schuld und
  Zorn bedeutend dar\u00fcber.\\n\\nWenn man an die Millionen Babys denkt, die j\u00e4hrlich
  sterben, muss sich der Kummer von noch mehr Millionen Eltern wie ein Schatten auf
  die Seele unseres Volkes legen \u2013 ja, auf die Seele der ganzen Welt.\\n\\nWo
  gibt es Hoffnung f\u00fcr diese Eltern? Welche Antwort gibt uns Gottes Wort?\\n\\nIn
  einer Sache bin ich mir v\u00f6llig sicher. Lilys Familie, ihre Freunde und die
  christliche Gemeinde h\u00e4tten sie vielmehr mit den Antworten der Bibel tr\u00f6sten
  sollen, als danach zu fragen, warum Gott den Tod des Kindes zulie\u00df und ob Lily
  irgendwie daran schuld war. Man h\u00e4tte sie ermutigen m\u00fcssen und ihr aus
  der Depression heraushelfen sollen. Vor allem aber h\u00e4tte sie den Trost gebraucht,
  den die Wahrheit des Wortes Gottes uns gibt.\\n\\nSie d\u00fcrfen mit einer Antwort
  aus Gottes Wort rechnen!\\n\\nEs ist einige Jahre her. Man hatte mich gebeten, an
  einer Podiumssitzung auf einer gro\u00dfen Konferenz teil\u00adzunehmen. Drei weitere
  Pastoren sa\u00dfen neben mir, um die Fragen aus dem Plenum zu beantworten. Eine
  der von den Zuh\u00f6rern gestellten Fragen lautete: \u00bbWas geschieht mit Babys,
  wenn sie sterben?\u00ab Die Antworten der drei Pastoren lauteten im Grunde unisono:
  \u00bbIch wei\u00df es nicht!\u00ab\\n\\nIch war ersch\u00fcttert. Wie kann jemand
  Pastor sein und auf diese Frage keine Antwort wissen? Wie kann er\\n\\n\u00fcberhaupt
  Menschen, die einen solchen Verlust erlitten haben, Rat und Ermutigung geben, bevor
  er eine Antwort auf das hat, was solche trauernden Herzen am meisten besch\u00e4ftigt?\\n\\nAls
  ich an der Reihe war zu antworten, sagte ich: \u00bbSie gehen in den Himmel.\u00ab
  Dann f\u00fcgte ich eine biblisch begr\u00fcndete Erkl\u00e4rung hinzu.\\n\\nTrauernde
  verdienen es, dass man ihnen eine einf\u00fchlsame, auf die Bibel gegr\u00fcndete
  Antwort gibt. Die Eltern haben sie n\u00f6tig, die Geschwister brauchen sie, die
  Freunde sind auf sie angewiesen, Pastoren und Seel\u00adsorger ben\u00f6tigen sie.
  Meine Erfahrung ist, dass biblische Antworten ohne Trost auf taube Ohren sto\u00dfen,
  und dass Trost ohne die Heilige Schrift niemals ein trauergebeugtes Herz v\u00f6llig
  heilen und aufrichten kann.\\n\\nWenn wir in das Grab eines kleinen Kindes blicken,
  d\u00fcrfen wir unsere Hoffnung oder unser Vertrauen weder auf falsche Versprechungen
  noch auf eine falsche Theologie, eine stets schwankende Sentimentalit\u00e4t bzw.
  auf das Ergebnis kalter menschlicher Logik setzen. Vielmehr m\u00fcssen wir auf
  das sehen, was Gottes Wort zu diesem Thema zu sagen hat. Wir sind gerufen, dem Wort
  Gottes treu zu sein und unseren Glauben auf Christus zu setzen. Wir werden herausgefordert,
  die Verhei\u00dfungen der Schrift in Anspruch zu nehmen und in der Zusicherung der
  Gnade unseres Herrn zu leben. Wir brauchen Worte aus dem Himmel, wenn ein Kind gestorben
  ist.\\n\\nUnsere schriftgem\u00e4\u00dfe Antwort beginnt mit einer sehr schlichten
  und doch \u00e4u\u00dferst bedeutsamen Aussage: Jedes Leben, das jemals empfangen
  wurde, ist ein Mensch.\\n\\nDie Bibel ist an dieser Stelle sehr deutlich: Leben
  be\u00ad ginnt mit der Empf\u00e4ngnis. Jeder Tod, der nach dem Augenblick der Empf\u00e4ngnis
  eintritt, ist der Tod eines Menschen. Und Menschen haben ewige Seelen. Alles, was
  wir sonst noch sagen, muss auf dieser grundlegenden Wahrheit basieren.\\n\\nDie
  Schrift gibt uns sechs bedeutsame Wahrheiten hinsichtlich des Menschseins jedes
  Kindes, das empfangen wurde.\\n\\nSechs kostbare Wahrheiten \u00fcber unser Leben
  und das unserer kleinen Kinder\\n\\nEiner der tr\u00f6stlichsten Abschnitte in der
  gesamten Bibel ist Psalm 139. David schreibt dort ausdrucksstark dar\u00fcber, wie
  Gott ihn und jedes menschliche Wesen betrachtet:\\n\\nWie k\u00f6stlich sind mir
  Deine Gedanken, o Gott! Wie gewaltig sind ihre Summen! Wollte ich sie z\u00e4hlen,
  ihrer sind mehr als des Sandes (V. 17-18).\\n\\nF\u00fcr David sind Gottes \u00bbGedanken\u00ab
  \u00fcber sein eigenes Leben \u00e4u\u00dferst wertvoll. Er bezeichnet sie als k\u00f6stlich.
  Er gewinnt Trost und Freude aus der Tatsache, dass\\n\\nGott sich so viele Gedanken
  \u00fcber ihn macht, dass er sie nicht z\u00e4hlen kann.\\n\\nWorin bestehen diese
  k\u00f6stlichen Gedanken, auf die Da\u00advid hier anspielt? In den vorhergehenden
  Versen dieses Psalms hat er sechs grundlegende Wahrheiten entdeckt:\\n\\n1. Gott
  wei\u00df schon vor Ihrer Empf\u00e4ngnis alles \u00fcber Sie. Die erste Aussage,
  die David in diesem Psalm macht, besteht darin, dass der HERR alles \u00fcber ihn
  wei\u00df. Er beginnt den Psalm mit diesen Worten:\\n\\nHERR, Du hast mich erforscht
  und erkannt. Du kennst mein Sitzen und mein Aufstehen, Du verstehst meine Gedanken
  von ferne. Du sichtest mein Wandeln und mein Liegen, und Du bist vertraut mit allen
  meinen Wegen. Denn das Wort ist noch nicht auf meiner Zunge, siehe, HERR, Du wei\u00dft
  es ganz (V. 1-4).\\n\\nDavid stellt fest, dass Gott jede Einzelheit aus seinem Leben
  vom ersten Augenblick an kennt \u2013 selbst die Tatsache, dass er aufsteht oder
  sich hinsetzt. Gott kennt seine Gedanken, sein Kommen und Gehen, seine An\u00ad
  gewohnheiten und Neigungen und seine pers\u00f6nlichen Charakterz\u00fcge. Der Ausdruck
  \u00bbnoch nicht auf meiner Zunge\u00ab bedeutet \u00bbsogar bevor ich sprach oder
  auch nur in der Lage dazu war\u00ab. David sagt, der HERR h\u00e4tte schon gewusst,
  was David sagen w\u00fcrde, noch ehe er den Mund zum Sprechen ge\u00f6ffnet h\u00e4tte,
  ja, be\u00ad vor er ein Wort in seinem Mund h\u00e4tte bilden k\u00f6nnen.\\n\\nDasselbe
  gilt f\u00fcr Sie und f\u00fcr mich. Gott ist bis ins Kleinste mit jeder Einzelheit
  Ihres Lebens vertraut, von dem Augenblick der Empf\u00e4ngnis an bis in alle Ewigkeit.
  Er wei\u00df alles, was Sie sagen, tun, denken und f\u00fchlen. Tats\u00e4chlich
  wusste er alles, sogar bevor Sie Worte in Ihrem Mund oder Gedanken in Ihrem Gehirn
  hatten, l\u00e4ngst bevor Sie ohne fremde Hilfe gehen oder selbst irgendetwas unternehmen
  konnten.\\n\\nDasselbe gilt nat\u00fcrlich auch f\u00fcr Ihr Baby. Gott wei\u00df
  alles, was im Herzen und Verstand Ihres Kindes ist \u2013 selbst bevor Ihr Kind
  einen voll ausgebildeten K\u00f6rper und ein funktionst\u00fcchtiges Gehirn hatte,
  um Gedanken und Gef\u00fchle zum Ausdruck bringen zu k\u00f6nnen.\\n\\n2. Gott greift
  aktiv in Ihr Leben ein. David best\u00e4tigt in Psalm 139, dass der HERR f\u00fcr
  jedes Leben Pl\u00e4ne und Absichten hat. Er kontrolliert die Dinge in uns und um
  uns herum und auch alles, was an uns sowie durch uns geschieht. David schrieb:\\n\\nVon
  hinten und von vorn hast Du mich eingeengt und auf mich gelegt Deine Hand. Kenntnis,
  zu wunderbar f\u00fcr mich, zu hoch; ich vermag sie nicht zu erfassen (V. 5-6).\\n\\nNiemand
  kann sich des aktiven Wirkens Gottes in seinem Leben entziehen. Der HERR ist \u00fcber
  mir und unter mir und um mich herum. Er hat uns in jedem Augenblick unserer Existenz
  fest und v\u00f6llig in seiner Hand. Gott kontrolliert alles in unserem Leben. Und\\n\\ngenauso
  hat er auch das Leben unserer Kleinsten fest im Griff.\\n\\nF\u00fcr die weitaus
  meisten, die empfangen wurden, ist der Tod unausweichlich. Der Tod m\u00f6chte sich
  aller bem\u00e4chtigen, die je empfangen wurden. Das beginnt schon im Mutterleib.
  Viele sterben bei Fehlgeburten oder werden abgetrieben. In unterentwickelten, armen
  L\u00e4ndern wirken die M\u00e4chte des Todes auch stark bei der Geburt oder in
  den unmittelbar darauf\u00ad folgen\u00adden Monaten. Am Leben zu bleiben und zu
  wachsen, erfordert eine Riesenanstrengung \u2013 das Leben ist weit davon entfernt,
  eine \u00bbSelbstverst\u00e4ndlichkeit\u00ab zu sein.\\n\\nDie gegl\u00fcckte Geburt
  eines Kindes wird in der Bibel als ein von Gott ausdr\u00fccklich gewollter Akt
  an\u00ad gesehen. Wir finden in den Psalmen auch folgende Worte Davids:\\n\\nDoch
  Du bist es, der mich aus dem Mutterleib ge\u00ad zogen hat; der mich vertrauen lie\u00df
  an meiner Mutter Br\u00fcsten. Auf Dich bin ich geworfen von Mut\u00ad ter\u00adscho\u00dfe
  an, von meiner Mutter Leibe an bist Du mein Gott (Psalm 22,9-10).\\n\\nDie Entscheidung,
  ob ein Baby lebt oder stirbt, ist Gottes Entscheidung. Er erlaubt die Empf\u00e4ngnis.
  Er erlaubt die Geburt. Er erlaubt ebenso den Tod bei der Geburt. Er l\u00e4sst zu,
  was mit seinen Absichten \u00fcbereinstimmt. Kein Tod, kein Leben geschieht au\u00dferhalb
  der g\u00f6ttlichen Ratschl\u00fcsse.\\n\\nGott ist an jeder Einzelheit eines jeden
  Lebens aktiv beteiligt, einschlie\u00dflich der Tatsache, ob ein Kind ge\u00ad boren
  wird oder im Mutterleib stirbt, ob es die Geburt \u00fcberlebt oder w\u00e4hrend
  der Geburt stirbt.\\n\\n3. Gott wird nie aufh\u00f6ren, \u00fcber Sie Bescheid zu
  wissen. Der HERR wird Sie nie vergessen, Sie nie \u00fcber\u00ad sehen, Sie nie
  aus den Augen verlieren. David schrieb:\\n\\nWohin sollte ich gehen vor Deinem Geist,
  und wo\u00ad hin fliehen vor Deinem Angesicht? F\u00fchre ich auf zum Himmel, Du
  bist da; und bettete ich mir in dem Scheol, siehe, Du bist da. N\u00e4hme ich Fl\u00fcgel
  der Mor\u00ad genr\u00f6te, lie\u00dfe mich nieder am \u00e4u\u00dfersten Ende des
  Meeres, auch daselbst w\u00fcrde Deine Hand mich leiten und Deine Rechte mich fassen
  (Psalm 139,7-10).\\n\\nMan kann keinen Ort aufsuchen, an dem der HERR nicht ganz
  genau wei\u00df, wo man ist. Das Gleiche gilt f\u00fcr Ihr Baby.\\n\\n4. Gott fehlt
  es nie an dem vollst\u00e4ndigen Durchblick. Nichts k\u00f6nnte Gott daran hindern,
  Ihr gesamtes Leben v\u00f6llig zu durchschauen. Bildlich gesprochen k\u00f6nnte
  das Licht niemals so tr\u00fcbe werden, dass Gott Sie nicht ganz und gar erkennt.
  Niemand k\u00f6nnte je in eine Lage oder einen Umstand geraten, wodurch er vor den
  Blicken Gottes abgeschirmt w\u00e4re. David schrieb dazu:\\n\\nUnd spr\u00e4che
  ich: \u00bbNur Finsternis m\u00f6ge mich um\u00ad h\u00fcllen, und Nacht werde das
  Licht um mich her\u00ab;\\n\\nauch Finsternis w\u00fcrde vor Dir nicht verfinstern,
  und die Nacht w\u00fcrde leuchten wie der Tag, die Finsternis w\u00e4re wie das
  Licht (Psalm 139,11-12).\\n\\nGott wusste nach den ersten Augenblicken Ihrer Empf\u00e4ngnis
  schon genauso viel \u00fcber Sie, wie er heute wei\u00df. Er sieht Sie ganz und
  in jeder Beziehung im Kontext der Ewigkeit und nicht im Kontext der Zeit. Er sieht
  Sie in jeder Einzelheit, in der er Sie erschaffen hat, und diese Sicht auf Ihr Leben
  wird in keiner Weise behindert, beeintr\u00e4chtigt oder blockiert durch irgendwelche
  Umst\u00e4nde, die Ihnen begegnen, oder durch irgendwelche Erfahrungen, die Sie
  machen. Dasselbe gilt auch f\u00fcr Ihr Baby.\\n\\n5. Gott ist Ihr pers\u00f6nlicher
  Sch\u00f6pfer. Sie m\u00f6gen glauben, Ihre Eltern seien verantwortlich daf\u00fcr,
  wie Sie jetzt sind; Gottes Wort aber sagt etwas anderes. Die Bibel erkl\u00e4rt,
  dass Gott der Sch\u00f6pfer allen Lebens ist. Er ist es, der die DNS-Str\u00e4nge
  f\u00fcr Ihren genetischen Code miteinander verbunden hat. Er ist es, der alle Ihre
  pers\u00f6nlichen Z\u00fcge, F\u00e4higkeiten, Talente und geistlichen Gaben in
  Sie eingebaut hat. Er ist es, der Ihnen das L\u00e4cheln Ihrer Mutter, die Zehen
  Ihres Va\u00ad ters, das Gr\u00fcbchen Ihres Opas oder die Augen Ihrer Oma schenkte.
  David schrieb so wundersch\u00f6n davon:\\n\\nDenn Du besa\u00dfest meine Nieren;
  Du wobest mich in meiner Mutter Leib. Ich preise Dich dar\u00fcber, dass ich auf
  eine erstaunliche, ausgezeichnete Wei\u00ad se gemacht bin. Wunderbar sind Deine
  Werke,\\n\\nund meine Seele wei\u00df es sehr wohl. Nicht verhohlen war mein Gebein
  vor Dir, als ich gemacht war im Verborgenen, gewirkt wie ein Stickwerk in den untersten
  \u00d6rtern der Erde (Psalm 139,14-15).\\n\\nVielleicht denken Sie, Sie h\u00e4tten
  Ihr Baby \u00bbgemacht\u00ab. Das stimmt nicht. Gott hat Ihr Baby geschaffen und
  ihm den Odem des Lebens eingehaucht. Ihr Baby ist seine Sch\u00f6pfung.\\n\\n6.
  Gott pers\u00f6nlich plante Ihre Bestimmung. Gott z\u00e4hlte Ihre Tage und legte
  seine bestimmten Absichten mit diesen fest. David schrieb:\\n\\nMeinen Keim sahen
  Deine Augen, und in Dein Buch waren sie alle eingeschrieben, w\u00e4hrend vieler
  Tage wurden sie gebildet, als nicht eines von ihnen war (Psalm 139,16).\\n\\nDasselbe
  gilt f\u00fcr Ihr Kind. Gott wusste genau, wie lange Ihr Kind leben w\u00fcrde und
  f\u00fcr welchen Zweck es leben sollte. Das Schicksal Ihres Kindes war und ist in
  seinen H\u00e4nden.\\n\\nDas Wort des HERRN kam zu dem Propheten Jeremia \u2013
  und zwar so \u00e4hnlich, wie David es erlebt hatte. Im Eingangstext des Buches
  Jeremia lesen wir:\\n\\nUnd das Wort des HERRN geschah zu mir also: \u00bbEhe ich
  dich im Mutterleib bildete, habe ich dich erkannt. Und ehe du aus dem Mutterscho\u00df
  hervorkamst, habe ich dich geheiligt; zum Propheten an die Nationen habe ich dich
  bestellt\u00ab (Jeremia 1,4-5).\\n\\nDer Prophet Jeremia wusste, wer er war. Ihm
  war nicht allein klar, der Sohn Hilkias zu sein. Weit wichtiger war, dass er wusste,
  von Gott f\u00fcr Gottes Absichten geschaffen worden zu sein.\\n\\nBeachten wir,
  wie oft der HERR seine Aussagen direkt mit Jeremia verbindet. Er sagte: \u00bbIch
  habe dich gebildet. Ich habe dich erkannt. Vor deiner Geburt schon habe ich dich
  geheiligt. Ich habe dich bestellt.\u00ab Der HERR betrachtete Jeremia absolut nicht
  als eine Art \u00bbanonymen Zellklumpen\u00ab. Jeremia war eine Per\u00ad son, vom
  HERRN durch und durch erkannt sowie individuell von Gott gebildet und von ihm f\u00fcr
  seine Zwecke beiseitegestellt.\\n\\nDieses Verst\u00e4ndnis spiegelt sich in der
  Wahrheit des Psalms 139 wider, wenn David sagt: \u00bbMeinen Keim sahen Deine Augen,
  und in Dein Buch waren sie alle eingeschrieben; w\u00e4hrend vieler Tage wurden
  sie ge\u00ad bildet, als nicht eines von ihnen war\u00ab (Psalm 139,16).\\n\\nVon
  Mutterleib an sind Sie in Gottes Augen ein Mensch. Er wei\u00df, wozu er Sie erschuf.
  Er kennt v\u00f6llig Plan und Zweck Ihres Lebens, Ihre Talente, Ihre potenziellen
  F\u00e4higkeiten, Ihre W\u00fcnsche und Tr\u00e4ume, Ihre Pers\u00f6nlichkeit und
  alles, was zu Ihnen als einem einmaligen Individuum geh\u00f6rt.\\n\\nDer Prophet
  und Vorl\u00e4ufer Jesu Christi, Johannes der T\u00e4ufer, war eine weitere Person
  in der Bibel, von der ausdr\u00fccklich gesagt wird, dass sie von Mutterleib an\\n\\neine
  einzigartige Bestimmung hatte. Ein Engel sagte zu Zacharias, dem Vater des Johannes,
  noch ehe er empfangen war: \u00bbEr wird gro\u00df sein vor dem Herrn; weder Wein
  noch starkes Getr\u00e4nk wird er trinken und schon von Mutterleibe an mit Heiligem
  Geist erf\u00fcllt werden. Und viele der S\u00f6hne Israels wird er zu dem Herrn,
  ihrem Gott, bekehren\u00ab (Lukas 1,15-16; Hervorhebung durch den Autor).\\n\\nJohannes
  war nicht nur von Gott erschaffen, sondern Gott wohnte auch in ihm, ehe er geboren
  worden war, und Gott wollte mit Johannes anfangen, seine Absichten auf der Erde
  zu verwirklichen.\\n\\nDas prophetische Wort an Zacharias erf\u00fcllte sich. Das
  Lukasevangelium berichtet von der Begegnung zwischen Maria, die mit Jesus schwanger
  war, und ihrer Cousine Elisabeth, die Johannes den T\u00e4ufer unter dem Herzen
  trug. Elisabeth sagte: \u00bbSiehe, wie die Stimme deines Gru\u00dfes in meine Ohren
  drang, h\u00fcpfte das Kind vor Freude in meinem Leibe\u00ab (Lukas 1,44). Sogar
  schon im Mutterleib, weder zum Sprechen noch zu anderen vernunftbestimmten \u00c4u\u00dferungen
  f\u00e4hig, konnte Johannes der T\u00e4ufer \u2013 durch den Heiligen Geist getrieben
  \u2013 auf die Gegenwart des Herrn reagieren. Seine Mutter f\u00fchlte, dass er
  \u00bbh\u00fcpfte\u00ab und dass er dies \u00bbvor Freude\u00ab dar\u00fcber tat,
  dass Maria den Messias unter dem Herzen trug.\\n\\nDer Apostel Paulus sagte von
  sich selbst: \u00bbAls es aber Gott, der mich von meiner Mutter Leibe abgesondert
  und\\n\\ndurch seine Gnade berufen hat, wohlgefiel, seinen Sohn in mir zu offenbaren,
  auf dass ich ihn unter den Na\u00ad tionen verk\u00fcndigte, ging ich alsbald nicht
  mit Fleisch und Blut zurate\u00ab (Galater 1,15-16; Hervorhebung durch den Autor).
  Paulus wusste sich v\u00f6llig von Gott erkannt und glaubte, dass er von Mutterleib
  an zu ihm geh\u00f6rte. Seine Bestimmung war schon vor seiner Geburt festgelegt.\\n\\nGott
  kennt auch Sie von Ihrer Mutter Leib an. Und er wei\u00df, wer Ihr Kind ist. Ebenso
  wei\u00df er von jedem Kind, wie und wozu er es erschaffen hat.\\n\\nWelche kostbaren
  Wahrheiten sind das! Welche ge\u00ad waltige Hoffnung k\u00f6nnen wir aus diesen
  Versen ge\u00ad winnen! Gott wei\u00df alles \u00fcber Ihr Baby, und vom allerersten
  Augenblick der Empf\u00e4ngnis an war er in jeden Aspekt der Erschaffung Ihres Babys
  bis in jede Kleinigkeit hinein verwickelt. Ihr Kind befand sich zu keiner Zeit au\u00dferhalb
  der liebenden F\u00fcrsorge und des Interesses \u2013 oder der wachsamen Augen \u2013
  des Herrn. Ihr Baby ist sein Gesch\u00f6pf. Und das Schicksal Ihres Babys folgt
  seinen sorgf\u00e4ltig ausgearbeiteten Pl\u00e4nen und Absichten.\\n\\nGott gebrauchte
  Sie, um die Pers\u00f6nlichkeit seines Kindes in die Wirklichkeit dieses Lebens
  zu bringen.\\n\\nGott ist bei jeder Empf\u00e4ngnis gegenw\u00e4rtig. Und er ist
  in jedem Augenblick mit jedem Leben aufs Innigste verbunden, dessen Empf\u00e4ngnis
  er erlaubt.\\n\\nGott \u00fcberwacht und beh\u00fctet jedes Leben, dessen Existenz
  er gestattet. Und er baut jedes Leben in den Kontext seiner ewigen Pl\u00e4ne und
  Absichten ein.\\n\\nEin spezieller Plan f\u00fcr jedes Leben\\n\\n\u00bbAber\u00ab,
  werden Sie sagen, \u00bbJeremia war etwas Besonderes. Er war ein Prophet und, wie
  wir aus der Heiligen Schrift wissen, wuchs er auf, war Gott gehorsam und erf\u00fcllte
  Gottes Absichten f\u00fcr sein Leben. David war ebenfalls etwas Besonderes. Er war
  von Jugend auf zum K\u00f6nig bestimmt, und wir wissen, dass sein Herz lebenslang
  f\u00fcr Gott schlug. Johannes der T\u00e4ufer und der Apostel Paulus waren besondere
  Leute, die Gott f\u00fcr besondere Auftr\u00e4ge erw\u00e4hlte; aber wie steht es
  mit meinem Kind?\u00ab\\n\\nIhr Kind ist genauso etwas Besonderes.\\n\\nGott hat
  einen einzigartigen Plan f\u00fcr jedes Kind, das empfangen wird. Wir m\u00f6gen
  seine Pl\u00e4ne nicht restlos durchschauen, wir m\u00f6gen au\u00dferstande sein,
  Gottes Absichten zu verstehen. Aber wir k\u00f6nnen im Glauben daran festhalten,
  dass sich unser vollkommener Gott niemals irrt. Er erlaubt keine Empf\u00e4ngnis,
  die \u00fcber seine souver\u00e4nen Pl\u00e4ne und Absichten hinausgeht.\\n\\nIch
  m\u00f6chte Sie teilhaben lassen an einem Zeugnis, das ich von einem jungen Paar
  aus unserer Gemeinde h\u00f6rte \u2013 von Mark und Diana. Ihr neulich geschriebener
  Brief an mich ist ein lebendiges, ehrliches und\\n\\nglaubensvolles Zeugnis davon,
  dass Gott mit jedem Kind seine Pl\u00e4ne und Absichten hat, selbst mit einem, das
  mit geistigen Problemen oder physischen Missbildungen geboren wird.\\n\\nVor einigen
  Jahrhunderten und heute noch in manchen primitiven Kulturen wurden Kinder mit irgendwelchen
  Missbildungen dem Tod preisgegeben. Man dachte, der Tod sei f\u00fcr ein solches
  Kind besser als das Leben. Selbst in unserer Gesellschaft sagen manche hinter vorgehaltener
  Hand: \u00bbZu schade, dass seine Mutter keine Fehlgeburt hatte.\u00ab\\n\\nIst
  es besser f\u00fcr solch ein Kind, dass es stirbt? Wer bestimmt das? Und f\u00fcr
  wen ist es besser \u2013 f\u00fcr die Eltern oder f\u00fcr das Kind? Nur Gott steht
  das Recht zu, \u00fcber Leben und Tod zu entscheiden. Wir m\u00fcssen davon ausgehen,
  dass wenn ein Kind mit geistigen und k\u00f6rperlichen Problemen die Geburt \u00fcbersteht,
  der Herr dieses Kind auf der Erde lebendig sehen will. Vorrangig jene Menschen profitieren
  von dem Leben dieses Kindes, die f\u00fcr das Kind sorgen. Unser souver\u00e4ner
  Herr hat immer einen Plan und eine Absicht f\u00fcr jedes Leben. Und f\u00fcr alle,
  die durch den Glauben an Jesus Christus zu ihm geh\u00f6ren, dienen seine Wege immer
  zu ihrem ewigen Guten und zu seiner ewigen Herrlichkeit. Immer!\\n\\nMark, der Vater
  des Babys, schrieb:\\n\\nBethany wurde uns vor ungef\u00e4hr f\u00fcnf Jahren im
  September geschenkt. Sie war, wie alle Kinder, eine\\n\\nGabe des Herrn. Sie war
  unser drittes Geschenk \u2013 unser K\u00f6cher war voll (vgl. Psalm\u00a0127,5).
  Doch kaum war sie geboren, bekamen wir schon gro\u00dfe Angst. Die Krankenschwestern
  brauchten so schrecklich lange, um sie zu baden. Wir wussten ja nicht, dass sie
  auf der Intensivstation lag.\\n\\nMeine Frau, Diana, lie\u00df sich von all den
  Lampen, dem Piepen und dem hastigen Treiben um Bethany auf der Intensivstation nicht
  beeindrucken. Sie ging geradewegs auf ihre j\u00fcngste Tochter zu und nahm sie
  mit der gleichen Freude, Bewunderung und warmherzigen Liebe an wie ihre beiden anderen
  Kinder. Ich hingegen musste mich erst zu einer solchen Haltung durchringen. Ich
  redete dauernd von ihrer Zukunft und von dem, was wom\u00f6glich auf uns zukam und
  wie wir wohl mit ihr fertig w\u00fcrden.\\n\\nAm Tag nach ihrer Geburt wurde bei
  Bethany das Downsyndrom diagnostiziert. Nur die Macht Gottes bewahrte uns vor einem
  Zusammenbruch. Wir bezichtigten jeweils die Familie des anderen und wussten nicht,
  wohin mit unserer Last, bis wir anfingen, um F\u00fchrung zu beten. Einige Tage
  sp\u00e4ter kam ich mithilfe weiterer Gebete im Beisein meiner Freunde zur Vernunft.
  Endlich begriff ich, dass Bethany nicht ein Syndrom, sondern unser Kind war \u2013
  sie war ein Geschenk unseres liebenden und weisen Vaters.\\n\\nMit der Geburt Bethanys
  begann f\u00fcr unsere Familie eine wunderbare Reise. Wir entdeckten, wie sch\u00f6n
  es ist, n\u00e4her bei Gott zu sein. Das Mitgef\u00fchl Gottes teilte sich uns mit,
  wenn wir sie voller Freude versorgten und daf\u00fcr ihre Liebe empfingen. Wir wurden
  dadurch ermutigt, dass Bethany von den Geschwistern unserer Gemeinde akzeptiert
  wurde, und wir blickten mit Freude und frohem Mut auf Bethanys Zukunft. Ich k\u00f6nnte
  seitenweise fortfahren und \u00fcber die wunderbare Zeit berichten, die wir mit
  ihr erlebten, von dem Segen, den wir durch sie erfuhren, von der Weisheit, die uns
  geschenkt wurde, und von der N\u00e4he, die wir zu unserem Retter und Herrn versp\u00fcrten.\\n\\nAls
  Weihnachten 2000 n\u00e4her kam, war die ganze Familie wie \u00fcblich noch mehr
  besch\u00e4ftigt als sonst. Wir wussten allerdings nicht, dass dieses Weihnachten
  unser Leben f\u00fcr immer ver\u00e4ndern sollte \u2026\\n\\nBethany war gerade
  drei geworden. Was f\u00fcr ein strammes Kind! Aus dem schwachen, zerbrechlichen
  und antriebsschwachen Baby war ein umherrennender, stets plappernder und fr\u00f6hlicher
  Wirbelwind geworden! Sie besuchte eine Vorschule und war in der Gemeinde von Freunden
  umgeben.\\n\\nWir wussten sofort, dass mit Bethany etwas nicht stimmte, als sie
  traurig aufwachte und nichts unternehmen mochte. Am Abend konnte sie nicht einschlafen
  und h\u00f6rte nicht auf, vor sich hin zu\\n\\njammern. Wir brachten Bethany am
  n\u00e4chsten Tag zur Notaufnahme ins Krankenhaus, und am n\u00e4chsten Tag wieder,
  und dann noch einmal zwei Tage sp\u00e4ter \u2013 und das war Weihnachten.\\n\\nKeiner
  der untersuchenden \u00c4rzte konnte uns sa\u00ad gen, was Bethany fehlte. Erst
  nach vielen medizinischen Tests und eingehender Beobachtung wur\u00ad de am Silvestertag
  bei ihr Leuk\u00e4mie fest\u00adgestellt. Ich lag an diesem Abend mit ihr im Bett,
  um sie davon abzuhalten, herumzukriechen und aus dem hohen Krankenbett zu fallen.
  Inzwischen waren ihre Schmerzen so heftig geworden, dass sie nicht aufstehen, geschweige
  denn laufen konnte. Die Menge an Morphium, die in den kleinen K\u00f6rper gepumpt
  wurde, war erschreckend, und trotzdem lag sie bis gegen drei Uhr morgens nicht still.
  Die Atmung setzte in dieser Nacht von Zeit zu Zeit aus, und die Krankenschwestern
  kamen schnell gelaufen, um die Atmung rasch wieder in Gang zu bringen. Von dem Tag
  an, als wir die Diagnose erhielten, wurde unser Leben sehr viel intensiver. Wir
  waren ganz und gar von der Hilfe unseres Gottes und Vaters abh\u00e4ngig, um jeden
  einzelnen Tag durchzustehen.\\n\\nDiana tat tapfer ihre Pflicht f\u00fcr Bethany
  und glaubte fest, Gott w\u00fcrde die Kleine heilen. Ich f\u00fchlte mich v\u00f6llig
  leer und lief wie bet\u00e4ubt herum. Dennoch f\u00fcrchtete ich, jeden Augenblick
  in Panik\\n\\nzu geraten. Ich wollte um das Leben meines kleinen M\u00e4dchens k\u00e4mpfen,
  es besch\u00fctzen und be\u00ad wahren, und f\u00fchlte mich doch g\u00e4nzlich
  verwirrt und verzagt, weil ich nichts tun konnte, um das weitere Fortschreiten ihrer
  Krankheit zu verhindern. Ich war so gedem\u00fctigt, weil ich mich als v\u00f6llig
  nutzlos empfand, genauso wie die anderen um mich her \u2013 und eigentlich hatte
  ich von mir erwar\u00ad tet, entschlossen zu handeln, meiner Familie weisen Rat
  zu erteilen und Gott zu dienen.\\n\\nAls die Feiertage vor\u00fcber waren, stellten
  die \u00c4rzte f\u00fcr Bethany einen \u00bbBehandlungsplan\u00ab auf. Und wir wurden
  ermutigt durch ihre Prognose, Bethany h\u00e4tte eine \u00dcberlebenschance von
  90 Prozent. Die \u00c4rzte verordneten eine Reihe von Chemotherapien, die uns die
  n\u00e4chsten elf Monate besch\u00e4ftigte. Die letzten drei Monate konnten wir
  die \u00bbChemo\u00ab zu Hause verabreichen. Obwohl Bethany alle ihre sch\u00f6nen
  Haare verlor und ein Plastikschlauch aus ihrer Brust ragte, der direkt in die herznahe
  Hauptvene reichte, hielt sie das nicht ab, vergn\u00fcgt zu sein.\\n\\nEs war geplant,
  den zentralen Venenkatheder f\u00fcr Bethanys \u00bbChemo\u00ab im Oktober, direkt
  nach ihrem vierten Geburtstag, zu entfernen. Nach einigen Wochen erhielten wir die
  Ergebnisse der genauen \u00dcberpr\u00fcfung ihrer zehnmonatigen Chemotherapie,
  und wir waren ersch\u00fcttert, als wir erfuhren,\\n\\ndass die Leuk\u00e4mie wieder
  aufgetreten sei. Jetzt rechneten die \u00c4rzte nur noch mit einer \u00dcber\u00ad
  lebenschance von 30 bis 50 Prozent.\\n\\nKurz darauf fuhren wir an den Castaic-See,
  um mit der Familie die Natur zu genie\u00dfen. Ich werde jenen Tag nie vergessen.
  Bethany freute sich \u00fcber die M\u00f6glichkeit, die H\u00fcgel in der N\u00e4he
  zu ersteigen \u2013 sie wollte nicht getragen werden. Ich konnte die Gnade und Barmherzigkeit
  Gottes kaum fassen, als ich sah, dass mein kleines M\u00e4dchen mit dem Downsyndrom
  nach zehn Monaten Chemotherapie und der R\u00fcckkehr der Leuk\u00e4mie mit 41 Prozent
  des anf\u00e4nglichen Wertes so viel Kraft und Mut hatte. Gott brachte uns bei,
  auf ihn zu vertrauen und seinem Willen Schritt f\u00fcr Schritt zu folgen.\\n\\nAn
  jenem Abend fand ich Bethany mit ihren Spielsachen besch\u00e4ftigt auf dem Fu\u00dfboden
  sitzen. Ich setzte mich zu ihr, um mit ihr zu spielen. Sie war ein solcher Schatz
  \u2013 mich durchfluteten begl\u00fcckende Erinnerungen an all die sch\u00f6nen
  Zeiten, die wir mit ihr erlebt hatten. Pl\u00f6tzlich musste ich bei dem Gedanken,
  sie zu verlieren, verzweifelt weinen. Bethany t\u00e4tschelte meinen Kopf und fragte:
  \u00bbWas hast du, Papa? Was ist los?\u00ab Da sprach mir meine kleine Tochter tr\u00f6stlich
  zu \u2013 es schien beinahe, als w\u00fcrde sie Gottes Plan mit ihr kennen und damit
  zufrieden sein. Ich aber fasste in meinem Inneren aufs Neue den Entschluss,\\n\\nmein
  Bestes zu tun, um ihr das Leben so erfreulich wie m\u00f6glich zu machen.\\n\\nEine
  weitere Chemotherapie wurde angesetzt, um der hartn\u00e4ckigen Leuk\u00e4mie in
  ihrem K\u00f6rper Herr zu werden, selbst auf die Gefahr hin, dass andere Organe
  dabei in Mitleidenschaft gezogen w\u00fcrden. Daran anschlie\u00dfend war eine Knochenmarks\u00fcbertragung
  geplant. Unser Sohn Christopher erwies sich als sehr brauchbar f\u00fcr diese Transplantation.
  Hingegen kam unsere Tochter Michelle \u00fcberhaupt nicht daf\u00fcr infrage, obwohl
  sie f\u00fcr ihre kleine Schwester gern alles hingegeben h\u00e4tte.\\n\\nDie f\u00fcr
  die Transplantation vorgesehene Woche, die sich als die letzte in Bethanys Erdenleben
  herausstellen sollte, erscheint mir wie im Nebel. Wohl erinnere ich mich daran,
  dass Diana mich anrief, w\u00e4hrend sie ihr \u00c4u\u00dferstes gab, um Bethanys
  Atmung in Gang zu halten und sie immer neu bequem zu lagern. Als ich nach ihrem
  Anruf ins Krankenhaus kam, fand ich Bethany, wie sie unter einem Sauerstoffzelt
  sa\u00df. Zum ersten Mal schien es, als ob sie nicht mehr leben mochte. Nach der
  Intubation \u2013 dabei wird eine R\u00f6hre durch den Hals bis in die Lungen eingef\u00fchrt
  \u2013 verdeutlichte ihr Gesichtsausdruck, dass sie \u2013 wenn auch unh\u00f6rbar
  \u2013 um Hilfe schrie. Die R\u00f6hre reizte sie zum Husten und lie\u00df sie nach
  Luft ringen. H\u00f6rbar weinen konnte sie nicht, weil die Lungen die\\n\\nLuft
  zum Husten ben\u00f6tigten. Ich erinnere mich auch noch, wie Diana in ihrer Liebe
  schluchzend rief: \u00bbBethany, bitte, verlass uns nicht!\u00ab, w\u00e4hrend Bethany
  still von uns ging. Schlie\u00dflich hatte ihr kleines Herz den Dienst versagt wie
  bei einem Athleten, der weit \u00fcber seine Leistungsgrenzen strapaziert wurde.
  Nach all den Ger\u00e4uschen der Intensivstation war nur noch unser Klagen und Schluchzen
  zu h\u00f6ren. Das Weinen der Kinder, als wir ihnen sagten, Bethany sei f\u00fcr
  immer von uns gegangen, hat sich unausl\u00f6schlich in unsere Herzen gegraben.\\n\\nBethanys
  Kampf gegen die Leuk\u00e4mie hat sechzehn Monate gedauert \u2013 von Weihnachten
  bis in die Osterwoche.\\n\\nBethany hat die Welt ungef\u00e4hr so verlassen, wie
  sie sie betreten hatte \u2013 zwischen lauter R\u00f6hren, Dr\u00e4hten, Nadeln,
  Beatmungsger\u00e4ten, Monitoren und vielen helfenden H\u00e4nden und aufmerksamen
  Augen, die ihr zerbrechliches Leben \u00fcberwachten. Den gr\u00f6\u00dften Teil
  ihres Lebens verbrachte Bethany jedoch ohne all diese Dinge. Wir haben uns vorgenommen,
  mehr daran zu denken, wie sie gelebt hat, als daran, wie sie starb. Sie liebte es,
  zu spielen und mit ihrer Schwester Michelle und ihrem Bruder Christopher zu singen.
  Sie war vergn\u00fcgt und oft \u00fcberm\u00fctig, genoss es, B\u00fccher anzuschauen,
  im Garten zu \u00bbhelfen\u00ab und zu malen. Auch hatte sie Tiere gern.\\n\\nEs
  gab Zeiten w\u00e4hrend ihres Lebens und ihrer Krankheit, in denen wir Gott fragten:
  \u00bbWas haben wir verbrochen? Was haben wir unterlassen?\u00ab Uns machte das
  Thema S\u00fcnde zu schaffen. Ob wir etwas getan oder unterlassen hatten, womit
  wir Bethanys Krankheit verursachten? Auf solche Fragen gab es keine Antworten, doch
  kamen wir immer wieder dahin, dass wir unseren Mangel an Glauben genauso erkannten
  wie die Treue Gottes, die sich immer m\u00e4chtiger an uns erwies.\\n\\nBethany
  genie\u00dft es jetzt, Gott von Angesicht zu Angesicht zu sehen, und sie ist v\u00f6llig
  zufrieden mit ihrem Leben auf dieser Erde, das nur kurze viereinhalb Jahre w\u00e4hrte.
  Wir sagen unseren Kindern immer wieder, dass Bethany die Schnellstra\u00dfe zum
  Himmel benutzt hat, als sei sie mit einer Rakete auf die Reise gegangen, w\u00e4hrend
  wir alle noch mit der Eisenbahn des Lebens unterwegs sind. Gott allein entscheidet
  \u00fcber die L\u00e4nge unserer Reise und \u00fcber deren Geschwindigkeit. Wir
  machen uns in der Familie gegenseitig Mut damit, dass Bethany in der Gegenwart des
  allm\u00e4chtigen Gottes ist, wo sie weder Schmerzen noch Tr\u00e4nen hat noch irgendwelche
  \u00c4ngste, weil sie uns vermisst. Sie ist kein viereinhalb Jahre altes M\u00e4dchen
  mit dem Downsyndrom mehr. Sie ist in jeder Beziehung vollkommen und erwachsen im
  Herrn! Wir haben absolut keinen Zweifel daran, sie wiederzusehen, genauso wie wir
  Gott und seinen Sohn Jesus von Angesicht zu Angesicht schauen werden. Erst dann
  werden wir in Wahrheit die Absichten verstehen, die Gott mit Bethanys Leben hatte.
  Aber dies wissen wir heute schon: Wir werden Gott in Ewigkeit daf\u00fcr preisen,
  dass seine Weisheit und Heiligkeit vollkommen sind.\\n\\nUnsere K\u00e4mpfe waren
  nat\u00fcrlich mit Bethanys Tod nicht zu Ende. Noch immer f\u00e4llt es uns schwer,
  unsere Ferien ohne sie zu verbringen. Es macht unserer schwachen Logik immer noch
  M\u00fche zu begreifen, was geschehen ist. Wir haben nach wie vor damit zu tun,
  uns dem Plan Gottes zu unterwerfen und ihm mit Freuden zu dienen bis zu dem Tag,
  an dem er jeden von uns zu sich heimholt. Wenn er von uns verlangte, das alles noch
  einmal durchzumachen, w\u00e4ren wir \u2013 mit dem Wissen von heute \u2013 bereit,
  es zu tun. Wir t\u00e4ten es, um ihn so zu erkennen, wie dies jetzt der Fall ist.
  Er ist ein Gott unendlich gro\u00dfer Gnade und Barmherzigkeit, voller Mitgef\u00fchl
  und Frieden.\\n\\nDas Folgende ist ein Auszug aus der Rede, die Mark anl\u00e4sslich
  der Beerdigungsfeier f\u00fcr Bethany hielt:\\n\\nIch glaube, Bethany ist uns von
  unserem gro\u00dfen Gott gesandt worden, um uns das Wesen seiner bedingungslosen
  Liebe zu lehren \u2026 F\u00fcr Bethany waren Dinge wie das Downsyndrom, Leuk\u00e4mie,
  Chemotherapie und Knochenmarkstransplantatio\u00ad\\n\\nnen v\u00f6llig unbedeutend.
  Trat man in ihr Le\u00adben \u2013 sei es zu Hause oder im Krankenzimmer \u2013
  be\u00ad gr\u00fc\u00dfte sie jeden mit \u00fcbersprudelnder Freude und verabschiedete
  ihn genauso herzlich.\\n\\nWenn wir beteten, gab es gar nichts anderes, als dass
  sie die H\u00e4nde so faltete wie wir alle. Ihr Vertrauen war riesengro\u00df, und
  sie lebte ohne Wehleidigkeit. Wenn sie das Empfinden hatte, etwas bereuen zu m\u00fcssen,
  lie\u00df sie sich zu Boden fallen und verbarg ihr Gesicht mit den H\u00e4nden.\\n\\nDiana
  hat oft mit Bethany gesungen: \u00bbDer ein gutes Werk in dir begonnen, wird es
  treulich auch vollenden.\u00ab Bethany ist nun vollendet und erf\u00fcllt mit der
  reinsten Freude. Wir sehen f\u00f6rmlich, wie sie unserem heiligen Gott ihre Loblieder
  singt.\\n\\nK\u00f6nnte Bethany jetzt mit uns sprechen, bin ich sicher, dass sie
  sagen w\u00fcrde: \u00bbBetr\u00fcbt euch nicht; denn die Freude am Herrn ist eure
  St\u00e4rke\u00ab (Nehemia 8,10).\\n\\nNun m\u00f6chte ich Sie fragen:\\n\\nWar
  Bethany ein Mensch?\\n\\nWusste Gott alles \u00fcber Bethany, schon bevor sie empfangen
  wurde?\\n\\nGriff Gott aktiv in ihr Leben ein?\\n\\nKannte Gott sie durch und durch
  \u2013 und das bis zum heutigen Tag?\\n\\nHatte Gott unbegrenzte Kenntnis von jeder
  Einzelheit ihres Lebens?\\n\\nWar Gott Bethanys pers\u00f6nlicher Sch\u00f6pfer?\\n\\nHat
  Gott pers\u00f6nlich Bethanys ewige Bestimmung geplant?\\n\\nDie Antwort auf jede
  dieser Fragen ist ein immer wiederkehrendes \u00bbJa!\u00ab\\n\\nGott hatte eine
  spezielle, einzigartige, h\u00f6chst pers\u00f6nliche, machtvolle Absicht mit Bethanys
  Leben hier auf Erden. Ihr Leben beeinflusste nicht nur in starkem Ma\u00df das Leben
  ihrer Eltern und Geschwister, sondern das gesamte Leben der Gemeinde, in welche
  die Familie eingebettet war. Es ber\u00fchrte das Leben der \u00c4rzte, der Schwestern
  und anderer Angeh\u00f6riger des Krankenhauspersonals, die sich um sie bem\u00fchten,
  wie auch dasjenige ihrer Nachbarn und der Freunde, die sie \u00fcberall gewann,
  wo sie auftauchte. Ihr Leben ber\u00fchrt auch Ihr Leben heute, wenn Sie dies hier
  lesen \u2013 wie es meines ber\u00fchrte, weil ich sie kannte!\\n\\nBethany war
  kein \u00bbSyndrom\u00ab irgendeiner Art, wie ihr Vater weise feststellte. Sie war
  eine Gabe des himm\u00ad lischen Vaters an diese Welt.\\n\\nDasselbe gilt f\u00fcr
  Ihr Leben und dasjenige Ihres Kindes.\\n\\nDas Erste und bei Weitem Wichtigste,
  was wir \u00fcber ein Kind mit Sicherheit sagen k\u00f6nnen, ist dies: Jedes empfangene
  Kind ist ein von Gott erschaffener und gelieb\u00ad ter Mensch mit einer gottgegebenen
  Zielsetzung und Be\u00ad stimmung.\\n\\nAm Anfang Ihres Trostes m\u00f6ge diese
  Wahrheit stehen: Gott hat Ihr Kind erschaffen. Gott hat Ihr Kind geliebt und f\u00e4hrt
  fort, es zu lieben. Gottes Absichten und Bestimmungen f\u00fcr Ihr Kind erf\u00fcllen
  sich vollkommen, selbst wenn Ihr Kind stirbt. Was das wirklich bedeutet, \u00fcbersteigt
  alles, was Sie diesseits des Himmels voll verstehen k\u00f6nnen.\\n\\nWie sieht
  Gott Kinder?\\n\\n\u00dcberall in der Bibel sehen wir, dass das Herz des Herrn den
  Kindern in besonderer Weise zugeneigt ist.\\n\\nEine der diesbez\u00fcglich anr\u00fchrendsten
  Stellen in der gesamten Bibel finden wir in Hesekiel 16. Da beschreibt der Herr,
  wie er die Israeliten aufhob, als er sie wie ein verlassenes Kind auf dem Feld fand:\\n\\nUnd
  was deine Geburt betrifft \u2013 an dem Tag, als du ge\u00adboren wurdest, wurde
  dein Nabel nicht ab\u00ad geschnit\u00adten, und du wurdest nicht in Wasser gebadet
  zur Reinigung und nicht mit Salz abgerieben und nicht in Windeln gewickelt. Kein
  Auge blickte mitleidig auf dich, um dir eines dieser Dinge zu tun, um sich deiner
  zu erbarmen; und du wurdest auf das freie Feld geworfen, vor Abscheu an deinem Leben,
  an dem Tag, da du geboren wurdest. Da ging ich an dir vor\u00fcber und sah dich
  zappeln in deinem Blut; und ich sprach zu dir: \u00bbIn deinem Blut lebe!\u00ab
  Und ich sprach zu dir: \u00bbIn deinem Blut lebe!\u00ab Zu Zehntausenden, wie das
  Gew\u00e4chs des Feldes, machte ich dich; und du wuchsest heran und wurdest gro\u00df,
  und du gelangtest zu h\u00f6chster Anmut \u2026 (Hesekiel 16,4-7).\\n\\nGott hatte
  es sehr deutlich gemacht, dass er Israel von Anfang an berufen hatte, sein Eigen
  zu sein. Er liebte das Volk von dessen Kindheit an, obgleich dessen Angeh\u00f6rige
  wie ein ausgesetztes Waisenkind waren. Was bildlich f\u00fcr Israel Wahrheit ist,
  gilt auch f\u00fcr alle anderen Kinder, die ihm geh\u00f6ren. Seine gnadenreiche
  Liebe zu den Kleinen ist das passende Bild f\u00fcr seine Liebe zu Israel.\\n\\nDie
  Heilige Schrift versichert uns immer wieder dieser zwei gro\u00dfen Wahrheiten:\\n\\n*
  Gott betrachtet alle Babys als sein Eigen.\\n* Gott liebt alle seine \u00bbunschuldigen
  Kleinen\u00ab.\\n\\nAlle Babys \u00bbgeh\u00f6ren\u00ab Gott\\n\\nGottes gro\u00dfes
  Urteil \u00fcber sein Volk wird niemals deutlicher ausgedr\u00fcckt als durch den
  Propheten He\u00ad se\u00adkiel etwas sp\u00e4ter im selben Kapitel. Darum f\u00e4llt
  seine Anklage gegen die Bewohner Jerusalems au\u00dferordentlich scharf aus:\\n\\nUnd
  du nahmst deine S\u00f6hne und deine T\u00f6chter, die du mir geboren hattest, und
  opfertest sie ihnen zum Fra\u00df. War es zu wenig mit deiner Hurerei, dass du meine
  Kinder schlachtetest und sie hingabst, indem du sie ihnen durchs Feuer gehen lie\u00dfest?
  Und bei allen deinen Gr\u00e4ueln und deinen Hurereien erinnertest du dich nicht
  an die Tage deiner Jugend, als du nackt und blo\u00df warst, zappelnd in deinem
  Blut lagst (Hesekiel 16,20-22).\\n\\nGott beansprucht mit ganzem Ernst diese unschuldigen
  S\u00f6hne und T\u00f6chter f\u00fcr sich, die von den Israeliten den falschen G\u00f6ttern
  geopfert wurden. Er sagt, diese Kinder seien ihm geboren und darum seine Kin\u00adder.
  Und von seinem Besitzrecht will er auch Ge\u00ad brauch machen. In Jeremia 2,34
  und 19,4 nennt er sie sogar \u00bbunschuldig\u00ab. Obwohl auch sie gefallene Gesch\u00f6pfe
  sind wie alle Nachkommen Adams, haben sich kleine Kinder doch nicht im gleichen
  Sinne schuldig gemacht wie solche, die willentlich und mit Vorbedacht s\u00fcndigen.
  Darum dr\u00fcckt Gott sein ernstes Missfallen \u00fcber die Angeh\u00f6rigen des
  Volkes Israel aus, weil sie ihre kleinen Kinder nicht so behandelten, wie Gott es
  tat und von ihnen forderte.\\n\\nGott empfindet tiefes Mitleid mit seinen Unschuldigen!
  Das sehen wir deutlich an der Geschichte von Jona.\\n\\nAls der Herr den Propheten
  Jona nach Ninive sandte, damit er dort Bu\u00dfe predigte, tat Jona dies, wenn auch
  sehr widerstrebend. Jona hatte \u00fcberhaupt kein Gefallen daran, dass die Menschen
  in dieser feindlichen Stadt zu seinem Gott umkehrten. Noch viel weniger wollte er
  erleben, dass Gott ihnen Barmherzigkeit widerfahren lie\u00df. Er hasste die Heiden
  im All\u00ad gemeinen und die Niniviten im Besonderen. Viel lieber w\u00e4re ihm
  gewesen, Gott h\u00e4tte die ganze Stadt ausgerottet. Nach einer st\u00fcrmischen
  Seereise, nach den Erfahrungen im Bauch des gro\u00dfen Fisches und nach mehreren
  Predigttagen in Ninive meinte Jona, dass er Gottes Auftrag f\u00fcr sein Leben gerecht
  geworden w\u00e4re. Doch war er \u00fcber den Erfolg seiner Bu\u00dfpredigten ganz
  und gar nicht zufrieden. Im Gegenteil: Er haderte mit Gott, weil dieser beschlossen
  hatte, den bu\u00dffertigen Niniviten zu vergeben. Gott antwortete auf Jonas Unzufriedenheit,
  indem er sagte:\\n\\nUnd ich sollte mich Ninives, der gro\u00dfen Stadt, nicht erbarmen,
  in welcher mehr als 120\u2009000 Menschen sind, die nicht zu unterscheiden wissen
  zwischen ihrer Rechten und ihrer Linken, und eine Menge Vieh? (Jona 4,11).\\n\\nJene,
  die nicht zwischen ihrer rechten und ihrer linken Hand unterscheiden konnten, waren
  die kleinen Kinder und solche, die wegen geistiger Behinderung nicht zu einem solchen
  Urteil f\u00e4hig waren. Diesen kleinen Kin\u00addern von Ninive galt offensichtlich
  \u2013 wie auch den Tieren \u2013 das g\u00f6ttliche Mitleid. Gott hielt sein Gericht
  \u00fcber Ninive zur\u00fcck, weil die Stadt Bu\u00dfe tat. So wurde die massenhafte
  T\u00f6tung der unschuldigen Kinder vermieden.\\n\\nGott allein bestimmt das Alter\\n\\nder
  Zurechnungsf\u00e4higkeit\\n\\nJetzt erhebt sich nat\u00fcrlich die Frage: \u00bbWer
  erf\u00fcllt die Voraussetzungen f\u00fcr Gottes Mitleid, wenn es um unschuldige
  kleine Kinder geht?\u00ab\\n\\nIn manchen gemeindlichen Kreisen wird die Frage oft
  folgenderma\u00dfen formuliert: \u00bbAb wann sind Kinder eigenverantwortlich?\u00ab\\n\\nDabei
  geht es eigentlich nicht um das \u00bbAlter\u00ab, sondern um die \u00bbReife\u00ab.\\n\\nIch
  habe junge Leute getauft, die mir erz\u00e4hlten, sie seien zum Glauben gekommen,
  als sie zehn, zw\u00f6lf oder acht Jahre alt waren. Es gibt kein Alter, in dem jeder
  Mensch pl\u00f6tzlich daf\u00fcr verantwortlich wird, zwischen S\u00fcnde und Gerechtigkeit
  und zwischen Gericht und Vergebung zu unterscheiden und das Evangelium zu erfassen.
  Jedes Kind ist einzigartig in seiner Entwicklung und in dem Ma\u00df, in welchem
  es mit der Wahrheit vertraut gemacht wurde. In der Bibel finden wir auch kein Alter,
  von dem an alle Kinder f\u00fcr \u00bbverantwortlich\u00ab erkl\u00e4rt werden.
  Genauso wenig gibt es ein zeitlich fixiertes Alter im Leben eines Menschen, von
  dem an er pl\u00f6tzlich und automatisch in der Lage ist, das Richtige vom Falschen
  zu unterscheiden und Gottes Heilsplan zu begreifen.\\n\\nEs kommt auf die F\u00e4higkeit
  zu verantwortlichem Handeln an. Jedes Kind, das stirbt, bevor es diese F\u00e4higkeit
  zu moralischer Schuldhaftigkeit erreichte, kommt sofort nach dem Tod in den Himmel.\\n\\nEin
  Kind, das noch nicht moralisch haftbar gemacht werden kann, hat nicht die ausreichende
  Reife, um zu verstehen, was Gesetz und Gnade, S\u00fcnde und Errettung bedeuten.
  Nur Gott kennt den Zeitpunkt, an dem das Kind \u00bbzurechnungsf\u00e4hig\u00ab
  wurde. Die Heilige Schrift gibt uns einen Bericht \u00fcber den zw\u00f6lfj\u00e4hrigen
  Jesus, der zwischen seiner Kindheit und dem\\n\\nErwachsensein liegt. Dadurch soll
  uns gezeigt werden, dass er zu dieser Zeit zum vollen Verst\u00e4ndnis seiner g\u00f6ttlichen
  Natur und seiner pers\u00f6nlichen Sendung gelangt war. Wenn er seinen irdischen
  Eltern, die ihn gesucht hatten, sagte: \u00bbIch muss in dem sein, das meines Vaters
  ist\u00ab, dann zeigte er ihnen damit, dass er sich mit zw\u00f6lf Jahren in vollem
  Umfang der Wirklichkeit seines Lebens als Sohn Gottes bewusst war. Und das ist auch
  im Allgemeinen ein gutes Alter, um davon auszugehen, dass sich das Verantwortungsbewusstsein
  entwickelt hat.\\n\\nDie Bedingungen der Zurechnungsf\u00e4higkeit\\n\\nEin Kind,
  das noch nicht moralisch zur Verantwortung gezogen werden kann, ist ein Kind, das
  noch au\u00dferstande ist, \u00fcberzeugend zu begreifen, was Ge\u00ad setz und
  Gnade oder S\u00fcnde und Errettung bedeuten.\\n\\nEine Fehlgeburt oder ein abgetriebenes
  Baby hat kein Verst\u00e4ndnis von Gesetz und Gnade, S\u00fcnde und Heil \u2013
  genauso wenig wie ein Baby, das bei der Geburt oder kurz danach stirbt. Das Gleiche
  gilt f\u00fcr einen S\u00e4ugling oder ein Kleinkind \u2013 ja, sogar in manchen
  F\u00e4llen f\u00fcr \u00e4ltere Kinder.\\n\\nAn irgendeinem Punkt seines Heranreifens
  erlangt das Kind \u2013 ob Junge oder M\u00e4dchen \u2013 ein Verst\u00e4ndnis f\u00fcr
  Gesetz und Gnade. Mit anderen Worten: Das Kind beginnt folgende Grunds\u00e4tze
  zu erfassen und zu verstehen: Gott hat Regeln und Gebote erlassen;\\n\\nS\u00fcnde
  bedeutet, diese g\u00f6ttlichen Gesetze zu \u00fcbertreten oder zu verletzen; die
  Vergebung der S\u00fcnden wurde m\u00f6glich, weil der Herr Jesus am Kreuz gestorben
  ist; die Gnade Gottes erlaubt allen, die an Jesus Christus glauben, ihn als ihren
  Retter angenommen haben und sich ihm als Herrn unterstellen, dass sie von ihren
  S\u00fcnden gereinigt werden und nun ein neues Leben f\u00fchren, in dem sie ihm
  freudig Gehorsam leisten k\u00f6nnen.\\n\\nDieses genaue Alter variiert von Kind
  zu Kind. Es sind diese \u00bbBedingungen\u00ab, die z\u00e4hlen, nicht der Kalender.\\n\\nEinige
  Kinder erreichen diesen Reifegrad allerdings nie. Sie sind geistig so stark behindert,
  dass sie immer dem Denken eines Kleinkindes verhaftet bleiben. Wir k\u00f6nnten
  dann sagen: \u00bbSie h\u00e4tten den Verstand eines F\u00fcnfj\u00e4hrigen\u00ab,
  oder: \u00bbSie seien wie Kinder\u00ab in ihren geistigen F\u00e4higkeiten in Bezug
  auf das Schlussfolgern, Erinnern oder das Treffen moralischer Entscheidungen. Ihre
  K\u00f6rper m\u00f6gen voll ausgewachsen sein, nicht aber ihr Verstand. Diese geh\u00f6ren
  ebenfalls zu den \u00bbKindern\u00ab, die vielleicht nie den Zustand moralischer
  Zurechnungsf\u00e4higkeit erreichen.\\n\\nKinder in einer heidnischen Umgebung sind
  \u00bbUnschuldige\u00ab\\n\\nManchmal taucht die Frage auf, ob Kinder von Un\u00ad
  gl\u00e4ubigen von Gott als genauso einzigartiger Besitz angenommen sind wie die
  Kinder aus christlichen\\n\\nH\u00e4usern. Offensichtlich meinen einige Leute, dass
  Kinder gl\u00e4ubiger Eltern aufgrund des Glaubens ihrer Eltern in Sicherheit seien,
  die Kinder aus heidnischen Kulturen aber wegen der S\u00fcnden ihrer Eltern verdammt
  w\u00e4ren. Im Gegensatz dazu erkl\u00e4rt die Schrift, dass auch die Kinder von
  G\u00f6tzendienern in Gottes Augen als \u00bbunschuldig\u00ab gelten, solange sie
  nicht den Zustand moralischer Schuldf\u00e4higkeit erreicht haben.\\n\\nIn den Tagen
  des Propheten Jeremia machten sich die Anbeter falscher G\u00f6tter im Land Israel
  dadurch schuldig, dass sie ihre Kinder als Brandopfer darbrachten. Gott sprach von
  seinem Gericht \u00fcber die\u00ad jenigen, die diese Gr\u00e4ueltat ver\u00fcbten,
  und bezeichnete gleichzeitig die geopferten Kinder als \u00bbunschuldig\u00ab. Wir
  lesen Jeremia 19,4-7:\\n\\nWeil sie mich verlassen und diesen Ort verkannt und an
  ihm anderen G\u00f6ttern ger\u00e4uchert haben, die sie nicht kannten, weder sie
  noch ihre V\u00e4ter noch die K\u00f6nige von Juda, und diesen Ort mit dem Blut
  Unschuldiger gef\u00fcllt und die H\u00f6hen des Baal gebaut haben, um ihre Kinder
  als Brandopfer f\u00fcr den Baal im Feuer zu verbrennen, was ich nicht geboten und
  nicht geredet habe und mir nicht in den Sinn gekommen ist \u2026 Und ich werde den
  Rat von Juda und Jerusalem vereiteln an diesem Ort und werde sie durchs Schwert
  fallen lassen vor ihren Feinden und durch die Hand derer, die nach ihrem Leben trachten
  (Hervorhebung durch den Autor).\\n\\nVor einiger Zeit besuchte ich eine medizinische
  Konferenz, wo sich die Frage erhob, ob Kleinkinder sofort und direkt in den Himmel
  kommen. Viele der Teilnehmer waren Missionare, Missions\u00e4rzte und Krankenschwestern,
  die in den Heidenl\u00e4ndern der Dritten Welt ihren Dienst tun. Diese medizinischen
  Fachleute sehen viele Kinder sterben, einschlie\u00dflich Fehlgeburten und Totgeburten.
  Die meiste Zeit arbeiten diese \u00c4rzte und Krankenschwestern in heidnischen L\u00e4ndern,
  die dem G\u00f6tzendienst verhaftet sind.\\n\\nEine Hebamme kam nach meinem Vortrag
  zu mir. Sie arbeitete unter sehr schwierigen Umst\u00e4nden und hatte meist mit
  Fr\u00fchgeburten zu tun. Sie sagte mir, dass sie nie richtig gewusst habe, was
  sie Eltern sa\u00ad gen konnte, deren Babys gestorben waren. Ihre Freu\u00ad \u00adde
  war fast \u00fcberw\u00e4ltigend, als ich ihr ausf\u00fchr\u00adlicher erkl\u00e4rte,
  was die Bibel meiner \u00dcberzeugung nach \u00fcber den Tod kleiner Kinder sagt
  \u2013 selbst dann, wenn die Eltern dem scheu\u00dflichsten Satanismus oder anderen
  gottlosen Religionen huldigen. Sie sagte dar\u00adauf: \u00bbEndlich habe ich Hoffnung
  f\u00fcr diese Kleinen! Endlich kann ich deren Eltern diese Hoffnung mit\u00adteilen,
  selbst wenn sie den Herrn noch nicht kennen!\u00ab\\n\\nEs ist nun einmal so, dass
  \u2013 auf die gesamte Menschheitsgeschichte bezogen \u2013 die weitaus meisten
  der vor ihrer vollen moralischen Verantwortungsf\u00e4higkeit gestorbenen Kinder
  von gottfernen Eltern empfangen wurden! Buchst\u00e4blich Milliarden von Babys\\n\\nwaren
  nach ihrer Empf\u00e4ngnis Fehlgeburten oder starben als Kleinkinder bzw. w\u00e4hrend
  der Geburt in solchen Regionen der Welt, die vom Evangelium nicht erreicht wurden
  und wo die Leute in der Tyrannei falscher Religionen gefangen gehalten werden. Doch
  Gott benutzt das Wort unschuldig nicht, wenn er es nicht meint. Die von Baalsanbetern
  geopferten Kinder wurden nicht verflucht oder f\u00fcr schuldig befunden wie ihre
  Eltern, weil diese in ihrer Bosheit den wahren Gott verworfen hatten. Wenn auch
  die Eltern schuldig waren, nennt Gott doch ihre Babys \u00bbUnschuldige\u00ab. Und
  Gott ist gerecht. Er wird niemals die Unschuldigen bestrafen.\\n\\nMillionen und
  Abermillionen von Babys und Kleinkindern in unterentwickelten L\u00e4ndern und heidnischen
  Kulturen sind w\u00e4hrend der vergangenen Jahrhunderte gestorben. Millionen und
  Abermillionen Babys wurden von Eltern empfangen, die Hindus, Buddhisten, Moslems,
  Atheisten oder Anh\u00e4nger einer der Tausenden Sekten oder falschen Religionen
  waren \u2013 und sind gestorben. All diese Kinder sind \u00bbUnschuldige\u00ab in
  Gottes Augen.\\n\\nDie Heilige Schrift legt gro\u00dfen Wert auf die Tatsache, dass
  unschuldige Kinder im Himmel sind. Sie sind erl\u00f6st und wohnen in der Gegenwart
  Gottes. In der Offenbarung lesen wir, dass wir im Himmel \u00bbaus jedem Stamm und
  Sprache und Volk und Nation\u00ab (Offenbarung 5,9) Leute finden werden. Es gibt
  noch\\n\\nheute St\u00e4mme und Sprachen \u2013 die sogenannten \u00bbVolks\u00adgruppen\u00ab
  verschiedener isolierter, eigenst\u00e4n\u00ad diger Ethnien, Kulturen und Sprachen
  \u2013 die das Evangelium nie geh\u00f6rt haben. Doch Gottes Wort sagt, dass Vertreter
  dieser St\u00e4mme und Sprachen im Himmel sein werden. Wie ist das m\u00f6glich?
  Ein Weg ist die Erl\u00f6sung der kleinen Kinder. Sie werden unter denen sein, die
  \u00bbunserem Gott zu K\u00f6nigen und Priestern gemacht\u00ab werden (Offenbarung
  5,10).\\n\\nBabys m\u00fcssen nicht f\u00fcr die S\u00fcnden der Eltern b\u00fc\u00dfen\\n\\nWer
  die Unschuld kleiner Kinder aus heidnischen Kulturen infrage stellt, neigt oft zu
  der Ansicht, deren Innenleben sei sozusagen eine \u00bbFortsetzung\u00ab des Glaubens
  ihrer Eltern, sodass sie auch irgendwie an den elterlichen S\u00fcnden schuldig
  seien. So etwas lehrt uns aber die Heilige Schrift nicht.\\n\\nWas meint Gott dann
  aber in 2. Mose 20,5, wo er sagt: \u00bbIch, der HERR, dein Gott, bin ein eifernder
  Gott, der die Ungerechtigkeit der V\u00e4ter heimsucht an den Kindern am dritten
  und am vierten Glied derer, die mich hassen\u00ab? Und auch, als der HERR Mose auf
  dem Sinai begegnete, um ihm zum zweiten Mal die Zehn Gebote auf Steintafeln zu geben,
  k\u00fcndigte er sein Kommen mit den Worten an: \u00bbHERR, HERR, Gott, barmherzig
  und gn\u00e4dig, langsam zum Zorn und gro\u00df an G\u00fcte und Wahrheit, der G\u00fcte
  bewahrt auf Tausende hin, der Ungerechtigkeit, \u00dcbertretung und\\n\\nS\u00fcnde
  vergibt \u2013 aber keineswegs h\u00e4lt er f\u00fcr schuldlos den Schuldigen \u2013,
  der die Ungerechtigkeit der V\u00e4ter heimsucht an den Kindern und Kindeskindern
  am dritten und am vierten Glied\u00ab (2. Mose 34,6-7; siehe auch 5. Mose 5,9 und
  Jeremia 32,18). Hei\u00dft das nicht, dass Kinder f\u00fcr die S\u00fcnden ihrer
  Eltern haftbar gemacht werden?\\n\\nNein. Denn 5. Mose 24,16 sagt deutlich: \u00bbNicht
  sollen V\u00e4ter get\u00f6tet werden um der Kinder willen, und Kinder sollen nicht
  get\u00f6tet werden um der V\u00e4ter willen; sie sollen ein jeder f\u00fcr seine
  S\u00fcnde get\u00f6tet werden.\u00ab Das diesem Gesetz zugrunde liegende Prinzip
  wird uns in Hesekiel 18,20 mitgeteilt: \u00bbDie Seele, welche s\u00fcndigt, die
  soll sterben. Ein Sohn soll nicht die Ungerechtigkeit des Vaters mittragen; die
  Gerechtigkeit des Gerechten soll auf ihm sein und die Gesetzlosigkeit des Gesetzlosen
  soll auf ihm sein.\u00ab Das ist eine klare Absage an die Vorstellung, ein Kind
  k\u00f6nne f\u00fcr die S\u00fcnden der Eltern haftbar gemacht werden.\\n\\nLiegt
  hier ein Widerspruch vor? Nein. Kein Sohn soll die Schuld des Vaters tragen. Aber
  die Kinder eines s\u00fcndigen Geschlechts sind \u00fcberaus m\u00e4chtig von den
  Folgen der S\u00fcnden ihrer Gesellschaft betroffen.\\n\\nIm zweiten Buch Mose gab
  Gott das Gesetz mit der Warnung an die V\u00e4ter in Israel, dass, wenn sie nicht
  ihn allein anbeteten, sondern sich zu den G\u00f6tzen wen\u00addeten, sie die Gesellschaft
  in geistliche Verderbnis rei\u00dfen w\u00fcrden, und das h\u00e4tte dann f\u00fcr
  mehrere Ge\u00adschlech\u00ad\\n\\nter unheilvolle Konsequenzen. Der G\u00f6tzendienst
  der V\u00e4ter w\u00fcrde sich selbstverst\u00e4ndlich auf die kommenden Generationen
  auswirken. War erst eine geist\u00adliche Verunreinigung in Israel in Gang gesetzt,
  w\u00e4re sie so ansteckend, dass sie auch noch die folgenden Generationen von Kindern,
  Enkeln und Urenkeln verseuchen w\u00fcrde. Die nachfolgende Geschichte Israels be\u00ad
  st\u00e4tigte die Wahrheit dieser Warnung. S\u00fcnde gebiert stets mehr S\u00fcnde,
  und das schlechte Vorbild eines Vaters kann sich auf mehrere Generationen auswirken.\\n\\nAber
  Gott sagt nicht, dass er den Kindern die S\u00fcnden der V\u00e4ter vorwirft. Die
  Kinder m\u00fcssen die Konsequen\u00ad zen der S\u00fcnden tragen, nicht die Schuld
  daran. Dar\u00fcber hinaus kann der Kreislauf von G\u00f6tzendienst und dessen Folgen
  durchbrochen werden, wenn sich die j\u00fcngere Generation in Bu\u00dfe und Glauben
  zu Gott hinwendet. Man muss darauf achten, dass Gott ausdr\u00fccklich sagt, er
  werde die Ungerechtigkeiten der V\u00e4ter heimsuchen \u00bban den Kindern am dritten
  und vierten Geschlecht derer, die mich hassen\u00ab. Wenn die Kinder den S\u00fcnden
  ihrer V\u00e4ter folgen, vervielfachen sich die \u00fcblen Konsequenzen \u00fcber
  Generationen hinweg. Aber welche Schuld die Kinder auch tragen m\u00f6gen, immer
  ist es ihre eigene, weil sie den S\u00fcnden der V\u00e4ter nachfolgten. Man beachte
  dabei, dass niemals eine Drohung gegen Kinder ausgesprochen wird, in denen die Liebe
  zu Gott Gestalt gewinnt, als w\u00fcrden sie an\u00ad gesichts der S\u00fcnden der
  V\u00e4ter heimgesucht.\\n\\nSo widerspricht 2. Mose 20,5 nicht Hesekiel 18,20.
  Beides ist wahr. Wenn eine Generation s\u00fcndig und Gott ungehorsam ist, k\u00f6nnen
  nachfolgende Generationen verheerende Folgen davon ernten \u2013 und diese Folgen
  steigern sich ins Unermessliche, wenn sie selbst auch noch in den S\u00fcnden ihrer
  Eltern leben. Aber die Kinder werden nicht f\u00fcr die S\u00fcnden ihrer Eltern
  haftbar gemacht.\\n\\nIm Gegenteil sagt die Bibel, dass die kleinen Kinder nicht
  f\u00fcr die S\u00fcnden ihrer Eltern zur Verantwortung ge\u00adzogen werden. Diese
  Tatsache hat der Herr ganz deut\u00adlich durch Mose ausdr\u00fccken lassen, als
  er den Israe\u00adliten kundtat, was ihnen als Nachwirkung auf ihren Unglauben und
  Ungehorsam passieren w\u00fcrde, kurz nachdem sie durchs Rote Meer gezogen waren.
  Ich will kurz an den Hintergrund zu dieser Aussage erinnern:\\n\\nAls die Kinder
  Israel aus \u00c4gypten kamen, hatte Gott vor, sie innerhalb weniger Wochen ins
  Land der Ver\u00ad hei\u00dfung zu bringen. Die Israeliten sandten aber Kund\u00adschafter
  in das Land, und mit Ausnahme von Kaleb und Josua berichteten die Kundschafter,
  das Land sei unm\u00f6glich einzunehmen. Mit einer Riesentraube als Beweis verk\u00fcndigten
  die Kundschafter, das Land sei sehr gut. Dann aber berichteten sie weiter, die dort
  lebenden Menschen seien gr\u00f6\u00dfer und h\u00f6her als die Israeliten und ihre
  St\u00e4dte seien sehr befestigt, bis zum Himmel, und von Riesen bewohnt. Zehn der\\n\\nKundschafter
  waren voller Furcht angesichts der Aussicht, gegen diese Menschen Krieg zu f\u00fchren,
  und die Israeliten folgten ihrem Beispiel und weigerten sich, das Land zu betreten
  (5. Mose 1,19-33).\\n\\nGott war zornig \u00fcber sein Volk. Er hatte versprochen,
  vor ihnen herzugehen, f\u00fcr sie zu k\u00e4mpfen und das Land in ihre H\u00e4nde
  zu geben, genauso wie er sie so souver\u00e4n aus \u00c4gypten erl\u00f6st hatte.
  Ihr Unglaube in Bezug auf Gottes F\u00e4higkeit, dies nun ebenfalls tun zu k\u00f6nnen,
  f\u00fchrte zu dem Schwur: \u00bbWenn ein Mann unter diesen M\u00e4nnern, diesem
  b\u00f6sen Geschlecht, das gute Land sehen wird, das ich geschworen habe, euren
  V\u00e4tern zu geben, au\u00dfer Kaleb, dem Sohn Jephunnes! Er soll es sehen, und
  ihm und seinen S\u00f6hnen werde ich das Land geben, auf welches er getreten ist,
  darum dass er dem HERRN v\u00f6llig nachgefolgt ist.\u00ab Der Herr sagte auch:
  \u00bbJosua, der Sohn Nuns, der vor dir steht, er soll hineinkommen, ihn st\u00e4rke;
  denn er soll es Israel als Erbe austeilen.\u00ab Dann f\u00fcgte er hinzu: \u00bbIhr
  aber, wendet euch und brecht auf nach der W\u00fcste, des Wegs zum Schilfmeer!\u00ab
  (5. Mose 1,34-38.40).\\n\\n\u00dcber die S\u00e4uglinge und kleinen Kinder sagte
  der Herr hingegen: \u00bbUnd eure Kindlein, von denen ihr sagtet: Sie werden zur
  Beute werden! und eure S\u00f6hne, die heute weder Gutes noch B\u00f6ses kennen,
  sie sollen hineinkommen, und ihnen werde ich es geben, und sie sollen es in Besitz
  nehmen\u00ab (5. Mose 1,39).\\n\\nDie Kinder der s\u00fcndigen israelitischen Eltern
  durften\\n\\nohne Einschr\u00e4nkung in die Segnungen eingehen, die Gott f\u00fcr
  sein Volk vorbereitet hatte. Sie waren in keiner Weise f\u00fcr die S\u00fcnden
  ihrer Eltern Rechenschaft schuldig, verantwortlich oder zu bestrafen. Warum? Sie
  konnten Gutes und B\u00f6ses, Richtiges und Falsches nicht unterscheiden.\\n\\nIn
  Hesekiel 18,20 sagt Gott: \u00bbDie Seele, welche s\u00fcndigt, die soll sterben.
  Ein Sohn soll nicht die Ungerechtigkeit des Vaters mittragen; die Gerechtigkeit
  des Gerechten soll auf ihm sein, und die Gesetzlosigkeit des Gesetzlosen soll auf
  ihm sein.\u00ab\\n\\nDas gilt auch heute noch.\\n\\nEin Kind mag im Ehebruch gezeugt
  worden sein.\\n\\nEin F\u00f6tus ist vielleicht von einer gottlosen Mutter abgetrieben
  worden.\\n\\nEin grausamer Vater kann ein Kleinkind erschlagen haben.\\n\\nVor Gott
  werden alle diese Kinder jedoch nicht haftbar gemacht f\u00fcr die S\u00fcnden ihrer
  Eltern.\\n\\nIm Gegenteil: Sie werden f\u00fcr \u00bbschuldlos\u00ab an all diesen
  S\u00fcnden gehalten. Sie haben sich nicht gegen Gott aufgelehnt; sie hatten keine
  \u00bbStimme\u00ab, als die Israeliten aufbegehrten und ihren Unglauben erkennen
  lie\u00dfen. Und auf ganz tiefgr\u00fcndige Weise segnete Gott ihre Unschuld.\\n\\nWas
  ist mit den unz\u00e4hligen Heidenv\u00f6lkern?\\n\\nIch m\u00f6chte einen Augenblick
  lang vom Thema ab\u00ad schwei\u00adfen, um etwas \u00fcber die Unschuld der heid\u00ad
  nischen Kleinkinder zu sagen.\\n\\nWichtig ist, an dieser Stelle darauf zu achten,
  was ich nicht sage. Die Unschuld ist auf Kinder (und geistig Behinderte) beschr\u00e4nkt
  und gilt f\u00fcr niemanden sonst. Damit Sie verstehen k\u00f6nnen, dass Gott diese
  Einschr\u00e4nkung macht, muss ich ausdr\u00fccklich jene zur\u00fcckweisen, die
  diese \u00bbUnschuldst\u00fcr\u00ab weiter \u00f6ffnen m\u00f6chten, weil Gott damit
  nur diese kostbaren \u00bbKleinen\u00ab meinte. Manche m\u00f6chten auch alle erwachsenen
  Heiden hineinlassen, die nicht das biblische Verst\u00e4ndnis von S\u00fcnde und
  Gerechtigkeit, von Richtig und Falsch und von Gut und B\u00f6se haben. Das ist eine
  Haltung, die in der Heiligen Schrift keine Unterst\u00fctzung findet. Tats\u00e4chlich
  ist genau das Gegenteil wahr. Der Apostel Paulus schrieb in seinen einleitenden
  Dar\u00ad legungen zum R\u00f6merbrief \u00fcber genau diese Frage:\\n\\nIch sch\u00e4me
  mich des Evangeliums nicht; denn es ist Gottes Kraft zum Heil jedem Glaubenden,
  sowohl dem Juden zuerst als auch dem Griechen. Denn Gottes Gerechtigkeit wird darin
  geoffenbart aus Glauben zu Glauben, wie geschrieben steht: \u00bbDer Gerechte aber
  wird durch Glauben leben.\u00ab\\n\\nDenn es wird geoffenbart Gottes Zorn vom Himmel
  her \u00fcber alle Gottlosigkeit und Ungerechtigkeit der Menschen, welche die Wahrheit
  in Un\u00ad gerechtigkeit besitzen; weil das von Gott Erkennbare unter ihnen offenbar
  ist; denn Gott hat es ihnen geoffenbart \u2013 denn das Unsichtbare von ihm, sowohl
  seine ewige Kraft als auch seine G\u00f6ttlichkeit, die von Erschaffung der Welt
  an in dem Gemachten wahrgenommen werden, wird ge\u00ad schaut \u2013 damit sie ohne
  Entschuldigung seien; weil sie, Gott kennend, ihn weder als Gott verherrlichten
  noch ihm Dank darbrachten, sondern in ihren \u00dcberlegungen in Torheit verfielen,
  und ihr unverst\u00e4ndiges Herz verfinstert wurde; indem sie sich f\u00fcr Weise
  ausgaben, sind sie zu Narren geworden und haben die Herrlichkeit des unverwes\u00adlichen
  Gottes verwandelt in das Gleichnis eines Bildes eines verweslichen Menschen und
  von V\u00f6geln und von vierf\u00fc\u00dfigen und kriechenden Tieren.\\n\\nDarum
  hat sie Gott auch dahingegeben in den Ge\u00ad l\u00fcsten ihrer Herzen in Unreinigkeit,
  ihre Leiber untereinander zu sch\u00e4nden; welche die Wahrheit Gottes in L\u00fcge
  verwandelt und dem Gesch\u00f6pf mehr Verehrung und Dienst dargebracht haben als
  dem Sch\u00f6pfer, welcher gepriesen ist in Ewigkeit. Amen.\\n\\nDeswegen hat sie
  Gott auch hingegeben in sch\u00e4nd\u00ad liche Leidenschaften \u2026 Und gleichwie
  sie es nicht f\u00fcr gut fanden, Gott in Erkenntnis zu haben, hat Gott sie dahingegeben
  in einen verworfenen Sinn, zu tun, was sich nicht geziemt; erf\u00fcllt mit aller
  Un\u00ad\\n\\ngerechtigkeit, Bosheit, Habsucht, Schlechtigkeit; voll von Neid, Mord,
  Streit, List, T\u00fccke; Ohren\u00adbl\u00e4ser, Verleumder, Gott Hassende, Gewaltt\u00e4ter,
  Hoch\u00adm\u00fc\u00ad tige, Prahler, Erfinder b\u00f6ser Dinge, den Eltern Un\u00ad
  gehorsame, Unverst\u00e4ndige, Treulose, ohne nat\u00fcr\u00ad liche Liebe, Unbarmherzige;
  die, wiewohl sie Gottes gerechtes Urteil erkennen, dass die solches tun des Todes
  w\u00fcrdig sind, es nicht allein aus\u00fcben, sondern auch Wohlgefallen an denen
  ha\u00adben, die es tun. Deshalb bist du nicht zu entschuldi\u00adgen, o Mensch,
  jeder, der da richtet; denn worin du den anderen richtest, verurteilst du dich selbst;
  denn du, der du richtest, tust dasselbe (R\u00f6mer 1,16 \u2013 2,1).\\n\\nDiesem
  Abschnitt zufolge hat jeder eine innewohnende rudiment\u00e4re Gotteserkenntnis.
  Anstatt aber dieser Erkenntnis zu entsprechen, zogen es die Menschen vor, ihren
  eigenen Vorstellungen zu folgen, ihre eigenen G\u00f6tzen zu erschaffen und sie
  anstelle ihres Sch\u00f6pfers zu verehren. Erwachsene Heiden sind verantwortlich,
  der Wahrheit Gottes zu folgen, soweit sie das Evangelium verstehen konnten, und
  darauf mit Glauben zu reagieren. Darin versagt zu haben, wird ihnen als ein Akt
  vors\u00e4tzlicher Ablehnung oder Rebellion angerechnet. Sie besitzen keine Entschuldigung,
  weil sie Gutes von B\u00f6sem unterscheiden k\u00f6nnen und sich absichtlich f\u00fcr
  das B\u00f6se entschieden haben. Erwachsene Heiden, die sterben, sind also in einer
  Weise f\u00fcr ihre S\u00fcnden moralisch verantwortlich, die f\u00fcr gestorbene
  kleine Kinder nicht gilt.\\n\\nEin w\u00fcrdiges Begr\u00e4bnis f\u00fcr Jerobeams
  Baby\\n\\nDie Wahrheit, dass ein Baby nicht f\u00fcr die S\u00fcnden der Eltern
  zur Rechenschaft gezogen wird, wird uns in der Geschichte Jerobeams und seines kleinen
  Jungen vor Augen gef\u00fchrt.\\n\\nJerobeam war ein b\u00f6ser K\u00f6nig. Er stellte
  \u00fcberall im Land G\u00f6tzenbilder auf, und w\u00e4hrend seiner Herrschaft begannen
  die Priester, diesen falschen Gottheiten Kinderopfer darzubringen. Der HERR sagte
  Jerobeam klar und deutlich durch den Propheten Achija:\\n\\nDu hast es \u00e4rger
  gemacht als alle, die vor dir ge\u00ad wesen sind, und bist hingegangen und hast
  dir andere G\u00f6tter und gegossene Bilder gemacht, um mich zu reizen, und hast
  mich hinter deinen R\u00fccken geworfen: Darum, siehe, will ich Ungl\u00fcck \u00fcber
  das Haus Jerobeams bringen, und ich werde von Jerobeam ausrotten, was m\u00e4nnlich
  ist, den Gebundenen und den Freien in Israel; und ich werde hinter dem Hause Jerobeams
  ausfegen, wie man Kot ausfegt, bis es aus mit ihm ist. Wer von Jerobeam in der Stadt
  stirbt, den sollen die Hunde fressen, und wer auf dem Feld stirbt, den sollen die
  V\u00f6gel des Himmels fressen; denn der HERR hat es geredet (1. K\u00f6nige 14,9-11).\\n\\nAlle
  Erben und Verwandten Jerobeams waren von Gott zum Tode verurteilt. Und nicht nur
  das, sie waren zum schm\u00e4hlichsten Tod verurteilt, den man damals in Israel
  kannte \u2013 zu einem Tod ohne anst\u00e4ndiges Begr\u00e4bnis. Die denkbar schrecklichste
  Entweihung bedeutete es, wenn der Leib eines Menschen von Tieren zerrissen und von
  aasfressenden V\u00f6geln verzehrt wurde. Der Herr sagte durch seinen Propheten,
  dass alle m\u00e4nnlichen Verwandten Jerobeams wie Kot ausgefegt w\u00fcrden. Das
  hei\u00dft, die wilden Hunde in den St\u00e4dten und die Geier auf freiem Feld w\u00fcrden
  ihre Leiber dort fressen, wo sie umgekommen waren. Ausgenommen bliebe nur ein m\u00e4nnlicher
  Erbe.\\n\\nDem kleinen Sohn Jerobeams sollte dieses abscheu\u00ad liche und widerw\u00e4rtige
  Schicksal erspart bleiben. Der Herr sagte zu Jerobeams Frau:\\n\\nUnd du, mach dich
  auf, geh in dein Haus; wenn deine F\u00fc\u00dfe in die Stadt eintreten, wird das
  Kind sterben. Und ganz Israel wird um ihn klagen und ihn begraben; denn von Jerobeam
  wird dieser allein in ein Grab kommen, weil an ihm etwas Gutes gegen den HERRN,
  den Gott Israels, gefunden worden ist im Hause Jerobeams (1. K\u00f6nige 14,12-13).\\n\\nJerobeams
  kleiner Sohn sollte zusammen mit allen Erben Jerobeams sterben, und doch sollte
  sein Tod anders sein. Er w\u00fcrde eines einigerma\u00dfen nat\u00fcr\u00ad lichen
  Todes sterben, sobald die F\u00fc\u00dfe seiner Mutter die Stadt betraten. Aber
  sein Tod sollte beklagt und er wie ein Prinz beerdigt werden. Der Herr hatte n\u00e4mlich
  \u00bban ihm etwas Gutes gegen den HERRN, den Gott Israels, gefunden\u00ab.\\n\\nDas
  kleine Kind hatte selbst keine Verdienste vorzuweisen \u2013 es hatte nichts getan,
  was das Etikett \u00bbgerecht\u00ab verdient h\u00e4tte. Es hatte aber auch nichts
  bewusst getan, was das Etikett \u00bbungerecht\u00ab tragen m\u00fcsste. Es hatte
  nicht gegen Gott, den HERRN, rebelliert. Es hatte nicht an Zeremonien zu Ehren eines
  G\u00f6tzen teilgenommen. Worin bestand das \u00bbetwas Gute\u00ab, das in ihm gefunden
  wurde? Die Heilige Schrift schweigt dar\u00fcber. Kindliche Demut vielleicht? M\u00f6glicherweise
  konnte sein kindliches Gem\u00fct die heidnischen Riten nicht ertragen. Was auch
  immer \u2013 es war nichts, womit man die Errettung h\u00e4tte verdienen k\u00f6nnen
  (R\u00f6mer 8,7-8); aber Gott hat in seiner Gnade diesem Kind seine Gunst zugewandt
  und es vor dem entehrenden Tod bewahrt, der das g\u00f6tt\u00adliche Gericht \u00fcber
  alle anzeigte, die willentlich an Jero\u00ad beams S\u00fcnden beteiligt waren.
  Infolgedessen wurde ihm ehrenvolles Begr\u00e4bnis nach einem friedlichen Abscheiden
  gew\u00e4hrt, und der Kleine ging sofort in die Gegenwart des Herrn ein.\\n\\nGnade
  f\u00fcr die kleinen Kinder der Feinde Gottes\\n\\nF\u00fcr Bibelkenner mag die
  Frage auftauchen: \u00bbWas ist aber mit Gottes Befehl, die Babys der Feinde umzubringen?
  Immerhin musste doch auch Jero\u00adbeams Klei\u00adner sterben, wenn ihm auch die
  Entehrung er\u00ad spart blieb, von Tieren gefressen zu werden. Sein Leben hatte
  Gott nicht geschont.\u00ab Tats\u00e4chlich gibt es andere Abschnitte in der Bibel,
  in denen Gott den Tod kleiner Kinder als Teil des Gerichts \u00fcber ein gottloses
  Volk bestimmt.\\n\\nAls Gott zum Beispiel zum Gericht \u00fcber Babylon aufrief,
  sagte er durch den Propheten Jesaja: \u00bbIhre Kinder werden vor ihren Augen zerschmettert\u00ab
  (Jesaja 13,16).\\n\\nAls Gott Assyrien aufforderte, Israel als Gericht mit Krieg
  zu \u00fcberziehen, sagte er durch den Propheten Hosea:\\n\\nSamaria wird b\u00fc\u00dfen;
  denn es ist widerspenstig gewesen gegen seinen Gott; sie werden durchs Schwert fallen,
  ihre Kinder werden zerschmettert und ihre Schwangeren aufgeschlitzt werden (Hosea
  13,16).\\n\\nDasselbe wird von Assyriens Krieg gegen \u00c4gypten gesagt:\\n\\nAuch
  sie ist in die Verbannung, in die Gefangenschaft gezogen; auch ihre Kinder wurden
  zerschmettert an allen Stra\u00dfenecken (Nahum 3,10).\\n\\nDie folgenden Verse
  aus den Psalmen sind noch erstaunlicher: Sie sprechen von der Freude, die solche
  empfanden, die die kleinen Kinder der babylonischen Eroberer umbrachten:\\n\\nTochter
  Babel, du Verw\u00fcstete! Gl\u00fcckselig, der dir dasselbe vergilt, was du uns
  getan hast! Gl\u00fcck\u00ad selig, der deine Kindlein ergreift und sie hinschmettert
  auf den Felsen! (Psalm 137,8-9).\\n\\nDie erste Reaktion der Leser dieser Verse
  ist ein geschocktes Zur\u00fcckschrecken. Es ist scheu\u00dflich und regt einen
  auf, wenn man von kleinen Kindern liest, die an die Felsen geschmettert werden,
  ganz davon zu schweigen, dass einige daf\u00fcr noch gesegnet werden! Diese Abschnitte
  geh\u00f6ren jedoch zum inspirierten Wort Gottes. Darum m\u00fcssen wir uns mit
  ihnen auseinandersetzen. Wie k\u00f6nnen wir aber Gottes Liebe und Erbarmen gegen\u00fcber
  seinen unschul\u00addigen Kleinen mit seiner Weissagung vereinbaren, die Kindlein
  w\u00fcrden zerschmettert werden, wenn die Eroberer gegen sein Volk heraufziehen
  werden?\\n\\nDie einzige M\u00f6glichkeit, diese beiden anscheinend widerspr\u00fcchlichen
  Aussagen zu vers\u00f6hnen, ist diese: Kinder haben es nach ihrem Tod weit besser,
  als wenn es ihnen erlaubt bliebe, auf dieser Erde erwachsen zu werden.\\n\\nDer
  Tod der unschuldigen Heidenkinder mag f\u00fcr die Erwachsenen, die hier auf Erden
  leben, katastrophal sein; doch von Gott her gesehen, bedeutet ihr Tod einen Segen.
  Das Leben, das sie bei ihm kennenlernen, wenn sie in Ewigkeit bei ihm sind, \u00fcbertrifft
  bei Weitem alles, was sie hier auf Erden je an Gutem er\u00ad\\n\\nleben k\u00f6nnten.
  Die Heilige Schrift bezeugt klar diese \u00dcberzeugung im Blick auf ein herrliches
  \u00bbDanach\u00ab f\u00fcr ein kleines Kind, das stirbt.\\n\\nEin besseres Leben
  als das jetzige\\n\\nHiob erlebte eine so intensive Verzweiflung, dass er zu reden
  begann und dabei den Tag seiner Geburt verfluchte. Er sagte: \u00bbEs verschwinde
  der Tag, an dem ich geboren wurde, und die Nacht, welche sprach: \u203aEin Kn\u00e4blein
  ist empfangen!\u2039 Jener Tag sei Finsternis! Nicht frage Gott nach ihm droben,
  und nicht ergl\u00e4nze \u00fcber ihm das Licht! Finsternis und Todesschatten m\u00f6gen
  ihn einl\u00f6sen, Gew\u00f6lk lagere sich \u00fcber ihm, es schrecken ihn Tagesverfinsterungen\u00ab
  (Hiob 3,1-5).\\n\\nAlles nur Erdenkliche ging in Hiobs Leben schief. Seine Frau
  gab ihm den Rat, sich von Gott loszusagen und zu sterben. Doch er schenkte ihr kein
  Geh\u00f6r. Die Schrift teilt uns mit: \u00bbHiob (s\u00fcndigte) nicht mit seinen
  Lippen\u00ab (Hiob 2,9-10). Dennoch brachte Hiob anschlie\u00dfend zum Ausdruck,
  wie ihm zumute war, nachdem er Furchtbares durchlitten hatte: Er hatte seine Kinder
  sowie Besitzt\u00fcmer verloren und war vom Scheitel bis zur Sohle mit schmerzhaften
  Geschw\u00fcren geschlagen worden. Daraufhin sagte er:\\n\\nWarum starb ich nicht
  von Mutterleib an, kam aus dem Scho\u00df hervor und verschied? Weshalb kamen mir
  Knie entgegen und wozu Br\u00fcste, dass ich sog?\\n\\nDenn jetzt w\u00fcrde ich
  liegen und rasten, ich w\u00fcrde schlafen: Dann h\u00e4tte ich Ruhe \u2013 mit
  K\u00f6nigen und R\u00e4ten der Erde, welche sich ver\u00f6dete Pl\u00e4tze erbauten,
  oder mit F\u00fcrsten, die Gold hatten, die H\u00e4user mit Silber f\u00fcllten;
  oder, wie eine verborgene Fehl\u00ad geburt, w\u00e4re ich nicht da, wie Kinder,
  die das Licht nicht erblickt haben. Dort lassen die Gott\u00adlosen ab vom Toben,
  und dort ruhen die an Kraft Ersch\u00f6pften, rasten die Gefangenen allesamt, h\u00f6ren
  nicht die Stimme des Treibers. Der Kleine und der Gro\u00dfe, dort sind sie alle
  gleich, und der Knecht ist frei von seinem Herrn (Hiob 3,11-19).\\n\\nHiob beschreibt
  ein Paradies f\u00fcr das tot geborene Kind! Er vergleicht sein Leben des Elends,
  des Leids und der Unterdr\u00fcckung mit dem eines Totgeborenen und kommt zu dem
  Schluss: Ein solches Kind ist besser dran. Es ist frei von aller M\u00fche, allen
  Qualen, allen Schmerzen und Leiden und los von allen Fesseln.\\n\\nHiob war seinerzeit
  der gerechteste Mensch auf Erden. Er war ein Mann Gottes mit einer fundierten Theologie
  und einem gesunden Glauben. Hiob glaubte an ein Leben nach dem Tod und dr\u00fcckte
  diese Hoffnung mit den Worten aus: \u00bb\u2026 und ist nach meiner Haut dies da
  zerst\u00f6rt, so werde ich aus meinem Fleisch Gott anschauen, den ich selbst mir
  anschauen und den meine Augen sehen werden, und kein anderer\u00ab (Hiob 19,26-27).
  Somit glaubte Hiob an ein Auferstehungsleben, in welchem er in Gottes\\n\\nGegenwart
  leben w\u00fcrde. Hier zeigt er an, dass diese Hoffnung auch einem tot geborenen
  Kind sicher ist. Und er kam zu dem Schluss, dass er es weit besser gehabt h\u00e4tte,
  wenn er tot geboren und direkt in Gottes Gegenwart gekommen w\u00e4re, um in dem
  zuk\u00fcnftigen Leben \u00bbRuhe\u00ab zu haben.\\n\\nDas tot geborene Kind lebt
  dort zusammen mit den ehemals Ersch\u00f6pften und den seinerzeit Gefangenen und
  den vormals Unterdr\u00fcckten. Ganz sicher beschrieb Hiob nicht die H\u00f6lle;
  denn ein Kennzeichen der H\u00f6lle ist ewige Unruhe, wo die Bosheit \u00fcberquillt.
  Hiob jedoch beschreibt das Leben des Totgeborenen im Jenseits als ein Leben der
  Freiheit von allem B\u00f6sen.\\n\\nHiobs Schmerzen und Leiden waren so heftig,
  dass er w\u00fcnschte, der Tag w\u00e4re nie gekommen, an dem er geboren wurde.
  Er sagte: \u00bbWarum starb ich nicht von Mutterleib an, kam aus dem Scho\u00df
  hervor und verschied?\u00ab (Hiob 3,11).\\n\\nDann f\u00e4hrt er fort:\\n\\n\u2026
  oder, wie eine verborgene Fehlgeburt, w\u00e4re ich nicht da, wie Kinder, die das
  Licht nicht erblickt haben. Dort lassen die Gottlosen ab vom Toben, und dort ruhen
  die an Kraft Ersch\u00f6pften (Hiob 3,16-17).\\n\\nHiob glaubte, dass es ihm weitaus
  besser ginge, wenn er als Fehl- oder Totgeburt zur Welt gekommen w\u00e4re.\\n\\nWenn
  er vor der Geburt gestorben w\u00e4re, w\u00fcrde er seiner Ansicht nach jetzt ein
  Leben f\u00fchren, das alles \u00fcbertr\u00e4fe, was das diesseitige Leben ihm
  zu bieten vermochte \u2013 ein Leben in der Gegenwart eines lebendigen Erl\u00f6sers
  (19,25).\\n\\nAls Hiob das sagte, hatte er schon wunderbare Zeiten kennengelernt.
  Als tadelloser und frommer Mann hatte er eine Familie mit sieben S\u00f6hnen und
  drei T\u00f6chtern. Er hatte Tausende von Schafen, Kamelen, Rindern und Eseln. Er
  f\u00fchrte ein gro\u00dfes Haus voller Besitzt\u00fcmer und mit vielen Knechten.
  Gott hatte in jeder Hinsicht \u00bbdas Werk seiner H\u00e4nde gesegnet\u00ab (siehe
  Hiob 1,1-3.10).\\n\\nHiob hatte aber auch die schlimmsten Zeiten erlebt: Seine Schaf-
  und Rinderherden waren geraubt und seine Knechte von marodierenden R\u00e4uberbanden
  erschlagen worden. Seine S\u00f6hne und T\u00f6chter waren alle von einem einst\u00fcrzenden
  Dach erschlagen worden. Er selbst wurde von schmerzenden Geschw\u00fcren geplagt,
  die ihn \u00bbvon seiner Fu\u00dfsohle bis zu seinem Scheitel\u00ab bedeckten (Hiob
  2,7).\\n\\nHiob wusste, dass ein Leben \u2013 selbst ein gutes, erf\u00fclltes Leben
  \u2013 immer gepr\u00e4gt ist von einem gewissen Ma\u00df an Kummer, schwierigen
  Entschl\u00fcssen, per\u00ads\u00f6n\u00ad lichen Konflikten, Naturkatastrophen,
  gro\u00dfen An\u00ad strengungen, harten Entscheidungen, den Schmerzen k\u00f6rperlicher
  Art und dem Auf und Ab der unterschiedlichsten Trends und Str\u00f6mungen. Ein Kind,\\n\\ndas
  stirbt, erlebt dagegen nichts als \u00bbRuhe\u00ab, f\u00fchrt ein Leben, das nicht
  gebrandmarkt und gekennzeichnet ist von irgendeiner Not, Bitterkeit, Schwierigkeit,
  Unterdr\u00fcckung oder Fessel. Er sagte also, dass demjenigen, der ins Paradies
  gelangt, nur Freiheit, Freude und \u00bbRuhe\u00ab zugeeignet werden (Hiob 3,18-26).\\n\\nIn
  seinen Schriften l\u00e4sst der K\u00f6nig Salomo ebenfalls anklingen, dass ein
  Totgeborenes oder eine Fehl\u00ad geburt die Ruhe des Paradieses genie\u00dft:\\n\\nWenn
  einer hundert S\u00f6hne zeugte und viele Jahre lebte, und der Tage seiner Jahre
  w\u00e4ren viele, und seine Seele s\u00e4ttigte sich nicht an Gutem, und auch w\u00fcrde
  ihm kein Begr\u00e4bnis zuteil, so sage ich: Eine Fehlgeburt ist besser daran als
  er. Denn in Nichtigkeit kommt sie, und in Finsternis geht sie dahin, und mit Finsternis
  wird ihr Name bedeckt; auch hat sie die Sonne nicht gesehen noch erkannt. Diese
  hat mehr Ruhe als jener. Und wenn er auch zweimal tausend Jahre gelebt und Gutes
  nicht gesehen h\u00e4tte, geht nicht alles an einen Ort? (Prediger 6,3-6).\\n\\nIm
  Grunde sagt auch Salomo, dass ein tot geborenes Kind \u00fcber eine Existenz verf\u00fcgt,
  die weit besser ist als die eines Menschen, der lange lebt \u2013 es sei denn, diese
  Person besitzt eine Seele, welche die G\u00fcte Gottes kennt und erf\u00e4hrt.\\n\\nSowohl
  im Buch Hiob als auch im Buch Prediger sind die Aussagen sehr klar: Die Fehlgeburt
  oder das Totgeborene geht in einen Zustand des Friedens ein \u2013 in eine Existenz
  also, die einem von Bosheit und Kummer dieser Welt gekennzeichneten Leben weit vorzuziehen
  ist.\\n\\nDieser Glaube ist von bekannten christlichen Theologen und Schreibern
  aller Zeiten ausgedr\u00fcckt worden. John Newton (1725-1807), der zum Verk\u00fcndiger
  des Evangeliums gewordene Sklavenh\u00e4ndler, schrieb mit \u00bbAmazing Grace\u00ab
  das wohl bekannteste geistliche Lied aller Zeiten und war von der obigen Wahrheit
  \u00fcberzeugt. Guten Freunden, deren kleines Kind gestorben war, schrieb er: \u00bbIch
  hoffe, Ihr seid beide wohl getr\u00f6stet \u00fcber den Tod Eures Kindes. Ich kann
  \u00fcber den Tod von Kleinkindern nicht traurig sein. Wie vielen St\u00fcrmen sind
  sie entkommen! Auch zweifle ich nicht an meinem pers\u00f6nlichen Urteil, dass sie
  zu den Erw\u00e4hlten der Gnade geh\u00f6ren.\u00ab 1\\n\\nJesus hielt viel von
  Kindern!\\n\\nWenn wir wirklich wissen wollen, wie Gott Kinder sieht, brauchen wir
  nur auf den Scho\u00df Jesu zu blicken.\\n\\nEines Tages rief Jesus ein kleines
  Kind zu sich, stellte es in die Mitte seiner J\u00fcnger und sagte daraufhin: \u00bbWahrlich,
  ich sage euch, wenn ihr nicht umkehrt wie die Kindlein, so werdet ihr nicht in das
  Reich der Himmel eingehen. Darum, wer irgend sich selbst\\n\\nerniedrigen wird wie
  dieses Kindlein, dieser ist der Gr\u00f6\u00dfte im Reich der Himmel; und wer irgend
  ein solches Kindlein aufnehmen wird in meinem Namen, nimmt mich auf\u00ab (Matth\u00e4us
  18,3-5).\\n\\nJesus hielt viel von der Stellung eines Kindes. Er sah in ihm ein
  Bild von Abh\u00e4ngigkeit und Vertrauen, den Geist der Unschuld und der Demut.
  Er sah darin einen Menschen, der gern wohlgef\u00e4llig und dankbar ist, der schnell
  seiner Liebe Ausdruck verleiht und flink auffasst bzw. dem gehorcht, was ihm aufgetragen
  wurde. So gebrauchte er ein Kind, um den J\u00fcngern gleichnishaft klarzumachen,
  was Abh\u00e4ngigkeit, Vertrauen, Demut, Liebe und Gehorsam sind. Ein Kind war f\u00fcr
  ihn die beste Illustration f\u00fcr einen erl\u00f6sten Gl\u00e4ubigen, der sich
  im Reich der Erretteten befand.\\n\\nJesus sagte auch: \u00bbSeht zu, dass ihr nicht
  eines dieser Kleinen verachtet; denn ich sage euch, dass ihre Engel in den Himmeln
  allezeit das Angesicht meines Vaters schauen, der in den Himmeln ist\u00ab (Matth\u00e4us
  18,10). Auf vielerlei Weise verglich Jesus das Gl\u00e4ubigwerden mit dem Kindwerden
  \u2013 das geistliche Wiedergeborenwerden des Gl\u00e4ubigen mit der Geburt eines
  Kindes, das nackt, \u00fcberhaupt nicht anma\u00dfend, \u00e4u\u00dferst verwundbar
  und abh\u00e4ngig von seinem Sch\u00f6pfer ist. Niemals machte sich Jesus \u00fcber
  jemanden lustig, der wie ein Kind zu seinem Vater schrie oder danach verlangte,
  von dem Vater besch\u00fctzt und geliebt zu werden, wie ein Kind sich nach Schutz
  und\\n\\nLiebe sehnt. Ja, \u00fcberall in der Bibel l\u00e4dt unser Herr uns ein,
  wie Kinder unter seine liebevolle F\u00fcrsorge zu fl\u00fcchten.\\n\\nJesus lehrte
  uns, mit besonderer Sorgfalt \u00fcber die geistlichen \u00bbKinder\u00ab in unserer
  Mitte zu wachen \u2013 genauso wie wir \u00fcber unsere leiblichen Kinder wa\u00ad
  chen w\u00fcrden. Wenn sie auf Abwege geraten, m\u00fcssen wir ihnen nachgehen.
  Wenn sie sich verlaufen, m\u00fcssen wir sie suchen und zur Herde zur\u00fcckf\u00fchren.
  Nie w\u00fcrden Eltern, die am Abendbrottisch eines ihrer sechs Kinder vermissen,
  hartherzig sagen: \u00bbNa gut, wir haben ja noch f\u00fcnf.\u00ab Nein, dann wird
  so lange gesucht, bis das vermisste Kind gefunden ist. Wir m\u00fcssen das mit den
  geistlich Unreifen genauso machen, wenn sie einem Irrtum folgen.\\n\\nSp\u00e4ter
  sagt Jesus in derselben Belehrung: \u00bbAlso ist es nicht der Wille eures Vaters,
  der in den Himmeln ist, dass eines dieser Kleinen verlorengehe\u00ab (Matth\u00e4us
  18,14). Die Analogie dieser Aussage ist unmissverst\u00e4ndlich. Jesus sagte damit,
  dass Gott genauso wenig ein geistliches Kind f\u00fcr ewig verlorengehen lassen
  will, wie er ein nat\u00fcrliches Kind ewig umkommen lassen will. Die geistliche
  Belehrung ist nur m\u00f6glich wegen der zugrunde liegenden Wahrheit der \u00bbnat\u00fcrlichen\u00ab
  Lehre. Die Analogie stimmt, und sie stimmt vollkommen, aber nur wegen der zugrunde
  liegenden Voraussetzung, dass Gott die Kleinen besch\u00fctzt und bewahrt, die in
  seine Gegenwart kommen. Dar\u00ad\\n\\num m\u00fcssen wir auch sorgf\u00e4ltig solche
  besch\u00fctzen und bewahren, die geistlicherweise als \u00bbkleine Kinder\u00ab
  ins Himmelreich eingehen.\\n\\nJesus wiederholte diese Lehre bei einer anderen Ge\u00ad
  legenheit, als er von vielen Menschen umgeben war, die ihm folgten und von ihm geheilt
  wurden. Einige aus der Volksmenge brachten ihre Kinder zu Jesus und baten ihn, er
  m\u00f6ge ihnen die H\u00e4nde auf\u00adlegen und f\u00fcr sie beten. Die J\u00fcnger
  wiesen diese Eltern zur\u00fcck, weil sie meinten, die Kinder seien nicht dieselbe
  Aufmerksamkeit und Anerkennung wert, die er ihrer Ansicht nach den Erwachsenen entgegenbrachte,
  besonders solchen, die in gro\u00dfer Not waren. Jesus hingegen wies seine J\u00fcnger
  zurecht, weil sie die Kinder fortgeschickt hatten. Er sagte: \u00bbLasst die Kindlein,
  und wehrt ihnen nicht, zu mir zu kommen; denn solcher ist das Reich der Himmel\u00ab
  (Matth\u00e4us 19,14; Markus 10,14; Lukas 18,16).\\n\\n\u00bbAber\u00ab, wenden
  Sie vielleicht ein, \u00bbJesus gebrauchte die Kinder nur als Vergleich daf\u00fcr,
  wie Erwachsene zum Glauben kommen und Anteil am Reich Gottes erlangen.\u00ab Da
  m\u00f6chte ich Ihnen schnell klarmachen, dass ein Vergleich nur funktioniert, wenn
  er auf Wahrheit beruht! W\u00fcrden die Kinder nicht gern und v\u00f6llig im Reich
  der Himmel angenommen werden, w\u00e4re der Vergleich mit einer Bekehrung im geistlichen
  Sinne \u00e4u\u00dferst d\u00fcrftig. Unter den gegebenen Umst\u00e4nden ist der
  Vergleich aber gro\u00dfartig! Kinder werden ohne Weiteres in das Reich aufgenommen,
  und daher ist es klug f\u00fcr uns, in unserer geistlichen Abh\u00e4ngigkeit vom
  Herrn wie Kinder zu werden, damit auch wir gern angenommen werden.\\n\\nIn der Darstellung
  dieser Geschichte, wie Markus sie schildert, lesen wir, dass Jesus seine J\u00fcnger
  folgenderma\u00dfen belehrte: \u00bbLasset die Kindlein zu mir kommen und wehret
  ihnen nicht; denn solcher ist das Reich Gottes\u00ab (Markus 10,14). Dann nahm Jesus
  die Kinder auf seine Arme, legte die H\u00e4nde auf sie und segnete sie (Markus
  10,16). Ich kenne keine Stelle im Neuen Testament, in der Jesus \u00bbUngl\u00e4ubige\u00ab
  segnete. Es gibt auch keine Stelle, in der Jesus die \u00bbVerfluchten\u00ab oder
  die \u00bbVerdammten\u00ab segnete oder unterschiedslos solche segnete, in denen
  vielleicht Gut und B\u00f6se in eigenartiger Mischung zusammenkam. Es waren wirkliche
  Kinder, die Jesus auf den Arm nahm, und er sagte zu ihnen: \u00bbSolcher ist das
  Himmelreich\u00ab (Markus 10,14). Jesus segnete die von seinen Armen Umschlossenen
  aus der Perspektive des Himmels. Sie wurden als zu den gesegneten Gerechten geh\u00f6rend
  angesehen, denen die ewige Heimat im Himmel zustand.\\n\\nDie J\u00fcnger lagen
  v\u00f6llig falsch mit der Annahme, dass es im himmlischen Reich \u00fcberhaupt
  keine Kinder gebe. Genau das Gegenteil ist der Fall. Der Himmel ist stark bev\u00f6lkert
  von Kindern, die im Mutterleib, bei der Geburt, kurz danach bzw. als kleine Kinder\\n\\nstarben,
  oder von solchen, die nie \u00fcber das geistige Entwicklungsstadium kleiner Kinder
  hinauskamen.\\n\\nJohannes Calvin schrieb in seinem Kommentar zu dieser Bibelstelle:
  \u00bbDiese kleinen Kinder hatten noch nicht einmal das Verst\u00e4ndnis, nach seiner
  Segnung zu verlangen, doch als sie ihm gebracht wurden, nahm er sie sanft und freundlich
  an und weihte sie in einem feierlichen Segnungsakt seinem Vater.\u00ab Darauf fuhr
  Calvin fort: \u00bbEs w\u00e4re zu grausam, dieses Alter von der erl\u00f6senden
  Gnade auszuschlie\u00dfen.\u00ab Er schrieb dann weiter, dass es eine Anma\u00dfung
  \u2013 ja, ein Sakrileg \u2013 sei, solche aus der Herde Christi zu vertreiben,
  die er auf seinem Scho\u00df liebkost hat, und die T\u00fcr vor solchen zu verschlie\u00dfen
  und sie als Fremde hinauszutreiben, von denen er nicht will, dass man ihnen verbietet,
  zu ihm zu kommen. 2\\n\\nDer gro\u00dfe presbyterianische Prediger des 19. Jahrhunderts,
  Charles Hodge, schrieb: \u00bbEr sagt uns: \u203aSolcher ist das Himmelreich\u2039,
  somit wird der Himmel in hohem Ma\u00df aus den Seelen erl\u00f6ster Kleinkinder
  bestehen.\u00ab\\n\\nCalvin und Hodge stehen nat\u00fcrlich mit ihrer Auslegung
  dieses Abschnitts nicht allein da. Ihre Kommentare geben nur wieder, was viele anerkannte
  Lehrer der Worte Christi im Laufe der Jahrhunderte geschrieben haben. Jesus sah
  unschuldige Kinder als solche an, die \u00f6ffentlich und von Herzen von seinem
  himmlischen Vater angenommen waren.\\n\\nGottes freundliche und liebevolle Haltung
  den Kindern gegen\u00fcber\\n\\nWelch ein Segen, dass wir aus der Heiligen Schrift
  von dem herzlichen Zugewandtsein Gottes des Va\u00ad ters zu seinen Kindern wissen!
  Wenn Sie an Ihr verstorbenes, allerliebstes Kindchen denken, dann sollten Sie in
  diesen Wahrheiten ruhen:\\n\\n1. Gott beansprucht das Besitzrecht f\u00fcr alle
  Kleinen aus jeder Kultur und Nation, aus jedem Stamm und Volk.\\n2. Gott zeigt immer
  Mitgef\u00fchl mit denen, die er als seine Unschuldigen betrachtet.\\n3. Unter gewissen
  Umst\u00e4nden zeigt Gott sein Mit\u00ad gef\u00fchl mit seinen Unschuldigen, indem
  er sie sterben l\u00e4sst und sie holt, damit sie in Ewigkeit bei ihm wohnen. Stattdessen
  erlaubt er ihnen nicht, auf dieser Erde weiterzuleben und vielleicht in der ewigen
  Verdammnis zu enden.\\n4. Alle Kinder, die sterben, leben f\u00fcr alle Ewigkeit
  in der Gegenwart des Herrn. Sie sind in ihrem Tod f\u00fcr immer gesegnet!\\n\\nWenn
  mein Kind nun aber nicht zu den Auserw\u00e4hlten geh\u00f6rt?\\n\\nSechs Worte
  ver\u00e4nderten Paulettes Leben f\u00fcr immer. Ihr zw\u00f6lfj\u00e4hriger Sohn
  Roger flog durch die Hintert\u00fcr in die K\u00fcche, wo sie gerade den Abwasch
  machte und schrie: \u00bbPeter ist in den Brunnen gefallen!\u00ab\\n\\nPaulette
  trocknete nicht einmal ihre H\u00e4nde ab. Schnell rannte sie hinter ihrem Sohn
  her nach drau\u00dfen, w\u00e4hrend sie ihrer Tochter Maggie zurief: \u00bbRuf deinen
  Vater. Er arbeitet gerade im hinteren Teil des Grundst\u00fccks.\u00ab\\n\\nAuf
  dem ganzen Weg zum Brunnen merkte Paulette, wie sie immer nur das Gleiche sprach:
  \u00bbNein \u2026 nein \u2026 nein \u2026 Nicht noch einmal! Nein \u2026 nein \u2026
  nein \u2026 Nicht noch einmal!\u00ab\\n\\nEs war vor drei Jahren, als sie und ihre
  Familie sich einen Tag Freizeit g\u00f6nnten. Ihre Arbeiten in der Landwirtschaft
  nahmen sie sonst fast jeden Tag des Jahres achtzehn Stunden lang in Anspruch. Sie
  waren zum Spruce Creek gefahren, um dort im Freien zu essen und einen Tag lang zu
  fischen. Der Spruce Creek war hoch oben in den Bergen, ungef\u00e4hr eine Autostunde
  entfernt. Manchmal schien der schnell flie\u00dfende Bergbach von Forellen \u00fcberzuquellen.
  Es hie\u00df, jetzt sei es wieder einmal so weit. So packten Paulette und George,
  ihr Mann, den Picknickkorb, steckten ihre\\n\\nFamilie, drei Jungen und zwei M\u00e4dchen,
  in den alten Truck, und ab ging''s in die Berge. George hoffte auf ein gutes Fischessen
  am Abend f\u00fcr die ganze Familie.\\n\\nUnd tats\u00e4chlich, die Fische bissen
  an. Zwei der drei Jungen \u2013 Roger und Bill \u2013 hatten die \u00fcbrigen Familienmitglieder
  verlassen und liefen ein wenig weiter stromaufw\u00e4rts. \u00bbSeid vorsichtig\u00ab,
  rief Paulette ihnen nach. \u00bbManche der Felsen sind sehr glitschig. Und bleibt
  in Sichtweite!\u00ab\\n\\nDie Jungen taten, was ihnen gesagt war, und Paulette konnte
  sie durch das Buschwerk hindurch, gut f\u00fcnfzehn Meter entfernt, sehen, wie sie
  ihre Angeln in den Bach warfen. Gelegentlich konnte sie die Freudenschreie h\u00f6ren,
  wenn sie einen Fisch an Land zogen.\\n\\nNach Rogers Aussage \u2013 damals neun
  Jahre alt \u2013 war es ein glatter Felsen, der die Katastrophe ausl\u00f6ste. Billy
  \u2013 gerade erst sieben \u2013 hatte vor, von der anderen Seite des Baches her
  zu angeln. Als er den Bach auf einem \u00fcber das Wasser gefallenen Baumstamm \u00fcberquerte,
  glitt er aus und fiel ins Wasser. Sein linker Fu\u00df wurde zwischen zwei Felsbrocken
  eingeklemmt. Mit gro\u00dfer M\u00fche konnte er seinen Kopf \u00fcber Wasser halten,
  um seinen Bruder um Hilfe zu rufen. Dabei versuchte er, seinen Fu\u00df von den
  Steinen freizubekommen. Roger sah, was passiert war, und eilte ihm schnell zur Hilfe.
  In k\u00fcrzester Zeit war Bills Fu\u00df frei, aber durch das Zerren und Schieben
  an den Brocken hatten sich zwei ziemlich gro\u00dfe Fels\u00ad\\n\\nst\u00fccke
  vom Flussbett gel\u00f6st. Einer drehte sich herum, wobei er Billy am Kopf traf.
  Billy brach zusammen und versank. Danach begann sein K\u00f6rper unkontrolliert
  abw\u00e4rtszutreiben, von der schnellen Str\u00f6mung an dieser Stelle des Baches
  mitgerissen. Sein Kopf wurde noch gegen mehrere andere Felsbrocken geschleudert,
  w\u00e4hrend er bewusstlos auf dem Bach trieb. Unterdessen versuchte Roger hilfeschreiend,
  am Ufer entlangzurennen und auf gleicher H\u00f6he zu bleiben. Inzwischen war George
  stromaufw\u00e4rts an die Ungl\u00fccksstelle gelangt, und schlie\u00dflich gelang
  es ihm und Roger, Bills K\u00f6rper aus dem Bach zu ziehen. Es gab keine Lebenszeichen
  mehr.\\n\\nDas Ganze passierte in weniger als f\u00fcnf Minuten und hatte doch ihr
  Leben f\u00fcr immer ver\u00e4ndert.\\n\\nWas als ein gl\u00fccklicher, unbek\u00fcmmerter,
  von Lachen erf\u00fcllter Familienausflug begann, wurde zu einem der dunkelsten
  Tage in Paulettes Leben. Die anderen Kinder, Peter (damals erst drei) und ihre Zwillingst\u00f6chter
  Maggie und Maddie (f\u00fcnf Jahre alt), konnten nicht begreifen, warum ihr \u00e4lterer
  Bruder Billy sich nicht r\u00fchrte und in den Armen seiner Mutter lag, die auf
  dem R\u00fccksitz Platz genommen hatte. George fuhr wie ein Verr\u00fcckter die
  Berge hinab zum Krankenhaus. Dort hoffte er gegen alle Hoffnung, Billy k\u00f6nnte
  durch irgendein Wunder medizinischer Kunst wieder zum Leben erweckt werden. Paulette
  hielt den K\u00f6rper ihres kleinen Sohnes, weinte still\\n\\nund wusste tief in
  ihrem Herzen, dass ihr Sohn diese Welt f\u00fcr immer verlassen hatte.\\n\\nJetzt
  h\u00f6rte sie wieder Rogers irres Geschrei um Hilfe. Sie erreichte den Brunnen
  und sah gleich, dass der h\u00f6lzerne Deckel v\u00f6llig verrottet war. Sie konnte
  sich leicht vorstellen, dass sich Peter daraufgestellt hatte, um das verknotete
  Seil zu entwirren, an dem der Sch\u00f6pfeimer hing, weil er ihr \u00bbhelfen\u00ab
  wollte, Wasser in die K\u00fcche zu bringen. Vielleicht war er hochgesprungen, um
  den Eimer zu erreichen, und als er herunterkam, gaben die verrotteten Bretter des
  Deckels unter seinem Gewicht nach. Schnell nahm sie die restlichen Bretter des Deckels
  fort und in das Brunnen\u00adinnere hineinzurufen. Doch aus der Dunkelheit da unten
  kam kein Laut.\\n\\nDer Arzt sagte ihr sp\u00e4ter, Peter h\u00e4tte \u00fcberhaupt
  nichts mitgekriegt von dem, was geschehen war. Die L\u00f6cher an seinem Kopf bewiesen
  klar, dass sein Kopf sehr heftig auf die Bretter geschlagen sei und dann noch gegen
  die Steinw\u00e4nde des Brunnens, ehe er unten ins Wasser fiel. Er hatte vom Eintauchen
  ins Wasser nichts mehr gemerkt. \u00bbUnfalltod durch Ertrinken\u00ab stand in der
  amtlichen Sterbeurkunde. Das waren dieselben Worte, die Billys Tod drei Jahre zuvor
  beschrieben hatten.\\n\\nTagelang sa\u00df Paulette in ihrem gro\u00dfen Schaukelstuhl
  im Wohnzimmer und hielt ihr Baby, Eddie, in den Armen, das erst acht Monate alt
  war. Gelegentlich\\n\\nstand sie auf, um bei der Versorgung ihres damals dreij\u00e4hrigen
  T\u00f6chterchens Annie zu helfen. Immer konnte sie nur denken: \u00bbWerde ich
  wohl noch ein Kind verlieren?\u00ab Die Furcht und Angst waren zeitweise fast zu
  \u00fcberm\u00e4chtig.\\n\\nZu anderen Zeiten weinte sie vor Kummer \u2013 und Schuldgef\u00fchlen:
  \u00bbWas ist das f\u00fcr eine Frau, die sieben Kinder zur Welt bringt und zwei
  davon ertrinken l\u00e4sst?\u00ab Immer wieder lie\u00df sie in ihrem Kopf die beiden
  Erlebnisse von Neuem ablaufen und stellte sich unter heftigen Selbstvorw\u00fcrfen
  und Selbstanklagen immer die gleichen \u00bbWas-w\u00e4re-wenn\u00ab-Fragen: \u00bbWas
  w\u00e4re gewesen, wenn ich den Jungen verboten h\u00e4tte, weiter oben zu fischen?\u00ab
  \u00bbWas w\u00e4re, wenn ich gesagt h\u00e4tte, sie sollten den Bach nicht \u00fcberqueren?\u00ab
  \u00bbWas w\u00e4re, wenn ich den Brunnen mit einem neuen Deckel verschlossen h\u00e4tte?\u00ab
  \u00bbWas w\u00e4re, wenn ich Peter nicht erlaubt h\u00e4tte, an jenem Nachmittag
  drau\u00dfen zu \u203aspielen\u2039?\u00ab Sie ging so weit, sich zu fragen, ob
  es richtig war, einen Bauern zu heiraten und nicht jenen Stadtmenschen, der ihr
  den Hof gemacht hatte.\\n\\nEines Tages kam der Pastor zu Besuch, und Paulette sagte
  ihm, sie hielte sich f\u00fcr eine schlechte Mutter. Der Pastor versicherte ihr
  wiederholt, sie sei eine der besten M\u00fctter, die er je kennengelernt habe. Als
  er merkte, dass er nicht bis zu ihrem Herzen vordrang, fragte er schlie\u00dflich:
  \u00bbPaulette, wenn du dich un\u00ad bedingt als eine schlechte Mutter sehen willst,
  dann\\n\\nwill ich dich fragen: Was tust du denn dagegen, eine b\u00f6se Mutter
  zu sein?\u00ab\\n\\n\u00bbWas kann ich denn machen?\u00ab, fragte Paulette.\\n\\n\u00bbNun,
  du k\u00f6nntest beten und Gott bitten, dir all dasjenige zu vergeben, was du deiner
  Meinung nach in der Vergangenheit eventuell falsch gemacht hast.\u00ab\\n\\nPaulette
  l\u00e4chelte und sagte: \u00bbDas muss ich tun! Willst du mit mir beten?\u00ab
  Und gleich dort, in ihrem Wohnzimmer, beteten sie. Paulette erhob sich aus ihrem
  Schaukelstuhl und kehrte in den n\u00e4chsten zwanzig Jahren nur selten dorthin
  zur\u00fcck.\\n\\nNur einmal noch traten diese schrecklichen Ereignisse wieder hart
  ins Bewusstsein, als sie zwei Frauen in der Gemeindek\u00fcche zuf\u00e4llig miteinander
  reden h\u00f6rte. Die beiden wussten nicht, dass Paulette ihr Gespr\u00e4ch hinter
  der offenen T\u00fcr mitbekam. Die eine sagte in etwa: \u00bbNat\u00fcrlich geh\u00f6rt
  nicht jedes Kind zu den Auserw\u00e4hlten. Denk doch nur an die beiden Williams-Jungen.
  Gott lie\u00df sie sterben, als Billy gerade sieben und Peter sechs Jahre alt war.
  Beide hatten nie die Chance, Jesus als Retter anzunehmen.\u00ab\\n\\n\u00bbAber
  glaubst du denn, sie seien in die H\u00f6lle gekommen?\u00ab, fragte die andere
  Frau.\\n\\n\u00bbWohin denn sonst?\u00ab, antwortete die Erste.\\n\\nPaulette war
  zu konsterniert, um in die K\u00fcche gehen und den Frauen entgegentreten zu k\u00f6nnen.
  Stattdessen lief sie fort, rief ihre Kinder eiligst zusammen, fand\\n\\ndann auch
  George und dr\u00e4ngte darauf, so schnell wie m\u00f6glich nach Hause zu gelangen.
  Sie erfand gen\u00fcgend Ausreden, um die n\u00e4chsten Sonntage nicht zu den Gottesdiensten
  der Gemeinde zu kommen.\\n\\nDer Pastor vermisste sie und fuhr wieder zu ihrer Farm.
  Nachdem er sie gefragt hatte, warum sie nun schon drei Wochen nicht zur Gemeinde
  gekommen sei, sprudelte aus ihr heraus, was sie belauscht hatte.\\n\\n\u00bbWo meinst
  du denn, dass die Jungen sind?\u00ab, fragte der Pastor.\\n\\n\u00bbSie sind im
  Himmel bei Jesus\u00ab, sagte Paulette, ohne einen Augenblick zu z\u00f6gern. \u00bbIch
  glaube das nicht nur, ich wei\u00df das.\u00ab Dabei zeigte sie auf ihr Herz und
  f\u00fcgte hinzu: \u00bbIch wei\u00df es einfach hier.\u00ab\\n\\nDer Pastor antwortete:
  \u00bbIch meine auch, dass die Jungen dort sind.\u00ab\\n\\nWas der Pastor Paulette
  nicht sagte, war, dass er auf dem ganzen Heimweg ein angespanntes Gespr\u00e4ch
  mit Gott hatte. Er bat Gott, ihm zu zeigen, ob seine Antwort an Paulette wirklich
  der Wahrheit entsprach. Wo w\u00fcrde Gott dieses Gebet erh\u00f6ren? Wie wir gesehen
  haben, in der Bibel. Wie viele Pastoren haben schon gesagt, was \u00bbgef\u00fchlsm\u00e4\u00dfig
  notwendig\u00ab war, nur um sp\u00e4ter zu fragen, ob es tats\u00e4chlich stimmte.
  Es war, was die trauernde Mutter h\u00f6ren wollte; aber war es das, was Gott ihr
  sagen wollte? Zum Gl\u00fcck verinnerlicht ein Diener des Herrn, der\\n\\nden Herrn
  gut kennt und von seinem Geist erf\u00fcllt ist, auch zunehmend das Mitgef\u00fchl
  des Herrn \u2013 darum stimmt das, was ihm instinktiv als wahr erscheint, letztendlich
  auch v\u00f6llig mit Gottes Wort \u00fcberein.\\n\\nAntworten f\u00fcr das fragende
  Herz\\n\\nPaulettes Erfahrungen weisen auf eine Anzahl von Themen hin, die im Kern
  mit der Frage zusammenh\u00e4ngen, warum kleine Kinder sofort in Gottes Armen in
  Sicherheit sind.\\n\\nEinige teilen diese Kinder in Erw\u00e4hlte und NichtErw\u00e4hlte
  ein, weil sie die klare und unzweideutige biblische Lehre von der g\u00f6ttlichen
  Auserw\u00e4hlung be\u00ad kr\u00e4ftigen wollen. Damit wird gesagt, dass Gott diejenigen
  erw\u00e4hlt, die sich vor S\u00fcnde und H\u00f6lle retten lassen und auf ewig
  im Himmel leben werden. Die Bibel lehrt klar, dass Gott vor ewigen Zeiten Menschen
  zur Errettung erw\u00e4hlt hat und dass diese Erw\u00e4hlung durch Gnade, und nur
  durch Gnade, geschieht. Niemandem also, der durch Glauben errettet wird, ist dies
  daher auf irgendeine andere Weise m\u00f6glich als durch Gottes Auserw\u00e4hlung
  gem\u00e4\u00df dieser Gnade:\\n\\nGepriesen sei der Gott und Vater unseres Herrn
  Jesus Christus, der uns gesegnet hat mit jeder geistlichen Segnung in den himmlischen
  \u00d6rtern in Christus, wie er uns auserw\u00e4hlt hat in ihm vor Grundlegung der
  Welt, dass wir heilig und tadellos seien vor ihm in Liebe, und zuvorbestimmt hat
  zur Sohnschaft durch Jesus Christus f\u00fcr sich selbst nach dem Wohlgefallen seines
  Willens, zum Preise der Herrlichkeit seiner Gnade, worin er uns begnadigt hat in
  dem Geliebten (Epheser 1,3-6).\\n\\nFinden wir eine biblische Grundlage f\u00fcr
  den Glauben, dass alle Menschen, die als kleine Kinder sterben, als g\u00f6ttlich
  Erw\u00e4hlte in den Himmel kommen? Ich glaube wohl!\\n\\nHoffentlich halten Sie
  sich genau und sorgf\u00e4ltig an die biblischen Aussagen, die auf den n\u00e4chsten
  Seiten dargelegt werden. Viele Menschen lassen sich eine schnelle Zusicherung geben
  und finden vor\u00ad \u00fcber\u00adgehend Trost anhand der Aussage: \u00bbDein
  Baby ist im Himmel.\u00ab F\u00fcr andere gilt das nicht. Eine Erkl\u00e4rung im
  Blick darauf, warum dies stimmt, ist f\u00fcr sie und langfristig gesehen sogar
  f\u00fcr die oberfl\u00e4chlich Getr\u00f6steten von entscheidender Bedeutung. F\u00fcr
  sie alle habe ich die folgenden Ausf\u00fchrungen erarbeitet.\\n\\nBiblische Wahrheit
  Nr. 1: Alle Kinder sind als S\u00fcnder empfangen und geboren worden.\\n\\nWenn
  wir wirklich der Frage nachgehen wollen, wer \u00bberw\u00e4hlt\u00ab ist und wer
  nicht, m\u00fcssen wir mit der Tatsache beginnen, dass alle Menschen als S\u00fcnder
  empfangen und geboren wurden. Ich wei\u00df: Es ist in Trauerzeiten nicht leicht,
  sich diesem Thema zu stellen; aber wir d\u00fcrfen es nicht ausblenden.\\n\\nEs
  ist ein weitverbreiteter Glaube \u2013 auch wenn er schon vor 1600 Jahren als Ketzerei
  verdammt wurde \u2013, dass alle Menschen ohne S\u00fcnde geboren werden. Nach dieser
  Anschauung wird jede Seele gleichsam als moralisch reines Blatt geboren und die
  S\u00fcnde schl\u00e4gt im Leben eines Menschen erst Wurzeln, wenn er sich willentlich
  aufs S\u00fcndigen einl\u00e4sst. Wer dieser Lehre anh\u00e4ngt, gibt zu, dass sich
  kleine Kinder nicht absichtlich f\u00fcr die S\u00fcnde entscheiden k\u00f6nnen.
  Ein Kind, das stirbt, bevor es s\u00fcndigen kann, ist automatisch ein Himmelskandidat.
  Kurz gesagt: Ein s\u00fcnd\u00ad loses Kind geht in eine s\u00fcndlose Ewigkeit.\\n\\nDiese
  Irrlehre wurde von jedem kirchlichen Konzil zu Recht verdammt, das sich mit dieser
  Frage besch\u00e4ftigte. Trotzdem hat dieser Glaube in einigen Kreisen bis heute
  \u00fcberlebt.\\n\\nDie Bibel sagt klar und deutlich, dass alle Kinder von ihrer
  Empf\u00e4ngnis an in S\u00fcnden geboren sind. Das Prinzip der S\u00fcnde ist in
  das Herz jedes menschlichen Wesens eingebettet. Jeder Mensch ist moralisch verdorben
  und wird mit einem unwiderstehlichen Hang zum B\u00f6sen geboren. Die Ansicht, ein
  Baby sei moralisch neutral und werde ohne jegliche Neigung zur S\u00fcnde geboren,
  hat die Heilige Schrift gegen sich. Wenn die Bibel kleine Kinder \u00bbunschuldig\u00ab
  nennt, bedeutet das nicht, dass sie keine gefallenen Wesen und nicht von der Schuld
  befleckt sind, die wir alle von Adam ererbt haben (R\u00f6mer 5,1-19).\\n\\nW\u00e4ren
  kleine Kinder nicht s\u00fcndig oder nicht moralisch verdorben, w\u00fcrden sie
  \u00fcberhaupt nicht sterben! W\u00e4ren Babys v\u00f6llig s\u00fcndlos und ohne
  Verdorbenheit geboren, g\u00e4be es keinen Grund daf\u00fcr, dass sie sterben m\u00fcssten.
  Die Bibel sagt ganz klar: \u00bbDer Lohn der S\u00fcnde ist der Tod, die Gnadengabe
  Gottes aber ewiges Leben\u00ab (R\u00f6mer 6,23; Hervorhebung durch den Autor).
  Die S\u00fcnde richtet das Leben zugrunde und zerst\u00f6rt es. Allein schon die
  Tatsache, dass Babys \u00fcberhaupt sterben, best\u00e4tigt die Wahrheit, dass S\u00fcnde
  in ihnen ist \u2013 die Krankheit der innewohnenden s\u00fcndigen Natur tr\u00e4gt
  den Keim des Todes in sich.\\n\\nAu\u00dferdem: Kennen Sie irgendeinen Erwachsenen
  \u2013 au\u00dfer Jesus Christus \u2013, der sich jemals zu einem Zeitpunkt seines
  fr\u00fchen Lebens daf\u00fcr entschied, nicht zu s\u00fcndigen? Ein solcher Mensch
  ist niemals \u00fcber diese Erde gegangen! Jeder hat eine automa\u00ad tische Neigung,
  einen \u00bbHang\u00ab, gegen Gott zu rebellieren, genauso wie Adam und Eva gegen
  ihn auf\u00ad begehrt haben. Der rebellische Geist regiert in jedem menschlichen
  Herzen \u2013 in einigen sehr offensichtlich und grob, in anderen feiner und verborgener;
  aber er wohnt nichtsdestoweniger in allen.\\n\\nJedes Kind, das so lange lebt, dass
  es eine verantwortliche Wahl treffen kann, wird sich f\u00fcr die S\u00fcnde entscheiden.
  Das liegt in seiner Natur.\\n\\nZahllose Stellen in der Bibel unterstreichen diese
  Wahrheit:\\n\\n* Sie s\u00fcndigen gegen dich (denn da ist kein Mensch, der nicht
  s\u00fcndigt) (1. K\u00f6nige 8,46).\\n* Siehe, in Ungerechtigkeit bin ich geboren,
  und in S\u00fcnde hat mich meine Mutter empfangen (Psalm 51,7).\\n* Abgewichen sind
  die Gesetzlosen von Mutterscho\u00df an, es irren von Mutterleib an die L\u00fcgenredner
  (Psalm 58,4).\\n* Vor dir ist kein Lebendiger gerecht (Psalm 143,2).\\n* Wer darf
  sagen \u00bbIch habe mein Herz gereinigt, ich bin rein geworden von meiner S\u00fcnde\u00ab?
  (Spr\u00fcche 20,9).\\n* Denn unter den Menschen ist kein Gerechter auf Erden, der
  Gutes tut und nicht s\u00fcndigt (Prediger 7,20).\\n* Arglistig ist das Herz mehr
  als alles; wer mag es kennen? (Jeremia 17,9).\\n* Da ist kein Gerechter, auch nicht
  einer; da ist keiner, der verst\u00e4ndig ist; da ist keiner, der Gott sucht. Alle
  sind abgewichen, sie sind allesamt untauglich geworden; da ist keiner, der Gutes
  tut; da ist auch nicht einer (R\u00f6mer 3,10-12).\\n* Auch wir (waren) einst \u2026
  von Natur Kinder des Zorns (Epheser 2,3).\\n* Ich wusste, \u2026 dass man dich von
  Mutterleib an einen \u00dcbertreter genannt hat (Jesaja 48,8).\\n* Das Dichten und
  Trachten des menschlichen Herzens ist b\u00f6se von seiner Jugend an (1. Mose 8,21).\\n\\nDie
  ganze Heilige Schrift k\u00fcndet un\u00fcberbietbar deutlich von der S\u00fcndhaftigkeit
  der Menschheit! Die Bibel sagt deutlich, dass wir \u00bbin Ungerechtigkeit geboren\u00ab
  sind (Psalm 51,7). Wir tragen also alle die Flecken der Erbs\u00fcnde an uns. Wir
  sind S\u00fcnder von Geburt an.\\n\\nAls David das oben Erw\u00e4hnte schrieb (\u00bbIn
  S\u00fcnde hat mich meine Mutter empfangen\u00ab), meinte er genau das, was er sagte.
  Er wollte nicht andeuten, dass an der Geburt eines Kindes selbst etwas S\u00fcndiges
  sei, genauso wenig, dass einem Kind aufgrund der k\u00f6rperlichen oder sexuellen
  Vorg\u00e4nge in Zusammenhang mit der Empf\u00e4ngnis die S\u00fcnde irgendwie anhaftet.
  Beide Eltern m\u00f6gen dreiste S\u00fcnder und ihre sexuelle, zur Empf\u00e4ngnis
  f\u00fchrende Beziehung mag ebenfalls s\u00fcndig sein, doch davon wird dem Kind
  nichts anh\u00e4ngen. W\u00e4re das so, dann w\u00e4ren Kinder gerechter, verheirateter
  Eltern s\u00fcndlos \u2013 und das ist ganz und gar nicht der Fall. Vielmehr erkl\u00e4rt
  die Bibel, dass wir alle von der Empf\u00e4ngnis und von Geburt an S\u00fcnder sind,
  weil es unsere Natur als mensch\u00adliche Wesen ist, S\u00fcnder zu sein. Diese
  s\u00fcndige Natur ist das Ergebnis des S\u00fcndenfalls im Garten Eden. Wir alle
  haben die s\u00fcndige Natur von unseren ersten Vorfahren, Adam und Eva, geerbt.\\n\\nDas
  S\u00fcndigsein ist nicht ein Zustand, in den Leute geraten, die alt genug sind,
  selbstst\u00e4ndig eine Wahl zu treffen oder Entscheidungen zu f\u00e4llen. Es ist
  ein Zustand, in dem sich jeder Mensch schon vor der Ge\u00ad\\n\\nburt befindet.
  Dieser Zustand bringt die s\u00fcndigen Entscheidungen hervor. Jede Empf\u00e4ngnis
  ruft ein s\u00fcndiges Leben ins Dasein. Jeder Mensch, der seit Adam und Eva geboren
  wurde, betritt die Erde im Stand eines S\u00fcnders. Der Apostel Paulus schrieb:
  \u00bbDurch des einen Menschen Ungehorsam (sind) die Vielen in die Stellung von
  S\u00fcndern gesetzt worden\u00ab (R\u00f6mer 5,19).\\n\\nWeil wir als S\u00fcnder
  geboren wurden, haben wir alle n\u00f6tig, \u00bbvon Neuem geboren\u00ab zu werden,
  wenn wir die Erneuerung unserer geistlichen Natur erleben wollen. Paulus schrieb
  auch: \u00bb\u2026 auf dass, gleichwie die S\u00fcnde geherrscht hat im Tod, so
  auch die Gnade herrsche durch Gerechtigkeit zu ewigem Leben durch Jesus Christus,
  unseren Herrn\u00ab (R\u00f6mer 5,21). W\u00e4ren wir nicht als S\u00fcnder geboren,
  brauchten wir keine Errettung. Die Wahrheit aber lautet: \u00bbAlle haben ges\u00fcndigt
  und erreichen nicht die Herrlichkeit Gottes\u00ab, sodass alle \u00bbumsonst gerechtfertigt
  (werden m\u00fcssen) durch seine Gnade, durch die Erl\u00f6sung, die in Christus
  Jesus ist\u00ab (R\u00f6mer 3,23-24).\\n\\nJedes Kind, das empfangen wurde, tr\u00e4gt
  den t\u00f6dlichen \u00bbS\u00fcndenvirus\u00ab in sich. Es wird geboren mit der
  Anlage zu unreinen Motiven, Bestrebungen, Haltungen, Begierden und Zielsetzungen
  in seinem Herzen.\\n\\nSo k\u00f6nnen wir nicht sagen, verstorbene Babys k\u00e4men
  in den Himmel, weil sie \u00bbs\u00fcndlos\u00ab sind, sondern Babys kommen in den
  Himmel, weil Gott gn\u00e4dig ist.\\n\\nBiblische Wahrheit Nr. 2: Die Errettung
  jedes Menschen ist Angelegenheit der g\u00f6ttlichen Gnade und nicht Menschenwerk.
  Es f\u00e4llt nicht leicht, Babys als S\u00fcnder zu betrachten; aber es stimmt.
  Die gute Nachricht ist allerdings, dass Babys, die sterben, gerettet sind. Und sie
  werden durch das einzige Mittel gerettet, durch das \u00fcberhaupt jemand gerettet
  werden kann: durch die Gnade Gottes.\\n\\nHier muss ich einf\u00fcgen, dass es zahlreiche
  christ\u00ad liche F\u00fchrungspers\u00f6nlichkeiten gibt, die behaupten, dass
  wir Menschen gewisse Dinge erf\u00fcllen m\u00fcssen, um die Rettung der Babys sicherzustellen.
  Keine dieser Ansichten steht im Einklang mit der Wahrheit des Wortes Gottes. Ich
  will sie kurz ansprechen, weil Sie als trauerndes Elternteil oder als leidtragender
  Familienangeh\u00f6riger mit ihnen in Ber\u00fchrung kommen k\u00f6nnen.\\n\\nIn
  der Kirchengeschichte hat es die Ansicht ge\u00adgeben, dass Kinder nach dem Tod
  noch die Gelegenheit erhalten, zu Christus zu kommen. Diese Position findet auch
  unter zeitgen\u00f6ssischen Theologen wachsende Anerkennung. Sie behaupten, dass
  alle Menschen, ganz gleich in welchem Alter sie sterben, nach dem Tod Gelegenheit
  bekommen, Christus als ihren Retter anzuerkennen. Obwohl dies f\u00fcr manche ein
  trostreicher Gedanke sein mag, findet er keinerlei Unterst\u00fctzung in der Heiligen
  Schrift. Nach Hebr\u00e4er 9,27 \u00bbist es den Menschen gesetzt, einmal zu sterben,
  danach\\n\\naber das Gericht\u00ab. Der Gedanke an eine \u00bbzweite Chance\u00ab
  ist ein Produkt der menschlichen Einbildung \u2013 \u00e4hnlich der mittelalterlichen
  Idee, gestorbene Babys k\u00e4men als Gl\u00fchw\u00fcrmchen zur\u00fcck.\\n\\nAndere
  behaupten, dass Babys gerettet sind, wenn sie getauft werden. Die Vertreter dieser
  Ansicht glauben, dass Gott Babys seine Gnade erweist, dabei aber nur getaufte Babys
  im Blick hat. Der Katechismus einer Konfession sagt \u00fcber die Kindertaufe Folgendes:
  \u00bbDie Taufe bewirkt Vergebung der S\u00fcnden, errettet von Tod und Teufel und
  gibt allen ewiges Heil, die glauben, was das Wort der Verhei\u00dfung Gottes sagt.\u00ab\\n\\nEiner
  der fr\u00fchen Kirchenlehrer glaubte, dass getaufte Kinder in den Himmel gelangen,
  w\u00e4hrend un\u00adgetaufte nicht hineinkommen, obwohl er ausdr\u00fccklich er\u00adkl\u00e4r\u00ad
  \u00adte, dass ungetaufte Kleinkinder gegen die Pein der H\u00f6lle immun w\u00e4ren.
  Die Wahrheit ist: Die Taufe kann niemanden erretten. Sie ist ein Ritus, der in der
  Heiligen Schrift ganz deutlich als ein Gehorsamsakt eingesetzt wurde, um zu bezeugen,
  dass man von sich aus bereit ist, dem Evangelium zu glauben \u2013 was kleine Kinder
  unm\u00f6glich tun k\u00f6nnen.\\n\\nDie Lutherische \u00bbAugsburger Konfession\u00ab
  sagt von der Taufe: Die Lutheraner lehren, dass \u00bbsie [die Taufe] notwendig
  (ist) zum Heil, da auch durch die Taufe die Gnade Gottes dargeboten wird. Folglich
  m\u00fcssen auch bereits die Kinder getauft werden, weil sie\\n\\nin die Gnade Gottes
  durch die Taufe aufgenommen werden.\u00ab Diese Meinung vertreten auch die Katholiken,
  Anglikaner, Episkopalen und einige reformierte Gruppen. Das Konzil von Trient gr\u00fcndete
  im Jahre 1563 die Errettung kleiner Kinder auf die r\u00f6mischkatholische Taufe.
  1951 lehrte Papst Pius XII., dass \u00bbes au\u00dfer der Taufe keinen anderen Weg
  gibt, den kleinen Kindern das Leben Christi zuzueignen.\u00ab Der r\u00f6mischkatholische
  Katechismus lehrt: \u00bbDurch die christ\u00adliche Taufe gelangt man in das Reich
  Gottes und in den Geltungsbereich des rettenden Werkes Christi.\u00ab\\n\\nTats\u00e4chlich
  aber gibt es in der Heiligen Schrift kein Beispiel f\u00fcr die Kindertaufe und
  darum auch keine \u00c4u\u00dferung dar\u00fcber, was sie bewirken k\u00f6nnte.
  Doch noch immer meinen viele Menschen, getaufte Babys seien errettet und ungetaufte
  nicht.\\n\\nDas w\u00fcrde nat\u00fcrlich die Errettung von menschlichen \u00bbWerken\u00ab
  abh\u00e4ngig machen \u2013 dem Werk der Taufe \u2013 und nicht von der Gnade. Eine
  solche Betrachtungsweise vertraut nicht auf die Gnade Gottes. Auch gibt es nach
  Meinung derjenigen, die diese Ansicht vertreten, kein anderes Mittel, der Seele
  eines ungebore\u00ad nen Kindes das Heil zuzueignen, das durch Fehl\u00ad geburt
  zu Tode kam oder abgetrieben wurde.\\n\\nAndere behaupten Folgendes: Weil alle Babys
  von Natur aus s\u00fcndig geboren sind und weil sie keine Gelegenheit haben, an
  Jesus Christus zu glauben, Bu\u00dfe zu tun und Gott um Gnade anzuflehen, sind\\n\\ndiese
  Kinder ausnahmslos zur H\u00f6lle verdammt. Ich habe dieses Argument in den letzten
  Jahren immer h\u00e4ufiger geh\u00f6rt.\\n\\nDie Logik hinter dieser Ansicht ist
  diese: Alle Babys sind s\u00fcndig, alle S\u00fcnder verdienen die H\u00f6lle; darum
  kommen alle Babys, die in ihrem s\u00fcndigen Zustand sterben, in die H\u00f6lle.\\n\\nMan
  beschuldigte einmal den ber\u00fchmten calvinistischen Theologen und Prediger Charles
  H. Spurgeon, er bef\u00fcrworte eine Theologie, die kleine Kinder in die H\u00f6lle
  verwiese. Spurgeons Antwort lautete:\\n\\nZu den groben L\u00fcgen, die gegen die
  calvinistischen Lehren vorgebracht werden, geh\u00f6rt auch die b\u00f6sartige Verleumdung,
  wir glaubten an die Verdammnis kleiner Kinder. Eine niedertr\u00e4chtigere L\u00fcge
  ist nie ge\u00e4u\u00dfert worden. In irgendeiner Ecke der Welt mag ein B\u00f6sewicht
  ausgestreut haben, dass in der H\u00f6lle kleine Kinder sind; aber ich bin ihm nie
  begegnet und kenne auch keinen, der einen solchen Menschen gesehen hat.\\n\\nIn
  Bezug auf kleine Kinder sagen wir, dass die Heilige Schrift sehr wenig \u00fcber
  sie vermeldet, und deshalb, wo die Bibel zugegebenerma\u00dfen wenig hergibt, darf
  niemand etwas dogmatisch fest\u00adlegen. Aber ich glaube, f\u00fcr die ganze Gemeinschaft
  der Gl\u00e4ubigen zu sprechen, zumindest mit au\u00dfer\u00ad ordentlich wenigen
  Ausnahmen, die mir aber auch\\n\\nnicht bekannt sind, wenn ich sage: Wir halten
  daf\u00fcr, dass alle kleinen Kinder [die sterben], von Gott erw\u00e4hlt und darum
  errettet sind, und wir be\u00adtrachten dies als das Mittel, wodurch Christus f\u00fcr
  die M\u00fchsal seiner Seele zu einem gro\u00dfen Teil Frucht sehen wird. Wir hoffen
  auch manchmal sehr, dass dadurch die Menge der Erretteten die Anzahl der Verlorenen
  \u00fcbersteigen wird.\\n\\nWas immer unsere Freunde auch in dieser Sache denken
  m\u00f6gen, sie sind nicht notwendigerweise mit der calvinistischen Lehre verbunden.
  Ich glaube, dass der Herr Jesus, der gesagt hat: \u00bbSolcher ist das Reich der
  Himmel\u00ab, tats\u00e4chlich t\u00e4glich und immerfort solche Kleinen in seine
  liebenden Arme aufnimmt, die hier nur kurz auftauchen und dann in den Himmel geholt
  werden. 1\\n\\nWenn man die reformierte Literatur der letzten vierhundert Jahre
  seit Calvin durchforscht, wird man entdecken, dass sich weitaus die meisten Schreiber
  darin einig sind, dass kleine Kinder, die sterben, in den Himmel gebracht werden.\\n\\nVielleicht
  sagen Sie jetzt: \u00bbGut, wenn Gott allen Babys erlaubt, in den Himmel zu kommen,
  dann zeigt sich gerade darin seine Gnade.\u00ab\\n\\nRichtig!\\n\\nGefallene, s\u00fcndige,
  schuldige und verdorbene Kinder, die ohne jedes geistliches Verdienst \u2013 weder
  pers\u00f6nlicher oder moralischer, noch religi\u00f6ser Art \u2013 sterben, werden
  von Gott in seine Herrlichkeit aufgenommen. Auf welcher Grundlage? Einzig aus Gnaden!\\n\\nWie
  wurden Sie oder irgendein anderer Mensch er\u00ad rettet? Durch Gesetz? Oder durch
  Gnade? Niemand von uns hatte in Bezug auf das Werk der eigenen Errettung mehr Verdienste
  als das j\u00fcngste und hilf\u00ad loseste Kind. Wir alle wurden aus Gnaden errettet.\\n\\nJesus
  sagte: \u00bbWenn ihr nicht umkehrt und werdet wie die Kindlein, so werdet ihr nicht
  in das Reich der Himmel eingehen\u00ab (Matth\u00e4us 18,3). Niemand von uns kann
  die eigene Seele retten. Wir m\u00fcssen jeder wie ein kleines Kind kommen \u2013
  v\u00f6llig auf Gottes Gnade angewiesen \u2013, wenn wir die freie Gabe der Barmherzigkeit
  und Vergebung empfangen wollen, die durch den Tod Jesu Christi m\u00f6glich wurde.\\n\\nDer
  Apostel Paulus sagte sehr deutlich: \u00bbDenn durch Gnade seid ihr errettet, mittels
  des Glaubens; und das nicht aus euch, Gottes Gabe ist es; nicht aus Werken, damit
  niemand sich r\u00fchme\u00ab (Epheser 2,8-9).\\n\\nDie Errettung jedes Einzelnen
  hat Gott in die Wege geleitet und ist seine souver\u00e4ne Wahl aus Gnaden. Sie
  gr\u00fcndet sich auf keinerlei Verdienste des individuellen S\u00fcnders. Keiner
  von uns hat die Errettung verdient \u2013 was bedeutet: Wir k\u00f6nnen die Errettung
  nicht erarbeiten, gewinnen, erreichen oder anderweitig durch eigene Verdienste erwerben,
  auch nicht\\n\\ndurch Intelligenz, gute Werke, rationale, intellek\u00ad tuelle
  Argumente, religi\u00f6se oder konfessionelle Bindungen oder famili\u00e4res Erbe.
  Wir k\u00f6nnen selbst auf keinerlei Weise etwas f\u00fcr unsere Errettung tun.
  Sie hat auch gar nichts mit unserer Initiative oder Leistung zu tun. Errettung beruht
  einzig auf Gnade. Und es gibt keine deutlichere Manifestation dieser Wahrheit als
  die Gabe des ewigen Lebens an ein kleines, hilfloses und verlorenes Kind. Die rettende
  Gnade, die einem S\u00e4ugling zuteilwird, der gar nichts zu seinem Heil beitragen
  kann, ist ein vollkommenes Bild der Errettung, die stets auf souver\u00e4ne Weise
  durch Gottes Gnade bewirkt wird.\\n\\nBiblische Wahrheit Nr. 3: Wir sind durch das
  Opferwerk Jesu Christi am Kreuz gerettet \u2013 die alles \u00fcber\u00adragende
  Offenbarung der g\u00f6ttlichen Gnade. Es stellt sich nat\u00fcrlich die Frage:
  Wenn kleine Kinder bei ihrem Tod errettet sind, wodurch wurden sie dann errettet?
  Wenn geistig behinderte Erwachsene errettet werden \u2013 solche, die in Bezug auf
  die Fragen der Errettung nur das Verst\u00e4ndnis kleiner Kinder haben\u00a0\u2013,
  wodurch erlangen sie das Heil?\\n\\nDie Antwort: durch das Opfer, das Jesus Christus
  darbrachte. Unsere Errettung kam zustande, weil Gott S\u00fcnder zur Errettung durch
  Christus auserw\u00e4hlte. Die Heilige Schrift lehrt, dass Jesus Christus der einzige
  und hinreichende Heiland ist. Die Errettung kommt nur aufgrund des S\u00fchnungsblutes
  zustande.\\n\\nGott hat diejenigen auserw\u00e4hlt, die er retten will \u2013 einschlie\u00dflich
  derer, die als kleine Kinder sterben. Sie werden nicht aus eigener Initiative gerettet,
  sondern aufgrund seiner souver\u00e4nen Wahl, allein aus Gnaden. Kleine Kinder haben
  keine Verdienste, durch die sie Anspruch auf den Himmel h\u00e4tten. Im Gegenteil:
  Wegen ihrer Schuld und Verdorbenheit brauchen sie die Erl\u00f6sung; doch ihre Errettung
  wurde durch das stellvertretende Opfer Christi am Kreuz bezahlt, durch das er den
  Zorn Gottes nicht nur f\u00fcr alle trug, die glauben konnten, sondern auch f\u00fcr
  alle, die nicht glauben konnten.\\n\\nB.B. Warfield, der ma\u00dfgebliche und verehrte
  Theologe der Princeton University, schrieb einst:\\n\\nDas Schicksal kleiner Kinder,
  die sterben, ist unabh\u00e4ngig von ihrer Wahl durch eine bedingungslose Verordnung
  Gottes festgelegt, deren Ausf\u00fchrung von keiner Handlung ihrerseits abh\u00e4ngig
  ist. Und ihre Errettung wurde durch die bedingungslose Anwendung der Gnade Christi
  auf ihre Seelen bewirkt durch die unmittelbare und unwiderstehliche Einwirkung des
  Heiligen Geistes vor und unabh\u00e4ngig von jeglicher Handlung ihres eigenen Willens.
  Wenn aber der Tod im Kleinkindalter aufgrund der Vorsehung Gottes erfolgt, ist es
  ganz sicher auch Gott, der in seiner Vorsehung diese riesige Menge auserw\u00e4hlt,
  Teilhaber seiner bedingungslosen Errettung zu werden. Mit anderen\\n\\nWor\u00adten:
  Sie sind von Grundlegung der Welt an be\u00ad dingungslos zur Errettung vorherbestimmt.
  2\\n\\nWenn wir Gott in seinem Wesen als einen Retter verstehen (siehe 1. Timotheus
  1,1; 4,10), kommt dann nicht in der Aussage, dass es Gott gef\u00e4llt, kleine Kinder
  zu retten, seine Herzensregung am deutlichsten zum Ausdruck? Wie k\u00f6nnten wir
  glauben, dass Gott \u00fcber die Verlorenen weint und vors\u00e4tzliche S\u00fcnder
  \u00fcberredet, sich mit ihm vers\u00f6hnen zu lassen, wenn er ungez\u00e4hlte Millionen
  unschuldiger Babys in die H\u00f6lle wirft, bevor sie \u00fcberhaupt den Status
  moralischer Schuldhaftigkeit erreichen \u2013 bevor sie die M\u00f6glichkeit besitzen,
  moralisch zwischen Gut und B\u00f6se zu unterscheiden?\\n\\nBiblische Wahrheit Nr.
  4: Wir werden aus Gnaden errettet, aber aufgrund von Werken \u00bbverdammt\u00ab.
  Es ist wichtig zu fragen, was die Heilige Schrift \u00fcber die Verdammnis wirklich
  lehrt. Wenn jemand durch Gnade errettet wird, durch was wird er dann verdammt?\\n\\nOffenbarung
  20,11-15 beschreibt den Richterstuhl Gottes am gro\u00dfen wei\u00dfen Thron:\\n\\nUnd
  ich sah einen gro\u00dfen wei\u00dfen Thron und den, der darauf sa\u00df, vor dessen
  Angesicht die Erde entfloh und der Himmel, und keine St\u00e4tte wurde f\u00fcr
  sie gefunden. Und ich sah die Toten, die Gro\u00dfen und die Kleinen, vor dem Thron
  stehen, und\\n\\nB\u00fccher wurden aufgetan; und ein anderes Buch wurde aufgetan,
  welches das des Lebens ist. Und die Toten wurden gerichtet nach dem, was in den
  B\u00fcchern geschrieben war, nach ihren Werken. Und das Meer gab die Toten, die
  in ihm waren, und der Tod und der Hades gaben die Toten, die in ihnen waren, und
  sie wurden gerichtet, ein jeder nach seinen Werken. Und der Tod und der Hades wurden
  in den Feuersee geworfen. Dies ist der zweite Tod, der Feuersee. Und wenn jemand
  nicht geschrieben gefunden wurde in dem Buch des Lebens, so wurde er in den Feuersee
  geworfen.\\n\\nDie Heilige Schrift lehrt, dass wir durch Gnade erret\u00ad tet,
  aber aufgrund von Werken verdammt werden. Die Schrift lehrt, dass ewige Strafe der
  Lohn f\u00fcr solche ist, die absichtlich s\u00fcndigten. Nirgends in der Bibel
  wird jemand, der Adams Schuld nur geerbt hat, mit der H\u00f6lle bedroht. Im Gegenteil:
  Wenn die Bibel die Bewohner der H\u00f6lle beschreibt, legt sie immer Wert auf die
  absichtlichen s\u00fcndigen Taten und die Rebellion dieser Leute (1. Korinther 6,9-10;
  Galater 5,19-21; Epheser 5,5; Kolosser 3,6; Offenbarung 21,8; 22,15). Die Bibel
  verbindet die ewige Verdammnis immer mit Werken der Ungerechtigkeit \u2013 mit absichtlichen
  S\u00fcnden.\\n\\nKleine Kinder kennen weder bewusste Rebellion noch Unglauben.
  Das h\u00e4ufigste Werk der S\u00fcnder ist der Unglaube. Es ist das grundlegende
  Werk, das zur\\n\\nVerdammnis f\u00fchrt. Die Bibel sagt uns: \u00bbWer an den Sohn
  glaubt, hat ewiges Leben; wer aber dem Sohn nicht glaubt, wird das Leben nicht sehen,
  sondern der Zorn Gottes bleibt auf ihm\u00ab (Johannes 3,36).\\n\\nJesus stellte
  dies sehr deutlich heraus, als er im Tempel lehrte:\\n\\nEr sprach nun wiederum
  zu ihnen: \u00bbIch gehe hin, und ihr werdet mich suchen und werdet in eurer S\u00fcnde
  sterben; wohin ich gehe, dahin k\u00f6nnt ihr nicht kommen.\u00ab Da sagten die
  Juden: \u00bbEr will sich doch nicht selbst t\u00f6ten, dass er spricht: \u203aWohin
  ich gehe, dahin k\u00f6nnt ihr nicht kommen\u2039?\u00ab Und er sprach zu ihnen:
  \u00bbIhr seid von dem, was unten ist, ich bin von dem, was oben ist; ihr seid von
  dieser Welt, ich bin nicht von dieser Welt. Darum sagte ich euch, dass ihr in euren
  S\u00fcnden sterben werdet; denn wenn ihr nicht glaubt, dass ich es bin, so werdet
  ihr in euren S\u00fcnden sterben\u00ab (Johannes 8,21-24; Hervorhebung durch den
  Autor).\\n\\nW\u00e4hrend der gesamten Kirchengeschichte wurde der Unglaube als
  die grundlegende Ursache der Verdammnis gesehen. Ein Mensch, der nicht glaubt, gehorcht
  auch nicht. Unglaube bringt immer b\u00f6se Werke hervor. Es ist dieser Bericht
  \u00fcber den Unglauben und die daraus hervorgehenden b\u00f6sen Werke, der im Gericht
  vor dem gro\u00dfen wei\u00dfen Thron offenbar wird. Und dieser Bericht ergibt die
  Grundlage f\u00fcr die ewige Verdammnis.\\n\\nKleine Kinder haben keinen solchen
  Bericht. Ihnen fehlt die M\u00f6glichkeit, zu glauben oder nicht zu glauben. Sie
  k\u00f6nnen nicht zwischen Richtig und Falsch, zwischen S\u00fcnde und Gerechtigkeit,
  zwischen B\u00f6se und Gut unterscheiden. Die Heilige Schrift sagt das sehr deutlich.
  Weil kleine Kinder keine Liste des Unglaubens und b\u00f6ser Werke haben, gibt es
  f\u00fcr sie keine Grundlage, weshalb sie die ewige Trennung von Gott verdient h\u00e4tten.
  Als Unschuldige sind sie aus Gnaden und souver\u00e4n von Gott als Teil des S\u00fchnungswerkes
  Christi Jesu errettet.\\n\\nWie schon erw\u00e4hnt verurteilte Gott die gesamte
  Generation, die gegen ihn in der W\u00fcste aufbegehrt hatte, dazu, nach einer vierzigj\u00e4hrigen
  W\u00fcstenwanderung sterben zu m\u00fcssen. Der Herr schwor ihnen: \u00bbWenn ein
  Mann unter diesen M\u00e4nnern, diesem b\u00f6sen Geschlecht, das gute Land sehen
  wird, das ich geschworen habe, ihren V\u00e4tern zu geben!\u00ab (5. Mose 1,35).
  Aber die kleinen Kinder nahm Gott von diesem Beschluss aus, und er erkl\u00e4rte,
  warum er das tat: \u00bbUnd eure Kindlein, von denen ihr sagtet: Sie werden zur
  Beute werden! Und eure S\u00f6hne, die heute weder Gutes noch B\u00f6ses kennen,
  sie sollen hineinkommen, und ihnen will ich es geben\u00ab (5. Mose 1,39; Hervor\u00ad
  hebung durch den Autor).\\n\\nAuch in der Geschichte von Jona war die Unf\u00e4higkeit,
  rechts von links zu unterscheiden, das Kriterium f\u00fcr Unschuld. Wie zuvor ebenfalls
  schon er\u00f6rtert, antwortete Gott auf Jonas Bedauern, dass Gott die gro\u00dfe,
  Israel feindlich gesonnene Stadt verschont hatte, so: \u00bb\u2026 und ich sollte
  mich Ninives, der gro\u00dfen Stadt, nicht erbarmen, in welcher mehr als hundertzwanzigtausend
  Menschen sind, die nicht zu unterscheiden wissen zwischen ihrer Rechten und ihrer
  Linken?\u00ab (Jona 4,11). Der Herr meinte damit die Verschonung von 120\u2009000
  kleinen Kindern, die nicht rechts von links, ge\u00ad schweige denn Gut von B\u00f6se
  unterscheiden konnten.\\n\\nGott hatte gro\u00dfes Mitleid mit denen, welche die
  Wahrheit nicht erkennen konnten.\\n\\nKleine Kinder werden genau deswegen als unschuldig
  bezeichnet, weil sie nicht absichtlich gegen Gott rebelliert haben. Sie haben keine
  Taten des Unglaubens vollbracht. Obwohl sie mit ihrer s\u00fcndigen Natur empfangen
  wurden, hatten sie nie die M\u00f6glichkeit, absichtlich dieser Natur zu folgen
  und mit vollem Verst\u00e4ndnis oder mutwillig gegen Gott aufzubegehren. Und daher
  sind sie unschuldig aller Taten des Unglaubens gegen den heiligen Gott.\\n\\nWenn
  einige sagen, diese Kleinen seien nicht errettet, weil sie nicht geglaubt haben,
  so antworte ich, dass sie nicht glaubten, weil sie es nicht konnten. Sie sind unf\u00e4hig,
  sich bewusst, absichtlich, rational und vors\u00e4tzlich f\u00fcr oder gegen den
  Glauben zu entscheiden.\\n\\nKleine Kinder haben die Wahrheit nicht unterdr\u00fcckt
  oder \u00bbin Ungerechtigkeit besessen\u00ab. Wir\\n\\nlesen im Neuen Testament:
  \u00bbDenn es wird geoffenbart der Zorn Gottes vom Himmel her \u00fcber alle Gottlosigkeit
  und Ungerechtigkeit der Menschen, welche die Wahrheit in Ungerechtigkeit besitzen\u00ab
  (R\u00f6mer 1,18).\\n\\nG\u00f6ttliches Gericht kommt \u00fcber alle, welche die
  Wahrheit unterdr\u00fccken \u2013 die sich von der Macht der Wahrheit Gottes abwenden,
  sie in ihrem Leben verleugnen und lieber den L\u00fcgen des Teufels folgen. Sie
  unterdr\u00fccken die Wahrheit und unterst\u00fctzen die L\u00fcgen, sie geben den
  Versuchungen des Teufels nach, B\u00f6ses zu tun, was sich in vielerlei Arten der
  Rebellion und des Unglaubens \u00e4u\u00dfert.\\n\\nDer Apostel Paulus schrieb auch
  an die R\u00f6mer: \u00bb\u2026 weil sie Gott kennend, ihn weder als Gott verherrlichten,
  noch ihm Dank darbrachten, sondern in ihren \u00dcberlegungen in Torheit verfielen
  und ihr unverst\u00e4ndiges Herz verfinstert wurde \u2026\u00ab (R\u00f6mer 1,21).\\n\\nDieses
  grundlegende Kapitel des R\u00f6merbriefes sagt ganz klar, dass Gott sich allen
  Menschen in ausreichender Weise offenbart hat, um seine Macht, sein moralisches
  Regiment und einige Aspekte seiner Herrlichkeit zu erkennen zu geben \u2013 sei
  es durch das Gewissen oder durch das Licht der Natur. Kein Mensch hat eine ausreichende
  Entschuldigung daf\u00fcr, die unsichtbaren Merkmale Gottes nicht wahrgenommen oder
  verstanden zu haben. S\u00fcndigen M\u00e4nnern und Frauen gefiel es allerdings
  besser, sich von dem\\n\\nGott abzuwenden, der sich ihnen geoffenbart hat. Sie verherrlichen
  ihn nicht. Sie bringen ihm weder Dank noch Lob entgegen. Sie wenden ihre Gedanken
  nach innen, weg von Gott, und indem sie das tun, werden ihre Herzen verfinstert.
  Sie halten sich f\u00fcr weise, sind aber Narren geworden. Sie fangen an, die Werke
  ihrer H\u00e4nde anzubeten, und wenn das geschieht, erlaubt Gott es ihnen, in ihrer
  S\u00fcnde und in der Lust ihrer Herzen zu schwelgen. Gott gibt sie dahin, die Gesch\u00f6pfe
  mehr zu verehren als den Sch\u00f6pfer.\\n\\nKein Kind unterdr\u00fcckt die Wahrheit.
  Ein kleines Kind hat nicht die F\u00e4higkeit, das von Gott Offenbarte zu verstehen
  und das von ihm Gezeigte zu verwerfen. Kleine Kinder sind \u00bbin ihren \u00dcberlegungen
  (nicht) in Torheit\u00ab verfallen. Sie nehmen das von Gott Offenbarte nicht bewusst
  wahr und k\u00f6nnen deshalb weder zu ihm rufen noch sich von ihm abwenden. Genau
  dies entspricht \u2013 wie wir gesehen haben \u2013 demjenigen, was Jona 4,11 und
  5. Mose 1,39 lehren.\\n\\nPaulus schreibt: \u00bbGleichwie sie es nicht gut fanden,
  Gott in Erkenntnis zu haben, hat Gott sie dahingegeben in einen verworfenen Sinn,
  zu tun, was sich nicht geziemt.\u00ab Dann f\u00e4hrt er fort, eine Reihe s\u00fcndiger
  Verhaltensweisen und Einstellungen aufzulisten, wozu auch ihre Charakterisierung
  als \u00bbGott Hassende\u00ab geh\u00f6rt. Das alles beschreibt wahrhaftig keine
  kleinen Kinder, die keine M\u00f6glichkeit haben, Hass gegen Gott auszudr\u00fccken.
  Jene sind es, die wissen, dass sie\\n\\nsich gegen die gerechten Urteile Gottes
  auflehnen, die \u00bbdes Todes w\u00fcrdig sind\u00ab (R\u00f6mer 1,28-32).\\n\\nEin
  kleines Kind kann sich unm\u00f6glich gegen Gott auflehnen; denn Rebellion gegen
  Gott entspringt bewusstem, absichtlichem Hass gegen Gott. Durch den Propheten Jesaja
  lie\u00df Gott sagen: \u00bbDenn ehe der Knabe wei\u00df, das B\u00f6se zu verwerfen
  und das Gute zu erw\u00e4hlen, wird das Land verlassen sein, vor dessen beiden K\u00f6nigen
  dir graut\u00ab (Jesaja 7,16). Der Herr redete hier von einem Kleinkind, das noch
  unf\u00e4hig ist, sich bewusst daf\u00fcr zu entscheiden, gegen Gott zu rebellieren.
  Nirgends in der Heiligen Schrift weist etwas auf ein g\u00f6ttliches Gericht hin,
  das \u00fcber solche kommt, die niemals die Erkenntnis von Richtig und Falsch gehabt
  haben oder die nie die M\u00f6glichkeit hatten, sich zu entscheiden, ob sie Gott
  lieben oder hassen wollten.\\n\\nKleine Kinder verstehen weder die Auswirkungen
  noch die Konsequenzen der S\u00fcnde. Kinder k\u00f6nnen eigenn\u00fctzig und egoistisch
  sein. Sie m\u00f6gen Wut\u00ad anf\u00e4lle bekommen, vor Zorn schreien, Kekse stehlen,
  ihre Geschwister auf den Kopf schlagen oder ihren kleinen Spielkameraden auf dem
  Spielplatz Sand ins Gesicht werfen. Sie m\u00f6gen ihren Eltern trotzen und \u00bbNein\u00ab
  schreien, wo die angebrachte Antwort ein gehorsames \u00bbJa\u00ab gewesen w\u00e4re.
  Sie m\u00f6gen l\u00fcgen, um ihre Missetaten zu vertuschen.\\n\\nGanz gewiss liegen
  wir richtig, wenn wir diese Handlungsweisen als falsch \u2013 ja, als s\u00fcndig
  \u2013 bezeichnen.\\n\\nAber ein kleines Kind kann in seinem Herzen nicht absch\u00e4tzen,
  dass all dieses Treiben Gott beleidigt oder dass es so etwas wie S\u00fcnde gegen
  Gott und sein heiliges Gebot gibt. Es kann verstehen, dass es etwas getan hat, was
  Mama und Papa missf\u00e4llt, weil sie es ihm gesagt haben! Es hat aber noch kein
  Verst\u00e4ndnis daf\u00fcr, dass seine Auflehnung, sein L\u00fcgen, Stehlen und
  so weiter eine \u00dcbertretung g\u00f6ttlicher Gebote ist und dass diese Handlungen
  irgendwelche ewigen Folgen haben. Kleine Kinder k\u00f6nnen Gott in dieser Weise
  nicht begreifen. Auch das Evangelium k\u00f6nnten sie nicht verstehen, wenn sie
  es h\u00f6rten. Sie haben keine M\u00f6glichkeit, Jesus als ihren Retter anzunehmen,
  Bu\u00dfe zu tun und zu glauben \u2013 oder ihn abzulehnen.\\n\\nSie sind daher
  nicht schuldig, die volle Bedeutung, die Auswirkungen oder die Folgen ihres Handelns
  bereits erkannt zu haben. Von kleinen Kindern ist in den B\u00fcchern des Himmels
  noch nichts aufgeschrieben, was sie an bewussten Taten der Rebellion und Ungerechtigkeit
  gegen Gott begangen h\u00e4tten. Sie sind noch nicht moralisch verantwortlich Handelnde.
  Mit anderen Worten: Sie sind noch nicht haftbar f\u00fcr ihre Taten, weil sie einfach
  noch nicht richtig wissen, was sie tun und welche Folgen ihre Handlungen nach sich
  ziehen.\\n\\nR.A. Webb sprach genau diesen Sachverhalt an, als er schrieb:\\n\\nW\u00fcrde
  ein Kleinkind aus keinem anderen Grund in die H\u00f6lle geschickt als dem, dass
  es die Erbs\u00fcnde an sich tr\u00e4gt, so w\u00e4re das ein ausreichender Grund
  f\u00fcr den g\u00f6ttlichen Geist, dieses Urteil zu f\u00e4llen; denn S\u00fcnde
  ist eine Realit\u00e4t. Aber der Geist des Kindes w\u00fcsste von keinerlei Gr\u00fcnden
  f\u00fcr dieses Leiden. Unter diesen Umst\u00e4nden w\u00fcrde es wohl Leiden kennenlernen;
  aber die Ursache daf\u00fcr bliebe ihm v\u00f6llig unbekannt. Es k\u00f6nnte sich
  selbst nicht klarmachen, warum es so grauenvoll geschlagen ist, und demzufolge blieben
  ihm die ganze Bedeutung und der Sinn seiner Leiden v\u00f6llig fremd. Das eigentliche
  Wesen der Strafe w\u00e4re seinem Bewusstsein ein R\u00e4tsel, und so k\u00e4me
  die Gerechtigkeit weder zu ihrem Recht noch zur Geltung. 3\\n\\nKein unw\u00fcrdiges
  Verhalten. Die Heilige Schrift lehrt, dass wir aufgrund unserer Taten gerichtet
  wer\u00adden, die wir absichtlich \u00bbin dem Leib\u00ab begangen haben (2. Korinther
  5,10). Die S\u00fcnde Adams und die daraus resultierende Schuld erkl\u00e4ren unsere
  Un\u00ad f\u00e4higkeit, uns mit Gott vers\u00f6hnen zu lassen, ohne errettet zu
  sein. Aber die Bibel lehrt nicht, dass wir auf Adams S\u00fcnde reagieren oder f\u00fcr
  sie verantwortlich gemacht werden sollen. Wir haben unsere eigene S\u00fcnde zu
  verantworten. Wie ist das nun mit kleinen\\n\\nKindern? Haben solche, die im Kleinkindalter
  starben, solche S\u00fcnden in ihrem Leib begangen? Nein.\\n\\nJesus sagte: \u00bbWas
  aus dem Mund ausgeht, kommt aus dem Herzen hervor, und das verunreinigt den Menschen.
  Denn aus dem Herzen kommen hervor b\u00f6se Gedanken, Mord, Ehebruch, Hurerei, Dieberei,
  falsche Zeugnisse, L\u00e4sterungen; diese Dinge sind es, die den Menschen verunreinigen\u00ab
  (Matth\u00e4us 15,1820). Ein Kleinkind ist nicht in der Lage, diese s\u00fcndigen
  Dinge zu tun, welche die Seele verunreinigen und der Strafe Gottes unterliegen.\\n\\nPhil
  Johnson, ein \u00c4ltester der Grace Community Church, schrieb in einer seiner Lektionen:\\n\\nEinmal
  traf ich einen Menschen, dessen Kind ganz jung gestorben war, und es hatte den Anschein,
  als ob er die Ansicht f\u00fcr etwas Verdienstvolles hielt, sein eigenes Kind sei
  in die H\u00f6lle gekommen. Sooft er Gelegenheit hatte, kam er auf dieses Thema
  zu sprechen, und war stolz darauf, dass er und seine Frau nun einmal die Tatsache
  begriffen h\u00e4tten, sein Kind habe nicht zu den Auserw\u00e4hlten geh\u00f6rt.
  Ich sagte ihm, er und seine Frau w\u00fcrden noch meiner Meinung nach eine fr\u00f6hliche
  \u00dcberraschung erleben, wenn sie in die Herrlichkeit kommen. Ich erinnere mich
  gut, dass er sich absolut sicher war, dass im Falle der Auserw\u00e4hlung des kleinen
  Kindes zur Errettung Gott es so lange am Leben erhalten h\u00e4tte, bis es gl\u00e4ubig
  geworden w\u00e4re. Meine\\n\\nAntwort lautete, er k\u00f6nne genauso viele biblische
  Beweise f\u00fcr die Ansicht erhalten, dass, wenn Gott sich entschieden h\u00e4tte,
  dieses Kind nicht zu erw\u00e4hlen, er es so lange auf der Erde gelassen h\u00e4tte,
  bis dessen Herz durch die S\u00fcnde verh\u00e4rtet und seine Rebellion gegen Gott
  durch bewusste Handlungen offenkundig geworden w\u00e4re. Denn jedes Mal, wenn die
  Bibel die Bewohner der H\u00f6lle beschreibt, dann liefert sie ebenfalls eine Auflistung
  von S\u00fcnden und Abscheulichkeiten, die diese ganz bewusst ver\u00fcbt hat\u00ad
  ten. Wenn wir die biblischen Angaben untersuchen w\u00fcrden, k\u00e4men wir zu
  folgendem Schluss: Wenn Gott das Leben eines kleinen Kindes wegnimmt, ist es in
  Wirklichkeit ein Gnadenakt, um es davor zu bewahren, durch ein Leben unter dem Einfluss
  des B\u00f6sen und in bewusster Auflehnung gegen Gott verh\u00e4rtet zu werden.
  Unsere Haltung zu diesem Thema sagt eine Menge dar\u00fcber aus, was wir von Gott
  und seiner Gnade halten. 4\\n\\nKeine F\u00e4higkeit, die Errettung zu w\u00e4hlen.
  Mir ist sehr deutlich, dass Jesus sagte, wir m\u00fcssten durch die enge Pforte
  eingehen: \u00bbDenn weit ist die Pforte und breit der Weg, der zum Verderben f\u00fchrt,
  und viele sind, die durch sie eingehen. Denn eng ist die Pforte und schmal der Weg,
  der zum Leben f\u00fchrt, und wenige sind, die ihn finden\u00ab (Matth\u00e4us 7,13-14).
  Aber ich glaube, dass Jesus dies zu solchen sagte, die intellektuell in der Lage
  waren, den schmalen Weg zu\\n\\nsuchen, und moralisch schuldf\u00e4hig waren, wenn
  sie es nicht taten. Um einen Weg finden zu k\u00f6nnen, muss man in der Lage sein,
  diesen Weg zu suchen. Ganz kleinen Kindern ist das nicht gegeben.\\n\\nPaulus schrieb
  an die R\u00f6mer: \u00bbDenn gleichwie durch eines Menschen Ungehorsam die Vielen
  in die Stellung von S\u00fcndern gesetzt worden sind, so werden auch durch den Gehorsam
  des Einen die Vielen in die Stellung von Gerechten gesetzt werden\u00ab (R\u00f6mer
  5,19). Die \u00bbVielen\u00ab in diesem Vers schlie\u00dfen meiner Meinung nach
  die Kleinen ein. Eine Erkl\u00e4rung daf\u00fcr, dass \u00bbwenige\u00ab den schmalen
  Weg finden und doch \u00bbviele\u00ab zu Gerechten gemacht werden, liegt in der
  Anerkennung der riesigen Zahl der Ungeborenen, der Tot\u00ad geborenen und der kleinen
  Kinder, die von Anfang der Zeiten an den Himmel bev\u00f6lkern. Es ist die Gnade
  Gottes, die diese Kleinen heute vor ihm stehen l\u00e4sst, g\u00e4nzlich umgestaltet
  von der menschlichen Natur der S\u00fcnde in die erl\u00f6ste Natur der Gerechten.\\n\\nEin
  souver\u00e4nes Werk Jesu Christi. Wir wollen das jetzt zusammenfassen. In der ganzen
  Bibel gibt es keinen Beleg daf\u00fcr, dass jemand f\u00fcr etwas anderes zur Verdammnis
  verurteilt wurde als nur aufgrund s\u00fcndiger Taten, einschlie\u00dflich der Tat
  des Unglaubens \u2013 der bewussten, willentlichen und absichtlichen Entscheidung,
  Gott nicht glauben zu wollen. Gott zieht au\u00dferdem niemanden wegen S\u00fcnden
  zur Rechenschaft, bevor diese S\u00fcnden getan worden sind.\\n\\nDie Errettung
  geschieht nur durch Gnade, ohne jedwedes Werk. Die Verdammnis erfolgt aufgrund von
  Werken, ohne alle Gnade.\\n\\nAn keiner Stelle lehrt die Heilige Schrift die Verdammnis
  von Kindern. Vielmehr geben alle biblischen Hinweise auf das Thema der abgeschiedenen
  S\u00e4uglinge und Kleinkinder \u2013 direkt oder indirekt \u2013 uns Anlass zu
  der Annahme, dass sie unmittelbar in die ewige Gegenwart Gottes eingehen.\\n\\nMir
  bleibt nichts anderes \u00fcbrig, als daraus zu schlie\u00dfen, dass unser Herr
  in seiner Gnade und aus freien St\u00fccken alle diese abgeschiedenen Kleinen aufnimmt
  \u2013 nicht aufgrund ihrer Unschuld oder W\u00fcrdigkeit, sondern wegen seiner
  Barmherzigkeit, durch die S\u00fchnung, die er am Kreuz f\u00fcr sie erworben hat.
  Diese Kleinen erfahren eine Errettung, die sich auf die absolute Souver\u00e4nit\u00e4t
  und die allumfassende Gnade Gottes gr\u00fcndet.\\n\\nJa, auch Babys sind von Natur
  S\u00fcnder, sie sind nicht s\u00fcndlos; aber sie sind ohne s\u00fcndige Taten..\\n\\nJa,
  auch solche Kinder brauchen einen Retter.\\n\\nJa, doch Gott hat ihnen in dem Herrn
  Jesus Christus einen Retter bereitet.\\n\\nJa, alle Kinder, die sterben, bevor sie
  den Zustand eines moralischen Bewusstseins und der Schuldf\u00e4hig\u00ad keit erreicht
  haben \u2013 von dem aus sie ihre S\u00fcnde\\n\\nund Verdorbenheit erst erkennen
  und auch absichtlich aus\u00fcben k\u00f6nnen \u2013, werden von Gott aus Gnaden
  durch das Werk Jesu Christi ewig errettet. Sie werden durch souver\u00e4ne Gnadenwahl
  zu den Auserw\u00e4hlten gerechnet, weil sie sich nicht bewusster S\u00fcnde, nicht
  der Emp\u00f6rung gegen Gott und nicht des Unglaubens schuldig gemacht haben. Durch
  solche Werke w\u00e4ren sie zu Recht zu ewiger Strafe verdammt worden.\\n\\nWenn
  Sie aufmerksam allen angegebenen Bibelstellen in diesem und im vorhergehenden Kapitel
  nachgegangen sind, dann wissen Sie, dass Ihr Kind, das vor der Geburt, bei der Geburt
  oder als kleines Kind gestorben ist, bevor es den Unterschied zwischen Gut und B\u00f6se
  begreifen konnte, wirklich ewig geborgen ist. Es ruht sicher in Gottes Armen, ewig
  sicher in seiner Liebe und Gnade.\\n\\nWerde ich mein Kind wiedersehen?\\n\\nDie
  meisten Menschen, die etwas mit der Bibel vertraut sind, kennen die Geschichte von
  David und Bathseba. Nachdem David mit Bathseba Ehebruch begangen hatte, erkannte
  er, dass sie von ihm schwanger war. Daraufhin sandte er ihren Mann Uria an den gef\u00e4hrlichsten
  Frontabschnitt des Krieges, von dem David wusste, dass er dort bestimmt umkommen
  w\u00fcrde. Vor Gott war David nicht nur ein Ehebrecher, sondern obendrein ein M\u00f6rder.
  Der Herr sandte seinen Propheten Nathan zu David, um ihm dies mitzuteilen (2. Samuel
  11 und 12).\\n\\nZur Rede gestellt, gab David zu, was er getan hatte. Er sagte zu
  Nathan: \u00bbIch habe gegen den HERRN ge\u00ad s\u00fcndigt\u00ab (2. Samuel 12,
  13). Nathan antwortete David daraufhin, der Herr habe seine Bu\u00dfe an\u00adgenommen
  und ihm vergeben \u2013 darum w\u00fcrde er nicht sterben. Dann aber f\u00fcgte
  er hinzu: \u00bbNur weil du den Feinden des HERRN durch diese Sache Anlass zur L\u00e4sterung
  gegeben hast, so soll auch der Sohn, der dir geboren ist, gewisslich sterben!\u00ab
  (2. Samuel 12,14).\\n\\nIm Grund hei\u00dft das: David wurde seine S\u00fcnde ver\u00ad
  geben; aber die Folgen seiner S\u00fcnde wurden nicht v\u00f6llig getilgt.\\n\\nKaum
  war Bathsebas Kind geboren, wurde es schwer krank. David flehte Gott wegen des Lebens
  dieses\\n\\nKindes an. Er fastete und betete, und wir lesen: Er \u00bblag \u00fcber
  Nacht auf der Erde\u00ab, w\u00e4hrend er Gott an\u00adbettelte, das Kind am Leben
  zu lassen. Seine Diener versuchten, ihn aufzurichten und ihm Nahrung an\u00adzubieten;
  aber er wollte beides nicht. Er fuhr mit un\u00adaufh\u00f6r\u00ad lichem Fasten
  und Beten fort, indem er aus\u00adgestreckt vor dem Herrn liegen blieb. Ich bin
  mir sicher, dass David am \u00dcberleben des Kindes sehen wollte, ob Gott ihm seine
  schrecklichen Untaten vergeben hatte. Zumindest h\u00e4tte er dann etwas, was ihm
  seine Schuldgef\u00fchle erleichtert h\u00e4tte \u2013 einen kleinen Sohn.\\n\\nDas
  Baby starb am siebten Tag.\\n\\nWeil die Knechte gesehen hatten, wie umfassend und
  schwer David wegen der Krankheit dieses Kindes gelitten hatte, wagten sie nicht,
  ihm den Tod des Kindes zu melden. Vielleicht f\u00fcrchteten sie, er werde sich
  angesichts einer solchen Nachricht selbst um\u00ad bringen! Sie konnten sehen, dass
  David alle pers\u00f6n\u00ad lichen Schuldgef\u00fchle, seine Scham und sein allgemeines
  Wohl\u00adbefinden mit dem \u00dcberleben dieses unehe\u00ad lichen Sohnes verkn\u00fcpft
  hatte.\\n\\nAls David die Knechte fl\u00fcstern h\u00f6rte, merkte er, dass das
  Kind gestorben war. Er fragte: \u00bbIst das Kind tot?\u00ab Und sie antworteten:
  \u00bbEs ist tot.\u00ab\\n\\nZu aller Verwunderung stand David sofort auf, wusch
  und salbte sich, wechselte seine Kleider und ging zum Haus Gottes hinauf, um anzubeten.
  Danach kehrte er in sein Haus zur\u00fcck. Er lie\u00df er sich Speise\\n\\nvorsetzen
  und a\u00df. All das intensive Flehen, alles Fasten, aller Kummer, alle Leiden waren
  vorbei, und das so pl\u00f6tzlich.\\n\\nDavids Knechte waren erstaunt. Sie hatten
  gesehen, wie aufgew\u00fchlt David wegen der Krankheit und des drohenden Sterbens
  seines Sohnes gewesen war. Sie hatten sich solche Gedanken um ihn gemacht, dass
  sie ihn sorgf\u00e4ltig bewachten, damit er sich selbst vor lauter Kummer kein Leid
  antat. Doch anstatt noch gr\u00f6\u00dfere Klagen von ihrem Herrn zu vernehmen,
  sahen sie, wie David aufstand, sich wusch, Gott an\u00adbetete und zu essen verlangte.
  Sie mussten ihn unbedingt nach seinem Verhalten befragen und sagten: \u00bbWas ist
  das f\u00fcr ein Ding, das du tust? Als das Kind lebte, hast du seinetwegen gefastet
  und geweint, und wie das Kind tot ist, stehst du auf und isst?\u00ab (2. Samuel
  12,21).\\n\\nDavid antwortete: \u00bbAls das Kind noch lebte, habe ich gefastet
  und geweint, weil ich dachte: Wer wei\u00df, ob der HERR mir nicht gn\u00e4dig sein
  wird, dass das Kind am Leben bleibt? Da es aber nun tot ist, warum sollte ich denn
  fasten? Vermag ich es wieder zur\u00fcckzubringen? Ich gehe zu ihm; aber es wird
  nicht zu mir zur\u00fcckkehren\u00ab (V. 22-23).\\n\\nDavid sch\u00e4tzte dieses
  kleine Kind. Obwohl er wusste, dass es in S\u00fcnden empfangen worden war, liebte
  er es und w\u00fcnschte, es m\u00f6chte leben. Er betete und fastete intensiv f\u00fcr
  das zerbrechliche Leben. Wie wir hegte auch David starke Hoffnungen, der Herr m\u00f6ge\\n\\nMitleid
  haben und das Kind am Leben lassen \u2013 aber er hatte nicht die Gewissheit, dass
  Gott es tun werde.\\n\\nHier liegt der Schl\u00fcssel zu Davids ver\u00e4nderter
  Haltung. Er h\u00f6rte auf zu klagen, nachdem das Kind tot war. Er sp\u00fcrte weiterhin
  keinen Grund, zu fasten und zu beten, weil an die Stelle seines Kummers sofort und
  vollst\u00e4ndig eine Hoffnung trat. Er erkl\u00e4rte: \u00bbIch gehe zu ihm; aber
  es wird nicht zu mir zur\u00fcckkehren\u00ab (V. 23).\\n\\nTrotz seiner S\u00fcnde
  war David ein Mann Gottes, und er hatte eine fundierte Theologie. Er war ein Gl\u00e4ubiger.
  Er war gez\u00fcchtigt worden und hatte Vergebung empfangen. Er war Gottes Kind.
  Darum sind wir uns sicher, dass David nicht von der H\u00f6lle redete, als er sagte:
  \u00bbIch gehe zu ihm.\u00ab\\n\\nEs gibt wohl einige, die sagen: \u00bbEs ist doch
  klar, was David meinte: Sie w\u00fcrden beide auf dem gleichen Friedhof liegen.\u00ab
  Wie absurd! Eine solche Vorstellung br\u00e4chte doch niemanden dazu, sich waschen
  zu wollen und nach Essen zu verlangen!\\n\\nEs gibt auch diejenigen, die sagen:
  \u00bbDas Kind fuhr in die H\u00f6lle, weil es durch Ehebruch zur Welt kam.\u00ab
  Die Heilige Schrift unterst\u00fctzt eine solche Ansicht absolut nicht. Wie Sie
  sich erinnern, best\u00e4tigt die Bibel genau das Gegenteil:\\n\\nDie Seele, die
  s\u00fcndigt, die soll sterben. Ein Sohn soll nicht die Ungerechtigkeit des Vaters
  mittragen\\n\\nund ein Vater nicht die Ungerechtigkeit des Sohnes mittragen; die
  Gerechtigkeit des Gerechten soll auf ihm sein, und die Gottlosigkeit des Gottlosen
  soll auf ihm sein (Hesekiel 18,20).\\n\\nDavid konnte sagen: \u00bbIch werde zu
  ihm gehen\u00ab, weil er wusste, wohin sowohl er als auch sein kleiner Sohn gehen
  w\u00fcrden! Er wusste, dass ihre ewige Zukunft bei Gott ist, war er doch der Mann,
  der geschrieben hat: \u00bbNur G\u00fcte und Huld werden mir folgen alle Tage meines
  Lebens; und ich werde wohnen im Haus des HERRN immerdar\u00ab (Psalm 23,6).\\n\\nUnd
  es war David, der sagte: \u00bbIch aber werde dein Angesicht schauen in Gerechtigkeit,
  werde ges\u00e4ttigt werden, wenn ich erwache, mit deinem Bild\u00ab (Psalm 17,15).\\n\\nIn
  Psalm 16 schrieb David: \u00bbDarum freut sich mein Herz und frohlockt meine Seele.
  Auch mein Fleisch wird in Sicherheit ruhen. Denn meine Seele wirst du dem Scheol
  nicht \u00fcberlassen, wirst nicht zugeben, dass dein Frommer die Verwesung sehe.
  Du wirst mir kundtun den Weg des Lebens; F\u00fclle von Freuden ist vor deinem Angesicht,
  Lieblichkeiten in deiner Rechten immerdar\u00ab (Psalm 16,9-11).\\n\\nDavid war
  sich sicher, nach seinem Tod in die nahe Gegenwart Gottes zu gelangen, und er wusste
  auch, dass dies die ewige Heimat f\u00fcr sein Baby sein w\u00fcrde.\\n\\nEine Geschichte
  mit ganz anderem Ausgang\\n\\nDas von Bathseba geborene Kind war nicht Davids einziger
  Sohn. Er hatte weitere S\u00f6hne, zu denen auch Absalom geh\u00f6rte, der schon
  erwachsen war, als dieses Baby zur Welt kam. Absalom wandte sich sp\u00e4ter gegen
  seinen Vater und zettelte eine politische Revolte gegen ihn an. Er fluchte seinem
  Vater und zwang ihn, den Thron in Jerusalem zu verlassen. Er gab sich nicht einmal
  damit zufrieden, dass er David aus der Stadt verjagt hatte, sondern verfolgte ihn
  weiter mit der Absicht, ihn umzubringen.\\n\\nW\u00e4hrend Absalom seinem Vater
  nachjagte, passte er nicht auf, als er mit seinem Maultier durch den Wald ritt.
  Er blieb mit seinem Kopf in den wirren Zweigen einer Terebinthe h\u00e4ngen. So
  hing er da und konnte sich nicht befreien, um den Erdboden zu erreichen (2. Samuel
  18). Als Joab, einer der Gener\u00e4le Davids, das h\u00f6rte, lief er sofort zum
  Ort des Geschehens, nahm drei Speere und stie\u00df sie durch das Herz des dort
  h\u00e4ngenden Absalom. Dann kamen zehn von Joabs Waffentr\u00e4gern, umringten
  Absalom und erschlugen ihn. Sie schnitten Absaloms toten K\u00f6rper vom Baum los,
  gruben ein tiefes Loch im Wald und beerdigten den Leichnam dort. Dann h\u00e4uften
  sie eine Menge Steine dar\u00fcber.\\n\\nAls der kuschitische Bote vom Schlachtfeld
  zu David kam, fragte dieser sofort: \u00bbGeht es dem J\u00fcngling, dem Absalom,
  wohl?\u00ab Der Bote erwiderte: \u00bbWie dem\\n\\nJ\u00fcngling, so m\u00f6ge es
  den Feinden des K\u00f6nigs, meines Herrn, ergehen und allen, die wider dich aufgestanden
  sind zum B\u00f6sen!\u00ab Der K\u00f6nig wusste sofort, dass sein Sohn tot war.
  Dann teilt uns die Bibel mit: \u00bbDa wurde der K\u00f6nig sehr bewegt, und er
  stieg hinauf in das Obergemach des Tores und weinte; und w\u00e4hrend er ging, sprach
  er also: \u203aMein Sohn Absalom! Mein Sohn, mein Sohn Absalom! W\u00e4re ich doch
  an deiner statt gestorben! Absalom, mein Sohn, mein Sohn!\u2039\u00ab (2. Samuel
  18,32-33).\\n\\nDavid weinte hemmungslos und klagte untr\u00f6stlich wegen Absalom.
  Was eigentlich ein Tag des Sieges \u00fcber einen Todfeind war, wurde zu einem Tag
  grenzenlosen und bitteren Klagens. Schnell verbreitete sich die Kunde, dass der
  K\u00f6nig wegen seines Sohnes trauerte ( vgl. 2. Samuel 19,2). David bedeckte sein
  Angesicht und weinte unaufh\u00f6rlich, als die Soldaten in die Stadt zur\u00fcckkehrten:
  \u00bbO, mein Sohn Absalom! O, Absalom, mein Sohn, mein Sohn!\u00ab (2. Samuel 19,4).\\n\\nWelch
  ein Unterschied zu Davids Reaktion auf den Tod seines kleinen Sohnes von der Bathseba.
  Da h\u00f6rte David zu klagen auf, als Bathsebas Baby gestorben war; hier fing er
  zu klagen an, als Absalom tot war. Worin bestand der Unterschied? David wusste das
  Baby bei Gott, wo es f\u00fcr ewig in seiner himmlischen Gegenwart sein w\u00fcrde.
  Und er wusste, dass Absalom, sein b\u00f6ser und erwachsener Sohn, als Aufr\u00fchrer
  nicht dort war. David konnte hoffnungsvoll der\\n\\nWiedervereinigung mit seinem
  kleinen Sohn ent\u00ad gegen\u00adsehen; aber er hatte keine Hoffnung, dem b\u00f6sen
  Absalom noch einmal zu begegnen.\\n\\nDavid klagte daher untr\u00f6stlich \u00fcber
  Absalom, so wie alle Eltern \u00fcber ein Kind klagen w\u00fcrden, das sich gegen
  Gott aufgelehnt hat und, ohne f\u00fcr seine S\u00fcnde Bu\u00dfe getan zu haben,
  gestorben ist.\\n\\nSollen wir klagen oder jubeln?\\n\\nIch glaube, dass wir die
  folgenden Lektionen aus diesen Ereignissen im Leben des K\u00f6nigs David lernen
  k\u00f6nnen:\\n\\n* Wenn Sie ein kleines Kind haben, das stirbt, dann richten Sie
  Ihren Blick nicht so sehr auf Ihren menschlichen Verlust, sondern vielmehr auf dessen
  ewigen Gewinn. Ihr Kind hat die ewige Herrlichkeit erreicht. Das Kleine ist ewig
  geborgen und sicher in Gottes Armen, es lebt ewig, hat seine volle Reife erlangt
  und ist Christus gleich.\\n* Besonders im Blick auf diejenigen, die im Mutterleib,
  bei der Geburt oder als ganz kleines Kind sterben, sollten Sie sich freuen. Solch
  ein Kind hat die Bosheit dieser Welt gar nicht kennengelernt. Ihr Kind hat nicht
  gegen Versuchungen ank\u00e4mpfen m\u00fcssen und wurde nicht die Zielscheibe innerer
  s\u00fcndiger Begierden.\\n* Ihr kleines Kind hat sein Leben nicht verloren, sondern
  vielmehr das ewige Leben gewonnen.\\n\\nRichten Sie Ihre Aufmerksamkeit\\n\\nauf
  Ihre lebenden Kinder\\n\\nGenauso wie Sie sich wegen Ihres Kindes freuen sollen,
  das beim Herrn ist, sollten Sie sich um Ihre Kinder k\u00fcmmern, die leben und
  noch nicht glauben bzw. die rettende Gnade Jesu Christi noch nicht angenommen haben.\\n\\nUnsere
  Tr\u00e4nen sollten denen gelten, die Jesus Christus noch nicht als ihrem Herrn
  folgen. Richten Sie Ihre Gebete auf Ihre Kinder, die alt genug sind, das Evangelium
  anzunehmen oder zu verwerfen. \u00dcbersch\u00fctten Sie diese mit Ihrer Liebe.
  Nehmen Sie die M\u00f6glichkeiten und auch die Verantwortung wahr, die Sie haben,
  um ihnen die Liebe und Barmherzigkeit Christi Jesu \u00fcberzeugend nahezubringen.
  Dr\u00e4ngen Sie diese, ihre S\u00fcnden zu bekennen und sich die allein in Christus
  vollbrachte Rettung zu eigen zu machen. Bitten Sie diese ernstlich, sich mit Gott
  vers\u00f6hnen zu lassen (2. Korinther 5,20).\\n\\nWir haben die Aufgabe, unseren
  lebenden Kindern in allem ein gutes Beispiel zu geben. Wir sind beauftragt, sie
  so gut wie m\u00f6glich in der Zucht und Ermahnung des Herrn zu erziehen, sie mit
  Fr\u00f6mmigkeit zu gewinnen, ihnen die Wahrheit des Evangeliums vor Augen zu stellen
  und unaufh\u00f6rlich f\u00fcr sie zu beten. Es ist unsere wichtigste Aufgabe, alle
  unsere Kinder, die Geburt und Kleinkindalter \u00fcberleben und ins Jugendalter
  eintreten, f\u00fcr die Ewigkeit bereit zu\\n\\nmachen, wenn Gott eines Tages auch
  sie heimrufen wird.\\n\\nPr\u00fcfen Sie Ihr eigenes Herz!\\n\\nWie w\u00fcrden
  Sie pers\u00f6nlich die Frage beantworten: \u00bbWerde ich mein kleines Kind wiedersehen?\u00ab
  Die Antwort h\u00e4ngt davon ab, ob Sie selbst gl\u00e4ubig sind und den Herrn Jesus
  Christus als Ihren Retter an\u00ad genommen haben. Ob Sie sich auf die Wiedervereinigung
  mit dem verstorbenen kleinen Kind freuen d\u00fcrfen, h\u00e4ngt davon ab, ob Sie
  sich sicher sind, dahin zu kommen, wo es jetzt ist. David hatte diese Zuversicht.
  Sie auch?\\n\\nNirgends in der Heiligen Schrift liest man etwas dar\u00fcber, dass
  die kleinen Kinder das Leben ihrer Eltern hier auf Erden wahrnehmen, oder dass jene
  Kinder Einfluss darauf nehmen, was ihren Eltern hier zust\u00f6\u00dft. Die Annahme,
  die Sicherheit eines Kindes in Gottes Armen w\u00fcrde irgendwie zur Errettung der
  Eltern f\u00fchren, ist eine falsche Hoffnung.\\n\\nIhr Kind wird Sie einst in der
  Ewigkeit nur begr\u00fc\u00dfen, wenn Sie an Christus Jesus geglaubt und ihn als
  Ihren pers\u00f6nlichen Heiland angenommen haben. Das Evangelium fordert Sie auf,
  Ihre S\u00fcnden zu bereuen und Ihr Vertrauen auf Christus als den einzigen Erretter
  zu setzen. Es gibt f\u00fcr Sie keine Hoffnung, Ihr Kind im Himmel wiederzusehen,
  bevor Sie nicht Christus im Glauben angenommen haben.\\n\\nEine Frage mag in solchen
  Herzen aufkommen, die schwerwiegende S\u00fcnden begangen haben, welche mit dem
  Tod ihres Kindes zusammenh\u00e4ngen, und nun fragen: \u00bbKann Gott mir vergeben,
  was ich getan habe? Kann Gott mir vergeben, wie ich mich an meinem Kind vergangen
  habe?\u00ab Diese Fragen treiben wohl viele Eltern um, deren Kinder durch Vernachl\u00e4ssigung,
  Vers\u00e4umnisse, Misshandlungen oder absichtliche Abtreibungen starben.\\n\\nWenn
  solche Fragen Sie qu\u00e4len, habe ich eine gute Nachricht f\u00fcr Sie. Die Bibel
  verspricht v\u00f6llige und umsonst geschenkte Vergebung f\u00fcr alle, die durch
  Christus Gottes Gnade suchen:\\n\\n* \u00bbKommt denn und lasst uns miteinander
  rechten\u00ab, spricht der HERR. \u00bbWenn eure S\u00fcnden wie Scharlach sind,
  wie Schnee sollen sie wei\u00df werden; wenn sie rot sind wie Karmesin, wie Wolle
  sollen sie werden\u00ab (Jesaja 1,18).\\n* Der Gottlose verlasse seinen Weg und
  der Mann des Frevels seine Gedanken; und er kehre um zu dem HERRN, so wird er sich
  seiner erbarmen, und zu unserem Gott, denn er ist reich an Vergebung (Jesaja 55,7).\\n*
  Das Wort ist gewiss und aller Annahme wert, dass Christus Jesus in die Welt gekommen
  ist, S\u00fcnder zu erretten, von welchen ich der Erste bin (1. Timotheus 1,15).\\n\\nHier
  m\u00f6chte ich Ihnen die ergreifende Geschichte einer Frau erz\u00e4hlen:\\n\\nJulene
  war erst zwanzig Jahre alt, als sie eine Abtreibung vornehmen lie\u00df. Ihr tat
  ihre Handlungsweise \u00fcberhaupt nicht leid \u2013 damals, als die Abtreibung
  stattfand. Sie verbrachte das erste Studienjahr in einem \u00bbAuslandsprogramm\u00ab,
  wo sie sich in einen Mitstudenten verliebte, der aus noch einem anderen Land an
  diese Universit\u00e4t gekommen war. Sie und ihr Freund teilten sich zwei Monate
  lang eine Wohnung, als sie feststellte, dass sie schwanger war.\\n\\nAm gleichen
  Tag, an dem ihre Schwangerschaft festgestellt wurde, entschloss sich Julene zur
  Abtreibung. Sie sagte ihrem Freund erst etwas von ihrer Entscheidung, als die Prozedur
  vor\u00fcber war. So ging sie einfach in eine Klinik, die eine Freundin ihr empfohlen
  hatte, schob alle dort angebotenen Ratschl\u00e4ge beiseite und plante die Operation
  gleich f\u00fcr den n\u00e4chsten Tag. Wie Sie vielleicht vermuten, beendeten Julene
  und ihr Freund ihre Beziehung, kurz nachdem er erfahren hatte, was geschehen war,
  und beide fuhren zwei Monate sp\u00e4ter in ihre jeweiligen Heimatl\u00e4nder zur\u00fcck,
  ohne jemals wieder Kontakt miteinander zu haben. Was Julene anging, f\u00fchlte
  sie sich bei der R\u00fcckkehr nach Hause unglaublich viel \u00e4lter und kl\u00fcger.
  Dennoch versp\u00fcrte sie eine eigenartige Traurigkeit, Depression und Unruhe \u2013
  mehr als je zuvor.\\n\\nSelbst in ihrer Traurigkeit versuchte sich Julene einzureden,
  dass es f\u00fcr sie in Wirklichkeit keine andere M\u00f6glichkeit gegeben hatte.
  Sie konnte sich nicht vorstellen, wie sie ihren Eltern h\u00e4tte beibringen k\u00f6nnen,
  dass sie schwanger war, oder auch, dass sie einen Freund hatte, mit dem sie eine
  sexuelle Beziehung be\u00ad gonnen hatte. Julene war in einem christlichen Eltern\u00ad
  haus gro\u00df geworden, und sie wusste, dass ihre Eltern ganz davon ausgingen,
  dass sie sich w\u00e4hrend ihrer Auslandsstudienzeit in allem so verhalten hatte,
  wie es von ihr erwartet wurde. Die Eltern h\u00e4tten sich nicht vorstellen k\u00f6nnen,
  dass sie ges\u00fcndigt hatte \u2013 und dann noch bis zu welchem Grad. Daher konnte
  Julene es nicht \u00fcber sich bringen, ihnen alles zu erz\u00e4hlen.\\n\\nSie versuchte
  sich auch einzureden, der F\u00f6tus, den sie abgetrieben hatte, sei eben nur ein
  \u00bbF\u00f6tus\u00ab ge\u00ad wesen. Sie durfte sich nicht gestatten, das Wort
  Baby zu benutzen. Auch versuchte sie sich einzureden, dass es f\u00fcr sie absolut
  keine M\u00f6glichkeit gegeben h\u00e4tte, ein Baby aufzuziehen, nicht einmal mithilfe
  von Freunden. Immerhin brauchte sie noch ein Jahr, um das College zu absolvieren,
  einen Beruf zu ergreifen und einen zuk\u00fcnftigen Ehemann zu finden. Sie fasste
  die gesamte romantische Beziehung, die sexuelle Verbindung und die Abtreibung unter
  dem Begriff \u00bbeine schlimme Erfahrung\u00ab zusammen und versuchte, sie der
  Einsamkeit zuzuschreiben, die sie im Ausland empfunden hatte, und dem \u00f6ffentlichen
  Klima in sexuellen Fragen, das den gesamten Campus beherrschte, wo sie studiert
  hatte. \u00dcberdies: Die \u00bbChemie\u00ab stimmte so \u00fcberw\u00e4ltigend
  zwischen dem jungen Mann und ihr, dass sie sich von ihm verf\u00fchren lie\u00df.
  Sie versuchte sich davon zu \u00fcberzeugen, dass sie nur getan hatte, was jede
  vern\u00fcnftige Zwanzigj\u00e4hrige in ihrer Situation getan h\u00e4tte, und dass
  sie verantwortlich und als Erwachsene gehandelt habe.\\n\\nJa, sie versuchte immer
  wieder, sich selbst von alldem zu \u00fcberzeugen; aber tief in ihrem Innern blieb
  sie bek\u00fcmmert. Sie nahm betr\u00e4chtlich ab; aber anstatt da\u00ad durch alarmiert
  zu werden, freute sich Julene, dass sie jetzt weniger wog als zu der Zeit, da sie
  ins Ausland gegangen war. Ihre Eltern und andere machten ihr Komplimente, dass sie
  noch nie so \u00bbh\u00fcbsch und schlank\u00ab wie jetzt im letzten Studienjahr
  am College gewesen sei. Doch dann, an dem Tag im Oktober, an dem ihr Baby h\u00e4tte
  zur Welt kommen sollen, erlitt sie einen gef\u00e4hrlichen Zusammenbruch. Sie war
  zu Hau\u00adse, weil sie ihre Eltern zum Wochenende besuchen woll\u00ad \u00adte.
  Dort sah sie ein junges Paar, das mit einem Ba\u00adby im Kinderwagen auf dem B\u00fcrgersteig
  vor\u00fcberging. Ohne Vorwarnung brachen tief in ihrem Herzen solche Gef\u00fchle
  auf, dass sie unkontrolliert zu schluchzen begann. Sie war kaum zu tr\u00f6sten.
  Als es ihrer Mutter schlie\u00dflich gelungen war, sie in den Armen zu halten und
  zu beruhigen, fragte sie: \u00bbBist du krank, Liebes?\u00ab\\n\\nJulene erwiderte,
  sie habe sich seit mehreren Monaten unwohl gef\u00fchlt, als habe sie mit einer
  Infektion oder\\n\\n\u00c4hnlichem zu k\u00e4mpfen. Am n\u00e4chsten Tag gingen
  Julene und ihre Mutter zu ihrem Hausarzt. Nach einigen Tagen erfuhr Julene, dass
  sie tats\u00e4chlich mit einer Infektion zu k\u00e4mpfen hatte, die zur Zeit der
  Abtreibung begonnen hatte. Au\u00dferdem erfuhr sie, dass sie mit gr\u00f6\u00dfter
  Wahrscheinlichkeit niemals ein Kind w\u00fcrde empfangen und austragen k\u00f6nnen,
  weil diese Infektion so lange unbehandelt geblieben war. Die medizinische Behandlung,
  der sie sich im Ausland unterzogen hatte, war nicht ann\u00e4hernd so gut verlaufen,
  wie Julene es erwartet hatte. Im Gegenteil: Man hatte ihr dabei bleibenden Schaden
  zugef\u00fcgt. W\u00e4hrend der n\u00e4chsten paar Tage sagte Julene ihren Eltern
  die ganze Wahrheit \u00fcber die Schwangerschaft und die Abtreibung. Sie unterzog
  sich im \u00f6rtlichen Krankenhaus einer Ausschabung der Geb\u00e4rmutter und begann
  mit einem antibakteriellen Therapiezyklus.\\n\\nZu Julenes Verwunderung erwiesen
  sich ihre Eltern als bemerkenswert und wahrhaft verst\u00e4ndnisvoll und vergebungsbereit
  \u2013 nat\u00fcrlich, nachdem sie den ersten Schreck \u00fcberwunden hatten. Sie
  umgaben ihre Tochter mit Liebe und luden sie ein, nach Hause zu kommen, wo ihre
  Mutter ihr nahrhafte Speisen zubereitete und sie mit gro\u00dfer F\u00fcrsorge umgab,
  damit sie wieder zu Kr\u00e4ften kam. Julene war dankbar f\u00fcr ihre Unterst\u00fctzung,
  denn das half ihr, dem Unterricht zu folgen und f\u00fcr die Pr\u00fcfungen zu lernen.
  Sie k\u00e4mpfte tapfer, um das Herbstsemester mit passablen Noten zu meistern.\\n\\nIm
  n\u00e4chsten Semester hatte Julene einen gro\u00dfen Teil ihrer k\u00f6rperlichen
  Kr\u00e4fte und ihres emotionalen Wohlbefindens zur\u00fcckgewonnen. Sie hatte sich
  geweigert, in die Gemeinde zur\u00fcckzukehren, nachdem die Wahrheit \u00fcber ihre
  Schwangerschaft und die Abtreibung bekannt geworden war, und ihre Eltern \u00fcbten
  auch keinen Druck auf sie aus. Um Ostern herum begann sie jedoch wieder, die Gottesdienste
  zu besuchen. Sie bekannte ihrer Mutter: \u00bbIch kann nicht aufh\u00f6ren, daran
  zu denken, mein Baby ermordet zu haben. Ich kam mir prima vor, als ich annahm, nur
  einen \u203aF\u00f6tus\u2039 in mir zu haben; als ich aber das Paar mit seinem Baby
  spazieren gehen sah, wurde ich pl\u00f6tzlich von dem Gedanken \u00fcberw\u00e4ltigt,
  dass ich mit einem Baby schwanger war. Es war das erste Mal nach der Abtreibung,
  dass ich ohne Aufh\u00f6ren geweint habe.\u00ab W\u00e4hrend sie trauerte und Gottes
  Vergebung suchte, begann ihre Heilung.\\n\\nGott hat Julene vergeben, und sie kann
  sich freuen, mit ihrem Kind einmal im Himmel vereint zu werden. Heute hat sie Hoffnung
  und ist nicht mehr verzweifelt. Sie hat die Freiheit, Gott voll und ganz zu dienen,
  weil sie wei\u00df, dass ihr vergeben wurde. Es erfreut sie, an ihr Kind zu denken,
  es zu lieben und den Tag zu erwarten, an dem sie ihrem Kind begegnet, statt Angst
  und Furcht zu empfinden.\\n\\nKann Gott einem Menschen vergeben, der ein Kind umgebracht
  hat, noch dazu sein eigen Fleisch und Blut? Ja, Gottes Gnade bedeckt die gr\u00f6\u00dften
  S\u00fcnden.\\n\\nWenn Sie glauben, in irgendeiner Weise an dem Tod Ihres Kindes
  schuld zu sein, dann ist nicht die Frage: \u00bbKann Gott mir das vergeben?\u00ab,
  sondern vielmehr: \u00bbWill ich Gottes Vergebung annehmen?\u00ab Wollen Sie Gottes
  frei angebotene Barmherzigkeit und Gnade in Jesus Christus annehmen? Wollen Sie
  mit Gott vers\u00f6hnt werden (2. Korinther 5,20)?\\n\\nUnd dann, wenn Sie Gottes
  Vergebung angenommen haben, erhebt sich die Frage: Wollen Sie fortan ein Leben f\u00fchren,
  das vom Gehorsam gegen\u00fcber seinen Geboten gekennzeichnet ist und von dem Entschluss,
  nicht mehr zu s\u00fcndigen (Johannes 8,11)? Das sind Herausforderungen, vor die
  Eltern nach dem Tod eines Babys gestellt werden, an dem sie sich irgendwie schuldig
  f\u00fchlen.\\n\\nWerden Sie Ihr Kind wiedersehen?\\n\\nWenn Sie Jesus als Ihren
  Retter angenommen und seine Vergebung erfahren haben, lautet die Antwort: Ja, Sie
  werden es wiedersehen.\\n\\nDer Tod Ihres Kindes und die Errettung Ihrer anderen
  Kinder\\n\\nDer Tod eines Kindes wirkt sich stark auf die anderen Geschwister einer
  Familie aus \u2013 nicht nur auf diejenigen, die beim Tod des Kindes schon lebten,
  sondern auch auf sp\u00e4ter geborene. Auf mancherlei Weise kann der Tod eines Kindes
  f\u00fcr die Geschwister der Ausl\u00f6ser sein, den Herrn anzunehmen.\\n\\nNeulich
  h\u00f6rte ich die Geschichte einer Frau namens Sandra. Weil ihre Geschichte viele
  von den in diesem Buch schon mitgeteilten Wahrheiten enth\u00e4lt, m\u00f6chte ich
  sie ausf\u00fchrlich erz\u00e4hlen. Das Ende der Geschichte ist meiner Meinung nach
  \u00e4u\u00dferst ermutigend!\\n\\nSandra war im sechsten Schwangerschaftsmonat,
  als ohne Vorwarnung die Plazenta in ihrer Geb\u00e4rmutter riss, und in weniger
  als einer Stunde fand sie sich in der Notaufnahme eines Krankenhauses wieder \u2013
  ohne ihr Kind. Die sie betreuenden \u00c4rzte und Schwestern versuchten, sie aufzumuntern,
  indem sie erkl\u00e4rten, es sei beinahe ein Wunder, dass bei dieser Fehlgeburt
  keine weiteren Komplikationen aufgetreten seien. Als ihr Ehemann h\u00f6rte, dass
  sie auf dem Weg ins Krankenhaus sei, eilte er von seiner Arbeitsstelle sofort zu
  ihr und tr\u00f6stete sie so gut er konnte. Ihre Schwester weinte mit ihr zusammen.\\n\\n\u00bbAber
  dann\u00ab, sagte Sandra sp\u00e4ter dem Pastor, \u00bbals ich das Krankenhaus verlie\u00df,
  meinte jeder, dass alles wieder in Ordnung sei. Sie hatten alle die Haltung: \u203aDas
  ist vorbei!\u2039, und: \u203aJetzt ist dies dran.\u2039 Niemand \u2013 nicht einmal
  meine Schwester oder mein Mann \u2013 wollte \u00fcber die Schwangerschaft reden.
  Alle taten, als sei das Baby, das ich ausgetragen hatte, gar kein Mensch \u2013
  gar kein Leben \u2013 gewesen, weil es nie geboren wurde.\\n\\n\u00bbSie schienen
  nicht zu begreifen, dass dieses kleine M\u00e4dchen f\u00fcr mich in jeder Beziehung
  ein Mensch war. Ich sang ihr Lieder vor und sprach mit ihr von fr\u00fch\\n\\nbis
  sp\u00e4t. Au\u00dferdem sp\u00fcrte ich, wie es gegen meine Bauchdecke trat. Ich
  hatte es Rosemarie genannt.\\n\\nEs machte nichts aus, dass ich drei gesunde Kinder
  hatte, als ich mit Rosemarie schwanger wurde. Die Leute sagten dauernd: \u203aDu
  hast eine so wunderbare Familie\u2039 \u2013 so als wollten sie mich \u00fcberzeugen,
  Gott h\u00e4tte gesagt: \u203aGenug ist genug.\u2039 Sie schienen nicht zu begreifen,
  dass ich dieses kleine M\u00e4dchen genauso sehr haben wollte wie die drei anderen
  Kinder. Sie war kein Zufallsprodukt. Sie war geplant, erw\u00fcnscht und hei\u00df
  \u203aerwartet\u2039 als Baby und Familienmitglied.\u00ab\\n\\nSandra hatte ihren
  Pastor aufgesucht, weil sie merkte, dass sie immer noch \u00fcber den Verlust des
  ungeborenen Kindes trauerte, und dies vier Monate nach der Fehlgeburt. Sie war tief
  betr\u00fcbt und empfand eine st\u00e4ndige Teilnahmslosigkeit, die sie nicht absch\u00fctteln
  konnte. Ihr Arzt hatte sie f\u00fcr gesund erkl\u00e4rt und gesagt, sie k\u00f6nnte
  sehr wohl noch ein Kind empfangen, wenn sie es denn wollte. Sandra war gar nicht
  daran interessiert, diese Botschaft zu h\u00f6ren \u2013 sie war viel zu traurig,
  ihr fehlte dieses Neugeborene auf ihren Armen. Schlie\u00dflich gab ihr der Arzt
  Arzneien gegen ihre Depression. Zu diesem Zeitpunkt suchte Sandra einen Seelsorger
  in ihrer Gemeinde auf.\\n\\nGl\u00fccklicherweise vertraute Sandra ihre Geschichte
  einem Pastor an, der wusste, dass Sandras Baby im Himmel war, eine vollkommene Person,
  die Gott an\u00ad betete und die Vollendung eines ewigen Lebens in\\n\\nseiner Gegenwart
  genoss. Er beklagte mit Sandra den Verlust der kleinen Rosemarie, und dann planten
  die beiden einen ganz schlichten Gebetsgottesdienst, zu dem Sandra ihren Mann, die
  Schwester und die anderen Kinder einlud. Obwohl der J\u00fcngste der Geschwister
  erst zwei Jahre alt war, hatte Sandra das Gef\u00fchl, er geh\u00f6re zum Kreis
  der Familie, die zusammenkam, um Gott zu preisen, dass ihre Schwester Rosemarie
  im Himmel war. Der Gottesdienst wurde in der folgenden Woche am Sonntagnachmittag
  in der Ab\u00ad geschiedenheit einer kleinen Kapelle abgehalten.\\n\\nSp\u00e4ter
  sagte Sandra: \u00bbDieser schlichte Gottesdienst, der vielleicht nicht l\u00e4nger
  als eine Viertelstunde dauerte, brachte wunderbaren Frieden in mein Herz. Mein Mann
  und meine Schwester hatten ein neues Ver\u00adst\u00e4ndnis daf\u00fcr bekommen,
  wie ich von meinem ungeborenen Kind dachte. Und was mich betrifft, war mit diesem
  Gottesdienst mein Kummer endg\u00fcltig vorbei. Von diesem Nachmittag an hatte ich
  eine andere Blickrichtung und erneuerte Lebensfreude. Ich hatte den Eindruck, dass
  jetzt alles auf eine Weise voranging, die ich nicht beschreiben kann. Es war, als
  h\u00e4tte Rosemarie in einer formalen, geistlichen Weise \u203aanerkannt\u2039
  werden m\u00fcssen, damit ich sie ganz dem Himmel \u00fcberlassen und selbst mein
  Leben auf der Erde fortsetzen konnte.\u00ab\\n\\nIm n\u00e4chsten Jahr war Sandra
  wieder schwanger. Dies\u00admal konnte sie das Kind voll austragen und\\n\\nbrach\u00adte
  einen gesunden Jungen zur Welt. Zwei Jahre sp\u00e4ter wurde Sandra und ihrem Mann
  Cliff eine weitere Tochter geboren.\\n\\nSandra sagte vor Kurzem: \u00bbJemand meinte
  neulich, dass unsere Kinder altersm\u00e4\u00dfig wie Treppenstufen sind \u2013
  dreizehn, elf, neun und dann der Sprung zu f\u00fcnf und drei. Ich sagte: \u203aJa,
  es scheint, als h\u00e4tten wir mit der Pr\u00e4zision eines Uhrwerks alle zwei
  Jahre ein Kind \u2013 und ihre Geburtstage sind alle im M\u00e4rz und im April!
  Das Kind, das jetzt gerade sieben w\u00e4re, ist Rosemarie. Sie ist im Himmel.\u2039\u00ab\\n\\nSandra
  hat recht, wenn sie sagt: \u00bbIch habe sechs Kinder. F\u00fcnf auf dieser Erde,
  und eins schon ewig geborgen und sicher in Gottes Armen.\u00ab Eines der Wunder,
  das von Rosemaries Leben ausging, passierte erst k\u00fcrzlich. Sie beschrieb es
  so: \u00bbUnsere \u00c4lteste, Stacie, kam vor einigen Monaten zu uns und sagte:
  \u203aMama und Papa, ich muss euch sagen, was auf der Gemeindefreizeit passiert
  ist. Ich habe mein Leben an einem Abend w\u00e4hrend der Gebets\u00adandacht Gott
  \u00fcbergeben; und ich wei\u00df, dass ich nun von Neuem ge\u00adboren bin und
  dass ich die Ewigkeit bei Jesus im Himmel verbringen werde. Der Prediger auf der
  Freizeit sagte uns, wir m\u00fcssten es unseren Eltern mit\u00adteilen, wenn wir
  zum Glauben an Jesus als unseren Heiland ge\u00ad kommen sind.\u2039\\n\\nWir freuten
  uns sehr mit Stacie, wie ihr euch vorstellen k\u00f6nnt, und wir waren als Eltern
  begeistert, dass\\n\\nsie diesen sehr reifen Schritt einer v\u00f6lligen Lebens\u00fcbergabe
  an Christus getan hatte. Aber erstaunt waren wir doch, als sie sagte: \u203aEins
  der Dinge, \u00fcber die ich nachgedacht habe, war Rosemarie. Ich meinte, wenn ich
  jemals meine kleine Schwester sehen wollte, m\u00fcsste ich Jesus als meinen Herrn
  und Retter anneh\u00ad men und f\u00fcr ihn leben, weil Rosemarie schon im Him\u00ad
  mel ist und ganz und gar f\u00fcr ihn lebt.\u2039 Mein Herz w\u00e4re fast zersprungen.
  Ich wusste gar nicht, dass sich Stacie \u00fcberhaupt noch an Rosemarie erinnern
  konnte. Sp\u00e4ter erz\u00e4hlte Stacie ihren Br\u00fcdern Max und Joey von ihrer
  Entscheidung. Zu unserem Erstaunen erinnerte sich Max auch noch an den Gottesdienst,
  den wir f\u00fcr Rosemarie gehalten hatten. Beide Jungen fingen an, nach \u203aihrer
  Schwester im Himmel\u2039 zu fragen. Auf seltsame Weise hat Rosemarie f\u00fcr ihre
  Geschwister die Ma\u00dfst\u00e4be gesetzt. Sie ist beim Herrn und dient Jesus v\u00f6llig
  \u2013 und das fordert ihre Geschwister heraus, auch an den Herrn Jesus zu glauben,
  damit sie einmal beim Herrn sein und sie wiedersehen werden. Rosemarie ist f\u00fcr
  unsere anderen Kinder so etwas wie ein unsichtbarer Evangelist. Ich preise Gott
  daf\u00fcr!\u00ab\\n\\nWerden Ihre anderen Kinder ihren Bruder oder ihre Schwester
  im Himmel wiedersehen? Das ist eine gro\u00ad \u00dfe, wichtige Frage, die ihnen
  gestellt werden muss!\\n\\nWie ist das Leben meines Kindes im Himmel?\\n\\nEine
  der gro\u00dfen Trag\u00f6dien unserer Tage wird mittlerweile \u00bbPl\u00f6tzlicher
  Kindstod\u00ab genannt. Obwohl bestimmte Risikofaktoren bekannt sind, wei\u00df
  niemand mit Sicherheit, wodurch er ausgel\u00f6st wird oder was getan werden kann,
  um zu verhindern, dass ein Kind von ihm betroffen wird. Ein Ehepaar aus unserer
  Gemeinde, Jonathan und Stephanie, kennen das Leid, ein Kind auf diese Weise zu verlieren.
  Jonathan schrieb mir einige Jahre sp\u00e4ter von der tragischen Nacht, in der sein
  Sohn starb. Gott hatte Jonathan jedoch inzwischen viel Gnade und Kraft verliehen:\\n\\nW\u00e4hrend
  ich durch die k\u00fchle Septembernacht hinter dem Notfallauto herraste, gewann
  pl\u00f6tzlich R\u00f6mer 8,28 f\u00fcr mich einen gro\u00dfen Realit\u00e4ts\u00ad
  bezug. Erst wenige Minuten zuvor hatte ein furcht\u00ad barer Schreck mein Herz
  erfasst, als ich unser dreieinhalb Monate altes S\u00f6hnchen, Stephen Paul, leblos
  in seiner Wiege fand. Nach wilden Telefonaten und verzweifelten Herz-Lungen-Wiederbelebungsma\u00dfnahmen
  war unser Sohn pl\u00f6tzlich inmitten eines Wirbels von Blaulicht und heulenden
  Sirenen auf dem Weg zur Krankenhaus-Notaufnahme. \u00bbWir wissen aber, dass denen,
  die Gott lieben, alle Dinge zum Guten mitwirken, denen,\\n\\ndie nach Vorsatz berufen
  sind.\u00ab W\u00e4hrend wir uns diesen Bibelvers immer und immer wieder aufsagten,
  bekamen wir die beruhigende Gewissheit, dass Gott es gut mit uns meinte, was immer
  uns auch zusto\u00dfen w\u00fcrde. Wir glaubten von ganzem Herzen, dass Gottes Macht
  unseren Sohn wiederbeleben w\u00fcrde. Wir glaubten, dass Gott souver\u00e4n die
  Wacht \u00fcber uns hielt. Unser Glaube wurde gest\u00e4rkt.\\n\\nNach einer uns
  endlos erscheinenden Nacht wurden wir am n\u00e4chsten Morgen von einer Schar gl\u00e4ubiger
  Br\u00fcder und Schwestern begr\u00fc\u00dft \u2013 von Freunden, die uns fortan
  treu und unerm\u00fcdlich dienten. Unsere Hoffnungen hatten sich zerschlagen. Unser
  Sohn war gestorben. Und als wir versuchten, mit dieser Realit\u00e4t fertig zu werden,
  fanden wir uns in einer tieferen Realit\u00e4t wieder: Unser Sohn war in der Gegenwart
  Christi und hatte sein ewiges Leben begonnen, ein Leben der Anbetung vor dem Thron
  des Herrn. Meine ersten Gedanken an jenem Morgen entstammten dem Lied: \u00bbMeine
  Hoffnung liegt im Herrn\u00ab, und besonders dachte ich an die Zeile: \u00bbEr starb
  f\u00fcr mich, er lebt f\u00fcr mich, und ew''ges Licht und Leben gibt er aus Gnaden
  mir.\u00ab Wir tr\u00f6steten uns gegenseitig mit dieser von Gott gegebenen Hoffnung,
  dass unser Sohn uns nicht erhalten wurde, um dadurch an ein Leben der Schmerzen
  und der S\u00fcnde gebunden zu werden, sondern dass er nun gerettet und beim Herrn
  war, wo ihn in Ewigkeit kein Leid treffen w\u00fcrde. Weil wir wirklich an die Wahrheit
  von R\u00f6mer 8,28 glaubten, wussten wir, dass auch dieses tragische Ereignis irgendwie
  zu unserem Guten mitwirken w\u00fcrde und dass es nach Gottes Ratschluss zu seiner
  Verherrlichung gedient hatte.\\n\\nNach weiteren Untersuchungen wurde festgestellt,
  dass der Tod unseres Sohnes ein Fall von \u00bbPl\u00f6tzlichem Kindstod\u00ab war.
  Diese Krankheit ist immer noch ein \u00bbunerkl\u00e4rliches Ereignis\u00ab, denn
  es gibt keine konkreten medizinischen Erkl\u00e4rungen daf\u00fcr, warum die Atmung
  so pl\u00f6tzlich aussetzt. Sobald unser Fall bekannt wurde, bekamen wir von allen
  Seiten Post. Man lud uns zu Gruppentherapiesitzungen ein, wo sich M\u00f6glichkeiten
  boten, mit Eltern in \u00e4hnlicher Lage zusammenzukommen. Au\u00dferdem schickte
  man uns B\u00fccher und Flugbl\u00e4tter, denen wir entnehmen sollten, was aus medizinischer
  Sicht m\u00f6glicherweise zum Tod gef\u00fchrt hat und wie wir diesen Tod h\u00e4tten
  vermeiden k\u00f6nnen. Ganz ehrlich \u2013 vieles von alldem machte uns ziemlich
  hoffnungslos, und wir f\u00fchlten uns schuldig und voller Bangigkeit. Immer wieder
  drehten sich unsere Gedanken um die Frage: \u00bbH\u00e4tten wir unseren Sohn retten
  k\u00f6nnen?\u00ab So hatten wir viele unruhige Augenblicke voller Zweifel und Furcht.
  Die psychologischen\\n\\nAbhandlungen waren f\u00fcr uns sogar noch schlimmer als
  die medizinischen Erkl\u00e4rungen. Die meisten boten uns eine Reihe von Psycho-Strategien
  an, um durch diesen Trauerprozess hindurchzukommen. Doch weil sie verga\u00dfen,
  Jesus Christus einzubeziehen, hinterlie\u00dfen sie bei uns nichts als Leere mit
  der Vermittlung des Gef\u00fchls, als ruhe diese \u00bbTrauerarbeit\u00ab allein
  auf unseren Schultern.\\n\\nImmer wieder hatten wir das Empfinden, als w\u00fcrde
  Satan die weltlichen Tr\u00f6stungsversuche benutzen, um Gottes Verhei\u00dfungen
  anzugreifen. Darum sind wir allen Christenfreunden dankbar, deren Gegenwart und
  Gebete und Worte wahren Trostes uns an Gottes Treue und an seinen souver\u00e4nen
  Plan zu unserem Guten erinnerten. Seine Vors\u00e4tze k\u00f6nnen nicht zuschanden
  werden!\\n\\nUnser Sohn starb am 22. September 1998. Wenn wir all die Lektionen
  \u00fcberdenken, die der Herr uns in den Monaten nach jenem dunklen Tag lehrte,
  staunen wir dar\u00fcber, wie er uns durch diese Erfahrung getragen hat. Wir danken
  ihm f\u00fcr seine Barmherzigkeit und Gnade. Wir werden aber auch stets dankbar
  bleiben f\u00fcr den Dienst, den uns die Gemeinde erwiesen hat, um uns durch diese
  verzweifelte Zeit zu bringen. Nie zuvor habe ich die Kraft des Gebets und die Gegenwart
  Christi so lebendig empfunden. Gott selbst offenbarte sich uns als Zuflucht, Schutz
  und als der Gute Hirte\\n\\nder Psalmen. Er war unser t\u00e4gliches Manna, das
  allein die Leere ausf\u00fcllen konnte, die wir in uns sp\u00fcrten. Wir konnten
  uns ein wenig mit Abraham identifizieren, der Gott unersch\u00fctterlich vertraute,
  selbst als er seinen Sohn opfern sollte.\\n\\nDer Tod unseres Sohnes weckte in uns
  unsere eigene Hoffnung auf den Himmel. Wir brauchten die zeitlichen G\u00fcter dieser
  Welt nicht mehr krampfhaft festzuhalten. Auch wurde unser Verst\u00e4ndnis f\u00fcr
  Gottes souver\u00e4ne Herrschaft \u00fcber alle Dinge ver\u00e4ndert. Wie danken
  wir Gott f\u00fcr dieses Werk der g\u00f6ttlichen Gnade in unserem Leben!\\n\\nWir
  vermissen unseren Sohn. Jeden Tag aufs Neue denken wir daran, wie er jetzt wohl
  w\u00e4re oder was er getan h\u00e4tte. Unsere Entt\u00e4uschung, das Leben nicht
  mit ihm teilen zu k\u00f6nnen, wird aber durch die Verhei\u00dfungen aus Gottes
  Wort sehr gemildert. Auf dem Grab unseres Sohnes steht Judas 24 und 25, wo meiner
  Meinung nach treffend zusammengefasst ist, wie wir Gottes Handeln in dem Verlust
  unseres Sohnes Stephen Paul verstehen: \u00bbDem aber, der euch ohne Straucheln
  zu bewahren und vor seiner Herrlichkeit untadelig darzustellen vermag mit Frohlocken,
  dem alleinigen Gott, unserem Heiland, durch Jesus Christus, unseren Herrn, sei Herrlichkeit,
  Majest\u00e4t, Macht und Gewalt vor aller Zeit und jetzt und in alle Ewigkeit! Amen.\u00ab\\n\\nWir
  haben durch diese Trag\u00f6die eine Reihe von\\n\\nLebenslektionen gelernt, die
  wir auf andere Weise nie h\u00e4tten lernen k\u00f6nnen. Christus \u00e4hnlicher
  zu werden, ist zu unserem einzigen Begehren geworden, bis hin zu jenem Tag der Wiedervereinigung
  mit unserem Sohn im Himmel. An jenem Tag werden wir niederfallen und den Herrn mit
  ihm zusammen anbeten \u2013 und dies f\u00fcr alle Ewigkeit. Was ist dies f\u00fcr
  eine herrliche Hoffnung!\\n\\nJa, welch eine herrliche Hoffnung d\u00fcrfen alle
  Eltern nach dem Tod eines kleinen Kindes haben! Die Hoffnung auf die himmlische
  Herrlichkeit ist tats\u00e4chlich eine herrliche Hoffnung.\\n\\nWie sieht es im
  Himmel aus?\\n\\nIm Laufe der Jahre haben mich viele Menschen gefragt, wie es meiner
  Ansicht nach im Himmel aussieht. Ich sage dann, dort sei es genauso, wie die Bibel
  es beschreibt. Ein Wort beschreibt unser zuk\u00fcnftiges Leben im Himmel: Vollkommenheit.\\n\\nDie
  meisten von uns verstehen, was Vollkommenheit im Allgemeinen bedeutet; wir haben
  aber gro\u00dfe Schwierigkeiten, uns etwas Konkretes vorzustellen, das wirklich
  vollkommen ist. Alles in unserer irdischen Erfahrung tr\u00e4gt in irgendeiner Weise
  den Makel der Mangelhaftigkeit oder Unvollkommenheit. Die gesamte Sch\u00f6pfung
  ringt gegenw\u00e4rtig qualvoll mit den furchtbaren Auswirkungen des S\u00fcndenfluchs
  und wartet auf die Vollendung aller Dinge, wenn dieser Fluch f\u00fcr immer aufgehoben
  sein wird. Von da an wird alles vollkommen sein. Schmerz, Kummer und das Seufzen
  der Sch\u00f6pfung werden ihr Ende gefunden haben. Wir werden Freude und Wonne erleben.
  Kummer und Seufzen werden entfliehen (Jesaja 35,10; R\u00f6mer 8,22).\\n\\nF\u00fcr
  unsere Lieben im Himmel, einschlie\u00dflich unserer kleinen Kinder, ist der Tag
  der Vollkommenheit schon angebrochen. Sie leben dort als heile Personen \u2013 heil
  an Leib und Seele, v\u00f6llig neu und fehlerlos. Der Apostel Johannes schrieb:
  \u00bbGeliebte, jetzt sind wir Kinder Gottes, und es ist noch nicht offenbar geworden,
  was wir sein werden; wir wissen, dass, wenn es offenbar werden wird, wir ihm gleich
  sein werden; denn wir werden ihn sehen, wie er ist\u00ab (1. Johannes 3,2). Alles,
  was wir uns unter Heil und Vollkommenheit Christi vorstellen d\u00fcrfen, geh\u00f6rt
  zu dem Heil und der Vollkommenheit, die unsere Lieben erfahren, die bei ihm in der
  Ewigkeit wohnen.\\n\\nIn dem Augenblick, in dem Ihr Kind Christus er\u00ad\\n\\nblickte,
  war es sofort und ganz und gar vollkommen geworden, v\u00f6llig in das Bild Jesu
  Christi umgestaltet. Ihr Kind hat das Verlangen, Gott zu gefallen, und ein Herz,
  das gern Gott anbetet, ihn preist und ihm dient. Ihr Kind ist von einer Herrlichkeit
  umgeben, die nie vergehen kann. Es ist eine Herrlichkeit, die jetzt an ihm offenbart
  wird (R\u00f6mer 8,18).\\n\\nEins der Wortbilder, welches die Heilige Schrift ge\u00ad
  braucht, um die Himmelsbewohner zu beschreiben, ist das Bild von einem wei\u00dfen
  Gewand. In Offen\u00ad barung 6,11 hei\u00dft es: \u00bbEs wurde ihnen, einem jeden,
  ein wei\u00dfes Gewand gegeben.\u00ab Dieses wei\u00dfe Gewand ist ein Zeichen der
  Heiligkeit und Reinheit und schm\u00fcckt jedes Kind im Himmel.\\n\\nIhr Kind erf\u00e4hrt
  nichts von dem, was wir als menschliche Schw\u00e4che oder S\u00fcndhaftigkeit kennen.
  Der Herr hat in seiner Liebe und Gnade Ihr Kind nach Herz, Seele, Verstand und Leib
  mit der Standardausr\u00fcstung ausgestattet, die zu seiner erhabenen Stellung passt,
  zu der er es erhoben hat. Er hat Ihrem Kind eine solche Vollkommenheit verliehen,
  dass es vor seinem Thron stehen und Gott von Angesicht zu Angesicht schauen darf.\\n\\nEs
  gibt auch keine Wartezeit bis zu dieser Verherr\u00ad lichung, keinen \u00bbSeelenschlaf\u00ab
  und kein Fegefeuer. Nichts in der Heiligen Schrift gibt den geringsten Anlass zu
  solchen Ansichten, und nichts weist darauf hin, dass unserer Verherrlichung nach
  dem Tod irgendetwas Schmerzliches oder Bu\u00dfhandlungen unsererseits vorangehen.
  Im Gegenteil: Christus hat eine vollst\u00e4ndige S\u00fchnung f\u00fcr die S\u00fcnden
  seines Volkes erwirkt (2. Korinther 5,21; 1. Petrus 2,24; 1. Johannes 2,2). Die
  Errettung ist die freie und gnadenreiche Gabe Gottes. Jeder ihrer Aspekte \u2013
  von der Erw\u00e4hlung vor ewigen Zeiten bis zu unserer Verherrlichung\\n\\nin der
  ewigen Zukunft \u2013 ist einzig sein Werk (R\u00f6mer 8,29-30). Die Heilige Schrift
  sagt, dass derjenige, der aus dieser Welt abscheidet, bei Christus ist (Philipper
  1,23). Im Hinschauen auf Christus werden wir ihm gleich werden. Dieser \u00dcbergang
  ist voller Freude und Frieden, ganz ohne Leiden und geschieht in einem Augenblick.
  Der Apostel Paulus schreibt, dass \u00bbausheimisch von dem Leib (zu sein), (bedeutet,)
  einhei- misch bei dem Herrn (zu) sein\u00ab (2. Korinther 5,8).\\n\\nWie sieht die
  vollkommene Seele aus? Die offensichtlichste Wahrheit ist, dass wir endg\u00fcltig
  und g\u00e4nzlich f\u00fcr immer vom B\u00f6sen befreit sein werden. Ihr Kind wird\\n\\n*
  nie selbsts\u00fcchtige W\u00fcnsche haben,\\n* nie unn\u00fctze Worte \u00e4u\u00dfern,\\n*
  nie lieblose Taten ausf\u00fchren,\\n* nie s\u00fcndige Gedanken haben.\\n\\nIhr
  Kind wird v\u00f6llig befreit sein von jeder Versuchung zur S\u00fcnde und wird
  f\u00e4hig sein, alles zu tun, was absolut gerecht und heilig ist. Ihr Kind wird
  nie\\n\\n* Leiden,\\n* Kummer,\\n* Schmerzen erleben.\\n\\nIhr Kind wird nie mehr
  etwas tun, was Gott missf\u00e4llt. Weil Ihr Kind im Himmel ist, wo es keine Spur
  von S\u00fcnde gibt, wird Ihr Kind\\n\\n* frei von Verfolgung,\\n* frei von Trennungen,\\n*
  frei von Uneinigkeit,\\n* frei von Hass,\\n* frei von Zank und Streit,\\n* frei
  von Entt\u00e4uschungen sein.\\n\\nIhr Kind wird niemals weinen, weil es dort nichts
  gibt, was Ihr Kind traurig machen k\u00f6nnte. Ihr Kind wird nie n\u00f6tig haben,
  etwas zu erbitten, zu fasten, zu bereuen oder eine S\u00fcnde zu bekennen, weil
  es dort nichts zu bereuen gibt und nichts, worum man bitten m\u00fcsste!\\n\\nIhr
  Kind wird ein Leben unvorstellbaren Segens genie\u00dfen, und nichts als Segen \u2013
  in alle Ewigkeit.\\n\\nVollkommenes Gl\u00fcck. In Psalm 16,11 hei\u00dft es: \u00bbF\u00fclle
  von Freuden ist vor deinem Angesicht, Lieblichkeiten in deiner Rechten immerdar.\u00ab
  Alles, was uns hier reines Gl\u00fcck und echte Freude bereitet, wird im Himmel
  \u00fcber alle Ma\u00dfen vermehrt zu finden sein. Und weil nichts besser und gr\u00f6\u00dfer
  als Gott ist, wird das v\u00f6llige Gl\u00fcck, beim Vater zu sein, das innerste
  Wesen aller Gl\u00fcckseligkeit Ihres Kindes bilden.\\n\\nVollkommene Erkenntnis.
  Im Himmel wird Ihr Kind vollkommene Erkenntnis besitzen, eine so vollkommene Erkenntnis,
  wie Ihr Kind sie sich nur w\u00fcnschen mag. Ihr Kind wird nie mit einer unbeantworteten
  Frage, mit einem ungel\u00f6sten Problem umherlaufen. Ihr Kind wird v\u00f6llig
  frei von jeder Verwirrung oder Unwissenheit sein.\\n\\nVollkommener Trost. Ihr Kind
  wird nie mehr einen unangenehmen Augenblick erleben. Der Himmel ist der Ort ewiger
  Tr\u00f6stung. Jesus redet in der Geschichte von dem Bettler Lazarus und dem reichen
  Mann davon, dass Lazarus im Himmel \u00bbgetr\u00f6stet\u00ab wurde, w\u00e4hrend
  sich der Reiche in den Qualen des Hades befand (Lukas 16,19-25).\\n\\nVollkommene
  Liebe. Ihr Kind hat die F\u00e4higkeit zu vollkommener Liebe und dazu, vollkommen
  geliebt zu werden. Johannes 13,1 sagt, dass Christus seine J\u00fcnger eis telos
  \u2013 d.h. \u00bbbis zum Ende, bis zur \u00e4u\u00dfersten Vollendung\u00ab \u2013
  liebte. Dieselbe Liebe wird uns im Himmel bis in alle Ewigkeit umgeben. Im Himmel
  ist Ihr Kind nicht nur imstande, diese Liebe zu empfangen, und zwar in einer Weise,
  wie wir sie hier auf Erden gar nicht in vollem Ma\u00dfe empfangen k\u00f6nnen;
  sondern es wird diese Liebe auch vollkommen ausdr\u00fccken k\u00f6nnen.\\n\\nVollkommene
  Freude. Das Erdenleben ist immer mit einem gewissen Ma\u00df an Kummer, Entmutigung,
  Entt\u00e4uschung, \u00c4rger, Kampf und Schmerz verbunden. Nicht so das Leben im
  Himmel! Der Himmel ist der Ort ungetr\u00fcbter Freude. In dem Gleichnis von den
  Talenten h\u00f6ren wir zweimal: \u00bbWohl, du guter und treuer Knecht! \u2026
  Gehe ein in die Freude deines\\n\\nHerrn!\u00ab (Matth\u00e4us 25,21.23). Dies sagen
  wir allen, die in die himmlische Gegenwart des Herrn eingehen \u2013 sie werden
  mit der F\u00fclle der Freude belohnt werden.\\n\\nVielleicht das Allerbeste ist,
  dass diese Eigenschaften \u2013 dieses vollkommene Gl\u00fcck, diese vollkommene
  Erkenntnis, dieser vollkommene Trost, diese vollkommene Liebe und diese vollkommene
  Freude \u2013 f\u00fcr Ihr Kind nie enden und sich nie abschw\u00e4chen werden.
  Himmlische Vollkommenheit kennt weder Ver\u00e4nderung noch Abnutzung.\\n\\nWelches
  Alter hat mein Kind im Himmel?\\n\\nMehrfach wurde mir diese Frage gestellt. Ich
  habe dann gelegentlich zur\u00fcckgefragt: \u00bbGibt es im Himmel Kinderwagen?\u00ab\\n\\nDie
  Antwort lautet: \u00bbNein!\u00ab\\n\\nWelche Unvollkommenheiten, Begrenzungen Ihr
  Kind auf Erden auch gehabt haben und wie unreif es gewesen sein mag \u2013 im Himmel
  ist dies alles anders. Im Himmel werden wir in das Bild Christi umgestaltet sein
  (R\u00f6mer 8,29). Wir werden wie Jesus sein (1. Johannes 3,2).\\n\\nAlle Erl\u00f6sten
  aller Zeitalter und Jahrhunderte werden besonders eines im Himmel tun: \u00bbNach
  diesem sah ich: und siehe, eine gro\u00dfe Volksmenge, welche niemand z\u00e4hlen
  konnte, aus jeder Nation und aus\\n\\nSt\u00e4mmen und V\u00f6lkern und Sprachen,
  und sie standen vor dem Thron und vor dem Lamm, bekleidet mit wei\u00dfen Gew\u00e4ndern,
  und Palmen waren in ihren H\u00e4nden. Und sie rufen mit lauter Stimme und sagen:
  \u203aDas Heil unserem Gott, der auf dem Thron sitzt, und dem Lamm!\u2039\u00ab
  (Offenbarung 7,9-10).\\n\\nDie Erl\u00f6sten werden sich mit den Engeln und den
  \u00c4ltesten und den vier lebendigen Wesen vereinen, wenn sie vor dem Thron Gottes
  niederfallen und ihn anbeten, wobei sie sagen:\\n\\nAmen! Die Segnung und die Herrlichkeit
  und die Weisheit und die Danksagung und die Ehre und die Macht und die St\u00e4rke
  sei unserem Gott von Ewigkeit zu Ewigkeit! Amen. (Offenbarung 7,12).\\n\\nDie gr\u00f6\u00dfte
  Gruppe in dieser Schar m\u00f6gen sicher die Ungeborenen und die kleinen Kinder
  stellen, die Gott all die Zeitalter hindurch in seiner souver\u00e4nen Gnade errettet
  hat. Sie werden aus allen Nationen, Sprachen, St\u00e4mmen und V\u00f6lkern kommen.
  Sie alle sind in der Lage, Gott zu preisen und ihn anzubeten. Demnach verf\u00fcgen
  sie \u00fcber die ausreichende Reife, dieses Lob auszudr\u00fccken und auch die
  Bedeutung dieses Lobes zu verstehen.\\n\\nEs werden in der Offenbarung noch weitere
  kurze Einblicke in den Himmel gew\u00e4hrt. In Kapitel 5 lesen wir, dass \u00bbjedes
  Gesch\u00f6pf, das in dem Himmel und auf der Erde \u2026 ist\u00ab, vor dem Herrn
  steht und sagt:\\n\\nDem, der auf dem Thron sitzt, und dem Lamm die Segnung und
  die Ehre und die Herrlichkeit und die Macht von Ewigkeit zu Ewigkeit! (Offen\u00ad
  barung 5,13).\\n\\nNirgends lesen wir in der Heiligen Schrift, es gebe im Himmel
  solche, die unf\u00e4hig sind anzubeten, au\u00dferstande, das Lob zum Ausdruck
  zu bringen, oder nicht in der Lage, vor dem Thron anbetend niederzufallen.\\n\\nWird
  mein Kind mich erkennen?\\n\\nEltern, die ein Kind verloren haben, fragen h\u00e4ufig:
  \u00bbWird mein Baby mich im Himmel erkennen? Werde ich es erkennen?\u00ab\\n\\nDenken
  Sie an den K\u00f6nig David, der nach dem Tod seines kleinen Sohnes sagte: \u00bbIch
  gehe zu ihm\u00ab (2. Sa\u00admuel 12,23; Hervorhebung durch den Autor). Er sagte
  nicht: \u00bbIch gehe dahin, wo er ist\u00ab, oder: \u00bbIch gehe in den Himmel,
  wo er ist\u00ab.\\n\\nDer Himmel ist der Ort vollkommener Wiedervereinigung, wo
  wir ganz erkannt werden, genauso wie wir andere g\u00e4nzlich erkennen. Die Heilige
  Schrift sagt uns: \u00bbWir sehen jetzt durch einen Spiegel, undeutlich, dann aber
  von Angesicht zu Angesicht. Jetzt erkenne ich st\u00fcckweise, dann aber werde ich
  erkennen, wie ich erkannt worden bin\u00ab (1. Korinther 13,12). In gleicher Weise,
  wie der Herr Sie kennt, werden Sie den Herrn kennen. Und genauso wie der\\n\\nHerr
  Sie kennt, werden Sie von den anderen dort gekannt sein und auch Sie die anderen
  kennen.\\n\\nDer Himmel ist ein Ort vollkommener Erkenntnis, vollkommener Reife
  und vollkommener Liebe.\\n\\nWelch eine gute Nachricht ist das! Ein Mensch, den
  Sie empfangen haben, ist vollendet sowie heil und preist Gott in alle Ewigkeit.
  Gott erschuf einen Men\u00ad schen und gebrauchte dabei Ihr Erbmaterial und dasjenige
  Ihres Ehepartners. Dieser Mensch steht nun in der F\u00fclle seines Lebens vor dem
  Herrn. Wenn Sie Jesus als Ihren Retter angenommen haben, werden Sie eines Tages
  mit diesem Kind vereint sein, um zusammen mit ihm in alle Ewigkeit den Herrn an\u00ad
  betend zu loben.\\n\\nIhr Kind wird einen verherrlichten Leib haben\\n\\nDer Himmel
  ist nicht ein \u00bbGeisteszustand\u00ab, er ist ein realer Ort, wo die Erl\u00f6sten
  reale Leiber in Gleich\u00ad gestalt des Leibes Jesu Christi nach seiner Auferstehung
  haben.\\n\\nGott schuf die Menschheit mit Leib und Seele, einen inneren und einen
  \u00e4u\u00dferen Menschen (1. Mose 2,7). Daher erfordert die endg\u00fcltige Vollkommenheit
  auch, dass Leib und Seele erneuert werden.\\n\\nDer Tod brachte zwar die Trennung
  von Leib und Seele. Unsere Leiber sinken ins Grab, und unser Geist geht zu dem Herrn.
  Die Trennung bleibt bis zur Auferstehung bestehen (Johannes 5,28-29).\\n\\nUnser
  Auferstehungsleib ist unser irdischer K\u00f6rper, allerdings verherrlicht. Der
  Leib, den wir bei der Auferstehung empfangen, hat die gleichen Eigenschaften wie
  der verherrlichte Auferstehungsleib Christi (1. Johannes 3,2).\\n\\nChristi Auferstehungsleib
  war nicht ein ganz anderer Leib, vielmehr war es der Leib, den er vor seiner Kreuzigung
  hatte. Allerdings befand er sich jetzt in einem verherrlichten Zustand. Die Wunden
  von seiner Kreuzigung waren noch erkennbar; aber er konnte ber\u00fchrt und bedient
  werden. Der Herr sah in jeder Beziehung wie ein Mensch aus. Jesus unterhielt sich
  auf dem Weg nach Emmaus lange Zeit mit den J\u00fcngern, und sie stellten nie sein
  Menschsein infrage (Lukas 24,13-18). Bei einer anderen Gelegenheit a\u00df er vor
  seinen J\u00fcngern richtige, irdische Speisen (Lukas 24,41-43). Gleichzeitig besa\u00df
  sein Leib einzigartig \u00fcber\u00adirdische F\u00e4higkeiten, die ihm erlaubten,
  durch massive W\u00e4nde zu gehen (Johannes 20,19), ganz pl\u00f6tzlich zu erscheinen
  (Lukas 24,36) und in leib\u00ad licher Gestalt unmittelbar in den Himmel aufzufahren
  (Lukas 24,51; Apostelgeschichte 1,9). Unsere Leiber werden seinem Leib gleichen.
  Sie werden wirk\u00ad liche, physische, echte menschliche Leiber sein, doch in jeder
  Beziehung vollkommen und verherrlicht. Paulus schrieb dar\u00fcber: \u00bbWie wir
  das Bild dessen von Staub getragen haben, so werden wir auch das Bild des Himmlischen
  tragen\u00ab (1. Korinther 15,49).\\n\\nDer Apostel verglich den Tod unseres irdischen
  Leibes mit einem Samenkorn, das in die Erde gepflanzt wird. An die Korinther schrieb
  er: \u00bbEs wird aber jemand sagen: \u203aWie werden die Toten auferweckt, und
  mit was f\u00fcr einem Leib kommen sie?\u2039 Du Tor! Was du s\u00e4st, wird nicht
  lebendig, wenn es nicht stirbt. Und was du s\u00e4st, du s\u00e4st nicht den Leib,
  der werden soll, sondern ein nacktes Korn, es sei von Weizen oder von einem der
  anderen Samen. Gott aber gibt ihm einen Leib, wie er gewollt hat, und zwar einem
  jeden der Samen seinen eigenen Leib\u00ab (1. Korinther 15,35-38).\\n\\nJeder Same
  enth\u00e4lt den Bauplan der Pflanze, die daraus hervorw\u00e4chst. So ist die gesamte
  Erbinformation f\u00fcr eine ganze Eiche in jeder Eichel enthalten. Genauso wird
  unser Auferstehungsleib \u00c4hnlichkeit mit dem begrabenen Leib haben, nur dass
  er viel herrlicher sein wird. Der Auferstehungsleib hat keinen der Fehler des alten
  Leibes. Vielmehr ist er die perfekte Darstellung dessen, wozu Gott unseren Leib
  erschaffen hat, aber ohne jeden Einfluss der S\u00fcnde wie Krankheiten, Versagen,
  Fehler, Verletztheiten und Schwachheiten unserer irdischen Existenz. Paulus schrieb:
  \u00bbEs wird ges\u00e4t in Verwesung, es wird auferweckt in Unverweslichkeit. Es
  wird ges\u00e4t in Unehre, es wird auferweckt in Herrlichkeit; es wird ges\u00e4t
  in Schwachheit, es wird auferweckt in Kraft; es wird ges\u00e4t ein nat\u00fcrlicher
  Leib, es wird auferweckt ein geistiger Leib\u00ab (1. Korinther 15,42-44).\\n\\nKeine
  Falten, kein kahler Kopf, keine Krankheit, keine Verletzungsfolgen, keine Schmerzen
  oder Aller\u00ad gien, nichts von alldem geh\u00f6rt zu einem verherrlichten Auferstehungsleib!
  Der Auferstehungsleib kann essen \u2013 aber er braucht es nicht. Er kann sich nach
  Belieben durch Raum und Materie bewegen. Er wird zeitlos sein und keine Leiden kennen,
  keine Tr\u00e4nen, weder Sorgen noch Krankheiten, Verg\u00e4nglichkeit bzw. Siechtum
  irgendwelcher Art, noch den Tod. Das einzige physische Merkmal, das von der Erde
  in den Himmel gebracht werden wird, werden die Wundmale des Herrn Jesus sein \u2013
  zur ewigen Erinnerung an sein Opfer f\u00fcr uns, als er unsere S\u00fcnden trug.\\n\\nDie
  Bibel vergleicht den verherrlichten Leib mit dem Scheinen des Mondes und der Sterne:
  \u00bbUnd die Verst\u00e4ndigen werden leuchten wie der Glanz der Himmelsfeste,
  und die, welche die Vielen zur Gerechtigkeit weisen, wie die Sterne, immer und ewiglich\u00ab
  (Daniel 12,3).\\n\\nDie F\u00fclle Ihrer Identit\u00e4t. Das Neue Testament zeigt
  an, dass unsere Identit\u00e4t im Himmel unver\u00e4ndert bleiben wird. W\u00e4hrend
  der Vorbereitung auf das Passah nahm Jesus den Kelch und sagte seinen J\u00fcngern:
  \u00bbNehmt diesen [Kelch] und teilt ihn unter euch. Denn ich sage euch, dass ich
  nicht von dem Gew\u00e4chs des Weinstocks trinken werde, bis das Reich Gottes kommt\u00ab
  (Lukas 22,17-18). Der Herr versprach damals, er werde mit seinen J\u00fcngern zusammen\\n\\nwieder
  von der Frucht des Weinstocks trinken \u2013 im himmlischen Reich Gottes. An anderer
  Stelle machte er eine noch deutlichere Verhei\u00dfung: \u00bbIch sage euch, dass
  viele von Osten und Westen kommen werden und mit Abraham und Isaak und Jakob zu
  Tisch liegen werden in dem Reich der Himmel\u00ab (Matth\u00e4us 8,11). Offensichtlich
  erwartet Jesus, dass wir Abraham und Isaak und Jakob erkennen werden. Alle Erl\u00f6sten
  werden f\u00fcr immer ihre Identit\u00e4t behalten, aber eben in F\u00fclle und
  Vollkommenheit. Im Himmel werden wir ganz nach Wunsch mit allen Heiligen Gemeinschaft
  haben k\u00f6nnen.\\n\\nMose und Elia erschienen Christus auf dem Berg der Verkl\u00e4rung.
  Obgleich sie schon Jahrhunderte zuvor gestorben waren, hatten sie ihre Identit\u00e4t
  so deutlich bewahrt, dass Petrus, Jakobus und Johannes sie offensichtlich als diejenigen
  erkannten, die sie waren (Matth\u00e4us 17,3-4). Wir werden im Himmel Menschen erkennen
  k\u00f6nnen, die wir nie zuvor gesehen haben. An ihrer Identit\u00e4t wird f\u00fcr
  uns etwas Bleibendes, Unterscheidbares, deutlich Erkennbares sein.\\n\\nAls die
  Sadduz\u00e4er versuchten, den Herrn wegen der Auferstehung in eine Falle zu locken,
  zitierte er Gottes Worte an Mose aus 2. Mose 3,6: \u00bbIch bin der Gott deines
  Vaters, der Gott Abrahams, der Gott Isaaks und der Gott Jakobs.\u00ab Dazu bemerkte
  Jesus: \u00bbGott ist nicht ein Gott der Toten, sondern der Lebenden\u00ab (Matth\u00e4us
  22,32). Damit best\u00e4tigte Jesus eindeutig, dass Abraham, Isaak und Jakob immer
  noch leb\u00ad ten und Gott auch weiterhin ihr Gott war. Sie hatten unterscheidbare,
  charakteristische Identit\u00e4ten.\\n\\nSie werden Ihr Kind wiedererkennen, und
  Ihr Kind wird Sie erkennen. Selbst wenn Ihr Kind Ihr Gesicht nie zu sehen bekam
  und Sie nie das Gesicht Ihres Kindes, wird Ihr Kind Sie doch erkennen und Sie Ihr
  Kind.\\n\\nDer Apostel Paulus schrieb \u00fcber die Erscheinung des Herrn und die
  Auferstehung der abgeschiedenen Heiligen, indem er sagte: \u00bbDanach werden wir,
  die Lebenden, die \u00fcbrig bleiben, zugleich mit ihnen entr\u00fcckt werden in
  Wolken, dem Herrn entgegen in die Luft; und so werden wir allezeit bei dem Herrn
  sein. So ermuntert nun einander mit diesen Worten\u00ab (1. Thessalonicher 4,17-18).
  Der Trost entspringt der Erwartung der Wiedervereinigung mit denen, die wir lieb
  haben. Wir werden vereint werden und dann auf ewig zusammenleben in einer Tiefe
  der Gemeinschaft, die wir auf dieser Erde nie kennengelernt haben.\\n\\nDer Theologe
  A.A. Hodge schrieb einmal \u00fcber unser Leben im Himmel:\\n\\nDer Himmel als die
  ewige Heimat des verherrlichten Menschensohnes und aller erl\u00f6sten Menschen
  muss von seiner Beschaffenheit, seinen Bedingun\u00ad gen und Aktivit\u00e4ten her
  notwendigerweise auch\\n\\nganz auf den Menschen zugeschnitten sein. Seine Freuden
  und Besch\u00e4ftigungen m\u00fcssen ausnahmslos begr\u00fcndet, moralisch untadelig,
  emotional be\u00ad stimmt und aktiv sein sowie aus dem freien Willen des Menschen
  hervorgehen. Dort muss es die Aus\u00fcbung aller F\u00e4higkeiten geben, jedem
  Ge\u00adschmack wird dort entsprochen, ferner werden alle Talente zur Entfaltung
  kommen und alle Ideale verwirklicht werden. Die Vernunft, das Streben nach intellektuellem
  Neuland, die Vorstellungs\u00adkraft, das \u00e4sthe\u00adtische Empfinden, die
  heiligen Re\u00adgungen, die zwischenmenschlichen Bindungen, die unersch\u00f6pflichen
  Reserven an St\u00e4rke und die der mensch\u00ad lichen Seele innewohnende Kraft
  \u2013 alles muss im Himmel Anwendung und Befriedigung finden. 1\\n\\nJedes gute
  Merkmal des menschlichen Wesens wird auf herrliche Weise im Himmel gut sein!\\n\\nUnunterbrochene
  Gemeinschaft mit unserem himmlischen Vater\\n\\nZweifellos wird der wunderbarste
  Aspekt des Himmels die ununterbrochene Gemeinschaft mit Gott, unserem himmlischen
  Vater, sein! Das ist die h\u00f6chste Wonne des Himmels.\\n\\nUnsere Gemeinschaft
  mit Gott dem Vater wird vollkommen, ungehindert m\u00f6glich und von keiner S\u00fcnde
  getr\u00fcbt oder verdunkelt sein.\\n\\nIn der Nacht vor seiner Kreuzigung betete
  Jesus f\u00fcr seine J\u00fcnger, also auch f\u00fcr Sie und mich: \u00bb\u2026
  damit sie alle eins seien, wie du, Vater, in mir und ich in dir, damit auch sie
  in uns eins seien, damit die Welt glaube, dass du mich gesandt hast. Und die Herrlichkeit,
  die du mir gegeben hast, habe ich ihnen gegeben, damit sie eins seien, wie wir eins
  sind; ich in ihnen und du in mir, damit sie in eins vollendet seien und damit die
  Welt erkenne, dass du mich gesandt und sie geliebt hast, wie du mich geliebt hast.
  Vater, ich will, dass die, die du mir gegeben hast, auch bei mir seien, wo ich bin,
  damit sie meine Herrlichkeit schauen, die du mir gegeben hast; denn du hast mich
  geliebt vor Grundlegung der Welt\u00ab (Johannes 17,21-24; Hervorhebung durch den
  Autor). Jesus verlangte danach, dass wir vollkommene Gemeinschaft mit ihm und dem
  Vater haben, und dass wir die gleiche Art von Einssein mit dem Vater erleben sollten,
  die er kannte!\\n\\nDas ist ein so unglaublich tief greifendes Konzept, dass unser
  endlicher Verstand es in keiner Weise auch nur ansatzweise ermessen kann! Wir werden
  wie Christus sein. Wir werden bei Christus sein. Wir werden die ununterbrochene,
  uneingeschr\u00e4nkte Ge\u00ad meinschaft mit Gott dem Vater haben. Welch eine Herrlichkeit
  wird das sein!\\n\\nIm Himmel werden wir den Herrn von Angesicht zu Angesicht sehen.
  Wir werden dabei Gottes Herrlichkeit unverh\u00fcllt und in ihrer ganzen F\u00fclle
  sehen k\u00f6nnen. Das wird weit sch\u00f6ner und gro\u00dfartiger sein als alles,
  was wir hier auf Erden gesehen haben oder uns auch nur vorstellen k\u00f6nnen. Keine
  irdische Freude kann auch nur ansatzweise mit dem Vorrecht und dem Entz\u00fccken
  eines ungehinderten Blicks auf seine g\u00f6ttliche Herrlichkeit verglichen werden.
  Jesus sagte ganz deutlich: \u00bbGl\u00fcckselig, die reinen Herzens sind, denn
  sie werden Gott sehen\u00ab (Matth\u00e4us 5,8).\\n\\nNach dieser engen Gemeinschaft
  mit dem Herrn hat die erl\u00f6ste Seele immer zutiefst verlangt. Der Psalmist sagte:
  \u00bbWie ein Hirsch lechzt nach Wasser\u00adb\u00e4chen, so lechzt meine Seele
  nach dir, o Gott! Meine Seele d\u00fcrstet nach Gott, nach dem lebendigen Gott\u00ab
  (Psalm 42,2-3). Philippus sprach f\u00fcr alle J\u00fcnger, als er Jesus bat: \u00bbHerr,
  zeige uns den Vater, und es gen\u00fcgt uns!\u00ab (Johannes 14,8). Offenbarung
  22,3-5 verhei\u00dft uns die Erf\u00fcllung dieses gro\u00dfen Begehrens eines erl\u00f6sten
  Herzens: \u00bbDer Thron Gottes und des Lammes wird in ihr sein, und seine Knechte
  werden ihm dienen, und sie werden sein Angesicht sehen; und sein Name wird an ihren
  Stirnen sein. Und Nacht wird nicht mehr sein und kein Bed\u00fcrfnis nach einer
  Lampe und dem Licht der Sonne; denn der Herr, Gott, wird \u00fcber ihnen leuchten,
  und sie werden herrschen von Ewigkeit zu Ewigkeit.\u00ab\\n\\nAls solche, die vom
  Herrn errettet wurden, wird un\u00ad sere h\u00f6chste Befriedigung darin liegen,
  in vollkom\u00ad mener Aufrichtigkeit vor Gott dem Vater und seinem\\n\\nSohn, Jesus
  Christus, zu stehen. Wir werden einen v\u00f6llig ungehinderten, niemals erm\u00fcdenden
  Anblick seiner unendlichen Herrlichkeit und Sch\u00f6nheit ge\u00ad nie\u00dfen,
  und das allein wird f\u00fcr uns unendliche und ewige Wonne sein.\\n\\nWelch eine
  herrliche Existenz hat Ihr Kind im Himmel! Welch eine herrliche Wiedervereinigung
  und Gemeinschaft werden Sie bis in alle Ewigkeit zusammen mit ihm erleben!\\n\\nWarum
  musste mein Kind sterben?\\n\\nUm die Echtheit eines Diamanten zu pr\u00fcfen, tauchen
  Juweliere ihn oft in klares Wasser. Dadurch wird ein richtiger Diamant in besonderer
  Weise zum Strahlen gebracht. Eine Imitation strahlt im Gegensatz dazu fast gar nicht.
  Wenn eine Imitation und ein richtiger Diamant nebeneinander in klarem Wasser liegen,
  kann selbst ein Laie den Unterschied schnell er\u00ad kennen.\\n\\nIn den wirklich
  gro\u00dfen Trag\u00f6dien unseres irdischen Lebens zeigt sich schnell der Unterschied
  zwischen wahren Christen und denen, die sich nur \u00e4u\u00dferlich zum Glauben
  an Christus bekennen. Da erweist sich ein bemerkenswerter Unterschied an Strahlkraft.
  An dem Umgang mit N\u00f6ten zeigt ein Mensch, ob sein Glaube lebendig oder tot,
  echt oder nachgemacht ist, ob er rettet oder nicht.\\n\\nDas wird besonders deutlich,
  wenn ein Kind stirbt. Jene Eltern, die eine Himmelshoffnung im Herzen tragen und
  die fest glauben, dass ihr Kind ewig ge\u00ad borgen und sicher in Gottes Armen
  ist, sind Eltern, die trauern und sich nach ihrem Kind sehnen \u2013 und doch liegt
  gleichzeitig jenes Leuchten \u00fcber ihrem Glauben an die Souver\u00e4nit\u00e4t
  Gottes. Sie glauben, dass Gott eine ewige Wiedervereinigung mit ihrem Kind l\u00e4ngst
  geplant hat, dass er in alldem eine Absicht verfolgt und dass er eines Tages selbst
  diesen gro\u00dfen Schmerz in Freude verwandeln wird.\\n\\nBei manchen Eltern kommt
  zu der Tragik, ein Baby zu verlieren, noch der Verlust eines weiteren Kindes einige
  Zeit sp\u00e4ter hinzu. So ging es Andrea und Steve. Steve arbeitet mit mir zusammen
  in der \u00bbGrace to You\u00ab-Radioarbeit. Darum sind er und seine Familie mir
  besonders wertvoll.\\n\\nNachdem ihr erstes Kind, Andrew, als Baby gestorben war,
  wurde bei Andrea eine myotonische Dystrophie, eine Erbkrankheit, festgestellt, die
  oft auf die Kinder \u00fcbertragen wird. Bei Andrea zeigte sich diese Krankheit,
  als sie Teenager bzw. ins Erwachsenenalter gekommen war, doch blieben die Symptome
  schwach. Manchmal stellte Steve fest, dass seine Frau nicht so hart arbeiten konnte
  wie ihre Mutter, ihre zwei Schwestern, seine eigene Mama oder seine beiden eigenen
  Schwestern, die allesamt \u00e4u\u00dferst flei\u00dfig waren. Er kreidete es ihr
  als Tr\u00e4gheit an, wenn sie ihre Hausarbeit nicht schaffte, weil er nichts von
  den physiologischen Faktoren wusste, die ihre Kraft beeintr\u00e4chtigten und ihre
  Energie l\u00e4hmten.\\n\\nSteve war dankbar f\u00fcr die Diagnose, die im Zusammenhang
  mit Andrews Tod erstellt wurde, denn dadurch bekam er jetzt viel mehr Verst\u00e4ndnis
  und Mitgef\u00fchl f\u00fcr Andrea. Er hielt es f\u00fcr einen Gnadenakt Gottes,
  Andreas Leiden zu offenbaren, und er begriff, dass die Bibel ihm gebot, verst\u00e4ndnisvoll
  mit\\n\\nAndrea umzugehen. So wurde er ein viel einsichtigerer Ehemann, was Andrea
  sehr zu sch\u00e4tzen wusste!\\n\\nSteve schrieb: \u00bbDass ich verst\u00e4ndnisvoller
  wurde, ist eine direkte Folge dessen, dass mir ein Kind mit einer Krankheit geboren
  wurde, die ihm schlie\u00dflich das Leben kostete. Somit ist aus dem kurzen Dasein
  unseres Sohnes, das uns Gott erleben lie\u00df, eindeutig etwas Gutes hervorgegangen.\u00ab\\n\\nEin
  weiterer Segen, den Steve und Andrea nach Andrews Tod erfuhren, war die St\u00e4rkung
  ihrer ehelichen Verbindung. Sie hatten sich immer lieb; aber Andrews Leben und Sterben
  brachte sie noch enger zusammen. Das ist nichts Selbstverst\u00e4ndliches. Tats\u00e4chlich
  sagen die Statistiken genau das Gegenteil. Viele Paare werden durch den Tod eines
  Kindes auseinandergerissen, besonders wenn ein Partner daran scheinbar schuld ist
  \u2013 auch wenn diese \u00bbSchuld\u00ab nur in einer Erbkrankheit besteht, die
  man dabei diagnostiziert hat.\\n\\nNachdem man die myotonische Dystrophie festgestellt
  hatte, wurde Andrea wieder schwanger, und ihr kleines M\u00e4dchen, Karlie, wurde
  geboren. Sie lebte nur 22 Stunden.\\n\\nSteve schrieb \u00fcber seine kleine Tochter
  Folgendes:\\n\\nIrgendwie war sie mehr mein Baby als dasjeni\u00adge meiner Frau.
  Andrea konnte mit dem kleinen Andrew w\u00e4hrend der zwei Monate seines Lebens\\n\\nim
  Krankenhaus viel mehr Zeit verbringen \u2013 viel mehr als ich \u2013, wobei der
  Verlust Andrews f\u00fcr Andrea meiner Meinung nach in gewisser Hinsicht weit schwerer
  wog. In Karlies Fall war vor allem ich der \u00bbElternteil vom Dienst\u00ab f\u00fcr
  das ge\u00ad samte Leben des Kindes.\\n\\nDie meiste Zeit w\u00e4hrend Karlies zweiundzwanzigst\u00fcndigem
  Leben stand Andrea unter dem starken Einfluss von Medikamenten nach ihrer Kaiserschnitt-Operation.
  Ich allein habe in vollem Umfang mitbekommen, was Karlie durchmachen musste. Selbst
  als wir mit Karlies K\u00f6rper kurz nach ihrem Tod zusammen waren, lag Andrea mehr
  schlafend als wach in ihrem Bett. Ich sa\u00df da im Krankenzimmer mit dem niedlichen,
  aber leblosen Menschlein in den Armen, w\u00e4hrend meine Frau im Grunde bewusstlos
  war. Mir war v\u00f6llig klar, dass Andrea niemals wieder ein Kind haben w\u00fcrde.
  Wir hatten keine Kinder daheim, niemanden, an den wir uns halten oder mit dem wir
  uns tr\u00f6sten konnten. W\u00e4hrend dieser Minuten, die ich in gro\u00dfer Traurigkeit
  dasa\u00df und den leblosen K\u00f6rper meiner Tochter festhielt, wurde mir doch
  \u00fcberw\u00e4ltigend deutlich, dass Gott mich hielt.\\n\\nDamit will ich nicht
  sagen, ich h\u00e4tte in jener Stunde eine tief greifende Offenbarung erlebt. Ich
  hatte nur das Gef\u00fchl eines gro\u00dfen Friedens, den ich nicht wirklich beschreiben
  kann. Ich brach\\n\\ngef\u00fchlsm\u00e4\u00dfig nicht zusammen, wusste ich doch,
  dass dazu kein Grund vorhanden war. Ich hatte in mir eine tiefe Hoffnung. Auch begriff
  ich, dass dieser Friede und diese Hoffnung nicht meiner nat\u00fcrlichen Veranlagung
  entsprangen, sondern vielmehr Werke des Heiligen Geistes waren.\\n\\nDas Krankenhauspersonal
  erlaubte uns, ein oder zwei Stunden gemeinsam mit Karlies K\u00f6rper zusammen zu
  sein. W\u00e4hrend dieser Zeit besuchte uns ein Pastor aus unserer Gemeinde. Wir
  standen mit ihm in Verbindung, und er wusste, dass Karlie geboren worden war und
  sich in einer sehr kritischen Lage befand, doch als er kam, wusste er noch nicht,
  dass die Kleine bereits gestorben war. Er lie\u00df sich von mir erz\u00e4hlen,
  wie Karlie schon einige Stunden, bevor sie starb, deutlich schw\u00e4cher wurde.
  Ich sagte ihm, dass mir tats\u00e4chlich erlaubt war, eineinhalb Meter von ihrem
  Bett entfernt zu stehen, als der Arzt, der Beatmungsassistent und mehrere Schwestern
  alles auf\u00adboten, um sie zu retten. Ich erz\u00e4hlte ihm auch, dass beim leisen
  Abscheiden Karlies mir in meinem Geist zutiefst bewusst war, dass Gott alles im
  Griff hat, einschlie\u00dflich dessen, was jetzt um uns herum vor sich ging. Ich
  glaube nicht einmal, dass ich in jenen Augenblicken betete \u2013 h\u00e4tte ich
  doch kaum gewusst, was ich dem Herrn h\u00e4tte sagen k\u00f6nnen. Ich versuchte
  nur, so viel wie m\u00f6glich von\\n\\nden letzten Augenblicken des Erdenlebens
  meiner Tochter in mich aufzunehmen, und wusste da\u00ad bei tief im Innersten, dass
  Gott souver\u00e4n ist, und angesichts dieser ewigen Wahrheit war in mir eine gro\u00dfe
  Ruhe.\\n\\nZwei Dinge waren als Folge des Todes ihrer beiden Babys f\u00fcr Steve
  und Andrea sehr bedeutsam.\\n\\nSteve sagte: \u00bbGott hatte auch in der Intensivstation
  der Kinderklinik seine Leute, um uns Mut und Trost zu geben. Einer dieser Menschen,
  ein Beatmungs\u00ad assistent, wurde uns ein besonders guter Freund. Ich glaube
  nicht an Zufall. Er hatte n\u00e4mlich gerade in der Nacht Dienst, als Andrew geboren
  wurde, und ebenso in der Nacht, als Andrew zwei Monate sp\u00e4ter starb, und dann
  auch noch in der Nacht, als unsere Tochter Karlie geboren wurde, bzw. in der Nacht,
  als unsere Tochter starb. Andrea und ich sehen in ihm einen Schatz der Vorsehung.
  Er war f\u00fcr uns ein ganz besonderer Trost, weil er ein so gleichgesinnter Bruder
  in Christus war.\\n\\nGott brachte uns auch Trost durch Glaubensgeschwister aus
  unserer Gemeinde. Ein Ehepaar, das gerade ein Jahr zuvor ein Kind verloren hatte,
  bot uns starken Trost und viel Ermutigung.\u00ab\\n\\nEtwas, das Steve und Andrea
  lebenswichtig wurde, war die M\u00f6glichkeit, das Evangelium Ungl\u00e4ubigen zu
  sagen, nachdem ihre Kinder gestorben waren.\\n\\nSteve erz\u00e4hlte mir: \u00bbWir
  danken Gott, dass er uns aus Gnaden einige gute Dinge gezeigt hat, die aus dem Tod
  eines kleinen Kindes erwachsen k\u00f6nnen. Zur Beerdigung unserer Kinder kamen
  eine Reihe Ungl\u00e4ubiger, die bei dieser Gelegenheit das Evangelium h\u00f6rten.
  Der Tod unserer Kinder hat uns vielf\u00e4ltige M\u00f6glichkeiten gegeben, die
  oft gestellte Frage zu beantworten: \u203aWie seid ihr damit fertig geworden?\u2039
  Dann konnten wir mutig antworten und die Liebe sowie Gnade Gottes bezeugen, weil
  sie ja danach fragten.\u00ab\\n\\nSteve und Andrea pr\u00fcfen die M\u00f6glichkeit,
  ein Kind zu adoptieren. Sie wissen, dass ihre beiden Kinder \u2013 Andrew und Karlie
  \u2013 ewig geborgen und sicher in Gottes Armen sind, ewig geborgen in dem herrlichen
  himmlischen Vaterhaus. Ihre Hoffnung besteht darin, die Kinder anderer Leute aufziehen
  zu d\u00fcrfen, vor allem solcher, die Gottes Heil nicht kennen, sodass diese Kleinen
  in der Zucht und Ermahnung des Herrn aufwachsen werden. Welch ein enorm wichtiger
  Dienst eine Adoption doch sein kann!\\n\\nWarum habe ich Ihnen von Steve und Andrea
  erz\u00e4hlt? Zum Teil deshalb, weil ihre Erfahrungen so viele Antwortm\u00f6glichkeiten
  auf die Frage bieten: \u00bbWarum musste mein Kind sterben?\u00ab\\n\\nNun m\u00f6chte
  ich auf einige dieser Antworten noch etwas unmittelbarer eingehen.\\n\\nWir leben
  in einer gefallenen Welt\\n\\nJeder Mensch auf dieser Welt erleidet ein gewisses
  Ma\u00df an Kummer. Das ist die Folge des S\u00fcndenfalls, das nat\u00fcrliche
  Ergebnis der s\u00fcndigen Natur des Menschen und einer durch Ungerechtigkeit verdorbenen
  Welt und Gesellschaft. Der Prophet Jesaja erkl\u00e4rte: \u00bbEs wird aufw\u00e4rts
  schauen und wird zur Erde blicken: und siehe, Drangsal und Finsternis, angstvolles
  Dunkel; und in dichte Finsternis ist es hinein\u00adgesto\u00dfen\u00ab (Jesaja
  8,21.22).\\n\\nSelbst solche, die Gott mit ganzem Herzen lieben und ihm in ihrem
  Leben treu gedient haben, werden von diesem Kummer nicht verschont. Schwierige Zeiten
  sind nicht zu vermeiden (1. Korinther 7,28). Jesus best\u00e4tigte dies gegen\u00fcber
  seinen J\u00fcngern: \u00bbIn der Welt habt ihr Bedr\u00e4ngnis\u00ab (Johannes
  16,33). Der Herr weinte, als er Maria und die Freunde ihres Bruders Lazarus \u00fcber
  den Tod des Lazarus trauern sah (Johannes 11,35). Er war betr\u00fcbt \u00fcber
  den Verrat des Judas (Johannes 13,21). Seine Seele war \u00bbsehr betr\u00fcbt bis
  zum Tod\u00ab, als er im Garten Gethsemane betete und dem Schrecken entgegensah,
  von Gott getrennt zu werden, weil er unsere S\u00fcnden auf sich nahm (Matth\u00e4us
  26,38). Und der Apostel Paulus schrieb, er werde \u00bbin allem bedr\u00e4ngt\u00ab
  (2. Korinther 4,8).\\n\\nWir k\u00f6nnen dem B\u00f6sen wie Kritiksucht, Frustration,
  Entt\u00e4uschung, k\u00f6rperlichen und seelischen Schmerzen, Krankheiten, Verletzungen
  und schlie\u00dflich dem\\n\\nTod einfach nicht entfliehen. Als Christen m\u00fcssen
  wir au\u00dferdem mit Leiden nur wegen des Glaubens rechnen (Johannes 15,20; 2.
  Timotheus 3,12).\\n\\nWenn Eltern den Tod eines Kindes erleben, ist sicher eine
  der ersten Fragen: \u00bbWarum musste mein Kind sterben?\u00ab Aus jahrelanger Erfahrung
  als Pastor kann ich sagen, dass diese Frage ganz normal und nat\u00fcrlich ist;
  und ich verstehe, weshalb die Eltern so fragen. Gew\u00f6hnlich liegt bei dieser
  Frage die Betonung auf \u00bbmein Kind\u00ab. Doch die Wahrheit besteht darin, dass
  es auf diese Frage keine leichte Antwort gibt, und was wir mit Sicherheit sagen
  k\u00f6nnen, ist gew\u00f6hnlich wenig trostreich f\u00fcr trauernde Eltern. Die
  Antwort beginnt mit der Tatsache, dass unser Leben von Schwierigkeiten und Kummer
  gepr\u00e4gt wird. Wir leben in einer gefallenen Welt, in einer Welt, die von Krankheit
  und S\u00fcnde gezeichnet ist. Die unterschiedlichsten Aspekte der chemischen, stofflichen,
  geophysischen und biologischen Welt sind durch den S\u00fcndenfall in Unordnung
  geraten. Die Tr\u00fcbsale kommen \u00fcber uns als Bestandteile unseres menschlichen
  Daseins.\\n\\n\u00bbAber der Herr h\u00e4tte es verhindern k\u00f6nnen\u00ab, entgegnen
  viele Eltern daraufhin.\\n\\nJa, Gott ist allm\u00e4chtig. Er ist auch allwissend.
  Gerade deshalb k\u00f6nnen wir manche Absichten und Pl\u00e4ne diesseits der Ewigkeit
  noch nicht erkennen. Gott hat ein Kind vielleicht sterben lassen \u2013 aus Gr\u00fcnden,
  die\\n\\nuns immer verborgen bleiben, aus Gr\u00fcnden, die das Leben der Eltern,
  der Geschwister, das Leben des Kindes selbst und das Leben anderer Menschen, die
  den Eltern unbekannt sind, ber\u00fchren.\\n\\nEs gibt eben eine noch bedeutendere
  Frage als diese: \u00bbWarum musste mein Kind sterben?\u00ab Die Frage lautet n\u00e4mlich:
  \u00bbWas erwartet Gott von mir in dieser Trag\u00f6die, dass ich tun soll?\u00ab
  Auf Warum-Fragen bekommen wir keine befriedigenden Antworten. Die Frage \u00bbWozu?\u00ab
  kann einen Menschen aus der Traurigkeit rei\u00dfen und zum Handeln veranlassen,
  vom Verlust zur Heilung f\u00fchren, vom Kummer zur Freude leiten und vom Gef\u00fchl
  des Am-Boden-Zerst\u00f6rtseins hin zum Gef\u00fchl des N\u00fctzlich-Seins bringen.
  \u00bbWarum?\u00ab ist eine Frage, die den Menschen r\u00fcckw\u00e4rtsschauen l\u00e4sst.
  \u00bbWozu?\u00ab ist eine Frage, die ihn auf die Zukunft hin bewegt.\\n\\nAcht
  Gr\u00fcnde f\u00fcr Tr\u00fcbsale und Trag\u00f6dien\\n\\nDie Heilige Schrift weist
  auf mindestens acht Gr\u00fcnde hin, derentwegen der Herr uns Tr\u00fcbsale und
  Trag\u00f6dien auf unserem Weg zusto\u00dfen l\u00e4sst. Sie k\u00f6nnen Ihnen helfen,
  darin Sinn und Zweck in Ihrer traurigen Erfahrung zu erkennen.\\n\\n1. Um die St\u00e4rke
  unseres Glaubens zu pr\u00fcfen. Kummervolle Erfahrungen geben uns Anlass, in unserem
  Leben geistliche Inventur zu machen. Sind wir voller\\n\\nGroll, Bitterkeit und
  Selbstmitleid, wenn uns Kummer \u00fcberf\u00e4llt? Oder wenden wir uns mehr und
  mehr dem Herrn zu und vertrauen mit wachsender Abh\u00e4ngigkeit und Demut auf ihn
  allein? Die Antwort verr\u00e4t uns etwas dar\u00fcber, wo wir im Glauben stehen
  und wo wir wachsen m\u00fcssen.\\n\\nIn seiner Allwissenheit kennt Gott unser Herz,
  und er will, dass auch wir es besser kennenlernen! Wenn wir dann unser Herz kennen,
  haben wir auch die Verantwortung, \u00fcberall Bu\u00dfe zu tun, wo Bu\u00dfe n\u00f6tig
  ist, und auf Gottes Gnade zu vertrauen, wo wir ihr zuvor nicht vertraut haben. Wir
  m\u00fcssen uns also mit einem dem\u00fctigen, abh\u00e4ngigen Herzen zu Gott wenden,
  wo wir vorher stolz und unabh\u00e4ngig waren.\\n\\n2. Um uns daran zu erinnern,
  darauf zu achten, dass sich unser Gottvertrauen nicht in Einbildung oder geistliche
  Selbstzufriedenheit verwandelt. Je gr\u00f6\u00dfer unsere Segnungen sind, desto
  eher besteht die Tendenz, sie als etwas zu betrachten, was wir verdient oder zustande
  gebracht haben, anstatt in ihnen Gottes Gnadenerweise zu erblicken. Paulus sagte,
  dass nach seiner Ansicht der Hauptgrund f\u00fcr seinen \u00bbDorn f\u00fcr das
  Fleisch\u00ab darin bestand, dass er sich in seinem Geist und Herzen \u00bbnicht
  \u00fcberhebe\u00ab (2. Korinther 12,7).\\n3. Um uns von den weltlichen Dingen unabh\u00e4ngi\u00ad
  ger zu machen. Schwierige Erfahrungen dienen da\u00ad zu, unsere Herzen und unser
  Augenmerk auf solche\\n\\nDinge zu lenken, die wahrhaft ewig dauern und die gr\u00f6\u00dfte
  Bedeutung f\u00fcr unser Leben haben. Materielle Hilfsquellen erweisen sich allzu
  oft als unzureichend, wenn Katastrophen hereinbrechen. Manchmal bringen noch so
  viele Arzneien, noch so viel Geld oder irgendetwas von Menschen Machbares keinen
  Unterschied zwischen Leben und Tod. Dann m\u00fcssen wir einsehen, dass nur geistliche
  Werte ewigen Bestand haben. Alles wahrhaft Wichtige hat seinen Anfang und sein Ende
  in Jesus Christus.\\n\\n4. Um uns die himmlische Hoffnung deutlich zu machen. Je
  h\u00e4rter eine Tr\u00fcbsal wird und je l\u00e4nger sie dauert, umso mehr erwarten
  wir freudig, bei dem Herrn zu sein, und hoffen auf die v\u00f6llige Er\u00adl\u00f6sung
  unseres Leibes und der gesamten Sch\u00f6pfung. Wir warten sehns\u00fcchtig auf
  die Erf\u00fcllung all dessen, was er geplant und vorbereitet hat, wie Paulus an
  die Gemeinde in Rom schrieb:\\n\\nDenn ich halte daf\u00fcr, dass die Leiden der
  Jetztzeit nicht wert sind, verglichen zu werden mit der zuk\u00fcnftigen Herrlichkeit,
  die an uns offenbart werden soll. Denn das sehnliche Harren der Sch\u00f6pfung wartet
  auf die Offenbarung der S\u00f6hne Gottes. Denn die Sch\u00f6pfung ist der Nichtigkeit
  unterworfen worden (nicht freiwillig, sondern dessent\u00adwegen, der sie unterworfen
  hat), auf Hoffnung, dass auch die Sch\u00f6pfung selbst freigemacht werden wird
  von der Knechtschaft des Verderbnisses zu der Freiheit der Herrlichkeit der Kinder
  Gottes. Denn wir wissen, dass die ganze Sch\u00f6pfung mitseufzt und mit in Geburtswehen
  liegt bis jetzt. Nicht allein aber sie, sondern auch wir selbst, die wir die Erstlinge
  des Geistes haben, auch wir selbst seufzen in uns selbst, erwartend die Sohnschaft:
  die Erl\u00f6sung unseres Leibes. Denn in Hoffnung sind wir errettet worden. Eine
  Hoffnung aber, die gesehen wird, ist keine Hoffnung; denn was einer sieht, was hofft
  er es auch? Wenn wir aber das hoffen, was wir nicht sehen, so warten wir mit Ausharren
  (R\u00f6mer 8,18-25).\\n\\nBeachten wir noch einmal die letzte Zeile des obigen
  Textes. Wenn wir eine Hoffnung haben, sind wir eher bereit, ausdauernd das zu tun
  und zu glauben, von dem wir wissen, dass es Gott wohlgef\u00e4llt. Wir warten mit
  Eifer und Ausharren. Paulus schrieb auch diese Mut machenden Worte:\\n\\nSo glauben
  auch wir, darum reden wir auch, da wir wissen, dass der, der den Herrn Jesus auferweckt
  hat, auch uns mit Jesus auferwecken und mit euch darstellen wird; denn alles ist
  um euretwillen, damit die Gnade, \u00fcberreich geworden durch die Vielen, die Danksagung
  zur Herrlichkeit Gottes \u00fcberstr\u00f6men lasse.\\n\\nDeshalb ermatten wir nicht,
  sondern wenn auch unser \u00e4u\u00dferer Mensch verf\u00e4llt, so wird doch unser
  innerer Tag f\u00fcr Tag erneuert. Denn das schnell\\n\\nvor\u00fcbergehende Leichte
  unserer Tr\u00fcbsal bewirkt uns ein \u00fcber jedes Ma\u00df hinausgehendes, ewiges
  Gewicht von Herrlichkeit (2. Korinther 4,13-17).\\n\\nImmer wieder haben mir Eltern,
  die ein Kind ver\u00adloren hatten, gesagt, sie h\u00e4tten neues Verlangen bekommen,
  beim Herrn im Himmel zu sein, um mit ihrem Kind wieder zusammen sein zu k\u00f6nnen.
  Sie besa\u00dfen fortan gr\u00f6\u00dfere F\u00e4higkeiten, mit den Beschwerden
  ihres Lebens fertig zu werden, weil sie die Aussicht auf die Ewigkeit hatten. Auch
  war ihre Kraft zum Durchhalten wegen der neuen Herrlichkeitshoffnung gewachsen,
  die ihnen vor Augen stand.\\n\\n5. Um zu offenbaren, was wir wirklich glauben. Abra\u00adham
  liebte seinen Sohn von ganzem Herzen. Der Herr hatte diese Liebe wahrgenommen, indem
  er Abraham rief und ihm gebot: \u00bbNimm deinen Sohn, deinen einzigen, den du lieb
  hast, den Isaak, und zieh hin in das Land Morija und opfere ihn dort\u00ab (1. Mose
  22,2). Abrahams Bereitschaft, Gott zu gehorchen, war nicht nur der Beweis f\u00fcr
  seinen Glauben an Gott, sondern auch f\u00fcr seine alles \u00fcberragende Liebe
  zu Gott. Als Jesus in der letzten Nacht vor seiner Kreuzigung mit seinen J\u00fcngern
  sprach, sagte er wiederholt zu ihnen: \u00bbWenn jemand mich liebt, wird er mein
  Wort halten\u00ab (Johannes 14,23; siehe auch Johannes 14,15.21).\\n\\nLieben wir
  Gott mehr als jedes menschliche Wesen? Lieben wir Gottes herrliche Absichten f\u00fcr
  unser Kind\\n\\nim Himmel mehr als unsere irdischen Pl\u00e4ne? So will Gott von
  uns geliebt sein. Lieben wir ihn so, dass wir ihm in allem gehorsam sein wollen?
  Das ist es, wozu Gott uns berufen hat. Schreckliche Ereignisse zeigen uns oft, ob
  wir eine derartige Liebe zu Gott besitzen.\\n\\n6. Um uns den Wert der g\u00f6ttlichen
  Segnungen zu lehren. Unsere Sinne lehren uns, alles zu sch\u00e4tzen, was uns Spa\u00df
  und Wohlbefinden bringt. Unsere F\u00e4hig\u00adkeit, vern\u00fcnftig zu denken,
  lehrt uns, alles zu sch\u00e4tzen, was uns Reichtum, gute Stellungen und Macht beschert.
  Aber durch Tr\u00fcbsale belehrt uns der Glaube, die geistlichen Dinge Gottes lieb
  zu gewinnen: sein Wort, seine Bewahrung, seine F\u00fcrsorge, seine Macht und vor
  allem seine Errettung.\\n\\nDer Psalmist, der Zeiten der Bedr\u00e4ngnis, aber auch
  Zeiten gro\u00dfen Segens kennengelernt hatte, schrieb:\\n\\nDenn deine G\u00fcte
  ist besser als Leben; meine Lippen werden dich r\u00fchmen. So werde ich dich preisen
  w\u00e4hrend meines Lebens, meine H\u00e4nde aufheben in deinem Namen. Wie von Mark
  und Fett wird ges\u00e4ttigt werden meine Seele, und mit jubelnden Lippen wird loben
  mein Mund (Psalm 63,4-6).\\n\\nNichts ist wertvoller als Gottes G\u00fcte sowie
  die Tat\u00ad sache, dass er bei uns ist und uns so gn\u00e4dig sowie aus freien
  St\u00fccken vergibt.\\n\\nWenn wir ein Kind verlieren, wird unser Blick von den
  Vergn\u00fcgungen und dem Treiben dieser Welt zu\\n\\nhimmlischer Freude und himmlischem
  Wesen hin\u00ad gewendet. Unsere Priorit\u00e4ten stimmen wieder, un\u00ad sere
  Wertsch\u00e4tzung wird neu justiert, damit die richtigen Dinge, die Dinge Gottes,
  wieder den ersten Platz einnehmen.\\n\\nUnsere Antwort auf Gottes Segnungen sollte
  un\u00ad unterbrochenes Loben und Danken sein. Denn das dankbare Herz ist das Herz,
  das sich an alles erinnert, was der Herr getan hat, tut und zu tun verhei\u00dfen
  hat, und ihn daf\u00fcr preist.\\n\\n7. Um uns zu bef\u00e4higen, zuk\u00fcnftige
  Tr\u00fcbsale und Schwierigkeiten besser zu ertragen. K\u00fcrzlich h\u00f6rte ich
  von einer Frau, bei der man Krebs festgestellt hatte, zwei Jahre nachdem sie ein
  Kind verloren hatte. Dann, w\u00e4hrend sie noch wegen der Krebserkrankung behandelt
  wurde, starben sowohl ihre Mutter als auch ihr Vater bei einem Autounfall. Es war,
  als w\u00fcrde bei ihr ein Kummer auf den anderen geh\u00e4uft.\\n\\nSie erz\u00e4hlte
  dem Pastor, der sie im Krankenhaus besuchte, in dem sie sich einer ChemotherapieBehandlung
  unterzog: \u00bbIch f\u00fcrchte den Tod nicht mehr so wie fr\u00fcher. Ich f\u00fcrchte
  auch die Schmerzen und die k\u00f6rperlichen Beschwerden nicht mehr auf die Weise,
  wie es fr\u00fcher der Fall war. Denn ich erlebte viel mehr als nur das Sterben
  meines Kindes an seiner Krankheit. W\u00e4hrend ich mein Kind immer magerer werden
  sah und wie es dem Tod entgegenzugehen schien, da wurde der Herr immer st\u00e4rker\\n\\nin
  meinem Leben. Er wurde von Woche zu Woche m\u00e4chtiger und anbetungsw\u00fcrdiger
  als mein Erretter, Erl\u00f6ser, Heiland und Herr. Je dunkler die Tage wurden, in
  denen mein Kind immer schw\u00e4cher wurde, umso heller leuchtete der Herr in mein
  Leben. Und er leuchtet immer noch so.\u00ab\\n\\nSie fuhr fort: \u00bbIch will gern
  von dieser Krankheit, dem Krebs, geheilt werden, damit ich meinen beiden anderen
  Kindern weiterhin eine Mutter sein kann. Ich will auch in Christus Jesus ein siegreiches
  Leben f\u00fchren, bis er mich heimruft. Doch wenn er mich schon fr\u00fcher nach
  Hause holt, bin ich dazu genauso bereit. Er hat mir seine hindurchtragende Gnade
  und Liebe bewiesen, und er f\u00e4hrt fort, mir seine Gnade und Liebe t\u00e4glich
  zu offenbaren. Ich kenne ihn nun auf eine Weise, die mir noch vor ein paar Jahren
  un\u00ad bekannt war. So bin ich voller Vertrauen, dass er mich nie verlassen oder
  vers\u00e4umen wird. Er wird mich nur immer fester in seine ewigen Arme schlie\u00dfen.\u00ab\\n\\nWelch
  ein wunderbares und m\u00e4chtiges Zeugnis kann diese Frau ablegen! Wie sich heute
  zeigt, hat sie ihre Krebsbehandlung bisher um f\u00fcnfzehn Jahre \u00fcberlebt.
  Ihr \u00e4lterer Sohn geht auf die h\u00f6here Schule. Ihre \u00e4ltere Tochter
  ist verheiratet und hat ein Baby. Und wer passt wohl auf die Kleine auf, w\u00e4hrend
  die Mutter noch weiter zum College geht, um ihr Examen zu machen? Eine sehr liebevolle
  und glaubensstarke Gro\u00dfmutter! Diese Frau ist zu einer S\u00e4ule der Kraft\\n\\ngeformt
  worden, weil der Herr stets bei ihr war, als ein Unheil nach dem anderen \u00fcber
  sie hereinbrach. Das bringt mich zu einem achten Punkt, der zeigt, wie Tr\u00fcbsale
  und Trag\u00f6dien etwas Gutes in unserem Leben bewirken.\\n\\n8. Um uns zu helfen,
  \u00bbTragkraft\u00ab zu entwickeln, damit wir noch n\u00fctzlicher f\u00fcr Gottes
  Reich werden.\\n\\nDer Schreiber des Hebr\u00e4erbriefes spricht von gottesf\u00fcrchtigen
  M\u00e4nnern und Frauen, \u00bbdie durch Glauben K\u00f6nigreiche bezwangen, Gerechtigkeit
  wirkten, Verhei\u00dfungen erlangten, der L\u00f6wen Rachen verschlossen, des Feuers
  Kraft ausl\u00f6schten, des Schwertes Sch\u00e4rfe entgingen, aus der Schwachheit
  Kraft gewannen\u00ab (Hebr\u00e4er 11,33-34).\\n\\nIn beinahe jedem Fall, der mir
  pers\u00f6nlich bekannt wurde, haben sich Eltern, die ein Kind verloren hatten,
  im Vergleich zu fr\u00fcher als st\u00e4rker und n\u00fctzlicher im Dienst erwiesen,
  wenn es darum ging, Eltern zu helfen, die schwere Zeiten mit einem kranken Kind
  erlebten oder die erst k\u00fcrzlich ein Kind verloren hatten. Gott r\u00fcstet
  seine Heiligen teilweise durch solche Erfahrungen aus. Wenn wir in den eigenen Pr\u00fcfungen
  und Katastrophen gelernt haben, auf Gott zu vertrauen, sind wir besser darauf vorbereitet,
  anderen zum Gottvertrauen zu verhelfen.\\n\\nDie Frau, von der ich vorhin sprach,
  hilft nicht nur in der Familie, indem sie t\u00e4glich f\u00fcr ihr Enkelkind sorgt,
  sie leitet auch den Krankenhaus-Besuchsdienst in\\n\\nihrer Gemeinde. Sie selbst
  besucht die kranken Kinder dort, indem sie sagt: \u00bbIch kann den Eltern etwas
  erz\u00e4hlen, weil sie wissen, dass mein Glaube Hand und Fu\u00df hat und meine
  Hoffnung echt ist. Das wissen sie nicht nur aus der Bibel, die ich mit ihnen lese,
  und aus meinen Gebeten, sondern sie wissen es aus meiner Erfahrung. Ich kann ihnen
  mit gro\u00dfer Zuversicht sagen, dass Gott keine Fehler macht, niemals entt\u00e4uscht
  und uns in unserem Kummer nie alleinl\u00e4sst.\u00ab\\n\\nDer Apostel Paulus schrieb
  den Korinthern:\\n\\nGepriesen sei der Gott und Vater unseres Herrn Jesus Christus,
  der Vater der Erbarmungen und Gott allen Trostes, der uns tr\u00f6stet in all unserer
  Bedr\u00e4ngnis, damit wir die tr\u00f6sten k\u00f6nnen, die in allerlei Bedr\u00e4ngnis
  sind, durch den Trost, mit dem wir selbst von Gott getr\u00f6stet werden; denn so
  wie die Leiden des Christus gegen uns \u00fcberreichlich sind, so ist auch durch
  den Christus unser Trost \u00fcberreichlich (2. Korinther 1,3-5).\\n\\nIch kenne
  nicht die genauen Gr\u00fcnde, weshalb Gott Ihr Kind sterben lie\u00df; aber ich
  wei\u00df sehr wohl, dass Sie einige f\u00fcr die Ewigkeit wertvolle Lektionen lernen
  und zu Ihrem geistlichen und ewigen Wohl wachsen werden, wenn Sie ihn sein Werk
  an Ihnen und durch Sie tun lassen wollen. So m\u00f6chte ich Sie heute ermutigen:\\n\\nPr\u00fcfen
  Sie Ihr Herz. Fragen Sie den Herrn, wo Ihr\\n\\nGlaube nach seinem Willen wachsen
  soll. Wenn es Bereiche gibt, hinsichtlich derer Sie Bu\u00dfe tun m\u00fcssen, dann
  z\u00f6gern Sie nicht. Wenn es Gebiete pers\u00f6n\u00ad licher geistlicher Disziplin
  gibt, auf denen Sie wachsen m\u00fcssten, dann legen Sie mehr Wert auf solche Disziplin
  in Ihrem Leben. Lassen Sie die folgenden Worte zu Ihrem Gebet werden: \u00bbHerr,
  ich glaube, hilf meinem Unglauben!\u00ab\\n\\nSetzen Sie Ihr ganzes Vertrauen auf
  den Herrn. Bitten Sie den Herrn, Ihnen zu zeigen, wo Sie vielleicht auf Ihre Talente
  oder F\u00e4higkeiten, auf Ihre Urteilskraft, Ihr Denkverm\u00f6gen oder Ihre pers\u00f6nliche
  Ausstrahlung vertrauten \u2013 statt auf Gott zu vertrauen. Machen Sie die folgenden
  Worte zu Ihrem Gebet: \u00bbHerr, hilf mir in allen Dingen und zu aller Zeit, allein
  auf dich zu vertrauen \u2013 ungeachtet dessen, wie die \u00e4u\u00dferen Umst\u00e4nde
  oder Folgen sind.\u00ab\\n\\nPr\u00fcfen Sie Ihre Lebenspriorit\u00e4ten. Stellen
  Sie die Dinge an die erste Stelle, die auch wirklich am meisten z\u00e4hlen? Formulieren
  Sie doch ein Gebet mit den folgenden Worten: \u00bbHerr, hilf mir, das Leben so
  zu sehen, wie du es siehst, und lass mich die Priorit\u00e4tenliste so ordnen, wie
  es dir gef\u00e4llt.\u00ab\\n\\nW\u00e4hlen Sie die Hoffnung. Bitten Sie den Herrn,
  Ihre Mutlosigkeit in Mut zu verwandeln, indem er Ihnen Gelegenheit gibt, anderen
  gegen\u00fcber Hoffnung auszudr\u00fccken. Wenn Sie \u00fcber Ihre Himmelshoffnung
  sprechen und \u00fcber Ihre Hoffnung, dass Gottes Herrlichkeit dereinst aller Sch\u00f6pfung
  offenbart wird, werden Sie selbst Mut fassen. Lassen Sie dies zu Ihrem Gebet werden:
  \u00bbHerr, lass mich doch mehr begreifen, was du alles f\u00fcr mein Kind und f\u00fcr
  mich in der Ewigkeit bereitet hast.\u00ab\\n\\nBeurteilen Sie, was Sie am meisten
  lieben. Lieben Sie eher Menschen oder Dinge? Lieben Sie mehr sich selbst oder andere?
  Lieben Sie den Herrn f\u00fcr das, was er ist, oder f\u00fcr das, was er hoffentlich
  f\u00fcr Sie tun wird? Unterziehen Sie Ihr Ich einer \u00bbHerzenspr\u00fcfung\u00ab.
  Bringen Sie doch im Gebet etwa folgende Worte zum Ausdruck: \u00bbHerr, ich liebe
  dich. Hilf mir, dich mit reinerer, tieferer, allumfassender Liebe zu lieben. Hilf
  mir, meine Augen auf dich gerichtet zu halten.\u00ab\\n\\nLegen Sie wieder mehr
  Nachdruck auf das Loben und Danken in Ihrem Leben. Ein dankbares Herz wei\u00df
  zu sch\u00e4tzen, was Gott tut, wie er vorsorgt, was er gibt, und vor allem, wer
  Gott ist. Ein solches Herz versteht und genie\u00dft die geistlichen Segnungen,
  die nur Gott geben kann. M\u00f6ge Ihr Gebet wie folgt lauten: \u00bbHerr, lass
  mich lieben, was du liebst. Lass mich alles annehmen, was du mir geben willst. Lass
  mich erf\u00fcllt sein mit allem, was du bist.\u00ab\\n\\nBitten Sie den Herrn,
  Sie st\u00e4rker und ausdauernder zu machen. Bitten Sie den Herrn um den Mut f\u00fcr
  das, was vor Ihnen liegt. Beten Sie daher folgenderma\u00dfen: \u00bbHilf mir, Herr,
  mich auf das vorzubereiten, was du bereits f\u00fcr mich vorbereitet hast.\u00ab\\n\\nSehen
  Sie sich nach M\u00f6glichkeiten um, anderen zu dienen. Bitten Sie den Herrn, Ihnen
  zu zeigen, auf welche Weise Sie anderen helfen k\u00f6nnen, die in Not sind. Bitten
  Sie ihn, Sie zu solchen zu schicken, die ein Wort des Glaubens, der Liebe und der
  Ermutigung brauchen. Machen Sie folgende Worte zu Ihrem Gebet: \u00bbHerr, lass
  mich heute ein Segen f\u00fcr andere werden.\u00ab\\n\\nWie sollen wir reagieren?\\n\\nAlle
  Eltern, die ein Kind verloren haben, brauchen eine Zeit, den Verlust dieses Kindes
  zu betrauern. Es kommt aber der Punkt, an dem dieses Trauern be\u00ad endet werden
  muss. Die Heilige Schrift sagt uns, dass es mindestens f\u00fcnf Schl\u00fcssel
  gibt, durch die man nach dem Tod eines Babys wiederhergestellt wird.\\n\\nFreude.
  Zun\u00e4chst m\u00fcssen wir uns f\u00fcr eine freudige Haltung entscheiden. Freude
  ist nicht etwas, das man automatisch empfindet oder eben nicht empfindet. Sehr oft
  muss man sich f\u00fcr die Freude entscheiden. Diese Entscheidung ist eine Willenssache.
  Wir k\u00f6nnen w\u00e4hlen, welche Haltung wir einnehmen wollen. Wir k\u00f6nnen
  uns entscheiden, ob wir lachen oder finster dreinschauen wollen. Wir k\u00f6nnen
  uns entscheiden, ob wir Gott loben oder ob wir schweigen wollen. Wir k\u00f6nnen
  uns entscheiden, ob wir anderen gegen\u00fcber Freude oder Kummer \u00e4u\u00dfern
  wollen. Jakobus schrieb: \u00bbHaltet es f\u00fcr lauter Freude, meine Br\u00fcder,
  wenn ihr in mancherlei Pr\u00fcfungen fallt\u00ab (Jakobus 1,2).\\n\\n\u00bbAber
  ich f\u00fchle mich nicht froh gestimmt!\u00ab, k\u00f6nnten Sie antworten. \u00bbIst
  es nicht Heuchelei, wenn ich etwas zeige, das ich gar nicht empfinde?\u00ab\\n\\nNein.
  Wir werden durch die Heilige Schrift aufgefordert, zu w\u00e4hlen, wie wir uns f\u00fchlen
  wollen. Jakobus sagte nicht: \u00bbF\u00fchlt euch ganz und gar gl\u00fccklich!\u00ab
  Vielmehr sagte er: \u00bbHaltet es f\u00fcr lauter Freude.\u00ab Wir sollen dem
  Herrn gegen\u00fcber zuerst Lob und Dank aussprechen und unserer Hoffnung und Freude
  zuerst Ausdruck geben \u2013 die Gef\u00fchle werden folgen. Die Welt wartet auf
  Gef\u00fchle und handelt dann. Der Christ wird aufgefordert, erst einmal zu handeln,
  weil er wei\u00df, dass die Gef\u00fchle als Ergebnis dieses Handelns folgen werden.\\n\\nGeduld.
  Zweitens m\u00fcssen wir uns f\u00fcr den Glauben entscheiden, dass Gott einen Zeitplan
  und seine Absichten f\u00fcr alles hat. Wir m\u00fcssen uns daf\u00fcr entscheiden,
  geduldig auf die Offenbarung und die Erf\u00fcllung der g\u00f6ttlichen Absichten
  zu warten. Jakobus schrieb weiter: \u00bb\u2026 da ihr wisst, dass die Bew\u00e4hrung
  eures Glaubens Ausharren bewirkt. Das Ausharren aber habe ein vollkommenes Werk,
  damit ihr vollkommen und vollendet seid und in nichts Mangel habt\u00ab (Jakobus
  1,3-4).\\n\\nEin altes Sprichwort sagt, die Zeit heile Wunden. Einige alte Spr\u00fcche
  stimmen einfach nicht. Die Zeit mag dazu beitragen, dass der Schmerz einiger Wunden
  ein wenig verblasst; aber die Zeit als solche heilt\\n\\nniemals. Gott heilt. Er
  heilt uns zumindest teilweise, wenn wir ihm vertrauen, dass er in allen Dingen und
  zu aller Zeit und bei allen seinen souver\u00e4nen Absichten Gott ist, auch wenn
  uns einige seiner Absichten zu unseren Lebzeiten vielleicht nicht geoffenbart werden.
  Wir m\u00fcssen uns entscheiden, geduldig darauf zu vertrauen, dass Gott nach seinem
  Zeitplan und nach den von ihm gew\u00e4hlten Methoden handelt.\\n\\nDieses Leben
  \u2013 und alles, was wir unter \u00bbZeit\u00ab verstehen \u2013 ist nichts, was
  wir mit der Ewigkeit vergleichen k\u00f6nnten. Unser Leben ist nur \u00bbein Dampf,
  \u2026 der f\u00fcr eine kurze Zeit sichtbar ist und dann verschwindet\u00ab (Jakobus
  4,14). Gott arbeitet mit dem Zeitplan der Ewigkeit. Seine Absichten sind ewig. Wir
  m\u00fcssen uns entscheiden, die Dinge von dieser Warte aus zu be\u00adtrachten
  \u2013 so gut wir es k\u00f6nnen \u2013, und ihm da vertrauen, wo wir nichts mehr
  sehen und verstehen k\u00f6nnen.\\n\\nWeisheit. Drittens m\u00fcssen wir nach Weisheit
  suchen. Es gibt manches, was wir \u00fcber die Ursachen des Todes unseres Kindes
  wissen sollten \u2013 um Lek\u00adtionen von Ewigkeitswert daraus zu lernen. Es
  gibt einige Dinge, die wir einfach Gott \u00fcberlassen m\u00fcssen, indem wir ihm
  vertrauen.\\n\\nF\u00fcr einige Situationen mag es keinerlei Antworten geben. Manche
  L\u00f6sungen m\u00f6gen dem Einzelnen nicht zu Gebote stehen. Einige Probleme m\u00f6gen
  immer ein Geheimnis bleiben. Bitten Sie den Herrn,\\n\\ndass er Ihnen die Dinge
  offenbart, die Sie nach seinem Willen erkennen sollen, um durch diese Erfahrungen
  geistlich zu wachsen.\\n\\nDabei ist es besonders wichtig, Gott mit der vollen Glaubenserwartung
  um Weisheit zu bitten, dass er sie auch geben werde. Jakobus sagt uns:\\n\\n\u00bbWenn
  aber jemand von euch Weisheit mangelt, so erbitte er sie von Gott, der allen willig
  gibt und nichts vorwirft, und sie wird ihm gegeben werden. Er bitte aber im Glauben,
  ohne irgend zu zweifeln; denn der Zweifelnde gleicht einer Meereswoge, die vom Wind
  bewegt und hin und her getrieben wird. Denn jener Mensch denke nicht, dass er etwas
  von dem Herrn empfangen wird; er ist ein wankelm\u00fctiger Mann, unstet in allen
  seinen Wegen\u00ab (Jakobus 1,5-8).\\n\\nEin unterw\u00fcrfiger Wille. Gottes Wunsch
  besteht darin, dass wir unseren Willen stets seinem Willen unterwerfen. Es gibt
  wohl nichts, was schwieriger ist. Als Menschen neigen wir dazu, immer die Nummer
  1 sein zu wollen. Den Stolz abzulegen, ist \u00e4u\u00dferst m\u00fchsam.\\n\\nDie
  Heilige Schrift sagt uns aber, dass Gott sein vollkommenes und vollst\u00e4ndiges
  Werk in uns und durch uns erst tun kann, wenn wir bereit sind, unseren Willen seinem
  Willen unterzuordnen.\\n\\nIn dem oben zitierten Jakobustext (Jakobus 1,3-4)\\n\\nbedeutet
  \u00bbvollkommen\u00ab so viel wie \u00bbvoll entwickelt\u00ab. Gott beruft uns
  zu geistlicher Reife. Dies zeugt von Vollendung \u2013 davon, dass wir heil gemacht
  bzw. zur F\u00fclle gebracht worden sind. Uns fehlt nichts mehr. Das ist Gottes
  Plan f\u00fcr einen jeden von uns.\\n\\nIch habe eine Reihe von Frauen getroffen,
  die meinen, sie k\u00f6nnten nicht \u00bbvollkommen\u00ab werden, bevor sie nicht
  ein Kind zur Welt gebracht haben. Sie messen ihren eigenen Wert daran, ob sie in
  der Lage sind, ein Kind zu bekommen. Wenn sie keine Kinder empfangen bzw. kein Kind
  austragen k\u00f6nnen, wenn sie eine Totgeburt haben oder das Kind kurz nach der
  Geburt stirbt, dann sind sie todungl\u00fccklich. Viele sind untr\u00f6stlich, weil
  sie kinderlos sind, obwohl sie verzweifelt gern eines h\u00e4tten.\\n\\nSolche Frauen
  m\u00fcssen sich sehr ehrlich fragen: \u00bbH\u00e4ngt f\u00fcr mich mein Wert davon
  ab, dass ich ein Kind zur Welt bringe? Werde ich erst dadurch vollkommen oder zur
  F\u00fclle gebracht? Glaube ich, dass ich in den Augen anderer vollkommener bin
  und mehr Achtung verdiene, wenn ich ein Kind habe und Mutter bin? Denke ich, dadurch
  die Anerkennung anderer zu erwerben?\u00ab Gottes Wunsch f\u00fcr uns alle \u2013
  nicht nur f\u00fcr werdende M\u00fctter \u2013 besteht darin, dass wir in ihm und
  nur in ihm allein den Urheber und Vollender unseres Lebens sehen. Er ist es, der
  uns unsere Identit\u00e4t, unseren Wert und unser Zugeh\u00f6rig\u00ad keitsgef\u00fchl
  gibt. Er allein ist es, der uns vollkommen macht und uns in der Umgestaltung in
  das Bild Christi Jesu zu voller Reife bringt.\\n\\nIn einigen F\u00e4llen scheint
  es nicht Gottes Wille zu sein, dass Frauen oder Ehepaare leibliche Kinder haben,
  sondern dass sie Babys adoptieren sollen, die un\u00ad bedingt ein liebevolles,
  christliches Zuhause brauchen. In anderen F\u00e4llen will Gott, dass sich Ehepaare
  der geistlichen Geburt von Seelen widmen. Diese Paare verfolgen dann das Ziel, Seelen
  zu gewinnen oder Neubekehrte in der J\u00fcngerschaft voranzubringen, statt eigene
  Kinder zu erziehen.\\n\\nFragen Sie den Herrn, was sein Wille f\u00fcr Sie ist,
  und unterwerfen Sie sich seinem Willen! Tun Sie alles, was Sie tun k\u00f6nnen \u2013
  und dann vertrauen Sie Gott, dass er am besten wei\u00df, was f\u00fcr Ihre endg\u00fcltige
  Vollkommenheit, Freude und Zielsetzung das Beste ist. Er hat Sie mit einem bestimmten
  Ziel erschaffen. Bitten Sie ihn, Ihnen sein Ziel zu offenbaren, damit Sie mit ganzem
  Herzen, mit ganzem Verstand und mit ganzer Seele daf\u00fcr wirken k\u00f6nnen.\\n\\nEin
  gl\u00e4ubiges Herz. Mehr als alles aber fordert der Herr von Ihnen \u2013 in allen
  Lagen und trotz aller Konsequenzen \u2013 ein gl\u00e4ubiges Herz. Er ruft uns auf,
  ihm zu vertrauen, dass er gro\u00dfz\u00fcgig alles gibt, was zu unserem Guten dient,
  weil er \u00bballen willig gibt und nichts vorwirft\u00ab (vgl. Jakobus 1,5-8).\\n\\nDer
  Herr wei\u00df, was wir brauchen, und er m\u00f6chte,\\n\\ndass es auch Ihnen zuteilwird.
  In vielen F\u00e4llen verlangt er jedoch auch, dass Sie ihn um das Ben\u00f6tigte
  bitten \u2013 nicht weil er Ihre Bed\u00fcrfnisse nicht kennt, sondern weil Sie
  lernen sollen, was Ihnen fehlt. Oftmals kennen wir unsere eigenen Herzen nicht,
  bevor wir nicht unsere eigenen Gef\u00fchle, N\u00f6te und Sehns\u00fcchte zur Sprache
  bringen.\\n\\nJesus sagte:\\n\\nBittet, und es wird euch gegeben werden; sucht,
  und ihr werdet finden; klopft an, und es wird euch aufgetan werden. Denn jeder Bittende
  empf\u00e4ngt, und der Suchende findet, und dem Anklopfenden wird aufgetan werden.
  Oder welcher Mensch ist unter euch, der, wenn sein Sohn ihn um ein Brot bitten wird,
  ihm einen Stein geben wird, oder auch, wenn er um einen Fisch bitten wird, ihm etwa
  eine Schlange geben wird? Wenn nun ihr, die ihr b\u00f6se seid, euren Kindern gute
  Gaben zu geben wisst, wie viel mehr wird euer Vater, der in den Himmeln ist, denen
  Gutes geben, die ihn bitten! (Matth\u00e4us 7,7-11).\\n\\nBitten Sie den Herrn um
  das, was Sie begehren. Und dann seien Sie bereit, zu glauben, dass alles, was Gott
  daraufhin gibt, die f\u00fcr Sie wahrhaft beste Antwort ist. Gott mag nicht mit
  \u00bbJa\u00ab antworten; doch Sie k\u00f6nnen sich sicher sein, dass, wenn er mit
  \u00bbNein\u00ab antwortet oder mit \u00bbNoch nicht\u00ab oder mit \u00bbWenn gewisse
  Voraussetzungen erf\u00fcllt sind\u00ab, dies f\u00fcr Sie die beste Antwort ist.\\n\\nSuchen
  Sie das Beste von Gott und vertrauen Sie darauf, dass er Ihnen sein Bestes tats\u00e4chlich
  gibt.\\n\\nHeil werden\\n\\nWenn Sie sich daf\u00fcr entscheiden, ein Leben der
  Freude zu f\u00fchren, wenn Sie es vorziehen, geduldig auf die Erf\u00fcllung des
  g\u00f6ttlichen Zeitplans in Ihrem Leben zu warten, wenn Sie nach Weisheit suchen
  wollen, wenn Sie sich best\u00e4ndig dem Herrn unterwerfen und Gott in allen Dingen
  vertrauen, werden Sie bestimmt heil werden. Ihr gebrochenes Herz wird geheilt werden,
  und Ihr Leben wird wieder in Ordnung kommen. Sie werden die \u00bbWarum-Fragen\u00ab
  unterlassen k\u00f6nnen. Sie werden mutig, mit Kraft und st\u00e4rkerem Glauben
  in die Zukunft zu blicken verm\u00f6gen. Sie werden eine erneuerte Zielstrebigkeit
  und einen gr\u00f6\u00dferen Glauben bekommen, den sie auch anderen gegen\u00fcber
  bezeugen k\u00f6nnen.\\n\\nIch m\u00f6chte Sie ermutigen, heute zu beten:\\n\\nHerr,
  hilf mir, die Freude auszudr\u00fccken, die einem Christen angemessen ist. Hilf
  mir, dir in Bezug auf den Zeitplan meines Lebens und all derer, die ich liebe, zu
  vertrauen. Hilf mir, alles, was mir und meinen Lieben passiert, mehr unter dem Blickwinkel
  der Ewigkeit zu sehen. Hilf mir, alles zu erfahren und zu entdecken, was du mich
  wissen lassen willst. Gib mir deine Weisheit. Hilf, dass ich meinen Willen dem deinen
  unterwerfe, und zwar v\u00f6llig und auf allen Gebieten meines Lebens. Hilf mir,
  dir zu vertrauen, dass du wei\u00dft, was das Beste f\u00fcr mich ist, dass du es
  auch in meinem Leben bewirken wirst und dass du schon dabei bist, alle Dinge so
  zu gestalten, dass sie zu meinem ewigen Heil und zu dem meiner Lieben zusammenwirken.
  Ich bete im Glauben zu dir, Herr, und ich halte Ausschau nach den Antworten, die
  du mir geben wirst, w\u00e4hrend ich in Jesu Namen bete. Amen.\\n\\nWie sollen wir
  denen dienen,\\n\\ndie in tiefer Trauer sind?\\n\\nEine ganze Reihe von Eltern,
  die kleine Kinder verloren hatten, teilten mir im Laufe der Jahre mit, dass sie
  wunderbaren, weisen und gottgem\u00e4\u00dfen seelsorgerlichen Rat nach dem Tod
  ihrer Kleinen bekommen hatten. Andere berichteten jedoch, sie h\u00e4tten sehr schlechte
  oder unzul\u00e4ngliche Ratschl\u00e4ge erhalten. In einigen F\u00e4llen verst\u00e4rkte
  das, was die anderen sagten oder taten, nur ihren Schmerz und ihre Verwirrung. In
  diesem Kapitel m\u00f6chte ich Ihnen denjenigen seelsorgerlichen Dienst vorstellen,
  den Sie sich hoffentlich in Ihrem Verlust auch aussuchen werden. Weil ich es f\u00fcr
  sehr wahrscheinlich halte, dass der Herr Sie k\u00fcnftig berufen wird, anderen
  zu dienen, will ich auch Ihnen helfen, auf ganz praktische Weise ein ausgezeichneter,
  weiser und gottesf\u00fcrchtiger Seelsorger f\u00fcr andere zu werden. Ich m\u00f6chte
  damit beginnen, Ihnen die Geschichte einer Frau mit Namen Lisa vorzustellen:\\n\\nLisa
  erwachte mit Kr\u00e4mpfen in ihrem Bauch. Ihr erster Gedanke war: Sodbrennen! Sie
  wusste, dass sie schwanger war \u2013 erst seit ungef\u00e4hr drei Monaten \u2013,
  aber sie brachte die Kr\u00e4mpfe nicht mit ihrer Schwangerschaft in Zusammenhang.
  Bei ihrer ersten Schwangerschaft hatte sie solche stechenden Schmerzen in ihrem
  Leib nicht gehabt, und so glaubte sie\\n\\nsofort, die Schmerzen hingen mit ihrer
  Verdauung zusammen. \u00bbDas Essen beim Italiener gestern Abend war ziemlich stark
  gew\u00fcrzt\u00ab, dachte sie und versuchte, wieder einzuschlafen. Vorher nahm
  sie noch einige Tabletten, die der Arzt ihr als \u00bbungef\u00e4hrlich f\u00fcr
  die Schwangerschaft\u00ab aufgeschrieben hatte, falls sie Verdauungsst\u00f6rungen
  haben sollte, mit denen sie seit der Geburt ihres ersten Sohnes vor zwei Jahren
  ziemlich h\u00e4ufig zu tun hatte. Sie war sehr dankbar, dass ihr Kind in dieser
  Nacht bei seiner Gro\u00dfmutter schlief. Das war ein Geschenk ihrer Mutter, damit
  sie und ihr Mann die Gelegenheit dazu hatten, einmal \u00bbauszugehen\u00ab.\\n\\nDrei
  Stunden sp\u00e4ter erwachte Lisa wieder, diesmal von \u00e4u\u00dferst heftigen
  Kr\u00e4mpfen geplagt. Sie wusste, dass etwas sehr Schlimmes vorlag. Sie war vor
  Schw\u00e4che kaum imstande, das Telefon zu erreichen, um ihren Mann auf Arbeit
  anzurufen. Er raste nach Hause, brachte sie aus der Wohnung, bettete sie auf dem
  R\u00fccksitz des Autos und jagte mit ihr zum Krankenhaus. Innerhalb einer Stunde
  h\u00f6rten sie und ihr Mann die Worte, von denen sie sich bisher nicht hatten vorstellen
  k\u00f6nnen, sie jemals zu vernehmen: \u00bbSie haben Ihr Baby verloren.\u00ab\\n\\nEs
  bedurfte einer mehrst\u00fcndigen Beratung durch eine Krankenschwester in der Klinik,
  bis Lisa mit der Tatsache Frieden machen konnte, dass es auch nichts gen\u00fctzt
  h\u00e4tte, wenn sie die Kr\u00e4mpfe im Krankenhaus\\n\\nbekommen h\u00e4tte. Nichts
  h\u00e4tte die Fehlgeburt verhindern k\u00f6nnen.\\n\\nZwei Tage sp\u00e4ter ging
  Lisa zu ihrem Arzt, der sie damit tr\u00f6stete, dass sie aller Wahrscheinlichkeit
  nach noch weiterhin schwanger werden und ein Kind bekommen k\u00f6nnte \u2013 nur
  m\u00fcsste sie eine Weile warten. Doch war sie alles andere als getr\u00f6stet
  durch das, was eine Arzthelferin ihr in der Praxis sagte. Diese Helferin geh\u00f6rte
  nicht zu der regul\u00e4ren Belegschaft, sondern machte nur ein paar Tage Vertretung
  dort, weil die normalen Helferinnen entweder Urlaub hatten, der nicht verlegt werden
  konnte, oder krank waren. Die Aushilfskraft sagte: \u00bbAch, meine Liebe, seien
  Sie froh. Was Sie verloren haben, war kein Baby, sondern nur ein Klumpen Gewebe.
  Und offensichtlich war damit etwas nicht in Ordnung. Sie s\u00e4\u00dfen vielleicht
  sp\u00e4ter mit einem missgestalteten Baby da, wenn Sie diesen Gewebeklumpen nicht
  verloren h\u00e4tten.\u00ab\\n\\nLisa war \u00fcber die Bemerkung der Arzthelferin
  tief beunruhigt. War es nur ein fehlgeleiteter Mutterinstinkt, der sie diesen Verlust
  so schmerzlich empfinden lie\u00df? War ihr tiefer Kummer v\u00f6llig grundlos?
  Weit davon entfernt, durch diese Frau getr\u00f6stet worden zu sein, war ihr die
  Ansicht, sie und Greg h\u00e4tten nichts als einen \u00bbKlumpen Gewebe\u00ab verloren,
  wie ein Schlag ins Gesicht. Der Gedanke, ihren Verlust so einfach abtun zu k\u00f6nnen,
  vermehrte nur ihr Herzeleid.\\n\\nSp\u00e4ter besprach sie ihre Gef\u00fchle mit
  Greg. Obwohl er versucht hatte, stark und stoisch zu erscheinen, um Lisa eine St\u00fctze
  in ihrer harten Probe zu sein, weinte er mit ihr zusammen, als sie ihm die Worte
  der Arzthelferin berichtete. Er war entsetzt \u00fcber die K\u00e4lte und Herzlosigkeit,
  ihren Kummer durch die Behauptung mildern zu wollen, ihr ungeborenes Kind sei \u00fcberhaupt
  kein wirklicher Mensch gewesen.\\n\\nLisa und Greg suchten seelsorgerlichen Rat
  bei ihrem Pastor. Er erinnerte sie an mehrere wichtige Grunds\u00e4tze:\\n\\n1.
  Das verstorbene Kind war ein Mensch mit einer Seele, v\u00f6llig unabh\u00e4ngig
  von dem Alter des Kindes zum Zeitpunkt des Todes. Das Kind war von Gott zu einem
  besonderen Zweck erschaffen, den Gott allein kennt. Das Kind hat eine ewige Bestimmung
  und lebt heute in der Gegenwart Gottes des Vaters.\\n2. Wir, die leben und auf dieser
  Erde bleiben, haben die Verpflichtung, Christus zu vertrauen, f\u00fcr ihn zu leben
  und treue Verk\u00fcndiger des Evangeliums gegen\u00fcber Freunden und lieben Verwandten
  zu sein. W\u00e4hrenddessen erwarten wir sehns\u00fcchtig die Zeit, da wir diesem
  Kind im Himmel begegnen werden.\\n3. Gott ist souver\u00e4n und vollkommen in allem,
  was er tut und ist. Wir m\u00fcssen lernen, anzuerkennen, dass wir seine Absichten
  und Pl\u00e4ne in vielen Situationen nicht durchschauen. Aber wir k\u00f6nnen darauf\\n\\nvertrauen,
  dass seine Absichten und Pl\u00e4ne vollkom\u00ad men sind. Von Zeit zu Zeit m\u00fcssen
  wir uns selbst an die Worte des Herrn erinnern, die er uns durch Jesaja sagen l\u00e4sst:\\n\\nDenn
  meine Gedanken sind nicht eure Gedanken, und eure Wege sind nicht meine Wege, spricht
  der HERR. Denn wie der Himmel h\u00f6her ist als die Erde, so sind meine Wege h\u00f6her
  als eure Wege und meine Gedanken als eure Gedanken\u00ab (Jesaja 55,8-9).\\n\\n4.
  Wir m\u00fcssen uns tats\u00e4chlich daran erinnern, dass Gott nicht nur imstande
  ist, gebrochene Herzen zu heilen. Nein, er findet sogar Gefallen daran, dies zu
  tun und das Leben am Boden Zerst\u00f6rter heil zu machen. Er kann uns auch wieder
  Mut geben, die Zukunft tatkr\u00e4ftig anzupacken. Er will, dass wir in neuer Freude
  und in der Hoffnung des ewigen Lebens vorangehen. Und er m\u00f6chte, dass wir die
  Pl\u00e4ne und Absichten umfassend annehmen, die er f\u00fcr unser Leben bereith\u00e4lt,
  das wir noch auf der Erde verbringen werden.\\n\\n5. Und schlie\u00dflich m\u00fcssten
  wir doch tief getr\u00f6stet sein, weil wir wissen, dass unser Baby im Himmel ist,
  in der Gegenwart Christi, wo es alle Wunder jenes herrlichen Ortes genie\u00dft,
  frei von allem Kummer dieser Erde, in vollkommener Gl\u00fcckseligkeit, umgeben
  von vollkommener Liebe, und wo es seinerseits Christus dankbar wiederliebt und ihn
  anbetet.\\n\\nGanz gewiss m\u00fcssen wir f\u00fcr trauernde Eltern da sein, damit
  sie sich bei uns ausweinen k\u00f6nnen, und ihnen Zeit zum Trauern geben. Manchmal
  bedeutet das einfach nur, still gegenw\u00e4rtig und \u00bbf\u00fcr sie da zu sein\u00ab,
  um mit ihnen ihren Kummer zu teilen (R\u00f6mer 12,15). Wir sollten nicht geschw\u00e4tzig
  sein oder einen unbek\u00fcmmerten Eindruck erwecken, um dadurch zu versuchen, sie
  von ihrem Tr\u00fcbsinn zu befreien, aber gleichzeitig m\u00fcssen wir sie ermutigen
  und selbst stark im Glauben sein. Darum m\u00fcssen wir trauernde Eltern auf Gottes
  Liebe und Barmherzigkeit hinweisen, auf seine Gnade und Souver\u00e4nit\u00e4t und
  auf seine Herausforderungen und Gebote, die uns auf die Zu\u00ad kunft verweisen
  und nicht in die Vergangenheit.\\n\\nAnnahme des Verlustes\\n\\nVielleicht das gr\u00f6\u00dfte
  Unrecht, das wir trauernden Eltern antun k\u00f6nnen, besteht darin, \u00fcber den
  Verlust, den sie erlitten haben, zu schweigen. Schweigen tr\u00e4gt wenig zur Heilung
  bei. Wenn wir uns weigern, \u00fcber den Verlust zu reden, verursacht das bei den
  Eltern in vielen F\u00e4llen ein ungerechtfertigtes Schuld- oder Schamgef\u00fchl..\\n\\n\u00bbDie
  Frau eines Pastors d\u00fcrfte eigentlich ihr Baby nicht verloren haben.\u00ab Das
  sagte Flo nach einer Fehlgeburt, als die Schwangerschaft gerade erst zweieinhalb
  Monate dauerte. Sie hatte vor nur einer Woche \u00fcberhaupt davon erfahren, dass
  sie schwanger war.\\n\\nFlos Ehemann verk\u00fcndigte eine \u00fcberzeugende Botschaft
  des Glaubens, der in der Lage sei, alle Lebensprobleme zu meistern. Flo f\u00fchlte
  sich schuldig, weil sie meinte, ihren Mann entt\u00e4uscht und die Wahrheit des
  Evangeliums in irgendeiner Weise vernachl\u00e4ssigt zu haben. Er seinerseits hatte
  anderen gegen\u00fcber nie erw\u00e4hnt, dass sie schwanger gewesen war und ihr
  Kind verloren hatte, w\u00e4hrend er mit seinen Predigten in einem anderen US-Bundesstaat
  den geist\u00adlichen Neuaufbruch in einer anderen Gemeinde unter\u00adst\u00fctz\u00ad
  \u00adte. Auch dar\u00fcber verlor er kein Wort, dass f\u00fcr sie irgendein Grund
  best\u00fcnde, sich wegen dieses Verlustes in ihrem Leben schuldig zu f\u00fchlen
  oder Reue zu empfinden.\\n\\nFlo hatte nur ihren Eltern und einer Freundin von ihrer
  Schwangerschaft erz\u00e4hlt. Statt ihnen nun auch von der Fehlgeburt zu berichten,
  sagte sie ihnen so heiter wie nur m\u00f6glich: \u00bbWar alles falscher Alarm.
  Nun brauche ich wenigstens nicht an Babyw\u00e4sche zu denken!\u00ab\\n\\nFlo schwieg
  \u00fcber ihre Schwangerschaft und ihre Fehl\u00adgeburt. Nie hat sie in der \u00d6ffentlichkeit
  dar\u00fcber geredet. Nicht einmal ihren beiden \u00e4lteren Kindern gegen\u00fcber
  erw\u00e4hnte sie etwas davon. Erst viele Jahre sp\u00e4ter, als ihre \u00e4lteste
  Tochter Beth das dritte Kind durch Fehlgeburt verloren hatte, erw\u00e4hnte sie,
  dasselbe Schicksal durchlitten zu haben. Mutter und Tochter kamen sich durch die
  gemeinsamen Tr\u00e4nen und den gleichen Verlust n\u00e4her als je zuvor. Flo ermutigte
  ihre Tochter Beth ebenso, v\u00f6llig anders mit dieser Sache umzugehen, als sie
  es getan hatte.\\n\\n\u00bbRede mit deinem Mann und mit deinen Freunden dar\u00fcber\u00ab,
  war Flos Rat. \u00bbNimm dir Zeit, \u00fcber den Verlust deines Babys zu trauern!\u00ab\\n\\nFlo
  bekannte ihrer Tochter: \u00bbIch habe nie wirklich \u00fcber den Verlust meines
  Babys getrauert. Meine Fehlgeburt war mir peinlich. Ich kam mir vor, als h\u00e4tte
  ich mich irgendwie an Gott und deinem Vater \u203avers\u00fcndigt\u2039. Erst voriges
  Jahr begriff ich, dass mein Kleines, das ich verloren habe, jetzt schon im Himmel
  ist. Dieses Baby hat nun seine volle Identit\u00e4t als Kind Gottes erlangt, und
  ich werde es eines Tages wiedersehen. In vielerlei Hinsicht empfinde ich jetzt gro\u00dfen
  Frieden und gro\u00dfe Freude \u2013 etwas, das ich mehr als drei\u00dfig Jahre
  lang nicht kannte \u2013, weil ein Teil von mir schon im Himmel ist.\u00ab\\n\\nFlo
  l\u00e4chelte ein wenig, als sie Beth verriet: \u00bbIch habe das Baby \u203aTerry\u2039
  genannt, weil das ein Name f\u00fcr einen Jungen oder f\u00fcr ein M\u00e4dchen
  sein kann.\u00ab\\n\\nWarum Terry? \u00bbWeil\u00ab, so erkl\u00e4rte Flo, \u00bbich
  auf dieser Erde noch ein wenig aushalten muss (engl: tarry), bevor ich zu meinem
  Kind kommen darf.\u00ab\\n\\nFlo geht es wie vielen Frauen, besonders aus ihrer
  Generation, die glauben, \u00bbversagt\u00ab zu haben, weil sie eine Fehlgeburt
  hatten. Die umfassendere Wahrheit\\n\\nder Heiligen Schrift aber lautet folgenderma\u00dfen:
  Alles Leben ist in Gottes H\u00e4nden, und er ist der Urheber und Vollender aller
  Werke, die er zuvor bereitet hat. Wie ich schon zuvor sagte, meinen viele Eltern
  heute, sie h\u00e4tten ihr Kind \u00bbgemacht\u00ab. Nichts k\u00f6nnte weiter von
  der Wahrheit entfernt sein. Nat\u00fcrlich sind sie Teil eines Vorgangs, den Gott
  benutzte; aber Gott allein erschafft Leben.\\n\\nFlo erlebte eine wunderbare Heilung
  ihrer Gef\u00fchle, als sie frei \u00fcber den erlittenen Verlust reden konnte.
  Sie war dadurch f\u00e4hig, zusammen mit Beth \u00fcber den Verlust von deren Baby
  zu trauern, war es doch Flos Enkelkind. Indem sie ihr Leid teilten, entdeckten sie,
  dass sie auch ihre gegenseitige Liebe teilten. Das gilt in den meisten F\u00e4llen
  \u2013 sobald zwei ihr Leid miteinander teilen, umschlingt sie das Band gemeinsamer
  Liebe.\\n\\nEin Verlust f\u00fcr die gesamte Gemeinde\\n\\nIch m\u00f6chte Ihnen
  noch eine weitere Geschichte erz\u00e4hlen, weil darin so viele wunderbare Dinge
  vorkommen, die wir als Mitchristen f\u00fcr solche tun k\u00f6nnen, die den Tod
  eines Kindes zu ertragen hatten.\\n\\nDan und Pamela, zwei Mitglieder unserer Gemeinde,
  haben mir mit treffenden Worten \u00fcber das Leben und den Tod ihres kleinen Ryan
  berichtet. Beide haben ihre jeweiligen Erfahrungen niedergeschrieben, und ich m\u00f6chte
  Ihnen beide Briefe weitergeben. Als Erstes kommt das, was Dan als Vater mir schrieb:\\n\\n\u00bbSei
  es, dass wir wachen oder schlafen, wir werden zusammen mit ihm leben.\u00ab Diese
  Worte stehen in Bronzelettern auf dem Grabstein unseres Sohnes. Sie beschreiben
  die unersch\u00fctterliche Hoffnung und den Trost seiner Mutti und seines Vatis.\\n\\nRyan
  starb vor sechs Jahren in meinen Armen. Ich hielt ihn und k\u00fcsste ihn, bis er
  aufh\u00f6rte zu atmen. Das medizinische Personal des Kinderkrankenhauses k\u00e4mpfte
  heldenhaft, um sein Leben zu retten. Doch er konnte das Trauma einer Darmoperation
  nicht \u00fcberstehen. Sein Herz gab einfach auf.\\n\\nRyan weilte sieben Tage lang
  auf dieser Erde. Meine Frau hatte eine l\u00e4ngere und gr\u00fcndlichere Bindung
  zu ihm, hatte sie ihn doch f\u00fcnfunddrei\u00dfig Wochen bis zur Geburt getragen.\\n\\nOhne
  zu sehr auf Einzelheiten einzugehen, kann ich sagen, dass Ryan gesund zur Welt gebracht
  wurde. Obwohl er klein war \u2013 unter drei Pfund \u2013 waren seine Lungen entwickelt,
  und er konnte ohne Hilfen atmen. Eine Darminfektion am sechsten Tag ver\u00e4nderte
  die guten Aussichten. Unsere Herzen wurden in den folgenden achtundvierzig Stunden
  gemartert, in denen sich sein Zustand einmal scheinbar stabilisierte, dann aber
  wiederholt in einem grausam erscheinenden Rhythmus verschlechterte. Am Ende wurde
  Ryan ein schwieriges Erdendasein erspart, und er wurde in Gottes Gegenwart gebracht.\\n\\nGottes
  Wille im Leiden ist oft in Geheimnisse geh\u00fcllt. Wir sind gl\u00fccklich, dass
  er uns das Gute wahrnehmen lie\u00df, das durch Ryans kurzes Leben bewirkt wurde.
  Mir wurden diese unver\u00e4nderlichen Wahrheiten ganz deutlich vor Augen gef\u00fchrt:\\n\\nErstens
  begriff ich die Wahrheit, dass Gott allein souver\u00e4n ist. Ich bin es nicht.
  Er bestimmt jeden Aspekt meiner Zukunft \u2013 vom Gesundheitszustand meiner Familie
  bis zu unserem Lebensstandard. Mir steht das nicht zu. Als Mensch geh\u00f6rte nicht
  viel dazu, dem Mythos vom \u00bbMenschen als Macher\u00ab und dem Gef\u00fchl \u00fcbersteigerter
  Wichtigkeit zu erliegen. Keine Aufrichtigkeit, kein Nachdenken, keine Hingabe oder
  Kreativit\u00e4t bzw. \u00dcberzeugung meinerseits lie\u00df mich hier jedoch einen
  Ausweg finden. Ich hatte es nicht in der Hand. Gott dagegen schon.\\n\\nZweitens:
  Christus und sein Wort gen\u00fcgen. Der Psalmist hat verhei\u00dfen, dass vor Gottes
  Angesicht eine F\u00fclle von Freuden ist (vgl. Psalm 16,11). Sein Wort und dessen
  Verhei\u00dfungen sind vertrauensw\u00fcrdig. W\u00e4hrend unser Glaube gepr\u00fcft
  wurde, hat unser himmlischer Vater seine Treue unter Beweis gestellt. Seine Gnade
  erwies sich als ausreichend. In unserer Schwachheit wurden wir von seiner Liebe
  und seinem Frieden eingeh\u00fcllt. Die Gesinnung Christi hielt jede Wurzel der
  Bitterkeit oder des Selbstmitleids davon ab, unsere Gemeinschaft mit Gott oder untereinander
  zu untergraben. Jeglicher Friede, jegliche Kraft, die wir zeigten, war nur die Auswirkung
  von Gottes Gnade in unser beider Leben. Der gro\u00dfe Gott des Trostes hielt uns
  in seinen Armen.\\n\\nDrittens gab uns diese Tr\u00fcbsal Gelegenheit, die \u00fcberw\u00e4ltigende
  Liebe des Leibes Christi zu er\u00ad leben. Die Sichtweise und Anwesenheit von Pastor
  MacArthur und christlicher Freunde ber\u00fchrte uns tief. Man lie\u00df uns diese
  Liebe auf vielf\u00e4ltige Weise sp\u00fcren. Zu unserer gro\u00dfen Freude blieb
  das unseren nicht erretteten Freunden und unseren noch unbekehrten Verwandten nicht
  verborgen.\\n\\nViertens wurde das Evangelium durch Ryans Leben ausgebreitet. Gottes
  Liebe und sein Friede, \u00bbder allen Verstand \u00fcbersteigt\u00ab, waren real
  und wurden offenbar. Das gab uns Trost, weil Ryans Tod eine M\u00f6glichkeit bot,
  von Gottes Wahrheit und Liebe zu reden. Die Evangeliumsbotschaft wurde bei Ryans
  Beerdigungsgottesdienst und bei vielen Gespr\u00e4chen im kleinen Kreis deutlich
  verk\u00fcndigt.\\n\\nUnd schlie\u00dflich gewann der Himmel f\u00fcr uns einen
  viel gr\u00f6\u00dferen Wirklichkeitsbezug. Der Himmel ist f\u00fcr uns keine vage
  Vorstellung oder eine geheimnisvolle Bestimmung mehr. Wir sehnen uns nach jener
  Zeit der Gemeinschaft mit Christus und nach der Wiedervereinigung mit Ryan.\\n\\nUnd
  nun folgt, was Pamela \u00fcber dieselbe Erfahrung geschrieben hat \u2013 welch
  eine einf\u00fchlsame Botschaft eines trauernden Mutterherzens!\\n\\nAls unsere
  Tochter Megan Hannah zehn Monate alt war, erfuhren wir, dass ein zweites Kind unterwegs
  war. Wir freuten uns, dass unsere kleine Fa\u00ad milie zahlenm\u00e4\u00dfig zunehmen
  sollte. Vom Beginn der Schwangerschaft an erinnere ich mich, Danny gesagt zu haben,
  ich h\u00e4tte das \u00fcberw\u00e4ltigende Gef\u00fchl, der Herr werde unseren
  Glauben auf die Probe stellen. \u00bbIch denke, dass wir durch die gr\u00f6\u00dfte
  Tr\u00fcbsal unseres Lebens gehen werden.\u00ab Wie und in welchem Ma\u00df, war
  mir unbekannt. Der Herr bereitete uns aber schon in jenen ersten Wochen vor.\\n\\nVier
  Monate ging es gut, bis unsere Tr\u00fcbsal Gestalt anzunehmen begann. Meine erste
  UltraschallUnter\u00adsuchung zeigte einige Unregelm\u00e4\u00dfigkeiten, und mein
  Arzt \u00fcberwies mich zu genaueren Unter\u00ad suchungen an einen Ultraschall-Spezialisten
  in einem Genetik-Institut. Ich hatte gro\u00dfe Angst. Wir riefen die Verwandten
  und Freunde an und baten sie darum, mit uns zu beten. Die Unter\u00adsuchung kam,
  und das Ultraschallger\u00e4t zeigte, dass mehr als die H\u00e4lfte meiner Plazenta
  v\u00f6llig aufgeh\u00f6rt hatte zu arbeiten. Die Nabelschnur lieferte nicht so
  viel Nahrung, Blut und Sauerstoff, wie das Baby f\u00fcr ein normales Wachstum gebraucht
  h\u00e4tte. Unser Kindchen war schrecklich unterentwickelt.\\n\\nWir unterzogen
  uns im Genetik-Institut Beratungen mit einem Spezialisten, die furchtbar waren,
  aber als sehr hilfreich und informativ gelten sollten. Der Spezialist belehrte uns
  \u00fcber die \u00bbAussichten\u00ab und erkl\u00e4rte freundlich, dass unser Baby
  mit hoher Wahrscheinlichkeit alle nur denkbare Langzeit-Krankheit haben w\u00fcrde,
  die alle sehr aufwendige Pflegema\u00dfnahmen erforderten: Spina bifida (sogenannter
  \u00bboffener R\u00fccken\u00ab), Mukoviszidose und einiges mehr. Unser Baby w\u00fcrde
  wahrscheinlich vor oder bei der Geburt bzw. kurz danach sterben. Laut Statistik
  war das Risiko unglaublich hoch.\\n\\nMein Arzt verordnete mir Bettruhe zu Hause,
  ich durfte nur morgens duschen und die Toilette nach Bedarf aufsuchen. Das Haus
  verlie\u00df ich nur, um zu den Sprechstunden beim Arzt zu gehen. Ich musste mich
  auf einen ausgekl\u00fcgelten Zeitplan meiner Freunde verlassen, die sich abwechselten,
  um f\u00fcr die praktischen Angelegenheiten zu sorgen, die mit meinem Kind und dem
  Haushalt zu tun hatten.\\n\\nJeder Besuch bei dem Spezialisten war allerdings eine
  Antwort auf Gebete und eine weitere Chance, sich an Gott im Gebet zu klammern. Unser
  kleines Baby war ein Junge, wie wir erfuhren. Er hatte mal ein Loch im Herzen, dann
  wieder keins, mal wurde Wasser im Gehirnbereich festgestellt, dann wieder nicht,
  mal wuchs er \u00fcberhaupt nicht, und\\n\\ndann wuchs er wieder, mal wollte sein
  Blut nicht flie\u00dfen bzw. waren Sauerstoff- und Nahrungszufuhr gest\u00f6rt,
  danach funktionierte das alles wieder, einmal war der Spiegel des Fruchtwassers
  unnormal niedrig, dann wieder war es in ausreichender Menge vorhanden. Das war nur
  eine kleine Auswahl an Beispielen schwerwiegender Ver\u00e4nderungen, die jedes
  Mal kamen oder gingen, wenn wir zu dem Spezialisten fuhren. Der Spezialist war jedes
  Mal h\u00f6chst verwundert, warum diese Krankheitsbilder wieder verschwanden. Wir
  wussten es, und wir nahmen die Gelegenheit wahr, ihm den entsprechenden Grund zu
  erkl\u00e4ren! Unser Gott war gr\u00f6\u00dfer als all die lebensbedrohlichen k\u00f6rperlichen
  Komplikationen, von denen wir jedes Mal h\u00f6rten, wenn wir beim Arzt waren. Wir
  brachten jedes kleine Detail inbr\u00fcnstig vor den Herrn, und wenn wir zur n\u00e4chsten
  Sprechstunde gingen, hatte der Herr bereits sein Werk getan. Wir waren uns im Kla\u00adren,
  dass es ein Zeugnis f\u00fcr Gott war und wir selbst nichts dazu beigetragen hatten.
  Es war auch kein \u00bbGl\u00fccksfall\u00ab, es war Gott, der in jede Kleinigkeit
  der Entwicklung unseres Sohnes einbezogen war.\\n\\nLangsam begriffen wir, welche
  M\u00f6glichkeiten Gott uns nach und nach er\u00f6ffnete, um mit allen von Christus
  zu reden, mit denen wir in Kontakt kamen, und um ein gutes Zeugnis f\u00fcr Gottes
  Wirken in unserem Leben zu sein. Unser Gebets\u00adleben\\n\\nwar nie st\u00e4rker
  als damals: Wir beide beteten f\u00fcr unseren kleinen Sohn und f\u00fcr das, was
  Gottes Wille f\u00fcr ihn und f\u00fcr uns war.\\n\\nZun\u00e4chst lag ich zu Hause
  im Bett, dann kam ich ins Krankenhaus. Ich wurde an alles M\u00f6g\u00adliche an\u00ad
  geschlossen, und alle Viertelstunde schaute rund um die Uhr jemand bei mir herein.
  Dabei stopfte man t\u00e4glich bis zu f\u00fcnftausend Kalorien in mich hinein.
  Ich erhielt regelm\u00e4\u00dfig Steroidspritzen, damit auch die Lungen unseres
  Sohnes unterst\u00fctzt w\u00fcrden. Ich war f\u00fcr meine Familie nichts n\u00fctze
  \u2013 mir fehlte es, meine Aufgaben als Hausfrau und Mutter aus\u00fcben zu k\u00f6nnen.\\n\\nNach
  gut drei Wochen im Krankenhaus entschieden die \u00c4rzte, es sei f\u00fcr Ryan
  ein gr\u00f6\u00dferes Risiko, im Mutterleib zu bleiben, als entbunden zu werden.
  So wurde es Zeit f\u00fcr einen Kaiserschnitt. Nun war es so weit! Alle hatten gebetet,
  und es blieb nichts, als abzuwarten, was Gott mit uns vorhatte. Eigentlich sollte
  Ryan James am 15. April zur Welt kommen, und jetzt war es der 11. M\u00e4rz 1996.
  Er war ein winziges Kerlchen, wog nur etwas \u00fcber 1 Kilogramm und ma\u00df 38
  Zentimeter. Er bestand seine Apgar-Tests (Tests f\u00fcr Neugeborene) ziemlich gut,
  und man betrachtete ihn trotz allem als ein \u00bbhoffnungsvolles Baby\u00ab. Auch
  auf der Intensivpflegestation f\u00fcr Neugeborene hielt er sich wacker, w\u00e4hrend
  ich mich von der Operation erholte. Wir f\u00fchlten uns emotional, geistig und
  geistlich erleichtert. Der Herr hatte uns durch alle H\u00f6hen und Tiefen hindurchgeholfen,
  und nun hatten wir den kleinen Ryan James, und er w\u00fcrde in einem Monat zu Hause
  sein. Wir waren unserem Jesus unglaublich dankbar, dass dieser kleine Junge geboren
  wurde. Ryan war winzig, aber gesund. Er war unser Wunderbaby. So viele erh\u00f6rte
  Gebete, so viel geistliches Wachstum und so viel Vertrauen zum Herrn \u2013 es war
  wirklich zum Staunen! Wir f\u00fchlten uns gesegnet. Unser Leiden schien endg\u00fcltig
  vor\u00fcber zu sein.\\n\\nIch wurde aus dem Krankenhaus entlassen, w\u00e4hrend
  Ryan noch auf der Intensivstation blieb. Am 17. M\u00e4rz rief die diensthabende
  \u00c4rztin an und bat uns, ins Krankenhaus zu kommen. Sie sagte, wir m\u00fcssten
  sofort erscheinen. Was konnte schiefgegangen sein? Sie sagte uns, Ryan habe eine
  NEC (eine nekrotisierende Dickdarmentz\u00fcndung mit Durchbruch). Unser niedliches
  S\u00f6hnchen war sehr krank. Wir waren entsetzt. Gerade erst meinten wir, unser
  Kummer sei vor\u00fcber, und jetzt sagte man uns, eine derma\u00dfen ernste Operation
  sei un\u00ad bedingt n\u00f6tig, dass man sie nicht einmal in dieser Klinik ausf\u00fchren
  k\u00f6nnte! Einige Male mussten sie ihm etwas zur St\u00e4rkung geben, damit er
  \u00fcberhaupt zur Kinderklinik gebracht werden konnte. Sie erkl\u00e4rten uns,
  man m\u00fcsste den gr\u00f6\u00dften Teil seines Dickdarms wegnehmen und ein St\u00fcck
  seines\\n\\nD\u00fcnndarms dazu. Die bakterielle Infektion neige zu Wundbrand und
  greife schnell um sich.\\n\\nSie f\u00fchrten die Operation an Ryan aus; aber das
  war zu viel f\u00fcr seinen kleinen, gut ein Kilogramm schweren K\u00f6rper, und
  er starb an Herzstillstand und Lungenblutungen. Ryan starb am 18. M\u00e4rz 1996
  in den Armen seines Vaters. Er war eine Woche alt.\\n\\nIch erinnere mich, dass
  jemand sagte, es sei gut, dass er von uns gegangen sei, bevor ich mich an ihn gew\u00f6hnt
  h\u00e4tte. Das war unvorstellbar \u2013 ja, geradezu l\u00e4cherlich \u2013 f\u00fcr
  mich. Mein gesamtes Leben hatte sich in den letzten vier Monaten um Ryan gedreht.
  Ich hatte jede seiner kleinen Be\u00ad wegungen in meinem K\u00f6rper gesp\u00fcrt.
  Sein Leben begann l\u00e4ngst, bevor er auf diese Welt kam. Er war nicht erst seit
  gut einer Woche bei mir, sondern schon seit Monaten.\\n\\nW\u00e4hrend all dieser
  Monate hatte ich das Gef\u00fchl, unser Glaube w\u00fcrde aufs \u00c4u\u00dferste
  gepr\u00fcft. Manchmal wusste ich nicht, wohin ich mich wenden sollte. Nachdem er
  gestorben war, f\u00fcrchtete ich, verr\u00fcckt zu werden. Was hielt mich davon
  ab, durchzudrehen?\\n\\nGottes Wort erwies sich immer wieder als Helfer. Seine Gnade
  war und ist ausreichend f\u00fcr alles. Gott stand und steht zu seinen Verhei\u00dfungen.
  Diese drei Verse bedeuteten einen besonderen Trost f\u00fcr uns:\\n\\n* Meine Gnade
  gen\u00fcgt dir, denn meine Kraft wird in Schwachheit vollbracht (2. Korinther 12,9).\\n*
  Nahe ist der HERR denen, die zerbrochenen Herzens sind (Psalm 34,19).\\n* Alle Z\u00fcchtigung
  aber scheint f\u00fcr die Gegenwart nicht ein Gegenstand der Freude, sondern der
  Traurigkeit zu sein; danach aber gibt sie die friedsame Frucht der Gerechtigkeit
  denen, die durch sie ge\u00fcbt worden sind (Hebr\u00e4er 12,11).\\n\\nDamals \u2013
  und sogar jetzt noch \u2013 war mein Herz zerbrochen und mein Kummer gro\u00df.
  Aber ge\u00ad nauso wusste ich tief in meinem Innern, dass Jesus uns liebte und
  dass er wusste, warum er all das zulie\u00df. Immer wieder erinnerte ich mich an
  das Wort: \u00bbNicht, dass ich es schon ergriffen habe oder schon vollendet sei;
  ich jage ihm aber nach, ob ich es auch ergreifen m\u00f6ge, indem ich auch von Christus
  Jesus ergriffen bin\u00ab (Phil 3,12). Ich glaube, dass Gott sein reinigendes Werk
  an uns getan hat. Er er\u00ad h\u00f6hte unsere F\u00e4higkeit, anderen Familien
  zu die\u00ad nen. Er wusste, was wir tragen konnten. Und ich verlie\u00df mich auf
  sein Wort: \u00bbWir wissen aber, dass denen, die Gott lieben, alle Dinge zum Guten
  mitwirken, denen, die nach Vorsatz berufen sind\u00ab (R\u00f6mer 8,28).\\n\\nDie
  erstaunlichste Offenbarung war, dass Gottes Wort Wirklichkeit ist. Die Bibeltexte
  waren nicht mehr nur Worte \u2013 sie wurden lebendig! Wir nahmen sie an und vertrauten
  ihnen. Wir erkannten Gottes Wort als \u00bblebendig und wirksam\u00ab (Hebr\u00e4er
  4,12). Wir lebten von ihm. Gottes Gnade reichte v\u00f6llig aus. Er hat uns hindurchgetragen.
  Er hat uns getr\u00f6stet. Er hat f\u00fcr uns gesorgt. Er hat sich um uns gek\u00fcmmert.
  Er hat uns sp\u00fcrbar geliebt. Er war gut zu uns. Er wusste genau, was wir schaffen
  konnten, und er gab uns nie mehr und nie weniger als das.\\n\\nVon irdischer Seite
  betrachtet ist der Verlust eines Kindes vielleicht das Schlimmste, was einer Familie
  zusto\u00dfen kann. Wenn man aber dadurch den Herrn kennenlernt, so bringt es Segen
  und Zielgerichtetheit.\\n\\nIch kann dieses Geschehen aus mehreren Gr\u00fcnden
  als Segen bezeichnen:\\n\\nWir wissen sicher und ohne jeden Zweifel, dass Ryan bei
  Jesus ist und dass wir f\u00fcr alle Ewigkeit wieder vereint sein werden. Unser
  Leben hier ist nur ein Punkt auf einem Zeitstrahl, der niemals endet. Die Zeit hier
  ohne ihn ist nichts im Vergleich zu der Ewigkeit, die wir beieinander sein werden.
  Wir m\u00fcssen Gott wegen unserer drei T\u00f6chter, die er uns anvertraut hat,
  immer noch auf den Knien danken. Megan hat sich ernsthaft\\n\\nentschieden, Christus
  nachzufolgen. Sie hat eine klare S\u00fcndenerkenntnis, kennt Gottes Vergebung und
  wei\u00df, was sie jetzt als Gl\u00e4ubige zu tun hat. Von den beiden j\u00fcngeren
  T\u00f6chtern wissen wir das nicht so genau. Ihr Leben liegt noch vor ihnen, und
  es ist unser tiefster Wunsch, dass auch sie alle einmal Jesus kennen und lieben
  lernen.\\n\\nDiese Erfahrung war ein Segen f\u00fcr uns, weil unsere himmlische
  Hoffnung und unsere himm\u00ad lische Gesinnung erneuert wurde. Der Himmel ist uns
  viel wertvoller geworden, seit Ryan dort ist. Mein Wunsch, in den Himmel zu kommen,
  ist viel intensiver geworden. Der Himmel ist in meinem Denken gleich hinter der
  n\u00e4chsten Ecke. Ich kann gar nicht abwarten, dorthin zu kommen.\\n\\nDies war
  ein Segen, weil uns so viele Freunde auf mancherlei Weise sp\u00fcrbar gedient haben.
  Ihre Hilfe war ein Zeugnis dessen, wie Gott uns liebt, f\u00fcr uns sorgt und sich
  um uns k\u00fcmmert. Den Leib Christi in Aktion zu erleben, ist tats\u00e4chlich
  etwas Erstaunliches. Ihre Freundlichkeit hat uns \u00fcberw\u00e4ltigt. Die Freunde
  sorgten in so mancher praktischen Weise f\u00fcr uns \u2013 vom Essenkochen bis
  zum Babysitten \u2013 und genauso in geistlicher Hinsicht, indem sie f\u00fcr uns
  beteten und uns beistanden. Und das alles taten sie \u00fcber einen langen Zeitraum.
  Das alles war keine kleine Liebestat.\\n\\nWenn wir h\u00f6ren, jemand habe sein
  Baby ver\u00ad\\n\\nloren, kennen wir deren Schmerz, und es ist nicht leicht, weil
  wir dann wieder von unserem eigenen Schmerz eingeholt werden. Doch wir haben die
  M\u00f6glichkeiten, anderen Familien zu helfen, mit dem Verlust eines Babys fertig
  zu werden. Oft sprechen wir nicht einmal mit ihnen. Allein durch die Tatsache, dass
  sie uns als Eheleute beisammen und unsere Liebe zueinander sehen, geben wir Zeugnis
  davon, dass Gott uns durch diese Erfahrung hindurchgetragen hat. Und das, was er
  an uns tat, kann und wird er auch an ihnen tun, wenn sie ihm nur vertrauen wollen.\\n\\nZehn
  Monate nachdem Ryan von uns gegangen war, hatte ich eine Fehlgeburt. Einen Monat
  danach erfuhren wir, dass wir ein Baby erwarten durften \u2013 unsere liebe Lauren
  Marie. Ich hatte noch zwei weitere Fehlgeburten, bevor der Herr uns Taryn Reece
  schenkte. Jede Schwangerschaft hatte ihre eigenen Tr\u00fcbsale, doch nach allem
  kann ich sagen: \u00bbChristus sei die Herrlichkeit \u2026 Amen!\u00ab Unser Vertrauen
  auf den Herrn und unsere Beziehung zu ihm sind dadurch stark gewachsen.\\n\\nDan
  und Pamela haben sieben Kinder \u2013 davon drei auf dieser Erde, ihre pr\u00e4chtigen
  T\u00f6chter. Sie wissen, dass sie einen Sohn, Ryan James, im Himmel haben. Aber
  sie haben noch drei weitere Kinder im Himmel \u2013 die lieben Kleinen, die sie
  empfingen, die aber die Schwangerschaft nicht \u00fcberlebten. Welch eine\\n\\nfreude\u00advolle
  Wie\u00addervereinigung steht dieser Familie noch bevor!\\n\\nJetzt m\u00f6chte
  ich Sie noch auf einige Punkte aus den Briefen dieser lieben Eheleute hinweisen.\\n\\nN\u00e4he.
  Erstens waren die christlichen Freunde \u00bbimmer in der N\u00e4he\u00ab, wenn
  Dan und Pamela sie brauchten. Sie waren in ihrem Leben ganz praktisch einfach da,
  indem sie ihnen beim Babysitten, beim Kochen oder bei der Hauswirtschaft halfen.\\n\\nGottes
  Wort. Zweitens waren die in Gottes Wort offenbarten Wahrheiten eine vitale Kraftquelle
  f\u00fcr die beiden Eltern; denn sie sind f\u00fcr alle, die sich in Notzeiten ihnen
  zuwenden, eine solche Quelle der Kraft.\\n\\nHaben Sie Mut, Trauernden Worte aus
  der Bibel weiterzugeben. Sie brauchen keine Predigten zu halten. Aber Sie k\u00f6nnen
  zu einer betr\u00fcbten Mutter sagen: \u00bbIch habe diesen Vers aus Gottes Wort
  als besonders ermutigend empfunden. Und ich dachte, er w\u00fcrde auch Ihnen helfen
  k\u00f6nnen.\u00ab Und dann lesen Sie den Vers vor, mit dessen Hilfe Gottes immerw\u00e4hrende
  Gegenwart f\u00fcr Ermutigung sorgt.\\n\\nHoffnung auf den Himmel. Drittens war
  und ist die Hoffnung auf den Himmel bei Dan und Pamela sehr real. Welch eine wunderbare
  Sache ist es doch, wenn Christen gemeinsam \u00fcber den Himmel sprechen k\u00f6nnen!
  Vieles von dem Stachel des Todes verschwindet, wenn wir uns \u00fcber die Liebe
  Jesu Christi\\n\\nund die Herrlichkeiten des Himmels unterhalten k\u00f6nnen. Helfen
  Sie trauernden Eltern sanft und mitf\u00fchlend, ihren Blick von ihrem Verlust wieder
  wegzuwenden, indem Sie von dem reden, was Sie \u00fcber das Gl\u00fcck ihres Kindes
  im Himmel wissen.\\n\\nGebet. Beten Sie viertens mutig f\u00fcr Ihre leidtragenden
  Freunde und auch mit ihnen! Bringen Sie ihren Kummer dem Herrn. Bitten Sie ihn,
  ihre Herzen zu heilen, ihre Glaubenskraft zu erneuern und sie mit der Liebe und
  dem Trost des Heiligen Geistes zu erf\u00fcllen.\\n\\nErmutigung. Und schlie\u00dflich:
  Ermutigen Sie Ihre trauernden Freunde oder Ihre Lieben daheim, dass sie Schritte
  unternehmen, sich um andere zu k\u00fcmmern, die in Not sind. Danken Sie ihnen,
  dass sie Ihnen mitteilten, was ihnen der Herr durch ihre Erfahrung hat zeigen k\u00f6nnen.
  Seien Sie ein guter Zuh\u00f6rer, wenn sie Ihnen davon berichten. Erlauben Sie ihnen,
  ihre Geschichte so ausf\u00fchrlich zu berichten, wie sie es f\u00fcr n\u00f6tig
  halten. Da wird vielleicht vieles angesprochen, was Sie in nicht allzu ferner Zukunft
  als evangelistische oder auferbauende Botschaft f\u00fcr andere gebrauchen k\u00f6nnen,
  die sich ihrerseits in tiefem Elend befinden. Machen Sie ihnen Mut bei ihren Bem\u00fchungen,
  mit anderen in Kontakt zu kommen, die in Not sind oder durch schwere Krisen gehen.
  Gerade indem sie andere aufsuchen, wird ihnen in starkem Ma\u00df Heilung zuteil,
  und sie werden eine erneuerte Lebensperspektive erhalten.\\n\\nSeien Sie nicht zu
  z\u00f6gerlich, sich mit einem Menschen zu befassen, der ein Kind verloren hat,
  auch dann nicht, wenn Ihnen selbst so etwas nicht passiert ist.\\n\\nEin h\u00f6rendes
  Ohr, ein liebendes Herz und warme Anteilnahme sowie Tr\u00f6stung sind in Zeiten
  eines solchen Verlusts immer willkommen. Auch wenn Sie nur sagen: \u00bbSie tun
  mir leid, ich habe Sie lieb\u00ab, haben Sie schon eine Menge Gutes gesagt.\\n\\nGott
  beruft uns, andere Menschen in seine Gegenwart zu bringen, und da gibt es keine
  bessere Ge\u00ad legenheit zu einem solchen Dienst, als wenn Eltern \u00fcber ein
  verstorbenes Kind trauern. Haben Sie selbst eins verloren, dann erlauben Sie anderen,
  Ihnen diesen Dienst zu erweisen. Wenn Sie jemanden kennen, der ein Kind verloren
  hat, dann sollten Sie sich in der Liebe des Herrn um den Betreffenden bem\u00fchen.
  Vertrauen Sie auf den Herrn, dass er Ihnen zeigt, was Sie reden, tun und beten sollen.\\n\\nIch
  m\u00f6chte mit Ihnen beten!\\n\\nWenn Sie heute zu solchen trauernden Eltern ge\u00ad
  h\u00f6ren, lade ich Sie ein, dieses Gebet mit mir zu sprechen:\\n\\nVater, ich
  danke dir f\u00fcr dein Wort \u2013 dessen L\u00e4nge, Breite, H\u00f6he und Tiefe
  alle Bereiche des Lebens einschlie\u00dft. Ich danke dir, Vater, f\u00fcr die Zuversicht,
  die du uns in deinem Wort f\u00fcr unsere verstorbenen kleinen Kinder gegeben hast.\\n\\nIch
  danke dir, Herr, f\u00fcr das kleine Leben, das nie das Morgenrot seines Geburtstags
  gesehen hat. Ich danke dir f\u00fcr solche, die Stunden, Tage, Monate, sogar Jahre
  erlebten und dann in den Himmel geholt wurden. Ich danke dir f\u00fcr alle diese
  Kinder, die durch diese Welt gegangen sind, ohne je die Befleckung durch Tats\u00fcnden,
  die Last der S\u00fcnde, den Unglauben oder b\u00f6se Handlungen kennen\u00ad gelernt
  zu haben.\\n\\nIch danke dir f\u00fcr das Mitleid mit S\u00fcndern. Danke, dass
  du dieses kleine Kind gerettet hast, das nicht die F\u00e4higkeit hatte, wegen seiner
  s\u00fcndigen Natur Bu\u00dfe zu tun, und das auch nicht an Christus Jesus glauben
  konnte. Danke, dass du dieses kleine Kind in deiner gro\u00dfen Barmherzigkeit angenommen
  hast.\\n\\nF\u00fcr deine gro\u00dfe Gnade und Rettungstat an diesem\\n\\nkleinen
  Kind bringen wir dir von Herzen unseren Dank und Lobpreis.\\n\\nHeile die Herzen
  dieser Eltern, Herr, die so tief betr\u00fcbt \u00fcber den Verlust ihres kleinen
  Kindes sind. Verwandle ihren Kummer in Freude, indem sie die Wahrheit annehmen k\u00f6nnen,
  dass ihr Kleines sicher in deinen Armen ist \u2013 jetzt und in Ewigkeit. Lass sie
  wieder neu deinen gro\u00dfen Plan und dein Ziel f\u00fcr jedes Leben begreifen,
  dessen Empf\u00e4ngnis du zugelassen hast. Erneuere in ihnen die himm\u00ad lische
  Hoffnung und gib ihnen ein erneuertes Vertrauen auf dein Wort und darauf, dass du
  jederzeit und in allen Situationen bei uns und ihnen bist \u2013 auch jetzt in ihrer
  Trauer.\\n\\nWir erbitten von dir, Vater, du m\u00f6gest diesen Eltern helfen, die
  anderen Kinder, die sie vielleicht jetzt haben oder noch bekommen werden, in der
  Zucht und Ermahnung des Herrn zu erziehen. Gib diesen Eltern Kraft und Weisheit,
  auch andere Kinder zu erreichen, \u00fcber ihre Familie hinaus, damit auch sie wirklich
  verstehen, was es mit Gesetz und Gnade, mit S\u00fcnde und Errettung auf sich hat.
  M\u00f6gen auch sie kommen und deinen Sohn, Jesus Christus, als ihren Retter annehmen
  und ihm dann als ihrem Herrn folgen.\\n\\nIn Christi Namen bitten wir. Amen.\\n\\nAnmerkungen\\n\\nKapitel
  2: Was k\u00f6nnen wir denen mit Gewissheit sagen, deren Arme leer sind?\\n\\n1.
