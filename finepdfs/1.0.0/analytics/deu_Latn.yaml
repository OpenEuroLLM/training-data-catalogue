sample: '["\"Aufnahmeantrag\\n\\nFallschirmsportclub Mannheim e.V.\\n\\nIch beantrage
  die Mitgliedschaft im Fallschirmsportclub Mannheim e.V. als aktives Mitglied.\\n\\nDie
  Aufnahmegeb\u00fchr betr\u00e4gt 125 \u20ac. Der Mitgliedsbeitrag f\u00fcr das Jahr
  betr\u00e4gt 155 \u20ac f\u00fcr Sch\u00fcler und Aktive Mitglieder, die restlichen
  Jahresbeitr\u00e4ge richten sich nach der derzeit g\u00fcltigen Geb\u00fchrenordnung
  des FSC-Mannheim. Der DFV-Beitrag ist in den Jahresbeitr\u00e4gen f\u00fcr Sch\u00fcler
  und Aktive Mitglieder enthalten und wird vom Verein direkt an den DFV abgef\u00fchrt.\\n\\nErfolgt
  die Aufnahme in den Verein ausschlie\u00dflich zum Zwecke der Ausbildung (z.B. f\u00fcr
  einen Schnupperkurs), so ist die Mitgliedschaft auf die Dauer der automatischen
  bzw. AFF-Ausbildung beschr\u00e4nkt und endet mit Beendigung oder Abschluss der
  automatischen / AFF-Ausbildung (10/7/1 Spr\u00fcnge und theoretische Ausbildung).\\n\\nWird
  eine Fallschirmsprungausbildung mit dem Verein vereinbart, so ist die Aufnahmegeb\u00fchr
  und der Mitgliedsbeitrag im Jahr des Ausbildungsbeginns in der Ausbildungsgeb\u00fchr
  enthalten. Es gilt der aktuelle Ausbildungsvertrag des FSC-Mannheim (beigef\u00fcgt
  und/oder jederzeit einsehbar). Bei Abbruch oder Nichtbeendigung der Ausbildung besteht
  kein Anspruch auf R\u00fcckverg\u00fctung der Beitr\u00e4ge, der Aufnahmegeb\u00fchr
  oder der nicht ausgef\u00fchrten Spr\u00fcnge.\\n\\nGrunds\u00e4tzlich werden Mitgliedsbeitr\u00e4ge
  bzw. die Aufnahmegeb\u00fchr durch Lastschrift eingezogen. Mit meiner Unterschrift
  erkl\u00e4re ich die Bereitschaft zur Teilnahme am Bankeinzugsverfahren.\\n\\nIch
  versichere die Richtigkeit meiner Angaben und bin mir bewusst, dass falsche Angaben
  zum Ausschluss aus dem Verein f\u00fchren k\u00f6nnen.\\n\\n, den\\n\\nOrt, Flugplatz\\n\\nDatum\\n\\nUnterschrift
  des Antragstellers bei Minderj\u00e4hrigen des ges. Vertreters\\n\\n, den\\n\\nOrt,
  Flugplatz\\n\\nDatum\\n\\nUnterschrift Vorstand FSC-Mannheim e.V.\"", "\"Energieheld
  ver\u00f6ffentlicht hero, die Handwerker-App\\n\\nMobiles Projekt- und Kundenmanagement
  jetzt \u00fcber den App Store und Google Play verf\u00fcgbar\\n\\n(Hannover, 01.07.2016)
  hero, die Handwerker-App erh\u00f6ht den Service f\u00fcr Handwerker durch mobiles
  Projekt- und Kundenmanagement. Die Energieheld GmbH erweitert die bestehende Cloud-Software-L\u00f6sung
  hero mit der hero-App. So st\u00e4rkt energieheld seine kooperierenden Handwerksbetriebe
  bei der Umsetzung von effizienten, digitalen Prozessen \u2013 auch unterwegs und
  beim Kunden vor Ort.\\n\\nDen\\n\\nNutzern der\\n\\nCloud-Software hero\\n\\n(Kundenbeziehungs-
  und\\n\\nProjektmanagement) ist es ab sofort m\u00f6glich, hero kostenlos mobil
  zu verwenden. So k\u00f6nnen hero-Nutzer von unterwegs auf Projekt-, Kundendaten\\n\\nund
  Bilder sowie Dokumente zugreifen. Die Schnittstelle zur Cloud-Software macht es
  m\u00f6glich. Energieheld baut damit seinen digitalen Service f\u00fcr\\n\\nHandwerker
  weiter aus \u2013 besonders wichtig dabei ist die Abbildung einzelner\\n\\nProzessschritte
  eines Projektes und die Verf\u00fcgbarkeit von Projektinformationen f\u00fcr alle
  Mitarbeiter im Handwerksbetrieb \u2013 vom Gesch\u00e4ftsf\u00fchrer \u00fcber den\\n\\nVertrieb,
  Buchhaltung bis zu den Monteuren. Die Dokumentation kann bequem durch das Hochladen
  und Versenden von Bildern erfolgen.\\n\\nDokumentation wird ein Kinderspiel\\n\\nHandwerker,
  die die hero-App nutzen, k\u00f6nnen mit einem Klick Kunden aus der\\n\\nApp heraus
  anrufen, die Navigation zum  Kunden starten, relevante Dokumente sind von unterwegs
  einsehbar und Bilder z. B. von der Baustelle werden\\n\\nautomatisch in die Cloud-L\u00f6sung
  hochgeladen und dem jeweiligen Projekt zugeordnet. So wird die Dokumentation eines
  Projektes, die notwendig ist, um\\n\\nggfs. gesetzliche Anforderungen zu erf\u00fcllen
  und die im Rahmen von staatlichen\\n\\nF\u00f6rderungen empfohlen wird, ein Kinderspiel.
  Die Bedienung ist dabei intuitiv und einfach. Damit wird der berufliche Alltag optimiert
  und die Kommunikation\\n\\nmit Kunden verbessert. Die Daten gehen nie verloren,
  da Energieheld sich um\\n\\nDatenhaltung und das BackUp der Daten k\u00fcmmert.\\n\\nAuf
  das Wesentliche konzentrieren k\u00f6nnen\\n\\nDie detaillierte Aufschl\u00fcsselung
