  US-A- 4 280 127\\n\\n\u2022 HENRY JC ED - INSTITUTE OF ELECTRICAL AND ELECTRONICS
  ENGINEERS: \\\"The Lincoln Laboratory 35 GHz airborne SAR imaging radar system\\\"
  PROCEEDINGS OF THE NATIONAL TELESYSTEMS CONFERENCE. ATLANTA, MARCH 26 19910326;
