  0196-2892\\n\\n\u2022 STUHR F ET AL: \\\"SIR-C/X-SAR: An Advanced Radar\\\" AEROSPACE
  APPLICATIONS CONFERENCE, 1996. PROCEEDINGS., 1996 IEEE ASPEN, CO, USA 3-10 FEB.
  1996, NEW YORK, NY, USA,IEEE, US, Bd. 2, 3. Februar 1996 (1996-02-03), Seiten 5-16,
  XP010159025 ISBN: 978-0-7803-3196-9\\n\\nAnmerkung: Innerhalb von neun Monaten nach
  Bekanntmachung des Hinweises auf die Erteilung des europ\u00e4ischen Patents im
  Europ\u00e4ischen Patentblatt kann jedermann nach Ma\u00dfgabe der Ausf\u00fchrungsordnung
  beim Europ\u00e4ischen Patentamt gegen dieses Patent Einspruch einlegen. Der Einspruch
  gilt erst als eingelegt, wenn die Einspruchsgeb\u00fchr entrichtet worden ist. (Art.
  99(1) Europ\u00e4isches Patent\u00fcbereinkommen).\\n\\nBeschreibung\\n\\n[0001]
  Die Erfindung betrifft ein Verfahren zum Optimieren des Betriebs eines aktiven Seitensichtsensors
  bei ver\u00e4nderlicher H\u00f6he \u00fcber der zu erfassenden Oberfl\u00e4che gem\u00e4\u00df
  Anspruch 1.\\n\\n[0002] Aktive Seitensichtsensoren bzw. Seitensichtinstrumente arbeiten
  auf dem Prinzip der Laufzeitmessung mittels RADAR (Radiowave Detection And Ranging)
  oder LIDAR (Lightwave Range And Detection) und werden beispielsweise zur Vermessung
  und Abbildung der Erdoberfl\u00e4che mittels Satelliten eingesetzt. Ein Beispiel
  f\u00fcr einen aktiven Seitensichtsensor ist das Synthetische-Apertur-Radar (SAR)-System,
  das auch als Seitensichtradar bezeichnet wird. SAR-Systeme werden so betrieben,
  dass abwechselnd Impulssignale \u00fcber eine kurze bewegte Antenne in Richtung
  zur zu erfassenden Oberfl\u00e4che in einem definierten Zeitabstand abgestrahlt
  und die Echosignale, also die an abgetasteten Objekten reflektierten Impulssignale
  empfangen werden. F\u00fcr jeden von der Antenne ausgeleuchteten und abgetasteten
  Bereich wird von einem SAR-Prozessor durch entsprechende Datenverarbeitung der Echosignale
  eine Abbildung des abgetasteten Objekts berechnet.\\n\\n[0003] Seitensichtsensoren
  wie beispielsweise SAR-Systeme beleuchten mit ihren abgestrahlten Impulssignalen
  einen und empfangen Echosignale aus einem Bereich bzw. Streifen (swath) einer zu
  erfassenden bzw. vermessenden Oberfl\u00e4che (oder eines Atmosph\u00e4renvolumens)
  querab zur Flugrichtung. \u00dcber die gesamte Umlaufbahn eines Sensors bleibt die
  Blickrichtung des Sensors, d.h. die die Richtung der ausgesandten Impulssignale
  (Abtaststrahlen) \u00fcblicherweise gleich - beispielsweise im Sinne einer Orientierung
  relativ zur Flug- und Nadirrichtung. Auch wenn verschiedene Streifen definiert werden
  k\u00f6nnen (Blickwinkelbereiche), die wahlfrei ausgew\u00e4hlt werden k\u00f6nnen
  (z.B. mit Hilfe einer phasengesteuerten RADAR-Antenne), so bleibt die Orientierung
  eines jeden Streifens f\u00fcr sich \u00fcber den gesamten Umlauf (Orbit) des Sensors
  um den zu vermessenden Himmelsk\u00f6rper gleich. Allerdings variiert der Abstand
  zwischen einem Seitensichtsensor und der zu erfassenden Oberfl\u00e4che auf elliptischen
  Bahnen und um nicht kugelsymmetrische Himmelsk\u00f6rper, wie in Fig. 1 erkennbar
  ist.\\n\\n[0004] Das Verhalten w\u00e4hrend einer Aufnahme bzw. Abtastung h\u00e4ngt
  daher erheblich von der H\u00f6he \u00fcber der Messoberfl\u00e4che und vom zu erfassenden
  Bereich ab. Wird beispielsweise ein aktiver Seitensichtsensor so betrieben, dass
  abwechselnd Impulssignale abgestrahlt werden und nur w\u00e4hrend der Sendepausen
  die Echosignale empfangen werden k\u00f6nnen, so muss die Pulswechselholfrequenz
  (PRF: Pulse Repetition Frequency), d.h. die Frequenz der Abstrahlung von Impulssignalen
  w\u00e4hrend eines Orbits st\u00e4ndig angepasst werden. Dies erh\u00f6ht allerdings
  die Komplexit\u00e4t der Steuerung der Abtastung betr\u00e4chtlich. In einem zu
  erfassenden Zugriffsbereich mit beispielsweise einem Einfallswinkel von 20\u00b0
  bis 55\u00b0 der von einem Seitensichtsensor ausgesandten Abtaststrahlen auf der
  zu vermessenden Oberfl\u00e4che wird in eine Anzahl von \u00fcberlappenden individuell
  w\u00e4hlbaren Streifen gelegt, deren Lage im Sinne des Einfallswinkels oder Blickwinkels
  \u00fcber den gesamten Orbit \u00e4hnlich bleibt. Die aufgrund der Signallaufzeit
  m\u00f6glichen Werte f\u00fcr die PRF variieren \u00fcber den Orbit. Eine feste
  PRF f\u00fcr jeden Streifen (swath) ist oft nicht m\u00f6glich.\\n\\n[0005] Die
  Ver\u00f6ffentlichung \\\"The Lincoln Laboratory 35 GHz airborne SAR imaging radar
  system\\\", HENRY J CED - INSTITUTE OF ELECTRICAL AND ELECTRONICS ENGINEERS PROCEEDINGS
  OF THE NATIONAL TELESYSTEMS CONFERENCE. ATLANTA, MARCH 26 19910326 - 19910327 NEW
  YORK, IEEE. US, Bd., -, 26. M\u00e4rz 1991 (1991-03-26), Seiten 353-358, XP010047053
  ISBN: 978-0-7803-0062-0, beschreibt ein Flugzeug-gest\u00fctztes SAR-System. Im
  Kapitel 2.4 (und den Unterkapiteln) dieser Ver\u00f6ffentlichung wird das System
  zur Flugzeuglokalisierung beschrieben. Mit mehreren Instrumenten werden die Lage
  und Geschwindigkeit des Flugzeugs gemessen und die Geschwindigkeitsinformation wird
  f\u00fcr die Antennenbewegungskompensation verwendet. Eine H\u00f6henermittlung
  mit einem barometrischen Altimeter wird benutzt, um vertikale Positionierungsfehler
  in einem BewegungssensierungsfILTER zu entfernen.\\n\\n[0006] Die WO2004/104630A1
  offenbart ein SAR-System, bei dem mehrere Radarstrahlen zum Abbilden einer zu erfassenden
  Oberfl\u00e4che benutzt werden und eine Verarbeitungseinrichtung Roll-, Neigungs-
  und Gierrichtungsdaten in Verbindung mit dem Radar verarbeiten kann. Die Richtungsdaten
  werden durch Ableiten der Fluglageinformation und durch selektive Eingabe von Gel\u00e4ndelevationsdaten
  bestimmt, um so Variationen in der Radarsichtgeometrie mit einer Gel\u00e4ndelevation
  ber\u00fccksichtigen zu k\u00f6nnen. Aufgabe der vorliegenden Erfindung ist es daher,
  ein Verfahren zum Optimieren des Betriebs eines aktiven Seitensichtsensors bei ver\u00e4nderlicher
  H\u00f6he \u00fcber der zu erfassenden Oberfl\u00e4che vorzuschlagen.\\n\\n[0007]
  Diese Aufgabe wird durch ein Verfahren zum Optimieren des Betriebs eines aktiven
  Seitensichtsensors bei ver\u00e4nderlicher H\u00f6he \u00fcber der zu erfassenden
  Oberfl\u00e4che mit den Merkmalen von Anspruch 1 gel\u00f6st. Weitere Ausgestaltungen
  der Erfindung sind Gegenstand der abh\u00e4ngigen Anspr\u00fcche.\\n\\n[0008] Ein
  wesentlicher Gedanke der Erfindung besteht nun darin, dass in Abh\u00e4ngigkeit
  von der ermittelten H\u00f6he eines Seitensichtsensors die vom Seitensichtsensor
  abgestrahlten Abtaststrahlen zum Abtasten einer zu erfassenden Oberfl\u00e4che durch
  eine Rollrotation derart eingestellt werden, dass die Variation der zu erfassenden
  Oberfl\u00e4che \u00fcber den Orbit des Seitensichtsensors verringert wird. Mit
  anderen Worten schl\u00e4gt die vorliegende Erfindung also die Anwendung eines Rollgesetzes
  zum Ausrichten einer Antenne eines Seitensichtsensors zum Festlegen eines auszuleuchtenden
  Streifens einer zu erfassenden Oberfl\u00e4che vor. Dadurch kann im Unterschied
  zu einer starren Antennenausrichtung der Seitensichtsensor \u00fcber l\u00e4ngere
  Abschnitte im Orbit mit konstanter PRF betrieben werden, der Betrieb also insbesondere
  hinsichtlich der Komplexit\u00e4t der Steuerung der Abtastung der zu erfassenden
  Oberfl\u00e4che optimiert werden. Weiterhin kann ein Antennenstrahl pro abzutastenden
  Streifen der zu erfassenden Oberfl\u00e4che \u00fcber den gesamten Orbit des Seitensichtsensors
  ausreichen.\\n\\n[0009] Die Erfindung betrifft nun gem\u00e4\u00df einer Ausf\u00fchrungsform
  ein Verfahren zum Optimieren des Betriebs eines aktiven Seitensichtsensors bei ver\u00e4nderlicher
  H\u00f6he \u00fcber der zu erfassenden Oberfl\u00e4che mit den folgenden Schritten:\\n\\n-
  fortlaufendes Ermitteln der H\u00f6he des Seitensichtsensors \u00fcber der zu erfassenden
  Oberfl\u00e4che und\\n\\n- Einstellen der vom Seitensichtsensor abgestrahlten Abtaststrahlen
  zum Abtasten der zu erfassenden Oberfl\u00e4che durch Rollrotieren (roll steering
  law) in Abh\u00e4ngigkeit von der ermittelten H\u00f6he des Seitensichtsensors derart,
  dass eine Variation der zu erfassenden Oberfl\u00e4che \u00fcber den Orbit des Seitensichtsensors
  verringert wird. Dies erm\u00f6glicht eine Vereinfachung der Steuerung der Abtastung
  der zu erfassenden Oberfl\u00e4che, da ein Betrieb mit konstanter PRF \u00fcber
  l\u00e4ngere Abschnitte des Orbits des Seitensichtsensors als Optimierung gem\u00e4\u00df
  dieser Ausf\u00fchrungsform der Erfindung erfolgen kann.\\n\\n[0010] Das Einstellen
  durch Rollrotieren kann gem\u00e4\u00df einer Ausf\u00fchrungsform der Erfindung
  eine mechanische Drehung des Seitensichtsensors umfassen.\\n\\n[0011] In einer Ausf\u00fchrungsform
  der Erfindung kann alternativ oder auch zus\u00e4tzlich das Einstellen durch Rollrotieren
  ein elektronisches Rollrotieren der abgestrahlten Abtaststrahlen durch entsprechende
  Ansteuerung einer Antenne des Seitensichtsensors umfasst.\\n\\n[0012] Gem\u00e4\u00df
  einer Ausf\u00fchrungsform der Erfindung kann das Einstellen durch Rollrotieren
  ein Schwenken der vom Seitensichtsensor erfassten Richtung abh\u00e4ngig von der
  zu erfassenden Oberfl\u00e4che umfassen.\\n\\n[0013] Gem\u00e4\u00df einer weiteren
  Ausf\u00fchrungsform der Erfindung kann das Einstellen durch Rollrotieren das Einhalten
  eines festen Abstands zwischen Seitensichtsensor und erfasster Oberfl\u00e4che umfassen.\\n\\n[0014]
  Weiterhin kann gem\u00e4\u00df einer Ausf\u00fchrungsform der Erfindung das Einstellen
  durch Rollrotieren das Einhalten einer festen Breite eines vom Seitensichtsensor
  ausgeleuchteten Streifens der zu erfassenden Oberfl\u00e4che umfassen.\\n\\n[0015]
  Das Einstellen durch Rollrotieren kann ferner gem\u00e4\u00df einer Ausf\u00fchrungsform
  der Erfindung eine f\u00fcr alle vom Seitensichtsensor ausgeleuchteten Streifen
  im Zugriffsbereich gemeinsame Variation eines Blickwinkels \u00fcber den Orbit des
  Seitensichtsensors umfassen.\\n\\n[0016] Ferner kann gem\u00e4\u00df einer Ausf\u00fchrungsform
  der Erfindung die Orientierung des Seitensichtsensors entsprechend seiner Orbitalposition
  durch Gieren und Neigen derart angepasst werden, dass eine Null-Doppler-Aufnahmegeometrie
  \u00fcber den gesamten Zugriffsbereich des Seitensichtsensors gew\u00e4hrleistet
  wird.\\n\\n[0017] Die Erfindung betrifft in einer weiteren Ausf\u00fchrungsform
  eine Vorrichtung zum Optimieren des Betriebs eines aktiven Seitensichtsensors bei
  ver\u00e4nderlicher H\u00f6he \u00fcber der zu erfassenden Oberfl\u00e4che, wobei
  die Vorrichtung zur Ausf\u00fchrung eines Verfahrens nach der Erfindung und wie
  oben erl\u00e4utert ausgebildet ist und folgendes aufweist:\\n\\n- erste Mittel
  zum fortlaufenden Ermitteln der H\u00f6he des Seitensichtsensors \u00fcber der zu
  erfassenden Oberfl\u00e4che und\\n\\n- zweite Mittel zum Einstellen der vom Seitensichtsensor
  abgestrahlten Abtaststrahlen zum Abtasten der zu erfassenden Oberfl\u00e4che durch
  Rollrotieren derart, dass eine Variation der zu erfassenden Oberfl\u00e4che \u00fcber
  den Orbit des Seitensichtsensors verringert wird. Die Vorrichtung kann beispielsweise
  als in einen Satelliten integrierbares Modul ausgebildet sein.\\n\\n[0018] Schlie\u00dflich
  betrifft die Erfindung gem\u00e4\u00df einer Ausf\u00fchrungsform einen Seitensichtsensor,
  beispielsweise ein SAR-System, der dadurch gekennzeichnet ist, dass er eine Vorrichtung
  nach der Erfindung und wie vorstehend erl\u00e4utert aufweist.\\n\\n[0019] Weitere
  Vorteile und Anwendungsm\u00f6glichkeiten der vorliegenden Erfindung ergeben sich
  aus der nachfolgenden Beschreibung in Verbindung mit den in den Zeichnungen dargestellten
  Ausf\u00fchrungsbeispielen.\\n\\n[0020] In der Beschreibung, in den Anspr\u00fcchen,
  in der Zusammenfassung und in den Zeichnungen werden die in der hinten angef\u00fchrten
  Liste der Bezeichnungen verwendeten Begriffe und zugeordneten Bezeichnungen verwendet.\\n\\n[0021]
  Die Zeichnungen zeigen in:\\n\\nFig. 1 ein Seitensichtsensor, der die Oberfl\u00e4che
  eines Himmelsk\u00f6rpers abtastet und die durch den Sensor erfasste Oberfl\u00e4che
  bei zwei verschiedenen H\u00f6hen;\\n\\nFig. 2A und 2B unterschiedliche Roll-Orientierungen
  eines Seitensichtsensors f\u00fcr zwei unterschiedliche H\u00f6hen an unterschiedlichen
  Positionen entlang des Orbits des Sensors \u00fcber der zu erfassenden Oberfl\u00e4che;\\n\\nFig.
  3A und 3B eine \u00dcberlagerung der in den beiden Fig. 2A und 2B dargestellten
  Messsituationen bei verschiedener vertikaler Referenz;\\n\\nFig. 4 ein Flussdiagramm
  eines Ausf\u00fchrungsbeispiels eines Verfahrens zum Optimieren des Betriebs eines
  aktiven Seitensichtsensors bei ver\u00e4nderlicher H\u00f6he \u00fcber der zu erfassenden
  Oberfl\u00e4che; und\\n\\nFig. 5 ein stark vereinfachtes Blockschaltbild eines aktiven
  Seitensichtsensors mit einer Vorrichtung zum Optimieren des Betriebs des aktiven
  Seitensichtsensors bei ver\u00e4nderlicher H\u00f6he \u00fcber der zu erfassenden
  Oberfl\u00e4che gem\u00e4\u00df der Erfindung.\\n\\n[0022] Im Folgenden k\u00f6nnen
  gleiche und/oder funktional gleiche Elemente mit den gleichen Bezeichnungen versehen
  sein.\\n\\n[0023] Fig. 1 zeigt ein SAR-System bzw. einen SAR-Satelliten 10 als Beispiel
  eines Seitensichtsensors, der als Messinstrument zur Abtastung die Oberfl\u00e4che
  eines Himmelsk\u00f6rpers 12 vorgesehen ist. Die durch den Sensor 10 erfasste Oberfl\u00e4che
  des Himmelsk\u00f6rpers 12 ist bei zwei verschiedenen H\u00f6hen, n\u00e4mlich bei
  niedriger und bei hoher H\u00f6he des Sensors \u00fcber der Oberfl\u00e4che dargestellt.
  Die Blickrichtung des Sensors 10, d.h. die Richtung der von der Antenne des SAR-Satelliten
  abgestrahlten Abtast- bzw. Antennenstrahlen ist hierbei h\u00f6henunabh\u00e4ngig.
  Die Blickrichtung kann \u00fcber den Blickwinkel $\\\\alpha$ angegeben werden, d.h.
  den Winkel zwischen der Hauptrichtung der Antennenstrahlen und dem Nadir.\\n\\n[0024]
  Das von den Abtast- bzw. Antennenstrahlen ausgeleuchtete und durch den Sensor 10
  zu erfassende Gebiet 14 auf der Oberfl\u00e4che des Himmelsk\u00f6rpers 12 (zu erfassendes
  Schr\u00e4gentfernungsintervall eines Streifens (swath)) ist dagegen h\u00f6henabh\u00e4ngig.
  Daher variiert der vom Sensor 10 auf der Oberfl\u00e4che des Himmelsk\u00f6rpers
  12 ausgeleuchtete Streifen 14 mit dem Abstand des Sensors 10 von der Oberfl\u00e4che,
  der wiederum vom Orbit des Sensors 10 abh\u00e4ngt. Auf elliptischen Bahnen und
  um nicht kugelsymmetrische Himmelsk\u00f6rper kann die Variation betr\u00e4chtlich
  sein, beispielsweise kann aufgrund der Erdabplattung die Variation bei sonnensynchronen
  polaren Erdumlaufbahnen etwa 28 km betragen. Derartige Abstandsvariation bedingen
  normalerweise eine Variation der PRF und damit eine aufwendige Steuerung der Abtastung.\\n\\n[0025]
  Die Orientierung eines SAR-Satelliten 10 kann gem\u00e4\u00df einem yaw- and pitch
  steering law (Gier- und Neige-Steuervorschrift) entsprechend seiner Orbitposition
  angepasst werden, damit eine \\\"Null-Doppler-Aufnahmegeometrie\\\" \u00fcber den
  gesamten Zugriffsbereich gew\u00e4hrleistet werden kann. Dies ist von Vorteil f\u00fcr
  die SAR-Prozessierung, d.h. die Verarbeitung der vom SAR-Satelliten 10 empfangenen
  Echosignale.\\n\\n[0026] Um die Variation des durch den SAR-Satelliten 10 zu erfassenden
  Schr\u00e4gentfernungsintervalls eines Streifens 14 \u00fcber den Orbit zu verringern,
  kann nun erfindungsgem\u00e4\u00df abh\u00e4ngig von der H\u00f6he des SAR-Satelliten
  \u00fcber der Oberfl\u00e4che eine mechanische (oder elektronische) Rollrotation
  (Rollgesetz - roll steering law) der verwendeten Antennenstrahlen durchgef\u00fchrt
  werden. Diese Rollrotation erlaubt bei Bedarf zus\u00e4tzlich eine Bewegung um die
  anderen Achsen, um die \\\"Null-Doppler-Aufnahmegeometrie\\\" zu erreichen, wie
  oben beschrieben.\\n\\n[0027] Fig. 2 zeigt unterschiedliche Roll-Orientierungen
  der Antennenstrahlen f\u00fcr zwei unterschiedliche H\u00f6hen (an unterschiedlichen
  Positionen entlang des Orbits) des SAR-Satelliten 10 \u00fcber der Messoberfl\u00e4che
  des Himmelsk\u00f6rpers 12. In Fig. 2A ist eine Roll-Orientierung bei einer \\\"tiefen\\\"
  H\u00f6he $h_{\\\\text{tief}}$ des Messinstruments bzw. SAR-Satelliten \u00fcber
  der erfassten Oberfl\u00e4che, in Fig. 2B eine Roll-Orientierung bei einer \\\"hohen\\\"
  H\u00f6he $h_{\\\\text{hoch}}$ dargestellt. Das bei den beiden unterschiedlichen
  Roll-Orientierungen erfasste Schr\u00e4gentfernungsintervall eines Streifens ist
  mit 141 bzw. 142 bezeichnet.\\n\\n[0028] Im Unterschied zu der in Fig. 1 dargestellten
  Situation, bei welcher keine Roll-Orientierung der Antennenstrahlen vorgenommen
  wurde, unterscheiden sich nun die Blickwinkel $\\\\alpha(h_{\\\\text{tief}})$ und
  $\\\\alpha(h_{\\\\text{hoch}})$ des SAR-Satelliten 10 und h\u00e4ngen von der H\u00f6he
  des SAR-Satelliten \u00fcber der erfassten Oberfl\u00e4che aufgrund der in beiden
  Situationen unterschiedlichen Roll-Orientierungen der Antennenstrahlen ab. Die Rollrotation
  der Antennenstrahlen kann durch eine mechanische Drehung des gesamten Satelliten
  (roll steering law) oder/und durch ein streifenabh\u00e4ngiges zus\u00e4tzliches
  Schwenken der vom Instrument erfassten Richtung bewirkt werden. Die nominelle Lage
  der ausgeleuchteten Streifen wandert entsprechend dem vom Messinstrument (Aperture
  bzw. Antenne) ausgeleuchteten Bereich.\\n\\n[0029] Die Abh\u00e4ngigkeit der Blickwinkel
  $\\\\alpha$ des SAR-Satelliten 10 von der H\u00f6he \u00fcber der Messoberfl\u00e4che
  wird von einer im SAR-Satelliten 10 implementierten Steuerung derart geregelt, dass
  eine Variation der mit den beiden unterschiedlichen Blickwinkeln erfassten Schr\u00e4gentfernungsintervalle
  eines Streifens 141 und 142 m\u00f6glichst wenig variieren, so dass die PRF \u00fcber
  l\u00e4ngere Abschnitte der Bahn des SAR-Satelliten 10 nahezu konstant bleiben kann.
  Fig. 3 zeigt die \u00dcberlagerung der beiden Darstellung von Fig. 2 bei verschiedener
  vertikaler Referenz: In Fig. 3A ist die Messoberfl\u00e4che und in Fig. 3B die Position
  des Messinstruments fest.\\n\\n[0030] Die \u00c4nderung des Blickwinkels des SAR-Satelliten
  10 \u00fcber den Orbit nach den folgenden Beispilkriterien optimiert werden:\\n\\n1.
  Das Einhalten eines festen Abstands zwischen Messinstrument und erfasster Oberfl\u00e4che
  w\u00fcrde die gr\u00f6\u00dfte Variation des Blickwinkels erfordern. Kleinere Blickwinkelvariationen
  vermindern zumindest die Abstandsvariationen.\\n\\n2. Das Einhalten einer festen
  Breite des ausgeleuchteten Streifens ist mit kleineren Variationen des\\n\\nBlickwinkels
  m\u00f6glich.\\n\\n3. Eine f\u00fcr alle Streifen im Zugriffsbereich gemeinsame
  Variation des Blickwinkels \u00fcber den Orbit kann mechanisch durch ein Rollgesetz
  durchgef\u00fchrt werden. Eine Anpassung der Gr\u00f6\u00dfe der Variation auf eine
  optimale Korrektur beim kritischsten Streifen (z. B. im Sinne der Punkte 1. und
  2.) ist oft ein guter Kompromiss.\\n\\n[0031] Fig. 4 zeigt nun ein Flussdiagramm
  eines Algorithmus, der beispielsweise von einer im SAR-Satelliten 10 implementierten
  Steuerung ausgef\u00fchrt werden kann und erm\u00f6glicht, den Betrieb des SAR-Satelliten
  10 zu optimieren hinsichtlich einer m\u00f6glichst konstanten PRF. In einem ersten
  Schritt S10 des Algorithmus wird fortlaufend die H\u00f6he des SAR-Satelliten 10
  \u00fcber der zu erfassenden Oberfl\u00e4che des Himmelsk\u00f6rpers 12 ermittelt.
  In einem darauf folgenden Schritt S12 werden dann die vom SAR-Satelliten 10 abgestrahlten
  Abtaststrahlen zum Abtasten der zu erfassenden Oberfl\u00e4che durch Rollrotieren
  in Abh\u00e4ngigkeit von der ermittelten H\u00f6he des Seitensichtssensors derart
  eingestellt, dass eine Variation der zu erfassenden Oberfl\u00e4che \u00fcber den
  Orbit des Seitensichtssensors verringert wird. Die kann dadurch erfolgen, dass abh\u00e4ngig
  von der ermittelten H\u00f6he f\u00fcr einen bestimmten Blickwinkel die Gr\u00f6\u00dfe
  eines erfassten Schr\u00e4gentfernungsintervalls eines Streifens berechnet wird
  und der Blickwinkel abh\u00e4ngig von der H\u00f6he derart ver\u00e4ndert wird,
  dass das mit dem ver\u00e4nderten Blickwinkel erfasste Schr\u00e4gentfernungsintervall
  eines Streifens eine Gr\u00f6\u00dfe aufweist, die der f\u00fcr den bestimmten Blickwinkel
  berechneten Gr\u00f6\u00dfe etwa entspricht.\\n\\n[0032] Fig. 5 zeigt noch ein stark
  vereinfachtes Blockschaltbild einer Vorrichtung 16 zum Optimieren des Betriebs eines
  aktiven Seitensichtssensors, die beispielsweise als Modul ausgebildet und in einen
  SAR-Satelliten 10 implementiert sein kann. Die Vorrichtung 16 weist erste Mittel
  18 zum fortlaufenden Ermitteln der H\u00f6he des Seitensichtssensors \u00fcber der
  zu erfassenden Oberfl\u00e4che und zweite Mittel 20 auf, die ausgebildet sind zum
  Einstellen der vom Seitensichtsensor abgestrahlten Abtaststrahlen zum Abtasten der
  zu erfassenden Oberfl\u00e4che durch Rollrotieren in Abh\u00e4ngigkeit von der ermittelten
  H\u00f6he des Seitensichtssensors derart, dass eine Variation der zu erfassenden
  Oberfl\u00e4che \u00fcber den Orbit des Seitensichtssensors verringert wird. Die
  Mittel 18 und 20 k\u00f6nnen entweder in Hard- oder Software oder zumindest teilweise
  in Hard- oder Software implementiert sein. Beispielsweise k\u00f6nnen sie durch
  einen Prozessor mit Speicher, in dem der in Fig. 4 skizzierte Algorithmus in Form
  eines durch den Prozessor ausf\u00fchrbaren Programms abgelegt ist, implementiert
  sein.\\n\\n[0033] Verglichen mit einer starren Orientierung einer Antenne erm\u00f6glicht
  die Festlegung der auszuleuchtenden Streifen mit Hilfe eines Rollgesetzes gem\u00e4\u00df
  der Erfindung insbesondere folgendes:\\n\\n- Es lassen sich l\u00e4ngere Abschnitte
  im Orbit mit konstanter PRF betreiben: im Beispiel von Sentinel-1 sogar konstant
  \u00fcber den gesamten Orbit f\u00fcr fast alle Streifen. Weiterhin reduziert sich
  die Komplexit\u00e4t der Steuerung/Programmierung.\\n- Es kann gen\u00fcgen, ein
  und dieselbe Konfiguration des Messinstruments (Antennenstrahl) pro Streifen \u00fcber
  den gesamten Orbit zu verwenden.\\n\\nBezugszeichen\\n\\n[0034]\\n\\n| Zeile | Beschreibung
  |\\n|-------|--------------|\\n| 10    | Seitensichtsensor |\\n| 12    | Himmelsk\u00f6rper
  |\\n| 14    | Schr\u00e4gentfernungsintervall eines Streifens |\\n| 141   | Schr\u00e4gentfernungsintervall
  eines Streifens |\\n| 142   | Schr\u00e4gentfernungsintervall eines Streifens |\\n|
  16    | Vorrichtung zum Optimieren des Betriebs eines aktiven Seitensichtssensors
  |\\n| 18    | erste Mittel der Vorrichtung 16 |\\n| 20    | zweite Mittel der Vorrichtung
  16 |\\n| S10-S12 | Verfahrensschritte |\\n\\nPatentanspr\u00fcche\\n\\n1. Verfahren
  zum Optimieren des Betriebs eines aktiven Seitensichtssensors (10) bei ver\u00e4nderlicher
  H\u00f6he \u00fcber der zu erfassenden Oberfl\u00e4che (12) mit den folgenden Schritten:\\n   \\n   -
  fortlaufendes Ermitteln der H\u00f6he des Seitensichtssensors \u00fcber der zu erfassenden
  Oberfl\u00e4che (S10) und\\n   - Einstellen der vom Seitensichtsensor abgestrahlten
  Abtaststrahlen zum Abtasten der zu erfassenden Oberfl\u00e4che durch Rollrotieren
  in Abh\u00e4ngigkeit von der ermittelten H\u00f6he des Seitensichtssensors derart,
  dass eine vom Abstand des Seitensichtssensors von der Oberfl\u00e4che abh\u00e4ngige
  Variation eines ausgeleuchteten Streifens (14; 141, 142) der zu erfassenden Oberfl\u00e4che
  \u00fcber den Orbit des Seitensichtssensors verringert wird (S12).\\n\\n2. Verfahren
  nach Anspruch 1, dadurch gekennzeichnet, dass das Einstellen durch Rollrotieren
  eine mechanische Drehung des Seitensichtssensors umfasst.\\n\\n3. Verfahren nach
  Anspruch 1 oder 2, dadurch gekennzeichnet, dass das Einstellen durch Rollrotieren
  ein elektronisches Rollrotieren der abgestrahlten Abtaststrahlen durch entsprechende
  Ansteuerung einer Antenne des Seitensichtssensors umfasst.\\n\\n4. Verfahren nach
  Anspruch 1, 2 oder 3,\\ndadurch gekennzeichnet, dass\\ndas Einstellen durch Rollrotieren
  ein Schwenken der\\nvom Seitensichtsensor erfassten Richtung abh\u00e4ngig\\nvon
  der zu erfassenden Oberfl\u00e4che umfasst.\\n\\n5. Verfahren nach Anspruch 1, 2,
  3 oder 4,\\ndadurch gekennzeichnet, dass\\ndas Einstellen durch Rollrotieren das
  Einhalten ei-\\nnes festen Abstands zwischen Seitensichtsensor\\nund erfasster Oberfl\u00e4che
  umfasst.\\n\\n6. Verfahren nach einem der vorhergehenden Anspr\u00fc-\\nche,\\ndadurch
  gekennzeichnet, dass\\ndas Einstellen durch Rollrotieren das Einhalten einer\\nfesten
  Breite eines vom Seitensichtsensor ausge-\\nleuchteten Streifens der zu erfassenden
  Oberfl\u00e4che\\numfasst.\\n\\n7. Verfahren nach einem der vorhergehenden Anspr\u00fc-\\nche,\\ndadurch
  gekennzeichnet, dass\\ndas Einstellen durch Rollrotieren eine f\u00fcr alle vom\\nSeitensichtsensor
  ausgeleuchteten Streifen im Zu-\\ngriffsbereich gemeinsame Variation eines Blickwin-\\nkels
  \u00fcber den Orbit des Seitensichtsensors umfasst.\\n\\n8. Verfahren nach einem
  der vorhergehenden Anspr\u00fc-\\nche,\\ndadurch gekennzeichnet, dass\\nferner die
  Orientierung des Seitensichtsensors ent-\\nsprechend seiner Orbitalposition durch
  Gieren und\\nNeigen derart angepasst wird, dass eine Null-Dopp-\\nler-Aufnahmegeometrie
  \u00fcber den gesamten Zu-\\ngriffsbereich des Seitensichtsensors gew\u00e4hrleistet\\nwird.\\n\\n9.
  Vorrichtung (16) zum Optimieren des Betriebs eines\\naktiven Seitensichtsensors
  (10) bei ver\u00e4nderlicher\\nH\u00f6he \u00fcber der zu erfassenden Oberfl\u00e4che
  (12), wo-\\nbei die Vorrichtung zur Ausf\u00fchrung eines Verfahrens\\nnach einem
  der vorhergehenden Anspr\u00fcche ausge-\\nbildet ist und folgendes aufweist:\\n\\n-
  erste Mittel (18) zum fortlaufenden Ermitteln\\nder H\u00f6he des Seitensichtsensors
  \u00fcber der zu\\nerfassenden Oberfl\u00e4che und\\n- zweite Mittel (20) zum Einstellen
  der vom Sei-\\ntensichtsensor abgestrahlten Abtaststrahlen\\nzum Abtasten der zu
  erfassenden Oberfl\u00e4che\\ndurch Rollrotieren in Abh\u00e4ngigkeit von der er-\\nmittelten
  H\u00f6he des Seitensichtsensors derart,\\ndass eine vom Abstand des Seitensichtsensors\\nvon
  der Oberfl\u00e4che abh\u00e4ngige Variation eines\\nausgeleuchteten Streifens (14;
  141, 142) der zu\\nerfassenden Oberfl\u00e4che \u00fcber den Orbit des Sei-\\ntensichtsensors
  verringert wird.\\n\\n10. Seitensichtsensor,\\ndadurch gekennzeichnet, dass\\ner
  eine Vorrichtung nach Anspruch 9 aufweist.\\n\\nClaims\\n\\n1. Method for optimizing
  the operation of an active side\\nview sensor (10) at a variable height above the
  sur-\\nface (12) to be recorded, having the following steps:\\n\\n- continuous determination
  of the height of the\\nside view sensor above the surface (S10) to be\\nrecorded,
  and\\n- setting the scanning beams, emitted by the side\\nview sensor, in order
  to scan the surface to be\\nrecorded by roll rotation as a function of the de-\\ntermined
  height of the side view sensor such\\nthat a variation in an illuminated swath (14;
  141,\\n142) of the surface to be recorded which de-\\npends on the distance of the
  side view sensor\\nfrom the surface is reduced over the orbit of the\\nside view
  sensor (S12).\\n\\n2. Method according to Claim 1, characterized in that\\nthe setting
  by roll rotation comprises a mechanical\\nrotation of the side view sensor.\\n\\n3.
  Method according to Claim 1 or 2, characterized in\\nthat the setting by roll rotation
  comprises an elec-\\ntronic roll rotation of the emitted scanning beams by\\nappropriately
  driving an antenna of the side view\\nsensor.\\n\\n4. Method according to Claim
  1, 2 or 3, characterized\\nin that the setting by roll rotation comprises swinging\\nthe
  direction recorded by the side view sensor as a\\nfunction of the surface to be
  recorded.\\n\\n5. Method according to Claim 1, 2, 3 or 4, character-\\nized in that
  the setting by roll rotation comprises\\nsetting a fixed distance between the side
  view sensor\\nand the recorded surface.\\n\\n6. Method according to one of the preceding
  claims,\\ncharacterized in that the setting by roll rotation\\ncomprises maintaining
  a fixed width of a swath, illu-\\nminated by the side view sensor, of the surface
  to\\nbe recorded.\\n\\n7. Method according to one of the preceding claims,\\ncharacterized
  in that the setting by roll rotation\\ncomprises a variation, common to all swaths
  illumi-\\nnated by the side view sensor in the access range,\\nin a viewing angle
  over the orbit of the side view\\nsensor.\\n\\n8. Method according to one of the
  preceding claims,\\n\\ncharacterized in that, furthermore, the orientation of the
  side view sensor is adjusted in accordance with its orbital position by yawing and
  pitching in such a way that a zero Doppler recording geometry is ensured over the
  entire access range.\\n\\n9. Device (16) for optimizing the operation of an active
  side view sensor (10) at a varying height above the surface (12) to be recorded,
  the device being designed for executing a method according to one of the preceding
  claims, and having the following:\\n\\n- first means (18) for continuously determining
  the height of the side view sensor above the surface to be recorded, and\\n- second
  means (20) for setting the scanning beams, emitted by the side view sensor, in order
  to scan the surface to be recorded by roll rotation as a function of the determined
  height of the side view sensor such that a variation in an illuminated swath (14;
  141, 142) of the surface to be recorded which depends on the distance of the side
  view sensor from the surface is reduced over the orbit of the side view sensor.\\n\\n10.
  Side view sensor characterized in that it has a device according to Claim 9.\\n\\nRevendications\\n\\n1.
  Proc\u00e9d\u00e9 d''optimisation du fonctionnement d''un capteur de vue lat\u00e9rale
  actif (10) \u00e0 une hauteur variable au-dessus de la surface \u00e0 d\u00e9tecter
  (12) avec les \u00e9tapes suivantes :\\n\\n- d\u00e9termination continue de la hauteur
  du capteur de vue lat\u00e9rale au-dessus de la surface \u00e0 d\u00e9tecter (S10)
  et\\n- r\u00e9glage des rayonnements d''exploration \u00e9mis par le capteur de
  vue lat\u00e9rale pour l''exploration de la surface \u00e0 d\u00e9tecter par roulis-rotation
  en fonction de la hauteur d\u00e9termin\u00e9e du capteur de vue lat\u00e9rale de
  mani\u00e8re \u00e0 r\u00e9duire (S12) une variation d''une bande \u00e9clair\u00e9e
  (14 ; 141, 142) de la surface \u00e0 d\u00e9tecter le long de l''orbite du capteur
  de vue lat\u00e9rale, qui d\u00e9pend de la distance du capteur de vue lat\u00e9rale
  \u00e0 la surface \u00e0 d\u00e9tecter.\\n\\n2. Proc\u00e9d\u00e9 selon la revendication
  1,\\ncaract\u00e9ris\u00e9 en ce que\\nle r\u00e9glage par roulis-rotation comporte
  une rotation m\u00e9canique du capteur de vue lat\u00e9rale.\\n\\n3. Proc\u00e9d\u00e9
  selon la revendication 1 ou 2,\\ncaract\u00e9ris\u00e9 en ce que\\nle r\u00e9glage
  par roulis-rotation comporte un roulis-rotation \u00e9lectronique des rayonnements
  d''exploration \u00e9mis, par l''interm\u00e9diaire de la commande correspondante
  d''une antenne du capteur de vue lat\u00e9rale.\\n\\n4. Proc\u00e9d\u00e9 selon
  la revendication 1, 2 ou 3,\\ncaract\u00e9ris\u00e9 en ce que\\nle r\u00e9glage
  par roulis-rotation comporte un basculement de la direction d\u00e9tect\u00e9e par
  le capteur de vue lat\u00e9rale en fonction de la surface \u00e0 d\u00e9tecter.\\n\\n5.
  Proc\u00e9d\u00e9 selon la revendication 1, 2, 3 ou 4,\\ncaract\u00e9ris\u00e9 en
  ce que\\nle r\u00e9glage par roulis-rotation comporte le maintien d''une distance
  fixe entre le capteur de vue lat\u00e9rale et la surface d\u00e9tect\u00e9e.\\n\\n6.
  Proc\u00e9d\u00e9 selon une des revendications pr\u00e9c\u00e9dentes,\\ncaract\u00e9ris\u00e9
  en ce que\\nle r\u00e9glage par roulis-rotation comporte le maintien d''une largeur
  fixe d''une bande de la surface \u00e0 d\u00e9tecter, \u00e9clair\u00e9e par le
  capteur de vue lat\u00e9rale.\\n\\n7. Proc\u00e9d\u00e9 selon une des revendications
  pr\u00e9c\u00e9dentes,\\ncaract\u00e9ris\u00e9 en ce que\\nle r\u00e9glage par roulis-rotation
  comporte pour toutes les bandes \u00e9clair\u00e9es par le capteur de vue lat\u00e9rale
  dans le domaine d''acc\u00e8s, une variation collective d''un angle de vue le long
  de l''orbite du capteur de vue lat\u00e9rale.\\n\\n8. Proc\u00e9d\u00e9 selon une
  des revendications pr\u00e9c\u00e9dentes,\\ncaract\u00e9ris\u00e9 en ce que\\nde
  plus, l''orientation du capteur de vue lat\u00e9rale correspondant \u00e0 sa position
  orbitale est adapt\u00e9e par lacets et inclinaison de mani\u00e8re \u00e0 assurer
  une g\u00e9om\u00e9trie d''enregistrement Doppler nulle sur l''ensemble du domaine
  d''acc\u00e8s du capteur de vue lat\u00e9rale.\\n\\n9. Dispositif (16) d''optimisation
  du fonctionnement d''un capteur de vue lat\u00e9rale actif (10) \u00e0 une hauteur
  variable au-dessus de la surface \u00e0 d\u00e9tecter (12), le dispositif pour l''ex\u00e9cution
  d''un proc\u00e9d\u00e9 \u00e9tant r\u00e9alis\u00e9 selon une des revendications
  pr\u00e9c\u00e9dentes et comporte les \u00e9l\u00e9ments suivants :\\n\\n- des premiers
  moyens (18) pour la d\u00e9termination continue de la hauteur du capteur de vue
  lat\u00e9rale au-dessus de la surface \u00e0 d\u00e9tecter et\\n- des deuxi\u00e8mes
  moyens (20) pour le r\u00e9glage des rayonnements d''exploration \u00e9mis par le
  capteur de vue lat\u00e9rale pour l''exploration de la surface \u00e0 d\u00e9tecter
  par roulis-rotation en fonction de la hauteur d\u00e9termin\u00e9e du capteur de
  vue lat\u00e9rale de mani\u00e8re \u00e0 r\u00e9duire une variation d''une bande
  \u00e9clair\u00e9e (14 ; 141, 142) de la surface \u00e0 d\u00e9tecter le long de
  l''orbite du capteur de vue lat\u00e9rale, qui d\u00e9pend de la distance du capteur
  de vue lat\u00e9rale \u00e0 la surface.\\n\\n10. Capteur de vue lat\u00e9rale\\n   caract\u00e9ris\u00e9
  en ce qu''il comporte un dispositif selon\\n   la revendication 9.\\n\\nPosition
