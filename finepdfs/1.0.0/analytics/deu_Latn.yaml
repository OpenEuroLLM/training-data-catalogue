  in Greifenberg 9. - 18.10.\\n\\nBei der Meistbeteiligung belegten wir den 1. Platz
  mit 27 Teilnehmern, gefolgt von Utting mit 23 TN.\\n\\n1. Platz mit 2701 Ringen
  Waldvogel Neugreifenberg\\n2. Platz mit 2696 Ringen Seerose Eching\\n3. Platz mit
  2695 Ringen Schmied von Kochel Greifenberg\\n\\nRundenwettk\u00e4mpfe Luftgewehr
  2008/2009\\n\\nDie LG-Mannschaft schie\u00dft nach wie vor in der Gauliga, wo sie
  am Ende der R\u00fcckrunde den 3. Platz mit 12:8 Punkten und einem Durchschnitt
  von 1483 Ringen belegten. Die beteiligten Sch\u00fctzen waren:\\n\\nUlrich Gall\\n\\nJohann
  Gall\\n\\nThomas Mayer\\n\\nHelmut Pittrich\\n\\nIn der LG-Einzelwertung im Gau-Ammersee
  kam Ulrich Gall in der Gauliga auf den 8. Platz mit 373,4 Ringen, Johann Gall auf
  den 10. Platz mit 370,0 Ringen\\n\\nIn der Hinrunde 2009/2010 liegen sie mit 2:8
  Punkten und einem Durchschnitt von 1475 Ringen auf dem 5. Platz vor Riederau.\\n\\nRundenwettk\u00e4mpfe
  Luftpistole 2008/2009\\n\\nDie LP-Mannschaft belegt zum Ende der R\u00fcckrunde
  den 3. Platz in der B-Klasse mit 16:4 Punkten und einem Durchschnitt von 1363 Ringen.\\n\\nDie
  beteiligten Sch\u00fctzen waren:\\n\\nJohann Albrecht\\n\\nKlaus Allen\\n\\nMax
  Keller\\n\\nWolfgang L\u00fcbbert\\n\\nAljosha Speth\\n\\nIn der Hinrunde2009/2010liegen
  sie mit 2:4 Punkten auf dem 3. Platz.\\n\\nDie durchschnittliche Ringzahl war nicht
