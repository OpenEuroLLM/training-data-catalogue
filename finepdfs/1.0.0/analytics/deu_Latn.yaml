  Sparte Bowling \u2013\\n\\nBSG-Bowling-Fachwarte\\n\\nVorstand BSV M\u00fcnster\\n\\nSportausschuss
  Bowling\\n\\nEva-Maria Gei\u00dfmann (Bowling-Sportausschuss)\"", "\"DER BESTE BUSINESS-AUFTRITT\\nONLINE
  UND OFFLINE ZUM ERFOLG\\n\\nunternehmerin.at\\n\\nF\u00dcR IHREN BESTEN AUFTritt\\n\\nGerade
  jetzt ist es f\u00fcr Unternehmerinnen wichtig, jede Chance auf erfolgreiche Business-Kontakte
  zu nutzen. Daf\u00fcr braucht es nicht nur \u00fcberzeugende Produkte und Dienstleistungen,
  sondern auch ein \u00fcberzeugendes Auftreten.\\n\\nDie Business-Etikette macht
  den Unterschied \u2013 und das nicht nur offline, sondern immer st\u00e4rker auch
  online.\\n\\nZwischen dem perfekten Auftritt in der analogen Welt und in der digitalen
  Welt gibt es nat\u00fcrlich Unterschiede. Wer sie kennt und professionell damit
  umgehen kann, hat im Wettbewerb die Nase vorn. Deshalb haben wir in unserer neuen
  Brosch\u00fcre die besten Tipps von Expertinnen f\u00fcr die Offline- und Online-Business-Welt
  zusammengefasst. So wissen Sie immer was sich auf welcher Plattform \u201egeh\u00f6rt\u201c
  \u2013 und wie Sie bei Ihrem gesch\u00e4ftlichen Gegen\u00fcber bestm\u00f6glich
  punkten k\u00f6nnen.\\n\\nIn diesem Sinn: Viel Erfolg mit unseren neuen Business-Tipps
  f\u00fcr die Online- und die Offline-Welt \u2013 wir Frauen in der Wirtschaft sind
  \u00fcberall erfolgreich!\\n\\nIMPRESSUM\\n\\nHerausgeber:\\nFrau in der Wirtschaft
  (FiW),\\nWirtschaftskammer \u00d6sterreich (WK\u00d6),\\nWiedner Hauptstra\u00dfe
  63, 1045 Wien.\\nDiese und weitere Brosch\u00fcren sind bei FiW in den Wirtschaftskammern
  \u00d6sterreichs erh\u00e4ltlich.\\nDie Online-Version der Brosch\u00fcre finden
  Sie auf unternehmerin.at/brosch\u00fcre\\n\\nF\u00fcr den Inhalt verantwortlich:\\nMag.
  Bernadette Hawel, Frau in der Wirtschaft\\n\\nAutoren:\\nDie Brosch\u00fcre wurde
  in Zusammenarbeit mit Mag. Sabine Hoffmann, Birgit Streibel und Dr. Christine Zach
  erstellt.\\n\\nMedieninhaber/Verleger:\\nFrau in der Wirtschaft der Wirtschaftskammer
  \u00d6sterreich.\\nAlle Rechte vorbehalten. Trotz sorgf\u00e4ltiger Pr\u00fcfung
  s\u00e4mtlicher Beitr\u00e4ge in dieser Brosch\u00fcre sind Fehler nicht auszuschlie\u00dfen
  und die Richtigkeit des Inhalts ist daher ohne Gew\u00e4hr. Eine Haftung der Autoren
  oder der Medieninhaber ist ausgeschlossen.\\n\\nGrafik & Gestaltung:\\nGPK GmbH\\n\\nCoverfoto:\\n\u00a9iStock/shapecharge\\n\\nNovember
  2020\\n\\nMartha Schultz\\nVizepr\u00e4sidentin der Wirtschaftskammer \u00d6sterreich\\nBundesvorsitzende
  Frau in der Wirtschaft\\n\\nVera Sares\\nLandesvorsitzende\\nFrau in der Wirtschaft
  Nieder\u00f6sterreich\\n\\nPERFEKTE ONLINE-PR\u00c4SENZ\\n\\nTipps von Birgit Streibel*\\n\\nDank
  Digitalisierung ist es Unternehmerinnen m\u00f6glich, sich auch virtuell zu vernetzen
  und Produkte und Dienstleistungen einer gro\u00dfen Zielgruppe anzubieten. Rund
  um virtuelle Auftritte sollten Unternehmerinnen folgende Fragen beantworten k\u00f6nnen:\\n\\n-
  Welche Botschaft / welches Image m\u00f6chte ich vermitteln?\\n- Wie kann ich mich
  selbst souver\u00e4n und kompetent darstellen?\\n- Auf welche technischen Herausforderungen
  muss ich achten?\\n\\nAuf Basis einer klaren Strategie kann man das eigene Auftreten
  und seine Wirkung bei digitalen Auftritten stark verbessern. Nachfolgend die wichtigsten
  Tipps daf\u00fcr.\\n\\nDigitale Interaktionen stellen gro\u00dfe Anforderungen an
  die eigene IT-Infrastruktur. Die wichtigsten Erfolgsfaktoren:\\n\\n- Sorgen Sie
  f\u00fcr eine stabile Internetverbindung. Bei externen Veranstaltungen m\u00fcssen
  Sie abkl\u00e4ren, ob vor Ort ein W-LAN existiert oder ob Sie Ihren Smartphone-Hotspot
  nutzen m\u00fcssen. Achten Sie auf Datenlimits, weil Videokonferenzen gro\u00dfe
  Datenmengen ben\u00f6tigen.\\n\\n- Manche Applikationen und Programme f\u00fcr Web-Konferenzen
  funktionieren nur auf einem Smartphone, andere nur auf Computer. Verwenden Sie die
  richtigen Programme am richtigen Ger\u00e4t. Klassiker sind Skype, WhatsApp, Google
  Handouts und Facebook Messenger. Business-Profis verwenden Zoom, Microsoft Teams,
  Skype for Business, Google Meet, Amazon Chime oder Cisco WebEx.\\n\\n- Beachten
  Sie bei Digitalger\u00e4ten stets den Akkustatus und schlie\u00dfen Sie Ihr Ger\u00e4t
  rechtzeitig an.\\n\\n- Die beste Akustik wird mit Kopfh\u00f6rer mit integriertem
  Mikrofon erreicht.\\n\\n- Falls Sie stehend vortragen, ist ein Stativ f\u00fcr Kamera
  und Mikrofon zweckm\u00e4\u00dfig.\\n\\nATMOSPH\u00c4RISCHEN RAUM SCHAFFEN\\n\\nMit
  Videointeraktionen von Zuhause gibt man Einblicke in die eigenen vier W\u00e4nde.
  Darum ist es ratsam, sich vorher zu \u00fcberlegen, was man von seinem privaten
  Raum \u00fcberhaupt preisgeben m\u00f6chte.\\n\\n- Platzieren Sie sich wohl\u00fcberlegt
  im Wohnzimmer, im Homeoffice oder auch im Freien.\\n- Achten Sie auf einen ruhigen
  Hintergrund \u2013 weniger ist mehr.\\n- Vermeiden Sie offene T\u00fcren, Laden
  oder Kastent\u00fcren.\\n- Platzieren Sie z. B. eine Leinwand hinter dem Sitzplatz.
  Sie vermittelt eine neutrale Atmosph\u00e4re und ein ruhiges Bild. Eine gute Alternative
  ist eine helle, einfarbige Wand.\\n- Firmenlogos oder Rollups sind sichtbar zu platzieren.
  Diese sollten maximal ein Drittel des Bildes einnehmen, um nicht zu sehr abzulenken.\\n-
  Achten Sie darauf, dass die Kamera auf Augenh\u00f6he mit Ihrem Gesicht platziert
  wird. Sollte kein Stativ verf\u00fcgbar sein, hilft auch ein B\u00fccherstapel unter
  dem Laptop, um die Kamera h\u00f6her zu stellen. Wird die Kamera zu hoch oder zu
  niedrig platziert, vermittelt dies ein Ungleichgewicht mit dem Gegen\u00fcber.\\n-
  Der richtige Abstand zur Kamera betr\u00e4gt meistens ca. einen Meter.\\n- Vermeiden
  Sie s\u00e4mtliche Hintergrundger\u00e4usche. Stellen Sie sicher, dass das Handy
  und auch das Telefon stumm geschalten sind.\\n- Bei Konferenzen mit mehreren Teilnehmern
  ist es ratsam, sein Mikrofon auszuschalten und nur dann einzuschalten, wenn man
  etwas sagen m\u00f6chte.\\n- Achten Sie auf eine angenehme Beleuchtung. Das beste
  Bild erreichen Sie, wenn das Tageslicht das eigene Gesicht erhellt. Wenn dies nicht
  m\u00f6glich ist, hilft eine Tageslichtlampe neben Ihrem Laptop.\\n- Vermeiden Sie
  auf alle F\u00e4lle Gegenlicht oder direkte Sonneneinstrahlung, denn sonst erkennt
  man nur eine schwarze Silhouette am Bildschirm.\\n- Vorsicht bei Konferenzschaltungen
  mit mehreren Teilnehmern: Auch, wenn Sie gerade nicht sprechen und im Mittelpunkt
  stehen, werden Sie trotzdem gesehen.\\n- Achten Sie darauf, den anderen Diskutanten
  aktiv zuzuh\u00f6ren. Dies steigert Ihre \u00dcberzeugungskraft im virtuellen Raum.\\n\\nONLINE
  OPTIMAL AUFTRETEN\\n\\nKommunikation erfolgt auch auf der non- und paraverbalen
  Ebene. Deswegen sollte man gut \u00fcberlegen, wie der Auftritt, das Online-Meeting,
  die Pr\u00e4sentation, die Beratung oder das Verkaufsgespr\u00e4ch inszeniert wird.
  Je nach Situation bietet sich an, die Konferenz sitzend oder stehend abzuhalten.
  Probieren Sie vorher aus, welche Position f\u00fcr Sie passend ist.\\n\\nNeben Mimik,
  Gestik und K\u00f6rperhaltung ist die Stimme ein wesentlicher Sympathiefaktor. Durch
  physische Distanz ist nur ein kleiner Prozentsatz der erlebten Emotionen f\u00fchlbar.
  Darum gewinnen in der virtuellen Welt Faktoren wie aktives Zuh\u00f6ren, eine klare
  und verst\u00e4ndliche Sprache oder Verst\u00e4ndnisfragen zur Verhinderung von
  Fehlinterpretationen an Bedeutung. Der virtuelle Augenkontakt muss ge\u00fcbt sein,
  da man mit der Linse der Kamera kommuniziert. Man ist verleitet, Augenkontakt mit
  den Mitdiskutanten am Bildschirm zu suchen \u2013 doch genau dadurch fehlt die pers\u00f6nliche
  Ansprache, weil man nicht in die Kamera sieht. Ein Klebezettel oder eine sonstige
  Markierung neben der Linse ist ein guter Reminder.\\n\\nAuch die visuelle Erscheinung
  ist ein wesentlicher Erfolgsfaktor:\\n\\n- Kleiden Sie sich so, wie man Sie kennt
  und es auch von Ihnen erwartet.\\n- Bleiben Sie Ihrem Businessstil treu.\\n- Bevorzugen
  Sie kontrastreiche Unifarben. Blaut\u00f6ne, Beerent\u00f6ne oder Gr\u00fcnt\u00f6ne
  sind von Vorteil. Mit Schwarz und Wei\u00df \u201everwirrt\u201c man die automatische
  Helligkeitsanpassung der Kameras.\\n- Vermeiden Sie auff\u00e4llige Musterungen
  in Ihrer Kleidung.\\n- Eine gute Passform steht f\u00fcr Kompetenz.\\n- Screens
  machen nicht dick, sondern fl\u00e4chig.\\n- Achten Sie auf Glanz im Gesicht. Videokonferenzen
  k\u00f6nnen Stress erzeugen und dieser verursacht Transpiration. Verwenden Sie mattes
  Gesichtspuder und betonen Sie Ihre Lippen, da bei Videointeraktionen das Wort im
  Mittelpunkt steht.\\n\\nCHECKLISTE F\u00dcR DIE VIDEOREDAKTION\\n\\nEine gute Vorbereitung
  ist die halbe Miete.\\nDie wichtigsten Checks auf einen Blick:\\n\\n- Haben Sie
  15 Minuten vor der Online-Schaltung die Technik \u00fcberpr\u00fcft?\\n- Halten
  Sie alle Unterlagen parat?\\n- Ist die Slideshow einsatzbereit?\\n- Haben Sie an
  ein Wasserglas gedacht?\\n\\nWichtig: Bringen Sie nochmals f\u00fcr sich Ihre Botschaft
  auf den Punkt. Und machen Sie einen letzten Blick in den Spiegel, um sicherzustellen,
  dass alles passt. Dann kann Ihre erfolgreiche Videointeraktion starten.\\n\\nFEEDBACK
  NUTZEN\\n\\nUm bei Videointeraktionen kompetent, souver\u00e4n und authentisch zu
  wirken, bedarf es viel \u00dcbung. Das muss man lernen. Bitten Sie daher Kunden,
  Mitarbeiter oder auch Freundinnen und Familie um konstruktives Feedback. Und \u00fcberlegen
  Sie sich genau, was Sie warum umsetzen. Mit der Erfahrung kommt die Routine \u2013
  und mit der Routine die Souver\u00e4nit\u00e4t. Genau darum geht es f\u00fcr Ihre
  perfekte virtuelle Inszenierung.\\n\\n*Birgit Streibel* ist Inhaberin von Streibel
  Consulting, einem Unternehmens- und Imageberatungsunternehmen. Sie unterst\u00fctzt
  ihre Kunden in Prozessen der Unternehmensentwicklung im Soft Skills-Bereich und
  in der Imagebildung. Zielgruppe sind Unternehmen und Wirtschaftstreibende mit direktem
  Kundenkontakt - sowohl face to face als auch auf virtueller Ebene. Birgit Streibel
  liefert mit ihrer langj\u00e4hrigen Expertise einen wertvollen Beitrag f\u00fcr
  den Erfolg von Unternehmerinnen. Ihr Leitsatz \u201eBegeistert Menschen begegnen\u201c
  steht f\u00fcr Kommunikation auf Augenh\u00f6he, Offenheit und Neugier f\u00fcr
  Neues sowie Verl\u00e4sslichkeit.\\n\\nstyleimpuls.at\\n\\nVIRTUELL NETZWERKEN\\n\\nTipps
  von Sabine Hoffmann*\\n\\nDIGITALE REPUTATION: SICH SELBST IM BLICK HABEN\\n\\nSuchen
  Sie auf Google Ihren eigenen Namen und \u00fcberpr\u00fcfen Sie die Suchergebnisse:
  Wo tauchen Sie auf? Was davon kann man selbst gestalten? Genau hier kommt vor allem
  Social Media ins Spiel: Durch die hohe Aktivit\u00e4t dieser Netzwerke reihen Suchmaschinen
  Ihre LinkedIn-, Facebook- oder Instagram-Profile oft unter die Top-5-Suchergebnisse.
  Und hier bestimmen nat\u00fcrlich Sie selbst, was \u00fcber Sie zu sehen ist. Das
  dient der besseren Auffindbarkeit und liefert m\u00f6glichen neuen Kontakten erste
  Ankn\u00fcpfungspunkte zu Ihrer Person.\\n\\nWichtig: Werfen Sie auch einen Blick
  in die Bildersuche. Auch hier sind Ihre Profiltotos von Social-Media-Kan\u00e4len
  meist an erster Stelle gereiht.\\n\\nLINKEDIN: IHR SUPERSTAR-PROFIL AM \u201eFACEBOOK
  F\u00dcR\u2019S BUSINESS\u201c\\n\\nKnapp 700 Millionen User weltweit und beachtliche
  1,5 Millionen User in \u00d6sterreich sind regelm\u00e4\u00dfig auf der Plattform
  aktiv. Ein aktuelles und vollst\u00e4ndiges LinkedIn-Profil geh\u00f6rt heute zum
  guten Ton des professionellen und modernen Auftretens. Dabei ist ein Profil mit
  korrekten und vollst\u00e4ndigen Angaben zu Ihrem beruflichen Werdegang und Ihren
  Ausbildungsstationen von gro\u00dfer Bedeutung. Darauf bezieht sich auch der Algorithmus,
  wenn er Ihnen neue Kontakte vorschl\u00e4gt.\\n\\nZeigen Sie Ihrem Netzwerk auch
  Ihren pers\u00f6nlichen Entwicklungsweg.\\n\\nGrafische Elemente steuern die Aufmerksamkeit
  und halten Besucher l\u00e4nger auf Ihrem Profil. Dazu geh\u00f6rt auch das rechteckige
  Titelbild hinter Ihrem Profilbild, das Sie selbst mit Fotos von Ihnen im Einsatz,
  bei Terminen, auf B\u00fchnen oder im B\u00fcro zeigen kann.\\n\\nWichtig: \u00dcberpr\u00fcfen
  Sie auch Ihr Profilbild. Erkennt man es auch auf einem Mobilger\u00e4t? Oft ist
  der Hintergrund zu unruhig oder der Bildausschnitt zu gro\u00df gew\u00e4hlt. Achten
  Sie darauf, dass Ihr Gesicht gut erkennbar ist.\\n\\nF\u00fcgen Sie in Ihrem LinkedIn-Profil
  auch neuere Profilbereiche hinzu, wie eine Kurzzusammenfassung (Bereich \u201eInfo\u201c)
  oder highlighten Sie Ihre letzten Posts oder Aktivit\u00e4ten auf Ihrem Profil (Bereich
  \u201eVorgestellt\u201c).\\n\\nDie Plattform hat eine beispiellose Entwicklung hin
  zu einem Content-Kanal hinter sich. Das Zauberwort auf LinkedIn hei\u00dft Interaktion.
  Geh\u00f6ren Sie nicht zur stummen Mehrheit, sondern gestalten Sie aktiv mit.\\n\\nAktivit\u00e4t
  bedeutet jedenfalls mehr, als nur Ihr Profil auf dem neuesten Stand zu halten. Treten
  Sie in den Dialog mit Ihrem Netzwerk. Liken und kommentieren Sie mehrmals pro Woche.
  So sorgen Sie f\u00fcr mehr Sichtbarkeit und st\u00e4rkere Vernetzung auf der Plattform.\\n\\nTeilen
  Sie spannende Inhalte aus Ihrem Gesch\u00e4ftsalldag. Dabei sind aktuelle Themen
  naturgem\u00e4\u00df am einfachsten: Wie geht es Ihnen mit Homeoffice und neuen
  Business-Situationen? Mit einem Foto und zwei, drei S\u00e4tzen haben Sie schon
  eine gute Grundlage f\u00fcr ein erfolgreiches LinkedIn-Posting. Beziehen Sie Position
  und gestalten Sie dadurch die digitale Diskussion zu einem Thema mit \u2013 das
  ist auf LinkedIn definitiv gew\u00fcnscht. Sprechen Sie \u00fcber Zukunftsfragen,
  die Sie besch\u00e4ftigen. Mit Hashtags und @-Erw\u00e4hnungen von Kolleginnen und
  Kollegen, Partnern oder Kunden verschaffen Sie sich mehr Reichweite und gleichzeitig
  mehr Aufmerksamkeit. Au\u00dferdem dokumentieren Sie Interesse an Ihren Kontakten.\\n\\n\u201eNetzwerkpflege\u201c
  macht den Unterschied: Das bedeutet nicht, wahllos m\u00f6glichst viele Menschen
  in sein Netzwerk aufzunehmen, sondern strategisch vorzugehen. Kl\u00e4ren Sie daher
  stets: F\u00fcr wen sind die Dinge relevant, die ich mitteilen m\u00f6chte? Suchen
  Sie bewusst nach Usern mit Jobpositionen oder Erfahrungen, die Sie f\u00fcr bedeutend
  erachten. Werfen Sie einen Blick auf das Profil der Person. Auf LinkedIn sieht man
  unter \u201eAktivit\u00e4ten\u201c, was sie oder er ver\u00f6ffentlichen, kommentieren
  oder liken m\u00f6chte. Sind diese Themen f\u00fcr Sie interessant, schicken Sie
  eine Kontaktanfrage \u2013 nat\u00fcrlich versehen mit einer kurzen pers\u00f6nlichen
  Botschaft, die nicht generisch ist, sondern sich auf Gemeinsamkeiten oder einen
  besonderen Inhalt bezieht. So etwas wirkt Wunder.\\n\\nDas gilt nat\u00fcrlich auch
  umgekehrt. Sie m\u00fcssen nicht jede Kontaktanfrage annehmen. Qualit\u00e4t vor
  Quantit\u00e4t lautet die Devise.\\n\\nAuf LinkedIn kommuniziert man \u00fcber Business-Themen
  oder Zukunftsvisionen, Management-Ans\u00e4tze und Erfolge.\\n\\nAuf Instagram hingegen
  kann man die Charakteristik der Plattform f\u00fcr Einblicke hinter die Kulissen
  des eigenen Tages nutzen. So lassen sich neue Ansatzpunkte f\u00fcr gemeinsame Themen
  finden. Instagram-Stories sind als Format nur f\u00fcr 24 Stunden sichtbar. Sie
  eignen sich dadurch perfekt als virtuelles Tagebuch. Auf Messen, Konferenzen oder
  bei Events k\u00f6nnen Sie hier mehrmals in kurzer Zeit ein neues Foto oder ein
  kurzes Video als Stimmungsbild hochladen - und mit Ihrem pers\u00f6nlichen Kommentar,
  einem Sticker oder einem Effekt belegen.\\n\\nAchten Sie darauf, dass in Ihrer Instagram-Bio
  auch Ihr voller Name steht - und Sie nicht nur unter einem Pseudonym auftreten.
  So vernetzen Sie auch diese digitale Pr\u00e4senz mit Ihrem Namen.\\n\\nWelche Plattform
  auch f\u00fcr Sie die richtige ist \u2013 regelm\u00e4\u00dfige Aktivit\u00e4t zahlt
  sich aus. Integrieren Sie Ihre Social-Media-Aktivit\u00e4t daher in Ihren Tagesalltag.
  Alle Social-Media-Plattformen sind heutzutage darauf ausgelegt, mobil per App verwendet
  zu werden. Es gilt daher der Grundsatz \u201emobile first\u201c. Ein erstes Durchscrollen
  durch die neuesten Updates empfiehlt sich schon auf dem Weg ins B\u00fcro - mit
  den ersten Likes oder Interaktionen auf Daumendruck. F\u00fcr regelm\u00e4\u00dfiges
  aktives Posten hilft auch ein Serientermin im Kalender. Bekommen Sie Routine, wird
  auch der Zeitaufwand geringer \u2013 und selbst eine kurze Videobotschaft geht Ihnen
  einfacher von der Hand. Halten Sie mit Ihrer Handykamera Termine, Events, Erfolge
  usw. fest. Mit einer gut gef\u00fcllten Kamera-Roll kreiert sich ein LinkedIn-Posting
  gleich doppelt so leicht.\\n\\nLernt man bei einer Veranstaltung \u2013 ob virtuell
  oder analog \u2013 neue Personen kennen, kann man ihnen im Anschluss gem\u00e4\u00df
  den eigenen Relevanzkriterien eine Kontaktanfrage mit pers\u00f6nlicher Botschaft
  oder einen Link zu einer selbst verfassten Nacherle oder einem Eindruck vom Event
  zuschicken. Suchen Sie auf Ihren Plattformen auch nach den Event-Hashtags. Aktive
  User inkludieren diese in ihren Postings. So findet die ganze Community rund um
  das Event auch nachher wieder zusammen. Auch vor Ersterterminen sind das LinkedIn-Profil
  und die weiteren Google-Suchergebnisse des Gegen\u00fcbers wichtig f\u00fcr die
  Terminvorbereitung. Damit zeigen Sie Aufmerksamkeit und Interesse am Gegen\u00fcber,
  noch bevor der Termin \u00fcberhaupt begonnen hat.\\n\\nNetzwerkpflege und digitale
  Positionierung sind ein Marathon, kein Sprint. Umso wichtiger ist es, nicht Interesse
  und Gefallen an diesen Plattformen zu verlieren. Deshalb ist es empfehlenswert,
  auch einmal bewusst abzuschalten, abends das Handy zur Seite zu legen und einfach
  offline zu sein. Damit kommen auch wieder die besten Posting-Ideen, die st\u00e4rksten
  Formulierungen und die besten Gesch\u00e4ftsideen.\\n\\n*Sabine Hoffmann, ist Gr\u00fcnderin
  von ambuzzador. Seit mehr als 16 Jahren begleitet ambuzzador Teams und ihre Projekte
  beim Profiling und der Umsetzung ihrer Zukunftsprojekte. ambuzzador ist ein Team
  von 15 PraktikerInnen aus \u00d6sterreich mit gro\u00dfer Freude an [digitaler]
  Produktentwicklung, neuem F\u00fchren und Arbeiten und Digitalem Agenda Setting
  \u2013 als Mildenker, operative Begleiter und Erlebnisdesigner. Ziel ist es, stets
  den n\u00e4chsten, konkreten Schritt zu identifizieren, um mit minimalem Risiko
  maximal effektiv in die Umsetzung zu gehen. Mit dem R\u00fcckenwind von kritischen
  Endkunden (als Co-Kreatoren) und transparenten, interaktiven Denk- und Arbeitsweisen
  werden konkrete Ergebnisse als Grundlage f\u00fcr Richtungsentscheidungen der Linienorganisation
  geschaffen.\\n\\nambuzzador.com\\n\\nBei aller Professionalit\u00e4t ist das Wichtigste
  am digitalen Netzwerken, dass Sie vor allem Sie selbst bleiben. In Social Media
  steckt das Wort \u201esozial\u201c: Wir reagieren auf unser Gegen\u00fcber zuallererst
  als menschliches Wesen. Auch wenn wir alle geneigt sind, uns in unseren Social-Media-Profilen
  der Au\u00dfenwelt von der bestm\u00f6glichen Seite zu zeigen, w\u00e4hrt Ehrlichkeit
  immer noch am l\u00e4ngsten. Zeigen Sie Pers\u00f6nlichkeit in Ihrem Text, verwenden
  Sie Ich-Botschaften und beziehen Sie Stellung. Das umfasst auch \u00c4u\u00dferungen
  \u00fcber Ihre pers\u00f6nlichen Passiosen (innerhalb und bewusst auch au\u00dferhalb
  des beruflichen Kontexts) in z. B. Ihrer LinkedIn-Beschreibung. Eine Faustregel
  dabei lautet: Geben Sie sich pers\u00f6nlich \u2013 aber nicht privat. Und: Nichts
  geht online, das Sie nicht wirklich in der \u00d6ffentlichkeit haben m\u00f6chten.
  Jede \u00f6ffentlich gepostete Info kann und soll bei einem Termin Thema sein. Ist
  das der Fall, so hat die digitale Pr\u00e4senz auch den Sinn erf\u00fcllt.\\n\\nBUSINESS-ETIKETTE
  F\u00dcR HEUTE\\n\\nTipps von Christine Zach*\\n\\nWer im Business perfekt auftreten
  will, sollte sich zun\u00e4chst \u00fcber seine berufliche Rolle und das daraus
  resultierende Verh\u00e4ltnis zu anderen Akteurinnen und Akteuren im Klaren sein.
  So verhindert man Fehleinsch\u00e4tzungen und unn\u00f6tige Reibungsfl\u00e4chen.\\n\\nDas
  Ego-Echo-Modell von Expertin Christine Zach (sh. Grafik) liefert daf\u00fcr eine
  erste wichtige Orientierung. Folgende Fragen schaffen Klarheit:\\n\\n- In welcher
  (beruflichen) Rolle befinde ich mich?\\n  - Bin ich als Unternehmerin im Austausch
  mit einem Kunden?\\n  - Bin ich F\u00fchrungskraft oder Teil eines Teams?\\n\\n-
  In welchem Kontext bin ich aktiv?\\n  - Wie pr\u00e4sentiert sich die Unternehmenskultur
  im Innen \u2013 wie im Au\u00dfenverh\u00e4ltnis?\\n  - Welche formellen und informellen
  Spielregeln und Verhaltenscodes gelten?\\n\\n- Welche Wirkung m\u00f6chte ich pers\u00f6nlich
  erzielen?\\n  - Bin ich mir meiner Wirkfaktoren bewusst?\\n  - Worauf achte ich
  bei anderen?\\n\\nVor diesem Hintergrund sollten nachfolgende Tipps f\u00fcr das
  eigene Business umgesetzt werden \u2192\\n\\nGUTES BENEHMEN \u2013 AUCH IN PANDEMIEZEITEN\\n\\nGutes
  Benehmen f\u00e4llt besonders dann angenehm auf, wenn jemand in der jeweiligen Situation
  erkennen kann, was angemessen ist. Das hat viel mit Achtsamkeit, H\u00f6flichkeit
  und Einf\u00fchlungsverm\u00f6gen zu tun.\\n\\nGutes Benehmen auch in Pandemiezeiten
  zeigen Sie, wenn Sie:\\n\\n- Sich und andere vor einer Infektionsgefahr mit Covid-19
  sch\u00fctzen, manche unserer Etikette-Regeln und gewohnten Umgangsformen vor\u00fcbergehend
  unterlassen und sich konsequent an beh\u00f6rdliche Verordnungen zum Schutz der
  Bev\u00f6lkerung halten.\\n\\nDIE ANGEMESSENE BEGR\u00dcSSEUNG\\n\\nVor Corona hat
  sie so ausgesehen: Die Hand reicht[t]en \u00c4lteren den J\u00fcngeren, Vorgesetzte
  den Mitarbeitern (wobei diese aufstehen, wenn die F\u00fchrungskraft z. B. einen
  Besuch am Arbeitsplatz abstattet), die Dame dem Herrn (wo es nicht um inner- oder
  au\u00dferbetriebliche Hierarchien geht, z. B. bei Kongressen, bei gesellschaftlichen
  Anl\u00e4ssen mit Begleitung).\\n\\nIn Pandemiezeiten ist der H\u00e4ndedruck zum
  No-Go geworden. Wenn jemand einen H\u00e4ndedruck ablehnt, ist dies nicht unh\u00f6flich,
  sondern ein Zeichen von Eigenverantwortung und R\u00fccksichtnahme, um ein Ansteckungsrisiko
  zu vermeiden.\\n\\nOhne Handschlag gelten folgende Begr\u00fc\u00dfungsregeln: J\u00fcngere
  / Eintretende / Hierarchisch Untergeordnete gr\u00fc\u00dfen zuerst - mit g\u00e4ngigen
  Gru\u00dfformeln, wie z. B. Gr\u00fc\u00df Gott, Guten Tag, Guten Morgen oder Guten
  Abend.\\n\\nDER ERSTE \u201eAUFTRITT\u201c\\n\\nDie erste Begegnung entscheidet
  \u00fcber vieles. Die richtige Vorstellung ist daher besonders wichtig. Die rhetorische
  Frage \u201eDarf ich vorstellen bzw. bekanntmachen?\u201c macht bisher Unbekannte
  aufeinander aufmerksam. Ein Thema sind dabei auch berufliche Rangunterschiede:\\n\\n-
  \u201eDarf ich bekannt machen: Herr Bereichsleiter M\u00fcller / Frau Bereichsleiterin
  Berger / \u201c sagt man etwa, wenn es sich um gleichrangige Personen handelt \u2013
  wobei die Dame den Namen des Herrn zuerst genannt bekommt.\\n\\n- \u201eHerr Generaldirektor
  Moser, darf ich Ihnen unseren Lehrling, Herrn Paul Huber vorstellen? Er ist seit
  einem Monat in der Abteilung und hat sich schon sehr gut eingelebt.\u201c hei\u00dft
  es zum Beispiel, wenn es sich um klare berufliche Hierarchieunterschiede handelt.\\n\\nWeitere
  Informationen zur jeweiligen Person erleichtern es den Beteiligten, sich in kurzer
  Zeit einen Eindruck vom Gegen\u00fcber zu verschaffen. Bitte beachten Sie auch,
  dass Kunden im Regelfall hierarchisch h\u00f6her gewertet werden, als Personen aus
  dem eigenen Unternehmen.\\n\\nBERUFLICHE UMGANGSFORMEN BEACHTEN\\n\\nW\u00e4hrend
  im gesellschaftlichen Leben die Dame in unserer westlichen Kultur seit Jahrhunderten
  im Rang h\u00f6her steht als der Herr, gilt im Berufsleben die berufliche Hierarchie.\\n\\nDas
  bedeutet konkret:\\n\\n- dass die Dame beim Begr\u00fc\u00dfen im Privatleben ihren
  Sitzplatz beibeh\u00e4lt, im Berufsleben aber, unabh\u00e4ngig vom Rang, bei der
  Begr\u00fc\u00dfung aufsteht\\n- dass die Dame im Berufsleben einem Kunden \u2013
  also der rangh\u00f6heren Person \u2013 ihren Respekt signalisiert, indem Sie ihm
  den Vortritt l\u00e4sst oder an seiner linken Seite geht.\\n\\nDIE RICHTIGE ANREDE\\n\\nH\u00e4ufig
  wird in Betrieben mit dem Verweis, dass \u201ees bei uns \u00fcblich ist\u201c,
  bei Neueintretenden rasch auf das \u201eDu\u201c \u00fcbergegangen. Das kann von
  manchen auch als \u201eZwangvereinnahmung\u201c empfunden werden. Deshalb sollten
  H\u00f6flichkeit und Respekt auch beim \u201eDu\u201c unbedingt gewahrt werden.\\n\\nGrunds\u00e4tzlich
  gilt beim \u00dcbergang vom \u201eSie\u201c zum \u201eDu\u201c:\\n\\n- Das \u201eDu\u201c
  wird von der rangh\u00f6heren Person (Faktoren: berufliche Hierarchie, Alter, Dame)
  angeboten.\\n- Ein vorschnelles \u201eDu\u201c in weinseliger Laune oder auf einem
  Berggipfel kann im betrieblichen Umfeld am n\u00e4chsten Arbeitstag diskret ignoriert
  werden. Es ist langfristig hilfreicher, wenn alle Beteiligten ihr Gesicht wahren
  k\u00f6nnen.\\n\\nIM BUSINESS-DRESS\\n\\nVon den Schuhen bis zu den Fingerspitzen
  makellos gepflegt, das ist wichtig. Tolerieren Sie keinerlei Besch\u00e4digungen,
  Flecken oder st\u00f6rende Ger\u00fcche. Dazu geh\u00f6ren \u00fcbrigens auch raumf\u00fcllende
  Parf\u00fcmd\u00fcfte.\\n\\nW\u00e4hrend es f\u00fcr Herren mit dem Anzug ein vielf\u00e4ltig
  einsetzbares und allseits anerkanntes Business-Kleidungsst\u00fcck gibt, ist der
  Bekleidungsspielraum f\u00fcr Frauen im Business ein wenig gr\u00f6\u00dfer.\\n\\nDer
  Wunsch vieler Frauen nach Individualit\u00e4t, Farbe, modischer Informiertheit und
  Abwechslung sollte reflektiert umgesetzt werden:\\n\\n- Angesichts der Kritik an
  der Wegwerfmentalit\u00e4t in der Modebranche ist es empfehlenswert, Outfits ressourcenschonend
  und nachhaltig zu nutzen.\\n- Setzen Sie auf Qualit\u00e4t vor Quantit\u00e4t \u2013
  auf einen guten Schnitt, hochwertige Materialien, umweltfreundliche Reinigung, sowie
  Kombinierbarkeit und Accessoires, die zu Ihrem Unternehmen passen.\\n- Investieren
  Sie etwas Zeit, um herauszufinden, welche Kleidung \u201eetwas f\u00fcr Sie tut\u201c.\\n\\nERFOLGREICH
  BEIM SMALL TALK\\n\\nBei Business-Veranstaltungen lernt man beim lockeren Small
  Talk interessante Pers\u00f6nlichkeiten kennen. Sich unverbindlich auszutauschen,
  Sympathien zu wecken, in Erinnerung zu bleiben, Menschenkenntnis zu sammeln, und
  eine gute Atmosph\u00e4re sowie Vertrauen zu schaffen \u2013 all das unterst\u00fctzt
  Ihren beruflichen Erfolg.\\n\\nWichtig dabei:\\n\\n- Beim ersten Zusammentreffen
  mit noch unbekannten Personen gr\u00fc\u00dft man, nennt seinen vollen Namen und
  ein, zwei weitere f\u00fcr den Anlass relevante Informationen \u2013 wie Unternehmensnamen
  oder Gesch\u00e4ftsgegenstand.\\n- Werden Visitenkarten ausgetauscht, sollten Sie
  die erhaltene Visitenkarte ostentativ genau ansehen und Ihr Gegen\u00fcber bewusst
  wahrnehmen.\\n- Empfehlenswert ist es, folgende Themen beim Small Talk zu vermeiden:
  Parteipolitik, Religion, Tratsch, Ger\u00fcchte oder allzu Pers\u00f6nliches (Probleme,
  Wehwehchen, Finanzen).\\n- Unverf\u00e4ngliche, positive Aussagen eignen sich am
  besten, um Kontakt aufzunehmen oder an Gespr\u00e4che anzukn\u00fcpfen.\\n- Zeigen
  Sie Interesse, Humor, Taktgef\u00fchl \u2013 so gelingt Ihr Small Talk.\\n\\nSmall
  Talk-Kompetenz ist auch wichtig, um bei Gesch\u00e4ftssessen zu vermitteln, dass
  nicht die harten Verhandlungen im Vordergrund stehen, sondern es um pers\u00f6nliche
  Wertsch\u00e4tzung geht.\\n\\nDER KUNDENBESUCH\\n\\nIn erster Linie stehen beim
  Kundenbesuch Qualit\u00e4t und Aussagekraft Ihrer Unterlagen und Pr\u00e4sentationsobjekte
  im Vordergrund. Bei gesch\u00e4ftlichen Erstbesuchen ist von Geschenken abzuraten,
  da strenge Compliance-Regeln deren Annahme meist verbieten.\\n\\nFalls Sie sich
  f\u00fcr kleine \u201eMitbringsel\u201c entscheiden, achten Sie bitte darauf, dass
  Sie alle relevanten Gespr\u00e4chspartner damit bedenken k\u00f6nnen.\\n\\nBEIM
  GESCH\u00c4FTSSESEN\\n\\nSollten Sie bei einem Kundenbesuch zum Essen in ein Restaurant
  eingeladen werden, dann gelten auf dem Weg zum Tisch folgende Regeln:\\n\\n- Geht
  eine Serviceperson voraus, folgt der Gast an zweiter Stelle. Andernfalls geht der
  Gastgeber voraus.\\n- Beim Verlassen des Tisches geht der Gast voraus bis zur Garderobe,
  wo das Servicepersonal oder der Gastgeber beim Anziehen behilflich ist \u2013 in
  Zeiten von Corona ist der MNS-Schutz st\u00e4ndiger Begleiter.\\n\\nDabei geht es
  um Ihren stimmigen Auftritt als \u201eVisitenkarte Ihres Unternehmens\u201c. Mit
  Ihrem professionellen Auftreten sorgen Sie f\u00fcr einen \u00e4u\u00dferlich sichtbaren
  Mehrwert f\u00fcr Ihr Unternehmen. Leben Sie die \u2013 etwa in Leitlinien verankerten
  \u2013 Werte Ihres Unternehmens gerade als Unternehmerin selbst \u2013 und seien
  Sie dabei ein Vorbild f\u00fcr Mitarbeiterinnen und Mitarbeiter. Nutzen Sie gleichzeitig
  jede Gelegenheit, um die Relevanz und Logik bestehender Unternehmenskultur-Leitlinien
  zu pr\u00fcfen. Beachten Sie auch als \u201eChefin\u201c Bekleidungsvorschriften
  oder branchen\u00fcbliche Stilcodes \u2013 und selbstverst\u00e4ndlich auch einen
  angemessenen Umgangston im Unternehmen.\\n\\n\u00dcBER MITBERWERBER REDEN\\n\\nManche
  Menschen meinen, wenn Sie Mitbewerberinnen und Mitbewerber anschwarzen oder sich
  \u00fcber diese lustig machen, w\u00fcrden sie sich bei Kunden und Gesch\u00e4ftspartnern
  interessant machen. Tats\u00e4chlich jedoch gilt: Das Gegenteil ist der Fall.\\n\\nBei
  Business-Gespr\u00e4chen ist das Abwerten von anderen Personen ein No-Go. Stellen
  Sie stattdessen Ihre pers\u00f6nlichen Qualit\u00e4ten in den Vordergrund. Allein
  Ihre Performance soll Kompetenz und Vertrauen signalisieren.\\n\\n* Dr. Christine
  Zach ist promovierte Germanistin und Romanistin mit Aus- und Weiterbildungen u.
  a. in Kulturmanagement, Public Relations und General Management. Sie hat sich nicht
  nur wissenschaftlich mit Umgangsformen und gesellschaftlich bedingten Spielregeln
  besch\u00e4ftigt, sondern ihr Erfahrungswissen aus ihrer rund 35-j\u00e4hrigen Berufslaufbahn
  in F\u00fchrungspositionen in Unternehmen aus Medizin, Kultur und Mobilit\u00e4t
  zu einem eigenen Arbeitsinstrument f\u00fcr Coaching und Training verdichtet: der
  Ego-Echo-Methode. Seit 2012 ist Christine Zach Inhaberin der Unternehmensberatung
  Dr. Zach Consulting. Sie bietet neben pers\u00f6nlichkeitsst\u00e4rkendem Coaching
  auch ressourcenoptimierendes Training, zielorientierte Beratung und l\u00f6sungsfokussierte
  Moderation. Privat seit 1992 an der Seite von Thomas Sch\u00e4fer-Elmayer, verst\u00e4rkt
  sie seit 2012 als Spezialistin f\u00fcr BUSINESS BEHAVIOUR auch das Kompetenzportfolio
  der Tanzschule Elmayer im Bereich Managementtraining.\\n\\nzachconsulting.at\\n\\nunternehmerin.at\"",
  "\"TOAREICH\\nENT-STEIG\\n2001\\n\\nZwanzig \u00bbBestSEELer\u00ab hat er in ebenso
  vielen Jahren Selbstst\u00e4ndigkeit mit seinem Verlag \u00bbEdition Stoareich\u00ab
  unters Volk gebracht \u2013 stets mit dem Aufruf nach Selbsterkenntnis und Selbstbestimmung,
  nach \u00bbEros statt Euros\u00ab und Authentizit\u00e4t. \u201eDas Echte, das Wahre,
  ist mir so wichtig\u201c, sagt Dr. Manfred Greisinger im Brustton der \u00dcberzeugung.\\n\\nSein
  Talent zum Schreiben hat Greisinger schon quasi in den Kinderschuhen als Verantwortlicher
  f\u00fcr die seinerzeitige Sch\u00fclerzeitung am Gymnasium in Waidhofen an der
  Thaya entdeckt. Und w\u00e4re er damals von den Deutschlehrern mehr motiviert als
  m\u00e4\u00dfig beurteilt worden, h\u00e4tte sich der Waldviertler Erfolgsautor
  wohl den kurzen Umweg \u00fcber das Medizinstudium erspart und Publizistik gleich
  direkt angesteuert. Erste Sporen verdiente sich Manfred Greisinger dann beim ORF
  Nieder\u00f6sterreich, wo es der Jungspund damals mit seinem Enthusiasmus wohl ein
  bisschen \u00fcbertrieben hatte - 1990 kam es so zu einem ungewollten, daf\u00fcr
  aber umso wegweisenden, Spurwechsel.\\n\\nReizvolles Waldviertel\\nSo besann sich
  der junge Journalist damals seiner Wurzeln und kehrte zur\u00fcck ins heimatliche
  Allentsteig, von wo aus er mit seinem \u00bbWaldviertler Pressedienst\u00ab bei
  regionalen Unternehmen f\u00fcr gute \u00d6ffentlichkeitsarbeit sorgte. \u201eDamals
  hatte das Waldviertel wahrlich kein gutes Image. Immer wenn ich mich als Waldviertler
  vorstellte, blickten die Leute gleich einmal auf meine Schuhe\u201c, am\u00fcsiert
  sich Greisinger noch heute. \u201eDoch ich sah schon damals das G\u00f6ttliche an
  der Region und wollte auch allen anderen diesen Blick vermitteln.\u201c\\n\\nWomit
  der Startschuss zum allerersten Buchprojekt auch schon gefallen war: \u00bbReizvolles
  Waldviertel\u00ab pr\u00e4sentierte damals die Region in ihrer echten Urspr\u00fcnglichkeit,
  zeigte aber auch, wie aufgeschlossen und modern sie gleichzeitig war. Als das Werk
  druckfertig war, musste noch ein Name f\u00fcr den Verlag gefunden werden. \u201eZum
  Nachdenken ging ich ins Wirtshaus, wo ich ein Gespr\u00e4ch der Bauern mith\u00f6rte.
  Sie waren \u00bbstoareich\u00ab, was bei uns bedeutet, dass sie viele Steine aus
  den Feldern klauben mussten. Das gefiel mir auf Anheb, weil es auch meine Verbundenheit
  der Heimat beschreibt. Auch wenn das schon zu mancher Fehlinterpretation gef\u00fchrt
  hat, wenn manche glauben, dass ich so steinreich bin, dass ich es sogar als Aufschrift
  auf meinem Auto hinausposaunen m\u00f6chte\u201c, am\u00fcsiert sich der Autor.\\n\\nFlirt
  mit dem Leben\\nStolz ist Manfred Greisinger heute vor allem darauf, dass er es
  ganz ohne Subventionen geschafft hat, selbstst\u00e4ndig zu sein. \u201eIch glaube,
  dass es das gr\u00f6\u00dfte Erfolgserlebnis ist, wenn man selbstst\u00e4ndig und
  unabh\u00e4ngig aus sich heraus etwas schafft. Das ist Freiheit pur!\u201c Auch
  wenn dieser Weg nicht immer leicht ist \u2013 letztlich z\u00e4hlt f\u00fcr Greisinger
  vor allem Authentizit\u00e4t, Selbstverwirklichung und Selbstbestimmung, wozu er
  in Werken wie \u00bbPure Relations\u00ab, \u00bbPur\u00ab oder \u00bbIhr ICH als
  unverwechselbare Marke\u00ab auch seine Leserinnen dringend anregt.\\n\\nBurn-in
  statt Burn-out\\nOb als Vortragender, Trainer, PR-Berater oder Autor \u2013 leidenschaftlich
  gibt Greisinger seine \u00dcberzeugungen weiter und ist davon \u00fcberzeugt, dass
  es genau jene Leidenschaft f\u00fcr eine Sache oder ein Thema ist, die letztlich
  zu Zufriedenheit, Gl\u00fcck und pers\u00f6nlichem Erfolg f\u00fchrt. Ein Leben
  lang leidenschaftslos und fremdbestimmt einem Job nachzugehen, ist hingegen oft
  der direkte Weg ins Burn-out.\\n\\nMit den Titeln \u201eAll-ent-steig\u201c und
  \u201eAll-ein-steig\u201c gibt Manfred Greisinger nicht nur viel Anregung zum Nachdenken,
  sondern auch gleich die Anleitung, wie man aus eingefahrenen Lebensmustern aussteigen
  und in echte, gelebte Lebensfreude einsteigen kann und macht Mut zur eigenen Lebensspur.
  Auch die Botschaft seines neuesten Werkes ist klar: Wer erfolgreich sein will, braucht
  Feuer und innere F\u00fchrungsKRAFT. Und genau dieser verdankt es letztlich auch
  Manfred Greisinger selbst, heute am Ufer des idyllischen Allentsteiger Stadtsees
  zu sitzen und sagen zu k\u00f6nnen: \u201eIch bin stolz darauf, selbstst\u00e4ndig
  und frei zu sein!\u201c\\n\\nwww.stoareich.at\"", "\"|                | BLACK12.1
