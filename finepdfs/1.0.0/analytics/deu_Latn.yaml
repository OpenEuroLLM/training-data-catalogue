  "\"Bad Laasphe ist eine idyllisch gelegene Kleinstadt am Rande des Rothaargebirges
  im s\u00fcdlichen Nordrhein-Westfalen mit ca. 13.500 Einwohnern. Hier trifft Tradition
  auf Moderne. Diese Mischung bietet Jung und Alt, Einheimischen und Besuchern vielf\u00e4ltige
  M\u00f6glichkeiten. Die Stadtverwaltung versteht sich dabei als kommunale Dienstleisterin
  und Ansprechpartnerin f\u00fcr die Menschen vor Ort.\\n\\nZur Verst\u00e4rkung unseres
  Teams suchen wir zum n\u00e4chstm\u00f6glichen Zeitpunkt eine*n\\n\\nHausmeister*in
  (m/w/d) f\u00fcr Fl\u00fcchtlings- und Sozialunterk\u00fcnfte\\n\\nEs handelt sich
  um eine unbefristete Vollzeitstelle mit hoher Eigenverantwortung.\\n\\nIhre Aufgabenschwerpunkte:\\n\\n*
  allgemeine Hausmeistert\u00e4tigkeiten in Fl\u00fcchtlings-/ Sozialunterk\u00fcnften\\n*
  Sichtpr\u00fcfung von Kinderspielpl\u00e4tzen sowie Funktionspr\u00fcfungen\\n*
  Reparatur- und Instandhaltungsarbeiten\\n* Koordination und Einweisung von Handwerker-
  und Wartungsfirmen sowie Kontrolle und Abnahme von extern vergebenen Wartungsarbeiten\\n*
  Dokumentation von Pr\u00fcflisten und Wartungsprotokollen\\n* besondere Aufgaben
  nach Zuweisung durch die Leitung des Fachbereichs B\u00fcrgerdienste\\n\\nWir erwarten
  von Ihnen:\\n\\n* abgeschlossene Ausbildung in einem handwerklichen Beruf (bspw.
  Schreiner/ Zimmermann)\\n* einen Pkw-F\u00fchrerschein (Klasse BE)\\n* Durchsetzungsverm\u00f6gen,
  Team- und Kooperationsf\u00e4higkeit\\n* eine selbstst\u00e4ndige und eigenverantwortliche
  Arbeitsweise\\n* ein freundliches, kompetentes und sicheres Auftreten im Umgang
  mit Kunden*innen\\n* Flexibilit\u00e4t und Bereitschaft zur Pr\u00e4senz auch au\u00dferhalb
  der Regelarbeitszeit\\n* erweitertes F\u00fchrungszeugnis\\n\\nWir bieten Ihnen:\\n\\n*
  eine abwechslungsreiche und verantwortungsvolle T\u00e4tigkeit in einem motivierten
  und kollegialen Team\\n* einen zukunftssicheren Arbeitsplatz mit einer Wochenarbeitszeit
  von 39 Stunden\\n* eine Eingruppierung nach den Regelungen des TV\u00f6D\\n* Zusatzversorgung
  f\u00fcr den \u00f6ffentlichen Dienst\\n* betriebliches Gesundheitsmanagement\\n*
  M\u00f6glichkeiten zur Fort- und Weiterbildung\\n\\nDie Stelle ist grunds\u00e4tzlich
  teilzeitf\u00e4hig. Auswahlentscheidungen erfolgen unter Ber\u00fccksichtigung der
  Vorgaben des Landesgleichstellungsgesetzes NRW sowie des Gleichstellungsplans der
  Stadt Bad Laasphe. Chancengleichheit ist die Grundlage unserer Personalarbeit.\\n\\nBewerbungen
  von geeigneten schwerbehinderten und diesen gleichgestellten behinderten Menschen
  i.S. des \u00a7 2 Abs. 3 SGB IX sind ausdr\u00fccklich erw\u00fcnscht.\\n\\nRichten
  Sie bitte Ihre aussagekr\u00e4ftige Bewerbung bis zum 29.10.2021 an\\n\\nStadt Bad
  Laasphe Fachbereich Zentrale Dienste, Sicherheit und Ordnung M\u00fchlenstra\u00dfe
  20 57334 Bad Laasphe oder per E-Mail im pdf-Format (max. 2 MB) an firstname.lastname@example.org\"",
  "\"Die Durchf\u00fchrung einer Unternehmensstrategie gleicht Matthias Kolbusa zufolge
  einer Dschungelexpedition. Und da man sich auf unbekanntes Terrain nicht ohne Landkarte
  und Reisef\u00fchrer begeben sollte, ist es auch in puncto Strategie nicht ratsam,
  einfach drauflos zu marschieren. Mit dem \u201eStrategie-Scout\u201c gibt der Autor
  also einen Wegweiser f\u00fcr strategisches Denken und Handeln an die Hand.\\n\\nDie
  Strategie, gepr\u00e4gt von dynamischen M\u00e4rkten, Kundenanspr\u00fcchen sowie
  globalen wirtschaftlichen und politischen Prozessen, entscheidet \u00fcber die Entwicklung,
  die ein Unternehmen vollzieht. Managementberater Kolbusa hat in den Bereichen Strategie
  und Reorganisation bereits Projekte f\u00fcr Weltkonzerne und f\u00fcr Non-Profit-Organisationen
  umgesetzt und sch\u00f6pft demzufolge aus einem gro\u00dfen Erfahrungspool.\\n\\nAber
  worauf bezieht sich eine Unternehmensstrategie \u00fcberhaupt? Laut dem Autor kann
  es sich um alles handeln: die Einf\u00fchrung einer Innovation, Bestrebungen der
  Internationalisierung, das Erreichen von Kostenquoten etc. So ein erster Impuls
  f\u00fchrt zu einer zun\u00e4chst abstrakten Strategie, die es dann in der Praxis
  umzusetzen gilt.\\n\\nKapitel 1 beschreibt den Beginn einer solchen \u201eReise
  durch den Dschungel\u201c, bei der man zuweilen den Wald vor lauter B\u00e4umen
  nicht sieht. Verfangen in Methoden und Werkzeugen verliert sich die ambitionierte
  Strategie schnell im Dickicht. Der Strategieprozess wird zur Expedition, die Beteiligten
  sind \u201eGef\u00e4hrten\u201c. Im \u201eStrategie-Camp\u201c (Kapitel 2) wird
  gr\u00fcndlich \u00fcberlegt, welcher Pfad einzuschlagen ist, danach folgen Teambildung,
  Einsch\u00e4tzung der Unternehmenssituation etc. Bevor der Strategiedschungel durchquert
  werden kann, bedarf es eines \u00dcberblicks der Gesamtsituation, Kolbusa skizziert
  den Prozess der Orientierung anschaulich in Form einer Landkarte mit unterschiedlichen
  Pfaden, die an verschiedene Stationen, wie etwa dem \u201eKundenpalast\u201c, vorbeif\u00fchren.
  Die n\u00f6tige Expeditionsausr\u00fcstung, sprich die methodischen Werkzeuge, werden
  in Kapitel 4 gew\u00e4hlt. Die folgenden Kapitel beschreiben die tendenziellen Stationen
  auf den Pfaden des Umsetzungsprozesses: strategische Probleme, Verlust des Fokus
  etc. und wie damit umzugehen ist sowie das Strategiekonzept, das anschlie\u00dfend
  im \u201eBasislager\u201c erstellt wird und seine Durchf\u00fchrung.\\n\\nDer Autor
  zieht dabei die Dschungelmetapher als roten Faden durch das Buch. Damit gibt er
  dem komplexen Managementthema eine erfrischende Anschaulichkeit, macht es leicht
  verst\u00e4ndlich und auf alle m\u00f6glichen Gesch\u00e4ftsbereiche anwendbar.\\n\\nKommentare\\n\\nvon
  Corinna Kern\\n\\nhttp://entwickler.de/zonen/portale/psecom,id,102,buch,913,.html\"",
  "\"SPA Tr\u00e4ume\\n\\nentspannen, abschalten, eintauchen...\\n\\nInhalt\\n\\n1.
  Panorama Hallenbad & Whirlpool\\n2. Balance SPA\\n3. Alpin SPA\\n4. K\u00f6rperbehandlungen\\n5.
  Massage\\n\\nSchwimmen Sie in unserem knapp 15 m langen Becken oder genie\u00dfen
  Sie sprudelnd warmes Wasser in unserem gro\u00dfz\u00fcgigen Whirlpool. F\u00fcr
  etwas mehr \\\"Bewegung\\\" sorgt unser Str\u00f6mungskanal.\\n\\nEine gro\u00dfe
  Auswahl an gem\u00fctlichen Einzel- und Doppelliegen sorgt f\u00fcr erholsame Momente
  f\u00fcr die gesamte Familie.\\n\\nUnser Panorama Hallenbad & Whirlpool sind t\u00e4glich
  von 07:00 Uhr bis 21:00 Uhr f\u00fcr Sie ge\u00f6ffnet.\\n\\nSwim in our almost
  15 m long pool or enjoy sparkling warm water in our spacious whirlpool. Our flow
  channel provides a little more \\\"movement\\\".\\n\\nA large selection of cozy
  single and double beds ensures relaxing moments for the whole family.\\n\\nOur panoramic
  indoor pool & whirlpool are open for you every day from 7:00 a.m. to 9:00 p.m.\\n\\nKlares
  Wasser wie frisch aus der Partnachklamm und wohltuende Ruhe wie auf einem einsamen
  Berggipfel: unser Balance SPA im Untergeschoss erwartet Sie mit einer Salzsauna,
  einer Biosauna, einem Dampfbad, einer Finischen Sauna, einer Infrarotkabine und
  einem gro\u00dfz\u00fcgigen Ruhebereich. Unser Balance Wellness steht allen G\u00e4sten
  ab 16 Jahren zur Verf\u00fcgung.\\n\\nDer Balance Wellness ist t\u00e4glich von
  10:00 Uhr bis 21:00 Uhr f\u00fcr Sie ge\u00f6ffnet.\\n\\nClear water like fresh
  from the Partnach gorge, pleasant peace like on a lonely mountain peak. In our modern
  wellness area you have the opportunity to relax in a salt sauna, finish sauna, steam
  sauna, infrared cabin or quiet area. This area is for guests aged 16 years and over.\\n\\nThe
  Balance wellness is open from 10:00 am to 09:00 pm.\\n\\n3. Alpin SPA \u2013 Adults
  only\\n\\n1.Obergeschoss\\n\\nIn unserem Alpin SPA wird es noch exklusiver. Dieser
  garantiert maximale Erholung und Ruhe. Genie\u00dfen Sie die Panoramasauna, Bio
  Sauna, das Kr\u00e4uter-Sanarium oder das Dampfbad. Erfrischen Sie sich am Eisbrunnen
  oder Eiskanal. Ziehen Sie Ihre Bahnen im beheizten Outdoor Infinity-Pool mit atemberaubender
  Aussicht.\\n\\nDer Alpin SPA ist t\u00e4glich von 10:00 Uhr bis 20:00 Uhr ge\u00f6ffnet.\\n\\nDieser
  SPA Bereich ist Erwachsenen ab 18 Jahren vorbehalten. Im SPA Bistro sowie im Shop
  begr\u00fc\u00dfen wir gerne auch Familien mit Kindern.\\n\\nWichtige Information
  zur Begrenzung auf Grund von COVID-19\\n\\nWir bitte um Verst\u00e4ndnis, dass wir
  auf Grund der beh\u00f6rdlichen Auflagen den Zugang zum Alpin SPA begrenzen m\u00fcssen.
  Unsere G\u00e4ste haben bei eventueller Begrenzung der G\u00e4stezahlen oder \u00dcberf\u00fcllung
  keinen Anspruch auf Preisminderung. Die Zimmerbuchung beinhaltet zwar den kostenfreien
  Eintritt, ist jedoch keine Garantie f\u00fcr einen freien Platz.\\n\\nOn our 1st
  floor it becomes even more exclusive: our Alpin SPA for adults from 18 years guarantees
  maximum relaxation and tranquility. Enjoy our panorama sauna, bio sauna, herbal
  samarium, steam sauna. Refresh yourself at the ice fountain and ice steamer and
  take your lanes in the heated Outdoor Infinity Pool with a nice view to the mountains.\\n\\nThe
  Alpin SPA is daily open from 10:00 am to 08:00 pm.\\n\\nThis SPA area is reserved
  for adults 18 years and older. We are happy to welcome families with children in
  the SPA Bistro and in the shop.\\n\\nImportant information about the limitation
  due to COVID-19\\n\\nPlease understand that we have to limit access to the Alpin
  SPA due to official regulations. Our guests are not entitled to a price reduction
  in case of a possible limitation of the number of guests.\\n\\n4. K\u00f6rperbehandlungen\\n\\n1.
  Obergeschoss \u2013 im Premium SPA\\n\\nGanzk\u00f6rperpeeling\\n\\nMeersalz-\u00d6l-Ganzk\u00f6rperpeeling\\nMeersalz
  ist bereits seit Jahren f\u00fcr seine Heilwirkung mit der Kraft verschiedener Mineralien
  und Spurenelemente bekannt. Dank der entz\u00fcndungshemmenden und desinfizierenden
  Eigenschaften verbessert es Hautunreinheiten effektiv. Die grobk\u00f6rnigen Kristalle
  \u00f6ffnen verstopfte Hautporen und befreien sie von Talkablagerungen. Gleichzeitig
  kommt es zu einer gesteigerten Mikrozirkulation der Haut und infolgedessen zur Bildung
  neuer Hautzellen. Das Ergebnis ist ein frisches, vitales und regeneriertes Hautbild.
  Die Haut f\u00fchlt sich zart und jugendlich an.\\n\\n25 min \u20ac 45,00\\n\\nSea
  salt peeling\\nSea salt has been known for years for its healing properties with
  the power of various minerals and trace elements. Thanks to the anti-inflammatory
  and disinfectant properties, it effectively improves blemishes. The coarse-grained
  crystals open clogged skin pores and free them from talc deposits. At the same time,
  there is an increased microcirculation of the skin and, as a result, new skin cells
  are formed. The result is a fresh, vital and regenerated complexion. The skin feels
  tender and youthful.\\n\\n25 min \u20ac 45,00\\n\\nAlpenkr\u00e4uter-\u00d6l-Ganzk\u00f6rperpeeling\\nVerw\u00f6hnen
  Sie sich und Ihre Haut mit dem Duft und Wirkstoffen alpiner Bergwiesenkr\u00e4utern.
  Lavendel, Kamille, Pfefferminze, Ringelblume und Rose wirken durchblutungsf\u00f6rdernd,
  krampfl\u00f6send, entspannend. \u2013nicht f\u00fcr Allergiker geeignet\u2013\\n\\n25
  min \u20ac 45,00\\n\\nAlpine herbal oil peeling\\nPamper yourself and your skin
  with the fragrance and active ingredients of alpine mountain herbs. Lavender, chamomile,
  peppermint, marigold and rose have a circulation-enhancing, antispasmodic, relaxing
  effect. \u2013not suitable for allergy sufferers\u2013\\n\\n25 min \u20ac 45,00\\n\\nMeersalz-\u00d6l-Peeling
  oder Alpenkr\u00e4uter-\u00d6l-Peeling & klassische Massage 25min\\n50 min \u20ac
  89,00\\n\\nMeersalz-\u00d6l-Peeling oder Alpenkr\u00e4uter-\u00d6l-Peeling & klassische
  Massage 50min\\n75 min \u20ac 110,00\\n\\nK\u00f6rperpackung & Anti-Cellulite\\n\\nAlgen-Ganzk\u00f6rperpackung\\nDurch
  das Auftragen der Packung aus Braunalgen auf der Haut wird der Stoffwechsel in der
  Oberfl\u00e4che und in den darunterliegenden Strukturen stark angeregt. Algen sind
  Multitalente. Ihre vielf\u00e4ltige Wirkung sorgt f\u00fcr ein wunderbar straffes
  und glattes Hautbild. Sie wirken au\u00dferdem entschlackend, entw\u00e4ssernd,
  entgiftend und durchblutungsf\u00f6rdernd.\\n\\n25 min \u20ac 45.00\\n\\nAlgae-pack\\nBy
  applying the pack of brown algae to the skin, the metabolism in the surface and
  in the underlying structures is strongly stimulated. Algae are all-rounders. Their
  diverse effects ensure a wonderfully firm and smooth complexion. They also have
  a detoxifying, draining, detoxifying and stimulating blood circulation.\\n\\n25
  min \u20ac 45.00\\n\\nAnti-Cellulite Behandlung (Packung & Anti-Cellulite Massage)\\nGenie\u00dfen
  Sie zu Beginn eine Algen- Ganzk\u00f6rperpackung mit all den wunderbaren Eigenschaften.
  Im Anschluss verw\u00f6hnen wir Sie mit einer Anti-Cellulite Massage.\\n\\n80 min
  \u20ac 110.00\\n\\nAnti-cellulite treatment\\nEnjoy an algae full body pack with
  all the wonderful properties. Afterwards we spoil you with an anti-cellulite massage.\\n\\n80
  min \u20ac 110.00\\n\\n5. Massage\\n\\n1. Obergeschoss \u2013 im Premium SPA\\n\\nKlassische
  Massage\\nBei der klassischen Massage entspannt sich Ihr K\u00f6rper und Geist.
  Warmes Mandel\u00f6l l\u00f6st Verspannungen, lockert die Muskeln und setzt neue
  Energie frei. Der Massagedruck ist individuell auf Ihre W\u00fcnsche abstimmbar.\\n\\n|
  Teilk\u00f6rper 25 min | \u20ac 45,00 |\\n|-------------------|---------|\\n| Ganzk\u00f6rper
  50 min | \u20ac 74,00 |\\n\\nClassical massage\\nWith the classic massage your body
  and mind relax. Warm almond oil releases tension, loosens the muscles and releases
  new energy. The massage pressure can be individually adjusted to your wishes.\\n\\n|
  Partial body 25 min. | \u20ac 45,00 |\\n|----------------------|---------|\\n| Full
  body 50 min.    | \u20ac 74,00 |\\n\\nTiefenentspannungsmassage mit Heupackung\\nSehr
  weiche flie\u00dfende Ganzk\u00f6rpermassage mit alpinem Kr\u00e4uter\u00f6l Latschenkiefer-,
  Pfefferminz-, Rosmarin-, Wacholder-, Heublumen- und Edelwei\u00df\u00f6l entfalten
  den Duft der Alpen auf der Haut. Genie\u00dfen Sie hierzu die heilende Wirkung unserer
  Heus\u00e4ckchen auf Ihrer Haut.\\n\\n| 50 min | \u20ac 86,00 |\\n\\nDeep Relaxation
  Massage\\nVery soft flowing full body massage with alpine herbal oil mountain pine,
  peppermint, rosemary, juniper, hay flower and edelweiss oil unfold the scent of
  the Alps on the skin. Enjoy the healing effect of our hay bags on your skin.\\n\\n|
  50 min | \u20ac 86,00 |\\n\\nZirben Massage\\nTiefenentspannung mit wertvollem Zirben\u00f6l
  und dem aromatisch-holzigen Duft der \u201eK\u00f6nigin der Alpen\u201c \u2013 der
  Zirbenkiefer. Diese intensive Ganzk\u00f6rpermassage beruhigt, spendet Kraft und
  l\u00f6st Verspannungen. Mit einer wohltuenden Zirbenspan-W\u00e4rmepackung. Um
  auch zuhause noch von der entspannenden Zeit zehren zu k\u00f6nnen, bekommen Sie
  das Zirbenkissen mit.\\n\\n| 50 min | \u20ac 98,00 |\\n\\nSwiss stone pine massage\\nDeep
  relaxation with precious Swiss stone pine oil and the aromatic-woody scent the \u201eQueen
  of the Alps\u201c \u2013 the Swiss stone pine. This intensive full body massage
  soothes, gives strength and releases tension. With a soothing Swiss stone pine chip
  heat pack which you can take with you.\\n\\n| 50 min | \u20ac 98,00 |\\n\\nBezaubernde
  Kirschbl\u00fcte\\n\\nDas Sch\u00f6nheitsgeheimnis der Kirschbl\u00fcten liegt verborgen
  in den regenerierenden Wirkkomponenten, welche den zarten Bl\u00fcten innenwohnen.
  Am Beginn der Anwendung steht ein sanftes Peeling mit dem speziellen Massage Handschuh
  aus nat\u00fcrlichem Sisal. Das Ausstreichen mit der angerauten Seite sorgt f\u00fcr
  einen reinigenden, peelenden Effekt. Mit der weichen Seite des Handschuhs wird im
  Anschluss die Haut von den entfernten Hautpartikeln befreit. Den Abschluss bildet
  eine verw\u00f6hnende und mobilisierende Ganzk\u00f6rpermassage mit reichhaltigem
  Kirschbl\u00fcten\u00f6l. Zusammen mit dem zarten Duft sorgt diese f\u00fcr eine
  wundervolle Entspannung und dient der Regeneration und Entspannung der Muskeln und
  Gelenkstrukturen.\\n\\n50 min \u20ac 82,00\\n\\nSisal-Peeling & massage with cherry
  blossom oil\\n\\nThe beauty secret of cherry blossoms lies hidden in the regenerating
  active components inherent in the delicate blossoms. The treatment begins with a
  gentle peeling with the special massage glove made of natural sisal. Stroking with
  the roughened side provides a cleansing, peeling effect. The soft side of the glove
  is then used to remove the removed skin particles.\\n\\nThis is followed by a pampering
  and mobilizing full body massage with rich cherry blossom oil. Together with the
  delicate scent, this provides wonderful relaxation and helps to regenerate and relax
  muscles and joint structures.\\n\\n50 min \u20ac 82,00\\n\\nR\u00fcckenfit & Moor\\n\\nNach
  Sport, Wanderung oder einem stressigen Tag rufen Muskeln und Gelenke nach Entspannung.
  Genie\u00dfen Sie eine angenehme R\u00fcckenmassage mit unserer Ziegenbutter Massagelotion
  mit intensiv pflegenden Inhaltsstoffen wie Jojoba\u00f6l und Allantoin, nat\u00fcrlich
  frei von Parabenen. Mit einem Ziegenbutter Vitalbalsam wird die Haut angeregt und
  gew\u00e4rmt. Zur endg\u00fcltigen Entspannung genie\u00dfen Sie eine Naturmoorpackung
  im Vlieskissen und entspannen bei einer Arm- und Beinmassage.\\n\\n50min \u20ac
  84,00\\n\\nBack fit & moor\\n\\nAfter exercise, hiking or a stressful day, muscles
  and joints call for relaxation. Enjoy a pleasant back massage with our goat butter
  massage lotion with intensely nourishing ingredients such as jojoba oil and allantoin,
  naturally free of parabens. The skin is stimulated and warmed with goat butter vital
  balm. For ultimate relaxation, enjoy a natural bog pack in the fleece cushion and
  relax with an arm and leg massage.\\n\\n50min \u20ac 84,00\\n\\nKombi-Massage\\nR\u00fccken-
  und Fu\u00dfreflex-Wellnessmassage\\nEin wohltuendes Zusammenspiel aus klassischer
  R\u00fcckenmassage und Fu\u00dfreflexzonenmassage mindert Verspannungen in R\u00fccken,
  Schultern und Nacken und aktiviert den gesamten Organismus.\\n\\n50 min. \u20ac
  78,00\\n\\nCombination massage\\nBack and foot reflex wellness massage\\nA soothing
  combination of classic back massage and foot reflexology reduces tension in the
  back, shoulders and neck and activates the entire organism.\\n\\n50 min. \u20ac
  78,00\\n\\nFu\u00dfreflex- Wellnessmassage\\nDie F\u00fc\u00dfe sind mit zahlreichen
  sensiblen Punkten ausgestattet. Aufgrund unserer meist naturfernen Lebensweise funktioniert
  der nat\u00fcrliche Plan, die K\u00f6rpervorg\u00e4nge \u00fcber die Reflexzonen
  der Fu\u00dfsohlen zu stimulieren, nicht mehr. Festes Schuhwerk verhindert beim
  Laufen den direkten Kontakt mit den Unebenheiten der Erde. Die uralte Methode der
  Reflexologie macht sich das nat\u00fcrliche Reflex-Prinzip des K\u00f6rpers zunutze
  und bewirkt ganzheitliche Vitalisierung, Erfrischung und Entspannung. Eine Massage
  der Reflexzonen der F\u00fc\u00dfe wirkt wie ein Lebenselixier.\\n\\n40 min. \u20ac
  69,00\\n\\nReflexology wellness massage\\nThe feet are equipped with numerous sensitive
  points. Due to our mostly nature-distant way of life, the natural plan to stimulate
  the body processes via the reflex zones of the soles of the feet no longer works.
  Sturdy footwear prevents direct contact with the bumps of the earth. The age-old
  method of reflexology takes advantage of the body\u2019s natural reflex principle
  and brings about holistic vitalization, refreshment and relaxation. A massage of
  the reflex zones the feet act like an elixir of life.\\n\\n40 min. \u20ac 69,00\\n\\nAroma\u00f6l-Relaxmassage\\nW\u00e4hlen
  Sie Ihr pers\u00f6nliches \u00d6l, welches je nach Duft zus\u00e4tzlich entspannt
  oder belebt.\\nWenn Sie nach einem aufregenden Tag etwas f\u00fcr Ihr Wohlbefinden
  tun wollen, ist diese Anwendung besonders zu empfehlen.\\n\\n50 min \u20ac 76,00\\n\\nAroma
  oil massage\\nChoose your personal oil, which, depending on the fragrance, will
  additionally relax or invigorate. If you want to do something for your well-being
  after an exciting day, this application is particularly recommended.\\n\\n50 min
  \u20ac 76,00\\n\\nAnti-Stress-Massage\\nBei dieser Behandlung werden einzelne Partien
  wie Schultern, Nacken, Gesicht und Dekollet\u00e9 mit langsamem, rhythmischen Streichbewegungen
  massiert. Durch die verschiedenen Massage-techniken, Gelenklockerungen und hochwertigem
  Lavendel\u00f6l wird zum einen die Muskulatur entspannt und belebt zugleich, und
  zum anderen Stress und \u00c4rger abgebaut. Die Entspannungsmassage steigert die
  Vitalit\u00e4t und das allgemeine Wohlbefinden, versetzt den K\u00f6rper in einen
  wunderbaren Ruhezustand und hat eine erholsame sowie entspannende Wirkung auf das
  gesamte Nervensystem.\\n\\n45 min \u20ac 69,00\\n\\nRelaxing massage\\nThis treatment
  involves massaging individual areas such as the shoulders, neck, face and d\u00e9collet\u00e9
  with slow, rhythmic stroking movements. The various massage techniques relax and
  revitalize the muscles on the one hand and reduce stress and anger on the other.
  The relaxation massage increases vitality and general well-being, puts the body
  in a wonderful state of rest and has a restful and relaxing effect on the entire
  nervous system.\\n\\n45 min \u20ac 69,00\\n\\nHot-Stone-Massage\\nDiese Anwendung
  ist eine Kombination aus wohltuender Wellnessmassage und einer angenehmen Durchw\u00e4rmung
  durch die aufgelegten Hot-Stones:\\nWarme Basaltsteine gleiten \u00fcber Ihre Haut.
  Die W\u00e4rme geht bis tief in die Muskulatur und kann somit Verspannungen l\u00f6sen.\\n\\n80
  min \u20ac 112,00\\n\\nHot stone massage\\nThis treatment is a combination of a
  pleasant wellness massage and a pleasant warming through the applied hot stones:\\nWarm
  basalt stones glide over your skin. The warmth goes deep into the muscles and can
  thus release tension.\\n\\n80 min \u20ac 112,00\\n\\nLomi Lomi Nui\\n\\nDie Lomi
  Lomi Nui Massage hat Ihren Ursprung in Hawaii. Dort ist diese sehr intime Massage
  seit jeher ein fester Bestandteil der Naturheilkunde. Sie dient nicht nur der k\u00f6rperlichen
  Entspannung, sondern wird zur L\u00f6sung von Blockaden, welche sich im physischen
  K\u00f6rper manifestiert haben, genutzt. Das Wort \\\"Lomi\\\" bedeutet \\\"dr\u00fccken/Kneten/reiben\\\",
  aber auch \\\"mit den samtten Pfoten einer Katze ber\u00fchren\\\". Die Hawaiianer
  unterstreichen die Bedeutung des Wortes durch seine Verdopplung. Der Zusatz \\\"Nui\\\"
  bedeutet \\\"einzigartig/wichtig/gro\u00dfartig\\\" und soll die Besonderheit dieser
  Massage hervorheben.\\n\\nDie Lomi-Lomi-Nui-Massage stand in Hawaii urspr\u00fcnglich
  in Verbindung mit einem rituellen Tanz; sie hei\u00dft von daher auch Tempeltanz-Massage.
  Lomi Lomi Nui wurde eingesetzt, um Menschen auf einen Neuanfang im Leben vorzubereiten.
  Sie war und ist ein reinigendes Ritual, das der Befreiung von belastenden Energien
  dient. Massiert wurden auch diejenigen, die eine besondere Aufgabe vor sich hatten,
  um ihren K\u00f6rper und Geist mit Energien aufzuladen.\\n\\nIn den alten hawaiianischen
  Familientraditionen haben sich unterschiedliche Lomi-Massagetchniken herausgebildet.
  Sie alle haben eines gemeinsam: die Achtung vor der Sch\u00f6pfung und die Verbindung
  zu ihr. Darin eingeschlossen ist die tiefe Beziehung zu allem Lebendigen, die Anerkennung
  der zu behandelnden Person und die Freude an dem durchgef\u00fchrten Ritual.\\n\\n90
  min. \u20ac 129,00\\n\\nLomi Lomi Nui\\n\\nThe Lomi Lomi Nui massage has its origins
  in Hawaii. This very intimate massage has always been an integral part of naturopathy
  there. It is not only used for physical relaxation, it is also used to resolve blockages
  that have manifested in the physical body. The word \\\"Lomi\\\" means \\\"press
  / knead / rub\\\", but also \\\"touch with the velvet paws of a cat\\\". The Hawaiians
  emphasize the meaning of the word by duplicating it. The addition \\\"Nui\\\" means
  \\\"unique / important / great\\\" and is intended to emphasize the specialty of
  this massage.\\n\\nThe Lomi Lomi Nui massage was originally connected to a ritual
  dance in Hawaii; hence it is also called temple dance massage. Lomi Lomi Nui was
  used to prepare people for a new beginning in life. It was and is a cleansing ritual
  that serves to free you from stressful energies. Those who had a special task to
  charge their body and mind with energies were also massaged.\\n\\nDifferent Lomi
  massage techniques have developed in the old Hawaiian family traditions. They all
  have one thing in common: respect for and connection to creation. This includes
  the deep relationship with all living things, the recognition of the person to be
  treated and the joy of the ritual carried out.\\n\\n90 min. \u20ac 129,00\\n\\nAbhyanga
  Massage\\n\\nDie Abhyanga Massage, in der westlichen Welt als \u201edie gro\u00dfe
  Ein\u00f6lung\u201c bezeichnet, ist eine Form der ayurvedischen Massage, die ihren
  Ursprung in Indien und Sri Lanka hat. Abhyanga ist eine Ganzk\u00f6rper-\u00d6l-Massage.
  Ziel ist die Harmonisierung der K\u00f6rperenergien nach dem ayurvedischen Verst\u00e4ndnis.\\n\\nNach
  einer individuellen Beratung w\u00e4hlt die Therapeutin oder der Therapeut \u00d6le
  und Kr\u00e4uter passend zu ihren Bed\u00fcrfnissen aus. Diese orientieren sich
  an der jeweiligen Konstitution der zu behandelnden Person. Die Konstitution wird
  dabei an den drei ayurvedischen Energieprinzipien, genannt Doshas, festgemacht:
  Vitta, Pitta und Kapha. Dabei setzt sich die Verfassung jeder Person aus einer unterschiedlichen
  Verteilung der drei Doshas zusammen, wobei meist eins oder zwei von diesen dominieren.\\n\\nDie
  \u00d6le bestehen meist aus einem Basis\u00f6l wie dem Sesam\u00f6l, das mit Kr\u00e4uterausz\u00fcgen
  versetzt ist. W\u00e4hrend der Abhyanga Massage wird eine gro\u00dfe Menge des in
  der Regel erw\u00e4rmten \u00d6ls auf dem ganzen K\u00f6rper, inklusive Kopfhaut,
  Ohrl\u00e4ppchen und F\u00fc\u00dfe mit allen Zehen, verstrichen. Die im Massage-\u00d6l
  enthaltenen Kr\u00e4uterausz\u00fcge werden in den K\u00f6rper eingebracht und sollen
  nach der Lehre des Ayurveda die Gesundheit f\u00f6rdern.\\n\\nDie Wirkung der Abhyanga
  Massage l\u00e4sst sich nach den Aussagen der ayurvedischen Lehre in drei verschiedene
  Bereiche aufteilen: Zum einen soll sie wie eine klassische Massage zu einer physischen
  Entspannung und Lockerung des K\u00f6rpers f\u00fchren. Des Weiteren wirkt sich
  die Behandlung positiv auf das psychische Wohlbefinden aus. Innere Barrieren k\u00f6nnen
  gelockert und \u201egel\u00f6st\u201c werden. Eine dritte Dimension der Abhyanga
  Massage ist ihr \u201emedizinischer\u201c Einsatz, dabei geht es zentral um das
  Einbringen der Kr\u00e4uterextrakte im Massage\u00f6l in den K\u00f6rper. Insgesamt
  hat die Abhyanga Anwendung verschiedene positive Wirkungen auf den K\u00f6rper.\\n\\n100
  min. \u20ac 139,00\\n\\nAbhyanga massage\\n\\nThe Abhyanga massage, known in the
  western world as \u201cthe great oiling\u201d: is a form of Ayurvedic massage that
  has its origins in India and Sri Lanka. Abhyanga is a full-body oil massage. The
  aim is the harmonization of body energies according to the Ayurvedic understanding.
  After an individual consultation, the therapist selects oils and herbs to suit your
  needs. These are based on the constitution of the person to be treated. The constitution
  is tied to the three Ayurvedic energy principles, called doshas: Vitta, Pitta and
  Kapha. The constitution of each person is made up of a different distribution of
  the three doshas, with one or two of these usually dominating. The oils usually
  consist of a base oil such as sesame oil, which is mixed with herbal extracts. During
  the Abhyanga massage, a large amount of the usually heated oil is spread over the
  entire body, including the scalp, earlobes and feet with all toes. The herbal extracts
  contained in the massage oil are introduced into the body and, according to Ayurveda,
  are supposed to promote health. According to Ayurvedic teachings, the effect of
  the Abhyanga massage can be divided into three different areas: On the one hand,
  like a classic massage, it should lead to physical relaxation and loosening of the
  body. The treatment also has a positive effect on psychological well-being. Inner
  barriers can be loosened and \\\"solved\\\". A third dimension of the Abhyanga massage
  is its \u201cmedical\u201d use, which is about the introduction of the herbal extracts
  in the massage oil into the body. Overall, the Abhyanga application has various
  positive effects on the body.\\n\\n100 min. \u20ac 139,00\\n\\nAlle unsere Massagebehandlungen
  sind f\u00fcr Personen ab 18 Jahren geeignet. Krankheiten und starke Muskelverspannungen
  sind Aufgabe eines medizinischen Masseurs. Medizinische Massagen erfolgen auf Anordnung
  des Arztes und werden im Zuge der kosmetischen Anwendungen eines Wellness-Therapeuten
  nicht behandelt. Bei folgenden Kontraindikationen k\u00f6nnen wir leider keine Massagebehandlungen
  durchf\u00fchren:\\n\\n**Allgemein:**\\n- Schwangerschaft\\n- Thrombose, Durchblutungsst\u00f6rungen\\n-
  Herzst\u00f6rungen\\n- tiefe Krampfadern\\n- Infektionen, Wunden, Tumore\\n- Ekzeme,
  Pilze, Furunkel\\n- Band-, Sehnenruptur\\n- Muskelverletzungen (Risse, Entz\u00fcndungen)\\n-
  Chirurgische Eingriffe (innerhalb des letzten Jahres)\\n- Infekt, Fieber\\n- Krebs\\n-
  Bandscheibenvorfall [je nach Ausma\u00df]\\n\\n**Aroma\u00f6l:**\\n- bei hom\u00f6opathischer
  Behandlung\\n- bei Epileptikern\\n- bei Allergikern/Asthmatiker\\n- Schwangerschaft\\n\\n**Fu\u00dfreflexzonenwellnessmassage:**\\n-
  Entz\u00fcndung Lymphgef\u00e4\u00dfe\\n- Fieber, Krampfadern, Venenentz\u00fcndung\\n-
  Pilz, Tumore, Leberflecke\\n- Depressionen, Psychosen, Schizophrenie\\n- Epileptiker,
  Spastiker, Multiple Sklerose\\n- Rheuma, Muskel-, B\u00e4nderverletzung\\n- Schwangerschaft\\n-
  Bandscheibenvorfall [je nach Ausma\u00df]\\n\\n*All our massages are for guests
  over 18 years. Illnesses and severe muscle tension are task of a medical masseur.
  Medical massages are carried out on the doctor\u2019s order and are not treated
  in the course of the cosmetic treatments of a wellness therapist. Unfortunately,
  we cannot perform massage treatments for the following contraindications:*\\n\\n**General:**\\n-
  pregnancy\\n- Thrombosis, circulatory disorders\\n- heart problems\\n- deep varicose
  veins\\n- infections, wounds, tumors\\n- Eczema, fungus, boils\\n- Ligament and
  tendon rupture\\n- muscle injuries (cracks, inflammation)\\n- Surgical interventions\\n-
  (within the last year)\\n- Infection, fever\\n- cancer\\n- disc prolapse (depending
  on the extent)\\n\\n**Aromatic oil:**\\n- in homeopathic treatment\\n- in epileptics,
  for allergy sufferers / asthmatics\\n- pregnancy\\n\\n**Foot reflex zone wellness
  massage:**\\n- Inflammation of the lymphatic vessels\\n- Fever, varicose veins,
  phlebitis\\n- Fungus, tumors, liver spots\\n- Depression, psychosis, schizophrenia\\n-
  Epileptics, spasticity, multiple sclerosis\\n- Rheumatism, muscle, ligament injury\\n-
  pregnancy\\n- Disc prolapse (depending on the extent)\\n\\nStornierungsbedingungen:\\nSollten
