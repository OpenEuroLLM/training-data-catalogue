  \u0441\u0438 \u043f\u043e\u0447\u0438\u0432\u0430\u043c\u0435.\\n\\n\u2013 \u0428\u0435\u0433\u0443\u0432\u0430\u0448
  \u0441\u0435, \u043d\u0430\u043b\u0438? \u0418\u043c\u0430\u043c \u043e\u0433\u0440\u043e\u043c\u0435\u043d
  \u0441\u043f\u0438\u0441\u044a\u043a \u0441 \u0440\u0430\u0431\u043e\u0442\u0430,
