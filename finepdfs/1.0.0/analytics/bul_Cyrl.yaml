  \u043f\u0430\u0440\u0438\u0442\u0435 \u0432 \u0434\u0436\u043e\u0431\u0430 \u0441\u0438.
  \u2013 \u0429\u0435 \u043f\u0440\u0438\u0431\u0435\u0440\u0430 \u0442\u0435\u0437\u0438
  \u043d\u0435\u0449\u0430 \u0438 \u0441\u043b\u0435\u0434 \u0442\u043e\u0432\u0430
  \u0449\u0435 \u043d\u0430\u043c\u0435\u0440\u044f \u043a\u043e\u043d\u0444\u0438\u0442\u044e\u0440\u0430.\\n\u2013
  \u041c\u043e\u043b\u044f \u0442\u0435, \u043a\u043e\u0433\u0430\u0442\u043e \u0441\u043b\u0438\u0437\u0430\u0448
  \u043d\u0430\u0434\u043e\u043b\u0443, \u0441\u043b\u043e\u0436\u0438 \u0434\u043e\u043f\u044a\u043b\u043d\u0438\u0442\u0435\u043b\u043d\u0438
  \u0448\u0430\u043c\u043f\u043e\u0430\u043d\u0438 \u0438 \u0434\u0443\u0448-\u0433\u0435\u043b
