  \u0442\u043e\u0432\u0430 \u0435 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u043e,
  \u043e\u0431\u0435\u0449\u0430\u0432\u0430\u043c!\\n\\n\u2013 \u0414\u043e\u0431\u0440\u0435,
