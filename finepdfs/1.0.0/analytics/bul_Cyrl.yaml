  \u2013 \u0438\u0437\u0432\u0438\u043a\u0430 \u043c\u0430\u0439\u043a\u0430 \u045d,
  \u0434\u043e\u043a\u0430\u0442\u043e \u043e\u0431\u0440\u044a\u0449\u0430\u0448\u0435
  \u043a\u043e\u043b\u0430\u0442\u0430.\\n\\n\u2013 \u0427\u0430\u043e! \u2013 \u0438\u0437\u0432\u0438\u043a\u0430\u0445\u0430
  \u0432 \u0435\u0434\u0438\u043d \u0433\u043b\u0430\u0441 \u041b\u0438\u043b\u0438
  \u0438 \u0410\u043d\u0438.\\n\\n\u2013 \u041a\u043e\u044f \u0435 \u0433\u043e\u0441\u043f\u043e\u0436\u0430
  \u041a\u0438\u043b\u0431\u0440\u0430\u0439\u0442? \u2013 \u043f\u043e\u043f\u0438\u0442\u0430
