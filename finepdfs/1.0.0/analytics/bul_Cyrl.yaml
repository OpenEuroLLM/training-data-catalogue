  \u0432 \u0440\u0430\u0431\u043e\u0442\u0430! \u0415\u0442\u043e \u0432\u0437\u0435\u043c\u0438,
  \u0442\u043e\u0432\u0430 \u0435 \u0437\u0430 \u0442\u0435\u0431 \u2013 \u043c\u0430\u0439\u043a\u0430
  \u045d \u045d \u043f\u043e\u0434\u0430\u0434\u0435 \u0431\u0430\u043d\u043a\u043d\u043e\u0442\u0430
  \u043e\u0442 \u043f\u0435\u0442 \u043b\u0438\u0440\u0438, \u043a\u043e\u044f\u0442\u043e
  \u0438\u0437\u043c\u044a\u043a\u043d\u0430 \u043e\u0442 \u0431\u0443\u0440\u043a\u0430\u043d\u0430\u0442\u0430
  \u043d\u0430 \u043f\u0435\u0440\u0432\u0430\u0437\u0430.\\n\u2013 \u0411\u043b\u0430\u0433\u043e\u0434\u0430\u0440\u044f,
