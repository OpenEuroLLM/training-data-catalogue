  \u0412 \u0421\u0418\u0421\u0422\u0415\u041c\u0410\u0422\u0410 \u041d\u0410 \u041f\u041e\u0417\u0415\u041c\u041b\u0415\u041d\u0418\u0422\u0415
  \u041e\u0422\u041d\u041e\u0428\u0415\u041d\u0418\u042f LAND USE IN THE SYSTEM OF
  THE LAND RELATIONSHIPS\\n\\nPLAMENA YOVCHEVSKA\\n\\nINSTITUT\u0415  OF AGRICULTURAL
  ECONOMICS \u2013 AGRICULTURAL ACADEMY, SOFIA\\n\\nAbstract: The aim of the article
  is to marc some tendencies in the development of the land use and the land relationships
  in Bulgaria. In Bulgaria the transformation in the 90s in was affected by political
  reasons. \\\"Natural restitution\\\" was chosen for the agriculture. The fragmentation
  of the land ownership proceeded further. This process negatively affected the model
  of the land use and resulted in the bipolar agriculture. Many small farms are taking
  care of a small part of the agricultural land. On the contrary small number of big
  farms are cultivating extremely big areas. Structural changes with unbalanced character
  are occurring in agriculture after joining of the EU 27. The share of the crops
  and technical cultures is expanding at the expense of the growing of fruits, vegetables
  and livestock. They are supported us sensitive branches in the framework of the
  CAP 2014+. This problem is a consequence of the Bulgarian land use and reflects
  the undeveloped relationships typical for the Bulgarian agriculture.\\n\\nKey words:
  transformation, land use, land relationships, CAP 2014+\\n\\n\u0421\u044a\u0432\u044a\u0440\u0448\u0435\u043d\u043e\u0442\u043e
