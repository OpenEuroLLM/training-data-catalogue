  \u044f \u0431\u043b\u0438\u0437\u043d\u0435 \u043f\u043e \u043b\u0438\u0446\u0435\u0442\u043e,
  \u0430 \u041b\u0438\u043b\u0438 \u044f \u043f\u0440\u0435\u0433\u044a\u0440\u043d\u0430
  \u0438 \u0438\u0437\u0432\u0438\u043a\u0430:\\n\\n\u2013 \u0410\u043d\u0438, \u0442\u043e\u043b\u043a\u043e\u0432\u0430
  \u0441\u0435 \u0440\u0430\u0434\u0432\u0430\u043c, \u0447\u0435 \u0434\u043e\u0439\u0434\u0435!\\n\\n\u2013
  \u0410\u0437 \u0441\u044a\u0449\u043e! \u041d\u0435 \u0441\u043c\u0435 \u0441\u0435
