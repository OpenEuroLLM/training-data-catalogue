  \u0441 \u0443\u0441\u043c\u0438\u0432\u043a\u0430. \u2013 \u041a\u0443\u0447\u0435\u0442\u0430\u0442\u0430
  \u0441\u0430 \u0441\u0442\u0440\u0430\u0445\u043e\u043c\u043d\u0438!\\n\\n\u2013
