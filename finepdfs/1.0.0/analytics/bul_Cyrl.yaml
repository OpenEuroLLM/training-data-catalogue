  \u0447\u0430\u043a \u043d\u0430 \u0442\u0440\u0435\u0442\u0438\u044f \u043f\u044a\u0442!\\n\\n\u041a\u043e\u0433\u0430\u0442\u043e
  \u0410\u043d\u0438 \u0441\u0435 \u0432\u044a\u0440\u043d\u0430, \u0447\u0443 \u043c\u0430\u0439\u043a\u0430
