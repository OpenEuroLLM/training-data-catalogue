  \u043c\u0430\u0439\u043a\u0430 \u045d. \u2013 \u0425\u0430\u0439\u0434\u0435, \u0434\u0435\u0439\u0441\u0442\u0432\u0430\u0439!\\n\\n\u0421\u043b\u0435\u0434
  \u043f\u043e\u043b\u043e\u0432\u0438\u043d \u0447\u0430\u0441 \u043c\u0430\u0439\u043a\u0430
