  Vije\u0107a (EZ) 1185/03.\u201c.\\n\\n\u010clanak 31.\\n\\nU \u010dlanku 85. stavku
  1. to\u010dki 25. iza rije\u010di: \u201eUredbe Vije\u0107a (EZ) br. 1224/2009\u201c
  dodaju se rije\u010di: \u201ei \u010dlanku 46. stavku 1. ovoga Zakona\u201c.\\n\\nU
  to\u010dki 26. iza rije\u010di: \u201eUredbe Vije\u0107a (EZ) br. 1224/2009\u201c
  dodaju se rije\u010di: \u201ei \u010dlanku 46. stavku 2. ovoga Zakona\u201c.\\n\\nIza
  to\u010dka 52. dodaje se nova to\u010dka 53. koja glasi:\\n\\n\u201e53. obavlja
  ribolov uz upotrebu pridnenih povla\u010dnih alata na mjestima ozna\u010denim u
  slu\u017ebenim pomorskim publikacijama na kojima se nalaze podmorski kabeli i cjevovodi,
  kao i hidroarheolo\u0161ka nalazi\u0161ta i nalazi, protivno \u010dlanku 14. stavku
  1. ovoga Zakona\u201c.\\n\\nDosada\u0161nje to\u010dke 53. do 59. postaju to\u010dke
  54. do 60.\\n\\nDosada\u0161nja to\u010dka 60., koja postaje to\u010dka 61., mijenja
  se i glasi:\\n\\n\u201e61. u malom obalnom ribolovu ulovi plavoperajnu tunu (Thunnus
  thynnus), igluna (Xiphias gladius), iglana (Tetrapturus belone), dugokrilu tunu
  (Thunnus alalunga), jegulju (Anguilla anguilla), velike rakove te sakuplja bodljika\u0161e,
  korali\u0107e i spu\u017eve protivno \u010dlanku 22. stavku 4. ovoga Zakona\u201c.\\n\\nDosada\u0161nje
  to\u010dke 61. do 66. postaju to\u010dke 62. do 67.\\n\\nDosada\u0161nja to\u010dka
  67. koja postaje to\u010dka 68. mijenja se i glasi:\\n\\n\u201e68. ulovi plavoperajnu
  tunu (Thunnus thynnus), igluna (Xiphias gladius), iglana (Tetrapturus belone), dugokrilu
  tunu (Thunnus alalunga), jegulju (Anguilla anguilla), velike rakove te sakuplja
  bodljika\u0161e,\\n\\nspu\u017eve i koralje u \u0161portskom i rekreacijskom ribolovu
  protivno \u010dlanku 32. stavku 1. ovoga Zakona\\\".\\n\\nDosada\u0161nje to\u010dke
  68. i 69. postaju to\u010dke 69. i 70.\\n\\nDosada\u0161nja to\u010dka 70. koja
  postaje to\u010dka 71. mijenja se i glasi:\\n\\n\u201e71. obavlja ribolov u znanstvene
  svrhe i ribolov u nastavne svrhe bez rje\u0161enja protivno \u010dlanku 35. stavku
  1. ovoga Zakona\u201c.\\n\\nDosada\u0161nje to\u010dke 71. do 86. postaju to\u010dke
  72. do 87.\\n\\nPRIJELAZNE I ZAVR\u0160NE ODREDBE\\n\\n\u010clanak 32.\\n\\n(1)
  Ministar \u0107e donijeti pravilnik iz \u010dlanka 13. stavka 7. koji je dodan \u010dlankom
  4. ovoga Zakona, u roku od godinu dana od dana stupanja na snagu ovoga Zakona.\\n\\n(2)
  Ministar \u0107e donijeti odluku iz \u010dlanka 42. stavka 1. koji je izmijenjen
  \u010dlankom 17. ovoga Zakona u roku od \u0161est mjeseci od dana stupanja na snagu
  odluke iz \u010dlanka 83. stavka 1. Zakona o pomorskom dobru i morskim lukama (\u201eNarodne
  novine\u201c, broj 83/23.).\\n\\n\u010clanak 33.\\n\\n(1) Danom stupanja na snagu
  odluke iz \u010dlanka 42. stavka 1. koji je izmijenjen \u010dlankom 17. ovoga Zakona
  prestaje va\u017eiti Naredba o popisu iskrcajnih mjesta za iskrcaj ulova s ribarskih
  plovila koja obavljaju gospodarski ribolov na moru (\u201eNarodne novine\u201c,
  br. 53/22., 112/22. i 39/23.).\\n\\n(2) Danom stupanja na snagu odluke iz \u010dlanka
  83. stavka 1. Zakona o pomorskom dobru i morskim lukama (\u201eNarodne novine\u201c,
  broj 83/23.) prestaje va\u017eiti Odluka o popisu iskrcajnih mjesta za ribarska
  plovila koja obavljaju gospodarski ribolov na moru (\u201eNarodne novine\u201c,
  br. 10/20., 145/20., 112/21. i 135/22.).\\n\\n\u010clanak 34.\\n\\nPostupci zapo\u010deti
  do stupanja na snagu ovoga Zakona dovr\u0161it \u0107e se po odredbama Zakona o
  morskom ribarstvu (\u201eNarodne novine\u201c, br. 62/17., 130/17., 14/19. i 30/23.).\\n\\n\u010clanak
  35.\\n\\nOvaj Zakon stupa na snagu osmoga dana od dana objave u \u201eNarodnim novinama\u201c.\\n\\nOBRAZLO\u017dENJE\\n\\nUz
  \u010dlanak 1.\\n\\nOvim se \u010dlankom mijenja \u010dlanak 2. va\u017ee\u0107eg
  Zakona na na\u010din da se a\u017eurira popis pravne ste\u010devine koju je potrebno
  preuzeti ovom Zakonom.\\n\\nUz \u010dlanak 2.\\n\\nOvim \u010dlankom je u \u010dlanak
  3. va\u017ee\u0107eg Zakona dodan pojam NNN ribolova s obzirom na to da se pojam
  navodi u prekr\u0161ajnim odredbama, koje se odnose na kr\u0161enje odredbi Uredbe
  1005/2008. Takoder je dodan i pojam vanjske oznake \u010dije je dodjeljivanje u
  nadle\u017enosti ministarstva nadle\u017enog za pitanja pomorstva, a radi se o obvezi
  kojoj podlije\u017eu ribarska plovila prema Uredbi (EU) 404/2011.\\n\\nUz \u010dlanak
  3.\\n\\nOvim \u010dlankom uvodi se rodna ravnopravnost u va\u017ee\u0107i Zakon.\\n\\nUz
  \u010dlanak 4.\\n\\nOvim \u010dlankom ure\u0111uje se mogu\u0107nost dodjele kvote
  putem javnog natje\u010daja za vrste koje podlije\u017eu upravljanju temeljem dopu\u0161tenih
  koli\u010dina ulova.\\n\\nUz \u010dlanak 5.\\n\\nOvim \u010dlankom detaljnije se
  ure\u0111uje \u010dlanak 14. va\u017ee\u0107eg Zakona na na\u010din da se jasno
  propisuje iznimka kojom se omogu\u0107uje obavljanje znanstvenog ribolova, ribolova
  u nastavne svrhe te skidanje obra\u0161taja \u017eivih \u0161koljka\u0161a sa uzgojnih
  instalacija uzgajali\u0161ta radi daljnjeg uzgoja u dijelovima mora koja su ozna\u010dena
  kao uzgajali\u0161ta i u propisanom radijusu oko njih.\\n\\nUz \u010dlanak 6.\\n\\nOvim
  se \u010dlankom dopunjuje \u010dlanak 15. va\u017ee\u0107eg Zakona na na\u010din
  da se propisuje obveza ozna\u010davanja plovila za obavljanje gospodarskog ribolova
  vanjskom oznakom.\\n\\nUz \u010dlanak 7.\\n\\nOvim se \u010dlankom mijenja \u010dlanak
  18. stavak 4. va\u017ee\u0107eg Zakona na na\u010din da se u podstavku 1. bri\u0161e
  suvi\u0161na rije\u010d te se pro\u0161iruje na na\u010din da se uvjeti za pohranjivanje
  povlastice po slu\u017ebenoj du\u017enosti primjenjuju i na situacije kada plovilo
  nema vanjsku oznaku i kad je izbrisano iz Upisnika brodova. Podstavak 4. istog stavka
  se uskladuje s \u010dlankom 80. stavkom 3. Prijedloga zakona. Istovremeno, pro\u0161irenjem
  stavka 11. istog \u010dlanka, dobivanjem vanjske oznake plovila omogu\u0107i\u0107e
  \u0107e se podizanje pohranjene povlastice za gospodarski ribolov na moru i njezino
  dalnje kori\u0161tenje.\\n\\nUz \u010dlanak 8.\\n\\nOvim \u010dlankom ispravlja
  se u \u010dlanku 19. va\u017ee\u0107eg Zakona pogre\u0161no pozivanje u podstavku
  3. te se bri\u0161e podstavak 4. radi dopune \u010dlanka 69. Zakona.\\n\\nUz \u010dlanak
  9.\\n\\nOvim \u010dlankom se bri\u0161e pozivanje na \u010dlanak 19. stavak 1. podstavak
  4., koji je brisan \u010dlankom 8.\\n\\nUz \u010dlanak 10.\\n\\nOvim \u010dlankom
  su u \u010dlanku 21. va\u017ee\u0107eg Zakona uvjeti za izdavanje potvrde za gospodarski
  ribolov uskladieni sa Zakonom o visokom obrazovanju i znanstvenoj djelatnosti (\u201eNarodne
  novine\u201c, broj 119/22.).\\n\\nUz \u010dlanak 11.\\n\\nOvim se \u010dlankom u
  \u010dlanku 22. stavku 4. va\u017ee\u0107eg Zakona dopunjuje popis vrsta koje nije
  dozvoljeno loviti ili sakupljati u malom obalnom ribolovu izme\u0111u ostalog, radi
  uskla\u0111ivanja s pravnom ste\u010devinom Europske unije i preporukama regionalnih
  organizacija za upravljanje ribarstvom kao \u0161to su ICCAT (Me\u0111unarodna organizacija
  za za\u0161titu atlantskih tuna) i GFCM (Me\u0111unarodna organizacija za ribarstvo
  Sredozemlja).\\n\\nUz \u010dlanak 12.\\n\\nOvim se \u010dlankom, u \u010dlanku 24.
  va\u017ee\u0107eg Zakona, brisanjem podstavka 4. uvjeti za ukidanje povlastice za
  mali obalni ribolov u najve\u0107oj mogu\u0107oj mjeri uskladuju s uvjetima za ukidanje
  povlastice za gospodarski ribolov. Podstavak 5. bri\u0161e se radi dopune \u010dlanka
  69. Zakona.\\n\\nUz \u010dlanak 13.\\n\\nOvim se \u010dlankom ispravlja pozivanje
  na pogre\u0161ni stavak u \u010dlanku 28. stavku 4. va\u017ee\u0107eg Zakona.\\n\\nUz
  \u010dlanak 14.\\n\\nOvim se \u010dlankom u \u010dlanku 32. stavku 1. va\u017ee\u0107eg
  Zakona dopunjuje popis vrsta koje nije dozvoljeno loviti ili sakupljati u sklopu
  sportskog i rekreacijskog ribolova, izme\u0111u ostalog, radi uskla\u0111ivanja
  s pravnom ste\u010devinom Europske unije i preporukama regionalnih organizacija
  za upravljanje ribarstvom kao \u0161to su ICCAT (Me\u0111unarodna organizacija za
  za\u0161titu atlantskih tuna) i GFCM (Me\u0111unarodna organizacija za ribarstvo
  Sredozemlja).\\n\\nUz \u010dlanak 15.\\n\\nOvim \u010dlankom se u \u010dlanku 33.
  stavku 6. va\u017ee\u0107eg Zakona bri\u0161u rije\u010di: \u201ei minimalne referentne
  veli\u010dine za o\u010duvanje\u201c, s obzirom na to da su minimalne referentne
  veli\u010dine za sve oblike ribolova odre\u0111ene propisom donesenim na temelju
  \u010dlanka 12. stavka 1. to\u010dke 3. va\u017ee\u0107eg Zakona.\\n\\nUz \u010dlanak
  16.\\n\\nOvim \u010dlankom mijenja se \u010dlanak 35. va\u017ee\u0107eg Zakona kojim
  je ure\u0111en ribolov u znanstvene i znanstveno-nastavne svrhe i ribolov za potrebe
  akvarija. Naime, podru\u010dje znanstvenog ribolova potrebno je razraditi i uskladiti
  s \u010dlankom 25. Uredbe (EU) 2019/1241. Na ovaj na\u010din dozvoljava se mogu\u0107nost
  da ovla\u0161tenici povlastice za gospodarski ribolov na moru ulov ostvaren ribarskim
  plovilom u znanstvene svrhe, na temelju rje\u0161enja, stave u promet, skladi\u0161te,
  izlo\u017ee ili ponude na prodaju, bez obzira je li ribolov obavljen u skladu s
  tehni\u010dkim mjerama kako su one propisane Uredbom (EU)\\n\\n2019/1241, ako su
  ispunjeni uvjeti propisani ovim \u010dlankom. Kategorija ribolova za potrebe akvarija
  se izostavlja jer se obnova ribljeg fonda u akvarijima mo\u017ee vr\u0161iti kroz
  izravnu suradnju akvarija sa znanstvenim institucijama i prvim kupcima.\\n\\n**Uz
  \u010dlanak 17.**\\n\\nOvim \u010dlankom mijenja se \u010dlanak 42. va\u017ee\u0107eg
  Zakona na na\u010din da se propisuje dono\u0161enje odluke ministra kojom se odre\u0111uju
  iskrcajna mjesta i segmenti flote za koje je iskrcaj dozvoljen na odre\u0111enim
  iskrcajnim mjestima. Iskrcajna mjesta iz odluke odre\u0111uju se u skladu s popisom
  iskrcajnih mjesta koje donosi ministar nadle\u017ean za pomorstvo na temelju zakona
  kojim se ure\u0111uje pomorsko dobro i morske luke. Takoder ovim se \u010dlankom
  lu\u010dka kapetanija obvezuje obavijestiti Ribarski monitoring centar u roku od
  12 sati u situacijama kada zbog sigurnosti plovidbe odredi mjesto iskrcaja izvan
  iskrcajnog mjesta.\\n\\n**Uz \u010dlanak 18.**\\n\\nOvim se \u010dlankom mijenja
  \u010dlanak 55. stavak 1. postavak 2. va\u017ee\u0107eg Zakon radi uskla\u0111ivanja
  s novim Smjernicama o dr\u017eavnim potporama u sektoru ribarstva i akvakulture
  (SL C107, 23.3.2023.).\\n\\n**Uz \u010dlanak 19.**\\n\\nOvim \u010dlankom se \u010dlanak
  61. stavak 1. to\u010dka 7. va\u017ee\u0107eg Zakona dopunjuje na na\u010din da
  se inspektorima Dr\u017eavnog inspektorata daje nadle\u017enost u kontrolama zajedni\u010dkih
  tr\u017ei\u0161nih standarda za konzervirane srdele i zajedni\u010dkih tr\u017ei\u0161nih
  normi za konzerviranu tunu i palamidu, kako bi se osigurala provedba odredbi Uredbe
  Vije\u0107a (EEZ) br. 2136/89 od 21. lipnja 1989. o utvr\u0111ivanju zajedni\u010dkih
  tr\u017ei\u0161nih standarda za konzervirane srdele i Uredbe Vije\u0107a (EEZ) br.
  1536/92 od 9. lipnja 1992. godine o utvr\u0111ivanju zajedni\u010dkih tr\u017ei\u0161nih
  normi za konzerviranu tunu i palamidu.\\n\\n**Uz \u010dlanak 20.**\\n\\nOvim \u010dlankom
  se u \u010dlanku 61.a va\u017ee\u0107eg Zakona dodaju ovlasti ovla\u0161tenih osoba
  \u010duvarima prirode kada provode neposredni nadzor.\\n\\n**Uz \u010dlanak 21.**\\n\\nOvim
  \u010dlankom su u \u010dlanku 62. va\u017ee\u0107eg Zakona uvjeti za obavljanje
  poslova vi\u0161eg inspektora i inspektora uskladeni sa Zakonom o visokom obrazovanju
  i znanstvenoj djelatnosti.\\n\\n**Uz \u010dlanak 22.**\\n\\nOvim se \u010dlankom
  dopunjuje \u010dlanak 69. stavak 1. va\u017ee\u0107eg Zakona na na\u010din da se
  pro\u0161ire ovlasti inspektora kod izricanja privremenog ili trajnog oduzimanja
  povlastice za gospodarski i mali obalni ribolov odnosno kod izricanja privremene
  ili trajne zabrane obavljanja ribolova zapovjedniku plovila. Takoder, u slu\u010daju
  postojanja sumnje na po\u010dinjenje te\u0161kih prekr\u0161aja iz \u010dlanaka
  77. i 78. va\u017ee\u0107eg Zakona inspektorima se propisuje ovlast da poduzmu neposredne
  izvr\u0161ne mjere kao \u0161to su dono\u0161enje usmenog rje\u0161enja tijekom
  inspekcijskog nadzora i provo\u0111enja istrage.\\n\\nUz \u010dlanak 23.\\n\\nOvim
  \u010dlankom dopunjuje se \u010dlanak 70. va\u017ee\u0107eg Zakona na na\u010din
  da se inspektore i ovla\u0161tene osobe se obvezuju da utvrde imovinsku korist ostvarenu
  kaznenim djelom ili prekr\u0161ajem te da pokrenu postupak oduzimanja takve ostvarene
  imovinske koristi.\\n\\nUz \u010dlanak 24.\\n\\nOvim \u010dlankom se inspektore
  Dr\u017eavnog inspektorata, kojima su dodana ovla\u0161tenja iz \u010dlanka 69.
  te su ovla\u0161teni donositi rje\u0161enja te ih se dodaje i u ovaj \u010dlanak,
  te se isti odnosi i na rje\u0161enja koja su donijeli inspektori Dr\u017eavnog inspektorata.\\n\\nUz
  \u010dlanak 25.\\n\\nOvim \u010dlankom se mijenjaju visine iznosa nov\u010danih
  kazni za sve prekr\u0161aje iz \u010dlanka 77. va\u017ee\u0107eg Zakona koji se
  ispunjenjem kriterija smatraju te\u0161kim prekr\u0161ajima prema Uredbi 1005/2008
  i Uredbi 1224/2009 te se visina nov\u010danih kazni uskla\u0111uje s odredbama tih
  uredbi koje propisuju da nov\u010dane kazne za te\u0161ke prekr\u0161aje trebaju
  biti razmjerne, odvra\u0107aju\u0107e i u\u010dinkovite.\\n\\nUz \u010dlanak 26.\\n\\nOvim
  \u010dlankom se mijenjaju visine iznosa nov\u010danih kazni za sve prekr\u0161aje
  iz \u010dlanka 78. va\u017ee\u0107eg Zakona koji se ispunjenjem kriterija smatraju
  te\u0161kim prekr\u0161ajima prema Uredbi 1005/2008 i Uredbi 1224/2009 te se visina
  nov\u010danih kazni uskla\u0111uje sa odredbama tih uredbi koje propisuju da nov\u010dane
  kazne za te\u0161ke prekr\u0161aje trebaju biti razmjerne, odvra\u0107aju\u0107e
  i u\u010dinkovite.\\nDodaju se i dvije nove prekr\u0161ajne odredbe, kako bi va\u017ee\u0107i
  Zakon bio uskla\u0111en s \u010dlankom 42. Uredbe 1005/2008.\\n\\nUz \u010dlanak
  27.\\n\\nOvim \u010dlankom se mijenja \u010dlanak 79. stavak 1. va\u017ee\u0107eg
  Zakona u vezi dodjele negativnih prekr\u0161ajnih bodova, te se dopunjuje na na\u010din
  da se za dva nova te\u0161ka prekr\u0161aja dodana \u010dlankom 21. Prijedloga zakona
  odre\u0111uje broj negativnih prekr\u0161ajnih bodova, koji se dodjeljuju kao pravna
  posljedica osude za navedene prekr\u0161aje ovla\u0161teniku povlastice i zapovjedniku
  plovila.\\n\\nUz \u010dlanak 28.\\n\\nOvim \u010dlankom ispravlja se izri\u010daj
  u \u010dlanku 80. va\u017ee\u0107eg Zakona s obzirom na to da se povlastica za gospodarski
  ribolov oduzima vlasniku plovila, a ne ovla\u0161teniku povlastice kako je navedeno
  u va\u017ee\u0107em Zakonu.\\n\\nUz \u010dlanak 29.\\n\\nOvim \u010dlankom u prekr\u0161ajne
  odredbe \u010dlanka 83. va\u017ee\u0107eg Zakona dodaje se novi prekr\u0161aj, kako
  bi se osigurala provedba \u010dlanka 39. stavka 1. Uredbe Vije\u0107a (EZ) br. 1005/2008.\\n\\nUz
  \u010dlanak 30.\\n\\nOvim \u010dlankom se prekr\u0161ajne odredbe \u010dlanka 84.
  va\u017ee\u0107eg Zakona dopunjuju kako bi se osigurala provedba Uredbe Vije\u0107a
  (EEZ) br. 2136/89, Uredbe Vije\u0107a (EEZ) br. 1536/92, Uredba Vije\u0107a (EZ)
  1185/03 i Uredbe (EU) br. 2023/2053.\\n\\nUz \u010dlanak 31.\\n\\nOvim \u010dlankom
  se dopunjuje \u010dlanak 85. stavak 1. va\u017ee\u0107eg Zakona na na\u010din da
  se u odredbe to\u010daka 25. i 26. predmetnog stavka doda pozivanje na \u010dlanak
  46. stavke 1. i 2. va\u017ee\u0107eg Zakona, radi preciznijeg odre\u0111ivanja prekr\u0161aja
  u pogledu na\u010dina ozna\u010davanja oznakama serija ili lotova te uvjeta za dokaz
  sljedivosti.\\n\\nNadalje, propisuje se prekr\u0161ajna odgovornost za kr\u0161enje
  odredbe \u010dlanka 14. stavka 1. va\u017ee\u0107eg Zakona dodavanjem nove to\u010dke
  53. te se prekr\u0161ajna odredba iz to\u010dke 70. uskla\u0111uje sa izmijenjenim
  \u010dlankom 35. stavkom 1. va\u017ee\u0107eg Zakona.\\n\\nTako\u0111er, zabranjuje
  se ulov dodatnih ribljih vrsta (dugokrile tune (*Thunnus alalunga*), jegulje (*Anguilla
  anguilla*) i bodljika\u0161a), koje je zabranjeno loviti ili sakupljati u gospodarskom
  te \u0161portskom i rekreacijskom ribolovu, dodane \u010dlankom 9. Prijedloga zakona.\\n\\nUz
  \u010dlanke 32. do 35.\\n\\nOvim \u010dlancima, propisuje u se rok za dono\u0161enje
  provedbenog propisa, postupanje u zapo\u010detim postupcima do stupanja na snagu
  ovog Zakona te stupanje na snagu Zakona.\\n\\nTEKST ODREDBI VA\u017dE\u0106EG ZAKONA
  KOJE SE MIJENJAJU, \\nODNOSNO DOPUNJUJU\\n\\n\u010clanak 2.\\n\\nOvim Zakonom se
  ure\u0111uje provedba sljede\u0107ih akata:\\n\\n- Uredbe (EU) br. 1380/2013 Europskog
  parlamenta i Vije\u0107a od 11. prosinca 2013. o zajedni\u010dkoj ribarstvenoj politici,
  izmjeni uredaba Vije\u0107a (EZ) br. 1954/2003 i (EZ) br. 1224/2009 i stavljanju
  izvan snage uredaba (EZ) br. 2371/2002 i (EZ) br. 639/2004 i Odluke Vije\u0107a
  2004/585/EZ (SL L 354, 28. 12. 2013.), kako je posljednji put izmijenjena Uredbom
  (EU) 2015/812 Europskog parlamenta i Vije\u0107a od 20. svibnja 2015. o izmjeni
  uredaba Vije\u0107a (EZ) br. 850/98, (EZ) br. 2187/2005, (EZ) br. 1967/2006, (EZ)
  br. 1098/2007, (EZ) br. 254/2002, (EZ) br. 2347/2002 i (EZ) br. 1224/2009 te uredaba
  (EU) br. 1379/2013 i (EU) br. 1380/2013 Europskog parlamenta i Vije\u0107a u pogledu
  obveze iskrcavanja i o stavljanju izvan snage Uredbe Vije\u0107a (EZ) br. 1434/98
  (SL L 133, 29. 5. 2015.; u daljnjem tekstu: Uredba (EU) br. 1380/2013)\\n\\n- Uredbe
  Vije\u0107a (EZ) br. 1967/2006 od 21. prosinca 2006. o mjerama upravljanja za odr\u017eivo
