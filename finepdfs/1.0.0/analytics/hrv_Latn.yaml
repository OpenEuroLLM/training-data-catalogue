  je ovog rada bila ispitati mogu\u0107nost primjene kruto-teku\u0107e ekstrakcije
  i su\u0161enja raspr\u0161ivanjem za dobivanje praha aronije iz pra\u0161ine nastale
  pri proizvodnji \u010daja u filter vre\u0107icama. Pri proizvodnji teku\u0107eg
  ekstrakta aronije upotrebljena je ekstrakcija potpomognuta ultrazvukom, dok je maltodekstrin
  kori\u0161ten kao inkapsuliraju\u0107e sredstvo prilikom su\u0161enja. Ispitan je
  utjecaj ulazne temperature su\u0161enja, vrste i masenog udjela maltodekstrina na
  u\u010dinkovitost procesa i svojstva dobivenih prahova. Tako\u0111er su ispitana
  i fizi\u010dka i kemijska svojstva dobivenih prahova. Ustanovljeno je da prah aronije
  dobiven primjenom ulazne temperature su\u0161enja od 140 \u00b0C i inkapsulacijom
  s40% maltodekstrina dekstroznog ekvivalenta od 19,7 ima najbolja svojstva. Pove\u0107anjem
  masenog udjela maltodekstrina smanjili su se udjel vlage, stupanj higroskopnosti
  i udjel bioaktivnih spojeva, a pove\u0107ali indeks topljivosti u vodi i veli\u010dina
  \u010destica praha. Pove\u0107anjem dekstroznog ekvivalenta maltodekstrina pove\u0107ala
  se higroskopnost praha i indeks topljivosti u vodi, a porastom ulazne temperature
  su\u0161enja smanjio se udjel vlage u prahu aronije.\\n\\nKlju\u010dne rije\u010di:
