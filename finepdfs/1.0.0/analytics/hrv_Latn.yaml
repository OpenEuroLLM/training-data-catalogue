  2006.), kako je posljednji put izmijenjena Uredbom (EU) 2015/812 Europskog parlamenta
  i Vije\u0107a od 20. svibnja 2015. o izmjeni uredaba Vije\u0107a (EZ) br. 850/98,
  (EZ) br. 2187/2005, (EZ) br. 1967/2006, (EZ) br. 1098/2007, (EZ) br. 254/2002, (EZ)
  br. 2347/2002 i (EZ) br. 1224/2009 te uredaba (EU) br. 1379/2013 i (EU) br. 1380/2013
  Europskog parlamenta i Vije\u0107a u pogledu obveze iskrcavanja i o stavljanju izvan
