  \u00abBAN JELA\u010cI\u0106\u00bb\\n\\nPRAVILNIK O NASTUPANJU ZA GOLF KLUB BAN JELA\u010cI\u0106
  NA NACIONALNIM NATJECANJIMA\\n\\nZapre\u0161i\u0107, 18.02.2016.\\n\\nOvim pravilnikom
  odre\u0111eni su kriteriji prema kojima \u0107e se vr\u0161iti odabir natjecatelja,
  tj. reprezentativaca Golf kluba Ban Jela\u010di\u0107 na nacionalnim turnirima i
  liga\u0161kim natjecanjima:\\n\\n1. Natjecatelj mora biti aktivni \u010dlan Kluba.
  Aktivno \u010dlanstvo podrazumijeva redovno pla\u0107anje \u010dlanarine.\\n2. Rezultati
  postignuti prethodne godine na natjecanjima lokalne i nacionalne razine.\\na. Hrvatska
  golf liga\\nb. Otvoreno prvenstvo hrvatske\\nc. Razna natjecanja\\n\\nIgra\u010di
  koji ne ispunjavaju kriterij 2. mogu se kvalificirati za nastupanje po ispunjavanju
  sljede\u0107ih kriterija:\\n\\n3. Svi zainteresirani igra\u010di moraju odigrati
  minimalno dvije (2) kvalifikacijske runde golfa po sljede\u0107im uvjetima:\\na.
  Golf teren mora imati 18 rupa\\nb. Minimalan broj igra\u010da u flajtu je tri (3)\\nc.
