  na minimalno tri (3) klupska treninga prije po\u010detka natjecanja.\"", "\"Na temelju
  \u010dlanka 19. to\u010dke 10. Statuta Grada Osijeka (Slu\u017ebeni glasnik Grada
  Osijeka br. 6/01, 3/03, 1A/05, 8/05, 2/09, 13/09, 9/13, 12/17, 2/18, 2/20, 3/20,
  4/21 i 5/21-pro\u010di\u0161\u0107eni tekst) i \u010dlanka 13. stavka 2. Kodeksa
  pona\u0161anja vije\u0107nika Gradskoga vije\u0107a Grada Osijeka (Slu\u017ebeni
  glasnik Grada Osijeka br. 7/22) Gradsko vije\u0107e Grada Osijeka na 11. sjednici
  odr\u017eanoj 20. rujna 2022., donijelo je\\n\\nRJE\u0160E NJ E\\n\\no imenovanju
  predsjednika i \u010dlanova Vije\u0107a \u010dasti\\n\\nI.\\n\\nU Vije\u0107e \u010dasti
  imenuju se:\\n\\n1. Ante Novokmet, za predsjednika\\n2. Ronald Tomakovi\u0107\\n3.
  Tomislav Mati\u0107\\n4. Borko Baraban i\\n5. Lidija Neznanovi\u0107, za \u010dlanove.\\n\\nII.\\n\\nOvo
  rje\u0161enje stupa na snagu danom dono\u0161enja.\\n\\nKLASA: 029-01/22-01/1\\n\\nURBROJ:
  2158-1-01-22-6\\n\\nOsijek, 20. rujna 2022.\\n\\nPREDSJEDNIK GRADSKOGA VIJE\u0106A
  Vladimir Ham, dipl.oec., v.r.\"", "\"IZVJE\u0160\u0106E O PROVEDBI AKCIJSKOG PLANA
  ZA PROVEDBU INICIJATIVE PARTNERSTVO ZA OTVORENU VLAST U REPUBLICI HRVATSKOJ ZA RAZDOBLJE
  2012. DO 2013.\\n\\nZagreb, rujan 2013.\\n\\nSADR\u017dAJ\\n\\nI. Uvod\\n\\nPartnerstvo
  za otvorenu vlast je multilateralna inicijativa \u010diji je cilj osigurati konkretan
  napredak na podru\u010dju transparentnosti i otvorenosti rada tijela javne vlasti,
  uklju\u010divanja i osna\u017eivanja gra\u0111ana i civilnoga dru\u0161tva, borbe
  protiv korupcije te kori\u0161tenja novih tehnologija za pobolj\u0161anje kvalitete
  usluga koje javna uprava pru\u017ea gra\u0111anima.\\n\\nKao \u010dlanica globalne
  inicijative Partnerstvo za otvorenu vlast, Republika Hrvatska je iskazala spremnost
  podupirati na\u010dela transparentnosti, borbe protiv korupcije, osna\u017eivanja
  gra\u0111ana i kori\u0161tenja prednosti novih tehnologija kako bi tijela javne
  vlasti na svim razinama bila u\u010dinkovitija i odgovornija, te se stvorili preduvjeti
  za u\u010dinkovitije i inovativnije pru\u017eanje javnih usluga odnosno upravljanje
  javnim resursima.\\n\\nVrijednosti na kojima po\u010divaju napori zemalja \u010dlanica
  Partnerstva za otvorenu vlast u cijelosti su komplementarne vrijednostima na \u010dije
  se po\u0161tivanje Republika Hrvatska obvezala jo\u0161 u tijeku postupka pridru\u017eivanja
  Europskoj uniji, kroz vi\u0161egodi\u0161nje napore ulo\u017eene u ispunjavanje
  zahtjeva reformi i prilagodbi na svim podru\u010djima dru\u0161tvenog, politi\u010dkog
  i gospodarskog djelovanja.\\n\\nPridru\u017eivanjem novoj globalnoj inicijativi
  Partnerstvo za otvorenu vlast u rujnu 2011., Republika Hrvatska je preuzela obvezu
  izraditi nacionalni akcijski plan te ga predstaviti ostalim dr\u017eavama sudionicama
  inicijative na godi\u0161njem sastanku u travnju 2012. Akcijskim planom, usvojenim
  na sjednici Vlade Republike Hrvatske 5. travnja 2012. godine, predlo\u017eene mjere
  i provedbene aktivnosti svrstane su u \u010detiri poglavlja: i.) fiskalna transparentnost,
  ii.) pristup informacijama, iii.) kori\u0161tenje informacijskih tehnologija te
  iv.) sudjelovanje gra\u0111ana i civilnog dru\u0161tva.\\n\\nVe\u0107 iz samog odabira
  klju\u010dnih podru\u010dja Akcijskog plana vidljivo je da Akcijski plan odra\u017eava
  opredjeljenje Republike Hrvatske za ispunjavanje \u010detiri temeljna na\u010dela
  inicijative Partnerstvo za otvorenu vlast: transparentnost, sudjelovanje gra\u0111ana,
  odgovornost, te tehnologija i inovacije, dok je to dodatno potvr\u0111eno odabirom
  samih mjera i provedbenih aktivnosti na koje se Vlada RH obvezala Akcijskim planom.
  Naime, odabranim mjerama (ukupno njih 9), odnosno provedbenim aktivnostima (njih
  33) Vlada RH se obvezala pobolj\u0161ati sadr\u017eaj i transparentnost prora\u010dunskih
  dokumenata te ih u\u010diniti dostupnijima i razumljivijima gra\u0111anima, uz uspostavljanje
  sustava sudioni\u010dke izrade i pra\u0107enja provedbe dr\u017eavnog i lokalnih
  prora\u010duna; pobolj\u0161ati transparentnost poslovanja trgova\u010dkih dru\u0161tva
  od posebnog dr\u017eavnog interesa; pobolj\u0161ati zakonski okvir za ostvarivanje
  prava na pristup informacijama; pobolj\u0161ati dostupnost podataka o tro\u0161enju
  javnih resursa i sadr\u017eaju relevantnih registara; osigurati transparentnost
  rada tijela javne vlasti u funkciji ostvarenja prava gra\u0111ana; te pobolj\u0161ati
  praksu savjetovanja sa zainteresiranom javno\u0161\u0107u u dono\u0161enju novih
  zakona, drugih propisa i akata.\\n\\nIzabranim mjerama, odnosno aktivnostima tako\u0111er
  se adresira i zajedni\u010dke izazove inicijative Partnerstvo za otvorenu vlast,
  posebice unaprje\u0111enje javnih usluga i djelotvornije upravljanje javnim resursima,
  prvenstveno kroz uspostavu sredi\u0161njeg dr\u017eavnog portala (sustava gov.hr)
  koji \u0107e objediniti informacije i sadr\u017eaje svih internetskih stranica tijela
  dr\u017eavne uprave, te omogu\u0107iti siguran i povjerljiv pristup\\n\\nosobnim
  podacima gra\u0111ana i elektroni\u010dkim uslugama u razli\u010ditim informacijskim
  sustavima javne uprave.\\n\\nU ovom izvje\u0161\u0107u dan je pregled provedbe inicijative
  Partnerstvo za otvorenu vlast u prvih ne\u0161to vi\u0161e od godinu dana njezine
  provedbe. Naime, budu\u0107i da je Vlada Republike Hrvatske formalno zapo\u010dela
  s provedbom inicijative u travnju 2012., prema hodogramu inicijative Partnerstvo
  za otvorenu vlast, prva godina provedbe tekla je od 1. srpnja 2012. do 30. lipnja
  2013., pri \u010demu je Republika Hrvatska obvezna javno objaviti izvje\u0161\u0107e
  o provedbi inicijative u prvoj godini provedbe do 30. rujna 2013. Me\u0111utim,
  Vlada Republike Hrvatske zapo\u010dela je provedbu pojedinih aktivnosti ve\u0107
  u travnju 2012., a u izvje\u0161\u0107e su uvr\u0161teni i podaci o pojedinim aktivnostima
  koje su provedene i nakon lipnja 2013. Naime, Akcijski plan obuhva\u0107a period
  \u010ditave 2013. godine tako da su \u010dak i pojedini rokovi predvi\u0111eni Akcijskim
  planom nakon perioda za koji je Vlada Republike Hrvatske u ovom trenutku du\u017ena
  izvijestiti te \u0107e o provedbi tih aktivnosti biti izvje\u0161teno u izvje\u0161\u0107u
  za naredni period provedbe inicijative.\\n\\nII. Kratki pregled procesa izrade Akcijskog
  plana\\n\\nRepublika Hrvatska poslala je krajem kolovoza 2011. slu\u017ebeno pismo
  namjere sudjelovanja u Partnerstvu za otvorenu vlast i time je preuzela obvezu izraditi
  nacionalni akcijski plan te ga predstaviti ostalim dr\u017eavama sudionicama inicijative
  na godi\u0161njem sastanku u travnju 2012.\\n\\nU proces izrade prijedloga Akcijskog
  plana za provedbu inicijative u Republici Hrvatskoj bila je uklju\u010dena \u0161ira
  zainteresirana javnost, kroz organizirane javne rasprave, a provedeno je i internetsko
  savjetovanje.\\n\\nPrva javna rasprava odr\u017eana je 14. rujna 2011., u organizaciji
  Ureda predsjednika RH, Ureda za udruge Vlade RH i Veleposlanstva SAD-a u RH i okupila
  je 180 sudionika (predstavnika dr\u017eavnih tijela, organizacija civilnog dru\u0161tva,
  akademske zajednice, medija i diplomatskog zbora).\\n\\nJavno savjetovanje o prioritetnim
  pitanjima Akcijskog plana za provedbu inicijative Partnerstvo za otvorenu vlast
  u RH odr\u017eano je 31. sije\u010dnja 2012., u organizaciji Ureda za udruge Vlade
  RH , MVEP-a, Veleposlanstva SAD-a u RH, uz potporu Europske unije kroz program IPA
  2009, a na njemu je bilo prisutno 100 sudionika (predstavnika dr\u017eavnih tijela,
  organizacija civilnog dru\u0161tva, akademske zajednice, medija i diplomatskog zbora).\\n\\nZavr\u0161no
  javno savjetovanje je odr\u017eano 26. o\u017eujka, u organizaciji Ureda za udruge
  Vlade RH i ono je okupilo 40 sudionika (predstavnika dr\u017eavnih tijela, organizacija
  civilnog dru\u0161tva i akademske zajednice).\\n\\nInternetsko savjetovanje o prioritetnim
  pitanjima koja \u0107e biti pokrivena Akcijskim planom bilo je otvoreno od 27. sije\u010dnja
  do 13. velja\u010de 2012.\\n\\nSvi komentari i sugestije prikupljene tijekom savjetovanja
  sa zainteresiranom javno\u0161\u0107u, uzete su u obzir pri kona\u010dnom definiranju
  sadr\u017eaja Akcijskog plana.\\n\\nU svrhu osiguranja kontinuiteta dijaloga izme\u0111u
  nadle\u017enih dr\u017eavnih tijela, jedinica lokalne i podru\u010dne samouprave,
  organizacija civilnog dru\u0161tva i akademske zajednice o svim aspektima pripreme
  i provedbe Akcijskog plana, ali i op\u0107enito radi poticanja ve\u0107e otvorenosti
  i transparentnosti rada tijela javne vlasti, Vlada Republike Hrvatske je\\n\\nsvojom
  odlukom od 26. sije\u010dnja 2012. uspostavila Savjet inicijative Partnerstvo za
  otvorenu vlast. Savjet ima 19 \u010dlanova (predstavnika dr\u017eavnih, lokalnih
  i regionalnih vlasti, organizacija civilnog dru\u0161tva, akademske zajednice i
  medija), a svaki \u010dlan ima i svog zamjenika. Zada\u0107e Savjeta su: priprema
  Prijedloga akcijskog plana za provedbu inicijative Partnerstvo za otvorenu vlast
  u Republici Hrvatskoj uklju\u010duju\u0107i i provedbu postupka savjetovanja o Prijedlogu
  akcijskog plana te pra\u0107enje provedbe Akcijskog plana i predlaganje Vladi Republike
  Hrvatske izmjena i dopuna Akcijskog plana. Tijela javne vlasti i nositelji provedbe
  mjera iz Akcijskog plana za provedbu inicijative Partnerstvo za otvorenu vlast u
  Republici Hrvatskoj za razdoblje 2012.-2013. obvezni su Savjetu dostavljati cjelovite
  informacije o provedbi mjera iz svoje nadle\u017enosti, o \u010demu Savjet raspravlja
  na sjednicama. Do kraja srpnja 2013. Savjet je odr\u017eao 7 sjednica.  Povrh toga,
  \u010dlanovi Savjeta redovito primaju informacije o provedbi Akcijskog plana te
  op\u0107enito o relevantnim pitanjima u vezi s provedbom inicijative putem posebne
  mailing liste.\\n\\nTreba istaknuti da je organizacijama civilnog dru\u0161tva omogu\u0107eno
  ravnopravno sudjelovanje u svim fazama razvoja te pra\u0107enja provedbe dokumenta.
  Takav je pristup u skladu s ciljevima Vlade da novim konceptom zajedni\u0161tva
  dr\u017eavne vlasti s gra\u0111anima i civilnim dru\u0161tvom otvori prostor zajedni\u010dkog
  djelovanja u stvaranju, provo\u0111enju i nadzoru politika koje su od izravnoga
  interesa za gra\u0111ane, \u010dime se \u017eeli potaknuti transparentnost i otvorenost
  rada tijela javne vlasti i uklju\u010divanje gra\u0111ana i civilnoga dru\u0161tva
  u oblikovanje javnih politika.\\n\\nAkcijski plan za provedbu inicijative Partnerstvo
  za otvorenu vlast u Republici Hrvatskoj za razdoblje 2012.-2013., koji je Vlada
  Republike Hrvatske prihvatila na sjednici odr\u017eanoj 5. travnja 2012., izra\u0111en
  je na temelju odr\u017eanih javnih savjetovanja, rasprava na sjednicama Savjeta
  te o\u010ditovanja pristiglih od tijela dr\u017eavne uprave koja su odre\u0111ena
  kao nositelji i sunositelji mjera. Akcijski plan potom je predstavljen na godi\u0161njoj
  konferenciji Partnerstva za otvorenu vlast, 17.-18. travnja 2012., u Brazilu.\\n\\nIz
  navedenoga je vidljivo da Vlada RH u procesu izrade Akcijskog plana konzultirala
  \u0161iru javnost i to kroz razli\u010dite mehanizme: javne rasprave te online savjetovanje
  te da je uspostavom Savjeta inicijative Partnerstvo za otvorenu vlast ostvaren novi,
  specifi\u010dan forum koji omogu\u0107ava redovite konzultacije dionika iz razli\u010ditih
  sektora o uspje\u0161nosti provedbe Akcijskog plana. Informacije u vezi s inicijativom
  Partnerstvo za otvorenu vlast redovito se objavljuju na internetskim stranicama
  Ureda za udruge, gdje je u tu svrhu uspostavljena posebna podstranica, a sjednice
  Savjeta najavljuju se i na stranicama Vlade RH.\\n\\nDodatna vidljivost je postignuta
  organizacijom Konferencije europskih dr\u017eava \u010dlanica Partnerstva za otvorenu
  vlast, koja je odr\u017eana 4.-5. listopada 2012. u Dubrovniku. Konferenciju su
  organizirali Vlada Republike Hrvatske i hrvatske organizacije civilnog dru\u0161tva,
  u suradnji s Kabinetom Vlade Ujedinjene Kraljevine Velike Britanije i Sjeverne Irske
  kao supredsjedateljem Partnerstva za otvorenu vlast, te uz financijsku podr\u0161ku
  projekta za tehni\u010dku pomo\u0107 organizacijama civilnog dru\u0161tva Europske
  unije (TACSO). Svrha ovog skupa bila je okupiti predstavnike vlada i organizacija
  civilnog dru\u0161tva iz europskih dr\u017eava, kako bi zajedni\u010dki, kroz razmjenu
  iskustava, raspravili napredak u provedbi nacionalnih akcijskih planova za provedbu
  inicijative Partnerstvo za otvorenu vlast. Na konferenciji je sudjelovalo 125 sudionika
  iz 37 dr\u017eava.\\n\\nO predanosti Republike Hrvatske inicijativi Partnerstvo
  za otvorenu vlast dodatno svjedo\u010di i \u010dinjenica da je predsjednik Vlade
  Republike Hrvatske u svom govoru pred Op\u0107om skup\u0161tinom Ujedinjenih naroda
  krajem rujna 2012.  godine pozvao na ve\u0107u odgovornost, bolje upravljanje i
  ja\u010du suradnju izme\u0111u dr\u017eava, civilnog dru\u0161tva i privatnog sektora,
  istaknuv\u0161i pritom kako je Hrvatska Vlada u\u010dinila zna\u010dajan napredak
  u tome da svoj rad u\u010dini \u0161to transparentnijim i dostupnijim za svoje gra\u0111ane
  te kao \u010dlanica Inicijative Partnerstvo za otvorenu vlast postala aktivna u
  podru\u010dju fiskalne transparentnosti, pristupa informacijama, informacijskim
  tehnologijama i sudjelovanju civilnog dru\u0161tva.\\n\\nIII. Provedba Akcijskog
  plana\\n\\nPrema izvje\u0161\u0107ima zaprimljenima od nadle\u017enih tijela, Akcijski
  plan za provedbu inicijative Partnerstvo za otvorenu vlast u Republici Hrvatskoj
  za razdoblje 2012.-2013. ve\u0107im se dijelom provodio uspje\u0161no i prema planu.\\n\\nOd
  ukupno 33 provedbene aktivnosti, njih 11 je u potpunosti provedeno, za njih 19 provedba
  je u tijeku, dok su 3 aktivnosti djelomi\u010dno provedene (aktivnosti 1.1.; 1.3.
  i 1.4.). \u0160to se ti\u010de aktivnosti \u010dija je provedba u tijeku, rije\u010d
  je o aktivnostima koje su kontinuirane te aktivnostima \u010diji rok za provedbu
  jo\u0161 nije istekao, izuzev u jednom slu\u010daju \u2013 aktivnost 9.2. koja predvi\u0111a
  uspostavu jedinstvenog internetskog sustava za savjetovanje s javno\u0161\u0107u
  u dono\u0161enju novih zakona, drugih propisa i akata trebala je biti provedena
  do prosinca 2012. no s obzirom na odluku da \u0107e ovaj sustav biti dio velikog
  projekta izrade novog jedinstvenog portala Vlade Republike Hrvatske koji je u izradi,
  taj rok nije ostvaren te internetske stranice Ureda za udruge odr\u017eavaju podstranicu
  koja objavljuje informacije o otvorenim savjetovanjima.\\n\\n\u0160to se ti\u010de
  aktivnosti \u010dija je provedba u tijeku, odnosno koje su do sada tek djelomi\u010dno
  provedene rije\u010d je dijelom o aktivnostima \u010dija je provedba kontinuirana,
  a dijelom su to aktivnosti u vezi s unaprje\u0111enjem portala Moja uprava, odnosno
  razvijanja jedinstvenog internetskog sustava za savjetovanje sa zainteresiranom
  javno\u0161\u0107u. Naime, kako je Vlada donijela odluku o kreiranju jedinstvenog
  internetskog portala radnog naziva gov.hr, u koji bi trebala biti uklopljena i ova
  dva sustava, neki od zacrtanih rokova u Akcijskom planu su probijeni, no na projektu
  gov.hr intenzivno se radi. U periodu dok novi portal nije do kraja razvijen, portal
  Moja uprava funkcionira u starom izdanju, dok Ured Vlade RH za udruge na svojim
  internetskim stranicama ve\u0107 gotovo godinu i pol ima a\u017eurnu podstranicu
  o savjetovanjima o nacrtima zakona, drugih propisa i akata sa zainteresiranom javno\u0161\u0107u,
  koja, uz Vladine profile na dru\u0161tvenim mre\u017eama, slu\u017ei kao centralno
  mjesto za informiranje o trenutno otvorenim savjetovanjima.\\n\\n1. Fiskalna transparentnost\\n\\nU
  podru\u010dju fiskalne transparentnosti Akcijskim planom predvi\u0111ene su 4 mjere,
  odnosno 8 provedbenih aktivnosti.\\n\\nMJERA 1. POBOLJ\u0160ATI SADR\u017dAJ I TRANSPARENTNOST
  PRORA\u010cUNSKIH DOKUMENATA\\n\\nProvedbena aktivnost 1.1. Prijedlog dr\u017eavnog
  prora\u010duna objavljivati pravovremeno i dopuniti tako da sadr\u017ei sljede\u0107e:
  a) Informacije koje pokazuju kako prijedlozi novih zakonskih rje\u0161enja, u odnosu
  na postoje\u0107e, utje\u010du na prihode i rashode prora\u010dunske godine; b)
  Funkcijsku klasifikaciju rashoda za prora\u010dunsku godinu i godinu koja prethodi
  prora\u010dunskoj godini; c) Stanje javnog duga na po\u010detku i na kraju prora\u010dunske
  godine; d) Strukturu javnog duga za prora\u010dunsku i prethodnu godinu; e) Dospjele
  obveze sa stanjem na 30. lipnja; f) Informacije o uvjetnim obvezama za prora\u010dunsku
  godinu (jamstvima); g) Informacije o tome gdje se mogu prona\u0107i podaci o u\u010dinku
  makroekonomskih pretpostavki na prora\u010dunske prihode, rashode i dug (analiza
  osjetljivosti).\\n\\nNositelj: Ministarstvo financija\\n\\nRok za provedbu: studeni
  2012. i studeni 2013.\\n\\nAktivnost je dijelom provedena na vrijeme, a zbog izuzetne
  slo\u017eenosti nije provedena u potpunosti.\\n\\nPojedine obveze nisu isklju\u010divo
  u nadle\u017enosti Ministarstva financija i zahtijevaju zna\u010dajnije promjene
  u na\u010dinu izrade prijedloga dr\u017eavnog prora\u010duna, \u0161to nije mogu\u0107e
  provesti zbog nedostatka administrativnog kadra u odnosu na velik broj i zahtijevnost
  aktivnosti i utvr\u0111enih prioriteta. U ovom trenutku nije mogu\u0107e sa postoje\u0107im
  kadrom napraviti zna\u010dajniji iskorak u odnosu na dosada\u0161nju praksu.\\n\\nNamjera
  je da Prijedlog Dr\u017eavnog prora\u010duna Republike Hrvatske za 2014. i projekcije
  za 2015. i 2016. sadr\u017ei sve informacije iz aktivnosti 1.1.. Aktivnost \u0107e
  u potpunosti biti provedena utvr\u0111ivanjem Prijedloga Dr\u017eavnog prora\u010duna
  Republike Hrvatske za 2014. i projekcijama za 2015. i 2016., kojeg \u0107e Vlada
  Republike Hrvatske uputiti Hrvatskom saboru u zakonski utvr\u0111enim rokovima.\\n\\na)
  Informacije koje pokazuju kako prijedlozi novih zakonskih rje\u0161enja, u odnosu
  na postoje\u0107e, utje\u010du na prihode i rashode prora\u010dunske godine\\n\\nMinistarstvo
  financija je izvijestilo kako Dr\u017eavni prora\u010dun Republike Hrvatske za 2013.
  i projekcije za 2014. i 2015. sadr\u017ee informacije koje pokazuju kako \u0107e
  zakonska rje\u0161enja iz podru\u010dja poreza utjecati na prihode i rashode prora\u010dunske
  godine, \u0161to je vidljivo u Obrazlo\u017eenju dr\u017eavnog prora\u010duna i
  financijskih planova izvanprora\u010dunskih korisnika za 2013. i projekcija za 2014.
  i 2015.\\n\\nb) Funkcijsku klasifikaciju rashoda za prora\u010dunsku godinu i godinu
  koja prethodi prora\u010dunskoj godini\\n\\nFunkcijska klasifikacija rashoda za
  prora\u010dunsku godinu nije objavljena u sklopu Dr\u017eavnog prora\u010duna Republike
  Hrvatske za 2013. i projekcija za 2014. i 2015., ali je objavljena na internetskim
  stranicama Ministarstva financija (http://www.mfin.hr/hr/drzavni-proracun-2013-godina).
  Aktivnost \u0107e u potpunosti biti provedena utvr\u0111ivanjem Prijedloga Dr\u017eavnog
  prora\u010duna Republike Hrvatske za 2014. i projekcijama za 2015. i 2016., kojeg
  \u0107e Vlada Republike Hrvatske uputiti Hrvatskom saboru u zakonski utvr\u0111enim
  rokovima.\\n\\nc) Stanje javnog duga na po\u010detku i na kraju prora\u010dunske
  godine\\n\\nU prijedlogu dr\u017eavnog prora\u010duna nije objavljeno stanje javnog
  duga na po\u010detku i na kraju prora\u010dunske godine. Pravilnikom o polugodi\u0161njem
  i godi\u0161njem izvje\u0161taju o izvr\u0161enju prora\u010duna, koji se prvi put
  primjenjuje za Godi\u0161nji izvje\u0161taj o izvr\u0161enju Dr\u017eavnog prora\u010duna
  za 2012., predvi\u0111eno je objavljivanje stanja javnog duga na po\u010detku i
  na kraju prora\u010dunske godine. Stanje duga dr\u017eavnog prora\u010duna na po\u010detku
  i na kraju prora\u010dunske godine objavljeno je u Godi\u0161njem izvje\u0161taju
  o izvr\u0161enju Dr\u017eavnog prora\u010duna za 2012.\\n\\nd) Strukturu javnog
  duga za prora\u010dunsku i prethodnu godinu\\n\\nU prijedlogu dr\u017eavnog prora\u010duna
  nije objavljena struktura javnog duga za prora\u010dunsku i prethodnu godinu. Struktura
  dr\u017eavnog duga objavljena je u Godi\u0161njem izvje\u0161taju o izvr\u0161enju
  Dr\u017eavnog prora\u010duna za 2012.\\n\\ne) Dospjele obveze sa stanjem na 30.
  lipnja\\n\\nU prijedlogu dr\u017eavnog prora\u010duna nismo objavili dospjele obveze
  sa stanjem na 30. lipnja\\n\\nf) Informacije o uvjetnim obvezama za prora\u010dunsku
  godinu (jamstvima)\\n\\nU prijedlogu dr\u017eavnog prora\u010duna nisu objavljene
  informacije o uvjetnim obvezama za prora\u010dunsku godinu. Informacije o uvjetnim
  obvezama za prora\u010dunsku godinu objavljene su u Godi\u0161njem izvje\u0161taju
  o izvr\u0161enju Dr\u017eavnog prora\u010duna za 2012.\\n\\ng) Informacije o tome
  gdje se mogu prona\u0107i podaci o u\u010dinku makroekonomskih pretpostavki na prora\u010dunske
  prihode, rashode i dug (analiza osjetljivosti)\\n\\nU prijedlogu dr\u017eavnog prora\u010duna
  nisu objavljene informacije o tome gdje se mogu prona\u0107i podaci o u\u010dinku
  makroekonomskih pretpostavki na prora\u010dunske prihode, rashode i dug (analiza
  osjetljivosti), ali se te informacije djelomi\u010dno mogu prona\u0107i u okviru
  ekonomskog pretpristupnog programa 2012. \u2013 2014.\\n\\nProvedbena aktivnost
  1.2. Mjese\u010dne izvje\u0161taje o izvr\u0161enju dr\u017eavnog prora\u010duna
  za 2013. dopuniti podacima o ostvarenim rashodima prema organizacijskoj klasifikaciji
  te ih objavljivati najkasnije mjesec dana nakon zavr\u0161etka razdoblja na koje
  se odnose\\n\\nNositelj: Ministarstvo financija\\n\\nRok za po\u010detak provedbe:
  velja\u010da 2013.\\n\\nAktivnost se provodi na vrijeme kada to tehni\u010dke mogu\u0107nosti
  dozvoljavaju.\\n\\nMinistarstvo financija je izradilo mjese\u010dne izvje\u0161taje
  o izvr\u0161enju dr\u017eavnog prora\u010duna za 2013. koji sadr\u017ee podatke
  o ostvarenim rashodima prema organizacijskoj klasifikaciji (prva i druga razina
  - razdjeli i glave). Kada su tehni\u010dke mogu\u0107nosti to dozvoljavale, izvje\u0161taji
  su objavljeni u predvi\u0111enom roku, odnosno najkasnije mjesec dana nakon zavr\u0161etka
  razdoblja na koje se odnose. Naime, podaci o izvr\u0161enju prora\u010duna za pojedini
  mjesec postaju dostupni \u201ezaklju\u010davanjem\\\" sustava (Glavne knjige dr\u017eavnog
  prora\u010duna) nakon \u0161to su provedena sva potrebna knji\u017eenja. U slu\u010daju
  da prora\u010dunski korisnici nisu dostavili na vrijeme dokumentaciju potrebnu za
  knji\u017eenja, Glavna knjiga nije mogla biti zaklju\u010dana, a samim time niti
  podaci o izvr\u0161enju prora\u010duna nisu bili spremni za objavu (primjerice izvje\u0161taj
  s podacima za o\u017eujak 2013.).\\n\\nProvedbena aktivnost 1.3. Polugodi\u0161nji
  izvje\u0161taj o izvr\u0161enju dr\u017eavnog prora\u010duna za 2013. godinu dopuniti:
  a) obja\u0161njenjem kako promijenjeni ekonomski uvjeti i novi prijedlozi zakonskih
  rje\u0161enja utje\u010du na planirane prihode i rashode do kraja godine; b) izmijenjenim
  planom prihoda i rashoda za prora\u010dunsku godinu s detaljnim obja\u0161njenjima,
  u zakonom predvi\u0111enim rokovima; c) informacijama o tome gdje se mogu prona\u0107i
  a\u017eurirane prognoze za prihode i rashode za dvije godine koje slijede nakon
  prora\u010dunske godine.\\n\\nNositelj: Ministarstvo financija\\n\\nRok za provedbu:
  rujan 2013.\\n\\nAktivnost je djelomi\u010dno provedena.\\n\\nMinistarstvo financija
  izradilo je polugodi\u0161nji izvje\u0161taj o izvr\u0161enju prora\u010duna za
  prvo polugodi\u0161te teku\u0107e prora\u010dunske godine koji je djelomi\u010dno
  dopunjen trenutno dostupnim podacima. Razlog zbog kojeg aktivnost nije u potpunosti
  provedena obja\u0161njen je detaljno u provedbenoj aktivnosti 1.1.\\n\\nProvedbena
  aktivnost 1.4. Godi\u0161nji izvje\u0161taj o izvr\u0161enju dr\u017eavnog prora\u010duna
  za 2012. godinu dopuniti s obja\u0161njenjem razlike izme\u0111u izvornih makroekonomskih
  prognoza za prora\u010dunsku godinu i stvarnog ishoda te ga javno objaviti u zakonom
  predvi\u0111enim rokovima.\\n\\nNositelj: Ministarstvo financija\\n\\nRok za provedbu:
  lipanj 2013.\\n\\nAktivnost je djelomi\u010dno provedena.\\n\\nRazlika izme\u0111u
  izvornih makroekonomskih prognoza za prora\u010dunsku godinu i stvarnog ishoda obja\u0161njena
  je u Godi\u0161njem izvje\u0161taju o izvr\u0161enju Dr\u017eavnog prora\u010duna
  Republike Hrvatske za 2012. godinu, dijelu \u201eObrazlo\u017eenje makroekonomskih
  pokazatelja u 2012. godini\\\". Dio Godi\u0161njeg izvje\u0161taja o izvr\u0161enju
  Dr\u017eavnog prora\u010duna Republike Hrvatske za 2012. godinu je i Godi\u0161nji
  izvje\u0161taj o primjeni fiskalnih pravila za 2012. godinu u kojem je tako\u0111er
  dodatno obja\u0161njena razlika izme\u0111u izvornih makroekonomskih prognoza za
  prora\u010dunsku godinu i stvarnog ishoda. Sve gore navedeno je dostupno na: http://www.mfin.hr/hr/drzavni-proracun-2012-godina.\\n\\nU
  \u010dlanku 11. Pravilnika o polugodi\u0161njem i godi\u0161njem izvje\u0161taju
  o izvr\u0161enju prora\u010duna (NN 24/13), definirano je kako obrazlo\u017eenje
  makroekonomskih pokazatelja, osim obja\u0161njenja kretanja osnovnih makroekonomskih
  pokazatelja u realnom, financijskom i me\u0111unarodnom sektoru u izvje\u0161tajnom
  razdoblju, mora sadr\u017eavati i prikaz razlika izme\u0111u izvornih makroekonomskih
  prognoza za prora\u010dunsku godinu i stvarnog ishoda. U Godi\u0161njem izvje\u0161taju
  o izvr\u0161enju prora\u010duna za 2012. godinu opisane su razlike makroekonomskih
  prognoza i ostvarenja za 2012. godinu za glavne makroekonomske veli\u010dine: bruto
  doma\u0107i proizvod i njegove komponente te inflaciju, kao \u0161to je i potvr\u0111eno
  u Izvje\u0161taju o provedbi akcijskog plana za provedbu inicijative Partnerstvo
  za otvorenu vlast u Republici Hrvatskoj za razdoblje 2012. do 2013. godine.\\n\\nMJERA
  2. POBOLJ\u0160ATI TRANSPARENTNOST POSLOVANJA TRGOVA\u010cKIH DRU\u0160TAVA OD POSEBNOG
  DR\u017dAVNOG INTERESA\\n\\nProvedbena aktivnost 2.1. Godi\u0161nja izvje\u0161\u0107a
  o poslovanju trgova\u010dkih dru\u0161tava od posebnog dr\u017eavnog interesa objaviti
  do 30. rujna teku\u0107e godine za prethodnu godinu.\\n\\nNositelj: Ministarstvo
  financija\\n\\nRok za provedbu: lipanj 2013.\\n\\nAktivnost \u0107e se provesti
  na vrijeme.\\n\\nPri sastavljanju Akcijskog plana do\u0161lo je do gre\u0161ke.
  Godi\u0161nje izvje\u0161\u0107e o poslovanju trgova\u010dkih dru\u0161tava od posebnog
  dr\u017eavnog interesa mora se objaviti do 30. rujna, a ne u lipnju, pa \u0107e
  do tog datuma i biti objavljeno.\\n\\nMJERA 3. SADR\u017dAJ KLJU\u010cNIH PRORA\u010cUNSKIH
  DOKUMENATA U\u010cINITI RAZUMLJIVIM I DOSTUPNIM GRA\u0110ANIMA\\n\\nProvedbena aktivnosti
  3.1. Za klju\u010dne prora\u010dunske dokumente (smjernice ekonomske i fiskalne
  politike, prijedlog dr\u017eavnog prora\u010duna i projekcija, dr\u017eavni prora\u010dun
  i projekcije donesene od strane Hrvatskog sabora, polugodi\u0161nji i godi\u0161nji
  izvje\u0161taj o izvr\u0161enju dr\u017eavnog prora\u010duna) izra\u0111ivati jednostavne
  i gra\u0111anima razumljive sa\u017eetke \u2013 vodi\u010de za gra\u0111ane (Prora\u010dun
  za gra\u0111ane) i pravovremeno ih objavljivati.\\n\\nNositelj: Ministarstvo financija\\n\\nRok
  za po\u010detak provedbe: 2013.\\n\\nAktivnost je kontinuirana i izvr\u0161ava se
  prema planu.\\n\\nZa Godi\u0161nji izvje\u0161taj o izvr\u0161enju Dr\u017eavnog
  prora\u010duna Republike Hrvatske za 2012. godinu izra\u0111en je Vodi\u010d za
  gra\u0111ane - izvr\u0161enje dr\u017eavnog prora\u010duna za 2012. godinu i objavljen
  na internetskim stranicama Ministarstva financija http://www.mfin.hr/hr/proracunske-publikacije.
  Isto se planira i za smjernice ekonomske i fiskalne politike, prijedlog dr\u017eavnog
  prora\u010duna i projekcija i polugodi\u0161nji izvje\u0161taj o izvr\u0161enju
  dr\u017eavnog prora\u010duna, nakon \u0161to dokumenti budu izra\u0111eni.\\n\\nMJERA
  4. POBOLJ\u0160ATI DOSTUPNOST SADR\u017dAJA LOKALNIH PRORA\u010cUNA GRA\u0110ANIMA
  I JAVNOSTI\\n\\nProvedbena aktivnost 4.1. Dati preporuku i uputu svim jedinicama
  lokalne i podru\u010dne (regionalne) samouprave, da na svojim slu\u017ebenim internetskim
  stranicama objave klju\u010dne prora\u010dunske dokumente (prijedlog prora\u010duna
  \u2013 kad ga izvr\u0161na vlast \u0161alje predstavni\u010dkoj; prora\u010dun donesen
  od strane predstavni\u010dkog tijela \u2013 kad ga predstavni\u010dko tijelo donese;
  polugodi\u0161nji i godi\u0161nji izvje\u0161taj o izvr\u0161enju \u2013 kad ih
  izvr\u0161na vlast \u0161alje predstavni\u010dkoj).\\n\\nNositelj: Ministarstvo
  financija\\n\\nRok za provedbu: srpanj 2012. i srpanj 2013.\\n\\nAktivnost je provedena
  u potpunosti.\\n\\nSukladno Zakonu o prora\u010dunu (Narodne novine, br. 87/08),
  a na temelju Smjernica ekonomske i fiskalne politike Vlade Republike Hrvatske za
  razdoblje 2013. - 2015. Ministarstvo financija sastavilo je preporuku i upute za
  izradu prora\u010duna jedinica lokalne i podru\u010dne (regionalne) samouprave te
  ih objavilo na slu\u017ebenim internetskim stranicama: http://www.mfin.hr/hr/lokalni-proracuni.\\n\\nProvedbena
  aktivnost 4.2. Izraditi jedinstveni format za objavu vodi\u010da za gra\u0111ane
  uz prora\u010dune jedinica lokalne i podru\u010dne (regionalne) samouprave te preporu\u010diti
  lokalnim jedinicama njihovu pravodobnu objavu.\\n\\nNositelj: Ministarstvo financija\\n\\nRok
  za provedbu: srpanj 2013.\\n\\nAktivnost je provedena u potpunosti.\\n\\nMinistarstvo
  financija izradilo je Jedinstveni format vodi\u010da za gra\u0111ane i objavilo
  ga na slu\u017ebenim internetskim stranicama: http://www.mfin.hr/hr/lokalni-proracuni.\\n\\nDODATNE
  AKTIVNOSTI U VEZI S FISKALNOM TRANSPARENTNO\u0160\u0106U\\n\\nObjava dokumenata
  o javnim nabavama\\n\\nMinistarstva i druga tijela dr\u017eavne uprave (Dr\u017eavni
  ured za sredi\u0161nju javnu nabavu, Dr\u017eavni ured za upravljanje dr\u017eavnom
  imovinom itd.) na svojim internetskim stranicama redovito objavljuju dokumente u
  vezi s javnim nabavama (Plan javne nabave, Pregled sklopljenih ugovora o javnoj
  nabavi i njihovog izvr\u0161enja itd.).\\n\\nJavnost ugovorenih sadr\u017eaja zdravstvene
  za\u0161tite u RH\\n\\nHrvatski zavod za zdravstveno osiguranje proveo je vi\u0161e
  projektnih aktivnosti u podru\u010dju fiskalne transparentnosti. Putem web aplikacije
  na www.hzzo.hr, odnosno http://www.hzzo.hr/03_05_02.php,  dostupna je tra\u017eilica
  ugovorenih sadr\u017eaja zdravstvene za\u0161tite u RH, odnosno zdravstvenih ustanova
  i privatnih zdravstvenih radnika koji s HZZO-om imaju sklopljene ugovore o provo\u0111enju
  izvanbolni\u010dke specijalisti\u010dko-konzilijarne zdravstvene za\u0161tite. Tra\u017eilica
  omogu\u0107ava uvid u ugovorene djelatnosti te maksimalni mjese\u010dni iznos nov\u010danih
  sredstava koje ugovorni subjekt mo\u017ee ostvariti po ugovorenoj djelatnosti. Spajanje
  HZZO sa sustavom OIB-a putem online servisa omogu\u0107ilo je analizu podataka o
  umrlim osobama dobivenih od Ministarstva uprave, \u010dime su osigurane odre\u0111ene
  u\u0161tede. Tako\u0111er, poduzete su mjere za potpuno jasno i transparentno prikazivanje
  financijskog poslovanja Dopunskog zdravstvenog osiguranja, \u010dime se pridonijelo
  fiskalnoj transparentnosti i odgovornosti unutar Zavoda.\\n\\nTransparentnost podataka
  o financiranju razvojnih projekata u turizmu,\\n\\nMinistarstvo turizma u rubrici
  \u201epotpore i krediti\\\" www.mint.hr/default.aspx?id=7936 redovito objavljuje
  javne pozive za bespovratne potpore razvojnim projektima u turizmu, kao i sve rezultate
  o iznosima i korisnicima, \u010dime se ostvaruje uvid u tro\u0161enje javnih sredstava.\\n\\nJavnost
  podataka o financiranju projekata i programa udruga iz javnih izvora\\n\\nSukladno
  odredbama Kodeksa pozitivne prakse, standarda i mjerila ostvarivanja financijske
  potpore za projekte i programe udruga usvojenom u Hrvatskom saboru, javnosti se
  redovito predstavljaju podaci o svim projektima i programima udruga/organizacija
  civilnog dru\u0161tva financiranih iz javnih izvora s pojedinostima o financijskim
  iznosima i voditelju projekta/programa. Izvje\u0161\u0107a o financijskim sredstvima
  dodijeljenima projektima i programima organizacija civilnoga dru\u0161tva iz dr\u017eavnog
  prora\u010duna u 2012 sadr\u017ee i detaljne podatke o postupanju svih dr\u017eavnih
  tijela u odnosu na usvojene standarde transparentne provedbe natje\u010daja, kao
  i podrobne analize podru\u010dja, izravnih i neizravnih korisnika kao i teritorijalne
  rasprostranjenosti financiranih projekata i programa. U svrhu bolje informiranja
  javnosti krajem 2012. objavljen je detaljni plan svih planiranih natje\u010daja
  u 2013., a odr\u017eani su i Info dani gdje su s organizacijama civilnog dru\u0161tva
  raspravljeni planirani prioriteti za financiranje.\\n\\n2. Pristup informacijama\\n\\nU
  podru\u010dju pristupa informacijama Akcijskim planom predvi\u0111ene su 2 mjere,
  odnosno 12 provedbenih aktivnosti.\\n\\nMJERA 5. POBOLJ\u0160ATI ZAKONSKI OKVIR
  ZA OSTVARIVANJE PRAVA NA PRISTUP INFORMACIJAMA\\n\\nProvedbena aktivnost 5.1. Izmijeniti
  i dopuniti Zakon o pravu na pristup informacijama\\n\\nNositelj:\\n\\nMinistarstvo
  uprave\\n\\nRok za provedbu:\\n\\nrujan 2012.\\n\\nAktivnost je provedena u potpunosti.\\n\\nNa
  izradi nacrta prijedloga Zakona o pravu na pristup informacijama (ZOPPI) radila
  je Stru\u010dna radna skupina u koju su bili uklju\u010deni predstavnici nadle\u017enih
  dr\u017eavnih institucija te predstavnici organizacija civilnog dru\u0161tva. O
  nacrtu prijedloga ZOPPI-a odr\u017eano je i internetsko savjetovanje u trajanju
  od mjesec dana, a objavljeno je i izvje\u0161\u0107e sa svim prihva\u0107enim i
  neprihva\u0107enim primjedbama iz javnog savjetovanja. Nakon toga je nacrt zakona
  upu\u0107en na mi\u0161ljenje Europskoj komisiji, a potom i u saborsku proceduru.
  ZOPPI je donesen na 7. sjednici Hrvatskog sabora, 15. velja\u010de 2013. te objavljen
  u \u201eNarodnim novinama\\\" broj 25 od 28. velja\u010de 2013.\\n\\nProvedbena
  aktivnost 5.2. Uskla\u0111ivanje Zakona o tajnosti podataka s izmjenama i dopunama
  Zakona o pravu na pristup informacijama, a ovisno o rezultatima stru\u010dne rasprave
  te rasprave sa zainteresiranom javno\u0161\u0107u\\n\\nNositelj: Ministarstvo uprave\\n\\nRok
  za provedbu: rujan 2012.\\n\\nProvedba aktivnosti je u tijeku.\\n\\nZaklju\u010dkom
  Koordinacije za unutarnju politiku i upravljanje dr\u017eavnom imovinom od 23. srpnja
  2013. godine, kao nositelj izrade Nacrta prijedloga zakona o tajnosti podataka zadu\u017eeno
  je Ministarstvo unutarnjih poslova.\\n\\nMJERA 6. POBOLJ\u0160ATI DOSTUPNOST PODATAKA
  O TRO\u0160ENJU JAVNIH RESURSA I SADR\u017dAJU RELEVANTNIH REGISTARA\\n\\nProvedbena
  aktivnost 6.1. Provesti evaluaciju primjene Zakona o financiranju politi\u010dkih
  aktivnosti i izborne promid\u017ebe\\n\\nNositelj:\\n\\nMinistarstvo uprave\\n\\nRok
  za provedbu: prosinac 2012.\\n\\nAktivnost je provedena u potpunosti.\\n\\nStru\u010dna
  radna skupina za evaluaciju doti\u010dnog Zakona, utvr\u0111ivanje smjernica i izradu
  prijedloga izmjena Zakona osnovana je u travnju 2012. od predstavnika Ministarstva
  uprave, Ministarstva financija, Ministarstva pravosu\u0111a, DIP-a, Dr\u017eavnog
  ureda za reviziju, Transparency Internationala Hrvatska i GONG-a. U kolovozu su
  izra\u0111ene smjernice, a nakon toga i radni Nacrt prijedloga Zakona o izmjenama
  i dopunama Zakona. Internetsko savjetovanje sa zainteresiranom javno\u0161\u0107u
  odr\u017eano je u periodu od 14. do 30. rujna 2012. Prijedlog Zakona o izmjenama
  i dopunama Zakona o financiranju politi\u010dkih aktivnosti i izborne promid\u017ebe
  prihva\u0107en je na 6. sjednici Hrvatskog sabora 14. prosinca 2012., a Zakon je
  donesen na 7. sjednici Hrvatskog sabora 22. velja\u010de 2013. te objavljen u Narodnim
  novinama broj 27/2013.\\n\\nProvedbena aktivnost 6.2. Stvoriti preduvjete za javnu
  objavu i trajnu dostupnost podataka o donatorima izbornih kampanja i redovnog politi\u010dkog
  djelovanja\\n\\nNositelj: Ministarstvo uprave\\n\\nRok za provedbu: prosinac 2012.\\n\\nAktivnost
  je provedena u potpunosti.\\n\\nZakonom o izmjenama i dopunama Zakona o financiranju
  politi\u010dkih aktivnosti i izborne promid\u017ebe, izme\u0111u ostalog, utvr\u0111uje
  se da se godi\u0161nji financijski izvje\u0161taji i financijski izvje\u0161taji
  o financiranju izborne promid\u017ebe trajno objavljuju na internetskim stranicama
  Hidre, \u010dime je ispunjena ova provedbena aktivnost.\\n\\nFinancijski izvje\u0161taji,
  sukladno Zakonu, pored ostalog, sadr\u017ee i specificirane podatke o donatoru (osobno
  ime/naziv i adresu), datumu uplate, iznosu i vrsti donacije, te se trajnom objavom
  financijskih izvje\u0161taja omogu\u0107uje trajni pristup tim podacima i pretra\u017eivanje
  baze podataka po razli\u010ditim osnovama. Izvje\u0161\u0107a o donacijama i tro\u0161kovima
  izborne promid\u017ebe tako\u0111er se javno objavljuju na internetskim stranicama
  politi\u010dkih stranaka, nezavisnih zastupnika i nezavisnih \u010dlanova predstavni\u010dkih
  tijela jedinica lokalne i podru\u010dne (regionalne) samouprave, odnosno na internetskim
  stranicama sudionika izbora. Svi oni ujedno su du\u017eni obavijest o adresi internetske
  stranice na kojoj su objavili izvje\u0161\u0107a dostaviti DIP-u.\\n\\nZakonom o
  izmjenama i dopunama Zakona o financiranju politi\u010dkih aktivnosti i izborne
  promid\u017ebe u potpunosti su stvoreni preduvjeti za javnu objavu i trajnu dostupnost
  podataka o donatorima izbornih kampanja i redovnog politi\u010dkog djelovanja koju
  sada treba provesti u praksi.\\n\\nProvedbena aktivnost 6.3. Na internetskoj stranici
  www.javnanabava.hr objediniti i javno objaviti popis poveznica na pojedina\u010dne
  objavljene \u201eRegistre ugovora o javnoj nabavi i okvirnih sporazuma\\\".\\n\\nNositelj:
  Ministarstvo gospodarstva\\n\\nRok za po\u010detak provedbe: prosinac 2012.\\n\\nAktivnost
  je kontinuirana i provodi se u potpunosti.\\n\\nTemeljem poveznica na objavljene
  Registre zaprimljene od strane naru\u010ditelja Uprava za sustav javne nabave Ministarstva
  gospodarstva objedinjuje popis tih poveznica i objavljuje ga na Portalu javne nabave
  (www.javnanabava.hr). Popis poveznica redovno se a\u017eurira u skladu s novim poveznicama
  zaprimljenima od strane naru\u010ditelja te je zadnje a\u017euriranje provedeno
  22. srpnja 2013.\\n\\nKako bi se u potpunosti osigurala primjena ove mjere u praksi,
  Uprava za sustav javne nabave Ministarstva gospodarstva objavila je 2. svibnja 2013.
  godine na svojim internetskim stranicama Podsjetnik na ovu obvezu koja proizlazi
  iz Zakona o javnoj nabavi, te je isti podsjetnik proslijedila kroz sustav Elektroni\u010dkog
  oglasnika javne nabave Republike Hrvatske svim registriranim naru\u010diteljima
  u sustavu. Naru\u010ditelji su pozvani da detaljno pro\u010ditaju Podsjetnik te
  da, ako nisu u potpunosti ispunili sve relevantne odredbe, to u\u010dine u \u0161to
  kra\u0107em roku.\\n\\nMe\u0111utim, potrebno je naglasiti da veliki broj naru\u010ditelja
  nije sklapao ugovore u vrijednosti jednakoj ili ve\u0107oj od 70.000,00 kn te stoga
  ne podlije\u017eu obvezi objave u Registru. Stoga, ako za odre\u0111enog naru\u010ditelja
  ne postoji poveznica na Portalu javne nabave to ne zna\u010di automatizmom da ne
  po\u0161tuje Zakon o javnoj nabavi.\\n\\nU svrhu osiguravanja a\u017eurnih i to\u010dnih
  informacija, prilikom zaprimanja poveznice Uprava za sustav javne nabave provjerava
  radi li poveznica u tom trenutku, ali nije mogu\u0107a svakodnevna provjera svih
  poveznica. Tako\u0111er, u slu\u010daju kada Uprava za sustav javne nabave zaprimi
  informaciju da odre\u0111eni naru\u010ditelj nije ispunio specifi\u010dnu obvezu
  u vezi s objavom podataka, odmah kontaktira naru\u010ditelja.\\n\\nProvedbena aktivnost
  6.4. Objaviti sklopljene ugovore o javnoj nabavi i okvirne sporazume sklopljene
  od strane Dr\u017eavnog ureda za sredi\u0161nju javnu nabavu na internetskim stranicama
  Dr\u017eavnog ureda\\n\\nNositelj: Dr\u017eavni ured za sredi\u0161nju javnu nabavu\\n\\nRok
  za po\u010detak provedbe: prosinac 2012.\\n\\nAktivnost je kontinuirana i provodi
  se u potpunosti.\\n\\nDr\u017eavni ured za sredi\u0161nju javnu nabavu (u daljnjem
  tekstu: Dr\u017eavni ured) je sukladno va\u017ee\u0107im zakonskim odredbama poduzeo
  korake kako bi realizirao navedenu provedbenu aktivnost.\\n\\nNaime, prije svega
  valja istaknuti da se sukladno odredbi \u010dlanka 105. stavka 6. Zakona o javnoj
  nabavi (NN 90/11, 83/13) na odgovornost ugovornih strana za ispunjenje obveza iz
  ugovora o javnoj nabavi primjenjuju odgovaraju\u0107e odredbe Zakona o obveznim
  odnosima. Sukladno odredbama Zakona o obveznim odnosima sudionici u obveznim\\n\\nodnosima
  su ravnopravni, du\u017eni su sura\u0111ivati radi potpunog i urednog ispunjenja
  obveza i ostvarivanja prava u tim odnosima te je zabranjeno ostvarivanje prava iz
  obveznog odnosa suprotno svrsi zbog koje je ono propisom ustanovljeno ili priznato.
  Stoga je Dr\u017eavni ured smatrao da je sukladno navedenim zakonskim odredbama
  du\u017ean obavijestiti sve ponuditelje s kojima ima sklopljene okvirne sporazume
  o objavi sadr\u017eaja okvirnih sporazuma.\\n\\nSlijedom navedenog, Dr\u017eavni
  ured je  dopisom (s tra\u017eenim povratom dostavnica) od 3. prosinca 2012. godine
  obavijestio sve ponuditelje s kojima ima sklopljene okvirne sporazume da \u0107e
  nakon proteka roka od 8 dana od primitka navedenog dopisa, objaviti sklopljene okvirne
  sporazume, s tim da \u0107e se voditi ra\u010duna da se ne objave dijelovi dokumentacije
  koja je ozna\u010dena poslovnom tajnom, sukladno posebnim propisima.\\n\\nUpravo
  je u navedenom dijelu u odre\u0111enim nabavnim kategorijama (\u010di\u0161\u0107enje
  prostorija, uredski materijal) u okviru provedbe navedene mjere do\u0161lo do izazova,
  odnosno pote\u0161ko\u0107a tehni\u010dke naravi, budu\u0107i da se za sve ponuditelje
  dostavnice nisu vra\u0107ale u redovnim rokovima i stoga je bilo potrebno zatra\u017eiti
  i povrat dostave. Nakon \u0161to su se sve dostavnice vratile, Dr\u017eavni ured
  je tijekom svibnja 2013. objavio sve okvirne sporazume koji su trenutno aktualni,
  odnosno koji se izvr\u0161avaju, time da nisu objavljivani dijelovi sporazuma, odnosno
  prilozi koji su ozna\u010deni kao poslovna tajna. Naime, obveza je naru\u010ditelja
  da ne objavljuje dijelove dokumentacije koji su ozna\u010deni poslovnom tajnom,
  budu\u0107i je \u010dlankom 16. stavkom 1. Zakona o javnoj nabavi odre\u0111eno
  da \u201ene dovode\u0107i u pitanje primjenu odredaba tog zakona, osobito onih koje
  se odnose na objavljivanje obavijesti o sklopljenim ugovorima te na sadr\u017eaj
  odluka i zapisnika koje naru\u010ditelj dostavlja natjecateljima i ponuditeljima,
  naru\u010ditelj je obvezan \u010duvati i ne smije dati na uvid podatke iz dokumentacije
  gospodarskih subjekata koje su oni sukladno posebnim propisima ozna\u010dili poslovnom
  tajnom.\\\"\\n\\nNadalje, valja istaknuti da Dr\u017eavni ured u aktualnim postupcima
  javne nabave na svojoj internetskoj stranici, osim sadr\u017eaja okvirnih sporazuma,
  objavljuje i cijeli tijek postupaka javne nabave, od dokumentacije za nadmetanje
  do dono\u0161enja odluke o odabiru te je na taj na\u010din javnost upoznata sa svakom
  fazom postupka javne nabave. Naime, okvirni sporazum s odabranim ponuditeljem posljedica
  je provedenog postupka javne nabave i kako je naprijed i navedeno, vi\u0161e nije
  dijelom postupka javne nabave, ve\u0107  isto ure\u0111uju zakonske odredbe koje
  regulira obvezno pravo te je stoga va\u017eno da javnost bude upoznata sa \u010ditavim
  tijekom postupka i postupanjem  u svakoj njegovoj fazi.\\n\\nDr\u017eavni ured je
  tako\u0111er stajali\u0161ta da je potrebno objaviti sadr\u017eaj okvirnih sporazuma
  koji su aktualni i koji se izvr\u0161avaju, s time da se na zahtjev zainteresirane
  javnosti mogu javno predo\u010diti i sklopljeni okvirni sporazumi u postupcima javne
  nabave koji vi\u0161e nisu aktualni. Naime, \u010dlankom 4. Uredbe o objavama javne
  nabave (NN 10/12) odre\u0111ene su sve objave javne nabave, a jedna od njih je i
  obavijest o sklopljenim ugovorima pa se u kontekstu navedenog smatra da je Dr\u017eavni
  ured u tom smislu u aktualnim postupcima javne nabave u\u010dinio i vi\u0161e od
  propisanog, jer nije objavljena samo obavijest o sklopljenim ugovorima, ve\u0107
  sadr\u017eaj okvirnih sporazuma. Nadalje, \u010dlankom 9. navedene Uredbe odre\u0111eno
  je da svaka objava javne nabave i pripadaju\u0107a dokumentacija mora biti javno
  dostupna za pregled u Elektroni\u010dkom oglasniku javne nabave Republike Hrvatske
  najmanje godinu dana od dana objavljivanja objave javne nabave i da svaka objava
  javne nabave mora biti dostupna u arhivi Elektroni\u010dkog oglasnika javne nabave
  Republike\\n\\nHrvatske najmanje \u010detiri godine od dana njena objavljivanja
  s ciljem neograni\u010denog i besplatnog pristupa i pretra\u017eivanja objava sredi\u0161njem
  tijelu dr\u017eavne uprave nadle\u017enom za sustav javne nabave, Dr\u017eavnoj
  komisiji za kontrolu postupaka javne nabave i Dr\u017eavnom odvjetni\u0161tvu Republike
  Hrvatske. Dakle i na ovaj na\u010din zadovoljeno je na\u010delo transparentnosti
  te je svim nadle\u017enim tijelima omogu\u0107en uvid u tijek postupka javne nabave,
  a na zahtjev zainteresirane javnosti mogu se predo\u010diti i sklopljeni okvirni
  sporazumi u postupcima javne nabave koji vi\u0161e nisu aktualni.\\n\\nDr\u017eavni
  ured \u0107e tako\u0111er i ubudu\u0107e na svojoj internetskoj stranici objavljivati,
  osim sadr\u017eaja svakog stadija postupka javne nabave, i sadr\u017eaj sklopljenih
  ugovora i okvirnih sporazuma koji \u0107e se izvr\u0161avati.\\n\\nProvedbena aktivnost
  6.5. Objaviti sve ugovore o koncesijama za pru\u017eanje medijskih usluga televizije
  i radija (bez natje\u010dajne dokumentacije)\\n\\nNositelj: Agencija za elektroni\u010dke
  medije\\n\\nRok za po\u010detak provedbe: studeni 2012.\\n\\nAktivnost je kontinuirana
  i provodi se u potpunosti.\\n\\nSkenirani su i objavljeni svi ugovori o koncesijama
  za pru\u017eatelje medijskih usluga televizije i radija (bez natje\u010dajne dokumentacije)
  na internetskim stranicama Agencije za elektroni\u010dke medije: www.e-mediji.hr.\\n\\nTako\u0111er,
  Agencija za elektroni\u010dke medije u sklopu svojih aktivnosti kontinuirano i proaktivno
  radi na objavi sve ve\u0107eg broja informacija koje se odnose na njihov rad, a
  koji su od interesa za javnost.\\n\\nProvedbena aktivnost 6.6. Stvoriti preduvjete
  za objavu podataka o financijskoj i nefinancijskoj imovini kojom upravlja dr\u017eava\\n\\nNositelj:\\n\\nDr\u017eavni
  ured za upravljanje dr\u017eavnom imovinom\\n\\nRok za po\u010detak provedbe: lipanj
  2013.\\n\\nProvedba aktivnosti je u tijeku.\\n\\nZakonom o upravljanju i raspolaganju
  imovinom u vlasni\u0161tvu Republike Hrvatske (NN 94/2013) propisano je na\u010delo
  javnosti upravljanja dr\u017eavnom imovinom koje se osigurava \u201epropisivanjem
  preglednih pravila i kriterija upravljanja i raspolaganja dr\u017eavnom imovinom
  u propisima i drugim aktima koji se donose na temelju ovoga Zakona te njihovom javnom
  objavom, odre\u0111ivanjem ciljeva upravljanja i raspolaganja dr\u017eavnom imovinom
  u Strategiji upravljanja i raspolaganja dr\u017eavnom imovinom i Planu upravljanja
  i raspolaganja dr\u017eavnom imovinom, redovitim upoznavanjem javnosti s aktivnostima
  tijela koja upravljaju i raspola\u017eu dr\u017eavnom imovinom, javnom objavom najva\u017enijih
  odluka o upravljanju i raspolaganju dr\u017eavnom imovinom i vo\u0111enjem registra
  dr\u017eavne imovine\\\".\\n\\nRegistar dr\u017eavne imovine pru\u017eit \u0107e
  mogu\u0107nost javnog uvida u podatke o dr\u017eavnoj imovini, osim imovine koja
  se koristi za potrebe o\u010duvanja suvereniteta, neovisnosti te obrane teritorijalne
  cjelovitosti Republike Hrvatske. Agencija za upravljanje d\u017eavnom\\n\\nimovinom
  na dan 19. kolovoza 2013. godine u Registar je unijela 367 465 stavaka. Krajnji
  rok za objavu Registra je kraj 2013. godine.\\n\\nProvedbena aktivnost 6.7. U strate\u0161kom
  planu Ministarstva financija stvoriti preduvjete za izradu i objavu javno pretra\u017eive
  baze podataka o izvr\u0161enim pla\u0107anjima s jedinstvenog ra\u010duna dr\u017eavnog
  prora\u010duna sukladno propisanim prora\u010dunskim klasifikacijama uzimaju\u0107i
  u obzir druge IT projekte koji su u provedbi.\\n\\nNositelj: Ministarstvo financija\\n\\nRok
  za provedbu: srpanj 2013.\\n\\nAktivnost je provedena.\\n\\nU Strategiji Vladinih
  programa za 2013.-2015. koju je Vlada Republike Hrvatske usvojila 12. srpnja 2012.
  godine navedeno je da \u0107e se uspostaviti javno pretra\u017eiva baza podataka
  o izvr\u0161enim pla\u0107anjima s jedinstvenog ra\u010duna dr\u017eavnog prora\u010duna.
  Isto je navedeno i u Strate\u0161kom planu Ministarstva financija 2013. \u2013 2015.
  Oba su dokumenta dostupna na: http://www.mfin.hr/hr/stratesko-planiranje.\\n\\nProvedbena
  aktivnost 6.8. Preporu\u010diti jedinicama lokalne i podru\u010dne (regionalne)
  samouprave pravodobnu objavu dnevnog reda sjednica predstavni\u010dkog tijela i
  svih materijala za sjednicu na slu\u017ebenim internetskim stranicama, u skladu
  s odredbama op\u0107eg akta jedinice o obaveznoj dostavi sjedni\u010dnog materijala
  \u010dlanovima predstavni\u010dkog tijela, odnosno najkasnije pet dana prije dana
  odr\u017eavanja sjednice\\n\\nNositelj: Ministarstvo uprave\\n\\nRok za provedbu:
  lipanj 2012.\\n\\nAktivnost je provedena.\\n\\nMinistarstvo uprave tra\u017eenu
  je preporuku uputilo 8. lipnja 2012. putem ureda dr\u017eavne uprave u \u017eupanijama,
  koji su je proslijedili svim jedinicama na svom podru\u010dju i izvijestili Ministarstvo
  o izvr\u0161enoj aktivnosti zaklju\u010dno s 16. srpnja 2012.\\n\\nU preporuci je
  Ministarstvo skrenulo pozornost na odredbe Zakona o pravu na pristup informacijama
  i Zakona o lokalnoj i podru\u010dnoj (regionalnoj) samoupravi kojima je utvr\u0111ena
  obveza jedinica lokalne i podru\u010dne (regionalne) samouprave da objavljuju u
  slu\u017ebenim glasilima, kao i informati\u010dkom mediju svoje odluke te je ukazalo
  da se izvr\u0161avanjem navedene obveze pridonosi ostvarivanju na\u010dela javnosti
  i transparentnosti djelovanja jedinice lokalne i podru\u010dne (regionalne) samouprave.
  Navode\u0107i da je po\u0161tivanje tih pravila u interesu ne samo gra\u0111ana
  kako bi imali uvid u rad jedinice lokalne samouprave, nego i same jedinice koja
  pru\u017eanjem informacija o onome \u0161to radi ja\u010da povjerenje gra\u0111ana
  i pridonosi izgradnji kvalitetne i u\u010dinkovite lokalne samouprave, Ministarstvo
  je dalo preporuku svim jedinicama lokalne samouprave da pravodobno objavljuju dnevne
  redove sjednica predstavni\u010dkih tijela te pripadaju\u0107e materijale za sjednicu
  na slu\u017ebenim internetskim stranicama jedinice.\\n\\nProvedbena aktivnost 6.9.
  U Prijedlogu zakona o ra\u010dunovodstvu neprofitnih organizacija predvidjeti obvezu
  javne objave financijskih izvje\u0161taja neprofitnih organizacija kroz Registar
  neprofitnih organizacija\\n\\nNositelj: Ministarstvo financija\\n\\nRok za provedbu:
  prosinac 2013.\\n\\nProvedba aktivnosti je u tijeku.\\n\\nTemeljem Zakona o procjeni
  u\u010dinaka propisa izra\u0111ena je prethodna procjena na propisanom obrascu,
  kao i teze o sadr\u017eaju propisa za Prijedlog zakona o ra\u010dunovodstvu neprofitnih
  organizacija, kojima je predvi\u0111ena javna objava financijskih izvje\u0161taja
  neprofitnih organizacija kroz Registar neprofitnih organizacija, a teze su objavljene
  i raspolo\u017eive za savjetovanje na internetskim stranicama Ministarstva financija.
  Javno savjetovanje je bilo otvoreno do 2. rujna 2013. Po\u010detkom rujna 2013.
  izra\u0111en je prvi nacrt Prijedloga zakona o ra\u010dunovodstvu neprofitnih organizacija
  na kojemu \u0107e u sljede\u0107em razdoblju intenzivno raditi radna skupina uspostavljena
  odlukom ministra financija.\\n\\nProvedbena aktivnost 6.10. Unaprijediti javnu bazu
  podataka o bespovratnim sredstvima dodijeljenima organizacijama civilnog dru\u0161tva
  za projekte i programe od op\u0107eg interesa\\n\\nNositelj: Ured za udruge Vlade
  RH\\n\\nRok za po\u010detak provedbe: lipanj 2012.\\n\\nProvedba aktivnosti je u
  tijeku.\\n\\nSukladno zaklju\u010dcima Vladinog Me\u0111uresorno povjerenstvo za
  koordinaciju politike financiranja projekata i programa udruga iz dr\u017eavnog
  prora\u010duna Republike Hrvatske, Nacionalna zaklada za razvoj civilnog dru\u0161tva
  i Ured za udruge proveli su niz aktivnosti s ciljem uspostave u svim dr\u017eavnim
  tijelima jedinstvenog informacijskog sustava za pra\u0107enje financijskih potpora
  udrugama Potpora plus. Spomenuti informacijski sustav trebao bi dodatno unaprijediti
  postupke provedbe natje\u010daja, te pra\u0107enja i vrednovanja projekata i programa
  udruga financiranih iz dr\u017eavnog prora\u010duna. Spomenuti sustav od 2013. koriste
  sva tijela dr\u017eavne uprave koja imaju ustrojen neki vid dodjele bespovratnih
  sredstava za projekte i programe organizacija civilnoga dru\u0161tva, a u o\u017eujku
  2013. sustav je prilago\u0111en za uvo\u0111enje tokena, \u0161to \u0107e omogu\u0107iti
  sigurniji pristup poslu\u017eitelju. Nakon \u0161to su sva dr\u017eavna tijela zapo\u010dela
  s kori\u0161tenjem informacijskog sustava, do kraja 2013. o\u010dekuje se nadogradnja
  informacijskog sustava uvo\u0111enjem elektroni\u010dke prijave na sve natje\u010daje
  tijela javnih vlasti na nacionalnoj razini, a putem zasebnog portala www.financijskepodrske.hr
  bit \u0107e javno dostupne sve informacije o rezultatima projekata i programa organizacija
  civilnoga dru\u0161tva financiranih iz javnih izvora. U svrhu pripreme programa
  Potpora plus za kori\u0161tenje od strane tijela dr\u017eavne uprave, Nacionalna
  zaklada za razvoj civilnoga dru\u0161tva u suradnji s Uredom za udruge odr\u017eala
  je sastanke i aktivnosti izobrazbe u 18 tijela dr\u017eavne uprave. U\u010dinkovitost
  provedbe ove aktivnosti redovito se prati kroz rad Me\u0111uresornog povjerenstva
  za koordinaciju politike financiranja projekata i programa udruga iz dr\u017eavnog
  prora\u010duna Republike Hrvatske koje je do srpnja 2013. odr\u017ealo 6 sjednica,
  ali i putem zasebnih koordinacijskih sastanaka dr\u017eavnih slu\u017ebenika zadu\u017eenih
  za poslove suradnje s civilnim dru\u0161tvom.\\n\\nDODATNE AKTIVNOSTI U VEZI S PRISTUPOM
  INFORMACIJAMA\\n\\nMinistarstva na slu\u017ebenim internetskim stranicama upu\u0107uju
  gra\u0111ane u pravo na pristup informacijama te u to kako ga mogu ostvariti te
  imaju posebne rubrike posve\u0107ene savjetovanjima sa zainteresiranom javno\u0161\u0107u,
  u sklopu kojih objavljuju informacije o savjetovanjima koje provode. Iako \u0107e
  se konkretni pomaci u provedbi Kodeksa savjetovanja mo\u0107i vidjeti tek po izradi
  izvje\u0161\u0107a o provedbi za 2013., sva ministarstva i druga tijela dr\u017eavne
  uprave izvje\u0161tavaju o porastu broja zahtjeva za pristupom informacijama. Tako\u0111er,
  u ve\u0107em broju slu\u010dajeva, uz organiziranje internetskog savjetovanja sa
  zainteresiranom javno\u0161\u0107u, organiziraju se tako\u0111er i tribine, javne
  rasprave, okrugli stolovi i sl. Ujedno, redovito se a\u017euriraju informacije o
  aktivnostima Ministarstava i objavljuju informacije o savjetovanjima sa zainteresiranom
  javno\u0161\u0107u te se sadr\u017eaji internetskih stranica prilago\u0111avaju
  na na\u010din da informacije od va\u017enosti za gra\u0111ane budu lako dostupne,
  odnosno da se pojednostavi na\u010din dola\u017eenja do njih. Primjerice, kroz objavu
  naj\u010de\u0161\u0107ih pitanja i odgovora. Ministarstva na svojim internetskim
  stranicama redovito objavljuju dokumente prema zakonskim obvezama, kao \u0161to
  su, npr. dokumenti u vezi s javnim nabavama.\\n\\nVlada Republike Hrvatske vrlo
  aktivno sudjeluje na dru\u0161tvenim mre\u017eama. Istra\u017eiva\u010dki projekt
  Twiplomacy, agencije Burson-Marsteller (SAD), od 505 analiziranih profila vlada,
  \u0161efova dr\u017eava, ministara vanjskih poslova i utjecajnih lidera u svijetu,
  pokazao je da je hrvatska Vlada me\u0111u najaktivnijim Twitter profilima te se
  ponovo nalazi na ljestvici 25 najpovezanijih politi\u010dkih Twitter ra\u010duna,
  dok je po aktivnosti zauzela 3. mjesto. Osim toga, Ministarstvo vanjskih poslova
  i Ministarstvo poduzetni\u0161tva i obrta tako\u0111er su aktivni na dru\u0161tvenim
  mre\u017eama (Facebook, Twitter), objavljuju\u0107i relevantne informacije u njihovoj
  nadle\u017enosti.\\n\\nMinistarstvo vanjskih i europskih poslova, uz novu javnu
  internetsku stranicu (iz sije\u010dnja 2013.) ima i javne stranice ve\u0107ine diplomatskih
  misija RH u svijetu, na koje se uz vijesti postavljaju i informacije o projektima,
  relevantni dokumenti i obrasci iz djelokruga rada Ministarstva, kako bi se pobolj\u0161ala
  njihova dostupnost. To se odnosi naro\u010dito na dostupnost prakti\u010dnih informacija
  za koje mnogi gra\u0111ani imaju velik interes, a u vezi s aktualnim preporukama
  za putovanja po dr\u017eavama, izdavanje viza i ostalih naj\u010de\u0161\u0107ih
  upita u domeni konzularnih poslova. Facebook stranice ministarstva bilje\u017ee
  odli\u010dnu posje\u0107enost, kao i twitter profil Ministarstva koji je  analizom
  Twiplomacyja ocijenjen vrlo aktivnim, sa prosje\u010dno dvije objave dnevno i odli\u010dno
  povezanim s drugim me\u0111unarodnim relevantnim institucijama na Twitteru.\\n\\nUz
  to, pojedina Ministarstva su objavila ili pripremaju objavu odre\u0111enih registara,
  odnosno unaprijedila su postoje\u0107e.\\n\\nMinistarstvo branitelja je u\u010dinilo
  javno dostupnim u elektroni\u010dkom obliku popis hrvatskih branitelja iz Domovinskog
  rata iz Registra branitelja. Objava Registra osim \u0161to pridonosi pristupu informacijama
  te fiskalnoj transparentnosti ujedno je i alat u mnogim istra\u017eivanja, pa je
  tako, primjerice, omogu\u0107ila bitnu fazu u provedbi znanstvenoistra\u017eiva\u010dkog
  projekta \u201ePra\u0107enje pobola i smrtnosti hrvatskih branitelja iz Domovinskog
  rata i \u010dlanova njihovih obitelji\\\", koje \u0107e, ukoliko se utvrde odstupanja
  u pobolu i smrtnosti branitelja i \u010dlanova njihovih obitelji naspram op\u0107e
  populacije, omogu\u0107iti\\n\\nkreiranje i provedbu znanstveno utemeljenih preventivnih
  programa.  U 2013. godini Ministarstvo branitelja je po prvi puta objavilo Listu
  prvenstva za dodjelu stambenih kredita, te je generirana posebna kategorija na internetskoj
  stranici Ministarstva branitelja koja sadr\u017ei sve bitne informacije i obrasce
  za stambeno zbrinjavanje.\\n\\nNa razini sustava javne nabave, uz stranicu javnanabava.hr,
  Ministarstvo gospodarstva dodatnu transparentnost posti\u017ee objavom relevantnih
  dokumenata na jedinstvenoj platformi Elektroni\u010dkog oglasnika javne nabave RH
  (EOJN), koji osigurava jednostavan, brz i besplatan pristup postupcima javne nabave.
  Zna\u010dajno unaprje\u0111enje transparentnosti i pristupa podacima ostvareno je
  kroz obvezu objave planova nabave i registara ugovora i okvirnih sporazuma na razini
  pojedina\u010dnih naru\u010ditelja. Ministarstvo gospodarstva, Uprava za sustav
  javne nabave ima na internetskim stranicama Ministarstva navedene kontakte na koje
  zainteresirani dionici mogu uputiti sva pitanja u vezi s provedbom propisa iz podru\u010dja
  javne nabave. Uprava dva puta tjedno korisnicima omogu\u0107ava i dodatno savjetovanje
  putem telefonskog \\\"De\u017eurnog savjetnika\\\", a jednom mjese\u010dno organizira
  i Dan otvorenih vrata na kojima zainteresirani sudionici mogu dobiti sve informacije
  u vezi s primjenom propisa u podru\u010dju javne nabave.\\n\\nMinistarstvo poljoprivrede
  u 2013. godini je postavilo samostalnu stranicu Uprave veterinarstva (veterinarstvo.hr),
  kao funkcionalni servis koji sadr\u017eava informacije o tome kako gra\u0111ani,
  odnosno korisnici mogu ostvariti svoja prava pred tijelima dr\u017eavne uprave.
  Ovim servisom se pove\u0107ava transparentnost kroz objavu registara, izvje\u0161\u0107a,
  planova slu\u017ebenih kontrola, naputaka o provedbi slu\u017ebenih kontrola itd.
  A objavom adresa i kontakata veterinarskih ureda, te obrazaca, unaprje\u0111uje
  se efikasnost pru\u017eanja javnih usluga.\\n\\nMinistarstvo rada i mirovinskoga
  sustava dovr\u0161ava aktivnosti na izradi i objavi elektroni\u010dkog oblika registra
  udruga poslodavaca i udruga sindikata, kao i evidencije o reprezentativnosti sindikata
  za kolektivno pregovaranje.\\n\\nMinistarstvo regionalnoga razvoja i fondova EU
  pokrenulo je portal www.strukturnifondovi.hr. Portal je sredi\u0161nje mjesto na
  kojem se objavljuju informacije o fondovima Europske unije \u2013 pregled natje\u010daja,
  vodi\u010d \u201eKako do EU fondova\\\", edukativni kutak s prikazom svih edukacija
  koje odr\u017eavaju dr\u017eavna i javna tijela te regionalne razvojne agencije.
  Portal ujedno sadr\u017eava i pregled naj\u010de\u0161\u0107ih pitanja i odgovora,
  vijesti te primjere uspje\u0161nih projekata.\\n\\nMinistarstvo uprave omogu\u0107ilo
  je bira\u010dima da u Registru bira\u010da provjere svoje podatke, provjere broj
  bira\u010da registriranih na njihovoj adresi, kao i na bilo kojoj adresi u Republici
  Hrvatskoj.\\n\\nMinistarstvo za\u0161tite okoli\u0161a i prirode provodilo je projekt
  \u201eOsnivanje centara za provedbu IPPC direktive na regionalnoj razini u Hrvatskoj\\\"
  koji je pridonio pobolj\u0161anju informiranosti javnosti i pravu na pristup informacijama.
  U sklopu projekta odr\u017ean je niz radionica, izme\u0111u ostalog radionice i
  o sudjelovanju javnosti unutar  postupka izdavanja IPPC dozvole s ukupno 15 odr\u017eanih
  radionica po cijeloj Hrvatskoj. Uz  te radionice, u postupku provedbe IPPC Direktive
  odr\u017eano je jo\u0161 35 radionica za operatere, ovla\u0161tenike i predstavnike
  nadle\u017enih tijela. Tako\u0111er, preporuka projekta je osnivanje IPPC Foruma
  \u010dija \u0107e svrha biti informiranje, povezivanje, edukacija, sudjelovanje
  u razvoju NRT-a.\\n\\nUred za udruge je kreirao internetsku platformu za pra\u0107enje
  provedbe Nacionalne strategije stvaranja poticajnog okru\u017eenja za razvoj civilnoga
  dru\u0161tva 2012. \u2013 2016.: http://strategija.uzuvrh.hr/. Platforma predstavlja
  inovativan pristup pra\u0107enju i izvje\u0161tavanju provedbe Nacionalne strategije,
  zasnovan na na\u010delima transparentnosti i otvorenosti. Kako bi se \u0161iru javnost
  i medije zainteresiralo za aktivnije uklju\u010divanje u pra\u0107enje provedbe
  svih 27 mjera te 91 provedbene aktivnosti Nacionalne strategije, razvijena je ova
  platforma koja na jednostavan i pregledan na\u010din omogu\u0107uje pra\u0107enje
  i izvje\u0161tavanje o provedbi Strategije u stvarnom vremenu, umjesto dosad uobi\u010dajenog
  godi\u0161njeg izvje\u0161tavanja o napretku, a tako\u0111er i svima zainteresiranima
  omogu\u0107ava komentiranje. Platforma sadr\u017ei informacije o samoj Strategiji,
  statusu provedbe pojedinih aktivnosti (u tijeku, zavr\u0161eno, nije zapo\u010delo)
  te detaljne informacijama o provedbi svake pojedine aktivnosti, uz prate\u0107e
  dokumente, fotografije, video zapise itd. Platforma je ujedno povezana i s projektnom
  stranicom na Facebooku te se i tim putem javnost obavje\u0161tava o novostima, odnosno
  pomacima u provedbi Strategije.\\n\\nUred za ljudska prava i prava nacionalnih manjina
  koordinirao je izradu Nacionalnog programa za\u0161tite i promicanja ljudskih prava
  za razdoblje 2013. do 2016. godine, u sklopu kog je kao jedno od prioritetnih podru\u010dja
  prepoznato i pravo na pristup informacijama. Odnosno, Nacionalnim programom prepoznata
  je va\u017enost podizanja svijesti korisnika prava na informaciju o potrebi i va\u017enosti
  ostvarivanja prava na pristup informacijama, kao i va\u017enost sustavnog usavr\u0161avanja
  slu\u017ebenika za informiranje o pravu na pristup informacijama i to je oblikovano
  u mjere koje \u0107e se kontinuirano provoditi u \u010detverogodi\u0161njem razdoblju
  od 2013. do 2016. godine.\\n\\nHrvatski zavod za zdravstveno osiguranje proveo je
  nekoliko projektnih aktivnosti u podru\u010dju prava na pristup informacijama. Polovicom
  o\u017eujka ove godine HZZO i Hrvatski autoklub (HAK) su na HAK-ovoj interaktivnoj
  internetskoj karti: http://map.hak.hr/, putnom planeru te doma\u0107im i inozemnim
  aplikacijama za pametne telefone objavili 6.500 medicinskih ustanova ugovornih suradnika
  HZZO-a raspore\u0111enih na 3.200 lokacija i time pokrenuli novu zajedni\u010dku
  online uslugu namijenjenu doma\u0107im gra\u0111anima, zdravstvenom sustavu i inozemnim
  turistima. Informacije o ustanovama su svrstane u sljede\u0107e kategorije: bolnice,
  ordinacije PZZ-a, domovi zdravlja, ljekarne, hitna pomo\u0107, laboratoriji, njega
  u ku\u0107i, zdravstvena skrb, zavod za javno zdravstvo. U periodu od sije\u010dnja
  do svibnja 2013. registrirano je ukupno 4834 poziva prema djelatnicima Bijelog telefona,
  \u0161to je 46 poziva po radnom danu. Ostalo je 524 (10.84%) neodgovorenih. \u0160to
  se ti\u010de strukture upita, njih 27% bilo je vezano uz HZZO, 19% uz bolnice i
  SKZZ, a 18% uz PZZ. Od kraja listopada 2012. na Bijeli telefon je uklju\u010den
  i izbornik eNaru\u010divanje koji se koristi za pitanja osiguranika oko eNaru\u010divanja.
  Unutar \u201eBijelog telefona\\\" uvedena je i mail adresa za osiguranike firstname.lastname@example.org.
  Kontakt centar (Helpdesk) za podr\u0161ku PZZ-u na broju 062 11 22 33 je tijekom
  prvih \u0161est mjeseci 2013. imao ukupno oko 10 tisu\u0107a odgovorenih poziva.
  Tako\u0111er je uveden izbornik eListe \u010dekanja i eNaru\u010divanje namijenjen
  korisnicima unutar zdravstvenog sustava \u2013 PZZ ordinacijama za pomo\u0107 oko
  eNaru\u010divanja te se koristi i za prijavu problema na sustavu eListi i eNaru\u010divanja
  za bolnice. Gra\u0111anima su dostupne informacije o listama \u010dekanja u bolni\u010dkom
  zdravstvenom sustavu na www.hzzo.hr i www.cezih.hr.\\n\\n3. Kori\u0161tenje informacijskih
  tehnologija\\n\\nU podru\u010dju kori\u0161tenja informacijskih tehnologija Akcijskim
  planom predvi\u0111ena je jedna mjera, odnosno 4 provedbene aktivnosti, \u010diji
  je nositelj Ministarstvo uprave.\\n\\nMJERA 7. OSIGURAVANJE TRANSPARENTNOSTI RADA
  TIJELA JAVNE VLASTI U FUNKCIJI OSTVARENJA PRAVA GRA\u0110ANA\\n\\nProvedbena aktivnost
  7.1. Sadr\u017eajno i tehni\u010dko unaprje\u0111enje portala Moja uprava kao funkcionalnog
  servisa koji sadr\u017eava sve informacije o tome kako gra\u0111ani, odnosno korisnici
  mogu ostvariti svoja prava pred tijelima dr\u017eavne uprave.\\n\\nNositelj: Ministarstvo
  uprave\\n\\nRok za po\u010detak provedbe: prosinac 2012.\\n\\nProvedba aktivnosti
  je u tijeku.\\n\\nPovjerenstvo Vlade Republike Hrvatske za koordinaciju informatizacije
  javnog sektora osnovalo je u svibnju 2012. Radnu skupinu za standardizaciju rje\u0161enja
  za korisni\u010dki pristup. Projektni zadatak Radne skupine je izraditi prijedlog
  optimizacije sustava za korisni\u010dki pristup u javnoj upravi (web sustavi, \u0161alteri,
  pozivni centri), koji mora sadr\u017eavati: konkretne mjere za unapre\u0111enje
  sustava Moja uprava u tehni\u010dkom, organizacijskom i sadr\u017eajnom smislu;
  mjere za pretvaranje sustava Moja uprava u jedinstveno su\u010delje za podr\u0161ku
  komunikaciji s korisnicima u svim komunikacijskim kanalima i njihove optimizacije
  te mjere pobolj\u0161anja dostupnosti elektroni\u010dkih usluga putem interneta.
  Prvi sastanak Radne skupine odr\u017ean je 17. svibnja.  Izra\u0111ene su Smjernice
  za dizajn i realizaciju tehni\u010dke podr\u0161ke za nabavu usluga implementacije,
  odr\u017eavanja, podr\u0161ke i razvoja kao preduvjet za provedbu daljnjih planiranih
  aktivnosti. Na temelju ovih dokumenata provedena je javna nabava te se o\u010dekuje
  uspostava novog sredi\u0161njeg dr\u017eavnog portala do kraja 2013. godine.\\n\\nProvedbena
  aktivnost 7.2. Objedinjavanje i povezivanje svih informacija koje se ti\u010du statusa
  fizi\u010dkih i pravnih osoba, a o kojima evidencije vode pojedina tijela javne
  vlasti\\n\\nNositelj: Ministarstvo uprave\\n\\nRok za provedbu: prosinac 2013.\\n\\nProvedba
  aktivnosti je u tijeku.\\n\\nPovjerenstvo Vlade Republike Hrvatske za koordinaciju
  informatizacije javnog sektora osnovalo je u svibnju 2012. Radnu skupinu za temeljne
  registre i elektroni\u010dku razmjenu podataka. Tijekom rada je ustanovljen problem
  nekonzistentnosti registara te je Vladi predlo\u017een \u201ePrijedlog zaklju\u010dka
  o vo\u0111enju i a\u017euriranju temeljnih registara\\\", radi uskla\u0111ivanja
  sadr\u017eaja temeljnih registara sa stvarnim stanjem. Zaklju\u010dkom se Ministarstvo
  uprave obvezuje pripremiti zakon kojim \u0107e se regulirati to podru\u010dje. Ujedno
  se, u okviru Radne skupine, te u suradnji s MATRA-flex projektom Nizozemske priprema
  specifikacija ''Meta registra'' tj. registra koji sadr\u017ei opis ostalih registara.
  Posebni osvrt dan je na\u010dinu financiranja izgradnje i kori\u0161tenja registara.\\n\\nProvedbena
  aktivnost 7.3. Postavljanje sheme informacija drugih tijela dr\u017eavne uprave
  na portal Moja uprava\\n\\nNositelj: Ministarstvo uprave\\n\\nRok za po\u010detak
  provedbe: prosinac 2012.\\n\\nProvedba aktivnosti je u tijeku.\\n\\nU pripremi je
  tehni\u010dka specifikacija jedinstvenog sustava za objavu informacija za ponovno
  kori\u0161tenje od strane tijela dr\u017eavne uprave.\\n\\nProvedbena aktivnost
  7.4. Uspostaviti i redovito unaprje\u0111ivati sustav pru\u017eanja javnih usluga
  putem interneta\\n\\nNositelj: Ministarstvo uprave\\n\\nRok za po\u010detak provedbe:
  prosinac 2012.\\n\\nProvedba aktivnosti je u tijeku.\\n\\nMinistarstvo uprave koordinira
  \\\"istra\u017eivanje o dostupnosti elektroni\u010dkih javnih usluga\\\" (eGovernment
  benchmarking) koje provodi Europska komisija. Rezultati istra\u017eivanja su objavljeni
  u svibnju 2013. na internetskim stranicama Europske komisije te su iskori\u0161teni
  kao podloga u pripremi Programa razvoja elektroni\u010dkih javnih usluga. Program
  razvoja elektroni\u010dkih javnih usluga je objavljen na internetskim stranicama
  Ministarstva uprave i sadr\u017ei upute i smjernice za daljnji razvoj korisni\u010dki
  orijentiranih elektroni\u010dkih usluga i njihovo povezivanje sa sustavom e-Gra\u0111ani.\\n\\nDODATNE
  AKTIVNOSTI U VEZI S KORI\u0160TENJEM INFORMACIJSKIH TEHNOLOGIJA\\n\\nMinistarstvo
  financija, Carinska uprava vodila je u periodu od travnja 2012. do srpnja 2013.
  vi\u0161e razli\u010ditih projekata kori\u0161tenja informacijskih tehnologija u
  svrhu fiskalne transparentnosti, ve\u0107e u\u010dinkovitosti javne uprave te olak\u0161avanja
  rada gospodarstvu u vezi s uvozom, izvozom ili provozom roba te carinskih postupaka
  s gospodarskim u\u010dinkom, npr.:\\n\\n- Intrastat \u2013 Republika Hrvatska je
  ulaskom u EU postala dio jedinstvenog tr\u017ei\u0161ta EU, tj. uspostavljen je
  slobodan promet roba s zemljama \u010dlanicama EU, zbog \u010dega vi\u0161e nije
  mogu\u0107e dobivati podatke o robnoj razmjeni Republike Hrvatske s drugim zemljama
  \u010dlanicama iz jedinstvenih carinskih deklaracija (JCD). Kao zamjena za JCD,
  u Europskoj uniji razvijen je sustav prikupljanja podataka o robnoj razmjeni direktno
  od poslovnih subjekata nazvan \u201eIntrastat\\\", kojega pristupanjem u EU primjenjuje
  i RH;\\n- Uspostava G2B servisa \u2013 radi komunikacije s carinama zemalja \u010dlanica
  te gospodarstvom u okru\u017eenju bez papirnatih dokumenata (e-carina) \u0161to
  podrazumijeva i komunikaciju u elektroni\u010dkom obliku izme\u0111u sudionika u
  carinskom postupku, tj. komunikaciju izme\u0111u carine i gospodarstvenika;\\n-
  EMCS - sustav kontrole kretanja tro\u0161arinskih proizvoda je projekt informatizacije
  Europske unije, zami\u0161ljen i dizajniran kao sustav elektroni\u010dkog pra\u0107enja
  i nadzora kretanja tro\u0161arinskih proizvoda (energenti, alkohol i alkoholna pi\u0107a,
  duhanske prera\u0111evine) u sustavu odgode pla\u0107anja tro\u0161arine me\u0111u
  dr\u017eavama \u010dlanicama EU, kojim je omogu\u0107ena elektroni\u010dka razmjena
  informacija izme\u0111u ovla\u0161tenih gospodarskih subjekata i nadle\u017enih
  tijela u dr\u017eavama \u010dlanicama\\n\\n(administracija nadle\u017enih za tro\u0161arine)
  u cilju u\u010dinkovitog pra\u0107enja i kontrole kretanja tro\u0161arinskih proizvoda
  u sustavu odgode;\\n\\n- HRAIS \u2013  nacionalni automatizirani uvozni sustav (engl.
  Automated Import System) uklju\u010duju\u0107i sustav za obradu uvoznih deklaracija.
  Temelji se na elektroni\u010dkoj uvoznoj carinskoj deklaraciji te elektroni\u010dkoj
  razmjeni podataka izme\u0111u Carinske uprave i gospodarstvenika, \u010dime je omogu\u0107eno
  bezpapirnato poslovanje;\\n- ICS \u2013  za svu robu koja ulazi u carinski teritorij
  EU moraju se provesti uvozne formalnosti, uklju\u010duju\u0107i i sigurnosno-za\u0161titnu
  analizu rizika. U tu svrhu ulaznoj carinarnici se podnosi ulazna sigurnosna skra\u0107ena
  deklaracija koja obuhva\u0107a podatke neophodne za analizu rizika i pravilnu provedbu
  carinskog nadzora prvenstveno za sigurnosno relevantne svrhe. Obrada ulazne sigurnosne
  skra\u0107ene deklaracije (USSD) obavlja se kori\u0161tenjem ra\u010dunalne tehnologije,
  a trans-europski carinski sustav, koji se bavi tom ra\u010dunalnom obradom naziva
  se Sustav kontrole uvoza ili ICS (Import Control System). Razvoj i uvo\u0111enje
  potpuno funkcionalnog ICS sustava jedan je od osnovnih uvjeta koje je Europska komisija
  stavila pred Republiku Hrvatsku prije pristupanja EU;\\n- ECS \u2013 omogu\u0107avanje
  carinarnicama nadle\u017enim za postupke izvoza (izvozne i izlazne carinarnice)
  me\u0111usobnu razmjenu elektroni\u010dkih poruka kojima se automatizira administrativni
  tijek postupka izvoza, omogu\u0107avanje podizanja u\u010dinkovitosti kontrole u
  borbi protiv poreznih i carinskih prijevara, doprinos ubrzanju protoka roba, doprinosi
  pove\u0107anju sigurnosti opskrbnih lanaca;\\n- Uspostava A i B ra\u010duna \u2013
  po pristupanju u EU dio sredstava prikupljenih od carina ostaje u RH kao naknada,
  dok se drugi dio sredstava \u0161alje u prora\u010dun EU. Da bi EU i RH znale koliko
  je sredstava prikupljeno, osigurano i napla\u0107eno, CU je izradila i sustav kojim
  prati zadu\u017eenja sukladno uvozu u RH.\\n\\nMinistarstvo financija, Porezna uprava
  u okviru Projekta modernizacije Porezne uprave koji se financira zajmom Svjetske
  banke proveden je projekt (RAMP/C/03-13/QCBS) \u201eVanjska i unutarnja komunikacija
  Porezne uprave\\\". Provedba projekta trajala je od velja\u010de 2012. do lipnja
  2013. Glavni ciljevi koji su ostvareni su: 1. Izra\u0111ena je Strategija vanjske
  i unutarnje komunikacije; 2. Unaprije\u0111eni su postoje\u0107i i razvijeni novi
  oblici vanjske i unutarnje komunikacije; 3. Izra\u0111en je vizualni identitet Porezne
  uprave; 4. Redizajniran je Internet (vanjski WEB) tako da od srpnja 2013. Porezna
  uprava ima potpuno novu, modernu Internet stranicu s novim funkcionalnostima i lako
  dostupnim informacijama za razli\u010dite skupine poreznih obveznika. U okviru projekta
  IPA 2008 FPP RAC \\\"Razvoj informacijskog sustava za razmjenu informacija o dohotku
  od \u0161tednje u obliku ispla\u0107enih kamata\\\" razvijena je aplikacija za prikupljanje
  informacija/podataka o dohotku od kamata na \u0161tednju, prema Direktivi Vije\u0107a
  2003/48/EZ.\\n\\nPorezna uprava je tako\u0111er pokrenula niz elektroni\u010dkih
  usluga koja omogu\u0107avaju poreznim obveznicima i slu\u017ebenicima Porezne uprave
  jednostavniju i br\u017eu komunikaciju:\\n\\n- ePorezna \u2013 skup elektroni\u010dkih
  usluga Porezne uprave koji omogu\u0107ava svim poreznim obveznicima elektroni\u010dku
  predaju digitalno potpisanih obrazaca, dohvat statusa poslanih obrazaca te uvid
  u porezno-knjigovodstvenu karticu, a sve u cilju jednostavnijeg i br\u017eeg ispunjavanja
  obveza prema Poreznoj upravi. Usluga omogu\u0107ava elektroni\u010dku komunikaciju
  s obveznicima kori\u0161tenjem Interneta kao komunikacijske infrastrukture. U sklopu
  usluge odvija se sigurna razmjena elektroni\u010dkih dokumenata izme\u0111u poreznog
  obveznika i Porezne\\n\\nuprave. Sustav zadovoljava visoke standarde sigurnosti
  kako bi se osigurao siguran i nekompromitiran prijenos podataka u elektroni\u010dkim
  transakcijama.\\n- e-learning - projektom se zna\u010dajno unaprje\u0111uje sustav
  edukacije slu\u017ebenika. O najva\u017enijim temama svi slu\u017ebenici \u0107e
  se educirati kori\u0161tenjem moderne informati\u010dke tehnologije uz smanjenje
  tro\u0161kova. Pripremljeni su prvi moduli i to u vezi s borbom protiv korupcije
  i novostima oko porezu na dodanu vrijednost.\\n- e-nadzor - izvr\u0161ena je implementacija
  elektroni\u010dkog nadzora (e-audit). U okviru projekta instalirane se 52 licence
  za ACL alat za elektroni\u010dki nadzor na prijenosna ra\u010dunala inspektora te
  je obavljena obuka inspektora. Upotrebom alata znatno se smanjuje vrijeme potrebno
  za nadzor najve\u0107ih poreznih obveznika. Projekt je finaliziran i inspektori
  po\u010dinju provoditi e-nadzor.\\n- eOvrha \u2013 Po\u010detkom 2012. godine pokrenut
  je projekt e-Ovrhe s ciljem ve\u0107e efikasnosti i bolje kontrole ovr\u0161nog
  postupka te ekonomi\u010dnosti samog postupka pljenidbe nov\u010danih sredstava
  smanjenjem tro\u0161kova dostave rje\u0161enja o blokadi u Financijsku agenciju.
  Projekt je podijeljen tri faze. Zavr\u0161ena je prava prva faza projekta koja se
  odnosi na elektroni\u010dku dostavu rje\u0161enja o ovrsi nov\u010danih sredstava
  u Financijsku agenciju na izvr\u0161enje. Elektroni\u010dka dostava obavlja se preko
  portala eOvrhe koji omogu\u0107ava efikasnu kontrolu ovr\u0161nog postupka pljenidbom
  nov\u010danih sredstava na na\u010din da se sva izdana rje\u0161enja o ovrsi pljenidbom
  nov\u010danih sredstava nalaze na portalu eOvrhe te u slu\u010daju da neko rje\u0161enje
  nije pravodobno dostavljeno u Financijsku agenciju na izvr\u0161enje, portal \u0107e
  automatski za takvo rje\u0161enje signalizirati da nije na izvr\u0161enju.\\n\\nTako\u0111er,
  u planu su dodatni projekti kojima \u0107e se doprinijeti efikasnosti Porezne uprave
  u provo\u0111enju njenih zada\u0107a, odnosno ja\u010danju njenih kapaciteta.\\n\\nMinistarstvo
  graditeljstva i prostornoga ure\u0111enja je u travnju 2013. predstavilo Informacijski
  sustav prostornoga ure\u0111enja (ISPU), koji je podloga na kojoj \u0107e se temeljiti
  sustav e-dozvole. U jednu cjelinu su spojeni Geoportal, Katastar i prostorni planovi
  \u0161to krajnjem korisniku omogu\u0107ava jednostavan pristup informacijama o pravilima
  kori\u0161tenja prostora. Cilj je posti\u0107i da sustav prostornog ure\u0111enja
  bude transparentan, svima dostupan te da se omogu\u0107i jednostavan nadzor i kontrola
  svih procesa unutar njega. Sustav \u0107e se etapno nadogra\u0111ivati, a trenutno
  izra\u0111eni dio dostupan je na internetskoj stranici Ministarstva (www.mgipu.hr).
  Usporedno se razvija sustav edozvole kao jednog i jedinstvenog akta za gra\u0111enje
  na podru\u010dju cijele dr\u017eave. Po\u010detak kori\u0161tenja aplikacije planira
  se 1. sije\u010dnja 2014. godine. Projekt centraliziranog Sustava bit \u0107e implementiran
  na razini Republike Hrvatske i primjenjivat \u0107e se u svim \u017eupanijama, velikim
  gradovima i gradovima sjedi\u0161tima \u017eupanija koji obavljaju poslove izdavanja
  akata. Ciljevi projekta su: podizanje razine kvalitete usluga vo\u0111enja upravnih
  i neupravnih postupaka kroz jednostavnu i brzu informatizaciju i automatizaciju
  procedure za dono\u0161enje akata; omogu\u0107avanje jednake usluge i uvjeta administrativno
  tehni\u010dke obrade predmeta i izdavanja akata na razini Republike Hrvatske; otvorenost
  i transparentnost sustava prema javnosti i podnositeljima predmeta kroz omogu\u0107avanje
  uvida u vlastiti predmet i njegov trenutni status; izvje\u0161tavanje Naru\u010ditelja
  u stvarnom vremenu o trenutnom i povijesnom stanju obrade predmeta na razini Republike
  Hrvatske; smanjenje tro\u0161kova u vezi s administrativno-tehni\u010dkom obradom
  predmeta i izdavanja akata kroz smanjenje papirnatog volumena dokumentacije, optimizaciju
  i pojednostavljenje proceduralnih zadataka za djelatnike (pove\u0107anje produktivnosti)
  i konsolidaciju podataka u standardne formate i repozitorije (optimizacija resursa);\\n\\nkompletan
  nadzor nad procesom obrade predmeta i transparentnost; omogu\u0107avanje integracije
  s vanjskim tijelima i registrima te upotreba elektroni\u010dkog potpisa. Dodatno,
  Ministarstvo planira, po kona\u010dnoj uspostavi Geoportala prostornih planova,
  sljede\u0107e projekte:\\n\\n- Investicijski portal poduzetni\u010dkih zona RH \u2013
  u suradnji s Ministarstvom poduzetni\u0161tva i obrta\\n- Investicijski portal odobrenih
  istra\u017enih prostora i odobrenih eksploatacijskih polja \u2013 u suradnji s Ministarstvom
  mora\\n- Investicijski portal turisti\u010dkih zona (na dr\u017eavnom zemlji\u0161tu)\\n-
  Investicijski portal energetskog sustava u suradnji s Ministarstvom gospodarstva\\n-
  Povezivanje informati\u010dkog sustava glede za\u0161tite okoli\u0161a i prirode
  u suradnji s Ministarstvom za\u0161tite okoli\u0161a i prirode.\\n\\nMinistarstvo
  poduzetni\u0161tva i obrta od 2008. godine razvija informacijski sustav Registar
  potpora u koji su ugra\u0111ena programska rje\u0161enja za provedbu i pra\u0107enje
  dr\u017eavnih potpora malom gospodarstvu iz programa  poticanja malog i srednjeg
  poduzetni\u0161tva, obrta i zadruga. Postoje\u0107e programsko rje\u0161enje Ministarstva
  omogu\u0107uje cjelovitu obradu prijava poduzetnika, a Registar je od ove godine  tehnolo\u0161ki
  povezan s drugim informacijskim sustavima (FINA, REGOS) \u0161to je zna\u010dajno
  smanjilo broj i tro\u0161kove dokumenata koju podnositelji prijava u sustav potpora
  trebaju podnijeti temeljem javnih poziva. Registar je tako\u0111er povezan s internetskom
  stranicom Ministarstva gdje se u Vodi\u010du za poduzetnike transparentno objavljuju
  informacije u dodjeli potpora (ukupno dodijeljena sredstva, iznosi i subjekti kojima
  je odobrena potpora), a poduzetnici unosom OIB-a mogu dobiti uvid u status svoje
  prijave.\\n\\nIzmjenama i dopunama Zakona o poticanju razvoja malog gospodarstva
  odre\u0111ena je uspostava Sredi\u0161njeg informacijskog sustava malog gospodarstva
  \u2013 SISMG. Umre\u017eavanjem u sredi\u0161nji informacijski sustav malog gospodarstva
  svih ministarstava i jedinica lokalne uprave i samouprave koje poti\u010du razvoj
  malog gospodarstva, odnosno nositelja mjera iz Zakona ostvarit \u0107e se dodana
  vrijednost kroz smanjenje vremena i tro\u0161kova poduzetnika, njihovu bolju informiranost,
  a SISMG \u0107e dodatno doprinijeti daljnjem uklanjanju administrativnih prepreka
  te zna\u010dajno pobolj\u0161ati ekonomi\u010dnost u poslovima Ministarstva. SISMG
  je i antikorupcijski alat.\\n\\nOd travnja 2012. godine, u okviru informacijskog
  sustava Obrtnog registra odra\u0111en je \u010ditav niz projekata i aktivnosti koje
  su rezultirale zna\u010dajnim financijskim u\u0161tedama, efikasnijim i sigurnijim
  radom samog sustava (efikasnije provo\u0111enje upravnog postupka upisa u Obrtni
  registar) i kvalitetnijim uslugama prema vanjskim korisnicima (dnevno oko 3.000
  jedinstvenih \u201eposjetitelja\\\" putem interneta - tijela javne vlasti, gra\u0111ani,
  banke, javni bilje\u017enici, osiguravaju\u0107a dru\u0161tva, obrtnici sada\u0161nji
  i budu\u0107i, trgova\u010dka dru\u0161tva, itd.) uz unaprje\u0111ivanje pristupa
  informacijama u vezi s Obrtnim registrom Republike Hrvatske. Efikasniji i sigurniji
  rad sustava omogu\u0107en je kroz nabavu nove poslu\u017eiteljske opreme, uvo\u0111enjem
  novih tehnologija (virtualizacija), uvo\u0111enjem duple veze sredi\u0161njeg informacijskog
  sustava Obrtnog registra prema internetu (i s interneta), pove\u0107anjem propusnosti
  te veze te uz dodatne organizacijske zahvate. Kvalitetnije usluge, prije svega gra\u0111anima,
  ali i svim ostalim gore navedenim korisnicima Obrtnog registra omogu\u0107ene su
  kroz pouzdaniji i efikasniji rad informacijskog sustava Obrtnog registra, kroz tehnolo\u0161ki
  razvoj te kroz konstantne aktivnosti na podizanju razine kvalitete (\u010di\u0161\u0107enju)
  podataka upisanih u bazu Obrtnog registra. Obrtni registar dostupan je javnosti
  bez\\n\\nnaplate ve\u0107 vi\u0161e godina. U po\u010detku je a\u017eurnost podataka
  na internetu bila sa zadr\u0161kom od jednog dana (uz razinu pouzdanosti znatno
  ni\u017eu od aktualne), dok je nakon najnovijih unapre\u0111enja a\u017eurnost trenutna
  i uvijek u potpunosti a\u017eurni podaci dostupni su bez vremenske zadr\u0161ke,
  u \u201erealnom vremenu\\\". Kvaliteta podataka je zna\u010dajno podignuta (a i
  dalje se kontinuirano radi na tome) zahvaljuju\u0107i softverskim rje\u0161enjima
  koja su aplicirana i koja nadle\u017enim registarskim tijelima konstantno ukazuju
  na postoje\u0107e probleme, a ne dozvoljavaju generiranje novih gre\u0161aka. U
  okviru informacijskog sustava Obrtnog registra realiziran je novi web servis za
  isporuku podataka iz Obrtnog registra, baziran na XML-u. Upravo su u tijeku aktivnosti
  povezivanja novih korisnika tog servisa, Agencije za za\u0161titu okoli\u0161a i
  AKD \u2013 Agencije za komercijalnu djelatnost kojoj je dodijeljena javna ovlast
  upravljanja operativnim dijelom nacionalnog sustava digitalnih tahografa Republike
  Hrvatske te izdavanja memorijskih kartica digitalnog tahografa.\\n\\nMinistarstvo
  pravosu\u0111a je kroz provedbu IPA 2009 \u201eUvo\u0111enje e-Spis-a na odabrane
  op\u0107inske sudove\\\" uvelo elektroni\u010dku uslugu namijenjenu sudskim slu\u017ebenicima
  i cjelokupnoj javnosti \u201eePredmet\\\" koji predstavlja javnu i besplatnu uslugu
  uvida u osnovne podatke o sudskim predmetima \u010dime je unaprije\u0111ena elektroni\u010dka
  usluga za gra\u0111ane, odnosno omogu\u0107en je javan i besplatan pristup osnovnim
  informacijama o sudskim predmetima.\\n\\nMinistarstvo socijalne politike i mladih
  je na svojim internetskim stranicama u\u010dinilo dostupnom aplikaciju pomo\u0107u
  koje svi organizatori volontiranja u Republici Hrvatskoj mogu ispuniti svoju zakonsku
  obvezu izvje\u0161tavanja o broju volontera, volonterskih sati i aktivnosti u protekloj
  godini.\\n\\nMinistarstvo turizma je ostvarilo mjeru uspostave sredi\u0161njeg sustava
  kategoriziranja ugostiteljskih i turisti\u010dkih objekata iz nadle\u017enosti Ministarstva
  turizma, te informacijskog sustava pra\u0107enja i razvoja programa poticanja u
  turizmu, kao i program upisnika turisti\u010dkih zajednica.\\n\\nMinistarstvo unutarnjih
  poslova je realiziralo prvu fazu uvo\u0111enja nove elektroni\u010dke osobne iskaznice.
  U prvoj fazi projekta uvedena je nova, redizajnirana kartica osobne iskaznice s
  unaprije\u0111enim elementima za\u0161tite i osobnim identifikacijskim brojem (OIB)
  nositelja osobne iskaznice, a u drugoj fazi projekta \u0107e se izdavati osobne
  iskaznice s elektroni\u010dkim nosa\u010dem podataka (\u010dipom) koji \u0107e omogu\u0107avati
  digitalni potpis nositelja. Svrha uvo\u0111enja elektroni\u010dke osobne iskaznice
  je poticanje i pra\u0107enje razvoja informacijskog dru\u0161tva te razvoja informacijskog
  sustava dr\u017eavne uprave (e-uprava) i pru\u017eanje korisni\u010dki orijentiranih
  javnih usluga. Od 1. srpnja 2013. zapo\u010delo je i izdavanje novih elektroni\u010dkih
  voza\u010dkih dozvala koje su uskla\u0111ene s Direktivama EU. Postupci zaprimanja
  zahtjeva za izdavanje osobnih iskaznica i voza\u010dkih dozvola su pojednostavljeni
  i gra\u0111ani vi\u0161e ne moraju ispunjavati nikakve obrasce, nego samo svojim
  potpisom na obrascu ispisanom iz informacijskog sustava potvr\u0111uju to\u010dnost
  ispisanih podataka.\\n\\nUvedene su biometrijske dozvole boravka, boravi\u0161ne
  iskaznice i pograni\u010dne propusnice \u010dime je oja\u010dan za\u0161titni element
  nu\u017ean radi sprje\u010davanja krivotvorenja i drugih zlouporaba. Nadalje, pro\u0161irena
  je funkcionalnost Evidencije prebivali\u0161ta te u\u010dinjeno povezivanje s Registrom
  prostornih jedinica Dr\u017eavne geodetske uprave, odnosno uspostava razmjene podataka
  web servisima. Ministarstvu unutarnjih poslova tako\u0111er je\\n\\nomogu\u0107en
  pristup do EURODAC sustava (povezanost na EU sustav) te s informacijskim sustavom
  EUROPOL-a. U sklopu projekta Red Button, izra\u0111ena je internetska stranica za
  prijavu zlostavljanja djece i mlade\u017ei, a proveden je i niz projekata iz podru\u010dje
  za\u0161tite i sigurnosti podataka (sigurna razmjena osobnih podataka gra\u0111ana
  telekomunikacijskim sustavom). Dodatno, putem web servisa omogu\u0107eno je kori\u0161tenje
  podataka tijelima lokalne samouprave u svrhu unaprje\u0111enja njihovih usluga prema
  gra\u0111anima.\\n\\nMinistarstvo uprave, Uprava za e-Hrvatsku kontinuirano radi
  na aktivnostima daljnjeg razvoja i unaprje\u0111enja elektroni\u010dke uprave. Unutar
  tih aktivnosti najzna\u010dajnije su aktivnosti koje se odnose na podr\u0161ku radu
  Povjerenstva za koordinaciju informatizacije javnog sektora kroz vo\u0111enje pripadaju\u0107ih
  radnih skupina nadle\u017enih za pitanja ra\u010dunalnih mre\u017ea, ure\u0111enja
  registara, elektroni\u010dkih identiteta, korisni\u010dkog pristupa, standardizacije
  nabave ICT rje\u0161enja.\\n\\nTreba istaknuti da je zahvaljuju\u0107i me\u0111usobnoj
  koordinaciji i suradnji tijela dr\u017eavne uprave pokrenuta elektroni\u010dka razmjena
  podataka s HZZO-om i HZMO-om kroz sustav OIB, koja je rezultirala u\u0161tedama
  u dr\u017eavnom prora\u010dunu te su prikupljena iskustva koja \u0107e biti korisna
  za spajanje drugih tijela dr\u017eavne uprave, ubrzavanje postupaka, racionalizaciju
  tro\u0161kova te jo\u0161 bolje kori\u0161tenje resursa i rezultata projekta uspostave
  sustava OIB.\\n\\nIspituju se potrebe i mogu\u0107nosti za povezivanje ili integriranje
  postoje\u0107ih ra\u010dunalnokomunikacijskih mre\u017ea javnopravnih tijela s ciljem
  pronalaska u\u010dinkovitih modela za daljnje \u0161irenje tih mre\u017ea, omogu\u0107avanje
  \u0161ire primjene mre\u017enih usluga, multimedijalnih usluga, te posredno i \u0161iru
  dostupnost ostalih usluga javnopravnih tijela svim svojim korisnicima.\\n\\nPokrenut
  je projekt izrade sredi\u0161njeg dr\u017eavnog portala (sustava gov.hr) koji \u0107e
  objediniti informacije i sadr\u017eaje svih internetskih stranica tijela dr\u017eavne
  uprave.\\n\\nZavr\u0161en je pilot projekt Nacionalnog identifikacijskog i autentikacijskog
  sustava (NIAS). Uspostavom sustava gov.hr, sustav NIAS \u0107e postati njegova sastavnica
  koja \u0107e na jedinstveni na\u010din omogu\u0107iti siguran i povjerljiv pristup
  osobnim podacima gra\u0111ana i elektroni\u010dkim uslugama u razli\u010ditim informacijskim
  sustavima javne uprave.\\n\\nU tijeku je provedba pilot projekta sustava za osobni
  korisni\u010dki pristup javnoj upravi u sklopu kojega \u0107e biti omogu\u0107en
  osobni pristup svakog gra\u0111ana putem internetskog sustava osobnim informacijama
  i koji \u0107e tako\u0111er biti sastavni dio sustava gov.hr.\\n\\nPokrenut je pilot
  projekt portala za objavu informacija javnog sektora u cilju pobolj\u0161anja dostupnosti
  podataka javnog sektora na jednom mjestu.\\n\\nPotpisan je sporazum s DLM Forumom
  o pravu prevo\u0111enja europske specifikacije za upravljanje dokumentacijskim sustavima
  MoReq2010 s engleskog na hrvatski jezik, \u0161to predstavlja zna\u010dajnu podr\u0161ku
  unaprje\u0111enju elektroni\u010dkog uredskog poslovanja u svim javnopravnim tijelima.\\n\\nVlada
  RH u prosincu 2012. je imenovala Darka Pari\u0107a, pomo\u0107nika ministra uprave
  za eHrvatsku, Nacionalnim promicateljem informacijskog dru\u0161tva (eng. Digital
  Champion).\\n\\nOdr\u017ean je sastanak s predstavnicima Glavne uprave za komunikacijske
  mre\u017ee, sadr\u017eaj i tehnologiju te je dogovoreno odr\u017eavanje konferencije
  Digital agenda Going local u svibnju 2013.\\n\\nU fazi realizacije su i projekti
  Ministarstva za\u0161tite okoli\u0161a i prirode \u201eRazvoj informacijskog sustava
  za nadzor za\u0161tite prirode\\\" te \u201eNabava opreme za sustav nadzora za\u0161tite
  prirode\\\" (IPA 2009), kojima se utje\u010de na ve\u0107u u\u010dinkovitost javne
  uprave, odnosno Sustava nadzora za\u0161tite prirode. Uz navedeno, ciljevi projekata
  su o\u010duvanje postoje\u0107e bioraznolikosti u Hrvatskoj te pobolj\u0161anje
  razmjene podataka za u\u010dinkovitiju implementaciju Natura 2000 podru\u010dja.\\n\\nMinistarstvo
  znanosti, obrazovanja i sporta provodi vi\u0161e projekata kori\u0161tenja informacijskih
  tehnologija u svrhu podizanja razine usluge i u\u010dinkovitosti:\\n\\n- e-Matica
  :\\n\\nPristup e-Matici imaju sve \u0161kole u zemlji kao i obvezu vo\u0111enja
  potpune evidencije u e-Matici \u010dime je stvorena je centralna baza  podataka
  koja sadr\u017ei zaklju\u010dne ocjene i svjedod\u017ebe u\u010denika, podatke o
  postignu\u0107ima na natjecanjima, administrativne podatke o ustanovama i podatke
  o njihovim djelatnicima.\\n\\nSvaka ustanova ima uvid u sve podatke koje je u bazu
  unijela kao i mogu\u0107nost generiranja izvje\u0161taja.\\n\\nMinistarstvo znanosti,
  obrazovanja i sporta ima stalan uvid u sve podatke u bazi te mogu\u0107nost njihove
  statisti\u010dke obrade \u0161to uvelike poma\u017ee prilikom kontrole obrazovnog
  procesa u \u0161kolama kao i pri planiranju unaprje\u0111enja tih procesa. Zaklju\u010dne
  ocjene, rezultati natjecanja i drugi podaci iz e-Matice se prenose u sustav za e-Upise
  u svrhu bodovanja rezultata u\u010denika za upis u srednju \u0161kolu.\\n\\nZaklju\u010dne
  ocjene i drugi podaci prenose se iz e-Matice u NISpVU (Nacionalni informacijski
  sustav prijava na visoka u\u010dili\u0161ta) u svrhu bodovanja rezultata u\u010denika
  za upis na visoka u\u010dili\u0161ta.\\n\\nE-Matica je povezana i s drugim sustavima
  u nadle\u017enosti Grada Zagreba (GUOS), Hrvatskog zavoda za zapo\u0161ljavanje,
  Porezne uprave (OIB sustav), CARNeta (eDnevnik) i dr.\\n\\nU planu je povezivanje
  e-Matice s Hrvatskim zavodom za mirovinsko osiguranje, ZET-om te sustavom za Centralni
  obra\u010dun pla\u0107a, a e-Matica se kontinuirano nadogra\u0111uje u skladu s
  potrebama Ministarstva i krajnjih korisnika u \u0161kolama u svrhu osiguravanja
  \u0161to potpunije evidencije kao i  \u0161to jednostavnijeg rada s aplikacijom.\\n\\n-
  e-Dnevnik:\\n\\nRije\u010d je o elektroni\u010dkoj ina\u010dici razredne knjige
  koju CARNet kao uslugu nudi \u0161kolama. Sustav je ra\u0111en po uzoru na papirnatu
  razrednu knjigu uz prednosti koje donosi IT poput automatiziranih obavijesti, alarma
  i podsjetnika te mogu\u0107nost statisti\u010dke obrade podataka.\\n\\nVo\u0111enje
  elektroni\u010dke evidencije svih podataka koji su se do sada vodili u papirnatim
  razrednim knjigama omogu\u0107uje stalan uvid u podatke \u0161kolskom osoblju, roditeljima
  i u\u010denicima.\\n\\nBrojna izvje\u0161\u0107a omogu\u0107uju \u0161kolama kontinuirano
  pra\u0107enje tijeka obrazovnog procesa. U\u010denici imaju stalan i za\u0161ti\u0107en
  uvid u svoje ocjene, izostanke i raspored pisanja provjera.  Dovoljan je pristup
  Internetu.\\n\\nRoditelji su svakodnevno automatiziranim e-mailom obavije\u0161teni
  o eventualnim izostancima djeteta.\\n\\nE-Dnevnik je povezan s e-Maticom dvosmjernom
  komunikacijom. E-Dnevnik iz eMatice preuzima raspored u\u010denika po odjelima,
  popis svog nastavnog osoblja i nastavne predmete (na po\u010detku \u0161kolske godine).
  E-Dnevnik e-Matici \u0161alje podatke o zaklju\u010dnim ocjenama (na kraju \u0161kolske
  godine).\\n\\nU planu su:  prilagodba aplikacije za kori\u0161tenje u svim tipovima
  obrazovnih ustanova, kori\u0161tenje usluge e-Dnevnika u \u0161to vi\u0161e \u0161kola
  (200 novih \u0161kola koristit \u0107e uslugu u \u0161k. god. 2013./2014.), omogu\u0107avanje
  nastavnom osoblju \u0161to jednostavnijeg kori\u0161tenja sustava uz sve potrebne
  funkcionalnosti, kontinuirana nadogradnja sustava s obzirom na potrebe krajnjih
  korisnika u \u0161kolama unutar okvira postoje\u0107e regulative.\\n\\n- e-Upisi:\\n\\nE-upisi
  zajedni\u010dki je nazivnik za provo\u0111enje prijava i upisa u srednje \u0161kole
  te prijavu i ispita dr\u017eavne mature i studijskih programa na visokim u\u010dili\u0161tima.
  Navedeno se provodi putem dvaju informacijskih sustava: Nacionalnog informacijskog
  sustava prijava i upisa u srednje \u0161kole (NISpuS\u0160) i Nacionalnog informacijskog
  sustava prijava na visoka u\u010dili\u0161ta (NISpVU).\\n\\nPutem NISpuS\u0160 u\u010denici
  prijavljuju do deset obrazovnih programa u najvi\u0161e 5 \u0161kola, \u0161to je
  zna\u010dajno vi\u0161e u odnosu na prethodne godine. U\u010denicima su tijekom
  cijelog postupka dostupne sve infomracije o obrazovnim programima, bodovanju po
  programima, kvotama i preduvjetima za upis. Osobni podaci kandidata, ocjene i rezultati
  natjecanja te neki ostali elementi koji se vrednuju za upis prenose se u NISpuS\u0160
  iz e-matice, a kandidati u svakome trenutku mogu pratiti stanje na ljestvicama poretka
  do samog zaklju\u010denja lista. Sustav prati i vi\u0161e administracijskih su\u010delja
  za ostale dionike sustava koji sudjeluju u postupku upisa \u2013 osnovne i srednje
  \u0161kole, uredi dr\u017eavne uprave i \u017eupanijski upravni odjeli te Ministarstvo.\\n\\nNISpVU
  je sredi\u0161nji informacijsko-administracijski servis koji kandidatima zainteresiranima
  za polaganje ispita dr\u017eavne mature i nastavka \u0161kolovanja na visoko\u0161kolskoj
  razini zna\u010dajno olak\u0161ava prijavu i upis na visoka u\u010dili\u0161ta.
  Sustav pokriva cijeli proces od iskazivanja interesa za odabrane studijske programe,
  preko prijava ispita dr\u017eavne mature i uvida u njihove rezultate te uvida u
  rezultate po odabranim studijskim programima, pa do ostvarenja prava na upis na
  visoka u\u010dili\u0161ta. Kandidatima omogu\u0107uje brzi i izravan uvid u rezultate
  koje su postigli na ispitima dr\u017eavne mature (uz cjelovit uvid u skenirane ispite
  i ocjenjiva\u010dke listove), daje detaljan izra\u010dun bodova za svaki prijavljeni
  studijski progran prema uvjetima koje propisuju sama visoka u\u010dili\u0161ta po
  svakoj komponenti vrednovanja, kao i uvid u polo\u017eaj koji zauzimaju na ljestvicama
  poretka za svaki od studijskih programa za koje su iskazali zanimanje, od samog
  po\u010detka procesa.\\n\\nNacionalni centar za vanjsko vrednovanje obrazovanja
  i Ministarstvo tijekom cijelog postupka imaju uvid u sve segmente postupka, kao
  i mogu\u0107nost generiranja izvje\u0161taja. Isto je omogu\u0107eno i srednjim
  \u0161kolama i visokim u\u010dili\u0161tima.\\n\\n- E-\u0161kole:\\n\\nCilj projekta
  koji provodi Hrvatska akademska i istra\u017eiva\u010dka mre\u017ea u suradnji s
  Ministarstvom je cjelovita informatizacija \u0161kola na podru\u010du Republike
  Hrvatske s op\u0107im ciljem doprinosa spremnosti u\u010denika za tr\u017ei\u0161te
  rada ili daljnje \u0161kolovanje kroz poticanje \u0161kola za razvoj digitalne zrelosti.
  Digitalna zrelost je spremnost \u0161kole i cijelog obrazovnog sustava na prihva\u0107anje
  i iskori\u0161tavanje potencijala informacijske i komunikacijske tehnologije (IKT)
  u podr\u0161ci unapre\u0111enju\\n\\nnastavnih i psolovnih procesa u \u0161kolama
  i \u0161kolskom sustavu. Projektom se razvija nekoliko bitnih komponenata uklju\u010duju\u0107i
  spajanje \u0161kola na brzi i ultra-brzi Internet, izgradnju lokalnih mre\u017ea
  u \u0161kolama, razvoj e-usluga za poslovne i nastavne procese, primjenu IKT-a u
  nastavi, digitalizaciju obrazovnih sadr\u017eaja, nabavu potrebne IKT opreme za
  \u0161kole i nastvanike te obrazovanje i podr\u0161ku svim sudionicima uklju\u010denima
  u proces informatizacije \u0161kola.\\n\\n- Dr\u017eavna matura i upis na visoka
  u\u010dili\u0161ta:\\n\\nKandidatima su tijekom cijelog procesa dostupne sve informacije
  o studijskim programima, bodovanju po programima i preduvjetima za upis.\\n\\nKandidati
  imaju mogu\u0107nost  prijave najvi\u0161e deset razli\u010ditih studijskih programa
  \u0161to je zna\u010dajno vi\u0161e u odnosu na godine prije uvo\u0111enja elektroni\u010dkih
  prijava i dr\u017eavne mature.\\n\\nKandidati prijavljene studijske programe  trebaju
  poredati tako da na vrh liste stave studijski program koji najvi\u0161e \u017eele
  upisati, a zatim i ostale prema istom kriteriju, \u010dime se jasno izra\u017eava
  \u017eelja svakog kandidata.\\n\\nTransparentno su i jasno vidljivi svi segmenti
  bodovanja koji \u010dine ukupni zbroj bodova svakog kandidata: va\u017ean segment
  bodovanja su rezultati ispita dr\u017eavne mature koji su tako\u0111er transparentno
  evidentirani u sustavu; zaklju\u010dne ocjene i drugi podaci relevantni za bodovanje
  kontinuirano se preuzimaju iz e-Matice.\\n\\nKandidati kontinuirano prate stanje
  na ljestvicama poretka, svoje bodovno stanje kao i ono ostalih kandidata na listama.\\n\\nSrednje
  \u0161kole imaju uvid u prijave svojih u\u010denika i informaciju o njihovim afinitetima
  i \u017eeljama, a naposljetku i o tome koje su studijske programe u\u010denici upisali.\\n\\nVisoka
  u\u010dili\u0161ta imaju uvid u bodovno stanje kandidata koji su prijavili njihove
  studijske programe i informaciju o tome na koje je mjesto na svojoj ljestvici prioriteta
  pojedini kandidat smjestio to visoko u\u010dili\u0161te.\\n\\nSustav kandidatu dodjeljuje
  pravo upisa u onaj studijski program koji se nalazi najvi\u0161e na njegovoj ljestvici
  prioriteta, a za koji ima zadovoljene sve preduvjete i nalazi se unutar upisne kvote.\\n\\nNacionalni
  centar za vanjsko vrednovanje obrazovanja i Ministarstvo znanosti obrazovanja i
  sporta tijekom cijelog upisnog roka ima uvid u sve segmente procesa kao i mogu\u0107nost
  generiranja izvje\u0161taja.\\n\\nHrvatski zavod za zdravstveno osiguranje proveo
  je vi\u0161e projekata kori\u0161tenja informacijskih tehnologija u svrhu podizanja
  u\u010dinkovitosti rada (posebice u kontekstu razmjene elektroni\u010dkih podataka).
  U posljednjih devet mjeseci uvedena je automatizacija prijave gra\u0111ana na zdravstveno
  osiguranje putem elektroni\u010dki dobivenih podataka od HZMO-a za nove korisnike
  u mirovinskom sustavu (umirovljenike, nasljednika mirovine i \u010dlanove njihovih
  obitelji). Za osobe koje stje\u010du pravo, HZMO elektroni\u010dki proslje\u0111uje
  podatke na dnevnoj razini prema HZZO-u, gdje se radi automatska prijava na zdravstveno
  osiguranje nositeljima mirovine i \u010dlanovima njihovih obitelji. Vi\u0161e nije
  potreban dolazak na \u0161alter i dono\u0161enje dokumentacije, poput rodnog lista,
  rje\u0161enja, vjen\u010danog lista, i sl. Takvih prijava je od listopada 2012.
  do danas zaprimljeno oko 29000.\\n\\nNakon pristupanja Hrvatske EU, HZZO je s HZMO-om
  dogovorio i automatsku prijavu za sve izaslane radnike (temeljem tiskanice A1) na
  identi\u010dan na\u010din kao i za umirovljenike. Obveznici uplate (hrvatska poduze\u0107a)
  ne trebaju vi\u0161e dolaziti na \u0161alter za dodatnu\\n\\nprijavu djelatnika
  koje upu\u0107uju na rad u inozemstvo, a podaci dolaze od HZMO-a na identi\u010dan
  na\u010din kao i za umirovljenike.\\n\\nU slu\u010daju stranaca koji ostvaruju pravo
  na zdravstvenu za\u0161titu, sa Ministarstvom unutarnjih poslova dogovorena je elektroni\u010dka
  razmjena podataka sa HZZO-om, \u010dime stranim dr\u017eavljanima vi\u0161e nije
  potrebno dolaziti osobno na \u0161altere HZZO-a.\\n\\nElektroni\u010dkom razmjenom
  podataka izme\u0111u Ministarstva branitelja i HZZO-a posljednje dvije godine se
  regulira ostvarivanje prava na HB iskaznicu (dopunsko osiguranje bez doplate sudjelovanja)
  za sve za sve hrvatske ratne vojne invalide iz Domovinskog rata, hrvatski branitelji
  iz Domovinskog rata koji imaju utvr\u0111en postotak o\u0161te\u0107enja organizma
  od 30% i vi\u0161e, \u010dlanove obitelji smrtno stradalog te zato\u010denog ili
  nestalog hrvatskog branitelja iz Domovinskog rata koji su korisnici i dok su korisnici
  obiteljske invalidnine. Do sada je izdano oko 90.000 iskaznica.\\n\\nOd 1. srpnja
  2013. aktivirana je web aplikacija (http://www.cezih.hr/EhicRequest/request.html)  za
  predaju zahtjeva za dobivanje Europske kartice zdravstvenog osiguranja (EKZO) putem
  Interneta, uno\u0161enjem podataka o OIB-u ili MBO-u pri \u010demu se odmah \u0161alje
  obavijest o mjestu i vremenu podizanja kartice.\\n\\nKao rezultat EU Twinning Projekta
  IPA HR 07 IB-OT-01 \u201eZa\u0161tita zdravlja i sigurnost na radu\\\", dovr\u0161enog
  3. srpnja 2012., sklopljen je Sporazum o razmjeni podataka na podru\u010dju za\u0161tite
  zdravlja i sigurnosti na radu. Navedenim Sporazumom, sklopljenim izme\u0111u Ministarstva
  zdravlja, Ministarstva rada i mirovinskog sustava, Dr\u017eavnog inspektorata, Hrvatskog
  zavoda za za\u0161titu zdravlja i sigurnost na radu te Hrvatskog zavoda za zdravstveno
  osiguranje, utvr\u0111uje se neophodnost suradnje navedenih tijela i institucija
  te razmjena podataka i informacija na podru\u010dju sigurnosti i za\u0161tite zdravlja
  na radu te stvaranje uvjeta za nesmetanu komunikaciju s centralnom bazom podataka.
  Navedena tijela i institucije sporazumno su utvrdile da \u0107e razmjenjivati podatke
  za \u010dije su prikupljanje, obradu, analizu i objavu obvezane propisima Republike
  Hrvatske, po\u0161tuju\u0107i pri tom posebne propise o za\u0161titi osobnih podataka.
  Temeljem navedenog Sporazuma, Hrvatski zavod za zdravstveno osiguranje du\u017ean
  je omogu\u0107iti svakoj sporazumnoj strani nesmetani pristup bazi podataka (Data
  Collector).\\n\\nU tijeku je provedba projekta racionalizacije \u0161alterskog poslovanja
  koja uklju\u010duje ostvarivanje pojedinih prava iz obveznog zdravstvenog osiguranja
  kroz automatsku razmjenu podataka izme\u0111u Zavoda i pojedinih dr\u017eavnih tijela
  i institucija, \u010dime \u0107e se minimizirati potreba osiguranih osoba Zavoda
  da odre\u0111ena prava ostvaruju preko \u0161alterskih slu\u017ebi Zavoda. Prvi
  rezultati ostvareni su u prvom polugodi\u0161tu 2013. godine. U ostvarivanju prava
  i ugovaranju Dopunskog zdravstvenog osiguranja koriste se zajedni\u010dke baze podataka
  o visini ostvarenih prihoda iz Porezne uprave, te Hrvatskog zavoda za mirovinsko
  osiguranje.\\n\\n4. Sudjelovanje gra\u0111ana i civilnog dru\u0161tva\\n\\nU podru\u010dju
  sudjelovanja gra\u0111ana i civilnog dru\u0161tva Akcijskim planom predvi\u0111ene
  su dvije mjere, odnosno 9 provedbenih aktivnosti.\\n\\nMJERA 8. USPOSTAVITI SUSTAV
  SUDIONI\u010cKE IZRADE I PRA\u0106ENJA PROVEDBE DR\u017dAVNOG I LOKALNIH PRORA\u010cUNA\\n\\nProvedbena
  aktivnost 8.1. Podupirati otvorene javne rasprave i savjetovanja s gra\u0111anima
  i organizacijama civilnoga dru\u0161tva kako bi se identificirali prioriteti u raspodjeli
  prora\u010dunskih sredstava\\n\\nNositelj: Ured za udruge Vlade RH\\n\\nRok za po\u010detak
  provedbe: sije\u010danj 2013.\\n\\nAktivnost je kontinuirana i provedba je u tijeku.\\n\\nSukladno
  zaklju\u010dcima Me\u0111uresornog povjerenstva za koordinaciju politike financiranja
  projekata i programa udruga iz dr\u017eavnog prora\u010duna RH, Ured za udruge Vlade
  Republike Hrvatske proveo je javno savjetovanje o Nacrtu Plana natje\u010daja, javnih
  poziva i drugih programa financiranja projekata i programa organizacija civilnoga
  dru\u0161tva iz dr\u017eavnog prora\u010duna u 2013. godini te o Nacrtu prijedloga
  za ujedna\u010davanje formalnih uvjeta za prijavu na natje\u010daja za financiranje
  projekata i programa udruga iz javnih izvora. Savjetovanje je provedeno s ciljem
  dobivanja povratne informacije o tome jesu li predlo\u017eenim prioritetnim podru\u010djima
  zadovoljavaju\u0107e pokrivene postoje\u0107e potrebe na terenu te radi prikupljanja
  prijedloga za u\u010dinkovito ujedna\u010davanje minimalnih formalnih uvjeta za
  prijavu i potrebne natje\u010dajne dokumentacije. Tako\u0111er, jedan od ciljeva
  savjetovanja bio je i raspraviti adekvatnost dosada\u0161njih postupaka pripreme
  i provedbe natje\u010daja, kako bi se omogu\u0107ilo kvalitetnije pra\u0107enje
  rezultata i u\u010dinaka financiranih projekata i programa, u skladu s klju\u010dnim
  strate\u0161kim dokumentima i identificiranim potrebama.\\n\\nU sklopu savjetovanja
  odr\u017eane su dvije javne rasprave, te javno internetsko savjetovanje koje je
  trajalo od 14. do 29. studenog 2012.\\n\\nSukladno prijavama na pozivni natje\u010daj
  za poticanje sudioni\u010dke demokracije i dru\u0161tvenog razvoja u lokalnoj zajednici
  u programskom podru\u010dju \\\"Zajedno za bolje\\\", Nacionalna zaklada za razvoj
  civilnoga dru\u0161tva je odobrila financijska sredstva za 12 projekata poticanja
  sudioni\u010dke demokracije i dru\u0161tvenog razvoja za 12 gradova u Republici
  Hrvatskoj do 30.000 stanovnika. Provedba 12 projekata poticanja sudioni\u010dke
  demokracije i dru\u0161tvenog razvoja zapo\u010dela je u sije\u010dnju 2013. godine
  pa jo\u0161 nema ostvarenih pokazatelja provedbe. Projekti za \u010diju provedbu
  su odobrena sredstva izra\u0111eni su u suradnji s gra\u0111anima, odnosno kroz
  vo\u0111eni proces gradovi su primili stru\u010dnu podr\u0161ku kako bi proveli
  postupa uklju\u010divanja gra\u0111ana u utvr\u0111ivanje jednog relevantnog prioriteta
  na temelju kog je potom pripremljen prijedlog projekta dru\u0161tvenog razvoja u
  doti\u010dnom gradu, za koji se moglo zatra\u017eiti sufinanciranje projekta od
  strane Nacionalne zaklade. Tako\u0111er, po istom klju\u010du, Nacionalna zaklada
  je u lipnju 2013. godine raspisala novi natje\u010daj \u201eZajedno za bolje\\\",
  s provedbom odobrenih podr\u0161ki u 2014. godini, za 5 razvojnih projekata.\\n\\nTako\u0111er,
  na lokalnoj razini postoje primjeri participativnog uklju\u010divanja gra\u0111ana
  u procese definiranja prioriteta u prora\u010dunskoj raspodjeli, poput primjerice
  Grada Rijeke, no ostaje izazov provedba \u0161irih javnih raspravi i savjetovanja
  u ovom podru\u010dju te \u0107e to svakako morati biti jedan od problema na koji
  \u0107e se poku\u0161ati odgovoriti narednim Akcijskim planom.\\n\\nProvedbena aktivnost
  8.2. Omogu\u0107iti sudjelovanje javnih, znanstvenih i stru\u010dnih djelatnika
  i drugih osoba u raspravama na radnim tijelima Hrvatskoga sabora o svim klju\u010dnim
  prora\u010dunskim dokumentima.\\n\\nNositelj: Hrvatski sabor\\n\\nRok za po\u010detak
  provedbe: lipanj 2012.\\n\\nAktivnost je provedena.\\n\\nPoslovnikom Hrvatskog sabora
  (NN br. 81/13) te Pravilnikom o javnosti rada Hrvatskog sabora i radnih tijela (NN
  br. 66/05), propisana je javnost rada Hrvatskog sabora, odnosno radnih tijela. Transparentnost
  i javnost u radu radnih tijela osigurana je na vi\u0161e na\u010dina. Na slu\u017ebenim
  stranicama Hrvatskog sabora (www.sabor.hr) pravovremeno se objavljuju obavijesti
  o odr\u017eavanju predmetnih sjednica radnih tijela te zainteresirana javnost ima
  mogu\u0107nost prijaviti se i sudjelovati na zakazanim sjednicama.\\n\\nPoslovnikom
  Hrvatskog sabora propisano je da javni , znanstveni i stru\u010dni djelatnici mogu
  biti imenovani u radna tijela, sa svim pravima \u010dlana, osim prava odlu\u010divanja.
  Odluke o imenovanju javnih, znanstvenih i stru\u010dnih djelatnika u radna tijela
  Hrvatskoga sabora donesene su na 6. sjednici, 14. prosinca 2012. Poslovnikom je
  tako\u0111er propisano da radno tijelo Sabora mo\u017ee na sjednice pozivati javne,
  znanstvene i stru\u010dne djelatnike te druge osobe radi pribavljanja njihova mi\u0161ljenja
  o pitanjima o kojima se raspravlja na sjednici. Na sjednice Odbora, ovisno o predmetnim
  temama o kojima se raspravlja, pozivaju se predstavnici iz reda javnih, znanstvenih
  i stru\u010dnih djelatnika.\\n\\nProvedbena aktivnost 8.3. Podupirati programe suradnje
  jedinica lokalne i podru\u010dne samouprave i organizacija civilnog drustva u ja\u010danju
  prora\u010dunske transparentnosti i sudjelovanja gra\u0111ana u izradi i pra\u0107enju
  provedbe lokalnih prora\u010duna\\n\\nNositelj: Ured za udruge Vlade RH\\n\\nRok
  za po\u010detak provedbe: sije\u010danj 2013.\\n\\nAktivnost je kontinuirana i provedba
  je u tijeku.\\n\\nU sklopu IPA IV. komponente, 1. velja\u010de 2013. raspisan je
  natje\u010daj za grantshemu Ja\u010danje regionalnih i lokalnih struktura za podr\u0161ku
  razvoju civilnoga dru\u0161tva. Ukupna vrijednost grantsheme iznosi 600.000,00 EUR,
  a op\u0107i cilj natje\u010daja je doprinijeti uravnote\u017eenom regionalnom razvoju
  organizacija civilnoga dru\u0161tva u Republici Hrvatskoj. Neki od o\u010dekivanih
  rezultata projekata unutar spomenute grantsheme odnose se i na izgradnju inovativnih
  mehanizama za sudjelovanje gra\u0111ana u dono\u0161enju i pra\u0107enju provedbe
  lokalnih politika, pa tako i prora\u010duna. Nacionalna zaklada za razvoj civilnoga
  dru\u0161tva i Ured za udruge Vlade Republike Hrvatske, u suradnji s regionalnim
  centrima podr\u0161ke, organizirali su informativne radionice za mogu\u0107e prijavitelje
  na natje\u010daj za dodjelu bespovratnih sredstava \\\"Ja\u010danje regionalnih
  i lokalnih struktura za podr\u0161ku razvoju civilnoga dru\u0161tva\\\". Radionice
  su odr\u017eane tijekom velja\u010de 2013. u Rijeci, Vara\u017edinu, Splitu, Osijeku
  i Zagrebu: http://www.uzuvrh.hr/vijest.aspx?pageID=1&newsID=2200, http://zaklada.civilnodrustvo.hr/upload/File/hr/programi_eu/ipa/vijesti/2013/poziv_i
  nfo_radionice_02.pdf.\\n\\nNacionalna zaklada za razvoj civilnoga dru\u0161tva financirala
  je provedbu istra\u017eivanja \u201eImaju li gra\u0111ani \u0161to za re\u0107i?
  Sudjelovanje OCD-a u dono\u0161enju odluka na lokalnoj razini\\\" koje je provela
  udruga ODRAZ-a na \u010dijoj je stranici u prosincu 2012. i objavljena publikacija:\\n\\nhttp://www.odraz.hr/media/131001/imaju-li-gradani-sto-za-reci-130x200-web.pdf\\n\\nProvedbena
  aktivnost 8.4. Provesti javnu raspravu o financijskim izvje\u0161\u0107ima svih
  trgova\u010dkih dru\u0161tava od posebnog dr\u017eavnog interesa\\n\\nNositelj:
  Ured za udruge Vlade RH\\n\\nRok za provedbu: listopad 2012., listopad 2013.\\n\\nProvedba
  aktivnosti je u tijeku.\\n\\nUZUVRH u suradnji s Ministarstvom pravosu\u0111a, GONG-om,
  TiH-om te stru\u010dnjacima iz Ministarstva financija i Instituta za javne financije
  organizirao je 13. srpnja 2012. u Hrvatskom saboru javnu raspravu  o transparentnosti
  i odgovornosti u poslovanju trgova\u010dkih dru\u0161tava od posebnog dr\u017eavnog
  interesa. Na raspravi su usvojeni zaklju\u010dci i preporuke koje su operacionalizirane
  kroz Akcijski plan uz Strategiju suzbijanja korupcije.\\n\\nSlijedom  navedene rasprave
  u Akcijski plan uz Strategiju suzbijanja korupcije su uklju\u010dene mjere koje
  se, me\u0111u ostalim,  odnose i na ve\u0107u transparentnost donacija i sponzorstava
  kao i poja\u010dane aktivnosti Ministarstva unutarnjih poslova u smislu intenziviranja
  kriminalisti\u010dkih istra\u017eivanja koruptivnih kaznenih djela po\u010dinjenih
  od strane slu\u017ebenih i odgovornih osoba u trgova\u010dkim dru\u0161tvima u ve\u0107inskom
  vlasni\u0161tvu RH. Ujedno, Vlada RH je usvojila Izvje\u0161\u0107e o provedbi Antikorupcijskog
  programa za trgova\u010dka dru\u0161tva u ve\u0107inskom dr\u017eavnom vlasni\u0161tvu
  za razdoblje 2010-2012. Ovo izvje\u0161\u0107e sadr\u017ei niz zaklju\u010daka i
  preporuka o potrebnim daljnjim aktivnostima. Nadalje, Ministarstvo pravosu\u0111a
  je provelo istra\u017eivanje o transparentnosti jedinica lokalne i podru\u010dne
  (regionalne) samouprave na temelju kojeg su prikupljeni podaci o svim trgova\u010dkim
  dru\u0161tvima i javnim ustanovama u vlasni\u0161tvu op\u0107ina, gradova i \u017eupanija.
  I na temelju ovog istra\u017eivanja su izra\u0111eni zaklju\u010dci i preporuke
  koji \u0107e se u budu\u0107em razdoblju implementirati. Spomenuto izvje\u0161\u0107e
  kao i rezultati istra\u017eivanja dostupni su na internetskoj stranici www.antikorupcija.hr.\\n\\nSli\u010dna
  rasprava bit \u0107e organizirana i u listopadu 2013.\\n\\nMJERA 9. POBOLJ\u0160ATI
  PRAKSU SAVJETOVANJA SA ZAINTERESIRANOM JAVNO\u0160\u0106U U DONO\u0160ENJU NOVIH
  ZAKONA, DRUGIH PROPISA I AKATA\\n\\nProvedbena aktivnost 9.1.\\n\\nIzmjenom Poslovnika
  Vlade RH propisati upu\u0107ivanje prijedloga nacrta propisa u obvezni postupak
  savjetovanja (sukladno Kodeksu savjetovanja) te obveznu dostavu izvje\u0161\u0107a
  o provedenom savjetovanju uz prijedlog zakona i drugih propisa Nositelj: Vlada Republike
  Hrvatske, na prijedlog Ureda za udruge Rok za provedbu: rujan 2012.\\n\\nAktivnost
  je provedena u potpunosti.\\n\\nDopunom Poslovnika Vlade Republike Hrvatske (NN
  121/12) provedena je ova aktivnost. Naime, dopunom Poslovnika u \u010dlanku 30.
  stavku 4. propisano je da se prilikom upu\u0107ivanja u proceduru Vlade, uz nacrt
  prijedloga zakona, drugih propisa i akata, prila\u017eu i izvje\u0161\u0107a o provedenom
  savjetovanju sa zainteresiranom javno\u0161\u0107u, ukoliko su takva savjetovanja
  bila provedena, u skladu s posebnim propisom, odnosno Kodeksom savjetovanja sa zainteresiranom
  javno\u0161\u0107u u postupcima dono\u0161enja zakona, drugih propisa i akata.\\n\\nKao
  \u0161to je vidljivo iz opisa provedbe aktivnosti 9.4. ve\u0107 je u 2012. godini
  ostvaren napredak u broju provedenih savjetovanja, ali i ve\u0107em interesu javnosti
  za sudjelovanje u procesima oblikovanja javnih politika, a s obzirom na to da je
  krajem 2012. izmijenjen Poslovnik Vlade u 2013. o\u010dekuju se daljnji pozitivni
  pomaci u vezi s procesima savjetovanja.\\n\\nProvedbena aktivnost 9.2.\\n\\nUspostaviti
  jedinstveni internetski sustav za savjetovanje s javno\u0161\u0107u u dono\u0161enju
  novih zakona, drugih propisa i akata\\n\\nNositelj: Ministarstvo uprave\\n\\nRok
  za provedbu: rujan 2012.\\n\\nProvedba aktivnosti je u tijeku.\\n\\nNa internetskim
  stranicama Ureda za udruge uspostavljena je posebna podstranica posve\u0107ena savjetovanju
  sa zainteresiranom javno\u0161\u0107u na kojoj se redovito objavljuju informacije
  o svim otvorenim i zavorenim savjetovanjima nadle\u017enih dr\u017eavnih tijela.\\n\\nU
  narednom razdoblju predvi\u0111eno je otvaranje posebnog portala posve\u0107enog
  savjetovanju, na kojem bi postojala stalna komunikacija izme\u0111u tijela javne
  vlasti i zainteresirane javnosti o svim propisima u proceduri dono\u0161enja, na
  \u010demu radi Ministarstvo uprave, a sam portal bit \u0107e dio sustava gov.hr,
  odnosno sredi\u0161njeg dr\u017eavnog portala koji bi u ve\u0107em dijelu trebao
  biti uspostavljen do kraja 2013.\\n\\nProvedbena aktivnost 9.3.\\n\\nProvoditi sustavnu
  izobrazbu koordinatora za savjetovanje i ostalih dr\u017eavnih slu\u017ebenika radi
  osposobljavanja za u\u010dinkovitu primjenu Kodeksa savjetovanja Nositelj: Ured
  za udruge Vlade RH\\n\\nRok za po\u010detak provedbe: lipanj 2012.\\n\\nProvedba
  aktivnosti je u tijeku.\\n\\nTijekom prve polovice 2012., Ured za udruge provodio
  je projekt tehni\u010dke pomo\u0107i IPA 2009 Ja\u010danje kapaciteta Vladinog Ureda
  za udruge za izgradnju u\u010dinkovitog partnerstva s organizacijama civilnog dru\u0161tva
  u borbi protiv korupcije \u010diji je cilj bio pobolj\u0161ati suradnju dr\u017eavnih
  tijela i organizacija civilnog dru\u0161tva u suzbijanju korupcije, a glavne aktivnosti
  uklju\u010divale su oblikovanje cjelovitog programa izobrazbe i treninga za koordinatore
  savjetovanja, imenovane u tijelima dr\u017eavne uprave i uredima Vlade Republike
  Hrvatske, odr\u017eavanje nekoliko javnih rasprava te izrada i tisak sveobuhvatnog
  priru\u010dnika za savjetovanje.\\n\\nProgram izobrazbe i treninga za koordinatore
  savjetovanja proveden je kroz tri modula, a temeljem razvijenih modula, Ured za
  udruge razvio je program jednodnevne izobrazbe o provedbi u\u010dinkovitog savjetovanja
  sa zainteresiranom javno\u0161\u0107u u postupcima dono\u0161enja zakona, drugih
  propisa i akata.\\n\\nSpomenuti program uvr\u0161ten je u programe Dr\u017eavne
  \u0161kole za javnu upravu te je 18. velja\u010de 2013. odr\u017ean po prvi puta
  za 20-ak predstavnika tijela dr\u017eavne uprave i ureda Vlade Republike Hrvatske.
  Zbog iznimno velikog interesa za program, drugi termin radionice odr\u017ean je
  ve\u0107 8. o\u017eujka 2013., a na njoj je sudjelovalo dodatnih 20-ak dr\u017eavnih
  slu\u017ebenika. Sljede\u0107a radionica predvi\u0111ena je za po\u010detak listopada
  2013.\\n\\nProvedbena aktivnost 9.4.\\n\\nPripremati godi\u0161nje izvje\u0161taje
  o u\u010dinkovitosti primjene Kodeksa savjetovanja sa zainteresiranom javno\u0161\u0107u
  u dono\u0161enju novih zakona, drugih propisa i akata\\n\\nNositelj: Ured za udruge
  Vlade RH\\n\\nRok za provedbu: velja\u010da 2013.\\n\\nAktivnost je provedena.\\n\\nUred
  za udruge je pripremio izvje\u0161\u0107e o provedbi Kodeksa savjetovanja sa zainteresiranom
  javno\u0161\u0107u u postupcima dono\u0161enja zakona, drugih propisa i akata u
  2012. godini i javno ga objavio sredinom travnja 2013. Izrada Izvje\u0161\u0107a
  doprinos je uspostavi sustava redovitog pra\u0107enja provedbe standarda savjetovanja
  s javno\u0161\u0107u, kao va\u017enog \u010dimbenika dobrog upravljanja i participativnog
  oblikovanja javnih politika u Hrvatskoj.\\n\\nIzvje\u0161\u0107e je izra\u0111eno
  u suradnji s nadle\u017enim ministarstvima i vladinim uredima te pokazuje zna\u010dajan
  napredak u broju provedenih savjetovanja, ali i u interesu predstavnika zainteresirane
  javnosti za sudjelovanjem u postupcima dono\u0161enja zakona, drugih propisa i akata.
  Prema dostavljenim podacima, u 2012. godini tijela dr\u017eavne uprave i vladini
  uredi proveli su postupak savjetovanja sa zainteresiranom javno\u0161\u0107u za
  144 zakona, druge propise i akte. To predstavlja veliki pomak u odnosu na 2011.
  godinu kada je provedeno ukupno 48 savjetovanja. Osim toga, tijekom 2012. zaprimljeno
  je 4786 pisanih prijedloga, o\u010ditovanja zainteresirane javnosti na prijedloge
  zakona, drugih propisa i akata \u0161to je zna\u010dajno pove\u0107anje u odnosu
  na 173 zaprimljena pisana komentara tijekom 2011. godine.\\n\\nProcjenjuje se da
  je napredak u broju provedenih savjetovanja, ali i ve\u0107em interesu javnosti
  za sudjelovanje u procesima oblikovanja javnih politika, izme\u0111u ostalog, rezultat
  zna\u010dajnog ulaganja u sustavnu promociju Kodeksa savjetovanja od strane organizacija
  civilnog dru\u0161tva i Vlade RH (pogotovo putem dru\u0161tvenih mre\u017ea), ali
  i sustavnu izobrazbu nadle\u017enih dr\u017eavnih slu\u017ebenika o primjeni Kodeksa.\\n\\nIzvje\u0161\u0107e
  o provedbi Kodeksa savjetovanja objavljeno je na internetskim stranicama Ureda za
  udruge: http://www.uzuvrh.hr/vijest.aspx?pageID=1&newsID=2341.\\n\\nNa internetskim
  stranicama Ureda za udruge uspostavljena je posebna podstranica posve\u0107ena savjetovanju
  sa zainteresiranom javno\u0161\u0107u, koja pru\u017ea pregled otvorenih i zatvorenih
  savjetovanja: http://www.uzuvrh.hr/savjetovanja.aspx?pageID=221.\\n\\nU narednom
  razdoblju predvi\u0111eno je otvaranje posebnog portala posve\u0107enog savjetovanju,
  na kojem bi postojala stalna komunikacija izme\u0111u tijela javne vlasti i zainteresirane
  javnosti o svim propisima u proceduri dono\u0161enja, na \u010demu radi Ministarstvo
  uprave, a sam portal bit \u0107e dio sustava gov.hr, odnosno sredi\u0161njeg dr\u017eavnog
  portala koji bi u ve\u0107em dijelu trebao biti uspostavljen do kraja 2013.\\n\\nProvedbena
  aktivnost 9.5.\\n\\nUklju\u010diti predstavnike javnih, znanstvenih i stru\u010dnih
  djelatnika u rad radnih tijela Hrvatskoga sabora\\n\\nNositelj: Hrvatski sabor\\n\\nRok
  za provedbu: lipanj 2012.\\n\\nAktivnost je provedena.\\n\\nPoslovnikom Hrvatskog
  sabora (NN br. 81/13) te Pravilnikom o javnosti rada Hrvatskog sabora i radnih tijela
  (NN br. 66/05), propisana je javnost rada Hrvatskog sabora, odnosno radnih tijela.
  Transparentnost i javnost u radu radnih tijela osigurana je na vi\u0161e na\u010dina.\\n\\nNa
  slu\u017ebenim stranicama Hrvatskog sabora (www.sabor.hr) pravovremeno se objavljuju
  obavijesti o odr\u017eavanju predmetnih sjednica radnih tijela te zainteresirana
  javnost ima mogu\u0107nost prijaviti se i sudjelovati na zakazanim sjednicama.\\n\\nPoslovnikom
  Hrvatskog sabora propisano je da javni , znanstveni i stru\u010dni djelatnici mogu
  biti imenovani u radna tijela, sa svim pravima \u010dlana, osim prava odlu\u010divanja.
  Odluke o imenovanju javnih, znanstvenih i stru\u010dnih djelatnika u radna tijela
  Hrvatskoga sabora donesene su na 6. sjednici, 14. prosinca 2012. Poslovnikom je
  tako\u0111er propisano da radno tijelo Sabora mo\u017ee na sjednice pozivati javne,
  znanstvene i stru\u010dne djelatnike te druge osobe radi pribavljanja njihova mi\u0161ljenja
  o pitanjima o kojima se raspravlja na sjednici. Na sjednice Odbora, ovisno o predmetnim
  temama o kojima se raspravlja, pozivaju se predstavnici iz reda javnih, znanstvenih
  i stru\u010dnih djelatnika.\\n\\nDODATNE AKTIVNOSTI U VEZI SA SUDJELOVANJEM GRA\u0110ANA
  I CIVILNOG DRU\u0160TVA\\n\\nMinistarstva redovito provode savjetovanja sa zainteresiranom
  javno\u0161\u0107u u postupcima dono\u0161enja zakona, drugih propisa i akata, te
  informacije o tome objavljuju na slu\u017ebenim internetskim stranicama. Uz internetska
  savjetovanja, pojedina Ministarstva tako\u0111er su u vezi s odre\u0111enim zakonima,
  drugim propisima i aktima organizirala i okrugle stolove, odnosno javne rasprave.
  Tako\u0111er, predstavnici organizacija civilnog dru\u0161tva bili su uklju\u010deni
  u rad vi\u0161e radnih skupina koje su radile na pripremi pojedinih zakonskih prijedloga
  i drugih propisa i akata.\\n\\nMinistarstvo poduzetni\u0161tva i obrta, u svrhu
  informiranja \u0161to ve\u0107eg broja potencijalnih sudionika, informacije o savjetovanjima
  dijeli i putem profila na dru\u0161tvenim mre\u017eama.\\n\\nMinistarstvo rada i
  mirovinskoga sustava formiralo je posebnu internetsku na adresi rasprava.mrms.hr
  stranicu (s poveznicom na naslovnici slu\u017ebene stranice Ministarstva) na kojoj
  se objavljuju prijedlozi zakona, drugih propisa i akata u cilju prethodne javne
  rasprave i savjetovanja sa zainteresiranom javno\u0161\u0107u.\\n\\nMinistarstvo
  gospodarstva o nacrtima prijedloga propisa iz podru\u010dja javne nabave, savjetovanja,
  uz istovremenu objavu na stranicama Ministarstva, provodi i na stranici javnanabava.hr.\\n\\nMinistar
  zdravlja, sa suradnicima, jednom tjedno u sklopu projekta \u201eUdruge \u2013 na\u0161
  partner\\\" odr\u017eava susrete s udrugama pacijenata kako bi se identificirale
  te uklonile te\u0161ko\u0107e pri ostvarivanju prava pacijenata i unaprijedila kvaliteta
  zdravstvene za\u0161tite. Otvorena je i nova elektronska adresa email@example.com
  putem koje gra\u0111ani mogu uputiti upite, zamolbe, prijedloge i sl., a mjese\u010dno
  ih se zaprimi oko 700. Nastavljen je i stari projekt \u201eBijeli telefon\\\", odnosno
  rad besplatne telefonske linije putem koje ra\u0111ani mogu dobiti informacije o
  svim aspektima rada zdravstvenog sustava, a mjese\u010dno se zaprimi oko 900 poziva.\\n\\nMinistarstvo
  vanjskih i europskih poslova u lipnju 2012. odr\u017ealo je konzultacije s predstavnicima
  organizacija civilnog dru\u0161tva na temu me\u0111unarodne razvojne suradnje u
  kontekstu izvje\u0161tavanja \u0161ire javnosti o izmijenjenoj ulozi RH kao zemlje
  donatorice pomo\u0107i, s posebnim osvrtom na ujedna\u010davanje nacionalnih prioriteta
  me\u0111unarodne razvojne suradnje. Navedeno je poslu\u017eilo kao podloga za usvajanje
  Provedbenog programa Nacionalne strategije razvojne suradnje za 2012. godinu, te
  ozna\u010dilo usmjeravanje razvojne pomo\u0107i na nova podru\u010dja koja su od
  hrvatskog vanjskopoliti\u010dkog interesa. U listopadu 2012. godine u MVEP-u je
  odr\u017eana radionica o EU politici razvojne suradnje s osvrtom na nacionalne teritorijalne
  i tematske prioritete. Neposredno prije objave natje\u010daja za potporu udruzi
  koordinatorici Platforme organizacija civilnog dru\u0161tva, odr\u017eane su konzultacije
  s u\u017eim krugom predstavnika zainteresiranih organizacija o adekvatnom institucionalnom
  okviru za pru\u017eanje podr\u0161ke razvoju civilnog dru\u0161tva iz domene me\u0111unarodne
  razvojne suradnje.\\n\\nMinistarstvo pravosu\u0111a i Ministarstvo unutarnjih poslova,
  u partnerstvu s Uredom Visokog povjerenika UN-a za izbjeglice i Hrvatskog pravnog
  centra, provodi projekt \\\"Ja\u010danje hrvatskog civilnog dru\u0161tva u podru\u010dju
  migracija i azila kao pripremu za pristup Republike Hrvatske u Europsku uniju\\\",
  \u010dime se provodi posebna vrsta suradnje izme\u0111u javnog i civilnog sektora,
  te se ostvaruje neposredan uvid civilnog dru\u0161tva u postupanje policijskih slu\u017ebenika
  u podru\u010dju nezakonitih migracija i azila.\\n\\nMinistarstvo branitelja je u
  2012. godini zapo\u010delo s organizacijom javnih tribina posve\u0107enih nestalim
  osobama u Domovinskom ratu, a Uprava za zato\u010dene i nestale Ministarstva branitelja
  usko i kontinuirano sura\u0111uje (kroz zajedni\u010dke sastanke) s organizacijama
  civilnoga dru\u0161tva iz Hrvatske i regije, u cilju \u0161to uspje\u0161nije provedbe
  procesa tra\u017eenja nestalih osoba.\\n\\nPri Uredu za suzbijanje zlouporabe droga
  djeluje besplatna telefonska linija Anti droga telefon (0800-8008) putem koje gra\u0111ani
  mogu anonimno javiti i dobiti informacije u vezi s problematikom droga i tretmana
  ovisnosti.\\n\\nIV. Zaklju\u010dak, ponovna potvrda odlu\u010dnosti za sudjelovanjem
  u Partnerstvu za otvorenu vlast, naredni koraci\\n\\nS obzirom da se provedba Akcijskog
  plana odvija u dobrom dijelu prema planu te da su postavljeni temelji za provedbu
  ve\u0107eg broja predvi\u0111enih provedbenih aktivnosti koje jo\u0161 nisu zavr\u0161ene,
  mo\u017eemo zaklju\u010diti da je provedba inicijative Partnerstvo za otvorenu vlast
  u prvih godinu dana bila u najve\u0107oj mjeri uspje\u0161na.\\n\\nOstvareni su
  neki zna\u010dajni rezultati, posebice u podru\u010dju unaprje\u0111enja savjetovanja
  sa zainteresiranom javno\u0161\u0107u i prava na pristup informacijama, iako i dalje
  ostaju odre\u0111eni izazovi koje treba tek rije\u0161iti u narednom razdoblju.
  Prvenstveno se to odnosi na dio aktivnosti iz podru\u010dja fiskalne transparentnosti,
  ali isto tako i u dijelu koji se odnosi na kori\u0161tenje informacijskih tehnologija
  gdje se tek o\u010dekuju rezultati predvi\u0111eni Akcijskim planom.\\n\\nS druge
  strane, Vlada Republike Hrvatske, odnosno pojedina ministarstva i druga dr\u017eavna
  tijela istovremeno su provela zna\u010dajan broj drugih aktivnosti koje pridonose
  ciljevima postavljenima u Akcijskom planu, a kojima je Vlada Republike Hrvatske
  u proteklih godinu dana dokazala svoju namjeru primjene na\u010dela i standarda
  na koje se obvezala pristupiv\u0161i inicijativi Partnerstvo za otvorenu vlast.\\n\\nImaju\u0107i
  u vidu mnogobrojne koristi koje primjena standarda otvorene vlasti donosi gra\u0111anima,
  ponajprije kroz unaprje\u0111enje pru\u017eanja javnih usluga, ve\u0107u pristupa\u010dnost
  tijela dr\u017eavne uprave te u kona\u010dnici i ve\u0107e povjerenje javnosti kao
  klju\u010dne \u010dimbenike odr\u017eivog ekonomskog i socijalnog razvoja, ali i
  uva\u017eavaju\u0107i potrebu kontinuirane razmjene i uzajamne podr\u0161ke me\u0111u
  dr\u017eavama sudionicama ove globalne inicijative, Vlada Republike Hrvatske odlu\u010dna
  je i dalje  nastaviti s provedbom inicijative Partnerstvo za otvorenu vlast u Republici
  Hrvatskoj. U tom smislu do kraja 2013. zapo\u010det \u0107e izrada novog Akcijskog
