  br. 2023/2053\\n\\n38. obavlja prekrcaj plavoperajne tune protivno \u010dlanku 35.
  stavku 2. Uredbe (EU) br. 2023/2053\\n\\n39. zapovjednik ribarskog plovila na koje
  se obavlja prekrcaj, ili zapovjednikov zastupnik, Ministarstvu najmanje 72 sata
  prije predvi\u0111enog vremena dolaska u luku ne dostavi informacije navedene u
  obrascu prekrcajne deklaracije iz Priloga V. u skladu s \u010dlankom 35. stavkom
  3. Uredbe (EU) br. 2023/2053\\n\\n40. zapovjednici ribarskih plovila koja sudjeluju
  u prekrcaju ne ispune ICCAT-ovu deklaraciju o prekrcaju i ne dostave je Ministarstvu
  u roku od 15 dana nakon dovr\u0161etka prekrcaja u skladu s \u010dlankom 35. stavkom
  5. Uredbe (EU) br. 2023/2053\\n\\n41. ometaju regionalne promatra\u010de u obavljanju
  njihovih du\u017enosti, zastra\u0161uju, upli\u0107u se te utje\u010de na njihov
  rad, protivno \u010dlanku 39. stavku 6. Uredbe (EU) br. 2023/2053\\n\\n42. obavlja
  prebacivanje plavoperajne tune protivno \u010dlanku 40. stavku 1. Ur Uredbe (EU)
  br. 2023/2053\\n\\n43. prilikom prebacivanja plavoperajne tune, ispunjavanja i slanja
