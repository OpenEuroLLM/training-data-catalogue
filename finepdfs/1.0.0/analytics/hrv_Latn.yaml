  | 8.000,00 | Jednostavna nabava | - | NE |  |  |\"", "\"ZASTUPNICAMA I ZASTUPNICIMA\\nHRVATSKOGA
  SABORA\\n\\nPREDsjEDNICAMA I PREDsjEDNICIMA\\nRADnih TIJELA\\n\\nNa temelju \u010dlanka
  178. Poslovnika Hrvatskoga sabora u prilogu upu\u0107ujem Prijedlog zakona o izmjenama
  i dopunama Zakona o morskom ribarstvu, koji je predsjedniku Hrvatskoga sabora podnijela
  Vlada Republike Hrvatske, aktom od 7. prosinca 2023. godine.\\n\\nOvim zakonskim
  prijedlogom uskla\u0111uje se zakonodavstvo Republike Hrvatske sa zakonodavstvom
  Europske unije, te se u prilogu dostavlja i Izjava o njegovoj uskla\u0111enosti
  s pravnom ste\u010devinom Europske unije.\\n\\nZa svoje predstavnike, koji \u0107e
  u njezino ime sudjelovati u radu Hrvatskoga sabora i njegovih radnih tijela, Vlada
  je odredila ministricu poljoprivrede mr. sc. Mariju Vu\u010dkovi\u0107 i dr\u017eavne
  tajnike Mladena Pavi\u0107a, Zdravka Tu\u0161eka i Tugomira Majdaka.\\n\\nGordan
  Jandrokovi\u0107\\n\\nPREDsjEDNIK\\n\\nPREDMET: Prijedlog zakona o izmjenama i dopunama
  Zakona o morskom ribarstvu\\n\\nNa temelju \u010dlanka 85. Ustava Republike Hrvatske
  (\u201eNarodne novine\u201c, br. 85/10. - pro\u010di\u0161\u0107eni tekst i 5/14.
  - Odluka Ustavnog suda Republike Hrvatske) i \u010dlanka 172. Poslovnika Hrvatskoga
  sabora (\u201eNarodne novine\u201c, br. 81/13., 113/16., 69/17., 29/18., 53/20.,
  119/20. - Odluka Ustavnog suda Republike Hrvatske, 123/20. i 86/23. - Odluka Ustavnog
  suda Republike Hrvatske), Vlada Republike Hrvatske podnosi Prijedlog zakona o izmjenama
  i dopunama Zakona o morskom ribarstvu.\\n\\nOvim zakonskim prijedlogom uskla\u0111uje
  se zakonodavstvo Republike Hrvatske sa zakonodavstvom Europske unije, te se u prilogu
  dostavlja i Izjava o njegovoj uskla\u0111enosti s pravnom ste\u010devinom Europske
  unije.\\n\\nZa svoje predstavnike, koji \u0107e u njezino ime sudjelovati u radu
  Hrvatskoga sabora i njegovih radnih tijela, Vlada je odredila ministricu poljoprivrede
  mr. sc. Mariju Vu\u010dkovi\u0107 i dr\u017eavne tajnike Mladena Pavi\u0107a, Zdravka
  Tu\u0161eka i Tugomira Majdaka.\\n\\nPRIJEDLOG ZAKONA O IZMJENAMA I DOPUNAMA\\nZAKONA
  O MORSKOM RIBARSTVU\\n\\nZagreb, prosinac 2023.\\n\\nPRIJEDLOG ZAKONA O IZMJENAMA
  I DOPUNAMA ZAKONA\\nO MORSKOM RIBARSTVU\\n\\nI. USTAVNA OSNOVA ZA DONO\u0160ENJE
  ZAKONA\\n\\nUstavna osnova za dono\u0161enje ovoga Zakona sadr\u017eana je u odredbi
  \u010dlanka 2. stavka 4. podstavka 1. Ustava Republike Hrvatske (\u201eNarodne novine\u201c,
  br. 85/10. \u2013 pro\u010di\u0161\u0107eni tekst i 5/14. \u2013 Odluka Ustavnog
  suda Republike Hrvatske).\\n\\nII. OCJENA STANJA I OSNOVNA PITANJA KOJA SE TREBAJU
  UREDITI\\nZAKONOM TE POSLJEDICE KOJE \u0106E DONO\u0160ENJEM ZAKONA PROISTE\u0106I\\n\\nZakonom
  o morskom ribarstvu (\u201eNarodne novine\u201c, br. 62/17., 130/17., 14/19. i 30/23.)
  (u daljnjem tekstu: va\u017ee\u0107i Zakon) ure\u0111uje se provedba Zajedni\u010dke
  ribarstvene politike Europske unije (u daljnjem tekstu: EU), utvr\u0111uju se na
  nacionalnoj razini ciljevi ribarstvene politike, na\u010din gospodarenja i za\u0161tite
  obnovljivih biolo\u0161kih bogatstava mora, na\u010din i uvjeti obavljanja ribolova,
  prikupljanje podataka i postupanje s njima, upravljanje ribarskom flotom, nadle\u017ena
  tijela za nadzor i kontrolu, provedbu potpore u ribarstvu i ure\u0111enje tr\u017ei\u0161ta,
  kao i druga pitanja bitna za morsko ribarstvo.\\n\\nNovine i dorade koje se predla\u017eu
  ovim Prijedlogom zakona o izmjenama i dopunama Zakona o morskom ribarstvu (u daljnjem
  tekstu: Prijedlog zakona) prvenstveno se odnose na daljnje uskla\u0111ivanje hrvatskog
  regulatornog okvira sa pravnom ste\u010devinom EU te \u0107e se Prijedlogom zakona
  osigurati provedba Uredbe Vije\u0107a (EZ) br. 1100/2007 od 18. rujna 2007. o uvo\u0111enju
  mjera za obnavljanje stoka europske jegulje (SL L 248/17, 18.9.2007.), Uredbe Vije\u0107a
  (EZ) br. 1185/2003 od 26. lipnja 2003 o uklanjanju peraja morskih pasa na plovilima
  (SL L 167/1, 4.7.2003.), Uredbe Vije\u0107a (EEZ) br. 2136/89 od 21. lipnja 1989.
  o utvr\u0111ivanju zajedni\u010dkih tr\u017ei\u0161nih standarda za konzervirane
  srdele (SL L 212/79, 22.6.1989.), Uredbe Vije\u0107a (EEZ) br. 1536/92 od 9. lipnja
  1992. godine o utvr\u0111ivanju zajedni\u010dkih tr\u017ei\u0161nih normi za konzerviranu
  tunu i palamidu (SL L 163/1, 17.6.1992.), Uredbe (EU) 2017/2403 Europskog parlamenta
  i Vije\u0107a od 12. prosinca 2017. o odr\u017eivom upravljanju vanjskim ribarskim
  flotama i stavljanju izvan snage Uredbe Vije\u0107a (EZ) br. 1006/2008 (SL L 347,
  28.12.2017.), Provedbene Uredbe Komisije (EU) 2020/38 od 16. sije\u010dnja 2020.
  kojom se utvr\u0111uju tehni\u010dki operativni zahtjevi za evidentiranje, oblikovanje
  i slanje informacija u skladu s Uredbom (EU) 2017/2403 Europskog parlamenta i Vije\u0107a
  o odr\u017eivom upravljanju vanjskim ribarskim flotama (SL L 13, 17.1.2020.) i Uredbe
  (EU) 2017/2107 Europskog parlamenta i vije\u0107a od 15. studenoga 2017. o utvr\u0111ivanju
  mjera za upravljanje, o\u010duvanje i kontrolu primjenjivih na podru\u010dju primjene
  Konvencije Me\u0111unarodne komisije za o\u010duvanje atlantskih tuna (ICCAT) i
  o izmjeni uredbu Vije\u0107a (EZ) br. 1936/2001, (EZ) br. 1984/2003 i (EZ) br. 520/2007
  (SL L 315 30.11.2017.).\\n\\nS obzirom na stavljanje izvan snage postoje\u0107ih
  i stupanje na snagu novih EU uredbi, Uredba (EZ) br. 1343/2011 Europskog parlamenta
  i Vije\u0107a od 13. prosinca 2011. o odre\u0111enim odredbama za ribolov u podru\u010dju
  Sporazuma o GFCM-u (Op\u0107a komisija za ribarstvo Sredozemlja) i o izmjeni Uredbe
  Vije\u0107a (EZ) br. 1967/2006 o mjerama upravljanja za odr\u017eivo iskori\u0161tavanje
  ribolovnih resursa u Sredozemnom moru (SL L 347, 30.12.2011.) kako je posljednji
  put izmijenjena Uredbom (EU) 2019/982 Europskog parlamenta i Vije\u0107a od 5. lipnja
  2019. o izmjeni Uredbe (EU) br. 1343/2011 o odre\u0111enim odredbama za ribolov
  u podru\u010dju Sporazuma o GFCM-u (Op\u0107a komisija za ribarstvo Sredozemlja)
  (SL L 164, 20.6.2019.) zamjenjuje se Uredbom (EU) 2023/2124 Europskog parlamenta
  i Vije\u0107a od 4. listopada 2023. o odre\u0111enim odredbama za ribolov na podru\u010dju
  Sporazuma o Op\u0107oj komisiji za ribarstvo Sredozemlja (GFCM) (preinaka) (SL L,
  2023/2124, 12.10.2023.), a Uredba (EU)\\n\\n2016/1627 Europskog parlamenta i Vije\u0107a
  od 14. rujna 2016. o vi\u0161egodi\u0161njem planu oporavka plavoperajne tune u
  isto\u010dnom Atlantiku i Sredozemnom moru te o stavljanju izvan snage Uredbe Vije\u0107a
  (EZ) br. 302/2009 (SL L 252, 16.9.2016.) zamjenjuje se Uredbom (EU) 2023/2053 Europskog
  parlamenta i Vije\u0107a od 13. rujna 2023. o uspostavi vi\u0161egodi\u0161njeg
  plana upravljanja plavoperajnom tunom u isto\u010dnom Atlantiku i u Sredozemnome
  moru, izmjeni uredaba (EZ) br. 1936/2001, (EU) 2017/2107 i (EU) 2019/833 te stavljanju
  izvan snage Uredbe (EU) 2016/1627 (SL L 238, 27.9.2023.).\\n\\nU o\u017eujku 2023.
  na snagu su stupile i nove Smjernice o dr\u017eavnim potporama u sektoru ribarstva
  i akvakulture (SL C 107, 23.03.2023.), koje su zamijenile Smjernice za ispitivanje
  dr\u017eavnih potpora u sektoru ribarstva i akvakulture (2015/C 217/01) obuhva\u0107ene
  va\u017ee\u0107em Zakonom. Nove Smjernice, ure\u0111uju dr\u017eavnu potporu u ribarstvu
  i akvakulturi za koju postoji obveza prijave Europskoj komisiji te \u0107e se Prijedlogom
  zakona iste preuzeti u tekst va\u017ee\u0107eg Zakona.\\n\\nNadalje, kako je stupio
  na snagu novi Zakon o pomorskom dobru i morskim lukama (\\\"Narodne novine\\\",
  broj 83/23.), kojim su djelomi\u010dno preuzete odredbe va\u017ee\u0107eg Zakona,
  u dijelu koji se odnosi na proceduru odre\u0111ivanja popisa iskrcajnih mjesta za
  odre\u0111ene vrste ribolovnih alata i segmente flote, Prijedlogom zakona uskladit
  \u0107e se odredbe va\u017ee\u0107eg \u017dakona s novim Zakonom o pomorskom dobru
  i morskim lukama.\\n\\nDodatno, Prijedlogom zakona potrebno je osna\u017eiti sustav
  dodjele ribolovnih mogu\u0107nosti putem ustupanja ograni\u010denih dopu\u0161tenih
  koli\u010dina ulova plavoperajne tune (*Thunnus thynnus*) i osigurati dodjelu dijela
  kvote za ulov plavoperajne tune, kroz postupak javnog natje\u010daja na nacionalnoj
  razini u sklopu gospodarskog i rekreacijskog ribolova.\\n\\nPrijedlogom zakona omogu\u0107i\u0107e
  se i sakupljanje \u017eivih \u0161koljka\u0161a s uzgojnih instalacija uzgajali\u0161ta
  riba od strane nositelja dozvole za akvakulturu, i to nositeljima dozvole koji se
  bave uzgojem \u0161koljka\u0161a, te kori\u0161tenje sakupljenih \u0161koljka\u0161a
  za daljnji uzgoj. Obra\u0161taj \u017eivih \u0161koljka\u0161a koji nastaje na uzgajali\u0161tima
  riba ionako je potrebno periodi\u010dki uklanjati, kako bi se osigurala funkcionalnost
  uzgojnih instalacija, a s obzirom na to da je isti mogu\u0107e iskoristiti kao nasad
  na uzgajali\u0161tima \u0161koljka\u0161a, Prijedlogom zakona stvorit \u0107e se
  za to potrebne zakonske pretpostavke.\\n\\nVezano uz potencijalno te\u0161ke prekr\u0161aje
  za koje se dodjeljuju negativni prekr\u0161ajni bodovi, utvr\u0111eno je kako iznosi
  propisanih nov\u010danih kazni u va\u017ee\u0107em Zakonu nisu sukladni zahtjevima
  Uredbe Vije\u0107a (EZ) br. 1005/2008 od 29. rujna 2008. o uspostavi sustava Zajednice
  za spre\u010davanje, susbijanje i zaustavljanje nezakonitog, neprijavljenog i nereguliranog
  ribolova, o izmjeni uredaba (EEZ) br. 2847/93, (EZ) br. 1936/2001 i (EZ) br. 601/2004
  i o stavljanju izvan snage uredaba (EZ) br. 1093/94 i (EZ) br. 1447/1999 (SL L 286,
  29.10.2008.) (u daljnjem tekstu: Uredba Vije\u0107a (EZ) br. 1005/2008) i Uredbe
  Vije\u0107a (EZ) br. 1224/2009 od 20. studenoga 2009. o uspostavi sustava kontrole
  Zajednice za osiguranje sukladnosti s pravilima zajedni\u010dke ribarstvene politike,
  o izmjeni uredbi (EZ) br. 847/96, (EZ) br. 2371/2002, (EZ) br. 811/2004, (EZ) br.
  768/2005, (EZ) br. 2115/2005, (EZ) br. 2166/2005, (EZ) br. 388/2006, (EZ) br. 509/2007,
  (EZ) br.676/2007, (EZ) br. 1098/2007, (EZ) br. 1300/2008, (EZ) br. 1342/2008 i o
  stavljanju izvan snage uredbi (EEZ) br. 2847/93, (EZ) br. 1627/94 i (EZ) br. 1966/2006
  (SL L 343, 22.12.2009.), kako je posljednji put izmijenjena Uredbom (EU) 2015/812
  Europskog parlamenta i Vije\u0107a od 20. svibnja 2015. o izmjeni uredaba Vije\u0107a
  (EZ) br. 850/98, (EZ) br. 2187/2005, (EZ) br. 1967/2006, (EZ) br. 1098/2007, (EZ)
  br. 254/2002, (EZ) br. 2347/2002 i (EZ) br. 1224/2009 te uredaba (EU) br. 1379/2013
  i (EU) br. 1380/2013 Europskog parlamenta i Vije\u0107a u pogledu obveze iskrcavanja
  i o stavljanju izvan snage Uredbe Vije\u0107a (EZ) br. 1434/98 (SL L 133, 29.5.2015.)
  (u daljnjem tekstu: Uredba Vije\u0107a (EZ) br. 1224/2009), koje propisuju da nov\u010dane
  kazne za te\u0161ke prekr\u0161aje budu razmjern\u0435, odvra\u0107aju\u0107e i
  u\u010dinkovite te \u0107e se Prijedlogom zakona visine kazni za te\u0161ke prekr\u0161aje
  uskladiti sa zahtjevima EU uredbi.\\n\\nU svrhu daljnog uskla\u0111ivanja s odredbama
  Uredbe Vije\u0107a (EZ) br. 1005/2008, Prijedlogom zakona uskladit \u0107e se provo\u0111enje
  inspeksijskih nadzora i istrage kod sumnje na te\u0161ke prekr\u0161aje s \u010dlankom
  43. Uredbe Vije\u0107a (EZ) br. 1005/2008, koji propisuje poduzimanje neposrednih
  izvr\u0161nih mjera, a inspektorima i ovla\u0161tenim osobama tako\u0111er je propisana
  ovlast utvr\u0111ivanja i oduzimanja imovinske koristi ostvarene prekr\u0161ajem
  ili kaznenim djelom.\\n\\nPrijedlogom zakona dopunit \u0107e se prekr\u0161ajne
  odredbe va\u017ee\u0107eg Zakona i to prekr\u0161ajem vezanim uz \u010dlanak 39.
  Uredbe Vije\u0107a (EZ) br. 1005/2008, koji se odnosi na dr\u017eavljane Republike
  Hrvatske koji podr\u017eavaju ili se bave nezakonitim, neprijavljenim ili nereguliranim
  ribolovom (u daljnjem tekstu: NNN ribolov) te te\u0161kim prekr\u0161ajima vezanim
  uz \u010dlanak 42. stavak 1. to\u010dke b) i c) Uredbe Vije\u0107a (EZ) br. 1005/2008,
  koji se odnose na uvoz i trgovinu proizvoda ribarstva, koji su izravno povezani
  s NNN ribolovom, te na krivotvorenie ili uporabu krivotvorenih ili neva\u017ee\u0107ih
  isprava u skladu s Uredbom Vije\u0107a (EZ) br. 1005/2008.\\n\\nIsto tako, i podru\u010dje
  znanstvenog ribolova ovim \u0107e se Prijedlogom zakona dodatno razraditi i uskladiti
  s \u010dlankom 25. Uredbe Vije\u0107a (EU) 2019/1241 Europskog parlamenta i Vije\u0107a
  od 20. lipnja 2019. o o\u010duvanju ribolovnih resursa i za\u0161titi morskih ekosustava
  putem tehni\u010dkih mjera, o izmjeni uredbi Vije\u0107a (EZ) br. 2019/2006, (EZ)
  br. 1224/2009 i uredbi (EU) br. 1380/2013, (EU) 2016/1139, (EU) 2018/973, (EU) 2019/472
  i (EU) 2019/1022 Europskog parlamenta i Vije\u0107a te o stavljanju izvan snage
  uredbi Vije\u0107a (EZ) br. 894/97, (EZ) br. 850/98, (EZ) br. 2549/2000, (EZ) br.
  254/2002, (EZ) br. 812/2004 i (EZ) br. 2187/2005 (SL L 198, 25.7.2019., u daljnjem
  tekstu: Uredba (EU) 2019/1241).\\n\\nTako\u0111er, Prijedlogom zakona, tekst va\u017ee\u0107eg
  Zakona unaprijedit \u0107e se i doraditi u cilju jasnijeg i preciznijeg izri\u010daja,
  te \u0107e se ispraviti uo\u010dene pogre\u0161ke i neispravna pozivanja.\\n\\nIII.
