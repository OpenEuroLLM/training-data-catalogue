  s \u010dlankom 42. stavkom 1. Uredbe (EU) br. 2023/2053\\n\\n44. zapovjednici plovila
  koja obavljaju prebacivanje ne izvje\u0161\u0107uju o svojim aktivnostima u skladu
  s Prilogom II. (\u010dlanak 42. stavak 4. Uredbe (EU) br. 2023/2053)\\n\\n45. informacije
  o mrtoj ribi ne bilje\u017ei u skladu s postupcima utvr\u0111enima u Prilogu XIII
  u skladu s \u010dlankom 42. stavkom 5. Uredbe (EU) br. 2023/2053\\n\\n46. u slu\u010daju
  prebacivanja plavoperajne tune ne osigura da se prebacivanje prati podvodnom videokamerom
  kako bi se provjerio broj riba koje se prebacuje uz pridr\u017eavanje minimalnih
  standarda i postupka za videozapise protivno \u010dlanku 43. stavku 1. Uredbe (EU)
  br. 2023/2053\\n\\n47. zapovjednik ribarskog plovila duljine preko svega 12 i vi\u0161e
