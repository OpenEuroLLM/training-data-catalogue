  i Prilogom XV. stavkom 3. Uredbe (EU) br. 2023/2053\\n\\n48. zapovjednik ribarskog
  plovila duljine preko svega 12 i vi\u0161e metara, koja su uvr\u0161tena na popis
  plovila iz \u010dlanka 26 stavka 1 to\u010dke (a) ili (b) Uredbe (EU) br. 2023/2053
