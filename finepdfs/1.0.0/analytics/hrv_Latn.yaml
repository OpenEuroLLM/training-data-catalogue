  BDM 15. kolovoza\\n\\ndogmatske bule o Marijinu uznesenju Pija XII.: ''Napokon je
  Bezgrje\u0161na Djevica, sa\u010duvana \u010dista od svake ljage isto\u010dnoga
  grijeha, ispuniv\u0161i tijek zemaljskog \u017eivota, s du\u0161om i tijelom bila
  uznesena u nebesku slavu.'' A zatim izri\u010de kristolo\u0161ku svrhovitost te
  Marijine povlastice ovim rije\u010dima: ''Ona je od Gospodina bila uzvi\u0161ena
  sa svojim Sinom, Gospodarom gospodara i pobjednikom nad grijehom i smr\u0107u.''
  Na svetkovinu vjernici hodo\u010daste u mnogobrojna marijanska sveti\u0161ta, a
  uz molitve i euharistijska slavlja, prire\u0111uju se procesije. Blagdan se slavi
  u mnogim dr\u017eavama, najvi\u0161e u Europi i Ju\u017enoj Americi.\\n\\nPrema
  katoli\u010dkoj teologiji, Marijino uznesenje du\u0161om i tijelom na nebo kruna
  je njezina bogomaj\u010dinstva, vje\u010dnog djevi\u010danstva i bezgrje\u0161nog
  za\u010de\u0107a. Nauk o Marijinu uznesenju na nebo po zavr\u0161etku njezina zemaljskoga
  \u017eivota proglasio je \u010dlankom vjere 1. studenoga 1950. papa Pio XII. Iako
  je ta dogma progla\u0161ena tek u novije vrijeme, prethodi joj duga tradicija, stara
  gotovo kao i sama Crkva. Mnogi crkveni oci i sveci poput sv. Bernarda, sv. Antuna
  Padovanskoga i dr., kroz stolje\u0107a su razmatrali i pisali o Marijinu uznesenju
  na nebo. Od 13. stolje\u0107a pa nadalje, \u010ditava je kr\u0161\u0107anska tradicija
  jednodu\u0161na u vjerovanju u Marijino uznesenje na nebo du\u0161om i tijelom.
  Kako obja\u0161njavaju na portalu \u017eupe Svetog Mihajla u Dubrovniku, II. vatikanski
