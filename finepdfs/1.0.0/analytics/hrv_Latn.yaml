  br. 2166/2005, (EZ) br. 388/2006, (EZ) br. 509/2007, (EZ) br. 676/2007, (EZ) br.
  1098/2007, (EZ) br. 1300/2008, (EZ) br. 1342/2008 i o stavljanju izvan snage uredbi
  (EEZ) br. 2847/93, (EZ) br. 1627/94 i (EZ) br. 1966/2006 (SL L 343, 22.12.2009.),
  kako je posljednji put izmijenjena Uredbom (EU) 2015/812 Europskog parlamenta i
  Vije\u0107a od 20. svibnja 2015. o izmjeni uredaba Vije\u0107a (EZ) br. 850/98,
  (EZ) br. 2187/2005, (EZ) br. 1967/2006, (EZ) br. 1098/2007, (EZ) br. 254/2002, (EZ)
