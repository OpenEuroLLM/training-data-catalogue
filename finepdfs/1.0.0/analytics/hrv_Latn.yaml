  Uredba Vije\u0107a (EZ) br. 1224/2009)\\n\\n- Uredbe (EU) br. 508/2014 Europskog
  parlamenta i Vije\u0107a od 15. svibnja 2014. o Europskom fondu za pomorstvo i ribarstvo
  i stavljanju izvan snage uredbi Vije\u0107a (EZ) br. 2328/2003, (EZ) br. 861/2006,
