  2017/218, od 6. velja\u010de 2017. o registru \u010dote Unije (SL L 34, 9. 2. 2017.)\\n\\n-
  Uredbe Vije\u0107a (EZ) br. 1005/2008 od 29. rujna 2008. o uspostavi sustava Zajednice
  za spre\u010davanje, suzbijanje i zaustavljanje nezakonitog, neprijavljenog i nereguliranog
  ribolova, o izmjeni uredaba (EEZ) br. 2847/93, (EZ) br. 1936/2001 i (EZ) br. 601/2004
  i o stavljanju izvan snage uredaba (EZ) br. 1093/94 i (EZ) br. 1447/1999 (SL L 286,
  29.10.2008.; u daljnjem tekstu: Uredba Vije\u0107a (EZ) br. 1005/2008)\\n\\n- Uredbe
  Komisije (EZ) br. 1010/2009 od 22. listopada 2009. o utvr\u0111ivanju detaljnih
  pravila za provedbu Uredbe Vije\u0107a (EZ) br. 1005/2008 o uspostavi sustava Zajednice
  za spre\u010davanje, suzbijanje i zaustavljanje nezakonitog, neprijavljenog i nereguliranog
  ribolova (SL L 280, 27. 10. 2009.)\\n\\n- Uredbe (EU) 2019/473 Europskog parlamenta
  i Vije\u0107a od 19. o\u017eujka 2019. o Europskoj agenciji za kontrolu ribarstva
  (SL L 83, 25. 3. 2019.)\\n\\n- Uredbe Komisije (EU) 2022/2473 od 14. prosinca 2022.
  o proglasenju odre\u0111enih kategorija potpora poduzetnicima koji se bave proizvodnjom,
  preradom i stavljanjem na tr\u017ei\u0161te proizvoda ribarstva i akvakulture spojivima
  s unutarnjim tr\u017ei\u0161tem u primjeni \u010dlanaka 107. i 108. Ugovora o funkcioniranju
  Europske unije (SL L 327, 21. 12. 2022.; u daljnjem tekstu: Uredba Komisije (EU)
  2022/2473)\\n\\n- Uredbe Komisije (EU) br. 717/2014 od 27. lipnja 2014. o primjeni
  \u010dlanaka 107. i 108. Ugovora o funkcioniranju Europske unije na de minimis potpore
  u sektoru ribarstva i akvakulture (SL L 190, 28. 6. 2014.; u daljnjem tekstu: Uredba
  Komisije (EU) br. 717/2014)\\n\\n- Uredbe (EU) 2021/1139 Europskog parlamenta i
  Vije\u0107a od 7. srpnja 2021. o uspostavi Europskog fonda za pomorstvo, ribarstvo
  i akvakulturu i izmjeni Uredbe (EU) 2017/1004 (SL L 247, 13. 7. 2021.; u daljnjem
  tekstu: Uredba (EU) 2021/1139)\\n\\n- Uredbe (EU) 2019/1241 Europskog parlamenta
  i Vije\u0107a od 20. lipnja 2019. o o\u010duvanju ribolovnih resursa i za\u0161titi
  morskih ekosustava putem tehni\u010dkih mjera, o izmjeni uredbi Vije\u0107a (EZ)
  br. 2019/2006, (EZ) br. 1224/2009 i uredbi (EU) br. 1380/2013, (EU) 2016/1139, (E\u00dc)
  2018/973, (EU) 2019/472 i (EU) 2019/1022 Europskog parlamenta i Vije\u0107a te o
  stavljanju izvan snage uredbi Vije\u0107a (EZ) br. 894/97, (EZ) br. 850/98, (EZ)
  br. 2549/2000, (EZ) br. 254/2002, (EZ) br. 812/2004 i (EZ) br. 2187/2005 (SL L 198,
  25. 7. 2019.)\\n\\n- Uredbe (EU) 2019/1154 Europskog parlamenta i Vije\u0107a od
  20. lipnja 2019. o vi\u0161egodi\u0161njem planu oporavka sredozemnog igluna i izmjeni
  Uredbe Vije\u0107a (EZ) br. 1967/2006 i Uredbe (EU) 2017/2107 Europskog parlamenta
  i Vije\u0107a (SL L 188, 12. 7. 2019.)\\n\\n- Uredbe (EZ) br. 1343/2011 Europskog
  parlamenta i Vije\u0107a od 13. prosinca 2011. o odre\u0111enim odredbama za ribolov
  u podru\u010dju Sporazuma o GFCM-u (Op\u0107a komisija za ribarstvo Sredozemlja)
  i o izmjeni Uredbe Vije\u0107a (EZ) br. 1967/2006 o mjerama upravljanja za odr\u017eivo
  iskori\u0161tavanje ribolovnih resursa u Sredozemnom moru (SL L 347, 30. 12. 2011.)
  kako je posljednji put izmijenjena Uredbom (EU) 2019/982 Europskog parlamenta i
  Vije\u0107a od 5. lipnja 2019. o izmjeni Uredbe (EU) br. 1343/2011 o odre\u0111enim
  odredbama za ribolov u podru\u010dju Sporazuma o GFCM-u (Op\u0107a komisija za ribarstvo
  Sredozemlja) (SL L 164, 20. 6. 2019.)\\n\\nPojmovi\\n\\n\u010clanak 3.\\n\\n(1)
  Pojedini pojmovi u smislu ovoga Zakona imaju sljede\u0107a zna\u010denja:\\n\\n1.
  iskrcajna mjesta su dijelovi lu\u010dkog podru\u010dja namijenjena iskrcaju ulova
  ribe i drugih morskih organizama ili njihovih proizvoda iz gospodarskog ribolova
  na moru\\n2. lovostaj je vrijeme u kojem se pojedine vrste riba i drugih organizama
  ne smiju loviti\\n3. mali obalni ribolov je ribolov koji spada u gospodarsku kategoriju
  i koji na temelju povlastice za mali obalni ribolov obavlja fizi\u010dka osoba,
  a koji se obavlja po posebnim uvjetima propisanim ovim Zakonom\\n4. mali ribolov
  je kategorija ribolova za osobne potrebe koja je u potpunosti ukinuta s 31. prosincem
  2014. temeljem Ugovora o pristupanju Republike Hrvatske Europskoj uniji (\u00bbNarodne
  novine\u00ab - Me\u0111unarodni ugovori, br. 2/12.)\\n\\n5. **odgovorna osoba u
  obavljanju gospodarskog ribolova** je ovla\u0161tenik povlastice ako sam obavlja
  ribolov i ima polo\u017een ispit za obavljanje gospodarskog ribolova, odnosno osoba
  koja je polo\u017eila ispit za obavljanje gospodarskog ribolova, a obavlja ribolov
  temeljem punomo\u0107i ovla\u0161tenika povlastice\\n\\n6. **ovla\u0161tenik povlastice
  za gospodarski ribolov** je pravna ili fizi\u010dka osoba - obrtnik koja je upisana
  u povlasticu za gospodarski ribolov na moru i koja je ovla\u0161tena za obavljanje
  ribolova sukladno pravima iz povlastice\\n\\n7. **ovla\u0161tenik povlastice za
  mali obalni ribolov** je fizi\u010dka osoba koja je upisana u povlasticu za mali
  obalni ribolov i koja je ovla\u0161tena za obavljanje ribolova sukladno pravima
  iz povlastice za mali obalni ribolov\\n\\n8. **ovla\u0161teni promatra\u010d** je
  osoba koju je ovlastio ministar za prikupljanje podataka o ribarstvu\\n\\n9. **podru\u010dje
  ograni\u010denog ribolova** zna\u010di svako podru\u010dje u ribolovnom moru Republike
  Hrvatske na kojem su ribolovne aktivnosti ograni\u010dene ili zabranjene\\n\\n10.
  **pomo\u0107no ribarsko plovilo** je plovilo koje slu\u017ei ribarskom plovilu pri
  obavljanju ribolova\\n\\n11. **dozvola za akvakulturu** je isprava na temelju koje
  pravne ili fizi\u010dke osobe smiju obavljati gospodarsku djelatnost uzgoja\\n\\n12.
  **povlastica za mali obalni ribolov** je isprava na temelju koje se obavlja mali
  obalni ribolov i koja se izdaje vlasniku ili korisniku ribarskog plovila koje je
  upisano u povlasticu\\n\\n13. **povlastica za obavljanje gospodarskog ribolova na
  moru** je isprava na temelju koje se obavlja gospodarski ribolov i koja se izdaje
  vlasniku ribarskog plovila koje je upisano u povlasticu\\n\\n14. **prvi kupac**
  je pravna ili fizi\u010dka osoba registrirana u registru prvih kupaca koji vodi
  ministarstvo\\n\\n15. **prijevoznik** je pravna ili fizi\u010dka osoba koja obavlja
  prijevoz proizvoda ribarstva i registrirana je u registru prijevoznika koje vodi
  ministarstvo\\n\\n16. **rang-lista** je popis podnositelja Zahtjeva koji uklju\u010duje
  sve podnositelje Zahtjeva za izdavanje povlastice za mali obalni ribolov koji su
  udovoljili uvjetima i kriterijima tijekom procesa prelaska nositelja odobrenja za
  mali ribolov u kategoriju malog obalnog ribolova temeljem Zakona o morskom ribarstvu
  (\u00bbNarodne novine\u00ab, br. 81/13., 14/14. i 152/14.), i time ostvarili pravo
  na izdavanje povlastice za mali obalni ribolov\\n\\n17. **rekreacijski ribolov**
  je ribolov u svrhu rekreacije koji se obavlja na temelju dozvole za obavljanje rekreacijskog
  ribolova\\n\\n18. **ribar** je fizi\u010dka osoba koja sudjeluje u obavljanju gospodarskog
  ribolova\\n\\n19. **ribarska flota** se odnosi na sva ribarska plovila upisana u
  Registar ribarske flote Republike Hrvatske\\n\\n20. **ribarski monitoring centar**
  je operativni centar uspostavljen od strane ministarstva, opremljen ra\u010dunalnom
  strojnom i programskom opremom koja omogu\u0107uje automatsko primanje, obradu i
  elektroni\u010dki prijenos podataka u svrhu pra\u0107enja i nadzora ribarske flote
  i drugih subjekata koji sudjeluju u ribarstvu, te pru\u017eanje tehni\u010dke podr\u0161ke
  korisnicima\\n\\n21. **ribolov** je ovla\u0161teni lov i sakupljanje ribe i/ili
  drugih morskih organizama, a dijeli se na gospodarski, mali obalni, \u0161portski,
  rekreacijski, ribolov u znanstvene i znanstveno-nastavne svrhe i ribolov za potrebe
  akvarija otvorenih za javnost i ribolovni turizam\\n\\n22. **ribolovac** je fizi\u010dka
  osoba koja obavlja \u0161portski ili rekreacijski ribolov u ribolovnom moru Republike
  Hrvatske\\n\\n23. **ribolovna oprema** je oprema koja po svojoj namjeni omogu\u0107ava
  uporabu ribolovnog alata, a koja se ne upisuje u povlasticu za obavljanje gospodarskog
  ribolova na moru i u povlasticu za mali obalni ribolov\\n\\n24. **ribolovna ronila\u010dka
  oprema** je oprema u koju spadaju ronila\u010dki aparati i priru\u010dna\\n\\noprema
  za sakupljanje morskih organizama\\n\\n25. ribolovna zona je dio ribolovnoga mora
  koji predstavlja biolo\u0161ku, hidrolo\u0161ku i gospodarsku cjelinu, a \u010dije
  su granice odre\u0111ene, a mo\u017ee se sastojati od ribolovnih podzona \u010dije
  su granice odre\u0111ene\\n\\n26. ribolovni turizam je gospodarski ribolov na moru
  u okviru pru\u017eanja usluga u turizmu koje obavljaju ovla\u0161tenici povlastica
  za obavljanje gospodarskog ribolova na moru\\n\\n27. \u0161portski ribolov je ribolov
  u svrhu \u0161porta koji se obavlja na temelju dozvole za obavljanje \u0161portskog
  ribolova\\n\\n28. vlasnik plovila je fizi\u010dka ili pravna osoba koja je kao vlasnik
  upisana u upisnik brodova Republike Hrvatske ili o\u010devidnik brodica Republike
  Hrvatske\\n\\n29. zapovjednik ribarskog plovila je odgovorna osoba u obavljanju
  gospodarskog ribolova na ribarskom plovilu.\\n\\n(2) Ostali pojmovi u smislu ovoga
  Zakona imaju jednako zna\u010denje kao pojmovi definirani posebnim propisima i Uredbama
  iz \u010dlanka 2. ovoga Zakona.\\n\\nNaknada za ribolov\\n\\n\u010clanak 13.\\n\\n(1)
  Za obavljanje ribolova pla\u0107a se naknada.\\n\\n(2) U slu\u010daju provedbe mjera
  iz \u010dlanka 12. stavka 1. to\u010daka 7. i 9. ovoga Zakona za raspolaganje ustupljenom
  dopu\u0161tenom koli\u010dinom ulova po plovilu pla\u0107a se naknada, a na\u010din
  ustupanja, uvjete i kriterije za ostvarivanje prava na ustupanje i vrijeme raspolaganja
  ustupljenom dopu\u0161tenom koli\u010dinom ulova po plovilu, kao i visinu naknade
  za svaku vrstu koja podlije\u017ee ovakvom na\u010dinu upravljanja propisuje ministar
  pravilnikom. Ustupljena dopu\u0161tena koli\u010dina ulova po plovilu ne mo\u017ee
  se jednokratno dati na raspolaganje na razdoblje du\u017ee od deset godina.\\n\\n(3)
  Sredstva prikupljena od naknada iz stavaka 1. i 2. ovoga \u010dlanka prihod su dr\u017eavnog
  prora\u010duna i koriste se za financiranje dodjele dr\u017eavnih potpora u ribarstvu
  iz \u010dlanka 55. stavka 1. podstavka 2. ovoga Zakona, izradu znanstvenih i stru\u010dnih
  studija i podloga, nadzor i kontrolu ribarstva te informati\u010dku podr\u0161ku
  u ribarstvu.\\n\\n(4) Iznimno od odredbe stavka 3. ovoga \u010dlanka, dio sredstava
  prikupljenih od dozvola za \u0161portski ili rekreacijski ribolov u za\u0161ti\u0107enim
  podru\u010djima prihod je javne ustanove koja upravlja podru\u010djem za\u0161ti\u0107enim
  prema odredbama propisa o za\u0161titi prirode i namijenjen je za\u0161titi prirode.\\n\\n(5)
  Visinu naknada za pojedinu vrstu ribolova, na\u010din uplate i kori\u0161tenje prikupljenih
  sredstava propisuje ministar pravilnikom, a u dijelu koji se odnosi na odredbu iz
  stavka 4. ovoga \u010dlanka uz prethodno mi\u0161ljenje ministra nadle\u017enog
  za poslove za\u0161tite prirode.\\n\\nRibolov na ozna\u010denim mjestima\\n\\n\u010clanak
  14.\\n\\n(1) Na mjestima ozna\u010denim u slu\u017ebenim pomorskim publikacijama
  na kojima se nalaze podmorski kabeli i cjevovodi, kao i hidroarheolo\u0161ka nalazi\u0161ta
  i nalazi, zabranjen je ribolov uz upotrebu pridnenih povla\u010dnih alata.\\n\\n(2)
  Na podru\u010dju uzgajali\u0161ta i na udaljenosti manjoj od 300 metara od oznake
  polo\u017eaja\\n\\nuzgajali\u0161ta, odnosno 50 metara za podru\u010dja gdje se
  obavlja uzgoj \u0161koljka\u0161a, odnosno granice koncesijskog podru\u010dja, zabranjeno
  je obavljanje ribolova i drugih radnji koje mogu ometati djelatnost uzgoja.\\n\\n(3)
  Iznimno od stavka 2. ovoga \u010dlanka, u slu\u010daju bijega ribe iz uzgojnih kaveza,
  ministar mo\u017ee, na zahtjev nositelja dozvole za akvakulturu na podru\u010dju
  uzgajali\u0161ta, rje\u0161enjem dopustiti obavljanje ribolova, u svrhu vra\u0107anja
  odbjegle ribe.\\n\\n(4) Iznimno od stavka 2. ovoga \u010dlanka, za potrebe za\u0161tite
  proizvodnje \u0161koljka\u0161a od predatora, ministar mo\u017ee rje\u0161enjem
  dopustiti ribolov unutar koncesioniranog dijela pomorskog dobra odre\u0111enim ribolovnim
  alatima, na\u010dinima ribolova i u odre\u0111enom razdoblju na zahtjev nositelja
  dozvole za akvakulturu.\\n\\n(5) Protiv rje\u0161enja iz stavaka 3. i 4. ovoga \u010dlanka
  nije dopu\u0161tena \u017ealba, ali se mo\u017ee pokrenuti upravni spor.\\n\\n(6)
  Iznimno od odredbe stavka 1. ovoga \u010dlanka, na podru\u010djima hidro arheolo\u0161kih
  nalazi\u0161ta i nalaza ministar \u0107e dodatno pravilnikom propisati ograni\u010denja
  u obavljanju ribolova, uz prethodno mi\u0161ljenje ministra nadle\u017enog za poslove
  kulture.\\n\\nGospodarski ribolov\\n\\n\u010clanak 15.\\n\\n(1) Gospodarski ribolov
  smije obavljati ovla\u0161tenik povlastice za gospodarski ribolov, odnosno ovla\u0161tenik
  povlastice za mali obalni ribolov, plovilom, ribolovnim alatima, ribolovnom ronila\u010dkom
  opremom i u ribolovnim zonama, koji su upisani u povlasticu te u me\u0111unarodnim
  vodama sukladno propisima kojima se regulira ribolov u tim podru\u010djima i ovom
  Zakonu.\\n\\n(2) Iznimno od stavka 1. ovoga \u010dlanka, ribolovni alati upisani
  u povlasticu za koje je potrebno Odobrenje iz \u010dlanka 26. ovoga Zakona smiju
  se koristiti i nalaziti na plovlilu samo uz valjano Odobrenje.\\n\\n(3) Za ribolov
  u podru\u010djima s posebnim re\u017eimom upravljanja te za vrste koje podlije\u017eu
  ograni\u010denjima ulova ministar odlukom donosi popis plovlja koja smiju obavljati
  ribolov.\\n\\n(4) Za vrijeme obavljanja gospodarskog ribolova na plovlilu se smiju
  nalaziti samo ribolovni alati koji su upisani u povlasticu za obavljanje gospodarskog
  ribolova na moru.\\n\\n(5) Za vrijeme obavljanja gospodarskog ribolova, od polaska
  do povratka, na ribarskom plovlilu mora biti odgovorna osoba u obavljanju gospodarskog
  ribolova.\\n\\n(6) Gospodarski ribolov \u017eivih \u0161koljka\u0161a, bodljika\u0161a,
  pla\u0161tenjaka i morskih pu\u017eeva mo\u017ee se obavljati samo pod uvjetima
  i na podru\u010djima utvr\u0111enim propisima o hrani.\\n\\n(7) Odredbe \u010dlanka
  50. Uredbe Vije\u0107a (EZ) br. 1224/2009 koje se odnose na prolazak ribarskog plovlila
  i ribolovne alate na plovlilu tijekom prolaska kroz podru\u010dje ograni\u010denog
  ribolova primjenjuje se na odgovaraju\u0107i na\u010din i na ribarska plovlila \u010dija
  duljina preko svega iznosi manje od 12 metara.\\n\\n(8) Ministarstvo \u0107e na
  zahtjev nositelja dozvole za akvakulturu rje\u0161enjem dopustiti ribolov odre\u0111enih
  vrsta riba i sakupljanje drugih morskih organizama koji su upisani u dozvolu, a
  \u010dije su veli\u010dine ispod minimalne referentne veli\u010dine za o\u010duvanje
  na odre\u0111enom dijelu ribolovnog mora, na odre\u0111eno vrijeme i odre\u0111enim
  ribolovnim alatima, a namijenjeni su isklju\u010divo u svrhu uzgoja.\\n\\n(9) Protiv
  rje\u0161enja iz stavka 8. ovoga \u010dlanka nije dopu\u0161tena \u017ealba, ali
  se mo\u017ee pokrenuti upravni spor.\\n\\nPohranjivanje povlastica za obavljanje
  gospodarskog ribolova na moru\\n\\n\u010clanak 18.\\n\\n(1) Povlasticu za obavljanje
  gospodarskog ribolova na moru vlasnik plovila upisanog u povlasticu mora pohraniti
  u ministarstvu:\\n\\n- kada se plovilo namjerava upotrebljavati u druge svrhe, a
  ne u svrhu obavljanja gospodarskog ribolova u neprekidnom trajanju vi\u0161e od
  tri mjeseca\\n\\n- ako ovla\u0161tenik povlastice za gospodarski ribolov vi\u0161e
  ne udovoljava uvjetima za izdavanje povlastice iz \u010dlanka 17. stavka 3. ovoga
  Zakona\\n\\n- u slu\u010daju nesposobnosti plovila za plovidbu ili zabrane isplovljenja
  plovilom koju je izdalo ministarstvo nadle\u017eno za pomorstvo.\\n\\n(2) Zahtjev
  za pohranom povlastice za obavljanje gospodarskog ribolova na moru vlasnik plovila
  mora podnijeti ministarstvu:\\n\\n- najkasnije 30 dana prije po\u010detka uporabe
  plovila u druge svrhe iz stavka 1. podstavka 1. ovoga \u010dlanka i\\n\\n- u roku
  od 15 dana od dana nastanka okolnosti iz stavka 1. podstavaka 2. i 3. ovoga \u010dlanka.\\n\\n(3)
  Ministarstvo izdaje potvrdu o pohrani povlastice vlasniku plovila.\\n\\n(4) Povlasticu
  za obavljanje gospodarskog ribolova na moru pohranjuje ministarstvo po slu\u017ebenoj
  du\u017enosti:\\n\\n- kada se na plovilu na koje se odnosi povlastica pove\u0107a
  snaga pogonskog stroja ili tona\u017ea plovila bez prethodnog odobrenja ministarstva\\n\\n-
  u slu\u010daju prodaje ili darovanja plovila bez povlastice\\n\\n- ako se plovilom
  obavlja druga djelatnost dulje od tri mjeseca, a povlastica nije pohranjena\\n\\n-
  ako je odre\u0111ena prekr\u0161ajna mjera privremenog oduzimanja povlastice za
  obavljanje gospodarskog ribolova na moru na temelju izre\u010denih negativnih prekr\u0161ajnih
  bodova u skladu s \u010dlankom 79. ovoga Zakona\\n\\n- u slu\u010daju smrti fizi\u010dke
  osobe vlasnika plovila.\\n\\n(5) Povlastica pohranjena na zahtjev vlasnika plovila
  preuzima se iz pohrane na njegov zahtjev, a prilikom preuzimanja moraju biti zadovoljeni
  svi uvjeti kao i za izdavanje povlastice.\\n\\n(6) Povlastica za obavljanje gospodarskog
  ribolova na moru pohranjuje se u ministarstvo na rok od najvi\u0161e dvije godine
  te se rok pohrane mo\u017ee dodatno produ\u017eiti u slu\u010daju havarije ili vi\u0161e
  sile, na zahtjev vlasnika plovila za produljenje roka pohrane.\\n\\n(7) Uzastopno
  produljenje roka pohrane za dodatne dvije godine sukladno stavku 6. ovoga \u010dlanka
  mo\u017ee se zatra\u017eiti samo jednom za svaku povlasticu za obavljanje gospodarskog
  ribolova na moru.\\n\\n(8) Iznimno od stavka 6. ovoga \u010dlanka, u slu\u010daju
  potonu\u0107a plovila nakon 1. srpnja 2013. rok pohrane povlastice za gospodarski
  ribolov na moru mo\u017ee biti najvi\u0161e deset godina.\\n\\n(9) O pohrani povlastice
  za obavljanje gospodarskog ribolova na moru po slu\u017ebenoj du\u017enosti ministarstvo
  donosi rje\u0161enje protiv kojeg nije dopu\u0161tena \u017ealba, ali se mo\u017ee
  pokrenuti upravni spor.\\n\\n(10) Povlastica za obavljanje gospodarskog ribolova
  na moru pohranjena po slu\u017ebenoj du\u017enosti mo\u017ee se preuzeti na zahtjev
  vlasnika plovila nakon \u0161to isteknu razlozi za njezinu pohranu, o \u010demu
  ministarstvo donosi rje\u0161enje protiv kojeg nije dopu\u0161tena \u017ealba, ali
  se mo\u017ee pokrenuti upravni spor.\\n\\n(11) Povlastica za obavljanje gospodarskog
  ribolova na moru pohranjena po slu\u017ebenoj du\u017enosti u skladu sa stavkom
  4. ovoga \u010dlanka mo\u017ee se preuzeti na zahtjev vlasnika plovila:\\n\\n- u
  slu\u010daju iz stavka 4. podstavka 1. ovoga \u010dlanka ako vlasnik plovila vrati
  snagu motora u kW ili tonazu plovila u GT u prvobitno stanje ili ih smanji u odnosu
  na prvobitno stanje, odnosno u slu\u010daju ustupanja kapaciteta iz \u010dlanka
  40. stavka 7. ovoga Zakona, po dono\u0161enju rje\u0161enja o izmjeni podataka o
  snazi motora i/ili veli\u010dini plovila u GT na temelju Izjave o ustupanju kapaciteta\\n\\n-
  u slu\u010daju iz stavka 4. podstavka 2. ovoga \u010dlanka ako biv\u0161i vlasnik
  plovila koje je upisano u povlasticu zamijeni plovilo u povlastici novim plovilom
  sukladno uvjetima propisanim ovim Zakonom\\n\\n- u slu\u010daju iz stavka 4. podstavaka
  3. ovoga \u010dlanka ako je prestala okolnost zbog koje je povlastica pohranjena.\\n\\n(12)
  Prilikom preuzimanja povlastice za obavljanje gospodarskog ribolova na moru moraju
  biti ispunjeni svi uvjeti kao i za izdavanje povlastice.\\n\\n(13) Ministarstvo
  vodi Upisnik pohranjenih povlastica za obavljanje gospodarskog ribolova na moru
  u elektroni\u010dkom obliku.\\n\\n(14) Na\u010din vo\u0111enja i sadr\u017eaj Upisnika
  pohranjenih povlastica za obavljanje gospodarskog ribolova na moru propisuje ministar
  pravilnikom.\\n\\n\u010clanak 19.\\n\\n(1) Povlastica za obavljanje gospodarskog
  ribolova na moru ukinut \u0107e se:\\n\\n- na zahtjev vlasnika plovila na koje je
  izdana povlastica za obavljanje gospodarskog ribolova na moru\\n\\n- ako se utvrdi
  da vi\u0161e nisu zadovoljeni uvjeti za izdavanje povlastice, a povlastica nije
  pohranjena u skladu s odredbama iz \u010dlanka 18. ovoga Zakona\\n\\n- ako vlasnik
  plovila za koje je izdana povlastica za obavljanje gospodarskog ribolova na moru
  ne preuzme povlasticu iz pohrane od ministarstva u roku propisanom \u010dlankom
  18. stavkom 5. ovoga Zakona\\n\\n- ako se rje\u0161enjem trajno ukida povlastica
  za obavljanje gospodarskog ribolova na moru na temelju izre\u010denih negativnih
  prekr\u0161ajnih bodova u skladu s \u010dlankom 80. stavkom 3. ovoga Zakona.\\n\\nPovlastice
  za obavljanje gospodarskog ribolova na moru u dr\u017eavnom vlasni\u0161tvu\\n\\n\u010clanak
  20.\\n\\n(1) Povlastica za obavljanje gospodarskog ribolova na moru ukinuta temeljem
  \u010dlanka 19. stavka 1. podstavaka 2., 3. i 4. ovoga Zakona prelazi u dr\u017eavno
  vlasni\u0161tvo te dr\u017eava raspolaze kapacitetom plovila koje je u nju bilo
  upisano, kao i svim ribolovnim alatima po ribolovnim zonama upisa.\\n\\n(2) Ministarstvo
  vodi Registar povlastica za gospodarski ribolov u dr\u017eavnom vlasni\u0161tvu
  u elektroni\u010dkom obliku te vodi evidenciju o ukupnom kapacitetu plovila koja
  su u njih bila upisana, kao i o ribolovnim alatima po ribolovnim zonama upisa.\\n\\n(3)
  Povlastica u dr\u017eavnom vlasni\u0161tvu s pripadaju\u0107im kapacitetom plovila
  i s pravima na ribolovne alate i ribolovne zone upisane u povlasticu mo\u017ee se
  isklju\u010divo u cijelosti dodijeliti fizi\u010dkoj ili pravnoj osobi registriranoj
  za obavljanje gospodarskog ribolova putem natje\u010daja koji provodi ministarstvo.\\n\\n(4)
  Uvjeti za dodjelu povlastice za obavljanje gospodarskog ribolova na moru su:\\n\\n-
  prebivali\u0161te fizi\u010dke osobe ili sjedi\u0161te pravne osobe na podru\u010dju
  priobalnih gradova ili op\u0107ina Republike Hrvatske dulje od pet godina\\n\\n-
  zadovoljavanje uvjeta za izdavanje povlastica prema \u010dlanku 17. stavku 3. ovoga
  Zakona.\\n\\n(5) Kriterije vezane uz dodjelu prava iz povlastica za obavljanje gospodarskog
  ribolova na moru u dr\u017eavnom vlasni\u0161tvu, na\u010din provedbe natje\u010daja
  te sadr\u017eaj i na\u010din vo\u0111enja Registra povlastica za gospodarski ribolov
  u dr\u017eavnom vlasni\u0161tvu i evidenciju prava koja proizlaze iz povlastica
  u dr\u017eavnom vlasni\u0161tvu propisuje ministar pravilnikom.\\n\\nStru\u010dna
  osposobljenost za obavljanje gospodarskog ribolova\\n\\n\u010clanak 21.\\n\\n(1)
  Stru\u010dna osposobljenost za obavljanje gospodarskog ribolova dokazuje se potvrdom
  o stru\u010dnoj osposobljenosti za obavljanje gospodarskog ribolova (u daljnjem
  tekstu: potvrda za gospodarski ribolov) koju izdaje ministarstvo.\\n\\n(2) Potvrda
  za gospodarski ribolov izdat \u0107e se osobi koja je zavr\u0161ila stru\u010dno
  osposobljavanje prema Programu stru\u010dnog osposobljavanja za obavljanje djelatnosti
  gospodarskog ribolova ili ima zavr\u0161en preddiplomski i diplomski sveu\u010dili\u0161ni
  studij ili integrirani preddiplomski i diplomski sveu\u010dili\u0161ni studij ili
  specijalisti\u010dki diplomski stru\u010dni studij iz podru\u010dja ribarstva.\\n\\n(3)
  Ministarstvo vodi Registar izdanih potvrda za gospodarski ribolov u elektroni\u010dkom
  obliku.\\n\\n(4) Program stru\u010dnog osposobljavanja za obavljanje gospodarskog
  ribolova, obrazac te oblik, sadr\u017eaj i na\u010din vodenja Registra izdanih potvrda
  propisuje ministar pravilnikom.\\n\\nPosebne odredbe za mali obalni ribolov\\n\\n\u010clanak
  22.\\n\\n(1) Mali obalni ribolov smije obavljati fizi\u010dka osoba na temelju povlastice
  za mali obalni ribolov.\\n\\n(2) Mali obalni ribolov smije se obavljati u najvi\u0161e
  tri susjedne ribolovne podzone.\\n\\n(3) U malom obalnom ribolovu dopu\u0161teno
  je dnevno uloviti, odnosno sakupiti ukupno do pet kilograma ribe i drugih morskih
  organizama, a dopu\u0161tena dnevna koli\u010dina ulova mo\u017ee biti ve\u0107a
  za masu jedne ribe ili drugoga morskog organizma kojom se prema\u0161uje dopu\u0161tenih
  pet kilograma.\\n\\n(4) U malom obalnom ribolovu zabranjen je ribolov plavoperajne
  tune (Thunnus thynnus), igluna (Xiphias gladius), iglana (Tetrapturus belone), lov
  velikih rakova te sakupljanje koralja i spu\u017eava.\\n\\n(5) Ribe i druge morske
  organizme ulovljene ili sakupljene obavljanjem malog obalnog ribolova ovla\u0161tenik
  povlastice za mali obalni ribolov smije prodavati samo krajevim potro\u0161a\u010dima
  na mjestima koja za to odlukom odredi nadle\u017eno tijelo jedinice lokalne samouprave
  u mjestu prebivali\u0161ta ovla\u0161tenika povlastice, uz uvjet zadovoljavanja
  propisa kojima se regulira trgovina i promet hranom.\\n\\n(6) Mali obalni ribolov
  mo\u017ee se obavljati: jednostrukim mre\u017eama staja\u0107icama, vr\u0161ama
  za lov ribe, ostima sa i bez upotrebe osvjetljenja, staja\u0107im parangalima i
  drugim udi\u010darskim alatima te sakupljanjem \u0161koljkasa, bez uporabe ronila\u010dkih
  aparata.\\n\\n(7) Namjenu, vrstu i koli\u010dinu ribolovnih alata i opreme te na\u010din
  njihova ozna\u010davanja u malom obalnom ribolovu propisuje ministar pravilnikom.\\n\\nPohranjivanje,
  ukidanje i poni\u0161tavanje povlastice za mali obalni ribolov\\n\\n\u010clanak
  24.\\n\\n(1) Povlastica za mali obalni ribolov ukida se:\\n\\n- smr\u0107u ovla\u0161tenika
  povlastice za mali obalni ribolov\\n\\n- na zahtjev ovla\u0161tenika povlastice
  za mali obalni ribolov\\n\\n- ako se utvrdi da ovla\u0161tenik povlastice za mali
  obalni ribolov vi\u0161e ne udovoljava uvjetima za izdavanje povlastice propisanim
  u \u010dlanku 23. stavku 1. podstavcima 2. i 3. ovoga Zakona\\n\\n- ako ovla\u0161tenik
  povlastice za mali obalni ribolov ne dostavlja izvje\u0161\u0107a o ulovu dulje
  od \u0161est mjeseci u kontinuitetu\\n\\n- ako je odre\u0111ena prekr\u0161ajna
  mjera trajnog oduzimanja povlastice za mali obalni ribolov temeljem izre\u010denih
  negativnih prekr\u0161ajnih bodova u skladu s \u010dlankom 80. stavkom 3. ovoga
  Zakona\\n\\n- ako ovla\u0161tenik povlastice za mali obalni ribolov ne preuzme povlasticu
  iz pohrane u roku propisanom u stavku 4. ovoga \u010dlanka.\\n\\n(2) Povlastica
  za mali obalni ribolov poni\u0161titi \u0107e se ako je nakon izdavanja povlastice
  za mali obalni ribolov utvr\u0111eno da je ona izdana na temelju dostavljenih neto\u010dnih
  podataka i pogre\u0161no utvr\u0111enih \u010dinjenica.\\n\\n(3) Povlasticu za mali
  obalni ribolov ministarstvo pohranjuje po slu\u017ebenoj du\u017enosti:\\n\\n- ako
  se na plovilu upisanom u povlastici pove\u0107a snaga pogonskog stroja ili veli\u010dina
  plovila izra\u017eena u GT\\n\\n- ako je odre\u0111ena prekr\u0161ajna mjera privremenog
  oduzimanja povlastice za mali obalni ribolov temeljem izre\u010denih negativnih
  prekr\u0161ajnih bodova u skladu s \u010dlankom 80. stavkom 3. ovoga Zakona.\\n\\n(4)
  Povlastica za mali obalni ribolov mo\u017ee biti pohranjena u ministarstvu na rok
  od najdu\u017ee dvije godine.\\n\\n(5) Povlastica za mali obalni ribolov pohranjena
  po slu\u017ebenoj du\u017enosti mo\u017ee se preuzeti na zahtjev ovla\u0161tenika
  povlastice:\\n\\n- u slu\u010daju iz stavka 3. podstavka 1. ovoga \u010dlanka -
  ako se snaga pogonskog stroja u kW ili veli\u010dina plovila izra\u017eena u GT
  vrati u prvobitno stanje ili smanji u odnosu na prvobitno stanje\\n\\n- u slu\u010daju
  iz stavka 3. podstavka 2. ovoga \u010dlanka - istekom trajanja izre\u010dene prekr\u0161ajne
  mjere.\\n\\n(6) U slu\u010dajevima iz stavaka 1., 2., 3. i 5. ovoga \u010dlanka
  ministarstvo donosi rje\u0161enje protiv kojeg nije dopu\u0161tena \u017ealba, ali
  se mo\u017ee pokrenuti upravni spor.\\n\\nVrste dozvola\\n\u010clanak 28.\\n\\n(1)
  Dozvole mogu biti:\\n\\na) godi\u0161nje rekreacijske dozvole koje vrijede za kalendarsku
  godinu\\n\\nb) godi\u0161nje \u0161portske dozvole mogu biti izdane samo \u010dlanovima
  Hrvatskog saveza za \u0161portski ribolov na moru (u daljnjem tekstu: Savez) i vrijede
  za kalendarsku godinu\\n\\nc) jednodnevne \u0161portske i rekreacijske dozvole\\n\\nd)
  vi\u0161ednevne \u0161portske i rekreacijske dozvole\\n\\ne) posebne dozvole:\\n\\n1.
  za ribolov ostima, vr\u0161ama za lov ribe, staja\u010dim parangalima i upotrebu
  umjetne rasvjete, koje se mogu izdati samo uz posjedovanje godi\u0161nje dozvole\\n\\n2.
  za ribolov udi\u010darskim alatima za veliku ribu, koje se mogu izdati samo uz posjedovanje
  \u0161portske dozvole\\n\\n3. za ribolov u dijelovima mora koji su za\u0161ti\u0107eni
  na temelju propisa o za\u0161titi prirode u kategorijama nacionalnog parka, posebnog
  rezervata i parka prirode.\\n\\n(2) Za obavljanje \u0161portskog ribolova u dijelovima
  mora koji su za\u0161ti\u0107eni na temelju propisa o za\u0161titi prirode u kategorijama
  nacionalnog parka, posebnog rezervata i parka prirode posebna dozvola iz stavka
  1. to\u010dke e) podto\u010dke 3. ovoga \u010dlanka mo\u017ee se izdati samo uz
  posjedovanje dozvole za \u0161portski ribolov koju izdaje Savez.\\n\\n(3) Cijene
  pojedinih kategorija dozvola iz stavka 1. ovoga \u010dlanka propisuje ministar pravilnikom.\\n\\n(4)
  Iznimno od stavka 2. ovoga \u010dlanka, visinu naknade za posebnu dozvolu za ribolov
  u za\u0161ti\u0107enim podru\u010djima u kategorijama nacionalnog parka, posebnog
  rezervata i parka prirode propisuje nadle\u017ena javna ustanova.\\n\\n\u010clanak
  32.\\n\\n(1) U \u0161portskom ribolovu na moru i rekreacijskom ribolovu na moru
  zabranjen je ulov plavoperajne tune (Thunnus thynnus), igluna (Xiphias gladius),
  iglana (Tetrapturus belone), lov velikih rakova te sakupljanje koralja i spu\u017eava.\\n\\n(2)
  Iznimno od stavka 1. ovoga \u010dlanka, u rekreacijskom ribolovu na moru dopu\u0161ten
  je ulov plavoperajne tune (Thunnus thynnus), isklju\u010divo u okviru rekreacijskog
  ribolova na trofejne primjerke.\\n\\n(3) Iznimno od stavka 1. ovoga \u010dlanka,
  u \u0161portskom ribolovu na moru dopu\u0161ten je ulov plavoperajne tune (Thunnus
  thynnus) samo u okviru natjecanja iz \u010dlanka 34. ovoga Zakona kojima je odobrena
  kvota.\\n\\n(4) Sezonu ribolova, ograni\u010denja ulova po kategoriji ribolova te
  po plovilu, karakteristike i koli\u010dinu ribolovnih alata i opreme, uvjete i na\u010din
  provedbe ribolova na trofejne primjerke, na\u010din izvje\u0161tavanja, rokove,
  obvezu prijave ulova i na\u010din postupanja s ulovljenim primjercima propisuje
  ministar pravilnikom.\\n\\nOznakaivanje ulova i dopu\u0161tene koli\u010dine u \u0161portskom
  i rekreativskom ribolovu\\n\\n\u010clanak 33.\\n\\n(1) Jedinke odre\u0111enih vrsta
  riba i drugih morskih organizama ulovljenih u \u0161portskom i rekreativskom ribolovu
  moraju biti ozna\u010dene neposredno nakon ulova, a najkasnije prije napu\u0161tanja
  mjesta ulova.\\n\\n(2) Iznimno od odredbe stavka 1. ovoga \u010dlanka, ribe i drugi
  morski organizmi ulovljeni za vrijeme natjecanja u \u0161portskom ribolovu ozna\u010davaju
  se nakon \u0161to rezultati vaganja postanu kona\u010dni.\\n\\n(3) U \u0161portskom
  ribolovu i rekreativskom ribolovu dopu\u0161teno je dnevno uloviti i sakupiti do
  pet kilograma riba i drugih morskih organizama po ribolovcu, a dopu\u0161tena dnevna
  koli\u010dina ulova mo\u017ee biti ve\u0107a za masu jedne ribe ili drugoga morskog
  organizma kojim se prema\u0161uje dopu\u0161tenih pet kilograma.\\n\\n(4) \u0160portski
  i rekreativski ribolovac ne smije uz sebe imati ve\u0107u koli\u010dinu ribe i drugih
  morskih organizama ulovljenih u \u0161portskom, odnosno rekreativskom ribolovu od
  koli\u010dine propisane stavkom 3. ovoga \u010dlanka.\\n\\n(5) Iznimno od odredbe
  stavka 3. ovoga \u010dlanka, dopu\u0161tena koli\u010dina dnevnog ulova po ribolovcu
  mo\u017ee biti dodatno ograni\u010dena kao i koli\u010dina pojedinih vrsta riba
  u masi ulovljenih primjeraka ili njihovom broju.\\n\\n(6) Na\u010din ozna\u010davanja
  i minimalne referentne veli\u010dine za o\u010duvanje odre\u0111enih vrsta riba
  i drugih morskih organizama iz stavka 1. ovoga \u010dlanka te koli\u010dinu i vrste
  dopu\u0161tenog dnevnog ulova iz stavaka 3. i 5. ovoga \u010dlanka propisuje ministar
  pravilnikom.\\n\\nRibolov u znanstvene i znanstveno-nastavne svrhe i ribolov za
  potrebe akvarija\\n\\n\u010clanak 35.\\n\\n(1) Ribolov u znanstvene i znanstveno-nastavne
  svrhe i ribolov za potrebe akvarija otvorenih za javnost mo\u017ee se obavljati
  samo na temelju rje\u0161enja koje na zahtjev donosi ministarstvo.\\n\\n(2) Ministarstvo
  u rje\u0161enju iz stavka 1. ovoga \u010dlanka odre\u0111uje uvjete pod kojima se
  smije obavljati ribolov u znanstvene i znanstveno-nastavne svrhe i ribolov za potrebe
  akvarija otvorenih za javnost te postupanje s ulovom.\\n\\n(3) Za ribolov u znanstvene
  i znanstveno-nastavne svrhe u podru\u010djima za\u0161ti\u0107enim prema posebnom
  zakonu mora se ishoditi i odobrenje o uvjetima za\u0161tite prirode koje izdaje
  ministarstvo nadle\u017eno za poslove za\u0161tite prirode.\\n\\n(4) Rje\u0161enje
  iz stavka 1. ovoga \u010dlanka mora se uvijek nalaziti uz korisnika za vrijeme obavljanja
  ribolova.\\n\\n(5) Ribolov iz stavka 1. ovoga \u010dlanka mo\u017ee se rje\u0161enjem
  dopustiti samo pravnim i fizi\u010dkim osobama koje su registrirane za obavljanje
  navedenih djelatnosti.\\n\\n(6) Rje\u0161enje iz stavka 1. ovoga \u010dlanka ministarstvo
  je du\u017eno dostaviti ministarstvu nadle\u017enom za unutarnje poslove, ministarstvu
  nadle\u017enom za pomorstvo, ministarstvu nadle\u017enom za znanost i obrazovanje
  i ministarstvu nadle\u017enom za obranu.\\n\\n(7) Protiv rje\u0161enja iz stavka
  1. ovoga \u010dlanka nije dopu\u0161tena \u017ealba, ali se mo\u017ee pokrenuti
  upravni spor.\\n\\nIskrcaj ulova iz gospodarskog ribolova\\n\\n\u010clanak 42.\\n\\n(1)
  Ministar \u0107e naredbom odrediti vrste ribolovnih alata i segment flote iz kojih
  se ostvaren ulov smije iskrcavati i prvi put stavljati na tr\u017ei\u0161te na samo
  odre\u0111enim iskrcajnim mjestima.\\n\\n(2) Popis iskrcajnih mjesta iz stavka 1.
  ovoga \u010dlanka odlukom donosi Vlada Republike Hrvatske na prijedlog ministarstva
  i ministarstva nadle\u017enog za pomorstvo.\\n\\n(3) Iznimno od odredbe stavka 1.
  ovoga \u010dlanka, iskrcaj se mo\u017ee obaviti izvan iskrcajnog mjesta na mjestima
  koja odredi nadle\u017ena lu\u010dka kapetanija, ako je to potrebno zbog sigurnosti
  plovidbe.\\n\\n\u010clanak 55.\\n\\n(1) Potpore u ribarstvu obuhva\u0107aju:\\n\\n-
  potpore koje su omogu\u0107ene u okviru strukturne politike u skladu s usvojenim
  dokumentima iz \u010dlanka 8. stavka 5. ovoga Zakona\\n\\n- dr\u017eavne potpore
  u skladu s Uredbom Komisije (EU) 2022/2473, Uredbom Komisije (EU) br. 717/2014 i
  Smjernicama za ispitivanje dr\u017eavnih potpora u sektoru ribarstva i akvakulture
  (2015/C 217/01).\\n\\n(2) Ministar je nadle\u017ean:\\n\\n- ure\u0111iti me\u0111usobne
  odnose nadle\u017enih tijela u sustavu upravljanja i kontrole Operativnoga programa\\n\\n-
  odobriti dodjelu potpora u ribarstvu jedinicama lokalne i podru\u010dne (regionalne)
  samouprave.\\n\\n(3) U postupcima provedbe potpora iz stavka 1. ovoga \u010dlanka
  odlu\u010duje se rje\u0161enjem koje donosi ministarstvo.\\n\\n(4) Postupak provedbe
  potpora iz stavka 3. ovoga \u010dlanka zapo\u010dinje javnom objavom ministarstva.\\n\\n(5)
  Korisnik potpore u ribarstvu iz stavka 1. ovoga \u010dlanka materijalnu imovinu
  koja je predmet potpore ne smije prodati, koristiti protivno svrsi za koju je namijenjena,
  dati u najam ili dati na bilo koje drugo raspolaganje i kori\u0161tenje drugim pravnim
  ili fizi\u010dkim osobama najmanje pet godina od zadnje primljene uplate financijskih
  sredstava.\\n\\n(6) Iznimno od stavka 5. ovoga \u010dlanka, zbog nepredvi\u0111enih
  okolnosti ili vi\u0161e sile dopu\u0161tene su radnje iz stavka 5. ovoga \u010dlanka
  uz prethodno pribavljeno odobrenje ministarstva.\\n\\n(7) Radi pribavljanja odobrenja
  iz stavka 6. ovoga \u010dlanka korisnik podnosi zahtjev ministarstvu.\\n\\n(8) Ministarstvo
  o zahtjevu iz stavka 7. ovoga \u010dlanka odlu\u010duje rje\u0161enjem.\\n\\n(9)
  Protiv rje\u0161enja iz stavaka 3. i 8. ovoga \u010dlanka nije dopu\u0161tena \u017ealba,
  ali se mo\u017ee pokrenuti upravni spor.\\n\\n(10) Provedbu potpora iz stavka 1.
  ovoga \u010dlanka ministar propisuje pravilnikom.\\n\\nInspeksijski nadzor\\n\u010clanak
  61.\\n\\nInspeksijski nadzor nad provedbom odredbi ovoga Zakona i propisa donesenih
  na temelju njega obavljaju:\\n\\n1. vi\u0161i ribarski inspektori i ribarski inspektori
  (u daljnjem tekstu: inspektori)\\n\\n2. ovla\u0161tene osobe ministarstva na iskrcajnim
  mjestima i drugim mjestima nadzora za koje ih ovlasti ministar\\n\\n3. ovla\u0161tene
  osobe policijskih slu\u017ebenika ministarstva nadle\u017enog za unutarnje poslove
  obavljaju inspeksijski nadzor u unutarnjim morskim vodama i teritorijalnom moru
  Republike Hrvatske\\n\\n4. ovla\u0161tene osobe ministarstva nadle\u017enog za pomorstvo
  obavljaju inspeksijski nadzor u unutarnjim morskim vodama i teritorijalnom moru
  Republike Hrvatske\\n\\n5. ovla\u0161tene osobe Obalne stra\u017ee Republike Hrvatske
  obavljaju inspeksijski nadzor u unutarnjim morskim vodama, teritorijalnom moru te
  na podru\u010dju za\u0161ti\u0107enog ekolo\u0161ko-ribolovnog pojasa Republike
  Hrvatske, odnosno gospodarskog pojasa Republike Hrvatske kada Hrvatski sabor proglasi
  i ostale sadr\u017eaje isklju\u010divoga gospodarskog pojasa u skladu s Glavom IV.
  Dio drugi Pomorskog zakonika (\u00bbNarodne novine\u00ab, br. 181/04., 76/07., 146/08.,
  61/11., 56/13. i 26/15.)\\n\\n6. ovla\u0161tene osobe Carinske uprave, ministarstva
  nadle\u017enog za financije obavljaju inspeksijski nadzor u unutarnjim morskim vodama,
  teritorijalnom moru, transportu proizvoda ribarstva i na tr\u017ei\u0161tu\\n\\n7.
  inspektori Dr\u017eavnog inspektorata prema ovom Zakonu i propisima donesenim na
  temelju njega nadle\u017eni su za provedbu inspeksijskog nadzora u dijelu koji se
  odnosi na kriterij sve\u017eine kojom se proizvodi ribarstva s obzirom na zdravstvenu
  ispravnost proglasavaju\\n\\nneprilikadnim za prehranu ljudi te za kontrolu sljedivosti
  i DNK analize proizvoda ribarstva na tr\u017ei\u0161tu.\\n\\n\u010clanak 61.a\\n\\nNeposredni
  nadzor nad provedbom ovoga Zakona i propisa donesenih na temelju njega u dijelovima
  mora koji su za\u0161ti\u0107eni u kategorijama nacionalnog parka, posebnog rezervata
  i parka prirode provode ovla\u0161tene osobe - \u010duvari prirode.\\n\\nUvjeti
  za inspektora\\n\u010clanak 62.\\n\\n(1) Poslove vi\u0161eg inspektora mo\u017ee
  obavljati osoba koja ima zavr\u0161en preddiplomski i diplomski sveu\u010dili\u0161ni
  studij ili integrirani preddiplomski i diplomski sveu\u010dili\u0161ni studij ili
  specijalisti\u010dki diplomski stru\u010dni studij iz podru\u010dja prirodnih, tehni\u010dkih,
  biomedicinskih i zdravstvenih, biotehni\u010dkih ili dru\u0161tvenih znanosti, najmanje
  \u010detiri godine radnoga iskustva u struci i polo\u017een dr\u017eavni stru\u010dni
  ispit za ribarskog inspektora.\\n\\n(2) Poslove inspektora mo\u017ee obavljati osoba
  koja ima zavr\u0161en preddiplomski i diplomski sveu\u010dili\u0161ni studij ili
  integrirani preddiplomski i diplomski sveu\u010dili\u0161ni studij ili specijalisti\u010dki
  diplomski stru\u010dni studij iz podru\u010dja prirodnih, tehni\u010dkih, biomedicinskih
  i zdravstvenih, biotehni\u010dkih ili dru\u0161tvenih znanosti, najmanje dvije godine
  radnoga iskustva u struci i polo\u017een dr\u017eavni stru\u010dni ispit za ribarskog
  inspektora.\\n\\nPrava i obveze inspektora i ostalih ovla\u0161tenih osoba\\n\u010clanak
  69.\\n\\n(1) Ako na\u0111e da je povrije\u0111en ovaj Zakon ili drugi propis donesen
  na temelju njega, inspektori su ovla\u0161teni:\\n\\n1. rje\u0161enjem narediti
  otklanjanje utvr\u0111enih nedostataka i odrediti primjereni rok za njihovo otklanjanje\\n\\n2.
  rje\u0161enjem zabraniti stavljanje na tr\u017ei\u0161te ili narediti povla\u010denje
  s tr\u017ei\u0161ta ribe i druge morske organizme\\n\\n3. naredbom odrediti mjeru
  opreza privremene obustave djelatnosti sukladno posebnom propisu koji regulira prekr\u0161aje\\n\\n4.
  utvrditi udovoljava li fizi\u010dka ili pravna osoba djelomi\u010dno ili u potpunosti
  uvjetima propisanih ovim \u017dakonom ili propisima donesenim na temelju njega\\n\\n5.
  podnijeti nadle\u017enom tijelu prijavu zbog kaznenog djela ili optu\u017eni prijedlog\\n\\n6.
  izdati prekr\u0161ajni nalog ili obvezni prekr\u0161ajni nalog\\n\\n7. naplatiti
  nov\u010danu kaznu na mjestu po\u010dinjenja prekr\u0161aja.\\n\\n(2) Poslove iz
  stavka 1. to\u010daka 4. do 7. ovoga \u010dlanka mogu obavljati ovla\u0161tene osobe
  iz \u010dlanka 61. to\u010daka 2. do 6. ovoga Zakona.\\n\\n(3) Poslove iz stavka
  1. to\u010daka 4., 5. i 7. ovoga \u010dlanka mogu obavljati ovla\u0161tene osobe
  iz \u010dlanka 61.a, u skladu s posebnim propisima o za\u0161titi prirode.\\n\\n\u010clanak
  70.\\n\\n(1) Inspektor i ovla\u0161tene osobe mogu privremeno oduzeti proizvode
  ribarstva, ribolovne alate i opremu te druge predmete kojim je po\u010dinjen prekr\u0161aj
  u skladu s odredbama kojima se ure\u0111uje postupak oduzimanja.\\n\\n(2) Inspektor
  i ovla\u0161tene osobe mogu staviti plombu na ulov, plovilo, alat, opremu, objekt
  te prijevozno sredstvo i/ili spreminik.\\n\\n(3) Svaka plomba je ozna\u010dena serijskim
  brojem.\\n\\n(4) Postupak plombriranja i postupak s privremeno oduzetim proizvodima
  ribarstva, ribolovnim alatima i opremom te drugim predmetima kojim je po\u010dinjen
  prekr\u0161aj, kao i obrazac potvrde o oduzetim predmetima propisuje ministar pravilnikom.\\n\\n\u017dalbe
  na rje\u0161enja inspektora\\n\\n\u010clanak 71.\\n\\n(1) Inspektor je u obavljanju
  inspeksijskog nadzora samostalan te vodi postupak, donosi rje\u0161enja i poduzima
  mjere u okviru prava, du\u017enosti i ovlasti utvr\u0111enih ovim Zakonom i drugim
  propisima.\\n\\n(2) Protiv rje\u0161enja koja na temelju ovoga Zakona donosi inspektor
  nije dopu\u0161tena \u017ealba, ali se mo\u017ee pokrenuti upravni spor.\\n\\n\u010clanak
  77.\\n\\n(1) Sukladno \u010dlanku 44. stavku 1. Uredbe Vije\u0107a (EZ) br. 1005/2008
  i \u010dlanku 90. stavku 2. Uredbe Vije\u0107a (EZ) br. 1224/2009, nov\u010danom
  kaznom u iznosu od 1990,00 do 6630,00 eura kaznit \u0107e se za prekr\u0161aj pravna
  osoba ako:\\n\\n1. krivotvori ili sakriva oznake, identitet ili registraciju u skladu
  s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom 3. stavkom 1. to\u010dkom
  (f) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n2. prikriva, nedopu\u0161teno mijenja
  ili uni\u0161tava dokaze povezane s istragom u skladu s \u010dlankom 42. stavkom
  1. to\u010dkom (a) i \u010dlankom 3. stavkom 1. to\u010dkom (g) Uredbe Vije\u0107a
  (EZ) br. 1005/2008\\n\\n3. zadr\u017eava na plovilu, prekrcava ili iskrcava ribe
  ispod mjere u suprotnosti s propisima na snazi, a u skladu s \u010dlankom 42. stavkom
  1. to\u010dkom (a) i \u010dlankom 3. stavkom 1. i to\u010dkom (i) Uredbe Vije\u0107a
  (EZ) br. 1005/2008\\n\\n4. obavlja ribolovne aktivnosti na podru\u010dju regionalne
  organizacije za upravljanje u ribarstvu na na\u010din koji nije u skladu s mjerama
  za o\u010duvanje i gospodarenje resursima koje je\\n\\ndonijela ta organizacija
  ili na na\u010din kojim kr\u0161i te mjere u skladu s \u010dlankom 42. stavkom 1.
  to\u010dkom (a) i \u010dlankom 3. stavkom 1. to\u010dkom (k) Uredbe Vije\u0107a
  (EZ) br. 1005/2008\\n\\n5. obavlja ribolov bez va\u017ee\u0107e povlastice za ribolov
  koju je izdala Republika Hrvatska ili odgovaraju\u0107a obalna dr\u017eava u skladu
  s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom 3. stavkom 1. to\u010dkom
  (a) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n6. obavlja ribolov bez odobrenja
  ili dozvole za ribolov koju je izdala Republika Hrvatska ili odgovaraju\u0107a obalna
  dr\u017eava u skladu s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom
  3. stavkom 1. to\u010dkom (a) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n7. obavlja
  ciljani ribolov stoka za koji je na snazi moratorij ili zabrana ribolova u skladu
  s \u010dlankom 42. stavkom 1. to\u010dkom\\n(a) i \u010dlankom 3. stavkom 1. to\u010dkom
  (d) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n8. sprje\u010dava slu\u017ebene osobe
  u obavljanju njihovih du\u017enosti pri provjeravanju sukladnosti s va\u017ee\u0107im
  mjerama o\u010duvanja i gospodarenja resursima ili spre\u010davanje promatra\u010da
  u obavljanju njihovih du\u017enosti pri promatranju po\u0161tovanja va\u017ee\u0107ih
  pravila Unije u skladu s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom
  3. stavkom 1. to\u010dkom (h) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n9. prekrcava
  ulov na ribarska plovila za koja je utvr\u0111eno da se bave ribolovom NNN u smislu
  Uredbe Vije\u0107a (EZ) br. 1005/2008, posebno ona koja su uvri\u0161tena na Unijin
  popis plovila NNN ili na popis plovila NNN regionalne organizacije za upravljanje
  u ribarstvu, sudjelovanje u zajedni\u010dkim ribolovnim operacijama s takvim plovilima,
  pomaganjem takvim plovilima ili opskrbljivanje takvih plovila u skladu s \u010dlankom
  42. stavkom 1. to\u010dkom (a) i \u010dlankom 3. stavkom 1. to\u010dkom\\n(j) Uredbe
  Vije\u0107a (EZ) br. 1005/2008\\n\\n10. koristi ribarsko plovilo koje nema dr\u017eavnu
  pripadnost i koje je, stoga, prema me\u0111unarodnom pravu plovilo bez dr\u017eavne
  pripadnosti u skladu s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom
  3. stavkom 1. to\u010dkom (l) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n11. obavlja
  ribolov ribarskim plovilom na kojem je izvr\u0161ena preinaka motora s ciljem pove\u0107anja
  snage koja je navedena u certifikatu motora u skladu s \u010dlankom 90. stavkom
  1. to\u010dkom (b) Uredbe Vije\u0107a (EZ) 1224/2009\\n\\n12. propusti da se donese
  i zadr\u017ee na ribarskom plovilu te da se iskrcaju bilo koji ulovi vrsta koje
  podlije\u017eu obvezi iskrcavanja utvr\u0111enoj u \u010dlanku 15. Uredbe (EU) br.
  1380/2013, osim ako bi dono\u0161enje i zadr\u017eavanje na plovilu te iskrcavanje
  takvih ulova, u ribarstvu ili ribolovnim zonama u kojima se primjenjuju odgovaraju\u0107a
  pravila, bilo protivno obvezama predvidenima u pravilima zajedni\u010dke ribarstvene
  politike ili podlo\u017eno izuze\u0107ima od takvih obveza predvidenima u takvim
  pravilima u skladu s \u010dlankom 90. stavkom 1. to\u010dkom (c) Uredbe Vije\u0107a
  (EZ) 1224/2009\\n\\n13. ne dostavlja iskrcajne deklaracije ili prodajne listove
  ako je ulov iskrcaan u luci tre\u0107e zemlje u skladu s \u010dlankom 90. stavkom
  1. to\u010dkom (a) Uredbe Vije\u0107a (EZ) 1224/2009.\\n\\n(2) Za prekr\u0161aj
  iz stavka 1. ovoga \u010dlanka kaznit \u0107e se i odgovorna osoba u pravnoj osobi
  i odgovorna osoba u obavljanju gospodarskog ribolova nov\u010danom kaznom od 920,00
  do 1990,00 eura.\\n\\n(3) Nov\u010danom kaznom od 1.320,00 do 1.990,00 eura za prekr\u0161aj
  iz stavka 1. ovoga \u010dlanka kaznit \u0107e se fizi\u010dka osoba obrtnik.\\n\\n(4)
  Nov\u010danom kaznom od 1.320,00 do 1.990,00 eura za prekr\u0161aj iz stavka 1.
  ovoga \u010dlanka kaznit \u0107e se fizi\u010dka osoba.\\n\\n\u010clanak 78.\\n\\n(1)
  Sukladno \u010dlanku 44. stavku 1. Uredbe Vije\u0107a (EZ) br. 1005/2008 i \u010dlanku
  90. stavku 2. Uredbe Vije\u0107a (EZ) br. 1224/2009, nov\u010danom kaznom u iznosu
  od 660,00 do 3980,00 eura kaznit \u0107e se za prekr\u0161aj pravna osoba ako:\\n\\n1.
  ne ispuni obveze bilje\u017eenja i dostavljanja podataka o ulovu i podataka povezanih
  s ulovom, me\u0111u ostalim i podataka koji se moraju prenosi putem sustava za satelitsko
  pra\u0107enje plovila u skladu s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom
  3. stavkom 1. to\u010dkom (b) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n2. koristi
  zabranjeni ribolovni alat ili alat koji ne ispunjava zahtjeve propisane zakonodavstvom
  Unije u skladu s \u010dlankom 42. stavkom 1. to\u010dkom (a) i \u010dlankom 3. stavkom
  1. to\u010dkom (e) Uredbe Vije\u0107a (EZ) br. 1005/2008\\n\\n3. obavlja ribolov
  na podru\u010dju zabrane ribolova ili u razdoblju zabrane ribolova, bez kvote ili
  nakon iscrpljenja kvote, ili na nedopu\u0161tenim dubinama u skladu s \u010dlankom
  42. stavkom 1. to\u010dkom (a) i \u010dlankom 3. stavkom 1. to\u010dkom (e) Uredbe
  Vije\u0107a (EZ) br. 1005/2008.\\n\\n(2) Za prekr\u0161aj iz stavka 1. ovoga \u010dlanka
  kaznit \u0107e se i odgovorna osoba u pravnoj osobi i odgovorna osoba u obavljanju
  gospodarskog ribolova nov\u010danom kaznom od 390,00 do 1.320,00,00 eura.\\n\\n(3)
  Nov\u010danom kaznom od 260,00 do 530,00 eura za prekr\u0161aj iz stavka 1. ovoga
  \u010dlanka kaznit \u0107e se fizi\u010dka osoba obrtnik.\\n\\n(4) Nov\u010danom
  kaznom od 260,00 do 530,00 eura za prekr\u0161aj iz stavka 1. ovoga \u010dlanka
  kaznit \u0107e se fizi\u010dka osoba.\\n\\nNegativni prekr\u0161ajni bodovi\\n\\n\u010clanak
  79.\\n\\n(1) Za te\u0161ke prekr\u0161aje utvr\u0111ene \u010dlankom 76. ovoga Zakona
  u Odluci o po\u010dinjenom prekr\u0161aju osim izricanja nov\u010dane kazne dodjeljuju
  se negativni prekr\u0161ajni bodovi ovla\u0161teniku povlastice za obavljanje gospodarskog
  ribolova na moru, ovla\u0161teniku povlastice za mali obalni ribolov i zapovjedniku
  ribarskog plovila, za prekr\u0161aj/prekr\u0161aje po\u010dinjen/po\u010dinjene
  plovilom iz registra ribarske flote Republike Hrvatske bez obzira na mjesto po\u010dinjena
  prekr\u0161aja u skladu s Prilogom XXX. Provedbene uredbe Komisije (EU) 404/2011.\\n\\n(2)
  Za svaki prekr\u0161aj iz \u010dlanka 77. stavka 1. to\u010dke 1. ovoga Zakona osim
  nov\u010dane kazne dodjeljuje se i pet negativnih prekr\u0161ajnih bodova.\\n\\n(3)
  Za svaki prekr\u0161aj iz \u010dlanka 77. stavka 1. to\u010dke 2. ovoga Zakona osim
  nov\u010dane kazne dodjeljuje se i pet negativnih prekr\u0161ajnih bodova.\\n\\n(4)
  Za ponovljeni prekr\u0161aj iz \u010dlanka 77. stavka 1. to\u010dke 3. ovoga Zakona,
  drugi put u roku od dvije godine, za vrijednost ulova preko 260,00 eura, a neovisno
  o karakteristikama plovila, osim nov\u010dane kazne dodjeljuje se i pet negativnih
  prekr\u0161ajnih bodova.\\n\\n(5) Za ponovljeni prekr\u0161aj iz \u010dlanka 77.
  stavka 1. to\u010dke 4. ovoga Zakona, drugi put u roku od dvije godine, za vrijednost
  ulova preko 190,00 eura, a neovisno o karakteristikama plovila, osim nov\u010dane
  kazne dodjeljuje se i pet negativnih prekr\u0161ajnih bodova.\\n\\n(6) Za ponovljeni
  prekr\u0161aj iz \u010dlanka 77. stavka 1. to\u010dke 5. ovoga Zakona, drugi put
  u roku od dvije godine, neovisno o vrijednosti ulova i o karakteristikama plovila,
  osim nov\u010dane kazne dodjeljuje se i sedam negativnih prekr\u0161ajnih bodova.\\n\\n(7)
  Za ponovljeni prekr\u0161aj iz \u010dlanka 77. stavka 1. to\u010dke 6. ovoga Zakona,
  drugi put u roku od dvije godine, za vrijednost ulova preko 920,00 eura, a neovisno
  o karakteristikama plovila, osim nov\u010dane kazne dodjeljuje se i sedam negativnih
  prekr\u0161ajnih bodova.\\n\\n(8) Za ponovljeni prekr\u0161aj iz \u010dlanka 77.
  stavka 1. to\u010dke 7. ovoga Zakona, drugi put u roku od dvije godine, za vrijednost
  ulova preko 390,00 eura, a neovisno o karakteristikama plovila, osim nov\u010dane
  kazne dodjeljuje se i sedam prekr\u0161ajnih negativnih bodova.\\n\\n(9) Za svaki
  prekr\u0161aj iz \u010dlanka 77. stavka 1. to\u010dke 8. ovoga Zakona, neovisno
  o broju ponavljanja, vrijednosti ulova i karakteristikama plovila, osim nov\u010dane
  kazne dodjeljuje se i sedam prekr\u0161ajnih negativnih bodova.\\n\\n(10) Za svaki
