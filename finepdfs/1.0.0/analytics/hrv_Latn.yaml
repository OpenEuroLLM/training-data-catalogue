  i rje\u0161ava u predmetima upravljanja, raspolaganja i odr\u017eavanja nekretnina
  u vlasni\u0161tvu Republike Hrvatske, iz nadle\u017enosti Odsjeka , sukladno posebnim
  propisima\\n-izra\u0111uje nacrte prijedloga akata iz nadle\u017enosti Upravnog
  odjela koji se upu\u0107uju na usvajanje Skup\u0161tini i \u017dupanu Istarske \u017eupanije\\n-sudjeluje
  u realizaciji zadataka utvr\u0111enih aktima Skup\u0161tine i \u017dupana\\n-prati
  propise i stru\u010dnu literaturu u podru\u010djima iz djelokruga rada Odsjeka\\n-sudjeluje
  u stru\u010dnoj komunikaciji sa strankama i drugim subjektima u svrhu prikupljanja
  i razmjene informacija\\n-prati stru\u010dnu literaturu , propise i poha\u0111a
  edukacije iz podru\u010dja upravljanja i raspolaganja nekretninama u vlasni\u0161tvu
  Republike Hrvatske\\n-izra\u0111uje prijedloge nacrta akata iz nadle\u017enosti
  Odsjeka\\n\\n-obavlja stru\u010dne poslove za potrebe provo\u0111enja javnog natje\u010daja
  u svrhu raspolaganja nekretninama u vlasni\u0161tvu Republike Hrvatske\\n-obavlja
  o\u010devide na nekretninama\\n-sura\u0111uje s drugim upravnim tijelima i slu\u017ebenicima
  Odsjeka za upravljanje nekretninama u vlasni\u0161tvu Republike Hrvatske u obavljanju
  poslova iz svoje nadle\u017enosti\\n-obavlja poslove vezano uz legalizaciju nekretnina\\n-izra\u0111uje
  prijedlog suglasnosti u postupcima izdavanja lokacijskih dozvola\\n-izra\u0111uje
  prijedlog suglasnosti u postupcima izdavanja gra\u0111evinskih dozvola\\n-izra\u0111uje
  prijedlog suglasnosti u postupcima izdavanja rje\u0161enja o utvr\u0111enju gra\u0111evne
  \u010destice\\n-izra\u0111uje prijedlog suglasnosti na parcelacijske ( geodetske
  ) elaborate\\n-obavlja poslove nadzora privo\u0111enja namjeni nekretnina koji su
  predmet sklopljenih ugovora\\n-odaziva se na pozive za predo\u010davanje elaborata
  katastarske izmjere na podru\u010dju na kojem se provodi katastarska izmjera\\n-pokre\u0107e
  postupke vezano uz gra\u0111evinsko \u010di\u0161\u0107enje , odr\u017eavanje i
  ru\u0161enje nekretnina u suradnji s drugim upravnim tijelima u obavljanju poslova
  iz svoje nadle\u017enosti\\n-po potrebi , sudjeluje u postupcima izrade i dono\u0161enja
  prostornih planova jedinica lokalne i podru\u010dne ( regionalne) samouprave te
  davanju potrebnih o\u010ditovanja\\n-obavlja i druge povjerene poslove po nalogu
  pro\u010delnika ili nadre\u0111enog slu\u017ebenika\\n\\nPodatci o pla\u0107i:\\n\\nPla\u0107u
  vi\u0161eg stru\u010dnog suradnika \u010dini umno\u017eak koeficijenata slo\u017eenosti
  poslova radnog mjesta i osnovice za obra\u010dun pla\u0107e uve\u0107an za 0,5 %
  za svaku navr\u0161enu godinu radnog sta\u017ea.\\n\\n\u010clankom 8.Odluke o mjerilima
  za odre\u0111ivanje pla\u0107e \u017eupana i zamjenika \u017eupana te slu\u017ebenika
  i namje\u0161tenika u upravnim tijelima Istarske \u017eupanije ( \u201e Slu\u017ebene
  novine Istarske \u017eupanije\\\", broj 10/10, 8/14, 11/15, 26/19, 29/21, i 37/22
  ), utvr\u0111en je koeficijent slo\u017eenosti poslova vi\u0161eg stru\u010dnog
  suradnika koeficijentom 2,80.\\n\\nOdredbom \u010dlanka 2.Aneksa br.9. Kolektivnog
  ugovora za zaposlene u jedinicama lokalne samouprave i upravnim odjelima Istarske
  \u017eupanije od 01.kolovoza 2024.godine utvr\u0111ena je bruto osnovica za obra\u010dun
  pla\u0107e slu\u017ebenika i namje\u0161tenika koja iznosi 770,00 EUR/ bruto, po\u010dev\u0161i
  od 01.rujna 2024.godine.\\n\\nTESTIRANJE KANDIDATA :\\n\\nTestiranje kandidata /kinja
  sastoji se od:\\n\\n* provjere znanja i sposobnosti  za obavljanje poslova radnog
  mjesta na koje se slu\u017ebenik/ca prima \u2013pismeni test\\n* usmeni intervju
  s Povjerenstvom za provedbu javnog  natje\u010daja\\n\\nPrethodnoj provjeri znanja
  i sposobnosti kandidata mogu pristupiti samo kandidati/kinje koji su podnijeli urednu
  i pravodobnu prijavu, te koji ispunjavaju formalne uvjete iz javnog natje\u010daja
  , a istima \u0107e se poziv uputiti i putem elektroni\u010dke po\u0161te koju su
  naveli u prijavi na javni natje\u010daj.\\n\\nPravni izvori za pripremu provjere
  znanja( testiranja) kandidata/kinja :\\n\\nPropisi \u010diji \u0107e se sadr\u017eaj
  primjenjivati u provjeri znanja su:\\n\\nOp\u0107i dio:\\n\\n* Ustav RH( \u201e
  Narodne novine\\\", broj 41/01, 55/01, 76/10, 85/10-pro\u010di\u0161\u0107eni tekst
  i 5/14)\\n* Zakon o slu\u017ebenicima i namje\u0161tenicima u lokalnoj i podru\u010dnoj
  ( regionalnoj) samoupravi ( \u201e Narodne novine\\\", broj 86/08, 61/11, 4/18,
  96/18, 112/19)\\n\\nPosebni dio:\\n\\n* Zakon o upravljanju nekretninama i pokretninama
  u vlasni\u0161tvu Republike Hrvatske (\u201eNarodne novine \u201e br.155/23 )\\n\\n*
  Zakon o prostornom ure\u0111enju ( \u201eNarodne novine\\\" br.153/2013,65/2017,114/2018,
  39/2019, 98/2019, 67/2023)\\n\\nPravila testiranja kandidata/kinja\\n\\nPo dolasku
  na testiranje od kandidata/kinja \u0107e biti zatra\u017eeno predo\u010davanje odgovaraju\u0107e
  isprave radi utvr\u0111ivanja identiteta te potpisivanje suglasnosti za obradu osobnih
  podataka.\\n\\nKandidati/kinje koji/e ne mogu dokazati identitet ne mogu pristupiti
  testiranju.\\n\\nNakon utvr\u0111ivanja identiteta kandidata/kinja, istima \u0107e
  biti podijeljena pitanja za provjeru znanja putem pismenog testiranja (20 pitanja
  - 20 bodova). Svaki dio provjere znanja i sposobnosti kandidata sastoji se od 10
  pitanja. Svako pitanje boduje se s jednim bodom. Maksimalno ostvariv broj bodova
  na pismenom testiranju je 20. Na pisanoj provjeri nije dozvoljeno koristiti se literaturom
  i zabilje\u0161kama, napu\u0161tati prostoriju, razgovarati s ostalim kandidatima/kinjama,
  niti na bilo koji drugi na\u010din remetiti koncentraciju kandidata, a mobitel je
  potrebno isklju\u010diti.\\n\\nPismena provjera traje najdu\u017ee 60 minuta.\\n\\nIntervju
  se provodi samo s kandidatima/kinjama koji/e su ostvarili/e najmanje 50% bodova
  iz svakog dijela provjere znanja i sposobnosti na provedenom testiranju. Kandidati/kinje
  koji su zadovoljili na testiranju pristupaju razgovoru s Povjerenstvom za provedbu
  javnog natje\u010daja (intervju).\\n\\nPovjerenstvo za provedbu javnog natje\u010daja
  putem intervjua s kandidatima/kinjama utvr\u0111uje interese, profesionalne ciljeve
  i motivaciju za rad (4 pitanja).\\n\\nSvako pitanje ocjenjuje se s ocjenom od 1
  do 5.\\n\\nMaksimalno ostvariv broj bodova na razgovoru (intervju) je 20.\\n\\nNakon
  provedenog pismenog testiranja i intervjua maksimalno ostvariv sveukupni broj bodova
  je 40.\\n\\nNakon provedbe testiranja i intervjua Povjerenstvo za provedbu javnog
  natje\u010daja utvr\u0111uje rang-listu kandidata prema ukupnom broju ostvarenih
  bodova na testiranju i intervjuu. Povjerenstvo dostavlja pro\u010delnici Upravnog
  odjela za op\u0107u upravu i imovinsko \u2013 pravne poslove Istarske \u017eupanije
  izvje\u0161\u0107e o provedenom postupku, kojeg potpisuju svi \u010dlanovi Povjerenstva.\\n\\nSvi
  kandidati prijavljeni na javni natje\u010daj imaju pravo uvida u dokumentaciju koja
  se odnosi na natje\u010daj. Rije\u010di i pojmovi koji imaju rodno zna\u010denje,
  kori\u0161teni u obavijesti i uputama kandidatima odnose se jednako na mu\u0161ki
  i \u017eenski rod bez obzira jesu li kori\u0161teni u mu\u0161kom ili \u017eenskom
  rodu.\\n\\nPrethodna provjera znanja i sposobnosti kandidata (pismeno testiranje
  i usmeni razgovor ) provest \u0107e se dana 28. studenog 2024. godine ( \u010detvrtak)
  s po\u010detkom u 10:00 sati na adresi Pula, Splitska 14, 7.kat. Istarska \u017eupanija
  \u2013 Regione Istriana, Upravni odjel za op\u0107u upravu i imovinsko pravne poslove.\\n\\nIstarska
  \u017eupanija- Regione Istriana Upravni odjel za op\u0107u upravu i imovinsko- pravne
  poslove Povjerenstvo za provedbu javnog natje\u010daja\"", "\"HRVATSKO IZASLANSTVO
  U AFGANISTANU\\n\\nZAHVALA HRVATSKOJ na pru\u017eenoj pomo\u0107i\\n\\nBILATERALNA
  VJE\u017dBA GUARDEX ''09\\n\\nMe\u0111unarodni seminar\\n\\nSnage za specijalna
  djelovanja i budu\u0107e teroristi\u010dke prijetnje\\n\\nSastanak Sjevernoatlanskog
  vije\u0107a\\n\\nMINISTRI OBRANE NATO-a O MISIJI KFOR I ISAF\\n\\nKVALITETA KAO
  IZAZOV\\n\\nGENERAL DILER\\n\\nNekada\u0161nji prvi \u010dasnik gvinejske vojske,
  general Diarra Camara (na slici), zajedno sa svojim sinom (poru\u010dnikom) i nizom
  drugih \u010dasnika optu\u017een je za kriju\u0107a\u010darenje droge. Vojnici \u0107e
  se pred sudom na\u0107i zajedno s osam Nigerijaca, jednim Izraelcem i Gancem, a
  me\u0111u optu\u017eenima su i Aly Daffe te Mohamed Camara, koji su bili na \u010delu
  marinaca odnosno mornarice. Zapadna Afrika ve\u0107 je niz godina tranzitno mjesto
  za ilegalnu distribuciju narkotika, uklju\u010duju\u0107i i kokain koji dolazi iz
  Ju\u017ene Amerike, tvrdi BBC. Gvinejom je potkraj pro\u0161le godine, smr\u0107u
  dugogodi\u0161njeg predsjednika Lansane Contea, zavladala vojna hunta.\\n\\nPOZDRAV
  ZA POVRATAK\\n\\nOva atraktivna fotografija nastala je po\u010detkom lipnja u Baumholderu
  u Njema\u010dkoj. Ondje je smje\u0161tena vojna baza u koju su se nakon 14 mjeseci
  u Iraku vratili ameri\u010dki vojnici borbenog tima 2. brigade u sastavu 1. oklopne
  divizije kopnene vojske. Povratnicima je prire\u0111en veli\u010danstven do\u010dek
  kolega i \u010dlanova obitelji, uklju\u010duju\u0107i i koncert ameri\u010dke hit-grupe
  Hinder.\\n\\nMARINAC MARATONAC\\n\\nNekada\u0161nji ameri\u010dki marinac Tyler
  Boudreau zapo\u010deo je 15. lipnja u Seattleu put du\u017ei od 5000 km da bi stigao
  u svoj dom u Northamptonu (Massachusetts). Tu udaljenost prije\u0107i \u0107e biciklom
  i ra\u010duna da mu je potrebno to\u010dno tri mjeseca. Maratonskom vo\u017enjom
  \u017eeli svrati\u0107i pozornost na sve situacije kakve prolaze ratni veterani,
  s naglaskom na one koji su slu\u017eili u Iraku, te o tome otvoreno govoriti u mjestima
  kroz koja \u0107e prolaziti. Boudreau (38) je u marinama slu\u017eio 12 godina i
  skinuo se 2005., nakon \u010dega je napisao knjigu o sedam mjeseci boravka u Iraku,
  postav\u0161i svojevrsni glasnogovornik veterana.\\n\\nFRANCUZI DOLAZE!\\n\\nPovratkom
  u NATO Francuska je brzo dobila bitna zapovjedna mjesta za svoje \u010dasnike. Predsjedni\u010dki
  ured Nicolasa Sarkozyja objavio je 10. lipnja da je za \u010delnika Zapovjedni\u0161tva
  za transformaciju (ACT) predlo\u017een general Stephane Abrial, ina\u010de \u010delnik
  zrakoplovstva. Zapovjednik Zdru\u017eenog zapovjedni\u0161tva Lisabon bit \u0107e
  general Philippe Stoltz. Oba polo\u017eaja dosad su bila namijenjena ameri\u010dkim
  \u010dasnicima. Uz dvije najzvu\u010dnije, Francuzi su objavili i nominacije za
  jo\u0161 17 sto\u017eernih \u010dasnika koji \u0107e biti raspore\u0111eni na visoka
  zapovjedna mjesta unutar NATO-a.\\n\\nKRAJ BORBENIH OPERACIJA\\n\\nU Veliku Britaniju
  doletjela su po\u010detkom lipnja dva RAF-ova zrakoplova - Tornado GR4 i VC10. Ta
  vijest ne bi bila zanimljiva da ne zna\u010di zaklju\u010denje osamnaestogodi\u0161njih
  RAF-ovih borbenih operacija u Perzijskom zaljevu, koje su zapo\u010dele sa \u017daljevskim
  ratom. U kolovozu 1990., nakon ira\u010dke invazije Kuvajta, u to podru\u010dje
  bilo je poslano 50 zrakoplova tipa Tornado i 12 tipa Jaguar. Tijekom svih tih nemirnih
  godina poginulo je 35 djelatnika britanskog zrakoplovstva. No, iako su borbene operacije
  zaklju\u010dene, na Bliskom istoku \u0107e ostati jo\u0161 neki RAF-ovi djelatnici
  i oprema koja \u0107e pru\u017eati potporu i logistiku preostalim Britancima.\\n\\nKrila
  Oluje na zrakoplovnoj manifestaciji u Slova\u010dkoj\\n\\nHrvatski piloti svojom
  su generalnom probom napravili svojevrsni uvod pred samo slu\u017ebeno otvaranje
  manifestacije te zatim nastupima u slu\u017ebenom dijelu subotnjeg i nedjeljnog
  programa premijerno predstavili svjetskoj javnosti novi program za sezonu 2009.
  u sastavu od \u0161est zrakoplova.\\n\\nGUARDEX 09\\n\\nVje\u017eba na poligonu
  \\\"Crvena zemlja\\\" kraj Knina bila je prvi ve\u0107i bilateralni vje\u017ebovni
  doga\u0111aj u kojem je OSRH djelovalo kao vojska punopravne \u010dlanice NATO-a.
  Hrvati i Amerikanci morali su djelovati kao jedinstvena NATO-ova postrojba u mirovnoj
  misiji...\\n\\nZAHVALA HRVATSKOJ na pru\u017eenoj pomo\u0107i\\n\\n\\\"Posebno bih
  \u017eelio istaknuti da na ovaj kamp nije bilo raketnog napada unatrag sedam mjeseci,
  u \u010demu su klju\u010dnu ulogu odigrale upravo postrojbe Vojne policije i njihov
  rad na terenu, u \u010dijem je sastavu i 27 pripadnika Vojne policije OSRH ovdje
  u Kabulu\\\", rekao je zapovjednik Regionalnog zapovjedni\u0161tva Kabul brigadni
  general Michael Stollsteiner.\\n\\nZAHVALA HRVATSKOJ na pru\u017eenoj pomo\u0107i\\n\\n\\\"Posebno
  bih \u017eelio istaknuti da na ovaj kamp nije bilo raketnog napada unatrag sedam
  mjeseci, u \u010demu su klju\u010dnu ulogu odigrale upravo postrojbe Vojne policije
  i njihov rad na terenu, u \u010dijem je sastavu i 27 pripadnika Vojne policije OSRH
  ovdje u Kabulu\\\", rekao je zapovjednik Regionalnog zapovjedni\u0161tva Kabul brigadni
  general Michael Stollsteiner.\\n\\nMinistar obrane Branko Vukeli\u0107 stigao je
  15. lipnja u Kabul, u posjet pripadnicima Oru\u017eanih snaga Republike Hrvatske
  koji sudjeluju u ISAF-u, NATO-ovoj misiji u Afganistanu. U kabulskoj zra\u010dnoj
  luci ministra i \u010dlanove izaslanstva do\u010dekali su pripadnici hrvatske Vojne
  policije i medicinskog tima te ga potom u \u0161ti\u0107enom konvoju odvezli u bazu
  ISAF-a Warehouse u Kabulu, gdje su smje\u0161teni pripadnici 13. hrvatskog kontingenta.
  Odmah po dolasku u bazu, upoznati su s uvjetima \u017eivota i rada u misiji, u kojoj
  je sada 13. hrvatski kontingent razmje\u0161ten na podru\u010dju triju regionalnih
  zapovjedni\u0161tava, u sjevernoj i zapadnoj regiji, te u glavnom gradu Kabulu.\\n\\nMinistar
  obrane Branko Vukeli\u0107, glavni inspektor obrane general-pukovnik Marijan Marekovi\u0107
  i zapovjednik 13. HRVCON-a u misiji ISAF brigadir Martin Star\u010devi\u0107 susreli
  su se ve\u0107 prvog dana boravka u kampusu Warehouse sa zapovjednikom Regionalnog
  zapovjedni\u0161tva Kabul (RCC), brigadnim generalom Michaelom Stollsteinerom. General
  Stollsteiner izvijestio je hrvatsko izaslanstvo o sigurnosnoj situaciji u toj regiji
  te aktivnostima u sljede\u0107em razdoblju u Afganistanu, osobito s pripremama za
  osiguranje mirne provedbe izbora u toj zemlji krajem kolovoza 2009. \\\"Posebno
  bih \u017eelio istaknuti da na ovaj kamp nije bilo raketnog napada unatrag sedam
  mjeseci, u \u010demu su klju\u010dnu ulogu odigrale upravo postrojbe Vojne policije
  i njihov rad na terenu, u \u010dijem je sastavu i 27 pripadnika Vojne policije OSRH
  ovdje u Kabulu\\\", rekao je Stollsteiner, ina\u010de pripadnik francuskih oru\u017eanih
  snaga, koji je tom prigodom posebno istaknuo profesionalnost pripadnika OSRH u misiji
  ISAF.\\n\\nSigurnosna situacija danas boljeg prije \u0161est mjeseci\\n\\nMinistar
  Vukeli\u0107 informirao je generala Stollsteineru o sudjelovanju Hrvatske u 16 mirovnih
  misija diljem svijeta, posebno naglasiv\u0161i va\u017enost misije ISAF, u kojoj
  sudjeluje 295 pripadnika OSRH, a osobito je istaknuo zada\u0107e koje na\u0161i
  pripadnici obavljaju na obuci i mentoriranju afghanistske vojske.\\n\\nU Glavnom
  sto\u017eeru misije ISAF u Kabulu, izaslanstvo MORH-a susrelo se dan poslije\\n\\nsa
  zamjenikom zapovjednika ISAF-a general-pukovnikom Jimom Duttonom, koji je iscrpno
  izvijestio ministra Vukeli\u0107a o operaciji ISAF. Ocjenio je iznimno kvalitetnima
  zada\u0107e \u0161to ih pripadnici OSRH obavljaju u sklopu te me\u0111unarodne misije.
  General Dutton naglasio je kako, prema zadnjim istra\u017eivanjima javnog mnijenja,
  35 posto Afganistanaca smatra da je sigurnosna situacija u zemlji danas bolja nego
  prije \u0161est mjeseci, unato\u010d ve\u0107em broju incidenta. Protuma\u010dio
  je to podatkom da se 80 posto svih napada talibana doga\u0111a u 15 posto distrikata,
  u kojima \u017eivi 21 posto afghanistanskog stanovni\u0161tva. Tako\u0111er, istaknuo
  je kako je broj civilnih \u017ertava 27 posto manji, no zabrinjavaju\u0107e je pove\u0107anje
  broja \u017ertava vojnog osoblja. Ministar Vukeli\u0107 i general-pukovnik Marijan
  Marekovi\u0107 istaknuli su ulogu pripadnika OSRH u Afganistanu, posebno se osvrnuv\u0161i
  na aktivnosti na\u0161ih vojnika na podru\u010dju Regionalnog zapovjedni\u0161tva
  Sjever.\\n\\n**Obuka pripadnika ANA-e te\u017ei\u0161na zada\u0107a**\\n\\nIzaslanstvo
  MORH-a sastalo se istog dana i s na\u010delnikom Glavnog sto\u017eera ANA-e generalom
  Bismillahom Khan Mohammadijem. Ministar Vukeli\u0107 tom je prigodom istaknuo kako
  Hrvatska planira pove\u0107ati broj vojnika u misiji ISAF za tridesetak, \u010dime
  bi njihov ukupan broj u 2010. godini bio 330 ljudi. Te\u017ei\u0161te \u0107e i
  dalje biti na programima namijenjenima obuci afghanistanske narodne vojske (ANA),
  a ujedno je istaknuta i mogu\u0107nost obuke pripadnika ANA-e u Hrvatskoj. General
  Mohammadi je rekao da su mu dobro poznate aktivnosti pripadnika OSRH, a posebice
  je istaknuo OMLT-e, koji imaju izvrsnu suradnju s afghanistanskom vojskom, dodav\u0161i
  da je ANA mlada vojska, te je zahvalio Republici Hrvatskoj i osobito Ministarstvu
  obrane na pomo\u0107i koju im pru\u017eaju.\\n\\nBoravak u Kabulu iskori\u0161ten
  je i za susret s prvim potpredsjednikom Islamske Republike Afganistan, Ahm\u0430\u0434om
  Zia Massoudom. Tom prigodom ministar Vukeli\u0107 istaknuo je da Hrvatska dobro
  zna koliko je mir va\u017ean za napredak i prosperitet svake dr\u017eave, napomenuv\u0161i
  kako je Hrvatska u kratkom vremenu od zemlje primateljice pomo\u0107i me\u0111unarodnih
  mirovnih snaga postala zemlja \u010diji pripadnici oru\u017eanih snaga sudjeluju
  u mirovnim misijama diljem svijeta, od \u010dega ih je najvi\u0161e upravo u Afganistanu.
  Potpredsjednik Massoud posebno se zanimao za mogu\u0107nosti uklju\u010divanja hrvatskih
  tvrtki u poslove obnove infrastrukture u toj zemlji, ali tako\u0111er i za mogu\u0107nost
  edukacije studenata u Hrvatskoj s obzirom na izuzetno nizak stupanj obrazovanja
  u Afganistanu. General Marijan Marekovi\u0107 i brigadir Martin Star\u010devi\u0107
  u razgovoru s potpredsjednikom Massoudom opisali su zada\u0107e i na\u010din rada
  pripadnika OSRH u toj zemlji, istaknuv\u0161i da je suradnja s afghanistanskom nacionalnom
  vojskom vrlo dobra te da pripadnicima ANA-e ne nedostaje motiva i \u017eelje ve\u0107
  oprema i obuka. Upravo obuka pripadnika ANA-e jedna je od glavnih zada\u0107a pripadnika
  OSRH u misiji ISAF u Afganistanu.\\n\\n**Posjet dje\u010djem vrti\u0107u i hrvatskim
  vojnicima u bazi Marmal**\\n\\nIzaslanstvo MORH-a, \u0161to je ve\u0107 tradicionalno,
  posjetilo je u Kabulu i dje\u010dji vrti\u0107 policijskih djelatnika - \u010dije
  su igrali\u0161te ure\u0111ili pripadnici na\u0161e Vojne policije - te mu doniralo
  nu\u017enu pomo\u0107.\\n\\nU ve\u010dernjim satima, tijekom dru\u017eenja u kampu
  Warehouse, ministar Vukeli\u0107 je hrvatskim vojnicima u misiji ISAF uru\u010dio
  satelitsku opremu za bolje pra\u0107enje hrvatskih TV programa te stolove za stolni
  nogomet, sve prema njihovoj \u017eelji. Dru\u017eenje je proteklo u ugodnoj atmosferi
  uz ro\u0161tilj koji su pripremili sami pripadnici OSRH.\\n\\nPosjet najve\u0107oj
  skupini pripadnika OSRH, koja se nalazi u kampu Marmal u Mazar-e-Sharifu na sjeveru
  Afganistana, prire\u0111en je zadnjeg dana boravka hrvatskog izaslanstva u Afganistanu.\\n\\nOdmah
  po dolasku, ministar Vukeli\u0107 i general Marekovi\u0107 obi\u0161li su prostore
  u kojima \u017eive i rade hrvatski vojnici te su odr\u017eali sastanak s njima kako
  bi se iz prve ruke upoznali sa svim elementima rada pripadnika OSRH u toj misiji.
  Zaklju\u010dak je da su uvjeti znatno bolji nego prija\u0161njih godina, ali svakako
  ima prostora za njihovo pobolj\u0161anje, posebice na podru\u010dju logisti\u010dke
  potpore. Hrvatsko izaslanstvo na kraju posjeta bazi Marmal susrelo se i sa zapovjednikom
  Regionalnog zapovjedni\u0161tva Sjever, njema\u010dkim brigadnim generalom Joergom
  Vollmerom, koji ih je izvjestio o sigurnosnom stanju u toj regiji.\\n\\nHrvatska
  je spremna sredinom ovoga mjeseca poslati na Kosovo dva helikoptera s 20 vojnika.
  U misiji ISAF, uz zadr\u017eavanje na\u0161eg anga\u017emana s tri OMLT-a, Hrvatska
  planira poslati vojne instruktore u in\u017eenjerijsku \u0161kolu ANA-e, a razmatra
  i mogu\u0107nosti slanja dva policijska mentorska tima kao izravni doprinos obuci
  policijskih snaga u Afganistanu, rekao je ministar Vukeli\u0107.\\n\\nMinistri obrane
  NATO-a o misiji KFOR i ISAF\\n\\nMinistri obrane 28 zemalja \u010dlanica NATO-a
  na\u010delno su se dogovorili da se NATO-ove mirovne snage na Kosovu smanje sa sada\u0161njih
  oko 14.000 na 10.000 pripadnika do po\u010detka sljede\u0107e godine, rekao je glavni
  tajnik Saveza, Jaap de Hoop Scheffer, na redovitom godi\u0161njem sastanku ministara
  obrane Sjevernoatlantskog vije\u0107a odr\u017eanom 11. i 12. lipnja u Bruxellesu.\\n\\nNa
  sastanku je sudjelovao i hrvatski ministar obrane Branko Vukeli\u0107, prvi put
  od ulaska Hrvatske u Savez. Ministar Vukeli\u0107 je izjavio da je sigurnosna situacija
  na Kosovu stabilna i dobra te se stoga planira u sljede\u0107e dvije godine znatno
  smanjiti broj pripadnika KFOR-a. Dodao je i da je Hrvatska spremna sredinom ovoga
  mjeseca poslati na Kosovo dva helikoptera s 20 vojnika. \\\"Ono \u0161to sam danas
  istaknuo jest da je vrlo va\u017ena i nu\u017ena daljnja nazo\u010dnost NATO-a na
  Kosovu, da treba obratiti pozornost na sve procese koji se odvijaju na Kosovu, ali
  i u Bosni i Hercegovini, jer stabilnost tih dviju zemalja izravno utje\u010de na
  stabilnost cijele regije\\\", rekao je hrvatski ministar.\\n\\nNATO-ove mirovne
  snage na Kosovu (KFOR) trebale bi se postupno transformirati u snage za odvr\u0107anje.
  Prema dostupnim informacijama smanjenje snaga na 10 000 vojnika do po\u010detka
  sljede\u0107e godine jest prva faza postupnog smanjivanja. Nakon toga slijedilo
  bi smanjenje na 6500, a onda na 2500 pripadnika, ako sigurnosna situacija ostane
  stabilna kakva je danas.\\n\\nPrvi dan ministarskog susreta posve\u0107en je osim
  mirovnoj operaciji KFOR-a na Kosovu i borbi protiv piratstva, transformaciji i novoj
  ulozi Saveza, izgradnji sposobnosti i interoperabilnosti me\u0111u saveznicima i
  partnerima, te reformi sjedi\u0161ta NATO-a. Takoder se raspravljalo o novim procesima
  obrambenog planiranja, utjecaju financijske krize na obrambene sposobnosti i o trenuta\u010dnom
  stanju nuklearnih sposobnosti Saveza.\\n\\nPove\u0107ati napore u Afganistanu\\n\\nDvodnevni
  sastanak ministara obrane zemalja \u010dlanica NATO-a zavr\u0161io je raspravom
  o misiji ISAF, u kojoj su osim \u010dlanica NATO-a sudjelovali i predstavnici drugih
  zemalja koje pridonose u toj misiji. Ministar obrane Republike Hrvatske Branko Vukeli\u0107
  u glavnoj raspravi istaknuo je kako je nu\u017eno pove\u0107ati napore NATO-a za
  pomo\u0107 afganistanskim vlastima u razvoju sposobnosti za samostalno upravljanje
  obrambeno-sigurnosnim institucijama te dr\u017eave. \\\"Hrvatska sudjeluje sa zna\u010dajnim
  snagama u Afganistanu, ne toliko u broj\u010danom koliko u kvalitativnom smislu.
  Tim naporima zemlje \u010dlanice NATO-a nastoje \u0161to prije i \u0161to bolje
  pripremiti afganistansku vojsku i policiju da mogu samostalno obavljati svoje du\u017enosti\\\",
  rekao je ministar Vukeli\u0107. \\\"Prepoznaju\u0107i anga\u017eman NATO-a u Afganistanu
  kao dugoro\u010dnu obvezu, Hrvatska smatra da je upravo aktivnost u pru\u017eanju
  pomo\u0107i institucijama afganistanske vlasti izravan doprinos NATO-ovoj izlaznoj
  strategiji.\\\" U tom smislu Hrvatska potpuno podr\u017eava osnivanje NTM-a (NATO
  training mission) u Afganistanu, naglasio je Vukeli\u0107. Uz zadr\u017eavanje na\u0161eg
  anga\u017emana s tri OMLT-a, Hrvatska planira poslati vojne instruktore u in\u017eenjerijsku
  \u0161kolu ANA-e (afganistanske vojske). Takoder, Hrvatska razmatra mogu\u0107nosti
  slanja dva policijska mentorska tima kao izravni doprinos obuci policijskih snaga
  u Afganistanu, zaklju\u010dio je ministar Vukeli\u0107.\\n\\nPosjet na\u010delnika
  GSOS Republike Turske\\n\\nU sklopu dvodnevnog posjeta Hrvatskoj, izaslanstvo OS
  Republike Turske, predvode\u0107u na\u010delnikom GSOS generalom zbora Ilkerom Basbugom,
  primio je 12. lipnja u slu\u017ebeni posjet na\u010delnik GSOSRH general zbora Josip
  Luci\u0107. Tijekom susreta na\u010delnici su razgovarali o ustroju i reformi OSRH,
  sustavu obuke i \u0161kolovanja i projektima opremanja i modernizacije. Sa zadovoljstvom
  su potvrdili dosada\u0161nju vi\u0161egodi\u0161nju uspje\u0161nu suradnju i ocijenili
  je iznimno va\u017enom za stabilnost i sigurnost u regiji. Suradnja \u0107e sada
  dobiti na dodatnoj kvaliteti zbog \u010dinjenice da je Republika Hrvatska postala
  punopravnim \u010dlanicom NATO Saveza. Na\u010delnici glavnih sto\u017eera posjetili
  su zatim Zapovjedno operativno sredi\u0161te GSOSRH, gdje su se upoznali sa sudjelovanjem
  pripadnika OSRH u me\u0111unarodnim vojnim operacijama. Izaslanstvu turskih OS predstavljeni
  su i proizvodi karlova\u010dke tvrtke HS Produkt, kojima se slu\u017ee pripadnici
  OSRH.\\n\\nOJI\\n\\nKanadsko izaslanstvo u ZzpP-u\\n\\nZapovjednik kanadskog Zapovjedni\u0161tva
  za potporu general-bojnik Daniel Benjamin boravio je sredinom lipnja u vi\u0161ednevnom
  posjetu Zagrebu. General Benjamin sastao se u MORH-u sa zamjenikom na\u010delnika
  GS-a za operacije OSRH kontraadmiralom Zdenkom Simi\u010di\u0107em te sa svojim
  hrvatskim kolegom brigadnim generalom Matom Ostovi\u0107em.\\n\\nKanadsko je izaslanstvo
  tako\u0111er obi\u0161lo u vojarni u Velikoj Buni Zapovjedni\u0161tvo za potporu,
  gdje je upoznato s ustrojem i djelovanjem ZzpP-a te su razmijenjena iskustva iz
  struke. Kanadsko izaslanstvo posjetilo je i Sredi\u0161te za obuku i doktrinu logistike
  u Po\u017eegi te cestovno vje\u017ebali\u0161te Glavica.\\n\\nOJI\\n\\nZapovjednik
  Talijanske ratne mornarice u HRM-u\\n\\nHrvatsku ratnu mornaricu posjetio je 16.
  lipnja zapovjednik Talijanske ratne mornarice, admiral Paolo La Rosa. Bilateralna
  suradnja dviju mornarica bila je najva\u017enija tema razgovora tijekom susreta
  sa zapovjednikom HRM-a kontraadmiralom Antom Urli\u0107em. Izme\u0111u ostalog razgovarali
  su o funkcioniranju Obalne stra\u017ee, o nadzoru Jadranskog mora i u\u010dinkovitosti
  na\u010dina na koji su uvezani hrvatski i talijanski mornari\u010dki radari, o operaciji
  Atlanta, koja se pod okriljem Europske unije odvija u Adenskom zaljevu i u somalskim
  vodama, te o mogu\u0107nosti ukrcaja hrvatskih \u010dasnika na talijanske brodove.
  Na kraju, kontraadmiral Urli\u0107 je upoznao gosta s planovima razvoja HRM-a.\\n\\nAdmiral
  La Rosa obi\u0161ao je i Operativno sredi\u0161te HRM-a te brodove RTOP-12 Kralj
  Dmitar Zvonimir i RTOP-41 Vukovar. Posebnost posjeta bila je u polaganju vijenaca
  na spomenik Vi\u0161ki lav u Visu, podignut u spomen na poginule u Vi\u0161kom boju.\\n\\nOJI\\n\\nBlagoslov
  obnovljene kapele i novog zvona\\n\\nU Vojnoj kapelaniji \\\"Sv. Mihovil Arkan\u0111eo\\\",
  u sklopu HVU-a \\\"Petar \u017drinski\\\", blagoslovljena je 16. lipnja obnovljena
  kapela i novi zvonok sa zvonom. Blagoslov i misu predvodio je vojni ordinarij mons.
  Juraj Jezerinac u pratnji mons. Josipa \u0160anti\u0107a te vojnij kapelana. Brojne
  djelatnike i polaznike U\u010dili\u0161ta, me\u0111u kojima je bio i ravnatelj HVU-a
  general-bojnik Mirko \u0160undov, pozdravio je vojni kapelan fra \u017darko Relota.
  Zahvaliv\u0161i svima koji su pomogli u obnovi kapele, u kojoj je u tijeku postavljanje
  vitraja, zaklju\u010dio je da je upravo taj, kako je rekao, kulturni i duhovni objekt
  najbolja reklama HVU-a.\\n\\nM. ALVIR\\n\\nOdr\u017eavanje te\u010daja CREVAL na
  Hrvatskom vojnom u\u010dili\u0161tu od 15. do 19. lipnja, u skladu s ve\u0107 istaknutim
  potrebama za ocjenjiva\u010dima, izazvalo je veliko zanimanje u mnogim zemljama
  NATO-a i partnerima, zainteresiranim za slanje polaznika. Naposljetku, prihva\u0107eno
  je 50 polaznika iz 12 zemalja, od kojih je 20 hrvatskih \u010dasnika.\\n\\n**Te\u010daj
  ocjenjiva\u010da borbene spremnosti**\\n\\nPoznato je da vojske zemalja \u010dlanica
  NATO-a i partnera koji se \u017eele priklju\u010diti Savezu moraju po\u0161tovati
  mnoge visoke profesionalne standarde \u0161to ih iziskuje Savez. Oni osobito dolaze
  do izra\u017eaja kod postrojbi koje bi trebale biti deklarirane kao spreme\u0107e
  za djelovanje u operacijama NATO-a. Naravno, prihva\u0107eni standardi moraju biti
  i potvr\u0111eni raznim vje\u017ebama i aktivnostima, o kojima se o\u010dituju \u010dasnici-ocjenjiva\u010di.
  Rad ocjenjiva\u010da naposljetku dovodi do ocjene spremnosti. Da bi ocjenjivali
  svoje i strane postrojbe, ti ljudi moraju po\u0161tovati iznimno visoke kriterije,
  posjedovati sasvim specifi\u010dna znanja, iscrpno poznavati zahtjevne NATO-ove
  standarde i procedure.\\n\\nKad je rije\u010d o ocjenjivanju postrojbi kopnene vojske,
  najve\u0107u te\u017einu imaju certifikati \u0161to ih ocjenjiva\u010di stje\u010du
  u NATO-ovoj \u0161koli u Oberammergauu u Njema\u010dkoj. U \u0161koli se dvaput
  godi\u0161nje provodi te\u010daj za ocjenjivanje borbene spremnosti za kopnene snage
  2. razine (te\u010daj CREVAL), a provode ga stru\u010dnjaci NATO-ova Zapovjedni\u0161tva
  za operacije. No, potreba za ocjenjiva\u010dima 2. razine pove\u0107ava se u mnogim
  zemljama, tako da \u0161kola u Oberammergauu ne mo\u017ee zadovoljiti sve zahtjeve
  \u010dlanica i partnera.\\n\\nOdre\u0111en broj visokoprofiliranih ocjenjiva\u010da
  potreban je i na\u0161im Oru\u017eanim snagama, osobito otkad smo postali \u010dlanicom
  NATO-a. Stoga je te\u010daj CREVAL, odr\u017ean na Hrvatskom vojnom u\u010dili\u0161tu
  od 15. do 19. lipnja, izvrsno rje\u0161enje. Naime, on ima jednaku te\u017einu kao
  i oni koji se odr\u017eavaju u Oberammergauu, uspje\u0161ni polaznici dobivaju jednake
  certifikate, provode ga isti organizatori i predava\u010di, ali uz veliku pomo\u0107
  Uprave za operativne poslove GSOSRH-a. Njegovo o\u017eivotvorenje plod je hrvatske
  inicijative, nastale po\u010detkom ove godine i kona\u010dno ostvarene 21. svibnja,
  kad je izme\u0111u NATO-ove \u0161kole i Hrvatskog vojnog u\u010dili\u0161ta potpisan
  Memorandum o me\u0111usobnoj suradnji. Te\u010daj je prvi doga\u0111aj koji se provodi
  na temelju Memoranduma, a potpis zapovjednika NATO-ove \u0161kole brigadira Jamesa
  Tabaka potvr\u0111uje da je rije\u010d o istom te\u010daju kao i u Njema\u010dkoj,
  jedino \u0161to je lokacija HVU.\\n\\nOdr\u017eavanje te\u010daja je, u skladu s
  ve\u0107 istaknutim potrebama za ocjenjiva\u010dima, izazvalo veliko zanimanje u
  mnogim zemljama NATO-a i partnerima, zainteresiranim za slanje polaznika. Naposljetku,
  prihva\u0107eno je 50 polaznika iz 12 zemalja, me\u0111u kojima je 20 hrvatskih
  \u010dasnika. Od ideje do realizacije proteklo je samo nekoliko mjeseci, no te\u010daj
  se, u trenutku pisanja ovoga \u010dlanka, odvijao potpuno kako je predvideno i zadovoljstvo
  je bilo prisutno kod svih: i kod NATO-ovih predava\u010da i kod polaznika. Dakako,
  najvi\u0161e razloga za zadovoljstvo ima upravo OSRH, te \u010dasnici koji su najzaslu\u017eniji
  za o\u017eivotvorenje ideje: brigadni general Drago Matanovi\u0107, brigadir Ivica
  Kinder, te pukovnici Marin Kara\u010di\u0107 i Dean Kranj\u010dec, koji je i direktor
  te\u010daja. Kao prvo, Hrvatska dobiva ve\u0107i broj potrebnih ocjenjiva\u010da,
  a kao drugo, OSRH i HVU pokazali su visoke mogu\u0107nosti organizacije i provedbe
  projekta koji se dosad odr\u017eavao samo u najvi\u0161oj NATO-ovoj obrazovnoj ustanovi.
  Tako\u0111er, potpisi Memorandum utire put i mnogim daljnjim oblicima suradnje HVU-a
  i NATO-ove \u0161kole, od kojih \u0107e velike koristi imati obje strane. Najve\u0107e
  pohvale do\u0161le su od slovenskog pukovnika Drage Magdi\u0107a i ameri\u010dkog
  kapetana fregate Bobbyja Bakera, obojice iz SHAPE-a, koji su i iz prakse potvrdili
  da je zagreba\u010dki te\u010daj potpuno na razini NATO-ove \u0161kole.\\n\\nSvrha
  seminara je predstavljanje sveobuhvatnog pristupa problemu terorizma, uz razmatranje
  mogu\u0107nosti preventivnih djelovanja vlada pojedinih dr\u017eava radi prevencije,
  odnosno odgovora u slu\u010daju teroristi\u010dkog \u010dina...\\n\\n**Snage za
  specijalna djelovanja i budu\u0107e teroristi\u010dke prijetnje**\\n\\n\u201cSnage
  za specijalna djelovanja i budu\u0107e teroristi\u010dke prijetnje\u201d naziv je
  me\u0111unarodnog seminarra, odr\u017eanog od 9. do 11. lipnja u vojarni \u201cKov\u010danje\u201d
  na Malom Lo\u0161inju. Svrha seminara je predstavljanje sveobuhvatnog pristupa problemu
  terorizma, uz razmatranje mogu\u0107nosti preventivnih djelovanja vlada pojedinih
  dr\u017eava, radi prevencije odnosno odgovora u slu\u010daju teroristi\u010dkog
  \u010dina, kao i protuteroristi\u010dkih strategija, s naglaskom na teoriji i meduresornoj
  suradnji u borbi protiv terorizma.\\n\\nSeminar je organiziran u suradnji s Uredom
  za obrambenu suradnju Veleposlanstva SAD-a u Zagrebu, u sklopu programa stipendiranja
  simpozija i seminara o protuterorizmu, a ve\u0107ina predava\u010da bila je s ameri\u010dkog
  vojnog Sveu\u010dili\u0161ta zdru\u017eenih snaga za specijalna djelovanja. Jedan
  od njih je i umirovljeni brigadir Joseph Celeksi, koji je istaknuo da im je cilj
  pomo\u0107i stvaranju regionalnih partnerstava i mre\u017ea specijalnih snaga. \u201cMi
  ne \u017eelimo ovde govoriti o taktici, kako pucati i sli\u010dnim stvarima, nego
  \u017eelimo razgovarati s dr\u017eavnim du\u017enosnicima te predstavnicima vojske
  i policije kako bismo zaklju\u010dili \u0161to je va\u017eno za politiku, stvaranje
  strategija i planova nacionalne sigurnosti\u201d, rekao je, zaklju\u010div\u0161i
  da je najva\u017enija razmjena ideja me\u0111u predstavnicima razli\u010ditih dr\u017eava.\\n\\nUime
  ministra obrane sudionike seminara pozdravio je dr\u017eavni tajnik MORH-a Pjer
  \u0160imunovi\u0107, koji je ujedno izlagao na temu \u201cNacionalna strategija
  spre\u010davanja i suzbijanja terorizma\u201d. Istaknuo je va\u017enost seminara
  o, kako je rekao, toj najve\u0107oj prijetnji nacionalnoj sigurnosti Hrvatske, te
  me\u0111unarodnoj sigurnosti. Kao aktualni svjetski problem posebno je istaknuo
  me\u0111unarodni terorizam: \u201cU tom smislu ovaj seminar je iznimno va\u017ean
  da bismo stekli jo\u0161 bolji uvid u prirodu terorizma, u modele psiholo\u0161ke
  i organizacijske motivacije terorista i teroristi\u010dkih organizacija, kao i najprikladnije
  na\u010dine suzbijanja te prijetnje, kako na nacionalnoj tako i na me\u0111unarodnoj
  razini, kako bi se sprije\u010dio terorizam u svom pojavnom obliku, kao i njegovi
  uzroci.\u201d\\n\\n**OSRH spreman dati potporu u prevenciji terorizma**\\n\\nSudionicima
  se obratio i zamjenik na\u010delnika GSOS-a za operacije kontradmiral Zdenko Simi\u0107i\u0107,
  koji je tako\u0111er istaknuo va\u017enost seminara. Napominju\u0107i da je, u skladu
  s hrvatskim zakonima, Ministarstvo unutarnjih poslova zadu\u017eeno za borbu protiv
  terorizma na teritoriju Hrvatske, poru\u010dio je da su i na\u0161e Oru\u017eane
  snage spremne dati potporu u prevenciji terorizma i mogu\u0107im protuteroristi\u010dkim
  djelovanjima: \u201cKao nova \u010dlanica NATO saveza, \u017eelimo u suradnji s
  njima, kao i sa specijalnim snagama oru\u017eanih snaga prijateljskih zemalja, razvijati
  spoznaje o globalnom terorizmu, koji je najve\u0107a prijetnja dana\u0161njice.\u201d
  Izraziv\u0161i zadovoljstvo odazivom drugih zemalja, napomenuo je da ovaj seminar
  omogu\u0107uje teoretske spoznaje o tom problemu i da je to ujedno uvod u prakti\u010dno
  uvje\u017ebavanje pripadnika postrojbi za specijalna djelovanja na me\u0111unarodnoj
  vojnoj vje\u017ebi Jackal Stone, koja \u0107e se odr\u017eati u rujnu ove godine.
  O tome je govorio i zapovjednik Bojne za specijalna djelovanja HKoV-a brigadir Nikola
  \u017dupani\u0107, koji je tako\u0111er istaknuo ulogu snaga za specijalna djelovanja
  u borbi protiv terorizma.\\n\\nVje\u017eba na poligonu \\\"Crvena zemlja\\\" kraj
  Knina bila je prvi ve\u0107i bilateralni vje\u017ebovni doga\u0111aj u kojemu je
  OSRH djelovao kao vojska punopravne \u010dlanice NATO-a. Hrvati i Amerikanci morali
  su djelovati kao jedinstvena NATO-ova postrojba u mirovnoj misiji...\\n\\nSuradnja
  Oru\u017eanih snaga Republike Hrvatske i Nacionalne garde Minnesota traje ve\u0107e
  godinama. Hrvatski vojnici \u010desto putuju u dr\u017eavu na sjeveru SAD-a i ondje
  se uvje\u017e\u0431\u0430\u0432aju zajedno sa svojim ameri\u010dkim kolegama. Vjerojatni
  vrhunac suradnje u Hrvatskoj jesu vojne vje\u017ebe Guardex, ve\u0107 tradicionalni
  susreti u kojima na\u0161i i ameri\u010dki vojnici nastoje raditi na uskladivanju
  zajedni\u010dkog djelovanja po strogo utvr\u0111enim NATO-ovim procedurama i standardima.
  Sigurno je da su te vje\u017ebe itekako pridonijele da hrvatski vojnici koji su
  ih prolazili dobiju nezamjenjivu \u201cNATO-praksu\u201d, ne\u0161to \u0161to se
  ne mo\u017ee nau\u010diti na seminarima ili stru\u010dnim radionicama. Ipak, i u
  Minnesoti su uvijek voljeli govoriti da na Hrvate ne gledaju kao na u\u010denike
  nego kao na ravnopravne partnere, od kojih mnogi imaju i ratno iskustvo, koji na
  zajedni\u010dkim vje\u017ebama mogu nadopuniti i njihove kapacitete. Ukratko, interakcija
  je uvijek bila na visokoj razini i obje su strane govorile samo o pozitivnim dojmovima.\\n\\nGuardex
  \u201809 ipak \u0107e se posebno pamti\u0107i. Vje\u017eba na poligonu \u201cCrvena
  zemlja\u201d kraj Knina bila je prvi ve\u0107i bilateralni vje\u017ebovni doga\u0111aj
  u kojemu je OSRH djelovalo kao vojska punopravne \u010dlanice NATO-a. Ta \u010dinjenica
  na\u0161im momcima nije dopu\u0161tala opu\u0161tanje nego upravo suprotno. Hrvati
  i Amerikanci morali su djelovati kao jedinstvena NATO-ova postrojba u mirovnoj misiji.
  Tako je i bilo.\\n\\nVe\u0107i dio tereta organizacije vje\u017ebe pao je na Gardijsku
  motoriziranu brigadu HKoV-a i njezina zapovjednika, brigadnog generala Mladena Fuzula,
  koji je obavljao funkciju direktora vje\u017ebe. Pripreme su, dakako, po\u010dele
  mnogo ranije, ali sama vje\u017eba odvijala se od 1. do 12. lipnja. Sudjelovalo
  je 350 vojnika, s time da se Pje\u0161a\u010dki vod NGM-a uklju\u010dio u sastav
  Pje\u0161a\u010dke satnice HKoV-a. Osim vi\u0161e postrojbi Koprjene vojske, udio
  je dao i HRZ. Sami provedbeni dio Guardexa \u201809 kulminirao je i zavr\u0161io
  10. lipnja, kad su svoje vojnike do\u0161li obi\u0107i najvi\u0161i \u010dasnici
  dviju vojski, na\u010delnik GSOSRH general zbor-a Josip Luci\u0107 i zapovjednik
  Nacionalne garde Minnesota general-bojnik Larry Shellito. Dvojicu generala je u
  Danu uva\u017eenih gostiju pratilo jo\u0161 ni\u017e visokopozicioniranih \u010dasnika
  OSRH i NGM-a, te pripadnici Vojnodiplomatskog zbora u Republici Hrvatskoj.\\n\\nToga
  dana vojnici su rje\u0161avali tri simulirana incidenta, koja smo ipak promatrali
  sa sigurne udaljenosti. Naime, iako la\u017eni, incidenti su bili prili\u010dno
  burni, a motanje novinara oko paljbenih pozicija ili na putu uzurbanim specijalcima
  sigurno ne bi priopomglo njihovo ve\u0107oj u\u010dinkovitosti. Svaki korak udaljenijih
  vojnika i njihovih vozila te leteljica rije\u010dima je i uz pomo\u0107 karte obja\u0161njavao
  bojnik Ivica Bajami\u0107, tako da nije bilo boja\u017eni da \u0107emo se izgubiti
  zbog brzine doga\u0111aja. Tako brzo sve i mora biti: momci iz Hrvatske i Minnesota
  svoj su posao morali obavljati kako i prili\u010di vojnicima koji uz svoje dr\u017eavne
  zastave isti\u010du i plavu NATO-ovu.\\n\\nUkratko, u vje\u017ebi vojska se susrela
  s napadom iz zasjede na ophodnju vozila, s improviziranim eksplozivnim sredstvom,
  snajperskom vatrom te s teroristi\u010dkim napadima u improviziranom seocu. Rje\u0161avanje
  takvih problema iziskivalo je ne samo me\u0111udr\u017eavnu suradnju nego i suradnju
  vojnika razli\u010ditih specijalnosti, tako da je uskladivanje postojalo i unutar
  Nacionalne garde i OSRH, a ne samo izme\u0111u njih. Dakako, djelovanja su ipak
  imala \u201cdublji pe\u010dat\u201d OSRH ve\u0107 zbog \u010dinjenice \u0161to je
  ameri\u010dki vod uklonjen u hrvatske postrojbe. U vje\u017ebama koje se odr\u017eavaju
  u Minnesoti, dakako to je obratno. Da zaklju\u010dimo, iz cijelog kolopteta u kojemu
  su sudjelovali vojnici koji su se koristili raznim oru\u017ejem te oklopnim vozilima
  i helikopterom, na kraju su isplivali upravo najva\u017eniji ciljevi vje\u017ebe:
  potvr\u0111eni su visoka interoperabilnost primjenom NATO-ovih doktrina i procedura,
  sposobnosti za provedbu operacija potpore miru te sposobnosti za obuku, planiranje
  vje\u017ebi, kao i za organizaciju i provedbu tih vje\u017ebi.\\n\\nBILATERALNA
  VJE\u017dBA\\n\\nUspje\u0161no djelovanje koje smo gledali u tih sat i pol vremena
  bilo je zaklju\u010dni dio procesa kojemu su se na pra\u0161ini \u201cCrvene zemlje\u201d
  vojnici posve\u0107ivali vi\u0161e dana. Na kraju su, na zajedni\u010dkom postrojavanju
  kojim je vje\u017eba zaklju\u010dena, dobili zaslu\u017eene pohvale, i to upravo
  od svojih najvi\u0161ih zapovjednika, generala Luci\u0107a i Shellitta. Dru\u010di\u0107e
  nije bilo ni na izjavi za medije, koju su generali dali \u010dim su razgledali posebno
  pripremljeni takti\u010dko-tehni\u010dki zbor. Govore\u0107i o postrojbama OSRH,
  Shellito je rekao da su on i njegovi \u010dasnici opet vidjeli \u201cvrlo, vrlo
  dobru vojnu silu, koja napreduje iz godine u godinu\u201d. Istaknuo je zadovoljstvo
  i ponos suradnjom Ameri\u010dke i Hrvatske vojske. Prvi \u010dasnik OSRH opisao
  je raznoliki scenarij vje\u017ebe kao pripremu za eventualne nepredvidive situacije
  u mirovnim misijama \u0161to se provode u zemljama gdje postoji opasnost od terorizma.\\n\\nVrhunac
  suradnje u Hrvatskoj jesu vojne vje\u017ebe Guardex, susreti u kojima na\u0161i
  i ameri\u010dki vojnici nastoje raditi na uskla\u0111ivanju zajedni\u010dkog djelovanja
  po strogo utvr\u0111enim NATO-ovim procedurama i standardima.\\n\\nU vje\u017ebi
  vojska se susrela s napadom iz zasjede na ophodnju vozila, s improviziranim eksplozivnim
  sredstvom, snajperskom vatrom te s teroristi\u010dkim napadima u improviziranom
  selu.\\n\\nBrodovi NATO-ove skupine Standing NATO Maritime Group \u2013 SNMG2 bili
  su od 6. do 10. lipnja u posjetu Hrvatskoj ratnoj mornarici i gradu Splitu. Dva
  broda skupine SNMG2, talijanski razara\u010d ITS Luigi Durand de la Penne i gr\u010dka
  fregata HS Kountouriotis, bili su privezani u pomorskoj bazi Lora, dok su ameri\u010dki
  razara\u010d USS Laboon i \u0161panjolski tanker SPS Patino bili usidreni ispred
  gradske luke.\\n\\nZapovjednika skupine NATO-ovih brodova, talijanskog kontraadmirala
  Giovannija Gumiera u Zapovjedni\u0161tvu HRM-a primio je zamjenik zapovjednika HRM-a
  komodor Tihomir Erceg. U razgovoru je zapovjednik SNMG2 zahvalio HRM-u na prihvatu
  u pomorskoj bazi Lora, istaknuv\u0161i va\u017enost prvog posjeta NATO-ove skupine
  brodova nakon hrvatskog ulaska u NATO savez. U daljnjim razgovorima, admiral Gumiero
  je opisao sudjelovanje NATO-ovih brodova u operaciji u Adenskom zaljevu i u somalskim
  vodama. S obzirom na to da Hrvatska ratna mornarica priprema slanje svojih pripadnika
  u to krizno podru\u010dje, iskustva \u0161to ih je iznio admiral Gumiero bila su
  vi\u0161e nego dragocjena. Brodovi skupine SNMG2 pripremaju se ponovo oti\u0107i
  u somalske vode u sklopu NATO operacije.\\n\\nRazmjena iskustava nastavljena je
  i me\u0111u posadama brodova te su 10. lipnja brodovi skupine SNMG2 i dva broda
  Hrvatske ratne mornarice imali zajedni\u010dko uvje\u017ebavanje u teritorijalnim
  vodama RH odradiv\u0161i nekoliko razli\u010ditih manevra uz razmjenu glasovnih
  i zastavnih poruka. Tom prilikom, pripadnici HRM-a pokazali su da su uspje\u0161no
  obavili proces obuke po NATO standardima navigacije i komunikacije. Na ameri\u010dki
  razara\u010d USS Laboon, ukrcani su poru\u010dnica korvete Antonija Didovi\u0107
  i poru\u010dnik korvete Ljubomir Ostovi\u0107. Oni \u0107e na brodu boraviti do
  22. lipnja i biti uklju\u010deni u rad \u010dasnika palubne stra\u017ee s ameri\u010dkim
  kolegama. Plov\u0111ba izvan Jadranskog mora na brodu mnogo ve\u0107ih dimenzija
  i ve\u0107e ubojite mo\u0107i bit \u0107e izvrsno iskustvo za mlade hrvatske \u010dasnike.\\n\\nOJI
  HRM\\n\\nGodi\u0161nji seminar VOJNIH PSIHOLOGA\\n\\nU organizaciji Odsjeka za vojnu
  psihologiju MORH-a redovito se jednom godi\u0161nje odr\u017eava seminar vojnih
  psihologa, na kojemu se razmatraju najva\u017enija aktualna strukovna pitanja u
  vojnom sustavu. Ovogodi\u0161nji je seminar odr\u017ean u Splitu od 27. do 29. lipnja.
  Okupio je 44 vojna psihologa MORH-a i OSRH, a glavne teme su se doticale programskih
  podru\u010dja iz sustava upravljanja ljudskim resursima: pribavljanje osoblja, personalna
  potpora te transicija i izdvajanje osoblja, razmatranih kroz aspekte psiholo\u0161ke
  struke.\\n\\nSeminar je otvorio ravnatelj Uprave za ljudske resurse Nenad Smol\u010dec,
  a stru\u010dni dio seminara zapo\u010deo je izlaganjem \u010delnice vojnopsiholo\u0161ke
  struke bojnice Ingrid Cippico o stanju vojnopsiholo\u0161ke struke, o realiziranim
  zada\u0107ama i zada\u0107ama zapo\u010detim u prethodnom razdoblju, kao i o klju\u010dnim
  predstoje\u0107im zada\u0107ama. Bojnik Dalibor Mesi\u0107, \u010dasnik za vojnu
  psihologiju Uprave za personalne poslove GSOSRH-a, predstavio je vojnu psihologiju
  u personalnom funkcionalnom podru\u010dju tijekom 2008.-2009.\\n\\nTe\u017ei\u0161te
  ovogodi\u0161njeg seminara bilo je na prikazima aktualnih projekata MORH-a i GSOSRH-a
  utemeljenima na Dugoro\u010dnom planu razvoja OSRH 2006.-2015., u kojima sudjeluju
  i vojni psiholozi. Pukovnik Tomislav Filjak prikazao je projekt \u201cRazviti mehanizme
  i modele privla\u010denja osoblja\u201d, pokrenut radi podizanja kvalitete i popune
  Oru\u017eanih snaga najboljim kandidatima u skladu s potrebama obrambenog sustava.
  Izme\u0111u ostalog, izlo\u017een je i plan izdvajanja osoblja u 2009. kao i psihi\u010dki
  aspekti transicije. Posljednjeg dana seminara, iznesena su iskustva stecena sudjelovanjem
  na doma\u0107im i me\u0111unarodnim stru\u010dnim skupovima i izobrazbi.\\n\\nBiserka
  JAK\u0160I\u0106\\n\\nHrvatski piloti svojom su generalnom probom napravili svojevrsni
  uvod pred samo slu\u017ebeno otvaranje manifestacije te zatim nastupima u slu\u017ebenom
  dijelu subotnjeg i nedjeljnog programa premijerno predstavili svjetskoj javnosti
  novi program za sezonu 2009. u sastavu od \u0161est zrakoplova\\n\\nKRILA OLUJE\\nna
  zrakoplovnoj manifestaciji u Slova\u010dkoj\\n\\nProteklog vikenda, na aerodromu
  Piestany odr\u017eana je zrakoplovna manifestacija pod nazivom 3. slova\u010dki
  nacionalni leta\u010dki dani - Dani nacionalnog ponosa. Rije\u010d je o najve\u0107oj
  takvoj manifestaciji u Slova\u010dkoj. Povoda za odr\u017eavanje bilo je nekoliko,
  a prije svega 5. objetnica ulaska Republike Slova\u010dke u NATO i 60. obljetnica
  NATO saveza. Manifestaciju je otvorio slova\u010dki ministar obrane Jaroslav Baska,
  uz nazo\u010dnost najvi\u0161ih civilnih i vojnih du\u017enosnika te mnogobrojnih
  stranih izaslanstava i gostiju, me\u0111u kojima i vojnog izaslanika RH u Slova\u010dkoj,
  brigadira Tihomira Hercega. Pred gotovo 50 000 gledatelja predstavila su se ratna
  zrakoplovstva 11 zemalja, a HRZ i PZO predstavljala je akro-grupa \\\"Krila Oluje\\\"
  i helikopter Mi-171sh.\\n\\nHrvatski piloti svojom su generalnom probom napravili
  svojevrsni uvod pred samo slu\u017ebeno otvaranje manifestacije te zatim nastupima
  u slu\u017ebenom dijelu subotnjeg i nedjeljnog programa premijerno predstavili svjetskoj
  javnosti novi program za sezonu 2009. u sastavu od \u0161est zrakoplova, koji je
  hrvatska javnost imala prilike vidjeti na nedavnoj sve\u010danosti obilje\u017eavanja
  Dana OSRH i HKoV-a u Karlovcu.\\n\\nKao posebne atrakcije ovogodi\u0161njeg izdanja
  Piestany airshowa, uz \\\"Krila Oluje\\\" mo\u017eemo izdvojiti i nizozemski F-16
  display team, nastupe slova\u010dkog MiG-29, \u010de\u0161kog Gripena i austrijskog
  Eurofightera, poljsku akrogrupu Team Orlik te akrobacije jednog od najpoznatijih
  svjetskih akrobatskih pilota Madara Zoltana Veresa sa\\n\\nzrakoplovom Extra 300.
  Sun\u010dano vrijeme je i u nedjelju privuklo velik broj gledatelja, koji su mogli
  pratiti jednak leta\u010dki program kao i prethodnog dana.\\n\\nDok su se za promociju
  OSRH svojim akrobacijama u zraku pobrinuli piloti akro-grupe, na zemlji je u to
  vrijeme pozornost publike privla\u010dio hrvatski \u0161tand u organizaciji Zagreba\u010dkih
  ma\u017eoretkinja, koje su, uz predstavljanje HRZ i PZO, dijeljenjem promid\u017ebenih
  materijala Hrvatske turisti\u010dke zajednice reklamirale i hrvatske prirodne ljepote
  te ve\u0107 prvog dana u samo nekoliko sati podijelile vi\u0161e od 10 000 turisti\u010dkih
  bro\u0161ura.\\n\\nPosebnu \u010dast hrvatskim predstavnicima na 3. slova\u010dkim
  nacionalnim leta\u010dkim danima iskazao je svojim posjetom na\u010delnik GSOS Republike
  Slova\u010dke, general-pukovnik Lubomir Bulik. U kratkom dru\u017eenju, general
  Bulik je izrazio odu\u0161evljenje prezentacijom vje\u0161tine i profesionalnosti
  hrvatskih pilota, zahvalio na sudjelovanju te izrazio \u017eelju da hrvatski piloti
  sudjeluju i na sljede\u0107em odr\u017eavanju ove manifestacije.\\n\\nSvojom prezentacijom
  u Slova\u010dkoj piloti akro-grupe \\\"Krila Oluje\\\" zapo\u010deli su niz ovogodi\u0161njih
  me\u0111unarodnih nastupa, koji \u0107e se nastaviti ve\u0107 za dva tjedna nastupom
  na jednom od najuglednijih svjetskih aeromitinga, Airpower 09, u zrakoplovnoj bazi
  Zeltweg (Austrija), te odmah potom i na proslavi 60. obljetnice NATO saveza u zrakoplovnoj
  bazi Koksijde (Belgija), a doma\u0107a se publika u vje\u0161tinu hrvatskih pilota
  mo\u017ee jo\u0161 jednom uvjeriti ve\u0107 ovaj vikend na najve\u0107em hrvatskom
  aeromitingu, koji se odr\u017eava 20. i 21. lipnja u Vara\u017edinu, gdje \u0107e
  se HRZ predstaviti u leta\u010dkom dijelu programa zrakoplovima An-32 i MiG-21 te
  nastupom \\\"Krila Oluje\\\".\\n\\nEC175 PRESTAVLJEN NA PARIS AIR SHOWU\\n\\nNa
  jednom od najve\u0107ih zrakoplovnih sajmova u svijetu Paris Air Show, koji je po
  48. put odr\u017ean od 15. do 21. lipnja 2009., tvrtka Eurocopter priredila je europsku
  premijeru svog novog srednjeg transportnog helikoptera EC175. Na sajmu je predstavljen
  model helikoptera u naravnoj veli\u010dini, i to putni\u010dka ina\u010dica koja
  mo\u017ee ponijeti do 16 osoba. Program razvoja EC175 je Eurocopter pokrenuo u suradnji
  sa svojim kineskim partnerom tvrtkom Harbin Aviation Industry Group (HAIG), koja
  taj helikopter po\u010dinje proizvoditi za potrebe kineskih oru\u017eanih snaga
  pod oznakom Z-15.\\n\\nSedam tona te\u0161ki helikopter EC175 trebao bi svoj prvi
  probni let imati do kraja 2009., a po\u010detak isporuke prvih produkcija\u0161kih
  helikoptera EC175/Z-15 trebao bi zapo\u010deti tijekom 2012. Prema o\u010dekivanjima
  HAIG-a i Eurocoptera tijekom dvadesetogodi\u0161njeg razdoblja moglo bi biti prodano
  do 800 helikoptera tog tipa. Helikopter \u0107e pokretati dva turbovratilna motora
  Pratt & Whitney Canada PT6C-67E, svaki jakosti 2000 KS (1325 kW), s meduremontnim
  intervalom od 5000 radnih sati. Helikopter je, uz zada\u0107e transporta ljudi i
  opreme, namijenjen i za SAR & EMS zada\u010de (Search and Rescue, Emergency Medical
  Services).\\n\\nI. SKENDEROVI\u0106\\n\\nRADAR B\u00dcR\\n\\nTvrta EADS Defence
  & Security opremit \u0107e njema\u010dku vojsku (Bundeswehr) novim tipom radara
  za nadzor boji\u0161ta. Rije\u010d je o radaru B\u00dcR (Boden\u00fcberwachungsradar)
  za otkrivanje ciljeva na tlu i niskoleti\u010dih ciljeva. Prva dva tehnolo\u0161ka
  demonstratora predana su njema\u010dkom Saveznom uredu za vojne nabave (BWB), koji
  \u0107e procijeniti njihove mogu\u0107nosti. Njema\u010dka vojska treba 80-ak radara,
  a isporuka bi trebala po\u010deti 2012. B\u00dcR \u0107e oja\u010dati mogu\u0107nosti
  njema\u010dke vojske u prikupljanju podataka i izvidanju. Zasniva se na naprednoj
  AESA (Active Electronically Scanned Array) tehnologiji i omogu\u0107ava veliku preciznost.
  Zbog elektroni\u010dkog skeniranja mo\u017ee obavljati vi\u0161estruke zada\u0107e
  i ostvariti ve\u0107u u\u010dinkovitost i pouzdanost nego radari s mehani\u010dkim
  skeniranjem. Radar je postavljen na oklopno vozilo Dingo 2.\\n\\nM. PETROVI\u0106\\n\\nNOVI
  TALIJANSKI VI\u0160ENAMJENSKI RATNI BRODOVI\\n\\nPrema pisanju britanskog internetskog
  mjese\u010dnika Naval Spyglass, talijanska ratna mornarica zapo\u010dela je razradu
  takti\u010dko-tehni\u010dkih odlika novog povr\u0161inskog plovila koje bi zamijenilo
  talijanske korvete klase Minerva i odobalne patrole brodove klase Cassiopeia.\\n\\nPrema
  neimenovanim izvorima, glavna odlika novog broda trebala bi biti njegova multifunkcionalnost,
  duljine oko 110 m i istisnine oko 2500 t. Zahtijeva se postizanje maksimalne brzine
  ve\u0107e od 30 \u010dv, dok bi autonomija pri brzini krstarenja od 12 \u010dv trebala
  iznositi 5000 Nm.\\n\\nO\u010dito je da prema tehni\u010dkim zahtjevima novi brod
  talijanske mornarice naginje na koncept sli\u010dan danskom projektu Stanflex, koji
  rabi \\\"plug-in\\\" module za protubrodsku ili protupodmorni\u010dku borbu ili
  za protuminsko djelovanje. Prvi brod u klasi trebao bi u\u0107i u aktivnu slu\u017ebu
  talijanske mornarice do 2013.\\n\\nM. PTI\u0106 GR\u017dELJ\\n\\nITALIJI ISPORU\u010cENI
  SVI SPARTANI\\n\\nNa sve\u010danosti koja je 28. svibnja prire\u0111ena u sklopu
  tvornice Alenia Aeronautica, talijanskom ratnom zrakoplovstvu predan je zadnji od
  naru\u010denih dvanaest srednjih takti\u010dkih transportnih aviona C-27J Spartan.
  Svi Spartani predani su 46. zrakoplovnoj pukovniji, koja je smje\u0161tena u Pisi,
  i u transportnoj floti talijanskog ratnog zrakoplovstva zamijenit \u0107e avione
  G.222.\\n\\nTalijanski Spartani, \u010dija je isporuka zapo\u010dela tijekom 2007.,
  dosad su ostvarili nalet vi\u0161e od 5000 sati, uza svoje pro\u0161u sudjelovanje
  u Afganistanu od rujna 2008. do sije\u010dnja 2009. \u201cMini Hercules\u201d, kako
  jo\u0161 nazivaju Spartan, mo\u017ee u svojoj unutra\u0161njosti, koja je potpuno
  komplementarna sa C-130, ponijeti do 68 vojnika u \u201cklasi\u010dnoj\u201d transportnoj
  konfiguraciji, ili u MEDEVAC konfiguraciji do 36 nosila s ozlije\u0111enim osobama.
  U odnosu na G.222, Spartan ima 35% ve\u0107i dolet s teretom (koji sada iznosi 4,260
  km), 33% ve\u0107i operativni vrhunac leta (9,144 m), dok je maksimalna nosivost
  korisnog tereta 11,5 tona. Maksimalna brzina iznosi 602 km/h, a krstare\u0107a brzina
  583 km/h. Pogonsku skupinu \u010dine dva turboprop motora Rolls-Royce AE2100-D2A,
  svaki jakosti 4,637 KS.\\n\\nI. SKENDEROVI\u0106\\n\\nPOLETIO PREDATOR C AVENGER\\n\\nNakon
  gotovo \u010detverogodi\u0161njeg rada na novom tipu bespilotnog sustava, ameri\u010dka
  tvrtka General Atomics Aeronautical Systems Inc. obavila je tijekom travnja prve
  probne letove sa svojim novim tipom Predatora. Za razliku od prethodna dva Predatora
  (vrlo uspje\u0161ne A i B ina\u010dice), koja imaju pogon s klipnim odnosno turboprop
  motorom, temeljna odluka Predatora C (koji nosi i naziv Avenger) jest njegov mlazni
  motor. Za razliku od Predatora A na koji se ugraduje motor Rotax 914, odnosno od
  Predatora B, koji ima znatno mo\u0107niji Honeywell TPE 331-10T motor, Avenger je
  dobio Pratt & Whitney Canada PW545B koji mu omogu\u0107ava znatno bolje performanse.\\n\\nSama
  letjelica je dizajnirana tako da ima manji radarski i IR potpis, za \u0161to su
  zaslu\u017eni dizajn i uporaba materijala pri proizvodnji trupa, repna sekcija u
  obliku slova V te ispu\u0161ni sustav za mlazni motor u obliku slova S. Autonomija
  boravka Avengera u zraku trebala bi biti 20 sati, uz operativni vrhunac leta od
  18 288 m, dok je o\u010dekivana krstar\u010da brzina oko 400 \u010dvorova. Duljina
  trupa iznosi 12,5 m, a raspon krila 20 m. Iako tijekom prvih probnih letova Predator
  C nije imao u nosu prepoznatljivu turelju s elektroopti\u010dkim kamerama i infracrvenim
  senzorima, prema najavama General Atomicsa Avenger \u0107e zasigurno biti opremljen
  senzorskom turelom, GA-ASI Lynx\u00ae Synthetic Aperture Radar (SAR), a prema odre\u0111enim
  najavama i AESA radom te FLIR sustavom koji se priprema za borbeni avion F-35.\\n\\nPoput
  prethodnika, Predator C tako\u0111er mo\u017ee nositi aviobombe i projektile, te
  uz podvje\u0161avanje pod krila ili pod trup oni na novom Predatoru mogu biti smje\u0161teni
  i u unutra\u0161njost trupa, uz ukupnu nosivost od 1360 kg. Vrlo izgledni prvi naru\u010ditelji
  Predatora C bit \u0107e ameri\u010dko i britansko ratno zrakoplovstvo.\\n\\nI. SKENDEROVI\u0106\\n\\nNAPREDNA
  SELEKCIJA SPECIJALISTA\\n\\nIzbor najboljih vojnika za posebne i zahtjevne specijalnosti
  oduvijek je bio problem i vojske su nastojale razviti \u0161to bolje postupke i
  alate za preciznu selekciju da dobiju najbolje kandidate za potrebne du\u017enosti.
  Jedna od va\u017enijih specijalnosti zadnjih godina jesu pirotehni\u010dari - specijalisti
  za otkrivanje i onesposobljavanje eksplozivnih naprava. Znanstvenici nastoje razviti
  u\u010dinkovite modele kako otkriti osobe koje imaju najbolje predispozicije za
  bavljenje tim opasnim i va\u017enim poslom. Praksna terenu pokazala je da neki specijalisti
  imaju znatno bolju mogu\u0107nost pronala\u017eenja skrivenih naprava nego ostatak
  populacije. Odlu\u010dili su otkriti za\u0161to je tome tako te otkriti kako \u0107e
  i u drugim kandidatima prepoznati te tra\u017eene osobine. Brojnim testovima, od
  jednostavnih pisanih testova koji rabe samo papir i olovku priklju\u010deni su napredni
  testovi koji se oslanjaju na ra\u010dunala i nove programe koji trebaju detektirati
  sposobnosti me\u0111u osobljem koje i ne zna da ih ima.\\n\\nM. PETROVI\u0106\\n\\nVIJETNAM
  KUPUJE RUSKE PODMORNICE KILO 636\\n\\nObjavljeno je da \u0107e Vijetnam od Rusije
  kupiti \u0161est novih dizel-elektri\u010dnih podmornica klase Kilo (Project 636).
  Podmornice \u0107e graditi brodogradili\u0161te Admiraltyeskye Verfi iz St. Peterburga,
  a ukupna vrijednost ugovora potpisanog izme\u0111u Vijetnama i ruske dr\u017eavne
  vojne agencije za izvoz opreme Rosoboronexport iznosi oko 1,8 milijarde dolara.\\n\\nRusija
  za potrebe vijetnamske momarice gradi dvije fregate klase Gepard (Project 11661),
  a isporu\u010dila je nepotvr\u0111eni broj korveta klase Tarantul (Project 1241.8)
  te je jo\u0161 osam naru\u010deno. Potkraj o\u017eujka ove godine, u ruskom Sredne-Nevsky
  brodogradili\u0161tu polo\u017eena je kobilica za sljede\u0107u korvetu klase Tarantul
  V.\\n\\nPregovori o akviziciji podmornica trajali su nekoliko godina. Sigurno je
  da \u0107e akvizicija biti veliki financijski teret Vijetnamu te se pretpostavlja
  da \u0107e djelomi\u010dno biti financirana razmjenom dobara kao \u0161to su boksit
  i nafta.\\n\\nM. PTI\u0106 GR\u017dELJ\\n\\n**ISTRA\u017dIVA\u010cKI BROD ZA BRAZILSKU
  MORNARICU**\\n\\nPo\u010detkom travnja ove godine, u brazilski grad Rio de Janeiro
  stigao je novonabavljeni antarkti\u010dki istra\u017eiva\u010dki brod nakon gotovo
  \u0161estotjedne primopredajne plovidbe iz njema\u010dke luke Bremerhaven. U operativnu
  slu\u017ebu brazilske mornarice uveden je po\u010detkom velja\u010de ove godine
  na sve\u010danosti odr\u017eanoj u spomenutoj luci. Novi brod u sastavu mornarice
  nosi ime NPo Almirante Maximiano, duljine preko svega 93,40 m, duljine izme\u0111u
  okon\u010dica 83,21 m, projektne \u0161irine 13,40 m, visine 8,80 i gaza 6,56 m.
  Brod istisnine 5540 t izgra\u0111en je 1974. u Seattleu. Pona\u0161nje je bio namijenjen
  kao logisti\u010dki brod za potporu naftnim platformama u Sjevernom moru, a poslije
  je prera\u0111en u kocari\u0107u, koja je imala i pogon za prera\u0111u ulovljene
  ribe. Njema\u010dko brodogradili\u0161te BREDO obavio je sve potrebne radove za
  povratak broda u aktivnu slu\u017ebu u trajanju od pet mjeseci.\\n\\nPrema slu\u017ebenim
  izvje\u0161\u0107ima, oko 26 milijuna eura (33 milijuna dolara) bilo je potrebno
  za nabavu i konverziju broda kako bi mogao sigurno ploviti zale\u0111enim morem
  debljine kore do 40 cm.\\n\\nM. PTI\u0106 GR\u017dELJ\\n\\n---\\n\\n**VOJSKA ZA
  \u010cISTIJI OKOLI\u0160**\\n\\nAmeri\u010dka kopnena vojska (US Army) nastoji smanjiti
  koli\u010dinu ugljikova dioksida \u0161to ga ispu\u0161ta u okoli\u0161, a u skladu
  sa sve o\u0161trijim ekolo\u0161kim propisima. Stoga je u svojim bazama po\u010dela
  s razvojem raznih modela, odnosno isprobavanjem i vrednovanjem koncepta. Nastoje
  se identificirati i u stvarnosti isprobati tehnologije za proizvodnju i u\u0161tedu
  energije, koje \u0107e pridonijeti smanjenju potro\u0161nje fosilnih goriva odnosno
  smanjenju emisije ugljikova dioksida. Istra\u017eivanja su pokazala da znatan dio
  emisije ugljikova dioksida otpada na proizvodnju elektri\u010dne energije u elektranama
  na fosilna goriva. Zato je u vojnoj bazi Fort Carson, savezna dr\u017eava Colorado,
  na napu\u0161tenom dijelu vje\u017ebali\u0161ta sagradena solarna elektrana s fotovoltai\u010dnim
  elementima koji Sun\u010devu svjetlost izravno pretvaraju u elektri\u010dnu energiju
  i time smanjuju uporabu fosilnih goriva. Postavljeni paneli dovoljni su za opskrbu
  540 ku\u0107anstava.\\n\\nM. PETROVI\u0106\\n\\nOve je godine Hrvatska odabrana
  za doma\u0107ina 53. kongresa Europske organizacije za kvalitetu EOQ (European Organization
  for Quality). Hrvatskom dru\u0161tvu za kvalitetu (HDK) pripala je \u010dast biti
  doma\u0107inom i organizatorom kongresa koji je odr\u017ean u svibnju u Cavtatu.\\n\\nKVALITETA
  KAO IZAZOV\\n\\nKvaliteta je pokazatelj uporabne vrijednosti nekog proizvoda ili
  usluge za zadovoljenje to\u010dno odre\u0111ene potrebe na odre\u0111enom mjestu
  i u odre\u0111enom trenutku. Smisao je kvalitete u smanjenju tro\u0161kova ukupnog
  poslovanja, ve\u0107e djelotvornosti i ve\u0107eg zadovoljstva krajnjeg korisnika.
  Kontrola kvalitete jest provo\u0111enje postupaka nadzora nad odre\u0111enom robom
  u svrhu ispunjavanja zahtjeva za kvalitetom. To je skup mjera \u0161to se poduzimaju
  s namjerom osiguranja propisane razine kvalitete materijalnih sredstava koja su
  dostupna na tr\u017ei\u0161tu ili se rabe u nekoj organizaciji.\\n\\nRazvojem tehnike,
  tehnologije i proizvodnje, kontrola kvalitete je pro\u0161irena i na aktivnosti
  koje nisu vezane samo za neposrednu proizvodnju. Stoga razvijena organizacija kontrole
  kvalitete koja nije samo to ve\u0107 je rije\u010d o cijelokupnom sustavu za osiguranje
  kvalitete kojim se svjesno upravlja i razvija kvaliteta proizvoda, usluga i sustava.\\n\\nKongres
  Europske organizacije za kvalitetu EOQ (European Organization for Quality) najzna\u010dajnije
  je sredi\u0161nje godi\u0161nje doga\u0111anje u podru\u010dju kvalitete u Europi
  i svijetu pa tako i u Hrvatskoj, te je odr\u017ean pod visokim pokroviteljstvom
  predsjednika Republike Stjepana Mesi\u0107a. Osobna izaslanica predsjednika Republike
  \u017eupanica Dubrova\u010dko \u2013 neretvanske \u017eupanije Mira Buconi\u0107
  sve\u010dano je otvorila 53. europski kongres za kvalitet, glavni suorganizator
  kongresa bila je Hrvatska gospodarska komora. Skup se odr\u017eao pod nazivom Kvaliteta
  u razdoblju tranzicije (Quality in an Age of Transition), a sudjelovalo je oko 300
  sudionika iz 41 zemlje.\\n\\nKongres EOQ ve\u0107 po tradiciji okuplja \u0161iroki
  krug profesionalaca iz podru\u010dja kvalitete koji dolaze iz proizvoda\u010dkih,
  uslu\u017enih, zdravstvenih, administrativnih i obrazovnih organizacija, prije svega
  iz Europe, ali i iz cijelog svijeta \u0161to je potvr\u0111eno i na ovogodi\u0161njem
  skupu. Glavni predava\u010di na kongresu bili su ugledni stru\u010dnjaci iz podru\u010dja
  kvalitete kao \u0161to su Shoji Shiba, Tito Conti, Glenn Walters, Signe Rats\u00f8,
  Stephen Burnell.\\n\\n(Tekst u cijelosti pro\u010ditajte na: www.hrvatski-vojnik.hr)\\n\\nNakon
  bitke kod Morgartena postalo je jasno da su oklopljeni konjani\u0107i pobedivi.
  Tu su \u0161vicarski pje\u0161aci helebardama jednostavno poskidali s konja austrijske
  vitezove u punom oklopu, a zatim ih prakti\u010dno nepokretne na tlu, vrlo lako
  likvidirali.\\n\\nS druge strane, razvoj konjani\u0161tva me\u0111u isto\u010dnim
  nomadskim narodima i\u0161ao je sasvim druga\u010dijim smjerom. Oni su prete\u017eito
  raspola\u017eali lakim konjani\u0161tvom velike pokretljivosti, koje je bilo sposobno
  brzo prelaziti velika prostoranstva. U borbenim djelovanjima iznenada se pojavljivalo,
  izvodilo brzi napad i nestajalo prije nego \u0161to se protivnik sna\u0161ao i sredio
  svoj borbeni postroj, da bi se ponovo pojavilo iz drugog smjera i ponovilo napad.
  Takvu taktiku omogu\u0107avali su jaki, brzi i minimalno optere\u0107eni konji.
  Osim toga, za razliku od feudalnog konjani\u0161tva koje su \u010dinili isklju\u010divo
  individualni borci, bez izra\u017eenije potrebe za koordinacijom zajedni\u010dkih
  borbenih npora, isto\u010dnja\u010dko nomadsko konjani\u0161tvo potpuno je podre\u0111eno
  svojim zapovjednicima. Po svojoj organizaciji i borbenoj taktici posebno se isti\u010de
  konjani\u0161tvo Madara, Mongola i Sel\u0111uka. Osnovno oru\u017eje ovog konjani\u0161tva
  i dalje je ostao kratki luk, kojim su gadali protivnika u punom trku konja, a u
  bliskoj borbi rabili su kratke, \u0161iroke sablje.\\n\\nMongoli su se na povijesnoj
  sceni pojavili u XII. stolje\u0107u, kao vrlo disciplinirana vojna sila, isklju\u010divo
  konjanici i izvrsni strijelci. Svaki mongolski konjanik vodio je obi\u010dno po
  tri konja u pri\u010duvu, radi zamjene umornog ili ozlijedjenog, ali i radi prehrane.
  Dio konjanika bio je opremljen za blisku borbu, pa su bili naoru\u017eani kopljem,
  sabljom o\u0161trog vrha (podjednako namijenjenu za bodenje i sje\u0107enje) i s
  dva luka (manjim za ga\u0111anje s konja na bliskim rastojanjima i ve\u0107im za
  preciznije ga\u0111anje na ve\u0107e razdaljine nakon sjahivanja). Za\u0161ti\u0107eni
  su bili oklopom od deblje ko\u017ee i kacigama. Drugi konjanici, namijenjeni za
  borbu na ve\u0107oj razdaljini, bili su naoru\u017eani samo lukovima i ponekad sabljom,
  a nisu imali nikakav oklop.\\n\\n(Tekst u cijelosti pro\u010ditajte na: www.hrvatski-vojnik.hr)\\n\\nPreporodom
  pje\u0161a\u0161tva i uvo\u0111enjem novog hladnog oru\u017eja na motki, namijenjenog
  ponajprije za borbu s konjanicima (npr. helebarde, glefe i sl.), oklopljeno konjani\u0161tvo
  po\u010dinje gubiti na va\u017enosti.\\n\\nSmje\u0161tena u sredi\u0161tu Europe,
  Republika Austrija je relativno kasno krenula u formiranje svojih specijalnih postrojbi.
  Rezultat je to burne pro\u0161losti i politi\u010dkog naslije\u0111a proisteklog
  iz posljednjeg svjetskog rata.\\n\\n**SPECIJALNE POSTROJBE REPUBLIKE AUSTRIJE**\\n\\nStije\u0161njenja
  izme\u0111u dva vojna bloka, Austrija je nastojala razvijati posebno prilagodenu
  doktrinu nacionalne obrane i razvoja oru\u017eanih snaga. Potkraj \u0161ezdesetih
  godina pro\u0161log stolje\u0107a Austrija zapo\u010dinje sa stvaranjem prve jezgre
  budu\u0107ih specijalnih postrojbi. Po\u010detkom 1970. godine formirana je prva
  izvidni\u010dka satnija austrijske vojske. Prvi, ali va\u017eni pokazatelj posebnosti
  te postrojbe ogledao se u \u010dinjenici da su njezini pripadnici uz donekle posebnu
  obuku bili noru\u017eani britanskim kratkim strojnica tipa Sterling L-34A1 s prigu\u0161iva\u010dima.
  Bila je to prva organizirana vojna postrojba na \u010dijim \u0107e se iskustvima
  temeljiti daljnji razvoj austrijskih specijalnih snaga.\\n\\nOd po\u010detka 1961.
  godine pa nadalje male grupe austrijskih \u010dasnika poslane su u SAD gdje su pohadali
  specijalne te\u010dajevne na rend\u017eerskoj \u0161koli. Po povratku u domovinu
  ovi \u010dasnici s diplomama ameri\u010dkih specijalnih te\u010dajeva postat \u0107e
  najva\u017eniji element u organiziranju prve specijalne izvidni\u010dke satnije
  nekoliko godina poslije. Prva izvidni\u010dka satnija vrlo brzo \u0107e ispuniti
  svoju misiju i postat \u0107e premali okvir za daljnji razvoj specijalnih snaga
  austrijske vojske. U vojnom i politi\u010dkom vruhu donijeta je odluka da se da
  se formira specijalna postrojba u punom zna\u010denju te rije\u010di. Prema vojnoj
  terminologiji njema\u010dkog jezika ova postrojba je dobila naziv Jagdkommando.
  Rije\u010d je o vojnicima - komandosima osposobljenim za nekonvencionalne na\u010dine
  ratovanja, helikopterski transport, padobranske skokove, izvi\u0111anja, ru\u0161enja
  i sabota\u017ee.\\n\\nSpoznav\u0161i da kvalitetan razvoj specijalnih snaga, posebno
  uvje\u017ebanih prema zahtjevima i specifi\u010dnostima austrijskog teritorija daje
  vi\u0161ekratne koristi, austrijski vojni vrh je nastavio s njihovim daljnjim razvojem.
  Prvo sjedi\u0161te Jagdkommandoa bilo je u Wiener Neustadtu (Be\u010dko Novo Mjesto).\\n\\n(Tekst
  u cijelosti pro\u010ditajte na: www.hrvatski-vojnik.hr)\\n\\nIZUMIRU LI JURI\u0160NICI?
  (III. dio)\\n\\nUspje\u0161an razvoj Jaguara (vidi Hrvatski vojnik br. 244) povukao
  je za sobom razvoj jo\u0161 nekoliko juri\u0161nika, koji su bili vi\u0161e-manje
  njegova kopija. U Japanu su pokrenuli razvoj \u0161kolskog aviona za prelaznu obuku
  Mitsubishi T-2, \u010diji je prvi prototip (XT-2) prvi put poletio 20. srpnja 1971.
  T-2 je bio prvi japanski nadzvu\u010dni avion, po svemu nalik Jaguaru. Zbog toga
  ne \u010dudi da je vrlo brzo pokrenut razvoj juri\u0161nika F-1, \u010diji je prvi
  prototip prvi put poletio 3. lipnja 1975. U operativnu je uporabu uveden u travnju
  1978. Iako se F-1 pokazao pouzdanim juri\u0161nikom, za potrebe japanskog ratnog
  zrakoplovstva u me\u0111uvremenu je razvijena zamjena - vi\u0161enamjenski borbeni
  avion Mitsubishi F-2, koji je, ustvari, ne\u0161to pove\u0107ana kopija ameri\u010dkog
  F-16. Do kraja ove ili najdu\u017ee do sredine sljede\u0107e godine japansko \u0107e
  ratno zrakoplovstvo zamijeniti sve svoje F-1 novim F-2.\\n\\nJH-7A\\n\\nMitsubishi
  F-1 nije bio jedini juri\u0161nik kojem je \\\"otac\\\" bio francusko-britanski
  Jaguar. I kinesko je ratno zrakoplovstvo na istim premisama razvilo svoj juri\u0161nik
  JH-7. Iako su obavje\u0161tajni analiti\u010dari na Zapadu o\u010dekivali da \u0107e
  Kinezi poku\u0161ati kopirati MiG-27, Su-24 ili Tornado, oni su se, svjesni svih
  mogu\u0107ih pote\u0161ko\u0107a, ipak odlu\u010dili za ne\u0161to jednostavniju
  koncepciju dvomotornog visokokrilca sli\u010dniju francusko-britanskom Jaguaru.
  Zapravo je H-7 po ustroju najslu\u017eniji jugoslavensko-rumunjskom Orlu. Je li
  biv\u0161a Jugoslavija pomagala u razvoju H-7, za sada ostaje tajnom. Kinezi su
  svom H-7 projektu namijenili doma\u0107e motore, ali ih je nemogu\u0107nost njihova
  uspje\u0161nog dovr\u0161etka natjerala na kupnju odre\u0111enog broja britanskih
  motora Rolls-Royce Spey. Ukupno je kupljeno 50 Spey Mk.202 motora, \u0161to je Kinezima
  omogu\u0107ilo dovr\u0161etak 24 prototipna i predserijska aviona. Problemi s razvojem
  naveli su Kineze da o H-7 ne daju informacije, tako da se o projektu znalo vrlo
  malo sve do 1995. kad je objavljena prva crno-bijela fotografija s dvije protubrod\u0441\u043a\u0435
  rakete pod krilima. Tada je postalo jasno da \u0107e glavna uloga H-7 biti protubrodsko
  borba. U to vrijeme avion je dobio i novu oznaku - JH-7. JH je oznaka za Jianjiji-Hongzhaji
  ili lovac-bombarder.\\n\\n(Tekst u cijelosti pro\u010ditajte na: www.hrvatski-vojnik.hr)\\n\\nNakon
  iskustava ste\u010denih tijekom uporabe Joint Venturea, Spearheada, Swifta i WestPac
  Expressa, zaklju\u010deno je da se komercijalni brzi brodovi, uz neke potrebne ali
  u osnovi manje preinake, mogu uspje\u0161no rabiti u vojnim operacijama.\\n\\n**BRZA
  DOSTAVA OD OBALE DO OBALE (I. DIO)**\\n\\nSve ve\u0107i broj mirovnih operacija
  i raznih humanitarnih intervencija diljem svijeta tra\u017ei brz prijevoz ljudi
  i tereta na udaljenosti od vi\u0161e tisu\u0107a kilometara. Do nedavno brzi se
  prijevoz mogao obaviti isklju\u010divo transportnim zrakoplovima. No, osim \u0161to
  transportni avioni imaju ograni\u010denu nosivost pa za prijevoz samo jedne brigade
  treba obaviti stotinjak letova, njihova je uporaba skupa. Zbog razvoja tehnologije
  njihovi su letovi sve sigurniji, ali ipak se i dalje doga\u0111aju nesre\u0107e.
  S druge strane, mogu se rabiti brodovi, koji su i jeftiniji i sigurniji. No, za
  udaljenost koju transportni avion, ra\u010dunaju\u0107i vrijeme za ukrcaj i iskrcaj,
  prevali za jedan dan, klasi\u010dnom brodu trebaju dani.\\n\\nOd svih oru\u017eanih
  snaga ameri\u010dke sudaleko najvi\u0161e ovisne o transportu na velike udaljenosti.
  Osim \u0161to jo\u0161 uvijek moraju opskrbljivati snage u Europi i Aziji, velike
  kapacitete odvajaju na prijevoz tisu\u0107a tona materijala u Irak i Afganistan.
  S obzirom na to da je Afganistan jedna od dr\u017eava koja nema pristup moru, dostava
  tereta do njega postala je no\u0107na mora ameri\u010dkih logisti\u010dara. Ali
  to je tema za neki drugi tekst.\\n\\nNo, vratimo se mi problemima brzog i jeftinog
  transporta na velike udaljenosti. Jedan od obe\u0107avaju\u0107ih programa jest
  Joint High Speed Vessel koji zajedno provode ameri\u010dka kopnena vojska i ratna
  mornarica. On bi u kratkom vremenu mogao rije\u0161iti problem prijevoza ljudstva
  i srednje velikih tereta na velike udaljenosti u prihvatljivom vremenu, uz prihvatljivu
  cijenu.\\n\\nKorijeni ovog programa se\u017eu jo\u0161 u svibanj 1999., kad je australsko
  ministarstvo obrane odlu\u010dilo da \u0107e dio svojih snaga u Isto\u010dni Timor
  prebaciti na, barem za oru\u017eane snage, nov revolucionarni na\u010din. Zbog toga
  su od tvrtke Incat (smje\u0161tene na otoku Tasmanijska) iznajmili brzi trajekt
  Incat 045, te ga privremeno preimenovali u HMAS Jervis Bay. Bila je to prva uporaba
  katamarana u vojnotransportnu namjenu.\\n\\n(Tekst u cijelosti pro\u010ditajte na:
  www.hrvatski-vojnik.hr)\\n\\nIgor Ivanovi\u0107 Sikorski svoje je mjesto u povijesti
  razvoja zrakoplovstva osigurao helikopterom R-4 \u2013 prvim helikopterom koji je
  u\u0161ao u operativnu uporabu. Iako je R-4 imao bezbroj nedostataka, ipak je bio
  dovoljno upravljiv da se njime moglo letjeti. S vremenom je Sikorski na osnovama
  R-4 razvio pobolj\u0161ane modele koji su se intenzivno rabili tijekom rata u Koreji.\\n\\nNakon
  \u0161to je napravio prvi uporabljiv helikopter, Sikorski je 1. svibnja 1949. dobio
  zadatok da napravi jo\u0161 jedan revolucionarni iskorak \u2013 razvije prvi transportni
  helikopter na svijetu. Uz to zada\u0107u je morao obaviti za dana\u0161nja mjerila
  nevjerojatno kratkis sedam mjeseci. Helikopter je uz dva \u010dlana posade morao
  prevoziti i deset vojnika. Kao polazna osnova uzet je S-51, koji je prvi put poletio
  16. velja\u010de 1946. No, S-51 je imao samo \u010detiri sjedala i bio je premali
  da se iz njega izvede helikopter s 12 sjedala. S druge strane, S-51 je bio najbolji
  helikopter na svijetu toga vremena i dobra osnova za bilo koji projekt. Dodu\u0161e,
  dio izvora navodi da je tvrtka Sikorsky Aircraft u tom trenutku ve\u0107 razvijala
  civilni helikopter S-55, koji je zapravo i dizajniran za prijevoz dva pilota i deset
  putnika. Ako je to to\u010dno, onda ne \u010dudi da je prvi S-55 poletio ve\u0107
  10. studenoga 1949. Iako je probitno bio namijenjen civilnom tr\u017ei\u0161tu,
  S-55 je ubrzano preimenovan u YH-19, \u0161to zna\u010di da je postao prototip helikoptera
  namijenjen ameri\u010dkom ratnom zrakoplovstvu, te je napravljeno ukupno pet prototipova.
  A to je zna\u010dilo i da je daljnje financiranje razvoja na sebe preuzela dr\u017eava.
  Razlog za\u0161to je ratno zrakoplovstvo odlu\u010dilo S-55 pretvoriti u transportni
  helikopter krio se u \u010dinjenici da je u isto vrijeme financiralo i razvoj transportnog
  helikoptera Piasceki PD-22 (H-21), te je htjelo osigurati rezervnu opciju u slu\u010daju
  njegova neuspjeha.\\n\\n(Tekst u cijelosti pro\u010ditat  na: www.hrvatski-vojnik.hr)\\n\\nTrvenja
  u afghanistanskom vodstvu kulminirala su dr\u017eavnim udarom ministra obrane Hafizullah-a
  Amina kojim je u rujnu 1979. svrgnut predsjednik Taraki. Amin je po\u010deo slati
  pozitivne signale SAD-u i Pakistanu, \u0161to Moskva nije htjela dopustiti te je
  ve\u0107 krajem prosinca intervencijom sovjetskih komandosa svrgnut s vlasti.\\n\\nAFGHANISTAN
  1979.\\n\\nAfganistan je stolje\u0107ima imao veliko strate\u0161ko zna\u010denje
  kao kri\u017eanje putova izme\u0111u Indije, Rusije i Bliskog istoka. Na vlast je
  1933. do\u0161ao \u0161ah Muhamed Zahir, koji je nastojao zadr\u017eati zemlju podalje
  od blokovske podjele svijeta te je istodobno primao i sovjetsku i ameri\u010dku
  gospodarsku pomo\u0107. No kad je 1954. SAD sklopio vojni pakt sa susjednim Pakistonom,
  Afganistan se po\u010deo pribli\u017eavati SSSR-u. Marksisti\u010dka Narodna demokratska
  partija Afganistana (NDPA), koja je osnovana 1965., nakon dvije se godine ideolo\u0161ki
  razdvojila na dvije frakcije. Radikalna frakcija Khalq imala je potporu u seoskim
  sredinama, a prista\u0161e umjerene prosovjetske frakcije Parcham bili su uglavnom
  urbani Afganistanci. \u0160ahova vladavina prekinuta je u srpnju 1973. dr\u017eavnim
  udarom premijera i \u0161ahova ne\u0107aka Muhameda Dauda, u tzv. saurskoj revoluciji
  izvedenoj uz potporu NDPA.\\n\\nNo, na poticaj iz Moskve 27. travnja 1978. skupina
  lijevo orijentiranih vojnih \u010dasnika izvela je vojni udar, u kojemu je Daud
  ubijen zajedno s obitelji. Iza vojnog udara stajale su obje frakcije NDPA, ali radikalna
  frakcija Khalq postupno je osigurala dominaciju u re\u017eimu. Predsjednikom Afganistana
  postao je generalni sekretar NDPA Nur Muhamed Taraki iz frakcije Khalq, a dvojica
  istaknutih komunisti\u010dkih \u010delnika Hafizullah Amin i Babrak Karmal imenovani
  su njegovim zamjenicima. Taraki-jeva vlada po\u010dela je preure\u0111ivati dr\u017eavu
  po marksisti\u010dkim na\u010delima, provoditi zemljinsku reformu, program opismenjivanja
  stanovni\u0161tva te promjenu polo\u017eaja \u017eene, \u010dime je ba\u010dena
  rukavica u lice konzervativnim afghanistanskim krugovima. U svibnju 1978. u Afganistanu
  je raspore\u0111eno prvih \u010detiri stotine sovjetskih vojnih savjetnika, a u
  zemlju je po\u010dela pristizati znatna sovjetska vojna pomo\u0107. U prosincu iste
  godine izme\u0111u Moskve i Kabula potpisan je Sporazum o prijateljstvu i suradnji,
  koji je predvi\u0111ao i razmje\u0161taj sovjetske vojske.\\n\\nNezadovoljstvo plemenskih
  vo\u0111a promjenama i brutalno\u0161\u0107u kojom ih je\\n\\nsredi\u0161nja vlada
  nametala konzervativnom dru\u0161tvu kulminiralo je u prolje\u0107e 1978. u seoskim
  podru\u010djima organiziranjem oru\u017eanog otpora kabulskom re\u017eimu. Oslonac
  pobune postale su islamske skupine ujedinjene pod zajedni\u010dkim nazivom mud\u017eahedini,
  koje su do ljeta 1979. preuzele nadzor nad velikim dijelom unutra\u0161njosti izvan
  gradskih sredi\u0161ta i glavnih komunikacija. Do kraja godine vi\u0161e od \u010detrdeset
  tisu\u0107a ljudi borilo se protiv kabulske vlade. Sjedinjene Dr\u017eave poku\u0161ale
  su iskoristiti ustanak i osiguravanjem pomo\u0107i mud\u017eahedinima ostvariti
  vlastite strate\u0161ke interese u srednjoj Aziji.\\n\\n**Aminov dr\u017eavni udar**\\n\\nRazmje\u0161tanjem
  sovjetskih trupa u zemlji Afganistan je polako tonuo pod Aminov povratak s konferencije
  nesvrstanih na Kubi, Taraki je zatra\u017eio razgovor sa svojim najve\u0107im partijskim
  rivalom Hafizullahom Aminom, koji je pak za odr\u017eavanje razgovora zahtijevao
  jamstvo u vidu nazo\u010dnosti sovjetskog veleposlanika. Po Aminovu dolasku u pala\u010du,
  do\u0161lo je do pucnjave. Amin ju je izbjegao, a poslije se vratio te s vlastitim
  prista\u0161ama i stra\u017earima pala\u010de zarobio Tarakija. U javnosti je cijeli
  doga\u0111aj dr\u017ean u tajnosti i tek nekoliko dana poslije u novinama je objavljeno
  da je predsjednik Taraki umro iz nepoznatih razloga. Ispostavilo se da su ga ubila
  dvojica Aminovih osobnih \u010duvara. Prema nekim izvje\u0161tajima, ubijen je vatrenim
  oru\u017ejem, a prema drugima ugu\u0161en jastukom.\\n\\nHafizullah Amin otprije
  je bio nepopularan me\u0111u Afganancima. Poznat po brutalnosti, nakon preuzimanja
  vlasti po\u010deo je s \u010distkama u partijskim redovima. Tako je stvorio nove
  brojne neprijatelje unutar stranke i me\u0111u ro\u0111acima pogubljenih. Istodobno
  je nastojao ubla\u017eiti posljedice saurske revolucije obnavljaju\u0107i neke \u0111amije
  i daju\u0107i ustupke konservativnim krugovima. No, njegova je najve\u0107a pogre\u0161ka
  bila slanje pozitivnih signala prema SAD-u i njegovu regionalnom savezniku Pakistanu
  putem diplomatskih kanala. Moskva nije trpjela takvu demonstraciju samostalne vanjske
  politike, a jo\u0161 je manje htjela skr\u0161tenih ruku izgubiti nadzor nad jedinom
  savezni\u010dkom zemljom u srednjoj Aziji.\\n\\n**Sovjetska invazija**\\n\\nSve
  ja\u010di ustanak u ruralnim podru\u010djima te \u010distke i nezadovoljstvo u partijskim
  redovima koje je poticala Aminova nesposobnost da nadzire situaciju zabrinjavale
  su Sovjetski Savez. Potkraj prosinca 1979. Politi\u010diro sovjetske Komunisti\u010dke
  partije procijenio je da se tijekom tri mjeseca Aminove vlade situacija u Afganistanu
  pogor\u0161ala do te mjere da je nu\u017ena vojna intervencija. Procjenu su u\u010dvrstili
  izvje\u0161taji KGB-a i vojnih savjetnika iz Kabula, koji su odreda ozna\u010davali
  Amina i neke njegove ministre kao glavni izvor problema u vodstvu te su \u010dak
  navodili i tajne susrete Amina s agentom CIA-e.\\n\\nSovjeti su kontinuirano pove\u0107avali
  broj svojih vojnih savjetnika u Afganistanu a tijekom prosinca u zra\u010dnu bazu
  Bagram dopremljeni su komandosi, dok su vojne postrojbe na sovjetskoj strani granice
  stavljene u pripravnost. Ru\u0161enje Amina i sovjetska invazija Afganistana po\u010deli
  su 27. prosinca, kad je sedam stotina pripadnika specijalne postrojbe Spetsnaz,
  preodijenih u odore afganistske vojske, zauzelo predsjedni\u010dku pala\u010du,
  gdje je pod nerazja\u0161njenim okolnostima ubijen i Amin. Na \u010delo re\u017eima
  doveden je Babrak Karmal, a sljede\u0107ih mjeseci pove\u0107avana je sovjetska
  vojna nazo\u010dnost na stotinjak tisu\u0107a vojnika, koji su do kraja velja\u010de
  1980. bili razmje\u0161teni diljem zemlje. U isto vrijeme intenzivirani su napadi
  mud\u017eahedina na sovjetske trupe i po\u010deo je dugogodi\u0161nji rat, sve do
  kona\u010dnog povla\u010denja SSSR-a iz Afganistana 1989. No zemlju je nakon sovjetskog
  povla\u010denja \u010dekao dugi gra\u0111anski rat, \u010dije se posljedice osje\u0107aju
  do danas.\\n\\nIz djelovanja Srpske demokratske stranke (IV. dio)\\n\\nPredsjednik
  Srpske demokratske stranke (SDS) akademik Jovan Ra\u0161kovi\u0107 poslao je 20.
  velja\u010de 1990. iz \u0160ibenika pismo predsjedniku Hrvatske demokratske zajednice
  (HDZ) dr. sc. Franji Tu\u0111manu, u kojem mu se \u201ciskreno zahvaljuje na ljubaznom
  pozivu na Op\u0107i sabor HDZ-a, koji \u0107e se odr\u017eati, kako sam imao \u010dast
  i zadovoljstvo pro\u010ditati, 24. i 25. velja\u010de 1990. godine u Zagrebu, u
  velikoj koncertnoj dvorani \u2018Vatroslav Lisinski\u2019 s po\u010detkom u 9 sati\u201d.
  Kao razlog nedolaska Ra\u0161kovi\u0107 je naveo \u201cneke moralne razolege\u201d,
  posebno naglasiv\u0161i da \u201cne mo\u017ee izbjegi\u0107i \u010dinjenicu da na
  nekim va\u0161im (HDZ-ovim, op. a.) osniva\u010dkim skup\u0161tinama i u nekim sredinama
  odjekuju buka\u010dki i genocidni pozivi, da se neke va\u0161e (HDZ-ove, op. a.)
  strana\u010dke osniva\u010dke podru\u017enice pretvaraju u histeri\u010dno kazali\u0161te
  srbofobije, da na nekim osniva\u010dkim skup\u0161tinama Va\u0161e respektiraju\u0107e
  stranke (HDZ-a, op. a.) klju\u010da agresivnost koja podsje\u0107a na atmosferu
  minhenskih pivnica\u201d. Dakako, predsjednik SDS-a \u201czaboravio\u201d je spomenuti
  atmosferu na skupovima SDS-a, buka\u010dke i genocidne prijetnje Hrvatima izre\u010dene
  na srpskim mitinzima, agresivnost govornika na skupovima SDS-a itd. O tome svjedo\u010di
  uvid u tisak iz druge polovice 1989. i po\u010detka 1990., a povijesni izvori pokazuju
  da je takva praksa nastavljena.\\n\\nTako je na osniva\u010dkom skupu Mjesnog odbora
  u Smokovi\u0107u kod Zadra, 16. lipnja 1990., Bogoljub Popovi\u0107 iz SDS-a (pukovnik
  RV i PVO u mirovini, iz s. Vrebac kod Gospi\u0107a, sa stanom u Zadru) rekao: Mi
  smo na putu da pove\u017eemo Srbe od Jadranu do Drine, od Subotice do Kosova. Nema
  vi\u0161e dragosavaca (Du\u0161an Dragosavac, du\u017enosnik u biv\u0161oj Jugoslaviji,
  op. a.), ima pravoslavaca. Srpska demokratska stranka je u svom programu istakla
  borbu za jedinstvenu Jugoslaviju, za Federativnu Jugoslaviju, za koje je srpski
  narod u dva zadnja rata dao ogromni prilog u krvi. Zadnji brijunski Ustav je dokraj\u010dio
  Jugoslaviju i doveo je na rub katastrofe zahvaljuju\u0107i pokoncima koji su oti\u0161li
  na onaj svijet posle nego \u0161to su stvorili taj brijunski Ustav koji je razbio
  Srbiju. Na njihovu veliku \u017ealost Srbija se ponovo ujedinila. Srpski narod se
  ujedinjuje i nema sile koja \u0107e zaustaviti ovaj proces preporoda, renesanse
  srpskog naroda. Pobjeda reakcionarnih snaga Hrvatskog naroda na zadnjim izborima
  dovela nas je opet pred jednu novu dilemu, ponovo pozivaju na klanje, mi im odgovaramo
  stihovima Jovana Radulovi\u0107a \u201cne\u0107emo se dati vi\u0161e klati\u201d.
  Svaka varijanta usta\u0161a, usta\u0161ka varijanta vi\u0161e ne dolazi u obzir.
  Mi im poru\u010dujemo da ih se ne bojimo, da paze \u0161ta rade, da ne izazivaju
  ponova katastrofu jer ako bude katastrofe zajedno \u0107emo u nju i\u0107i. Na\u0161o
  se jedan bezumnjak koji se zove Josip Sulejmanac (Sulimanac, op. a.), potpredsjednik
  Hrvatskog Sabora koji je do\u0161ao na genijalnu ideju da se zabetonira najve\u0107e
  strati\u0161te srpskog naroda u Lici, jama Jadovno. Koja sramota jednog funkcionera
  HDZ-a da dira u otvorenu ranu srpskog naroda, a rane nedoklanjan Miroslava Mlinara
  jo\u0161 nisu zarasle. Kako ih nije sramota da u Bleiburgu dr\u017ee misu zada\u0107u
  usta\u0161kim zlo\u010dincima i da izjedna\u010duju Bleiburg i Jadovno. To se nikada
  ne\u0107e izjedna\u010diti, a historija \u0107e re\u0107i zadnju rije\u010d. Mi
  smo jedina stranka u Jugoslaviji koja je u svoj generalni program stavila podr\u0161ku
  JNA-i na odbrani integriteta i suvereniteta Jugoslavije. \u017divela JNA! Mi vjerujemo
  da armija ne\u0107e tako lako dozvoliti dezintegraciju Jugoslavije, mi vjerujemo
  isto tako da snage reda, snage reda i poretka u Jugoslaviji ne\u0107e dozvoliti
  niti odcepjeljenje Kosova niti odcepjeljenje nikoga od Jugoslavije. Neka \u017eivi
  narodna milicija!\\n\\nMe\u0111u ostalim la\u017eima, Popovi\u0107 je naveo i slu\u010daj
  Mlinar: dana 18. svibnja 1990. godine 23-godi\u0161nji Mlinar, predsjednik mjesnog
  ogranka SDS-a, pronaden je ranjen u Benkovcu. Srbi su odmah optu\u017eili Hrivate
  kao \u201cvekovnu\u201d prijetnju, tj. usta\u0161e i kolja\u010de. Slu\u010daj je
  razgla\u0161en u medijima, a potom se ispostavilo da je Mlinar, ina\u010de lo\u0161
  glumac beogradske akademije dramskih umjetnosti, sam sebe ozlijedio. Potom je taj
  isti Mlinar 18. studenoga 1991. sudjelovao u pokolju u \u0160kabrnji. Za sav taj
  strah i hajdu\u010dko-\u010detni\u010dka djela, \u010detni\u010dki vojvoda, ratni
  zlo\u010dinac iz II. svjetskog rata pop Mom\u010dilo \u0110ui\u0107 darovao mu je
  pisa\u010di stroj na \u010dirilici. Svrha svakojakih zastra\u0161ivanja Srba u Hrvatskoj
  od njihovih du\u0161obriznika bila je da ih se psiholo\u0161ki pripremi na agresiju
  protiv Hrvatske i da se ta agresija unaprijed opravda. Koliko je taj inscenirani
  slu\u010daj eksplloatiran u srpskim medijsima u njihovoj beskrupuloznoj ratno-hu\u0161ka\u010dkoj
  kampanji, najbolje pokazuju neki naslovi objavljeni u srpskom tisku: \u201cNapad
  na srce\u201d (Duga, 8. 6. 1990.), \u201cAgresija koja upu\u0107uje na usta\u0161to\u201d
  (Politika, 22. 5. 1990.), \u201cAtak na ceo srpski narod\u201d (Politika, 22. 5.
  1990.), \u201cNepodno\u0161ljiva la\u010do\u010da srpskih ratnika\u201d (Politika,
  22. 5. 1990.), \u201cMoja tragedija je tragedija srpskog naroda\u201d (Politika,
  17. 6. 1990.), \u201cDijalog iz zasede\u201d (Novosti, 21. 5. 1990.), \u201cRu\u017ean,
  bezdu\u0161an, usta\u0161ki \u010din\u201d (Politika, 21. 5. 1990.) itd.\\n\\n*
  U sljede\u0107em broju navest \u0107e se dijelovi govora ostalih govornika na osniva\u010dkom
  skupu Mjesnog odbora SDS-a u Smokovi\u0107u, 16. lipnja 1990.\\n\\nHrabrim sinovima
  Posavine\\n\\nPrva pomisao koja mi je sinula poput munje bila je: Za\u0161to da
  ja, dijete koje je ro\u0111eno tek poslije rata, pi\u0161em i sudim ljudima i dogadajima
  koji su mi potpuno strani?\\n\\nPo prirodi sam iskren i otvoren, pa sam tu misao
  podijelio sa svojom mamom. Nasmije\u0161ila se blago, duboko me pogledala i rekla:
  \\\"Da se zna, da se ne ponovi i da se ne zaboravi.\\\" Osjetio sam se nekako va\u017enim,
  jer sam odjednom postao nositeljem dijela povijesti svoga kraja. Nije da me znam
  ba\u0161 ni\u0161ta. \u010cuo sam puno pri\u010da, kako od svojih roditelja tako
  i od drugih sudionika rata. Mnoge od njih su bolne i tragi\u010dne, ali ima i smije\u0161nih
  jer je ve\u0107ina stanovni\u0161tva ostala i poku\u0161ala \u017eivjeti \\\"normalnim
  \u017eivotom\\\" usprkos kisi granata koje je neprijatelj velikodu\u0161no slao
  na nas.\\n\\nSje\u0107am se jedne kratke pri\u010de vezane za Sre\u010dka, koji
  je bio malo dijete i jako se bojao aviona. Jednom prilikom, prelaze\u0107i Savu
  za vrijeme napada, na\u0161ao se na skeli s grupom vojnika, koji su vjerojatno i
  sami bili zabrinuti. Upla\u0161en i sav drhtav privukao je pozornost jednog branitelja,
  koji mu je pri\u0161ao i rekao: \\\"Strah te, vi\u0111i\u0161, a mene nije jer imam
  tablete koje popijem pa mi bude svejedno.\\\" Izvadio je iz d\u017eepa paklo bijelih
  \\\"tabletica\\\", koje su tada dijeljene vojsci za osvje\u017eenje usta, i tutnuo
  mu u ruku govore\u0107i: \\\"Kad god te bude strah, popij po jednu i bit \u0107e\u0161
  dobro.\\\" Od toga je dana na\u0161a Sre\u010dko postao hrabar jer je imao \\\"sve
  ti je svejedno\\\" tablete, zbog kojih su ga mnogi u \u0161ali, i kad je odrastao,
  znali tra\u017eiti pod izlikom da im nije dobro.\\n\\nNaravno, mnogo je vi\u0161e
  tu\u017enih pri\u010da jer rat, osim \u0161to razara i ubija, ostavlja duboke i
  neizbrisive tragove u srcima onih koji su izgubili najbli\u017ee. To nije te\u0161ko
  zamisliti. Dovoljno je da bilo tko od nas pomisli kako je ba\u0161 ovog trenutka
  ostao potpuno sam pa da mu uskoro niz lice poteku suze.\\n\\nZato mi, koji smo ostali,
  imamo obvezu biti nositelji povijesti pisane krvlju i vjerovati u \u010dudo koje
  nas je spasilo da ostanemo svoji na svome. Jedno je od takvih \u010duda i 106. brigada
  HVO-a, koja je iznikla iz naroda, stajala uz narod i opstala zahvaljuju\u0107i narodu.
  Sretna ti obiljetnica, 106. brigade, od jednog dje\u010daka koji je ro\u0111en tek
  poslije rata, ali zahvaljuju\u0107i tebi danas ima domovinu, budu\u0107nost i ponos
  \u0161to je potomak hrabrih sinova Posavine!\\n\\nDavid BERNATOVI\u0106, Vla\\n\\nSastavak
  u\u010denika Osnovne \u0161kole iz Ora\u0161ja, BiH, napisan povodom obilje\u017eavanja
  17. obljetnice osnivanja 106. brigade HVO-a\\n\\nDUHOVNOST\\n\\nZar nemate vjere?\\n\\nSvaki
  vjernik ima neko iskustvo ku\u0161nje. Zrela je vjera isku\u0161ana vjera. Kao \u0161to
  se zlato u vatri \u010disti, tako se vjera u ku\u0161njama pro\u010di-\u0161\u0107aje.
  Neke su ku\u0161nje ve\u0107e, a neke manje, ali u \u017eivotu na\u0161em svaka
  ostavlja tra\u017ea. Najte\u017ea su, pak, ona isku\u0161enja kad nam se \u010dini
  da nas Bog ne vidi i ne \u010duje, da smo pripu\u0161teni silama zla. Tada nas hvata
  egzistencijalna tjeskoba.\\n\\nKako izdr\u017eati trenutke ku\u0161nje? Kako sa\u010duvati
  pouzdanje u Boga kad nam se u\u010dini da on za nas ne mari? Kako biti siguran da
  \\\"nas nije ostavio Bog\\\"? Evandelje koje \u010ditamo dvanaeste nedjelje kroz
  godinu, 21. lipnja, odgovara na ta tjeskobna pitanja vjere. Sti\u0161avanje oluje
  na moru sa\u017eimlje povijesnu dramu hrvanja sa silama zla. Oluja je, po \u017eidovskom
  slva\u010danju, o\u010ditovanje destruktivne mo\u0107i satone. U toj situaciji Isus
  spava. Kao putuju\u0107i propovjednik, on je prolazio gradovima i selima, uspinjavao
  se na gore i odlazio u pustinju, \u010desto umoran, gladan i \u017eadan. Danju bi
  pje\u0161a\u010dio i propovijedao, a ponekad cijele no\u0107i probudio u molitvi.
  \u0160amo jedan jedini put Evandelje bilje\u017ei da je Isus spavao.\\n\\nBilo je
  to na pu\u010dini mora - dok u\u010denici veslaju, Isus na krmi spa-va. Idili\u010dno,
  reklo bi se, razdoblje vjere. \\\"Najednom nasta \u017eestoka oluja, na ludu navale
  valovi te su je ve\u0107 gotovo napanuli. A on na krmi spava\u0161e na uzglavku.\\\"
  Zaspao je ba\u0161 tada kad je u\u010denicima najvi\u0161e trebao, dok su se oni
  borili za \u017eivot. Mornarsko umije\u0107e ne poma\u017ee. Ljudske su snage na
  izmaku. To je odlu\u010duju\u0107i trenutak u vjerni\u010dkoj borbi s demonskim
  silama. U\u010denici s prijekorom bude Isusa. U njihovu prigovoru sa\u017eeta je
  tjeskoba svih narastaja od Adama do sudnjega dana: \\\"U\u010ditelju! Zar ne mari\u0161
  \u0161to ginemo?\\\" Isus smiren\u043e demonstrira svoju bo\u017eansku mo\u0107.
  Rije\u010dima kojima je izgonio zloduhe \\\"zaprijeti vjetru i re\u010de moru: utihni,
  umunki! I smiri se vjetar i nasta velika utiha\\\". Slijedi Isusova pouka u\u010denicima:
  \\\"\u0160to ste boja\u017eljivi? Kako nemate vjere?\\\" To je Isusov odgovor Crkvi
  i svakom vjerniku na sve ku\u0161nje koje ih mogu zadesiti: nema mjesta panici,
  samo imajte vjeru!\\n\\nCrkva se od po\u010detka uspore\u0111uje s lodom koja plovi
  kroz povijest. Pisac Evandelja zacijelo je toga svjestan. U pozadini opisa sti\u0161avanja
  oluje nazire se teolo\u0161ka slika Crkve. Oslikava se tako\u0111er \u017eivot svakog
  kr\u0161\u0107anina. Nasrtaji demonskih sila kroz \u010ditatu povijest prate zajednicu
  i svakoga vjernika. Udari mogu biti tako sna\u017eni da izazivaju kritzu vjere.
  Kad znanje stru\u010dnjaka postane beskorisno, kad mudrost upravitelja bude iscrpljena,
  Isus nam nudi svoju opu\u0161tenost. Makar spavao, on je s nama. Njega se ne mo\u017ee
  potopiti, njegova stvar ne mo\u017ee propasti. Njegova rije\u010d je zadnja. Zadovoljstvo
  je, govorio je Pascal, nalaziti se na ladi koju bije oluja kad smo sigurni da ne\u0107e
  propasti. U turbulencijama na\u0161ega vremena, Isus i nama ka\u017ee: Samo bez
  panike, molim! Zar nemate vjere?\\n\\nIvan NIMAC\\n\\nDiana Glasnova\\nRatnici milosr\u0111a\\nAlfa,
  Zagreb, 2009.\\n\\nOva knjiga istra\u017euje odnos Bugarske vojske prema hrvatskim
  vojnicima i civilima pri kraju II. svjetskog rata i neposredno nakon njegova zavr\u0161etka,
  a doti\u010de i zbivanja neposredno vezana uz bleibursku tragediju.\\n\\nU vrijeme
  zavr\u0161nih operacija na prostoru biv\u0161ega jugoslavenskoga dr\u017eavnog podru\u010dja
  prisutna je Bugarska vojska, \u010dija su djelovanja usko povezana s novijom hrvatskom
  povijesno\u0161\u0107u. Autorica na temelju istra\u017eivanja arhivskih izvora,
  razli\u010ditih dokumenata i zabilje\u017eenih razgovora sa svjedocima zbivanja
  iz toga vremena, svjedo\u010di kako je, zahvaljuju\u0107i komunisti\u010dkim mitovima
  i komunisti\u010dkoj ideologiji, stoljetno prijateljstvo izme\u0111u dvaju naroda,
  Bugara i Hrvata, izbrisano iz njihova sje\u0107anja. Dok su u Titovoj Jugoslaviji
  Bugari bili ozna\u010deni kao fa\u0161isti, u Bugarskoj su, za ra\u010dun umjetno
  stvorene jugoslavenske nacije, narodi Jugoslavije bili posve obezli\u010deni. Primjerice,
  u Bugarskoj se nije moglo ni\u0161ta \u010duti o Bleiburgu ili Hrvatskom prolje\u0107u.\\n\\nUz
  razotkrivanje povijesnih doga\u0111aja i novih \u010dinjenica, autorica je otkrila
  niz pojedina\u010dnih ljudskih sudbina s njima povezanih, svjedo\u010de\u0107i o
  istinskom prijateljstvu dvaju naroda u te\u0161kim i sudbonosnim danima II. svjetskog
  rata. Knjiga donosi obilje novih podataka o ukupnim hrvatsko-bugarskim odnosima
  u II. svjetskom ratu, posebno tijekom zavr\u0161nih ratnih operacija.\\n\\nAutorica
  je ro\u0111ena 1954. u Sofiji, gdje je zavr\u0161ila novinarstvo. Radila je Bugarskoj
  novinskoj agenciji (BTA), \u010dasopisu Bugarska prehrambena industrija, dnevnom
  listu Demokracija, listu Zname i u drugim bugarskim medijima. Godine 1991. bila
  je savjetnica ministra poljoprivrede Republike Bugarske, a 1992. zamjenica dr\u017eavnog
  tajnika bugarske vlade. Godine 1993. bila je na\u010delnica ureda ministra poljoprivrede
  Bugarske. Od 1996. \u017eivi u Zagrebu i radi kao dopisnica za Bugarsku novinsku
  agenciju te dnevne liste Duma i Monitor, kao i za Televiziju Europa, a sura\u0111uje
  i s drugim bugarskim medijima.\\n\\nMirela MENGES\\n\\nFILMOTEKA\\n\\nGrom (DVD)\\n\u2022
  ameri\u010dki animirani\\n\u2022 trajanje: 96 minuta\\n\u2022 redatelj: Chris Williams
  i Byron Howard\\n\u2022 distributer: Continental film\\n\u2022 glasovi: Rakan Rushaidat
  (Grom), Nika Bo\u0161kovi\u0107 (Penny), Ana Begi\u0107 (\u0160vrila)\\n\\nZa superpsa
  Groma svaki je dan ispunjen pustolovinom, opasnostima i intrigama \u2013 barem dok
  ga snimaju kamere. On je odrastao na filmskom setu te je s vremenom po\u010deo i
  vjerovati da je sve ono \u0161to se odvija u njegovu izmi\u0161ljenom televizijskom
  svijetu istinito i da je on zbilja genetski programiran kako bi imao posebne mo\u0107i,
  uklju\u010duju\u0107i nevjerojatnu snagu, laserski vid i sna\u017ean superlave\u017e.
  Kada ga slu\u010dajno prebacuje iz Hollywooda u New York, za Groma po\u010dinje
  njegova najve\u0107a pustolovina \u2013 putovanje preko cijelog kontinenta. Naoru\u017ean
  samo iluzijama da su sve njegove televizijske supermo\u0107i pristune i u stvarnom
  svijetu i uz pomo\u0107 neobi\u010dnih suputnika, ma\u010dke \u0160vrile i televizijom
  opsjednutog hr\u010dka Mrkog, Grom otkriva da mu ne trebaju supermo\u0107i kako
  bi postao junak...\\n\\nNaravno, rije\u010d je o jo\u0161 jednom vrhunskom ostvarenju
  iz Disneyeve radionice. Ovo je prvi \\\"Disney\\\" nastao potpuno u 3D tehnologijama
  i za taj do\u017eivljaj, ako ga ve\u0107 niste gledali u kinu, ostat \u0107ete uskra\u0107eni.
  No, sve ostalo \u0161to Groma \u010dini dobrim crticem i dalje je tu. To se prije
  svega odnosi na izuzetnu slojevitost glavnih likova. Tu prednja\u010di Grom \u2013
  superheroj na\u0161eg doba. Petogodi\u0161njaci i stariji te svi oni koji vole pustolovine
  ve\u0107e od \u017eivota u\u017eivat \u0107e u ovom klasiku XXI. stolje\u0107a.\\n\\nLeon
  RIZMAUL\\n\\nVREMEPLOV\\n\\n19. lipnja 1867. Strijeljan meksi\u010dki car - Habsburgovac\\n\\nNadvojvoda
  Maksimilian Ferdinand, mladi brat austro-ugarskog i hrvatskog vladara Franje Josipa,
  neslavno je zavr\u0161io \u017eivot pred strej\u010da\u010dkim vodom 19. lipnja
  1867. u dalekom Meksiku. Do odlaska u Meksiko, Maksimilijan je u\u017eivao u blagodatima
  svoga aristokratskog roda \u017eive\u0107i u tr\u0161\u0107anskom dvorcu Miramare.
  Zahvaljuju\u0107i podrijetlu, punih je deset godina s \u010dinom admirala vodio
  austrijsku ratnu momaricu. \u0160ezdesetih godina XIX. stolje\u0107a, u udaljenom
  Meksiku francuski je car Napoleon III. uz pomo\u0107 doma\u0107e reakcionarne hunte
  uspostavio carstvo i ponudio krunu naivnom austrijskom nadvojvodi Maksimilijanu.
  Pod za\u0161titom francuskih baju\u00f1eta, Maksimilijan je uzalud provodio napredne
  reforme, gradio ceste, \u0161kole i zdravstvene institucije. Unato\u010d tome, Meksikanci
  su ga smatrali obi\u010dnim uzurpatorm. Poslije zavr\u0161etka gra\u0111anskog rata,
  Sjedinjene Dr\u017eave odlu\u010dno su zatra\u017eile povla\u010denje Francuza iz
  susjedne zemlje. Napoleon je naposljetku odustao od skupa pustolovne te 1866. Maksimilijana
  ostavio na cijedilu. Hametice pora\u017een u bitki kod Keretara, meksi\u010dki je
  car zarobljen i zajedno s njemu vjernim generalima izveden pred sud. Na procesu
  su se suci podijelili: trojica su tra\u017eila smrtnu kaznu, a trojica progon iz
  zemlje. Presudio je osobno predsjednik Huarez: Maksimilijan je osu\u0111en na smrt
  kao uzurpator i neprijatelj meksi\u010dke slobode, a zatim i strijeljan unato\u010d
  velikim prosvjedima Europe. Njegov tragi\u010dni kraj svojim je kistom zabilje\u017eio
  i slikar Edouard Manet. Manet je poznato da su u meksi\u010dkom ratu sudjelovali
  i mnogi Hrvati u sklopu austrijskih postrojbi koje su pratile zlosretnog cara sve
  do njegova kobnog zavr\u0161etka u Keretaru.\\n\\n20. lipnja 1928. \u2013 atentat
  u beogradskoj Skup\u0161tini\\n22. lipnja 1939. \u2013 poraz Turaka kod Siska\\n22.
  lipnja 1941. \u2013 po\u010dela operacija Barbarossa, nacisti\u010dki napad na SSSR\\n22.
  lipnja 1941. \u2013 prva akcija Sisa\u010dkog partizanskog odreda \u2013 po\u010detak
  antifa\u0161isti\u010dke borbe u Hrvatskoj\\n25. lipnja 1950. \u2013 po\u010deo
  Korejski rat\\n25. lipnja 1991. \u2013 u Saboru izglasana deklaracija o samostalnosti
  Hrvatske\\n\\nLeon RIZMAUL\\n\\nNjema\u010dke haubice 105 mm M 18\\n\\nNavedeni
  modeli haubica bili su u naoru\u017eanju JNA, kamo su dospjeli uglavnom kao ratni
  plijen. Vojni muzej raspola\u017ee sa sva tri modela, a do dolaska u Muzej modeli
  su uglavnom slu\u017eili kao eksponati u vojarnama.\\n\\nNajve\u0107a je razlika
  izme\u0111u modela M18/40 i ostalih modela, jer je on sli\u010dan ostalima samo
  u nekim sklopovima. Sve razlike u modelima nije mogu\u0107e obuhvatiti u ovom prikazu.\\n\\nHaubice
  M18/40 i M18/43F opremljene su ciljni\u010dkim spravama: polunezavisnim daljinarom,
  njema\u010dkom panoronom Rb1.F 32 ili Rb1.F 36 i Rb1.F 16, a mogu\u0107a je bila
  i uporaba sovjetske PG ili PG1, zatim kvadranatom M50 ili njema\u010dkom M35, produ\u017eetkom
  panorame, priborom za osvjetljavanje ciljni\u010dkih sprava PO-1 i piketima.\\n\\nHaubica
  M18/61, uz ciljni\u010dke sprave navedene za prethodne modele, imala je jo\u0161:
  protutenkovski daljinar, protutenkovski durbin i pribor za osvjetljavanje piketa
  PO-25.\\n\\nStreljivo koje se upotrebljava za haubice bilo je njema\u010dkog, ameri\u010dkog
  i jugoslavenskog podrijetla. Za haubice M18/40 i M18/43F upotrebljavalo se streljivo
  njema\u010dkog podrijetla, ali se ono nije smjelo upotrebljavati za haubicu M18/61,
  koja se koristila istim streljivom kao haubice M56 i M2A1.\\n\\nZbirka: Topni\u010dko
  naoru\u017eanje\\nNaziv: Haubica 105 mm M18/40, M18/43F i M18/61\\nMjesto izrade:
  NJEMA\u010cKA\\nVrijeme izrade: 1918.\\nosnovni model s kasnijim preinakama\\n\\nLiteratura:
  1. THE ENCYCLOPEDIA OF WEAPONS OF WORLD WAR II, London, 1998.\\n2. HAUBICA 105 mm,
  M18/61, M18/40, M18/43F Knjiga I. (opis, rukovanje i odr\u017eavanje), DSNO, Beograd,
  1969.\\n\\nHRVATSKI NATO VOJNIK\\n\\nVrhunski opremljen, odli\u010dno obu\u010den
  hrvatski vojnik spreman je za sve izazove modernog doba. U procesu opremanja koriste
  se isklju\u010diva proizvodi vrhunske kvalitete s izrazitom dominacijom hrvatskih
  proizvo\u0111a\u010da.\\n\\nOdora s digitalnim uzorkom Hrvatske u pustinjskoj boji.
  Izvrsna maskirna prikrivnost, moderni materijali, tretirano za nevidljivost u infracrvenom
  okru\u017eenju.\\n\\n\\\"OSRH - vodeni \u017eig na digitalnoj \u0161ari za za\u0161titu
  hrvatske odore\\\".\\n\\nDonje rublje: Galeb, za tople uvjete: Underarmour, osigurava
  transporta vlage od povr\u0161ine ko\u017ee i kompresijom i za\u0161titom od UV
  zra\u010denja. Donje rublje za hladne uvjete Outlast regulacija topline ovisno o
  temperaturi okoli\u0161a, hladni odnosno grijie tijelo korisnika.\\n\\n\u010cizme
  vojni\u010dke: Inkop, Sloga, Borovo, Jelen, Geox, Hrvatska Carape Jadran, Hrvatska\\n\\nOstala
  oprema: Podkapa negoriva: Karabiner Petzl; \u0160ator za jednu osobu Krok\u00f3,
  Hrvatska; signalno ogledalo, GPS Uredaj: Uredaj za no\u0107no izvi\u0111anje i u
  razvoju \\\"Future Soldier Program Hrvatska\\\"\\n\\nNao\u010dale s balisti\u010dkom
  za\u0161titom ESS\\n\\nNaprinja\u010da Krok\u00f3 M115 sa spremnikom za vodu 3lit
  Camelbak\\n\\nMarama pustinjska shemag\\n\\nKaciga s balisti\u010dkom za\u0161titom
  \u0160estan Busch, Hrvatska\\n\\nRadio veza s Laringofonom \u201eU\u201c\\n\\nPrsluk
  za\u0161titni borbeni s balisti\u010dkim plo\u010dama Krok\u00f3 M120\\n\\nThermotex
  i Outlast unutarnje strane bolja prozra\u010dnost i regulacija topline Protukulizne
  gume za kundak D\u017eepovi za spremnike streljiva, masku, ru\u010dne bombe, baca\u010d
  granata i opremu mogu se modularno prilagoditi za svaku zada\u0107u. Balisti\u010dka
  za\u0161tita tijela, sa svih strana\\n\\nSet za prvu pomo\u0107\\n\\nZa\u0161titna
  maska za lice\\n\\nOpasa\u010d s produ\u017eetkom futrole na nogu i futrolom za
  samokres Krok\u00f3 M116\\n\\nSamokres HS 2000, HS Produkt, Hrvatska HS Produkt\\n\\nRukavice
  takti\u010dke ljetne i negorive Krok\u00f3 RES29\\n\\nJuri\u0161na pu\u0161ka VHS
  Juri\u0161na pu\u0161ka HS Produkt, Hrvatska HS Produkt\\n\\nZeleni lasar s lampom
  za naoru\u017eanje Beamshot\\n\\nStitnici za koljena Krok\u00f3\\n\\nNo\u017e borbeni
  Extrema Ratio\\n\\nSet za pre\u017eivljavanje Krok\u00f3: Ru\u010dni alat Leatherman;
  Lampu baterijska SureFire; Limenka sa sitnom opremom za pre\u017eivljavanje BCB;
  Uredaj protiv komaraca TK1 Hrvatska; Spremnik za vodu 1,5lit Camelbak; Kemij\u0441\u043a\u0435
  svijetiljke-\u0161tapici; Prva pomo\u0107 mali komplet Lola Ribar\\n\\nNadjakna,
  podjakna i hla\u010de u maskirnoj \u0161ari od tro\u0161lojnog laminata s parapropusnom
  i vododobojnom membranom\\n\\nLider u razvoju, proizvodnji i distribuciji vojno
  policijske opreme:\\n\\nKROKO INTERNATIONAL d.o.o.\\n\\nPosl. Centar Vukovarska
  269D, Zagreb, Hrvatska, Tel: 01/ 3772 777, www.kroko.hr\"", "\"Tamara Nikoli\u0107
  \u0110eri\u0107\\n\\nEtnografski muzej Istre Pazin Hrvatska email@example.com\\n\\nUDK
  069.27:39 Pregledni rad Primljeno: 21. o\u017eujka 2011. Prihva\u0107eno: 29. o\u017eujka
  2011.\\n\\nVa\u017enost sekundarne dokumentacije u Etnografskim muzejima\\n\\nPitanje
  informati\u010dke pismenosti i ljudskog faktora te uspostave normi i standarda pri
  obradi sekundarne dokumentacije\\n\\nU radu se propituje nekoliko temeljnih problema
  vezanih uz informacijski sustav namijenjen obradi sekundarne dokumentacije nagla\u0161avaju\u0107i
  pritom va\u017enost ljudskog faktora i upravljanja znanjem prilikom stvaranja baze
  podataka. Okret etnografskih muzeja prema nematerijalnoj kulturi i raznorodnost
  materijalnih predmeta u sprezi s nedovoljnom informacijskom pismeno\u0161\u0107u
  i sustavom sekundarne dokumentacije koji je jo\u0161 uvijek u razvojnoj fazi, prijete
  neadekvatnoj obradi gra\u0111e koja je iz nekoliko razloga klju\u010dna u ostvarivanju
  suvremenih uloga etnografskih muzeja. Osim konceptualnih problema, rad donosi i
  osvrt na probleme tehni\u010dke prirode vezane uz informacijske sustave za obradu
  sekundarne dokumentacije.\\n\\nKlju\u010dne rije\u010di: muzejska dokumentacija,
  sekundarna dokumentacija, etnografski muzeji\\n\\n\u0160to podrazumijevamo pod sekundarnom
  dokumentacijom?\\n\\nPrema Pravilniku o sadr\u017eaju i na\u010dinu vo\u0111enja
  muzejske dokumentacije o muzejskoj gra\u0111i (Narodne novine, 108/02) \\\"muzejska
  dokumentacija je sustavno izra\u0111en, prikupljen, organiziran i pohranjen skup
  podataka, koji je nastao u tijeku procesa stru\u010dne obrade, za\u0161tite i prezentacije
  muzejske gra\u0111e, te se temelji na dogovorenom i utvr\u0111enom broju i kvaliteti
  podataka o predmetu, grupi predmeta ili cjelokupnom fondu.\\\" Pritom, sekundarna
  muzejska dokumentacija obuhva\u0107a popratne i dopunske fondove muzejske djelatnosti
  koji mogu biti organizirani prema medijima prikazivanja i prema sadr\u017eaju, za
  razliku od primarne dokumentacije, prema Pravilniku ujedno i \\\"temeljne\\\", koja
  \\\"obuhva\u0107a prvu i najve\u0107u skupinu podataka o muzejskoj gra\u0111i.\\\"
  Vrsta dokumentacije pod nazivom sekundarna dokumentacija mo\u017ee naoko implicirati
  ni\u017eu razinu va\u017enosti u odnosu na primarnu, ali dokumentaristi i brojni
  kustosi koji se, u nedostatku dokumentarista, bave i sekundarnom dokumentacijom,
  dobro znaju da tome nije tako. Nadalje, Ivo\\n\\nMaroevi\u0107 pod primarnom dokumentacijom
  razumijeva informacije koje nastaju u neposrednom dodiru s predmetom, dok sekundarna
  dokumentacija obuhva\u0107a prijenos primarne dokumentacije u druge medije (Maroevi\u0107,
  1993: 191-192). Razvojem suvremene tehnologije, ali i novih muzejskih trendova sve
  smo svjesniji kako se bri\u0161u granice izme\u0111u tako koncipiranih podjela dokumentacije.
  Toga je bio svjestan i profesor Maroevi\u0107 s obzirom na to da jo\u0161 godine
  1993. donosi podjelu dokumentacije gdje u prvom planu isti\u010de njezin sadr\u017eaj
  (Maroevi\u0107, 1993: 191 u Zlodi, 2003: 18). Zbynek Z. Stranski pod sekundarnom
  dokumentacijom navodi ne samo popratnu dokumentaciju o muzejskim predmetima, ve\u0107
  i dokumentaciju muzejske djelatnosti (Stranski, 1970: 45 u Maroevi\u0107, 1993:
  16). Po tom je na\u010delu koncipiran i Pravilnik. Bez ikakve intencije da se sekundarna
  dokumentacija izjedna\u010di s primarnom i u potpunosti podr\u017eavaju\u0107i nu\u017enost
  razlikovanja dviju spomenutih skupina dokumentacije pa u tom kontekstu i pridodanih
  naziva, autorica ima za cilj naglasiti va\u017enost sekundarne dokumentacije u ostvarivanju
  suvremenih muzejskih uloga i upravljanju mno\u0161tvom tekstualnih i audiovizualnih
  informacija. Nu\u017enost dokumentarista i pra\u0107enje razvoja suvremene tehnologije
  te neprestano u\u010denje name\u0107e se kao klju\u010d uspje\u0161nog vo\u0111enja
  i shva\u0107anja va\u017enosti sekundarne dokumentacije u etnografskim muzejima.\\n\\nDanas
  je posebna pa\u017enja usmjerena upravo na razli\u010dite muzejske djelatnosti.
  Klasi\u010dne uloge muzeja, kao \u0161to je sakupljanje, za\u0161tita, istra\u017eivanje
  i osnovna interpretacija muzejskih predmeta smatraju se bazi\u010dnim, ali i nedovoljnim
  za uspje\u0161no poslovanje muzeja. Kako Pruulmann-Vangerfeldt i Aljas u svome radu
  o izazovima koje donosi digitalizacija kulturne ba\u0161tine napominju, zajednica
  o\u010dekuje od muzeja da \\\"opravdaju svoje postojanje\\\". To mogu ostvariti
  otvaranjem prema publici, odnosno uklju\u010divanjem zajednice u rad muzeja kako
  bi postali aktivni partneri u u\u010denju i interpretiranju kulturne ba\u0161tine.
  Kao jedan od mogu\u0107ih na\u010dina uspostave kvalitetnijeg odnosa, autorice vide
  upravo u digitaliziranoj ba\u0161tini i njenom online pristupu (Pruulmann-Vangerfeldt
  i Aljas, 2009: 110). Ovdje valja pridodati da svoju dru\u0161tvenu odgovornost muzeji
  ostvaruju i kroz izlo\u017ebe, publikacije, pedago\u0161ke aktivnosti i druge manifestacije
  koje se dokumentiraju, a kasnije i upravljaju upravo informati\u010dkim sustavom
  za obradu sekundarne dokumentacije. Specifi\u010dnost i bogatstvo sekundarne dokumentacije
  kako ju danas percipiramo u na\u0161oj muzejskoj zajednici le\u017ei upravo u velikoj
  zastupljenosti raznovrsnih medija koje je potrebno adekvatno pohraniti i dokumentirati
  u svrhu lak\u0161eg upravljanja galopiraju\u0107im rastom informacija. Pritom je
  od iznimne va\u017enosti to\u010dno odrediti veli\u010dinu slikovne datoteke podr\u017eanu
  od strane informacijkog sustava koji koristimo, uspostaviti tezaurus za etnografske
  zbirke ponajprije prilago\u0111en na\u0161oj akademskoj zajednici, a u kona\u010dnici
  mo\u017eda i u internacionalnom okru\u017eenju. Tako\u0111er je potrebno definirati
  koli\u010dinu i vrstu informacija potrebnih da bi zadovoljile korisnika (u perspektivi
  mogu\u0107nost online pristupa fondovima sekundarne dokumentacije) pogotovo ako
  uzmemo u obzir potrebu za interpretiranim sadr\u017eajem koji u svome radu nagla\u0161avaju
  Samis i Roberto 1\\n\\n1 Roberto, Frankie 2008. Exploring Museum Collections On-line:
  The Quantitative method. - Jennifer Trant, David Bearman (eds.). Museums and the
  Web 2008.: Proceedings. Toronto. Archives and Museum Informatics. http://www.archimuse.com.
  Samis, Peter 2008. Who has the responsibility for saying what we see? Mashing up
  Museum, Artist, and Visitor Voices, On-site and On-line . - Jennifer Trant, David
  Bearman (eds.). Museums and the Web 2008.: Proceedings. Toronto. Archives and Museum
  Informatics. http:// www.archimuse.com\\n\\n(Pruulmann-Vangerfeldt i Aljas, 2009:
  110). Ukratko, potrebno je uspostaviti norme i standarde ne samo na razini obrade
  muzejske gra\u0111e nego specifi\u010dnije, na razini obrade etnografske gra\u0111e
  i djelatnosti etnografskih muzeja. Iako programi za obradu sekundarne dokumentacije
  prate sve smjernice navedene u Pravilniku te one CIDOC-ove, 2 praksa je pokazala
  kako je potrebno uvesti nove mjere da bi sustav sekundarne dokumentacije za etnografske
  zbirke bio jo\u0161 efikasniji. Potreba za standardima na polju dokumentacije etnografskih
  zbirki nije toliko nu\u017ena zbog same prirode muzejskih predmeta i one primarne
  dokumentacije koja je uglavnom usvojena iako i dalje podlo\u017ena promjenama, ve\u0107
  onih popratnih djelatnosti kao \u0161to su terenska istra\u017eivanja i fondovi
  audiovizualne gra\u0111e koji se sve \u010de\u0161\u0107e koriste prilikom dokumentiranja,
  za\u0161tite, prezentacije i interpretacije nematerijalne ba\u0161tine. Autorice
  poseban naglasak stavljaju upravo na spomenute fondove, smatraju\u0107i ih klju\u010dnim
  u holisti\u010dkom pristupu etnografskim zbirkama materijalne i nematerijalne prirode
  te etnografskim istra\u017eivanjima koja predmetima i fenomenima daju kontekst.
  Razvojem tehnologije audiovizualni fondovi gotovo da prevladavaju u svakoj domeni
  obzirom da se dokumenti s tradicionalnih nosa\u010da kao \u0161to su fotografije,
  papir, dijapozitivi, magnetne vrpce itd. \\\"prebacuju\\\" u digitalni oblik ili
  u njemu nastaju. Prema Zlodiju, \\\"Proliferacijom vizualne gra\u0111e u digitalnom
  obliku (bilo one nastale digitalizacijom ili one koja je izvorno u digitalnom obliku)
  pove\u0107ava se va\u017enost te, nekada s pravom nazivane nekonvencionalnom, a
  sada sve uobi\u010dajene gra\u0111e koja, uz velike mogu\u0107nosti obrade i distribucije,
  zahtijeva i nove oblike upravljanja i za\u0161tite.\\\" (2003: 11). Zlodi zaklju\u010duje
  kako je klju\u010dna uloga dokumentacije upravo za\u0161tita zna\u010denja muzejskog
  predmeta (ibid.) Spomenimo stoga podjelu Petera van Menscha koji uvodi termine idealisti\u010dka
  i materijalisti\u010dka za\u0161tita: \\\"Materijalisti\u010dka je za\u0161tita
  ona koja se o\u010dituje u za\u0161titi materijala predmeta ba\u0161tine i njegovih
  svojstava, a idealisti\u010dka se manifestira u \u010duvanju ideja pohranjenih u
  materijalnom svijetu putem drugih medija.\\\" (Van Mensch, 1985: 2-4 u Zlodi, 2003:14).
  Su\u0161tina nematerijalne ba\u0161tine o\u010dituje se upravo u ideji koja bi se
  putem audiovizualnih medija mogla \\\"materijalizirati\\\" te pohraniti, dokumentirati
  i interpretirati od strane muzejskih stru\u010dnjaka posredstvom informacijskog
  sustava za obradu i upravljanje sekundarnom dokumentacijom. Iako se u Uvodu u muzeologiju
  Ive Maroevi\u0107a nematerijalna kultura ne spominje izrijekom, u odlomku o dokumentaciji
  navodi se kako dokumentacija nije samo vezana uz za\u0161titu zna\u010denja muzejskog
  predmeta nego se ona o\u010dituje i kroz dokumentaciju oblika (posredstvom maketa
  i drugih medija, danas uglavnom digitalnih). 3 U tom slu\u010daju kopija mo\u017ee
  u iznimnim okolnostima preuzeti na sebe dio izvornog zna\u010denja (Maroevi\u0107,
  1993: 178). Kona\u010dno, Maroevi\u0107 zaklju\u010duje kako \\\"uloga dokumenacije
  u za\u0161titi predmeta u muzejima postaje sve va\u017enijom i to potrebnijom \u0161to
  se vi\u0161e udaljavamo od materijalne strukture predmeta\\\" (ibid.). Iako se autor
  poziva na ono \u0161to danas nazivamo primarnom dokumentacijom, teza je zna\u010dajna
  u kontekstu veze sekundarne dokumentacije i nematerijalne kulture.\\n\\nProgram
  koji koristi velik broj hrvatskih muzeja prilikom obrade sekundarne dokumnetacije
  nazvan je S++. S++ je \\\"relacijska baza podataka namijenjena vo\u0111enju sekundarne
  muzejske dokumentacije. Modul S++ nastao je kao nadopuna modula za\\n\\n2 Komitet
  za dokumentaciju Me\u0111unarodnoga komiteta za muzeje (ICOM).\\n\\n3 Nap. a.\\n\\nvo\u0111enje
  primarne dokumentacije M++. Iako se radi o dvije fizi\u010dki odvojene baze koje
  su me\u0111usobno nezavisne, u S++ je ugra\u0111ena opcija poveznica sa M++. Dakle,
  svaki od ta dva modula se mo\u017ee voditi sam za sebe, no muzeji koji imaju oba
  mogu povezati svoju primarnu i sekundarnu muzejsku dokumentaciju. Na taj na\u010din
  se pobolj\u0161ava konzistentnost i kvaliteta muzejske dokumentacije u cijelosti.
  S++ je napravljen u istoj tehnologiji kao i M++, dakle radi se o MS Access-u 97
  koji je predvi\u0111en za rad u lokalnoj mre\u017ei.\\\" (Link2, 2007: 3).\\n\\nPrema
  Pravilniku o sadr\u017eaju i na\u010dinu vo\u0111enja muzejske dokumentacije o muzejskoj
  gra\u0111i, sekundarnu muzejsku dokumentaciju \u010dine: inventarne knjige audio-vizualnih
  fondova, inventarna knjiga hemeroteke, knjiga evidencije o izlo\u017ebama, evidencija
  o konzervatorsko-restauratorskim postupcima, evidencija o pedago\u0161koj djelatnosti,
  o stru\u010dnom i znanstvenom radu, o izdava\u010dkoj djelatnosti, zatim dokumentacija
  o marketingu i odnosima s javno\u0161\u0107u te dokumentacija o osnivanju i povijesti
  muzeja. No, \\\"U fondove sekundarne dokumentacije u programu S++ uklju\u010deni
  su jo\u0161 i fondovi Knjiga negativa, Posebna doga\u0111anja, Medijateka i Dokumenti
  koji se ne spominju u pravilniku, ali se kroz praksu pokazala potreba u nekim muzejima
  za njihovo vo\u0111enje.\\\" (Link2, 2007: 5). Posljednjih je godina Program nadopunjen
  sljede\u0107im fondovima: Evidencija terenskih izvje\u0161taja, Katalozi, Arhiva,
  Obavijesti.\\n\\nSpecifi\u010dnosti i zna\u010denje sekundarne dokumentacije u etnografskim
  muzejima\\n\\nEtnografski muzej Istre u svome radu koristi program S++ za informacijsko
  upravljanje sekundarnom dokumentacijom. Zbog nedostatka dokumetarista, kustosi su
  me\u0111usobnim dogovorom podijelili vo\u0111enje sekundarne dokumentacije prema
  svojim afinitetima i mogu\u0107nostima. Tako se autorica ovoga rada, s obzirom na
  to da je izme\u0111u ostalog i kustosica Zbirke fotografija te voditeljica filmskog
  festivala u organizaciji Muzeja, bavi audiovizualnim fondovima kao \u0161to su Knjiga
  pozitiva, negativa, Filmoteka i Videoteka. Kolega u \u010dijem su fokusu istra\u017eivanja
  vezana uz usmene predaje vodi Fonoteku i evidenciju terenskih istra\u017eivanja
  dok je, na primjer, muzejska pedagoginja zadu\u017eena za evidenciju o izlo\u017ebama,
  marketingu i PR-u te pedago\u0161kim aktivnostima.\\n\\nKako je otprilike prije
  godinu dana za\u017eivjela ideja o radnoj grupi za sekundarnu dokumentaciju pri
  MDC-u u suradnji s tvrtkom Link2, pozvana sam na radni sastanak gdje smo zapo\u010deli
  razgovore o op\u0107enitim problemima na koje dokumentaristi ili kustosi nailaze
  u svome radu. Pokazalo se kako kustosi umjetni\u010dkih zbirki imaju druga\u010dije
  potrebe od kustosa koji vode etnolo\u0161ke ili povijesne zbirke i obrnuto, \u0161to
  je samo po sebi ve\u0107 du\u017ee vrijeme o\u010digledno. Od tada se djelatnici
  Etnografskog muzeja Istre intenzivnije bave sekundarnom dokumentacijom upravo iz
  potrebe da se uo\u010de prepreke na razini na\u0161ega muzeja te izna\u0111e na\u010din
  na koji \u0107emo pobolj\u0161ati informacijski sustav za obradu i upravljanje sekundarnom
  dokumentacijom, ne toliko s tehni\u010dke koliko s konceptualne strane. Naime, iako
  je cijela muzejska zajednica svjesna koliko\\n\\nje nu\u017ena intenzivnija suradnja
  pojedinaca u struci ali i \u010ditavih institucija, dobro je u me\u0111uvremenu
  zapo\u010deti s istra\u017eivanjima, razgovorima i potencijalnim rje\u0161enjima
  unutar Muzeja da bi se kasnije eventualno uskladili s ostalim muzejima i/ili drugim
  institucijama u kulturi.\\n\\nTako sam za primjer rada u programu S++ uzela vrlo
  kompleksnu izlo\u017ebu Vali\u017ee i de\u0161tini autorice Lidije Niko\u010devi\u0107
  kako bih uo\u010dila njegove eventualne nedostatke. Najprije sam u knjigu za evidenciju
  izlo\u017ebi uvela osnovne podatke od autorstva do broja posjetitelja i po\u010dela
  ih povezivati s drugim fondovima, a kasnije i predmetima koji su kori\u0161teni
  na izlo\u017ebi. U tom sam stadiju uvidjela kako je i u tako strogo definiranoj
  grani znanosti kao \u0161to je (muzejska) dokumentacija nu\u017eno uklju\u010diti
  intuiciju ili prema Gladwellu (2005) \\\"mo\u0107 mi\u0161ljenja bez mi\u0161ljenja\\\".
  Naime, kustosi/dokumentaristi zadu\u017eeni su za stvaranje odre\u0111enih znanja
  prema razli\u010ditim klasifikacijskim sustavima. Na taj na\u010din \u010desto petrificiramo
  znanje. Kako \u010desto oskudijevamo u smjernicama i moramo sami prona\u0107i najbolje
  rje\u0161enje problema, dolazimo do pojmova intuicije i/ ili emocionalne inteligencije.
  Suo\u010deni s novim pitanjima preispitujemo ve\u0107 postoje\u0107e sustave, uvi\u0111amo
  ograni\u010denja klasifikacijskih sustava, te poku\u0161avamo ponuditi alternativne
  poglede na problem. No, vratimo se izlo\u017ebi. Tko god je imao priliku posjetiti
  izlo\u017ebu, slo\u017eit \u0107e se da je vrlo kompleksna i kako njenu sr\u017e
  \u010dine upravo terenska istra\u017eivanja. Na tim je istra\u017eivanjima prikupljena
  ogromna koli\u010dina informacija, od razgovora (Fonoteka) s likovima prikazanima
  na izlo\u017ebi, fotografija (Fototeka) koje datiraju daleko u po\u010detke 20.
  stolje\u0107a pa \u010dak i video-snimke (Videoteka) koje su sami iseljenici snimili
  za potrebe izlo\u017ebe. To je ono \u0161to smatram \\\"materijalizacijom\\\" nematerijalne
  kulture o kojoj je ranije bilo rije\u010di. Nakon terenskih istra\u017eivanja bilo
  je potrebno inventarizirati svu sakupljenu gra\u0111u, skenirati stare fotografije
  kojih se vlasnici vrlo \u010desto nisu htjeli odre\u0107i, pohraniti skenove, digitalne
  fotografije, video-snimke i filmove iseljeni\u010dke tematike. Tek je manji dio
  izlo\u017ebe uklju\u010dio \\\"klasi\u010dne\\\" muzejske predmete. Ukratko, sve
  \u0161to smo donijeli s terena \u2013 pri\u010de pohranjene na diktafonu, digitalne
  fotografije ili skenove, predstavljalo je osnovnu gra\u0111u izlo\u017ebe, no sva
  je ta gra\u0111a u muzeolo\u0161koj praksi zapravo predstavljala sekundarnu dokumentaciju.
  Gra\u0111a je pohranjena i inventarizirana u programu S++. Iskustvo pritom ste\u010deno
  rezultiralo je ovim radom u kojem se nagla\u0161ava va\u017enost i primjerenost
  sekundarne dokumenatcije za obradu jednog dijela etnografskih zbirki. Ono \u0161to
  mo\u017ee zbuniti neupu\u0107ene jest naziv sekundarna dokumentacija koji je u ovom
  slu\u010daju manje bitan. Informati\u010dki sustav M++ slu\u017ei (tako je barem
  pokazala dosada\u0161nja praksa) za inventarizaciju i upravljanje \\\"klasi\u010dnom
  muzejskom gra\u0111om\\\", dok S++ poma\u017ee u sistematiziranju enormne koli\u010dine
  informacija koje brojni etnografski muzeji, koji vode klasi\u010dna terenska istra\u017eivanja,
  moraju pohraniti i obraditi.\\n\\nOsim evidencije izlo\u017ebi, pedago\u0161kih
  i drugih aktivnosti, sekundarnu dokumentaciju mo\u017eemo promatrati i u perspektivi
  obrade, odnosno dokumentiranja nematerijalne kulture koja polako ulazi u sve pore
  etnolo\u0161kog rada pa time i u muzejske prakse. Ona se mo\u017ee inventarizirati
  i interpretirati u programu S++, nakon \u010dega postoji mogu\u0107nost njene daljnje
  distribucije i vi\u0161estruke uporabe. Spomenut \u0107u primjer filmske radionice
  ETNOFILm festivala koji Etnografski muzej Istre organizira ve\u0107 tri godine\\n\\nza
  redom. Svake godine na radionici nastaju zna\u010dajni doprinosi budu\u0107i da
  polaznici imaju zada\u0107u snimiti film etnografske tematike. Godine 2011. polaznici
  su se posvetili rovinjskoj ba\u0161tini pa su tako nastali kratki filmovi o ribaru,
  slikaru, pripadniku albanske nacionalne manjine i sli\u010dno. Va\u017eno je naglasiti
  da su snimanju i montiranju filma prethodila predavanja vizualnog antropologa sa
  Sveu\u010dili\u0161ta u Aarhusu (Danska) koji je pratio svaki korak polaznika te
  ih savjetovao i podu\u010davao tehnikama etnografskog istra\u017eivanja i interpretacije
  vizualnim medijem. Snimke, odnosno filmovi, ulaze u sustav sekundarne dokumentacije
  u fond Videoteka. Mnogi \u0107e se pitati za\u0161to filmovi nisu smje\u0161teni
  u fond Filmoteka, no nakon dugog vije\u0107anja zaklju\u010dili smo kako je zaista
  tanka granica koja dijeli Videoteku od Filmoteke pa bi se, npr., dokumentarni film
  na VHS-u mogao evidentirati u oba fonda. Stoga sam predlo\u017eila da fond Videoteka
  koristimo za sve video-radove (u smislu vizualne percepcije) neovisno o mediju,
  a fond Fonoteka kao mjesto sabiranja auditivno percipiraju\u0107e gra\u0111e, tako\u0111er
  neovisno o mediju na kojem se nalazi. Iako je na\u0161 dosada\u0161nji doprinos
  dokumentiranju nematerijalne kulture, pa i samom razmi\u0161ljanju na temu, malen,
  Etnografski muzej Istre iz godine u godinu te\u017ei sveobuhvatnijem pristupu istra\u017eivanim
  podru\u010djima. CIDOC prednja\u010di u prepoznavanju va\u017enosti dokumentacije
  nematerijalne kulture i izazova koje takva dokumentacija stavlja pred nas. Tako
  je jo\u0161 2002. godine organizirao konferenciju pod nazivom O\u010duvanje kultura
  \u2013 dokumentacija nematerijalne ba\u0161tine. 4\\n\\nSve spomenuto predstavlja
  temelj suvremenih etnolo\u0161kih praksi, a upravo je S++ namijenjen sistematizaciji,
  obradi i daljnjem upravljanju spomenutom gra\u0111om. Kona\u010dno, primjenom programa
  S++ ili eventualno njegove ina\u010dice \\\"dobivamo pregledno i sustavno obra\u0111ene
  fondove koji pru\u017eaju to\u010dnu informaciju o svakom vidu djelatnosti muzeja
  te je na taj na\u010din pobolj\u0161ana kvaliteta djelovanja muzeja.\\\" (Zenzerovi\u0107,
  2009: 205). Isto tako, valja napomenuti da se muzejska gra\u0111a i muzejska dokumentacija
  \u0161tite kao kulturno dobro te se u skladu s time primjenjuju propisi o za\u0161titi
  kulturnih dobara (Zakon o muzejima, Narodne novine 142/1998). Zaklju\u010dimo kako
  je svaka dokumentacija kulturno dobro nastalo na\u0161im radom te je stoga nu\u017eno
  propitivati, uskla\u0111ivati i neprestano te\u017eiti novim saznanjima koja bi
  u kona\u010dnici dovela do efikasnijeg sustava za\u0161tite i uporabe tih dobara.\\n\\nMogu\u0107i
  problemi u upravljanju sekundarnom dokumentacijom\\n\\nZapo\u010dev\u0161i s digitalizacijom
  muzejske gra\u0111e bilo je potrebno ru\u010dno ispisane predmetne kartice prepisati
  i unijeti u ra\u010dunalnu bazu podataka, a danas postupno prebacujemo informacije
  s CD-ova i DVD-ova na sam poslu\u017eitelj (uz pretpostavku dnevnog back up-a) ili
  vanjsku memoriju, a po\u010delo se govoriti i o blu ray disku. Kako sve napreduje
  nevjerojatnom brzinom, samo je pitanje vremena kada \u0107e nam na vrata pokucati
  neki novi trendovi i potrebe. Najzastupljeniji je problem pohrana digitalne gra\u0111e,\\n\\n4
  Vi\u0161e o konferenciji vidi u: \u0160ojat Biki\u0107, Maja \\\"ICOM/CIDOC 2002.:
  O\u010duvanje kultura \u2013 dokumentiranje nematerijalne ba\u0161tine, Porto Alegre,
  Brazil\\\", u: Informatica Museologica 34 (1-2), 2003.\\n\\nali i podjela fondova
  sekundarne dokumentacije prema vrsti medija. S obzirom na \u010dinjenicu da nas
  razvoj suvremene tehnologije tjera da iz godine u godinu presnimavamo informacije
  s jednog nosa\u010da na drugi ne bismo li izbjegli opasnost da za koju godinu nemamo
  tehni\u010dke mogu\u0107nosti kori\u0161tenja odre\u0111ene gra\u0111e (npr., VHS-a),
  va\u017eno je izna\u0107i nove metode pohrane. Smatram da je u samoj dokumentaciji,
  ali i bilje\u017eenju nematerijalne ba\u0161tine va\u017ena informacija koju \u017eelimo
  prenijeti, odnosno sa\u010duvati, a ne sam medij. Pritom ne govorim o uni\u0161tavanju
  videokaseta nego o nu\u017enosti digitalizacije kako bismo koristili njihov sadr\u017eaj,
  dok sam medij mo\u017eemo sa\u010duvati u nekoliko primjeraka ili ostaviti da se
  razli\u010ditim medijima i tehnolo\u0161kim dostignu\u0107ima bave muzeji tehni\u010dke
  prirode. Valja pritom uzeti u obzir koja je gra\u0111a u pitanju no svakako ne vrijedi
  \u010duvati desetke tisu\u0107a DVD-a ako se njihovi sadr\u017eaji mogu pohraniti
  na vanjske memorije ili poslu\u017eitelj. Uzmimo za primjer fond Medijateka. On
  se u trenutku izrade programa S++ zasigurno smatrao neizostavnim, no danas je zaista
  upitna njegova nu\u017enost. U priru\u010dniku za S++ navodi se primjer uporabe:
  \\\"ukoliko je prilikom otvorenja izlo\u017ebe napravljen velik broj fotografija
  od kojih ne \u017eelite sve zasebno inventirati prvo \u0107ete u fond Medijateka
  inventirati medij \u2013 CD ili DVD \u2013 na kojem se fotografije nalaze. Zatim
  \u0107ete odabrane fotografije pojedina\u010dno inventirati u fondu Fototeka, te
  na svakom zapisu uspostaviti vezu sa zapisom u Medijateci.\\\" (Link2, 2007: 30).\\n\\nIako
  je to na\u010din da se fond Medijateka iskoristi, mo\u017eda bi se u perspektivi
  fotografije mogle pohraniti u datoteku na poslu\u017eitelju. Tada bi u fototeci
  inventarizirali odabranu fotografiju i naveli smje\u0161taj ostalih, odnosno upisali
  vezu s datotekom na poslu\u017eitelju. Na taj bi se na\u010din polako oslobodili
  velike koli\u010dine CD-a i DVD-a koji se, isto tako, mogu o\u0161tetiti rukovanjem
  kao i drugi \\\"tradicionalniji\\\" mediji. Zasigurno \u0107e se prona\u0107i bezbroj
  razloga za\u0161to pohranjivati informacije na nekada nekonvencionalnim a danas
  uobi\u010dajenim medjima, ali je svakako dobro progovoriti o sve br\u017eim tehnolo\u0161kim
  promjenama koje nas iznena\u0111uju iz dana u dan i stvoriti platformu za razgovor
  o problemima unutar spomenutih podru\u010dja. Brzina promjena u tehnolo\u0161kom
  okru\u017eenju je tolika da je nu\u017eno imati osobu koja \u0107e pratiti suvremene
  trendove (dokumentarist) i u skladu s njima obra\u0111ivati sekundarnu dokumentaciju,
  \u0161to nije slu\u010daj u svim muzejima. Ljudski kapital od iznimne je va\u017enosti
  ako zaista \u017eelimo za\u0161tititi ono \u0161to smatramo vrijednim za\u0161tite.\\n\\nVe\u0107
  je nagla\u0161eno kako su potrebe muzeja razli\u010dite s obzirom na vrstu gra\u0111e
  kojom se bave, te ljudskim i tehnolo\u0161kim/financijskim resursima kojima raspola\u017ee.
  Digitalizaciju je te\u0161ko obaviti bez financijske potpore. No, taj problem dobrim
  dijelom rje\u0161ava Ministarstvo kulture koje dodjeljuje zna\u010dajna sredstva
  projektima digitalizacije. \u010cini se, u kona\u010dnici, kako je klju\u010dni
  problem ljudski faktor. Individualna odgovornosti u trenutku obrade gra\u0111e,
  nedostatna edukacija na polju informacijskih znanosti te manjak suradnje me\u0111u
  muzejima kada je rije\u010d o sekundarnoj dokumentaciji, dovodi do neizbje\u017ene
  sporosti u rje\u0161avanju problema. S obzirom na to da nekolicina muzeja nema dokumentarista,
  ali i na temelju razgovora s kolegama iz radne skupine za sekundarnu dokumentaciju,
  naglasit \u0107u koliko je zaista prisutan problem informacijske (ne)pismenosti
  u na\u0161im muzejima. Iako se danas gotovo svi koriste web platformom te razli\u010ditim
  internetskim pretra\u017eiva\u010dima, elektroni\u010dkom po\u0161tom i barem dijelom
  paketa\\n\\nMicrosoft Office, te vje\u0161tine \u010desto nisu dovoljne za pravilno
  upravljanje informacijskim sustavima za obradu i upravljanje sekundarnom dokumentacijom.
  Od bazi\u010dnih koncepata kao \u0161to je sam pojam medija (nosa\u010da), formata
  i veli\u010dine slikovne datoteke i sl. do kona\u010dnog povezivanja \\\"predmeta\\\"
  s metapodacima susre\u0107emo se s brojnim pote\u0161ko\u0107ama. Uklju\u010dimo
  li pritom nu\u017enost skeniranja, smanjivanja gra\u0111e, prebacivanja u druge
  formate i sl., \u010dini se da mukama nema kraja. Naravno, postoje svijetli primjeri,
  no vrlo \u010desto bez podr\u0161ke tvrtke Link2 mnoga od ovih pitanja ostala bi
  visjeti u zraku. Unato\u010d brojnim radionicama na temu rada u programima M++ i
  S++, \u010dini se kako nam nedostaju neka temeljna znanja.\\n\\n\\\"Tradicionalna
  pismenost (\u010ditanje i pisanje, numeri\u010dka/matemati\u010dka, a odnedavna
  i ra\u010dunalna pismenost) u dana\u0161njim uvjetima nije dostatna. Pismenost za
  21. stolje\u0107e uvodi nov skup vje\u0161tina i znanja potrebnih za uspje\u0161an
  i kvalitetan \u017eivot u dru\u0161tvu znanja. Kompetencije na koje se u literaturi
  i u obrazovnim strategijama sve \u010de\u0161\u0107e upu\u0107uje kao polazi\u0161te
  cjelo\u017eivotnog obrazovanja, nazivaju se informacijskom pismeno\u0161\u0107u.\\\"
  (\u0160piranec, 2003: 6).\\n\\nPritom \\\"se pokazalo da sama tehnologija nije dovoljna.
  Pojedinac danas mora biti osposobljen da koriste\u0107i se tehnologijama do\u0111e
  do potrebnih informacija, da u bujici informacija zna raspoznati koja mu je informacija
  potrebna i kako je koristiti.\\\" (ibid.).\\n\\nZna\u010dajno je navesti kako se
  od samog po\u010detka kori\u0161tenja (1974.) ovog termina pod informacijskom pismeno\u0161\u0107u
  podrazumijeva \\\"u\u010dinkovito kori\u0161tenje informacija u kontekstu rje\u0161avanja
  problema.\\\" (Bawden, 2001: 9 u \u0160piranec, ibid.). \\\"D. Bawden (2001) u koncepte
  suvremene pismenosti, osim informacijske ubraja medijsku, knji\u017eni\u010dnu,
  informati\u010dku i digitalnu pismenost definiraju\u0107i svaku posebno.\\\" (\u0160piranec,
  2003: 7-8). Pritom knji\u017eni\u010dna pismenost prethodi informacijskoj koja objedinjuje
  razli\u010dite vrste medija, dok se ra\u010dunalna nerijetko izjedna\u010dava s
  informacijskom pismeno\u0161\u0107u, no kako \u0160piranec u svome radu obja\u0161njava
  \\\"posrijedi su dva bitno razli\u010dita fenomena. Dok se informacijska pismenost
  bavi sadr\u017eajem, informati\u010dka se odnosi na tehnologiju, infrastrukturu
  i tehnolo\u0161ki \\\"know-how\\\". (ibid.). Iz navedenog je jasno kako su za obradu
  sekundarne dokumentacije nu\u017ene obje vje\u0161tine. Zaklju\u010dimo stoga kako
  ljudski faktor odgovara pojmu informacijska pismenost. Naime, uz svu tehnologiju,
  \u010dovjek je onaj koji upravlja znanjem, stvara ga i pohranjuje. Na\u0161a pogre\u0161ka
  ili kriva procjena rezultirat \u0107e gre\u0161kom u programu. Nova podru\u010dja
  psihologije sve vi\u0161e pa\u017enje usmjeravaju na istra\u017eivanje i nagla\u0161avanje
  na\u010dina na koji donosimo odluke. \\\"Dio na\u0161eg mozga koji takvim [brzim]
  5 skokovima dolazi do zaklju\u010dka zove se adaptivno nesvijesno\\\" (Gladwell,
  2005: 12). Bez dublje analize Gladwellova rada i brojnih primjera gdje se isti\u010de
  va\u017enost podsvjesnog znanja, iskustva i intuicije, naglasila bih samo \u010dinjenicu
  koje smo rijetko svjesni. Unato\u010d smjernicama, pravilnicima i zakonima, s kojima
  ponekad i nismo u potpunosti upoznati, probleme profesionalne naravi uglavnom rje\u0161avamo
  bez ve\u0107ih pote\u0161ko\u0107a. Sam pojam takvog znanja mo\u017ee se definirati
  kao \\\"nematerijalni resurs, slika stvarnosti iskazana zamislima \u010dovjeka dok
  promatra svijet koji ga okru\u017euje: prostor, objekte, odnose i doga\u0111aje
  u toj stvarnosti. Ono se sastoji\\n\\n5 Nap. a.\\n\\nod intuicije, skupa ideja,
  iskustva,vje\u0161tina i u\u010denja i ima potencijal stvaranja nove vrijednosti.\\\"
  (Ljubeti\u0107, 2005: 13).\\n\\nNu\u017eno je pritom konstantno propitivati ho\u0107e
  li na\u0161e znanje mo\u0107i biti iskori\u0161teno u suvremenim muzeolo\u0161kim
  praksama i dru\u0161tvenim potrebama. Upravo je upravljanje znanjem jedno od klju\u010dnih
  podru\u010dja suvremenog menad\u017ementa. Iako mo\u017ee zvu\u010dati surovo i
  neprimjereno muzeolo\u0161kim praksama, ono \u0161to se u ovom radu \u017eeli naglasiti
  jest \u010dinjenica kako se takozvano eksplicitno znanje mo\u017ee prenositi informacijskim
  sustavima, ali ono \\\"tiho ili iskustveno\\\" znanje 6 prenose i koriste ljudi
  unutar same organizacije. Prevedeno na na\u0161 primjer suradnja i razmjena ideja
  i iskustava stru\u010dnjaka na razini muzeja ili muzejske zajednice predstavljale
  bi temelj spomenutog modela.\\n\\nSpomenimo jo\u0161 neka ograni\u010denja programa
  S++ tehni\u010dke prirode, zanimljiva za ovaj rad. Iako se referiram na tekst posve\u0107en
  arheolo\u0161koj zbirci, smatram da su opaske relevantne i za druge muzeje/zbirke.\\n\\n\\\"Baza
  S++ pokazuje neke nedostatke kao \u0161to su ovisno o fondu, prevelik ili premali
  tj. preop\u0161irno ili nedovoljno razra\u0111en broj podataka za upis. Primjerice
  u sklopu maske u fondu Izlo\u017ebe polje za upis opsega izlo\u017ebe je vrlo \u010desto
  nedovoljne veli\u010dine s obzirom na to da su izlo\u017ebe Arheolo\u0161kog muzeja
  Istre prete\u017eno arheolo\u0161ke te je na njima \u010desto izlo\u017eena raznovrsna
  i mnogobrojna gra\u0111a. Tako\u0111er, izlo\u017ebe Muzeja su \u010desto putuju\u0107e,
  stoga nedostaje polje za upis mjesta i vremena ranijih odr\u017eavanja iste izlo\u017ebe.\\\"
  (Zenzerovi\u0107, 2007: 204-205).\\n\\nU nastavku teksta autorica napominje problem
  \u010duvanja i arhiviranja digitalne gra\u0111e s obzirom na, kako je ranije navedeno
  u tekstu, problem trajnosti gra\u0111e u doba neprestanog razvoja informacijske
  tehnologije.\\n\\nUz sve navedeno, potreba za uvo\u0111enjem normi i standarda u
  domeni kontrole i upravljanja nazivljem ulazi u sam vrh prioriteta. Kako u svome
  radu napominju Kolbas i Vlatkovi\u0107 \\\"nadzor nazivlja ima vrlo va\u017enu ulogu
  pri dokumentiranju muzejske gra\u0111e radi \u0161to kvalitetnijeg pretra\u017eivanja
  te se u tu svrhu tezaurus name\u0107e kao kvalitetno pomagalo. Uz nadzor, on osigurava
  i dosljedno kori\u0161tenje naziva pri obradi i pretra\u017eivanju\\\" (Vlatkovi\u0107
  i Kolbas, 2009: 387). Vratimo li se na suvremene muzejske uloge, online pristup
  zbirkama, sve ve\u0107i broj korisnika, pa \u010dak i samu umre\u017eenost na razini
  muzeja, jasno je koliko su va\u017eni standardi prilikom upisa nazivlja kako bi
  se izbjegle pogre\u0161ke, neefikasno pretra\u017eivanje te rad op\u0107enito. Ponovno
  se, osim nedovoljne suradnje na razini hrvatske muzejske zajednice, name\u0107u
  i manji tehni\u010dki problemi prilikom kontrole i upravljanja nazivljem. Bur\u0161i\u0107
  u svome radu napominje va\u017enost to\u010dnog unosa termina s obzirom na to da
  se oni snimaju u terminolo\u0161ku tablicu i kasnije posredstvom padaju\u0107eg
  izbornika nude korisniku. Do nejasno\u0107a dolazi i ako se koristi drugi izraz
  za isti pojam, drugi redoslijed pisanja pojma i kori\u0161tenje zareza ili drugih
  znakova, razmak i sli\u010dno. Iako se na razini Areolo\u0161kog muzeja Istre razmi-\\n\\n6
  \\\"Prema autoru koji se me\u0111u prvima bavio pitanjima kreiranja i kori\u0161tenja
  znanja, Michaelu Polanyiu, znanje mo\u017eemo podijeliti na eksplicitno (engl. explicit
  knowledge) i tiho ili iskustveno znanje (engl. tacit knowldege).\\\" (Ljubeti\u0107,
  2005: 13)\\n\\n\u0161ljalo i o zaklju\u010davanju nadzora nazivlja, autorica zaklju\u010duje
  kako bi to u perspektivi samo ograni\u010davalo rastu\u0107i broj korisnika, te
  razvoj samog programa (Bur\u0161i\u0107, 2009: 214). Na temelju iskustva drugih
  specijaliziranih muzeja, etnografski muzeji Hrvatske i oni koji sadr\u017ee etnografske
  zbirke, mogli bi presko\u010diti odre\u0111ene probleme tehni\u010dke prirode i
  sve snage usmjeriti na razvoj tezaurusa. Prema izvje\u0161taju iz 2009. godine o
  radu na Tezaurusu tijekom 2008., Vlatkovi\u0107 i Kolbas napominju kako je velika
  ve\u0107ina muzeja poslala svoje nazivlje te kako \u0107e se tijekom 2009. krenuti
  s implementacijom postoje\u0107eg tezaurusa (ibid.). Prema dostupnim podacima, do
  2011. godine Etnografski muzej Istre nije sudjelovao u projektu slanjem nazivlja
  ni u implementaciji postoje\u0107eg tezaurusa.\\n\\nPerspektive razvoja etnografskih
  muzeja u informacijskom okru\u017eenju\\n\\nIako se ve\u0107 dugi niz godina govori
  o informacijskim sustavima u muzejskoj djelatnosti, digitalizaciji ba\u0161tine
  i njenom online pristupu te odskora i o dokumentaciji nematerijalne ba\u0161tine
  putem raznovrsnih ra\u010dunalnih aplikacija, \u010dini se kako ima jo\u0161 dosta
  posla na integraciji postoje\u0107ih ideja i informacijskih sustava u svakodnevni
  rad muzejskih djelatnika Hrvatske. U prvom redu, potrebno je rije\u0161iti problem
  nedovoljne informacijske i ra\u010dunalne pismenosti, zatim nedostatak dokumentarista
  i/ili informati\u010dara na razini pojedinih muzeja, te nau\u010diti koristiti razne
  potpore koje Ministarstvo i drugi izvori nude za procese digitalizacije ba\u0161tine.
  Po uzoru na istra\u017eivanje koje su autorice Pruulmann-Vangerfeldt i Aljas provele
  me\u0111u odre\u0111enim muzejima u Estoniji, poku\u0161ala sam i sama pomo\u0107u
  polustrukturiranog upitnika dobiti sliku o uporabi, efikasnosti i suradnji na polju
  sekundarne dokumentacije u hrvatskim muzejima koji sadr\u017ee etnografske zbirke.
  Na\u017ealost, od 44 muzeja na koje je upitnik poslan u razdoblju od dva tjedna
  nisam dobila nijedan odgovor. Mogu\u0107e je kako je rok bio prekratak i da su,
  s obzirom na godi\u0161nje doba, kolege bili na godi\u0161njem odmoru, no to svakako
  ne umanjuje iznena\u0111enost zbog razloga neuspjele ankete.\\n\\nUnato\u010d tome,
  ako se osvrnem na rad Pruulmann-Vangerfeldt i Aljas, koje se dodu\u0161e bave online
  pristupom digitaliziranoj ba\u0161tini od strane korisnika u \u0161irem smislu,
  \u010dini se kako se i u drugim zemljama pokazuje nedovoljno iskori\u0161tavanje
  potencijala informacijskih sustava, samog interneta i sl. (usp. Pruulmann-Vangerfeldt
  i Aljas 109127). Zanimljivo je pritom da muzejski djelatnici sam proces digitalizacije
  do\u017eivljavaju uglavnom kao tehni\u010dki proces, te je manje pa\u017enje usmjereno
  na arhitekturu informacija, interpretacije i kontekstualizaciju predmeta uop\u0107e
  (ibid., 119). Rje\u0161enje problema informacijske (ne)pismenosti svakako le\u017ei
  u konceptu cjelo\u017eivotnog u\u010denja, ali i pojedina\u010dnoj volji za uspjehom
  baziranom na suradnji. Rje\u0161avanjem problema informacijske (ne)pismenosti, automatski
  dobivamo novi pogled na suvremene muzejske uloge koje se ostvaruju u sprezi sa suvremenom
  tehnologijom.\\n\\nNadalje, zahvaljuju\u0107i radu i stru\u010dnosti na\u0161ih
  djelatnika u kulturi Hrvatska se danas ponosi s devet fenomena upisanih na UNESCO-vu
  Reprezentativnu listu nematerijalne ba\u0161tine \u010dovje\u010danstva. U tom kontekstu,
  informacijski sustavi nu\u017eni su prilikom istra\u017eivanja, dokumentiranja i
  interpretiranja nematerijalne ba\u0161tine.\\n\\nKona\u010dno, unato\u010d geografskoj
  razvedenosti Hrvatske, digitalno doba nam donosi i nove mogu\u0107nosti komunikacije.
  U tom smislu, nu\u017ean je ve\u0107i stupanj suradnje hrvatskih muzejskih stru\u010dnjaka,
  \u010dak i na dnevnoj bazi, kako bi se navedene ideje i suvremeni trendovi integrirali
  u na\u0161u muzejsku zajednicu.\\n\\nInformacijsko okru\u017eenje nudi vi\u0161estruku
  dobit ukoliko se alati pravilno upotrebljavaju. Pritom su za\u0161tita predmeta/fenomena
  i komunikacija s korisnicima mo\u017eda i najzna\u010dajniji ciljevi koje, u kona\u010dnici,
  \u017eelimo i moramo ostvariti. Uz umre\u017eenost na razini muzeja \u010dime se
  olak\u0161ava rad stru\u010dnjaka, digitalizaciju ba\u0161tine, komunikaciju s posjetiteljima,
  mogu\u0107nost reprodukcije i vi\u0161estruke uporabe gra\u0111e te otkrivanje novih
  na\u010dina dokumentiranja i prezentiranja nematerijalne ba\u0161tine, \u010dini
  se kako informacijsko doba nudi beskrajne mogu\u0107nosti koje tek moraju biti iskori\u0161tene.\\n\\nLiteratura\\n\\nBur\u0161i\u0107,
