  igluna i izmjeni Uredbe Vije\u0107a (EZ) br. 1967/2006 i Uredbe (EU) 2017/2107 Europskog
  parlamenta i Vije\u0107a (SL L 188, 12.7.2019.)\\n\\n20. Uredbe (EU) 2023/2124 Europskog
  parlamenta i Vije\u0107a od 4. listopada 2023. s odre\u0111enim odredbama za ribolov
  na podru\u010dju Sporazuma o Op\u0107oj komisiji za ribarstvo Sredozemlja (GFCM)
  (preinaka) (SL L 2023/2124, 12.10.2023.)\\n\\n21. Uredbe Vije\u0107a (EZ) br. 1100/2007
  od 18. rujna 2007. o uvodenju mjera za obnavljanje stoka europske jegulje (SL L
  248/17, 18.9.2007.)\\n\\n22. Uredbe Vije\u0107a (EZ) br. 1185/2003 od 26. lipnja
  2003 o uklanjanju peraja morskih pasa na plovilima (SL L 167/1, 4.7.2003.; u daljnjem
  tekstu: Uredba Vije\u0107a (EZ) 1185/03)\\n\\n23. Uredbe Vije\u0107a (EEZ) br. 2136/89
  od 21. lipnja 1989. o utvr\u0111ivanju zajedni\u010dkih tr\u017ei\u0161nih standarda
  za konzervirane srdele (SL L 212/79, 22.6.1989.; u daljnjem tekstu: Uredba (EEZ)
  2136/89)\\n\\n24. Uredbe Vije\u0107a (EEZ) br. 1536/92 od 9. lipnja 1992. godine
  o utvr\u0111ivanju zajedni\u010dkih tr\u017ei\u0161nih normi za konzerviranu tunu
  i palamidu (SL L 163/1, 17.6.1992.; u daljnjem tekstu: Uredba Vije\u0107a (EEZ)
  1536/92)\\n\\n25. Provedbene Uredbe Komisije (EU) 2020/38 od 16. sije\u010dnja 2020.
  kojom se utvr\u0111uju tehni\u010dki operativni zahtjevi za evidentiranje, oblikovanje
  i slanje informacija u skladu s Uredbom (EU) 2017/2403 Europskog parlamenta i Vije\u0107a
  o odr\u017eivom upravljanju vanjskim ribarskim flotama (SL L 13, 17.1.2020.)\\n\\n26.
  Uredbe (EU) 2017/2403 Europskog parlamenta i Vije\u0107a od 12. prosinca 2017. o
  odr\u017eivom upravljanju vanjskim ribarskim flotama i stavljanju izvan snage Uredbe
  Vije\u0107a (EZ) br. 1006/2008 (SL L 347, 28.12.2017.)\\n\\n27. Uredbe (EU) 2017/2107
  Europskog parlamenta i Vije\u0107a od 15. studenoga 2017. o utvr\u0111ivanju mjera
  za upravljanje, o\u010duvanje i kontrolu primjenjivih na podru\u010dju primjene
  Konvencije Me\u0111unarodne komisije za o\u010duvanje atlantskih tuna (ICCAT) i
  o izmjeni uredaba Vije\u0107a (EZ) br. 1936/2001, (EZ) br. 1984/2003 i (EZ) br.
  520/2007 (SL L 315 30.11.2017.).\u201c.\\n\\n\u010clanak 2.\\n\\nU \u010dlanku 3.
  stavku 1. iza to\u010dke 4. dodaje se nova to\u010dka 5. koja glasi:\\n\\n\u201e5.
  NNN ribolov je nezakonit, neprijavljen i nereguliran ribolov, kako je definiran
  u \u010dlanku 2. Uredbe Vije\u0107a (EZ) br. 1005/2008.\u201c.\\n\\nDosada\u0161nje
  to\u010dke 5. do 26. postaju to\u010dke 6. do 27.\\n\\nIza dosada\u0161nje to\u010dke
  27., koja postaje to\u010dka 28., dodaje se nova to\u010dka 29. koja glasi:\\n\\n\u201e29.
  vanjska oznaka je oznaka koju dodjeljuje ministarstvo nadle\u017eno za pomorstvo,
  a koju mora imati svako ribarsko plovilo upisano u povlasticu za gospodarski ribolov
  na moru.\u201c.\\n\\nDosada\u0161nje to\u010dke 28. i 29. postaju to\u010dke 30.
  i 31.\\n\\n\u010clanak 3.\\n\\nIza \u010dlanka 3. dodaju se naslov iznad \u010dlanka
  i \u010dlanak 3.a koji glase:\\n\\n\u201eKori\u0161tenje pojmova s rodnim zna\u010denjem\\n\\n\u010clanak
  3.a\\n\\nIzrazi koji se koriste u ovom Zakonu, a imaju rodno zna\u010denje, odnose
  se jednako na mu\u0161ki i \u017eenski rod.\u201c.\\n\\n\u010clanak 4.\\n\\nU \u010dlanku
  13. iza stavka 4. dodaje se novi stavak 5. koji glasi:\\n\\n\u201e(5) Za pojedina\u010dne
  vrste koje podlije\u017eu upravljanju temeljem dopu\u0161tenih koli\u010dina ulova
  u skladu s \u010dlankom 12. stavkom 1. to\u010dkom 9. ovoga Zakona, ministarstvo
  mo\u017ee putem Javnog natje\u010daja ponuditi dio ili cijelu raspolo\u017eivu kvotu
  u svrhu obavljanja gospodarskog ili negospodarskog ribolova.\u201c.\\n\\nIza dosada\u0161njeg
  stavka 5. koji postaje stavak 6. dodaje se stavak 7. koji glasi:\\n\\n\u201e(7)
  Uvjete i kriterije te postupak provedbe javnog natje\u010daja iz stavka 5. ovoga
  \u010dlanka ministar propisuje pravilnikom.\u201c.\\n\\n\u010clanak 5.\\n\\n\u010clanak
  14. mijenja se i glasi:\\n\\n\u201e(1) Na mjestima ozna\u010denim u slu\u017ebenim
  pomorskim publikacijama na kojima se nalaze podmorski kabeli i cjevovodi, kao i
  hidroarheolo\u0161ka nalazi\u0161ta i nalazi, zabranjen je ribolov uz upotrebu pridnenih
  povla\u010dnih alata.\\n\\n(2) Na podru\u010dju uzgajali\u0161ta i na udaljenosti
  manjoj od 300 metara od oznake polo\u017eaja uzgajali\u0161ta, odnosno 50 metara
  za podru\u010dja gdje se obavlja uzgoj \u0161koljka\u0161a, odnosno granice koncesijskog
  podru\u010dja, zabranjeno je obavljanje ribolova i drugih radnji koje mogu ometati
  djelatnost uzgoja.\\n\\n(3) Iznimno od stavka 2. ovoga \u010dlanka, u slu\u010daju
  bijega ribe iz uzgojnih kaveza, ministarstvo mo\u017ee, na zahtjev nositelja dozvole
  za akvakulturu na podru\u010dju uzgajali\u0161ta, rje\u0161enjem dopustiti obavljanje
  ribolova, u svrhu vra\u0107anja odbjegle ribe.\\n\\n(4) Iznimno od stavka 2. ovoga
  \u010dlanka, za potrebe za\u0161tite proizvodnje \u0161koljka\u0161a od predatora,
  ministarstvo mo\u017ee rje\u0161enjem dopustiti ribolov unutar koncesioniranog dijela
  pomorskog dobra odre\u0111enim ribolovnim alatima, na\u010dinima ribolova i u odre\u0111enom
  razdoblju na zahtjev nositelja dozvole za akvakulturu.\\n\\n(5) Iznimno od stavka
  2. ovoga \u010dlanka, uz suglasnost nositelja dozvole za akvakulturu dopu\u0161teno
  je obavljanje ribolova u znanstvene svrhe i ribolova u nastavne svrhe u skladu s
  \u010dlankom 35. ovoga Zakona.\\n\\n(6) Iznimno od stavka 2. ovoga \u010dlanka,
  uz suglasnost nositelja dozvole za akvakulturu za uzgoj ribe, ministarstvo mo\u017ee
  rje\u0161enjem dopustiti nositelju dozvole za akvakulturu za uzgoj \u0161koljka\u0161a
  skidanje obra\u0161taja \u0161koljka\u0161a s uzgojnih instalacija uzgajali\u0161ta
  ribe isklju\u010divo u svrhu daljnjeg uzgoja, uz uvjet da je vrsta \u0161koljka\u0161a
  koja se tako koristi upisana u njegovu dozvolu za akvakulturu.\\n\\n(7) Protiv rje\u0161enja
  iz stavaka 3., 4. i 6. ovoga \u010dlanka nije dopu\u0161tena \u017ealba, ali se
  mo\u017ee pokrenuti upravni spor.\\n\\n(8) Iznimno od stavka 1. ovoga \u010dlanka,
  na podru\u010djima hidroarheolo\u0161kih nalazi\u0161ta i nalaza ministar \u0107e
  dodatno pravilnikom propisati ograni\u010denja u obavljanju ribolova, uz prethodnu
  suglasnost ministra nadle\u017enog za poslove kulture.\u201c.\\n\\n\u010clanak 6.\\n\\nU
  \u010dlanku 15. stavku 1. na kraju re\u010denice umjesto to\u010dke stavlja se zarez
  i dodaju se rije\u010di: \u201euz uvjet da je plovilo ozna\u010deno vanjskom oznakom.\u201c.\\n\\nStavci
  8. i 9. bri\u0161u se.\\n\\n\u010clanak 7.\\n\\nU \u010dlanku 18. stavku 4. podstavku
  1. rije\u010d: \u201eprethodnog\u201c bri\u0161e se.\\n\\nU podstavku 4. rije\u010d:
  \u201eprekr\u0161ajna\u201c bri\u0161e se, a rije\u010di: \u201e\u010dlankom 79.\u201c
  zamjenjuju se rije\u010dima: \u201e\u010dlankom 80. stavkom 3.\u201c.\\n\\nIza podstavka
  5. bri\u0161e se to\u010dka i dodaju se podstavci 6. i 7. koji glase:\\n\\n\u201e-
  u slu\u010daju kada plovilo upisano u povlasticu nema vanjsku oznaku\\n- u slu\u010daju
  brisanja plovi\u0142a iz Upisnika brodova kojeg vodi ministarstvo nadle\u017eno
  za pomorstvo.\u201c.\\n\\nU stavku 11. podstavku 3. iza broja: \u201e3.\u201c dodaju
  se rije\u010di: \u201e,6. i 7.\u201c.\\n\\n\u010clanak 8.\\n\\nU \u010dlanku 19.
  stavku 1. podstavku 3. rije\u010di: \u201estavkom 5.\u201c zamjenjuju se rije\u010dima:
  \u201estavkom 6.\u201c.\\n\\nPodstavak 4. bri\u0161e se.\\n\\n\u010clanak 9.\\n\\nU
  \u010dlanku 20. stavku 1. rije\u010di \u201e2., 3. i 4.\u201c zamjenjuju se rije\u010dima
  \u201e2. i 3.\u201c.\\n\\n\u010clanak 10.\\n\\nU \u010dlanku 21. stavak 2. mijenja
  se i glasi:\\n\\n\u201e(2) Potvrda za gospodarski ribolov izdat \u0107e se osobi
  koja je zavr\u0161ila stru\u010dno osposobljavanje prema Programu stru\u010dnog
  osposobljavanja za obavljanje djelatnosti gospodarskog ribolova ili ima zavr\u0161en
  sveu\u010dili\u0161ni prijediplomski studij, sveu\u010dili\u0161ni diplomski studij,
  sveu\u010dili\u0161ni integrirani prijediplomski i diplomski studij ili stru\u010dni
  diplomski studij iz podru\u010dja ribarstva.\u201c.\\n\\n\u010clanak 11.\\n\\nU
  \u010dlanku 22. stavku 4. iza rije\u010di: \u201e(Tetrapturus belone),\u201c dodaju
  se rije\u010di: \u201edugokrile tune (Thunnus alalunga), jegulje (Anguilla anguilla),\u201c
  a iza rije\u010di: \u201esakupljanje\u201c dodaje se rije\u010d: \u201ebodljika\u0161a,\u201c.\\n\\n\u010clanak
  12.\\n\\nU \u010dlanku 24. stavku 1. podstavci 4. i 5. bri\u0161u se.\\n\\nDosada\u0161nji
  podstavak 6. postaje podstavak 4.\\n\\n\u010clanak 13.\\n\\nU \u010dlanku 28. stavku
  4. rije\u010di: \u201estavka 2.\u201c zamjenjuju se rije\u010dima: \u201estavka
  3.\u201c.\\n\\n\u010clanak 14.\\n\\nU \u010dlanku 32. stavku 1. iza rije\u010di:
  \u201e(Xiphias gladius),\u201c dodaju se rije\u010di: \u201eiglana (Tetrapturus
  belone), dugokrile tune (Thunnus alalunga), jegulje (Anguilla anguilla),\u201c a
  iza rije\u010di: \u201esakupljanje\u201c dodaje se rije\u010d: \u201ebodljika\u0161a,\u201c.\\n\\nU
  stavku 2. iza rije\u010di: \u201eprimjerke\u201c dodaju se rije\u010di: \u201euz
  potvrdu kojom se odobrava rekreacijski ribolov trofejnih primjeraka tune\u201c.\\n\\n\u010clanak
  15.\\n\\nU \u010dlanku 33. stavku 6. rije\u010di: \u201ei minimalne referentne veli\u010dine
  za o\u010duvanje\u201c bri\u0161u se.\\n\\n\u010clanak 16.\\n\\nNaslov iznad \u010dlanka
  35. mijenja se i glasi: \u201eRibolov u znanstvene svrhe i ribolov u nastavne svrhe\u201c.\\n\\n\u010clanak
  35. mijenja se i glasi:\\n\\n\u201e(1) Ribolov u znanstvene svrhe i ribolov u nastavne
  svrhe mo\u017ee se obavljati samo na temelju rje\u0161enja kojim se takav ribolov
  odobrava, a koje na zahtjev donosi ministarstvo.\\n\\n(2) Ribolov iz stavka 1. ovoga
  \u010dlanka mo\u017ee se rje\u0161enjem dopustiti samo pravnoj ili fizi\u010dkoj
  osobi koja je registrirana za obavljanje pojedine djelatnosti iz stavka 1. ovoga
  \u010dlanka.\\n\\n(3) Rje\u0161enje iz stavka 1. ovoga \u010dlanka mora sadr\u017eavati:\\n\\n-
  naziv pravne ili fizi\u010dke osobe kojoj se odobrava ribolov\\n- svrhu obavljanja
  ribolova\\n- podatke o konstrukcijsko-tehni\u010dkim osobinama ribolovnih alata
  i/ili opreme s njihovim opisom te podatke o na\u010dinu obavljanja odnosno tehnici
  ribolova\\n- podatke o plovilu/plovilima kojima se ribolov obavlja uklju\u010duju\u0107i
  podatke o njihovim vlasnicima ukoliko se ribolov obavlja uz pomo\u0107 plovila\\n-
  podatke o podru\u010dju odnosno akvatoriju u kojem ribolov obavlja\\n- vremensko
  ograni\u010denje obavljanja ribolova\\n- podatke o jednom ili vi\u0161e djelatnika
  i/ili predstavnika podnositelja zahtjeva koji su odgovorni za provo\u0111enje ribolova
  i koji su prisutni pri obavljanju ribolova.\\n\\n(4) Zahtjev iz stavka 1. ovoga
  \u010dlanka s podacima iz stavka 3. ovoga \u010dlanka mora biti dostavljen ministarstvu
  najmanje 30 dana prije najavljenog datuma po\u010detka obavljanja ribolova.\\n\\n(5)
  Ribolov iz stavka 1. ovoga \u010dlanka ne smatra se gospodarskim ribolovom te se
  ostvareni ulov ne smije stavljati u promet, skladi\u0161titi, izlagati ili nuditi
  na prodaju.\\n\\n(6) Iznimno od stavka 5. ovoga \u010dlanka, kad se radi o ribolovu
  u znanstvene svrhe, rje\u0161enjem se mo\u017ee dopustiti ovla\u0161tenicima povlastice
  za gospodarski ribolov na moru stavljanje ulova riba i drugih morskih organizama
  u promet, skladi\u0161tenje, izlaganje ili nu\u0111enje na prodaju bez obzira obavlja
  li se ribolov u skladu s tehni\u010dkim mjerama iz Uredbe (EU) br. 2019/1241, pri
  \u010demu moraju biti ispunjeni sljede\u0107i uvjeti:\\n- ribolov se obavlja isklju\u010divo
  plovilom odnosno plovilima na koje je izdana va\u017ee\u0107a povlastica za gospodarski
  ribolov na moru s upisanim ribolovnim alatom/alatima/opremom koji se koriste u obavljanju
  ribolova\\n- ribolov se obavlja plovilom odnosno plovilima na koje je izdano va\u017ee\u0107e
  Odobrenje za gospodarski ribolov na moru ako se radi o ribolovu s ribolovnim alatima
  koji podlije\u017eu izdavanju Odobrenja odnosno ribolovu vrsta koje podlije\u017eu
  izdavanju Odobrenja odnosno ribolovu u podru\u010djima za koja se\\n\\nOdobrenje
  izdaje\\n- ulov nije ostvaren u podru\u010djima za\u0161ti\u0107enima u skladu s
  propisom kojem je zabranjeno obavljati gospodarski ribolov niti je ulov ostvaren
  u dijelu Jaba\u010dke kotline kao podru\u010dju ograni\u010denog ribolova alatima
  kojima je ribolov u njemu zabranjen\\n- ulov je oduzet od ukupnih dopu\u0161tenih
  koli\u010dina ulova, gdje je to primjenjivo\\n- ulov ispunjava uvjete minimalnih
  referentnih veli\u010dina za o\u010duvanje ili ako ne ispunjava uvjete minimalnih
  referentnih veli\u010dina za o\u010duvanje, nije namijenjen za ljudsku upotrebu.\\n\\n(7)
  U slu\u010daju iz stavka 6. ovoga \u010dlanka, ovla\u0161tenik povlastice za gospodarski
  ribolov ima iste obveze po pitanju izvje\u0161tavanja i sljedivosti kao i kod obavljanja
  gospodarskog ribolova na moru.\\n\\n(8) Iznimno od stavka 4. ovoga \u010dlanka,
  kada se ribolov u znanstvene svrhe namjerava obavljati u skladu sa stavkom 6. ovoga
  \u010dlanka uz kori\u0161tenje vi\u0161e od \u0161est ribarskih ploviila, zahtjev
  mora biti dostavljen ministarstvu najmanje 120 dana prije najavljenog datuma po\u010detka
  obavljanja ribolova.\\n\\n(9) U slu\u010daju kad se ribolov u znanstvene svrhe obavlja
  ribarskim plovlilima u skladu sa stavcima 6. i 7. ovoga \u010dlanka, ministarstvo
  je nadle\u017eno za postupanje odnosno provedbu \u010dlanka 25. Uredbe (EU) br.
  2019/1241.\\n\\n(10) Protiv rje\u0161enja iz stavka 1. i stavka 6. ovoga \u010dlanka
  nije dopu\u0161tena \u017ealba, ali se mo\u017ee pokrenuti upravni spor.\\n\\n(11)
  Za ribolov iz stavka 1. ovoga \u010dlanka koji bi se obavljao u podru\u010djima
  za\u0161ti\u0107enim u skladu sa zakonom kojim se ure\u0111uje podru\u010dje za\u0161tite
  prirode mora se ishoditi i dopu\u0161tenje o uvjetima za\u0161tite prirode koje
  izdaje ministarstvo nadle\u017eno za poslove za\u0161tite prirode.\\n\\n(12) Rje\u0161enje
  iz stavka 1. ovoga \u010dlanka mora se uvijek nalaziti na plovilu kojim se ribolov
  obavlja odnosno kod osobe odgovorne za provo\u0111enje ribolova, a koja je prisutna
  pri obavljanju ribolova.\\n\\n(13) Rje\u0161enje iz stavka 1. ovoga \u010dlanka
  ministarstvo dostavlja ministarstvu nadle\u017enom za unutarnje poslove, ministarstvu
  nadle\u017enom za pomorstvo, ministarstvu nadle\u017enom za obranu i Carinskoj upravi
  ministarstva nadle\u017enog za financije.\\n\\n(14) Ako se rje\u0161enje iz stavka
  1. ovoga \u010dlanka izdaje za ribolov u dijelovima mora koji su za\u0161ti\u0107eni
  u kategorijama nacionalnog parka, posebnog rezervata i parka prirode, ministarstvo
  ga dostavlja tijelima iz stavka 13. ovoga \u010dlanka i ministarstvu nadle\u017enom
  za za\u0161titu prirode.\u201c.\\n\\n\u010clanak 17.\\n\\n\u010clanak 42. mijenja
  se i glasi:\\n\\n\u201e(1) Ministar odlukom odre\u0111uje iskrcajna mjesta za segmente
  flote ovisno o ribolovnom alatu, podru\u010dju ribolova i vrstama riba i drugih
  morskih organizama u ostvarenom ulovu, za koje je iskrcaj dozvoljen na odre\u0111enim
  iskrcajnim mjestima.\\n\\n(2) Iskrcajna mjesta iz stavka 1. ovoga \u010dlanka ministar
  odre\u0111uje u skladu s odlukom o popisu iskrcajnih mjesta za iskrcaj ulova iz
  gospodarskog ribolova koju donosi ministar nadle\u017ean za pomorstvo na temelju
  zakona kojim se ure\u0111uje pomorsko dobro i morske luke.\\n\\n(3) Iznimno od stavka
  1. ovoga \u010dlanka iskrcaj se mo\u017ee obaviti i izvan iskrcajnog mjesta na mjestima\\n\\nkoja
  odredi nadle\u017ena lu\u010dka kapetanija, ako je to potrebno zbog sigurnosti plovidbe,
  o \u010demu je nadle\u017ena lu\u010dka kapetanija du\u017ena obavijestiti Ribarski
  monitoring centar najkasnije 12 sati nakon iskrcaja.\\n\\n(4) Plovila koja nisu
  obuhva\u0107ena segmentima flote iz odluke iz stavka 1. ovoga \u010dlanka, iskrcaj
  mogu obaviti na mjestu koje nije odre\u0111eno odlukom iz stavka 2. ovoga \u010dlanka.\u201c.\\n\\n\u010clanak
  18.\\n\\nU \u010dlanku 55. stavku 1. podstavak 2. mijenja se i glasi:\\n\\n\u201e-
  dr\u017eavne potpore u skladu s Uredbom Komisije (EU) 2022/2473, Uredbom Komisije
  (EU) br. 717/2014 i Smjernice o dr\u017eavnim potporama u sektoru ribarstva i akvakulture
  (SL C107, 23.03.2023.).\u201c.\\n\\n\u010clanak 19.\\n\\nU \u010dlanku 61. to\u010dki
  7. iza rije\u010di: \u201etr\u017ei\u0161tu\u201c dodaju se rije\u010di: \u201ei
  za kontrolu zajedni\u010dkih tr\u017ei\u0161nih standarda za konzervirane srdele
  i zajedni\u010dkih tr\u017ei\u0161nih normi za konzerviranu tunu i palamidu.\u201c.\\n\\n\u010clanak
  20.\\n\\nU \u010dlanku 61.a ispred rije\u010di: \u201eNeposredni\u201c stavlj se
  oznaka stavka: \u201e(1)\u201c\\n\\nIza stavka 1. dodaje se stavak 2. koji glasi:\\n\\n\u201e(2)
