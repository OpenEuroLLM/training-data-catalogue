sample: '["\"Zagreb, 23. o\u017eujka 2018.\\n\\nPOZIV NA TESTIRANJE KANDIDATIMA/KINJAMA\\n\\nkoji/e
  su podnijeli/e pravovremene i potpune prijave te ispunjavaju formalne uvjete iz
  javnog natje\u010daja za popunu radnog mjesta vi\u0161i/a stru\u010dni/a savjetnik/ica
  za informatiku II, 1 izvr\u0161itelj/ica na neodre\u0111eno vrijeme s punim radnim
  vremenom objavljen u \u201eNarodnim novinama\\\", broj 17 od 21. velja\u010de 2018.
  i Biltenu Hrvatskog zavoda za zapo\u0161ljavanje, broj 37 od 21. velja\u010de 2018.\\n\\nDATUM
  ODR\u017dAVANJA TESTIRANJA\\n\\n1. Vi\u0161i/a stru\u010dni/a savjetnik/ica za informatiku
  II \u2013 1 izvr\u0161itelj/ica na neodre\u0111eno vrijeme, 29. o\u017eujka 2018
  - pisano testiranje u 12,00 sati, intervju u 14,00 sati.\\n\\nKandidati koji u cijelosti
  ispunjavaju formalne uvjete natje\u010daja (inicijali imena i prezimena):\\n\\n1)
  S.\u0160.\\n\\n2) S.V.\\n\\n3) G.\u017d.\\n\\nKandidati mogu provjeriti jesu li
  pozvani na testiranje na telefonski broj: 48-01-904.\\n\\nHRVATSKI DR\u017dAVNI
  ARHIV\\n\\nMaruli\u0107ev trg 21, 10000 Zagreb, Hrvatska\\n\\ntel: 385 (1) 48 01
  999, fax: 385 (1) 48 29 000 www: http://www.arhiv.hr, e-mail: email@example.com\"",
  "\"HRVATSKI MEMORIJALNO-DOKUMENTACIJSKI CENTAR DOMOVINSKOG RATA\\n\\nMaruli\u0107ev
  trg 21, 10000 Zagreb\\n\\nTel/fax. +3851 48-28-268/221\\n\\nMB: 1909592, OIB: 57527861125,
  RAZDJEL:055 GLAVA: 35 RKP:40623\\n\\ne-mail:\\n\\nemail@example.com\\n\\nSWIFT  HPBZHR2X,
  IBAN HR9223900011100322371\\n\\nJavne usluge koje se pru\u017eaju elektroni\u010dkim
  putem:\\n\\n- upiti vezani uz informacije o Domovinskom ratu i arhivskom gradivu
  vezanom uz isto mogu se proslijediti na e-mail Hrvatskog memorijalno-dokumentacijskog
  centra Domovinskog rata:\\n\\nfirstname.lastname@example.org\"", "\"Na temelju \u010dlanka
  12. Zakona o studentskom zboru i drugim studentskim organizacijama (Narodne novine,
  broj: 71/07), te \u010dlanka 45. Statuta Visoke \u0161kole za menad\u017ement u
  turizmu i informatici u Virovitic (KLASA: 012-03/13-01/01, URBROJ: 2189-74-13-03
  od 27. velja\u010de 2013.), a temeljem prijedloga Studentskog zbora Visoke \u0161kole
  za menad\u017ement u turizmu i informatici u Virovitic od 20. svibnja 2014., Stru\u010dno
  vije\u0107e Visoke \u0161kole Virovitica na 20. sjednici odr\u017eanoj 28. svibnja
  2014. godine donosi\\n\\n**PRAVILNIK**\\n\\no financiranju Studentskog zbora i studentskih
  programa Visoke \u0161kole Virovitica\\n\\n**I. OP\u0106E ODREDBE**\\n\\n**\u010clanak
  1.**\\n\\nOvim Pravilnikom o financiranju Studentskog zbora i studentskih programa
  Visoke \u0161kole Virovitica (u daljnjem tekstu: Pravilnik) utvr\u0111uje se raspodjela
  prora\u010dunskih sredstava Studentskog zbora Visoke \u0161kole Virovitica, kriteriji
  za javni natje\u010daj za studentske programe koje provode studentske organizacije
  ili pojedini studenti na Visokoj \u0161koli Virovitica, na\u010din vrednovanja studentskih
  programa na Visokoj \u0161koli Virovitica, na\u010din imenovanja povjerenstva za
  provedbu natje\u010daja te na\u010din provedbe programa.\\n\\n**II. RASPODJELA PRORA\u010cUNSKIH
  SREDSTAVA**\\n\\n**\u010clanak 2.**\\n\\nStudentski zbor Visoke \u0161kole Virovitica
  raspodjeljuje prora\u010dunska sredstva koja su planirana za doznaku Visokoj \u0161koli
  Virovitica od strane Ministarstva znanosti, obrazovanja i sporta za sljede\u0107e
  namjene:\\n\\n- programi studenata i studentskih organizacija na Visokoj \u0161koli
  Virovitica\\n- redovito poslovanje Studentskog zbora (materijalni tro\u0161kovi)
  Visoke \u0161kole Virovitica\\n\\n**\u010clanak 3.**\\n\\nStudentski zbor Visoke
  \u0161kole Virovitica raspola\u017ee sredstvima u okviru ra\u010duna Visoke \u0161kole
  Virovitica.\\n\\n**\u010clanak 4.**\\n\\nProra\u010dunskim sredstvima iz \u010dlanka
  2. ovog Pravilnika u minimalnom iznosu od 50% Studentski zbor Visoke \u0161kole
  Virovitica raspola\u017ee temeljem javnog natje\u010daja za programe studenata i
  studentskih organizacija, a ostatak sredstava Studentski zbor Visoke \u0161kole
  Virovitica koristi za redovito poslovanje.\\n\\nOdluku o visini prora\u010dunskih
  sredstava sukladno stavku 1. ovog \u010dlanka donosi Studentski zbor Visoke \u0161kole
  Virovitica.\\n\\nIII. JAVNI NATJE\u010cAJ ZA STUDENTSKE PROGRAME\\n\\n\u010clanak
  5.\\n\\nStudentski zbor Visoke \u0161kole Virovitica du\u017ean je raspisati javni
  natje\u010daj za financiranje programa studenata i studentskih organizacija na Visokoj
  \u0161koli Virovitica po zaprimanju obavijesti Ministarstva znanosti, obrazovanja
  i sporta o visini planiranih sredstava za doznanu Studentskom zboru Visoke \u0161kole
  Virovitica.\\n\\n\u010clanak 6.\\n\\nJavni natje\u010daj iz \u010dlanka 5. ovog
  Pravilnika namijenjen je svim studentima Visoke \u0161kole Virovitica (pojedincima
  ili grupama studenata) i studentskim organizacijama (udrugama) s djelovanjem unutar
  Visoke \u0161kole Virovitica, a na isti se ne mo\u017ee javiti Studentski zbor niti
  \u010dlanovi Studentskog zbora Visoke \u0161kole Virovitica kao niti \u010dlanovi
  Povjerenstva za provedbu javnog natje\u010daja.\\n\\n\u010clanak 7.\\n\\nJavni natje\u010daja
  objavljuje se na web stranici Visoke \u0161kole Virovitica, a rok za prijavu iznosi
  15 dana od dana objave javnog natje\u010daja.\\n\\n\u010clanak 8.\\n\\nDokumentacija
  za prijavu na javni natje\u010daj mora sadr\u017eavati najmanje:\\n\\n- Opis programa
  te rok za izvo\u0111enje programa ili razdoblje u kojem \u0107e se program izvoditi\\n-
  Razra\u0111en financijski plan programa\\n- Potvrdu da je nositelj programa upisan
  u teku\u0107u akademsku godinu\\n- \u017divotopis studenta ukoliko kao pojedinac
  prijavljuje program\\n- Rje\u0161enje o registraciji udruge ukoliko udruga prijavljuje
  program\\n\\nJavnim natje\u010dajem se mo\u017ee zahtijevati i druga dokumentacija
  od zna\u010daja za vrednovanje programa.\\n\\n\u010clanak 9.\\n\\nStudentski zbor
  Visoke \u0161kole Virovitica osnovat \u0107e i imenovat Povjerenstvo za provedbu
  javnog natje\u010daja (Povjerenstvo) koje se sastoji od pet (5) \u010dlanova od
  kojih su tri (3) \u010dlana iz reda studenata prema prijedlogu Studentskog zbora,
  a dva (2) \u010dlana iz reda nastavnika prema prijedlogu dekanice Visoke \u0161kole
  Virovitica.\\n\\n\u010clanom Povjerenstva ne mo\u017ee biti student pojedinac ili
  osoba koja je \u010dlan studentske organizacije koja je prijavila program na natje\u010daj.\\n\\n\u010clanak
  10.\\n\\nPovjerenstvo utvr\u0111uje prijedlog raspodjele financijskih sredstava
  u roku od 15 dana od dana zaklju\u010denja javnog natje\u010daja, a odluku o raspodjeli
  financijskih sredstava donosi Upravno vije\u0107e Visoke \u0161kole Virovitica.\\n\\nOdluka
  iz stavka 1. ove Odluke dostavlja se Ministarstvu znanosti, obrazovanja i sporta
  sa zahtjevom za doznakom sredstava Studentskom zboru Visoke \u0161kole Virovitica.\\n\\n\u010clanak
  11.\\n\\nPovjerenstvo za provedbu javnog natje\u010daja odbacit \u0107e prijave
  koje nemaju potpunu dokumentaciju sukladno javnom natje\u010daju.\\n\\n\u010clanak
  12.\\n\\nPrilikom utvr\u0111ivanja prijedloga raspodjele financijskih sredstava
  (proces evaluacije programa) Povjerenstvo se rukovodi osobito sljede\u0107im kriterijima:\\n\\n-
  Izvodljivost programa\\n- Sufinanciranje programa od druge strane\\n- Medijski potencijal\\n-
  Stru\u010dnost\\n- Broj sudionika\\n- Dugoro\u010dnost i tradicija\\n- Posebnost
  i specifi\u010dnost programa\\n\\n\u010clanak 13.\\n\\nProces evaluacije programa
  temelji se na na\u010delima transparentnosti postupka, jednakosti tretmana neovisno
  o identitetu podnositelja programa, nepristranosti i efikasnosti rada Povjerenstva.\\n\\n\u010clanak
  14.\\n\\nZa programe kojima je odobreno financiranje temeljem javnog natje\u010daja,
  nositelji programa su du\u017eni po zavr\u0161etku programa podnijeti Izvje\u0161\u0107e
  o provedbi programa koje obuhva\u0107a i financijsko izvje\u0161\u0107e, a najkasnije
  do 31. prosinca teku\u0107e godine.\\n\\nIzvje\u0161\u0107e iz stavka 1. ovog \u010dlanka
  podnosi se Studentskom zboru te ga po prihva\u0107anju supotpisuju predsjednik Studentskog
  zbora i dekan Visoke \u0161kole Virovitica.\\n\\nIzvje\u0161\u0107e iz stavka 2.
  ovog \u010dlanka dostavlja se Ministarstvu znanosti, obrazovanja i sporta najkasnije
  do 31. sije\u010dnja sljede\u0107e godine.\\n\\n\u010clanak 15.\\n\\nProgram koji
  se ne provede u zadanom roku mo\u017ee se prekinuti ili mu se mo\u017ee produ\u017eiti
  rok za provedbu.\\n\\nNositelj projekta mo\u017ee podnijeti molbu Studentskom zboru
  Visoke \u0161kole Virovitica za produljenje roka ili prekid programa, a odluku o
  produljenju roka ili prekidu programa donosi Studentski zbor Visoke \u0161kole Virovitica
  u roku od 8 dana od dana zaprimanja molbe. Molba\\n\\nmora biti obrazlo\u017eena
  te sadr\u017eavati izvje\u0161\u0107e o provedenom dijelu programa i financijsko
  izvje\u0161\u0107e, kao i sadr\u017eavati razloge prekida programa, odnosno produljenja
  roka.\\n\\nStudentski zbor mo\u017ee u svako doba od nositelja programa zahtijevati
  izvje\u0161\u0107e o provedbi programa te ukoliko ocijeni da se program ne provodi
  sukladno uvjetima utvr\u0111enim u samom programu, mo\u017ee donijeti odluku o prekidu
  programa ili produljenju roka za provedbu programa.\\n\\n\u010clanak 16.\\n\\nU
  slu\u010daju da se prekine financiranje programa sukladno \u010dlanku 15. ovog Pravilnika,
  Studentski zbor Visoke \u0161kole Virovitica donijet \u0107e odluku o daljnjim postupcima
  koja mo\u017ee biti:\\n- raspodjela sredstava na jedan ili vi\u0161e programa koji
  su u izvedbi,\\n- financiranje drugog programa koji je sljede\u0107i na rang listi
  uspje\u0161nosti i zadovoljava sve kriterije javnog natje\u010daja,\\n- rebalans
  prora\u010dunskih sredstava i raspisivanje novog javnog natje\u010daja.\\n\\nIV.
  PROGRAMI STUDENTSKOG ZBORA\\n\\n\u010clanak 17.\\n\\nO na\u010dinu raspodjele sredstava
  za redovito poslovanje Studentskog zbora (materijalni tro\u0161kovi) odlu\u010duje
  Studentski zbor sukladno Statutu Studentskog zbora Visoke \u0161kole Virovitica
  i ostalim aktima Visoke \u0161kole Virovitica.\\n\\nV. PRIJELAZNE I ZAVR\u0160NE
  ODREDBE\\n\\n\u010clanak 18.\\n\\nOvaj Pravilnik objavit \u0107e se na Oglasnoj
  plo\u010di Visoke \u0161kole Virovitica i stupa na snagu danom objave.\\n\\nKLASA:
  602-04/14-01/80\\nUR.BROJ: 2189-74-14-02\\nVirovitica, 28. svibnja 2014.\\n\\nSTRU\u010cNO
