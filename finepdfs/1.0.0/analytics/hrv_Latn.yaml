  MEDIJE\"", "\"Klasa: 943-01/09-01/0002-1\\n\\nUrbroj: 2104/07-02-01/09\\n\\nSelca,
  2. o\u017eujka 2009. godine\\n\\nNa temelju \u010dlanka 391. Zakona o vlasni\u0161tvu
  i drugim stvarnim pravima (NN 91/96, 73/00, 79/06 i 141/06), \u010dlanka 43. Statuta
  Op\u0107ine Selca (\u201eSlu\u017ebeni glasnik Op\u0107ine Selca\\\", broj 1/06
  i 2/06), te Zaklju\u010dka Op\u0107inskog poglavarstva Klasa: 943-01/08-01/0004-12,
  Urbroj: 2104/07-02-01/08 od 3. studenoga 2008. godine, Op\u0107ina Selca objavljuje\\n\\nJAVNI
  NATJE\u010cAJ ZA PRIKUPLJANJE PISANIH PONUDA ZA PRODAJU NEKRETNINA U VLASNI\u0160TVU
  OP\u0106INE SELCA\\n\\nI. Predmet natje\u010daja\\n\\nPredmet prodaje su nekretnine
  u vlasni\u0161tvu Op\u0107ine Selca i to kompleks naziva Didoli\u0107i dvori koji
  se sastoji od glavne zgrade i niza pomo\u0107nih gra\u0111evina gospodarske namjene,
  te pripadaju\u0107ih \u010destica zemlje, upisanih u zemlji\u0161ne knjige Op\u0107inskog
  sud u Supetru kao:\\n\\n- k.\u010d.br. 82/1 oznake stojna ku\u0107a i dvor,\\n-
  k.\u010d.br. 82/2 oznake stojna ku\u0107a,\\n- k.\u010d.br. 82/3 oznake stojna ku\u0107a,\\n-
  k.\u010d.br. 82/4 oznake kuhinja,\\n- k.\u010d.br. 82/5 oznake pojata,\\n- k.\u010d.br.
  82/6 oznake du\u0107an,\\n- k.\u010d.br. 82/7 oznake dvor,\\n- k.\u010d.br. 82/8
  oznake stojna ku\u0107a i dvor,\\n- k.\u010d.br. 82/9 oznake stojna ku\u0107a,\\n-
  k.\u010d.br. 82/10 oznake ku\u0107a,\\n- k.\u010d.br. 82/11 oznake stojna ku\u0107a,\\n-
  k.\u010d.br. 82/12 oznake stojna ku\u0107a,\\n- k.\u010d.br. 82/13 oznake terasa,\\n-
  k.\u010d.br. 79/7 oznake dvor,\\n- k.\u010d.br. 79/11 oznake dvor,\\n- k.\u010d.br.
  79/12 oznake pojata,\\n- k.\u010d.br. 112 oznake pojata,\\n- k.\u010d.br. 115 oznake
  pojata,\\n- k.\u010d.br. 416 oznake ku\u0107a,\\n- k.\u010d.br. 351/2 oznake vrt,\\n-
  k.\u010d.br. 351/7 oznake vrt\\n- k.\u010d.br. 407/1 oznake vrt,\\n\\n- k.\u010d.br.
  407/3 oznake vrt,\\n\\nsve z.k.ul.br. 845 k.o. Selca.\\n\\nNekretnine koje su predmet
  prodaje upisane su kao vlasni\u0161tvo Op\u0107ine Selca a temeljem Rje\u0161enja
  Ministarstva kulture od 07.08.1997. imaju svojstvo spomenika kulture.\\n\\nNekretnine
  se prodaju isklju\u010divo kao cjelina.\\n\\nII. Opis nekretnina\\n\\nGlavna gra\u0111evina
  starija je od 100 godine i sastoji se od prizemlja povr\u0161ine 264,10 m2, I kata
  povr\u0161ine 222,78 m2, II kata povr\u0161ine 188,70 m2 i potkrovlja povr\u0161ine
  119,20 m2. U gra\u0111evini nema nikakvih zatvora, a me\u0111ukatne konstrukcije
  izgra\u0111ene su 1980 godine. Pomo\u0107ne gra\u0111evine su u ru\u0161evnom stanju.\\n\\nUz
  zgrade prodaje se i pripadaju\u0107e ogra\u0111eno zemlji\u0161te povr\u0161ine
  2.366 m2.\\n\\nNekretnine se prodaju u vi\u0111enom stanju te se isklju\u010duje
  bilo kakva odgovornost prodavatelja glede materijalnih nedostataka nekretnina.\\n\\nIII.
  Cijena nekretnina\\n\\nPo\u010detna cijena nekretnina iz to\u010dke I. ovog Natje\u010daja
  iznosi 700.000,00 EUR-a plativo u protuvrijednosti kuna po srednjem te\u010daju
  Hrvatske narodne banke na dan pla\u0107anja.\\n\\nPorez na promet nekretnina snosi
  kupac, kao i sve tro\u0161kove sklapanja ugovora i uknji\u017ebe prava vlasni\u0161tva.\\n\\nNajmanje
  polovicu kupoprodajne cijene kupac mora platiti prilikom potpisa kupoprodajnog ugovora,
  a ostatak u roku tri mjeseca od dana potpisa ugovora. Uknji\u017eba u zemlji\u0161ne
  knjige dozvolit \u0107e se tek po uplati cjelokupne kupoprodajne cijene.\\n\\nKupac
  mora preuzeti obvezu kori\u0161tenja i ure\u0111enja objekta u svrhu hotelskog smje\u0161taja,
  a u funkciju objekt mora biti stavljen u roku tri godine od dana potpisivanja ugovora
  o kupoprodaji.\\n\\nIV. Pravo podno\u0161enja pisanih ponuda na natje\u010daj imaju
  sve fizi\u010dke osobe koje su dr\u017eavljani Republike Hrvatske i pravne osobe
  sa sjedi\u0161tem u Republici Hrvatskoj.\\nV. Rok za dostavu ponuda je 15 dana od
  dana objave Natje\u010daja u Narodnim novinama.\\n\\nNepravovremene, nepotpune i
  neodre\u0111ene ponude, kao i one s ponu\u0111enom cijenom ni\u017eom od po\u010detne
  cijene, ne\u0107e se uzeti u razmatranje.\\n\\nVI. Ponude se dostavljaju na slijede\u0107u
  adresu: Op\u0107ina Selca, 21425 Selca, Trg Stjepana Radi\u0107a 5, s naznakom:
  Ponuda na natje\u010daj \u2013 ne otvaraj.\\n\\nPonude obavezno trebaju sadr\u017eavati:\\n\\n-
  za fizi\u010dke osobe \u2013 ime, prezime, adresu, JMBG, presliku osobne iskaznice,
  dokaz o dr\u017eavljanstvu u izvorniku ili ovjerenom presliku;\\n- za pravne osobe
  \u2013 tvrtku, adresu, MB, ime i prezime osobe ovla\u0161tene za zastupanje, dokaz
  o registraciji u izvorniku ili ovjerenom presliku;\\n- iznos ponu\u0111ene kupoprodajne
  cijene;\\n- rokove i na\u010din isplate kupoprodajne cijene;\\n- plan kori\u0161tenja
  predmetnih nekretnina;\\n- dokaz o uplati jam\u010devine;\\n- broj ra\u010duna,
  te to\u010dnu oznaku banke, radi povrata jam\u010devine.\\n\\nVII. Na ime jam\u010devine
  ponuditelji su du\u017eni uplatiti iznos od 5% cijene nekretnina iz to\u010dke III.
  ovog Natje\u010daja i to u protuvrijednosti kuna po srednjem te\u010daju Hrvatske
  narodne banke na dan pla\u0107anja jam\u010devine.\\n\\nJam\u010devina se upla\u0107uje
  na \u017eiro ra\u010dun Op\u0107ine Selca broj 2330003-1838300007, poziv na broj
  za fizi\u010dke osobe 22 7757- JMBG odnosno za pravne osobe 21 7757-MB.\\n\\nIzabranom
  ponuditelju upla\u0107ena jam\u010devina se ura\u010dunava u kupoprodajnu cijenu,
  dok se ostalima ponuditeljima vra\u0107a upla\u0107eni iznos, bez kamate, u roku
  15 dana po okon\u010danju natje\u010daja.\\n\\nUkoliko ponuditelj \u010dija je ponuda
  izabrana kao najpovoljnija odustane od ponude nakon primitka obavijesti da je izabran,
  odnosno ukoliko ponuditelj \u010dija je ponuda izabrana kao najpovoljnija ne pristupi
  sklapanju ugovora o kupoprodaji ili ne plati ugovorenu kupoprodajnu cijenu sukladno
  rokovima i uvjetima definiranim u ugovoru, jam\u010devina se istom ne vra\u0107a.\\n\\nVIII.
  Kriterij izbora najpovoljnije ponude je najvi\u0161a ponu\u0111ena cijena. O izboru
  najpovoljnijeg ponu\u0111a\u010da, u roku 15 dana od izbora, biti \u0107e izvije\u0161teni
  svi ponuditelji.\\n\\nIX. Op\u0107ina Selca zadr\u017eava pravo poni\u0161tenja
  natje\u010daja, odnosno neprihva\u0107anja ponuda, bez obveze da ponuditeljima obrazlo\u017ei
  razloge poni\u0161tenja natje\u010daja ili neprihva\u0107anja ponude i bez ikakve
  odgovornosti prema ponuditeljima.\\n\\nX. Sve dodatne obavijesti kao i termin za
  pregled nekretnina mogu se dobiti na telefon Op\u0107ine Selca broj 021/622-663.\\n\\nOP\u0106INA
