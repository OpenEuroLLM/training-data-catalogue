  \u043c\u0440\u0442\u0432\u0435 \u043f\u043b\u0430\u0432\u043e\u043f\u0435\u0440\u0430\u0436\u043d\u0435
  \u0442\u0443\u043d\u0435 \u0431\u0435\u0437 prisustva kontrol\u043d\u043e\u0433
  \u0442\u0458\u0435\u043b\u0430 \u043f\u0440\u043e\u0442\u0438\u0432\u043d\u043e
  \u0447\u043banku 33. stavku 3. Uredbe (EU) br. 2023/2053\\n\\n33. obavlja iskrcaj
  plavoperajne tune protivno \u010dlanku 34. Uredbe (EU) br. 2023/2053\\n\\n34. ne
  po\u0161alje prethodnu obavijest na temelju \u010dlanka 17. Uredbe (EZ) br. 1224/2009
  Ministarstvu u skladu s \u010dlankom 34. stavkom 1. Uredbe (EU) br. 2023/2053\\n\\n35.
  najmanje \u010detiri sata prije predvi\u0111enog vremena dolaska u luku zapovjednici
  ribarskih plovila Unije duljine preko svega manje od 12 metara, uklju\u010duju\u0107i
  plovila za preradu i pomo\u0107na plovila koja su uvr\u0161tena na popis plovila
  iz \u010dlanka 26. Uredbe (EU) br. 2023/2053, ili zastupnici takvih plovila, ne
  dostave Ministarstvu informacije iz \u010dlanka 34. stavka 2. Uredbe (EU) br. 2023/2053\\n\\n36.
  neovisno o duljini preko svega plovila, zapovjednici ulovnih plovila Unije u roku
  od 48 sati od dovr\u0161etka iskrcaja ne podnosu cijelovitu i to\u010dnu iskrcajnu
