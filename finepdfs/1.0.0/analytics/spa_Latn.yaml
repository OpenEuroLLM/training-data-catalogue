  "\"PROYECTO DE DECLARACI\u00d3N\\n\\nLA HONORABLE C\u00c1MARA DE DIPUTADOS DE LA
  PROVINCIA DE BUENOS AIRES\\n\\nDECLARA\\n\\nSu benepl\u00e1cito por la creaci\u00f3n
  y su apoyo incondicional a la aplicaci\u00f3n del Aporte Solidario Extraordinario
  a las Grandes Fortunas Personales impulsado por el Ejecutivo Nacional en el marco
  de la pandemia por el COVID 19 que enfrentan hoy todas las naciones del mundo, gravitante
  que resulta indispensable para que el Estado pueda dar respuesta a las necesidades
  que plantea la emergencia, evitando en todo lo que sea posible el sufrimiento del
  pueblo argentino.\\n\\nFUNDAMENTOS\\n\\nNuestro pa\u00eds entra\u00f1a una hora
  cr\u00edtica. El mundo entero afronta circunstancias in\u00e9ditas que han puesto
  en suspense las estructuras econ\u00f3micas y sociales en los cinco continentes,
  en los m\u00e1s diversos sistemas econ\u00f3micos y pol\u00edticos y que est\u00e1
  teniendo un costo en vidas humanas que est\u00e1 devastando sociedades enteras.\\n\\nEsta
  crisis sanitaria mundial sin precedentes constituye de por s\u00ed una emergencia
  insoportable. Los pa\u00edses que subestimaron el impacto que la proliferaci\u00f3n
  del virus podr\u00eda tener sobre sus poblaciones, en el supuesto de que tomar medidas
  extremas podr\u00eda perjudicar su econom\u00eda, est\u00e1n inmersos en crisis
  humanitarias que no registran antecedentes en tiempos contempor\u00e1neos.\\n\\nLas
  contribuciones extraordinarias, ya fue se\u00f1alado por reconocidos constitucionalistas,
  est\u00e1n contempladas en nuestra Carta Magna para situaciones de necesidad y urgencia,
  y en estos d\u00edas tambi\u00e9n hemos conocido numerosos ejemplos de antecedentes
  hist\u00f3ricos, empezando por las contribuciones que impuso el General San Mart\u00edn
  en el marco de lucha por la Independencia de nuestro pa\u00eds.\\n\\nArgentina,
  adem\u00e1s de tener que afrontar las complejidades que impone la hora, debe sumar
  a sus problemas que el gobierno inmediatamente anterior al actual, sumi\u00f3 a
  nuestro pa\u00eds en una situaci\u00f3n socio-econ\u00f3mica que podemos calificar
  de irracional. Tan es as\u00ed, que la primera ley que se vot\u00f3 en el Parlamento
  Nacional luego del cambio de gobierno, determin\u00f3 que el pa\u00eds enfrentaba,
  antes de que surgiera en China la epidemia producida por el COVID 19, una emergencia
  p\u00fablica en materia econ\u00f3mica, financiera, fiscal, administrativa, provisoria,
  tarifaria, energ\u00e9tica, sanitaria y social.\\n\\nLa declaraci\u00f3n de esas
  emergencias p\u00fablicas resultaba imprescindible para dise\u00f1ar un plan de
  gobierno en un pa\u00eds devastado tras cuatro a\u00f1os de neoliberalismo que,
  como aguante, deb\u00eda afrontar una deuda de dimensiones inusitadas y compromisos
  de vencimiento inminentes, con bonosas privadas y organismos internacionales de
  cr\u00e9dito.\\n\\nEn ese marco y cuando apenas la nueva gesti\u00f3n comenzaba
  a hacerse cargo del gobierno argentino, a\u00fan sin haber podido realizar una negociaci\u00f3n
  de la deuda que permitiera destinar los recursos comprometidos con ella a rescatar
  la econom\u00eda y contener el desastre social, se desat\u00f3 la pandemia producida
  por el virus COVID 19.\\n\\nTodas las variables y perspectivas de una econom\u00eda
  sumida en el desastre y en cada libro hacia situaciones sin duda mucho peores, se
  vieron repentina y exponencialmente agraviadas porque se volvi\u00f3 prioritario
  destinar la mayor cantidad de recursos posibles al simple expediente de salvar vidas
  de ciudadanos argentinos.\\n\\nEn esa marca, la restauraci\u00f3n del sistema de
  salud p\u00fablica resultaba vital e indispensable. El Ministerio de Salud de la
  Naci\u00f3n designado a Secretar\u00eda, profesionales mal pagos, hospitales abandonados
  y otros sin inaugurar, nula inversi\u00f3n en mantenimiento y abastecimiento, y
  una carencia alarmante de insumos b\u00e1sicos era la situaci\u00f3n desde la que
  se part\u00eda. Luego se supo que hab\u00eda embarques enteros de vacunas abandonados
  en la acu\u00f1a y en nuestra provincia otros vencidos, arumbrados en garajes.\\n\\nEran
  las condiciones en que nuestro pa\u00eds deb\u00eda enfrentar el que probablemente
  sea hasta la fecha el problema sanitario m\u00e1s grave en la historia de la humanidad.\\n\\nSi
  fuera posible tener suerte en el marco de una pandemia, nuestro pa\u00eds tuvo la
  tontura de que en Europa, especialmente en Espa\u00f1a e Italia, se presentara antes
  el virus y la necesidad de dar una respuesta gubernamental. Esta peque\u00f1a ventaja
  temporal que tuvimos, tambi\u00e9n la tuvieron otros pa\u00edses como Brasil, Estados
  Unidos o Ecuador que, a diferencia de las medidas energ\u00e9ticas que adopt\u00f3
  nuestro gobierno, ejecutaron pol\u00edticas err\u00e1ticas y subestimaron la dimensi\u00f3n
  del problema. Lamentablemente, estas sociedades pagan hoy con vidas humanas la falta
  de cortedad y serenidad de sus gobiernantes.\\n\\nEl gobierno nacional, en coordinaci\u00f3n
  permanente con los gobiernadores, orientados por un comit\u00e9 asesor especial
  compuesto por los cient\u00edficos de mayor renombre que hay en la Argentina, adoptaron
  r\u00e1pidamente medidas para evitar la propagaci\u00f3n del virus. As\u00ed se
  determin\u00f3 someter al pa\u00eds a un Aislamiento Social Preventivo Obligatorio
  que implic\u00f3 la suspensi\u00f3n de todo tipo de actividades p\u00fablicas que
  pudieran promover la aglomeraci\u00f3n de personas, como espect\u00e1culos art\u00edsticos
  o eventos deportivos; el cierre parcial de muchos organismos p\u00fablicos; el cierre
  de los comercios que no fueran considerados esenciales, entre lo son las farmacias;
  y las de expendio de alimentos; y la suspensi\u00f3n de la mayor\u00eda de las actividades
  productivas que no estuvieran directamente ligadas con la salud y la alimentaci\u00f3n.
  Esta \\\"quarentena\\\" impuesta a la mayor\u00eda de los agentes econ\u00f3micos
  de nuestra sociedad, tambi\u00e9n implic\u00f3 que las familias permanecieran en
  sus hogares y un alto porcentaje de la poblaci\u00f3n s\u00f3lo pudiera circular
  para atender necesidades b\u00e1sicas.\\n\\nEste Aislamiento Social Preventivo Obligatorio
  dispuesto por el Ejecutivo Nacional tuvo, sin dudas, efectos imprevistos sobre las
  cuentas fiscales. Por un lado, increment\u00f3 la necesidad de asistencia social
  al dejar sin ingresos a una\\n\\nparte muy importante de la poblaci\u00f3n que vive
  de la econom\u00eda informal, pero tambi\u00e9n a muchos trabajadores que est\u00e1n
  ocupados en actividades que fueron suspendidas por no ser consideradas \\\"esenciales\\\"
  para el funcionamiento de la sociedad; por otro lado, el freno producido en la econom\u00eda
  repercute en una baja sin precedentes en la recaudaci\u00f3n impositiva. De este
  modo, el Estado se ve obligado a enterrar un incremento desmedido en el gasto -cuya
  extensi\u00f3n en el tiempo ni se puede determinar a\u00fan- al mismo tiempo que
  sufre una mala consideraci\u00f3n de sus ingresos.\\n\\nEs en este contexto que
  el Congreso Nacional se aboc\u00f3 a la elaboraci\u00f3n de un proyecto para establecer
  un tributo extraordinario, con una asignaci\u00f3n espec\u00edfica; es decir, espec\u00edficamente
  orientado a contribuir en la resoluci\u00f3n de los problemas emergentes de esta
  crisis y tendiente a ayudar a los sectores m\u00e1s afectados.\\n\\nEl Aporte Solidario
  Extraordinario ser\u00e1 aplicado una sola vez, de manera excepcional, y los fondos
  ser\u00e1n invertidos en: equipamiento m\u00e9dico; mejorar la infraestructura y
  la calidad de vida en los barrios populares; apoyar a las PyMEs para cuidar el trabajo;
  aumentar la producci\u00f3n y distribuci\u00f3n de gas; relanzar el PROGRESAR para
  los j\u00f3venes.\\n\\nEn todo el mundo se eval\u00faan iniciativas similares, ya
  se trate de potencias econ\u00f3micas, de pa\u00edses emergentes y a\u00fan de pa\u00edses
  pobres. Con caracter\u00edsticas particulares en cada caso, pa\u00edses de Europa,
  Estados Unidos, todos nuestros hermanos de la Am\u00e9rica Latina, eval\u00faan
  establecer una contribuci\u00f3n extraordinaria.\\n\\nHay consenso mundial respecto
  a que los mecanismos tradicionales de recaudaci\u00f3n tributaria se han visto severamente
  afectados por la ca\u00edda de la actividad y es preciso, mientras se corrigen los
  problemas estructurales, adoptar medidas de emergencia.\\n\\nLa Comisi\u00f3n Independiente
  para la Reforma de la Fiscalidad Corporativa internacional integrada por Joseph
  Stiglitz, Thomas Piketty y Jos\u00e9 Antonio Ocampo, entre otros, solicit\u00f3
  la introducci\u00f3n de grav\u00e1menes progresivos sobre los servicios digitales
  y sobre los beneficios empresariales; que las empresas que operan en paraisos fiscales
  para pagar menos tributos renuncien a recibir fondos p\u00fablicos; gravar la riqueza
  offshore, entre otras medidas robustas.\\n\\nEn este contexto, en Alemania, Espa\u00f1a,
  Reino Unido, Suiza, Italia y Rusia se eval\u00faan iniciativas similares a la propuesta
  por esta norma. Las naciones que poseen econom\u00edas m\u00e1s grandes est\u00e1n
  volcando grandes cantidades de recursos en la econom\u00eda y a la salud para enfrentar
  los efectos de la pandemia. Estados Unidos implement\u00f3 un paquete fiscal de
  unos 3 billones de d\u00f3lares, lo que representa una 14 por ciento de su producto
  bruto. Las econom\u00edas del G20, en tanto, implementaron medidas fiscales estimadas
  por el 6 por ciento del PIB en promedio, en comparaci\u00f3n con apenas el 3 por
  ciento del PIB en 2019, y se ubicaban en un nivel mucho m\u00e1s alto que el observado
  en respuesta a la crisis financiera mundial de 2008-2010. Los diferentes pa\u00edses
  atendiendo a las medidas tienen que ver con las realidades de cada pa\u00eds y con
  los recursos con que se dispone. A menor grado de desarrollo relativo y autonom\u00eda,
  se reducen las disponibilidades para llevar a cabo las diversas pol\u00edticas.\\n\\nEn
  el caso argentino, la propuesta elaborada por el bloque de diputados del Frente
  de Todos, por instrucci\u00f3n de su presidente M\u00e1ximo Kirchner y a cargo de
  un equipo encabezado por el diputado Carlos Meleir establece un aporte extraordinario,
  por \u00fanica vez, que se aplicar\u00eda \u00fanicamente a las grandes fortunas
  personales: personas f\u00edsicas que hubieran declarado un patrimonio mayor a 200
  millones de pesos, equivalente a la fecha a 2,5 millones de d\u00f3lares, por lo
  que se calcula unas 12 mil personas se ver\u00e1n alcanzadas por la medida.\\n\\nEl
  aporte solidario y extraordinario es necesario para empezar a reparar el desequilibrio
  que dej\u00f3 el gobierno de Cambiemos. Algunos de los sectores m\u00e1s\\n\\nricos
  del pa\u00eds fueron beneficiados por la especulaci\u00f3n financiera y la fuga
  de capitales. Esto fue financiado por el proceso de endeudamiento m\u00e1s grande
  de la historia argentina. A su vez, se aumentaron los impuestos para la mayor\u00eda
  y se redujeron los de los m\u00e1s ricos. Esto produjo un enorme desfinanciamiento
  del Estado que perjudic\u00f3 gravemente al sistema de salud, se perdieron miles
  de puestos de trabajo y aument\u00f3 la pobreza.\\n\\nNos encontramos ante un desaf\u00edo
  hist\u00f3rico que es necesario enfrentar con humanidad y racionalidad, y requiere
  de un aporte por parte de los m\u00e1s que tienen.\\n\\nA\u00fan no se sabe cu\u00e1nto
  tiempo se extender\u00e1 el aislamiento social, porque depende de c\u00f3mo evolucione
  la curva de contagio y de qu\u00e9 nivel de preparaci\u00f3n haya desarrollado el
  sistema de salud para dar respuesta a la parte alta de \u00e9sta curva, lo que se
  denomina \\\"pico de contagio\\\", que es cuando el sistema ser\u00e1 sometido a
  una mayor exigencia.\\n\\nMientras tanto, los ejecutivos Nacional y Provincial llevan
  adelante un ambicioso plan de obra p\u00fablica vinculado a la recuperaci\u00f3n
  del sistema p\u00fablico de salud, que comprende desde la construcci\u00f3n de nuevos
  hospitales, hasta la compra de equipamientos y de insumos cr\u00edticos o, incluso,
  de la contrataci\u00f3n de profesionales para atenuar la emergencia.\\n\\nEn paralelo,
  se instrumentaron numerosas medidas como compensaciones salariales, suspensi\u00f3n
  del pago de cargas sociales para empleadores, postergaci\u00f3n de vencimientos
  de cr\u00e9ditos hipotecarios y de cr\u00e9ditos personales otorgados por la Anses,
  refinanciaci\u00f3n de saldos de tarjetas de cr\u00e9dito, asistencia a comedores
  comunitarios (que se vio m\u00e1s que triplicada en el mes de marzo, multiplicada
  por m\u00e1s de seis en el mes de abril y a\u00fan siendo complementada con la entrega
  de bolsones de alimentos, casi decuplicada en mayo con respecto a febrero), y, sobre
  todo, medidas como el Ingreso Familiar de Emergencia (IFE), que fue requerido por
  m\u00e1s de 8 millones de personas en su primera implementaci\u00f3n, por m\u00e1s
  de 11 en la segunda y que actualmente cursa la tercera con un n\u00famero similar,
  que estaba dirigido a quienes se hubieran quedado sin ingresos como consecuencia
  del aislamiento.\\n\\nLa extraordinaria demanda de alimentos en comedores comunitarios
  y la solicitud por parte de tantas personas del IFE, cuando la estimaci\u00f3n inicial
  hac\u00eda suponer que habr\u00eda unos 3 millones de solicitantes, no hace m\u00e1s
  que denotar la fr\u00e1gil situaci\u00f3n en la que vive una gran parte de la sociedad
  que, ante cualquier imprevisto que le impida generar el ingreso diario indispensable,
  no tiene garantizado, ni siquiera, el acceso a un plato de comida.\\n\\nComo ya
  se mencion\u00f3 m\u00e1s arriba, en todo el mundo se estudian e implementan medidas
  extraordinarias dadas a los Estados de los recursos que les permitan afrontar los
  gastos extraordinarios que comporta la pandemia.\\n\\nExisten numerosos estudios
  de la CEPAL, de la OCDE, del Banco Mundial que adjudican a Am\u00e9rica Latina,
  y particularmente a nuestro pa\u00eds, altos recortes en cuanto a avarizaci\u00f3n
  fiscal y fuga de capitales. El porjuicio que eso provoca al entramado social, la
  profundizaci\u00f3n de la desigualdad entre los que nada tienen y los que son due\u00f1os
  de todas las cosas.\\n\\nLa CEPAL prev\u00e9 una ca\u00edda del PIB del 9,1% en
  2020, que llevar\u00e1 a que el nivel del PIB per c\u00e1pita de Am\u00e9rica Latina
  y el Caribe sea parecido al observado una d\u00e9cada atr\u00e1s. Constituye un
  in\u00e9dito retroceso en los niveles de ingreso por habitante.\\n\\nSeg\u00fan
  lo expresado por organismos de Naciones Unidas, como la misma CEPAL y la FAO \\\"la
  recesi\u00f3n econ\u00f3mica mundial aumentar\u00e1 la pobreza y el hambre y otras
  formas de inseguridad alimentaria, en especial en pa\u00edses con redes de protecci\u00f3n
  social d\u00e9biles (...). La poblaci\u00f3n en condiciones de pobreza extrema en
  Am\u00e9rica Latina y el Caribe podr\u00eda llegar a 83,4 millones de personas.\\n\\nen
  2020 (...). La gran tarea que tenemos por delante es impedir que la crisis sanitaria
  se insin\u00fae en una crisis alimentaria\\\".\\n\\nDe m\u00e1s est\u00e1 se\u00f1alar
  que durante el gobierno anterior se relajaron todos los controles y se idearon mecanismos
  que favorecieron estas tendencias de empobrecimiento de la sociedad y concentraci\u00f3n
  de la riqueza en pocas manos. Un esfuerzo de soluci\u00f3n a estos problemas y de
  las injusticias que estos propiciaron requiere sin dudas de reformas estructurales
  del funcionamiento de la econom\u00eda de nuestro pa\u00eds. Esa discusi\u00f3n
  tendr\u00edamos que darla con urgencia. Pero hoy ni siquiera se trata de eso: se
  trata de que los escasos fondos de la econom\u00eda que se vieron favorecidos durante
  los \u00faltimos a\u00f1os resista a la sociedad un porcentaje menor de la riqueza
  que pudieron atesorar gracias al trabajo de los argentinos.\\n\\nAlrededor de la
  mitad de las personas que se ver\u00e1n alcanzadas por esta medida, declarar\u00e1n
  poseer fortunas personales por entre 200 a 400 millones de pesos. En tanto, los
  aportantes alcanzados por la mayor tasa, que avanza progresivamente desde un 2 hasta
  un 3,5 por ciento no superan las 300 personas. Asimismo, la norma propuesta prev\u00e9
  que aquellas personas que tengan sus fortunas declaradas en el exterior, sufran
  un incremento del 50 por ciento en la al\u00edcuota que le corresponda por escala.\\n\\nSe
  estima que el monto recaudado por este aporte ser\u00e1 de aproximadamente $300.000
  millones.\\n\\nRespecto de la situaci\u00f3n tributaria que enfrent\u00f3 el gobierno
  nacional al asumir, debi\u00e9ramos se\u00f1alar que los Servicios Totales de la
  Deuda fueron desde el 53 por ciento en el 2002, al 39 por ciento en 2015, a 71 por
  ciento en 2019. En esta situaci\u00f3n nos encontr\u00f3 la pandemia. \u00bfCu\u00e1nto
  representa para las cuentas p\u00fablicas este aporte extraordinario? En los cuatro
  a\u00f1os de gesti\u00f3n de Macri, se dejaron de cobrar impuestos a personas y
  a empresas de mayores salarios por el equivalente acumulado de 7 puntos del PBI.
  Este aporte permite recuperar m\u00e1s de uno de esos 7 puntos para financiar la
  recuperaci\u00f3n de la econom\u00eda.\\n\\nCon las previsiones del mes de agosto,
  los gastos o inversiones que tendr\u00e1 que realizar el Estado Nacional para atender
  las consecuencias de la pandemia suman $970.005 millones. Se trata del equipamiento
  de salud, los hospitales modulares, el IFE, el ATP, los bonos a las personas jubiladas,
  la asistencia financiera a las provincias, la asistencia financiera a PAMI y el
  refuerzo de los planes alimentarios. Este aporte extraordinario, en comparaci\u00f3n,
  representa solamente el 34% de ese enorme esfuerzo que est\u00e1n haciendo tantos
  ciudadanos por medio del Estado. Si bien lo recaudado tiene los distintos aspectos
  que mencionamos arriba, sirve esta comparaci\u00f3n como una medida para ponerlo
  en orden de magnitud.\\n\\nUna afectaci\u00f3n del 2 por ciento de su patrimonio
  impuesto a quienes poseen grandes fortunas, de ning\u00fan modo har\u00e1 cambiar
  su posici\u00f3n social ni har\u00e1 peligrar la continuidad de las actividades
  que le permiten mantener o acrecentar tal patrimonio. Al mismo tiempo, para muchas
  personas este aporte significar\u00e1 claramente la diferencia entre la vida y la
  muerte.\\n\\nLos gastos generados por la pandemia siguen en aumento y nadie puede
  prever cu\u00e1nto ser\u00e1 suficiente o si existir\u00e1 de todos modos un momento
  en el que el sistema de salud colapse frente al n\u00famero de pacientes que requerir\u00e1n
  cuidados intensivos, como ha pasado en muchos pa\u00edses del mundo, a\u00fan en
  aquellos que parec\u00edan contar con un sistema de salud suficientemente robusto.\\n\\nEl
  producto bruto mundial est\u00e1 en ca\u00edda libre y todas las previsiones que
  se hacen al respecto pierden vigencia en forma casi inmediata. Cuando se comenz\u00f3
  a discutir este aporte extraordinario, se estimaba que el Ingreso Familiar de Emergencia
  (IFE) instaurar\u00eda un pago de cerca de 40 mil millones de pesos. La primera
  enga\u00f1ada del IFE alcanz\u00f3 los 89 mil millones. De igual manera, los primeros
  c\u00e1lculos que se hicieron lo superaban un gasto extraordinario y no se\\n\\nHac\u00eda
  un a\u00f1o se esperaba repasar en el futuro. Hoy est\u00e1 claro que lo que no
  se puede prever es cuando dejar\u00e1 de pagarse.\\n\\nLa ejecuci\u00f3n presupuestaria
  del primer cuatrimestre del a\u00f1o alcanz\u00f3 porcentajes hist\u00f3ricos y
  se espera una aceleraci\u00f3n del gasto, sobre todo en materia de ayuda social
  directa en materia alimentaria y en calidad de compensaci\u00f3n de ingresos no
  recibidos. Esta aceleraci\u00f3n se estima teniendo en cuenta que el gasto primario
  del Sistema P\u00fablico Nacional para el mes de abril duplic\u00f3 el de igual
  mes del a\u00f1o 2019, superando los 545 mil millones de pesos.\\n\\nPor \u00faltimo,
  digamos que al d\u00eda de la fecha, el d\u00e9ficit fiscal para el corriente a\u00f1o
  se estima entre el 5 y el 7 por ciento del Producto Bruto, es decir, entre 1,7 y
  2 billones de pesos, suponiendo que econom\u00eda, producci\u00f3n y recaudaci\u00f3n
  encuentren una senda de recuperaci\u00f3n hacia el cuarto trimestre.\\n\\nPara poner
  en contexto esta informaci\u00f3n, es necesario se\u00f1alar que la gesti\u00f3n
  de Macri, Rodr\u00edguez Larreta y Vidal dej\u00f3 8 trimestres de ca\u00edda interanual
  del producto bruto, de 3,4 por ciento, en promedio, incluido el primer trimestre
  de este a\u00f1o. Haciendo una comparaci\u00f3n con el gobierno que le precedi\u00f3,
  se puede se\u00f1alar que entre 2005 y 2019 el promedio de ese valor fue positivo
  de 3,82 por ciento. El consumo privado tambi\u00e9n tuvo 8 ca\u00eddas trimestrales
  significativas desde el segundo trimestre de 2018, que promediaron 5,7 por ciento
  en el caso de la inversi\u00f3n la ca\u00edda fue 14 por ciento en el promedio de
  esos 8 trimestres.\\n\\nComo resultado, en el 2019 comparando con el 2015, la ca\u00edda
  del producto anual fue de 4 por ciento, del consumo privado 5,8 por ciento y de
  la inversi\u00f3n de la econom\u00eda 15,65 por ciento.\\n\\nRespecto de las expectativas
  de recaudaci\u00f3n de este tributo extraordinario, tambi\u00e9n fueron creciendo
  y pasaron de entre 1,5 y 2 mil millones de d\u00f3lares (100 y 140 mil millones
  de pesos) a la estimaci\u00f3n actual de que podr\u00edan ascender hasta 4 mil millones
  de d\u00f3lares, es decir, unos 280 mil millones de pesos.\\n\\nComo puede verse,
  si bien constituye un aporte importante dada la situaci\u00f3n que atraviesa la
  Argentina, lo recaudado puede rondar entre el 10 y el 15 por ciento del d\u00e9ficit
  con que cerrar\u00e1n este a\u00f1o las cuentas fiscales.\\n\\nLa \u00fanica posibilidad
  de construir una sociedad m\u00e1s igualitaria y, por lo tanto, m\u00e1s justa es
  avanzar en una reforma tributaria profunda que haga recaer el costo del funcionamiento
  social equitativamente, sobre cada uno de los argentinos en funci\u00f3n de lo que
  poseen y de lo que ganan, y en la creaci\u00f3n de un sistema de control del capital,
  de modo tal que la riqueza que genera el trabajo de los argentinos se conserve,
  se invierta, se gaste y tribute en nuestro pa\u00eds.\\n\\nMientras llega este d\u00eda
  y vamos construyendo el camino para que esa realidad sea posible, el aporte extraordinario
  que hoy se pide a aquellos sectores de la sociedad que no sufrieron p\u00e9rdidas
  o, incluso, que incrementaron sus ganancias durante estos cuatro a\u00f1os en los
  que el neoliberalismo hizo estragos en nuestro pa\u00eds, no es m\u00e1s que una
  peque\u00f1a reparaci\u00f3n, un justo aporte para colaborar en que la tragedia
  socio econ\u00f3mica que de por s\u00ed constituy\u00f3 la pandemia, no se convierta
  a su vez en una irreparable tragedia humanitaria.\\n\\nPor todo lo expuesto, solicito
  a los Sres. Legisladores acompa\u00f1en con su voto la presente iniciativa.\\n\\nAsimismo,
  se sugiere la comunicaci\u00f3n de la presente a la C\u00e1mara de Diputados de
  la Naci\u00f3n Argentina.\\n\\nJuan Manuel Gonz\u00e1lez Paredi\\n\\\"El Diputado\\nDelegado
  por Todos\\nH.C. Diputados Pcia. De Bs. As.\\n\\nHago constar que el presente proyecto
  ha sido remitido desde el correo oficial del Diputado/a autor/a del mismo de acuerdo
  a lo establecido en Resoluci\u00f3n de Presidencia N\u00b0 1448/2020.\\n\\nCONSTE.-\\n\\nLa
  Plata, 31 de agosto 2020.\\n\\nSe\u00f1or Presidente de la Honorable\\nC\u00e1mara
  de Diputados de la Pcia. Bs. As.-\\nDr. Federico Oterm\u00edn\\n\\nSu despacho.\\n\\nDe
  mi consideraci\u00f3n:\\n\\nMe dirijo a Ud. a los efectos de presentarme como Coautora
  del Proyecto de declaraci\u00f3n,\\nExpediente D-2886/20-21 del Diputado GOMEZ PARODI,
  Juan Miguel.\\n\\nSin otro particular, saludo a Ud. muy atentamente.\\n\\n[Signature]\\n\\nSUSANA
  GONZALEZ\\nDiputada\\nH.C. Diputados Pcia. de Bs. As.\"", "\"Thinking allowed\\n\\nLa
  nueva contabilidad del arrendamiento Juicios acerca de los cuales el arrendatario
  debe pensar\\n\\nLa mayor\u00eda de los negocios tienen arrendamientos. A partir
  del a\u00f1o 2019 cambiar\u00e1n los requerimientos para la contabilidad de los
  arrendamientos.\\n\\nSi bien el cambio b\u00e1sico es que los arrendamientos que
  el IAS 17 Arrendamientos clasifica como arrendamientos operacionales ahora ser\u00e1n
  contabilizados de la misma manera que como los arrendamientos financieros, los nuevos
  requerimientos nos dan mucho m\u00e1s acerca de qu\u00e9 pensar.\\n\\n- Esta publicaci\u00f3n
  de Deloitte est\u00e1 dise\u00f1ada para ayudarle a usted a pensar acerca de materias
  tales como:\\n- c\u00f3mo valorar el efecto general, de la l\u00ednea base, que
  los nuevos requerimientos de los arrendamientos tienen en los estados financieros;\\n-
  qu\u00e9 factores crear\u00e1n los mayores desaf\u00edos para la implementaci\u00f3n;\\n-
  qu\u00e9 factores son importantes al decidir si tomar o no ventaja de los expedientes
  pr\u00e1cticos disponibles;\\n- si sus contratos proporcionan un an\u00e1lisis claro
  de los componentes de arrendamiento, de servicio y compartidos; y\\n- si arrendar,
  seg\u00fan los t\u00e9rminos y el per\u00edodo corrientes, todav\u00eda es la manera
  m\u00e1s eficiente para asegurar el activo particular.\\n\\nNosotros pensamos que
  es importantes que antes de la fecha de aplicaci\u00f3n usted comience a pensar
  acerca de los arrendamientos. Podr\u00eda haber importantes beneficios en cambiar
  c\u00f3mo usted contrata activos, y tales cambios llevan tiempo para implementarlos.\\n\\nEsta
  publicaci\u00f3n es relevante para contralores, comit\u00e9s de auditor\u00eda y
  jefes de contabilidad.\\n\\nContenido\\n\\nIntroducci\u00f3n\\n\\nEl IFRS 16 Arrendamientos
  fue emitido por IASB en enero de 2016. Reemplazar\u00e1 al IAS 17 Arrendamientos
  para los per\u00edodos de presentaci\u00f3n de reporte que comiencen en o despu\u00e9s
  del 1 enero 2019. Usted puede aplicarlo en per\u00edodos tempranos, provisto que
  tambi\u00e9n usted aplica el IFRS 15 Ingresos ordinarios provenientes de contratos
  con clientes.\\n\\nSi bien usted tiene tres a\u00f1os para prepararse para los nuevos
  requerimientos, usted necesitar\u00e1 tomar algunas decisiones importantes acerca
  de c\u00f3mo usted va a aplicar el est\u00e1ndar \u2013 hay disponibles varias exenciones
  y expedientes pr\u00e1cticos. Nosotros tambi\u00e9n pensamos que la manera como
  algunos contratos de \\\"arrendamiento\\\" est\u00e1n escritos es probable que cambie,
  a fin de aclarar qu\u00e9 derechos el contrato est\u00e1 transmitiendo. Y porque
  las implicaciones para la informaci\u00f3n financiera podr\u00edan ser importantes,
  la planeaci\u00f3n y el pensamiento tempranos es probable que valgan la pena.\\n\\nAntecedentes\\n\\nArrendamientos
  fue uno de los primeros proyectos iniciados por IASB cuando fue formado. IASB y
  FASB trabajaron en el proyecto conjuntamente, publicaron un documento conjunto para
  discusi\u00f3n y dos borradores conjuntos para discusi\u00f3n p\u00fablica. Si bien
  el IFRS 16 y los nuevos requerimientos de FASB, que fueron emitidos en febrero de
  2016, tienen mucho en com\u00fan no son un est\u00e1ndar com\u00fan \u2013 tratan
  algunos arrendamientos de manera diferente y tienen diferentes exenciones y expedientes
  pr\u00e1cticos. Los requerimientos de FASB tambi\u00e9n son efectivos a partir del
  1 enero 2019.\\n\\nLa idea general de que el arrendamiento crea un activo y un pasivo
  para el cliente se ha mantenido como la idea central del proyecto. Como era de esperarse,
  dado que el probable efecto en los estados financieros ser\u00e1 importante para
  muchas entidades las propuestas atrajeron puntos de vista expresados de manera en\u00e9rgica,
  muchos de los cuales no respaldaron los cambios. En respuesta a las preocupaciones
  acerca del costo de aplicar las propuestas originales, el IFRS 16 tiene varios expedientes
  pr\u00e1cticos y opciones de pol\u00edtica. 1\\n\\n2\\n\\nJuicio\\n\\nNosotros pensamos
  que el IFRS 16 requerir\u00e1 que los preparadores usen m\u00e1s juicio que el que
  fue requerido por el IAS 17, en dos maneras.\\n\\nHay algunas decisiones para las
  cuales usted necesitar\u00e1 usar la orientaci\u00f3n contenida en el est\u00e1ndar
  para ayudarle a usted a determinar el tratamiento apropiado para los hechos y circunstancias
  particulares \u2013 tal como diferenciar entre un servicio y un arrendamiento y
  entre una adquisici\u00f3n y un arrendamiento; decidir si un arrendamiento califica
  para la exenci\u00f3n del activo de valor bajo; y valorar el efecto de las opciones
  para extender o terminar un arrendamiento, las modificaciones al arrendamiento y
  los alquileres contingentes. El IFRS 16 proporciona orientaci\u00f3n para muchas
  de esas decisiones, llenando algunas de las brechas contenidas en el IAS 17. Si
  bien el IFRS 16 mantiene alguna de la redacci\u00f3n usada en el IAS 17, no hay
  duda de que algunas personas lo leer\u00e1n con ojos frescos en su nuevo contexto.
  En esta publicaci\u00f3n identificaremos las principales \u00e1reas en las cuales
  este juicio ser\u00e1 requerido.\\n\\nLa segunda \u00e1rea es decidir c\u00f3mo
  usar la discreci\u00f3n que el est\u00e1ndar proporciona para conseguir el mejor
  resultado de informaci\u00f3n financiera. El IFRS 16 incluye exenciones y expedientes
  pr\u00e1cticos que, si se usan juiciosamente, pueden ayudarle a usted a reflejar
  la econom\u00eda subyacente de los contratos que contienen arrendamientos, de una
  manera costo-efectiva.\\n\\nVista de conjunto y cambios conceptuales\\n\\nEl proyecto
  para reemplazar al IAS 17 Arrendamientos fue lanzado en el a\u00f1o 2006 como un
  esfuerzo conjunto de IASB y FASB. El IFRS 16 Arrendamientos y la actualizaci\u00f3n
  equivalente a la codificaci\u00f3n de los est\u00e1ndares de contabilidad de FASB
  fueron emitidos a comienzos del 2016.\\n\\nImplicaciones b\u00e1sicas\\n\\nLos cambios
  m\u00e1s importantes afectar\u00e1n a los arrendatarios. El IFRS 16 requiere que
  los contratos que el IAS 17 clasifica como arrendamientos operacionales sean introducidos
  en el balance general, usando el enfoque del arrendamiento financiero ya familiar
  para nosotros contenido en el IAS 17. Para el arrendador permanece la distinci\u00f3n
  entre arrendamiento financiero y arrendamiento operacional, con los nuevos requerimientos
  trasladando del IAS 17 casi todos los viejos requerimientos.\\n\\nEl c\u00ednico
  dir\u00e1 que llev\u00f3 10 a\u00f1os de trabajo conjunto para que IASB simplemente
  remueva, para los arrendatarios, el concepto de arrendamiento operacional. Tal caracterizaci\u00f3n
  pasa por alto algunas diferencias importantes en el pensamiento que est\u00e1 detr\u00e1s
  del IFRS 16 y el que est\u00e1 en el IAS 17 \u2013 el movimiento desde un modelo
  de riesgos y recompensas hacia uno basado en el control y el movimiento desde el
  enfoque de todo-el-activo hacia uno que se centra en el reconocimiento de derechos.
  Esos cambios es probable que afecten c\u00f3mo pensamos acerca de un arrendamiento
  y c\u00f3mo se escriben algunos contratos.\\n\\nLa soluci\u00f3n de FASB es similar,
  en que los arrendamientos operacionales tambi\u00e9n son reconocidos en el balance
  general. Pero m\u00e1s que aplicar la metodolog\u00eda del arrendamiento financiero
  para la medici\u00f3n subsiguiente, el perfil del reconocimiento del gasto imita
  c\u00f3mo hoy son contabilizados los arrendamientos financieros. Los modelos de
  IASB y FASB llevan a diferentes oportunidad y clasificaci\u00f3n del gasto para
  esos arrendamientos.\\n\\nIASB estima que las compa\u00f1\u00edas registradas que
  usan IFRS o US GAAP revelan fuera del balance casi US$3 trillones de compromisos
  de arrendamiento financiero. El efecto en las compa\u00f1\u00edas individuales variar\u00e1.
  IASB examin\u00f3 una muestra compa\u00f1\u00edas provenientes de un rango de sectores.
  Estimaron que los pasivos relacionados con compromisos de arrendamiento operacional
  no cancelables eran en promedio el 5.4% del total de activos, pero que esto variaba
  por sector \u2013 desde 2.9% para atenci\u00f3n en salud hasta 22.7% para aerol\u00edneas.
  El efecto de las compa\u00f1\u00edas individuales dentro de cada sector tambi\u00e9n
  vari\u00f3 de manera importante. La oportunidad del reconocimiento del gasto relacionado
  tambi\u00e9n es afectada, as\u00ed como tambi\u00e9n c\u00f3mo es categorizado en
  el estado de ingresos.\\n\\nIncentivos y consecuencias de contratar\\n\\nEl cambio
  desde riesgos y recompensas hacia control tiene dos consecuencias importantes. El
  control lleva consigo m\u00e1s especificidad del activo. El arrendatario tiene el
  control de un activo particular por el per\u00edodo del arrendamiento. Ese control,
  y la especificidad, lo distinguen de un servicio. El enfoque de derechos, m\u00e1s
  que el de todo el activo, significa que los elementos del contrato son m\u00e1s
  importante que si se combinan para transferir los riesgos y recompensas de todo
  el activo para el arrendatario.\\n\\nEsos dos factores afectar\u00e1n c\u00f3mo
  interpretamos los nuevos requerimientos y c\u00f3mo los nuevos contratos para activos
  sea probable que sean escritos.\\n\\n3\\n\\n\u00bfQu\u00e9 es un arrendamiento?\\n\\nEl
  nuevo est\u00e1ndar define un arrendamiento como \\\"un contrato, o parte de un
  contrato, que le transmite al cliente el derecho a usar un activo (el activo subyacente)
  por un per\u00edodo de tiempo en intercambio por consideraci\u00f3n.\\\"\\n\\nLos
  dos factores esenciales de un arrendamiento se relacionan con el activo. El arrendamiento
  tiene que ser en relaci\u00f3n con un activo identificado y usted tiene que obtener
  el control de ese activo.\\n\\nUsted tiene el derecho a controlar el uso de un activo
  si usted tiene el derecho a dirigir su uso y tiene sustancialmente todos sus beneficios
  econ\u00f3micos durante el per\u00edodo del arrendamiento. El est\u00e1ndar usa
  los t\u00e9rminos \\\"derecho a usar\\\" y \\\"activo de derecho-de-uso\\\" en relaci\u00f3n
  con un arrendamiento, porque est\u00e1 desarrollado sobre la premisa de que el arrendamiento
  le da a usted el derecho a usar un activo espec\u00edfico. 2\\n\\nEsta idea de derecho-de-uso
  refleja un supuesto importante que subyace al est\u00e1ndar \u2013 que un activo
  f\u00edsico puede ser separado en diferentes derechos. La entidad que arrienda un
  carro por tres a\u00f1os tendr\u00e1 el derecho a usar ese carro por ese per\u00edodo
  \u2013 decidiendo cu\u00e1ndo y a d\u00f3nde conducirlo. El arrendador, mientras
  tanto, retiene los derechos restantes al activo una vez que termina el per\u00edodo
  de arrendamiento.\\n\\nUsted no necesita controlar el carro por toda la vida del
  carro, ni obtener (sustancialmente) todos los beneficios del carro. Los criterios
  de control y beneficios se relacionan con el per\u00edodo del arrendamiento. Y el
  control no necesita carecer de restricciones. El arrendador puede colocar algunas
  restricciones al uso del activo, tal como limitar la distancia a la cual se permite
  que el carro sea conducido durante el t\u00e9rmino del arrendamiento, para proteger
  su inter\u00e9s en el valor residual del carro. Los derechos de protecci\u00f3n
  no impiden durante el t\u00e9rmino del arrendamiento que usted controle el activo
  arrendado.\\n\\nLo que es importante es si usted tiene el derecho a sustancialmente
  todos los beneficios econ\u00f3micos derivados del uso del activo identificado durante
  el per\u00edodo de arrendamiento, no sustancialmente todos los beneficios econ\u00f3micos
  de todo el activo.\\n\\nExclusiones del alcance\\n\\nPara el arrendatario, el IFRS
  16 excluye de su alcance los derechos para explorar o usar minerales, petr\u00f3leo,
  gas natural y recursos no renovables similares, as\u00ed como los arrendamientos
  de activos biol\u00f3gicos.\\n\\nTambi\u00e9n excluye los derechos tenidos seg\u00fan
  acuerdos de licencia para elementos tales como pel\u00edculas cinematogr\u00e1ficas,
  grabaciones de video, juegos, manuscritos, patentes y derechos de copia. Para los
  otros activos intangibles las entidades tienen una opci\u00f3n de pol\u00edtica
  de contabilidad de aplicar el IFRS 16 y reconocer el activo arrendado y el pasivo
  o simplemente llevar al gasto los costos cuando sean incurridos \u2013 i.e. reconocer
  un gasto de \\\"alquiler.\\\"\\n\\nSi usted aplica el IFRS 16 al arrendamiento de
  activos intangibles, el est\u00e1ndar debe ser aplicado por completo. No es solo
  un asunto de hacer analog\u00eda a los principios de reconocimiento y medici\u00f3n.\\n\\n4\\n\\nRequerimientos
  b\u00e1sicos\\n\\nLos requerimientos de contabilidad y de informaci\u00f3n financiera
  contenidos en el IFRS 16 no ser\u00e1n nuevos para quienes apliquen los IFRS. El
  nuevo requerimiento es, en esencia, que todos los arrendamientos necesitar\u00e1n
  ser contabilizados usando el enfoque del arrendamiento financiero contenido en el
  IAS 17.\\n\\nExenciones del reconocimiento y expedientes pr\u00e1cticos\\n\\nComo
  arrendatario usted necesitar\u00e1 reconocer, al inicio del arrendamiento, el activo
  arrendado y el relacionado pasivo de arrendamiento. El activo arrendado es llevado
  al gasto durante el per\u00edodo de arrendamiento y los pagos de arrendamiento reducen
  el pasivo, despu\u00e9s de haber separado los componentes intereses y principal
  de cada pago.\\n\\nSin embargo, a pesar de las similitudes, el IAS 17 y el IFRS
  16 fueron desarrollados usando supuestos diferentes lo cual significa que hay diferentes
  cosas respecto de las cuales pensar.\\n\\nReconocimiento\\n\\nEn el IAS 17 la contabilidad
  para el arrendamiento financiero est\u00e1 dise\u00f1ada para dar el mismo resultado
  de contabilidad que el pr\u00e9stamo de fondos para adquirir el activo. El IAS 17
  establece que los arrendamientos financieros \\\"transfieren sustancialmente todos
  los riesgos y recompensas incidentales a la propiedad.\\\" 3 En contraste, el IFRS
  se aleja del enfoque de \\\"todo el activo\\\" y est\u00e1 desarrollado con base
  en que el arrendamiento transfiere al arrendatario, al menos algunos, derechos de
  un activo. Son esos derechos los que son reconocidos como un activo, junto con el
  pasivo para pagarlos durante el tiempo.\\n\\nEsto significa que el arrendamiento
  no necesita transferir todo el activo al arrendatario. El activo del arrendatario
  es el derecho a usar el activo arrendado durante el per\u00edodo del arrendamiento.
  Luego que sea devuelto el activo, el arrendador tiene derechos al activo residual.
  Son diferentes activos.\\n\\nLos arrendamientos no est\u00e1n limitados a contratos
  por per\u00edodos largos de tiempo, o para elementos de valor alto.\\n\\nEl alquiler
  de equipo por un d\u00eda, o incluso la contrataci\u00f3n de una bandeja de vasos
  para una funci\u00f3n de la tarde, dar\u00e1n satisfacci\u00f3n a la definici\u00f3n
  de un arrendamiento. El IFRS 16 proporciona exenciones y expedientes pr\u00e1cticos
  para simplificar los requerimientos de contabilidad para algunos arrendamientos.\\n\\nEl
  IFRS 16 proporciona dos exenciones que usted puede elegir usar, las cuales le alivian
  a usted de tener que reconocer el activo y el pasivo de arrendamiento. Las exenciones
  se relacionan con los arrendamientos de corto plazo y los arrendamientos de activos
  de valor bajo. Usted puede elegir contabilizar los pagos como un gasto \u2013 esencialmente
  lo mismo que como la contabilidad del arrendamiento operacional contenida en el
  IAS 17. Tampoco hay requerimiento para que usted demuestre que no hay una diferencia
  material entre capitalizaci\u00f3n y depreciaci\u00f3n y el enfoque m\u00e1s simple.
  Esos arrendamientos calificar\u00e1n para la contabilidad m\u00e1s simple incluso
  si las cantidades involucradas, singularmente o en el agregado, son materiales.
  En ambos casos los contratos toda v\u00eda ser\u00e1n vistos como arrendamientos,
  pero los requerimientos de contabilidad est\u00e1n simplificados.\\n\\nEl IFRS 16
  tambi\u00e9n tiene un expediente pr\u00e1ctico que deja que las entidades escojan
  no separar los contratos en los componentes de arrendamiento y de no-arrendamiento.\\n\\nArrendamientos
  de corto plazo\\n\\nCualquier arrendamiento que, a la fecha del comienzo, tenga
  un t\u00e9rmino de arrendamiento de 12 meses o menos es un arrendamiento de corto
  plazo, pero no si contiene una opci\u00f3n de compra. Usted puede elegir usar la
  contabilidad simplificada.\\n\\nSi usted elige aplicar la exenci\u00f3n del arrendamiento
  de corto plazo, usted tiene que aplicarla a todos los arrendamientos de corto plazo
  para esa clase de activo subyacente \u2013 tal como los arrendamientos de corto
  plazo de equipo audiovisual.\\n\\nEl IFRS 16 tiene orientaci\u00f3n sobre c\u00f3mo
  valorar el t\u00e9rmino del arrendamiento cuando el contrato tenga una o m\u00e1s
  opciones de extensi\u00f3n o terminaci\u00f3n. Usted no puede simplemente acudir
  a la exenci\u00f3n de corto plazo mediante crear una serie de arrendamientos a un
  a\u00f1o con \\\"opciones\\\" para renovar, o una opci\u00f3n para cancelar. Usted
  est\u00e1 requerido a determinar la sustancia de esa opci\u00f3n mediante valorar
  los incentivos econ\u00f3micos que usted tenga para extender o cancelar el arrendamiento.\\n\\n5\\n\\n6\\n\\nArrendamientos
  de activos de valor bajo Muchas organizaciones arriendan equipo. Algunas veces los
  activos son elementos de valor bajo tales como impresoras, tel\u00e9fonos y computadores
  de escritorio. El IFRS 16 permite que las entidades usen la contabilidad simplificada
  para tales elementos, liber\u00e1ndolas de tener que hacerle seguimiento a contratos
  de arrendamiento potencialmente peque\u00f1os.\\n\\nUsted necesita mirar el valor
  de todo el activo que est\u00e1 siendo arrendado, y no los derechos que el arrendamiento
  le da a usted. Usted tambi\u00e9n necesita valorar el valor de ese activo como un
  nuevo activo. Por consiguiente, el arrendamiento de corto plazo de un carro nuevo
  no ser\u00eda un arrendamiento de valor bajo (si bien puede calificar para la exenci\u00f3n
  de corto plazo). Y tampoco lo ser\u00eda el arrendamiento de maquinar\u00eda vieja
  si esa maquinaria no ser\u00eda de valor bajo en estado nuevo.\\n\\nValorar si un
  activo califica como de valor bajo requerir\u00e1 juicio, tanto inicialmente como
  con el tiempo. Alg\u00fan equipo que hoy no ser\u00eda considerado de valor bajo
  f\u00e1cilmente se convertir\u00eda en un elemento de valor bajo en la medida en
  que la tecnolog\u00eda cambie. No habr\u00eda sido factible para IASB especificar
  un valor que funcionar\u00eda a trav\u00e9s de todas las jurisdicciones (monedas)
  y con el tiempo. En lugar de ello, el IFRS 16 incluye ejemplos que IASB considera
  hoy son activos de valor bajo \u2013 computadores de escritorio y port\u00e1tiles,
  muebles de oficina, tel\u00e9fonos y \\\"otro equipo de valor bajo.\\\" Las Bases
  para las Conclusiones observan que IASB ten\u00eda \\\"en mente\\\" US5,000 cuando
  desarroll\u00f3 la exenci\u00f3n.\\n\\nLos activos calificar\u00e1n incluso si son
  materiales para la entidad en el agregado. Por ejemplo, una organizaci\u00f3n de
  entrenamiento puede tener miles de computadores de escritorio para los estudiantes.
  Calificar\u00e1n para la contabilidad m\u00e1s sencilla incluso si son sus activos
  m\u00e1s importantes.\\n\\nLa elecci\u00f3n para los arrendamientos de activos de
  valor bajo puede ser hecha sobre una base de arrendamiento-porarrendamiento. Por
  consiguiente, dos activos arrendados por una entidad podr\u00edan ser contabilizados
  de manera diferente.\\n\\nSeparaci\u00f3n de los componentes de noarrendamiento\\n\\nEl
  IFRS 16 requiere que los componentes de no-arrendamiento sean separados del arrendamiento.
  Esto significa que si un contrato contiene el arrendamiento de un activo y un contrato
  para proporcionar un servicio asociado, el contrato tiene dos componentes distintos
  \u2013 un acuerdo de arrendamiento y un acuerdo de servicio.\\n\\nComo expediente
  pr\u00e1ctico, a usted se le permite tratar todo el contrato como un arrendamiento.
  En otras palabras, usted no tiene que identificar y separar los componentes de no-arrendamiento.
  El resultado ser\u00e1 que el activo arrendado y el pasivo de arrendamiento ser\u00e1n
  ambos m\u00e1s altos que lo que ser\u00edan si el componente servicio fuera separado
  del contrato. Pero esto es claramente un enfoque m\u00e1s sencillo.\\n\\nTal y como
  ocurre con las exenciones, usted no tiene que justificar esto con base en que no
  generar\u00eda una diferencia material. El expediente est\u00e1 disponible de manera
  libre.\\n\\nEn secciones posteriores de este documento valoramos los factores para
  pensar acerca de cu\u00e1ndo decidir usar el expediente \u2013 vea la p\u00e1gina
  13.\\n\\nThinking allowed\\n\\n| La nueva contabilidad del arrendamiento\\n\\nThere
  is a difference between a\\n\\nHay una diferencia entre la presunci\u00f3n de que
  un arrendamiento incluye un componente de financiaci\u00f3n y la presunci\u00f3n
  de que todo el exceso sobre el precio en efectivo es un cargo financiero.\\n\\npresumption
  that a lease includes\\n\\npresumption that all\\n\\nof the excess a financing component
  and a\\n\\nover the cash price is a finance charge.\\n\\n7\\n\\n8\\n\\nMedici\u00f3n\\n\\nPrincipio
  b\u00e1sico de medici\u00f3n\\n\\nLa medici\u00f3n inicial se centra principalmente
  en el pasivo. El activo de arrendamiento es entonces considerado que es igual al
  pasivo de arrendamiento, m\u00e1s los costos de adquisici\u00f3n relacionados incurridos
  por el arrendatario y m\u00e1s cualesquiera pagos iniciales que hayan sido hechos
  pero que no est\u00e9n incluidos en el pasivo de arrendamiento.\\n\\nMedici\u00f3n
  inicial del pasivo\\n\\nEl primer paso es identificar los pagos relacionados con
  el derecho a usar el activo durante el t\u00e9rmino del arrendamiento que todav\u00eda
  no hayan sido pagados. Comprenden los pagos durante el per\u00edodo de arrendamiento
  m\u00e1s los pagos debidos al final del per\u00edodo de arrendamiento.\\n\\nLos
  pagos durante el per\u00edodo de arrendamiento comprender\u00e1n los pagos fijos,
  menos los incentivos por cobrar del arrendador, y los pagos variables, pero solo
  si dependen de un \u00edndice tal como el \u00cdndice de Precios al Consumidor o
  una tasa tal como una tasa de inter\u00e9s de referencia. Los alquileres contingentes,
  tales como los basados en el valor de las ventas, no se incluyen en la medici\u00f3n
  del pasivo de arrendamiento.\\n\\nLos pagos debidos al final del per\u00edodo de
  arrendamiento ser\u00e1n las cantidades que usted espera pagar seg\u00fan las garant\u00edas
  del valor residual o el precio de ejercicio de una opci\u00f3n de compra si usted
  valora que usted est\u00e1 razonablemente cierto que va a ejercer esa opci\u00f3n.
  O, si usted ha valorado que usted est\u00e1 razonablemente que va a ejercer la opci\u00f3n
  para terminar el arrendamiento, cualesquiera pagos de sanciones relacionados.\\n\\nA
  la fecha del comienzo, el pasivo de arrendamiento es medido al valor presente de
  los pagos de arrendamiento descontados usados la tasa impl\u00edcita en el arrendamiento.
  Esa tasa causa que el valor presente de los pagos de arrendamiento y el valor residual
  sean igual al valor razonable del activo subyacente (m\u00e1s cualesquiera costos
  directos iniciales del arrendador). 4 Si esa tasa no puede ser determinada f\u00e1cilmente,
  usted usa la tasa incremental de endeudamiento de su entidad.\\n\\nLa tasa de descuento\\n\\nEl
  c\u00e1lculo de la obligaci\u00f3n de arrendamiento ser\u00e1 familiar, dado que
  est\u00e1 requerido por el IAS 17. Sin embargo, el IAS 17 fue desarrollado con la
  meta de alinear la contabilidad para las adquisiciones y los arrendamientos financieros
  \u2013 todos los activos capitalizados fueron considerados equivalentes a una compra.
  Cuando un arrendamiento le transfiere al cliente todos los beneficios econ\u00f3micos
  del activo la tasa incremental y la tasa impl\u00edcita en el arrendamiento deben
  ser la misma.\\n\\nLa propuesta original de IASB y de FASB habr\u00eda requerido
  el uso de la tasa incremental de endeudamiento porque est\u00e1 m\u00e1s cerca a
  la tasa econ\u00f3micamente correcta. El cambio para usar la tasa impl\u00edcita
  en el arrendamiento como la tasa por defecto fue hecho porque las juntas decidieron
  que determinar la tasa incremental de endeudamiento podr\u00eda ser costoso y dif\u00edcil
  para algunas entidades. Sin embargo, cuando usted se mueve al modelo de reconocer
  solo algunos de los derechos contenidos en un activo lo opuesto a menudo es verdadero.
  Se vuelve m\u00e1s dif\u00edcil calcular la tasa impl\u00edcita en el arrendamiento,
  dado que la cantidad depreciable \u2013 i.e. la cantidad que se espera sea consumida
  durante el per\u00edodo de arrendamiento \u2013 es m\u00e1s dif\u00edcil de valorar.\\n\\nNosotros
  pensamos que muchas entidades encontrar\u00e1n que se hace necesario usar la tasa
  incremental de endeudamiento para algunos tipos de arrendamientos, particularmente
  los que involucran edificios \u2013 vea nuestros ejemplos en la p\u00e1gina 16.\\n\\nTambi\u00e9n,
  cuando el per\u00edodo del arrendamiento cubre una porci\u00f3n m\u00e1s peque\u00f1a
  de la vida econ\u00f3mica del activo se vuelve crecientemente probable que los pagos
  de arrendamiento incluyen un componente de servicio \u2013 vea nuestra discusi\u00f3n
  sobre los arrendamientos de corto plazo en la p\u00e1gina 19.\\n\\nT\u00e9rmino
  del arrendamiento\\n\\nEl t\u00e9rmino del arrendamiento es tambi\u00e9n un factor
  importante, dado que la medici\u00f3n inicial del pasivo refleja todos los flujos
  de efectivo hechos durante el t\u00e9rmino del arrendamiento. En la mayor\u00eda
  de casos el t\u00e9rmino ser\u00e1 claro. Sin embargo, cuando un arrendamiento contiene
  una opci\u00f3n para extender el t\u00e9rmino o para terminar temprano el arrendamiento
  usted necesitar\u00e1 valorar si usted est\u00e1 razonablemente cierto que va a
  ejercer la opci\u00f3n. Si usted est\u00e1 razonablemente cierto que va a extender
  el arrendamiento entonces todos los pagos que usted contractualmente estar\u00eda
  obligado a hacer durante ese per\u00edodo m\u00e1s largo ser\u00e1n parte del pasivo
  inicial.\\n\\nDe manera similar, si usted est\u00e1 razonablemente cierto que va
  a terminar el arrendamiento en una fecha temprana entonces cualquier pago por terminaci\u00f3n
  ser\u00e1 parte del pasivo. El IFRS 16 proporciona m\u00e1s orientaci\u00f3n que
  el IAS 17 sobre las opciones para extender o cancelar un arrendamiento, incluyendo
  la discusi\u00f3n de algunos de los incentivos econ\u00f3micos que podr\u00edan
  afectar la probabilidad de ejercer la opci\u00f3n. Los factores incluyen la importancia
  del activo para el negocio o la inversi\u00f3n en mejoramientos importantes del
  activo arrendado. Ello podr\u00eda crear un incentivo econ\u00f3mico para ejercer
  la opci\u00f3n para extender el arrendamiento de ese activo. Usted tambi\u00e9n
  est\u00e1 requerido a considerar su pr\u00e1ctica pasada.\\n\\nAlgunas personas
  podr\u00edan ver ingresar en una serie de arrendamientos de corto plazo, con una
  opci\u00f3n, como una manera de tener acceso a la exenci\u00f3n de corto plazo.
  Sin embargo, el IFRS 16 observa que a m\u00e1s corto sea el periodo m\u00e1s probable
  es que la opci\u00f3n para extenderlo ser\u00e1 ejercida a causa de los costos de
  conseguir un activo de reemplazo.\\n\\nLas implicaciones que para la informaci\u00f3n
  financiera tiene una opci\u00f3n contenida en un contrato de arrendamiento, para
  la propiedad en particular, se vuelven m\u00e1s importantes. Con la discusi\u00f3n
  ampliada de los incentivos econ\u00f3micos, y la exenci\u00f3n de corto plazo, es
  probable que veamos que se est\u00e9n desarrollando diferentes tipos de opciones.
  Es probable que sea un \u00e1rea para la cual ser\u00e1 requerido m\u00e1s juicio.\\n\\nMedici\u00f3n
  subsiguiente\\n\\nDespu\u00e9s del reconocimiento inicial, los pagos de arrendamiento
  son separados en los componentes de principal y de intereses. Cualesquiera pagos
  variables de arrendamiento (e.g. alquileres contingentes) que no fueron incluidos
  en el pasivo de arrendamiento se reconocen como un gasto de operaci\u00f3n en el
  per\u00edodo en el cual se incurre la obligaci\u00f3n por esos pagos.\\n\\nPara
  el activo de derecho-de-uso, el enfoque b\u00e1sico es usar el modelo del costo.
  El IFRS 16 logra esto mediante aplicar el IAS 16 Propiedad, planta y equipo a los
  activos de derecho-de-uso (i.e. depreciando el activo). El activo arrendado tambi\u00e9n
  necesitar\u00e1 ser re-valorado por deterioro, de acuerdo con el IAS 16 Deterioro
  del valor de los activos.\\n\\nLas exenciones al modelo del costo se relacionan
  con la revaluaci\u00f3n. Si usted est\u00e1 usando el modelo del valor razonable
  contenido en el IAS 40 Propiedad para inversi\u00f3n para contabilizar las propiedades
  para inversi\u00f3n usted tambi\u00e9n tiene que usar ese modelo para cualquier
  activo de derecho-de-uso que sea una propiedad para inversi\u00f3n. Y si usted est\u00e1
  usando el modelo de revaluaci\u00f3n contenido en el IAS 16 para una clase de propiedad,
  planta y equipo usted puede elegir tambi\u00e9n revaluar los activos de derechode-uso
  contenidos en la misma clase.\\n\\nExpediente pr\u00e1ctico de medici\u00f3n\\n\\nEl
  IFRS 16 ve a un solo contrato para arrendar 100 impresoras como un contrato con
  100 arrendamientos, asumiendo que cada impresora puede ser usada de manera independiente
  de las otras. El requerimiento del IFRS 16 ser\u00eda aplicado a cada arrendamiento
  individual. El est\u00e1ndar proporciona alivio mediante un expediente pr\u00e1ctico.\\n\\nAplicaci\u00f3n
  del portafolio\\n\\nComo un expediente pr\u00e1ctico, la entidad puede agregar en
  un portafolio los arrendamientos con caracter\u00edsticas similares y aplicar los
  requerimientos a ese portafolio, m\u00e1s que sobre una base de arrendamiento-porarrendamiento.
  Sin embargo, usted tiene que tener una expectativa razonable de que los efectos
  que el uso del enfoque de portafolio tenga en los estados financieros no diferir\u00e1n
  materialmente de la aplicaci\u00f3n de los requerimientos a los arrendamientos individuales
  dentro de ese portafolio.\\n\\nEste expediente pr\u00e1ctico puede ser \u00fatil
  si su entidad ha arrendado una flota de carros similares en t\u00e9rminos similares.
  Incluso si, d\u00edgase, un tercio de los carros es reemplazado cada a\u00f1o todav\u00eda
  podr\u00eda ser posible hacer estimados y supuestos que reflejen el tama\u00f1o
  y la composici\u00f3n de los activos y contratos contenidos en el portafolio.\\n\\n9\\n\\nImpacto
  en el estado financiero\\n\\nPresentaci\u00f3n\\n\\nEl IFRS 16 requiere que los
  activos arrendados sean mostrados por separado de los otros activos y que los pasivos
  de arrendamiento sean mostrados por separado de los otros pasivos. Sin embargo,
  esa separaci\u00f3n puede ser ya sea en la cara de los estados financieros primarios
  o en las notas. Si usted no presenta esos elementos por separado en el estado de
  posici\u00f3n financiera, los activos arrendados tienen que ser incluidos en la
  misma l\u00ednea donde est\u00e9n, o estar\u00edan, los correspondientes activos
  de propiedad. Tambi\u00e9n tienen que ser revelados los elementos de l\u00ednea
  en el estado de posici\u00f3n financiera que incluyen los activos arrendados y los
  pasivos de arrendamiento.\\n\\nEn el estado de utilidad o p\u00e9rdida y otros ingresos
  comprensivos, los intereses sobre el pasivo de arrendamiento constituyen un componente
  de los costos financieros.\\n\\nEstado de posici\u00f3n financiera\\n\\nApalancamiento\\n\\nLos
  nuevos requerimientos es casi seguro que mostrar\u00e1n un incremento en los activos
  y pasivos reconocidos. C\u00f3mo una entidad particular ser\u00e1 afectada depende
  de muchos factores, incluyendo cu\u00e1les exenciones y expedientes pr\u00e1cticos
  elige usar. Tambi\u00e9n depende de la composici\u00f3n de su portafolio, de principalmente,
  arrendamientos operacionales y de manera espec\u00edfica la tasa de financiaci\u00f3n
  y la duraci\u00f3n del per\u00edodo no-cancelable.\\n\\nM\u00faltiplo de capitalizaci\u00f3n\\n\\nM\u00faltiplo
  del gasto anual por arrendamiento operacional\\n\\nEjemplo\\n\\nPara una entidad
  con arrendamientos operacionales del IAS 17 que tiene un per\u00edodo no-cancelable
  promedio de 4 a\u00f1os y una tasa de financiaci\u00f3n del 8 por ciento, los activos
  arrendados y el pasivo de arrendamiento reconocidos es probable que sean 3.4 veces
  el gasto anual por arrendamiento operacional. Para un arrendamiento a 15 a\u00f1os
  con pagos trimestrales y una tasa de financiaci\u00f3n del 8 por ciento el m\u00faltiplo
  estar\u00eda cercano a 8.7. As\u00ed que, por ejemplo, el activo de arrendamiento
  y el pasivo de arrendamiento iniciales para un alquiler anual de propiedad de \u00a3740,000
  ser\u00eda de \u00a36,648,020.\\n\\nA m\u00e1s largo sea el per\u00edodo de arrendamiento
  y m\u00e1s baja la tasa de inter\u00e9s m\u00e1s alto es el m\u00faltiplo. La siguiente
  gr\u00e1fica proporciona un indicador del m\u00faltiplo para convertir el gasto
  anual de un arrendamiento operacional en el activo de arrendamiento y la obligaci\u00f3n
  de arrendamiento iniciales para arrendamientos que var\u00edan de 1 a 20 a\u00f1os
  con tasas de inter\u00e9s del 4 al 15 por ciento. Esos estimados asumen que todos
  los pagos se relacionan con el arrendamiento. Los m\u00faltiplos ser\u00e1n m\u00e1s
  bajos si parte del pago anual se relaciona con servicios.\\n\\nClasificaci\u00f3n\\n\\nEl
  IAS 17 trata los arrendamientos financieros como similares a la compra de un activo.
  El activo arrendado es depreciado junto con la otra propiedad, planta y equipo,
  con el IAS 17 requiriendo la aplicaci\u00f3n del IAS 16 al activo arrendado. Si
  bien el IFRS 16 se ha alejado del enfoque de todo el activo, todav\u00eda permanece
  el v\u00ednculo con el IAS 16.\\n\\nLos activos de derecho-de-uso ser\u00e1n clasificados
  en la misma categor\u00eda que el activo subyacente que sea el sujeto del acuerdo
  de arrendamiento. Por consiguiente, los arrendamientos de automotores son parte
  de los automotores dentro de propiedad, planta y equipo, si bien usted tiene que
  revelar los activos arrendados por separado de los activos de propiedad haci\u00e9ndolo
  ya sea en la cara de los estados financieros primarios o en las notas que los acompa\u00f1an.\\n\\nDe
  manera similar, si el activo de derechode-uso satisface la definici\u00f3n de una
  propiedad para inversi\u00f3n tiene que ser presentado como una propiedad para inversi\u00f3n
  y los arrendamientos de activos intangibles tambi\u00e9n ser\u00edan activos intangibles.\\n\\nLos
  pasivos de arrendamiento tienen que ser reportados por separado de los otros pasivos.\\n\\nReconocimiento
  del gasto\\n\\nGastos por alquiler IAS 17\\n\\nDepreciaci\u00f3n IFRS 16\\n\\nEstado
  de ingresos comprensivos Perfil del gasto\\n\\nEl total de los gastos relacionados
  con un arrendamiento, provenientes de la aplicaci\u00f3n del IFRS 16 ser\u00e1n
  los mismos que los provenientes de la aplicaci\u00f3n del IAS 17, pero la oportunidad
  generalmente ser\u00e1 diferente.\\n\\nLos arrendamientos operacionales generalmente
  realizan el reconocimiento de los gastos durante el per\u00edodo de arrendamiento.
  Con los nuevos requerimientos habr\u00e1 m\u00e1s gasto reconocido en el per\u00edodo
  inicial del arrendamiento, y menos en los per\u00edodos finales. Esto porque los
  costos financieros son cargados por anticipado. Para un arrendamiento a 10 a\u00f1os
  con 10 por ciento de tasa de financiaci\u00f3n el punto de quiebre en el cual el
  gasto anual cae por debajo del gasto por l\u00ednea recta t\u00edpicamente es el
  a\u00f1o seis, tal y como se muestra en la gr\u00e1fica que sigue. En la p\u00e1gina
  17 tenemos ejemplos adicionales.\\n\\nIntereses IFRS 16\\n\\nTotal del gasto IFRS
  16\\n\\n12\\n\\nLos costos asociados con la apertura del contrato ser\u00e1n incluidos
  en el costo del activo arrendado. De acuerdo con ello, para los nuevos arrendamientos
  que ser\u00edan arrendamientos operacionales si el IAS 17 fuera aplicado algunos
  costos ahora se distribuir\u00e1n durante el t\u00e9rmino del arrendamiento m\u00e1s
  que ser reconocidos cuando son incurridos.\\n\\nClasificaci\u00f3n\\n\\nLa clasificaci\u00f3n
  del gasto cambiar\u00e1 para muchos arrendamientos. Hoy, el gasto por arrendamiento
  operacional contenido en el IAS 17 es un gasto operacional. Con el IFRS 16 el gasto
  ser\u00e1 clasificado como un costo de financiaci\u00f3n o como un gasto por depreciaci\u00f3n,
  haciendo que se muevan hacia abajo m\u00e9tricas tales como \\\"utilidad operacional\\\",
  EBITDA o EBIT, las cuales deben incrementarse.\\n\\nHay algunas excepciones. Cualesquiera
  pagos de alquiler contingentes no incluidos en la medici\u00f3n inicial del pasivo
  se clasifican como gastos de operacional, dado que son los gastos asociados con
  arrendamientos de corto plazo y arrendamientos de corto plazo para los cuales usted
  elige usar la exenci\u00f3n disponible.\\n\\nFlujos de efectivo\\n\\nEl IAS 17 Estado
  de flujos de efectivo permite que la entidad presente los pagos por intereses ya
  sea en la actividad de operaci\u00f3n o en la actividad de financiaci\u00f3n, porque
  \\\"no hay consenso sobre la clasificaci\u00f3n de esos flujos de efectivo.\\\"
  Esa selecci\u00f3n libre de pol\u00edtica permanecer\u00e1 cuando tenga efecto el
  IFRS 16.\\n\\nSi la entidad tiene la pol\u00edtica de presentar como flujos de financiaci\u00f3n
  los flujos de efectivo relacionados con intereses en arrendamientos, entonces habr\u00e1
  un cambio de los pagos previamente asociados con los arrendamientos operacionales
  hacia la categor\u00eda de financiaci\u00f3n a menos que hagan un cambio de pol\u00edtica.
  El efectivo proveniente de los flujos de salida de la actividad de operaciones y
  de la actividad de financiaci\u00f3n ambos se incrementar\u00e1n para esas entidades.\\n\\nLos
  puntos de decisi\u00f3n de contabilidad\\n\\nIAS 17 \u2013 financiaci\u00f3n versus
  arrendamiento operacional\\n\\nHoy, la principal decisi\u00f3n de contabilidad se
  relaciona con si un contrato contiene un arrendamiento financiero o un arrendamiento
  operacional. Los resultados de la informaci\u00f3n financiera son importantes \u2013
  los arrendamientos financieros conducen al reconocimiento del activo arrendado y
  el pasivo de arrendamiento mientras que los arrendamientos operacionales no, est\u00e1n
  \\\"fuera del balance.\\\"\\n\\nNosotros no ten\u00edamos que preocuparnos demasiado
  por la diferencia entre una compra y un arrendamiento financiero, porque el arrendamiento
  financiero es tratado como equivalente a una compra.\\n\\nDe manera similar, la
  distinci\u00f3n entre un contrato de servicio y un arrendamiento operacional no
  es importante en t\u00e9rminos de los requerimientos de informaci\u00f3n financiera,
  porque ambos est\u00e1n fuera de balance.\\n\\nPor consiguiente, el principal punto
  de decisi\u00f3n ha estado en la distinci\u00f3n de arrendamiento financiero versus
  arrendamiento operacional:\\n\\nCompras\\nActivos y pasivos\\nArrendamiento\\nFinanciero\\nArrendamiento\\nOperacional\\nContrato
  de\\nServicios\\n\\nGastos por alquiler\\n\\nIFRS 16 \u2013 adquisici\u00f3n versus
  arrendamiento versus Servicio\\n\\nPara los arrendatarios la distinci\u00f3n entre
  un arrendamiento financiero y un arrendamiento operacional desaparece y, frente
  a ello, el IFRS 16 lleva todos los arrendamientos financieros al balance general.\\n\\nEse
  cambio significa que es importante distinguir entre el arrendamiento de un activo
  y un contrato por servicios, los cuales son contratos ejecutorios. Los contratos
  ejecutorios no se capitalizan. Por consiguiente, la extensi\u00f3n en la cual los
  pagos se relacionen con servicios afecta la medici\u00f3n inicial del activo arrendado
  y del pasivo de arrendamiento, la porci\u00f3n de los pagos reconocidos como intereses
  y el perfil del reconocimiento del gasto.\\n\\nLa distinci\u00f3n entre arrendar
  y comprar un activo tambi\u00e9n se vuelve importante porque hay diferencias de
  medici\u00f3n entre comprar y arrendar un activo.\\n\\nLas exenciones crean dos
  puntos adicionales de decisi\u00f3n. Los arrendamientos que sean de corto plazo
  o que sean por activos de valor bajo tienen disponible contabilidad simplificada
  \\\"fuera del balance general.\\\" Ambas decisiones requerir\u00e1n alg\u00fan juicio
  \u2013 vea la p\u00e1gina 5.\\n\\nEl resultado es cuatro puntos de decisi\u00f3n:\\n\\nCompra\\nArrendamiento\\nValor\\nBajo\\nCorto\\nplazo\\nContrato
  de\\nServicio\\n\\nEn t\u00e9rminos de resultados de informaci\u00f3n financiera:\\n\\nActivos
  y Pasivos\\nCompra\\nContrato de Servicio\\nArrendamiento\\nValor\\nbajo\\nCorto\\nplazo\\nGasto
  por\\n\\\"alquiler/arrendamiento\\\"\\n\\nArrendamiento versus adquisici\u00f3n\\n\\nLa
  importancia de distinguir entre un arrendamiento y un servicio recibi\u00f3 una
  cantidad de atenci\u00f3n de IASB cuando desarroll\u00f3 el IFRS 16. Menos atenci\u00f3n
  se le dio a la distinci\u00f3n entre la adquisici\u00f3n de un activo y el arrendamiento.
  Hacer de manera correcta esa distinci\u00f3n es importante porque hay diferencias
  en los requerimientos de contabilidad y revelaci\u00f3n.\\n\\nLos requerimientos
  de revelaci\u00f3n del IFRS 16, los cuales son m\u00e1s extensivos que los contenidos
  en el IAS 16 o en el IAS 40.\\n\\n14\\n\\nEcon\u00f3micamente, no hay diferencia
  entre la adquisici\u00f3n de un activo que es financiado por un pr\u00e9stamo asegurado
  por el activo y el arrendamiento en el cual el t\u00edtulo del activo se le transfiere
  al cliente al final del per\u00edodo de arrendamiento.\\n\\n.\\n\\nLos requerimientos
  de contabilidad del arrendador permanecen ampliamente sin modificaci\u00f3n, y algunas
  secciones del IAS 17 han sido llevadas al IFRS 16. Por ejemplo, el IFRS 16.63(a)
  establece que el arrendamiento ser\u00eda un \\\"arrendamiento financiero\\\" si
  al final del arrendamiento el arrendamiento le transfiere arrendatario la propiedad
  del activo 5 El par\u00e1grafo 16.32 tambi\u00e9n establece que el activo arrendado
  tiene que ser depreciado hasta el final de la vida \u00fatil del activo subyacente
  si el arrendamiento al final del arrendamiento le transfiere al arrendatario la
  propiedad del activo subyacente.\\n\\nLa similitud del lenguaje podr\u00eda sugerir
  que la distinci\u00f3n entre un arrendamiento y una adquisici\u00f3n ampliamente
  ha permanecido sin modificaci\u00f3n desde el IAS 17. De otro modo, el IFRS 16 se
  aleja del enfoque de todo el activo hacia el enfoque del derecho-de-uso y hay consecuencias
  asociadas con distinguir entre una compra y un arrendamiento, las cuales el IAS
  17 no ten\u00eda. Esos factores sugieren que esta decisi\u00f3n atraer\u00e1 m\u00e1s
  atenci\u00f3n.\\n\\nArrendamientos versus servicios\\n\\nEl est\u00e1ndar distingue
  entre un arrendamiento y un contrato de servicios. El arrendamiento transfiere al
  cliente el control sobre, algunos aspectos de, un activo. En un contrato de Servicio
  el proveedor usa el activo para prestar el Servicio, y retiene el control de ese
  activo\\n\\nUn ejemplo de un contrato donde la distinci\u00f3n est\u00e1 clara ser\u00eda
  el servicio de limpieza donde el proveedor usa su propio equipo de limpieza. De
  manera similar, una compa\u00f1\u00eda de construcci\u00f3n que contrata a otra
  compa\u00f1\u00eda para excavar el sitio de una edificaci\u00f3n usando el equipo
  del proveedor estar\u00e1 recibiendo un servicio. En contraste, la compa\u00f1\u00eda
  de construcci\u00f3n podr\u00eda alquilar el equipo y usar su propio personal para
  operarlo. Esto ser\u00eda un arrendamiento.\\n\\nContratos de solo servicio\\n\\nLa
  definici\u00f3n de un arrendamiento proporciona los dos factores principales para
  valorar el contrato. Un arrendamiento involucra un activo espec\u00edfico y el cliente
  obtiene el control del derecho a usar ese activo.\\n\\nUn contrato para alquilar
  un contenedor para enviar bienes cada mes durante un per\u00edodo de cinco a\u00f1os
  ser\u00eda un arrendamiento si el contrato se relaciona con un contenedor espec\u00edfico
  y usted tendr\u00eda el derecho a usar ese contenedor como como lo considere conveniente.
  6 Si el contrato le permite al proveedor escoger un contenedor que se adapte a cada
  env\u00edo es m\u00e1s probable que sea un contrato de servicios.\\n\\nEn el sector
  de transporte es com\u00fan usar \\\"arrendamientos con tripulaci\u00f3n\\\" \u2013
  acuerdos donde el proveedor proporciona una aeronave (o un barco), tripulaci\u00f3n
  completa, mantenimiento y seguros. Muchos de tales acuerdos no ser\u00e1n arrendamientos
  tal y como son definidos por el IFRS 16, porque el cliente no controlar\u00e1 el
  activo. En otros casos el cliente estar\u00e1 arrendando un activo y tambi\u00e9n
  participando en un acuerdo de servicio.\\n\\nEsta es un \u00e1rea donde esperamos
  ver los contratos evolucionen para dejar claro si el contrato involucra un activo
  espec\u00edfico y qui\u00e9n controla su derecho-de-uso durante el per\u00edodo
  del contrato.\\n\\nComponentes de servicio\\n\\nNo siempre ser\u00e1 f\u00e1cil
  distinguir entre un acuerdo de servicio y un arrendamiento. La compa\u00f1\u00eda
  de construcci\u00f3n puede contratar el equipo y un operador del equipo proveniente
  de la misma compa\u00f1\u00eda, como parte del mismo contrato. Dependiendo de los
  t\u00e9rminos, el contrato contendr\u00eda un arrendamiento y un servicio o solo
  un servicio. Por consiguiente, usted necesariamente no est\u00e1 decidiendo si el
  contrato es un arrendamiento, sino que usted est\u00e1 considerando si incluye un
  arrendamiento.\\n\\nEl IFRS 16 ofrece un expediente pr\u00e1ctico que le permite
  al arrendatario elegir, por clase de activo subyacente, no separar los componentes
  de noarrendamiento de los componentes de arrendamiento y en lugar de ellos combinarlos
  con los componentes de arrendamiento.\\n\\nSi bien esto puede sonar atractivo en
  t\u00e9rminos de simplicidad, hay circunstancias para las cuales ser\u00eda mejor
  separar los servicios. En la siguiente secci\u00f3n discutiremos esto en relaci\u00f3n
  con las premisas del alquiler.\\n\\nArrendamientos de equipo\\n\\nMuchos arrendamientos
  de equipo para los cuales el contrato establece que no son por la vida econ\u00f3mica
  del activo incluyen un componente de servicio. Por ejemplo, no es inusual que los
  arrendadores sean responsables por recaudar los activos al final del arrendamiento
  y disponer de ellos. El precio de esto ser\u00e1 incluido en el contrato y es una
  de las razones por las cuales la tasa impl\u00edcita en el arrendamiento podr\u00eda
  ser m\u00e1s alta que la tasa incremental de endeudamiento.\\n\\nLa entidad podr\u00eda
  separar ese componente de servicio, pero los beneficios de hacerlo en t\u00e9rminos
  de informaci\u00f3n financiera mejorada es improbable que superen los costos administrativos.\\n\\nNosotros
  esperamos ver que m\u00e1s contratos de ocupaci\u00f3n de locales separen los costos
  de ocupaci\u00f3n de los servicios asociados.\\n\\nLocales\\n\\nPensar acerca de
  los contratos por el derecho para ocupar locales ser\u00e1 importante por dos razones.\\n\\nLa
  primera es que es este tipo de arrendamiento en el cual es probable que se observe
  el mayor impacto en los estados financieros \u2013 el IAS 17 siempre los hab\u00eda
  tratado como arrendamientos operacionales mientras que con el IFRS 16 simplemente
  son otro arrendamiento que resultar\u00e1 en el reconocimiento de los activos arrendados
  y los pasivos de arrendamiento.\\n\\nLa segunda raz\u00f3n es que hay mucho m\u00e1s
  para pensar acerca de cu\u00e1ndo usted reconoce y mide los arrendamientos de locales
  que simplemente aplicar c\u00e1lculos mec\u00e1nicos. Hay decisiones importantes
  acerca de c\u00f3mo contabilizar mejor un contrato para locales y las consecuencias
  que para la informaci\u00f3n financiera tienen esas decisiones podr\u00edan ser
  importantes.\\n\\nMedici\u00f3n del activo arrendado\\n\\nSi bien muchos arrendamientos
  de equipo especifican el precio en efectivo y proporcionan la tasa de inter\u00e9s
  contractual, esta informaci\u00f3n t\u00edpicamente no est\u00e1 especificada en
  los contratos de locales (o en alquileres de equipo de corto plazo, tal y como lo
  explicamos en la p\u00e1gina 18). El IFRS 16 requiere que el pasivo de arrendamiento
  sea medido usando la tasa impl\u00edcita en el arrendamiento. Si esa tasa no puede
  ser determinada f\u00e1cilmente el arrendatario usa su tasa incremental de endeudamiento.
  Los arrendamientos de terreno o locales es probable que sean tales casos.\\n\\nEn
  general, los valores del terreno aumentan. En un simple arrendamiento de terreno,
  si el valor del terreno al final del arrendamiento es m\u00e1s alto que el que era
  al comienzo del arrendamiento ello significa que la cantidad depreciable es negativa.
  Mec\u00e1nicamente, los c\u00e1lculos usando la tasa impl\u00edcita en el arrendamiento
  resultan en que todos los pagos sean clasificados como gastos por intereses. Las
  entidades racionalmente no prestar\u00edan fondos para alquilar terreno a la tasa
  implicada por esos c\u00e1lculos.\\n\\nLos arrendamientos de locales son m\u00e1s
  complicados porque algunos de los pagos para tener acceso a los locales compensar\u00e1n
  al propietario por el uso del terreno. Y la edificaci\u00f3n misma mantendr\u00eda
  su valor durante el per\u00edodo de arrendamiento.\\n\\nNosotros esperamos ver que
  muchas entidades calculen los pasivos por los arrendamientos de locales usando la
  tasa incremental de endeudamiento m\u00e1s que la tasa impl\u00edcita en el arrendamiento.
  La actualizaci\u00f3n del proyecto producida por el personal de IASB en marzo de
  2015 incluy\u00f3 ejemplos que involucran locales, usando una tasa de descuento
  asumida del 5 por ciento. Si bien los ejemplos no se\u00f1alan porqu\u00e9 fue usada
  esta tasa, de manera realista solo puede haber reflejado la tasa incremental de
  endeudamiento.\\n\\nComponentes de no-arrendamiento\\n\\nSi usted posee una edificaci\u00f3n
  y contrat\u00f3 con un tercero para que se ocupe del mantenimiento y la seguridad
  usted no capitalizar\u00e1 el contrato o reconocer\u00eda el pasivo. Ser\u00eda
  un contrato ejecutorio. Con una base similar, el IFRS 16 requiere que si un componente
  del contrato de locales se relaciona con servicios entonces esos servicios deben
  ser separados del contrato y contabilizados por separado.\\n\\nAlgunos costos, tales
  como impuestos a la propiedad, no ser\u00edan incluidos en el costo de una propiedad
  si usted la posee. Si el contrato para arrendar locales especifica que los pagos
  incluyen cantidades para compensar al propietario por los impuestos anuales a la
  propiedad, usted necesitar\u00e1 considerar si hacen parte del arrendamiento o si
  son un pago separado por servicios.\\n\\nEn algunos casos parte del pago se relacionar\u00e1
  con especio compartido o com\u00fan. Por ejemplo, alquilar dos pisos en una edificaci\u00f3n
  de varios pisos requerir\u00e1 compartir el vest\u00edbulo, los ascensores y otras
  \u00e1reas comunes. Usted no puede controlar el espacio compartido. La implicaci\u00f3n
  es que los pagos que de manera clara est\u00e9n relacionados con espacio o instalaciones
  compartidas podr\u00edan ser componentes de noarrendamiento del contrato.\\n\\nEl
  IFRS 16 proporciona un expediente pr\u00e1ctico que le permite a la entidad tratar
  los servicios y los otros componentes de no-arrendamiento como parte del arrendamiento.
  Si usted desea aprovechar de ese expediente pr\u00e1ctico ello ser\u00e1 una decisi\u00f3n
  importante.\\n\\nSu capacidad para identificar y medir los componentes de servicio
  de un contrato de locales depender\u00e1 de qu\u00e9 tan claramente est\u00e9n identificados
  en el contrato. Nosotros hemos visto contratos con fijaci\u00f3n separada del precio
  de esos componentes, pero en otros casos requerir\u00e1 juicio para separar los
  componentes.\\n\\nNosotros esperamos ver que m\u00e1s contratos de ocupaci\u00f3n
  de locales separen los pagos relacionados con controlar espacio especificado, de
  los servicios asociados y los componentes de no-arrendamiento.\\n\\nSeparar los
  componentes de no-arrendamiento reduce las cantidades reconocidas como el activo
  arrendado y el pasivo de arrendamiento. Tambi\u00e9n da un perfil m\u00e1s suave
  del gasto, pero el gasto relacionado con los componentes de noarrendamiento se clasifica
  como de operaci\u00f3n.\\n\\nEjemplo\\n\\nPara ilustrar las potenciales diferencias
  en los resultados de la informaci\u00f3n financiera, sup\u00f3ngase un negocio que
  tiene un contrato no-cancelable que le da el derecho a ocupar dos pisos de una edificaci\u00f3n
  por 10 a\u00f1os por un alquiler anual de \u00a3750,000. Este ser\u00eda un arrendamiento
  operacional en el IAS 17 con el alquiler incluido en gastos de operaci\u00f3n.\\n\\nEl
  contrato identifica servicios tales como seguridad y limpieza, los cuales se incluyen
  en el cargo anual por alquilar. Los costos de esos servicios se especifica que son
  \u00a3225,000 del cargo anual de \u00a3750,000.\\n\\nReconocimiento y medici\u00f3n
  inicial\\n\\nPara reconocer el activo arrendado usando la tasa impl\u00edcita contenida
  en el arrendamiento usted necesita determinar qu\u00e9 tanto del valor del activo
  es consumido durante el per\u00edodo de 10 a\u00f1os. Para este ejemplo hemos asumido
  que son \u00a33.5m, que corresponde a la mitad del total de los pagos de arrendamiento.
  Para el activo que mantiene su valor es probable que supere el nivel actual de consumo.
  Incluso a esta cantidad depreciable \\\"conservadora\\\" la tasa de inter\u00e9s
  impl\u00edcita se trata de solo el 17%.\\n\\nLa tasa incremental de endeudamiento
  de la entidad es 4%.\\n\\nUsando estos datos, las cantidades reconocidas al inicio
  ser\u00edan las que se muestran en la gr\u00e1fica siguiente. La barra denominada
  \\\"tasa incremental de endeudamiento\\\" asume que la entidad ha decidido no separar
  el componente de servicio. La barra denominada \\\"Separaci\u00f3n de servicios\\\"
  muestra el costo neto implicado del activo usando la tasa incremental de endeudamiento
  luego que el componente de servicio haya sido separado de los pagos. La barra para
  la tasa impl\u00edcita contenida en el arrendamiento muestra el rango potencial
  de cantidades que podr\u00edan ser reconocidas inicialmente como un activo, dependiendo
  de los supuestos que se hagan. Los c\u00e1lculos para el resto de la ilustraci\u00f3n
  asumen una cantidad inicial de \u00a33.5m. Tal y como hemos enfatizado, el uso de
  la tasa impl\u00edcita contenida en el arrendamiento probablemente no es pr\u00e1ctico
  para muchos arrendamientos de propiedad. Se incluye aqu\u00ed para completitud.\\n\\n16\\n\\nInicial
  de activos y pasivos\\n\\narrendamiento\\n\\nMedici\u00f3n susiguiente\\n\\nLos
  patrones de los gastos para los tres enfoques se muestran en la siguiente gr\u00e1fica.
  Dado que la tasa impl\u00edcita contenida en el arrendamiento tiene una tasa de
  inter\u00e9s implicada m\u00e1s alta el gasto se acelera. El uso de la tasa incremental
  de endeudamiento asigna m\u00e1s del costo a la depreciaci\u00f3n por l\u00ednea
  recta. Separar el componente de servicio da un perfil m\u00e1s favorecedor del gasto
  a causa de que el inter\u00e9s es calculado sobre un pasivo de arrendamiento m\u00e1s
  bajo.\\n\\nPatr\u00f3n del gasto\\n\\nIFRS 16 \u2013 Tasa impl\u00edcita\\n\\nIFRS
  17 \u2013 Tasa incremental\\n\\nIFRS 16 \u2013 Separaci\u00f3n del\\n\\nIAS 17\\n\\ncontenida
  en el arrendamiento de endeudamiento\\n\\ncomponente de servicio\\n\\nLa separaci\u00f3n
  entre gastos operacionales y gastos por intereses es resaltada en seguida, para
  los dos casos extremos.\\n\\nResumen\\n\\nNosotros pensamos que para los arrendamientos
  de locales la tasa impl\u00edcita es improbable que sea f\u00e1cilmente determinable.
  Y si est\u00e1 claro que si el activo ha mantenido su valor la tasa de inter\u00e9s
  implicada no ser\u00e1 realista.\\n\\nSi bien se requerir\u00eda m\u00e1s trabajo
  para hacer las valoraciones y mantener los registros de contabilidad, separar el
  componente de servicio alinear\u00e1 la contabilidad para los servicios con el contrato
  de servicio en las edificaciones propias.\\n\\nLa principal decisi\u00f3n que usted
  tendr\u00e1 que tomar es si separar los componentes de noarrendamiento. En el ejemplo
  hemos asumidos que esos componentes son claros.\\n\\nArrendamientos de corto plazo\\n\\nEn
  el IFRS 16 est\u00e1 claro que  incluso los contratos de alquiler de corto plazo
  de equipo generalmente contendr\u00e1n un arrendamiento. Alquilar un carro por una
  semana, o incluso por un d\u00eda, usualmente le dar\u00e1 al cliente la capacidad
  para usar un carro espec\u00edfico por el per\u00edodo del arrendamiento. Tambi\u00e9n
  est\u00e1 claro, econ\u00f3micamente, que la cantidad por pagar simplemente no ser\u00e1
  un honorario por el valor del activo consumido m\u00e1s el costo para prestar esa
  cantidad por el per\u00edodo del arrendamiento.\\n\\nLa tasa diaria por contratar
  equipo de jardiner\u00eda puede estar cerca al 25 por ciento del costo de construir
  el activo. Esto \\\"reduce\\\" hasta el 40 por ciento del alquiler durante una semana.
  Alg\u00fan equipo de AV que hemos examinado, que ten\u00eda una garant\u00eda de
  dos a\u00f1os que hemos usado como aproximado conservador para su vida \u00fatil,
  ten\u00eda una tasa diaria de contrataci\u00f3n igual a cerca del 7 por ciento del
  precio en efectivo para poseer el activo.\\n\\nUna proporci\u00f3n grande del pago
  ser\u00e1 por los servicios, y por conveniencia, el cliente obtiene de la contrataci\u00f3n
  m\u00e1s que comprar el activo. El equipo normalmente es \\\"servido\\\" despu\u00e9s
  de cada contrato, el seguro normalmente est\u00e1 incluido en el cargo del contrato
  y el cliente no tiene la responsabilidad de la propiedad durante la vida del activo.
  Tambi\u00e9n, es probable que el activo que est\u00e9 siendo contratado no sea central
  para el negocio del cliente y sea requerido solo para un prop\u00f3sito espec\u00edfico,
  de corto plazo. Presumiblemente estar\u00eda ocioso durante per\u00edodos largos
  de tiempo y el cliente puede no ser capaz de obtener los beneficios provenientes
  del activo. En \u00faltimas, pagar por esta conveniencia es racional.\\n\\nA partir
  de las observaciones de las tarifas de contrataci\u00f3n que a m\u00e1s corto el
  t\u00e9rmino del arrendamiento en relaci\u00f3n con la vida del activo, m\u00e1s
  peque\u00f1a la porci\u00f3n del total del alquiler por pagar que probablemente
  se relacionar\u00e1 con el arrendamiento y m\u00e1s grande ser\u00e1 la porci\u00f3n
  para los componentes de noarrendamiento. Ciertamente no puede ser atribuido a un
  cargo financiero.\\n\\nAplicaci\u00f3n de la exenci\u00f3n de corto plazo\\n\\nEstrictamente
  hablando,  el IFRS 16 requiere que el cliente compare el componente de servicio
  del arrendamiento del activo. Si  bien ello sea factible, ser\u00eda costoso implementar
  y confiar en algunos supuestos fuertes. La contabilidad resultante probablemente
  ser\u00eda un valor bajo del activo de arrendamiento y un gasto muy bajo por intereses.
  La porci\u00f3n m\u00e1s grande del costo ser\u00eda el componente de servicio y
  la informaci\u00f3n financiera se parecer\u00eda mucho a un alquiler simple hoy.\\n\\nEl
  IFRS 16 reconoce esto mediante permitir que los arrendatarios elijan contabilizar
  los arrendamientos de 12 meses o menos simplemente mediante llevar el gasto por\\n\\n18\\n\\nalquiler.
  Tal y como hemos observado en la p\u00e1gina 5, la exenci\u00f3n est\u00e1 disponible
  sin ninguna necesidad de valorar la materialidad.\\n\\nLa aplicaci\u00f3n de la
  exenci\u00f3n de corto plazo mueve (o mantiene) esos balances fuera del balance
  general y tiene un perfil m\u00e1s suave del gasto, pero el gasto es clasificado
  como de operaci\u00f3n.\\n\\nOtros problemas\\n\\nVenta y retro-arrendamiento\\n\\nUn
  m\u00e9todo com\u00fan para conseguir el tratamiento fuera del balance general ha
  sido vender un activo y luego volver a arrendarlo seg\u00fan un acuerdo de arrendamiento
  operacional. Con el nuevo est\u00e1ndar esa oportunidad desaparece.\\n\\nEl IFRS
  16 interact\u00faa con el IFRS 15 Ingresos ordinarios derivados de contratos con
  los clientes. Para que una venta sea reconocida el arrendador (i.e. el comprador)
  tiene que controlar el activo tal y como se establece en el IFRS 15. Como el vendedor
  usted reconocer\u00eda cualquier ganancia o p\u00e9rdida en la venta, pero solo
  en la extensi\u00f3n en que se relacione con los derechos que el comprador mantenga
  al final del per\u00edodo de arrendamiento.\\n\\nUsted tambi\u00e9n reconoce el
  activo asociado con el retro-arrendamiento, siendo el derecho a usar el activo.
  Es medido como la proporci\u00f3n del anterior valor en libros del activo que usted
  est\u00e1 reteniendo.\\n\\nModificaciones del arrendamiento\\n\\nSi usted modifica
  un arrendamiento usted necesitar\u00e1 determinar si usted tiene un arrendamiento
  nuevo, separado, o si usted est\u00e1 cambiando un arrendamiento existente.\\n\\nUsted
  tendr\u00e1 un activo nuevo, separado, si usted incrementa el alcance del contrato
  mediante adicionar el derecho a usar uno o m\u00e1s activos subyacentes, y por una
  cantidad proporcional incrementa la consideraci\u00f3n por pagar. Un ejemplo ser\u00eda
  adicionar un nuevo piso a un contrato existente para ocupar locales. Usted simplemente
  tiene un nuevo pasivo de arrendamiento y un nuevo activo arrendado por ese piso
  adicional.\\n\\nSi la modificaci\u00f3n es un cambio a los t\u00e9rminos existentes
  de un arrendamiento usted necesitar\u00e1 remedir el pasivo de arrendamiento mediante
  descontar los pagos de arrendamiento revisados usando la tasa de descuento revisada
  durante el per\u00edodo restante de arrendamiento. Si la modificaci\u00f3n es una
  terminaci\u00f3n parcial, o completa, del arrendamiento (i.e. reduce su alcance)
  usted reconoce la ganancia o p\u00e9rdida. Si la modificaci\u00f3n incrementa el
  alcance (e.g. la duraci\u00f3n del per\u00edodo de arrendamiento) o las cantidades
  por pagar, usted ajusta el activo de derecho-de-uso.\\n\\nTransici\u00f3n\\n\\nComo
  arrendatario usted est\u00e1 requerido a reconocer un pasivo y un pasivo por cada
  uno de sus arrendamientos, sea previamente han sido clasificados por el IAS 17 como
  un arrendamiento financiero o un arrendamiento operacional. Al hacerlo, usted puede
  elegir aplicar la contabilidad retrospectiva plena, lo cual significa que usted
  ir\u00eda atr\u00e1s y re-valorar\u00eda todos los contratos como si el IFRS 16
  siempre hubiera estado siendo aplicado.\\n\\nSin embargo, el est\u00e1ndar ofrece
  concesiones en la transici\u00f3n que usted puede elegir aplicar, en la extensi\u00f3n
  que usted las aplique a todos los arrendamientos. Si usted aprovecha las concesiones
  de transici\u00f3n usted no re-emite la informaci\u00f3n comparativa. En lugar de
  ello, cualquier efecto acumulado de reconocer el pasivo y el activo de arrendamiento
  en la transici\u00f3n es ajustado contra el saldo de apertura de ganancias retenidas.\\n\\nAlivio
  de transici\u00f3n\\n\\nDefinici\u00f3n de un arrendamiento\\n\\nUsted no tiene
  que revalorar si los contratos contienen arrendamientos si particip\u00f3 en ellos
  o los modific\u00f3 antes de la fecha de la aplicaci\u00f3n inicial. En lugar de
  ello usted puede confiar en su aplicaci\u00f3n del IAS 17 a esos contratos. La transici\u00f3n
  hacia el nuevo est\u00e1ndar de cualesquiera arrendamientos financieros u operacionales
  usando el alivio especial para la transici\u00f3n se describe a continuaci\u00f3n.\\n\\nArrendamientos
  previamente clasificados como arrendamientos financieros\\n\\nPara los arrendamientos
  que usted haya clasificado como arrendamientos financieros de acuerdo con el IAS
  17 usted simplemente puede elegir usar los valores en libros del activo de arrendamiento
  y del pasivo de arrendamiento a la fecha de la aplicaci\u00f3n inicial como las
  cantidades de la transici\u00f3n. Entonces usted aplica a esas cantidades los requerimientos
  de la contabilidad subsiguiente contenidos en el IFRS 16.\\n\\nArrendamientos previamente
  clasificados como arrendamientos operacionales\\n\\nUsted est\u00e1 requerido a
  reconocer un pasivo de arrendamiento y un activo de arrendamiento por cada uno de
  sus arrendamientos operacionales. El alivio de transici\u00f3n se relaciona con
  c\u00f3mo se calculan las cantidades.\\n\\nEl pasivo puede ser medido al valor presente
  de los pagos de arrendamiento restantes descontados usando su tasa incremental de
  endeudamiento a la fecha de la aplicaci\u00f3n inicial.\\n\\nHay dos simplificaciones
  para los activos. Usted puede escoger medir el activo a su valor en descuento basada
  en su tasa incremental de endeudamiento a la fecha de la aplicaci\u00f3n inicial.
  O usted puede escoger reconocer el activo a una cantidad igual al pasivo de arrendamiento,
  ajustada por los pagos de arrendamiento pagados por anticipado o causados reconocidos
  en relaci\u00f3n con ese arrendamiento.\\n\\nCuando descuenta para medir ya sea
  el pasivo o el activo usted puede escoger aplicar una sola tasa de descuento para
  un portafolio de arrendamientos con caracter\u00edsticas razonablemente similares.\\n\\nSi
  usted tiene arrendamientos que terminan dentro de 12 meses a partir de la fecha
  inicial de la aplicaci\u00f3n usted puede elegir contabilizar esos arrendamientos
  de la misma manera que como arrendamientos de corto plazo \u2013 esto cubre los
  arrendamientos con un per\u00edodo de arrendamiento de menos de 12 meses as\u00ed
  como tambi\u00e9n los arrendamientos de corto plazo con menos de 12 meses para funcionar.\\n\\nUsted
  puede escoger confiar en las provisiones para arrendamientos onerosos previamente
  reconocidas m\u00e1s que realizar una revisi\u00f3n separada por deterioro. Usted
  tambi\u00e9n puede escoger, de la medici\u00f3n del activo arrendado, excluir los
  costos directos iniciales y usar la retrospectiva, tal como en la determinaci\u00f3n
  del t\u00e9rmino del arrendamiento si el contrato contiene opciones para extender
  o terminar el arrendamiento.\\n\\nCantidades previamente reconocidas con relaci\u00f3n
  a combinaciones de negocios\\n\\nSi usted previamente ha reconocido un activo o
  un pasivo de acuerdo con el IFRS 3 Combinaciones de negocios en relaci\u00f3n con
  t\u00e9rminos favorables o desfavorables de un arrendamiento operacional adquirido
  como parte de una combinaci\u00f3n de negocios, usted necesitar\u00e1 des-reconocer
  ese activo o pasivo, ajustando el valor en libros del activo de derecho-de-uso.\\n\\nRevelaci\u00f3n\\n\\nSi
  usted usa o no las concesiones de transici\u00f3n usted necesitar\u00e1 cumplir
  con los requerimientos generales contenidos en el IAS 8 Pol\u00edticas de contabilidad,
  cambios en estimados de contabilidad y errores, tal como revelar la naturaleza del
  cambio y cu\u00e1les determinaciones para la transici\u00f3n us\u00f3 usted.\\n\\nSin
  embargo, usted no est\u00e1 requerido a revelar el efecto que el cambio tiene en
  cada elemento de l\u00ednea afectado del estado financiero, para el per\u00edodo
  actual y anterior. En lugar de ello usted tiene que dar el promedio ponderado de
  la tasa incremental de endeudamiento que usted us\u00f3 para medir los activos y
  pasivos de arrendamiento en la transici\u00f3n, y una explicaci\u00f3n de cualquier
  diferencia entre los compromisos de arrendamiento operacional que usted report\u00f3
  al final del per\u00edodo anual de presentaci\u00f3n de reporte que precede a la
  fecha de la aplicaci\u00f3n inicial descontado usando la tasa incremental de endeudamiento
  a la fecha de la transici\u00f3n y el pasivo que usted reconoci\u00f3 en la transici\u00f3n
  por esos arrendamientos.\\n\\nContabilidad del arrendador \u2013 implicaciones\\n\\nCuando
  IASB, y FASB, estuvieron desarrollando el nuevo est\u00e1ndar propusieron cambios
  a los requerimientos para la contabilidad tanto del arrendatario como del arrendador.
  La retroalimentaci\u00f3n que IASB recibi\u00f3 \\\"se\u00f1al\u00f3 que no era
  esencial tener modelos sim\u00e9tricos de la contabilidad del arrendatario y del
  arrendador.\\\" Ambas juntas decidieron no hacer, por razones de costo-beneficio,
  cambios a la contabilidad del arrendador.\\n\\nDe acuerdo con ello, IASB ha mantenido
  para los arrendadores la distinci\u00f3n arrendamiento financiero \u2013 arrendamiento
  operacional, y ha trasladado al IFRS 16 los requerimientos relacionados que se establecen
  en el IAS 17. Sin embargo, IASB adicion\u00f3 al arrendador requerimientos de revelaci\u00f3n
  acerca de la exposici\u00f3n ante el riesgo de valor residual.\\n\\ndiscuten la
  contabilidad del arrendador, tambi\u00e9n es \u00fatil en la identificaci\u00f3n
  de los componentes de un contrato contenido en el IFRS 16 de manera m\u00e1s general.
  El an\u00e1lisis tiene implicaciones para c\u00f3mo el arrendatario puede pensar
  acerca de los contratos de propiedad. Si el arrendatario es capaz de demostrar claramente
  que un contrato tiene componentes que se relacionan con un activo separado, activos
  y servicios compartidos, solo la parte del contrato relacionada con el activo dar\u00eda
  satisfacci\u00f3n a la definici\u00f3n de un arrendamiento. Usted no controla un
  activo que usted comparte con otros.\\n\\nMantener los requerimientos y el lenguaje
  usado en el IAS 17 para la contabilidad del arrendador crea algunas tensiones con
  los nuevos requerimientos contenidos en el IFRS 16. As\u00ed como tambi\u00e9n la
  retenci\u00f3n m\u00e1s obvia de las categor\u00edas de arrendamiento financiero
  y operacional, los requerimientos del arrendador usan el lenguaje de riesgos y de
  todo-el-activo contenido en el IAS 17. Los requerimientos diferentes son compa\u00f1eros
  inc\u00f3modos.\\n\\nTerreno y edificaciones\\n\\nDe particular inter\u00e9s es
  el efecto  del lenguaje acerca de terrenos y edificaciones mantenido a partir del
  IAS 17. Esas palabras dejan claro que el contrato relacionado con ocupar un edificio
  y el terreno en el cual se ubica la edificaci\u00f3n tendr\u00e1n, al menos dos,
  componentes. El pago relacionado con el terreno proporcionar\u00e1 un retorno sobre
  el terreno mientras que el pago por la edificaci\u00f3n proporcionar\u00e1 un retorno
  as\u00ed como tambi\u00e9n compensaci\u00f3n por el valor de la edificaci\u00f3n
  consumida, si hay cualquier consumo.\\n\\nEn el IAS 17 la distinci\u00f3n entre
  consumo del activo y el retorno para el arrendador ten\u00eda implicaciones pr\u00e1cticas
  limitadas. Tales contratos eran, invariablemente, clasificados como arrendamientos
  operacionales con el arrendatario reconociendo el gasto por alquiler y el arrendador
  reconociendo el ingreso por alquiler. En contraste, el IFRS 16 llevar\u00e1 a que
  el arrendador contabilice los ingresos por alquiler del terreno mientras que la
  mec\u00e1nica de los requerimientos del arrendatario obligan al arrendatario a separar
  el retorno para el arrendador en la depreciaci\u00f3n, con base en si la cantidad
  hab\u00eda sido calculada como el terreno arrendado, y los gastos por intereses.\\n\\nImplicaciones
  para los arrendatarios\\n\\nSi bien el an\u00e1lisis del terreno y la edificaci\u00f3n
  se incluye en las secciones del IFRS 16 que\\n\\nEn una edificaci\u00f3n con m\u00faltiples
  arrendamientos usted puede arrendar un piso, al cual usted tiene acceso exclusivo.
  Si algunos de los pagos contractuales que usted est\u00e1 haciendo se relacionan
  con espacio com\u00fan contenido en la edificaci\u00f3n que es compartido con otros,
  esos pagos podr\u00edan estar fuera del alcance del IFRS 16.\\n\\nSi usted controla
  toda la edificaci\u00f3n es probable que usted controle el acceso al terreno en
  el cual est\u00e1 ubicada, por virtud de su acceso a la edificaci\u00f3n. Sin embargo,
  si usted es un inquilino en una edificaci\u00f3n con m\u00faltiples arrendamientos,
  ninguno de los inquilinos es probable que controle el terreno.\\n\\nNo hay prueba
  de confiabilidad para separar los componentes de un contrato. Usted solo est\u00e1
  requerido a maximizar el uso de la informaci\u00f3n que sea observable. Usted puede
  escoger empaquetarlos y tratarlos seg\u00fan un arrendamiento usando el expediente
  pr\u00e1ctico, pero podr\u00eda haber incentivos para contabilizar los componentes
  por separado.\\n\\nDoble conteo\\n\\nLa retenci\u00f3n de la contabilidad del arrendador
  tambi\u00e9n significa que habr\u00e1 alg\u00fan doble conteo de activos a trav\u00e9s
  de las entidades. Si el arrendador ha concluido que ha arrendado un activo seg\u00fan
  un arrendamiento operacional, el arrendador mantiene todo el activo en sus libros.
  Al mismo tiempo el arrendatario tambi\u00e9n reconocer\u00e1 su derecho a usar el
  activo.  En esa extensi\u00f3n, habr\u00e1 algunos activos reconocidos en dos conjuntos
  de libros.\\n\\nEl doble conteo ser\u00e1 m\u00e1s notorio para los arrendamientos
  de corto plazo, tales como los arrendamientos de veh\u00edculos de ejecutivos, arrendamientos
  de activos de larga vida tales como aeronaves, barcos y equipo de construcci\u00f3n
  y exploraci\u00f3n, y arrendamientos de propiedad.\\n\\n21\\n\\nUS GAAP\\n\\nTal
  y como mencionamos en la introducci\u00f3n, si bien IASB y FASB trabajaron juntos
  con el objetivo de desarrollar los mismos requerimientos no lograron ello para todos
  los arrendamientos. Las principales diferencias se relacionan con los arrendamientos
  que hoy en los US GAAP son arrendamientos operacionales.\\n\\nMientras que el IFRS
  16 no diferencia entre un arrendamiento operacional y un arrendamiento financiero
  para un arrendatario, esa distinci\u00f3n permanecer\u00e1 en los US GAAP. La contabilidad
  para los arrendamientos financieros es similar al enfoque que el IFRS 16 usa para
  todos los arrendamientos \u2013 con un cargo financiero y depreciaci\u00f3n del
  activo arrendado, si bien los requerimientos de los US GAAP se refieren a esto como
  amortizaci\u00f3n.\\n\\nLos arrendamientos operacionales tambi\u00e9n ser\u00e1n
  llevados al balance general, inicialmente medidos de la misma manera que como seg\u00fan
  el IFRS 16. Sin embargo, un solo gasto por arrendamiento operacional ser\u00e1 reconocido
  sobre una base de l\u00ednea recta durante el t\u00e9rmino del arrendamiento. La
  medici\u00f3n por l\u00ednea recta es lograda mediante tener la amortizaci\u00f3n
  impl\u00edcita del activo arrendado acelerada durante el t\u00e9rmino del arrendamiento
  de manera que cuando sea combinada con el inter\u00e9s impl\u00edcito en el pasivo
  de arrendamiento el total sea el mismo en cada per\u00edodo de presentaci\u00f3n
  de reporte. Ese gasto \u00fanico es un gasto operacional, m\u00e1s que intereses
  y depreciaci\u00f3n (amortizaci\u00f3n). Los flujos de efectivo relacionados ser\u00e1n
  incluidos en las actividades de operaci\u00f3n.\\n\\nFASB tambi\u00e9n ha cambiado
  c\u00f3mo la entidad clasifica los arrendamientos en financieros y operacionales,
  haci\u00e9ndolo mediante adoptar un enfoque basado en los criterios de clasificaci\u00f3n
  del arrendamiento contenidos en el IAS 17. Esto significa que algunos arrendamientos
  que ser\u00edan clasificados como arrendamientos operacionales seg\u00fan los requerimientos
  de los US GAAP que est\u00e9n siendo reemplazados podr\u00edan ser clasificados
  como arrendamientos financieros cuando los requerimientos se vuelvan efectivos.\\n\\n22\\n\\nLos
  diferentes requerimientos principalmente afectan la oportunidad de los gastos de
  arrendamiento relacionados y d\u00f3nde se presentan en el estado de ingresos. El
  gasto de arrendamiento calculado usando los requerimientos de FASB no ser\u00e1
  cargado por anticipado como en el enfoque del IFRS 16. Pero el gasto ser\u00e1 parte
  de las actividades de operaci\u00f3n en lugar que depreciaci\u00f3n e intereses.
  El balance general tambi\u00e9n es afectado, con el activo de derecho de uso probablemente
  ser mayor seg\u00fan los requerimientos de FASB, reflejando el reconocimiento m\u00e1s
  lento del gasto relacionado. El an\u00e1lisis de los efectos de IASB sugiere que
  trillones de d\u00f3lares de activos caer\u00e1n en esta categor\u00eda.\\n\\nEl
  modelo de FASB no incluye la exenci\u00f3n del activo de valor bajo, de manera que
  m\u00e1s activos y pasivos ser\u00e1n reconocidos en el balance general.\\n\\nEn
  la mayor\u00eda de las otras materias los est\u00e1ndares est\u00e1n alineados.
  Las juntas trabajaron juntas para limitar las diferencias en las definiciones y
  otros requerimientos.\\n\\nSi bien hay diferencias entre los requerimientos para
  los que hoy son arrendamientos operacionales, las diferencias son deliberadas m\u00e1s
  que por desacuerdo en la redacci\u00f3n. Nosotros tenemos esperanza que las juntas
  monitoreen esto y revisen sus est\u00e1ndares juntas, en vistas a ver si pueden
  eliminar las diferencias. A m\u00e1s cercanos puedan estar los requerimientos m\u00e1s
  comparables pueden ser los estados financieros.\\n\\nExplicando las implicaciones\\n\\nC\u00f3mo
  los nuevos requerimientos del arrendamiento afectan su negocio obviamente depender\u00e1
  de la mezcla de acuerdos de arrendamiento que est\u00e9 en funcionamiento. Pero
  tambi\u00e9n depender\u00e1 de c\u00f3mo usted aplica el est\u00e1ndar \u2013 qu\u00e9
  exenciones o expedientes pr\u00e1cticos usted elige aplicar.\\n\\nHable con sus
  prestamistas\\n\\nLo que ser\u00e1 importante es que a mayores sean los probables
  cambios a sus estados financieros m\u00e1s importante es que usted comience a se\u00f1alar
  esos cambios a quienes conf\u00edan m\u00e1s en sus estados financieros \u2013 particularmente
  inversionistas y prestamistas.\\n\\nHable con sus inversionistas\\n\\nCuando IASB
  estuvo desarrollando sus propuestas algunos cr\u00edticos reclamaron que los cambios
  no eran necesarios, porque los inversionistas ya estaban ajustando el apalancamiento
  usando el m\u00faltiplo de la \\\"regla-de-oro\\\" del gasto por arrendamiento operacional.
  Sin embargo, IASB encontr\u00f3, mediante el an\u00e1lisis de datos individuales
  de las compa\u00f1\u00edas, que si bien el ajuste de la regla-de-oro funciona \\\"en
  promedio\\\" exagera el apalancamiento en algunos casos y lo subestima en otros.\\n\\nTal
  y como hemos demostrado, el efecto actual reflejar\u00e1 la duraci\u00f3n y el costo
  de los arrendamientos as\u00ed como tambi\u00e9n c\u00f3mo usted aplica las exenciones
  y los expedientes pr\u00e1cticos. Dado que las implicaciones de la informaci\u00f3n
  financiera ser\u00e1n espec\u00edficas para cada entidad, es importante que usted
  comience a explicar a los inversionistas c\u00f3mo el nuevo est\u00e1ndar es probable
  que afecte sus estados financieros.\\n\\nUsted necesitar\u00e1 explicar los cambios
  en los per\u00edodos previos al 2019 en sus estados financieros, como parte de satisfacer
  los requerimientos contenidos en el IAS 8 Pol\u00edticas de contabilidad, cambios
  en estimados de contabilidad y errores en relaci\u00f3n con los pr\u00f3ximos cambios
  a los IFRS.\\n\\nEn sus valoraciones de las entidades los prestamistas, y las agencias
  calificadoras, generalmente factorizan los arrendamientos operacionales no-cancelables.
  Sin embargo, c\u00f3mo los arrendamientos operacionales, y los nuevos arrendamientos,
  se convierten en pasivos de arrendamiento y activos arrendados no siempre estar\u00e1
  alineado con las expectativas de sus prestamistas. Adicionalmente, algunos contratos
  con prestamistas pueden referirse a cifras espec\u00edficas de contabilidad que
  podr\u00edan cambiar cuando usted aplique el IFRS 16.\\n\\nEl ejemplo obvio es que
  los pasivos reconocidos es probable que se incrementen. Pero hay otros cambios que
  podr\u00edan ser importantes, tal como el cambio de los gastos desde de operaci\u00f3n
  (i.e. alquiler) hacia financiaci\u00f3n. Esto podr\u00eda afectar las ratio de cobertura
  de intereses.\\n\\nSer\u00e1 importante que usted valore c\u00f3mo las cifras derivadas
  de los IFRS usadas en los contratos con prestamistas ser\u00e1n afectadas por el
  IFRS 16, y discuta esos cambios con sus prestamistas.\\n\\nResumen\\n\\nLos nuevos
  requerimientos de los arrendamientos cambiar\u00e1n c\u00f3mo pensamos acerca de
  los arrendamientos. Tal y como lo hemos se\u00f1alado en esta publicaci\u00f3n,
  el cambio en el pensamiento que subyace a la contabilidad del arrendamiento tiene
  implicaciones importantes para la interpretaci\u00f3n de los nuevos requerimientos
  y para c\u00f3mo usted elige aplicarlos.\\n\\nEl IFRS 16 contiene varios expedientes
  pr\u00e1cticos que ofrecen contabilidad simplificada. Pero algunos de esos expedientes
  acelerar\u00e1n el reconocimiento del gasto e incrementar\u00e1n la deuda reportada.
  Otros dar\u00e1n un perfil m\u00e1s suave de los ingresos y menor deuda reportada,
  pero cambian los gastos relacionados del arrendamiento desde intereses y depreciaci\u00f3n
  hacia los costos de la operaci\u00f3n central (reduciendo el EBITDA).\\n\\nEsto
  no se refiere a manipular la contabilidad para lograr un resultado particular de
  informaci\u00f3n financiera. Son selecciones libres que est\u00e1n disponibles para
  las entidades, sin carga para valorar si crea una diferencia material para la informaci\u00f3n
  financiera.\\n\\nTal y como lo ilustra la tabla que aparece a continuaci\u00f3n,
  hay intercambios entre los efectos de la aplicaci\u00f3n de esos expedientes en
  el estado de ingresos y en el balance general.\\n\\nClave y explicaci\u00f3n\\n\\nEBITDA
  = earnings before interest, tax, depreciation and amortisation [ganancias antes
  de intereses, impuestos, depreciaci\u00f3n y amortizaci\u00f3n]\\n\\nNPBT = net
  profit before tax [utilidad neta antes de impuestos]\\n\\nEBIT = earnings before
  interest and tax [ganancias antes de intereses e impuestos]\\n\\n\u2191 significa,
  por ejemplo, que el EBITDA generalmente ser\u00e1 m\u00e1s alto cuando el IFRS 16
  sea aplicado que como lo es a partir de la aplicaci\u00f3n del IAS 17\\n\\nLa econom\u00eda
  de los contratos de arrendamiento\\n\\nEs improbable que veamos que desaparezcan
  los arrendamientos de corto plazo. Permanecer\u00e1n siendo el medio m\u00e1s eficiente
  de contrataci\u00f3n de algunos tipos de activos para entidades particulares. Sin
  embargo, vemos que algunos de los arrendamientos que habr\u00edan estado en el lado
  del arrendamiento operacional del IAS 17 siendo reemplazados por acuerdos de compra
  o por arrendamientos de m\u00e1s largo plazo. De manera similar, algunas entidades
  pueden estar atra\u00eddas a reducir algunos t\u00e9rminos del arrendamiento para
  ganar acceso al expediente del corto plazo o para evitar umbrales de aprobaci\u00f3n
  del desembolso de capital.\\n\\nUno de los factores que a menudo se tienen en cuenta
  cuando se escriben los contratos son los requerimientos de la informaci\u00f3n financiera.
  El IFRS 16 hace m\u00e1s importantes algunos factores que como lo fueron en el IAS
  17, particularmente especificidad del activo, identificaci\u00f3n de los componentes
  de arrendamiento y cualesquiera opciones de renovaci\u00f3n o terminaci\u00f3n.\\n\\n10
  preguntas que usted se debe hacer\\n\\n1 \u00bfTiene usted cualesquiera contratos
  que dependan de estados financieros IFRS? Si los tiene, \u00bfusted ha hecho planes
  con esas partes para discutir c\u00f3mo sus estados financieros cambiar\u00e1n cuando
  los nuevos requerimientos de los arrendamientos tengan efecto?\\n2 \u00bfCu\u00e1ndo
  usted est\u00e1 planeando discutir con los inversionistas las implicaciones del
  IFRS 16 \u2013 en los estados financieros y en las sesiones informativas con los
  analistas?\\n3 \u00bfSus sistemas son capaces de hacerle seguimiento a los arrendamientos
  individuales?\\n4 \u00bfEs probable que usted aproveche la exenci\u00f3n del corto
  plazo como pol\u00edtica general, o hay algunas clases de activos para los cuales
  usted piensa que ser\u00eda mejor no usar la exenci\u00f3n?\\n5 \u00bfPiensa usted
  que es probable que usted aproveche la exenci\u00f3n del valor bajo? \u00bfC\u00f3mo
  usted valorar\u00e1 el l\u00edmite superior para cu\u00e1les activos calificar\u00e1n?\\n6
  \u00bfTiene usted contratos de propiedad que incluyen cantidades por servicios?
  \u00bfQu\u00e9 tan claramente est\u00e1n especificados esos componentes? \u00bfHay
  margen para asegurar que los contratos futuros estar\u00e1n m\u00e1s claramente
  especificados?\\n7 \u00bfC\u00f3mo planea usted valorar el componente de financiaci\u00f3n
  en los arrendamientos de propiedad, dada la dificultad inherente de identificar
  la tasa impl\u00edcita contenida en el arrendamiento?\\n8 \u00bfSus arrendamientos
  tienen cl\u00e1usulas de renovaci\u00f3n? \u00bfUsted ha valorado c\u00f3mo pueden
  ser aplicadas cuando el IFRS se vuelva efectivo?\\n9 \u00bfTiene usted contratos
  que proporcionan acceso a activos que pueden ser dif\u00edciles de clasificar \u2013
  i.e. son un arrendamiento o un servicio?\\n10 \u00bfUsted ha hecho una valoraci\u00f3n
  inicial de la extensi\u00f3n en la cual los arrendamientos operacionales no-cancelables
  es probable que sean reconocidos en la transici\u00f3n hacia el nuevo est\u00e1ndar
  de arrendamientos?\\n\\nNotas finales\\n\\n1. Esta publicaci\u00f3n se centra en
  la contabilidad del arrendatario. La contabilidad para los arrendadores contenida
  en el IFRS 16 permanece ampliamente sin modificaci\u00f3n en relaci\u00f3n con la
  contenida en el IAS 17.\\n2. El t\u00e9rmino \\\"derecho-de-uso\\\" no captura todos
  los derechos que pueden ser transmitidos en un arrendamiento. Algunos arrendamientos
  dan otros derechos, tal como el derecho a usar como garant\u00eda el activo arrendado
  (el derecho a pignorar) o vender los derechos a otras partes.\\n3. IAS 17, par\u00e1grafo
  8.\\n4. Otra manera de expresar esto es que la tasa impl\u00edcita contenida en
