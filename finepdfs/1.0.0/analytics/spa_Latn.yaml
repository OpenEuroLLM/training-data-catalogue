  . 133\\nRebbeca Jones\\n\\n1. Peter Jones en Costa Rica.\\n\\nEn marzo de este a\u00f1o,
  tuvimos la gran oportunidad de recibir a nuestro amado hermano y prol\u00edfico
  autor, el Dr. Peter Jones. Estuvo en Costa Rica, del 7 al 9, ofreciendo una serie
  de conferencias en diversos lugares a lo largo y ancho del pa\u00eds.\\n\\nEl Dr.
  Jones trat\u00f3 varios temas que fueron de suma importancia para la Iglesia. Entre
  ellos, la entrada del paganismo a Occidente, el papel que juega la agenda homosexual
  en el avance del paganismo, y la respuesta que debe ofrecer la Iglesia.\\n\\nEn
  esta ocasi\u00f3n, se present\u00f3 en las Sociedades B\u00edblicas Unidas de Costa
  Rica, donde se dirigi\u00f3 a un grupo de pastores de una gran fraternidad nacional.
  Adem\u00e1s, fue recibido en las instalaciones de Faro del Caribe, una reconocida\\n\\nCONFERENCIA
  POR PARTE DE PETER JONES EN LA IGLESIA PRESBITERIANA DE TEPEYAC\\n\\nemisora radial
  cristiana en este pa\u00eds.\\n\\nTambi\u00e9n dio conferencias para la Iglesia
  Presbiteriana Reformada de Costa Rica en San Jos\u00e9, y para otra fraternidad
  de pastores en Cartago.\\n\\nDR. PETER JONES\\n\\nTras su participaci\u00f3n en
  Costa Rica, Peter Jones sali\u00f3 rumbo a Panam\u00e1 a continuar con m\u00e1s
  conferencias. Esto es un ejemplo y fuente de motivaci\u00f3n, ver como este hermano
  se mantiene activo en la exposici\u00f3n de las verdades b\u00edblicas a pesar de
  estar avanzado en a\u00f1os. Su vida y ministerio son y seguir\u00e1n siendo vitales
  para ayudar a la Iglesia a navegar las aguas actuales con sabidur\u00eda y entendiendo
  los tiempos.\\n\\n2. IEPP: Avanza en el Per\u00fa.\\n\\n1. A trav\u00e9s de la segunda
  congregaci\u00f3n de Cajamarca, la Iglesia evang\u00e9lica presbiteriana del Per\u00fa,
  ha iniciado la plantaci\u00f3n de una tercera congregaci\u00f3n en esta ciudad,
  en el barrio Quiritimayo.\\n\\nA. En el mes de Mayo, el Consistorio de la Segunda
  Congregaci\u00f3n de la IEPP en Cajamarca decidi\u00f3 empezar la tercera congregaci\u00f3n
  en el barrio Quiritimayo de la ciudad de Cajamarca. El Dr. Alonzo Ram\u00edrez,
  uno de los fundadores de PeruMission, ha convocado la cooperaci\u00f3n de\\n\\niglesias
  hermanas de USA para iniciar la edificaci\u00f3n del local para esta nueva obra
  de extensi\u00f3n.\\n\\nB. La Lic. Esther L\u00f3pez de Ram\u00edrez, mi esposa,
  con el apoyo de tres iglesias de USA, hicieron una gran labor evangel\u00edstica
  durante los meses de junio y julio. Como a\u00fan no tenemos local de reuniones,
  la Escuela B\u00edblica de Vacaciones se llev\u00f3 a cabo en una plataforma de
  deportes. Hubo muchos ni\u00f1os y fuimos apoyados por hermanos de la Segunda\\n\\nEl
  presb\u00edtero Luis Santos Mendoza ya ven\u00eda reuni\u00e9ndose en su casa con
  un grupo de ni\u00f1os del barrio. \u00c9l es el responsable principal de esta obra
  de extensi\u00f3n y la familia Ram\u00edrez coopera en la evangelizaci\u00f3n del
  barrio a trav\u00e9s de los ni\u00f1os.\\n\\nIglesia Presbiteriana de USA.\\n\\nDR.
  ALONZO RAM\u00cdREZ Y SU FAMILIA\\n\\nC. Esperamos que, al fin de este a\u00f1o,
  ya tengamos construida la primera sala provisional para las reuniones de los ni\u00f1os
  y los adultos del barrio. Suplicamos a todas la iglesia de nuestra CLIR apoyarnos
  en oraci\u00f3n para que el evangelio de Cristo llegue a los corazones de todo este
  barrio para la gloria de Dios.\\n\\n3. AXIOMA: \u2013 La progresiva historia sobre
  la juventud de la Iglesia Presbiteriana Reformada en San Juan, Puerto Rico\\n\\n\u00bfY
  ahora qu\u00e9 hacemos?\\n\\nLa pregunta que nos hacemos en este siglo en el occidente
  frente a la ola posmoderna. La pregunta que nace de profundos pecados. Pregunta
  que nace de un fundamento sacudido. Pregunta oscura que duda de las palabras de
  nuestro Se\u00f1or cuando dijo: \u201cY yo tambi\u00e9n te digo, que t\u00fa eres
  Pedro, y sobre esta roca edificar\u00e9 mi iglesia; y las puertas del Hades no prevalecer\u00e1n
  contra ella.\u201d (Mateo 16:18). Hemos sido pasivos para ser sal en la cultura
  y los imp\u00edos lo han aprovechado. La religi\u00f3n Atea ha repartido su fe en
  el vac\u00edo por medio de sus profetas materialistas. La filosof\u00eda homosexual
  mediante sus pautas que nos predicen que el hombre puede definir realidades seg\u00fan
  su imaginaci\u00f3n,\\n\\nhan tomado el dominio. La pregunta corta nuestra conciencia
  y nos impulsa a buscar supuestas \u201cnuevas alternativas\u201d a la verdad que
  trascender\u00e1 hasta estos tiempos de breve oscuridad. La pregunta solo denota
  una rama del problema. Como buscar sacar el agua de un barco que se hunde, estamos
  tratando de resolver consecuencias moment\u00e1neas sin entender que la ra\u00edz
  o el socav\u00f3n es mucho m\u00e1s profundo de lo que pens\u00e1bamos.\\n\\nUna
  de las grandes victorias que surge de la Reforma Protestante es la presuposici\u00f3n
  simple y abarcadora que llamaron \u201csola scriptura\u201d. El t\u00e9rmino representa
  una idea fundamental en la cosmovisi\u00f3n de estos gigantes de nuestra historia,
  que la Biblia es la verdad indiscutible, inmutable y soberana sobre la fe y la conducta.
  Que la Escritura, m\u00e1s all\u00e1 de evidenciarse en ella misma, es el ancla
  de toda la experiencia humana. De la Escritura, obtenemos nuestra fuente epistemol\u00f3gica.
  De la escritura, obtenemos la m\u00e1s alta r\u00fabrica \u00e9tica y nuestra justificaci\u00f3n
  de los \u00f3rdenes de toda la creaci\u00f3n, todo sobre el poderoso axioma del
  evangelio de nuestro Se\u00f1or Jesucristo. Solo de la Escritura podemos producir
  las respuestas a los retos de esta cultura liberal. Esto es nuestro campo misionero,
  esto es lo que Dios ha puesto en nuestras manos.\\n\\nAxioma es una proposici\u00f3n
  clara y evidente que no necesita demostraci\u00f3n. El ap\u00f3stol Pablo nos dice
  que es en Jesucristo \u201cen quien est\u00e1n escondidos todos los tesoros de la
  sabidur\u00eda y del conocimiento.\u201d (Colosenses 2:3). La cultura en la cual
  somos llamados a discipular en la gran comisi\u00f3n, se construye sobre axiomas.
  Se construye sobre presuposiciones que luego proveen el marco de la cosmovisi\u00f3n.
  Este es la ra\u00edz correcta, el fundamento necesario para que toda la naturaleza
  inmaterial como material, exista. La historia de la redenci\u00f3n en la persona
  de Cristo, les habla a todas las esferas de la vida. Si tenemos el axioma correcto,
  produciremos una cultura veraz y correcta. Una cultura con las libertades y los
  absolutos puestos en aquel que \u201c\u2026 fueron creadas todas las cosas, las
  que hay en los cielos y las que hay en la tierra, visibles e invisibles\u2026\u201d
  (Colosenses 1:16).\\n\\nAxioma es la respuesta de Dios en su misericordia y gracia
  a nuestra cultura. Se compone de estos j\u00f3venes presbiterianos comprometidos
  con la palabra de Dios, comprometidos con sus\\n\\nmandamientos, comprometidos con
  hacerle frente a toda mentira y manipulaci\u00f3n de los incircuncisos que tanto
  odian a Dios. \u00a1Dios nunca se queda sin testigos y su palabra llega hasta los
  confines de todo el mundo! As\u00ed este remanente sigue creciendo en el amor por
  nuestro Creador, en amor por la Escritura y en amor por lo que \u00e9l ha dicho
  que es verdad por encima de las opiniones de los hombres. \u00a1As\u00ed como el
  gran Reformador John Knox dec\u00eda \u201cDame a Escocia o muero! ...\u201d\\n\\nAxioma,
  en conjunto con la Iglesia Presbiteriana Reformada dice:\\n\\n\u00a1Dame a Puerto
  Rico y a Latinoam\u00e9rica o muero!\\n\\nEn Cristo\\n\\nJeremy Seth Colon Arroyo.\\n\\nL\u00edder
  de los J\u00f3venes Presbiterianos de la Iglesia Presbiteriana Reformada.\\n\\nJ\u00d3VENES
  DE LA IGLESIA PRESBITERIANA Y REFORMADA DE SAN JUAN, PUERTO RICO\\n\\n4. Noticias
  de la Iglesia Presbiteriana Reformada de Costa Rica\\n\\nDios permanece fiel a la
  promesa de Cristo, edificando su Iglesia. Las congregaciones presbiterianas han
  recibido varios nuevos miembros en estos d\u00edas. Tambi\u00e9n el Presbiterio
  examin\u00f3 a Harvin Brice\u00f1o para anciano, aprob\u00e1ndolo para servir en
  la congregaci\u00f3n \u201cSoli Deo Gloria\u201d. El hermano Harvin es hijo de esta
  congregaci\u00f3n, por lo tanto, es un gran honor para \u00e9l servir a sus hermanos
  de toda la vida. La misma congregaci\u00f3n eligi\u00f3 como di\u00e1cono a Freddy
  Sol\u00eds Benavides. Ambos fueron encomendados al Se\u00f1or y ordenados el domingo
  21 de agosto en un servicio solemne, con la presencia de representantes del presbiterio.
  \u00a1Que Dios bendiga el trabajo de todos nuestros pastores, ancianos y di\u00e1conos!\\n\\nORDENACI\u00d3N
  DE HARVIN BRICE\u00d1O COMO ANCIANO Y DE FREDDY SOL\u00cdS COMO DI\u00c1CONO DE
  LA IGLESIA PRESBITERIANA REFORMADA SOLI DEO GLORIA EN COSTA RICA\\n\\n5. Conferencia\\nTorre
  Esdras 2017\\n\\n- Bogot\u00e1, Colombia del\\n- 18 al 20 de enero\\n- del 2017\\n-
  2 \u2013 9 pm\\n- 3 D\u00edas de entrenamiento Teol\u00f3gico\\n- Para l\u00edderes,
  maestros (as) de escuela dominical, pastores y todos los que est\u00e9n interesados
  en la ense\u00f1anza de la Escritura.\\n- La escritura es ante todo una revelaci\u00f3n
  escatol\u00f3gica y Dios, por medio de los pactos, nos muestra el fin desde el principio.\\n\\nConferencista\\n\\n-
  Rev. Dr. Lane G. Tipton\\n- Ministro ordenado en la Iglesia Presbiteriana Ortodoxa
  (OPC).\\n- PhD, Seminario Teol\u00f3gico Westminster\\n- Titular de la C\u00e1tedra
  Charles Krahe de Teolog\u00eda Sistem\u00e1tica\\n- Profesor asociado de teolog\u00eda
  sistem\u00e1tica en el Seminario Teol\u00f3gico de Westminster\\n\\n\u00bfQu\u00e9
  es Torre Esdras?\\n\\nTorre Esdras es un ministerio reformado que existe para ayudar
  a otros a estudiar y comprender la palabra de Dios, nuestra metodolog\u00eda es
  a trav\u00e9s de la producci\u00f3n herramientas de alta calidad y contenido b\u00edblico
  fiel. Estos recursos estar\u00e1n disponibles en diferentes formatos (conferencias,
  videos, libros, audios) para distintos tipos de audiencia.\\n\\nM\u00e1s informaci\u00f3n\\n\\nTel:
  (+57) 3112134704\\nwww.torreesdras.com\\nwww.conferenciatorreesdras.org\\nPatrocinado
  por la OPC (Orthodox Presbyterian Church)\\n\\nEscatolog\u00eda y Pacto\\n\\n\\\"El
  contexto de la Uni\u00f3n con Cristo\\\"\\n\\nRev. Dr. Lane G. Tipton\\n(PhD, Seminario
  Teol\u00f3gico Westminster) titular de la C\u00e1tedra de Charles Krahe y Teolog\u00eda
  Sistem\u00e1tica\\n\\nEl cupo es limitado. Para garantizar su espacio en la conferencia
  es necesario registrarse antes del 1 de Diciembre de 2016. Para hacerlo debe llenar
  el formulario de registro y a vuelta de correo le enviaremos los datos para hacer
  su consignaci\u00f3n.\\n\\nInversi\u00f3n: $70.000 (Incluye 3 Refrigerios y 3 cenas)\\n\\nEnero
  18 al 20 / 2:00pm a 9:00pm\\nBogot\u00e1 _ Colombia\\n\\nA LOS LECTORES\\n\\nHace
  casi 25 a\u00f1os, el Dr. Peter Jones escribi\u00f3 un libro con el t\u00edtulo
  *El imperio gn\u00f3stico contraataca* (t\u00edtulo original: *The Gnostic Empire
  strikes back*, 1992). En ese momento la mayor\u00eda de las Iglesias estaban bien
  adormecidas, y pocos le prestaron atenci\u00f3n al profesor ingl\u00e9s, excompa\u00f1ero
  de clase de John Lennon. Pero Jones result\u00f3 ser profeta sin quererlo, y el
  *tsunami* del paganismo antiguo se levant\u00f3 e inund\u00f3 la cultura y civilizaci\u00f3n
  occidental. Hoy nadie duda de la veracidad de las palabras de Jones.\\n\\nEl problema
  es que le agarr\u00f3 tarde a la Iglesia. En lugar de preparar de antemano al pueblo
  de Dios para lo que ven\u00eda, los cristianos segu\u00edan felizmente en lo suyo,
  hasta que la serpiente gn\u00f3stica ya ten\u00eda medio cuerpo dentro del templo.
  Ya era demasiado tarde. Hoy por hoy, est\u00e1n cayendo Iglesia tras Iglesia, pastor
  tras pastor, confesando haber sido iluminados por Buda y por Isis o alguno de sus
  profetas modernos.\\n\\nLos efectos de no prepararse han sido desastrosos. La familia
  cristiana ahora est\u00e1 luchando por sobrevivir, asediada profundamente por valores
  enemigos ac\u00e9rrimos. La agenda homosexual apunta hacia una conquista de todo
  sector de la cultura: pol\u00edtico, econ\u00f3mico, educativo y religioso. El drag\u00f3n
  verde de la adoraci\u00f3n de *Gaia* busca tragar a los cristianos, convirtiendo
  la adoraci\u00f3n del Creador en adoraci\u00f3n de la creaci\u00f3n. Y el ej\u00e9rcito
  de \u201cpastores\u201d completamente paganos pastoreando iglesias crecientes\\n\\namenaza
  la esencia de la Iglesia de Cristo como sal y luz en el mundo.\\n\\nCLIR presenta
  este volumen como un aporte b\u00edblico de reflexi\u00f3n necesaria sobre nuestra
  realidad. Esperamos sea de ayuda para cualquiera que lo lea, para que el nombre
  de Cristo sea reconocido como \u201cSe\u00f1or de se\u00f1ores, y Rey de reyes\u201d.
  \u00a1A \u00c9l sea la gloria!\\n\\nGuillermo Green\\n\\nEl tema central de esta
  publicaci\u00f3n es la mentira del paganismo. La raz\u00f3n principal de dedicar
  pensamiento cr\u00edtico a este tema no solo es pol\u00e9mica. Tampoco nos impulsa
  el mero hecho de que, al parecer, la mentira avanza y permea de modo agresivo todas
  las esferas de la sociedad, incluyendo la Iglesia. Nuestra raz\u00f3n es proactiva,
  pues necesitamos entender claramente la naturaleza de este fen\u00f3meno para saber
  c\u00f3mo desempe\u00f1arnos mejor como creyentes militantes, en tanto que vivimos
  en este mundo.\\n\\nLos creyentes debemos recordar dos verdades b\u00edblicas fundamentales
  con respecto a esto: por un lado, la verdad escritural de que todas las culturas
  est\u00e1n bajo el efecto de la ca\u00edda de nuestros primeros padres, y por lo
  tanto, todas tienen responsabilidad moral delante de Dios. Y, por esta misma realidad,
  la iglesia de Cristo tiene la responsabilidad de evangelizar la cultura, s\u00ed,
  esta cultura del Siglo XXI que est\u00e1 mayormente en pro del paganismo. No obstante,
  por otro lado, sabemos que todos los cristianos e hijos de Dios desde tiempos b\u00edblicos
  consumen cultura. Jos\u00e9 fue embalsamado seg\u00fan las costumbres egipcias,
  y su abuelo Abraham usaba camellos y asnos para movilizarse hacia Cana\u00e1n. Los
  creyentes del Nuevo Testamento pod\u00edan comprar carne de los mercados p\u00fablicos
  que probablemente era sacrificada a los \u00eddolos, pero no deb\u00edan comer en
  los templos paganos, y deb\u00edan cuidarse de no ofender a otros al hacerlo.\\n\\nLos
  creyentes de la Iglesia de hoy vestimos ropas que usan quienes no son a\u00fan (o
  quiz\u00e1s nunca sean) creyentes, y usamos productos tecnol\u00f3gicos que usan
  inclusive los paganos. Sin embargo, no consumiremos productos de esta cultura como
  instrumentos de pecado ni haremos nuestros el pensamiento e ideolog\u00eda paganos.
  Tenemos que vivir en este mundo de manera distintiva como cristianos, fieles a Cristo
  y a la verdad de su Santa Palabra, y al mismo tiempo, debemos procurar alcanzar
  a esta cultura del Siglo XXI con el mensaje redentor de Cristo. Para hacerlo, debemos
  saber reconocer la mentira original del paganismo a nuestro alrededor. Eso, en esencia,
  es el telos de cada art\u00edculo en esta revista. Por eso, en tanto la estudiemos
  agradeciendo a todos quienes ha escrito en este n\u00famero, tanto m\u00e1s estaremos
  preocupados por llevar la verdad del evangelio a nuestros cong\u00e9neres de este
  siglo en medio del cual Dios nos ha hecho sus misioneros.\\n\\nGRITO DE GUERRA\\n\\nEn
  el principio, Dios cre\u00f3 los cielos y la tierra, y cuando hubo preparado todo
  lo dem\u00e1s, cre\u00f3 al hombre, el pin\u00e1culo de su creaci\u00f3n, a su imagen
  y semejanza. Entre todas las criaturas, el hombre gozaba de una posici\u00f3n muy
  especial. Solo el hombre pod\u00eda relacionarse con Dios de manera personal. Solo
  el hombre ten\u00eda acceso al conocimiento de Dios conforme \u00c9l le revelaba
  su voluntad de manera directa y cercana. El hombre fue creado con el especial prop\u00f3sito
  de llevar gloria a su Creador como criatura racional, y de hallar satisfacci\u00f3n,
  realizaci\u00f3n y gozo solo en \u00c9l. Esta relaci\u00f3n entre el Creador y su
  criatura estaba fundamentada en la verdad: la verdad de que el Creador tiene el
  derecho sobre su criatura para definirla y darle prop\u00f3sito; la verdad de que
  este Creador le da a conocer a la criatura su voluntad para que esta pueda agradarle;
  la verdad de que la criatura solo hallar\u00e1 verdadero deleite y sentido de realizaci\u00f3n
  en la medida que cumpla su prop\u00f3sito creacional. El hombre entendi\u00f3 su
  prop\u00f3sito y, por un tiempo, anduvo en perfecta comuni\u00f3n con Dios.\\n\\nSin
  embargo, otra criatura entr\u00f3 en escena. La serpiente antigua, el padre de mentiras,
  irrumpi\u00f3 en el huerto y sembr\u00f3 su veneno en la mente y el coraz\u00f3n
  del hombre, y desde entonces, entre ambos se ha establecido una perversa alianza
  en contra del Creador. Si la relaci\u00f3n creacional entre el hombre y Dios estaba
  fundamentada en la verdad y llevaba a la plenitud\\n\\nde vida en santa sujeci\u00f3n
  al Creador, el cual es bendito por los siglos, la alianza imp\u00eda entre el hombre
  y Satan\u00e1s est\u00e1 fundamentada en la mentira y lleva a la completa destrucci\u00f3n
  de la vida humana en perver- sa rebeld\u00eda. Sin embargo, no debemos confundirnos,
  esto es lo que Satan\u00e1s ha querido desde el principio. Satan\u00e1s aborrece
  a su Creador, pero dado que contra \u00c9l no puede hacer absolutamente nada, ha
  dirigido sus esfuerzos a la destrucci\u00f3n de la imagen de Dios en el hombre,
  y lo hace mostr\u00e1ndose como un aliado cuando en realidad es su enemigo mortal.\\n\\nLa
  primera versi\u00f3n de la mentira antigua se dej\u00f3 o\u00edr en el huerto entre
  dientes afilados y siseos ominosos, y el eco de aquel vil enga\u00f1o se ha escuchado
  generaci\u00f3n tras generaci\u00f3n, y ha resonado en todas las \u00e1reas de la
  vida del hombre y en todas sus relaciones. \u201c\u00bfCon que Dios os ha dicho...?\u201d
  Su primer paso fue poner en tela de duda lo que Dios hab\u00eda dicho claramente.
  La verdad de la Palabra de Dios contiene todo lo necesario para la vida y para la
  pie- dad, y a partir de sus principios se puede dar sentido a toda la experiencia
  humana en el mundo creado. Sin embargo, Satan\u00e1s quiere que dudemos de la verdad,
  pues un cora- z\u00f3n dubitativo es lo primero que necesita la mentira para asentarse.\\n\\nUna
  vez plantada la duda en cuanto a lo que Dios ha dicho, sigue la negaci\u00f3n abierta
  de su Palabra: \u201cCiertamen- te no morir\u00e9is\u201d. No solamente niega en
  un sentido gene- ral la veracidad de lo dicho por el Creador, sino que niega espec\u00edficamente
  la expectativa de juicio, asegurando que no habr\u00e1 consecuencias para la desobediencia.
  Si somos\\n\\nobservadores cuidadosos de nuestro contexto, notaremos que en todas
  las \u00e1reas de la vida, con cada vez mayor consistencia, la humanidad se esfuerza
  por poner en duda la veracidad de la revelaci\u00f3n de Dios, la veracidad de Cristo,
  su Verbo encarnado, y con ello, la expectativa de juicio. Los hombres creen que
  pueden violentar los mandamientos de Dios sin ninguna consecuencia.\\n\\nA continuaci\u00f3n,
  Satan\u00e1s arremete contra la distinci\u00f3n primordial entre la criatura y su
  Creador bajo la promesa: \u201cSer\u00e9is como Dios\u201d. Ya no es Dios quien
  define y da prop\u00f3sito al hombre; ahora el hombre se cree autosuficiente, se
  define a s\u00ed mismo y vive para s\u00ed. Y si el hombre es dios, ahora vive para
  s\u00ed, para agradarse y complacerse a s\u00ed mismo, intentando colocarse as\u00ed
  en el trono que pertenece al \u00fanico Dios verdadero. Si cada uno trata de ocupar
  ese lugar, o se desata una guerra constante entre los seres humanos, cada uno luchando
  por s\u00ed mismo; o bien, todos se unen para elevar a una posici\u00f3n deificada
  alguna entidad humana colectiva, la cual absorbe al individuo en una gran masa y
  lo despoja de su personalidad y dignidad. De cualquier forma, la mentira de que
  el hombre puede ser igual a dios crear\u00e1 divisi\u00f3n o uni\u00f3n a expensas
  la una de la otra, dando como resultado, en ambos casos, la destrucci\u00f3n del
  ser humano como Dios lo cre\u00f3.\\n\\nAdem\u00e1s, al borrar la distinci\u00f3n
  entre el Creador y la criatura, la \u00fanica consecuencia l\u00f3gica es la eliminaci\u00f3n
  gradual de todas las dem\u00e1s distinciones que Dios estableci\u00f3. Actualmente
  vemos c\u00f3mo son atacadas de forma agresiva las distinciones entre hombre y mujer,
  y entre el hombre racional y las criaturas irracionales, entre otras.\\n\\nCada
  vez que se elimina una l\u00ednea que Dios ha trazado, la humanidad levanta el pu\u00f1o
  en se\u00f1al de rebeli\u00f3n contra el Creador; y la falsa promesa detr\u00e1s
  de esto es que al romper nuestros lazos con el Dios del universo, seremos independientes
  y verdaderamente libres. Sin embargo, Satan\u00e1s sabe que la verdadera libertad
  del hombre est\u00e1 en abrazar las distinciones que Dios ha establecido y obedecer
  su voluntad. \u00bfCu\u00e1ndo m\u00e1s es el pez verdaderamente libre, sino cuando
  nada en las profundidades del mar? \u00bfCu\u00e1ndo m\u00e1s es el ave verdaderamente
  libre, sino cuando extiende sus alas y surca los cielos? El hombre no encontrar\u00e1
  libertad al salirse de los l\u00edmites impuestos por su Creador, sino solo esclavitud
  a su propio pecado, y entonces, al igual que un ave atada a la tierra, llevar\u00e1
  una vida triste y marcada por la insatisfacci\u00f3n, y al igual que un pez fuera
  del agua, solo le esperar\u00e1 agon\u00eda y muerte.\\n\\nSabemos c\u00f3mo termin\u00f3
  la historia del huerto. Ad\u00e1n y Eva comieron del fruto prohibido y colocaron
  as\u00ed al universo entero bajo maldici\u00f3n. Sin embargo, la historia del huerto
  fue solo el comienzo de la historia de la redenci\u00f3n que tuvo su cl\u00edmax
  en la venida de la simiente de la mujer que aplastar\u00eda a la serpiente y deshar\u00eda
  su red de mentiras. El evangelio de nuestro Se\u00f1or Jesucristo es un llamado
  a retornar a la posici\u00f3n original de humildad. Es un llamado a reconocer nuestra
  rebeld\u00eda contra Dios manifestada en todo tipo de pecados, y acudir en total
  dependencia al \u00fanico que puede salvarnos, Dios mismo a trav\u00e9s de Jesucristo.
  La comunidad de los creyentes ha sido iluminada por Dios para regresar a aquel entendimiento
  que ten\u00eda el hombre antes de la ca\u00edda: Dios es quien define lo que somos
  y c\u00f3mo debemos conducirnos en este mundo que \u00c9l\\n\\nha creado. Tenemos
  nuestra identidad restaurada en Cristo, el Creador que se hizo criatura para sufrir
  el castigo de los suyos y llevarlos de vuelta al Padre.\\n\\nLa Iglesia, no obstante,
  no es inmune a la mentira perenne, y a lo largo de la historia, en la medida que
  ha bajado su guardia y ha dejado de dar importancia al a Verdad perfecta de las
  Escrituras, se ha visto envuelta en pr\u00e1cticas que brotan de doctrinas ba\u00f1adas
  con el mismo enga\u00f1o de Satan\u00e1s. La versi\u00f3n de la mentira que crece
  dentro de la Iglesia es la m\u00e1s peligrosa, y es donde el enemigo m\u00e1s enfoca
  sus energ\u00edas, pues si el pueblo de Dios es enga\u00f1ado y llevado de aqu\u00ed
  para all\u00e1 por todo viento de falsas doctrinas, \u00bfqui\u00e9n quedar\u00e1
  para predicar el evangelio sin m\u00e1cula? \u00bfqui\u00e9n ir\u00e1 a los enga\u00f1ados
  de Satan\u00e1s con la luz de las Escrituras para liberarlos de sus redes? \u00bfqui\u00e9n
  demostrar\u00e1 con su ejemplo c\u00f3mo se lleva una vida restaurada por la verdad
  de Cristo? Por lo tanto, cualquier ense\u00f1anza que haga al hombre igual a Dios
  o lo coloque por encima de \u00c9l debe ser rechazada. Cualquier pensamiento que
  contradiga en parte o en todo la Verdad revelada en las Escrituras, debe ser erradicado.
  Cualquier doctrina que confunda las distinciones establecidas por Dios, debe ser
  destruida. Si la Iglesia no se toma en serio esta tarea, nadie en el mundo lo har\u00e1.\\n\\nEn
  medio de esta mentira creciente, es nuestro deber proclamar la verdad del evangelio.
  Las buenas nuevas son simples: Dios envi\u00f3 a su Hijo hace m\u00e1s de dos mil
  a\u00f1os a morir por los pecadores, para que todos los que creen en \u00c9l no
  sufran las consecuencias de su pecado, sino que disfruten plenitud de vida con y
  en \u00c9l. Sin embargo, las implicaciones de esta simple noticia son inimaginablemente
  profundas, y nos corresponde como redimidos llevar a cabo la tarea de exponer cada
  forma de la mentira que se levante en nuestro entorno a la luz penetrante de la
  Palabra de Dios. No podemos quedarnos inm\u00f3viles, ni podemos limitarnos a una
  ense\u00f1anza superficial. As\u00ed como la mentira ha penetrado hasta lo m\u00e1s
  profundo de las instituciones humanas, la verdad de Dios tiene el poder de transformarlo
  todo para su gloria. En medio de esta batalla campal que parte de dos cosmovisiones
  opuestas y mutuamente excluyentes, el Se\u00f1or ha prometido estar con nosotros
  a cada paso y hasta el final, ha prometido que la verdad de su Palabra permanecer\u00e1
  hasta el fin, y ha prometido que su Iglesia fiel a esta verdad eterna prevalecer\u00e1,
  y que las puertas del mismo infierno no podr\u00e1n soportar sus ataques. Este es
  nuestro contexto, tomemos las armas que Dios nos ha dado y luchemos con valor; la
  victoria es segura. \u00a1Por Dios, por su Palabra y por su Cristo!\\n\\nDaniel
  J. Lobo\\nEditor General\\n\\nMUERTOS CAMINANDO\\n\\nPor Joseph Boot\\n\\nA medida
  que nuestra cultura y naci\u00f3n ha seguido un curso para apartarse del Dios de
  la Escritura y su gobierno justo, no hemos cesado de adorar, sino que simplemente
  hemos intercambiado el verdadero culto por idolatr\u00eda en la cultura y la pol\u00edtica.\\n\\nEn
  la d\u00e9cada de los sesenta, comenzaron serios movimientos para eliminar la Escritura
  y la oraci\u00f3n de las escuelas p\u00fablicas del Canad\u00e1, golpeando el alma
  vulnerable de una naci\u00f3n que se sentaba en mesas peque\u00f1as para aprender
  inocentemente. En 1985, en virtud de la Carta, los \u00faltimos vestigios de la
  identidad cristiana p\u00fablica fueron abolidos en Ontario, como la oraci\u00f3n
  del Padre Nuestro que fue prohibida por ser inconstitucional. El resultado ha sido
  la constante castraci\u00f3n moral de dos generaciones, y el lanzamiento a la deriva
  de la personalidad humana. Esto ha llevado a la absolutizaci\u00f3n del aspecto
  emocional de la experiencia humana, de modo que ahora, en un mundo pl\u00e1stico,
  \u201cSiento, luego existo\u201d.\\n\\nBajo la influencia de radicales europeos
  como Michel Foucault se nos ha dicho que no hay ser esencial; la persona y la familia
  humana son meras construcciones sociales. Solo somos lo que hacemos y definimos
  nosotros mismos lo que somos. En un cosmos tal aun la gram\u00e1tica y los pro-\\n\\n1
  Tomado y traducido de \u00a9 Ezra Institute for Contemporary Christianity. Todos
  los derechos reservados. Usado con el debido permiso.\\n\\nnombres se deben ir,
  puesto que estos hablan de la ley y las normas, mientras que el hombre no es m\u00e1s
  que un mero artificio.\\n\\nPor el contrario, al comienzo de la Escritura descubrimos
  el aspecto m\u00e1s fundamental de la Palabra revelada de Dios para la concesi\u00f3n
  de una visi\u00f3n coherente e inteligible de la persona:\\n\\nEntonces dijo Dios:
  \u201cHagamos al hombre a nuestra imagen, conforme a nuestra semejanza. Y se\u00f1oree
  en los peces del mar y en las aves de los cielos, y en las bestias, en toda la tierra,
  y en todo animal que se arrastra sobre la tierra\u201d. Y cre\u00f3 Dios al hombre
  a su imagen, a imagen de Dios lo cre\u00f3; var\u00f3n y hembra los cre\u00f3 (G\u00e9nesis
  1: 26-27).\\n\\nNo hay paralelo a este punto de partida en ning\u00fan otro lugar
  en el pensamiento humano. El Dios trino (plural) de la Escritura crea todas las
  cosas de la nada \u2014todo lo que es distinto de \u00e9l\u2014 y hace a la persona
  a su imagen, donde el \u201cyo\u201d o ego humano se constituye como un punto de
  referencia trascendental para todos los aspectos de la experiencia humana temporal.
  Como parte de la creaci\u00f3n, el hombre de alguna manera trasciende la naturaleza.
  Como Blaise Pascal entend\u00eda bien, la persona es un misterio que trasciende
  su entorno como un ser integral comprensible solamente en referencia al Dios vivo
  como la fuente y origen de toda la vida, la ley, la verdad y el significado.\\n\\nEsta
  identidad humana \u00fanica y la distinci\u00f3n cr\u00edticamente importante entre
  el Creador y la criatura implica, necesariamente, un l\u00edmite tanto al alcance
  del pensamiento humano como a las prerrogativas legislativas del hombre. Leemos
  en Eclesiast\u00e9s: \u201cComo t\u00fa no sabes cu\u00e1l es el camino del viento,
  o c\u00f3mo crecen los huesos en el vientre de la mujer encinta, as\u00ed ignoras
  la obra de Dios, el cual hace todas las cosas\u201d. (Ecc. 11:5)\\n\\nLa persona
  promedio de hoy, sin embargo, ha perdido de vista la verdadera naturaleza del hombre
  y ha ca\u00eddo presa del nihilismo espiritual y de un mundo de negaci\u00f3n al
  cual se le ense\u00f1\u00f3 a abrazar. Como el gran fil\u00f3sofo holand\u00e9s,
  Herman Dooyeweerd dijo con relaci\u00f3n al hombre moderno, \u201c\u00c9l ha perdido
  toda su fe y niega cualquier ideal m\u00e1s elevado que la satisfacci\u00f3n de
  sus deseos... Para \u00e9l, Dios ha muerto..., el hombre de la masa moderno se ha
  perdido a s\u00ed mismo y se considera lanzado en un mundo que no tiene sentido.\u201d\\\\(^2\\\\)\\n\\nComo
  resultado de este temperamento moderno, quiz\u00e1 nunca ha habido un tiempo en
  los \u00faltimos quince siglos o m\u00e1s cuando el mundo occidental se enfrent\u00f3
  a una mayor crisis de identidad y de ese modo se enfrent\u00f3 de manera espectacular
  a su propia ruina social y cultural. Cualquier cristiano observador y pensante puede
  ver que somos una generaci\u00f3n luxada y desencajada a la deriva en el mundo.\\n\\nFil\u00f3sofos
  sociales y culturales, comentaristas y te\u00f3logos han derramado mucha tinta tratando
  de navegar mar arriba en busca de la fuente del problema, siguiendo los diversos
  afluentes de la crisis hacia su fuente com\u00fan, pero no todos han comprendido
  el car\u00e1cter religioso de su fuente subterr\u00e1nea, el descenso de la personalidad
  humana a trav\u00e9s de un coraz\u00f3n que apostata de Dios y la consiguiente\\n\\n\\\\(^2\\\\)
  Herman Dooyeweerd, En el ocaso del pensamiento occidental (EE. UU.: Paideia Press,
  2012), 120.\\n\\naparici\u00f3n del hombre-masa (es decir, seres humanos despersonalizados
  y prescindibles) en una sociedad tecnocr\u00e1tica donde el individuo se esfuerza
  por \u2018encontrarse a s\u00ed mismo\u2019 sin Dios. No muchos perciben que nuestra
  situaci\u00f3n actual es tan precaria que la eleg\u00eda de la cultura occidental
  est\u00e1 a punto de ser compuesta.\\n\\nLeemos diariamente de personas apresadas
  en las garras de un relativismo radical inimaginable incluso desde hace veinticinco
  a\u00f1os. Como personas abstractas y generalizadas reducidas a identidades grupales
  auto creadas, ya no sabemos lo que es un ser humano. Esta condici\u00f3n ha avanzado
  hasta el punto de estar esencialmente inseguros de si existen normas humanas del
  todo que trasciendan el deseo aut\u00f3nomo radical y la autoidentificaci\u00f3n
  subjetivista. Ni siquiera estamos seguros del valor intr\u00ednseco de la persona
  hecha a imagen de Dios, ya sea antes de nacer, reci\u00e9n nacido, personas con
  discapacidad, envejeciendo, en enfermedad o al final de sus vidas. En efecto, estamos
  tan fundamentalmente desarraigados que ya no estamos seguros de la realidad cient\u00edfica
  y cromos\u00f3mica de las distinciones binarias de g\u00e9nero de masculino y femenino,
  de la sexualidad humana normativa, o de la instituci\u00f3n m\u00e1s antigua conocida
  por la raza humana: el matrimonio y la familia.\\n\\nY as\u00ed, en un mundo de
  flujo, de la fluidez irracional de todas las cosas, donde la posibilidad de diferenciaci\u00f3n
  normativa entre la verdad y la falsedad, lo correcto e incorrecto, la realidad y
  la irrealidad, se ha venido abajo, la cultura simplemente no ha llegado a un bache
  en la carretera, sino que ha sido aspirada en una especie de torbellino de\\n\\nlocura
  democr\u00e1tica, en espiral hacia lo que Cornelio Van Til llama \u201cdesintegraci\u00f3n
  en el vac\u00edo\u201d.\\n\\nEn nuestro mundo desarticulado, los vanos desvar\u00edos
  de los capataces de Nietzsche, que han ido m\u00e1s all\u00e1 del bien y del mal,
  declaran al razonable y sensato como enfermo, loco o mal\u00e9volos y demandan la
  voz de la raz\u00f3n plena a silenciarse frente a la reinvenci\u00f3n del mundo
  por parte de los prestidigitadores culturales. La cruda realidad de nuestra situaci\u00f3n
  es que estamos frente a la muerte del hombre como hombre en Occidente. Al negar,
  desacreditar y desfigurar la imagen de Dios en el hombre, estamos perdiendo nuestra
  propia alma (Mat. 16:26)\\n\\nEn el estado de crisis que resulta de la ilusi\u00f3n
  de la libertad creativa de la individualidad, las personas est\u00e1n a menudo profundamente
  temerosas en su interior, incluso a medida que se deleitan en una autonom\u00eda
  que encuentra indulgencia social sin fin y sin sanci\u00f3n legal. La gente en todas
  partes est\u00e1 apresada por una tristeza, culpa y desesperaci\u00f3n tal que ninguna
  cantidad de recetas psicotr\u00f3picas pueden finalmente aminorar o curar de verdad;
  por tal t\u00e9cnica, el miedo a la desintegraci\u00f3n y a la muerte es simplemente
  suprimido. Sin embargo, como ha se\u00f1alado Dooyeweerd correctamente, \u201ces
  una revelaci\u00f3n incomprendible de Dios lo que llena a la humanidad con temor
  y temblor\u201d\\\\(^3\\\\).\\n\\nPodemos negar a Dios y al hombre como portador
  de su imagen, avanzando por un camino suicida, pero esto siem-\\n\\n---\\n\\n3 Herman
  Dooyeweerd, Ra\u00edces de la Cultura Occidental (EE.UU.: Paideia, 2012), 101.\\n\\npre
  resulta ser pura vanidad, ya que estamos rodeados por dentro y por fuera de la realidad
  de Dios y su orden. Esta revelaci\u00f3n puede muy bien ser suprimida, pero es ineludible
  y todav\u00eda capta el ser de cada persona, generando culpa y profunda inquietud.
  En consecuencia, no hay recuperaci\u00f3n para nuestra sociedad hasta que reconozcamos
  que no importa lo que hayamos ganado materialmente, hemos perdido nuestra alma y
  para esto Cristo nos advierte que hay un ajuste de cuentas, porque Dios no puede
  ser burlado; lo que el hombre siembra, eso cosecha (Gal.6:7). Nuestro \u00fanico
  recurso es el verdadero arrepentimiento, tanto personal como nacional.\\n\\nEl hombre
  es un ser adorador. Como San Pablo deja claro en el Cap\u00edtulo 1 de su Carta
  a los Romanos, si nos negamos a adorar al Dios Vivo, el Creador, no dejamos de adorar.
  M\u00e1s bien vamos a adorar alg\u00fan aspecto de la creaci\u00f3n misma, alg\u00fan
  ser o cosa ser\u00e1 absolutizado. El cristiano llama a esto idolatr\u00eda, apostas\u00eda
  del verdadero Dios, que encuentra su ra\u00edz en el coraz\u00f3n humano y se esparce
  para tocarlo todo. Antes de que la renovaci\u00f3n de una visi\u00f3n cristiana
  sea posible, es necesaria una apreciaci\u00f3n autoconsciente de d\u00f3nde hemos
  ca\u00eddo.\\n\\nHoy estamos en las manos de los juicios hist\u00f3ricos de Dios,
  vistos en nuestra creciente adhesi\u00f3n a creencias muy antiguas, pero que visten
  un traje nuevo. Los antrop\u00f3logos en el pasado les llamaban \u2018creencias
  man\u00e1, que fue la principal base de la desintegraci\u00f3n de la personalidad
  humana en las culturas paganas.\\n\\nEstas creencias se caracterizan por una supuesta
  fluidez de la realidad entre lo personal y lo impersonal (religi\u00f3n\\n\\nde
  la naturaleza) ya que el man\u00e1 es una misteriosa fuerza de vida que subyace
  a todo. Millones de personas en nuestra cultura (a menudo sin saberlo) rinden homenaje
  a esa fuerza de vida, desde el tapete de yoga y el sanador de medicina alternativa,
  a la clase de ciencias, donde la naturaleza es deificada como una corriente sin
  fin de vida que se desarroll\u00f3 de manera espont\u00e1nea desde un punto misterioso
  original de absoluta unidad indiferenciada. Fue esta creencia la que llenaba el
  antiguo mundo grecorromano de miedo en la cara de un destino ciego, y as\u00ed promov\u00eda
  la nobleza de suicidio, una creencia que reemerge en nuestro tiempo.\\n\\nCuando
  la naturaleza misma es, de diversas maneras, absolutizada, la cultura se vuelve
  cada vez m\u00e1s decr\u00e9pita, porque con toda la naturaleza siendo de alguna
  manera un aspecto de lo divino, que emerge de una unidad original, \u00bfc\u00f3mo
  puede una diferenciaci\u00f3n real y significativa tener lugar en el \u00e1mbito
  familiar, biol\u00f3gico, \u00e9tico, art\u00edstico, jur\u00eddico, moral o incluso
  a nivel ontol\u00f3gico? En ese punto de vista, el hombre y su cultura es artificio
  meramente transitorio en una fluidez misteriosa.\\n\\nY, en el mundo postdarwiniano
  que ocupamos, ya no podemos hablar de manera convincente o persuasiva de la ley
  natural, incluso como referente moral en la forma en que los secularistas seudocristianos
  de las generaciones pasadas lo hicieron. Un misterioso mundo de fuerzas ca\u00f3ticas
  no puede dar ninguna ley objetiva o trascendente, y por lo tanto todo lo que queda
  en el mundo \u2018man\u00e1\u2019 de jurisprudencia es la ley positiva que surge
  como un desarrollo de la experiencia reflexiva de la gente, como Oliver\\n\\nWendell
  Holmes Jr., ex Juez Presidente del Tribunal Supremo de Estados Unidos y l\u00edder
  pensador legal, argument\u00f3.\\\\(^4\\\\) La pregunta obvia es, \u00bfqui\u00e9n
  interpretar\u00e1 la experiencia reflexiva de las personas y transformar\u00e1 la
  experiencia en ley? Cada vez m\u00e1s la respuesta es: una nueva \u00e9lite en nuestras
  cortes se separa de la responsabilidad ante Dios y ante la definici\u00f3n que las
  Escrituras dan del hombre como portador de su imagen.\\n\\nEste nuevo sacerdocio
  elitista o humanista (reyes fil\u00f3sofos de Plat\u00f3n) es necesario, por supuesto,
  porque el caos social no es una filosof\u00eda pol\u00edtica viable, y en un mundo
  sin ley de autonom\u00eda radical, la humanidad necesita la salvaci\u00f3n de todas
  esas fuerzas fatalistas que amenazan con aplastarlo.\\n\\nEs evidente que la doctrina
  pol\u00edtica moderna se basa normalmente en un conjunto de creencias que contradicen
  categ\u00f3ricamente lo que Dios dice acerca de la humanidad. No es que neguemos
  que hay mal en el mundo, pero no ubicamos ese mal en el coraz\u00f3n del hombre
  (quien es considerado como inherentemente bueno y perfectible), sino en el medioambiente
  y las esferas de orden social como la familia, la iglesia, la propiedad privada
  y otras estructuras de la atribuida desigualdad que supuestamente hacen guerra contra
  una unidad original.\\n\\nPor lo tanto, si abolimos el matrimonio y la familia,
  nadie m\u00e1s estar\u00e1 sujeto a la jerarqu\u00eda y las mujeres y los ni\u00f1os
  no se sentir\u00e1n subyugados. Si eliminamos las nor-\\n\\n\\\\(^4\\\\) RJ Rushdoony,
  Derecho y Libertad (Vallecito, CA: Ross House Books, 2009), 28-29.\\n\\nmas de g\u00e9nero
  binario, nadie m\u00e1s se sentir\u00e1 oprimido por las distinciones. Si eliminamos
  la desigualdad de ingresos, nadie m\u00e1s va a ser codicioso. Si abrimos nuestras
  fronteras y abrazamos islamistas que regresan de la lucha con ISIS y les damos dinero
  y vivienda, ellos ya no van a querer crucificar y decapitar m\u00e1s cristianos
  o atentar en contra de nuestro pa\u00eds. En este punto de vista el ser humano es
  perfectible por t\u00e9cnica pol\u00edtica: un mundo m\u00e1gico en un nuevo envase.\\n\\nSe
  piensa bajar a Dios al nivel del hombre, y elevar al hombre al nivel de Dios. Si
  la autoridad de las familias, los padres, la iglesia, pastores, empresas privadas,
  gremios y asociaciones se erosionan, si podemos abolir toda autoridad verdadera
  fuera del estado y su aparato legislativo que interpreta con autoridad la experiencia
  de la gente, tal vez podamos abolir al Dios que est\u00e1 detr\u00e1s y por encima
  de toda autoridad leg\u00edtima. Fundamentalmente, la centralizaci\u00f3n y el poder
  pol\u00edtico masivo deben ser endosados al estado para hacerlo. Este camino, se
  supone, es verdadera liberaci\u00f3n de la personalidad humana. El te\u00f3logo
  cultural Andrew Sandlin lo ha resumido:\\n\\nLos liberales (progresistas) desde
  la Revoluci\u00f3n francesa han participado en un proyecto de liberaci\u00f3n masiva,
  lo cual ha sido llamado \u201cel nexo entre la opresi\u00f3n y la liberaci\u00f3n\u201d.
  La religi\u00f3n liberal se ha convertido en una serie de ara\u00f1azos de nunca
  acabar por la liberaci\u00f3n de la humanidad de toda tiran\u00eda, real o imaginaria:
  los seculares deben ser liberados de los religiosos, los feligreses de los cl\u00e9rigos,
  los iluminados de los ignorantes, los ciudadanos de la realeza, los pobres de los
  ricos, los trabajadores de\\n\\nlos capitalistas, los negros de los blancos, las
  mujeres de los hombres, las esposas de los maridos, los hijos de los padres, los
  deudores de los acreedores, los empleados de los empleadores, los homosexuales de
  los heterosexuales, los condenados por la ley de los ciudadanos respetuosos; y pronto,
  si la trayectoria persiste, los pol\u00edgamos, mon\u00f3gamos y ped\u00f3filos
  de los guardias de la prisi\u00f3n. La gran liberaci\u00f3n ahora se extiende incluso
  a la naturaleza no humana: La liberaci\u00f3n del \u201cmedioambiente\u201d de la
  humanidad voraz.\\n\\n**CONCLUSI\u00d3N**\\n\\nSi para ahora hubi\u00e9ramos aprendido
  adecuadamente algo en nuestra experiencia hist\u00f3rica, deber\u00eda haber sido
  que el rechazo a Dios y la imagen de Dios en el hombre conduce a la desfiguraci\u00f3n
  sin fin y la destrucci\u00f3n de esa imagen, y el deterioro constante de una diversa
  vida cultural mientras la esfera del estado se extralimita para tratar de desempe\u00f1ar
  un papel mesi\u00e1nico en la vida de las personas. Mientras el hombre se va matando
  a s\u00ed mismo como portador de la imagen de Dios as\u00ed languidece en las ruinas
  de un orden social que no puede encontrar una soluci\u00f3n a su dolencia desde
  dentro de la propia naturaleza.\\n\\nEn la b\u00fasqueda de una verdadera vida pol\u00edtica,
  dependemos de la gracia de Dios y la obra de su Esp\u00edritu a medida que buscamos
  oponernos y vencer una cosmovisi\u00f3n religiosa ap\u00f3stata y destructiva que
  est\u00e1 arruinando muchas\\n\\n---\\n\\n5 Andrew Sandlin, *el Liberalismo pol\u00edtico:
  Presuposiciones teol\u00f3gicas* (Coulterville, CA: Centro de Liderazgo Cultural,
  2015), 16.\\n\\nvidas. Estamos llamados en esta tarea al amor y la obediencia reflexiva.
  Y podemos estar seguros de la victoria a largo plazo en esta batalla porque una
  cultura ap\u00f3stata de la muerte no tiene futuro.\\n\\nDebemos continuar sirviendo
  a la causa de Cristo lo mejor que podamos, orar por los que tienen autoridad, buscar
  el bien de nuestros semejantes, prof\u00e9ticamente ser testigos en contra de la
  idolatr\u00eda en sus variadas formas, y procurar la justicia y la honradez. Nosotros
  no siempre seremos amados por esta posici\u00f3n, pero esta es la victoria que vence
  al mundo: nuestra fe.\\n\\nCon un coraz\u00f3n ap\u00f3stata, durante casi un siglo,
  nuestra cultura ha venido aplicando progresivamente la muerte del hombre como hombre
  (como portador de la imagen de Dios), y por lo tanto, estamos en ese sentido rodeados
  de hombres muertos: muertos en delitos y pecados. Pero el Se\u00f1or Jesucristo
  nos asegura, \u201cLa hora viene, y ahora es, cuando los muertos oir\u00e1n la voz
  del Hijo de Dios, y los que la oigan vivir\u00e1n\u201d (Juan 2:19).\\n\\nTraducido
  por Beatriz Atkins\\n\\nRev. Dr. Joseph Boot (M.A., Ph.D.) es un te\u00f3logo cultural,
  prominente apologista cristiano, pastor fundador del Westminster Chapel en Toronto
  y fundador del Ezra Institute for Contemporary Christianity (EICC). Originario de
  Gran Breta\u00f1a, ha servido con Ravi Zacharias International Ministries por siete
  a\u00f1os como apologista radicado en Oxford, Inglaterra, y en Toronto, Canad\u00e1.\\n\\nBIENVENIDOS
  AL ESTADO DE EGIPTO.\\n\\nYO SOY SU NUEVO REY,\\nPROVEEDOR Y SUSTENTADOR.\\n\\nDE
  AHORA EN ADELANTE ME BUSCAR\u00c1N A M\u00cd PARA RESOLVER SUS PROBLEMAS Y YO DICTAR\u00c9
  LO QUE ES BUENO Y LO QUE ES MALO.\\n\\nYO CONTROLAR\u00c9 Y DISTRIBUIR\u00c9 SUS
  RECURSOS SEG\u00daN ME PAREZCA.\\n\\nTENDR\u00c9 PODER SOBRE SUS EXPRESIONES RELIGIOSAS
  Y SUS FAMILIAS.\\n\\nYO EDUCAR\u00c9 A SUS HIJOS EN EL PENSAMIENTO Y CULTURA EGIPCIO.\\n\\nTRABAJAR\u00c1N
  PARA M\u00cd, ME SERVIR\u00c1N A M\u00cd Y ME ADORAR\u00c1N A M\u00cd.\\n\\nNO SE
  ASUSTEN SI DENTRO DE POCO SUS HIJOS HABLAN SOLO EN EGIPCIO; ESE ES EL PLAN.\\n\\nNACIONALSOCIALISMO,
  PAGANISMO Y CRISTIANISMO\\n\\nPor Carlos Cruz\\n\\nEn 1933 Adolfo Hitler se convirti\u00f3
  en canciller de Alemania. Independientemente de lo que conocemos de los nazis, hay
  un aspecto que se toca en forma t\u00edmida con relaci\u00f3n a la filosof\u00eda
  del Tercer Reich. Este fen\u00f3meno ocurre cuando caemos en la trampa que existe
  un pensamiento \u201csecular\u201d y otro \u201creligioso\u201d. Toda ideolog\u00eda
  es religiosa. Busca adoctrinar, convencer y en muchos casos intimidar para que los
  hombres se sometan a la misma. Todo tiene un motivo religioso b\u00e1sico y ese
  motivo religioso b\u00e1sico moldear\u00e1 la cultura de cualquier pueblo. La religi\u00f3n,
  la que fuere, es antes de la cultura y dictar\u00e1 sus pautas.\\n\\nLos nazis ten\u00edan
  su motivo religioso, el mismo era: SANGRE Y TIERRA. Su proyecto era descartar, destruir
  las bases de la sociedad alemana enraizadas en la Reforma Protestante y volver a
  los mitos y paganismos germ\u00e1nicos. Despu\u00e9s de la Primera Guerra Mundial,
  Alemania estaba sumergida en sufrimientos materiales y morales que se traduc\u00edan
  en la falta de ideales, la inflaci\u00f3n, la falta de trabajo, las cargas de las
  reparaciones de la guerra, una profunda agitaci\u00f3n social, como nos dice un
  autor. Para el 1918, despu\u00e9s de la derrota alemana, se cercenan los v\u00ednculos
  del Estado con la Iglesia Alemana y va surgiendo una maduraci\u00f3n de la conciencia
  eclesial que va tomando rumbos claramente equivocados, rumbos que son frutos de
  la Teolog\u00eda Liberal que permeaba en los seminarios alemanes, de la teolog\u00eda
  liberal que le hab\u00eda dado las espaldas a la Reforma y a las verdades eternas
  de la Escritura, que hab\u00eda vaciado la Iglesia de Alemania y hab\u00eda destruido
  la fe del pueblo alem\u00e1n.\\n\\nPor lo tanto, ante la quiebra moral y religiosa
  hist\u00f3rica de Alemania, los nazis aprovecharon el espacio para introducir una
  cosmovisi\u00f3n pagana la cual respond\u00eda a una teolog\u00eda ap\u00f3stata,
  a un triunfalismo nacionalista xen\u00f3fobo el cual divorciar\u00eda los \u00f3rdenes
  de la creaci\u00f3n de la revelaci\u00f3n b\u00edblica. Se habla en esta \u00e9poca
  de la teolog\u00eda de los \u00f3rdenes de la Creaci\u00f3n. Varios te\u00f3logos,
  como nos dice un autor, se\u00f1alaban que todo cristiano, al igual que los dem\u00e1s
  hombres, vive inmerso en distintas estructuras, familia, pueblo, estado, raza, naci\u00f3n,
  econom\u00eda, etc. Estos \u00f3rdenes, salidos de la mano de Dios, como dec\u00edan
  los te\u00f3logos alemanes, tienen fuerza coactiva como expresi\u00f3n concreta
  e hist\u00f3rica de la Voluntad de Dios. La radicalizaci\u00f3n de esta teolog\u00eda,
  de esta cosmovisi\u00f3n, llegar\u00e1 a confundir, como dice un historiador, H\u00e9ctor
  Vall, la historia profana, la historia pagana de Alemania, con la misma historia
  de la salvaci\u00f3n.\\n\\nEl concepto de SANGRE Y TIERRA se energiza con la teolog\u00eda
  ap\u00f3stata anteriormente esgrimida. Alfred Rosenberg fue el ide\u00f3logo de
  los nazis. Un antisemita de toda la vida, public\u00f3 en 1930 su libro El mito
  del siglo XX. En el plasma el concepto mito, como fuerza motriz del concepto racial
  ario. Para Rosenberg en los procesos hist\u00f3ricos hubo una lucha entre la raza
  superior aria y sus contrapartes, las razas inferiores. El grave error de los arios
  fue su mezcla con estas entidades devaluadas lo cual llev\u00f3 a\\n\\nla ca\u00edda
  de grandes civilizaciones. Los arios eran los \u00fanicos de crear cultura, eran
  una raza de honor, de valent\u00eda, cient\u00edfica y con rasgos f\u00edsicos muy
  acordes a sus ideales de \u201cperfecci\u00f3n\u201d como altos, de ojos azules,
  etc. Todas estas caracter\u00edsticas estaban presentes en el pueblo alem\u00e1n,
  en sus mitos, tradiciones e historia y fueron negadas a las razas inferiores principalmente
  a los jud\u00edos.\\n\\nMientras tanto los te\u00f3logos ap\u00f3statas constru\u00edan
  una cosmovisi\u00f3n pagana e infernal la cual respond\u00eda a esta ideolog\u00eda.
  La historia del pueblo alem\u00e1n, sus tradiciones, su familia, sus mitos, su sangre,
  etc. en ella se revela la voluntad de Dios y es ella la que dicta el camino que
  tomar\u00e1 el pueblo. La Escritura y la Sola Scriptura de los reformadores se reinterpretar\u00eda
  para que respondiera a las aspiraciones y la \u201crevelaci\u00f3n\u201d de la SANGRE
  Y TIERRA del pueblo ario alem\u00e1n. Por esa raz\u00f3n no solo los jud\u00edos
  deb\u00edan ser llevados al exterminio, sino tambi\u00e9n a los tullidos, disminuidos
  mentales, dementes, etc., todos residuos de ese pasado de mezcla racial que la nueva
  \u201crevelaci\u00f3n\u201d invita a corregir.\\n\\nTodo lo anteriormente dicho,
  se establece como el caldo, la fuerza que ayud\u00f3 al nationalsocialismo, los
  nazis, al llegar al poder en Alemania. Para 1933 con la hermen\u00e9utica apostata
  que hemos planteado, un grupo llamado los cristianos alemanes se apoderan del gobierno
  de la Iglesia por medio de elecciones, apoyado incondicionalmente por los organismos
  del aparato propagand\u00edstico de los nazis.\\n\\nEl escrito program\u00e1tico
  de los cristianos alemanes, declaraba en su primer punto que la creaci\u00f3n de
  una Iglesia del Reich, del Tercer Reich, como resultado final de la fusi\u00f3n
  de las 29 iglesias territoriales alemanas, incluyendo las iglesias luteranas y reformadas.
  El segundo punto era el car\u00e1cter popular del movimiento deb\u00eda tener expresi\u00f3n
  en todas las fuerzas religiosas del pueblo alem\u00e1n buscando un sincretismo dogm\u00e1tico,
  paganismo dentro de la iglesia con la historia alemana y los mitos alemanes elevados
  al \u00e1mbito religioso y de adoraci\u00f3n del pueblo alem\u00e1n. El tercer punto
  de los cristianos alemanes, era aceptar el principio del caudillaje, el F\u00fchrer,
  acentuando las caracter\u00edsticas alemanas incluyendo el concepto de la raza aria
  como raza superior as\u00ed aceptando los cristianos alemanes, dentro de su concepci\u00f3n,
  el concepto del racismo y el anti-semitismo como principio religioso del pueblo
  alem\u00e1n.\\n\\nEl triunfo de los cristianos alemanes en las elecciones del 23
  de julio, pone en marcha un proceso de acomodo de la nueva Iglesia al esp\u00edritu
  y a los m\u00e9todos del nacionalsocialismo buscando tambi\u00e9n el establecimiento
  de un obispo del F\u00fchrer, un obispo del Reich que responda solamente a la oficina
  de Adolfo Hitler. Esto originar\u00e1 una crisis doctrinal y legislativa en el interior
  de la Iglesia cuyas manifestaciones particulares se dan ya en la segunda mitad del
  1933.\\n\\nEl 13 de noviembre, en el Palacio de los Deportes de Berl\u00edn, veinte
  mil cristianos alemanes y simpatizantes abogan por la supresi\u00f3n y eliminar
  el Antiguo Testamento y la moral del Ap\u00f3stol Pablo como ense\u00f1anza dentro
  de la Iglesia, abrazar todas las tradiciones y la mitolog\u00eda alemana como parte
  integral de la revelaci\u00f3n de Dios a trav\u00e9s de la SANGRE y TIERRA alemana.
  Se elimina el concepto de\\n\\nSola Escritura y la revelaci\u00f3n ahora se pod\u00eda
  dar ahora a trav\u00e9s de la historia germ\u00e1nica.\\n\\nToda esta \u201cTorre
  de Marfil\u201d de Teolog\u00eda liberal ap\u00f3stata se rend\u00eda f\u00e1cilmente
  a los pies de los criminales de Berl\u00edn porque estaba gobernada por inconversos
  profesores que negaban hace d\u00e9cadas la autoridad e historicidad de las Escrituras.\\n\\nEn
  las Directrices de los Cristianos Alemanes, vemos una muestra de como el cristianismo
  ap\u00f3stata es capaz, utilizando las mismas palabras del evangelio y apelando
  a la riqueza hist\u00f3rica reformada, de hacer alianza con una cosmovisi\u00f3n
  que responde al anticristo, a lo mundanal y a un sinn\u00famero de tradiciones paganas
  y mitos. Veamos:\\n\\n**Punto 4:** Aceptamos como fundamento el cristianismo positivo.
  Profesamos una fe-en-Cristo que se afirma de acuerdo con la raza, como corresponde
  al esp\u00edritu alem\u00e1n de Lutero y a una piedad heroica. (subrayado nuestro).\\n\\n**Punto
  7:** Vemos en la raza, el pueblo y la naci\u00f3n unos \u00f3rdenes de vida que
  Dios nos ha entregado y confiado. El cuidado de su conservaci\u00f3n es para nosotros
  Ley de Dios. Por ello hay que oponerse a la mezcla de razas. La misi\u00f3n exterior
  alemana en virtud de su experiencia llama desde hace tiempo al pueblo alem\u00e1n:
  \u201cMant\u00e9n tu raza pura\u201d y nos dice que fe-en-Cristo no destruye la
  raza, sino que la profundiza y la santifica. (subrayado nuestro).\\n\\n**El punto
  8 es repugnante:** Vemos en la misi\u00f3n interior aut\u00e9nticamente entendida
  el cristianismo efectivo (Tat-Christentum) viviente, pero que seg\u00fan nuestra
  concepci\u00f3n no se enra\u00edza en la mera compasi\u00f3n, sino en la obediencia\\n\\na
  la voluntad de Dios y en el agradecimiento por la muerte en cruz de Cristo... Nosotros
  sabemos ciertamente algo sobre el deber y el amor cristiano para con los desvalidos,
  pero al mismo tiempo exigimos tambi\u00e9n protecci\u00f3n del pueblo contra los
  incapaces y los inferiores. La misi\u00f3n interior no debe contribuir en ning\u00fan
  caso a la degeneraci\u00f3n de nuestro pueblo... (subrayado nuestro).\\n\\nPunto
  9: En la misi\u00f3n jud\u00eda vemos un grave peligro para nuestra individualidad
  nacional (Volkstum). Ella es la puerta de entrada de sangre extranjera en el cuerpo
  de nuestro pueblo. No tiene ning\u00fan derecho de existencia junto a la misi\u00f3n
  exterior. Rechazamos la misi\u00f3n jud\u00eda en Alemania, mientras los jud\u00edos
  posean el derecho de ciudadan\u00eda y subsista, con ello, el peligro de debilitaci\u00f3n
  y de corrupci\u00f3n de la raza. La sagrada Escritura tambi\u00e9n sabe decirnos
  algo sobre la c\u00f3lera santa y amor que se reh\u00fasa. Sobre todo hay que prohibir
  el matrimonio entre alemanes y jud\u00edos.\\n\\nEstas eran parte de las directrices
  para la formaci\u00f3n de una federaci\u00f3n de Iglesias Luteranas y Reformadas,
  una Iglesia Evang\u00e9lica del Reich, que sostendr\u00eda con su teolog\u00eda
  ap\u00f3stata al gobierno de los nazis. La Teolog\u00eda Liberal alemana hab\u00eda
  pavimentado el camino para la negaci\u00f3n de la Sola Scriptura de la Reforma y
  buscar en la oscuridad del coraz\u00f3n ca\u00eddo del hombre un fundamento, una
  cosmovisi\u00f3n que respondiera a tales aberraciones.\\n\\nHubo reacciones en toda
  Alemania de parte de cristianos que repudiaban las aseveraciones de los Cristianos
  Alemanes, la m\u00e1s famosa fue la del S\u00ednodo de Barmen. Por razones principalmente
  de espacio no corresponde a este art\u00edculo profundizar en sus declaraciones
  pero debemos puntualar que la misma fue un paso valiente de real preocupaci\u00f3n
  la cual cost\u00f3 la vida y la libertad de varios l\u00edderes y pastores alemanes.
  Ahora las declaraciones del S\u00ednodo de Barmen se dan en el contexto teol\u00f3gico
  barthiano, lo cual en s\u00ed ya tiene unas deficiencias con relaci\u00f3n a la
  Escritura como revelaci\u00f3n. En el art\u00edculo dos en uno de sus p\u00e1rrafos
  se nos dice:\\n\\n\u201cJesucristo, seg\u00fan el testimonio de la sagrada Escritura,
  es la \u00fanica palabra de Dios, que debemos escuchar y a la que, en la vida y
  en la muerte, debemos confiar y obedecer\u201d.\\n\\nBasados en lo declarado, La
  Escritura es \u201cTestigo de la Revelaci\u00f3n\u201d muy acorde a la teolog\u00eda
  Barthiana. Pero no signific\u00f3 que su contribuci\u00f3n fue enorme y convirti\u00f3
  a la Iglesia Confesante, como fue llamada, en una verdadera testigo de Jesucristo.
  El mismo Karl Barth fue una voz firme y vociferante ante la atrocidad teol\u00f3gica
  y ap\u00f3stata que intentaba el 3er Reich, el cual fue privado de su c\u00e1tedra
  y expulsado de Alemania en 1935.\\n\\nEse compromiso ap\u00f3stata que ve\u00eda,
  como nos dice un autor, que Dios tambi\u00e9n se revelaba en el 3er Reich, en las
  tradiciones y mitos y la sangre del pueblo alem\u00e1n o incluso en la persona de
  Adolfo Hitler, era retado por creyentes que conoc\u00edan la tradici\u00f3n y Teolog\u00eda
  Reformada. El Reich buscaba destruir la Cosmovisi\u00f3n que surg\u00eda de la Reforma
  y sab\u00eda muy bien que la misma solo pod\u00eda ser derrotada cuando se cambiaran
  las bases b\u00edblicas y pol\u00edticas de la Iglesia Evang\u00e9lica. El Reich
  odiaba la Escritura y lo que representaba para las aspiraciones de los criminales\\n\\nde
  Berl\u00edn. Todo cristiano sin discernimiento y ap\u00f3stata apoy\u00f3 la barbarie
  de los nacionalsocialistas. Su fanatismo mundanal fue m\u00e1s fuerte que su falso
  amor por Cristo. Eso no sucede solamente con lo evidente que era el nazismo. En
  nuestros pa\u00edses muchos hermanos, por tradiciones fan\u00e1ticas, siguen apoyando
  a partidos y pol\u00edticos que son abiertamente anti-cristianos o solapadamente
  tienen una agenda en contra de los espacios que el cristianismo gan\u00f3 hace siglos.\\n\\nLa
  Iglesia de Cristo ha sido llamada a ser sal de la Tierra y luz del mundo (Mateo
  5: 13-16). La predicaci\u00f3n y la vivencia del Evangelio es la levedura que leuda
  toda la masa (Mateo 13:33), la predicaci\u00f3n y la vivencia del evangelio es la
  semilla de mostaza que se convierte en el gran \u00e1rbol donde anidan toda clase
  de aves (Mateo 13: 31-32).\\n\\nKarl Adam Te\u00f3logo de Tubinga declar\u00f3 sobre
  Hitler en 1933:\\n\\n\u201cAqu\u00ed est\u00e1 ahora ante nosotros aquel a quien
  las voces de nuestros poetas y sabios han llamado el liberador del genio alem\u00e1n.
  \u00c9l ha arrancado la venda de nuestros ojos y, por debajo de las envolturas pol\u00edtica,
  econ\u00f3mica, social y religiosa, nos ha devuelto la facultad de ver y amar la
  \u00fanica cosa esencial: nuestra unidad de sangre, nuestro ser alem\u00e1n, el
  homo germanus\u201d.\\n\\nEn 1934 los coros de las Juventudes Hitlerianas recitaban
  lo siguiente:\\n\\n\u201cNing\u00fan malvado sacerdote nos impedir\u00e1 sentir
  que somos hijos de Hitler. No seguimos a Cristo, sino a Horst Wessel. (Considerado
  un m\u00e1rtir del nazismo). Basta de incienso y de agua bendita. Por nosotros,
  la Iglesia puede irse a paseo. La esv\u00e1stica trae salvaci\u00f3n a la tierra.
  Yo quiero seguirla paso a paso. \u00a1Baldur von Schirac (dirigente de las juventudes
  hitlerianas), ll\u00e9vame contigo!\u201d (par\u00e9ntesis nuestro)\\n\\nEn Baviera,
  nos dice un autor, los nazis iniciaron una acci\u00f3n contra la separaci\u00f3n
  religiosa en la escuela, y consiguieron, en el espacio de unos pocos cursos, obligar
  a la mayor\u00eda de los padres a trasladar a sus hijos a escuelas interconfesionales.\\n\\nEl
  Movimiento de la fe, era la \u201cIglesia\u201d neopagana del Tercer Reich. El escritor
  Richard Grunberger nos dice:\\n\\n\u201cLas actividades \u201cpositivas\u201d del
  Movimiento de la fe -que en una memorable frase, defini\u00f3 el cristianismo como
  \u201cel Versalles religioso de Alemania\u201d- se centraban principalmente en la
  descristianizaci\u00f3n de los rituales en torno al nacimiento, el matrimonio y
  la muerte, y en la conversi\u00f3n de la Navidad en un festival pagano del solsticio\u201d.\\n\\nEl
  neopaganismo estaba a la orden del d\u00eda en el Tercer Reich. Grunberger a\u00f1ade:\\n\\nEn
  1938 fueron prohibidos en las escuelas el canto de villancicos y las representaciones
  dram\u00e1ticas navide\u00f1as y la misma palabra \u201cNavidad\u201d fue oficialmente
  abolida durante la guerra, para ser sustituida por Julfest. La manipulaci\u00f3n
  sem\u00e1ntica fue un rasgo esencial de la descristianizaci\u00f3n\u2026 Una t\u00edpica
  participaci\u00f3n de matrimonio neopagana publicada en un peri\u00f3dico local
  rezaba as\u00ed: \u201cEn la creencia en la Revelaci\u00f3n Divina hecha a nuestra
  naci\u00f3n a trav\u00e9s de\\n\\nAdolf Hitler, Werner Liefet y Selma Liefet, nacida
  Kunzer, han sellado su uni\u00f3n para toda la vida hoy, Nebelung de 1935\u201d.
  (Nobelung, derivado de Nebel, niebla era noviembre recu\u00e9rdese el Brumario del
  calendario franc\u00e9s de la Revoluci\u00f3n). Cita y par\u00e9ntesis pertenecen
  al texto original.\\n\\nEn 1935, dej\u00f3 de ser obligatoria la oraci\u00f3n en
  las escuelas. (Nos suena muy familiar esta acci\u00f3n). En ese mismo a\u00f1o fueron
  detenidos por la Gestapo 700 pastores protestantes de toda Prusia por haber se\u00f1alado
  y denunciado el neopaganismo desde los p\u00falpitos. Eso ya lo hemos o\u00eddo
  en Canad\u00e1, Estados Unidos y otros pa\u00edses, grandes focos de la \u201cdemocracia\u201d.\\n\\nPodemos
  seguir produciendo datos y pruebas de lo que es capaz un gobierno ap\u00f3stata
  y pagano en el poder. Un gobierno que desecha la Santa Ley de Dios para gobernar,
  para dar lugar a sus corazones ca\u00eddos llenos de cr\u00edmenes, adulterios,
  robos y conceptos de continua rebeli\u00f3n contra Dios. (Mateo 15: 19-20). Entendamos
  que hemos sido llamados a ser testigos (m\u00e1rtires) de Jesucristo en medio de
  las tinieblas. Cuando llegue la hora que el n\u00famero sea completado se consumar\u00e1
  nuestra redenci\u00f3n. (Apoc. 6: 9-17).\\n\\n**BIBLIOGRAF\u00cdA**\\n\\n1. Vall,
  H\u00e9ctor. *Iglesias e ideolog\u00eda nazi*, Editorial S\u00edgueme, Espa\u00f1a,
  1976.\\n\\n2. Hitler, Adolfo. *Mi lucha*, Editorial \u00c9poca, M\u00e9xico, 1979.\\n\\n3.
  Agosto, Patricia, *El Nazismo*, Editorial Latinoamericana, M\u00e9xico, 2008.\\n\\n4.
  Dooyeweerd, Herman, *Las ra\u00edces de la cultura occidental*, CLIE, 1998.\\n\\n5.
  Grunberger, Richard, *Historia social del Tercer Reich*, Ediciones Destino, Espa\u00f1a,
  1976.\\n\\nEl Rvdo. Carlos M Cruz Moya es ministro ordenado de la Iglesia Presbiteriana
  Ortodoxa de los Estados Unidos y pastor de la Iglesia Presbiteriana Reformada en
  San Juan de Puerto Rico. Es profesor de Historia y Literatura con diploma en Teolog\u00eda
  Reformada. Es Profesor del Seminario Reformado del Caribe as\u00ed como la voz nacional
  e internacional del Programa P\u00falpito Reformado. Est\u00e1 casado hace 34 a\u00f1os
  con la Se\u00f1ora Diana M Bonilla Rosa y tienen una hija profesora de espa\u00f1ol.\\n\\nJames
  Wanliss\\n\u201cResisitendo al Drag\u00f3n Verde\u201d\\n\\nVer m\u00e1s en www.clir.net\\n\\nPeter
  Jones\\n\u201cLa UTOP\u00cdA Pagana Venidera\u201d\\n\\nVer m\u00e1s en www.clir.net\\n\\nPAGANISMO
  EN EL SE\u00d1O DE LA IGLESIA\\n\\nPor Guillermo Green\\n\\nDesde el huerto del
  Ed\u00e9n ha habido conflicto entre la serpiente y la simiente santa. Desde los
  albores de la humanidad la lucha tit\u00e1nica ha sido entre los seguidores de Satan\u00e1s
  y el Prometido de Dios con los suyos. Peter Jones nota con justa raz\u00f3n que
  el ap\u00f3stol Pablo en Romanos 1 declara que solo existen dos religiones: la que
  reconoce y adora al Creador, y la que adora y sirve a lo creado.\\n\\nA esta \u00faltima
  se le llama \u201cpaganismo\u201d, un t\u00e9rmino derivado del lat\u00edn *paganus*,
  \u201cdel campo\u201d. Hubo diversas connotaciones de esta palabra, y lleg\u00f3
  a ser empleada como nombre para aquellos que siguieron adorando a los viejos dioses
  despu\u00e9s de que el cristianismo era com\u00fan. Hace m\u00e1s de un siglo, el
  t\u00e9rmino *pagano* se emplea para los que creen en \u201cservir y adorar\u201d
  a lo creado, como afirma Pablo, negando honrar y servir al Creador, Dios. Tanto
  los cristianos como los mismos paganos hoy concuerdan en que un \u201cpagano\u201d
  es una persona que se identifica, adora y sirve a la tierra, o al cosmos.\\n\\nPor
  lo tanto, cuando hablamos del \u201cpaganismo\u201d dentro de la Iglesia, *no* estamos
  hablando de conductas diversas en primer lugar que los cristianos juzgamos indebidas.
  A veces llamamos a alguien \u201cun pagano\u201d porque estafa o miente o algo por
  el estilo. Obviamente estas acciones no concuerdan con lo que Jesucristo pide a
  los suyos, pero no lo hace necesariamente un \u201cpagano\u201d. Aqu\u00ed usamos
  el t\u00e9rmino para describir a los que honran y sirven a lo creado antes que al
  Creador. Esto puede ser el caso con los que viven vidas \u201csantas\u201d, incluso,
  los que son pastores y \u201csiervos\u201d del Se\u00f1or. Por este motivo hago
  la distinci\u00f3n tan importante. Me refiero al fundamento, no a lo externo y lo
  visible.\\n\\n**DIVERSOS ROSTROS DEL PAGANISMO EN LA IGLESIA**\\n\\n*El liberalismo
  teol\u00f3gico o el modernismo*\\n\\nHabiendo hecho la aclaraci\u00f3n arriba, notaremos
  primero la corriente que llamamos \u201cliberalismo teol\u00f3gico\u201d o \u201cmodernismo\u201d.
  Por lo general el liberal no lleva una vida muy desenfrenada, porque de otra forma
  ser\u00eda expulsado de la Iglesia. Es m\u00e1s, el liberal puede llevar una vida
  muy buena, servicial para con muchos, y amable. Pero recordemos que los actos externos
  no definen la fe. Existen hind\u00faes, isl\u00e1micos, ateos, mormones y b\u00e1rbaros
  muy amables y serviciales. El cristiano tiene que aprender a juzgar y medir a las
  personas por medio de los lentes de la Biblia, y no por los sentimientos superficiales
  de nuestra cultura.\\n\\nEl \u201cproblema\u201d de los liberales en la Iglesia
  proviene precisamente porque la mayor\u00eda de los cristianos juzgan seg\u00fan
  el mundo y no seg\u00fan la regla de Dios: las Escrituras. En 1 Juan 4:1 somos exhortados
  as\u00ed: \u201cAmados, no cre\u00e1is a todo esp\u00edritu, sino probad los esp\u00edritus
  si son de Dios; porque muchos falsos profetas han salido por el mundo\u201d. Juan
  estaba simplemente repitiendo la advertencia que Jes\u00fas les hab\u00eda dado
  a sus disc\u00edpulos anteriormente de velar por los falsos profetas (ver Mateo
  7:15; 24:5, 24). Somos\\n\\nmandados por Dios a \u201cprobar\u201d los esp\u00edritus,
  si son de Dios o no. Claramente la regla contra la cual son probados es su Palabra
  inspirada. Y la exhortaci\u00f3n de probar el \u201cesp\u00edritu\u201d indica que
  debemos ahondar m\u00e1s all\u00e1 que sus actos externos. Debemos probar nada menos
  que la esencia de su fe.\\n\\nCon el caso del liberalismo, se levanta en el seno
  de la Iglesia europea y luego americana como una lectura alterna a la interpretaci\u00f3n
  hist\u00f3rica de la fe. Desde Friedrich Schleiermacher (1768\u20131834) y David
  Straus en Alemania, se da el \u00edmpetu a la teolog\u00eda antropoc\u00e9ntrica
  en lugar de teoc\u00e9ntrica. Siempre utilizando los t\u00e9rminos tradicionales
  de \u201cDios, Cristo, fe, salvaci\u00f3n, etc.\u201d, los te\u00f3logos modernistas
  les dan otro sentido. Por ejemplo, Schleiermacher llena p\u00e1ginas y p\u00e1ginas
  explicando la obra de Cristo en t\u00e9rminos que suenan muy hermosos. Pero en medio
  de ello de pronto inserta la salvedad de que no est\u00e1 hablando de un Cristo
  realmente resucitado en carne, cosa que \u00e9l juzga no puede ser probada \u201ccient\u00edficamente\u201d.
  Es decir, el Cristo realmente resucitado no es necesario para su teolog\u00eda.
  Y de hecho, el sistema liberal no depende de un Dios sobrenatural, que existe antes
  y fuera de todo el universo, y que salva soberanamente a los hombres pecadores.
  Las diferentes corrientes posteriores del modernismo simplemente le dieron matices
  distintos a una misma historia: el servicio de los hombres a los hombres; la \u201cautosalvaci\u00f3n\u201d
  de alguna manera. En t\u00e9rminos de Romanos 1, negaron al Creador y sirvieron
  a lo creado.\\n\\nLas formas de liberalismo teol\u00f3gico no terminaron con los
  siglos XVIII y XIV. Como el modernismo es expresi\u00f3n del hombre para el hombre,
  se adaptaba cada vez a su cultura. As\u00ed que, en el siglo XIX cuando la sociedad
  norteamericana se sent\u00eda muy optimista, surge el \u201cSocial Gospel\u201d,
  un mensaje de gente de buena voluntad salvando a otros de buena voluntad. No hac\u00eda
  falta las ense\u00f1anzas del infierno, el Juicio Final, y mucho menos la muerte
  expiatoria de Jesucristo y la justificaci\u00f3n por la imputaci\u00f3n de los m\u00e9ritos
  de Jes\u00fas.\\n\\nCuando estallan las dos guerras mundiales, el tono se vuelve
  m\u00e1s pesimista, y surgen las otras expresiones de \u201cteolog\u00edas de crisis\u201d,
  absorbiendo elementos del existencialismo. Karl Barth y Rodolfo Bultmann son dos
  de los m\u00e1s conocidos. Si bien Barth defiende la resurrecci\u00f3n corporal
  de Cristo, sus definiciones de Dios, la fe, las Escrituras y la salvaci\u00f3n lo
  colocan fuera del cristianismo hist\u00f3rico. Bultmann a\u00fan m\u00e1s, reduce
  el Evangelio al momento de decisi\u00f3n aut\u00e9ntica, desechando todo lo sobrenatural
  de las Escrituras. Estas corrientes y otras similares terminaron matando la Iglesia
  Protestante en Europa, junto con una gran parte de la Iglesia Cat\u00f3lica.\\n\\nEl
  fen\u00f3meno muy corto de la \u201cIglesia Emergente\u201d fue un intento abortivo
  de utilizar el modernismo contra varias tendencias en la Iglesia evang\u00e9lica
  norteamericana. Criticando las Iglesias egoc\u00e9ntricas y las megaiglesias con
  respecto a su comodidad religiosa y social, personas como Rob Bell, Brian McLaren,
  y Doug Pagitt intentaron una reforma con bases provenientes del viejo liberalismo
  antropoc\u00e9ntrico. Por ejemplo, McLaren niega la infabilidad de la Biblia, la
  realidad literal del infierno, y a\u00fan Jesucristo como \u00fanico camino de salvaci\u00f3n,
  mientras aprueba el\\n\\nmatrimonio homosexual (particip\u00f3 en la ceremonia del
  matrimonio de su hijo homosexual). Rob Bell se ha expresado en t\u00e9rminos que
  suenan m\u00e1s budistas que cristianas. En realidad estos \u201creformadores\u201d
  simplemente intentaron aplicar las premisas anti-sobrenaturales del viejo liberalismo
  a su contexto actual. Era simplemente otra cabeza de la Medusa pagana antigua.\\n\\nEl
  colapso del testimonio \u201cevang\u00e9lico\u201d en EE.UU. frente al movimiento
  homosexual es otro indicador de hasta qu\u00e9 punto han absorbido realmente las
  premisas del liberalismo teol\u00f3gico. Iglesia tras Iglesias, y pastor tras pastor
  cae ante la presi\u00f3n social de aceptar la \u201cdiversidad\u201d. Este hecho
  arroja luz sobre lo que el Dr. Peter Jones ha venido advirtiendo hace d\u00e9cadas,
  que las Iglesias de hoy han traicionado el mensaje b\u00edblico de \u201cadorar
  y servir\u201d al Creador, y se han vuelto \u201cmodernistas\u201d, sirviendo a
  lo creado, a la sociedad moderna, y a los gustos humanos.\\n\\nLa teolog\u00eda
  de \u201csalud y prosperidad\u201d\\n\\nLa carencia de fundamento teol\u00f3gico
  en diversos sectores evang\u00e9licos permiti\u00f3 el surgimiento de otras formas
  de paganismo que sirven a lo creado, que se puede denominar \u201cteolog\u00eda
  de la prosperidad\u201d. Kenneth Hagin y Kenneth Copeland fueron dos escritores
  influyentes en Latinoam\u00e9rica que hicieron popular estas aberraciones. Como
  hablaban de la fe en t\u00e9rminos de un \u201cpoder\u201d m\u00e1gico, muchos no
  reconocieron el trasfondo pagano y liberal de su teolog\u00eda. El carismatismo
  r\u00e1pidamente absorbi\u00f3 estos elementos, y surgi\u00f3 lo que conocemos como
  el \u201cneo-pentecostalismo\u201d.\\n\\nPara los neo-pentecostales no hace falta
  que las Escrituras sean ni inspiradas ni infalibles, ya que sus ap\u00f3stoles y
  profetas dictan la voluntad de Dios para cada d\u00eda. El superap\u00f3stol Rony
  Ch\u00e1vez en Costa Rica publica cada a\u00f1o un \u201ccalendario prof\u00e9tico\u201d
  por el cual los fieles deben dirigir sus vidas, y tambi\u00e9n publica por escrito
  sus frecuentes profec\u00edas. Otros de los muchos ap\u00f3stoles y profetas denigran
  la Biblia de varias maneras, animando a sus oyentes a no estudiarla.\\n\\nTampoco
  hace falta la muerte expiatoria de Cristo, ni la imputaci\u00f3n de sus m\u00e9ritos
  para la justificaci\u00f3n, ni la resurrecci\u00f3n de Jes\u00fas, ni mucho menos
  su retorno. Inclusive, dejaron de hablar del rapto y la tribulaci\u00f3n, porque
  su teolog\u00eda se ha vuelto tan \u201ceste mundo\u201d que ni piensan en el retorno
  de Jes\u00fas. El neo-pentecostalismo liberal promueve un concepto de vida m\u00edstico
  que intenta aplicar lo que podr\u00edamos llamar perfectamente el chamanismo. Amuletos,
  frases de poder, rituales prescritos por el ap\u00f3stol o profeta y sobre todo
  el aportar dinero para obtener la prosperidad terrenal son algunos de los elementos
  comunes. Siendo m\u00e1s animista que cristiana, la teolog\u00eda de la prosperidad
  se une al liberalismo teol\u00f3gico pagano en no fundamentarse en la salvaci\u00f3n
  *ab extra*, es decir, \u201cdesde afuera\u201d. Cada ser humano tiene el poder dentro
  de s\u00ed, como dijo Cash Luna de Guatemala: \u201cCada ser humano tiene fe como
  tiene un h\u00edgado. Simplemente es cuesti\u00f3n de ejercerla\u201d. Para este
  falso maestro, la fe no es un don sobrenatural que nos une al Creador trascendente,
  separado de su creaci\u00f3n, sino un poder latente en cada ser humano que espera
  ser despertado por alg\u00fan ap\u00f3stol. Los neo-pentecostales adoran y\\n\\nsirven
  a lo creado, \u00a1a s\u00ed mismos!, antes que al Creador, por m\u00e1s que hablen
  de \u201cDios\u201d, \u201cCristo\u201d, o la \u201cfe\u201d.\\n\\nLeemos en el
  Nuevo Testamento advertencias contra estas mismas tendencias en pasajes tales como
  2 Pedro 2:1-3:\\n\\n\u201c1. Pero hubo tambi\u00e9n falsos profetas entre el pueblo,
  como habr\u00e1 entre vosotros falsos maestros, que introducir\u00e1n encubiertamente
  herej\u00edas destructoras, y aun negar\u00e1n al Se\u00f1or que los rescat\u00f3,
  atrayendo sobre s\u00ed mismos destrucci\u00f3n repentina. 2. Y muchos seguir\u00e1n
  sus disoluciones, por causa de los cuales el camino de la verdad ser\u00e1 blasfemado,
  3. y por avaricia har\u00e1n mercader\u00eda de vosotros con palabras fingidas.
  Sobre los tales ya de largo tiempo la condenaci\u00f3n no se tarda, y su perdici\u00f3n
  no se duerme.\u201d\\n\\n N\u00f3tese el \u00e9nfasis en \u201cpalabras fingidas\u201d,
  lo cual se\u00f1ala que estos falsos maestros usan t\u00e9rminos del cristianismo
  pero con otro sentido enga\u00f1oso.\\n\\nEn 1 Juan 4:18-29 el ap\u00f3stol explica
  por qu\u00e9 algunos salieron de la iglesia para promover sus propios \u201cministerios\u201d
  - porque ten\u00edan el esp\u00edritu del anticristo (v. 18). Estos falsos ap\u00f3stoles
  promov\u00edan una falsa unci\u00f3n (ver vv. 20, 27), enga\u00f1ando a sus oyentes
  con ofrecer secretos esot\u00e9ricos para su felicidad. El ap\u00f3stol Juan dice
  que les est\u00e1 escribiendo para advertirles contra el \u201cenga\u00f1o\u201d
  (v. 26). Y el enga\u00f1o es precisamente el arma principal de esta corriente.\\n\\nA
  pesar de que existan l\u00edderes e Iglesias que no concuerdan con toda la teolog\u00eda
  de los individuos mencionados arriba, sin embargo, esta corriente ha logrado permear\\n\\nmuch\u00edsimos
  sectores de las Iglesias evang\u00e9licas, aun las que se consideran \u201cortodoxas\u201d.\\n\\nElementos
  m\u00e1s obvios del paganismo: ecolog\u00eda pagana y agenda homosexual\\n\\nLos
  paganos declarados han invertido mucho dinero en Iglesias protestantes para influenciarlas
  hacia la adoraci\u00f3n de la tierra a expensas de la adoraci\u00f3n del Creador
  (ver los sorprendentes datos en el libro importante de James Wanliss, *Resistiendo
  al drag\u00f3n verde*, publicado por CLIR, 2015). Han tenido gran \u00e9xito, ya
  que son millares de cristianos que no saben distinguir entre la mayordom\u00eda
  b\u00edblica de la creaci\u00f3n, y la adoraci\u00f3n de la Pachamama. He realizado
  personalmente encuestas por escrito, las cuales revelan que el proselitismo pagano
  emitido por todos los medios (radio, TV, internet, educaci\u00f3n, pol\u00edtica)
  f\u00e1cilmente arroll\u00f3 a los cristianos en porcentajes casi totales.\\n\\nPor
  otro lado, la cantidad de \u201ccristianos\u201d que ahora defiende la diversidad
  sexual parecer\u00eda algo incre\u00edble si no fuera cierto. Cristianos que hace
  cinco o diez a\u00f1os habr\u00edan defendido la ense\u00f1anza b\u00edblica del
  matrimonio mon\u00f3gamo heterosexual, hoy denuncian y critican cualquiera que lo
  haga. \u00a1Qu\u00e9 r\u00e1pido entr\u00f3 el tsunami de la sexualidad pagana!
  Reluce, una vez m\u00e1s, lo d\u00e9bil que era el fundamento teol\u00f3gico de
  la Iglesia evang\u00e9lica. Y est\u00e1 sucediendo lo que sucedi\u00f3 en menor
  grado en la Iglesia primitiva con el gnosticismo. El gnosticismo primitivo pretend\u00eda
  facilitar la divinizaci\u00f3n del ser humano por medio de una uni\u00f3n con las
  fuerzas del cosmos. Siempre hab\u00eda una supresi\u00f3n a\\n\\nla sexualidad b\u00edblica,
  a veces en forma de negar la sexualidad y prohibir toda relaci\u00f3n, o a veces
  en dar rienda suelta a toda expresi\u00f3n sexual. Los cristianos de los primeros
  siglos combatieron vigorosamente el gnosticismo, y no lleg\u00f3 a predominar en
  la Iglesia.\\n\\nEl movimiento de ecolog\u00eda pagana hoy une al ser humano con
  el cosmos de una manera tan estrecha que se absorbe lo humano con los animales,
  los \u00e1rboles, y hasta las rocas. El resultado es la negaci\u00f3n del papel
  del hombre como administrador para Dios, creado a la imagen de Dios, y promueve
  el desprecio del hombre como \u201cuna plaga\u201d sobre la tierra. Anda en boca
  de muchos cristianos estas ideas de forma abierta, mostrando hasta qu\u00e9 punto
  se ha absorbido el paganismo.\\n\\nEn el \u00e1rea de la sexualidad el paganismo
  ha hecho incursiones profundas en la Iglesia tambi\u00e9n. La Iglesia hoy no est\u00e1
  defendiendo y promoviendo la voluntad de Dios para la sexualidad (ver Peter Jones,
  *Uno o dos: viendo un mundo de distinciones*; CLIR). La evidencia de esto son los
  cristianos que ahora defienden el matrimonio homosexual o su estilo de vida. Tambi\u00e9n
  el alcance de la pornograf\u00eda, la infidelidad, y los divorcios en el sector
  evang\u00e9lico dan evidencia del fracaso de una cosmovisi\u00f3n b\u00edblica y
  de haberse rendido ante el paganismo.\\n\\nCONCLUSI\u00d3N\\n\\nLas consecuencias
  de no combatir el paganismo de forma vigorosa siempre han sido desastrosas, tristes
  y da\u00f1inas. As\u00ed como el liberalismo teol\u00f3gico vaci\u00f3 los majestuosos
  templos de Europa, de igual manera el paganismo en forma de la teolog\u00eda de
  la prosperidad, o la ecolog\u00eda pagana/agenda homosexual est\u00e1 arrebatando
  la Biblia de nuestras manos. Tal vez no se vac\u00edan los templos, pero templos
  sin Biblia y sin Evangelio no son Iglesias cristianas.\\n\\nPodemos aprender de
  nuestros padres espirituales en la Iglesia primitiva de los primeros siglos. Su
  lucha fue dura, a veces a costo de su propia vida. Pero dejaron el legado del verdadero
  Evangelio. Los credos de Atanasio y de Nicea dan evidencia del valor e integridad
  b\u00edblica de estos hombres de fe. La historia juzgar\u00e1 y condenar\u00e1 a
  todos los pastores e Iglesias que est\u00e1n cediendo al paganismo en nuestro tiempo.
  \u00a1Que el Se\u00f1or nos encuentre de su lado!\\n\\nGuillermo Green ha pastoreado
  en Costa Rica con su esposa Aletha por m\u00e1s de 30 a\u00f1os. Actualmente es
  el Secretario Ejecutivo de la Confraternidad Latinoamericana de Iglesias Reformadas
  y autor de varios libros publicados por la misma. \u00c9l y su esposa tienen cuatro
  hijos.\\n\\nVIDA PIADOSA EN UNA CULTURA SEXUALMENTE INMORAL\\n\\nPor John Freeman\\n\\nLa
  llamada entr\u00f3 a mi oficina hace algunos meses. Una mujer ped\u00eda que se
  le retirara de nuestra lista de correo. Le asegur\u00e9 que cumplir\u00edamos con
  su solicitud. Le pregunt\u00e9 la raz\u00f3n por la que ya no quer\u00eda recibir
  nuestro bolet\u00edn. \u201cSi la homosexualidad es un regalo de Dios, entonces
  su ministerio est\u00e1 causando un gran da\u00f1o\u201d contest\u00f3.\\n\\nAunque
  su respuesta no me sorprendi\u00f3, su respuesta, teniendo en cuenta su contexto
  y su iglesia s\u00ed. Las personas en c\u00edrculos evang\u00e9licos est\u00e1n
  siendo atra\u00eddas cada vez m\u00e1s por los mismos enga\u00f1os. Me comparti\u00f3
  que hab\u00eda sido cristiana por m\u00e1s de veinte a\u00f1os y estaba involucrada
  en el ministerio femenil de su iglesia. Yo estaba al tanto que ella pertenec\u00eda
  a una iglesia, siempre inclinada a una tradici\u00f3n teol\u00f3gica reformada,
  la cual ten\u00eda, y a\u00fan tiene, un ministerio fuerte en el p\u00falpito basado
  firmemente en la Palabra de Dios, viendo la Biblia como la autoridad inspirada por
  Dios.\\n\\nEra obvio que hab\u00eda sido persuadida de que la homosexualidad es
  b\u00edblicamente permisible. \u00bfC\u00f3mo se han infiltrado este y otros puntos
  de vista da\u00f1inos sobre el pecado sexual en la iglesia? Una respuesta detallada
  a esa pregunta por s\u00ed sola podr\u00eda ser el tema de un libro completo. En
  po-\\n\\n1 Tomado y traducido de Table Talk magazine. \u00a9Ligonier Ministries.
  Usado con el debido permiso.\\n\\ncas palabras, es porque ahora \u201cotras voces\u201d,
  mucho m\u00e1s que nunca, compiten por nuestros o\u00eddos, pidiendo igual autoridad
  o incluso sobrepasando la de las Escrituras. A\u00fan m\u00e1s devastador es el
  hecho que muchos en nuestras iglesias escuchan estas voces.\\n\\nAlgunas de estas
  voces piden la ordenaci\u00f3n de homosexuales en el Ministerio del Evangelio, y
  en algunas denominaciones vemos como esto se persigue con poca o ninguna consecuencia,
  cuando no es celebrada de todo coraz\u00f3n. En algunas instancias, la disciplina
  de la iglesia es amenazada e impuesta, no para aquellos que abogan por la inmoralidad
  sexual, sino para los que contienden contra la teolog\u00eda y comportamientos no
  b\u00edblicos. Tambi\u00e9n pienso en esas iglesias en los pa\u00edses bajos que
  una vez predicaron la teolog\u00eda Reformada y en donde ahora es ilegal hablar
  de homosexualidad de manera degradante, y muchas iglesias una vez pr\u00f3speras
  se presentan ahora como museos y tiendas de segunda.\\n\\n\u00bfC\u00f3mo podemos
  explicar nuestro propio deslizamiento moral hacia estas cosas? Estos dos factores,
  la competencia en nuestros o\u00eddos y el hecho que escuchamos activamente, est\u00e1n
  causando confusi\u00f3n sin precedentes, de la misma forma que abrir las puertas
  al pecado no abordado a florezca en la iglesia. La verdad es que, esta persona que
  llam\u00f3 hab\u00eda ca\u00eddo en una nueva ola de teolog\u00eda, yo la llamo
  \u201cla teolog\u00eda de Oprah, 20/20, y la Hora Estelar en Vivo\u201d. Estos \u00edconos
  del pop y los programas de televisi\u00f3n est\u00e1n donde muchos, incluso esos
  en la iglesia, se informan sobre una variedad de temas b\u00edblicos, en especial
  los sexuales. El liderazgo de la iglesia necesita darse cuenta que estos puntos
  de vista no son tan raros escasos como quisi\u00e9ramos pensar, a menudo solo no
  son expresados.\\n\\nParte de abordar esta gran distorsi\u00f3n y enga\u00f1o sobre
  el sexo y la sexualidad comienza con darse cuenta que lo que sea que est\u00e1 afectando
  e impactando la cultura siempre impacta a los que se sientan en nuestras bancas.
  Vivimos en una cultura en la que el sexo vende de todos, una gran estrategia para
  atraer clientes. La inmoralidad sexual en todas sus formas desfila ahora como una
  tarifa leg\u00edtima para todos, gracias en gran manera a los medios de comunicaci\u00f3n
  y el sector de entretenimiento. Nos deber\u00eda sorprendernos que puntos de vista
  incorrectos y distorsionados sobre el sexo y, de hecho, la inmoralidad sexual sean
  comunes en la iglesia de hoy.\\n\\n\u00bfPuede negarse que la iglesia ha sido y
  continuar\u00e1 siendo seducida a estos enga\u00f1os? Cuando combinamos estos hechos
  con la realidad de que los creyentes pueden y luchan con varias formas de su sexualidad
  ca\u00edda y corazones pecaminosos, puede existir un clima potencialmente explosivo
  y paralizante. Por ejemplo, el uso de la pornograf\u00eda entre creyentes est\u00e1,
  en mi opini\u00f3n, en un nivel de epidemia en la iglesia. Esto por supuesto causa
  un da\u00f1o inmenso en el coraz\u00f3n del hombre y siempre impacta, directa o
  indirectamente, sus responsabilidades y relaciones. En resumen, la pornograf\u00eda
  y todas las formas de pecado sexual roban a los hombres el liderazgo piadoso que
  est\u00e1n llamados a brindar a las vidas de los m\u00e1s cercanos a ellos, les
  roba la confianza en las verdades de la Escritura y su entusiasmo a favor de las
  cosas de Dios, y finalmente, socava el lugar de Dios como ser supremo al cual somos\\n\\nllamados
  a adorar y servir y lo reemplaza con un objeto de adoraci\u00f3n m\u00e1s controlable
  y predecible.\\n\\nEstamos hablando de una crisis severa de adoraci\u00f3n e idolatr\u00eda.
  De hecho \u00bfno nos dice Romanos 1:25 que \u201ccambiaron la verdad de Dios por
  la mentira, honrando y dando culto a las criaturas antes que al Creador\u201d? \u00bfNo
  es esta la inclinaci\u00f3n natural del coraz\u00f3n ca\u00eddo? Pablo habla a una
  cultura dada a la idolatr\u00eda. El Dr. Edward T. Welch, en su libro Adicciones:
  Un banquete en la tumba, llama a esas idolatr\u00edas, en el fondo, \u201cdesorden
  de adoraci\u00f3n\u201d. Lo que significa que estamos presenciando un fracaso masivo
  en la adoraci\u00f3n a Dios como Creador, y estamos, como cultura y grados dentro
  de la iglesia, buscando como norma adorar a la criatura. Es un hecho que vivimos,
  cada vez m\u00e1s, en un mundo en el que \u201cla pornograf\u00eda es la norma\u201d.\\n\\nPablo,
  nuevamente, da un mandato de redenci\u00f3n a la iglesia primitiva como aquellos
  apartados de la cultura id\u00f3latra en la que se encuentran, diciendo: \u201cpues
  la voluntad de Dios es vuestra santificaci\u00f3n; que os apart\u00e9is de fornicaci\u00f3n;
  que cada uno de vosotros sepa tener su propia esposa en santidad y honor; no en
  pasi\u00f3n de concupiscencia, como los gentiles que no conocen a Dios\u201d (1
  Tesalonicenses 4:3-5)\\n\\nUna observaci\u00f3n interesante sobre estos y muchos
  otros pasajes, en especial las ep\u00edstolas pastorales, es que en realidad est\u00e1n
  ah\u00ed. Una buena parte de estas ep\u00edstolas est\u00e1 dedicada a tratar con
  el hecho que la lujuria desenfrenada y las tentaciones pecaminosas eran realidades
  con las que la iglesia primitiva debi\u00f3 tratar. Hablan del hecho que ambas,
  la cultura y propio coraz\u00f3n pecaminoso, eran\\n\\nfuerzas con la que el creyente
  deb\u00eda luchar. \u00a1Son tambi\u00e9n testimonio que una puede hacer frente
  a estas cosas si se rinde a una fidelidad m\u00e1s grande que la cultura y un coraz\u00f3n
  pecaminoso!\\n\\nUn papel importante para la iglesia en el mundo confuso y complicado
  de hoy es nutrir un ambiente en el que las personas pueden ser abiertas sobre lo
  que pasa en sus corazones, en sus vidas y matrimonios respecto a la tentaci\u00f3n
  del pecado sexual. Necesitamos ayudarles a ser honestos sobre las fuerzas que compiten
  en sus corazones y animarles a la honestidad implacable sobre las tentaciones, y
  fallos, a los que se enfrentan. La iglesia es el lugar donde se modela la verdad
  y la gracia, es el lugar donde ayudamos a convencer y recordarnos unos a otros que
  adorar a Dios ofrece mucha m\u00e1s vida real que las atracciones que nuestros pecados
  e idolatr\u00edas. La seducci\u00f3n no necesita continuar, si somos conscientes
  de las mentiras que nuestra cultura presenta y estamos dispuestos trabajar con lo
  que encontramos impactando las vidas de nuestra gente para la gloria de Cristo.\\n\\nTraducido
  por Melissa Granados\\n\\nJohn Freeman es el presidente de Harvest USA, un ministerio
  reformado que ayuda a individuos afectados por pecado sexual.\\n\\nSOY UNA NI\u00d1A
  DE 10 A\u00d1OS ATRAPADA EN EL CUERPO DE UN HOMBRE DE 40.\\n\\n\u00a1UN VERDADERO
  EJEMPLO!\\n\\n\u00a1QU\u00c9 VALOR!\\n\\nSOY UN HOMBRE ATRAPADO EN EL CUERPO DE
  UNA MUJER, Y QUIERO CASARME CON UN \u00c1RBOL.\\n\\n\u00a1CELEBRAMOS TU CORDURA!\\n\\n\u00a1DIGNO
  DE IMITAR!\\n\\nSOY HOMBRE, CREADO A IMAGEN DE DIOS CON DIGNIDAD...\\n\\n\u00a1BUU!
  \u00a1S\u00c1QUENLO!\\n\\n\u00a1EST\u00c1 LOCO!\\n\\n\u00a1NO OIGO NADA... SOY DE
  PALO...!\\n\\nREDIMIENDO LA SEXUALIDAD REDEFINIDA: EL PODER DE DIOS PARA LA VERDADERA
  LIBERTAD SEXUAL\\n\\nPor Jennifer Forbes\\n\\nLa Escritura nos exhorta repetidamente
  a honrar el matrimonio y el sexo como un regalo perfecto de Dios. Rebelarse contra
  las prescripciones b\u00edblicas para el sexo y el matrimonio no es la liberaci\u00f3n
  sino confusi\u00f3n y esclavitud.\\n\\nEL CLIMA SEXUAL ACTUAL\\n\\nEn nuestra cultura
  contempor\u00e1nea canadiense, nos enfrentamos a diario con la redefinici\u00f3n
  de algo muy intr\u00ednseco a nosotros como seres humanos: nuestra sexualidad. Desde
  los medios de comunicaci\u00f3n hasta las aulas, desde los lugares de trabajo hasta
  las instituciones de poder, las ideas y pr\u00e1cticas de la sexualidad se expresan,
  debaten, desfilan y cambian.\\n\\nLos puntos de vista tradicionales est\u00e1n fuera
  de moda, los llamados puntos de vista \u201cprogresistas\u201d est\u00e1n a la moda
  y, a pesar del agitado discurso con sus campeones de la liberaci\u00f3n sexual en
  todos los frentes, la gente est\u00e1 confundida, confundida acerca de lo que somos
  como seres humanos, lo que significa ser hombre y mujer, y cu\u00e1les son\\n\\n1
  Tomado y traducido del \u00a9 Ezra Institute for Contemporary Christianity. Todos
  los derechos reservados. Usado con el debido permiso.\\n\\nlos par\u00e1metros para
  las relaciones saludables y la expresi\u00f3n sexual.\\n\\n**UNA CULTURA E IGLESIA
  ENGA\u00d1ADA**\\n\\nEn Juan 8, la Escritura deja claro que Satan\u00e1s es un mentiroso
  y el padre de la mentira, que no hay verdad en \u00e9l y que le gusta enga\u00f1arnos.
  La confusi\u00f3n nos aleja del Dador de la vida y la verdad, Dios, y en su lugar
  nos gu\u00eda a \u201cmaestros conforme a [nuestros] propias pasiones\u201d, conforme
  apartamos de la verdad el o\u00eddo y volvemos a las f\u00e1bulas (2 Tim. 4:3-4).\\n\\nCuando
  se enga\u00f1a a la Iglesia, esta no puede cumplir con su testimonio prof\u00e9tico
  en el mundo de anunciar la Palabra de la verdad y el Reino de Dios que est\u00e1
  a la mano. Una iglesia confundida pierde su sabor y deja de ser la luz del mundo
  y una ciudad en un monte (Mat. 5:14).\\n\\n**LA RESPUESTA CRISTIANA**\\n\\nComo
  cristianos debemos desarrollar una visi\u00f3n de la sexualidad humana, la virilidad
  y la feminidad a partir de un an\u00e1lisis de la Escritura. Tenemos que empezar
  con un entendimiento de qui\u00e9n es Dios, y entonces podemos conocer nuestra identidad
  y prop\u00f3sito en el mundo en relaci\u00f3n con \u00e9l. La Escritura proporciona
  todo lo que necesitamos para este entendimiento.\\n\\nIr junto con la marea de filosof\u00edas
  \u2018progresistas\u2019 y siempre cambiantes de los hombres o quedarse en la simple
  tradici\u00f3n es inaceptable. Hay que investigar a fondo todo el consejo de Dios
  para entender el prop\u00f3sito y los par\u00e1metros de la sexualidad. La Escritura
  establece claramente que la sexualidad humana es intr\u00ednseca al orden de la
  creaci\u00f3n y que la intenci\u00f3n de Dios para ella es felicidad, bendici\u00f3n
  y descendencia; es un regalo.\\n\\nSin embargo, nuestra rebeli\u00f3n contra Dios
  destruye las relaciones y la felicidad; lo cual es vandalismo y no libertad. Necesitamos
  identificar los errores en la creencia, el pensamiento y la pr\u00e1ctica, los cuales
  nos permite justificar nuestra desviaci\u00f3n sexual y pecado. Esta edici\u00f3n
  del Jubileo se\u00f1ala muchos de estos de forma expl\u00edcita, por lo que podemos
  ver claramente el pecado, y alejarnos de \u00e9l en arrepentimiento.\\n\\n**LA BONDAD
  DEL MATRIMONIO**\\n\\nBuscamos no solo proporcionar diagn\u00f3stico, sino tambi\u00e9n
  regocijarse en la bondad del matrimonio. El matrimonio est\u00e1 fuertemente custodiado
  en la ley b\u00edblica y celebrado en las canciones y poemas b\u00edblicos. El autor
  de Hebreos nos exhorta hacia el ideal: \u201cHonroso sea en todos el matrimonio,
  y el lecho sin mancilla\u201d (Heb: 13.4). Como pueblo de Dios, podemos crear una
  cultura que exalte y se deleite en la bondad de la bendici\u00f3n de Dios de la
  masculinidad y feminidad, que proteja nuestra propia castidad y la de los dem\u00e1s,
  apoye y cree condiciones para matrimonios saludables centrados en Dios que sean
  un testimonio al mundo y un anticipo del cielo, y acojan la bendici\u00f3n y responsabilidad
  de criar a los hijos para la gloria de Dios.\\n\\nLIBERTAD EN CRISTO\\n\\nEl poder
  de la sangre derramada de Cristo puede romper el v\u00ednculo de pecado sexual,
  y ning\u00fan pecado es demasiado grande como para tenernos en sus garras: ni el
  adulterio, ni la homosexualidad, ni la promiscuidad, ni la adicci\u00f3n pornogr\u00e1fica,
  ni ning\u00fan otro. No nos liberamos con facilidad del pecado y las adicciones,
  pero las Escrituras son eficaces en indicarnos c\u00f3mo cumplir con la tarea si
  estamos dispuestos a obedecer y hacer lo que estamos llamados a hacer. Jes\u00fas
  orden\u00f3 la amputaci\u00f3n radical como el ant\u00eddoto para la lujuria (Mat.
  5:28-30). Debemos quitar todas las fuentes de provocaci\u00f3n con el fin de sacar
  los deseos del viejo hombre y presentar nuestros miembros a Dios como instrumentos
  de justicia (Rom. 6:12-13). No es suficiente solo dejar de practicar un pecado;
  hay que sustituirlo por una santidad apropiada. Esta es la receta de Dios para superar
  la esclavitud del pecado y es un m\u00e9todo probado impartido por verdaderos consejeros
  b\u00edblicos (Ef. 4:20-24).\\n\\nComo creyentes se nos ha dado el Esp\u00edritu
  Santo para convencer y capacitarnos y le instamos a no apagar el Esp\u00edritu (1
  Tes. 5:19), sino a abrazar la obra del Esp\u00edritu en su vida para sanar y santificarle,
  haci\u00e9ndole m\u00e1s semejante al modelo de Cristo, Recomendamos que los que
  luchan con el continuo pecado sexual busquen una apropiada rendici\u00f3n de cuentas
  b\u00edblica y apoyo en el sacerdocio de creyentes para liberarse de estas luchas.
  Porque \u201cen todas estas cosas somos m\u00e1s que vencedores por medio de aquel
  que nos am\u00f3\u201d (Ro. 8:37).\\n\\nSolo en Cristo podemos encontrar sanidad;
  solo \u00e9l puede restaurar nuestra sexualidad rota y hacernos personas completas.
  \u201cY a aquel que es capaz de hacer mucho m\u00e1s abundantemente de lo que pedimos
  o entendemos, seg\u00fan el poder que act\u00faa en nosotros, a \u00e9l sea gloria
  en la iglesia y en Cristo Jes\u00fas por todas las generaciones, por los siglos
  de los siglos. Am\u00e9n\u201d (Efesios 3:20-21).\\n\\nTraducido por Melissa Granados\\n\\nJennifer
  es fundadora y directora de Safe Families Canada y tambi\u00e9n sirve como Directora
  de Desarrollo para el Ezra Institute for Contemporary Christianity. Originaria de
  London, ON, fue hija de misioneros en Zambia y actualmente se radica en Toronto.
  Jennifer obtuvo un B.A. en Desarrollo Internacional en la Universidad York con \u00e9nfasis
  en ciencias pol\u00edticas.\\n\\nCOMBATIENDO LA POBREZA: CONFERENCIA PARA PASTORES\\n\\nPor
  el pastor Ben Di Zi\u00f3n\\n\\nLa Biblia nos da todos los secretos para que su
  Iglesia no siga en condiciones de pobreza, sino que las riquezas del mundo sean
  trasladadas al reino de Dios. Uno de los problemas m\u00e1s graves que asedia a
  los pastores, es el conformismo en el \u00e1rea de buscar a los ricos que tienen
  recursos necesarios para el reino de Dios. El mismo Se\u00f1or dio \u00f3rdenes
  expl\u00edcitas, diciendo:\\n\\n\u201cVe por los caminos y por los vallados, y fu\u00e9rzalos
  a entrar; para que se llene mi casa\u201d (Lucas 14:23).\\n\\nEs claro que la casa
  (la Iglesia) debe de estar \u201cllena\u201d de las riquezas de los imp\u00edos.
  Y Jes\u00fas dice claramente que debemos aplicar \u201cfuerza\u201d, es decir, bastante
  vigor, en este empe\u00f1o. Por esta raz\u00f3n, muchas Iglesias y muchos pastores
  contin\u00faan en la pobreza. Andan t\u00edmidos y miedosos. A muchas Iglesias les
  faltan los recursos para realizar sus ministerios. A muchos pastores les faltan
  los recursos para sus necesidades personales. Nada de esto es apropiado para los
  siervos del Se\u00f1or. En esta conferencia haremos un estudio profundo de lo que
  la Biblia ense\u00f1a sobre estos asuntos.\\n\\nEl texto escogido para hoy es de
  Hechos 8:26, 27: \u201cUn \u00e1ngel del Se\u00f1or habl\u00f3 a Felipe, diciendo:
  Lev\u00e1ntate y ve hacia el sur, por el camino que desciende de Jerusal\u00e9n
  a\\n\\nGaza, el cual es desierto. Entonces \u00e9l se levant\u00f3 y fue. Y sucedi\u00f3
  que un et\u00edope, eunuco, funcionario de Candace, reina de los et\u00edopes, el
  cual estaba sobre todos sus tesoros, y hab\u00eda venido a Jerusal\u00e9n para adorar\u201d.\\n\\n**DIRECCI\u00d3N
  DIVINA**\\n\\nLo primero que debemos notar es que el siervo de Dios, Felipe, recibe
  \u00f3rdenes divinas. Hab\u00eda estado c\u00f3modo all\u00e1 en su casa. Leemos
  en Hechos 21 que Felipe ten\u00eda cuatro hijas. Este siervo de Dios estaba dedicando
  demasiado tiempo a su familia, produciendo hijas, cuidando de su esposa, cuando
  Dios ten\u00eda otros trabajos m\u00e1s importantes para \u00e9l. Felipe no se estaba
  preocupando por \u201cforzar\u201d a los ricos a entrar al reino. Por eso el mismo
  \u201c\u00c1ngel del Se\u00f1or\u201d tuvo que hablarle. Este mensajero ang\u00e9lico
  lleg\u00f3 con un mensaje directamente de Jesucristo, y el mensaje era contundente,
  urgente, y vigoroso: \u201c\u00a1Lev\u00e1ntate y ve!\u201d\\n\\nEste mismo llamado
  llega hoy mismo a cada pastor c\u00f3modo, tranquilo, conformista: \u201c\u00a1Lev\u00e1ntese!
  \u00a1Camine!\u201d Las riquezas del mundo nunca le llegar\u00e1n por arte de magia.
  Debe esforzarse. A\u00fan m\u00e1s, tendr\u00e1 que atravesar desiertos primero,
  lo cual nos conduce al siguiente punto.\\n\\n**ATRAVESAR DESIERTOS**\\n\\nDios no
  env\u00eda a Felipe a los palacios de los reyes primero. No. Debe aprender a ministrar
  en el desierto primero. Aqu\u00ed hay una gran ense\u00f1anza para cada uno de nosotros
  presentes hoy. \u00bfQu\u00e9 significa este \u201cdesierto\u201d a d\u00f3nde Dios
  lo env\u00eda? Pues, recordemos que el desierto era el lugar\\n\\nde prueba para
  el pueblo de Dios. Aqu\u00ed la obediencia de Felipe ser\u00e1 probada. Si es obediente,
  tendr\u00e1 \u00e9xito. Si no obedece, tendr\u00e1 fracaso. \u00a1Ojo! todo pastor,
  la regla es muy clara, la obediencia producir\u00e1 \u00e9xito.\\n\\nOtra cosa que
  notar es el lugar espec\u00edfico: \u201cGaza\u201d. Este lugar fue la guarnici\u00f3n
  antigua de los filisteos, que causaron tanto problema para el pueblo de Dios. F\u00edjese
  que Dios est\u00e1 se\u00f1alando que las riquezas de los imp\u00edos les ser\u00e1n
  quitadas, \u00a1aunque sean guardadas con armas! Nada podr\u00e1 resistir al siervo
  de Dios que act\u00faa con valent\u00eda. Dios env\u00eda a Felipe al desierto,
  al mismo lugar de los filisteos armados, para hablar con \u00bfqui\u00e9n? \u00a1Con
  el mismo tesorero de la reina Candace!\\n\\n**LOS RICOS SE RINDEN**\\n\\nAl que
  Felipe se dirige se describe como un \u201calto funcionario\u201d de la corte, \u00e9l
  que estaba sobre todos los tesoros de la reina Candace. El plan claro de Dios es
  evidente. Dios ha determinado trasladar las riquezas de los imp\u00edos a la Iglesia,
  y tenemos aqu\u00ed un claro ejemplo de este proceso. Hab\u00eda miles de personas
  a quienes Felipe pudiera hablar. Pero el \u00c1ngel del Se\u00f1or lo envi\u00f3
  a uno solo: al tesorero de la reina.\\n\\nNotemos que este hombre era de otra raza
  que Felipe, un et\u00edope. Dios nos est\u00e1 ense\u00f1ando que no debemos mirar
  las cosas externas. El dinero no tiene color de piel, ni raza, ni lengua. Felipe
  no deb\u00eda mirar las cosas externas, que nosotros muchas veces miramos. \u00a1Cu\u00e1ntas
  oportunidades se pierden porque los pastores inexpertos miran lo superficial!\\n\\nDeteng\u00e1monos
  en este punto un momento. F\u00edjese muy bien en lo que les voy a compartir, porque
  le voy a decir lo que Dios me ha dado por visi\u00f3n y sue\u00f1o. Felipe no se
  deja llevar por ninguna otra cosa fuera de su misi\u00f3n: alcanzar al tesorero
  de la reina. Noten, por favor, que este tesorero no es ni muy amable. No saluda,
  ni le pregunta a Felipe qui\u00e9n era. No muestra ning\u00fan inter\u00e9s personal
  en Felipe. Pero Felipe ignora todo eso. El \u00c1ngel de Dios lo insta a \u201cacerarse
  y juntarse al carro\u201d del tesorero. Felipe deb\u00eda poner de lado sus propios
  sentimientos personales en favor de una meta m\u00e1s alta.\\n\\nEn mi experiencia
  con muchos pastores, he visto que se pierden muchas oportunidades por andar con
  sentimentalismos, o por estar esperando halago personal, o buen tratamiento personal.
  Miren bien. Nada de eso importa. A usted no le debe importar si le cae bien a las
  personas o no. Cero inter\u00e9s debe poner a ello. Lo que importa es traer el dinero
  de los filisteos a las arcas santas de Jerusal\u00e9n, nada m\u00e1s. Olv\u00eddense
  de lo dem\u00e1s, como lo hizo Felipe.\\n\\n\u00bfQu\u00e9 pas\u00f3 cuando Felipe
  fue obediente? El tesorero de la reina se rindi\u00f3 rapidito. Pidi\u00f3 ser bautizado
  en dos momentos, mostrando su sumisi\u00f3n al siervo de Dios. Y aunque el pasaje
  no dice expl\u00edcitamente, entre l\u00edneas podemos saber que el tesorero se
  comprometi\u00f3 con trasladar los dineros de la reina a la Iglesia. \u00bfC\u00f3mo
  lo sabemos? Leemos que se fue \u201cgozoso\u201d (v. 39). En el lenguaje de Dios,
  esto significa que regres\u00f3 al palacio de la reina \u201cgozoso\u201d de cumplir
  con su tarea de cristiano: la de trasladar las riquezas del mundo a las arcas de
  Dios.\\n\\nEste viaje del tesorero a Jerusal\u00e9n fue solo el primero. Es casi
  seguro que cada a\u00f1o volvi\u00f3 a los ap\u00f3stoles, pero con el carro lleno
  de tesoros. \u00bfC\u00f3mo podemos saber esto? Porque tenemos varios ejemplos de
  lo que hac\u00edan los cristianos mientras se convert\u00edan a Dios. Dar\u00e9
  algunos de estos ejemplos.\\n\\n**Antioqu\u00eda** - \u201cEntonces los disc\u00edpulos,
  cada uno conforme a lo que ten\u00eda, determinaron enviar socorro a los hermanos
  que habitaban en Judea; lo cual en efecto hicieron, envi\u00e1ndolo a los ancianos
  por mano de Bernab\u00e9 y de Saulo\u201d (Hechos 11:29,30). Aqu\u00ed vemos que
  los cristianos en Antioqu\u00eda, apenas eran convertidos, env\u00edan su dinero
  a los ap\u00f3stoles. Estas son las acciones naturales de los convertidos. Antes,
  cuando eran imp\u00edos, usaban su dinero para s\u00ed mismos. Ahora comprendieron
  que el dinero \u201cimp\u00edo\u201d deb\u00eda ser trasladado bajo la administraci\u00f3n
  de los siervos de Dios.\\n\\n**Corintios** - Pablo insta a los corintios a que no
  olvidaran recoger su ofrenda \u201cpara los santos\u201d (1 Corintios 16:1). Estas
  ofrendas, una vez m\u00e1s, eran enviadas a los ap\u00f3stoles y l\u00edderes de
  la Iglesia. De manera, vemos una vez m\u00e1s un traslado de dineros que antes pertenec\u00edan
  al mundo imp\u00edo a los santos de Dios.\\n\\nTodos estos ejemplos nos ayudan a
  saber a ciencia cierta que el tesorero de la reina Candace con seguridad envi\u00f3
  sus tesoros a los l\u00edderes.\\n\\nCONCLUSI\u00d3N\\n\\nEl pastor exitoso necesita
  con urgencia aprender las claves aqu\u00ed compartidas. Debe ser una persona enfocada
  en la meta, sin mirar asuntos secundarios. Debe estar persuadido de que la voluntad
  de Dios es trasladar el dinero del mundo a las arcas santas que est\u00e1n bajo
  su administraci\u00f3n. No debe preocuparse por caerle bien a las personas, sino
  cumplir su tarea. Y debe enfatizar desde el primer momento que es deber de todo
  cristiano diezmar, y a\u00fan m\u00e1s, despojar a los mundanos para llevar su dinero
  al siervo de Dios.\\n\\nSi hace caso a mis consejos, no tengo duda de que cada uno
  que me escucha aqu\u00ed ser\u00e1 un pastor exitoso.\\n\\nSeminario Balaam\\n\\nCiudad
  de Gomorra\\n\\nEl pastor Ben Di Zi\u00f3n ha sido pastor de veinte megaiglesias,
  teniendo mucho \u00e9xito en todos sus empe\u00f1os. Tambi\u00e9n ha sido conferencista
  en 666 pa\u00edses del mundo. Es profesor em\u00e9rito en el Seminario Balaam aqu\u00ed
  en Gomorra, y estamos agradecidos que pueda compartir sus experiencias y consejos
  con los pastores y alumnos del Seminario.\\n\\nENCUENTRA LAS DIFERENCIAS\\n\\nLA
  BIBLIA NO ES INFALIBLE NI ABSOLUTA. PODEMOS INTERPRETARLA SEG\u00daN NOS PAREZCA.\\n\\nCIERTAMENTE,
  NO MORIR\u00c9IS...\\n\\nDEBEMOS BUSCAR EL MOVER DEL \\\"ESPIRITU\\\"; NUEVAS REVELACIONES...
  NUEVAS EXPERIENCIAS...\\n\\nSER\u00c1N ABIERTOS VUESTROS OJOS...\\n\\n\u00a1SOMOS
  HIJOS DE DIOS Y TENEMOS SU PODER! \u00a1PODER SOBRE LA ADVERSIDAD, SOBRE LA POBREZA
  Y LA ENFERMEDAD! \u00a1DECL\u00c1RALO!\\n\\n\u00a1Y SER\u00c9IS COMO DIOS!\\n\\nRESPUESTAS:
  NO HAY NINGUNA\\n\\n\u201cCAMBIO CLIM\u00c1TICO\u201d: \u00bfUN SALTO DE FE? 1\\n\\nPor
  E. Calvin Beisner\\n\\nEsta noche en la Universidad de Duke, habr\u00e1 una mesa
  redonda titulada \u201cEl cambio clim\u00e1tico: No un salto de fe\u201d. Entre
  los anfitriones del evento est\u00e1 el grupo de J\u00f3venes Evang\u00e9licos de
  Acci\u00f3n por el Clima, una rama de la Red Evang\u00e9lica Ambiental.\\n\\nEllos
  y el Instituto Nicholas para Soluciones de la Pol\u00edtica Ambiental, la Escuela
  Nicholas de Medio Ambiente, y el Instituto Kenan para la \u00c9tica est\u00e1n trayendo
  a Amy Pickle del Instituto Nicholas, a Megan Mullin de la Escuela Nicol\u00e1s,
  a David Toole del Instituto Kenan y a Katharine Hayhoe, una profesora asociada de
  ciencias pol\u00edticas y directora del Centro de Ciencias del Clima de la Universidad
  Tecnol\u00f3gica de Texas, para discutir por qu\u00e9 los cristianos deben preocuparse
  por el cambio clim\u00e1tico.\\n\\nEsa es una buena idea en principio, pero ese
  t\u00edtulo, \u201cEl cambio clim\u00e1tico: No un salto de fe\u201d, me hizo preguntarme:
  \u00bfTiene esto la intenci\u00f3n de presentar el \u201ccambio clim\u00e1tico\u201d
  como algo en contraste con la fe religiosa en general, o tal vez la fe cristiana
  en particular?\\n\\nEl fil\u00f3sofo dan\u00e9s del siglo XIX S\u00f8ren Kierkegaard,
  entre los primeros existencialistas, como es sabido ense\u00f1\u00f3 que el compromiso
  cristiano es un \u201csalto de fe\u201d, que abarca las\\n\\n1 Tomado y traducido
  de The Cornwall Alliance for the Stewardship of Creation. Todos los derechos reservados.
  Usado con el debido permiso.\\n\\nense\u00f1anzas cristianas sin evidencia e incluso
  contrarias a esta.\\n\\nA pesar de que esta comprensi\u00f3n de la fe cristiana
  era la ant\u00edtesis del cuerpo principal de la ense\u00f1anza cristiana por los
  anteriores dieciocho siglos, tuvo \u00e9xito, y hoy en d\u00eda muchos que se llaman
  evang\u00e9licos entienden su fe cristiana de esa manera. Abrazan el \u201csalto
  de fe\u201d de Kierkegaard, a veces incluso llam\u00e1ndolo un \u201csalto ciego
  de fe\u201d.\\n\\nTal mensaje habr\u00eda conmocionado al ap\u00f3stol Juan, quien
  escribi\u00f3 que Juan el Bautista vino a dar testimonio [que denotaba testimonio
  en un juicio para establecer un hecho] de Jes\u00fas (Juan 1: 6-7), y que \u201cJes\u00fas
  hizo muchas otras se\u00f1ales en la presencia de los disc\u00edpulos, las cuales
  no est\u00e1n escritas en este libro; pero estas se han escrito para que cre\u00e1is
  que Jes\u00fas es el Cristo, el Hijo de Dios, y para que creyendo, teng\u00e1is
  vida en su nombre\u201d (Juan 20: 30-31).\\n\\nHabr\u00eda conmocionado al ap\u00f3stol
  Pedro, quien inst\u00f3 a los cristianos a \u201clo que se refiere a Cristo el Se\u00f1or
  como santo, estando siempre dispuestos a dar respuesta a todo el que os pida raz\u00f3n
  de la esperanza que hay en vosotros\u201d (1 Pedro 3:15).\\n\\nY habr\u00eda sorprendido
  a Lucas, que comenz\u00f3 su Evangelio, \u201cPuesto que ya muchos han tratado de
  compilar una narraci\u00f3n de las cosas que se han verificado entre nosotros, as\u00ed
  como los que desde el principio fueron testigos oculares y ministros de la palabra
  que nos fue entregada a nosotros, me pareci\u00f3 tambi\u00e9n a m\u00ed, despu\u00e9s
  de haber investigado todo con diligencia desde hace alg\u00fan tiempo, escribir
  un relato ordenado para ti, ilustre Te\u00f3filo, para que conozcas bien la verdad
  en cuanto a las cosas que te han ense\u00f1ado\u201d (Lucas 1: 1-4). Del mismo modo,
  comenz\u00f3 su segundo volumen, el Libro de los Hechos: \u201cEn el primer libro,
  oh Te\u00f3filo, habl\u00e9 de todo lo que Jes\u00fas comenz\u00f3 a hacer y a ense\u00f1ar,
  hasta el d\u00eda en que fue recibido arriba, despu\u00e9s de haber dado \u00f3rdenes
  a trav\u00e9s del Esp\u00edritu Santo a los ap\u00f3stoles que hab\u00eda escogido.
  A ellos se present\u00f3 vivo despu\u00e9s de haber padecido muchas pruebas, apareci\u00e9ndoseles
  durante cuarenta d\u00edas y habl\u00e1ndoles acerca del reino de Dios\u201d (Hechos
  1: 1-3).\\n\\n\u00bfQu\u00e9 se esconde detr\u00e1s de esa elecci\u00f3n del t\u00edtulo
  para el panel de discusi\u00f3n de esta noche? \u00bfEra, como pregunt\u00e9 antes,
  el presentar la creencia en el cambio clim\u00e1tico como razonada y basada en la
  evidencia, en contraste con el \u201csalto ciego de fe\u201d del cristianismo? De
  hecho, me pregunto si los que idearon ese t\u00edtulo saben que la palabra fe, tal
  como se utiliza en la Biblia, no denota una respuesta emocional, sino una respuesta
  intelectual: aceptar (no solo de hablar con los labios, sino creer, honestamente,
  con la mente [o el coraz\u00f3n, la Biblia utiliza los t\u00e9rminos indistintamente])
  a la verdad de una declaraci\u00f3n o doctrina.\\n\\nSupongo que puede que nunca
  lo sepamos.\\n\\nPero esto s\u00ed sabemos. Los Organizadores del panel aseguraron
  que los que asistieran oir\u00edan solo un lado de este tema, a pesar de que es
  un tema que se caracteriza por una enorme controversia cient\u00edfica, econ\u00f3mica,
  pol\u00edtica y \u00e9tica entre los expertos de buena fe en los cuatro campos.\\n\\nLos
  cuatro panelistas creen claramente en un peligroso calentamiento global provocado
  por el hombre y en el imperativo de tratar de mitigarlo reduciendo las emisiones
  de di\u00f3xido de carbono mediante la reducci\u00f3n del uso de\\n\\ncombustibles
  f\u00f3siles, aunque al hacerlo se lentifica o detiene el desarrollo econ\u00f3mico
  en gran parte del mundo, atrapando a miles de millones en la pobreza y conden\u00e1ndolos
  a una vida corta y plagada de enfermedades.\\n\\nEl \u00fanico cient\u00edfico del
  clima entre ellos, Dra. Hayhoe, se ha demostrado dispuesta a dialogar con otros
  cient\u00edficos del clima evang\u00e9licos que est\u00e9n en desacuerdo con ella.\\n\\nCuando
  en el 2013 dirigi\u00f3 un grupo de 200 cient\u00edficos evang\u00e9licos (solo
  cinco de los cuales eran cient\u00edficos del clima) en la emisi\u00f3n de una carta
  abierta instando al Congreso a tomar medidas contra el cambio clim\u00e1tico, dos
  miembros preferentes de la Alianza Cornwall, el Dr. Roy W. Spencer, Director Cient\u00edfico
  de la investigaci\u00f3n en climatolog\u00eda en la Escuela de la Tierra y Ciencias
  de la Atm\u00f3sfera de la Universidad de Alabama y ganador de la medalla de Logro
  Cient\u00edfico Excepcional de la NASA para el trabajo de monitorizaci\u00f3n de
  la temperatura global con sat\u00e9lites, y el Dr. David Legares, profesor de hidroclimatolog\u00eda,
  precipitaci\u00f3n y cambio clim\u00e1tico, y m\u00e9todos computacionales en el
  Colegio de la Tierra, Oc\u00e9ano y Medioambiente de la Universidad de Delaware,
  ella concluy\u00f3 su respuesta cr\u00edtica:\\n\\n... Los desafiamos a ellos, o
  a otros evang\u00e9licos de su elecci\u00f3n, a un debate formal p\u00fablico con
  un cient\u00edfico, un economista y un te\u00f3logo de cada lado, en una universidad
  evang\u00e9lica de su elecci\u00f3n. Un tema de debate ser\u00eda la magnitud, las
  causas y consecuencias del calentamiento global reciente y previsible y si combatirlo
  mediante la reducci\u00f3n de las emisiones de CO2 causar\u00eda m\u00e1s bien que
  mal a los pobres.\\n\\nHasta la fecha ni la doctora Hayhoe ni ning\u00fan otro evang\u00e9lico
  que est\u00e9 de acuerdo con su posici\u00f3n ha respondido nunca a este reto, el
  cual sigue en pie.\\n\\n\u00bfPodr\u00eda la creencia en el peligroso calentamiento
  global antropog\u00e9nico ser m\u00e1s un \u201csalto de fe\u201d de Kierkegaard,
  que el escepticismo mismo? \u00bfPor qu\u00e9 podr\u00eda uno pensar as\u00ed?\\n\\nEl
  aumento de la concentraci\u00f3n de di\u00f3xido de carbono en la atm\u00f3sfera,
  que los alarmistas del clima culpan por el aumento de la temperatura promedio global,
  es una suave curva ascendente, mientras que el aumento de la temperatura durante
  el \u00faltimo siglo y medio, y en las \u00faltimas cuatro d\u00e9cadas, ha sido
  intermitente, con aumentos, disminuciones y mesetas.\\n\\nLos mejores an\u00e1lisis
  indican que los cambios globales de temperatura ocurren antes de los cambios en
  la concentraci\u00f3n de di\u00f3xido de carbono, contrario a la secuencia que observar\u00edamos
  si el di\u00f3xido de carbono fuera el principal impulsor de los cambios de temperatura.\\n\\nLos
  modelos clim\u00e1ticos computarizados que son la \u00fanica base para predicciones
  de la temperatura global extendi\u00e9nsose a los pr\u00f3ximos siglos simulan,
  en promedio, de dos a tres veces el calentamiento real observado durante el per\u00edodo
  en cuesti\u00f3n.\\n\\nNoventa y cinco por ciento de ellos simulan m\u00e1s calentamiento
  que el observado, indicando que los errores no son al azar, sino accionados por
  alg\u00fan tipo de sesgo (sea error honesto o no).\\n\\nNinguno simula la ausencia
  total de calentamiento estad\u00edsticamente significativo desde principios de 1997
  hasta finales de 2015.\\n\\nAs\u00ed que, tal vez, pese al t\u00edtulo de la mesa
  redonda, la creencia en el \u201ccambio clim\u00e1tico\u201d (abreviatura para peligroso
  calentamiento artificial hecho por el hombre que debe ser mitigado, incluso a costa
  de miles de millones de d\u00f3lares y, potencialmente, atrapando a miles de millones
  en la pobreza) es realmente un acto de fe.\\n\\nTraducido por Beatriz Atkins\\n\\nDr.
  Beisner es el fundador y orador nacional de The Cornwall Alliance; antiguo Profesor
  Asociado de Teolog\u00eda Hist\u00f3rica y \u00c9tica Social en el Seminario Teol\u00f3gico
  Knox, y de Estudios Interdisciplinarios en el Covenant College.\\n\\nALGUNOS LO
  LLAMAN \\\"CALENTAMIENTO GLOBAL\\\", OTROS LO LLAMAN \\\"ENFRIAMIENTO GLOBAL\\\".
  NOSOTROS SIEMPRE LO HEMOS LLAMADO \\\"CLIMA\\\"... JA JA JA...\\n\\nCUANDO AL GORE
  NACI\u00d3, \u00c9RAMOS 6 000 OSOS; AHORA SOLO QUEDAMOS 30 000... JA JA JA...\\n\\nPAGANISMO
  EN EL MOVIMIENTO AMBIENTALISTA\\n\\nPor Max Vindas\\n\\nComo en las historias del
  Antiguo Testamento, donde el pueblo de Israel en un abrir y cerrar de ojos abandona
  la adoraci\u00f3n a su Dios y lo sustituye con cualquier cosa, as\u00ed est\u00e1
  nuestra sociedad, con gran poder Dios los saca de la tierra de Egipto, y de un momento
  a otro hacen un becerro de oro, les levanta una serpiente de bronce como se\u00f1al
  de un salvador y terminan ador\u00e1ndola, les conquista una tierra y adoptan los
  dioses de las hijas de aquella tierra. As\u00ed mismo despu\u00e9s de que Dios les
  diera una impresionante naturaleza la cual testifica sobre la existencia del Creador
  y los hombres terminan adorando a la creaci\u00f3n.\\n\\nHoy el movimiento ambientalista
  ha dejado de cuidar del medio ambiente para adorarlo y de repente nuestra diosa,
  la madre tierra, siente, llora, es sabia, r\u00ede, crea y sobre todo est\u00e1
  enferma y la enfermedad somos nosotros mismos. Lo m\u00e1s interesante de esta historia
  es que adem\u00e1s del hombre ser el par\u00e1sito que enferma la tierra, al mismo
  tiempo, tambi\u00e9n es la cura y as\u00ed nos convertimos en acusados y jueces,
  demonios y dioses, pecadores y salvadores; como dijo GK Chesterton: \u201cCuando
  el hombre deja de creer en Dios no se queda creyendo en nada si no m\u00e1s bien
  termina creyendo cualquier cosa\u201d.\\n\\n\u00bfHAY ALGO DE MALO EN CONSERVAR
  EL AMBIENTE?\\n\\nG\u00e9nesis 1:28\\n\\n\u201cY los bendijo Dios, y les dijo: Fructificad
  y multiplicaos; llenad la tierra, y sojuzgadla, y se\u00f1oread en los peces del
  mar, en las aves de los cielos, y en todas las bestias que se mueven sobre la tierra.\u201d\\n\\nLa
  respuesta corta a esta pregunta es: por supuesto que no; como cristianos nos interesa
  vivir en un medio ambiente limpio y agradable, el cual permita el sano desarrollo
  de nuestra sociedad. Adem\u00e1s, el mantener el medio ambiente saludable, es una
  manera de amar al pr\u00f3jimo ya que la naturaleza nos fue entregada para satisfacer
  todas nuestras necesidades. Es del uso correcto de la tierra de donde salen los
  alimentos con los que se sustentan todas las personas.\\n\\nTenemos que tener mucho
  cuidado como cristianos, cuando escogemos nuestra posici\u00f3n en el tema de la
  conservaci\u00f3n, ya que la l\u00ednea que divide la mayordom\u00eda ambiental
  del paganismo conservacionista es muy fina. En la actualidad existen gran cantidad
  de grupos y acciones que han cruzado esa l\u00ednea; dejaron de ser mayordomos de
  la naturaleza, para glorificar al Creador y pasaron a ser adoradores de la tierra
  misma, d\u00e1ndole animosidad y personalidad.\\n\\nPara poder entender bien lo
  que Dios nos manda en G\u00e9nesis, debemos definir la palabra sojuzgar. El diccionario
  de la RAE define la palabra sojuzgar como: Sujetar o dominar con violencia algo
  o a alguien; en hebreo la palabra utilizada es Kabash, que significa Sojuzgado,
  Sojuzgadla, sometido, para someter a, reducidlos a la esclavitud. De esta manera,
  queda claro que el mandato de Dios es de dominar la tierra y tenerla bajo servidumbre.\\n\\nToda
  acci\u00f3n humana destinada a dominar el ambiente es permitida por Dios; el dominio
  del ambiente es muy distinto a la destrucci\u00f3n del ambiente, si destruimos el
  medio ambiente, no estamos siendo mayordomos de la creaci\u00f3n de Dios. Sin embargo,
  el creer que el hombre debe de alejarse de la naturaleza para que esta permanezca
  virgen, es un pensamiento pagano. La creaci\u00f3n est\u00e1 para servir al hombre,
  a sus prop\u00f3sitos de alimentaci\u00f3n, recreaci\u00f3n, admiraci\u00f3n y su
  mayor prop\u00f3sito, es servir como testigo vivo de la existencia del Dios creador.\\n\\nY
  entonces \u00bfc\u00f3mo podemos saber cu\u00e1ndo estamos conservando y cu\u00e1ndo
  estamos cayendo en la agenda pagana? Primero veamos algunos ejemplos b\u00edblicos.
  En la Biblia encontramos instancias donde se se\u00f1ala a la tierra salvaje y bajo
  el dominio de las bestias, como un juicio de Dios, por ejemplo, veamos el siguiente
  pasaje:\\n\\nEzequiel 14:15 (RVR1960)\\n\\n15 \u201cY si hiciere pasar bestias feroces
  por la tierra y la asolaren, y quedare desolada de modo que no haya quien pase a
  causa de las fieras\u201d.\\n\\nDe la misma manera podemos ver pasajes donde, el
  dominio del medio ambiente es considerado como una bendici\u00f3n. En el siguiente
  pasaje vemos, como Dios mismo dice que dominar\u00e1 el ambiente, para la comodidad
  de su pueblo. Sea de manera ilustrativa o literal, el dominio del ambiente se nos
  presenta como algo bueno:\\n\\nIsa\u00edas 43:19-20 (RVR1960)\\n\\n19 He aqu\u00ed
  que yo hago cosa nueva; pronto saldr\u00e1 a luz; \u00bfno la conocer\u00e9is? Otra
  vez abrir\u00e9 camino en el desierto, y r\u00edos en la soledad.\\n\\n20 Las fieras
  del campo me honrar\u00e1n, los chacales y los pollos del avestruz; porque dar\u00e9
  aguas en el desierto, r\u00edos en la soledad, para que beba mi pueblo, mi escogido.\u201d\\n\\nNo
  podemos dejar de lado, la gran cantidad de pasajes b\u00edblicos en los cuales Dios
  habla de la grandeza de su creaci\u00f3n, ya sea como testigo de la gloria de Dios,
  o simplemente como ejemplos para ilustrar alg\u00fan punto; por ejemplo: Jes\u00fas
  menciona muchas veces a las aves del campo y utiliza la belleza natural en sus ilustraciones,
  como vemos en esta cita:\\n\\nMateo 6:28-29 (RVR1960)\\n\\n28 Y por el vestido,
  \u00bfpor qu\u00e9 os afan\u00e1is? Considerad los lirios del campo, c\u00f3mo crecen:
  no trabajan ni hilan;\\n\\n29 pero os digo, que ni aun Salom\u00f3n con toda su
  gloria se visti\u00f3 as\u00ed como uno de ellos.\\n\\nBajo ese contexto podemos
  decir que, atravesamos la l\u00ednea de la conservaci\u00f3n al paganismo, en el
  momento en que le damos valor intr\u00ednseco a lo creado; esto significa que el
  valor de la creaci\u00f3n queda en funci\u00f3n, en primer lugar, de ser testigo
  silencioso de que Dios existe y en segundo lugar, en t\u00e9rminos de la utilidad
  que la humanidad le puede dar. De cualquier manera \u00bfQui\u00e9n va a apreciar
  los bellos animales y los incre\u00edbles paisajes de no ser los\\n\\nser humanos?,
  a ning\u00fan animal le interesa si otra especie sobrevive o se extingue, ni siquiera
  se dan cuenta ya que no son conscientes.\\n\\nOtra manera de cruzar la l\u00ednea
  es, el pensar que se puede beneficiar a una poblaci\u00f3n de alguna especie, en
  detrimento de un grupo de personas. La conservaci\u00f3n siempre debe de ser ponderada
  en funci\u00f3n del beneficio humano y nunca en detrimento de la sociedad. De esta
  manera, podemos crear un lindo parque natural porque este provee al hombre con la
  oportunidad de admirar y/o estudiar lo creado, a la vez que sirve para el esparcimiento
  de la poblaci\u00f3n. Es l\u00f3gico y racional planear que las zonas conservadas
  sean aquellas que protejan la mayor cantidad de biodiversidad y recursos paisaj\u00edsticos
  de determinada regi\u00f3n.\\n\\nLa preservaci\u00f3n de la naturaleza es de gran
  bienestar para la poblaci\u00f3n, son miles las personas que tienen trabajos relacionados
  con ambientes sanos, los r\u00edos limpios son buenos para todos. La contaminaci\u00f3n
  del ambiente es se\u00f1al de la maldad humana y el hecho de que no podamos proteger
  todos los ambientes ni a todos los animales, ya que es necesario alimentar a la
  poblaci\u00f3n, es una se\u00f1al que vivimos en un mundo ca\u00eddo; por lo tanto,
  no podemos perder la cabeza por la p\u00e9rdida de ecosistemas, de la misma manera
  que debemos aceptar muchos desastres naturales, dolor y miserias. Lo importante
  es tener presente que Jes\u00fas nos prometi\u00f3 regresar y hacer todo nuevo.\\n\\nEL
  EFECTO ALFA\\n\\n\u201cEl perro por naturaleza busca al macho alfa, cuando un perro
  no tiene reglas ni l\u00edmites se frustra y se vuelve un perro agresivo\u201d Cesar
  Mill\u00e1n\\n\\nHace unos d\u00edas, en una famosa p\u00e1gina de observadores
  de aves, una se\u00f1ora public\u00f3 una pregunta; ella pregunt\u00f3 qu\u00e9
  pod\u00eda hacer con unas deposiciones fructosas que aparec\u00edan en su balc\u00f3n
  todas las ma\u00f1anas, no sab\u00eda qu\u00e9 animal era y no quer\u00eda tomar
  medidas extremas. Como resultado de su publicaci\u00f3n, adem\u00e1s de identificar
  al responsable por las deposiciones como murci\u00e9lago, la se\u00f1ora recibi\u00f3
  una gran cantidad de improperios e insultos.\\n\\nMe sorprend\u00ed en gran manera
  por la agresividad con que estas personas reaccionaron al comentario de la se\u00f1ora,
  desde malas palabras hasta asesina, que ella merec\u00eda morir, que se fuera del
  territorio del animal ya que ella era la intrusa, etc. La se\u00f1ora finalmente
  respondi\u00f3 y dijo: \u201cEscrib\u00ed mi mensaje a la carrera porque iba para
  el supermercado, con las medidas extremas me refer\u00eda a cerrar el balc\u00f3n
  ya que mi hija padece de alergias, hice la pregunta en esta p\u00e1gina porque me
  parec\u00eda que los observadores de aves eran gente pac\u00edfica y que aman la
  naturaleza, pero veo que estaba equivocada\u201d\\n\\n\u00bfCu\u00e1l puede ser
  la raz\u00f3n por la cual un feliz grupo de admiradores de la naturaleza se conviertan
  en jueces despiadados? Podemos intentar encontrar la respuesta en la sabidur\u00eda
  del encantador de perros; de acuerdo con la filosof\u00eda de este exitoso entrenador
  de perros, si un perro no tiene un amo que sea l\u00edder y le ponga reglas, el
  animal se sentir\u00e1 frustrado, infeliz y podr\u00eda reaccionar agresivamente.\\n\\nte,
  Cesar Millar indica que al tener reglas y saber que \u00e9l es un perro y no un
  humano, el perro estar\u00e1 mucho m\u00e1s feliz e inclusive \u00e9l mismo dice
  que el tratar a un perro como a un humano es un tipo de agresi\u00f3n animal.\\n\\nPodemos
  aplicar esta informaci\u00f3n en un paralelismo con los humanos, al comparar la
  relaci\u00f3n amo-perro con Dios y el hombre, de manera que pareciera que el famoso
  \u201cEncantador de Perros\u201d encontr\u00f3 la fuente de su conocimiento en las
  ense\u00f1anzas B\u00edblicas cuando dice:\\n\\nRomanos 1:21-22\\n\\n21 Pues habiendo
  conocido a Dios, no le glorificaron como a Dios, ni le dieron gracias, sino que
  se envanecieron en sus razonamientos, y su necio coraz\u00f3n fue entenebrecido.\\n\\n22
  Profesando ser sabios, se hicieron necios.\\n\\nAs\u00ed como un perro sin reconocer
  a su amo y sin tener reglas se vuelve agresivo e inestable, de la misma manera nos
  ocurre cuando no tenemos a Dios y negamos su existencia. La mayor\u00eda de los
  miembros de este grupo son personas afines al humanismo secular, su creencia es
  que evolucionamos al igual que el murci\u00e9lago y por lo tanto la se\u00f1ora
  era la invasora. En presencia de una invasora y la ausencia de un Dios, ellos, los
  conocedores de la naturaleza, se tornan inmediatamente en los jueces y dictan sentencia
  agresiva y desp\u00f3tica, dictaminando que esta infame intrusa debe morir.\\n\\nFue
  inevitable notar en los comentarios de dichos \u201camantes de la naturaleza\u201d
  su gran necesidad, que como lo dictaminan las escrituras, es un efecto de no reconocer
  al\\n\\nalfa de toda la creaci\u00f3n y sin cabeza, no les qued\u00f3 m\u00e1s remedio
  que ladrar agresiva y desconsoladamente, rogando a su madre tierra por un Cesar
  Mill\u00e1n que tome venganza de estos impunes delincuentes que invaden el territorio
  de sus hermanos los murci\u00e9lagos.\\n\\nNo es dif\u00edcil entender por qu\u00e9
  las personas que no reconocen a Dios se tornan inseguras y agresivas, a ellos no
  les queda m\u00e1s que salvar, por sus propios medios, a la raza humana, tomando
  en cuenta que para salvar a la raza humana deben de proteger con sus vidas a la
  madre tierra, ya que es el \u00fanico refugio y la fuente de toda vida. No es extra\u00f1o
  escuchar a personas diciendo que para poder salvar a la madre tierra y por ende
  asegurar nuestra existencia debemos de disminuir la poblaci\u00f3n humana a toda
  costa, pero con certeza su proceso de raleamiento de la humanidad no los incluye
  a ellos, sacerdotes conocedores de su madre a la cual quieren defender con sangre.\\n\\n**UNISMO
  EN LOS MOVIMIENTOS CONSERVACIONISTAS**\\n\\n*Romanos 1:25 (RVR1960)*\\n\\n25 ya
  que cambiaron la verdad de Dios por la mentira, honrando y dando culto a las criaturas
  antes que al Creador, el cual es bendito por los siglos. Am\u00e9n.\\n\\nEs muy
  frecuente escuchar a personas acusando a cristianos diciendo, que en el mundo existen
  miles de religiones y dioses, que el creer que el suyo es el verdadero es un grado
  de arrogancia gigantesco; esto por supuesto que es una mentira, ya que sin importar
  la cantidad de dioses\\n\\nque los humanos puedan adorar, todas las religiones son
  solamente superficialmente similares, pero fundamentalmente diferentes y todas reclaman
  exclusividad, adem\u00e1s la verdad por definici\u00f3n es exclusiva. Esta verdad
  fue capturada de manera brillante por el famoso escritor ingl\u00e9s Steve Turner
  en su poema \u201cEl Credo\u201d de la siguiente manera:\\n\\n\u201cCreemos que
  todas las religiones son b\u00e1sicamente iguales por lo menos las que revisamos
  lo eran\\nTodas creen en el amor y la bondad\\nSolo se contradicen en temas de\\ncreaci\u00f3n,
  pecado, cielo, infierno. Dios y salvaci\u00f3n\u201d\\n\\nAl analizar con detalle
  todas las creencias, las podemos clasificar en dos cosmovisiones generales: el Unismo
  y el Dosismo. El Apologista Peter Jones basado en Romanos 1, describe que existe
  solamente la verdad (dosismo) y la mentira (unismo). El unismo es descrito como
  todos aquellos sistemas de creencia que deifican a algo creado, ya sea una energ\u00eda,
  tal como el Budismo, o una fuerza impersonal; a la materia como el humanismo secular
  quienes recitan \u201csomos polvo de estrellas\u201d. En cualquiera de los casos
  que podamos analizar, todas las religiones unitas acaban adorando a la creaci\u00f3n
  y por ende, al ser nosotros parte de la creaci\u00f3n somos tambi\u00e9n divinos.
  Dosismo se refiere a la fe cristiana la cual acepta que existe un Creador separado
  de la creaci\u00f3n.\\n\\nJames Wanliss en su libro \u201cEl Drag\u00f3n Verde\u201d
  nos describe al movimiento ambientalista como un movimiento sofisticado y de varios
  tipos de pensamiento religioso unido,\\n\\nadem\u00e1s dice que es \u201cel principio
  organizativo central de la comunidad mundial\u201d. Veamos la ingeniosa descripci\u00f3n
  que Wanliss nos hace:\\n\\n\u201cEs una religi\u00f3n con una visi\u00f3n de pecado
  y arrepentimiento, cielo e infierno, incluso tiene un vocabulario especial como
  sostenibilidad y carbono neutral. Su comuni\u00f3n es la comida org\u00e1nica. Sus
  sacramentos son el sexo, el aborto y cuando todo falla, la esterilizaci\u00f3n.\u201d\\n\\nDe
  esta manera, Wanliss nos advierte de este gigantesco movimiento, que de manera silenciosa
  y con sus aparentes obras de bienestar y buena voluntad, se va incorporando en toda
  la sociedad, incluyendo nuestras propias Iglesias. Existen mil y una maneras de
  como el grupo ambientalista incorpora una visi\u00f3n pagana a la conservaci\u00f3n
  del medio ambiente, a continuaci\u00f3n les mencionaremos algunas:\\n\\n1- Relacionar
  la destrucci\u00f3n de la naturaleza con la sobrepoblaci\u00f3n humana.\\n\\nEn
  el planeta hay m\u00e1s de seis mil millones de personas, seg\u00fan los ambientalistas
  esta gran poblaci\u00f3n es la mayor amenaza a la madre tierra y para poder salvarla,
  necesitamos disminuirla radicalmente. Si coloc\u00e1ramos a toda la poblaci\u00f3n
  de la tierra en un solo lugar con la densidad de poblaci\u00f3n de una ciudad normal,
  todos cabr\u00edan en el estado de Texas y sobrar\u00eda espacio lo cual desmiente
  el mito de la sobre poblaci\u00f3n,\\n\\nLa Organizaci\u00f3n \u201cCenter for Biological
  Diversity\u201d quien lucha por la conservaci\u00f3n del medio ambiente, adem\u00e1s
  de apoyar una serie de proyectos legales en pro de la conservaci\u00f3n, tambi\u00e9n
  ofrecen, de manera gratuita, preservativos\\n\\ncon fotos de animales en peligro
  de extinci\u00f3n y refranes alusivos seg\u00fan reporta el NY times, una de las
  envolturas dice \u201cUse con cuidado y salve a un Oso Polar\u201d otro dice \u201cUse
  un preservativo y salve a un b\u00faho moteado\u201d. Esta organizaci\u00f3n contabiliza
  a la poblaci\u00f3n en t\u00e9rminos de la cantidad de carbono que produce, ellos
  promueven bajar la taza de reproducci\u00f3n de los Estados Unidos de dos nacimientos
  por mujer a un 1.5 y as\u00ed disminuir la producci\u00f3n de CO2 en un 33 % en
  cien a\u00f1os, tomemos en cuenta que al ritmo actual de dos nacimientos por mujer
  ni si quiera sustituye a la poblaci\u00f3n actual resultando en un envejecimiento
  de la poblaci\u00f3n y los problemas sociales que esto conlleva.\\n\\nEs dif\u00edcil
  observar un programa sobre la naturaleza sin que sea narrado por el m\u00e1s famoso
  presentador de programas sobre la vida silvestre del mundo, estoy hablando del ingl\u00e9s
  sir David Attenborough; este popular presentador dijo que: \u201cLos humanos son
  una plaga en la tierra y por lo tanto la poblaci\u00f3n deb\u00eda ser controlada\u201d.
  El se\u00f1or Attenborough es una persona sumamente querida ya que ha dedicado toda
  su vida a hablar de las bondades de la naturaleza, sin embargo, se ha dejado llevar
  por sentimientos, poniendo m\u00e1s alto a los animales que al p\u00fablico que
  es el \u00fanico que puede ver y entender sus programas.\\n\\nEl famoso y millonario
  Ted Turner, fundador de la cadena CNN y un reconocido humanista dijo que la poblaci\u00f3n
  ideal para el planeta es entre 250 y 300 millones, solo un 5 % de la poblaci\u00f3n
  actual, el se\u00f1or Turner es el fundador de la \u201cFundaci\u00f3n para las
  Naciones Unidas\u201d para la cual recauda billones de d\u00f3lares anuales, los
  cuales son utilizados en diversos temas en naciones unidas. Este tipo de pronunciamientos
  dejan en claro como, desde las personas m\u00e1s influyentes del mundo, nace un
  creciente odio por la humanidad en pro de la protecci\u00f3n de la madre tierra.\\n\\nComo
  resultado de esta mentalidad, se ha desatado en los \u00faltimos a\u00f1os un gran
  deseo por disminuir la poblaci\u00f3n a cualquier costo, hemos visto ataques contra
  la vida humana en todos los niveles. Uno de los peores ataques ha sido contra los
  que a\u00fan no han nacido y vemos como cada d\u00eda m\u00e1s pa\u00edses adoptan
  y promueven el aborto; solo en los Estados Unidos se abortan m\u00e1s de un mill\u00f3n
  de ni\u00f1os al a\u00f1o y el estimado mundial son unos cien mil beb\u00e9s por
  d\u00eda, lo cual es una cifra espantosa. No podemos dejar de lado al movimiento
  en pro de la eutanasia, esto es promovido para quienes quieran dejar de vivir por
  cualquier raz\u00f3n, ellos lo consideran un derecho humano y este movimiento es
  cada vez m\u00e1s fuerte.\\n\\nNos ha correspondido vivir en un tiempo donde todo
  tipo de asalto contra la vida humana est\u00e1 siendo promovido, ya que para nuestra
  sociedad, cuantos menos seres humanos tenga la tierra, mejor; sin embargo, los cristianos
  tenemos claro que solo hay un autor de la vida y que todos somos hechos a imagen
  y semejanza de Dios, como portadores de la imagen de Dios, respetamos la vida a
  toda costa.\\n\\n2- Colocar a los animales por encima del hombre.\\n\\nUno de los
  mejores evangelistas de nuestro tiempo, el se\u00f1or Ray Confort public\u00f3 un
  video llamado \u201cDios versus ciencia\u201d, en este video entrevista a muchas
  personas con\\n\\npreguntas sobre ciencia, moralidad y Dios; al realizar la pregunta
  hipot\u00e9tica de que si su perro y su molesto vecino se estuvieran ahogando, a
  cual salvar\u00eda, ya sea con un poco de duda o con mucha seguridad, muchos reclamaron
  a su mascota como prioridad para salvar. El Apologista Ravi Zacharias cuenta en
  muchas de sus charlas que, al caminar por la universidad de Oxford, not\u00f3 que
  casi todas las casas pose\u00edan alg\u00fan tipo de calcoman\u00eda alusivo a la
  protecci\u00f3n de los animales, pero ninguna de las casas pose\u00eda ni un solo
  anuncio provida.\\n\\nHace poco m\u00e1s de un a\u00f1o las redes sociales fueron
  sacudidas por la muerte del le\u00f3n Cecil, el cual fue cazado por error, siendo
  un famoso le\u00f3n de uno de los parques nacionales de \u00c1frica del sur; miles
  y miles juraban muerte y lazaban todo tipo de amenazas contra los que cometieron
  el error. En los \u00faltimos meses, un ni\u00f1o logr\u00f3 ingresar a la jaula
  del gorila Harambe en el zool\u00f3gico de la ciudad de Cincinnati en los Estados
  Unidos, como resultado de esto, los cuidadores del zool\u00f3gico mataron al gorila
  para salvar al ni\u00f1o, de nuevo las redes sociales ardieron de furia e inclusive
  mostrando el deseo de que la madre del ni\u00f1o fuera la sacrificada, nadie celebr\u00f3
  el hecho de que una vida humana fue salvada y aunque, matar al gorila fue una tragedia,
  la historia tuvo un final feliz, ya que una madre se reencontr\u00f3 con su hijo
  y lo pudo haber perdido.\\n\\nSon demasiados los ejemplos que encontramos de personas
  colocando a los animales por encima de los humanos, solo basta hacer una encuesta
  a personas en las v\u00edas p\u00fablicas o simplemente podemos entrar y ver las
  conversaciones p\u00fablicas de los diferentes sitios web, que con\\n\\nbuenas intenciones
  y p\u00e9sima cosmovisi\u00f3n defienden animales; haciendo que sus seguidores se
  dejen llevar por sus sentimientos (siempre enga\u00f1osos), terminando en el repudio
  a los humanos por amor a los animales. En un escenario donde el hombre no estuviera
  presente en el planeta \u00bfQui\u00e9n podr\u00eda apreciar y describir la bella
  creaci\u00f3n de Dios?\\n\\n3- Creer que el hombre puede destruir o salvar el planeta\\n\\nCuando
  la sociedad toma la decisi\u00f3n de no creer en Dios, queda inmersa en un mar de
  falta de prop\u00f3sito, adem\u00e1s, al creer que estamos solos, no les queda m\u00e1s
  a los hombres que forjar su propio futuro y su propia salvaci\u00f3n. Como el hombre
  y la sociedad se tornan la \u00fanica fuente e inteligencia y prop\u00f3sito, eso
  quiere decir que nosotros mismos somos el bien y el mal, dios y el diablo, cielo
  e infierno; por lo tanto, nosotros tenemos que salvarnos de nosotros mismos. El
  fil\u00f3sofo alem\u00e1n Frederich Nietzsche nos presenta en su poema \u201cLa
  par\u00e1bola del loco con la linterna\u201d que ocurre exactamente cuando nuestra
  sociedad decide darle la espalda a Dios y negar en necedad su existencia, observemos
  sus palabras:\\n\\n\u201c\u00bfD\u00f3nde se ha ido Dios? Yo os lo voy a decir\u201d,
  les grit\u00f3. \u00a1Nosotros lo hemos matado, vosotros y yo! \u00a1Todos somos
  sus asesinos! Pero, \u00bfc\u00f3mo hemos podido hacer eso? \u00bfC\u00f3mo hemos
  podido vaciar el mar? \u00bfY qui\u00e9n nos ha dado la esponja para secar el horizonte?
  \u00bfQu\u00e9 hemos hecho al separar esta tierra de la cadena de su sol? \u00bfAd\u00f3nde
  se dirigen ahora sus movimientos? \u00bfLejos de todos los soles? \u00bfNo caemos
  incesantemente? \u00bfHacia adelante, hacia atr\u00e1s,\\n\\nde lado, de todos lados?
  \u00bfHay a\u00fan un arriba y un abajo? \u00bfNo vamos como errantes a trav\u00e9s
  de una nada infinita? \u00bfNo nos persigue el vac\u00edo con su aliento? \u00bfNo
  hace m\u00e1s fr\u00edo? \u00bfNo veis oscurecer, cada vez m\u00e1s, cada vez m\u00e1s?
  \u00bfNo es necesario encender linternas en pleno mediod\u00eda? \u00bfNo o\u00edmos
  todav\u00eda el ruido de los sepultureros que entierran a Dios? \u00bfNada olfateamos
  a\u00fan de la descomposici\u00f3n divina? \u00a1Tambi\u00e9n los dioses se descomponen!
  \u00a1Dios ha muerto y nosotros somos quienes lo hemos matado! \u00bfC\u00f3mo nos
  consolaremos, nosotros, asesinos entre los asesinos? Lo que el mundo pose\u00eda
  de m\u00e1s sagrado y poderoso se ha desangrado bajo nuestro cuchillo.\\n\\nEn esta
  porci\u00f3n del revelador ensayo, Nietzsche entend\u00eda que sin Dios la sociedad
  queda sin punto de referencia y no tiene direcci\u00f3n, sabias palabras de este
  honesto ateo, el cual, de manera magistral, consigui\u00f3 profetizar el futuro
  de la sociedad. Al no quedar con m\u00e1s punto de referencia que nosotros mismos,
  la salvaci\u00f3n se convierte en algo subjetivo, por lo tanto, el planeta ideal,
  es aquel que existe en la concepci\u00f3n de quien m\u00e1s poder tenga, para echar
  a andar su plan de salvaci\u00f3n, ya sea protegernos del calentamiento global,
  que nosotros mismos supuestamente producimos, o que el hombre trascienda del cuerpo
  en carne, al ciberespacio, con el movimiento Trans-Humanista que pretende trasladar
  nuestra conciencia encerrada en un cuerpo carnal y d\u00e9bil al ciberespacio donde
  \u00e9l mismo pueda ser perpetuado.\\n\\n4- Cree que la tierra est\u00e1 viva y
  somos sus hijos\\n\\n\u201cAc\u00e9rcate al coraz\u00f3n de la Naturaleza... y deja
  tus cargas, de ves en cuando debes subir una monta\u00f1a o quedarte una semana
  en el bosque, lava tu esp\u00edritu\u201d. John Muir\\n\\nJohn Muir vivi\u00f3 entre
  1838 y 1914, es el h\u00e9roe estadounidense y si no mundial de la conservaci\u00f3n
  de la naturaleza, por lo cual merece gran reconocimiento y m\u00e9rito, Muir migr\u00f3
  de Escocia a Norteam\u00e9rica con su familia, su padre era un estricto y casi desp\u00f3tico
  creyente, pero con ideolog\u00edas liberales. El se\u00f1or Muir comenz\u00f3 a
  alejarse de la verdad b\u00edblica cada vez m\u00e1s, mientras realizaba estudios
  universitarios, estudiaba la geolog\u00eda y las nuevas teor\u00edas naturalistas,
  las cuales eran contrarias al r\u00e9cord B\u00edblico; de manera que mezcl\u00f3
  sus creencias de\u00edstas con su conocimiento y amor por la naturaleza para iniciar
  un movimiento que ve\u00edan a la naturaleza como parte de Dios. Hoy las ideas de
  Muir se han convertido en una popular corriente idealista, misma que aunque naci\u00f3
  de muchas fuentes, pero se inspira en este popular defensor de la naturaleza.\\n\\nCon
  la aparici\u00f3n de teor\u00edas cient\u00edficas (filosof\u00eda sobre el origen),
  que contradicen la historicidad b\u00edblica, comenz\u00f3 a crecer el n\u00famero
  de personas que abandonaron la creencia en Dios, las cuales se declararon ya sea
  ateas o agn\u00f3sticas. Este movimiento humanista agn\u00f3stico en los \u00faltimos
  tiempos est\u00e1 perdiendo gran cantidad de adeptos de sus ideales puristas ya
  que estas personas, motivadas por su divinidad interna dada por Dios, buscan alg\u00fan
  tipo de experiencia espiritual y se alejan de una compresi\u00f3n 100% naturalista,
  por lo cual la filosof\u00eda al estilo de John Muir les ha ca\u00eddo como anillo
  al dedo y es muy com\u00fan escuchar a las personas encontrando a dios en la naturaleza
  en vez de entender que hay un Dios creador de esa naturaleza.\\n\\nPara las masas,
  la adoraci\u00f3n a la tierra tiene mucho sentido, es perfectamente armonizable
  con las teor\u00edas naturalistas ya que aunque la ciencia describa un proceso evolutivo,
  no hay por dudar que este proceso fue guiado por la madre naturaleza, despu\u00e9s
  de todo, ella es todo lo que vemos, nos da los alimentos y todo lo que necesitamos,
  luego al morir, regresamos a ella. En Am\u00e9rica Latina este movimiento tom\u00f3
  m\u00e1s fuerza al popularizarse las creencias de los Quechuas, los cuales poseen
  una diosa llamada la *Pachamama* y hoy d\u00eda la madre naturaleza ya tiene nombre
  cortes\u00eda de los incas.\\n\\nPero la *Pachamama* por s\u00ed sola no puede llenar
  el vac\u00edo de intimidad espiritual, ella crea y nos recibe en la muerte, pero
  no puede sobrevivir por si sola, m\u00e1s bien, ella nos ha dado la tarea de defenderla
  y cuidarla, ya que nosotros su creaci\u00f3n, tenemos el poder de destruirla, entonces
  todos aquellos \u201ciluminados\u201d pueden unirse para promover la paz y el amor
  entre los unos y hacia su madre. La plataforma perfecta para fomentar el amor y
  darnos cuenta de nuestra divinidad interna, es el misticismo oriental; ya sea ideas
  hind\u00faes o budistas (o ambas), nos presentan la forma perfecta de iluminaci\u00f3n,
  al buscar dentro de nosotros mismos ese conocimiento de divinidad que nos despertar\u00e1
  en un nuevo conocimiento de nuestro prop\u00f3sito de cosalvadores y dioses al lado
  de nuestra *Pachamama*.\\n\\nEn el conocimiento pagano popular, la ortodoxia no
  tiene cabida, sino m\u00e1s bien, toman ideolog\u00edas sin importar que sean exclusivistas,
  de todas hacen una s\u00edntesis que complace sus sentimientos, los libera y no
  los acusa de ning\u00fan tipo de pecado. El sexo es permitido en todas\\n\\nsus
  formas porque es amor entre hermanos, las drogas son un producto m\u00e1s de nuestra
  madre y les ayuda a estar en mejor armon\u00eda con ella, no hay ning\u00fan problema
  con satisfacer sus cuerpos de cualquier manera porque no es contrario a su prop\u00f3sito.
  Para estos iluminados, la violencia es permitida solo contra todos los retr\u00f3grados
  que no han entendido el sentido de la vida, estos ya perdieron toda esperanza de
  ser parte del UNO, al tener sus mentes alteradas por su religi\u00f3n desactualizada
  e intolerante, y eso ellos no lo pueden tolerar.\\n\\n**PRODUCCI\u00d3N DE CO2,
  EL PECADO IMPERDONABLE**\\n\\n*G\u00e9nesis 8:22 (RVR1960)*\\n\\n22 Mientras la
  tierra permanezca, no cesar\u00e1n la sementera y la siega, el fr\u00edo y el calor,
  el verano y el invierno, y el d\u00eda y la noche.\\n\\nEn las \u00faltimas dos
  d\u00e9cadas, la noticia que m\u00e1s ha impresionado al mundo, es que hemos tomado
  la decisi\u00f3n de que el hombre puede destruir al mundo entero y su arma mort\u00edfera
  es el di\u00f3xido de carbono. Es un hecho que para que una idea de esta magnitud
  prolifere, la sociedad debe de perder la convicci\u00f3n de que hay un Dios en los
  cielos que todo lo ve, todo lo controla y todo lo plane\u00f3 para su gloria, por
  lo tanto, despu\u00e9s de muchos a\u00f1os de repetir en las clases de las escuelas,
  que la Biblia es una historia ficticia y que somos el producto de piedras movidas
  por las leyes f\u00edsicas, ya era hora de proclamarnos los destructores del mundo,
  para al mismo tiempo poder ser nuestros propios salvadores.\\n\\nLa teor\u00eda
  dice que debido al aumento de la poblaci\u00f3n y el uso de combustibles f\u00f3siles,
  el ser humano est\u00e1 aumentando los niveles de CO2 en la atm\u00f3sfera a niveles
  casi incompatibles con la vida en el planeta, ya que este gas, causa un efecto invernadero
  lo cual desequilibra todo nuestro sistema planetario, causando un colapso que inicia
  con un grave desorden clim\u00e1tico. Al principio el fen\u00f3meno fue llamado
  calentamiento global, sin embargo, al no ser consistente con los datos, se le cambi\u00f3
  su nombre a \u201cCambio Clim\u00e1tico\u201d y de esta manera cualquier fallo puede
  ser escondido detr\u00e1s de este nombre ya que si la tierra no se calienta y sucede
  lo opuesto, el nuevo nombre puede incluir esta tendencia.\\n\\nSe han hecho una
  gran cantidad de predicciones prof\u00e9ticas de destrucci\u00f3n a trav\u00e9s
  de los a\u00f1os tales como:\\n\\nEn 1989 el se\u00f1or Noel Brown, un oficial mayor
  del departamento del medio ambiente de las Naciones Unidas, dijo que si no revert\u00edamos
  el calentamiento global para el a\u00f1o 2000, naciones enteras desaparecer\u00edan
  debido al incremento del nivel del mar; En el a\u00f1o 2007 el presidente de la
  IPCC (Intergovernmental Panel of Climate Change), dijo que si no actu\u00e1bamos
  antes del 2012 contra el cambio clim\u00e1tico, ser\u00eda demasiado tarde. Para
  terminar con estos ejemplos entre much\u00edsimos, no pod\u00edamos dejar por fuera
  al pr\u00edncipe Charles, pr\u00edncipe de Gales, quien en el 2009 dijo delante
  de una gran audiencia de ambientalistas y empresarios, que \u201csolo nos quedaban
  noventa y seis meses para salvar el planeta\u201d lamentablemente todas estas predicciones
  no pasaron la prueba y hoy quedan como testigos silenciosos de ineptitud humana.\\n\\nEl
  CO2 es un gas de suma importancia para el planeta y no un enemigo de los humanos,
  en este momento la atm\u00f3sfera posee un promedio de aproximadamente 400 ppm (partes
  por mill\u00f3n) de CO2, sin embargo, en espacios cerrados este nivel sube considerablemente,
  por ejemplo en un submarino el nivel se mantiene por debajo de 5000 ppm, por el
  contrario, en un campo de agricultura en pleno desarrollo, puede bajar a 200 ppm.
  Algunos expertos se\u00f1alan que a 150 ppm las plantas comienzan a morir y que
  lo ideal para el planeta es un nivel de al menos 1000 ppm. En las \u00faltimas d\u00e9cadas,
  la cantidad de CO2 en la atm\u00f3sfera se ha incrementado en un 30% lo cual ha
  resultado en un aumento del 15% en la producci\u00f3n agr\u00edcola mundial, sin
  mencionar que el planeta est\u00e1 m\u00e1s verde que nunca en la historia reciente,
  adem\u00e1s, es una pr\u00e1ctica com\u00fan inyectar CO2 a los invernaderos para
  incrementar la producci\u00f3n.\\n\\nNo se ha determinado con exactitud qu\u00e9
  es lo que incrementa los niveles de CO2 en la tierra, el hombre s\u00ed ha contribuido
  con esta cantidad, sin embargo, el porcentaje aportado por el hombre es m\u00ednimo,
  los datos var\u00edan de 2% a 10% seg\u00fan la fuente que se busque; en el pasado
  los niveles de CO2 en la atm\u00f3sfera han variado radicalmente, el siguiente diagrama
  presenta los niveles hist\u00f3ricos estimados del CO2 en el planeta en escala hist\u00f3rica
  secular:\\n\\nComo podemos observar el di\u00f3xido de carbono estuvo a niveles
  superiores a los 4000 ppm en el pasado y en realidad hoy el nivel es realmente bajo,
  tomando en cuenta que el m\u00ednimo aceptable es de unos 200 ppm. La idea de que
  el CO2 es el responsable de incrementar la temperatura del planeta no ha podido
  ser demostrada, por lo contrario, los incrementos de CO2 se muestran como resultado
  del calentamiento del clima y no al rev\u00e9s, adem\u00e1s, en los \u00faltimos
  20 a\u00f1os, el di\u00f3xido de carbono se ha incrementado, pero el clima no ha
  mostrado cambio alguno como lo muestra el siguiente gr\u00e1fico:\\n\\nEn todas
  las gr\u00e1ficas que podamos buscar, lo que se da por un hecho es que el clima
  cambia constantemente, he ah\u00ed lo apropiado del nombre \u201cCambio Clim\u00e1tico\u201d
  que al final no significa absolutamente nada. Observemos la gr\u00e1fica de Calentamiento
  global:\\n\\nA simple vista se puede observar un brusco cambio en las temperaturas
  desde 1880 hasta la fecha, sin embargo, la gr\u00e1fica posee una gran escala en
  el axis horizontal, pero una escala de solo 0,6 Celsius en el axis vertical, entonces,
  de esta gr\u00e1fica no se concluye que el clima se est\u00e9 calentando tanto,
  sino m\u00e1s bien, que el clima ha permanecido incre\u00edblemente estable por
  los \u00faltimos 200 a\u00f1os.\\n\\nPero \u00bfqu\u00e9 tan importante es el CO2
  como gas de efecto invernadero? Resulta que el CO2 no es el \u00fanico gas de efecto
  invernadero, sino que adem\u00e1s tenemos el metano que es muy importante, los \u00f3xidos
  nitrosos y los gases fluoruros. Cuando se presenta una gr\u00e1fica donde se utilizan
  estos cuatro gases, entonces, el CO2 parece ser determinante en el efecto invernadero,
  sin embargo, estas gr\u00e1ficas presentadas al p\u00fablico dejan por fuera al
  gas de efecto invernadero m\u00e1s importante de todos y por mucho, el cual es el
  vapor de agua. Observemos c\u00f3mo al presentar la informaci\u00f3n sin el vapor
  se puede manipular la opini\u00f3n p\u00fablica:\\n\\nAl tenerlos lado a lado podemos
  ver la gran diferencia que hace el incluir o excluir el vapor de agua en la gr\u00e1fica,
  al lado izquierdo vemos que sin el vapor, el CO2 es presentado como el 81% de los
  gases, por esta raz\u00f3n se puede inferir que cualquier incremento en este gas
  por parte de los\\n\\nhumanos podr\u00eda causar efectos globales. Cuando vemos
  la gr\u00e1fica que incluye a todos los gases, contra el vapor de agua (gr\u00e1fico
  a la derecha) el CO2 conforma tan solo 3.62 % por lo cual una variaci\u00f3n en
  este gas del 5 % total por producci\u00f3n humana conformar\u00eda un porcentaje
  demasiado peque\u00f1o para ser tomado en cuenta.\\n\\nEl di\u00e1logo sobre este
  tema es v\u00e1lido y las personas podemos tener discrepancias, el problema es que
  este tema posee graves consecuencias, la primera es el encarecimiento en la producci\u00f3n
  de energ\u00eda en aras de producirla con energ\u00edas m\u00e1s \u201climpias\u201d,
  lo cual no afecta tanto a los que pueden pagar por esas energ\u00edas, sin embargo,
  los pobres son los que terminan sufriendo, porque para ellos las energ\u00edas \u201climpias\u201d
  son un lujo que no pueden pagar. El peor pecado de este movimiento alarmista pagano,
  es que se han gastado en los \u00faltimos quince a\u00f1os al menos unos cuatro
  millones de millones (cuatro trillones) de d\u00f3lares para mitigar emociones de
  CO2, sin absolutamente ning\u00fan resultado, m\u00e1s que la injusticia de desperdiciar
  todo ese dinero en una fantas\u00eda.\\n\\nBIBLIOGRAF\u00cdA\\n\\n1. Arthur B. Robinson
