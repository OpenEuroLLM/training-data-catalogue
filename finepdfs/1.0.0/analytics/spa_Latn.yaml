  aprobaci\u00f3n supone que el Departamento adquiere, a todos los efectos, el compromiso
  y la responsabilidad para la impartici\u00f3n de los cr\u00e9ditos asignados a estos
  profesores.\\n\\nRedacci\u00f3n propuesta:\\n\\n3. Los t\u00edtulos de M\u00e1ster
  en los que participan profesores de distintos departamentos deber\u00e1n contar
  con la aprobaci\u00f3n de dicha participaci\u00f3n por cada uno de los respectivos
  Consejos de Departamento y ser\u00e1n aprobados por la Junta de Centro a la que
  est\u00e9 adscrito el M\u00e1ster. Esta aprobaci\u00f3n supone que el Departamento
  adquiere, a todos los efectos, el compromiso y la responsabilidad para la impartici\u00f3n
  de los cr\u00e9ditos asignados a estos profesores.\\n\\nENSE\u00d1ANZAS DE DOCTORADO\\n\\nCAP\u00cdTULO
  IX\\n\\nLa Tesis Doctoral\\n\\nRedacci\u00f3n actual:\\n\\nArt\u00edculo 28. Presentaci\u00f3n
  de la Tesis.\\n\\n4. El requisito de presentaci\u00f3n de ejemplares se completar\u00e1
  con la entrega de una           copia digital de la Tesis a la Comisi\u00f3n General
  de Doctorado, que posteriormente ser\u00e1 archivada en la Biblioteca General de
  la Universidad. La copia deber\u00e1 entregarse en soporte digital en PDF y tambi\u00e9n
  en WORD, Open Access \u00f3 L\u00e1tex, preferiblemente en un \u00fanico fichero.
  El CD debe ir identificado exteriormente con el nombre del autor, t\u00edtulo de
  la Tesis y el Programa Responsable.\\n\\nArt\u00edculo 35. Archivo de Tesis Doctorales\\n\\nDe
  cada Tesis Doctoral aprobada, a efectos de documentaci\u00f3n y archivo, quedar\u00e1
  un ejemplar impreso en la Biblioteca General de la Universidad y otro en formato
  digital. Adem\u00e1s se remitir\u00e1 al Ministerio de Educaci\u00f3n y Ciencia
  la correspondiente ficha de la Tesis que se establezca reglamentariamente.\\n\\nRedacci\u00f3n
  propuesta:\\n\\nArt\u00edculo 28. Presentaci\u00f3n de la Tesis.\\n\\n4. El requisito
  de presentaci\u00f3n de ejemplares se completar\u00e1 con la entrega de una         copia
  digital de la Tesis a la Comisi\u00f3n General de Doctorado, que posteriormente
  ser\u00e1 archivada en la Biblioteca General y en un repositorio digital de la Universidad.
  La copia deber\u00e1 entregarse en soporte digital en formato PDF y en alguno de
  los siguientes formatos: WORD, Openoffice o LaTeX, preferiblemente en un \u00fanico
  fichero. El CD debe ir identificado exteriormente con el nombre del autor, t\u00edtulo
  de la Tesis y el Programa Responsable.\\n\\nArt\u00edculo 35. Archivo de Tesis Doctorales\\n\\nDe
  cada Tesis Doctoral aprobada, a efectos de archivo y conservaci\u00f3n quedar\u00e1
  un ejemplar impreso y otro digital en la Biblioteca General de la Universidad. Adem\u00e1s
  se remitir\u00e1 al\\n\\nMinisterio de Educaci\u00f3n y Ciencia la correspondiente
  ficha de la Tesis que se establezca reglamentariamente.\\n\\nSe\u00a0aprueba.\\n\\n7.
  Asuntos\u00a0de\u00a0tr\u00e1mite.\\n\\nNo\u00a0hay\u00a0ninguno.\\n\\n8. Ruegos\u00a0y\u00a0preguntas.\\n\\nAnte\u00a0
