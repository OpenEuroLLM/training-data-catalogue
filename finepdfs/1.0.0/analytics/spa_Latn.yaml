  F-M-INA-24\\n\\nVersi\u00f3n\\n\\nMM\\n\\nDD\\n\\nAA\"", "\"Nutrient Management
  and Nutrient Recovery Thematic Network  www.nutriman.net\\n\\nEIP-AGRI practice
  abstract\\n\\nT\u00edtulo corto:\\n\\nCenizas procedentes de astillas de madera
  natural de origen dom\u00e9stico.\\n\\nResumen:\\n\\nLas cenizas bajo las chimeneas
  se generan en grandes cantidades y concentran los minerales no combustibles de la
  madera (1 a 2 % de la masa inicial de la madera). Con niveles significativos de
  calcio, magnesio, potasio y f\u00f3sforo, esta fracci\u00f3n puede llegar a representar
  hasta el 95 % de la producci\u00f3n total de cenizas y presenta importantes ventajas
  agron\u00f3micas. El retorno al suelo de estas cenizas ofrece beneficios tanto como
  fertilizante como de enmienda del suelo. Por lo general, contienen alrededor de
  20 a 50 g de P2O5/kg (f\u00f3sforo) y alrededor de 80 a 100 g K2O/kg (potasio).\\n\\nSe
  estima que una aplicaci\u00f3n en el suelo de 2,5 t/ha cada 3 a\u00f1os es suficiente
  para el mantenimiento del suelo, pero esta dosis debe adaptarse en funci\u00f3n
  de las necesidades del cultivo y el pH del suelo. Los macro nutrientes cati\u00f3nicos,
  Ca, K y Mg, se encuentran en formas f\u00e1cilmente disponibles para los cultivos.
  Gracias a sus propiedades tamp\u00f3n, que pueden representar m\u00e1s del 50 %,
  las cenizas son un material b\u00e1sico, que puede incrementar el pH en 1 punto
  tras una aplicaci\u00f3n acumulativa de 7 a 8 t/ha.\\n\\nLos riesgos potenciales
  asociados al uso de cenizas se deben a la presencia de oligoelementos met\u00e1licos
  (MTE), a concentraciones m\u00e1s altas o m\u00e1s bajas, dependiendo del origen
  de la madera y la t\u00e9cnica de combusti\u00f3n. Para reducir estos riesgos: se
  deben elegir las cenizas de madera natural (sin tratar) y de medios no contaminados.\\n\\nEn
  estas condiciones, la ceniza de madera representa un ahorro sustancial para el agricultor
  de 100 a 150 \u20ac/t.\\n\\nPara m\u00e1s informaci\u00f3n: https://nutriman.net/farmer-platform/product/id_321\"",
  "\"Reforma Siglo 21\\n\\nVolumen 18, N\u00famero 2\\nOctubre, 2016\\n\\nLA MENTIRA
