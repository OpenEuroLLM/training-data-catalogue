  DE M\u00c1STER\\n\\nCAP\u00cdTULO IV\\n\\nProcedimiento para la elaboraci\u00f3n
  y aprobaci\u00f3n de los t\u00edtulos de m\u00e1ster universitario\\n\\nRedacci\u00f3n
  actual:\\n\\nArt\u00edculo 13. Elaboraci\u00f3n de los Planes de Estudios de M\u00e1ster\\n\\n3.
  Los t\u00edtulos de M\u00e1ster en los que participan profesores de distintos departamentos
