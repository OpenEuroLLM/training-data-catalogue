  NEOPAGANISMO DE NUESTROS TIEMPOS\\nUNA PERSPECTIVA COMPLEMENTARIA\\n\\nPor Mario
  Cely Q.\\n\\nI. REVOLUCI\u00d3N Y ESPIRITUALIDAD PAGANA\\n\\nDesde fines del siglo
  XVI podemos contar aproximadamente cuatrocientos a\u00f1os de escepticismo religioso
  y teol\u00f3gico hasta abarcar el denominado \u201csiglo de las luces\u201d y dem\u00e1s
  movimientos del esp\u00edritu humano que hasta hoy vienen sacudiendo las creencias
  tradicionales del cristianismo b\u00edblico. Entre tales movimientos podemos citar
  la Revoluci\u00f3n Francesa (1789), las Revoluciones Liberales independentistas
  (1848), la Revoluci\u00f3n de la Contracultura (1968) y la Revoluci\u00f3n del Debate
  sobre la Propia Identidad de G\u00e9nero (1989). Esta \u00faltima ha dado lugar
  a la revoluci\u00f3n actual de los Derechos Homosexuales y la promoci\u00f3n de
  la Agenda Gay o Ideolog\u00eda de G\u00e9nero en todo el mundo. La revoluci\u00f3n
  cultural gay de nuestros tiempos, una revoluci\u00f3n bien calculada por las mentes
  del gran elitismo mundial que forma parte de la gran utop\u00eda venidera y pagana
  y adem\u00e1s el producto de un\\n\\nsocialismo que ha mutado, se est\u00e1 gestando
  en nuestras propias narices. El mensaje es bastante claro: la identidad sexual o
  de g\u00e9nero y la orientaci\u00f3n sexual ya no es algo determinado por el sexo
  biol\u00f3gico y gen\u00e9tico (hombre, mujer) sino por la cultura, por los nuevos
  deseos e impulsos de las nuevas generaciones como un quebrantamiento de la moral
  b\u00edblica tradicional y de las buenas costumbres, producto de una vida de vicio
  y desenfreno en los pecados sexuales. Si miramos esto con la apropiada objetividad,
  se trata de una modificaci\u00f3n del propio concepto de persona o la propia identidad
  de persona tal como Dios lo ha determinado dentro del mundo natural: \u201cVar\u00f3n
  y hembra los hizo Dios\u201d, lo cual corresponde a sexo masculino y sexo femenino.
  Visto de otro modo, se trata de una alteraci\u00f3n del prop\u00f3sito de Dios para
  la humanidad. Todo esto, desde luego, es otra faceta del actual neopaganismo que
  amenaza las bases propias de la moralidad b\u00edblica y cristiana tal como se ha
  establecido desde la creaci\u00f3n del mundo y la vida cultural (Salmos 11:3). Una
  faceta de esto mismo es presentada por Jeffrey Satinover al decir: \u201cCambios
  profundos han estado germin\u00e1ndose y creciendo dentro de la civilizaci\u00f3n
  occidental durante mucho m\u00e1s tiempo que simplemente tres d\u00e9cadas. La contracultura
  de los a\u00f1os 60 fue solo el primer florecimiento popular de estos cambios, entre
  los que, los cambios de actitudes b\u00e1sicas hacia la sexualidad son centrales\u201d.\\n\\nDe
  igual modo, tal como hemos venido estudiando, el progreso de las ciencias sociales
  y los avances tecnol\u00f3gicos nos han vendido la idea de que la fe cristiana es
  irrelevan-\\n\\n1 En Homosexuality and the Politics of Truth, (Grand Rapids, Michigan,
  Estados Unidos: Baker, 1996), pp. 229-230.\\n\\nte, de ah\u00ed el espacio abierto
  a las espiritualidades alternativas fomentadas por la Nueva Era de Acuario dentro
  de la postmodernidad. Esto es, de hecho, un reavivamiento del gnosticismo de anta\u00f1o
  el cual se ha ramificado en diversas maneras. Y no hay duda que tales posturas tienen
  su ra\u00edz en el Renacimiento entre los siglos XIV al XVI. Paralelo a lo anterior,
  C. S. Lewis hace una importante observaci\u00f3n en su libro *La Abolici\u00f3n
  del Hombre*, en el sentido de que \u201cel ocultismo y el humanismo aparecieron
  en la historia de Occidente, m\u00e1s o menos al mismo tiempo, durante el Renacimiento.
  Visto desde otro \u00e1ngulo, la filosof\u00eda humanista y el ocultismo fueron
  dos lados del mismo reavivamiento pagano\u201d. Argumenta, por tanto, que el ocultismo
  y el humanismo racionalista no son enemigos en principio, sino filosof\u00edas aliadas
  que cooperan para oponerse al Cristianismo y a la Civilizaci\u00f3n Cristiana.\\\\(^2\\\\)\\n\\nPor
  lo tanto, todo esto debe ser un signo de admiraci\u00f3n y estudio de parte del
  creyente fiel de las Escrituras. Lo es porque debido a los antecedentes de estos
  dos movimientos, el surgimiento del nuevo humanismo y del nuevo ocultismo de la
  Nueva Era de Acuario a fines de los a\u00f1os sesenta produjeron el reavivamiento
  de los nuevos conceptos del gnosticismo de nues-\\n\\n---\\n\\n\\\\(^2\\\\) *La
  Abolici\u00f3n del Hombre* (Madrid: Ediciones Encuentro, 1994), pp. 74-79.\\n\\ntros
  d\u00edas. Algunos lo denominaron con otros nombres tales como: \u201csanidad hol\u00edstica\u201d,
  \u201cmisticismo oriental\u201d, \u201cla suprema conciencia\u201d, \u201cfilosof\u00eda
  monista\u201d (el mundo es uno en Dios). Todo esto ha generado hasta hoy un alud
  de estudios y movimientos seudoreligiosos que van desde la magia hasta la sanidad
  divina, la astrolog\u00eda, el fen\u00f3meno OVNI y la l\u00ednea directa al satanismo.\\n\\nPara
  Jeffrey Satinover, no hay duda que se trata de unas alteraciones las cuales han
  tra\u00eddo las consecuencias de un cambio profundo en el dominio del esp\u00edritu
  humano, que ha estado en camino durante siglos. En otras palabras, los actuales
  cambios de nuestras actitudes hacia la sexualidad son solo el indicador de cambios
  espirituales mucho m\u00e1s profundos que afectan todo aspecto de nuestras vidas
  a lo largo y ancho de nuestra propia cultura.\\\\(^3\\\\)\\n\\nLos comienzos del
  siglo XX vieron aparecer una grande e inusitada industrializaci\u00f3n en los Estados
  Unidos de Am\u00e9rica y un elevado ritmo de bienestar de vida. Es aqu\u00ed que
  comienza a cocinarse la idea del \u201csue\u00f1o americano\u201d. Como sabemos,
  dicha idea atrajo a millones de inmigrantes del mundo entero. La idea clave consist\u00eda
  en que por el avance de la vida econ\u00f3mica y el disfrute de los nuevos \u201cgadgets\u201d
  o electrodom\u00e9sticos, estos promet\u00edan en esencia el descanso y el disfrute
  de grandes comodidades materiales. La educaci\u00f3n y el continuo avance de ciencia
  y tecnolog\u00eda parec\u00edan asegurar que los asuntos de fe y religi\u00f3n propugnados
  por el cristianismo b\u00edblico ser\u00edan cosa del pasado. Los m\u00e1s profundos
  anhelos del esp\u00edritu humano parec\u00edan solamen-\\n\\n\\\\(^3\\\\) Satinover,
  ibid., pp. 229-230.\\n\\nte ser las fantas\u00edas nost\u00e1lgicas de nuestra infancia
  colectiva (Freud).\\n\\nPero, en efecto, los grandes te\u00f3ricos que vaticinaban
  el fin de las cuestiones teol\u00f3gicas y religiosas las cuales, como estudiamos
  antes, proven\u00edan del siglo XIX e igual fueron asumidas en el siglo XX, se equivocaron
  una vez m\u00e1s. Porque en medio de tanta comodidad material \u2014disfrutada por
  la Europa Occidental y Estados Unidos\u2014 lo que se produjo fue un horrible desierto
  espiritual. El mundo del amor por lo material no produjo aquel so\u00f1ado sentido
  de confort maduro en desprecio de lo espiritual. En vez de ello gener\u00f3 una
  nueva e intensa sed de lo espiritual. El hombre ahora se vuelve a cualquier esp\u00edritu
  que saciase su aterradora sed de sentido y significado de esta corta vida. As\u00ed,
  el esp\u00edritu dominante de nuestra era no es el esc\u00e9ptico que denigra a
  toda religi\u00f3n sino m\u00e1s bien un esp\u00edritu profundo y perennemente religioso
  que en el fondo busca la autodivinizaci\u00f3n tal como ocurri\u00f3 en el huerto
  de Ed\u00e9n (G\u00e9nesis caps. 2,3). Pero, \u00bfqu\u00e9 clase de esp\u00edritu?
  Vemos que surge un esp\u00edritu enarbolado por la Nueva Era acuariana el cual se
  opone al monote\u00edsmo \u00e9tico de la fe cristiana y a todos los conceptos teol\u00f3gicos
  emanados del Antiguo y Nuevo Testamento. Los principios de esta religi\u00f3n nueva,
  emergente, ya sean articulados de forma deliberada\\n\\no simplemente en el funcionamiento
  t\u00e1citamente en la base, est\u00e1n llegando a dominar r\u00e1pida y pr\u00e1cticamente
  nuestra moralidad p\u00fablica, a nuestra jurisprudencia, vida pol\u00edtica y educaci\u00f3n
  en general. No obstante, debemos comprender que los postulados religiosos de la
  Nueva Era de Acuario no son algo nuevo. Es simplemente *la reemergencia del paganismo*
  y sus creencias son las doctrinas del *gnosticismo*. Hoy como ayer, el gnosticismo
  no quiere al Dios de la Biblia. En palabras de Peter Jones, \u201clos antiguos gn\u00f3sticos
  sab\u00edan muy bien que si su sistema iba a funcionar entonces tendr\u00edan que
  deshacerse del Dios de la Biblia. Esto explica la anti-creaci\u00f3n extremista
  y el sentimiento anti-Antiguo Testamento que se encuentra en ciertos textos gn\u00f3sticos\u201d.\\n\\nEs
  importante notar que este paganismo reemergente no es simplemente un desprecio de
  la cosmovisi\u00f3n cristiana y b\u00edblica. Ni es simplemente la religi\u00f3n
  del humanismo, aunque el humanismo es un aspecto visible y prominente de \u00e9l.
  Para quienes est\u00e1n matriculados en la Aquarium New Age o cualquier otra forma
  de expresi\u00f3n de religi\u00f3n y \u00e9tica pagana, el m\u00e1s importante rasgo
  es la tenencia de un esp\u00edritu pagano relativo a lo moral y a lo \u00e9tico.
  *Pues la moralidad tradicional es abandonada hasta ser mistificada en un nuevo sistema
  de pensamiento el cual ofrece la idea de que el mal y las inmoralidades sexuales
  son algo neutro: no existen ni el bien ni el mal en sentido absoluto.* Las opciones
  materialista y cient\u00edficista tambi\u00e9n son superadas.\\n\\n4 En *The Gnostic
  Empire Strikes Back*, (P & R, 1992), p. 21. Hay edici\u00f3n castellana por ediciones
  Clir, *El Imperio Gn\u00f3stico Contraataca* (San Jos\u00e9, Costa Rica, 2006).\\n\\nParte
  del atractivo del paganismo se deriva de que esa espiritualidad pagana hace pocas
  demandas morales sobre la persona, siendo as\u00ed m\u00e1s \u201ctolerante\u201d
  con las diferencias humanas \u2013es decir, de la \u201cdiversidad\u201d. De esta
  manera se configura la idea de que conceptos como moralidad, verdad y justicia son
  construcciones culturales o sociales, no partes componentes de la dignidad humana
  como un reflejo de la imagen de Dios en nosotros. Por tanto, esta clase de neopaganismo
  que envuelve al mundo entero carece de una forma de distinguir entre voluntad y
  compulsi\u00f3n, entre racionalidad consciente e impulso instintivo inconsciente.\\n\\nII.
  DESPRECIO DEL PECADO, UN DESPRECIO CONTRA DIOS Y LA HUMANIDAD\\n\\nComo Palabra
  de Dios, la Biblia ense\u00f1a que el pecado es la explicaci\u00f3n central de todos
  los sufrimientos humanos. Esto no lo puede negar aquel que todav\u00eda cree en
  la racionalidad. Pero justamente, esta visi\u00f3n es menospreciada por el neopaganismo
  de hoy al enfatizar que el pecado y todas sus repercusiones de dolor y muerte sean
  algo aparentes. Estos graves errores se reproducen ahora en los esquemas sociales
  de la vida pol\u00edtica, jur\u00eddica, \u00e9tica y educativa en todos los pa\u00edses
  de la Am\u00e9rica Latina.5 La raz\u00f3n central es que poderosos organismos pol\u00edticos
  gubernamentales\\n\\n5 Hoy, sept. 17 de 2015, estamos en espera acerca de lo que
  arbitrariamente querr\u00e1 decidir la Corte Suprema de Justicia para nuestro sufrido
  pa\u00eds de Colombia. \u00bfSe atrever\u00e1 a presentar la homosexualidad como
  un derecho humano en contra de los Derechos de Dios?\\n\\ncomo la ONU, es el mayor
  patrocinador de estos nocivos esquemas dentro de nuestras diferentes sociedades.
  Por ejemplo, esta entidad pol\u00edtica est\u00e1 empe\u00f1ada en prestar un may\u00fasculo
  apoyo a los \u201cDerechos Homosexuales\u201d en Am\u00e9rica Latina a trav\u00e9s
  de gobiernos y parlamentos y Cortes locales, lo cual trae aparejado la legalizaci\u00f3n
  de la pederastia, la pedofilia y otros vicios execrables. Todo esto junto, es lo
  que justa y prof\u00e9ticamente C. S. Lewis denomin\u00f3 \u201cLa Abolici\u00f3n
  del Hombre\u201d. Se trata de una realidad innegable. No obstante, debemos rechazar
  a toda costa la espiritualidad de este neopaganismo moderno as\u00ed como sus principios
  cient\u00edficistas y humanistas por una parte, y por otra, toda multiplicidad \u201cNueva
  Era de Acuario\u201d. Todo el que lea este ensayo, de igual modo, deber\u00eda tratar
  de comprender por qu\u00e9 es que los cristianos de convicciones b\u00edblicas tambi\u00e9n
  estamos en contra de la denominada \u201cHermandad Universal\u201d as\u00ed como
  de la \u201cPaternidad Universal de Dios\u201d sobre todos los hombres. Debemos
  estarlo porque se trata de conceptos y organizaciones mas\u00f3nicas falsas que
  militan contra toda verdad y por ende, contra el Dios de los cielos y la tierra,
  el Dios de la Biblia. Si al presentar la verdad divina el neopaganismo actual se
  molesta, esto no nos debe importar. A fin de cuentas, si la humanidad contin\u00faa
  desoyendo la Palabra de Dios y la propia voz de su conciencia, un nuevo abismo de
  dolor y sufrimiento peor que el de la Segunda Guerra Mundial podr\u00eda aguardar
  a la humanidad entera. Con esta advertencia, no importa que seamos catalogados de
  tener una \u00a1mente estrecha! Sin embargo, a pesar de todos los errores que este
  tipo de falsa espiritualidad desarroll\u00f3 en Europa en las d\u00e9cadas pasadas
  \u2013recu\u00e9rdese aqu\u00ed que el nazismo de Hitler se bas\u00f3 en este\\n\\ntipo
  de pensamiento espiritualista\u2014la humanidad no quiere aprender. M\u00e1s bien,
  se est\u00e1 preparando para una nueva y m\u00e1s efectiva manipulaci\u00f3n mundial
  a manos de cualquier s\u00faper l\u00edder que le ofrezca \u201cpaz y seguridad\u201d
  (1\u00aa Tesalonicenses 5:3). (Recordemos que los antiguos comunistas y socialistas
  tambi\u00e9n dec\u00edan algo parecido: Pan, Paz y Libertad, pero nunca encontraron
  esto).\\n\\nIII. LOS ENGA\u00d1OS DE LA NUEVA UTOP\u00cdA PAGANA\\n\\nLlegado a
  este punto, debemos afirmar enf\u00e1ticamente que ni la ciencia ni el neopaganismo
  actual \u2014o gnosticismo moderno\u2014 nos acerca a aquello que anhelamos tan
  profundamente: la plenitud de sentido, el amor y la sed de verdadero significado
  humano o paz de esp\u00edritu. Todo lo que la \u201cnueva espiritualidad ut\u00f3pica\u201d
  promueve en el mundo es un autoenga\u00f1o debido a que por esta v\u00eda tampoco
  jam\u00e1s el hombre ha logrado saciar su sed espiritual. A diferencia del actual
  esquema neopagano no hay sobre la tierra sistema tan perfecto como el que observamos
  en las Escrituras judeo-cristianas. Pues all\u00ed se dibuja el m\u00e1s perfecto
  plan que cuando se es cre\u00eddo con el coraz\u00f3n y la raz\u00f3n, produce la
  satisfacci\u00f3n racional m\u00e1s verdadera por medio de la fe, la verdadera dimensi\u00f3n
  que todo hombre pecador\\n\\nnecesita. Se requiere que se vuelva en fe y arrepentimiento
  al Dios de la Biblia y acepte su plan redentor por medio de Jesucristo su unig\u00e9nito
  Hijo. Solo este sistema de gracia regeneradora y por medio de la fe en el \u00fanico
  redentor y Se\u00f1or Jesucristo podr\u00e1 obtener el perd\u00f3n de pecados para
  que de este modo todo hombre alcance el verdadero sentido de la justicia, el verdadero
  gozo, la correcta relaci\u00f3n de su conciencia con Dios, con su pr\u00f3jimo y
  con la naturaleza. Pues precisamente fueron estos aspectos los que desde los comienzos
  humanos se perdieron por la desobediencia y rebeli\u00f3n contra el Dios creador
  (G\u00e9nesis 3) pero ahora dichosamente son recuperados en Cristo.\\n\\nIV. \u00bfC\u00d3MO
  HEMOS LLEGADO HASTA AQU\u00cd?\\n\\nAhora bien, al haber realizado estos an\u00e1lisis
  nos surge esta pregunta de vital importancia: \u201c\u00bfC\u00f3mo hemos llegado
  hasta aqu\u00ed?\u201d La respuesta, me atrevo a decirlo, se debe al r\u00e1pido
  proceso de descristianizaci\u00f3n en la que la propia cristiandad bien puede ser
  responsable. Este progreso del paganismo que no es \u201cprogreso\u201d obedece
  igual al proceso de apostas\u00eda que se ha venido gestando dentro de las filas
  de muchos que se dicen ser seguidores de Cristo. Me refiero aqu\u00ed a los sistemas
  teol\u00f3gicos antib\u00edblicos que se fraguaron al calor del humanismo racionalista
  liberal desde los pasados siglos. Y no cabe duda que en el fondo, lo que ha resultado
  es un peligroso juego mortal, pues el hombre se ha atrevido a rechazar o a rebajar
  el \u00fanico sistema de valores morales absolutos que tenemos en la ley de Dios
  (\u00c9xodo 20: 1-17). Tal desprecio por la moral divina est\u00e1\\n\\nproduciendo
  las numerosas y tr\u00e1gicas consecuencias que observamos en estos tiempos.\\n\\nV.
  MUCHOS DIOSES Y UN SOLO DIOS VERDADERO. EL MONOTE\u00cdSMO RADICAL (1 COR. 8:4-6)\\n\\nRespecto
  a los \u00eddolos y la idolatr\u00eda, era algo com\u00fan que saturaba la vida
  entera de griegos y romanos. La vida social y sus fiestas, los temas de justicia
  y vida pol\u00edtica, los honores al C\u00e9sar, todo estaba relacionado con cultos
  religiosos y paganos. El ap\u00f3stol Pablo dej\u00f3 constancia de que se trataba
  de una grande vanidad e invento de la mente humana. Guarda relaci\u00f3n con todo
  aquel mundo animista y fetichista que como una sombra se esparci\u00f3 por el mundo
  pagano que prefiri\u00f3 la adoraci\u00f3n de \u00eddolos antes que al Creador.
  Por esta raz\u00f3n afirma que \u201cun \u00eddolo nada es en el mundo, y que no
  hay m\u00e1s que un Dios (1 Cor. 8:4b). Pablo, desaf\u00eda a los muchos dioses
  y muchos se\u00f1ores porque en el fondo pertenecen a las imaginaciones mitol\u00f3gicas
  que eran consideradas especiales ya sea en los cielos o en la tierra; y, sin embargo,
  eran enga\u00f1os. De ah\u00ed que Pablo afirme de nuevo que \u201cpara nosotros
  solo hay un Dios, el Padre, del cual proceden todas las cosas, y nosotros somos
  para \u00e9l; y un Se\u00f1or, Jesucristo, por medio del cual son todas las cosas,
  y nosotros por medio de \u00c9l\u201d (vv. 5-6).\\n\\nHoy el mundo vuelve a levantar
  sus \u00eddolos de enga\u00f1o a fin de justificar el pecado seg\u00fan sus manifestaciones
  er\u00f3ticas y desviaciones o parafilias sexuales que destruyen. Veamos esto ahora
  desde la perspectiva del Antiguo Testamento para demostrar c\u00f3mo el ap\u00f3stol
  Pablo hizo su argumentaci\u00f3n basado en el consenso dado por Dios desde los propios
  d\u00edas del Ed\u00e9n seg\u00fan G\u00e9nesis 1-3, pasando por la etapa patriarcal
  y la prof\u00e9tica, los cuales enfatizaron siempre el monote\u00edsmo \u00e9tico
  radical.\\n\\nLo que se llama el Monote\u00edsmo \u00c9tico o Radical fue introducido
  en el escenario de la cultura pagana del antiguo Cercano Oriente por Israel el antiguo
  pueblo n\u00f3mada de Dios. Esta expresi\u00f3n, \u201cmonote\u00edsmo \u00e9tico\u201d,
  expresa dos puntos fundamentales seg\u00fan la revelaci\u00f3n del Antiguo Testamento:
  Primero, que solo existe un Dios y como solo existe un Dios, es, por tanto, el Dios
  soberano de todos los hombres. Segundo, que el inter\u00e9s central de este Dios,
  y por tanto de su pueblo, es la moralidad, la santidad, la justicia y la bondad.
  Para la mente hebrea del AT el rasgo m\u00e1s distintivo del car\u00e1cter de Dios
  no era sus atributos incomunicables o trascendententes sino su santidad. As\u00ed,
  como vemos en la Biblia, el Dios viviente es tan \u201ctotalmente trascendente\u201d
  que mirar simplemente a su gloria y bondad significa la muerte instant\u00e1nea
  (\u00c9x. 33:20). De ah\u00ed que en la visi\u00f3n del profeta Isa\u00edas los
  querubines no cesan de decir: \u201cSanto, santo, santo, es el Se\u00f1or de los
  ej\u00e9rcitos; toda la tierra est\u00e1 llena de su gloria\u201d (6:3).\\n\\nEn
  los tiempos de Mois\u00e9s, Dios encarg\u00f3 a su pueblo la moralidad y la santidad
  seg\u00fan Dios mismo la ense\u00f1a para que Israel fuese un pueblo diferente de
  los dem\u00e1s pueblos que se hund\u00edan en el paganismo y la corrupci\u00f3n
  moral incluyendo la homosexualidad. La expresi\u00f3n \u201csantos ser\u00e9is porque
  yo soy santo\u201d era proverbial. Sobre este asunto, Gordon J. Wenham sentencia
  que \u201ces uno de los esl\u00f3ganes del Lev\u00edtico. Est\u00e1 repetido dos
  veces aqu\u00ed (Lv. 11: 44,45) y aparece de nuevo otras tres veces en el mismo
  libro (19:2;\\n\\n20:7, 26). El m\u00e1s alto deber del hombre es imitar a su Creador:
  \u201cSed, pues, vosotros perfectos, como vuestro Padre que est\u00e1 en los cielos
  es perfecto.\u201d\\\\(^6\\\\) As\u00ed mismo, est\u00fadiese completo los interesantes
  cap\u00edtulos 18 y 19 del Lev\u00edtico. Aqu\u00ed sobresale la enorme diferencia
  entre la moralidad que proclama el verdadero Dios frente a los dioses paganos de
  Cana\u00e1n. Esto \u00faltimo, en esencia, es lo que el actual paganismo ha venido
  estableciendo dentro de la cultura occidental. Notemos un ejemplo por medio del
  cual podemos establecer que no existe diferencia entre el paganismo cananeo, el
  paganismo gn\u00f3stico de los dos primeros siglos de la era cristiana y el paganismo
  contempor\u00e1neo que se esparce en el mundo entero.\\n\\nJ. I. Packer sentencia
  que... \u201cLas religiones cananeas como las de Ugarit, pon\u00edan mucho \u00e9nfasis
  en la reproducci\u00f3n en la tierra, en las cosechas y en la matriz de la mujer.
  Este \u00e9nfasis ayudaba a entender la insistencia en las uniones sexuales. La
  Biblia y los textos cananeos de Ugarit usan las palabras *qadesh* y *quedesha*,
  que significan \u201csanto\u201d (la primera es masculina; la segunda, femenina).
  En Ugarit estos santos eran sacerdotes homosexuales y sacerdotisas\\n\\n\\\\(^6\\\\)
  En *The Book of Leviticus* (Grand Rapids, MI, USA: Eerdmans, 1979), pp. 180,181.\\n\\nque
  se dedicaban a la prostituci\u00f3n. Encontramos una fuerte reacci\u00f3n hebrea
  contra la \u201cprostituci\u00f3n c\u00fatlica\u201d en pasajes tales como Lev\u00edtico
  19:29: \u201cNo contaminar\u00e1s a tu hija haci\u00e9ndola fornicar, para que no
  se prostituya la tierra y se llene de maldad\u201d; y Deuteronomio 23:17: \u201cNo
  haya rame- ras (quedesha) entre las hijas de Israel, ni haya sodomita (qadesh) entre
  los hijos de Israel\u201d. Una de las reformas de Jos\u00edas fue derribar \u201clos
  lugares de prostituci\u00f3n idol\u00e1trica\u201d (2 Reyes 23:7).\\n\\nVI. LA REAPARICI\u00d3N
  EN EL SIGLO XX DE LOS CULTOS IDOL\u00c1TRICOS DE CANA\u00c1N. NO HAY NADA NUEVO
  BAJO EL SOL\\n\\nLa revoluci\u00f3n sexual de nuestros d\u00edas es una reaparici\u00f3n
  calcada de aquellos grotescos comportamientos cananeos y mesopot\u00e1micos de la
  antig\u00fcedad. Hoy ha sido resucitado por el gnosticismo en forma de un neopaganismo
  dentro de un marco m\u00e1s amplio haciendo que los vicios sexuales sean un polimorfismo
  aceptable para una parte de la sociedad. Pero al igual que anta\u00f1o, estos vicios
  eran rechazados por la mayor\u00eda, y as\u00ed ha venido siendo en toda \u00e9poca
  y cultura. Ocurren cuando la humanidad abandona a Dios y su sistema de moralidad
  que por naturaleza tenemos inherente en nuestra propia constituci\u00f3n humana
  para dar paso a las malas costumbres y divinizar el poder del instinto sexual. Aquellos
  antiguos dioses como Baal, Asera, Anat, Mot, Astarte, etc., hoy han resucitado para
  guiar a los humanos que adoran sus instintos sexuales al abismo.\\n\\n7 El Mundo
  del Antiguo Testamento, (Miami, Estados Unidos: Editorial Vida, 1985), p. 170.\\n\\nde
  donde salieron. Sin embargo, Yahveh, el Dios verdadero y su Cristo-Rey, al cual
  ha puesto en su santo monte (Sal. 2:6) sigue firme en su trono. Es el Dios soberano
  y creador de los cielos y de la tierra. No tiene una diosa a su lado con la cual
  cohabita para crear el mundo al mejor estilo de los poemas y relatos asirios y babilonios
  como el *Enuma Elish* y *Gilgamesh*. Su moralidad es tan elevada que cuando los
  hombres la implementan en sus sistemas de vida cultural, eclesi\u00e1stica, pol\u00edtica,
  econ\u00f3mica y social, da como resultado una vida humana m\u00e1s digna y mejor
  orientada seg\u00fan la realidad que vivimos. La verdad, el amor y la justicia resultan
  m\u00e1s coherentes una vez que los hombres han pasado con la v\u00edctima expiatoria
  por el altar del holocausto y el ministerio del sacerdote ordenado por Dios (Lev\u00edtico
  4:1-35), ministerio que ahora ha sido cumplido a plenitud en Cristo y su obra expiatoria
  y sumo sacerdotal (l\u00e9ase los cap\u00edtulos 8, 9, 10 de la carta a los Hebreos).\\n\\nSobre
  esta estructura estudiada, estamos preparados para decir que fue a trav\u00e9s de
  la predicaci\u00f3n del evangelio de Jesucristo que comenzaron los ap\u00f3stoles,
  no el mundo jud\u00edo, que el monote\u00edsmo \u00e9tico influyese decisivamente
  en el mundo pagano. O podr\u00edamos decir, por medio de la fe cristiana como una
  variante del juda\u00edsmo. Como Franz Rosenzweig, eminente hombre de letras jud\u00edo,
  escribi\u00f3: \u201cEl cristianismo es el juda\u00edsmo para los gentiles\u201d.
  Por su parte Satinover declara: \u201cMientras a manos de la Iglesia se propagaba
  este monote\u00edsmo \u00e9tico, ech\u00f3 abajo muchos dominios paganos con fuerza
  y velocidad sorprendentes y esta-\\n\\n---\\n\\n8 Samuel H. Bergman, *Fe y Raz\u00f3n*,
  (Bs. Aires: Editorial Paid\u00f3s, 1967), pp. 68-75.\\n\\nbleci\u00f3 un orden moral
  que imper\u00f3 hasta el renacimiento.\u201d\\\\textsuperscript{9} Y luego, en la
  Reforma del siglo XVI, regres\u00f3 a manera de milagro seg\u00fan los prop\u00f3sitos
  de Dios. Bien o mal, a partir del emperador Constantino el Grande, la cultura occidental
  no volvi\u00f3 a ser la misma hasta hoy. Sin embargo, vemos que nuestra cultura
  entr\u00f3 en crisis, est\u00e1 en peligro de que desaparezcan los valores tradicionales
  que el cristianismo introdujo desde el d\u00eda de Pentecost\u00e9s cuando el Esp\u00edritu
  Santo fue enviado por el Padre y el Hijo (Juan 14:16,26; 16:7; Hch.2) para establecer
  su Iglesia. No obstante, debemos creer bajo el marco de la esperanza y su misericordiosa
  bondad que \u00a1Dios tendr\u00e1 la \u00faltima carta que decidir\u00e1 el destino
  de nuestra herida cultura occidental! \u00a1Hemos de enfatizar que luego de esta
  \u201cmarea t\u00f3xica\u201d, podr\u00eda venir un gran avivamiento en todo el
  mundo obrado por el Santo Esp\u00edritu de Dios! \u00a1Que esta tambi\u00e9n sea
  nuestra oraci\u00f3n!\\n\\nMario Cely Q. ha sido pastor desde el a\u00f1o 1982.
  Ha cursado estudios de maestr\u00eda en Teolog\u00eda y Antropolog\u00eda Cultural.
  Es Profesor de Teolog\u00eda Sistem\u00e1tica, Apolog\u00e9tica, Filosof\u00eda,
  Historia del Cristianismo y Religiones Comparadas. Es de igual forma un activista
  social en su pa\u00eds Colombia y conferencista dentro y fuera de su pa\u00eds.
  Est\u00e1 casado y tiene tres hijas. Vive en la ciudad de Bogot\u00e1.\\n\\n\\\\textsuperscript{9}
  Ibid., p. 231.\\n\\nENCUENTRA LAS DIFERENCIAS\\n\\nNO EXISTE DIOS FUERA DE NOSOTROS,
  NO EXISTEN NI EL BIEN NI EL MAL: TODO ES RELATIVO.\\n\\nCIERTAMENTE, NO MORIR\u00c9IS...\\n\\nNECESITAS
  UNA EXPERIENCIA ESPIRITUAL TRASCENDENTAL PARA PODER VER REALMENTE.\\n\\nSER\u00c1N
  ABIERTOS VUESTROS OJOS...\\n\\nBUSCA EN TU INTERIOR. DIOS EST\u00c1 DENTRO DE M\u00cd,
  Y EST\u00c1 DENTRO DE TI. TODO ES DIOS, POR LO TANTO, \u00a1T\u00da ERES DIOS!\\n\\n\u00a1Y
  SER\u00c9IS COMO DIOS!\\n\\nRESPUESTAS: NO HAY NINGUNA\\n\\nMi hijo, Danny, lleg\u00f3
  a casa de su pr\u00e1ctica de b\u00e9isbol japon\u00e9s exclamando \u201cpap\u00e1,
  el entrenador nos est\u00e1 haciendo adorar el suelo\u201d. El entrenador les hab\u00eda
  hecho inclinarse hacia el suelo en adoraci\u00f3n. Llam\u00e9 a un pastor japon\u00e9s
  que dijo que esto era de hecho falsa adoraci\u00f3n. Me record\u00f3 que Jap\u00f3n
  es pante\u00edsta, al igual que las religiones orientales en general. Todo es \u201cdios\u201d.
  No hay distinci\u00f3n entre el Creador y la creaci\u00f3n. En esa visi\u00f3n del
  mundo, es apropiado adorar un campo de juego. Esto m\u00e1s adelante se convirti\u00f3
  en un problema para Danny en la pr\u00e1ctica porque no quer\u00eda inclinarse.\\n\\nEl
  primer error en la religi\u00f3n oriental es que no hay un Dios con D may\u00fascula.
  Los dioses son peque\u00f1os y muchos, incluyendo a los antepasados, el emperador,
  estatuas y miles m\u00e1s. Los ateos en Occidente son los que no creen en \u201cDios\u201d;
  los ateos en Jap\u00f3n son los que no creen en \u201clos dioses\u201d.\\n\\nEl
  Islam tiene el error opuesto: solo un Al\u00e1 trascendente sin inmanencia; no es
  Emmanuel (\u201cDios con nosotros\u201d).\\n\\nEn Occidente, hemos asumido a \u201cDios\u201d.
  En mi denominaci\u00f3n estadounidense, el primer voto de membres\u00eda a la Iglesia
  no es acerca de Dios, sino acerca del pecado. La primera pregunta a los miembros
  de nuestra denomina-\\n\\n1 Tomado y traducido de la revista Table Talk. \u00a9Ligonier
  Ministries. Usado con el debido permiso.\\n\\nci\u00f3n japonesa es precisamente
  acerca de la fe en \u201cel Dios creador vivo y verdadero\u201d. La segunda pregunta
  tiene que ver con el pecado, y la tercera con la salvaci\u00f3n a trav\u00e9s de
  Cristo.\\n\\nFuimos misioneros en Jap\u00f3n durante cuatro a\u00f1os antes de ver
  el primer japon\u00e9s convertido. Sin embargo, en nuestro tercer a\u00f1o, un estudiante
  de la universidad internacional se qued\u00f3 con nosotros. Compartimos el Evangelio
  con Phillip. \u00c9l profes\u00f3 su fe en Cristo en un espacio de tres d\u00edas.
  Pens\u00e9 en todo el pueblo japon\u00e9s que hab\u00edamos amado y con quienes
  compart\u00edamos el Evangelio cuando ven\u00edan a nuestra casa, pero sin fruto
  aparente. Finalmente entend\u00ed. Phillip era de las Filipinas, la \u00fanica naci\u00f3n
  asi\u00e1tica \u201ccristianizada\u201d. \u00c9l cre\u00eda muchas cosas correctas
  acerca de Dios. Cre\u00eda que Dios es trino, santo, misericordioso y omnipotente,
  omnisciente, y as\u00ed sucesivamente. A \u00e9l le gustaba Jes\u00fas. Simplemente
  no hab\u00eda entendido la gracia.\\n\\nEl coraz\u00f3n de Phillip hab\u00eda sido
  preparado para el Evangelio al igual que los corazones de muchos gentiles temerosos
  de Dios del Imperio Romano, donde el Ap\u00f3stol Pablo trabaj\u00f3. Pablo fue
  primero a las sinagogas de cada ciudad. La influencia de los jud\u00edos y su creencia
  en un solo Dios estaba en todas partes. Cornelio y Lidia eran gentiles temerosos
  de Dios preparados para el Evangelio por esta influencia.\\n\\nSin una visi\u00f3n
  correcta de Dios, el Evangelio parece tonto e innecesario para los que tienen una
  visi\u00f3n religiosa oriental. Sin el omnisciente Dios, tres veces santo (Isa.
  6: 3 ss), no hay entendimiento de pecado. No hay ni siquiera una buena palabra en
  japon\u00e9s para el concepto de culpa.\\n\\nante un Dios forense. Por lo tanto,
  no es necesaria \u201cla locura de la cruz\u201d.\\n\\nSi no hay un Dios absoluto,
  entonces no hay absolutos. Todo es relativo. Esta falsa visi\u00f3n del mundo tambi\u00e9n
  empuja al hombre hacia la autosuficiencia. Un famoso dicho japon\u00e9s habla de
  un Samur\u00e1i que no ha comido durante d\u00edas, pero se limpia los dientes con
  un palillo de dientes. \u00c9l no puede demostrar que padece necesidad, la actitud
  opuesta del pensamiento del Evangelio.\\n\\nSin el temor a Dios, el temor al hombre
  domina. El temor a los hombres y los \u201cresultados\u201d incre\u00edbles que
  esta falsa visi\u00f3n del mundo puede producir podr\u00edan parecer buenos en la
  superficie. Puede producir excelencia, coches de calidad y una sociedad diligente
  y educada. Sin embargo, la motivaci\u00f3n \u201csin Dios\u201d centrada en el hombre
  y la motivaci\u00f3n detr\u00e1s de todas estas cosas aparentemente buenas tambi\u00e9n
  tiene un efecto tremendo que aparece en forma de la epidemia de depresi\u00f3n,
  la tasa de suicidio y la disfunci\u00f3n familiar que se ven en Jap\u00f3n y otros
  pa\u00edses asi\u00e1ticos. Las tasas de suicidio se han disparado en las econom\u00edas
  de r\u00e1pido crecimiento de Asia, entre ellas Jap\u00f3n, China y otras naciones.
  Los pa\u00edses asi\u00e1ticos con altas tasas de ate\u00edsmo tambi\u00e9n tienden
  a tener altas tasas de suicidio. Si el hombre no es un ser creado a imagen de Dios,
  no tiene valor intr\u00ednseco.\\n\\nUn hombre japon\u00e9s que vino a Cristo en
  nuestra iglesia se emocion\u00f3 mucho con el Evangelio. Hablando de su anterior
  visi\u00f3n del mundo sin ning\u00fan concepto correcto de Dios, dijo que era como
  tener un sistema operativo incorrecto en una computadora. Incluso si un buen archivo\\n\\nfuera
  abierto, no se puede leer debido a que el software del sistema est\u00e1 malo. \u00c9l
  dijo: \u201cLos japoneses tienen que eliminar el software del sistema defectuoso
  y volver a instalar el software del sistema correcto donde el Dios vivo y verdadero
  es central. Entonces podremos entender el mundo, la verdad y el Evangelio\u201d.\\n\\nLa
  religi\u00f3n oriental est\u00e1 en bancarrota. Escuchamos el sonido del gong a
  las 6:00 todas las ma\u00f1anas desde el santuario sinto\u00edsta local para despertar
  a los dioses. No se despiertan.\\n\\nPocos japoneses creen realmente en el budismo
  y el sinto\u00edsmo. Es m\u00e1s cultural, como el cristianismo nominal de Am\u00e9rica.
  Un amigo es \u201canciano\u201d en un santuario sinto\u00edsta y en un templo budista,
  pero no cree en ninguna de las dos religiones. Habiendo vivido en Asia durante m\u00e1s
  de veinticinco a\u00f1os, y visto el error de las religiones orientales y su impotencia,
  me sorprende c\u00f3mo est\u00e1n surgiendo en el Occidente.\\n\\nPor el contrario,
  los asi\u00e1ticos est\u00e1n volando hacia el Evangelio desde sus creencias religiosas
  orientales. El crecimiento de la iglesia de Cristo en China, India, Nepal y otros
  pa\u00edses asi\u00e1ticos est\u00e1 bien documentado.\\n\\nDebemos esperar esto,
  ya que Dios ha prometido que las multitudes vendr\u00edan a \u00e9l del Oriente,
  as\u00ed como del Occidente (Is. 43:5 ss; Mat. 8:11).\\n\\nPablo dijo que el evangelio
  era una locura para los gentiles (1 Cor. 1:23) quienes ten\u00edan una baja perspectiva
  de Dios, como las religiones orientales de hoy. A partir de las\\n\\nEscrituras
  conocemos la verdadera locura: \u201cDice el necio en su coraz\u00f3n: \u2018No
  hay Dios\u2019\u201d (Sal. 53:1).\\n\\nDr. Dan Iverson es el l\u00edder nacional
  en Jap\u00f3n de la agencia misionera Mission to the World, una organizaci\u00f3n
  de plantaci\u00f3n de iglesias dedicada al crecimiento de la iglesia en el mundo.\\n\\nMI
  CREDO COMO MUJER CRISTIANA\\n\\nPor Rebecca Jones\\n\\n\u2022 Creo que Dios me cre\u00f3,
  una mujer, a su imagen.\\n\\n\u2022 Creo que Dios tiene la autoridad, como mi Creador,
  para definir toda mi persona: cuerpo, alma, mente, y emociones.\\n\\n\u2022 Creo
  que Dios ha escogido revelarse por la creaci\u00f3n del mundo donde habito, y en
  la encarnaci\u00f3n de su Hijo, Jesucristo. Aprendo de estas revelaciones en su
  Palabra, la Biblia, la cual se aclara por el poder de Jesucristo, cuyo Esp\u00edritu
  obra en mi coraz\u00f3n y en mi entendimiento.\\n\\n\u2022 Creo que Dios existe
  como uno, en tres personas iguales, y que estas personas tienen entre s\u00ed relaciones
  y funciones que son reveladas en las Escrituras.\\n\\n\u2022 Creo que todo compa\u00f1erismo
  humano es una reflexi\u00f3n de aquel compa\u00f1erismo perfecto, definido y experimentado
  desde toda la eternidad por Dios mismo en sus relaciones trinitarias.\\n\\n\u2022
  Creo que Dios hizo a su imagen, tanto al hombre como a la mujer.\\n\\n\u2022 Creo
  que Dios le dio al hombre un papel federal (representativo) en la humanidad en general
  (visto tanto en Ad\u00e1n como en Cristo) y que \u00c9l tambi\u00e9n dio a todo\\n\\n1
  Este es un fragmento del libro \u00bfAplasta a la mujer el cristianismo?, por Rebecca
  Jones.\\n\\nhombre el papel representativo y autoritario como cabeza tanto de su
  esposa como de su familia.\\n\\n\u2022 Creo que Dios cre\u00f3 el matrimonio y la
  familia como la entidad fundamental de la sociedad.\\n\\n\u2022 Creo que Dios cre\u00f3
  el matrimonio (al igual que todas las instituciones humanas) para revelar el car\u00e1cter
  de sus relaciones con los hombres.\\n\\n\u2022 Creo que Dios me cre\u00f3 para ser
  de ayuda a mi marido, y que al servir y obedecerle, tambi\u00e9n sirvo y obedezco
  a Dios.\\n\\n\u2022 Creo que mi marido es creado sobre todo para amar a Dios, pero
  que en sus relaciones humanas, \u00e9l debe reflejar la naturaleza de Dios al cumplir
  su papel de protector, defensor, gu\u00eda, l\u00edder, maestro, proveedor y padre.\\n\\n\u2022
  Creo que soy creada sobre todo para amar a Dios, y, dado que Dios no me escogi\u00f3
  para una vida de soltera, tambi\u00e9n soy creada para criar a mis hijos, apoyar
  a mi marido, y servir a Dios y a su Iglesia, principalmente, aunque no exclusivamente,
  en el ejercicio de estas funciones.\\n\\n\u2022 Creo que debo considerar mi hogar
  como la prioridad principal de mi ministerio a Dios y que al hacer esto, no traer\u00e9
  ning\u00fan reproche al evangelio.\\n\\n\u2022 Creo que debo desarrollar una atracci\u00f3n
  sexual, una honestidad intelectual, y un fervor espiritual en mi papel como esposa.\\n\\n\u2022
  Creo que mi marido dar\u00e1 respuesta a Dios por su parte en mi desarrollo espiritual,
  pero que cuando est\u00e9\\n\\ndelante del trono del juicio de Dios, ser\u00e9 justificada,
  no por la justicia de mi marido, sino por la justicia de Cristo.\\n\\n\u2022 Creo
  que la Biblia me ense\u00f1a como mujer a sostener la autoridad de mi marido en
  mi matrimonio y en mi hogar; a respetarla, animarla, desearla, apreciarla, trabajar
  para aumentarla y animar a mis hijos a hacer lo mismo.\\n\\n\u2022 Creo que las
  Escrituras me impiden ejercer una autoridad espiritual final en la Iglesia. Debo
  evitar la usurpaci\u00f3n de los papeles de autoridad ejercitados por los hombres
  en la ense\u00f1anza y en la disciplina eclesi\u00e1stica. Espec\u00edficamente,
  tengo que evitar la ense\u00f1anza a los hombres o el juicio en contra del liderazgo
  masculino.\\n\\n\u2022 Creo que soy libre para expresarme verbalmente dentro de
  la Iglesia para animar, alabar, testificar, aconsejar, orar, cantar himnos y canciones,
  e instruir sin violar las estructuras de autoridad ya mencionadas. Soy especialmente
  responsable por el entrenamiento y ense\u00f1anza de las mujeres m\u00e1s j\u00f3venes,
  con la meta de animarlas a amar a sus maridos e hijos, a ocuparse de sus casas,
  y a no traer ning\u00fan reproche al evangelio.\\n\\n\u2022 Creo que tambi\u00e9n
  debo ejercer mis dones particulares y personales en la Iglesia sin ignorar la hospitalidad,
  el servicio humilde, la disponibilidad en emergencias, y toda buena obra.\\n\\n\u2022
  Creo que el pecado afecta todo aspecto de mi vida. Por consiguiente, no me sorprende
  que mi naturaleza pecaminosa se rebele contra algunas de las verdades que confieso.
  \u00a1Que Dios en su misericordia suavice mi coraz\u00f3n para conformarme a su
  voluntad perfecta!\\n\\n[Dado que creo e intento poner en la pr\u00e1ctica tales
  creencias, no he tenido mucha voz p\u00fablica. Alguien me pregunt\u00f3 una vez,
  \u201c\u00bfd\u00f3nde est\u00e1n las mujeres cristianas que est\u00e1n dispuestas
  a tocar y defender estos asuntos? Si los hombres hablan de esto, nadie los escuchar\u00e1\u201d.
  La respuesta, por supuesto, es que las mujeres cristianas est\u00e1n obedeciendo
  el mandamiento b\u00edblico de \u201cocuparse en la casa\u201d, y por esta raz\u00f3n
  no tienen la oportunidad de expresar su voz. Me agrada el privilegio de compartir
  este credo con cualquier persona que lo halle beneficioso. Si quiere dialogar conmigo
  respecto a su contenido, me puede escribir por medio de nuestro sitio web, http:www.spirit-wars.com].\\n\\nHumildemente,\\n\\nRebeca
  Jones\\n\\nRebecca Jones se gradu\u00f3 del Wellesley College y se cas\u00f3 con
  Peter Jones en 1971. Ella y Peter tienen siete hijos y catorce nietos. Ha servido
  en la junta el Gremio de Escritores Cristianos de San Diego y en el Consejo de Masculinidad
  y Feminidad B\u00edblica. Ense\u00f1a estudios b\u00edblicos en su iglesia local
  y en ocasiones da charlas en retiros y conferencias para mujeres. Ha publicado dos
  libros y trabaja como voluntaria en escritura y edici\u00f3n para el ministerio
  de truthXchange.\\n\\nPeter Jones\\n\u201cImperio Gn\u00f3stico Contra-ataca\u201d\\n\\nRebecca
  Jones\\n\u201c\u00bfAplasta a la mujer el cristianismo\u201d\"", "\"VIIIFORODE Salud
  Cardiovascular p a r a P a c i e n t e s y F a m i l i a r e s 2 0 2 1\\n\\nMI\u00c9RCOLES,
  17 DE NOVIEMBRE, 18.00 H\\n\\nSALUD CARDIOVASCULAR Y ANTICOAGULACI\u00d3N EN LA
  MUJER\\n\\nMODERADOR\\n\\nDr. Juan Jos\u00e9 G\u00f3mez Doblas\\n\\nCardi\u00f3logo.
  Hospital Universitario Virgen de la Victoria. M\u00e1laga\\n\\nPONENTES\\n\\nDra.
  Ana Mar\u00eda Peset Cubero\\n\\nM\u00aa Victoria Mart\u00edn\\n\\nCardi\u00f3loga.
  Consorcio Hospitalario Provincial de Castell\u00f3n\\n\\nPaciente Experto\\n\\nEste
  foro podr\u00e1 seguirse en:\\n\\nEDICI\u00d3N ONLINE EN ABIERTO\\n\\nfundaciondelcorazon.com\\n\\nEnv\u00eda
  tu pregunta en el chat habilitado\\n\\nCon la colaboraci\u00f3n de:\"", "\"TRINTXERPE:
  NUEVO SISTEMA DE RECOGIDA DE RESIDUOS:\\n\\nPROCESO DE INFORMACI\u00d3N, FORMACI\u00d3N
  Y APORTACIONES CON LA CIUDADAN\u00cdA, 2014\\n\\nHERRITARREN FORMAZIORAKO, INFORMAZIORAKO
  ETA\\n\\nEKARPENAK JASOTZEKO PROZESUA, 2014\\n\\nACTA DE LA REUNI\u00d3N\\n\\nSAIOAREN
  AKTA\\n\\nDETALLES DE LA REUNI\u00d3N/\\n\\nBILERAREN XEHETASUNAK:\\n\\nN\u00famero
  de reuni\u00f3n/Bilera zenbakia: 2\\n\\nGrupo de trabajo/Xede taldea: Grupo de castellano\\n\\nFecha/Data:
  2014-VI-26\\n\\nLugar/Lekua: Udal aretoa\\n\\nHora de inicio/Hasiera ordua: 10.30\\n\\nHora
  de finalizaci\u00f3n/Amaiera ordua: 12.55\\n\\nDINAMIZACI\u00d3N/\\n\\nDINAMIZAZIOA:\\n\\nAlcaldesa/Alkatea:
  Amaia Agirregabiria\\n\\nConcejales/Ziengotziak: Izaskun Biurrun (teniente alcalde
  de Antxo) y Miguel Mari Torre (teniente alcalde de\\n\\nTrintxerpe)\\n\\nDinamizadores/Dinamizatzaileak:
  Maitane Barrenetxea y Susana Martinez\\n\\nN\u00famero de participantes/Parte hartzaile
  kopurua: 39 personas (20 mujeres eta 19 hombres)\\n\\n1. BIENVENIDA Y PRESENTACI\u00d3N/
  ONGIETORRIA ETA AURKEZPENA\\n\\nLa alcaldesa ha dado la bienvenida a todos y todas
  las participantes, explicando las razones y objetivos de poner en marcha este proceso,
  y ha presentado las personas que constituyen la mesa desde el Ayuntamiento y la
  consultor\u00eda Aztiker.\\n\\n2. PRESENTACI\u00d3N DEL PROCESO Y LA REUNI\u00d3N/\\n\\nPROZESUAREN
  ETA BILERAREN AURKEZPENA\\n\\nLa dinamizadora de Aztiker ha hecho la presentaci\u00f3n
  del proceso, exponiendo los objetivos, grupos de trabajo, las reuniones y la metodolog\u00eda.
  Despu\u00e9s de esta primera introducci\u00f3n ha concretado la metodolog\u00eda,
  la estructura, los y las participantes y los objetivos de la sesi\u00f3n de hoy.
  Para finalizar con la presentaci\u00f3n ha mencionado algunos aspectos o normas
  a tener en cuenta en esta sesi\u00f3n de cara al reconocimiento, respeto y escucha
  mutua entre las y los reunidos hoy.\\n\\nPara finalizar se remarca la idea de que
  la primera parte es informativa, y posterior, la mayor parte de la reuni\u00f3n
  se dedicar\u00e1 a ruegos/preguntas y recogida de aportaciones y cr\u00edticas.\\n\\n3.
  INFORMACI\u00d3N SOBRE LA APLICACI\u00d3N DEL SISTEMA/\\n\\nSISTEMA EZARTZEARI BURUZKO
  INFORMAZIOA\\n\\nLa Alcaldesa y la Teniente Alcalde de Antxo han explicado el origen
  y las razones de la decisi\u00f3n tomada desde el Ayuntamiento. La Teniente Alcalde
  de Trintxerpe ha finalizado la presentaci\u00f3n  aclarando  las  caracter\u00edsticas  t\u00e9cnicas  principales  de  este  nuevo  sistema
  (fracciones, calendario de recogida, colgadores, horarios y rasgos a mejorar).\\n\\n4.\\n\\nDUDAS,
  PREGUNTAS Y APORTACIONES DE LA CIUDADAN\u00cdA/ HERRITARREN ZALANTZAK ETA KEZKAK
  KOKATZEA ETA LANTZEA\\n\\nMediante  una  ronda  abierta  se  han  recabado  las  opiniones  y  aportaciones  de  los  y  las
  ciudadanas.  Las  opiniones  de  los  y  las  participantes  se  han  recogido  en  tres  tipos  de
  aportaci\u00f3n:\\n\\n- Dudas\\n- Aportaciones y propuestas\\n- Opiniones\\n\\nLas
  representantes municipales se han encargado de responder todas las preguntas. La
  Alcalde ha respondido todas las preguntas relacionadas con la decisi\u00f3n pol\u00edtica
  y las concejales se han centrado en responder las dudas y aportaciones.\\n\\nLas
  aportaciones, propuestas y dudas recogidas durante la sesi\u00f3n, se resumen en
  los cuadros que vienen a continuaci\u00f3n:\\n\\nVALORACIONES/OPINIONES\\n\\nBALORAZIOAK/IRITZIAK\\n\\n-
  Eliminar cuanto antes el sistema de colgadores, por ser cutre y antihigi\u00e9nico.\\n-
  M\u00e1s locales, menos postes cuanto antes. Se comenta que se pueden poner pero
  si se ponen para todas las pasaitarras supone una gran inversi\u00f3n en personal
  operario. La r\u00e9plica menciona que se criterio es est\u00e9tico y que se deber\u00eda
  tener muy en cuenta.\\n\\nDUDAS/PREOCUPACIONES\\n\\nZALANTZAK/KEZKAK\\n\\n- \u00bfQu\u00e9
  m\u00e9todos de seguimiento vais a utilizar viendo la situaci\u00f3n actual, en
  la que cada cual hace lo que le da la gana con los residuos? \u00bfQu\u00e9 se har\u00e1
  con lo que se deje tirado, como hasta ahora? El sistema en s\u00ed es pedag\u00f3gico
  y implica hacer cambios en casa. No da opci\u00f3n a impunidades. En Usurbil en
  4 a\u00f1os se han puesto 0 multas. Si se da en caso de que una persona lo hace
  constantemente mal, se tomar\u00e1n medidas con dicha persona, pero se espera no
  sea necesario.\\n- \u00bfQui\u00e9n y c\u00f3mo se puede acceder al Garbitxoko?
  El Garbitxoko con operario funcionar\u00e1 de 7 a 10 de la ma\u00f1ana. El resto
  del d\u00eda ser\u00e1 un \u00e1rea de aportaci\u00f3n. No habr\u00e1 pegas para
  el acceso a toda persona que no pueda adecuarse al sistema por distintos casos (trabajo,
  personas mayores, etc. En casos puntuales se activar\u00e1 llave para un d\u00eda.\\n\\n-
  En el org\u00e1nico , \u00bfse pueden mezclar naranja y pescado? S\u00ed, no hay
  ning\u00fan problema, toda materia org\u00e1nica es mezclable.\\n- Los  contenedores  comunitarios  losa  porta  el  Ayuntamiento?
  S\u00cd,  ser\u00e1n  de  mayor  tama\u00f1o,  y  los aportar\u00e1 el ayuntamiento.\\n-
  \u00bfEst\u00e1is convencidos de lo que vais a hacer? En Usurbil no funciona. Estamos
  muy convencidos y tenemos  una  responsabilidad  que  cumplir.  Los  datos  nos  avalan,  y  en  Usurbil  en  funcionamiento  es
  totalmente normal.\\n- Las bolsas compostables, \u00bflas aporta el Ayuntamiento?
  Las bolsas las debe comprar cada una. Se puede hacer a granel, colocando una servilleta
  ene l fondo del cubo.\\n- A los garajes, tambi\u00e9n se os adjudicar\u00e1n bolsas
  y cubos? Si se pide no habr\u00e1 ning\u00fan problema.\\n- \u00a1Por  qu\u00e9  no  realizar  todo  por  medio  de  locales?  Por  qu\u00e9  ser\u00eda  necesario  poner  m\u00e1s  operarios  y
  encarecer\u00eda la recogida. Si cada cual baja en el horario que quiere, se necesitan
  24 horas de continua recogida. No ser\u00eda viable, o ser\u00eda muy caro.\\n-
  \u00bfCuando desaparecen los cubos, quien los repone? El Ayuntamiento ser\u00e1
  encargado de reponer, por medio de la oficina de informaci\u00f3n.\\n- Los habitantes
  de las calles de Donostia, podemos hacer PAP? S\u00ed, se os invitar\u00e1 v\u00eda
  carta y podr\u00e9is acudir a la oficina para apuntaros.\\n- \u00bfCu\u00e1l es
  el precio de la implantaci\u00f3n? TASAS: 2008=46,48 (60% del coste); 2013=95,92
  (83% del coste). En adelante a SAN MARCOS: 2210000; ene l 2013=782.574. Hay una
  inversi\u00f3n que se amortizar\u00e1 en 3.7 a\u00f1os. A partir de entonces habr\u00e1
  ingresos, pues el ayuntamiento vender\u00e1 el material, y se adecuar\u00e1 la tasa
  a la baja. En 4-5 a\u00f1os comenzar\u00e1 a bajar la tasa.(ver diapositiva de previsi\u00f3n
  presupuesto).\\n- \u00bfLos locales que vamos a reciclar vamos a tener bonificaci\u00f3n?
  Los locales tendr\u00e1n la tasa adecuada a su categor\u00eda y se adecuar\u00e1
  a dicha categor\u00eda, como hasta ahora.\\n- Pilas, textil, aceite, \u00bfcu\u00e1ndo
  deberemos bajarlos? Esas materias se  seguir\u00e1n bajando como hasta ahora, pues
  \u00e9se servicio no variar\u00e1.\\n- \u00bfQu\u00e9 pasa con las personas que
  pasan 6 mese fuera? \u00bfTienen que avisar sobre su ausencia, etc? No tiene que
  dar cuentas de su vida para nada. Si antes de marcharte quieres depositar los \u00faltimos
  residuos que tienes en casa, pasas por la oficina, pides la llave de entrada al
  punto, depositas cada fracci\u00f3n en su sitio y se acab\u00f3. Nadie te preguntar\u00e1
  nada de nada.\\n- \u00bfPor  qu\u00e9 no una consulta? Consulta, \u00bfsobre  qu\u00e9?
  El 5. Contenedor no  garantiza mas del  50%  del reciclado, y eso en el mejor de
  los casos (Zumaia y Zarautz de los mejores, y el mes que mas 52%). No se puede preguntar
  sobre algo que no cumple el m\u00ednimo. Es responsabilidad lo debemos desarrollar
  ysi uno de los sistemas no cumple el m\u00ednimo, no se puede plantear. Si cumpliera
  el m\u00ednimo se preguntar\u00eda.\\n- \u00bfPor qu\u00e9 no hac\u00e9is reuniones
  para educar e informar, como est\u00e1is haciendo ahora, pero con el 5. Contenedor?
  Repito que el 5. No llega al m\u00ednimo y no supera el 50%. Un proceso educativo
  voluntario no llegar\u00eda ni al 20% de la poblaci\u00f3n. Es triste, pero si no
  nos ponen multas, aparcamos en mitad de la plaza\u2026si no es obligatorio y reglado
  hoy por hoy no funciona. Ojala en unos a\u00f1os la responsabilidad ciudadana llegue
  a ser de verdad y podamos hacer todo por locales in operarios o por el 5.\\n- \u00bfSe
  puede cambiar de colgador a local? Si la decisi\u00f3n es comunitaria, s\u00ed.
  El cambio debe acordarse en la comunidad. Pero si el caso particular es de una persona
  por problemas de adecuaci\u00f3n horaria, etc. Ser\u00eda llave de garbitxoko.\\n-
  \u00bfCuando se repartir\u00e1n las fichas de colgadores? Pronto, en el m\u00e1ximo
  plazo de diez d\u00edas queremos repartirla.\\n- \u00bfLos  locales  que  saquen  el  org\u00e1nico  del  circuito,  tendr\u00e1n  descuento?
  S\u00ed,  podr\u00e1n  acceder  a bonificaciones.\\n\\n- Perros: se  han  campa\u00f1as,  multas,  etc.  No  hay  personal  suficiente  para  hacer  seguimiento.  Es
  responsabilidad ciudadana, igual que los residuos. Falta educaci\u00f3n en ello,
  y lo pagamos todos y todas. Se hace una llamada a la responsabilidad ciudadana.\\n\\nAPORTACIONES/PROPUESTAS\\n\\nEKARPENAK/PROPOSAMENAK\\n\\n-
  \u00bfUna tonelada m\u00e1s en zona Donostia de Antxo.?  Comprobar continuamente
  si hay subidas\\n- Propuesta de poner 6 meses un operario durante todo el d\u00eda,
  y hacer toda la recogida por locales.\\n- Olores: al d\u00eda de hoy los contenedores
  apestan. Azkuene es un gran ejemplo. No es preocupaci\u00f3n el sistema nuevo, no
  le parece justo que se recicla lo destrocen cuatro personas.\\n- Aclaraci\u00f3n:
  en cuanto a donde se lleva la basura (Beasain, Francia, Bilbo?): Envase ligero=
  Urnieta; papel y cart\u00f3n= pol\u00edgono 27; Vidrio= San Marcos; Org\u00e1nico=
  lapatx, Itsasu y rivera Navarra (plantas de compost).Rechazo= San Marcos (Beasain,
  Zarautz).\\n- Invita a hacer una reflexi\u00f3n: \u00bfQUE QUEREMOS DEJAR A NUESTROS
  HIJOS/AS?\\n- Se plantean ejemplos pioneros en sistemas innovadores. Europa, Catalunya,
  Oviedo\u2026no se ha inventado nada. Sistemas innovadores que est\u00e1n siendo
  premiados.\\n- Perros: adecuar papeleras para perros, con silueta pintada de uso
  exclusivo para perros.\\n\\n5. VALORACI\u00d3N DE LA REUNI\u00d3N/\\n\\nBILERAREN
  BALORAZIOA\\n\\n| Ambiente de la sesi\u00f3n Bilerako giroa | Modo de trabajo Erabilitako
  metodologia |\\n|---|---|\\n| XXXXXXXXXXXXXXXX | XXXXXXXXXXXX |\\n| XX | XX |\\n|
  X | XXX |\\n\\nLa reuni\u00f3n se ha dado por finalizada en Trintxerpe, el 26 de
  Junio del 2014, a las 10.30\\n\\nPR\u00d3XIMA REUNI\u00d3N:\\n\\nFECHA: 26 de Junio\\n\\nLUGAR:
  Local Municipal\\n\\n19 horas\\n\\nHORA:\"", "\"LA MUERTE TEN\u00cdA UN PRECIO\\n\\nY
  era bastante, la verdad. Entre el nicho que pagaron hace la tira de a\u00f1os, la
  incineraci\u00f3n, las misas y todos los jaleos de las herencias, no d\u00e1bamos
  abasto para entristecernos. Encima hab\u00eda un sol tremendo para octubre, y estaba
  realmente ocupada. Ya llorar\u00eda en invierno, pens\u00e9. Ten\u00eda demasiado
  que hacer. Como pienso mucho, me hab\u00eda dado cuenta que en los funerales siempre
  est\u00e1 el familiar destrozado y el que parece que est\u00e1 m\u00e1s entero,
  recibiendo a los visitantes y encarg\u00e1ndose de los tr\u00e1mites. Ser\u00e9
  ese, y ya est\u00e1, alguien tiene que hacerlo. As\u00ed que segu\u00ed adelante,
  y pas\u00e9 el oto\u00f1o y el invierno, y como siempre, cuando ya estaba preparada
  para asumir el dolor, ya no quedaba nadie para compartirlo. Y mira que aviso a mis
  amigos, que la pena me hunde cuando pasan unos meses, que de primeras parezco fuerte
  pero no. De nuevo sola, a\u00f1orando llamadas telef\u00f3nicas a una persona que
  ya no me pod\u00eda contestar. He aprendido muchos recursos para distraer mi mente
  y poder seguir adelante. Si me conoces bien, quiz\u00e1 reconozcas los s\u00edntomas:
  o\u00edr m\u00fasica a todas horas, leer a todas horas, ocupar todas las horas en
  actividades que no permitan pensar. Porque si, de repente en un sem\u00e1foro, tu
  mente queda libre, quiz\u00e1 ya no la recupere nunca m\u00e1s. Y despu\u00e9s de
  conducir llorando un rato, y decidir parar en cualquier pueblo, y que te rescate
  un pastor de ovejas en un camino al que no recuerdas como llegaste, sabes que has
  llegado al l\u00edmite.\\n\\nEsa noche, al llegar a casa, marqu\u00e9 su n\u00famero
  en el m\u00f3vil. Llamar a un muerto creo que es la forma m\u00e1s significativa
  de la fase de negaci\u00f3n en un proceso de luto. Que te responda una voz muy parecida
  a la que perdiste no s\u00e9 qu\u00e9 fase es. Y que te consuelen mientras hipas
  como una hist\u00e9rica un \\\"\u00bfC\u00f3mo te has atrevido a dejarme?\\\", tranquiliz\u00e1ndote
  y dejando que llores\u2026 Pues qu\u00e9 voy a decir, para ser un fantasma no estaba
  nada mal. Quiz\u00e1 en ese a\u00f1o que llevaba muerto se hab\u00eda metido a psic\u00f3logo
  o algo. Al menos me escuch\u00f3 mucho mejor que cuando estaba vivo.\\n\\nEsa noche
  dorm\u00ed tan bien que al d\u00eda siguiente le volv\u00ed a llamar. Charlamos
  m\u00e1s tranquilos, el m\u00e1s all\u00e1 no estaba nada mal pero no sab\u00eda
  cu\u00e1nto tiempo le dejar\u00edan mantener la l\u00ednea con los vivos. Le cont\u00e9
  mis d\u00edas, mis nuevas rutinas sola, los amigos que me quedaban. Desde el principio
  me insisti\u00f3 en que en alg\u00fan momento no podr\u00eda contestarme. Ten\u00eda
  que aprender a resolver mis problemas, no era necesario contarle absolutamente todo
  lo que hac\u00eda. Y como reconozco mis adicciones, me obligu\u00e9 a restringir
  mis llamadas.\\n\\nMe pasaron cosas duras, sinceramente. La vida no deber\u00eda
  sentirse en la obligaci\u00f3n de ser tan puta, al fin y al cabo, es la muerte la
  que ten\u00eda un precio. Miraba mi tel\u00e9fono y no ten\u00eda la certeza de
  que \u00e9l pudiera contestarme. As\u00ed que empec\u00e9 a no llamar, no por fuerza
  de voluntad, m\u00e1s bien por la cobard\u00eda de que en ese momento no me respondiera.
  Pens\u00e9 en recurrir a otros amigos, pero me pareci\u00f3 poco \u00e9tico emplearles
  como sustitutos. Llor\u00e9 mucho, hasta que el impulso de buscar su nombre se fue
  perdiendo. Casi pude hasta olvidarme del m\u00f3vil, hab\u00eda hablado tanto con
  \u00e9l que ya no me apetec\u00eda decir nada a otra persona. Pasaron d\u00edas
  enteros sin recordarle, tan buenos que me hubiera encantado llamarle para compartirlos
  con \u00e9l. Pude vivir, no s\u00e9 c\u00f3mo, pero lo hice.\\n\\nY despu\u00e9s
  de muchos, muchos a\u00f1os, iba conduciendo de noche y se me junt\u00f3 el cansancio,
  la niebla y una curva dif\u00edcil. Perd\u00ed el control, vi c\u00f3mo me precipitaba
  fuera de la carretera, y a\u00fan me dio tiempo a escuchar mi m\u00f3vil. Era \u00e9l.
  Sonre\u00ed.\"", "\"UNIVERSIDADES P\u00daBLICAS DE LA COMUNIDAD DE MADRID\\n\\nPRUEBA
  DE ACCESO A LAS ENSE\u00d1ANZAS UNIVERSITARIAS OFICIALES DE GRADO\\n\\nCurso 2009-2010\\n\\nMATERIA:  ECONOM\u00cdA
  DE LA EMPRESA\\n\\nINSTRUCCIONES Y CRITERIOS GENERALES DE CALIFICACI\u00d3N\\n\\n1.
  Lea todas las cuestiones cuidadosamente.\\n2. Elija la opci\u00f3n (A o B) para
  la que considere que se encuentra mejor preparado/a.\\n3. Conteste \u00fanicamente
  a las cuestiones de la opci\u00f3n que haya elegido.\\n4. Recuerde que es muy importante
  demostrar seguridad en sus respuestas y procure expresarse con la mayor claridad
  posible.\\n6. Preste mucha atenci\u00f3n para no cometer faltas ortogr\u00e1ficas.\\n5.
  Cada pregunta va acompa\u00f1ada por la puntuaci\u00f3n m\u00e1xima que se puede
  alcanzar en caso de contestarla correctamente.\\n\\nTIEMPO: Una hora y treinta minutos.\\n\\nOPCI\u00d3N
  A\\n\\n1. Seg\u00fan mandato de la normativa contable, las cuentas anuales se elaborar\u00e1n,
  generalmente, con una periodicidad de 12 meses. Enumere brevemente los documentos
  que integran las citadas cuentas anuales (1 punto).\\n2. Se\u00f1ale y explique
  la clasificaci\u00f3n de las empresas seg\u00fan la titularidad de su capital (1
  punto).\\n3. Defina qu\u00e9 se entiende por entorno gen\u00e9rico y entorno espec\u00edfico
  en una empresa (1 punto). Ponga dos ejemplos de cada uno de ellos y justifique su
  inclusi\u00f3n en dichos entornos (1 punto).\\n4. Clasifique y explique los recursos
  financieros de la empresa, tanto a largo plazo (1 punto) como a corto plazo (1 punto).\\n5.
  Una empresa dedicada a la comercializaci\u00f3n de electrodom\u00e9sticos presenta
  la siguiente informaci\u00f3n obtenida de sus cuentas anuales representativas del
  \u00faltimo ejercicio econ\u00f3mico, expresada en unidades monetarias: clientes
  3.000; proveedores 2.600; acreedores por prestaci\u00f3n de servicios 1.500; amortizaci\u00f3n
  acumulada 400; bancos c/c 250; mobiliario 1.300; elementos de trasporte 5.000; caja
  50; mercader\u00edas 2.800; deudas a corto plazo con entidades de cr\u00e9dito 3.000;
  equipos inform\u00e1ticos 1.100; deudas a largo plazo con entidades de cr\u00e9dito
  3.000; capital 2.000; resultado del ejercicio a determinar. Se pide:\\na) Presentar
  el balance final de situaci\u00f3n y calcular el resultado del ejercicio (1 punto).\\nb)
  Calcular el ratio de solvencia (Activo Corriente/Pasivo Corriente) y comentar el
  resultado obtenido (0,5 puntos).\\nc) Calcular la rentabilidad financiera o de los
  fondos propios (0,5 puntos).\\n6. Una empresa dispone de los siguientes datos sobre
  dos inversiones A y B, cuya duraci\u00f3n es de 2 a\u00f1os: desembolso inicial
  de la inversi\u00f3n A: 60.000 euros, flujos de caja de la inversi\u00f3n A: 35.000
  euros durante el primer a\u00f1o y 50.000 durante el segundo; desembolso inicial
  de la inversi\u00f3n B: 70.000 euros, flujos de caja de la inversi\u00f3n B: 30.000
  euros durante el primer a\u00f1o y 50.000 durante el segundo. El coste del dinero
  es del 7% anual.\\na) Calcule el Valor Actual Neto (VAN) de la inversi\u00f3n A
  (0,75 puntos).\\nb) Calcule el VAN de la inversi\u00f3n B (0,75 puntos).\\nc) Justifique
  cu\u00e1l de las dos inversiones llevar\u00eda a cabo (0,5 puntos).\\n\\nFASE GENERAL\\n\\nOPCI\u00d3N
  B\\n\\n1. Muestre las distintas opciones de crecimiento de una empresa, a trav\u00e9s
  de la matriz mercado/producto (1 punto).\\n2. Explique en qu\u00e9 consiste la tarea
  directiva (1 punto).\\n3. Defina la segmentaci\u00f3n de mercados y explique para
  qu\u00e9 se segmenta un mercado (1 punto). Indique si el mercado inmobiliario est\u00e1
  segmentado. En caso afirmativo, indique algunas variables por las que est\u00e1
  segmentado y ponga algunos ejemplos que justifiquen su opini\u00f3n (1 punto).\\n4.
  Explique c\u00f3mo afectar\u00e1n al periodo medio de maduraci\u00f3n de un fabricante
  de autom\u00f3viles los siguientes cambios: (a) una reducci\u00f3n en el n\u00famero
  de aver\u00edas experimentadas por los robots utilizados en la f\u00e1brica (0,5
  puntos); (b) una reducci\u00f3n de la demanda de autom\u00f3viles debida a la recesi\u00f3n
  econ\u00f3mica (0,5 puntos); (c) un aumento en el porcentaje de clientes que compran
  los autom\u00f3viles a plazos  (0,5 puntos); (d) una mejora de la cualificaci\u00f3n
  de los empleados, que tiene como resultado una mayor rapidez en la toma de decisiones
  (0,5 puntos).\\n5. Una empresa dispone de la siguiente estructura de costes mensuales:\\n*
  Materias primas: 14 \u20ac por unidad producida.\\n* Salarios: 6.000 \u20ac.\\n*
  Gastos financieros: 250 \u20ac.\\n* Amortizaci\u00f3n de la maquinaria: 150 \u20ac.\\n*
  Otros costes: 2 \u20ac por unidad producida.\\n\\nEl precio al que vende cada unidad
  de producto es de 20 \u20ac.\\n\\nDetermine:\\n\\na) La cantidad de producto que
  deber\u00eda vender mensualmente para situarse en su umbral de rentabilidad o punto
  muerto (1 punto).\\nb) Coste total medio para dicha producci\u00f3n (0,5 puntos).\\nc)
  Coste marginal (0,5 puntos).\\n6. Una empresa tiene el derecho a cobrar 18.000 \u20ac
  dentro de seis meses. Los 18.000 \u20ac son el valor nominal de una letra de cambio
  que se descuenta en una entidad financiera con un tipo de descuento del 4% anual.\\na)
  Calcule el dinero en efectivo recibido por la empresa que descuenta la letra de
  cambio (1 punto).\\nc) \u00bfPor qu\u00e9 la entidad financiera descuenta una cantidad
  de dinero al valor nominal de la letra? (0,25 puntos).\\nb) \u00bfA cu\u00e1nto
  ascienden los intereses en euros que descuenta la entidad financiera? (0,75 puntos).\\n\\nECONOM\u00cdA
  DE LA EMPRESA\\n\\nCRITERIOS ESPEC\u00cdFICOS DE CORRECCI\u00d3N Y CALIFICACI\u00d3N\\n\\nOPCI\u00d3N
  A\\n\\n1. El alumno debe conocer las obligaciones contables referentes a la informaci\u00f3n
  anual que presenta la nueva legislaci\u00f3n mercantil.\\n2. El alumno debe conocer
  los criterios de clasificaci\u00f3n de empresas seg\u00fan la titularidad de su
  capital.\\n3. El alumno debe conocer el concepto de entorno en una empresa y los
  diferentes tipos de entorno que se pueden dar.\\n4. El alumno debe clasificar y
  explicar los recursos financieros de la empresa a los distintos plazos.\\n5. El
  alumno debe distinguir las distintas masas que componen el patrimonio empresarial
  y aplicar dicho conocimiento al c\u00e1lculo del ratio de solvencia y de rentabilidad
  financiera, razonando su significado.\\n6. El alumno debe saber utilizar el criterio
  del Valor Actual Neto y valorar las inversiones, interpretando los resultados.\\n\\nOPCI\u00d3N
  B\\n\\n1. El alumno debe conocer las distintas opciones de crecimiento de una empresa
  a trav\u00e9s de la matriz mercado/producto.\\n2. El alumno debe saber explicar
  en qu\u00e9 consiste la tarea directiva.\\n3. El alumno debe tener conocimientos
  sobre el an\u00e1lisis del mercado y c\u00f3mo se puede analizar el mismo mediante
  la segmentaci\u00f3n.\\n4. El alumno debe comprender qu\u00e9 es el periodo medio
  de maduraci\u00f3n de una empresa y c\u00f3mo se ve afectado por diferentes factores
  que pueden incidir en \u00e9l.\\n5. El alumno debe conocer y saber utilizar los
  conceptos de costes, ingresos y beneficios para calcular los resultados de una empresa,
  as\u00ed como los determinantes de su umbral de rentabilidad o punto muerto.\\n6.
  El alumno debe conocer el concepto de descuento de letras de cambio y c\u00f3mo
  se calcula.\"", "\"\\\"Decenio de la Igualdad de Oportunidades para mujeres y hombres\\\"
