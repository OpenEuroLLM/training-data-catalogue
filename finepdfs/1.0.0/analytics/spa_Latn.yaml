sample: '["\"ASISTENTES\\n\\nPALACIOS BERNAL, C.\\n\\n(Vicerrectora de Estudios)\\n\\nARNEDO
  MART\u00cdNEZ, F. M.\\n\\n(Jefe de Secci\u00f3n de Posgrado)\\n\\nB\\n\\nASTIDA\\n\\n,
  J.\\n\\n(Prsidenta de la Comisi\u00f3n de Ingenier\u00eda y Arquitectura)\\n\\nANTOS\\n\\nC\\n\\n,
  P.\\n\\n(Presidente de la Comisi\u00f3n de Humanidades) L\u00d3PEZ, C.\\n\\n(Secretaria
  de la Comisi\u00f3n de Ciencias)\\n\\nM\\n\\nADRID\\n\\n, J.\\n\\n(Secretaria de
  la Comisi\u00f3n de CC. de la Salud) SOLANES, J.\\n\\n(Presidente de la Comisi\u00f3n
  de Ciencias\\n\\nSociales y Jur\u00eddicas)\\n\\nA\\n\\nBAD\\n\\nM\\n\\nERINO,\\n\\nM.\\n\\n(Coordinadora
  de Posgrado)\\n\\nACTA DE LA REUNI\u00d3N DE LA COMISI\u00d3N GENERAL DE DOCTORADO,
  REALIZADA EL D\u00cdA 12 DE JUNIO DE 2009\\n\\nEn Murcia, a las 9.30 horas del d\u00eda
  12 de junio de 2009, se re\u00fane la Comisi\u00f3n General de Doctorado en el Vicerrectorado
  de Estudios, con la asistencia de los miembros rese\u00f1ados al margen.\\n\\nPreside
  la reuni\u00f3n la Vicerrectora de Estudios, D\u00f1a. Concepci\u00f3n Palacios
  Bernal, y act\u00faa como secretaria D\u00f1a. Mercedes Abad Merino, Coordinadora
  de Posgrado.\\n\\nAntes de empezar con el orden del d\u00eda, la Vicerrectora solicita
  que se incluyan dos nuevos puntos en el orden del d\u00eda (6 y 7), pues hay algunos
  asuntos que han llegado despu\u00e9s de hacer p\u00fablica la convocatoria. Se acepta.\\n\\n1.
  Aprobaci\u00f3n del acta de la sesi\u00f3n anterior (13 de marzo de 2009)\\n\\nSe
  aprueba.\\n\\n2. Informe\u00a0de\u00a0la\u00a0Sra.\u00a0Vicerrectora.\\n\\nLa\u00a0Vicerrectora\u00a0pone\u00a0en\u00a0conocimiento\u00a0de\u00a0la\u00a0Comisi\u00f3n\u00a0una\u00a0cuesti\u00f3n\u00a0que\u00a0es\u00a0previsible\u00a0que
  llegue,\u00a0 en\u00a0 un\u00a0 tiempo,\u00a0 a\u00a0 la\u00a0 dicha\u00a0 Comisi\u00f3n.\u00a0
  Se\u00a0 trata\u00a0 de\u00a0 un\u00a0 recurso\u00a0 que\u00a0 se\u00a0 ha\u00a0
  presentado\u00a0 a\u00a0 una Comisi\u00f3n\u00a0Acad\u00e9mica\u00a0de\u00a0Doctorado,\u00a0por\u00a0parte\u00a0de\u00a0una\u00a0profesora\u00a0que\u00a0quiere\u00a0dirigir\u00a0una\u00a0Tesis\u00a0a\u00a0un
  alumno\u00a0 de\u00a0 ese\u00a0 Programa\u00a0 de\u00a0 Doctorado,\u00a0 pero\u00a0
  que\u00a0 no\u00a0 forma\u00a0 parte\u00a0 del\u00a0 Programa.\u00a0 La\u00a0 Comisi\u00f3n
  resolvi\u00f3\u00a0que\u00a0pod\u00eda\u00a0dirigir\u00a0la\u00a0Tesis\u00a0pero\u00a0con\u00a0codirecci\u00f3n\u00a0de\u00a0un\u00a0profesor\u00a0del\u00a0programa,\u00a0soluci\u00f3n\u00a0que
  la\u00a0 profesora\u00a0 no\u00a0 acepta.\u00a0 Ahora\u00a0 mismo\u00a0 est\u00e1\u00a0
  en\u00a0 los\u00a0 servicios\u00a0 jur\u00eddicos,\u00a0 pero\u00a0 llegar\u00e1\u00a0
  a\u00a0 la\u00a0 Comisi\u00f3n General\u00a0de\u00a0Doctorado\u00a0al\u00a0final\u00a0del\u00a0proceso.\\n\\nPor\u00a0este\u00a0tipo\u00a0de\u00a0cuestiones,\u00a0se\u00a0deber\u00eda\u00a0hacer\u00a0una\u00a0recomendaci\u00f3n\u00a0a\u00a0todas\u00a0las\u00a0Comisiones\u00a0de
  Doctorado\u00a0 para\u00a0 que\u00a0 pidieran\u00a0 como\u00a0 requisito\u00a0 de\u00a0
  admisi\u00f3n\u00a0 en\u00a0 sus\u00a0 programas\u00a0 de\u00a0 Doctorado\u00a0
  la aceptaci\u00f3n\u00a0del\u00a0director\u00a0de\u00a0la\u00a0tesis.\\n\\nInforma\u00a0tambi\u00e9n\u00a0de\u00a0la\u00a0convocatoria\u00a0de\u00a0ayudas\u00a0para\u00a0la\u00a0movilidad\u00a0de\u00a0estudiantes\u00a0en\u00a0estudios
  de\u00a0doctorado\u00a0con\u00a0Menci\u00f3n\u00a0de\u00a0Calidad\u00a0para\u00a0el\u00a0curso\u00a02008\u20102009.\\n\\n3.
