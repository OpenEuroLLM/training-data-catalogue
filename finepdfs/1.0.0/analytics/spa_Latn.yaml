  por The Creative Studio at Deloitte, London. J8287\"", "\"Lineamientos para elaborar
  un plan de abandono de tanques de almacenamiento de combustibles l\u00edquidos de
  consumidor directo para empresas de transporte en el Subsector Transportes\\n\\nDirecci\u00f3n
  General de Asuntos Socio-Ambientales Ministerio de Transportes y Comunicaciones\\n\\n21
  de julio de 2008\\n\\nJr. Zorritos 1203, Lima, Per\u00fa.\\n\\nTel\u00e9fono: (052)-(01)
  615-7800, anexo 1202.\\n\\nCorreo-e: firstname.lastname@example.org\\n\\nWeb: www.mtc.gob.pe\\n\\nAprobado
  por RD N\u00b0 010-2007-MTC/16 del 23 de enero de 2007\\n\\nEdici\u00f3n: 21 de
  julio de 2008\\n\\n\u00cdndice\\n\\nLineamientos para elaborar un plan de abandono
  de tanques de almacenamiento de combustibles l\u00edquidos de consumidor directo
  para empresas de transporte en el\\n\\nSubsector Transportes\\n\\nLa elaboraci\u00f3n
  del presente documento tiene como \ufb01nalidad brindar los lineamientos no restrictivos
  para el desarrollo del Plan de Abandono de Tanques de Almacenamiento de Combustibles
  liquidas. A continuaci\u00f3n se se\u00f1alan dichos Lineamientos:\\n\\nContenido
  del plan de abandono de\ufb01nttivo de tanques de almacenamiento de combustibles
  l\u00edquidos\\n\\nCap\u00edtulo I: Introducci\u00f3n y aspectos generales\\n\\nEl
  Plan de Abandono es un conjunto de actividades destinadas a la prevenci\u00f3n de
  la contaminaci\u00f3n de los elementos s\u00f3lidos, l\u00edquidos y gaseosos a
  corto, mediano y largo plazo, generados como resultado del cese de\ufb01nitivo de
  las actividades inherentes al manejo del tanque de almacenamiento durante su etapa
  de operaci\u00f3n. De esta forma las \u00e1reas utilizadas en la etapa de funcionamiento
  del tanque de almacenamiento que se abandonen deberan de ser recuperadas o mejoradas
  incluyendo el \u00e1rea de in\ufb02uencia directa y ser\u00e1 el titular de la actividad
  por cesar el responsable de ello\\n\\nAdem\u00e1s el Plan de Abandono debe incorporar
  medidas orientadas a prevenir y/o mitigar impactos ambientales, riesgos ambientales,
  para que \ufb01nalmente el \u00e1rea ocupado por los tanques no signi\ufb01que un
  riesgo a la salud y seguridad humana.\\n\\nAdem\u00e1s el lugar ocupado por los
  tanques, debera cumplir con los requerimientos de uso del terreno de parte de autoridades
  municipales y/o gubernamentales y que cumpla con todos las lineamientos establecidos\\n\\nCap\u00edtulo
  II: Ubicaci\u00f3n del proyecto\\n\\nSe deber\u00e1 de consignar el t\u00edtulo
  del proyecto, ubicaci\u00f3n y \u00e1rea exacta del mismo y de su \u00e1rea de in\ufb02uencia
  directa, se\u00f1alizada en un mapa en coordenadas UTM y con su leyenda correspondiente.\\n\\nCap\u00edtulo
  III: Marco legal\\n\\nEn este apartado se describir\u00e1n las disposiciones de
  aspecto pol\u00edtico y legal (normas, leyes, ordenanzas, etc.) aplicables al proyecto
  propuesto, en especial los emitidos por las autoridades sectoriales y locales competentes\\n\\nCap\u00edtulo
  IV: Objetivos\\n\\nSe deber\u00e1 identi\ufb01car de manera clara el objetivo general
  y los objetivos especi\ufb01cos, ligados al proyecto y a su \u00e1rea de in\ufb02uencia,
  as\u00ed como a las metas de desarrollo que eventualmente se puedan haber planteado.\\n\\nCap\u00edtulo
  V: Descripci\u00f3n de la actividad desarrollada\\n\\nDescripci\u00f3n cada una
  de las etapas realizadas para el retiro y/o demolici\u00f3n de la infraestructura
  civil, el\u00e9ctrica, mec\u00e1nica, industrial y de instalaciones sanitarias que
  conforman las instalaciones del proyecto, considerando para ello las actividades
  de:\\n\\nDisposici\u00f3n de equipos, maquinarias utilizadas para el procedimiento.\\nVaciando
  y limpieza de tanques y/o pozas.\\nEstabilizaci\u00f3n y recuperaci\u00f3n del suelo
  y dise\u00f1o de la cobertura \ufb01nal seg\u00fan sea el caso.\\nControl de gases
  y lixiv\u00edados. Desgasi\ufb01caci\u00f3n de gases, incluido un programa de monitoreo
  durante dicho proceso.\\nCerrado y/o destrucci\u00f3n de edi\ufb01caciones involucradas.\\nLimpieza
  y traslado de escombros, entre otros\\n\\nCap\u00edtulo VI: Impactos ambientales
  asociados al abandono\\n\\nEl objetivo del desarrollo de este cap\u00edtulo es identi\ufb01car
  y analizar los impactos ambientales potenciales que podr\u00edan generarse por la
  puesta en marcha de las actividades de Abandono del proyecto Asimismo se\u00f1alar
  y describir la metodolog\u00eda empleada para la identi\ufb01caci\u00f3n y el an\u00e1lisis
  de los impactos ambientales.\\n\\nCap\u00edtulo VII: Control ambiental en las etapas
  de abandono\\n\\nEn este cap\u00edtulo se describir\u00e1 la manera como el interesado
  establecer\u00e1 prioridades y responder\u00e1 a los impactos y de\ufb01ciencias
  mas serias producto de la desinstalaci\u00f3n y desmontaje de los tanques, para
  esto se especi\ufb01car\u00e1 las medidas de control ambiental y de seguridad adoptadas
  para minimizar los efectos negativos por causa de impactos potenciales.\\n\\nPor
  otro lado se describir\u00e1n las estrategias para el manejo integral de los residuos
  s\u00f3lidos y l\u00edquidos domiciliarios y peligrosos generados (borras, trapos
  y/o waypes impregnados con hidrocarburos, latas, envases contaminados, pilas, baterias,
  etc), incluyendo para ello las etapas de recolecci\u00f3n, transporte y disposici\u00f3n
  \ufb01nal antes, durante y despu\u00e9s de las ejecuci\u00f3n del Abandono\\n\\nCap\u00edtulo
  VIII: Plan de monitoreo\\n\\nEste cap\u00edtulo tiene como meta de\ufb01nir las
  caracter\u00edsticas f\u00edsico\u2013qu\u00edmicas del \u00e1rea donde estaban
  instalados el o los tanques y su entorno, detectar cambios en\\n\\nlos niveles de
  la calidad del suelo para identi\ufb01car posibles impactos ambientales y su variaci\u00f3n
  en el tiempo.\\n\\nPara esto se deber\u00e1 incluir el dise\u00f1o del programa
  de monltoreo.\\nSelecci\u00f3n de par\u00e1metros de monitoreo para evaluar calidad
  del suelo y del aire.\\nSelecci\u00f3n de puntos de monitoreo.\\nFrecuencia de las
  mediciones y la metodolog\u00eda de los an\u00e1lisis.\\nIdenti\ufb01car la empresa
  que realizar\u00e1 el monitoreo\\n\\nCap\u00edtulo IX: Plan de contingencia\\n\\nEste
  es un Plan que consignar\u00e1 un conjunto de acciones destinadas a prevenir y contrarrestar
  las emergencias y accidentes que eventualmenle pudiesen afectar ai ambiente, a propiedad
  de terceros o a los trabajadores, como resultado de las actividades derivadas de
  la desinstalaci\u00f3n y desmontaje de los tanques de almacenamiento.\\n\\nLas emergencias
  pueden incluir:\\n\\nAccidentes laborales.\\nExplosiones y/o incendios.\\nEmisiones
  t\u00f3xicas o vahos.\\nRotura de tuber\u00edas, etc.\\n\\nEstablecer procedimientos
  y acciones a tomar cuando ocurran dichas emergencias, as\u00ed como incluir lista
  de hospitales, bomberos.\\n\\nCap\u00edtulo X: Evaluaci\u00f3n de riesgo y seguridad\\n\\nElaborar
  una evaluaci\u00f3n de Riesgo y Seguridad, donde se se\u00f1ale las posibles causas
  que pueden originar riesgos o siniestros en el proceso de desinstalaci\u00f3n de
  la Infraestructura instalada.\\n\\nCap\u00edtuloXI: Presupuesto del plan de abandono\\n\\nSe
  deber\u00e1 establecer un Programa y/o cronograma de trabajo para la ejecuci\u00f3n
  del Plan de Cierre, acompa\u00f1ado de un Programa de inversiones, donde se detalle
  las medidas concretas que se adoptar\u00e1n, as\u00ed como los presupuestos que
  se asignar\u00e1n para las medidas de prevenci\u00f3n y mitigaci\u00f3n durante
  la ejecuci\u00f3n del proyecto.\\n\\nCap\u00edtulo XII: Responsabilidad\\n\\nEl
  Titular del proyecto ser\u00e1 responsable de la ejecuci\u00f3n del Plan de Abandono,
  as\u00ed como del monitoreo y ejecuci\u00f3n de las actividades correspondientes
  al Post Abandono (como por ejemplo programa de arborizaci\u00f3n, revegetaci\u00f3n,
  etc) y del cumplimiento de las directivas emitidas al respecto por la autoridad
  competente. Dicha responsabilidad se extender\u00e1 hasta un a\u00f1o calendario
  despu\u00e9s de llevarse a cabo la ejecuci\u00f3n de dicho Plan.\\n\\nCap\u00edtulo
  XIII: Conclusiones y recomendaciones\\n\\nAnexos\\n\\nIncluye material fotogr\u00e1\ufb01co,
  plano de ubicaci\u00f3n, plano de instalaciones y distribuci\u00f3n de los mismos,
  entre otros documentos relevantes, se\u00f1alar el responsable de la elaboraci\u00f3n
  del Plan de Abandono, resultados del an\u00e1lisis del monitoreo ambiental de suelos,
  aire y agua, sustentados con resultados de laboratorios acreditados.\\n\\nPresentaci\u00f3n\\n\\nEl
  documento deber\u00e1 ser presentado en versi\u00f3n magn\u00e9tica e impreso en
  formato A4, con tipo de letra Arial tama\u00f1o 11, todas las p\u00e1ginas deben
  estar foliadas. El documento debe contener un \u00edndice incluy\u00e9ndose por
  separado un listado de cuadros y \ufb01guras numeradas. Debe presentarse dos juegos
  del Plan de Cierre y un CD.\\n\\nEl presente documento deber\u00e1 estar elaborado
  por un profesional en Ingiener\u00eda que est\u00e9 Colegiado y Habilitado.\"",
