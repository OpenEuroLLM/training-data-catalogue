  soportes.Debidoaldi\u00e1metromayordelconductorACSRsepuede obtenerun l\u00edmitededescargaluminosamuchomayor,loqueresulta
  ventajosoenl\u00edneassuspendidasdealtaymuyaltatensi\u00f3n.\\n\\nLos conductores
